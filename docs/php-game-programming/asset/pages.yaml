  md: "out functions you would be forced to rewrite large chunks of your program every\
    \ time you needed to repeat an operation. Without functions you would most likely\
    \ go insane or at least you would not be coding.\n\nFunctions often take multiple\
    \ parameters; a parameter is nothing more than a localized variable that the function\
    \ will operate on. These parameters allow you to pass data in and out of your\
    \ functions. But a function does not have any parameters at all. Suppose you have\
    \ a function to write out the header of your HTML document; it would look something\
    \ like this:\n\n```\nfunction WriteHTMLHeader() {\n  echo(\"HTML\\n\");\n  echo(\"\
    <HEAD><TITLE>My Application</TITLE></HEAD>\\n\");\n  echo(\"<BODY bgcolor=\\#ffffff>\\\
    n\");\n}\n```\n\nYou declare functions using the keyword function followed by\
    \ the name you want for the function. In the above example name the function is\
    \ WriteHTMLHeader. Technically this function will not do anything at all until\
    \ you invoke it from another point in the code. To invoke a function, you simply\
    \ call it by name followed by any parameters it has. If the function doesn't have\
    \ parameters, you simply leave the parentheses blank. Here is an example of calling\
    \ the WriteHTMLHeader function.\n\n```\n// code here\nWriteHTMLHeader();\n// more\
    \ code\n```\n\nYou could call this function several times in a row if you like\
    \ and it would print the HTML header to the browser every time.\n\n# Passing Parameters\
    \ to a Function\n\nPassing parameters to a function is extremely simple. All you\
    \ need to do is declare a variable for each parameter you want to receive. For\
