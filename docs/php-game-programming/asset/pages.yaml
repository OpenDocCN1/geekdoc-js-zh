    The second way to fill an object in Flash is to use the SWFGradient() class. This
    class allows you to fill an area with a gradient fill. Once you create an instance
    of the SWFGradient() class you can add a fill entry to it using the addEntry()
    function.


    The `addEntry()` function takes five arguments. The first argument is a ratio
    value that can be between 0.0 and 1.0. This ratio specifies where in the gradient
    color should occur. Usually when you are adding a gradient fill, you will add
    two entries to the object. The first color will be the 0.0 ratio and the second
    color will be the 1.0 value for the ratio.


    Can you tell what the next three arguments are? That''s right, they are the red,
    green and blue components of the color. The fifth argument is an optional argument
    where you can specify the channel for the color.


