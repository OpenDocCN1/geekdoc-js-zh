- img_proc: true
  md: '# Using Existing Images


    I mentioned earlier in this chapter that the ImageCopyResized() function and the
    ImageCopyResampled() function do the same thing. Well, technically they do the
    same thing, but with one minor difference. After the ImageCopyResampled() function
    copies and resizes the image, it resamples it. The results are a crisper, cleaner
    image. In the upcoming code example you will resize the image using ImageCopyResized()
    and then ImageCopyResampled(). After they are resized you will save them and compare
    the results.


    ```

    <?php

    // Get our image resources

    $image = ImageCopyFromJpeg("frameDragon.jpg");


    // Create a true color 100x100

    $thumb = ImageCreateTrueColor(250, 250, 250);

    $thumb2 = ImageCreateTrueColor(250, 250, 250);


    // Copy dragon onto frame

    ImageCopyResized($thumb, $image, 0, 0, 0, 0, 250, 250, ImagesX($image),

    YY($image));

    ImageCopyResampled($thumb2, $image, 0, 0, 0, 0, 250, 250, ImagesX($image),

    YY($image));

    ```


    ```

    // Save the image and show it

    Imagejpeg($thumb, "thumbFrameDragon1.jpg");

    Imagejpeg($thumb2, "thumbFrameDragon2.jpg");

    ```


    echo("<img src="thumbFrameDragon1.jpg&nbsp;&nbsp;<img src="thumbFrameDragon2.jpg">\n?>


    The results of the code example are shown in Figure 8.19.


    The difference is noticeable. The top image is one made with ImageCopyResized().
    It has a bit of artifacts and quite grainy compared to the bottom image, which
    was created with ImageCopyResampled().


    So why you ever use ImageCopyResized()? Well, the only reason I can think of is
    speed. Since you aren''t batching a ton of images at once, you might as well use
    the ImageCopyResampled() function whenever speed isn''t a concern. After all,
    do you want to get the best results you possibly can.


    The final function to look at is the ImageCopyMerge() function. This function
    behaves exactly like the ImageCopy() function with one very key difference. The
    extra parameter (int percent) tells you how opaque the image should be on the
    destination image. It allows you to create some cool backgrounds or translucent
    images.'
  merge: -1
  pgno: 205
- img_proc: true
