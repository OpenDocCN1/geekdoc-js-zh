  md: '# Chapter 11 ■ Kiddy Cartel—Creating Your Own MMO


    This function is much more straightforward than a class with sub-commands. The
    Execute() function takes the arguments you want to update. In this case, since
    you are adding weapons to your player, it needs to take a player name, the number
    of water balloons to add, the number of slingshots to add.


    The Execute() function starts off making sure the variables are integers. Then
    it tries to connect to the database. If the Execute() function cannot connect
    to the database then an error has occurred and you need to let the user know what
    has happened. The Execute() function connected to the database successfully then
    you can update the record. The $db variable is using the PEAR API to connect to
    the database. The PEAR API contains a member function called Query() that will
    execute the query you specify. If an error occurs during execution you will need
    to call the OnRollBack() function. Otherwise you update the players'' stats and
    return back to the game so it can re-render the page.


    The OnRollBack() function attempts to connect to the database. After the OnRollBack()
    function has successfully connected to the database it attempts to update the
    database back to the original values that the player had before the query failed.
    If anything in the OnRollBack() fails there aren''t too much you can do.


    # Look at All the Commands...Now What?


    Now that you know how to create your commands, you need a way to access them through
    the game structure. You will need to create something called a command factory.
    The command factory class contains a single function called CreateCommand(). The
    command factory class also has a require_once() reference to every single command
    class that you have created. The command factory class will enable you to create
    a command-based on the query string. When you click on a link that triggers an
    action and you need to tell the game what type of action you will be starting,
    do this through the query string. Take a look at the CommandFactory() class.


    ```

    <?

    /*

    You should require_once() all source files containing

    commands you want instantiated using the factory. The

    CGame object uses the factory to handle creation of the

    command objects in order to hide the need for a parent

    from the CGame object.

    */

    ```'
