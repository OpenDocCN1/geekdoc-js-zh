  md: '# Drawing to Your Flash Movie


    To draw to your Flash movie you need to create an instance of the SWFShape class.
    You do this same way you created an instance of the SWFMovie. Once an instance
    of SWFShape is created you have access to several functions to draw lines and
    curves.


    ```

    $shape = new SWFShape();

    ```


    Now that you have an instance of the SWFShape class, you can draw to the movie
    that you created earlier. To draw a line, SWFShape gives you two member functions
    to actually draw the line and one member function to define the style of the line.


    To set the style of the line you can use the setColor() function. The setColor()
    function takes five arguments. The first is the width of the line in pixels; the
    next three are the RGB values for the color of the line; the fifth and final argument
    is the alpha value for the. Let''s say you wanted to draw a 5-pixel wide, yellow
    line on your canvas. You set the style like this:


    ```

    $shape->setLine(5, 255, 255, 255, 255);

    ```


    The two functions to draw a line to the canvas are drawLine() and drawLineTo().
    Each of these functions take two arguments: an x coordinate and a y coordinate.
    The drawLine() draws a line from the current pen position to a point (x, y) pixels
    away from the current position. The drawLineTo() draws a line from the current
    pen position to the (x, y) coordinate specified.


    The pen position is where the tip of the pen is currently on the canvas. You can
    move the position of the pen by calling the movePenTo() member function. The movePenTo()
    member function takes two arguments: an x coordinate and a y coordinate. Take
    a look at the following code to see the difference between the two draw line functions:


    ```

    php

    $myMovie = new SWFMovie();

    $myMovie->setDimension(400, 300);

    $myMovie->setRate(30);

    $myMovie->setBackground(200, 200, 200);


    // Draw a line to the canvas using drawLine

    $line1 = new SWFShape();

    $line1->setLine(5, 0, 0, 255);

    $line1->movePenTo(40, 20);

    $line1->drawLine(100, 100);


    $line2 = new SWFShape();

    $line2->setLine(5, 0, 0, 255);

    ```'
