  md: '# Letter from the Series Editor


    Over the last half decade or so, a little piece of software called PHP has been
    generating a lot of buzz and has quickly risen from a single programmer''s side-project
    to the Web programming language. Now in version 5, PHP (a recursive abbreviation
    for PHP Hypertext Preprocessor) is practically synonymous with the development
    of dynamic Web sites and flexible content. But what few realize that it''s capable
    of a lot more than just making sites—in fact, it''s showing serious potential
    for making games! With the surge in popularity of Web-based games and applications
    like Habbo Hotel, Yahoo''s board, card and puzzle games, and even The Sims, there''s
    never been a better time to get involved in online game development. And with
    PHP, a completely free tool, it has never been cheaper or easier!


    That''s so exciting about PHP Game Programming. Matt Rutledge has taken the formidable
    tasks of teaching game development and the PHP language and condensed them into
    one easy-to-read book that makes it all effortless. But don''t think this book
    is all about making so special that it''s not just for game developers; anyone
    who wants to learn PHP will find this book teaches it in a way that''s far more
    engaging than the countless other books on the shelves. After all, making games
    is a lot more fun than sending report emails or goofing off. From Chapter 1 on,
    you get a hardcore PHP education that starts in the trenches, with you need to
    know about server configuration and setup. Once you''re locked and loaded, you''ll
    complete a tour of the language itself, covering all the major constructs and
    features. PHP''s syntax is remarkably similar to languages like C, C++, and Java,
    and if you''re already familiar with one of those this material will be very easy
    to absorb. Finally, the last half of the book is devoted to serious game programming
    topics, from graphics to chess algorithms to dynamic battlefield terrains.


    In conclusion, it won''t be long before everything from your shoes to your refrigerator
    connects to the Internet, and online games are leading the way toward the ultra-connected
    world of the future. Many programmers find themselves leaving languages like C
    or C++ behind in favor of languages with built-in-networking capabilities like
    Java, Perl, and PHP. With a development tool as powerful and accessible as PHP,
    this is your chance to turn your online game ideas into a reality!


    Sincerely,

    André LaMath

    Series Editor, Premier Game Development Series


    ![](img/21371e23636acf076ec4949f8b4c40f7_7_0.png)'
