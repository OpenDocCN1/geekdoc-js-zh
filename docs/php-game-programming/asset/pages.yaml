    # Your First PHP Game


    Now''s time to program your first game in PHP! You will start off with a simple
    game of tic-tac-toe. This game will use all the aspects that you have learned
    in all the previous chapters. It contains session variables, arrays, functions,
    and PHP working together with HTML.


    The first step you need to set up a new game is to create a directory for inside
    your Web server. For IIS the directory would be C:\inetpub\wwwroot, and if you
    are using an Apache Web server the directory would be /usr/www. If you are on
    Windows the directory would look something like C:\Apache depending on where you
    installed Apache. You can name the directory whatever you like. I am going to
    name it tictactoe.'
