  md: '# Regular Expressions and Pattern Matching


    You can also specify ranges in your character classes by using a hyphen, like
    this:


    ```

    [a-z] // match any lower case letter

    [A-Z] // match any uppercase letter

    [0-9] // match any digit

    [\f\t\r\n] // match any white space

    ```


    Let''s say you want to create a character class to forbid a digit from being the
    first character in a string. To do this you would again use the caret (^). Inside
    a character class the caret^) means "not" at the beginning of the string.


    ```

    [^0-9][a-z]

    ```


    This will match any strings such as "all23" or "u47". But it will not match strings
    as "7all" or "8teen", PHP has several of these character classes already built.
    Take a look at Table 4.4.


    To allow more flexibility in your patterns, you can use curly braces ({}) to match
    multiple cases of characters or character classes. So to match exactly x number
    of occurrences of the previous character or character class you would do something
    like this:


    ```

    ^a(1,5)$ // matches: a, aa, aaa, aaaa, aaaaa

    ```


    You can also find a string with xx or more occurrences of a character or character
    class. For instance:


    ```

    ^b(2,)

    ```


    This will match a string with two or more b''s in it. So it would find a match
    on bbb000,bbblood, etc.


    There are five more special characters in regular expressions you should know
    about. are:


    ```

    period

    question mark ?

    star *

    plus +

    pipe n|

    ```'
