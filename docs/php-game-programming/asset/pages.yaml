    session.name


    +   - session.name specifies the name of the session that is used to reference
    sessionid in cookies. This should only take alphanumeric characters.


    session.auto_start


    +   - session.auto_start specifies if the session module should start automatically.
    If you use session.auto_start then you cannot put objects into your sessions the
    class definition must be loaded before starting the session.


    session.serialize_handler


    +   - session.serialize_handler is the name of the handler which is used to serialize
