  md: '# Chapter 1 So What Is All This Server Stuff?


    session.use_only_cookies


    session.use_only_cookies tells the session module that it should only use cookies
    to store the session ids. This prevents attacks from session variables passed
    along the URL.


    session.cookie_lifetime


    session.cookie_lifetime specifies the lifetime of the cookie in seconds. The default
    value 0 means wait until the browser is closed to expire the cookie.


    session.referrer_check


    session.referrer_check contains a string for which you want to check each HTTP
    referer. If PHP does not find this substring, the embedded session id will be
    marked as invalid.


    session.entropy_file


    session.entropy_file gives a path to an external file that will be used as an
    addition in creating the session id. The external file will contribute to the
    randomness in the session creation.


    session.entropy_length


    session.entropy_length specifies the number of bytes which will be read from the
    session.entropy_file variable. When set to its default value of 0, it disables
    the entropy options.


    session.cache_limiter


    session.cache_limiter specifies the cache control method to use. Valid options
    for these are none, nocache, private, private_no_expire, and public.


    session.cache_expire


    session.cache_expire is the time to live for cached session pages in minutes.
    This option has no effect if session.cache_limiter is set to nocache.


    session.user_trans_sid


    session.user_trans_sid specifies whether or not transparent sid support is enabled.


    url_rewriter.tags


    url_rewriter.tags specifies what HTML tags should be rewritten to include the
    session id if session.user_trans_sid is set to 1.


    Wow, there are a lot of configuration options for sessions. PHP is very unique
    and customizable. You do not have to specify all of the options in the php.ini
    file; as a matter of fact, PHP gives you several functions that expose these options
    to your code. If you need to change any of these in particular applications you
    can call on the functions listed in Table 1.2.'
