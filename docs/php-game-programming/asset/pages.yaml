  md: '# # Drawing Basic Shapes on Your Empty Canvas


    You now know how to create an image that you can draw on, and you also know how
    to allocate, manipulate, and count colors in an image. Now you''ll learn to draw
    geometric shapes on your empty canvas.


    # ## Tip


    If you have ever worked with DirectX you can think of the image resource as a
    buffer that you draw on. When you display the image you can think of that as blitting
    the buffer to the screen. The only difference is that you do not do this per frame.


    To draw anything on your images you need a coordinate system. GD uses Cartesian
    coordinate system where the point (0, 0) is in the upper-left corner of the image.
    Moving to the right along the x axis will move you in the x direction. Moving
    down the y axis will move you in the positive y direction. You will never need
    a negative x or y coordinate when working with images.


    Each of the geometric functions available in GD takes one or more coordinates.
    You will be reviewing each of the functions in detail, so dust all of those old
    geometry lessons and get ready. Here are the eight geometric functions, from easiest
    to hardest:


    +   * ImageSetPixel(resource image, int x, int y, int color)

    * ImageLine(resource image, int x1, int y1, int x2, int y2, int color)

    * ImageRectangle(resource image, int x1, int y1, int x2, int y2, int color)

    * FilledRectangle(resource image, int x1, int y1, int x2, int y2, int color)

    * ImagePolygon(resource image, array points, int numberOfPoints, int color)

    * FilledPolygon(resource image, array points, int numberOfPoints, int color)

    * ImageArc(resource image, int centerX, int centerY, int width, int height, int
    startDegree, int endDegree, int color)

    * ImageFilledArc(resource image, int centerX, int centerY, int width, int height,
    int startDegree, int endDegree, int color, int style)


    # ## Pixels and Lines


    ImageSetPixel() takes four arguments: the first is the image resource, the second
    is the x point, the third is the y point, and the fourth is the color. The ImageSetPixel()
    function draws a single pixel at point (x, y) in the specified color. Take a look
    at the following:


    ```

    <?php

    $image = ImageCreate(300, 200);

    ```'
