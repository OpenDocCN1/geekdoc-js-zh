  md: '# Bitwise Operators


    Before getting into the operators themselves, I want to give you a little lesson
    in binary representation, and how the computer stores numbers in memory. Otherwise
    none of what I am showing you is going to make sense.


    A binary number uses only 1s and 0s to compose a number. Each 1 and 0 is referred
    to as a bit. It is assumed that when storing a 32-bit integer in memory it is
    to use 4 bytes. There are 8 bits to a single byte. Using these 1s and 0s you can
    create any number. Take a look at Table 5.4.


    Take a look at Figure 5.1 to see how you count a binary number.


    As you can see, you really count from right to left, by multiples of 2. So the
    first bit on the right-hand side is 1, then the next is 2, then 4, 8, 16, and
    so on.


    Now that you have a basic understanding of binary representations, take a look
    at the bitwise operators you can use in PHP. There are six bitwise operators all
    together; four of them allow you to compare bits, and two of them allow you to
    shift bits to the left or to the right. Take a look at Table 5.5 for all of the
    bitwise operators.


    One of the biggest reasons to understand bitwise operators is that they are used
    all the time in the programming of board games. In the next chapter you will create
    a chess game that uses bit-boards. If you were not clear about how to use bitwise
    operators, you would not understand how the program will work.


    Table 5.4 Binary Number Representations

    | Binary Number | Corresponding Integer |

    |---|---|

    | 0001 | 1 |

    | 0010 | 2 |

    | 0011 | 3 |

    | 0100 | 4 |

    | 0101 | 5 |

    | 0110 | 6 |

    | 0111 | 7 |

    | 1000 | 8 |

    | 1001 | 9 |

    | 1010 | 10 |

    | 1011 | 11 |

    | 1100 | 12 |

    | 1101 | 13 |

    | 1110 | 14 |

    | 1111 | 15 |


    > * For simplicity I used only 4 bits, or 1 byte, to represent numbers in this
    example.


    ![](img/21371e23636acf076ec4949f8b4c40f7_98_0.png)


    Figure 5.1 How to count binary numbers.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Table 5.5 Bitwise Operators


    | Operator | Name | Quick Example |

    |---|---|--|

    | & | And operator | 11 (1011) & 13 (1101) = 9 (1001) |

    | | | Or operator | 11 (1011) | 13 (1101) = 15 (1111) |

    | ^ | Exclusive Or | 11 (1011) ^ 13 (1101) = 6 (0110) |

    | ~ | Not operator | ~11 (1011) = -12 (10000000000110) | |

    | >> | Shift bits to the right | 11 (1011) >> 2 = 2 (0010) |

    | << | Shift bits to the left by | 11 (1011) << 2 = 44 (1011000) |


    All the bitwise operators do perform operations analogous to the logical and,
    or xor, and not on each set of bits. Imagine that the bits are lined up one on
    top of another. When you “&” bits together, if they are both 1 (true&&true), the
    result is true, or the logical bit 1. Take a look at Figure 5.2.


    See how the least significant bit in both numbers is set to 1. When they are “anded”
    together the result is true, or 1. But when the next bits are “anded” together,
    the result is false, or 0, because both bits are false to begin with. Now do the
    same exact thing with the “|” operator to see the differences. Figure 5.3 shows
    the results.


    In this example you can see that the “|” operator evaluates to true anytime a
    true bit appears in the value. So when the least significant bit in both numbers
    (1 and 1) is “or’ed the logical expression would be: true or true; But when the
    next bits are


    ![](img/21371e23636acf076ec4949f8b4c40f7_99_0.png)


    Figure 5.2 Using the "&" bitwise operator.'
  merge: -1
