    What can PHP do for you? PHP can create dynamic applications that can be delivered
    over the Web. In comparison, HTML can only create static content because the Web
    browser interprets the page when it is requested; the server doesn''t do anything
    but send the page to the browser. When a PHP page is requested on the server,
