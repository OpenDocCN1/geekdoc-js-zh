    The SWFShape class provides. The addFill() function takes three arguments. The
    first argument is the red component of the color you wish to fill. The second
    argument is the green component of the color, and the third argument is the blue
    component of the color.


    So which fill function do you use? Well, it depends on how you are drawing your
    object. If you are drawing your object in a clockwise direction, then you need
    to use theRightFill() function. If you are drawing your shape in a counter-clockwise
    direction, then you need to use the leftFill() function.


    In the following example you will draw a square with a black 5-pixel border that
    is filled with:


    ```

