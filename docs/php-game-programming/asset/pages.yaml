- img_proc: true
  md: "# Chapter 5 = Operators, Statements, and Functions\n\nSee the value of $someNum\
    \ changed? Its value is the result from the operations inside the function. Passing\
    \ variables by reference is a very handy way to return results for multiple variables\
    \ because a function can return only one value if you are using the return keyword.\n\
    \n# Recursion\n\nPHP functions also support recursion. Recursion is simply when\
    \ a function calls itself. One of the easiest ways to explain recursion is just\
    \ to show you; take this, for example:\n\n```\nfunction power($base, $exponent)\
    \ {\n  if($exponent) {\n    return $base * power($base, $exponent - 1);\n  }\n\
    \  return 1;\n}\n```\n\nNotice how the return statement is calling the power function,\
    \ but it is subtracting one from the variable $exponent every time it is called.\
    \ Eventually $exponent will hit zero and if that statement will not execute. At\
    \ this point the recursion ends. Take an in-depth look at how this works.\n\n\
    ```\necho(power(2,3));\n```\n\n+   1. The function power is called with the base\
    \ set to 2 and the exponent set to 3.\n2. Next, the $exponent is tested; since\
    \ it is non-zero it succeeds and proceeds to the next line.\n3. The return statement\
    \ calls the power function again, this time the base is 2 and the exponent is\
    \ also 2.\n4. The $exponent is tested again. It is still a non-zero value.\n5.\
    \ Power is called again with the value 2 as the base and 1 as the exponent.\n\
    6. The exponent is tested again; it is still a non-zero value.\n7. Power is called\
    \ a final time with the value 2 as the base and 0 as the exponent.\n8. This time\
    \ the test fails and the function returns 1 to the third invocation of the function.\n\
    9. 1 is now multiplied by the base and the third invocation of the function returns\
    \ 2 to the second invocation of the function."
  merge: -1
  pgno: 114
- img_proc: true
  md: "10. 2 is now multiplied by the base value, giving us 4, and 4 is returned to\
    \ the first invocation of the power function.\n\n11. 4 is now multiplied by the\
    \ base, giving us the final value of 8, and 8 is returned from the power function\
    \ back to your program.\n\nPretty confusing, huh? Recursion can be a nasty beast\
    \ but you can do some pretty cool things with it.\n\n# The Magic of Including\
    \ Files\n\nNow that you have all this cool knowledge about how to make functions,\
    \ you need a way to include libraries (so to speak) in your PHP pages. Basically\
    \ what you can do is make a full of common functions that you use all the time\
    \ and put them in all of games. For instance, if you take a look at the CD, I\
    \ have included a PHP file (common.php) that has some base functions that will\
    \ be used in all of the games in this.\n\nPHP gives you two ways to include files\
    \ in your application. You can use the require statement or the include statement.\
    \ When the PHP interpreter encounters the require statement it puts the file in\
    \ the code and it is now generally available to your page. The include statement\
    \ evaluates and executes the code each time the include statement is encountered.\
    \ This allows you to have dynamic includes in your files. For example:\n\n```\n\
    for($loopCounter = 0; $loopCounter < 5; $loopCounter++)\\{\n    include(\"file\"\
    \ . $loopCounter . \".php\");\n}\n```\n\nIf you did the above example with the\
    \ require statement, then the only file that would be included be file4.php. Instead\
    \ of worrying about which one is better I would just use the include statement.\
    \ There is no performance hit and you can be a lot more flexible in your coding.\n\
    \n# Note\n\nPHP assumes the include files are in the directory specified by the\
    \ include_path directive in the php.ini file. If your include files are not in\
    \ this directory you need to specify the full path with the filename to include\
    \ it."
