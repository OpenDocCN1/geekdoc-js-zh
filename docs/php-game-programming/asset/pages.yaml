  md: '# Relational Databases: A Quick Rundown


    If you are installing MySQL on a Linux machine you will need to type the following
    at a

    command prompt:


    ```

    $ ./scripts/mysql_install_db

    $ cd mysql_installation_directory

    $ ../../bin/mysqld_safe --user=mysql &

    ```


    If you have problems creating your user and granting your user permissions to
    the data-base you should look at the documentation at www.mysql.com to see suggestions
    for troubleshooting.


    Now go ahead and create the database by Kiddy Cartel will use to store its data.
    Go to a command prompt and navigate to the directory where you installed MySQL.
    Once you get in that directory, type the following:


    ```

    /bin/mysqladmin create kiddycart

    ```


    This will create a new database called kiddycart. Now you do need to add a table
    to the data-base. To do that, take a first look at the T-SQL language.


    # Relational Databases: A Quick Rundown


    Relational databases are databases that know of other tables. You absolutely need
    to use a relational database to make a MMO game. The reason for this is that MMO
    games quickly get complicated and if you are always trying to loop through files
    to find your record, your game will suffer in performance and I guarantee that
    you will lose track of what data you are trying to store and retrieve.


    With that said, relational databases use a language called T-SQL to operate on
    databases. T-SQL allows you to create tables in your databases, and to insert,
    update, and delete records, just to mention the most common functions. With these
    four options you can get started on creating the Kiddy Cartel game, although these
    four operations will not make you an expert in relational databases.


    # Note


    > This is not a complete tutorial of T-SQL. If you would like to learn more about
    relational databases you should explore some relational database books and online
    tutorials.


    To create a table using T-SQL you need to use the CREATE TABLE function. The CREATE
    TABLE function takes the column definitions as parameters and a table name. The
    easiest way to explain how to create a table is to show you. Open a command prompt
    and navigate to the mysql/bin directory. Once you are in that directory, type
    the following:


    ```

    mysql

    ```'
