  md: '# Installing the Apache Web Server on INIX


    As soon as the make script is finished, you can install the Apache Web Server
    package. To do this, simply type make install at the command prompt. After the
    install script has finished, Apache is installed and ready to go. There are some
    customizations you can do by editing the httpd.conf file. There are tons of options
    in this file—far too many to go through here in this book. So, I direct you to
    the online Apache documentation at http://apache.org/docs-2.0/


    After you have finished customizing your Apache installation you should have to
    start the server. During the installation, Apache put a start script in your bin
    directory called apachectl. To start the server you simply have to type the following:


    ```

    $ /apache/bin/apachectl start

    ```


    You should now be able to request a Web page via a URL (http://localhost/). If
    you ever need to stop the server, you type:


    ```

    $ /apache/bin/apachectl stop

    ```


    That''s it! You should now have the Apache Web Server installed and running. You
    can now move on and install the PHP CGI Interpreter and get moving on PHP.'
