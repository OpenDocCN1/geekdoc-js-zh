    # TCP/IP


    TCP/IP (Transmission Control Protocol/Internet Protocol) is simply a communications
    protocol that computers use to talk to each other. What do the different components
    of TCP/IP do?


    +   - TCP. This is responsible for verifying the correct delivery of data from
    a client to a server, or a server to a client. TCP has built-in error checking
    and will trigger transmissions until the data has successfully reached its destination.


    +   - IP. This is responsible for moving packets of data from node to node. IP
    forwards these packets based on a four-byte address (IP Address).


    Like every other communications protocol, TCP/IP is constructed of layers. All
    network traffic moves through these layers as they travel through the hardware.
    Here are the layers and a little bit of information about each.


    +   - Application Layer. This layer handles everything that is not TCP/IP. The
    Web browser, in our case, is the application layer.


    +   - Transport Layer. This layer handles all the routing and delivery of data.
    This layer also includes the error control and sequence checking.


    +   - Internet Layer. This is the layer responsible for data addressing, transmission,
    packet fragmentation, and packet reassembly.


    +   - Network Access Layer. This layer handles the transmission of the data across
    the network, determining how to access the hardware.


    How does all this work? Before sending data across the network, TCP/IP establishes
    a connection with the destination machine by sending what we call management packets.
    TCP/IP establishes this connection, data can be sent freely. Once the application
    that was using TCP/IP to send data is finished transmitting, it sends more management
    packets to the client to tell it to close the connection. TCP/IP also controls
    the flow rate of'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Chapter 1 So What Is All This Server?


    the data to achieve the maximum data exchange rate, while avoiding congestion
    and packet loss. TCP/IP also attempts to pack as much data into a packet as possible.


    To sustain an acceptable data transfer rate while avoiding network overload, TCP/IP
    contains four algorithms: Slow Start, Congestion Avoidance, Fast Retransmit, and
    Fast Recovery.


    The Slow Start algorithm avoids injecting multiple segments into the network during
    the transmission. The reason for this is if there are routers and slower links
    between the sender and the receiver you to lose packets and you slow down your
    connection. The Slow Start algorithm enables TCP/IP to only send data at the rate
    which the acknowledgments are returned.


    The Congestion Avoidance algorithm does what the name says—it avoids congestion.
    Network congestion usually occurs when a large amount of data is sent out of a
    larger pipe and received over a smaller pipe. Congestion can also occur when multiple
    streams of data arrive at a router whose output capacity is less than the sum
    of the inputs.


    The Fast Retransmit algorithm is triggered when the receiving end sends a duplicate
    acknowledgment. When an out-of-order segment is received, a duplicate ACK is received,
    or a packet is lost. When this occurs, TCP/IP will retransmit the packet that
    was expected.


    The Fast Recovery algorithm is triggered after the Fast Retransmit sends the missing
    packet segment. This allows TCP/IP to recover from the missing segment while avoiding
    network congestion. If fast recovery was not available, the user might see a significant
    decrease in data transmission.


    Now that you know how TCP/IP works, you are set with the knowledge you need to
    continue the march. The next step is to install the web server. Following are
    installation walkthroughs for IIS and Apache.


    # Installing the IIS Web Server


    IIS (Internet Information Server) is included with the Windows 2000 installation
    disk. PWS (Personal Web Server), a trimmed down version of IIS, is available with
    the Windows 98 installation disk. The differences between IIS and PWS are relatively
    small; the biggest differences are:


    +   * PWS cannot host multiple Web sites on a single machine.

    * PWS cannot log to an ODBC compliant database.

    * PWS cannot restrict access by IP address.

    * PWS cannot isolate processes.'
