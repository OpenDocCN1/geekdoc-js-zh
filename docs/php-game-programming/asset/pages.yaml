- img_proc: true
  md: '# Chapter 8 ■ GD Graphics Overview


    So now you know how to copy an image that is either the same size or smaller than
    the destination image. But what if you want to copy an image that is larger than
    the destination image? You would use the ImageCopyResized() or the ImageCopyResampled()
    functions. A good example would be to take the framedDragon.jpg image that you
    just created and create a 100 × 100 thumbnail of the image.


    ```

    <?php

    // Get our image resources

    $image = ImageCreateFromJpeg("framedDragon.jpg");


    // Create a true color image 100x100

    $thumb = ImageCreateTrueColor(100, 100);


    // Copy dragon onto frame

    ImageCopyResized($thumb, $image, 0, 0, 0, 0, 100, 100, ImagesX($image), ImagesY($image));


    // Save the image and show it

    ImageJpeg($thumb, "thumbFrameDragon.jpg");

    ?

    ```


    This starts the same way we did last, getting the resource to an existing image.
    Then you create a new true-color image that is 100 × 100 pixels. Now you copy
    the image Image to the destination image $thumb. The seventh and eighth arguments
    are the destination image''s width and height. The ninth and tenth arguments are
    the source image''s width and height. In this example you use the ImagesX() and
    ImagesY() functions that return the width and height of the image resource. A
    full list of all image functions can be found in Appendix D. Take a look at Figure
    8.18 to see the example of functions.


    ![](img/21371e23636acf076ec4949f8b4c40f7_204_0.png)


    Figure 8.18 Using the ImageCopyResized() function.'
  merge: -1
