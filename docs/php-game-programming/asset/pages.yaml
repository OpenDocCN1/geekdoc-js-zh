  md: '# 338 Appendix C ■ Support—Debugging Applications


    Make sure that the httpd binary you are running is the actual httpd binary you
    just built. To do this, try running: /path/to/binary/httpd -1.


    If you don''t see mod_php.c listed then you are not running the right binary.
    Find and install the correct binary.


    +   1. Make sure you have added the correct MIME Type to one of your Apache files.
    It should be: AddType application/x-httpd-php3 .php3 (for PHP 3) or AddType application/x-httpd-php
    .php (for PHP 4)

    2. Also make sure that this AddLine is not hidden under a <Virtualhost> or <Directory>
    block which would prevent it from applying to the location of your test script.

    3. Finally, the default location of the Apache configuration changed between Apache
    1.2 and Apache 1.3. You should check to make sure that the configuration you are
    adding the AddType line to is actually being. You can put an obvious syntax error
    into your httpd.conf file or some other change that will tell you if the file
    is being read correctly.


