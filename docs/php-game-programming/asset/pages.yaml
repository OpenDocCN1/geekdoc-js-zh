  md: '# APPENDIX B


    # PHP LANGUAGE REFERENCE


    This appendix is a complete guide to all of the PHP functions available to you.
    Each function is broken into sections that the function should fall under. Then
    each function is listed with the parameters it receives, what the function returns,
    and a short description of what the function does.


    # Apache Functions


    | Function | Returns | Description |

    | --- | --- | --- |

    | apache_lookup_uri(string filename) | Class | Returns a class with properties
    about the URI specified. |

    | apache_note(string note_name [, string_name]) | String | Retrieves the value
    in the request notes table for a specific note name. If the note_value is specified
    then it will set note_name to the value of note_value. |

    | getheaders() | Array | Returns an array of HTTP request headers from Apache.
    |

    | virtual(string filename) | Integer | Performs an Apache sub-request to the specified
    file. |


    # Array Functions


    | Function | Returns | Description |

    | --- | --- | --- |

    | array(...) | Array | Creates and returns an array with the supplied values.
    |

    | array_keys(array) | Array | Returns an array that contains all the keys of the
    specified array. |

    | array_merge(arrays) | Array | Merges the supplied arrays into one singular array.
    |

    | array_pop(array) | Mixed | Pops the last element of the array and returns it.
    |

    | array_push(array, variables) | Integer | Pushes the supplied variables into
    the end of the specified array. |

    | array_shift(array) | Mixed | Removes the first element from the array and returns
    it. |'
  merge: -1
  pgno: 325
