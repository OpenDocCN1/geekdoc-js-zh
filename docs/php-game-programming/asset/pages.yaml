    # Initializing Arrays


    There are several ways that you can initialize arrays. You could simply list the
    variable with the value you like to add to the array, like this:


    ```

    $board[] = "A":

    $board[] = "B":

    $board[] = "C":

    $board[] = "D":

    ```


    Because you did not specify an index, the elements are automatically added in
    sequential order. You could also have specified what index you would like the
    element to appear in, like this:


    ```

    $board[] = "A":

    $board[1] = "B":

    $board[5] = "C":

    $board[7] = "D":

    ```


    This is more impractical, but valid all the. Usually when assigning elements to
    an array you should do it in a sequential order. This way there is no confusion
    about where the element is. However, there are times when you will want to create
    a hash key and use that for your index.


    If you ever assign items in a non-sequential order and then add an element to
    the array without specifying the index it should appear in, then the element will
    be automatically added to the next highest index. For example:


    ```

    $board[0] = "A":

    $board[1] = "B":

    ```'
