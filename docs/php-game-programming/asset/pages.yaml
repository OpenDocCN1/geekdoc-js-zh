    # Application and Installation Problems


    While installing PHP or one of the other applications included on the CD you may
    run into some configuration or setup issues. I can''t cover all the issues in
    this book, but I can recommend just going to the manufacturer''s Web site and
    looking at their documentation. These companies have done a great job of detailing
    very common problems that occur during installation and setup. If your problem
    is not in the available documentation, there is always support.


    The thing that I am going to include in this book is the set of frequently asked
    questions listed on www.php.net. I imagine these will be the most common problems
    you will run into and I want to save you the time of trying to find these answers
    all on your own.


    +   1. I got the latest version of PHP using the anonymous CVS service, but there''s
    no configure script!


    You must have the GNU autoconf package installed so you can generate the configure
    script from configure.in. Just ./buildconfig in the top-level directory after
    getting the sources from the CVS server. (Also, unless you run configure with
    the --enable-maintainer-mode option, the configure script will not automatically
    update'
