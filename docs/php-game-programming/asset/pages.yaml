  md: '# Kiddy Cartel: The Rules and Specifications 233


    Now that you have created the database and a table, you can insert records into
    the table.

    To insert a record into the table you will use the INSERT INTO function.


    ```

    INSERT INTO neighborhoods(PlayerName, NeighborhoodName, Password, LastTurnCredited)

    VALUES(''MyPlayer'', ''MyTown'',''mmorocks'', GetDate())

    ```


    This will insert a record that has the values MyPlayer as the player name, MyTown
    as the neighborhood name, mmorocks as the password, and the current date and time
    for the last turned column. The rest of the columns will contain the default values
    specified in the table definition.


    Let''s say you want to update the MyPlayer record and change its password. To
    do that you will need to insert the UPDATE function. The UPDATE function takes
    the table name and then the column you want to update. For example:


    ```

    UPDATE neighborhoods SET Password = ''newPassword'' WHERE PlayerName = ''MyPlayer''

    ```


    This will update the record associated with MyPlayer. Deleting a record is as
    simple as You use the DELETE function. The DELETE FROM function takes a table
    name as its main parameter.


    ```

    DELETE FROM neighborhoods WHERE PlayerName = ''MyPlayer''

    ```


    The line above will delete the MyPlayer record. If you did not specify a WHERE
    clause in the DELETE FROM it would delete all the records in the specified table.
    Make sure you always specify a WHERE clause unless you don''t mind losing all
    of your data.


    That is a very quick rundown of some basic T-SQL functions. By no means is this
    a complete-how on relational databases. But now that you have a general idea about
    what T-SQL is, and now that you have a database created for Kiddy Cartel, let''s
    take a in-depth look at the specifications for Kiddy Cartel.


    # Kiddy Cartel: The Rules and Specifications


    Since Kiddy Cartel is a massively-multiplayer game, each player will be controlled
    by a human; there will be no computer players. When you have created a neighborhood
    to control you will be given a stock of lemonade and a stock of cookies. You also
    will be given one lawn mower so you can generate more money. You will start off
    with $300 and 50 turns.


    The object of the game is to get as many resources and as much money as possible.
    To do this you will need to create lemonade stands, bake cookies, mow lawns, and
    take over other neighborhoods. There are three main rules that apply to the coding
    of this game.


    +   1. Turns – A certain number of turns will be generated for a player each hour.
    Players can stockpile turns for as long as they want.'
