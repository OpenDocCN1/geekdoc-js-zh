  md: '# How to Create a Flash Movie


    | Table 12.1 Ming Objects |

    | Class | Description |

    |---|---|

    | SWMovie | Creates a Flash movie. |

    | SWShape | Creates geometric shapes for your Flash movie. |

    | SWFill | Provides methods to fill your objects. |

    | SWGradient | Creates a gradient object you can use as a fill for your geometry.
    |

    | SWBitmap | Allows you to include: .jpg and .png images in your Flash movie.
    |

    | SWFFont | Allows you to create a font for your Flash piece. |

    | SWFText | Allows you to output text to your Flash piece. |

    | SWTextField | Allows you to create a text input area in your Flash piece. |

    | SWFDisplayitem | Allows you to access other Flash objects. |

    | SWFSprite | Allows you to create a movie clip for your Flash piece. |

    | SWMorph | Allows you to create shape between two objects. |

    | SWButton | Allows you to create a button in your Flash piece. |

    | SWFAction | Creates an ActionScript object you can add ActionScript to your
    Flash piece. |


    # # How to Create a Flash Movie


    To create a Flash movie you need to invoke an instance of the SWMovie class. Take
    a look at the following line of code to see how to invoke the SWMovie class:


    ```

    $$myMovie = new SWMovie();

    ```


    The variable $myMovie now contains an instance of the SWMovie class. Now that
    you have an instance of SWMovie you can specify the fundamentals of your movie,
    as movie dimensions, frame rate, and background color. After you have specified
    these fundamentals of yours you could output to the browser.


    To set the dimensions of your movie, the SWMovie class contains a member function
    called setDimension(). The setDimension() function takes two arguments: the width
    and the height (in pixels) you want your movie to be. Take a look at the following
    line of code to see how to set the dimension of your dynamic Flash movie:


    ```

    $myMovie->setDimension(400, 300);

    ```


    This sets the $myMovie Flash piece to a width of 400 pixels and a height of 300
    pixels. Now that you have set the dimensions of your Flash piece you need to specify
    its frame rate. Your frame rate specifies the number of frames per second that
    will be displayed. A Flash'
