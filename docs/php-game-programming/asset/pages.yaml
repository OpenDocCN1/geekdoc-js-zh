  md: '# Filling Objects with Ming 269


    Now that you know how to flood-fill objects and how to gradient-fill objects,
    you can learn how to fill objects with bitmaps. This is a way to fill objects.
    You can compare it to texture mapping in 3D game programming, but it''s not as
    complex.


    To fill an object with bitmaps you need to create an instance of the SWFBitmap()
    class. The SWFBitmap class does not expose any fill functions but it allows you
    to create a bitmap. The addFill() member function of the SWFShape class is what
    allows you to fill a shape.


    The SWFBitmap() class allows you to create a bitmap from two types of files. The
    first is a .dbl (Define Bits Lossless) file which can be created from a .gif or
    a .png file. Ming provides a tool called gif2dbl that converts a .gif to a .dbl
    file. The second type of file from which you can create a bitmap is a non-progressive
    .jpg. You can use the edition of Point Shop Pro on the CD to create non-progressive
    .jpg images.


    To create a bitmap from another file, you need to read the data into a buffer
    using the file functions that PHP uses. To read a file you will need to open the
    file with the fopen() function and read the file with the fread() function. Take
    a look at the following code snippet for a quick example:


    ```

    $fp = fopen("somefile.jpg", "rb");

    $data = fread($fp, filesize("somefile.jpg"));

    ```


    # Note


    > For those of you are accustomed to opening and reading files in C, PHP uses
    the same parameters as C.


    After you have read the data into a buffer, you pass the buffer into the SWFBitmap()
    constructor to create a new bitmap image.


    ```

    $bitmap = SWFBitmap($data);

    ```


    Then, after you have a bitmap image, you can pass it to the addFill() member function
    of the SWFShape() class and select one of the following:


    +   - SWFFILL_CLIPPED_BITMAP. This flag will display one instance of the bitmap.

    - SWFFILL_TILED_BITMAP. This flag will tile the bitmap across your image.


    Take a look at the following example to see how to tile a bitmap across a SWFShape():


