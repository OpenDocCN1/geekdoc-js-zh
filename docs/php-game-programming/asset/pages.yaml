    # BCMath Functions


    | Function | Returns | Description |

    |---|---|---|

    | bcadd(string1, string2, [scale]) | String | Returns the sum of string1 and string2.
    The optional parameter scale specifies the number of decimal places to go out.
    |

    | bcomp(string1, string2, [scale]) | Integer | Compares string1 and string2. If
    they are equal it will return 0, if string1 is greater than string2 it will return
    1, and if string2 is greater than string1 it will return -1. The optional parameter
    scale specifies the number of decimal places to go out. |

    | bcdiv(string1, string2, [scale]) | String | Divides string1 by string2. The
    optional parameter scale specifies the number of decimal places to go out. |

    | bcmod(string1, string2) | String | Returns the modulus of string1 and string2.
    |

    | bcmul(string1, string2, [scale]) | Multiplies string1 by string2. The optional
    parameter scale specifies the number of decimal places to go out. |

    | bcpow(string1, string2, [scale]) | String | Takes string1 to the power of string2.
    The optional parameter scale specifies the number of decimal places to go out.
    |

    | bcscale(scale) | String | Sets the default scale value. |

    | bcsqrt(string1, [scale]) | String | Returns the square root of string1. The
    optional parameter scale specifies the number of decimal places to go out. |

    | bcsub(string1, string2, [scale]) | String | Subtracts string2 from string1.
    The optional parameter scale specifies the number of decimal places to go out.
    |


