    When a command object is created, it calls the CCommand() constructor. This constructor
    initializes all the member variables of the class. In this case the parent object
    gets set, the number of sub-commands is set to 0, and the rollback required variable
    is set to false.


    Earlier I mentioned that each parent command would handle its own execution. The
    only thing that the Execute() function needs to do is to tell the game that it
    is finished executing.


    Now you need a way to handle the sub-commands that need processing. What better
    name for a function than HandleSubCommand()? The HandleSubCommand() takes an argument
    that tells what state the command is executing. First you see if the command has
    finished. If the command finished successfully then you can move to the next sub-command
    in the tree. If the command did not finish then it must be in another state. You
    also check to see if an error in execution occurred. If an error has occurred,
    then you need to tell the game to stop its execution. If an error has not occurred,
    then you need to check if the game is awaiting input. If the game is waiting for
    input, then you need to tell the game to hold up and wait for the user.


    If you get past all of that checking you must check to see if there are more commands
    to execute. If there are more commands to execute, then you need to tell the game
    that it needs to continue to the next command. If you have executed all of the
    possible sub-commands then you are finished executing.


    What happens if an error occurs during execution? If an error does occur during
    the execution of a command, you need to call the OnError(). There are two states
    where an error can occur: 1) if the command has a parent, and 2) if the command
    doesn''t have a parent. If the executing command has a parent command, then the
    parent command should handle the error. But if the executing command has no parent,
    then the CCommand() class needs to clean up itself by calling the OnRollBack()
    function. All the OnRollBack() function does clear any sub-commands that might
    be there and resets the count.


    You might be thinking that looks like an awful lot of code for a class that really
    doesn''t do anything. To tell you truth, this class will allow you to keep consistency
    between all of your commands. Each time you create a command, that command will
    inherit all the functions in this class.'
