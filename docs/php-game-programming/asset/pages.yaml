  md: '# Chapter 2 = Waging the Configuration War


    Now if the earlier script ran successfully there should be a file called make
    in the directory. This is the file that will build the distribution. To run it,
    type the following:


    ```

    $ make

    ```


    If you see a link failure, you are most likely missing a reference to a library.
    If a library is in a non-standard location you will need to specify the path to
    the library and re-run the make file again.


    ```

    $ export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/var/otherlibdir

    ```


    ```

    $ make

    ```


    After all the source files have been successfully compiled and linked you can
    install the distribution. To do this you must have root privileges. I am assuming
    that you are installing as root; if you are not root you will need to assume the
    super user.


    # Tip


    > To assume the super user, or root user from a command line, simply type su at
    the command prompt and enter the password.


    To install the distribution, simply enter the following command:


    ```

    $ make install

    ```


    That''s. You should now have PHP installed on your system. The only thing left
    to do is tell Apache what to do with PHP pages. Navigate to the folder where your
    Apache configuration files live (usually httpd.conf), open it, and follow the
    following lines:


    ```

    AddType application/x-httpd-php4 .php4

    AddType application/x-httpd-php4-source .php4

    Action application/x-httpd-php4 /cgi-bin/php

    DirectoryIndex index.html index.shtml index.cgi index.php4 index.php

    AddIcon /icons/script.php .conf .sh .sh .kshsh .php .php .php

    ```


    Finally, you will need to restart the Apache web server. That''s all you need
    to do—you''re configuring PHP and Apache. Now would probably be a good time to
    take a break and get another Mountain Dew. ... Next up: testing!


