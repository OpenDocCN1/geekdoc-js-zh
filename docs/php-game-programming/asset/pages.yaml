  md: '# APPENDIX C


    # SUPPORT — DEBUGGING APPLICATIONS


    In this appendix you will learn how to debug your PHP applications to figure out
    errors, which is very important. I only call this section support because you
    may have trouble getting some examples to work if your PHP version is different
    or if you use a special configuration. This appendix will give you the skills
    necessary to fix errors as they arise. With practice, debugging will become second
    nature to you.


    You can break errors into three broad categories.


    +   * Syntax/compilation errors

    * Semantic/runtime errors

    * Logic errors


    # Syntax Errors


    Syntax errors are raised by the parser when there is malformed code. These are
    the easiest errors to track down because the parser tells you which line the error
    occurred on. Take the following line of code, for example:


    ```

    $x = $point[*];

    ```


    This will produce a parser error that looks like Figure C.1.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Appendix C ■ Support—Debugging Applications


    ![](img/21371e23636acf076ec4949f8b4c40f7_346_0.png)


    Figure C.1 A parser error.


    The error tells you that the parser found an unexpected character, and it tells
    you the character that the parser was unexpected. It even tells you what line
    the error occurred on. The fix for this error is fairly straightforward:


    $x = $point["**\];


    This is straightforward, but what if you did something like this:


    ```

    <?php

    for($i = 0;$i < $count; $i++)

    ?>

    <b>Menu Item</b>

    <?php

    echo($i);

    }

    ?

    ```


    This produces the error shown in Figure C.2.


    ![](img/21371e23636acf076ec4949f8b4c40f7_346_1.png)


    Figure C.2 Another parser error.'
