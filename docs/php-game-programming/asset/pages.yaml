    Before getting the configuration and installation of PHP, it is important to know
    how a Web server and Web browser work together. Accordingly, this chapter will
    cover some basic server architecture and discuss some points that will change
    the way you design your applications. If you feel you already know these concepts,
    you may wish to skip this section and move on to the section on installation.


    # Understanding the Client/Server Relationship


    When you talk about viewing a PHP page, you are referring to a Web page. When
    you go to a Web page a series of events occur. These events start at the client
    with the request, go to a server to get the page, and end back at the client for
    viewing. Take a look at these events as listed below, and depicted in Figure 1.1.


    +   - The client computer connects to the Internet.

    - The client opens a Web browser.


    3'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Chapter 1 ■ So What Is All This Server?


    +   3. The client requests a page from a Web site. When you do this, a message
    is sent over the Internet to a name server, and the name server then directs you
    to the server that hosts the Web page.

    4. The server that hosts the Web page receives your request and retrieves the
    requested page.

    5. If the page is a scripted page, such as a PHP page, the server compiles the
    page through a just-in-time compiler that generates HTML.

    6. The server then transmits the completed HTML back to the client (the browser).

    7. The browser receives the HTML and displays an interpretation of the page.


    All of that is fairly straightforward; it''s almost like magic. There is only
    one catch—from browser to browser, your Web pages are not displayed identically.
    That is why we say the browser *interprets* the page. For instance, when Internet
    Explorer explores a page that includes nested tables, both with heights of 100%,
    Internet Explorer interprets the height of the inner table relative to the height
    of the outer table. However, in Netscape Navigator, the browser will make both
    the inner and the outer table the height of the browser window. This poses a problem
    if you want a page to look the same in multiple browsers. It gets worse when you
    switch between OS platforms. Let''s say you have a page of text, and for some
    reason the text determines the layout of the page, and you get it looking perfect
    on a Windows platform. When you then view the page on a Macintosh, the font is


    ![](img/21371e23636acf076ec4949f8b4c40f7_20_0.png)


    Figure 1.1 The client/server process.'
  merge: -1
