    Align – Sets the alignment of data and the justification of text in the table
    cell. Possible values are center, left, and right. By default, it is selected.


    Bgcolor – Sets the background color of the table cell. This overrides the bgcolor
    in the table row for the particular cell that it is specified on.


    Colspan – Sets the number of columns, or cells, that this cell will span.


    Rowspan – Sets the number of rows that this cell will span.


    Width – Sets the width of the cell.


    Height – Sets the height of the cell.


    Novrap – Sets whether the browser will automatically perform word wrapping on
    the cell.


    Valign – Sets the vertical alignment of data and text in the table cell. Possible
    values are continuing, baseline, and top. By default, middle is selected.


    Before continuing, I want to show you what these options can do. Let’s create
