  md: '# Chapter 8 ■ GD Graphics Overview


    ![](img/21371e23636acf076ec4949f8b4c40f7_188_0.png)


    # From Rectangles to Polygons


    As mentioned earlier, the concepts of each geometric shape will get progressively
    more difficult. However, drawing a polygon isn''t that complicated. The major
    difference between drawing a polygon and drawing a rectangle is the number of
    coordinates the function will take. So far you have dealt with functions that
    take one coordinate (x,y). The ImagePolygon() function takes multiple coordinates.
    It also takes the number of points that are in your polygon. When the ImagePolygon()
    function draws your polygon it connects each point with a line.


    ImagePolygon() takes four arguments. The first is, of course, the resource to
    the image. The next argument is an array that contains all of your point coordinates
    for the polygon. The third argument is an integer telling ImagePolygon() how many
    vertices are in your polygon. The fourth and final argument is the color in which
    you want your polygon to be drawn.


    Let''s say you want to draw a triangle on your canvas. You would need three sets
    of coordinates. You can store these coordinates in an array, for example:


    ```

    $points = array(50, 10,

    20, 40,

    80, 40);

    ```


    This gives you each corner of the triangle. Now you need to calculate how many
    points there are in the given polygon. With a triangle it is simple; there are
    obviously three points. But what would you need to do for a more complex shape?
    Well, since there are two elements in every polygon you can divide the size of
    the array by 2 to get the number of points in the polygon.


    ```

    $vertices = size($points) / 2;

    ```'
