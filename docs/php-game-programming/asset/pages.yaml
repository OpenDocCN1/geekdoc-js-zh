  md: "# Chapter 1 = So What Is All This Server Stuff?\n\nWhen working with sessions\
    \ there are some important things to remember. If you have a server farm running,\
    \ a user's session does not follow him as he moves from server to server. In other\
    \ words, a session is only valid on a single server. The session is process dependent.\
    \ This means that if your Web server needs to be restarted and there are current\
    \ sessions active, then the sessions will be lost. One unique feature of sessions\
    \ in PHP is that they are not cookie dependent. So if a client does not accept\
    \ HTTP cookies, the client can still take advantage of sessions.\n\nThere are\
    \ currently two methods supported for passing sessions in PHP4:\n\n+   * Cookies\n\
    * URL Parameter\n\nCookies are of course the preferred method, but since they\
    \ are not always available you can pass the session id along the query string\
    \ as a URL parameter. Here is an example of how you might pass the id along the\
    \ query string in PHP.\n\n```\n<?php\nif(session_is_registered('nCount')) {\n\
    \    session_register('nCount');\n    $nCount = 1;\n} else {\n    $nCount++;\n\
    }\n```\n\n<p>Hello, you have seen this page <php echo $nCount; ?> times.</p>\n\
    \n<p>To continue, <a href=\"page.php?<?php echo strip_tags($SID);?>\">click here</a>\
    \ page.php<?php echo strip_tags($SID);?></p>\n\nIn this example we check to see\
    \ if the session variable nCount is registered. If it is not registered we register\
    \ it and initialize it. Otherwise we add 1 to the count and display our message\
    \ to the user. The output of this page might look something like this in Figure\
    \ 1.2.\n\n# Note\n\nNon-relative URLs are assumed to point to external sites and\
    \ don't append the sid as it would be a security risk."
