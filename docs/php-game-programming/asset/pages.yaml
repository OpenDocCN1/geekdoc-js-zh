  md: "Looping through the array with a for loop is perfect, as long as you know that\
    \ the array is zero-based and ordered sequentially. So how do you loop through\
    \ an array that is not ordered sequentially?\n\n# Looping through Non-Sequential\
    \ Arrays\n\nThis is a perfect time to use a while loop. Of course, you will be\
    \ using the while loop in conjunction with three other functions: reset(), list(),\
    \ and each(). The reset function sets the current index of the array back to the\
    \ first element available. It takes one argument, and that is the array that you\
    \ would like to reset.\n\nreset($someArray);\n\nThe list function takes two parameters:\
    \ a variable to store the index of the element and a variable to store the value\
    \ of the element.\n\nlist($index, $value);\n\nThe function each() takes one argument,\
    \ and that is the array you wish to iterate on.\n\neach($someArray);\n\nTake a\
    \ look at the following example of how to use these three functions together in\
    \ a while loop to iterate through a non-sequential array.\n\n```\n<php\n$board\
    \ = array(\"a\", 7 => \"b\", 25 => \"c\", 50 => \"d\");\nreset($board);\nwhile(list($index,\
    \ $value) = each($board)) {\n  echo(\"Index = \" . \\$index . \", Element = \"\
    \ . \\$value . \"<BR>*\");\\n}\n?>\n```\n\nThe results of the example above appear\
    \ exactly like Figure 6.3, though the indexes in this particular array are not\
    \ in a sequential order. Calling the reset() function in this example is quite\
    \ unnecessary because, since the array has been created, the current index is\
    \ obviously the first available element. But it is good practice to get into it,\
    \ because you might end trying to loop through an array and it could be starting\
    \ in the middle of it, and that would be no good."
