    # Operators


    An operator is used to determine a value by performing an operation on one or
    more values. Without operators you would not be able to compare values of variables,
    perform mathematic operations, concatenate strings, manipulate bits, or even assign
    a value to a variable. That doesn''t leave much of anything that you can do, it?


    # Note


    Operators in PHP are similar to those in other languages such as C/C++.'
