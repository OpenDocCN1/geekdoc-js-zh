  md: "Chapter 8 = GD Graphics Overview\n\n# Creating and Using a New Image\n\nTo\
    \ create new images, GD offers you two functions. Both of these functions take\
    \ two arguments, width and height, and they both return a resource to the image.\n\
    \n+   - ImageCreate(width, height)\n- ImageCreateTrueColor(width, height)\n\n\
    GD also offers functions to create images from existing files, but you will learn\
    \ about later in this chapter. First take a look at the ImageCreate() function.\n\
    \n# Note\n\nA resource to image is just a chunk of memory in which the image is\
    \ stored. In PHP you work in memory to manipulate images instead of a GUI like\
    \ Paint Shop Pro.\n\nImageCreate() creates a new blank image with width number\
    \ of pixels across, and height of pixels tall. The color palette that ImageCreate()\
    \ uses when creating an image is an indexed-color palette, meaning that the number\
    \ of colors in the palette will be 256.\n\nRemember in Chapter 3 when image types\
    \ and compressions were discussed? The indexed-color palette uses a color table\
    \ to determine the specific color. These types of images are really good for images\
    \ that have flat colors or text and they are especially good with simple shapes.\
    \ You can save these images as .png files, and if GD ever supports the .gif file\
    \ format again you will be able to save them as .gif files.\n\n# Caution\n\n>\
    \ If you save an 8-bit image (also referred to as an indexed-color palette image)\
    \ as a .jpeg you will end up with quite large file sizes and blotchy images.\n\
    \nTake a look at an example for creating a blank image:\n\n```\n<<?php\nif(!extension_loaded('gd'))\n\
    {\n    if(strtoupper(substr(PHP_OS, 3)) == \"WIN\")\n    {\n        dl('php_gd2.dll');\n\
    \    }\nelse\n{\n    dl('gd.so');\n}\n```"
