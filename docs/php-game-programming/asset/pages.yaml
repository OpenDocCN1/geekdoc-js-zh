  md: '# Graphics and HTML


    # The File Formats


    The .jpg file format, pronounced "jay-peg", is best used when you want to display
    photographs because it supports a full 24-bit color palette. It is a "lossy" compression
    algorithm, meaning the algorithm that compresses the color information crunches
    the files in size but the image quality takes a hit. Most of the time you cannot
    see the difference in image quality, unless you''re printing the graphic on a
    professional image setter, which we aren''t going to do.


    The .gif (Graphics Interchange Format) file format is designed to handle a 256-color
    palette. When .gif compresses it uses a "lossless" compression algorithm. This
    means that the compression makes the file smaller in a way that the original image
    can be reconstructed bit for bit. To do this it remaps the colors in an image,
    using what is called a Color Look Up Table (CLUT) to new colors in a 256-color
    palette. Then the image is compressed using Run Length Encoding (RLE). RLE is
    not efficient to compress images if there are many changes in color across a line
    of pixels, but it does a bang-up when a row of pixels has many pixels of the same
    color.


    .gifs also support transparency. You do this by defining one of the colors in
    the CLUT to be a transparent color. Then any pixels in the image that are mapped
    to that particular color become transparent. This is very handy for setting images
    on top of other images or having a single image that can be shown with several
    different backgrounds. Transparencies also allow you to make odd-shaped images,
    as arrows or circles, that don''t show a rectangular frame.


    Not only does .gif support transparencies, but it also supports multiple images.
    Meaning that you can have frames and multiple images compressed into the same
    file. This means that you can create little animated images.


    # Tip


    > When choosing a color for a transparency, use bright purple, bright pink, or
    bright green these colors normally don''t show up in an image.


    The final supported format for images is .png (Portable Network Graphics), pronounced
    "ping". This format was developed to replace the older and simpler .gif format.
    .png has four main advantages over the .gif: alpha channel support, gamma-correction,
    better interlacing, and better compression. However, .png does not support animated
    frames, so if you want an animated image you must use .gif.png was developed to
    be a single-image format only.


    .png compression is superb because it supports true color, grayscale, and palette-based
    images. .jpg supports the first two, and .gif supports the third. .pngs usually
    get 5% to 25% better compression than .gif files.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Chapter 3 = I Have Conquered the Server, Let Me at the Code!


    # Caution


    If your .png files are saved using the true-color mode, they will often be larger
    then expected. Make sure you use the palette-based mode when saving simple images.


    .png supports transparencies like .gif, but it does this in a different way. Instead
    of specifying an alpha channel in the CLUT, grayscale, and a mask channel. All
    three .png image types (true-color, grayscale, and palette) can store an alpha
    channel. What does this mean? Well, where .gif stores a 3-bit RGB value for the
    transparency color for every pixel, .png stores a 4-bit RGBA value for every pixel.
    You may be wondering why this is different from the .gif transparency. When a
    .gif is placed over a background and it has transparency values, you might see
    some jagged edges around the image where it meets the background. But when a transparent
    .png file is placed over a background, no artifacting occurs. A great example
    of this is when you have an image with a drop shadow, like in Figure 3.3.


    Now that you see the difference between the images I know you are asking yourself,
    “Okay it looks better, but he said it stored an extra bit of information. Won''t
    this make the file size bigger?” And the answer is yes, but only if you use the
    alpha channel in an excessive way. So, if you have a .png alpha palette and want
    four levels of transparency, you have to use four different palette entries. But
    since for the majority of cases youll need only one level of transparency, this
    won''t be a problem and the .png will always come out to a comparable size.


    Now that all of these graphics are available to you, how will you know which one
    to use? The answer is very simple: use .jpg if you are displaying something with
    a full color palette that has many changing colors. Use .gif if you want to do
    a small animation or transparency. Use .png if you don''t want to use .gif, since
    you can get the same results with .pngs as you can with .gifs.


    ![](img/21371e23636acf076ec4949f8b4c40f7_54_0.png)


    **Figure 3.3** .gif versus .png transparency.'
  merge: -1
