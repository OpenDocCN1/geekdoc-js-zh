  md: '# CHAPTER 10


    # PHP AND SOCKETS


    +   - Socket Basics

    - Creating a Server

    - Creating a Client


    In this chapter you will explore the fascinating and sometimes confusing world
    of sockets. Sockets must be one of the most underused components in PHP. Today
    you''ll take a look at how to create a server to which a client can connect, how
    to connect to a server from a client using sockets, and how to process information
    on the server and send it to the destination client.


    Believe it or not, you have been using sockets the entire time you''ve programming
    in PHP. The server is the HTTP server that you connect to, and the client is the
    Web browser you are connecting to the server. This is a single client/server relationship.


    # Socket Basics


    PHP uses the Berkeley sockets library to make its connections. You can think of
    a socket as nothing more than a data structure. You use this socket data structure
    to start a conversation between a client and a server. The server is always listening
    to open a new conversation. When a client wants to talk to the server, it opens
    a conversation through a specific port on which the server is listening. When
    the server receives the client''s request it completes the connection, thus completing
    the cycle. Now the client can send information to the server and the server can
    send information to the client.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Chapter 10 = PHP and Sockets


    To create a socket you will need three variables: a protocol, a socket type, and
    a common protocol type. There are three protocols that you can choose from when
    creating a socket type. Take a look at Table 10.1 for the names of the protocols
    and a description of what each protocol does.


    When you create your own server you will use the AF_INET protocol. There are five
    socket types to choose from the Berkley socket library. Please refer to Table
    10.2 for the constant and a description of the socket type.


    The final element to creating a socket is to define the type of common protocol
    that the connection should use. Table 10.3 lists the name and the description
    of the three common protocol types.


    | Table 10.1 Protocols |

    | Name/Constant | Description |

    | AF_INET | The most common of the protocols that are used when creating sockets.
    AF_INET uses TCP or UDP and an IPv4 address. |

    | AF_INET6 | Similar to the AF_INET but uses an IPv6 address instead of an IPv4
    address. |

    | AF_UNIX | A local communication protocol. This is specific to UNIX and Linux,
    and it uses the file system to define its socket connections. This protocol is
    rarely used. When it is, the client and server are usually on the same machine.
    |


    | Table 10.2 Socket Types |

    | Name/Constant | Description |

    | SOCK_STREAM | This socket provides sequenced, reliable, full-duplex connections
    based on byte streams. This is the most common socket type. This is also the socket
    type that the TCP protocol uses. |

    | SOCK_DGRAM | This socket type provides connectionless, fixed-length transmissions
    datagrams. This socket type is fairly unreliable. UDP uses this socket type for
    its connections. |

    | SOCK_SEQPACKET | This socket provides a two-way, reliable connection for sending-length
    transmissions. The receiver is required to read the entire packet for every read
    call when using this socket type. |

    | SOCK_RAW | This socket type provides raw network protocol access. The ICMP common
    protocol (ping, traceroute, and so on) uses this socket type. |

    | SOCK_RDM | This socket type is rarely used and is not implemented on most operating
    systems. This provides a datagram layer that does not guarantee the ordering of
    its packets. |'
