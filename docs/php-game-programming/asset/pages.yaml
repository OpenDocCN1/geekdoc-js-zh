  md: '# 118 Chapter 6 = Arrays!


    Now you have a directory set up you can create a new PHP file. I recommend following
    a regular naming scheme. The default page in a directory should be named index.php
    or default.php. You can use whichever you like. Since the game will only be in
    one file I will just name it index.php.


    The next step you need to take is to define all of your constants and constants,
    and include the common functions that you use in all of your games. The first
    set of constants you need is four game states. The first of the four states is
    to tell you when the game is in starting, the second lets you know when the game
    is in play, the third tells you if someone won the game, and the fourth and final
    state tell you if someone has lost the game.


    ```

    // Includes

    include("common.php");

    // Game States

    define("GAME_START", 0);

    define("GAME_PLAY", 1);

    define("GAME_WIN", 2);

    define("GAME_OVER", 3);

    ```


    For tic-tac-toe, the only other defines needed are for the "X" image and one for
    the "O" image.


    ```

    // Images

    define("X_IMAGE", "images/X.gif");

    define("O_IMAGE", "images/O.gif");

    ```


    The only reason you define these is because it makes easy if you want to change
    the images later, plus it saves you typing when you create the render function
    to display your board to the browser. You will also need three global variables
    for all of your functions to use. The first stores what state the game is, the
    second states of the board, and the third stores the difficulty level is of the
    computer A.I.


    ```

    // Globals

    global $gGameState;

    global $gBoard;

    global $gDifficulty;

    ```


