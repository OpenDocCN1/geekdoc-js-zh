  md: '# Chapter 4 = Say Hello to PHP


    The results of the preceding example are:

    ruts@datausa.com is a valid email address

    Username: ruts

    domain: datausa

    Top Level: com


    So what did this do exactly? Epreg() verified the pattern, the original string
    was stored in the first index of the array. The first parenthetical substring
    from the pattern is stored in the second index of the array. The first parenthesized
    substring, of course, would be the username, ruts. Then it matched the "@" symbol
    and proceeded to match the third argument in the pattern. After it found a match
    for the third argument it created another index in the array containing the domain
    name, datausa. Finally it matched the top-level domain name, com, and created
    the final index in the array.


    ereg() also has a function called eregi(), eregi() functions exactly the same
    as preg() but ignores case when looking for matching patterns.


    Now take a look at the two functions for searching and replacing strings: ere_replace()
    and preg_replace(). Both of these functions search for a given pattern and replace
    all occurrences of that pattern with the new string you specify; preg_replace
    does exactly the same as ere_replace(), but it isn''t case sensitive. Each of
    these functions takes three arguments:


    ```

    string_replace(string pattern, string replacement, string source);

    ```


    You specify a pattern that you would like to look for, a replacement for any occurrences
    of that pattern, and the source you are searching. These functions do not have
    an optional argument, but they do have something similar. Any parenthetical substring
    in the pattern will be stored in a buffer that you can access by referencing it
    \1. There are nine slots that you can use (\1...9). Take a look at the following:


    ```

    $strSource = "Games Are Great";

    $strModified = ere_replace("Game", "G\1s", $strSource);

    echo($strModified);

    ```


    This example takes the string, "Games Are Great", and searches for a pattern of
    "G(ame)s", where it finds a match at the beginning of the string and replaces
    the match with "games", and returns the modified string. The results look like
    this:


    ```

    gameS Are Great

    ```


    You can reference the "@am" characters by using the \1 because it is a parenthetical
    string. If the pattern was broken up like, "G(am)(es)", then "am" would be referenced
    as \1, and "es" would be referenced as \2.'
