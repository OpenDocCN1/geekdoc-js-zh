- img_proc: true
  md: "We won't be concerned with every class in the reflection API, a general overview\
    \ will help put things in perspective. Looking at this list, you may suppose that\
    \ the Reflection class is the parent class of all reflection classes, but there\
    \ is no class ancestor common to all reflection classes. On the other hand, the\
    \ Reflector interface is shared by all classes except Reflection and ReflectionException.\
    \ As far as class hierarchies are concerned, ReflectionMethod extends Reflection,\
    \ ReflectionObject extends ReflectionClass, and ReflectionException extends Exception.\n\
    \nOur concern is with objects, so we won't spend any time on the method Reflection.Object\
    \ shares all the methods of ReflectionClass; the only difference between these\
    \ classes is that instance rather than a class name as a parameter—using an instance,\
    \ you can introspect a class without knowing anything about it, even its name.\
    \ The class Reflection is derived from Exception, a class we've already examined.\n\
    \nWe're principally interested in Reflection, ReflectionClass, ReflectionMethod,\
    \ ReflectionParameter, and ReflectionProperty.\n\n# The Reflection Class\n\nThe\
    \ Reflection class has two static methods: export and getModifierNames. We'll\
    \ discuss getModifierNames later in this chapter, but let's take a look at the\
    \ export method—a quick way to introspect a class—to get a taste of what Reflection\
    \ can tell us. Reflection requires a ReflectionClass object as the parameter to\
    \ the recently the export method. Let's use the SOAPFault class as an example,\
    \ since we encountered it in Chapter 12. The export method is static. As you'll\
    \ recall from Chapter 11, static methods are invoked by using the class name and\
    \ the scope operator. Here's the code to export:\n\n```\nReflection::export(new\
    \ ReflectionClass('SOAPFault'));\n```\n\nIn this example, a class is passed to\
    \ the ReflectionClass constructor, and the resultant object is the argument to\
    \ the export method of the Reflection class. The output of the export method is\
    \ shown in Listing 14-1.\n\n```\nClass [internal:soap] class SoapFault extends\
    \ Exception ] {\n- Constants [0] {}\n- Static properties [0] {}\n- Static methods\
    \ [0] {}\n- Properties [4] {\n  Property [ <default> protected $message ]\n  Property\
    \ [ <default> protected $code ]\n  Property [ <default> protected $file ]\n  Property\
    \ [ <default> protected $line ]\n}\n```"
