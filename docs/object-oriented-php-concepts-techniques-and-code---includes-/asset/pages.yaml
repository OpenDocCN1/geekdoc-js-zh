  md: 'When constructing the PageNavigator instance, you pass it the four required
    parameters and let the two additional parameters—$maxpages default to 4 and an
    empty string. This means the navigator will show links to a maximum of four pages
    and that there are no additional name/value pairs for the query string. (As promised
    in Chapter 7, you will learn more about $params in Chapter 9. However, you may
    already have surmised this variable can be used to replace the hard-coded directory
    name given in Listing 8-1).


    You do not need to set the first parameter name; it has a default value of offset.
    By setting the name here, you make it clear that this is the name of one required
    name/value pair, and that it can be changed if desired.


    Finally, the HTML code that makes up the navigator is returned and displayed in
    the web page.


    # Where to Go From


    Using the PageNavigator class solves two problems: it alleviates the demand on
    server resources and improves the aesthetics of the web page display. Only a limited
    number of images are displayed at any one time, thus reducing the page demands
    on the server. Aesthetic requirements are satisfied by reduced page length.


    As noted on many occasions, the real value of objects is in their reusability.
    Through the use of CSS, you''re able to adjust the appearance of the page navigator
    to match it to a variety of situations. By using span and div tags, you can manipulate
    the look and feel of the navigator so it blends easily with any design. The number
    of items shown on each page and the number of pages accessible at any one time
    can be set to any number desired.


    We''ve seen that the PageNavigator class''s design is adaptable and that you can
    use it to step through an array of images, but what about its use in other situations?
    A navigator is much more commonly used with database queries that return a large
    number of records. In the next chapter, we''ll develop a database class and then
    see how well the PageNavigator class can handle a large result set. The ability
    to reuse the navigator class in different circumstances will be a true test of
    its robustness.'
