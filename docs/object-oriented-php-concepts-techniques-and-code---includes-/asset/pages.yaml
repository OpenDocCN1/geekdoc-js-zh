- img_proc: true
  md: 'You can''t permanently add a UDF to a database, but the ability to create them
    certainly compensates for the limited number of functions in SQLite, especially
    those related to date manipulation. In fact, my this way of subtracting dates
    is much easier to implement because it doesn''t involve looking up the quirky
    syntax of functions such as the MySQL SUBDATE function earlier. However, UDFs
    lack the performance benefits of built-in functions.


    # Uses and Limitations of SQLite


    No database can be all things to people. SQLite supports any number of simultaneous
    readers, but a write operation locks the entire database. Version 3 offers some
    improvement in this respect, SQLite is best used in applications with infrequent
    database updates, like the one described here.


    Of course, if access control is important, SQLite is not the appropriate tool.
    GRANT and REVOKE are not implemented, there can be no database-enforced user restrictions.


    However even a relatively modest application can make use of the advanced capabilities
    of SQLite. With the application discussed in this chapter, we haven''t had to
    sacrifice anything by using SQLite rather than MySQL. Unavailability of a timestamp
    field is remedied by use of a trigger. A UDF makes up for SQLite''s lack of date
    manipulation functions. In fact, overall, we achieve better performance because
    there is no overhead incurred by a database server, and maintenance is reduced
    through the use of triggers.


    Not only has using SQLite simplified our code through the use of views, triggers,
    and UDFs, as well as by extending the OO interface, but it also makes for cleaner
    code through its more varied ways of querying a database. In these or similar
    circumstances, SQLite is definitely a superior choice.'
