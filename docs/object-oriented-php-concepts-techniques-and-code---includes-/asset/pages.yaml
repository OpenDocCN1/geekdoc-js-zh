- img_proc: true
  md: '# Do We Really Need Objects?


    The ability of any server-side scripting language to “include” files within a
    page reduces initial work and ongoing maintenance. For instance, suppose a website
    contains a menu at the top of each web page, and this menu is identical throughout
    the site. You could cut and paste the appropriate code into every page, but this
    is so cumbersome and counterproductive. It’s much better to write the code once
    and use a server-side scripting language to insert the menu where it’s needed.
    That way, when an update is required, you can make change to one file rather than
    changing many files. This makes site-wide updates much easier.


    You could summarize this approach as “include and reuse; don’t rewrite.” In a
    sense, object-oriented programming (OOP) is an extension of this concept. Objects
    simply web development by eliminating the cut, paste, and adapt existing code.
    If the usefulness of OOP were evident, it would meet with little resistance. This
    has not been the case, however. Let’s look at some of the most interesting objections
    to OO web development without removing any doubts you may have.


    # Just a Scripting Language


    PHP is a scripting language. Some of the objections to OOP focus on this fact.

    Some scripting languages simply string together a series of commands and for this
    reason are sometimes referred to as “glue.”¹ A shell script, for example, may
    combine a number of operating systems in order to eliminate the tedium of repetitively
    typing the same thing. The variety of requirements of a web page might support
    the view that PHP is this sort of scripting language—it provides a glue to hold
    together the disparate elements of a web page. If all PHP does, then there is
    probably no need for it to be object-oriented. In fact, object orientation even
    with a degree of condescension, OOP capabilities are best left to full-blown programming
    languages and are unnecessary for a scripting language. An OOP language is a contradiction
    in terms; it’s a language’s “getting above itself.”²


    To extent, the limited OOP capabilities of PHP 4 reinforced the view that a scripting
    language shouldn’t attempt to be object-oriented. PHP 4 looked like a half-hearted
    attempt to jump on the OOP bandwagon. Because it was missing some of the major
    elements associated with OOP, it was easy to dismiss OOP as a wannabe OO language.
    It simply lacked the tools of a serious OO language. In light of the much-improved
    OOP capabilities of PHP 5, this needs to be readdressed.


    > ¹You’ll seen this description on the PHP site (http://php.net). In the FAQ on
    installation, PHP is described as “the glue used to build web applications.

    ² For a recent variation on this argument say “James Gosling: Java Is No Serious
    Threat from PHP, Ruby C#,” available at www.sys.com/read/193146.html. There, James
    Gosling argues “they are scripting languages and get their power through specialization:
    they just generate web pages.” (Accessed March 19, 2006).


    Chapter 1'
  merge: -1
