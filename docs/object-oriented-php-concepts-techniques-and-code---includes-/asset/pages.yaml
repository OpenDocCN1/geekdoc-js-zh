  md: "# Triggers\n\nFor those programmers who pride themselves on their laziness,\
    \ triggers are a wonderful thing. By creating a trigger you can get maximum effect\
    \ with mini-mum effort.\n\nTriggers are activated by an INSERT, DELETE, or UPDATE\
    \ SQL statement. They are often used to maintain referential integrity and avoid\
    \ orphaned records—for example, deleting an invoice might trigger deletion of\
    \ all related invoice items. We're going to create three triggers for our application:\
    \ one to mimic a timestamp field, another to show the advantages of laziness,\
    \ and finally a trigger to demonstrate how a view can be “updated”.\n\nThe triggers\
    \ are shown in Listing 15-3. They are activated whenever a record in the tblresources\
    \ table is added or updated.\n\n```\nCREATE TRIGGER insert_resources AFTER INSERT\
    \ ON tblresources\nBEGIN\n  UPDATE tblresources SET whenaltered = DATETIME('NOW','LOCALTIME')\n\
    \  WHERE id = new.id;\nEND;\nCREATE TRIGGER update_resources AFTER UPDATE ON tblresources\n\
    BEGIN\n  UPDATE tblresources SET whenaltered = DATETIME('NOW','LOCALTIME')\n \
    \ WHERE id = new.id;\nEND;\nCREATE TRIGGER add_date AFTER INSERT ON tblresources\n\
    BEGIN\n  UPDATE tblresources SET whenadded = DATE('NOW','LOCALTIME')\n  WHERE\
    \ id = new.id;\nEND;\nCREATE TRIGGER delete_link INSTEAD OF DELETE ON specific_link\n\
    FOR EACH ROW\n  DELETE FROM tblresources\n  WHERE id = old.id;\nEND;\n```\n\n\
    Listing 15-3: Triggers\n\nThere is no need to remember to update the whenaltered\
    \ field each time a change is made to a record—the insert_resources and update_resources\
    \ triggers will do this for you. The current date and time will be added in the\
    \ background. Effectively, this field will now function like a MYSQL TIMESTAMP.\n\
    \nLikewise with the add_date trigger, also shown in Listing 15-3. We want to highlight\
    \ new links. This trigger makes it possible to capture the date a link is added.\
    \ By using a trigger we don't have to worry about forgetting to maintain this\
    \ field, and we don't have to write additional code each time a record is added."
  merge: -1
