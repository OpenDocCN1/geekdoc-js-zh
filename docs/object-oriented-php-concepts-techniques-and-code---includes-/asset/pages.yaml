  md: "Our call to the Google API is enclosed within a try block so there must be\
    \ a corresponding catch. A SOAPFault is another object in the SOAP extension.\
    \ It functions exactly like an exception.\n\n```\ncatch (SOAPFault $exception){\n\
    \  echo $exception;\n}\n```\n\n# Testing the Functionality\n\nView the dosearch.php\
    \ in a browser, add the query string ?criterion=linux to the URL, and the SoapClient\
    \ will return a result from Google's API. You should get site-specific search\
    \ results that look something like those shown in Figure 12-1.\n\n![](img/c8663459ed204f27b8d015c8a3d2acad_127_0.png)\n\
    \nFigure 12-1: Search results\n\nThere are hyperlinks to the pages where the search\
    \ criterion was found, along with snippets of text surrounding this criterion.\
    \ Within the snippet of text the criterion is bolded.\n\nAs already mentioned,\
    \ this is not the solution for a high-traffic site where many searches will be\
    \ initiated. Nor is it a solution for a newly posted site. Until a site is indexed\
    \ by Google, no search results will be returned. Likewise, recent changes to a\
    \ site will not be found until the Googlebot visits and registers them. However,\
    \ these limitations are a small price to pay for such an easy way to implement\
    \ a site-specific search capability."
