  md: '# 6


    # # THE THUMBNAILIMAGE CLASS


    ![](img/c8663459ed204f27b8d015c8a3d2acad_54_0.png)


    Images are often of unequal dimensions, and their file sizes can vary greatly.
    This inconsistency creates problems when downloading and displaying a group of
    images because one large image can take up the entire screen, dwarfing smaller
    images. Also, if image files are large, they can slow down downloading to an unacceptable
    pace.


    One solution to the problem of inconsistently sized images is to create a thumbnail
    image class, which creates small images (thumbnails) of equal size. By reducing
    the quality of an image, this class will be able to further reduce file size and
    enhance download times.


    Since we intend to use the DirectoryItems class with directories of images, this
    supporting class takes the next step toward improving the utility of the DirectoryItems
    class. Furthermore, developing this class should give you a good idea of when
    a method should be private, how to limit access to data members with set and get
    methods, how to set default values for data members upon declaration, and how
    to ensure that resources are disposed of properly.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# What Does a Designer?


    To determine what the DirectoryItems class should do, consider how web designers
    create thumbnail images. They typically open an image file in a graphic editor,
    reduce its dimensions (and perhaps its quality), and then save the file under
    a different name.


    For ease of placement on the screens, in a group all are reduced to approximately
    the same thumbnail size as each other. In other words, the thumbnail for a large
    image is roughly the same size as the thumbnail for a medium-sized image. The
    image is typically reduced to a predetermined maximum dimension while constraining
    its proportions so as not to distort it. This maximum dimension is usually applied
    to the width or height, depending upon whether image''s orientation is landscape
    or portrait. While this maximum will vary, the maximum size of a thumbnail should
    be that it is small enough to download quickly, but large enough for the viewer
    to form an accurate impression of the full-sized picture. Once created, the thumbnail
    is typically displayed in a web page, where it might function as a hyperlink to
    its full-sized counterpart.


    # Mimicking the Designer


    Having considered how the web designer handles thumbnails, we can better determine
    how a thumbnail class should behave. We will build a class that mimics how a designer
    creates a thumbnail but with certain improvements.


    When the designer creates a thumbnail, he writes a separate file to disk. While
    it might make sense in some cases for a class to create thumbnail images only
    once and then save to disk, we will create them on the fly, as needed, and output
    them to the browser without saving them. This approach allows us to create a simpler,
    and in some respects, a more flexible class. We won''t have to worry about where
    to store the thumbnails or whether a thumbnail has already been created for a
    specific image.


    > The downside of this approach is that it requires more server-side processing,
    and if there are a large number of images per web page, it may degrade server
    performance. We will solve this problem in Chapter 7.


    # Help from PHP Functions


    When creating the thumbnail image class, the equivalent of the designer''s graphic
    editor is the existing PHP image function library, which contains the tools you
    need to manipulate common image types. PHP''s imagecreatefrom return a resource
    making it possible to programmatically copy an image, reduce its dimensions, and
    also reduce its quality if necessary.


    Thus you have your editor and know how class should behave. You know too that
    you want to preserve the proportions of an image when you create a thumbnail and
    that you want to reduce all images to the same thumbnail size. You''re all set
    to start coding.'
