  md: '# Brief Overview


    Relevant sections of code will be reproduced here, but, as usual, the entire application
    is available for download on the companion website. The front end for this application
    will display alphabetically ordered website links, as shown in Figure 15-1.


    ```

    Derrick Rethans

    #nFirefox - for a better web experience

    I

    blog - Isa Alishenskyky

    International PHP Magazine

    J

    json/php

    L

    Linux Journal

    Linux Magazine

    N

    No Scratch Press - publisher of computer books that make a difference

    ```


    Figure 15-1: Resource links


    An alphabetical navigation of hyperlinks will make any specific link easily accessible.
    Recently added links will be highlighted, making the list even more useful for
    regular visitors.


    A submission form will allow visitors to suggest additional links. These links
    will not appear on the site until they have been reviewed. There will be a back
    end to review and maintain links.


    # Directory Structure


    The number of files in the download for this chapter, it''s helpful to make a
    few comments about the way the files are organized. Download and decompress the
    files to follow along.


    The front-end capabilities of this application are accessible from the links in
    the index.php file in the top level directory and the back end is finding the
    index.php file in the linkmanagement directory. On a production server the linkmanagement
    directory would be password protected but for of use that has not been done here.


    For reasons of version compatibility, the database file itself is not included
    with the downloads. It should be installed in the dbdir directory. Version 2.8.1
    of SQLite was used to test this application (but if you are already running with
    another version of SQLite you shouldn''t run into any problems). Install the database
    from the db_install_script.php file (also included in the dbdir directory). Instructions
    on how to do this will follow shortly.'
