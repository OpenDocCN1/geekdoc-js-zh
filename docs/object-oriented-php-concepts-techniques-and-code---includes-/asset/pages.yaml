  md: '# WHAT A TANGLED WEB WE WEAVE


    ![](img/c8663459ed204f27b8d015c8a3d2acad_20_0.png)


    Creating a web page ain''t what it used to be. Setting up a website today usually
    means incorporating numerous technologies, among them (X)HTML, CSS, JavaScript,
    SQL, and a server-side scripting language. But that''s not all—a web page also
    runs within a different browser. There are several different browsers, and each
    behaves differently. Not only that, but different versions of the same browser
    can act differently, and even the same version of the same browser can''t be relied
    upon to behave when running on different operating systems, with different hardware,
    different screen resolutions, and so on.


    Add to this various configuration files—for the scripting language and the web
    server, for example—which also affect the display of a particular web page, and
    you can see that the web developer''s lot is not a happy one.


    It may not be readily apparent that an object-oriented (OO) approach is a means
    of simplifying this situation. OO development might be seen as symptomatic of
    the larger problem. To the embattled web developer an OO approach can appear to
    be just another complication of what''s already a messy business.'
  merge: -1
