    ```


    If you are currently on the first page, moving to a previous page or to the first
    page wouldn''t make sense. These variables will be used in place of active hyperlinks.
    Inactive links will be enclosed by span tags. Assigning a CSS class name to these
    spans allows their appearance to be manipulated by a style sheet.


    $firstname and $params are data members that will form the query in each hyperlink
    in your navigator.


    ```

    //must match $_GET[''offset''] in calling page

    private $pageparameter = "offset";

    //use as &amp;name=&value; pair for getting

    private $params;

    ```


    $firstparameter is assigned a default value of "offset". While the additional
    parameters in $params may or may not be added to the query string, the use of
    the "offset" parameter is not optional; your variable''s name will always be matched
    by a $_GET[''offset''] in the page that contains your navigator. $firstparameter
    will perform the same function as start in a Google query string—you will always
    need to know where the current page is relative to the start page. The variable
    $params will hold any other name/value pairs that may be needed as part of query
    string (You''ll learn more about this in Chapter 9.).


    The next set of variables are string values that hold the CSS class names for
    the page navigator and its elements.


    ```

    //css class names

    private $divpageparameter = "navigator";

    private $pageisdisplayname = "totalpagesdisplay";

    private $inactiveparams = "inactive";

    ```


    You''ve assigned default values to each of these variables, they all have set
    and methods so a client programmer can change them in order to match existing
    CSS classes if need. $divpageparameter is the name of the div tag encompasses
    the complete navigator. $pageisdisplayname allows you to separately manage the
    display of the message relating the current page and total number of pages, such
    as page 4 of 12. You only need one class name for all of your inactive spans,
    because you want them all to have the same look.'
