  md: "What is immediately noteworthy about this class is the use of the keyword static\
    \ to modify a data member. Identifying a variable as static means that it is shared\
    \ among all instances of a class. If one static variable is, it is changed for\
    \ all instances. Unique variables are created each time a class is instantiated,\
    \ and they belong to that specific instance. Not so with static variables—they\
    \ belong to the class as a whole (and for this reason they are sometimes referred\
    \ to as class variables). Let's look at the code for the constructor and see how\
    \ this can be useful.\n\n# Class-Conscious Variable\n\nThe parameters passed to\
    \ the constructor are those necessary to make a database connection using the\
    \ built-in PHP function, mysql_connect. Again, this method is a wrapper method\
    \ but a few additional bells and whistles.\n\n```\npublic function __construct($hostname,\
    \ $username, $password) {\n    if(MySQL::$instances == 0) {\n        $this->connection\
    \ = mysql_connect($hostname,$username,$password) or\n        die (mysql_error()\
    \ . \" Error no: \".mysql_errno()\");\n        MySQL::$instances = 1;\n    }else{\n\
    \        $msg = \"Close the existing instance of the \" .\n        \"MySQL class.\"\
    ;\n        die($msg);\n    }\n}\n```\n\nThis class will not be instantiated if\
    \ there is already an existing instance. If the $instances variable has a value\
    \ of 0, a connection is made to the server, and the value of this static variable\
    \ is set to 1. Checking the value of this static variable makes sense because\
    \ it is shared among all instances, it's available to all instances, and it is\
    \ the same for all instances.\n\nThe syntax for referencing a static variable\
    \ ● is different from when to reference a normal data member. It would not make\
    \ sense to use the pseudo-variable $this with $instances, static variables belong\
    \ to the class rather than a specific instance. Quite simply, the class name is\
    \ used, and the arrow operator is replaced by a double colon—the scope resolution\
    \ operator.\n\nThe scope resolution operator is principally used when referencing\
    \ static data members or static methods. In Chapter 10 you will see the two occasions\
    \ when this operator is used, but for you now only concern yourself with its use\
    \ static data members. When referencing a static variable within its class, you\
    \ also have the option of replacing the class name with the keyword self. In this\
    \ case, the expression self::$instances is equivalent to MySQL::$instances. Static\
    \ members referenced outside the confines of their class must use the class name.\
    \ You don't need to worry about that here, since $instances is private and cannot\
    \ be referenced outside the MySQLConnect class."
