  md: 'SQLite classes. We quickly reap the benefits of throwing exceptions without
    having to extend the SQLite database class.


    # Methods of SQLiteDatabasePlus


    Because a PDO connection can be configured to throw exceptions, we don''t need
    the query methods of our derived class SQLiteDatabasePlus. However, the utility
    methods we added are another matter. The only way to use these methods is to revert
    them as functions. They convert fairly readily, the metadata queries they employ
    as before. The only real difference is that as functions they are not as convenient
    to use. I won''t reproduce them here, but they can be found in the dbfunctions.file
    in this chapter-downloads.


    # Escaping Input


    The cleanData utility method of our derived class incorporated the sqlite_escape_string
    function to escape input before insertion into the database. The equivalent PDO
    method is quote. Be aware that this method not only escapes quotation marks, but
    also includes the item quoted within quotation marks. If you need to manipulate
    data prior to inserting it, quote should only be called prior to insertion. For
    portability reasons, the PHP site recommends preparing rather than quote. We''ll
    investigate this method fully when we discuss statements, in the section "Additional
    Capabilities of PDO" on page 161.


    # Query Methods


    One of the attractions of SQLite is its variety of query methods. If you need
    a quick refresher, see the section "Query Methods" on page 148. In this section
    we''re going to compare SQLite''s query methods to what''s available using PDO.


    The difference between the object models of SQLite and PDO makes a direct comparison
    bit awkward. Principally, querying a PDO connection returns a statement object,
    and this statement effectively becomes a result once it is executed. As already
    mentioned, we''ll cover statements in the section "Additional Capabilities of
    PDO" on page 161, but for the moment we can treat them as identical to result
    sets.


    The five query methods of SQLite are singlequery, execquery, arrayquery, and unbufferedquery.
    We''ll discuss each SQLite method in turn.

    The singlequery method returns a single column as array, bypassing the need to
    create a result set. To mimic it we use a PDO query to return a statement and
    then fetchColumn against this statement. The fetchColumn method can return any
    column in the current row.


    The execquery method of an SQLite result set can execute multiple,-separated rows.
    PDO can easily manage this behavior—in fact this is something that statements
    excel at.


    As you might expect, returning an array in the fashion of arrayquery is also easily
    handled by PDO calling the fetchAll method against a statement.


    The remaining query methods of SQLite, query and unbufferedquery, return SQLiteResult
    and SQLiteResBuffer objects, respectively. PDO statements are comparable to unbuffered
    result sets rather than buffered ones, the'
