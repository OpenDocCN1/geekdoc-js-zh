  md: "```\nif($m->isProtected()) {\n    $this->protectedmethods[$name] = $m;\n}\n\
    if($m->isPrivate()) {\n    $this->privatemethods[$name] = $m;\n}\n```\n\nAgain,\
    \ the code is quite simple. An array of all methods of a class is retrieved using\
    \ the inherited ReflectionClass method getMethods, and each ReflectionMethod object\
    \ is stored in the appropriate associative array, using the method name as the\
    \ array key.\n\nEach array is a private variable with a public accessor method—the\
    \ prescribed by way for retrieving data methods. For example, to examine the public\
    \ methods of a class, you simply call getPublicMethods, which will return the\
    \ array populated by createMethodArrays.\n\nData member arrays are created in\
    \ exactly the same fashion. Your class has createMemberArrays that uses the getProperties\
    \ method inherited from the ReflectionClass to create an array of ReflectionProperty\
    \ object to create arrays of public, private, and protected data members. These\
    \ can, in turn, be retrieved using accessor methods.\n\n# The Constructor\n\n\
    The createMemberArrays method and the companion method for creating an array of\
    \ methods are both private and called from the constructor of the Documentclass.\n\
    \n```\npublic function __construct($name) {\n    parent::__construct($name);\n\
    \    $this->createDataMemberArrays();\n    $this->createMethodArrays();\n}\n```\n\
    \nPlacement of the call to the parent constructor is noteworthy. Because createMemberArrays\
    \ and createMethodArrays both invoke methods of the parent class, it is essential\
    \ that the call to the parent constructor occur first. Doing otherwise results\
    \ in calling methods on a not-yet-existent object.\n\n# Method and Data Member\
    \ Modifiers\n\nIt is essential to know the access modifiers for methods and data\
    \ members of a class. Both the ReflectionMethod and the ReflectionParameter classes\
    \ have getModifiers method that returns an integer with bit fields to flag the\
    \ different access modifiers. Your Documentclass has its own getModifiers method\
    \ that converts these flags to their string equivalents using the static getModifierNames\
    \ method of the Reflection class."
