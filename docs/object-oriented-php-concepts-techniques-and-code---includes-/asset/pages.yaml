  md: "instance. Let's revise the MySQLConnect class to highlight the usefulness of\
    \ static methods. (I'll outline only the major changes here; download the code\
    \ if you want to see them all).\n\nTo begin with, the static data member designed\
    \ to keep track of the number of instances becomes a static data member for holding\
    \ a reference to the class instance.\n\n```\nprivate static $instance = NULL;\n\
    ```\n\nThe constructor still creates a connection, but the access modifier is\
    \ changed from public to private and the test for existing instances is removed.\n\
    \n```\nprivate function __construct($hostname, $username, $password){\n    if(!$this->connection\
    \ = mysql_connect($hostname, $username, $password))\n        throw new mysqli(mysql_error(),\
    \ mysql_errno());\n}\n```\n\nBecause the constructor has been declared as private,\
    \ you can only invoke it from within the class. This may seem like an impossibility\
    \ (how do you get inside a class that you can't create?), but a static method\
    \ provides the means, as shown in Listing 11-4.\n\n```\nstatic public function\
    \ getInstance($hostname, $username, $password){\n    //instance must be static\
    \ in order to be referenced here\n    if(self::$instance == NULL)\n        self::$instance\
    \ = new MySQLConnect($hostname, $username, $password);\n    return self::$instance;\n\
    \    }else{\n        $msg = \"Close the existing instance of the \"MySQL class.\"\
    ;\n        throw new mysqli($msg, self::ONLY_ONE_INSTANCE_ALLOWED);\n}\n```\n\n\
    Listing 11-4: Static method for returning an instance\nin order to reference the\
    \ instance handle inside a static method, the handle itself must be static. If\
    \ no instance exists, the constructor is called and the returned object is copied\
    \ into the static class variable $instance. The getInstance method then returns\
    \ a reference to this static data member.\n\nNow, instead of directly creating\
    \ an instance of the MySQLConnect class by calling the constructor, you invoke\
    \ the getInstance method to perform that for you.\n\n```\n$instance = MySQLConnect::getInstance('localhost',\
    \ 'user', 'password');\n```"
  merge: -1
  pgno: 116
- img_proc: true
  md: 'It was noted earlier that static methods can only reference static data members.
    Conversely, static methods are prohibited from referencing regular data members.
    This makes sense when you remember that regular data members belong to and are
    created when objects are instantiated. By definition a static method does not
    require an object, so these non-static data members do not exist. Likewise, as
    you saw earlier, a static method cannot use the pseudo-this; likewise, $this refers
    to the current instance.


    A singleton class should also allow clones. You''ll see how this is done in Chapter
    13.


    # When Implemented?


    This revised MySQLConnect class has exactly the same functionality as the original.
    Apart from when an instance is created, there is no other change to the interface
    of the MySQLConnect class. However, having a copy of the instance stored in a
    static class allows you to return instead of throwing an exception, should an
    attempt be made to create a second instance. This is exactly what some implementations
    of a singleton class do, but it is not always the desired behavior. If the user
    wants to connect to a different server? For this reason, in the section “Making
    Other Connections” on page 68, we chose to force the user to use the current connection
    before creating a new one.


    The coding style of the original implementation may be more direct and more readily
    understood, but having a reference to the class instance could prove useful in
    some circumstances. If the getInstance method receives a request to connect to
    the same host with the same username, why not return the current instance rather
    than throwing an exception?


    Which version is preferable? It is up to you to decide.


    # Where to Go from Here


    The keywords abstract and static and the ability to type hint all capabilities
    that did not exist prior to PHP 5. Creating abstract methods enforces specific
    kinds of behavior, and static methods and data members make the implementation
    of a singleton pattern both easy and effective. Type hinting makes the developer''s
    intentions clear and programmatically enforce them.


    These capabilities are not just syntactic icing on top of a procedural language;
    they are a robust implementation of a fully OO language. PHP may be unable to
    create a true static class, and whether it is truly polymorphic debatable, but
    the issue for PHP is always functionality rather than language purity. There is
    no doubt that it does not suffer in this.


    To this point we have created our own classes from scratch or inherited from existing
    ones defined in the Standard PHP Library (Iterator and Exception). PHP 5 includes
    many other classes defined in the SPL. In the next chapter we''ll use two of them,
    SimpleMLElement and SOAPClient.'
