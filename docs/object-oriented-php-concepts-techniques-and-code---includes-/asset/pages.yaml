  md: '# Google API


    API stands for Application Programming Interface—and is the means for tapping
    into the Google search engine and performing searches programmatically. You need
    a license key in order to use the Google API, so go to www.google.com/apis and
    create a Google account. This license key will allow you to initiate up to 1000
    programmatic searches per day. Depending on the nature of your website, this should
    be more than adequate. A general rule, if you are getting fewer than 5,000 visits
    per day then you are unlikely to exceed this number of searches.


    When you get your license key, you should also download the API developer''s kit.
    We won''t be using it here, but you might want to take a look at it. This kit
    contains the XML description of the search service in the Web Service Definition
    Language (WSDL) and a file of the APIs Reference.html. If you plan to make extensive
    use of the Google API, then the information in the reference file is invaluable.
    Among other things, it shows the legal values for a language-specific search,
    and it details some of the API''s limitations. For instance, a search initiated
    at Google''s site, the maximum number of words an API query may contain 10.


    # AJAX


    This is not the place for a tutorial on AJAX (and besides, I''m not the person
    to deliver such a tutorial) we''re going to make things easy on ourselves by using
    the prototype JavaScript framework found at http://prototype.conio.net. With this
    library you can be up and running quickly with AJAX.


    You''ll find a link to the prototype library on the companion website or you can
    go directly to the URL referenced above. In any case, you''ll need the prototype.js
    file to run the code presented in this part of the chapter.


    # Installing SOAP


    SOAP is not installed by default. This extension is only available if PHP has
    been configured with --enable-soap. (If you are running PHP under Windows, make
    sure you have a copy of the file php_soap.dll, add the line extension = php_soap.dll
    to your php.ini file, and restart your web server).


    Configuring PHP with support for SOAP is not within your control, but you can
    implement something similar to what we are doing here by using the NuSoap classes
    you''ll find at sourceforge/projects/nusoap. Even if you have SOAP enabled, it
    is worth becoming familiar with NuSoap not only to appreciate well-crafted OO
    code, but also to realize how much work this extension saves you. There are more
    than 5,000 lines of code in the nusoap.php file. It takes us us fewer than 50
    lines to initiate our Google search. Furthermore, the SOAP client we created,
    using a built-in class, will run appreciably faster than one created using NuSoap
    (The NuSoap classes are also useful if you need SOAP support under PHP 4).'
