- img_proc: true
  md: 'is especially worth investigating. However, even if you use one database, PDO
    can be helpful for switching between versions. Be warned, though, that it is still
    early days for PDO, and some of the drivers may lack some functionality.


    # Pros and Cons


    The promise of database abstraction is the ability to access any database using
    identical methods. This gives developers the flexibility to change the back-end
    database with minimal impact on code. Another advantage of an API such as PDO
    is a reduced learning curve. Instead of having to learn the specifics of each
    different database, you can learn one interface and use it with any database.
    Lastly, with an API you may be able to use features not available to the native
    database—prepared statements, for example—more after that.


    On the negative side, a data-access abstraction layer may affect performance and
    may deprive you of the ability to use non-standard features natively supported
    by specific databases. It may also introduce an unwanted degree of complexity
    into your code.


    The best way to make a decision about the suitability of PDO is to try. Converting
    the SQLite application created in Chapter 15 is a good way to do this. The SQLite
    application makes use of a limited number of the features of PDO, so we''ll also
    look at some of PDO''s additional capabilities. We won''t look at every detail,
    but this chapter will show you enough to allow you to make an informed decision.


    > If you are running PHP 5.x you can install PDO using PEAR. See the PHP site
    for instructions. If you install the latest version of PDO you will be able to
    use SQLite 3.


    # Converting the SQLite Application


    The first thing to realize is that we cannot use our derived class SQLiteDatabaseplus
    with PDO because the PDO driver for SQLite doesn''t know anything about our derived
    class. We would, of course, extend the PDO class to incorporate the methods we
    added to SQLiteDatabaseplus, but doing so is contrary to the whole purpose of
    a database abstraction layer. Taking route would be an implicit admission of defeat
    right from the start—there would be not one interface for all databases, but instead
    any number of derived interfaces.


    # Code Changes


    As usual, a complete version of the code discussed in this application is available
    from the book''s website. The directory structure for the files accompanying this
    chapter is the same as for Chapter 15, so you shouldn''t have trouble finding
    your way around. Also, as usual, I won''t produce all the code in this chapter,
    only relevant sections. We''ll start by looking at the constructor.'
