- img_proc: true
  md: 'The equivalent PDO code is identical. In one case, the variable $db represents
    an SQLiteDatabasePlus, and in the other it represents a PDO. Like the $result
    variable is an SQLiteResult or a PDOStatement. Because result sets and statements
    are both iterable, they can be used in the same way within loops. In this case,
    PDO takes no more steps than using SQLite directly.


    This similarity between a result set and a statement makes it easy to start using
    statements, but it also masks important differences. These differences are more
    apparent when the prepare method is used.


    # prepare


    Instead of using the query method to create a PDOStatement object, the code $result
    = $db->query($strsql); in Listing 16-1 can be changed to:


    ```

    $result = $db->prepare($strsql);

    $result->execute();

    ```


    I have already hinted at one of the advantages of using prepare instead of query.
    Any variables used in the parameter to the prepare method will be quoted. This
    is an easier and more portable way of escaping quotes than using the quote method.
    If used exclusively, you needn''t worry about quoting a SQL statement. This is
    a security advantage that will protect against SQL injection attacks.


    This is one way which a statement is superior to a result set, but it is not the
    most important difference. Statements are more commonly used to insert multiple
    records into a database, and they do this more efficiently than a series of individual
    SQL statements. This is what is referred to as a prepared statement.


    # Prepared Statements


    There are a number of ways that statements can be used with both input and output
    parameters. We''ll content ourselves with one example of a prepared statement
    used to make multiple inserts. The SQLite application in Chapter 15 has no need
    for multiple inserts, so we''ll create a new example.


    Suppose you have an ecommerce application. The inventories for purchased items
    are stored in an array. Here''s how we can update our database using a prepared
    statement:


    ```

    //$pdo is an instance of a PDO connection

    $orderid = "200";n$array_skus = array(i345, 2899, 6502);

    $strsql = "INSERT INTO orderitems (orderid, inventorynumber) VALUES (:orderid,
    ?)";

