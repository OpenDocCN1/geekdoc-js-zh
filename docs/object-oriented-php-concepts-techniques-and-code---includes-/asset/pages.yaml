  md: "The doGoogleSearch method returns a GoogleSearchResult made up of the following\
    \ elements:\n\n```\n/*\nGoogleSearchResults are made up of\ndocumentFiltering,\
    \ searchComments, estimatedTotalResultsCount,\nestimatesExact, resultElements,\
    \ searchQuery, startIndex\nendIndex, searchTips, directoryCategories, searchTime\n\
    */\n```\n\n# Getting the results\n\nWe are only interested in the properties of\
    \ the GoogleSearchResult:\ntime we our search took, how many results are returned,\
    \ and the results themselves.\n\n```\n$searchtime = $results->searchTime;\n$total\
    \ = $results->estimatedTotalResults;\nif($total > 0){\n```\n\nThe results are\
    \ encapsulated in the resultElements property.\n\n```\n//retrieve the array of\
    \ result elements\n$re = $results->resultElements;\n```\n\nResultElements have\
    \ the following characteristics:\n\n```\n/*\nResultElements are made up of summary,\
