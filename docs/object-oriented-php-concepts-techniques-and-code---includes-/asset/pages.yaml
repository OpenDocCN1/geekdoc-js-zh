  md: "# Ain't Misbehavin’\n\nIf you want your navigator to behave properly, you can\
    \ check some of the values passed to the constructor; that's exactly what the\
    \ checkRecordOffset method does. It terminates construction of your object if\
    \ it returns false.\nLet's see.\n\n```\nprivate function checkRecordOffset($recordoffset,\
    \ $recordsperpage) {\n    $bln = true;\n    if($recordoffset%$recordsperpage !=\
    \ 0) {\n        $this->errorstring = \"Error - not a multiple of records per page\"\
    ;\n        $bln = false;\n    }\n    return $bln;\n}\n```\n\nThe checkrecordoffset\
    \ variable passed to the constructor tells the navigator where it is currently\
    \ positioned.\nSince you are paging through your list while keeping the number\
    \ of items shown per page, the record offset must be a multiple of the number\
    \ of items shown per page. If it's not, the navigator may still function but its\
    \ behavior will be erratic. For this reason, the error message variable is set,\
    \ a value of false is returned, and the application terminates. Terminating the\
    \ application and identifying the reason saves having to debug a misbehavior application.\n\
    \n# Other Constructor Method Calls\n\nThe five remaining private method calls\
    \ made from the constructor aren't quite as interesting as the checkRecordoffset\
    \ method, but a few comments are appropriate.\n\n# Determining the Total Number\
    \ of Pages\n\nSince your navigator always allows you to move to the last item,\
    \ you need to know the total number of pages:\n\n```\nprivate function getTotalPages($totalrecords,\
    \ $recordsperpage) {\n    $this->totalpages = ceil($totalrecords/$recordsperpage);\n\
    }\n```\n\nYou use the ceil function to round up, because your final page may be\
    \ a partial page.\nFor example, if you have 101 items per page, the first 10 pages\
    \ will show each 10 items while the 11th page will show only one."
