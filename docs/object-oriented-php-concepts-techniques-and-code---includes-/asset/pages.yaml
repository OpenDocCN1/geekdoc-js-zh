- img_proc: true
  md: 'Let''s look a the details.

    To create a table with an autumber field named id, the data type INTEGER is used
    in conjunction with PRIMARY KEY. This is equivalent to identifying a field as
    INTEGER auto_increment PRIMARY KEY in MySQL. In SQLite this definition is the
    one exception to the rule that SQLite fields are typeless—otherwise all fields
    are strings. Creating fields as types other than string helps the data types you
    are expecting but will restrict the value entered. You can put a string into a
    float field and a float into a Boolean. Further, specifying the length of a VARCHAR
    field will not truncate that exceeds the defined length. Any length of string
    can be entered into any field. Otherwise, the syntax for creating a table functions
    exactly as you expect.

    The field names used in creating this table are self-documenting, but a few comments
    are in order. A resource won''t be displayed until the reviewed field is set to
    true. The field with the data type TIMESTAMP whenaltered will be maintained using
    a trigger as the whenadded field.


    # Views


    Views are stored SELECT queries. If you repeatedly use the same query, it is worthwhile
    to create a view.

    To make resources easily accessible, let''s order them alphabetically and create
    hyperlinks to each letter of the alphabet. With this in mind, we take a look at
    the alphabet view shown in Listing 15-2.


    ```

    CREATE VIEW alphabet AS

    SELECT DISTINCT UPPER(SUBSTR(linktext,1,1)) AS letter

    FROM tblresources

    WHERE reviewed = 1

    ORDER BY letter;

    CREATE VIEW specific_link AS

    SELECT id, url,

    (preceding || '' '' || linktext || '' '' || followingcopy)

    as copy

    FROM tblresources;

    ```


    Listing 15-2: Views


    The alphabet view creates a row of links as pictured at the top of Figure 15-1.

    Rather than replace the SQL statement that makes up the alphabet view, we can
    instead simply SELECT * FROM using the name of the view in the FROM clause.

    The second view, specific_link, also shown in Listing 15-2, demonstrates how a
    view can be "updated" when used in conjunction with a trigger. We will return
    to this view in the following discussion about triggers, but do note the use of
    || as the string concatenation operator.

    As you can see, SQLite defines its own string manipulation functions. For a complete
    list of functions and operators, see www.sqlite.org/lang_expr.html.'
