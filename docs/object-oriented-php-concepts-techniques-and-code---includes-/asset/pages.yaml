  md: 'achieved by writing a method rather than overloading an operator. However,
    operator overloads can be convenient and intuitive. It makes more sense to write:


    ```

    if($obj1 > $obj2)

    ```


    than


    ```

    if($obj1->isGreaterThan($obj2)

    ```


    The __toString method, while it is not an operator overload, offers a convenience
    similar to that of an operator overload. It is certainly nice to be able to control
    what is displayed on the screen when an object is echoed.


    PHP supports operator overloading for clone and, as you have seen, this is not
    syntactic sugar but a matter of necessity. The same can be said of the __sleep
    and __wakeup methods because, as destructors, the circumstances under which these
    methods are invoked aren''t always under the direct control of the developer.


    All other magic methods are there for convenience so would perhaps qualify as
    "synthetic sugar." I won''t repeat the opinions expressed earlier about __set
    and __get or press the point. After all, PHP places a high premium on user convenience,
    aiming to get the job done quickly and easily. Undoubtedly, this is the reason
    for its success. If PHP''s aim was language purity, OO or otherwise, it probably
    wouldn''t still be with us.'
