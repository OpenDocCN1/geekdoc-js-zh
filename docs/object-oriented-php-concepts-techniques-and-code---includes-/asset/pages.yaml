- img_proc: true
  md: "HTML, tags can have attributes. The major difference between XML tags and HTML\
    \ tags is that HTML tags are predefined, in XML you can define your own tags.\
    \ This is this capability that puts the \"extensible\" in XML. The best way to\
    \ understand XML is by examining an XML document. Before doing so, let me say\
    \ a few words about RSS documents.\n\n# RSS\n\nUnfortunately there are numerous\
    \ versions of RSS. Let's take a pragmatic approach and ignore the details of RSS's\
    \ tortuous history. With something new it's always best to start with a simple\
    \ example, and the simplest version of RSS is 0.91. This version has officially\
    \ been declared obsolete, it is still widely used, and knowledge of its structure\
    \ provides a firm basis for migrating to version 2.0, so your efforts will not\
    \ be wasted. I'll show you an example of a version 0.91 RSS file—in fact, it is\
    \ very RSS feed that we are going to display news items in a web page.\n\n# Structure\
    \ of an RSS File\n\nAs we have done earlier with our own code, let's walk through\
    \ the RSS code, commenting where appropriate.\n\nThe very first component of an\
    \ XML file is the version declaration. This declaration shows a version number\
    \ and, like the following example, may also contain information about character\
    \ encoding.\n\n```\n<?xml version=\"1.0\" encoding=\"iso-8859-1?>\n```\n\nAfter\
    \ the XML version declaration, the next line of code begins the first element\
    \ of the document. The name of this element defines the type of XML document or\
    \ root element. For this reason, this element is known as the document element.\
    \ Surprisingly, our document type is RSS. This opening element defines the RSS\
    \ version number and has a matching closing tag that terminates the document in\
    \ much the same way as <html> and </html> open and close a web page.\n\n```\n\
    <rss version=\"0.91\">\n```\n\nA properly formatted RSS document requires a single\
    \ channel element. This element will contain metadata about the feed as well as\
    \ the actual data that makes up the feed. A channel element has three required\
    \ sub-elements: a title, a link, and a description. In our code we will extract\
    \ the channel title to form a header for our web page.\n\n```\n<channel>\n  <title>About\
    \ Classical Music</title>\n  <link>http://classicalmusic.about.com/</link>\n \
    \ <description>Get the latest headlines from the About.com Classical Music Guide\
    \ Site.</description>\n```"
  merge: -1
  pgno: 120
- img_proc: true
  md: "The language, pubDate, and image sub-elements all contain optional meta-data\
    \ about the channel.\n\n```\n<language>en-us</language>\n<pubDate>Sun, 19 March\
    \ 2006 21:25:29 -0500</pubDate>\n<image>\n  <title>About.com</title>\n  <url>http://z.about.com/d/lg/rss.gif</url>\n\
    \  <link>http://about.com/</link>\n  <width>88</width>\n  <height>31</height>\n\
    </image>\n```\n\nThe item element that follows is what we are really interested\
    \ in. The three required elements of an item are the title, link, and description.\
    \ This is the part of the RSS feed that will fill the content of our web page.\
    \ We will create an HTML anchor tag using the title and link elements, and with\
    \ this the description.\n\n```\n<item>\n  <title>And the Oscar goes to...</title>\n\
    \  <link>http://classicalmusic.com/b/a/249503.htm</link>\n  <description>Find\
    \ out who won this year's Oscar for Best Music...</description>\n</item>\n```\n\
    \nOnly one item is shown here, but number may appear. It is common to find 20\
    \ items in a typical RSS feed.\n\n```\n</channel>\n</rss>\n```\n\nTermination\
    \ of the channel element is followed by the termination of the rss element. These\
    \ tags are properly nested within the other, and each tag has a matching end tag,\
    \ so we may say that this XML document is well-formed.\n\n# Reading the Feed\n\
    \nIn order to read this feed we will pass its URI to the simplexml_load_file function\
    \ and create a SimpleXMLElement object. This object has four built-in methods\
    \ and data members as its XML source file.\n\n```\n?php\n//point to an xml file\n\
    $feed = \"http://z.about.com/6/g/classicalmusic/b/index.xml\";n//create object\
    \ of SimpleXMLElement class\n$xml = simplexml_load_file($feed);\n```\n\nWe can\
    \ use the attributes method to extract the RSS version number from the root element."
