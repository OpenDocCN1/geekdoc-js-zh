  md: "# Public Methods\n\nFollowing the constructor is another public method with\
    \ the name __destruct. The double underscore (_) in front of the method is known\
    \ as a destructor. The function name indicates that this method, like the constructor,\
    \ is another magic method. Again, it is a method newly introduced in PHP 5. (Recall\
    \ from Chapter 5 that magic methods happen in the background, like magic.)\n\n\
    ```\npublic function __destruct(){\n    if(isset($this->image)) {\n        imestroy($this->image);\n\
    \    }\n}\n```\n\nWhile the use of destructors is new with PHP 5, anyone familiar\
    \ with other OO languages has probably already come across them. As its name suggests,\
    \ a destructor is a opposite of a constructor. A constructor initializes an object,\
    \ while a destructor frees up resources that a class may have allocated. Generally,\
    \ PHP does a good job of cleaning up itself so destructors are often not necessary.\
    \ It's used here to ensure that the image resource is disposed of.\n\n# Garbage\
    \ Collection\n\nLike Java, PHP employs a garbage collector to automatically clean\
    \ up resources. Because the programmer is not responsible for allocating and freeing\
    \ memory (as he is in a language like C++, for example), an automated program\
    \ must free up resources. The garbage collector determines when objects are no\
    \ longer used and disposes of them, for example, when they go out of scope. However,\
    \ using destructors can act as a cue that speeds up garbage collection. In the\
    \ case of the ThumbnailImage class, the destructor disposes of the reduced image\
    \ by calling the imagedestroy function.\n\nYou can call the destructor directly,\
    \ but with other magic methods the destructor is designed to be invoked in the\
    \ background without any intervention by the programmer.\n\n# Displaying the Image\n\
    \nNext to the constructor, getImage (see Listing 6-4) is the most important method\
    \ in the ThumbnailImage class, because it actually sends a reduced image to the\
