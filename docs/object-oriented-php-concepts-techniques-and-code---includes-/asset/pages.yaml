  md: '# Viewing the Results Using AJAX


    Viewing the Results in a browser confirms that the code we have written thus is
    functional. We''re now ready to invoke this script from another page (search.html)
    using AJAX. The HTML code to do this is quite simple:


    ```

    Search the No Search Press site: <br />

    <input type="text" id="criterion" style="width:150px;" <br />

    <input class="submit" style="margin-top:05px;width:60px;" type="button"

    value="Submit" onclick="javascript:call_server();" <br />

    <h2>Search Results</h2>

    <div id="searchresults" style="width:650px;display: block;">

    Enter an

    </div>

    </div>

