  md: '# NOTE


    We''ll use the syntax of PHP 4 to help ease into OOP. Starting with PHP 4 will
    also be helpful for those who have already used OOP with PHP and want to upgrade
    their code. I''ll show you how to do this in Chapter 5, and for convenience, I
    have also included an appendix on this topic (PHP 4 style code will run fine under
    PHP 5 but will raise warnings if error reporting is set to E_STRICT in the php.ini
    file. See Appendix A for the OOP configuration of the php.ini file.).


    # Design


    OOP does not eliminate the need for systems analysis. It''s easy to forget this
    step and just start coding, especially when dealing with a simple task. However,
    a little foresight during the design stage will reap benefits later on, so make
    sure you have a clear idea of what you want to do.


    # Defining the Problem


    You need to look at and manipulate the files in a specific directory, you often
    want to do this with directories that hold resources such as photos or images,
    .pdf files, or files that are compressed for downloading. Probably the simplest
    approach, if your web server is Apache, is not to use any code at all and simply
    put a .htaccess file containing the directive +Indexes into the appropriate directory.


    By a .htaccess file, you can simply point your browser to the directory that contains
    files to see a list of its contents. Of course, if this were your only goal, building
    a class to match this functionality would be entirely superfluous. However, you
    want to do a bit more than just files. You want to control the order in which
    they appear and the file types that are listed, and you may also want to know
    the number of files.


    Consider this fairly task: Suppose you have some cleanup work that needs doing
    on directories that contain graphics. You need to remove deadwood, before you
    can do so, you want to view the images. Rather than open each picture individually
    using an application such as Photoshop or GIMP, you want to open all the files
    at once in your browser. Not only do you want to see the image, you also want
    to note the filename of the image you decide to remove it.


    This is not a situation that requires an object-oriented (OO) solution. If you
    are familiar with PHP, you''ve probably already formulated a rough algorithm of
    how to solve this problem and determined which functions you need to use.


    If you are a programmer but not familiar with OOP, a procedural approach will
    doubtless seem more natural and be easier to execute, especially when approaching
    a straightforward problem. However, remember that we are deliberately to keep
    things simple to begin. Stick with it until the end of the next chapter—won''t
    be disappointed.


    At this stage, our simple class may not convince you of the utility of OOP, but
    it will highlight the fact that OOP doesn''t do away the need for procedural programming.
    The logic required for OOP is ever as basic as the functions you''re used to creating
    and using.'
