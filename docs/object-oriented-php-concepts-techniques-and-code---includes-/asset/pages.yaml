    \ Again, internal comments must immediately precede what they document.\n\nAs\
    \ you can see in Figure 14-1, the internal comments documenting the constructor—as\
    \ promised, the Documenter class incorporates internal comments. Unfortunately,\
    \ getDocComment only applies to user-defined classes and user-defined methods\
    \ or data members; comments cannot be extracted for internal classes.\n\n# Documenting\
    \ Methods\n\nAs shown in Figure 14-1, method documentation is displayed immediately\
    \ after the class description and comments. With a view to the client programmer,\
