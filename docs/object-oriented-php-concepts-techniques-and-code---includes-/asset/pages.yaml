  md: '# The Exception Class


    The first step in inheriting from a class is to understand the structure of the
    parent class. For example, Listing 10-1 lists all the data members and methods
    of the Exception class.


    ```

    protected $message;

    protected $code;

    protected $file;

    protected $line;

    private $string;

    private $trace;

    public function __construct($message = null, $code = 0);

    final public function __toString();

    final public function getCode();

    final public function getMessage();

    final public function getFile();

    final public function getLine();

    final public function getTrace();

    final public function getTraceAsString();

    final private clone();

    ```


    Listing 10-1: Data members and methods of the Exception class


    You''ll notice some unfamiliar keywords (such as protected and final) as well
    as a couple of unfamiliar methods that begin with a double underscore (magic methods).
    We''ll discuss each of these in turn.


    # protected


    You should have a good understanding of the keywords private and public as applied
    to data members or methods (if not, see Chapter 4). However, one additional piece
    of information about access modifiers mentioned so far is that private methods
    or data members are not inherited by a derived class.


    In some cases though, you may want new classes to inherit private data members.
    To do this, you use the access modifier, protected, in place of private. A protected
    data member, like a private member, cannot be directly accessed outside its class,
    but it can be inherited and directly accessed by a derived class. In the specific
    case in question, any class derived from Exception will have direct access to
    $message, $code, $file, and $line, but no direct access to $string or $trace.
    This means the assignment is allowed within a class derived from Exception:


    ```

    $this->message = ''New Error'';

    ```


    and this is disallowed:


    ```

    $this->string = ''Any string'';

    ```'
