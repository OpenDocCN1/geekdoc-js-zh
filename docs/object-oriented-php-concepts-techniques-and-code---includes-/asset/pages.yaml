  md: 'Creating a trigger on a view is a convenient way of performing an “update”
    against a view. By themselves, views are not updatable. If you attempt to delete
    from a view that has no associated trigger, you''ll get a warning like this:


    ```

    Warning: SQLiteDatabase::query() [function.query]: cannot modify specific_link
    because it is a view...

    ```


    We solved this problem in the trigger we created on the view specific_link shown
    in Listing 5-3. Because we used an INSTEAD OF clause, any attempt to delete from
    this view instead removes the appropriate record from the table, tblresources.


    In this trigger we have specified for EACH ROW. Doing so is optional. A EACH STATEMENT
    clause also exists but is not yet supported.

    The clause of a trigger is somewhat intuitive but may cause some confusion. Using
    new.id to specify a newly inserted record and old.id for a deleted record clearly
    makes sense. Either old or new may be used when a record is updated.


    Using triggers is convenient, although the side effect could be achieved programmatically.
    Because triggers are embedded in the database, they are activated when you make
    changes from the command line. Triggers help maintain the integrity of your database
    when it is modified outside of your application. Laziness has its rewards.


    # PHP Implementation of SQLite


    For the most part, the OO methods of SQLite are exactly the same as the procedural
    functions. The only difference is that the leading sqlite is dropped and the study
    caps naming convention is used in place of underscores (although some methods
    added in version 5.1 don''t quite follow this rule). Method parameters are the
    same as those used with the procedural functions, except that there is no need
    to pass a resource handle since the object itself is the handle. A few functions
    are only available in a procedural form; these will be mentioned where appropriate.


    There are three built-in, ready-to-use SQLite objects: an SQLite database, a unbuffered
    result set. All three classes will be used in this chapter, but the focus will
    be on the database class.


