  md: '# Assessment


    We''ve touched on a number of the capabilities of PDO. We''ve used some of them
    in our application, but not all of them. This is by means a definitive overview
    of PDO, but we certainly have enough information to make a judgment about the
    utility of this data-access abstraction layer.


    Our application behaves exactly as it did without PDO. We haven''t had to sacrifice
    any functionality and some things were much easier to implement—catching exceptions,
    for example. All our queries, triggers, and views work in exactly the same way.
    One minor inconvenience was converting the utility methods of our derived class,
    but we were able to implement them procedurally without loss of functionality.
    The object model of PDO is perhaps a little more difficult, but along with this
    we''ve gained the ability to use prepared statements should we need them. No PDO
    works well with SQLite.


    But what if we decided to use a MySQL back-end instead? Many changes would we
    have to make? Changing the driver, the most obvious change would be removal of
    the SQLite-specific function sqlitecreate. As noted in Chapter 15, this would
    be replaced by the MySQL function. Likewise, any other operators or functions
    not used by MySQL would have to be changed.


    Another option would be to use standard SQL wherever possible. The date manipulation
    functions could be ignored, and this task performed from within PHP. That''s a
    choice each developer will have to make for themselves, but I expect most not
    to quickly give up on hard-won knowledge about specific SQL dialects.


    # Is the Holy Grail?


    One legitimate concern might be voiced over the inclusion of the SQLite-specific
    method sqlitecreate, and this is not only the database-specific capability provided
    by PDO. Doesn''t providing database-specific functionality do exactly what we
    refrained from doing at the start—extending the PDO class?


    The short answer is, unquestionably, but the whole notion of a perfect database
    abstraction layer is a Holy Grail—glimpsed here and never grasped. Providing some
    database-specific functionality is a sensible compromise and an impetus to PDO.
    As with PHP, utility and purity of concept is paramount. The important thing to
    note is that each developer can make their own decision about an acceptable level
    of database abstraction by incorporating database-specific methods and database-specific
    SQL or not as the case may be. However, in one respect there''s no choice at all:
    if you choose to PDO, you must take an OO approach.


    > The constant PDO::MYSQL_ATTR_USE_BUFFERED_QUERY can be used to create a buffered
    result set with a MySQL database. Using fetchAll is the more abstract or database-neutral
    approach.'
  merge: -1
