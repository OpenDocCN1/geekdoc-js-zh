  md: 'In some situations, the number of page links shown doubles. You probably don''t
    want to emulate this behavior, because your navigator will be used in a variety
    of situations, and in some cases space will be at a premium.


    If you look more closely at a Google query, you can get a few hints about how
    to implement other desired behavior. For instance, try the following: Perform
    a Google query and put your mouse over one of the number links in the navigator.
    If you look at the status bar of your browser, you see a query string that includes
    the variable start. If you haven''t changed Google''s default setting of 10 items
    per page, the value assigned to this variable is always a multiple of 10 that
    increases by 10 as the page number increases.


    You''ll use a similar technique in your page navigator. Your navigator will be
    a series of hyperlinks, each including a query string containing a page number
    indicating an offset from the start.


    # The Code


    Go ahead and download the code for your page navigator, and look it over. Notice
    that there are considerably more data members than in classes discussed so far.
    Names have been chosen in an attempt to make the purpose of the variable explicit,
    and related variables have been grouped. We''ll discuss these variables in the
    order in which they appear in the class file.


    ```

    private $pagename;

    ```


    The variable $pagename is the name of the page that will contain the page navigator
    control. It could be replaced by $_SERVER[''PHP_SELF''], but by using a variable,
    you can accommodate situations where the Apache module mod_rewrite is used to
    rewrite URLs. It''s designed to hold a string.


    ```

    private $totalpages;

    ```


    $totalpages is a convenient way to refer to the total number of pages required
    to display all the items in your list of images. It is calculated from the total
    number of items and the number of items shown per page. Its value will be an integer.


    ```

    private $recordspage;

    private $maxpagesshow;

    ```


    $recordspage is the number of items shown on a page and $maxpagesshow is the maximum
    number of links to additional pages shown on any one page. The former affects
    the length of the page, while the latter affects the width of the navigator. Again,
    these are intended to be integer variables.


    ```

    private $currentstartpage;

    private $currentendpage;

    private $currentpage;

    ```


    $currentstartpage, $currentendpage, and $currentpage are best understood using
    a visual example. Refer back to Figure 7-1; these would be 1, 7, and 4, respectively.'
