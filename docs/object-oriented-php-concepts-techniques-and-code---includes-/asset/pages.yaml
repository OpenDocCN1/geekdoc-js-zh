- img_proc: true
  md: "While looping through the array of players each individual player is cloned\
    \ and added to a new array. Doing this creates a separate array for the cloned\
    \ team. After making these changes, running the code in List 13-6 yields this\
    \ output:\n\n```\nRovers Array ([0] => Player Object ([name:private] => Roy [position:private]\
    \ => Midfielder ()\nReserve Array ([0] => Player Object ([name:private] => Roy\
    \ [position:private] => Striker ()))\n```\n\nChanging a player originally added\
    \ to the $Rovers has no effect on the player in the cloned $reserves object. This\
    \ is the result you want. The magic clone method allows you to define what happens\
    \ when an object is cloned. Using the terminology of OO languages, the _clone\
    \ method is a copy constructor. It's up to the developer to decide what is appropriate\
    \ for any particular class, but as a general rule, a _clone method should always\
    \ be defined for aggregate classes for the exact reasons shown in the sample code—normally\
    \ the same variable is not shared among different instances of a class.(That's\
    \ what static members are for.)\n\n# A Get Method for Object Members of an Aggregate\
    \ Class\n\nWhen I first introduced accessor methods in Chapter 5, I noted that\
    \ one of the advantages of a get method over direct access to a public member\
    \ data was that accessor methods return a copy rather than an original. This is\
    \ true when the members are themselves objects—by defaults objects are returned\
    \ by reference. In the interests of data protection, it is usually better to return\
    \ a copy using the clone operator. With this in mind, let' rewrite the getPlayers\
    \ method originally shown in Listing 13-5, shown here in Listing 13-8.\n\n```\n\
    public function getPlayers(){\n  $arraycopy = array();\n  foreach ($this->players\
    \ as $p) {\n    $arraycopy[] = clone $p;\n  }\n  return $arraycopy;\n}\n```\n\n\
    Listing 13-8: Returning a copy of an object\n\nThe array returned by this version\
    \ will have no effect on the data member, $players. If you need to make changes\
    \ to the players array a set method will have to be written. Doing so is a fairly\
    \ straightforward matter so I'll leave that to you.\n\nThe fact that objects are\
    \ passed by reference also has implications for how objects are added to an aggregate\
    \ class. For instance, consider the player Roy who added to the team Rovers in\
    \ Listing 13-6. Any changes made to the variable $roy will change the first element\
    \ of the $players array in the $Rovers object. This may or may not be what's wanted.\
    \ If not, then players should be cloned before being added to the players array."
