    \ ] {\n}\n    Method [<internal> public method _toString ] {\n}\n    Method [<internal>\
    \ final private method _clone ] {\n}\n    Method [<internal> final public method\
    \ getMessage ] {\n}\n    Method [<internal> final public method getCode ] {\n\
    }\n    Method [<internal> final public method getFile ] {\n}\n    Method [<internal>\
    \ final public method getLine ] {\n}\n    Method [<internal> final public method\
    \ getTrace ] {\n}\n    Method [<internal> final public method getTraceAsString\
    \ ] {\n}\n}\n```\n\nListing 14-1: Exporting SOAPFault\n\nThe export method gives\
    \ a quick overview of a class. As you can see, SOAPFault extends ⦿ Exception class\
    \ and possesses all ⦿ properties of Exception. Its methods are ⦿ Exception class\
    \ methods. This is exactly the sort of what we want the reflection classes to\
    \ do for us.\n\n# The ReflectionClass Class\n\nThe export method is quick and\
    \ easy; but what if you want more information in a user-friendly format? The place\
    \ to begin is with the ReflectionClass, which you'll extend to create a Documentclass.\n\
    \n> NOTE There are nearly 40 methods of ReflectionClass. Often, the methods' names\
    \ clearly identify their purpose. For instance, isInterface determines whether\
    \ you are introspecting a class or an interface. We will only examine those methods\
    \ that are of particular interest.\n\n# Methods ofReflectionClass\n\nThe methods\
    \ and getProperties methods play an important role in class documentation. Invoking\
    \ methods returns an array of ReflectionMethod objects. Invoking getProperties\
    \ returns an array of ReflectionProperty objects. These methods and the objects\
    \ returned make possible to fully describe a class's methods and data members.\n\
    \nYou will recall that I promised we'd use internal comments when documenting\
    \ a class. If internal comments are properly formatted, the getComment method\
    \ of ReflectionClass can be used to incorporate directly into your documentation."
