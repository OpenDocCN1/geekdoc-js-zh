    <a href=\\$value-URL\">\\$value-URL</a>\\$value-snippet<br />\\n\";\n  echo $strtemp;\n\
    }\necho \"<hr style=\"border:1px dotted black\\/ >\";\";\\necho \"<br />Search\
    \ time: $searchtime seconds.\";\n}else{\n  echo \"<br /><br />Nothing found.\"\
    ;\n}\n```"
