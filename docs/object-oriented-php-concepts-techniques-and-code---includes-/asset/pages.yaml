  md: "```\npublic function getModifiers($r) {\n    if($r instanceof ReflectionMethod\
    \ ||\n        $r instanceof ReflectionProperty){\n        $arr = Reflection::getModifiersNames($r->getModifiers());\n\
    \        $description = implode(\", \", $arr);\n    }else{\n        $msg = \"\
    Must be ReflectionMethod or ReflectionProperty\";\n        throw new ReflectionException($msg);\n\
    \    }\n    return $description;\n}\n```\n\nYou want to ensure that only ReflectionMethod\
    \ and ReflectionProperty objects are passed into this method so you use the operator,\
    \ instanceof. This operator was introduced in PHP 5 and replaces the now-deprecated\
    \ is_a function. This operator allows you to restrict your use of classes that\
    \ support the getModifiers method and to throw a ReflectionException if the wrong\
    \ type of object is passed in.\n\nWhen you pass the return value of getModifiers\
    \ to the static method of the Reflection class, getModifiersNames, string array\
    \ of all the modifiers is returned. A series of calls to isPublic, isStatic, and\
    \ like methods would achieve the same result, but using getModifierNames is by\
    \ far the most succinct way of getting the strings of method and class members.\n\
    \n# NO COMMON ANCESTOR\n\nYou might think that ReflectionMethod and ReflectionProperty\
    \ objects have a getModifiers method because they share a common interface, Reflection,\
    \ and, consequently, you could hint the parameter to this method to check for\
    \ an instance of this particular interface only. However, you would be mistaken.\
    \ There are only two methods of the Reflection interface: export and __toString.\
    \ As far as common class heritage is concerned, ReflectionMethod derives from\
    \ ReflectionFunction and ReflectionProperty has no parent class. There is no common\
    \ parenting. That the fact remains that checking for an instance of the Reflection\
    \ class would achieve essentially the same result as checking for ReflectionFunction\
    \ and ReflectionProperty—but for the wrong reasons. It is only fortuit that both\
    \ classes have a getModifiers method. Another way to screen for the correct class\
    \ would be to introspect the variable to determine whether it has a getModifiers\
    \ method.\n\nAs an interesting aside, when introspecting the methods of a built-in\
    \ interface, the modifiers are always public and abstract. In Chapter 11 you saw\
    \ that PHP prohibits the use of the modifier abstract when defining the methods\
    \ of a user-defined interface, despite the fact that the methods of an interface\
    \ must in fact be abstract."
