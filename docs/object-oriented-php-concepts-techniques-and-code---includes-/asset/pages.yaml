    \ specific, providing only a general description of a solution.\n\n# The Singleton\
    \ Pattern\n\nOne well-known and well-documented design pattern is the singleton\
    \ pattern, a pattern that ideally suits the database class you created in Chapters\
    \ 9 and 10. As the name implies, this pattern is used where only one instance\
    \ of a class is wanted.\n\nYour implementation of the MySQLConnect uses a static\
    \ variable and throws an exception if there is an attempt to construct more than\
    \ one instance of the class. A more conventional implementation of the singleton\
    \ pattern might use a private constructor and a static method to return a class\n\
    \n> \\^1 PHP Developers Meeting, minutes (Paris, November 11–12, 2005), available\
    \ at www.php.net/~~derick/meeting-notes.html. (Accessed April 4, 2006)."
  merge: -1
