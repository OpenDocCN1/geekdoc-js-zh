    # Query Methods


    Look again at Listing 15-4. It includes the five methods for creating result sets.
    The buffered and unbuffered methods are fairly self-explanatory—you are probably
    quite familiar with the equivalent MySQL functions. However, MySQL (prior to the
    MySQL extension) has nothing to match with the singleQuery, queryExec, or arrayQuery
    methods. Let''s look at these methods in more detail.


    The singleQuery method is a recent addition, and the PHP site warns that it is
    currently not documented. Let''s carry on regardless because this situations where
    a query returns only one row—when the COUNT function to return the number of records
    in a table. Here''s one view of how this method might behave: This method returns
    only one record, and no result set. If the second argument is false, the value
    returned is an array of the first row. If the second argument is true, only the
    first column of the first row is returned, and it is returned as a scalar value.


    This speculation may have the best sense of how this method might work, but it
    doesn''t describe what actually happens. In fact, this method only returns the
    first column and any number of rows. If the second argument is false, an array
    is returned; if the second argument is true and only one row is returned, a scalar
    is returned. On the PHP site, this method is identified as bool first_row_only
    and the return type is identified as an array. It looks like the return type could
    be mixed. In any case, this method doesn''t work the way it ought to. We were
    meant.


    There is no requirement that you use the singleQuery instead of query. With MySQL,
    you can always create a result set and then use the appropriate fetch to retrieve
    the value of the first row or a specific field. But why return an object or an
    array when all that''s needed is the value of one column? You may use the singleQuery
    for any kind of query—data manipulation or otherwise—it was designed specifically
    for situations where a single value or single column is returned, and is presumably
    optimized for situation.


    As you can see, there is also an arrayQuery method. Like the singleQuery method,
    this method allows us to copy results into an array, bypassing the intermediate
    step of creating a result set. This method is best used when a limited number
    of records are returned.


    MySQL versions prior to 4.1 have no equivalent to the queryExec method of SQLite
    because queryExec is specifically designed for multiple queries. Multiple, semicolon-separated
    queries may be passed as a single query string to queryExec. (The install script
    uses to create the tables, triggers, and views to insert records into the tblresources
    table.) This method gives significant performance improvements over repeated querying
    and performs'
