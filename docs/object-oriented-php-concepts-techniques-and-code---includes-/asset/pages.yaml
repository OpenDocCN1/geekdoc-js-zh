- img_proc: true
  md: "Normally, to use classes you would include them in the following way:\n\n```\n\
    require 'MySQLResultSet.php';\nrequire 'MySQLConnect.php';\nrequire 'Navigator.php';\n\
    require 'DirectoryItems.php';\nrequire 'Document.php';\n```\n\nThese five lines\
    \ of code can be replaced with the following:\n\n```\nfunction __autoload($class)\
    \ {\n  require $class '.php';\n}\n```\n\nThe __autoload function will be invoked\
    \ whenever there is an attempt to use a class that has not been explicitly included.\
    \ The class name will be passed to this magic function, and the class can be included\
    \ by creating the filename that holds the class definition. Of course, to use\
    \ __autoload as coded above, the class definition file will have to be in the\
    \ current directory or in the path.\n\nUsing __autoload is especially convenient\
    \ when your code includes numerous classes. There is no performance penalty to\
    \ pay—in, there may be performance improvements if not all classes are used all\
    \ time. The __autoload function also has the side effect of requiring strict naming\
    \ conventions for files that hold class definitions. You can see from the previous\
    \ code listing how the naming conventions used in this book (i.e., combining the\
    \ class name and the extension .php to form the filename) will work fine with\
    \ __autoload.\n\n# __sleep and __wakeup\n\nThese magic methods have been available\
    \ since PHP 4 and are invoked by the variable handling functions serialize and\
    \ deserialize. They control how an object is represented so that it can be stored\
    \ and retrieved. The way that you store or communicate an integer is fairly trivial,\
    \ but objects are more complex than primitive data types. Just as the __toString\
    \ method controls how an object is displayed to the screen, __sleep controls how\
    \ an object will be stored. This magic method is invoked inevitably whenever a\
    \ call to the serialize function is made. Cleanup operations such as a database\
    \ connection can be performed within the __sleep method before an object is serialized.\
    \ Conversely, __wakeup is invoked by deserialize and restores the object.\n\n\
    # __clone\n\nWith the constructor, __clone is invoked by a PHP operator, in this\
    \ case. This is a new operator introduced with PHP 5. To see why it is necessary,\
    \ we need to take a look at how objects are copied in PHP 4."
