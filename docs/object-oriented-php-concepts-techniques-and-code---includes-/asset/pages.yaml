  md: "can prove useful. Suppose you wanted to add to the functionality of the MySQLResultSet\
    \ class defined in Chapters 9 and 10, so as to retrieve the current status in\
    \ in this fashion:\n\n```\n// $rs is an instance of MySQLResultSet\n$rs->stat();\n\
    ```\n\nYou could just create a wrapper method for the existing MySQL function,\
    \ mysql_stat, as you did when creating other methods of this class. For example,\
    \ the existing InsertId method encloses a call to mysql_insert_id. You could easily\
    \ exactly the same thing with mysql_stat. However, the more versatile option is\
    \ to add a `__call` method similar to the following code:\n\n```\npublic function\
    \ __call($name, $args) {\n$name = \"mysql_\".$name;\nif(function_exists($name))\
    \ {\n    return call_user_func_array($name, $args);\n}\n```\n\nWhen you call the\
    \ method against a MySQLResultSet object, the method name, is passed to the __call\
    \ method where mysql_ is prepended. The mysql_stat method then is invoked by the\
    \ call_user_func_array function. Not only can you call any MySQL function, but\
    \ once __call is defined you can call any MySQL function against a MySQLResultSet\
    \ class instance by simply using the function name, minus the leading mysql_ and\
    \ supplying any required arguments. This magic method does away with the need\
    \ for writing wrapper methods for existing MySQL function, and allows them to\
    \ be \"inherited\". If you're already familiar with the MySQL function names it\
    \ also makes for easy use of the class.\n\nHowever, this magic method is not quite\
    \ as convenient as it might seem at first glance. Functions such as mysql_fetch\
    \ array that require a result be passed even the class is a result set method\
    \ makes nonsense of the whole notion of an object—why should an object need to\
    \ pass a copy of itself in order to make a method call? On the other hand, this\
    \ is easy and natural to incorporate functions such as mysql_stat and mysql_errno\
    \ that don't require any arguments, or functions such as mysql_escape_string that\
    \ require primitive data types as arguments. If properly used, this convenience\
    \ method seems more defensible than the __set and __get_methods.\n\n# __autoload\n\
    \nThe __autoload function is a convenience that allows you to use classes without\
    \ having to explicitly write code to include them. It's a bit different from other\
    \ magic methods because it is not incorporated into a class definition. It is\
    \ simply included in your code like other procedural function."
