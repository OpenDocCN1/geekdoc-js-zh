  md: 'You add an array to your class and use it to capture any undeclared instance
    variables. With these revisions, assigning a value to an undeclared data member
    invokes the _set method in the background, and an array element with the key name
    will be assigned a value of "Fred". In a similar fashion the _get method will
    retrieve name.


    # Is It Worth It?


    Magic set get methods are introduced as a convenience, but it is certainly questionable
    whether they are worth the effort. Encouraging the use of undefined data members
    can easily lead to difficulties when debugging. For instance, if you want to change
    the value of the name data member of your class instance, but misspelt it, PHP
    will quietly create another instance variable. Setting a nonexistent data member
    produces no error or warning, so your spelling error will be difficult to catch.
    On the other hand, attempting to use an undefined method produces a fatal error.
    For this reason, declaring data members to be private (or protected), and ensuring
    that they are all accessible through declared accessor methods, eliminates the
    danger of accidentally creating a unwanted data member. Using declared data members
    means fewer debugging problems.


    Undeclared data members also seem contrary to the principles of OOP. Although
    you might argue that encapsulation has been preserved because undeclared data
    members are only accessed directly through magic methods, the real price of access
    methods is to control how instance variables are changed or retrieved. The comment
    inside the _set method (//perhaps check value passed in) in Listing 13-1 suggests
    that such could be implemented, but in order to do so you would need to know the
    variable names beforehand—an impossibility given that they are undeclared. Why
    not just set properly declared data members?


    Allowing undeclared data members also undermines another basic concept of OOP,
    namely inheritance. It''s hard to see how a derived class might inherit undeclared
    instance variables.


    One might argue, though, that these methods make PHP easier to use and convenience
    offsets any of the disadvantages. After all, the original and continuing impetus
    behind PHP is to simplify web development. Allowing undeclared data members in
    PHP 5 is perhaps a necessary evil doing so keeps backward compatibility with PHP
    4. While it''s easy to criticize magic set and get methods, in Chapter 16, discussing
    the PDODataRow class, you''ll see that these methods can come in very handy.


    # __isset and __unset


    PHP 5.1.0 introduces the magic methods __isset and __unset. These methods are
    called directly by the built-in PHP functions isset and unset. The need for these
    methods results from the existence of magic set and get methods for undeclared
    data members. The magic method __isset will be called whenever isset is used with
    an undeclared data member.'
