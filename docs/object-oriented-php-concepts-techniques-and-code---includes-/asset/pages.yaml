  md: 'This listing shows an unbuffered query. In this case, a functional singleQuery
    method would be preferable because we know that only one record will be returned.
    However, given the problems with singleQuery, we use the unbufferedQuery method
    of an SQLiteDatabase object to create a result set and then use the fetch method
    to copy the first row into an array.


    # arrayQuery


    The PHP site warns against using the array method with queries that return more
    than 45 records (a somewhat arbitrary number perhaps, but this method stores result
    in memory returning a large number of records can exhaust memory). We''ve used
    this method in Listing 15-7.


    ```

    $db = new SQLiteDatabase(''./bdir/resources.sqlite'');

    $db->createFunction(''class_id'',''set_class_id'',0);

    $sql = "SELECT id, url, email, (prequery || '' '' || linktext || '' '' || followingcopy)
    \nAS copy, linktext, reviewed, class_id() AS classid "\nFROM thresources\nORDER
    BY id DESC\nLIMIT $recordoffset, $PERPAGE";

    // use arrayQuery

    $resultarray = $db->arrayQuery($sql);

    ```


    Listing 15-7: Using arrayQuery


    As you see, we know exactly how many records are returned because our SQL has
    a LIMIT clause. Again, this method allows us to bypass creation of a result set.


    # singleQuery


    The code below uses the singleQuery method and does-exactly what we need—it returns
    a scalar value rather than a result set or an array.


    ```

    $totalrecords = $db->singleQuery(''Select COUNT(*) FROM tblresources'',true);

    ```


    # queryExec


    This method is commonly used to process a transaction. The command-line command
    .dump to dump your database or view the file dump.sql. You''ll see that it is
    formatted as a transaction. You can recreate an entire database by passing this
    listing as the queryExec method, as we have done with the install script, db_install_script.php.


    The ability to perform multiple queries using one method does raise security issues.
    When using this method, it is important to filter data in order to avoid a SQL
    injection attack. For more details, see phparchitect''s Guide to PHP Security.¹


    > ¹ Ilia Alshanety, phparchitect''s Guide to PHP Security (Marco Tabini & Associates,
    Inc., 2005), 73.'
