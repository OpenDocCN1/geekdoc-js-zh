  md: "# Using the Documenter Class\n\nThat completes the description of the Documenter\
    \ class. We will now use it in a web page to display information about all internal\
    \ and user-defined classes. We'll create a sidebar of links to all existing classes\
    \ and interfaces, and display detailed information in the main portion of the\
    \ page. Again, we won't discuss every line of code, only those lines that are\
    \ of special interest.\n\n# Creating a Sidebar of Classes and Interfaces\n\nLet's\
    \ create a sidebar that will display the names of all PHP classes as hyperlinks—filling\
    \ the promise of a central repository of information about all classes. Clicking\
    \ a hyperlink will display documentation for the class in the main portion of\
    \ your web page. The code to do this follows:\n\n```\ninclude MySQLResultSet.php;\n\
    include MySQLConnect.php;\ninclude Documenter.php;\ninclude PageNavigator.php;\n\
    $arr = get_declared_classes();\nnatcasesort($arr);\n$classname = @$_GET[\"class\"\
    ];\nif(isset($classname)) {\n    $classname = current($arr);\n}\n\necho \"h4 style=\"\
    background-color:#fff;\">Classes</h4>\";nforeach($arr as $key => $value) {\n \
    \   echo \"<a href=\\$getclass.php?class=\\$value\">\";\n    echo \"$valuevalue</a><br\
    \ />\";\n}\n```\n\nIn addition to built-in classes, any user-defined classes that\
    \ have been loaded using an include or require statement will be retrieved when\
    \ you call the get_declared_classes function. If no variable name has been passed\
    \ to this, $classname will default to the name of the first class in the array\
    \ of declared classes. This $classname variable contains the name that will be\
    \ passed to the constructor of the Documenter class. The specified class will\
    \ be displayed in the center of the page. A foreach loop creates the list of hyperlinks\
    \ to all available classes by creating a query string that includes the class\
    \ name.\n\nYour sidebar also displays links to all the declared interfaces. The\
    \ code to do this is identical to the code to retrieve classes except that it\
    \ calls the function get_declared_interfaces instead of get_declared_classes.\
    \ Therefore this code will not be reproduced.\n\n# Formatting Detailed Documentation\n\
    \nThe MySQLException is a derived class that has a variety of methods (see Figure\
    \ 1-4), so use it as an example of how we would like the class documentation to\
    \ look."
