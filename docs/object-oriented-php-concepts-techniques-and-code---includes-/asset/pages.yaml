- img_proc: true
  md: 'If you use a text editor to format your CREATE TABLE statement and then redirect
    this to the database, the results will be much more acceptable. Do this whenever
    you create tables, views, or triggers.


    NOTE Precompiled binaries for most operating systems are available at the SQLite
    download page (https://sqlite.org/download.html). For compatibility reasons it
    is important to get the command-line version number that matches the version incorporated
    into PHP. At the SQLite site you may have difficulty finding older versions. If
    there is no link to the version you require, add the URL: http://sqlite.org/,
    followed by the version number you require, to the address bar of your browser—for
    example, https://www.sqlite.org/sqlite-2_8_16.zip. You might get away with using
    a slightly higher or lower version number, but version 3 databases are entirely
    different format from version 2, so do not attempt to use the version 3 command-line
    tool with a version 2 database.


    The database used in this application is resources.sqlite and is stored in a subdirectory
    named ddir. If you haven''t already created it using the db_install_script.php
    file, you can do so by redirecting the dump.sql file from the command line in
    the following way:


    ```

    sqlite resources.sqlite < dump.sql

    ```


    A database dump is formatted as a transaction, so, if this command worked properly,
    you''ve already used one of SQLite''s advanced features.

    You can test that the database has been installed by executing a SELECT statement.
    Typing SELECT * FROM tblresources; should display all the records in the resources
    table.


    # Creating a Table


    The SQL to create the tblresources table in our database is shown in Listing 15-1.

    CREATE TABLE tblresources(

    id INTEGER PRIMARY KEY,

    url VARCHAR(255) NOT NULL UNIQUE default '''',

    email VARCHAR(70) NOT NULL default '''',

    preceding VARCHAR(100) NOT NULL default '''',

    linktext VARCHAR(255) NOT NULL default '''',

    following VARCHAR(255) NOT NULL default '''',

    target VARCHAR(35) default ''blank'',

    category VARCHAR(100) NOT NULL default '''',

    theirlinkpage VARCHAR(100) default NULL,

    whenaltered TIMESTAMP ''0000-00-00'',

    reviewed BOOLEAN default 0,

    whenadded DATE ''2006-05-05'');

    Listing 15-1: Creating a table'
  merge: -1
