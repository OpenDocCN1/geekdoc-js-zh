  md: 'Methods of all levels of visibility are passed to the show_methods function
    to handle the details of displaying method descriptions. Here is the prototype
    for this function:


    ```

    function show_methods(Documenter $sd, $type, $arr)

    ```


    One of the parameters of this function is an object. In PHP 4 you would want to
    ensure that this object was passed by reference by preceding the variable & (an
    ampersand). As discussed in Chapter 13 in the section `__clone` on page 116, in
    PHP 5 all objects are automatically passed by reference, so there is no need to
    do this. This parameter is also hinted, disallowing anything other than a Documenter
    object.


    To summarize, this function displays the variable names of method parameters,
    type hints, and default values where applicable. Syntax highlighting has been
    used for the keywords describing each method—you can quickly see in Figure 14-1
    that the getMessage method of the Exception class is both public and fine. User-defined
    methods are flagged as such, and any internal comments are.


    > If you are running PHP 5.1 or higher, you can hint the array to show_methods
    by changing the function prototype to read function show_methods(Documenter $sd,
    $type, array $arr).


    # Data Members


    Data members are handled in the same way as methods. Those with the least restrictive
    visibility are presented first. Again, keywords are highlighted. Even default
    values assigned to data members can be retrieved. Somewhat surprisingly, this
    is done using the getDefaultProperties method of ReflectionClass rather than using
    a ReflectionProperty class method. With methods, all modifiers are shown. The
    value of constants is retrieved using the ReflectionClass method getConstants.


    # Reflecting


    The reflection classes make it easy to generate documentation for both internal
    and user-defined classes. Documentation can be created directly from the class
    files, so any changes to the class are immediately reflected in the documentation—much
    easier than separately maintaining both code and documentation. Descriptions of
    methods and hints about class usage are invaluable not only for the client programmer
    but also for the class originator, especially when a few months have lapsed between
    creation of a class and its subsequent use. Class documentation can effortlessly
    incorporate internal comments as long as you simply pay a little attention to
    their format during coding.'
