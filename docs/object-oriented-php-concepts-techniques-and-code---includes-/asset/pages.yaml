  md: '# 13


    # MORE MAGIC METHODS


    ![](img/c8663459ed204f27b8d015c8a3d2acad_130_0.png)


    So far we have come across the magic methods `__construct`, `__destruct`, and
    `__toString`, and have discussed them in detail. The remaining magic methods are
    `__autoload`, `__call`, `__clone`, `__get`, `__set`, `__sleep`, `__wakeup`, `__unset`,
    and `__isset`. As you might expect, they only make sense in the context of object-oriented
    programming (OOP).


    The syntactic element common to all magic methods is that they begin with a double
    underscore. They are all usually invoked indirectly rather than directly. As we
    have seen, `__construct` method of a class is invoked when we use the `new` operator
    and a class name. If we have a class called MyClass that defines a constructor,
    the statement `$m = new MyClass();` directly calls the `__construct` method of
    this class.


    However, the fact that all magic methods are called indirectly makes important
    differences between them. Having a uniform constructor for every class yields
    benefits when a parent constructor needs to be called, but there is


    > *There is also a magic method `__set_state`, invoked by a call to the `var_dump`
    function. At this point there is minimal documentation regarding this method.
    For more information see http://php.net/var_exports.'
