  md: 'When I introduced interfaces I defined them as classes that have methods but
    no body for those methods. A class that implements an interface must provide the
    body for every method of the interface. What, then, do you do with an unbuffered
    result set and the rewind method?


    Just as fearless birds don''t fly, an unbuffered result set can define a rewind
    method that does nothing.


    The problem of unwanted methods of an interface is not peculiar to PHP. Other
    OO languages such as java circumvent this problem by using "adapter" classes that
    provide an empty implementation of unwanted methods and only require that desired
    methods be defined.


    # Leaving a Method Undefined


    If you implement an interface but don''t define all of its methods, you will receive
    a fatal error message. For example, if you try to use the MySQLResultSet class
    without defining the key method, you will see a fatal error like:


    ```

    Class MySQLResultSet contains 1 abstract methods and must therefore beclared abstract
    (Iterator::key);

    ```


    Not the error you would expect, perhaps, but an error nonetheless, and an informative
    one. As you can see, even though you''ve implemented the key method, it hasn''t
    gone away because it is inherited from the Iterator interface. (The key method
    is considered abstract because it has no implementation.)


    There are two ways to eliminate this error message. The obvious one, of course,
    is to define the key method. However, you could also create error-free code by
    adding the modifier abstract to your class by declaring the class MySQLResultSet
    to abstract class MySQLResultSet.


    You''ve just created your abstract class, which is a class with one or more methods
    that lack an implementation. A purely abstract class is one in which all methods
    lack an implementation, as with all methods in an interface. The only difference
    between a purely abstract class and an interface is that it is defined as a class
    rather than an interface.


    You cannot create an instance of an abstract class; you cannot inherit from it
    and implement the abstract method(s), as with an interface. You''ll learn about
    abstract classes in the next chapter.


    # Implementation and Access


    By removing the key method and forcing an error we learned a few more things about
    OOP. Let''s see what we can learn by changing the access modifier of the rewind
    method from public to private. This do and preview the class in your browser.


    ```

    Access level to MySQLResultSet::rewind() must be public (as in class Iterator)

    ```'
