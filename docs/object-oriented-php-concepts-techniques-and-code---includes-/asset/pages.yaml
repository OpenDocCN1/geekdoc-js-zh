  md: '# 10

    IMPROVEMENT THROUGH INHERITANCE


    ![](img/c8663459ed204f27b8d015c8a3d2acad_94_0.png)


    Anyone who has played Monopoly knows that a player’s financial situation can be
    improved through inheritance. In object-oriented programming (OOP), inheritance
    can also bring improvement. In this chapter we’ll use inheritance to improve the
    MySQL classes developed in Chapter 9, by simplifying error trapping and by modifying
    the behavior of the MySQLResultSet class.


    Trapping errors is not a job that developers approach with enthusiasm. It is tedious
    and a distraction from the task at hand. No one sets out to write error-handling
    code; it is a necessary evil. Not only that error trapping is ugly. It litters
    well-written code and often ends obscuring what was initially readable. Further,
    it’s not a good idea to write error trapping in the early stages of development
    because you want errors to be readily apparent. For these reasons error trapping
    is often left until the final stages of development and, if it is done at all,
    it is tackled on more or less as an afterthought.'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'One of the big advantages of OOP is the ability to catch exceptions rather
    than trap errors. By catching exceptions, the task of handling errors can be centralized.
    This makes for much tidier code and eases the transition from development to production
    code—erasing the need to take on error trapping at the end.


    This improvement to error handling is made possible because of a built-in class,
    Exception. In this chapter you will use this class as the base class for building
    your own exception class.


    The second improvement we''ll apply modifications to to user-defined class, MySQLResultSet.
    As you saw in the previous chapter, result sets and arrays have characteristics
    in common; then you will need to iterate through them to examine each element.
    It is exceptionally easy to traverse an array using a foreach loop. This easy
    traversal is the modification in behavior that we have in mind for the MySQLResultSet
    class. In this, a built-in interface (rather than a class) facilitates this behavior
    to the MySQL


    # The Standard PHP Library


    These planned to the MySQL classes use the Standard PHP Library (SPL), a collection
    of classes and interfaces aimed at solving programming problems. The SPL, new
    to PHP 5, is roughly comparable to the Standard Template Library in C++ or the
    many classes built in the Java language. But whereas there are thousands of classes
    to draw upon in Java, the number available in PHP is much more modest.


    We''ll use the Exception class to form the base for the MySQLException class and
    the SPL to adapt the MySQLResultSet class for use foreach loop by using the Iterator
    interface. Beside the classes belonging to the SPL, there are well over 100 built-in
    classes in PHP 5. We''ll deal with some of the other built-in classes in Chapters
    12, 14, 15, and 16.


    # Extending a Class Through Inheritance


    One of the major advantages of OOP is that you don''t have to start from scratch.
    Existing classes may do the job for you. If an existing class does exactly what''s
    required, then you can use it as is. If it does something similar, but not exactly
    what you need, you can adapt it. This process of adaptation is called inheritance.


    Inheritance is one of the most important features of object-oriented (OO) languages.
    It allows us to create new classes from existing ones, exploiting behavior that
    is already defined and adjusting it as necessary. term “inheritance” is appropriate
    because the data members and methods of the original class become part of the
    newly created class. However, with genetic inheritance, the child may be similar
    to the parent in some respects but different in others.


    Because a child class is derived from a parent class, it is also referred to as
    a derived class, and its parent is called the base class. Parent classes are also
    sometimes referred to as superclasses and derived classes as subclasses.'
