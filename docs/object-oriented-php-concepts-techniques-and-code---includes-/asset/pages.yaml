  md: "```\n$interfaces = \\$this->getInterfaces();\n$number = count(\\$interfaces);\n\
    if($number > 0){\n  $counter = 0;\n  \\$description .= \"implements \";\n  foreach(\\\
    $interfaces as $i) {\n    \\$description .= \\$i->getName();\n    \\$counter++;\n\
    \    if(\\$counter == \\$number){\n      \\$description .= \", \";\n    }\n  }\n\
    \  return \\$description;\n}\n```\n\nThis code calls a number of self-explanatory,\
    \ inherited methods to build a class description. The slight complication is that,\
    \ because a class can implement more than one interface, the getInterfaces returns\
    \ an array, and so requires a foreach loop. When applied to the SoapFault class,\
    \ the following string is returned by the getFullDescription method:\n\nclass\
    \ SoapFault extends Exception\n\nSoapFault is correctly identified as a class\
    \ rather than an interface, it is neither final nor abstract, and its derivation\
    \ from Exception is documented. This is exactly the same description that you\
    \ saw in Listing 14-1 when you exported this class.\n\n# Describing Methods and\
    \ Data Members\n\nMethods are more important than data members, let's next deal\
    \ with how to adapt the reflection classes to document methods. Calling the getMethods\
    \ method of the ReflectionClass creates an array of ReflectionMethod objects.\
    \ The visibility of each method can be determined by the isPublic, or isPrivate\
    \ methods of the ReflectionMethod class.\n\nHowever, you want to display methods\
    \ sorted by visibility—basically, we want a getMethods method and an identical\
    \ method for displaying private and protected methods. In order to retrieve an\
    \ array of ReflectionMethod objects sorted by visibility, you are going to loop\
    \ through all the methods in a class and create separate arrays of each type.\
    \ Let's see how this is done.\n\n```\nprivate function createMethodArrays({\n\
    \  \\$methods = \\$this->getMethods();\n  //ReflectionArray returned\n  foreach(\\\
    $methods as $m) {\n    \\$name = \\$m->getName();\n    if(\\$m->isPublic(){\n\
    \      \\$this->methods[\\$name] = \\$m;\n    }\n  }\n}\n```"
