    \ the try is thrown and handled by the catch. This is why a try block is said\
    \ to handle exceptions.\n\nHowever, there are important differences between error\
    \ trapping and exception handling. The argument to a catch clause is always an\
    \ object. Any Exception that occurs within the scope of the try block will lock\
    \ a catch that has a matching Exception type as its argument.\n\n> The identification\
    \ of the object type in a catch block is called type hinting. We'll discuss this\
    \ in greater in Chapter 11.\n\nYou should begin the try block immediately before\
    \ the first line of code that might throw an exception (namely, where we create\
