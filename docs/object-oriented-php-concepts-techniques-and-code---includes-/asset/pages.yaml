    PHP.net: http://php.net

    The official PHP site, where you will find documentation and many code examples.
    It is the primary source of information about PHP.


    pharchitect: http://pharchitect.com

    A monthly magazine for PHP professionals. Available by subscription only.


    Planet PHP: www.planet-php.net

    Links to articles and all the latest news about PHP.


    Zend: www.zend.com

    Information about Zend products, but also many good tutorials by the creators
