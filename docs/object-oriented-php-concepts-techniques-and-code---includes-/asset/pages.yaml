  md: "important, so you display the date using the date function. Likewise with the\
    \ PHP version. Since you are mixing built-in and user-defined classes, specifying\
    \ the class type will reduce confusion.\n\nAs you saw earlier in this chapter,\
    \ the full class description identifies whether you are dealing with a class or\
    \ an interface, and also details the percentage. Because internal elements within\
    \ the class file have been properly formatted, you can extract them using getDoc\
    \ method. When this method is called against an instance of a class, it retrieves\
    \ the comment that immediately precedes the class definition. Let's see how that's\
    \ done.\n\n# Formatting Comments for the Documenter\n\nThe getDocComment method\
    \ is fussy about what it will retrieve, let's look at the format of the comments\
    \ within an existing user-defined class. We'll continue using the MySQLException\
    \ class as an example.\n\n```\n/** use with MySQLConnection and MySQLResultSet\
    \ classes /\n class SQLException extends Exception\n { }\n```\n\nA class-related,\
    \ internal comment must meet the following conditions for the getDocComment method\
    \ to work:\n\n+   - It must immediately precede the class definition statement.\n\
    - It may run to any number of lines but must begin with a forward slash, followed\
