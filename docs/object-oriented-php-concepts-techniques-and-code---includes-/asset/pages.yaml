  md: "In the second case execution is deliberately terminated because your class\
    \ is being misused. You don't want a client programmer to attempt to open two\
    \ connections simultaneously because one is all that's required. Here, you have\
    \ two different kinds of errors, one of indeterminate cause and the other an instance\
    \ of class misuse.\n\n> Recall because PHP is not a compiled language there is\
    \ no such thing a compile-time error. By creating your exception class you partially\
    \ remedy this situation by creating messages that indicate class misuse.\n\n#\
    \ # The MySQLException Class\n\nYou can improve the functionality of a class when\
    \ using inheritance by adding new methods or changing inherited ones. In this\
    \ particular case, the number of changes you can make to existing methods by overriding\
    \ them is severely limited because, as you see in List 10-1, there are only two\
    \ final methods of the Exception class: the constructor and the __toString method.\
    \ Let's change both of these methods (see List 10-3).\n\n```\nclass MySQLException\
    \ extends Exception{\n    // no data members\n    public function __construct($message,\
    \ $errorno){\n        //check for programmer error\n        if($errorno > 5000){\n\
    \            $message = __CLASS__.\" type. Improper class usage. \" . $message;\n\
    \        }else{\n            $message = __CLASS__\" - \" \" . $message;\n    \
    \    }\n        //call the Exception constructor\n        parent::__construct($message,\
    \ $errorno);\n    }\n\n    //override __toString()\n    public function __toString(){\n\
    \        return (\"Error: \" . $this->code - $this->message\");\n    }\n}\n```\n\
    \nList 10-3: Code to create the MySQLException class\n\nTo inherit from an existing\
    \ class and add its functionality to a newly created class, use the keyword extends\
    \ and the parent class name. Since Exception is a built-in class, there's no need\
    \ to explicitly include any files. The keyword extends is all that's needed in\
    \ order to give our newly class immediate access to all the public and protected\
    \ methods and data members of its parent. This is a very succinct and elegant\
    \ way of reusing code."
