  md: '# Overridden Methods


    Listing 10-3 shows all the code required to create a class derived from Exception.
    There are only two methods and both are overridden parent class methods.


    But let''s take a more detailed look, beginning with the constructor. Note how
    it checks the value of the error number. This test is designed to separate errors
    attributable to the programmer from all other errors.


    We''ve chosen the range 5,000 and greater because this range is not used by built-in
    MySQL errors. The message associated with programmer errors misleads of the class,
    and differentiating programmer errors from other errors makes it easier to use
    the database classes.


    For clarity, the error message includes the class name, which is hard-coded by
    using the constant __CLASS__. After identifying the type of error, the Exception
    constructor is called using the scope resolution operator and the keyword parent.
    You encountered similar syntax when referenced a static variable in Chapter 9.
    This is the syntax for calling any parent method from a derived class, and one
    of the few cases where it''s necessary to invoke a magic method directly.


    As you can see, there is no need to hard-code the parent class name because all
    constructors are invoked by calling __constructor—the reason for introducing a
    magic construction method in PHP 5.


    > If a derived class overrides a constructor, there is no implicit call to the
    parent. The call must be made explicitly, in Listing 10-3.


    The __toString method in Listing 10-3 replaces the __toString method inherited
    from the parent class. As a result, a MySQLException echoed to the screen shows
    only the error number and the associated message, which is much less informative
    than the __toString method of the parent class (which traces the error and shows
    its line number). This makes for more secure production code because it reduces
    the information associated with an exception, but it also makes development of
    applications more difficult. (You may want to comment out this code while debugging
    an application, to revert to the more informative method of the parent).


    # Changes to the MySQLConnect Class


    The changes required so that the MySQLConnect class can use mysqli objects are
    minimal. Of course the MySQLConnect class needs to know about this derived exception
    class, but this is easily accomplished with the following statement:


    ```

    require ''MySQLException.php'';

    ```'
