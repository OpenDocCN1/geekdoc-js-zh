  md: "Remember in Listing 13-3 $obj1 was assigned to $obj2, so the identity test\
    \ conducted here shows ① that they are equal. This is because $obj2 is a reference\
    \ to $obj1. After $obj2 is cloned to create $obj3 in Listing 15-4, the test for\
    \ identity produces a negative result.\n\nThe attribute of your newly cloned object\
    \ ③ is changed, and ④ the output shows that this change does not affect the original\
    \ object. In PHP 5, cloning an object makes a copy of an object as the assignment\
    \ operator in PHP 4.\n\nYou may have supposed that in our search for Waldo we\
    \ lost sight of our ultimate goal. Not true. Now that you understand the clone\
    \ operator, you can make sense of the clone method. It is invoked in the background\
    \ when an object is cloned. It allows you to fine-tune what happens when an object\
    \ is copied. This is best demonstrated using an aggregate class as an example.\n\
    \n# Aggregate Classes\n\nAn aggregate class is any class that includes a data\
    \ member that is itself an object. Let's quickly create a Team class as an example.\
    \ This class has a data member, an array of objects called players. The class\
    \ definitions for the Player class and the Team class are shown in Listing 13-5.\n\
    \n```\nclass Player{\n    private $name;\n    private $position;\n    public function\
    \ __construct($name) {\n        $this->name = $name;\n    }\n    public function\
    \ getName() {\n        return $this->name;\n    }\n    public function setPosition($position)\
    \ {\n        $this->position = $position;\n    }\n}\nclass Team{\n    private\
    \ $players = array();\n    private $name;\n    public function __construct($name)\
    \ {\n        $this->name = $name;\n    }\n    public function addPlayer(Player\
    \ $p) {\n        $this->players[] = $p;\n    }\n    public function getPlayers()\
    \ {\n        return $this->players;\n    }\n    public function getName() {\n\
    \        return $this->name;\n    }\n}\n```"
