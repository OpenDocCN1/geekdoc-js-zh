  md: "```\npublic function setName($name) {\n  $this->name = $name;\n}\n```\n\nListing\
    \ 13-5: The Team aggregate class\n\nLet's create a player, add him to a team,\
    \ and see what happens when you clone that object (see Listing 13-6).\n\n```\n\
    $rovers = new Team('Rovers');\n$roy = new Player('Roy');\n$roy->setPosition('striker');\n\
    $rovers->addPlayer($roy);\n$reserves = clone $rovers;\n$reserves->setName('Reserves');\n\
    n// changes both with _clone undefined\n$roy->setPosition('midfielder');\necho\
    \ $roy->getName();\nprint($roy->getPlayers());\necho '<br/>\necho $reserves->getName();\n\
    print($reserves->getPlayers());\n```\n\nListing 13-6: Cloning an aggregate object\n\
    \nSetting a player's position after the clone operation changes the value of position\
    \ for both objects. Outlaying the players array proves this—Roy's position is\
    \ the same for both objects (see Listing 13-7).\n\nRovers Array ([0] => Player\
    \ Object ([name:private] => Roy [position:private] => midfielder )\nReserves Array\
    \ ([0] => Player Object ([name:private] => Roy [position:private] => midfielder\
    \ ))\n\nListing 13-7: Undesired result of cloning\n\nBecause player is an object,\
    \ the default behavior when making a copy is to create a reference rather than\
    \ an independent object. For this reason, any change to an existing player affects\
    \ the players array for both Team instances. This is known as a shallow copy and\
    \ in most cases doesn't yield the desired result. The magic clone method was introduced\
    \ in order to deal with situations such as this. Let's add a _clone method to\
    \ the Team class so that each team has a separate array of players. The code to\
    \ do this is as follows:\n\n```\npublic function __clone() {\n  $newarray = array();\n\
    \  foreach ($this->players as $p) {\n    $newarray[] = clone $p;\n  }\n  $this->players\
    \ = $newarray;\n}\n```"
