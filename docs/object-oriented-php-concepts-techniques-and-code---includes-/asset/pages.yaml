  md: 'The remaining four variables are simply text strings that label the controls
    in the navigator, and they can be changed by the user sees fit:


    ```

    //text for navigation

    private $strfirst = "&lt;";

    private $strnext = "Next";

    private $strprevious = "Prev";

    private $strlast = "&gt;";

    //for error reporting

    private $errorstring;

    ```


    The use of variables for the navigation text means that a programmer can configure
    these values—the look of the navigator is not fixed and can be adjusted to accommodate
    different visual layouts. The final data member is a string variable used for
    error reporting.


    # The Constructor


    Now let''s see how the class is constructed. The constructor accepts six arguments,
    two of which have default values. Here is the constructor declaration:


    ```

    public function __construct($pagen, $totalrecords, $recordsperpage, $recordoffset,
    $maxpagesshoun = 4, $params = "")

    ```


    Four of the parameters to the constructor are simply copied into their class equivalents,
    and all have been discussed in the previous section on the data members.


    ```

    $this->pagename = $pagename;

    $this->recordsperpage = $recordsperpage;

    $this->maxpagesshoun = $maxpagesshoun;

    //already urloded

    $this->params = $params;

    ```


    Note that $params (the variable that contains any additional parameters as name/value
    pair) is not URL-encoded within the class. If it is used, it will need to be URL-encoded
    before it is sent.


    The constructor finishes with calls to a number of private methods:


    ```

    //checkrecordOffset multiple of recordsperpage

    $this->checkrecordOffset($recordoffset, $recordsperpage) or die($this->errorstring);

    $this->setTotalPages($totalrecords, $recordsperpage);

    $this->calculateCurrentPage($recordoffset, $recordsperpage);

    $this->createInactiveSpans();

    $this->calculateCurrentStartPage();

    $this->calculateCurrentEndPage();

    ```


    Let''s look at each of these method calls in turn.'
