  md: "# The SOAP Extension\n\nYou may think that the SOAP extension is best left\
    \ to the large shops doing enterprise programming—well, think again. Although\
    \ the \"simple\" in SOAP is not as simple as the \"simple\" in XML, the PHP implementation\
    \ of SOAP is not difficult to use, at least where the SOAP client is concerned.\
    \ Other objects associated with the SOAP protocol—the SOAP server in particular—are\
    \ challenging. However, once you understand how to use a SOAP client, you won't\
    \ find implementing it intimidating.\n\nIn cases a WSDL file exists—and that is\
    \ the case with the Google API—we don't really need to know much about a SOAP\
    \ client beyond how to construct one because the SOAP protocol is a way of executing\
    \ remote procedures using a locally created object. For this reason, knowing the\
    \ methods of the service we are using is paramount.\n\n# A SOAP Client\n\nTo make\
    \ use of a web service, we need to create a SOAP client. The first step in creating\
    \ a client for the Google API is reading the WSDL description of the service found\
    \ at http://api.google.com/Geocoder.wsdl. SOAP allows us to create a client using\
    \ the information in that file. We will then invoke the googleSearch method of\
    \ this. Let's step through the code in our usual fashion beginning with the file\
    \ dosearch.php. This is the file that actually does the search before handling\
    \ the results over to an AJAX call. The first step is to retrieve the search variable.\n\
    \n```\n<php\n$criterion = @htmlentities(\\$_GET[\"criterion\"], ENT_NOQUOTES);\n\
    if(strpos($criterion, \"\")) {\n\t$criterion = stripslashes($criterion);\n\t\t\
    echo \"<b>\" . $criterion . \"</b></p><p style=\"border:1px dotted black\">\"\
    \ / /;\\t} else {\n\t\techo \"<b>\" . $criterion . \"</b></p><p style=\"border:1px\
    \ dotted black\">\" / /;\n}\n?>\n```\n\nWrapping the retrieved variable in a call\
    \ to htmlentities is not strictly necessary because we're passing it on to the\
    \ Google API and it will be filtered. However, filtering input is essential for\
    \ security and a good habit to cultivate.\n\n# Make It Site-Specific\n\nA Google\
    \ search can be restricted to a specific website in the same way that this is\
    \ when searching manually in a browser—you simply add site: followed by the domain\
    \ you wish to search for the existing criterion. Our example code searches the\
    \ No Search Press site, but substitute your values for the bold text."
  merge: -1
  pgno: 124
- img_proc: true
  md: "```\n//put your site here\n$query = $criterion \"site:www.yoursite.com\";n$your\
    \ Google key goes here\n$key = \"your_google_key\";\n```\n\nIn this particular\
    \ case we are only interested in the top few results of our search. However, if\
    \ you look closely at the code, you'll quickly see how we could use a page navigator\
    \ and show all the results over a number of different web pages. We have a $start\
    \ variable that can be used to adjust the offset at which to begin our search.\
    \ Also, as you'll soon see, we can determine the total number of results that\
    \ our search returns.\n\n```\n$maxresults = 10;\n$start = 0;\n```\n\n# A SoapClient\
    \ Object\n\nCreating a SOAP client may throw an exception, so we enclose our code\
    \ within a try block.\n\n```\ntry{\n    $client = new SoapClient(\"http://api.google.com/GoogleSearch.wsdl\"\
    );\n```\n\nWhen creating a SoapClient object, we pass an elective second argument\
    \ to the constructor that configures the options of the SoapClient object. However,\
    \ this argument is usually necessary when no WSDL file is provided. Creating a\
    \ SoapClient object returns a reference to GoogleSearchService. We can then call\
    \ the GoogleSearch method of this service. Our code contains a comment that details\
    \ the parameters and the return type of this method.\n\n```\n/*\ndoGoogleSearchResponse\
    \ doGoogleSearch(string key, string query, int\nstart, int maxResults, boolean\
    \ filter, string restrict, boolean\nsafeSearch, string lr, string ie, string oe)\n\
    */\n$results = $client->doGoogleSearch($key, $query, $start, $maxresults,\nfalse,\
    \ \"\", \"\", \"\", \"\");\n```\n\nThis method is invoked, as any method, by using\
    \ an object instance and the arrow operator. The purpose of each argument to the\
    \ GoogleSearch method is readily apparent except for the final three. You can\
    \ restrict the search to a specific language by passing in a language name as\
    \ the third-to-last parameter. The final two parameters indicate input and output\
    \ character set encoding. They can be ignored; use of these arguments has been\
    \ deprecated."
