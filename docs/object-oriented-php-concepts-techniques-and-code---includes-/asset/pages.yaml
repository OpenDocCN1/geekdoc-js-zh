  md: 'The methods that make use of metadata are setTableNames and getFieldNames.
    Let''s examine the method setTableNames in Listing 15-8. This method makes use
    of the sqlite_master—a table that defines the schema for the database. By querying
    sqlite_master, we can retrieve the names of all the tables and views in the database.
    The type field defines the kind of resource, in our case a table or view. This
    method retrieves the names of all the tables and views stores them in an array.


    Ideally, this would be called once from the constructor, the constructor for an
    SQLite database is declared final, so it may not be overridden.


    Pragmas perform a variety of functions in SQLite. One of functions is to provide
    information about the database schema—about indices, foreign keys, and tables.


    Running the pragma table_info returns a result set that contains the column name
    and data type. The data returned is the data type used when the table was created—since,
    all fields are strings—this information could be used to assist data validation.
    For example, with access to a data type description, we could programmatically
    enforce which values are allowed for which fields. Notice that the pragma table_info
    can also be used with views. However, when used with views, all fields default
    to numeric.


    A word of warning about pragmas: They fail quietly, issuing no warning or error,
    and there is no guarantee of forward compatibility with newer versions of SQLite.


    # Getting Metadata


    Metadata methods allow us to discover field names at runtime. This is useful when
    we want to match posted values to the appropriate field in a table. Figure 15-2
    shows the form that we will use to post data to the database.


    | URL to add: | http:// |

