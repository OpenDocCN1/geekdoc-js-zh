  md: 'In the context of database classes, the description of the requirements immediately
    suggests the use of the SQL ORDER BY, WHERE, and LIMIT clauses to order, filter,
    and extract subsets respectively. You had to recreate this kind of functionality
    for the DirectoryItems class, but why recreate what''s already available in SQL?


    Just as PHP''s built-in manipulation functions helped create the Thumbnail class,
    also for assistance from the existing MySQL-related functions. If you''ve used
    these functions before, you''ll immediately know which ones are the most important
    and the most commonly required. Obviously, you''ll need mysql_connect to create
    a connection to a clients server. Creating a connection is a prerequisite for
    using mysql_select_db to select a database and mysql_query to execute a query
    and return a result set of rows.


    # Lump or Two?


    There are two distinct classes that can be built around these existing PHP functions,
    depending upon your preferences: a connection class and a result set class. First,
    you''ll create a database connection class, as you might imagine, making use of
    the mysql_connect function. A connection is specific and can be used to create
    any number of result sets taken from any database on that server. It simply sets
    up communication between a web page and a database server. A result set makes
    use of a connection in order to update or display data. You''ll build a MySQL
    result set class around the mysql_select_db and mysql_query functions.


    You will develop fairly skeletal versions of these two classes, emphasizing any
    unexplored areas of object-oriented programming (OOP). Nevertheless, these classes
    will be perfectly fit for the task of testing the versatility of the PageNavigator
    class.


    In this chapter, we''ll take a slightly different approach to the code. I''ll
    show the data members and methods of the class, but I''ll only produce code that
    requires comment. As usual, the complete code is available on the companion website,
    so don''t hesitate to download and refer to it if you find this helpful.


    # The MySQLConnect Class


    The MySQLConnect class is a fairly modest class with only two data members and
    four public methods.


    ```

    //data members

    private $connection

    private static $instances = 0

    //methods

    public function __construct($hostname, $username, $password)

    public function __destruct())

    public function createResultSet($strSQL, $databasename)

    public function close()

    ```'
