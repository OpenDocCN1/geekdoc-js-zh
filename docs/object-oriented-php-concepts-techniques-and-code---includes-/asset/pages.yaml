- img_proc: true
  md: 'Chapter 3 deals with the improvements to PHP''s object model in version 5.
    With these improvements, PHP is now a full-blown OO language. It should be judged
    by how well it does the job, not on the basis of a preceived notion of what a
    scripting language should or shouldn''t do. After all, a programming language,
    scripting or otherwise, is just a tool, a means to an end. Tools are meant to
    be judged by what they are, but by what they can do.


    # Object Orientation Is For Large Software Shops


    Another argument against OOP goes like this: OOP is something best left to the
    large shops. If a number of programmers are involved in the same project, an OO
    approach is a necessary evil, but it''s not much use for the lone developer. Because
    big shops have many different programmers doing somewhat specialized jobs, OO
    approach is required. It is not something that the lone developer needs to worry
    about. The lone developer needs to coordinate his efforts with others, so a procedural
    approach is the better way.


    This point of view correctly identifies the fact that an OO approach is more modular
    and thus more suitable to an environment that requires collaboration. It is also
    true that in circumstances a single developer can do a superior job—too many cooks
    can spoil the broth. And it is probably also true that an OO approach will slow
    development. But an OO solution takes more time than a procedural one only the
    first time that the solution is created. The lone developer can benefit from the
    reusability and adaptability of an OO solution just like any large software shop.


    # Leave Well Enough Alone


    We''ve dealt with the reasoned arguments against an OO approach to web development,
    but in many cases what''s at work is a reluctance to change. PHP has been exceptionally
    successful as a procedural language. If it ain''t broke, why fix?


    Computer languages, like their natural counterparts, must keep pace with the changes
    in the environment or risk becoming irrelevant. OOP does not require procedural
    programming or make it obsolete. Nor is an OO approach always the right approach,
    as some OO enthusiasts might have you believe. However, some problems require
    an OO solution. Additionally, without a minimal understanding of the basics of
    OOP, you can''t make full use of the capabilities of PHP 5. For instance, if you
    want to create a SOAP client, there is no other way to do it than by using the
    SOAP client.


    There''s no requirement that you start programming with an OO approach you choose
    this way. PHP is a hybrid language with OO capabilities granted onto it. You can
    use an OO approach when you want and otherwise revert to procedural programming.


    # Increased Complexity


    Fear of PHP becoming overly complex is often a more subtly stated objection to
    an OO PHP. No doubt that OOP can sometimes introduce'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'unwanted complexity—just look at multiple inheritance in C++ or Enterprise
    Java, for example. This hasn''t happened with PHP, and there''s good reason to
    suspect that it won''t. PHP is first and foremost a web development language (which
    is why it has taken so long for PHP to adopt an OO approach). Web programming
    is a specialized form of programming, and OO capabilities have been introduced
    to serve this end. The fact that PHP''s implementation of OOP doesn''t always
    make OO purists happy is indicative of this. Even as a procedural language, PHP
    was never about being pretty or being a model language; it has always been about
    solving web problems.


    A quick look at the culture of PHP should convince you that PHP is unlikely to
    develop into an overly complex language.


    # The PHP Culture


    Culture is not something that is usually associated with a programming language,
    but looking at the culture of PHP will help you understand PHP''s implementation
    of OOP. PHP is an open-source language created more than 10 years ago by Rasmus
    Lerdorf. It has all the marks of a successful open-source project: It has around
    for a number of years, it is continually being upgraded, it has a robust developer
    community, and it has continuity of leadership—Rasmus Lerdorf still takes a active
    role in its development.


    PHP is by far the most popular web development language, and the major reason
    for its success is ease of use. This is no accident, it is easy to use because
    it was conceived as a language to simplify web development. This has not been
    forgotten with PHP''s upgrade to a full-blown OO language. For example, one of
    the new classes introduced in PHP 5 is the aptly named Element. With this class
    you can incorporate an RSS feed into a page using only four lines of code (see
    Chapter 12).


    The point of object orientation in PHP is not to turn PHP into Java or something
    similar, but to provide the tools for developers. Object orientation is another
    strategy for adapting to the current circumstances of web development.


    NOTE The impetus to “Keep It Simple, Stupid” is alive and well (and, as it happens,
    living in Paris). At a recent meeting of PHP developers, the introduction of a
    new keyword was rejected as “against the KISS approach of PHP” (minutes, PHP Developers
    Meeting, Paris, November 11 and 2005).


    Unquestionably there will be a learning curve for a procedural programmer adopting
    an OO approach to web development, you''ll quickly pick up on PHP''s implementation
    of OOP. In fact, you''ll probably find that some of the tasks you''re doing procedurally
    are more easily done in an OO manner. I suspect that once you''ve started on the
    OO path, you''ll find more and uses for it.


    > 5 See Rasmus Lerdorf. “Do You PHP?” available at www.oracle.com/technology/pub/articles/php_experts/rasmus_php.html.
    (Accessed March 14, 2006).'
  merge: -1
