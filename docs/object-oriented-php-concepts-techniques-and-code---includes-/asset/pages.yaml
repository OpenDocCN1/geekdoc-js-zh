  md: 'And there are other considerations besides code compatibility. After learning
    the ins and outs of OOP with PHP 5, will you actually be able to make use of it?
    Are there actually servers out running PHP 5?


    # Adoption of PHP 5


    As this writing PHP 5 is hardly a bleeding-edge technology. It has available for
    more than a year, and there have been a number of bug fixes. It''s a stable product.
    Where developers have control over server configuration there''s no question that
    upgrading to PHP 5 will be beneficial. But developers don''t always have a choice
    in this matter. In some situations (where the developer has no control of the
    web host, for instance), the decision to upgrade is in someone''s hands.


    PHP is a victim of its own success. The popularity and stability of PHP 4 have
    slowed the adoption of PHP 5. PHP 5 is a mature language that supports many applications,
    open-source and otherwise. It''s naturally a reluctance to rock the boat. For
    this reason the adoption of PHP 5 has been somewhat slow, especially in shared
    hosting environments.


    Other hosting options have been much quicker to adopt PHP 5. The various private
    server (VPS) hosting options usually include PHP 5, as do dedicated hosts. As
    a more secure and increasingly inexpensive hosting option, VPS is becoming much
    more popular.


    # Compromise


    Widespread adoption of PHP 5 will happen sooner or later, but this book recognizes
    that developers may need, at least for a time, to continue writing applications
    that will run under PHP 4. For this reason, wherever, a PHP 4 version of code
    has been provided to the PHP 5 version.


    In a sense, PHP 5 just formalizes what was already possible in PHP 4. For instance,
    even though PHP 4 allows access to instance variables, when creating a class in
    PHP 4 makes sense to write accessor methods for variables rather than setting
    or retrieving them directly. This requires a disciplined approach, but it will
    yield code that only runs under PHP 4 and also will be much easier to upgrade
    to PHP 5. Adding restrictive access modifiers to variables will be a relatively
    simple task if accessor methods are already in place. Writing code with the expectation
    of upgrading it will also invariably mean writing better code.


    That''s all the talk about OOP. In the remaining chapters you''re going to do
    OOP.'
