- img_proc: true
  md: 'This setting controls whether warning is issued when a variable is passed by
    reference when making a function call. With this setting off, calling a function
    in the following way will issue a warning and not pass $some_variable by reference:


    ```

    some_function(&$some_variable);

    ```


    The recommended way of passing a variable by reference is by declaring the parameter
    as a reference in the function definition, like so:


    ```

    function some_function ( &$some_variable ) {

    ...

    ```


    If you do this, there is no need to use an ampersand when passing a variable to
    some_function. (If you are upgrading PHP 4 code that passes objects at call time
    by reference, you remove ampersands entirely. You will recall that PHP 5 objects
    are automatically passed by reference, there is no need for an ampersand at call
    time or in the function definition.) It is a good idea to upgrade your code to
    pass by reference in the recommended manner because call-time pass by reference
    is unlikely to be supported in future versions of PHP.


    # E_STRICT


    A new error level, E_STRICT, has been introduced and is especially useful in the
    context of OOP. If you set error reporting to this value, a warning will be issued
    when deprecated functions or coding styles are used. Error E_ALL does not encompass
    E_STRICT, so include this error explicitly in the php.ini file in the following
    way:


    ```

    error_reporting = E_ALL|E_STRICT

    ```


    To see how this setting can be useful, suppose, in the style of PHP 4, that you
    do the following:


    ```

    $obj1 =new Person();

    ```


    With error reporting set to E_STRICT and display_errors set to on, you''ll receive
    the message:


    Strict Standards: Assigning the return value of new by reference is deprecated...'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'Other actions also raise a warning when error reporting is to E_STRICT.


    +   - Use of is_a instead of instanceof.


    +   - Invoking a non-static function statically (this error is soon to be E_FATAL).
    However, calling a static method against an instance variable does not raise a
    warning.


    +   - Use var instead of public, private, or protected (prior to version 5.1.3).


    +   - Changing the number of parameters or the type hint when overriding method
    in a derived class.


    Making sure that your code follows strict standards can help ensure that it is
    forward compatible especially with respect to calling dynamic methods statically.


    # Don''t Escape Twice


    There''s a final setting that has bearing on OOP.


    It''s worthwhile noting that the default setting for magic quotes is


    ```

    magic_quotes_gpc = Off

    ```


    As you have seen, methods such as the prepare method of the PDO class automatically
    escape database queries. So, if magic quotes are turned on, you can easily corrupt
    data by escaping it twice. Use care if you change this setting.'
