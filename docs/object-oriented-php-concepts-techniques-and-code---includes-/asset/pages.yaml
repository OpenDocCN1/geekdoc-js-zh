    <p>Date: \" . $today<br />\\n\";\n  echo \"PHP version: \" . PHP_VERSION . \"\
    <br />\\n\";\n  echo \"Type: \" . $class->getClassType() . \"<br />\\n\";\n  echo\
    \ \"<span class='fulldescription'>\" . $class->getFullDescription() . \"</span><br\
    \ />\\n\";\n  echo $class->getDocument() . \"</p>\\n\";\n}\n```\n\nBecause creating\
    \ an instance may throw a ReflectionException, enclose your call to the constructor\
