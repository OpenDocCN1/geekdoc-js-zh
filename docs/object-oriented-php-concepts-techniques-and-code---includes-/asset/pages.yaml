  md: '# SETTING UP PHP 5


    All recent major Linux distributions (SUSE, Fedora, Mandriva, and Debian among
    them) come with support for PHP 5. If your distribution doesn''t support version
    5, the easiest solution is to locate and install an updated working from the command
    line in Red Hat Package Manager (RPM). Otherwise, you will need to download the
    PHP source code and configure PHP your-self. (If you want to install PHP as a
    static module, you will also have to download the source code for Apache). Instructions
    for compiling PHP are readily available at http://php.net, but taking this route
    requires familiarity with the command line in Linux.


    PHP 5 also runs under Windows Internet Information Server (IIS) or Apache Web
    Server. Although Windows does not come with built-in support for PHP, installing
    PHP is a relatively easy task. The Windows PHP installer will get you up and running
    in minutes, but it is not meant for a production server—it''s better to perform
    a manual installation. Comprehensive instructions for doing this are provided
    at http://php.net/install, but here''s a brief overview of the process.'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'Download the Windows binary from the PHP website, and install it to a directory
    on your hard drive. If you are using IIS, find the web server configuration and
    map the .php file extension to the location of the php program.


    For Apache Server 2, you will need to make the changes to the httpd.conf file:


    ```

    LoadModule php5_module ":/php-5.1/phpapache2.dll"

    ```


    If you are running version 1.3 of Apache, the php5apache.dll file. You will also
    have to add an application type to your configuration file. The example below
    will process files with the extensions .php or .inc files.


    ```

    AddType application/x-httpd-php .php .inc

    ```


    Comprehensive instructions for installing and configuring Apache Windows can be
    found at http://apache.org/docs/2.0/platform/windows.html, but again, the process
    is fairly straightforward.

    The code contained in this book should run equally well regardless of which combination
    of operating system and web server you choose.


    # php.ini Settings


    The php.ini file controls configuration settings for PHP and is typically found
    in the c:\windows directory on Windows systems and in the /etc directory on Linux
    systems. When installing PHP 5 it is best to use the example php.ini file with
    the default settings. This section deals with changes that affect OOP. (For an
    overview of all the changes, see http://php.net/install/).


    There is only one new configuration setting that relates directly to changes made
    to the object model in PHP 5. Specifically, showing the default setting,


    ```

    zend_ze_compatibility_mode = Off

    ```


    If you change this setting to On, objects will be copied by value in the manner
    of PHP 4. (The section "clone" on page 116 for more details about how objects
    are copied.) This option is provided in order to facilitate migration from PHP
    4 to PHP 5. It should be used for this purpose only, as it is unlikely to be supported
    in any upcoming versions of PHP.


    Another setting that has some bearing on changes made to the object model in PHP
    5 is


    ```

    allow_call_time_pass_reference = Off

    ```'
