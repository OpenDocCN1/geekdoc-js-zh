  md: "```\nforeach ($xml->attributes() as $key => $value) {\n  echo \"RSS $key value\"\
    ;\n}\n```\n\nThe channel title can be referenced in an OO fashion as a nested\
    \ property. Please note, however, that we cannot reference $xml->title from quotation\
    \ marks because it is a complex expression. Alternate syntax using curly braces\
    \ is shown in the comment below.\n\n```\necho \"<h2>\" . $xml->title . \"</h2>\\\
    n\";n// below won't work\necho \"<h2>\" . $xml->title . \"</h2>\\n\"\n// may use\
    \ the syntax below\necho \"<h2>\"$xml->channel . \"</h2>\\n\";echo \"<p>n\";\n\
    ```\n\nAs you might expect, a SimpleMLElement supports iteration.\n\n```\n//iterate\
    \ through items as though array\nforeach ($xml->channel->item as $item) {\n  $strtemp\
    \ = \"<a href=\"$item->link\">\";\n  \"$item->title</a> $item->description<br>\
    \ /br />\\n\"\n  echo $strtemp;\n}\n?>\n```\n\nI told you it was going to be easy,\
    \ but I'll bet you didn't expect so few lines of code. With only a basic understanding\
    \ of the structure of an RSS file we were able to embed an RSS feed into a web\
    \ page.\nThe SimpleXML extension excels in circumstances such as this where the\
    \ file structure is known beforehand. We know we are dealing with an RSS file,\
    \ and if we know if the file is well-formed it must contain certain elements.\
    \ On the other hand, if we don't know the file format the SimpleXML extension\
    \ won't be able to do the job. A SimpleMLElement cannot query an XML file in order\
    \ to determine its structure. Living up to its name, Simple is the easiest XML\
    \ extension to use. For more complex interactions with XML you'll have to use\
    \ the Document Object Model (DOM) or the Simple API for XML (SAX) extensions.\
    \ In any case, by providing the Simple extension, PHP 5 has stayed true to its\
    \ origins and provided an easy way to perform what might otherwise be a fairly\
    \ complex task.\n\n# Site-Specific Search\n\nIn this portion of the chapter we\
    \ are going to use the Google API and the SOAP extension to create a site-specific\
    \ search engine. Instead of creating our own index, we'll use the one created\
    \ by Google. We'll access it via the SOAP protocol. Obviously, this kind of search\
    \ engine can only be implemented for a site that has indexed by Google."
