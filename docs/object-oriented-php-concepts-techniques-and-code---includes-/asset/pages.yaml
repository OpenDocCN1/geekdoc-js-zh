  md: "You've properly used loops in many different circumstances (most likely with\
    \ arrays), but you may not have given much thought to what goes on in the background.\
    \ Listing 10-7 shows what happens in a foreach loop. At the start of the loop\
    \ an implicit call is made to the rewind method, ensuring that you are at the\
    \ beginning and the first record is ready to be displayed. If there is a valid\
    \ record you can enter the loop with the record pointer to the current row. The\
    \ record pointer is then advanced—by making an implicit call to next—and the process\
    \ is repeated until the end of record set is reached.\n\n# ITERATOR METHODS\n\n\
    We'll seldom use the iterator methods directly. We're implementing this interface\
    \ so we can use a MySQLResultSet in a foreach loop. In a sense, these methods\
    \ are magic because they are invoked in the background by the foreach construct\
    \ in the same way that the method of the MySQL class is invoked when a MySQL object\
    \ is destroyed. Any object used within a foreach loop must devise its own iterator\
    \ methods. The implementations will differ significantly from a result set iterator,\
    \ for example, but all objects that implement a specific interface will exhibit\
    \ common behaviors. The point of an interface is that it guarantees the existence\
    \ of specific methods without specifying exactly what these methods should do.\n\
    \n# Implementation\n\nTo implement an interface, you need to indicate inheritance\
    \ in your class definition. When inheriting from a class you use the keyword extends,\
    \ but when inheriting from an interface you use implements. Your class definition\
    \ now reads\n\n```\nclass MySQLResultSet implements Iterator\n```\n\nImplementing\
    \ an interface also requires that all methods be defined.\nin this particular\
    \ case you must add the five methods of an iterator, as the new data members currentrow,\
    \ valid, and key, to your existing class. The currentrow member will hold the\
    \ value() of the current row. The valid member is a Boolean that indicates whether\
    \ there is a current row. The key member simply functions it as an array subscript.\n\
    \n# Five New Methods\n\nThe first three methods that your new class MySQLResultSet\
    \ inherits from the Iterator interface are straightforward accessor methods that\
    \ return the newly added members, like so:\n\n```\npublic function currentrow()\
    \ {\n    return $this->currentrow;\n}\nublic function key() {\n    return $this->key;\n\
    }\n```"
