    \ the Iterator interface beginning with the keyword class, Iterator begins with\
    \ interface, but otherwise it looks like a class. Notice that method names have\
    \ access modifiers and that the method declarations are followed by semicolons.\
    \ There are no braces following the method names because there is no implementation—which\
    \ is precisely what makes an interface. The interface is a skeleton; an implementing\
    \ class must flush it out.\n\n# Learning About the Iterator Interface\n\nHere's\
    \ a brief description of each method in the Iterator interface:\n\n+   * current\
    \ | Returns the current element\n* key | Returns the key of the current element\n\
    * next | Moves forward to the next element\n* rewind | Rewinds the iterator to\
    \ the first element\n* valid | Checks to see if there is a current element after\
    \ calls to rewind or next\n\nA bit more can be gleaned from watching an iterator\
    \ in action. For example, the code in Listing 10-7 traverses an iterable object\
    \ using all of the methods in the Iterator interface.\n\n```\n$iterator->rewind();\n\
    while($iterator->valid()){\n    echo $iterator->key();\n    print_r($iterator->current());\n\
    \    $iterator->next();\n}\n```\n\nListing 10-7: Using the methods in the Iterator\
    \ interface to traverse an iterable object\n\nYou begin by calling the rewind\
    \ method to ensure that you are at the start of the result set. The call to valid\
    \ controls the while loop so that it continues only as long as there is another\
    \ record to retrieve. In our implementation, the key returned by the key method\
    \ will be a number; it is displayed simply for demonstration purposes. The method\
