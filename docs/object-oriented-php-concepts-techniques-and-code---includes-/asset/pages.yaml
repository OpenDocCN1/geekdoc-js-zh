  md: 'In terms of the preceding database analogy, making an instance variable private
    means that access to the data is only permitted through use of the programmer’s
    application or front end.


    But wait, it''s code, right? You won''t change it improperly, so why should you
    care? Because OO programming assumes other programmers may use your code and vice
    versa.


    Bruce Ekel refers to this as programmers using objects created by class creators.
    Even if you are a lone developer and don''t expect other programmers to use your
    code, access modifiers are still an important safeguard. Why? How many times have
    you returned to your own code, even after only a short period of time away from
    it, and had trouble figuring out exactly what you were trying to achieve? Clearly,
    in this situation, even though you are the originator, you are also, at the same
    time, a client programmer. The use of access modifiers forces the programmer to
    make his or her intentions explicit. If a particular data member or method relates
    to the internal behavior of a class, applying the appropriate access modifier
    documents this intention. If nothing else, we all need access modifiers to protect
    our code from that most presumptuous of client programmers—ourselves.


    When first encountering the private keyword, there is sometimes a tendency to
    view it as a security measure and then point out its ineffectiveness by showing
    how easily a malicious user could subvert it. Even so with a non-compiled language
    like PHP, because it''s an easy to change a modifier from private to public. It''s
    better to use the view of access modifiers as indicative of the originating programmer’s
    intentions—as a form of internal documentation. However, the use of access modifiers
    does add to security insofar as well thought out and well documented class is
    a more secure class.


    The private keyword can be applied to methods as well as data members. You''ll
    see an example of a private method later in this chapter, but for the moment,
    let''s look at the use of the modifier public when applied to a method.


    Once the private keyword is appears, so is the need for a public method or interface
    so private data members may be accessed in a controlled fashion. Now that the
    $filearray variable is private, you no longer have any kind of access to it. For
    this reason, you need a public method, sometimes called an accessor method, in
