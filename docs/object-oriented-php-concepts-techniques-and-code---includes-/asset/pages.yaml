  pgno: 96
- img_proc: true
  md: 'In addition to restricting access and controlling the way that a client programmer
    can use a class, the keywords private, protected, and public play a role in inheritance.
    Protected methods and data members are inherited from a derived class, but restricted
    access is preserved.


    # final


    The keyword final also has meaning only in the context of inheritance.

    When a method is defined as final, no derived class can change it. With non-final
    methods, a derived class can redefine the function and have it something different.
    A class derived from the Exception class cannot create a new getCode method. On
    the other hand, there are no restrictions on creating a derived method _toString.


    > From the point of view of the class originator, the keyword final is a way of
    ensuring that certain elements of a class are not changed. Additionally, when
    final is applied to a class as a whole, nothing in that class can be changed.


    # More Magic Methods


    The Exception class contains two new methods. We''ll discuss each in turn.


    # __toString


    If the _toString method of a class is defined, it is invoked automatically-ever
    that class is displayed. For example, suppose you create an instance of the Exception
    class and want to echo it to the screen like:


    ```

    $se = new Exception();

    echo $se;

    ```


    The expected result when echoing a simple variable to the screen is obvious. For
    example, if the variable is an integer with the value of 5, you expect to appear
    on the screen. However, if you echo an instance variable to the screen, and the
    _toString method is not defined, you''ll see something like Object ##. Because
    objects are composite, they are made up of a number of data members and methods,
    it is not readily apparent what the string representation of an object should
    be.


    The _toString method was introduced to control what happens when a class is displayed.
    It allows you to define a more meaningful string representation of your class.
    It is called "magic" because it is invoked in the background whenever an instance
    variable is the object of the print or echo functions. In the example code snippet,
    when $se is output to the screen, an implicit call is made to _toString method.


    A _toString method can be a convenient way of looking at the properties of an
    object in much the same way that the print_r function displays all the keys and
    values of an array.(We''ll explain this method again later in this chapter when
    we discuss the MySQL class in connection with catching exceptions.)'
