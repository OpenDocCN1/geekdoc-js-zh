  md: "no intrinsic need for this method to be magic. For example, in Java, constructors\
    \ bear the name of the class with no negative consequences. On the other hand,\
    \ destructors are a necessity and would seem to have to be magic. They are not\
    \ invoked by any action of the developer, but automatically when an object goes\
    \ out of scope. There's the _toString method, which is called implicitly whenever\
    \ an object is displayed using print or echo—a convenience method more than anything\
    \ else. In any case, the reasons for providing magic methods are various and in\
    \ each case worthy examining.\n\nIn this chapter we will look at magic methods\
    \ that we haven't discussed. Related and complementary methods will be discussed\
    \ together.\n\n# get and _set\n\nFor the context of this discussion, remember\
    \ that we spent some time discussing accessor, or set and get methods, in Chapter\
    \ 6. I argued that instance variables should be made private and only retrieved\
    \ through accessor methods. Doing otherwise violates the object-oriented (OO)\
    \ principle of data hiding (encapsulation if you prefer) and leaves instance exposed\
    \ to inadvertent changes.\n\nPHP 5 introduces magic set and get methods for undefined\
    \ variables. Let's see what this means by looking at an example. Suppose you have\
    \ a class, devoid of any data members or methods, defined as follows:\n\n```\n\
    class Person{\n}\n```\n\nPHP allows you to do the following:\n\n```\n$p = new\
    \ Person();\n$p->name = \"Fred\"\n$p->street = \"36 Springfield Blvd\";\n```\n\
    \nEven though name and street data members have not been declared within the Person\
    \ class, you can assign them values and, once assigned, can retrieve those values.\
    \ This is what is meant by undefined instance variables. You can create magic\
    \ set and get methods to handle any undefined instance by making the changes to\
    \ the Person class, as shown in Listing 13-1.\n\n```\nclass Person{\nprotected\
    \ $datamembers = array();\npublic function __set($variable, $value) {\n    /perhaps\
    \ check value passed in\n    $this->datamembers[$variable] = $value;\n}\npublic\
    \ function __get($variable) {\n    return $this->datamembers[$variable];\n}\n\
    }\n$p = new Person();\n$p->name = \"Fred\";\n```\n\n> Listing 13-1: Defining magic\
    \ set and get methods"
