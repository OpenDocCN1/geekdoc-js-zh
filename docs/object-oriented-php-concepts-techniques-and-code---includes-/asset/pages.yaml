  md: 'This is a fairly simple example of a prepared statement, but it will give you
    an understanding of how statements work. A replaceable parameter (?) is indicated
    by a question mark, this parameter (?) is bound to the variable $number, and each
    iteration of the foreach loop executes the query, inserting a different value.


    Using statements is much more efficient than separately querying the database.
    The performance improvements are due to the fact that after a parameterized query
    is first executed, each subsequent query only the bound data needs to be passed.


    Remember, there''s no such thing as a prepared statement in SQLite. The developers
    of PDO do thought it important to support this feature for all databases regardless
    of native support. Using PDO is a good way to familiarize yourself with it and
    makes it easy to switch to a database that supports this capability.


    # Fetching Objects


    For OO programmer, the ability to retrieve rows as objects is important. PDO has
    a number of ways of doing this. An easy way of doing this is to create an instance
    of the PDORow class in the following way:


    ```

    $stmt = $pdo->query("SELECT * FROM tblresources", PDO::FETCH_LAZY);

    $pdorow = $stmt->fetch();

    ```


    There is also a fetchObject method that can be used to create an instance of a
    specific class. Supposing we have defined a class RowInfo, creating an instance
    of class done in this way:


    ```

    $row = $stmt->fetchObject(''RowInfo'');

    ```


    This is perhaps the simplest way to create an object. You can use it with an existing
    class or if you don''t specify a class, it will create an instance of stdClass,
    the generic object class.


    What these various ways of creating objects have in common is that they instantiate
    an object, creating data members from the columns of the current row.


    PDO also has a method, getColumnMeta, to dynamically retrieve metadata about the
    current query. Using this method in conjunction with one of the create object
    methods and adding a magic method to the class you''re instantiating, it is easy
    to retrieve the data members of any object created from any query without knowing
    the structure of that before. Perhaps our criticisms of magic set and get methods
    in Chapter 13 were a little harsh.


    SQLite is a procedural version of fetchObject that returns a stdClass object.
    It is documented as a result set but not yet implemented.


    > 2 You could, query the sqlite_master table for this information, but the PDO
    method provides a database-independent way of doing this.'
