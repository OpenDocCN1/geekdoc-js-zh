  md: '# # 14


    # ## CREATING DOCUMENTATION USING THE REFLECTION CLASSES


    ![](img/c8663459ed204f27b8d015c8a3d2acad_144_0.png)


    In Chapter 4, I introduced a simple class called DirectoryItems. You may remember
    what it does, but you probably can’t remember the specific methods. With a user-defined
    class, looking up forgotten methods usually means rooting through the class definition
    file. This can take a long time, especially for large classes. For an internal
    class you can go to http://php.net to look up the information you need. But there
    are more than 100 internal classes and interfaces, and their documentation is
    scattered throughout the PHP site. Wouldn’t it be useful to have a central repository
    of documentation for all classes?


    Finding documentation is one problem, the quality of documentation is another,
    equally important, problem. Most developers know the value of accurately commented
    code, but when you are in the middle of coding, the meaning of your code always
    seems crystal clear, so comments appear superfluous. Besides, there’s always the
    ultimate excuse for the absence of internal documentation—you want to keep file
    size small to reduce download time.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'This is often the situation with internal documentation, but external documentation
    fares no better. It doesn''t make sense to write it you go because things always
    change, but by the time you''ve finished coding, documentation is the furthest
    thing from your mind. You''re ready to move on to something else.


    This chapter offers a solution to the two problems of ready availability and quality
    of documentation. We''re going to create a documentation class derived from a
    new set of classes introduced in PHP 5, the reflection group. You''ll learn how
    to generate documentation dynamically that will fully describe methods and data
    members that will incorporate properly formatted internal comments for user-defined
    classes.


    # Are the Reflection Classes?


    In Chapter 10, before implementing the Iterator interface, you had to understand
    its methods. To create a class that will do your documenting for you, you need
    to become familiar with the reflection classes. This group of classes was created
    for the express purpose of introspecting other classes. These classes make it
    possible to examine the properties of other classes by retrieving data about classes;
    you can even use them to examine the reflection classes


    Reflection provides information about the modifiers of a class interface—whether
    that class is final or static, for example. It can also reveal all the methods
    and data members of a class and all the modifiers applied to them. Parameters
    passed to methods can also be introspected and the names of variables exposed.
    Through reflection it is possible to automate the documentation of built-in classes
    or user-defined classes. It turns out that the central repository of information
    about classes was right in front of us all the time. PHP can tell us all itself
    through the mirror of the reflection classes.


    # The Reflection Group of Classes


    The reflection group of classes or Application Programming Interface (API) is
    made up of a number of different classes and one interface, shown here:


    ```

    class Reflection

    interface Reflector

    class ReflectionException extends Exception

    class ReflectionFunction implements Reflector

    class ReflectionParameter implements Reflector

    class ReflectionMethod extends ReflectionFunction

    class ReflectionClass implements Reflector

    class ReflectionObject extends ReflectionClass

    class ReflectionProperty implements Reflector

    class ReflectionExtension implements Reflector

    ```'
