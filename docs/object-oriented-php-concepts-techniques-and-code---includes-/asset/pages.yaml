  md: '# Upgrading to PHP 5


    As you''re aware, the major change to PHP with version 5 is improved support for
    OOP. In this regard, two of the most important changes are the introduction of
    access modifiers and changed syntax for class construction. Both of these changes
    will have an impact on the DirectoryItems class.


    # Access Modifiers


    Next to the concept of a class, access modifiers are arguably the most important
    feature of an OO language. The principal use of access modifiers is to describe
    and constrain data members and methods. The access modifiers we are concerned
    with this chapter are public and private. The modifier private is used to modify
    or describe matters relating to the internal behavior of a class. The modifier
    public is used to describe the external behavior of a class, or if you prefer,
    a class''s interface.


    As far as syntactic changes to the DirectoryItems class are concerned, this means
    replacing the keyword var with private, so that


    ```

    var $filearray = array();

    ```


    becomes


    ```

    private $filearray = array();

    ```


    As you''ll recall, $filearray is the sole data member of the DirectoryItems class.
    In most cases (except static classes, which we will discuss in Chapter 11), you
    should make all data members private, because by doing so, you are protecting
    the integrity of your data by restricting access to it.


    To better understand access modifiers, it''s useful to think of data members or
    instance variables as though they are in a database. In order to maintain the
    integrity of the data in a database, it''s wise to limit access and restrict the
    ways in which data can be added or changed. A programmer might write well an application
    to achieve this result, requiring users to log in and implementing controls on
    the way in which data are formatted. For instance, you may want data stored in
    a particular format and enforce this through the use of a masked textbox.


    Since access modifiers are nonexistent in PHP 4, changing the value of a variable
    only requires a single assignment. You could modify the $filearray variable in
    the following:


    ```

    $di->filearray[0] = "anyfile.jpg";

    ```


    It''s a disadvantage to do things this way because changes to $filearray are not
    controlled and allowing direct access to data members greatly increases the risk
    of contaminating your data. If you use the keyword private, direct access is no
    longer possible.'
