    # Complex Tasks Made Easy


    I''ve detailed just one of the services you can access using SOAP. Go to www.methods.net
    to get an idea of how many services are available. Services range from the very
    useful—email address verifiers—to the relatively arcane—Icelandic TV listings.
    You''ll be surprised by the number and variety of services that can be implemented
    as easily as a Google search.

    In this chapter you''ve seen how easy it is to create a SOAP client using PHP.
    We quickly got up and running with AJAX, thanks to the prototype.js framework
    and seen that PHP and AJAX can work well together. Reading a news feed was simpler
    still. These are all tasks that rely heavily on XML, but with minimal knowledge
    of this technology was required because PHP does a good job of hiding the messy
    details.


    # Would You Want to Do It Procedurally?


    Knowledge of OOP is a requirement for anything beyond trivial use of the SimpleXML
    and SOAP extensions to PHP. OOP is not only a necessity in order to take full
    advantage of PHP, but it is by far the easiest way to read a feed or use SOAP.
    A procedural approach to either of the tasks presented in this chapter is not
    really feasible. Any attempt would unquestionably be much more difficult and require
    many, many lines of code. Using built-in objects hides the complexity of implementing
    web services and makes their implementation much easier for the developer.'
