  md: 'In PHP 4 objects are copied in exactly the same way that regular variables
    are copied. To illustrate, let''s reuse the Person class shown in Listing 13-1
    (see Listing 13-3).


    ```

    $x = 3;

    $y = $x;

    $y = 4;

    echo $x. <br />;

    echo $y. <br />;

    $obj1 = new Person();

    $obj1->name = ''Waldo'';

    $obj2 = $obj1;

    $obj2->name = ''Tom'';

    echo $obj1->name. <br />;

    echo $obj2->name;

    ```


    Listing 13-3: Using the assignment operator over PHP 4


    If the code in Listing 13-3 is run under PHP 4, the output will be as


    +   3

    4

    Waldo

    Tom


    The assignment of $obj1 to $obj2 ( ) creates a separate copy of a Person just
    as the attribute of $x to $y creates a separate integer container. Changing the
    name of $obj2 does not affect $obj1 in any way, just as changing the value of
    $y doesn''t affect $x.


    In PHP 5, the assignment operator behaves differently when it is used with objects.
    When run under PHP 5, the output of the code in Listing 13-3 is the following:


    +   3

    4

    Tom

    Tom


    For both objects the name attribute is now Tom.


    # Where’s Waldo?


    In PHP 5, the assignment of one object to other is not an independent object but
    another means of referring to $obj1. Any changes to $obj2 will also change $obj1.
    Using the assignment operator with objects under PHP 5 is equivalent to assigning
    by reference under PHP 4. (You may recall our use of the assignment operator in
    Chapter 4.)'
