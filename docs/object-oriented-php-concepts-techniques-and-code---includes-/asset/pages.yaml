  md: "In other words, PHP 5\n\n```\n //PHP 5\n$obj2 = $obj1;\n```\n\nachieves the\
    \ same result as\n\n```\n //PHP 4\n$obj2 &= $obj1;\n```\n\nThe same logic applies\
    \ when an object is passed to a function. This is not surprising, because there\
    \ is an implicit assignment when passing a variable to a function. Under PHP 4,\
    \ when objects are passed to functions, the default is to pass them by value,\
    \ creating a copy in exactly the same way as with any primitive variable. This\
    \ behavior changed in PHP 5 because of the inefficiencies associated with passing\
    \ by value. Pass by value can use up memory, in most cases, all that's wanted\
    \ is a reference? To summarize, when one object is assigned to another, it is\
    \ assigned by reference. However, there are some situations where you do want\
    \ to create a copy of an object and not just reference the same object. Hence\
    \ the need to introduce the clone operator.\n\n> If you are porting PHP 4 code\
    \ to a server running PHP 5, you can remove all those ung own ampersands associated\
    \ with passing an object by reference or assigning it by reference.\n\n# clone\n\
    \nTo understand the clone operator, let's use the Person class again, adding a\
    \ few more lines of code to Listing 13-3 to create the code in Listing 13-4.\n\
    \n```\n if ($obj1 === $obj2) {\n    echo $obj2 equals $obj1.<br />';\n}\\ else\
    \ {\n    echo $obj3 does not equal $obj1.<br />';\n}\n$obj3->name = 'Waldo';\n\
    echo 'Here\\'s ' . $obj1->name. '.br />';\necho 'Here\\'s ' . $obj3->name. '.br\
    \ />';\n$obj2 equals $obj1\nAfter cloning $obj3 does not equal $obj1.\nHere's\
    \ Tom.\nHere's Waldo.\n```\n\nListing 13-4: Finding Waldo"
