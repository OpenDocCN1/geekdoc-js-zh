  md: 'You follow the try block with two catch blocks: one to catch the SQLException
    class and the other to catch the parent class, Exception. Any code that throws
    an exception will be caught by one of the catch blocks.


    A thrown exception looks for the first matching exception type in the block. When
    it finds a match, it executes the code within that block. It ignores all catch
    blocks (unless it is re-thrown). For example, if a SQLException is thrown in the
    try block of Listing 10-5, it will be caught by the first catch, and the code
    in the second catch won''t execute.


    The order of the catch blocks is the inverse order of inheritance: Should the
    catch block for a parent class precede the child class, the exception will always
    be caught by the parent, and the child class will be unreachable.


    When using procedural error handling, you must check for errors immediately following
    the code that may cause problems. As you can see in Listing 10-5, an Exception
    may be caught many lines away from where the problem occurs, which is an advantage
    because it makes for more readable and maintainable code.


    # DEALING WITH EXCEPTIONS


    Your catch blocks in Listing 10-5 simply output the error number and message and
    the application; there''s no need to recover from these exceptions or take any
    other action. For example, suppose you create an application that allows users
    to create their own SQL statements to query a database. When an error occur it
    would make sense to display the error message and reload the web page rather than
    simply exit the application. There are notable differences between error handling
    in PHP and other languages. For instance, PHP doesn''t require exceptions to be
    caught and does not support a finally block.


    # Implementing an Interface


    Inheriting from an existing class is a very powerful tool in the OOP programmer''s
    arsenal. However, it''s not always the appropriate one to use, because PHP doesn''t
    allow a class to have more than one parent class.


    This generally seems to be a good thing; it avoids the complexity that can be
    introduced with multiple inheritance. However, suppose you had created a more
    abstract database result set and defined your MySQLResultset from it. With single
    inheritance it would be impossible for your class to also inherit from any other
    class.


    For this reason PHP allows multiple inheritance, but for interfaces. As you saw
    in Chapter 2, an interface is a class with no data members that declares but does
    not define methods (something that is left to the derived class). An interface
    acts like a skeleton, and the implementing class provides the body. Although a
    class can have only one parent class, it can implement any number of interfaces.'
