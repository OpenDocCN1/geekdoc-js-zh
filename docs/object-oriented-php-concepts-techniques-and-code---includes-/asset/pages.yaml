  md: "```\npublic function valid() {\n    return $this->valid;\n}\n```\n\nThe current\
    \ method returns the value of the current record if there is; key returns its\
    \ array subscript; and valid true unless the record pointer is positioned at the\
    \ end of the result set. The more interesting methods, however, are next and rewind.\
    \ First, let's look at the next method:\n\n```\npublic function next() {\n   \
    \ if($this->currentrow = @mysql_fetch_array($this->result)) {\n        $this->valid\
    \ = true;\n        $this->key++;\n    } else {\n        $this->valid = false;\n\
    \    }\n}\n```\n\nIn this code, you see that next attempts to retrieve the next\
    \ row from the result set, and sets the data members valid and key accordingly.\n\
    As you would expect, rewind resets the pointer to the beginning of the result\
    \ set after first checking that the number of rows is greater than 0. This method\
    \ must also maintain the valid and key members. The data member valid indicates\
    \ whether there is a current row, and key is reset to 0.\nHere's the method:\n\
    \n```\npublic function rewind() {\n    if(@mysql_num_rows($this->result) > 0)\
    \ {\n        if(@mysql_data_seek($this->result, 0)) {\n            $this->valid\
    \ = true;\n            $this->key = 0;\n            $this->currentrow = mysql_fetch_array($this->result);\n\
    \        }\n    } else {\n        $this->valid = false;\n    }\n}\n```\n\nThis\
    \ method works because your result set is buffered; it was created using the function\
    \ mysql_query. Because a buffered result stores all rows in memory, the record\
    \ pointer can be repositioned.\n\nAn unbuffered result uses a forward-only cursor,\
    \ so it cannot use the mysql_data_seek function. Unbuffered result sets are discussed\
    \ in both Chapter 15 and Chapter 16.\n\nNOTE\n\n# What to Do with Flightless Birds\n\
    \nFlightless birds such as the emu and the ostrich are undoubtedly birds, but\
    \ they lack one defining characteristic of birds—flight. Like flightless birds,\
    \ unbuffered result sets lock one characteristic of an iterator. Unbuffered result\
    \ sets are unquestionably iterable, and they cannot be rewound."
