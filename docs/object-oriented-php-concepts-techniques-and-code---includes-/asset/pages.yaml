  md: '# 7


    # BUILDING THE\NPAGENAVIGATOR CLASS


    ![](img/c8663459ed204f27b8d015c8a3d2acad_66_0.png)


    When there are a large number of images in a directory, it''s not desirable to
    display all of them on one web page because doing so will probably create a very
    large and long page. Web pages should be of reasonable length and should not take
    too long to download. Rather than dumping all images onto one page, use a page
    navigator to step through them in an orderly fashion. This chapter will take on
    the task of creating a page navigator class; Chapter 8 will use this class in
    conjunction with the Directory class.


    Before you can create a page navigator, you need to determine how it should behave.
    Keep its design flexible and make sure that its appearance is easily configurable
    so that it can blend with the style of any particular page.


    # How Will the Navigator Behave?


    A good starting point is to look at the navigator at the bottom of a Google query
    page. When searching Google, the default settings show 10 results per page and
    the navigator appears across the bottom of the page. One navigates by clicking
    the Previous or Next links, by choosing a page number, or by'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'clicking one of the many "o"s in Google. If your query returns a large number
    of pages, not all pages are shown in the page navigator. Records are ordered by
    relevance to the search criteria. Given this ordering scheme, there is little
    incentive to move to the last page of results, and in fact, there is no easy way
    of doing so.


    # Different Kinds of Searches


    In many cases, searches return a relatively small number of items, and records
    are often ordered alphabetically. In situations such as this there should be an
    easy way to move to the beginning and the end pages, in addition to being able
    to move to Previous and Next. Too, with Google, the ability to configure the number
    of items shown per page is also desirable.


    You should also limit the number of pages or links shown at any time by your page
    navigator and make this option configurable to accommodate different needs and
    situations. For example, if you have 2,000 items to display and you are showing
    10 items per page, it''s probably not advisable to show all 200 links from the
    bottom of one page. But at the same time, you should show the total number of
    pages and identify the current page so that the user is not left in the dark.


    Finally, the display style of navigation buttons could be configurable so that
    they match the design of an existing page. The best way to do this is to assign
    them a class name and manipulate their style using Cascading Style Sheets (CSS).


    # What Will It Look Like?


    In sum, you will design a page navigator that will look something like Figure
    7-1.


    | < Prev | 1 | 2 | 3 | 4 | 5 | 6 | 7 | Next | > |

    | page 4 of 12 |


    Figure 7-1: Your page navigator


    In this particular example, the maximum number of pages shown by your navigator
    is 7. The total number of pages is 12, and the link to the current page, 4, is
    disabled (indicated above by an italicized number). Each button and page functions
    as a hyperlink (except for the current page). The button labeled le displays the
    first page, and the button displays the last page. In this particular example,
    the Next button displays 5, and the Prev button displays 3.


    Now look at Figure 7-align, and note that pages 8 through 12 are not displayed.
    You can go directly to page 12 by clicking the > button, but there is no easy
    way to go directly to pages 11. But what point points to these pages become visible?


    Apply this to the Google navigator, and you''ll see that the answer is not very
    straightforward. Among other things, it depends on the direction you want to move
    and the number of items your search returns.'
