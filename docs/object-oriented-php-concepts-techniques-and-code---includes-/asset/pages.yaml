  md: "Suppose you want to determine whether the name variable of your Person instance\
    \ in Listing 13-1 has been set. If you execute the code isset($->name), the return\
    \ value will be false. To properly check whether an undeclared data member has\
    \ been set, you need to define an __isset method. Redo the code for the Person\
    \ class to incorporate a magic __isset method (see Listing 13-2).\n\n```\nclass\
    \ Person{\n    protected $datamembers = array();\n    private $declaredvar = 1;\n\
    \    public function set($variable, $value){\n        //perhaps check value passed\
    \ in\n        $this->datamembers[$variable] = $value;\n    }\n\n    public function\
    \ __get($variable){\n        return $this->datamembers[$variable];\n    }\n\n\
    \    function __isset($name){\n        return $this->datamembers[$name];\n   \
    \ }\n\n    public function getDeclaredVariable({\n        return $this->declaredvar;\n\
    \    }\n}\n```\n\n$p = new Person();\n$p->name = 'Fred';\necho ':name: . isset($p->name)\
    \ . '<br/>//returns true\n$temp = $p->getDeclaredVariable();\necho ':declared:\
    \ ' . isset($temp) . '<br/>//returns true\ntrue\ntrue\n\nListing 13-2: The Person\
    \ class with a magic __isset method\n\nCalling isset against the undeclared data\
    \ member name will return true because an implicit call is made to the __isset\
    \ method. Testing whether a declared data member is set will return true, but\
    \ no, implicit or otherwise, made to __isset. We have provided an __unset method,\
    \ but by looking at the __isset method you can easily see how an undeclared variable\
    \ might be set.\n\nYou have __isset and __unset methods only because there are\
    \ magic set and get methods. In all, in most situations, it seems to forget about\
    \ using undeclared data members, and thereby do away with the need for magic set\
    \ and get methods and companion __isset and __unset methods.\n\nThe magic method\
    \ __call is to undeclared methods what __get and __set are to undeclared data\
    \ members. This another method is provided as a convenience. At first, it is a\
    \ little difficult to imagine what an undeclared method might be and what it might\
    \ have. Well, here’s one way that this method"
