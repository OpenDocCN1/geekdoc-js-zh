  md: 'The application we developed in Chapter 15 uses version 2 of SQLite. This opportunity
    to upgrade to SQLite version 3, since PHP 5.1 supports this. It''sably than version
    2 and handles concurrency better. However, the database format has changed; versions
    2 and 3 are incompatible. If you want to get off to a quick start, install the
    database by running the db_install_script.php file in the db directory. This will
    create an SQLite version 3 database for you. Otherwise, you may download the command-line
    version of SQLite 3 from the SQLite website, and see the section "Getting Started"
    on page 141 for details about using a database dump to install a database. The
    PDO driver for SQLite 2 doesn''t support the recreate method, so upgrading is
    required if you want to use this method. Matching the version of the command-line
    tool with the version of SQLite supported by PHP is equally important in this
    chapter, because of version incompatibilities. For example, a database created
    at the command line using SQLite version 3.5.5 will not work properly with the
    current SQLite PDO driver.


    # Constructing a PDO Object


    When constructing a PDO database or connection object, a Data Source Name (DSN)
    is passed as a parameter. A DSN is made up of a driver name, followed by a colon,
    followed by database-specific syntax. Here''s how to create a connection to an
    SQLite database:


    ```

    $pdo = new PDO(''sqlite:resources.sqlite'');

    ```


    A PDO object is constructed in the way as an SQLiteDatabase object except that
    the driver name must precede the path to the database and separated from it by
    a colon.


    # The createFunction Method


    You may recall that one of the deficiencies of SQLite was the lack of built-in
    functions, especially with respect to date manipulation. We were able to overcome
    this deficiency by adding functions to SQLite using the createFunction method.
    Fortunately for us, the developers of PDO have seen fit to incorporate this capability
    by including the SQLite-specific method sqliteCreateFunction. This saves us some
    work also reduces the “abstractness” of the PDO layer—but more about this later.


    # Exceptions


    In Chapter 15 we extended the SQLiteDatabase class in order to throw an exception
    if a query failed. For reason we overrode the existing query methods. The same
    effect can be achieved with PDO by using only one line of code:


    ```

    $pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);

    ```


    Calling setAttribute against a PDO database connection causes any failed attempt
    at querying the database to throw a PDOException. This is a very succinct way
    of dealing with one of the shortcomings of'
