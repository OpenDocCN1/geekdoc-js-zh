  md: "The addPlayer method of the Team class could be rewritten:\n\n```\npublic function\
    \ addPlayer(Player $p) {\n    $newplayer = clone $p;\n    $this->players[] = $newplayer;\n\
    }\n```\n\nThe Team class now has complete control over any player added. This\
    \ will doubtless be the implementation preferred by any Team manager.\n\n> The\
    \ fact that PHP 5 returns a reference to an object rather than a copy may have\
    \ serious implications for aggregate objects under PHP 4 and running under PHP\
    \ 5. Objects formerly returned by value will now be returned by reference, breaking\
    \ encapsulation.\n\n# No Clones Allowed\n\nAs we discussed the singleton class\
    \ in Chapter 11, in some cases it may make sense to disallow clones altogether.\
    \ This can be done by implementing code as follows:\n\n```\npublic function __clone()\
    \ {\n    throw new Exception('No clones allowed!');\n}\n```\n\nMaking this method\
    \ final ensures that this behavior can't be overridden in derived classes, and\
    \ making it public displays a clear error message when there is an attempt at\
    \ cloning. Making the _clone method would also disallow cloning but displays a\
    \ less explicit message: Access level must be public.\n\n# A Note About Overloading\n\
    \nOn the PHP website the _set, _get, and _call methods are referred to as overloaded\
    \ methods. In the context of OOP, an overloaded method is one that has the same\
    \ name as another method of the same class but differs in the number or type of\
    \ arguments—methods with the same name but different \"signature\". Because PHP\
    \ is a typeless language and doesn't really care how many arguments are passed,\
    \ this kind of overloading is an impossibility. In PHP, overloading refers to\
    \ methods that perform a variety of different tasks.\n\nLanguages such as C++\
    \ also support something called operator over. For example, a programmer can define\
    \ what the \"greater than\" operator means when two objects of the same class\
    \ are compared. Support for such features has been described as \"syntactic sugar\"\
    \ because, most of the time, operator overlaps are not strictly necessary—the\
    \ same effect be"
