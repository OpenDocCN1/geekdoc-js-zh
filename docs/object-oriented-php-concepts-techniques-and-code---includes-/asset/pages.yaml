  md: "# # What Format Do You Want?\n\nOne of the major reasons for documenting classes\
    \ is to make them easier for a client programmer to use. Because the client programmer\
    \ is primarily interested in the public methods of class (he wants to know how\
    \ to use the class, not how it works), you should sort methods and data members\
    \ by visibility, giving priority to those with visibility.\n\nIf you have ever\
    \ used a plain text editor to write code you know that syntax highlighting greatly\
    \ improves readability. For this reason, the ability to change the appearance\
    \ of keywords is also a desirable characteristic to incorporate into your class.\n\
    \nYou've been acquainted with the capabilities of reflection classes, and now\
    \ have a fair idea of what kind of off-the-shelf functionality is available as\
    \ well as what you will have to customize. You're in a good position to begin\
    \ extending `ReflectionClass`.\n\n# # The Documenter Class\n\nWe won't be looking\
    \ at each and every line of code in this class, but to help put the following\
    \ comments in context you might want to download the code now. The export method\
    \ of Reflection gives us a rough idea of the kind of information we like to see\
    \ (refer to Listing 14-1). Now let's discuss the Documenter class in terms of\
    \ how class information will be displayed.\n\n# # Describing the Documenter Class\n\
    \nAt the very minimum you need basic information about a class. The `getFullDescription`\
    \ method combines existing `ReflectionClass` methods to create a string that matches\
    \ the actual class declaration.\n\n```\npublic function getFullDescription() {\n\
    \    $description = \"\";\n    if ($this->isFinal()) {\n        $description =\
    \ \"final\";\n    }\n    if ($this->isAbstract()) {\n        $description = \"\
    abstract\";\n    }\n    if ($this->isInterface()) {\n        $description .= \"\
    interface\";\n    } else {\n        $description .= \"class\";\n    }\n    $description\
    \ .= $this->name . \" \"\";\n    if ($this->getParentClass()) {\n        $name\
    \ = $this->getParentClass()->getName();\n        $description .= \"extends $name\"\
    ;\n    }\n}\n```"
