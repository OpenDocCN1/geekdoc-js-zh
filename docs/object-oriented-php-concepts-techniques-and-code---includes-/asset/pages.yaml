  md: '# 12


    # KEEPING IT FRESH


    ![](img/c8663459ed204f27b8d015c8a3d2acad_118_0.png)


    There’s nothing quite like the excitement of discovering a new and interesting
    website. But this enthusiasm can quickly wane, after a few visits, the content
    of the site hasn’t changed at all. The primary way of adding new content to a
    website is by using dynamic, database-driven pages.

    That’s why we’ve spent so much time discussing MySQL (and will later spend some
    time on SQLite). Another ideal way of keeping a site current and interesting is
    by using Rich Site Summary (RSS) feeds. RSS is a file format for web syndication
    that is widely used by various newsgroups but more commonly encountered in form
    of a blog. An RSS file is using an Extensible Markup Language (XML) formatted
    file that can be read using the SimpleXML extension to PHP 5. All you need to
    read an RSS feed is a little knowledge of how an RSS file is structured and an
    understanding of object-oriented programming (OOP). You’ll be surprised at just
    how easy it is once you''ve grasped a few basics of XML.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'The downside of having a large website with numerous pages is that it can be
    difficult for casual web surfers to find what they''re looking for. The reason
    I will show you how to create a site-specific search. I''ll do this using the
    Google Application Programming Interface (API) and the Simple Object Access Protocol
    (SOAP) extension to PHP. The Google API will allow us to tap into Google''s search
    capabilities programmatically using the SOAP web service. This protocol uses XML
    files over HTTP, so familiarity with XML is required. If you don''t know anything
    about XML, don''t worry. You''ll learn enough to get you started, and besides,
    you already know HTML so you''re well on your understanding XML.


    In this chapter you''ll also have the opportunity to see how asynchronous JavaScript
    and XML (AJAX) can work in PHP. We''ll use AJAX to enhance the Google search results,
    without having to refresh the page. In situations where a page reload is overkill,
    AJAX can greatly simplify the user interface to a website (though, of course,
    improper use can do the exact opposite).


    The object-oriented (OO) programmer is placed to program using SimpleXML and SOAP
    because, as you''ll see, both extensions are entirely object-oriented. Like it
    or not, knowledge of OOP is a requirement for taking full advantage of these and
    many others PHP.


    # SimpleXML


    In PHP 5 all XML support is now provided by libxml2 toolkit. By default PHP 5
    supports SimpleXML, but if libxml2 is not installed on your machine or the version
    number is lower than 2.5.10, go to www.microsoft.com and download the latest version.
    (You can use the PHP function phpinfo to check which version of libxml is running
    on your server.). Without going into many details, suffice to say that XML has
    been brought into line with the standards defined by the World Wide Web Consortium
    (W3C). Unified treatment of XML under libxml2 makes for a more efficient and easily
    maintained implementation of XML support.


    Support for XML is much improved in PHP 5, in terms of both performance and functionality.
    The SimpleXML extension makes full use of libxml2 toolkit to provide easy access
    to XML, and as a quick way of converting XML documents to PHP data types.


    # XML


    Since an RSS document is an XML document, you need some understanding of the basics
    of XML if you want to be able to read a feed. XML is a markup language that is
    similar in many ways to HTML—this should come as no surprise that both HTML and
    XML have a common heritage in Standard Generalized Markup Language (SGML). As
    a web developer, even if you have never seen an XML file before, it will look
    familiar, especially if you are coding to the XHTML standard. XML makes use of
    tags or elements enclosed by angle brackets. Just as in HTML, a closing tag is
    differentiated from an opening tag by preceding the element name with a forward
    slash. Also like'
