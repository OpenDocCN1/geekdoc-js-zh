  md: "At this point you may be thinking, “That’s all well and good, but why would\
    \ I want a class that I can only create one instance of?” Creating a database\
    \ connection is an expensive operation so restricting creation of connections\
    \ conserves resources.\n\nBy restricting the connection class to a single instance,\
    \ we are mimicking the built-in mysql_connect function. Its default behavior is\
    \ to reuse a connection resource rather than create a new one.\n\nHowever, there\
    \ are some circumstances where a new connection is a necessity.\n\n# Making Other\
    \ Connections\n\nTwo different connection objects are required if a single script\
    \ needs to connect to two different servers. The close method makes it possible\
    \ to connect to a different server.\n\n```\npublic function close() {\nMySQLConnect::$instances\
    \ = 0;\nif(isset($this->connection)) {\n    mysql_close($this->connection);\n\
    \    unset($this->connection);\n}\n```\n\nTwo instances of the MySQLConnect class\
    \ can exist, but not simultaneously. If you want to create a connection to another\
    \ server, you must first close the existing connection. The close method closes\
    \ the current connection and resets the static variable $instances to 0. Manipulating\
    \ the $instances variable in this way allows you to create a new connection, but\
    \ only after the current is closed.\n\nExplicitly closing a connection and unsetting\
    \ it for clearer error messages should you accidentally create a result set method\
    \ after closing its connection. The requirement to close the current connection\
    \ also serves as a reminder that a result set is a dependent object.\n\nTo make\
    \ this even clearer, let’s look at how a result set is created.\n\n# You Can Only\
    \ Get From Here\n\nThe following method serves as a very strong reminder that\
    \ you first need a connection in order to create a result set\n\n```\npublic function\
    \ createResultSet($strSQL, $databasename) {\n$rs = new ResultSet($strSQL, $databasename,\
    \ $this->connection);\nreturn $rs;\n}\n```\n\nThe creation of a MySQLResultSet\
    \ requires a reference to the connection data member of the MySQLConnect class.\
    \ This data member is private and does not have an accessor method, so it’s only\
    \ available from within the MySQLConnect"
