  trans: "\n\n在下面的示例中，我构思了一个场景：我想向东边走 8 步。代码看起来如下所示：\n\n```javascript\nfor ( step\
    \ = 0 ; step < 8 ; step++){‘walk east one step’}\n```\n\n上面的代码是一个简单的程序，它从 `step`\
    \ 0 开始运行，在每走一步后，它都会给 `step` 变量增加一个值，使其增加 `+1`。循环会一直运行，直到 `step` 变量的值达到 7，此时程序停止。\n\
    \n使用循环是有趣的，而且你应该很高兴地知道，这并不是你所可以使用的唯一循环类型。事实上，根据任务的不同，你可以使用多种不同的循环语句。\n\n所有的循环都分为两类：前置条件（pre-condition）和后置条件（post-condition）。在前置条件循环中，在处理循环内部的代码之前会先进行条件的检查。这意味着如果条件不满足，循环可能完全不会运行。在后置条件循环中，条件会在循环运行后才进行检查。这意味着循环至少会运行一次。在考虑你想使用哪种循环时，记住这一区别非常重要。\n\
    \n现在让我们来看 JS 中不同类型的循环。\n\n## 1. For 循环\n\n`For` 循环是前置条件循环的主要示例。该循环非常简单，会不断重复，直到指定的条件成立，换句话说，直到指定的条件被判定为假。\n\
    \n`For` 循环的结构如下：\n\n```javascript\nfor( [initialExpression] ; [condition] ; [incrementExpression])\n\
    {\n    Statement\n}\n```\n\n例如，假设我们想打印五次字符串 `Hello World!`。我们可以通过重复五次命令 `console.log(\"\
    Hello World!\");` 来实现，也可以创建一个如下 `for` 循环：\n\n```javascript\nfor (vari = 0; i<\
    \ 5; i++) {\n    console.log(\"Hello World!\");\n}\n```\n\n每当 `For` 循环的条件满足时，内部会发生以下过程：\n\
    \n- 如果满足条件，则将执行初始化表达式（如果有）。在上面的示例中，初始化表达式将变量 `i`（作为计数器）设置为 0。\n- 之后，将评估给定的条件。如果发现条件为真，则循环将继续执行，直到达到给定条件看起来为假的状态，在这种情况下循环将停止。但是，如果条件表达式被完全移除，则循环将无限执行下去。条件是\
    \ `i` 应该小于 `5`。\n- 一旦循环执行完毕，它将会在内部查找需要运行的语句。如果你想在循环中有多个语句，可以使用块语句 `{…}` 将这些语句特别地分组成。\n\
    - 一旦语句运行完成，循环将查看 `incrementExpression`，在其中它将更新 `Initial Expression` 并不断地重复该循环。在第一次循环中，`i\
    \ = 0`。在第二次循环中，`i = 1`。因此，你可以看到需要五次循环条件 `i < 5` 返回布尔值假（0, 1, 2, 3, 4）。在第六次循环中，`i`\
    \ 将等于 5，导致条件为假。需要注意的是，你也可以对条件使用任何比较运算符。通过这种方式，`for(vari = 0; i< 5; i++)` 和 `for\
    \ (vari = 0; i<=4; i++)` 运行循环次数将相同。\n\n使用 `For 循环` 的正确方法是：\n\n```javascript\n\
    for (statement a; statement b; statement c) {\n    code block to be executed\n\
    }\n```\n\n`statement a` 在代码块开始之前执行。`statement b` 是运行循环的条件，`statement c` 在每次代码块执行后后执行。（JavaScript\
    \ For Loop，来自 W3school.com）\n\n需要记住的一点是，你不一定需要使用增运算符来更改条件变量。你也可以使用递减运算符，这允许你执行倒计时。考虑以下代码：\n\
    \n```javascript\nfor(vari = 30; i>= 0; i--)\n{\n    await sleep(1000);\n    console.log(i);\n\
    }\n```\n\n这段代码将从 30 倒计时到 0，每秒打印一个数字。你也可以在没有 `console.log` 命令的程序中使用此代码设置内部计时器，使其成为延迟另一个函数的方便方法。\n\
    \n你还可以使用 `for` 循环遍历 `Array` 来寻找某个值。假设你有一个 `Array`。你创建一个 `for` 循环来遍历 `Array` 并寻找某个值。\n\
    \n```javascript\nfor (i = 0; i<a.length; i++) {\n    if(a[i] == theValue) {\n\
    \        console.log(\"true\");\n    }\n}\n```\n\n## 2. Do/While 循环\n\n`Do/While`\
    \ 循环是后置条件循环。循环会不断重复，直到条件为假。\n\n```javascript\ndo {\n    code block\n}\nwhile (condition)\n\
    ```\n\n示例：\n\n```javascript\ndo {\n    i += 1;\n    console.log(i);\n} while (i\
    \ < 5);\n```\n\n## 3. While 语句\n\n与 `do while` 循环不同，`while` 语句只有满足条件时才会执行。这使其成为前置条件循环。\n\
    \n```javascript\nwhile (condition) {\n    code block\n}\n```\n\n示例：\n\n```javascript\n\
    n = 0;\nx = 0;\nwhile (n < 3) {\n    n++;\n    x += n;\n}\n```\n\n## 4. Label\
    \ 语句\n\n`label statement` 可以描述为特定循环的看板。一旦你使用标签语句命名了循环，你就可以在程序中使用名称引用它，之后你可以使用\
    \ `break` 或 `continue` 语句来运行或中断执行。\n\n其结构为：\n\n```javascript\nLabel :\n    Statement\n\
    ```\n\n或者\n\n```javascript\nmarkLoop:\nwhile (theMark == true) {\n    doSomething();\n\
    }\n```\n\n## 5. Break 语句\n\n`break statement` 用于终止循环的执行。它可以单独使用，也可以与标签循环配合使用。当它与标签语句配合使用时，它会终止指定标签的操作。另一方面，当它单独使用时，它会立即终止最近的\
    \ `while`、`do/while`、`for` 或 `switch` 语句。\n\n其结构为：\n\n```javascript\nbreak;\n\
    break label;\n```\n\n示例：\n\n```javascript\nfor( i = 0; i<a.length ; i++ ) {\n\
    \    if(a[i] == theValue) {\n        break;\n    }\n}\n```\n"
- fmt: "\n```javascript\nBreak;\n}\n```\n\n### 6. Continue Statement\n\nThis statement\
    \ can be described as the opposite sibling of the `break` statement. It has all\
    \ the features of the `Break` statement. And this statement can also be used in\
    \ conjunction with a label statement or on its own. The only difference is: instead\
    \ of terminating the execution, this statement will actually continue the process\
    \ of execution. When using with label, it will continue the labeled statement.\
    \ When used on its own, it will continue the nearest enclosing statement before\
    \ going to the execution of the immediate next statement.\n\nHere is the syntax:\n\
    \n```javascript\ncontinue;\n\ncontinue label;\n```\n\nor\n\n```javascript\ni =\
    \ 0;\nn = 0;\nwhile (i < 5)\n{\n  i++;\n  if (i == 3)\n  {\n    continue;\n  }\n\
    \  n += i;\n}\n```\n\nThe above example is for a code that has a `while` loop\
    \ with a `continue` statement. The code here only executes when the value of `i`\
    \ is 3.\n\n### 7. For….in statement\n\nThis statement iterates a specific variable\
    \ over all the enumerable properties of an object. This type of loop allows you\
    \ to access the keys of the object, but it doesn’t provide a reference to them.\
    \ This distinction is important, because it means that you can do an action when\
    \ a value is present, but it does not allow you to manipulate that value.\n\n\
    The syntax is:\n\n```javascript\nfor (variable in object)\n{\n  Statement\n}\n\
    ```\n\n### 8. For…of statement\n\nThis loop can be used if you want to browse\
    \ through the indexes of other objects such as `Array`, `Map`, `Set`, `Arguments`\
    \ amongst others. This statement will allow you to invoke a custom iteration hook\
    \ with statements that will be individual for each of the distinctive properties\
    \ of the objects. `for...of` was created because when `for...in` was used with\
    \ `Arrays`, you could get additional properties returned that you weren’t expecting.\
    \ This made `for...in` unsafe to use with `Arrays` because when you iterated through\
    \ them, you could get values returned that would throw errors.\n\nThe basic syntax\
    \ is:\n\n```javascript\nfor (variable of object)\n{\n  statement\n}\n```\n\n####\
    \ Some Common Mistakes to Avoid\n\n- While setting up the conditions for a loop,\
    \ keep in mind the proper use of the operators (`<`) (`>`) and (`==`). A simple\
    \ misuse of any of these operators can ruin the whole program.\n- When using the\
    \ ‘label’ statement, make sure to use names that are are easy to remember so that\
    \ you will be able to access them comfortably in the future.\n- Have a good look\
    \ at the situations where you are using the `break` and `continue` statements.\
    \ Be aware that these two statements will only affect the code inside that particular\
    \ parenthesis.\n\n#### Practice\n\n- Write a simple program that uses the `For`\
    \ Loop.\n- Describe the working regime of an `For` Loop.\n- Write a simple program\
    \ which uses the `break` and `continue` statements.\n- Write a simple program\
    \ using the `label` statement and call the labeled statement at a later part in\
    \ your program.\n\n# Chapter Four\n\n# The Basics of JavaScript Function and Scope\n\
    \nLet’s see now, normally when we are talking about a ‘function’ what’s the first\
    \ thing that comes to your mind? Obviously an activity right?\n\nThe functions\
    \ in JavaScript also work in a similar manner. Functions are blocks of codes which\
    \ are required to be executed over and over again by the program. A Function is\
    \ used to perform a particular task. A Function can contain any number of arguments\
    \ and statements; they can even have none. Depending on how the structure is coded,\
