    6.  Continue Statement


    This statement can be describedas the opposite sibling of the break statement.
    It has all the features of the Break statement. And this statement can also be
    used in conjunction with a label statement or on its own. The only difference
    is: instead of terminating the execution, this statement will actually continue
    the process of execution. When using with label, it will continue the labeled
    statement. When used on its own, it will continue the nearest enclosing statement
    before going to the execution of the immediate next statement.


    Here is the syntax:


    continue;


    continue label;


    or


    i = 0;


    n =0;


    while (i< 5)


    {


    i++;


    if ( i == 3)


    {


    continue;             


    }


    n +=I;


    }


    The above example is for a code that has a while loop with a continue statement.
    The code here only executes when the value of i is 3.


    7.  For….in statement


    This statement iterates a specific variable over all the enumerable properties
    of an object. This type of loop allows you to access the keys of the object, but
    it doesn’t provide a reference to them. This distinction is important, because
    it means that you can do an action when a value is present, but it does not allow
    you to manipulate that value.


    The syntax is :


    for ( variable in object)


    {


    Statement


    }


    8.  For…of statement


    This loop can be used if you want to browse through the indexes of other objects
    such as Array, Map, Set, Arguments amongst others. This statement will allow you
    to invoke a custom iteration hook with statements that will be individual for
    each of the distinctive properties of the objects. For...of was created because
    when for...in was used with Arrays, you could get additional properties returned
    that you weren’t expecting. This made for...in unsafe to use with Arrays because
    when you iterated through them, you could get values returned that would throw
    errors.


    The basic syntax is:


    for ( variable of object)


    {


    statement


    }


    Some Common Mistakes to Avoid


     While setting up the conditions for a loop, keep in mind the proper use of the
    operators (<) (>) and (==). A simple misuse of any of these operators can ruin
    the whole program.


     When using the ‘label’ statement, make sure to use names that are easy to remember
    so that you will be able to access them comfortably in the future.


     Have a good look at the situations where you are using the break and continue
    statements. Be aware that these two statements will only affect the code inside
    that particular parenthesis.


    Practice


     Write a simple program that uses the For Loop.


     Describe the working regime of an For Loop


     Write a simple program which uses the break and continue statements.


     Write a simple program using the label statement and call the labeled statement
    at a later part in your program.


