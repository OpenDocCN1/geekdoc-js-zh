  raw: 'Concatenationallows you to combine two individual strings together and turn
    them into one string using + operator or += assignment operator.


    Ex-


    var Spray = “Hello” ;


    var Body = “World” ;


    console.log(Spray + “ “ + Body);


    This will give an output of “Hello World”


    Ex2-


    var a=”I am ”


    var b +=”Legend”


    The result will be: I am Legend


    Also, you can add a string and a number together:


    X=”3”+1      (Result will be 31, not 4)


    X=”Jessica”+1   (Result will be Jessica1)


    The result will be a String.


    Unlike other programming languages, the behavior of the operators that deal with
    Strings and those that deal with numbers vary to a great extent. Having a deep
    understanding of the core differences between the two is important in order to
    make sure that both of them are used properly.


    For example, one of the prime differences you will notice while using these two
    types of operators can be found during the usage of the Addition Operator.


    See the following example:


    Consider a scenario where we are trying to add a number and a string.


    Example 1.


    var Bar = 5;


    var Legal = “6”


    console.log (Bar + Legal)


    The output here will be 56\.


    If you want to force the strings to act as simple numbers, you can add a Number
    keyword in front of the string variable.


    Example 2.


    X=1+Number(“6”)


    The result will be 7 in this case.


    Example 3.


    var Bar = 5;


    var Legal = “6”;


    console.log (Bar + Number(Legal))


    The output of this statement is 11.


    These are examples of how JavaScript allows you to do type conversion manually
    from numbers to Strings, Strings to numbers, or Boolean values to numbers or Strings.


    We’ve already shown you how to convert Strings to numbers using the global Number()
    method. A similar method exists to convert numbers to Strings. This uses the global
    String() method. See the following Examples.


    Example 4.


    String (3.14) will convert the number 3.14 to a String.


    String(x + y) converts the expression of x + y into a String.


    You may wonder why you would ever want to convert a number to a String. There
    are times when you will want to preserve the accuracy of a number out to a certain
    number of decimals. Because of how computers deal with numbers by converting them
    to binary and back, you can lose accuracy when working with just the number type.
    In this case, preserving the value as a string ensures that you won’t lose any
    accuracy in your values.


    You can also convert Boolean values into numbers or Strings.


    Number(TRUE) will return a value of 1


    Number(FALSE) will return a value of 0


    String(TRUE) returns a String, “true”


    String(FALSE) returns a String, “false”


    The Logical Operators


    When you face a scenario where you need to code something that will only work
    based on the results from two or more conditions, you will need to utilize the
    logical operators that are built in the JavaScript framework. The logical operators
    are AND(&&),OR(||) operators, and NOT(!) Operators. These work by comparing the
    Boolean value from each comparison. There are only two Boolean values, TRUE and
    FALSE.


    For Example:


    X && Y


    The result of the AND operator is true if both X and Y are true.


    The result of the OR operator is true if either (X or Y) or both are true.


    Example for Not Operator:


    !X


    The result of the NOT operator is true if X is not true.


    To be more detailed, here are some more examples of the AND, OR, NOT operators.


    Ex-


    x = 5


    Y = 0


    (x>3 && y<3) returns true because 5 is greater than 3 AND 0 is less than 3.


    X=3


    Y=2


    (X==3 || y==3) returns true because 3 = 3\. It doesn’t matter that the y portion
    of the comparison is false because OR only cares if one OR the other is true.


    X=1


    Y=5


    !(x==y) returns true because the condition inside the parentheses is false. The
    opposite of false is true.


    The function of the AND operator is to allow a code to run only if both of the
    given conditions is found to be valid.


    On the other hand, An OR operator only allows a code to run if either one of the
    given conditions are found to be valid.


    At last, the NOT operator allows a code to run if the given condition is found
    to be not true.


    From the previous example, you saw the “==” symbol. This is one of the comparison
    operators.


    Comparison operators are used to compare operands. A logical number will be returned
    if the comparison found to be true. Or, an action will be taken if the result
    is true.


    For example-


    if (gender ==“Female”) Text = “Sorry, our content is only for men”;


    In the examples we used for logical operators, we used equal operator (==). It
    means returns true if both operands are equal.


    In the summary of this chapter, we include a list of the different types of comparison
    operators.


    The Conditional Statement


    If you want to assign values to variables under a certain condition, then you
    can use the “if” and “else” blocks to easily manage certain pieces of your code.
    This will decide which will run and which will not, depending on your adjusted
    conditions.


    Another way of doing this is by using the conditional, or ternary, operator. The
    syntax for a conditional statement is:


    variablename = (condition) ? value1:value2


    What this operator does is look at the condition and if the condition is true,
    it assigns value1 to the variable. If the condition is false, it assigns value2
    to the variable.


    Example


    var role = (gender ==male) ? “King”;”Queen”;


    If the gender is male, the value of the variable will be king. Otherwise, the
    value will be “Queen”.


    Another example of how to do the same thing using an if / then statment:


    var x= male;


    var y = female;


    if (y)


    {


    Console.log (‘Queen’);


    }


    if(y)


    {


                                // this code will not run because the previous if
    statement has already evaluated y to be true.


    }


    Or


    {


    if (x)


    {


    Console.log (‘King’);


    }


    You might be wondering now what the point of using so many curly braces is, right?
    Well, always keep in mind that the curly braces are actually implemented into
    the programming language to help you create more readable and accessible codes.
    Also, these curly braces help you determine the scope of your variables as well.
    For single sentences (even if the statements don’t require you to use curly braces),
    it is still a good habit to use them because they help you avoid errors and confusion.
    This will help during your future endeavors in writing longer code with various
    if/else blocks.


    Some Common Mistakes to Avoid


     Keep in mind not to accidentally use the “=” assignment operator for undesired
    results.


     Make sure you are absolutely clear about the AND (&&) and OR (||) Operators.
    At the beginning, it might get a little bit confusing, but these are very essential
    for large scale programming and they will get easier as you practice.


    Practice:


     Write a simple program that will have three individual values in variables,
    and find out their mean.


     Write a simple program which utilizes the || operator in order to execute a
    simple statement.


    Summary


    ![](images/00005.jpeg)


    # Chapter Three


    # An Introduction to Loops


    Loops are for when you have to do a similar task multiple times. Say for example,
    you have to write the names of your guests who are coming to your event. How are
    you going to translate that into JavaScript? Sure, you can go ahead and try to
    set each name into a specific variable, but this will be very time consuming.
    It might work for you when there’re maybe ten or twenty guests, but how about
    when there are a hundred? You don’t want your arm to fall off right? Therefore,
    it is essential to learn the basics of “Loops”.


    Loops in JavaScript simply enable a programmer to do a similar task repeatedly
    with very little effort.


    For example, instead of writing:


    Text += houses[0] + “<br>”


    Text += houses[1] + “<br>”


    Text += houses[2] + “<br>”


    Text += houses[3] + “<br>”


    You can just write:


    for (i = 0; i<houses.length; i++) { 


        text += houses[i] + "<br>";


    }'
