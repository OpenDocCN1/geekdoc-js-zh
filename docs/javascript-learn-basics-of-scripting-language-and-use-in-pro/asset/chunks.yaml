  raw: 'The other thing you can do is to declare the variables inside your scope without
    using the word var. If the same variable was not defined at the beginning of the
    code outside the scope of the piece of code in question, then the variable will
    act similarly to a global one.


    Ex-


    var foo = ‘hello’;


    var talkHello = function() {


    console.log(foo);


    };


    talkHello(); // logs ‘hello’


    console.log(foo); // also logs ‘hello’


    As you can see, the variable foo is declared outside of the function talkHello.
    That means that foo is a global variable and any function will be able to access
    it, so when the function talkHello calls it, it is accessible.


    The following example is contradictory to the first example. This shows that a
    code block that was written outside the scope is not being able to recognize the
    variable.


    var talkHello = function() {


    var doo = ‘hello’;


    console.log(doo);


    };


    talkHello(); // logs ‘hello’


    console.log(doo); // gives an empty log.


    In this example, the variable doo is called inside the function talkHello. This
    creates a private variable that is only accessible to the function, hence when
    the command console.log(doo) attempts to access it, it returns a null value.


    Some Common Mistakes to Avoid


     Always remember that a variable is only accessible by the functions within a
    specific scope, outside of that scope the variable is invalid.


    Practice


     Explain what a scope is and how the variables are affected by it.


     Write a simple program to illustrate the functionalities of a:-


    a) Simple Function


    b) A Function with returnable value


    c) A function passed as a parameter (Argument)


     Explain the concept of a Self-Executing Anonymous Function and give an example.


    # Chapter Five


    # Some prominent Features of JavaScript


    Many new programmers often get a little bit disappointed when they hear people
    call JavaScript a language for kids. Well, let me clear this up for you. First,
    JavaScript is hands down, one of the strongest programming languages out there.
    It’s a popular skill required for web development.


    The beauty of JavaScript lies in its simple yet complex presentation. It has been
    used for many years now by numerous developers. It can add a fresh spin on their
    web pages, ranging from very subtle but important features such as automatic image
    changers, to more intricate designs that enhance their beauty.


    The following are just a few of the features that help JavaScript to stand out
    on its own in the crowd.


    Integrated Browser Support


    Right off the bat, the user friendly nature of JavaScript is very intriguing and
    it attracts many new programmers and experts. Many web development languages out
    there require installing a supplementary flash plugin in order to be allowed to
    access flash content and work on the browser. The users of JavaScript are mostly
    spared from this hassle as almost all the browsers have invariably accepted JavaScript
    as their core scripting language. This allows them to deliver integrated support
    for the language. In the most critical cases, the users will only need to handle
    some particular tasks that rely on DOM with care, but other than that, JavaScript
    is fully accessible and free to be used.


    A Functional and Flexible Programming Language


    For programmers who prefer a lot of functions in their programs, JavaScript isa
    joy. This is because of the versatile manipulation techniques incorporated within
    the language that allows the programmers to determine the execution of a function.
    Two of the more prominent features of Java that put it at the frontend offunctional
    programming is that it givesprogrammers the freedom to assign a function to any
    variable, and make a function accept another function using the arguments parameters.
    Such in-depth ability for customization makes it so much more fun for programmers
    who like to have more freedom in programming.


    The ability to use JavaScript on both Client and Server Side


    ![](images/00007.jpeg)


    Since JavaScript has been officially recognized by the web-browsers as being the
    prime development language for them, JavaScript has been given the administrative
    privileges to have access to the document model objects of any browser. What this
    does is that it gives the programmer another level of freedom. It allows programmers
    to change the structure of the web pages on the fly. Not only that, the language
    can also be used to add various interesting effects to the web pages. And if you
    are working with Alfresco, then you are in luck! Because JavaScript also allows
    web scripts to be created in Alfresco. This allows programmers to add custom tasks
    to any Alfresco server very easily.


    When you combine all of these together, JavaScript is truly a magnificent programming
    languagethat is powerful yet easy to use.


    Self-Conscious ability to detect browser and OS


    ![](images/00008.jpeg)


    Sometimes when you are programming, you might face some issues and need to write
    code that is dependent on the operating system and web browser that you are using.


    JavaScript has been intelligently designed to allow itself to be self-aware of
    the browser and OS which you are using. This allows you to easily adjust the language
    in accordance with your requirements to perform all the OS dependent actions with
    ease.


    The Diverse Support for Object Oriented Programming


    Object oriented programming is perhaps the keystone of programming languages these
    days. Programmers often like to choose their language depending on the accessibility
    to the handling mechanism of these objects. When brought in to comparison, JavaScript
    has a very different and unique structural system that determines how to handle
    the objects. It offers a huge amount of support, while at the same time it remains
    relatively easy to learn and use. This encourages the users to write more complex
    object oriented code smoothly and efficiently with very little complication.


    This is one of the many reasons why JavaScript always remains on the top of the
    list for programmers and also in the industry.


    If you are interested in object oriented programming, then you can’t go wrong
    with JavaScript.


    # Conclusion


    A lot of people believe that the only way to learn proper programming is by going
    back to school or other education centers. But l don’t believe it’s true.Thanks
    to the tremendous advancements in online communication, you can easily learn and
    master any new skill through internet tutorials and videos. The information available
    out there for you to grasp is endless.


    JavaScript is not a program that is only for geniuses and geeks. This is a very
    standardized language and it can easily be picked up by anyone. Just like languages
    in real life, this language will also help you to open unlimited possibilities
    and opportunities.


    Thank you for purchasing this book and giving me your precious time. I hope that
    this book has helped you, and I wish that going through this book, you have obtained
    a basic knowledge of all the elementary prospects of JavaScript programming which
    will help you tokick start your career as a programmer.


    I encourage you to practice JS programming as much as you can. Soon, you will
    become the programmer you want to be as long as you dedicate yourself. Let the
    flame of ambition burn inside you. Remember, if you really want to do this, don’t
    jump over to another programming language before you master this one.


    This is just the beginning of your journey. And I hope you enjoy the process before
    you arrive at your destination.'
