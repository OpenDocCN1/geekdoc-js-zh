    !(x==y) // 返回 true，因为括号内的条件为假。假的对面是真。\n```\n\n### 条件 语句\n\n如果你想在特定条件下赋值值，可以使用\
    \ `if` 和 `else` 块。\n\n另一种方法是使用三元运算符。它的语法是：\n`ilename = (condition) ? value1:value2`\n\
