    the loop is processed. This means that the loop may not run at all if the condition
    is not satisfied. On a post-condition loop, the condition is checked after the
    loop has run. This means that the loop will always run at least once. This distinction
    is important to keep in mind when you think about what kind of loop you want to
    use.


    Let’s now have a look at the different types of loops in JS.


    1.  The For Loop


    TheFor loop is a primary example of a pre-condition loop. The loop is pretty simple
    and will keep on repeating itself until the specified condition has been fulfilled,
    or in other words, the specified condition has been deemed false.


    The skeleton of the For loop is –


    for( [initialExpression] ; [condition] ; [incrementExpression])


    {


    Statement


    }


    For example, say we want to print the String, Hello World! five times. We can
    either do this by repeating the command console.log(“Hello World!”); five times
    or we can create a for loop as follows:


    for (vari = 0; i< 5; i++) {


                  console.log(“Hello World!”);


    }


    Whenever the conditions of a For loop is satisfied, the following processes are
    happening inside of it-


    *   If the conditions are met, then the initializing expression (if any) will
    be executed. In the above example, the initial expression sets the variable i
    (which serves as a counter) to 0.


    *   After which, the given condition will be evaluated. If the found condition
    is true, then the loop will keep on executing itself, until it has reached a state
    where the given condition appears to be false, in which case the loop will stop.
    If however, the condition expression has been completely removed, then the loop
    will keep on executing itself infinitely.The condition is that i should be less
    than 5\.


    *   Once the loop has executed itself, it will look inside for a statement which
    it needs to be run. If you want to have multiple statements inside your loop,
    then you can use a block statement ({…}) to separate those statements in particular
    groups.


    *   Once the statement running is complete, the loop will look at the incrementExpression,
    where it will update the Initial Expression and keep on repeating the cycle over
    and over again. On the first loop, i = 0\. On the second loop, i = 1\. Thus, you
    can see that it will take five loops for the condition to return a Boolean value
    of false where i< 5 (0, 1, 2, 3, 4). On the sixth loop, i will equal 5, making
    the condition false. It is important to note that you can also use any comparison
    operator for the condition. In this way, for(vari = 0; i< 5; i++) and for (vari
    = 0; i<=4; i++) will both run the same number of loops.


    The proper way to use the For Loop is:


      for (statement a; statement b; statement c) {


    code block to be executed


    }


    Statement a is executed before the code block starts. Statement b is the condition
    to run the loop, and statement c is executed each time the code block has been
    executed. (JavaScript For Loop, from W3school.com)


    One thing to remember is that you don’t have to use the increment operator to
    change your condition variable. You can also use the decrement operator, which
    will allow you to perform a countdown. Consider the following code:


    for(vari = 30; i>= 0; i--)


                  {


                                await sleep(1000);


                                console.log(i);


                  }


    This code will count down from 30 to 0, printing a new number every second. You
    can also use this code in a program without the console.log command to set an
    internal timer, making it a handy way to delay another function.


    You can also use a for loop to iterate through an Array to find a certain value.
    Let’s say that you have an Array of phone numbers and you’re looking to see if 
    a certain one is stored. You create an interface that accepts a phone number as
    an input variable, number and then searches the phoneNumber array to see if it
    exists. The for loop will iterate through the array and will return a true value
    if the phone number is found. This for loop would look like this:


    for (i = 0; i<phoneNumber.length; i++) {


                  if (phoneNumber[i] == number) {


                                console.log(“true, phone number found in entry# ”
    + (i+1));


                  }


    }


    The for loop looks through the phoneNumber array at each cell and compares the
    value of that cell with the number variable. If they are the same, it prints where
    the phone number was found. You may notice that the cell number has 1 added to
    the value. That’s because the first cell in any Array is initialized at zero.
    So phoneNumber[1] is actually the second entry in the array.


    2.  The Do/While Loop


    This loop is a post-condition loop. That is because the loop is run first, then
    the condition in the while statement is checked. The loop will keep running itself
    until it has found a specified condition to be false.


      do {code block


    }


    While (condition)


    Ex-


    do {


    i+ = 1;


    console.log(i);


    }


    while (i< 5);


    The above example will keep on repeating itself until the value of i has reached
    4 which is less than 5, as specified by the condition.


    3.  The while statement


    Unlike the “Do while” loop, the while loop will only execute the statement if
    the condition is met. This makes it a pre-condition loop.


    The while loop has a similar structure as Do/While Loop:


    While (condition){


    code block


    }


    Ex-


