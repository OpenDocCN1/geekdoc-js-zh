    \ turn them into one string using `+` operator or `+=` assignment operator.\n\n\
    ### Ex\n```javascript\nvar Spray = “Hello” ;\nvar Body = “World” ;\nconsole.log(Spray\
    \ + “ “ + Body);\n```\nThis will give an output of “Hello World”\n\n### Ex2-\n\
    ```javascript\nvar a=”I am ”\nvar b +=”Legend”\n```\nThe result will be: `I am\
    \ Legend`\n\nAlso, you can add a string and a number together:\n\n`X=”3”+1` (Result\
    \ will be `31`, not `4`) \n`X=”Jessica”+1` (Result will be `Jessica1`)\nThe result\
    \ will be a `String`.\n\nUnlike other programming languages, the behavior of the\
    \ operators that deal with `Strings` and those that deal with numbers vary to\
    \ a great extent. Having a deep understanding of the core differences between\
    \ the two is important in order to make sure that both of them are used properly.\n\
    \nFor example, one of the prime differences you will notice while using these\
    \ two types of operators can be found during the usage of the Addition Operator.\n\
    \nSee the following example:\n\nConsider a scenario where we are trying to add\
    \ a number and a string.\n\n#### Example 1.\n```javascript\nvar Bar = 5;\nvar\
    \ Legal = “6”\nconsole.log (Bar + Legal)\n```\nThe output here will be `56`.\n\
    \nIf you want to force the strings to act as simple numbers, you can add a `Number`\
    \ keyword in front of the string variable.\n\n#### Example 2.\n```javascript\n\
    X=1+Number(“6”)\n```\nThe result will be `7` in this case.\n\n#### Example 3.\n\
    ```javascript\nvar Bar = 5;\nvar Legal = “6”;\nconsole.log (Bar + Number(Legal))\n\
    ```\nThe output of this statement is `11`.\n\nThese are examples of how JavaScript\
    \ allows you to do type conversion manually from numbers to `Strings`, `Strings`\
    \ to numbers, or `Boolean` values to numbers or `Strings`.\n\nWe’ve already shown\
    \ you how to convert `Strings` to numbers using the global `Number()` method.\
    \ A similar method exists to convert numbers to `Strings`. This uses the global\
    \ `String()` method. See the following Examples.\n\n#### Example 4.\n`String (3.14)`\
    \ will convert the number `3.14` to a `String`.\n`String(x + y)` converts the\
    \ expression of `x`++`y` into a `String`.\n\nYou may wonder why you would ever\
    \ want to convert a number to a `String`. There are times when you will want to\
    \ preserve the accuracy of a number out to a certain number of decimals. Because\
    \ of how computers deal with numbers by converting them to binary and back, you\
    \ can lose accuracy when working with just the number type. In this case, preserving\
    \ the value as a string ensures that you won’t lose any accuracy in your values.\n\
    \nYou can also convert `Boolean` values into numbers or `Strings`.\n\n`Number(TRUE)`\
    \ will return a value of `1`\n`Number(FALSE)` will return a value of `0`\n`String(TRUE)`\
    \ returns a `String`, “true”\n`String(FALSE)` returns a `String`, “false”\n\n\
    ## The Logical Operators\n\nWhen you face a scenario where you need to code something\
    \ that will only work based on the results from two or more conditions, you will\
    \ need to utilize the logical operators that are built in the JavaScript framework.\
    \ The logical operators are `AND`(`&&`), `OR`(`||`) operators, and `NOT`(`!`)\
    \ Operators. These work by comparing the `Boolean` value from each comparison.\
    \ There are only two `Boolean` values, `TRUE` and `FALSE`.\n\nFor Example:\n`X\
    \ && Y`\nThe result of the `AND` operator is true if both `X` and `Y` are true.\n\
    The result of the `OR` operator is true if either (`X` or `Y`) or both are true.\n\
    \n#### Example for Not Operator:\n```javascript\n!X\n```\nThe result of the `NOT`\
    \ operator is true if `X` is not true.\n\nTo be more detailed, here are some more\
    \ examples of the `AND`, `OR`, `NOT` operators.\n\n### Ex\n```javascript\nx =\
    \ 5\nY = 0\n(x>3 && y<3) // returns true because 5 is greater than 3 AND 0 is\
    \ less than 3.\n\nX=3\nY=2\n(X==3 || y==3) // returns true because 3 = 3. It doesn’t\
    \ matter that the y portion of the comparison is false because OR only cares if\
    \ one OR the other is true.\n\nX=1\nY=5\n!(x==y) // returns true because the condition\
    \ inside the parentheses is false. The opposite of false is true.\n```\n\nThe\
    \ function of the `AND` operator is to allow a code to run only if both of the\
    \ given conditions is found to be valid.\nOn the other hand, An `OR` operator\
