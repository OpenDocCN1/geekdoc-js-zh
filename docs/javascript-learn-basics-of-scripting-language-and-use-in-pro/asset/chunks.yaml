    # What are JavaScript Keywords?


    Keywords are command identifiers which are pre-installed in the JavaScript database.
    Keywords tells the browser to perform specific actions. For example the `var`
    command we have used to create new variables is actually a keyword. It tells the
    browser that a new variable needs to be created.


