  trans: "\n\n你可以做的另一件事是在作用域内声明变量，而不使用 `var` 关键字。如果该变量在相关代码块作用域外部的代码开头没有定义，那么该变量的行为将类似于全局变量。\n\
    \n示例：\n\n```\nvar foo = ‘hello’;\n\nvar talkHello = function() {\n\nconsole.log(foo);\n\
    };\n\ntalkHello(); // 打印 ‘hello’\n\nconsole.log(foo); // 也打印 ‘hello’\n```\n\n\
    如你所见，变量 `foo` 在函数 `talkHello` 外部声明。这意味着 `foo` 是一个全局变量，任何函数都能访问它，因此当函数 `talkHello`\
    \ 调用它时，它是可以访问的。\n\n接下来的示例与第一个示例相反。这说明写在作用域之外的代码块无法识别该变量的。\n\n```\nvar talkHello\
    \ = function() {\nvar doo = ‘hello’;\nconsole.log(doo);\n};\n\ntalkHello(); //\
    \ 打印 ‘hello’\n\nconsole.log(doo); // 输出空日志。\n```\n\n在这个示例中，变量 `doo` 在函数 `talkHello`\
    \ 内部被调用。这创建了一个仅该函数可以访问的私有变量，因此当命令 `console.log(doo)` 尝试访问它时，它返回一个空值。\n\n### 需要避免的常见错误\n\
    \n- 始终记住，变量只能被特定作用域内的函数访问，在该作用域之外，变量是无效的。\n\n### 练习\n\n- 解释什么是作用域以及变量是如何受其影响的。\n\
    - 编写一个简单的程序来演示以下功能：\n    a) 简单函数\n    b) 有返回值的函数\n    c) 作为参数（参数）传递的函数\n- 解释自执行匿名函数（Self-Executing\
    \ Anonymous Function）的概念并给出示例。\n\n# 第五章\n\n# JavaScript 的一些显著特性\n\n许多新手在听到人们称\
    \ JavaScript 是一门给孩子的语言时，往往会感到有些失望。好吧，让我为你消除这个疑惑。首先，JavaScript 无疑是目前最强大的编程语言之一。它是\
    \ Web 开发所需的一项流行技能。\n\nJavaScript 的美之处在于其简单而又复杂的呈现。多年来，它一直被许多开发者使用。它可以为他们的网页增添新鲜活力，范围从非常细微但重要的功能（如自动图片切换器），到增强美感的更复杂的设计。\n\
    \n以下是帮助 JavaScript 在人群中脱颖而出的几个特性。\n\n### 集成浏览器支持\n\n从一开始，JavaScript 的用户友好型本质就非常吸引人，它吸引了许多新程序员和专家。许多许多\
    \ Web 开发语言需要安装辅助的 Flash 插件才能访问 Flash 内容并在浏览器中运行。JavaScript 的用户大多可以免受这种烦恼，因为几乎所有浏览器都无一例外地接受\
    \ JavaScript 作为其核心脚本语言。这使得他们对该语言提供集成支持。在最关键的情况下，用户只需要小心地处理某些依赖 `DOM` 的特定任务，但除此之外，JavaScript\
    \ 是完全可访问且免费使用的。\n\n### 一种功能性且灵活的编程语言\n\n对于喜欢在程序中使用大量函数的程序员来说，JavaScript 是一种享受。这是因为该语言中包含了多功能的处理技术，允许程序员决定函数的执行。JavaScript\
    \ 使其处于函数式编程前沿地位的两个显著特性是：它赋予了程序员将函数赋值给任何变量的自由，并可以使用参数让一个函数接受另一个函数。这种深度的定制能力让喜欢在编程中拥有更多自由的程序员觉得更有趣。\n\
    \n### 在客户端和服务器端同时使用 JavaScript 的能力\n\n![](img/00007.jpeg)\n\n由于 JavaScript 已经被\
    \ Web 浏览器正式认可为它们主要的开发语言，JavaScript 被赋予了管理权限以访问任何浏览器的文档模型对象（DOM）。这样做为程序员提供了另一个层面的自由。它允许程序员动态更改网页的结构。不仅如此，该语言还可以用于为网页添加各种有趣的特效。如果你正在使用\
    \ Alfresco，那么你太幸运了！因为 JavaScript 还允许在 Alfresco 中创建 Web 脚本。这让程序员能够轻松地向任何 Alfresco\
    \ 服务器添加自定义任务。\n\n当你将所有这些结合在一起时，JavaScript 确实是一门奇大的编程语言，既强大又易用。\n\n### 自主检测浏览器和系统的能力\n\
    \n![](img/00008.jpeg)\n\n有时在编程时，你可能会一些问题，并需要编写依赖于你正在使用的操作系统和网络浏览器的代码。\n\nJavaScript\
    \ 的设计非常智能，使其能够感知你正在使用的浏览器和操作系统。这允许你根据自己的需求轻松调整语言，从而轻松地执行所有依赖操作系统的操作。\n\n### 对面向对象编程的多样支持\n\
    \n面向对象编程可能是如今编程语言的基石。程序员通常根据对对象处理机制的可访问性来选择语言。相比之下，JavaScript 有一套非常不同且独特的结构系统，决定了如何处理对象。它提供了海量的支持，同时保持了相对易于学习和使用。这鼓励用户以顺畅高效的方式编写更复杂的面向对象代码，而复杂性极小。\n\
    \n这是 JavaScript 始终处于程序员和行业名单首列的众多原因之一。\n\n如果你对面向对象编程感兴趣，那么选择 JavaScript 绝不会出错。\n\
    \n# 结论\n\n许多人认为，学习编程的唯一方法是回到学校或其他教育中心。但我并不认为这是事实。得益于在线通信的巨大进步，你可以通过网络教程和视频轻松学习并掌握任何新技能。那里供你掌握的信息是无尽的。\n\
    \nJavaScript 并不是只为天才和极客设计的程序。这是一门非常标准化的语言，任何人都可以学会。就像现实中的语言一样，这门语言也将帮助你开启无限的可能性和机会。\n\
    \n感谢购买本书并并给我宝贵的时间。我希望这本书对你有所帮助，并希望通过这本书，你已经获得了 JavaScript 编程的所有基础知识，这将帮助你开启程序员的职业。\n\
    \n我鼓励你尽可能地练习 JS 编程。只要你投入，很快你就会成为你想成为的程序员。让抱负的火焰在你心中燃烧。记住，如果你真的想做这件事，在掌握这门语言之前，不要跳到另一种编程语言上。\n\
    \n"
