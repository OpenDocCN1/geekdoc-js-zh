    # Introduction


    ![](images/00001.jpeg)


    JavaScript is one of the oldest programming languages known that are still in
    use by programmers today. The most beautiful part of this language is that it
    is relatively simple compared to other programming languages. `JavaScript` is
    a very fundamental language to learn during your early years as a programmer.
    It has the flexibility needed to create very complex projects. The easy manipulation
    and richness of this language make it one of the simplest yet versatile programming
    languages on the current market.


    Like other programming languages, the first things you should focus on are the
    basic elements of this language. Mastery of the building blocks of `JavaScript`
    will help you in the long run and will aid you in writing complex code.


    `JavaScript` is often confused with `Java`, another programming language, but
    the two are entirely different object oriented programming languages. `JavaScript`
    was written in 10 days by Brendan Eich, a programmer working at Netscape. The
    prototype was written to complement `Java` which was being included in Netscape’s
    web browser, `Navigator`. The language was originally named `Mocha`, but was changed
    in September, 1995, to `LiveScript`. In December, under an agreement with Sun
    Microsystems, who owned the `Java` language, `LiveScript` was renamed `JavaScript`.


    There have been hundreds of thousands of `JavaScript` programmers up until now,
    and there are some mistakes that are made by every single `JavaScript` programmer
    during their early years. It is essential that you learn how to avoid these mistakes
    and learn to code in the proper way. You can look at `JavaScript` as being the
    first step which towards learning other different programming languages. You will
    be pleasantly surprised by how much easier it will be for you to master different
    languages once you have obtained a clear grasp on `JavaScript`.


    So, let’s begin now shall we?


    # Chapter One


    ## Syntax


    The first thing you should know in `JavaScript` is `Syntax`. `Syntax` is a set
    of rules that governs the writing and interpreting of any program written in `JavaScript`.


    ### The Basics of Syntax


    ![](images/00002.jpeg)


    If you are absolutely new to the world of Programming, then you should know that
    every programming language is comprised of sets of specific rules. These rules
    are followed in order to create a structured blueprint which the computer recognizes
    and then executes. When we talk about a computer program, in the simplest terms,
    we are referring a list of instructions which tells the computer what to do and
    what to execute.


    These instructions are given through the various rules, which are called `Syntax`.
    In short, `Syntax` is the set of rules that defines `Fixed Values` and `Variable
    Values`.


    Imagine that you are in a new class in college and the instructor comes in and
    writes the following message on the board: “21 read 14 6 to problems to 35 do
    pages and.” You’re going to be very confused. Even though you recognize the words,
    you don’t know what to do with them because they aren’t in an order or format
    that you recognize. That’s because this hypothetical professor isn’t following
    the `Syntax` rules of the English language. If the professor writes, “Read pages
    21 to 35 and do problems 6 to 14,” you know exactly what to do.


    The same is true of your computer. If you don’t use the right order and correct
    format, your computer won’t know how to proceed with your program and will stop,
    creating errors as it tells you that it doesn’t understand what you want it to
    do.


    The most basic elements include but are not limited to `Statements`, `Variable
    Naming` and `White Space Syntaxes`.


    When working with a programming language, all the instructions are called `Statements`.


    Before moving on with the statements, there are some important things you need
    to know.


    ### JavaScript is Case Sensitive


    `JavaScript` is, in fact, a case sensitive language. This might create some confusion
    for those who have already learned multiple programming languages. We know there
    are many languages out there that are not case sensitive. When writing code in
    `JavaScript`, you will always have to start the name of constructor with a capital
    letter which is followed by the name of a function.


    ### Whitespace


    ![](images/00003.jpeg)


    If you have browsed through some sample codes, you have probably noticed the presence
    of blank areas. These spaces, tabs and newlines are referred to as `Whitespace`.
    One of the core differences between other languages and `JavaScript` is that in
    other languages it does not matter how much blank space you leave, but in `JavaScript`,
    the `whitespace` directly impacts the semantics of the program.


    ### The Significance of Semicolon


    The statements written in `JavaScript` are mostly separated by semicolons. One
    key factor at play when writing code in `JavaScript` is a function called `Automatic
    Semicolon`. This feature is present in the language to make it a little easier
    for users. The way this works is that whenever a statement is written before a
    new line has been parsed, the first statement will be taken as a complete and
    correct, acting as if a semicolon was in place. The option is always available
    for you to adjust the setting so you can prevent the automatic insertion. If you
    prefer to manually inserting semicolons in your code; this will eliminate undesired
    insertion of semicolons.


    ### A Deeper Look at the Statements


    The statements in `JavaScript` are made of various components. They create the
    language commands and instructions of the language itself. Above is a chart that
    shows the most common kinds of statements used in `JavaScript`.


    - `Values`

    - `Operators`

    - `Expression`

    - `Keywords`

    - `Comments`


    The above components are some of the most basic elements of `JavaScript`. We shall
    now go through each of them in brief details.


    ### Values


    When programming in `JavaScript` Syntax, you will come face to face with two types
    of values. Namely


    - `Fixed Values` which are also called literals.

    - `Variable Values` which are variables with interchangeable values.


    ### Fixed Values Rules


    When working with fixed values, there are two rules you should keep in mind:


    - Numbers can be written either with a decimal point or without a decimal point.

    Ex: `10`, `10.10`

    - Strings (Text) can be written with either double quotes or single quotes.

    Ex: `“I am Jim”`, `‘You are Henry’`


    ### Variables Rule


    A slightly different rule is followed when writing JavaScript variables(Variables
    act as containers to store data values). The `var` keyword is used to declare
    variables. Also, an equal sign (`=`) is used to assign values to the declared
    variable.


    For Example:


    ```javascript

    var a;

    a = 9;

    ```

    (a is defined as a variable, and a is assigned the value 9)


    Similarly, you can put a string in a variable as well.


    ```javascript

    var food = “I Love Food”;

    ```


    As we have mentioned earlier, the white spaces does play an important role in
    JavaScript programming, in this scenario, the white spaces inside the quotation
    marks will act as blank spaces.

