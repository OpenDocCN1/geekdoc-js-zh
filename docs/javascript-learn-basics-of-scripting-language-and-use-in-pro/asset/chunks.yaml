    ```javascript

    var food = “ I Love Food” ;

    ```


    When naming your variables, use words that are meaningful instead of fragments
    or shortcuts. Consider if you want to create a variable that will handle the names
    of colleges you want to attend. You could define your variable as such:


    ```javascript

    var = schlnam;

    ```


    and that is a valid naming scheme. However, when it comes time to debug your code
    to make it work better, you might not remember what that variable means. Instead,
    defining it as:


    ```javascript

    var = schoolNames;

    ```


    makes it clear what the variable does and what it contains.


    Keep in mind that variable names are generally not capitalized when creating them
    in JavaScript. That’s because JavaScript is a case sensitive language and capitalization
    is reserved for object types, such as `Strings`. That isn’t to say that capitals
    aren’t used in variable names. Use capitals when making variables with multiple
    words in their names to make them easier to read. Consider the following:


    ```javascript

    var = schoolnames

    ```


    or


    ```javascript

    var = schoolNames

    ```


    By capitalizing the second word, it makes the variable name easier to recognize.


    # JS Operators


    There are seven different Arithmetic Operators that are used to calculate values
    in JS. These operators are addition (`+`), subtraction (`-`), multiplication (`*`),
    division (`/`), modulus (remainder) (`%`), increment (`++`), and decrement (`--`).


    You’re probably familiar with the normal math operators of addition, subtraction,
    multiplication, and division, so we’re going to just cover the three you probably
    don’t know.


    Modulus is used to return the remainder after one number is divided by another.
    Increment is used to add 1 to a number and decrement is used to subtract 1 from
    a number.


    Consider the following where `y = 5`.


    For `x = y % 2`, `x` will have a value of `1`. That’s because `5/2 = 2` with a
    remainder of `1`. For `x = y % 3`, `x` will have a value of `2`.


    With increment and decrement, where you place the `++` or `–` matters in determining
    the final value.


    The two calculations of `x = ++y`, and `x = y++` will have different results for
    `x`, because JavaScript will do the operations in order.


    In the case of `x = ++y`, JavaScript says, okay, first I have to increment `y`,
    then I have to assign that value to `x`. So the end values will be `x = 6`, BUT
    ALSO, `y = 6`.


    In the case of `x = y++`, JavaScript will first assign the value of `y` to `x`,
    THEN increment `y`. That makes the return values `x = 5` and `y = 6`.


    This is similar for the decrement operator `--`. If you say, `x = --y`, then `y
    = 4` and `x = 4`. If you say `x = y--`, then `y = 4`, but `x = 5`.


    When doing simple calculations using the built-in mathematical operators, parentheses
    play an important role as they determine the operating order of the calculation.


    Ex-


    *   `3 * 2 + 6`


