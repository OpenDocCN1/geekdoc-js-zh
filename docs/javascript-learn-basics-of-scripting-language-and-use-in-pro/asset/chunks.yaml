    \n## 目录\n- 引言\n\n# 引言\n\n![](img/00001.jpeg)\n\nJavaScript 是已知最古老且且今天仍被程序员们广泛使用的编程语言之一。这门语言最迷妙的地方在于，与其他编程语言相比，它相对简单。`JavaScript`\
    \ 是你作为程序员在早期学习的一门非常基础的语言。它具有创建复杂项目所需的灵活性。这种语言易于操作且功能丰富，使其成为目前市场上最简单且功能最强大的编程语言之一。\n\
    \n与其他编程语言一样，你首先应该关注的是这种语言的基本元素。精通 `JavaScript` 的构建模块从长远来看将大有裨益，并帮助你编写复杂的代码。\n\n\
    `JavaScript` 经常与另一种编程语言 `Java` 混淆，但两者是两种完全不同的面向对象的编程语言。`JavaScript` 由在 Netscape\
    \ 工作的程序员 Brendan Eich 在 10 天内编写的。该原型是为了补充当时包含在 Netscape 网页浏览器 `Navigator` 中的 `Java`。该语言最初命名为\
    \ `Mocha`，但在 1995 年 9 月更名为 `LiveScript`。12 月，在与 `Java` 语言的所有 Sun Microsystems\
    \ 公司达成协议后，`LiveScript` 被重命名为 `JavaScript`。\n\n直到为止，已经出现了数十万 `JavaScript` 程序员，而且每一位\
    \ `JavaScript` 程序员在早期阶段都会犯一些错误。学习如何避免这些错误并学习以正确的方式编写代码至关重要。你可以将 `JavaScript` 视为学习其他不同编程语言的第一步。一旦你清晰掌握了\
    \ `JavaScript`，你会发现掌握其他语言将变得简单得多，这会让你感到惊喜。\n\n那么，让我们开始吧好吗？\n\n# 第一章\n\n## 语法\n\
    \n在 `JavaScript` 中你首先需要知道的是 `Syntax`（语法）。`Syntax` 是一套规则，规定了任何用 `JavaScript` 编写程序的编写和解释方式。\n\
    \n### 语法基础\n\n![](img/00002.jpeg)\n\n如果你对编程世界完全是新手，那么你应该知道，每种编程语言都由一组特定的规则组成。这些规则按照顺序执行，以创建一个结构化的蓝图，计算机能够识别并执行它。当我们谈论计算机程序时，从简单来说说，我们指的是一组指令，告诉计算机要做什么以及执行什么。\n\
    \n这些指令通过各种规则给出，这些规则被称为 `Syntax`。简而言之，`Syntax` 是定义 `Fixed Values`（固定值）和 `Variable\
    \ Values`（变量值）的规则集。\n\n想象你正在大学的一门新课上课，老师进来并在黑板上写下以下信息：“21 read 14 6 to problems\
    \ to 35 do pages and.”你会感到非常困惑。尽管你认识这些单词，但你不知道该对它们做什么，因为它们不是你所认识的顺序或格式。这是因为这位假设的教授没有遵循英语的\
    \ `Syntax` 规则。如果教授写道：“阅读第 21 到 35 页，并完成第 6 到 14 题，”你就确切知道该做什么了。\n\n你的计算机也是如此。如果你不使用正确的顺序和格式，计算机将不知道如何继续运行你的程序并停止，通过产生错误来告诉它不理解你想让它做什么。\n\
    \n最基本的元素包括但不限于 `Statements`（语句）、`Variable Naming`（变量命名）和 `White Space Syntaxes`（空白语法）。\n\
    \n在处理编程语言时，所有的指令都称为 `Statements`。\n\n在继续学习语句之前，有一些你需要知道的事情。\n\n### JavaScript\
    \ 是区分大小写的\n\n`JavaScript` 实际上是一种对区分大小写的语言。对于那些已经学习过多种编程语言的人来说，这可能会引起一些困惑。我们知道有很多语言是不区分大小写的。在\
    \ `JavaScript` 中编写代码时，你始终必须以大写字母开头构造函数的名称，后面跟着函数名。\n\n### 空格\n\n![](img/00003.jpeg)\n\
    \n如果你浏览过一些示例代码，可能已经注意到空白区域的存在。这些空格、制表符和换行被称为 `Whitespace`（空白字符）。与其他语言与 `JavaScript`\
    \ 之间的核心区别之一是，在其他语言中，留出多少空白空间并不重要，但在 `JavaScript` 中，`whitespace` 直接影响程序的语义。\n\n\
    ### 分号的重要性\n\n`JavaScript` 中编写的语句大多由分号隔开。在 `JavaScript` 中编写代码时起作用的一个关键因素是一个名为\
    \ `Automatic Semicolon`（自动分号）的特性。该特性存在于语言中是为了让用户更方便一点。它的工作原理是，每当在解析新行之前写了一条语句时，第一条语句将被视为完整且正确的，就像那里放置了分号一样。你始终拥有调整设置的选项以防止自动插入。如果你喜欢在代码中手动插入分号；这将消除不必要的分号插入。\n\
    \n### 深入探析语句\n\n`JavaScript` 中的语句由各种组件组成。它们创建了语言本身的命令和指令。上面的图表显示了 `JavaScript`\
    \ 中最常见的语句类型。\n\n- `Values`（值）\n- `Operators`（运算符）\n- `Expression`（表达式）\n- `Keywords`（关键字）\n\
    - `Comments`（注释）\n\n上述组件是 `JavaScript` 的一些最基础元素。我们现在将简要介绍每一个。\n\n### Values\n\n\
    在 `JavaScript` 语法中进行编程时，你会面对两种类型的值。即\n\n- `Fixed Values`（固定值），也称为字面量。\n- `Variable\
    \ Values`（变量值），具有可变化的变量。\n\n### Fixed Values Rules\n\n在处理固定值时，有两个规则你应该记住：\n\n\
    \ 数字 数字可以带小数点写，也可以不带。例如：`10`，`10.10`。\n- 字符串（文本）可以用双引号或单引号写。例如：`“I am Jim”`，`‘You\
    \ are Henry’`\n\n### Variables Rule\n\n编写 JavaScript 变量时遵循略有不同的规则（变量是存储数据值的容器）。`var`\
    \ 关键字用于声明变量。此外，等号（=`）用于向声明的变量赋值。\n\n例如：\n\n```javascript\nvar a;\na = 9;\n```\n\
    （将 a 定义为一个变量，并给 a 赋值为 9）\n\n同样，你也可以将字符串放入变量中。\n\n```javascript\nvar food = “I\
    \ Love Food”;\n```\n\n正如我们之前提到的，空白在 JavaScript 编程中起着重要作用，在这种情况下，引号内的空白将作为空格起作用。\n\
    \n"
