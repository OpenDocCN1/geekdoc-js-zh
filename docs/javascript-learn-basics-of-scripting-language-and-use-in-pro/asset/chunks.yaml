- fmt: "\nIn the example below, I have thought of a scenario where I want to walk\
    \ 8 steps to the east. This is what the code will look like –\n\n```javascript\n\
    for ( step = 0 ; step < 8 ; step++){‘walk east one step’}\n```\n\nThe above code\
    \ is a simple code that starts running from `step` 0, and after taking each step,\
    \ it adds a value to the `step` variable increasing its value by `+1`. The cycle\
    \ keeps on running until the value of the `step` variable reaches 7, which is\
    \ when the program stops.\n\nUsing loops is fun, and you should be happy to know\
    \ that this is not the only kind of loop that’s available at your disposal. In\
    \ fact, there are a wide variety of different loop statements that you will be\
    \ able to use depending on the task.\n\nAll loops fall into one of two categories:\
    \ pre-condition and post-condition. In a pre-condition loop, the check on the\
    \ condition is made before the code inside the loop is processed. This means that\
    \ the loop may not run at all if the condition is not satisfied. On a post-condition\
    \ loop, the condition is checked after the loop has run. This means that the loop\
    \ will always run at least once. This distinction is important to keep in mind\
    \ when you think about what kind of loop you want to use.\n\nLet’s now have a\
    \ look at the different types of loops in JS.\n\n## 1. The For Loop\n\nThe `For`\
    \ loop is a primary example of a pre-condition loop. The loop is pretty simple\
    \ and will keep on repeating itself until the specified condition has been fulfilled,\
    \ or in other words, the specified condition has been deemed false.\n\nThe skeleton\
    \ of the `For` loop is –\n\n```javascript\nfor( [initialExpression] ; [condition]\
    \ ; [incrementExpression])\n{\n    Statement\n}\n```\n\nFor example, say we want\
    \ to print the String, `Hello World!` five times. We can either do this by repeating\
    \ the command `console.log(\"Hello World!\");` five times or we can create a `for`\
    \ loop as follows:\n\n```javascript\nfor (vari = 0; i< 5; i++) {\n    console.log(\"\
    Hello World!\");\n}\n```\n\nWhenever the conditions of a `For` loop is satisfied,\
    \ the following processes are happening inside of it-\n\n- If the conditions are\
    \ met, then the initializing expression (if any) will be executed. In the above\
    \ example, the initial expression sets the variable `i` (which serves as a counter)\
    \ to 0.\n- After which, the given condition will be evaluated. If the found condition\
    \ is true, then the loop will keep on executing itself, until it has reached a\
    \ state where the given condition appears to be false, in which case the loop\
    \ will stop. If however, the condition expression has been completely removed,\
    \ then the loop will keep on executing itself infinitely. The condition is that\
    \ `i` should be less than `5`.\n- Once the loop has executed itself, it will look\
    \ inside for a statement which it needs to be run. If you want to have multiple\
    \ statements inside your loop, then you can use a block statement `{…}` to separate\
    \ those statements in particular groups.\n- Once the statement running is complete,\
    \ the loop will look at the `incrementExpression`, where it will update the `Initial\
    \ Expression` and keep on repeating the cycle over and over again. On the first\
    \ loop, `i = 0`. On the second loop, `i = 1`. Thus, you can see that it will take\
    \ five loops for the condition to return a Boolean value of false where `i < 5`\
    \ (0, 1, 2, 3, 4). On the sixth loop, `i` will equal 5, making the condition false.\
    \ It is important to note that you can also use any comparison operator for the\
    \ condition. In this way, `for(vari = 0; i< 5; i++)` and `for (vari = 0; i<=4;\
    \ i++)` will both run the same number of loops.\n\nThe proper way to use the `For\
    \ Loop` is:\n\n```javascript\nfor (statement a; statement b; statement c) {\n\
    \    code block to be executed\n}\n```\n\n`statement a` is executed before the\
    \ code block starts. `statement b` is the condition to run the loop, and `statement\
    \ c` is executed each time the code block has been executed. (JavaScript For Loop,\
    \ from W3school.com)\n\nOne thing to remember is that you don’t have to use the\
    \ increment operator to change your condition variable. You can also use the decrement\
    \ operator, which will allow you to perform a countdown. Consider the following\
    \ code:\n\n```javascript\nfor(vari = 30; i>= 0; i--)\n{\n    await sleep(1000);\n\
    \    console.log(i);\n}\n```\n\nThis code will count down from 30 to 0, printing\
    \ a new number every second. You can also use this code in a program without the\
    \ `console.log` command to set an internal timer, making it a handy way to delay\
    \ another function.\n\nYou can also use a `for` loop to iterate through an `Array`\
    \ to find a certain value. Let’s say that you have an `Array`. You create a `for`\
    \ loop to iterate through an `Array` to find a certain value.\n\n```javascript\n\
    for (i = 0; i<a.length; i++) {\n    if(a[i] == theValue) {\n        console.log(\"\
    true\");\n    }\n}\n```\n\n## 2. The Do/While Loop\n\nThe `Do/While` loop is a\
    \ post-condition loop. The loop will keep repeating itself until the condition\
    \ is false.\n\n```javascript\ndo {\n    code block\n}\nwhile (condition)\n```\n\
    \nEx-\n\n```javascript\ndo {\n    i += 1;\n    console.log(i);\n} while (i < 5);\n\
    ```\n\n## 3. The While Statement\n\nUnlike the `do while` loop, the `while` statement\
    \ will only execute if the condition is met. This makes it a pre-condition loop.\n\
    \n```javascript\nwhile (condition) {\n    code block\n}\n```\n\nEx-\n\n```javascript\n\
    n = 0;\nx = 0;\nwhile (n < 3) {\n    n++;\n    x += n;\n}\n```\n\n## 4. The Label\
    \ Statement\n\nThe `label statement` can be described as a sign board for a specific\
    \ loop. Once you have named a loop using the label statement, you will be able\
    \ to refer to it throughout your program using the name, after that you can use\
    \ the `break` or `continue` statement to either run or disrupt the execution.\n\
    \nThe structure is:\n\n```javascript\nLabel :\n    Statement\n```\n\nOr\n\n```javascript\n\
    markLoop:\nwhile (theMark == true) {\n    doSomething();\n}\n```\n\n## 5. The\
    \ Break Statement\n\nThe `break statement` is used to terminate the execution\
    \ of a loop. It can be either used alone on its own, or in conjunction with the\
    \ label loop. When it is used in collaboration with the label statement, it will\
    \ terminate the actions of the specified label. On the other hand, when it’s used\
    \ on its own, it will terminate the nearest enclosing `while`, `do/while`, `for`\
    \ or `switch` statement immediately.\n\nThe structure is:\n\n```javascript\nbreak;\n\
    break label;\n```\n\nEx-\n\n```javascript\nfor( i = 0; i<a.length ; i++ ) {\n\
    \    if(a[i] == theValue) {\n        break;\n    }\n}\n```\n"
