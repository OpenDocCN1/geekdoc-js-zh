    # JavaScript 表达式简述


    当我们谈论 JavaScript 中的表达式时，我们不是在讨论程序在难过或开心时如何反应！在 JavaScript 中，我们通常将表达式指的是运算符、变量和值的组合，计算机在处理程序时会读取所有内容。计算过程被称为求值（evaluation）。


    例如：


    `2 * 10` 求值为 `20`


    JavaScript 非常灵活。在进行计算时，你不局限于仅使用固定数字。你甚至可以使用变量来计算某些内容。


    例如：


    `X * 24`


    另一个示例：


    ```javascript

    var food = 14;

    2 * food

    ```


    这将返回一个值 `28`，因为在计算过程中，“food”的值被读取为 `14`，因为它的值在上一行已经声明过了。


    在表达式中可以使用的值不限于数字，你也可以使用字符串。


    `“Alpha” “+” “Delta”`


    这将求值为 `“Alpha Delta”`


    # 什么是 JavaScript 关键字？


    关键字（Keywords）是预装在 JavaScript 数据库中的命令标识符。关键字告诉浏览器执行特定操作。例如，我们用来创建新变量的 `var` 命令实际上就是一个关键字。它告诉浏览器需要创建一个新变量。


    例如：


    ```javascript

    var a = 8 + 9

    ```


    创建了一个新变量。它具有 `8 + 9` 的计算值，即 `17`。


    ```javascript

    var b = a * 10

    ```


    在这里，变量 `b` 赋予了值。*（注：此处原文似乎有截断，根据上下文翻译为“变量 b 赋予了值”）* 结果是 `170`。*（注：原文未显示完整，但根据逻辑推断结果为
    `170`）。


    # 注释


    注释（Comments）是用于在代码中说明说明的文本。它们不会被执行。


    在 JavaScript 中，你可以使用 `//` 进行单行注释，或者使用 `/* ... */` 进行多行注释。


    # 标识符


    标识符（Identifiers）用于命名变量、关键字和函数。标识符可以是字母、数字、下划线（`_`）或美元符号（`$`）。使用这种命名方式的标识是合法的名称。


    例如：


    ```javascript

    var a;

    ```


    # 第二章


    # 基础运算符介绍


    JavaScript 中的基础运算符由符号和标记创建。我们已经熟悉了一些运算符，例如用于给变量赋值的等号。


    例如：


    ```javascript

    var a = 8;

    var b = 9;

    ```


    上述两行的含义是变量 `a` 和 `b` 被声明，并向它们分配了值。在这种情况下，`a` 的值为 `8`，`b` 的值为 `9`。


    同样，JavaScript 在脚本内部内置了一些其他基础数学运算符。让我们看看以下四个：


    - 加法运算符 (`+`)

    - 乘法运算符 (`*`)

    - 除法运算符 (`/`)

    - 减法运算符 (`-`)


    每个运算符的工作方式与它们在计算器中的方式相同。


    例如：


    ```javascript

    var a = 10;

    var b = 5 ;

    ```


    a/b


    这是一个简单的除法，将 10 除以 5 得到 2。


    a + b


    此操作执行加法，10 + 5 得到 15。


    a – b


    此操作执行减法，10-5 得到 5。


    a *b


    这是一个基础乘法，10 * 5 = 50。


    除了基础运算符，这里还有：


    不同类型的赋值运算符（用途：为变量赋值）


