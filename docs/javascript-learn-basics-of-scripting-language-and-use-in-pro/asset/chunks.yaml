  trans: "\n\n```javascript\nBreak;\n}\n```\n\n### 6. Continue 语句\n\n该语句可以描述为 `break`\
    \ 语句的相反兄弟语句。它拥有 `Break` 语句的所有特征。该语句也可以与标签（label）语句结合使用，也可以单独使用。唯一的区别在于：它不是终止执行，而是实际上继续执行执行过程。当与标签配合使用时，它将继续执行被标记的语句。当单独使用时，它将继续最近的闭包语句，然后执行紧后的下一条语句。\n\
    \n以下是语法：\n\n```javascript\ncontinue;\n\ncontinue label;\n```\n\n或者\n\n```javascript\n\
    i = 0;\nn = 0;\nwhile (i < 5)\n{\n  i++;\n  if (i == 3)\n  {\n    continue;\n\
    \  }\n  n += i;\n}\n```\n\n上面的示例是一个包含带有 `continue` 语句的 `while` 循环的代码。这里的代码只在 `i`\
    \ 的值为 3 时才会执行。\n\n### 7. For….in 语句\n\n该语句遍历特定变量在对象的所有可枚举属性。这种循环允许你访问对象的键（keys），但没有提供对键的引用。这种区别非常重要，因为这意味着当值存在时你可以执行操作，但它不允许你操作该值。\n\
    \n语法为：\n\n```javascript\nfor (variable in object)\n{\n  Statement\n}\n```\n\n\
    ### 8. For…of 语句\n\n如果你想浏览其他对象的索引，例如 `Array`、`Map`、`Set`、`Arguments` 等，则可以使用这种循环。该语句允许你调用自定义迭代钩子，这些语句对于对象的每个独特属性都是独立的。创建\
    \ `for...of` 的原因是，当对 `Arrays` 使用 `for...in` 时，可能会得到意料之外的额外属性。这使得 `for...in` 在\
    \ `Arrays` 上的使用是不安全的，因为当你遍历它们时，可能会获得导致抛错误的返回值。\n\n基本语法为：\n\n```javascript\nfor\
    \ (variable of object)\n{\n  statement\n}\n```\n\n####一些需要避免的常见错误\n\n- 在设置循环条件时，请记住运算符（`<`）（`>`）和（`==`）的正确用法。任何一个运算符的简单误用都会破坏整个程序。\n\
    - 当使用‘标签’语句时，确保使用易于记忆的名字，以便将来将来能够方便地访问它们。\n- 仔细观察你使用 `break` 和 `continue` 语句的情况。请注意，这两个语句只会影响该特定括号内的代码。\n\
    \n#### 练习\n\n- 编写一个使用 `For` 循环的简单程序。\n- 描述 `For` 循环的工作机制。\n- 编写一个使用 `break` 和\
    \ `continue` 语句的简单程序。\n- 编写一个使用 `label` 语句的简单程序，并在程序的后续调用被标记的语句。\n\n# 第四章\n\n\
    # JavaScript 函数与作用域基础\n\n现在让我们来看看，通常当我们谈论一个“函数”时，你脑海中浮出的第一个词是什么？显然是一个活动对吧？\n\n\
    JavaScript 中的函数也以类似的方式工作。函数是程序需要重复执行的代码块。函数被用于执行特定的任务。函数可以包含任意数量的参数和语句；它们甚至可以为空。取决于代码结构的如何编写，它可能会向用户返回任何值，也可能不。\n\
    \n函数以如下方式声明：\n\n```javascript\nFunction name() { /*要执行的代码块*/}\n```\n\n要启动函数，我们从\
    \ `function` 关键字开始，然后添加名称和括号。要完成函数，我们将要执行的代码块放在大括号中。\n\n你也可以将函数放在一个具命名的变量中——\n\
    \n```javascript\nvar jam = function() {/*要执行的代码块*/}\n```\n\n下面是你可以执行函数的几个示例——\n\
    \ni) 这是一个最基础函数的示例：\n\n```javascript\nvarsayHello = function(person, greeting)\
    \ {\n  var text = greeting + ' , '+ person;\n  console.log(text);\n};\n\nsayHello\
    \ (' Jessica', ' Hello');\n```\n\nii) 这是一个返回值的函数示例：\n\n```javascript\nvar greet\
    \ = function (person, greeting)\n{\n  var writing = greeting + ' , ' + person\
    \ ;\n  return function () {console.log(text); };\n}\nconsole.log(greet('Richard','\
    \ Hello'));\n```\n\niii) 有时，你可能想使用嵌套函数。（注意：嵌套函数是函数内部的函数。）\n\n```javascript\nvarsayHi\
    \ = function( person, greeting) {\n  var text = greeting + ',' + person;\n  return\
    \ function() {console.log (text);}\n};\n\nvar greeting = greet( ' Richard', 'Hello');\n\
    greeting();\n```\n\n### 自执行匿名函数\n\n程序员们一直在寻找最先进、最巧妙的方法来改进他们的编程体验，并让编程更易上手、更容易。这导致了自执行匿名函数（Self-Executing\
    \ Anonymous function）的诞生。\n\n自执行匿名函数的核心目的是创建一个 JavaScript 函数并在创建时立即执行它。\n\n这对于处理大型程序的程序员来说变得容易得多。同样，它将帮助你在不创建混乱的全局命名空间的情况下编写代码。\n\
    \n一个基本的自执行匿名函数如下——\n\n![](img/00006.jpeg)\n\n如果你计划编写复杂的代码，理解如何使用这种函数是非常重要的。使用自执行匿名函数可以产生一些易用的优秀代码。例如，jQuery\
    \ 库的设计是为了让 JavaScript 的变得更加简单。它通过将整个库封装在一个大的自执行函数中来实现这一点。\n\n### Typeof 运算符\n\n\
    你可能会遇到需要确定正在处理的变量类型的情况。你不需要找夏尔克·福尔摩来寻找答案！相反，你只需使用 `typeof` 运算符来确定任何值的类型。\n\n例-\n\
    \n`myvar=0 alert(typeofmyvar)` // “number”\n\nNumber 不是唯一可以检测的操作数类型。它也可以是：string、Boolean、object、null\
    \ 和 not defined（未定义）。\n\n### 作用域 (Scope)\n\n作用域是变量的可访问性。\n\n在调试时，良好理解作用域是必要的，因为它让你知道是哪个代码块中的哪个变量导致了问题。\n\
    \n这里的简单规则是，每当你在作用域内部声明变量时，它只会被作用域内部的语句识别；作用域外的语句不会承认它的存在，因此该变量将无法工作。\n\n另一种看待方法是将你的代码想象成一个酒店，特定的函数和代码段是酒店房间。酒店房间代表代码的私有作用域，而公共区域代表全局作用域。一个房间里的人看不到也无法另一个房间里的东西。在酒店工作的员工（以及全局作用域）也无法访问私人酒店房间。\n\
    \n因此，你可以看到作用域如何影响代码的运行。如果你需要两个不同的函数访问同一个变量，你需要确保它们都能访问该变量。确保必要的变量具有访问权限的一种方法是将你的变量变为全局可用。\n\
    \n如果你想让你的变量变为全局可用，有两种可能的替代方案。\n\n你可以做的第一件事是在给定的代码作用域之外声明变量，这将允许程序中的任何函数能够调用并识别它。\n\
    \n"
- fmt: "\nThe other thing you can do is to declare the variables inside your scope\
    \ without using the word `var`. If the same variable was not defined at the beginning\
    \ of the code outside the scope of the piece of code in question, then the variable\
    \ will act similarly to a global one.\n\nEx-\n\n```\nvar foo = ‘hello’;\n\nvar\
    \ talkHello = function() {\n\nconsole.log(foo);\n};\n\ntalkHello(); // logs ‘hello’\n\
    \nconsole.log(foo); // also logs ‘hello’\n```\n\nAs you can see, the variable\
    \ `foo` is declared outside of the function `talkHello`. That means that `foo`\
    \ is a global variable and any function will be able to access it, so when the\
    \ function `talkHello` calls it, it is accessible.\n\nThe following example is\
    \ contradictory to the first example. This shows that a code block that was written\
    \ outside the scope is not being able to recognize the variable.\n\n```\nvar talkHello\
    \ = function() {\nvar doo = ‘hello’;\nconsole.log(doo);\n};\n\ntalkHello(); //\
    \ logs ‘hello’\n\nconsole.log(doo); // gives an empty log.\n```\n\nIn this example,\
    \ the variable `doo` is called inside the function `talkHello`. This creates a\
    \ private variable that is only accessible to the function, hence when the command\
    \ `console.log(doo)` attempts to access it, it returns a null value.\n\n### Common\
    \ Mistakes to Avoid\n\n- Always remember that a variable is only accessible by\
    \ the functions within a specific scope, outside of that scope the variable is\
    \ invalid.\n\n### Practice\n\n- Explain what a scope is and how the variables\
    \ are affected by it.\n- Write a simple program to illustrate the functionalities\
    \ of a:-\n    a) Simple Function\n    b) A Function with returnable value\n  \
    \  c) A function passed as a parameter (Argument)\n- Explain the concept of a\
    \ Self-Executing Anonymous Function and give an example.\n\n# Chapter Five\n\n\
    # Some prominent Features of JavaScript\n\nMany new programmers often get a little\
    \ bit disappointed when they hear people call JavaScript a language for kids.\
    \ Well, let me clear this up for you. First, JavaScript is hands down, one of\
    \ the strongest programming languages out there. It’s a popular skill required\
    \ for web development.\n\nThe beauty of JavaScript lies in its simple yet complex\
    \ presentation. It has been used for many years now by numerous developers. It\
    \ can add a fresh spin on their web pages, ranging from very subtle but important\
    \ features such as automatic image changers, to more intricate designs that enhance\
    \ their beauty.\n\nThe following are just a few of the features that help JavaScript\
    \ to stand out on its own in the crowd.\n\n### Integrated Browser Support\n\n\
    Right off the bat, the user friendly nature of JavaScript is very intriguing and\
    \ it attracts many new programmers and experts. Many web development languages\
    \ out there require installing a supplementary flash plugin in order to be allowed\
    \ to access flash content and work on the browser. The users of JavaScript are\
    \ mostly spared from this hassle as almost all the browsers have invariably accepted\
    \ JavaScript as their core scripting language. This allows them to deliver integrated\
    \ support for the language. In the most critical cases, the users will only need\
    \ to handle some particular tasks that rely on `DOM` with care, but other than\
    \ that, JavaScript is fully accessible and free to be used.\n\n### A Functional\
    \ and Flexible Programming Language\n\nFor programmers who prefer a lot of functions\
    \ in their programs, JavaScript isa a joy. This is because of the versatile manipulation\
    \ techniques incorporated within the language that allows the programmers to determine\
    \ the execution of a function. Two of the more prominent features of Java that\
    \ put it at the frontend offunctional programming is that it givesprogrammers\
    \ the freedom to assign a function to any variable, and make a function accept\
    \ another function using the arguments parameters. Such in-depth ability for customization\
    \ makes it so much more fun for programmers who like to have more freedom in programming.\n\
    \n### The ability to use JavaScript on both Client and Server Side\n\n![](images/00007.jpeg)\n\
    \nSince JavaScript has been officially recognized by the web-browsers as being\
    \ the prime development language for them, JavaScript has been given the administrative\
    \ privileges to have access to the document model objects of any browser. What\
    \ this does is that it gives the programmer another level of freedom. It allows\
    \ programmers to change the structure of the web pages on the fly. Not only that,\
    \ the language can also be used to add various interesting effects to the web\
    \ pages. And if you are working with Alfresco, then you are in luck! Because JavaScript\
    \ also allows web scripts to be created in Alfresco. This allows programmers to\
    \ add custom tasks to any Alfresco server very easily.\n\nWhen you combine all\
    \ of these together, JavaScript is truly a magnificent programming languageth\
    \ that is powerful yet easy to use.\n\n### Self-Conscious ability to detect browser\
    \ and OS\n\n![](images/00008.jpeg)\n\nSometimes when you are programming, you\
    \ might face some issues and need to write code that is dependent on the operating\
    \ system and web browser that you are using.\n\nJavaScript has been intelligently\
    \ designed to allow itself to be self-aware of the browser and OS which you are\
    \ using. This allows you to easily adjust the language in accordance with your\
    \ requirements to perform all the OS dependent actions with ease.\n\n### The Diverse\
    \ Support for Object Oriented Programming\n\nObject oriented programming is perhaps\
    \ the keystone of programming languages these days. Programmers often like to\
