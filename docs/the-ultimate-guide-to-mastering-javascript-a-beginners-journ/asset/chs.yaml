  \ 快速查表\n\n此快速查表包含了 JavaScript 语法和概念的快速参考指南。它的设计旨在帮助你在在使用 JavaScript 时轻松回忆重要信息。\n\
  \n### 变量与常量\n\n- `var`: 声明变量（可以重新赋值）。\n- `let`: 声明块作用域变量（可以重新赋值）。\n- `const`: 声明块作用域常量（不能重新赋值）。\n\
  \n```javascript\nlet myVar = 'Hello!';\nconst myConst = 42;\n```\n\n### 数据类型\n\n\
  - `String`: 字符序列。\n- `Number`: 数值（整数或浮点数）。\n- `Boolean`: 真或假。\n- `Object`: 键值对集合。\n\
  - `Array`: 有序值列表。\n- `Null`: 表示无值或对象的特殊值。\n- `Undefined`: 未被赋值的变量。\n\n```javascript\n\
  let myString = \"JavaScript\";\nlet myNumber = 100;\nlet myArray = [1, 2, 3];\n\
  let myObject = {name: \"John\", age: 30};\nlet myNull = null;\nlet myUndefined;\n\
  ```\n\n### 函数\n\n- 函数声明：\n```javascript\nfunction greet(name) {\n  return `Hello,\
  \ ${name}!`;\n}\n```\n- 函数表达式：\n```javascript\nconst greet = function(name) {\n\
  \  return `Hello, ${name}!`;\n};\n```\n- 箭头函数：\n```javascript\nconst greet = (name)\
  \ => `Hello, ${name}!`;\n```\n\n***\n\n## 附录 B：常见 JavaScript 错误与调试技巧\n\n编写 JavaScript\
  \ 代码时遇到错误是过程的一部分。附录涵盖了一些常见错误和调试技巧，帮助你排除故障。\n\n### 常见错误\n\n语法错误 (SyntaxError)：当代码语法出现错误时发生。\n\
  \n示例：\n```javascript\nlet name = \"John;\n```\n解决方案：确保所有引号都正确关闭。\n\n```javascript\n\
  let name = \"John\";\n```\n\n引用错误 (ReferenceError)：当尝试访问不存在或未声明的变量时发生。\n\n示例：\n\
  ```javascript\nconsole.log(nonExistentVariable);\n```\n解决方案：确保在在使用变量前已对其声明。\n\n\
  类型错误 (TypeError)：当你尝试对类型错误的变量执行操作时发生。\n\n示例：\n```javascript\nlet myNumber = 10;\n\
  myNumber.toUpperCase();\n```\n\n\n\n\n\n## 1. 解决方案：确保你调用了适用于数据类型的方法。\n\n`RangeError`：当值超出有效范围时发生此错误。\n\
  \n示例：\n```javascript\nlet myArray = [1, 2, 3];\nconsole.log(myArray[5]);\n```\n\n\
  ## 1. 解决方案：确保索引在数组范围内。\n\n### 调试技巧\n\n- 使用 `console.log()`：这是调试代码最简单且有效的方法。添加 `console.log()`\
  \ 语句来检查程序中不同位置变量的值。\n\n```javascript\nlet myNumber = 10;\nconsole.log(myNumber);\
  \ // 检查 myNumber 的值\n```\n\n- 使用**断点 (Breakpoints)**：如果你正在使用浏览开发者工具，可以在代码中设置断点。这允许你暂停代码执行并逐步检查变量。\n\
  \n- 使用 `debugger` 关键字：你也可以在代码中添加 `debugger` 关键字。这会在该处暂停执行并打开调试工具。\n\n```javascript\n\
  debugger;\n```\n\n- 2. 检查常见错误：如果你遇到似乎无法解决的问题，请检查常见的 JavaScript 错误，例如括号不匹配、漏掉分号或变量声明不正确。\n\
