    \ the object literal syntax or the `new Object()` syntax.\n\n#### Example: Creating\
    \ an Object Using Literal Syntax\n\n```javascript\nconst person = {\n  firstName:\
    \ \"John\",\n  lastName: \"Doe\",\n  age: 30,\n  greet: function() {\n    console.log(`Hello,\
    \ my name is ${this.firstName} ${this.lastName}`);\n  }\n};\n\nperson.greet();\
    \ // Output: Hello, my name is John Doe\n```\n\nIn this example, the `person`\
