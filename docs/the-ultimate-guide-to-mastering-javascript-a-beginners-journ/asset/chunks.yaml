    # ​Chapter 4: Working with the DOM (Document Object Model) in JavaScript


    ![image](d2d_images/chapter_title_below.png)


    The Document Object Model (DOM) is a powerful API that allows JavaScript to interact
    with and manipulate the content of HTML documents. It provides a structured way
    of representing a web page as a tree of objects. This chapter will focus on how
    to use JavaScript to access, manipulate, and modify the DOM in order to create
    dynamic, interactive web pages.


    * * *


    ## ​4.1 Understanding the DOM


    Before diving into manipulating the DOM, it’s important to understand what the
    DOM is and how it represents an HTML document. The DOM is a hierarchical model
    of the HTML elements on a web page. Each element is represented as a node, and
    the entire page is structured like a tree. For example, the root of the tree is
    the document, and each HTML tag (e.g., <html>, <body>, <div>, <p>) is a node in
    the tree.


    Here is an example of how a simple HTML document is represented in the DOM:


    html


    Copy code


    <!DOCTYPE html>


    <html>


    <head>


    <title>DOM Example</title>


    </head>


    <body>


    <div id="content">


    <h1>Welcome to JavaScript DOM!</h1>


    <p>This is an example of working with the DOM.</p>


    </div>


    </body>


    </html>


    In the DOM, this document would look like:


    less


    Copy code


    document


    ├── html


    ├── head


    │  └── title


    └── body


    └── div#content


    ├── h1


    └── p


    This hierarchical structure allows JavaScript to easily access and manipulate
    any element on the page by traversing the tree.


    * * *


    ## ​4.2 Accessing Elements in the DOM


    To manipulate elements in the DOM, you first need to access them. There are several
    methods available in JavaScript to select DOM elements, such as getElementById,
    getElementsByClassName, querySelector, and querySelectorAll.


    ### ​4.2.1 getElementById


    The getElementById method is used to select an element by its id attribute. It
    returns a single element, since IDs are expected to be unique within a page.


    javascript


    Copy code


    const element = document.getElementById("content");


    console.log(element); // Output: <div id="content">...</div>


    ### ​4.2.2 getElementsByClassName


    The getElementsByClassName method is used to select elements by their class name.
    It returns a live HTMLCollection of elements, meaning that if the DOM is updated
    (e.g., elements are added or removed), the collection will automatically update.


    javascript


    Copy code


    const paragraphs = document.getElementsByClassName("text");


    console.log(paragraphs); // Output: HTMLCollection of elements with class "text"


    ### ​4.2.3 querySelector and querySelectorAll


    The querySelector method allows you to select an element using a CSS selector.
    It returns the first matching element, while querySelectorAll returns all matching
    elements in a static NodeList.


    javascript


    Copy code


    const firstParagraph = document.querySelector("p");


    console.log(firstParagraph); // Output: <p>This is the first paragraph.</p>


    const allParagraphs = document.querySelectorAll("p");


    console.log(allParagraphs); // Output: NodeList of all <p> elements


    * * *


    ## ​4.3 Manipulating Elements in the DOM


    Once you have accessed an element, you can manipulate it in various ways, such
    as changing its content, styling, or attributes. JavaScript provides methods like
    innerHTML, textContent, style, and setAttribute for this purpose.


    ### ​4.3.1 Changing the Content


    To change the content of an element, you can use the innerHTML or textContent
    properties. While innerHTML allows you to set HTML content, textContent only modifies
    the text content of the element.


    javascript


    Copy code


    const title = document.querySelector("h1");


    title.textContent = "New Title"; // Changes the text content of the <h1>


    To add HTML content to an element, use innerHTML:


    javascript


    Copy code


    const content = document.getElementById("content");


    content.innerHTML = "<h2>Updated Content</h2><p>This is new content.</p>";


    ### ​4.3.2 Modifying Styles


    You can change the styles of an element using the style property, which allows
    you to modify inline CSS. Each CSS property can be set individually.


    javascript


    Copy code


    const paragraph = document.querySelector("p");


    paragraph.style.color = "blue"; // Changes the text color to blue


    paragraph.style.fontSize = "18px"; // Changes the font size to 18px


    ### ​4.3.3 Modifying Attributes


    The setAttribute method allows you to change the attributes of an element, such
    as the src of an image, the href of a link, or any other attribute.


    javascript


    Copy code


    const link = document.querySelector("a");


    link.setAttribute("href", "https://www.example.com");


    link.textContent = "Go to Example";


    You can also use getAttribute to retrieve the value of an attribute.


    javascript


    Copy code


    const srcValue = document.querySelector("img").getAttribute("src");


    console.log(srcValue); // Output: the current src value of the image


    * * *


    ## ​4.4 Creating and Removing Elements


    JavaScript allows you to dynamically create and remove elements in the DOM.


    ### ​4.4.1 Creating Elements


    To create a new element, you can use the createElement method. After creating
    the element, you can append it to an existing element using appendChild.


    javascript


    Copy code


    const newDiv = document.createElement("div");'
