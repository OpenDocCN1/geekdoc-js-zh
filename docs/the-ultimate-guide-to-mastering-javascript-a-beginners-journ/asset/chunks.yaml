    ## ​7.4 Async/Await


    Async/await is a more recent addition to JavaScript, introduced in ECMAScript
    2017\. It is built on top of promises and provides a cleaner, more intuitive way
    to handle asynchronous code.


    ●  Async: The async keyword is placed before a function to indicate that it returns
    a promise and contains asynchronous operations.


    ●  Await: The await keyword can only be used inside an async function. It pauses
    the execution of the function until the promise is resolved and returns the result.


    ### ​Example: Using Async/Await


    javascript


    Copy code


    async function fetchData() {


    const response = await new Promise(resolve => {


    setTimeout(() => resolve("Data fetched from API"), 2000);


    });


    console.log(response); // Output: Data fetched from API


    }


    fetchData();


    In this example, fetchData() is an asynchronous function. The await keyword waits
    for the promise to resolve before moving on to the next line of code.


    ### ​Handling Errors with Async/Await


    You can handle errors in asynchronous functions using try...catch blocks, making
    it easier to catch and handle exceptions.


    javascript


    Copy code


    async function fetchData() {


    try {


    const response = await new Promise((resolve, reject) => {


    setTimeout(() => reject("Error fetching data"), 2000);


    });


    console.log(response);


    } catch (error) {


    console.error(error); // Output: Error fetching data


    }


    }


    fetchData();


    This approach is much cleaner and easier to read than using .then() and .catch()
    with promises.


    * * *


    ## ​7.5 Combining Async/Await with Other Functions


    Async/await can be used in combination with other JavaScript functions, including
    setTimeout(), fetch(), and even in loops. This flexibility makes async/await one
    of the most powerful tools for managing asynchronous operations.


    ### ​Example: Using fetch() with Async/Await


    The fetch() API is commonly used for making network requests in JavaScript. It
    returns a promise that resolves to the response to the request.


    javascript


    Copy code


    async function getUserData() {


    try {


    const response = await fetch(''https://jsonplaceholder.typicode.com/users'');


    const data = await response.json();


    console.log(data);


    } catch (error) {


    console.error(error);


    }


    }


    getUserData();


    In this example, fetch() is used to retrieve user data from an API. The await
    keyword waits for the response, and then the .json() method is used to parse the
    response.


    ### ​Example: Using Async/Await in Loops


    You can also use async/await inside loops to handle asynchronous tasks sequentially.


    javascript


    Copy code


    async function fetchMultipleData() {


    const urls = [


    ''https://jsonplaceholder.typicode.com/posts'',


    ''https://jsonplaceholder.typicode.com/comments''


    ];


    for (let url of urls) {


    const response = await fetch(url);


    const data = await response.json();


    console.log(data);


    }


    }


    fetchMultipleData();


    In this case, the loop fetches data from multiple URLs sequentially, waiting for
    each request to complete before moving on to the next one.


    * * *


    ## ​7.6 Conclusion


    Asynchronous programming is a crucial aspect of JavaScript that allows you to
    handle operations that would otherwise block the execution of the program. By
    mastering callbacks, promises, and async/await, you can write more efficient and
    maintainable code.


    In this chapter, we learned about the event loop, callbacks, promises, and async/await.
    These tools and techniques are essential for building modern, non-blocking applications.
    Asynchronous programming will become a fundamental part of your JavaScript development
    journey, especially when working with APIs, databases, and any task that requires
    waiting for a result.


    In the next chapter, we will dive deeper into JavaScript''s error handling mechanisms
    and explore best practices for debugging and writing robust code.


    * * *


    ### ​Additional Notes:


    ●  Practice: To solidify your understanding of asynchronous JavaScript, try creating
    small projects that involve making network requests, handling multiple asynchronous
    operations, and using async/await for cleaner code.


    ●  Real-World Use Cases: Asynchronous JavaScript is often used in building applications
    that interact with external APIs, such as weather apps, social media platforms,
    or e-commerce sites. Try experimenting with the techniques learned in this chapter
    in such real-world scenarios.


