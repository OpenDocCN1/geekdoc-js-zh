    \ data\");\n      }\n    }, 2000);\n  });\n  console.log(data); // \"Data fetched\
    \ successfully\"\n}\n\nfetchData();\n```\n\nIn this example, the `fetchData` function\
    \ is marked as `async`, and the `await` keyword is used to wait for the `promise`\
    \ to resolve before logging the result. This makes the asynchronous code look\
    \ and behave more like synchronous code.\n\n***\n\n## 5.6 Handling Errors with\
    \ try and catch\n\nWhen using `async` and `await`, you can handle errors using\
    \ `try...catch` blocks, similar to how you handle errors in synchronous code.\
    \ If an error occurs while awaiting a promise, the execution will jump to the\
    \ `catch` block.\n\n### Example: Handling Errors with try and catch\n\n```javascript\n\
    async function fetchData() {\n  try {\n    const data = await new Promise((resolve,\
    \ reject) => {\n      setTimeout(() => {\n        const success = false;\n   \
    \     if (success) {\n          resolve(\"Data fetched successfully\");\n    \
    \    } else {\n          reject(\"Error fetching data\");\n        }\n      },\
    \ 2000);\n    });\n    console.log(data); // Won't be executed if an error occurs\n\
    \  } catch (error) {\n    console.log(error); // \"Error fetching data\"\n  }\n\
    }\n\nfetchData();\n```\n\nIn this example, the `promise` is rejected, and the\
    \ error message is caught in the `catch` block.\n\n***\n\n## 5.7 Working with\
    \ Multiple Promises\n\nJavaScript provides methods such as `Promise.all()` and\
    \ `Promise.race()` to handle multiple promises concurrently.\n\n### 5.7.1 Promise.all()\n\
    \n`Promise.all()` takes an array of promises and returns a new promise that resolves\
    \ when all the promises in the array have resolved. If any of the promises reject,\
    \ the entire promise will reject.\n\n```javascript\nconst promise1 = Promise.resolve(\"\
    Data 1\");\nconst promise2 = Promise.resolve(\"Data 2\");\nconst promise3 = Promise.resolve(\"\
    Data 3\");\nPromise.all([promise1, promise2, promise3])\n  .then((values) => {\n\
    \    console.log(values); // [\"Data 1\", \"Data 2\", \"Data 3\"]\n  })\n  .catch((error)\
    \ => {\n    console.log(error);\n  });\n```\n\n### 5.7.2 Promise.race()\n\n`Promise.race()`\
    \ takes an array of promises and returns a new promise that resolves or rejects\
    \ as soon as one of the promises resolves or rejects.\n\n```javascript\nconst\
    \ promise1 = new Promise((resolve) => setTimeout(resolve, 1000, \"Data 1\");\n\
    const promise2 = new Promise((resolve) => setTimeout(resolve, 500, \"Data 2\"\
    ));\nPromise.race([promise1, promise2])\n  .then((value) => {\n    console.log(value);\
    \ // \"Data 2\"\n  })\n  .catch((error) => {\n    console.log(error);\n  });\n\
    ```\n\nIn this example, the second promise resolves first, so the result of `Promise.race()`\
    \ is \"Data 2\".\n\n***\n\n## 5.8 Conclusion\n\nIn this chapter, we covered the\
    \ fundamentals of asynchronous programming in JavaScript, including the use of\
    \ callbacks, promises, and the `async/await` syntax. By mastering these techniques,\
    \ you can write more efficient and responsive code that can handle time-consuming\
    \ tasks without blocking the main program flow.\n\nAsynchronous programming is\
    \ a critical skill for modern web development, especially when working with APIs,\
    \ fetching data from servers, or handling multiple operations simultaneously.\
    \ In the next chapter, we will explore advanced JavaScript features such as closures,\
    \ higher-order functions, and the powerful concept of functional programming.\n\
