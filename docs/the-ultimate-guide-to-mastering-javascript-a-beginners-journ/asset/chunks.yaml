    2.  Save it as index.html.


    3.  Add the following basic structure:


    html


    Copy code


    <!DOCTYPE html>


    <html lang="en">


    <head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>My First JavaScript Page</title>


    </head>


    <body>


    <h1>Hello, JavaScript!</h1>


    <script>


    // Your JavaScript code will go here


    console.log("Hello from JavaScript!");


    </script>


    </body>


    </html>


    The <script> tag is where you’ll write your JavaScript code. The console.log()
    function is one of the most basic commands in JavaScript—it prints messages to
    the browser’s console. To see it in action, simply open your index.html file in
    any modern web browser (like Chrome or Firefox) and open the browser’s developer
    tools (usually by pressing F12). You’ll see the message “Hello from JavaScript!”
    printed in the console.


    * * *


    ## ​1.2 Basic JavaScript Syntax and Structure


    Now that you''ve set up your environment, let’s dive into the basics of JavaScript
    syntax. Understanding JavaScript’s structure is essential before you can start
    writing your own code.


    ### ​1.2.1 Variables


    In JavaScript, variables are used to store data values. You can think of variables
    as containers that hold different types of data. There are three ways to declare
    a variable:


    ●  var: An older method of declaring variables (not commonly used in modern JavaScript).


    ●  let: A more modern way to declare variables that allows for block-scoped variables.


    ●  const: Used to declare variables that cannot be reassigned once set.


    Here’s how you can declare a variable:


    javascript


    Copy code


    let myVariable = 10;


    const myConstant = "Hello!";


    ### ​1.2.2 Data Types


    JavaScript supports several types of data. The most common ones are:


    ●  Number: Represents numeric values.


    ●  String: Represents text.


    ●  Boolean: Represents true or false values.


    ●  Object: Used to store collections of data in key-value pairs.


    ●  Array: An ordered collection of values.


    ●  null: Represents the absence of value.


    ●  undefined: Represents a variable that hasn’t been assigned a value.


    For example:


    javascript


    Copy code


    let age = 25; // Number


    let name = "John"; // String


    let isActive = true; // Boolean


    let user = { name: "John", age: 25 }; // Object


    let colors = ["red", "green", "blue"]; // Array


    ## ​1.3 Operators in JavaScript


    Operators are used to perform operations on variables and values. In JavaScript,
    there are several types of operators:


    ### ​1.3.1 Arithmetic Operators


    These operators are used to perform mathematical calculations. The basic arithmetic
    operators include:


    ●  + (Addition): Adds two values together.


    ●  - (Subtraction): Subtracts one value from another.


    ●  * (Multiplication): Multiplies two values.


    ●  / (Division): Divides one value by another.'
