    \ // Output: 35\n```\n\nYou can also add new properties to an object:\n\n```javascript\n\
    person.country = \"USA\";\nconsole.log(person.country); // Output: USA\n```\n\n\
    ### 2.3.4 Iterating Through Objects\n\nYou can iterate through an object’s properties\
    \ using a `for...in` loop:\n\n```javascript\nfor (let key in person) {\n  console.log(key\
    \ + \": \" + person[key]);\n}\n```\n\nThis loop will output each key-value pair\
    \ of the `person` object.\n\n***\n\n## 2.4 Conclusion\n\nIn this chapter, we’ve\
    \ covered some important concepts in JavaScript: loops, arrays, and objects. Loops\
