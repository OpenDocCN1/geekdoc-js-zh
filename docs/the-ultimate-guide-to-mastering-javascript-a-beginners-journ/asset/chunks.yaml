    ## 1.4 控制流：条件语句\n\n条件语句允许你根据特定条件执行某些代码块。在 JavaScript 中，有几种类型的条件语句：\n\n### 1.4.1\
    \ If-Else 语句\n\n`if` 语句评估一个条件，如果条件为真，则执行相应的代码块。如果条件为假，则可以使用 `else` 语句执行另一块代码。\n\
    \n```javascript\nlet age = 18;\nif (age >= 18) {\n  console.log(\"You are an adult.\"\
