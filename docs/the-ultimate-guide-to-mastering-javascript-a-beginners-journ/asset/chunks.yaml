    ## 8.3 Making POST Requests


    While `fetch()` is commonly used to retrieve data (GET requests), it can also
    be used to send data to the server. To do this, you need to specify the request
    method and include the data in the body of the request.


    ### Example: Sending Data with a POST Request


    ```javascript

    const data = {


    title: ''New Post'',


    body: ''This is the content of the post.'',


    userId: 11};


    fetch(''https://jsonplaceholder.typicode.com/posts'', {


    method: ''POST'',


    headers: {


    ''Content-Type'': ''application/json''


    },


    body: JSON.stringify(data)


    })

    .then(response => response.json())


    .then(data => console.log(''Post created:'', data))

    .catch(error => console.error(''Error:'', error));

    ```


    In this example, we send a POST request to create a new post. The data is included
    in the body of the request, and we specify that the content type is JSON. The
    server will respond with the created post, which we log to the console.


    ***


    ## 8.4 Handling Errors in API Requests


    When working with APIs, errors can occur for many reasons, such as network issues,
    invalid requests, or server errors. To handle these errors gracefully, you should
    always include error handling in your code.


    ### Example: Handling Network Errors


    ```javascript

    fetch(''https://jsonplaceholder.typicode.com/posts'')


    .then(response => {


    if (!response.ok) {


    throw new Error(`HTTP error! Status: ${response.status}`);


    }


    return response.json();


    })

    .then(data => console.log(data))


    .catch(error => console.error(''Error:'', error));

    ```


    In this example, we catch any errors that occur during the `fetch` operation,
    whether they are network errors or HTTP errors, and display the error message
    in the console.


    ***


    ## 8.5 Working with JSON


    APIs commonly send and receive data in JSON (JavaScript Object Notation) format.
    JSON is a lightweight data format that is easy to read and write for both humans
    and machines. When you fetch data from an API, you often need to parse the JSON
    response and work with the resulting JavaScript object.


    ### Example: Parsing JSON Data


    ```javascript

    fetch(''https://jsonplaceholder.typicode.com/posts'')


    .then(response => response.json()) // Parse the JSON response


    .then(data => {


    data.forEach(post => {


    console.log(post.title);


    });


    })


    .catch(error => console.error(''Error:'', error));

    ```


    In this example, we use the `.json()` method to parse the response as JSON and
    then loop through the data to print the title of each post.


    ***


    ## 8.6 Using async/await with fetch()


    The `async/await` syntax can be used with `fetch()` to make asynchronous code
    look more like synchronous code, making it easier to read and maintain. The `await`
    keyword pauses the execution of the code until the promise is resolved.


    ### Example: Using async/await with fetch()


    ```javascript

    async function getPosts() {


    try {


    const response = await fetch(''https://jsonplaceholder.typicode.com/posts'');


    if (!response.ok) {


    throw new Error(''Network response was not ok'');


    }


    const data = await response.json();


    console.log(data);


    } catch (error) {


    console.error(''There was a problem with the fetch operation:'', error);


    }


    }


    getPosts();

    ```


    In this example, we use `async/await` to handle the `fetch` request. The `await`
    keyword is used to wait for the `fetch()` promise to resolve, and then we handle
    the response as a JSON object.


    ***


    ## 8.7 Making API Calls in Loops


    Sometimes you need to make multiple API requests, such as when fetching data for
    multiple resources. You can use loops to make multiple `fetch` calls, and `async/await`
    helps ensure that each request completes before moving on to the next one.


    ### Example: Fetching Multiple Resources


    ```javascript

    async function getMultiplePosts() {


    const postIds = [1, 2, 3, 4, 5];


    for (let id of postIds) {


    const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`);


    const post = await response.json();


    console.log(post.title);


    }


    }


    getMultiplePosts();

    ```


    In this example, we use a `for...of` loop to iterate through an array of `postIds`.
    For each `id`, we make an API request to fetch a specific post.


    ***


