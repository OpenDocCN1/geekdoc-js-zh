    console.log(fruits); // [\"apple\", \"banana\", \"cherry\"]\n```\n\n`shift()`\
    \ – 从数组中移除第一个元素。\n\n```javascript\nfruits.shift();\nconsole.log(fruits); // [\"\
    banana\", \"cherry\"]\n```\n\n`unshift()` – 向数组开头添加一个元素。\n\n```javascript\nfruits.unshift(\"\
    grape\");\nconsole.log(fruits); // [\"grape\", \"banana\", \"cherry\"]\n```\n\n\
    `length` – 返回数组中的元素个数。\n\n```javascript\nconsole.log(fruits.length); // 3\n```\n\
    \n### 2.2.3 遍历数组\n\n你可以使用循环来遍历数组的元素。以下是使用 `for` 循环遍历数组的方法：\n\n```javascript\n\
    let colors = [\"red\", \"green\", \"blue\"];\nfor (let i = 0; i < colors.length;\
    \ i++) {\n  console.log(colors[i]);\n}\n```\n\n或者，你也可以使用 `forEach()` 方法，这是一种更清晰、简洁的遍历数组的方式：\n\
    \n```javascript\ncolors.forEach(function(color) {\n  console.log(color);\n});\n\
    ```\n\n***\n\n## 2.3 JavaScript 中的对象\n\n对象是键值对的集合，其中每个键（也称为属性）都与一个值相关。你可以在对象中存储多种数据类型，包括字符串、数字、数组甚至其他对象。\n\
    \n### 2.3.1 创建对象\n\n你可以使用大括号 `{}` 创建对象，并用逗号隔开属性。这里是一个示例：\n\n```javascript\nlet\
    \ person = {\n  name: \"John\",\n  age: 30,\n  city: \"New York\"\n};\n```\n\n\
    在这个示例中，`person` 是一个具有三个属性的对象：`name`、`age` 和 `city`。\n\n### 2.3.2 访问对象属性\n\n你可以使用点符号或方括号符号来访问对象的属性。这里是两种方法的示例：\n\
    \n```javascript\nconsole.log(person.name); // 输出: John\nconsole.log(person[\"\
    age\"]); // 输出: 30\n```\n\n访问属性时通常优先使用点符号，但如果属性名包含空格或特殊字符，或者存储在变量中，则方括号符号会很有用。\n\
    \n### 2.3.3 修改对象属性\n\n你可以通过简单地给属性分配新值来修改对象的现有属性：\n\n```javascript\nperson.age\
    \ = 35;\nconsole.log(person.age); // 输出: 35\n```\n\n你还可以向对象添加新属性：\n\n```javascript\n\
    person.country = \"USA\";\nconsole.log(person.country); // 输出: USA\n```\n\n###\
    \ 2.3.4 遍历对象\n\n你可以使用 `for...in` 循环来遍历对象的属性：\n\n```javascript\nfor (let key in\
    \ person) {\n  console.log(key + \": \" + person[key]);\n}\n```\n\n该循环将输出 `person`\
    \ 对象的每个键值对。\n\n***\n\n## 2.4 总结\n\n在本章中，我们涵盖了 JavaScript 中一些重要的概念：循环、数组和对象。循环允许你高效地重复代码，数组允许你存储和操作数据集合，而对象则提供了一种以键值对组织数据的方式。\n\
    \n理解这些概念将使你能够构建更复杂动态的应用程序。在下一章中，我们将深入探讨更高级的主题，如事件处理、DOM 操作和异步编程。\n\n# 第 3 章：高级\
    \ JavaScript 概念：函数、作用域和闭包\n\n在本章中，我们将深入探讨掌握该语言至关重要的高级 JavaScript 主题：函数、作用域和闭包。这些概念对于编写模块化、高效且可维护的\
