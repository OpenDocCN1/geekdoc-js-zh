    \ `greet()` 来执行它。\n\n### 3.1.2 命名函数与匿名函数\n\n函数可以是命名的，也可以是匿名的。命名函数有一个名称，有助于调试和跟踪函数，而匿名函数没有名称，通常用作高阶函数的参数。\n\
    \n命名函数的示例：\n\n```javascript\nfunction multiply(a, b) {\n  return a * b;\n}\n```\n\
    \n匿名函数的示例：\n\n```javascript\nconst multiply = function(a, b) {\n  return a * b;\n\
    };\n```\n\n### 3.1.3 高阶函数\n\n高阶函数是指接受一个或多个函数作为参数或返回函数的函数。这些通常用于函数式编程范式，是 JavaScript\
