    在这个示例中，我们使用 `for...of` 循环来遍历 `postIds` 数组。对于每个 `id`，我们发起 API 请求来获取特定的帖子。


    ***


    ## 8.8 结论


    在本章中，我们探索了如何使用 JavaScript 中的 `fetch()` 函数与 API 交互。我们涵盖了发送 GET 和 POST 请求的基础、处理响应、处理
    JSON 数据以及处理错误。我们还介绍了 `async/await` 语法，它简化了异步代码的处理。


    API 是现代 Web 应用的关键组件，实现了动态内容以及与第三方服务的交互。通过本章获得的知识，你可以开始将 API 集成到你自己的项目中，允许你构建更具动态和交互性的
    Web 应用。


    在下一章中，我们将讨论优化 JavaScript 代码和提高性能的高级技术，包括处理大型数据集和优化请求的提示。


