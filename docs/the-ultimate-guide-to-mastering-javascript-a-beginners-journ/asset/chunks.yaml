    \     if (success) {\n          resolve(\"Data fetched successfully\");\n    \
    \    } else {\n          reject(\"Error fetching data\");\n        }\n      },\
    \ 2000);\n    });\n    console.log(data); // 如果发生错误，此处不会执行\n  } catch (error)\
    \ {\n    console.log(error); // \"Error fetching data\"\n  }\n}\n\nfetchData();\n\
    ```\n\n在这个示例中，`promise` 被拒绝（rejected），错误消息在 `catch` 块中被捕获。\n\n***\n\n## 5.7 处理多个\
    \ Promise\n\nJavaScript 提供了 `Promise.all()` 和 `Promise.race()` 等方法来并发处理多个 promise。\n\
    \n### 5.7.1 Promise.all()\n\n`Promise.all()` 接收一个 promise 数组并返回一个新的 promise，当数组中的所有\
    \ promise 都解析后，该 promise 就会解析。如果任何一个 promise 被拒绝，整个 promise 都将被拒绝。\n\n```javascript\n\
    const promise1 = Promise.resolve(\"Data 1\");\nconst promise2 = Promise.resolve(\"\
    Data 2\");\nconst promise3 = Promise.resolve(\"Data 3\");\nPromise.all([promise1,\
    \ promise2, promise3])\n  .then((values) => {\n    console.log(values); // [\"\
    Data 1\", \"Data 2\", \"Data 3\"]\n  })\n  .catch((error) => {\n    console.log(error);\n\
    \  });\n```\n\n### 5.7.2 Promise.race()\n\n`Promise.race()` 接收一个 promise 数组并返回一个新的\
    \ promise，一旦其中任何一个 promise 解析或拒绝，该 promise 就会立即解析或拒绝。\n\n```javascript\nconst\
    \ promise1 = new Promise((resolve) => setTimeout(resolve, 1000, \"Data 1\");\n\
    const promise2 = new Promise((resolve) => setTimeout(resolve, 500, \"Data 2\"\
    ));\nPromise.race([promise1, promise2])\n  .then((value) => {\n    console.log(value);\
    \ // \"Data 2\"\n  })\n  .catch((error) => {\n    console.log(error);\n  });\n\
    ```\n\n在这个示例中，第二个 promise 先解析，因此 `Promise.race()` 的结果是 \"Data 2\"。\n\n***\n\n\
    ## 5.8 结论\n\n在本章中，我们涵盖了 JavaScript 异步编程的基础，包括回调函数（callbacks）、promises 以及 `async/await`\
    \ 语法的使用。通过掌握这些技术，你可以编写出更高效、响应更快的代码，能够处理耗时任务而不会阻塞主程序流。\n\n异步编程是现代 Web 开发的一项关键技能，特别是在处理\
    \ API、从服务器获取数据或同时处理多个操作时。在下一章中，我们将探索 JavaScript 的高级特性，例如闭包、高阶函数以及函数编程的强大概念。\n\n\
    # 第 6 章：面向对象的 JavaScript (OOP)\n\n面向对象编程 (OOP) 是一种广泛应用于 JavaScript 和许多其他语言的编程范式。在本章中，我们将探索\
    \ JavaScript 中 OOP 的核心概念，如对象、类、继承和封装，以及如何应用它们来构建高效且可重用的代码。\n\n***\n\n## 6.1 什么是面向对象编程？\n\
    \n面向对象编程是一种使用“对象”来表示数据以及操作这些数据的方法编程方法。OOP 的主要目标是在代码中对现实世界的实体建模，使得设计和维护复杂的软件系统变得更容易。\n\
    \nOOP 的核心原则包括：\n\n1. **封装**：将数据和操作该数据的方法封装在单个单元（`class`）中。\n2. **抽象**：隐藏复杂的实现细节，只向用户展示必要的部分。\n\
    3. **继承**：基于现有类创建新类的能力，并继承其属性和方法。\n4. **多态**：使用单一接口表示不同类型对象的能力。\n\n***\n\n## 6.2\
    \ 理解 JavaScript 中的对象\n\n在 JavaScript 中，对象是键值对的集合，其中每个键（key）都是字符串（或 `Symbol`），值（value）可以是任何有效的\
    \ JavaScript 数据类型，包括函数（通常称为方法）。\n\n### 创建对象\n\n你可以使用对象字面量语法或 `new Object()` 语法来创建对象。\n\
    \n#### 示例：使用字面量语法创建对象\n\n```javascript\nconst person = {\n  firstName: \"John\"\
    ,\n  lastName: \"Doe\",\n  age: 30,\n  greet: function() {\n    console.log(`Hello,\
    \ my name is ${this.firstName + \" \" + this.lastName}.`);\n  }\n};\n\nperson.greet();\
    \ // 输出: Hello, my name is John Doe.\n```\n\n在这个示例中，`person` 对象包含了 `firstName`、`lastName`\
    \ 以及一个可以打印问候信息的 `greet` 方法。\n\n***\n\n## 6.3 在 JavaScript 中使用类\n\n类是创建对象的蓝图，提供了定义属性的方法的方法。JavaScript\
    \ 类是在 ECMAScript 6 (ES6) 中引入的，与构造函数相比，它是处理对象的更现代的方式。\n\n### 定义类\n\n你可以使用 `class`\
    \ 关键字定义类，后面跟着类名以及包含构造方法和其他方法的代码块。\n\n#### 示例：定义类\n\n```javascript\nclass Person\
    \ {\n  constructor(firstName, lastName, age) {\n    this.firstName = firstName;\n\
    \    this.lastName = lastName;\n    this.age = age;\n  }\n  greet() {\n    console.log(`Hello,\
    \ my name is ${this.firstName + \" \" + this.lastName}.`);\n  }\n}\n\nconst john\
    \ = new Person(\"John\", \"Doe\", 30);\njohn.greet(); // 输出: Hello, my name is\
    \ John Doe.\n```\n\n在这个示例中，`Person` 类有一个构造方法来初始化对象属性，以及一个 `greet()` 方法。使用 `new`\
    \ 关键字来创建 `Person` 类的实例。\n\n***\n\n## 6.4 JavaScript 中的继承\n\n继承允许类从另一个类继承属性和方法。这有助于代码复用和更层次化的对象组织。\n\
    \n### 创建子类\n\n你可以通过 `extends` 关键字创建子类，它允许一个类从另一个类继承。\n\n#### 示例：JavaScript 中的继承\n\
    \n```javascript\nclass Animal {\n  constructor(name) {\n    this.name = name;\n\
    \  }\n  speak() {\n    console.log(`${this.name} makes a sound.`);\n  }\n}\n\n\
    class Dog extends Animal {\n  constructor(name, breed) {\n    super(name); //\
    \ 调用父类的构造函数\n    this.breed = breed;\n  }\n  speak() {\n    console.log(`${this.name}\
    \ barks.`);\n  }\n}\n\nconst dog = new Dog(\"Buddy\", \"Golden Retriever\");\n\
    dog.speak(); // 输出: Buddy barks.\n```\n\n在这个示例中，`Dog` 类扩展了 `Animal` 类，继承了它的属性和方法。`super()`\
    \ 函数用于调用父类的构造函数，并且 `speak()` 方法被重写以为狗狗提供更具体的实现。\n\n***\n\n## 6.5 封装与私有属性\n\n"
