    \ of the work week!\");\n    break;\n  default:\n    console.log(\"It's just another\
    \ day.\");\n}\n```\n\n***\n\n## 1.5 JavaScript 中的函数\n\n函数是执行特定任务的可重用代码块。函数可以接收参数（输入）并返回一个值（输出）。\n\
    \n### 1.5.1 定义函数\n\n你可以使用 `function` 关键字定义函数，后面跟上函数名称、参数以及在调用函数时将执行的代码块。\n\n```javascript\n\
    function greet(name) {\n  console.log(\"Hello, \" + name + \"!\");\n}\ngreet(\"\
    John\"); // 输出: Hello, John!\n```\n\n### 1.5.2 函数返回值\n\n函数可以使用 `return` 关键字返回一个值。该值随后可以在程序的其他地方使用。\n\
    \n```javascript\nfunction add(a, b) {\n  return a + b;\n}\nlet result = add(5,\
    \ 3); // result = 8\n```\n\n### 1.5.3 箭头函数\n\n在现代 JavaScript 中，你可以使用箭头函数定义更短的函数。这种语法更简洁，但行为与普通函数相似。\n\
    \n```javascript\nconst multiply = (a, b) => a * b;\nlet result = multiply(4, 3);\
    \ // result = 12\n```\n\n***\n\n## 1.6 总结\n\n在本章中，你学习了如何设置开发环境，理解了 JavaScript\
    \ 语法的基础，并探索了变量、数据类型、运算符和控制流等基本概念。你还学习了如何在 JavaScript 中定义和使用函数。\n\n在你继续 JavaScript\
    \ 编程之旅的过程中，这些基础知识将为更复杂的话提供基础。在下一章中，我们将深入探讨。\n\n第 2 章：循环、数组和对象\n\n在本章中，我们将探索重要的概念：循环、数组和对象。\n\
    \n## 2.1 循环\n\n循环允许你多次执行代码块。JavaScript 提供了几种类型的循环：\n\n### 2.1.1 for 循环\n\n`for`\
    \ 循环是用于遍历数据的最常用方式之一。这是 `for` 循环的基本语法：\n\n```javascript\nfor (let i = 0; i < 5;\
    \ i++) {\n  console.log(i);\n}\n```\n\n在此示例中，循环将运行五次，打印 0 到 4。for 循环由三部分组成：\n\
    - 初始化：`let i = 0` —— 设置循环的起点。\n- 条件：`i < 5` —— 决定循环何时停止。\n- 递增：`i++` —— 迭代后更新变量\
    \ `i`。\n\n### 2.1.2 while 循环\n\n`while` 循环用于在条件为真时重复代码。与 `for` 循环不同，`while` 循环没有固定的迭代次数——它会持续直到条件为假。这是\
    \ `while` 循环的语法：\n\n```javascript\nlet i = 0;\nwhile (i < 5) {\n  console.log(i);\n\
    \  i++;\n}\n```\n\n此示例的结果与 `for` 循环相同，打印 0 到 4。关键区别在于循环条件在每次迭代之前进行检查。\n\n### 2.1.3\
    \ do-while 循环\n\n`do-while` 循环与 `while` 循环相似，但有一个关键区别：循环内部的代码在检查条件之前至少执行一次。当你需要确保循环无论如何都至少运行一次时，这非常有用。这是一个\
    \ `do-while` 循环的示例：\n\n```javascript\nlet i = 0;\ndo {\n  console.log(i);\n  i++;\n\
    } while (i < 5);\n```\n\n在这种情况下，循环也会打印 0 到 4，但它保证即使初始条件为假，代码也会执行一次。\n\n***\n\n\
    ## 2.2 JavaScript 中的数组\n\n数组用于在变量中存储多个值。它可以包含不同类型的数据，对于处理相似项目的集合非常有用。\n\n### 2.2.1\
