    the function is executed outside of that scope, it can still access the variables
    it was originally declared with.


    javascript


    Copy code


    function outer() {


    let outerVar = "I am from the outer function";


    return function inner() {


    console.log(outerVar); // Accessing outer function''s variable


    };


    }


    const closureFunc = outer();


    closureFunc(); // Output: I am from the outer function


    In the example above, the inner function is able to access the variable outerVar
    from the outer function, even though the outer function has already completed
    execution. This is the essence of closures in JavaScript.


