    ## ​3.1 Functions in Detail


    Functions are one of the most important aspects of JavaScript programming. They
    allow you to encapsulate logic and reuse code in a more organized way. In this
    section, we will explore how to define, invoke, and work with functions in more
    depth.


    ### ​3.1.1 Function Expressions


    In addition to function declarations, JavaScript allows you to define functions
    as expressions. A function expression is a function that is assigned to a variable.
    Here’s an example:


    javascript


    Copy code


    const greet = function(name) {


    console.log("Hello, " + name + "!");


    };


    greet("Alice"); // Output: Hello, Alice!


    Notice that the function is assigned to the variable greet, and it can be invoked
    by calling greet().


    ### ​3.1.2 Named vs. Anonymous Functions


    Functions can either be named or anonymous. A named function has a name that helps
    in debugging and tracing the function, while an anonymous function does not have
    a name and is typically used as an argument for higher-order functions.


    Example of a named function:


    javascript


    Copy code


    function multiply(a, b) {


    return a * b;


    }


    Example of an anonymous function:


    javascript


    Copy code


    const multiply = function(a, b) {


    return a * b;


    };


    ### ​3.1.3 Higher-Order Functions


    Higher-order functions are functions that take one or more functions as arguments
    or return a function as a result. These functions are commonly used in functional
    programming paradigms and are a core feature of JavaScript.


    Example:


    javascript


    Copy code


    function applyOperation(a, b, operation) {


    return operation(a, b);


    }


    console.log(applyOperation(5, 3, function(x, y) {


    return x + y; // Adding


    })); // Output: 8


    In the above example, applyOperation is a higher-order function because it takes
    another function as its argument.


    * * *


    ## ​3.2 Scope in JavaScript


    Scope refers to the context in which a variable is declared and the rules that
    determine where that variable can be accessed. JavaScript has two types of scope:
    global scope and local scope.


    ### ​3.2.1 Global Scope


    A variable that is declared outside of any function has global scope. This means
    it can be accessed from anywhere in the code.


    javascript


    Copy code


    let globalVar = "I am a global variable";


    function showGlobalVar() {


    console.log(globalVar); // Can access the global variable


    }


    showGlobalVar(); // Output: I am a global variable


    ### ​3.2.2 Local Scope


    A variable declared inside a function is local to that function and cannot be
    accessed outside of it. This is known as local scope.


    javascript


    Copy code


    function myFunction() {


    let localVar = "I am a local variable";


    console.log(localVar); // Can access the local variable


    }


    myFunction(); // Output: I am a local variable


    console.log(localVar); // Error: localVar is not defined


    ### ​3.2.3 Block Scope


    JavaScript introduced block-scoped variables with the let and const keywords.
    Variables declared inside a block (a pair of curly braces {}) are not accessible
    outside the block.


    javascript


    Copy code


    if (true) {


    let blockScopedVar = "I am block-scoped";


    console.log(blockScopedVar); // Output: I am block-scoped


    }


    console.log(blockScopedVar); // Error: blockScopedVar is not defined


    This is different from variables declared with var, which do not have block scope
    but have function scope.


    * * *


    ## ​3.3 Closures in JavaScript


    A closure is a function that "remembers" its lexical scope, even when the function
    is executed outside of that scope. This powerful feature allows functions to have
    access to variables even after the outer function has finished execution.


