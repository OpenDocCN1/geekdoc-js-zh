    \  return operation(a, b);\n}\nconsole.log(applyOperation(5, 3, function(x, y)\
    \ {\n  return x + y; // 输出: 8}));\n```\n\n在上面的示例中，`applyOperation` 是一个高阶函数，因为它接收另一个函数。\n\
    \n***\n\n## 3.2 JavaScript 中的作用域\n\n作用域是指变量定义的上下文以及决定可以在哪里访问它的规则。JavaScript 有两种作用域：全局作用域和局部作用域。\n\
    \n### 3.2.1 全局作用域\n\n在函数外部定义的变量具有全局作用域。这意味着可以在代码的任何地方访问。\n\n```javascript\nlet\
    \ globalVar = \"I am a global variable\";\nfunction showGlobalVar() {\n  console.log(globalVar);\
    \ // 可以访问全局变量\n}\nshowGlobalVar(); // 输出: I am a global variable\n```\n\n### 3.2.2\
    \ 局部作用域\n\n在函数内部定义的变量属于该函数，无法在外部访问。这被称为局部作用域。\n\n```javascript\nfunction myFunction()\
    \ {\n  let localVar = \"I am a local variable\";\n  console.log(localVar); //\
    \ 可以访问局部变量\n}\nmyFunction(); // 输出: I am a local variable\nconsole.log(localVar);\
    \ // 错误: localVar is not defined\n```\n\n### 3.2.3 块作用域\n\nJavaScript 使用 `let`\
    \ 和 `const` 关键字引入了块作用域变量。在块（一对大括号 `{}`）内部定义的变量在块外部不可用。\n\n```javascript\nif (true)\
    \ {\n  let blockScopedVar = \"I am block-scoped\";\n  console.log(blockScopedVar);\
    \ // 输出: I am block-scoped\n}\nconsole.log(blockScopedVar); // 错误: blockScopedVar\
    \ is not defined\n```\n\n这与使用 `var` 定义的不同，`var` 没有块作用域，而是具有函数作用域。\n\n***\n\n##\
    \ 3.3 JavaScript 中的闭包\n\n闭包是一个“记住”其词法作用域的函数，即使该函数是在该作用域之外执行的。这一强大功能允许函数在外部函数执行完毕后仍访问其变量。\n\
    \n### 3.3.1 理解闭包\n"
