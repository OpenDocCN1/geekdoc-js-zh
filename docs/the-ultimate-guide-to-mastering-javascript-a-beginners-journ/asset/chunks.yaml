    \ 0 开始）来访问数组的单个元素。\n\n```javascript\nconsole.log(fruits[0]); // 输出: apple\nconsole.log(fruits[1]);\
    \ // 输出: banana\n```\n\n### 2.2.2 数组方法\n\n"
