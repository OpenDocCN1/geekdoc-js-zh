    # ​Chapter 6: Object-Oriented JavaScript (OOP)


    ![image](d2d_images/chapter_title_below.png)


    Object-Oriented Programming (OOP) is a programming paradigm that is widely used
    in JavaScript and many other languages. In this chapter, we will explore the core
    concepts of OOP in JavaScript, such as objects, classes, inheritance, and encapsulation,
    and how they can be applied to build efficient and reusable code.


    * * *


    ## ​6.1 What is Object-Oriented Programming?


    Object-Oriented Programming is a programming methodology that uses "objects" to
    represent data and the methods that operate on that data. The primary goal of
    OOP is to model real-world entities in the code, making it easier to design and
    maintain complex software systems.


    The core principles of OOP include:


    1.  Encapsulation: The bundling of data and methods that operate on that data
    within a single unit (class).


    2.  Abstraction: Hiding complex implementation details and showing only the necessary
    parts to the user.


    3.  Inheritance: The ability to create new classes based on existing ones, inheriting
    properties and methods.


    4.  Polymorphism: The ability to use a single interface to represent different
    types of objects.


    * * *


    ## ​6.2 Understanding Objects in JavaScript


    In JavaScript, objects are collections of key-value pairs, where each key is a
    string (or Symbol) and the value can be any valid JavaScript data type, including
    functions, which are often referred to as methods.


    ### ​Creating an Object


    You can create an object using either the object literal syntax or the new Object()
    syntax.


    #### ​Example: Creating an Object Using Literal Syntax


    javascript


    Copy code


    const person = {


    firstName: "John",


    lastName: "Doe",


    age: 30,


    greet: function() {


    console.log(`Hello, my name is ${this.firstName} ${this.lastName}`);


    }


    };


    person.greet(); // Output: Hello, my name is John Doe


    In this example, the person object contains properties like firstName, lastName,
    and age, as well as a method greet() that logs a greeting message.


    * * *


    ## ​6.3 Working with Classes in JavaScript


    Classes are a blueprint for creating objects, providing a way to define properties
    and methods. JavaScript classes were introduced in ECMAScript 6 (ES6) and are
    a more modern way of working with objects compared to traditional constructor
    functions.


    ### ​Defining a Class


    You can define a class using the class keyword, followed by the class name and
    a block containing the constructor method and other methods.


    #### ​Example: Defining a Class


    javascript


    Copy code


    class Person {


    constructor(firstName, lastName, age) {


    this.firstName = firstName;


    this.lastName = lastName;


    this.age = age;


    }


    greet() {


    console.log(`Hello, my name is ${this.firstName} ${this.lastName}`);


    }


    }


    const john = new Person("John", "Doe", 30);


    john.greet(); // Output: Hello, my name is John Doe


    In this example, the Person class has a constructor method to initialize the object
    properties and a greet() method to display the greeting. The new keyword is used
    to create instances of the Person class.


    * * *


    ## ​6.4 Inheritance in JavaScript


    Inheritance allows one class to inherit properties and methods from another class.
    This allows for code reuse and a more hierarchical organization of objects.


    ### ​Creating a Subclass


    You can create a subclass by using the extends keyword, which allows a class to
    inherit from another class.


    #### ​Example: Inheritance in JavaScript


    javascript


    Copy code


    class Animal {


    constructor(name) {


    this.name = name;


    }


    speak() {


    console.log(`${this.name} makes a sound.`);


    }


    }


    class Dog extends Animal {


    constructor(name, breed) {


    super(name); // Call the parent class constructor


    this.breed = breed;


    }


    speak() {


    console.log(`${this.name} barks.`);


    }


    }


    const dog = new Dog("Buddy", "Golden Retriever");


    dog.speak(); // Output: Buddy barks.


    In this example, the Dog class extends the Animal class, inheriting its properties
    and methods. The super() function is used to call the constructor of the parent
    class, and the speak() method is overridden to provide a more specific implementation
    for dogs.


    * * *


