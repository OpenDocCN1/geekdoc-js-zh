    \n# 第 7 章：异步 JavaScript 与 Promises\n\n![image](img/chapter_title_below.png)\n\n\
    在现代 Web 开发中，异步编程是一个至关重要的概念。JavaScript 是单线程的，这意味着一次只能执行一个操作。然而，许多任务（如从 API 获取数据、读取文件或等待用户输入）需要更多的时间来完成。异步编程允许\
    \ JavaScript 执行非阻塞操作，确保用户体验顺畅，且任务得到高效处理。\n\n在本章中，我们将探索异步 JavaScript 的工作原理，包括回调（callbacks）、Promises\
    \ 和 async/await 等概念。理解这些概念对于处理需要时间的任务（如网络请求和大型计算）至关重要。\n\n***\n\n## 7.1 什么是异步\
    \ JavaScript？\n\n异步编程允许程序在等待耗时操作完成的同时继续执行其他任务。这在与外部资源（如 API、数据库或文件）交互时特别有用，因为延迟在那里很常见。\n\
    \n如果没有异步编程，JavaScript 将阻塞代码的执行，导致应用程序无响应。通过使用异步操作，JavaScript 可以同时处理多个任务，提高性能和响应能力。\n\
    \n### 事件循环（Event Loop）\n\n事件循环是允许 JavaScript 执行非阻塞操作的机制。当启动一个任务（例如网络请求）时，事件循环会将任务移交给浏览器的\
    \ Web APIs（如 `fetch()`、`setTimeout()` 等）。任务在后台执行，而 JavaScript 引擎继续执行其他代码。一旦任务完成，事件循环会将回调或\
    \ Promise 的解析（resolution）放入队列中，当 JavaScript 引擎准备就绪时就会执行它。\n\n***\n\n## 7.2 回调（Callbacks）\n\
    \n回调是一个作为参数传递给另一个函数并在该函数完成任务后执行函数函数回调是 JavaScript 中处理异步代码的最早形式。\n\n### 示例：使用回调\n\
    \n```javascript\nfunction fetchData(callback) {\n  setTimeout(() => {\n    const\
    \ data = \"Some data from an API\";\n    callback(data);\n  }, 2000);\n}\n\nfetchData(function(data)\
    \ {\n  console.log(data); // Output: Some data from an API\n});\n```\n\n在此例中，`fetchData()`\
    \ 模拟从 API 获取数据，并在 2 秒延迟后通过回调函数处理数据。\n\n#### 回调地狱（Callback Hell）\n\n虽然回调很有用，但当你有多个相互依赖的异步操作时，它们会导致被称为“回调地狱”的情况。这发生在将回调嵌套在其他回调中，导致代码难以阅读。\n\
    \n```javascript\nfetchData(function(data) {\n  processData(data, function(result)\
    \ {\n    saveResult(result, function(response) {\n      console.log(response);\n\
    \    });\n  });\n});\n```\n\n在这种情况下，代码难以追踪且容易出错。这就是 promises 和 async/await 发挥作用的地方，提供了更整洁的替代方案。\n\
    \n***\n\n## 7.3 Promises\n\nPromise 是一个代表异步操作最终完成（或失败）及其结果的 get。Promise 是回调更整洁的替代方案，并允许对多个异步操作进行链。\n\
    \n### Promise 的状态\n\nPromise 可以处于以下三种状态之一：\n\n1. **等待中（Pending）**：异步操作完成之前的状态。\n\
    2. **已解决（Resolved/Fulfilled）**：操作成功完成，Promise 拥有结果。\n3. **已拒绝（Rejected）**：操作失败，Promise\
    \ 拥有错误原因。\n\n### 示例：使用 Promises\n\n```javascript\nfunction fetchData() {\n  return\
    \ new Promise((resolve, reject) => {\n    setTimeout(() => {\n      const data\
    \ = \"Some data from an API\";\n      resolve(data); // Promise 成功解决\n    }, 2000);\n\
    \  });\n}\n\nfetchData()\n  .then(data => {\n    console.log(data); // Output:\
    \ Some data from an API\n  })\n  .catch(error => {\n    console.error(error);\n\
    \  });\n```\n\n在此例中，`fetchData()` 返回一个 promise。`then()` 方法用于处理 promise 的成功解析，而\
    \ `catch()` 用于处理发生的任何错误。\n\n### Promise 链（Chaining Promises）\n\nPromises 允许链式，这意味着你可以顺序执行多个异步操作，将上一个操作的结果传递给下一个。\n\
    \n```javascript\nfetchData()\n  .then(data => {\n    console.log(data);\n    return\
    \ \"New data\";\n  })\n  .then(newData => {\n    console.log(newData); // Output:\
    \ New data\n  })\n  .catch(error => {\n    console.error(error);\n  });\n```\n\
    \n"
