    \n```javascript\nfunction counter() {\n  let count = 0;\n  return {\n    increment:\
    \ function() {\n      count++;\n      console.log(count);\n    },\n    decrement:\
    \ function() {\n      count--;\n      console.log(count);\n    }\n  };\n}\n\n\
    const myCounter = counter();\nmyCounter.increment(); // Output: 1\nmyCounter.increment();\
    \ // Output: 2\nmyCounter.decrement(); // Output: 1\n```\n\n在这里，`count` 变量被封装在闭包内部，只能通过\
    \ `increment` 和 `decrement` 函数进行修改。\n\n***\n\n## 3.4 JavaScript 中的 this 关键字\n\n\
    `this` 关键字指向函数的当前执行上下文。它的值取决于函数是如何调用的，理解它的工作原理对于精通面向对象的 JavaScript 至关重要。\n\n###\
    \ 3.4.1 全局上下文\n\n在全局执行上下文中，`this` 指向全局对象。在浏览器中，全局对象是 `window` 对象。\n\n```javascript\n\
    console.log(this); // Output: window (in browsers)\n```\n\n### 3.4.2 对象上下文\n\n\
    当函数作为对象的方法被调用时，`this` 指向对象本身。\n\n```javascript\nconst person = {\n  name: \"John\"\
    ,\n  greet: function() {\n    console.log(\"Hello, \" + this.name);\n  }\n};\n\
    \nperson.greet(); // Output: Hello, John\n```\n\n在这种情况下，`this.name` 指向 `person`\
    \ 对象的 `name` 属性。\n\n### 3.4.3 构造函数\n\n当使用构造函数创建对象时，`this` 指向新创建的对象。\n\n```javascript\n\
    function Person(name, age) {\n  this.name = name;\n  this.age = age;\n}\n\nconst\
    \ john = new Person(\"John\", 30);\nconsole.log(john.name); // Output: John\n\
    console.log(john.age);  // Output: 30\n```\n\n在这个示例中，`this` 指向由 `Person` 构造函数创建的新对象。\n\
    \n***\n\n## 3.5 结论\n\n在本章中，我们探索了 JavaScript 中一些本质的高概念，包括函数、作用域、闭包和 `this` 关键字。这些概念是编写整洁、高效且可维护的\
    \ JavaScript 代码的基础。\n\n通过掌握这些主题，你可以将你的 JavaScript 提升一个水平，并更轻松地构建复杂的应用程序。在下一章中，我们将深入研究文档对象模型（DOM）和事件处理，这将让你能够构建交互式的\
    \ Web 应用。\n\n![image](img/chapter_title_corner_decoration_left.png) | | ![image](img/chapter_title_corner_decoration_right.png)\n\
    \n![image](img/chapter_title_above.png)\n\n# 第 4 章：在 JavaScript 中操作 DOM（文档对象模型）\n\
    \n![image](img/chapter_title_below.png)\n\n文档对象模型 (DOM) 是一个强大的 API，允许 JavaScript\
    \ 与 HTML 文档交互并操作其内容。它提供了一种结构化的方式，将网页表示为对象树。本章将重点关注如何使用 JavaScript 访问、操作和修改 DOM，以便创建动态、交互式的\
    \ Web 应用。\n\n***\n\n## 4.1 理解 DOM\n\n在深入操作 DOM 之前，理解 DOM 是什么以及它如何表示 HTML 文档是非常重要的。DOM\
    \ 是网页上 HTML 元素的层次模型。每个元素都表示为一个节点，整个页面结构像一棵树。例如，树的根是 `document`，每个 HTML 标签（例如 `<html>`、`<body>`、`<div>`、`<p>`）都是树中的节点。\n\
    \n这是一个简单的 HTML 文档如何在 DOM 中表示的示例：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>DOM Example</title>\n</head>\n<body>\n  <div id=\"content\">\n    <h1>Welcome\
    \ to JavaScript DOM!</h1>\n    <p>This is an example of working with the DOM.</p>\n\
    \  </div>\n</body>\n</html>\n```\n\n在 DOM 中，此文档看起来如下：\n\n```less\ndocument\n├──\
    \ html\n│   ├── head\n│      └── title\n└── body\n    └── div#content\n      \
    \  ├── h1\n        └── p\n```\n\n这种层次结构允许 JavaScript 通过遍历树轻松访问和操作页面上的任何元素。\n\n\
    ***\n\n## 4.2 访问 DOM 中的元素\n\n要操作 DOM 中的元素，首先需要访问它们。JavaScript 提供了多种方法来选择 DOM 元素，例如\
    \ `getElementById`、`getElementsByClassName`、`querySelector` 和 `querySelectorAll`。\n\
    \n### 4.2.1 getElementById\n\n`getElementById` 方法通过 `id` 属性选择元素。它返回单个元素，因为 ID\
    \ 在页面内预期是唯一的。\n\n```javascript\nconst element = document.getElementById(\"content\"\
    );\nconsole.log(element); // Output: <div id=\"content\">...</div>\n```\n\n###\
    \ 4.2.2 getElementsByClassName\n\n`getElementsByClassName` 方法通过类名选择元素。它返回一个实时的元素\
    \ `HTMLCollection`，这意味着如果 DOM 更新了（例如添加了元素），该集合也会更新。\n\n```javascript\nconst paragraphs\
    \ = document.getElementsByClassName(\"text\");\n```\n\n### 4.2.3 querySelector\
    \ 和 querySelectorAll\n\n`querySelector` 方法允许你使用 CSS 选择器选择元素。它返回第一个匹配的元素。`querySelectorAll`\
    \ 在 `NodeList` 中返回所有匹配的元素。\n\n```javascript\nconst firstParagraph = document.querySelector(\"\
    p\");\nconsole.log(firstParagraph); // Output: <p>...</p>\n\nconst allParagraphs\
    \ = document.querySelectorAll(\"p\");\n```\n\n***\n\n## 4.3 操作 DOM 中的元素\n\n一旦访问了元素，你就可以各种方式对其进行操作，例如更改其内容、样式或属性。JavaScript\
    \ 提供了各种属性和方法来实现此目的。\n\n### 4.3.1 修改内容\n\n要更改元素的内容，可以使用 `innerHTML` 或 `textContent`\
    \ 属性。`innerHTML` 允许你设置 HTML 内容，而 `textContent` 只修改元素的文本内容。\n\n```javascript\n\
    const title = document.querySelector(\"h1\");\ntitle.textContent = \"New Title\"\
    ; // 修改 <h1> 的文本内容\n```\n\n要向元素添加 HTML 内容，请使用 `innerHTML`：\n\n```javascript\n\
    const content = document.getElementById(\"content\");\ncontent.innerHTML = \"\
    <h2>Updated Content</h2><p>This is new content.</p>\";\n```\n\n### 4.3.2 修改样式\n\
    \n你可以使用 `style` 属性更改元素的样式，该属性允许你修改内联 CSS。每个 CSS 属性都可以单独设置。\n\n```javascript\n\
    const paragraph = document.querySelector(\"p\");\nparagraph.style.color = \"blue\"\
    ; // 将文字颜色改为蓝色\nparagraph.style.fontSize = \"18px\"; // 将字体大小改为 18px\n```\n\n\
    ### 4.3.3 修改属性\n\n`setAttribute` 方法允许你更改元素的属性，例如图片的 `src`、链接的 `href` 或任何其他属性。\n\
    \n```javascript\nconst link = document.querySelector(\"a\");\nlink.setAttribute(\"\
    href\", \"https://www.example.com\");\nlink.textContent = \"Go to Example\";\n\
    ```\n\n你还可以使用 `getAttribute` 获取属性值。\n\n```javascript\nconst srcValue = document.querySelector(\"\
    img\").getAttribute(\"src\");\nconsole.log(srcValue); // 输出: 图片当前的 src 值\n```\n\
    \n***\n\n## 4.4 创建和删除元素\n\nJavaScript 允许在 DOM 中动态创建和删除元素。\n\n### 4.4.1 创建元素\n\n\
    要创建新元素，可以使用 `createElement` 方法。创建元素后，可以使用 `appendChild` 将其追加到现有元素中。\n\n```javascript\n\
    const newDiv = document.createElement(\"div\");\n```\n"
- fmt: "\n```javascript\nnewDiv.textContent = \"This is a dynamically created div.\"\
    ;\ndocument.body.appendChild(newDiv); // Adds the new div to the body\n```\n\n\
    ### 4.4.2 Removing Elements\n\nTo remove an element from the DOM, you can use\
    \ the `removeChild` method. First, you must access the parent element of the element\
    \ you wish to remove.\n\n```javascript\nconst divToRemove = document.querySelector(\"\
    #content\");\ndivToRemove.parentNode.removeChild(divToRemove); // Removes the\
    \ #content div\n```\n\nAlternatively, you can use the `remove` method directly\
    \ on the element.\n\n```javascript\nconst element = document.querySelector(\"\
    p\");\nelement.remove(); // Removes the selected <p> element\n```\n\n## 4.5 Handling\
    \ Events in the DOM\n\nJavaScript allows you to interact with user actions, such\
    \ as clicks, keypresses, and mouse movements, through event handling. You can\
    \ add event listeners to DOM elements using the `addEventListener` method.\n\n\
    ### 4.5.1 Adding Event Listeners\n\nThe `addEventListener` method is used to bind\
    \ an event to an element, allowing you to specify what should happen when the\
    \ event occurs.\n\n```javascript\nconst button = document.querySelector(\"button\"\
    );\nbutton.addEventListener(\"click\", function() {\n  alert(\"Button clicked!\"\
    );\n});\n```\n\nThis will show an alert when the button is clicked.\n\n### 4.5.2\
    \ Event Object\n\nThe event object is automatically passed to the event handler\
    \ function when an event occurs. It contains useful information about the event,\
    \ such as the type of event, the target element, and more.\n\n```javascript\n\
    button.addEventListener(\"click\", function(event) {\n  console.log(event.target);\
    \ // Output: the button element\n  console.log(event.type); // Output: \"click\"\
    \n});\n```\n\n### 4.5.3 Removing Event Listeners\n\nIf you no longer need an event\
    \ listener, you can remove it using the `removeEventListener` method.\n\n```javascript\n\
    function handleClick() {\n  console.log(\"Button clicked!\");\n}\nbutton.addEventListener(\"\
    click\", handleClick);\nbutton.removeEventListener(\"click\", handleClick);\n\
    ```\n\n## 4.6 Conclusion\n\nIn this chapter, we explored the basics of working\
    \ with the DOM using JavaScript. We covered how to access and manipulate DOM elements,\
    \ modify attributes and styles, create and remove elements, and handle events.\
    \ Mastering the DOM is essential for building interactive web applications, as\
    \ it allows you to dynamically update content and respond to user actions.\n\n\
    As you continue your journey with JavaScript, keep practicing DOM manipulation,\
    \ as it is one of the most powerful tools at your disposal for creating dynamic\
    \ websites and applications. In the next chapter, we will explore handling asynchronous\
