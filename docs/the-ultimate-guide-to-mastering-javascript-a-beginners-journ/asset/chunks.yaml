    # ​Chapter 2: Working with Loops, Arrays, and Objects


    ![image](d2d_images/chapter_title_below.png)


    In this chapter, we’ll explore three of the most important concepts in JavaScript:
    loops, arrays, and objects. These concepts will allow you to handle collections
    of data and repeat operations efficiently, enabling you to write more powerful
    and dynamic JavaScript code.


    * * *


    ## ​2.1 Loops in JavaScript


    Loops are a fundamental programming concept that allows you to repeat a block
    of code multiple times. JavaScript offers several types of loops, and each one
    serves a specific purpose.


    ### ​2.1.1 For Loop


    The for loop is one of the most common ways to iterate over a collection of data,
    such as an array. It allows you to repeat a block of code for a specified number
    of times.


    Here’s the basic syntax of a for loop:


    javascript


    Copy code


    for (let i = 0; i < 5; i++) {


    console.log(i);


    }


    In this example, the loop will run five times, printing the numbers 0 to 4\. The
    for loop consists of three parts:


    1.  Initialization: let i = 0 – This sets the starting point of the loop.


    2.  Condition: i < 5 – This condition determines when the loop should stop.


    3.  Increment: i++ – This updates the variable i after each iteration.


    ### ​2.1.2 While Loop


    The while loop is used when you want to repeat a block of code as long as a specific
    condition is true. Unlike the for loop, the while loop does not have a fixed number
    of iterations—it continues until the condition evaluates to false.


    Here’s the syntax for a while loop:


    javascript


    Copy code


    let i = 0;


    while (i < 5) {


    console.log(i);


    i++;


    }


    This example will produce the same result as the for loop, printing the numbers
    0 to 4\. The key difference is that the loop condition is checked before each
    iteration.


    ### ​2.1.3 Do-While Loop


    A do-while loop is similar to the while loop, but with one key difference: the
    code inside the loop is executed at least once before the condition is checked.
    This can be useful when you need to ensure the loop runs at least one time, regardless
    of the condition.


    Here’s an example of a do-while loop:


    javascript


    Copy code


    let i = 0;


    do {


    console.log(i);


    i++;


    } while (i < 5);


    In this case, the loop will also print the numbers 0 to 4, but it guarantees that
    the code inside the loop runs at least once, even if the condition is initially
    false.


    * * *


    ## ​2.2 Arrays in JavaScript


    Arrays are used to store multiple values in a single variable. They can hold different
    types of data and are useful for working with collections of similar items.


    ### ​2.2.1 Creating an Array


    You can create an array by using square brackets [] and separating the elements
    with commas. Here''s an example:


    javascript


    Copy code


    let fruits = ["apple", "banana", "cherry"];


    This array contains three elements: "apple", "banana", and "cherry". You can access
    individual elements of the array by using their index, which starts at 0.


    javascript


    Copy code


    console.log(fruits[0]); // Output: apple


    console.log(fruits[1]); // Output: banana


