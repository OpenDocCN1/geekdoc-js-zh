- img_proc: false
  md: 'When we added the canvas tag to the HTML code, we defined the height and the
    width attributes with the value 100, meaning that the canvas should be 100 pixels
    tall and 100 pixels wide. However, we wanted our title screen to be as tall and
    wide as the browser window, which is why we needed to override those two values
    dynamically using document.body.clientWidth to indicate the width and document.body.clientHeight
    to indicate the height.


    After we get a reference to the 2D context, we make a call to an HTML5 Canvas
    API function called fillStyle(). At the beginning of this chapter, we made a comparison
    of the canvas to a piece of paper with different colors; this is the same scenario.
    What the fillStyle() call is doing is to set the color to black; this is the same
    as it draws a filled rectangle at position (0,0) and ending at position (canvas.width,
    canvas.height), covering the entire browser window. Remember that we set a new
    size for the canvas object in the last step.


    Then it sets the phrase we''re going to use, selects a font family (in this case,
    Arial with a fallback to sans-serif, which works exactly as in CSS) and size,
    and changes the color again, this time to white. The fillText() call prints the
    phrase on the position 10, 30 (10 pixels starting on the left, 30 pixels starting
    on the top).


    Figure 1-1 shows the result of that code.


    ![](bbox=[0.147, 0.458, 0.853, 0.826])


    Figure 1-1. Initial screen for the game; built-in canvas'
  merge: -1
  pgno: 19
- img_proc: false
  md: 'The HTML5 Canvas API also includes a very useful method called measureText(phrase)
    that returns the width (in pixels) of the phrase parameter. We also need to be
    careful to measure the text after we set the size of the font, not before. Using
    measureText(), we can center the text on the screen:


    ```

    var phrase = ''Click or tap the screen to start the game'';

    c.font = ''bold 16px Arial, sans-serif'';

    var mt = c.measureText(phrase);

    var xcoord = (canvas.width / 2) - (mt.width / 2);

    c.fillStyle = ''#FFFFFF'';

    c.fillText(phrase, xcoord, 30);

    ```


    So we have painted the canvas, and we specified one hexadecimal color values as
    the parameter for the fillStyle() method. Other styles supported by canvas are:


    +   * Color works as ''red'' or ''black''

    * RGB values in the format rgb(Red, Green, Blue)

    * RGBA values in the format rgba(Red, Green, Blue, Alpha), where the Alpha parameter
    (transparency) goes from 0.0 to 1.0

    * HSL values in the format hsl(Percentage, Percentage, Percentage)

    * HSLA values in the format hsla(Percentage, Percentage, Percentage, Alpha)


    If solid colors are not enough for you, canvas can also make it possible to:


    +   * Display a linear gradient using createLinearGradient()

    * Display a radial gradient using createRadialGradient()

    * Display an image/video pattern by using createPattern()


    In order to create the example so that it displays a nice blue gradient of a black
    background, we can use the following code:


    ```

    var grd = c.createLinearGradient(0, 0, canvas.width, canvas.height);

    grd.addColorStop(0, ''#Eeeff'');

