  md: "Unfortunately, the technological limitations in previous versions of HTML have\
    \ been replaced by legal limitations in HTML5. Audio (and video) is encoded or\
    \ decoded with the use of codecs, which are small software libraries that lets\
    \ us encode/decode an audio or video data file or stream implementing a particular\
    \ algorithm. Some algorithms are optimized for speed; other algorithms are optimized\
    \ for lossless quality; like conventional software, some of them are royalty-free\
    \ and open and others are licensed.\n\nIn the case of “open” codecs, companies\
    \ such as Apple and Microsoft worry that they might be infringing on a patent,\
    \ which could make them liable in the case of a lawsuit—this is why they don't\
    \ support them in their browsers. The opposite scenario is that other companies,\
    \ such as the Mozilla Foundation or Opera Software, haven't made the necessary\
    \ arrangements needed in order to use some licensed codecs yet.\n\nFigure 4-1\
    \ shows which audio codecs are supported by each browser.\n\n| MP3 | WAV | OGG\
    \ |\n|---|---|--|\n| Chrome | ✅ | ❌ | ✅ |\n| Explorer 9 | ✅ | ❌ | ❌ |\n| Firefox\
    \ | ✅ | ✅ | ✅ |\n| Opera | ❌ | ✅ | ✅ |\n| Safari | ✅ | ✅ | ❌ |\n\nFigure 4-1.\
    \ Support for audio codecs\n\nHopefully\n\n```\n<audio controls>\n  <source src=\"\
    ../sounds/song.mp3\" type=\"audio/mpeg\">\n  <source src=\"../sounds/song.ogg\"\
    \ type=\"audio/ogg\">\n</audio>\n```"
