  md: '# Preface


    Addictive, frustrating. Fun, boring. Engaging, repetitive. Casual, demanding.


    These words may contradict each other, but they express the roller coaster of
    sentiments felt by real-time strategy games players like me. I remember spending
    hours playing brilliant games such as EA/Maxis’s SimCity and SimCity2000, Chris
    Sawyer’s Transport Tycoon, or Bullfrog Productions’ Theme Hospital, wondering
    why only a few of my friends (usually the geekest ones) had played them.


    Today, I see children and teenagers, grandmothers and soccer moms, and frat boys
    and computer games playing such as Zynga’s FarmVille or CityVille, Playdom’s Social
    City, or Playfish’s MyEmpire for hours, ignorant of the existence of those games’
    predecessors: a golden age of isometric real-time games that they’ll probably
    never play.


    What changed?


    This recent surge of real-time games was caused partly by Zynga’s incredible ability
    to “keep the positive things and get rid of the negative things” in this particular
    genre of games, and by a shift in consumer interests. They took the frustration
    of figuring out why no one was “moving to your city” (in the case of SimCity)
    and replaced it with adding friends to be growing neighbors. They take advantage
    of Facebook’s social capabilities to change the nature of gaming. They made the
    boring parts more interactive by letting you not only place objects, but also
    build them and manually collect the points they generate. After a while—usually
    a few weeks—when the game starts to feel repetitive, they present you with quests
    and make you interact with your friends. Finally, the constructions that you build
    remain, generating points even if you are not playing the game. (This concept
    is usually referred to in the industry as *asynchronous play or asynchronous mechanics*).


    When you eliminate frustration, boredom, and repetition (the three bad aspects
    of isometric real-time games), you end up with an addictive, fun, engaging, and
    casual (or demanding, depending on how you want to play it) genre of games that—thanks
    to its social-related progress requirements—can go viral in a heartbeat. No wonder
    Zynga’s valuation at the time of writing is $10 billion (surpassing Electronic
    Arts (EA), one of the biggest “traditional” game publishers in the world), or
    that Playdom was purchased by Disney for 760 million dollars. Coming up with the
    right values for each variable of'
  merge: -1
  pgno: 8
- img_proc: false
  md: 'the gameplay equation for your own game is extremely hard, but when you manage
    to get everything right, the very nature of this genre of social games can make
    it an instant hit.


    The interfaces of isometric real-time games are simple compared with conventional
    real-time strategy games: a “living” map editor where you can place objects on
    a matrix of tiles, which we''ll usually refer to as “the grid.” Depending on the
    object, in which case we will be buildings, some of them may generate P amount
    of every T amount of time. So even when we''re not playing the game, buildings
    will be generating points.


    As the final project in this book, we''re going to develop a game called “Tourist
    Resort” in which users will have to build a resort complex, decorate it with trees,
    and place various shops. Each shop will generate N amount of profit every T amount
    of time; this profit will allow them to buy more buildings.


    # # Rise of HTML5


    While social isometric game systems were improving, the technologies available
    to build them were also changing.


    For many years, the tools available to develop rich and highly interactive online
    games that can run within web browsers remained the same; Virtual Reality Modeling
    Language (VRML), Java Applets, Macromedia Shockwave, Adobe Flash, Microsoft Silver3D,
    and all meant third-party and proprietary solutions, and if users wanted to use
    those applications, they had to download and install browser add-ons. Even worse
    was developers also had to pay for relatively expensive IDEs (integrated development
    environments) to develop them.


    Web technologies such as HTML, CSS, and JavaScript could not provide users with
    the same quality end-user experience that could be achieved with other tools such
    as Adobe Flash. Browsers—particularly JavaScript—were slow; they lacked support
    for native video, audio, and local storage; some of them, such as Internet Explorer,
    never supported transparen in PNG images provided developers with tools to perform
    even basic bit-lock image transfers. They weren''t ready for anything but the
    simplest of games.


    Thankfully, as time went, most major web browsers started to implement the latest
    version of the HTML and CSS standards: HTML5 and CSS3. At the same time, they
    greatly improved the runtime performance of JavaScript applications. Nowadays,
    the most recent versions of modern browsers such as Firefox, Apple Safari, Google
    Chrome, Opera, and Microsoft Internet Explorer 9—as well as browsers included
    in smart devices such as the iPhone, Blackberry phones, and WebOS-based and Android-based
    phones—have already implemented most of the technologies we need in order to develop
    a full-featured video game.'
  merge: -1
