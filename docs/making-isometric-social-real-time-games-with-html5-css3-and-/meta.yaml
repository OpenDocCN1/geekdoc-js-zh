    +   • We can use the 2D context of the HTML5 Canvas object.


    Other rendering methods exist but are too inefficient to be used in the context
    of a video game.


    ![](bbox=[0.168, 0.263, 0.229, 0.335])


    Although WebGL is the fastest and most efficient method to render graphics on
    the screen, the reason we''re not going to consider it as a reliable method is
    because, at the time of writing this book, the WebGL spec hadn''t reached version
    1.0 and is not supported in the release versions of Internet Explorer 9, Safari
    for the iPhone, Safari-Android Web Browser, and Firefox for Android do include
    support for WebGL, but it needs to be enabled manually in about:config. Microsoft
    has already not supporting WebGL all due to security concerns (https://blogs.microsoft.com/bsrd/archive/2016/06/webkit-considered-careful.aspx).
    Additionally, WebGL is built on OpenGL 2.0—also a competing product of DirectX,
    Microsoft''s own graph library—and threatens Silverlight (a Rich Internet Application,
    RIA, framework for browser-based applications). For information about the current
    status of WebGL, refer to the mailing list on the Chronos Group website: https://www.chronos.org/webgl/public-mailing-list/


    A few weeks before publishing this book, the most efficient way to display the
    grid was using the third approach, due to the hardware acceleration hack (or feature).
    The problem with this approach (or the second approach) is that we want to keep
    an enormous number of elements on the DOM tree (one for each tile, plus others
    for buildings, etc.) when we scroll, we need to constantly add and remove nodes
    (to display only the elements we can see, keeping the node count down). Adding
    or moving nodes from DOM triggers a computationally expensive operation on the
    browser called a reflow that allows the layout engine of the browser to compute
    the geometry of the elements inside the DOM tree. Due to the implementation of
    hardware acceleration in the 2D and 3D contexts, recent (and future) developments
    have made and will reinforce the HTML5 Canvas as the most appropriate and efficient
    graphics rendering method for interactive video games.


    The isometric game works building objects on a grid, which is nothing more than
    a matrix containing two dimensions: one for the “Rows,” which we''ll sometimes
    call the “X” axis, and another for the “Columns,” which we''ll sometimes define
    as the Y axis. Example 1-5 generates a matrix of 20×50 tiles (20 rows per 50 columns)
    using this approach.


