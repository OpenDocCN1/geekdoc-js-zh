    \ them at 90 frames per second (FPS) while others could be doing only 15 FPS.\n\
    \nExample 1-2 shows a simple test that can tell us approximately how capable a\
    \ device is.\n\nExample 1-2. Testing device capabilities with canvas\n\n```\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<title>Canvas\
    \ Example 2 (FPS Count)</title>\n</head>\n<script>\nwindow.onload = function ()\
    \ {\n  var canvas = document.getElementById('myCanvas');\n  var c = canvas.getContext('2d');\n\
    \n  var fpsArray = [];\n  var fpsCount = 0;\n  var stopAt = 10;\n  var fps = 0;\n\
    \  var startTime = 0;\n\n  var date = new Date();\n  startTime = Math.round(date.getTime()\
    \ / 1000);\n\n  c.font = '20px _sans';\n\n  draw(startTime);\n\n  function draw(timestamp)\
    \ {\n    var date = new Date();\n    ts = Math.round(date.getTime() / 1000);\n\
    \n    if (timestamp != ts) {\n      fps = fpsCount;\n      fpsCount = 0;\n   \
    \   fpsArray.push(fps);\n    } else {\n      fpsCount++;\n    }\n\n    c.fillStyle\
    \ = '#000000';\n    c.fillRect(0, 0, canvas.width, canvas.height);\n\n    c.fillStyle\
    \ = \"#FFFFFF\";\n    c.fillText(\"TS: \" + timestamp, 10, 20);\n    c.fillText(\"\
    FPS: \" + fps, 10, 40);\n\n  if (startTime <= (startTime + stopAt)) {\n    setTimeout(function()\
