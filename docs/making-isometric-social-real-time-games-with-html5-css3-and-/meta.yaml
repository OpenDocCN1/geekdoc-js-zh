  md: 'Notice that the HTML code shown before the panel and the account balance contains
    faux values; don''t worry, we''ll populate these with real values later on when
    we integrate the client-side scripts with the server-side scripts.


    Mobile devices will detect click, mouseDown, mouseMove, mouseY, and DOMMouseScroll
    events, but impose a penalty of 250 and 600 milliseconds depending on the hardware.
    In order to alleviate this issue, we need to detect whether the device supports
    touch events, native touch and gesture events such as touchstart, touchmove, and
    touchend, and detect gestures by gesturestart and gestureend.


    We can detect and manage both clicks and touch events by using the Modernizr library.
    Modernizr returns true if the device supports touch events, which means we can
    do this:


    ```

    var pointer = {

    DOWN: ''mousedown'',

    UP: ''mouseup'',

    MOVE: ''mousemove''

    };

    ```


    ```

    if (Modernizr.touch) {

    pointer.DOWN = ''touchstart'',

    pointer.UP = ''touchend'',

    pointer.MOVE = ''touchmove''

    }

    ```


    ```

    window.addEventListener(''resize'', function() { doResize(canvas); }, false);

    canvas.addEventListener(pointer.DOWN, handleMouseDown, false);

    canvas.addEventListener(pointer.MOVE, handleDrag, false);

    document.body.addEventListener(pointer.UP, handleMouseUp, false);

    ```


    ```

    if (Modernizr.touch) {

    // gestures

    document.body.addEventListener(''gestureend'', handleGestureEnd, false)

    ```


    ```

    } else {

    // scrolling

    document.body.addEventListener(''keydown'', handleKeyDown, false);

    document.body.addEventListener(''mousewheel'', handleScroll, false);

    document.body.addEventListener(''DOMMouseScroll'', handleScroll, false);

    ```


    ```

    }

