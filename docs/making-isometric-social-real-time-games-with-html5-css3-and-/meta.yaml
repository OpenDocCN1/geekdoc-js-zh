    Drawing and working inside of an isometric grid is not hard if you know how isometric
    tiles work, as shown in Figure 2-4.

    As you can see, an isometric tile is nothing more than a rectangle that is twice
    as wide as it is tall. The diamond inside of it, usually just an image or a vector
    representation, is defined by the coordinates:


    +   West

    X: 0

    Y: tile.height/2

    East

    X: tile.width

    Y: tile.height/2'
