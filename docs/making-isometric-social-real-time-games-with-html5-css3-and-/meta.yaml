    for the hotel (using 1294084800 as the “last update” time), and take away the
    cost of the hotel. The user’s account balance will now be 1365 (2365 – 1000).


    +   - On 1294120800, he purchased a cinema, so we perform the same steps as before
    (this for two buildings, the ice cream shop and the hotel):


