  md: '# CHAPTER 4

    HTML5 Sound and Processing Optimization


    HTML5 brings game designers much more than the canvas element. Native support
    for sound (and video) is one key piece, letting you write games for which you
    manage sound in the same JavaScript environment as the graphics. Other pieces
    improve your JavaScript, whether breaking up tasks with Web Workers or letting
    you keep information on the player''s device with local and session storage.


    # Adding Sound with the Audio Element


    Previous versions of the HTML spec supported three ways of listening to an audio
    file in our page. We could:


    +   *  Use the object or embed tags to embed a file or a plugin such as LiveAudio(Netscape
    Navigator) or an ActiveMovie Control (Internet Explorer). As time went by, other
    plugins started to enter the market, such as Macromedia Flash (now Adobe Flash),
    REAL Player, or Apple''s QuickTime, among others. To embed a MIDI or WAV file,
    we could either use embed src="music.mid" autostart="true" loops="true"> or embed
    a proprietary third-party plugin such as the Macromedia Flash Player and play
    the sound through our SWF file.

    *  Insert a Java Applet and play the sound through it.

    *  Add the bgsound attribute to the body element of the page (Internet Explorer
    only).


    Browsers used to include varying sets of plugins, which meant that our sounds
    might play in one browser but not on another, even if both were installed on the
    same computer.


    Luckily, with the advent of HTML5, we also gained the ability to play audio and
    video files natively through the use of the <audio> and <video> tags.'
