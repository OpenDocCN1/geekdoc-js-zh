    timeDiff = 1294084800 - 1293861660 = 223140 seconds

    ```


    Ice cream shops generate a profit of 5 gold coins every 30 minutes (1800 seconds),
    so we need to do this calculation:


    ```

    result = timeDiff / 1800 seconds = 123.97

