    >NULL</span></li>\n</ul>\n</body>\n</html>\n```\n\nFor more information about\
    \ these and other pixel manipulation functions, access the relevant W3C Working\
    \ Draft section: http://www.w3.org/TR/2dcontext/pixel-manipulation.\n\n# # Dealing\
    \ with Transparency\n\nNow that you know how to get the color of a particular\
    \ pixel in the canvas, including its alpha value (the transparency), we can solve\
    \ a very common problem in web development that previously could be solved by\
    \ using very intricate and inefficient hacks (using the use of JavaScript and\
    \ CSS to click through the transparent areas of a PNG image, a div, or another\
    \ element). The problem is that some areas of the image are transparent, they\
    \ still act as a solid rectangle, and then clicking on the transparent areas returns\
    \ a reference to the original of the image instead of returning a reference to\
    \ the next object below it.\n\nWith these tools in our hands, there are many ways\
    \ to solve this particular problem, but they mostly consist of:\n\n+   - Figuring\
    \ out the position of the element using DOM functions and iterating through elements\
    \ until we find a collision with a \"solid\" pixel\n- Keeping track of the positions\
    \ where we place objects and in which order they are presented, which is the approach\
    \ used in conventional game development"
