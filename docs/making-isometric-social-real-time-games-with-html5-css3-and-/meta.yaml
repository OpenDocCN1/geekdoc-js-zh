  md: '# # Making Isometric Social Real-Time Games with HTML5, CSS3, and JavaScript


    Anyone familiar with Zynga''s Farmville understands how fun and addictive real-time
    social games can be. This hands-on guide shows you how to design and build one
    of these games from start to finish, using only open source tools. Detailed examples
    and code samples help you learn to render graphics, animate with sprites, add
    sound, validate scores to prevent cheating, and more.


    By the end of the book, you''ll complete a project called Tourist Resort that
    combines all of the techniques you''ve learned. You''ll also learn how to integrate
    your game with Facebook. If you''re familiar with JavaScript, HTML5, and CSS3,
    you''re ready to get started.


    +   * Use HTML5''s canvas to build smooth animations with sprites

    * Create an isometric grid pattern for high-performance graphics

    * Design a GUI that works equally well on mobile devices and PCs

    * Add sound to your game with HTML5''s audio element

    * Implement the game''s path-finding function with Workers

    * Build a client data model on the server with PHP and MySQL

    * Make your game come alive with dynamic CSS3 objects


    US $19.99

    CAN $20.99

    ISBN: 978-1-449-30475-1


    Twitter: @oreillyymedia

    facebook.com/oreilly


    ![](bbox=[0.038, 0.893, 0.903, 0.955])'
