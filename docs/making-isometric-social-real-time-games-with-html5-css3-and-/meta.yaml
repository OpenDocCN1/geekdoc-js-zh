  md: 'Expect Web Storage to behave very similarly to cookies:


    +   - The functionality could be disabled.


    +   - We have a maximum amount of elements that we can store—4K in the case of
    cookies and 5MB in the case of Web Storage, but it could be less than that as
    well.


    +   - Users can delete or manually create and/or modify the contents of our storage
    folder at any time.


    +   - Browsers can also decide to automatically “expire” the content of our storage
    folder.


    +   - The quota is given per domain name, and shared by all the subdomains (i.e.,
    site1.example.com, site2.example.com, and site3.example.com share the same folder).


    However, Web Storage differs from cookies in the following ways:


    +   - The data saved with Web Storage API can only be queried by the client, not
    by the server.


    +   - The contents do not travel “back and forth” on every request.


    +   - With the exception of sessionStorage (which deletes its contents once the
    session is over), we can''t explicitly specify an expiration date.


    +   - Just with cookies, it''s best to not use Web Storage to save anything important.


    Other than that, it''s a great tool that can help us do things that we couldn''t
    before, like caching objects to increase loading performance the next time the
    user opens our application, saving a draft of the document we''re working on,
    or even using it as a virtual memory container.


    Once you understand the limitations and capabilities of Web Storage, the rest
    is pretty straightforward:


    +   - Data is stored in an array of key-value pairs that are treated and stored
    like lite strings.


    +   - The difference between localStorage and sessionStorage is that localStorage
    stores the data permanently (until the user or the browser decides to dispose
    of it), and sessionStorage stores it for the duration of the “session” (until
    we close the tab/window).


    The Web Storage API consists of only four methods:


    ```

    localStorage.setItem(key, value)

    ```


    Adds an item


    ```

    localStorage.getItem(key)

    ```


    Queries an existing item


    ```

    localStorage.removeItem(key)

    ```


    Removes a specific item'
