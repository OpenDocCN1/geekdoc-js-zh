    # Working with Sprites


    In order to demonstrate this, we''re going to use an Sprite class, which loads
    images from a sprite sheet. Sprites are individual game textures that may have
    one (static) or multiple frames (animated). Usually, in order to optimize load
    and memory lookup times, most of the images in our game will be placed in a single
    (and large) image file called a sprite sheet. The sprite sheet that we will be
    using can be seen in Figure 1-3.


