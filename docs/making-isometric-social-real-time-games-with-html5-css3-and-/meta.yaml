  md: "Instead of defining a single src parameter, the HTML5 audio tag allows us to\
    \ define multiple audio files. If song.mp3 can't be played for some reason, the\
    \ browser will attempt to play the alternative song.ogg. If we had more sources,\
    \ it would try to play every one on the list until all of them failed or one of\
    \ them worked. In addition to the control attribute, the HTML5 audio tag also\
    \ supports other optional attributes:\n\nloop\n\nLets us load the media file specified\
    \ in the src attribute or in a source tag\n\nautoplay\n\nStarting the play as\
    \ soon as it finishes loading the source\n\npreload\n\nLets us define our source\
    \ preload strategy:\n\npreload=\"none\"\n\nDoesn't preload the file, which will\
    \ be loaded when the user presses the play button\n\npreload=\"metadata\"\n\n\
    Preloads only the metadata of the file\n\npreload=\"auto\"\n\nLets the browser\
    \ handle the preload of the file (which usually means to preload the entire file)\n\
    \nOf course, we can also create and use an HTML5 audio object instead of JavaScript\
    \ instead of including an audio element in the document, as shown in Example 4-1.\n\
