  md: 'The first approach can be implemented by using the document.elementFromPoint()
    DOM function to determine which element was clicked and if it is an image or an
    object with a background (either a solid color or an image which may or not have
    parents), we can use getImageData() to detect whether the selected pixel is transparent.
    If that''s the case, we can select the element (and if it''s not, we can look
    for siblings). We can traversing the DOM until we find a "solid" color and select
    that element instead of the image. However, this approach can nonfunctional, impractical,
    or downright inefficient if:


    +   - There are elements with a large number of siblings or parent nodes

    - We are overdrawing the z-index of parent elements and "going through" the element
    should select the element below it (in, which, case, would be a child node)


    The second approach requires us to do things in a completely different way than
    most web developers are used to: keeping track of the coordinates of the elements
    we present on the screen, and upon a click action, a hit test to see whether the
    X and Y coordinates of the mouse are inside the area of any given object. The
    way to do this is to store the position x, position y, width, and height of every
    element, as well as the order in which they are being presented on the screen.
    Then, there are many methods that you can cycle through all the elements in order
    to see which one you have clicked Having the position x, position y, width, and
    height for every object you present allows you to create rectangles that you can
    use to test whether the clientX and clientY values returned by a mouse event (such
    as mousedown, mousemove, mouseup, click, etc.) are inside them. Figure 1-5 shows
    how we can keep track of all the objects presented on the screen. MX and MY (Mouse
    X and Mouse Y) represent the click coordinates. We can check how the mouse coordinates
    are inside of any of the other objects (in this case, the element clicked would
    be #4).


    In our case, we''re going to eliminate the two downsides of using document.elementFromPoint()
    by combining it with pointer-events: none, a CSS attribute that lets the browser
    know that the mouse should not interact with an individual element, completely
    eliminating the need to traverse the DOM or keeping track of every single object
    in our screen.


    Figure 1-6 shows how our page is to be organized. Clicks made in the transparent
    areas of the "Smiley" div, go through the image, and we should get a reference
    to the "Cheese" div, unless, of course, we click through the transparent areas
    of the Smiley, and a hole of the Cheese, which should return a reference to the
    HTML document.'
