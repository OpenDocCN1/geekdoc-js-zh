  md: '+   - Perhaps the most important thing to keep in mind (and the most reliable
    anti-cheating method) is that we need to design the game in such a way as to reliably
    predict the user score at any given time on the server without ever interacting
    with the client.


    How do we do that? Let''s consider the following scenario:


    Initially, the user has a balance of 2000 gold coins, 0 buildings, an account
    "creation time" of 1293816600 (which is the Unix timestamp for January 1, 2011,
    at 00:00:00) and a "last update" of 1293816600 (same timestamp as the start time).


    We have three possible structures that we can build:


    +   - An ice cream shop that costs 250 gold coins and pays 5 gold coins every
    30 minutes

    - A hotel that costs 1000 gold coins and pays 30 gold coins per hour

    - A cinema that costs 500 gold coins and pays 12 gold coins every 30 minutes


    The user builds an ice cream shop at 1293816660 (January 1, 2011, at 00:01:00),


    He decides to build a hotel at 1294048800 (January 3, 2011, at 14:00:00).


    At 1294120800 (January 4, 2011, at 00:00:00), the user builds a cinema.


    At 1294639200 (January 10, 2011, at 00:00:00), he returns to the game and wants
    to see his account balance.


    One approach to handle this situation would be to keep track of all the buildings
    that the user has purchased and add a "last update" field in the user''s account
    that knows the last time that he queried his account balance or purchased/sold
    a building. Then, every time that he wants to see his account balance or does
    a buy/sell operation, we would perform the following steps:


    +   1. Update the "last update" field of the user with the current timestamp.

    2. Start cycling through all the buildings that the user owns.

    3. Calculate the time difference (in seconds) between the current time and the
    "last update" time of the user field.

    4. Divide the result by the number of seconds of the payment fractions, and "floor"
    the result.

    5. Multiply the result by the number of gold coins given on each fraction.

    6. Update the account balance by adding up the result.

    7. Depending on the operation that we are performing (show build, or sell), either
    show the account balance or subtract/add the cost of the building.

    8. If we are selling a building, delete the association.'
