    # # Adding a Social Networking Layer Using Facebook


    Adding a social layer to our game using Facebook can be done easily by filling
    out some forms and implementing just a few lines of code. First, we''ll need to
    create a new Facebook application by going to http://www.facebook.com/developers/
    and clicking on the Create New App button, which takes you to a Facebook Application
    Creation wizard that will allow us to integrate our game with Facebook.


    Once you click the Create New App button, you''ll see something like Figure 5-8
    asking you to name your app.


    Just type any name you want (which will be the application title seen by your
    users when they install the game), agree to the Terms of Service and click Create
    App. I named mine Tourist Resort. This name doesn''t have to be unique, so feel
    free to name your game Tourist Resort as well.'
  merge: -1
  pgno: 145
- img_proc: false
  md: '![](bbox=[0.142, 0.085, 0.857, 0.313])


    The next step, shown in [Figure 5-9](#), is a security check that will ask you
    to type the text inside the captcha.


    ![](bbox=[0.142, 0.408, 0.857, 0.603])


    Figure 5-9. Next step: captcha


    When you click Submit, depending on your account information and/or location,
    Facebook may ask you to verify your account by associating your telephone number
    or a valid credit card registered to your name.


    Once you''ve completed these steps, you will be taken to your application management
    page, which will let you modify your contact information, application name and
    description, logo, and language, among other details.


    We can integrate our application into the Facebook platform by presenting it within
    the Facebook page or as a standalone application that uses Facebook''s authentication
    scheme, called Facebook Connect. Discussing all the different Facebook authentication
    schemes are outside the scope of this book, so we will focus on how to display
    the game within the Facebook site.'
  merge: -1
  pgno: 146
- img_proc: false
  md: 'In order to provide an external site with the logged-in user''s authentication
    details, Facebook uses a concept called a canvas—not related to the HTML5 Canvas—which
    is nothing more than a 765-pixel-wide HTML iframe that loads our one site, passing
    along several parameters to allow us to initiate a OAuth 2.0 authentication scheme
    that can be done either on the server side or the client side (JavaScript and
    XBFML).


    This book focuses on implementing the server-side approach. For more information
    on the different authentication schemes supported by the Facebook platform, please
    refer to http://developers.facebook.com/docs/authentication/.


    To implement the server-side authentication scheme we''re using for our game,
    we need to click on the Facebook Integration link on the left of our application
    management page. The first panel, Core Settings, shows the information in Figure
    5-10.


    ![](bbox=[0.142, 0.378, 0.857, 0.485])


    Figure 5-10. Key information for your apps


    Take note of your specific Application ID and the Application Secret (partially
    obscured in the figure) and download Facebook''s official PHP SDK: https://github.com/facebook/php-sdk/.


    Inside the Facebook Integration tab, we must specify two additional fields:


    +   - The Canvas Page, which is a Facebook-hosted URL that will be accessed by
    our users when they click on our application

    - The Canvas URL, which is the URL hosting our application


    An example is shown in Figure 5-11.


    ![](bbox=[0.142, 0.753, 0.857, 0.861])


    Figure 5-11. Defining your canvas'
  merge: -1
  pgno: 147
- img_proc: false
  md: "In a nutshell, when users access http://apps.facebook.com/tourist-resort, Facebook\
    \ will automatically call our Canvas URL, passing some parameters to help with\
    \ the authentication.\n\nThen, we just need to include the Facebook API files,\
    \ make new instance of the Facebook object using our Application ID and Application\
    \ Secret, and we'll get access to the user's information:\n\n```\n<?php\nrequire\
    \ 'facebook/src/facebook.php';\n\n$fb = new Facebook(array(\n    'appid' => '<YOUR_APPLICATION_ID>',\n\
    \    'secret' => '<YOUR_APPLICATION_SECRET>',\n));\n\n$user = $fb->getUser();\n\
    echo '<pre>';\nprint_r($user);\necho '</pre>';\n?>\n```\n\nIf the user is not\
    \ logged in to Facebook or hasn't authorized our application, the output of the\
    \ $user variable will be zero. A more reliable method to detect this occurrence\
    \ is to use the approach taken in example.php, which is included in the Facebook\
    \ PHP SDK:\n\n```\n<?php\nif ($user) {\n    try {\n        $user_profile = $fb->api('/me');\n\
    \    } catch (FacebookApiException $e) {\n        $user = null;\n    }\n}\n?>\n\
    ```\n\n$fb->api('/me') tries to fill the $user_profile variable by querying Facebook's\
    \ Graph API for your user (for more information about the Facebook Graph API,\
    \ see: http://developers.facebook.com/docs/reference/api/) and throws an exception\
    \ if an error occurs.\n\nIn order to let the user sign in to our application using\
    \ Her Facebook credentials, add the following lines:\n\n```\n<?php\n$loginUrl\
    \ = $fb->getLoginUrl();\n?>\n```\n\n<a href=\"$loginUrl?\">Sign In</a>"
  merge: -1
  pgno: 148
- img_proc: false
  md: "When the user clicks Sign In, Facebook will show the authorization dialog in\
    \ Figure 5-12.\n\n![](bbox=[0.147, 0.149, 0.852, 0.417])\n\nFigure 5-12. Will\
    \ the user grant permission?\n\nOnce the user decides to allow our application\
    \ to access her data, the page will be reloaded; this time, the $user variable\
    \ will be filled with the Facebook User ID and the $user_profile variable will\
    \ be filled with the response to the Graph API query /me, which is returned as\
    \ a JSON object.\n\nBy default, Facebook will ask for the “basic information,”\
    \ which includes things such as the user's name, last name, Facebook User ID,\
    \ location, interests, gender, and so on. If we want to ask for additional permissions—for\
    \ example, to get to his email address, and to publish messages on his activity\
    \ stream—we need to modify the $fb->loginUrl() call in the following way:\n\n\
    ```\n<?php\n$loginUrl = $fb->loginUrl(array(\n  \"scope\" => \"email, publish_stream,\
    \ friends_about_me\"\n));\n?>\n```\n\n> The entire list of permissions can be\
    \ found at the following URL: http://developers.facebook.com/docs/authentication/permissions/.\n\
    \nAfter we modify the permissions, our new authorization window will look like\
    \ Figure 5-13."
  merge: -1
  pgno: 149
