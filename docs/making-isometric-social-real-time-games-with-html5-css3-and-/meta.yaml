  md: "The entire list can be found in the official W3C Working Draft at http://www.w3.org/TR/css3-animations/.\n\
    \nAlthough in our case the animation will occur only in fixed positions, you can\
    \ easily create the same effect using JavaScript and random variables or variables\
    \ based on the current grid position of our game:\n\n```\n@webkit-keyframes moveLeftToRight\
    \ {\n0% {\n  -webkit-transform: translateX(-5000px) translateY(50px) translateZ(0px);\n\
    }\n50% {\n  -webkit-transform: translateX(0px) translateY(50px) translateZ(0px);\n\
    }\n100% {\n  -webkit-transform: translateX(5000px) translateY(50px) translateZ(0px);\n\
    }\n@moz-keyframes moveLeftToRight {\n0% {\n  -moz-transform: translateX(-5000px)\
    \ translateY(50px);\n}\n50% {\n  -moz-transform: translateX(0px) translateY(50px);\n\
