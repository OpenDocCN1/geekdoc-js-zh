  md: '+   • We can deploy a variation of the previous approach, which consists of
    presenting elements in a similar fashion to the previous method, but using the
    new CSS3 positioning tools, such as translateX and translateY—as well as setting
    translateZ(0)—to force hardware acceleration in Chrome, Safari, and Safari for
