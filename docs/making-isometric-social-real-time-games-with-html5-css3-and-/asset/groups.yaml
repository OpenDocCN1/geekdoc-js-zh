    \nAnother pleasant effect that would help the scene more credible is the addition\
    \ of shadows. There are several techniques and algorithms to project shadows in\
    \ a two-dimensional plane; however, in most cases we need one or multiple light\
    \ sources, which also requires us to perform multiple calculations, especially\
    \ if we have multiple objects (which we do).\n\nBecause the objects on the scene\
    \ will be static for most of the time, we could efficiently either:\n\n- Draw\
    \ a shadow texture for each individual building\n- Generate the shadows dynamically\n\
    \nIn this case, we're going to use the second approach, as it gives us the possibility\
    \ of defining a pseudo-light source or controlling the intensity of the shadow\
    \ dynamically. This method consists of drawing a silhouette of the original building,\
    \ skewing and rotating it at the same time reducing the alpha value. For example,\
    \ if we painted our textures with light coming from the southeast, the shadow\
    \ should be projected to the northwest. If we painted them with a light source\
    \ coming from the southwest, the shadow would be projected to the northeast, and\
    \ so on. Figure 5-6 will give you a better idea of what we're trying to do.\n\n\
    ![](img/bc084eea89036c02dab091a0a80afada_143_0.png)\n\nFigure 5-6. Adding a silhouette\
    \ to a building\n\nTo implement this approach, we're going to resort to two HTML5\
    \ Canvas functions seen before, getImageData() and putImageData(), and we're going\
    \ to build the functionality directly into the sprite object.\n\nFirst, we will\
    \ modify our Sprite class and add an empty property:\n\n```javascript\nthis.shadow\
    \ = null;\n```\n\nNext, we modify the draw() method to optionally accept a drawShadow\
    \ parameter, a boolean indicating whether we want to draw a shadow to the sprite\
    \ that we're drawing. A subroutine will check this.shadow is null and do all the\
    \ necessary processing to convert the image to an image array that we can later\
    \ use using putImageData(). The result of the silhouette effect will be stored\
    \ in our this.shadow property that the next time we need to use it we don't need\
    \ to do all the image preprocessing again. Be advised though, that this method\
    \ is less efficient than using a premade image like our shadow; however, it gives\
    \ us greater control and flexibility:\n\n```javascript\nif (this.show) {\n  if\
    \ (drawShadow !== undefined && drawShadow) {\n    if (this.shadow === null) {\
    \ // Shadow not created yet\n      var scnv = document.createElement(\"canvas\"\
    );\n      var sctx = scnv.getContext(\"2d\");\n\n      scnv.width = this.width;\n\
    \      scnv.height = this.height;\n\n      sctx.drawImage(this.spritesheet,\n\
    \        this.offsetX,\n        this.offsetY,\n        this.width,\n        this.height,\n\
    \        0,\n        0,\n        this.width * this.zoomLevel,\n        this.height\
    \ * this.zoomLevel);\n\n      var idata = sctx.getImageData(0, 0, scnv.width,\
    \ scnv.height);\n\n      for (var i = 0, len = idata.data.length; i < len; i +=\
    \ 4) {\n        idata.data[i] = 0; // R\n        idata.data[i + 1] = 0; // G\n\
    \        idata.data[i + 2] = 0; // B\n      }\n\n      sctx.clearRect(0, 0, scnv.width,\
    \ scnv.height);\n      sctx.putImageData(idata, 0, 0);\n\n      this.shadow =\
    \ sctx;\n    }\n\n    c.save();\n    c.globalAlpha = 0.3;\n    var sw = this.width\
    \ * this.zoomLevel;\n    var sh = this.height * this.zoomLevel;\n    c.drawImage(this.shadow.canvas,\
    \ this.posX, this.posY - sh, sw, sh * 2);\n    c.restore();\n  }\n\n  c.drawImage(this.spritesheet,\n\
    \    this.offsetX,\n    this.offsetY,\n    this.width,\n    this.height,\n   \
    \ this.posX,\n    this.posY,\n    this.width * this.zoomLevel,\n    this.height\
    \ * this.zoomLevel);\n}\n```\n\nThe end result looks like Figure 5-7.\n\n![](img/bc084eea89036c02dab091a0a80afada_145_0.png)\n\
    \n# Adding a Social Networking Layer Using Facebook\n\nAdding a social layer to\
    \ our game using Facebook can be done easily by filling out some forms and implementing\
    \ just a few lines of code. First, we'll need to create a new application by going\
    \ to http://www.facebook.com/developers/ and clicking on the Create App button,\
    \ which takes you to a Facebook Application wizard that will allow us to integrate\
    \ our game with Facebook.\n\nOnce you click the Create App button, you'll see\
    \ something like Figure 5-8 asking you to name your app. Just type any name (which\
    \ will be the application title seen by your users when they install the game),\
    \ agree to the Terms and click Create App. I named mine Tourist Resort. This name\
    \ doesn't have to be unique, so feel free to name your game Tourist Resort as\
    \ well.\n\n# Create Application\n\nApp Name:\nCannot contain Facebook trademarks\
    \ or have a name that can be confused with an app built by Facebook.\n\nDo you\
    \ agree to the Facebook Terms?\n\nTerms\n- Agree\n- Disagree\n\nCreate App\n\n\
    Figure 5-8. Creating an application in Facebook\n\nThe next step, shown in Figure\
    \ 5-9, is a security check that will ask you to type the text inside the captcha.\n\
    \n# Security Check\n\nPlease enter the text below\n\n![](img/bc084eea89036c02dab091a0a80afada_146_0.png)\n\
    \nCan't read the text above?\nTry another text or an audio captcha\n\nText in\
    \ the box:\n\nWhat is this?\n\nSubmit\n\nFigure 5-9. Next step: captcha\n\nWhen\
    \ you click Submit, depending on your account information and/or location, Facebook\
    \ may ask you to verify your account by associating your telephone number or a\
    \ valid credit card registered to your name.\n\nOnce you've completed these steps,\
    \ you will be taken to your application management page, which will let you modify\
    \ your contact information, application name and description, logo, and language,\
    \ among other details.\n\nWe can integrate our application into the Facebook platform\
    \ by presenting it within the Facebook page or as a standalone application that\
    \ uses Facebook's authentication scheme, called Facebook Connect. Discussing all\
    \ the different authentication schemes are outside the scope of this book, so\
    \ we will focus on how to display the game within the Facebook site.\n\n# Adding\
    \ a Social Networking Layer Using Facebook | 131\n\nIn order to provide an external\
    \ site with the logged-in user’s authentication details, Facebook uses a concept\
    \ called a canvas—not related to the HTML5 Canvas—which is nothing more than a\
    \ 765-pixel-wide HTML iframe that loads our site, passing along several parameters\
    \ to allow us to initiate a OAuth 2.0 authentication scheme that can be done either\
    \ on the server side or the client side (JavaScript and XML).\n\nThis book focuses\
    \ on implementing the server-side approach. For more information on the different\
    \ authentication schemes supported by the Facebook platform, please refer to http://developers.facebook.com/docs/authentication/.\n\
    \nTo implement the server-side authentication scheme we’re using for our game,\
    \ we need to click on the Facebook Integration link for left of our application\
    \ management. The first panel, Core Settings, shows the information in Figure\
    \ 5-10.\n\n| About | Core Settings |\n|---|---|\n| Web Site | Application ID:\
    \ 15172217156171 Your OAuth_client_id |\n| Facebook Integration | Application\
    \ Secret: 7fb85e2b10c1d5f0fb80 Your OAuth_client_secret |\n\nFigure 5-10. Key\
    \ information for your apps\n\nTake note of your specific Application ID and the\
    \ Application Secret (partially obscured in the figure) and download Facebook’s\
    \ official PHP SDK: https://github.com/facebook/php-sdk/.\n\nInside the Facebook\
    \ Integration tab, we must specify two additional fields:\n\n- The Canvas Page,\
    \ which is a Facebook-hosted URL that will be accessed by our users when they\
    \ click on our application\n- The Canvas URL, which is the URL hosting our application\n\
    \nAn example is shown in Figure 5-11.\n\n| Canvas | | |\n|---|---|---|\n| Canvas\
    \ Page | http://apps.facebook.com/tourist-resort | The base URL of your app on\
    \ Facebook |\n| Canvas URL | http://www.example.com/tourist-resort/ | Facebook\
    \ pulls the content for your app’s canvas pages from this base URL |\n\nFigure\
    \ 5-11. Defining your canvas\n"
