    \   case State.INTRO:\n      showIntro();\n      break;\n  }\n}\nfunction fadeToWhite(alphaVal)\
    \ {\n  // ...\n}\nfunction showIntro() {\n  // ...\n}\n</script>\n<style type=\"\
    text/css\" media=\"screen\">\nhtml { height: 100%; overflow: hidden; }\nbody {\n\
