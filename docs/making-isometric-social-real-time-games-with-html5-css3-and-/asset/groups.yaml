    <body>\n<canvas id=\"myCanvas\" width=\"100\" height=\"100\">\n  Your browser\
    \ doesn't include support for the canvas tag.\n</canvas>\n</body>\n</html>\n\n\
    Although in this case, the animation being performed (the fade to white) is not\
    \ too complex, if you run more complex animation on a mobile device, you will\
    \ probably notice small interruptions in the animation, an effect called \"frame\
    \ skipping.\"\n\n## Creating Smooth Animations\n\nIn any sort of game development,\
    \ it's critical to make the most efficient use of resources. However quickly quickly\
    \ canvas may be able to draw elements on the screen, we still need to clear or\
    \ redraw a large area several times per second; the game perhaps won't feel \"\
    jerky\" on personal computers, mobile devices such as cell phones or tablets could\
    \ struggle to keep up, which would completely ruin the game experience for our\
    \ players. (Later in this chapter, you will learn how to dramatically improve\
    \ performance.)\n\nThe enormous variety of devices that will be able to play our\
    \ game means that if we need to present a simple animation, some devices might\
    \ be able to show them at 90 frames per second (FPS) while others could be doing\
    \ only 15 FPS.\n\nExample 1-2 shows a simple test that can tell us approximately\
    \ how capable a device is.\n\nExample 1-2. Testing device capabilities with canvas\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"\
    \ />\n  <title>Canvas Example 2 (FPS Count)</title>\n\n<script>\n  window.onload\
    \ = function () {\n    var canvas = document.getElementById('myCanvas');\n   \
