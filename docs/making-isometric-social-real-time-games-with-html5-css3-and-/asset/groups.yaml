    be more efficient to call it every 500 or 2000ms. At the time of writing this
    book, it is not completely supported across all browsers, in the final future
    requestAnimationFrame() function will allow us to specify a time parameter.


    ```

    requestAnimationFrame is capped at 60 FPS.

    ```


    As we have seen so, depending on the capabilities and the performance of the device
    (among other factors), we will get a higher or lower FPS—which means that we base
    our animations by the number of frames, the animations will be played faster on
    some devices than others.


    Those familiar with PCs in the 1980s may remember the "turbo" button, which allowed
    us to change the speed of the processor. In the past, many games and applications
    were developed to run at a specific clock speed, so as computers got faster, all
    the variables in those games, including the animations, got faster, leading to
    hilarious results. The button allowed us to "slow down" the computer to support
    all applications such as games.


