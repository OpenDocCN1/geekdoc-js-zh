    the gameplay equation for your own game is extremely hard, but when you manage
    to get everything right, the very nature of this genre of social games can make
    it an instant hit.


    The interfaces of isometric real-time games are simple compared with conventional
    real-time strategy games: a “living” map editor where you can place objects on
    a matrix of tiles, which we''ll refer to as “the grid.” Depending on the object,
    in which case we will have buildings, some of them generate P amount of points
    every T amount of time. So even when we''re not playing the game, buildings will
    be generating points.


    As the final project in this book, we''re going to develop a game called “Tourist
    Resort” in which users will build a resort complex, decorate it with trees, and
    place various shops. Each shop will generate N amount of profit every T amount
    of time; this profit will allow them to buy more buildings.


    ## The Rise of HTML5


    While social isometric game systems were improving, the technologies available
    to build them were also changing.


    For many years, the tools available to develop rich and highly interactive online
    games that can run within browsers remained the same; Virtual Reality Modeling
    Language (VRML), Java Applets, Macromedia Shockwave, Adobe Flash, Microsoft Silver,
    Unity3D, and others mean using third-party and proprietary solutions, and if users
    wanted to use those applications, they had to download and install browser add-ons.
    Even worse was that developers had to pay for really expensive IDEs (integrated
    development environments) to develop them.


    Web technologies such as HTML, CSS, and JavaScript could not provide users with
    the same quality experience that could be achieved with other tools such as Adobe
    Flash. Browsers—particularly with JavaScript—were slow; they lacked support for
    native video, audio, and local storage; and some of them, such as Internet Explorer,
    never supported transparencies in PNG images and developers had no tools to perform
    even basic bit-block image transfers. They weren''t ready for anything but the
    simplest of games.


    Thankfully, as time went, most web browsers started to implement the latest version
    of the HTML and CSS standards: HTML5 and CSS3. At the same time, they greatly
    improved the runtime performance of JavaScript applications. Nowadays, the most
    recent versions of modern browsers such as Mozilla Firefox, Apple Safari, Google
    Chrome, Opera, and Microsoft Internet Explorer 9—as well as browsers included
    in smart devices such as the iPhone, Blackberry phones, and WebOS-based and Android-based
    phones—have already implemented most of the technologies that we need in order
    to develop a full-featured video game.


    ## What You Need to Know


    This book doesn''t provide a definitive guide to HTML5, CSS3, or JavaScript. It
    assumes that you have at least a basic knowledge of how to work with all of these
    languages. Instead, throughout the different sections of this book, we discuss
    how to apply these in the most performance-efficient way so that you can develop
    and launch a game that works today in any smartphone, tablet, or PC with a web
    browser that supports HTML5.


    This book is intended for web developers trying to do game development or for
    game developers trying to adapt their knowledge to web development.


    Our main approach for the development of an isometric social real-time strategy
    game will be to aim the least common denominator: mobile devices. The rationale
    for this approach is if it works on a mobile device at a decent speed, it will
    also work on high-end devices such as personal computers.


    ## Code Examples


    All of the code and other supporting files for examples in this book are available
    at https://github.com/andrespagella/Making-Isometric-Real-time-Games.


    ## Development and Debugging Tools


    If you''re an experienced developer, a few key tools can be helpful. Although
    you could implement these examples with a simple text editor (like Notepad or
    TextEdit) and any HTML5-capable web browser, if you intend to do any serious work,
    it would be nice to have syntax highlighting, a JavaScript console, a JavaScript
    debugger, and a web inspector. I strongly recommend using an editor that supports
    (or can be extended to) JavaScript, HTML, and CSS, such as vic or emacs.


    The JavaScript Console, JavaScript debugger, and the web inspector are tools that
    can be used to locate and track problems, routines, and others. Luckily for us,
    most modern browsers include all of the three:


    ### Mozilla Firefox


    Inside the Tools, you''ll find JavaScript Console and Inspect; I recommend installing
    Firebug, which is an extension for advanced web development that also includes
    a JavaScript debugger and an HTML, CSS, and DOM inspector, along with many other
    features.


    ### Internet Explorer


    Open the Developer Tools pressing F12. This includes a JavaScript console that
    allows you to view the page in different "document modes" to see how your site
    will handle visitors using IE5, IE7, and so on.


    ### Google Chrome


    If you access the View menu (in OSX) or click on the little wrench icon that is
    usually located right next to the address bar, then go to the Developer menu,
    you will see JavaScript Tools and JavaScript Console. Both of them are toolsets
    included in most Web-based browsers.


    ### Safari


    The Advanced tab of the Preferences includes a checkbox at the bottom for “Show
    Develop menu in menu bar.” Alternately, in OS X, you can enable the Developer
    menu by opening a Terminal window and typing `defaults write com.apple.Safari
    IncludeDebugMenu 1`. Another approach is to edit the `Preferences.plist` file
    and add the following line before the `<dict>` and `<plist>` XML closing tags:
    `<key>IncludeDebugMenu</key>`. In OS X, the `Preferences.plist` file is usually
    located in one of the following directories, depending on the version of your
    operating system:


    - C:\Documents and Settings\USER\Application Data\Apple Computer\Safari, where
    %USER% is

    - C:\Users\USER%\AppData\Roaming\Apple Computer\Safari, where %USER% is your account.


    In Microsoft Windows, you can edit the Safari shortcut to add /enableDebugMenu
    right next to the Safari.exe path.


    ### Opera


    Opera also includes a great debugging utility and web inspector called Dragonfly.
    To learn more, refer to the official Opera Dragonfly website: http://www.opera.com/dragonfly/


    ## Notes on Game Design


    Game design is one of the most important aspects (if not the most important aspect)
    of game development: no one wants to play a boring game. In this genre of social
    reality-strategy games, it is very important to engage the user not only by providing
    a good user experience and gameplay, but also by heavily integrating the game
    into the user’s social network and experience.


    Don’t forget that the main appeal of these sorts of games—which appear simple
    at first glance—is to make the users connect with their friends (“I have a bigger/nicer
    city than yours”). And there’s no better and more convincing advertising than
    recommendations from your circle of friends.


    You also need to be careful and responsible about how you interact with users’
    social connections. Getting banned by the social network itself (for example,
    Facebook) would be a disaster, even before that happened, the application could
    get blocked or flagged by spammers.


    Game design is a far broader subject than can be covered here. An excellent book
    on the blurring of game design with web applications is Gamification by Design
    by Gabe Zichermann and Christopher Cunningham (O''Reilly).


    ## Conventions Used in This Book


    The following typographical conventions are used in this book:


    - *Italic* Indicates new terms, URLs, email addresses, filenames and file extensions.

    - **Constant width*** Used for program listings, as well as within paragraphs
    to refer to program elements such as variable or function names, databases, data
    types, environment variables, statements, and keywords.

    - **Constant width bold*** Shows commands or other text that should be typed literally
    by the user.

    - **Constant width *italic*** Shows text that should be replaced with user-supplied
    values or by values determined by context.


    ![bc084eea89036c02091a0a80afada12_0.png] This icon signifies a tip, suggestion,
    or general note.


    ![bc084eea89036c02091a0a80afada12_1.png] This icon indicates a warning or caution.


    ## Using Code Examples


    This book is here to help you get your job done. In general, you may use the code
    in this book in your programs and documentation. You do not need to contact us
    for permission unless you are reproducing a significant portion of the code. For
    example, writing a program that uses several chunks of code from this book does
    not require permission. Selling or distributing a CD-ROM of examples from O''Reilly
    books require permission. Answering a question by citing this book and quoting
    example code does not require permission. Incorporating a significant amount of
    example code from this book into your product’s documentation does require permission.

