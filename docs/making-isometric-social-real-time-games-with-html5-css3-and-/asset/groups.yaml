- md: "\nWhen we added the canvas tag to the HTML code, we defined the height and\
    \ the width attributes with the value 100, meaning that the canvas should be 100\
    \ pixels tall and 100 pixels wide. However, we wanted our title screen to be as\
    \ tall and wide as the browser window, which is why we needed to override those\
    \ two values dynamically using document.body.clientWidth to indicate the width\
    \ and document.body.clientHeight to indicate the height.\n\nAfter we get a reference\
    \ to the 2D context, we make a call to an HTML5 Canvas API function called fillStyle().\
    \ At the beginning of this chapter, we made a comparison of the canvas to a piece\
    \ of paper with different colors; this is the same scenario. What the fillStyle()\
    \ call is doing is to set the color to black, and at position (0,0) and ending\
    \ at position (canvas.width, canvas.height), this covering the entire browser\
    \ window. Remember that we set a new size for the canvas object in the last step.\n\
    \nThen it sets the phrase that we're going to use, selects a font (in this case,\
    \ Arial with a fallback to sans-serif, which works exactly as in CSS) and size,\
    \ and changes the color again, this time to white. The fillText() call prints\
    \ the phrase on the position 10, 30 (10 pixels starting on the left, 30 pixels\
    \ starting on the top).\n\nFigure 1-1 shows the result of that code.\n\n![](img/bc084eea89036c02dab091a0a80afada_19_0.png)\n\
    \nFigure 1-1. Initial screen for the game; built-in canvas\n\nThe HTML5 Canvas\
    \ API also includes a very useful method called measureText(phrase) that returns\
    \ the width (pixels) of the phrase parameter. We also need to be careful to measure\
    \ the text after we set the size of the font, not before. Using measureText(),\
    \ we can center the text on the screen:\n\n```\nvar phrase = 'Click or tap the\
    \ screen to start the game';\nc.font = 'bold 16px Arial, sans-serif';\nvar mt\
    \ = c.measureText(phrase);\nvar xcoord = (canvas.width / 2) - (mt.width / 2);\n\
    c.fillStyle = '#FFFFFF';\nc.fillText(phrase, xcoord, 30);\n```\n\nSo we have painted\
    \ the canvas, and we specified one hexadecimal color values as the parameter for\
    \ the fillStyle() method. Other styles are supported by canvas:\n\n- Color works\
    \ as 'red' or 'black'\n- RGB values in the format rgb(Red, Green, Blue)\n- RGBA\
    \ values in the format rgba(Red, Green, Blue, Alpha), where the Alpha parameter\
    \ (transparency) goes from 0.0 to 1.0\n- HSL values in the format hsl(Percentage,\
    \ Percentage, Percentage)\n- HSLA values in the format hsla(Percentage, Percentage,\
    \ Percentage, Alpha)\n\nIf solid colors aren't enough for you, canvas also makes\
    \ it possible to:\n\n- Display a linear gradient using createLinearGradient()\n\
    - Display a radial gradient using createRadialGradient()\n- Display an image/video\
    \ pattern using createPattern()\n\nIn order to create the example so that it displays\
    \ a nice blue gradient of a black background, we can use the following code:\n\
    \n```\nvar grd = c.createLinearGradient(0, 0, canvas.width, canvas.height);\n\
    grd.addColorStop(0, '#EeeCff');\ngrd.addColorStop(1, '#2bc8ff');\n```\n\n```\n\
    c.fillStyle = '#fff';\nc.fillRect(0, 0, canvas.width, canvas.height);\n```\n\n\
    Displaying images on the canvas is just as easy as displaying text using the drawImage()\
    \ method:\n\n```\nvar img = new Image();\nimg.src = 'image.png';\nc.drawImage(img,\
    \ 0, 0, img.width, img.height);\n```\n\n![](img/bc084eea89036c02dab091a0a80afada_20_0.png)\n\
    \nIn order to use the img.width and img.height attributes, the img.ready property\
    \ must be COMPLETE. In the final game implementation, we'll take care of this\
    \ with a complete resource loader. The resource loader can be found within the\
    \ game.js folder of the code repository (the file is called resourceLoader.js).\n\
    \nThe drawImage() method of the HTML5 Canvas API has three different implementations.\
    \ Although we'll be covering most of them in the following sections, a more detailed\
    \ document explaining each implementation can be found here: http://www.w3.org/TR/2dcontext/#dom-context-2d-drawimage.\n\
    \nIf we want to make our image as big as the original size, we just need to multiply\
    \ its size by 2 in the following way:\n\n```\nvar img = new Image();\nimg.src\
    \ = 'image.png';\nc.drawImage(img, 0, 0, img.width * 2, img.height * 2);\n```\n\
    \nIn our case, we're going to use a file provided in the official code repository\
    \ within the img directory, called logo.png. We're also going to present the image\
    \ so that it fills 50% of the browser window while maintaining its width/height\
    \ aspect ratio so that it can be displayed gracefully in mobile phones or tablets\
    \ as well as conventional desktop computers.\n\nTo present the title, make a function\
    \ showIntro() that displays the blue gradient, and the text:\n\n```javascript\n\
    function showIntro() {\n  var phrase = \"Click or tap the screen to start the\
    \ game\";\n\n  // Clear the canvas\n  canvas.clearRect(0, 0, canvas.width, canvas.height);\n\
    \n  // Make a nice blue gradient\n  var grad = canvas.createLinearGradient(0,\
    \ canvas.height, canvas.width, 0);\n  grad.addColorStop(0, '#cce6ff');\n  grad.addColorStop(1,\
    \ '#52b2ff');\n\n  canvas.fillStyle = grad;\n  canvas.fillRect(0, 0, canvas.width,\
    \ canvas.height);\n\n  var logoImg = new Image();\n  logoImg.src = '../img/img/logo.png';\n\
    \n  // Store the original width value so that we can keep\n  // the same width/height\
    \ ratio later\n  var originalWidth = logoImg.width;\n\n  // Compute the new width\
    \ and height values\n  logoImg.width = Math.round(50 * document.body.clientWidth\
    \ / 100);\n  logoImg.height = Math.round((logoImg.width * logoImg.height) / originalWidth);\n\
    \n  // Create an small utility object\n  var logo = {\n    img: logoImg,\n   \
    \ x: (canvas.width/2) - (logoImg.width/2),\n  };\n}\n```\n"
  mdcn: "\n\n当我们在 HTML 代码中添加 `canvas` 标签时，我们定义的 `height` 和 `width` 属性值为 100，这意味着画布的高度为\
