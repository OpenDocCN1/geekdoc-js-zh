    Now that our main "title screen" is ready, let''s work on the routine that makes
    the screen fade to white. To accomplish this, we''re going to use a function fadeToWhite()
    that will call itself every 30 milliseconds until the entire screen is covered
    in white.


    If we want to paint an area with a specific opacity, there are two approaches
    that we can use:


    +   * Specify a color in RGBA or HSLA

    * Change the globalAlpha parameter in the 2D Context to a value between 0.0 (transparent)
    and 1.0 (solid)


    The globalAlpha parameter (which is the approach that we''ll be using) allows
    us to specify with how much opacity elements should be displayed on the screen
    from that point on. Once we set an opacity of, for example, 0.5, all other fillRects,
    fillTexts, drawImages, and similar calls will be 50% translucent.'
  - "[PAGE 23]\n\nThe fadeToWhite() function will look like this:\n\n```\nfunction\
    \ fadeToWhite(alphaVal) {\n  // If the function hasn't received any parameters,\
    \ start with 0.02\n  var alphaVal = (alphaVal == undefined) ? 0.02 : parseFloat(alphaVal)\
    \ + 0.02;\n\n  // Set the color to white\n  c.fillStyle = '#FFFFFF';\n  // Set\
    \ the Global Alpha\n  c.globalAlpha = alphaVal;\n\n  // Make a rectangle big as\
    \ the canvas\n  c.fillRect(0, 0, canvas.width, canvas.height);\n\n  if (alphaVal\
    \ < 1.0) {\n    setTimeout(function() {\n      fadeToWhite(alphaVal);\n    },\
    \ 30);\n  }\n```\n\nAll that is left for us to do now is to attach the click and\
    \ resize events. The complete Example 1-1, shown here, can also be downloaded\
    \ from the official repository, you'll be able to find it as ex1-fullscreen.html\
    \ inside the examples folder. For the sake of brevity, some functions like fadeToWhite()\
    \ and showIntro() are empty, as they were just shown.\n\n# Example 1-1. The opening\
    \ screen\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    UTF-8\" />\n  <title>Example 1 - Title Screen</title>\n</head>\n\n<script>\n \
