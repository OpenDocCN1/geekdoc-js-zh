    \ of sessionStorage (which deletes its contents once the session is over), we\
    \ can't explicitly specify an expiration date.\n- Just with cookies, it’s best\
    \ to not use Web Storage to save anything important.\n\nOther than that, it's\
    \ a great tool that can help us do things that we couldn't do before, like caching\
    \ objects to increase loading performance the next time the user opens our application,\
    \ saving a draft of the document we're working on, or even using it as a virtual\
    \ memory container.\n\nOnce you understand the limitations and capabilities of\
    \ Web Storage, the rest is pretty straightforward:\n\n- Data is stored in an array\
    \ of key-value pairs that are treated and stored like strings.\n- The difference\
