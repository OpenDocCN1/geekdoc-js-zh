    \ sound in the same JavaScript environment as the graphics. Other pieces improve\
    \ your JavaScript, whether breaking up tasks with Web Workers or keeping you informed\
    \ on the player's device with local and session storage.\n\n## Adding Sound with\
    \ the Audio Element\n\nPrevious versions of the HTML spec supported three ways\
    \ of listening to an audio file in our page. We could:\n\n- Use the object or\
    \ embed tags to embed a file or a plugin such as LiveAudio(Netscape Navigator)\
    \ or an ActiveMovie Control (Internet Explorer). As time went by, other plugins\
    \ started to enter the market, such as Macromedia Flash (Adobe Flash), REAL Player,\
    \ or Apple's QuickTime, among others. To embed a MIDI or WAV file, we could either\
    \ use <embed src=\"music.mid\" autostart=\"true\" loops=\"true\"> or embed a proprietary\
    \ third-party plugin such as the Macromedia Flash Player and play the sound through\
    \ our SWF file.\n- Insert a Java Applet and play the sound through it.\n- Add\
    \ the bgsound attribute to the body element of the page (Internet Explorer only).\n\
    \nBrowsers were used to include varying sets of plugins, which meant that our\
    \ sounds might play in one browser but not another, even if both were installed\
    \ on the same computer.\n\nLuckily, with the advent of HTML5, we also gained the\
    \ ability to play audio and video files natively through the use of the <audio>\
    \ and <video> tags.\n\nUnfortunately, the technological limitations in previous\
    \ versions of HTML have been replaced by legal limitations in HTML5. Audio (and\
    \ video) is encoded or decoded with the use of codecs, which are small software\
    \ libraries that let us encode/decode an audio video data file or stream implementing\
    \ a particular algorithm. Some algorithms are optimized for speed; other algorithms\
    \ are optimized for lossless quality; just like software, some of them are royalty-free\
    \ and open and others are licensed.\n\nIn the case of “open” codecs, some companies\
    \ such as Apple and Microsoft worry that they might be infringing a patent, which\
    \ could make them liable in the case of a lawsuit—this is why they don't support\
    \ them in their browsers. The opposite scenario is that other companies, such\
    \ as the Mozilla Foundation or Opera Software, haven't made the necessary arrangements\
    \ needed in order to use some licensed codecs.\n\nFigure 4-1 shows which audio\
    \ codecs are supported by each browser.\n\n| MP3 | WAV | OGG |\n| :--- | :---\
    \ | :--- |\n| Chrome | ✔ | × | ✔ |\n| Explorer 9 | × | × | ✔ |\n| Firefox | ✔\
    \ | ✔ | ✔ |\n| Opera | × | ✔ | ✔ |\n| Safari | ✔ | ✔ | × |\n\nFigure 4-1. Support\
    \ for audio codecs\n\nHopefully,\n\n```html\n<audio controls>\n  <source src=\"\
    ../sounds/song.mp3\" type=\"audio/mpeg\">\n  <source src=\"../sounds/song.ogg\"\
    \ type=\"audio/ogg\">\n</audio>\n```\n\nInstead of defining a single src parameter,\
    \ the HTML5 audio tag allows us to define multiple audio files. If song.mp3 can't\
    \ be played for some reason, the browser will attempt to play the alternative\
    \ song.ogg. If we had more sources, it would try to play every one on the list\
    \ until all of them failed or one of them worked. In addition to the control attribute,\
    \ the HTML5 audio tag also supports other optional attributes:\n\n- loop: Lets\
    \ us load the media file specified in the src attribute or in a source tag.\n\
    - autoplay: Starts playing the sound as soon as it finishes loading.\n- preload:\
    \ Lets us define our source preload strategy:\n  - preload=\"none\": Doesn't preload\
    \ the file, which will be loaded when the user presses the play button.\n  - preload=\"\
    metadata\": Preloads only the metadata of the file.\n  - preload=\"auto\": Lets\
    \ the browser handle the preload of the file (which usually means to preload the\
    \ entire file)\n\nOf course, we can also create and use an HTML5 audio object\
    \ using JavaScript instead of including an audio element in the page.\n\n## Example\
    \ 4-1. Creating HTML5 audio with JavaScript\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Example 4-1 (HTML5\
