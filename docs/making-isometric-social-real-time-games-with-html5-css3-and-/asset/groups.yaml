    \ modify ex14-gui.html to add a background music to our game. The example can\
    \ be found online as ex14-gui-sound.html.\n\n# Managing Computationally Expensive\
    \ Work with the Workers API\n\nNow that we have managed to develop a high-performance\
    \ graphics rendering function for our final game, it would be to implement a path-finding\
    \ function, which will be useful to build roads or to display characters going\
    \ from point A to point B.\n\nIn a nutshell, path-finding algorithms discover\
    \ the shortest route between two points in an n-dimensional space, usually 2D\
    \ or 3D.\n\nUsually, path-finding is one of the areas where only a few people\
    \ can get right—and many people (hopefully not including us) will get wrong. It\
    \ is one of the most expensive processes to execute, and the most efficient solution\
    \ usually requires us to modify the algorithm to customize it to our product.\n\
    \nOne of the best algorithms to handle path finding is A*, which is a variation\
    \ of Dijkstra's algorithm. The problem with any path-finding algorithm—or, for\
    \ that matter, any computationally expensive operation that needs more than a\
    \ couple of milliseconds to"
- md: "\nget solved—is that in JavaScript, they produce an effect called “interface\
    \ locking” in which the browser freezes until the operation has finished.\n\n\
    Fortunately, the HTML5 specification also provides a new API called Web Workers.\
    \ Web Workers (usually just called “workers”) allow us to execute expensive and\
    \ long-lived scripts in the background without affecting the main user interface\
    \ of the browser.\n\n![](img/bc084eea89036c02dab091a0a80afada_107_0.png)\n\nWorkers\
    \ are not silver bullets that magically help us to solve tasks that are eating\
    \ 100% of our CPU processing capabilities. If a task is processor-intensive using\
    \ the conventional approach, it will probably also be processor-intensive when\
    \ workers work and wind up affecting the user experience. However, if a task is\
    \ consuming 30% of the CPU, workers can help us minimize the impact on the user\
    \ interface by executing the task in parallel.\n\nAlso, there are some limitations:\n\
    \n- each worker runs in a totally separate, thread-safe context from the page\
    \ that it executed (also known as a sandbox), they won't have access to the DOM\
    \ and window objects.\n- Although you can spawn new workers from within a worker\
    \ (this feature is not available in Google Chrome), be careful, because this approach\
    \ can lead to bugs that are very difficult to debug.\n\nWorkers can be created\
    \ with this code:\n\n```javascript\nvar worker = new Worker(PATH_TO_A_JS_SCRIPT);\n\
    ```\n\nwhere PATH_TO_A_JS_SCRIPT could be, for example, astar.js. Once our worker\
    \ has been created, we can terminate the execution at any given time by calling\
    \ worker.close(). If a worker has been closed, we need to perform a new operation,\
    \ or create a new worker object.\n\nBack and forth communication with Web Workers\
    \ is accomplished using the worker.postMessage(object) method to send a message\
    \ and defining a callback function on the worker.onmessage event. Additionally,\
    \ you can define an onerror handler to process errors on the worker.\n\nJust like\
    \ a conventional page, Web Workers allow us to call external scripts by the function\
    \ importScripts(). This function accepts zero or multiple parameters (each parameter\
    \ is a JavaScript file).\n\nAn example implementation of the A* algorithm in JavaScript\
    \ called Web Workers can be found in the code repository as ex17-grid-astar.html.\
    \ Figure 4-2 shows that worker's progress. The code is shown in Example 17 and\
