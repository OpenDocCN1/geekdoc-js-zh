    \ and/ modify the contents of our storage folder at any time.\n- Browsers can\
    \ also decide to “expire” the content of our storage folder.\n- The quota is given\
    \ per domain name, and shared by all the subdomains (i.e., site1.example.com,\
    \ site2.example.com, and site3.example.com share the same folder).\n\nHowever,\
    \ Web Storage differs from cookies in the following ways:\n\n- The data saved\
