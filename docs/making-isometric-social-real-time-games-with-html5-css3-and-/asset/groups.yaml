    在 Twitter 上关注我们：http://twitter.com/oreillymedia\n在 YouTube 上观看我们：http://www.youtube.com/oreillymedia\n\
    \n## 致谢\n\n感谢我的未婚妻 Regina、我的父亲 Rubén、我的家人、我亲密的朋友和同事们。感谢 Minor Studios 的所有人，特别是\
    \ CEO Martín Repetto 和 Xavier Amado。我还想感谢我非常有帮助的编辑 Simon St.Laurent；感谢 Shelley\
    \ Powers 极其见地的技术评审；以及 O'Reilly 的其他让这一切成为可能。\n\n## 第 1 章\n\n## 图形基础：Canvas 与精灵\n\
    \nHTML5 的 `canvas` 元素使得创建复杂的图形游戏变得简单得多，比依赖于通过文档对象模型（DOM）移动图像的旧方法提供了更大的活性和速度。Canvas\
    \ 允许您使用 JavaScript 直接在屏幕区域上进行绘图，让您能够在 Web 环境下应用传统的游戏图形方法。尽管它是 HTML 宇宙中最近添加的内容，但在较新的桌面和移动浏览器中已得到广泛支持。\n\
    \n## 使用 canvas 对象工作\n\n`canvas` 元素允许我们在屏幕上定义一个极快速的可绘制区域，可以使用 JavaScript 进行像素级的精确控制。然而，canvas\
    \ 工作在立即模式下。与可缩放矢量图形（SVG，本书未涵盖）不同，我们对 HTML5 Canvas API 进行的调用会直接在 canvas 中绘制图形，一旦显示出来，就不会再对它们保留任何引用。如果我们想将图形向右移动\
    \ 10 像素，我们需要清除显示并使用新坐标重新绘制。稍后，我们将讨论一种名为“自适应刷新”的技术，它可以避免仅仅为了修改 canvas 的一小部分就清空整个显示。\n\
    \n你可以将 canvas 看作一张纸；你现在有了许多蜡笔（以及其他工具），可以在上面画画。所以，例如如果你想画一条红线，就拿起红色蜡笔画出这条线。如果你想画一条绿线，就拿起绿色蜡笔。你的绘图“样式”也是同的。如果你想画一条从左上角到右下角的\
    \ 45 度线，你既可以在不移动纸的情况下画，也可以将纸向右倾斜 45 度，然后从顶部到部画一条直线。（显然，第一种方法更有效。）\n\n访问 HTML5\
    \ Canvas API 非常简单。首先，在您的页面中添加新的 HTML5 `canvas` 标签并为其分配一个 `id` 属性：\n\n```\n<canvas\
    \ id=\"game\" width=\"100\" height=\"100\">\n  您的浏览器不支持 canvas 标签。\n</canvas>\n\
    ```\n\n`canvas` 标签内部的文本将显示不支持该对象的浏览器。稍后，您将学习如何使用名为 Modernizn 的 JavaScript 库更高效地发现并处理此类不兼容性。\n\
    \n您需要在 `canvas` 标签内部指定宽度和高度。尽管您可以使用 CSS 强制 canvas 达到特定的宽度和高度，但当您使用 JavaScript\
    \ 引用对象时，它将返回默认尺寸（300x150 像素），完全覆盖您可能通过 CSS 分配的任何值。然而，您可以在 JavaScript 中动态地修改 HTML5\
    \ Canvas 对象的宽度和高度。\n\n![](img/bc084eea89036c02dab091a0a80afada_17_0.png)\n\n为了开始使用\
    \ HTML5 Canvas API，我们只需要通过其 `id` 属性值（myCanvas）引用 `canvas` 标签，这将允许我们获取 2D 绘图上下文的引用（“3D\
    \ 上下文”是 WebGL，本书未涵盖）。\n\n```\nwindow.onload = function () {\n  var canvas = document.getElementById('game');\n\
    \  var c = canvas.getContext('2d');\n}\n```\n\n或者，您可以动态创建一个 HTML5 Canvas 对象：\n\
    \n```\nwindow.onload = function () {\n  var canvas = document.createElement('canvas');\n\
    \  var c = canvas.getContext('2d');\n}\n```\n\n在上一个示例中，对 2D 绘图上下文的引用存储在变量 `c`\
    \ 中（在许多其他示例中，此变量可能被命名为 `ctx`）。所有对 canvas API 的调用将通过此变量完成。作为一个初始示例，我们将处理用户在加载游戏时使用的第一件事：标题屏幕。稍后，我们将扩展它以支持图像和声音等资源的预加载。\n\
    \n我们的标题屏幕将显示在整个浏览器窗口，由一张显示游戏 Logo 以及下方文字“点击或触摸屏幕开始游戏”组成。当您点击窗口时，标题屏幕将平滑地变为白色。\n\
    \n为了开始这样做，我们需要添加支持游戏的基础 HTML 代码。在大多数情况下，页面看起来像一个传统的 HTML 页面：\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <title>Example\
    \ 1 - Title Screen</title>\n<script>\n  // JavaScript 代码在这里\n</script>\n  <style\
    \ type=\"text/css\" media=\"screen\">\nhtml { height: 100%; overflow: hidden }\n\
    body {\n  margin: 0px;\n  padding: 0px;\n  height: 100%;\n}\n</style>\n</head>\n\
    <body>\n<canvas id=\"game\" width=\"100\" height=\"100\">\n  您的浏览器不支持 canvas 标签。\n\
    </canvas>\n</body>\n</html>\n```\n\n上述代码中的小型 CSS 块允许我们强制页面达到窗口高度的百分比，并且 **overflow:\
    \ hidden** 防止在超出屏幕区域时出现垂直或水平滚动条。\n\n现在模板已完成，我们可以通过在页面的 `<script>` 标签中添加以下 JavaScript\
    \ 代码开始使用 HTML5 Canvas API：\n\n```javascript\nwindow.onload = function () {\n \
    \ var canvas = document.getElementById('game');\n\n  // 强制 canvas 动态调整大小使其\n \
    \ // 与浏览器窗口的宽度/高度一致\n  canvas.width = document.body.clientWidth;\n  canvas.height\
    \ = document.body.clientHeight;\n\n  var c = canvas.getContext('2d');\n\n  //\
    \ 用黑色背景填充屏幕\n  c.fillStyle = '#000000';\n  c.fillRect(0, 0, canvas.width, canvas.height);\n\
    \n  var phrase = \"点击或触摸屏幕开始游戏\";\n  c.font = 'bold 16px Arial, sans-serif';\n\
    \  c.fillStyle = '#FFFFFF';\n  c.fillText(phrase, 10, 30);\n}\n```\n\n让我们逐步分析这段代码。\n\
    \n"
