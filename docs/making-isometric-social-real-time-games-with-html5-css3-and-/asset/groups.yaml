    # CHAPTER 5


    # Connecting the Game to People


    You''ve built an attractive game with interactive graphics and music. Now you
    just need to set things up to bring people in! That means putting logic on the
    server, keeping people from tinkering with your logic to break things (in their
    favor), and connecting your application to a place with a lot of people unexpected—Facebook!


    # Cheat Prevention and Server-Side Operations


    One of the main issues when developing an online video game is cheat prevention.
    Just like in conventional web development, we can''t trust any user, securing
    our application against malicious users and handling unexpected inputs or return
    values should always be our priority.


    The risk is even greater in online games, particular those built with web technologies
    such as JavaScript and HTML, in which one can tamper with variables (or even POST/GET
    requests) or even modify code on the client in real time. Unfortunately, the solution
    to this problem varies from game to game, but almost always relies on two important
    (and usually inefficient) approaches that need to be solved in the development
    stages of game creation:


    - To minimize the risk of fraud on the client

    - Validate everything on the server


    In the case of our game, and in most real-time strategy games, these are some
    of the things we need to keep in mind:


    - Every user should have their own account balance stored in a database table
    (depending on whether you want to keep track of individual transactions) and update
    the balance

    - We need to keep a Unix time value on the server and sync the value with the
    client regularly


    Perhaps the most important thing to keep in mind (and the most reliable anti-cheating
    method) is that we need to design the game in such a way to predict the user score
    at any given time on the server without interacting with the client. How do we
    do that? Let''s consider the following scenario:


    Initially, the user has a balance of 2000 gold coins, 0 buildings, "creation time"
    of 1293861600 (which is the Unix timestamp for January 1, 2011, 00:00:00) and
    "last update" time of 1293861600 (same timestamp as the start time). We have three
    possible structures we can build:


    - An ice cream shop that costs 250 gold coins and pays 5 gold coins every 30 minutes

    - A hotel that costs 1000 gold coins and pays 30 gold coins per hour

    - A cinema that costs 500 gold coins and pays 12 gold coins every 30 minutes


    The user builds an ice cream shop at 1293861660 (January 1, 2011, 00:01:00). He
    decides to build a hotel at 1294048400 (January 3, 2011, 14:00:00). At 1294120800
    (January 4, 2011, 00:00:00), the user builds a cinema. At 1294639200 (January
    10, 2011, 00:00:00), he returns to the game and wants to see his account balance.


    One approach to handle this situation would be to keep track of all the buildings
    the user has purchased and add a "last update" field in the user''s account. Then,
    every time he wants to see his account balance or does a buy/sell operation, we
    would perform the following steps:


    1. Update the "last update" field of the user with the current timestamp.

    2. Cycle through all the buildings that the user owns.

    3. Calculate the time difference (in seconds) between the current time and the
    "last update" field of the user.

    4. Divide the result by the number of payment fractions, and "floor" the result.

    5. Multiply the result by the number of gold coins given on each fraction.

    6. Update the account balance by adding up the result.

    7. Depending on the operation we are performing (show, build, or sell), either
    show the account balance or subtract/add the cost of the building.

    8. If we are selling a building, delete the association.


    If we apply this method to the example scenario described, we can deduce the following:


    - On 1293861660, the user decided to build an ice cream shop. At the time, he
    had 0 other buildings, so we just need to update his account balance and his "last
    update" time and create an association. The "last update" time of this association
    will be 1293861660.

    - The user''s account balance will now be 1750 (2000 – 250).

    - On 1294084800, he decided to build a hotel. Before we recalculate his account
    balance, we know that he purchased the ice cream shop, so we update the "last
    update" field of the user to 1294084800; in order to know how much income the
    ice cream shop has created, we perform the following calculation:


    ```

    timeDiff = 1294084800 - 1293861660 = 223140 seconds

    ```


    Ice cream shops generate a profit of 5 gold coins every 30 minutes (1800 seconds),
    so we need to do this calculation:


    ```

    result = timeDiff / 1800 seconds = 123.96

    ```


    or just 123 when we floor the result:


    ```

    result = result * 5 = 615 gold coins

    ```


    We finally update the account balance to 1750 + 615 = 2365, and take away the
    cost of the hotel (using 1294084800 as the "last update" time), the user''s account
    balance will now be 1365.


    - On 1294120800, he purchased a cinema, so we perform the same steps as before:


    ```

    timeDiff = 1294120800 - 1294084800 = 36000 seconds

    ```


    The hotel generates a profit of 30 gold coins every hour (3600 seconds), so we
    need to do this calculation:


    ```

    result = timeDiff / 3600 seconds = 10

    ```


    ```

    result = result * 30 = 300 gold coins

    ```


    We finally update the account balance to 1365 + 300 = 1665, and take away the
    cost of the cinema (using 1294120800 as the "last update" time), the user''s account
    balance will now be 1165.


    - Finally, on 1294639200, he wants to check his account balance again:


    ```

    timeDiff = 1294639200 - 1294120800 = 518400 seconds

    ```


    The cinema generates a profit of 12 gold coins every 30 minutes (1800 seconds),
    so we need to do this calculation:


    ```

    result = timeDiff / 1800 seconds = 288

    ```


    ```

    result = result * 12 = 3456 gold coins

    ```


    We finally update the account balance to 1165 + 3456 = 4621.


    Although it will be extremely difficult, if not impossible, to prevent the user
    from modifying the client side of our game, using the method explained previously,
    we can certainly prevent malicious users from gaining an unfair advantage over
    other players, as the modifications that they make affect them only, not on the
    server. Another useful feature that could be added to this is a concept used by
    Zynga in some of their games, that instead of generating profit constantly—as
    in this case—the user must "collect” the profit generated by the building. For
    example, if a building generates 500 coins every 30 minutes and the user didn''t
    play for 3 days, when he collects he will be awarded 500 coins. What we need to
    implement this approach is to check whether the result of the time difference
    is greater than the profit generated by the building; if so, a flag should be
