    \ WebStorage API——或者在在线数据库中。为了简单起见，在我们的游戏中我们将处理一个 250x250 的网格（62,500 个瓦片），并将内存分页函数的实现留给读者作为练习题。\n\
    \n目前，我们将专注于使用正方形显示我们的网格，稍后，我们将切换到等轴测视图。\n\n假设我们有一个包含 6,250,000 个瓦片的巨大网格（2,500\
