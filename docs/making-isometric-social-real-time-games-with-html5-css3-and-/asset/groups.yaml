    # Adding a Social Networking Layer Using Facebook


    Adding a social layer to our game using Facebook can be done easily by filling
    out some forms and implementing just a few lines of code. First, we''ll need to
    create a new Facebook application by going to http://www.facebook.com/developers/
    and clicking on the Create New App button, which takes you to a Facebook Application
    Creation wizard that will allow us to integrate our game with Facebook.


    Once you click the Create New App button, you''ll see something like Figure 5-8
    asking you to name your app.


    Just type any name you want (which will be the application title seen by your
    users when they install the game), agree to the Terms of Service and click Create
    App. I named mine Tourist Resort. This name doesn''t have to be unique, so feel
    free to name your game Tourist Resort as well.'
