    \ about our books, courses, conferences, and news, see our website at http://www.oreilly.com.\n\
    \nFind us on Facebook: http://facebook.com/oreilly\nFollow us on Twitter: http://twitter.com/oreillymedia\n\
    Watch us on YouTube: http://www.youtube.com/oreillymedia\n\n## Acknowledgments\n\
    \nThank you to my fiancée Regina, my father Rubén, my family, my closest friends,\
    \ and my colleagues. To everyone at Minor Studios, especially CEO Martín Repetto\
    \ and Xavier Amado. I'd also like to thank Simon St.Laurent, my incredibly helpful\
    \ editor; Shelley Powers, for her very insightful technical review; and everyone\
    \ else at O'Reilly who made this possible.\n\n## CHAPTER 1\n\n## Graphics Foundations:\
    \ Canvas and Sprites\n\nHTML5’s canvas element makes it much easier to create\
    \ complex graphic games, offering far more flexibility and speed than older approaches\
    \ that relied on moving images around with the Document Object Model (DOM). Canvas\
    \ lets you draw on an area of the screen directly with JavaScript, letting you\
    \ apply traditional game graphics approaches in a web context. Though it's a recent\
    \ addition to the HTML universe, canvas is widely supported on newer desktop and\
    \ mobile browsers.\n\n## Working with the canvas Object\n\nThe canvas element\
    \ allows us to define an extremely fast drawable region on screen that can be\
    \ controlled using JavaScript with pixel-level accuracy. However, canvas works\
    \ in immediate mode. Unlike Scalable Vector Graphics (SVG, not covered in this\
    \ book), the calls that we make to the HTML5 Canvas API draw the graphics directly\
    \ in the canvas, without holding any reference to them once they are displayed.\
    \ If we want to move our graphics 10 pixels to the right, we need to clear the\
    \ display and redraw them using the new coordinates. Later on, we discuss a technique\
    \ called \"adaptive refresh\" that avoids clearing the whole display just to modify\
    \ a small part of the canvas.\n\nYou can look at the canvas as if it were a piece\
    \ of paper; you now have many crayons (among other tools) that you can use to\
    \ draw on it. So if, for example, you want to draw a red line, grab the red crayon\
    \ and draw the line. If you want to draw a green line, grab the green crayon.\
    \ Same thing goes for your drawing \"style\". If you want to draw a 45° line that\
    \ goes from the top left to the bottom right, you can either draw it without moving\
    \ the paper at all, or tilt the paper 45° to the right and draw a straight line\
    \ from the top to the bottom. (Obviously, the first approach is more efficient.)\n\
    \nAccessing the HTML5 Canvas API is pretty easy. First, add the new HTML5 canvas\
    \ tag to your page and assign an id attribute to it:\n\n```\n<canvas id=\"game\"\
    \ width=\"100\" height=\"100\">\n  Your browser doesn't include support for the\
    \ canvas tag.\n</canvas>\n```\n\nThe text inside the canvas tag will be shown\
    \ to the browsers that do not support the object. Later you will learn to discover\
    \ and handle these sorts of incompatibilities more efficiently using a JavaScript\
    \ library called Modernizn.\n\nYou need to specify the width and height inside\
    \ the canvas tag. Even though you can force canvas to a certain width and height\
    \ with CSS, when you reference the object using JavaScript, it will return the\
    \ default size (300x150 pixels), completely overrunning any values that you may\
    \ have assigned via CSS. However, you can modify the width and height of an HTML5\
    \ Canvas object dynamically in JavaScript.\n\n![](img/bc084eea89036c02dab091a0a80afada_17_0.png)\n\
    \nIn order to start using the HTML5 Canvas API, we just need to reference the\
    \ canvas tag by using its id attribute value (myCanvas), which will allow us to\
    \ get to reference the 2D drawing context (The \"3D Context\" is WebGL, which\
    \ is not covered in this book.)\n\n```\nwindow.onload = function () {\n  var canvas\
    \ = document.getElementById('game');\n  var c = canvas.getContext('2d');\n}\n\
    ```\n\nAlternatively, you can create an HTML5 Canvas object dynamically:\n\n```\n\
    window.onload = function () {\n  var canvas = document.createElement('canvas');\n\
    \  var c = canvas.getContext('2d');\n}\n```\n\nIn the previous example, the reference\
    \ to the 2D drawing context is stored in the c variable (in many other examples,\
    \ this variable might be called ctx). All further calls to the canvas API will\
    \ be done through this variable. As an initial example, we're going to work on\
    \ the very first thing that users will use when they load the game: The Title\
    \ Screen. Later, we're going to extend it to support the preloading of resources\
    \ such as images and sounds.\n\nOur title screen, which will be displayed throughout\
    \ the entire browser window, will consist of an image showing the logo of our\
    \ game and a text below it with the phrase \"Click or tap the screen to start\
    \ the game.\" When you click on the browser window, the title screen will smoothly\
    \ fade to white.\n\nIn order to get started with this, we need to add the basic\
    \ HTML code that will support the game. In most cases, the page is going to look\
    \ like a conventional HTML5 page:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    <head>\n  <meta charset=\"UTF-8\" />\n  <title>Example 1 - Title Screen</title>\n\
    <script>\n  // Javascript code goes here\n</script>\n  <style type=\"text/css\"\
    \ media=\"screen\">\nhtml { height: 100%; overflow: hidden }\nbody {\n  margin:\
    \ 0px;\n  padding: 0px;\n  height: 100%;\n}\n</style>\n</head>\n<body>\n<canvas\
    \ id=\"game\" width=\"100\" height=\"100\">\n  Your browser doesn't include support\
    \ for the canvas tag.\n</canvas>\n</body>\n</html>\n```\n\nThe small CSS block\
    \ in the previous code allows us to force the page to be 100 percent of the height\
    \ of the window, and **overflow: hidden** prevents vertical and horizontal scrollbars\
    \ from showing up if we exceed the visible area on the screen.\n\nNow that our\
    \ template is complete, we can start using the HTML5 Canvas API by adding the\
    \ following JavaScript code inside the `<script>` tag of our page:\n\n```\nwindow.onload\
    \ = function () {\n  var canvas = document.getElementById('game');\n\n  // Force\
    \ canvas to dynamically change its size to\n  // the same width/height as the\
    \ browser window\n  canvas.width = document.body.clientWidth;\n  canvas.height\
    \ = document.body.clientHeight;\n\n  var c = canvas.getContext('2d');\n\n  //\
    \ Fill the screen with a black background\n  c.fillStyle = '#000000';\n  c.fillRect(0,\
    \ 0, canvas.width, canvas.height);\n\n  var phrase = \"Click or tap the screen\
    \ to start the game\";\n  c.font = 'bold 16px Arial, sans-serif';\n  c.fillStyle\
    \ = '#FFFFFF';\n  c.fillText(phrase, 10, 30);\n}\n```\n\nLet's go through this\
    \ code step by step.\n"
