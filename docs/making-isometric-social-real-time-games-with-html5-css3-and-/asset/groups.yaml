    \n```\nvar phrase = 'Click or tap the screen to start the game';\nc.font = 'bold\
    \ 16px Arial, sans-serif';\nvar mt = c.measureText(phrase);\nvar xcoord = (canvas.width\
    \ / 2) - (mt.width / 2);\nc.fillStyle = '#FFFFFF';\nc.fillText(phrase, xcoord,\
    \ 30);\n```\n\n所以我们已经绘制了画布，并将一个十六进制颜色值作为 `fillStyle()` 方法的参数。canvas 还支持其他样式：\n\
    \n- 颜色可以使用 'red' 或 'black'\n- 格式为 `rgb(Red, Green, Blue)` 的 RGB 值\n- 格式为 `rgba(Red,\
    \ Green, Blue, Alpha)` 的 RGBA 值，其中 Alpha 参数（透明度）从 0.0 到 1.0\n- 格式为 `hsl(Percentage,\
    \ Percentage, Percentage)` 的 HSL 值\n- 格式为 `hsla(Percentage, Percentage, Percentage,\
    \ Alpha)` 的 HSLA 值\n\n如果纯色不能满足你的需求，canvas 还可以：\n\n- 使用 `createLinearGradient()`\
    \ 显示线性渐变\n- 使用 `createRadialGradient()` 显示径向渐变\n- 使用 `createPattern()` 显示图像/视频图案\n\
    \n为了创建一个显示黑色背景上漂亮蓝色渐变的示例，我们可以使用以下代码：\n\n```\nvar grd = c.createLinearGradient(0,\
    \ 0, canvas.width, canvas.height);\ngrd.addColorStop(0, '#EeeCff');\ngrd.addColorStop(1,\
    \ '#2bc8ff');\n```\n\n```\nc.fillStyle = '#fff';\nc.fillRect(0, 0, canvas.width,\
    \ canvas.height);\n```\n\n在画布上显示图像就像使用 `drawImage()` 方法显示文本一样简单：\n\n```\nvar img\
