    \ JavaScript 环境中编写游戏。其他部分也改进了你的 JavaScript，无论是通过 Web Workers 分配任务，还是通过本地存储和会话存储让你了解玩家设备上的相关信息。\n\
    \n## 使用 Audio 元素添加音频\n\n之前的 HTML 规范支持三种在页面中播放音频文件的方法。我们可以：\n\n- 使用 `object` 或\
    \ `embed` 标签来嵌入文件或插件，例如 LiveAudio (Netscape Navigator) 或 ActiveMovie Control (Internet\
    \ Explorer)。随着时间的推移，其他插件开始进入市场，例如 Macromedia Flash (Adobe Flash)、REAL Player 或\
    \ Apple 的 QuickTime 等。要嵌入 MIDI 或 WAV 文件，我们可以使用 `<embed src=\"music.mid\" autostart=\"\
    true\" loops=\"true\">` 或者嵌入专有的第三方插件（如 Macromedia Flash Player）并通过我们的 SWF 文件播放声音。\n\
    - 插入 Java Applet 并通过它播放声音。\n- 在页面的 `body` 元素上添加 `bgsound` 属性（仅限 Internet Explorer）。\n\
    \n浏览器通常包含不同的插件集，这意味着我们的声音可能在一个浏览器中播放而在另一个浏览器中无法播放，即使它们都安装在同一台电脑上。\n\n幸运的是，随着 HTML5\
    \ 的出现，我们获得了通过使用 `<audio>` 和 `<video>` 标签原生播放音频视频文件的能力。\n\n遗憾的是，之前 HTML 版本中的技术限制被\
    \ HTML5 中的法律限制所取代。音频（和视频）使用解码器（codecs）进行编码或解码，解码器是小型软件库，允许我们通过实现特定算法来编码/解码音频视频文件或流。某些算法针对速度进行了优化；另一些算法针对无损质量进行了优化；就像软件一样，其中一些是免费且开源的，而另一些则需要许可。\n\
    \n在“开源”解码器的情况下，像苹果和微软这样的公司担心他们可能侵犯了专利，这可能导致他们在诉讼中承担法律责任——这就是为什么他们不在自己的浏览器中支持它们。相反的情况是，像\
    \ Mozilla 基金或 Opera Software 这样的公司尚未为某些受许可的解码器做出必要的安排。\n\n图 4-1 显示了每个浏览器支持哪些音频解码器。\n\
    \n| MP3 | WAV | OGG |\n| :--- | :--- | :--- |\n| Chrome | ✔ | × | ✔ |\n| Explorer\
