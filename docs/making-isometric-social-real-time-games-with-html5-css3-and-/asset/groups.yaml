    \ events, which impose a penalty of 250 and 600 milliseconds depending on the\
    \ hardware. In order to alleviate this issue, we need to detect whether the device\
    \ supports touch events such as touchstart, touchmove, and touchend, and detect\
    \ gestures by gesturestart and gestureend.\n\nWe can detect and manage both clicks\
    \ and touch events using the Modernizr library. Modernizr returns true if the\
    \ device supports touch events, which means that we can do this:\n\n```\nvar pointer\
    \ = {\n  DOWN: 'mousedown',\n  UP: 'mouseup',\n  MOVE: 'mousemove'\n};\n```\n\n\
    ```\nif (Modernizr.touch) {\n  pointer.DOWN = 'touchstart',\n  pointer.UP = 'touchend',\n\
    \  pointer.MOVE = 'touchmove'\n}\n```\n\n```\nwindow.addEventListener('resize',\
    \ function() { doResize(canvas); }, false);\ncanvas.addEventListener(pointer.DOWN,\
    \ handleMouseDown, false);\ncanvas.addEventListener(pointer.MOVE, handleDragDrag,\
    \ false);\ndocument.body.addEventListener(pointer.UP, handleMouseUp, false);\n\
    ```\n\n```\nif (Modernizr.touch) {\n  // Detect gestures\n  document.body.addEventListener('gestureend',\
    \ handleGestureEnd, false);\n}\n```\n\n```\nelse {\n  // Detect scrolling\n  document.body.addEventListener('keydown',\
    \ handleKeyDown, false);\n  document.body.addEventListener('mousewheel', handleScroll,\
    \ false);\n  document.body.addEventListener('DOMMouseScroll', handleScroll, false);\n\
    }\n```\n\nNow that our codebase is getting bigger and more complex, we're also\
    \ going to create a Game class to simplify the amount of work; we'll also divide\
    \ the code on the page into multiple scripts.\n\nThe complete code in Example\
    \ 3-1 is online as ex14-gui.html in the official code repository. See Figure 3-3.\
    \ You can also find ex14-gui-sound.html in the code repository; it is the same\
    \ example with music playing in the background."
