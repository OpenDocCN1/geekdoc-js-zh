    \ when we say \"5 MB,\" it can actually be more or less than that, depending on\
    \ which browser we are using—the space quota is defined in our settings panel.\
    \ In some cases (as in Opera)—the Web Storage capabilities could be disabled.\
    \ If we exceed the 5 MB, the browser will throw a QUOTA_EXCEEDED_ERR, which is\
    \ very important to surround calls to localStorage or sessionStorage in a try-catch\
    \ block—and just like we should—handle exceptions appropriately.\n\nExpect Web\
    \ Storage to behave very similarly to cookies:\n\n- We have a maximum amount of\
