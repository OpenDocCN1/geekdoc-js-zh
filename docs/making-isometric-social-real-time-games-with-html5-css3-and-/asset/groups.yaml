    \n另一个能让场景更具可信度的效果是添加阴影。在二维平面上投影阴影有多种技术和算法；然而，大多数情况下，我们需要一个或多个光源，这也要求我们进行多次计算，特别是当我们有多个对象时（我们确实如此）。\n\
    \n由于场景中的对象在大部分时间里都是静态的，我们可以高效地采取以下任一：\n\n- 为每个单独的建筑绘制阴影纹理\n- 动态生成阴影\n\n在这种情况下，我们将使用第二种方法，因为它让我们拥有定义伪光源或动态控制阴影强度的可能。这种方法包括绘制原始建筑的轮廓，同时对其进行倾斜和旋转并降低\
    \ alpha 值。例如，如果我们从东南方向的光线方向来绘制纹理，那么阴影应该投影到西北部。如果我们从西南方向的光源来绘制，阴影将投影到东北部，以此此类推。图\
    \ 5-6 将让你更好地理解我们正在尝试做什么。\n\n![](img/bc084eea89036c02dab091a0a80afada_143_0.png)\n\
    \n图 5-6. 为建筑添加轮廓\n\n为了实现这种方法，我们将求助于之前见过的两个 HTML5 Canvas 函数：`getImageData()` 和\
    \ `putImageData()`，并将这些功能直接构建到 sprite 对象中。\n\n首先，我们将修改 Sprite 类并添加一个空属性：\n\n```javascript\n\
    this.shadow = null;\n```\n\n接下来，我们修改 `draw()` 方法，使其能够可选地接受一个 `drawShadow` 参数，这是一个布尔值，指示我们是否想要为正在绘制的\
    \ sprite 画阴影。一个子程序将检查 `this.shadow` 是否为 `null`，并执行所有必要的处理将图像转换为图像数组，以便稍后通过 `putImageData()`\
    \ 使用。轮廓效果的结果将存储在我们的 `this.shadow` 属性中，这样下次需要使用它时，就不需要再次进行所有的图像预处理了。不过请注意，这种方法比使用预制图像（如我们的阴影）效率低，但它给了我们更大的控制力和灵活性：\n\
    \n```javascript\nif (this.show) {\n  if (drawShadow !== undefined && drawShadow)\
    \ {\n    if (this.shadow === null) { // 影子尚未创建\n      var scnv = document.createElement(\"\
    canvas\");\n      var sctx = scnv.getContext(\"2d\");\n\n      scnv.width = this.width;\n\
    \      scnv.height = this.height;\n\n      sctx.drawImage(this.spritesheet,\n\
    \        this.offsetX,\n        this.offsetY,\n        this.width,\n        this.height,\n\
    \        0,\n        0,\n        this.width * this.zoomLevel,\n        this.height\
    \ * this.zoomLevel);\n\n      var idata = sctx.getImageData(0, 0, scnv.width,\
    \ scnv.height);\n\n      for (var i = 0, len = idata.data.length; i < len; i +=\
    \ 4) {\n        idata.data[i] = 0; // R\n        idata.data[i + 1] = 0; // G\n\
    \        idata.data[i + 2] = 0; // B\n      }\n\n      sctx.clearRect(0, 0, scnv.width,\
    \ scnv.height);\n      sctx.putImageData(idata, 0, 0);\n\n      this.shadow =\
    \ sctx;\n    }\n\n    c.save();\n    c.globalAlpha = 0.3;\n    var sw = this.width\
    \ * this.zoomLevel;\n    var sh = this.height * this.zoomLevel;\n    c.drawImage(this.shadow.canvas,\
    \ this.posX, this.posY - sh, sw, sh * 2);\n    c.restore();\n  }\n\n  c.drawImage(this.spritesheet,\n\
    \    this.offsetX,\n    this.offsetY,\n    this.width,\n    this.height,\n   \
    \ this.posX,\n    this.posY,\n    this.width * this.zoomLevel,\n    this.height\
    \ * this.zoomLevel);\n}\n```\n\n最终结果看起来如图 5-7。\n\n![](img/bc084eea89036c02dab091a0a80afada_145_0.png)\n\
