- md: "\nIn a nutshell, when users access http://apps.facebook.com/tourist-resort,\
    \ Facebook will automatically call our Canvas URL, passing some parameters to\
    \ help with the authentication.\n\nThen, we just need to include the Facebook\
    \ API files, make a new instance of the Facebook object using our Application\
    \ ID and Application Secret, and we'll get access to the user's information:\n\
    \n```php\n<?php\nrequire 'facebook/src/facebook.php';\n\n$fb = new Facebook(array(\n\
    \    'appid' => '<YOUR_APPLICATION_ID>',\n    'secret' => '<YOUR_APPLICATION_SECRET>',\n\
    ));\n\n$user = $fb->getUser();\necho '<pre>';\nprint_r($user);\necho '</pre>';\n\
    ?>\n```\n\nIf the user is not logged in to Facebook or hasn't authorized your\
    \ application, the output of the $user variable will be zero. A more reliable\
    \ method to detect this occurrence is to use the approach taken in example.php,\
    \ which is included in the Facebook PHP SDK:\n\n```php\n<?php\nif ($user) {\n\
    \  try {\n    $user_profile = $fb->api('/me');\n  } catch (FacebookApiException\
    \ $e) {\n    $user = null;\n  }\n}\n?>\n```\n\n$fb->api('/me') tries to fill the\
    \ $user_profile variable by querying Facebook's Graph API for your user (for more\
    \ information about the Facebook Graph API, see http://developers.facebook.com/docs/reference/api/)\
    \ and throws an exception if an occurs.\n\nIn order to let the user sign in to\
    \ our application using her Facebook credentials, add the following lines:\n\n\
    ```php\n<?php\n$loginUrl = $fb->getLoginUrl();\n?>\n```\n\n<a href=\"$loginUrl?\"\
    >Sign In</a></a>\n\nWhen the user clicks Sign In, Facebook will show the authorization\
    \ dialog in Figure 5-12.\n\n![](img/bc084eea89036c02dab091a0a80afada_149_0.png)\n\
    \nFigure 5-12. Will the user grant permission?\n\nOnce the user decides to allow\
    \ our application to access her data, the page will be reloaded; this time, the\
    \ $user variable will be filled with the Facebook User ID and the $user_profile\
