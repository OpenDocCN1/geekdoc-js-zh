  - "[PAGE 139]\n\n# # Polishing the Game\n\nThe finishing touches are the things\
    \ that makes a certain product (in our case, a game) feel special. Although the\
    \ game so far is functional, it still feels plain, boring, and discouraging.\n\
    \nOne method that we can use to make our game feel more alive is adding dynamic\
    \ objects floating around or over the city, like clouds. Instead of using canvas\
    \ to display them (which means we would need to repaint every time the clouds\
    \ moves), we can accomplish the same effect using CSS3 animations.\n\nCSS3 animations\
    \ allow us to modify one or multiple CSS properties over a number of keyframes\
    \ in the following:\n\n```\n@moveToRight {\n0% {\n  left: 0px\n}\n\n50% {\n  left:\
    \ 100px\n}\n}\n```\n\nOnce we have defined the animation keyframes (in this case,\
    \ the element will start on position left: 0px and will move to position left:\
    \ 200px), we need to define other animation properties such as:\n\nanimation-timing-function\n\
    Controls how each keyframe transitions to the next. Possible values are ease,\
    \ linear, ease-in, ease-out, cubic-bezier(number, number, number).\n\nanimation-name\n\
    Specifies the name of our animation (in this case, it would be moveToRight).\n\
    \nanimation-duration\nControls how long the entire animation should last.\n\n\
    animation-iteration-count\nAccepts either an integer value or \"infinite\" and\
    \ controls how many times our animation should be played.\n\nanimation-direction\n\
    Allows us to define the \"direction\" of the animation. The possible values are\
    \ normal (always animates from keyframe 0 to keyframe 100) or alternate (animates\
    \ from keyframe 0 to keyframe 100, and then from keyframe 100 to keyframe 0)."
