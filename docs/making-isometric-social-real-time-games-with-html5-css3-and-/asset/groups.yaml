    # # Preface


    Addictive, frustrating. Fun, boring. Engaging, repetitive. Casual, demanding.


    These words may contradict each other, but they express the roller coaster of
    sentiments felt by real-time strategy games players like me. I remember spending
    hours playing brilliant games such as EA/Maxis’s SimCity and SimCity2000, Chris
    Sawyer’s Transport Tycoon, or Bullfrog Productions’ Theme Hospital, wondering
    why only a few of my friends (usually the geekiest one) had played them.


    Today, I see children and teenagers, grandmothers and soccer moms, and frat boys
    computer playing games such as Zynga’s FarmVille or CityVille, Playdom’s Social
    City, or Playfish’s Empire for hours, ignorant of the existence of those games’
    predecessors: a golden age of isometric real-time games that they’ll probably
    never play.


    What changed?


    This recent surge of real-time games was caused partly by Zynga’s incredible ability
    to “keep the positive things and get rid of the negative things” in this particular
    genre of games, and by a shift in consumer interests. They took the frustration
    of figuring out no one was “moving to your city” (in the case of SimCity) and
    replaced it with adding friends to be your growing neighbors. They take advantage
    of Facebook’s social capabilities to change the nature of gaming. They made the
    boring parts more interactive by letting you not only place places, but also build
    them and manually collect the points they generate. After a while—usually a few
    weeks—when the game starts to feel repetitive, they present you with quests and
    make you interact with friends. Finally, the constructions that you build will
    remain, earning points even if you are not playing the game. (This concept is
    usually referred to in the industry as *asynchronous play or asynchronous mechanics*.)


    When you eliminate frustration, boredom, and repetition (the three bad aspects
    of isometric-real-time games), you end up with a fun, engaging, and casual (or
    demanding, depending on how you want to play it) genre of games that—thanks to
    its social-related progress requirements—can go viral in a heartbeat. No wonder
    Zynga’s valuation at the time of writing is $10 million (surpassing Electronic
    Arts (EA), one of the biggest “traditional” game publishers in the world), or
    that Playdom was purchased by Disney for 760 million dollars. Coming up with the
    right values for each variable'
