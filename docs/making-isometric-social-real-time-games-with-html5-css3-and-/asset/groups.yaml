    currentTime


    Allows us to get or set the current playback time, expressed in milliseconds.


    Volume


    Allows us to get or set the current volume, as a value ranging from 0.0 to 1.0.


    ![](img/bc084eea89036c02dab091a0a80afada_100_0.png)


    An ongoing project in the Mozilla Foundation called the Audio Data API allows
    developers to create and manipulate sounds with better accuracy and a greater
    degree of control.(At the time of writing of this book, the API is available only
    in Firefox and in the latest versions of Chromium.) For more information, see
    https://wiki.mozilla.org/Audio_Data_API.


    Now that you understand the basics of how to use this technology and its capabilities,
    you should also be aware of its limitations:


    +   - Once you create an HTML5 audio object and start playing a sound, you can
    play that sound only one at a time. If you want to play the same sound two times
    simultaneously, you need an additional HTML5 audio object.


    +   - There’s a limit to the number of simultaneous playbacks; this limit varies
    from platform to platform. If you exceed that limit, you may experience errors
    that vary from platform to platform.


    A good rule of thumb is to keep the number of simultaneous audio playbacks to
    three (or fewer), as that is the playback limit on mobile OSs. Other platforms
    (such as Firefox running in PC) can support a larger number of simultaneous playbacks.


    When discussing the HTML Canvas section, we combined several images in a single
    image (called a sprite sheet) to optimize the number of requests made to the server,
    and then we could reference a particular image inside the sprite sheet by showing
    the rectangle of X1, Y1 and X2, Y2 (where X1, Y1, X2, Y2 are pixel coordinates).
    We can use a similar technique with sounds by combining them into a single file
    (called a sound sheet)—and instead of using pixel coordinates, need to use time
    coordinates. (If you are feeling fancy, you could also put different sounds in
    the left and right audio channels, which could help you optimize requests even
    more, at the expense of losing one channel and playing sounds in mono.)


