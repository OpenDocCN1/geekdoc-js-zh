  mdcn: '


    为你自己的游戏设计玩法公式是非常困难的，但当你成功处理好一切时，这种类型社交游戏的本质本身就能让它瞬间走红。


    与传统的即时策略游戏相比，等轴即时策略游戏的界面非常简单：一个“活的”地图编辑器，你可以在其中一个瓦片矩阵上放置对象，我们将其称为“网格（the grid）”。根据对象的不同，我们将拥有建筑，其中一些建筑每隔
    `T` 单位时间就会产生 `P` 分数。因此，即使在我们没有玩游戏时，建筑也会产生分数。


    作为本书的最后一个项目，我们将开发一个名为“游客度假村（Tourist Resort）”的游戏，用户将在那里建造度假综合体，用树木装饰它，并放置各种商店。每家商店每隔
    `T` 单位时间都会产生 `N` 利润；这些利润将允许他们购买更多建筑。


    ## HTML5 的兴起


    在社交等轴游戏系统不断改进的同时，构建它们的技术也在发生变化。


    多年来，开发可在浏览器中运行的丰富且高度交互的在线游戏的可用工具一直保持不变：虚拟现实建模语言 (VRML)、Java Applets、Macromedia
    Shockwave、Adobe Flash、Microsoft Silver、Unity3D 等，意味着需要使用第三方和专有解决方案，如果用户想使用这些应用程序，他们必须下载并安装浏览器插件。更糟糕的是，开发者必须支付非常昂贵的
    IDE（集成开发环境）来开发它们。


    HTML、CSS 和 JavaScript 等 Web 技术无法为用户提供与 Adobe Flash 等其他工具可以实现的同等质量体验。浏览器——特别是带有
    JavaScript 的浏览器——运行缓慢；它们缺乏对原生视频、音频和本地存储的支持；某些浏览器（如 Internet Explorer）从未支持 PNG
    图像的透明度，开发者甚至没有工具执行最基本的位块图像传输（bit-block image transfers）。它们对于最简单的游戏之外的内容尚未准备好。


    幸运的是，随着时间的推移，大多数网页浏览器开始实现最新版本的 HTML 和 CSS 标准：HTML5 和 CSS3。同时，它们极大地提高了 JavaScript
    应用程序的运行时性能。如今，现代浏览器的最新版本，如 Mozilla Firefox、Apple Safari、Google Chrome、Opera 和
    Microsoft Internet Explorer 9，以及包含智能设备（如 iPhone、黑莓手机以及基于 WebOS 和 Android 的手机）中的浏览器，已经实现了开发全功能视频游戏所需的大多数技术。


    ## 你需要了解的


    本书并没有提供 HTML5、CSS3 或 JavaScript 的权威指南。它假设你至少具备了如何操作所有这些语言的基础知识。相反，在本书的不同章节中，我们讨论了如何以最高效的方式应用这些技术，以便你能够开发并发布适用于任何支持
    HTML5 浏览器的智能手机、平板电脑或 PC 上的游戏。


    本书旨在面向尝试进行游戏开发的 Web 开发人员，或尝试将自己的知识应用到 Web 开发中的游戏开发人员。


    我们开发等轴社交即时策略游戏的主要方法是针对“最小公约数”：移动设备。这种方法的理由是，如果它能在移动设备上以足够的速度运行，那么它在个人电脑等高端设备上也能良好运行。


    ## 代码示例


    书中所有示例的所有代码和其他支持文件都可以在 https://github.com/andrespagella/Making-Isometric-Real-time-Games
    获得。


    ## 开发和调试工具


    如果你是一名经验丰富的开发者，几个关键工具会有帮助。虽然你可以使用简单的文本编辑器（如记事本或 TextEdit）和任何支持 HTML5 的网络浏览器来实现这些示例，但如果你打算进行任何严肃的工作，如果拥有语法高亮、JavaScript
    控制台、JavaScript 调试器和 Web 检查器将会很好。我强烈建议使用支持（或可以扩展）JavaScript、HTML 和 CSS 的编辑器，如 vic
    或 emacs。


    JavaScript 控制台、JavaScript 调试器和 Web 检查器是用于定位和跟踪问题、程序等的工具。幸运的是，大多数现代浏览器都包含了这三者：


    ### Mozilla Firefox


    在“工具（Tools)”内部，你会找到 JavaScript 控制台和检查（Inspect）；我建议安装 Firebug，这是一个用于高级 Web 开发的扩展，它包含
    JavaScript 调试器以及 HTML、CSS 和 DOM 检查器，以及许多其他功能。


    ### Internet Explorer


    按下 F12 打开开发人员工具。这包括一个 JavaScript 控制台，允许你在不同的“文档模式”下查看页面，查看你的网站如何处理使用 IE5、IE7 等访问者。


    ### Google Chrome


    如果你访问“查看（View)”菜单（在 OSX）或点击通常位于地址栏旁边的小扳手图标，然后进入“开发者（Developer)”菜单，你将看到 JavaScript
    工具和 JavaScript 控制台。它们都是大多数基于 Web 的浏览器包含的工具集。


    ### Safari


    “偏好设置（Preferences)”的“高级（Advanced）”选项卡底部有一个“在菜单栏中显示开发菜单”的复选框。或者在 OS X 中，你可以通过打开终端窗口并输入
    `defaults write com.apple.Safari IncludeDebugMenu 1` 来启用开发者菜单。另一种方法是编辑 `Preferences.plist`
    文件，在 `<dict>` 和 `<plist>` XML 结束标签之前添加以下行：`<key>IncludeDebugMenu</key>`。在 OS X
    中，`Preferences.plist` 文件通常位于以下目录之一，取决于操作系统的版本：


    - C:\Documents and Settings\USER\Application Data\Apple Computer\Safari，其中 %USER%
    是

    - C:\Users\USER%\AppData\Roaming\Apple Computer\Safari，其中 %USER% 是你的账户。


    在 Microsoft Windows 中，你可以编辑 Safari 快捷方式，在 Safari.exe 路径旁边添加 /enableDebugMenu。


    ### Opera


    Opera 也包含一个名为 Dragonfly 的优秀调试程序和 Web 检查器。要了解更多信息，请参考 Opera Dragonfly 官网：http://www.opera.com/dragonfly/


    ## 游戏设计注意事项


    游戏设计是游戏开发中最重要的方面之一（如果不是最重要的话）：没有人想玩无聊的游戏。在这类社交现实策略类游戏中，不仅通过提供良好的用户体验和玩法来吸引用户，还通过将游戏深度整合到用户的社交网络和体验中，是非常重要的。


    不要忘记，这类游戏（乍看起来简单）的主要吸引力在于让用户与他们的朋友建立联系（“我的城市比你的大/漂亮”）。没有比比你朋友圈的推荐更好、更具说服力的广告了。


    你还需要对如何与用户的社交连接保持谨慎和负责。被社交网络本身（例如 Facebook）封禁将是一场灾难，甚至在发生之前，应用程序也可能被垃圾邮件发送者阻止或标记。


    游戏设计是一个比这里能涵盖的广泛得多的话题。关于游戏设计与 Web 应用融合的优秀书籍是 Gabe Zichermann 和 Christopher Cunningham
    写的《Gamification by Design》（O''Reilly）。


    ## 本书使用的惯例


    本书使用了以下排版惯例：


    - *斜体 (Italic)* 表示新术语、URL、电子邮件地址、文件名和扩展名。

    - **等宽 (Constant width)** 用于程序列表，以及在段落中指代程序元素，如变量或函数名、数据库、数据类型、环境变量、语句和关键字。

    - **等宽粗体 (Constant width bold)*** 显示用户应逐字输入的命令或其他文本。

    - **等宽斜体 (Constant width *italic*)*** 显示应替换为用户提供的值或由上下文确定的值的文本。


    ![bc084eea89036c02091a0a80afada12_0.png] 此图标表示提示、建议或普通注释。


    ![bc084eea89036c02091a0a80afada12_1.png] 此图标表示警告或注意。


    ## 使用代码示例


    本书是为了帮助你完成工作。通常情况下，你可以在程序和文档中使用书中的代码。除非你复制了大部分代码，否则你不需要联系我们获取许可。例如，编写一个使用了书书中几块代码的程序不需要许可。销售或分发
    O''Reilly 书籍的示例 CD 光盘需要许可。通过引用本书并引用示例代码来回答问题不需要许可。将书中大量的示例代码整合到你的产品文档中则需要许可。


