    在我们的情况下，我们将使用官方代码仓库 `img` 目录提供的提供的文件，名为 `logo.png`。我们还将展示图像，使其填充浏览器窗口的 50%，同时保持其宽高高比例，以便它可以在手机、平板电脑以及传统的桌面电脑上优雅地显示。\n\
