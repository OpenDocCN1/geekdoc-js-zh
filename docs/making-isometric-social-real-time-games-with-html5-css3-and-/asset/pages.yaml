  md: "The entire list can be found in the official W3C Working Draft at http://www.w3.org/TR/css3-animations/.\n\
    \nAlthough in our case the animation will occur only in fixed positions, you can\
    \ easily create the same effect using JavaScript and random variables or variables\
    \ based on the current grid scroll position of our game:\n\n```\n@webkit-keyframes\
    \ moveLeftToRight {\n  0% {\n    -webkit-transform: translateX(-5000px) translateY(50px)\
    \ translateZ(0px);\n  }\n  50% {\n    -webkit-transform: translateX(0px) translateY(50px)\
    \ translateZ(0px);\n  }\n  100% {\n    -webkit-transform: translateX(5000px) translateY(50px)\
    \ translateZ(0px);\n  }\n}\n```\n\n```\n@moz-keyframes moveLeftToRight {\n  0%\
    \ {\n    -moz-transform: translateX(-5000px) translateY(50px);\n  }\n  50% {\n\
    \    -moz-transform: translateX(0px) translateY(50px);\n  }\n  100% {\n    -moz-transform:\
    \ translateX(5000px) translateY(50px);\n  }\n}\n```\n\n```\n@ms-keyframes moveLeftToRight\
    \ {\n  0% {\n    -ms-transform: translateX(-5000px) translateY(50px);\n  }\n \
