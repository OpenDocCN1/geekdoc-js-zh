    Although WebGL is the fastest and most efficient method to render graphics on
    the screen, the reason we''re not going to consider it as a reliable method is
    because, at the time of writing of this book, the WebGL had not reached version
    1.0 and is not supported in the release versions of Internet Explorer 9, Safari
