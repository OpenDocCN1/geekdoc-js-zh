    # Choosing a Rendering Method for Our Graphics\n\nJust as website download times\
    \ translate to more or fewer visitors in the statistics (because cause faster\
    \ download times reduce visitor dropoff), fluidly rendering graphics and animations\
    \ on the screen should be one of the most crucial priorities when developing any\
    \ sort of video game. We'll lose a lot of players if graphics and animations are\
    \ shaking due to low frame rates. In isometric real-time strategy games, we will\
    \ have to keep both things in mind, especially if we want our game to be played\
    \ on mobile devices as well as desktop computers.\n\nIn isometric real-time strategy\
    \ games, the most basic “objective” of the game is to place buildings on a grid.\
    \ Each building will generate P amount of points every N number of seconds, which\
    \ will allow us to buy additional buildings.\n\nAlthough the most adequate, reliable,\
    \ and performance-efficient way to draw a grid in a web browser (without using\
    \ a third-party plugin) depends on the project requirements, there are four possible\
    \ approaches:\n\n+   - We can display graphics using WebGL context of the HTML5\
    \ Canvas object, which is not covered in this book (see the note following this\
    \ list).\n\n+   - We can also present tiles and objects as conventional HTML elements\
    \ (such as divs or imgs) and position them using the CSS top and left properties.\
    \ There are two variations of this approach: using isometric-shaped graphics,\
    \ or rotating and skewing graphics ourselves using CSS3."
