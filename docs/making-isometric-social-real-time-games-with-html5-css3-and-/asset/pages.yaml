    for siblings). We can traversing the DOM until we find a "solid" color and select
    that element instead of the image. However, this approach can be nonfunctional,
    impractical, or inefficient if:


    +   - There are elements with a large number of siblings or parent nodes

    - We are traversing the z-index of parent elements and "going through" the element
    should select the element below it (in, which, case, would be a child node)


    The second approach requires us to do things in a completely different way than
    most web developers are used: to keeping track of the coordinates of the objects
    we present on the screen, and using a click action, a hit test to see whether
    the X and Y coordinates of the mouse are inside the area of any object. The way
    to do this is to store the position x, position y, width, and height of every
    element, as well as the order in which they are presented on the screen. Then,
    there are many methods that you can cycle through all the elements in order to
    see which one have clicked allows you to create rectangles that you can later
    use to test whether the clientX and clientY values returned by a mouse event (such
    mousedown, mousemove, mouseup, click, etc.) are inside them. Figure 1-5 shows
    how we can keep track of all the objects presented on the screen. We check MX
    and MY (Mouse X and Mouse Y) represent the click coordinates. Then we can check
    how the mouse coordinates are inside any of the other objects (in this case, the
    element being clicked will be #4).


