  md: "For more information on how to use SQL, please refer to the official MySQL\
    \ Developer portal at http://dev.mysql.com.\n\nInside the server folder of the\
    \ GitHub repository, you will also find the following files\n folders:\n\n+  \
    \ - config.php\nThat defines the database connection details as well as the size\
    \ of the grid.\n- classes/class.dbutil.php\nA simple MySQL database utility class\n\
    - classes/class.users.php\nHandles user-related operations\n- classes/class.buildings.php\n\
    Handles building-related operations\n- classes/class.operations.php\nTakes care\
    \ of the instantiation and retrieval of building instances\n- classes/class.user.php\n\
    A user class\n- classes/class.building.php\nA building class\n- classes/class.buildingInstance.php\n\
    A buildingInstance class\n- test-database.php\nA useful script that tries to connect\
