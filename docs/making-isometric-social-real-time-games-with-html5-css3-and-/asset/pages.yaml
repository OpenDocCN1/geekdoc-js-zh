  md: 'browser from locking up and are defined in the W3C Working Draft (http://www.w3
    .org/TR/HTML5/timers.html).


    A more "browser-friendly" approach is to use the requestAnimationFrame function
    (because the HTML5 spec is still developed, each browser engine has given this
    function its own name). Using requestAnimationFrame allows the browser to decide
    when it is the best time to show the next. For example, if we minimize the browser
    window and nothing else depends on call requestAnimationFrame, the browser could
    stop the animation until we restore the window to a visible state.


    Inside the examples folder in the code repository of this book, you will find
    instructions on how to perform the same task (calculating FPS) (ex2-requestAnimationFrame.html
    and ex2-setTimeout.html). You can track the progress of timing control for script-based
    animations in the W3C Editor''s Draft (see http://webstuff.nsoft.com/anim-timing/Overview.html
    and http://www.w3.org/TR/2011/WD-anim-timing-20110602/). The ex2-requestAnimationFrame.html
    file implements a shim, a routine that checks whether a given function is implemented
    by the web browser—and if it isn''t, falls back to another, developed by Paul
    Irish (http://paulirish.com). It checks whether the browser currently supports
    requestAnimationFrame and falls back to setTimeout() if it doesn''t.


    In the following examples and throughout our game, we will stick with the setTimeout()
    control over when to call the next frame. For example, instead of calling the
    setTimeout() function to call it every 1 or 10ms, we might decide that it would
    be more efficient to call it every 500 or 2000ms. At the time of writing this
    book, it is not completely supported across all browsers, in the final future
    requestAnimationFrame() function will allow us to specify a time parameter.


    ```

    requestAnimationFrame is capped at 60 FPS.

    ```


    As we have seen so, depending on the capabilities and the performance of the device
    (among other factors), we will get a higher or lower FPS—which means that we base
    our animations by the number of frames, the animations will be played faster on
    some devices than others.


    Those familiar with PCs in the 1980s may remember the "turbo" button, which allowed
    us to change the speed of the processor. In the past, many games and applications
    were developed to run at a specific clock speed, so as computers got faster, all
    the variables in those games, including the animations, got faster, leading to
    hilarious results. The button allowed us to "slow down" the computer to support
    all applications such as games.


