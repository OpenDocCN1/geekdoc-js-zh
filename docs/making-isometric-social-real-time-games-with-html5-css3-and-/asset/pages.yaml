  md: '# CHAPTER 3

    Interface Considerations


    There''s much more to building a great-looking game than just laying out buildings
    on a grid. A working game requires ways for users to communicate with the game,
    and as games move toward mobile delivery, that need for communication changes.
    User expectations of mobile devices are often different from their expectations
    of desktop computers, and the devices themselves add new complexities.


    # GUI Design and Interaction in Web Games


    Graphical user interface (GUI) and human-computer interaction (HCI) are extremely
    critical areas in application development but are sometimes overlooked by developers.
    Companies and applications such as Apple, Google, and Facebook were able to become
    successful in part due to their excellent design usability guidelines. They require
    consistency, simplicity, responsiveness, and minimal design across all their products.
    Of course, video games (including ours) are no exception to this rule, but there
    is one big gotcha that you need to keep in mind: unlike other sorts of applications,
    our GUI has to be comfortably usable on both desktop and mobile devices.


    Knowing this, we can work out a simple set of recommendations to follow when designing
    it:


    +   - We can''t rely on mouse hovers to give feedback or present tooltips. Touchscreens
    have only two states: either you are touching the screen or you aren''t.

    - Having no tooltips means that icons and buttons must communicate clearly what
    they are going to do.

    - We can''t rely on right clicks either, as mobile devices won''t have that functionality.

    - In isometric games, presenting the game in landscape mode is a better use of
    screen real state than presenting it in portrait mode.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '+   * Important information, such as the account balance is better displayed
    on the top and navigational elements are better displayed on the bottom-left corner.
    (Remember that 90% of the world is right-handed, and they''ll probably be using
    their left hand to hold the device while they use their able hand, the right one,
    to click, as shown in Figure 3-1.)


    ![](img/bc084eea89036c02dab091a0a80afada_79_0.png)


    +   * Due to the very small size of mobile phones, we should keep interface clutter
    to absolute minimum.

    * We''re going to assume that scrolling down/up with your PC''s mouse is the same
    as zooming in/out with two fingers (almost a standard practice nowadays).

    * We''re also going to avoid presenting floating windows and will use scrollable
    panels instead. These panels will appear on the right of the screen.


    Some HCI and user experience (UE) guidelines for mobile devices include the following:


    +   * iOS Human Interface Guidelines, by Apple: http://developer.apple.com/library/ios#documentation/UserExperience/Conceptual/MobileHIG/Introduction/Introduction.html

    * User Experience Guidelines, by Google (for Android devices): http://developer.android.com/guide/practices/ui_guidelines/index.html


    In essence, our application GUI will look similar to Figure 3-2.'
