- img_proc: true
  md: 'In order to provide an external site with the logged-in user’s authentication
    details, Facebook uses a concept called a canvas—not related to the HTML5 Canvas—which
    is nothing more than a 765-pixel-wide HTML iframe that loads our one site, passing
    along several parameters to allow us to initiate a OAuth 2.0 authentication scheme
    that can be done either on the server side or the client side (JavaScript and
    XBFML).


    This book focuses on implementing the server-side approach. For more information
    on the different authentication schemes supported by the Facebook platform, please
    refer to http://developers.facebook.com/docs/authentication/.


    To implement the server-side authentication scheme we’re using for our game, we
    need to click on the Facebook Integration link for left of our application management.
    The first panel, Core Settings, shows the information in Figure 5-10.


    | About | Core Settings |

    |---|---|

    | Web Site | Application ID: 15172217156171 Your OAuth_client_id |

    | Facebook Integration | Application Secret: 7fb85e2b10c1d5f0fb80 Your OAuth_client_secret
    |


    Figure 5-10. Key information for your apps


    Take note of your specific Application ID and the Application Secret (partially
    obscured in the figure) and download Facebook’s official PHP SDK: https://github.com/facebook/php-sdk/.


    Inside the Facebook Integration tab, we must specify two additional fields:


    +   * The Canvas Page, which is a Facebook-hosted URL that will be accessed by
    our users when they click on our application

    * The Canvas URL, which is the URL hosting our application


    An example is shown in Figure 5-11.


    | Canvas | | |

    |---|---|---|

    | Canvas Page | http://apps.facebook.com/tourist-resort | The base URL of your
    app on Facebook |

    | Canvas URL | http://www.example.com/tourist-resort/ | Facebook pulls the content
    for your app’s canvas pages from this base URL |


    Figure 5-11. Defining your canvas'
  merge: -1
  pgno: 147
- img_proc: true
  md: "In a nutshell, when users access http://apps.facebook.com/tourist-resort, Facebook\
    \ will automatically call our Canvas URL, passing some parameters to help with\
    \ the authentication.\n\nThen, we just need to include the Facebook API files,\
    \ make a new instance of the Facebook object using our Application ID and Application\
    \ Secret, and we'll get access to the user's information:\n\n```\n<?php\nrequire\
    \ 'facebook/src/facebook.php';\n\n$fb = new Facebook(array(\n    'appid' => '<YOUR_APPLICATION_ID>',\n\
    \    'secret' => '<YOUR_APPLICATION_SECRET>',\n));\n\n$user = $fb->getUser();\n\
    echo '<pre>';\nprint_r($user);\necho '</pre>';\n?>\n```\n\nIf the user is not\
    \ logged in to Facebook or hasn't authorized your application, the output of the\
    \ $user variable will be zero. A more reliable method to detect this occurrence\
    \ is to use the approach taken in example.php, which is included in the Facebook\
    \ PHP SDK:\n\n```\n<?php\nif ($user) {\n  try {\n    $user_profile = $fb->api('/me');\n\
    \  } catch (FacebookApiException $e) {\n    $user = null;\n  }\n}\n?>\n```\n\n\
    $fb->api('/me') tries to fill the $user_profile variable by querying Facebook's\
    \ Graph API for your user (for more information about the Facebook Graph API,\
    \ see http://developers.facebook.com/docs/reference/api/) and throws an exception\
    \ if an occurs.\n\nIn order to let the user sign in to our application using Her\
    \ Facebook credentials, add the following lines:\n\n```\n<?php\n$loginUrl = $fb->getLoginUrl();\n\
    ?>\n```\n\n<a href=\"$loginUrl?\">Sign In</a>"
  merge: -1
  pgno: 148
- img_proc: true
  md: "When the user clicks Sign In, Facebook will show the authorization dialog in\
    \ Figure 5-12.\n\n![](img/bc084eea89036c02dab091a0a80afada_149_0.png)\n\nFigure\
    \ 5-12. Will the user grant permission?\n\nOnce the user decides to allow our\
    \ application to access her data, the page will be reloaded; this time, the $user\
    \ variable will be filled with the Facebook User ID and the $user_profile variable\
    \ will be filled with the response to the Graph API query /me, which is returned\
    \ as a JSON object.\n\nBy default, Facebook will ask for the “basic information,”\
    \ which includes things such as the user's name, last name, Facebook User ID,\
    \ location, interests, gender, and so on. If we want to ask for additional permissions—for,\
    \ to get access to his email address and friends, and to be able to publish messages\
    \ on his activity stream—we need to modify the $fb->getLoginUrl() call in the\
    \ following way:\n\n```\n<?php\n$loginUrl = $fb->getLoginUrl(array(\n    \"scope\"\
    \ => \"email, publish_stream, friends_about_me\"\n));\n?>\n```\n\n> The list of\
    \ permissions can be found at the following URL: http://developers.facebook.com/docs/authentication/permissions/.\n\
    \nAfter we modify the permissions, our new authorization window will look like\
    \ Figure 5-13."
  merge: -1
  pgno: 149
