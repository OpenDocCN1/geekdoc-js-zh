    has already not supporting WebGL all due to security concerns (http://blogs.tech.com/b/srd/archive/2016/06/webdriver-considered-harmful.aspx).
    Additionally, WebGL is built on OpenGL 2.0—also then competing product of DirectX,
    Microsoft''s own graph library—and threatens Silverlight (a Rich Internet Application,
    RIA, framework for browser-based applications). For information about the current
    state of WebGL, refer to the mailing list on the Chronos Group website: https://www.chronos.org/webgl/public-mailing-list!


    A weeks before publishing this book, the most efficient way to display the grid
    was using the third approach, due to the hardware acceleration hack (or feature).
    The problem with this (or the second approach) is that we want to keep an enormous
    number of elements on the DOM tree (one for each tile, plus others for buildings,
    etc.) when we scroll, we need to constantly add and remove nodes (to display only
    the elements that we can see, keeping the node count down). Adding or moving nodes
    from the DOM tree triggers a computationally expensive operation on the browser
    called a reflow that allows the layout engine of the browser to compute the geometry
    of the elements inside the DOM tree. Due to the implementation of hardware acceleration
    in the 2D and 3D contexts, recent (and future) developments have made and will
    reinforce the HTML5 Canvas as the most appropriate and efficient graphics rendering
    method for interactive video games.


