    ''About Me'' Details


    ![](img/bc084eea89036c02dab091a0a80afada_150_0.png)


    Logged in as Andres Pagella (Not You?)


    Figure 5-13. Will the user grant even more permissions?


    If the user decides to allow our game to access their data, the $user_profile
    variable will include an email parameter that we can use to automatically register
    the user in our own database.


    Once we have all the information, we can simply do a one-to-one map of the Facebook
    User ID with a user ID in our game to log the user in automatically when he or
    she connects via Facebook.


    For more information, refer to the Facebook Developer website: http://developers.facebook.com/docs/guides/canvas/'
