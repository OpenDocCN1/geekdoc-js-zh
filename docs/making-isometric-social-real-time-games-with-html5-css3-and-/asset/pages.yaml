    Figure 3-2. A rough sketch of the interface


    Each of the navigation buttons will enable a tool or perform a particular action.
    In our game, we''re going to be adding the following tools:


    +   * A Select tool to select individual buildings

    * A Move button that toggles the scroll position modifier, which can be used with
    the mouse or dragging a finger across the screen when using a mobile device or
    a tablet

    * Zoom In and Zoom Out buttons that will allow us to enlarge the grid and the
    object inside it, when we click on the screen

    * A Rotate button to rotate the values of the matrix counterclockwise

    * A Demolish button to destroy a specific building


    Additionally, we''re going to add support for the following features:


    +   * Using the mouse to zoom in or zoom out without toggling the zoom buttons

    * Using the keys on our keyboard to scroll the grid or to zoom in, zoom out, or
    rotate the grid


