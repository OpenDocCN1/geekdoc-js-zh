  md: "```\nResourceLoader.prototype.addResource = function(filePath, fileType, resourceType)\
    \ {\n  var res = {\n    filePath: filePath,\n    fileType: fileType,\n    resourceType:\
    \ resourceType\n  };\n  this.resources.push(res);\n}\n\nResourceLoader.prototype.startPreloading\
    \ = function() {\n  for (var i = 0, len = this.resources.length; i < len; i++)\
    \ {\n    switch(this.resources[i].resourceType) {\n      case ResourceType.IMAGE:\n\
    \        var img = new Image();\n        var rl = this;\n\n        img.src = this.resources[i].filePath;\n\
    \        img.addEventListener('load', function() { rl.onResourceLoaded(); }, false);\n\
    \        break;\n      case ResourceType.SOUND:\n        var a = new Audio();\n\
    \n        // Only preload sound files that we can play.\n        if (a.canPlayType(this.resources[i].fileType)\
    \ === \"maybe\" ||\n            a.canPlayType(this.resources[i].fileType) ===\
    \ \"probably\") {\n          a.src = this.resources[i].filePath;\n          a.type\
    \ = this.resources[i].fileType;\n\n          var rl = this;\n          a.addEventListener('canplaythrough',\
    \ function() {\n            a.removeEventListener('canplaythrough', arguments.callee,\
    \ false);\n            rl.onResourceLoaded();\n          }, false);\n        }\
    \ else {\n          // Can't play the sound. Assume the resource is loaded.\n\
    \          this.onResourceLoaded();\n        }\n        break;\n    }\n  }\n}\n\
    \nResourceLoader.prototype.onResourceLoaded = function() {\n  this.resourcesLoaded++;\n\
    \n  if (this.onPartial != undefined) {\n    this.onPartial();\n  }\n\n  if (this.resourcesLoaded\
    \ == this.resources.length) {\n    if (this.onComplete != undefined) {\n     \
    \ this.onComplete();\n    }\n  }\n}\n```"
