  md: 'If we apply this method to the example scenario described, we can deduce the
    following:


    +   - On 1293861660, the user decided to build an ice cream shop. At the time,
    he had 0 other buildings, so we just need to update his account balance and his
    "last update" time and create an association. The "last update" time of this association
    will be 1293861660.

    - The user''s account balance will now be 1750 (2000 – 250).

    - On 1294084800, he decided to build a hotel. Before we recalculate his account
    balance. We know that he purchased the ice cream shop, so we update the "last
    update" field of the user to 1294084800; in order to know how much income the
    ice cream shop has created so, we perform the following calculation:


    ```

    timeDiff = 1294084800 - 1293861660 = 22310 seconds

    ```


    Ice cream shops generate a profit of 5 gold coins every 30 minutes (1800 seconds),
    so we need to do this calculation:


    ```

    result = timeDiff / 1800 seconds = 123.97

    ```


    or just 123 when we floor the result:


    ```

    result = result * 5 = 615 gold coins

    ```


    We finally update the account balance to 1750 + 615 = 2365, and take away the
    cost of the hotel (using 1294084800 as the "last update" time), and the user''s
    account balance will now be 1365 (2365 – 1000).


    +   - On 1294120800, he purchased a cinema, so we perform the same steps as before
    (this time for two buildings, the ice cream shop and the hotel):

    - timeDiff = 1294120800 - 1294084800 = 36000 seconds

    iceCreamShopResult = timeDiff / 1800 = 20

    iceCreamShopResult = iceCreamShopResult * 5 gold coins = 100 gold coins

    hotelResult = timeDiff / 3600 seconds (one hour) = 10

    hotelResult = hotelResult * 30 gold coins = 300 gold coins

    accBalance = accBalance + hotelResult + iceCreamShopResult = 1765

    accBalance = accBalance - 500 gold coins (the cost of the parking lot)

    The user''s account balance at this point will be 1265.


    +   - Finally, on 1294639200, he wants to check his account balance once again:

    ntimeDiff = 1294639200 - 1294120800 = 518400 seconds

    iceCreamShopResult = timeDiff / 1800 = 288

    iceCreamShopResult = iceCreamShopResult * 5 = 1440 gold coins'
