- img_proc: true
  md: "Unfortunately, the technological limitations in previous versions of HTML have\
    \ been replaced by legal limitations in HTML5. Audio (and video) is encoded or\
    \ decoded with the use of codecs, which are small software libraries that lets\
    \ us encode/decode an audio video data file or stream implementing a particular\
