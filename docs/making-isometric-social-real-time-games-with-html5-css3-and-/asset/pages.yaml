  md: '![](img/bc084eea89036c02dab091a0a80afada_142_0.png)


    Another pleasant effect that would help the scene more credible is the addition
    of shadows. There are several techniques and algorithms to project shadows in
    a two-dimensional plane; however, in most cases we need one or multiple light
    sources, which also requires us to perform multiple calculations, especially if
    we have multiple objects (which we do).


    Because the objects on the scene will be static for most of the time, we could
    efficiently either:


    +   - Draw a shadow texture for each individual building

    - Generate the shadows dynamically


    In this case, we''re going to use the second approach, as it gives us the possibility
    of defining a pseudo-light source or controlling the intensity of the shadow dynamically.
    This method consists of drawing a silhouette of the original building, skewing
    and rotating it at the same time reducing the alpha value. For example, if we
    painted our textures with light coming from the southeast, the shadow should be
    projected to the northwest. If we painted them with a light source coming from
    the southwest, the shadow would be projected to the northeast, and so on. Figure
    5-6 will give you a better idea of what we''re trying to do.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '![](img/bc084eea89036c02dab091a0a80afada_143_0.png)


    Figure 5-6. Adding a silhouette to a building


    To implement this approach, we''re going to resort to two HTML5 Canvas functions
    seen before, getImageData() and putImageData(), and we''re going to build the
    functionality directly into the sprite object.


    First, we will modify our Sprite class and add an empty property:


    ```

    this.shadow = null;

    ```


    Next, we modify the draw() method to optionally accept a drawShadow parameter,
    a boolean indicating whether we want to draw a shadow to the sprite that we''re
    drawing. A subroutine will check this.shadow is null and do all the necessary
    processing to convert the image to an image array that we can later use using
    putImageData(). The result of the silhouette effect will be stored in our this.shadow
    property that the next time we need to use it we don''t need to do all the image
    preprocessing again. Be advised though, that this method is less efficient than
    using a premade image like our shadow; however, it gives us greater control and
    flexibility:'
  merge: -1
  pgno: 143
- img_proc: true
  md: "```\nif (this.show) {\n  if (drawShadow !== undefined && drawShadow) {\n  \
    \  if (this.shadow === null) { // Shadow not created yet\n      var scnv = document.createElement(\"\
    canvas\");\n      var sctx = scnv.getContext(\"2d\");\n\n      scnv.width = this.width;\n\
    \      scnv.height = this.height;\n\n      sctx.drawImage(this.spritesheet,\n\
    \        this.offsetX,\n        this.offsetY,\n        this.width,\n        this.height,\n\
    \        0,\n        0,\n        this.width * this.zoomLevel,\n        this.height\
    \ * this.zoomLevel);\n\n      varidata = sctx.getImageData(0, 0, scnv.width, scnv.height);\n\
    \n      for (var i = 0, len = idata.data.length; i < len; i += 4) {\n        idata.data[i]\
    \ = 0; // R\n        idata.data[i + 1] = 0; // G\n        idata.data[i + 2] =\
    \ 0; // B\n      }\n\n      sctx.clearRect(0, 0, scnv.width, scnv.height);\n \
    \     sctx.putImageData(idata, 0, 0);\n\n      this.shadow = sctx;\n    }\n\n\
    \    c.save();\n    c.globalAlpha = 0.3;\n    var sw = this.width * this.zoomLevel;\n\
    \    var sh = this.height * this.zoomLevel;\n    c.drawImage(this.shadow.canvas,\
    \ this.posX, this.posY - sh, sw, sh * 2);\n    c.restore();\n  }\n}\n\nc.drawImage(this.spritesheet,\n\
    \  this.offsetX,\n  this.offsetY,\n  this.width,\n  this.height,\n  this.posX,\n\
    \  this.posY,\n  this.width * this.zoomLevel,\n  this.height * this.zoomLevel);\n\
    }\n```\n\nThe end result looks like Figure 5-7."
