  md: "We're also going to modify our Game class to prevent it from displaying the\
    \ grid as soon as it is instantiated. The modification consists in removing the\
    \ final two lines of the Game() constructor:\n\n```\nthis.doResize()\nthis.draw()\n\
    ```\n\nAnother thing we're going to integrate at this point is a modification\
    \ of our title screen, to be shown as soon as the user loads the game.php page.\
    \ Adding the title screen also means that we'll need to add an object that keeps\
    \ track of the current game state (LOADING, LOADED, PLAYING), which is why we're\
    \ also going to create a Game State object (available globally!) that looks like\
    \ this:\n\n```\nvar GameState = {\n  _current: null,\n  LOADING: 0,\n  LOADED:\
    \ 1,\n  TITLESCREEN: 2,\n  PLAYING: 3\n}\n```\n\nThen, depending on the current\
    \ game state in GameState._current, some objects and events are going to behave\
    \ differently. For example, clicking on the title screen when the GameState._current\
    \ is set to GameState.LOADING shouldn't trigger any events. However, if the GameState.current\
    \ is set to GameState.TITLESCREEN, clicking on the window will display our game.\n\
    \nInitially, the title screen will serve as a bumper to preload our game resources\
    \ such as images or sounds in the background. To do this, we're going to use an\
    \ object called ResourceLoader that will allow us to download and preload all\
    \ the files before we use.\n\nThe ResourceLoader class is defined in a very straightforward\
    \ way in resourceLoader.js:\n\n```\n// ResourceLoader class\nvar ResourceType\
    \ = {\n  IMAGE: 0,\n  SOUND: 1\n}\n```\n\n```\nfunction ResourceLoader(onPartial,\
    \ onComplete) {\n  this.resources = [];\n  this.resourcesLoaded = 0;\n}\n```\n\
    \n```\nif (onPartial != undefined && typeof(onPartial) === \"function\") {\n \
    \ this.onPartial = onPartial;\n}\n```\n\n```\nif (onComplete != undefined && typeof(onComplete)\
    \ === \"function\") {\n  this.onComplete = onComplete;\n}\n```\n\nThe Path to\
    \ the Final Game | 113"
