  md: 'Our file and folder structure for the final game will look like this:

    index.php


    Contains the index page; handles authentication and user registration.

    game.php


    Contains the actual game. If the session is not active, the user will be bounced
    back to the index to authenticate or register. The code inside this file will
    be very similar to Example 3-1, but modified to display real values in the containers
    and broken down into easier JavaScript files for easier maintenance.


    async/

    Contains the PHP scripts to handle asynchronous calls made with JavaScript using
    XMLHttpRequest (AJAX).


    css/

    Contains the CSS files site.css (used in index.php) and ui-style.css (used in
    our game).


    js/

    Contains all the JavaScript files used by our game.


    Besides assigning "real" values to all the fields, game.php will perform an additional
    step to get all the Building Instances to the current user and will automatically
    populate the tilemap matrix with the buildings that the user has purchased. Additionally,
    for decorative purposes, the registration on index.php will also randomly create
    Building Instances of the "Tree" building (10% of the total size of the grid will
    be filled with trees).


    The instantiation of these buildings in our grid is performed by a function called
    initializeGrid() that combines the PHP array the building instances with the JavaScript
    tilemap matrix of our game. Unless the user manages to fill the entire grid with
    tiles (which means he''d need to buy 62,500 buildings, which is highly unlikely),
    this approach is enough for us. Another solution would have been to create an
    ideal tilemap matrix in PHP, encode it to JSON, and then replace the original
    tilemap matrix (in the JavaScript) with the decoded JSON, but on my tests I found
    this approach to be too inefficient because decoding large JSON objects in JavaScript
    has a lot of overhead.


    ![](img/bc084eea89036c02dab091a0a80afada_127_0.png)


    If you want to build a bigger grid for your own or professional project, you might
    want to break down the initialization routine to only a section of the entity
    and load the rest dynamically as you scroll. The reason we''re not implementing
    this approach in case is because mobile devices have a (somewhat) good download
    bandwidth, with a terrible roundtrip/connection latency (especially when they
    are connected via 3G), meaning that it''s best to download everything in a single
    batch rather than doing several "small" requests for additional data.'
