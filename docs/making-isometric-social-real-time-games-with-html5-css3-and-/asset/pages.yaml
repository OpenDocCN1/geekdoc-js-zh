    So far, the optimizations that we have made allowed to increase the performance
    of our game dramatically, but there is one more thing that we need to take care
    of before we go on.


    The draw() loop—the heart and soul of our game, which allows us to display elements
    on the screen—gets called many times per second, regardless of the graphics inside
    the canvas have changed. On other, more dynamic generics of video games in which
    we''d find several objects moving on the screen at the same time, this approach
    would be okay, in the case of isometric real-time strategy games, most graphics
    on the screen are usually static, so doing this is a bit unnecessary; we can avoid
    it by calling draw() only when needed instead of many times per second as we are
    currently doing.


    However, also remember that the draw() function will render the entire grid after
    the slightest change, even when calling draw() on demand could have a huge penalty
    (see Figure 1-12), especially if we need to animate only a few small objects and
    leave the rest unchanged.


    | ID | Name | Usage | FPS | Memory Usage |

    |---|---|---|---|---|

    | 58547 | Safari | 27.9 | 11 | 205.4 MB Intel (64 bit) |

    | 38711 | Itunes | 2.8 | 12 | 42.8 MB Intel |


    Figure 1-12. CPU usage at 30% on a PC; on a mobile device, this value would be
    90% or 100%


    Back in the early 1990s, at id Software, John Carmack was working on a game called
    Commander Keen the very first side-scroller game released for the PC, when he
    was faced with a similar problem. To solve it, he invented a technique known as
    Adaptive Refresh (ATR), by which he redrew the area that had changed.


    In order to implement a similar technique, we need to get rid of the draw() loop
    and add four parameters to it: srcX, srcY, destX, and destY. Calling the draw()
    function without any parameters would redraw the entire canvas; passing the srcXY
    and dest/Y parameters would only redraw the area within that boundary.


    Example 1-8 shows how to do this.


    40 | Chapter 1: Graphics Foundations: Canvas and Sprites'
