    \ a reference to the original of the image instead of returning a reference to\
    \ the next object below it.\n\nWith these tools in our hands, there are many ways\
    \ to solve this particular problem, but they mostly consist of:\n\n+   - Figuring\
    \ out the position of the element using DOM functions and iterating through elements\
    \ until we find a collision with a \"solid\" pixel\n- Keeping track of the positions\
    \ where we place objects and in which order they are presented, which is the approach\
