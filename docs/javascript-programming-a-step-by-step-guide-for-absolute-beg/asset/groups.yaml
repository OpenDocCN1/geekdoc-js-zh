    ## Chapter 13- Cookies


    Cookies refer to the data kept in text files on a computer. During browsing, a
    web page is sent to the user’s browser, and the web server forgets this. Cookies
    help in remembering information regarding users. Once a user has visited a webpage,
    a cookie can help to store his name. The user will be remembered the next time
    he visits the page. They are saved using name-value pairs as shown below:


    username=John Joel


    The document.cookie can be used for creation, deletion, and reading of a cookie.
    An expiry date for the cookie can also be added in UTC. After closing a browser,
    the cookie becomes deleted.


