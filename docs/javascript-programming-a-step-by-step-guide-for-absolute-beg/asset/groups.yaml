- md: "\nJavaScript Programming\n\n## Chapter 8: JavaScript Objects\n\n### Arrays\n\
    \nAn object in JavaScript is an entity with both state and behavior. In JavaScript,\
    \ everything is treated as an object. An array is an object which represents elements\
    \ of a similar type. It has a fixed size, and its elements are stored sequentially.\
    \ There are 3 ways of constructing arrays in JavaScript:\n\n- Array literal\n\
    - Array Instance\n- Array constructor\n\n#### Array Literal\n\nCreation of an\
    \ array by use of array literal takes the following syntax:\n\n`var nameOfArray=[val1,val2.....]`\n\
    \nThe values are added with square brackets `[]` and separated using commas.\n\
    \nExample:\n```html\n<script type=\"javascript\">\nvar array1=['Nicholas', 'Samuel',\
    \ 'Vickie'];\nfor (j=0;j<array1.length; j++) {\n    document.write(array1[j]);\n\
    }\n</script>\n```\n\nWe have created the array array1 with three values, which\
    \ are names of individuals. A for loop has been used to iterate the values of\
    \ the array, and then we have printed them. The `.length` property normally returns\
    \ the array length. Once executed, the values in the array will be printed as\
    \ shown below:\n\nNicholas\nSamuel\nVickie\n\n#### Creating an Array Directly\n\
    \nAn array can be created directly by following the syntax given below:\n\n`var\
    \ nameOfArray=new Array();`\n\nWith the `new` keyword, an instance of an array\
    \ is created.\n\nExample:\n```html\n<script type=\"javascript\">\nvar x;\nvar\
    \ array2=new Array();\narray2[0]='Nicholas';\narray2[1]='Samuel';\narray2[2]='Vickie';\n\
    for (x=0);x<array2.length;x++) {\n    document.write(array2[x]);\n}\n</script>\n\
    ```\n\nIn the example, we have used the `new` keyword to create the array named\
    \ array2. The next step is to populate elements in the array. Note that the position\
    \ of array elements is denoted using indices. The first element in the array is\
    \ at index 0, the second element at index 1, and the chain continues.\n\nConsider\
    \ the following line:\n\n`array2[1]='Samuel';`\n\nThe line states that we store\
    \ the element “Samuel” at index 1 of the array named array2. We have then used\
    \ the variable `x` so as to iterate these elements of the array and print them.\n\
    \n#### Array Constructor\n\nWe create an instance of the array by simply passing\
    \ arguments in the constructor instead of providing the value explicitly. The\
    \ script given below demonstrates this:\n\n```html\n<script type=\"javascript\"\
    >\nvar array3=new Array('Nicholas', 'Samuel', 'Vickie');\nfor (x=0;x<array3.length;x++)\
    \ {\n    document.write(array3[x]);\n}\n</script>\n```\n\nIn the above example,\
    \ we have created an array named array3. The creation of the array and addition\
    \ of elements to it has been done in the same line using a constructor. The for\
    \ loop helps us iterate through the array elements and print them to the screen.\n\
    \n### Array Methods\n\nJavaScript comes with many built-in array methods that\
    \ we can use to manipulate the elements of the array. Let us discuss these methods:\n\
    \n#### concat\n\nThe `concat` method combines arrays to return a single string.\
    \ The arrays can be two or more. Note that the elements of the initial array will\
    \ not be changed.\n\nIn the above example, we have concatenated two arrays. A\
    \ concatenation of three arrays can be obtained as follows:\n\n```html\n<script\
    \ type=\"javascript\">\nvar array1=['Nicholas', 'Samuel'];\nvar array2=['Vickie'];\n\
    var array3=['Joel'];\nvar output=array1.concat(array2,array3);\ndocument.writeln(output);\n\
    </script>\n```\n\nThe code will return the following output:\n\n#### copyWithin\n\
    \nWhen this method is used, it will copy a part of a given array with own elements\
    \ and return the modified array. Note that the length of the modified array will\
    \ not be changed.\n\nThe method takes the syntax given below:\n\n`array.copyWithin(target,start,end)`\n\
    \nThe `target` is where the copied element will take place. The `start` parameter\
    \ is optional. It denotes the index from which copying of the elements by the\
    \ method will begin. Its default value is 0, meaning that copying begins at index\
    \ 0, which is the first element of the array. The `end` parameter is also optional.\
    \ It denotes the index at which the method will stop the copying process. It has\
    \ a default value of `array.length-1`, which is the last element in the array.\n\
    \nThe method returns a modified array. Consider the example given below:\n\n```html\n\
    <script type=\"javascript\">\nvar array1=['Nicholas', 'Samuel', 'Vickie'];\nvar\
    \ output=array1.copyWithin();\ndocument.writeln(output);\n</script>\n```\n"
  mdcn: "\nJavaScript 编程\n\n## 第8 章：JavaScript 对象\n\n### 数组\n\nJavaScript 中的对象是一个既有状态又有行为的实体。在\
    \ JavaScript 中，一切都被被视为对象。数组是一种表示相似类型元素的对象。它具有固定的大小，且元素按顺序存储。在 JavaScript 中有 3\
    \ 种构造数组的方法：\n\n- 数组字面量\n- 数组实例\n- 数组构造函数\n\n#### 数组字面量\n\n使用数组字面量创建数组采用以下语法：\n\
    \n`var nameOfArray=[val1,val2.....]`\n\n值用方括号 `[]` 添加，并用逗号分隔。\n\n示例：\n```html\n\
    <script type=\"javascript\">\nvar array1=['Nicholas', 'Samuel', 'Vickie'];\nfor\
    \ (j=0;j<array1.length; j++) {\n    document.write(array1[j]);\n}\n</script>\n\
    ```\n\n我们创建了一个包含三个值的数组 `array1`，这些值是人的名字。我们使用 `for` 循环来遍历数组的值，然后将它们打印出来。`.length`\
    \ 属性通常返回数组的长度。执行后，数组中的值将如下所示：\n\nNicholas\nSamuel\nVickie\n\n#### 直接创建数组\n\n可以通过下面提供的语法直接创建数组：\n\
    \n`var nameOfArray=new Array();`\n\n通过 `new` 关键字，会创建一个数组的实例。\n\n示例：\n```html\n\
    <script type=\"javascript\">\nvar x;\nvar array2=new Array();\narray2[0]='Nicholas';\n\
    array2[1]='Samuel';\narray2[2]='Vickie';\nfor (x=0);x<array2.length;x++) {\n \
    \   document.write(array2[x]);\n}\n</script>\n```\n\n在示例中，我们使用 `new` 关键字创建了名为\
    \ `array2` 的数组。下一步是向数组填充元素。请注意，数组元素的位置使用索引表示。数组中的第一个元素位于索引 0，第二个元素位于索引 1，以此此类推。\n\
    \n考虑下面这一行：\n\n`array2[1]='Samuel';`\n\n该行代码表示我们要在名为 `array2` 的数组的索引 1 处存储元素“Samuel”。然后我们使用变量\
    \ `x` 来遍历数组的这些元素并打印它们。\n\n#### 数组构造函数\n\n我们通过直接在构造函数中传递参数，而不是显式地提供值来创建数组实例。下面的脚本演示了这一点：\n\
    \n```html\n<script type=\"javascript\">\nvar array3=new Array('Nicholas', 'Samuel',\
    \ 'Vickie');\nfor (x=0;x<array3.length;x++) {\n    document.write(array3[x]);\n\
    }\n</script>\n```\n\n在上面的示例中，我们创建了一个名为 `array3` 的数组。数组的创建和元素的添加是通过构造函数在同一行中完成的。`for`\
    \ 循环帮助我们遍历数组元素并将其打印到屏幕上。\n\n### 数组方法\n\nJavaScript 带有许多内置数组方法，我们可以操作数组元素。让我们讨论这些方法：\n\
    \n#### concat\n\n`concat` 方法合并数组并返回单个字符串。数组可以是两个或多个。注意，初始数组的元素不会被改变。\n\n在上面的示例中，我们合并了两个数组。三个数组的合并可以如下所示获取：\n\
    \n```html\n<script type=\"javascript\">\nvar array1=['Nicholas', 'Samuel'];\n\
    var array2=['Vickie'];\nvar array3=['Joel'];\nvar output=array1.concat(array2,array3);\n\
    document.writeln(output);\n</script>\n```\n\n该代码将返回以下输出：\n\n#### copyWithin\n\n\
    当使用此方法时，它会将给定数组的一部分复制到自身的元素中并返回修改后的数组。注意，修改后数组的长度不会改变。\n\n该方法采用下面提供的语法：\n\n`array.copyWithin(target,start,end)`\n\
    \n`target` 是复制元素将发生的位置。`start` 参数是可选的。它表示方法开始复制元素的索引。它的默认值是 0，意味着复制从索引 0 开始，即数组的第一个元素。`end`\
    \ 参数也是可选的。它表示方法停止复制过程的索引。它有一个默认值 `array.length-1`，即数组中的最后一个元素。\n\n该方法返回一个修改后的数组。考虑下面提供的示例：\n\
    \n```html\n<script type=\"javascript\">\nvar array1=['Nicholas', 'Samuel', 'Vickie'];\n\
    var output=array1.copyWithin();\ndocument.writeln(output);\n</script>\n```\n"
