    ## Screen


    This JavaScript object keeps information about the screen of the browser. You
    can use it to display details of the screen such as the height, width, pixelDepth,
    colorDepth etc. It is a property of the window object, hence we access as follows:


    window.screen


    We can also access it as follows:


    The object has many properties including the following:


    - width- it returns the width of the browser screen

    - height- it returns the height of browser screen

    - availWidth- it prints the available width

    - availHeight- it prints available height

    - colorDepth- it returns color depth

    - pixelDepth- it returns pixel depth.


    The following example shows how this object can be used:


    ```javascript

    document.writeln(+screen.height);

    document.writeln(+screen.width);

    document.writeln(+screen.availHeight);

    document.writeln(+screen.availWidth);

    document.writeln(+screen.pixelDepth);

    document.writeln(+screen.colorDepth);

    ```


    The code returns the following after execution:

    screen height: 768

    screen width: 1366

    screen availHeight: 728

    screen availWidth: 1366

    screen pixelDepth: 24

    screen colorDepth: 24


