- md: "\nJavaScript Programming\n\nThe code returns the following after execution:\n\
    The year is: 1958\nThis shows that the method was able to successfully extract\
    \ only the year part of the provided date.\n\nHere is another example in which\
    \ we are creating a sub-class to inherit from the parent class:\n\n```html\n<script>\n\
    class Car {\n  constructor() {\n    this.manufacturer = \"Toyota\";\n  }\n}\n\n\
    class Model extends Car {\n  constructor(name, year) {\n    super();\n    this.name\
    \ = name;\n    this.year = year;\n  }\n}\n\nvar m = new Model(\"Harner\", 2012);\n\
    document.writeln(m.manufacturer + \" \" + m.name + \" \" + m.year);\n</script>\n\
    ```\n\nThe code returns the following result:\nToyota Harner 2012\n\nLet us demonstrate\
    \ how prototype-based inheritance can be done, where we don’t have to use the\
    \ `extends` and `class` keywords:\n\n```html\n<script>\nfunction Car(manufacturer)\
    \ {\n  this.manufacturer = manufacturer;\n}\nCar.prototype.getManufacturer = function()\
    \ {\n  return this.manufacturer;\n}\n\nfunction Model(name, year) {\n  this.name\
    \ = name;\n  this.year = year;\n}\n\nvar car = new Car(\"Toyota\");\nModel.prototype\
    \ = car;\n\nvar model = new Model(\"Harner\", 2012);\ndocument.writeln(model.getManufacturer()\
    \ + \" \" + model.name + \" \" + model.year);\n</script>\n```\n\n## Polymorphism\n\
    \nThis is a key feature of an object-oriented programming paradigm that makes\
    \ it possible for one to perform a single action in different ways. With polymorphism,\
    \ we can invoke one method on various JavaScript objects. JavaScript isn’t a type-safe\
    \ language; hence members of any data type can be passed with the methods. Consider\
    \ the example given below:\n\n```html\n<script>\nclass Parent {\n  show() {\n\
    \    document.writeln(\"Parent class invoked\");\n  }\n}\n\nclass Child extends\
    \ Parent {\n  show() {\n    document.writeln(\"Child class invoked\");\n  }\n\
    }\n\nvar ch = new Child();\nch.show();\n</script>\n```\n\nThe code will return\
    \ the following:\nParent class invoked\nChild class invoked\n\nHere is another\
    \ example:\n\n```html\n<script>\nclass Parent {\n  show() {\n    document.writeln(\"\
    Parent class invoked\");\n  }\n}\n\nclass Child extends Parent {\n  show() {\n\
    \    document.writeln(\"Child class invoked\");\n  }\n}\n\nvar p = [new Parent(),\
    \ new Child()];\np.forEach(function(message) {\n  message.show();\n});\n</script>\n\
    ```\n\nThe `show()` method behaves differently based on the object for which it\
    \ is invoked. The code prints the following output:\nParent class invoked\nChild\
    \ class invoked\n\nWe can implement the same example but this time via a prototype-based\
    \ approach. This is demonstrated below:\n\n```html\n<script>\nfunction Parent()\
    \ {\n}\nParent.prototype.show = function() {\n  return \"Parent class invoked\"\
    ;\n};\n\nfunction Child() {\n}\nChild.prototype = Object.create(Parent.prototype);\n\
    Child.prototype.show = function() {\n  return \"Child class invoked\";\n};\n\n\
    var p = [new Parent(), new Child()];\np.forEach(function(message) {\n  document.writeln(message.show());\n\
    });\n</script>\n```\n\n## Chapter 15 - Multimedia\n\nJavaScript has the `plugins`\
    \ object which is a child of `navigator`. It’s an array, and it comes with some\
    \ single entry for a browser plugin. Browsers such as firefox and Netscape support\
    \ the use of the `navigator.plugins` object. Consider the script below:\n\n<table\
    \ border=\"1\">\n  <tr>\n    <th>Name of Plugin</th>\n    <th>Filename</th>\n\
    \    <th>Description</th>\n  </tr>\n</table>\n\n<script>\nfor (var x=0; x<navigator.plugins.length;\
    \ x++) {\n  document.write(navigator.plugins[x].name);\n  document.write(navigator.plugins[x].filename);\n\
    \  document.write(navigator.plugins[x].description);\n}\n</script>\n\nOnce executed,\
    \ the script will show you a list of all plugins installed on your browser. Each\
    \ plugin is represented as an entry in the array. Each entry has the following\
    \ properties:\n- name: specifies the name of a plugin.\n- filename: this is an\
    \ executable file which is loaded in order to install a plugin.\n- description:\
    \ this describes the plugin.\n\nIn my case, I ran the code on Chrome and it returned\
    \ the following:\n\n| Name | Filename | Description |\n| :--- | :--- | :--- |\n\
    | PDF Viewer | | |\n| Shockwave Flash | | |\n\nWith the above properties, one\
    \ can determine the plugins which have been installed then use JavaScript so as\
    \ to play the necessary multimedia file.\n\nExample:\n\n```html\n<script>\nvar\
    \ vid = navigator.mimeTypes[\"video\"];\nif (vid) {\n  document.write(\"<embed\
    \ src='\" + vid + \"' width='300' height='200'>\");\n} else {\n  document.write(\"\
    <img src='img.gif' width='300' height='200'>\");\n}\n</script>\n```\n\nThe `<embed>`\
    \ tag has helped us to embed some multimedia file. With JavaScript, we are able\
    \ to control multimedia.\n\nExample:\n\n```html\n<script type=\"text/javascript\"\
    >\nfunction playMedia() {\n  if (!document.game.IsPlaying()) {\n    document.game.Play();\n\
    \  }\n}\nfunction stopMedia() {\n  if (document.game.IsPlaying()) {\n    document.game.StopPlay();\n\
    \  }\n}\nfunction rewindMedia() {\n  if (document.game.IsPlaying()) {\n    document.game.Rewind();\n\
    \  }\n}\n</script>\n</head>\n<body>\n  <embed id=\"game\" src=\"\" width=\"300\"\
    \ height=\"200\" loop pluginspage=\"\" swliveconnect=\"\"></embed>\n  <form name=\"\
    \" method=\"get\">\n    <input type=\"button\" value=\"Play\" onclick=\"playMedia()\"\
    >\n    <input type=\"button\" value=\"Stop\" onclick=\"stopMedia()\">\n    <input\
    \ type=\"button\" value=\"Rewind\" onclick=\"rewindMedia()\">\n  </form>\n</body>\n\
    ```\n\nEnsure that you add the URL to the location of your game. Execute the script\
    \ and you will see the buttons for Play, Stop, and Rewind.\n"
  mdcn: "\nJavaScript 编程\n\n执行后代码返回以下内容：\n年份是：1958\n这表明该方法能够成功提取出提供日期的年份部分。\n\n这里另一个示例，其中我们正在创建一个子类来继承父类：\n\
    \n```html\n<script>\nclass Car {\n  constructor() {\n    this.manufacturer = \"\
    Toyota\";\n  }\n}\n\nclass Model extends Car {\n  constructor(name, year) {\n\
    \    super();\n    this.name = name;\n    this.year = year;\n  }\n}\n\nvar m =\
    \ new Model(\"Harner\", 2012);\ndocument.writeln(m.manufacturer + \" \" + m.name\
    \ + \" \" + m.year);\n</script>\n```\n\n代码返回以下结果：\nToyota Harner 2012\n\n让我们演示如何实现基于原型的继承，在这种情况下，我们不需要使用\
    \ `extends` 和 `class` 关键字：\n\n```html\n<script>\nfunction Car(manufacturer) {\n\
    \  this.manufacturer = manufacturer;\n}\nCar.prototype.getManufacturer = function()\
    \ {\n  return this.manufacturer;\n}\n\nfunction Model(name, year) {\n  this.name\
    \ = name;\n  this.year = year;\n}\n\nvar car = new Car(\"Toyota\");\nModel.prototype\
    \ = car;\n\nvar model = new Model(\"Harner\", 2012);\ndocument.writeln(model.getManufacturer()\
    \ + \" \" + model.name + \" \" + model.year);\n</script>\n```\n\n## 多态\n\n这是面向对象编程范式的一个关键特性，它允许以不同的方式执行同一个操作。通过多态，我们可以在各种\
    \ JavaScript 对象上调用同一个方法。JavaScript 不是一种类型安全的语言；因此，任何数据类型的成员都可以传递给方法。考虑下面的示例：\n\
    \n```html\n<script>\nclass Parent {\n  show() {\n    document.writeln(\"Parent\
    \ class invoked\");\n  }\n}\n\nclass Child extends Parent {\n  show() {\n    document.writeln(\"\
    Child class invoked\");\n  }\n}\n\nvar ch = new Child();\nch.show();\n</script>\n\
    ```\n\n代码将返回以下内容：\nParent class invoked\nChild class invoked\n\n这里另一个示例：\n\n```html\n\
    <script>\nclass Parent {\n  show() {\n    document.writeln(\"Parent class invoked\"\
    );\n  }\n}\n\nclass Child extends Parent {\n  show() {\n    document.writeln(\"\
    Child class invoked\");\n  }\n}\n\nvar p = [new Parent(), new Child()];\np.forEach(function(message)\
    \ {\n  message.show();\n});\n</script>\n```\n\n`show()` 方法的行为根据调用它的对象而有所不同。代码打印出以下输出：\n\
    Parent class invoked\nChild class invoked\n\n我们可以实现相同的示例，但这次通过基于原型的方法。演示所示：\n\n\
    ```html\n<script>\nfunction Parent() {\n}\nParent.prototype.show = function()\
    \ {\n  return \"Parent class invoked\";\n};\n\nfunction Child() {\n}\nChild.prototype\
    \ = Object.create(Parent.prototype);\nChild.prototype.show = function() {\n  return\
    \ \"Child class invoked\";\n};\n\nvar p = [new Parent(), new Child()];\np.forEach(function(message)\
    \ {\n  document.writeln(message.show());\n});\n</script>\n```\n\n## 第 15 章 - 多媒体\n\
    \nJavaScript 拥有作为 `navigator` 的子对象的 `plugins` 对象。它是一个数组，包含了浏览器插件的某些单个条目。Firefox\
    \ 和 Netscape 等浏览器支持使用 `navigator.plugins` 对象。考虑下面的脚本：\n\n<table border=\"1\">\n\
    \  <tr>\n    <th>插件名称</th>\n    <th>文件名</th>\n    <th>描述</th>\n  </tr>\n</table>\n\
    \n<script>\nfor (var x=0; x<navigator.plugins.length; x++) {\n  document.write(navigator.plugins[x].name);\n\
    \  document.write(navigator.plugins[x].filename);\n  document.write(navigator.plugins[x].description);\n\
    }\n</script>\n\n``` \n\n一旦执行，该脚本将向你显示浏览器上安装的所有插件列表。每个插件都表示为数组中的一个条目。每个条目具有以下属性：\n\
    - name：指定插件的名称。\n- filename：这是一个可执行文件，用于在安装插件时加载它。\n- description：这描述了插件的描述。\n\
    \n在我的情况下，我在 Chrome 上运行了代码，它返回了以下内容：\n\n| Name | Filename | Description |\n| :---\
    \ | :--- | :--- |\n| PDF Viewer | | |\n| Shockwave Flash | | |\n\n通过上述属性，人们可以确定已安装的插件，然后使用\
    \ JavaScript 来播放必要的多媒体文件。\n\n示例：\n\n```html\n<script>\nvar vid = navigator.mimeTypes[\"\
    video\"];\nif (vid) {\n  document.write(\"<embed src='\" + vid + \"' width='300'\
    \ height='200'>\");\n} else {\n  document.write(\"<img src='img.gif' width='300'\
    \ height='200'>\");\n}\n</script>\n```\n\n`<embed>` 标签帮助我们嵌入了一些多媒体文件。通过 JavaScript，我们能够控制多媒体。\n\
    \n示例：\n\n```html\n<script type=\"text/javascript\">\nfunction playMedia() {\n\
    \  if (!document.game.IsPlaying()) {\n    document.game.Play();\n  }\n}\nfunction\
    \ stopMedia() {\n  if (document.game.IsPlaying()) {\n    document.game.StopPlay();\n\
    \  }\n}\nfunction rewindMedia() {\n  if (document.game.IsPlaying()) {\n    document.game.Rewind();\n\
    \  }\n}\n</script>\n</head>\n<body>\n  <embed id=\"game\" src=\"\" width=\"300\"\
    \ height=\"200\" loop pluginspage=\"\" swliveconnect=\"\"></embed>\n  <form name=\"\
    \" method=\"get\">\n    <input type=\"button\" value=\"Play\" onclick=\"playMedia()\"\
    >\n    <input type=\"button\" value=\"Stop\" onclick=\"stopMedia()\">\n    <input\
    \ type=\"button\" value=\"Rewind\" onclick=\"rewindMedia()\">\n  </form>\n</body>\n\
    ```\n\n确保你添加了游戏位置的 URL。执行脚本，你将看到播放、停止和重回按钮。\n\n"
