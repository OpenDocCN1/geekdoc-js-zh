- md: "\nJavaScript Programming\n\n## The Arguments Object\n\nAny JavaScript function\
    \ can use the `arguments` object. This object has a value for every parameter.\
    \ It is similar to an array. Its values can be accessed using an index in the\
    \ same way as an array. However, this object cannot support array methods.\n\n\
    Consider the following example:\n\n```html\n<script>\nfunction MyFunction(arg1,\
    \ arg2) {\n  alert(arguments[0] + arguments[1]);\n}\nMyFunction(0, 'e');\nMyFunction('');\n\
    MyFunction(i);\n</script>\n```\n\nThe code will run as usual. When calling a function,\
    \ we can pass arguments to it. The JavaScript interpreter treats the first arguments\
    \ as being at index 0. The expression `arguments[0]` denotes the first argument\
    \ when calling the function while the expression `arguments[1]` denotes the second\
    \ argument when calling the function.\n\nWe can use a for loop to iterate over\
    \ the arguments object. For example:\n\n```html\n<script>\nfunction MyFunction()\
    \ {\n  for(var x = 0; x < arguments.length; x++) {\n    alert(arguments[x]);\n\
    \  }\n}\nMyFunction(\"Nice\", \"day\");\n</script>\n```\n\nTwo arguments have\
    \ been passed to the function, and we have used the variable `x` within a for\
    \ loop to iterate through these.\n\nIn JavaScript, a function can use the `return`\
    \ keyword to return either zero or one value.\n\nConsider the example given below:\n\
    \n```html\n<script>\nfunction MyFunction() {\n  return 5;\n}\ndocument.write(MyFunction());\n\
    </script>\n```\n\nThe function will return what has been specified in the statement\
    \ with the return keyword.\n\nHere is another example:\n\n```html\n<html>\n<body>\n\
    \  <p id=\"result\"></p>\n  <script>\n    function Addition(x, y) {\n      return\
    \ x + y;\n    }\n    document.getElementById(\"result\").innerHTML = Addition(10,\
    \ 12);\n\n    function Product(x, y) {\n      console.log(x * 7);\n    };\n  \
    \  document.getElementById(\"result\").innerHTML = Product(10, 12);\n  </script>\n\
    </body>\n</html>\n```\n\nThe code will print the following:\n- undefined\n\nWe\
    \ have created a function named `Addition()` that adds and returns the sum of\
    \ two variables, `x` and `y`. The calling code is capable of getting the return\
    \ value and assigns it to a variable. We also defined a second function named\
    \ `Product()` which returns nothing, hence its result will be undefined.\n\nIn\
    \ JavaScript, we can have a function returning another function. Here is an example\
    \ of this:\n\n```html\n<html>\n<body>\n  <p id=\"p1\"></p>\n  <p id=\"p2\"></p>\n\
    \  <script>\n    function myfunction(a) {\n      function product(b) {\n     \
    \   return a * b;\n      }\n      return product;\n    }\n    var db = myfunction(2);\n\
    \    document.getElementById(\"p1\").innerHTML = db(2);\n    document.getElementById(\"\
    p2\").innerHTML = db();\n  </script>\n</body>\n</html>\n```\n\nThe function named\
    \ `myfunction` is returning the function named `product`.\n\n## Anonymous Function\n\
    \nWith JavaScript, we can define a function without a name. Such a function is\
    \ known as an anonymous function. You must assign a variable to your anonymous\
    \ function.\n\nFor example:\n\n```html\n<html>\n<body>\n  <p id=\"p1\"></p>\n\
    \  <p id=\"p2\"></p>\n  <script>\n    var sum = function(x, y) {\n      return\
    \ x + y;\n    }\n    document.getElementById(\"p1\").innerHTML = sum(10, 12);\n\
    \  </script>\n</body>\n</html>\n```\n\nThe code should return the sum of 10 and\
    \ 12, which is 22. This output will be from the `sum(10, 12)` expression where\
    \ we are calling the function using the variable assigned to it. The expression\
    \ `Addition(10, 12)` is not valid as we are calling the function by its name while\
    \ it has already been assigned a variable.\n\nWe have created two anonymous functions.\
    \ The first one takes no argument and it has been assigned the `helloMessage`\
    \ variable. The message should return \"Hello World\" in an alert box. This method\
    \ has been called twice in the program using the `helloMessage()` expression.\n\
    \n```javascript\nvar helloMessage = function() {\n  alert(\"Hello World\");\n\
    };\nhelloMessage();\n\nvar message = function(name) {\n  alert(\"Hi \" + name);\n\
    };\nmessage(\"Nicholas\");\n```\n\nThe code will show \"Hello World\" twice and\
    \ \"Hi Nicholas\" once. To move from one alert box to another, click the OK button.\n\
    \n## Nested Functions\n\nJavaScript functions can have one or many inner functions.\
    \ The nested functions should be within the scope of the outer function. The inner\
    \ function is allowed to access both the parameters and variables of the outer\
    \ function. However, an outer function is not able to access the variables defined\
    \ within its inner functions.\n\nConsider the following example:\n\n```html\n\
    <script>\nfunction OuterFunc(name) {\n  function InnerFunc() {\n    document.write(\"\
    Hi \" + name);\n  }\n  return InnerFunc();\n}\nOuterFunc(\"Nicholas\");\n</script>\n\
    ```\n\nWe have defined an outer function named `OuterFunc()`. This function takes\
    \ one parameter `name`. Although the `name` parameter belongs to the outer function,\
    \ the inner function successfully accessed it. The code should print the following:\n\
    Hi Nicholas\n"
  mdcn: "\nJavaScript 编程\n\n## Arguments 对象\n\n任何 JavaScript 函数都可以使用 `arguments` 对象。该对象为每个参数都持有一个值。它类似于数组。你可以像访问数组一样使用索引来访问它的值。然而，该对象不支持数组方法。\n\
    \n考虑以下示例：\n\n```html\n<script>\nfunction MyFunction(arg1, arg2) {\n  alert(arguments[0]\
    \ + arguments[1]);\n}\nMyFunction(0, 'e');\nMyFunction('');\nMyFunction(i);\n\
    </script>\n```\n\n代码将照常运行。在调用函数时，我们可以向其传递参数。JavaScript 解释器会将第一个参数视为索引为 0。表达式 `arguments[0]`\
    \ 表示调用函数时的第一个参数，而表达式 `arguments[1]` 表示调用函数时的第二个参数。\n\n我们可以使用 `for` 循环来遍历 `arguments`\
    \ 对象。例如：\n\n```html\n<script>\nfunction MyFunction() {\n  for(var x = 0; x < arguments.length;\
    \ x++) {\n    alert(arguments[x]);\n  }\n}\nMyFunction(\"Nice\", \"day\");\n</script>\n\
    ```\n\n函数被传递了两个参数，我们在 `for` 循环中使用变量 `x` 遍历了这些参数。\n\n在 JavaScript 中，函数可以使用 `return`\
    \ 关键字返回零或一个值。\n\n考虑下面提供的示例：\n\n```html\n<script>\nfunction MyFunction() {\n  return\
    \ 5;\n}\ndocument.write(MyFunction());\n</script>\n```\n\n该函数将返回 `return` 语句中指定的内容。\n\
    \n这是另一个示例：\n\n```html\n<html>\n<body>\n  <p id=\"result\"></p>\n  <script>\n \
    \   function Addition(x, y) {\n      return x + y;\n    }\n    document.getElementById(\"\
    result\").innerHTML = Addition(10, 12);\n\n    function Product(x, y) {\n    \
    \  console.log(x * 7);\n    };\n    document.getElementById(\"result\").innerHTML\
    \ = Product(10, 12);\n  </script>\n</body>\n</html>\n```\n\n该代码将打印以下内容：\n- undefined\n\
    \n我们创建了一个名为 `Addition()` 的函数，它相加并返回两个变量 `x` 和 `y` 的和。调用代码能够获取返回值并将其赋值给变量。我们还定义了第二个名为\
    \ `Product()` 的函数，它不返回任何内容，因此它的结果是 `undefined`。\n\n在 JavaScript 中，我们可以让一个函数返回另一个函数。这是一个这是一个示例：\n\
    \n```html\n<html>\n<body>\n  <p id=\"p1\"></p>\n  <p id=\"p2\"></p>\n  <script>\n\
    \    function myfunction(a) {\n      function product(b) {\n        return a *\
    \ b;\n      }\n      return product;\n    }\n    var db = myfunction(2);\n   \
    \ document.getElementById(\"p1\").innerHTML = db(2);\n    document.getElementById(\"\
    p2\").innerHTML = db();\n  </script>\n</body>\n</html>\n```\n\n名为 `myfunction`\
    \ 的函数正在返回名为 `product` 的函数。\n\n## 匿名函数\n\n在 JavaScript 中，我们可以定义一个没有名字函数。这种函数被称为匿名函数。你必须为你的匿名函数分配一个变量。\n\
    \n例如：\n\n```html\n<html>\n<body>\n  <p id=\"p1\"></p>\n  <p id=\"p2\"></p>\n \
    \ <script>\n    var sum = function(x, y) {\n      return x + y;\n    }\n    document.getElementById(\"\
    p1\").innerHTML = sum(10, 12);\n  </script>\n</body>\n</html>\n```\n\n代码应该返回 10\
    \ 和 12 的和，即 22。此输出将来自 `sum(10, 12)` 表达式，其中我们使用赋值给它的变量来调用函数。表达式 `Addition(10, 12)`\
    \ 是无效的，因为我们通过函数名调用它，而它已经被赋值给了一个变量。\n\n我们创建了两个匿名函数。第一个不接受参数，并被赋值给变量 `helloMessage`。消息应该在弹框中返回\
    \ \"Hello World\"。该方法在程序中通过 `helloMessage()` 表达式调用了两次。\n\n```javascript\nvar helloMessage\
    \ = function() {\n  alert(\"Hello World\");\n};\nhelloMessage();\n\nvar message\
    \ = function(name) {\n  alert(\"Hi \" + name);\n};\nmessage(\"Nicholas\");\n```\n\
    \n代码将显示两次 \"Hello World\" 和一次 \"Hi Nicholas\"。要从一个弹框移动到另一个弹框，请点击 OK 按钮。\n\n##\
    \ 嵌套函数\n\nJavaScript 函数可以拥有一个或多个内部函数。嵌套函数应该在外部函数的作用范围内。内部函数允许访问外部函数的参数和变量。然而，外部函数无法访问在其内部函数定义的变量。\n\
    \n考虑以下示例：\n\n```html\n<script>\nfunction OuterFunc(name) {\n  function InnerFunc()\
    \ {\n    document.write(\"Hi \" + name);\n  }\n  return InnerFunc();\n}\nOuterFunc(\"\
    Nicholas\");\n</script>\n```\n\n我们定义了一个名为 `OuterFunc()` 的外部函数。该函数接受一个参数 `name`。虽然\
    \ `name` 参数属于外部函数，但内部函数成功地访问了它。代码应该打印以下内容：\nHi Nicholas\n\n"
