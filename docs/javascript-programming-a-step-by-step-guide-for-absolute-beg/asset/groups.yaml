- md: "\nJavaScript Programming\n\n159\n\n## Animations\n\nWith JavaScript, we can\
    \ animate elements. We can use JavaScript to move elements such as `<img> />`,\
    \ `<div>` etc. on a page depending on an equation. The following are the common\
    \ methods used for animations in JavaScript:\n\n1. `setTimeout(method, time)`\
    \ - this method will call the method after sometime in milliseconds.\n2. `setInterval(method,\
    \ time)` - the method will call the method after time milliseconds.\n\nWith JavaScript,\
    \ one can set some attributes of the DOM object such as its position on the screen.\
    \ The position of the object can be set using `top` and `left` attributes. This\
    \ is demonstrated below:\n\n`object.style.left = distance measures in points or\
    \ pixels; or Ser \"the distance from the top edge of screen!\";`\n`object.style.top\
    \ = distance measures in points or pixels;`\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_160_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_160_1.png)\n\nJavaScript Programming\n\
    \n160\n\n## Manual Animation\n\nIn the following example, we will be animating\
    \ the image towards the right:\n\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
    >\nvar image = null;\nfunction init() {\n    image = document.getElementById('myImage');\n\
    \    image.style.position = 'relative';\n    image.style.left = '0px';\n}\nfunction\
    \ moveImage() {\n    image.style.left = parseInt(image.style.left) + 10 + 'px';\n\
    }\nwindow.onload = init;\n</script>\n</head>\n<body>\n<form>\n<img id=\"myImage\"\
    \ src=\"house.jpg\" />\n<p>Click the button to move the image</p>\n<input type=\"\
    button\" value=\"Move Image\" onclick=\"moveImage()\" />\n</form>\n</body>\n</html>\n\
    ```\n\nYou should use the correct name of your image in the following line:\n\
    `<img id=\"myImage\" src=\"house.jpg\" />`\n\nIn my case, I have a `.jpg` image\
    \ named `house.jpg`. When I run the code, it returns the following:\n\nClick the\
    \ button to move the image\n| Move Image |\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_162_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_162_1.png)\n\nJavaScript Programming\n\
    \n162\n\nClick the \"Move Image\" button. The image should move to the right with\
    \ each click. This is shown below:\n\nClick the button to move the image\n| Move\
    \ Image |\n\nConsider the following line in the script:\n`image = document.getElementById('myImage');`\n\
    \nWe are getting the image using its ID, then it is assigned to the `image` variable.\
    \ The `init()` method helps us set the initial position of the image on the window.\
    \ The method will be called when the window is being loaded. The `moveImage()`\
    \ function will move the image towards the right by 10 pixels after click. To\
    \ move the image towards the left, the value should be set as negative. The animation,\
    \ in this case, is manual as we have to click a button.\n\n## Automated Animation\n\
    \nTo automate the process of animating an element, we can use the `setTimeout()`\
    \ function provided by JavaScript. Example:\n\n```html\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\nvar image = null;\nvar animate;\nfunction init()\
    \ {\n    image = document.getElementById('myImage');\n    image.style.position\
    \ = 'relative';\n    image.style.left = '0px';\n}\nfunction moveImage() {\n  \
    \  image.style.left = parseInt(image.style.left) + 10 + 'px';\n    animate = setTimeout(moveImage,\
    \ 20);\n}\nfunction stopAnimation() {\n    clearTimeout(animate);\n    image.style.left\
    \ = '0px';\n}\nwindow.onload = init;\n</script>\n</head>\n<body>\n<form>\n<img\
    \ id=\"myImage\" src=\"house.jpg\" />\n<p>Click the Animate button to launch animation</p>\n\
    <input type=\"button\" value=\"Animate\" onclick=\"moveImage()\" />\n<input type=\"\
    button\" value=\"Stop\" onclick=\"stopAnimation()\" />\n</form>\n</body>\n</html>\n\
    ```\n\nThe code returns the following upon execution:\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_164_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_164_1.png)\n\nJavaScript Programming\n\
    \n165\n\nClick the \"Animate\" button. The animation should start. When you click\
    \ the Stop button, the animation will stop. The `animateImage()` method is calling\
    \ the `setTimeout` method which sets the position of the image after 20 milliseconds.\
    \ This will result in the animation of the image. The `stopAnimation()` method\
    \ helps in clearing the timer which is set by the `setTimeout()` method. The object,\
    \ which is the image, is set back to its initial position.\n\n## Rollover\n\n\
    We can use a mouse image to rollover an image in JavaScript. Once you move the\
    \ mouse over the image, it will change to another image. Example:\n\n```html\n\
    <html>\n<head>\n<script type=\"text/javascript\">\nif (document.images) {\n  \
    \  var img1 = new Image();\n    var img2 = new Image();\n    img1.src = \"house.jpg\"\
    ;\n    img2.src = \"house2.jpg\";\n}\n</script>\n</head>\n<body>\n<p>Move mouse\
    \ over rollover</p>\n<a href=\"#\" onmouseover=\"this.querySelector('img').src=img2.src\"\
    \ onmouseout=\"this.querySelector('img').src=img1.src\">\n<img src=\"house.jpg\"\
    \ />\n</a>\n</body>\n</html>\n```\n\nWe have used the `if` statement to check\
    \ whether the image exists or not. We have used the `Image` constructor to preload\
    \ some object named `img1`. The same has been done to preload the second image,\
    \ `img2`. The `src` is given the name of the image stored externally.\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_167_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_167_1.png)\n\nJavaScript Programming\n\
    \n167\n\n## Chapter 12- Browser Object Model\n\nThe BOM (Browser Object Model)\
    \ is used for interaction with the browser. The default browser object is `window`,\
    \ meaning that you can call all window functions directly or by specifying the\
    \ `window.`. We had discussed this, so we will not revisit it. Other than the\
    \ `window` object, there are various other BOM objects. Let us discuss them:\n\
    \n### History Object\n\nThis object keeps an array of all URLs that the user has\
    \ visited. You can use this object to load web pages, previous, forward and any\
    \ certain web page. This object can be accessed as shown below:\n\n`window.history`\n\
    \nIt can also be accessed as follows:\n"
