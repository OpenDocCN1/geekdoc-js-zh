    JavaScript Programming


    ## Break Statement


    With this statement, one can exit the loop early and get out of curly braces.
    Execution goes to the block after the loop.


    Example:


    ```html

    <script type="text/javascript">

    var p=0;

    document.write(

    while (p < 20) {

    if (p == 5){

    break;

    }

    document.write(p + "<br>");

    p++;

    }

    document.write("After");

    </script>

    ```


    That is how you can use a break statement in a while loop. The maximum value of
    p should be 20. However, we have instructed the JavaScript interpreter to break
    once the value of p is 5. The execution of the loop will stop at that point; the
    output should show numbers 2 to 5 as shown below:


    Starting the loop

    Leaving the loop


    ## Continue Statement


    With the continue statement, we can break our current loop, then proceed with
    the next value. Supposing you need to divide a certain number by numbers ranging
    between -5 to +5. You need to skip division by 0 since it is illegal. This can
    be skipped using the continue statement. This can be implemented as follows:


    ```html

    <script type="text/javascript">

    for (p=-5; p<=5; p++) {

    if (p==0){

    continue;

    }

    document.write((10/p)+"<br>");

    }

    </script>

    ```


    With such an implementation, the integer 10 will not be divided by 0. The code
    will return the following result:


    -2

    -2.5

    -3.3

    We have skipped division by 0 as it will generate an error if we continued from
    1.


    ## Chapter 7- JavaScript Functions


    JavaScript functions are used for performing operations. Functions are a good
    way of grouping code together. Such code should be related in terms of the tasks
    they should perform. You only have to group the code together and assign it a
    unique name. From that point, you can call the code any number of times you want,
    facilitating code reuse.


    With functions, you can enjoy the benefit of only having to do code rewriting
    or no rewriting at all.


    ### Function Definition


    The definition and call of a JavaScript function takes the following syntax:


    ```javascript

    function <function name>()

    {

    };


    <function name>();

    ```


    As shown in the above syntax, the function is given a name which is used when
    calling the function to perform its intended task.


    A function has a body placed within curly braces {}. The following is an example:


    ```html

    <script type="text/javascript">

    function HelloFunction()

    {

    document.write("Hello World");

    }

    HelloFunction();

    </script>

    ```


    We have defined a function named HelloWorld. Inside the body of the function,
    we have stated that the function should print the text Hello. Immediately after
    the body of the function, we have called it by its name. The code returns the
    following:


    HelloWorld


    Notice the method we used to call the above function. The function will be called
    immediately the web page is loaded. However, many are the times we need to call
    functions by click of a button.


    ```html

    <script type="text/javascript">

    function HelloFunction()

    {

    alert("Hello World");

    }

    </script>

    <input type="button" value="Hello" onclick="HelloFunction();

    </body>

    ```


    We have used our previous function. However, we have created a button with the
    text Hello on it. The onclick property states what should happen after clicking
    the button. It states that after the button is clicked, the HelloFunction should
    be called. Run the code and click the button. You will get the alert box with
    the necessary message: Hello World


    ## Function Arguments


    A function can take either one or more than one arguments, also known as parameters.
    The arguments should be supplied by calling code and they can be used inside the
    function. JavaScript is well known for being a dynamic scripting language, so
    the function argument can take an argument of any data type. Consider the following
    example:


    ```html

    <script type="text/javascript">

    function MyFunction(arg1, arg2)

    {

    alert(arg1 + " " + arg2);

    }

    MyFunction(10, 12);

    MyFunction("Hello", "");

    </script>

    ```


    We have created a function named MyFunction taking two arguments namely arg1 and
    arg2. The function is to concatenate the values of these two arguments with a
    text and show them on an alert box. We have then called the same function three
    times, passing different parameters each time. After running the code, the first
    dialog should be as follows:


    You passed 10 and 12


    Note that the arguments will be passed to the function in the order that you specify
    them. Here is another example:


    ```html

    <script type="text/javascript">

    function calculateCube(x)

    {

    return (x * x * x);

    }

    </script>

    <input type="button" value="Calculate Cube" onclick="alert(calculateCube(3));"

    ```


    We have created a button with the text Calculate Cube. When clicked, this call
    the calculateCube function. In the parameter, we have specified the function and
    passed an argument of 3 to it. This means that it should return the cube of 3,
    which is 27. Just run the program and click the Calculate button. Note that when
    calling a function, you can pass either more or fewer parameters. If you pass
    fewer parameters than the function expects, the rest will remain undefined. If
    you pass more arguments, the excess ones will be ignored. This is demonstrated
    in the following example:


    ```html

    <script type="text/javascript">

    function MyFunction(arg1, arg2)

    {

    alert(arg1 + " " + arg2);

    }

    MyFunction(10, 12);

    MyFunction("Hello", "");

    MyFunction(10);

    </script>

    ```

