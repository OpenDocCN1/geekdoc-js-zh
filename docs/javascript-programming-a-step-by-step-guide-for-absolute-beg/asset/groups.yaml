    - language- it returns the language. Supported in Firefox and Netscape only.

    - userAgent- it returns user agent

    - userLanguage- it returns the users’ language. It’s supported only in IE.

    - systemLanguage- it returns system language. Supported only in IE.

    - Plugins- it returns the plugins. Supported in Firefox and Netscape only.

    - mimeTypes[]- it returns an array of mime type. Supported in Firefox and Netscape
    only.

    - online- it returns true if the browser is online and false otherwise.

    - platform- it returns the platform such as Win32.


    The navigator object has the following methods:


    - javaEnabled()- it checks whether java has been enabled.

    - tlsEnabled()- it checks whether tls has been enabled. Deprecated from JavaScript
    1.2.


    Consider the navigator object example below:


    ```javascript

    document.writeln(+navigator.appName);

    document.write(""+navigator.appCodeName);

    document.writeln(""+navigator.language);

    document.writeln(""+navigator.cookieEnabled);

    document.writeln("+navigator.userAgent);

    document.writeln(""+navigator.platform);

    ```


    The code returns the following details:

    appName: Netscape

    appCodeName: Mozilla

    appVersion: 5.0 (Windows)

    language: en-US

    cookieEnabled: true

    userAgent: Mozilla/5.0 (Windows NT 6.1; WOW64; rv:52.0) Gecko/2010101 Firefox/52.0

    platform: Win32


    Note that the output will depend on the kind of operating system, the browser
    you are using and other details.


