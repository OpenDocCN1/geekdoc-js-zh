- md: "\n## JavaScript Programming\n\n### 197\n\n```javascript\n<script>\nfunction\
    \ stud(admission, name, age) {\n    this.admission = admission;\n    this.name\
    \ = name;\n    this.age = age;\n    this.updateAge = updateAge;\n    function\
    \ updateAge(newAge) {\n        this.age = newAge;\n    }\n}\n\nvar s = new stud(4380,\
    \ \"John Joel\", 28);\ndocument.write(s.admission + \" \" + s.name + \" \" + s.age);\n\
    s.updateAge(29);\ndocument.write(s.admission + \" \" + s.name + \" \" + s.age);\n\
    </script>\n```\n\nThe code returns the following upon execution:\n4380 John Joel\
    \ 28\n\nJavaScript allows us to define a method in an object. But before we can\
    \ define the method, we should first define a property with the same name as the\
    \ method. The following example shows how we can define a method in an object:\n\
    \n```javascript\n<script>\nfunction stud(admission, name, age) {\n    this.admission\
    \ = admission;\n    this.name = name;\n    this.age = age;\n    this.updateAge\
    \ = updateAge;\n    function updateAge(newAge) {\n        this.age = newAge;\n\
    \    }\n}\n\nvar s = new stud(4380, \"John Joel\", 28);\ndocument.write(s.admission\
    \ + \" \" + s.name + \" \" + s.age);\ns.updateAge(29);\ndocument.write(s.admission\
    \ + \" \" + s.name + \" \" + s.age);\n</script>\n```\n\nThe code will return the\
    \ following result after:\n4380 John Joel 29\n\nWe have defined the `updateAge`\
    \ method that helps us change the age of the student. In the example, the age\
    \ of the student has been updated from 28 to 29.\n\n### Prototype\n\nJavaScript\
    \ language works on prototypes, allowing the objects to acquire features and properties\
    \ from each other. Here, every object has a prototype object. After the creation\
    \ of a function in JavaScript, the `prototype` property gets added to that function\
    \ automatically. The property is a prototype object holding the constructor property.\n\
    \n### 199\n\nHere is the syntax for the creation of a prototype object in JavaScript:\
    \ After creating an object, the functions that correspond to it are loaded into\
    \ the memory. This means that a new copy of a function for every object. Thus,\
    \ all functions are loaded into the memory at once.\n\n### Prototype Chaining\n\
    \nEach JavaScript object has a prototype object that acquires methods and properties\
    \ from it. A prototype of an object may have a prototype object that can acquire\
    \ methods and properties, and this continues. We can see this as prototype chaining.\
    \ The following example demonstrates how we can add a new method to a constructor\
    \ function:\n\n```javascript\n<script>\nfunction Student(firstName, lastName)\
    \ {\n    this.firstName = firstName;\n    this.lastName = lastName;\n}\n\nStudent.prototype.fullName\
    \ = function() {\n    return this.firstName + \" \" + this.lastName;\n}\n\nvar\
    \ student1 = new Student(\"John\", \"Joel\");\nvar student2 = new Student(\"Mary\"\
    , \"George\");\ndocument.writeln(student1.fullName());\ndocument.writeln(student2.fullName());\n\
    </script>\n```\n\nThe code returns the following result:\nThe `fullName` function\
    \ combines the firstName and the lastName to return the full name of the student.\n\
    \nLet us create another example that demonstrates how to add a new property to\
    \ a constructor function:\n\n```javascript\n<script>\nfunction Student(firstName,\
    \ lastName) {\n    this.firstName = firstName;\n    this.lastName = lastName;\n\
    }\n\nStudent.prototype.school = \"ABC\";\n\nvar student1 = new Student(\"John\"\
    , \"Joel\");\nvar student2 = new Student(\"Mary\", \"George\");\ndocument.writeln(student1.firstName\
    \ + \" \" + student1.lastName + \" \" + student1.school);\ndocument.writeln(student2.firstName\
    \ + \" \" + student2.lastName + \" \" + student2.school);\n</script>\n```\n\n\
    The code should return the following result:\nJohn Joel ABC\nMary George ABC\n\
    \nWe have created a prototype for school and all students are inheriting it. That\
    \ is why they belong to school.\n\n### Constructor Method\n\nA constructor method\
    \ is a special method in JavaScript used for initialization and creation of objects.\
    \ It is called after the allocation of memory to an object. The constructor method\
    \ is declared using the `constructor` keyword. A class can only have one constructor\
    \ method. The parent class constructor can be used via the `super` keyword. The\
    \ following example shows how to declare a constructor method:\n\n```javascript\n\
    <script>\nclass Student {\n    constructor() {\n        this.admission = 4380;\n\
    \        this.name = \"John\";\n    }\n}\n\nvar stud = new Student();\ndocument.writeln(stud.admission\
    \ + \" \" + stud.name);\n</script>\n```\n\nThe code will return the following\
    \ result after:\n4380 John\n\nNote that the constructor has a body denoted by\
    \ curly braces `{}`. It is within the body of the constructor that we have created\
    \ and initialized the various properties. As stated above, we can use the `super`\
    \ keyword to call the constructor of the parent class.\n\n### Static\n\nJavaScript\
    \ provides us with static methods which only belong to the class but not to the\
    \ class instances. This means that we don’t need an instance to invoke a static\
    \ method. We call these methods directly on the class.\n\nA static method is declared\
    \ using the `static` keyword. The method can take any name. A JavaScript class\
    \ is allowed to have more than one static method. In case more than one static\
    \ method is declared using one name, then the last method will be invoked. A static\
    \ method can be called within another static method using `this` keyword. A static\
    \ method can be used for the creation of utility functions. Here is an example\
    \ of a static method:\n\n```javascript\n<script>\nclass StaticTest {\n    static\
    \ show() {\n        return \"method has been invoked\";\n    }\n}\n\ndocument.writeln(StaticTest.show());\n\
    </script>\n```\n\nThe code will print the following:\nmethod has been invoked\n\
    \nThe `show()` method has been declared using the `static` keyword, which makes\
    \ it a static method. Let us see how one can invoke more than one static method:\n\
    \n```javascript\n<script>\nclass StaticTest {\n    static show1() {\n        return\
    \ \"method has been invoked\";\n    }\n    static show2() {\n        return \"\
    method invoked again\";\n    }\n}\n\ndocument.writeln(StaticTest.show1());\ndocument.writeln(StaticTest.show2());\n\
    </script>\n```\n\nThe code will return the following once executed:\nmethod has\
    \ been invoked\nmethod invoked again\n\nWe have created two static methods, `show1()`\
    \ and `show2()`. We have then invoked them to get the result shown above.\n"
  mdcn: "\n\n## JavaScript 编程\n\n### 197\n\n```javascript\n<script>\nfunction stud(admission,\
    \ name, age) {\n    this.admission = admission;\n    this.name = name;\n    this.age\
    \ = age;\n    this.updateAge = updateAge;\n    function updateAge(newAge) {\n\
    \        this.age = newAge;\n    }\n}\n\nvar s = new stud(4380, \"John Joel\"\
    , 28);\ndocument.write(s.admission + \" \" + s.name + \" \" + s.age);\ns.updateAge(29);\n\
    document.write(s.admission + \" \" + s.name + \" \" + s.age);\n</script>\n```\n\
    \n该代码执行后返回如下：\n4380 John Joel 28\n\nJavaScript 允许我们在对象中定义方法。但在定义方法之前，我们应该首先定义一个与方法同名的属性。接下来的示例展示了我们如何在对象中定义一个方法：\n\
    \n```javascript\n<script>\nfunction stud(admission, name, age) {\n    this.admission\
    \ = admission;\n    this.name = name;\n    this.age = age;\n    this.updateAge\
    \ = updateAge;\n    function updateAge(newAge) {\n        this.age = newAge;\n\
    \    }\n}\n\nvar s = new stud(4380, \"John Joel\", 28);\ndocument.write(s.admission\
    \ + \" \" + s.name + \" \" + s.age);\ns.updateAge(29);\ndocument.write(s.admission\
    \ + \" \" + s.name + \" \" + s.age);\n</script>\n```\n\n代码后将返回如下结果：\n4380 John\
    \ Joel 29\n\n我们定义了 `updateAge` 方法，它可以帮助我们更改学生的年龄。在示例中，学生的年龄已从 28 更新为 29。\n\n###\
    \ 原型 (Prototype)\n\nJavaScript 语言基于原型工作，允许对象从相互获取特征和属性。在这里，每个对象都有一个原型对象。在 JavaScript\
    \ 中创建一个函数后，`prototype` 属性会自动添加到该函数中。该属性是一个持有构造函数（constructor）属性的原型对象。\n\n### 199\n\
    \n这里是 JavaScript 中创建原型对象的语法：在创建对象后，对应的函数会被加载到内存中。这意味着每个对象都有一个函数的新副本。因此，所有函数都会一次性加载到内存中。\n\
    \n### 原型链 (Prototype Chaining)\n\n每个 JavaScript 对象都有一个原型对象，并从那里获取方法和属性。一个对象的原型可能有另一个原型对象，而该原型也可以获取方法和属性，以此此类推。我们可以将其视为原型链。接下来的示例演示了我们如何向构造函数添加一个新方法：\n\
    \n```javascript\n<script>\nfunction Student(firstName, lastName) {\n    this.firstName\
    \ = firstName;\n    this.lastName = lastName;\n}\n\nStudent.prototype.fullName\
    \ = function() {\n    return this.firstName + \" \" + this.lastName;\n}\n\nvar\
    \ student1 = new Student(\"John\", \"Joel\");\nvar student2 = new Student(\"Mary\"\
    , \"George\");\ndocument.writeln(student1.fullName());\ndocument.writeln(student2.fullName());\n\
    </script>\n```\n\n代码返回如下结果：\n`fullName` 函数结合了 `firstName` 和 `lastName` 以返回学生的全名。\n\
    \n让我们创建另一个示例，演示如何向构造函数添加一个新属性：\n\n```javascript\n<script>\nfunction Student(firstName,\
    \ lastName) {\n    this.firstName = firstName;\n    this.lastName = lastName;\n\
    }\n\nStudent.prototype.school = \"ABC\";\n\nvar student1 = new Student(\"John\"\
    , \"Joel\");\nvar student2 = new Student(\"Mary\", \"George\");\ndocument.writeln(student1.firstName\
    \ + \" \" + student1.lastName + \" \" + student1.school);\ndocument.writeln(student2.firstName\
    \ + \" \" + student2.lastName + \" \" + student2.school);\n</script>\n```\n\n\
    代码应返回如下结果：\nJohn Joel ABC\nMary George ABC\n\n我们为原型了 school。\n\n### 构造方法 (Constructor\
    \ Method)\n\n构造方法是 JavaScript 中的一种特殊方法，用于初始化对象。它使用 `constructor` 关键字声明。类只能有一个构造方法。接的示例展示了如何声明构造方法：\n\
    \n```javascript\n<script>\nclass Student {\n    constructor() {\n        this.admission\
    \ = 4380;\n        this.name = \"John\";\n    }\n}\n\nvar stud = new Student();\n\
    document.writeln(stud.admission + \" \" + stud.name);\n</script>\n```\n\n代码后返回如下结果：\n\
    4380 John\n\n注意构造方法用大括号 `{}` 表示。在构造方法体内部创建了各种属性。\n\n### 静态 (Static)\n\nJavaScript\
    \ 为我们提供了静态方法，它们只属于类而不属于类的实例。这意味着我们不需要实例化即可调用静态方法。直接在类上调用这些方法。\n\n静态方法使用 `static`\
    \ 关键字声明。方法可以取任何名称。JavaScript 类允许拥有多个静态方法。如果使用同一个名称声明了多个静态方法，则最后一个会被调用。静态方法可以通过\
    \ `this` 关键字在另一个静态方法中调用。静态方法可以用于工具函数。这里有一个静态方法的示例：\n\n```javascript\n<script>\n\
    class StaticTest {\n    static show() {\n        return \"method has been invoked\"\
    ;\n    }\n}\n\ndocument.writeln(StaticTest.show());\n</script>\n```\n\n代码将打印：\n\
    method has been invoked\n\n`show()` 方法使用 `static` 关键字声明，使其成为静态方法。让我们看看如何调用多个静态方法：\n\
    \n```javascript\n<script>\nclass StaticTest {\n    static show1() {\n        return\
    \ \"method has been invoked\";\n    }\n    static show2() {\n        return \"\
    method invoked again\";\n    }\n}\n\ndocument.writeln(StaticTest.show1());\ndocument.writeln(StaticTest.show2());\n\
    </script>\n```\n\n该代码执行后将返回：\nmethod has been invoked\nmethod invoked again\n\n\
    我们创建了两个静态方法，`show1()` 和 `show2()`。我们调用了它们以获得上所示的结果。\n\n"
