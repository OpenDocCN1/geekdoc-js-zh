- md: "\nJavaScript Programming\n\nPlay | Stop | Rewind\n\nThe example is capable\
    \ of working on any browser.\n\nChapter 16- Error Handling\n\nJavaScript is one\
    \ of the loosely-typed languages that we have. It doesn’t have a compile time.\
    \ Errors normally occur during programming. You can attempt to access an undefined\
    \ variable or function. The errors are classified as syntax errors, runtime errors\
    \ and logical errors. Let us discuss them.\n\n### Syntax Errors\n\nIn JavaScript,\
    \ syntax errors occur during interpret time. They are also known as parsing errors.\
    \ Consider the sample script given below:\n\n```html\n<script type=\"javascript\"\
    >\n  window.print()\n</script>\n```\n\nJavaScript statement should end with a\
    \ semicolon. The “window.print()\" statement doesn’t end with a semicolon, hence\
    \ this will result in a syntax error. If a statement has a syntax error, all statements\
    \ in the same thread as this will be affected. The other threads will be executed\
    \ normally.\n\n### Runtime Errors\n\nThese are the exceptions raised during runtime.\
    \ Execution occurs after interpretation.\n\nExample:\n\n```html\n<script type=\"\
    javascript\">\n  window.printFile();\n</script>\n```\n\nDuring interpretation,\
    \ no error will be raised since the script has the correct syntax. However, an\
    \ exception will be raised during runtime as the script will call a method which\
    \ is unknown, that is, the printFile() method.\n\n### Logical Errors\n\nThese\
    \ types of errors occur when you fail to implement the right logic in your script,\
    \ meaning you will not get the expected results. They can be hard for one to track.\
    \ They don’t result from either runtime or syntax errors. One cannot catch those\
    \ types of errors since they depend on the business logic to be implemented.\n\
    \n### try...catch...finally\n\nWith JavaScript, you can handle errors and exceptions.\
    \ When this statement is combined with the throw, one can handle errors and exceptions\
    \ more effectively. The statement has the syntax given below:\n\n```html\n<script\
    \ type=\"javascript\">\ntry {\n  // break\n} catch (ex) {\n  // break;\n} finally\
    \ {\n  // break\n}\n</script>\n```\n\nA try block should be followed by either\
    \ catch or finally block. On the occurrence of the exception in try block, an\
    \ exception will be added to the ex, then catch block will be executed. The final\
    \ block is optional and it is unconditionally executed after the try/catch.\n\n\
    Example:\n\n```html\n<script type=\"javascript\">\nfunction checkFunction() {\n\
    \  var check, val;\n  check = document.getElementById(\"check\");\n  check.innerHTML\
    \ = \"\";\n  val = document.getElementById(\"check\").value;\n  try {\n    if\
    \ (isNaN(val)) throw \"Enter a number\";\n    val = Number(val);\n    if (val\
    \ < 10 || val > 20) throw \"between 10 and 20\";\n  } catch (ex) {\n    check.innerHTML\
    \ = ex;\n  }\n}\n</script>\n```\n\nIn our case, we are using the try and catch\
    \ to validate our input field. The input should be a number ranging between 10\
    \ and 20. If this is not adhered to, an exception will be raised then handled\
    \ by the try and catch.\n\n### finally Statement\n\nThis statement specifies the\
    \ code to be executed after a try and catch, and it must be executed regardless\
    \ of the result. following is its syntax:\n\n```javascript\ntry {\n  // code for\
    \ try\n} catch (err) {\n  // code for handling errors\n} finally {\n  // code\
    \ for finally\n}\n```\n\nExample:\n\n```html\n<script type=\"javascript\">\nfunction\
    \ checkFunction() {\n  var check, val;\n  check = document.getElementById(\"check\"\
    );\n  check.innerHTML = \"\";\n  val = document.getElementById(\"check\").value;\n\
    \  try {\n    if (val == \"\") throw \"The field is empty\";\n    if (isNaN(val))\
    \ throw \"Enter a number\";\n    val = Number(val);\n    if (val < 10 || val >\
    \ 20) throw \"between 10 and 20\";\n  } catch (ex) {\n    check.innerHTML = ex;\n\
    \  } finally {\n    document.getElementById(\"check\").value = \"\";\n  }\n}\n\
    </script>\n```\n\nThe fieldJavaScript has a class named RegExp which helps programmers\
    \ work with regular expressions. With this class, one can perform pattern matching,\
    \ replace and search functions on some text. To define a regular expression, we\
    \ use the RegExp constructor. This is demonstrated below:\n\n```javascript\nexpression\
    \ = new RegExp(\"pattern\");\n```\n\nThe parameter the_pattern is a string specifying\
    \ the pattern of regular expression or any other regular expression. The flags\
    \ parameter is an optional string with either the \"i\", \"m\" and \"g\" attributes\
    \ specifying case-insensitive, multi-line and global matches respectively.\n\n\
    Let us discuss the various methods for Regular Expressions in JavaScript.\n\n\
    ### exec()\n\nThis method will search a string for text matching the regexp. If\
    \ a match is found, the results will be returned in an array, otherwise, it will\
    \ return null.\n\nThe method has the following syntax:\n\n```javascript\nregexp.exec(search_string);\n\
    ```\n\nThe parameter search_string denotes the string that is to be searched for.\
    \ Consider the following example:\n\n```html\n<script type=\"javascript\">\n \
    \ var text = \".47\";\n  var reg = new RegExp(\"\\\\.\");\n  var output = reg.exec(text);\n\
    \  document.write(\"+\" + output);\n\n  reg = new RegExp(\":\");\n  output = reg.exec(text);\n\
    \  document.write(\".\" + output);\n</script>\n```\n\nThe code returns the following\
    \ output after execution:\n\nFirst test, the returned value 15: express\nSecond\
    \ test.the returned value is null\nWe first searched for the string express which\
    \ was found in the expressions. Secondly, we searched for the string language\
    \ and it was not found in our sentence.\n\n### test()\n\nThis method searches\
    \ a string for text matching the regexp. If a match is found, it will return a\
    \ true, otherwise, it will return a false. The method has the following syntax:\n\
    \n```javascript\nregexp.test(search_string);\n```\n\nThe parameter search_string\
    \ is the string that is to be searched for.\n"
  mdcn: "\n\nJavaScript 编程\n\n播放 | 停止 | 重播\n\n此示例可以在任何浏览器上运行。\n\n第 16 章 错误处理\n\nJavaScript\
    \ 是我们拥有的弱类型语言之一。它没有编译阶段。错误通常在编程过程中发生。你可以尝试访问未定义的变量或函数。错误被分为语法错误、运行时错误和逻辑错误。让我们来讨论它们。\n\
    \n### 语法错误\n\n在 JavaScript 中，语法错误发生在解释期间。它们也被称为解析错误。考虑下面提供的示例脚本：\n\n```html\n\
    <script type=\"javascript\">\n  window.print()\n</script>\n```\n\nJavaScript 语句应该以分号结束。\"\
    window.print()\"语句没有以分号结束，因此这将导致语法错误。如果一个语句存在语法错误，与其处于同一线程中的所有语句都会受到影响。其他线程将正常执行。\n\
    \n### 运行时错误\n\n这些是在运行期间抛出的异常。执行发生在解释之后。\n\n示例：\n\n```html\n<script type=\"javascript\"\
    >\n  window.printFile();\n</script>\n```\n\n在解释期间，不会产生错误，因为脚本具有正确的语法。但在运行时会抛出异常，因为脚本将调用一个未知的方法，即\
    \ printFile() 方法。\n\n### 逻辑错误\n\n这类错误发生在你未能于脚本中实现正确的逻辑时，这意味着你无法获得预期的结果。它们对人们来说很难追踪。它们不是由运行时错误或语法错误引起的。人们无法捕获这类错误，因为它们取决于要实现的业务逻辑。\n\
    \n### try...catch...finally\n\n在 JavaScript 中，你可以处理错误和异常。当此语句与 `throw` 结合时，可以更有效地处理错误和异常。该语句的语法如下：\n\
    \n```html\n<script type=\"javascript\">\ntry {\n  // break\n} catch (ex) {\n \
    \ // break;\n} finally {\n  // break\n}\n</script>\n```\n\ntry 块后面应该紧跟 catch 或\
    \ finally 块。当 try 块中发生异常时，异常将被添加到 ex 中，然后执行 catch 块。finally 块是可选的，它在 try/catch\
    \ 之后会无条件地执行。\n\n示例：\n\n```html\n<script type=\"javascript\">\nfunction checkFunction()\
    \ {\n  var check, val;\n  check = document.getElementById(\"check\");\n  check.innerHTML\
    \ = \"\";\n  val = document.getElementById(\"check\").value;\n  try {\n    if\
    \ (isNaN(val)) throw \"Enter a number\";\n    val = Number(val);\n    if (val\
    \ < 10 || val > 20) throw \"between 10 and 20\";\n  } catch (ex) {\n    check.innerHTML\
    \ = ex;\n  }\n}\n</script>\n```\n\n在我们的案例中，我们使用 try 和 catch 来验证我们的输入字段。输入应该是 10\
    \ 到 20 之间的数字。如果不符合这一规定，将抛出异常并由 try 和 catch 处理。\n\n### finally 语句\n\n该语句指定了在 try\
    \ 和 catch 之后执行的代码，无论结果如何都必须执行。以下是它的语法：\n\n```javascript\ntry {\n  // code for\
    \ try\n} catch (err) {\n  // code for handling errors\n} finally {\n  // code\
    \ for finally\n}\n```\n\n示例：\n\n```html\n<script type=\"javascript\">\nfunction\
    \ checkFunction() {\n  var check, val;\n  check = document.getElementById(\"check\"\
    );\n  check.innerHTML = \"\";\n  val = document.getElementById(\"check\").value;\n\
    \  try {\n    if (val == \"\") throw \"The field is empty\";\n    if (isNaN(val))\
    \ throw \"Enter a number\";\n    val = Number(val);\n    if (val < 10 || val >\
    \ 20) throw \"between 10 and 20\";\n  } catch (ex) {\n    check.innerHTML = ex;\n\
    \  } finally {\n    document.getElementById(\"check\").value = \"\";\n  }\n}\n\
    </script>\n```\n\nJavaScript 有一个名为 RegExp 的类，有助于程序员处理正则表达式。通过这个类，人们可以对某些文本执行模式匹配、替换和搜索函数。要定义正则表达式，我们使用\
    \ RegExp 构造函数。如下所示：\n\n```javascript\nexpression = new RegExp(\"pattern\");\n\
    ```\n\n参数 `the_pattern` 是一个字符串，指定正则表达式的模式或其他任何正则表达式。`flags` 参数是一个可选字符串，具有 \"i\"\
    、\"m\" 和 \"g\" 属性，分别指定不区分大小写、多行和全局匹配。\n\n让我们讨论 JavaScript 中正则表达式的各种方法。\n\n###\
    \ exec()\n\n该方法将在字符串中搜索匹配 regexp 的文本。如果找到匹配，结果将以数组返回，否则将返回 null。\n\n该方法具有以下语法：\n\
    \n```javascript\nregexp.exec(search_string);\n```\n\n参数 `search_string` 表示要搜索的字符串。考虑以下示例：\n\
    \n```html\n<script type=\"javascript\">\n  var text = \".47\";\n  var reg = new\
    \ RegExp(\"\\\\.\");\n  var output = reg.exec(text);\n  document.write(\"+\" +\
    \ output);\n\n  reg = new RegExp(\":\");\n  output = reg.exec(text);\n  document.write(\"\
    .\" + output);\n</script>\n```\n\n代码执行后返回以下输出：\n\n第一次测试，返回的值为 15: express\n第二次测试。返回的值为\
    \ null\n我们首先搜索了字符串 express，它在 expressions 中被找到了。其次，我们搜索了字符串 language，它在我们的句子中没有被找到。\n\
    \n### test()\n\n该方法在字符串中搜索匹配 regexp 的文本。如果找到匹配，它将返回 true，否则将返回 false。该方法具有以下语法：\n\
    \n```javascript\nregexp.test(search_string);\n```\n\n参数 `search_string` 是要搜索的字符串。\n\
    \n"
