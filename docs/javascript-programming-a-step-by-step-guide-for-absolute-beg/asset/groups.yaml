    JavaScript 编程


    ## break 语句


    通过此语句，可以提前退出循环并跳出大括号。执行将到循环之后的块。


    示例：


    ```html

    <script type="text/javascript">

    var p=0;

    document.write(

    while (p < 20) {

    if (p == 5){

    break;

    }

    document.write(p + "<br>");

    p++;

    }

    document.write("After");

    </script>

    ```


    这就是在 `while` 循环中使用 `break` 语句的方法。p 的最大值本应为 20。然而，我们指示 JavaScript 解释器在 p 的值为 5
    时跳出。循环的执行将在该处停止；输出应显示所示的 2 到 5 的数字：


    开始循环

    退出循环


    ## continue 语句


    通过 `continue` 语句，我们可以中断当前的循环，然后处理下一个值。假设你需要将一个数字除以从 -5 到 +5 之间的任意数字。你需要跳过除以 0
    的除法，因为这是非法的。可以使用 `continue` 语句来跳过它。实现方式如下：


    ```html

    <script type="text/javascript">

    for (p=-5; p<=5; p++) {

    if (p==0){

    continue;

    }

    document.write((10/p)+"<br>");

    }

    </script>

    ```


    通过这种实现，整数 10 将不会除以 0。代码将返回以下结果：


    -2

    -2.5

    -3.3

    我们跳过了除以 0 的操作，因为如果从 1 继续，将会产生错误。


    ## 第 7 章 - JavaScript 函数


    JavaScript 函数用于执行操作。函数是将代码组合在一起的好方法。此类代码在它们应执行的任务应该是相关的。你只需要将代码组合在一起并分配一个唯一的名称。从该点起，你可以根据需要多次调用该代码，有助于代码复用。


    通过函数，你可以享受只需重写代码或完全不需要重写代码的好处。


    ### 函数定义


    JavaScript 函数的定义和调用采用以下语法：


    ```javascript

    function <function name>()

    {

    };


    <function name>();

    ```


    如所示，函数被赋予了一个名称，在调用函数以执行其预期任务时会使用该名称。


    函数有一个位于大括号 {} 内部的体。以下是一个示例：


    ```html

    <script type="text/javascript">

    function HelloFunction()

    {

    document.write("Hello World");

    }

    HelloFunction();

    </script>

    ```


    我们定义了一个名为 `HelloWorld` 的函数。在函数体内，我们规定了函数应该打印文本 Hello。在函数体之后，我们通过其名称调用了它。代码返回以下内容：


    HelloWorld


    注意我们调用上述函数的方法。该函数将在网页加载时立即被调用。然而，很多时候我们需要通过点击按钮来调用函数。


    ```html

    <script type="text/javascript">

    function HelloFunction()

    {

    alert("Hello World");

    }

    </script>

    <input type="button" value="Hello" onclick="HelloFunction();

    </body>

    ```


    我们使用了之前的函数。但是，我们创建了一个带有 Hello 文字的按钮。`onclick` 属性规定了点击按钮后应该发生什么。它规定点击按钮后应该调用 `HelloFunction`。运行代码并点击按钮。你将得到带有必要消息的警告框：Hello
    World


    ## 函数参数


    函数可以接受一个或多个参数，也称为参数。参数应由调用代码提供，并可以在函数内部使用。JavaScript 以作为动态脚本语言而闻名，因此函数参数可以接受任何数据类型的参数。考虑以下示例：


    ```html

    <script type="text/javascript">

    function MyFunction(arg1, arg2)

    {

    alert(arg1 + " " + arg2);

    }

    MyFunction(10, 12);

    MyFunction("Hello", "");

    </script>

    ```


    我们创建了一个名为 `MyFunction` 的函数，接受两个参数，即 `arg1` 和 `arg2`。函数的作用是将这两个参数的值与文本拼接并在警告框中显示它们。然后我们又调用了三次同一个函数，每次传递不同的参数。运行代码后，第一个对话框如下：


    You passed 10 and 12


    注意，参数将按照你指定的顺序传递给函数。这里是另一个示例：


    ```html

    <script type="text/javascript">

    function calculateCube(x)

    {

    return (x * x * x);

    }

    </script>

    <input type="button" value="Calculate Cube" onclick="alert(calculateCube(3));"

    ```


    我们创建了一个带有 Calculate Cube 文字的按钮。点击时，这会调用 `calculateCube` 函数。在参数中，我们指定了函数并向其传递了参数
    3。这意味着它应该返回 3 的立方，即 27。只需运行程序并点击 Calculate 按钮。注意，在调用函数时，你可以传递更多或更少的参数。如果你传递的参数比函数预少，其余部分将保持未定义（undefined）。如果你传递更多参数，多余的将被忽略。以下示例演示这一点：


    ```html

    <script type="text/javascript">

    function MyFunction(arg1, arg2)

    {

    alert(arg1 + " " + arg2);

    }

    MyFunction(10, 12);

    MyFunction("Hello", "");

    MyFunction(10);

    </script>

    ```


