- md: "\nJavaScript Programming\n237\n\n```javascript\nvar reg = new RegExp(\"nameertipaths\"\
    );\nvar output = reg.test(text);\ndocument.write(\"Output\" + output);\n</script>\n\
    ```\n\nThe code returns the following result:\nFirst test returned:\ntrue\nSecond\
    \ test returned: false\n\nIn the first test, a match was found, hence the output\
    \ is true. In the second test, no match was found, hence it returned a false.\n\
    \n### search()\n\nThis method searches for a string, similarly to indexOf function\
    \ except that it will take a regular expression rather than a string. An integer\
    \ is returned indicating the string position. Note that 0 indicates the beginning\
    \ of a string, 7 will match the 8th character, etc. If no match is found, then\
    \ a -1 will be returned:\n\n```html\n<script type=\"javascript\">\nvar myString\
    \ = \"|example\";\nvar m = myString.search(/Best[0-9]+/);\ndocument.writeln(m)\n\
    </script>\n```\n\nThe script returns a 6 upon execution. When used, this method\
    \ will return the string representation of the regular expression in question\
    \ in regular expression literal form. The method takes the syntax given below:\n\
    \n`RegExpObject.toString();`\n\nThe method then returns a string representation\
    \ of your regular expression.\n\nFor example:\n\n```html\n<script type=\"javascript\"\
    >\nvar text = \"DeepLearning\";\nvar reg = new RegExp(\"ee\");\nvar output = reg.toString();\n\
    document.write(\"Output\" + output);\n</script>\n```\n\nThe code will return the\
    \ following result upon execution:\nFirst test returned: /ee/\nSecond test returned:\
    \ 'g'\n\n## Chapter 18- Image Map\n\nJavaScript can be used for the creation of\
    \ a client-side image map. To enable client-side image maps, we use the `usemap`\
    \ attribute of `<img />` tag. We use the `<area>` and `<map>` tags to define them.\
    \ The image to form the map is inserted using the `<img />` tag and a special\
    \ attribute known as `usemap`. The value for this attribute should match the value\
    \ of the `name` attribute used in the `<map>` element, and it should be preceded\
    \ by a hash or pound sign.\n\nThe `<map>` tag creates a map for your image and\
    \ it should come after the `<img />` element. It will form the container for `<area\
    \ />` elements defining the clickable hotspots. The `<map>` element has only one\
    \ attribute, `name`, which is a name identifying the map. This helps the `<img\
    \ />` element know the `<map>` element which it is to use. The coordinates and\
    \ the shape of the clickable hotspots are defined using the `<area>` element.\n\
    \nConsider the following example:\n\n```html\n<html>\n<head>\n<script type=\"\
    javascript\">\nfunction showLanguage(name) {\n    document.form.lang.value = name;\n\
    }\n</script>\n</head>\n<body>\n<form name=\"f1\">\n<input type=\"text\" name=\"\
    lang\" size=\"20\">\n</form>\n<img src=\"map.gif\" alt=\"Map\" usemap=\"#map1\"\
    >\n<map name=\"map1\">\n<area shape=\"rect\" coords=\"0,0,50,50\" href=\"english.html\"\
    \ onclick=\"showLanguage('English')\">\n<area shape=\"circle\" coords=\"60,60,20\"\
    \ href=\"spanish.html\" onclick=\"showLanguage('Spanish')\">\n</map>\n</body>\n\
    </html>\n```\n\nThe code gives me interface after execution. The result I get\
    \ depends on the part I point at shown below:\n\n## Chapter 19- Page Redirection\n\
    \nSometimes you encounter situations in which you click on a URL to visit a certain\
    \ page X but you are internally directed to another page Y. This is how page redirection\
    \ works. There are a number of reasons why you may need to redirect your users\
    \ to another page. A good example is when you move to a new domain. You can use\
    \ page redirection to direct your visitors to the new website. In such a case,\
    \ you only have to maintain your old domain then add a single page with the page\
    \ redirection feature so that anyone who visits your old domain is taken to your\
    \ new website.\n\nSometimes, you can create different web pages for different\
    \ versions of browsers or when the pages are for different countries. Instead\
    \ of relying on server side redirection, you can choose to use client side redirection\
    \ to ensure that each visit lands on the right page. Page redirection is also\
    \ important in cases where your web pages have been indexed by the search engines.\
    \ When you move to a new domain, there is no need for you to lose your search\
    \ engine visitors. In this case, the client side page redirection will help you.\
    \ However, don’t do it as a way of fooling the browsers as doing so may see your\
    \ web pages banned on the browsers.\n\nClient side page redirection can be implemented\
    \ easily in JavaScript. To do this, you are only required to add a line at the\
    \ head section of your code. This will do the redirection. Let us demonstrate\
    \ this:\n\n```html\n<html>\n<head>\n<script type=\"javascript\">\nfunction RedirectFunction()\
    \ {\n    window.location=\"http://www.google.com\";\n}\n</script>\n</head>\n<body>\n\
    <p>Click the button below for redirection</p>\n<form>\n<input type=\"button\"\
    \ value=\"Click Here\" onclick=\"RedirectFunction()\">\n</form>\n</body>\n</html>\n\
    ```"
  mdcn: "\nJavaScript 编程\n237\n\n```javascript\nvar reg = new RegExp(\"nameertipaths\"\
    );\nvar output = reg.test(text);\ndocument.write(\"Output\" + output);\n</script>\n\
    ```\n\n代码返回以下结果：\n第一次测试返回：\ntrue\n第二次测试返回： false\n\n在第一次测试中，找到了匹配项，因此输出为 true。在第二次测试中，没有找到匹配项，因此返回了\
    \ false。\n\n### search()\n\n该方法用于搜索字符串，与 `indexOf` 函数类似，不同之处它接受的是正则表达式而不是字符串。它返回一个整数，表示字符串的位置。注意，0\
    \ 表示字符串的开头，7 将匹配第 8 个字符，以此此类。如果没有找到匹配项，则返回 -1：\n\n```html\n<script type=\"javascript\"\
    >\nvar myString = \"|example\";\nvar m = myString.search(/Best[0-9]+/);\ndocument.writeln(m)\n\
    </script>\n```\n\n脚本在执行后返回 6。在使用时，该方法将以正则表达式字面量的形式返回相关正则表达式的字符串表示。该方法采用下所示语法：\n\
    \n`RegExpObject.toString();`\n\n该方法随后返回你的正则表达式的字符串表示。\n\n例如：\n\n```html\n<script\
    \ type=\"javascript\">\nvar text = \"DeepLearning\";\nvar reg = new RegExp(\"\
    ee\");\nvar output = reg.toString();\ndocument.write(\"Output\" + output);\n</script>\n\
    ```\n\n代码在执行后将返回以下结果：\n第一次测试返回： /ee/\n第二次测试返回： 'g'\n\n## 第 18 章-图像映射 (Image Map)\n\
    \nJavaScript 可用于创建客户端图像映射。要启用图像映射，我们使用 `<img />` 标签的 `usemap` 属性。我们使用 `<area>`\
    \ 和 `<map>` 标签来定义它们。形成映射的图像通过 `<img />` 标签和一种名为 `usemap` 的特殊属性插入。该属性的值应与 `<map>`\
    \ 元素中 `name` 属性值匹配，并且应以井号（#）开头。\n\n`<map>` 标签为你的图像创建一个映射，它应该位于 `<img />` 元素之后。它将成为定义点击热点的\
    \ `<area />` 元素的容器。`<map>` 元素只有一个属性 `name`，用于标识映射的名称。这有助于 `<img />` 元素识别应该使用哪一个\
    \ `<map>` 元素。点击热点的坐标和形状通过 `<area>` 元素定义。\n\n考虑以下示例：\n\n```html\n<html\n<head>\n\
    <script type=\"javascript\">\nfunction showLanguage(name) {\n    document.form.lang.value\
    \ = name;\n}\n</script>\n</head>\n<body>\n<form name=\"f1\">\n<input type=\"text\"\
    \ name=\"lang\" size=\"20\">\n</form>\n<img src=\"map.gif\" alt=\"Map\" usemap=\"\
    #map1\">\n<map name=\"map1\">\n<area shape=\"rect\" coords=\"0,0,50,50\" href=\"\
    english.html\" onclick=\"showLanguage('English')\">\n<area shape=\"circle\" coords=\"\
    60,60,20\" href=\"spanish.html\" onclick=\"showLanguage('Spanish')\">\n</map>\n\
    </body>\n</html>\n```\n\n代码执行后给了我一个界面。我得到的结果取决于下所示我指向的部分：\n\n## 第 19 章-页面重重 (Page\
    \ Redirection)\n\n有时你会遇到这样的情况：你点击某个 URL 访问特定页面 X，但内部被重定向到了另一个页面 Y。这就是页面重定向的工作原理。你有许多理由可能需要将用户重定向到另一个页面。一个很好的例子是你移动到一个新域名时。你可以使用页面重定向将访问者引导到新网站。在这种情况下，你只需要维护旧域名，然后添加一个带有页面重定向功能的页面，这样任何访问你旧域名的人都会被带到你的新网站。\n\
    \n有时，你可以为不同版本的浏览器或当页面针对不同国家时创建不同的网页。与其依赖服务器端重定向，你可以选择使用客户端重定向以确保每次访问都落落在正确的页面。当你的网页已被搜索引擎索引时，页面重定向也同样重要。当你移动到新域名时，你不必丢失你的搜索引擎访问者。在这种情况下，客户端页面重定向将对你有所帮助。但是，不要将其作为欺骗器的手段，因为这样做可能会导致你的网页在浏览器中被封禁。\n\
    \n客户端页面重定向可以在 JavaScript 中轻松实现。要做到这一点，你只需要在代码的头部添加一行即可。这将完成重定向。让我们演示一下：\n\n```html\n\
    <html\n<head>\n<script type=\"javascript\">\nfunction RedirectFunction() {\n \
