    此方法可以用于搜索并返回字符串中某个字符的位置。始终记住，字符串字符从索引 0 开始。如果未找到该字符，该方法将返回 -1。


    例如：


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.indexOf("a"));

    </script>

    ```


