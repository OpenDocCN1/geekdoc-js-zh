- md: "\nJavaScript Programming\n58\n\n## Switch Statement\n\nThis statement helps\
    \ us perform varied actions which depend on various conditions. It is suitable\
    \ when you have many branches depending on the value of a single variable.\n\n\
    With a switch statement, an expression evaluates various statements to be executed\
    \ depending on the value of an expression. The JavaScript interpreter must check\
    \ every case against expression’s value until it finds a match. If no match is\
    \ found, then the default is chosen. Its syntax is as follows:\n\n```javascript\n\
    switch (expression)\n{\n  case 1:\n    code\n    break;\n  case 1:\n    code\n\
    \    break;\n  default:\n    code\n}\n```\n\nFor example:\n```html\n<script>\n\
    var name = \"ODIE\";\nswitch (name) {\n  case \"Alice\":\n    output = \"one\"\
    ;\n    break;\n  case \"Bob\":\n    output = \"two\";\n    break;\n  case \"Charlie\"\
    :\n    output = \"three\";\n    break;\n  default:\n    output = \"unknown\";\n\
    }\ndocument.write(output);\n</script>\n```\nThe code will return the following\
    \ upon execution:\nYour name is Nicholas\n\n61\n\n## Chapter 6 - JavaScript Loops\n\
    \nLoops are good when you need to execute your code repeatedly, for a known or\
    \ an unknown number of times. With loops, you can automate tasks that could have\
    \ been tedious performing them manually.\n\nA good example is when you need to\
    \ fill a table with values. You can use a loop to iterate through the cells of\
    \ the tables while filling the values instead of filling them manually.\n\nLet\
    \ us discuss the various loop statements supported in JavaScript:\n\n### For Loop\n\
    \nThis loop is used to iterate over a block of code for a fixed number of times.\
    \ It is suitable when one is aware of the number of times to iterate over a block\
    \ of code. The loop takes the following syntax:\n\n```javascript\nfor (initializer;\
    \ condition; increment)\n{\n}\n```\n\nThe initializer sets a counter variable\
    \ that we should start with. The condition specifies criteria that must be met\
    \ for the next iteration to be executed. The increment can either increment or\
    \ decrement the counter.\n\nHere is an example of a for loop:\n```html\n<script>\n\
    for (x = 0; x < 5; x++) {\n  document.write(x);\n}\n</script>\n```\nThe variable\
    \ x in the loop was first initialized to a value of 0. The condition states that\
    \ the value of x should be less than 5. In the increment, the value of the variable\
    \ x should be incremented by 1 every iteration. This means that the loop should\
    \ run from 0 to 4 to give the following:\n\nHere is another example:\n```html\n\
    <head>\n  <title>Length Converter</title>\n</head>\n<body>\n  <table border=\"\
    1\">\n    <tr>\n      <td>Length in Meters</td>\n      <td>Length in Centimeters</td>\n\
    \    </tr>\n    <script>\n    for (length = 0; length <= 5; length++) {\n    \
    \  document.write(\"<tr><td>\" + length + \"</td><td>\" + length * 100 + \"</td></tr>\"\
    );\n    }\n    </script>\n  \n\n</body></html>\n\n used a a loop to iterate of\
    \ a set of values while values converting meters. This meters, we are incrementing\
    \ the values by  values rather than 1 every iteration. The code returns a populated\
    \ table as shown below:\n\n### While Loop\n\nThis loop can be used to iterate\
    \ over code for an infinite number of times. It is suitable for use when one doesn’t\
    \ know the exact number of times to execute a loop. The loop will execute as long\
    \ as the specified condition is true. Immediately the conditions become a false,\
    \ the execution of the loop will halt. It takes the following syntax:\n\n```javascript\n\
    while (variable <= final_value)\n{\n}\n```\n\nFor example:\n```html\n<script>\n\
    var x = 0;\nwhile (x <= 5) {\n  document.write(x + \" \");\n}\n</script>\n```\n\
    The while loop will run as long as the value of the variable x is not more than\
    \ 5. The code returns the following:\n\nHere is another example:\n```html\n<head>\n\
    \  <title>Length</title>\n</head>\n<body>\n  <table border=\"1\">\n    <tr>\n\
    \      <td>Length in Meters</td>\n      <td>Length in Centimeters</td>\n    </tr>\n\
    \    <script>\n    length = 0;\n    while (length <= 2) {\n      document.write(\"\
    <tr><td>\" + length + \"</td><td>\" + length * 100 + \"</td></tr>\");\n      length++;\n\
    \    }\n    </script>\n  </table>\n</body></html>\n```\nThe above loop will always\
    \ run as long as the value of length is less or equal to 2. Immediately the loop\
    \ finds itself violating this, it will stop.\n\n### Do Loop\n\nThis is a good\
    \ loop for infinite times. However, the code must be executed once regardless\
    \ of the condition. Its syntax is as follows:\n\n```javascript\ndo {\n  statement\n\
    } while (condition);\n```\n\nA while may never run, but the do while loop must\
    \ run at least once. Here is an example:\n```html\n<script>\nvar x = 0;\ndo {\n\
    \  document.write(x + \" \");\n  x++;\n} while (x <= 5);\n</script>\n```\n"
  mdcn: "\nJavaScript 编程\n58\n\n## Switch 语句\n\n该语句帮助我们根据各种条件执行执行多样化的操作。当你有许多取决于单个变量值的分支时，它非常适用。\n\
    \n通过 switch 语句，一个表达式会根据表达式的值来评估要执行的各种语句。JavaScript 解释器必须根据表达式的值检查每一个 case，直到找到匹配项为止。如果没有找到匹配项，则选择默认项。它的语法如下：\n\
    \n```javascript\nswitch (expression)\n{\n  case 1:\n    code\n    break;\n  case\
    \ 1:\n    code\n    break;\n  default:\n    code\n}\n```\n\n例如：\n```html\n<script>\n\
    var name = \"ODIE\";\nswitch (name) {\n  case \"Alice\":\n    output = \"one\"\
    ;\n    break;\n  case \"Bob\":\n    output = \"two\";\n    break;\n  case \"Charlie\"\
    :\n    output = \"three\";\n    break;\n  default:\n    output = \"unknown\";\n\
    }\ndocument.write(output);\n</script>\n```\n代码执行后将返回以下内容：\nYour name is Nicholas\n\
    \n61\n\n## 第 6 章 - JavaScript 循环\n\n当你需要重复执行代码（无论次数是已知还是未知）时，循环是非常有用的。通过循环，你可以自动化那些手动执行可能非常繁琐的任务。\n\
    \n一个很好的例子是当你需要在表格中填充值时。你可以使用循环遍历表格单元格并填充值，而不是手动填充。\n\n让我们讨论一下 JavaScript 支持的各种循环语句：\n\
    \n### For 循环\n\n这种循环用于固定次数地迭代代码块。当你清楚要迭代某个代码块的次数时，它非常适用。循环采用以下语法：\n\n```javascript\n\
    for (initializer; condition; increment)\n{\n}\n```\n\n初始化器（initializer）设置了一个我们需要开始的计数器变量。条件（condition）指定了执行下次迭代必须满足的标准。增量（increment）可以增加或减少计数器。\n\
    \n这里是一个 for 循环的示例：\n```html\n<script>\nfor (x = 0; x < 5; x++) {\n  document.write(x);\n\
    }\n</script>\n```\n循环中的变量 x 首先初始化为 0。条件规定 x 的值应该小于 5。在增量部分，变量 x 的值每次迭代都会增加 1。这意味着循环应该从\
    \ 0 运行到 4，产生如下结果：\n\n这是另一个示例：\n```html\n<head>\n  <title>Length Converter</title>\n\
    </head>\n<body>\n  <table border=\"1\">\n    <tr>\n      <td>Length in Meters</td>\n\
    \      <td>Length in Centimeters</td>\n    </tr>\n    <script>\n    for (length\
    \ = 0; length <= 5; length++) {\n      document.write(\"<tr><td>\" + length +\
    \ \"</td><td>\" + length * 100 + \"</td></tr>\");\n    }\n    </script>\n  \n\n\
    </body></html>\n```\n\n使用了一个循环在转换米时迭代一组值。在此处，我们每次迭代将值增加特定的特定值（注：原文此处缺失了数字，根据语境推断），而不是增加\
    \ 1。代码返回了一个如下所示的填充好的表格：\n\n### While 循环\n\n这种循环可以用于无限次地迭代代码。当你不确定执行循环的确切次数时，它非常适用。只要指定的条件为真，循环就会执行。一旦条件变为假，循环的执行就会停止。它采用以下语法：\n\
    \n```javascript\nwhile (variable <= final_value)\n{\n}\n```\n\n例如：\n```html\n\
    <script>\nvar x = 0;\nwhile (x <= 5) {\n  document.write(x + \" \");\n}\n</script>\n\
    ```\n只要变量 x 的值不大于 5，while 循环就会运行。代码返回以下：\n\n这是另一个示例：\n```html\n<head>\n  <title>Length</title>\n\
    </head>\n<body>\n  <table border=\"1\">\n    <tr>\n      <td>Length in Meters</td>\n\
    \      <td>Length in Centimeters</td>\n    </tr>\n    <script>\n    length = 0;\n\
    \    while (length <= 2) {\n      document.write(\"<tr><td>\" + length + \"</td><td>\"\
    \ + length * 100 + \"</td></tr>\");\n      length++;\n    }\n    </script>\n \
    \ </table>\n</body></html>\n```\n只要 length 的值小于或等于 2，上面的循环就会一直运行。一旦循环发现违反了这一条件，它就会停止。\n\
    \n### Do 循环\n\n这是一个用于无限次的良好循环。然而，无论条件如何，代码必须执行一次。它的语法如下：\n\n```javascript\ndo\
    \ {\n  statement\n} while (condition);\n```\n\nwhile 循环可能永远不运行，但 do while 循环至少运行一次。这里是一个示例：\n\
    ```html\n<script>\nvar x = 0;\ndo {\n  document.write(x + \" \");\n  x++;\n} while\
    \ (x <= 5);\n</script>\n```\n\n"
