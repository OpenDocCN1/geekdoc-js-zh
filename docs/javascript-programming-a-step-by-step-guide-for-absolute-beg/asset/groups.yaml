    JavaScript 程序被称为脚本（scripts）。你可以在网页的 HTML 内部编写 JavaScript，它会在页面加载时自动执行。脚本以纯文本形式提供并按原样执行。它们不需要经过编译或特殊的准备即可运行。今天，我们可以在浏览器、服务器或带有
