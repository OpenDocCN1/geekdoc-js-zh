  - '[PAGE 246]


    `JavaScript` `Programming`


    `245`


    `Chapter` `19-` `Page` `Redirection`


    `Sometimes,` `you` `encounter` `situations` `in` `which` `you` `click` `on` `a`
    `URL`


    `to` `visit` `a` `certain` `page` `X` `but` `you` `are` `internally` `directed`
    `to` `another`


    `page` `Y.` `This` `is` `how` `page` `redirection` `works.`


    `There` `are` `a` `number` `of` `reasons` `as` `to` `why` `you` `may` `need` `to`
    `redirect`


    `your` `users` `to` `another` `page.` `A` `good` `example` `is` `when` `you` `move`
    `to` `a`


    `new` `domain.` `You` `can` `use` `page` `redirection` `to` `direct` `your` `visitors`


    `to` `the` `new` `website.` `In` `such` `a` `case,` `you` `only` `have` `to` `maintain`
    `your`


    `old` `domain` `then` `add` `a` `single` `page` `with` `the` `page` `redirection`


    `feature` `so` `that` `anyone` `who` `visits` `your` `old` `domain` `is` `taken`
    `to` `your`


    `new` `website.`


    `Sometimes,` `you` `can` `create` `different` `web` `pages` `for` `different`


    `versions` `of` `browsers` `or` `when` `the` `pages` `are` `for` `different` `countries.`


    `Instead` `of` `relying` `on` `server` `side` `page` `redirection,` `you` `can`
    `choose`


    `to` `use` `client` `side` `page` `redirection` `to` `ensure` `that` `each` `visits`
    `lands`


    `on` `the` `right` `page.`


    `Page` `redirection` `is` `also` `important` `in` `cases` `where` `your` `web`
    `pages`


    `have` `been` `indexed` `by` `the` `search` `engines.` `When` `you` `move` `to`
    `a`


    `new` `domain,` `there` `is` `no` `need` `for` `you` `to` `lose` `your` `search`
    `engine`


    `visitors.` `In` `this` `case,` `the` `client` `side` `page` `redirection` `will`
    `help` `you.`


    `However,` `don’t` `do` `it` `as` `a` `way` `of` `fooling` `the` `browsers` `as`
    `doing` `so`


    `may` `see` `your` `web` `pages` `banned` `on` `the` `browsers.`


    ![](img/9481f3f28a383c4a6640042d4f3a3962_246_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_246_1.png)'
