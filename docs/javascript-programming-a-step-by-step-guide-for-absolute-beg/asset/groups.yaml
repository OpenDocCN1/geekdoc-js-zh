- md: "\nJavaScript Programming\n\n29\n\n</head>\n<body>\n<p>JavaScript</p>\n<form>\n\
    <input type=\"\" value=\"\" onclick=\"\" />\n</form>\n</body>\n</html>\n\nThe\
    \ name of the JavaScript file was specified within the script tag using the src\
    \ parameter.\n\n## JavaScript Comments\n\nComments provide us with a way of delivering\
    \ messages. Comments help in guiding users, adding information describing the\
    \ code, suggestions or warnings, making it easy for the reader to interpret code.\
    \ The JavaScript Engine ignores comments, meaning that it just skips them.\n\n\
    JavaScript comments can span a single or multiple lines. To write a single-line\
    \ comment, precede it with a double slash (//). For example:\n\n```javascript\n\
    var x = 3;\ndocument.write(x);\n```\n\nHere is another example:\n\n```javascript\n\
    var x = 5;\nvar y = 25;\nvar z = 60;\ndocument.write(z);//to print these\n```\n\
    \nMulti-line comments are enclosed between /* and */ (a slash and an asterisk).\
    \ This can also be used for a single line comment. For example:\n\n```javascript\n\
    /* This is a multi-line \ncomment engine will \nskip it */\ndocument.write(\"\
    Be syly\");\n```\n\n### Case Sensitivity\n\nJavaScript is a case sensitive scripting\
    \ language. This means that a variable the name x will be different from the variable\
    \ named X. A variable named age will be different from the variables named Age,\
    \ AGE, etc.\n\n## Chapter 2- Popup Message\n\nJavaScript has numerous built-in\
    \ methods that can help in displaying popup messages for various purposes. Let\
    \ us discuss the various popup boxes provided by JavaScript:\n\n### Alert Box\n\
    \nThis is used to show a message to a user, particular where the emphasis is needed.\
    \ It comes with an OK button that closes the popup when clicked. It is created\
    \ by calling the JavaScript’s alert() function.\n\nFor example:\n\n```html\n<html>\n\
    <body>\n<h1>Popup</h1>\n<script>\nalert(\"Display a number\");\nalert(true);\n\
    </script>\n</body>\n</html>\n```\n\nWhen you run the code, it will display the\
    \ first alert box with the string Hello World! Click OK button and it will display\
    \ an alert with 123. Again, click the OK button and it will display an alert box\
    \ with true. This shows that the alert box can be used to display a message of\
    \ any type.\n\nSometimes, a user is expected to give a confirmation so as to proceed.\
    \ For example, you may want a user to confirm deletion or update of certain details\
    \ before the process can be completed. This can be done using the confirm() function\
    \ provided by JavaScript. This function will display a popup box to the user with\
    \ two buttons namely OK and Cancel. The next step is determined by the button\
    \ that the user clicks.\n\nFor example:\n\n```html\n<html>\n<body>\n<h1>confirm()</h1>\n\
    <p id=\"\"></p>\n<script>\nvar userChoice;\nif (confirm(\"\")) == true) {\n  \
    \  userChoice = \"OK\";\n} else {\n    userChoice = \"Canceled!\";\n}\ndocument.getElementById(\"\
    \").innerHTML = userChoice;\n</script>\n</body>\n</html>\n```\n\n### Prompt Box\n\
    \nIn some cases, you may need to receive an input from users and use it to perform\
    \ further actions on the page. For example, you may need to calculate the monthly\
    \ amount for loan payment based on the number of months which the user wants to\
    \ settle the loan. In such a case, you can use the prompt() function provided\
    \ by JavaScript. The function should take two string parameters. The first one\
    \ is the message that will be displayed while the second one is the default value\
    \ to be in the input text once the message has been displayed: prompt(message,\
    \ defaultValue);\n\nFor example:\n\n```html\n<html>\n<body>\n<h1>prompt()</h1>\n\
    <p id=\"\"></p>\n<script>\nvar age = prompt(\"Enter your age:\", \"26\");\ndocument.getElementById(\"\
    \").innerHTML = age;\n</script>\n</body>\n</html>\n```\n\n## Chapter 3- Variables\n\
    \nA variable is a name for a storage location. From its name, it can vary. Variables\
    \ hold values that can vary. In JavaScript, we use the var keyword to declare\
    \ variables. Each variable must be given a unique name. You are allowed to assign\
    \ a value to a variable during the time of its declaration. This can be done using\
    \ the equals symbol (=). The following is the syntax for declaring and initializing\
    \ variables in JavaScript:\n\n```javascript\nvar variableName;\nvariableName =\
    \ value;\n```\n\nHere are valid examples of this:\n\n```javascript\nvar x = 10;\n\
    var y = 20;\nvar z = 30;\n```\n\nWe have used the var keyword to declare three\
    \ variables. Two of the variables have been assigned a value. Note that this has\
    \ been done at the time of their declaration.\n\nWe can also declare more than\
    \ one variable in a single line and separate them by a comma (,). This is demonstrated\
    \ below:\n\n```javascript\nvar x = 1, y = \"a\";\n```\n\nNote that in JavaScript,\
    \ one can declare a variable without using the var keyword. However, if you do\
    \ this, ensure that you assign a value to the variable immediately. This is demonstrated\
    \ below:\n\n```javascript\nx = 1;\ny = \"a\";\n```\n\nHowever, I don’t recommend\
    \ that you declare any variable without the use of var keyword. This is because\
    \ you may end up overriding a global variable without knowing. If a variable is\
    \ declared without the var keyword, it automatically becomes a global variable,\
    \ regardless of where it has been declared.\n"
  mdcn: "\n\nJavaScript 编程\n\n29\n\n</head>\n<body>\n<p>JavaScript</p>\n<form>\n<input\
    \ type=\"\" value=\"\" onclick=\"\" />\n</form>\n</body>\n</html>\n\nJavaScript\
    \ 文件的文件名是在 script 标签内通过 `src` 参数指定的。\n\n## JavaScript 注释\n\n注释为我们提供了一种传递信息的方式。注释有助于引导用户、添加描述代码的信息、建议或警告，让读者更容易解释代码。JavaScript\
    \ 引擎会忽略注释，这意味着它会跳过这些内容。\n\nJavaScript 注释可以跨越单行或多行。要写单行注释，请在其前面加上双斜杠（//）。例如：\n\n\
    ```javascript\nvar x = 3;\ndocument.write(x);\n```\n\n这是另一个示例：\n\n```javascript\n\
    var x = 5;\nvar y = 25;\nvar z = 60;\ndocument.write(z);//打印这些内容\n```\n\n多行注释包含在\
    \ `/*` 和 `*/`（一个斜杠和一个星号）之间。这也可以用于单行注释。例如：\n\n```javascript\n/* 这是一个多行 \n注释，引擎会\
    \ \n跳过它 */\ndocument.write(\"Be syly\");\n```\n\n### 大写敏感\n\nJavaScript 是一种大小写敏感的脚本语言。这意味着名为\
    \ `x` 的变量与名为 `X` 的变量不同。名为 `age` 的变量与名为 `Age`、`AGE` 等变量不同。\n\n## 第 2 章 弹出消息\n\n\
    JavaScript 有许多内置方法，可以帮助为了各种目的显示弹出消息。让我们讨论 JavaScript 提供的各种弹出框：\n\n### Alert 框（警告框）\n\
    \n用于向用户显示消息，特别是在需要强调的地方。它带有一个 OK 按钮，点击后关闭弹出窗口。它是通过调用 JavaScript 的 `alert()` 函数创建的。\n\
    \n例如：\n\n```html\n<html>\n<body>\n<h1>Popup</h1>\n<script>\nalert(\"Display a\
    \ number\");\nalert(true);\n</script>\n</body>\n</html>\n```\n\n当您运行代码时，它将显示第一个带有字符串\
    \ \"Hello World!\" 的 alert 框。点击 OK 按钮，它将显示一个带有 123 的 alert。再次点击 OK 按钮，它将显示一个带有\
    \ `true` 的 alert 框。这表明 alert 框可以显示任何类型的消息。\n\n有时，需要用户给出确认以继续操作。例如，您可能希望在完成处理之前，让用户确认删除或更新某些详情。这可以使用\
    \ JavaScript 提供的 `confirm()` 函数来实现。该函数将向用户显示一个弹出框，其中包含两个按钮，即 OK 和 Cancel。下一步由用户点击的按钮决定的。\n\
    \n例如：\n\n```html\n<html>\n<body>\n<h1>confirm()</h1>\n<p id=\"\"></p>\n<script>\n\
    var userChoice;\nif (confirm(\"\")) == true) { // 注意：此处原文代码有一个多余的括号 */\n    userChoice\
    \ = \"OK\";\n} else {\n    userChoice = \"Canceled!\";\n}\ndocument.getElementById(\"\
    \").innerHTML = userChoice;\n</script>\n</body>\n</html>\n```\n\n### Prompt 框（提示框）\n\
    \n在某些情况下，您可能需要接收用户的输入并用它在页面上执行后续操作。例如，您可能需要根据用户想要结算贷款的月数来计算每月还款金额。在这种情况下，可以使用\
    \ JavaScript 提供的 `prompt()` 函数。该函数应接受两个字符串参数。第一个是显示的消息，第二个是当消息显示后输入文本框中的默认值：`prompt(message,\
    \ defaultValue);`。\n\n例如：\n\n```html\n<html>\n<body>\n<h1>prompt()</h1>\n<p id=\"\
    \"></p>\n<script>\nvar age = prompt(\"Enter your age:\", \"26\");\ndocument.getElementById(\"\
    \").innerHTML = age;\n</script>\n</body>\n</html>\n```\n\n## 第 3 章 变量\n\n变量是存储位置的名称。根据它的名称，它可以变化。变量持有变化的值。在\
    \ JavaScript 中，我们使用 `var` 关键字来声明变量。每个变量必须赋予一个唯一的名称。您可以在声明时为变量赋值。这可以通过等号（=）完成。以下是\
    \ JavaScript 中声明初始化变量的语法：\n\n```javascript\nvar variableName;\nvariableName =\
    \ value;\n```\n\n这里是有效的示例：\n\n```javascript\nvar x = 10;\nvar y = 20;\nvar z =\
    \ 30;\n```\n\n我们使用了 `var` 关键字声明了三个变量。其中两个变量已经赋值。注意这是在声明时完成的。\n\n我们也可以在一行中声明多个变量，并用逗号（,）隔开。演示如下：\n\
    \n```javascript\nvar x = 1, y = \"a\";\n```\n\n注意，在 JavaScript 中，人们可以不使用 `var`\
    \ 关键字声明变量。然而，如果您这样做，请确保立即为变量赋值。演示如下：\n\n```javascript\nx = 1;\ny = \"a\";\n```\n\
    \n但是，我不建议您不使用 `var` 关键字声明任何变量。这是因为您可能会在不知情的情况下覆盖一个全局变量。如果不使用 `var` 关键字声明变量，它将自动成为全局变量，无论它在何处声明。\n\
    \n"
