  - '[PAGE 120]


    `JavaScript` `Programming`


    `119`


    `Chapter` `9-` `JavaScript` `Events`


    `Events` `are` `the` `actions` `which` `JavaScript` `can` `detect.` `A` `good`


    `example` `is` `an` `onmouseover` `event,` `which` `JavaScript` `detects`


    `once` `a` `mouse` `is` `moved` `over` `some` `object.` `The` `onload` `event`
    `is`


    `triggered` `once` `a` `web` `page` `is` `loaded.` `In` `JavaScript,` `events`
    `and`


    `functions` `are` `used` `together.` `A` `function` `is` `triggered` `once` `an`
    `event`


    `has` `occurred.` `Other` `examples` `of` `events` `include` `closing` `a` `window,`


    `pressing` `a` `key,` `resizing` `a` `window` `and` `others.`


    `onclick` `Event`


    `This` `is` `a` `common` `event` `in` `JavaScript.` `It` `occurs` `once` `a` `user`
    `has`


    `clicked` `the` `left` `button` `of` `the` `mouse.` `One` `can` `add` `a` `warning,`


    `validation` `etc.` `against` `the` `event.` `Example:`


    `<html>`


    `<head>`


    `<script` `type=`


    `>`


    `function` `helloFunc()`


    `{`


    `alert` `(`


    `)`


    `}`


    `<fSCrint>`


    `</head>`


    ![](img/9481f3f28a383c4a6640042d4f3a3962_120_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_120_1.png)'
- md: "\nJavaScript Programming\n\n```html\n<body>\n<p>Click the button below</p>\n\
    <form>\n<input type=\"button\" onclick=\"helloFun()\" value=\"\"/>\n</form>\n\
    </body>\n</html>\n```\n\n120\n\nIn the example, a simple form has been created.\
    \ It should be as follows:\n\nClick the button below\n\n| | Click Here |\n| :---\
    \ | :--- |\n\nClick the “Click Here” button and the function `helloFun` will be\
    \ invoked. Once clicked, you will see a pop up as shown below:\n\nHello World!\n\
    \n![](img/9481f3f28a383c4a6640042d4f3a3962_121_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_121_1.png)\n\
    \nJavaScript Programming\n\n121\n\n### onsubmit Event\n\nThis event is called\
    \ when one has submitted a form. Form validation can be added to the event. This\
    \ will help you validate data before it can be sent to a webserver.\n\nExample:\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction formValidation()\
    \ {\n    return either true or false\n}\n</script>\n</head>\n<body>\n<form method=\"\
    post\" onsubmit=\"return formValidation()\">\n<input type=\"text\" value=\"5\"\
    />\n</form>\n</body>\n</html>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_122_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_122_1.png)\n\nJavaScript Programming\n\
    \n122\n\nOnce the Submit button is clicked, the formValidation method will be\
    \ called.\n\n### onmouseout and onmouseover\n\nThese events help you add attractive\
    \ features to both text and images. The `onmouseover` event is triggered once\
    \ a mouse is moved over an object. The `onmouseout` event is triggered once the\
    \ mouse is moved out of the element.\n\nExample:\n\n```html\n<html>\n<head>\n\
    <script type=\"text/javascript\">\nfunction overObject() {\n    document.write(\"\
    Over\");\n}\nfunction outOfObject() {\n    document.write(\"Out\");\n}\n</script>\n\
    </head>\n<body>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_123_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_123_1.png)\n\
    \nJavaScript Programming\n\n128\n\n```html\n<p>Bring your mouse in the division\
    \ and observe:</p>\n<div onmouseover=\"overObject()\" onmouseout=\"outOfObject()\"\
    >\n<h2>Division</h2>\n</div>\n</body>\n</html>\n```\n\nThe code gives the following\
    \ when executed:\n\nBring your mouse in the division and observe:\n\nDivision\n\
    \nJust move your mouse as instructed and see what happens. It will change to the\
    \ following:\n\nThe Mouse is Over | The Mouse its Out |\n| :--- | :--- | :---\
    \ |\n\nWe have defined two functions, that is, `overObject` and `outOfObject`.\
    \ These two functions have then been called in the following line:\n\n```html\n\
    <div onmouseover=\"overObject()\" onmouseout=\"outOfObject()\">\n```\n\nOnce a\
    \ mouse is moved over the division, the `overObject` method will be called. Once\
    \ the mouse is moved out of the object, the `outOfObject` method will be called.\n\
    \n![](img/9481f3f28a383c4a6640042d4f3a3962_124_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_124_1.png)\n\
    \nJavaScript Programming\n\n124\n\nThe `onmouseover=\"overObject()\"` instructs\
    \ the JavaScript to call the `overObject` function once the mouse is moved over\
    \ the division, while `onmouseout=\"outOfObject()\"` instructs the JavaScript\
    \ interpreter to call the `outOfObject` function once the mouse is moved out of\
    \ the division.\n\nHere is another example that changes the color of the text\
    \ after hover:\n\n```html\n<html>\n<body onmouseover=\"overObject()\" onmouseout=\"\
    outOfObject()\">\nMove your cursor over here\n</body>\n</html>\n```\n\nWhen you\
    \ move the mouse cursor of the text, the text will change its color to yellow.\
    \ If you move away from the mouse cursor, the text will change color to black.\n\
    \nThese two events are invoked when a user has entered or left a page. We can\
    \ use the `onload` event to check the type and version of the visitor’s browser.\n\
    \n![](img/9481f3f28a383c4a6640042d4f3a3962_125_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_125_1.png)\n\
    \nJavaScript Programming\n\n125\n\nIt is from there that we can load the right\
    \ web page depending the version. Both are good functions for dealing with cookies:\n\
    \n```html\n<html>\n<body onload=\"inspectCookies()\">\n<p id=\"\"></p>\n<script>\n\
    function inspectCookies() {\n    var txt = \"\";\n    if (navigator.cookieEnabled\
    \ == true) {\n        txt = \"Enabled\";\n    } else {\n        txt = \"Disabled\"\
    ;\n    }\n    document.getElementById(\"\").innerHTML = txt;\n}\n</script>\n</body>\n\
    </html>\n```\n\nIf you run the above code, the output you get will depend on whether\
    \ your browser has cookies enabled or not.\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_126_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_126_1.png)\n\nJavaScript Programming\n\
    \n126\n\n### onchange Event\n\nThis method is mostly used during the validation\
    \ of form fields. The following example demonstrates how to use this method:\n\
    \n```html\n<html>\n<head>\n<script type=\"text/javascript\">\nfunction testFunc()\
    \ {\n    var a = document.getElementById('name');\n    a.value = a.value.toUpperCase();\n\
    }\n</script>\n</head>\n<body>\nName:\n<input type=\"text\" id=\"name\" onchange=\"\
    testFunc()\">\n<p>Leave the input field and see your name change to uppercase</p>\n\
    </body>\n</html>\n```\n\nAfter running the code, you will get the following simple\
    \ form:\n\nName:\n\nLeave the input field and see your name change to uppercase\n\
    \n![](img/9481f3f28a383c4a6640042d4f3a3962_127_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_127_1.png)\n\
    \nJavaScript Programming\n\n127\n\nJust type your name in lowercase and move the\
    \ mouse cursor from the input field by clicking outside. You will notice that\
    \ your name will be transformed into uppercase:\n\nName: JOHN\n\nLeave the input\
    \ field and see your name change to uppercase\n\nThe `toUpperCase()` method is\
    \ invoked after the user has changed the content of the input field.\n\nThe `onload`\
    \ when used, it displays an alert. For example:\n\n```html\n<html>\n<head>\n<script\
    \ type=\"text/javascript\">\nfunction displayMessage() {\n    alert(\"Page Loaded\"\
    );\n}\n</script>\n</head>\n<body onload=\"displayMessage()\">\n</body>\n</html>\n\
    ```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_128_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_128_1.png)\n\
    \nJavaScript Programming\n\n128\n\nOnce the page has been loaded, you will get\
    \ the following:\n\nThe `onload` event makes an input field change its color after\
    \ it gets focus. Here is an example:\n\n```html\n<html>\n<head>\n<script type=\"\
    text/javascript\">\nfunction myFunc(col) {\n    col.style.backgroundColor = \"\
    yellow\";\n}\n</script>\n</head>\n<body>\nName:\n<input type=\"text\" onfocus=\"\
    myFunc(this)\">\n<p>Click inside the input field and see it change color</p>\n\
    </body>\n</html>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_129_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_129_1.png)\n\
    \nJavaScript Programming\n\n129\n\nThe code will give you the following on execution:\n\
    \nName:\n\nClick inside the input field and see it change color.\n\nThe color\
    \ of the input field will change into the green.\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_130_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_130_1.png)\n"
  mdcn: "\n\nJavaScript 编程\n\n```html\n<body>\n<p>点击下方的按钮</p>\n<form>\n<input type=\"\
    button\" onclick=\"helloFun()\" value=\"\"/>\n</form>\n</body>\n</</html>\n```\n\
    \n120\n\n在示例中，创建了一个简单的表单。它应该如下所示：\n\n点击下方的按钮\n\n| | 点击这里 |\n| :--- | :--- |\n\n\
    点击“点击这里”按钮将调用函数 `helloFun`。一旦点击，你将看到如下所示的弹窗：\n\nHello World!\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_121_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_121_1.png)\n\nJavaScript 编程\n\n121\n\
    \n### onsubmit 事件\n\n当提交表单时会调用此事件。可以在事件中添加表单验证。这将帮助你在将数据发送到 Web 服务器之前对其进行验证。\n\
    \n示例：\n\n```html\n<html\n<head>\n<script type=\"text/javascript\">\nfunction formValidation()\
    \ {\n    return either true or false\n}\n</script>\n</head>\n<body>\n<form method=\"\
    post\" onsubmit=\"return formValidation()\">\n<input type=\"text\" value=\"5\"\
    />\n</form>\n</body>\n</</html>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_122_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_122_1.png)\n\nJavaScript 编程\n\n122\n\
    \n一旦点击提交按钮，将调用 `formValidation` 方法。\n\n### onmouseout 和 onmouseover\n\n这些事件可以帮助你为文本和图像添加吸引人的特性。`onmouseover`\
    \ 事件在鼠标移动到对象上时触发。`onmouseout` 事件在鼠标移出元素时触发。\n\n示例：\n\n```html\n<html\n<head>\n\
    <script type=\"text/javascript\">\nfunction overObject() {\n    document.write(\"\
    Over\");\n}\nfunction outOfObject() {\n    document.write(\"Out\");\n}\n</script>\n\
    </head>\n<body>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_123_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_123_1.png)\n\
    \nJavaScript 编程\n\n128\n\n```html\n<p>将你的鼠标移入区域内并观察：</p>\n<div onmouseover=\"\
    overObject()\" onmouseout=\"outOfObject()\">\n<h2>区域</h2>\n</div>\n</body>\n</</html>\n\
    ```\n\n该代码执行时会产生以下结果：\n\n将你的鼠标移入区域内并观察：\n\n区域\n\n按照指示移动你的鼠标并看发生了什么。它将变为：\n\n|\
    \ 鼠标悬停 | 鼠标移出 |\n| :--- | :--- | :--- |\n\n我们定义了两个函数，即 `overObject` 和 `outOfObject`。这两个函数在接下来的行中被调用：\n\
    \n```html\n<div onmouseover=\"overObject()\" onmouseout=\"outOfObject()\">\n```\n\
    \n一旦鼠标移到区域内，将调用 `overObject` 方法。一旦鼠标移出对象，将调用 `outOfObject` 方法。\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_124_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_124_1.png)\n\nJavaScript 编程\n\n124\n\
    \n`onmouseover=\"overObject()\"` 指示 JavaScript 在鼠标移入区域时调用 `overObject` 函数，而 `onmouseout=\"\
    outOfObject()\"` 指示 JavaScript 解释器在鼠标移出区域时调用 `outOfObject` 函数。\n\n这是另一个在悬停后改变文本颜色的示例：\n\
    \n```html\n<html\n<body onmouseover=\"overObject()\" onmouseout=\"outOfObject()\"\
    >\n将光标移到这里\n</body>\n</</html>\n```\n\n当你将鼠标光标移到文本上，文本颜色将变为黄色。如果你移开光标，文本颜色将变为黑色。\n\
    \n这两个事件在用户进入或离开页面时被调用。我们可以使用 `onload` 事件来检查访问者的浏览器类型和版本。\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_125_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_125_1.png)\n\nJavaScript 编程\n\n125\n\
    \n`onload` 事件用于检查访问浏览器的类型和版本。\n\n以下是另一个在页面加载时根据 Cookie 处理的示例：\n\n```html\n<html\n\
    <body onload=\"inspectCookies()\">\n<script>\nfunction inspectCookies() {\n  \
    \  var txt = \"\";\n    if (navigator.cookie) {\n        txt = \"Enabled\";\n\
    \    } else {\n        txt = \"Disabled\";\n    }\n    document.body.innerHTML\
    \ = txt;\n}\n</script>\n</body>\n</</html>\n```\n\n运行上述代码，结果将取决于浏览器是否启用了 Cookie。\n\
    \n![](img/9481f3f28a383c4a6640042d4f3a3962_126_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_126_1.png)\n\
    \nJavaScript 编程\n\n126\n\n`change` 事件通常用于表单字段。以下示例展示了如何使用该方法：\n\n```html\n<html\n\
    <head>\n<script type=\"text/javascript\">\nfunction test() {\n    var a = document.getElementById('name');\n\
    \    a.value = a.value.toUpperCase();\n}\n</script>\n</head>\n<body>\n<input type=\"\
    text\" id=\"name\" onchange=\"test()\">\n</body>\n</html>\n```\n\n运行该代码后，你将看到如下表单：\n\
    \n姓名\n\n在输入框内输入小字母并点击外部，你会注意到你的姓名被转换为大写。\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_127_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_127_1.png)\n\nJavaScript 编程\n\n127\n\
    \n`toUpperCase()` 方法在用户更改输入框的内容后被调用。\n\n`onload` 被使用时，会显示一个警告。例如：\n\n```html\n\
    <html\n<head>\n<script type=\"text/javascript\">\nfunction displayMessage() {\n\
    \    alert(\"Page Loaded\");\n}\n</script>\n</head>\n<body onload=\"displayMessage()\"\
    >\n</body>\n</html>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_128_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_128_1.png)\n\nJavaScript 编程\n\n128\n\
    \n页面加载后，`onload` 事件可以让输入框在获得焦点时改变颜色。这里有一个示例：\n\n```html\n<html\n<head>\n<script\
    \ type=\"text/javascript\">\nfunction myFunc(col) {\n    col.style.backgroundColor\
    \ = \"yellow\";\n}\n</script>\n</head>\n<body>\n姓名:\n<input type=\"text\" onfocus=\"\
    myFunc(this)\">\n<p>点击输入框内看它的颜色变化</p>\n</body>\n</html>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_129_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_129_1.png)\n\nJavaScript 编程\n\n129\n\
    \n执行该代码你将得到以下结果：\n\n姓名：\n\n点击输入框内看它的颜色变化。\n\n输入框的颜色将变为绿色。\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_130_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_130_1.png)\n\n"
