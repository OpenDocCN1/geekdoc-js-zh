- md: "\nJavaScript Programming\n\n## Chapter 10- JavaScript Validation\n\nWith JavaScript,\
    \ one can validate a form before they can submit it. Initially, form validation\
    \ was done on the side of the server. The user could fill a form then send it\
    \ to a server. If the details were found to be wrong, the server had to send them\
    \ back to the user for corrections. This process is too lengthy.\n\nHowever, JavaScript\
    \ has changed and improved how this is done. Validation of forms can be done on\
    \ the client side before the form details can be submitted to the server. In form\
    \ validation, we should ensure all the required fields are filled. Fields taking\
    \ specific data formats such as emails, mobile phone numbers and other should\
    \ be checked to ensure the format is adhered to. The validation of the form is\
    \ normally done on submit.\n\nExample: \n\n```html\n<html>\n<head>\n</head>\n\
    <script type=\"text/javascript\">\nfunction formValidation() {\n    var name=document.detailsForm.username.value;\n\
    \    var password=document.detailsForm.userpassword.value;\n    if (name==null\
    \ || name==\"\") {\n        alert(\"Please enter your name!\");\n        return\
    \ false;\n    } else if (password.length<8) {\n        alert(\"You must enter\
    \ a password with 8 characters and above\");\n        return false;\n    }\n}\n\
    </script>\n<body>\n<form name=\"detailsForm\" method='post' action='' onsubmit=\"\
    return formValidation()\">\nName: <input type=\"text\" name='username'><br/>\n\
    Password: <input type='password' name='userpassword'><br/>\n<input type=\"submit\"\
    \ value=\"Login\">\n</form>\n</body>\n</html>\n```\n\nThe code returns a simple\
    \ form as shown below:\n\n| Name: | |\n| :--- | :--- |\n| Password: | | Login\
    \ |\n\nClick the Login button without entering a value in any of the input fields;\
    \ you will get the following alert box:\n\nYou MUST enter your name!\n\nThis means\
    \ that you must enter your name before proceeding.\n\nNow, enter your name but\
    \ don’t enter a password. You will get the following alert box:\n\nYou MUST enter\
    \ a password with 8 characters and above... This means that you must enter a password\
    \ with 8 characters and above. You can now enter a short password and see whether\
    \ the validation is working correctly. Enter a password with less than 8 characters\
    \ then click the Login button. You will still get the above dialog. We have created\
    \ a form named detailsForm. The form requires the user to enter his name and password.\
    \ We have created the formValidation method to validate the values entered in\
    \ the form. Username must be provided while the password should not have less\
    \ than 8 characters. The property onsubmit=\"return formValidation()\" means that\
    \ once the user clicks the \"Login\" button, the formValidation method will be\
    \ called so to validate the details entered in the form. If they don’t conform\
    \ to the requirements, it will return false, so the user will have to reenter\
    \ the details.\n\n### Validating Retype Password\n\nWhen a user is creating a\
    \ password, they are normally asked to retype it to ensure they have mastered\
    \ it well. This logic can be implemented in JavaScript as follows:\n\n```javascript\n\
    <script type=\"text/javascript\">\nfunction passwordMatch() {\n    var firstpassword=document.myform.userpassword.value;\n\
    \    var secondpassword=document.myform.userpassword2.value;\n    if (firstpassword==secondpassword)\
    \ {\n        return true;\n    } else {\n        alert(\"Passwords don't match!\"\
    );\n        return false;\n    }\n}\n</script>\n<form name=\"myform\" action=\"\
    register.jsp\" onsubmit=\"return passwordMatch()\">\nPassword:<input type=\"password\"\
    \ name=\"userpassword\"/><br/>\nRe-enter Password:<input type=\"password\" name=\"\
    userpassword2\"/><br/>\n<input type=\"submit\" value=\"Submit Query\">\n</form>\n\
    ```\n\nThis returns the following simple form:\n\n| Password: | |\n| :--- | :---\
    \ |\n| Re-enter Password: | | Submit Query |\n\n### Number Validation\n\nWhen\
    \ requiring a user to enter a number such as age in a particular text field, you\
    \ should validate the input to ensure they only enter a number. This is demonstrated\
    \ below:\n\n```javascript\n<script type=\"text/javascript\">\nfunction formValidation()\
    \ {\n    var number=document.form.num.value;\n    if (isNaN(number)) {\n     \
    \   document.getElementById(\"num\").innerHTML=\"Input must be a number!\";\n\
    \        return false;\n    } else {\n        return true;\n    }\n}\n</script>\n\
    <form name=\"form\" onsubmit=\"return formValidation()\">\nNumber: <input type=\"\
    text\" name=\"num\"><span id=\"num\"></span><br/>\n<input type=\"submit\">\n</form>\n\
    ```\n\nThe `isNaN` method is used in JavaScript to check whether a value is a\
    \ number or not. We have used it in the above script. Run the code and you will\
    \ get a form with an input field and a button as shown below:\n\nEnter a non-number\
    \ value in the input field then click the Submit button. You will see the following\
    \ message:\n\nInput must be a number!\n\nThe code returns the specified message\
    \ if the input is not a number. \n\n### Email validation\n\nJavaScript can be\
    \ used for validation of email addresses. The following are the properties of\
    \ a valid email address:\n\n- It must have the @ and (dot) symbols\n- There should\
    \ be a character before @ as well as after.\n- There must be not less than two\
    \ characters after the (dot).\n\nExample:\n\n```javascript\n<script type=\"text/javascript\"\
    >\nfunction emailValidation() {\n    var i=document.form.emailAddress.value;\n\
    \    var atposition=i.indexOf(\"@\");\n    var dotposition=i.lastIndexOf(\".\"\
    );\n    if (atposition<1 || dotposition<atposition+2 || dotposition+2>=i.length)\
    \ {\n        alert(\"Invalid email address!\");\n        return false;\n    }\n\
    }\n</script>\n```\n"
  mdcn: "\n\nJavaScript 编程\n\n## 第 10 章 JavaScript 验证\n\n通过 JavaScript，用户可以在提交表单之前对其进行验证。最初，表单验证是在服务器端完成的。用户填写表单并发送到服务器。如果发现详情错误，服务器必须将其发回给用户进行修改。这个过程太耗时了。\n\
    \n然而，JavaScript 改变并改进了这种方式。表单验证可以在提交到服务器之前在客户端完成。在表单验证中，我们应该确保所有必填字段都已填写。对于电子邮件、手机号码等特定数据格式的字段，应该检查其是否符合格式。表单验证通常在提交（submit）时完成。\n\
    \n示例：\n\n```html\n<html\n<head>\n</head>\n<script type=\"text/javascript\">\n\
    function formValidation() {\n    var name=document.detailsForm.username.value;\n\
    \    var password=document.detailsForm.userpassword.value;\n    if (name==null\
    \ || name==\"\") {\n        alert(\"Please enter your name!\");\n        return\
    \ false;\n    } else if (password.length<8) {\n        alert(\"You must enter\
    \ a password with 8 characters and above\");\n        return false;\n    }\n}\n\
    </script>\n<body>\n<form name=\"detailsForm\" method='post' action='' onsubmit=\"\
    return formValidation()\">\nName: <input type=\"text\" name='username'><br/>\n\
    Password: <input type='password' name='userpassword'><br/>\n<input type=\"submit\"\
    \ value=\"Login\">\n</form>\n</body>\n</html>\n```\n\n该代码返回如下所示的简单表单：\n\n| Name:\
    \ | |\n| :--- | :--- |\n| Password: | | Login |\n\n在不在任何输入字段中输入值的情况下直接点击 Login\
    \ 按钮；你将得到以下警告框：\n\nYou MUST enter your name!\n\n这意味着你必须在继续之前输入你的姓名。\n\n现在，输入你的姓名但不输入密码。你将得到以下警告框：\n\
    \nYou MUST enter a password with 8 characters and above... 这意味着你必须输入 8 个字符及以上的密码。你现在可以输入短密码并查看验证是否正常工作。输入一个少于\
    \ 8 个字符的密码然后点击 Login 按钮。你仍然会收到上面的对话框。我们创建了一个名为 detailsForm 的表单。该表单要求用户输入姓名和密码。我们创建了\
    \ formValidation 方法来验证表单中输入的值。必须提供用户名，而密码不能少于 8 个字符。属性 onsubmit=\"return formValidation()\"\
    \ 意味着一旦用户点击“Login”按钮，就会调用 formValidation 方法来验证表单中输入的详情。如果不符合要求，它将返回 false，因此用户必须重新输入详情。\n\
    \n### 验证重复输入密码\n\n当用户创建密码时，通常会被要求重复输入以确保他们已经牢牢掌握了。这种逻辑在 JavaScript 中可以这样实现：\n\n\
    ```javascript\n<script type=\"text/javascript\">\nfunction passwordMatch() {\n\
    \    var firstpassword=document.myform.userpassword.value;\n    var secondpassword=document.myform.userpassword2.value;\n\
    \    if (firstpassword==secondpassword) {\n        return true;\n    } else {\n\
    \        alert(\"Passwords don't match!\");\n        return false;\n    }\n}\n\
    </script>\n<form name=\"myform\" action=\"register.jsp\" onsubmit=\"return passwordMatch()\"\
    >\nPassword:<input type=\"password\" name=\"userpassword\"/><br/>\nRe-enter Password:<input\
    \ type=\"password\" name=\"userpassword2\"/><br/>\n<input type=\"submit\" value=\"\
    Submit Query\">\n</form>\n```\n\n这返回了如下简单表单：\n\n| Password: | |\n| :--- | :---\
    \ |\n| Re-enter Password: | | Submit Query |\n\n### 数字验证\n\n当要求用户在特定的文本字段中输入数字（如年龄）时，验证输入内容以确保他们只输入数字。如下所示：\n\
    \n```javascript\n<script type=\"text/javascript\">\nfunction formValidation()\
    \ {\n    var number=document.form.num.value;\n    if (isNaN(number)) {\n     \
    \   document.getElementById(\"num\").innerHTML=\"Input must be a number!\";\n\
    \        return false;\n    } else {\n        return true;\n    }\n}\n</script>\n\
    <form name=\"form\" onsubmit=\"return formValidation()\">\nNumber: <input type=\"\
    text\" name=\"num\"><span id=\"num\"></span><br/>\n<input type=\"submit\">\n</form>\n\
    ```\n\n`isNaN` 方法在 JavaScript 中用于检查一个值是否为数字。我们在上面的脚本中使用了它。运行代码，你将得到一个包含输入字段和一个按钮的表单，如下所示：\n\
    \n在输入字段中输入非数字值然后点击 Submit 按钮。你将看到以下消息：\n\nInput must be a number!\n\n如果输入不是数字，代码将返回指定的消息。\n\
    \n### 电子邮件验证\n\nJavaScript 可用于验证电子邮件地址。以下是有效电子邮件地址的属性：\n\n- 它必须包含 @ 和点（dot）符号\n\
    - 在 @ 之前和之后都应该有字符\n- 在点（dot）之后必须至少有两个字符。\n\n示例：\n\n```javascript\n<script type=\"\
    text/javascript\">\nfunction emailValidation() {\n    var i=document.form.emailAddress.value;\n\
    \    var atposition=i.indexOf(\"@\");\n    var dotposition=i.lastIndexOf(\".\"\
    );\n    if (atposition<1 || dotposition<atposition+2 || dotposition+2>=i.length)\
    \ {\n        alert(\"Invalid email address!\");\n        return false;\n    }\n\
    }\n</script>\n```\n\n"
