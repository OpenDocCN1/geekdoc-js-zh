- md: "\nJavaScript Programming\n\n247\n\n</form>\n\n</body>\n</html>\n\nThe code\
    \ will return the following upon execution:\n\nClick the button given below for\
    \ redirection\n\nRedirect\n\nClick the Redirect button and see what happens. You\
    \ should be redirected to the URL that you have specified. In the above case,\
    \ I have specified JavaScript website as the URL. You can change and see it redirect\
    \ you to another website.\n\nIt is possible for you to display a message to the\
    \ visitors before you can redirect them to a new page. However, a bit of delay\
    \ will be needed for the new page to be loaded. Let us demonstrate how this can\
    \ be implemented:\n\n<html>\n<head>\n<script type=\"\">\nfunction RedirectFunction()\n\
    {\nwindow.location = \"\";\n}\n![](img/9481f3f28a383c4a6640042d4f3a3962_248_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_248_1.png)\n\nJavaScript Programming\n\
    \n248\n\ndocument.write('');\nsetTimeout('RedirectFunction',10);\n</script>\n\
    </head>\n<body>\n</body>\n</html>\n\nAfter running the code, you will see the\
    \ following message:\n\nYou will see the main page in 10 seconds\n\nAfter the\
    \ expiry of the 10 seconds, you will be redirected to the JavaScript website.\n\
    \nAs we had stated earlier, page redirection can be done based on the browser\
    \ of the user. The following example demonstrates how this can be done:\n\n<html>\n\
    <head>\n<script type=\"\">\n![](img/9481f3f28a383c4a6640042d4f3a3962_249_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_249_1.png)\n\n<var browsertype = navigator.appName;\n\
    if(browsertype == \"Netscape\") {\nwindow.location = \"http://javascript.com\"\
    ;\n} else if (browsertype == \"IE\") {\nwindow.location = \"http://ie.com\";\n\
    } else {\nwindow.location = \"http://browser.com\";\n}\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n\nThe user will then be redirected based on the type of browser\
    \ they are using. Note that we have used decision making statement if to redirect\
    \ the users to different pages.\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_250_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_250_1.png)\n\nJavaScript Programming\n\
    \n250\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_251_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_251_1.png)\n\
    \nJavaScript Programming\n\n251\n\nConclusion\n\nThis marks the end of this guide.\
    \ JavaScript is a very powerful scripting language. JavaScript is an interpreted\
    \ scripting language. The language is normally executed on the client side. This\
    \ makes it the best language for validations during web development. Web developers\
    \ use JavaScript to validate their web forms for valid email addresses, phone\
    \ numbers, and other details.\n\nJavaScript has changed the way things are done.\
    \ Initially, after filling a form, one had to submit it to the server so that\
    \ it could be checked for any anomalies. If anomalies were found, the server would\
    \ return the form to the user in order to correct the details. The user would\
    \ then re-submit the details filled in the form. With JavaScript, validation is\
    \ done before the form can be submitted to the server. The user is able to know\
    \ any errors done while filling the form and correct them accordingly. This has\
    \ made things easy for users. JavaScript also allows you to create various effects\
    \ that can be invoked by some of your actions. Examples of these actions can be:\n\
    - hover of the mouse\n- press of a key\n- loading of a web page\n- etc.\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_252_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_252_1.png)\n\nJavaScript Programming\n\
    \n252\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_253_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_253_1.png)\n\
    \nJavaScript Programming\n\n253\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_254_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_254_1.png)\n\nJavaScript Programming\n\
    \n254\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_255_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_255_1.png)\n\
    \nJavaScript Programming\n\n255\n\nMore information can be obtained at www.testing.com\
    \ Printed in the USA \n"
  mdcn: "\n\nJavaScript 编程\n\n247\n\n</form>\n\n</body>\n</html>\n\n代码执行后将返回以下内容：\n\
    \n点击下方的按钮进行重定向\n\n重定向\n\n点击重定向按钮查看会发生什么。你将被重定向到你指定的 URL。在上面的情况下，我将 JavaScript\
    \ 网站指定为 URL。你可以更改并查看它将你重定向到另一个网站。\n\n在重定向到新页面之前，你可以向访问者显示消息。不过，加载新页面需要一点延迟。让我们演示如何实现这一功能：\n\
    \n<html\n<head>\n<script type=\"\">\nfunction RedirectFunction()\n{\nwindow.location\
    \ = \"\";\n}\n![](img/9481f3f28a383c4a6640042d4f3a3962_248_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_248_1.png)\n\
    \nJavaScript 编程\n\n248\n\ndocument.write('');\nsetTimeout('RedirectFunction',10);\n\
    </script>\n</head>\n<body>\n</body>\n</html>\n\n运行代码后，你将看到以下消息：\n\n你将在 10 秒后看到主页面\n\
    \n10 秒过期后，你将被重定向到 JavaScript 网站。\n\n正如我们之前提到的，页面重定向可以根据用户的浏览器进行。以下示例演示了如何实现操作：\n\
    \n<html\n<head>\n<script type=\"\">\n![](img/9481f3f28a383c4a6640042d4f3a3962_249_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_249_1.png)\n\n<var browsertype = navigator.appName;\n\
    if(browsertype == \"Netscape\") {\nwindow.location = \"http://javascript.com\"\
    ;\n} else if (browsertype == \"IE\") {\nwindow.location = \"http://ie.com\";\n\
    } else {\nwindow.location = \"http://browser.com\";\n}\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n\n用户将根据他们使用的浏览器类型被重定向。注意，我们使用了 `if` 决策语句将用户重定向到不同的页面。\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_250_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_250_1.png)\n\nJavaScript 编程\n\n250\n\
    \n![](img/9481f3f28a383c4a6640042d4f3a3962_251_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_251_1.png)\n\
    \nJavaScript 编程\n\n251\n\n结论\n\n本指南到此结束。JavaScript 是一种非常强大的脚本语言。JavaScript 是一种解释型脚本语言。该语言通常在客户端执行。这使其成为\
    \ Web 开发过程中验证的最佳语言。Web 开发者使用 JavaScript 来验证 Web 表单中的电子邮件地址、电话号码和其他信息的有效性。\n\n\
    JavaScript 改变了工作方式。最初，在填写表单后，必须将其提交到服务器以检查是否有任何异常。如果发现异常，服务器会将表单返回给用户以修正细节。然后用户将重新提交表单中填写的内容。使用\
    \ JavaScript，验证在表单提交到服务器之前就可以完成。用户能够了解填写表单时发生的任何错误并进行相应的纠正。这让用户的操作变得更加简单。JavaScript\
    \ 还允许你创建可以由某些动作触发的各种效果。这些动作的示例可以：\n- 鼠标悬停\n- 键按压\n- 网页加载\n- 等\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_252_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_252_1.png)\n\nJavaScript 编程\n\n252\n\
    \n![](img/9481f3f28a383c4a6640042d4f3a3962_253_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_253_1.png)\n\
    \nJavaScript 编程\n\n253\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_254_0.png)\
