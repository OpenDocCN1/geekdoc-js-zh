    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_142_1.png)\n\nClick the Login button\
    \ without entering the username or the password. You will see the images alongside\
    \ the relevant messages.\n\nEnter Name:\nPlease provide your name\nEnter Password:\n\
    Password should be at least 8 char long\nLogin\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_143_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_143_1.png)\n\n## Chapter 11- The Document\
    \ Object Model\n\nThe document object refers to your whole HTML page. After you\
    \ load an object into the web browser, it immediately becomes a document object,\
    \ which is the root element representing the html document. It comes with both\
    \ properties and methods. It is an object of the window, which means that having\
    \ document is the same as having window.\n\nMethods are the actions that you can\
    \ perform on the html elements. Properties are the values of the HTML elements\
    \ which one can set or change. The following are the document object methods:\n\
    \n- `write(\"string\")` - it writes a string to a document.\n- `eln(\"string\"\
    )` - it writes a string to a document with a new line character.\n- `getElementById()`\
    \ - gives the element with the specified id.\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_144_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_144_1.png)\n\n- `getElementsByName()`\
    \ - gives all elements with the specified name.\n- `getElementsByTagName()` -\
    \ gives all elements with the specified tag name.\n- `getElementsByClassName()`\
    \ - gives all elements with the specified class name.\n\nThe DOM is a good way\
    \ of getting the values of an input field. Many the times you will need to get\
    \ input from a user. This can be done using the following property: `document.form.name.value`.\n\
    \nWhere `document` is the html document representing our root element.\n- `form`\
    \ is the name of the form with the fields.\n- `name` is the name of the input\
    \ text.\n- `value` is a property which returns the value of input text.\n\nConsider\
    \ the following example:\n\n```html\n<html>\n<body>\n<script type=\"text/javascript\"\
    >\nfunction readValue() {\n    var name=document.memberform.memberName.value;\n\
    \    alert(+name);\n}\n</script>\n<form name=\"memberform\">\n    Enter Name:<input\
    \ type=\"text\" name=\"memberName\"/>\n    <input type=\"button\" value=\"Click\"\
    \ onclick=\"readValue\"/>\n</form>\n</body>\n</html>\n```\n\nWhen you run the\
    \ code, it will give you the following simple form:\n\nEnter Name: | Click Here\n\
    Just enter your name in the input field and click the Click Here button. See what\
    \ happens.\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_146_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_146_1.png)\n\
    \nYou will get an alert box with your name and some text appended to it:\n\nHi:\
    \ John\n\nWe simply created a simple form with an input text field. The method\
    \ `readValue()` helps us get the value that we enter into the field. Consider\
    \ the following line:\n\n`var name=document.memberform.memberName.value;`\n\n\
    The `memberName` is the name given to the text field in the form, and these must\
    \ match, otherwise you will not get the results. Other than the name, we can also\
    \ get the element by its id. This can be done using the `getElementById` method.\
    \ However, the input text field should be given an id. For example:\n\n```html\n\
    <html>\n<body>\n<script type=\"text/javascript\">\nfunction computeSquare() {\n\
    \    var x=document.getElementById(\"integer\").value;\n    alert(x*x);\n}\n</script>\n\
    <form>\n    Enter an Integer:<input type=\"text\" id=\"integer\"/>\n    <input\
    \ type=\"button\" value=\"Compute\" onclick=\"computeSquare\"/>\n</form>\n</body>\n\
    </html>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_147_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_147_1.png)\n\
    \nJavaScript Programming\n148\n\nThis should return the square of the number in\
    \ a popup box as shown below:\n\nIn the example, we have defined the `computeSquare`\
    \ method which helps us get the square of a number entered in the input text field.\
    \ Consider the following line:\n\n`var x=document.getElementById(\"integer\").value;`\n\
    \nThe `getElementById` method takes the id of the input text field as the argument.\n\
    \nThe `document.getElementsByName()` method can help us get an element by its\
    \ name. The method has the syntax given below:\n\n`document.getElementsByName()`\n\
    \nThe name is needed.\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_149_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_149_1.png)\n"
