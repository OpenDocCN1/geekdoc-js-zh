- md: "\nJavaScript Programming\n\n47\n\nThe code prints the following result:\n\n\
    Logical Operators\nfalse\ntrue\nfalse\ntrue\nfalse\n\nIn the above example, we\
    \ have used the values of variables `x` and `y` to run various logical operators.\n\
    \n## Arithmetic Operators\n\nIn JavaScript, you can perform arithmetic operations\
    \ on your variables. These operations include addition (+), subtraction (-), multiplication\
    \ (*), modulus (%), increment (++), decrement (--) etc.\n\nExample:\n```html\n\
    <script type=\"text/javascript\">\nvar First=\"Edwin\";\nvar Last=\"Peter\";\n\
    var Name=First+Last;//Name=EdwinPeter\nb=10/2;\nc=(10/2)*2;\nd=10/(1*2);\n</script>\n\
    ```\n\nThe results from the various lines have been shown in the comment section,\
    \ that is, after //. The two forward slashes, that is, //, denote the beginning\
    \ of a comment in JavaScript.\n\nThese are operators that help us assign values\
    \ to variables. They include the following:\n\n- `=`: to assign the right operand\
    \ value to the left operand.\n- `+=`: to sum up the left and right operand values\
    \ then assign the obtained result to left operand.\n- `-=`: to subtract the right\
    \ operand value from the left operand value then assign the obtained result to\
    \ left operand.\n- `*=`: to multiply the left and right operand values then assign\
    \ the obtained result to left operand.\n- `/=`: to divide the left operand value\
    \ by the right operand value then assign the obtained result to left operand.\n\
    - `%=`: to get the modulus of the left operand divided by the right operand then\
    \ assign the resulting modulus to left operand.\n\nHere is an example:\n```html\n\
    <html>\n<body>\n<h1>Assignment Operators</h1>\n<p id=\"a\"></p>\n<p id=\"b\"></p>\n\
    <p id=\"c\"></p>\n<p id=\"d\"></p>\n<p id=\"e\"></p>\n<p id=\"f\"></p>\n<script\
    \ type=\"text/javascript\">\nvar a=bb;\ndocument.getElementById(\"a\").innerHTML=a;\n\
    document.getElementById(\"b\").innerHTML=a;\na=1;\ndocument.getElementById(\"\
    c\").innerHTML=a;\na*=5;\ndocument.getElementById(\"d\").innerHTML=a;\na/=5;\n\
    document.getElementById(\"e\").innerHTML=a;\na=5;\ndocument.getElementById(\"\
    f\").innerHTML=a;\n</script>\n</body>\n</html>\n```\n\nThe code will return the\
    \ following result:\nbb\nbb\n1\n5\n1\n50\n\nThe expression `a = b;` changed the\
    \ value of variable `a` from 10 to 20. That is why the first statement prints\
    \ 20. We then begin to work with a value of `a` being 20. The expression `a +=\
    \ 1;` increases the value of `a` by 1, so it becomes 21. This becomes the new\
    \ value of variable `a`. The expression `a -= 1;` subtracts 1 from the current\
    \ value of variable `a`, which is 21, returning 20. The expression `a *= 5;` multiplies\
    \ the value of variable `a`, which is 20 by 5, returning 100. This becomes the\
    \ new value of variable `a`. The expression `a /= 5;` divides the value of variable\
    \ `a` by 5, returning 20. This becomes the new value of variable `a`. The expression\
    \ `a %= 2;` returns the remainder after dividing the value of variable `a` by\
    \ 2, returning 0.\n\n## Chapter 5 - Decision Making\n\nJavaScript comes with decision\
    \ statements that help in controlling the flow of programs. With these statements,\
    \ the action taken is based on the condition met. JavaScript supports the following\
    \ decision making statements:\n\n### If Statement\n\nThis statement should only\
    \ be used when you need to take an action based on a certain condition. The content\
    \ will only be evaluated if the condition is true. The statement takes the following\
    \ syntax:\n\n```javascript\nif (condition) {\n  \n}\n```\n\nExample:\n```html\n\
    <script>\nvar x=10;\nif (x>5) {\n  alert(10);\n}\n</script>\n```\nThe code will\
    \ return the following upon execution:\nThe first if condition evaluated to false,\
    \ hence its block of code was skipped. The second condition evaluated to true,\
    \ hence its block of code was executed to give us the above output.\n\n### If...else\
    \ Statement\n\nThis statement will evaluate the condition of whether the condition\
    \ is true or false. The statement has the following syntax:\n\n```javascript\n\
    if (condition) {\n  \n} else {\n  \n}\n```\n\nExample:\n```html\n<script>\nvar\
    \ x=18;\nif (x%2==0){\n  document.write(\"even number\");\n} else{\n  document.write(\"\
    yes\");\n}\n</script>\n```\nIn the above code, we are checking whether the value\
    \ of variable `x` is an even number or not. The code returns the following:\n\
    an even number\n\nThe expression `x%2==0` checks the remainder after dividing\
    \ `x` by 2. If the remainder is 0, then `x` is an even number, otherwise, it is\
    \ an odd number.\n\n### If...else if Statement\n\nSometimes, you may have multiple\
    \ options on which you should make a decision. This statement helps us achieve\
    \ this in JavaScript. The statement has the syntax given below:\n\n```javascript\n\
    if (expression1) {\n  \n} else if (expression2) {\n  \n} else if (expression3)\
    \ {\n  \n} else {\n  \n}\n```\n\nExample:\n```html\n<script>\nvar grade=\"B\"\
    ;\nif (grade==\"A\"){\n  document.write(\"Excellent!\");\n} else if (grade==\"\
    B\"){\n  document.write(\"Good!\");\n} else if (grade==\"C\"){\n  document.write(\"\
    Fair\");\n} else {\n  document.write(\"Poor\");\n}\n</script>\n```\nThe value\
    \ of `grade` is B. all the statements to be executed are the one whose conditions\
    \ evaluate to true. The code will return: \"Good!\".\n"
  mdcn: "\n\nJavaScript 编程\n\n47\n\n代码打印以下结果：\n\n逻辑运算符\nfalse\ntrue\nfalse\ntrue\n\
    false\n\n在上面的示例中，我们使用了变量 `x` 和 `y` 的值来运行各种逻辑运算符。\n\n## 算术运算符\n\n在 JavaScript 中，你可以对变量执行算术操作。这些操作包括加法\
    \ (+)、减法 (-)、乘法 (*)、取模运算 (%)、自增 (++)、自减 (--) 等。\n\n示例：\n```html\n<script type=\"\
    text/javascript\">\nvar First=\"Edwin\";\nvar Last=\"Peter\";\nvar Name=First+Last;//Name=EdwinPeter\n\
    b=10/2;\nc=(10/2)*2;\nd=10/(1*2);\n</script>\n```\n\n各行的结果已在注释部分显示，即 `//` 之后。两个正斜杠即\
    \ `//` 表示 JavaScript 中注释的开始。\n\n这些是帮助我们为变量赋值的运算符。它们包括以下：\n\n- `= `：将右操作数的值赋值给左操作数。\n\
    - `+=`：将左、右操作数的值相加，然后将获得的结果赋值给左操作数。\n- `-=`：从左操作数的值中减去右操作数的值，然后将获得的结果赋值给左操作数。\n\
    - `*=`：将左、右操作数的值相乘，然后将获得的结果赋值给左操作数。\n- `/=`：将左操作数的值除以右操作数的值，然后将获得的结果赋值给左操作数。\n\
    - `%=`：获取左操作数除以右操作数的模，然后将得到的模结果赋值给左操作数。\n\n这里是一个示例：\n```html\n<html>\n<body>\n\
    <h1>赋值运算符</h1>\n<p id=\"a\"></p>\n<p id=\"b\"></p>\n<p id=\"c\"></p>\n<p id=\"\
    d\"></p>\n<p id=\"e\"></p>\n<p id=\"f\"></p>\n<script type=\"text/javascript\"\
    >\nvar a=bb;\ndocument.getElementById(\"a\").innerHTML=a;\ndocument.getElementById(\"\
    b\").innerHTML=a;\na=1;\ndocument.getElementById(\"c\").innerHTML=a;\na*=5;\n\
    document.getElementById(\"d\").innerHTML=a;\na/=5;\ndocument.getElementById(\"\
    e\").innerHTML=a;\na=5;\ndocument.getElementById(\"f\").innerHTML=a;\n</script>\n\
    </body>\n</html>\n```\n\n代码将返回以下结果：\nbb\nbb\n1\n5\n1\n50\n\n表达式 `a = b;` 将变量 `a`\
    \ 的值从 10 改变为 20。这就是为什么第一条语句打印了 20。然后我们开始处理 `a` 为 20 的值。表达式 `a += 1;` 将 `a` 的值增加了\
    \ 1，因此它变成了 21。这成了变量 `a` 的新值。表达式 `a -= 1;` 从变量 `a` 的当前值（21）中减去 1，返回 20。表达式 `a *=\
    \ 5;` 将变量 `a` 的值（20）乘以 5，返回 100。这成了变量 `a` 的新值。表达式 `a /= 5;` 将变量 `a` 的值除以 5，返回\
    \ 20。这成了变量 `a` 的新值。表达式 `a %= 2;` 返回变量 `a` 的值除以 2 的余数，返回 0。\n\n## 第 5 章 - 决策\n\n\
    JavaScript 带有决策语句，有助于控制程序的流程。通过这些语句，所采取的操作基于所满足的条件。JavaScript 支持以下决策语句：\n\n###\
    \ If 语句\n\n该语句应在需要根据特定条件采取操作时使用。只有当条件为真时，内容才会求值。该语句的语法如下：\n\n```javascript\nif\
    \ (condition) {\n  \n}\n```\n\n示例：\n```html\n<script>\nvar x=10;\nif (x>5) {\n\
    \  alert(10);\n}\n</script>\n```\n代码执行后将返回：\n第一个 if 条件为假，因此其代码块被跳过。第二个条件为真，因此执行了其代码块，并产生上述输出。\n\
    \n### If...else 语句\n\n该语句将评估条件为真还是假。该语句具有以下语法：\n\n```javascript\nif (condition)\
    \ {\n  \n} else {\n  \n}\n```\n\n示例：\n```html\n<script>\nvar x=18;\nif (x%2==0){\n\
    \  document.write(\"even number\");\n} else{\n  document.write(\"yes\");\n}\n\
    </script>\n```\n在上面的代码中，我们正在检查变量 `x` 的值是否为偶数。代码返回：\nan even number\n\n表达式 `x%2==0`\
    \ 检查 `x` 除以 2 的余数。如果余数为 0，则 `x` 是偶数，否则它是奇数。\n\n### If...else if 语句\n\n有时，你可能有多个需要做出决策的选项。该语句帮助我们在\
    \ JavaScript 中实现这一点。该语句的语法如下所示：\n\n```javascript\nif (expression1) {\n  \n} else\
    \ if (expression2) {\n  \n} else if (expression3) {\n  \n} else {\n  \n}\n```\n\
    \n示例：\n```html\n<script>\nvar grade=\"B\";\nif (grade==\"A\"){\n  document.write(\"\
    Excellent!\");\n} else if (grade==\"B\"){\n  document.write(\"Good!\");\n} else\
    \ if (grade==\"C\"){\n  document.write(\"Fair\");\n} else {\n  document.write(\"\
    Poor\");\n}\n</script>\n```\n`grade` 的值为 B。所有要执行的语句都是条件求值为真的语句。代码将返回：\"Good!\"\
    \n\n"
