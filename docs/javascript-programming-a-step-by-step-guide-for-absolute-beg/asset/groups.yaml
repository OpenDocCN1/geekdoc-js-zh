    通过阅读本文档，读者同意在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失不负责，包括但不限于错误、遗漏或不准确之处。


    JavaScript 编程


    本书目标

    以下是本书的目标：

    - 帮助你了解如何开始 JavaScript 编程。

    - 帮助你理解组成 JavaScript 脚本语言的语法和结构。

    - 帮助你从 JavaScript 初学者变为专业人士。

    - 帮助你理解如何使用 JavaScript 提高网站应用程序的交互性。


    本书读者

    作者针对以下群体：

    - 任何 JavaScript 编程或通用计算机编程的初学者。

    - 任何需要提高 JavaScript 技能的人员。

    - 寻找以最简单最简单的方法向学生解释 JavaScript 的教授、讲师或导师。

    - 学生和学者，特别是关注计算机编程和 Web 开发的人员。


    学习本书需要什么？请确保你拥有以下物品：

    - 一个文本编辑器（如记事本）。

    - 一个现代 Web 浏览器。


    书中内容什么？

    本书分为若干章节，每章探索 JavaScript 脚本语言的不同功能。作者提供了 JavaScript 代码，每段代码执行不同的任务。每段代码旁都提供了相应的解释，以帮助读者理解代码各行的含义。此外，还提供了显示每段代码应有输出的截图。作者使用了简单的语言，以便零基础学者轻松理解。


    关于作者

    Brian Jenkins 拥有计算机科学博士学位。他曾针对磁记录系统和远距离光通信系统进行编码研究。拥有二十年教授新手编程的经验，作为这一代最有才华的 IT
    专家之一，Brian 博士担任研究专家，兼生物信息学家。自2015年以来，Brian 与妻子和女儿住在日内瓦。他正在编写一系列关于计算机编程和数据科学的书籍。


    “JavaScript 是一种坏部分过多的语言。” Douglas Crockford


    引言

    JavaScript 是一种每个 Web 开发者都应该熟悉的脚本语言。JavaScript 为 Web 开发领域带来了许多变化。它为 Web 开发者提供了一种让网页更具交互性的方法。这是大多数访问者所寻找的。如果你了解如检查用户填写表单时输入的详情是否正确等验证，JavaScript
    是实现此类功能的最佳语言。它是 WWW（万维网）的技术之一。JavaScript 的优点是它受所有现代浏览器的支持。这意味着你不需要安装任何插件即可运行其脚本。你可以轻松开始编写和运行
    JavaScript 脚本，因为你只需要基础元素，如文本编辑器和浏览器。


