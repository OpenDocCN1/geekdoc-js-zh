- md: "\nJavaScript Programming\n149\n\nExample:\n\n```html\n<html>\n<body>\n<script\
    \ type=\"javascript\">\nfunction getNumber() {\n  var options = document.getElementsByName(\"\
    option\");\n  alert(options.length);\n}\n</script>\n<form>\n  Yes:<input type=\"\
    radio\" name=\"option\" value=\"Yes\">\n  No:<input type=\"radio\" name=\"option\"\
    \ value=\"No\">\n  <input type=\"button\" onclick=\"getNumber()\" value=\"Available\
    \ Options\">\n</form>\n</body>\n</html>\n```\n\nUpon execution, the code returns\
    \ the following:\n\n| Yes | No | Available Options |\n| :--- | :--- | :--- |\n\
    | @ | @ | |\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_150_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_150_1.png)\n\
    \nJavaScript Programming\n150\n\nClick the Available Options button and see what\
    \ happens. A popup window will be shown as follows:\n\nTotal Options: 2\n\nWe\
    \ have created two radio buttons with options Yes and No. Note that these two\
    \ input types have been given the same name, that is, option.\n\nConsider the\
    \ following line:\n`var options=document.getElementsByName(\"option\");`\n\nThe\
    \ line helps us count the number of elements with the name option. This should\
    \ be 2 as shown in the output.\n\n### getElementsByTagName()\n\nThe `document.getElementsByTagName()`\
    \ property returns the elements with the tag name which is specified. It takes\
    \ the syntax given below:\n\n`document.getElementsByTagName(\"name\")`\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_151_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_151_1.png)\n\nJavaScript Programming\n\
    151\n\nFor example:\n\n```html\n<html>\n<body>\n<script type=\"javascript\">\n\
    function allparagraphs() {\n  var pgs = document.getElementsByTagName(\"p\");\n\
    \  alert(pgs.length);\n}\n</script>\n<p>This is a paragraph</p>\n<p>This is a\
    \ paragraph</p>\n<p>This is a paragraph</p>\n<p>This is a paragraph</p>\n<button\
    \ onclick=\"allparagraphs()\">Total Paragraphs</button>\n</body>\n</html>\n```\n\
    \nThe code returns the following upon execution:\n\nThis is a paragraph\nThis\
    \ is a paragraph\nThis is a paragraph\nThis is a paragraph\n\n| Total Paragraphs\
    \ |\n| :--- |\n| 4 |\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_152_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_152_1.png)\n\
    \nJavaScript Programming\n152\n\nClick the Total Paragraphs button and see what\
    \ happens. You will see the following popup:\n\nTotal paragraphs are: 4\n\nThis\
    \ means that the code was able to count the number of paragraphs that we have.\n\
    \nThe main logic lies in the following line:\n`var pgs=document.getElementsByTagName(\"\
    p\");`\n\nWe have passed the tag \"p\" as the argument to our method, and the\
    \ tag represents a paragraph. There are three elements with the tag \"p\", so\
    \ the output should be 4 paragraphs. Here is another example:\n\n```html\n<html>\n\
    <body>\n<script type=\"javascript\">\nfunction count2() {\n  var h2count = document.getElementsByTagName(\"\
    h2\");\n  alert(\"+\" + h2count.length);\n}\nfunction count3() {\n  var h3count\
    \ = document.getElementsByTagName(\"h3\");\n  alert(\"+\" + h3count.length);\n\
    }\n</script>\n<h2>A</h2><h2>A</h2><h2>A</h2><h2>A</h2>\n<h3>A</h2><h3>A</h2><h3>A</h2><h3>A</h2><h3>A</h2>\n\
    <h2>A</h2><h2>A</h2><h2>A</h2><h2>A</h2>\n<h3>A</h2><h3>A</h2><h3>A</h3>\n<button\
    \ onclick=\"count2()\">Total h2</button>\n<button onclick=\"count3()\">Total h3</button>\n\
    </body>\n</html>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_153_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_153_1.png)\n\
    \nJavaScript Programming\n153\n\nThe code returns the following output upon execution:\n\
    \n| h2 | h3 |\n| :--- | :--- |\n| 4 | 5 |\n\nWe have a total of 4 h2 tags and\
    \ a total of 5 h3 tags. Click the Total h2 button and see what happens. You should\
    \ get the following popup:\n\nTotal count for h2 tags: 4\n\nClick the Total h3\
    \ button and see what happens:\n\nTotal count for h3 tags: 5\n\n### innerHTML\n\
    \nThis property can be used for addition of a dynamic content to an html page.\
    \ It is used on html pages when there is a need to generate dynamic content like\
    \ comment form, registration form, etc. Consider the following example:\n\n```html\n\
    <html>\n<body>\n<script type=\"javascript\">\nfunction displayform() {\n  var\
    \ data = document.getElementById(\"area\");\n  area.innerHTML = data;\n}\n</script>\n\
    <form name=\"a\">\n  <input type=\"text\" value=\"\" onclick=\"displayform()\"\
    >\n  <div id=\"area\"></div>\n</form>\n</body>\n</html>\n```\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_154_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_154_1.png)\n\n### innerText\n\n###Text\n\
    \nWe can use this property to add a dynamic property into an HTML page. Note that\
    \ when this property is used, your text is interpreted as a normal text rather\
    \ than as html content. A good application of this is when you need to write the\
    \ strength of a password based on its length, write a validation message etc.\
    \ For example:\n\n```html\n<html>\n<body>\n<script type=\"javascript\">\nfunction\
    \ validatePass() {\n  var message;\n  if (document.form.userPass.value.length\
    \ > 5) {\n    message = \"Strong\";\n  } else {\n    message = \"Poor\";\n  }\n\
    \  document.getElementById(\"area\").innerText = message;\n}\n</script>\n<form\
