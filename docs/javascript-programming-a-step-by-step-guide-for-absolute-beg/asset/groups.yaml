    ## Navigator Object


    This object is used for detecting browsers. It can help get information about
    the browser in terms of appName, userAgent, appCodeName etc. The navigator object
    is a property of the window, and we can access it as follows:


    window.navigator


    It can also be accessed as follows:


    navigator


    The object comes with various properties including the following:


    - appName- it returns the name

    - appCodeName- it returns code name

    - appVersion- it returns the version

    - cookieEnabled- it returns true if browser cookies are enabled and false otherwise


    ![](img/9481f3f28a383c4a6640042d4f3a3962_170_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_170_1.png)


    JavaScript Programming

