- md: "\nJavaScript Programming\n\nWe can create more than one static method with\
    \ the same name and invoke them. This is demonstrated below:\n\n```javascript\n\
    class StaticTest {\n  static show() {\n    return;\n  }\n}\n</script>\ndocument.writeln(StaticTest.show());\n\
    ```\n\nA static method can also be invoked within a constructor. This is demonstrated\
    \ below:\n\n```html\n<script>\nclass StaticTest {\n  constructor() {\n    document.writeln(StaticTest.show());\n\
    \    document.writeln(this.constructor.show());\n  }\n  static show() {\n    return;\n\
    \  }\n}\nvar st=new StaticTest();\n</script>\n```\n\nThe code returns the following\
    \ result:\nStatic method has been invoked\nStatic method has been invoked\n\n\
    A static method can also be invoked from within a non-static method. For example:\n\
    \n```html\n<script>\nclass StaticTest {\n  static show() {\n    return;\n  }\n\
    \  show() {\n    document.writeln(StaticTest.show()+\"<br>\");\n  }\n}\nvar st=new\
    \ StaticTest();\nst.show();\n</script>\n```\n\nThe code returns the following\
    \ result:\nstatic method has been invoked\n\n## Encapsulation\n\nEncapsulation\
    \ refers to the process of binding data together with the functions that act on\
    \ that data. It is a good way of controlling data and validating it.\n\nTo achieve\
    \ this in JavaScript, you should make the data members private using the `var`\
    \ keyword. Setter methods can be used for setting the data while getter methods\
    \ can be used for getting the data.\n\nConsider the following example:\n\n```javascript\n\
    class Student {\n  constructor() {\n    var name;\n    var score;\n  }\n  getStudentName()\
    \ {\n    return this.name;\n  }\n  setStudentName(name) {\n    this.name=name;\n\
    \  }\n  getScore() {\n    return this.score;\n  }\n  setScore(score) {\n    this.score=score;\n\
    \  }\n}\nvar st=new Student();\nst.setStudentName('John');\nst.setScore(78);\n\
    document.writeln(st.getStudentName()+st.getScore());\n</script>\n```\n\nThe code\
    \ will return the following result after execution:\nJohn 78\n\nLet us see how\
    \ we can validate the student’s score:\n\n```html\n<script>\nclass Student {\n\
    \  constructor() {\n    var name;\n    var score;\n  }\n  getStudentName() {\n\
    \    return this.name;\n  }\n  setStudentName(name) {\n    this.name=name;\n \
    \ }\n  getScore() {\n    return this.score;\n  }\n  setScore(score) {\n    if\
    \ (score<0||score>100) {\n      alert(\"Invalid score\");\n    } else {\n    \
    \  this.score=score;\n    }\n  }\n}\nvar st=new Student();\nst.setStudentName('John');\n\
    st.setScore(78);\ndocument.writeln(st.getStudentName()+st.getScore());\n</script>\n\
    ```\n\nThe score has been validated in the `setScore()` method. If it is not between\
    \ 0 and 100, it will be an invalid score. We have set the score to 105. Execution\
    \ of the code returns the following result:\nInvalid Score\n\nLet us modify the\
    \ score and set it to 78:\n\n```html\n<script>\nclass Student {\n  constructor()\
    \ {\n    var name;\n    var score;\n  }\n  getStudentName() {\n    return this.name;\n\
    \  }\n  setStudentName(name) {\n    this.name=name;\n  }\n  getScore() {\n   \
    \ return this.score;\n  }\n  setScore(score) {\n    if (score<0||score>100) {\n\
    \      alert(\"Invalid score\");\n    } else {\n      this.score=score;\n    }\n\
    \  }\n}\nvar st=new Student();\nst.setStudentName(\"John\");\nst.setScore(78);\n\
    document.writeln(st.getStudentName()+st.getScore());\n</script>\n```\n\nThe code\
    \ returns the following result after execution:\nJohn 78\n\nWe can also implement\
    \ encapsulation using a prototype-based approach as shown below:\n\n```javascript\n\
    function Student(name,score) {\n  var name=name;\n  var score=score;\n  Object.defineProperty(this,\
    \ \"name\", {\n    get: function() {\n      return name;\n    },\n    set: function(sname)\
    \ {\n      name=sname;\n    }\n  });\n  Object.defineProperty(this, \"score\"\
    , {\n    get: function() {\n      return score;\n    },\n    set: function(sscore)\
    \ {\n      score=sscore;\n    }\n  });\n}\nvar st=new Student(\"John\",78);\n\
    document.writeln(st.name+st.score);\n```\n\n## Inheritance\n\nWith this JavaScript\
    \ feature, we can create new classes that are based on the already existing classes.\
    \ It provides a child class with a way to use the methods and properties that\
    \ belong to the parent class.\n\nIn JavaScript, inheritance is done using the\
    \ `extends` keyword. With this keyword, we create a child class that is based\
    \ on the parent class. After that, the child class will be able to acquire the\
    \ behavior and properties of the parent class.\n\nInheritance maintains the IS-A\
    \ relationship. Inheritance can also be achieved using a prototype-based approach.\
    \ Consider the following example where Current inherits Date:\n\n```html\n<script>\n\
    class Current extends Date {\n  constructor() {\n    super();\n  }\n}\nvar c=new\
    \ Current();\ndocument.writeln(c.getDate()+\"-\"+c.getMonth()+1)+-\"+c.getFullYear());\n\
    </script>\n```\n\nThe code will return the output shown below:\nToday is on: 20-2-2019\n\
    \nThe code returns the date of today. Here is another example:\n\n```html\n<script>\n\
    class Current extends Date {\n  constructor(year) {\n    super(year);\n  }\n}\n\
    var c=new Current(2019);\ndocument.writeln(\"\");\ndocument.writeln(c.getFullYear());\n\
    </script>\n```\n"
  mdcn: "\nJavaScript 编程\n\n我们可以创建多个同名的静态方法并调用它们。下文所示：\n\n```javascript\nclass StaticTest\
    \ {\n  static show() {\n    return;\n  }\n}\n</script>\ndocument.writeln(StaticTest.show());\n\
    ```\n\n静态方法也可以在构造函数内部调用。下文所示：\n\n```html\n<script>\nclass StaticTest {\n  constructor()\
    \ {\n    document.writeln(StaticTest.show());\n    document.writeln(this.constructor.show());\n\
    \  }\n  static show() {\n    return;\n  }\n}\nvar st=new StaticTest();\n</script>\n\
    ```\n\n代码返回以下结果：\n静态方法已调用\n静态方法已调用\n\n静态方法方法也可以从非静态方法内部调用。例如：\n\n```html\n<script>\n\
    class StaticTest {\n  static show() {\n    return;\n  }\n  show() {\n    document.writeln(StaticTest.show()+\"\
    <br>\");\n  }\n}\nvar st=new StaticTest();\nst.show();\n</script>\n```\n\n代码返回以下结果：\n\
    静态方法已调用\n\n## 封装\n\n封装是指将数据与作用于该数据的函数绑定的过程。它是控制数据和验证数据的一种良好方法。\n\n要在 JavaScript\
    \ 中实现这一点，你应该使用 `var` 关键字将数据成员设为私有。可以使用 setter 方法（set）来设置数据，可以使用 getter 方法（get）来获取数据。\n\
    \n考虑以下示例：\n\n```javascript\nclass Student {\n  constructor() {\n    var name;\n\
    \    var score;\n  }\n  getStudentName() {\n    return this.name;\n  }\n  setStudentName(name)\
    \ {\n    this.name=name;\n  }\n  getScore() {\n    return this.score;\n  }\n \
    \ setScore(score) {\n    this.score=score;\n  }\n}\nvar st=new Student();\nst.setStudentName('John');\n\
    st.setScore(78);\ndocument.writeln(st.getStudentName()+st.getScore());\n</script>\n\
    ```\n\n代码执行后将返回以下结果：\nJohn 78\n\n让我们看看如何验证学生的分：\n\n```html\n<script>\nclass Student\
    \ {\n  constructor() {\n    var name;\n    var score;\n  }\n  getStudentName()\
    \ {\n    return this.name;\n  }\n  setStudentName(name) {\n    this.name=name;\n\
    \  }\n  getScore() {\n    return this.score;\n  }\n  setScore(score) {\n    if\
    \ (score<0||score>100) {\n      alert(\"Invalid score\");\n    } else {\n    \
    \  this.score=score;\n    }\n  }\n}\nvar st=new Student();\nst.setStudentName('John');\n\
    st.setScore(78);\ndocument.writeln(st.getStudentName()+st.getScore());\n</script>\n\
    ```\n\n分数在 `setScore()` 方法中进行了验证。如果分数不在 0 到 100 之间，它将是无效分数。我们将分数设置为 105。代码的执行返回以下结果：\n\
    无效分数\n\n让我们修改分数并将其设置为 78：\n\n```html\n<script>\nclass Student {\n  constructor()\
    \ {\n    var name;\n    var score;\n  }\n  getStudentName() {\n    return this.name;\n\
    \  }\n  setStudentName(name) {\n    this.name=name;\n  }\n  getScore() {\n   \
    \ return this.score;\n  }\n  setScore(score) {\n    if (score<0||score>100) {\n\
    \      alert(\"Invalid score\");\n    } else {\n      this.score=score;\n    }\n\
    \  }\n}\nvar st=new Student();\nst.setStudentName(\"John\");\nst.setScore(78);\n\
    document.writeln(st.getStudentName()+st.getScore());\n</script>\n```\n\n代码执行后返回以下结果：\n\
    John 78\n\n我们也可以使用基于原型的方法来实现封装，如下所示：\n\n```javascript\nfunction Student(name,score)\
    \ {\n  var name=name;\n  var score=score;\n  Object.defineProperty(this, \"name\"\
    , {\n    get: function() {\n      return name;\n    },\n    set: function(sname)\
    \ {\n      name=sname;\n    }\n  });\n  Object.defineProperty(this, \"score\"\
    , {\n    get: function() {\n      return score;\n    },\n    set: function(sscore)\
    \ {\n      score=sscore;\n    }\n  });\n}\nvar st=new Student(\"John\",78);\n\
    document.writeln(st.name+st.score);\n```\n\n## 继承\n\n通过这一 JavaScript 特性，我们可以基于已有的类创建新类。它为子类提供了一种使用属于父类的方法和属性的方法。\n\
    \n在 JavaScript 中，继承是通过使用 `extends` 关键字实现的。通过这个关键字，我们创建一个基于父类的子类。之后，子类将能够获取父类的行为和属性。\n\
    \n继承维护了“是一个”（IS-A）的关系。继承也可以通过基于原型的方法实现。考虑以下示例，其中 `Current` 继承自 `Date`：\n\n```html\n\
    <script>\nclass Current extends Date {\n  constructor() {\n    super();\n  }\n\
    }\nvar c=new Current();\ndocument.writeln(c.getDate()+\"-\"+c.getMonth()+1)+-\"\
    +c.getFullYear());\n</script>\n```\n\n代码将返回所示输出：\n今天是：20-2-2019\n\n代码返回今天的日期。另一个示例：\n\
    \n```html\n<script>\nclass Current extends Date {\n  constructor(year) {\n   \
    \ super(year);\n  }\n}\nvar c=new Current(2019);\ndocument.writeln(\"\");\ndocument.writeln(c.getFullYear());\n\
    </script>\n```\n"
