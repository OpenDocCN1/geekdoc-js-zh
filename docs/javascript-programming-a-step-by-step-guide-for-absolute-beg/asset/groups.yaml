- md: "\nJavaScript Programming\n\nThis is demonstrated in the following example:\n\
    \n```html\n<script>\nclass Student {\n  constructor(admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n  detail() {\n    document.writeln(this.admission\
    \ + this.name);\n  }\n}\n\nvar student1 = new Student();\nvar student2 = new Student();\n\
    student1.detail();\nstudent2.detail();\n</script>\n```\n\nThe above code cannot\
    \ work as we tried to access a class before declaring it. A class can only be\
    \ declared once. If you try to declare it more than once, it will return an error.\
    \ Here is an example:\n\n```html\n<script>\nclass Student {\n  constructor(admission,\
    \ name) {\n    this.admission = admission;\n    this.name = name;\n  }\n  detail()\
    \ {\n    document.writeln(this.admission + this.name);\n  }\n}\nvar student1 =\
    \ new Student();\nvar student2 = new Student();\nstudent1.detail();\nstudent2.detail();\n\
    </script>\n```\n\nThe above code will also not run as we have declared the class\
    \ twice.\n\n## Class expressions\n\nA class can also be defined using a class\
    \ expression. In such a case, the class name is not mandatory. This means that\
    \ you can have a named or unnamed class expression. The class expression will\
    \ allow you to fetch the name of the class. However, a class declaration doesn’t\
    \ allow this.\n\nHere is an example of unnamed class expression:\n\n```html\n\
    <script>\nvar stud = class {\n  constructor(admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n};\ndocument.writeln(stud.name);\n\
    </script>\n```\n\nUpon execution, the code will return the following:\nundefined\n\
    \nThe class has been assigned to a variable rather than being given a name. With\
    \ a class expression, it is possible for us to re-declare a class.\n\n```html\n\
    <script>\nvar stud = class {\n  constructor(admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n  detail() {\n    document.writeln(this.admission\
    \ + this.name);\n  }\n};\nvar student1 = new stud();\nvar student2 = new stud();\n\
    student1.detail();\nstudent2.detail();\n</script>\n```\n\nA class expression can\
    \ be named. In such a case, the scope of the class name depends on the body of\
    \ the class. To retrieve the class name, we use the property `class.name`. Consider\
    \ the following example:\n\n```html\n<script>\nvar stud = class Student {\n  constructor(admission,\
    \ name) {\n    this.admission = admission;\n    this.name = name;\n  }\n  detail()\
    \ {\n    document.writeln(this.admission + this.name);\n  }\n};\ndocument.writeln(stud.name);\n\
    </script>\n```\n\nThe code runs successfully to return the following:\nStudent\n\
    \nLet us now try to write the code as follows:\n\n```html\n<script>\nvar stud\
    \ = class Student {\n  constructor(admission, name) {\n    this.admission = admission;\n\
    \    this.name = name;\n  }\n};\ndocument.writeln(Student.name);\n</script>\n\
    ```\n\nThe code will generate an error.\n\n## Objects\n\nAn object in JavaScript\
    \ is an entity with both state and behavior, that is, properties and methods.\
    \ An example of an object is a chair, a mouse, a keyboard, pen, etc.\n\nJavaScript\
    \ works based on objects. It treats everything as an object. It is template based\
    \ rather than being class based. Classes are not created to get objects, but we\
    \ can directly create objects. JavaScript provides us with three ways through\
    \ which we can create objects. These include the following:\n\n- Using object\
    \ literal\n- Creating an instance of the Object directly (via the `new` keyword)\n\
    - Using an object constructor (via the `new` keyword)\n\n### Object Literal\n\n\
    To create an object using an object literal, we use the syntax given below: use\
    \ a colon (:) to separate the property from the value.\n\n```html\n<script>\n\
    var student = {\n  admission: 380,\n  name: \"John Joel\",\n  age: 28\n};\ndocument.write(student.admission\
    \ + student.name + student.age);\n</script>\n```\n\nThe code returns the following\
    \ result:\n380John Joel28\n\nThe output clearly shows that the JavaScript interpreter\
    \ is able to know what the syntax means, in that the property comes first followed\
    \ by the value. That is why it was able to get the values of the properties we\
    \ need to access.\n\n### Creating an Object Instance\n\nThis is done using the\
    \ following syntax: note that we have used the `new` keyword to create the object.\n\
    \n```html\n<script>\nvar stud = new Object();\nstud.admission = 380;\nstud.name\
    \ = \"John Joel\";\nstud.age = 28;\ndocument.write(stud.admission + stud.name\
    \ + stud.age);\n</script>\n```\n\nThe following example demonstrates how we can\
    \ be used to create an object directly:\n\n### Using Object Constructor\n\nThis\
    \ involves creating a function with arguments. Every argument value can be assigned\
    \ to the current object via the `this` keyword which denotes the current object.\
    \ Consider the following example:\n\n```html\n<script>\nfunction stud(admission,\
    \ name, age) {\n  this.admission = admission;\n  this.name = name;\n}\n</script>\n\
    ```"
  mdcn: "\n\nJavaScript 编程\n\n以下示例中演示了这一点：\n\n```html\n<script>\nclass Student {\n\
    \  constructor(admission, name) {\n    this.admission = admission;\n    this.name\
    \ = name;\n  }\n  detail() {\n    document.writeln(this.admission + this.name);\n\
    \  }\n}\n\nvar student1 = new Student();\nvar student2 = new Student();\nstudent1.detail();\n\
    student2.detail();\n</script>\n```\n\n上面的代码无法运行，因为我们在声明类之前就尝试访问它。一个类只能声明一次。如果你尝试声明多次，它将返回错误。这里有一个示例：\n\
    \n```html\n<script>\nclass Student {\n  constructor(admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n  detail() {\n    document.writeln(this.admission\
    \ + this.name);\n  }\n}\nvar student1 = new Student();\nvar student2 = new Student();\n\
    student1.detail();\nstudent2.detail();\n</script>\n```\n\n上面的代码也无法运行，因为我们声明了两次类。\n\
    \n## 类表达式\n\n类也可以使用类表达式（class expression）来定义。在这种情况下，类名不是强制性的。这意味着你可以有一个命名的或未名的类表达式。类表达式允许你获取类的名称。然而，类声明（class\
    \ declaration）不允许这样做。\n\n这是一个无名类表达式的示例：\n\n```html\n<script>\nvar stud = class\
    \ {\n  constructor(admission, name) {\n    this.admission = admission;\n    this.name\
    \ = name;\n  }\n};\ndocument.writeln(stud.name);\n</script>\n```\n\n执行后，代码将返回以下内容：\n\
    undefined\n\n类被赋值给了一个变量而不是被命名。通过类表达式，我们可以重新声明类。\n\n```html\n<script>\nvar stud\
    \ = class {\n  constructor(admission, name) {\n    this.admission = admission;\n\
    \    this.name = name;\n  }\n  detail() {\n    document.writeln(this.admission\
    \ + this.name);\n  }\n};\nvar student1 = new stud();\nvar student2 = new stud();\n\
    student1.detail();\nstudent2.detail();\n</script>\n```\n\n类表达式可以是命名的。在这种情况下，类名的作用域取决于类体。要检索类名，我们使用属性\
    \ `class.name`。考虑以下示例：\n\n```html\n<script>\nvar stud = class Student {\n  constructor(admission,\
    \ name) {\n    this.admission = admission;\n    this.name = name;\n  }\n  detail()\
    \ {\n    document.writeln(this.admission + this.name);\n  }\n};\ndocument.writeln(stud.name);\n\
    </script>\n```\n\n代码成功运行并返回以下内容：\nStudent\n\n现在让我们尝试按照如下编写代码：\n\n```html\n<script>\n\
    var stud = class Student {\n  constructor(admission, name) {\n    this.admission\
    \ = admission;\n    this.name = name;\n  }\n};\ndocument.writeln(Student.name);\n\
    </script>\n```\n\n代码将生成一个错误。\n\n## 对象\n\nJavaScript 中的对象是一个既有状态又有行为的实体，即属性和方法。对象的示例可以是椅子、鼠标、键盘、笔等。\n\
    \nJavaScript 是基于对象工作的。它将一切都视为对象。它是基于模板的，而不是基于类的。创建类不是为了获取对象，但我们可以直接创建对象。JavaScript\
    \ 为我们提供了三种创建对象的方法，包括：\n\n- 使用对象字面量（object literal）\n- 直接创建 Object 的实例（通过 `new`\
    \ 关键字）\n- 使用对象构造函数（通过 `new` 关键字）\n\n### 对象字面量\n\n使用对象字面量创建对象，我们使用下面的语法：使用冒号（:）来分隔属性和值。\n\
    \n```html\n<script>\nvar student = {\n  admission: 380,\n  name: \"John Joel\"\
    ,\n  age: 28\n};\ndocument.write(student.admission + student.name + student.age);\n\
    </script>\n```\n\n代码返回以下结果：\n380John Joel28\n\n输出清晰地显示 JavaScript 解释器能够理解这种语法的含义，即属性在前，值在后。这就是为什么它能够获取我们想要访问的属性值。\n\
    \n### 创建对象实例\n\n这是通过以下语法实现的：注意我们使用了 `new` 关键字来创建对象。\n\n```html\n<script>\nvar\
    \ stud = new Object();\nstud.admission = 380;\nstud.name = \"John Joel\";\nstud.age\
    \ = 28;\ndocument.write(stud.admission + stud.name + stud.age);\n</script>\n```\n\
    \n下面的示例演示了我们如何直接创建一个对象：\n\n### 使用对象构造函数\n\n这涉及创建一个带有参数的函数。每个参数值都可以通过 `this` 关键字赋值给当前对象，`this`\
    \ 表示当前对象。考虑以下示例：\n\n```html\n<script>\nfunction stud(admission, name, age) {\n\
    \  this.admission = admission;\n  this.name = name;\n}\n</script>\n```\n"
