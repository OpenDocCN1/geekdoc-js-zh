    JavaScript Programming


    Consider the example given below:


    ```javascript

    var a = "Hello ";

    var b = "World";

    document.writeln(a.concat(b));

    ```


    The code will return the following upon execution:

    Hello World


    JavaScript


    We created two strings `a` and `b` and combined them using the `concat()` method.
    The following example demonstrates how we can combine three strings together:


    ```html

    <script>

    var a = "Hello ";

    var b = "World";

    var c = " JavaScript";

    document.writeln(a.concat(b,c));

    </script>

    ```


    Note that we created some space when writing the string. There is also another
    way of doing it as shown below:


    ```html

    <script>

    var a = "Far";

    var b = " ";

    var c = "3Away";

    document.writeln(a.concat(b+c));

    </script>

    ```

    ![](img/9481f3f28a383c4a6640042d4f3a3962_112_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_112_1.png)


    This method can be used to search and return the position of a certain character
    in a string. Always remember that string characters begin at index 0. If the character
    is not found, the method will return -1.


    For example:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.indexOf("a"));

    </script>

    ```


    The code returns 1. This is because the first character "a" was found at index
    1. It is possible for us to provide the index at which our search should start.
    This is demonstrated below:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.indexOf("a", 8));

    </script>

    ```

    ![](img/9481f3f28a383c4a6640042d4f3a3962_113_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_113_1.png)


    The code will return 9. This is because we have stated that the search should
    begin at index 8 rather than from index 0.


    Other than a single character, we can print the position of the first character
    of a certain string.


    For example:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.indexOf("s"));

    </script>

    ```


    The code will return 6. This is the position of character ''s'' in the script.
    Note that the search is case-sensitive; hence the Script in JavaScript will be
    skipped. You can use Script rather than the script in the search and you will
    get a different result.


    To avoid this confusion, we can provide the JavaScript with the index from which
    the search should start:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.indexOf("s", 6));

    </script>

    ```


    The search will now begin from index 6 rather than from index 0.

    ![](img/9481f3f28a383c4a6640042d4f3a3962_114_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_114_1.png)


    We can try to search for an element that doesn’t exist and see what happens:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.indexOf("Java", 1));

    </script>

    ```


    The script will return -1. This is because we don’t have a Language string. However,
    we have a language.


    ### search()


    This method is used for the purpose of searching for regular expressions in a
    string. If no match is found, the method will return -1. The method normally goes
    with the syntax given below:


    `string.search(regexp)`


    The parameter `regexp` denotes the expression that is be searched. The method
    normally returns the position of the character you were searching for. Consider
    the example given below:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.search("Java"));

    </script>

    ```

    ![](img/9481f3f28a383c4a6640042d4f3a3962_115_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_115_1.png)


    The code will return 6. The string language begins at index 6. Note that the search
    method is case-sensitive. The following example demonstrates this:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.search("Script"));

    </script>

    ```


    The code will return 6. This is because it is searching for an uppercase S. To
    ignore the case-sensitive nature of the search, we can use the `i` flag as shown
    below:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.search(/script/i));

    </script>

    ```


    The code will now return 5 rather than 6. This is because the search is no longer
    case-sensitive. Let us now search for a regular expression that is not present
    in the string and see what will happen:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.search(/programming/));

    </script>

    ```

    ![](img/9481f3f28a383c4a6640042d4f3a3962_116_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_116_1.png)


    The code will return -1 because the regular expression was not found.


    ### match()


    This method helps us to match a string against a regular expression. A global
    search modifier can be used with the match() method to get all matching elements,
    otherwise, the method will only return the first element that is found. The match()
    method takes the following syntax:


    `string.match(regexp)`


    The `regexp` is the regular expression that you need to search. Consider the following
    example:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.match(/Java/));

    </script>

    ```

    ![](img/9481f3f28a383c4a6640042d4f3a3962_117_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_117_1.png)


    The code will return Java as the output: We can demonstrate how to use the global
    search to perform the search:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.match(/Java/g));

    </script>

    ```


    The match() method is case sensitive. However, we can turn this off by using the
    ignore flag. This is demonstrated below:


    ```html

    <script>

    var st = "Hello JavaScript";

    document.write(st.match(/java/gi));

    </script>

    ```


    The code will return Java:

    ![](img/9481f3f28a383c4a6640042d4f3a3962_118_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_118_1.png)


    This shows that the search is no longer case sensitive as it was before.


    ## Chapter 9 - JavaScript Events


    Events are the actions which JavaScript can detect. A good example is an `onmouseover`
    event, which JavaScript detects once a mouse is moved over some object. The `onload`
    event is triggered once a web page is loaded. In JavaScript, events and functions
    are used together. A function is triggered once an event has occurred. Other examples
    of events include closing a window, pressing a key, resizing a window and others.


    ### onclick Event


    This is a common event in JavaScript. It occurs once a user has clicked the left
    button of the mouse. One can add a warning, validation, etc. against the event.
    Example:


    ```html

    <html>

    <head>

    <script type="text/javascript">

    function helloFunc() {

    alert();

    }

    </script>

    </head>

    ```

