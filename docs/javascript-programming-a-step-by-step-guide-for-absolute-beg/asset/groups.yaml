    ## Chapter 1- JavaScript Basics


    ### What is JavaScript?


    HTML was developed for content, CSS for presentation, but JavaScript was developed
    for interactivity. Originally, JavaScript was developed to add interactivity (such
    as animations and hovers) to small web pages, but it can now be used for nearly
    everything including large applications, games, and servers.


    JavaScript programs are known as scripts. You can write JavaScript inside the
    HTML of a web page and it will be executed automated when the page is being loaded.
    The scripts are provided in plain text and executed as they are. They don’t require
    a compilation or a special preparation so as to run. Today, we can execute JavaScript
    code on a browser, server or on a device with a JavaScript Engine. Initially,
    JavaScript was referred to as LiveScript because it made web pages alive. This
    name was later changed to JavaScript.


    JavaScript is an object-based scripting language which can be interpreted by all
    modern-day browsers. This means that all browsers come with the JavaScript Engine.
    This has increased the popularity of JavaScript, making it the most popular scripting
    language today.


    JavaScript Programming

    24


    ### Environment Setup


    To write, test and run your JavaScript code, you need the following:


    - Editor

    - Browser


    You can write your JavaScript code using even a basic text editor such as Notepad.
    However, it is good for you to get an advanced text editor that will provide you
    with features such as syntax error highlighting, auto-completion, etc. Examples
    of such editors include Visual Studio, Eclipse, Atom, etc. These can help you
    with speed development. There are also online JavaScript editors that you can
    use for writing your scripts. A good example of this is jsfiddle.net. For the
    case of the browser, you can install any type of browser depending on your preference.
    Examples of such browsers include Chrome, Internet Explorer, Safari, Firefox,
    etc. JavaScript can work on any browser running on any OS.


    JavaScript Programming

    25


    ### Example


    There are three places where we can place our JavaScript code. We can place the
    code within the body, within the head tag or in an external JavaScript file. Here
    is our first example:


    ```html

    <html>

    <head>

    <script type="">

    document.write("");

    </script>

    </head>

    <body>

    </body>

    </html>

    ```


    JavaScript makes web pages interactive! The script tag specified that we are using
    JavaScript. This will help the browser know the kind of data it has been provided
    with. The code simply calls JavaScript’s document.write method which prints the
    text we pass to it. This method is used for displaying dynamic content using JavaScript.
    As we have stated above, there are three places we can add our code. The following
    code demonstrates how to add the code between the body and body tags:


    ```html

    <html>

    <head>

    <script type="">

    document.write("");

    </script>

    </head>

    <body>

    </body>

    </html>

    ```


    JavaScript Programming

    26


    Here is another example showing we can show an alert box:


    We have called the alert method which shows an alert box with the specified message.
    In this case, the message will be Hello World. The JavaScript code can also be
    added within the head tags. Here is an example:


    ```html

    <html>

    <head>

    <script type="">

    function hello() {

    alert("Hello World");

    }

    </script>

    </head>

    <body>

    <p>JavaScript</p>

    <form>

    <input type="button" value="" onclick="hello"/>

    </form>

    </body>

    </html>

    ```


    JavaScript Programming

    27


    We have created a method named hello within the script tag. This method should
    return an alert box with the message Hello World when called. We have created
    a form with a button within the body tags. The onclick property specifies the
    method to call when the button is clicked, After running the code, you should
    get the following:


    Click Me

    Click the “Click Me” button. You will see the alert box with the Hello World message.


    JavaScript Programming

    28


    That is how JavaScript code can be added within the tags. We can also create an
    external JavaScript file then embed it into a number of web pages. Due to the
    ability to use such a page on many HTML pages, we can achieve code reusability.
    Any external JavaScript file must be given a name that ends with a js extension
    to mark it as a JavaScript file. All JavaScript code should be embedded into a
    single file to make the web page respond faster.


    Let us create our external JavaScript file to return Hello World message within
    an alert box. The file will be given the name hello.js.


    ```javascript

    function hello() {

    alert("Hello World");

    }

    ```


    We can now create our HTML file and add the name of the JavaScript file to it.
    index.html:


    ```html

    <html>

    <head>

    <script type="" src="hello.js"></script>

    </head>

    <body>

    </body>

    </html>

    ```

