    \n输入姓名：\n请提供你的姓名\n输入密码：\n密码长度应至少为 8 个字符\n登录\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_143_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_143_1.png)\n\n## 第 11 章 - 文档对象模型 (DOM)\n\
    \n文档对象指的是你的整个 HTML 页面。当你将一个对象加载到网页浏览器后，它立即成为一个文档对象，即代表 html 文档的根元素。它同时包含属性和方法。它是\
    \ window 的对象，这意味着拥有 document 就同于拥有 window。\n\n方法是你可以在 html 元素上执行的操作。属性是人们设置或更改的\
    \ HTML 元素的值。以下是文档对象方法：\n\n- `write(\"string\")` - 向文档写入字符串。\n- `eln(\"string\"\
    )` - 向带有换行符的文档写入字符串。\n- `getElementById()` - 给出具有指定 id 的元素。\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_144_0.png)\
    \ ![](img/9481f3f28a383c4a6640042d4f3a3962_144_1.png)\n\n- `getElementsByName()`\
    \ - 获取所有指定名称的元素。\n- `getElementsByTagName()` - 获取所有指定标签名的元素。\n- `getElementsByClassName()`\
    \ - 获取所有指定类名的元素。\n\nDOM 是获取输入字段值的好方法。很多时候，你需要从用户那里获取输入。可以使用以下属性完成：`document.form.name.value`。\n\
    \n其中 `document` 是代表我们根元素的 html 文档。\n- `form` 是带有字段的表单名称。\n- `name` 是输入文本的名称。\n\
    - `value` 是一个返回输入文本值的属性。\n\n考虑以下示例：\n\n```html\n<html>\n<body>\n<script type=\"\
    text/javascript\">\nfunction readValue() {\n    var name=document.memberform.memberName.value;\n\
    \    alert(+name);\n}\n</script>\n<form name=\"memberform\">\n    输入姓名：<input\
    \ type=\"text\"/>\n    <input type=\"button\" value=\"点击\" onclick=\"readValue\"\
    />\n</form>\n</body>\n</html>\n```\n\n运行代码时，它会给你这个简单的表单：\n\n输入姓名：| 点击这里\n在输入字段中输入你的姓名并点击这里按钮。看看会发生什么。\n\
    \n![](img/9481f3f28a383c4a6640042d4f3a3962_146_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_146_1.png)\n\
    \n你会得到一个带有你名字的警报框：\n\n你好：John\n\n我们创建了一个带有输入字段的简单表单。`readValue()` 方法帮助我们获取输入的内容。考虑以下行：\n\
    \n`var name=document.memberform.memberName.value;`\n\n`memberName` 是表中文本字段的名称，必须匹配，否则你将无法获得结果。除了名称，我们还可以通过\
    \ id 获取元素。这可以通过 `getElementById` 方法完成。然而，输入文本字段应该赋予一个 id。例如：\n\n```html\n<html>\n\
    <body>\n<script type=\"text/javascript\">\nfunction computeSquare() {\n    var\
    \ x=document.getElementById(\"integer\").value;\n    alert(x*x);\n}\n</script>\n\
    <form>\n    输入整数：<input type=\"text\" id=\"integer\"/>\n    <input type=\"button\"\
    \ value=\"计算\" onclick=\"computeSquare\"/>\n</form>\n</body>\n</html>\n```\n\n\
    ![](img/9481f3f28a383c4a6640042d4f3a3962_147_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_147_1.png)\n\
    \nJavaScript编程\n148\n\n这应该在弹出框中返回数字的平方：\n\n在示例中，我们定义了 `computeSquare` 方法，它帮助我们获取输入到文本字段的数字。考虑以下行：\n\
    \n`var x=document.getElementById(\"integer\").value;`\n\n`getElementById` 方法接收输入字段的\
    \ id 作为参数。\n\n`document.getElementsByName()` 方法可以帮助我们通过名称获取元素。方法的语法如下：\n\n`document.getElementsByName()`\n\
    \n需要名称。\n\n![](img/9481f3f28a383c4a6640042d4f3a3962_149_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_149_1.png)\n\
    \n"
