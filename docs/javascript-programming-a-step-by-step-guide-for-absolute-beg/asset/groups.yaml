    # JavaScript Programming

    ## JavaScript: A Step-by-Step Guide for Absolute Beginners

    Brian Jenkins


    Digitized by the Internet Archive in 2022 with funding from Kahle/Austin Foundation

    https://archive.org/details/javascriptorogra0000jenk


    JavaScript

    Brian Jenkins


    JavaScript Programming


    JavaScript Programming

    A Step-by-Step Guide for Absolute Beginners

    Brian Jenkins


    JavaScript Programming


    © Copyright 2019 by Brian Jenkins. Edited and Published by ATS Coding Academy
    and Amazon Kindle Publishing. All rights reserved.


    The contents of this book may not be reproduced, duplicated or transmitted without
    the direct written permission of the author. Under no circumstances will any legal
    responsibility or blame be held against the publisher for any reparation, damages,
    or monetary loss due to the information herein, either directly or indirectly.


    You cannot amend, distribute, sell, use, quote or paraphrase any part or the content
    within this book without the consent of the author.


    Disclaimer:

    Please note the information contained within this document is for educational
    and entertainment purposes only. No warranties of any kind are expressed or implied.
    Readers acknowledge that the author is not engaging in the rendering of legal,
    financial, medical or professional advice. Please consult a licensed professional
    before attempting any techniques outlined in this book.


    By reading this document, the reader agrees that under no circumstances is the
    author responsible for any losses, direct or indirect, which are incurred as a
    result of the use of information contained within this document, including, but
    not limited to, errors, omissions, or inaccuracies.


    JavaScript Programming


    Book Objectives

    The following are the objectives of this book:

    - To help you know how to get started with JavaScript programming.

    - To help you understand the syntax and constructs that make up the JavaScript
    scripting language.

    - To help you transition from a JavaScript Beginner to a Professional.

    - To help you understand how to use JavaScript to improve the interactivity of
    your website applications.


    Who this Book is for

    The author targets the following groups of people:

    - Anybody who is a complete beginner to JavaScript programming or computer programming
    in general.

    - Anybody in need of advancing their JavaScript skills.

    - Professors, lecturers or tutors who are looking to find better ways to explain
    JavaScript to their students in the simplest and easiest way.

    - Students and academics, especially those focusing on computer programming and
    web development.


    What do you need for this Book?Make sure that you have the following:

    - A text editor such as notepad.

    - A modern web browser.


    What is inside the book?

    The book has been grouped into chapters, with each chapter exploring a different
    feature of the JavaScript scripting language. The author has provided JavaScript
    codes, each performing a different task. Corresponding explanations have also
    been provided alongside each piece of code to help the reader understand the meaning
    of the various lines of the code. In addition to this, screenshots showing the
    output that each code should have been given. The author has used a simple language
    to make it easy for absolute beginners to understand.


    About the Author

    Brian Jenkins has a Ph.D. in computer science. He conducted coding research for
    magnetic recording systems and long-haul optic communication systems. With two
    decades of experience teaching programming to newcomers and one of the most talented
    IT specialists of his generation, Dr. Brian works as a Research Specialist and
    occasional a bioinformatician. Since 2015 Brian lives in Geneva with his wife
    and daughter. He is working on a series of books on computer programming and data
    science.


    “JavaScript is a language with more than its share of bad parts.” Douglas Crockford


    Introduction

    JavaScript is a powerful scripting language that every web developer should be
    familiar with. JavaScript has brought in many changes to the web development field.
    It has provided web developers with a way of making web pages more interactive.
    This is something most visitors look for. If you know of validations like checking
    whether user enters correct details when filling forms, JavaScript is the best
    language to use for the implementation of such. It is one of the technologies
    of the WWW (World Wide Web). The good thing with JavaScript is that it is supported
    by all modern browsers. This means that you are not expected to get any plugins
    to be able to run its scripts. You can easily get started with writing and running
    JavaScript scripts because you only need basic elements like a text editor and
    a browser.

    '
