- md: "\nJavaScript Programming\n\n96\n\nWhat has happened is that the element between\
    \ the 1st and the 3rd elements was copied to the index 0. That is why the element\
    \ Nicholas was replaced by the element James. The rest of the array elements have\
    \ not been affected.\n\nLet us see how we can provide only the target and start\
    \ indexes:\n\n<script>\nvar array1 = [\"Nicholas\", \"Jane\", \"Alice\", \"Alice\"\
    ];\nvar output = array1.copyWithin(0, 2);\ndocument.writeln(output);\n</script>\n\
    \nThe code should return the following:\nJames. Jane. Alice. Alice\n\nIt is also\
    \ possible for us to provide only the target index:\n\n<script>\nvar array1 =\
    \ [\"Nicholas\", \"Jane\", \"Alice\", \"Alice\"];\nvar output = array1.copyWithin(2);\n\
    document.writeln(output);\n</script>\n\nJavaScript Programming\n\n97\n\nThe code\
    \ will return the following result:\nNicholas. James. Nicholas. James Jane\n\n\
    This method is used for filling the elements of an array with some specified static\
    \ values. When used, the original array is modified. If none of the elements has\
    \ met the condition, this method will return undefined. It takes the following\
    \ syntax:\n\narray.fill(value[, start[, end]])\n\nThe value parameter denotes\
    \ the static value that is to be filled. The start parameter is optional. It is\
    \ the index from which filling will begin. Its default value is 0, which is the\
    \ first element in the array. The end parameter is also optional. It denotes the\
    \ index at which filling of the values will stop. It returns a modified array.\n\
    \nConsider the following example:\n\n<script>\nvar array1 = [\"Nicholas\", \"\
    Jane\", \"Alice\", \"Alice\"];\nvar output = array1.fill(\"Joel\");\ndocument.writeln(array1);\n\
    </script>\n\nJavaScript Programming\n\n98\n\nThe code will return the following:\n\
    Joel Joel Joel Joel\n\nAll the array values have been replaced with Joel. Let\
    \ us see how we can provide or state the starting index:\n\n<script>\nvar array1\
    \ = [\"Nicholas\", \"Jane\", \"Alice\", \"Alice\"];\nvar output = array1.fill(\"\
    Joel\", 2);\ndocument.writeln(array1);\n</script>\n\nIn the above example, the\
    \ filling will start at the element after index 2. The code should return the\
    \ following:\nNicholas. Jane. Joel Joel\n\nThe following example demonstrates\
    \ how we can state both the start and end indexes:\n\n<script>\nvar array1 = [\"\
    Nicholas\", \"Jane\", \"Alice\", \"Alice\"];\nvar output = array1.fill(\"Joel\"\
    , 2, 4);\ndocument.writeln(array1);\n</script>\n\nJavaScript Programming\n\n99\n\
    \nevery()\n\nThe purpose of this method is to check all the array elements satisfy\
    \ the given condition. If all array elements meet the condition, the method will\
    \ return a true, otherwise false. The method takes the syntax below:\n\narray.every(callback[,\
    \ index[, thisArg]])\n\nThe callback is the function for testing the condition.\
    \ current-value denotes the current element of the array. The index parameter\
    \ is optional and it denotes the index of the current element. The arr parameter\
    \ denotes the array to which we are to apply the every function. thisArg is an\
    \ optional parameter. This is the value to be used during the execution of the\
    \ callback. The method returns a Boolean value.\n\nConsider the following example:\n\
    \n<script>\nvar marks = [20, 25, 30, 35, 40];\nfunction confirm(x) {\n  return\
    \ x > 10;\n}\ndocument.writeln(marks.every(confirm));\n</script>\n\nJavaScript\
    \ Programming\n\n100\n\nThe code returns true. We have defined an array with a\
    \ set of integer values, which are marks. All marks are above 10. The purpose\
    \ of the confirm is to check whether all marks are above 10. Since this is true,\
    \ the every function returns a true. Let us change one of the values to be below\
    \ 10 and see what happens:\n\n<script>\nvar marks = [20, 5, 30, 35, 40];\nfunction\
    \ confirm(x) {\n  return x > 10;\n}\ndocument.writeln(marks.every(confirm));\n\
    </script>\n\nThe code will return a false as the marks at index 1 is less than\
    \ 10, that is, 5.\n\nJavaScript Programming\n\n101\n\nIn the example given below,\
    \ we are checking the number of elements in the array:\n\n<script>\nvar marks\
    \ = [20, 25, 30, 35, 40];\nfunction confirm(item, index) {\n  return index < 3;\n\
    }\ndocument.writeln(marks.every(confirm));\ndocument.writeln(marks.every(confirm));\n\
    </script>\n\nThe callback is the function for testing the condition. current-value\
    \ denotes the current element of the array. The index parameter is optional and\
    \ it denotes the index of the current element. The arr parameter denotes the array\
    \ to which we are to apply the find function. thisArg is an optional parameter.\
    \ This is the value to be used during the execution of the callback.\n\nJavaScript\
    \ Programming\n\n102\n\nThis method will return the first element in an array\
    \ that meets the specified condition. It takes the following syntax:\n\narray.find(callback[,\
    \ index[, thisArg]])\n\nThe outputs are shown as comments. In the first execution,\
    \ we are passing an array with two elements. Since we only have two, this will\
    \ give us true. In the second case, our array has 5 elements. Since these are\
    \ more than 3, it will return false.\n"
  mdcn: "\nJavaScript 编程\n\n96\n\n发生的情况是第 1 个元素和第 3 个元素之间的元素被复制到了索引 0。这就是为什么 Nicholas\
    \ 元素被 James 元素替换了。数组的其余元素没有受到影响。\n\n让我们看看如何只提供目标索引和起始索引：\n\n<script>\nvar array1\
    \ = [\"Nicholas\", \"Jane\", \"Alice\", \"Alice\"];\nvar output = array1.copyWithin(0,\
    \ 2);\ndocument.writeln(output);\n</script>\n\n代码应该返回以下内容：\nJames. Jane. Alice.\
    \ Alice\n\n我们也可以只提供目标索引：\n\n<script>\nvar array1 = [\"Nicholas\", \"Jane\", \"\
    Alice\", \"Alice\"];\nvar output = array1.copyWithin(2);\ndocument.writeln(output);\n\
    </script>\n\nJavaScript 编程\n\n97\n\n代码将返回以下结果：\nNicholas. James. Nicholas. James\
    \ Jane\n\n此方法用于用某些指定的静态值填充数组元素。使用它时，原始数组会被修改。如果没有元素满足条件，该方法将返回 `undefined`。它采用以下语法：\n\
    \narray.fill(value[, start[, end]])\n\n`value` 参数表示要填充的静态值。`start` 参数是可选的。它是从填充开始的索引。它的默认值为\
    \ 0，即数组中的第一个元素。`end` 参数也是可选的。它表示停止填充值的索引。该方法返回一个被修改后的数组。\n\n考虑以下示例：\n\n<script>\n\
    var array1 = [\"Nicholas\", \"Jane\", \"Alice\", \"Alice\"];\nvar output = array1.fill(\"\
    Joel\");\ndocument.writeln(array1);\n</script>\n\nJavaScript 编程\n\n98\n\n代码将返回：\n\
    Joel Joel Joel Joel\n\n数组中的所有值都被替换为 Joel。让我们看看如何提供或指定起始索引：\n\n<script>\nvar array1\
    \ = [\"Nicholas\", \"Jane\", \"Alice\", \"Alice\"];\nvar output = array1.fill(\"\
    Joel\", 2);\ndocument.writeln(array1);\n</script>\n\n在上面的示例中，填充将从索引 2 之后的元素开始。代码应该返回：\n\
    Nicholas. Jane. Joel Joel\n\n接下来的示例演示了我们如何同时指定起始和结束索引：\n\n<script>\nvar array1\
    \ = [\"Nicholas\", \"Jane\", \"Alice\", \"Alice\"];\nvar output = array1.fill(\"\
    Joel\", 2, 4);\ndocument.writeln(array1);\n</script>\n\nJavaScript 编程\n\n99\n\n\
    every()\n\n此方法的目的是检查所有数组元素是否满足给定的条件。如果所有数组元素都满足条件，该方法将返回 `true`，否则返回 `false`。该方法采用以下语法：\n\
    \narray.every(callback[, index[, thisArg]])\n\n`callback` 是测试条件的函数。`current-value`\
    \ 表示数组的当前元素。`index` 参数是可选的，它表示当前元素的索引。`arr` 参数表示我们要应用 `every` 函数的数组。`thisArg`\
    \ 是可选参数。这是在执行 `callback` 期间使用的值。该方法返回一个布尔值。\n\n考虑以下示例：\n\n<script>\nvar marks\
    \ = [20, 25, 30, 35, 40];\nfunction confirm(x) {\n  return x > 10;\n}\ndocument.writeln(marks.every(confirm));\n\
    </script>\n\nJavaScript 编程\n\n100\n\n代码返回 `true`。我们定义了一个包含一组整数值的数组，即 `marks`。所有的\
    \ marks 都大于 10。`confirm` 的目的是检查所有 marks 是否都大于 10。由于这是真的，`every` 函数返回 `true`。让我们将其中一个值改为小于\
    \ 10，并看看会发生什么：\n\n<script>\nvar marks = [20, 5, 30, 35, 40];\nfunction confirm(x)\
    \ {\n  return x > 10;\n}\ndocument.writeln(marks.every(confirm));\n</script>\n\
    \n代码将返回 `false`，因为索引 1 处的 marks 小于 10，即 5。\n\nJavaScript 编程\n\n101\n\n在下面的示例中，我们正在检查数组中元素的数量：\n\
    \n<script>\nvar marks = [20, 25, 30, 35, 40];\nfunction confirm(item, index) {\n\
    \  return index < 3;\n}\ndocument.writeln(marks.every(confirm));\ndocument.writeln(marks.every(confirm));\n\
    </script>\n\n`callback` 是测试条件的函数。`current-value` 表示数组的当前元素。`index` 参数是可选的，它表示当前元素的索引。`arr`\
    \ 参数表示我们要应用 `find` 函数的数组。`thisArg` 是可选参数。这是在执行 `callback` 期间使用的值。\n\nJavaScript\
    \ 编程\n\n102\n\n此方法将返回数组中满足指定条件的第一个元素。它采用以下语法：\n\narray.find(callback[, index[,\
    \ thisArg]])\n\n输出如注释所示。在第一次执行中，我们传递了一个包含两个元素的数组。由于我们只有两个，这将带给我们 `true`。在第二种情况下，我们的数组有\
    \ 5 个元素。由于这些超过了 3 个，它将返回 `false`。\n\n"
