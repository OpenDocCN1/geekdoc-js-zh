    `Chapter` `13-`


    `JavaScript` `Cookies`


    `Cookies` `refer` `to` `the` `data` `kept` `in` `text` `files` `on` `a` `computer.`
    `During`


    `browsing,` `a` `web` `page` `is` `sent` `to` `the` `user’s` `browser,` `and`
    `the` `web`


    `server` `forgets` `this.` `Cookies` `help` `in` `remembering` `information`


    `regarding` `users.` `Once` `a` `user` `has` `visited` `a` `webpage,` `a` `cookie`
    `can`


    `help` `to` `store` `his` `name.` `The` `user` `will` `be` `remembered` `the`
    `next` `time`


    `he` `visits` `the` `page.` `They` `are` `saved` `using` `name-value` `pairs`
    `as`


    `shown` `below:`


    `username`


    `=` `John` `Joel`


    `Once` `a` `user’s` `browser` `requests` `for` `a` `page` `from` `the` `server,`
    `the`


    `page’s` `cookies` `are` `added` `to` `the` `request.` `The` `server` `will` `then`
    `all` `the`


    `information` `it` `needs` `to` `remember` `users.`


    `Creating` `Cookies`


    `The` `JavaScript` `document.cookie` `can` `be` `used` `for` `creation,`


    `deletion,` `and` `reading` `of` `a` `cookie.`


    `Example:`


    `document.cookie`


    `=`


    `;`


    `An` `expiry` `date` `for` `the` `cookie` `can` `also` `be` `added` `in` `UTC.`
    `After`


    `closing` `a` `browser,` `the` `cookie` `becomes` `deleted.`


    ![](img/9481f3f28a383c4a6640042d4f3a3962_177_0.png) ![](img/9481f3f28a383c4a6640042d4f3a3962_177_1.png)'
- md: "\nJavaScript Programming 193\n\nExample:\n`document.cookie` = `That is how\
    \ you can specify the expiry date of a cookie. The path for a cookie can also\
    \ be specified.`\n\nExample:\n`document.cookie` = The following script demonstrates\
    \ this:\n\n```html\n<html>\n<head>\n<script type=\"javascript\">\nfunction CreateCookie()\
    \ {\n    if(document.form1.field.value == \"\") {\n        alert(\"\");\n    \
    \    return;\n    }\n    var value = escape(document.form1.field.value) + \";\"\
    ;\n    document.cookie = \"name=\" + value;\n    document.write(value);\n}\n</script>\n\
    </head>\n<body>\n<form name=\"\" action=\"\">\nName: <input type=\"text\" name=\"\
    field\" />\n<input type=\"button\" value=\"Create Cookie\" onclick=\"CreateCookie()\"\
    \ />\n</form>\n</body>\n</html>\n```\n\nThe code will return the following form\
    \ after execution:\nEnter name [ ] Create Cookie\n\nType a name in the field then\
    \ click the “Create Cookie” button.\nYou should see the following:\nCreating Cookies:\
    \ name=John;name=Joel\n\nThe cookie will be created. You will then have a cookie\
    \ with the name you typed in your computer. If you need to create many cookies\
    \ at once, separate them using commas.\n\nJavaScript Programming 178\n\nReading\
    \ Cookies\n\nCookies can be read using the `document.cookie` object. The cookie\
    \ name is passed to the object. The string may be used anytime you are in need\
    \ of accessing the cookie. The string `document.cookie` stores cookies in the\
    \ form `name=value` pairs then separated using semicolons. The name represents\
    \ the name of the cookie, while the value denotes the string value.\n\nWith the\
    \ `split()` function, one is able to break the string to get keys and values.\n\
    \nExample:\n\n```javascript\n<script type=\"javascript\">\nfunction ReadCookies()\
    \ {\n    var cookies = document.cookie;\n    document.write(cookies);\n    var\
    \ myArray = cookies.split(\";\");\n    for (var x=0; x<myArray.length; x++) {\n\
    \        var c = myArray[x].split(\"=\");\n        var name = c[0];\n        var\
    \ value = c[1];\n        document.write(name + \": \" + value + \"<br>\");\n \
    \   }\n}\n</script>\n```\n\nJavaScript Programming 179\n\nDeleting Cookies\n\n\
    Sometimes, you may not need a cookie to be read. This calls for you to delete\
    \ it. The deletion of an array involves assigning to it an expiry date which is\
    \ past the current date.\n\nExample:\n\n```html\n<script type=\"javascript\">\n\
    function DeleteCookie() {\n    var time = new Date();\n    time.setMonth(time.getMonth()\
    \ - 1);\n    var value = escape(document.form1.field.value);\n    document.cookie\
    \ = \"name=\" + value + \"; expires=\" + time.toUTCString() + \";path=/\";\n \
    \   document.write(\"Cookie deleted\");\n}\n</script>\n<body>\n<form name=\"\"\
    \ action=\"\">\nEnter name: <input type=\"text\" name=\"field\" />\n<input type=\"\
    button\" value=\"Delete Cookie\" onclick=\"DeleteCookie()\" />\n</form>\n```\n\
    \nIn the example, we have deleted the cookie by setting its expiry date to last\
    \ one month. This logic has been achieved in the following line of the code:\n\
    `time.setMonth(time.getMonth() - 1);`\n\nJavaScript Programming 180\n\n## Chapter\
    \ 14 - Object Oriented Programming\n\nJavaScript supports the concepts of object\
    \ oriented programming. Let us discuss them:\n\n- JavaScript classes are a special\
    \ type of functions.\n- Classes can be defined in the same way as function expressions.\n\
    - A JavaScript class has many members, include methods or constructors.\n- A JavaScript\
    \ class is executed in strict mode. So any code with silent mistake or error will\
    \ throw an error.\n\nA class syntax is made up of two components: declarations\
    \ and expressions. To declare a class, we use a `class` declaration. This is done\
    \ using the `class` keyword followed by the class name. JavaScript naming conventions\
    \ require that the name of a class should begin with an uppercase letter.\n\n\
    Here is an example of a class declaration in JavaScript:\n\n```javascript\nclass\
    \ Student {\n    constructor(admission, name) {\n        this.admission = admission;\n\
    \        this.name = name;\n    }\n    detail() {\n        document.write(this.admission\
    \ + \": \" + this.name);\n    }\n}\n\nvar student1 = new Student(\"John\", \"\
    Joel\");\nvar student2 = new Student(\"Mercy\", \"George\");\n\nstudent1.detail();\n\
    student2.detail();\n```\n\nThe code returns the following upon execution:\nJohn:\
    \ Joel\nMercy: George\n\nWe have created a class named `Student`. We have then\
    \ initialized a constructor with two arguments, `admission` and `name`. We have\
    \ then created a method named `detail` which should return the details of the\
    \ student, including the admission and the name.\n\nConsider the following two\
    \ lines extracted from the code:\n`var student1 = new Student(\"John\", \"Joel\"\
    );`\n`var student2 = new Student(\"Mercy\", \"George\");`\n\nWhat we are doing\
    \ is known as instantiation. We are simply creating an instance/object of type\
    \ `Student`. This means that `student1` is an instance of `Student`, hence he\
    \ can access all the properties defined within the `Student` class. This also\
    \ applies to `student2`. The details of each student have been passed as arguments.\
    \ We have lastly invoked the `detail()` method to return the details of each student.\n\
    \nThe length in this case gives us the array length.\n\nJavaScript Programming\
    \ 181\nJavaScript Programming 182\nJavaScript Programming 183\nJavaScript Programming\
    \ 184\nJavaScript Programming 185\nJavaScript Programming 186\nJavaScript Programming\
    \ 187\n"
  mdcn: "\nJavaScript 编程 193\n\n示例：\n`document.cookie` = `这就是你如何指定 cookie 的过期日期。也可以指定\
    \ cookie 的路径。`\n\n示例：\n`document.cookie` = 下面的脚本演示了这一点：\n\n```html\n<html>\n<head>\n\
    <script type=\"javascript\">\nfunction CreateCookie() {\n    if(document.form1.field.value\
    \ == \"\") {\n        alert(\"\");\n        return;\n    }\n    var value = escape(document.form1.field.value)\
    \ + \";\";\n    document.cookie = \"name=\" + value;\n    document.write(value);\n\
    }\n</script>\n</head>\n<body>\n<form name=\"\" action=\"\">\nName: <input type=\"\
    text\" name=\"field\" />\n<input type=\"button\" value=\"Create Cookie\" onclick=\"\
    CreateCookie()\" />\n</form>\n</body>\n</html>\n```\n\n该代码在执行后将返回以下表单：\nEnter\
    \ name [ ] Create Cookie\n\n在字段中输入名称，然后点击“Create Cookie”按钮。\n你将看到：\nCreating Cookies:\
    \ name=John;name=Joel\n\ncookie 将被创建。你将在计算机上拥有一个你输入的名称的 cookie。如果你需要一次创建多个 cookie，请用逗号分隔它们。\n\
    \nJavaScript 编程 178\n\n读取 Cookie\n\n可以使用 `document.cookie` 对象读取 cookie。cookie\
    \ 的名称会被传递给该对象。当你需要访问 cookie 时，可以随时使用该字符串。字符串 `document.cookie` 以 `name=value`\
    \ 对的形式存储 cookie，并用分号分隔。name 表示 cookie 的名称，而 value 表示字符串值。\n\n通过 `split()` 函数，可以拆分字符串以获取键和值。\n\
    \n示例：\n\n```javascript\n<script type=\"javascript\">\nfunction ReadCookies() {\n\
    \    var cookies = document.cookie;\n    document.write(cookies);\n    var myArray\
    \ = cookies.split(\";\");\n    for (var x=0; x<myArray.length; x++) {\n      \
    \  var c = myArray[x].split(\"=\");\n        var name = c[0];\n        var value\
    \ = c[1];\n        document.write(name + \": \" + value + \"<br>\");\n    }\n\
    }\n</script>\n```\n\nJavaScript 编程 179\n\n删除 Cookie\n\n有时，你可能不需要读取某个 cookie。这时你就删除它。删除\
    \ cookie 涉及给它分配一个早于当前日日期。\n\n示例：\n\n```html\n<script type=\"javascript\">\nfunction\
    \ DeleteCookie() {\n    var time = new Date();\n    time.setMonth(time.getMonth()\
    \ - 1);\n    var value = escape(document.form1.field.value);\n    document.cookie\
    \ = \"name=\" + value + \"; expires=\" + time.toUTCString() + \";path=/\";\n \
    \   document.write(\"Cookie deleted\");\n}\n</script>\n<body>\n<form name=\"\"\
    \ action=\"\">\nEnter name: <input type=\"text\" name=\"field\" />\n<input type=\"\
    button\" value=\"Delete Cookie\" onclick=\"DeleteCookie()\" />\n</form>\n```\n\
    \n在示例中，我们通过将 cookie 的过期日期设置为一个月前来删除该 cookie。该逻辑在代码的以下行中实现：\n`time.setMonth(time.getMonth()\
    \ - 1);`\n\nJavaScript 编程 180\n\n## 第 14 章 面向对象编程\n\nJavaScript 支持面向对象编程的概念。让我们讨论一下：\n\
    \n-   JavaScript 类是一种特殊的函数。\n-   类可以像函数表达式一样被定义。\n-   JavaScript 类有许多成员，包括方法或构造函数。\n\
    -   JavaScript 类在严格模式下执行。因此，任何带有静错误或异常的代码都会抛出错误。\n\n类语法由两个部分组成：声明和表达式。要声明一个类，我们使用\
    \ `class` 声明。这是通过 `class` 关键字后跟类名来实现。JavaScript 的命名规范要求类名必须大写字母开头。\n\n以下是 JavaScript\
    \ 类声明的示例：\n\n```javascript\nclass Student {\n    constructor(admission, name)\
    \ {\n        this.admission = admission;\n        this.name = name;\n    }\n \
    \   detail() {\n        document.write(this.admission + \": \" + this.name);\n\
    \    }\n}\n\nvar student1 = new Student(\"John\", \"Joel\");\nvar student2 = new\
    \ Student(\"Mercy\", \"George\");\n\nstudent1.detail();\nstudent2.detail();\n\
    ```\n\n该代码执行后返回以下内容：\nJohn: Joel\nMercy: George\n\n我们创建了一个名为 `Student` 的类。然后我们初始化了一个带有两个参数\
    \ `admission` 和 `name` 的构造函数。接着我们创建了一个名为 `detail` 的方法，它应该返回学生的详细信息，包括入学号和姓名。\n\
    \n考虑代码中提取的两行：\n`var student1 = new Student(\"John\", \"Joel\");`\n`var student2\
    \ = new Student(\"Mercy\", \"George\");`\n\n我们所的操作被称为实例化。我们只是在创建 `Student` 类型的实例/对象。这意味着\
    \ `student1` 是 `Student` 的一个实例，因此它可以访问 `Student` 类中定义的所有属性。这同样适用于 `student2`。每个学生的详细信息已作为参数传递。最后我们调用了\
    \ `detail()` 方法来返回每个学生的详细信息。\n\n在这种情况下，`length` 提供了数组长度。\n\nJavaScript 编程 181\n\
    JavaScript 编程 182\nJavaScript 编程 183\nJavaScript 编程 184\nJavaScript 编程 185\nJavaScript\
    \ 编程 186\nJavaScript 编程 187\n\n"
