- md: "\nJavaScript Programming\n\n37\n\nThe following example demonstrates how to\
    \ use variables in JavaScript:\n\n```html\n<script>\nvar a = 10;\nvar b = 13;\n\
    var c = 5 + b;\ndocument.write(c);\n</script>\n```\n\nThe code will return the\
    \ sum of the two variable values, which is 23.\n\n## Local Variables\n\nThese\
    \ are variables that are defined within a block or a function. It can only be\
    \ accessed from within the block or function within which it has been defined.\n\
    \nHere is an example:\n\n```html\n<script>\nfunction xyz(){\n  var a = 10;\n}\n\
    </script>\n```\n\nThe variable `a` can only be accessed from within the function\
    \ `xyz`.\n\nHere is another example of local variable declaration:\n\n```html\n\
    <script>\nfunction xyz(){\n  var a = 16;\n}\n</script>\n```\n\nThe variable `a`\
    \ in the above example can only be accessed from within the block of its declaration.\n\
    \n## Global Variables\n\nThese are variables that can be accessed from any function.\
    \ A global variable is usually declared outside a function or with the JavaScript’s\
    \ window object.\n\nFor example:\n\n```html\n<script>\nvar val = 12;\nfunction\
    \ x() {\n  document.writeln(val);\n}\nfunction y() {\n  document.writeln(val);\n\
    }\nx();\ny();\n</script>\n```\n\nThe code will return the following:\n12 12\n\n\
    The code demonstrates that the function can be referenced from different functions\
    \ and its value will remain the same.\n\nIf you need to declare a global variable\
    \ within a function, you must use the window object. For example:\n\nSuch a variable\
    \ can be declared within any function and accessed from any function. \n\n```html\n\
    <script>\nfunction xy() {\n  window.val = 12;\n}\nfunction xz() {\n  alert(window.val);\n\
    }\nxy();\n</script>\n```\n\nWe have declared the variable `val` within the function\
    \ `xy` and assigned it a value of 12. We have then accessed the same variable\
    \ from the function `xz`. This returns a value of 12. After declaring a variable\
    \ outside a function, it is internally added to the window object. The object\
    \ can at the same time be accessed via the window object.\n\nHere is an example:\n\
    \n```html\n<script>\nvar val = 12;\nfunction y() {\n  alert(window.val);\n}\n\
    </script>\n```\n\nEach programming language supports a number of data types. They\
    \ represent the types of values which can be manipulated in the programming language.\
    \ JavaScript supports 3 primitive data types including:\n\n- Numbers such as 1,\
    \ 8, 345, etc.\n- Strings, which are texts, for example, \"My name\" etc.\n- Boolean,\
    \ which can be true or false\n\nJavaScript is also capable of supporting 2 trivial\
    \ data types, namely null and undefined. It also has a composite data type called\
    \ object. Note that in JavaScript, there is no difference between integers and\
    \ floats. In JavaScript, all numbers are represented in the form of floating-point\
    \ values.\n\n## Comparing variables\n\nIn JavaScript, variables can be compared\
    \ in different ways. We can compare whether two variables are equal or not by\
    \ use of double equals sign (==).\n\nExample:\n\n```html\n<script>\nvar x = 30;\n\
    var y = 30;\nif (x == y) {\n  alert(\"x equals y\");\n}\n</script>\n```\n\nWhen\
    \ executed, the script will show a pop up with the text \"x equals y\" as shown\
    \ below: This is the values of the two values are equal, that is, 10. If not,\
    \ nothing will happen once the script is executed.\n\nOther than numbers, we can\
    \ also compare strings as shown below:\n\nNote that when doing a comparison, we\
    \ use double equals sign (==). If you instead a single equal sign (=), the value\
    \ on the right side of the sign will become the value of variable on left side.\
    \ An example is given:\n\n```html\n<script>\nvar firstname = \"John\";\nvar lastname\
    \ = \"Doe\";\nif (lastname == \"Doe\") {\n  alert(\"Correct!\");\n}\n</script>\n\
    ```\n\n## Chapter 4 - Operators\n\nJavaScript supports the use of operators. An\
    \ operator performs an operation on one or many operands to produce a result.\
    \ For example: In the above example, 2 and 3 are the operands while + is the operator.\
    \ 2 is the left operand while 3 is the right operand. The + operator will add\
    \ the two to give a result of 5.\n\nLet us discuss the various types of operators\
    \ supported in JavaScript.\n\n### Logical Operators\n\nThese types of operators\
    \ help us in connecting either one or more conditions. The following are the logical\
    \ operators supported in JavaScript:\n\n- && - the AND operator. It checks whether\
    \ the two operands are non-zero. If yes, it returns a 1, otherwise, it returns\
    \ a 0.\n- || - the OR operator. It checks whether any of the operands is non-zero.\
    \ If yes, it returns a 1, otherwise 0.\n- ! - the NOT operator. For reversing\
    \ the Boolean result of an operand or condition.\n\nFor example:\n\n```html\n\
    <html>\n<body>\n<h1>Logical Operators</h1>\n<p id=\"1\"></p>\n<p id=\"2\"></p>\n\
    <p id=\"3\"></p>\n<p id=\"4\"></p>\n<p id=\"5\"></p>\n<script>\nvar x = 2;\nvar\
    \ y = 3;\nif (x && y) {\n  document.getElementById(\"1\").innerHTML = x && y;\n\
    }\nif (x || y) {\n  document.getElementById(\"2\").innerHTML = x || y;\n}\nif\
    \ (!x) {\n  document.getElementById(\"3\").innerHTML = !x;\n}\n</script>\n</body>\n\
    </html>\n```\n"
  mdcn: "\nJavaScript 编程\n\n37\n\n以下示例演示了如何在 JavaScript 中使用变量：\n\n```html\n<script>\n\
    var a = 10;\nvar b = 13;\nvar c = 5 + b;\ndocument.write(c);\n</script>\n```\n\
    \n代码将返回两个变量值之和，结果为 23。\n\n## 局部变量\n\n这些是在块或函数内部定义的变量。它们只能在定义它们的块或函数内部内部被访问。\n\n\
    这是一个示例：\n\n```html\n<script>\nfunction xyz(){\n  var a = 10;\n}\n</script>\n```\n\
    \n变量 `a` 只能在函数 `xyz` 内部访问。\n\n这是另一个局部变量声明的示例：\n\n```html\n<script>\nfunction xyz(){\n\
    \  var a = 16;\n}\n</script>\n```\n\n上述示例中的变量 `a` 只能在其声明的块内部被访问。\n\n## 全局变量\n\n\
    这些可以在任何函数中访问的变量。全局变量通常在函数外部声明或通过 JavaScript 的 `window` 对象声明。\n\n例如：\n\n```html\n\
    <script>\nvar val = 12;\nfunction x() {\n  document.writeln(val);\n}\nfunction\
    \ y() {\n  document.writeln(val);\n}\nx();\ny();\n</script>\n```\n\n代码将返回：\n12\
    \ 12\n\n代码演示了函数可以从不同的函数中引用，且其值将保持不变。\n\n如果你需要在函数内部声明全局变量，则必须使用 `window` 对象。例如：\n\
    \n这种变量可以在任何函数中声明，并从任何函数中访问。\n\n```html\n<script>\nfunction xy() {\n  window.val\
    \ = 12;\n}\nfunction xz() {\n  alert(window.val);\n}\nxy();\n</script>\n```\n\n\
    我们在函数 `xy` 中声明了变量 `val` 并为其赋值为 12。然后我们从函数 `xz` 访问了同一个变量。这返回了值 12。在函数外部声明变量后，它会被内部添加到\
    \ `window` 对象中。该对象可以同时通过 `window` 对象访问。\n\n这是一个示例：\n\n```html\n<script>\nvar val\
    \ = 12;\nfunction y() {\n  alert(window.val);\n}\n</script>\n```\n\n每种编程语言都支持多种数据类型。它们代表可以在编程语言中操作的值类型。JavaScript\
    \ 支持 3 种原始数据类型，包括：\n\n- 数字，例如 1、8、345 等。\n- 字符串，即文本，例如 \"My name\" 等。\n- 布尔值，可以可以为\
    \ true 或 false。\n\nJavaScript 还能支持 2 种简单数据类型，即 `null` 和 `undefined`。它还有一种名为 `object`\
    \ 的复合数据类型。注意，在 JavaScript 中，整数和浮点数没有区别。在 JavaScript 中，所有数字都以浮点值的形式表示。\n\n## 比较变量\n\
    \n在 JavaScript 中，可以用不同的方式比较变量。我们可以使用双等号 (==) 来比较两个变量是否相等。\n\n示例：\n\n```html\n\
    <script>\nvar x = 30;\nvar y = 30;\nif (x == y) {\n  alert(\"x equals y\");\n\
    }\n</script>\n```\n\n执行时，脚本将显示一个带有 \"x equals y\" 文本的弹出窗口，如下所示：这是当两个值相等时（即 10）。如果不相等，脚本执行后将什么都不会发生。\n\
    \n除了数字之外，我们也可以像下面所示比较字符串：\n\n注意，在进行比较时，我们使用双等号 (==)。如果你使用单等号 (=)，则等号右侧的值将成为左侧变量的值。这里给出一个示例：\n\
    \n```html\n<script>\nvar firstname = \"John\";\nvar lastname = \"Doe\";\nif (lastname\
    \ == \"Doe\") {\n  alert(\"Correct!\");\n}\n</script>\n```\n\n## 第 4 章 - 运算符\n\
    \nJavaScript 支持运算符的使用。运算符对一个或多个操作数执行操作以产生结果。例如：在上面的示例中，2 和 3 是操作数，而 + 是运算符。2 是左操作数，3\
    \ 是右操作数。`+` 运算符将将两者相加得到结果 5。\n\n让我们讨论一下 JavaScript 支持的各种类型的运算符。\n\n### 逻辑运算符\n\
    \n这些类型的运算符帮助我们连接一个或多个条件。以下是 JavaScript 支持的逻辑运算符：\n\n- && - 与运算符（AND）。它检查两个操作数是否非零。如果是，则返回\
    \ 1，否则返回 0。\n- || - 或运算符（OR）。它检查是否任一个操作数为非零。如果是，则返回 1，否则返回 0。\n- ! - 非运算符（NOT）。用于反转操作数或条件的布尔结果。\n\
    \n例如：\n\n```html\n<html>\n<body>\n<h1>Logical Operators</h1>\n<p id=\"1\"></p>\n\
    <p id=\"2\"></p>\n<p id=\"3\"></p>\n<p id=\"4\"></p>\n<p id=\"5\"></p>\n<script>\n\
    var x = 2;\nvar y = 3;\nif (x && y) {\n  document.getElementById(\"1\").innerHTML\
    \ = x && y;\n}\nif (x || y) {\n  document.getElementById(\"2\").innerHTML = x\
    \ || y;\n}\nif (!x) {\n  document.getElementById(\"3\").innerHTML = !x;\n}\n</script>\n\
    </body>\n</html>\n```\n"
