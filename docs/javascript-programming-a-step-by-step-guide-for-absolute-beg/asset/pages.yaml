    `Chapter` `1-` `JavaScript` `Basics`


    `What` `is` `JavaScript?`


    `HTML` `was` `developed` `for` `content,` `CSS` `for` `presentation,` `but`


    `JavaScript` `was` `developed` `for` `interactivity.` `Originally,`


    `JavaScript`


    `was` `developed` `to` `add` `interactivity` `(such` `as` `animations` `and`


    `hovers)` `to` `small` `web` `pages,` `but` `it` `can` `now` `be` `used` `for`
    `nearly`


    `everything` `including` `large` `applications,` `games,` `and` `servers.`


    `JavaScript` `programs`


    `are` `known`


    `as` `scripts.` `You` `can` `write`


    `JavaScript` `inside` `the` `HTML` `of` `a` `web` `page` `and` `it` `will` `be`
    `executed`


    `automated` `when` `the` `page` `is` `being` `loaded.` `The` `scripts` `are` `provided`


    `in` `plain` `text` `and` `executed` `as` `they` `are.` `They` `don’t` `require`
    `a`


    `compilation` `or` `a` `special` `preparation` `so` `as` `to` `run.` `Today,`
    `we` `can`


    `execute` `JavaScript` `code` `on` `a` `browser,` `server` `or` `on` `a` `device`
    `with` `a`


    `JavaScript` `Engine.` `Initially,` `JavaScript` `was` `referred` `to` `as`


    `LiveScript` `because` `it` `made` `web` `pages` `alive.` `This` `name` `was`
    `later`


    `changed` `to` `JavaScript.`


    `JavaScript` `is` `an` `object-based` `scripting` `language` `which` `can` `be`


    `interpreted` `by` `all` `modern-day` `browsers.` `This` `means` `that` `all`


    `browsers` `come` `with` `the` `JavaScript` `Engine.` `This` `has` `increased`
    `the`


    `popularity` `of` `JavaScript,` `making` `it` `the` `most` `popular` `scripting`


    `language` `today.`


