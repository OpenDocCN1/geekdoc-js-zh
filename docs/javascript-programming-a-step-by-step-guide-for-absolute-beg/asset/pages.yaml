    `13`


    `Introduction`


    `JavaScript`


    `is` `a` `powerful` `scripting` `language` `that` `every` `web`


    `developer` `should` `be` `familiar` `with.` `JavaScript` `has` `brought` `in`
    `many`


    `changes` `to` `the` `web` `development` `field.`


    `It` `has` `provided` `web`


    `developers` `with` `a` `way` `of` `making` `web` `pages` `more` `interactive.`
    `This`


    `is` `something` `most` `web` `visitors`


    `look` `for.`


    `If` `you` `know` `of`


    `validations,` `like` `checking` `whether` `a` `user` `enters` `correct` `details`


    `when` `filling` `forms,` `JavaScript` `is` `the` `best` `language` `to` `use`
    `for` `the`


    `implementation` `of` `such.` `It` `is` `one` `of` `the` `technologies` `of` `the`
    `WWW`


    `(World` `Wide` `Web).` `The` `good` `think` `with` `JavaScript` `is` `that` `it`
    `is`


    `supported` `by` `all` `modern` `web` `browsers.` `This` `means` `that` `you`
    `are`


    `not` `expected` `to` `get` `any` `special` `plugins` `to` `be` `able` `to` `run`
    `its` `scripts.`


    `You` `can` `easily` `get` `started` `with` `writing` `and` `running` `JavaScript`


    `scripts` `because` `you` `only` `need` `basic` `elements` `like` `a` `text` `editor`
    `and`


    `a` `browser.` `Modern` `browsers` `come` `with` `the` `JavaScript` `Engine`


    `embedded;` `hence` `you` `don’t` `need` `any` `other` `plugin` `to` `be` `able`
    `to`


    `run` `your` `scripts.` `The` `language` `also` `comes` `with` `many` `features`
    `and`


    `paradigms` `which` `you` `can` `rely` `on` `when` `writing` `your` `scripts.`
    `This`


    `book` `is` `an` `excellent` `guide` `for` `you` `on` `JavaScript` `programming.`


    `The` `author` `has` `discussed` `everything` `about` `JavaScript` `in` `a` `detailed`


    `manner.` `Enjoy` `reading!`


