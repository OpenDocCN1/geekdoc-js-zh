    `e`


    `To` `help` `you` `understand` `the` `syntax` `and` `constructs` `that`


    `make` `up` `the` `JavaScript` `scripting` `language.`


    `e`


    `To` `help` `you` `transition` `from` `a` `JavaScript` `Beginner` `to` `a`


    `Professional.`


    `e`


    `To` `help` `you` `understand` `how` `to` `use` `JavaScript` `to` `improve`


    `the` `interactivity` `of` `your` `website` `applications.`


