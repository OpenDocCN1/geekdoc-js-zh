  md: '# Chapter 17- Regular Expressions


    A regular expression refers to a pattern created by characters. JavaScript has
    a class named RegExp which helps programmers work with regular expressions. With
    this class, one can perform pattern matching, replace and search functions on
    some text.


    To define a regular expression, we use the RegExp() constructor. This is demonstrated
    below:


    ```

    regexpression = new RegExp("the pattern",

    );

    ```


    The parameter the_pattern is a string specifying the pattern of regular expression
    or any other regular expression. The flags parameter is an optional string with
    either the "i", "m" and "g" attributes specifying case-insensitive, multi-line
    and global matches respectively.


    Let us discuss the various methods for Regular Expressions in JavaScript.


