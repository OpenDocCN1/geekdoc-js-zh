  md: '# Chapter 3- JavaScript Variables


    A variable is a name for a storage location. From its name, it can vary. Variables
    hold values that can vary. In JavaScript, we use the `var` keyword to declare
    variables. Each variable must be given a unique name. You are allowed to assign
    a value to a variable during the time of its declaration. This can be done using
    the equals symbol (=).


    The following is the syntax for declaring and initializing variables in JavaScript:


    ```

    var variable-name;

    var variable-name = value;

    ```


    Here are valid examples of this:


    ```

    var x = ; // variable storing a numeric value

    var y = ''nicholas''; // variable storing

    var z;

    ```


    We have used the `var` keyword to declare three variables. Two of the variables
    have been assigned a value. Note that this has been done at the time of their
    declaration.'
  merge: -1
