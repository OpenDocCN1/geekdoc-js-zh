  md: '# Conclusion


    This marks the end of this guide. JavaScript is a very powerful scripting language.
    JavaScript is an interpreted scripting language. The language is normally executed
    on the client side. This makes it the best language for validations during web
    development. Web developers use JavaScript to validate their web forms for valid
    email addresses, phone numbers, and other details. JavaScript has changed the
    way things are done. Initially, after filling a form, one had to submit it to
    the server so that it could be checked for any anomalies. If anomalies were found,
    the server would return the form to the user in order to correct the details.
    The user would then re-submit the details filled in the form. With JavaScript,
    validation is done before the form can be submitted to the server. The user is
    able to know any errors done while filling the form and correct them accordingly.
    This has made things easy for users. JavaScript also allows you to create various
    effects that can be invoked by some of your actions. Examples of these actions
    can be a hover of the mouse cursor, a press of a keyboard key, loading of a web
    page, etc.'
