    # Prototype


    JavaScript language works based on prototypes, allowing the objects to acquire
    features and properties from each other. Here, every object has a prototype object.


    After the creation of a function in JavaScript, the prototype property gets added
    to that function automatically. The property is a prototype object holding the
    constructor property.'
