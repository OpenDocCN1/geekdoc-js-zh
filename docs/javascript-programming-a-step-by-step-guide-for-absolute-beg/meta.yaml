  md: "JavaScript Programming 228\n\n# Chapter 16- Error Handling\n\nJavaScript is\
    \ one of the loosely-typed languages that we have. It doesn't have a compile time.\
    \ Errors normally occur during programming. You can attempt to access an undefined\
    \ variable or function. The errors are classified as syntax errors, runtime errors\
    \ and logical errors. Let us discuss them.\n\n# Syntax Errors\n\nIn JavaScript,\
    \ syntax errors occur during interpret time. They are also known as parsing errors.\
    \ Consider the sample script given below:\n\n```\n<script type=\"text/javascript\"\
    >\n    window.print()\n</script>\n```\n\nJavaScript statement should end with\
    \ a semicolon.\n\nThe “window.print()”statement doesn’t end with a semicolon,\
    \ hence this will result in a syntax error. If a statement has a syntax error,\
    \ all statements in the same thread as this will be affected. The other threads\
    \ will be executed normally."
  merge: -1
  pgno: 229
- img_proc: false
  md: "# Runtime Errors\n\nThese are the exceptions raised during runtime. Execution\
    \ occurs after interpretation.\n\nExample:\n\n```\n<script type=\"text/javascript\"\
    >\n  window.printFile();\n</script>\n```\n\nDuring interpretation, no error will\
    \ be raised since the script has the correct syntax. However, an exception will\
    \ be raised during runtime as the script will call a method which is unknown,\
    \ that is, the printFile() method.\n\n# Logical Errors\n\nThese types of errors\
