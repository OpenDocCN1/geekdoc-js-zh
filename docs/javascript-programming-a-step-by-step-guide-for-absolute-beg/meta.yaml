  md: '# Chapter 14- Object Oriented Programming


    JavaScript supports the concepts of object oriented programming. Let us discuss
    them:


    JavaScript classes are a special type of JavaScript functions. Classes can be
    defined in the same way as functions and function expressions.


    A JavaScript class has many members, include methods or constructors. A JavaScript
    class is executed in the strict mode. So any code with silent mistake or error
    will throw an error.


    A class syntax is made up of two components:


    +   * Class declarations

    * Class expressions


    To declare a class, we use a class declaration. This is done using the class keyword
    followed by the class name. the JavaScript naming conventions require that the
    name of a class should begin with an uppercase letter.'
  merge: -1
  pgno: 185
