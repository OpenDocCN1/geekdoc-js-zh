    # Chapter 12- Browser Object Model


    The BOM (Browser Object Model) is used for interaction with the browser. The default
    browser object is a window, meaning that you can call all window functions directly
    or by specifying the window. We had discussed this, so we will not revisit it.
    Other than the window object, there are various other BOM objects. Let us discuss
    them:


    # History Object


    This object keeps an array of all URLs that the user has visited. You can use
    this object to load web pages, previous, forward and any certain web page. This
    object can be accessed as shown below:


    ```

    window.history

    ```


    It can also be accessed as follows:'
