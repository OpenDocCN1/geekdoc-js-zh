  md: '# Objects


    An object in JavaScript is an entity with both state and behavior, that is, properties
    and methods. An example of an object is a chair, a mouse, a keyboard, pen, etc.


    JavaScript works based on objects. It treats everything as an object. It is template
    based rather than being class based. Classes are not created to get objects, but
    we can directly create objects.


    JavaScript provides us with three ways through which we can create objects. These
    include the following:


    +   1. Using object literal

    2. Creating an instance of the Object directly (via the new keyword)

    3. Using an object constructor (via the new keyword)


    # Using Object Literal


    To create an object using an object literal, we use the syntax given below:


    ```

    object={property1:value1,

    property2:value2.....propertyN:valueN}

    ```


    We use a colon (:) to separate the property from the value.'
