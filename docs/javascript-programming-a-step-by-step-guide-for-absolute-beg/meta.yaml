  md: '# Chapter 13-JavaScript Cookies


    Cookies refer to the data kept in text files on a computer. During browsing, a
    web page is sent to the user''s browser, and the web server forgets this. Cookies
    help in remembering information regards users. Once a user has visited a webpage,
    a cookie can help to store his name. The user will be remembered the next time
    he visits the page. They are saved using name-value pairs as shown below:


    ```

    username = John Joel

    ```


    Once a user''s browser requests for a page from the server, the page''s cookies
    are added to the request. The server will then all the information it needs to
    remember users.


    # Creating Cookies


    The JavaScript **document.cookie** can be used for creation, deletion, and reading
    of a cookie.


    Example:


    ```

    document.cookie = "username=John joel";

    ```


    An expiry date for the cookie can also be added in **UTC**. After closing a browser,
    the cookie becomes deleted.'
