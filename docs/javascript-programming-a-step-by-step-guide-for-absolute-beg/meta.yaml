  md: '# Chapter 4- JavaScript Operators


    JavaScript supports the use of operators. An operator performs an operation on
    one or many operands to produce a result. For example:


    +


    In the above example, 2 and 3 are the operands while + is the operator. 2 is the
    left operand while 3 is the right operand. The + operator will add the two to
    give a result of 5. Let us discuss the various types of operators supported in
    JavaScript.


    # Logical Operators


    These types of operators help us in connecting either one or more conditions.
    The following are the logical operators supported in JavaScript:


    +   &&- the AND operator. It checks whether the two operands are non-zero. If
    yes, it returns a 1, otherwise, it returns a 0.

    ||- the OR operator. It checks whether any of the operands is non-zero. If yes,
    it returns a 1, otherwise a 0.

    !- the NOT operator. For reversing the Boolean result of an operand or condition.'
