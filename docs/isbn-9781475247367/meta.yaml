    In this chapter, we learned about distributing events via PubSub, one of the most
    fundamental JavaScript design patterns. The key is to decide which entities to
    distribute events through. We saw that jQuery is excellent for distributing events
    related to changes in the DOM, but using it to distribute events related to your
    application''s state is usually a mistake, since changing the page''s markup later
    could alter the way that events propagate. That''s where frameworks like Backbone
    come to the rescue, allowing you to separate the data hierarchy from the way the
    data is rendered. Some applications, particularly Node servers, use a single global
    PubSub object to connect otherwise isolated modules, enabling loose coupling and
    easy testing. The great thing about PubSub is that when you''re not subscribing
    to the events that are being published, it''s completely unobtrusive. In the next
    chapter, we''ll look at another unobtrusive way of handling events: Promises.'
  - "[PAGE 34]\n\n# # 3 Promises and Deferreds\n\nBack in 2010, I had this conversation\
    \ with my prolific colleague Mr. Ajax:\n\n> **Me:** Hey, would you fetch some\
    \ data from this URL for me, please?\n\n**Mr. Ajax:** I'm on it! Just give me\
    \ a *success* callback so I can let you know when I'm done.\n\n**Me:** OK, here\
    \ you go. Thanks.\n\n**Mr. Ajax:** Oh, and you should give me an *error* callback,\
    \ too. You know, just in case.\n\n**Me:** Good point. Anything else?\n\n**Mr.\
    \ Ajax:** Hey, I noticed that there's some code duplication between those two\
    \ callbacks! You could move that into a third *always* callback.\n\n**Me:** (impatiently)\
    \ Alright, I'll refactor them. Tell you what: Why don't you run now, and I'll\
    \ give you the callbacks later?\n\n**Mr. Ajax:** (irately) What do I look like,\
    \ an EventEmitter?\n\nThankfully, jQuery 1.5 changed Mr. Ajax's need-it-now attitude.\
    \ All of the Ajax functions you know and love now return Promises. *A Promise\
    \ is an object that represents a task with two possible outcomes* (success or\
    \ failure) and holds callbacks that fire when one outcome or the other has occurred.\
    \ For example, under jQuery 1.4, I'd have had to write this:\n\n```\n$.get('/mydata',\
    \ {\n  success: onSuccess,\n  failure: onFailure,\n  always: onAlways\n});\n```\n\
    \nBut under jQuery 1.5+, I can write this instead:\n\n```\nvar promise = $.get('/mydata');\n\
    promise.done(onSuccess);\npromise.fail(onFailure);\npromise.fail(onAlways);\n\
    ```\n\nYou might wonder what's so great about this change. Why would you want\
    \ to attach a callback after an Ajax call has fired? In a word: *encapsulation*.\
    \ If an Ajax call has multiple effects (triggering animations, inserting HTML,\
    \ locking/unlocking user input...), it's awkward for the part of your app that's\
    \ making the request to handle every contingency. It's much more elegant to pass\
    \ a Promise around.\n\nAnother advantage of Promises is that (at least in jQuery's\
    \ implementation) you can stack callbacks to your heart's content. That makes\
    \ it a lot easier to reduce code duplication when some small piece of functionality\
    \ (like a \"Loading\" animation) is shared across several Ajax calls. I recommend\
    \ stacking whenever possible to keep callbacks as simple as possible: **One task,\
    \ one callback.**"
  - '[PAGE 35]


    But the biggest advantage of using Promises is that you can easily derive new
    Promises from existing ones. You might ask two Promises representing parallel
    tasks to give you a Promise that will inform you of their mutual completion. Or
    you might ask a Promise representing the first task in a series to give you a
    Promise representing the *final* task in the series. As we''ll soon see, these
    operations come naturally to Promises.


    # 3.1 A very brief history of Promises


    Promises have existed in many forms in many languages. The term was first used
    by C++ engineers on the Xanadu project, a forerunner to the web. Promises were
    later used in the E programming language, which inspired Python devs to implement
    them in the form of the Twisted framework''s Deferreds.


    Promises hit JavaScript in a big way in 2007, when the pioneering Dojo framework,
    taking a cue from Twisted, added an object called `dojo.Deferred`. At the time,
    the relatively mature Dojo rivaled the fledgling jQuery framework in popularity.
    In 2009, citing `dojo.Deferred` as an influence, Kris Zyp proposed the CommonJS
    Promises/A spec.<sup>1</sup> That same year, Node.js made its first appearance.
    Node''s early iterations used Promises in its APIs for file I/O and DNS. However,
    in February 2010, Ryan Dahl made the decision to switch to the now-familiar `callback(err,
    results...)` format, on the grounds that Promises are a higher-level construct
    that belongs in "userland."


    This decision made way for competing Promises implementations aimed at Node, notably
    Kris Kowal''s Q.js<sup>2</sup> and AJ O''Neal''s Futures.<sup>3</sup> (In common
    usage, the terms "Promise," "Deferred," and "Future" are roughly synonymous.)
    Q is a fairly straightforward implementation of the Promises/A spec. Futures is
    a broader toolkit, incorporating many of the flow control features found in libraries
    like Async.js.


    But the reason Promises are getting so much attention today is, of course, jQuery.
    Accompanying a major rewrite of `$.ajax` in January 2011, jQuery 1.5''s Promises
    implementation thrilled countless developers who were encountering Promises for
    the first time. Others, however, were frustrated that the Promises/A spec had
    been ignored, leading to subtle API differences.


    We''ll focus on jQuery Promises for the rest of this chapter, except for a closing
    section on Promises/A and Q.js. We''ll also take our vocabulary cues from jQuery,
    particularly the distinction between Deferreds and Promises that we''ll see in
    the next section, and the use of "resolve" as the antonym of "reject."


    <sup>1</sup>http://wiki.commonjs.org/wiki/Promises/A

    <sup>2</sup>https://github.com/kriskowal/q

    <sup>3</sup>https://github.com/coolaj86/futures'
  - "[PAGE 36]\n\nPromises and Deferreds\n\n25\n\n# # 3.2 Making Promises\n\nWe started\
    \ this chapter by showing how the Ajax methods in jQuery 1.5+ ($ .ajax, $.get,\
    \ and $.post) return Promises. But to really understand Promises, we need to make\
    \ a few of our own.\n\nLet's give the user a prompt to hit either Y or N. (You\
    \ can see this example in action on jsFiddle.\")\n\nThe first thing we'll do is\
    \ create an instance of $.Deferred that represents the user's decision:\n\n```\n\
    var promptDeferred = new $.Deferred();\npromptDeferred.always(function(){ console.log('A\
    \ choice was made:'); });\npromptDeferred.done(function(){ console.log('Starting\
    \ game...'); });\npromptDeferred.fail(function(){ console.log('No game today.');\
    \ });\n```\n\n> (Note: Under jQuery 1.5, the always method was called complete.\
    \ Under jQuery 1.6/1.7, always and complete are synonymous, but always is preferred.\
    \ The complete alias is deprecated and may be removed in a future release.)\n\n\
    You're probably wondering why I created an instance of Deferred when this section\
    \ is called \"Making Promises.\" Fear not—a Deferred is a Promise! More precisely,\
    \ it's a superset of Promise with one critical addition: You can trigger a Deferred\
    \ directly. A pure Promise only lets you add more callbacks; someone else has\
    \ to trigger them.\n\nWe can trigger our Deferred with the resolve and reject\
    \ methods:\n\n```\n$('#playGame').focus().on('keypress', function(e) {\n    var\
    \ Y = 121, N = 110;\n    if (e.keyCode === Y) {\n        promptDeferred.resolve();\n\
    \    } else if (e.keyCode === N) {\n        promptDeferred.reject();\n    } else\
    \ {\n        return false;  // our Deferred remains pending\n    }\n});\n```\n\
    \nNow load the page and hit Y. The console will say:\n\nA choice was made:\nStarting\
    \ game...\n\nYou see what happened? When the Deferred was resolved, its always\
    \ and done callbacks were run.\n\nRefresh and hit N:\n\nhttp://jsfiddle.net/TrevorBurnham/Pj6Bf/"
