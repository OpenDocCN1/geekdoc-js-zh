  md: "# ## Solution 3: Throttling/Debouncing\n\nWe've looked at one solution that\
    \ operates from the part of the app that updates the models and another that works\
    \ from the models' end. But the most elegant approach is usually to act on the\
    \ particular function that we want to prevent from being called too often. In\
    \ general terms, that means we want to limit checkGameState to running once every\
    \ *n* milliseconds. There are two basic approaches to this:\n\n+   1. *Throttling*,\
    \ where additional calls to the function are ignored if its last run was less\
    \ than *n* ms ago, and\n2. *Debouncing*, where any call to the function is delayed\
    \ until *n* ms have elapsed since the last call\n\nUsually, you want throttling,\
    \ because debouncing adds some latency to every function call. Plus, debouncing\
    \ means that a function will *never* be called if it's called too often! (Sometimes\
    \ debouncing is implemented with a maximum delay to avoid this.) However, debouncing\
    \ is preferable in scenarios where you want to wait until an input source is idle,\
    \ such as rendering a preview or running a validation only after the user has\
    \ momentarily stopped typing.\n\nBoth throttling and debouncing are easy to implement\
    \ by creating a meta-function that returns a wrapped version of the original function.\
    \ Here are two simple implementations:\n\n```\nfunction throttle(func, minDelay)\
    \ {\n  var lastHitDate = 0;\n  return function() {\n    var now = new Date();\n\
    \    if (now - lastHitDate >= minDelay) {\n      lastHitDate = now;\n      return\
    \ func.apply(this, arguments);\n    };\n  };\n}\n```\n\n```\nfunction debounce(func,\
    \ delay) {\n  var timeout;\n  return function() {\n    var args = arguments;\n\
    \    clearTimeout(timeout);\n    timeout = setTimeout(function() {\n      func.apply(this,\
    \ args);\n    }, delay);\n  };\n}\n```"
  merge: -1
  pgno: 81
