    \n（注意这一行必须放在 `menu.clickHandler` 定义之后，因为如果文档已经就绪，回调将同步运行。）\n\n点击处理程序修改菜单的 `activeLinkIndex`，因此让我们通过获取相应内容并给正确的菜单项添加\
