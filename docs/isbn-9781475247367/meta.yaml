    # Praise for *Async JavaScript*


    “*Async JavaScript* is the first full book I’ve seen dedicated to a key topic
    in JavaScript development today: how to deal with concurrency and concurrent tasks
    without going crazy! For the sake of your sanity, check this out.”

    —Peter Cooper, creator of JavaScript Weekly


    “Trevor delivers a concise guide to writing asynchronous JavaScript with a perfect
    balance of browser and server-side examples. Part guide, part overview, wholly
    engaging, this book is a must-read for any JavaScript developer looking to level
    up.”

    —Wynn Netherland, co-host of The Changelog


    “Long gone are the days when developers were satisfied with synchronous Ajax.
    In an era where users expect web apps to be as responsive as desktop software,
    we need a new way of thinking. *Async JavaScript* will give you the knowledge
    you need to face complex web projects with confidence.”

    —Stan Angeloff, Managing Director at PSP WebTech


    “As CPU cores approach the gigahertz limit, the only way to run things faster
    is to do them in parallel. This book will show you how to do that in JavaScript.”

    —Chris Kimpton, Level 5 Noob


    “Trevor has done a great job showing you how to effectively use async techniques
    to get more out of your JavaScript. He covers a wide range of solutions ranging
    from the basic JavaScript primitives like setTimeout to libraries like Backbone,
    Async.js, and of course jQuery. Plus, you learn how to use Web Workers and Node
    Workers to take advantage of multiple processor cores. And this is a book you
    can easily read in a short time and get working.”

    —Scott Leberknight, Co-Founder and Software Architect, Near Infinity Corporation


    “This book will put your knowledge of JavaScript’s event loop to the test, and
    explain how common asynchronous patterns can help you write better code.”

    —Roly Fentanes, creator of Clusterhub'
  - '[PAGE 6]


    # # Dedication


    To the late Steve Jobs, and to the remarkable generation of innovators he inspired.'
  - '[PAGE 7]


    # Acknowledgments


    > “It always takes longer than you expect, even when you take into account Hofstadter’s
    Law.” —Hofstadter’s Law


    I love writing about new technologies. But writing about them while they’re still
    new is quite a trick. With *CoffeeScript: Accelerated JavaScript Development*,
    I had the fortune of following and evangelizing a project from its early days:
    I’d grabbed the @coffeescript handle on Twitter mere months after Jeremy Ashkenas
    announced the project on Hacker News, sent the book proposal to PragProg a few
    months later, and announced the book just after the language hit the all-important
    1.0 milestone and David Heinemeier Hansson announced its inclusion in Rails 3.1.


    For this book, I wanted to move even more quickly. *Async JavaScript* is the first
    book to deal exclusively with a subject that’s vexed web developers since the
    days of Netscape Navigator. My thanks go out to the Leanpub founders, Peter Armstrong
    and Scott Patten, for making a truly developer-friendly way to self-publish. Thanks,
    too, to all of this book’s backers on Kickstarter.<sup>1</sup> Their support gave
    me a clarity of purpose that’s rare in any endeavor.


    Special thanks to Stan Angeloff and Roly Fentanes for taking the time to read
    my draft manuscript closely and correct several technical errors. Given their
    eyeballs, all bugs are shallow.


    Finally, thank you for reading this book. If you enjoy it, I hope you’ll spread
    the word. Send me your feedback at trevorburnham@gmail.com, or tweet me at @trevorburnham.


    Trevor Burnham

    March 14, 2012


    <sup>1</sup>http://www.kickstarter.com/projects/869786663/async-javascript-book/backers


