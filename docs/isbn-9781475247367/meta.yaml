  md: 'In this chapter, we learned about distributing events via PubSub, one of the
    most fundamental JavaScript design patterns. The key is to decide which entities
    to distribute events through. We saw that jQuery is excellent for distributing
    events related to changes in the DOM, but using it to distribute events related
    to your application''s state is usually a mistake, since changing the page''s
    markup later could alter the way that events propagate. That''s where frameworks
    like Backbone come to the rescue, allowing you to separate the data hierarchy
    from the way the data is rendered. Some applications, particularly Node servers,
    use a single global PubSub object to connect otherwise isolated modules, enabling
    loose coupling and easy testing. The great thing about PubSub is that when you''re
    not subscribing to the events that are being published, it''s completely unobtrusive.
    In the next chapter, we''ll look at another unobtrusive way of handling events:
    Promises.'
