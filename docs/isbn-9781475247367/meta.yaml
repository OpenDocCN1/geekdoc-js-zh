    \ live strictly in the land of synchronicity. When you reach the event queue,\
    \ the stack is reset. Every stack trace is an unbroken chain of blocking code.\n\
    \n## 1.6 Tools for taming JavaScript\n\nThe rest of this book is concerned with\
    \ libraries and design patterns for working with events in pure JavaScript. But\
    \ before we proceed, you should be aware that there are some alternatives, which\
    \ I'll note briefly here.\n\n⁵ https://groups.google.com/forum/#!topic/nodejs/1E5ssslxrrU\n\
    \n### ES6 and Task.js\n\nECMAScript 6 (currently a work in progress but available\
    \ in Firefox) adds a new feature called **generators**. A generator is a function\
    \ containing a `yield` keyword that allows you to run an asynchronous function\
    \ in such a way that it blocks only the generator, making a callback unnecessary.\
    \ Generators themselves are a bit tricky to wrap your head around, but a Mozilla\
    \ project called Task.js[^1] makes them easier by providing a standard API built\
    \ on Promises. (Promises are the subject of an upcoming chapter.)\n\nThis might\
    \ just be the future of JavaScript. Unfortunately, it'll be a while before the\
    \ spec becomes official, and many years before every browser in the world supports\
    \ generators...\n\n### TameJS\n\nThe awesome programmers at OkCupid have created\
    \ a clever pre-compiler[^2] with over 500 GitHub followers that adds two keywords\
    \ to JavaScript, `await` and `defer`. An `await` block acts much like a generator,\
    \ defining code that won't return until each async task defined with `defer` has\
    \ been completed.\n\nThe Tame.js folks have also created a CoffeeScript fork with\
    \ `await`/`defer` called IcedCoffeeScript[^3].\n\n### StratifiedJS\n\nStratifiedJS\
    \ is an alternative to the `yield` paradigm that offers finer-grained control\
    \ structures, with intuitive names like `waitfor` and `resume`. Although not widely\
    \ used, it's received praise from the likes of John Resig, the creator of jQuery.\
    \ And its creator, Oni Labs, has ambitious plans for it.\n\nNote that StratifiedJS\
    \ is the name of the specification, not the implementation. The official reference\
    \ implementation is called Oni Apollo[^4].\n\n### Kaffeine\n\nIf you can't quite\
    \ wrap your head around `yield`/`await`, Kaffeine offers a simple syntactic sugar:\
    \ Just add `!` after an async function's name. Kaffeine assumes that the function\
    \ takes a callback as its last argument, and simply transforms all code after\
    \ that function call into the callback. So, for example:\n\n```\nvar sleep = function(delay,\
    \ callback) { setTimeout(callback, delay); }\nconsole.log('Wait a second...');\n\
    sleep(1000)\nconsole.log('OK, that was one second.');\n```\n\nAlthough it doesn't\
    \ have as big a following as CoffeeScript, features like this make Kaffeine well\
    \ worth checking out.\n\n### Streamline.js\n\nLike Kaffeine, Streamline.js' allows\
    \ you to use a special syntax to treat async functions as synchronous: Just use\
    \ _ in place of the callback. Interestingly, Streamline can generate either standard\
    \ callback-driven JavaScript or fiber-based code for node-fibers (see below).\
    \ Also, unlike most other JavaScript precompilers, Streamline can be used in conjunction\
    \ with CoffeeScript.\n\nNote that both Kaffeine and Streamline depend on callbacks\
    \ following the argument list convention (err, results...), which is ubiquitous\
    \ in the Node world but less common in browsers.\n\n### node-fibers\n\nWhile the\
    \ other projects above merely compile to plain JavaScript, node-fibers10 actually\
    \ extends the language understood by the Node.js runtime by adding thread-like\
    \ constructs called fibers. The main advantage of node-fibers over JS precompilers\
    \ is debugging. The line numbers in node-fiber stack traces correspond to the\
    \ line numbers in node-fiber source code, and exceptions thrown from fibers behave\
    \ much more nicely than exceptions thrown from async callbacks do.\n\nIt's a very\
    \ cool project with a small but passionate following. Just be warned that it doesn't\
    \ always play nice with mainstream Node tools.\n\nWe've seen in this chapter how\
    \ JavaScript's single-threadedness is both a blessing and a curse. In the right\
    \ hands, it makes for beautiful code free of the terrifying race conditions that\
    \ plague multi-threaded apps. But you need to develop the right mindset—and the\
    \ right techniques.\n\nIt bears mention here that there is one kind of multi-threading\
    \ in JavaScript: You can spawn worker processes. Each spawned process can exchange\
    \ data with other processes under the same limitations as any other I/O. These\
    \ make it possible to utilize multiple cores, without breaking the normal rules\
    \ of JavaScript (code can't be interrupted; variables are only accessible within\
    \ their scope). For more on workers, skip ahead to the penultimate chapter of\
    \ this book.\n\nIn the next chapter, we'll talk about organizing and stacking\
    \ event callbacks. If we do our job right, our async apps should have as many\
    \ callbacks as you can think of—each with a clear, narrow purpose.\n```"
  mdcn: "\n```\ndb.query(queryStr, username, sqlCallback);\n}\n```\n\n这种方法虽然更冗长，但在大规模应用时清晰得多。一般来说，**避免超过两层函数嵌套**。关键在于找到除作用域之外的共享状态的方式。如果听起来很复杂，也不用担心；我们将在后续章节中看到大量异步事件按顺序运行而无需嵌套处理程序的示例。\n\
    \n## 1.5 回调中的异常\n\n你是否注意到我们的 SQL 回调顶部的这行代码？\n\n```\nif (err) throw err;\n```\n\
    \n这在 Node 世界中是非常常见的惯用写法。（浏览器类库倾向于遵循 jQuery 的做法，使用单独的回调来处理错误。）但是抛出错误之后到底发生了什么？让我们来运行一个测试：\n\
    \n```\nsetTimeout(function A() {\n  setTimeout(function B() {\n    setTimeout(function\
    \ C() {\n      throw new Error('Something terrible has happened!');\n    }, 0);\n\
    \  }, 0);\n}, 0);\n```\n\n运行这段代码，你会发现堆栈跟踪异常简短：\n\n```\nError: Something terrible\
    \ has happened!\n    at Timer.C (/AsyncJS/nestedErrors.js:4:13)\n```\n\n等一下——A\
    \ 和 B 去哪了？为什么它们不在堆栈跟踪中？因为它们不在调用栈上。A 和 B 已经执行完毕，C 是直接从事件队列中运行的。\n\n这会使 JavaScript\
    \ 的堆栈跟踪变得非常令人困惑。如果在我们的 SQL 示例中我们抛出 `err`，堆栈跟踪将只包含 SQL 库和我们回调中的函数与行号。它无法提供关键的上下文信息：查询是从哪里发起的？\n\
    \n一个常见的新手错误是在异步代码周围放置 `try...catch` 块。例如：\n\n```\ntry {\n    checkPassword(username,\
    \ passwordGuess, matchHandler);\n} catch (e) {\n    console.log(e);\n}\n```\n\n\
    你看出问题了吗？如我们所定义的 `checkPassword` 本身永远不会抛出错误。只有**嵌套在其中**的异步回调才会抛出错误。而该回调仅出于作用域目的才与\
    \ `checkPassword` 有关。试图在异步回调周围放置 `try...catch` 块是毫无意义的。这就是为什么 Node 回调几乎总是将错误作为第一个参数。\n\
    \n## 未捕获的异常\n\n当我们从回调中抛出异常时，由运行回调的代码负责捕获它。如果它没有捕获，则由运行时处理。现代浏览器通常会在开发者控制台中记录错误并返回事件队列，不过这种行为可以通过将处理程序附加到\
    \ `window.onerror` 来使用\"全局捕获\"进行覆盖。\n\nNode 中与 `window.onerror` 等效的是全局 `process`\
    \ 对象的 `'uncaughtException'` 事件：\n\n```\nprocess.on('uncaughtException', function\
    \ (err) {\n    console.log(err); // shutdown averted.\n});\n```\n\n通常情况下，Node\
    \ 应用在遇到未捕获的异常时会立即退出。但只要存在至少一个 `uncaughtException` 处理程序，应用就会简单地返回事件队列。Node 服务器通常使用这种方式，使\
    \ `throw` 变得安全。这样做的缺点是它不够透明：当你抛出一个异常时，它可能会触发你应用程序中任何模块注册的任意数量的 `uncaughtException`\
    \ 处理程序。使用 `return log(err);` 而不是 `throw err` 会让人更清楚地了解 `err` 的最终命运。\n\n一些 JavaScript\
    \ 开发者，特别是 Isaac Schlueter，更广泛地认为 try/catch 是一种反模式。⁵ 他希望 `throws` 仅用作断言，在出现异常行为时将程序终止。\n\
    \n**记住：** 异常严格存在于同步世界中。当你到达事件队列时，调用栈会被重置。每一段堆栈跟踪都是一条不间断的阻塞代码链。\n\n## 1.6 驯服 JavaScript\
    \ 的工具\n\n本书的其余部分关注的是在纯 JavaScript 中处理事件的库和设计模式。但在继续之前，你应该了解一些替代方案，我将在此简要介绍。\n\n\
    ⁵ https://groups.google.com/forum/#!topic/nodejs/1E5ssslxrrU\n\n### ES6 和 Task.js\n\
    \nECMAScript 6（目前仍在制定中，但在 Firefox 中可用）添加了一个名为 **generators（生成器）** 的新特性。生成器是包含\
    \ `yield` 关键字的函数，允许你以一种只阻塞生成器本身的方式运行异步函数，从而无需回调。生成器本身理解起来有些棘手，但一个名为 Task.js[^1]\
    \ 的 Mozilla 项目通过提供基于 Promise 的标准 API 使它们更易使用。（Promise 将是后续章节的主题。）\n\n这可能就是 JavaScript\
    \ 的未来。不幸的是，规范要正式发布还需要一段时间，全世界的每个浏览器都支持生成器更是需要数年时间……\n\n### TameJS\n\nOkCupid 的优秀程序员们创建了一个巧妙的预编译器[^2]，拥有超过\
    \ 500 个 GitHub 关注者，它为 JavaScript 添加了两个关键字：`await` 和 `defer`。`await` 块的作用类似于生成器，定义的代码不会返回，直到用\
    \ `defer` 定义的每个异步任务都已完成。\n\nTame.js 团队还创建了一个具有 `await`/`defer` 功能的 CoffeeScript\
    \ 分支，名为 IcedCoffeeScript[^3]。\n\n### StratifiedJS\n\nStratifiedJS 是 `yield` 范式的替代方案，提供了更细粒度的控制结构，具有直观的名称如\
    \ `waitfor` 和 `resume`。虽然没有被广泛使用，但它获得了 jQuery 创建者 John Resig 等人的赞誉。其创建者 Oni Labs\
    \ 对它有着雄心勃勃的计划。\n\n请注意，StratifiedJS 是规范的名称，而非实现的名称。官方参考实现称为 Oni Apollo[^4]。\n\n\
    ### Kaffeine\n\n如果你难以理解 `yield`/`await`，Kaffeine 提供了简单的语法糖：只需在异步函数名后添加 `!`。Kaffeine\
    \ 假设该函数将回调作为最后一个参数，并简单地将该函数调用后的所有代码转换为回调。例如：\n\n```\nvar sleep = function(delay,\
    \ callback) { setTimeout(callback, delay); }\nconsole.log('Wait a second...');\n\
    sleep(1000)\nconsole.log('OK, that was one second.');\n```\n\n虽然它的追随者不如 CoffeeScript\
    \ 多，但这样的特性使得 Kaffeine 值得一试。\n\n### Streamline.js\n\n与 Kaffeine 类似，Streamline.js\
    \ 允许你使用特殊语法将异步函数视为同步函数：只需用 `_` 代替回调。有趣的是，Streamline 可以生成标准的基于回调的 JavaScript 代码，也可以生成用于\
    \ node-fibers（见下文）的基于纤维的代码。另外，与大多数其他 JavaScript 预编译器不同，Streamline 可以与 CoffeeScript\
    \ 配合使用。\n\n请注意，Kaffeine 和 Streamline 都依赖于回调遵循参数列表约定（`err, results...`），这在 Node\
    \ 世界中无处不在，但在浏览器中不太常见。\n\n### node-fibers\n\n虽然上述其他项目仅编译为普通 JavaScript，但 node-fibers\
    \ 实际上扩展了 Node.js 运行时所理解的语言，添加了称为 fibers 的类似线程的构造。node-fibers 相对于 JS 预编译器的主要优势在于调试。node-fibers\
    \ 堆栈跟踪中的行号与 node-fibers 源代码中的行号相对应，从 fibers 中抛出的异常比从异步回调中抛出的异常表现得好得多。\n\n这是一个非常酷的项目，拥有少量但热情的追随者。但要注意，它并不总是能与主流\
    \ Node 工具良好配合。\n\n在本章中，我们了解了 JavaScript 的单线程特性如何既是祝福又是诅咒。在适当的人手中，它能产出优美的代码，免受困扰多线程应用的可怕竞态条件之苦。但你需要培养正确的思维方式——以及正确的技术。\n\
    \n在此值得一提的是，JavaScript 中有一种多线程形式：你可以生成 worker 进程。每个生成的进程可以在与其他 I/O 相同的限制下与其他进程交换数据。这使得利用多核成为可能，同时不违反\
    \ JavaScript 的正常规则（代码不能被中断；变量只能在其作用域内访问）。关于 workers 的更多内容，请跳转到本书的倒数第二章。\n\n在下一章中，我们将讨论如何组织和堆叠事件回调。如果我们做得好，我们的异步应用应该拥有你能想到的尽可能多的回调——每一个都有清晰而单一的用途。\n\
    ```\n"
