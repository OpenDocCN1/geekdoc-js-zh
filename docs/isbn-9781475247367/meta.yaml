  md: "# # 1 The JavaScript Event Model\n\nEvents. How do they work? Confusion about\
    \ JavaScript's event model is as old as JavaScript itself. Particularly for programmers\
    \ coming to JavaScript from multi-threaded languages like Java and Ruby, situations\
    \ like this are utterly mystifying:\n\n```\nfor (var i = 1; i <= 3; i++) {\n \
    \ setTimeout(function(){ console.log(i); }, 0);\n};\n\n4\n4\n4\n```\n\nIn this\
    \ chapter, we'll take a tour of JavaScript's asynchronous mechanisms and dispel\
    \ some common misconceptions. Once we're on solid ground, we'll take a brief look\
    \ at some precompilers and alternative runtimes that can make async JS code more\
    \ human-friendly.\n\n# ## 1.1 Now or later\n\nLet's start by explaining the `setTimeout`\
    \ example above. Most JavaScript newcomers would expect the loop to produce the\
    \ output 1, 2, 3, or perhaps a random shuffle of those three numbers as the three\
    \ timeouts (each scheduled to go off in 0 milliseconds) race to fire first. To\
    \ understand why the output is 4, 4, 4 instead, there are three things you need\
    \ to know:\n\n+   1. There's only one variable i, scoped by the declaration var\
    \ i.\n2. After the loop, i === 4.\n3. JavaScript events are blocked until the\
    \ thread is free.\n\nThe first two concepts are in the realm of JavaScript 101,\
    \ but the third may sound foreign. When I first came to JavaScript, I didn't quite\
    \ believe all this “blocking” business. Java had trained me to fear that my code\
    \ could be interrupted at any moment. A million edge cases occupied the back of\
    \ my mind as I wondered, “What if a rare event happened between these two lines\
    \ of code?” And then one day, I realized that I was free. Here is the code that\
    \ liberated me:"
  merge: -1
  pgno: 12
- img_proc: true
  md: "```\nvar start = new Date();\nsetTimeout(function(){\n    var end = new Date();\n\
    \    console.log('Time elapsed:', end - start, 'ms');\n}, 500);\nwhile (new Date()\
    \ - start < 1000) {}\n```\n\nIn my multi-threaded mindset, I'd expected only 500ms\
    \ to go by before the timed function ran. But that would require the loop, designed\
    \ to last 1000ms, to be interrupted. Instead, if you run this snippet, you'll\
    \ get the output\n\nTime elapsed: 1002ms\n\n(give or take a couple of milliseconds—setTimeout\
    \ and setInterval are, alas, a lot less precise than you'd hope, particularly\
    \ in older browsers).\nSo, what's setTimeout really doing?\n\n# Meet the queue\n\
    \nWhen we call setTimeout, a timeout event is *queued*. Only when our JavaScript\
    \ code has finished running does the runtime ask, “OK, what’s on the queue?” If\
    \ there’s at least one event on the queue that’s eligible to “fire” (like a 500ms\
    \ timeout that was set 1002ms ago), the runtime picks one and calls its “handler”\
    \ (e.g. the function we passed in to setTimeout). When that handler returns, we\
    \ go back to the queue.\n\nInput events work the same way: When a user clicks\
    \ a DOM element that you’ve attached a click handler to, the click event is queued.\
    \ But the event won’t fire until after any running code has finished. When a web\
    \ page stops responding to your input, this is usually the reason. (See the next\
    \ section for an example.)\n\nSometimes the term “event loop” is used to describe\
    \ how the runtime works. It’s as if your code were being run from a loop that\
    \ looks like this:\n\n```\nrunYourScript();\nwhile (atLeastOneEventIsQueued) {\n\
    \    fireNextQueuedEvent();\n}\n```\n\nOne implication of this is that each event\
    \ that fires will be at the root of the stack trace. More on that later in the\
    \ chapter.\n\n**To summarize:** Events can be *queued* while code is running,\
    \ but they can’t *fire* until the runtime is free."
  merge: -1
  pgno: 13
- img_proc: true
  md: "The JavaScript Event Model\n\n3\n\n# Details, details\n\nYou might be wondering\
    \ exactly how the runtime decides which queued events to fire when. Unfortunately,\
    \ the specifics vary from one JavaScript environment to another, even among modern\
    \ web browsers. I've set up a jsFiddle example to illustrate this.³ The HTML consists\
    \ of a single link with the id masochist, and the code is this:\n\n```\nvar clickCount\
    \ = 0, link;\nlink = document.getElementById('masochist');\nlink.innerHTML = 'How\
    \ many times can you click me?';\nlink.onclick = function(){\n    clickCount++;\n\
    \    link.onclick = function(){ clickCount++; };\n\n    start = new Date();\n\
    \    while (new Date() - start < 5000) {}\n    console.log(clickCount); // this\
    \ will always be 1\n\n    setTimeout(function(){\n        link.innerHTML = 'You\
    \ clicked me ' + clickCount + ' times. Ow!';\n    }, 0);\n};\n```\n\nTry loading\
    \ this into your favorite browser and clicking the link as many times as you can\
    \ in 5 seconds. You'll get very different results depending on the browser you\
    \ use.\n\nIn Chrome, even though the browser is essentially frozen for those 5\
    \ seconds after the first click (due to the while loop), you'll still get an accurate\
    \ count of the number of clicks. The count would be 0 if the setTimeout ran before\
    \ the loop, because the old timeout would be given higher priority on the event\
    \ queue than the newer click events.\n\nIn Firefox, the timeout fires before any\
    \ of the click events, which are dispersed over time. If you raise the delay from\
    \ 0ms to 200ms, you'll see a couple of your clicks. Raise it to 300ms, and you'll\
    \ see a couple more.\n\nNotice that console.log line? If you look at the console,\
    \ you'll see just a single 1 no matter how many times you click the link. I added\
    \ that to illustrate the distinction between events and handlers: The original\
    \ click handler isn't called until all of the click events have been queued. It\
    \ then attaches a new handler, replacing itself. When the remaining queued click\
    \ events fire, the runtime calls the new handler.\n\nOf course, these details\
    \ tend not to matter when you're doing event-driven JavaScript properly. Ensuring\
    \ that your code doesn't contain a while loop that runs for 5 seconds is a good\
    \ first step.\n\n³http://jsfiddle.net/TrevorBurnham/GCbHm/"
