  md: 'The caveat is that we have to make those changes with the model''s set method,
    and retrieve values with get:


    ```

    style.set({font: ''Palatino''});  // triggers alert

    style.get(''font'');

    ```


    Evented models have become a huge sensation in the last couple of years, with
    the rise of MVC frameworks like Backbone. Old-school JavaScript made changes to
    the DOM directly from input event handlers. New-school JavaScript makes changes
    to models, which then emit events that cause the DOM to update. In all but the
    smallest apps, this separation of concerns makes functionality much easier to
    keep track of.


    Plus, Backbone models make syncing with the server via Ajax a breeze:


    ```

    hello.save();      // sends the model to the server

    goodbye.fetch();   // updates the model from the server

    ```


    Backbone was developed by the fine folks at DocumentCloud as they were building
    a web-based document search tool of the same name.⁵ When a user enters a query
    in DocumentCloud, the server runs a full-text search of thousands of scanned documents,
    and within seconds they get titles, thumbnails, metadata and excerpts from the
    first page of results. The user can switch between a grid view and a list view,
    or even a timeline visualization. They can also add notes and see notes that other
    users have added. It''s a very impressive JavaScript app, and it''s hard to imagine
    it existing without Backbone''s capabilities.


    # Propagating model events


    Typically, Backbone models are organized into *collections*, which are essentially
    evented arrays: You can listen for when models are added and removed to them.
    Additionally, Backbone collections propagate events from the models they contain.
    For example, you might have a spriteCollection object containing hundreds of models
    representing things that you''re drawing on a canvas element. Each time any of
    those sprites changes, you need to redraw the canvas. Rather than attaching the
    redraw function as a handler for the change event on each sprite individually,
    you could instead just write


    ```

    spriteCollection.on(''change'', redraw);

    ```


    Note that this automatic propagation only goes one level down. Backbone has no
    notion of a "collection of collections." However, it''s easy to propagate events
    manually. Let''s say that we wanted to break up spriteCollection into several
    pieces, one for each of dozens of kinds of sprites. We could add each of those
    collections to a model, spriteCollectionSet, created like so:


    ⁵ http://www.documentcloud.org/public/search/'
