  md: "$(link)\n    .bind('click', clickHandler1)\n    .bind('click', clickHandler2);\n\
    \n(In jQuery 1.7+, the new on syntax<sup>1</sup> is preferred over bind. There's\
    \ also the click(...) method, which is a shorthand for bind('click', ...); however,\
    \ I prefer to consistently use the more powerful bind/on.)\n\nFrom a software\
    \ architecture perspective, jQuery is publishing the link element's events to\
    \ anyone who wants to subscribe. Hence the term \"PubSub.\"\n\nWith the lesson\
