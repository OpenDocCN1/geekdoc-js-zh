  md: '# 1.2 When is a function async?


    The term *async function* is a bit of a misnomer, since JavaScript code itself
    is always synchronous. If you call a function, your program simply won''t continue
    until that function returns. What I mean by "async function" is one that takes
    another function (a *callback*) that won''t run until we reach the event queue.
    So an async function will never fail this test:


    ```

    var a = false;

    asyncFunction(function() { console.assert(a, ''a should be true''); })

    a = true;

    ```


    We saw that `setTimeout` passes this test even when the delay passed to it is
    0.


    Another term for async functions is **non-blocking**. This emphasizes how speedy
    they usually are: A SQL query made with an async MySQL driver may take an hour,
    but the function that made the query will return in less than a millisecond—a
    boon to web servers that need to process several incoming requests at once.


    Typically, the callback is given as the last argument to the function. (Regrettably,
    the venerable `setTimeout` and `setInterval` are exceptions to this convention.)
    But some async functions take callbacks indirectly, by returning a Promise or
    using an EventEmitter. We''ll learn about these patterns in the next few chapters.


    Unfortunately, the only way to be sure whether a function is async or not is to
    look at its source code (and, potentially, the source code of every function it
    calls in turn). Some functions that are synchronous have an API that looks async,
    either because they might become async in the future or because callbacks provide
    a nice way to return multiple arguments. When in doubt, don''t depend on a function
    being async.


    # Maybe async, maybe not


    Some functions are async sometimes, but not others. For instance, jQuery''s eponymous
    function (typically aliased as `$`) can be used to delay a function until the
    DOM has finished loading. But if the DOM has already finished loading, there''s
    no delay; the callback fires immediately.


    Likewise, jQuery''s Promises (a great feature, added in version 1.5, that we''ll
    be covering in a later chapter) allows you to add callbacks both before and after
    a task, such as an Ajax call, has finished. If the callback is added after, it
    fires immediately.


    These "maybe-async" functions can get you in a lot of trouble if you''re not careful,
    because you can''t count on code that runs after the function being run before
    the callback:


    ```

    var h1FontSize;

    $(function() {

    ```'
