    \n上面代码的最大问题是它过于集中。*所有*响应菜单点击的操作都放在点击处理程序中，*所有*响应 Ajax 请求的操作都放在 Ajax 响应处理程序中。我们需要以合理的方式将这些分散开来。\n\
