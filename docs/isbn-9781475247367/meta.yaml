    \ very name—has an `async` option that can (but *should never, ever*) be set to\
    \ false.\n\nNode's input functions are largely non-blocking, but a few have synchronous\
    \ alternatives suffixed with `Sync`. For instance, you can use `readFileSync`\
    \ instead of `readFile`. These aren't always a bad option; there's nothing wrong\
    \ with using `readFileSync` to load a web server's configuration on startup, for\
    \ instance. On the other hand, if you wanted to automatically reload that configuration\
    \ file every five seconds, using `readFileSync` instead of `readFile` could dramatically\
    \ reduce the server's performance. Using synchronous I/O methods in non-trivial\
    \ Node apps is a nasty habit.\n\n## Async output\n\nOutput from JavaScript is\
    \ almost always async. For instance, you can update the DOM as much as you want\
    \ from a long block of code, but the user won't see any changes until you return\
    \ to the event queue. Implicitly, any change you make queues a \"redraw\" event.\n\
    \nEven the ubiquitous `console.log` is async in some environments. In WebKit-based\
    \ browsers (Chrome and Safari), this code will log `{foo: bar}`:\n\n```\nvar obj\
