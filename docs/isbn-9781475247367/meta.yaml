  md: 'So to recap: A Promise takes three kinds of callbacks: `done`, `fail`, and
    `progress`. `done` callbacks run when the Promise resolves, `fail` callbacks run
    when it''s rejected, and `progress` callbacks run whenever `notify` is called
    on a pending Deferred.


    # Binding multiple callbacks with `then`


    If you want to bind more than one kind of callback at once, there''s a handy shortcut
    method: `then`. Calling


    ```

    `promise.then(doneCallback, failCallback, progressCallback);`

    ```


    is equivalent to


    ```

    `promise`

    `.done(doneCallback);`

    `.fail(failCallback);`

    `.progress(progressCallback);`

    ```


    `then`, `done`, `fail`, and `progress` all simply return the object they''re attached
    to, as jQuery methods tend to.


    (As we''ll see later, the meaning of `then` is one of the key differences between
    jQuery Promises and the Promises/A spec.)


    # 3.5 Animation Promises


    So far, we''ve seen how jQuery''s Ajax methods return Promises, and we''ve seen
    how you can make your own with `$.Deferred`. But jQuery 1.6+ provide one more
    source of Promises: ordinary jQuery objects. When you call


    ```

    `$(''#elem'').promise()`

    ```


    you get a Promise representing `$(''#elem'')`''s animation queue. When all animations
    on `$(''#elem'')` have completed, the Promise is resolved. The Promise will be
    resolved whether the animations completed naturally, or if `stop()` was called,
    or if there were no pending animations in the first place. In short, animation
    Promises never fail.


    Animation Promises make it easy to find out when animations on several different
    elements have finished:'
  merge: -1
  pgno: 40
- img_proc: true
  md: "```\n$('#header').slideDown('slow');\n$('#notification').fadeIn('fast').fadeOut('fast').fadeIn('fast');\n\
    $('#header, #notification').promise().done(function() {\n  // all of the above\
    \ effects have run\n});\n```\n\nAs we'll see in the next section, $.when provides\
    \ an even more versatile way of achieving the same goal.\n\n# ## 3.6 Combining\
    \ Promises with when\n\nThe existence of progress notifications doesn't change\
    \ the fact that, ultimately, every Promise is either resolved or rejected. (Or,\
    \ it remains forever pending.) But why? Why not let Promises change to any state\
    \ at any time?\n\nMainly, because programmers *thrive* on binary. We know exactly\
    \ how to put 1s and 0s together to perform astounding feats of logic. That's a\
    \ big reason why Promises are so powerful: **Promises let us see concurrent tasks\
    \ as booleans.**\n\nThe most common use case for logically combining Promises\
    \ is finding out when a set of async tasks have finished. Let's say that you're\
    \ showing a tutorial video while loading a game from the server. You want to start\
    \ the game as soon as two things have happened, in any order:\n\n+   1. The tutorial\
    \ video has ended\n2. The game is loaded\n\nGiven a Promise representing each\
    \ of these processes, your task is to start the game when both Promises are resolved.\
    \ Enter jQuery's when method:\n\n```\nvar gameReadying = $.when(tutorialPromise,\
    \ gameLoadedPromise);\ngameReadying.done(startGame);\n```\n\nwhen acts as a logical\
    \ AND for Promise resolution: The Promise it generates is resolved as soon as\
    \ all of the given Promises are resolved, or rejected as soon as any one of the\
    \ given Promises is rejected. An excellent use case for when is combining multiple\
    \ Ajax calls. If you need to make two POST calls at once and get a notification\
    \ when both have succeeded, there's no need to define a separate callback for\
    \ each request:\n\n```\n$.when($.post('/1', data1), $.post('/2', data2))\n .then(onPosted,\
    \ onFailure);\n```"
  merge: -1
  pgno: 41
- img_proc: true
  md: "On success, when can get access to the callback arguments from each of its\
    \ constituent Promises, but doing so is tricky: They're passed as a list of arrays,\
    \ in the same order that the Promises were passed in to when. (Amend that: A Promise's\
    \ callback arguments are only represented as an array if it emits more than one\
    \ value, as $.post does. See \"Passing non-Promises\" for examples.) So to get\
    \ all of the callback arguments from all of the Promises given to $.when, we'd\
    \ start with something like this:\n\n```\n$.when(promise1, promise2, promise3)\n\
    \  .done(function(promise1args, promise2args, promise3args) {\n      // ...\n\
    \  });\n```\n\nParsing lists of arrays is a nightmare. Don't do it if you don't\
    \ have to. If you want to GET data from two sources, for example, attach callbacks\
    \ directly to the individual GET promises rather than trying to do everything\
    \ from the when callback:\n\n```\nvar serverData = {};\nvar getting1 = $.get('/1')\n\
    \  .done(function(result) {serverData[1] = result;});\nvar getting2 = $.get('/2')\n\
    \  .done(function(result) {serverData[2] = result;});\n$.when(getting1, getting2)\n\
    \  .done(onServerDataLoaded);\n```\n\n# Passing non-Promises\n\n$.when, and other\
    \ jQuery methods that take Promises, allow you to pass in non-Promises. These\
    \ are treated like Promises that have resolved with the given value in the corresponding\
    \ argument slot. For instance,\n\n```\n$.when('foo')\n```\n\nwill give you a Promise\
    \ that immediately resolves with the value 'foo';"
  merge: -1
  pgno: 42
- img_proc: true
  md: "will give you a Promise that immediately resolves with the values 'test' and\
    \ [1, 2, 3]. (Remember, when a Deferred passes multiple arguments to resolve,\
    \ those arguments are coerced to an array by `$.when`.)\n\nThis raises the question:\
    \ How does `$.when` know whether an argument is a Promise or not? It turns out\
    \ that jQuery just checks for a `promise` method, and uses the value returned\
    \ by that method. A Promise's `promise` method simply returns itself.\n\nAs you'll\
    \ recall from the section on animation Promises, jQuery objects also have a `promise`\
    \ method, which means that `$.when` \"coerces\" jQuery objects into their animation\
    \ Promises. So if we want to create a Promise that will resolve when we've fetched\
    \ some data and the `#loading` animation has completed, all we have to do is write\n\
    \n```\nvar fetching = $.get('/myData');\n$.when(fetching, $('#loading'));\n```\n\
    \nJust rememeber that we have to do this *after* starting the animation. If `#loading`'s\
    \ animation queue is empty, its Promise resolves immediately.\n\n# Other logical\
    \ operations\n\nSince `$.when` is a logical AND, you might be wondering: Is there\
    \ a logical OR for jQuery Promises? What about NOT?\n\nThe answer is no, not out\
    \ of the box. But it's trivial to write these ourselves. Let's start with NOT:\n\
    \n```\nfunction not(promise) {\n    var result = new $.Deferred();\n    promise.done(result.reject);\n\
    \    promise.fail(result.resolve);\n    return result;\n}\n```\n\nIf you've ever\
    \ taken a class on logic, you'll know that OR can be defined in terms of AND and\
    \ NOT like so:\n\n```\nfunction or() {\n    var promises = Array.prototype.slice.call(arguments);\n\
    \    var negatedPromises = promises.map(not);\n    return not($.when.apply(this,\
    \ negatedPromises));\n}\n```\n\nHere's a short proof:"
  merge: -1
  pgno: 43
- img_proc: true
  md: "+   1. When a Promise passed to or is resolved, its negation will be rejected,\
    \ as will the Promise returned by $.when, and thus the Promise returned by or\
    \ will be immediately resolved.\n\n+   2. When all of the Promises passed to and\
    \ are rejected, their negations will all be resolved, as will the Promise returned\
    \ by $.when, and thus the Promise returned by or will be rejected.\n\nCool, right?\
    \ These idioms aren't as broadly useful as $.when, but they do show how easy it\
    \ is to work with Promises as booleans.\n\n# ## 3.7 Binding to the future with\
    \ pipe\n\nPart of the reason that performing a series of async tasks is often\
    \ inconvenient in JavaScript is that you can't attach handlers to the second task\
    \ until the first one is complete. As an example, let's GET data from one URL,\
    \ then POST it to another:\n\n```\nvar getPromise = $.get('/query');\ngetPromise.done(function(data)\
    \ {\n  var postPromise = $.post('/search', data);\n});\n// Now we'd like to attach\
    \ handlers to postPromise...\n```\n\nDo you see what the problem is here? We can't\
    \ bind callbacks to postPromise until our GET operation is done, because it doesn't\
    \ exist yet! It's created by a $.post call that we can't make until we have the\
    \ data that we're getting asynchronously from the $.get call.\n\nThat's why jQuery\
    \ 1.6 added the pipe method to Promises. Essentially, pipe says: \"Give me a callback\
    \ for this Promise, and I'll give you a Promise that represents the result of\
    \ that callback.\"\n\n```\nvar getPromise = $.get('/query');\nvar postPromise\
    \ = getPromise.pipe(function(data) {\n  return $.post('/search', data);\n});\n\
    ```\n\nLooks like dark magic, right? Here's a breakdown: pipe takes the same three\
    \ arguments as then, one for each type of callback: done, fail, and progress.\
    \ So in this example, we just provided a callback that gets run when getPromise\
    \ is resolved. The pipe method returns a new Promise that's resolved/rejected\
    \ when the Promise returned from our callback is resolved/rejected. Effectively,\
    \ pipe is a window into the future.\n\nYou can also use pipe to \"filter\" a Promise\
    \ by modifying callback arguments. If a pipe callback returns something other\
    \ than a Promise/Deferred, then that value becomes the callback argument. For\
    \ instance, if you have a Promise that emits progress notifications with a number\
    \ between 0 and 1, you can use pipe to create an identical Promise that emits\
    \ progress notifications with a human-readable string instead:"
  merge: -1
  pgno: 44
- img_proc: true
  md: "```\nvar promise2 = promise1.pipe(null, null, function(progress) {\n  return\
    \ Math.floor(progress * 100) + '% complete';\n});\n```\n\nTo summarize, there\
    \ are two things you can do from a pipe callback:\n\n+   1. If you return a Promise,\
    \ the Promise returned by pipe will mimic it.\n2. If you return a non-Promise\
    \ value (or nothing), the Promise returned by `pipe` will immediately be resolved,\
    \ rejected, or notified with that value, according to what just happened to the\
    \ original Promise.\n\npipe's rule for whether something is a Promise or not is\
    \ the same as `$.when`'s: If it has a promise method, that method's return value\
    \ is used as a Promise representing the original object. Again, promise.promise()\
    \ === promise.\n\n# Pipe cascading\n\npipe doesn't require you to provide every\
    \ possible callback. In fact, you'll usually just want to write\n\n```\nvar pipedPromise\
    \ = originalPromise.pipe(successCallback);\n```\n\nor\n\n```\nvar pipedPromise\
    \ = originalPromise.pipe(null, failCallback);\n```\n\nWe've seen what happens\
    \ when the original Promise succeeds in the first case, or fails in the second\
    \ case, so that the piped Promise's behavior depends on the return value of successCallback\
    \ or failCallback. But what about when we haven't given pipe a callback for what\
    \ the original Promise does?\n\nSimple: The piped promise mimics the original\
    \ Promise in those cases. We can say that the original Promise's behavior cascades\
    \ through the piped Promise. This cascading is very handy, because it allows us\
    \ to define branching logic for async tasks with minimal effort. Suppose we have\
    \ a three-step process:\n\n```\nvar step1 = $.post('/step1', data1);\nvar step2\
    \ = step1.pipe(function() {\n  return $.post('/step2', data2);\n});\nvar lastStep\
    \ = step2.pipe(function() {\n  return $.post('/step3', data3);\n});\n```"
  merge: -1
  pgno: 45
- img_proc: true
  md: "Here, lastStep will resolve only if all three Ajax calls succeed, and it'll\
    \ be rejected if *any* of the three fail. If we only care about the process as\
    \ a whole, we can omit the variable declarations for the earlier steps:\n\n```\n\
    var posting = $.post('/step1', data1)\n  .pipe(function() {\n    return $.post('/step2',\
    \ data2);\n  })\n  .pipe(function() {\n    return $.post('/step3', data3);\n \
    \ });\n```\n\nWe could, equivalently, nest the second pipe inside of the other:\n\
    \n```\nvar posting = $.post('/step1', data1)\n  .pipe(function() {\n    return\
    \ $.post('/step2', data2)\n      .pipe(function() {\n        return $.post('/step3',\
    \ data3);\n      });\n  });\n```\n\nOf course, this brings us back to the Pyramid\
    \ of Doom. You should be aware of this style, but as a rule, try to declare your\
    \ piped Promises individually. The variable names may not be necessary, but they\
    \ make the code far more self-documenting.\n\nThat concludes our tour of jQuery\
    \ Promises. Now let's take a quick look at the major alternative: The CommonJS\
    \ Promises/A spec and its flagship implementation, Q.js.\n\n# ## 3.8 jQuery vs.\
    \ Promises/A\n\nIn terms of capabilities, jQuery Promises and Promises/A are basically\
    \ equivalent. They can be mapped to one another. The key differences are superficial:\
    \ They use the same words to mean different things.\n\nThe most obvious difference\
    \ is that the then method in faithful Promises/A implementations like Q.js returns\
    \ a *new* Promise that represents the eventual return value of the success/failure\
    \ handler. It's a lot like jQuery's pipe method.\n\nAnother big difference, previously\
    \ mentioned, is that jQuery uses the term \"resolve\" as the opposite of \"fail,\"\
    \ whereas Promises/A uses \"fulfill.\" Under Promises/A, a Promise is said to\
    \ be \"resolved\" when it's either fulfilled or failed."
  merge: -1
  pgno: 46
- img_proc: true
  md: "There are other, subtler differences as well. For instance: In Promises/A,\
    \ whether a Promise returned then is fulfilled or rejected depends on whether\
    \ the invoked callback returns a value or throws an error. (Throwing errors from\
    \ jQuery Promise callbacks is a bad idea, as they'll go uncaught.)\n\nBecause\
    \ of these issues, you should avoid interacting with multiple Promise implementations\
    \ in the same project. If you're just getting Promises from jQuery methods, use\
    \ jQuery Promises. If you're using another library that gives you CommonJS Promises,\
    \ adopt Promises/A. If you're using both, Q.js makes it easy to \"assimilate\"\
    \ jQuery Promises:\n\n```\nvar qPromise = Q.when(jqPromise);\n```\n\nAs long as\
    \ these two standards remain divergent, this is the best way to make them play\
    \ nice together. For more information, see the Q.js docs⁵.\n\n# ## 3.9 Replacing\
    \ callbacks with Promises\n\nWhen we interact with an ordinary async function,\
    \ we can represent its completion with a Promise by passing a Deferred's resolve\
    \ method as the callback:\n\n```\nvar timing = new $.Deferred();\nsetTimeout(timing.resolve,\
    \ 500);\n```\n\nWhen an API takes both a success and a failure callback, we can\
    \ pass resolve and reject as those callbacks. When an API follows the Node convention\
    \ of passing an error as the first argument to the callback, we can invoke resolve\
    \ or reject depending on the existence of that argument. For example:\n\n```\n\
    var fileReading = new $.Deferred();\nfs.readFile(filename, 'utf8', function(err)\
    \ {\n  if (err) {\n    fileReading.reject(err);\n  } else {\n    fileReading.resolve(Array.prototype.slice.call(arguments,\
    \ 1));\n  };\n});\n```\n\n(Yes, you can use jQuery from Node. Just npm install\
    \ jquery and use it like any other module. Or you can use Q.js or Futures, as\
    \ previously mentioned.)\n\nWriting this out routinely would be a drag, so why\
    \ not make a utility function to generate a Node-style callback from any given\
    \ Deferred?"
  merge: -1
  pgno: 47
- img_proc: true
  md: "# Promises and Deferred\n\n```\ndeferredCallback = function(deferred) {\n \
    \ return function(err) {\n    if (err) {\n      deferred.reject(err);\n    } else\
    \ {\n      deferred.resolve(Array.prototype.slice.call(arguments, 1));\n    };\n\
    \  };\n}\n```\n\nWith that, we can write the above example as\n\n```\nvar fileReading\
    \ = new $.Deferred();\nfs.readFile(filename, 'utf8', deferredCallback(fileReading));\n\
    ```\n\nIn Q.js, Deferreds come with a node method for this right out of the box:\n\
    \n```\nvar fileReading = Q.defer();\nfs.readFile(filename, 'utf8', fileReading.node());\n\
    ```\n\nIn my opinion, Promises are one of the most exciting features to be added\
    \ to jQuery in years. Not only are they a big help in smoothing out the callback\
    \ spaghetti that characterizes typical Ajax-rich apps, but they also make it much\
    \ easier to coordinate async tasks of all kinds.\n\nUsing Promises takes some\
    \ practice, especially when using pipe (or CommonJS' then), but it's a habit well\
    \ worth developing. You'll be peering into the future of JavaScript.\n\nJust as\
    \ this book went into production, Microsoft announced that Windows 8's Metro environment\
    \ will have a Promise-based JavaScript API.⁶ Where hipster devs and Microsoft\
    \ both go, the rest of the world is bound to follow.\n\n⁶http://msdn.microsoft.com/en-us/library/windows/apps/hh464930.aspx"
