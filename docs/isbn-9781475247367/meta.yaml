    \ So if several models need to be updated at once, a good approach is to set them\
    \ silently, then call their `change` methods only after they’re in a consistent\
    \ state.\n\n# 2.3 Custom jQuery events\n\nCustom events are an underappreciated\
    \ feature of jQuery that make it easy to graft a powerful distributed event system\
    \ onto any web app, with no additional libraries. You can emit any event you want\
    \ from any DOM element from jQuery using `trigger`:"
  - "[PAGE 31]\n\n# Distributed Events\n\n```\n$('#ozzy, #sten').on('meow', function()\
    \ {\n  console.log(this.id + ' meowed');\n});\n$('#ozzy').trigger('meow');  //\
    \ \"ozzy meowed\"\n$('#sten').trigger('meow');  // \"sten meowed\"\n```\n\nIf\
    \ you've worked with DOM events before, you're no doubt familiar with *bubbling*:\
    \ Whenever a element emits an event (such as a `'click'`), its parent then emits\
    \ the event, then its grandparent, and so on up to the root element, `document`—unless\
    \ the event's `stopPropagation` method is called at some point along the way.\
    \ (jQuery does for us automatically when we return `false` from a handler). But\
    \ did you know that jQuery's custom events bubble as well? For instance, if we\
    \ have a span named \"soda\" nested in a div named \"bottle,\" the code\n\n```\n\
    $('#soda, #bottle').on('fizz', function() {\n  console.log(this.id + ' emitted\
    \ fizz');\n});\n$('#soda').trigger('fizz');\n```\n\nwill emit the output\n\n```\n\
    soda emitted fizz\nbottle emitted fizz\n```\n\nThis bubbling isn't always desirable,\
    \ as we'll see in the tooltips example below. Fortunately, jQuery offers a non-bubbling\
    \ `triggerHandler` method as well.\n\n# Example: Tooltips\n\nWhen events can be\
    \ mapped intuitively to page elements, jQuery is an ideal way of distributing\
    \ them. For instance, suppose you're writing a tooltip library, and you want only\
    \ one tooltip to be visible at a time. So you might simply add the line\n\n```\n\
    $('.tooltip').remove()\n```"
  - "[PAGE 32]\n\n```\n// $container could be $('#sidebar') or $(document)\n$container.triggerHandler('newTooltip');\n\
    $container.one('newTooltip', $tooltip.remove);\n```\n\n(Notice the use of jQuery’s\
    \ `one` instead of `on`. The difference is that `one` automatically removes the\
    \ handler after it fires.)\n\nWith these two lines of code, each tooltip will\
    \ listen to its container and remove itself when the container gets a new tooltip.\
    \ It’s a beautifully direct, efficient approach that saves us from having to store\
    \ any state or engineer complex selectors (which would slow older browsers to\
    \ a crawl—IE7 and below don’t even have a way of selecting all elements with the\
    \ `tooltip` class without traversing the whole document!).\n\nNote that event\
    \ bubbling would actually have defeated our intent in this case: When we create\
    \ a new tooltip in the sidebar, we only want tooltips listening for the `newTooltip`\
    \ event on the sidebar itself to go away, not those on the surrounding document.\
    \ Always think carefully about whether `trigger` or `triggerHandler` is the right\
    \ tool for the job.\n\n# 2.4 Piping events with LucidJS\n\nAs we’ve seen, there\
    \ are an abundance of options for PubSub. That’s actually a problem, as most apps\
    \ will involve multiple sources of events with subtly different APIs. Wouldn’t\
    \ it be nice if we could unify these emitters and route events cohesively?\n\n\
    Enter LucidJS, a new event library (in fact, it arrived on GitHub just weeks before\
    \ the first publication of this book) that can listen to events from DOM elements\
    \ and jQuery objects. That way, you can “pipe” those events through Lucid’s own\
    \ `EventEmitter`-like objects:\n\n```\n// Sailor Moon fan service\nvar riniEmitter\
    \ = LucidJS.emitter();\nriniEmitter.pipe($('#serenity'));\nriniEmitter.pipe(blackLadyEmitter);\n\
    riniEmitter.on('fight', function() {\n    console.log('Pink sugar heart attack!');\n\
    });\n```\n\nNow whenever the `$('#serenity')` jQuery object or `blackLadyEmitter`\
    \ emits a `fight` event, `riniEmitter` will forward that event to the given handler.\n\
    \nAs PubSub interfaces gain popularity in JavaScript, the `pipe` technique is\
    \ bound to become more common, as it allows events from multiple sources to be\
    \ monitored in one place."
- md: "In this chapter, we learned about distributing events via PubSub, one of the\
    \ most fundamental JavaScript design patterns. The key is to decide which entities\
    \ to distribute events through. We saw that jQuery is excellent for distributing\
    \ events related to changes in the DOM, but using it to distribute events related\
    \ to your application's state is usually a mistake, since changing the page's\
    \ markup later could alter the way that events propagate. That's where frameworks\
    \ like Backbone come to the rescue, allowing you to separate the data hierarchy\
    \ from the way the data is rendered. Some applications, particularly Node servers,\
    \ use a single global PubSub object to connect otherwise isolated modules, enabling\
    \ loose coupling and easy testing. The great thing about PubSub is that when you're\
    \ not subscribing to the events that are being published, it's completely unobtrusive.\
    \ In the next chapter, we'll look at another unobtrusive way of handling events:\
    \ Promises.\n\n## 3 Promises and Deferreds\n\nBack in 2010, I had this conversation\
    \ with my prolific colleague Mr. Ajax:\n\n> **Me:** Hey, would you fetch some\
    \ data from this URL for me, please?\n>\n> **Mr. Ajax:** I'm on it! Just give\
    \ me a *success* callback so I can let you know when I'm done.\n>\n> **Me:** OK,\
    \ here you go. Thanks.\n>\n> **Mr. Ajax:** Oh, and you should give me an *error*\
    \ callback, too. You know, just in case.\n>\n> **Me:** Good point. Anything else?\n\
    >\n> **Mr. Ajax:** Hey, I noticed that there's some code duplication between those\
    \ two callbacks! You could move that into a third *always* callback.\n>\n> **Me:**\
    \ (impatiently) Alright, I'll refactor them. Tell you what: Why don't you run\
    \ now, and I'll give you the callbacks later?\n>\n> **Mr. Ajax:** (irately) What\
    \ do I look like, an EventEmitter?\n\nThankfully, jQuery 1.5 changed Mr. Ajax's\
    \ need-it-now attitude. All of the Ajax functions you know and love now return\
    \ Promises. *A Promise is an object that represents a task with two possible outcomes*\
    \ (success or failure) and holds callbacks that fire when one outcome or the other\
    \ has occurred. For example, under jQuery 1.4, I'd have had to write this:\n\n\
    ```\n$.get('/mydata', {\n  success: onSuccess,\n  failure: onFailure,\n  always:\
    \ onAlways\n});\n```\n\nBut under jQuery 1.5+, I can write this instead:\n\n```\n\
    var promise = $.get('/mydata');\npromise.done(onSuccess);\npromise.fail(onFailure);\n\
    promise.fail(onAlways);\n```\n\nYou might wonder what's so great about this change.\
    \ Why would you want to attach a callback after an Ajax call has fired? In a word:\
    \ *encapsulation*. If an Ajax call has multiple effects (triggering animations,\
    \ inserting HTML, locking/unlocking user input...), it's awkward for the part\
    \ of your app that's making the request to handle every contingency. It's much\
    \ more elegant to pass a Promise around.\n\nAnother advantage of Promises is that\
    \ (at least in jQuery's implementation) you can stack callbacks to your heart's\
    \ content. That makes it a lot easier to reduce code duplication when some small\
    \ piece of functionality (like a \"Loading\" animation) is shared across several\
    \ Ajax calls. I recommend stacking whenever possible to keep callbacks as simple\
    \ as possible: **One task, one callback.**\n\nBut the biggest advantage of using\
    \ Promises is that you can easily derive new Promises from existing ones. You\
    \ might ask two Promises representing parallel tasks to give you a Promise that\
    \ will inform you of their mutual completion. Or you might ask a Promise representing\
    \ the first task in a series to give you a Promise representing the *final* task\
    \ in the series. As we'll soon see, these operations come naturally to Promises.\n\
    \n### 3.1 A very brief history of Promises\n\nPromises have existed in many forms\
    \ in many languages. The term was first used by C++ engineers on the Xanadu project,\
    \ a forerunner to the web. Promises were later used in the E programming language,\
    \ which inspired Python devs to implement them in the form of the Twisted framework's\
    \ Deferreds.\n\nPromises hit JavaScript in a big way in 2007, when the pioneering\
    \ Dojo framework, taking a cue from Twisted, added an object called `dojo.Deferred`.\
    \ At the time, the relatively mature Dojo rivaled the fledgling jQuery framework\
    \ in popularity. In 2009, citing `dojo.Deferred` as an influence, Kris Zyp proposed\
    \ the CommonJS Promises/A spec.<sup>1</sup> That same year, Node.js made its first\
    \ appearance. Node's early iterations used Promises in its APIs for file I/O and\
    \ DNS. However, in February 2010, Ryan Dahl made the decision to switch to the\
    \ now-familiar `callback(err, results...)` format, on the grounds that Promises\
    \ are a higher-level construct that belongs in \"userland.\"\n\nThis decision\
    \ made way for competing Promises implementations aimed at Node, notably Kris\
    \ Kowal's Q.js<sup>2</sup> and AJ O'Neal's Futures.<sup>3</sup> (In common usage,\
    \ the terms \"Promise,\" \"Deferred,\" and \"Future\" are roughly synonymous.)\
    \ Q is a fairly straightforward implementation of the Promises/A spec. Futures\
    \ is a broader toolkit, incorporating many of the flow control features found\
    \ in libraries like Async.js.\n\nBut the reason Promises are getting so much attention\
    \ today is, of course, jQuery. Accompanying a major rewrite of `$.ajax` in January\
    \ 2011, jQuery 1.5's Promises implementation thrilled countless developers who\
    \ were encountering Promises for the first time. Others, however, were frustrated\
    \ that the Promises/A spec had been ignored, leading to subtle API differences.\n\
    \nWe'll focus on jQuery Promises for the rest of this chapter, except for a closing\
    \ section on Promises/A and Q.js. We'll also take our vocabulary cues from jQuery,\
    \ particularly the distinction between Deferreds and Promises that we'll see in\
    \ the next section, and the use of \"resolve\" as the antonym of \"reject.\"\n\
    \n<sup>1</sup>http://wiki.commonjs.org/wiki/Promises/A\n<sup>2</sup>https://github.com/kriskowal/q\n\
    <sup>3</sup>https://github.com/coolaj86/futures\n\n### 3.2 Making Promises\n\n\
    We started this chapter by showing how the Ajax methods in jQuery 1.5+ ($.ajax,\
    \ $.get, and $.post) return Promises. But to really understand Promises, we need\
    \ to make a few of our own.\n\nLet's give the user a prompt to hit either Y or\
    \ N. (You can see this example in action on jsFiddle.\")\n\nThe first thing we'll\
    \ do is create an instance of $.Deferred that represents the user's decision:\n\
    \n```\nvar promptDeferred = new $.Deferred();\npromptDeferred.always(function(){\
    \ console.log('A choice was made:'); });\npromptDeferred.done(function(){ console.log('Starting\
    \ game...'); });\npromptDeferred.fail(function(){ console.log('No game today.');\
    \ });\n```\n\n> (Note: Under jQuery 1.5, the always method was called complete.\
    \ Under jQuery 1.6/1.7, always and complete are synonymous, but always is preferred.\
    \ The complete alias is deprecated and may be removed in a future release.)\n\n\
    You're probably wondering why I created an instance of Deferred when this section\
    \ is called \"Making Promises.\" Fear not—a Deferred is a Promise! More precisely,\
    \ it's a superset of Promise with one critical addition: You can trigger a Deferred\
    \ directly. A pure Promise only lets you add more callbacks; someone else has\
    \ to trigger them.\n\nWe can trigger our Deferred with the resolve and reject\
    \ methods:\n\n```\n$('#playGame').focus().on('keypress', function(e) {\n    var\
    \ Y = 121, N = 110;\n    if (e.keyCode === Y) {\n        promptDeferred.resolve();\n\
    \    } else if (e.keyCode === N) {\n        promptDeferred.reject();\n    } else\
    \ {\n        return false;  // our Deferred remains pending\n    }\n});\n```\n\
    \nNow load the page and hit Y. The console will say:\n\nA choice was made:\nStarting\
    \ game...\n\nYou see what happened? When the Deferred was resolved, its always\
    \ and done callbacks were run.\n\nRefresh and hit N:\n\nhttp://jsfiddle.net/TrevorBurnham/Pj6Bf/\n\
    \nA choice was made:\nNo game today.\n\nSo when the Deferred was rejected, its\
    \ always and fail callbacks were run. Note that callbacks always run in the order\
    \ in which they were bound. If the always callback had been bound last, the order\
    \ of the console output would be reversed.\n\nTry hitting Y and N repeatedly.\
    \ After the first choice is made, there's no effect! That's because a Promise\
    \ can only be resolved or rejected once; after that, it's inert. We say that a\
    \ Promise is pending until it's either resolved or rejected. You can find out\
    \ whether a Promise is \"pending\", \"resolved\", or \"rejected\" by calling its\
    \ state method. (state was added in jQuery 1.7; in earlier versions, use isResolved\
    \ and isRejected.)\n\nI like to say that I'm triggering a Promise when I resolve\
    \ or reject it, and a Promise that's been resolved or rejected is triggered. This\
    \ is non-standard terminology, but I'll be using it throughout this chapter, as\
    \ the words \"triggering\"/\"triggered\" are much more direct than the phrases\
    \ \"resolving or rejecting\"/\"resolved or rejected.\"\n\nA more sensible terminology\
    \ is used in the Promises/A spec and its implementations (including Q): A Promise\
    \ is either fulfilled or rejected; either way, it's resolved. Unfortunately, jQuery\
    \ appears to be stuck with the resolved vs. rejected dichotomy.\n\n### Getting\
    \ a pure Promise\n\nI promised you a Promise, so here it is:\n\n```\nvar promptPromise\
    \ = promptDeferred.promise();\n```\n\npromptPromise is just a copy of promptDeferred\
    \ without the resolve/reject methods. It doesn't matter whether we bind a callback\
    \ to a Deferred or to its Promise, because they share the same callbacks internally.\
    \ They also share the same state (\"pending\", \"resolved\", or \"rejected\").\
    \ This means that creating multiple Promises for a single Deferred would be pointless.\
    \ In fact, jQuery will just give you the same object:\n\n```\nvar promise1 = promptDeferred.promise();\n\
    var promise2 = promptDeferred.promise();\nconsole.log(promise1 === promise2);\
    \  // true\n```\n\nThe only reason to use the promise method is safety. If we\
    \ pass promptPromise around but keep promptDeferred to ourselves, we can rest\
    \ assured that none of our callbacks will fire until we want them to.\n\nTo reiterate:\
    \ Every Deferred has a single Promise, and every Promise represents a Deferred."
  mdcn: "\n在本章中，我们学习了通过PubSub分发事件——这是JavaScript最基本的设计模式之一。关键在于决定通过哪些实体来分发事件。我们看到jQuery非常适合分发与DOM变化相关的事件，但用它来分发与应用程序状态相关的事件通常是个错误，因为稍后更改页面的标记可能会改变事件的传播方式。这正是Backbone等框架的用武之地，它们允许您将数据层次结构与数据呈现方式分离。一些应用程序，特别是Node服务器，使用单个全局PubSub对象来连接原本孤立的模块，从而实现松散耦合和轻松测试。PubSub的一大优点是，当您没有订阅正在发布的事件时，它完全不会造成干扰。在下一章中，我们将探讨另一种处理事件的无侵入方式：Promise。\n\
    \n## 3 Promise与Deferred\n\n早在2010年，我与我那位多才多艺的同事Ajax先生有过这样一段对话：\n\n> **我：** 嘿，能帮我从这个URL获取一些数据吗？\n\
    >\n> **Ajax先生：** 正在处理！给我一个*成功*回调，这样我完成后就能通知你。\n>\n> **我：** 好的，给你。谢谢。\n>\n> **Ajax先生：**\
    \ 哦，你还应该给我一个*失败*回调。你知道的，以防万一。\n>\n> **我：** 说得好。还有别的吗？\n>\n> **Ajax先生：** 嘿，我注意到那两个回调之间有一些重复代码！你可以把那部分移到第三个*总是*回调里。\n\
    >\n> **我：**（不耐烦地）好吧，我来重构它们。这样吧：你现在先去运行，我稍后再给你回调？\n>\n> **Ajax先生：**（恼怒地）我看起来像个EventEmitter吗？\n\
    \n幸好，jQuery 1.5改变了Ajax先生这种“现在就要”的态度。您所熟知和喜爱的所有Ajax函数现在都返回Promise。*Promise是一个代表具有两种可能结果（成功或失败）的任务*的对象，并持有当其中一种结果发生时触发的回调。例如，在jQuery\
    \ 1.4下，我不得不这样写：\n\n```\n$.get('/mydata', {\n  success: onSuccess,\n  failure:\
    \ onFailure,\n  always: onAlways\n});\n```\n\n但在jQuery 1.5+下，我可以改写为：\n\n```\n\
    var promise = $.get('/mydata');\npromise.done(onSuccess);\npromise.fail(onFailure);\n\
    promise.always(onAlways);\n```\n\n你可能会想，这个变化有什么了不起的？为什么要在Ajax调用触发之后才附加回调？用一个词概括：*封装*。如果一个Ajax调用有多种效果（触发动画、插入HTML、锁定/解锁用户输入……），让发起请求的应用程序部分处理所有意外情况会很笨拙。传递一个Promise要优雅得多。\n\
    \nPromise的另一个优点是（至少在jQuery的实现中）你可以随心所欲地堆叠回调。这大大减少了代码重复，当某个小功能（比如“加载中”动画）在多个Ajax调用中共享时。我建议尽可能堆叠回调，以保持回调尽可能简单：**一个任务，一个回调。**\n\
    \n但使用Promise最大的优点是，你可以轻松地从现有的Promise派生出新的Promise。你可能会请求两个代表并行任务的Promise，让你获得一个通知你它们共同完成的Promise。或者你可能会请求一个代表一系列任务中第一个任务的Promise，让你获得一个代表该系列中*最终*任务的Promise。我们很快就会看到，这些操作对Promise来说是自然而然的。\n\
    \n### 3.1 Promise简史\n\nPromise在许多语言中以多种形式存在过。这个术语最早由C++工程师在Xanadu项目（互联网的前身）上使用。后来，Promise在E编程语言中被使用，这启发了Python开发者以Twisted框架的Deferred形式来实现它们。\n\
    \nPromise在2007年大举进入JavaScript领域，当时开创性的Dojo框架借鉴了Twisted，添加了一个名为`dojo.Deferred`的对象。当时，相对成熟的Dojo在流行度上与尚处于起步阶段的jQuery框架不相上下。2009年，Kris\
    \ Zyp提出了CommonJS Promises/A规范，<sup>1</sup>并指出受到了`dojo.Deferred`的启发。同年，Node.js首次亮相。Node的早期版本在其文件I/O和DNS的API中使用了Promise。然而，在2010年2月，Ryan\
    \ Dahl决定转向现在熟悉的`callback(err, results...)`格式，理由是Promise是属于“用户领域”的更高层次的构造。\n\n\
    这一决定为面向Node的竞争性Promise实现铺平了道路，尤其是Kris Kowal的Q.js<sup>2</sup>和AJ O'Neal的Futures。<sup>3</sup>（在通常用法中，“Promise”、“Deferred”和“Future”这些术语大致是同义的。）Q是Promises/A规范的一个相当直接的实现。Futures则是一个更广泛的工具包，包含了Async.js等库中常见的许多流程控制特性。\n\
    \n但Promise如今引起如此多关注的原因，当然是jQuery。伴随着2011年1月`$.ajax`的重大重写，jQuery 1.5的Promise实现让无数第一次接触Promise的开发者兴奋不已。然而，其他人则对Promises/A规范被忽视感到沮丧，这导致了API上的细微差别。\n\
    \n在本章的剩余部分，我们将重点关注jQuery Promise，除了最后关于Promises/A和Q.js的部分。我们还将从jQuery中获取我们的词汇提示，特别是我们将在下一节看到的Deferred和Promise之间的区别，以及使用“resolve”作为“reject”的反义词。\n\
    \n<sup>1</sup>http://wiki.commonjs.org/wiki/Promises/A\n<sup>2</sup>https://github.com/kriskowal/q\n\
    <sup>3</sup>https://github.com/coolaj86/futures\n\n### 3.2 制造Promise\n\n我们通过展示jQuery\
    \ 1.5+中的Ajax方法（$.ajax、$.get和$.post）返回Promise来开始本章。但要真正理解Promise，我们需要自己制造几个。\n\n\
    让我们给用户一个提示，按Y或N键。（你可以在jsFiddle上看到这个示例的运行效果。）\n\n我们要做的第一件事是创建一个表示用户决定的`$.Deferred`实例：\n\
    \n```\nvar promptDeferred = new $.Deferred();\npromptDeferred.always(function(){\
    \ console.log('A choice was made:'); });\npromptDeferred.done(function(){ console.log('Starting\
    \ game...'); });\npromptDeferred.fail(function(){ console.log('No game today.');\
    \ });\n```\n\n> （注意：在jQuery 1.5下，`always`方法被称为`complete`。在jQuery 1.6/1.7下，`always`和`complete`是同义的，但推荐使用`always`。`complete`别名已弃用，并可能在未来版本中移除。）\n\
    \n你可能想知道，既然本节叫做“制造Promise”，为什么我创建的是Deferred实例。别担心——Deferred就是Promise！更准确地说，它是Promise的超集，增加了一个关键特性：你可以直接触发Deferred。纯Promise只允许你添加更多回调；必须由其他人来触发它们。\n\
    \n我们可以用`resolve`和`reject`方法来触发我们的Deferred：\n\n```\n$('#playGame').focus().on('keypress',\
    \ function(e) {\n    var Y = 121, N = 110;\n    if (e.keyCode === Y) {\n     \
    \   promptDeferred.resolve();\n    } else if (e.keyCode === N) {\n        promptDeferred.reject();\n\
    \    } else {\n        return false;  // 我们的Deferred保持pending状态\n    }\n});\n\
    ```\n\n现在加载页面并按Y键。控制台将显示：\n\nA choice was made:\nStarting game...\n\n你看到发生了什么吗？当Deferred被resolve时，它的`always`和`done`回调被运行了。\n\
    \n刷新页面并按N键：\n\nhttp://jsfiddle.net/TrevorBurnham/Pj6Bf/\n\nA choice was made:\n\
    No game today.\n\n所以当Deferred被reject时，它的`always`和`fail`回调被运行了。注意回调总是按照它们绑定的顺序运行。如果`always`回调是最后绑定的，控制台输出的顺序就会相反。\n\
    \n尝试反复按Y和N键。在做出第一个选择后，就没有效果了！这是因为Promise只能被resolve或reject一次；之后，它就是惰性的。我们说一个Promise在被resolve或reject之前是`pending`（待定）状态。你可以通过调用它的`state`方法来查明Promise是“pending”、“resolved”还是“rejected”。（`state`是在jQuery\
    \ 1.7中添加的；在早期版本中，使用`isResolved`和`isRejected`。）\n\n我喜欢说，当我resolve或reject一个Promise时，我就是在触发它，而一个被resolve或reject的Promise是被触发的。这是非标准术语，但我会在本章中一直使用它，因为“触发”/“被触发”这个词比“resolve或reject”/“被resolve或reject”这些短语要直接得多。\n\
    \nPromises/A规范及其包括Q在内的实现使用了一个更合理的术语：一个Promise要么是`fulfilled`（已实现），要么是`rejected`（已拒绝）；无论哪种情况，它都是`resolved`（已解决）的。不幸的是，jQuery似乎被困在了resolved与rejected的二分法中。\n\
