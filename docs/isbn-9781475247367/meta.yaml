    $.when(fetching, $('#loading'));\n```\n\n请记住，我们必须在启动动画*之后*执行此操作。如果 `#loading`\
    \ 的动画队列为空，其 Promise 会立即解析。\n\n## 其他逻辑运算\n\n由于 `$.when` 是逻辑与，你可能会想：jQuery Promises\
    \ 有逻辑或吗？那 NOT 呢？\n\n答案是没有，不是开箱即用的。但我们可以很轻松地自己编写这些功能。先从 NOT 开始：\n\n```\nfunction\
    \ not(promise) {\n    var result = new $.Deferred();\n    promise.done(result.reject);\n\
    \    promise.fail(result.resolve);\n    return result;\n}\n```\n\n如果你曾经上过逻辑课，你就会知道\
    \ OR 可以用 AND 和 NOT 来定义，就像这样：\n\n```\nfunction or() {\n    var promises = Array.prototype.slice.call(arguments);\n\
    \    var negatedPromises = promises.map(not);\n    return not($.when.apply(this,\
    \ negatedPromises));\n}\n```\n\n这里有一个简短的证明：\n\n1. 当传递给 or 的 Promise 被解析时，其否定将被拒绝，`$.when`\
    \ 返回的 Promise 也将被拒绝，因此 or 返回的 Promise 将立即被解析。\n\n2. 当传递给 and 的所有 Promise 都被拒绝时，它们的否定都将被解析，`$.when`\
    \ 返回的 Promise 也将被解析，因此 or 返回的 Promise 将被拒绝。\n\n很酷吧？这些惯用法不像 `$.when` 那样广泛使用，但它们确实展示了将\
    \ Promises 作为布尔值来操作是多么容易。\n\n## 3.7 使用 pipe 绑定到未来\n\n在 JavaScript 中执行一系列异步任务往往不方便，部分原因是直到第一个任务完成之前，你无法为第二个任务附加处理程序。例如，让我们先从某个\
    \ URL GET 数据，然后将其 POST 到另一个 URL：\n\n```\nvar getPromise = $.get('/query');\ngetPromise.done(function(data)\
    \ {\n  var postPromise = $.post('/search', data);\n});\n// 现在我们想要为 postPromise\
    \ 附加处理程序...\n```\n\n你看到这里的问题了吗？在我们的 GET 操作完成之前，我们无法为 postPromise 绑定回调，因为它还不存在！它是由我们无法进行的\
    \ `$.post` 调用创建的，除非我们先异步地从 `$.get` 调用中获取数据。\n\n这就是为什么 jQuery 1.6 为 Promises 添加了\
    \ pipe 方法。本质上，pipe 的意思是：\"给我一个此 Promise 的回调，我将给你一个代表该回调结果的 Promise。\"\n\n```\n\
    var getPromise = $.get('/query');\nvar postPromise = getPromise.pipe(function(data)\
    \ {\n  return $.post('/search', data);\n});\n```\n\n看起来像黑魔法吧？以下是详细解析：pipe 接受与\
    \ clerk 相同的三个参数，每种回调类型各一个：done、fail 和 progress。所以在这个例子中，我们只提供了一个在 getPromise 解析时运行的回调。pipe\
    \ 方法返回一个新的 Promise，该 Promise 在我们回调返回的 Promise 解析/拒绝时被解析/拒绝。实际上，pipe 是一扇通往未来的窗口。\n\
    \n你也可以使用 pipe 来\"过滤\" Promise，通过修改回调参数实现。如果 pipe 回调返回的是非 Promise/Deferred 的内容，那么该值将成为回调参数。例如，如果你有一个发出介于\
    \ 0 和 1 之间数字的进度通知的 Promise，你可以使用 pipe 创建一个相同的 Promise，但发出人类可读的字符串作为进度通知：\n\n```\n\
    var promise2 = promise1.pipe(null, null, function(progress) {\n  return Math.floor(progress\
    \ * 100) + '% complete';\n});\n```\n\n总结一下，从 pipe 回调中可以执行两种操作：\n\n1. 如果你返回一个 Promise，pipe\
    \ 返回的 Promise 将模仿它。\n\n2. 如果你返回一个非 Promise 值（或什么都不返回），pipe 返回的 Promise 将立即被解析、拒绝或通知该值，具体取决于原始\
    \ Promise 刚刚发生了什么。\n\npipe 判断某物是否为 Promise 的规则与 `$.when` 相同：如果它有 `promise` 方法，该方法的返回值将被用作代表原始对象的\
    \ Promise。同样，promise.promise() === promise。\n\n### Pipe 级联\n\npipe 不要求你提供所有可能的回调。事实上，通常你只想写：\n\
    \n```\nvar pipedPromise = originalPromise.pipe(successCallback);\n```\n\n或\n\n\
    ```\nvar pipedPromise = originalPromise.pipe(null, failCallback);\n```\n\n我们已经看到了在第一种情况下原始\
    \ Promise 成功时会发生什么，或者在第二种情况下原始 Promise 失败时会发生什么，这样 piped Promise 的行为取决于 successCallback\
    \ 或 failCallback 的返回值。但如果我们在原始 Promise 执行时没有给 pipe 提供回调呢？\n\n很简单：在这些情况下，piped\
    \ promise 会模仿原始 Promise。我们可以说原始 Promise 的行为通过 piped Promise 级联传递。这种级联非常方便，因为它允许我们以最小的努力为异步任务定义分支逻辑。假设我们有一个三步流程：\n\
    \n```\nvar step1 = $.post('/step1', data1);\nvar step2 = step1.pipe(function()\
    \ {\n  return $.post('/step2', data2);\n});\nvar lastStep = step2.pipe(function()\
    \ {\n  return $.post('/step3', data3);\n});\n```\n\n这里，lastStep 只有在所有三个 Ajax 调用都成功时才会解析，并且如果*任何*一个失败，它将被拒绝。如果我们只关心整个流程，可以省略前面步骤的变量声明：\n\
    \n```\nvar posting = $.post('/step1', data1)\n  .pipe(function() {\n    return\
    \ $.post('/step2', data2);\n  })\n  .pipe(function() {\n    return $.post('/step3',\
    \ data3);\n  });\n```\n\n等价地，我们可以将第二个 pipe 嵌套在另一个里面：\n\n```\nvar posting = $.post('/step1',\
    \ data1)\n  .pipe(function() {\n    return $.post('/step2', data2)\n      .pipe(function()\
    \ {\n        return $.post('/step3', data3);\n      });\n  });\n```\n\n当然，这又回到了\"\
    末日金字塔\"。你应该了解这种风格，但作为一般规则，尝试单独声明你的 piped Promises。变量名可能不是必需的，但它们使代码更具自文档性。\n\n\
    这就结束了我们对 jQuery Promises 的 tour。现在让我们快速看一下主要的替代方案：CommonJS Promises/A 规范及其旗舰实现\
    \ Q.js。\n\n## 3.8 jQuery 与 Promises/A 的比较\n\n就功能而言，jQuery Promises 和 Promises/A\
    \ 基本上是等效的。它们可以相互映射。关键的差异是表面的：它们使用相同的词来表示不同的含义。\n\n最明显的区别是，像 Q.js 这样的忠实 Promises/A\
    \ 实现中的 then 方法返回一个*新的* Promise，代表成功/失败处理程序的返回值。这很像 jQuery 的 pipe 方法。\n\n另一个很大的区别，前面提到过，是\
    \ jQuery 使用术语 \"resolve\" 作为 \"fail\" 的反义词，而 Promises/A 使用 \"fulfill\"。在 Promises/A\
    \ 中，当 Promise 被 fulfill 或 fail 时，称为 \"resolved\"。\n\n还有其他更细微的差异。例如：在 Promises/A\
    \ 中，从 then 返回的 Promise 是被 fulfill 还是 reject，取决于被调用的回调是返回一个值还是抛出错误。（从 jQuery Promise\
    \ 回调中抛出错误是个坏主意，因为它们将不会被捕获。）\n\n由于这些问题，你应该避免在同一个项目中与多个 Promise 实现交互。如果你只是从 jQuery\
    \ 方法获取 Promises，就使用 jQuery Promises。如果你使用的另一个库给你 CommonJS Promises，就采用 Promises/A。如果你两者都用，Q.js\
    \ 可以很容易地\"同化\" jQuery Promises：\n\n```\nvar qPromise = Q.when(jqPromise);\n```\n\
    \n只要这两个标准保持分歧，这就是让它们友好协作的最佳方式。更多信息，请参阅 Q.js 文档⁵。\n\n## 3.9 用 Promises 替换回调\n\n\
    当我们与普通的异步函数交互时，我们可以通过将 Deferred 的 resolve 方法作为回调传递，用 Promise 来表示其完成：\n\n```\n\
    var timing = new $.Deferred();\nsetTimeout(timing.resolve, 500);\n```\n\n当一个 API\
    \ 同时接受成功和失败回调时，我们可以将 resolve 和 reject 作为这些回调传递。当一个 API 遵循将错误作为回调第一个参数传递的 Node\
    \ 约定时，我们可以根据该参数是否存在来调用 resolve 或 reject。例如：\n\n```\nvar fileReading = new $.Deferred();\n\
    fs.readFile(filename, 'utf8', function(err) {\n  if (err) {\n    fileReading.reject(err);\n\
    \  } else {\n    fileReading.resolve(Array.prototype.slice.call(arguments, 1));\n\
    \  }\n});\n```\n\n（是的，你可以在 Node 中使用 jQuery。只需 npm install jquery 并像任何其他模块一样使用它。或者你可以使用\
    \ Q.js 或 Futures，如前所述。）\n\n每次都这样写会很麻烦，所以为什么不创建一个工具函数，从任何给定的 Deferred 生成一个 Node\
    \ 风格的回调呢？\n"
