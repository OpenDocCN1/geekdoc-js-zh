- img_proc: true
  md: "# 4 Flow Control with Async.js\n\nSearch the npm registryⁱ for \"flow,\" and\
    \ an overwhelming expanse of flow control libraries will appear. Because JavaScript\
    \ functions can be freely passed around, there are endless possibilities for clearing\
    \ away the clutter of nested async functions. Each of these libraries dictates\
    \ certain conventions that, when followed, enable sparkling clean code.\n\nThe\
    \ most popular of these libraries is Caolan McMahon's Async.js.² In fact, as of\
    \ this writing, Async.js is the #6 most-required library in the npm registry,\
    \ sharing the limelight with superstars like Underscore.js, CoffeeScript, and\
    \ Express. And Async.js isn't just for Node; it works great in the browser, too!\
    \ (Yes, even IE6.)\n\nWe'll use Node.js for most of the examples in this chapter.\
    \ If you already have Node and npm on your system, you can install Async.js with\n\
    \n```\nnpm install -g async\n```\n\nThen put `async = require('async')` at the\
    \ top of any file to bring the module in.\n\n# 4.1 The async ordering problem\n\
    \nSuppose we have a Node app where we want to read all of the files in a directory,\
    \ in alphabetical order, then concatenate their contents into a single string\
    \ and display it. We could do this quite easily using synchronous methods:\n\n\
    ```\nvar fs = require('fs');\nvar concatenation = '';\nfs.readdirSync('recipes')\n\
    \  .filter(function(filename) {\n    return fs.statSync(filename).isFile();\n\
    \  })\n  .forEach(function(filename) {\n    concatenation += fs.readFileSync(filename,\
    \ 'utf8');\n  });\nconsole.log(concatenation);\n```\n\n(By using a forEach iterator\
    \ instead of a for loop, we've avoided the i scoping problem that we saw in Chapter\
    \ 1. Just be aware that forEach isn't available in older browsers without a shim.)\n\
    \nBut all this blocking is terribly inefficient, particularly if our application\
    \ could be doing something else simultaneously. The problem is that we can't just\
    \ naïvely replace\n\nⁱhttp://search.npmjs.org/\n²https://github.com/caolan/async"
  merge: -1
  pgno: 49
- img_proc: true
  md: "with\n\n```\nconcatenation += fs.readFileSync(filename, 'utf8');\n```\n\n```\n\
    fs.readFile(filename, 'utf8', function(err, contents) {\n  if (err) throw err;\n\
    \  concatenation += contents;\n});\n```\n\nbecause there's no guarantee that the\
    \ `readFile` callbacks would fire in the order that the `readFile` calls were\
    \ made in. `readFile` just tells the OS to **start** reading a file. Most likely,\
    \ shorter files will be read more quickly than longer files.\n\n# ## 4.2 Async\
    \ collection methods\n\nThe simplest solution to the async ordering problem is\
    \ to start each `readFile` only after the previous one has finished:\n\n```\n\
    var fs = require('fs');\nvar concatenation = '';\nvar dirContents = fs.readdirSync('recipes');\n\
    function readFileAt(i) {\n  if (i === dirContents.length) return console.log(concatenation);\n\
    \  fs.stat(filename, function(err, stats) {\n    if (err) throw err;\n    if (!stats.isFile())\
    \ return readFileAt(i + 1);\n    fs.readFile(dirContents[i], 'utf8', function(err,\
    \ fileContents) {\n      if (err) throw err;\n      concatenation += fileContents;\n\
    \      readFileAt(i + 1);\n    });\n  });\n}\nreadFileAt(0);\n```\n\nThis is,\
    \ as you may have noticed, not a very elegant solution. For something so simple,\
    \ there's a lot of boilerplate involved. When we used the synchronous `filter`\
    \ and `forEach` methods, this only took 10 lines! Wouldn't it be nice if we could\
    \ just drop in async equivalents of those wonderful iteration methods?\n\nThat's\
    \ exactly what Async.js gives us (among other things). In fact, we have two options\
    \ for replacing the Array prototype's `filter` and `forEach` methods:"
  merge: -1
  pgno: 50
- img_proc: true
  md: "1. `async.filter` and `async.forEach`, which process the given array *in parallel*,\
    \ or\n2. `async.filterSeries` and `async.forEachSeries`, which process the given\
    \ array *sequentially*\n\nObviously running our async operations in parallel is\
    \ faster, so why would we want to use a series method? Well, two reasons:\n\n\
    First, there's a limit on the number of files that Node (or any application process)\
    \ can try to read simultaneously. If we hit that limit, the OS would give us an\
    \ error that we'd have to handle from the `fs.readFile` callback. If we read the\
    \ files sequentially, we don't have to deal with this limitation.\n\nSecond, if\
    \ we ran the `readFile` callback in parallel, we couldn't just write\n\n```\n\
    concatenation += fileContents;\n```\n\nbecause there's no guarantee that the `readFile`\
    \ operations would finish in the same order that they started in. We'd have to\
    \ figure out a way to store the results and concatenate them in the right order.\n\
    \nSo, we'll stick to `async.forEachSeries` for now. Here's a straightforward adaptation\
    \ of our synchronous code to use Async.js' collection methods:\n\n```\nvar async\
    \ = require('async');\nvar fs = require('fs');\nvar concatenation = '';\nvar dirContents\
    \ = fs.readdirSync('recipes');\nasync.filter(dirContents, isFilename, function(filenames)\
    \ {\n  async.forEachSeries(filenames, readAndConcat, onComplete);\n});\nfunction\
    \ onComplete(err) {\n  if (err) throw err;\n  console.log(concatenation);\n}\n\
    \nfunction isFilename(filename, callback) {\n  fs.stat(filename, function(err,\
    \ stats) {\n    callback(err ? false : stats.isFile());\n  });\n}\nfunction readAndConcat(filename,\
    \ callback) {\n  fs.readFile(filename, 'utf8', function(err, fileContents) {\n\
    \    if (err) return callback(err);\n    concatenation += fileContents;\n    callback();\n\
    \  });\n}\n```"
  merge: -1
  pgno: 51
- img_proc: true
  md: "Now our code splits up nicely into two parts: the overall task, and the implementation\
    \ details (in the form of the iterator functions).\n\n`filter` and `forEach` aren't\
    \ the only Async.js utilities corresponding to Array prototype methods. There's\
    \ also:\n\n+   - `reject`/`rejectSeries`, the inverse of `filter`\n- `map`/`mapSeries`,\
    \ for 1:1 transformations\n- `reduce` and `reduceRight`, for transforming a value\
    \ at each step\n- `detect`/`detectSeries`, for finding a value matching a filter\n\
    - `sortBy`, for generating a sorted copy\n- `some` for testing whether at least\
    \ one value matches the given criterion\n- `every` for testing whether *all* values\
    \ match the given criterion\n\nIn our file-reading example, we could adopt a more\
    \ succinct, functional style with `async.reduce`, allowing Async.js to store concatenation\
    \ for us:\n\n```\nvar async = require('async');\nvar fs = require('fs');\nvar\
    \ dirContents = fs.readdirSync('recipes');\nasync.filter(dirContents, isFilename,\
    \ function(filenames) {\n  async.reduce(filenames, '', readReduce, onComplete);\n\
    });\n\nfunction onComplete(err, concatenation) {\n  if (err) throw err;\n  console.log(concatenation);\n\
    }\n\nfunction isFilename(filename, callback) {\n  fs.stat(filename, function(err,\
    \ stats) {\n    callback(err ? false : stats.isFile());\n  });\n}\n\nfunction\
    \ readReduce(concatenation, filename, callback) {\n  fs.readFile(filename, 'utf8',\
    \ function(err, fileContents) {\n    if (err) callback(err);\n    callback(null,\
    \ concatenation + fileContents);\n  });\n}\n```"
  merge: -1
  pgno: 52
- img_proc: true
  md: "What's with that `null` that `readReduce` uses as its first callback argument\
    \ when there's no error? See the next section.\n\n# Error-handling in Async.js\n\
    \nNotice that `isFilename`, the iterator we provided to `async.filter`, passes\
    \ its callback a boolean as the first argument. By contrast, `readAndConcat` passed\
    \ its callbacks an error as the first argument. Why?\n\nAsync.js uses Node-style\
    \ callbacks: The first callback argument is an error. **Callbacks to methods that\
    \ produce a boolean are the exception to this rule.** That means that the iterators\
    \ for the collection methods (`filter`, `reject`, `detect`, `some`, and `every`)\
    \ can't report errors. Blame Node's `path.exists` for setting this precedent,\
    \ which Async.js duly follows.\n\nWhen a normal iterator passes a value other\
    \ than `null` or `undefined` as the first argument to its callback, Async will\
    \ immediately invoke the completion callback with that error. So in our code above,\
    \ if `fs.readFile` receives an error in its callback, it passes it along to the\
    \ `readAndConcat` callback, which short-circuits `async.forEachSeries`, leading\
    \ to the error being immediately thrown from our `onComplete` function.\n\n# 4.3\
    \ Chaining async functions\n\nAsync.js' collection methods solve the problem of\
    \ applying a single async function to a data sequence. But what if, instead of\
    \ a data sequence, we have a sequence of *functions*?\n\nThat's where `async.series`\
    \ and `async.waterfall` come in. Each takes an array of functions (the *task list*)\
    \ and runs them sequentially, passing in a Node-style callback. The difference\
    \ between the two is that `async.series` provides only the callback to each task,\
    \ whereas `async.waterfall` provides the results from the previous task. (By \"\
    results,\" I mean the non-error values each task passes to its callback.)\n\n\
    Let's look at a simple demonstration using timeouts:\n\n```\nvar async = require('async');\n\
    var start = new Date();\nasync.series([\n  function(callback) { setTimeout(callback,\
