    \n在 Firefox 中，超时在任何点击事件之前触发，这些点击事件则分散在时间中。如果你将延迟从 0 毫秒提高到 200 毫秒，你会看到几次点击。提高到\
    \ 300 毫秒，你会看到更多次。\n\n注意到那个 `console.log` 行了吗？如果你查看控制台，无论点击链接多少次，你只会看到一个 1。我添加它是为了说明事件和处理程序之间的区别：原始点击处理程序直到所有点击事件都已排队后才会被调用。然后它附加一个新的处理程序，替换掉自己。当剩余的排队点击事件触发时，运行时会调用新的处理程序。\n\
    \n当然，当你正确地进行事件驱动的 JavaScript 编程时，这些细节往往并不重要。确保你的代码不包含运行 5 秒的 while 循环是第一步。\n\n\
    ³http://jsfiddle.net/TrevorBurnham/GCbHm/\n\n## 1.2 函数何时是异步的？\n\n术语*异步函数*有点用词不当，因为\
    \ JavaScript 代码本身总是同步的。如果你调用一个函数，你的程序将不会继续直到该函数返回。我说的\"异步函数\"是指一个接受另一个函数（一个*回调*）的函数，该回调直到我们到达事件队列时才会运行。所以异步函数永远不会失败这个测试：\n\
    \n```\nvar a = false;\nasyncFunction(function() { console.assert(a, 'a should\
