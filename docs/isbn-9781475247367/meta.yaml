  md: '# Async input


    JavaScripters learn early on that whenever they want input, whether from the user
    or from some remote server, they need to define a callback somewhere and wait
    for it to fire. This is doubly true in the browser, where waiting for input synchronously
    is likely to give the user a Spinning Beach Ball of Death.² Notably, Ajax—despite
    its very name—has an `async` option that can (but *should never, ever*) be set
    to false.


    Node’s input functions are largely non-blocking, but a few have synchronous alternatives
    suffixed with `Sync`. For instance, you can use `readFileSync` instead of `readFile`.
    These aren’t always a bad option; there’s nothing wrong with using `readFileSync`
    to load a web server’s configuration on startup, for instance. On the other hand,
    if you wanted to automatically reload that configuration file every five seconds,
    using `readFileSync` instead of `readFile` could dramatically reduce the server’s
    performance. Using synchronous I/O methods in non-trivial Node apps is a nasty
    habit.


    # Async output


    Output from JavaScript is almost always async. For instance, you can update the
    DOM as much as you want from a long block of code, but the user won’t see any
    changes until you return to the event queue. Implicitly, any change you make queues
    a “redraw” event.


    Even the ubiquitous `console.log` is async in some environments. In WebKit-based
    browsers (Chrome and Safari), this code will log `{foo: bar}`:


    ```

    var obj = {};

    console.log(obj);

    obj.foo = ''bar'';

    ```


    (Node’s `console.log`, on the other hand, is synchronous, so the same code will
    output `{}`.)


    The point here is that not all async behavior is obvious. Page redraws are critical
    to the user experience, but there’s no callback for them (though any `setTimeout`
    will suffice because redraws take priority, at least in modern browsers). And
    WebKit’s `console.log` has perplexed many a developer with behavior that looks
    a lot like quantum entanglement.


    When output functions accept a callback, it’s usually optional. For instance,
    you can provide a callback to Node’s `fs.writeFile` if you want to know when the
    file has been saved and handle any errors that might have occurred, but you might
    do without if the file is inessential.


    # Advanced timing methods


    Recall that `setTimeout` and `setInterval` are imprecise. How imprecise? It depends
    on the environment. Here’s a test case:'
