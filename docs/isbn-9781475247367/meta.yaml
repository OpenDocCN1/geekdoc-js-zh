  md: "# Solution 1: Silence the change events\n\nBackbone gives us a special flag\
    \ that we can use to change models without them emitting a 'change' event:\n\n\
    ```\nmonsters.each(function(damage) {\n  this.set({life: this.get('life') - damage},\
    \ {silent: true});\n});\n```\n\nUsed carefully, this is the most efficient solution\
    \ to our problem. But it'll only work if we have absolute knowledge about what's\
    \ supposed to happen when each model we're silently modifying changes.\n\nSilencing\
    \ events is like a scalpel. With steady hands and precise planning, it can be\
    \ an invaluable tool; otherwise, it's just going to make a mess.\n\n# Solution\
    \ 2: Use a simple timeout\n\nRemember that even a 0ms delay will ensure that a\
    \ function runs after all synchronous code. We can use that to our advantage by\
    \ having a `checkGameState` function runs just once after all of the individual\
    \ monster models have been updated:\n\n```\nvar checkGameStateTimeout;\nfunction\
    \ checkGameState() {\n  // if no monster allies remain, you lose\n  var isTheGameLost\
    \ = monsters.filter(function() {\n    return this.get('ally');\n  }).length ===\
    \ 0;\n  // and so on..\n}\n\nvar monsters = new Backbone.Collection;\nmonsters.on('change',\
    \ function() {\n  clearTimeout(checkGameStateTimeout);\n  checkGameStateTimeout\
    \ = setTimeout(checkGameState, 0);\n});\n```\n\nNow no matter how many monsters\
    \ are changed simultaneously, `checkGameState` will fire just once in response."
