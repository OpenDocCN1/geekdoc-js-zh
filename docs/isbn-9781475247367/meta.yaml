  md: '# Restrictions on Web Workers


    Web Workers are primarily intended to handle complex computations without compromising
    DOM responsiveness. Potential uses include:


    +   - Performing physics calculations for games with CoffeePhysics.$^2$

    - Decoding video as it streams in with the Broadway implementation of the H.264
    codec.$^3$

    - Encrypting communications with the Stanford JavaScript Crypto Library.$^4$


    Typically, the Worker will send the result of its computations to the master thread,
    which will then update the page. Why not update the page directly? Mainly, to
    keep JavaScript’s async abstractions intact. If a Worker could alter the page’s
    markup, we’d end up in the same place as Java, wrapping our DOM manipulation code
    in mutexes and semaphores to avoid race conditions.


    Likewise, a Worker can’t see the global `window` object, or any other object in
    the master thread (or in other Worker threads). When an object is sent through
    `postMessage`, it’s transparently serialized and unserialized (think `JSON.parse(JSON.stringify(obj))`).
    So changes to the original object won’t affect the copy in the other thread.


    Even the trusty `console` isn’t available to Workers. All a Worker *can* see is
    its own global object, `self`, and everything bundled with it: standard JavaScript
    objects like `setTimeout` and `Math`, plus the browser’s Ajax methods.


    Ah yes, Ajax! A Worker can use `XMLHttpRequest` freely. It can even use `WebSocket`,
    if the browser supports it. From an efficiency standpoint, there’s little to gain
    just from moving Ajax functionality from the master script to a Worker, but it
    does mean that the Worker can pull data directly from the server. And if we’re
    dealing with a lot of data (like in the streaming video example), keeping it in
    one thread rather than serializing it via `postMessage` is a big win.


    There’s also a special `importScripts` function that will (synchronously) load
    and run the given script(s):


    ```

    importScripts(''https://raw.github.com/gist/1962739/danika.js'');

    ```


    Normally, synchronous loading is a big no-no, but remember that we’re in a secondary
    thread here. As long as the Worker has nothing else to do, blocking is A-OK.'
