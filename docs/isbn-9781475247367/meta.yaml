- md: " What's with that `null` that `readReduce` uses as its first callback argument\
    \ when there's no error? See the next section.\n\n## Error-handling in Async.js\n\
    \nNotice that `isFilename`, the iterator we provided to `async.filter`, passes\
    \ its callback a boolean as the first argument. By contrast, `readAndConcat` passed\
    \ its callbacks an error as the first argument. Why?\n\nAsync.js uses Node-style\
    \ callbacks: The first callback argument is an error. **Callbacks to methods that\
    \ produce a boolean are the exception to this rule.** That means that the iterators\
    \ for the collection methods (`filter`, `reject`, `detect`, `some`, and `every`)\
    \ can't report errors. Blame Node's `path.exists` for setting this precedent,\
    \ which Async.js duly follows.\n\nWhen a normal iterator passes a value other\
    \ than `null` or `undefined` as the first argument to its callback, Async will\
    \ immediately invoke the completion callback with that error. So in our code above,\
    \ if `fs.readFile` receives an error in its callback, it passes it along to the\
    \ `readAndConcat` callback, which short-circuits `async.forEachSeries`, leading\
    \ to the error being immediately thrown from our `onComplete` function.\n\n##\
    \ 4.3 Chaining async functions\n\nAsync.js' collection methods solve the problem\
    \ of applying a single async function to a data sequence. But what if, instead\
    \ of a data sequence, we have a sequence of *functions*?\n\nThat's where `async.series`\
    \ and `async.waterfall` come in. Each takes an array of functions (the *task list*)\
    \ and runs them sequentially, passing in a Node-style callback. The difference\
    \ between the two is that `async.series` provides only the callback to each task,\
    \ whereas `async.waterfall` provides the results from the previous task. (By \"\
    results,\" I mean the non-error values each task passes to its callback.)\n\n\
    Let's look at a simple demonstration using timeouts:\n\n```\nvar async = require('async');\n\
    var start = new Date();\nasync.series([\n  function(callback) { setTimeout(callback,\
    \ 100); },\n  function(callback) { setTimeout(callback, 300); },\n  function(callback)\
    \ { setTimeout(callback, 200); }\n], function(err, results) {\n  console.log('Completed\
    \ in ' + (new Date() - start) + 'ms');\n});\n```\n\n(Substituting `async.waterfall`\
    \ for `async.series` would have no effect on this example, since each task's callback\
    \ is run with no arguments.)\n\nThe completion handler will run after a little\
    \ over 600ms, as each task in the array is completed in order. The callback that\
    \ Async.js injects into each task function simply asks, \"Is there an error (the\
    \ first argument)? If not, then I'll collect the result (the second argument)\
    \ and run the next task.\"\n\nAs an exercise, let's rewrite our sequential file-reading\
    \ code, using `map` to transform the filename array into an array of async task\
    \ functions:\n\n```\nvar async = require('async');\nvar fs = require('fs');\n\
    var concatenation = '';\nvar fileTasks = fs.readdirSync('recipes')\n  .filter(function(filename)\
    \ {\n    return fs.statSync(filename).isFile();\n  })\n  .map(function (filename,\
    \ i) {\n    return function(callback) {\n      fs.readFile(filename, 'utf8', callback);\n\
    \    };\n  });\nasync.series(fileTasks, function(err, results) {\n  if (err) throw\
    \ err;\n  console.log(concatenation = results.join(''));\n});\n```\n\nNotice that,\
    \ conveniently, we can supply our task callback directly to `fs.readFile`, since\
    \ it uses the conventional Node callback signature: `(err, result)`. If any of\
    \ our readFile attempts did cause an error, the series would terminate and our\
    \ completion handler would be called with the error immediately.\n\n## 4.4 Parallelizing\
    \ async functions\n\nLet's say that we wanted to read all of our files at once\
    \ (ignoring filesystem limitations for the moment). Without Async.js, we might\
    \ try to store the read state in an array, like so:\n\n```\nvar fs = require('fs');\n\
    var dirContents = [];\nfs.readdirSync('recipes')\n  .filter(function(filename)\
    \ {\n    return fs.statSync(filename).isFile();\n  })\n  .forEach(function(filename,\
    \ i) {\n    fs.readFile(filename, 'utf8', function(err, fileContents) {\n    \
    \  if (err) throw err;\n      dirContents[i] = fileContents;\n    });\n  });\n\
    ```\n\nThere's just one thing missing: We'd like to put the line\n\n```\nvar concatenation\
    \ = dirContents.join('');\n```\n\nsomewhere… but *where*? It has to run from a\
    \ completion handler that we set to fire after the last fs.readFile operation\
    \ has run. Careful—that's \"last\" as in \"the last one to finish,\" not necessarily\
    \ the one with the highest i. So we need to keep track of the number of pending\
    \ readFile callbacks, and then have another callback fire when that number reaches\
    \ 0. This is called the *async queue* pattern.\n\nAsync.js does all of that for\
    \ us with collection methods like async.forEach and async.map, which have the\
    \ same API as the sequential versions we used earlier. But there's a more general\
    \ method we can use, async.parallel. Just like async.series, it takes an array\
    \ of functions of the form function(callback) {...}, plus an (optional) completion\
    \ handler. Let's repeat our timeout example:\n\n```\nvar async = require('async');\n\
    var start = new Date();\nasync.parallel([\n  function(callback) { setTimeout(callback,\
    \ 100); },\n  function(callback) { setTimeout(callback, 300); },\n  function(callback)\
    \ { setTimeout(callback, 200); }\n], function(err, results) {\n  console.log('Completed\
    \ in ' + (new Date() - start) + 'ms');\n});\n```\n\nWhereas async.series took\
    \ the sum of the timeouts to complete (~600ms), async.parallel takes only the\
    \ max timeout (~300ms).\n\nConveniently, Async.js passes the results to the completion\
    \ handler in the order corresponding to the task array, not the order in which\
    \ the results were generated. That means that we can write our simultaneous file\
    \ read code in exactly the same way that we wrote the sequential version—just\
    \ swapping in async.parallel in place of async.series:\n\n```\nvar async = require('async');\n\
    var fs = require('fs');\nvar concatenation = '';\nvar fileTasks = fs.readdirSync('recipes')\n\
    \  .filter(function(filename) {\n    return fs.statSync(filename).isFile();\n\
    \  })\n  .map(function (filename, i) {\n    return function(callback) {\n    \
    \  fs.readFile(filename, 'utf8', callback);\n    };\n  });\nasync.parallel(fileTasks,\
    \ function(err, results) {\n  if (err) throw err;\n  console.log(concatenation\
    \ = results.join(''));\n});\n```\n\n### All at once, or one at a time?\n\nasync.series\
    \ and async.parallel provide a simple, unified interface for two common async\
    \ patterns. But they also have their limitations:\n\n- 1. The task array is static.\
    \ Once you've called async.series or async.parallel, you can't add or remove tasks.\n\
    2. There's also no way to ask, \"How many tasks have been completed?\" It's a\
    \ black box, unless you dispatch updates from the tasks themselves.\n3. You're\
    \ limited to either no concurrency or unlimited concurrency.\n\nThat last one\
    \ is a pretty big deal when it comes to file reads. If there are thousands of\
    \ files in a directory, we don't want to be inefficient by doing a series, but\
    \ we're likely to anger the OS if we try to read them all in parallel. We could\
    \ break the task array into chunks and do each of those in parallel, sequentially...\
    \ but that's not exactly elegant.\n\nThankfully, Async.js provides a method that\
    \ addresses every one of these issues: async.queue.\n\n## 4.5 Dynamic async queuing\n\
    \nThe basic concept underlying async.queue is reminiscent of a DMV: They can handle\
    \ multiple people simultaneously (up to the number of clerks on duty), but rather\
    \ than have a separate line for each clerk, they have a single stack of numbers.\
    \ When you arrive, you get a number. When a clerk is free, they call the next\
    \ number. It's a very efficient system—one perfectly suited to our file-reading\
    \ example.\n\nasync.queue's interface is a bit more complex than that of `async.series`\
    \ and `async.parallel`. It takes a function called the *worker* (rather than an\
    \ array of functions) and a *concurrency* value (the maximum number of simultaneous\
    \ tasks the worker can process). Then it returns a queue that we can `push` arbitrary\
    \ task data onto (along with an optional callback).\n\nHere's a trivial example:\n\
    \n```\nvar async = require('async');\n\nfunction worker(data, callback) {\n  console.log(data);\n\
    \  callback()\n}\nvar concurrency = 2;\nvar queue = async.queue(worker, concurrency);\n\
    \nqueue.push(1);\nqueue.push(2);\nqueue.push(3);\n```\n\nNo matter what the concurrency\
    \ is (as long as it's at least 1), we get the output\n\n```\n1\n2\n3\n```\n\n\
    There is a difference under the hood, though: With concurrency of 2, we need two\
    \ trips to the event queue. If it were 1, we'd need three trips, one for each\
    \ line. And if it were 3 or more, we'd just need one trip.\n\nA queue with concurrency\
    \ of 0 will do nothing. And if you want maximum concurrency, just use Infinity.\n\
    \n## Pushing tasks\n\nAlthough `queue.push` shares the same name as `[].push`,\
    \ there are two critical differences:\n\nFirst,\n\n```\nqueue.push([1, 2, 3]);\n\
    ```"
  mdcn: "\n`readReduce` 在第一个回调参数中使用 `null` 是什么意思，为什么在没有错误时传递 `null`？请参见下一节。\n\n##\
    \ Async.js 中的错误处理\n\n注意，我们提供给 `async.filter` 的迭代器 `isFilename` 将布尔值作为第一个参数传递给它的回调。相比之下，`readAndConcat`\
    \ 将错误作为第一个参数传递给回调。为什么？\n\nAsync.js 使用 Node 风格的回调：第一个回调参数是错误。**产生布尔值的方法的回调是这条规则的例外。**\
    \ 这意味着集合方法（`filter`、`reject`、`detect`、`some` 和 `every`）的迭代器无法报告错误。这要怪 Node 的 `path.exists`\
    \ 开了这个先例，而 Async.js 忠实地遵循了这一惯例。\n\n当一个普通迭代器将 `null` 或 `undefined` 以外的值作为第一个参数传递给回调时，Async\
    \ 会立即调用完成回调并传入该错误。因此，在上面的代码中，如果 `fs.readFile` 在回调中收到错误，它会将其传递给 `readAndConcat`\
    \ 回调，这会短路 `async.forEachSeries`，导致错误立即从我们的 `onComplete` 函数中抛出。\n\n## 4.3 链式调用异步函数\n\
    \nAsync.js 的集合方法解决了将单个异步函数应用于数据序列的问题。但如果我们要处理的不是数据序列，而是一系列*函数*呢？\n\n这就是 `async.series`\
    \ 和 `async.waterfall` 的用武之地。每个方法都接受一个函数数组（*任务列表*）并按顺序执行它们，同时传入一个 Node 风格的回调。两者的区别在于，`async.series`\
    \ 仅向每个任务提供回调，而 `async.waterfall` 还会提供前一个任务的结果。（这里的\"结果\"指的是每个任务传递给回调的非错误值。）\n\n\
    让我们看一个使用超时的简单示例：\n\n```\nvar async = require('async');\nvar start = new Date();\n\
    async.series([\n  function(callback) { setTimeout(callback, 100); },\n  function(callback)\
    \ { setTimeout(callback, 300); },\n  function(callback) { setTimeout(callback,\
    \ 200); }\n], function(err, results) {\n  console.log('Completed in ' + (new Date()\
    \ - start) + 'ms');\n});\n```\n\n（在这个示例中，将 `async.waterfall` 替换为 `async.series`\
    \ 不会产生任何影响，因为每个任务的回调都是在没有参数的情况下运行的。）\n\n完成处理器将在 600 多毫秒后运行，因为数组中的每个任务按顺序依次完成。Async.js\
    \ 注入到每个任务函数中的回调只是询问：\"是否有错误（第一个参数）？如果没有，那么我将收集结果（第二个参数）并运行下一个任务。\"\n\n作为练习，让我们使用\
    \ `map` 将文件名数组转换为异步任务函数数组，来重写我们的顺序文件读取代码：\n\n```\nvar async = require('async');\n\
    var fs = require('fs');\nvar concatenation = '';\nvar fileTasks = fs.readdirSync('recipes')\n\
    \  .filter(function(filename) {\n    return fs.statSync(filename).isFile();\n\
    \  })\n  .map(function (filename, i) {\n    return function(callback) {\n    \
    \  fs.readFile(filename, 'utf8', callback);\n    };\n  });\nasync.series(fileTasks,\
    \ function(err, results) {\n  if (err) throw err;\n  console.log(concatenation\
    \ = results.join(''));\n});\n```\n\n注意，我们可以方便地将任务回调直接提供给 `fs.readFile`，因为它使用了常规的\
    \ Node 回调签名：`(err, result)`。如果我们的任何 readFile 尝试确实导致了错误，series 将会终止，并且完成处理器会立即被调用并传入该错误。\n\
    \n## 4.4 并行化异步函数\n\n假设我们想一次性读取所有文件（暂时忽略文件系统的限制）。如果不使用 Async.js，我们可能会尝试将读取状态存储在一个数组中，如下所示：\n\
    \n```\nvar fs = require('fs');\nvar dirContents = [];\nfs.readdirSync('recipes')\n\
    \  .filter(function(filename) {\n    return fs.statSync(filename).isFile();\n\
    \  })\n  .forEach(function(filename, i) {\n    fs.readFile(filename, 'utf8', function(err,\
    \ fileContents) {\n      if (err) throw err;\n      dirContents[i] = fileContents;\n\
    \    });\n  });\n```\n\n只有一件事缺失了：我们想把这行代码\n\n```\nvar concatenation = dirContents.join('');\n\
    ```\n\n放在某个地方……但是放在*哪里*呢？它必须在一个完成处理器中运行，而该处理器需要在最后一个 fs.readFile 操作完成后触发。注意——这里的\"\
    最后\"指的是\"最后一个完成的\"，不一定是 i 值最大的那个。因此我们需要跟踪待处理的 readFile 回调数量，然后在该数量达到 0 时触发另一个回调。这就是所谓的*异步队列*模式。\n\
    \nAsync.js 使用诸如 async.forEach 和 async.map 之类的集合方法为我们完成了所有这些工作，它们的 API 与我们之前使用的顺序版本相同。但还有一个更通用的方法可以使用，那就是\
    \ async.parallel。与 async.series 一样，它接受一个形式为 function(callback) {...} 的函数数组，以及一个（可选的）完成处理器。让我们重复之前的超时示例：\n\
    \n```\nvar async = require('async');\nvar start = new Date();\nasync.parallel([\n\
    \  function(callback) { setTimeout(callback, 100); },\n  function(callback) {\
    \ setTimeout(callback, 300); },\n  function(callback) { setTimeout(callback, 200);\
    \ }\n], function(err, results) {\n  console.log('Completed in ' + (new Date()\
    \ - start) + 'ms');\n});\n```\n\nasync.series 需要超时时间之和（约 600ms）才能完成，而 async.parallel\
    \ 只需要最长的超时时间（约 300ms）。\n\n方便的是，Async.js 将结果按照任务数组对应的顺序传递给完成处理器，而不是按照结果生成的顺序。这意味着我们可以用与顺序版本完全相同的方式编写同时读取文件的代码——只需将\
    \ async.series 替换为 async.parallel：\n\n```\nvar async = require('async');\nvar\
    \ fs = require('fs');\nvar concatenation = '';\nvar fileTasks = fs.readdirSync('recipes')\n\
    \  .filter(function(filename) {\n    return fs.statSync(filename).isFile();\n\
    \  })\n  .map(function (filename, i) {\n    return function(callback) {\n    \
    \  fs.readFile(filename, 'utf8', callback);\n    };\n  });\nasync.parallel(fileTasks,\
    \ function(err, results) {\n  if (err) throw err;\n  console.log(concatenation\
    \ = results.join(''));\n});\n```\n\n### 全部同时执行，还是一次一个？\n\nasync.series 和 async.parallel\
    \ 为两种常见的异步模式提供了简单、统一的接口。但它们也有局限性：\n\n- 1. 任务数组是静态的。一旦调用了 async.series 或 async.parallel，就无法添加或删除任务。\n\
    2. 也无法查询\"已经完成了多少个任务？\"它是一个黑盒，除非你从任务本身发送更新。\n3. 你要么完全没有并发，要么是无限并发。\n\n最后一点在文件读取方面是一个相当大的问题。如果一个目录中有数千个文件，我们不想通过串行执行而变得低效，但如果尝试并行读取所有文件，很可能会激怒操作系统。我们可以将任务数组分成块，然后依次并行执行每个块……但这并不太优雅。\n\
    \n值得庆幸的是，Async.js 提供了一个方法来解决所有这些问题：async.queue。\n\n## 4.5 动态异步队列\n\nasync.queue\
    \ 的基本概念类似于 DMV（机动车辆管理局）：他们可以同时处理多个人（最多为值班职员的数量），但不是为每个职员设置单独的队伍，而是只有一个号码牌堆。当你到达时，你会拿到一个号码。当一个职员空闲时，他们叫下一个号码。这是一个非常高效的系统——非常适合我们的文件读取示例。\n\
    \nasync.queue 的接口比 `async.series` 和 `async.parallel` 更复杂一些。它接受一个称为 *worker* 的函数（而不是函数数组）和一个\
    \ *concurrency* 值（worker 可以同时处理的最大任务数）。然后返回一个队列，我们可以向其中 `push` 任意任务数据（以及一个可选的回调）。\n\
    \n下面是一个简单的示例：\n\n```\nvar async = require('async');\n\nfunction worker(data, callback)\
    \ {\n  console.log(data);\n  callback()\n}\nvar concurrency = 2;\nvar queue =\
    \ async.queue(worker, concurrency);\n\nqueue.push(1);\nqueue.push(2);\nqueue.push(3);\n\
    ```\n\n无论并发数是多少（只要至少为 1），我们都会得到输出\n\n```\n1\n2\n3\n```\n\n不过底层是有区别的：并发数为 2 时，我们需要两次事件循环。如果并发数为\
    \ 1，我们需要三次事件循环，每次处理一行。如果并发数为 3 或更多，我们只需要一次事件循环。\n\n并发数为 0 的队列将不会执行任何操作。如果你想获得最大并发数，只需使用\
    \ Infinity。\n\n## 推送任务\n\n虽然 `queue.push` 与 `[].push` 名称相同，但有两个关键区别：\n\n首先，\n\n\
    ```\nqueue.push([1, 2, 3]);\n```\n"
