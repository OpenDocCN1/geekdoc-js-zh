  - "[PAGE 83]\n\nAsync Problems and Solutions\n\n+   2. Call next with no arguments.\n\
    3. Call next with an error argument.\n\nThe next callback Connect generates either\
    \ passes the request on to the next middleware on the stack, or to an error handler.\
    \ And that's basically all Connect does. This simple pattern (the core implementation\
    \ is less than 200 lines¹) has proven so successful that just about every Node\
    \ server framework has been built on top of Connect, most notably Express.js.\n\
    \nConsider using the middleware pattern in other contexts where an action needs\
    \ to be handled in several discrete steps. The only difference between a middleware\
    \ stack and an ordinary callback stack (like we saw in Chapter 2) is that each\
    \ function on the stack receives a next function that allows it to declare that\
    \ it's finished, making an async series of actions possible. Here's a minimal\
    \ implementation for comparison's sake:\n\n```\n// callback stack\nfunction trigger()\
    \ {\n  handlers.forEach(function(handler) {\n    handler();\n  });\n}\n\n// middleware\
    \ stack\nfunction trigger() {\n  invoke(0);\n}\nfunction invoke(idx) {\n  if (handlers.length\
    \ <= idx) {\n    return;\n  } else {\n    handlers[idx](function(err) {\n    \
    \  if (err) throw err;\n      if (handlers.length > idx + 1) invoke(idx + 1);\n\
    \    });\n  }\n}\n```\n\nPerceptive readers may be reminded of async.series from\
    \ Chapter 4. Connecting functions this way is an extremely common pattern. Feel\
    \ free to reinvent the wheel, but be aware that the wheel is already available\
    \ under the MIT License.\n\n¹https://github.com/senchalabs/connect/blob/master/lib/proto.js"
