  md: 'you should understand that


    ```

    func(function(arg) { return next(arg); });

    ```


    is just a needlessly verbose way of writing


    ```

    func(next);

    ```


    except when next needs to be invoked in a particular context. (See Reg Brathwaite’s
    excellent article “Captain Obvious on JavaScript.”)


    Some familiarity with jQuery and Node.js will be helpful in understanding the
    examples, but the principles and most of the tools we’ll be discussing are applicable
    to all JavaScript environments.


    What you *don’t* need to know is how asynchronous events are scheduled in JavaScript.
    We’ll cover that in the next chapter.


    # Resources for learning JavaScript


    As JavaScript has become the *lingua franca* of the web, a vast number of informative
    books, courses, and sites have appeared. Here are a few that I recommend:


    +   • For the absolute beginner (someone with no programming experience at all),
    I recommend the interactive tutorial site Codecademy.³

    • Learners interested in a more formal, mathematical approach should dive into
    Marijn Haverbeke’s *Eloquent JavaScript*.⁴

    • For those coming from another language, JavaScript and jQuery (the ubiquitous
    browser library) are often taught together. CodeSchool⁷ offers a fun, interactive
    course called *jQuery Air* that also includes a short and sweet overview of the
    JavaScript language.

    • Intermediate JavaScripters should peruse the beautiful JavaScript Garden⁸ for
    an in-depth look at some key topics.


    ³ https://github.com/raganwald/homoiconic/blob/master/2012/01/captain-obvious-on-javascript.md

    ⁴ http://www.codecademy.com/

    ⁵ http://www.amazon.com/gp/product/1593272820/ref=as_li_ss_tl?ie=UTF8&tag=trevorburnham-20&linkCode=as2&camp=1789&creative=390957&creativeASIN=1593272820

    ⁷ http://zfer.us/yx0J2

    ⁸ http://bonsaiden.github.com/JavaScript-Garden/'
