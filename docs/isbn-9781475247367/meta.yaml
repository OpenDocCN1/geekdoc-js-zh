- md: "## Preface\n\nJavaScript is an expressive, powerful, and uniquely versatile\
    \ language. But every language has its limitations. Originally devised to enhance\
    \ web pages viewed with Netscape 2.0, JavaScript is now faced with being a single-threaded\
    \ language in a multimedia, multi-tasking, multi-core world.\n\nYet JavaScript\
    \ has not only persevered since 1995, it's thrived. Potential rivals in the browser—Flash,\
    \ Silverlight, and Java applets, to name a few—have come and (more or less) gone\
    \ with the rise of HTML5. Meanwhile, when a programmer named Ryan Dahl wanted\
    \ to build a new framework for event-driven servers, he searched near and far\
    \ for a language that was both dynamic and single-threaded before realizing that\
    \ the answer was right in front of him. And so, Node.js was born, and JavaScript\
    \ became a force to be reckoned with as a server language.\n\nEvents, it turns\
    \ out, are a strong alternative to multi-threading. Event-based code avoids the\
    \ overhead of thread-switching, not to mention the mutexes, semaphores, and other\
    \ boilerplate needed to keep multi-threaded code safe. The challenge for JavaScript\
    \ programmers now is to free themselves from the Matryoshka doll style of programming:\
    \ callbacks nested in callbacks, one after another, until their text editors refuse\
    \ to add any more indentation. This terrifying code idiom has been dubbed the\
    \ *Pyramid of Doom*:²\n\n```\nstep1(function(result1) {\n  step2(function(result2)\
    \ {\n    step3(function(result3) {\n      ...\n    });\n  });\n});\n```\n\n\"\
    I love async, but I can't code like this,\" one dev famously complained on the\
    \ Node.js Google Group.³ But the problem isn't with the language itself; it's\
    \ with the patterns that programmers use with the language. Often, code that would\
    \ be trivial in a multi-threaded language becomes a tangled mess when ported to\
    \ JavaScript. Dealing with myriad asynchronous tasks is frontier territory in\
    \ JavaScript, just as it once was in Java, Ruby, and all the rest.\n\n**Let's\
    \ push the frontier forward.** Let's prove to the world that even the most complex\
    \ problems can be tackled with clean, elegant JavaScript code.\n\n² http://calcjast.org/blog/2011/12/14/why-coroutines-wont-work-on-the-web/\n\
    ³ https://groups.google.com/forum/#!topic/nodejs/wz5UdkPICWg\n\n## Who is this\
    \ book for?\n\nThis book is aimed at intermediate-to-advanced JavaScripters. You\
    \ should know how variables are scoped. Keywords like `typeof`, `arguments`, and\
    \ `this` shouldn't phase you. Perhaps most importantly, you should understand\
    \ that\n\n```\nfunc(function(arg) { return next(arg); });\n```\n\nis just a needlessly\
    \ verbose way of writing\n\n```\nfunc(next);\n```\n\nexcept when next needs to\
    \ be invoked in a particular context. (See Reg Braithwaite's excellent article\
    \ \"Captain Obvious on JavaScript.\")\n\nSome familiarity with jQuery and Node.js\
    \ will be helpful in understanding the examples, but the principles and most of\
    \ the tools we'll be discussing are applicable to all JavaScript environments.\n\
    \nWhat you *don't* need to know is how asynchronous events are scheduled in JavaScript.\
    \ We'll cover that in the next chapter.\n\n## Resources for learning JavaScript\n\
    \nAs JavaScript has become the *lingua franca* of the web, a vast number of informative\
    \ books, courses, and sites have appeared. Here are a few that I recommend:\n\n\
    - For the absolute beginner (someone with no programming experience at all), I\
    \ recommend the interactive tutorial site Codecademy.³\n- Learners interested\
    \ in a more formal, mathematical approach should dive into Marijn Haverbeke's\
    \ *Eloquent JavaScript*.⁴\n- For those coming from another language, JavaScript\
    \ and jQuery (the ubiquitous browser library) are often taught together. CodeSchool⁷\
    \ offers a fun, interactive course called *jQuery Air* that also includes a short\
    \ and sweet overview of the JavaScript language.\n- Intermediate JavaScripters\
    \ should peruse the beautiful JavaScript Garden⁸ for an in-depth look at some\
    \ key topics.\n\n³ https://github.com/raganwald/homoiconic/blob/master/2012/01/captain-obvious-on-javascript.md\n\
    ⁴ http://www.codecademy.com/\n⁵ http://www.amazon.com/gp/product/1593272820/ref=as_li_ss_tl?ie=UTF8&tag=trevorburnham-20&linkCode=as2&camp=1789&creative=390957&creativeASIN=1593272820\n\
    ⁷ http://zfer.us/yx0J2\n⁸ http://bonsaiden.github.com/JavaScript-Garden/\n\n##\
    \ Where to turn for help?\n\nWhen pondering questions like \"Should I use `typeof`\
    \ or `instanceof`?\" steer clear of the dated, ad-riddled W3Schools site (which\
    \ sadly tends to be favored by Google searches). Instead, jump to MDN,¹ the Mozilla\
    \ Developer Network. There, the makers of Firefox (including Brendan Eich, the\
    \ creator of JavaScript) have compiled a comprehensive guide to not only JavaScript,\
    \ but HTML and CSS as well. The site can be a bit overwhelming at first, but learn\
    \ your way around and a bounty of JavaScript expertise will be your reward.\n\n\
    If you can't find your answer on MDN, head to the Q&A site Stack Overflow.² The\
    \ site has fostered an amazingly helpful developer community, and any coherent\
    \ question tagged \"JavaScript\" or \"CoffeeScript\" will receive a prompt response.\n\
    \n## Code style in this book\n\nJavaScript has many stylistic dialects. For this\
    \ book, I've adopted the popular combination of two-space soft tabs and camelCased\
    \ identifiers.\n\nSlightly more esoterically, I've tried to adopt the chaining\
    \ convention favored by Reg Braithwaite, where indentation levels distinguish\
    \ different objects. For instance, I would write the jQuery expression\n\n```\n\
    $('h1').first().addClass('first').end().last().addClass('last');\n```\n\nas\n\n\
    ```\n$('h1')\n  .first()\n  .addClass('first')\n.end()\n  .last()\n  .addClass('last');\n\
    ```\n\nbecause the `end` method returns the same object as the original selector,\
    \ whereas `first` and `last` return something different.\n\nUnder Braithwaite's\
    \ terminology, the technique used in code like\n\n```\nturtle\n  .turnRight(90)\n\
    \  .moveForward(5);\n```\n\nis called *chaining* (because each method returns\
    \ the same object the method was called on), while the technique used in code\
    \ like\n\n```\n[1, 2, 3, 4, 5]\n    .filter(function(int) { return int % 2 ===\
    \ 1; })\n    .forEach(function(odd) { console.log(odd); })\n```\n\nis called *pipelining*,\
    \ since `filter` and `forEach` return different things.\n\n## A word on \"altJS\"\
    \n\nThere are a number of \"alternative JavaScripts\" out there: languages that\
    \ compile to JavaScript, adding on new features or making code easier to write.\
    \ (A fairly comprehensive list can be found at altJS.org.¹¹) This book is not\
    \ about them. It's about writing the best JavaScript possible without the use\
    \ of a pre-compiler. I have nothing against altJS (see the section on CoffeeScript\
    \ below), but I believe that it's important to understand the underlying language.\
    \ Some folks have called JavaScript \"the new assembly\" or \"the new bytecode\"\
    ; maybe it will be some day, but not yet.\n\nSome altJS languages are specifically\
    \ aimed at \"taming\" async callbacks by allowing them to be written in a more\
    \ synchronous style. A few of these languages are listed at the end of Chapter\
    \ 1.\n\n## CoffeeScript\n\nIt's no secret that I ♥ CoffeeScript, a super-succinct\
    \ language that compiles to JavaScript. I use it for my own projects whenever\
    \ I can. I've given talks on it at conferences like Railsconf and Sweden's Øredev.\
    \ I even wrote the first book on it: *CoffeeScript: Accelerated JavaScript Development*,¹²\
    \ published by the Pragmatic Programmers, plus a quick-reference guide for the\
    \ iPad¹³ with runnable examples.\n\nBut when I decided to start this book, I realized\
    \ that doing it in CoffeeScript would needlessly limit its appeal. By and large,\
    \ CoffeeScripters understand JavaScript perfectly well, whereas code like `square\
    \ = (x) -> x * x` might as well be hieroglyphics to JavaScript purists. So, if\
    \ you're a CoffeeScripter: My apologies for the curly braces.\n\nRest assured\
    \ that the lessons you draw from this book will carry over to any language you\
    \ use that compiles to JavaScript.\n\nEnough prefacing. Let's get our async on!\n\
    \n¹¹ http://altjs.org/\n¹² http://pragprog.com/book/tbcoffee/coffeescript\n¹³\
    \ http://bit.ly/zvdiKj"
  mdcn: "\n## 前言\n\nJavaScript 是一门富有表现力、功能强大且用途独特的语言。但每种语言都有其局限性。JavaScript 最初是为了增强在\
    \ Netscape 2.0 中浏览的网页而设计的，如今却面临着在一个多媒体、多任务、多核的世界中作为单线程语言运行的挑战。\n\n然而，JavaScript\
    \ 自 1995 年以来不仅顽强生存了下来，更是蓬勃发展。在浏览器中，潜在的竞争对手——比如 Flash、Silverlight 和 Java applets——随着\
    \ HTML5 的兴起已经来了又（大体上）去了。与此同时，当一位名叫 Ryan Dahl 的程序员想要为事件驱动服务器构建一个新框架时，他四处寻找一种既是动态语言又是单线程语言的工具，最后才意识到答案就在他眼前。于是，Node.js\
    \ 诞生了，JavaScript 作为一种服务器语言也成为一股不可忽视的力量。\n\n事实证明，事件是多线程的一个强有力替代方案。基于事件的代码避免了线程切换的开销，更不用说保持多线程代码安全所需的互斥锁、信号量以及其他样板代码了。现在\
    \ JavaScript 程序员面临的挑战是将自己从俄罗斯套娃式的编程风格中解放出来：回调嵌套着回调，一个接一个，直到他们的文本编辑器拒绝添加更多缩进。这种可怕的代码惯用法被戏称为*回调金字塔*：²\n\
    \n```\nstep1(function(result1) {\n  step2(function(result2) {\n    step3(function(result3)\
    \ {\n      ...\n    });\n  });\n});\n```\n\n“我爱异步，但我没法这样写代码，”一位开发者曾在 Node.js 的\
    \ Google 群组中如此抱怨。³ 但问题不在于语言本身，而在于程序员使用该语言的模式。通常，在多线程语言中很简单的代码，移植到 JavaScript 后就会变得一团糟。处理无数的异步任务是\
    \ JavaScript 的前沿领域，正如它曾经在 Java、Ruby 以及其他语言中一样。\n\n**让我们推动前沿前进。** 让我们向世界证明，即使是最复杂的问题也能用干净、优雅的\
    \ JavaScript 代码来解决。\n\n² http://calcjast.org/blog/2011/12/14/why-coroutines-wont-work-on-the-web/\n\
    ³ https://groups.google.com/forum/#!topic/nodejs/wz5UdkPICWg\n\n## 本书面向谁？\n\n\
    本书面向中级到高级的 JavaScript 开发者。你应该了解变量的作用域。像 `typeof`、`arguments` 和 `this` 这样的关键字不应该让你感到困惑。或许最重要的是，你应该理解\n\
    \n```\nfunc(function(arg) { return next(arg); });\n```\n\n除了 `next` 需要在特定上下文中调用的情况外（请参阅\
    \ Reg Braithwaite 的优秀文章《Captain Obvious on JavaScript》），这只是编写以下代码的一种冗长啰嗦的方式：\n\
    \n```\nfunc(next);\n```\n\n熟悉 jQuery 和 Node.js 会有助于理解示例，但我们将讨论的原则和大多数工具适用于所有 JavaScript\
    \ 环境。\n\n你*不需要*知道的是 JavaScript 如何调度异步事件。我们将在下一章介绍这一点。\n\n## 学习 JavaScript 的资源\n\
    \n随着 JavaScript 成为网络的*通用语言*，大量的信息书籍、课程和网站应运而生。以下是我推荐的一些：\n\n- 对于完全初学者（没有任何编程经验的人），我推荐交互式教程网站\
    \ Codecademy。³\n- 对更正式、数学化方法感兴趣的学习者应该深入阅读 Marijn Haverbeke 的《Eloquent JavaScript》。⁴\n\
    - 对于从其他语言转过来的开发者，JavaScript 和 jQuery（无处不在的浏览器库）通常是一起教授的。CodeSchool⁷ 提供了一个名为《jQuery\
    \ Air》的有趣交互式课程，其中也包含 JavaScript 语言的简明概览。\n- 中级 JavaScript 开发者应该浏览精美的 JavaScript\
    \ Garden⁸，以深入了解一些关键主题。\n\n³ https://github.com/raganwald/homoiconic/blob/master/2012/01/captain-obvious-on-javascript.md\n\
    ⁴ http://www.codecademy.com/\n⁵ http://www.amazon.com/gp/product/1593272820/ref=as_li_ss_tl?ie=UTF8&tag=trevorburnham-20&linkCode=as2&camp=1789&creative=390957&creativeASIN=1593272820\n\
    ⁷ http://zfer.us/yx0J2\n⁸ http://bonsaiden.github.com/JavaScript-Garden/\n\n##\
    \ 在哪里寻求帮助？\n\n当思考诸如“我应该使用 `typeof` 还是 `instanceof`？”之类的问题时，请避开过时且广告泛滥的 W3Schools\
    \ 网站（遗憾的是它往往被 Google 搜索优先推荐）。相反，请直接前往 MDN¹，即 Mozilla 开发者网络。在那里，Firefox 的创建者（包括\
    \ JavaScript 的创造者 Brendan Eich）编写了一份不仅涵盖 JavaScript，还涵盖 HTML 和 CSS 的全面指南。该网站一开始可能让人有些应接不暇，但一旦熟悉，你将获得丰富的\
    \ JavaScript 专业知识。\n\n如果在 MDN 上找不到答案，可以前往问答网站 Stack Overflow²。该网站培育了一个极具帮助性的开发者社区，任何标记为“JavaScript”或“CoffeeScript”的连贯问题都会得到迅速响应。\n\
    \n## 本书中的代码风格\n\nJavaScript 有许多风格上的变体。对于本书，我采用了流行的双空格软制表符和驼峰命名标识符的组合。\n\n稍微更专业一点的是，我试图采用\
    \ Reg Braithwaite 所青睐的链式调用约定，其中缩进级别用于区分不同的对象。例如，我会将 jQuery 表达式\n\n```\n$('h1').first().addClass('first').end().last().addClass('last');\n\
    ```\n\n写成\n\n```\n$('h1')\n  .first()\n  .addClass('first')\n.end()\n  .last()\n\
    \  .addClass('last');\n```\n\n因为 `end` 方法返回与原始选择器相同的对象，而 `first` 和 `last` 返回的是不同的东西。\n\
    \n按照 Braithwaite 的术语，在类似\n\n```\nturtle\n  .turnRight(90)\n  .moveForward(5);\n\
    ```\n\n代码中使用的技术被称为*链式调用*（因为每个方法都返回调用该方法的同一对象），而在类似\n\n```\n[1, 2, 3, 4, 5]\n \
    \   .filter(function(int) { return int % 2 === 1; })\n    .forEach(function(odd)\
    \ { console.log(odd); })\n```\n\n代码中使用的技术被称为*管道调用*，因为 `filter` 和 `forEach` 返回的是不同的东西。\n\
    \n## 关于“altJS”的说明\n\n目前市面上有许多“替代 JavaScript”的语言：它们编译成 JavaScript，并添加新功能或使代码更易于编写。（一个相当全面的列表可以在\
    \ altJS.org¹¹ 上找到。）本书不涉及它们。本书讨论的是如何在不使用预编译器的情况下编写尽可能好的 JavaScript。我并不反对 altJS（见下文关于\
    \ CoffeeScript 的部分），但我认为理解底层语言很重要。有些人称 JavaScript 为“新的汇编语言”或“新的字节码”；也许有一天会如此，但目前还不是。\n\
    \n一些 altJS 语言专门旨在通过允许以更同步的风格编写异步回调来“驯服”异步。其中一些语言在第一章末尾列出。\n\n## CoffeeScript\n\
    \n我♥ CoffeeScript，一门编译成 JavaScript 的超简洁语言，这已不是秘密。只要有可能，我就会在自己的项目中使用它。我曾在 Railsconf\
    \ 和瑞典的 Øredev 等会议上就它做过演讲。我甚至写了关于它的第一本书：《CoffeeScript: Accelerated JavaScript Development》¹²，由\
    \ Pragmatic Programmers 出版，以及一本用于 iPad 的快速参考指南¹³，其中包含可运行的示例。\n\n但当我决定开始写这本书时，我意识到用\
    \ CoffeeScript 写会不必要地限制它的吸引力。总体而言，CoffeeScript 用户完全理解 JavaScript，而对于 JavaScript\
    \ 纯粹主义者来说，像 `square = (x) -> x * x` 这样的代码简直就是象形文字。所以，如果你是一位 CoffeeScript 用户：对于花括号的使用，我深表歉意。\n\
    \n请放心，你从本书中获得的经验教训将适用于你使用任何编译成 JavaScript 的语言。\n\n前言到此结束。让我们开始异步之旅吧！\n\n¹¹ http://altjs.org/\n\
    ¹² http://pragprog.com/book/tbcoffee/coffeescript\n¹³ http://bit.ly/zvdiKj\n"
