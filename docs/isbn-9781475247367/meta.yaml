  - "[PAGE 8]\n\n# Preface\n\nJavaScript is an expressive, powerful, and uniquely\
    \ versatile language. But every language has its limitations. Originally devised\
    \ to enhance web pages viewed with Netscape 2.0, JavaScript is now faced with\
    \ being a single-threaded language in a multimedia, multi-tasking, multi-core\
    \ world.\n\nYet JavaScript has not only persevered since 1995, it's thrived. Potential\
    \ rivals in the browser—Flash, Silverlight, and Java applets, to name a few—have\
    \ come and (more or less) gone with the rise of HTML5. Meanwhile, when a programmer\
    \ named Ryan Dahl wanted to build a new framework for event-driven servers, he\
    \ searched near and far for a language that was both dynamic and single-threaded\
    \ before realizing that the answer was right in front of him. And so, Node.js\
    \ was born, and JavaScript became a force to be reckoned with as a server language.\n\
    \nEvents, it turns out, are a strong alternative to multi-threading. Event-based\
    \ code avoids the overhead of thread-switching, not to mention the mutexes, semaphores,\
    \ and other boilerplate needed to keep make multi-threaded code safe. The challenge\
    \ for JavaScript programmers now is to free themselves from the Matryoshka doll\
    \ style of programming: callbacks nested in callbacks, one after another, until\
    \ their text editors refuse to add any more indentation. This terrifying code\
    \ idiom has been dubbed the *Pyramid of Doom*:²\n\n```\nstep1(function(result1)\
    \ {\n  step2(function(result2) {\n    step3(function(result3) {\n      ...\n \
    \   });\n  });\n});\n```\n\n“I love async, but I can’t code like this,” one dev\
    \ famously complained on the Node.js Google Group.³ But the problem isn’t with\
    \ the language itself; it’s with the patterns that programmers use with the language.\
    \ Often, code that would be trivial in a multi-threaded language becomes a tangled\
    \ mess when ported to JavaScript. Dealing with myriad asynchronous tasks is frontier\
    \ territory in JavaScript, just as it once was in Java, Ruby, and all the rest.\n\
    \n**Let’s push the frontier forward.** Let’s prove to the world that even the\
    \ most complex problems can be tackled with clean, elegant JavaScript code.\n\n\
    # Who is this book for?\n\nThis book is aimed at intermediate-to-advanced JavaScripters.\
    \ You should know how variables are scoped. Keywords like `typeof`, `arguments`,\
    \ and `this` shouldn't phase you. Perhaps most importantly,\n\n² http://calcjast.org/blog/2011/12/14/why-coroutines-wont-work-on-the-web/\n\
    ³ https://groups.google.com/forum/#!topic/nodejs/wz5UdkPICWg"
