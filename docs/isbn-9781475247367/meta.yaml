    # ES6 and Task.js


    ECMAScript 6 (currently a work in progress but available in Firefox) adds a new
    feature called **generators**. A generator is a function containing a `yield`
    keyword that allows you to run an asynchronous function in such a way that it
    blocks only the generator, making a callback unnecessary. Generators themselves
    are a bit tricky to wrap your head around, but a Mozilla project called Task.js[^1]
    makes them easier by providing a standard API built on Promises. (Promises are
    the subject of an upcoming chapter.)


    This might just be the future of JavaScript. Unfortunately, it''ll be a while
    before the spec becomes official, and many years before every browser in the world
    supports generators...


    # TameJS


    The awesome programmers at OkCupid have created a clever pre-compiler[^2] with
    over 500 GitHub followers that adds two keywords to JavaScript, `await` and `defer`.
    An `await` block acts much like a generator, defining code that won''t return
    until each async task defined with `defer` has been completed.


    The Tame.js folks have also created a CoffeeScript fork with `await`/`defer` called
    IcedCoffeeScript[^3].


    # StratifiedJS


    StratifiedJS is an alternative to the `yield` paradigm that offers finer-grained
    control structures, with intuitive names like `waitfor` and `resume`. Although
    not widely used, it''s received praise from the likes of John Resig, the creator
    of jQuery. And its creator, Oni Labs, has ambitious plans for it.


    Note that StratifiedJS is the name of the specification, not the implementation.
    The official reference implementation is called Oni Apollo[^4].


    # Kaffeine


    If you can''t quite wrap your head around `yield`/`await`, Kaffeine offers a simple
    syntactic sugar: Just add `!` after an async function''s name. Kaffeine assumes
    that the function takes a callback as its last argument, and simply transforms
    all code after that function call into the callback. So, for example:


    ```

    var sleep = function(delay, callback) { setTimeout(callback, delay); }

    console.log(''Wait a second...'');

    sleep(1000)

    console.log(''OK, that was one second.'');

    ```'
  - '[PAGE 23]


    Although it doesn''t have as big a following as CoffeeScript, features like this
    make Kaffeine well worth checking out.


    # Streamline.js


    Like Kaffeine, Streamline.js'' allows you to use a special syntax to treat async
    functions as synchronous: Just use _ in place of the callback. Interestingly,
    Streamline can generate either standard callback-driven JavaScript or fiber-based
    code for node-fibers (see below). Also, unlike most other JavaScript precompilers,
    Streamline can be used in conjunction with CoffeeScript.


    Note that both Kaffeine and Streamline depend on callbacks following the argument
    list convention (err, results...), which is ubiquitous in the Node world but less
    common in browsers.


    # node-fibers


    While the other projects above merely compile to plain JavaScript, node-fibers10
    actually extends the language understood by the Node.js runtime by adding thread-like
    constructs called fibers. The main advantage of node-fibers over JS precompilers
    is debugging. The line numbers in node-fiber stack traces correspond to the line
    numbers in node-fiber source code, and exceptions thrown from fibers behave much
    more nicely than exceptions thrown from async callbacks do.


    It''s a very cool project with a small but passionate following. Just be warned
    that it doesn''t always play nice with mainstream Node tools.


    We''ve seen in this chapter how JavaScript''s single-threadedness is both a blessing
    and a curse. In the right hands, it makes for beautiful code free of the terrifying
    race conditions that plague multi-threaded apps. But you need to develop the right
    mindset—and the right techniques.


    It bears mention here that there is one kind of multi-threading in JavaScript:
    You can spawn worker processes. Each spawned process can exchange data with other
    processes under the same limitations as any other I/O. These make it possible
    to utilize multiple cores, without breaking the normal rules of JavaScript (code
    can''t be interrupted; variables are only accessible within their scope). For
    more on workers, skip ahead to the penultimate chapter of this book.


    In the next chapter, we''ll talk about organizing and stacking event callbacks.
    If we do our job right, our async apps should have as many callbacks as you can
    think of—each with a clear, narrow purpose.


    9 https://github.com/Sage/streamlinejs

    10 https://github.com/laverdet/node-fibers'
- md: "## 2 分布式事件\n\n在上一章中，我们探讨了JavaScript中异步事件的工作原理。但在实践中，我们应该如何处理这些事件呢？\n\n这可能听起来像个傻问题。只需为你的应用关心的每个事件附加一个处理器，对吧？但当一个事件产生多种后果时，“一个事件，一个处理器”的方法迫使处理器变得*极其*庞大。\n\
    \n以基于Web的文字处理器（如Google Docs）为例。当用户按下按键时，需要发生多件事情：新字符必须被添加到DOM中并且光标移动；操作必须被推送到撤销历史记录并同步到服务器；新单词必须进行拼写检查；字数和页数可能需要更新。从单个事件处理器中执行所有这些任务乃至更多，是一个艰巨的任务。\n\
    \n从机械的角度来看，我们希望在响应事件时执行的每项任务确实都必须从事件处理器启动。但为了我们人类的便利，通常最好用一个更灵活、动态的构造来替代那个一刀切的事件处理器——一个我们可以随时添加任务和移除任务的构造。简而言之，我们想使用*分布式事件*，其中一个事件可以触发整个应用程序中的反应。\n\
    \n在本章中，我们将学习PubSub模式和事件化模型，它们是JavaScript应用程序中越来越普遍的特性。我们还将看看jQuery中的自定义事件，并认识一个名为LucidJS的新库，它非常适合将PubSub对象连接在一起。\n\
    \n### 2.1 PubSub\n\n自从JavaScript诞生以来，浏览器就允许将事件处理器附加到DOM元素，像这样：\n\n```\nlink.onclick\
    \ = clickHandler;\n```\n\n啊，极其简单！只有一个注意事项：如果你想为一个元素设置*两个*点击处理器，你就必须用一个包装函数自己将它们聚合起来：\n\
    \n```\nlink.onclick = function() {\n  clickHandler1.apply(this, arguments);\n\
    \  clickHandler2.apply(this, arguments);\n};\n```\n\n这不仅乏味，也是导致处理器函数臃肿、万能的根源。\n\
    这就是为什么W3C在2000年将`addEventListener`添加到DOM规范中，而jQuery用`bind`方法对其进行了抽象。`bind`可以轻松地为任何元素（或元素集）上的任何事件添加任意数量的处理器，而不用担心妨碍其他人：\n\
    \n```\n$(link)\n    .bind('click', clickHandler1)\n    .bind('click', clickHandler2);\n\
    ```\n\n（在jQuery 1.7+中，新的`on`语法<sup>1</sup>比`bind`更受青睐。还有`click(...)`方法，它是`bind('click',\
    \ ...)`的简写；然而，我更喜欢始终使用更强大的`bind`/`on`。）\n\n从软件架构的角度来看，jQuery正在向任何想要订阅的人发布`link`元素的事件。因此有了术语“PubSub”。\n\
    \n鉴于DOM的经验教训，Node的API设计者摒弃了`object.onevent = ...`技术，转而采用一个名为`EventEmitter`的通用PubSub接口。Node中几乎每个I/O源都是一个EventEmitter：文件流、HTTP服务器，甚至应用程序进程本身。例如：\n\
    \n```\n['julz', 'norah', 'fiona'].forEach(function(name) {\n    process.on('exit',\
    \ function() {\n        console.log('Goodbye, ' + name);\n    });\n});\n```\n\n\
    浏览器上存在无数纯PubSub实现。此外，像Backbone.js和Spine这样的许多MVC库也提供了它们自己的EventEmitter类似模块。我们将在本章后面讨论这些。\n\
    \n### EventEmitter\n\n让我们以Node的EventEmitter作为PubSub接口的一个例子。它有一个简单的、近乎最小化的设计。\n\
    要向EventEmitter添加事件处理器，只需调用`on`并传入事件类型和处理器：\n\n```\nemitter.on('evacuate', function(message)\
    \ {\n    console.log(message);\n});\n```\n\n恰如其名的`emit`方法发出给定类型的事件。例如，\n`emitter.emit('evacuate');`\n\
    会调用所有的`'evacuate'`处理器。\n（注意，这里的术语“事件”与事件队列无关。请参见下面的“同步性”部分。）\n你可以在发出事件时添加任意数量的附加参数。所有参数都会传递给所有处理器：\n\
    \n```\nemitter.emit('evacuate', 'Woman and children first!');\n```\n\n对事件名称没有限制，不过Node文档提供了一个有用的约定：\n\
    通常，事件名称用驼峰式字符串表示。\nEventEmitter的所有方法都是公共的，但通常的约定是事件只从EventEmitter“内部”发出。相反，通常的约定禁止EventEmitter将处理器附加到自身。\n\
    \n### 自己动手实现PubSub\n\nPubSub实现非常简单，我们可以在大约十几行代码中创建一个。我们需要存储的唯一状态是每个我们支持的事件类型的处理器列表：\n\
    \n```\nPubSub = {handlers: {}}\n```\n\n当我们添加一个监听器时，我们将其推送到数组的末尾（这意味着监听器将总是按照它们被添加的顺序被调用）：\n\
    \n```\nPubSub.on = function(eventType, handler) {\n    if (!(eventType in this.handlers))\
    \ {\n        this.handlers[eventType] = [];\n    }\n    this.handlers[eventType].push(handler);\n\
    \    return this;\n}\n```\n\n然后，当一个事件被发出时，我们遍历所有处理器：\n\n```\nPubSub.emit = function(eventType)\
    \ {\n    var handlerArgs = Array.prototype.slice.call(arguments, 1);\n    for\
    \ (var i = 0; i < this.handlers[eventType].length; i++) {\n        this.handlers[eventType][i].apply(this,\
    \ handlerArgs);\n    }\n    return this;\n}\n```\n\n就这样：我们刚刚实现了Node `EventEmitter`的核心。（我们唯一缺少的主要功能是移除处理器和附加一次性处理器的能力。）\n\
    \n当然，PubSub实现在功能上略有不同。当jQuery团队注意到库中使用了多种不同的PubSub实现时，他们决定在jQuery 1.7中用`$.Callbacks`来抽象它们。<sup>2</sup>\
    \ 你可以不使用数组来存储与事件类型对应的处理器，而是使用一个`$.Callbacks`实例，它接受几个选项：\n\n+   - **once**：回调列表只会触发一次。这用于Promise，我们将在后面的章节中学习。\n\
    - **memory**：如果在添加新回调时回调列表已经触发过，新回调会立即被调用。同样，这主要是为了Promise。\n- **stopOnFalse**：如果一个回调返回`false`，则该事件将不再调用其他回调。如果你熟悉jQuery事件，这应该听起来很熟悉。\n\
    - **unique**：如果某个特定的回调已经被附加过，尝试再次附加它将被忽略。\n\n奇怪的是，`$.Callbacks`将其选项作为一个以空格分隔的字符串：\n\
    \n```\n$.Callbacks('unique memory');\n```\n\n更常见的是，许多PubSub实现会解析事件字符串以提供特殊功能。例如，你可能熟悉jQuery中的命名空间事件，我可以通过绑定一个\"\
    click.uniqueName\"事件以便于后续解绑。Backbone.js（我们很快会更多地了解）允许你将处理器绑定到\"all\"事件类型，使得它们在任何事件发生时都会触发。jQuery和Backbone都允许你通过用空格分隔（例如\
    \ \"keypress mousemove\"）来同时绑定或发出多个事件类型。\n\n### 同步性\n\n尽管PubSub是处理异步事件的一项重要技术，但它本身并没有任何异步的特性。考虑这段代码：\n\
    \n```\n$('input[type=submit]')\n  .on('click', function() { console.log('foo');\
    \ })\n  .trigger('click');\nconsole.log('bar');\n```\n\n输出是\n\n```\nfoo\nbar\n\
    ```\n\n证明`click`处理器是由`trigger`立即调用的。事实上，每当一个事件触发时，它的所有处理器都会按顺序执行，不会中断。\n\n所以让我们明确一点：当用户点击“提交”按钮时，那是一个*异步事件*：第一个点击处理器从事件队列中触发。但作为一个整体，因该点击而发生的一切都是*同步的*，除非某个点击处理器使用了像`setTimeout`这样的东西。这很重要，因为如果太多处理器连续触发，你就有阻塞线程并使浏览器无响应的风险。\n\
    \n回想一下本章开头文字处理器的例子。当用户按键时，需要发生很多件事，其中一些可能需要非常复杂的计算。在返回事件队列之前完成所有这些事情，将是应用程序无响应的根源。\n\
    \n一个好的解决方案是维护一个你自己的队列，用于存放不需要立即处理的事情，并使用定时函数来定期处理队列。\n\n### 2.2 事件化模型\n\nPubSub的一个特例是，当一个用于存储数据的对象（“模型”）在其内容被修改时发出事件。让我们看看流行的Backbone.js[^3]框架，它曾被37signals、Pandora和*《纽约时报》*等公司使用。你可以这样创建一个新模型：\n\
    \n```\nstyle = new Backbone.Model(\n  {font: 'Georgia'}\n);\n```\n\n`model`只表示传入的简单对象：\n\
    \n```\nstyle.toJSON()  // {font: 'Georgia'}\n```\n\n但与普通对象不同的是，这个对象可以在发生更改时发布通知：\n\
    \n```\nstyle.on('change:font', function(model, font) {\n  alert('Thank you for\
    \ choosing ' + font + '!');\n});\n```\n\n> [^3]: http://documentcloud.github.com/backbone/"
  mdcn: "\n## 2 分布式事件\n\n在上一章中，我们探讨了JavaScript中异步事件的工作原理。但在实践中，我们应该如何处理这些事件呢？\n\n\
    这可能听起来像个傻问题。只需为你应用关心的每个事件附加一个处理器，对吧？但当一个事件产生多种后果时，“一个事件，一个处理器”的方法迫使处理器变得*极其*庞大。\n\
    \n以基于Web的文字处理器（如Google Docs）为例。当用户按下按键时，需要发生多件事情：新字符必须被添加到DOM中并且光标移动；操作必须被推送到撤销历史记录并同步到服务器；新单词必须进行拼写检查；字数和页数可能需要更新。从单个事件处理器中执行所有这些任务乃至更多，是一个艰巨的任务。\n\
    \n从机械的角度来看，我们希望在响应事件时执行的每项任务确实都必须从事件处理器启动。但为了我们人类的便利，通常最好用一个更灵活、动态的构造来替代那个一刀切的事件处理器——一个我们可以随时添加任务和移除任务的构造。简而言之，我们想使用*分布式事件*，其中一个事件可以触发整个应用程序中的反应。\n\
    \n在本章中，我们将学习PubSub模式和事件化模型，它们是JavaScript应用程序中越来越普遍的特性。我们还将看看jQuery中的自定义事件，并认识一个名为LucidJS的新库，它非常适合将PubSub对象连接在一起。\n\
    \n### 2.1 PubSub\n\n自从JavaScript诞生以来，浏览器就允许将事件处理器附加到DOM元素，像这样：\n\n```\nlink.onclick\
    \ = clickHandler;\n```\n\n啊，极其简单！只有一个注意事项：如果你想为一个元素设置*两个*点击处理器，你就必须用一个包装函数自己将它们聚合起来：\n\
    \n```\nlink.onclick = function() {\n  clickHandler1.apply(this, arguments);\n\
    \  clickHandler2.apply(this, arguments);\n};\n```\n\n这不仅乏味，也是导致处理器函数臃肿、万能的根源。\n\
    这就是为什么W3C在2000年将`addEventListener`添加到DOM规范中，而jQuery用`bind`方法对其进行了抽象。`bind`可以轻松地为任何元素（或元素集）上的任何事件添加任意数量的处理器，而不用担心妨碍其他人：\n\
    \n```\n$(link)\n    .bind('click', clickHandler1)\n    .bind('click', clickHandler2);\n\
    ```\n\n（在jQuery 1.7+中，新的`on`语法<sup>1</sup>比`bind`更受青睐。还有`click(...)`方法，它是`bind('click',\
    \ ...)`的简写；然而，我更喜欢始终使用更强大的`bind`/`on`。）\n\n从软件架构的角度来看，jQuery正在向任何想要订阅的人发布`link`元素的事件。因此有了术语“PubSub”。\n\
    \n鉴于DOM的经验教训，Node的API设计者摒弃了`object.onevent = ...`技术，转而采用一个名为`EventEmitter`的通用PubSub接口。Node中几乎每个I/O源都是一个EventEmitter：文件流、HTTP服务器，甚至应用程序进程本身。例如：\n\
    \n```\n['julz', 'norah', 'fiona'].forEach(function(name) {\n    process.on('exit',\
    \ function() {\n        console.log('Goodbye, ' + name);\n    });\n});\n```\n\n\
    浏览器上存在无数纯PubSub实现。此外，像Backbone.js和Spine这样的许多MVC库也提供了它们自己的EventEmitter类似模块。我们将在本章后面讨论这些。\n\
    \n### EventEmitter\n\n让我们以Node的EventEmitter作为PubSub接口的一个例子。它有一个简单的、近乎最小化的设计。\n\
    要向EventEmitter添加事件处理器，只需调用`on`并传入事件类型和处理器：\n\n```\nemitter.on('evacuate', function(message)\
    \ {\n    console.log(message);\n});\n```\n\n恰如其名的`emit`方法发出给定类型的事件。例如，\n`emitter.emit('evacuate');`\n\
    会调用所有的`'evacuate'`处理器。\n（注意，这里的术语“事件”与事件队列无关。请参见下面的“同步性”部分。）\n你可以在发出事件时添加任意数量的附加参数。所有参数都会传递给所有处理器：\n\
    \n```\nemitter.emit('evacuate', 'Woman and children first!');\n```\n\n对事件名称没有限制，不过Node文档提供了一个有用的约定：\n\
    通常，事件名称用驼峰式字符串表示。\nEventEmitter的所有方法都是公共的，但通常的约定是事件只从EventEmitter“内部”发出。相反，通常的约定禁止EventEmitter将处理器附加到自身。\n\
