- md: " ## 1 The JavaScript Event Model\n\nEvents. How do they work? Confusion about\
    \ JavaScript's event model is as old as JavaScript itself. Particularly for programmers\
    \ coming to JavaScript from multi-threaded languages like Java and Ruby, situations\
    \ like this are utterly mystifying:\n\n```\nfor (var i = 1; i <= 3; i++) {\n \
    \ setTimeout(function(){ console.log(i); }, 0);\n};\n\n4\n4\n4\n```\n\nIn this\
    \ chapter, we'll take a tour of JavaScript's asynchronous mechanisms and dispel\
    \ some common misconceptions. Once we're on solid ground, we'll take a brief look\
    \ at some precompilers and alternative runtimes that can make async JS code more\
    \ human-friendly.\n\n## 1.1 Now or later\n\nLet's start by explaining the `setTimeout`\
    \ example above. Most JavaScript newcomers would expect the loop to produce the\
    \ output 1, 2, 3, or perhaps a random shuffle of those three numbers as the three\
    \ timeouts (each scheduled to go off in 0 milliseconds) race to fire first. To\
    \ understand why the output is 4, 4, 4 instead, there are three things you need\
    \ to know:\n\n1. There's only one variable i, scoped by the declaration var i.\n\
    2. After the loop, i === 4.\n3. JavaScript events are blocked until the thread\
    \ is free.\n\nThe first two concepts are in the realm of JavaScript 101, but the\
    \ third may sound foreign. When I first came to JavaScript, I didn't quite believe\
    \ all this \"blocking\" business. Java had trained me to fear that my code could\
    \ be interrupted at any moment. A million edge cases occupied the back of my mind\
    \ as I wondered, \"What if a rare event happened between these two lines of code?\"\
    \ And then one day, I realized that I was free. Here is the code that liberated\
    \ me:\n\n```\nvar start = new Date();\nsetTimeout(function(){\n    var end = new\
    \ Date();\n    console.log('Time elapsed:', end - start, 'ms');\n}, 500);\nwhile\
    \ (new Date() - start < 1000) {}\n```\n\nIn my multi-threaded mindset, I'd expected\
    \ only 500ms to go by before the timed function ran. But that would require the\
    \ loop, designed to last 1000ms, to be interrupted. Instead, if you run this snippet,\
    \ you'll get the output\n\nTime elapsed: 1002ms\n\n(give or take a couple of milliseconds—setTimeout\
    \ and setInterval are, alas, a lot less precise than you'd hope, particularly\
    \ in older browsers).\n\nSo, what's setTimeout really doing?\n\n### Meet the queue\n\
    \nWhen we call setTimeout, a timeout event is *queued*. Only when our JavaScript\
    \ code has finished running does the runtime ask, \"OK, what's on the queue?\"\
    \ If there's at least one event on the queue that's eligible to \"fire\" (like\
    \ a 500ms timeout that was set 1002ms ago), the runtime picks one and calls its\
    \ \"handler\" (e.g. the function we passed in to setTimeout). When that handler\
    \ returns, we go back to the queue.\n\nInput events work the same way: When a\
    \ user clicks a DOM element that you've attached a click handler to, the click\
    \ event is queued. But the event won't fire until after any running code has finished.\
    \ When a web page stops responding to your input, this is usually the reason.\
    \ (See the next section for an example.)\n\nSometimes the term \"event loop\"\
    \ is used to describe how the runtime works. It's as if your code were being run\
    \ from a loop that looks like this:\n\n```\nrunYourScript();\nwhile (atLeastOneEventIsQueued)\
    \ {\n    fireNextQueuedEvent();\n}\n```\n\nOne implication of this is that each\
    \ event that fires will be at the root of the stack trace. More on that later\
    \ in the chapter.\n\n**To summarize:** Events can be *queued* while code is running,\
    \ but they can't *fire* until the runtime is free.\n\nThe JavaScript Event Model\n\
    \n3\n\n\n### Details, details\n\nYou might be wondering exactly how the runtime\
    \ decides which queued events to fire when. Unfortunately, the specifics vary\
    \ from one JavaScript environment to another, even among modern web browsers.\
    \ I've set up a jsFiddle example to illustrate this.³ The HTML consists of a single\
    \ link with the id masochist, and the code is this:\n\n```\nvar clickCount = 0,\
    \ link;\nlink = document.getElementById('masochist');\nlink.innerHTML = 'How many\
    \ times can you click me?';\nlink.onclick = function(){\n    clickCount++;\n \
    \   link.onclick = function(){ clickCount++; };\n\n    start = new Date();\n \
    \   while (new Date() - start < 5000) {}\n    console.log(clickCount); // this\
    \ will always be 1\n\n    setTimeout(function(){\n        link.innerHTML = 'You\
    \ clicked me ' + clickCount + ' times. Ow!';\n    }, 0);\n};\n```\n\nTry loading\
    \ this into your favorite browser and clicking the link as many times as you can\
    \ in 5 seconds. You'll get very different results depending on the browser you\
    \ use.\n\nIn Chrome, even though the browser is essentially frozen for those 5\
    \ seconds after the first click (due to the while loop), you'll still get an accurate\
    \ count of the number of clicks. The count would be 0 if the setTimeout ran before\
    \ the loop, because the old timeout would be given higher priority on the event\
    \ queue than the newer click events.\n\nIn Firefox, the timeout fires before any\
    \ of the click events, which are dispersed over time. If you raise the delay from\
    \ 0ms to 200ms, you'll see a couple of your clicks. Raise it to 300ms, and you'll\
    \ see a couple more.\n\nNotice that console.log line? If you look at the console,\
    \ you'll see just a single 1 no matter how many times you click the link.aptr\n\
    I added that to illustrate the distinction between events and handlers: The original\
    \ click handler isn't called until all of the click events have been queued. It\
    \ then attaches a new handler, replacing itself. When the remaining queued click\
    \ events fire, the runtime calls the new handler.\n\nOf course, these details\
    \ tend not to matter when you're doing event-driven JavaScript properly. Ensuring\
    \ that your code doesn't contain a while loop that runs for 5 seconds is a good\
    \ first step.\n\n³http://jsfiddle.net/TrevorBurnham/GCbHm/\n\n## 1.2 When is a\
    \ function async?\n\nThe term *async function* is a bit of a misnomer, since JavaScript\
    \ code itself is always synchronous. If you call a function, your program simply\
    \ won't continue until that function returns. What I mean by \"async function\"\
    \ is one that takes another function (a *callback*) that won't run until we reach\
    \ the event queue. So an async function will never fail this test:\n\n```\nvar\
    \ a = false;\nasyncFunction(function() { console.assert(a, 'a should be true');\
    \ })\na = true;\n```\n\nWe saw that `setTimeout` passes this test even when the\
    \ delay passed to it is 0.\n\nAnother term for async functions is **non-blocking**.\
    \ This emphasizes how speedy they usually are: A SQL query made with an async\
    \ MySQL driver may take an hour, but the function that made the query will return\
    \ in less than a millisecond—a boon to web servers that need to process several\
    \ incoming requests at once.\n\nTypically, the callback is given as the last argument\
    \ to the function. (Regrettably, the venerable `setTimeout` and `setInterval`\
    \ are exceptions to this convention.) But some async functions take callbacks\
    \ indirectly, by returning a Promise or using an EventEmitter. We'll learn about\
    \ these patterns in the next few chapters.\n\nUnfortunately, the only way to be\
    \ sure whether a function is async or not is to look at its source code (and,\
    \ potentially, the source code of every function it calls in turn). Some functions\
    \ that are synchronous have an API that looks async, PocketChemistbecause they\
    \ might become async in the future or because callbacks provide a nice way to\
    \ return multiple arguments. When in doubt, don't depend on a function being async.\n\
    \n### Maybe async, maybe not\n\nSome functions are async sometimes, but not others.\
    \ For instance, jQuery's eponymous function (typically aliased as `$`) can be\
    \ used to delay a function until the DOM has finished loading. But if the DOM\
    \ has already finished loading, there's no delay; the callback fires immediately.\n\
    \nLikewise, jQuery's Promises (a great feature, added in version 1.5, that we'll\
    \ be covering in a later chapter) allows you to add callbacks both before and\
    \ after a task, such as an Ajax call, has finished. If the callback is added after,\
    \ it fires immediately.\n\nThese \"maybe-async\" functions can get you in a lot\
    \ of trouble if you're not careful, because you can't count on code that runs\
    \ after the function being run before the callback:\n\n```\nvar h1FontSize;\n\
    $(function() {\n```"
  mdcn: "\n ## 1 JavaScript 事件模型\n\n事件。它们是如何工作的？对 JavaScript 事件模型的困惑与 JavaScript 本身一样古老。特别是对于从\
    \ Java 和 Ruby 等多线程语言转向 JavaScript 的程序员来说，以下情况完全令人费解：\n\n```\nfor (var i = 1; i\
    \ <= 3; i++) {\n  setTimeout(function(){ console.log(i); }, 0);\n};\n\n4\n4\n\
    4\n```\n\n在本章中，我们将游览 JavaScript 的异步机制，并 dispel 一些常见的误解。一旦我们站稳脚跟，我们将简要介绍一些预编译器和替代运行时，它们可以让异步\
    \ JS 代码更加人性化。\n\n## 1.1 现在或稍后\n\n让我们从解释上面的 `setTimeout` 示例开始。大多数 JavaScript 新手会期望循环产生输出\
    \ 1、2、3，或者当三个超时（每个都计划在 0 毫秒内触发）争先恐后地首先触发时，这三个数字的某种随机排列。要理解为什么输出是 4、4、4 而不是其他结果，你需要知道三件事：\n\
    \n1. 只有一个变量 i，由声明 var i 作用域。\n2. 循环结束后，i === 4。\n3. JavaScript 事件被阻塞，直到线程空闲为止。\n\
    \n前两个概念属于 JavaScript 101 的范畴，但第三个可能听起来陌生。当我第一次接触 JavaScript 时，我并不完全相信所有这些\"阻塞\"\
    的说法。Java 让我担心我的代码可能随时被中断。百万个边缘情况占据了我的脑后，我想知道，\"如果在这两行代码之间发生了罕见的事件怎么办？\"直到有一天，我意识到我自由了。以下是解放我的代码：\n\
    \n```\nvar start = new Date();\nsetTimeout(function(){\n    var end = new Date();\n\
    \    console.log('Time elapsed:', end - start, 'ms');\n}, 500);\nwhile (new Date()\
    \ - start < 1000) {}\n```\n\n在我多线程的思维模式中，我预计定时函数运行前只会过去 500 毫秒。但这需要设计为持续 1000\
    \ 毫秒的循环被中断。相反，如果你运行这段代码，你会得到输出\n\nTime elapsed: 1002ms\n\n（或多或少几毫秒——遗憾的是，`setTimeout`\
    \ 和 `setInterval` 远不如你希望的那么精确，特别是在旧版浏览器中）。\n\n那么，`setTimeout` 到底在做什么？\n\n### 认识队列\n\
    \n当我们调用 `setTimeout` 时，一个超时事件被*排队*。只有当我们的 JavaScript 代码运行完毕后，运行时才会问：\"好的，队列上有什么？\"\
    如果队列上至少有一个事件有资格\"触发\"（比如一个 500 毫秒的超时在 1002 毫秒前被设置），运行时就会选择一个并调用其\"处理程序\"（例如我们传给\
    \ `setTimeout` 的函数）。当该处理程序返回后，我们回到队列。\n\n输入事件的工作原理相同：当你点击一个已附加点击处理程序的 DOM 元素时，点击事件被排队。但该事件不会触发，直到任何正在运行的代码完成。当网页停止响应你的输入时，这通常是原因。（参见下一节的示例。）\n\
    \n有时\"事件循环\"这个术语被用来描述运行时是如何工作的。就好像你的代码是从这样一个循环中运行的：\n\n```\nrunYourScript();\n\
