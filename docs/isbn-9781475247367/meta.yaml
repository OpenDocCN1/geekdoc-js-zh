- md: " ## Solution 2: PubSub-style\n\nAs is so often the case in JavaScript, the\
    \ best solution is an EventEmitter. It allows us to expose an extremely versatile\
    \ API from a simple function. To wit:\n\n```\nvar EventEmitter = require('events').EventEmitter;\n\
    function attempt(asyncTask) {\n  var emitter = new EventEmitter(), results;\n\
    \  emitter.failedAttempts = 0;\n  function retry() {\n    asyncTask(function(err)\
    \ {\n      if (err) {\n        emitter.failedAttempts++;\n        emitter.emit('failure',\
    \ err, retry);\n      } else {\n        results = Array.prototype.slice.call(arguments,\
    \ 1);\n        emitter.emit('success', results);\n      }\n    });\n  }\n  process.nextTick(retry);\
    \  // ensure asynchronicity\n  return emitter;\n}\n```\n\nThis may be a little\
    \ more complicated than our earlier definition, but it makes things extremely\
    \ easy for the caller:\n\n```\nvar reading = attempt(function(callback) {\n  fs.readFile('locked.txt',\
    \ 'utf8', callback);\n});\nreading.on('failure', function(err, retry) {\n  console.error(err);\n\
    \  if (reading.failedAttempts < 3) retry();\n});\nreading.on('success', function(contents)\
    \ {\n  //\n});\n```\n\nNow we have cleanly exposed state and precise control over\
    \ when we retry our function. Plus, because we can attach multiple handlers for\
    \ the same event, it's easy to view the process state from multiple perspectives.\
    \ We could, for example, map the task onto a Promise for easy monitoring:\n\n\
    ```\nvar deferred = new $.Deferred();\nreading.on('failure', function(err, retry)\
    \ {\n  if (reading.failedAttempts >= 3) deferred.reject(err);\n});\nreading.on('success',\
    \ deferred.resolve);\n```\n\n## 6.3 Problem: Testing async code\n\nIn languages\
    \ like Java and Ruby, test cases can just be lists of assertions. Unfortunately,\
    \ that won't cut it when testing async JavaScript code, because the test runner\
    \ has no way of knowing when the test case is complete. It's important to use\
    \ a JavaScript testing framework that can handle async test cases and produce\
    \ meaningful output despite the unpredictable order of assertions.\n\n## Solution:\
    \ Use Mocha\n\nThe successor to Expresso, Mocha is a one-size-fits-all testing\
    \ framework for both the browser and Node.[2] While async testing was something\
    \ of a pain in older testing frameworks like QUnit (requiring async test cases\
    \ to manually start and stop the runner), Mocha makes it \"just work.\" Here's\
    \ an example using Mocha's TDD-style interface (which I prefer for its simplicity\
    \ over the default BDD-style interface):\n\n```\nvar assert = require('assert');\n\
    \nsuite('gamification', function() {\n  setup(gamify);\n\n  test('gamify resets\
    \ points', function() {\n    assert.equal(points, 0);\n  });\n\n  test('player\
    \ points are loaded on login', function(done) {\n    assert.equal(points, 0);\n\
    \    login(mock.username, mock.password, function(err, success) {\n      if (err)\
    \ throw err;\n      assert.ok(success);\n      assert.equal(points, mock.points);\n\
    \      done();\n    });\n  });\n});\n```\n\nAssume the assertions all pass. When\
    \ this code is run, via the command `mocha -u tdd test.js`, the test runner will\
    \ report the first test case's success as soon as it returns, and will report\
    \ the second test case's success as soon as it calls `done`. But wait—how did\
    \ it know to wait for `done` to be called in the second case?\n\nThe magic here\
    \ is in a JavaScript feature called *arity*. The arity of a function is the number\
    \ of declared arguments it takes. That number is exposed as the `length` property:\n\
    \n```\n(function() { ... }).length; // 0\n(function(done) { ... }).length; //\
    \ 1\n```\n\nUsing this to distinguish synchronous functions from async ones is\
    \ a clever hack, though it comes with a caveat: If you accidentally declare a\
    \ synchronous test case with an argument, e.g.\n\n```\ntest('bedard', function(done)\
    \ {\n    assert.ok(true);\n});\n```\n\nyou'll get the error output\n\n```\nx 1\
    \ of 1 tests failed:\n\n1) bedard:\n    Error: timeout of 2000ms exceeded\n```\n\
    \nUsually, declaring functions without unnecessary arguments is good style. In\
    \ Mocha, it's a matter of life and death.\n\n## 6.4 Problem: Aggregating events\n\
    \nWith the rise of evented models, it's become easy to oversaturate an application\
    \ with events, slowing it to a crawl. For instance, in a game, we might represent\
    \ each of thousands of characters in a level with a Backbone model and perform\
    \ game logic in response to any changes in those models. But when the player throws\
    \ a grenade that blows up 100 monsters at once, we don't want to perform the same\
    \ logic 100 times. How can we avoid this?\n\n## Solution 1: Silence the change\
    \ events\n\nBackbone gives us a special flag that we can use to change models\
    \ without them emitting a 'change' event:\n\n```\nmonsters.each(function(damage)\
    \ {\n  this.set({life: this.get('life') - damage}, {silent: true});\n});\n```\n\
    \nUsed carefully, this is the most efficient solution to our problem. But it'll\
    \ only work if we have absolute knowledge about what's supposed to happen when\
    \ each model we're silently modifying changes.\n\nSilencing events is like a scalpel.\
    \ With steady hands and precise planning, it can be an invaluable tool; otherwise,\
    \ it's just going to make a mess.\n\n## Solution 2: Use a simple timeout\n\nRemember\
    \ that even a 0ms delay will ensure that a function runs after all synchronous\
    \ code. We can use that to our advantage by having a `checkGameState` function\
    \ runs just once after all of the individual monster models have been updated:\n\
    \n```\nvar checkGameStateTimeout;\nfunction checkGameState() {\n  // if no monster\
    \ allies remain, you lose\n  var isTheGameLost = monsters.filter(function() {\n\
    \    return this.get('ally');\n  }).length === 0;\n  // and so on..\n}\n\nvar\
    \ monsters = new Backbone.Collection;\nmonsters.on('change', function() {\n  clearTimeout(checkGameStateTimeout);\n\
    \  checkGameStateTimeout = setTimeout(checkGameState, 0);\n});\n```\n\nNow no\
    \ matter how many monsters are changed simultaneously, `checkGameState` will fire\
    \ just once in response.\n\n## Solution 3: Throttling/Debouncing\n\nWe've looked\
    \ at one solution that operates from the part of the app that updates the models\
    \ and another that works from the models' end. But the most elegant approach is\
    \ usually to act on the particular function that we want to prevent from being\
    \ called too often. In general terms, that means we want to limit checkGameState\
    \ to running once every *n* milliseconds. There are two basic approaches to this:\n\
    \n- 1. *Throttling*, where additional calls to the function are ignored if its\
    \ last run was less than *n* ms ago, and\n2. *Debouncing*, where any call to the\
    \ function is delayed until *n* ms have elapsed since the last call\n\nUsually,\
    \ you want throttling, because debouncing adds some latency to every function\
    \ call. Plus, debouncing means that a function will *never* be called if it's\
    \ called too often! (Sometimes debouncing is implemented with a maximum delay\
    \ to avoid this.) However, debouncing is preferable in scenarios where you want\
    \ to wait until an input source is idle, such as rendering a preview or running\
    \ a validation only after the user has momentarily stopped typing.\n\nBoth throttling\
    \ and debouncing are easy to implement by creating a meta-function that returns\
    \ a wrapped version of the original function. Here are two simple implementations:\n\
    \n```\nfunction throttle(func, minDelay) {\n  var lastHitDate = 0;\n  return function()\
    \ {\n    var now = new Date();\n    if (now - lastHitDate >= minDelay) {\n   \
    \   lastHitDate = now;\n      return func.apply(this, arguments);\n    };\n  };\n\
    }\n```\n\n```\nfunction debounce(func, delay) {\n  var timeout;\n  return function()\
    \ {\n    var args = arguments;\n    clearTimeout(timeout);\n    timeout = setTimeout(function()\
    \ {\n      func.apply(this, args);\n    }, delay);\n  };\n}\n```\n\n(If you're\
    \ using Underscore.js—and you should!—you can just use `_.throttle` and `_.debounce`.)\n\
    \nWith these utility functions, we can either overwrite checkGameState entirely\
    \ or just use the wrapped version from our change events. For our purposes, debounce\
    \ with a delay of 0 is most appropriate, since throttle with a short delay would\
    \ allow checkGameState to run more within a block of synchronous code. debounce\
    \ with a delay of 0 is effectively equivalent to the setTimeout we used in solution\
    \ 2:\n\n```\nvar debouncedCheckGameState = debounce(checkGameState, 0);\nmonsters.on('change',\
    \ function() {\n    debouncedCheckGameState();\n});\n```\n\nNote that it's important\
    \ to use the same throttled/debounced instance of a function from every source\
    \ that we want to limit calls from. Calling\n\n```\n(debounce(checkGameState,\
    \ 0))();\n```\n\nwould just be an overly complicated way of calling\n\n```\nsetTimeout(checkGameState,\
    \ 0);\n```\n\nbecause calling debounce(checkGameState, 0) again would just create\
    \ a separate timeout.\n\n## 6.5 Problem: Handling requests\n\nQuick question:\
    \ You're a web server. You receive a request. What do you do?\n\nMost likely,\
    \ lots of unrelated things. At a minimum, you look at the requested route and\
    \ map it to a file that you send in response. But you also probably log the request,\
    \ check whether the requester is properly authenticated, and fetch some data.\
    \ Maybe you cache the response in memory, too. Many of these pieces of functionality\
    \ will be the same for some or all routes. How do you avoid duplication?\n\n##\
    \ Solution: The middleware pattern\n\nIn the Node.js Connect framework, each middleware\
    \ function takes a request object (req), a response object (res), and a next callback.\
    \ Every time a new request comes in, it's passed to the first middleware. The\
    \ middleware has three (good) options:\n\n- 1. Handle the request itself by sending\
    \ a response and returning without calling next."
  mdcn: "\n ## 解决方案 2：PubSub 风格\n\n正如 JavaScript 中常见的情况一样，最佳解决方案是使用 EventEmitter。它使我们能够从一个简单的函数中暴露出一个极其多用途的\
