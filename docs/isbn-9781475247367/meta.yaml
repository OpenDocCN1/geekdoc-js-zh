    \ if you want to know when the file has been saved and handle any errors that\
    \ might have occurred, but you might do without if the file is inessential.\n\n\
    ## Advanced timing methods\n\nRecall that `setTimeout` and `setInterval` are imprecise.\
    \ How imprecise? It depends on the environment. Here's a test case:\n\n```\nvar\
    \ fireCount = 0;\nvar start = new Date();\nvar timer = setInterval(function()\
    \ {\n    if (new Date() - start > 1000) {\n        clearInterval(timer);\n   \
