    async.queue is performing the role of traffic cop here by ensuring that we''re
    only reading up to 10 files at a time. Unfortunately, it doesn''t ensure that
    push callbacks are invoked in any particular order, forcing us to awkwardly manage
    our own results array.


    # Advanced queue callbacks


    Although drain is usually the only handler you''ll need, async.queue provides
    a few other events:


    +   - When the last task has started running, the queue calls empty. (When the
    task finishes, it calls drain.)

    - When the concurrency limit is reached, the queue calls saturated.

    - If you provide a function as the second argument in a push, it''ll be called
    when the given task (or each task in the given array) is finished.


    In short, async.queue is one of the most versatile functions in Async.js, an all-purpose
    valve for limiting concurrency.


    # 4.6 On autopilot


    As powerful as async.queue is, there are some cases it can''t handle. Consider
    a complex application''s startup process. A small part of that process might look
    something like this:


    +   1. Read a configuration file

    2. Connect to the database specified by the configuration file

    3. Connect to the cache specified by the configuration file

    4. Load the most-used objects from the database into the cache

    5. Connect to an external API

    6. Start responding to HTTP requests'
  - "[PAGE 61]\n\nFlow Control with Async.js\n\n50\n\nHere, tasks 2 and 3 both depend\
    \ on task 1, task 4 depends on tasks 2 and 3, and task 6 depends on tasks 2, 3\
    \ and 5. You could just do these tasks in linear order, but that would slow the\
    \ server's startup unnecessarily. What we want is to run each task as soon as\
    \ its dependencies have finished.\nTo do that, we could write a Promise for each\
    \ task and work out the logic ourselves with whens and thens... or we could just\
    \ let an algorithm solve it for us. After all, any set of dependencies can be\
    \ translated into a directed graph, and solving math problems is what computers\
    \ are for! In World War II, computers calculated bomb trajectories. Today, they\
    \ calculate the trajectories of angry avians. My point is, dependency graphs are\
    \ a breeze for machines to work out.\n\nasync.auto lets us describe a dependency\
    \ graph in the form of a single object, where the keys are task names and the\
    \ values are arrays of the form\n\n[dependencies..., task]\n\nwhere dependencies\
    \ is a list of task names and task is the function itself. If a task has no dependencies,\
    \ we can just write\n\ntask\n\ninstead of\n\n[task]\n\nHere's how we'd implement\
    \ our server's startup process, assuming we've already defined the constituent\
    \ tasks:\n\n```\nasync.auto({\n  readConfigFile: readConfigFile,\n  connectToDB:\
    \    ['readConfigFile', connectToDB],\n  connectToCache: ['readConfigFile', connectToCache],\n\
    \  cacheObjects:   ['connectToDB', 'connectToCache', cacheObjects],\n  connectToAPI:\
    \   connectToAPI,\n  acceptHTTPReqs: ['connectToDB', 'connectToCache', 'connectToAPI',\n\
    \                   acceptHTTPReqs]\n});\n```\n\n(As a convention, I've used the\
    \ function names as the keys of the dependency graph. async.auto itself doesn't\
    \ care what names the functions have.)\n\nAlthough auto isn't widely used, it's\
    \ an extremely powerful function that you should be aware of. In a complex application,\
    \ it could be a real lifesaver.\n\nThat's it for our coverage of Async.js, the\
    \ most widely used and arguably the most feature-rich flow control lib. However,\
    \ I don't want you to get the impression that Async.js is the right tool for every\
    \ callback-driven job. Let's close out the chapter by looking at a few alternatives."
  - "[PAGE 62]\n\n# 4.7 Minimalist flow control with Step\n\nThe most well-known alternative\
    \ to Async.js is Tim Caswell's Step.² Step is much lighter than Async.js, with\
    \ an API consisting of a single function: `Step`. `Step` takes a list of functions,\
    \ e.g.\n\n```\nStep(task1, task2, task3);\n```\n\nEach function can control the\
    \ flow in three ways:\n\n+   1. It can call `this` to make Step run the next function\
    \ in the list.\n2. It can call a callback generated by `this.parallel` or `this.group`\
    \ *n* times to tell Step to run the next function *n* times.\n3. It can return\
    \ a value, which will also make Step run the next function in the list. This makes\
    \ it easy to mix synchronous functions with async ones.\n\nThe next function will\
    \ receive the results of its predecessor (that is, its return value or the arguments\
    \ it passed to `this`), or the results of all instances of its predecessor if\
    \ that predecessor was run with `this.parallel` or `this.group`. (The difference\
    \ is that `this.parallel` provides those results as separate arguments, while\
    \ `this.group` merges them into arrays.)\n\nThe entire library is, as of this\
    \ writing, just 152 lines long (with comments), yet versatile enough to handle\
    \ most async flows. The downside of this minimalism is that a flow created with\
    \ Step can only be understood by reading each function in it. Flows created with\
    \ the everything-but-the-kitchen-sink Async.js tend to be more self-explanatory.\n\
    \nHere's a good middleground: Whatever functionality you need from Async.js, try\
    \ writing it yourself with Step. For example, here's the equivalent of `async.map`\
    \ in just 11 lines:\n\n```\nvar Step = require('step');\n\nfunction stepMap(arr,\
    \ iterator, callback) {\n  Step(\n    function() {\n      var group = this.group();\n\
    \      for (var i = 0; i < arr.length; i++) {\n        iterator(arr[i], group());\n\
    \      };\n    },\n    callback\n  );\n}\n```"
- md: "## 4.8 Other flow control libraries\n\nBefore we close the chapter, let me\
    \ mention a couple of interesting flow control libs that we might learn from.\n\
    \n## Futures\n\nPreviously mentioned in Chapter 3, AJ O'Neal's Futures has a little\
    \ bit of everything: It's part flow control, part Promises, and part PubSub.⁴\
    \ It's a one-stop shop for all your async needs. Unfortunately, that wide-ranging\
    \ functionality makes for an exhaustingly complex API.\n\n## nue\n\nSpeaking of\
    \ complexity, Toshihiro Nakamura's nue⁵ is like Step's much, *much* bigger brother.\
    \ Whereas Step only allows flows to run in a linear order (with parallelism within\
    \ a step), nue lets you spawn sub-flows, share data by attaching it to a shared\
    \ object, name flows and steps for debugging, and basically do anything else you\
    \ can imagine. It's overwhelming, but admirable.\n\nIn this chapter, we saw how\
    \ common async patterns can be implemented with minimal boilerplate using the\
    \ right flow control functions. We also saw the biggest problem with flow control:\
    \ That for every problem, there's an overwhelming number of solutions to choose\
    \ from.\n\nIsaac Schlueter, the creator of npm and recently-appointed head of\
    \ the Node.js project, made a very small flow control library called Slide.⁶ In\
    \ its README, he wrote:\n\n> You should use it as an example of how to write your\
    \ own flow control utilities. You'll never fully appreciate a flow control lib\
    \ that you didn't write yourself.\n\nI hope that's not true. Writing a flow control\
    \ lib is a good exercise, but you shouldn't have to reinvent the wheel just to\
    \ see how it works. As the JavaScript ecosystem matures, flow control should become\
    \ more widespread and more standardized. My prediction is that a library will\
    \ emerge that will do for flow control what jQuery did for DOM interaction, or\
    \ what Underscore.js has done for (synchronous) functional-style programming.\
    \ When that happens, it'll be a great day for JavaScript.\n\n⁴https://github.com/coolaj86/futures\n\
    \n⁵https://github.com/nakamura-to/nue\n\n⁶https://github.com/isaacs/slide-flow-control\n\
    \n## 5 Multi-threading with Workers\n\nAt the start of this book, I described\
    \ events as an alternative to multi-threading. More precisely, events replace\
    \ a specific kind of multi-threading, the kind where multiple parts of an application\
    \ process run simultaneously (either virtually, through interrupts, or physically\
    \ on multiple CPU cores). This gets to be a problem when code running in different\
    \ threads have access to the same data. Even a line as simple as\n\n```\ni++;\n\
    ```\n\ncan be a source of pernicious Heisenbugs when it allows separate threads\
    \ to modify the same i at the same time. Thankfully, this kind of multi-threading\
    \ is impossible in JavaScript.\n\nOn the other hand, distributing tasks across\
    \ multiple CPU cores is increasingly essential, as those cores are no longer making\
    \ the same exponential gains in efficiency, year after year, that we used to expect.\
    \ So we *need* multi-threading. Does that mean abandoning events?\n\n*Au contraire!*\
    \ While running on a single thread isn't ideal, naively distributing an app across\
    \ multiple cores can be even worse. Multi-core systems slow to a crawl when those\
    \ cores have to constantly talk to each other to avoid stepping on each other's\
    \ toes. It's much better to give each core a separate job, then sync up occasionally.\n\
    \nThat's precisely what Workers do in JavaScript. From the master thread of your\
    \ application, you tell a Worker, \"Go run this code in a separate thread.\" The\
    \ Worker can send you messages (and vice versa), which take the form of (what\
    \ else?) callbacks run from the event queue. In short, you interact with different\
    \ threads the same way that you do I/O in JavaScript.\n\nIn this chapter, we'll\
    \ look at Workers in their browser and Node manifestations, and discuss some practical\
    \ applications.\n\n### 5.1 Web Workers\n\nWeb Workers are part of the living standard\
    \ widely known as HTML5. To create one, you call the global Worker constructor\
    \ with the URL of a script:\n\n```\nvar worker = new Worker('kimptoc.js');\nworker.addEventListener('error',\
    \ function() {\n    console.log('Chris Kimpton failed to load.');\n});\n```\n\n\
    > (**Warning:** As a security measure, the URL passed to Worker must have the\
    \ same origin—protocol, host, and port—as the page.)\n\nNow *kimptoc.js* will\
    \ be fetched asynchronously and, assuming that the script loads successfully,\
    \ it'll start running in another thread. Congratulations: We have a Web Worker!\n\
    \nMore specifically, we have a *dedicated* Web Worker, which can only talk to\
    \ the browser process that created it. It's also possible to have *shared* Web\
    \ Workers that can be used to coordinate multiple browser tabs; however, these\
    \ are less widely supported, so we won't cover them in this chapter.\n\n### Talking\
    \ to Web Workers\n\nIn addition to 'error' events (which are emitted when the\
    \ Worker script fails to load, or when the script throws an exception), Workers\
    \ can emit a 'message' event containing an arbitrary string or JSON-serializable\
    \ object sent from the Worker's self.postMessage function:\n\n```\nvar worker\
    \ = new Worker('worker.js');\nworker.addEventListener('message', function(e) {\n\
    \  console.log(e.data);  // echo whatever was sent by postMessage\n});\n```\n\n\
    (Usually, we only want the data property from the message event. If we were binding\
    \ the same event handler to multiple Workers, we could use e.target to determine\
    \ which Worker emitted the event.)\n\nSo, now we know how to listen to Workers.\
    \ Conveniently, the interface for talking to Workers is symmetrical: We use worker.postMessage\
    \ to send it, and the Worker uses self.addEventListener('message', ...) to receive\
    \ it. Here's a complete example:\n\n```\n// master script\nvar worker = new Worker('boknows.js');\n\
    worker.addEventListener('message', function(e) {\n  console.log(e.data);\n});\n\
    worker.postMessage('football');\nworker.postMessage('baseball');\n\n// boknows.js\n\
    self.addEventListener('message', function(e) {\n  self.postMessage('Bo knows '\
    \ + e.data);\n});\n```\n\nYou can play with the message-passing interface at a\
    \ little site I created, the Web Worker Sandbox.¹ Any time you create a new example,\
    \ it gets a unique URL that you can share.\n\n¹http://webworkersandbox.com/\n\n\
    ### Restrictions on Web Workers\n\nWeb Workers are primarily intended to handle\
    \ complex computations without compromising DOM responsiveness. Potential uses\
    \ include:\n\n- Performing physics calculations for games with CoffeePhysics.²\n\
    - Decoding video as it streams in with the Broadway implementation of the H.264\
    \ codec.³\n- Encrypting communications with the Stanford JavaScript Crypto Library.⁴\n\
    \nTypically, the Worker will send the result of its computations to the master\
    \ thread, which will then update the page. Why not update the page directly? Mainly,\
    \ to keep JavaScript’s async abstractions intact. If a Worker could alter the\
    \ page’s markup, we’d end up in the same place as Java, wrapping our DOM manipulation\
    \ code in mutexes and semaphores to avoid race conditions.\n\nLikewise, a Worker\
    \ can’t see the global `window` object, or any other object in the master thread\
    \ (or in other Worker threads). When an object is sent through `postMessage`,\
    \ it’s transparently serialized and unserialized (think `JSON.parse(JSON.stringify(obj))`).\
    \ So changes to the original object won’t affect the copy in the other thread.\n\
    \nEven the trusty `console` isn’t available to Workers. All a Worker *can* see\
    \ is its own global object, `self`, and everything bundled with it: standard JavaScript\
    \ objects like `setTimeout` and `Math`, plus the browser’s Ajax methods.\n\nAh\
    \ yes, Ajax! A Worker can use `XMLHttpRequest` freely. It can even use `WebSocket`,\
    \ if the browser supports it. From an efficiency standpoint, there’s little to\
    \ gain just from moving Ajax functionality from the master script to a Worker,\
    \ but it does mean that the Worker can pull data directly from the server. And\
    \ if we’re dealing with a lot of data (like in the streaming video example), keeping\
    \ it in one thread rather than serializing it via `postMessage` is a big win.\n\
    \nThere’s also a special `importScripts` function that will (synchronously) load\
    \ and run the given script(s):\n\n```\nimportScripts('https://raw.github.com/gist/1962739/danika.js');\n\
    ```\n\nNormally, synchronous loading is a big no-no, but remember that we’re in\
    \ a secondary thread here. As long as the Worker has nothing else to do, blocking\
    \ is A-OK."
  mdcn: "\n## 4.8 其他流程控制库\n\n在结束本章之前，让我提几个我们可以学习的有趣流程控制库。\n\n## Futures\n\n在第3章中曾提及，AJ\
    \ O'Neal 的 Futures 库兼具多种功能：它部分属于流程控制，部分实现了 Promise，部分采用了发布-订阅模式。⁴ 它是满足你所有异步需求的一站式解决方案。不幸的是，这种广泛的功能导致其\
    \ API 复杂得令人筋疲力尽。\n\n## nue\n\n说到复杂度，Toshihiro Nakamura 的 nue⁵ 库就像是 Step 库的“超大号兄弟”。Step\
    \ 只允许流程按线性顺序运行（步骤内部可并行），而 nue 则允许你创建子流程、通过附加到共享对象来共享数据、为流程和步骤命名以方便调试，并且基本上能做任何你能想到的事情。它功能强大到令人眼花缭乱，但也令人钦佩。\n\
    \n在本章中，我们看到了如何使用合适的流程控制函数，以最少的样板代码实现常见的异步模式。我们也看到了流程控制的最大问题：对于每一个问题，都有数量惊人的解决方案可供选择。\n\
    \nnpm 的创建者、近期被任命为 Node.js 项目负责人的 Isaac Schlueter，制作了一个非常小的流程控制库，叫做 Slide。⁶ 在其\
    \ README 中，他写道：\n\n> 你应该将它作为编写自己的流程控制工具的示例。你永远不会完全欣赏一个不是你自己编写的流程控制库。\n\n我希望这不是真的。编写一个流程控制库是很好的练习，但你不应该为了了解其工作原理而不得不重复造轮子。随着\
    \ JavaScript 生态系统的成熟，流程控制应该会变得更加普及和标准化。我的预测是，将出现一个库，它对于流程控制的意义，就如同 jQuery 对于 DOM\
    \ 交互，或 Underscore.js 对于（同步）函数式风格编程的意义一样。当那一天到来时，将是 JavaScript 的伟大日子。\n\n⁴https://github.com/coolaj86/futures\n\
    \n⁵https://github.com/nakamura-to/nue\n\n⁶https://github.com/isaacs/slide-flow-control\n\
    \n## 5 使用 Workers 实现多线程\n\n在本书的开头，我将事件描述为多线程的一种替代方案。更准确地说，事件取代了一种特定类型的多线程——即应用程序的多个部分同时运行（无论是通过中断实现的虚拟并行，还是在多个\
    \ CPU 核心上的物理并行）。当运行在不同线程中的代码访问相同的数据时，这就会成为问题。即使像下面这样简单的一行代码\n\n```\ni++;\n```\n\
    \n当它允许多个线程同时修改同一个 `i` 时，也可能成为难以捉摸的 Heisenbugs（海森堡漏洞）的根源。值得庆幸的是，这种多线程在 JavaScript\
    \ 中是不可能发生的。\n\n另一方面，将任务分配到多个 CPU 核心上变得越来越重要，因为这些核心不再像我们过去所期望的那样，年复一年地实现效率的指数级增长。所以我们*需要*多线程。这是否意味着要放弃事件？\n\
    \n*恰恰相反！* 虽然运行在单线程上并不理想，但天真地将应用程序分布到多个核心上可能更糟。当多核系统中的核心必须不断地相互通信以避免彼此冲突时，系统会变得极其缓慢。更好的方法是给每个核心分配一个独立的任务，然后偶尔进行同步。\n\
    \n这正是 JavaScript 中 Workers 所做的事情。从应用程序的主线程，你可以告诉一个 Worker：“去在一个单独的线程中运行这段代码。”\
    \ Worker 可以向你发送消息（反之亦然），这些消息以（还能是什么？）从事件队列运行的回调形式呈现。简而言之，你与不同线程交互的方式，与你在 JavaScript\
    \ 中进行 I/O 操作的方式相同。\n\n在本章中，我们将探讨 Workers 在浏览器和 Node.js 中的实现，并讨论一些实际应用。\n\n###\
    \ 5.1 Web Workers\n\nWeb Workers 是被称为 HTML5 的现行标准的一部分。要创建一个 Worker，你需要使用脚本的 URL\
    \ 调用全局的 Worker 构造函数：\n\n```\nvar worker = new Worker('kimptoc.js');\nworker.addEventListener('error',\
    \ function() {\n    console.log('Chris Kimpton failed to load.');\n});\n```\n\n\
    > (**警告：** 作为安全措施，传递给 Worker 的 URL 必须与页面具有相同的源（协议、主机和端口）。)\n\n现在，*kimptoc.js*\
    \ 将被异步获取，并且假设脚本加载成功，它将在另一个线程中开始运行。恭喜：我们有了一个 Web Worker！\n\n更具体地说，我们拥有一个*专用*（dedicated）Web\
    \ Worker，它只能与创建它的浏览器进程通信。也可以创建*共享*（shared）Web Worker，用于协调多个浏览器标签页；然而，这些支持较少，因此我们不会在本章中介绍它们。\n\
    \n### 与 Web Workers 通信\n\n除了 'error' 事件（当 Worker 脚本加载失败或脚本抛出异常时触发），Workers 还可以触发\
    \ 'message' 事件，其中包含从 Worker 的 `self.postMessage` 函数发送的任意字符串或 JSON 可序列化对象：\n\n\
    ```\nvar worker = new Worker('worker.js');\nworker.addEventListener('message',\
    \ function(e) {\n  console.log(e.data);  // 回显通过 postMessage 发送的所有内容\n});\n```\n\
    \n（通常，我们只需要消息事件中的 `data` 属性。如果我们要将同一个事件处理器绑定到多个 Workers，我们可以使用 `e.target` 来确定是哪个\
    \ Worker 触发了该事件。）\n\n所以，现在我们知道如何监听 Workers 了。方便的是，与 Workers 通信的接口是对称的：我们使用 `worker.postMessage`\
    \ 向它发送消息，Worker 使用 `self.addEventListener('message', ...)` 来接收消息。这是一个完整的示例：\n\n\
    ```\n// 主脚本\nvar worker = new Worker('boknows.js');\nworker.addEventListener('message',\
    \ function(e) {\n  console.log(e.data);\n});\nworker.postMessage('football');\n\
    worker.postMessage('baseball');\n\n// boknows.js\nself.addEventListener('message',\
    \ function(e) {\n  self.postMessage('Bo knows ' + e.data);\n});\n```\n\n你可以在一个我创建的小网站\
    \ Web Worker Sandbox 上体验这个消息传递接口。¹ 每当你创建一个新示例时，它都会获得一个你可以分享的唯一 URL。\n\n¹http://webworkersandbox.com/\n\
    \n### Web Workers 的限制\n\nWeb Workers 主要用于处理复杂计算，同时不影响 DOM 的响应能力。潜在用途包括：\n\n- 使用\
    \ CoffeePhysics² 为游戏执行物理计算。\n- 使用 H.264 编解码器的 Broadway 实现³在视频流式传输时进行解码。\n- 使用\
    \ Stanford JavaScript Crypto Library⁴进行通信加密。\n\n通常，Worker 会将其计算结果发送给主线程，由主线程更新页面。为什么不直接更新页面？主要是为了保持\
    \ JavaScript 异步抽象的完整性。如果一个 Worker 可以修改页面的标记，我们最终会陷入与 Java 相同的境地——需要用互斥锁和信号量来包装我们的\
    \ DOM 操作代码，以避免竞态条件。\n\n同样，Worker 无法看到全局的 `window` 对象，或主线程（或其他 Worker 线程）中的任何其他对象。当对象通过\
    \ `postMessage` 发送时，它会被透明地序列化和反序列化（可以理解为 `JSON.parse(JSON.stringify(obj))`）。因此，对原始对象的更改不会影响另一个线程中的副本。\n\
    \n即使是可靠的 `console` 对 Worker 也不可用。Worker *只能*看到它自己的全局对象 `self`，以及随之捆绑的所有内容：标准的\
    \ JavaScript 对象如 `setTimeout` 和 `Math`，以及浏览器的 Ajax 方法。\n\n啊，是的，Ajax！Worker 可以自由使用\
    \ `XMLHttpRequest`。如果浏览器支持，它甚至可以使用 `WebSocket`。从效率的角度来看，仅仅将 Ajax 功能从主脚本移到 Worker\
    \ 中获益甚微，但这确实意味着 Worker 可以直接从服务器拉取数据。并且如果我们处理大量数据（如流式视频示例），将其保留在一个线程中而不是通过 `postMessage`\
    \ 序列化，是一个巨大的优势。\n\n还有一个特殊的 `importScripts` 函数，它会（同步地）加载并运行给定的脚本：\n\n```\nimportScripts('https://raw.github.com/gist/1962739/danika.js');\n\
    ```\n\n通常，同步加载是一个大忌，但请记住我们这里是在辅助线程中。只要 Worker 没有其他事情要做，阻塞就完全没问题。\n"
