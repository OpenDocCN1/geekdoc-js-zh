    \ the other:\n\n```\nvar posting = $.post('/step1', data1)\n  .pipe(function()\
    \ {\n    return $.post('/step2', data2)\n      .pipe(function() {\n        return\
    \ $.post('/step3', data3);\n      });\n  });\n```\n\nOf course, this brings us\
    \ back to the Pyramid of Doom. You should be aware of this style, but as a rule,\
    \ try to declare your piped Promises individually. The variable names may not\
    \ be necessary, but they make the code far more self-documenting.\n\nThat concludes\
    \ our tour of jQuery Promises. Now let's take a quick look at the major alternative:\
    \ The CommonJS Promises/A spec and its flagship implementation, Q.js.\n\n## 3.8\
    \ jQuery vs. Promises/A\n\nIn terms of capabilities, jQuery Promises and Promises/A\
    \ are basically equivalent. They can be mapped to one another. The key differences\
    \ are superficial: They use the same words to mean different things.\n\nThe most\
    \ obvious difference is that the then method in faithful Promises/A implementations\
    \ like Q.js returns a *new* Promise that represents the eventual return value\
    \ of the success/failure handler. It's a lot like jQuery's pipe method.\n\nAnother\
    \ big difference, previously mentioned, is that jQuery uses the term \"resolve\"\
    \ as the opposite of \"fail,\" whereas Promises/A uses \"fulfill.\" Under Promises/A,\
    \ a Promise is said to be \"resolved\" when it's either fulfilled or failed.\n\
    \nThere are other, subtler differences as well. For instance: In Promises/A, whether\
    \ a Promise returned from then is fulfilled or rejected depends on whether the\
    \ invoked callback returns a value or throws an error. (Throwing errors from jQuery\
    \ Promise callbacks is a bad idea, as they'll go uncaught.)\n\nBecause of these\
