  md: "# Multi-threading with Workers\n\n```\n// spin up workers\nvar coreCount =\
    \ require('os').cpus().length;\nfor (var i = 0; i < coreCount; i++) {\n  cluster.fork();\n\
    }\n// bind death event\ncluster.on('death', function(worker) {\n  console.log('Worker\
    \ ' + worker.pid + ' has died');\n});\n} else {\n  // die immediately\n  process.exit();\n\
    }\n```\n\nThe output will look something like\n\nWorker 15330 has died\nWorker\
    \ 15332 has died\nWorker 15329 has died\nWorker 15331 has died\n\nwith one line\
    \ for each CPU core.\n\nThe code may look baffling at first. The trick is that\
    \ while Web Workers load a separate script, `cluster.fork()` fires the *same*\
    \ script in a different process. The only way the script knows whether it's being\
    \ run as the master or a Worker is by checking `cluster.isMaster`.\n\nThe reason\
    \ for this design decision is that multi-threading in Node has a very different\
    \ primary use case than multi-threading in the browser. While the browser can\
    \ relegate any surplus threads to background tasks, Node servers need to scale\
    \ up the computational resources available for their main task: handling requests.\n\
    \n(External scripts can be run as separate processes using `child_process.fork`.\
    \ Its capabilities are largely identical to those of `cluster.fork`—in fact, `cluster`\
    \ uses `child_process` under the hood—except that child process can't share TCP\
    \ ports.)\n\n# Talking to Node Workers\n\nAs with Web Workers, `cluster` Workers\
    \ can communicate with the master process by sending message events, and vice\
    \ versa. The API is slightly different, though:"
