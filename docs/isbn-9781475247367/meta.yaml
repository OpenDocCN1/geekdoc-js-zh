    \        });\n      }\n    });\n    return false; // prevent default click behavior\n\
    \  });\n});\n```\n\n## Solution: Distribute, distribute, distribute\n\nThe big\
    \ problem with the code above is that it's way too centralized. *Everything* that\
    \ happens in response to a menu click goes in the click handler, and *everything*\
    \ that happens in response to the Ajax request goes in the Ajax response handler.\
    \ We need to spread things out in a way that makes sense.\n\nThere are plenty\
    \ of ways we could do that here—using custom jQuery events, for example—but the\
    \ approach I'd recommend is using an evented model to represent the menu. The\
    \ model will encapsulate the state that we need to capture from the various async\
