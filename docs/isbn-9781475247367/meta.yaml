  md: "That's it: We've just implemented the core of Node's `EventEmitter`. (The only\
    \ major things we're missing are the ability to remove handlers and the ability\
    \ to attach one-time handlers.)\n\nOf course, PubSub implementations vary slightly\
    \ feature-wise. When the jQuery team noticed that several different PubSub implementations\
    \ were being used throughout the library, they decided to abstract them with `$.Callbacks`\
    \ in jQuery 1.7.<sup>2</sup> Instead of using an array to store the handlers corresponding\
    \ to an event type, you could use a `$.Callbacks` instance, which takes a few\
    \ options:\n\n+   - **once**: The callback list will only fire once. This is used\
    \ for Promises, which we'll learn about in a later chapter.\n- **memory**: If\
    \ the callback list has already been fired when a new callback is added, the new\
    \ callback is immediately called. Again, this is mainly for Promises.\n- **stopOnFalse**:\
    \ If a callback returns false, no further callbacks will be invoked for that event.\
    \ If you're familiar with jQuery events, this should sound familiar.\n- **unique**:\
    \ If a particular callback has already been attached, attempts to attach it again\
    \ are ignored.\n\nOddly, `$.Callbacks` takes its options as a single space-delimited\
    \ string:\n\n```\n$.Callbacks('unique memory');\n```\n\nMore commonly, many PubSub\
    \ implementations parse the event string to provide special features. For example,\
    \ you may be familiar with namespaced events in jQuery, where I can bind a \"\
    click.uniqueName\" event for easy unbinding later. Backbone.js (which we'll learn\
    \ more about soon) lets you bind handlers to the \"all\" event type, causing them\
    \ to go off whenever anything happens. Both jQuery and Backbone let you bind or\
    \ emit multiple event types simultaneously by separating them with spaces, e.g.\
    \ \"keypress mousemove\".\n\n# Synchronicity\n\nAlthough PubSub is an important\
    \ technique for dealing with async events, there's nothing inherently async about\
