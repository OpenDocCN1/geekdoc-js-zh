  md: "Async Problems and Solutions\n\n```\nvar deferred = new $.Deferred();\nreading.on('failure',\
    \ function(err, retry) {\n  if (reading.failedAttempts >= 3) deferred.reject(err);\n\
    });\nreading.on('success', deferred.resolve);\n```\n\n# 6.3 Problem: Testing async\
    \ code\n\nIn languages like Java and Ruby, test cases can just be lists of assertions.\
    \ Unfortunately, that won't cut it when testing async JavaScript code, because\
    \ the test runner has no way of knowing when the test case is complete. It's important\
    \ to use a JavaScript testing framework that can handle async test cases and produce\
    \ meaningful output despite the unpredictable order of assertions.\n\n# Solution:\
    \ Use Mocha\n\nThe successor to Expresso, Mocha is a one-size-fits-all testing\
    \ framework for both the browser and Node.2 While async testing was something\
    \ of a pain in older testing frameworks like QUnit (requiring async test cases\
    \ to manually start and stop the runner), Mocha makes it \"just work.\" Here's\
    \ an example using Mocha's TDD-style interface (which I prefer for its simplicity\
    \ over the default BDD-style interface):\n\n```\nvar assert = require('assert');\n\
    \nsuite('gamification', function() {\n  setup(gamify);\n\n  test('gamify resets\
    \ points', function() {\n    assert.equal(points, 0);\n  });\n\n  test('player\
    \ points are loaded on login', function(done) {\n    assert.equal(points, 0);\n\
    \    login(mock.username, mock.password, function(err, success) {\n      if (err)\
    \ throw err;\n      assert.ok(success);\n      assert.equal(points, mock.points);\n\
    \      done();\n    });\n  });\n});\n```\n\n2http://visionmedia.github.com/mocha/"
