  md: "Assume the assertions all pass. When this code is run, via the command `mocha\
    \ -u tdd test.js`, the test runner will report the first test case's success as\
    \ soon as it returns, and will report the second test case's success as soon as\
    \ it calls `done`. But wait—how did it know to wait for `done` to be called in\
    \ the second case?\n\nThe magic here is in a JavaScript feature called *arity*.\
    \ The arity of a function is the number of declared arguments it takes. That number\
    \ is exposed as the `length` property:\n\n```\n(function() { ... }).length; //\
    \ 0\n(function(done) { ... }).length; // 1\n```\n\nUsing this to distinguish synchronous\
    \ functions from async ones is a clever hack, though it comes with a caveat: If\
    \ you accidentally declare a synchronous test case with an argument, e.g.\n\n\
    ```\ntest('bedard', function(done) {\n    assert.ok(true);\n});\n```\n\nyou'll\
    \ get the error output\n\n```\nx 1 of 1 tests failed:\n\n1) bedard:\n    Error:\
    \ timeout of 2000ms exceeded\n```\n\nUsually, declaring functions without unnecessary\
    \ arguments is good style. In Mocha, it's a matter of life or death.\n\n# 6.4\
    \ Problem: Aggregating events\n\nWith the rise of evented models, it's become\
    \ easy to oversaturate an application with events, slowing it to a crawl. For\
    \ instance, in a game, we might represent each of thousands of characters in a\
