    \n## 3.7 Binding to the future with pipe\n\nPart of the reason that performing\
    \ a series of async tasks is often inconvenient in JavaScript is that you can't\
    \ attach handlers to the second task until the first one is complete. As an example,\
    \ let's GET data from one URL, then POST it to another:\n\n```\nvar getPromise\
    \ = $.get('/query');\ngetPromise.done(function(data) {\n  var postPromise = $.post('/search',\
    \ data);\n});\n// Now we'd like to attach handlers to postPromise...\n```\n\n\
