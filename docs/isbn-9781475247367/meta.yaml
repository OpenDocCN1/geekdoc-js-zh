  - "[PAGE 10]\n\n# # Where to turn for help?\n\nWhen pondering questions like “Should\
    \ I use `typeof` or `instanceof`?” steer clear of the dated, ad-riddled W3Schools\
    \ site (which sadly tends to be favored by Google searches). Instead, jump to\
    \ MDN,¹ the Mozilla Developer Network. There, the makers of Firefox (including\
    \ Brendan Eich, the creator of JavaScript) have compiled a comprehensive guide\
    \ to not only JavaScript, but HTML and CSS as well. The site can be a bit overwhelming\
    \ at first, but learn your way around and a bounty of JavaScript expertise will\
    \ be your reward.\n\nIf you can't find your answer on MDN, head to the Q&A site\
    \ Stack Overflow.² The site has fostered an amazingly helpful developer community,\
    \ and any coherent question tagged “JavaScript” or “CoffeeScript” will receive\
    \ a prompt response.\n\n# # Code style in this book\n\nJavaScript has many stylistic\
    \ dialects. For this book, I've adopted the popular combination of two-space soft\
    \ tabs and camelCased identifiers.\n\nSlightly more esoterically, I've tried to\
    \ adopt the chaining convention favored by Reg Braithwaite, where indentation\
    \ levels distinguish different objects. For instance, I would write the jQuery\
    \ expression\n\n```\n$('h1').first().addClass('first').end().last().addClass('last');\n\
    ```\n\nas\n\n```\n$('h1')\n  .first()\n  .addClass('first')\n.end()\n  .last()\n\
    \  .addClass('last');\n```\n\nbecause the `end` method returns the same object\
    \ as the original selector, whereas `first` and `last` return something different.\n\
    \nUnder Braithwaite's terminology, the technique used in code like\n\n```\nturtle\n\
    \  .turnRight(90)\n  .moveForward(5);\n```"
