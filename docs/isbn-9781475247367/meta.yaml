  md: "# 2 Distributed Events\n\nIn the last chapter, we looked at how async events\
    \ work in JavaScript. But in practice, how should we handle those events?\n\n\
    That may sound like a silly question. Just attach a handler to each event your\
    \ app cares about; right? But when a single event has several consequences, the\
    \ \"one event, one handler\" approach forces handlers to grow to *gargantuan*\
    \ proportions.\n\nTake, for example, a web-based word processor like Google Docs.\
    \ When a user presses a key, a number of things need to happen: the new character\
    \ has to be added to the DOM and the caret moved; the action has to be pushed\
    \ to the Undo history and synced to the server; the new word has to be spell-checked;\
    \ the word count and page count may need to be updated. Carrying out all of these\
    \ tasks and more from a single event handler is a daunting proposition.\n\nFrom\
    \ a mechanical perspective, every task that we want performed in response to the\
    \ event does indeed have to be initiated from the event handler. But for the sake\
    \ of us humans, it's usually better to replace the one-size-fits-all event handler\
    \ with a more malleable, dynamic construct—one that we can add tasks to, and remove\
    \ tasks from, at any time. In short, we want to use *distributed events*, where\
    \ a single incident can trigger reactions throughout our application.\n\nIn this\
    \ chapter, we'll learn about the PubSub pattern and evented models, which are\
    \ increasingly ubiquitous features of JavaScript applications. We'll also take\
    \ a look at custom events in jQuery and meet a new library called LucidJS that's\
    \ ideal for wiring PubSub objects together.\n\n# 2.1 PubSub\n\nSince the dawn\
    \ of JavaScript, browsers have allowed event handlers to be attached to DOM elements\
    \ like so:\n\n```\nlink.onclick = clickHandler;\n```\n\nAh, simplicity itself!\
    \ There's just one caveat: If you wanted *two* click handlers for an element,\
    \ you'd have to aggregate them yourself with a wrapper function:\n\n```\nlink.onclick\
    \ = function() {\n  clickHandler1.apply(this, arguments);\n  clickHandler2.apply(this,\
    \ arguments);\n};\n```\n\nNot only is this tedious, it's also a recipe for bloated,\
    \ all-purpose handler functions.\nThat's why the W3C added addEventListener to\
    \ the DOM spec in 2000, and jQuery abstracted it with the bind method. bind makes\
    \ it easy to add as many handlers as you like to any event on any element (or\
    \ set of elements), without worrying about stepping on anyone else's toes:"
  merge: -1
  pgno: 24
