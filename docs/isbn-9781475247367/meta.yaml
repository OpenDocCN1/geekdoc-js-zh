    \n**总结：** 事件可以在代码运行时*排队*，但它们不能*触发*，直到运行时空闲。\n\n### 细节，细节\n\n你可能想知道运行时究竟如何决定触发哪些排队的事件。不幸的是，具体细节因\
    \ JavaScript 环境而异，即使在现代网络浏览器之间也是如此。我设置了 jsFiddle 示例来说明这一点。³ HTML 包含一个带有 id masochist\
    \ 的单一链接，代码如下：\n\n```\nvar clickCount = 0, link;\nlink = document.getElementById('masochist');\n\
