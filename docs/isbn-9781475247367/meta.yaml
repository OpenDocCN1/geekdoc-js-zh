    \nif (cluster.isMaster) {\n  // spin up workers\n  var coreCount = require('os').cpus().length;\n\
    \  for (var i = 0; i < coreCount; i++) {\n    var worker = cluster.fork();\n \
    \   worker.send('Hello, Worker!', 2);\n    worker.on('message', function(message)\
    \ {\n      if (message._queryId) return;\n      console.log(message);\n    });\n\
    \  }\n} else {\n  process.send('Hello, main process!');\n  process.on('message',\
    \ function(message) {\n    console.log(message);\n  });\n}\n```\n\nThe output\
    \ will look something like\n\n```\nHello, main process!\nHello, main process!\n\
    Hello, Worker!\nHello, Worker!\nHello, main process!\nHello, Worker!\nHello, main\
    \ process!\nHello, Worker!\n```\n\nwhere the order is unpredictable, because each\
    \ thread is racing to console.log first.\n\nAs with Web Workers, the API is symmetric,\
    \ with a send call on one side triggering a 'message' event on the other side.\
    \ But notice that the argument to send (or rather, a serialized copy) is given\
    \ directly by the 'message' event, rather than being attached as the data property.\n\
    \nNotice the line\n\n```\nif (message._queryId) return;\n```"
  - "[PAGE 70]\n\nMulti-threading with Workers\n\n59\n\n{ cmd: 'online', _queryId:\
    \ 1, _workerId: 1 }\n\nIt's safe to ignore these internal messages, but be aware\
    \ that they're used to perform some important magic behind the scenes. Most notably,\
    \ when Workers try to listen on a TCP port, Node uses internal messages to allow\
    \ the port to be shared.\n\n# Restrictions on Node Workers\n\nFor the most part,\
    \ cluster obeys the same rules as Web Workers: There's a master, and there are\
    \ Workers; they communicate via events with attached strings or serializable objects.\
    \ However, while Workers are obviously second-class citizens in the browser, Node's\
    \ Workers possess all the rights and privileges of the master except, notably:\n\
    \n+   1. The ability to shut down the application,\n2. The ability to spawn more\
    \ Workers, and\n3. The ability to communicate with each other.\n\nThis gives the\
    \ master the burden of being a hub for all inter-thread communication. Fortunately,\
    \ as we'll see in the next section, we can abstract this inconvenience away with\
    \ libraries.\n\n# Clusterhub\n\nTypically, Node servers have kept inter-process\
    \ communication down to a minimum. As long as Workers keep to themselves, using\
    \ cluster is trivial. But that means that all server state has to be kept in an\
    \ external database. For some applications, that's just not realistic.\n\nRoly\
    \ Fentanes's Clusterhub solves this problem by giving us an inter-process EventEmitter,\
    \ combined with an evented data store called EventVat. This makes it easy to share\
    \ small pieces of state across all processes.\n\nFor instance, suppose we had\
    \ a clustered server that displayed a hit count (remember the '90s?). We might\
    \ naively implement the master process this way:\n\n```\nvar hitCount = 0;\nworker.on('message',\
    \ function(e) {\n    if (e.cmd !== 'setHitCount') return;\n    hitCount = e.val;\n\
    \    workers.forEach(function(worker) {\n        worker.send({cmd: 'updateHitCount',\
    \ val: hitCount});\n    });\n});\n```"
  - "[PAGE 71]\n\n# And the Worker this way:\n\n```\nvar hitCount = 0;\nprocess.on('message',\
    \ function(e) {\n  if (e.cmd !== 'updateHitCount') return;\n  hitCount = e.val;\n\
    });\nfunction onRequest() {\n  process.send({cmd: 'setHitCount', val: hitCount++});\n\
    \  // ...\n}\n```\n\nThere are several problems here. Most obviously, this is\
    \ an awful lot of code for something so simple. And because each process is storing\
    \ its own copy of hitCount, if two requests hit two processes at the same time,\
    \ they'd both receive the same hit count in response. For our purposes, that's\
    \ OK; what matters is that we have eventual consistency.\n\nUnfortunately, we\
    \ don't even have that. If two Workers receive requests simultaneously (that is,\
    \ each sends a setHitCount before receiving the 'updateHitCount' event caused\
    \ by the other Worker's action), the master hitCount (and consequently the second\
    \ Worker's) will only be incremented once. And if we start a new Worker at any\
    \ time, the master hitCount will be reset to 1 if it receives its first request\
    \ before it receives an 'updateHitCount' command!\n\nThe fix is clear enough:\
    \ We should store just one instance of hitCount, in the master process, and do\
    \ the incrementing there. But for a larger application, this would mean writing\
    \ a master function for every possible operation that we might want to perform\
    \ on a piece of data. Which is why, thankfully, there's the aforementioned EventVat,\
    \ a key-val store that lives within a Node process. Clusterhub provides a hub\
    \ object to each process that acts as an inter-process EventEmitter and EventVat\
    \ store, making our hit count example trivial:\n\n```\n// master\nvar hub = require('clusterhub');\n\
    hub.set('hitCount', 0);\n\n// Workers\nvar hub = require('clusterhub');\nfunction\
    \ onRequest() {\n  hub.incr('hitCount', function(hitCount) {\n    // ...\n  });\n\
    }\n```"
- md: "EventVat's Redis-like API allows us to express complex data queries in a single\
    \ interprocess message. For instance, the `mset` function allows us to set multiple\
    \ values at once.\n\nCurrently, most Node apps use a Redis store for things like\
    \ session state, but I wouldn't be surprised to see Clusterhub take over that\
    \ role in the near future. Its approach promises higher performance, better security,\
    \ and one less dependency to set up on the server.\n\n## Temporary threads\n\n\
    The `cluster`/`child_process` approach is well-suited to splitting up an application\
    \ into ongoing processes, but what if you want a single block of synchronous code\
    \ to be run in a separate thread? That's the use case that Threads A GoGo was\
    \ made for.⁹ It's an ideal library for making long computations non-blocking.\n\
    \nRegrettably, there's no equivalent for the browser. It takes significant overhead\
    \ to create a new Web Worker, making them ill-suited to one-shot tasks. In the\
    \ absence of a W3C standard for evaluating code in a separate thread, the best\
    \ we can do is create and manage a pool of Web Workers ourselves. No doubt new\
    \ libraries will make this easier as Web Workers become an ubiquitous browser\
    \ feature.\n\nThat choreography by a sequence of method invocations, promises,\
    \ and callbacks. A future version of App.\n\nThat does it for our discussion of\
    \ Workers in the browser and the server. It's early days, but I'd say the future\
    \ of multi-core JavaScript is bright. For any application that can be split up\
    \ into largely independent processes that only need to talk to each other periodically,\
    \ Workers are a winning solution for leveraging maximum CPU power. And with libraries\
    \ like Clusterhub, distributed computing has never been more fun.\n\n⁹ https://github.com/xk/node-threads-a-gogo\n\
    \n# 6 Async Problems and Solutions\n\nIn this final chapter, we'll look at some\
    \ common async conundrums. Thanks to the tools we've picked up from earlier chapters,\
    \ solving them should be a piece of cake.\n\n## 6.1 Problem: Where'd this go?\n\
    \nIt's a rite of passage for JavaScripters: You pass a callback. You use `this`\
    \ in that callback, not giving the matter much thought. You spend the next several\
    \ hours trying to figure out why your code is broken and *cursing the day you\
    \ were born*. Or, at least, you join one of the thousands who've posted examples\
    \ like this to Stack Overflow:\n\n```\n// each button has data indicating an \"\
    action\" to take\n$('button').click(function() {\n  $(this).after('<a href=\"\
    #\" id=\"confirm\">Confirm</a>');\n  $('#confirm').click(function() {\n    var\
    \ action = $(this).data('action');\n    // why is action undefined???\n  });\n\
    });\n```\n\njQuery bears some responsibility for the confusion. Devs who are unaware\
    \ of the `call` and `apply` methods that can warp it to anything a function's\
    \ caller desires expect `this` to scope like an ordinary variable, albeit one\
    \ mysteriously set in their event handlers via dark magicks. But the problem also\
    \ arises in ordinary `setTimeout`s:\n\n```\nvar account = {\n  balance: 500,\n\
    \  showBalance: function() { console.log(this.balance); }\n};\naccount.showBalance()\
    \           // 500\nsetTimeout(account.showBalance, 0); // undefined\n```\n\n\
    `account.showBalance()` calls the method in the account context, but when `account.showBalance`\
    \ is passed to a function, the original context is lost.\n\n### Solution 1: Capture\
    \ this\n\nThe most common solution to this problem is to simply store the value\
    \ of `this` that you want in a separate variable. Traditionally, a name like `self`\
    \ is used, but I prefer a clearer identifier:\n\n```\n$('button').click(function()\
    \ {\n  var button = this;\n  $(button).after('<a href=\"#\" id=\"confirm\">Confirm</a>');\n\
    \  $('#confirm').click(function() {\n    var action = $(button).data('action');\n\
    \    // works\n  });\n});\n```\n\nThis works for our setTimeout example as well:\
    \ Just change showBalance to\n\n```\nshowBalance: function() { console.log(account.balance);\
    \ }\n```\n\n### Solution 2: Bind callbacks to this\n\nJavaScripters have long\
    \ known that a function can be made impervious to the dark magicks of call and\
    \ apply by wrapping them in another function. Utility libraries like Underscore.js\
    \ include a bind method for just such a purpose:\n\n```\n$('button').click(function()\
    \ {\n  $(this).after('<a href=\"#\" id=\"confirm\">Confirm</a>');\n  $('#confirm').click(_.bind(function()\
    \ {\n    var action = $(this).data('action');\n    // works!\n  }, this));\n});\n\
    ```\n\nWhat we've done here is forced the inner callback to have the same value\
    \ of this as the outer one. This is such a common pattern that CoffeeScript makes\
    \ it as easy as declaring the bound function with => instead of ->. In newer JS\
    \ runtimes (cutting-edge browsers and Node), the bind method is part of the function\
    \ prototype itself, so we could write:\n\n```\n$('#confirm').click((function()\
    \ {\n  ...\n}).bind(this));\n```\n\nBinding is widely used but slightly controversial.\
    \ It's generally less efficient than capturing this, and has a tendency to complicate\
    \ stack traces. See Patrick Mueller's blog post \"bind() considered harmful.\"\
    ¹ Perhaps more importantly, when some callbacks are bound and others aren't, it\
    \ tends to exacerbate confusion about what this is at a particular line of code.\n\
    \n¹ http://pmuellr.blogspot.com/2010/06/bind-considered-harmful.html\n\n### Solution\
    \ 3: Work around this\n\nThis solution only applies to jQuery, as most libraries\
    \ are content to allow `this` in callbacks to take its default value, the root\
    \ object (window in browsers, global in Node). jQuery is not, and some prominent\
    \ JavaScript developers (including Jeremy Ashkenas, creator of CoffeeScript and\
    \ Backbone.js) have called that a mistake. Although most jQuery coders use `this`\
    \ to get the DOM element that an event was fired from, you can use the less ambiguous\
    \ `e.currentTarget` instead (where `e` is the event object that jQuery passes\
    \ as the first argument to the handler):\n\n```\n$('button').click(function(e)\
    \ {\n  $(e.currentTarget).after('<a href=\"#\" id=\"confirm\">Confirm</a>');\n\
    \  $('#confirm').click(function() {\n    var action = $(e.currentTarget).data('action');\n\
    \    // works!\n  });\n});\n```\n\nOf course, `e` is just as prone to overuse\
    \ as `this`, so consider using a distinguishing identifier like `buttonEvent`\
    \ instead.\n\n## 6.2 Problem: Retrying async tasks\n\nOften, we'll want to attempt\
    \ an async task *n* times before declaring failure, particularly when the task\
    \ involves connecting to a remote server. The basics of this problem are obvious:\n\
    \n1. We need to store the number of failed attempts\n2. When an attempt fails,\
    \ we need to increment the number of failed attempts and check whether it exceeds\
    \ the maximum\n\nThis translates into a lot of boilerplate code that we don't\
    \ want to repeat every time we run into this scenario, e.g.\n\n```\nvar callback,\
    \ failedAttempts = 0, maxAttempts = 3;\nasyncTask(callback = function(err) {\n\
    \  if (err) {\n    failedAttempts++;\n    if (failedAttempts >= maxAttempts) {\n\
    \      failCallback(err);\n    } else {\n      asyncTask(callback);\n    }\n```\n\
    \nHow can we make this simple?\n\n### Solution 1: Callback-style\n\nAssuming that\
    \ we're using Node-style callbacks, we can translate our boilerplate above into\
    \ a reusable utility function:\n\n```\nfunction attemptAndRetry(asyncTask, maxAttempts,\
    \ callback) {\n  asyncTask(function (err) {\n    if (err) {\n      if (maxAttempts\
    \ <= 1) {\n        callback(err);\n      } else {\n        attemptAndTry(asyncTask,\
    \ maxAttempts - 1, callback);\n      };\n    } else {\n      callback.apply(this,\
    \ arguments);\n    };\n  });\n}\n```\n\nNotice that we're using quasi-recursion\
    \ here. There's no risk of exceeding the stack limit, as long as asyncTask's callback\
    \ runs from the event queue.\n\nThis is the most direct solution, but there are\
    \ a couple of things I don't like about it. For one, calling the function is a\
    \ tad awkward:\n\n```\nattemptAndRetry(function(callback) {\n  fs.readFile('locked.txt',\
    \ 'utf8', callback);\n}, 5, function(err, result) {\n  ...\n});\n```\n\nAnother\
    \ problem is that we don't get fine-grained control over the process. For instance,\
    \ what if we want to log the error on each failed attempt?"
  mdcn: "\nEventVat 的 Redis 风格 API 允许我们通过单条进程间消息表达复杂的数据查询。例如，`mset` 函数允许我们一次性设置多个值。\n\
    \n目前，大多数 Node 应用使用 Redis 存储会话状态等数据，但若 Clusterhub 不久后能取代这一角色，我也不会感到意外。其方案承诺带来更高的性能、更好的安全性，并且无需在服务器上额外配置依赖项。\n\
    \n## 临时线程\n\n`cluster`/`child_process` 方法非常适合将应用程序拆分为持续运行的进程，但如果你想在单独的线程中运行一段同步代码块呢？这正是\
    \ Threads A GoGo 的设计用例。⁹ 它是使长时间计算变为非阻塞的理想库。\n\n遗憾的是，浏览器端没有等效方案。创建新的 Web Worker\
    \ 开销很大，使其不适合用于一次性任务。在缺乏用于在独立线程中执行代码的 W3C 标准的情况下，我们能做的最好选择是自行创建和管理 Web Worker 池。随着\
    \ Web Worker 成为浏览器的普遍特性，无疑会有新的库让这件事变得更简单。\n\n通过一系列方法调用、promise 和回调进行这种协调。App 的未来版本...\n\
    \n关于 Worker 在浏览器和服务器端的讨论就到这里。目前尚处于早期阶段，但我认为多核 JavaScript 的未来是光明的。对于任何可以拆分为主要独立、仅需定期相互通信的进程的应用程序，Worker\
    \ 都是充分利用 CPU 能力的制胜方案。而有了 Clusterhub 这样的库，分布式计算从未如此有趣。\n\n⁹ https://github.com/xk/node-threads-a-gogo\n\
    \n# 6 异步问题与解决方案\n\n在最后一章，我们将探讨一些常见的异步难题。得益于我们从前面章节中学到的工具，解决它们应该会轻而易举。\n\n## 6.1\
    \ 问题：this 去哪了？\n\n这是 JavaScript 开发者必经的考验：你传递了一个回调函数。你在该回调中使用 `this`，并未多想。接下来的几个小时，你都在试图弄清楚为什么代码坏了，并*诅咒自己为何要出生在这个世上*。或者，至少，你加入了成千上万在\
    \ Stack Overflow 上发布此类示例的人行列：\n\n```\n// each button has data indicating an \"\
    action\" to take\n$('button').click(function() {\n  $(this).after('<a href=\"\
    #\" id=\"confirm\">Confirm</a>');\n  $('#confirm').click(function() {\n    var\
    \ action = $(this).data('action');\n    // why is action undefined???\n  });\n\
    });\n```\n\njQuery 对这种混淆负有部分责任。那些不了解 `call` 和 `apply` 方法的开发者——这些方法可以将 `this` 变形为函数调用者期望的任何值——会期望\
    \ `this` 像普通变量一样作用域，尽管它是通过某种神秘魔法在事件处理器中设置的。但这个问题也出现在普通的 `setTimeout` 中：\n\n```\n\
    var account = {\n  balance: 500,\n  showBalance: function() { console.log(this.balance);\
    \ }\n};\naccount.showBalance()           // 500\nsetTimeout(account.showBalance,\
    \ 0); // undefined\n```\n\n`account.showBalance()` 在 account 上下文中调用该方法，但当 `account.showBalance`\
    \ 传递给函数时，原始上下文就丢失了。\n\n### 解决方案 1：捕获 this\n\n这个问题最常见的解决方案是简单地将你想要的 `this` 值存储在一个单独的变量中。传统上，使用\
    \ `self` 这样的名称，但我更喜欢一个更清晰的标识符：\n\n```\n$('button').click(function() {\n  var button\
    \ = this;\n  $(button).after('<a href=\"#\" id=\"confirm\">Confirm</a>');\n  $('#confirm').click(function()\
    \ {\n    var action = $(button).data('action');\n    // works\n  });\n});\n```\n\
    \n这对我们的 setTimeout 示例也有效：只需将 showBalance 更改为\n\n```\nshowBalance: function() {\
    \ console.log(account.balance); }\n```\n\n### 解决方案 2：将回调绑定到 this\n\nJavaScript\
    \ 开发者早就知道，通过将函数包装在另一个函数中，可以使其免受 call 和 apply 黑魔法的影响。像 Underscore.js 这样的工具库包含一个\
    \ bind 方法，正是为此目的：\n\n```\n$('button').click(function() {\n  $(this).after('<a\
    \ href=\"#\" id=\"confirm\">Confirm</a>');\n  $('#confirm').click(_.bind(function()\
    \ {\n    var action = $(this).data('action');\n    // works!\n  }, this));\n});\n\
    ```\n\n我们在这里做的是强制内部回调与外部回调具有相同的 this 值。这是一个非常常见的模式，CoffeeScript 通过使用 => 而不是 ->\
    \ 声明绑定函数使其变得简单。在较新的 JS 运行时（前沿浏览器和 Node）中，bind 方法是函数原型本身的一部分，所以我们可以这样写：\n\n```\n\
    $('#confirm').click((function() {\n  ...\n}).bind(this));\n```\n\n绑定被广泛使用但略有争议。它通常比捕获\
    \ this 效率低，并且倾向于使堆栈跟踪复杂化。参见 Patrick Mueller 的博客文章 \"bind() considered harmful。\"\
    ¹ 或许更重要的是，当一些回调被绑定而另一些没有时，它往往会加剧关于代码特定行上 this 是什么的困惑。\n\n¹ http://pmuellr.blogspot.com/2010/06/bind-considered-harmful.html\n\
    \n### 解决方案 3：绕过 this\n\n此解决方案仅适用于 jQuery，因为大多数库都满足于允许回调中的 `this` 取其默认值，即根对象（浏览器中为\
    \ window，Node 中为 global）。jQuery 则不然，一些著名的 JavaScript 开发者（包括 CoffeeScript 和 Backbone.js\
    \ 的创造者 Jeremy Ashkenas）称这是一个错误。虽然大多数 jQuery 编码者使用 `this` 来获取触发事件的 DOM 元素，但你可以使用更明确的\
    \ `e.currentTarget` 来代替（其中 `e` 是 jQuery 作为第一个参数传递给事件处理程序的事件对象）：\n\n```\n$('button').click(function(e)\
    \ {\n  $(e.currentTarget).after('<a href=\"#\" id=\"confirm\">Confirm</a>');\n\
    \  $('#confirm').click(function() {\n    var action = $(e.currentTarget).data('action');\n\
    \    // works!\n  });\n});\n```\n\n当然，`e` 和 `this` 一样容易被滥用，因此可以考虑使用一个更具区分性的标识符，如\
    \ `buttonEvent`。\n\n## 6.2 问题：重试异步任务\n\n通常，我们会想要在宣告失败之前尝试异步任务 *n* 次，特别是当任务涉及连接远程服务器时。这个问题的基础很明显：\n\
    \n1. 我们需要存储失败尝试的次数\n2. 当尝试失败时，我们需要增加失败尝试次数并检查是否超过最大值\n\n这转化为大量样板代码，我们不希望每次遇到这种情况都重复，例如：\n\
    \n```\nvar callback, failedAttempts = 0, maxAttempts = 3;\nasyncTask(callback\
    \ = function(err) {\n  if (err) {\n    failedAttempts++;\n    if (failedAttempts\
    \ >= maxAttempts) {\n      failCallback(err);\n    } else {\n      asyncTask(callback);\n\
    \    }\n```\n\n如何让这变得简单？\n\n### 解决方案 1：回调风格\n\n假设我们使用 Node 风格的回调，我们可以将上述样板代码转换为可重用的工具函数：\n\
    \n```\nfunction attemptAndRetry(asyncTask, maxAttempts, callback) {\n  asyncTask(function\
    \ (err) {\n    if (err) {\n      if (maxAttempts <= 1) {\n        callback(err);\n\
    \      } else {\n        attemptAndTry(asyncTask, maxAttempts - 1, callback);\n\
    \      };\n    } else {\n      callback.apply(this, arguments);\n    };\n  });\n\
    }\n```\n\n注意我们这里使用了准递归。只要 asyncTask 的回调从事件队列运行，就不会有超出栈限制的风险。\n\n这是最直接的解决方案，但有几点我不太喜欢。首先，调用这个函数有点笨拙：\n\
    \n```\nattemptAndRetry(function(callback) {\n  fs.readFile('locked.txt', 'utf8',\
    \ callback);\n}, 5, function(err, result) {\n  ...\n});\n```\n\n另一个问题是我们无法对过程进行细粒度控制。例如，如果我们想在每次失败尝试时记录错误呢？\n"
