  - '[PAGE 63]


    # 4.8 Other flow control libraries


    Before we close the chapter, let me mention a couple of interesting flow control
    libs that we might learn from.


    # Futures


    Previously mentioned in Chapter 3, AJ O''Neal''s Futures has a little bit of everything:
    It''s part flow control, part Promises, and part PubSub.⁴ It''s a one-stop shop
    for all your async needs. Unfortunately, that wide-ranging functionality makes
    for an exhaustingly complex API.


    # nue


    Speaking of complexity, Toshihiro Nakamura''s nue⁵ is like Step''s much, *much*
    bigger brother. Whereas Step only allows flows to run in a linear order (with
    parallelism within a step), nue lets you spawn sub-flows, share data by attaching
    it to a shared object, name flows and steps for debugging, and basically do anything
    else you can imagine. It''s overwhelming, but admirable.


    In this chapter, we saw how common async patterns can be implemented with minimal
    boilerplate using the right flow control functions. We also saw the biggest problem
    with flow control: That for every problem, there''s an overwhelming number of
    solutions to choose from.


    Isaac Schlueter, the creator of npm and recently-appointed head of the Node.js
    project, made a very small flow control library called Slide.⁶ In its README,
    he wrote:


    > You should use it as an example of how to write your own flow control utilities.
    You''ll never fully appreciate a flow control lib that you didn''t write yourself.


    I hope that''s not true. Writing a flow control lib is a good exercise, but you
    shouldn''t have to reinvent the wheel just to see how it works. As the JavaScript
    ecosystem matures, flow control should become more widespread and more standardized.
    My prediction is that a library will emerge that will do for flow control what
    jQuery did for DOM interaction, or what Underscore.js has done for (synchronous)
    functional-style programming. When that happens, it''ll be a great day for JavaScript.


    ⁴https://github.com/coolaj86/futures


    ⁵https://github.com/nakamura-to/nue


    ⁶https://github.com/isaacs/slide-flow-control'
  - "[PAGE 64]\n\n# # 5 Multi-threading with Workers\n\nAt the start of this book,\
    \ I described events as an alternative to multi-threading. More precisely, events\
    \ replace a specific kind of multi-threading, the kind where multiple parts of\
    \ an application process run simultaneously (either virtually, through interrupts,\
    \ or physically on multiple CPU cores). This gets to be a problem when code running\
    \ in different threads have access to the same data. Even a line as simple as\n\
    \n```\ni++;\n```\n\ncan be a source of pernicious Heisenbugs when it allows separate\
    \ threads to modify the same i at the same time. Thankfully, this kind of multi-threading\
    \ is impossible in JavaScript.\n\nOn the other hand, distributing tasks across\
    \ multiple CPU cores is increasingly essential, as those cores are no longer making\
    \ the same exponential gains in efficiency, year after year, that used to expect.\
    \ So we *need* multi-threading. Does that mean abandoning events?\n\n*Au contraire!*\
    \ While running on a single thread isn't ideal, naively distributing an app across\
    \ multiple cores can be even worse. Multi-core systems slow to a crawl when those\
    \ cores have to constantly talk to each other to avoid stepping on each other's\
    \ toes. It's much better to give each core a separate job, then sync up occasionally.\n\
    \nThat's precisely what Workers do in JavaScript. From the master thread of your\
    \ application, you tell a Worker, \"Go run this code in a separate thread.\" The\
    \ Worker can send you messages (and vice versa), which take the form of (what\
    \ else?) callbacks run from the event queue. In short, you interact with different\
    \ threads the same way that you do I/O in JavaScript.\n\nIn this chapter, we'll\
    \ look at Workers in their browser and Node manifestations, and discuss some practical\
    \ applications.\n\n# ## 5.1 Web Workers\n\nWeb Workers are part of the living\
    \ standard widely known as HTML5. To create one, you call the global Worker constructor\
    \ with the URL of a script:\n\n```\nvar worker = new Worker('kimptoc.js');\nworker.addEventListener('error',\
    \ function() {\n    console.log('Chris Kimpton failed to load.');\n});\n```\n\n\
    > (**Warning:** As a security measure, the URL passed to Worker must have the\
    \ same origin—protocol, host, and port—as the page.)"
  - "[PAGE 65]\n\nNow *kimptoc.js* will be fetched asynchronously and, assuming that\
    \ the script loads successfully, it'll start running in another thread. Congratulations:\
    \ We have a Web Worker!\n\nMore specifically, we have a *dedicated* Web Worker,\
    \ which can only talk to the browser process that created it. It's also possible\
    \ to have *shared* Web Workers that can be used to coordinate multiple browser\
    \ tabs; however, these are less widely supported, so we won't cover them in this\
    \ chapter.\n\n# Talking to Web Workers\n\nIn addition to 'error' events (which\
    \ are emitted when the Worker script fails to load, or when the script throws\
    \ an exception), Workers can emit a 'message' event containing an arbitrary string\
    \ or JSON-serializable object sent from the Worker's self.postMessage function:\n\
    \n```\nvar worker = new Worker('worker.js');\nworker.addEventListener('message',\
    \ function(e) {\n  console.log(e.data);  // echo whatever was sent by postMessage\n\
    });\n```\n\n(Usually, we only want the data property from the message event. If\
    \ we were binding the same event handler to multiple Workers, we could use e.target\
    \ to determine which Worker emitted the event.)\n\nSo, now we know how to listen\
    \ to Workers. Conveniently, the interface for talking to Workers is symmetrical:\
    \ We use worker.postMessage to send it, and the Worker uses self.addEventListener('message',\
    \ ...) to receive it. Here's a complete example:\n\n```\n// master script\nvar\
    \ worker = new Worker('boknows.js');\nworker.addEventListener('message', function(e)\
    \ {\n  console.log(e.data);\n});\nworker.postMessage('football');\nworker.postMessage('baseball');\n\
    \n// boknows.js\nself.addEventListener('message', function(e) {\n  self.postMessage('Bo\
    \ knows ' + e.data);\n});\n```\n\nYou can play with the message-passing interface\
    \ at a little site I created, the Web Worker Sandbox.¹ Any time you create a new\
    \ example, it gets a unique URL that you can share.\n\n¹http://webworkersandbox.com/"
  - '[PAGE 66]


    # Restrictions on Web Workers


    Web Workers are primarily intended to handle complex computations without compromising
    DOM responsiveness. Potential uses include:


    +   - Performing physics calculations for games with CoffeePhysics.$^2$

    - Decoding video as it streams in with the Broadway implementation of the H.264
    codec.$^3$

    - Encrypting communications with the Stanford JavaScript Crypto Library.$^4$


    Typically, the Worker will send the result of its computations to the master thread,
    which will then update the page. Why not update the page directly? Mainly, to
    keep JavaScript’s async abstractions intact. If a Worker could alter the page’s
    markup, we’d end up in the same place as Java, wrapping our DOM manipulation code
    in mutexes and semaphores to avoid race conditions.


    Likewise, a Worker can’t see the global `window` object, or any other object in
    the master thread (or in other Worker threads). When an object is sent through
    `postMessage`, it’s transparently serialized and unserialized (think `JSON.parse(JSON.stringify(obj))`).
    So changes to the original object won’t affect the copy in the other thread.


    Even the trusty `console` isn’t available to Workers. All a Worker *can* see is
    its own global object, `self`, and everything bundled with it: standard JavaScript
    objects like `setTimeout` and `Math`, plus the browser’s Ajax methods.


    Ah yes, Ajax! A Worker can use `XMLHttpRequest` freely. It can even use `WebSocket`,
    if the browser supports it. From an efficiency standpoint, there’s little to gain
    just from moving Ajax functionality from the master script to a Worker, but it
    does mean that the Worker can pull data directly from the server. And if we’re
    dealing with a lot of data (like in the streaming video example), keeping it in
    one thread rather than serializing it via `postMessage` is a big win.


    There’s also a special `importScripts` function that will (synchronously) load
    and run the given script(s):


    ```

    importScripts(''https://raw.github.com/gist/1962739/danika.js'');

    ```


    Normally, synchronous loading is a big no-no, but remember that we’re in a secondary
    thread here. As long as the Worker has nothing else to do, blocking is A-OK.'
- md: "## Which browsers support Web Workers?\n\nThe Web Worker standard has been\
    \ implemented in Chrome, Firefox, and Safari for a couple of years, and will be\
    \ in the upcoming IE10. Mobile support is spotty as well: The latest iOS Safari\
    \ supports them, but the latest Android Browser doesn't. At the time of this writing,\
    \ that translates into 55.4% browser support, according to caniuse.com.<sup>5</sup>\n\
    \nIn short, most sites can't depend on Web Worker support. You can, however, easily\
    \ write a shim to run the target script normally if `window.Worker` is unavailable.\
    \ Web Workers are just a performance enhancement, after all.\n\nBe careful to\
    \ test Web Workers in multiple browsers. Because the spec hasn't been finalized,\
    \ there are some critical differences among the implementations. For instance,\
    \ Firefox allows workers to spawn their own \"subworkers,\" but Chrome currently\
    \ doesn't.\n\n### Web Workers in the real world\n\nBecause support for them is\
    \ relatively rare, as is the need to do complex computations in the browser, Web\
    \ Workers haven't seen much usage. One project that does use them is the Ace code\
    \ editor (previously known as Bespin), which checks for syntax errors in the background\
    \ as you type. This is crucial for leveling the playing field between web-based\
    \ text editors and their thread-happy desktop counterparts. When it comes to parsing\
    \ big documents in real time, one core just isn't going to cut it.\n\nWeb Workers\
    \ are a thrilling addition to modern browsers, with the potential to dramatically\
    \ improve performance. As web apps become increasingly client-heavy, we can expect\
    \ Web Workers to become a much more prominent part of the JavaScript landscape.\n\
    \n### 5.2 Node Workers with `cluster`\n\nIn the early days of Node, there were\
    \ many competing APIs for multi-threading. Most of these solutions were clumsy,\
    \ requiring users to spin up multiple instances of a server to listen on different\
    \ TCP ports which would then be hooked up to the real one via proxy. It was only\
    \ in the 0.6 release that a standard was included out of the box that allowed\
    \ multiple processes to bind to the same port: `cluster`.\n\nTypically, `cluster`\
    \ is used to spin up one process per CPU core for optimal performance (though\
    \ whether each process will actually get its own core is entirely up to the underlying\
    \ OS):\n\n```js\nvar cluster = require('cluster');\n\nif (cluster.isMaster) {\n\
    \  // spin up workers\n  var coreCount = require('os').cpus().length;\n  for (var\
    \ i = 0; i < coreCount; i++) {\n    cluster.fork();\n  }\n  // bind death event\n\
    \  cluster.on('death', function(worker) {\n    console.log('Worker ' + worker.pid\
    \ + ' has died');\n  });\n} else {\n  // die immediately\n  process.exit();\n\
    }\n```\n\nThe output will look something like\n\n```\nWorker 15330 has died\n\
    Worker 15332 has died\nWorker 15329 has died\nWorker 15331 has died\n```\n\nwith\
    \ one line for each CPU core.\n\nThe code may look baffling at first. The trick\
    \ is that while Web Workers load a separate script, `cluster.fork()` fires the\
    \ *same* script in a different process. The only way the script knows whether\
    \ it's being run as the master or a Worker is by checking `cluster.isMaster`.\n\
    \nThe reason for this design decision is that multi-threading in Node has a very\
    \ different primary use case than multi-threading in the browser. While the browser\
    \ can relegate any surplus threads to background tasks, Node servers need to scale\
    \ up the computational resources available for their main task: handling requests.\n\
    \n(External scripts can be run as separate processes using `child_process.fork`.\
    \ Its capabilities are largely identical to those of `cluster.fork`—in fact, `cluster`\
    \ uses `child_process` under the hood—except that child process can't share TCP\
    \ ports.)\n\n### Talking to Node Workers\n\nAs with Web Workers, `cluster` Workers\
    \ can communicate with the master process by sending message events, and vice\
    \ versa. The API is slightly different, though:\n\n```js\nvar cluster = require('cluster');\n\
    \nif (cluster.isMaster) {\n  // spin up workers\n  var coreCount = require('os').cpus().length;\n\
    \  for (var i = 0; i < coreCount; i++) {\n    var worker = cluster.fork();\n \
    \   worker.send('Hello, Worker!', 2);\n    worker.on('message', function(message)\
    \ {\n      if (message._queryId) return;\n      console.log(message);\n    });\n\
    \  }\n} else {\n  process.send('Hello, main process!');\n  process.on('message',\
    \ function(message) {\n    console.log(message);\n  });\n}\n```\n\nThe output\
    \ will look something like\n\n```\nHello, main process!\nHello, main process!\n\
    Hello, Worker!\nHello, Worker!\nHello, main process!\nHello, Worker!\nHello, main\
    \ process!\nHello, Worker!\n```\n\nwhere the order is unpredictable, because each\
    \ thread is racing to console.log first.\n\nAs with Web Workers, the API is symmetric,\
    \ with a send call on one side triggering a 'message' event on the other side.\
    \ But notice that the argument to send (or rather, a serialized copy) is given\
    \ directly by the 'message' event, rather than being attached as the data property.\n\
    \nNotice the line\n\n```js\nif (message._queryId) return;\n```\n\n```\n{ cmd:\
    \ 'online', _queryId: 1, _workerId: 1 }\n```\n\nIt's safe to ignore these internal\
    \ messages, but be aware that they're used to perform some important magic behind\
    \ the scenes. Most notably, when Workers try to listen on a TCP port, Node uses\
    \ internal messages to allow the port to be shared.\n\n### Restrictions on Node\
    \ Workers\n\nFor the most part, cluster obeys the same rules as Web Workers: There's\
    \ a master, and there are Workers; they communicate via events with attached strings\
    \ or serializable objects. However, while Workers are obviously second-class citizens\
    \ in the browser, Node's Workers possess all the rights and privileges of the\
    \ master except, notably:\n\n1. The ability to shut down the application,\n2.\
    \ The ability to spawn more Workers, and\n3. The ability to communicate with each\
    \ other.\n\nThis gives the master the burden of being a hub for all inter-thread\
    \ communication. Fortunately, as we'll see in the next section, we can abstract\
    \ this inconvenience away with libraries.\n\n### Clusterhub\n\nTypically, Node\
    \ servers have kept inter-process communication down to a minimum. As long as\
    \ Workers keep to themselves, using cluster is trivial. But that means that all\
    \ server state has to be kept in an external database. For some applications,\
    \ that's just not realistic.\n\nRoly Fentanes's Clusterhub solves this problem\
    \ by giving us an inter-process EventEmitter, combined with an evented data store\
    \ called EventVat. This makes it easy to share small pieces of state across all\
    \ processes.\n\nFor instance, suppose we had a clustered server that displayed\
    \ a hit count (remember the '90s?). We might naively implement the master process\
    \ this way:\n\n```js\nvar hitCount = 0;\nworker.on('message', function(e) {\n\
    \    if (e.cmd !== 'setHitCount') return;\n    hitCount = e.val;\n    workers.forEach(function(worker)\
    \ {\n        worker.send({cmd: 'updateHitCount', val: hitCount});\n    });\n});\n\
    ```\n\nAnd the Worker this way:\n\n```js\nvar hitCount = 0;\nprocess.on('message',\
    \ function(e) {\n  if (e.cmd !== 'updateHitCount') return;\n  hitCount = e.val;\n\
    });\nfunction onRequest() {\n  process.send({cmd: 'setHitCount', val: hitCount++});\n\
    \  // ...\n}\n```\n\nThere are several problems here. Most obviously, this is\
    \ an awful lot of code for something so simple. And because each process is storing\
    \ its own copy of hitCount, if two requests hit two processes at the same time,\
    \ they'd both receive the same hit count in response. For our purposes, that's\
    \ OK; what matters is that we have eventual consistency.\n\nUnfortunately, we\
    \ don't even have that. If two Workers receive requests simultaneously (that is,\
    \ each sends a setHitCount before receiving the 'updateHitCount' event caused\
    \ by the other Worker's action), the master hitCount (and consequently the second\
    \ Worker's) will only be incremented once. And if we start a new Worker at any\
    \ time, the master hitCount will be reset to 1 if it receives its first request\
    \ before it receives an 'updateHitCount' command!\n\nThe fix is clear enough:\
    \ We should store just one instance of hitCount, in the master process, and do\
    \ the incrementing there. But for a larger application, this would mean writing\
    \ a master function for every possible operation that we might want to perform\
    \ on a piece of data. Which is why, thankfully, there's the aforementioned EventVat,\
    \ a key-val store that lives within a Node process. Clusterhub provides a hub\
    \ object to each process that acts as an inter-process EventEmitter and EventVat\
    \ store, making our hit count example trivial:\n\n```js\n// master\nvar hub =\
    \ require('clusterhub');\nhub.set('hitCount', 0);\n\n// Workers\nvar hub = require('clusterhub');\n\
    function onRequest() {\n  hub.incr('hitCount', function(hitCount) {\n    // ...\n\
    \  });\n}\n```"
  mdcn: "\n## 哪些浏览器支持 Web Workers？\n\nWeb Worker 标准已经在 Chrome、Firefox 和 Safari 中实现了数年，并且即将在\
    \ IE10 中推出。移动端的支持也不稳定：最新的 iOS Safari 支持它们，但最新的 Android 浏览器不支持。截至本文撰写时，根据 caniuse.com\
    \ 的数据，浏览器支持率为 55.4%。\n\n简而言之，大多数网站还不能依赖 Web Worker 支持。不过，你可以轻松地编写一个 shim，在 `window.Worker`\
    \ 不可用时正常运行目标脚本。毕竟，Web Workers 只是一种性能增强手段。\n\n务必在多个浏览器中测试 Web Workers。由于规范尚未最终确定，不同实现之间存在一些关键差异。例如，Firefox\
    \ 允许 Worker 生成自己的\"子 Worker\"，但 Chrome 目前不支持。\n\n### 现实世界中的 Web Workers\n\n由于支持相对有限，而且在浏览器中进行复杂计算的需求也不常见，Web\
    \ Workers 的使用并不广泛。一个使用它们的项目是 Ace 代码编辑器（以前称为 Bespin），它在你输入时在后台检查语法错误。这对于拉平基于 Web\
    \ 的文本编辑器与其线程友好的桌面编辑器之间的差距至关重要。当涉及到实时解析大型文档时，单核是远远不够的。\n\nWeb Workers 是现代浏览器中令人兴奋的新增功能，有潜力显著提升性能。随着\
    \ Web 应用越来越偏向客户端，我们可以预期 Web Workers 将成为 JavaScript 领域中更为突出的组成部分。\n\n### 5.2 使用\
    \ `cluster` 的 Node Workers\n\n在 Node 的早期，存在许多竞争的多线程 API。大多数解决方案都很笨拙，要求用户启动多个服务器实例来监听不同的\
    \ TCP 端口，然后通过代理将它们连接到真正的服务器。直到 0.6 版本，才内置了一个标准，允许多个进程绑定到同一端口：`cluster`。\n\n通常，`cluster`\
    \ 用于每个 CPU 核心启动一个进程以获得最佳性能（尽管每个进程是否真的会获得自己的核心完全取决于底层操作系统）：\n\n```js\nvar cluster\
    \ = require('cluster');\n\nif (cluster.isMaster) {\n  // 启动 worker\n  var coreCount\
    \ = require('os').cpus().length;\n  for (var i = 0; i < coreCount; i++) {\n  \
    \  cluster.fork();\n  }\n  // 绑定死亡事件\n  cluster.on('death', function(worker) {\n\
    \    console.log('Worker ' + worker.pid + ' has died');\n  });\n} else {\n  //\
    \ 立即退出\n  process.exit();\n}\n```\n\n输出将类似于\n\n```\nWorker 15330 has died\nWorker\
    \ 15332 has died\nWorker 15329 has died\nWorker 15331 has died\n```\n\n每个 CPU\
    \ 核心对应一行。\n\n这段代码乍一看可能令人困惑。诀窍在于，虽然 Web Workers 加载独立的脚本，但 `cluster.fork()` 是在不同进程中运行*相同*的脚本。脚本判断自己是作为\
    \ master 还是 Worker 运行的唯一方式是检查 `cluster.isMaster`。\n\n这种设计决策的原因是，Node 中的多线程与浏览器中的多线程有着非常不同的主要使用场景。虽然浏览器可以将任何多余的线程分配给后台任务，但\
    \ Node 服务器需要扩展其主任务可用的计算资源：处理请求。\n\n（外部脚本可以使用 `child_process.fork` 作为独立进程运行。其功能与\
    \ `cluster.fork` 基本相同——事实上，`cluster` 底层使用 `child_process`——不同之处在于子进程不能共享 TCP 端口。）\n\
    \n### 与 Node Workers 通信\n\n与 Web Workers 一样，`cluster` Worker 可以通过发送消息事件与主进程通信，反之亦然。不过\
    \ API 略有不同：\n\n```js\nvar cluster = require('cluster');\n\nif (cluster.isMaster)\
    \ {\n  // 启动 worker\n  var coreCount = require('os').cpus().length;\n  for (var\
    \ i = 0; i < coreCount; i++) {\n    var worker = cluster.fork();\n    worker.send('Hello,\
    \ Worker!', 2);\n    worker.on('message', function(message) {\n      if (message._queryId)\
    \ return;\n      console.log(message);\n    });\n  }\n} else {\n  process.send('Hello,\
    \ main process!');\n  process.on('message', function(message) {\n    console.log(message);\n\
    \  });\n}\n```\n\n输出将类似于\n\n```\nHello, main process!\nHello, main process!\n\
    Hello, Worker!\nHello, Worker!\nHello, main process!\nHello, Worker!\nHello, main\
    \ process!\nHello, Worker!\n```\n\n顺序是不可预测的，因为每个线程都在竞争谁先执行 console.log。\n\n与 Web\
    \ Workers 一样，API 是对称的，一侧的 send 调用会触发另一侧的 'message' 事件。但请注意，send 的参数（更确切地说，是其序列化副本）直接由\
    \ 'message' 事件给出，而不是作为 data 属性附加。\n\n注意这一行\n\n```js\nif (message._queryId) return;\n\
    ```\n\n```\n{ cmd: 'online', _queryId: 1, _workerId: 1 }\n```\n\n忽略这些内部消息是安全的，但要注意它们用于在幕后执行一些重要的魔法。最值得注意的是，当\
    \ Worker 尝试监听 TCP 端口时，Node 使用内部消息来允许端口被共享。\n\n### Node Workers 的限制\n\n在大多数情况下，cluster\
    \ 遵循与 Web Workers 相同的规则：有一个 master，有多个 Worker；它们通过带有附加字符串或可序列化对象的事件进行通信。然而，虽然\
    \ Worker 在浏览器中显然是二等公民，但 Node 的 Worker 拥有与 master 相同的所有权利和特权，除了：\n\n1. 关闭应用程序的能力，\n\
    2. 生成更多 Worker 的能力，以及\n3. 相互通信的能力。\n\n这使得 master 承担所有线程间通信中心节点的负担。幸运的是，正如我们将在下一节中看到的，我们可以通过库将这个不便之处抽象掉。\n\
    \n### Clusterhub\n\n通常，Node 服务器将进程间通信保持在最低限度。只要 Worker 各自为政，使用 cluster 就很简单。但这意味着所有服务器状态都必须保存在外部数据库中。对于某些应用程序来说，这是不现实的。\n\
    \nRoly Fentanes 的 Clusterhub 通过为我们提供一个进程间 EventEmitter，结合一个名为 EventVat 的事件驱动数据存储来解决这个问题。这使得在所有进程之间共享小块状态变得容易。\n\
    \n例如，假设我们有一个集群服务器，显示点击次数（还记得 90 年代吗？）。我们可能会天真地以这种方式实现主进程：\n\n```js\nvar hitCount\
    \ = 0;\nworker.on('message', function(e) {\n    if (e.cmd !== 'setHitCount') return;\n\
    \    hitCount = e.val;\n    workers.forEach(function(worker) {\n        worker.send({cmd:\
    \ 'updateHitCount', val: hitCount});\n    });\n});\n```\n\n以及以这种方式实现 Worker：\n\
    \n```js\nvar hitCount = 0;\nprocess.on('message', function(e) {\n  if (e.cmd !==\
    \ 'updateHitCount') return;\n  hitCount = e.val;\n});\nfunction onRequest() {\n\
    \  process.send({cmd: 'setHitCount', val: hitCount++});\n  // ...\n}\n```\n\n\
    这里存在几个问题。最明显的是，对于如此简单的事情，代码太多了。而且由于每个进程都存储了自己的 hitCount 副本，如果两个请求同时命中两个进程，它们都会收到相同的点击次数作为响应。就我们的目的而言，这没关系；重要的是我们最终能达到一致性。\n\
    \n不幸的是，我们甚至无法保证这一点。如果两个 Worker 同时收到请求（也就是说，每个 Worker 在收到另一个 Worker 的操作导致的 'updateHitCount'\
    \ 事件之前都发送了 setHitCount），主进程中的 hitCount（以及 consequently 第二个 Worker 的 hitCount）将只会递增一次。而且如果我们在任何时候启动一个新的\
    \ Worker，如果它在收到 'updateHitCount' 命令之前收到第一个请求，主进程的 hitCount 将被重置为 1！\n\n解决方案很清楚：我们应该只在主进程中存储一个\
    \ hitCount 实例，并在那里进行递增。但对于更大的应用程序来说，这意味着我们需要为可能想要对数据执行的每一个操作编写一个主进程函数。这就是为什么，谢天谢地，有前面提到的\
    \ EventVat，一个存在于 Node 进程中的键值存储。Clusterhub 为每个进程提供了一个 hub 对象，充当进程间 EventEmitter\
    \ 和 EventVat 存储，使我们的点击次数示例变得简单：\n\n```js\n// master\nvar hub = require('clusterhub');\n\
    hub.set('hitCount', 0);\n\n// Workers\nvar hub = require('clusterhub');\nfunction\
    \ onRequest() {\n  hub.incr('hitCount', function(hitCount) {\n    // ...\n  });\n\
    }\n```\n"
