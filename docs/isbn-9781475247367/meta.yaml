    \ initially, the first two timeouts will run in parallel. But when the 100ms timeout\
    \ finishes, the next task on the queue (the 200ms timeout) will immediately start.\
    \ So in this case, `async.queue` will finish at about the same time as `async.parallel`.\
    \ The order matters: If 300 were the third timeout, the queue would take ~400ms\
    \ to complete.\n\nNote that we can always push more tasks onto the queue, and\
    \ drain will fire every time the last task on the queue has finished. It's not\
    \ a one-shot deal like `async.series` and `async.parallel`, where the task list\
    \ was fixed.\n\nLet's rewrite our file-reading example with `async.queue`, with\
    \ a reasonable cap on concurrency:\n\n```\nvar async = require('async');\nvar\
    \ fs = require('fs');\n\nvar concatenation = '';\nvar filenames = fs.readdirSync('recipes')\n\
    \  .filter(function(filename) {\n    return fs.statSync(filename).isFile();\n\
    \  });\n\nvar results = [];\nfunction worker(i, callback) {\n  fs.readFile(filenames[i],\
    \ 'utf8', function(err, result) {\n    if (err) throw err;\n    results[i] = result;\n\
    \    callback();\n  });\n}\nvar concurrency = 10;\nvar queue = async.queue(worker,\
    \ concurrency);\nfor (var i = 0; i < filenames.length; i++) {\n  queue.push(i);\n\
    }\nqueue.drain = function() {\n```"
