  md: "Async Problems and Solutions\n\n71\n\n(If you’re using Underscore.js—and you\
    \ should!—you can just use _.throttle and _.debounce.)\nWith these utility functions,\
    \ we can either overwrite checkGameState entirely or just use the\nwrapped version\
    \ from our change events. For our purposes, debounce with a delay of 0 is most\n\
    appropriate, since throttle with a short delay would allow checkGameState to run\
    \ more within a\nblock of synchronous code. debounce with a delay of 0 is effectively\
    \ equivalent to the setTimeout\nwe used in solution 2:\n\n```\nvar debouncedCheckGameState\
    \ = debounce(checkGameState, 0);\nmonsters.on('change', function() {\n    debouncedCheckGameState();\n\
    });\n```\n\nNote that it’s important to use the same throttled/debounced instance\
    \ of a function from every\nsource that we want to limit calls from. Calling\n\
    \n```\n(debounce(checkGameState, 0))();\n```\n\nwould just be an overly complicated\
    \ way of calling\n\n```\nsetTimeout(checkGameState, 0);\n```\n\nbecause calling\
    \ debounce(checkGameState, 0) again would just create a separate timeout.\n\n\
    # 6.5 Problem: Handling requests\n\nQuick question: You’re a web server. You receive\
    \ a request. What do you do?\nMost likely, lots of unrelated things. At a minimum,\
    \ you look at the requested route and map it to\na file that you send in response.\
    \ But you also probably log the request, check whether the requester\nis properly\
    \ authenticated, and fetch some data. Maybe you cache the response in memory,\
    \ too.\nMany of these pieces of functionality will be the same for some or all\
    \ routes. How do you avoid\nduplication?\n\n# Solution: The middleware pattern\n\
    \nIn the Node.js Connect framework, each middleware function takes a request object\
    \ (req), a response\nobject (res), and a next callback. Every time a new request\
    \ comes in, it’s passed to the first\nmiddleware. The middleware has three (good)\
    \ options:\n\n+   1. Handle the request itself by sending a response and returning\
    \ without calling next."
  merge: -1
  pgno: 82
- img_proc: true
  md: "Async Problems and Solutions\n\n+   2. Call next with no arguments.\n3. Call\
    \ next with an error argument.\n\nThe next callback Connect generates either passes\
    \ the request on to the next middleware on the stack, or to an error handler.\
    \ And that's basically all Connect does. This simple pattern (the core implementation\
    \ is less than 200 lines¹) has proven so successful that just about every Node\
    \ server framework has been built on top of Connect, most notably Express.js.\n\
    \nConsider using the middleware pattern in other contexts where an action needs\
    \ to be handled in several discrete steps. The only difference between a middleware\
    \ stack and an ordinary callback stack (like we saw in Chapter 2) is that each\
    \ function on the stack receives a next function that allows it to declare that\
    \ it's finished, making an async series of actions possible. Here's a minimal\
    \ implementation for comparison's sake:\n\n```\n// callback stack\nfunction trigger()\
    \ {\n  handlers.forEach(function(handler) {\n    handler();\n  });\n}\n\n// middleware\
    \ stack\nfunction trigger() {\n  invoke(0);\n}\nfunction invoke(idx) {\n  if (handlers.length\
    \ <= idx) {\n    return;\n  } else {\n    handlers[idx](function(err) {\n    \
    \  if (err) throw err;\n      if (handlers.length > idx + 1) invoke(idx + 1);\n\
    \    });\n  }\n}\n```\n\nPerceptive readers may be reminded of async.series from\
    \ Chapter 4. Connecting functions this way is an extremely common pattern. Feel\
    \ free to reinvent the wheel, but be aware that the wheel is already available\
    \ under the MIT License.\n\n¹https://github.com/senchalabs/connect/blob/master/lib/proto.js"
  merge: -1
  pgno: 83
- img_proc: true
  md: "# 6.6 Problem: Ajax spaghetti\n\nConsider this an integrative exercise. How\
    \ do we turn highly nested code like this into something clearer, better-organized,\
    \ less repetitive, and easier to modify if we decide to change our application's\
    \ behavior?\n\n```\n$(function() {\n  $('#menu').on('click', 'a', function clickHandler()\
    \ {\n    // we put a spinner on the selected menu item\n    var $clickedLink =\
    \ $(this).spin();\n    // we disable the menu until our Ajax call returns\n  \
    \  $('#menu').off('click', 'li > a');\n    $.get('/content/' + $clickedLink.index(),\
    \ {\n      success: function successHandler(response) {\n        $clickedLink.unspin();\n\
    \        $('#menu').on('click', 'li > a', clickHandler);\n        // we fade the\
    \ content out\n        $('#content').fadeOut(function() {\n          // .then\
    \ we fade it in with the Ajax markup\n          $('#content').html(response).fadeIn();\n\
    \        });\n      },\n      error: function() {\n        // we make one retry\
    \ in case the error is just a fluke\n        $.get('/content/' + $clickedLink.index(),\
    \ {\n          success: successHandler,\n          error: function() {\n     \
    \       $clickedLink.unspin();\n            $('#menu').on('click', 'li > a', clickHandler);\n\
    \            modal('Error retrieving content from the server.');\n          }\n\
    \        });\n      }\n    });\n    return false; // prevent default click behavior\n\
    \  });\n});\n```\n\n# Solution: Distribute, distribute, distribute\n\nThe big\
    \ problem with the code above is that it's way too centralized. *Everything* that\
    \ happens in response to a menu click goes in the click handler, and *everything*\
    \ that happens in response to the"
  merge: -1
  pgno: 84
- img_proc: true
  md: "# Async Problems and Solutions\n\nAjax request goes in the Ajax response handler.\
    \ We need to spread things out in a way that makes sense.\n\nThere are plenty\
    \ of ways we could do that here—using custom jQuery events, for example—but the\
    \ approach I'd recommend is using an evented model to represent the menu. The\
    \ model will encapsulate the state that we need to capture from the various async\
    \ events, and the abstraction will make it easy for us to change our event flow\
    \ in the future.\n\nLet's start by asking, \"What state do we need to store?\"\
    \ I can think of three things:\n\n+   1. Whether our menu is in its \"ready,\"\
    \ clickable state, or in the \"unready\" state with a spinner over the active\
    \ link.\n2. Which link is currently active (in the process of having associated\
    \ content loaded), if any.\n3. How many attempts we've made so far to request\
    \ content from the server for the active link.\n\nThe first two sound like they\
    \ should be associated with the menu. So that gives us our menu model:\n\n```\n\
    window.menu = new Backbone.Model({\n  ready: false,\n  activeLinkIndex: -1\n});\n\
    ```\n\nWhy does our menu start out with `ready: false`? Because the menu element\
    \ may not exist yet in the document. We want `ready` to correspond to the click\
    \ handler being attached. We also want to ensure that there is no active link\
    \ when the menu becomes ready:\n\n```\nmenu.on('change:ready', function(ready)\
    \ {\n  if (ready) {\n    $('#menu').on('click', 'li > a', menu.clickHandler);\n\
    \    menu.set('activeLinkIndex', -1);\n  } else {\n    $('#menu').off('click',\
    \ 'li > a');\n  }\n});\n```\n\nNotice the reference to `menu.clickHandler`. For\
    \ convenient namespacing, we'll go ahead and attach all of our menu-related event\
    \ handlers to the menu model:\n\n```\nmenu.clickHandler = function() {\n  menu.set({ready:\
    \ false, activeLinkIndex: $(this).index()});\n  return false;\n}\n```"
  merge: -1
  pgno: 85
- img_proc: true
  md: "Declaring the menu ready is the only thing that has to wait for the DOM. So\
    \ our jQuery callback, which originally wrapped around *everything*, is just a\
    \ one-liner:\n\n```\n$(function() { menu.set({ready: true}); });\n```\n\n(Note\
    \ that it's important for this line to come after `menu.clickHandler` is defined,\
    \ because the callback will run synchronously if the document is already ready.)\n\
    \nThe click handler modifies the menu's `activeLinkIndex`, so let's respond to\
    \ that by fetching the appropriate content and adding the Ajax spinner to the\
    \ correct menu item:\n\n```\nmenu.on('change:activeLinkIndex', function(activeLinkIndex)\
    \ {\n    $('#menu').children().unspin()\n        .eq(activeLinkIndex).spin();\n\
    \    menu.fetchSelectedContent();\n});\n```\n\nIf `activeLinkIndex` is changed\
    \ to -1 (indicating that no link is active), the `eq(activeLinkIndex)` selector\
    \ will match no elements, so no Ajax spinner will appear. And the first line of\
    \ our `fetchSelectedContent` will simply return:\n\n```\nmenu.fetchSelectedContent\
    \ = function() {\n    if (menu.get('activeLinkIndex') === -1) return;\n    $.ajax({\n\
    \        url: '/content/' + menu.get('activeLinkIndex'),\n        tryCount: 0\n\
    \    })\n    .done($('#content').fadeHtml)\n    .done(function() { menu.set({ready:\
    \ true}); })\n    .failure(function() {\n        this.tryCount++;\n        if\
    \ (this.tryCount >= 2) {\n            modal('Error retrieving content from the\
    \ server.');\n        } else {\n            $.ajax(this);\n        };\n    });\n\
    }\n```\n\nThis is our most complex function, but every line serves a clear purpose.\
    \ When the Ajax call succeeds:"
  merge: -1
  pgno: 86
- img_proc: true
  md: "+   1. The content element's `fadeHtml` method is called with the data retrieved\
    \ from the server. `fadeHtml` is a simple plugin that we'll define shortly.\n\
    2. The menu is restored to its ready state. Recall that this will also reset `activeLinkIndex`\
    \ to -1.\n\nWhen the Ajax call fails:\n\n+   1. `this` in a jQuery Ajax callback\
    \ points to the `jqXHR` object that, among other things, stores all of the settings\
    \ passed in to `$.ajax`. We use that to store our `tryCount`.\n2. Because `this`\
    \ also contains our `url` property, we can simply write `$.ajax(this)` to reattempt\
    \ the Ajax call. This technique was popularized by a blog post entitled \"Defensive\
    \ Ajax and Ajax retries in jQuery.\".\n\nIf we felt like the `fetchSelectedContent`\
    \ method was too large, we could move the `failure` handler out of it. That's\
    \ the great thing about evented code: As long as state is stored rationally, you\
    \ have unlimited flexibility.\n\nNow the only gap left to fill in is to define\
    \ `fadeHtml`:\n\n```\n$.fn.fadeHtml = function(markup) {\n  return this.fadeOut(function()\
    \ {\n    $(this).html(markup).fadeIn();\n  });\n};\n```\n\nAnd that's it! We have\
    \ a little more code than we started with, but it's many times easier to work\
    \ with.\n\nI hope you found the examples in this chapter helpful. No book could\
    \ ever cover every possible asynchronous scenario, but by this point you should\
    \ have a solid foundation to build on.\n\nCongratulations on reaching the end\
    \ of the book! Where to go from here? You could write your own flow control library\
    \ (apparently it's the new national pastime), or port standard Unix commands to\
    \ Node.js, or reverse-engineer Facebook. But I hope you'll do something new instead.\
    \ With a solid grasp of JavaScript and a little imagination, the range of things\
    \ you can accomplish is limitless.\n\nSo go ahead. Make the Internet a better\
    \ place.\n\n*http://zeroedandnoughted.com/defensive-ajax-and-ajax-retries-in-jquery/"
  merge: -1
