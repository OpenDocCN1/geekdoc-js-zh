    \    callback();\n  });\n}\nvar concurrency = 10;\nvar queue = async.queue(worker,\
    \ concurrency);\nfor (var i = 0; i < filenames.length; i++) {\n  queue.push(i);\n\
    }\nqueue.drain = function() {\n  console.log(concatenation = results.join(' '));\n\
    };\n```\n\nasync.queue is performing the role of traffic cop here by ensuring\
    \ that we're only reading up to 10 files at a time. Unfortunately, it doesn't\
    \ ensure that push callbacks are invoked in any particular order, forcing us to\
    \ awkwardly manage our own results array.\n\n## Advanced queue callbacks\n\nAlthough\
    \ drain is usually the only handler you'll need, async.queue provides a few other\
    \ events:\n\n- When the last task has started running, the queue calls empty.\
    \ (When the task finishes, it calls drain.)\n- When the concurrency limit is reached,\
    \ the queue calls saturated.\n- If you provide a function as the second argument\
    \ in a push, it'll be called when the given task (or each task in the given array)\
    \ is finished.\n\nIn short, async.queue is one of the most versatile functions\
    \ in Async.js, an all-purpose valve for limiting concurrency.\n\n## 4.6 On autopilot\n\
    \nAs powerful as async.queue is, there are some cases it can't handle. Consider\
    \ a complex application's startup process. A small part of that process might\
    \ look something like this:\n\n1. Read a configuration file\n2. Connect to the\
    \ database specified by the configuration file\n3. Connect to the cache specified\
    \ by the configuration file\n4. Load the most-used objects from the database into\
    \ the cache\n5. Connect to an external API\n6. Start responding to HTTP requests\n\
    \nHere, tasks 2 and 3 both depend on task 1, task 4 depends on tasks 2 and 3,\
    \ and task 6 depends on tasks 2, 3 and 5. You could just do these tasks in linear\
    \ order, but that would slow the server's startup unnecessarily. What we want\
    \ is to run each task as soon as its dependencies have finished.\n\nTo do that,\
    \ we could write a Promise for each task and work out the logic ourselves with\
    \ whens and thens... or we could just let an algorithm solve it for us. After\
    \ all, any set of dependencies can be translated into a directed graph, and solving\
    \ math problems is what computers are for! In World War II, computers calculated\
    \ bomb trajectories. Today, they calculate the trajectories of angry avians. My\
    \ point is, dependency graphs are a breeze for machines to work out.\n\nasync.auto\
    \ lets us describe a dependency graph in the form of a single object, where the\
    \ keys are task names and the values are arrays of the form\n\n[dependencies...,\
    \ task]\n\nwhere dependencies is a list of task names and task is the function\
    \ itself. If a task has no dependencies, we can just write\n\ntask\n\ninstead\
    \ of\n\n[task]\n\nHere's how we'd implement our server's startup process, assuming\
    \ we've already defined the constituent tasks:\n\n```\nasync.auto({\n  readConfigFile:\
    \ readConfigFile,\n  connectToDB:    ['readConfigFile', connectToDB],\n  connectToCache:\
    \ ['readConfigFile', connectToCache],\n  cacheObjects:   ['connectToDB', 'connectToCache',\
    \ cacheObjects],\n  connectToAPI:   connectToAPI,\n  acceptHTTPReqs: ['connectToDB',\
    \ 'connectToCache', 'connectToAPI',\n                   acceptHTTPReqs]\n});\n\
    ```\n\n(As a convention, I've used the function names as the keys of the dependency\
    \ graph. async.auto itself doesn't care what names the functions have.)\n\nAlthough\
    \ auto isn't widely used, it's an extremely powerful function that you should\
    \ be aware of. In a complex application, it could be a real lifesaver.\n\nThat's\
    \ it for our coverage of Async.js, the most widely used and arguably the most\
    \ feature-rich flow control lib. However, I don't want you to get the impression\
    \ that Async.js is the right tool for every callback-driven job. Let's close out\
    \ the chapter by looking at a few alternatives.\n\n## 4.7 Minimalist flow control\
    \ with Step\n\nThe most well-known alternative to Async.js is Tim Caswell's Step.²\
    \ Step is much lighter than Async.js, with an API consisting of a single function:\
    \ `Step`. `Step` takes a list of functions, e.g.\n\n```\nStep(task1, task2, task3);\n\
    ```\n\nEach function can control the flow in three ways:\n\n1. It can call `this`\
    \ to make Step run the next function in the list.\n2. It can call a callback generated\
    \ by `this.parallel` or `this.group` *n* times to tell Step to run the next function\
    \ *n* times.\n3. It can return a value, which will also make Step run the next\
    \ function in the list. This makes it easy to mix synchronous functions with async\
    \ ones.\n\nThe next function will receive the results of its predecessor (that\
    \ is, its return value or the arguments it passed to `this`), or the results of\
    \ all instances of its predecessor if that predecessor was run with `this.parallel`\
    \ or `this.group`. (The difference is that `this.parallel` provides those results\
    \ as separate arguments, while `this.group` merges them into arrays.)\n\nThe entire\
    \ library is, as of this writing, just 152 lines long (with comments), yet versatile\
    \ enough to handle most async flows. The downside of this minimalism is that a\
    \ flow created with Step can only be understood by reading each function in it.\
    \ Flows created with the everything-but-the-kitchen-sink Async.js tend to be more\
    \ self-explanatory.\n\nHere's a good middleground: Whatever functionality you\
    \ need from Async.js, try writing it yourself with Step. For example, here's the\
    \ equivalent of `async.map` in just 11 lines:\n\n```\nvar Step = require('step');\n\
    \nfunction stepMap(arr, iterator, callback) {\n  Step(\n    function() {\n   \
    \   var group = this.group();\n      for (var i = 0; i < arr.length; i++) {\n\
    \        iterator(arr[i], group());\n      };\n    },\n    callback\n  );\n}\n\
    ```"
