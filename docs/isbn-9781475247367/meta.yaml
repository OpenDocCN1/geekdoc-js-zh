    \ we haven't given pipe a callback for what the original Promise does?\n\nSimple:\
    \ The piped promise mimics the original Promise in those cases. We can say that\
    \ the original Promise's behavior cascades through the piped Promise. This cascading\
    \ is very handy, because it allows us to define branching logic for async tasks\
    \ with minimal effort. Suppose we have a three-step process:\n\n```\nvar step1\
    \ = $.post('/step1', data1);\nvar step2 = step1.pipe(function() {\n  return $.post('/step2',\
    \ data2);\n});\nvar lastStep = step2.pipe(function() {\n  return $.post('/step3',\
