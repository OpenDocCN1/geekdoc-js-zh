  - "[PAGE 21]\n\n```\ntry {\n    checkPassword(username, passwordGuess, matchHandler);\n\
    } catch (e) {\n    console.log(e);\n}\n```\n\nDo you see the problem here? `checkPassword`\
    \ itself, as we’ve defined it, will never throw an error. Only the async callback\
    \ **nested inside** of it will. And that callback only cares about `checkPassword`\
    \ for scoping purposes. Trying to put a `try...catch` block around an async callback\
    \ is pointless. That’s why Node callbacks almost always take an error as their\
    \ first argument.\n\n# Uncaught exceptions\n\nWhen we throw an exception from\
    \ a callback, it’s up to the code running the callback to catch it. If it doesn’t,\
    \ then the runtime will handle it. Modern browsers typically log the error on\
    \ the developer console and return to the event queue, though this behavior can\
    \ be overridden with a “global catch” by attaching a handler to `window.onerror`.\n\
    \nNode’s equivalent of `window.onerror` is the `process` global’s `‘uncaughtException’`\
    \ event:\n\n```\nprocess.on('uncaughtException', function (err) {\n    console.log(err);\
    \ // shutdown averted.\n});\n```\n\nNormally, a Node app will exit immediately\
    \ on an uncaught exception. But as long as at least one `uncaughtException` handler\
    \ exists, the app will simply return to the event queue. Node servers typically\
    \ use this, making `throw` safe. The downside to this is that it isn’t transparent:\
    \ When you throw an exception, it could trigger any number of `uncaughtException`\
    \ handlers, registered by any module in your application. Writing `return log(err);`\
    \ instead of `throw err` would give a much better sense of `err`’s fate.\n\nSome\
    \ JavaScript developers, notably Isaac Schlueter, have argued more broadly that\
    \ try/catch is an anti-pattern.⁵ He’d like to see `throws` used purely as asserts,\
    \ to bring things to a halt when they’re misbehaving.\n\n**Remember:** Exceptions\
    \ live strictly in the land of synchronicity. When you reach the event queue,\
    \ the stack is reset. Every stack trace is an unbroken chain of blocking code.\n\
    \n# 1.6 Tools for taming JavaScript\n\nThe rest of this book is concerned with\
    \ libraries and design patterns for working with events in pure JavaScript. But\
    \ before we proceed, you should be aware that there are some alternatives, which\
    \ I’ll note briefly here.\n\n⁵ https://groups.google.com/forum/#!topic/nodejs/1E5ssslxrrU"
