    \ succeed, and it'll be rejected if *any* of the three fail. If we only care about\
    \ the process as a whole, we can omit the variable declarations for the earlier\
    \ steps:\n\n```\nvar posting = $.post('/step1', data1)\n  .pipe(function() {\n\
    \    return $.post('/step2', data2);\n  })\n  .pipe(function() {\n    return $.post('/step3',\
