  md: "# Distributed Events\n\nThe output is\n\n```\nfoo\nbar\n```\n\nproving that\
    \ the `click` handler was invoked immediately by `trigger`. In fact, whenever\
    \ an event fires, all of its handlers will be executed sequentially without interruption.\n\
    \nSo let's be clear: When the user clicks the \"Submit\" button, that's an *async\
    \ event*: the first click handler fires from the event queue. But taken as a whole,\
    \ everything that happens as a result of that click is *synchronous*, unless one\
    \ of the click handlers uses something like `setTimeout`. This is important because\
    \ if too many handlers fire in sequence, you risk blocking the thread and making\
    \ the browser unresponsive.\n\nThink back to the word processor example at the\
    \ start of this chapter. When a user presses a key, many things need to happen,\
    \ and several of them may take very complex calculations. Doing them all before\
    \ returning to the event queue would be a recipe for an unresponsive app.\n\n\
    A good solution to this problem is to maintain your own queue of things that don't\
    \ need to happen right away, and use a timed function to process the queue periodically.\n\
    \n# ## 2.2 Evented models\n\nA special case of PubSub is when an object used to\
    \ store data (a \"model\") issues events whenever its contents are modified. Let's\
    \ look at the popular Backbone.js[^3] framework, which has been used at companies\
    \ ranging from 37signals to Pandora to *The New York Times*. You can create a\
    \ new model like so:\n\n```\nstyle = new Backbone.Model(\n  {font: 'Georgia'}\n\
    );\n```\n\n`model` just represents the simple object that was passed in:\n\n```\n\
    style.toJSON()  // {font: 'Georgia'}\n```\n\nBut unlike an ordinary object, this\
    \ one can publish notifications when a change is made:\n\n```\nstyle.on('change:font',\
    \ function(model, font) {\n  alert('Thank you for choosing ' + font + '!');\n\
    });\n```\n\n> [^3]: http://documentcloud.github.com/backbone/"
