  md: "```\n// $container could be $('#sidebar') or $(document)\n$container.triggerHandler('newTooltip');\n\
    $container.one('newTooltip', $tooltip.remove);\n```\n\n(Notice the use of jQuery’s\
    \ `one` instead of `on`. The difference is that `one` automatically removes the\
    \ handler after it fires.)\n\nWith these two lines of code, each tooltip will\
    \ listen to its container and remove itself when the container gets a new tooltip.\
    \ It’s a beautifully direct, efficient approach that saves us from having to store\
    \ any state or engineer complex selectors (which would slow older browsers to\
    \ a crawl—IE7 and below don’t even have a way of selecting all elements with the\
    \ `tooltip` class without traversing the whole document!).\n\nNote that event\
    \ bubbling would actually have defeated our intent in this case: When we create\
    \ a new tooltip in the sidebar, we only want tooltips listening for the `newTooltip`\
    \ event on the sidebar itself to go away, not those on the surrounding document.\
    \ Always think carefully about whether `trigger` or `triggerHandler` is the right\
    \ tool for the job.\n\n# 2.4 Piping events with LucidJS\n\nAs we’ve seen, there\
    \ are an abundance of options for PubSub. That’s actually a problem, as most apps\
    \ will involve multiple sources of events with subtly different APIs. Wouldn’t\
    \ it be nice if we could unify these emitters and route events cohesively?\n\n\
    Enter LucidJS, a new event library (in fact, it arrived on GitHub just weeks before\
    \ the first publication of this book) that can listen to events from DOM elements\
    \ and jQuery objects. That way, you can “pipe” those events through Lucid’s own\
    \ `EventEmitter`-like objects:\n\n```\n// Sailor Moon fan service\nvar riniEmitter\
    \ = LucidJS.emitter();\nriniEmitter.pipe($('#serenity'));\nriniEmitter.pipe(blackLadyEmitter);\n\
    riniEmitter.on('fight', function() {\n    console.log('Pink sugar heart attack!');\n\
    });\n```\n\nNow whenever the `$('#serenity')` jQuery object or `blackLadyEmitter`\
    \ emits a `fight` event, `riniEmitter` will forward that event to the given handler.\n\
    \nAs PubSub interfaces gain popularity in JavaScript, the `pipe` technique is\
    \ bound to become more common, as it allows events from multiple sources to be\
    \ monitored in one place."
