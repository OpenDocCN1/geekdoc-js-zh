  md: "Promises and Deferreds\n\n25\n\n# # 3.2 Making Promises\n\nWe started this\
    \ chapter by showing how the Ajax methods in jQuery 1.5+ ($ .ajax, $.get, and\
    \ $.post) return Promises. But to really understand Promises, we need to make\
    \ a few of our own.\n\nLet's give the user a prompt to hit either Y or N. (You\
    \ can see this example in action on jsFiddle.\")\n\nThe first thing we'll do is\
    \ create an instance of $.Deferred that represents the user's decision:\n\n```\n\
    var promptDeferred = new $.Deferred();\npromptDeferred.always(function(){ console.log('A\
    \ choice was made:'); });\npromptDeferred.done(function(){ console.log('Starting\
    \ game...'); });\npromptDeferred.fail(function(){ console.log('No game today.');\
    \ });\n```\n\n> (Note: Under jQuery 1.5, the always method was called complete.\
    \ Under jQuery 1.6/1.7, always and complete are synonymous, but always is preferred.\
    \ The complete alias is deprecated and may be removed in a future release.)\n\n\
    You're probably wondering why I created an instance of Deferred when this section\
    \ is called \"Making Promises.\" Fear not—a Deferred is a Promise! More precisely,\
    \ it's a superset of Promise with one critical addition: You can trigger a Deferred\
    \ directly. A pure Promise only lets you add more callbacks; someone else has\
    \ to trigger them.\n\nWe can trigger our Deferred with the resolve and reject\
    \ methods:\n\n```\n$('#playGame').focus().on('keypress', function(e) {\n    var\
    \ Y = 121, N = 110;\n    if (e.keyCode === Y) {\n        promptDeferred.resolve();\n\
    \    } else if (e.keyCode === N) {\n        promptDeferred.reject();\n    } else\
    \ {\n        return false;  // our Deferred remains pending\n    }\n});\n```\n\
    \nNow load the page and hit Y. The console will say:\n\nA choice was made:\nStarting\
    \ game...\n\nYou see what happened? When the Deferred was resolved, its always\
    \ and done callbacks were run.\n\nRefresh and hit N:\n\nhttp://jsfiddle.net/TrevorBurnham/Pj6Bf/"
