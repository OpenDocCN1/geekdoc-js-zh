  md: "is called *chaining* (because each method returns the same object the method\
    \ was called on), while the technique used in code like\n\n```\n[1, 2, 3, 4, 5]\n\
    \    .filter(function(int) { return int % 2 === 1; })\n    .forEach(function(odd)\
    \ { console.log(odd); })\n```\n\nis called *pipelining*, since `filter` and `forEach`\
    \ return different things.\n\n# A word on \"altJS\"\n\nThere are a number of \"\
    alternative JavaScripts\" out there: languages that compile to JavaScript, adding\
    \ on new features or making code easier to write. (A fairly comprehensive list\
    \ can be found at altJS.org.^11^) This book is not about them. It's about writing\
    \ the best JavaScript possible without the use of a pre-compiler. I have nothing\
    \ against altJS (see the section on CoffeeScript below), but I believe that it's\
    \ important to understand the underlying language. Some folks have called JavaScript\
    \ \"the new assembly\" or \"the new bytecode\"; maybe it will be some day, but\
    \ not yet.\n\nSome altJS languages are specifically aimed at \"taming\" async\
    \ callbacks by allowing them to be written in a more synchronous style. A few\
    \ of these languages are listed at the end of Chapter 1.\n\n# CoffeeScript\n\n\
    It's no secret that I ♥ CoffeeScript, a super-succinct language that compiles\
    \ to JavaScript. I use it for my own projects whenever I can. I've given talks\
    \ on it at conferences like Railsconf and Sweden's Øredev. I even wrote the first\
    \ book on it: *CoffeeScript: Accelerated JavaScript Development*,^12^ published\
    \ by the Pragmatic Programmers, plus a quick-reference guide for the iPad^13^\
    \ with runnable examples.\n\nBut when I decided to start this book, I realized\
    \ that doing it in CoffeeScript would needlessly limit its appeal. By and large,\
    \ CoffeeScripters understand JavaScript perfectly well, whereas code like `square\
    \ = (x) -> x * x` might as well be hieroglyphics to JavaScript purists. So, if\
    \ you're a CoffeeScripter: My apologies for the curly braces.\n\nRest assured\
    \ that the lessons you draw from this book will carry over to any language you\
    \ use that compiles to JavaScript.\n\nEnough prefacing. Let's get our async on!\n\
    \n11 http://altjs.org/\n12 http://pragprog.com/book/tbcoffee/coffeescript\n13\
    \ http://bit.ly/zvdiKj"
