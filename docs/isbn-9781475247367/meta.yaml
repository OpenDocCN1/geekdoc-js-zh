    ### Pipe cascading\n\npipe doesn't require you to provide every possible callback.\
    \ In fact, you'll usually just want to write\n\n```\nvar pipedPromise = originalPromise.pipe(successCallback);\n\
    ```\n\nor\n\n```\nvar pipedPromise = originalPromise.pipe(null, failCallback);\n\
    ```\n\nWe've seen what happens when the original Promise succeeds in the first\
    \ case, or fails in the second case, so that the piped Promise's behavior depends\
