    \ you a Promise that represents the result of that callback.\"\n\n```\nvar getPromise\
    \ = $.get('/query');\nvar postPromise = getPromise.pipe(function(data) {\n  return\
    \ $.post('/search', data);\n});\n```\n\nLooks like dark magic, right? Here's a\
    \ breakdown: pipe takes the same three arguments as clerk, one for each type of\
    \ callback: done, fail, and progress. So in this example, we just provided a callback\
    \ that gets run when getPromise is resolved. The pipe method returns a new Promise\
    \ that's resolved/rejected when the Promise returned from our callback is resolved/rejected.\
    \ Effectively, pipe is a window into the future.\n\nYou can also use pipe to \"\
    filter\" a Promise by modifying callback arguments. If a pipe callback returns\
    \ something other than a Promise/Deferred, then that value becomes the callback\
    \ argument. For instance, if you have a Promise that emits progress notifications\
