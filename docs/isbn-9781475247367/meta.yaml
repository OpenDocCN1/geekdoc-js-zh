    \      } else {\n        results = Array.prototype.slice.call(arguments, 1);\n\
    \        emitter.emit('success', results);\n      }\n    });\n  }\n  process.nextTick(retry);\
    \  // ensure asynchronicity\n  return emitter;\n}\n```\n\n这可能比我们之前的定义稍微复杂一些，但它让调用者的工作变得极其简单：\n\
    \n```\nvar reading = attempt(function(callback) {\n  fs.readFile('locked.txt',\
    \ 'utf8', callback);\n});\nreading.on('failure', function(err, retry) {\n  console.error(err);\n\
    \  if (reading.failedAttempts < 3) retry();\n});\nreading.on('success', function(contents)\
    \ {\n  //\n});\n```\n\n现在我们已经清晰地暴露了状态，并精确控制了何时重试我们的函数。此外，由于我们可以为同一事件附加多个处理程序，因此可以很容易地从多个角度查看进程状态。例如，我们可以将任务映射到\
    \ Promise 上以便于监控：\n\n```\nvar deferred = new $.Deferred();\nreading.on('failure',\
    \ function(err, retry) {\n  if (reading.failedAttempts >= 3) deferred.reject(err);\n\
    });\nreading.on('success', deferred.resolve);\n```\n\n## 6.3 问题：测试异步代码\n\n在 Java\
    \ 和 Ruby 等语言中，测试用例可以只是一系列断言。不幸的是，这在测试异步 JavaScript 代码时行不通，因为测试运行器无法知道测试用例何时完成。使用能够处理异步测试用例并产生有意义的输出（尽管断言的顺序不可预测）的\
    \ JavaScript 测试框架非常重要。\n\n## 解决方案：使用 Mocha\n\n作为 Expresso 的继任者，Mocha 是一个适用于浏览器和\
    \ Node 的通用测试框架。[2] 虽然异步测试在较旧的测试框架（如 QUnit，需要异步测试用例手动启动和停止运行器）中是一件痛苦的事，但 Mocha\
    \ 让它\"开箱即用\"。以下是使用 Mocha 的 TDD 风格接口的示例（我更喜欢它的简洁性，而不是默认的 BDD 风格接口）：\n\n```\nvar\
    \ assert = require('assert');\n\nsuite('gamification', function() {\n  setup(gamify);\n\
    \n  test('gamify resets points', function() {\n    assert.equal(points, 0);\n\
    \  });\n\n  test('player points are loaded on login', function(done) {\n    assert.equal(points,\
    \ 0);\n    login(mock.username, mock.password, function(err, success) {\n    \
    \  if (err) throw err;\n      assert.ok(success);\n      assert.equal(points,\
    \ mock.points);\n      done();\n    });\n  });\n});\n```\n\n假设所有断言都通过了。当通过命令 `mocha\
    \ -u tdd test.js` 运行此代码时，测试运行器会在第一个测试用例返回时立即报告其成功，并在第二个测试用例调用 `done` 时立即报告其成功。但是等等——它怎么知道在第二种情况下等待\
    \ `done` 被调用呢？\n\n这里的玄妙之处在于一个名为 *arity* 的 JavaScript 特性。函数的 arity 是指它声明的参数数量。该数字作为\
    \ `length` 属性暴露出来：\n\n```\n(function() { ... }).length; // 0\n(function(done)\
    \ { ... }).length; // 1\n```\n\n使用这种特性来区分同步函数和异步函数是一个巧妙的方法，但它有一个注意事项：如果你不小心为同步测试用例声明了一个参数，例如\n\
    \n```\ntest('bedard', function(done) {\n    assert.ok(true);\n});\n```\n\n你会得到的错误输出\n\
    \n```\nx 1 of 1 tests failed:\n\n1) bedard:\n    Error: timeout of 2000ms exceeded\n\
    ```\n\n通常，声明函数时避免不必要的参数是良好的风格。在 Mocha 中，这却是生死攸关的事。\n\n## 6.4 问题：聚合事件\n\n随着事件驱动模型的兴起，很容易让应用程序被事件淹没，使其运行缓慢。例如，在游戏中，我们可能会用\
    \ Backbone 模型来表示关卡中数千个角色，并在这些模型发生任何变化时执行游戏逻辑。但是当玩家投掷手榴弹，一次炸掉 100 个怪物时，我们并不想执行\
    \ 100 次相同的逻辑。我们该如何避免这种情况？\n\n## 解决方案 1：静默 change 事件\n\nBackbone 为我们提供了一个特殊标志，可以用来在不触发\
    \ 'change' 事件的情况下修改模型：\n\n```\nmonsters.each(function(damage) {\n  this.set({life:\
    \ this.get('life') - damage}, {silent: true});\n});\n```\n\n如果使用得当，这是解决问题的最有效方案。但这只有在我们对正在静默修改的每个模型应该发生什么变化有绝对了解的情况下才能奏效。\n\
    \n静默化事件就像一把手术刀。凭借稳健的双手和精确的计划，它可以成为无价的工具；否则，它只会造成混乱。\n\n## 解决方案 2：使用简单的 timeout\n\
    \n请记住，即使是 0ms 的延迟也会确保一个函数在所有同步代码之后运行。我们可以利用这一点，让 `checkGameState` 函数在所有单个怪物模型更新后只运行一次：\n\
    \n```\nvar checkGameStateTimeout;\nfunction checkGameState() {\n  // if no monster\
    \ allies remain, you lose\n  var isTheGameLost = monsters.filter(function() {\n\
    \    return this.get('ally');\n  }).length === 0;\n  // and so on..\n}\n\nvar\
    \ monsters = new Backbone.Collection;\nmonsters.on('change', function() {\n  clearTimeout(checkGameStateTimeout);\n\
    \  checkGameStateTimeout = setTimeout(checkGameState, 0);\n});\n```\n\n现在，无论有多少怪物同时被改变，`checkGameState`\
    \ 只会响应一次。\n\n## 解决方案 3：节流/防抖\n\n我们已经看过一个从更新模型的应用程序部分操作的解决方案，以及另一个从模型端工作的解决方案。但最优雅的方法通常是针对我们想要防止被过于频繁调用的特定函数进行操作。一般来说，这意味着我们要限制\
    \ checkGameState 每 *n* 毫秒只运行一次。对此有两种基本方法：\n\n- 1. *节流（Throttling）*，如果距离上次运行不到\
    \ *n* 毫秒，则忽略对该函数的额外调用，以及\n2. *防抖（Debouncing）*，将对该函数的任何调用延迟，直到自上次调用以来已经过去了 *n*\
    \ 毫秒\n\n通常，你想要节流，因为防抖会给每个函数调用增加一些延迟。此外，防抖意味着如果函数被调用得太频繁，它将*永远不会*被调用！（有时防抖会实现最大延迟来避免这一点。）然而，在想要等到输入源空闲的场景中，例如渲染预览或在用户短暂停止输入后才运行验证，防抖更为可取。\n\
    \n节流和防抖都很容易实现，只需创建一个元函数，返回原始函数的包装版本。以下是两个简单的实现：\n\n```\nfunction throttle(func,\
    \ minDelay) {\n  var lastHitDate = 0;\n  return function() {\n    var now = new\
    \ Date();\n    if (now - lastHitDate >= minDelay) {\n      lastHitDate = now;\n\
    \      return func.apply(this, arguments);\n    };\n  };\n}\n```\n\n```\nfunction\
    \ debounce(func, delay) {\n  var timeout;\n  return function() {\n    var args\
    \ = arguments;\n    clearTimeout(timeout);\n    timeout = setTimeout(function()\
    \ {\n      func.apply(this, args);\n    }, delay);\n  };\n}\n```\n\n（如果你正在使用 Underscore.js——你应该用！——可以直接使用\
    \ `_.throttle` 和 `_.debounce`。）\n\n有了这些工具函数，我们可以完全覆盖 checkGameState，或者只是从我们的 change\
    \ 事件中使用包装版本。就我们的目的而言，延迟为 0 的防抖最合适，因为短延迟的节流会允许 checkGameState 在同步代码块中运行更多次。延迟为\
    \ 0 的防抖实际上等同于我们在解决方案 2 中使用的 setTimeout：\n\n```\nvar debouncedCheckGameState =\
    \ debounce(checkGameState, 0);\nmonsters.on('change', function() {\n    debouncedCheckGameState();\n\
    });\n```\n\n注意，从我们想要限制调用的每个来源使用相同的节流/防抖函数实例是很重要的。调用\n\n```\n(debounce(checkGameState,\
    \ 0))();\n```\n\n只是一种过于复杂的调用\n\n```\nsetTimeout(checkGameState, 0);\n```\n\n的方式，因为再次调用\
    \ debounce(checkGameState, 0) 只会创建一个单独的 timeout。\n\n## 6.5 问题：处理请求\n\n快速问题：你是一个\
    \ Web 服务器。你收到一个请求。你该怎么办？\n\n很可能，是很多不相关的事情。至少，你要查看请求的路由，并将其映射到你作为响应发送的文件。但你可能还会记录请求、检查请求者是否已正确认证，以及获取一些数据。也许你还会将响应缓存到内存中。这些功能中的许多功能对某些或所有路由来说都是相同的。你如何避免重复？\n\
    \n## 解决方案：中间件模式\n\n在 Node.js Connect 框架中，每个中间件函数接收一个请求对象（req）、一个响应对象（res）和一个 next\
    \ 回调。每次有新的请求进来时，它都会被传递给第一个中间件。该中间件有三个（好的）选项：\n\n- 1. 自行处理请求，发送响应并在不调用 next 的情况下返回。\n"
