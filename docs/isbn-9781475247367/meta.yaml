    \ Node 服务器框架都是基于 Connect 构建的，其中最著名的是 Express.js。\n\n考虑在其他需要对某个动作进行多个离散步骤处理的场景中使用中间件模式。中间件栈与普通回调栈（如我们在第\
    \ 2 章中看到的）之间的唯一区别是，栈上的每个函数都会收到一个 next 函数，使其能够声明已完成，从而实现异步操作序列。以下是一个最小化实现，供比较：\n\
    \n```\n// 回调栈\nfunction trigger() {\n  handlers.forEach(function(handler) {\n\
    \    handler();\n  });\n}\n\n// 中间件栈\nfunction trigger() {\n  invoke(0);\n}\n\
    function invoke(idx) {\n  if (handlers.length <= idx) {\n    return;\n  } else\
    \ {\n    handlers[idx](function(err) {\n      if (err) throw err;\n      if (handlers.length\
    \ > idx + 1) invoke(idx + 1);\n    });\n  }\n}\n```\n\n敏锐的读者可能会想起第 4 章中的 async.series。以这种方式连接函数是一种极其常见的模式。虽然你可以自由地重新发明轮子，但要注意该轮子已经在\
