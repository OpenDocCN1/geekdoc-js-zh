- md: " # Promises and Deferred\n\n```\ndeferredCallback = function(deferred) {\n\
    \  return function(err) {\n    if (err) {\n      deferred.reject(err);\n    }\
    \ else {\n      deferred.resolve(Array.prototype.slice.call(arguments, 1));\n\
    \    };\n  };\n}\n```\n\nWith that, we can write the above example as\n\n```\n\
    var fileReading = new $.Deferred();\nfs.readFile(filename, 'utf8', deferredCallback(fileReading));\n\
    ```\n\nIn Q.js, Deferreds come with a node method for this right out of the box:\n\
    \n```\nvar fileReading = Q.defer();\nfs.readFile(filename, 'utf8', fileReading.node());\n\
    ```\n\nIn my opinion, Promises are one of the most exciting features to be added\
    \ to jQuery in years. Not only are they a big help in smoothing out the callback\
    \ spaghetti that characterizes typical Ajax-rich apps, but they also make it much\
    \ easier to coordinate async tasks of all kinds.\n\nUsing Promises takes some\
    \ practice, especially when using pipe (or CommonJS' then), but it's a habit well\
    \ worth developing. You'll be peering into the future of JavaScript.\n\nJust as\
    \ this book went into production, Microsoft announced that Windows 8's Metro environment\
    \ will have a Promise-based JavaScript API.⁶ Where hipster devs and Microsoft\
    \ both go, the rest of the world is bound to follow.\n\n⁶http://msdn.microsoft.com/en-us/library/windows/apps/hh464930.aspx\n\
    \n## 4 Flow Control with Async.js\n\nSearch the npm registryⁱ for \"flow,\" and\
    \ an overwhelming expanse of flow control libraries will appear. Because JavaScript\
    \ functions can be freely passed around, there are endless possibilities for clearing\
    \ away the clutter of nested async functions. Each of these libraries dictates\
    \ certain conventions that, when followed, enable sparkling clean code.\n\nThe\
    \ most popular of these libraries is Caolan McMahon's Async.js.² In fact, as of\
    \ this writing, Async.js is the #6 most-required library in the npm registry,\
    \ sharing the limelight with superstars like Underscore.js, CoffeeScript, and\
    \ Express. And Async.js isn't just for Node; it works great in the browser, too!\
    \ (Yes, even IE6.)\n\nWe'll use Node.js for most of the examples in this chapter.\
    \ If you already have Node and npm on your system, you can install Async.js with\n\
    \n```\nnpm install -g async\n```\n\nThen put `async = require('async')` at the\
    \ top of any file to bring the module in.\n\n### 4.1 The async ordering problem\n\
    \nSuppose we have a Node app where we want to read all of the files in a directory,\
    \ in alphabetical order, then concatenate their contents into a single string\
    \ and display it. We could do this quite easily using synchronous methods:\n\n\
    ```\nvar fs = require('fs');\nvar concatenation = '';\nfs.readdirSync('recipes')\n\
    \  .filter(function(filename) {\n    return fs.statSync(filename).isFile();\n\
    \  })\n  .forEach(function(filename) {\n    concatenation += fs.readFileSync(filename,\
    \ 'utf8');\n  });\nconsole.log(concatenation);\n```\n\n(By using a forEach iterator\
    \ instead of a for loop, we've avoided the i scoping problem that we saw in Chapter\
    \ 1. Just be aware that forEach isn't available in older browsers without a shim.)\n\
    \nBut all this blocking is terribly inefficient, particularly if our application\
    \ could be doing something else simultaneously. The problem is that we can't just\
    \ naïvely replace\n\n```\nconcatenation += fs.readFileSync(filename, 'utf8');\n\
    ```\n\nwith\n\n```\nfs.readFile(filename, 'utf8', function(err, contents) {\n\
    \  if (err) throw err;\n  concatenation += contents;\n});\n```\n\nbecause there's\
    \ no guarantee that the `readFile` callbacks would fire in the order that the\
    \ `readFile` calls were made in. `readFile` just tells the OS to **start** reading\
    \ a file. Most likely, shorter files will be read more quickly than longer files.\n\
    \n### 4.2 Async collection methods\n\nThe simplest solution to the async ordering\
    \ problem is to start each `readFile` only after the previous one has finished:\n\
    \n```\nvar fs = require('fs');\nvar concatenation = '';\nvar dirContents = fs.readdirSync('recipes');\n\
    function readFileAt(i) {\n  if (i === dirContents.length) return console.log(concatenation);\n\
    \  fs.stat(filename, function(err, stats) {\n    if (err) throw err;\n    if (!stats.isFile())\
    \ return readFileAt(i + 1);\n    fs.readFile(dirContents[i], 'utf8', function(err,\
    \ fileContents) {\n      if (err) throw err;\n      concatenation += fileContents;\n\
