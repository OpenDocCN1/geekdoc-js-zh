  md: "# Solution 2: PubSub-style\n\nAs is so often the case in JavaScript, the best\
    \ solution is an EventEmitter. It allows us to expose an extremely versatile API\
    \ from a simple function. To wit:\n\n```\nvar EventEmitter = require('events').EventEmitter;\n\
    function attempt(asyncTask) {\n  var emitter = new EventEmitter(), results;\n\
    \  emitter.failedAttempts = 0;\n  function retry() {\n    asyncTask(function(err)\
    \ {\n      if (err) {\n        emitter.failedAttempts++;\n        emitter.emit('failure',\
    \ err, retry);\n      } else {\n        results = Array.prototype.slice.call(arguments,\
    \ 1);\n        emitter.emit('success', results);\n      }\n    });\n  }\n  process.nextTick(retry);\
    \  // ensure asynchronicity\n  return emitter;\n}\n```\n\nThis may be a little\
    \ more complicated than our earlier definition, but it makes things extremely\
    \ easy for the caller:\n\n```\nvar reading = attempt(function(callback) {\n  fs.readFile('locked.txt',\
    \ 'utf8', callback);\n});\nreading.on('failure', function(err, retry) {\n  console.error(err);\n\
    \  if (reading.failedAttempts < 3) retry();\n});\nreading.on('success', function(contents)\
    \ {\n  //\n});\n```\n\nNow we have cleanly exposed state and precise control over\
    \ when we retry our function. Plus, because we can attach multiple handlers for\
    \ the same event, it's easy to view the process state from multiple perspectives.\
    \ We could, for example, map the task onto a Promise for easy monitoring:"
  merge: -1
