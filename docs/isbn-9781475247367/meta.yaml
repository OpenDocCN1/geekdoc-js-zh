    \ = new Date();\n    while (new Date() - start < 5000) {}\n    console.log(clickCount);\
    \ // this will always be 1\n\n    setTimeout(function(){\n        link.innerHTML\
    \ = 'You clicked me ' + clickCount + ' times. Ow!';\n    }, 0);\n};\n```\n\nTry\
    \ loading this into your favorite browser and clicking the link as many times\
    \ as you can in 5 seconds. You'll get very different results depending on the\
    \ browser you use.\n\nIn Chrome, even though the browser is essentially frozen\
    \ for those 5 seconds after the first click (due to the while loop), you'll still\
    \ get an accurate count of the number of clicks. The count would be 0 if the setTimeout\
    \ ran before the loop, because the old timeout would be given higher priority\
