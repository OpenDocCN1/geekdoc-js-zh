    \ the menu ready is the only thing that has to wait for the DOM. So our jQuery\
    \ callback, which originally wrapped around *everything*, is just a one-liner:\n\
    \n```\n$(function() { menu.set({ready: true}); });\n```\n\n(Note that it's important\
    \ for this line to come after `menu.clickHandler` is defined, because the callback\
