    \ exactly what Async.js gives us (among other things). In fact, we have two options\
    \ for replacing the Array prototype's `filter` and `forEach` methods:\n\n1. `async.filter`\
    \ and `async.forEach`, which process the given array *in parallel*, or\n2. `async.filterSeries`\
    \ and `async.forEachSeries`, which process the given array *sequentially*\n\n\
    Obviously running our async operations in parallel is faster, so why would we\
    \ want to use a series method? Well, two reasons:\n\nFirst, there's a limit on\
    \ the number of files that Node (or any application process) can try to read simultaneously.\
    \ If we hit that limit, the OS would give us an error that we'd have to handle\
    \ from the `fs.readFile` callback. If we read the files sequentially, we don't\
    \ have to deal with this limitation.\n\nSecond, if we ran the `readFile` callback\
    \ in parallel, we couldn't just write\n\n```\nconcatenation += fileContents;\n\
    ```\n\nbecause there's no guarantee that the `readFile` operations would finish\
    \ in the same order that they started in. We'd have to figure out a way to store\
    \ the results and concatenate them in the right order.\n\nSo, we'll stick to `async.forEachSeries`\
    \ for now. Here's a straightforward adaptation of our synchronous code to use\
    \ Async.js' collection methods:\n\n```\nvar async = require('async');\nvar fs\
    \ = require('fs');\nvar concatenation = '';\nvar dirContents = fs.readdirSync('recipes');\n\
    async.filter(dirContents, isFilename, function(filenames) {\n  async.forEachSeries(filenames,\
    \ readAndConcat, onComplete);\n});\nfunction onComplete(err) {\n  if (err) throw\
    \ err;\n  console.log(concatenation);\n}\n\nfunction isFilename(filename, callback)\
    \ {\n  fs.stat(filename, function(err, stats) {\n    callback(err ? false : stats.isFile());\n\
    \  });\n}\nfunction readAndConcat(filename, callback) {\n  fs.readFile(filename,\
    \ 'utf8', function(err, fileContents) {\n    if (err) return callback(err);\n\
    \    concatenation += fileContents;\n    callback();\n  });\n}\n```\n\nNow our\
    \ code splits up nicely into two parts: the overall task, and the implementation\
    \ details (in the form of the iterator functions).\n\n`filter` and `forEach` aren't\
    \ the only Async.js utilities corresponding to Array prototype methods. There's\
    \ also:\n\n- `reject`/`rejectSeries`, the inverse of `filter`\n- `map`/`mapSeries`,\
    \ for 1:1 transformations\n- `reduce` and `reduceRight`, for transforming a value\
    \ at each step\n- `detect`/`detectSeries`, for finding a value matching a filter\n\
    - `sortBy`, for generating a sorted copy\n- `some` for testing whether at least\
    \ one value matches the given criterion\n- `every` for testing whether *all* values\
    \ match the given criterion\n\nIn our file-reading example, we could adopt a more\
    \ succinct, functional style with `async.reduce`, allowing Async.js to store concatenation\
    \ for us:\n\n```\nvar async = require('async');\nvar fs = require('fs');\nvar\
    \ dirContents = fs.readdirSync('recipes');\nasync.filter(dirContents, isFilename,\
    \ function(filenames) {\n  async.reduce(filenames, '', readReduce, onComplete);\n\
    });\n\nfunction onComplete(err, concatenation) {\n  if (err) throw err;\n  console.log(concatenation);\n\
    }\n\nfunction isFilename(filename, callback) {\n  fs.stat(filename, function(err,\
    \ stats) {\n    callback(err ? false : stats.isFile());\n  });\n}\n\nfunction\
    \ readReduce(concatenation, filename, callback) {\n  fs.readFile(filename, 'utf8',\
    \ function(err, fileContents) {\n    if (err) callback(err);\n    callback(null,\
    \ concatenation + fileContents);\n  });\n}\n```\n\nⁱhttp://search.npmjs.org/\n\
