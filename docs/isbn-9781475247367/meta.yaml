  md: "Now *kimptoc.js* will be fetched asynchronously and, assuming that the script\
    \ loads successfully, it'll start running in another thread. Congratulations:\
    \ We have a Web Worker!\n\nMore specifically, we have a *dedicated* Web Worker,\
    \ which can only talk to the browser process that created it. It's also possible\
    \ to have *shared* Web Workers that can be used to coordinate multiple browser\
    \ tabs; however, these are less widely supported, so we won't cover them in this\
    \ chapter.\n\n# Talking to Web Workers\n\nIn addition to 'error' events (which\
    \ are emitted when the Worker script fails to load, or when the script throws\
    \ an exception), Workers can emit a 'message' event containing an arbitrary string\
    \ or JSON-serializable object sent from the Worker's self.postMessage function:\n\
    \n```\nvar worker = new Worker('worker.js');\nworker.addEventListener('message',\
    \ function(e) {\n  console.log(e.data);  // echo whatever was sent by postMessage\n\
    });\n```\n\n(Usually, we only want the data property from the message event. If\
    \ we were binding the same event handler to multiple Workers, we could use e.target\
    \ to determine which Worker emitted the event.)\n\nSo, now we know how to listen\
    \ to Workers. Conveniently, the interface for talking to Workers is symmetrical:\
    \ We use worker.postMessage to send it, and the Worker uses self.addEventListener('message',\
    \ ...) to receive it. Here's a complete example:\n\n```\n// master script\nvar\
    \ worker = new Worker('boknows.js');\nworker.addEventListener('message', function(e)\
    \ {\n  console.log(e.data);\n});\nworker.postMessage('football');\nworker.postMessage('baseball');\n\
    \n// boknows.js\nself.addEventListener('message', function(e) {\n  self.postMessage('Bo\
    \ knows ' + e.data);\n});\n```\n\nYou can play with the message-passing interface\
    \ at a little site I created, the Web Worker Sandbox.¹ Any time you create a new\
    \ example, it gets a unique URL that you can share.\n\n¹http://webworkersandbox.com/"
