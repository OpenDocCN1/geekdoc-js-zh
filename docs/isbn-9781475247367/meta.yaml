  - "[PAGE 39]\n\n# # 3.4 Progress notifications\n\nA Promise is a bundle of things\
    \ you want to happen when a process comes to an end. But didn't a motivational\
    \ poster once tell you that the journey is as important as the destination? Did\
    \ you learn *nothing* from that poster?\n\nFortunately, the jQuery team soaked\
    \ up that wisdom (and the Promises/A spec) and, in jQuery 1.7, added a new kind\
    \ of Promise callback which can be invoked any number of times. It's called *progress*.\
    \ For example, suppose we want to update an indicator of how far a person has\
    \ gotten toward their daily word goal for National Novel Writing Month (NaNoWriMo):\n\
    \n```\nvar nanowrimoing = $.Deferred();\nvar wordGoal = 5000;\nnanowrimoing.progress(function(wordCount)\
    \ {\n    var percentComplete = Math.floor(wordCount / wordGoal * 100);\n    $('#indicator').text(percentComplete\
    \ + '% complete');\n});\nnanowrimoing.done(function(){\n    $('#indicator').text('Good\
    \ job!');\n});\n```\n\n(It's not a standard convention, but I like to use the\
    \ present continuous tense, *-ing*, for the variable names of Promises and other\
    \ objects that represent concurrent tasks.)\n\nWith the `nanowrimoing` deferred\
    \ available, here's how we respond to potential changes in word count:\n\n```\n\
    $('#document').on('keypress', function(){\n    var wordCount = $(this).val().split(/\\\
    s+/).length;\n    if (wordCount >= wordGoal) {\n        nanowrimoing.resolve();\n\
    \    } else {\n        nanowrimoing.notify(wordCount);\n    }\n});\n```\n\n(Actually,\
    \ we could omit the `else` and run `nanowrimoing.notify` every time, because `notify`\
    \ calls are ignored after the Promise has been triggered, just as additional `resolve`\
    \ and `reject` calls are ignored.)\n\nThe `notify` call on the Deferred invokes\
    \ our *progress* callback. Just like `resolve` and `reject`, `notify` can take\
    \ arbitrary arguments. (Also like `resolve` and `reject`, there's a `notifyWith`\
    \ variant that takes a context as the first argument.)"
  - '[PAGE 40]


    So to recap: A Promise takes three kinds of callbacks: `done`, `fail`, and `progress`.
    `done` callbacks run when the Promise resolves, `fail` callbacks run when it''s
    rejected, and `progress` callbacks run whenever `notify` is called on a pending
    Deferred.


    # Binding multiple callbacks with `then`


    If you want to bind more than one kind of callback at once, there''s a handy shortcut
    method: `then`. Calling


    ```

    `promise.then(doneCallback, failCallback, progressCallback);`

    ```


    is equivalent to


    ```

    `promise`

    `.done(doneCallback);`

    `.fail(failCallback);`

    `.progress(progressCallback);`

    ```


    `then`, `done`, `fail`, and `progress` all simply return the object they''re attached
    to, as jQuery methods tend to.


    (As we''ll see later, the meaning of `then` is one of the key differences between
    jQuery Promises and the Promises/A spec.)


    # 3.5 Animation Promises


    So far, we''ve seen how jQuery''s Ajax methods return Promises, and we''ve seen
    how you can make your own with `$.Deferred`. But jQuery 1.6+ provide one more
    source of Promises: ordinary jQuery objects. When you call


    ```

    `$(''#elem'').promise()`

    ```


    you get a Promise representing `$(''#elem'')`''s animation queue. When all animations
    on `$(''#elem'')` have completed, the Promise is resolved. The Promise will be
    resolved whether the animations completed naturally, or if `stop()` was called,
    or if there were no pending animations in the first place. In short, animation
    Promises never fail.


    Animation Promises make it easy to find out when animations on several different
    elements have finished:'
