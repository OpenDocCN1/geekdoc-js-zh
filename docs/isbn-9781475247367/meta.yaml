  - "[PAGE 75]\n\n# Solution 3: Work around this\n\nThis solution only applies to\
    \ jQuery, as most libraries are content to allow `this` in callbacks to take its\
    \ default value, the root object (window in browsers, global in Node). jQuery\
    \ is not, and some prominent JavaScript developers (including Jeremy Ashkenas,\
    \ creator of CoffeeScript and Backbone.js) have called that a mistake. Although\
    \ most jQuery coders use `this` to get the DOM element that an event was fired\
    \ from, you can use the less ambiguous `e.currentTarget` instead (where `e` is\
    \ the event object that jQuery passes as the first argument to the handler):\n\
    \n```\n$('button').click(function(e) {\n  $(e.currentTarget).after('<a href=\"\
    #\" id=\"confirm\">Confirm</a>');\n  $('#confirm').click(function() {\n    var\
    \ action = $(e.currentTarget).data('action');\n    // works!\n  });\n});\n```\n\
    \nOf course, `e` is just as prone to overuse as `this`, so consider using a distinguishing\
    \ identifier like `buttonEvent` instead.\n\n# 6.2 Problem: Retrying async tasks\n\
    \nOften, we'll want to attempt an async task *n* times before declaring failure,\
    \ particularly when the task involves connecting to a remote server. The basics\
    \ of this problem are obvious:\n\n+   1. We need to store the number of failed\
    \ attempts\n2. When an attempt fails, we need to increment the number of failed\
    \ attempts and check whether it exceeds the maximum\n\nThis translates into a\
    \ lot of boilerplate code that we don't want to repeat every time we run into\
    \ this scenario, e.g.\n\n```\nvar callback, failedAttempts = 0, maxAttempts =\
    \ 3;\nasyncTask(callback = function(err) {\n  if (err) {\n    failedAttempts++;\n\
    \    if (failedAttempts >= maxAttempts) {\n      failCallback(err);\n    } else\
    \ {\n      asyncTask(callback);\n    }\n```"
