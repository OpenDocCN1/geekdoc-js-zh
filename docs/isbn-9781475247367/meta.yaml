  - "[PAGE 24]\n\n# 2 Distributed Events\n\nIn the last chapter, we looked at how\
    \ async events work in JavaScript. But in practice, how should we handle those\
    \ events?\n\nThat may sound like a silly question. Just attach a handler to each\
    \ event your app cares about; right? But when a single event has several consequences,\
    \ the \"one event, one handler\" approach forces handlers to grow to *gargantuan*\
    \ proportions.\n\nTake, for example, a web-based word processor like Google Docs.\
    \ When a user presses a key, a number of things need to happen: the new character\
    \ has to be added to the DOM and the caret moved; the action has to be pushed\
    \ to the Undo history and synced to the server; the new word has to be spell-checked;\
    \ the word count and page count may need to be updated. Carrying out all of these\
    \ tasks and more from a single event handler is a daunting proposition.\n\nFrom\
    \ a mechanical perspective, every task that we want performed in response to the\
    \ event does indeed have to be initiated from the event handler. But for the sake\
    \ of us humans, it's usually better to replace the one-size-fits-all event handler\
    \ with a more malleable, dynamic construct—one that we can add tasks to, and remove\
    \ tasks from, at any time. In short, we want to use *distributed events*, where\
    \ a single incident can trigger reactions throughout our application.\n\nIn this\
    \ chapter, we'll learn about the PubSub pattern and evented models, which are\
    \ increasingly ubiquitous features of JavaScript applications. We'll also take\
    \ a look at custom events in jQuery and meet a new library called LucidJS that's\
    \ ideal for wiring PubSub objects together.\n\n# 2.1 PubSub\n\nSince the dawn\
    \ of JavaScript, browsers have allowed event handlers to be attached to DOM elements\
    \ like so:\n\n```\nlink.onclick = clickHandler;\n```\n\nAh, simplicity itself!\
    \ There's just one caveat: If you wanted *two* click handlers for an element,\
    \ you'd have to aggregate them yourself with a wrapper function:\n\n```\nlink.onclick\
    \ = function() {\n  clickHandler1.apply(this, arguments);\n  clickHandler2.apply(this,\
    \ arguments);\n};\n```\n\nNot only is this tedious, it's also a recipe for bloated,\
    \ all-purpose handler functions.\nThat's why the W3C added addEventListener to\
    \ the DOM spec in 2000, and jQuery abstracted it with the bind method. bind makes\
    \ it easy to add as many handlers as you like to any event on any element (or\
    \ set of elements), without worrying about stepping on anyone else's toes:"
  - "[PAGE 25]\n\n$(link)\n    .bind('click', clickHandler1)\n    .bind('click', clickHandler2);\n\
    \n(In jQuery 1.7+, the new on syntax<sup>1</sup> is preferred over bind. There's\
    \ also the click(...) method, which is a shorthand for bind('click', ...); however,\
    \ I prefer to consistently use the more powerful bind/on.)\n\nFrom a software\
    \ architecture perspective, jQuery is publishing the link element's events to\
    \ anyone who wants to subscribe. Hence the term \"PubSub.\"\n\nWith the lesson\
    \ of the DOM in mind, the architects of Node's API eschewed the `object.onevent\
    \ = ...` technique in favor of a generic PubSub interface called EventEmitter.\
    \ Just about every source of I/O in Node is an EventEmitter: file streams, HTTP\
    \ servers, even the application process itself. To wit:\n\n```\n['julz', 'norah',\
    \ 'fiona'].forEach(function(name) {\n    process.on('exit', function() {\n   \
    \     console.log('Goodbye, ' + name);\n    });\n});\n```\n\nCountless pure PubSub\
    \ implementations exist for the browser. In addition, many MVC libraries like\
    \ Backbone.js and Spine provide their own EventEmitter-like modules. We'll talk\
    \ about those later in the chapter.\n\n# EventEmitter\n\nLet's use Node's EventEmitter\
    \ as an example of a PubSub interface. It has a simple, nearly minimal design.\n\
    To add an event handler to an EventEmitter, just call on with the event type and\
    \ the handler:\n\n```\nemitter.on('evacuate', function(message) {\n    console.log(message);\n\
    });\n```\n\nThe aptly-named emit method emits an event of the given type. For\
    \ instance,\nemitter.emit('evacuate');"
  - "[PAGE 26]\n\nDistributed Events\n\n15\n\nwould call all 'evacuate' handlers.\n\
    (Note that the term \"event\" here has nothing to do with the event queue. See\
    \ the \"Synchronicity\" section, below.)\nYou can add any number of additional\
    \ arguments when you emit an event. All arguments are passed to all handlers:\n\
    \n```\nemitter.emit('evacuate', 'Woman and children first!');\n```\n\nThere are\
    \ no restrictions on event names, though the Node docs offer a useful convention:\n\
    Typically, event names are represented by a camel-cased string.\nAll of EventEmitter's\
    \ methods are public, but it's common convention for events to only be emitted\
    \ from \"inside\" of the EventEmitter. Conversely, common convention forbids an\
    \ EventEmitter from attaching handlers to itself.\n\n# Roll your own PubSub\n\n\
    PubSub implementations are so simple that we can create one in about a dozen lines\
    \ of code. The only state we need to store is a list of handlers for each event\
    \ type we support:\n\n```\nPubSub = {handlers: {}}\n```\n\nWhen we add a listener,\
    \ we push it to the end of the array (which means that listeners will always be\
    \ called in the order in which they were added):\n\n```\nPubSub.on = function(eventType,\
    \ handler) {\n    if (!(eventType in this.handlers)) {\n        this.handlers[eventType]\
    \ = [];\n    }\n    this.handlers[eventType].push(handler);\n    return this;\n\
    }\n```\n\nThen when an event is emitted, we loop through all of our handlers:\n\
    \n```\nPubSub.emit = function(eventType) {\n    var handlerArgs = Array.prototype.slice.call(arguments,\
    \ 1);\n    for (var i = 0; i < this.handlers[eventType].length; i++) {\n     \
    \   this.handlers[eventType][i].apply(this, handlerArgs);\n    }\n    return this;\n\
    }\n```"
  - "[PAGE 27]\n\nThat's it: We've just implemented the core of Node's `EventEmitter`.\
    \ (The only major things we're missing are the ability to remove handlers and\
    \ the ability to attach one-time handlers.)\n\nOf course, PubSub implementations\
    \ vary slightly feature-wise. When the jQuery team noticed that several different\
    \ PubSub implementations were being used throughout the library, they decided\
    \ to abstract them with `$.Callbacks` in jQuery 1.7.<sup>2</sup> Instead of using\
    \ an array to store the handlers corresponding to an event type, you could use\
    \ a `$.Callbacks` instance, which takes a few options:\n\n+   - **once**: The\
    \ callback list will only fire once. This is used for Promises, which we'll learn\
    \ about in a later chapter.\n- **memory**: If the callback list has already been\
    \ fired when a new callback is added, the new callback is immediately called.\
    \ Again, this is mainly for Promises.\n- **stopOnFalse**: If a callback returns\
    \ false, no further callbacks will be invoked for that event. If you're familiar\
    \ with jQuery events, this should sound familiar.\n- **unique**: If a particular\
    \ callback has already been attached, attempts to attach it again are ignored.\n\
    \nOddly, `$.Callbacks` takes its options as a single space-delimited string:\n\
    \n```\n$.Callbacks('unique memory');\n```\n\nMore commonly, many PubSub implementations\
    \ parse the event string to provide special features. For example, you may be\
    \ familiar with namespaced events in jQuery, where I can bind a \"click.uniqueName\"\
    \ event for easy unbinding later. Backbone.js (which we'll learn more about soon)\
    \ lets you bind handlers to the \"all\" event type, causing them to go off whenever\
    \ anything happens. Both jQuery and Backbone let you bind or emit multiple event\
    \ types simultaneously by separating them with spaces, e.g. \"keypress mousemove\"\
    .\n\n# Synchronicity\n\nAlthough PubSub is an important technique for dealing\
    \ with async events, there's nothing inherently async about it. Consider this\
    \ code:\n\n```\n$('input[type=submit]')\n  .on('click', function() { console.log('foo');\
    \ })\n  .trigger('click');\nconsole.log('bar');\n```"
  - "[PAGE 28]\n\n# Distributed Events\n\nThe output is\n\n```\nfoo\nbar\n```\n\n\
    proving that the `click` handler was invoked immediately by `trigger`. In fact,\
    \ whenever an event fires, all of its handlers will be executed sequentially without\
    \ interruption.\n\nSo let's be clear: When the user clicks the \"Submit\" button,\
    \ that's an *async event*: the first click handler fires from the event queue.\
    \ But taken as a whole, everything that happens as a result of that click is *synchronous*,\
    \ unless one of the click handlers uses something like `setTimeout`. This is important\
    \ because if too many handlers fire in sequence, you risk blocking the thread\
    \ and making the browser unresponsive.\n\nThink back to the word processor example\
    \ at the start of this chapter. When a user presses a key, many things need to\
    \ happen, and several of them may take very complex calculations. Doing them all\
    \ before returning to the event queue would be a recipe for an unresponsive app.\n\
    \nA good solution to this problem is to maintain your own queue of things that\
    \ don't need to happen right away, and use a timed function to process the queue\
    \ periodically.\n\n# ## 2.2 Evented models\n\nA special case of PubSub is when\
    \ an object used to store data (a \"model\") issues events whenever its contents\
    \ are modified. Let's look at the popular Backbone.js[^3] framework, which has\
    \ been used at companies ranging from 37signals to Pandora to *The New York Times*.\
    \ You can create a new model like so:\n\n```\nstyle = new Backbone.Model(\n  {font:\
    \ 'Georgia'}\n);\n```\n\n`model` just represents the simple object that was passed\
    \ in:\n\n```\nstyle.toJSON()  // {font: 'Georgia'}\n```\n\nBut unlike an ordinary\
    \ object, this one can publish notifications when a change is made:\n\n```\nstyle.on('change:font',\
    \ function(model, font) {\n  alert('Thank you for choosing ' + font + '!');\n\
    });\n```\n\n> [^3]: http://documentcloud.github.com/backbone/"
- md: "## 2.3 Custom jQuery events\n\nThe caveat is that we have to make those changes\
    \ with the model's set method, and retrieve values with get:\n\n```javascript\n\
    style.set({font: 'Palatino'});  // triggers alert\nstyle.get('font');\n```\n\n\
    Evented models have become a huge sensation in the last couple of years, with\
    \ the rise of MVC frameworks like Backbone. Old-school JavaScript made changes\
    \ to the DOM directly from input event handlers. New-school JavaScript makes changes\
    \ to models, which then emit events that cause the DOM to update. In all but the\
    \ smallest apps, this separation of concerns makes functionality much easier to\
    \ keep track of.\n\nPlus, Backbone models make syncing with the server via Ajax\
    \ a breeze:\n\n```javascript\nhello.save();      // sends the model to the server\n\
    goodbye.fetch();   // updates the model from the server\n```\n\nBackbone was developed\
    \ by the fine folks at DocumentCloud as they were building a web-based document\
    \ search tool of the same name.⁵ When a user enters a query in DocumentCloud,\
    \ the server runs a full-text search of thousands of scanned documents, and within\
    \ seconds they get titles, thumbnails, metadata and excerpts from the first page\
    \ of results. The user can switch between a grid view and a list view, or even\
    \ a timeline visualization. They can also add notes and see notes that other users\
    \ have added. It's a very impressive JavaScript app, and it's hard to imagine\
    \ it existing without Backbone's capabilities.\n\n## Propagating model events\n\
    \nTypically, Backbone models are organized into *collections*, which are essentially\
    \ evented arrays: You can listen for when models are added and removed to them.\
    \ Additionally, Backbone collections propagate events from the models they contain.\
    \ For example, you might have a spriteCollection object containing hundreds of\
    \ models representing things that you're drawing on a canvas element. Each time\
    \ any of those sprites changes, you need to redraw the canvas. Rather than attaching\
    \ the redraw function as a handler for the change event on each sprite individually,\
    \ you could instead just write\n\n```javascript\nspriteCollection.on('change',\
    \ redraw);\n```\n\nNote that this automatic propagation only goes one level down.\
    \ Backbone has no notion of a \"collection of collections.\" However, it's easy\
    \ to propagate events manually. Let's say that we wanted to break up spriteCollection\
    \ into several pieces, one for each of dozens of kinds of sprites. We could add\
    \ each of those collections to a model, spriteCollectionSet, created like so:\n\
    \n```javascript\nvar spriteCollectionSet = new Backbone.Model();\nspriteCollectionSet.on('change',\
    \ function(model, name, collection) {\n    collection.on('change', spriteCollectionSet.change());\n\
    });\n```\n\nwhere the `change` method simply forces Backbone to emit the `change`\
    \ event from the set.\n\n## Cycles and silence\n\nSuppose we want to ensure that\
    \ x always equals 2 * y:\n\n```javascript\nvar x = new Backbone.Model({value:\
    \ 0});\nvar y = new Backbone.Model({value: 0});\nx.on('change:value', function(x,\
    \ xVal) { y.set({value: xVal / 2}); });\ny.on('change:value', function(y, yVal)\
    \ { x.set({value: 2 * yVal}); });\n```\n\nYou might expect this code to lead to\
    \ an infinite loop the moment the value of x or y is changed. But actually, it’s\
    \ quite safe, for two reasons: First, `set` doesn’t emit a `change` event if the\
    \ new value matches the old one. Second, and more importantly, the designers of\
    \ Backbone decided that no model should be able to emit a `change` event during\
    \ one of its own `change` events. The changes are still performed, but they’re\
    \ done *silently*.\n\nThis is, itself, a problem. If nested changes are made to\
    \ a model, observers will see only the outermost one, and may go out of sync.\
    \ It’s the price you pay for avoiding the possibility of infinite cycles.\n\n\
    Clearly, maintaining two-way connections between data points in Backbone is a\
    \ challenge. Another major MVC framework, Ember.js, allows two-way bindings to\
    \ be declared explicitly. The caveat? When one value changes, the other is updated\
    \ asynchronously from a timeout event. So until that event fires, the application’s\
    \ data will be in an inconsistent state.\n\nThere’s no easy solution to the problem\
    \ of entangled models, but a major weapon in the arsenal against them is Backbone’s\
    \ `silent` flag. If you add `{silent: true}` to a set event, no `change` event\
    \ will happen. So if several models need to be updated at once, a good approach\
    \ is to set them silently, then call their `change` methods only after they’re\
    \ in a consistent state.\n\n## Distributed Events\n\nCustom events are an underappreciated\
    \ feature of jQuery that make it easy to graft a powerful distributed event system\
    \ onto any web app, with no additional libraries. You can emit any event you want\
    \ from any DOM element from jQuery using `trigger`:\n\n```javascript\n$('#ozzy,\
    \ #sten').on('meow', function() {\n  console.log(this.id + ' meowed');\n});\n\
    $('#ozzy').trigger('meow');  // \"ozzy meowed\"\n$('#sten').trigger('meow'); \
    \ // \"sten meowed\"\n```\n\nIf you've worked with DOM events before, you're no\
    \ doubt familiar with *bubbling*: Whenever a element emits an event (such as a\
    \ `'click'`), its parent then emits the event, then its grandparent, and so on\
    \ up to the root element, `document`—unless the event's `stopPropagation` method\
    \ is called at some point along the way. (jQuery does for us automatically when\
    \ we return `false` from a handler). But did you know that jQuery's custom events\
    \ bubble as well? For instance, if we have a span named \"soda\" nested in a div\
    \ named \"bottle,\" the code\n\n```javascript\n$('#soda, #bottle').on('fizz',\
    \ function() {\n  console.log(this.id + ' emitted fizz');\n});\n$('#soda').trigger('fizz');\n\
    ```\n\nwill emit the output\n\n```\nsoda emitted fizz\nbottle emitted fizz\n```\n\
    \nThis bubbling isn't always desirable, as we'll see in the tooltips example below.\
    \ Fortunately, jQuery offers a non-bubbling `triggerHandler` method as well.\n\
    \n## Example: Tooltips\n\nWhen events can be mapped intuitively to page elements,\
    \ jQuery is an ideal way of distributing them. For instance, suppose you're writing\
    \ a tooltip library, and you want only one tooltip to be visible at a time. So\
    \ you might simply add the line\n\n```javascript\n$('.tooltip').remove()\n```\n\
    \n```javascript\n// $container could be $('#sidebar') or $(document)\n$container.triggerHandler('newTooltip');\n\
    $container.one('newTooltip', $tooltip.remove);\n```\n\n(Notice the use of jQuery’s\
    \ `one` instead of `on`. The difference is that `one` automatically removes the\
    \ handler after it fires.)\n\nWith these two lines of code, each tooltip will\
    \ listen to its container and remove itself when the container gets a new tooltip.\
    \ It’s a beautifully direct, efficient approach that saves us from having to store\
    \ any state or engineer complex selectors (which would slow older browsers to\
    \ a crawl—IE7 and below don’t even have a way of selecting all elements with the\
    \ `tooltip` class without traversing the whole document!).\n\nNote that event\
    \ bubbling would actually have defeated our intent in this case: When we create\
    \ a new tooltip in the sidebar, we only want tooltips listening for the `newTooltip`\
    \ event on the sidebar itself to go away, not those on the surrounding document.\
    \ Always think carefully about whether `trigger` or `triggerHandler` is the right\
    \ tool for the job.\n\n## 2.4 Piping events with LucidJS\n\nAs we’ve seen, there\
    \ are an abundance of options for PubSub. That’s actually a problem, as most apps\
    \ will involve multiple sources of events with subtly different APIs. Wouldn’t\
    \ it be nice if we could unify these emitters and route events cohesively?\n\n\
    Enter LucidJS, a new event library (in fact, it arrived on GitHub just weeks before\
    \ the first publication of this book) that can listen to events from DOM elements\
    \ and jQuery objects. That way, you can “pipe” those events through Lucid’s own\
    \ `EventEmitter`-like objects:\n\n```javascript\n// Sailor Moon fan service\n\
    var riniEmitter = LucidJS.emitter();\nriniEmitter.pipe($('#serenity'));\nriniEmitter.pipe(blackLadyEmitter);\n\
    riniEmitter.on('fight', function() {\n    console.log('Pink sugar heart attack!');\n\
    });\n```\n\nNow whenever the `$('#serenity')` jQuery object or `blackLadyEmitter`\
    \ emits a `fight` event, `riniEmitter` will forward that event to the given handler.\n\
    \nAs PubSub interfaces gain popularity in JavaScript, the `pipe` technique is\
    \ bound to become more common, as it allows events from multiple sources to be\
    \ monitored in one place.\n\n⁵ http://www.documentcloud.org/public/search/"
  mdcn: "\n## 2.3 自定义 jQuery 事件\n\n需要注意的是，我们必须使用模型的 `set` 方法进行这些更改，并用 `get` 方法来检索值：\n\
    \n```javascript\nstyle.set({font: 'Palatino'});  // 触发警报\nstyle.get('font');\n\
    ```\n\n事件驱动模型在过去几年中已变得非常流行，随着像 Backbone 这样的 MVC 框架的兴起。传统的 JavaScript 直接从输入事件处理程序修改\
    \ DOM。而现代的 JavaScript 则修改模型，模型随后会发出事件，从而导致 DOM 更新。除了最小的应用之外，这种关注点分离使得功能更容易跟踪。\n\
    \n此外，Backbone 模型使得通过 Ajax 与服务器同步变得轻而易举：\n\n```javascript\nhello.save();      //\
    \ 将模型发送到服务器\ngoodbye.fetch();   // 从服务器更新模型\n```\n\nBackbone 是由 DocumentCloud\
    \ 的优秀团队在开发同名的基于 Web 的文档搜索工具时创建的。⁵ 当用户在 DocumentCloud 中输入查询时，服务器会对数千份扫描文档进行全文搜索，几秒钟内，用户就能获得结果的标题、缩略图、元数据以及第一页的摘要。用户可以在网格视图和列表视图之间切换，甚至可以使用时间线可视化。他们还可以添加注释，并查看其他用户添加的注释。这是一个非常令人印象深刻的\
    \ JavaScript 应用程序，很难想象没有 Backbone 的功能它会是什么样子。\n\n## 传播模型事件\n\n通常，Backbone 模型被组织成\
    \ *集合*，这本质上是事件驱动的数组：你可以监听何时向其中添加或移除模型。此外，Backbone 集合会传播其包含的模型的事件。例如，你可能有一个 `spriteCollection`\
    \ 对象，其中包含数百个代表你在画布元素上绘制内容的模型。每当其中任何一个精灵发生变化时，你都需要重绘画布。与其将重绘函数单独作为每个精灵 `change`\
    \ 事件的处理程序，你只需编写\n\n```javascript\nspriteCollection.on('change', redraw);\n```\n\
    \n请注意，这种自动传播只向下一级。Backbone 没有“集合的集合”的概念。然而，手动传播事件很容易。假设我们想将 `spriteCollection`\
    \ 分成几个部分，每部分对应几十种精灵中的一种。我们可以将每个这些集合添加到一个名为 `spriteCollectionSet` 的模型中，如下创建：\n\n\
    ```javascript\nvar spriteCollectionSet = new Backbone.Model();\nspriteCollectionSet.on('change',\
    \ function(model, name, collection) {\n    collection.on('change', spriteCollectionSet.change());\n\
    });\n```\n\n其中 `change` 方法只是强制 Backbone 从集合中发出 `change` 事件。\n\n## 循环与静默\n\n假设我们想确保\
    \ `x` 始终等于 `2 * y`：\n\n```javascript\nvar x = new Backbone.Model({value: 0});\n\
    var y = new Backbone.Model({value: 0});\nx.on('change:value', function(x, xVal)\
    \ { y.set({value: xVal / 2}); });\ny.on('change:value', function(y, yVal) { x.set({value:\
    \ 2 * yVal}); });\n```\n\n你可能期望这段代码在 `x` 或 `y` 的值被更改时导致无限循环。但实际上，这是相当安全的，原因有二：首先，如果新值与旧值匹配，`set`\
    \ 不会发出 `change` 事件。其次，也是更重要的，Backbone 的设计者决定，任何模型都不应在自身的 `change` 事件期间发出 `change`\
    \ 事件。更改仍然会执行，但它们是 *静默地* 完成的。\n\n这本身就是一个问题。如果对模型进行了嵌套更改，观察者将只看到最外层的更改，并且可能会不同步。这是为避免无限循环的可能性而付出的代价。\n\
    \n显然，在 Backbone 中维护数据点之间的双向连接是一个挑战。另一个主要的 MVC 框架 Ember.js 允许显式声明双向绑定。那么问题是什么？当一个值改变时，另一个值会从超时事件异步更新。因此，在该事件触发之前，应用程序的数据将处于不一致状态。\n\
    \n对于纠缠模型的问题没有简单的解决方案，但对抗它们的一个主要武器是 Backbone 的 `silent` 标志。如果你在 `set` 事件中添加 `{silent:\
    \ true}`，就不会发生 `change` 事件。因此，如果多个模型需要同时更新，一个好方法是静默地设置它们，然后仅在它们处于一致状态后才调用它们的 `change`\
    \ 方法。\n\n## 分布式事件\n\n自定义事件是 jQuery 中一个被低估的特性，它使得将强大的分布式事件系统嫁接到任何 Web 应用程序变得非常容易，无需额外的库。你可以使用\
    \ `trigger` 从任何 DOM 元素发出任何你想要的事件：\n\n```javascript\n$('#ozzy, #sten').on('meow',\
    \ function() {\n  console.log(this.id + ' meowed');\n});\n$('#ozzy').trigger('meow');\
    \  // \"ozzy meowed\"\n$('#sten').trigger('meow');  // \"sten meowed\"\n```\n\n\
    如果你之前处理过 DOM 事件，你肯定熟悉 *冒泡*：每当一个元素发出一个事件（比如 `'click'`），它的父元素也会发出该事件，然后是它的祖父元素，如此向上直到根元素\
    \ `document`——除非在某个时刻调用了事件的 `stopPropagation` 方法。（当我们从处理程序返回 `false` 时，jQuery\
    \ 会自动为我们做这件事）。但你知道 jQuery 的自定义事件也会冒泡吗？例如，如果我们有一个名为 \"soda\" 的 span 嵌套在一个名为 \"\
    bottle\" 的 div 中，代码\n\n```javascript\n$('#soda, #bottle').on('fizz', function()\
    \ {\n  console.log(this.id + ' emitted fizz');\n});\n$('#soda').trigger('fizz');\n\
    ```\n\n将输出\n\n```\nsoda emitted fizz\nbottle emitted fizz\n```\n\n这种冒泡并不总是可取的，正如我们将在下面的工具提示示例中看到的那样。幸运的是，jQuery\
    \ 也提供了非冒泡的 `triggerHandler` 方法。\n\n## 示例：工具提示\n\n当事件可以直观地映射到页面元素时，jQuery 是分发它们的理想方式。例如，假设你正在编写一个工具提示库，并且希望一次只显示一个工具提示。所以你可以简单地添加这行\n\
    \n```javascript\n$('.tooltip').remove()\n```\n\n```javascript\n// $container 可以是\
    \ $('#sidebar') 或 $(document)\n$container.triggerHandler('newTooltip');\n$container.one('newTooltip',\
    \ $tooltip.remove);\n```\n\n（注意使用了 jQuery 的 `one` 而不是 `on`。区别在于 `one` 在处理程序触发后会自动移除它。）\n\
    \n通过这两行代码，每个工具提示都会监听其容器，并在容器获得新工具提示时移除自身。这是一种非常直接、高效的方法，使我们无需存储任何状态或设计复杂的选择器（这会拖慢旧版浏览器的速度——IE7\
    \ 及以下版本甚至没有方法在不遍历整个文档的情况下选择所有具有 `tooltip` 类的元素！）。\n\n请注意，事件冒泡实际上会破坏我们在此处的意图：当我们在侧边栏中创建一个新的工具提示时，我们只希望监听侧边栏本身\
    \ `newTooltip` 事件的工具提示消失，而不是监听周围文档的工具提示。始终仔细考虑 `trigger` 还是 `triggerHandler` 才是完成此工作的合适工具。\n\
    \n## 2.4 使用 LucidJS 管道事件\n\n正如我们所看到的，PubSub 有大量的选择。这实际上是一个问题，因为大多数应用程序都会涉及具有细微不同\
    \ API 的多个事件源。如果我们能够统一这些发射器并连贯地路由事件，岂不是很好？\n\nLucidJS 就是这样一个新的事件库（实际上，它在本书首次出版前几周才出现在\
    \ GitHub 上），它可以监听来自 DOM 元素和 jQuery 对象的事件。这样，你就可以通过 Lucid 自己的类似 `EventEmitter`\
    \ 的对象“管道”这些事件：\n\n```javascript\n// Sailor Moon 粉丝服务\nvar riniEmitter = LucidJS.emitter();\n\
    riniEmitter.pipe($('#serenity'));\nriniEmitter.pipe(blackLadyEmitter);\nriniEmitter.on('fight',\
    \ function() {\n    console.log('Pink sugar heart attack!');\n});\n```\n\n现在，每当\
    \ `$('#serenity')` jQuery 对象或 `blackLadyEmitter` 发出 `fight` 事件时，`riniEmitter`\
    \ 都会将该事件转发给给定的处理程序。\n\n随着 PubSub 接口在 JavaScript 中日益普及，`pipe` 技术必将变得更加普遍，因为它允许在一个地方监控来自多个来源的事件。\n\
    \n⁵ http://www.documentcloud.org/public/search/\n"
