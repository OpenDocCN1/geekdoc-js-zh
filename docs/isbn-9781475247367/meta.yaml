  mdcn: "\n# Promise 与 Deferred\n\n```\ndeferredCallback = function(deferred) {\n\
    \  return function(err) {\n    if (err) {\n      deferred.reject(err);\n    }\
    \ else {\n      deferred.resolve(Array.prototype.slice.call(arguments, 1));\n\
    \    };\n  };\n}\n```\n\n有了这个，我们可以将上面的示例改写为：\n\n```\nvar fileReading = new $.Deferred();\n\
    fs.readFile(filename, 'utf8', deferredCallback(fileReading));\n```\n\n在 Q.js 中，Deferred\
    \ 开箱即带有用于此目的的 `node` 方法：\n\n```\nvar fileReading = Q.defer();\nfs.readFile(filename,\
    \ 'utf8', fileReading.node());\n```\n\n在我看来，Promise 是多年来添加到 jQuery 中最令人兴奋的功能之一。它们不仅极大地帮助理顺了典型富\
    \ Ajax 应用中特征性的回调“意大利面条”，而且使得协调各种异步任务变得容易得多。\n\n使用 Promise 需要一些练习，特别是使用 `pipe`（或\
    \ CommonJS 的 `then`）时，但这是非常值得养成的习惯。你将窥见 JavaScript 的未来。\n\n就在这本书付印之际，微软宣布 Windows\
    \ 8 的 Metro 环境将拥有基于 Promise 的 JavaScript API。⁶ 既然时髦的开发者和微软都去了，世界其他地方必然也会跟进。\n\n\
    ⁶http://msdn.microsoft.com/en-us/library/windows/apps/hh464930.aspx\n\n## 4 使用\
    \ Async.js 进行流控制\n\n在 npm 注册表ⁱ中搜索 \"flow\"，会涌现出大量令人目不暇接的流控制库。因为 JavaScript 函数可以自由传递，所以有无数种可能性来清除嵌套异步函数造成的混乱。这些库中的每一个都规定了特定的约定，只要遵循这些约定，就能编写出极其清晰的代码。\n\
    \n这些库中最流行的是 Caolan McMahon 的 Async.js。² 事实上，在撰写本文时，Async.js 是 npm 注册表中第六个最被需要的库，与\
    \ Underscore.js、CoffeeScript 和 Express 等明星库共享光芒。Async.js 不仅仅是为 Node 而生；它在浏览器中也运行得很好！（是的，甚至包括\
    \ IE6。）\n\n在本章的大部分示例中，我们将使用 Node.js。如果你的系统上已经安装了 Node 和 npm，你可以通过以下命令安装 Async.js：\n\
    \n```\nnpm install -g async\n```\n\n然后在任何文件顶部放入 `async = require('async')` 即可引入该模块。\n\
    \n### 4.1 异步排序问题\n\n假设我们有一个 Node 应用，希望按字母顺序读取目录中的所有文件，然后将它们的内容连接成一个字符串并显示出来。使用同步方法，我们可以非常容易地做到这一点：\n\
    \n```\nvar fs = require('fs');\nvar concatenation = '';\nfs.readdirSync('recipes')\n\
    \  .filter(function(filename) {\n    return fs.statSync(filename).isFile();\n\
    \  })\n  .forEach(function(filename) {\n    concatenation += fs.readFileSync(filename,\
    \ 'utf8');\n  });\nconsole.log(concatenation);\n```\n\n（通过使用 `forEach` 迭代器而不是\
    \ `for` 循环，我们避免了第 1 章中看到的 `i` 变量作用域问题。但要注意，如果没有 polyfill，`forEach` 在旧版浏览器中不可用。）\n\
    \n但所有这些阻塞都极其低效，特别是如果我们的应用程序可以同时做其他事情的话。问题在于，我们不能天真地将\n\n```\nconcatenation +=\
    \ fs.readFileSync(filename, 'utf8');\n```\n\n替换为\n\n```\nfs.readFile(filename,\
    \ 'utf8', function(err, contents) {\n  if (err) throw err;\n  concatenation +=\
    \ contents;\n});\n```\n\n因为无法保证 `readFile` 回调会按照 `readFile` 调用发出的顺序触发。`readFile`\
    \ 只是告诉操作系统**开始**读取一个文件。很可能，较短的文件比较长的文件读取得更快。\n\n### 4.2 Async.js 集合方法\n\n解决异步排序问题最简单的方法是，在上一个\
    \ `readFile` 完成后才开始下一个：\n\n```\nvar fs = require('fs');\nvar concatenation = '';\n\
    var dirContents = fs.readdirSync('recipes');\nfunction readFileAt(i) {\n  if (i\
    \ === dirContents.length) return console.log(concatenation);\n  fs.stat(filename,\
    \ function(err, stats) {\n    if (err) throw err;\n    if (!stats.isFile()) return\
    \ readFileAt(i + 1);\n    fs.readFile(dirContents[i], 'utf8', function(err, fileContents)\
    \ {\n      if (err) throw err;\n      concatenation += fileContents;\n      readFileAt(i\
    \ + 1);\n    });\n  });\n}\nreadFileAt(0);\n```\n\n你可能已经注意到，这不是一个非常优雅的解决方案。对于如此简单的任务，涉及了太多样板代码。当我们使用同步的\
    \ `filter` 和 `forEach` 方法时，这只花了 10 行！如果我们能直接使用那些强大的迭代方法的异步等效物，岂不是很好？\n\n这正是 Async.js\
    \ 提供给我们的功能之一（还有其他功能）。事实上，我们有两个选择来替代 `Array` 原型的 `filter` 和 `forEach` 方法：\n\n1.\
    \  `async.filter` 和 `async.forEach`，它们*并行*处理给定的数组，或者\n2.  `async.filterSeries`\
    \ 和 `async.forEachSeries`，它们*按顺序*处理给定的数组\n\n显然，并行运行异步操作更快，那为什么我们要使用串行方法呢？嗯，有两个原因：\n\
    \n首先，Node（或任何应用程序进程）同时尝试读取的文件数量是有限的。如果达到这个限制，操作系统会给我们一个错误，我们必须在 `fs.readFile`\
    \ 回调中处理。如果我们按顺序读取文件，就不必处理这个限制。\n\n其次，如果我们并行运行 `readFile` 回调，我们就不能简单地写：\n\n```\n\
    concatenation += fileContents;\n```\n\n因为无法保证 `readFile` 操作会按照它们开始的顺序完成。我们必须想办法存储结果，并按正确的顺序连接它们。\n\
    \n所以，我们现在坚持使用 `async.forEachSeries`。这是将我们的同步代码改编为使用 Async.js 集合方法的一个简单示例：\n\n\
    ```\nvar async = require('async');\nvar fs = require('fs');\nvar concatenation\
    \ = '';\nvar dirContents = fs.readdirSync('recipes');\nasync.filter(dirContents,\
    \ isFilename, function(filenames) {\n  async.forEachSeries(filenames, readAndConcat,\
    \ onComplete);\n});\nfunction onComplete(err) {\n  if (err) throw err;\n  console.log(concatenation);\n\
    }\n\nfunction isFilename(filename, callback) {\n  fs.stat(filename, function(err,\
    \ stats) {\n    callback(err ? false : stats.isFile());\n  });\n}\nfunction readAndConcat(filename,\
    \ callback) {\n  fs.readFile(filename, 'utf8', function(err, fileContents) {\n\
    \    if (err) return callback(err);\n    concatenation += fileContents;\n    callback();\n\
    \  });\n}\n```\n\n现在我们的代码很好地分成了两部分：整体任务和实现细节（以迭代器函数的形式）。\n\n`filter` 和 `forEach`\
    \ 并不是 Async.js 中唯一对应 `Array` 原型方法的实用工具。还有：\n\n-   `reject`/`rejectSeries`，`filter`\
    \ 的逆操作\n-   `map`/`mapSeries`，用于一对一转换\n-   `reduce` 和 `reduceRight`，用于在每一步转换一个值\n\
    -   `detect`/`detectSeries`，用于查找匹配过滤器的值\n-   `sortBy`，用于生成排序后的副本\n-   `some` 用于测试是否至少有一个值匹配给定条件\n\
    -   `every` 用于测试是否*所有*值都匹配给定条件\n\n在我们的文件读取示例中，我们可以采用更简洁的函数式风格，使用 `async.reduce`，让\
    \ Async.js 为我们存储连接结果：\n\n```\nvar async = require('async');\nvar fs = require('fs');\n\
    var dirContents = fs.readdirSync('recipes');\nasync.filter(dirContents, isFilename,\
    \ function(filenames) {\n  async.reduce(filenames, '', readReduce, onComplete);\n\
    });\n\nfunction onComplete(err, concatenation) {\n  if (err) throw err;\n  console.log(concatenation);\n\
    }\n\nfunction isFilename(filename, callback) {\n  fs.stat(filename, function(err,\
    \ stats) {\n    callback(err ? false : stats.isFile());\n  });\n}\n\nfunction\
    \ readReduce(concatenation, filename, callback) {\n  fs.readFile(filename, 'utf8',\
    \ function(err, fileContents) {\n    if (err) callback(err);\n    callback(null,\
    \ concatenation + fileContents);\n  });\n}\n```\n\nⁱhttp://search.npmjs.org/\n\
    ²https://github.com/caolan/async\n"
