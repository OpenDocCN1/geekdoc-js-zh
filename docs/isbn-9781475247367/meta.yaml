    EventVat''s Redis-like API allows us to express complex data queries in a single
    interprocess message. For instance, the `mset` function allows us to set multiple
    values at once.


    Currently, most Node apps use a Redis store for things like session state, but
    I wouldn''t be surprised to see Clusterhub take over that role in the near future.
    Its approach promises higher performance, better security, and one less dependency
    to set up on the server.


    # Temporary threads


    The `cluster`/`child_process` approach is well-suited to splitting up an application
    into ongoing processes, but what if you want a single block of synchronous code
    to be run in a separate thread? That''s the use case that Threads A GoGo was made
    for.⁹ It''s an ideal library for making long computations non-blocking.


    Regrettably, there''s no equivalent for the browser. It takes significant overhead
    to create a new Web Worker, making them ill-suited to one-shot tasks. In the absence
    of a W3C standard for evaluating code in a separate thread, the best we can do
    is create and manage a pool of Web Workers ourselves. No doubt new libraries will
    make this easier as Web Workers become an ubiquitous browser feature.


