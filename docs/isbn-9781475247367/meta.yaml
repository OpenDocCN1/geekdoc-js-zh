  md: '# 4.8 Other flow control libraries


    Before we close the chapter, let me mention a couple of interesting flow control
    libs that we might learn from.


    # Futures


    Previously mentioned in Chapter 3, AJ O''Neal''s Futures has a little bit of everything:
    It''s part flow control, part Promises, and part PubSub.⁴ It''s a one-stop shop
    for all your async needs. Unfortunately, that wide-ranging functionality makes
    for an exhaustingly complex API.


    # nue


    Speaking of complexity, Toshihiro Nakamura''s nue⁵ is like Step''s much, *much*
    bigger brother. Whereas Step only allows flows to run in a linear order (with
    parallelism within a step), nue lets you spawn sub-flows, share data by attaching
    it to a shared object, name flows and steps for debugging, and basically do anything
    else you can imagine. It''s overwhelming, but admirable.


    In this chapter, we saw how common async patterns can be implemented with minimal
    boilerplate using the right flow control functions. We also saw the biggest problem
    with flow control: That for every problem, there''s an overwhelming number of
    solutions to choose from.


    Isaac Schlueter, the creator of npm and recently-appointed head of the Node.js
    project, made a very small flow control library called Slide.⁶ In its README,
    he wrote:


    > You should use it as an example of how to write your own flow control utilities.
    You''ll never fully appreciate a flow control lib that you didn''t write yourself.


    I hope that''s not true. Writing a flow control lib is a good exercise, but you
    shouldn''t have to reinvent the wheel just to see how it works. As the JavaScript
    ecosystem matures, flow control should become more widespread and more standardized.
    My prediction is that a library will emerge that will do for flow control what
    jQuery did for DOM interaction, or what Underscore.js has done for (synchronous)
    functional-style programming. When that happens, it''ll be a great day for JavaScript.


    ⁴https://github.com/coolaj86/futures


    ⁵https://github.com/nakamura-to/nue


    ⁶https://github.com/isaacs/slide-flow-control'
