    \ 类似，`async.queue` 的强大之处很大程度上在于它能够添加一个完成处理程序。这个处理程序被称为 `drain`。（想象一个装满任务的水槽；当最后一个任务流走时，回调就会触发。）这里有一个使用定时器的演示：\n\
    \n```\nvar async = require('async');\n\nfunction worker(data, callback) {\n  setTimeout(callback,\
    \ data);\n}\nvar concurrency = 2;\nvar queue = async.queue(worker, concurrency);\n\
    var start = new Date();\nqueue.drain = function() {\n  console.log('Completed\
    \ in ' + (new Date() - start) + 'ms');\n};\n\nqueue.push([100, 300, 200]);\n```\n\
    \n回顾一下，`async.series` 处理这些超时需要大约 600ms（总和），而 `async.parallel` 只需要大约 300ms（最大值）。这里，并发数是\
    \ 2，所以最初，前两个超时将并行运行。但是当 100ms 的超时完成后，队列中的下一个任务（200ms 的超时）将立即开始。因此，在这种情况下，`async.queue`\
    \ 的完成时间与 `async.parallel` 大致相同。顺序很重要：如果 300ms 是第三个超时，队列将需要大约 400ms 来完成。\n\n请注意，我们始终可以向队列推送更多任务，并且每次队列中的最后一个任务完成时，`drain`\
    \ 都会触发。它不像 `async.series` 和 `async.parallel` 那样是一次性的，后两者的任务列表是固定的。\n\n让我们用 `async.queue`\
    \ 重写我们的文件读取示例，并设定合理的并发上限：\n\n```\nvar async = require('async');\nvar fs = require('fs');\n\
    \nvar concatenation = '';\nvar filenames = fs.readdirSync('recipes')\n  .filter(function(filename)\
    \ {\n    return fs.statSync(filename).isFile();\n  });\n\nvar results = [];\n\
    function worker(i, callback) {\n  fs.readFile(filenames[i], 'utf8', function(err,\
    \ result) {\n    if (err) throw err;\n    results[i] = result;\n    callback();\n\
    \  });\n}\nvar concurrency = 10;\nvar queue = async.queue(worker, concurrency);\n\
    for (var i = 0; i < filenames.length; i++) {\n  queue.push(i);\n}\nqueue.drain\
    \ = function() {\n  console.log(concatenation = results.join(' '));\n};\n```\n\
    \n在这里，`async.queue` 扮演着交通警察的角色，确保我们每次最多只读取 10 个文件。不幸的是，它并不能确保 push 回调按特定顺序被调用，迫使我们笨拙地管理自己的结果数组。\n\
    \n## 高级队列回调\n\n尽管 `drain` 通常是你唯一需要的处理程序，但 `async.queue` 还提供了几个其他事件：\n\n-   当最后一个任务开始运行时，队列会调用\
    \ `empty`。（当任务完成时，它会调用 `drain`。）\n-   当达到并发限制时，队列会调用 `saturated`。\n-   如果你在 push\
    \ 中提供一个函数作为第二个参数，它将在给定任务（或给定数组中的每个任务）完成时被调用。\n\n简而言之，`async.queue` 是 Async.js\
    \ 中功能最齐全的函数之一，是用于限制并发性的通用阀门。\n\n## 4.6 自动化\n\n尽管 `async.queue` 功能强大，但有些情况它无法处理。考虑一个复杂应用程序的启动过程。该过程的一小部分可能如下所示：\n\
    \n1.  读取配置文件\n2.  连接到配置文件指定的数据库\n3.  连接到配置文件指定的缓存\n4.  将数据库中最常用的对象加载到缓存中\n5. \
    \ 连接到外部 API\n6.  开始响应 HTTP 请求\n\n在这里，任务 2 和 3 都依赖于任务 1，任务 4 依赖于任务 2 和 3，任务 6 依赖于任务\
    \ 2、3 和 5。你可以按线性顺序执行这些任务，但这会不必要地拖慢服务器的启动速度。我们希望的是在每个任务的依赖项完成后立即运行该任务。\n\n为此，我们可以为每个任务编写一个\
    \ Promise，然后用 `when` 和 `then` 自己处理逻辑……或者，我们可以让一个算法为我们解决这个问题。毕竟，任何依赖关系集都可以转换为有向图，而解决数学问题正是计算机的专长！在第二次世界大战期间，计算机计算炸弹的轨迹。如今，它们计算愤怒的小鸟的轨迹。我的意思是，依赖图对机器来说是小菜一碟。\n\
    \n`async.auto` 让我们以单个对象的形式描述一个依赖图，其中键是任务名称，值是以下形式的数组：\n\n[dependencies..., task]\n\
    \n其中 dependencies 是任务名称列表，task 是函数本身。如果一个任务没有依赖项，我们可以直接写\n\ntask\n\n而不是\n\n[task]\n\
    \n以下是我们如何实现服务器的启动过程，假设我们已经定义了各个组成部分的任务：\n\n```\nasync.auto({\n  readConfigFile:\
    \ readConfigFile,\n  connectToDB:    ['readConfigFile', connectToDB],\n  connectToCache:\
    \ ['readConfigFile', connectToCache],\n  cacheObjects:   ['connectToDB', 'connectToCache',\
    \ cacheObjects],\n  connectToAPI:   connectToAPI,\n  acceptHTTPReqs: ['connectToDB',\
    \ 'connectToCache', 'connectToAPI',\n                   acceptHTTPReqs]\n});\n\
    ```\n\n（按照惯例，我将函数名用作依赖图的键。`async.auto` 本身并不关心函数叫什么名字。）\n\n尽管 `auto` 没有被广泛使用，但它是一个极其强大的函数，你应该有所了解。在一个复杂的应用程序中，它可能真的是救星。\n\
    \n这就是我们对 Async.js 的介绍，它是使用最广泛且可以说功能最丰富的流程控制库。然而，我不想让你产生 Async.js 是每个回调驱动工作的正确工具的印象。让我们通过看几个替代方案来结束本章。\n\
    \n## 4.7 使用 Step 进行极简主义流程控制\n\n最著名的 Async.js 替代方案是 Tim Caswell 的 Step。² Step 比\
    \ Async.js 轻量得多，其 API 仅包含一个函数：`Step`。`Step` 接受一个函数列表，例如\n\n```\nStep(task1, task2,\
    \ task3);\n```\n\n每个函数可以通过三种方式控制流程：\n\n1.  它可以调用 `this`，让 Step 运行列表中的下一个函数。\n\
    2.  它可以调用 `this.parallel` 或 `this.group` 生成的回调 *n* 次，告诉 Step 运行下一个函数 *n* 次。\n\
    3.  它可以返回一个值，这也会让 Step 运行列表中的下一个函数。这使得将同步函数与异步函数混合使用变得容易。\n\n下一个函数将接收其前驱的结果（即其返回值或它传递给\
    \ `this` 的参数），或者如果前驱是使用 `this.parallel` 或 `this.group` 运行的，则接收其所有实例的结果。（区别在于，`this.parallel`\
    \ 将这些结果作为单独的参数提供，而 `this.group` 将它们合并为数组。）\n\n截至本文撰写时，整个库只有 152 行代码（包含注释），但功能足够强大，可以处理大多数异步流。这种极简主义的缺点是，用\
    \ Step 创建的流只能通过阅读其中的每个函数来理解。使用功能包罗万象的 Async.js 创建的流往往更具自解释性。\n\n这是一个很好的折衷方案：无论你需要\
    \ Async.js 的什么功能，尝试用 Step 自己编写它。例如，以下是等效的 `async.map`，只有 11 行：\n\n```\nvar Step\
    \ = require('step');\n\nfunction stepMap(arr, iterator, callback) {\n  Step(\n\
    \    function() {\n      var group = this.group();\n      for (var i = 0; i <\
    \ arr.length; i++) {\n        iterator(arr[i], group());\n      };\n    },\n \
    \   callback\n  );\n}\n```\n"
