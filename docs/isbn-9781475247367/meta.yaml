  md: "```\nvar spriteCollectionSet = new Backbone.Model();\nspriteCollectionSet.on('change',\
    \ function(model, name, collection) {\n    collection.on('change', spriteCollectionSet.change());\n\
    });\n```\n\nwhere the `change` method simply forces Backbone to emit the `change`\
    \ event from the set.\n\n# Cycles and silence\n\nSuppose we want to ensure that\
    \ x always equals 2 * y:\n\n```\nvar x = new Backbone.Model({value: 0});\nvar\
    \ y = new Backbone.Model({value: 0});\nx.on('change:value', function(x, xVal)\
    \ { y.set({value: xVal / 2}); });\ny.on('change:value', function(y, yVal) { x.set({value:\
    \ 2 * yVal}); });\n```\n\nYou might expect this code to lead to an infinite loop\
    \ the moment the value of x or y is changed. But actually, it’s quite safe, for\
    \ two reasons: First, `set` doesn’t emit a `change` event if the new value matches\
    \ the old one. Second, and more importantly, the designers of Backbone decided\
    \ that no model should be able to emit a `change` event during one of its own\
    \ `change` events. The changes are still performed, but they’re done *silently*.\n\
    \nThis is, itself, a problem. If nested changes are made to a model, observers\
    \ will see only the outermost one, and may go out of sync. It’s the price you\
    \ pay for avoiding the possibility of infinite cycles.\n\nClearly, maintaining\
    \ two-way connections between data points in Backbone is a challenge. Another\
    \ major MVC framework, Ember.js, allows two-way bindings to be declared explicitly.\
    \ The caveat? When one value changes, the other is updated asynchronously from\
    \ a timeout event. So until that event fires, the application’s data will be in\
    \ an inconsistent state.\n\nThere’s no easy solution to the problem of entangled\
    \ models, but a major weapon in the arsenal against them is Backbone’s `silent`\
    \ flag. If you add `{silent: true}` to a set event, no `change` event will happen.\
    \ So if several models need to be updated at once, a good approach is to set them\
    \ silently, then call their `change` methods only after they’re in a consistent\
    \ state.\n\n# 2.3 Custom jQuery events\n\nCustom events are an underappreciated\
    \ feature of jQuery that make it easy to graft a powerful distributed event system\
    \ onto any web app, with no additional libraries. You can emit any event you want\
    \ from any DOM element from jQuery using `trigger`:"
