  md: 'Although it doesn''t have as big a following as CoffeeScript, features like
    this make Kaffeine well worth checking out.


    # Streamline.js


    Like Kaffeine, Streamline.js'' allows you to use a special syntax to treat async
    functions as synchronous: Just use _ in place of the callback. Interestingly,
    Streamline can generate either standard callback-driven JavaScript or fiber-based
    code for node-fibers (see below). Also, unlike most other JavaScript precompilers,
    Streamline can be used in conjunction with CoffeeScript.


    Note that both Kaffeine and Streamline depend on callbacks following the argument
    list convention (err, results...), which is ubiquitous in the Node world but less
    common in browsers.


    # node-fibers


    While the other projects above merely compile to plain JavaScript, node-fibers10
    actually extends the language understood by the Node.js runtime by adding thread-like
    constructs called fibers. The main advantage of node-fibers over JS precompilers
    is debugging. The line numbers in node-fiber stack traces correspond to the line
    numbers in node-fiber source code, and exceptions thrown from fibers behave much
    more nicely than exceptions thrown from async callbacks do.


    It''s a very cool project with a small but passionate following. Just be warned
    that it doesn''t always play nice with mainstream Node tools.


    We''ve seen in this chapter how JavaScript''s single-threadedness is both a blessing
    and a curse. In the right hands, it makes for beautiful code free of the terrifying
    race conditions that plague multi-threaded apps. But you need to develop the right
    mindset—and the right techniques.


    It bears mention here that there is one kind of multi-threading in JavaScript:
    You can spawn worker processes. Each spawned process can exchange data with other
    processes under the same limitations as any other I/O. These make it possible
    to utilize multiple cores, without breaking the normal rules of JavaScript (code
    can''t be interrupted; variables are only accessible within their scope). For
    more on workers, skip ahead to the penultimate chapter of this book.


    In the next chapter, we''ll talk about organizing and stacking event callbacks.
    If we do our job right, our async apps should have as many callbacks as you can
    think of—each with a clear, narrow purpose.


    9 https://github.com/Sage/streamlinejs

    10 https://github.com/laverdet/node-fibers'
