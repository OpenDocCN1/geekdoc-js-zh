    \ 'li > a');\n  }\n});\n```\n\n注意对 `menu.clickHandler` 的引用。为了方便命名空间，我们将继续把所有与菜单相关的事件处理程序附加到菜单模型：\n\
    \n```\nmenu.clickHandler = function() {\n  menu.set({ready: false, activeLinkIndex:\
    \ $(this).index()});\n  return false;\n}\n```\n\n声明菜单就绪是唯一必须等待 DOM 的事情。所以我们最初包裹*所有内容*的\
