  md: "Flow Control with Async.js\n\n50\n\nHere, tasks 2 and 3 both depend on task\
    \ 1, task 4 depends on tasks 2 and 3, and task 6 depends on tasks 2, 3 and 5.\
    \ You could just do these tasks in linear order, but that would slow the server's\
    \ startup unnecessarily. What we want is to run each task as soon as its dependencies\
    \ have finished.\nTo do that, we could write a Promise for each task and work\
    \ out the logic ourselves with whens and thens... or we could just let an algorithm\
    \ solve it for us. After all, any set of dependencies can be translated into a\
    \ directed graph, and solving math problems is what computers are for! In World\
    \ War II, computers calculated bomb trajectories. Today, they calculate the trajectories\
    \ of angry avians. My point is, dependency graphs are a breeze for machines to\
    \ work out.\n\nasync.auto lets us describe a dependency graph in the form of a\
    \ single object, where the keys are task names and the values are arrays of the\
    \ form\n\n[dependencies..., task]\n\nwhere dependencies is a list of task names\
    \ and task is the function itself. If a task has no dependencies, we can just\
    \ write\n\ntask\n\ninstead of\n\n[task]\n\nHere's how we'd implement our server's\
    \ startup process, assuming we've already defined the constituent tasks:\n\n```\n\
    async.auto({\n  readConfigFile: readConfigFile,\n  connectToDB:    ['readConfigFile',\
    \ connectToDB],\n  connectToCache: ['readConfigFile', connectToCache],\n  cacheObjects:\
    \   ['connectToDB', 'connectToCache', cacheObjects],\n  connectToAPI:   connectToAPI,\n\
    \  acceptHTTPReqs: ['connectToDB', 'connectToCache', 'connectToAPI',\n       \
    \            acceptHTTPReqs]\n});\n```\n\n(As a convention, I've used the function\
    \ names as the keys of the dependency graph. async.auto itself doesn't care what\
    \ names the functions have.)\n\nAlthough auto isn't widely used, it's an extremely\
    \ powerful function that you should be aware of. In a complex application, it\
    \ could be a real lifesaver.\n\nThat's it for our coverage of Async.js, the most\
    \ widely used and arguably the most feature-rich flow control lib. However, I\
    \ don't want you to get the impression that Async.js is the right tool for every\
    \ callback-driven job. Let's close out the chapter by looking at a few alternatives."
