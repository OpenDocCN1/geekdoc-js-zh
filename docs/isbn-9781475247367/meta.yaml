  md: '# ES6 and Task.js


    ECMAScript 6 (currently a work in progress but available in Firefox) adds a new
    feature called **generators**. A generator is a function containing a `yield`
    keyword that allows you to run an asynchronous function in such a way that it
    blocks only the generator, making a callback unnecessary. Generators themselves
    are a bit tricky to wrap your head around, but a Mozilla project called Task.js[^1]
    makes them easier by providing a standard API built on Promises. (Promises are
    the subject of an upcoming chapter.)


    This might just be the future of JavaScript. Unfortunately, it''ll be a while
    before the spec becomes official, and many years before every browser in the world
    supports generators...


    # TameJS


    The awesome programmers at OkCupid have created a clever pre-compiler[^2] with
    over 500 GitHub followers that adds two keywords to JavaScript, `await` and `defer`.
    An `await` block acts much like a generator, defining code that won''t return
    until each async task defined with `defer` has been completed.


    The Tame.js folks have also created a CoffeeScript fork with `await`/`defer` called
    IcedCoffeeScript[^3].


    # StratifiedJS


    StratifiedJS is an alternative to the `yield` paradigm that offers finer-grained
    control structures, with intuitive names like `waitfor` and `resume`. Although
    not widely used, it''s received praise from the likes of John Resig, the creator
    of jQuery. And its creator, Oni Labs, has ambitious plans for it.


    Note that StratifiedJS is the name of the specification, not the implementation.
    The official reference implementation is called Oni Apollo[^4].


    # Kaffeine


    If you can''t quite wrap your head around `yield`/`await`, Kaffeine offers a simple
    syntactic sugar: Just add `!` after an async function''s name. Kaffeine assumes
    that the function takes a callback as its last argument, and simply transforms
    all code after that function call into the callback. So, for example:


    ```

    var sleep = function(delay, callback) { setTimeout(callback, delay); }

    console.log(''Wait a second...'');

    sleep(1000)

    console.log(''OK, that was one second.'');

    ```'
