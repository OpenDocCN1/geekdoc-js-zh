    Promises and Deferreds


    26


    A choice was made:

    No game today.


    So when the Deferred was rejected, its always and fail callbacks were run. Note
    that callbacks always run in the order in which they were bound. If the always
    callback had been bound last, the order of the console output would be reversed.


    Try hitting Y and N repeatedly. After the first choice is made, there''s no effect!
    That''s because a Promise can only be resolved or rejected once; after that, it''s
    inert. We say that a Promise is pending until it''s either resolved or rejected.
    You can find out whether a Promise is "pending", "resolved", or "rejected" by
    calling its state method. (state was added in jQuery 1.7; in earlier versions,
    use isResolved and isRejected.)


    I like to say that I''m triggering a Promise when I resolve or reject it, and
    a Promise that''s been resolved or rejected is triggered. This is non-standard
    terminology, but I''ll be using it throughout this chapter, as the words "triggering"/"triggered"
    are much more direct than the phrases "resolving or rejecting"/"resolved or rejected."


    A more sensible terminology is used in the Promises/A spec and its implementations
    (including Q): A Promise is either fulfilled or rejected; either way, it''s resolved.
    Unfortunately, jQuery appears to be stuck with the resolved vs. rejected dichotomy.


    # Getting a pure Promise


    I promised you a Promise, so here it is:


    ```

    var promptPromise = promptDeferred.promise();

    ```


    promptPromise is just a copy of promptDeferred without the resolve/reject methods.
    It doesn''t matter whether we bind a callback to a Deferred or to its Promise,
    because they share the same callbacks internally. They also share the same state
    ("pending", "resolved", or "rejected"). This means that creating multiple Promises
    for a single Deferred would be pointless. In fact, jQuery will just give you the
    same object:


    ```

    var promise1 = promptDeferred.promise();

    var promise2 = promptDeferred.promise();

    console.log(promise1 === promise2);  // true

    ```


    The only reason to use the promise method is safety. If we pass promptPromise
    around but keep promptDeferred to ourselves, we can rest assured that none of
    our callbacks will fire until we want them to.


    To reiterate: Every Deferred has a single Promise, and every Promise represents
    a Deferred.'
- md: "## 3.3 Passing arguments to callbacks\n\nWhen you pass additional arguments\
    \ to `resolve`/`reject`, each callback will receive those arguments:\n\n```javascript\n\
    var aDreamDeferred = new $.Deferred();\naDreamDeferred.done(function(subject)\
    \ {\n    console.log('I had the most wonderful dream about', subject);\n});\n\
    aDreamDeferred.resolve('the JS event model');\n```\n\nI had the most wonderful\
    \ dream about the JS event model\n\n(This should give you `EventEmitter` flashbacks.)\
    \ There are also special methods for running the callbacks in a particular context\
    \ (that is, setting `this` to a particular value): `resolveWith` and `rejectWith`.\
    \ Just pass the context as the first argument, and pass all other arguments in\
    \ as an array:\n\n```javascript\nvar slashdotter = {\n    comment: function(editor){\n\
    \        console.log('Obviously', editor, 'is the best text editor.');\n    }\n\
    };\nvar grammarDeferred = new $.Deferred();\ngrammarDeferred.done(function(verb,\
    \ object) {\n    this[verb](object);\n});\ngrammarDeferred.resolveWith(slashdotter,\
    \ ['comment', 'Emacs']);\n```\n\nObviously `Emacs` is the best text editor.\n\n\
    Having to wrap your arguments in an array is a pain, though. So here's a handy\
    \ tip: Instead of using `resolveWith`/`rejectWith`, you can just invoke plain\
    \ `resolve`/`reject` in the desired context. That's because `resolve`/`reject`\
    \ pass their context right on to the callbacks they fire. So in the above example,\
    \ we could achieve the same result with\n\n```javascript\ngrammarDeferred.resolve.call(slashdotter,\
    \ 'comment', 'Emacs');\n```\n\n## 3.4 Progress notifications\n\nA Promise is a\
    \ bundle of things you want to happen when a process comes to an end. But didn't\
    \ a motivational poster once tell you that the journey is as important as the\
    \ destination? Did you learn *nothing* from that poster?\n\nFortunately, the jQuery\
    \ team soaked up that wisdom (and the Promises/A spec) and, in jQuery 1.7, added\
    \ a new kind of Promise callback which can be invoked any number of times. It's\
    \ called *progress*. For example, suppose we want to update an indicator of how\
    \ far a person has gotten toward their daily word goal for National Novel Writing\
    \ Month (NaNoWriMo):\n\n```javascript\nvar nanowrimoing = $.Deferred();\nvar wordGoal\
    \ = 5000;\nnanowrimoing.progress(function(wordCount) {\n    var percentComplete\
    \ = Math.floor(wordCount / wordGoal * 100);\n    $('#indicator').text(percentComplete\
    \ + '% complete');\n});\nnanowrimoing.done(function(){\n    $('#indicator').text('Good\
    \ job!');\n});\n```\n\n(It's not a standard convention, but I like to use the\
    \ present continuous tense, *-ing*, for the variable names of Promises and other\
    \ objects that represent concurrent tasks.)\n\nWith the `nanowrimoing` deferred\
    \ available, here's how we respond to potential changes in word count:\n\n```javascript\n\
    $('#document').on('keypress', function(){\n    var wordCount = $(this).val().split(/\\\
    s+/).length;\n    if (wordCount >= wordGoal) {\n        nanowrimoing.resolve();\n\
    \    } else {\n        nanowrimoing.notify(wordCount);\n    }\n});\n```\n\n(Actually,\
    \ we could omit the `else` and run `nanowrimoing.notify` every time, because `notify`\
    \ calls are ignored after the Promise has been triggered, just as additional `resolve`\
    \ and `reject` calls are ignored.)\n\nThe `notify` call on the Deferred invokes\
    \ our *progress* callback. Just like `resolve` and `reject`, `notify` can take\
    \ arbitrary arguments. (Also like `resolve` and `reject`, there's a `notifyWith`\
    \ variant that takes a context as the first argument.)\n\nSo to recap: A Promise\
    \ takes three kinds of callbacks: `done`, `fail`, and `progress`. `done` callbacks\
    \ run when the Promise resolves, `fail` callbacks run when it's rejected, and\
    \ `progress` callbacks run whenever `notify` is called on a pending Deferred.\n\
    \n## Binding multiple callbacks with `then`\n\nIf you want to bind more than one\
    \ kind of callback at once, there's a handy shortcut method: `then`. Calling\n\
    \n```javascript\npromise.then(doneCallback, failCallback, progressCallback);\n\
    ```\n\nis equivalent to\n\n```javascript\npromise\n    .done(doneCallback)\n \
    \   .fail(failCallback)\n    .progress(progressCallback);\n```\n\n`then`, `done`,\
    \ `fail`, and `progress` all simply return the object they're attached to, as\
    \ jQuery methods tend to.\n\n(As we'll see later, the meaning of `then` is one\
    \ of the key differences between jQuery Promises and the Promises/A spec.)\n\n\
    ## 3.5 Animation Promises\n\nSo far, we've seen how jQuery's Ajax methods return\
    \ Promises, and we've seen how you can make your own with `$.Deferred`. But jQuery\
    \ 1.6+ provide one more source of Promises: ordinary jQuery objects. When you\
    \ call\n\n```javascript\n$('#elem').promise()\n```\n\nyou get a Promise representing\
    \ `$('#elem')`'s animation queue. When all animations on `$('#elem')` have completed,\
    \ the Promise is resolved. The Promise will be resolved whether the animations\
    \ completed naturally, or if `stop()` was called, or if there were no pending\
    \ animations in the first place. In short, animation Promises never fail.\n\n\
    Animation Promises make it easy to find out when animations on several different\
    \ elements have finished:\n\n```javascript\n$('#header').slideDown('slow');\n\
    $('#notification').fadeIn('fast').fadeOut('fast').fadeIn('fast');\n$('#header,\
    \ #notification').promise().done(function() {\n    // all of the above effects\
    \ have run\n});\n```\n\nAs we'll see in the next section, $.when provides an even\
    \ more versatile way of achieving the same goal.\n\n## 3.6 Combining Promises\
    \ with when\n\nThe existence of progress notifications doesn't change the fact\
    \ that, ultimately, every Promise is either resolved or rejected. (Or, it remains\
    \ forever pending.) But why? Why not let Promises change to any state at any time?\n\
    \nMainly, because programmers *thrive* on binary. We know exactly how to put 1s\
    \ and 0s together to perform astounding feats of logic. That's a big reason why\
    \ Promises are so powerful: **Promises let us see concurrent tasks as booleans.**\n\
    \nThe most common use case for logically combining Promises is finding out when\
    \ a set of async tasks have finished. Let's say that you're showing a tutorial\
    \ video while loading a game from the server. You want to start the game as soon\
    \ as two things have happened, in any order:\n\n1. The tutorial video has ended\n\
    2. The game is loaded\n\nGiven a Promise representing each of these processes,\
    \ your task is to start the game when both Promises are resolved. Enter jQuery's\
    \ when method:\n\n```javascript\nvar gameReadying = $.when(tutorialPromise, gameLoadedPromise);\n\
    gameReadying.done(startGame);\n```\n\nwhen acts as a logical AND for Promise resolution:\
    \ The Promise it generates is resolved as soon as all of the given Promises are\
    \ resolved, or rejected as soon as any one of the given Promises is rejected.\
    \ An excellent use case for when is combining multiple Ajax calls. If you need\
    \ to make two POST calls at once and get a notification when both have succeeded,\
    \ there's no need to define a separate callback for each request:\n\n```javascript\n\
    $.when($.post('/1', data1), $.post('/2', data2))\n    .then(onPosted, onFailure);\n\
    ```\n\nOn success, when can get access to the callback arguments from each of\
    \ its constituent Promises, but doing so is tricky: They're passed as a list of\
    \ arrays, in the same order that the Promises were passed in to when. (Amend that:\
    \ A Promise's callback arguments are only represented as an array if it emits\
    \ more than one value, as $.post does. See \"Passing non-Promises\" for examples.)\
    \ So to get all of the callback arguments from all of the Promises given to $.when,\
    \ we'd start with something like this:\n\n```javascript\n$.when(promise1, promise2,\
    \ promise3)\n    .done(function(promise1args, promise2args, promise3args) {\n\
    \        // ...\n    });\n```\n\nParsing lists of arrays is a nightmare. Don't\
    \ do it if you don't have to. If you want to GET data from two sources, for example,\
    \ attach callbacks directly to the individual GET promises rather than trying\
    \ to do everything from the when callback:\n\n```javascript\nvar serverData =\
    \ {};\nvar getting1 = $.get('/1')\n    .done(function(result) {serverData[1] =\
    \ result;});\nvar getting2 = $.get('/2')\n    .done(function(result) {serverData[2]\
    \ = result;});\n$.when(getting1, getting2)\n    .done(onServerDataLoaded);\n```\n\
    \n## Passing non-Promises\n\n$.when, and other jQuery methods that take Promises,\
    \ allow you to pass in non-Promises. These are treated like Promises that have\
    \ resolved with the given value in the corresponding argument slot. For instance,\n\
    \n```javascript\n$.when('foo')\n```\n\nwill give you a Promise that immediately\
    \ resolves with the value 'foo';"
  mdcn: "\n## 3.3 向回调函数传递参数\n\n当你向 `resolve`/`reject` 传递额外参数时，每个回调函数都会接收到这些参数：\n\n\
    ```javascript\nvar aDreamDeferred = new $.Deferred();\naDreamDeferred.done(function(subject)\
    \ {\n    console.log('I had the most wonderful dream about', subject);\n});\n\
    aDreamDeferred.resolve('the JS event model');\n```\n\n关于 JavaScript 事件模型，我做了一个最美好的梦。\n\
    \n（这可能会让你想起 `EventEmitter` 的回忆。）还有一些特殊方法用于在特定上下文中运行回调（即，将 `this` 设置为特定值）：`resolveWith`\
    \ 和 `rejectWith`。只需将上下文作为第一个参数传入，并将所有其他参数以数组形式传入：\n\n```javascript\nvar slashdotter\
    \ = {\n    comment: function(editor){\n        console.log('Obviously', editor,\
    \ 'is the best text editor.');\n    }\n};\nvar grammarDeferred = new $.Deferred();\n\
    grammarDeferred.done(function(verb, object) {\n    this[verb](object);\n});\n\
    grammarDeferred.resolveWith(slashdotter, ['comment', 'Emacs']);\n```\n\n显然 `Emacs`\
    \ 是最佳文本编辑器。\n\n不过，将参数包装在数组中很麻烦。所以这里有个实用技巧：你可以直接在所需的上下文中调用普通的 `resolve`/`reject`，而不使用\
    \ `resolveWith`/`rejectWith`。这是因为 `resolve`/`reject` 会将其上下文直接传递给触发的回调函数。所以在上面的例子中，我们可以用以下方式达到相同的结果：\n\
    \n```javascript\ngrammarDeferred.resolve.call(slashdotter, 'comment', 'Emacs');\n\
    ```\n\n## 3.4 进度通知\n\nPromise 是一组当进程结束时想要发生的事情的集合。但难道没有一张励志海报曾告诉你，旅程和目的地同样重要吗？你从那张海报上*什么都没*学到吗？\n\
    \n幸运的是，jQuery 团队吸收了这份智慧（以及 Promises/A 规范），并在 jQuery 1.7 中添加了一种新的 Promise 回调，可以被调用任意次数。它被称为\
    \ *progress*。例如，假设我们想要更新一个指示器，显示一个人在\"全国小说写作月\"（NaNoWriMo）中距离每日字数目标的进度：\n\n```javascript\n\
    var nanowrimoing = $.Deferred();\nvar wordGoal = 5000;\nnanowrimoing.progress(function(wordCount)\
    \ {\n    var percentComplete = Math.floor(wordCount / wordGoal * 100);\n    $('#indicator').text(percentComplete\
    \ + '% complete');\n});\nnanowrimoing.done(function(){\n    $('#indicator').text('Good\
    \ job!');\n});\n```\n\n（这不是标准约定，但我喜欢用现在进行时 *-ing* 来命名 Promise 和表示并发任务的其他对象的变量名。）\n\
    \n有了可用的 `nanowrimoing` 延迟对象，以下是我们如何响应字数变化的方式：\n\n```javascript\n$('#document').on('keypress',\
    \ function(){\n    var wordCount = $(this).val().split(/\\s+/).length;\n    if\
    \ (wordCount >= wordGoal) {\n        nanowrimoing.resolve();\n    } else {\n \
    \       nanowrimoing.notify(wordCount);\n    }\n});\n```\n\n（实际上，我们可以省略 `else`，每次都运行\
    \ `nanowrimoing.notify`，因为在 Promise 被触发后 `notify` 调用会被忽略，就像额外的 `resolve` 和 `reject`\
    \ 调用被忽略一样。）\n\nDeferred 上的 `notify` 调用会触发我们的 *progress* 回调。就像 `resolve` 和 `reject`\
    \ 一样，`notify` 可以接受任意参数。（也像 `resolve` 和 `reject` 一样，有一个 `notifyWith` 变体，它将上下文作为第一个参数。）\n\
    \n所以总结一下：Promise 接受三种回调：`done`、`fail` 和 `progress`。`done` 回调在 Promise 完成时运行，`fail`\
    \ 回调在被拒绝时运行，而 `progress` 回调在挂起的 Deferred 上调用 `notify` 时运行。\n\n## 使用 `then` 绑定多个回调\n\
    \n如果你想同时绑定多种回调，有一个方便的快捷方法：`then`。调用\n\n```javascript\npromise.then(doneCallback,\
