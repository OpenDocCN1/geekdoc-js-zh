    \ {\n    // we put a spinner on the selected menu item\n    var $clickedLink =\
    \ $(this).spin();\n    // we disable the menu until our Ajax call returns\n  \
    \  $('#menu').off('click', 'li > a');\n    $.get('/content/' + $clickedLink.index(),\
    \ {\n      success: function successHandler(response) {\n        $clickedLink.unspin();\n\
    \        $('#menu').on('click', 'li > a', clickHandler);\n        // we fade the\
