  md: "Distributed Events\n\n15\n\nwould call all 'evacuate' handlers.\n(Note that\
    \ the term \"event\" here has nothing to do with the event queue. See the \"Synchronicity\"\
    \ section, below.)\nYou can add any number of additional arguments when you emit\
    \ an event. All arguments are passed to all handlers:\n\n```\nemitter.emit('evacuate',\
    \ 'Woman and children first!');\n```\n\nThere are no restrictions on event names,\
    \ though the Node docs offer a useful convention:\nTypically, event names are\
    \ represented by a camel-cased string.\nAll of EventEmitter's methods are public,\
    \ but it's common convention for events to only be emitted from \"inside\" of\
    \ the EventEmitter. Conversely, common convention forbids an EventEmitter from\
    \ attaching handlers to itself.\n\n# Roll your own PubSub\n\nPubSub implementations\
    \ are so simple that we can create one in about a dozen lines of code. The only\
    \ state we need to store is a list of handlers for each event type we support:\n\
    \n```\nPubSub = {handlers: {}}\n```\n\nWhen we add a listener, we push it to the\
    \ end of the array (which means that listeners will always be called in the order\
    \ in which they were added):\n\n```\nPubSub.on = function(eventType, handler)\
    \ {\n    if (!(eventType in this.handlers)) {\n        this.handlers[eventType]\
    \ = [];\n    }\n    this.handlers[eventType].push(handler);\n    return this;\n\
    }\n```\n\nThen when an event is emitted, we loop through all of our handlers:\n\
    \n```\nPubSub.emit = function(eventType) {\n    var handlerArgs = Array.prototype.slice.call(arguments,\
    \ 1);\n    for (var i = 0; i < this.handlers[eventType].length; i++) {\n     \
    \   this.handlers[eventType][i].apply(this, handlerArgs);\n    }\n    return this;\n\
    }\n```"
