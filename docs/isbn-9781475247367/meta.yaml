  md: "# Distributed Events\n\n```\n$('#ozzy, #sten').on('meow', function() {\n  console.log(this.id\
    \ + ' meowed');\n});\n$('#ozzy').trigger('meow');  // \"ozzy meowed\"\n$('#sten').trigger('meow');\
    \  // \"sten meowed\"\n```\n\nIf you've worked with DOM events before, you're\
    \ no doubt familiar with *bubbling*: Whenever a element emits an event (such as\
    \ a `'click'`), its parent then emits the event, then its grandparent, and so\
    \ on up to the root element, `document`—unless the event's `stopPropagation` method\
    \ is called at some point along the way. (jQuery does for us automatically when\
    \ we return `false` from a handler). But did you know that jQuery's custom events\
    \ bubble as well? For instance, if we have a span named \"soda\" nested in a div\
    \ named \"bottle,\" the code\n\n```\n$('#soda, #bottle').on('fizz', function()\
    \ {\n  console.log(this.id + ' emitted fizz');\n});\n$('#soda').trigger('fizz');\n\
    ```\n\nwill emit the output\n\n```\nsoda emitted fizz\nbottle emitted fizz\n```\n\
    \nThis bubbling isn't always desirable, as we'll see in the tooltips example below.\
    \ Fortunately, jQuery offers a non-bubbling `triggerHandler` method as well.\n\
    \n# Example: Tooltips\n\nWhen events can be mapped intuitively to page elements,\
    \ jQuery is an ideal way of distributing them. For instance, suppose you're writing\
    \ a tooltip library, and you want only one tooltip to be visible at a time. So\
    \ you might simply add the line\n\n```\n$('.tooltip').remove()\n```"
