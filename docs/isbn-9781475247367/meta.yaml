    \n# Meet the queue\n\nWhen we call setTimeout, a timeout event is *queued*. Only\
    \ when our JavaScript code has finished running does the runtime ask, “OK, what’s\
    \ on the queue?” If there’s at least one event on the queue that’s eligible to\
    \ “fire” (like a 500ms timeout that was set 1002ms ago), the runtime picks one\
    \ and calls its “handler” (e.g. the function we passed in to setTimeout). When\
    \ that handler returns, we go back to the queue.\n\nInput events work the same\
    \ way: When a user clicks a DOM element that you’ve attached a click handler to,\
    \ the click event is queued. But the event won’t fire until after any running\
    \ code has finished. When a web page stops responding to your input, this is usually\
    \ the reason. (See the next section for an example.)\n\nSometimes the term “event\
    \ loop” is used to describe how the runtime works. It’s as if your code were being\
    \ run from a loop that looks like this:\n\n```\nrunYourScript();\nwhile (atLeastOneEventIsQueued)\
    \ {\n    fireNextQueuedEvent();\n}\n```\n\nOne implication of this is that each\
    \ event that fires will be at the root of the stack trace. More on that later\
    \ in the chapter.\n\n**To summarize:** Events can be *queued* while code is running,\
    \ but they can’t *fire* until the runtime is free."
