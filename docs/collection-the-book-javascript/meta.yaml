  md: "# LOGICAL ERRORS\n\nOccur when program logic is incorrect, leading to unexpected\
    \ or incorrect results.\n\n# 2. The `try-catch` statement\n\nThe `try-catch` statement\
    \ is used to wrap a block of code where you believe an exception may occur. The\
    \ `try` code block contains the code that will be executed and the part of the\
    \ code that can throw an exception. If an exception is thrown, the `catch` code\
    \ block is executed, allowing you to handle the exception appropriately.\n\n```\n\
    try {\n    // block of code that can generate an exception\n} catch (error) {\n\
    \    // block of code that handles the exception\n}\n```\n\n# 3. Throwing exceptions"
  merge: -1
  pgno: 80
- img_proc: true
  md: "In addition to handling exceptions, you can also throw them manually using\
    \ the `throw` statement. When throwing an exception, you can specify a value that\
    \ represents the error message.\n\nThis message can be used to provide more detailed\
    \ information about the exception for debugging, or to tell users what went wrong\
    \ in the program.\n\n```\nthrow new Error(\"Error Message\");\n```\n\n# 4. The\
    \ `finally` block\n\nThe `finally` block is optional and can be used in conjunction\
    \ with the `try-catch` block. It contains a block of code that will be executed\
    \ regardless of whether or not an exception occurs. The `finally` block is generally\
    \ used to handle cleanup tasks such as closing database connections or freeing\
    \ resources.\n\n```\ntry {\n  // block of code that can generate an exception\n\
    } catch (error) {\n  // block of code that handles the exception\n} finally {\n\
    \  // block of code to be executed regardless of whether an exception occurs or\
    \ not\n}\n```"
  merge: -1
  pgno: 81
- img_proc: true
  md: "# # 5. Custom Exceptions\n\nIn addition to the standard exceptions provided\
    \ by JavaScript, you can also create your own custom exceptions using the `throw`\
    \ function. This allows you to define custom exceptions with specific behaviors\
    \ and custom error messages.\n\n```\nclass MyException extends Error {\n    constructor(message)\
    \ {\n        super(message);\n        this.name = \"MyException\";\n    }\n}\n\
    \nthrow new MyException(\"Custom error message\");\n```\n\nError handling is an\
    \ essential skill for any JavaScript programmer.\n\nBy using error handling techniques,\
    \ you can ensure that your code is more robust and able to handle unexpected situations\
    \ properly. Keep in mind that it's important to balance good error management\
    \ with implementing clean, efficient code."
