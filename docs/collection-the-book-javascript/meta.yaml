    \  }\n});\n```\n\n### 3. 鼠标事件（mouseover, mouseout, mousemove）\n\n当鼠标悬停在元素上、离开元素或在元素内移动时，这些事件被触发。你可以使用这些事件来创建基于鼠标移动的交互。\n\
    \n```javascript\nelement.addEventListener('mouseover', function(){\n    // 当你将鼠标指针移到元素上时要执行的代码\n\
    });\n```\n\n看实际例子：\n\n```html\n<div id=\"myElement\" style=\"background-color:\
    \ #080808; color:#f8f8f8;\">My Div</div>\n<script>\n    const element = document.querySelector('#myElement');\n\
    \    element.addEventListener('mouseover', function() {\n        // 当你将鼠标指针移到元素上时要执行的代码\n\
    \        alert(\"You pass the mouse pointer on div' myElement'!\");\n    });\n\
    </script>\n```\n\n在这段代码中，我们添加了一个id为 'myElement' 的div，并在样式中将其背景定义为黑色，字体颜色定义为白色。这样做纯粹是为了更好地看到div的边界。\n\
