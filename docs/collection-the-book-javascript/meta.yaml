    \n```javascript\nlet name = prompt(\"你叫什么名字？\");\nconsole.log(\"你好，\" + name +\
    \ \"！\");\n```\n\n用户输入的值存储在一个变量中（本例中为`name`），可以在代码的后面使用。\n\n### 3. 事件处理\n\n事件是用户的操作，例如按钮点击、鼠标移动或按键。你可以使用JavaScript来处理这些事件并执行相应的操作。\n\
    \n例如，假设你的网站上有一个按钮，你想在用户点击它时显示一条消息。你可以通过将一个函数分配给按钮的点击事件来实现这一点。\n\n以下是一个基本示例：\n\n\
