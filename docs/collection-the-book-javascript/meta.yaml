- md: "## 4. Form events (submit, change)\n\nThese events are triggered when the user\
    \ submits a form or changes the value of a form field, respectively. They are\
    \ very useful for validating input data in real time or taking actions when the\
    \ form is submitted.\n\n```javascript\nconst form = document.querySelector('#myForm');\n\
    \nform.addEventListener('submit', function(event) {\n    event.preventDefault();\
    \ // prevents default form submission\n    // code to be executed when the form\
    \ is submitted\n});\n```\n\nSee the practical code:\n\n```html\n<form id=\"myForm\"\
    \ action=\"#\">\n    <label for=\"name\">Name:</label><br>\n    <input type=\"\
    text\" id=\"name\" name=\"name\" value=\"João\"><br>\n    <label for=\"lastname\"\
    >Last name:</label><br>\n    <input type=\"lastname\" id=\"lastname\" name=\"\
    lastname\" value=\"Silva\"><br><br>\n    <input type=\"submit\" value=\"Submit\"\
    >\n</form>\n\n<script>\n    const form = document.querySelector('#myForm');\n\
    \    form.addEventListener('submit', function(event) {\n        event.preventDefault();\
    \ // prevents default form submission\n        // code to be executed when the\
    \ form is submitted\n        alert('Form Submitted!');\n    });\n</script>\n```\n\
    \nThese are just a few examples of the most common events in JavaScript. However,\
    \ there is a wide variety of events available, and each HTML element can have\
    \ different events associated with it. It is important to know the JavaScript\
    \ and HTML documentation to have access to the complete list of events and how\
    \ to use them.\n\n## CHAPTER 10: DOM MANIPULATION\n\nIn JavaScript, the Document\
    \ Object Model (DOM) is an in-memory representation of an HTML page, where each\
    \ HTML element is an object and can be manipulated through scripts.\n\nDOM manipulation\
    \ is an essential skill when it comes to creating dynamic interactions on web\
    \ pages using JavaScript.\n\n### 1. Introduction to DOM\n\n#### What is DOM and\
    \ why is it important?\n\nThe DOM, or Document Object Model, is a programming\
    \ interface that represents the structure of an HTML or XML document as a tree\
    \ of objects. Each element, attribute, and text in the document is represented\
    \ as a node in the tree. The DOM allows programmers to dynamically manipulate\
    \ the structure, style, and content of a document.\n\n#### Why it's important?\n\
    \nThe DOM is fundamental because it allows web developers to create interactive\
    \ and dynamic pages.\n\nBy manipulating the DOM with JavaScript, you can update\
    \ content, change styles, add or remove elements, respond to user events, and\
    \ much more.\n\nIn essence, the DOM is a bridge that connects HTML/XML page content\
    \ to JavaScript code, providing an interactive and dynamic user experience.\n\n\
    #### How to access the DOM in JavaScript?\n\nTo access the DOM in JavaScript,\
    \ we use the variable `document`, which represents the current HTML document.\
    \ Here are some common ways to access the DOM:\n\n- **getElementById():**\n```javascript\n\
    let element = document.getElementById('elementId');\n```\n\n- **getElementsByClassName():**\n\
    ```javascript\nlet elements = document.getElementsByClassName('className');\n\
    ```\n\n- **getElementsByTagName():**\n```javascript\nlet elements = document.getElementsByTagName('tagName');\n\
    ```\n\n- **querySelector():**\n```javascript\nlet element = document.querySelector('selector');\n\
    ```\n\n- **querySelectorAll():**\n```javascript\nlet elements = document.querySelectorAll('selector');\n\
    ```\n\n- **Direct manipulation:**\n\nWe can also manipulate elements directly\
    \ through the DOM.\n\n```javascript\nlet element = document.createElement('div');\n\
    element.textContent = 'New Element';\ndocument.body.appendChild(element);\n```\n\
    \nThese are just a few examples. The choice of method depends on what you need\
    \ to do and the structure of your HTML.\n\nThe DOM provides a variety of methods\
    \ for navigating, selecting, and manipulating elements, enabling a wide range\
    \ of dynamic interactions on web pages.\n\n### 2. Element Selection\n\n#### How\
    \ to select DOM elements using their identifiers (IDs)?\n\nSelecting elements\
    \ by ID is common because IDs are unique within an HTML page. You can use the\
    \ `getElementById()` function for this:\n\n```javascript\nlet elementById = document.getElementById('YourId');\n\
    ```\n\nThis returns a reference to the element with the specified ID.\n\n####\
    \ How to select DOM elements using classes, tags and other selectors?\n\nThere\
    \ are several ways to select elements by class name, tag, or other selectors using\
    \ methods such as `getElementsByClassName()`, `getElementsByTagName()`, `querySelector()`,\
    \ and `querySelectorAll()`.\n\n**Using Classes**\n\n```javascript\n// Selecting\
    \ by class\nlet elementsByClass = document.getElementsByClassName('YourClass');\n\
    \n// Selecting using querySelector for first occurrence\nlet firstElementByClass\
    \ = document.querySelector('.yourClass');\n\n// Selecting using querySelectorAll\
    \ for all occurrences\nlet allElementsByClass = document.querySelectorAll('.yourClass');\n\
    ```\n\n**Using Tags**\n\n```javascript\n// Selecting by tag\nlet elementsByTag\
    \ = document.getElementsByTagName('yourTag');\n\n// Selecting using querySelector\
    \ for the first occurrence\nlet firstElementByTag = document.querySelector('yourTag');\n\
    \n// Selecting using querySelectorAll for all occurrences\nlet allElementsByTag\
    \ = document.querySelectorAll('yourTag');\n```\n\n**Using other Selectors:**\n\
    \n```javascript\n// Selection by selector\nlet elementBySelector = document.querySelector('#yourId.yourClass\
    \ yourTag');\n\n// Selecting using querySelectorAll for all occurrences\nlet allElementsSelector\
    \ = document.querySelectorAll('#yourId.yourClass yourTag');\n```\n\nThese methods\
    \ facilitate the selection of elements according to different criteria, allowing\
    \ flexible and dynamic manipulation of the DOM in response to specific events\
    \ or needs in your web application.\n\n### 3. Element Manipulation\n\n#### How\
    \ to get and change element attributes?\n\nYou can get and change attributes of\
    \ elements using properties `getAttribute()` and `setAttribute()`.\n\n- **Get\
    \ an attribute:**\n```javascript\nlet valueOfAttribute = elemento.getAttribute('nameOfAttribute');\n\
    ```\n\n- **Alter an attribute:**\n```javascript\nelemento.setAttribute('nameOfAttribute',\
    \ 'newValue');\n```\n\n#### How to change the content of an element?\n\nYou can\
    \ manipulate the content of an element through the `textContent` or `innerHTML`\
    \ property.\n\n- **Using `textContent`:**\n```javascript\nelement.textContent\
    \ = 'New content';\n```\n\n- **Using `innerHTML` (be careful with security):**\n\
    ```javascript\nelement.innerHTML = '<strong>New</strong> content';\n```\n\nBe\
    \ careful when using `innerHTML` with dynamic content as it may expose your code\
    \ to security vulnerabilities such as script injection.\n\n#### How to add and\
    \ remove element classes?\n\nTo add or remove classes, you can use the element's\
    \ `classList` properties.\n\n- **Add a class:**\n```javascript\nelement.classList.add('newClass');\n\
    ```\n\n- **Remove a class:**\n```javascript\nelement.classList.remove('classExistent');\n\
    ```\n\n#### How to create and add new elements to the DOM?\n\nYou can create new\
    \ elements using `document.createElement()` and add them to the DOM with methods\
    \ like `appendChild()`.\n\n- **Create a new element:**\n```javascript\nlet newElement\
    \ = document.createElement('div');\n```\n\n- **Add to DOM:**\n```javascript\n\
    // Add as a child of another element\nouterElement.appendChild(newElement);\n\n\
    // Or add to the end of the document body\ndocument.body.appendChild(newElement);\n\
    ```\n\n#### How to remove elements from the DOM?\n\nTo remove an element, you\
    \ can use the `remove()` or `parentNode.removeChild()` method.\n\n- **Using `remove()`:**\n\
    ```javascript\nelementToRemove.remove();\n```\n\n- **Using `parentNode.removeChild()`:**\n\
    ```javascript\nlet parent = elementToRemove.parentNode;\nparent.removeChild(elementToRemove);\n\
    ```\n\nBoth methods get the job done, but `remove()` is simpler and more straightforward.\
    \ Choosing between them depends on the browser compatibility you need to support.\n\
    \n### 4. DOM Events\n\n#### What are events and how to use them in JavaScript?\n\
    \nEvents are actions or occurrences that happen in the browser, such as mouse\
    \ clicks, key presses, page loading, among others. JavaScript allows you to respond\
    \ to these events, making your web pages more interactive.\n\n**Using events:**\n\
    \n```javascript\n// Click event usage example\nelement.addEventListener('click',\
    \ function() {\n    // Code to be executed when the element is clicked \n});\n\
    ```\n\n#### How to add event handlers to DOM elements?\n\nYou can add event handlers\
    \ using the `addEventListener()` method."
  mdcn: "\n## 4. 表单事件（submit、change）\n\n当用户提交表单或更改表单字段的值时，会分别触发这些事件。它们对于实时验证输入数据或在表单提交时执行操作非常有用。\n\
    \n```javascript\nconst form = document.querySelector('#myForm');\n\nform.addEventListener('submit',\
    \ function(event) {\n    event.preventDefault(); // prevents default form submission\n\
    \    // code to be executed when the form is submitted\n});\n```\n\n查看实际代码：\n\n\
    ```html\n<form id=\"myForm\" action=\"#\">\n    <label for=\"name\">Name:</label><br>\n\
    \    <input type=\"text\" id=\"name\" name=\"name\" value=\"João\"><br>\n    <label\
    \ for=\"lastname\">Last name:</label><br>\n    <input type=\"lastname\" id=\"\
    lastname\" name=\"lastname\" value=\"Silva\"><br><br>\n    <input type=\"submit\"\
    \ value=\"Submit\">\n</form>\n\n<script>\n    const form = document.querySelector('#myForm');\n\
    \    form.addEventListener('submit', function(event) {\n        event.preventDefault();\
    \ // prevents default form submission\n        // code to be executed when the\
    \ form is submitted\n        alert('Form Submitted!');\n    });\n</script>\n```\n\
    \n以上只是 JavaScript 中最常见事件的几个示例。然而，可用的事件种类非常丰富，每个 HTML 元素都可以关联不同的事件。了解 JavaScript\
    \ 和 HTML 文档对于获取完整的事件列表及其使用方法至关重要。\n\n## 第10章：DOM 操作\n\n在 JavaScript 中，文档对象模型（DOM）是\
    \ HTML 页面的内存表示，其中每个 HTML 元素都是一个对象，可以通过脚本进行操作。\n\nDOM 操作是使用 JavaScript 在网页上创建动态交互的一项核心技能。\n\
    \n### 1. DOM 简介\n\n#### 什么是 DOM？为什么它很重要？\n\nDOM，即文档对象模型，是一个编程接口，它将 HTML 或 XML\
    \ 文档的结构表示为一棵对象树。文档中的每个元素、属性和文本都表示为树中的一个节点。DOM 允许程序员动态地操作文档的结构、样式和内容。\n\n#### 为什么它很重要？\n\
    \nDOM 是基础性的，因为它允许 Web 开发者创建交互式和动态的页面。\n\n通过使用 JavaScript 操作 DOM，你可以更新内容、更改样式、添加或移除元素、响应用户事件等等。\n\
    \n本质上，DOM 是一座桥梁，将 HTML/XML 页面内容与 JavaScript 代码连接起来，提供交互式和动态的用户体验。\n\n#### 如何在\
    \ JavaScript 中访问 DOM？\n\n要在 JavaScript 中访问 DOM，我们使用 `document` 变量，它表示当前的 HTML\
    \ 文档。以下是一些常见的访问 DOM 的方式：\n\n- **getElementById()：**\n```javascript\nlet element\
    \ = document.getElementById('elementId');\n```\n\n- **getElementsByClassName()：**\n\
    ```javascript\nlet elements = document.getElementsByClassName('className');\n\
    ```\n\n- **getElementsByTagName()：**\n```javascript\nlet elements = document.getElementsByTagName('tagName');\n\
    ```\n\n- **querySelector()：**\n```javascript\nlet element = document.querySelector('selector');\n\
    ```\n\n- **querySelectorAll()：**\n```javascript\nlet elements = document.querySelectorAll('selector');\n\
    ```\n\n- **直接操作：**\n\n我们也可以通过 DOM 直接操作元素。\n\n```javascript\nlet element = document.createElement('div');\n\
    element.textContent = 'New Element';\ndocument.body.appendChild(element);\n```\n\
    \n以上只是一些示例。具体选择哪种方法取决于你的需求和 HTML 的结构。\n\nDOM 提供了多种导航、选择和操作元素的方法，使网页能够实现丰富的动态交互。\n\
    \n### 2. 元素选择\n\n#### 如何通过标识符（ID）选择 DOM 元素？\n\n通过 ID 选择元素是很常见的做法，因为 ID 在 HTML\
    \ 页面中是唯一的。你可以使用 `getElementById()` 函数来实现：\n\n```javascript\nlet elementById =\
    \ document.getElementById('YourId');\n```\n\n这将返回具有指定 ID 的元素的引用。\n\n#### 如何通过类名、标签名和其他选择器选择\
    \ DOM 元素？\n\n有多种方式可以通过类名、标签名或其他选择器来选择元素，使用的方法包括 `getElementsByClassName()`、`getElementsByTagName()`、`querySelector()`\
    \ 和 `querySelectorAll()`。\n\n**使用类名**\n\n```javascript\n// Selecting by class\n\
    let elementsByClass = document.getElementsByClassName('YourClass');\n\n// Selecting\
    \ using querySelector for first occurrence\nlet firstElementByClass = document.querySelector('.yourClass');\n\
    \n// Selecting using querySelectorAll for all occurrences\nlet allElementsByClass\
    \ = document.querySelectorAll('.yourClass');\n```\n\n**使用标签名**\n\n```javascript\n\
    // Selecting by tag\nlet elementsByTag = document.getElementsByTagName('yourTag');\n\
    \n// Selecting using querySelector for the first occurrence\nlet firstElementByTag\
    \ = document.querySelector('yourTag');\n\n// Selecting using querySelectorAll\
    \ for all occurrences\nlet allElementsByTag = document.querySelectorAll('yourTag');\n\
    ```\n\n**使用其他选择器：**\n\n```javascript\n// Selection by selector\nlet elementBySelector\
    \ = document.querySelector('#yourId.yourClass yourTag');\n\n// Selecting using\
    \ querySelectorAll for all occurrences\nlet allElementsSelector = document.querySelectorAll('#yourId.yourClass\
    \ yourTag');\n```\n\n这些方法方便了根据不同的标准来选择元素，使你能够灵活且动态地操作 DOM，以响应 Web 应用中的特定事件或需求。\n\
    \n### 3. 元素操作\n\n#### 如何获取和更改元素属性？\n\n你可以使用 `getAttribute()` 和 `setAttribute()`\
    \ 属性来获取和更改元素的属性。\n\n- **获取属性：**\n```javascript\nlet valueOfAttribute = elemento.getAttribute('nameOfAttribute');\n\
    ```\n\n- **更改属性：**\n```javascript\nelemento.setAttribute('nameOfAttribute', 'newValue');\n\
    ```\n\n#### 如何更改元素的内容？\n\n你可以通过 `textContent` 或 `innerHTML` 属性来操作元素的内容。\n\n- **使用\
    \ `textContent`：**\n```javascript\nelement.textContent = 'New content';\n```\n\
    \n- **使用 `innerHTML`（注意安全问题）：**\n```javascript\nelement.innerHTML = '<strong>New</strong>\
    \ content';\n```\n\n在使用 `innerHTML` 处理动态内容时要小心，因为它可能会使你的代码暴露于脚本注入等安全漏洞。\n\n####\
    \ 如何添加和移除元素的类？\n\n要添加或移除类，你可以使用元素的 `classList` 属性。\n\n- **添加类：**\n```javascript\n\
    element.classList.add('newClass');\n```\n\n- **移除类：**\n```javascript\nelement.classList.remove('classExistent');\n\
    ```\n\n#### 如何创建新元素并添加到 DOM 中？\n\n你可以使用 `document.createElement()` 创建新元素，并使用 `appendChild()`\
    \ 等方法将它们添加到 DOM 中。\n\n- **创建新元素：**\n```javascript\nlet newElement = document.createElement('div');\n\
    ```\n\n- **添加到 DOM：**\n```javascript\n// Add as a child of another element\nouterElement.appendChild(newElement);\n\
    \n// Or add to the end of the document body\ndocument.body.appendChild(newElement);\n\
    ```\n\n#### 如何从 DOM 中移除元素？\n\n要移除元素，你可以使用 `remove()` 或 `parentNode.removeChild()`\
    \ 方法。\n\n- **使用 `remove()`：**\n```javascript\nelementToRemove.remove();\n```\n\
    \n- **使用 `parentNode.removeChild()`：**\n```javascript\nlet parent = elementToRemove.parentNode;\n\
    parent.removeChild(elementToRemove);\n```\n\n两种方法都能完成任务，但 `remove()` 更简洁直观。选择哪种方法取决于你需要支持的浏览器兼容性。\n\
    \n### 4. DOM 事件\n\n#### 什么是事件？如何在 JavaScript 中使用它们？\n\n事件是在浏览器中发生的动作或事件，例如鼠标点击、按键、页面加载等。JavaScript\
    \ 允许你响应这些事件，使你的网页更具交互性。\n\n**使用事件：**\n\n```javascript\n// Click event usage example\n\
    element.addEventListener('click', function() {\n    // Code to be executed when\
    \ the element is clicked \n});\n```\n\n#### 如何为 DOM 元素添加事件处理程序？\n\n你可以使用 `addEventListener()`\
    \ 方法来添加事件处理程序。\n"
