    # CHAPTER 12: AJAX AND HTTP REQUESTS


    In this chapter, we will explore the world of HTTP and AJAX requests in JavaScript.
    AJAX (Asynchronous JavaScript and XML) is a web development technique that allows
    you to update specific parts of a page without having to reload the entire page.
    This brings a more dynamic and fluid experience for users.


    # 1. HTTP Requests


    HTTP requests are used to send and receive data from web servers. There are different
    types of HTTP requests, such as GET, POST, PUT, DELETE, among others. It is important
    to understand the differences between them and when to use each.


    # 2. XMLHttpRequest


    The XMLHttpRequest object is used to make asynchronous HTTP requests in JavaScript.
    It allows you to send a request to a server, receive the response and update the
    specific part of the page with the data received. You can configure the XMLHttpRequest
    object with different properties, such as the request method, headers and parameters.


    # 3. Callbacks e Promises'
