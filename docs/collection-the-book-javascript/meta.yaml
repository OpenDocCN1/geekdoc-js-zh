    \  }\n};\nperson.present(); // \"Hi, my name is João and i have 25 years old.\"\
    \n```\n\nIn this example, we define a method called \"present\" that prints a\
    \ sentence using the properties of the \"person\" object.\n\nTo access the properties\
    \ within the method, we use the \"this\" keyword, which refers to the current\
    \ object.\n\nThese are some of the main information about objects in JavaScript.\
    \ I hope this helps you understand the basic concepts and use objects efficiently\
    \ in your programs.\n\n## CHAPTER 9: EVENTS IN JAVASCRIPT\n\nEvents play a fundamental\
    \ role in the interaction between users and elements of a web page.\n\nThey allow\
    \ you to create dynamic responses to specific user actions such as clicks, mouse\
    \ movements, typing, and more.\n\nThere are several types of events in JavaScript.\n\
    \nSome of the most common are:\n\n### 1. Click events\n\nThis event is triggered\
    \ when the user clicks on an element on the page, such as a button or an image.\
    \ To handle this event, you can use the `addEventListener` method and pass the\
    \ function that will be executed when the click occurs.\n\nSee:\n\n```html\nconst\
    \ button = document.querySelector('#myButton');\nbutton.addEventListener('click',\
    \ function() {\n  // code will run when clicked\n});\n```\n\nNow let's see an\
    \ example in an HTML page as it would look:\n\n```html\n<body>\n  <button id=\"\
    myButton\">My Button</button>\n  <script>\n    const button = document.querySelector('#myButton');\n\
    \    button.addEventListener('click', function() {\n      // code will run when\
    \ clicked\n      console.log(\"clicked\");\n    });\n  </script>\n</body>\n```\n\
    \nIn this case, we only have the button displayed and its id defined. In JavaScript,\
    \ we have the button function, which, if clicked, will display the message \"\
    clicked\" in the console.\n\nLet's play with the code a little and delve a little\
    \ deeper into the function.\n\nLook:\n\n```html\n<button id=\"myButton\">My Button</button>\n\
    \n<script>\n  let clicks = 0;\n\n  const button = document.querySelector('#myButton');\n\
    \n  button.addEventListener('click', function() {\n    clicks ++;\n\n    // code\
    \ will run when clicked\n\n    console.log(\"clicked \" + clicks + \" time(s)!\"\
    );\n  });\n\n</script>\n```\n\nIn this case we create a clicks variable that is\
    \ incremented with each click and displays the message of how many times the button\
    \ was clicked.\n\n### 2. Keyboard events (keydown, keyup, keypress)\n\nThese events\
    \ are triggered when a key is pressed, released, or held down on the keyboard.\
    \ You can use these events to create keyboard-based interactions, such as activating\
    \ a function when a certain key is pressed.\n\n```javascript\ndocument.addEventListener('keydown',\
    \ function(event) {\n  if (event.key === 'Enter') {\n    // code to be executed\
