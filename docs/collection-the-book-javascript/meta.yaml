    \ is true\n} else {\n  // code to be executed when none of the conditions is true\n\
    }\n```\n\n- SWITCH: The switch is used when we have several different options\
    \ to check in relation to a single variable. For example:\n\n```\nswitch (variable)\
    \ {\n  case value1:\n    // code to be executed when the variable is equal to\
    \ value1\n    break;\n  case value2:\n    // code to be executed when the variable\
    \ is equal to value2\n    break;\n  default:\n    // code to be executed when\
    \ the variable is not equal to value1 or value2\n}\n```\n\n### 2. Loops\n\n- FOR:\
    \ The for loop is used to execute a set of instructions repeatedly until a condition\
    \ is met. For example:\n\n```\nfor (initialization; condition; increment) {\n\
    \    // code to be executed repeatedly\n}\n```\n\nLet's see a practical example:\n\
    \n```\nvar x = 0;\nfor (x; x <= 10; x++) {\n    console.log(x); //Show on console\
    \ the actual of x\n}\n```\n\n- WHILE: The while loop is used to execute a set\
    \ of instructions repeatedly while a condition is true. For example:\n\n```\n\
    while (condition) {\n    // code to be executed repeatedly\n}\n```\n\nLet's see\
    \ a practical example:\n\n```\ny = 0;\nwhile (y <= 10) {\n    console.log(y);\n\
    \    y++;\n}\n```\n\n- DO-WHILE: The do while loop is similar to while, but the\
    \ condition is checked after executing the code block. This ensures that the code\
    \ block is executed at least once.\n\nFor example:\n\n```\ndo {\n    // code to\
    \ be executed repeatedly\n} while (condition);\n```\n\nAnother example:\n\n```\n\
    y = 10;\ndo {\n    console.log(y);\n    y--;\n} while (y >= 0);\n```\n\nYou can\
    \ see in this case that we did a decrement operation instead of an increment,\
    \ that is, we subtracted instead of adding.\n\nJust to give one more example,\
    \ the type of operation does not affect the conditions of the DO WHILE loop.\n\
    \nThese control flow structures are fundamental for writing more complex programs\
