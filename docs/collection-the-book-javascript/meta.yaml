    # CHAPTER 14: ECMASCRIPT 6


    EcmsScript 6, also known as ES6 or ES2015, the advanced features of JavaScript.
    ES6 is a new version of JavaScript that introduced several powerful improvements
    and features to the language.


    # 1. Constants (const) and variables (let)


    In ES6, you can declare variables using the "let" keyword and constants using
    "const".


    The difference between them is that constants cannot be reassigned, while variables
    can.


    # 2. Arrow function


    Arrow functions are a more compact way of writing functions in JavaScript. They
    provide a simplified syntax and make it easier to access the "this" value. For
    example:


    ```

    const sum = (a, b) => a + b;

    ```'
  - "[PAGE 84]\n\n# ## 3. Template literals\n\nTemplate literals allow you to create\
    \ strings that can include inline expressions.\n\nYou can use back quotes (\\\
    `) to surround the string and use \\`${}\\` to insert an expression inside it.\
    \ For example:\n\n```\nconst name = \"João\";\nconsole.log(`Hello, ${name}!`);\
    \ // Output: Hello, João!\n```\n\n# ## 4. Destructuring\n\nDestructuring allows\
    \ you to extract values from an array or object into individual variables. This\
    \ can be useful when you are working with complex data. For example:\n\n```\n\
    const [a, b] = [1, 2];\nconsole.log(a, b); // Output: 1 2\nconst { name, age }\
    \ = { name: \"Maria\", age: 30 };\nconsole.log(name, age); // Output: Maria 30\n\
    ```\n\n# ## 5. Rest parameters e spread operator\n\nRest parameters allow you\
    \ to pass a variable number of arguments to a function. The spread operator allows\
    \ you to spread the elements of one array or object into another array or object.\
    \ For example:\n\n```\nfunction sum(...numbers) {\n    return numeros.reduce((total,\
    \ num) => total + num, 0);\n```"
