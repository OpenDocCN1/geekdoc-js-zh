    \ 构造函数的例子：\n\n```javascript\nlet car = new Object();\ncar.brand = \"Ford\";\n\
    car.model = \"Mustang\";\ncar.year = 2020;\n```\n\n在这个例子中，我们使用 \"Object\" 构造函数创建了一个名为\
    \ \"car\" 的对象。然后我们使用点语法向对象添加属性。\n\n此外，还可以在对象上创建方法，这些方法是与对象属性关联的函数。方法允许你执行一些与对象相关的代码。\n\
    \n看一个例子：\n\n```javascript\nlet person = {\n  name: \"João\",\n  age: 25,\n  profession:\
    \ \"Developer\",\n  present: function() {\n    console.log(\"Hi, my name is \"\
    \ + this.name + \" and i have \" + this.age + \" years old.\");\n  }\n};\nperson.present();\
    \ // \"Hi, my name is João and i have 25 years old.\"\n```\n\n在这个例子中，我们定义了一个名为\
    \ \"present\" 的方法，它使用 \"person\" 对象的属性打印一个句子。\n\n要在方法中访问属性，我们使用 \"this\" 关键字，它指的是当前对象。\n\
    \n这些是关于JavaScript中对象的一些主要信息。希望这能帮助你理解基本概念并在你的程序中有效地使用对象。\n\n## 第9章：JavaScript中的事件\n\
    \n事件在用户与网页元素之间的交互中扮演着基础性的角色。\n\n它们允许你为特定的用户操作创建动态响应，例如点击、鼠标移动、打字等等。\n\nJavaScript中有几种类型的事件。\n\
    \n一些最常见的有：\n\n### 1. 点击事件\n\n当用户点击页面上的元素（如按钮或图像）时，此事件被触发。要处理此事件，你可以使用 `addEventListener`\
    \ 方法并传递在点击发生时将执行的函数。\n\n看：\n\n```html\nconst button = document.querySelector('#myButton');\n\
    button.addEventListener('click', function() {\n  // 点击时将运行的代码\n});\n```\n\n现在让我们看看一个HTML页面中的例子会是什么样子：\n\
    \n```html\n<body>\n  <button id=\"myButton\">My Button</button>\n  <script>\n\
    \    const button = document.querySelector('#myButton');\n    button.addEventListener('click',\
    \ function() {\n      // 点击时将运行的代码\n      console.log(\"clicked\");\n    });\n\
    \  </script>\n</body>\n```\n\n在这种情况下，我们只有按钮被显示出来，并且定义了它的id。在JavaScript中，我们有按钮函数，如果被点击，将在控制台中显示消息\
    \ \"clicked\"。\n\n让我们稍微玩一下代码，更深入地了解一下函数。\n\n看：\n\n```html\n<button id=\"myButton\"\
    >My Button</button>\n\n<script>\n  let clicks = 0;\n\n  const button = document.querySelector('#myButton');\n\
    \n  button.addEventListener('click', function() {\n    clicks ++;\n\n    // 点击时将运行的代码\n\
    \n    console.log(\"clicked \" + clicks + \" time(s)!\");\n  });\n\n</script>\n\
    ```\n\n在这种情况下，我们创建了一个 `clicks` 变量，它在每次点击时递增，并显示消息说明按钮被点击了多少次。\n\n### 2. 键盘事件（keydown,\
    \ keyup, keypress）\n\n当键盘上的键被按下、释放或按住时，这些事件被触发。你可以使用这些事件来创建基于键盘的交互，例如在按下某个特定键时激活一个函数。\n\
    \n```javascript\ndocument.addEventListener('keydown', function(event) {\n  if\
    \ (event.key === 'Enter') {\n    // 当按Enter键时要执行的代码\n  }\n});\n```\n\n看一个实际的例子：\n\
    \n```javascript\ndocument.addEventListener('keydown', function(event) {\n  if\
