    \ 中的控制流结构\n\n控制和流程结构用于控制代码执行的顺序。在本章中，我们将讨论三种主要的控制结构：条件语句（if, else if, else）、循环（for,\
    \ while, do while）和开关语句。\n\n### 1. 条件语句\n\nIF：if 结构用于在条件为真时执行一段代码。例如：\n\n```\n\
    if (condition) {\n  // 条件为真时要执行的代码\n}\n```\n\n-   ELSE IF：你可以使用 else if 来检查多个链式条件。例如：\n\
    \n```\nif (condition1) {\n  // 条件1为真时要执行的代码\n} else if (condition2) {\n  // 条件2为真时要执行的代码\n\
    } else {\n  // 所有条件都不为真时要执行的代码\n}\n```\n\n-   SWITCH：当我们有多个不同的选项需要根据单个变量进行检查时使用\
    \ switch。例如：\n\n```\nswitch (variable) {\n  case value1:\n    // 当变量等于 value1\
    \ 时要执行的代码\n    break;\n  case value2:\n    // 当变量等于 value2 时要执行的代码\n    break;\n\
    \  default:\n    // 当变量不等于 value1 或 value2 时要执行的代码\n}\n```\n\n### 2. 循环\n\n- \
    \  FOR：for 循环用于重复执行一组指令，直到满足某个条件。例如：\n\n```\nfor (initialization; condition; increment)\
    \ {\n    // 要重复执行的代码\n}\n```\n\n让我们看一个实际的例子：\n\n```\nvar x = 0;\nfor (x; x <=\
    \ 10; x++) {\n    console.log(x); // 在控制台显示 x 的当前值\n}\n```\n\n-   WHILE：while\
    \ 循环用于在条件为真时重复执行一组指令。例如：\n\n```\nwhile (condition) {\n    // 要重复执行的代码\n}\n```\n\
    \n让我们看一个实际的例子：\n\n```\ny = 0;\nwhile (y <= 10) {\n    console.log(y);\n    y++;\n\
    }\n```\n\n-   DO-WHILE：do while 循环类似于 while，但条件是在执行代码块之后检查的。这确保了代码块至少执行一次。\n\n\
