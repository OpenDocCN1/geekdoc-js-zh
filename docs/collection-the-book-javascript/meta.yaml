    ```html\n<button id=\"myButton\">Click Here</button>\n```\n\n**JavaScript**\n\
    ```html\n<script>\n    let button = document.getElementById(\"myButton\");\n \
    \   button.addEventListener(\"click\", function() {\n        alert(\"The button\
    \ was clicked!\");\n    });\n</script>\n```\n\nIn this case, the `addEventListener()`\
    \ function is used to add an event listener to the button element. When the button\
    \ is clicked, the message will be displayed using `alert()`.\n\nAdditionally,\
    \ there are many other events available such as `mouseover`, `mouseout`, `keydown`,\
    \ etc. You can research more about these events and how to use them according\
    \ to your needs.\n\n## CHAPTER 12: AJAX AND HTTP REQUESTS\n\nIn this chapter,\
    \ we will explore the world of HTTP and AJAX requests in JavaScript. AJAX (Asynchronous\
    \ JavaScript and XML) is a web development technique that allows you to update\
    \ specific parts of a page without having to reload the entire page. This brings\
    \ a more dynamic and fluid experience for users.\n\n### 1. HTTP Requests\n\nHTTP\
    \ requests are used to send and receive data from web servers. There are different\
    \ types of HTTP requests, such as GET, POST, PUT, DELETE, among others. It is\
    \ important to understand the differences between them and when to use each.\n\
    \n### 2. XMLHttpRequest\n\nThe XMLHttpRequest object is used to make asynchronous\
    \ HTTP requests in JavaScript. It allows you to send a request to a server, receive\
    \ the response and update the specific part of the page with the data received.\
    \ You can configure the XMLHttpRequest object with different properties, such\
    \ as the request method, headers and parameters.\n\n### 3. Callbacks and Promises\n\
    \nHTTP requests are asynchronous, which means that the code does not wait for\
    \ a response to continue executing.\n\nIt is common to use callbacks or promises\
    \ to handle the result of the request. Callbacks are functions passed as arguments\
    \ and executed when the request is completed. Promises are a more modern approach\
    \ and allow you to write more readable and modular code.\n\n### 4. Error handling\n\
    \nWhen making HTTP requests, it is important to deal with possible errors and\
    \ failures in communication with the server. You can use try-catch blocks or the\
    \ onerror method of the XMLHttpRequest object to handle exceptions and display\
    \ appropriate error messages to users.\n\n### 5. APIs REST\n\nREST (Representational\
    \ State Transfer) APIs are a common way of providing access to data and functionality\
    \ on a server through HTTP requests. They follow specific communication and data\
    \ structuring principles. It is important to understand how to communicate and\
    \ consume REST APIs using AJAX and HTTP requests in JavaScript.\n\n**Extra tip:**\n\
    \nIn addition to XMLHttpRequest, there are modern libraries that make it easier\
