    \ and define its background as black and the font color as white in the style.\
    \ This was done purely to better visualize the div's boundaries.\n\nWe define\
    \ that when we go over the div, an alert appears with the message."
  mdcn: "\n## 第8章：JavaScript中的对象\n\n对象是该语言中最重要的数据结构之一，因为它们允许你以有组织的方式存储和访问信息。\n\nJavaScript中的对象是属性的集合，这些属性由键值对组成。键是标识属性的字符串，值可以是任何数据类型，例如数字、字符串、布尔值、函数，甚至其他对象。\n\
    \n在JavaScript中有两种创建对象的方式：字面量表示法和构造函数。让我们从字面量表示法开始，这是最常见也是最简单的创建对象的方式。\n\n要使用字面量表示法创建对象，你需要使用花括号\
