    console.log(person.name); // \"João\"\nperson.age = 26;\nconsole.log(person.age);\
    \ // 26\n```\n\nYou can also add properties to an object after you create it.\
    \ Just use the dot syntax, as we did above, to define a new property and its value.\n\
    \n```javascript\nperson.city = 'Belo Horizonte'; //Add a city to person\n```\n\
    \nLet's see a complete example of what it would look like:\n\n```javascript\n\
    let person = {\n    name: \"João\",\n    age: 25,\n    profession: \"Developer\"\
    \n};\nconsole.log(person.name); // \"João\"\nperson.age = 26;\nconsole.log(person.age);\
    \ // 26\nperson.city = 'Belo Horizonte'; //Add a city\nconsole.log(person.city);//\
    \ Show the city of person\n```\n\nAdditionally, you can access the properties\
