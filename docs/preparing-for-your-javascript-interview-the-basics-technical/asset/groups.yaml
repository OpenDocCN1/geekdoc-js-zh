- md: "\n## Question: What is the use of typeof operator?\n\n'typeof' is an operator\
    \ which is used to return a string description of the type of a variable.\n\n\
    | Type | Result |\n| --- | --- |\n| Undefined | 'undefined' |\n| Null | 'object'\
    \ (see below) |\n| Boolean | 'boolean' |\n| Number | 'number' |\n| String | 'string'\
    \ |\n| Symbol (new in ECMAScript 2015) | 'symbol' |\n| Host object (provided by\
    \ the JS environment) | Implementation-dependent |\n| Function object (implements\
    \ [[Call]] in ECMA-262 terms) | 'function' |\n| Any other object | 'object' |\n\
    \n## Question: Which keywords are used to handle exceptions?\n\nThe try/catch/finally\
    \ statement handles some or all of the errors that may occur in a block of code,\
    \ while still running code.\n\nThe try statement allows you to define a block\
    \ of code to be tested for errors while it is being executed.\n\nThe catch statement\
    \ allows you to define a block of code to be executed, if an error occurs in the\
    \ try block.\n\nThe finally statement lets you execute code, after try and catch,\
    \ regardless of the result.\n\n```javascript\ntry {\n  // try to run this code\n\
    }\ncatch(err) {\n  // catch errors here\n}\nfinally {\n  // run this code regardless\
    \ of what happens\n}\n```\n\n## Question: How generic objects can be created?\n\
    \nA generic object is essentially an empty blueprint for an object. You can define\
    \ it anywhere in your Javascript code. An example is below:\n\n```javascript\n\
    function Employee(first, last, ssn, salary) {\n  this.firstName = first;\n  this.lastName\
    \ = last;\n  this.social = ssn;\n  this.pay = salary;\n}\n```\n\nThis creates\
    \ a generic blueprint for an object known as Employee. To get an instance of Employee,\
    \ you would call:\n\n```javascript\nvar john = new Employee(\"John\", \"Smith\"\
    , \"050529994\", 72534);\n```\n\n## Question: What is the use of Push method in\
    \ JavaScript?\n\nThe push method is used to add or append one or more elements\
    \ to the end of an Array. Using this method, we can append multiple elements by\
    \ passing multiple arguments.\n\n## Question: What is the shift() method in JavaScript?\n\
    \nThe shift() method is like push(), except it acts on the beginning of the array.\n\
    This method is used to prepend one or more elements to the beginning of the array.\n\
    \n## Question: Explain the pop() method in JavaScript?\n\nThe pop() method is\
    \ similar as the shift() method except that it acts on the last element of the\
    \ array. Calling pop() on an array will return the last element.\n\n## Question:\
    \ What are the different types of errors in JavaScript?\n\nAs of ECMAScript 2016,\
    \ there are seven other core error constructors in JavaScript (in addition to\
    \ the generic Error object):\n\n### EvalError\n\nAn error that occurs during the\
    \ global function eval().\n\n### InternalError\n\nAn error that occurs when an\
    \ internal error in the JavaScript engine is thrown, for example, \"too much recursion\"\
    .\n\n### RangeError\n\nAn error that occurs when a numeric variable or parameter\
    \ is outside of valid range.\n\n### ReferenceError\n\nAn error that occurs when\
    \ de-referencing an invalid reference.\n\n### SyntaxError\n\nA syntax error that\
    \ occurs while parsing code in eval().\n\n### TypeError\n\nAn error that occurs\
    \ when a variable or parameter is not of a valid type.\n\n### URIError\n\nAn error\
    \ that occurs when encodeURI() or decodeURI() are given invalid parameters.\n\n\
    ## Question: What are JavaScript Cookies?\n\nCookies are the small text files\
    \ stored in the computer. Cookies are created when the user visits the websites\
    \ and are used to store user information that the website might need, such as\
    \ shopping cart details.\n\nJavaScript can create, read, and delete cookies with\
    \ the **document.cookie** property.\n\n## Question: What is the ‘Strict’ mode\
    \ in JavaScript and how can it be enabled?\n\nAnswer:\nECMAScript 5's strict mode\
    \ is a way to opt in to a restricted variant of JavaScript. Strict mode is intentionally\
    \ different from normal JavaScript code.\n\nStrict mode makes several changes\
    \ to normal JavaScript semantics. First, strict mode forces some JavaScript silent\
    \ errors by changing them to throw errors. Second, strict mode enables JavaScript\
    \ engines to perform certain optimizations that were previously not possible.\
    \ Third, strict mode prohibits syntax likely to be defined in future versions\
    \ of ECMAScript.\n\n## Question: Explain closures in JavaScript? When are they\
    \ used?\n\nA closure is an inner function that has access to the enclosing function's\
    \ variables. The closure has access to its own scope (variables defined between\
    \ its curly brackets), access to the outer function's variables, and also it has\
    \ access to the global variables.\n\nYou create a closure by adding a function\
    \ inside another function. The inner function has access to both the outer functions\
    \ variables and parameters.\n\n```javascript\nfunction sayHi(firstName, lastName)\
    \ {\n  var greeting = \"Hello \";\n\n  // inner function has access to outer\n\
    \  // function's parameters and variables!\n\n  function name() {\n    return\
    \ greeting + firstName + \" \" + lastName;\n  }\n\n  return name();\n}\n```\n\n\
    ## Question: How are object properties assigned?\n\nProperties are the values\
    \ associated with a JavaScript object.\n\nAssuming an object already exists, you\
    \ can simply add a new property like so:\nmyObject.myProperty = 'Property Value';\n\
    \n## Question: How can a value be appended to an array?\n\nThis is a subtly tricky\
    \ question because there is the basic answer and a better, more complete answer.\n\
    \nAt first glance\n\nBut for a better answer, don't forget all of the array methods\
    \ that are available!\n\n- 1. Using push() to add to the end of an array\n- 2.\
    \ Using unshift() to add to the beginning of an array\n- 3. Using splice() to\
    \ add elements within an array\n- 4. Using concat() to combine and create new,\
    \ longer arrays\n\n## Question: Explain the for-in loop?\n\nThe for-in loop is\
    \ used to loop through the properties of an object. The loop is continued till\
    \ all the properties of the object are depleted.\n\n```javascript\nvar item;\n\
    for (item in myObject) {\n  // do something\n}\n```\n\n## Question: Describe the\
    \ properties of an anonymous function in JavaScript?\n\nA function that is declared\
    \ without a name is known as an anonymous function.\n\nFunctions stored in variables\
    \ do not need function names. They are instead called using the variable name.\n\
    \n## Question: What logical operators can be used in JavaScript?\n\nThe “and”,\
    \ “or” and “not” operators can be used in JavaScript.\n\nFor example, given x=2\
    \ and y=6\n\n| Operator | Name | Example |\n| --- | --- | --- |\n| && | and |\
    \ (x < 3 && y > 1) is true |\n| || | or | (x == 5 || y == 5) is false |\n| ! |\
    \ not | !(x == y) is true |\n\n## JavaScript and UI Elements\n\nThese JavaScript\
    \ questions focus on elements of the web and user interface.\n\n## Question: How\
    \ can the class of an element be changed?\n\nUsing vanilla JavaScript:\n\n```javascript\n\
    document.getElementById(\"MyElement\").classList.add('MyClass');\n```\n\n```javascript\n\
    document.getElementById(\"MyElement\").classList.remove('MyClass');\n```\n\n##\
    \ Question: How can the style of an element be changed?\n\nUsing vanilla JavaScript:\n\
    \n```javascript\ndocument.getElementById(\"p2\").style.color = 'blue';\n```\n\n\
    ## Question: Explain how can you submit a form using vanilla JavaScript?\n\nTo\
    \ submit a form using JavaScript use:\n\n```javascript\ndocument.form[0].submit();\n\
    ```\n\n## Question: What is the disadvantage of using innerHTML in JavaScript?\n\
    \nImproper handling of the innerHTML property can enable script-injection attacks\
    \ on Internet Explorer when the HTML string contains a script marked as deferred:\n\
    <script defer>...</script>\n\nSetting innerHTML will destroy existing HTML elements\
    \ that have event handlers attached to them, potentially creating a memory leak\
    \ on some browsers.\n\nYou can't set the innerHTML property on all HTML elements\
    \ on all browsers (for instance, Internet Explorer won't let you set the innerHTML\
    \ property of a table row).\n\nFinally, innerHTML content is refreshed every time\
    \ and thus is slower.\n\n## Question: What are all the types of Pop up boxes available\
    \ in JavaScript?\n\nJavaScript has three kind of popup boxes: Alert box, Confirm\
    \ box, and Prompt box.\n\n### Alert Box\n\nAn alert box is often used if you want\
    \ to make sure information comes through the user.\nWhen an alert box pops up,\
    \ the user will have to click \"OK\" to proceed.\n\n### Confirm Box\n\nA confirm\
    \ box is often used if you want the user to verify or accept something.\nWhen\
    \ a confirm box pops up, the user will have to click either \"OK\" or \"Cancel\"\
    \ to proceed.\n\n### Prompt Box\n\nA prompt box is often used if you want the\
    \ user to input a value before entering a page.\n\nWhen a prompt box pops up,\
    \ the user will have to click either \"OK\" or \"Cancel\" to proceed after entering\
    \ an input value.\n"
  mdcn: "\n\n## 问题：typeof 运算符的用途是什么？\n\n'typeof' 是一个运算符，用于返回变量类型的字符串描述。\n\n| 类型 |\
    \ 结果 |\n| --- | --- |\n| Undefined | 'undefined' |\n| Null | 'object'（见下文） |\n\
    | Boolean | 'boolean' |\n| Number | 'number' |\n| String | 'string' |\n| Symbol\
    \ (ECMAScript 2015 新增) | 'symbol' |\n| 主机对象（JS 环境提供） | 取决于实现 |\n| 函数对象（在 ECMA-262\
    \ 术语中实现 [[Call]]） | 'function' |\n| 其他任何对象 | 'object' |\n\n## 问题：哪些关键字用于处理异常？\n\
    \ntry/catch/finally 语句用于处理代码块中可能发生的部分或全部错误，同时继续执行代码。\n\n`try` 语句允许你定义一个代码块，在执行时对其进行错误测试。\n\
    \n`catch` 语句允许你在 `try` 块发生错误时，定义一个要执行的代码块。\n\n`finally` 语句让你无论结果如何，在 `try` 和 `catch`\
    \ 之后执行代码。\n\n```javascript\ntry {\n  // 尝试运行这段代码\n}\ncatch(err) {\n  // 在此处捕获错误\n\
    }\nfinally {\n  // 无论发生什么都运行这段代码\n}\n```\n\n## 问题：如何创建通用对象？\n\n通用对象本质上是对象的空蓝图。你可以在\
    \ JavaScript 代码的任何地方定义它。下例所示：\n\n```javascript\nfunction Employee(first, last,\
    \ ssn, salary) {\n  this.firstName = first;\n  this.lastName = last;\n  this.social\
    \ = ssn;\n  this.pay = salary;\n}\n```\n\n这创建了一个名为 Employee 的对象的通用蓝图。要获取 Employee\
    \ 的实例，你需要调用：\n\n```javascript\nvar john = new Employee(\"John\", \"Smith\", \"\
    050529994\", 72534);\n```\n\n## 问题：JavaScript 中 Push 方法的用途是什么？\n\n`push` 方法用于向数组的末尾添加或追加一个或多个元素。使用此方法，我们可以通过传递多个参数来追加多个元素。\n\
    \n## 问题：JavaScript 中的 shift() 方法是什么？\n\n`shift()` 方法类似于 `push()`，但它作用于数组的开头。\n\
    该方法用于在数组的开头前添加一个或多个元素。\n\n## 问题：解释 JavaScript 中的 pop() 方法？\n\n`pop()` 方法与 `shift()`\
    \ 方法相似，不同之处在于它作用于数组的最后一个元素。在数组上调用 `pop()` 将返回最后一个元素。\n\n## 问题：JavaScript 中有哪些类型的错误？\n\
    \n从 ECMAScript 2016 开始，JavaScript 中除了通用的 `Error` 对象外，还有七种核心错误构造函数：\n\n### EvalError\n\
    \n在执行全局函数 `eval()` 期间发生的错误。\n\n### InternalError\n\n当 JavaScript 引擎抛出内部错误时发生的错误，例如“递归过多”。\n\
    \n### RangeError\n\n当数值变量或参数超出有效范围时发生的错误。\n\n### ReferenceError\n\n当对无效引用进行解引用时发生的错误。\n\
    \n### SyntaxError\n\n在 `eval()` 中解析代码时发生的语法错误。\n\n### TypeError\n\n当变量或参数不是有效类型时发生的错误。\n\
    \n### URIError\n\n当 `encodeURI()` 或 `decodeURI()` 接收到无效参数时发生的错误。\n\n## 问题：什么是\
    \ JavaScript Cookies？\n\nCookies 是存储在计算机中的小型文本文件。Cookies 在用户访问网站时创建，并用于存储网站可能需要的用户信息，例如购物车详情。\n\
    \nJavaScript 可以通过 **document.cookie** 属性创建、读取和删除 cookie。\n\n## 问题：JavaScript 中的“严格（Strict）”模式是什么？如何启用？\n\
    \n答案：\nECMAScript 5 的严格模式是一种选择使用受限 JavaScript 变体的方法。严格模式刻意与普通的 JavaScript 代码有所不同。\n\
    \n严格模式对普通的 JavaScript 语义进行了几处更改。首先，严格模式通过将某些 JavaScript 静默错误改为强制抛出错误。其次，严格模式允许\
    \ JavaScript 引擎执行以前无法实现的某些优化。第三，严格模式禁止了在未来 ECMAScript 版本中可能定义的语法。\n\n## 问题：解释\
    \ JavaScript 中的闭包（closures）？它们何时使用？\n\n闭包是一个内部函数，它可以访问外层函数的变量。闭包不仅可以访问自己的作用域（定义在大括号之间的变量），可以访问外层函数的变量，还可以访问全局变量。\n\
    \n你通过在另一个函数内部添加一个函数来创建闭包。内部函数可以访问外部函数的变量和参数。\n\n```javascript\nfunction sayHi(firstName,\
    \ lastName) {\n  var greeting = \"Hello \";\n\n  // 内部函数可以访问外部\n  // 函数的参数和变量！\n\
    \n  function name() {\n    return greeting + firstName + \" \" + lastName;\n \
    \ }\n\n  return name();\n}\n```\n\n## 问题：对象属性是如何赋值的？\n\n属性是与 JavaScript 对象关联的值。\n\
    \n假设一个对象已经存在，你可以像这样直接添加新属性：\nmyObject.myProperty = 'Property Value';\n\n## 问题：如何向数组追加一个值？\n\
    \n这是一个微妙且棘手的问题，因为它既有一个基础答案，也有一个更好、更完整的答案。\n\n乍看之下\n\n但为了得到更好的答案，不要忘记所有可用的数组方法！\n\
    \n- 1. 使用 `push()`\n- 2. 使用 `unshift()` 在数组开头添加\n- 3. 使用 `splice()` 在数组中插入\n-\
    \ 4. 使用 `concat()` 合并\n\n## 问题：解释 for-in 循环？\n\n`for-in` 循环用于遍历对象的属性。它会在属性耗尽之前继续。\n\
    \n```javascript\nvar item;\nfor (item in myObject) {\n  // 执行操作\n}\n```\n\n##\
    \ 问题：描述 JavaScript 中的匿名函数（anonymous function）？\n\n没有命名的函数被称为匿名函数。\n\n存储在变量中的函数不需要使用函数名。\n\
    \n## 问题：JavaScript 中可以使用哪些逻辑运算符？\n\n“与”、“或”和“非”运算符可以在 JavaScript 中使用。\n\n例如，给定\
    \ x=2 和 y=6\n\n| 运算符 | 名称 | 示例 |\n| --- | --- | --- |\n| && | 与 | (x < 3 && y\
    \ > 1) 为真 |\n| || | 或 | (x == 5 || y == 5) 为假 |\n| ! | 非 | !(x == y) 为真 |\n\n\
    ## JavaScript 和元素\n\n这些 JavaScript 问题专注于元素。\n\n## 问题：如何更改元素的类（class）？\n\n使用原生\
    \ JavaScript：\n\n```javascript\ndocument.getElementById(\"MyElement\").classList.add('MyClass');\n\
    ```\n\n```javascript\ndocument.getElementById(\"MyElement\").classList.remove('MyClass');\n\
    ```\n\n## 问题：如何更改元素的样式（style）？\n\n使用原生 JavaScript：\n\n```javascript\ndocument.getElementById(\"\
    p2\").style.color = 'blue';\n```\n\n## 问题：解释如何使用 JavaScript 提交表单？\n\n使用 JavaScript\
    \ 提交表单：\n\n```javascript\ndocument.form[0].submit();\n```\n\n## 问题：在 JavaScript\
    \ 中使用 innerHTML 的缺点是什么？\n\n不当处理处理 `innerHTML` 属性可能会在包含标记为延迟执行的脚本时允许脚本注入：\n<script\
    \ defer>...</script>\n\n设置 `innerHTML` 会破坏绑定了事件处理程序的现有 HTML 元素，在某些浏览器中可能会内存泄漏。\n\
    \n你无法在所有浏览器的所有 HTML 元素上设置 `innerHTML` 属性（例如，Internet Explorer 不允许设置表格行的 `innerHTML`）。\n\
    \n最后，innerHTML 内容每次都会刷新，因此速度较慢。\n\n## 问题：JavaScript 中可用的所有弹出框（Pop up boxes）类型有哪些？\n\
    \nJavaScript 有三种弹出框：警告框（Alert）、确认框（Confirm）和提示框（Prompt）。\n\n### 警告框（Alert）\n\n\
    警告框通常用于确保信息传递给用户。\n当警告框弹出时，用户必须点击“确定”才能继续。\n\n### 确认框（Confirm）\n\n确认框通常用于让用户验证或接受某些内容。\n\
    当确认框弹出时，用户必须点击“确定”或“取消”才能继续。\n\n### 提示框（Prompt）\n\n提示框通常用于让用户在进入页面之前输入值。\n\n当提示框弹出时，用户在输入值后必须点击“确定”或“取消”才能继续。\n\
    \n"
