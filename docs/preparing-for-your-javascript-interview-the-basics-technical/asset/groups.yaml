- md: "\n## Preparing for Your JavaScript Interview\nThe Basics: Technical Questions\
    \ and Answers\nBy K.T. Lindemann\n\n## Introduction\n\nToday, you cannot be a\
    \ web developer and not know JavaScript. What started out as a small client-side\
    \ scripting language has evolved into countless frameworks and libraries that\
    \ are part of every user's web experience. All modern web browsers implement the\
    \ JavaScript language, thus making it the only one deployed on all personal computers\
    \ and mobile devices around the world.\n\nAs it evolved, JavaScript has embraced\
    \ advanced features as prototypal inheritance, modules, namespaces, anonymous\
    \ (lambda) functions, promises, and even metaprogramming. Thanks to frameworks\
    \ like Node.js, you can even use it server-side now.\n\nJavaScript's growth presents\
    \ a challenge for new developers. On the one hand, the barrier to entry is low\
    \ – anyone can open a developer tools window in the web browser and begin to write\
    \ JavaScript. On the other hand, the level of complexity grows exponentially as\
    \ you begin to explore the functionality available in the vast JavaScript ecosystem.\n\
    \nIt's's now common for technical phone screens to include JavaScript questions.\
    \ As a candidate, where should you begin to study?\n\nWhile other books tend to\
    \ focus on the coding part of technical interviews, this book aims to run through\
    \ some common, foundational JavaScript interview questions that candidates may\
    \ be asked to explain or describe out loud. Focusing on vanilla JavaScript, this\
    \ book covers the basics of JavaScript data structures, error handling, UI manipulation,\
    \ and more! Being able to answer these questions concisely and confidently will\
    \ go a long towards making you a better candidate.\n\nGood luck!\n\n## Table of\
    \ Contents\n\n- INTRODUCTION\n- GENERAL PRACTICE\n- JAVASCRIPT AND UI ELEMENTS\n\
    - COMPARE AND CONTRAST\n- BONUS QUESTIONS\n\n## General Practice\n\nThis section\
    \ focuses on the basics of vanilla JavaScript.\n\n## Question: What is JavaScript?\n\
    \nJavaScript, often abbreviated as \"JS\", is a high-level, dynamic, untyped,\
    \ interpreted run-time language.\n\nJavaScript is a client-side as well as server-side\
    \ scripting language that can be inserted into HTML pages and is understood by\
    \ web browsers. JavaScript can also be an Object Oriented Programming language.\n\
    \n## Question: What are the two basic groups of datatypes in JavaScript?\n\n-\
    \ Primitive types: string, number, boolean, null, undefined\n- Complex types:\
    \ object (including functions)\n\n## Question: What are the JavaScript types?\n\
    \nThere are just **six** types in JavaScript: Object, Number, String, Boolean,\
    \ Null, and Undefined.\n\nObjects include arrays, functions, and ordinary objects.\n\
    \nNumbers may be integers or floating point or the special values NaN and Infinity.\n\
    \nStrings include the empty string.\n\n## Question: Which company developed JavaScript?\n\
    \nNetscape is the software company who developed JavaScript.\n\n## Question: What\
    \ are undeclared and undefined variables?\n\nUndeclared variables are those that\
    \ do not exist in a program and are not declared. If the program tries to read\
    \ the value of an undeclared variable, then a runtime error is encountered.\n\n\
    Undefined variables are those that are declared in the program but have not been\
    \ given any value. If the program tries to read the value of an undefined variable,\
    \ an undefined value is returned.\n\n## Question: What are global variables?\n\
    \nGlobal variables are those that are available throughout the length of the code,\
    \ that is, these have no scope. The `var` keyword is used to declare a local variable\
    \ or object. If the `var` keyword is omitted, a global variable is declared.\n\
    \nThe problems that are faced by using global variables are the clash of variable\
    \ names of local and global scope. Also, it is difficult to debug and test the\
    \ code that relies on global variables.\n\n## Question: What is ‘this’ keyword\
    \ in JavaScript?\n\n‘This’ keyword refers to the object from where it was called.\n\
    \n## Question: What is the use of NaN function?\n\n`isNaN` function returns true\
    \ if the argument is not a number otherwise it is false.\n\n## Question: What\
    \ is negative infinity?\n\nNegative Infinity is a number in JavaScript which can\
    \ be derived by dividing negative number by zero.\n\n## Question: Which symbol\
    \ is used for comments in Javascript?\n\n```javascript\n// for Single line comments\n\
    \n/* MultiLine\nComment */\n```\n\n## Question: What is the === operator?\n\n\
    `===` is called as strict equality operator which returns true when the two operands\
    \ are having the same value without any type conversion.\n\n## Question: What\
    \ is called typing in JavaScript?\n\nVariable typing is used to assign a number\
    \ to a string.\n\n## Question: Does JavaScript support automatic conversion?\n\
    \nYes, JavaScript does support automatic conversion. JavaScript is a \"loosely\
    \ typed\" language, which means that whenever an operator or statement is expecting\
    \ a particular type, JavaScript will convert the data.\n\nFor example, automatic\
    \ conversion is often used for checking the existence of DOM elements:\n\n```javascript\n\
    var element = document.getElementById(\"whatever\");\nif(element) {\n  //the element\
    \ exists\n} else {\n  //the element doesn't exist\n}\n```\n\n## Question: What\
    \ does NULL mean in JavaScript?\n\nThe NULL value is used to represent no value\
    \ or no object. In APIs, null is often retrieved where an object is expected.\n\
    \n## Question: What is undefined value in JavaScript?\n\n**Undefined** is one\
    \ of JavaScript's primitive types. A variable that has not been assigned a value\
    \ is type undefined. A method statement can also be undefined if it tries to use.\
    \ Finally, a function returns undefined if a value was not returned.\n\n## Question:\
    \ What are all the looping structures in JavaScript?\n\nAnswer: In JavaScript\
    \ we have the following looping statements:\n\n| | Description |\n| :--- | :---\
    \ |\n| while | loops through a block of code while a condition is true |\n| do...while\
    \ | loops through a block of code once, and then repeats the loop while a condition\
    \ is true |\n| for | run statements a specified number of times |\n\n## Question:\
    \ What is the break statement?\n\nThe **break** statement exits from the current\
    \ loop.\n\n## Question: What is the continue statement?\n\nThe **continue** statement\
    \ continues with next statement of the loop.\n\n## Question: Explain how to detect\
    \ the operating system on the client machine?\n\nThe `navigator.appVersion` string\
    \ (property) can be used to detect the operating system of the client machine.\n\
    \n## Question: What is void(0) used for?\n\nThe void operator evaluates the given\
    \ expression and then returns undefined. Void(0) is used to prevent the page from\
    \ refreshing. The parameter “zero” is passed while calling it.\n\n## Question:\
    \ What are the escape characters?\n\nJavaScript uses the \\ (backslash) as an\
    \ escape characters for:\n\n- \\' single quote\n- \\\" double quote\n- \\backslash\n\
    - \\n new line\n- \\r carriage return\n- \\t tab\n- \\b backspace\n- \\f form\
    \ feed\n- \\v vertical tab\n- \\0 null character\n\n## Question: Explain how timers\
    \ work in JavaScript.\n\nA block of JavaScript code is generally executed synchronously.\
    \ Timers allow us to delay the execution of arbitrary instructions:\n\n### setTimeout()\n\
    The `setTimeout()` function is commonly used if you wish to have your function\
    \ called **once** after the specified delay.\n\n### setInterval()\nThe `setInterval()`\
    \ function is commonly used to set a delay for functions that are executed more\
    \ than once.\n\n### setImmediate()\nThe `setImmediate()` function can be used\
    \ instead of the `setTimeout(fn, 0)` method to execute heavy operations in IE.\n"
  mdcn: "\n\n## 准备你的 JavaScript 面试\n基础：技术问题与解答\n作者：K.T. Lindemann\n\n## 引言\n\n在今天，你不可能成为一名\
    \ Web 开发者却不知道 JavaScript。它最初是一个小小的客户端脚本语言，现在已演变成每个用户网络体验中无数框架和库的一部分。所有现代网络浏览器都实现了\
    \ JavaScript 语言，使其成为唯一部署在所有个人电脑和移动设备上的语言。\n\n随着演进，JavaScript 拥抱了许多特性，如原型继承、模块、命名空间、匿名（lambda）函数、Promise\
    \ 甚至甚至是元编程。得益于 Node.js 等框架，你现在甚至可以在服务器端使用它。\n\nJavaScript 的增长给新开发者带来了挑战。一方面，入门门槛很低——任何人可以在浏览器中打开开发者工具窗口并开始编写\
    \ JavaScript。另一方面，当你开始探索庞大的 JavaScript 生态系统中可用的功能时，其复杂性会呈指数级增长。\n\n现在，技术初筛包含 JavaScript\
    \ 问题已成为常态。作为一名候选人，你应该从哪里开始学习呢？\n\n其他书籍倾向于关注技术面试的编码部分，而本书旨在介绍候选人可能被要求口头解释或描述的一些常见基础性\
    \ JavaScript 面试题。本书专注于原生 JavaScript（Vanilla JS），涵盖了 JavaScript 数据结构、错误处理、UI 操作等基础知识！能够简洁且自信地回答这些问题将有助于你成为一名更出色的候选人。\n\
    \n祝你好运！\n\n## 目录\n\n- 引言\n- 通用练习\n- JavaScript 与 UI 元素\n- 比较与对比\n- 附加问题\n\n##\
    \ 通用练习\n\n本节重点关注原生 JavaScript 的基础。\n\n## 问题：什么是 JavaScript？\n\nJavaScript 通常缩写为\
    \ \"JS\"，是一种高级级、动态、无类型、解释型的运行时语言。\n\nJavaScript 既是客户端也是服务器端的脚本语言，可以插入 HTML 页面并被网络浏览器理解。JavaScript\
    \ 也可以是一种面向对象的编程语言。\n\n## 问题：JavaScript 中的两种基本数据类型组是什么？\n\n- 原生类型：string（字符串）、number（数字）、boolean（布尔）、null、undefined\n\
    - 复合类型：object（对象，包括函数）\n\n## 问题：JavaScript 有哪些类型？\n\nJavaScript 中只有**六** 种类型：Object（对象）、Number（数字）、String（字符串）、Boolean（布尔）、Null（空）和\
    \ Undefined（未定义）。\n\n对象包括数组、函数和普通对象。\n\n数字可以是整数或浮点数，或者是特殊值 NaN 和 Infinity。\n\n\
    字符串包括空字符串。\n\n## 问题：哪家公司开发了 JavaScript？\n\nNetscape（网景）是开发 JavaScript 的软件公司。\n\
    \n## 问题：什么是未声明（undeclared）和未定义（undefined）变量？\n\n未声明变量是指那些在程序中不存在且未声明的变量。如果程序尝试读取未声明变量的值，就会遇到运行时错误。\n\
    \n未定义变量是指在程序中已声明但未赋予任何值的变量。如果程序尝试读取未定义变量的值，将返回一个未定义值（undefined）。\n\n## 问题：什么是全局变量？\n\
    \n全局变量是在代码范围内可用的变量，也就是说它们没有作用域。使用 `var` 关键字声明局部变量或对象。如果省略了 `var` 关键字，则声明一个全局变量。\n\
    \n使用全局变量面临的问题是局部作用域和全局作用域变量名的冲突。此外，依赖全局变量的代码很难调试和测试。\n\n## 问题：JavaScript 中的 `this`\
    \ 关键字是什么？\n\n`this` 关键字指向调用它的对象。\n\n## 问题：`isNaN` 函数有什么用？\n\n`isNaN` 函数在参数不是数字时返回\
    \ true，否则返回 false。\n\n## 问题：什么是负无穷大（negative infinity）？\n\n负无穷大是 JavaScript 中的一个数字，可以通过负数除以零得到。\n\
    \n## 问题：JavaScript 中用什么符号进行注释？\n\n```javascript\n// 用于单行注释\n\n/* 多行\n注释 */\n```\n\
    \n## 问题：什么是 `===` 运算符？\n\n`===` 称为严格相等运算符，当两个操作数在不进行任何类型转换的情况下具有相同值时返回 true。\n\
    \n## 问题：JavaScript 中的类型转换（typing）是指什么？\n\n变量类型转换用于给字符串赋值数字。\n\n## 问题：JavaScript\
    \ 支持自动转换吗？\n\n是的，JavaScript 支持自动转换。JavaScript 是一种“弱类型”语言，这意味着每当运算符或语句期望特定类型时，JavaScript\
    \ 都会转换数据。\n\n例如，自动转换经常用于检查 DOM 元素是否存在：\n\n```javascript\nvar element = document.getElementById(\"\
    whatever\");\nif(element) {\n  // 元素存在\n} else {\n  // 元素不存在\n}\n```\n\n## 问题：JavaScript\
    \ 中的 NULL 代表什么？\n\nNULL 值用于表示没有值或没有对象。在 API 中，当期望获得对象时通常会检索 null。\n\n## 问题：JavaScript\
    \ 中的 `undefined` 值代表什么？\n\n**Undefined** 是 JavaScript 的原生类型之一。未赋值的变量类型为 undefined。如果一个方法语句尝试使用它，它也可能是\
    \ undefined。最后，如果函数没有返回任何值，则返回 undefined。\n\n## 问题：JavaScript 中所有的循环结构有哪些？\n\n\
    回答：在 JavaScript 中，我们有以下循环语句：\n\n| | 描述 |\n| :--- | :--- |\n| while | 只要条件为真就循环执行代码块\
    \ |\n| do...while | 循环一次代码块，然后在条件为真时重复循环 |\n| for | 运行指定次数的语句 |\n\n## 问题：什么是 `break`\
    \ 语句？\n\n**break** 语句用于退出当前循环。\n\n## 问题：什么是 `continue` 语句？\n\n**continue** 语句继续执行循环的下一次语句。\n\
    \n## 问题：解释如何检测客户端机器的操作系统？\n\n可以使用 `navigator.appVersion` 字符串（属性）来检测客户端的操作系统。\n\
    \n## 问题：`void(0)` 有什么用？\n\n`void` 运算符计算给定的表达式并返回 undefined。`void(0)` 用于防止页面刷新。调用它时传入了参数“zero”。\n\
    \n## 问题：什么是转义字符？\n\nJavaScript 使用反斜杠 `\\` 作为转义字符，用于：\n\n- \\' 单引号\n- \\\" 双引号\n\
    - \\ 反斜杠\n- \\n 换行\n- \\r 回车\n- \\t 制表符\n- \\b 退键\n- \\f 进页\n- \\v 垂直制表\n- \\\
    0 空字符\n\n## 问题：解释 JavaScript 中的计时器是如何工作的。\n\nJavaScript 代码通常是同步执行的。计时器允许我们延迟任意指令的执行：\n\
    \n### setTimeout()\n如果你希望在指定的延迟后调用**一次**函数，通常使用 `setTimeout()` 函数。\n\n### setInterval()\n\
    `setInterval()` 函数通常用于为执行多次的函数设置延迟。\n\n### setImmediate()\n在 IE 中，可以使用 `setImmediate()`\
    \ 函数代替 `setTimeout(fn, 0)` 方法来执行耗时操作。\n\n"
