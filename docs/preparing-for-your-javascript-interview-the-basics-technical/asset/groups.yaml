  - '[PAGE 46]


    # Question: What is the disadvantage of using innerHTML in JavaScript?


    Improper handling of the innerHTML property can enable script-injection attacks
    on Internet Explorer when the HTML string contains a script tag marked as deferred:

    <script defer>...</script>


    Setting innerHTML will destroy existing HTML elements that have event handlers
    attached to them, potentially creating a memory leak on some browsers.


    You can''t set the innerHTML property on all HTML elements on all browsers (for
    instance, Internet Explorer won''t let you set the innerHTML property of a table
    row element).


    Finally, innerHTML content is refreshed every time and thus is slower.'
  - '[PAGE 47]


    # Question: What are all the types of Pop up boxes available in JavaScript?


    JavaScript has three kind of popup boxes: Alert box, Confirm box, and Prompt box.


    # Alert Box


    An alert box is often used if you want to make sure information comes through
    the user.

    When an alert box pops up, the user will have to click "OK" to proceed.


    # Confirm Box


    A confirm box is often used if you want the user to verify or accept something.

    When a confirm box pops up, the user will have to click either "OK" or "Cancel"
    to proceed.


    # Prompt Box


    A prompt box is often used if you want the user to input a value before entering
    a page.


    When a prompt box pops up, the user will have to click either "OK" or "Cancel"
    to proceed after entering an input value.'
- md: '

    ## Question: What is the use of blur function?


    The blur function is used to remove the focus from the specified object.


    ## Question: How do you get the status of a CheckBox?


    Using the ID of your input field, you can check the value of:

    document.getElementById(''my-checkbox'').checked


    If it is True, the checkbox is checked.


    ## Question: Define event bubbling?


    When an event happens on an element, it first runs the handlers on it, then on
    its parent, then all the way up on other ancestors. In other words, it “bubbles”
    up.


    This is because JavaScript allows DOM elements to be nested inside each other.
    In such a case, if the handler of the child is clicked, the handler of parent
    will also work as if it were clicked too.


    ## Question: How are event handlers utilized in JavaScript?


    Answer:

    Events are the actions that result from activities, such as clicking a link or
    filling a form, by the user. An event listener or handler is a procedure or function
    in a computer program that waits for an event to occur, then performs actions
    in response to that event.


    ## Compare and Contrast


    This section focuses on questions that ask you to explain the similarities and
    differences between concepts and methodology.


    ## Question: Enumerate the differences between Java and JavaScript?


    Although the names are much alike, these two languages are not at all the same
    and are designed for very different intents. JavaScript is primarily a scripting
    language for use within HTML pages, while Java is a compiled, programming language
    that is concurrent, class-based, and object-oriented.


    Java was developed by Sun for use as a general-purpose computer programming language.


    JavaScript was developed by Netscape, originally as a client side scripting language.


    ## Question: Between JavaScript and an ASP script, which is faster?


    JavaScript is faster. JavaScript is a client-side language and thus it does not
    need the assistance of the web server to execute. On the other hand, ASP is a
    server-side language and hence is always slower than JavaScript.


    ## Question: What is the difference between ViewState and SessionState?


    **ViewState** is specific to a page in a session.


    **SessionState** is specific to user specific data that can be accessed across
    all pages in the web application.


    ## Question: Explain the difference between “==” and “===”


    “==” checks only for equality in value.


    “=== ” is a stricter equality test and returns false if either the value or the
    type of the two variables are different.


    ## Question: What is the difference between an alert box and a confirmation box?


    An alert box displays only one button which is the OK button.

    A confirmation box displays two buttons, the OK button and the cancel button.


    ## Question: Explain window.onload versus onDocumentReady?


    load is called when all assets are done loading, including images. At this point,
    all of the objects in the document are in the DOM.


    ready is fired when the DOM is ready for interaction and its elements can be manipulated
    by your code. This means it will run a little faster than waiting for load.


    ## Bonus Questions


    These sneaky questions force you to know your JavaScript inside and out.

    Watch out for tricks!


    ## Question: Is it possible to break JavaScript code into several lines?


    Breaking within a string statement can be done by the use of a backslash, ''\’,
    at the end of the first line. If you change to a new line when not within a string
    statement, then JavaScript ignores break in line.


    ## Question: What would be the result of 3+2+"7"?


    Since 3 and 2 are integers, they will be added numerically. And since 7 is a string,
    its concatenation will be done. So the result would be 57.


    ## Question: How can you convert the string of any base to integer in JavaScript?


    The parseInt() function is used to convert numbers between different bases. parseInt()
    takes the string to be converted as its first parameter, and the second parameter
    is the base of the given string.


    ## Question: Is JavaScript case sensitive? Give an example?


    Yes, JavaScript is case sensitive. For example, a function parseInt() is not same
    as the function ParseInt().


    ## Question: What is the difference between .call() and .apply()?


    The function .call() and .apply() are very similar in their usage except that
    apply() lets you invoke the function with arguments as an array; .call() requires
    the parameters be listed explicitly. In other words, you use apply() when you
    don''t know the number of parameters.

    '
  mdcn: '


    ## 问题：blur 函数有什么用处？


    blur 函数用于移除指定对象的焦点。


    ## 问题：如何获取 CheckBox 的状态？


    使用你输入字段的 ID，可以检查以下内容的值：

    document.getElementById(''my-checkbox'').checked


    如果为 True，则复选框被勾选状态。


    ## 问题：定义事件冒泡？


    当事件在元素上发生事件时，它会首先运行该元素上的处理器，然后运行其父元素上的处理器，一直向上传播到其他祖先元素。换句话说，它会向上“冒泡”。


    这是因为 JavaScript 允许 DOM 元素之间相互嵌套。在这种情况下，如果子元素的处理器被点击，父元素的处理器也会像被点击了一样同样起作用。


    ## 问题：在 JavaScript 中是如何利用事件处理程序的？


    答案：

    事件是用户活动产生的动作，例如点击链接或填写表单。事件监听器或处理器是计算机程序中的一种过程或函数，它负责等待事件发生，然后对该事件执行相应的操作。


    ## 比较与对比


    本节侧重于要求你解释概念和方法之间相似之处与差异的问题。


    ## 问题：列举 Java 和 JavaScript 之间的区别？


    尽管名字非常相似，但这两种语言完全不同，且设计意图也非常不同。JavaScript 主要是一种用于 HTML 页面内部的脚本语言，而 Java 是一种编译型编程语言，它具有并发、基于类和面向对象的特性。


    Java 由 Sun 开发，旨在作为一种通用计算机编程语言。


    JavaScript 由 Netscape 开发，最初是作为客户端脚本语言。


    ## 问题：JavaScript 和 ASP 脚本之间，哪一个更快？


    JavaScript 更快。JavaScript 是一种客户端语言，因此不需要 Web 服务器的协助即可执行。相反，ASP 是一种服务端语言，因此总是比 JavaScript
    慢。


    ## 问题：ViewState 和 SessionState 有什么区别？


    **ViewState** 特指会话中的某个页面。


    **SessionState** 特指用户特定数据，数据可以在 Web 应用程序的所有页面中访问。


    ## 问题：解释“==”和“===”之间的区别


    “==” 仅检查值的相等性。


    “=== ” 是更严格的相等性测试，如果两个变量的值或类型不同，则返回 false。


    ## 问题：警报框（alert box）和确认框（confirmation box）有什么区别？


    警报框只显示一个按钮，即 OK 按钮。

    确认框显示两个按钮，即 OK 按钮和取消按钮。


    ## 问题：解释 window.onload 与 onDocumentReady 的区别？


    load 在所有资源（包括图像）加载完成时调用。此时，文档中的所有对象已在 DOM 中。


    ready 在 DOM 准备好交互且其元素可以被你的代码进行操作时触发。这意味着它的运行速度会比等待 load 快一点。


    ## Bonus题


    这些狡猾的问题迫使你对 JavaScript 了如指掌。

    注意陷阱！


    ## 问题：可以将 JavaScript 代码拆分成几行吗？


    在字符串语句内部进行换行可以通过第一行末尾使用反斜杠 `\` 来实现。如果你在不在字符串语句的情况下换到新行，那么 JavaScript 会忽略该换行符。


    ## 问题：3+2+"7" 的结果是什么？


    由于 3 和 2 是整数，它们将进行数值相加。由于 7 是一个字符串，它将进行字符串拼接。因此结果将是 57。


    ## 问题：如何在 JavaScript 中将任何基数的字符串转换为整数？


    parseInt() 函数用于在不同基数之间转换数字。parseInt() 接受要转换的字符串作为第一个参数，第二个参数是给定字符串的基数。


    ## 问题：JavaScript区分大小写吗？举个例子？


    是的，JavaScript 是区分大小写的。例如，函数 parseInt() 与函数 ParseInt() 不同。


    ## 问题：.call() 和 .apply() 有什么区别？


    .call() 和 .apply() 函数在用法非常相似，除了 apply() 允许你以数组的形式调用函数；.call() 要求显式列出参数。换句话说，当你不知道参数的数量时使用
    apply()。


    '
