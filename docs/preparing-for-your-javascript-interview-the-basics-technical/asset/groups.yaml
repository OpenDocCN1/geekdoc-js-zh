    # Introduction


    Today, you cannot be a web developer and not know JavaScript. What started out
    as a small client side scripting language has evolved into countless frameworks
    and libraries that are part of every user''s web experience. All modern web browsers
    implement the JavaScript language, thus making it the only one deployed on all
    personal computers and mobile devices around the world.


    As it evolved, JavaScript has embraced advanced features as prototypal inheritance,
    modules, namespaces, anonymous (lambda) functions, promises, and even metaprogramming.
    Thanks to frameworks like NodeJs, you can even use it server-side now.


    JavaScript''s growth presents a challenge for new developers. On the one hand,
    the barrier to entry is low – anyone can open a developer tools window in the
    web browser and begin to write JavaScript. On the other hand, the level of complexity
    grows exponentially as you begin to explore the functionality available in the
    vast JavaScript ecosystem.


    It''s now common for technical phone screens to include JavaScript questions.
    As a candidate, where should you begin to study?


    While other books tend to focus on the coding part of technical interviews, this
    book aims to run through some common, foundational JavaScript interview questions
    that candidates may be asked to explain or describe out loud. Focusing on vanilla
    JavaScript, this book covers the basics of JavaScript data structures, error handling,
    UI manipulation, and more! Being able to answer these questions concisely and
    confidently will go a long towards making you a better candidate.


    Good luck!'
