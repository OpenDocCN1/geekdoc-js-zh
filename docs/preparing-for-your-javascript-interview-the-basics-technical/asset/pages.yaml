    its

    parent, then all the way up on other ancestors. In other words, it “bubbles” up.


    This is because JavaScript allows DOM elements to be nested inside each

    other. In such a case, if the handler of the child is clicked, the handler of
    parent

    will also work as if it were clicked too.'
