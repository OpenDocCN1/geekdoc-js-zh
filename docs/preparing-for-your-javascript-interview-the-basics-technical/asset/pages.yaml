  md: '# Question: What is the ‘Strict’ mode in JavaScript and how can it be enabled?


    Answer:

    ECMAScript 5''s strict mode is a way to opt in to a restricted variant of JavaScript.
    Strict mode is intentionally different from normal JavaScript code.


    Strict mode makes several changes to normal JavaScript semantics. First, strict
    mode forces some JavaScript silent errors by changing them to throw errors. Second,
    strict mode enables JavaScript engines to perform certain optimizations that were
    previously not possible. Third, strict mode prohibits syntax likely to be defined
    in future versions of ECMAScript.'
