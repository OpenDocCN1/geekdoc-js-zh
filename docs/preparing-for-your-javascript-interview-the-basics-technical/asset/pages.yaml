  md: '# Question: What are the different types of errors in JavaScript?


    As of ECMAScript 2016, there are seven other core error constructors in JavaScript
    (in addition to the generic Error object):


    # EvalError


    An error that occurs during the global function eval().


    # InternalError


    An error that occurs when an internal error in the JavaScript engine is thrown,
    for example, "too much recursion".


    # RangeError


    An error that occurs when a numeric variable or parameter is outside of valid
    range.


    # ReferenceError


    An error that occurs when de-referencing an invalid reference.


    # SyntaxError


    A syntax error that occurs while parsing code in eval().


    # TypeError


    An error that occurs when a variable or parameter is not of a valid type.


    # URIError


    An error that occurs when encodeURI() or decodeURI() are given invalid parameters.'
