    \n### 7.3.4 构造函数中的 \"call\" 和 \"apply\" 继承\n\n可以通过使用 `call`或`apply` 方法在构造函数中实现继承，允许一个构造函数函数在其内部调用另一个构造函数函数，将上下文（`this`）设置为新创建的对象。\n\
