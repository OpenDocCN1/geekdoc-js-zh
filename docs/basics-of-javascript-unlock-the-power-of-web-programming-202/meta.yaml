    \ and `Array.slice()` or the spread syntax for arrays. However, this method only\
    \ copies the top layer, leaving nested objects or arrays still referencing the\
    \ original.\n\n```javascript\nlet obj = { a: 1, b: { c: 2 } };\nlet clone = {\
    \ ...obj };\nclone.b.c = 3;\nconsole.log(obj.b.c); // Output: 3 (nested objects\
    \ are still referenced)\n```\n\n-   **Deep Cloning** can be performed using libraries\
    \ like Lodash's `_.cloneDeep()` method, or manually implementing recursive cloning\
    \ functions. It ensures that no references to the original object remain.\n\n\
    ## 5.2.4 Common Pitfalls with References and How to Avoid Them\n\nCommon issues\
    \ related to reference types include unintended mutations, performance degradation\
    \ due to unnecessary deep copies, and exceeding call stack size with incorrect\
    \ deep cloning implementations.\n\n-   Avoiding Pitfalls:\n    -   Be mindful\
    \ of the type of data (primitive vs. reference) when passing arguments to functions.\n\
    \    -   Use `const` by default for objects and arrays to protect against reassignment.\n\
    \    -   Explicitly clone objects or arrays if they need to be modified without\
