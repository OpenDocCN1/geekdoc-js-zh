    \ // Works - outputs \"Hello\"\nconsole.log(expressionFunc()); // Error: expressionFunc\
    \ is not a function\n\nfunction declaredFunc() {\n  return \"Hello\";\n}\n\nvar\
    \ expressionFunc = function() {\n  return \"Goodbye\";\n};\n```\n\nUnderstanding\
    \ the distinctions between declarations and expressions, and how hoisting affects\
    \ each, is crucial for writing predictable and bug-free JavaScript code.\n\n#\
    \ ## 4.3 Arrow Functions: A Concise Syntax\n\nArrow functions, introduced in ECMAScript\
    \ 6 (ES6), offer a more concise syntax for writing function expressions. They\
    \ are particularly useful for short functions and situations where preserving\
    \ the lexical scope of `this` is desired."
