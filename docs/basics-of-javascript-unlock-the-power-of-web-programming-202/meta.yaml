    \nDebouncing and throttling are techniques used to control how many times a function\
    \ executing due to certain events (like scrolling, resizing, keypress) is executed,\
    \ enhancing performance and user experience.\n\n- **Debouncing**: Ensures that\
    \ a function is executed after the triggering event has stopped firing for a predetermined\
    \ amount of time. Useful for events like window resizing, where you only care\
    \ about the final state.\n\n```\nfunction debounce(func, wait) {\n    let timeout;\n\
    \    return function executedFunction() {\n        clearTimeout(timeout);\n  \
    \      timeout = setTimeout(() => {\n            func();\n        }, wait);\n\
    \    };\n}\n```\n\n- **Throttling**: Ensures that a function is called at most\
    \ once within a specified time period, regardless of how many times the triggering\
    \ event fires. Useful for events like scrolling, where you want to limit updates.\n\
    \n```\nfunction throttle(func, limit) {\n  let lastFunc;\n  let lastRan;\n  return\
    \ function() {\n    const context = this;\n    const args = arguments;\n    if\
    \ (!lastRan) {\n      func.apply(context, args);\n      lastRan = Date.now();\n\
    \    } else {\n      clearTimeout(lastFunc);\n      lastFunc = setTimeout(function()\
    \ {\n        if ((Date.now() - lastRan) >= limit) {\n          func.apply(context,\
    \ args);\n          lastRan = Date.now();\n        }\n      }, limit - (Date.now()\
    \ - lastRan));\n    }\n  }\n}\n```\n\nDebouncing and throttling are invaluable\
    \ for handling events efficiently, ensuring that your web application remains\
    \ responsive and performs well.\n\n## 10.4 Creating and Navigating Between Pages\
    \ Dynamically\n\n### 10.4.1 Dynamically Modifying the Current Document\n\nDynamic\
    \ modification of web pages allows for the addition, deletion, or alteration of\
    \ content and elements without the need for a full page reload. This can greatly\
    \ improve the user experience by making web applications feel more responsive\
    \ and interactive. Techniques include:\n\n- Manipulating the DOM directly to add,\
    \ remove, or change elements.\n- Changing style and visibility of elements to\
    \ show/hide content dynamically.\n- Utilizing templates and frameworks to render\
    \ content based on user actions or data changes.\n\nJavaScript, along with the\
    \ DOM API, provides all the necessary tools to manipulate the content and structure\
    \ of a webpage in real-time.\n\n### 10.4.2 Using the History API for Page Navigation\n\
    \nThe History API provides a standard way to manipulate the browser history, enabling\
    \ developers to implement sophisticated navigation mechanisms within web applications:\n\
    \n- `history.pushState()`: Adds a state to the browser's session history stack,\
    \ allowing you to change the URL displayed in the address bar without reloading\
    \ the page.\n\n- `history.replaceState()`: Replaces the current state in the session\
    \ history stack with a new state, effectively allowing you to modify the current\
    \ URL without reloading the page.\n\n- `window.onpopstate` event: This event is\
    \ fired when the active history entry changes, allowing developers to update page\
    \ content dynamically when users navigate with the browser's back and forward\
    \ buttons.\n\nThese tools are especially useful in single-page applications where\
    \ the page does not fully reload as the user navigates.\n\n## 10.4.3 Implementing\
    \ Single Page Applications (SPAs) Basics\n\nSingle Page Applications (SPAs) are\
    \ web applications that load a single HTML page and dynamically update that page\
    \ as the user interacts with the app. SPAs use AJAX and the History API to create\
    \ fluid and responsive web applications, by:\n\n- Loading content asynchronously\
    \ and updating the DOM in real-time, without page reloads.\n- Changing the URL\
    \ and maintaining a functional browser history without full page refreshes.\n\
    - Reducing server roundtrips by only requesting the data that is needed, often\
    \ in JSON format, and rendering the UI client-side.\n\nFrameworks and libraries\
    \ such as React, Angular, and Vue.js are commonly used to develop SPAs efficiently.\n\
    \n## 10.4.4 AJAX and Fetch API for Asynchronous Page Updates\n\nAJAX (Asynchronous\
    \ JavaScript and XML) and the Fetch API are technologies that allow web pages\
    \ to be updated asynchronously by exchanging small amounts of data with the server\
    \ behind the scenes.\n\n- **AJAX**: Enables the asynchronous exchange of data\
    \ between a web page and a server, allowing parts of a web page to be updated\
    \ without reloading the whole page.\n- **Fetch API**: Provides a modern, promise-based\
    \ mechanism for making network requests and fetching resources. It's more versatile\
    \ and powerful than the older `XMLHttpRequest` object used in traditional AJAX.\n\
    \n```\nfetch('https://api.example.com/data')\n  .then(response => response.json())\n\
    \  .then(data => console.log(data))\n  .catch(error => console.error('Error:',\
    \ error));\n```\n\nThe combination of these technologies allows developers to\
    \ create dynamic, user-friendly web applications that load new content seamlessly,\
    \ without requiring page reloads, enhancing the overall user experience.\n\n##\
    \ 10.5 Advanced DOM Manipulation and Optimization Techniques\n\nCreating high-performance\
    \ web applications often requires advanced DOM manipulation and optimization techniques.\
    \ These methodologies help mitigate performance bottlenecks caused by excessive\
    \ or inefficient manipulation of the DOM.\n\n### 10.5.1 Working with Document\
    \ Fragments for Optimal Performance\n\nOne common avenue for enhancing performance\
    \ when inserting or manipulating multiple DOM elements is the use of **Document\
    \ Fragments**. A Document Fragment acts as a lightweight, minimal document object\
    \ that can hold DOM nodes. You can append nodes to it just as you would to the\
    \ actual DOM, but since the Document Fragment is not part of the active DOM tree,\
    \ modifying it doesn't cause reflow or repaint. Once you're done, you can append\
    \ the entire Fragment to the DOM, triggering just a single reflow and repaint\
    \ cycle.\n\n```\n// Creating a document fragment\nlet fragment = document.createDocumentFragment();\n\
    \n// Appending nodes to the fragment\nfor (let i = 0; i < 5; i++) {\n  let p =\
    \ document.createElement('p');\n  p.textContent = 'Paragraph ' + i;\n  fragment.appendChild(p);\n\
    }\n\n// Appending the fragment to the DOM\ndocument.body.appendChild(fragment);\n\
    ```\n\n### 10.5.2 Efficiently Handling Large Lists and Scroll Events\n\nFor web\
    \ applications dealing with large lists or frequent scroll events, **Virtual Scrolling**\
    \ or **Windowing** techniques help maintain smooth performance. These methods\
    \ involve loading and rendering only a subset of a large list that's visible to\
    \ the user, with additional items being rendered on-the-fly as the user scrolls.\
    \ Libraries like React Virtualized or React Window can help implement these patterns\
    \ in React applications."
  mdcn: "\n捕获和冒泡阶段。\n\n- **捕获阶段 (Capturing Phase)**：当事件发生时，它首先从最外层祖先元素移动到目标元素。这就是捕获阶段。最初，大多数事件处理程序设置为在冒泡阶段而非捕获阶段响应。\n\
    \n- **冒泡阶段 (Bubbling Phase)**：到达目标元素后，事件又向上冒泡到最外层祖先元素。JavaScript 中大多数事件都工作在冒泡阶段，这使得更容易实现事件委托。\n\
    \n使用 `addEventListener` 方法，您可以通过第三个参数指定事件监听器应该发生在捕获阶段还是冒泡阶段：\n\n```\nelement.addEventListener('click',\
    \ function(event) {\n  // event handling code here\n}, false); // false for bubbling\
    \ (default), true for capturing\n```\n\n## 10.3.2 添加和移除事件监听器\n\n使用 `addEventListener`\
    \ 方法添加事件监听器很简单。然而，移除事件监听器需要保留添加时的确切函数的引用。\n\n```\n// Adding an event listener\n\
    element.addEventListener('click', handleEvent);\n\n// Removing an event listener\n\
    element.removeEventListener('click', handleEvent);\n\nfunction handleEvent() {\n\
    \  // handle the event\n}\n```\n\n## 10.3.3 常见的 DOM 事件和事件对象属性\n\n常见的 DOM 事件包括：\n\
    \n- **鼠标事件 (Mouse Events)**：`click`, `dblclick`, `mousedown`, `mouseup`, `mouseover`,\
    \ `mouseleave`\n- **键盘事件 (Keyboard Events)**：`keydown`, `keyup`, `keypress`\n\
    - **表单事件 (Form Events)**：`submit`, `change`, `focus`, `blur`\n\n每个事件处理程序都会收到一个事件对象，包含与事件相关的属性和方法。常见的属性包括：\n\
    \n- `type`：事件类型（例如，`click`）。\n- `target`：发起事件的目標元素。\n- `currentTarget`：事件监听器附着到的元素。\n\
    - `preventDefault()`：阻止与该事件关联的默认操作的方法。\n\n## 10.3.4 事件处理器中的防抖和节流\n\n防抖和节流是用于控制由于某些事件（如滚动、调整大小、按键）而执行的函数执行次数的技术，从而提高性能和用户体验。\n\
    \n- **防抖 (Debouncing)**：确保在触发事件停止触发预定时间后执行函数。对于窗口大小调整等事件很有用，你只关心最终状态。\n\n```\n\
    function debounce(func, wait) {\n    let timeout;\n    return function executedFunction()\
    \ {\n        clearTimeout(timeout);\n        timeout = setTimeout(() => {\n  \
    \          func();\n        }, wait);\n    };\n}\n```\n\n- **节流 (Throttling)**：确保在指定的时间段内最多调用一次函数，无论触发事件执行多少次。对于滚动等事件很有用，你需要限制更新。\n\
    \n```\nfunction throttle(func, limit) {\n  let lastFunc;\n  let lastRan;\n  return\
    \ function() {\n    const context = this;\n    const args = arguments;\n    if\
    \ (!lastRan) {\n      func.apply(context, args);\n      lastRan = Date.now();\n\
    \    } else {\n      clearTimeout(lastFunc);\n      lastFunc = setTimeout(function()\
    \ {\n        if ((Date.now() - lastRan) >= limit) {\n          func.apply(context,\
    \ args);\n          lastRan = Date.now();\n        }\n      }, limit - (Date.now()\
    \ - lastRan));\n    }\n  }\n}\n```\n\n防抖和节流在处理事件方面非常宝贵，确保你的 Web 应用程序保持响应且表现良好。\n\
    \n## 10.4 动态创建页面及页面间导航\n\n### 10.4.1 动态修改当前文档\n\n对网页的动态修改允许在不进行完全页面重新加载的情况下添加、删除或更改内容和元素。这可以通过使\
    \ Web 应用程序感觉更响应和交互性来大大改善用户体验。技术包括：\n\n- 直接操作 DOM 以添加、删除或更改元素。\n- 更改元素的样式和可见性以动态显示/隐藏内容。\n\
    - 利用模板和框架根据用户操作或数据变化渲染内容。\n\nJavaScript 以及 DOM API 提供了所有必要的工具，可以在实时中操纵网页的内容和结构。\n\
    \n### 10.4.2 使用 History API 进行页面导航\n\nHistory API 提供了一种标准的操作浏览器历史的方法，使开发人员能够在\
    \ Web 应用程序中实现复杂的导航机制：\n\n- `history.pushState()`：向浏览器的会话历史栈添加一个状态，允许你在不重新加载页面的情况下更改地址栏中显示的\
    \ URL。\n\n- `history.replaceState()`：用新状态替换会话历史栈中的当前状态，实际上允许你在不重新加载页面的情况下修改当前\
    \ URL。\n\n- `window.onpopstate` 事件：当活动历史记录条目更改时触发此事件，允许开发人员在用户使用浏览器的前进/后退按钮导航时动态更新页面内容。\n\
    \n这些工具在单页应用程序中特别有用，因为页面不会像用户导航那样完全重新加载。\n\n## 10.4.3 实施单页应用程序（SPA）基础\n\n单页应用程序（SPAs）是加载单个\
    \ HTML 页面并在用户与应用交互时动态更新该页面的 Web 应用程序。SPA 使用 AJAX 和 History API 创建流畅且响应迅速的 Web\
    \ 应用程序，方法包括：\n\n- 异步加载内容并实时更新 DOM，无需页面重新加载。\n- 更改 URL 并保持功能性的浏览器历史，而无需刷新整个页面。\n\
    - 仅请求所需数据（通常以 JSON 格式），并将在客户端渲染 UI，从而减少服务器往返次数。\n\nReact、Angular 和 Vue.js 等框架和库常用于高效开发\
    \ SPA。\n\n## 10.4.4 用于异步页面更新的 AJAX 和 Fetch API\n\nAJAX（Asynchronous JavaScript\
    \ and XML）和 Fetch API 是允许 Web 页面通过幕后与服务器交换少量数据来异步更新的技术。\n\n- **AJAX**：启用 Web 页面和服务器之间的异步数据交换，允许在无需重新加载整个页面的情况下更新\
    \ Web 页面的部分内容。\n- **Fetch API**：提供了一种现代的、基于 Promise 的网络请求和资源获取机制。与传统 AJAX 中使用的旧\
    \ `XMLHttpRequest` 对象相比，它更灵活且功能更强。\n\n```\nfetch('https://api.example.com/data')\n\
    \  .then(response => response.json())\n  .then(data => console.log(data))\n  .catch(error\
    \ => console.error('Error:', error));\n```\n\n这些技术的结合使开发人员能够创建动态、用户友好的 Web 应用程序，无需页面重新加载即可无缝加载新内容，从而增强整体用户体验。\n\
    \n## 10.5 高级 DOM 操作和优化技术\n\n创建高性能 Web 应用程序通常需要高级 DOM 操作和优化技术。这些方法论有助于减轻由过度或低效的\
    \ DOM 操作引起的性能瓶颈。\n\n### 10.5.1 使用文档碎片实现最佳性能\n\n增强插入或操纵多个 DOM 元素性能的常见途径是使用 **文档片段\
    \ (Document Fragments)**。一个文档片段充当一个轻量级、最小的文档对象，可以存储 DOM 节点。你可以像对实际 DOM 一样向其附加节点，但由于文档片段不属于活动\
    \ DOM 树，修改它不会引起重排或重绘。完成之后，你可以将整个 Fragment 附加到 DOM，只触发一次重排和重绘循环。\n\n```\n// Creating\
    \ a document fragment\nlet fragment = document.createDocumentFragment();\n\n//\
    \ Appending nodes to the fragment\nfor (let i = 0; i < 5; i++) {\n  let p = document.createElement('p');\n\
    \  p.textContent = 'Paragraph ' + i;\n  fragment.appendChild(p);\n}\n\n// Appending\
    \ the fragment to the DOM\ndocument.body.appendChild(fragment);\n```\n\n### 10.5.2\
    \ 高效处理大型列表和滚动事件\n\n对于处理大型列表或频繁滚动事件的 Web 应用程序，**虚拟滚动 (Virtual Scrolling)** 或 **视窗化\
    \ (Windowing)** 技术有助于保持平滑性能。这些方法涉及仅加载和渲染可见给用户的大型列表的子集，并在用户滚动时动态渲染更多项目。React Virtualized\
    \ 或 React Window 等库可以帮助在 React 应用程序中实现这些模式。\n"
