    \n```javascript\nObject.keys(person).forEach(key => {\n  console.log(`${key}:\
    \ ${person[key]}`);\n});\n```\n\n这些方法提供了一种动态访问和操作对象属性的方式。\n\n### 6.3.4 解构对象\n\n\
    解构提供了一种将对象的属性解包到不同变量中的方法。\n\n```javascript\nconst { firstName, lastName } = person;\n\
    console.log(firstName); // John\nconsole.log(lastName); // Doe\n```\n\n你也可以在解构时提供新的变量名。\n\
    \n```javascript\nconst { firstName: first, lastName: last } = person;\nconsole.log(first);\
    \ // John\nconsole.log(last); // Doe\n```\n\n解构可以大大简化处理对象的过程，使代码更清晰、更易于阅读。\n\n\
    理解对象及其操作在 JavaScript 中至关重要，因为它们构成了数据表示的骨干。从简单的键值对到复杂的嵌套对象，掌握对象可以让开发者高效地组织和处理数据。\n\
    \n## 6.4 访问对象属性：点号表示法与方括号表示法\n\n访问 JavaScript 对象属性的两种主要方式是点号表示法和方括号表示法。理解何时以及如何使用每种方法可以帮助你高效地处理对象及其属性。\n\
    \n### 6.4.1 何时使用点号表示法\n\n点号表示法是访问对象属性最常见、最直接的方式。因其可读性和简洁性而更受青睐。\n\n```javascript\n\
    const person = {\n  name: \"John Doe\",\n  age: 30\n};\n\nconsole.log(person.name);\
    \ // 输出：John Doe\nconsole.log(person.age); // 输出：30\n```\n\n应在以下情况下使用点号表示法：\n\n\
    -   属性名是预先知道的，并且是有效的 JavaScript 标识符。\n-   你正在访问的静态属性不需要动态求值。\n\n### 6.4.2 何时使用方括号表示法\n\
    \n方括号表示法比点号表示法提供了更大的灵活性，但可能稍微冗长一些。它允许使用标识符中不允许的字符，例如空格或以数字开头。此外，当属性名是动态确定时，方括号表示法至关重要。\n\
    \n```javascript\nconst person = {\n  \"full name\": \"John Doe\",\n  age: 30\n\
    };\n\nconsole.log(person[\"full name\"]); // 输出：John Doe\nconsole.log(person[\"\
    age\"]); // 输出：30\n```\n\n应在以下情况下使用方括号表示法：\n\n-   属性名包含特殊字符或空格。\n-   属性名以数字开头。\n\
    -   属性名存储在变量中或需要计算得出。\n\n### 6.4.3 动态属性名\n\n当处理动态确定的属性时（例如，基于用户输入或运行时值），方括号表示法的优势尤为明显。\n\
    \n```javascript\nconst key = 'name';\nconst person = {\n  [key]: \"John Doe\"\n\
    };\n\nconsole.log(person[key]); // 输出：John Doe\n```\n\n这种能力在需要灵活性的场景中特别有用，例如遍历对象的键或基于变量输入访问属性。\n\
    \n### 6.4.4 属性存在性与枚举\n\n要检查对象是否具有特定属性，可以使用 `in` 运算符或 `Object.hasOwnProperty()`\
    \ 方法。\n\n```javascript\nif ('name' in person) {\n  console.log(\"该人有个名字。\");\n\
    }\n\n\nif (person.hasOwnProperty('age')) {\n  console.log(\"该人有个年龄。\");\n}\n```\n\
    \n要枚举（列出）对象的属性，可以使用 `Object.keys()`、`Object.values()` 或 `Object.entries()` 方法，它们分别返回属性名、值或两者的组合。\n\
    \n```javascript\nconsole.log(Object.keys(person)); // ['name', 'age']\nconsole.log(Object.values(person));\
    \ // ['John Doe', 30]\nconsole.log(Object.entries(person)); // [['name', 'John\
    \ Doe'], ['age', 30]]\n```\n\n选择适当的表示法并理解属性存在性与枚举，可以在你的 JavaScript 应用程序中实现更有效的对象操作和查询。\n\
    \n## 深入理解对象\n\n### 7.1 面向对象 JavaScript 简介\n\n面向对象编程是一种基于“对象”概念的编程范式，对象可以包含以字段形式存在的数据（通常称为属性或特性）和以过程形式存在的代码（通常称为方法）。JavaScript\
    \ 通过其原型机制支持面向对象编程，并从 ES6 开始支持使用类实现经典的面向对象概念。\n\n### 7.1.1 面向对象编程的四大支柱\n\n面向对象编程的四大基石包括：\n\
    \n1.  **封装：** 这个原则是关于将数据和操作数据的方法捆绑在一个称为“对象”的单一单元中。它允许限制对对象某些组件的访问，这是数据抽象和控制的第一步。\n\
    2.  **抽象：** 抽象意味着隐藏复杂的现实，只暴露必要的部分。它通过提供一个突出实体在交互环境中行为的简化模型来帮助减少编程的复杂性和工作量。\n3.\
    \  **继承：** 这是一种允许一个类获取另一个类的属性（方法和字段）的机制。通过继承，你可以创建一个通用类，然后将其扩展为更专门的类。\n4.  **多态性：**\
    \ 多态性允许实体以多种形式表示。它是在不同对象上调用相同方法，并让每个对象以自己的方式响应的能力。\n\n### 7.1.2 JavaScript 中的对象与类\n\
    \n在传统的 JavaScript 中，对象的原型一直是添加方法和属性的主要方式。然而，ECMAScript 6 引入了类，这在基于原型的继承之上添加了一层薄薄的抽象，使得实现复杂的对象结构变得更容易。\n\
    \n示例：\n\n```javascript\nclass Person {\n    constructor(name, age) {\n       \
    \ this.name = name;\n        this.age = age;\n    }\n\n    introduce() {\n   \
    \     console.log(`My name is ${this.name} and I am ${this.age} years old.`);\n\
    \    }\n}\n\nconst john = new Person('John Doe', 30);\njohn.introduce(); // My\
    \ name is John Doe and I am 30 years old.\n```\n\n### 7.1.3 封装与信息隐藏\n\nJavaScript\
    \ 类通过将数据（属性）和操作数据的函数（方法）集成到一个称为类的单元中来支持封装。然而，在最近的补充（如私有类字段）之前，JavaScript 并不直接支持数据隐藏。这通常使用闭包或较新的私有字段语法来完成。\n\
    \n使用私有字段的示例：\n\n```javascript\nclass Person {\n  #name;\n  #age;\n\n  constructor(name,\
    \ age) {\n    this.#name = name;\n    this.#age = age;\n  }\n\n  introduce() {\n\
    \    console.log(`My name is ${this.#name} and I am ${this.#age} years old.`);\n\
    \  }\n\n  // Getter 和 Setter 方法可用于访问私有字段\n  get name() {\n    return this.#name;\n\
    \  }\n\n  set name(newName) {\n    this.#name = newName;\n  }\n}\n```\n\n### 7.1.4\
    \ 类中的方法与 “this” 上下文\n\n方法是在对象上可以执行的操作，而 JavaScript 方法以函数定义的形式存储在属性中。\n\n方法中的 `this`\
    \ 关键字指的是该方法的“所有者”。在类的上下文中，`this` 指的是类的一个实例（一个对象）。\n\n然而，`this` 的值在方法被调用之前是未绑定的。如果方法依赖\
