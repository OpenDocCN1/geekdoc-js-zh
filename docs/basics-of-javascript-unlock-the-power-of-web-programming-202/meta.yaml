    \ Basics\n\nA function is declared using the `function` keyword, followed by a\
    \ name, a list of parameters enclosed in parentheses `()`, and a block of code\
    \ enclosed in curly braces `{}`.\n\n```\nfunction functionName(parameters) {\n\
    \    // Code to be executed\n}\n```\n\n**Example:**"
  - "[PAGE 46]\n\n```\nfunction sayHello() {\n    console.log(\"Hello!\");\n}\n```\n\
    \nTo invoke or call the function, you use the function name followed by parentheses:\n\
    \n```\nsayHello(); // Outputs: Hello!\n```\n\n# 4.1.2 Parameters and Arguments\n\
    \nFunctions can take parameters. Parameters act as variables that the function\
    \ uses to perform its task. When a function is called, you can pass values to\
    \ these parameters. These values are known as arguments.\n\n**Example:**\n\n```\n\
    function greet(name) {\n    console.log(\"Hello, \" + name + \"!\");\n}\n\ngreet(\"\
    Alice\"); // Outputs: Hello, Alice!\n```\n\nIn this example, `name` is a parameter\
    \ of the `greet` function, and `\"Alice\"` is the argument passed to the function."
  - "[PAGE 47]\n\n# 4.1.3 Function Return Values\n\nFunctions can return values using\
    \ the `return` statement. Once a return statement is executed, the function stops\
    \ executing and returns the specified value.\n\nExample:\n\n```\nfunction sum(a,\
    \ b) {\n  return a + b;\n}\n\nlet result = sum(5, 3);\nconsole.log(result); //\
    \ Outputs: 8\n```\n\nIf a function doesn't specify a return value, it returns\
    \ `undefined` by default.\n\n# 4.1.4 Immediate Invocation and Functions as First-Class\
    \ Citizens\n\nFunctions in JavaScript are first-class citizens, meaning they can\
    \ be treated like any other value—they can be assigned to variables, passed as\
    \ arguments to other functions, and even returned from functions.\n\n**Immediately\
    \ Invoked Function Expression (IIFE):**\n\nAn IIFE is a function that runs as\
    \ soon as it is defined."
