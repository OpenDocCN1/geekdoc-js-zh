    \ // John\nconsole.log(person.addresses[0].city); // Anytown\n```\n\n### 6.3.3\
    \ Iterating through Objects with `for...in` and `Object.keys()`\n\nTo iterate\
    \ over the properties of an object, you can use the `for...in` loop or the `Object.keys()`\
    \ method.\n\nUsing `for...in`:\n\n```javascript\nfor(const key in person) {\n\
    \  console.log(`${key}: ${person[key]}`);\n}\n```\n\nUsing `Object.keys()`:\n\n\
    ```javascript\nObject.keys(person).forEach(key => {\n  console.log(`${key}: ${person[key]}`);\n\
    });\n```\n\nThese approaches provide a way to dynamically access and manipulate\
    \ object properties.\n\n### 6.3.4 Destructuring Objects\n\nDestructuring provides\
    \ a way to unpack properties from objects into distinct variables.\n\n```javascript\n\
    const { firstName, lastName } = person;\nconsole.log(firstName); // John\nconsole.log(lastName);\
    \ // Doe\n```\n\nYou can also provide new variable names while destructuring.\n\
    \n```javascript\nconst { firstName: first, lastName: last } = person;\nconsole.log(first);\
    \ // John\nconsole.log(last); // Doe\n```\n\nDestructuring can greatly simplify\
    \ the process of working with objects, making the code cleaner and easier to read.\n\
    \nUnderstanding objects and their manipulation is crucial in JavaScript as they\
    \ form the backbone of data representation. From simple key-value pairs to complex\
    \ nested objects, mastering objects allows developers to organize and process\
    \ data efficiently.\n\n## 6.4 Accessing Object Properties: Dot vs. Bracket Notation\n\
    \nTwo primary ways to access properties of JavaScript objects are dot notation\
    \ and bracket notation. Understanding when and how to use each can help you efficiently\
    \ work with objects and their properties.\n\n### 6.4.1 When to Use Dot Notation\n\
    \nDot notation is the most common and straightforward way to access a property\
    \ of an object. It's preferable for its readability and simplicity.\n\n```javascript\n\
    const person = {\n  name: \"John Doe\",\n  age: 30\n};\n\nconsole.log(person.name);\
    \ // Outputs: John Doe\nconsole.log(person.age); // Outputs: 30\n```\n\nDot notation\
    \ should be used when:\n\n-   The property name is known ahead of time and it's\
    \ a valid JavaScript identifier.\n- You are accessing static properties that don't\
    \ require dynamic evaluation.\n\n### 6.4.2 When to Use Bracket Notation\n\nBracket\
    \ notation offers more flexibility than dot notation but can be slightly more\
    \ verbose. It allows the use of characters that aren't allowed in identifiers,\
    \ such as spaces or starting with digits. Additionally, bracket notation is essential\
    \ when property names are determined dynamically.\n\n```javascript\nconst person\
    \ = {\n  \"full name\": \"John Doe\",\n  age: 30\n};\n\nconsole.log(person[\"\
    full name\"]); // Outputs: John Doe\nconsole.log(person[\"age\"]); // Outputs:\
    \ 30\n```\n\nUse bracket notation when:\n\n-   The property name contains special\
    \ characters or spaces.\n-   The property name starts with a digit.\n-   The property\
    \ name is stored in a variable or needs to be computed.\n\n### 6.4.3 Dynamic Property\
    \ Names\n\nBracket notation shines when working with properties that are dynamically\
    \ determined (for instance, based on user input or runtime values).\n\n```javascript\n\
    const key = 'name';\nconst person = {\n  [key]: \"John Doe\"\n};\n\nconsole.log(person[key]);\
    \ // Outputs: John Doe\n```\n\nThis capability is particularly useful in scenarios\
    \ requiring flexibility, such as iterating over keys in an object or accessing\
    \ properties based on variable inputs.\n\n### 6.4.4 Property Existence and Enumeration\n\
    \nTo check if an object has a specific property, you can use the `in` operator\
    \ or `Object.hasOwnProperty()` method.\n\n```javascript\nif ('name' in person)\
    \ {\n  console.log(\"The person has a name.\");\n}\n\n\nif (person.hasOwnProperty('age'))\
    \ {\n  console.log(\"The person has an age.\");\n}\n```\n\nTo enumerate (list)\
    \ an object's properties, you can use `Object.keys()`, `Object.values()`, or `Object.entries()`\
