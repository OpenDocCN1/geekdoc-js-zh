    # 10.1 Introduction to the DOM (Document Object Model)


    # 10.1.1 What is the DOM?


    The Document Object Model (DOM) is a programming interface provided by the browser
    that allows scripts to dynamically access and update the content, structure, and
    style of a webpage. Essentially, the DOM represents the document as a hierarchical
    tree of objects that can be manipulated programmatically. Every element of the
    page is part of this object tree and can be accessed using the DOM API.


    # 10.1.2 DOM Tree and Nodes


    The DOM organizes a webpage''s structure as a tree of nodes, where each node represents
    a part of the document. This tree includes everything from the root document node
    to individual text nodes:'
  merge: -1
  pgno: 166
- img_proc: true
  md: '+   - **Document Node:** The root node that represents the entire HTML document.

    - **Element Nodes:** Represent HTML elements (`<div>`, `<header>`, `<p>`, etc.)
    and serve as containers for other types of nodes.

    - **Text Nodes:** Contain the text within HTML elements and are always leaf nodes
    since they cannot contain any other node.

    - **Attribute Nodes:** No longer considered part of the DOM tree in modern DOM
    specifications. Attributes are now properties of element nodes.


    # ### 10.1.3 Accessing the DOM in JavaScript


    Accessing the DOM is typically done using JavaScript, which provides various methods
    to select nodes from the DOM tree:


    +   - `document.getElementById(id)`: Selects a single element node by its `id`
    attribute.

    - `document.getElementsByTagName(tagName)`: Returns a live collection of elements
    with the specified tag name.

    - `document.getElementsByClassName(className)`: Returns retard collection of elements
    that have the specified class name.

    - `document.querySelector(selector)`: Returns the first element that matches a
    specified CSS selector.

    - `document.querySelectorAll(selector)`: Returns a NodeList of all elements matching
    the specified CSS selector.'
