    \nJavaScript 提供了多种范本来创建对象并促进继承，每种都有独特的细微差别和用例。理解这些差异对于编写健壮且可维护的代码至关重要。\n\n###\
    \ 7.3.1 使用构造函数创建对象\n\n构造函数是在 JavaScript 中创建新对象的传统方法。这些函数使用 `this` 键字将属性分配给将在调用构造函数时创建的（带有\
