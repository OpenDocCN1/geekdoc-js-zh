    \ XHR 对于维护旧代码库或在某些 Fetch 可能不可用的特定用例中很重要。\n\n## 8.2.3 处理网络错误与 Fetch API 的局限性\n\n\
    虽然 Fetch 简化了 HTTP 请求的发起，但处理潜在错误并了解其局限性至关重要。一个常见的误解是 Fetch 仅在网络错误时才会拒绝其 Promise，而不是针对\
    \ HTTP 错误状态（例如 404 或 500）。\n\n要正确处理错误（包括 HTTP 状态错误）：\n\n```\nfetch('https://api.example.com/might-not-exist')\n\
    \  .then(response => {\n    if (!response.ok) {\n      throw new Error('Network\
    \ response was not ok');\n    }\n    return response.json();\n  })\n  .catch(error\
    \ => console.error('There has been a problem with your fetch operation:', error));\n\
    ```\n\n## 8.2.4 超越 GET 请求：POST、PUT、DELETE\n\nFetch 可以处理所有类型的 HTTP 请求，包括 POST、PUT\
