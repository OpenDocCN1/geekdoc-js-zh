    \n## 8.2.5 处理 Headers 和 CORS\n\nHTTP 请求中的 Headers 允许客户端在请求或响应中传递附加信息。例如，Headers\
    \ 可用于指定内容类型、身份验证令牌或 CORS（跨源资源共享）策略。\n\n跨源资源共享（CORS）是一种安全机制，它限制了网页上的资源如何从提供第一个资源的域名之外的另一个域名进行请求。当使用\
    \ API 或执行 POST、PUT 或 DELETE 操作时，如果服务器未配置为允许来自你域名的请求，通常会遇到 CORS 错误。\n\n管理 Headers\
