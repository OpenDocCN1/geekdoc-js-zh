    \n```javascript\nconsole.log(Object.keys(person)); // ['name', 'age']\nconsole.log(Object.values(person));\
    \ // ['John Doe', 30]\nconsole.log(Object.entries(person)); // [['name', 'John\
    \ Doe'], ['age', 30]]\n```\n\nSelecting the appropriate notation and understanding\
    \ property existence and enumeration allows for more effective object manipulation\
    \ and querying within your JavaScript applications.\n\n## Deeper into Objects\n\
    \n### 7.1 Introduction to Object-Oriented JavaScript\n\nObject-Oriented Programming\
    \ (OOP) is a programming paradigm based on the concept of \"objects\", which can\
    \ contain data in the form of fields (often known as attributes or properties)\
    \ and code in the form of procedures (often known as methods). JavaScript supports\
    \ OOP through its prototypes and includes support for classical OOP concepts using\
    \ classes as of ES6 (ECMAScript 2015).\n\n### 7.1.1 The Pillars of Object-Oriented\
    \ Programming\n\nThe four foundational pillars of Object-Oriented Programming\
    \ include:\n\n1.  **Encapsulation:** This principle is about bundling the data\
    \ and the methods that operate on the data under a single unit called an \"object\"\
    . It allows for restricting access to some of the object's components, which is\
    \ the first step towards data abstraction and control.\n2.  **Abstraction:** Abstraction\
    \ means hiding the complex reality while exposing only the necessary parts. It\
    \ helps in reducing programming complexity and effort by providing a simplified\
    \ model of an entity that highlights its behavior in the context of its interaction.\n\
    3.  **Inheritance:** This is a mechanism that allows one class to acquire the\
    \ properties (methods and fields) of another. With inheritance, you can create\
    \ a general class and then extend it to more specialized classes.\n4.  **Polymorphism:**\
    \ Polymorphism allows entities to be represented in multiple forms. It is the\
    \ ability to call the same method on different objects and have each of them respond\
    \ in their own way.\n\n### 7.1.2 Objects and Classes in JavaScript\n\nIn JavaScript,\
    \ traditionally, the object's prototype has been the primary method for adding\
    \ methods and attributes. However, ECMAScript 6 introduced classes which added\
    \ a thin layer of abstraction over the prototype-based inheritance, making it\
    \ easier to implement complex object structures.\n\nExample:\n\n```javascript\n\
    class Person {\n    constructor(name, age) {\n        this.name = name;\n    \
    \    this.age = age;\n    }\n\n    introduce() {\n        console.log(`My name\
    \ is ${this.name} and I am ${this.age} years old.`);\n    }\n}\n\nconst john =\
    \ new Person('John Doe', 30);\njohn.introduce(); // My name is John Doe and I\
    \ am 30 years old.\n```\n\n### 7.1.3 Encapsulation and Information Hiding\n\n\
    JavaScript classes support encapsulation by integrating data (properties) and\
    \ functions (methods) that operate on data into a single unit called a class.\
    \ However, until recent additions (like private class fields), JavaScript did\
    \ not directly support the hiding of data. This has usually been accomplished\
    \ using closures or the newer private fields syntax.\n\nExample using private\
    \ fields:\n\n```javascript\nclass Person {\n  #name;\n  #age;\n\n  constructor(name,\
    \ age) {\n    this.#name = name;\n    this.#age = age;\n  }\n\n  introduce() {\n\
    \    console.log(`My name is ${this.#name} and I am ${this.#age} years old.`);\n\
    \  }\n\n  // Getter and Setter methods can be used to access private fields\n\
    \  get name() {\n    return this.#name;\n  }\n\n  set name(newName) {\n    this.#name\
    \ = newName;\n  }\n}\n```\n\n### 7.1.4 Methods and \"this\" Context in Classes\n\
    \nMethods are actions that can be performed on objects, and JavaScript methods\
    \ are stored in properties as function definitions.\n\nThe `this` keyword in a\
    \ method refers to the \"owner\" of the method. In the context of a class, `this`\
    \ refers to an instance of the class (an object).\n\nHowever, the value of `this`\
    \ is not bound until a method is called. This can lead to errors when passing\
    \ methods as callbacks if they rely on `this`. Arrow functions can be used to\
    \ automatically bind `this` to the scope of where the function is defined, not\
    \ where it is used.\n\nUnderstanding these concepts is crucial for effectively\
    \ utilizing Object-Oriented Programming techniques in JavaScript, ultimately leading\
    \ to more structured and manageable code.\n\n## 7.2 Understanding the \"this\"\
    \ Keyword\n\nThe `this` keyword in JavaScript is a powerful feature that, when\
    \ understood, greatly enhances the flexibility and capabilities of your code.\
    \ It refers to the object it belongs to, making it context-dependent. Its value\
    \ can change depending on how a function is called."
  mdcn: "\n## 6.3.2 嵌套对象\n\n对象可以包含其他对象，从而能够创建复杂的数据结构。\n\n```javascript\nconst person\
    \ = {\n  name: {\n    first: \"John\",\n    last: \"Doe\",\n  },\n  addresses:\
    \ [\n    { street: \"123 Main St\", city: \"Anytown\" },\n    { street: \"234\
    \ Elm St\", city: \"Somewhere\" }\n  ]\n};\n```\n\n可以通过点号或方括号表示法链来访问嵌套对象。\n\n\
    ```javascript\nconsole.log(person.name.first); // John\nconsole.log(person.addresses[0].city);\
    \ // Anytown\n```\n\n### 6.3.3 使用 `for...in` 和 `Object.keys()` 遍历对象\n\n要遍历对象的属性，可以使用\
