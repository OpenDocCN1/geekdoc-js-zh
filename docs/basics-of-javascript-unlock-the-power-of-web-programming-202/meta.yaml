    # 5.2.3 Cloning Objects and Arrays to Preserve State


    To prevent unwanted side effects by modifying objects or arrays passed by reference,
    cloning or copying them before manipulation is crucial.


    +   - **Shallow Cloning** can be achieved using `Object.assign()` or the spread
    syntax `...` for objects, and `Array.slice()` or the spread syntax for arrays.
    However, this method only copies the top layer, leaving nested objects or arrays
    still referencing the original.


    ```

    let obj = { a: 1, b: { c: 2 } };

    let clone = { ...obj };

    clone.b.c = 3;

    console.log(obj.b.c); // Output: 3 (nested objects are still referenced)

    ```


    +   - **Deep Cloning** can be performed using libraries like Lodash''s `_.cloneDeep()`
    method, or manually implementing recursive cloning functions. It ensures that
    no references to the original object remain.'
