    \        },\n        decrement() {\n            count--;\n            console.log(count);\n\
    \        },\n    };\n}\n\nconst counter = createCounter();\ncounter.increment();\
    \ // 1\ncounter.increment(); // 2\ncounter.decrement(); // 1\n```\n\n使用ES6，JavaScript引入了一种更正式的方式来定义私有字段，使用井号`#`前缀：\n\
    \n```javascript\nclass Counter {\n  #count = 0;\n  increment() {\n    this.#count++;\n\
    \    console.log(this.#count);\n  }\n  decrement() {\n    this.#count--;\n   \
    \ console.log(this.#count);\n  }\n}\n```\n\n### 7.5.4 对象不可变性与只读属性\n\n使对象不可变（创建后无法更改）是一项强大的技术，尤其在函数式编程和创建可预测状态管理中。要使属性只读，你可以使用\
    \ `Object.defineProperty()` 或 `Object.defineProperties()`：\n\n```javascript\n\
    const obj = {};\nObject.defineProperty(obj, 'readOnly', {\n  value: 'This is read-only',\n\
    \  writable: false, // 防止属性被写入。\n});\n\nconsole.log(obj.readOnly); // 'This is\
    \ read-only'\n// obj.readOnly = 'New Value'; 在严格模式下尝试写入此属性将会失败。\n```\n\n对于深度不可变性，你可以使用\
    \ `Object.freeze()` 递归地冻结对象，尽管应注意这默认是浅层操作。\n\n采用这些高级模式和技术有助于编写更健壮、模块化且可维护的JavaScript代码。它们使开发者能够充分利用JavaScript面向对象能力的全部潜力，同时在大型代码库中管理复杂性。\n\
    \n## 异步JavaScript\n\n### 8.1 理解异步JavaScript\n\n异步JavaScript使得执行长时间运行的操作不会阻塞主线程，从而允许响应式用户界面。理解JavaScript中用于处理异步操作的核心概念和工具对于现代Web开发至关重要。\n\
    \n#### 8.1.1 事件循环与非阻塞I/O\n\nJavaScript是单线程的，这意味着它一次只能执行一段代码。事件循环是一种机制，允许JavaScript执行非阻塞I/O操作——如读取文件或发起HTTP请求——只要可能，就将操作卸载到系统内核。\n\
    \n当这些操作完成时，它们作为事件返回给JavaScript。事件循环持续检查消息队列中的这些完成事件，并在它们到达时处理其回调函数。这种模型允许JavaScript在等待异步操作完成时执行其他任务。\n\
    \n#### 8.1.2 使用回调函数\n\n回调是作为参数传递给另一个函数的函数，该函数在异步操作完成时执行回调。虽然回调有助于管理异步操作，但它们可能导致“回调地狱”或“末日金字塔”，即回调嵌套在回调中，使代码难以阅读和维护。\n\
    \n```javascript\nfunction fetchData(callback) {\n  setTimeout(() => {\n    callback('Data\
    \ loaded');\n  }, 1000);\n}\n\nfetchData((data) => {\n  console.log(data); //\
    \ Data loaded\n});\n```\n\n### 8.1.3 Promise：创建与链式调用\n\nPromise是一个表示异步操作最终完成（或失败）的对象。\n\
    与回调相比，Promise提供了一种更清晰、更灵活的方式来处理异步操作。\n\n你可以链接 `.then()` 调用来处理一系列异步操作，从而编写出既可读性更强又更易于维护的代码。此外，`.catch()`\
    \ 提供了一种集中的错误处理方式。\n\n```javascript\nfunction fetchData() {\n  return new Promise((resolve,\
    \ reject) => {\n    setTimeout(() => resolve('Data loaded'), 1000);\n  });\n}\n\
    \nfetchData()\n  .then(data => console.log(data)) // Data loaded\n  .catch(error\
    \ => console.error(error));\n```\n\n### 8.1.4 Async/Await 用于异步流程控制\n\n`async`/`await`\
    \ 简化了使用 Promise 所需的语法，使异步代码看起来更像同步代码，从而更容易理解和调试。\n\n```javascript\nasync function\
    \ fetchData() {\n  let data = await new Promise((resolve, reject) => {\n    setTimeout(()\
    \ => resolve('Data loaded'), 1000);\n  });\n  console.log(data); // Data loaded\n\
    }\n\nfetchData();\n```\n\n#### 8.1.5 异步JavaScript中的错误处理\n\n正确的错误处理对于异步JavaScript的可靠性和可维护性至关重要。使用回调时，错误需要在每个回调内手动处理。Promise\
    \ 和 `async`/`await` 分别通过 `.catch()` 和 `try`/`catch` 块提供了更简洁的错误处理。\n\n```javascript\n\
    async function fetchDataWithErrorHandling() {\n  try {\n    let data = await new\
    \ Promise((resolve, reject) => {\n      setTimeout(() => reject(new Error('Error\
    \ fetching data')), 1000);\n    });\n  } catch (error) {\n    console.error(error.message);\
    \ // Error fetching data\n  }\n}\n\nfetchDataWithErrorHandling();\n```\n\n理解这些概念并有效利用JavaScript提供的处理异步操作的工具，是开发现代Web应用的基本技能。\n\
    \n### 8.2 发起HTTP请求\n\n发起HTTP请求是Web开发的一个基础方面，使客户端代码能够与服务器、API和其他Web服务进行通信。理解如何有效地发起和管理这些请求对于创建动态的、数据驱动的Web应用至关重要。\n"
