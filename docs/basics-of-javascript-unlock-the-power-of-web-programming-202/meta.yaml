    # **7.1.4 Methods and "this" Context in Classes**


    Methods are actions that can be performed on objects, and JavaScript methods are
    stored in properties as function definitions.


    The `this` keyword in a method refers to the "owner" of the method. In the context
    of a class, `this` refers to an instance of the class (an object).


    However, the value of `this` is not bound until a method is called. This can lead
    to errors when passing methods as callbacks if they rely on `this`. Arrow functions
    can be used to automatically bind `this` to the scope of where the function is
    defined, not where it is used.


    Understanding these concepts is crucial for effectively utilizing Object-Oriented
    Programming techniques in JavaScript, ultimately leading to more structured and
    manageable code.


    # **7.2 Understanding the "this" Keyword**


    The `this` keyword in JavaScript is a powerful feature that, when understood,
    greatly enhances the flexibility and capabilities of your code. It refers to the
    object it belongs to, making it context-dependent. Its value can change depending
    on how a function is called.'
- md: "\n\n## 7.2.1 \"this\" in Global and Function Scopes\n\nIn the global execution\
    \ context (outside of any function), `this` refers to the global object whether\
    \ in strict mode or not. In web browsers, the global object is `window`.\n\n```javascript\n\
    console.log(this === window); // true\n```\n\nIn a regular (non-arrow) function,\
    \ `this` is set dynamically when the function is called. In the global scope or\
    \ inside a function not associated with any object, `this` refers to the global\
    \ object in non-strict mode and is `undefined` in strict mode.\n\n```javascript\n\
    function show() {\n    console.log(this === window); // true in non-strict mode,\
    \ false in strict mode\n}\nshow();\n```\n\n## 7.2.2 \"this\" in Methods and Constructors\n\
    \nWhen a method is called as a property of an object, `this` points to the object\
    \ the method is called on. In constructors (functions or classes intended to be\
    \ used with the `new` keyword), `this` refers to the newly created object instance.\n\
    \n```javascript\nfunction Person(name) {\n  this.name = name;\n  this.introduce\
    \ = function() {\n    console.log(`My name is ${this.name}`);\n  };\n}\n\nconst\
    \ john = new Person('John');\njohn.introduce(); // My name is John\n```\n\n##\
    \ 7.2.3 \"this\" with Call, Apply, and Bind\n\n`call`, `apply`, and `bind` are\
    \ methods that allow you to set the value of `this` manually when invoking a function.\n\
    \n- **call()** allows you to invoke a function with a specified `this` value and\
    \ arguments provided individually.\n- **apply()** is similar to `call` but takes\
    \ an array of arguments.\n- **bind()** returns a new function, allowing you to\
    \ set the `this` value permanently.\n\n## 7.2.4 Arrow Functions and Lexical \"\
    this\"\n\nArrow functions do not have their own `this` context; instead, they\
    \ capture the `this` value of the enclosing scope at the time they are created.\
    \ This is known as lexical scoping.\n\n```javascript\nconst person = {\n  name:\
    \ 'John',\n  introduceLater: function() {\n    setTimeout(() => {\n      console.log(`My\
    \ name is ${this.name}`);\n    }, 1000);\n  }\n};\nperson.introduceLater(); //\
    \ My name is John, after 1 second\n```\n\nBecause of the lexical scoping of `this`\
    \ in arrow functions, they are particularly useful for callbacks, where you want\
    \ `this` to refer to the outer context.\n\nUnderstanding the behavior of `this`\
    \ allows for more flexible, object-oriented programming in JavaScript, letting\
    \ developers explicitly define and control the context of their code executions.\n\
    \n## 7.3 Constructors and Object Instances\n\nJavaScript provides multiple paradigms\
    \ to create objects and facilitate inheritance, each with its nuances and use\
    \ cases. Understanding these differences is crucial for crafting robust and maintainable\
    \ code.\n\n### 7.3.1 Creating Objects with Constructor Functions\n\nConstructor\
    \ functions are a conventional means to create new objects in JavaScript. These\
    \ functions use the `this` keyword to assign properties to the object that will\
    \ be created when the function is invoked with the `new` keyword.\n\n```javascript\n\
    function Person(name, age) {\n  this.name = name;\n  this.age = age;\n  this.introduce\
    \ = function() {\n    console.log(`My name is ${this.name} and I am ${this.age}\
    \ years old.`);\n  };\n}\n\nconst alice = new Person('Alice', 30);\nalice.introduce();\
    \ // Output: My name is Alice and I am 30 years old.\n```\n\n### 7.3.2 The \"\
    new\" Keyword and Its Effects\n\nUsing the `new` keyword with a constructor function\
    \ does several things:\n\n1. It creates a new, empty object.\n2. It sets the `this`\
    \ context of the constructor function to point to the newly created object.\n\
    3. It executes the body of the constructor, adding properties and methods to the\
    \ new object.\n4. It sets the prototype of the new object to the constructor function's\
    \ `prototype` property.\n5. It returns the newly created object (unless the constructor\
    \ explicitly returns a different, non-primitive object).\n\n### 7.3.3 Factory\
    \ Functions vs. Constructors\n\nUnlike constructor functions, factory functions\
    \ typically do not use the `new` keyword or `this`. Instead, they create and return\
    \ a new object explicitly. Factory functions can offer a more flexible way to\
    \ create objects, as they can return any object and use any prototype for that\
    \ object.\n\n```javascript\nfunction createPerson(name, age) {\n  return {\n \
    \   name: name,\n    age: age,\n    introduce() {\n      console.log(`My name\
    \ is ${this.name} and I am ${this.age} years old.`);\n    }\n  };\n}\n\nconst\
    \ bob = createPerson('Bob', 25);\nbob.introduce(); // Output: My name is Bob and\
    \ I am 25 years old.\n```\n\n### 7.3.4 Constructor Inheritance with \"call\" and\
    \ \"apply\"\n\nInheritance can be implemented in constructors through the use\
    \ of the `call` or `apply` methods, allowing one constructor function to call\
    \ another constructor function within it, setting up the context (`this`) to the\
    \ newly created object.\n\n```javascript\nfunction Person(name, age) {\n  this.name\
    \ = name;\n  this.age = age;\n}\n\nfunction Employee(name, age, jobTitle) {\n\
    \  Person.call(this, name, age); // The `Person` constructor is called with the\
    \ new object's context.\n  this.jobTitle = jobTitle;\n}\n\nconst employee1 = new\
    \ Employee('Eve', 28, 'Developer');\nconsole.log(employee1); // Output: Employee\
    \ {name: \"Eve\", age: 28, jobTitle: \"Developer\"}\n```\n\nUsing `call` or `apply`\
    \ within constructors provides a powerful method for one type to inherit the characteristics\
    \ of another, making it possible to mimic classical inheritance patterns found\
    \ in other object-oriented programming languages.\n\nUnderstanding these mechanisms\
    \ for creating and inheriting between objects is foundational for working effectively\
    \ with JavaScript's dynamic and flexible object system.\n\n## 7.4 Prototypes and\
    \ Inheritance\n\nJavaScript employs a prototype-based model for inheritance, a\
    \ distinct approach compared to the class-based inheritance seen in many other\
    \ languages. This model allows objects to inherit properties and methods from\
    \ other objects.\n\n### 7.4.1 Understanding Prototypes in JavaScript\n\nIn JavaScript,\
    \ every function and object has a property named `prototype`, except for the `null`\
    \ object, which is the end of the prototype chain. When a function is used as\
    \ a constructor with the `new` keyword, the newly created object inherits properties\
    \ and methods from the constructor function's `prototype`.\n\nThe `prototype`\
    \ property is a mechanism whereby JavaScript objects inherit features from one\
    \ another. For instance, JavaScript arrays inherit from `Array.prototype`, enabling\
    \ all arrays to utilize methods like `map`, `filter`, and `reduce`.\n\n### 7.4.2\
    \ Prototype Chain and Inheritance\n\nThe prototype chain is a series of links\
    \ between objects where each object references its prototype parent. When accessing\
    \ a property or method of an object, JavaScript first searches the object itself.\
    \ If it doesn't find it, it searches the object's prototype, then the prototype's\
    \ prototype, and so on, until it reaches `null`. This chain is the foundation\
    \ of inheritance in JavaScript.\n\nFor example, suppose we have an object `O`\
    \ that inherits from `Prototype B`, which in turn inherits from `Prototype A`.\
    \ If a property is not found on `O`, the search moves to `B`, and if not found\
    \ on `B`, it continues to `A`.\n\n### 7.4.3 Shadowing Prototype Properties\n\n\
    Shadowing occurs when a property added to an object has the same name as one in\
    \ the object's prototype chain. The property on the object \"shadows\" the one\
    \ on the prototype, meaning the prototype's property won't be accessed directly\
    \ through the object if a property with the same name exists on the object itself.\n\
    \nThis can be useful, but it's also something to be aware of, as it can lead to\
    \ unexpected behavior if you accidentally shadow prototypes properties.\n\n```javascript\n\
    function Person() {}\nPerson.prototype.name = \"Anonymous\";\n\nconst person =\
    \ new Person();\nconsole.log(person.name); // Anonymous\n\nperson.name = \"John\"\
    ; console.log(person.name); // John - The property on the instance shadows the\
    \ prototype's property.\n```\n\n### 7.4.4 Prototypical Inheritance Patterns\n\n\
    There are several patterns for implementing inheritance in JavaScript using prototypes:\n\
    \n- **Constructor Pattern**: Using constructor functions and the `new` keyword,\
    \ as mentioned earlier.\n- **Prototype Pattern**: Directly manipulating the `prototype`\
    \ of constructors for inheritance.\n- **Object.create()**: A modern approach where\
    \ you can create a new object with the specified prototype object and properties."
