  md: '# # 7.1.1 The Pillars of Object-Oriented Programming


    The four foundational pillars of Object-Oriented Programming include:


    +   1. **Encapsulation:** This principle is about bundling the data and the methods
    that operate on the data under a single unit called an "object". It allows for
    restricting access to some of the object''s components, which is the first step
    towards data abstraction and control.

    2. **Abstraction:** Abstraction means hiding the complex reality while exposing
    only the necessary parts. It helps in reducing programming complexity and effort
    by providing a simplified model of an entity that highlights its behavior in the
    context of its interaction.

    3. **Inheritance:** This is a mechanism that allows one class to acquire the properties
    (methods and fields) of another. With inheritance, you can create a general class
    and then extend it to more specialized classes.

    4. **Polymorphism:** Polymorphism allows entities to be represented in multiple
    forms. It is the ability to call the same method on different objects and have
    each of them respond in their own way.


