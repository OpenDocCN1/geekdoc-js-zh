    # 4.4 Scope: Understanding Local vs. Global


    Scope is a fundamental concept in JavaScript, determining the accessibility of
    variables and functions in various parts of your code. Understanding scope is
    essential for managing the lifecycle of variables and avoiding conflicts and bugs.


    # 4.4.1 What is Scope?


    Scope in JavaScript refers to the context in which a variable or function is accessible.
    JavaScript has three main types of scope:

    - **Global Scope:** Variables defined in the global scope are accessible from
    any part of the code.

    - **Function (Local) Scope:** Variables defined within a function are only accessible
    within that function.

    - **Block Scope:** Variables defined inside a block `{}` are only accessible within
    that block. This concept applies when using `let` and `const` keywords.'
