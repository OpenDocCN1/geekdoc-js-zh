  md: '# 9.5.3 WeakMap and WeakSet: Handling References Lightly


    WeakMap and WeakSet are variants of the Map and Set collections designed for scenarios
    where only weak references to the keys are maintained. This allows items in these
    collections to be garbage-collected if there are no other references to them:


    +   - **WeakMap** allows garbage collection for key-value pairs when keys are
    no longer referenced.

    - **WeakSet** allows the collection''s values to be garbage-collected if they
    are not referenced elsewhere.


    These structures are useful in situations where memory management is a concern,
    such as when dealing with DOM nodes in web applications.


    ```

    let weakMap = new WeakMap();

    let obj = {};


    weakMap.set(obj, { key: "value" });


    console.log(weakMap.get(obj)); // { key: "value" }


    obj = null; // allows the entry in weakMap to be garbage collected

    ```'
