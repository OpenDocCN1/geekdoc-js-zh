    \n理解这些创建对象和对象间继承的机制对于有效使用 JavaScript 的动态和灵活的对象系统是基础。\n\n## 7.4 原型与继承\n\nJavaScript\
    \ 采用基于原型的继承模型，这是一种与其他许多语言中看到的类继承不同的方法。这种模型允许对象从其他对象继承属性和方法。\n\n### 7.4.1 理解 JavaScript\
    \ 中的原型\n\n在 JavaScript 中，每个函数和对象都有一个名为 `prototype`的属性（除了`null`对象，它是原型链的末端）。当使用\
    \ `new` 键字将函数用作构造函数时，新创建的对象从构造函数函数的 `prototype`继承属性和方法。\n\n`prototype` 属性是 JavaScript\
    \ 对象相互继承特性的机制。例如，JavaScript 数组从 `Array.prototype` 继承，使得所有数组都可以使用 `map`、`filter`\
    \ 和 `reduce` 等方法。\n\n### 7.4.2 原型链与继承\n\n原型链是一系列对象之间的链接，每个对象都引用其原型父对象。在访问对象的属性或方法时，JavaScript\
    \ 首先搜索该对象本身。如果找不到它，它将搜索对象的`prototype`，然后是原型的`prototype`，依此类推，直到到达 `null`。此链是 JavaScript\
    \ 继承的基础。\n\n例如，假设我们有一个对象 `O` 继承自原型 `B`，而后者又继承了原型 `A`。如果在 `O`上找不到属性，搜索将移动到`B`，如果\
    \ `B`上也未找到，则继续到`A`。\n\n### 7.4.3 原型属性遮蔽\n\n当添加到对象的属性名称与对象原型链中的名称相同时，就会发生遮蔽。对象上的属性\"\
    遮蔽\"了原型上的属性，意味着如果对象本身存在同名属性，则不会直接通过对象访问原型属性。\n\n这可能会有用，但也需要注意，因为不小心遮蔽原型属性会导致意外行为。\n\
    \n```javascript\nfunction Person() {}\nPerson.prototype.name = \"Anonymous\";\n\
    \nconst person = new Person();\nconsole.log(person.name); // Anonymous\n\nperson.name\
    \ = \"John\"; console.log(person.name); // John - The property on the instance\
    \ shadows the prototype's property.\n```\n\n### 7.4.4 基于原型的继承模式\n\n在 JavaScript\
    \ 中使用原型实现继承有几种模式：\n\n- **构造函数模式**：使用之前提到的构造函数和 `new` 键字。\n- **原型模式**：为了继承直接操作构造函数的\
    \ `prototype`。\n- **Object.create()**：一种现代方法，您可以创建具有指定原型对象和属性的新对象。\n"
