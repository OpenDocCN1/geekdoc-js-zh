  md: '# 4.2.4 Hoisting in Functions


    Hoisting is a JavaScript mechanism where variables and function declarations are
    moved to the top of their containing scope before code execution. However, this
    behavior differs between function declarations and expressions.


    +   - **Function Declarations:** Are fully hoisted, meaning the entire function
    is moved to the top of its scope and can be used before it''s declared in the
    source code.


    +   - **Function Expressions:** The variable declaration is hoisted, but not the
    function assignment. If you try to invoke a function expression before its definition,
    you''ll encounter an error as the function will not be defined yet.'
