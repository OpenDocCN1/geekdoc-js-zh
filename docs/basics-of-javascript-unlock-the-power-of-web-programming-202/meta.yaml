  md: '# 2.1.2 The Distinction Between Values and Variables


    Understanding the distinction between values and variables is crucial for effective
    programming in JavaScript. A value is an immutable piece of data held in memory.
    When we use a value in a program, we are directly referring to that data.


    Variables, however, are mutable references to values. A variable does not “contain”
    the data; it merely points to the value in memory. This distinction matters when
    we start performing operations on variables or when we assign a new value to a
    variable. The content of the memory location pointed to by the variable can change,
    but the value itself (for example, the number `42` or the string `"hello"`) is
    immutable.


    # 2.1.3 Declaring Variables in JavaScript


    JavaScript provides three keywords for declaring variables: `var`, `let`, and
    `const`.


    +   - **var**: Before ES6 (ECMAScript 2015), `var` was the only way to declare
    a variable in JavaScript. Variables declared with `var` have function scope or
    are globally scoped if declared outside of a function. One of the downsides is
    that `var` declarations can lead to confusion due to variable hoisting.

    - **let**: Introduced in ES6, `let` allows developers to declare block-scoped
    variables, significantly improving code manageability by confining the variable''s
    scope to the block in which it is declared.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '+   - **const**: Also introduced in ES6, `const` is used to declare variables
    meant to be constants or whose value should not change through reassignment. Like
    `let`, `const` is block-scoped.


    To declare a variable, you specify the keyword followed by the variable name:
    `let age = 30;`


    # ### 2.1.4 Variable Naming Conventions and Best Practices


    When naming variables in JavaScript, there are several conventions and best practices
    to follow:


    +   - Use descriptive and meaningful names that clearly indicate what data the
    variable represents. For example, use `userName` instead of `str` or `n`.


    +   - Stick to camelCase for variable names (e.g., `userProfile`, `isLoading`).


    +   - For `const` variables that hold constant values, it''s common to use UPPER_CASE
    with underscores (e.g., `MAX_USERS`, `API_KEY`).


    +   - Avoid using JavaScript reserved words (like `new`, `class`, `function`)
    as variable names.


    +   - Keep name length reasonable. While descriptive names are good, overly long
    names can make your code harder to read.


    Following these conventions and best practices not only makes your code more readable
    but also helps avoid some common pitfalls related to variable declaration and
    naming in JavaScript.'
