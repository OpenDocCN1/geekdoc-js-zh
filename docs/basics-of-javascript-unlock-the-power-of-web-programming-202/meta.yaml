    \ are not hoisted, meaning they cannot be called before they are defined in the\
    \ code.\n\n# Syntax:\n\n```\nconst myFunction = function() {\n  // Function body\n\
    };\n```\n\n# Example:\n\n```\nconst greet = function(name) {\n  console.log(\"\
