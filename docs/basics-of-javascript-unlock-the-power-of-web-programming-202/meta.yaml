    # 4.3.3 Limitations and Features


    While arrow functions have several advantages, they come with limitations:


    +   - **No `new` Keyword:** Arrow functions cannot be used as constructors, and
    attempting to do so will result in an error.


    +   - **No `arguments` Object:** Arrow functions do not have their own `arguments`
    object. However, you can achieve similar functionality using rest parameters.


    +   - **Cannot Change `this`:** The value of `this` is lexically bound, meaning
    it cannot be altered with methods like `call`, `apply`, or `bind`.


