    \ are hoisted, meaning the function can be called before its declaration in the\
    \ code.\n\nSyntax:\n\n```\nfunction myFunction() {\n  // Function body\n}\n```\n\
    \nExample:\n\n```\nconsole.log(sum(10, 5)); // Outputs: 15\n\nfunction sum(a,\
