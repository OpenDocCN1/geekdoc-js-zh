- md: "## 11.5.3 Dealing with Asynchronous Errors\n\nAsynchronous code introduces\
    \ complexities in error handling, especially with callbacks and promises.\n\n\
    -   Promises: Use the `.catch()` method or `try`/`catch` with `async`/`await`\
    \ to handle errors in asynchronous code running in a Promise context.\n\n```javascript\n\
    async function fetchDataAndProcess() {\n  try {\n    let data = await fetchData();\n\
    \    process(data);\n  } catch (error) {\n    handleError(error);\n  }\n}\n```\n\
    \n-   Callbacks: Wrap callback functions in `try`/`catch` and use an error-first\
    \ callback pattern where the first parameter of the callback function is reserved\
    \ for an error object, if any.\n\n## 11.5.4 Leveraging Third-Party Debugging and\
    \ Error-Tracking Tools\n\nNumerous third-party tools provide advanced error tracking,\
    \ logging, and debugging capabilities. These can be integrated into your development\
    \ and production environments to monitor and alert on errors in real-time.\n\n\
    -   Sentry, LogRocket, and Raygun: These services offer real-time error tracking\
    \ and reporting, giving insights into how, where, and why your application is\
    \ failing.\n-   Integration: Most tools offer easy integration with JavaScript\
    \ applications and provide SDKs for various frameworks. Integration involves including\
    \ a provided snippet into your application or using their API.\n-   Features:\
    \ Apart from capturing errors, these tools provide stack traces, user sessions,\
    \ and analytics to diagnose and understand errors better. This data is invaluable\
    \ for debugging issues that are difficult to re-produce or are environment-specific.\n\
    \nImplementing advanced error handling techniques in JavaScript applications not\
    \ only helps in effectively diagnosing and resolving issues but also in preventing\
    \ possible disruptions, thereby improving the overall stability and reliability\
    \ of your applications.\n\n## 12.1 Building a Simple Web Application: Integrating\
    \ HTML, CSS, and JavaScript\n\nCreating a simple web application involves an integration\
    \ of HTML, CSS, and JavaScript. This process spans setting up an organized project\
    \ structure, designing a user-friendly interface, adding interactivity through\
    \ JavaScript, and more. Here's a comprehensive guide to building your first web\
    \ application.\n\n### 12.1.1 Setting Up the Project: Directory Structure and Files\n\
    \nA well-organized project structure is crucial for maintaining and scaling your\
    \ web application. Begin with creating a new directory for your project. Within\
    \ this directory, create subdirectories and files as follows:\n\n-   `/css` -\
    \ for storing CSS files. Start with `style.css`.\n-   `/js` - for JavaScript files.\
    \ Start with `script.js`.\n-   `/images` - a directory for all your images.\n\
    -   `index.html` - your main HTML file at the root of the project.\n\nThis structure\
    \ keeps your styles, scripts, and assets separate, promoting good organization\
    \ and easier maintenance.\n\n### 12.1.2 Designing the User Interface with HTML\
    \ and CSS\n\nThe user interface is what your users interact with. HTML provides\
    \ the structure, while CSS styles it.\n\n1.  **HTML:** Start by defining the structure\
    \ of your application in `index.html`. Use semantic tags like `<header>`, `<footer>`,\
    \ `<nav>`, and `<main>` to outline the main areas.\n2.  **CSS:** In `style.css`,\
    \ define the styles for your application. Utilize CSS Flexbox or Grid for layout,\
    \ set fonts, colors, and styles for your elements to make your application visually\
    \ appealing.\n\n### 12.1.3 Adding Interactivity with JavaScript\n\nJavaScript\
    \ adds interactivity to your web application.\n\n1.  Connecting JS to HTML: Include\
    \ your `script.js` file before the closing `</body>` tag in your `index.html`\
    \ with `<script src=\"js/script.js\"></script>`.\n2.  Manipulating the DOM: Use\
    \ JavaScript to interact with and modify the DOM based on user actions. Start\
    \ by selecting elements using `document.querySelector()` and then use event listeners\
    \ to handle user events.\n\n### 12.1.4 Event Handling and DOM Manipulation\n\n\
    Event handling is crucial for interactive applications.\n\n1.  Listening to Events:\
    \ Add listeners to buttons or other interface elements to trigger JavaScript functions.\
    \ Example:\n    ```javascript\n    document.getElementById('myButton').addEventListener('click',\
    \ myFunction);\n    ```\n2.  Manipulating the DOM: Change content, styles, or\
    \ attributes of HTML elements from JavaScript to reflect interaction outcomes.\
    \ For instance, hide a form after submission or display a loading spinner when\
    \ fetching data.\n\n### 12.1.5 Fetching Data with AJAX and Updating the UI\n\n\
    AJAX (Asynchronous JavaScript and XML) allows you to request data from servers\
    \ without reloading your page, making your application more dynamic and fast.\n\
    \n1.  Fetch API: Use the Fetch API to make HTTP requests to retrieve data.\n \
    \   ```javascript\n    fetch('https://api.example.com/data')\n      .then(response\
    \ => response.json())\n      .then(data => console.log(data));\n    ```\n2.  Updating\
    \ the UI: Once the data is fetched, use JavaScript to dynamically update the DOM\
    \ to display the new data to the user. This could include adding new elements\
    \ or updating existing ones with the fetched data.\n\nBy following these steps,\
    \ you can build a simple yet effective web application that is structured, styled,\
    \ and interactive. Through practicing these skills, you will be well on your way\
    \ to developing more complex web applications.\n\n## 12.2 Utilizing Local Storage\
    \ for Data Persistence\n\nIn modern web development, persisting data across sessions\
    \ is a common requirement. HTML5 introduces the Web Storage API, which provides\
    \ mechanisms for web applications to store key-value pairs in a web browser. Let's\
    \ explore how to use `localStorage` to achieve data persistence effectively.\n\
    \n### 12.2.1 Introduction to Web Storage API\n\nThe Web Storage API offers two\
    \ storage mechanisms: `localStorage` and `sessionStorage`. Both provide the same\
    \ methods and properties, but their lifespan differs. `sessionStorage` maintains\
    \ a separate storage area for each given origin that's available for the duration\
    \ of the page session. In contrast, `localStorage` does the same, but persists\
    \ even when the browser is closed and reopened.\n\n-   Features:\n    - Stores\
    \ data with no expiration date.\n    - Data is not sent with every server request,\
    \ unlike cookies, making it more efficient.\n    - Can store up to 5MB of data,\
    \ significantly more than cookies.\n\n### 12.2.2 Storing and Retrieving Data with\
    \ localStorage\n\n**Storing Data**: To store data in `localStorage`, use the `setItem()`\
    \ method, which accepts a key and a value.\n\n```javascript\nlocalStorage.setItem('key',\
    \ 'value');\n```\n\n**Retrieving Data**: To retrieve the stored data, use the\
    \ `getItem()` method, specifying the key associated with the value you want to\
    \ retrieve.\n\n```javascript\nlet value = localStorage.getItem('key');\nlocalStorage.removeItem('key');\n\
    ```\n\n### 12.2.3 Implementing Todo List with Local Storage\n\nImplementing a\
    \ todo list that persists tasks across browser sessions is a practical example\
    \ of `localStorage` utility.\n\n1.  **Add a Task**: When a task is added, store\
    \ it in `localStorage`.\n    ```javascript\n    function addTask(task) {\n   \
    \   const tasks = JSON.parse(localStorage.getItem('tasks')) || [];\n      tasks.push(task);\n\
    \      localStorage.setItem('tasks', JSON.stringify(tasks));\n    }\n    ```\n\
    2.  **Display Tasks**: On page load, fetch and display tasks stored in `localStorage`.\n\
    \    ```javascript\n    function displayTasks() {\n      const tasks = JSON.parse(localStorage.getItem('tasks'))\
    \ || [];\n      tasks.forEach(task => {\n        // code to display the task on\
    \ the page\n      });\n    }\n    ```\n3.  **Remove a Task**: When a task is removed\
    \ from the list, also remove it from `localStorage`.\n    ```javascript\n    function\
    \ removeTask(index) {\n      const tasks = JSON.parse(localStorage.getItem('tasks'));\n\
    \      tasks.splice(index, 1);\n      localStorage.setItem('tasks', JSON.stringify(tasks));\n\
    \    }\n    ```\n\n### 12.2.4 Best Practices for Using Local Storage\n\n-   Do\
    \ Not Store Sensitive Information: `localStorage` is not secure. Never store sensitive\
    \ or personal information in `localStorage`.\n-   Stringify Non-String Data: `localStorage`\
    \ can only store strings, so use `JSON.stringify()` to store arrays or objects,\
    \ and `JSON.parse()` to read them back into your application."
  mdcn: "\n## 11.5.3 处理异步错误\n\n异步代码引入了错误处理的复杂性，尤其是在使用回调和 Promise 时。\n\n-   Promise：使用\
    \ `.catch()` 方法或配合 `async`/`await` 的 `try`/`catch` 来处理在 Promise 上下文中运行的异步代码中的错误。\n\
    \n```javascript\nasync function fetchDataAndProcess() {\n  try {\n    let data\
    \ = await fetchData();\n    process(data);\n  } catch (error) {\n    handleError(error);\n\
    \  }\n}\n```\n\n-   回调：将回调函数包裹在 `try`/`catch` 中，并使用错误优先的回调模式，即回调函数的第一个参数预留给错误对象（如果有的话）。\n\
    \n## 11.5.4 利用第三方调试和错误追踪工具\n\n众多第三方工具提供高级错误追踪、日志记录和调试功能。这些工具可以集成到你的开发和生产环境中，实时监控错误并发出警报。\n\
    \n-   Sentry、LogRocket 和 Raygun：这些服务提供实时错误追踪和报告，让你深入了解应用程序是如何、在哪里以及为什么失败的。\n-\
    \   集成：大多数工具都能轻松集成到 JavaScript 应用程序中，并为各种框架提供 SDK。集成过程涉及将提供的代码片段包含到你的应用程序中，或使用它们的\
    \ API。\n-   功能：除了捕获错误外，这些工具还提供堆栈跟踪、用户会话和分析功能，以便更好地诊断和理解错误。这些数据对于调试难以复现或与特定环境相关的问题非常宝贵。\n\
    \n在 JavaScript 应用程序中实施高级错误处理技术，不仅有助于有效诊断和解决问题，还能防止可能出现的中断，从而提高应用程序的整体稳定性和可靠性。\n\
    \n## 12.1 构建简单的 Web 应用程序：整合 HTML、CSS 和 JavaScript\n\n创建一个简单的 Web 应用程序需要整合 HTML、CSS\
    \ 和 JavaScript。这个过程包括设置结构化的项目架构、设计用户友好的界面、通过 JavaScript 添加交互性等。以下是构建你的第一个 Web\
    \ 应用程序的全面指南。\n\n### 12.1.1 设置项目：目录结构和文件\n\n结构良好的项目架构对于维护和扩展你的 Web 应用程序至关重要。首先为你的项目创建一个新目录。在此目录中，按如下方式创建子目录和文件：\n\
    \n-   `/css` —— 用于存储 CSS 文件。从 `style.css` 开始。\n-   `/js` —— 用于存储 JavaScript 文件。从\
    \ `script.js` 开始。\n-   `/images` —— 用于存放所有图片的目录。\n-   `index.html` —— 位于项目根目录的主\
    \ HTML 文件。\n\n这种结构将你的样式、脚本和资源分开，促进良好的组织并便于维护。\n\n### 12.1.2 使用 HTML 和 CSS 设计用户界面\n\
    \n用户界面是用户与之交互的部分。HTML 提供结构，CSS 则负责样式。\n\n1.  **HTML：** 在 `index.html` 中定义应用程序的结构。使用\
    \ `<header>`、`<footer>`、`<nav>` 和 `<main>` 等语义化标签来勾勒主要区域。\n2.  **CSS：** 在 `style.css`\
    \ 中定义应用程序的样式。利用 CSS Flexbox 或 Grid 进行布局，设置字体、颜色和元素样式，使你的应用程序具有视觉吸引力。\n\n### 12.1.3\
    \ 使用 JavaScript 添加交互性\n\nJavaScript 为 Web 应用程序添加交互性。\n\n1.  连接 JS 和 HTML：在 `index.html`\
    \ 的关闭 `</body>` 标签之前引入你的 `script.js` 文件，使用 `<script src=\"js/script.js\"></script>`。\n\
    2.  操作 DOM：使用 JavaScript 根据用户操作与 DOM 交互并进行修改。首先使用 `document.querySelector()` 选择元素，然后使用事件监听器来处理用户事件。\n\
    \n### 12.1.4 事件处理和 DOM 操作\n\n事件处理对于交互式应用程序至关重要。\n\n1.  监听事件：为按钮或其他界面元素添加监听器，以触发\
    \ JavaScript 函数。示例：\n    ```javascript\n    document.getElementById('myButton').addEventListener('click',\
    \ myFunction);\n    ```\n2.  操作 DOM：从 JavaScript 更改 HTML 元素的内容、样式或属性，以反映交互结果。例如，提交后隐藏表单，或在获取数据时显示加载\
    \ spinner。\n\n### 12.1.5 使用 AJAX 获取数据并更新 UI\n\nAJAX（异步 JavaScript 和 XML）允许你在不重新加载页面的情况下从服务器请求数据，使你的应用程序更加动态和快速。\n\
    \n1.  Fetch API：使用 Fetch API 进行 HTTP 请求以检索数据。\n    ```javascript\n    fetch('https://api.example.com/data')\n\
    \      .then(response => response.json())\n      .then(data => console.log(data));\n\
    \    ```\n2.  更新 UI：获取数据后，使用 JavaScript 动态更新 DOM，向用户显示新数据。这可能包括添加新元素或使用获取的数据更新现有元素。\n\
    \n通过遵循这些步骤，你可以构建一个结构良好、样式美观且具有交互性的简单有效的 Web 应用程序。通过练习这些技能，你将能够很好地开发更复杂的 Web 应用程序。\n\
    \n## 12.2 利用本地存储实现数据持久化\n\n在现代 Web 开发中，跨会话持久化数据是一项常见需求。HTML5 引入了 Web Storage API，为\
    \ Web 应用程序提供了在浏览器中存储键值对的机制。让我们探索如何有效地使用 `localStorage` 实现数据持久化。\n\n### 12.2.1\
    \ Web Storage API 简介\n\nWeb Storage API 提供两种存储机制：`localStorage` 和 `sessionStorage`。两者具有相同的方法和属性，但生命周期不同。`sessionStorage`\
    \ 为每个给定的源维护一个独立的存储区域，仅在页面会话期间可用。相比之下，`localStorage` 也是如此，但即使在浏览器关闭并重新打开后仍然保持数据。\n\
    \n-   特性：\n    - 存储的数据没有过期日期。\n    - 数据不会随每次服务器请求发送，这与 cookie 不同，因此更高效。\n    -\
    \ 可存储多达 5MB 的数据，远超 cookie。\n\n### 12.2.2 使用 localStorage 存储和检索数据\n\n**存储数据**：要在\
    \ `localStorage` 中存储数据，使用 `setItem()` 方法，它接受一个键和一个值。\n\n```javascript\nlocalStorage.setItem('key',\
    \ 'value');\n```\n\n**检索数据**：要检索存储的数据，使用 `getItem()` 方法，指定与要检索的值相关联的键。\n\n```javascript\n\
    let value = localStorage.getItem('key');\nlocalStorage.removeItem('key');\n```\n\
    \n### 12.2.3 使用 Local Storage 实现待办事项列表\n\n实现一个跨浏览器会话持久保存任务的待办事项列表，是 `localStorage`\
    \ 实用性的一个典型示例。\n\n1.  **添加任务**：当添加任务时，将其存储在 `localStorage` 中。\n    ```javascript\n\
    \    function addTask(task) {\n      const tasks = JSON.parse(localStorage.getItem('tasks'))\
    \ || [];\n      tasks.push(task);\n      localStorage.setItem('tasks', JSON.stringify(tasks));\n\
    \    }\n    ```\n2.  **显示任务**：页面加载时，获取并显示存储在 `localStorage` 中的任务。\n    ```javascript\n\
    \    function displayTasks() {\n      const tasks = JSON.parse(localStorage.getItem('tasks'))\
    \ || [];\n      tasks.forEach(task => {\n        // code to display the task on\
    \ the page\n      });\n    }\n    ```\n3.  **移除任务**：当从列表中移除任务时，同时从 `localStorage`\
    \ 中移除它。\n    ```javascript\n    function removeTask(index) {\n      const tasks\
    \ = JSON.parse(localStorage.getItem('tasks'));\n      tasks.splice(index, 1);\n\
    \      localStorage.setItem('tasks', JSON.stringify(tasks));\n    }\n    ```\n\
    \n### 12.2.4 使用 Local Storage 的最佳实践\n\n-   不要存储敏感信息：`localStorage` 不安全。切勿在 `localStorage`\
    \ 中存储敏感或个人信息。\n-   将非字符串数据序列化：`localStorage` 只能存储字符串，因此使用 `JSON.stringify()` 来存储数组或对象，并使用\
    \ `JSON.parse()` 将它们读取回你的应用程序。\n"
