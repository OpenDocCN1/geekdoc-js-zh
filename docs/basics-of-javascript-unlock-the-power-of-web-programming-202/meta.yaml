    \ to \"settle,\" such as keystroke events in a search bar."
  mdcn: "\n## 5.2.3 克隆对象和数组以保留状态\n\n为了防止通过引用传递的对象或数组被修改时产生不必要的副作用，在操作之前对它们进行克隆或复制至关重要。\n\
    \n-   **浅克隆**可以使用 `Object.assign()` 或对象的展开语法 `...` 来实现，对于数组则可以使用 `Array.slice()`\
