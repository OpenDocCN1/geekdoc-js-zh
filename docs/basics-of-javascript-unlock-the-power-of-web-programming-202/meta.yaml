- md: "## 8.2.1 Introduction to the Fetch API\n\nThe Fetch API provides a modern,\
    \ promise-based mechanism to make asynchronous HTTP requests. Compared to older\
    \ techniques, Fetch offers a more powerful and flexible feature set to handle\
    \ requests and responses. It is built into the global window scope, making it\
    \ readily available in modern browsers.\n\n![fetch](https://api.example.com/data)\n\
    \n```\nfetch('https://api.example.com/data')\n  .then(response => response.json())\
    \ // Parses JSON response into native JavaScript objects\n  .then(data => console.log(data))\n\
    \  .catch(error => console.error('Error:', error));\n```\n\n## 8.2.2 AJAX with\
    \ XMLHttpRequest\n\nBefore Fetch, `XMLHttpRequest` (XHR) was the primary way for\
    \ web applications to interact with servers asynchronously. While it is less user-friendly\
    \ than Fetch, understanding XHR is important for maintaining older codebases or\
    \ for specific use cases where Fetch might not be available.\n\n## 8.2.3 Handling\
    \ Network Errors and Fetch API Limitations\n\nWhile Fetch simplifies making HTTP\
    \ requests, it's crucial to handle potential errors and be aware of its limitations.\
    \ A common misunderstanding is that Fetch rejects its promise only on network\
    \ errors, not for HTTP error statuses (e.g., 404 or 500).\n\nTo properly handle\
    \ errors, including HTTP status errors:\n\n```\nfetch('https://api.example.com/might-not-exist')\n\
    \  .then(response => {\n    if (!response.ok) {\n      throw new Error('Network\
    \ response was not ok');\n    }\n    return response.json();\n  })\n  .catch(error\
    \ => console.error('There has been a problem with your fetch operation:', error));\n\
    ```\n\n## 8.2.4 Beyond Get Requests: POST, PUT, DELETE\n\nFetch can handle all\
    \ types of HTTP requests, including POST, PUT, and DELETE. This is done by setting\
    \ options on the fetch call, specifying the `method`, along with any needed `headers`\
    \ and the `body` of the request for non-GET requests.\n\n## 8.2.5 Working with\
    \ Headers and CORS\n\nHeaders in HTTP requests allow clients to pass additional\
    \ information with requests or responses. For instance, headers can be used to\
    \ specify content types, authentication tokens, or CORS (Cross-Origin Resource\
    \ Sharing) policies.\n\nCross-Origin Resource Sharing (CORS) is a security mechanism\
    \ that restricts how resources on a web page can be requested from another domain\
    \ outside the domain from which the first resource was served. When working with\
    \ APIs or conducting POST, PUT, or DELETE operations, it's common to encounter\
    \ CORS errors if the server is not configured to allow requests from your domain.\n\
    \nManaging headers and understanding CORS are vital for developing web apps that\
    \ interact securely and efficiently with external services.\n\n```\nfetch('https://api.example.com/data',\
    \ {\n  method: 'GET',\n  headers: {\n    'Authorization': 'Bearer your-token-here',\n\
    \  },\n})\n  .then(response => response.json())\n  .then(data => console.log(data))\n\
    \  .catch((error) => console.error('Error:', error));\n```\n\nMastering these\
    \ aspects of making HTTP requests opens up a vast array of possibilities for web\
    \ developers, from interacting with third-party APIs to building complex web applications\
    \ that rely on server-side data and operations.\n\n## 8.3 Handling JSON Data\n\
    \nJavaScript Object Notation (JSON) is a lightweight data-interchange format that\
    \ is easy for humans to read and write, and easy for machines to parse and generate.\
    \ It is based on a subset of the JavaScript Programming Language and is commonly\
    \ used for transmitting data in web applications between clients and servers.\n\
    \n### 8.3.1 JSON Format and Data Types\n\nJSON is built on two structures:\n\n\
    - A collection of name/value pairs (often implemented as an object, record, struct,\
    \ dictionary, hash table, keyed list, or associative array).\n- An ordered list\
    \ of values (often implemented as an array, vector, list, or sequence).\n\nJSON\
    \ supports the following data types:\n\n- strings\n- numbers\n- booleans (`true`\
    \ and `false`)\n- null\n- objects (collections of name/value pairs)\n- arrays\
    \ (ordered lists of values)\n\nData is structured in key/value pairs where every\
    \ key is a string, and the value can be any of the JSON-supported data types.\
    \ Strings in JSON must be written in double quotes.\n\n```\n{\n  \"name\": \"\
    John Doe\",\n  \"age\": 30,\n  \"isEmployed\": true,\n  \"address\": {\n    \"\
    street\": \"123 Main St\",\n    \"city\": \"Anytown\"\n  },\n  \"phoneNumbers\"\
    : [\"123-456-7890\", \"456-789-0123\"]\n}\n```\n\n### 8.3.2 Parsing JSON with\
    \ `JSON.parse`\n\n`JSON.parse` transforms a string of JSON format into a JavaScript\
    \ object. This is especially useful when you receive JSON data as text from a\
    \ server and need to convert it to a JavaScript object for manipulation.\n\n###\
    \ 8.3.3 Stringifying Objects with `JSON.stringify`\n\n`JSON.stringify` takes a\
    \ JavaScript object and converts it into a string in JSON format. This is particularly\
    \ useful when you need to send data from the client to a server in JSON format.\n\
    \n```\nconst jsonObj = { name: \"Jane Doe\", age: 25 };\nconst jsonString = JSON.stringify(jsonObj);\n\
    \nconsole.log(jsonString); // {\"name\":\"Jane Doe\",\"age\":25}\n```\n\n### 8.3.4\
    \ Best Practices for Working with JSON Data\n\n1. **Use Valid JSON**: Always ensure\
    \ the JSON data is correctly formatted. Tools and online validators can help check\
    \ your JSON.\n\n2. **Double Quotes**: Names and string values should be enclosed\
    \ in double quotes.\n\n3. **Check for undefined**: `JSON.stringify` skips properties\
    \ with values of `undefined`. Be cautious of this when stringifying objects.\n\
    \n4. **Date Handling**: JSON does not have a \"date\" type. Dates are typically\
    \ represented as strings, and the conversion to and from a JavaScript Date object\
    \ must be handled manually.\n\n5. **Avoid Circular References**: Circular references\
    \ will cause `JSON.stringify` to throw an error. If your object contains circular\
    \ references, you must remove them or use a custom replacer function.\n\n6. **Pretty\
    \ Print for Debugging**: When debugging or aiming for readability, you can use\
    \ the third parameter of `JSON.stringify` to pretty-print your JSON.\n\nHandling\
    \ JSON data efficiently and according to best practices allows developers to seamlessly\
    \ exchange data between clients and servers, making it a crucial skill in modern\
    \ web development.\n\n## 8.4 Advanced Asynchronous Patterns\n\nMastering advanced\
    \ asynchronous patterns in JavaScript is crucial for developing complex and efficient\
    \ web applications. These patterns enable handling multiple operations concurrently,\
    \ iterating over asynchronous operations, and optimizing performance for high-frequency\
    \ events.\n\n### 8.4.1 Promises and Promise.all for Concurrent Tasks\n\nPromises\
    \ are at the heart of modern asynchronous JavaScript, allowing for cleaner and\
    \ more manageable code. When dealing with multiple asynchronous operations that\
    \ need to run concurrently, `Promise.all` comes into play. It takes an iterable\
    \ of promises and returns a single Promise that resolves when all of the promises\
    \ in the iterable have resolved or when the iterable contains no promises.\n\n\
    ### 8.4.2 Async Iterators and Generators\n\nAsync iterators and generators provide\
    \ a way to handle asynchronous data streams seamlessly. An async generator is\
    \ a function that can pause its execution while waiting for asynchronous actions\
    \ to complete, yielding results as they become available.\n\n```\nasync function*\
    \ asyncGenerator() {\n  const words = ['foo', 'bar'];\n  for (let word of words)\
    \ {\n    // Simulate an asynchronous operation\n    await new Promise(resolve\
    \ => setTimeout(resolve, 1000));\n    yield word;\n  }\n}\n\nasync function run()\
    \ {\n  for await (let word of asyncGenerator()) {\n    console.log(word); // Prints\
    \ \"foo\" then \"bar\", one second apart\n  }\n}\n\nrun();\n```\n\n### 8.4.3 Debouncing\
    \ and Throttling Asynchronous Operations\n\nDebouncing and throttling are techniques\
    \ to control the number of times a function can execute, particularly useful in\
    \ optimizing performance for events that occur at a high frequency, such as window\
    \ resizing, scrolling, or keypress events.\n\n- **Debouncing** ensures that the\
    \ function gets called once after a specified time interval has elapsed since\
    \ the last time it was invoked.\n- **Throttling** limits the function execution\
    \ to once every specified time interval, regardless of how many times it is called.\n\
    \nThese patterns prevent unnecessary calls to expensive operations and can significantly\
    \ improve performance."
  mdcn: "\n## 8.2.1 Fetch API 简介\n\nFetch API 提供了一种现代的、基于 Promise 的机制来发起异步 HTTP 请求。与旧技术相比，Fetch\
