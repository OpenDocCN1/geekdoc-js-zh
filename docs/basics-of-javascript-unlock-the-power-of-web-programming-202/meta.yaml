    # ## 2.3 Declaring Variables: `let`, `const`, and `var`


    # ### 2.3.1 Differences Between `let`, `const`, and `var`


    +   - **var**: This keyword declares a variable, optionally initializing it to
    a value. `var`-declared variables are function-scoped or globally scoped (if declared
    outside of a function) and are subject to variable hoisting (which means they
    can be referenced in code before they are declared).


    +   - **let**: Introduced in ES6 (ECMAScript 2015), `let` allows the declaration
    of block-scoped variables, significantly reducing the scope in which a variable
    is visible compared to `var`. Variables declared with `let` can be updated but
    not re-declared within the same scope.


    +   - **const**: Also introduced in ES6, `const` is used for declaring variables
    that are meant to remain constant after their initial assignment (i.e., they cannot
    be reassigned). Like `let`, `const` provides block-level scope. It''s important
    to note that while the variable reference is immutable, the object it points to
    can still be mutated if it is an object.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 2.3.2 When to Use `let` vs. `const`


    The choice between `let` and `const` should be guided by the intended use of the
    variable:


    +   - Use `const` by default for declaring variables that should not change after
    their initial assignment. This communicates intent to other developers and leads
    to safer, more predictable code.

    - Use `let` for variables that are expected to change, such as counters in a loop,
    or values that get reassigned during the execution of a function.


    By following this approach, code maintainability and readability are improved.


    # 2.3.3 The Scope of `let`, `const`, and `var`


    +   - **var**: Variables declared with `var` are either function-scoped or global-scoped,
    meaning they are visible throughout the entire function or throughout the global
    scope if declared outside a function.

    - **let** and **const**: Both of these keywords allow for block-scoping, which
    limits the visibility of a variable to the block in which it''s declared (a block
    is defined by curly braces `{}`). This is a crucial feature for managing variable
    lifecycle and avoiding unintentional interference between different parts of a
    program.'
