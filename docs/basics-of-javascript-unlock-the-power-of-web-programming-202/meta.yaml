- img_proc: true
  md: '# 7.4.2 Prototype Chain and Inheritance


    The prototype chain is a series of links between objects where each object references
    its prototype parent. When accessing a property or method of an object, JavaScript
    first searches the object itself. If it doesn''t find it, it searches the object''s
    prototype, then the prototype''s prototype, and so on, until it reaches `null`.
    This chain is the foundation of inheritance in JavaScript.


    For example, suppose we have an object `O` that inherits from `Prototype B`, which
    in turn inherits from `Prototype A`. If a property is not found on `O`, the search
    moves to `B`, and if not found on `B`, it continues to `A`.


    # 7.4.3 Shadowing Prototype Properties


    Shadowing occurs when a property added to an object has the same name as one in
    the object''s prototype chain. The property on the object "shadows" the one on
    the prototype, meaning the prototype''s property won''t be accessed directly through
    the object if a property with the same name exists on the object itself.


    This can be useful, but it''s also something to be aware of, as it can lead to
    unexpected behavior if you accidentally shadow prototypes properties.'
