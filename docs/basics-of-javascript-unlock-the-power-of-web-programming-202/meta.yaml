    # 7.4.1 Understanding Prototypes in JavaScript


    In JavaScript, every function and object has a property named `prototype`, except
    for the `null` object, which is the end of the prototype chain. When a function
    is used as a constructor with the `new` keyword, the newly created object inherits
    properties and methods from the constructor function''s `prototype`.


    The `prototype` property is a mechanism whereby JavaScript objects inherit features
    from one another. For instance, JavaScript arrays inherit from `Array.prototype`,
    enabling all arrays to utilize methods like `map`, `filter`, and `reduce`.'
  merge: -1
