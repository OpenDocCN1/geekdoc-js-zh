    \n在动态的 Web 应用环境中，跨异步操作管理状态是一个常见的挑战。状态指的是应用程序在任何时间点可能处于的各种条件。适当的状态管理可确保应用程序在异步代码执行带来的复杂性下，仍能正确且可预测地运行。\n\
    \n### 8.5.1 有状态的异步操作\n\n有状态的异步操作涉及其结果和后续操作取决于先前结果或状态的任务。管理这些操作需要在整个操作生命周期中仔细跟踪每次状态转换。一种常见的方法是使用\
