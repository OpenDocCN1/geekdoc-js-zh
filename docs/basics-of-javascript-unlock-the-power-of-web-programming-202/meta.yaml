    # 10.5.1 Working with Document Fragments for Optimal Performance


    One common avenue for enhancing performance when inserting or manipulating multiple
    DOM elements is the use of **Document Fragments**. A Document Fragment acts as
    a lightweight, minimal document object that can hold DOM nodes. You can append
    nodes to it just as you would to the actual DOM, but since the Document Fragment
    is not part of the active DOM tree, modifying it doesn''t cause reflow or repaint.
    Once you''re done, you can append the entire Fragment to the DOM, triggering just
    a single reflow and repaint cycle.'
