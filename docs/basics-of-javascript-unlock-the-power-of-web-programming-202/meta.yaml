  md: '# **8.1.1 The Event Loop and Non-Blocking I/O**


    JavaScript is single-threaded, meaning it can only execute one piece of code at
    a time. The event loop is a mechanism that allows JavaScript to perform non-blocking
    I/O operations - like reading files or making HTTP requests - by offloading operations
    to the system kernel whenever possible.


    When these operations complete, they return to JavaScript as events. The event
    loop continuously checks the message queue for these completion events and processes
    their callback functions as they arrive. This model allows JavaScript to perform
    other tasks while waiting for asynchronous operations to complete.


    # **8.1.2 Working with Callbacks**


    Callbacks are functions passed as arguments to another function, which executes
    the callback when an asynchronous operation completes. While callbacks help manage
    asynchronous operations, they can lead to "callback hell" or "pyramid of doom,"
    where callbacks are nested within callbacks, making the code difficult to read
    and maintain.'
  merge: -1
