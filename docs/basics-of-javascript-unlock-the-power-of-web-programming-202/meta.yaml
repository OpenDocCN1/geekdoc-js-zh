    \  .catch((error) => console.error('Error:', error));\n```\n\n掌握这些发起 HTTP 请求的方面，为\
    \ Web 开发人员开启了广泛的可能性，从与第三方 API 交互到构建依赖服务器端数据和操作的复杂 Web 应用程序。\n\n## 8.3 处理 JSON\
    \ 数据\n\nJavaScript 对象表示法（JSON）是一种轻量级的数据交换格式，易于人类阅读和编写，也易于机器解析和生成。它基于 JavaScript\
    \ 编程语言的子集，常用于在 Web 应用程序中客户端和服务器之间传输数据。\n\n### 8.3.1 JSON 格式与数据类型\n\nJSON 基于两种结构：\n\
    \n- 名称/值对的集合（通常实现为对象、记录、结构体、字典、哈希表、键控列表或关联数组）。\n- 值的有序列表（通常实现为数组、向量、列表或序列）。\n\n\
    JSON 支持以下数据类型：\n\n- 字符串\n- 数字\n- 布尔值（`true` 和 `false`）\n- null\n- 对象（名称/值对的集合）\n\
    - 数组（值的有序列表）\n\n数据以键/值对的形式组织，其中每个键都是一个字符串，而值可以是任何 JSON 支持的数据类型。JSON 中的字符串必须用双引号书写。\n\
    \n```\n{\n  \"name\": \"John Doe\",\n  \"age\": 30,\n  \"isEmployed\": true,\n\
    \  \"address\": {\n    \"street\": \"123 Main St\",\n    \"city\": \"Anytown\"\
    \n  },\n  \"phoneNumbers\": [\"123-456-7890\", \"456-789-0123\"]\n}\n```\n\n###\
    \ 8.3.2 使用 `JSON.parse` 解析 JSON\n\n`JSON.parse` 将 JSON 格式的字符串转换为 JavaScript 对象。当您从服务器接收到\
    \ JSON 格式的文本数据并需要将其转换为 JavaScript 对象进行操作时，这非常有用。\n\n### 8.3.3 使用 `JSON.stringify`\
    \ 将对象字符串化\n\n`JSON.stringify` 接受一个 JavaScript 对象并将其转换为 JSON 格式的字符串。当您需要以 JSON\
    \ 格式将数据从客户端发送到服务器时，这特别有用。\n\n```\nconst jsonObj = { name: \"Jane Doe\", age: 25\
    \ };\nconst jsonString = JSON.stringify(jsonObj);\n\nconsole.log(jsonString);\
    \ // {\"name\":\"Jane Doe\",\"age\":25}\n```\n\n### 8.3.4 处理 JSON 数据的最佳实践\n\n\
    1. **使用有效的 JSON**：始终确保 JSON 数据格式正确。工具和在线验证器可以帮助检查您的 JSON。\n\n2. **双引号**：名称和字符串值应用双引号括起来。\n\
    \n3. **检查 undefined**：`JSON.stringify` 会跳过值为 `undefined` 的属性。在字符串化对象时需注意这一点。\n\
    \n4. **日期处理**：JSON 没有“日期”类型。日期通常表示为字符串，与 JavaScript Date 对象的转换必须手动处理。\n\n5. **避免循环引用**：循环引用会导致\
    \ `JSON.stringify` 抛出错误。如果您的对象包含循环引用，必须移除它们或使用自定义的 replacer 函数。\n\n6. **调试时使用美化打印**：在调试或追求可读性时，您可以使用\
    \ `JSON.stringify` 的第三个参数来美化打印您的 JSON。\n\n高效地并根据最佳实践处理 JSON 数据，使开发人员能够在客户端和服务器之间无缝交换数据，这使其成为现代\
    \ Web 开发中的一项关键技能。\n\n## 8.4 高级异步模式\n\n掌握 JavaScript 中的高级异步模式对于开发复杂且高效的 Web 应用程序至关重要。这些模式能够处理并发操作、迭代异步操作，并优化高频事件的性能。\n\
    \n### 8.4.1 Promises 与 Promise.all 用于并发任务\n\nPromises 是现代异步 JavaScript 的核心，允许更清晰、更易于管理的代码。当处理需要并发运行的多个异步操作时，`Promise.all`\
    \ 就派上了用场。它接受一个可迭代的 Promise 列表，并返回一个单独的 Promise，该 Promise 在可迭代列表中的所有 Promise 都已解决时解决，或者当可迭代列表不包含\
    \ Promise 时解决。\n\n### 8.4.2 异步迭代器和生成器\n\n异步迭代器和生成器提供了一种无缝处理异步数据流的方式。异步生成器是一个函数，它可以在等待异步操作完成时暂停执行，并在结果可用时产出（yield）结果。\n\
    \n```\nasync function* asyncGenerator() {\n  const words = ['foo', 'bar'];\n \
    \ for (let word of words) {\n    // 模拟一个异步操作\n    await new Promise(resolve =>\
    \ setTimeout(resolve, 1000));\n    yield word;\n  }\n}\n\nasync function run()\
    \ {\n  for await (let word of asyncGenerator()) {\n    console.log(word); // 打印\
    \ \"foo\" 然后 \"bar\"，间隔一秒\n  }\n}\n\nrun();\n```\n\n### 8.4.3 异步操作的防抖和节流\n\n防抖和节流是控制函数执行次数的技术，对于优化高频事件（如窗口调整大小、滚动或按键事件）的性能特别有用。\n\
    \n- **防抖**确保函数在上次调用后指定的时间间隔过去后才被调用一次。\n- **节流**将函数执行限制在每个指定的时间间隔一次，无论它被调用了多少次。\n\
    \n这些模式防止对昂贵操作进行不必要的调用，并可以显著提高性能。\n"
