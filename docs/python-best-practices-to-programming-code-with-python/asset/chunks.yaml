  trans: "\n\n如果你使用了优先级不同的运算符，请考虑在优先级最低的运算符周围加上空格——请根据你的最佳判断来决定。然而，你使用的空格不应多于一个，并确保运算符两侧的空格数量相同——不要在一侧放\
    \ 1 个空格而在另一侧放 2 个：\n\n### 良好的示例：\n\n```\ni = i + 1\nsubmitted += 1\nx = x*2 -\
    \ 1\nhypot2 = x*x + y*y\nc = (a+b) * (a-b)\n```\n\n### 不良的示例：\n\n```\ni=i+1\n\
    submitted +=1\nx = x * 2 - 1\nhypot2 = x * x + y * y\nc = (a + b) * (a - b)\n\
    ```\n\n当你使用 `=` 符号来指示参数或关键字参数的默认值时，不要在符号符号周围使用空格：\n\n### 良好的示例：\n\n```python\n\
    def complex(real, imag=0.0):\n    return magic(r=real, i=imag)\n```\n\n### 不良的示例：\n\
    \n```python\ndef complex(real, imag = 0.0):\n    return magic(r = real, i = imag)\n\
    ```\n\n对于函数注解中的冒号，使用标准规则，并确保在使用 `->` 时其周围有空格：\n\n### 良好的示例：\n\n```python\ndef\
    \ munge(input: AnyStr): ...\ndef munge() -> AnyStr: ...\n```\n\n### 不良的示例：\n\n\
    ```python\ndef munge(input:AnyStr): ...\ndef munge()->PosInt: ...\n```\n\n当你结合使用默认值和参数注解时，`=`\
    \ 符号周围应该有空格——除非该参数同时具有默认值和注解，否则不要这样做：\n\n### 良好的示例：\n\n```python\ndef munge(sep:\
    \ AnyStr = None): ...\ndef munge(input: AnyStr, sep: AnyStr = None, limit=1000):\
    \ ...\n```\n\n### 不良的示例：\n\n```python\ndef munge(input: AnyStr=None): ...\ndef\
    \ munge(input: AnyStr, limit = 1000): ...\n```\n\n使用复合语句（在同一行上写多个语句）不是良好的做法：\n\
    \n### 良好的示例：\n\n```python\nif foo == 'that':\n    do_that_thing()\ndo_one()\n\
    do_two()\ndo_three()\n```\n\n### 尽量不要这样做：\n\n```python\nif foo == 'that': do_that_thing()\n\
    do_one(); do_two(); do_three()\n```\n\n偶尔情况下，如果语句体很小，在一行内使用 `if`、`for` 和 `while`\
    \ 语句是可以接受的，但对于包含多个子句的语句，永远不要这样做。此外，永远不要折叠非常长的行：\n\n### 尽量不要这样做：\n\n```python\n\
    if foo == 'that': do_that_thing()\nfor x in lst: total += x\nwhile t < 10: t =\
    \ delay()\n```\n\n### 绝对不要：\n\n```python\nif foo == 'that': do_that_thing()\n\
    else: do_non_that_thing()\ntry: something()\nfinally: cleanup()\ndo_one(); do_two();\
    \ do_three(long, argument,\n                             list, like, this)\nif\
    \ foo == 'that': one(); two(); three()\n```\n\n# 结论\n\n再次感谢阅读我的书，我真心希望它能够帮助你理解如何编写更有效高效的\
    \ Python 代码。\n\n从这里开始，下一步简单来说就是实践。你做得越多，进步得越快，最终你将像专业人士一样编写 Python 代码！通过研究、加入在线\
    \ Python 论坛和加入 Python 社区来学习更多并提升你的技能。\n\n最后，如果你觉得这本书有帮助，可以请你帮个忙吗？请考虑在 `Amamzon.com`\
    \ 上给我留评论；这不仅对我有帮助，对潜在读者也有益。\n\n祝你成为更好的 Python 程序员的道路一路顺利\n\n# 关于作者\n\nCharlie\
    \ Masterson 是一位计算机程序员和导师，开发过多个应用程序和计算机程序。\n\n作为一名计算机科学学生，他很早就对编程感兴趣，但对学习极其复杂的课题感到沮丧。\n\
    \nCharlie 想要一种能够轻松学习并提高编程技能的教学方法。他很快发现了一系列让他学得更快、更好的课程。\n\n通过同样的方法，Charlie 成功学习了不同的编程语言，现在通过写书来教授这些知识。\n\
    \n通过他编写关于计算机编程的书，他希望提供巨大的价值，并帮助对学习计算机主题感兴趣的读者。\n\n"
