    \n### A Bad Example\n```python\nf = open('file.txt')\na = f.read()\nprint a\n\
    f.close()\n```\n\n### A Good Example\n```python\nwith open('file.txt') as f:\n\
    \    for line in f:\n        print line\n```\nUsing the `with` statement is far\
    \ more efficient because it makes sure the file is always closed even when with\
    \ block contains an exception\n\n## Line Continuations\n\nThere are accepted limits\
    \ to logical code lines and when you have one that is longer, it should be split\
