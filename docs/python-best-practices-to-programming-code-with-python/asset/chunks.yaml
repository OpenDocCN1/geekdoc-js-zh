    \n你还可以使用另一种风格，即通过一个唯一的短前缀将一组相关的名称放在一起。这并不常用，但我提到它是为了让你知道它的存在。一个例子是 `os.stat()`\
    \ 函数 —— 它将返回一个包含 `st_size`、`st_mode`、`st_mtime` 等名称的元组。\n\n这些是使用后划线或前划线的格式，通常可以与任何大小写规范结合：\n\
    \n* `_one_leading_underscore` – 这通常是“内部使用”的指示，但力道并不强。\n* `One_trailing_underscore_`\
    \ – 通常用于防止与 Python 关键字冲突，例如：`tkinter.Toplevel(master, class_='ClassName')`\n*\
