    \ [5, 4, 3]\nfor i in range(len(a)):\n    a[i] += 3\n```\n\n### Another Good Example\n\
    ```python\na = [5, 4, 3]\na = [i + 3 for i in a]\n\n# Or:\na = map(lambda i: i\
    \ + 3, a)\n```\n\nYou can also use the function `enumerate()` to keep an account\
    \ of where you are in a list:\n\n```python\na = [5, 4, 3]\nfor i, item in enumerate(a):\n\
