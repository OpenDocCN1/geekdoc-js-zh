  trans: "\n\n现在，这两个函数看起来完全一样，仅仅是因为 `lookup_set` 利用了 Python 集合是哈希表的这一事实。然而，每个示例中 `lookup`\
    \ 的性能是不同的。为了判断一个特定项目是否在列表中，Python 必须搜索每一个项目，直到找到匹配的项。这非常耗时，特别是当列表很长时。使用集合，每个项目都有一个哈希告诉\
    \ Python 在哪里查找，这使得搜索快得多。你也可以以相同的方式搜索字典。由于性能存在差异，在以下情况下，使用集合比列表是更好的主：\n\n*   集合包含大量项目\n\
    *   你需要经常在集合中查找项目\n\n在集合较小或不需要频繁查找的情况下，哈希表所需的额外内存和时间通过使用列表是可以节省的。\n\n# 第 5 章：注释\n\
    \n由于你已经有一些 Python 编程经验，你会知道注释在运行时是不可见的。注释是为了帮助其他开发者或未来的自己理解代码做了什么以及为什么这么做。有些人认为注释毫无意义，但在编写代码时，写注释比不写注释要好得多。当你修改代码时，必须确保更新注释。正确的做法是在写注释时，确保它是一个完整的句子。\n\
    \n当你使用内联注释时，尽可能少用。作为复习，内联注释是放在语句同一行的注释，它们通常不是必要的，并且会引起分心。例如，你不应该这样做：\n\n```python\n\
    x = x + 1 # 增加 x\n```\n\n然而，有时这可能是有用的：\n\n```python\nx = x + 1 # 补偿\n```\n\n更好的方法是将将会元素包含在括号内。如果行尾有一个未闭合的括号，下一行就会被连接，直到出现闭合括号。你也可以使用方括号或大括号来实现相同的功能，只要你保持一致性——你用什么开始，就必须用什么结束。\n\
    \n### 错误示例\n```python\n# 过滤所有大于 4 的元素\na = [5, 4, 3]\nb = []\nfor i in a:\n  \
    \  if i > 4:\n        b.append(i)\n```\n\n### 正确示例\n```python\na = [5, 4, 3]\n\
    b = [i for i in a if i > 4]\n\n# 或者：\nb = filter(lambda x: x > 4, a)\n```\n\n\
    ### 另一个错误示例\n```python\n# 给列表的所有成员加 3。\na = [5, 4, 3]\nfor i in range(len(a)):\n\
    \    a[i] += 3\n```\n\n### 另一个正确示例\n```python\na = [5, 4, 3]\na = [i + 3 for i\
    \ in a]\n\n# 或者：\na = map(lambda i: i + 3, a)\n```\n\n你还可以使用 `enumerate()` 函数来记录你在列表中的位置：\n\
    \n```python\na = [5, 4, 3]\nfor i, item in enumerate(a):\n    print i, item\n\
    # 输出：\n# 0 5\n# 1 4\n# 2 3\n```\n这个函数比手动处理计数器读性更好，而且对于迭代器来说优化得多。\n\n# 从文件读取\n\n\
    当你想要从文件中读取内容时，最好使用 `with open` 语法，因为这会自动为你关闭文件。\n\n### 错误示例\n```python\nf = open('file.txt')\n\
    a = f.read()\nprint a\nf.close()\n```\n\n### 正确示例\n```python\nwith open('file.txt')\
    \ as f:\n    for line in f:\n        print line\n```\n使用 `with` 语句要高效得多，因为它确保即使在\
    \ `with` 块包含异常时文件总是关闭。\n\n# 换行\n\n逻辑代码行有接受的限制，当你有一行代码过长时，应该将其拆分成几行。你的 Python 解释器会获取连续的行，只要每行的最后一个字符是反斜杠\
    \ `\\`，它就会连接这些行。然而，尽管这有时有用，但你真的应该避免，因为它是脆弱的。如果你在反斜杠后添加了空格，可能会破坏你的代码，结果可能不是你预期的。\n\
    \n此更好的方法是将元素包含在括号内。如果行尾有一个未闭合的括号，下一行就会被连接，依此类推，直到出现闭合括号。你也可以使用方括号或大括号来实现相同的功能，只要你保持一致。\n\
    \n### 错误示例\n```python\nif attr == True:\n    print 'True!'\n\nif attr == None:\n\
    \    print 'None!'\n```\n\n### 正确示例\n```python\nif attr:\n    print 'True!'\n\n\
    if not attr:\n    print 'None!'\n```\n\n# 如何访问字典元素\n\n与其使用 `dict.has_key()` 方法，不如使用\
    \ `x in d` 语法或使用 `dict.get()` 来传递参数。\n\n### 错误示例\n```python\nd = {'hello': 'world'}\n\
    \nif d.has_key('hello'):\n    print d['hello']\nelse:\n    print 'default_value'\n\
    ```\n\n### 正确示例\n```python\nd = {'hello': 'world'}\nprint d.get('hello', 'default_value')\
    \ # 输出 'world'\nprint d.get('thingy', 'default_value') # 输出 'default_value'\n\n\
    # 或者：\nif 'hello' in d:\n    print d['hello']\n```\n\n# 快捷方式操作列表\n\n在操作列表时，不需要长篇大论；当你想要对列表执行操作时，使用列表推导式或\
    \ `filter()` 或 `map()` 函数来使用简洁语法。\n\n### 错误示例\n```python\n# 过滤所有大于 4 的元素\na =\
    \ [5, 4, 3]\nb = []\nfor i in a:\n    if i > 4:\n        b.append(i)\n```\n\n\
    ### 正确示例\n```python\na = [5, 4, 3]\nb = [i for i in a if i > 4]\n\n# 或者：\nb =\
    \ filter(lambda x: x > 4, a)\n```\n\n### 另一个错误示例\n```python\n# 给列表的所有成员加 3。\n\
    a = [5, 4, 3]\nfor i in range(len(a)):\n    a[i] += 3\n```\n\n### 另一个正确示例\n```python\n\
    a = [5, 4, 3]\na = [i + 3 for i in a]\n\n# 或者：\na = map(lambda i: i + 3, a)\n\
    ```\n\n"
- fmt: "\nThat said, if you find that you are having to keep on splitting up long\
    \ lines, it is just a sign that you are trying to do too much and this will affect\
    \ the readability of the code.\n\n# Chapter 7: Method and Function Arguments\n\
    \nFor the first argument in any instance method always use `self` and, for the\
    \ first argument in any class method, always use `cls`.\n\nIf the name of a function’s\
    \ argument is the same as one of the reserved keywords, then it is best to add\
    \ one trailing underscore than it is to use a corrupted spelling or an abbreviation.\
    \ As such, you should use `class_` rather than `clss`. Perhaps even better than\
    \ causing a clash - use a synonym.\n\n## Function Arguments\n\nThere are 4 ways\
    \ that you can pass an argument to a function:\n\n1. **Positional Argument** –\
    \ these are mandatory and do not contain any default values. The positional is\
    \ the simplest argument form and are used for the arguments that are a complete\
    \ part of the meaning of a function; they also have a natural order so, in the\
    \ following example, the function `user` should find it easy to remember that\
    \ the 2 functions need 2 arguments and they should remember the order:\n\n   `Send(message,\
    \ recipient)` and `point(x, y)`\n\n   In both cases, you can use the argument\
    \ names when you call the functions and, by doing this, you can change the order\
    \ the arguments are in. For example, you could call `send(recipient='world', message='Hello')`\
    \ and `point(y=2, x=1)`. However, as you can see from this, it is not very readable\
    \ and there are way more words there than we need. Compare that version to the\
    \ one that is more straightforward – `send('Hello', 'World')` and `point(1,2)`\
    \ and you can see the difference in readability instantly.\n\n2. **Keyword Argument**\
    \ – these do contain default values and they are not mandatory. Keyword arguments\
    \ are sometimes used for optional parameters that you send to the function. When\
    \ a function contains at least 2 or 3, preferably more, positional parameters,\
    \ it is not easy to remember. Using a keyword argument that has a default value\
    \ is more helpful. For example, you could define a complete `send` function as\
    \ `send(message, to, cc=None, bcc=None)`. The use of `cc` and `bcc` is optional\
    \ and both have a value of `None` if they are not given another value.\n\n   There\
    \ are a few ways that you can call a function with a keyword argument in Python.\
    \ For example, you could follow the argument order in a definition and no explicitly\
    \ name those arguments; for example, `send('Hello', 'World', 'Galactus', 'God')`.\
    \ In this, you are sending a carbon copy of the message to Galactus and a blind\
    \ carbon copy to God. You can also name the arguments in a different order, for\
    \ example, `send('Helloagain', 'World', bcc='God', cc='Galactus')`. Unless you\
    \ have a very good reason not to follow the correct syntax as closely as possible,\
    \ these two examples are best avoided; they are verbose and not readable. The\
    \ best way, the way that is closest to the function definition, is `send('Hello',\
    \ 'World', cc='Galactus', bcc='God')`.\n\n3. **Arbitrary Argument List** - This\
    \ is the next way of passing an argument to a function. Sometimes, the intention\
    \ of a function is better expressed with a signature that has a number of positional\
    \ arguments, a number that can be extended. In that case, you are better using\
    \ the `*args` constructs to define it. In the body of the argument, `args` is\
    \ a tuple of all of the positional arguments that are left. For example, you can\
    \ use `send(message, *args)` and list all of the recipients as a separate argument:\
    \ `send('Hello', 'Galactus', 'Dad', 'God')` – in the body of the function, `*args`\
    \ is equal to `('Galactus', 'Dad', 'God')`.\n\n   However, you should really use\
    \ this construct cautiously because it does have some drawbacks. If a function\
    \ is sent a list that contains arguments that are of the same or similar nature,\
    \ a better definition would be a function of a single argument; that single argument\
    \ would be a sequence or a list. For example, if `send` had several recipients,\
    \ you would be better with an explicit definition: `send('Hello', 'God', 'Dad',\
    \ 'Galactus')` and then call it by using `send('Hello', ['God', 'Dad', 'Galactus'])`.\
    \ In this way, the function user can change the recipient list beforehand and\
    \ that opens up the possibility for any sequence that can’t be unpacked to be\
    \ passed, and that includes iterators.\n\n4. **Arbitrary Keyword Argument Dictionary**\
    \ - This is final way of passing an argument to a function. If a function needs\
    \ an unknown array of named arguments, you can use the construct `**kwargs`. Within\
    \ the body of the function, `**kwargs` is a dictionary that contains all of the\
    \ named arguments that have been passed and not caught by another keyword argument\
    \ in the signature of the function.\n\n   However, you should use the same level\
    \ of caution that you did with arbitrary argument lists, for pretty much the same\
    \ reasons. These are powerful techniques that should only be used when you can\
    \ prove that it is necessary to use them. They most definitely should not be used\
    \ if there is a clearer and simpler construct that will do the job.\n\nIt really\
    \ is down to you, the programmer, to decide which of the function arguments are\
    \ optional keywords and which are positional and to determine whether you should\
    \ use the more advanced techniques to pass the arguments.\n\nKeep it simple and\
    \ follow these rules of writing Python functions that:\n\n* Are readable – the\
    \ names and the arguments do not need any explanations\n* Are easily changeable\
