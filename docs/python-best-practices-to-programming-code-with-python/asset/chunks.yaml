    ```\n\n### A Good Example\n```python\nmy_incredibly_big_string = (\n    \"For\
    \ many years, I would go to bed early. Sometimes, \"\n    \"when I had put out\
    \ my light, my eyes would shut so fast \"\n    \"that I would not even have time\
    \ to say “I am going to sleep.”\"\n)\n\nfrom some.module.inside.another.module\
    \ import (\n    a_good_function, another_good_function, yet_another_good_function\n\
    )\n```\n"
