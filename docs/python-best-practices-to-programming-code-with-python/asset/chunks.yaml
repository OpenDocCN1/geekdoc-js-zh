    \  print(var_four)\n```\n\n当涉及到延续行时，4 个空格缩进规则是可选的：\n\n```python\n# 悬挂缩进*可以*缩进多于或少于\
    \ 4 个空格。\nfoo = long_function_name(\n    var_four, var_three,\n    var_two, var_one)\n\
    ```\n\n当你使用带有可以跨多行的长条件的 `if` 语句时，请注意，条件语句中的其余行可以轻松创建一个 4 个空格的自然缩进——使用一个 2 个字符的关键字（例如\
    \ `if`）配合一个空格和一个左圆括号。然而，在视觉上，这看起来可能与 `if` 语句内部缩进的代码某种不兼容，因为内部已经有了 4 个空格的缩进。关于是否要将这些条件行与嵌套内部的代码区分开，并没有一个真正的标准，但有几个你可以使用的接受选项，包括但不限于：\n\
