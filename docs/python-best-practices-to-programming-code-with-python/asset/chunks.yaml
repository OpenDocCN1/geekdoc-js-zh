    ```python\nfour_lists = [[] for __ in xrange(4)]\n```\n\n注意——如果你正在使用 Python 3，请使用\
    \ `range()` 而不是 `xrange()`。\n\n### 从列表创建字符串\n\n创建字符串最常用的惯用法是在空字符串上使用 `.join()`：\n\
    \n```python\nletters = ['c', 'l', o, 't']\nword = ''.join(letters)\n```\n\n这会将“clot”的值赋值给变量\
    \ `word`。你可以将这种惯用法应用于元组和列表。\n\n### 在集合中查找项\n\n有时，你需要在集合中查找特定选项，有两种方法——使用列表或集合。\n\
    \n看这个示例：\n\n```python\ns = set(['c', 'l', 'o', 't'])\nl = ['c', 'l', 'o', 't']\n\
    \ndef lookup_set(s):\n    return 's' in s\n\ndef lookup_list(l):\n    return 's'\
    \ in l\n```\n\n"
- fmt: "\nNow, both of these functions look exactly the same simply because `lookup_set`\
    \ uses that fact that Python sets are hash tables. However, the performance of\
    \ `lookup` in each of the examples is different. In order to decide whether a\
    \ specific item is contained in a list, Python has to search through every single\
    \ item until it finds one that matches. This takes time, especially if you have\
    \ a long list. With sets, each item has a hash that tells Python where to look\
    \ for the matching item. This makes the search much quicker even if the sets are\
    \ big ones. You can also search dictionaries in the same way. Because there is\
    \ a difference in the performance, it is a better idea to use a set or a dictionary\
    \ rather than a list in the following cases:\n\n* Where a collection contains\
    \ a lot of items\n* Where you are going to be searching for items in a collection\
    \ on a repeated basis\n* There are no duplicate items\n\nIn cases of smaller collections\
    \ or those that you are not likely to be searching on a frequent basis, the extra\
    \ memory and time needed to set the hash table up will, more often than not, be\
