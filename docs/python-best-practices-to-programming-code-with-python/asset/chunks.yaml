    \ about the attributes – are they public, only to be used by the base class or\
    \ are they in the subclass API?\n\nWith all of this, these are the Pythonic guidelines:\n\
    \n*   A public attribute must not have a leading underscore\n*   If a public attribute\
    \ clashes with a keyword (reserved), add one trailing underscore to the attribute\
    \ name. This is the preferred method over using a corruption in spelling or an\
    \ abbreviation.\n*   With a public data attribute, the best way is to expose only\
    \ the name of the attribute, without using any complicated mutator or accessor\
    \ methods. If a simple attribute needs to expand its functional behavior, Python\
    \ makes it easy.\n*   If you are using a class that is going to be subclassed\
    \ and you are also using attributes that are not going to be subclassed, think\
    \ about adding 2 leading underscores but do not add in any trailing underscores.\
    \ This will invoke name mangling and helps to lower the risk of name clashes if\
    \ the subclasses have attributes with the same name in them.\n\n# Chapter 9: Using\
    \ Whitespace in Statements and Expressions\n\nFirst, some of the peeves about\
    \ whitespaces:\n\nDo not use unnecessary whitespaces in these cases:\n\n*   Immediately\
    \ within braces, brackets or parentheses\n\nA Good Example:\n```python\nham(spam[1],\
