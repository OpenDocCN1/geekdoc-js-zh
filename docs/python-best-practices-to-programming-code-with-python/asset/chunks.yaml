  trans: "\n\n*   `two_leading_and_two_trailing_underscores` 是存在于用户控制命名空间中的属性或“魔法”对象。例如：`__init__`、`__file__`\
    \ 或 `__import__`。\n\n## 规范性\n\n这些是你应该避免的名称：\n\n在编写单字符变量名时，永远不要使用‘O’（大写字母）、‘l’（小写\
    \ L）或‘I’（大写 i）。取决于你使用的字体，这些字符可能与数字‘0’和‘1’混淆——如果你发现自己正在考虑使用 `l`，请改用大写的 `L`。\n\n\
    ## 模块和包的命名\n\n所有模块名称都应该是短且小写的。你可以在模块名中使用下划线，但仅在它能提高可读性时才这样做。Python 包也是如此——使用短且小写的名称，但不要使用下划线。\n\
    \n当你有一个用 C 或 C++ 编写的扩展模块，并且配有一个具有更面向对象接口的 Python 模块时，C 或 C++ 模块将以下划线开头，例如 `_socket`。\n\
    \n## 类名\n\n类名通常使用 `CapWords` 或 `CamelCase` 约定。\n\n内置名称有自己独立的约定，通常是单个单词或两个单词合并为一个词，例如‘Hello’或\
    \ `HelloWorld`。`CamelCase` 约定倾向于用于内置常量和异常名称。\n\n## 类型变量\n\n类型变量的名称通常使用 `CamelCase`，并且偏于使用短名称，例如\
    \ `Num`、`AnyStr`。你应该为变量添加后缀（`_co` 或 `_contra`）来声明逆变或协变行为。例如：\n\n```python\nImport\
    \ TypeVar\n```\n\n变为\n\n```python\nVT_co = TypeVar('VT_co', covariant=True)\n\
    KT_contra = TypeVar('KT_contra', contravariant=True)\n```\n\n## 异常命名\n\n异常是类，因此，你应该使用类的命名约定进行命名。尽管如此，如果异常是一个错误，请确保在名称上加上‘Error’\
    \ 后缀。\n\n## 全局变量\n\n只要变量在单个模块内部使用，其命名约定与函数命名约定相同。\n\n## 函数\n\n所有函数名均为小写，并在需要的地方用下划线分隔单词以提高可读性。`mixedCase`\
    \ 约定仅在已经是这种风格的上下文中使用，以保持向后兼容。\n\n## 实例变量和方法名\n\n再次，函数的命名约定也适用于这里——使用带有间歇下划线的小写。如果你使用实例变量或非公共方法，应该使用单个前下划线。为了防止名称与子类冲突，应使用两个前下划线来触发\
    \ Python 的名称修饰（name mangling）规则。\n\n当这些规则被触发时，名称将与类名一起修饰。例如，`class Foo` 包含一个名为\
    \ `__a` 的属性。无法通过 `Foo.__a` 访问。按照规则，只有当名称可能与设计为子类的类属性冲突时，才应该使用双前下划线。\n\n## 常量\n\
    \n这些通常定义在模块级，全部大大写并用下划线分隔，例如 `MAX_OVERFLOW`。\n\n## 继承设计\n\n必须遵守的规则之一是确定实例变量或类方法是非公共还是公有的。如果你无法决定，请选择非公共，因为你以后可以轻松将其改为公共，而将公共改为非公共则没那么容易。\n\
    \n公共属性是指与类无关的客户端会使用的属性，而非公共属性是指不供第三方使用的属性。对于公共属性，你保证了从开始到结束的向后兼容；而对于非公共属性，你不保证，可以删除或更改该属性。注意，没有使用“private”（私有）一词，这是因为\
    \ Python 语言中没有真正的私有属性。\n\n另一个属性类别是保护属性。在 Python 中，它们属于子类 API。有些类专门设计为供继承的类，无论是为了扩展还是修改某些行为方面。当你设计这样的类时，始终要确保对属性做出显式决定——它们是公有的、还是仅供基类使用的，还是属于子类\
    \ API？\n\n结合以上所有内容，这些是 Pythonic 的指南：\n\n*   公共属性不能不能有前下划线。\n*   如果公共属性与关键字（保留字）冲突，请在属性名称末尾添加一个下划线。这是比使用拼写错误或缩写更优的方法。\n\
    *   对于公共数据属性，最好的方法是只暴露属性名称，而不使用任何复杂的修改器（mutator）或访问器（accessor）方法。如果简单的属性需要扩展其功能行为，Python\
    \ 使得这很容易。\n*   如果你正在使用一个将被子类的类，并且你也使用了不会被子类的属性，请考虑添加 2 个前下划线，但不要添加任何后下划线。这将触发名称修饰，并有助于降低子类具有相同名称属性时发生冲突的风险。\n\
    \n# 第 9 章：在语句和表达式中使用空格\n\n首先，关于空格的一些反感点：\n\n在以下情况下不要使用不必要的空格：\n\n*   紧邻大括号、中括号或圆括号内部\n\
    \n良好的示例：\n```python\nham(spam[1], {eggs: 2})\n```\n\n一个错误的示例：\n```python\nham(\
    \ spam[ 1 ], { eggs: 2 } )\n```\n\n*   紧邻冒号、分号或逗号之前：\n\n一个良好的示例：\n```python\n\
    if x == 4: print x, y; x, y = y, x\n```\n\n一个错误的示例：\n```python\nif x == 4 : print\
    \ x , y ; x , y = y , x\n```\n\n然而，在涉及切片（slice）时，冒号类似于二进制运算符，两边应包含相同数量的空格。在使用扩展切片时，两个冒号必须包含完全相同的间距级别。唯一的例外是省略了切片参数以及对应的空格。\n\
    \n一个良好的示例：\n```python\nspam[1:8], spam[1:8:2], spam[:8:2], spam[1::2], spam[1:8:]\n\
    spam[lower:upper], spam[lower:upper:], spam[lower::step]\nspam[lower+offset :\
    \ upper+offset]\nspam[: upper_fn(x) : step_fn(x)], ham[:: step_fn(x)]\nspam[lower\
    \ + offset : upper + offset]\n```\n\n一个错误的示例：\n```python\nspam[lower + offset:upper\
    \ + offset]\nspam[1: 8], ham[1 :8], ham[1:8 :2]\nspam[lower : : upper]\nspam[\
    \ : upper]\n```\n\n*   在位于函数调用参数列表的起始圆括号之前：\n\n一个良好的示例：\n```python\nham(1)\n```\n\
    \n一个错误的示例：\n```python\nham (1)\n```\n\n*   紧邻开始切片或索引的左括号之前：\n\n一个良好的示例：\n```python\n\
    dct['key'] = lst[index]\n```\n\n一个错误的示例：\n```python\ndct ['key'] = lst [index]\n\
    ```\n\n*   当运算符（如赋值运算符）周围有多个空格时，且这些空格是为了使其与另一个运算符对齐。\n\n一个良好的示例：\n```python\n\
    x = 1\ny = 2\nlong_variable = 3\n```\n\n一个错误的示例：\n```python\nx               =\
    \ 1\ny               = 2\nlong_variable = 3\n```\n\n## 其他建议\n\n避免在整个代码代码中使用行尾空格，因为它是不可见的且可能会导致混淆。例如，如果你输入了一个反斜杠，后面跟着一个空格然后换行——这不会被视为行延续。事实上，某些文本编辑器不会保留它，有些项目包含的\
    \ pre-commit hooks 也会直接拒绝它——其中之一就是 CPython。\n\n以下二进制运算符应该被单个空格包围——每侧一个：\n\n* \
    \  赋值 (`=`)\n*   复合赋值 (`+=`, `-=` 等）\n\n以下比较运算符的处理方式相同：\n\n*   `==` \n*   `<`\n\
    *   `>`\n*   `!=` \n*   `<>`\n*   `<=`\n*   `>=`\n*   `in`\n*   `not in`\n*  \
    \ `is`\n*   `is not`\n\n以及布尔值：\n\n*   `and`\n*   `or`\n*   `not`\n\n"
- fmt: "\nIf you use operators that have different priorities, think about putting\
    \ whitespace around the lowest priority operators – use your best judgment here.\
    \ However, you should not use any more than a single space and make sure that\
    \ each side of the operator has the same amount of whitespace – don’t put 1 on\
    \ one side and 2 on the other:\n\n### A Good Example:\n\n```\ni = i + 1\nsubmitted\
    \ += 1\nx = x*2 - 1\nhypot2 = x*x + y*y\nc = (a+b) * (a-b)\n```\n\n### A Bad Example:\n\
    \n```\ni=i+1\nsubmitted +=1\nx = x * 2 - 1\nhypot2 = x * x + y * y\nc = (a + b)\
    \ * (a - b)\n```\n\nWhen you use an `=` sign to indicate default values for parameters\
    \ or keyword arguments, do not use whitespace around the sign:\n\n### A Good Example:\n\
    \n```python\ndef complex(real, imag=0.0):\n    return magic(r=real, i=imag)\n\
    ```\n\n### A Bad Example:\n\n```python\ndef complex(real, imag = 0.0):\n    return\
    \ magic(r = real, i = imag)\n```\n\nUse the standard rules for colons with function\
    \ annotations and make sure there are spaces surrounding the `->` if it is used:\n\
    \n### A Good Example:\n\n```python\ndef munge(input: AnyStr): ...\ndef munge()\
    \ -> AnyStr: ...\n```\n\n### A Bad Example:\n\n```python\ndef munge(input:AnyStr):\
    \ ...\ndef munge()->PosInt: ...\n```\n\nWhen you combine a default value and an\
    \ argument annotation, spaces should surround the `=` sign – do not do this unless\
    \ the argument has both the default and the annotation:\n\n### A Good Example:\n\
    \n```python\ndef munge(sep: AnyStr = None): ...\ndef munge(input: AnyStr, sep:\
    \ AnyStr = None, limit=1000): ...\n```\n\n### A Bad Example:\n\n```python\ndef\
    \ munge(input: AnyStr=None): ...\ndef munge(input: AnyStr, limit = 1000): ...\n\
    ```\n\nIt is not good practice to use compound statements – several statements\
    \ on one line:\n\n### A Good Example:\n\n```python\nif foo == 'that':\n    do_that_thing()\n\
