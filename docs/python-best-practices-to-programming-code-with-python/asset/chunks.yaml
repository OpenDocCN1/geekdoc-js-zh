- fmt: "\n*   `two_leading_and_two_trailing_underscores` are attributes or “magic”\
    \ objects that reside in a namespace that is user-controlled. For example: `__init__`,\
    \ `__file__`, or `__import__`.\n\n## Prescriptive\n\nThese are the names you should\
    \ avoid:\n\nNever use ‘O’ (uppercase oh), ‘l’ (lowercase el) or ‘I’ (uppercase\
    \ eye) when you are writing variable names of a single character. Depending on\
    \ what font you are using, these may be, these can be confused with the numbers\
    \ ‘0’ and ‘1’ – if you do find yourself thinking about using `l`, use the uppercase\
    \ `L` instead.\n\n## Names for Modules and Packages\n\nAll module names should\
    \ be short and lowercase. You can use an underscore in a module name but only\
    \ if it makes it readable. The same goes for Python packages – short and lowercase\
    \ names – but don’t use underscores.\n\nWhere you have an extension module that\
    \ has been written in C or in C++ and it is accompanied by a Python module that\
    \ has an interface that is more object-oriented, the C or C++ module will have\
    \ a leading underscore, for example, `_socket`\n\n## Class Names\n\nClass names\
    \ usually use the `CapWords` or `CamelCase` convention.\n\nBuilt-in names have\
    \ their own separate convention and are usually a single word or 2 words in one,\
    \ for example, ‘Hello’ or ‘HelloWorld`. The `CamelCase` convention tends to be\
    \ kept for built-in constants and for exception names.\n\n## Type Variables\n\n\
    The names of the type variables usually use `CamelCase` and short names are preferred,\
    \ for example, `Num`, `AnyStr`. You should add a suffix (`_co` or `_contra`) to\
    \ the variables to declare contravariant or covariant behavior. For example:\n\
    \n```python\nImport TypeVar\n```\n\nWould become\n\n```python\nVT_co = TypeVar('VT_co',\
    \ covariant=True)\nKT_contra = TypeVar('KT_contra', contravariant=True)\n```\n\
    \n## Names of Exceptions\n\nExceptions are classes and, as such, you should use\
    \ the class convention for naming. That said, if the exception is an error, make\
    \ sure that you use the ‘Error’ suffix on the name.\n\n## Global Variables\n\n\
    Provided the variable is used inside a single module, the naming conventions are\
    \ the same as for naming functions.\n\n## Functions\n\nAll function names are\
    \ in lowercase and the words are separated by an underscore where needed to make\
    \ it more readable. `mixedCase` conventions are only to be used in the context\
    \ where this is already the style in order to keep backward compatibility intact.\n\
    \n## Instance Variables and Method Names\n\nAgain, the naming conventions for\
    \ functions apply here – using lowercase with intermittent underscores. If you\
    \ are using an instance variable or a non-public method, you should use a single\
    \ leading underscore. To stop a name from clashing with a subclass, two leading\
    \ underscores should be used as a way of invoking the name mangling rules in Python.\n\
    \nWhen these rules are invoked, the name is mangled with the class name. For example,\
    \ `class Foo` contains an attribute called__a`. This cannot be accessed using\
    \ `Foo.__a`. As a rule, you should only use a double leading underscore when the\
    \ name is likely to come into conflict with class attributes that are designed\
    \ as subclasses.\n\n## Constants\n\nThese tend to be defined on module level and\
    \ are all uppercase with separating underscores, for example, `MAX_OVERFLOW`\n\
    \n## Inheritance Design\n\nOne rule to abide by is to determine if the instance\
