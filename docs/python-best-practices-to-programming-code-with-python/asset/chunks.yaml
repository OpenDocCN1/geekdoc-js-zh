    \ must be separated with a line that contains one `#`.\n\n## Inline Comments\n\
    \nThese should be used as little as possible. As a refresher, an inline comment\
    \ is a comment that is placed on the same line that a statement is on. An inline\
    \ comment has to be separated from the statement by a minimum of two spaces and\
    \ they must begin with one `#` and one space.\n\nIn all honesty, you should avoid\
    \ using inline comments because they are not really necessary and can cause an\
    \ unwanted distraction.\n\nFor example, you should never do this:\n\n```python\n\
    x = x + 1 # Increment x\n```\n\nHowever, sometimes, this could be useful:\n\n\
    ```python\nx = x + 1 # Compensate for the border\n```\n\n# Chapter 6: Conventions\n\
    \nTo make your Python code much read better, follow these conventions:\n\nLook\
    \ to see if your variables are equal to a constant. There is no need for an explicit\
    \ comparison of the values to `0`, `None` or `True`; instead, you could add it\
    \ into the `if`-statement. Look at the following examples:\n\n### A Bad Example\n\
    \n```python\nif attr == True:\n    print 'True!'\n\nif attr == None:\n    print\
    \ 'attr is None!'\n```\n\n### A Good Example\n```python\n# Just look at the value\n\
    if attr:\n    print 'attr is the best!'\n\n# or check to see what the opposite\
    \ is\nif not attr:\n    print 'attr is the worst!'\n\n# or, as None is considered\
    \ to be false, make you sure you run an explicit check for it\nif attr is None:\n\
    \    print 'attr is None!'\n```\n\n## How to Access Dictionary Elements\n\nInstead\
    \ of using the method `dict.has-key()`, use the syntax, `x in d` or use `dict.get()`\
    \ to pass default arguments to. \n\n### A Bad Example\n\n```python\nd = {'hello':\
    \ 'world'}\n\nif d.has_key('hello'):\n    print d['hello']    # prints 'world'\n\
    else:\n    print 'the_default_value'\n```\n\n### A Good Example\n```python\nd\
    \ = {'hello': 'world'}\nprint d.get('hello', 'default_value') # prints 'world'\n\
    print d.get('thingy', 'default_value') # prints 'default_value'\n\n# Or:\nif 'hello'\
    \ in d:\n    print d['hello']\n```\n\n## Manipulate Lists the Short Way\n\nYou\
    \ don’t need to be long-winded when it comes to manipulating lists; use list comprehensions\
