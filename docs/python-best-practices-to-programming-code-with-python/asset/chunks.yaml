    Introduction


    I want to thank you and congratulate you for reading the book, “Python: Best Practices
    to Programming Code with Python”. This book contains proven steps and strategies
    on how to program in Python more effectively. When you first learn Python, you
    will be taught how to write code, but in many cases, you will not be taught how
    to write that code neatly.


    If you speak to any Python programmer, ask them what it is they like about Python.
    I guarantee they will tell you that one of the main reasons is because it is easily
    readable. In fact, this is the absolute heart of the Python language, simply because
    computer code is read far more than it is written. Much of this is down to the
    fact that Python code follows a set of guidelines and “Pythonic” idioms – if you
    hear a programmer refer to a part of the code as not being “Pythonic”, it means
    that it doesn’t follow those guidelines and it doesn’t express intent in any readable
    manner.


    Code style and layout is incredibly important, as is consistency in the style
    that you use. With that said, there are times when consistency isn’t the right
    thing and the guidelines are simply not applicable – you have to know when that
    time is and that is when best judgment comes into programming with Python.


    With this guide, I am going to show you the absolute best way to write your code,
    tidying up your program and making it all more effective and efficient. I won’t
    just give you the basic. I will delve deep into everything you need to know, from
    the layout of the code to how to write functions, idioms, and names. 


    I will talk about whitespaces and tabs, strings, and methods. I will also be giving
    you some general recommendations for Python programming along with the general
    concepts. In short, by the time you have read my Best Practice guide, you will
    be the best Python programmer you can possibly be.


    My book does assume some prior knowledge of Python programming, so if you are
    a complete newbie to the programming scene, please familiarize yourself with Python
    code before you read this book. My aim is to help you to produce Python code that
    is free from, or at least has very few, complications or obvious problems, as
    well as making it more readable for others.


    Thanks again for reading this book, I hope you enjoy it!


    # Chapter 1:


    General Concepts of Python Coding


    Before we get properly into the book, these are the general concepts of coding
    that you should be aware of; concepts that will make life easier for you.


    ## Explicit Code


    While you can do all sorts of weird and wonderful things with Python, it is best
    to keep it straightforward and explicit.


    A Bad Example:


    def make_complex(*args):


        x, y = args


        return dict(**locals())


    A Good Example:


    def make_complex(x, y):


        return {''x'': x, ''y'': y}


    Compare these examples; in the latter example of code, we explicitly received
    x and y from the caller and the return is an explicit dictionary.


    The developer who wrote this knows what to do just by looking at the first line
    and the last line; this is not the case with the bad example.


    ## One Line, One Statement


    While there are compound statements, like the list comprehensions, that are allowed
    and, in many cases, appreciated, it is not good practice to have 2 statements
    that are disjointed on one code line.


    A Bad Example:


    print ''one''; print ''two''


    if x == 1: print ''one''


    if <complex comparison> and <other complex comparison>:


        # do something


    A Good Example:


    print ''one''


    print ''two''


    if x == 1:


        print ''one''


    cond1 = <complex comparison>


    cond2 = <other complex comparison>


    if cond1 and cond2:


        # do something


    ## Returning Values


    When you get a function that is ever-growing in complexity, it isn’t unheard of
    to use several return statements in the body of the function. However, if you
    want to maintain clear intent and a good level of readability, you should try
    not to return values from several points in the function body.


    When it comes to returning values within a function, there are 2 cases for doing
    so: the result that comes from a normally processed function return, and the errors
    that are indicative of incorrect input parameters or for any reason that the function
    cannot complete the computation.


    If you don’t want exceptions raised for the latter case, then it might be necessary
    for values, such as False or None to be returned, as an indication that the function
    was not able to perform properly. In cases such as this, it is best practice to
    return as soon as the wrong context has been noticed.


    This will help to neaten up the function structure because all code that comes
    after the error return assumes that the condition has been met so that the main
    function result can be computed. As such, it is sometimes necessary to have several
    return statements like this.


    That said, if a function contains several different courses it can go, it can
    be unwieldy to debug the result so it is preferable to maintain just one course.
    This also helps in working out code paths and, if you have several courses, it
    could be an indication that you need to re-look at your code and tidy it up.


    For Example:


    def complex_function(c, b, a):


        if not c:


            return None  # Raising an exception might be better


        if not b:


            return None  # Raising an exception might be better


        # Some elaborate code that is trying to make x from c, b and a'
