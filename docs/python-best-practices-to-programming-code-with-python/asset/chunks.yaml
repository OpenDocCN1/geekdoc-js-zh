    - 结论\n- 关于作者\n\n© Copyright 2017 by Charlie Masterson - 版权所有。\n\n未经作者直接书面许可，本书的内容不得复制、复制或传输。\n\
    \n在任何情况下，出版者对因本文包含的信息直接或间接导致的任何赔偿、损害或资金损失不承担任何法律责任或指责。\n\n### 法律声明\n本书受版权保护。本书仅供个人使用。未经作者同意，您不得修改、分发、销售、使用、引用或转述本书的任何部分或内容。\n\
    \n### 免责声明\n请注意，本文档包含的信息仅供教育和娱乐之用。我们已尽一切提供准确、最新、可靠且完整的信息。不提供任何形式的明示或隐含保证。读者承认作者并未提供法律、财务、医疗或专业建议。本书的内容源自各种来源。在尝试书中概述的任何技术之前，请咨询执业的专业人士。\n\
    \n通过阅读本文，读者同意在任何情况下，作者均不对因使用本文档包含的信息（包括但不限于错误、遗漏或不准确）而导致的任何直接或间接损失负责。\n\n## 引言\n\
    \n我想感谢你并祝贺你阅读《Python：Python 编程最佳实践》一书。本书包含了如何更有效地编写 Python 代码的成熟步骤和策略。当你初学 Python\
    \ 时，人们会教你如何编写代码，但在很多情况下，他们不会教你如何写出整洁的代码。\n\n如果你接触任何 Python 程序员，问问他们喜欢 Python 的地方是什么。我保证他们会告诉你，主要原因之一是它易于阅读。事实上，这是\
    \ Python 语言的核心所在，因为计算机代码被阅读的次数远多于编写的次数。这很大程度上是因为 Python 代码遵循了一系列指南和“Pythonic”（Python\
    \ 风格）惯用用法——如果你听到程序员说某部分代码不“Pythonic”，就意味着它没有遵循这些指南，并且没有以任何可读的方式表达其意图。\n\n代码风格和布局至关重要，你所使用的风格的一致性也是如此。尽管如此，有时一致性并不是正确的选择，而指南也简单并不适用——你必须知道何时是这种情况，而这就是进行\
    \ Python 编程时最佳判断所在。\n\n通过本指南，我将向你展示编写代码的绝对最佳方式，整理你的程序并使其更加有效、高效率。我不会只给你基础知识。我将深入探讨你需要了解的一切，从代码布局到如何编写函数、惯用用法和命名。\n\
    \n我将谈到空白符和制表符、字符串和方法。我还将针对 Python 编程提供一些通用建议以及通用概念。简而言之，当你读完我的最佳实践指南时，你将成为最优秀的\
    \ Python 程序员。\n\n# 第 1 章：Python 编码通用概念\n\n在我们正式进入书籍内容之前，这些是你应该注意的通用概念。\n\n###\
    \ 显式代码\n虽然你可以用 Python 做一些奇怪的事情，但最好保持显式。\n\n**糟糕的示例：**\n```python\ndef make_complex(*args):\n\
    \    x, y = args\n    return locals()\n```\n\n**良好的示例：**\n```python\ndef make_complex(x,\
    \ y):\n    return {'x': x, 'y': y}\n```\n对比这些示例；在后一个示例中，我们显式地返回字典。\n\n### 一行一条\n\
    虽然允许复合语句（如列表推导式），并且在很多情况下受到推崇，但在同一行内有两个不连续的语句并不是好的做法。\n\n**糟糕的示例：**\n```python\n\
    print 'one'; print 'two'\nif x == 1: print 'one'\n```\n\n**良好的示例：**\n```python\n\
    print 'one'\nprint 'two'\nif x == 1:\n    print 'one'\n```\n```python\nif cond1\
    \ and cond2:\n    # 执行某些操作\n```\n\n### 返回值\n当你得到一个复杂度不断增长的函数时，在体中使用多个 `return`\
    \ 语句并非罕见。然而，如果你想保持清晰的意图良好的可读性，你应该尽量避免从函数的多个点返回值。\n\n在函数内部返回值，有两种情况：来自正常处理的函数返回的结果，以及指示输入参数错误或由于任何原因函数无法完成计算的错误。\n\
    \n如果你不想在后一种情况下抛出异常，那么可能需要返回诸如 `False` 或 `None` 等值，作为函数未能正常执行的指示。在这样的情况下，最佳实践是在注意到错误上下文后立即返回。\n\
    \n这将有助于整洁函数结构，因为错误返回之后的所有代码都假设条件已经满足，以便计算主函数的结果。因此，有时需要像这样的多个 `return` 语句。尽管如此，如果一个函数包含多个不同的路径，调试结果将变得非常困难，因此最好只维护一条路径。这有助于理清代码路径，而且如果你有多个路径，这可能表明你需要重新审视你的代码并整理它。\n\
    \n**示例：**\n```python\ndef complex_function(c, b, a):\n    if not c:\n        return\
    \ None  # 抛出异常可能更好\n    if not b:\n        return None  # 抛出异常可能更好\n    # 尝试从\
    \ c, b 和 a 生成 x 的复杂代码\n```\n"
- fmt: "\n# Try not to return x if successful\n\n```python\nif not x:\n    # A Plan-B\
    \ calculation of x\n    return x  # One exit point for the value x will be helpful\
    \ when trying to maintain the code.\n```\n\n## Chapter 2: Programming Recommendations\n\
    \nThese are the basic recommendations for writing Python code, recommendations\
    \ that you should follow if your code is going to be more effective and efficient\
    \ as well as being readable.\n\n- Your code must be written so that it doesn’t\
    \ disadvantage other Python implementations, such as `IronPython`, `Jython`, `PyPy`,\
    \ `Psyco` and `Cython`.\n\nFor example, you should never rely on the efficient\
    \ string concatenation of `CPython` that takes the form of `a=a+b` or `a+=b`.\
    \ This is a somewhat fragile optimization, even though it super-efficient in `CPython`,\
    \ because it won’t work on all type it won’t be present in any Python implementation\
    \ that does not use refcounting.\n\nInstead, where you use a part of the library\
    \ that is performance-sensitive, you should use the `.join()` form instead. This\
    \ will make sure that the concatenation is linear across all the different Python\
    \ implementations.\n\n- Never use an equality operator to make comparisons to\
    \ a singleton such as `None`. Instead, use `is` or `not`.\n\nYou should also be\
    \ wary of using `if x` when really you should be using `if is not None`. An example\
    \ of this is when you are testing if an argument or a variable that defaults to\
    \ a value of `None` was actually set to a different value. The other value could\
    \ have a type that is false in the Boolean context.\n\n- Rather than using the\
    \ operator `not...is`, you should use `is not`. While they both are identical\
    \ in terms of function, the first is low on the readability scale, making the\
    \ second one more preferable. An example:\n\nUse This:\n```python\nif foo is not\
    \ None:\n```\n\nDon’t Use This:\n```python\nif not foo is None\n```\n\n- When\
    \ you implement an ordering operation with a rich comparison, you should implement\
    \ all of the 6 operations instead of relying on some other code to exercise a\
    \ comparison. Those operations are (`__eq__`, `__lt__`, `__ne__`, `__ge__`, `__gt__`,\
    \ `__le__`).\n\nTo cut down on the effort needed, one particular decorator helps\
    \ to generate any comparison methods that are missing. That decorator is `functools.total_ordering()`.\n\
    \nThe style guidelines indicate that Python assumes reflexivity rules. As such,\
    \ the Python interpreter might change things by swapping `y > x` with `x < y`,\
    \ or it may swap `y >= x` with `x <= y`.\n\nYou may also find that the argument\
    \ `x == y` has been swapped with `x != y`. The `min()` and `sort()` operations\
    \ will also definitely use the `<` operator and the `max()` function will use\
    \ the `>` operator. However, you should, as a best practice guide, use all of\
    \ them so that there is no confusion.\n\n- Rather than using an assignment statement\
    \ that will bind a lambda expression to an identifier, use a `def` statement.\n\
    \nA Good Example:\n```python\ndef f(x): return 2*x\n```\n\nA Bad Example:\n```python\n\
    f = lambda x: 2*x\n```\n\nThe first example shows that the name given to the function\
    \ object is `f` rather than the collective `<lambda>`. This is the most useful\
    \ for string representations and for tracebacks and, by using the assignment statement,\
    \ you cut out the one benefit that a lambda expression offers over and above a\
    \ `def` statement – that it may be embedded within a bigger statement.\n\nWhen\
    \ you want to derive exceptions, use `Exception` and not `BaseException`. Inheritance\
    \ from the latter is reserved for those exceptions where it is pretty much always\
    \ wrong to catch them.\n\nWhen you design your exception hierarchies, base them\
    \ on the quality that is likely to be needed by catching exceptions, rather than\
    \ on the location where the exception is raised. Always answer one question –\
    \ “what has gone wrong?” rather than just saying that something is wrong. Use\
    \ the conventions for class naming but do remember to add the “Error” suffix to\
    \ the exception classes that produce an error.\n\nThere is no need to put any\
    \ special suffixes on exceptions that are not errors and are used as flow-control\
    \ or another form of signaling.\n\n- When you use exception chaining, use it only\
    \ where needed.\n\nWhen you replace an inner exception deliberately, make sure\
    \ that the right details are relocated into the newer exception. Examples of this\
    \ are making sure the name of the attribute is preserved when you convert `KeyError`\
    \ to `AttributeError` or when you embed the original exception text into the message\
    \ in the newer exception.\n\n- When using Python 2 and you raise an exception,\
    \ always use the `raise ValueError('message')` instead of `raise ValueError 'message'`.\n\
    \nThis is because the second example is neither valid nor legal syntax for Python\
