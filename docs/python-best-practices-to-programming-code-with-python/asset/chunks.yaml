    When you write a comment, ensure that it is a proper sentence with a proper ending.
    As it is when you write anything, your comment, be it a sentence or a phrase,
    must have a capital letter to start it. The only exception to that rule is if
    it is an identifier that starts with a lower-case letter – a golden rule here
    is that you NEVER change the case of an identifier!


    If you are using a short comment you can leave off the full-stop at the end. If
    you are writing block comments, these tend to be made up of at least one paragraph,
    sometimes more, each one built from whole sentences. Each of these sentences must
    have a full-stop. Following each full-stop there should be 2 spaces and all comments
    should be written in English. The only exception to this is if you are 200% certain
    that your code is never going to be read by people who do not speak or read your
    language


    ## Block Comments:


    A block comment tends to apply to some or all of the code that comes after it.
    The comment should be indented in the exact same way as the code it refers to
    and each line of each block must begin with a # and one space. The only exception
    is if you have used indented text within the comment. All paragraphs in each block
    comment must be separated with a line that contains one #.


    ## Inline Comments


    These should be used as little as possible. As a refresher, an inline comment
    is a comment that is placed on the same line that a statement is on. An inline
    comment has to be separated from the statement by a minimum of two spaces and
    they must begin with one # and one space.


    In all honesty, you should avoid using inline comments because they are not really
    necessary and can cause an unwanted distraction.


    For example, you should never do this:


    x = x + 1                 # Increment x


    However, sometimes, this could be useful:


    x = x + 1                 # Compensate for the border


    #   Chapter 6:


    Conventions


    To make your Python code much read better, follow these conventions:


    Look to see if your variables are equal to a constant. There is no need for an
    explicit comparison of the values to 0, None or True; instead, you could add it
    into the if-statement. Look at the following examples:


    A Bad Example:


    if attr == True:


        print ''True!''


    if attr == None:


        print ''attr is None!''


    A Good Example:


    # Just look at the value


    if attr:


        print ''attr is the best!''


    # or check to see what the opposite is


    if not attr:


        print ''attr is the worst!''


    # or, as None is considered to be false, make you sure you run an explicit check
    for it


    if attr is None:


        print ''attr is None!''


    ## How to Access Dictionary Elements:


    Instead of using the method dict.has-key(), use the syntax, x in d or use dict.get()
    to pass default arguments to.


    A Bad Example:


    d = {''hello'': ''world''}


    if d.has_key(''hello''):


        print d[''hello'']    # prints ''world''


    else:


        print ''the_default_value''


    A Good Example:


    d = {''hello'': ''world''}


    print d.get(''hello'', ''default_value'') # prints ''world''


    print d.get(''thingy'', ''default_value'') # prints ''default_value''


    # Or:


    if ''hello'' in d:


        print d[''hello'']


    ## Manipulate Lists the Short Way


    You don’t need to be long-winded when it comes to manipulating lists; use list
    comprehensions or the filter() or map() functions to use concise syntax when you
    want to perform an operation on a list.


    A Bad Example:


    # Filter all elements that are more than 4


    a = [5, 4, 3]


    b = []


    for i in a:


        if i > 4:


            b.append(i)


    A Good Example:


    a = [5, 4, 3]


    b = [i for i in a if i > 4]


    # Or:


    b = filter(lambda x: x > 4, a)


    Another Bad Example:


    # Add 3 to all members f the list.


    a = [5, 4, 3]


    for i in range(len(a)):


        a[i] += 3


    Another Good Example:


    a = [5, 4, 3]


    a = [i + 3 for i in a]


    # Or:


    a = map(lambda i: i + 3, a)


    You can also use the function enumerate() to keep an account of where you are
    in a list:


    a = [5, 4, 3]


    for i, item in enumerate(a):


        print i, item


    # prints


    # 0 5


    # 1 4


    # 2 3


    This function reads better than trying to manually handle a counter and it is
    far more optimal for iterators


    ## Reading from a File


    When you want to read from a file, it is best to use the with open syntax as this
    will close the files for you automatically.


    A Bad Example:


    f = open(''file.txt'')


    a = f.read()


    print a


    f.close()


    A Good Example:


    with open(''file.txt'') as f:


        for line in f:


            print line


    Using the with statement is far more efficient because it makes sure the file
    is always closed even when the with block contains an exception


    ## Line Continuations


    There are accepted limits to logical code lines and when you have one that is
    longer, it should be split up over several lines. Your Python interpreter will
    take consecutive lines and, so long as the final character on each line is a backslash
    (/), it will join the lines. However, although this can be useful sometimes, really
    you should avoid doing it because it can be fragile. If you were to add a whitespace
    after the backslash, it can break your code and the results might not be what
    you expected.


    A better way to do this is to enclose elements inside parentheses. If there is
    an unclosed parenthesis at the end of the line, the next line will be joined,
    and so on until there is a closed parenthesis. You could also use square or curly
    braces to do the same thing, so long as you remain consistent – whatever you use
    to start, you must also use to finish.


    A Bad Example:


    an_incredibly_big_string = """For many years I would go to bed early. Sometimes,
    \


        after I had put out my light, my eyes would shut so fast that I would not
    even \


        have the time to say “I am going to sleep.”"""


    from some.module.inside.another.module import a_good_function, another_good_function,
    \


        yet_another_good_function


    A Good Example:


    my_incredibly_big_string = (


        "For many years, I would go to bed early. Sometimes, "


        "when I had put out my light, my eyes would shut so fast "


        "that I would not even have time to say “I am going to sleep.”"


    )


    from some.module.inside.another.module import (


        a_good_function, another_good_function, yet_another_good_function)'
