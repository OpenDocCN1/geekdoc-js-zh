    ## 第一章：JavaScript 的演变


    JavaScript 最初由 Brendan Eich 在 1995 年仅用 10 天时间创建，从它简微的起点已经走了很远。它最初在 Netscape Communications
    公司作为一种名为 "LiveScript" 的语言，但后来由于与 Sun Microsystems 的战略合作而被重命名为 "JavaScript"。


    ### JavaScript 的诞生 (1995)

    JavaScript 的第一个版本于 1995 年 9 月在 Netscape Navigator 2.0 中推出。它的主要目的是让网页更具动态感和交互性。它允许开发者操作文档对象模型
    (`DOM`) 并响应用户操作。


    ### 浏览器大战中的 JavaScript

    在 90 年代后期，Web 正处于 Netscape 和微软 Internet Explorer 之间的“浏览器大战”正进行中。这种竞争导致了 JavaScript
    的快速发展和创新，因为这两个浏览器都旨在通过新功能来胜过对方。


    ### ECMAScript 标准化 (1997)

    为了确保 JavaScript 在不同浏览器之间的兼容性，`ECMAScript` 作为该语言的标准化规范被引入。1999 年发布的 `ECMAScript`
    3 成为了 JavaScript 的事实标准。


    ### 黑暗时代 (2000 年初)

    在 21 世纪初，JavaScript 经常被视为一种受浏览器兼容性问题困扰的局限语言。这段时期让 JavaScript 赢得了难以使用的声誉。


    ### Ajax 革命 (2005)

    Gmail 以及其他使用异步 JavaScript 和 XML (`Ajax`) 的 Web 应用发布改变了人们对 JavaScript 的看法。它证明了
    JavaScript 可用于构建高度响应和交互式的 Web 应用。


    ### ECMAScript 5 和 5.1 (2009-2011)

    这些更新为语言带来了显著改进，引入了如 `JSON` 支持、严格模式和增强的数组操作方法等特性。


    ### jQuery 的兴起 (2006-2010)

    `jQuery` 是一个流行的 JavaScript 库，简化了 `DOM` 操作和事件处理，让开发者更容易编写跨浏览器代码。


    ### Node.js 的出现 (2009)

    基于 `V8` JavaScript 引擎构建的 `Node.js` 允许开发者使用 JavaScript 进行服务端编程，为构建可扩展和实时应用开启了新的可能性。


    ### ES6 (ECMAScript 2015)

    `ECMAScript` 2015 也称为 `ES6`，它为 JavaScript 带来了巨大的增强，包括箭头函数、类、Promise 和模板字符串，使这种语言更加强大且更具表现力。


