    The returned object provides methods to interact with that variable.


    Callbacks and Event Handling: Closures are commonly used in event handling and
    callbacks. When you pass a function as a callback to another function, it "closes
    over" the variables it needs. For example:


    function sayHello(name) {


    return function () {


