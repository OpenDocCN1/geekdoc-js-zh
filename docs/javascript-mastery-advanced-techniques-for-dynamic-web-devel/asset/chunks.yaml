    Chapter 4: Asynchronous Programming with Promises


    Asynchronous programming with Promises is a way to handle tasks in JavaScript
    that take some time to finish, like loading data from a server or reading a file,
    without blocking your entire program. Let me explain it in a simple manner.


    Imagine you have a to-do list, and you want to do three things: wash the dishes,
    do your homework, and watch a movie. You start by putting the dishes in the sink,
    then start your homework, and while doing that, you also want to check if your
    friend has finished making popcorn for the movie.


    In traditional programming, you might wash the dishes, then wait until they''re
    completely done before starting your homework. Only after homework is finished,
    you''d check on the popcorn. This is like blocking your time for each task.


    But with Promises, you can be more efficient. You put the dishes in the sink,
    start your homework, and tell your friend, "When the popcorn is ready, let me
    know." Now, instead of waiting for the popcorn, you can focus on your homework.
    When the popcorn is done, your friend will let you know, and you can pause your
    homework to watch the movie.


    In JavaScript, Promises work similarly. You create a Promise for a task that might
    take time, and you say, "When this task is done, do something with the result."
    Meanwhile, your program can continue doing other things, just like you continued
    your homework while waiting for the popcorn.


    Promise Basics:


    In JavaScript, a Promise is like a contract. It promises to give you a result
    when it''s ready, or it tells you if something went wrong.


    A Promise has three states: pending (it''s working), fulfilled (it''s successful),
    or rejected (something went wrong).


    You create a Promise by using the new Promise() constructor.


    Handling Promises:


    To work with Promises, you use .then() and .catch() methods. .then() is used when
    the Promise is fulfilled, and .catch() is used when it''s rejected.


    This allows you to write code that says, "When the task is done, do this. If there''s
    an error, catch it and handle it gracefully."


    Chaining Promises:


    Promises can be chained together. This means you can set up a sequence of tasks
    that should be done one after the other.


    For example, you can fetch some data from a server, then process it, and finally
    display it, all in a neat chain of Promises.


    Here''s a simple example:


    // Creating a Promise that simulates fetching data


    const fetchData = () => {


    return new Promise((resolve, reject) => {


    setTimeout(() => {


    const data = { message: "Data fetched successfully!" };


    resolve(data); // Resolve when data is ready


    // If something went wrong, you can use reject() instead


    }, 2000);


    });


    };


    // Using the Promise


    fetchData()


    .then((result) => {


    console.log(result.message); // Data fetched successfully!


    return result; // Pass the result to the next .then()


