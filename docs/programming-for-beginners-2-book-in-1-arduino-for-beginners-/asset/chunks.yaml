    `DigitalReadSerial`: This command lets the Arduino read a switch. Then, the Arduino
    will make this visible by printing the state to a serial monitor.


    ## Analog


    The analog commands are designed to work specifically with the analog inputs and
    outputs on the Arduino board. These include `Analog Input`, `AnalogInOutSerial`,
    `Calabration`, `AnalogWriteMega`, `Smoothing`, and `Fading`.


    - `Analog Input`: This command is used with a potentiometer to cause an LED to
    blink on and off as needed.

    - `AnalogInOutSerial`: This command works by first reading an analog input pin.
    Then, `AnalogInOutSerial` maps the result of the input pin and uses those results
    to cause an LED light to either brighten or dim.

    - `Calibration`: This command is used to define expected values for an analog
    sensor using a minimum and maximum value.

    - `AnalogWriteMega`: This command is designed to work with the Arduino Mega microcontroller.
    It sequentially fades 12 separate LEDs on and off.

    - `Smoothing`: The smoothing command is used to smooth analog input readings if
    there are several of them.

    - `Fading`: As the command name suggests, the fading command is responsible for
    causing an LED to fade. It does this using a PWM pin.


    ## Digital


    The digital functions can play musical tones, control the function of LEDs, and
    read pushbuttons. These functions include `Simple Keyboard`, `Tone`, `Tone4`,
    `Pitch Follower`, `Debounce`, `Button State Change`, `Button`, and `Blink Without
    Delay`.


    - `Simple Keyboard`: This turns your Arduino into a musical keyboard with three
    keys by using a pizo speaker and force sensors.

    - `Tone`: This command is to be used in conjunction with a Piezo speaker to play
    a melody.

    - `Tone4`: This uses the `tone` command with multiple speakers to play sequential
    tones.

    - `Pitch Follower`: This uses an analog input and a Piezo speaker to play a certain
    pitch.

    - `Debounce`: This command is used to filter noise by reading a pushbutton that
    has been linked to your Arduino.

    - `Button State Change`: This command allows your Arduino to count the number
    of times a button has been pressed.

    - `Button`: The button command allows your Arduino to control an LED when an attached
    pushbutton is pressed.

    - `Blink Without Delay`: This command allows an LED on your board to blink without
    the delay function, meaning it can blink faster or remain constantly lit.


    # Chapter 13: C language Basics


    ### The Memory Maps


    When you create an Arduino program, it is essential to have some knowledge about
    the working of computer systems. Even though C programming is the language that
    is close to the machines, how certain things are done when the program runs will
    become clear.


    A primary system consists of the control device referred to as the CPU or microcontroller.
    There are a few differences when it comes to some of these. We shall dig deep
    into this later. Just to mention, microcontrollers may not be that powerful compared
    to the standard microprocessor. However, it still contains input, output ports,
    as well as hardware functions.


    Microprocessors are connected to the external Memory. Generally, microcontrollers
    contain a sufficient amount of onboard memory. However, it should be noted that
    we are not referring to the large sizes; it is possible for a microcontroller
    to have only a few hundred bytes or so of memory for the simple applications.
    Don’t forget that a memory byte has `8` bits, and each bit can either be true
    or false, high or low and `I/ O`.


    When it comes to the relation between the processor and the functional data stored
    in the memory, data must be kept in the processor’s register. The register is
    the only place where we can have logical mathematical operations carried out.
    For example, if you would like to carry out an addition of two variables, the
    value of the variables has to be moved over to the register.


    ### Memory Maps


    Each memory byte in the computer system has a connected address. Now, if we do
    not have the address, the processor will not have a means to identify a particular
    memory. In general, the memory address begins from `0` as it increases. Even though
    we have specific addresses with a private or unique system, a particular address
    may not point to the input and output port of external communication.


    Most of the time, you will find it necessary to map-out the memory. This is merely
    a massive array of memory slots. We have people who develop a memory map and have
    the address with the least value positioned at the top while others who draw a
    memory map and assign the least address at the bottom. Each address points to
    a place where it can have the byte stored. However, the C compiler will complete
    this. For instance, if we declare the `char` variable as `-X`. It can be located
    at address `2`, so if we print the value, there would be no need to select the
    value at the address `2`. We will instead write “select the X value” where the
    compiler produces code to ensure that it works correctly to the right address.
    Using this level of abstraction simplifies the whole process. However, since most
    variables carry a specific amount that is higher than one byte, we might have
    to collect these addresses to hold only a single value. For example, if we pick
    a `short int`, then it will require us to have two bytes. Now, if the following
    address starts at `four`, there is a need to use the address `5`. When we choose
    to access this particular variable, the compiler will automatically build the
    code and make use of all the addresses since it is aware of the presence of the
    `short int`.


    ### Stacks


    Most programmers prefer to use temporary storages for the variables. What this
    means is that there are variables that are used for a short period then they are
    discarded. Therefore, it will not be right if we move on and allocate a permanent
    space for this particular variable. Ordinarily, an application is made up of two
    parts: the code and the data. The data part is permanent since these two parts
    cannot consume the whole memory; the remaining memory is used temporarily for
    storage via the stack. It starts at the opposite end of the memory map; the stack
    increases towards the data part as well as the code. It is similar to the stack
    of trays. The first tray on the stack will be the last to be pulled off. Any time
    temporary variables are needed, this part of the memory is used. Given that many
    items are required, most of the memory will be used up. When the code ends, the
    temporary variables declared are no longer useful, and therefore the stack shrinks.


    ### The Basics of C-language


    C language is designed for professional developers who want to accomplish many
    things with less code. C is a compiler language. This shows that once we have
    written the program, we must transfer it into the compiler that will begin to
    change the C language instructions into a machine code that the microcontroller
    can manage.


    As you can see, this is an additional step to take, but it will result in a better
    program compared to the interpreter. After this, the interpreter will convert
    the code from the machine language.


    However, C is not the same as in other languages. It is a free-flow language.
    We have the statements, functions, and variables. Variables, as we have already
    seen, are objects that can store things. It can be a floating-point number or
    other types of variables. Statements have assignments, operations and so on.


    Functions have statements and can call other functions.

