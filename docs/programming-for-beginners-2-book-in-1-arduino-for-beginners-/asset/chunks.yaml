    \ It does this by wrapping the entire library in one large self-executing function.\n\
    \n## Typeof Operator\n\nYou might run into a situation where you need to determine\
    \ the type of variable that you are working in JavaScript. You won’t have call\
    \ Sherlock Holmes to find that! Instead, you can simply use the `typeof` operator\
    \ to determine the type of any specific value. In other words, the `typeof` operator\
    \ is used to evaluate the type of the operand.\n\nEX-\n\n```javascript\nvar myvar=0\n\
    alert(typeofmyvar) //alerts “number”\n```\n\nNumber isn’t the only type of operand\
    \ that can be detected. It can also be: string, Boolean, object, null, and not\
    \ defined.\n\n## Scope\n\nScope is the accessibility of a variable.\n\nA good\
    \ understanding of Scope is necessary when it comes to debugging because it allow\
    \ you to know what variable from which code block is causing the problem.\n\n\
    The simple rule here is that whenever you declare a variable inside a scope, it\
    \ will only be recognized by the statements that are inside that scope; the statements\
    \ that are outside the scope will not acknowledge its existence and so that variable\
    \ will not work.\n\nAnother way to look at this is to imagine your entire code\
    \ as a hotel with specific functions and sections of code as hotel rooms. The\
    \ hotel rooms represent the private scopes of the code, while the common areas\
    \ represent the global scope. A person in one hotel room cannot see or use what\
    \ is in another hotel room. Staff who work in the hotel (and the global scope)\
    \ also don’t have access to private hotel rooms unless they have specific permission.\
    \ Meanwhile, guests can go through the common areas and make use of any object\
    \ there. \n\nThus, you can see how scope can affect how your code runs. If you\
    \ need two different functions to access the same variable, you need to ensure\
    \ that they both have access to it. One key way to ensure that the necessary variables\
    \ have access to is to make your variables globally accessible.\n\nThere are two\
    \ possible alternatives if you want your variables to become globally accessible.\
    \ \n\nThe first thing you can do is to declare the variable outside the scope\
    \ of your given piece of code, this will allow any functions in your program to\
    \ be able to call it and recognize it.\n\nThe other thing you can do is to declare\
    \ the variables inside your scope without using the word `var`. If the same variable\
    \ was not defined at the beginning of the code outside the scope of the piece\
    \ of code in question, then the variable will act similarly to a global one.\n\
    \nEx-\n\n```javascript\nvar foo = ‘hello’;\nvar talkHello = function() {\nconsole.log(foo);\n\
    };\n\ntalkHello(); // logs ‘hello’\nconsole.log(foo); // also logs ‘hello’\n```\n\
    \nAs you can see, the variable `foo` is declared outside of the scope. This means\
    \ that `foo` is a global variable and any function will be able to access it,\
    \ so when the function `talkHello` calls it, it is accessible. This shows:\n\n\
    ```javascript\nvar foo = ‘hello’;\nvar talkHello = function() {\nconsole.log(foo);\n\
    };\n\ntalkHello(); // logs ‘hello’\nconsole.log(foo); // also logs ‘hello’\n```\n\
    \nIn this example, the variable `doo` is called inside the function. This creates\
    \ a private variable that is only accessible to the function.\n\n```javascript\n\
    var talkHello = function() {\nvar doo = ‘hello’;\nconsole.log(doo);\n};\n\ntalkHello();\n\
    console.log(doo); // returns null\n```\n\n## The break Statement\n\nProgrammers\
    \ use this statement to end loop or switch statements. When using a `break` statement,\
    \ you must remember the following rules:\n\n- If your `break` statement doesn’t\
    \ have a label, it will terminate the innermost loop/switch and pass the control\
    \ flow to the next statement.\n- If your `break` statement has a label, it will\
    \ terminate the labeled statement.\n\nThe syntax of a `break` statement is:\n\n\
