  raw: 'This is the main part of the Arduino board. These are the two lines of sockets
    that line up with edges of the circuit board. The thin sockets will allow you
    to plugin some wires into them. The wires can, in turn, be connected to any types
    of electronic parts including sensors, LEDs, displays, motors etc. 


    USB Fuse


    The little USB fuse protects the computer and the Arduino. There are high chances
    that all types of wires will be connected to the Arduino, which may cause an accidental
    short on the wires. The importance of this fuse comes during this time. It is
    resettable, and in such occurrence, it will just open up in the same way a fuse
    or circuit breaker works. This will protect your board from damage. 


    Reset Button


    This button is located next to the USB jack. However, on some other boards, you
    may find it on the right side. It is the button that can be used for restarting
    the Arduino. Restarting the board will only take a second, and it is done if it
    gets stuck or if you need to re-run some program. 


    Power up Test


    We are now ready to power on our Arduino board. You can simply do this by connecting
    one end of your USB cable to the Arduino board and the other one to your computer.
    The computer will act as the source of power for the Arduino.


    If you are using Arduino UNO, then the USB cable should have its end as square
    B-type. The USB cable should be plugged directly to the computer port. After you
    are sure that you are able to power the Arduino then upload the sketches, you
    will be set. You can then plug it to the other ports. For you to know whether
    the power source is working correctly, just check on whether the ON LED is lit
    green. The L or yellow LED may also blink or light up, which the same case with
    the RX and TX LEDs. 


    Chapter 15: Troubleshooting


    Arduino Board Testing


    In the process of circuit building, there will come a time when nothing will be
    working. This moment will call for a process of troubleshooting and debugging
    in order to identify and solve the problems with your experiment.


    Key points to a successful troubleshooting:


    Understanding: Always ensure that you properly understand all the components used
    in your experiment. Clearly mark out the power flow all these components are connected
    with one another.


    Simplification and Segmentation: This is more like divide and rule tactic where
    you break down the project and figure out the problem with each and every component


    Exclusion and Certainty: This involves investing each part separately and being
    sure of their functionality. Through this you will be able ascertain the problem
    with each component.


    Board testing therefore involves “Blinking an LED”, if it does not work, check
    on the USB connection and other more options explored below.


    Breadboard Circuit Testing


    Run a short circuit test by connecting your Arduino board to the breadboard. If
    the PWR LED turns OFF then there is a serious short circuit connection on your
    board. Quickly begin segmentation and simplification to find the wrong connection.


    Problem Identification


    Some of the common problems with Arduino programming are listed below:


     Arduino IDE not launching: Use the run.bat files as alternative option.


     Windows Operating System assigning a COM port which is greater to Arduino: Solve
    this by convincing windows to assign a lower COM port. For other versions of Windows,
    follow the procedures described earlier in this book about Port Identification.


    Problem Isolation and Solving


    This option provides for you to reproduce a problem. When your circuit exhibits
