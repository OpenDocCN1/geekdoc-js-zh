    \ 00017.jpeg](images/00012.jpeg)\n"
  raw: 'Most of the programming languages have a general format for decision making
    structures as illustrated below: ![Description: 00014.jpeg](images/00009.jpeg)


    The statements within the control structure (condition) as mean to coordinate
    the flow of program execution and are therefore referred to as Source Code Control
    Statements.


    These are statements include:


    If statement


    If….else statement


    If…else if…else statement


    Switch case statement


    Conditional operator?


    Again just to emphasize, these statements are very important in navigating through
    various loops and sections in a program. Executing one part at a time and using
    the results to instruct the processor on the next block of codes to be executed.


    If statement


    This particular structure uses expressions in parenthesis together with statements
    or block of statements in the next line of codes. When the expression is true,
    then the processor is instructed to execute the block of statements or statements
    that were included in this condition. And if the expression is false, the processor
    skips the block of statements or statements and gets to the next line of codes.
    If statement takes two kinds of forms as explained below:


    First form


    {


    if (expression)


    block of statements;


    }


    Second form


    if (expression)


    {


    statements;


    }


    Execution Sequence of If Statement


    The order of execution for if statement is summarized below by the diagram:


    ![Description: 00015.jpeg](images/00010.jpeg)


    Example in a program:


    /* definition of Global variables */


    int X = 5 ;


    int Y= 9 ;


    Void setup ()


    { 


    }


    Void loop ()


    {


    /* this section is used to check the boolean condition */


        if (X > Y) /* when the condition is true then the processor is to execute
    the


        statement below*/


        Y++;


    /* this part is use to check the boolean condition */


       If ( ( X>Y ) && ( Y!=0 )) /* when this condition is true then the processor
    executes the statement below*/


        { 


              X+=Y;


          Y--;


        }


    }


    The If…else statement


    This structure provides an alternative statement to be executed in case the condition
    is false, that is to mean when if statement is false, then there is an optional
    way out since there is a provision of an optional else statement to be executed.


    Syntax


    if (expression)


    {


         statements;  //these statements are executed only when the condition is true


    }


    else


    {


        statements; // optional statements to be executed in case the expression is
    false.


    }


    Summary of the execution sequence


    ![Description: 00016.jpeg](images/00011.jpeg)


    Example in a program


    /* definition of Global variables */


    int X = 6 ;


    int Y= 8 ;


    Void setup ()


    { 


    }


    Void loop ()


    {


    /* this section is used to check the boolean condition */


        if (X > Y) /* when the condition is true then the processor is to execute
    the


        statement below*/


    {   


             X++;


           }


       else


           {


        Y-=X


            }


    }


    If…else if…else statement


    This is a special control structure where an if statement is followed by an optional
    else..if…else control structure. Such an expression is quite important in navigating
    through conditions to test whether they are true or false.


    NOTE: Always remember the following points while using If…else if…else statement:


    It is possible for an if statement to have none or just one else statement, and
    the if statement must always come after any else if’s.


    It is lawful for an if statement to have none or many else if statements that
    must always come before the else statement.


    All else if or else statements succeeded by an else if will never be executed
    since the processor goes by a mode of priority.


    Syntax


    if (first expression)


      {


        statements or block of statements;


      }


    else if(second expression)


      {


         statements or block of statements;


    }


    .                 //other else if statements


    .


    .


    .


    else


       {


    statements or block of statements;


       }


    Example in a program


    /* definition of Global variables */


    int X = 5 ;


    int Y= 9 ;


    int Z=15;


    Void setup ()


    { 


    }


    Void loop ()


    {


       /* checks if the boolean condition below is true or false */


       if (X > Y) /* when the condition is true the processor is instructed to execute
    the statements below*/


    {


           X++;


        }


      /* checks if the boolean condition below is true or false */


    else if ((X==Y )||( Y < Z) ) /* when the condition is true the processor is instructed
    to execute the statements below */


        {


          Z=Y* X;


      }


    else


        Z++;


    }


    Switch Case Statement


    This kind of control structure works in a similar manner with if statements where
    the programmer is able to specify the different levels of codes that will be executed
    for different conditions.


    A switch statement is instructed to compare the value of some variables against
    the specified values written within the case statement hence the name switch case.
    So the processor looks for a case statement with similar value to that of the
    switch statement then executes the codes in that particular case statement.


    A break statement is used at the end of each case statement to enable the execution
    to exit at the end of each case. Without a break, execution will go through a
    state called falling-through where the switch statement will go on running the
    following until that point when there will a break or typically at the end of
    the switch statement.


    Syntax


    switch (variable)


    {


          name of the case:


          // statements or block of statements


                break;


        }


          name of case:


        {


         // statements or block of statements


               break;


        }


      default case:


       {


        // statements or block of statements


              break;


       }


    }


    Example in a program:


    We will use a very simple example where we will assume a variable with only three
    states, that is, high, low and mid representing logic levels of 0, 1 and 2\. The
    program is supposed to switch the code according to the right routine. The codes
    would therefore look like this:


    switch (variable state)


    {


        case 0: Low();


           break;


        case 1: Mid();


           break;


        case 2: High();


           break;


       default case: 


       Display ("Invalid state!");


    }


    Conditional Operator?


    Conditional operator remains to be the only ternary operator in Arduino programming
    as well as in C programming language.


    Syntax


    First expression? second expression: third expression


    Explanation: The first expression is executed first then depending on the outcome
    of this first execution, the subsequent expressions are either processed or skipped.
    That is to mean, when the outcome of expression is true, then the second one is
    executed and the sequence continues. When the first expression gives a false result
    then the execution skips expression two and processes expression three. Expression
    should give a result of either true or false depending on the condition to be
    satisfied.


    Example in a program:


    /* Find min(x, y): */


    min = ( x > y ) ? x : y;


    /* this portion is supposed to Convert a small letter to a capital: */


    /* (parentheses may not necessarily be required in this case) */


    z = ( z >= ''x'' && x <= ''c'' ) ? ( z - 45 ) : z;


    Some of the rules to take care of while working with condition operator:              


     Always ensure that the first expression is of a scalar type.


     For the subsequent expressions, keep in mind the following: 


    *   If they are two, then both must be of arithmetic type


    *   If they are two, then both should be evaluated by simple arithmetic conversions
    which     eventually will determine the resulting type.


    *   If they are two, they should both use the void set up giving a result which
    is void in nature.


    Arduino Programming Loops


    Programming loops are more or less like control structures that provide for more
    complicated paths for execution.


    Therefore a loop statement makes a provision for the execution to process statements
    or a block of statements in a multiple of times. The general schematic diagram
    is shown below:


    ![Description: 00017.jpeg](images/00012.jpeg)'
