  trans: '


    JavaScript 不仅能够通过网络与当前页面服务器进行通信，而且无法接收来自任何其他域或网站的数据。虽然这是可能的，但必须通过网页上的 HTTP 头部获得明确许可，且这种许可必须由远程端授予。同样，用户安全是至关重要的。


    然而，如果 JavaScript 离开了浏览器（例如在服务器上），则没有任何限制。现代浏览器还允许你安装扩展和插件，这些插件可以拥有扩展权限。但在安装之前，应该仔细考虑，因为某些插件可能会给用户安全带来问题。


    ## 基础术语表


    - **Script（脚本）**：使用 JavaScript 语言创建的每个程序、应用程序或代码段。几行代码组成一个脚本，一个包含数千行 JavaScript
    的文件也被视为脚本。有时它被直接翻译为西班牙语的 "escribir"，尽管 script 是一个更合适且被广泛接受的词。

    - **Sentence（语句）**：构成一个脚本的每条指令。


    ## 第 2 章：为什么选择 JavaScript？


    它是 浏览器的编程语言（所有最重要的浏览器都支持它并默认启用：Firefox、Chrome、IE、Opera、Safari ...），这使其成为互联网上最流行的语言。其他其他选择，但它们需要通过插件安装和激活，或者仅在特定浏览器中运行。


    浏览器之间存在着真正的竞争，以优化它们的引擎并为 JavaScript 提供更好的支持，让你的代码运行得更快。因此，JavaScript 变得越来越稳定，性能也更好。


    它与 HTML 和 CSS 完全集成。每个在网页中都扮演着明确的角色：HTML 是创建结构的标记语言，CSS 是配置呈现的样式语言，而 JavaScript
    则提供了交互和动态行为。


    随着 HTML5 / CSS3 的到来，它将通过增强性能发挥重要作用。


    它非常强大且富有表现力，语法与其他非常流行的语言保持相似之处，但具有特殊的特性。它很容易学习。学习曲线快，投入少量时间即可开始使用。与它一起非常容易。你不需要
    Web 服务器或特殊的开发环境。它是解释型的，所以我们不需要编译代码。我们不需要获取许可。你只需要一个文本编辑器（或方便任务的代码编辑器）和一个浏览器。在此基础上，我们还可以添加诸如
    Firebug 之类的插件进行调试，我们完全配备了免费且强大的工具。


    它是我们在页面上使用 AJAX 的基础，这种编程技术如果使用得当，可以允许我们构建“新一代”网站，极大提高用户体验（我们将在下一文中介绍）。一旦我们了解了
    JavaScript 的基础，就有开放且免费的框架（工作环境/库）可用，如 JQuery、Prototype、Dojo 等……使得我们的工作变得更容易，并允许我们以极其简单的方式开发非常高级的元素。


    它允许我们在开放且标准的环境中工作，而不受制于任何软件制造商的标准。此外，它还可以与 Flash 或 Java 等其他流行技术交互。


    诚然，这些原因中的一些也曾用来批评 JavaScript，因为它太简单了，以至于人们在不知情的情况下在使用。它因用于过度加载视觉效果网页而被贴上“业余语言”的标签已经发生了根本性的变化。像
    Douglas Crockford 等人的观点有助于更好地理解它，并让高级程序员也对了解和应用它的可能性产生了巨大的兴趣。


    对于那些刚开始并对编程（Web）感兴趣的人来说，这是一门让他们轻松迈出第一步的语言。事实上，与它工作的低复杂性鼓励了它作为教授编程概念的参考语言。像任何工具一样，它有缺陷并可能被误用，但知道它的局限性在哪里是任何想要开始
    Web 编程的人应该考虑的首要学习选择之一。


    ## Python 对比 JavaScript：哪一个更适合 Web 开发？


    很难找到一个目前没有网站的人、公司或品牌。这些网站中的许多是“为了衡量”而编写的，在大多数情况下，它们的功能优于演示性和信息性功能，而那些——更不静态——的企业网站正是由此出生的。


    那么问题就出现了，尽管这些问题很容易回答，但对于我们这些以某种方式参与 IT 行业的人来说，有时可能会感到有些困扰。如何开发一个不同的网站？哪个更好？为了网站开发我应该使用哪种语言让它看起来更专业？Python
    会更适合我，还是我应该专注于学习 JavaScript？


    在开始任何比较（特别是这种比较）之前，很好指出两者都是不同语法的语言，但范式是相同的，预结论是会获得相似的结果。


    但尽管这些相似之处可以被讨论，在代码方面以及涉及到 Web 开发时，它们是完全不同的。出于这个原因，在这里我们将了解它们中的每一个，它们的优势，以及你应该选择哪一个。


    ## 什么是 Python？


    Python 是一种极简主义的编程语言，它包含一种非常简单的语法。它是一种解释型语言，也就是说不是编译的，此外这适用于所有类型的开发，特别是为了给不同程序和/或范式中的对象赋予动态。


    毫无疑问，Python 是开发网站的最佳选择之一，特别是当你了解语言的基本元素时。让我们看看 Python 为我们提供了什么。


    ## Python 特性


    在继续之前，我们将指出一些重要的 Python 特性以及你应该学习它的原因。


    ### 极简主义

    是的，代码和简单的语法非常适合开发网站，方便了工作和编写。


    ### 薪资优厚

    没错，如果你打算开发一个 Python 网站，请准备好你的银行账户，因为你从开发 Python 网站中获得的将是非常丰厚的，正如你在 Medium 上看到的那样。


    ### 多平台支持

    Python 不仅可以在一个操作系统中运行，因此你可以将其带到任何地方，从 Linux 等免费操作系统，到已知的 Windows 或 Mac，以及其他基于上述分发版系统的设备。


    ### 丰富的库支持

    Python 的一个非常好的优势是可以在开发时找到大量的库或程序包。有各种可重用代码，从游戏创建到大型网站和高质量项目。


