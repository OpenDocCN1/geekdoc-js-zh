- fmt: '

    When looking at your breadboard, you will see squares with red and black + and
    – symbols on them. Begin by placing one `10uF` capacitor here. Then you will need
    to add the `7805` voltage regulator to the breadboard. Be sure you are lining
    up the left leg of the `7805` with the power in, and the middle power up with
    the ground. Now you will need the second `10uF` capacitor. Place this on the power
    rail. Finally, if you choose, include an LED status indicator on your breadboard.
    This is a good idea for troubleshooting. Connect the right and left power rails
    with a `220` resistor.


    ## Step 2


    For the second step, you will be preparing your chip. Each pin should align with
    a specific slot on the board. This will ensure your `Arduino` functions the way
    that you need it to.


    | Number on the Board | Corresponding Pin |

    | :--- | :--- |

    | 1 | Reset |

    | 2 | Digital Pin 0 (RX) |

    | 3 | Digital Pin 1 (TX) |

    | 4 | Digital Pin 2 |

    | 5 | Digital Pin 3 |

    | 6 | Digital Pin 4 |

    | 7 | VCC |

    | 8 | GND |

    | 9 | XTAL 1 |

    | 10 | XTAL 2 |

    | 11 | Digital Pin 5 |

    | 12 | Digital Pin 6 |

    | 13 | Digital Pin 7 |

    | 14 | Digital Pin 8 |

    | 15 | Digital Pin 9 (PWM) |

    | 16 | Digital Pin 10 (PWM) |

    | 17 | Digital Pin 11 (PWM) |

    | 18 | Digital Pin 12 |

    | 19 | Digital Pin 13 (LED) |

    | 20 | AVCC |

    | 21 | AREF |

    | 22 | GND |

    | 23 | Analog Input 0 |

    | 24 | Analog Input 1 |

    | 25 | Analog Input 2 |

    | 26 | Analog Input 3 |

    | 27 | Analog Input 4 |

    | 28 | Analog Input 5 |


    ## Step 3


    Once your pins are in place, add the tact switch near pin `1`. This will reset
    your `Arduino` breadboard when necessary. Then, connect a small jumper wire between
    the bottom leg of the switch and pin `1`. The next step is to connect the `10K`
    resistor between pin row 1 and the power switch. The final thing you will need
    to do in this area is connect a `GND` wire to the top leg.


    Next, connect power and `GND` jumpers between `VCC` (pin `7`) and `GND` (pin `8`).
    The `16 MHz` clock crystal should then be added to pins `9` and `1-`. Next, add
    the `.22pF` capacitors from these pins to `GND`. You can stop here if you choose,
    and add a programming chip. If you are interested in setting the breadboard up
    for programming, however, continue reading.


    ## Step 4


    The connections you will need for programming include the pins `GND`, `NC`, `5V`,
    `TX`, `RX`, and `NC`. Connect the `GND` wire from the power rail to the `GND`
    pin. Add a power wire to the `5V` pin. Finally, connect a wire between the `TX`
    pin and the `RX` pin. Your `Arduino` breadboard is now ready to be programmed.
    You can do this by using the `USB – Serial Converter Cable` from the list of necessary
    items.


    ## How to Build a Swimming Electronic Snake


    When built correctly, this snake is waterproof and can be controlled using a remote
    controller. If this is your first attempt at an `Arduino` project, you may want
    to choose a simpler option from one of the later chapters to start with. While
    this section will be fun to read, you may want to attempt building the light-up,
    rain-sensing umbrella from Chapter 8, the biking jacket with blinking turn signals
    from Chapter 9, or the `Arduino` gas sensor from Chapter 10 first.


    ### Electronic Items


    You will need:


    * `Arduino Uno`

    * `Seeeduino Mega`

    * `10 Servo Motors` (Remember that you get what you pay for. The nylon gears in
    these motors may wear out quickly if you choose lower quality motors.)

    * `Servo Extension Wire`

    * `Servo Motor Shield`

    * `2 Xbee Series 1`

    * `Xbee Explorer`

    * `Xbee Breakout` (with 2 rows Xbee 2mm female headers and 2 rows of 10 male header
    pins)

    * `3 6V NiMh Battery packs`


    ### Mechanical Hardware


    * `Urethane Sealant`

    * `Marine Epoxy Sealant`

    * `Marine Grease`

    * `Nylon String`

    * `Green Loctite`

    * `2” x 10” of 1/8” Thick Rubber`

    * `3 Strips Each of Carbon Fiber – 1/32”, 1” x 12”`

    * `2 2.5 to 1.25” Shop Vac Vacuum Reducer`

    * `O Rings`

    * `5/16” Hose Clamp`

    * `Convoluted Hose Clamp`

    * `5/16” Tubing`

    * `5 Servo Brackets`

    * `5 Injection Molded Servo Hinge`

    * `5’ x 2.5” Urethane Dust Collection Tube`

    * `5 Lynxmotion C-Brackets`

    * `5 Lynxmotion Servo Brackets`


    ### Tools


    * `Solder Iron + Solder`

    * `Drill`

    * `3mm Drill Bit`

    * `Small Screwdriver`

    * `Needlenose Pliers`

    * `Wire Strippers`

    * `Wire Strippers`


    ## Step 1


    When looking at your breadboard, you will see squares with red and black + and
    – symbols on them. ... (text continues for brevity) ... For additional security,
    apply Loctite to the screws once you are sure they are in the correct position.
    (Remaining text truncated for flow consistency)


    ## Step 6


    To complete the body of your snake, line up the servo horns with the holes of
    the bracket. Ensure your horn is centered before screwing them together. If the
    brackets and motors do not rotate freely after being secured, apply grease between
    the brackets. For additional security, apply Loctite to the screws once you are
    sure they are in the correct position.


    ## Step 7


    In this step, you will be making the circuit board for your snake. Begin by soldering
    the male and female headers onto the `Xbee Breakout` board. Insert the `Xbee`.
    Then, take the `Servo motor shield` and solder it into the screw terminals. Once
    it has been soldered together, take your wires and connect the `Xbee` to the `Arduino`.
    Connect the `3.3Vin` pin on the `Xbee` to the `Arduino 3.3V` pin. Jump the `TX`
    pin on the `Xbee` to the `Arduino RX` pin. Connect the `Xbee` ground to the `Arduino`
    ground pin. Finally, jump the power cord between the `Arduino VIN` pin and the
    `6V` battery input.

