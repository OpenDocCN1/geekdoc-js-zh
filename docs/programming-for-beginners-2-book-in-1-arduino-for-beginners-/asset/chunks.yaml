- fmt: "\nYou can use the same command to set up digital pins. First of all reference\
    \ the digital pin for `pinNumber` instead of analog. It is also important to note\
    \ that digital pins by default used as input pins so it is only required of you\
    \ to set them to `OUTPUT` mode. To achieve this, use the command: `digitalRead\
    \ (pin label)` where the digital component will be connected to the `pin label`.\
    \ `digitalRead (pin number)` returns either `HIGH` or `LOW` as results. \n\nWhen\
    \ you want to send a digital signal to a digital pin from the IDE platform, you\
    \ are supposed to use the code: `digitalWrite(pin label, value)` where `pin label`\
    \ stands for the pin number from which the signal is coming from and the `value`\
    \ can either be `HIGH` or `LOW`.\n\nArduino also uses the technique of Pulse Width\
    \ Modulation to send Digital signal that is in the form of analog. The pin numbers\
    \ responsible for this are: `3`, `5`, `6`, `9`, `10` and `11`. And the command\
    \ used here looks like this: `analogWrite(pin label, value)`. The pin numbers\
    \ are already provided up there and the `value` is an integer ranging from `0`\
    \ (0%) and `100%` (255).\n\n### Examples of digital signals\n\nON/OFF, Men’s table/Women’s\
    \ table, pregnancy, death, consciousness and the list continues.\n\nSensors and\
    \ interfaces used here may include: Relays, Circuit breakers, Switches, Buttons\
    \ and many others.\n\n## Chapter 7: Basic digital Arduino programs\n\n### LED\
    \ Blink\n\nThis is the most basic program in Arduino programming just like printing\
    \ the word “hello world” in any other programming language. Since in Arduino programming\
    \ there is no screen to print “hello world”, we therefore blink an LED as our\
    \ first test program. This is indeed a very simple program that is meant to give\
    \ you a strong foundation as you invest into the world of circuit building through\
    \ prototyping.\n\n#### The Required Components\n* One breadboard\n* An Arduino\
    \ Uno\n* One LED\n* Resistor (330 ohms)\n* Two jumper wires\n\n#### Circuit\n\
    The circuit is quite simple due to the small number of components, therefore just\
    \ follow the simple circuit diagram below:\n\n![Description: 00024.jpeg](images/00002.jpeg)\n\
    \n#### Finding the polarity of the LED\nAn LED has polarity, that is, negative\
    \ and positive terminals. To determine this, hold the LED with the flat side facing\
    \ you. The shorter leg on your left side is the negative terminal while the longer\
    \ leg on your right is the positive terminal.\n\n![Description: 00025.jpeg](images/00003.jpeg)\n\
    \n#### Sketch\nQuickly open the Arduino IDE on your computer, then a new sketch\
    \ file on the New tab then begin writing your codes as shown below:\n\n```\n*/\
    \ Blink an LED, the codes below are meant to turn a Light Emitting Diode connected\
    \ to a digital pin periodically. Pin number 13 is used since it has a resistor\
    \ in its circuit to limit current through the LED */\n\nint ledPin = 13; // LED\
    \ has been connected to digital pin number 13\n\nvoid setup()\n{\n  ledPin(pinMode,\
    \ OUTPUT); // the digital pin is set as the output\n}\n\nvoid loop()\n{\n  digitalWrite(pinMode,\
    \ HIGH); // the code is used to set LED ON\n  delay(1000); // delay time is a\
    \ second\n  digitalWrite(ledPin, LOW); // the code is used to set LED OFF\n  delay(1000);\
    \ // delay time is a second\n}\n```\n\n### LED Blink without Delay\n\nSometimes\
    \ you may wish to let the LED light without stopping and this calls for the use\
    \ of another function other than `delay()`. The function for LED blinking without\
    \ delay keep track of the time when the LED was turned ON and OFF. The using a\
    \ loop `()`, it checks if sufficient time interval has passed so as to turn the\
    \ LED ON if it was OFF and vice versa. The other components are the same as for\
    \ the example above.\n\nHere are the codes:\n\n```\nint ledPin = 13; // an LED\
    \ has been connected to a digital pin number 13\nint num = LOW; // int num has\
    \ been declared and assigned LOW representing LED //previous value \nlong previousMillis\
    \ = 0; // stores the value for when the LED was last updated\nlong delay = 1000;\
    \ // delay time is set to one second (milliseconds)\n\nvoid setup()\n{\n  pinMode(ledPin,\
    \ OUTPUT); // the digital pin is set to be the OUTPUT\n}\n\nvoid loop()\n{\n \
    \ // the codes are the ones to control the lighting of the LED.\n  if (millis()\
    \ - previousMillis > delay) \n  {\n    previousMillis = millis(); // recalls the\
    \ previous time the LED blinked\n    // the codes below turns the LED ON in case\
    \ it was OFF and vice-versa.\n    if (num == LOW)\n      num = HIGH;\n    else\n\
    \      num = LOW;\n    digitalWrite(ledPin, num);\n  }\n}\n```\n\n### Fading an\
    \ LED\n\nFor this case we will be using the `analogWrite()` function to initiate\
    \ the fading process an LED connected to the Arduino board. This is possible because\
    \ `analogWrite()` function uses Pulse Width Modulation technique which is able\
    \ to turn on and off a digital pin quickly in different ratios thereby creating\
    \ the fading effect. The components are still the same with the first example\
    \ including the circuit. The only difference is noticed in the codes as shown\
    \ below:\n\n```\n/*\nFade \nThis example illustrates the use of the function analogWrite\
    \ () to control the fading of an LED*/\nint ledPin = 6;     // LED is connected\
    \ to digital pin 6\nint brightness = 0; // current brightness\nint fadeStep =\
    \ 5;   // amount to change brightness\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT);\n\
    }\n\nvoid loop()\n{\n  analogWrite(ledPin, brightness);\n  brightness = brightness\
    \ + fadeStep;\n  if (brightness <= 0 || brightness >= 255) {\n    fadeStep = -fadeStep;\n\
    \  }\n}\n```\n*(Note: The provided source text for fading was fragmented in the\
    \ input; I have cleaned the structure to maintain logical flow while preserving\
    \ your variables).*\n\n### Arduino Button\nThis is typically a button that connects\
    \ two points. When pressed, the button completes the circuit.\n\n#### Components\n\
    * A pushbutton\n* One Arduino Uno\n* One Emitting Diode\n* Three connecting wires\n\
    * 2.2 kilo ohms\n\n#### Procedure\nYour circuit should look like the below:\n\n\
    ![Description: 00026.jpeg](images/00004.jpeg)\n\nThe codes for this project are\
    \ written below:\n\n```\nint outPin = 14; // the LED has been connected to pin\
    \ 14\nint inPin = 3; // our input pin for a pushbutton\nint num = 0; // variable\
    \ declaration; used to read pin status\n\nvoid setup()\n{\n  pinMode(outPin, OUTPUT);\
