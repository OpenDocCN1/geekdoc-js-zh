    How to Build a Swimming Electronic Snake


    When built correctly, this snake is waterproof and can be controlled using a remote
    controller. If this is your first attempt at an Arduino project, you may want
    to choose a simpler option from one of the later chapters to start with. While
    this section will be fun to read, you may want to attempt building the light-up,
    rain-sensing umbrella from Chapter 8, the biking jacket with blinking turn signals
    from Chapter 9, or the Arduino gas sensor from Chapter 10 first.


    Electronic Items


    You will need:


    *   Arduino Uno


    *   Seeeduino Mega


    *   10 Servo Motors (Remember that you get what you pay for. The nylon gears in
    these motors may wear out quickly if you choose lower quality motors.)


    *   Servo Extension Wire


    *   Servo Motor Shield


    *   2 Xbee Series 1


    *   Xbee Explorer


    *   Xbee Breakout (with 2 rows Xbee 2mm female headers and 2 rows of 10 male header
    pins)


    *   3 6V NiMh Battery packs


    Mechanical Hardware


    *   Urethane Sealant


    *   Marine Epoxy Sealant


    *   Marine Grease


    *   Nylon String


    *   Green Loctite


    *   2” x 10” of 1/8” Thick Rubber


    *   3 Strips Each of Carbon Fiber – 1/32”, 1” x 12”


    *   2 2.5 to 1.25” Shop Vac Vacuum Reducer


    *   O Rings


    *   5/16” Hose Clamp


    *   Convoluted Hose Clamp


    *   5/16” Tubing


    *   5 Servo Brackets


    *   5 Injection Molded Servo Hinge


    *   5’ x 2.5” Urethane Dust Collection Tube


    *   5 Lynxmotion C-Brackets


    *   5 Lynxmotion Servo Brackets


    Tools


    *   Solder Iron + Solder


    *   Drill


    *   3mm Drill Bit


    *   Small Screwdriver


    *   Needlenose Pliers


    *   Wire Strippers


    *   Wires


    *   Angle Snips


    *   Hack saw


    *   2-56 nuts, bolts, and screws, either lock or toothed


    *   4-40 nuts, bolts, and screws, either lock or toothed


    Step 1


    Once you have gathered all of the various tools, electronic items, and hardware,
    it is time to begin your project. You will start by waterproofing the 10 Servo
    motors. Begin by applying the silicon marine sealant around the plastic seams
    of the motor. You should also apply it to the bottom of the motor (where the screws
    are located) and around the wire insertion area. You should let this dry for a
    minimum of 24 hours. 


    Next, unscrew the round plastic that makes up the top of the motor. Slip an O-ring
    around the shaft after using a thin layer of marine grease on it. Then, replace
    the plastic top. This is also known as the servo horn. 


    Step 2


    For this step, you will be preparing the carbon fiber for use. Cut the 12” x 1”
    strips into 3 separate pieces. This will result in 4” strips. If you have a dremel
    handy, you can round the corners so they are not jagged from cutting. Then, place
    the servo brackets 3 inches apart on the strips. Make markings where the bracket
    holes line up. Take a 3mm drill bit and drill into the carbon fiber, making holes
    where the markings are. You will need to do this with 7 of your 4” strips of carbon
    fiber.


    Step 3


    In this step, you will be building the frame of your robotic snake. Begin by using
    the screws that come with the brackets to attach the carbon fiber. Be sure you
    use the bolt that came with the bracket as well. Then, take the rubber and line
    it up with the middle section of the c-bracket. Use these as your guideline to
    cut 5 pieces of rubber that are approximately 1” x 2.” Draw a dot where the holes
    of the bracket align with the rubber. Then, poke a hole through the rubber so
    you can more easily insert the 2-56 screws. These should go through the black
    clamp, through the rubber, and through the red bracket.


    Step 4


    In this step, you will be mounting the Servos motors. Your Servos should come
    with several parts. Begin with the rectangular cube and insert it into the four
    holes of the motor. The flat side should face outward. Adhere the injection molded
    joint on five of the motors and place them in the bracket. Use the 4x40 screws
    and a lock nut to screw the servo into the black servo bracket.


    Step 5


    In this step, you will be mounting the servos bracket to the c-bracket pairs.
    For the red brackets, the c-bracket should be put into place underneath of the
    servo bracket, but above the servo horn. A screw and bearing should be used to
    secure it. For the black brackets, the c-bracket should be slipped over the motor.
    This will cover most of its body. Once you secure these, you should have s snake-like
    structure that makes up the body of your robotic snake. 


    Step 6


    To complete the body of your snake, line up the servo horns with the holes of
    the bracket. Ensure your horn is centered before screwing them together. If the
    brackets and motors do not rotate freely after being secured, apply grease between
    the brackets. For additional security, apply Loctite to the screws once you are
    sure they are in the correct position.


    Step 7


    In this step, you will be making the circuit board for your snake. Begin by soldering
    the male and female headers onto the Xbee Breakout board. Insert the Xbee. Then,
    take the Servo motor shield and solder it into the screw terminals. Once it has
    been soldered together, take your wires and connect the Xbee to the Arduino. Connect
    the 3.3Vin pin on the Xbee to the Arduino 3.3V pin. Jump the TX pin on the Xbee
    to the Arduino RX pin. Connect the Xbee ground to the Arduino ground pin. Finally,
    jump the power cord between the Arduino VIN pin and the 6V battery input.'
