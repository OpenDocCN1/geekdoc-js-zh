    ```javascript

    var x2 = 56; // 不带小数位

    ```


    要编写非常大或非常小的数字，你必须使用指数法或科学计数法：


    ```javascript

    var y = 234e5; // 23400000

    var z = 234e-5; // 0.00234

    ```


    ## JavaScript 布尔值 (Booleans)


    布尔只有两个值——真（True）或假（False）。


    ```javascript

    var x = true;

    var y = false;

    ```


    ## 数组 (Arrays)


    在 JavaScript 中，数组包含在方括号 `[]` 中，每个项目之间用逗号隔开。看下一个示例，它声明了一个名为 cars 的数组，其中包含三个项目，即汽车的名字：


    ```javascript

    var cars = ["Volvo", "Ford", "Mercedes"];

    ```


    数组中的索引是所谓的“零基础索引”，这意味着第一个项目从 0 开始，第二个是 1，以此此类推。因此，如果一个数组有 10 个项目，你的索引范围将从 0 到
    9。


    ## 对象 (Objects)


    对象包含在花括号 `{}` 中，对象的属性以“名称:值”对的形式编写，每对之间用逗号隔开：


    ```javascript

    var person = {firstName:"Jane", lastName:"Deer", age:45, eyeColor:"green"};

    ```


    示例中的对象是一个具有四个属性的人：


    * `firstName`

    * `lastName`

    * `age`

    * `eyeColor`


    ## typeof 运算符


    `typeof` 运算符用于查找变量类型。看这些示例：


    ```javascript

    typeof ""              // 返回 "string"

    typeof "Jane"           // 返回 "string"

    typeof "Jane Deer"      // 返回 "string"

    typeof 1               // 返回 "number"

    typeof 253             // 返回 "number"

    typeof 2.53            // 返回 "number"

    typeof (1)             // 返回 "number"

    typeof (5 + 8)         // 返回 "number"

    ```


    ## 原始数据 (Primitive Data)


    原始数据值是简单的单值，没有额外的属性或方法。`typeof` 运算符可以返回以下原始类型：


    * `boolean`

    * `null`

    * `number`

    * `string`

    * `undefined`


    例如：


    ```javascript

    typeof "Jane"          // 返回 "string"

    typeof 2.53            // 返回 "number"

    typeof true            // 返回 "boolean"

    typeof false           // 返回 "boolean"

    ```


    ## 复杂数据 (Complex Data)


    它还可以返回以下复杂数据类型之一：


    * `function`

    * `object`


    例如：


    ```javascript

    typeof [3, 4, 5, 6]         // 返回 "object" 而不是数组 – 下文

    typeof {name:jane, age:45}  // 返回 "object"

    typeof function myFunc(){}     // 返回 "function"

    ```


    `typeof` 运算符返回“object”，是因为数组在 JavaScript 中也是对象。


    ## undefined


    正如我们之前所说，没有值的变量会被赋予 `undefined` 值。`typeof` 运算符本身也是 `undefined` 的：


    你可以通过将变量设置为 `undefined` 值来清空其已赋值的值；其类型也是 `undefined`：


    ```javascript

    person = undefined; // 值是 undefined，类型也是 undefined

    ```


    ## 空值 (Empty Values)


    空值不与 `undefined` 值混淆。空字符串变量既有值也有类型，例如：


    ```javascript

    var car = ""; // 值是 ""，typeof 是 "string"

    ```


    ## null


    可以通过将对象设置为 `null` 来清空对象，如下所示：


    ```javascript

    var person = null; // 值是 null，但类型仍然是 object

    ```


    你也可以通过将对象设置为 `undefined` 来清空对象：


    ```javascript

    var person = undefined; // 值是 undefined，类型是 undefined

    ```


    ## 运算符 (Operators)


    JavaScript 中的基本运算符是由符号和标记创建的。我们已经熟悉了一些运算符，例如用于给变量赋值的 `=` 运算符。


    ```javascript

    var a = 8;

    var b = 9;

    ```


    上述两行的含义是声明了 `a` 和 `b`，并为它们分配了值。在这种情况下，`a` 的值是 8，`b` 的值是 9。


    同样，JavaScript 在其脚本内部内置了许多其他基本运算符。让我们这些运算符：


    * `+`（加法运算符）

    * `*`（乘法运算符）

    * `/`（除法运算符）

    * `-`（减法运算符）


    这些运算符每一个的工作方式都与计算器中一样。


    ```javascript

    var a = 10;

    var b = 5;

    a/b   // 这是一个简单的除法，将 10 除以 5 得到 2

    a + b // 此操作执行加法，10 + 5 得到 15

    a - b // 此操作执行减法，10-5 得到 5

    a * b // 这是一个基础乘法，10 * 5 = 50

    ```


    ## 不同类型的赋值运算符


    除了基本运算符，这里还有一些：不同类型的赋值运算符（用法：给变量赋值）。图中的示例都是数字，但运算符不仅用于数字。拼接允许你使用 `+` 运算符或 `+=`
    赋值运算符将两个字符串组合并转换为一个字符串。


    ```javascript

    var Spray = "Hello ";

    var Body = "World";

    console.log(Spray + Body); // 输出将是 "Hello World"

    ```


    ```javascript

    var a = "I am ";

    var b += "Legend"; // 将是: "I am Legend"

    ```


    此外，你也可以将字符串和数字相加：


    ```javascript

    X="3"+1 // (结果将是 31，而不是 4)

    X="Jessica"+1 // (结果将是 Jessica1)

    ```


    与其他编程语言不同，处理字符串的运算符与处理数字的运算符的行为差异很大。深入理解两者之间的差异对于确保它们都能被正确使用至关重要。例如，在使用这两种类型的运算符时，你会发现其中一个主要区别出现在加法运算符的使用上。


    考虑我们正在尝试将一个数字和一个字符串相加。


    **示例 1。**

    ```javascript

    var Bar = 5;

    var Legal = "6";

    console.log (Bar + Legal) // 这里的输出将是 56。

    ```


    如果你想让字符串作为数字处理，可以使用 `Number` 关键字。


    **示例 2。**

    ```javascript

    X=Number("6") // 结果是 7。

    ```


    **示例 3。**

    ```javascript

    var Bar = 5;

    var Legal = "6";

    console.log (Bar + Legal)) // 此语句的输出是 56。

    ```


    如果你想将数字转换为字符串，可以使用 `String()` 方法。


    **示例 4。**

    ```javascript

    String(3.14) // 将 3.14 转换为字符串。

    ```


    你可能会问为什么你会想要将数字转换为字符串。由于计算机处理数字的方式是将其转换为二进制，在仅使用数字类型时可能会丢失精度。在这种情况下，将值转换为字符串可以确保你不会丢失任何精度。


    你也可以将布尔值转换为数字或字符串。


    ```javascript

    Number(TRUE) // 返回值 1

    Number(FALSE) // 返回值 0

    String(TRUE) // 返回字符串 "true"

    String(FALSE) // 返回字符串 "false"

    ```


    在示例 `1 + 2` 等于 3 中，数字 1 和 2 是操作数，而 `+` 是运算符。JavaScript 支持以下类型的运算符：


    * 算术运算符

    * 逻辑运算符

    * 赋值运算符

    * 条件运算符


    让我们讨论每种运算符。


    ### 算术运算符


    | 运算符 |  | 示例 A=5, B=10 |

    | :--- | :--- | :--- |

    | `+` | 加法（适用于数字和字符串） | `X = A + B: X=15`, `Y = "z" + B: Y = z10` |

    | `-` | 减法 | `X = A – B: X = -5` |

    | `*` | 乘法 | `X = A * B: X = 50` |

    | `/` | 除法 | `X = B/A: X =2` |

    | `%` | 取模（输出整数除法的余数） | `X = B % A: X = 0` |

    | `++` | 增一 1 | `X=A++: X = 6` |

    | `--` | 减一 1 | `X=A--: X = 4` |


