    \ the void set up giving a result which is void in nature.\n\n### Arduino Programming\
    \ Loops\n\nProgramming loops are more or less like control structures that provide\
    \ for more complicated paths for execution.\n\nTherefore a loop statement makes\
    \ a provision for the execution to process statements or a block of statements\
