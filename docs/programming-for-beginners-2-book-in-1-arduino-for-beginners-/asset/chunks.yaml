    接下来，根据你正在使用的舵服电机数量，焊接数字输出引脚的电线。你应该从你的 `Arduino` 提取 `dOUT` 电线，然后将其插入舵服电缆。将电线拧入螺丝端子中。这将连接电池的
    `6V` 和地线。


    ### 第 8 步

    接下来，你需要代码让你的机械蛇游起来。你可以在 `Servo` Arduino 库的软件库中找到它。你需要一段代码来通过振动产生波浪运动。这将创建一个沿着舵服电机向上传传导的正弦波。


    ### 第 9 步

    在这一步中，你将为机械蛇创建一个独立的立式摇杆控制器。首先将 `Xbee` 插入 `Xbee` 扩展板。将它们放置在 `Arduino` 上方并设置 6 个按钮输入。这些按钮应连接到
    `Arduino` 上的数字引脚 `2-7`。现在你将从 `Arduino` 库上传一段代码，以获取按钮输入并输出为机械蛇的动作。


    ### 第 10 步

    这一步是将所有的电线连接到机械蛇上。使用舵服电机的延长线，并将电线延伸到机械蛇身体下方。它们应该结束在最后一个支架后几英寸处。如果你愿意，可以将电线胶粘在碳纤维上，这样更容易安装碳纤维了。


    ### 第 11 步

    在这一步中，你将使用 `6V/GND` 电线连接电池，以便你的机械蛇能够运行。使用两个扎带将一个电池固定在每段碳纤维上。你还应该取下 `Servo` 电机的延长线，使电池电能到达机械蛇前端的地线和
    `Arduino`。


    ### 第 12 步

    这一步是添加开关按钮。你可能想用其中一个用于 `Arduino/Servos` 的连接，另一个用于水泵。请务必在启动水泵之前打开机械蛇，因为在没有水的情况下运行水泵会导致其干涸并烧毁。然后，切两段直径为
    `1.75”` 的橡胶块。它们应该能放入真空减速器内部。你还应该剪两段 `2’` 长的绳子，以帮助将机械蛇身体定位在真空减速器内。在将橡胶放入真空减速器之前，你需要为电线切一个小狭缝。你还会在这里系上绳子。你将拥有水泵的电源和地线、开关的电源和地线，以及一根贯穿两块橡胶垫和真空减速器的绳子。在尾部，你只需要外部的绳子来固定机械蛇。接下来，取螺丝端子上的
    `6V` 电线并将开关焊接在上面。


    ### 第 13 步

    在这一步中，你将拉长蛇身并准备电池，以便水泵能够正常工作。在蛇的头部和尾部连接长度为 `4”` 的碳纤维片。将电池接线柱和水泵焊接在一起。接下来，找到电池和水泵之间的延长电线。这就是你需要焊接开关来开启和关闭机械蛇的地方。使用扎带将电池固定在
    `Arduino` 旁边的碳纤维上。


    ### 第 14 步

    在这一步中，你将密封机械蛇的身体并穿上皮肤。在真空减速器的两端使用填缝胶完全覆盖电线。在完成项目之前，至少等待 24 小时让填缝胶干燥。如果你选择，可以使用热熔胶固定电线，并使用硅胶包吸收水分。你还应该借此机会确保关节活动灵活。如有必要添加额外的润滑脂。现在，将皮肤套在机械蛇身体上。如有必要，剪断管子长度，使碳纤维在用绳子定位时能放入管子末端。完成后将绳子打一个结以防滑脱。最后，你需要使用防水油脂在机械蛇的头部和尾部加上盖子，以防止水进入。


    ### 第 15 步

    现在机械蛇已完全组装，你准备好安装水泵了。安装后，水泵应位于机械蛇头部附近，但在底部。它在运行期间将浸没在水中。切一段 `5/16”` 的塑料软管套在水泵的输出喷嘴上。然后在管子连接处固定一个软管箍。使用这段塑料管来安装水泵。你可以用扎带将其固定。如果你感兴趣，甚至可以在机械蛇上安装一个
    GoPro。


    ### 第 16 步

    现在你已经准备好测试你的机械水蛇了！在带它去室外之前，确保在塑料按钮周围涂上润滑脂。打开机械蛇并将其放入水中。一旦将机械蛇放入水中，你就可以开启水泵而不用担心干烧它。使用你的遥控器引导机械蛇的运动。


    # 第 6 章：开始使用 Arduino


    设置 Arduino 微控制器的第一步将选择你想要工作的 `Arduino` 板卡。


    ## 选择板卡

    在查看 `Arduino` 板卡的选项时，在做出选择之前你需要考虑几个因素。在决定板卡之前，问自己以下问题：


    ### 运行我脑海中的应用需要多少功率？

    你可能不知道项目所需的闪存内存和处理能力的确切测量，但一个变换颜色的简单夜灯与具有许多活动部件的机械手之间存在明显的区别。后者需要一个更健壮的 `Arduino`
    微控制器板，比简单的夜灯想法具有更快的处理速度、更多的闪存和更多的 SRAM。


    ### 实现所需的功能需要多少数字引脚和模拟引脚？

    同样，你不需要有一个非常具体的想法，但知道需要更多还是更少的引脚将对你选择哪种板卡产生巨大影响。如果你想做一个简单的第一个项目，较少的数字、`PWM` 和模拟引脚也可以；如果你想做一些更复杂的东西，你将想要考虑具有大量引脚的板卡。


    ### 我想要它成为可穿戴设备吗？

    可穿戴设备有几种选择，所以这个问题不会完全为你做决定。然而，它将有助于缩小范围并引导你的方向，`Lilypads` 和 `Gemma` 或其他类似的技术是你的最佳选择。


    ### 我想连接到物联网吗？如果是，如何连接？

    如果你想连接到物联网，`YÚN`、`Tian`、`Ethernet`、`Leonardo ETH` 或 `Industrial 101` 将使你的工作变得简单得多。它们具有以太网连接以及
    Wi-Fi 功能，因此你将能够连接到网络并共享数据或交互与控制物联网上的其他设备。


    ## 开始使用 Arduino IDE

    Arduino 软件运行在名为 `IDE` 的环境中。这意味着你要么需要下载桌面 `IDE` 进行编写，要么在在线 `IDE` 上编写。你访问 `IDE`
    的第一方式（下载桌面应用程序）有几种适用于你可能使用的各种设备。


    首先是 `Windows` 桌面应用程序。你也可以通过 `Windows` 平板电脑或 `Windows` 手机访问它。接下来是 `Macintosh OSX`
    版本，它允许 `IDE` 在 Apple 笔记本电脑和桌面机上运行，但不支持 Apple 移动设备如 iPhone 和 iPad。最后，在 `Linux`
    上运行 Arduino `IDE` 有三种选择：`32-bit`、`64-bit` 和 `Linux ARM` 版本。


    如果你喜欢这种方案而不是浏览器方案，只需访问 `Arduino IDE` 网站：

    `https://www.arduino.cc/en/Main/Software`

    在那里你可以下载相应的桌面 `IDE`。接下来，运行安装程序，点击呈现的选项，几分钟后你就拥有了一个运行中的 `Arduino IDE` 环境了。

