  trans: "\n其中 `derived_class_name` 是推导类的名称，`base_class_name` 是其所基于的类名称。公共修饰符 `public`\
    \ 可以被任何备用访问修饰符 `protected` 和 `private` 替换。该访问修饰符描述了从基类继承部分的基访问级别。\n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nclass myPol {\nprotected:\n   \
    \ double x, y;\n\npublic:\n    void setValues (double a, double b)\n    {\n  \
    \      x = a; y = b;\n    }\n};\n\nclass myRect: public myPol {\npublic:\n   \
    \ double myArea ()\n    {\n        return (x * y);\n    }\n};\n\nclass myTri:\
    \ public myPol {\npublic:\n    int myArea ()\n    {\n        return (x * y/ 2);\n\
    \    }\n};\n\nint main () {\n    myRect rect;\n    myTri trgl;\n    rect.setValues\
    \ (4,5);\n    trgl.setValues (4,5);\n    cout << rect.myArea() << endl;\n    cout\
    \ << trgl.myArea() << endl;\n    return 0;\n}\n```\n\n`myRectangle` 和 `myTriangle`\
    \ 类的对象分别包含继承自 `myPolygon` 的成员。这些成员是：`x`、`y` 和 `setValues()`。\n\n`protected` 访问修饰符类似于\
    \ `private`。它的区别实际上发生在继承中。当一个类继承自另一个类时，被继承类的部分可以访问从基类继承的 `protected` 成员，但不能访问其\
    \ `private` 成员。\n\n由于我们需要让推导类 `myRectangle` 和 `myTriangle` 的部分使 `x` 和 `y` 是公开的，而不仅仅是\
    \ `myPolygon` 的部分，因此我们使用了 `protected` 而不是 `private`。\n\n## 从基类继承了什么\n\n在基础层上，继承类继承基类的每个成员，但外外：\n\
    ● 构造函数\n● 析构函数\n● `Operator=()` 成员\n● 友元\n\n尽管基类的析构函数和构造函数本身不会被继承，但在创建或销毁派生类的另一个对象时，析构函数和默认构造函数会被不断调用。如果基类没有默认构造函数，或者你需要在创建另一个派生对象时调用某个重载构造函数，你可以在确定类的每个构造函数定义中详细说明它：\n\
    \n```cpp\n<derived constructor name> (<parameters>) : <base constructor name>\
    \ (<parameters>) {\n    //Code\n}\n```\n\n## 多重继承\n\nC++ 中规定一个类可以继承自多个类。这可以通过在类声明中使用逗号分隔基类来实现。例如，如果我们有一个特定的类用于在屏幕上打印内容（`myOutput`），并且我们需要我们的类\
    \ `myRectangle` 和 `myTriangle` 同样继承它的成员，尽管它们已经继承了 `myPolygon），我们可以相应地进行组合。\n\n\
    ## 实现多态\n\n在进入本节之前，建议你对指针和类继承有深入理解。如果接下来的解释中有任何部分对你来说很奇怪，你应该检查显示的代码段：\n\n### 指向基类的指针\n\
    继承类的关键特性之一是，指向推导类的指针与其基类的指针是兼容的。多态是利用这种简单但强大且灵活的特性的技巧，它将面向对象的方法发挥到了极致。\n\n###\
    \ 虚成员\n在推导类中可以被重新类的类部分被称为虚成员。为了将类的某个部分声明为虚的特定目标，我们必须在该语句之前放置关键字 `virtual`。\n\n\
    `virtual` 关键字的作用是允许派生类中与基类中同名的部分通过指针被正确调用，特别是当指针的类型是指向基类的指针但它指向推导类的对象时，更是如此。\n\
    \n### 抽象基类\n抽象基类和普通多态类之间的根本区别在于，由于抽象基类中至少有一个部分需要实现，我们无法为它创建实例（对象）。尽管如此，不能实例化对象的类并不是完全没用的。我们可以创建它的指针并利用它所有的多态能力。\n\
    \n虚成员和动态类为 C++ 提供了多态特性，使得面向对象的编程在大型活动中成为非常有用的工具。显然，我们已经看到了这些特性的简单应用，但这些特性可以应用于对象模型或动态分配的对象。\n\
    \n## 自定义构造函数\n\n正如你可能注意到的，每次为相似的对象创建并分配属性是非常麻烦的。由于 `smartPhone1` 和 `smartPhone2`\
    \ 都被归类为手机，因此它们注定具有相似的方法和属性。考虑到这一点，我们可以执行如下操作来我们的代码更整洁：\n\n```javascript\nfunction\
    \ Phone(screenSize, pixelDensity, processorNumber, processorSpeed, simCardNumber){\n\
    \    this.screenSize = screenSize;\n    this.pixelDensity = pixelDensity;\n  \
    \  this.processorNumber = processorNumber;\n    this.processorSpeed = processorSpeed;\n\
    \    this.simCardNumber = simCardNumber;\n    this.textNumber = function(number,\
    \ text) {\n        console.log(\"'\" + text + \"' sent to \" + number);\n    \
    \    console.log(\"Processing time: \" + text.length/this.processorNumber);\n\
    \    };\n    this.setSimCardNumber = function(newSimCardNumber) {\n        this.simCardNumber\
    \ = newSimCardNumber;\n    };\n}\n\n// 使用用法\nvar smartPhone1 = new Phone(1080,\
    \ 400, 4, 2.5, \"123456\");\nvar smartPhone2 = new Phone(720, 300, 2, 2.0, \"\
    654321\");\n```\n\n## 使用对象字面量\n\n对象字面量方法使用 `var` 关键字，类似于定义变量。\n\n```javascript\n\
    var dog = {\n    name: \"Abby\",\n    eyeColor: \"brown\",\n    age: 7\n};\n```\n\
    \n此外，类似于定义变量，你可以先定义对象稍后添加属性。\n\n```javascript\nvar dog = {};\ndog.name = \"Abby\"\
    ;\ndog.eyeColor = \"brown\";\ndog.age = 7;\n```\n\n## 节点树\n\n所有的 HTML 元素和属性都是文档对象模型\
    \ (DOM) 中的节点。看以下 HTML 代码作为起点：\n\n```html\n<html>\n<head>\n    <title>The title</title>\n\
    </head>\n<body>\n    The body\n</body>\n</html>\n```\n\n## 数组\n\n### 什么是数组？\n\
    一个参数可以拥有值的列表。例如，变量 `color`。这些值是红色、蓝色和黄色。与其为每个值定义变量（例如 `color1=red, color2=blue,\
    \ color3=yellow`），我们使用数组来简化在变量中存储多个值或值列表的方式。\n\n数组内部还可以包含数组。这被称为多维数组。\n\n### 创建数组\n\
    \n#### 一维数组\n让我们看看如何在代码中使用数组。创建数组的方式与创建普通变量的方式相似。\n\n语法：\n创建数组有两种方法：\n\n```javascript\n\
    var colors = new Array (\"red\", \"blue\", \"yellow\");\n```\n\n或者你可以直接这样定义：\n\
    \n```javascript\nvar colors = [\"red\", \"blue\", \"yellow\"];\n```\n\n要分配和访问数组内部的值，我们通过元素和索引数字来引用它们。下方示例中的数字\
    \ [0-2] 是索引。红色、蓝色和黄色是对应的数组元素。\n\n```javascript\ncolors[0] = red\ncolors[1] = blue\n\
    colors[2] = yellow\n```\n\n你也可以先定义数组名称稍后添加值：\n\n```javascript\nvar colors = [];\n\
    colors[0] = \"red\";\ncolors[1] = \"blue\";\ncolors[2] = \"yellow\";\ncolors[55]\
    \ = \"green\";\n```\n"
- fmt: "\nNote that in the above example, we have added the array element `green`\
    \ to array index `55`. Defining array indices sequentially is not required. However,\
    \ this will automatically create blank elements from all the indices from `3`\
    \ to `54`. When you check on the array length, this will return `56` even if you\
    \ only have `4` elements defined.\n\nWhile you may create a long list of color\
    \ names for your array, keep in mind that the maximum number of values an array\
    \ can store is up to `4,294,967,295` elements.\n\n## Multidimensional Array\n\n\
    An array can contain an array containing an array. This can go on to several levels\
    \ depending on how you want to group your data.\n\nContinuing with our `color`\
    \ variable, follow the example below. Suppose that we want to store primary colors\
    \ and secondary colors in this array.\n\n### Syntax\n\nTo define multidimensional\
    \ arrays, we use additional brackets to denote array and index number. Think of\
    \ multidimensional arrays as outlines.\n\n```\nvar color = [[\"red\",\"blue\"\
    ,\"yellow\"],[\"green\",\"purple\",\"orange\"]]\n```\n\n## Using Arrays within\
    \ the code\n\n### Retrieving array values\n\nUse the code below to retrieve values\
    \ from the sample above:\n\n```javascript\ncolor[0][0]; //red\ncolor[1][1]; //purple\n\
    color[0]; //[\"red\", \"blue\", \"yellow\"]\n```\n\nNote in the last command that\
    \ when you do not specify the specific index number when retrieving values for\
    \ a multidimensional array, all of the array elements will be returned.\n\n##\
    \ Array Properties\n\nThe array object comes with different properties.\n\n| Property\
    \ | Description |\n| :--- | :--- |\n| `prototype` | Allows you to add properties\
    \ and methods to an `Array` object |\n| `constructor` | Ouputs a reference to\
    \ the function that created the `Array` object |\n| `index` | Zero-based index\
    \ of the match in the string |\n| `input` | Present only in arrays created by\
    \ regular expression matches |\n| `length` | Ouputs or sets the number of elements\
    \ in an array |\n\nHere we demonstrate the different properties. Use the codes\
    \ below to demonstrate the array properties.\n\n### Constructor\n\n#### Syntax\n\
    ```javascript\narray.constructor\n```\n\n#### Output\n```\nsamplearr.constructor\
    \ is:function Array() { [native code] }\n```\n\n### Length\n\n#### Syntax\n```javascript\n\
    array.length\n```\n\n#### Output\n```\nsamplearr.length is:3\n```\n\n### Prototype\n\
    \n#### Syntax\n```javascript\nobject.prototype.name = value\n```\n\n#### Output\n\
    ```\nBook title is: GOT\nBook author is: Martin\nBook price is: 100\n```\n\n##\
    \ Array Methods\n\nThe following are the methods of the array object, including\
    \ their description.\n\nIn the following exercises, we will explore how some of\
    \ the array methods can be used:\n\n### concat()\n\nOutputs a new array consisting\
    \ of this array joined more arrays.\n\n#### Syntax\n```javascript\narray.concat(value1,\
    \ value2, ..., valueX);\n```\n\n**Argument Details:**\n`valueX` : Arrays and/or\
    \ values to concatenate to the resulting array.\n\n**Return Value:**\nReturns\
    \ the array elements\n\n#### Output\n```\nnew str : X,Y,Z\nnew str : X, Y, Z\n\
    new str : X + Y + Z\n```\n\n### push()\n\nAdds the given element in the last of\
    \ the array and outputs the length of the new array.\n\n#### Syntax\n```javascript\n\
    array.push();\n```\n\n**Argument Details:**\n`element1, ..., elementX`: The elements\
    \ to add to the end of the array.\n\n**Return Value:**\nOutputs the length of\
    \ the new array.\n\n#### Output\n```\nnew numbers are : 2,4,6,8\nnew numbers are\
    \ : 2,4,6,8,10\n```\n\n### reverse()\n\nReverses the element of an array.\n\n\
    #### Syntax\n```javascript\narray.reverse();\n```\n\n**Return Value:**\nOuputs\
    \ the length of the new array\n\n#### Output\n```\nReversed array is : 10, 9,\
    \ 8, 7\n```\n\n### shift()\n\nDeletes the first element from an array and outputs\
    \ that element.\n\n#### Syntax\n```javascript\narray.shift();\n```\n\n**Return\
    \ Value:**\nOutputs the deleted single value of the array.\n\n#### Output\n```\n\
    Removed number is : 123\n```\n\n***\n\nIf you wanted to, say, record ten names,\
    \ without using arrays, you’d have to do something like:\n\n```javascript\n| var\
    \ name1, name2, name3, name4, name5, name6, name7, name8, name9, name10; |\n```\n\
    \nAnd this is only for declaring the variables! Here’s how messy it would be if\
    \ you actually have to store user input using this method:\n\n```javascript\n\
    | for (var counter = 1; counter <= 10; counter++){\n    if(counter == 1) {\n \
    \       name1 = prompt('Please enter name 1: ');\n    }\n    if(counter == 2)\
    \ {\n      name2 = prompt('Please enter name 2: ');\n    }\n    if(counter ==\
    \ 3) {\n      name3 = prompt('Please enter name 3: ');\n    }\n    if(counter\
    \ == 4) {\n      name4 = prompt('Please enter name 4: ');\n    }\n    if(counter\
    \ == 5) {\n      name5 = prompt('Please enter name 5: ');\n    }\n    if(counter\
    \ == 6) {\n      name6 = prompt('Please enter name 6: ');\n    }\n    if(counter\
    \ == 7) {\n      name7 = prompt('Please enter name 7: ');\n    }\n    if(counter\
    \ == 8) {\n      name8 = prompt('Please enter name 8: ');\n    }\n    if(counter\
    \ == 9) {\n      name9 = prompt('Please enter name 9: ');\n    }\n    if(counter\
    \ == 10) {\n      name10 = prompt('Please enter name 10: ');\n    }\n} |\n```\n"
