  raw: 'Let’s see now, normally when we are talking about a ‘function’ what’s the
    first thing that comes to your mind? Obviously an activity right? 


    The functions in JavaScript also work in a similar manner. Functions are blocks
    of codes which are required to be executed over and over again by the program.
    A Function is used to perform a particular task. A Function can contain any number
    of arguments and statements; they can even have none. Depending on how the structure
    is coded, it may or may not return any value to the user.


    A Function is declared in the following manner:


    Function name(                 ) { /*code blocks to be executed*/}


    To start the Function, we start with the function keyword, and then we add the
    name, and parentheses. To finish the function, we place the code blocks to be
    executed in a curvy brackets. 


    You can also put the function in a named variable-


    var jam = function() {/* code blocks to be executed*/}


    Below are few examples of how you can execute a function-


    i) This is the example of the most basic function


    varsayHello = function(person, greeting) {


    var text = greeting + ‘ , ‘+ person;


    console.log(text);


    };


    Say Hello (‘ Jessica’ , ‘ Hello’);


    ii) This is the example of a function that returns a value


    var greet = function (person, greeting) 


    {


    var writing = greeting + ‘ , ‘ + person ;


    return function () {console.log(text); };


    }


    console.log(greet(‘Richard’ ,’ Hello”));


    iii) Sometimes, you might want to use a nested function. (Note: A nested function
    is a function within another function.)


    varsayHi = function( person, greeting) {


    var text = greeting + ‘,’ + person;


    return function() {console.log (text);}


    };


    var greeting = greet( ‘ Richard’ , ‘Hello’);


    greeting();


    Self-Executing Anonymous Function


    Programmers have always been looking for the most advanced and clever methods
    available to improve their programming experience and ways to make it more accessible
    and easier for them. This resulted in the creation of theSelf-Executing Anonymous
    function.


    The core purpose of the self-executing anonymous function is to create a JavaScript
    function and then immediately execute it upon its conception. 


    This makes it much easier for a programmer who isworking on large scale programs.
    Likewise, it will help you to code without creating a messy global namespace. 


    A basic Self-Executing Anonymous Function Would be-


    ![Description: 00006.jpeg](images/00036.jpeg)


    It is very important that you understand how to use this type of function if you
    plan on programming complex code in JavaScript. Using the Self-Executing Anonymous
    Function can produce some great code that is easy to use. As an example, the JQuery
    library is designed to make using JavaScript on websites much easier. It does
    this by wrapping the entire library in one large self-executing function. 


    Typeof Operator


    You might run into a situation where you need to determine the type of variable
    that you are working in JavaScript. You won’t have call Sherlock Holmes to find
    that! Instead, you can simply use the ‘typeof’ operator to determine the type
    of any specific value. In other words, the typeof operator is used to evaluate
    the type of the operand. 


    EX-


    Varmyvar=0


    alert(typeofmyvar) //alerts “number”


    Number isn’t the only type of operand that can be detected. It can also be: string,
    Boolean, object, null, and not defined.


    Scope


    Scope is the accessibility of a variable.


    A good understanding of Scope is necessary when it comes to debugging because
    it allow you to know what variable from which code block is causing the problem.


    The simple rule here is that whenever you declare a variable inside a scope, it
    will only be recognized by the statements that are inside that scope; the statements
    that are outside the scope will not acknowledge its existence and so that variable
    will not work.


    Another way to look at this is to imagine your entire code as a hotel with specific
    functions and sections of code as hotel rooms. The hotel rooms represent the private
    scopes of the code, while the common areas represent the global scope. A person
    in one hotel room cannot see or use what is in another hotel room. Staff who work
    in the hotel (and the global scope) also don’t have access to private hotel rooms
    unless they have specific permission. Meanwhile, guests can go through the common
    areas and make use of any object there. 


    Thus, you can see how scope can affect how your code runs. If you need two different
    functions to access the same variable, you need to ensure that they both have
    access to it. One key way to ensure that the necessary variables have access to
    is to make your variables globally accessible.


    There are two possible alternatives if you want your variables to become globally
    accessible. 


    The first thing you can do is to declare the variable outside the scope of your
    given piece of code, this will allow any functions in your program to be able
    to call it and recognize it.


    The other thing you can do is to declare the variables inside your scope without
    using the word var. If the same variable was not defined at the beginning of the
    code outside the scope of the piece of code in question, then the variable will
    act similarly to a global one.


    Ex-


    var foo = ‘hello’;


    var talkHello = function() {


    console.log(foo);


    };


    talkHello(); // logs ‘hello’


    console.log(foo); // also logs ‘hello’


    As you can see, the variable foo is declared outside of the function talkHello.
    That means that foo is a global variable and any function will be able to access
    it, so when the function talkHello calls it, it is accessible.


    The following example is contradictory to the first example. This shows that a
    code block that was written outside the scope is not being able to recognize the
    variable.


    var talkHello = function() {


    var doo = ‘hello’;


    console.log(doo);


    };


    talkHello(); // logs ‘hello’


    console.log(doo); // gives an empty log.


    In this example, the variable doo is called inside the function talkHello. This
    creates a private variable that is only accessible to the function, hence when
    the command console.log(doo) attempts to access it, it returns a null value.


    The “break” Statement


    Programmers use this statement to end loop or switch statements. When using a
    “break” statement, you must remember the following rules:


    *   If your break statement doesn’t have a label, it will terminate the innermost
    loop/switch and pass the control flow to the next statement.


    *   If your break statement has a label, it will terminate the labeled statement.


    The syntax of a break statement is:


    ![Description: 00028.jpeg](images/00037.jpeg)


    Use the first variant of the syntax if you don’t need to specify a label. This
    will terminate the innermost loop/switch. Use the second variant if you want to
    terminate a certain loop/switch. Just enter the label of that particular loop
    or switch. When using the second variant, only the specified loop/switch will
    be terminated.


    The “for… of” Statement


    This statement is a recent addition to the JavaScript language. It creates a loop
    that can repeat “iterable objects” (e.g. maps, sets, arrays, arguments, etc.).
    It also invokes an iteration hook that will run for each distinct property of
    an object. JavaScript allows you to customize the iteration hook of any “for…
    of” statement. Here is the syntax that you must use:


    ![Description: 00029.jpeg](images/00038.jpeg)


    The “for… in” Statement


    A “for… in” statement repeats the assigned statement/s over the properties of
    any object. JavaScript will execute the assigned statement/s for every property.
    The syntax of a “for… in” statement is:![Description: 00030.jpeg](images/00039.jpeg)


    The “continue” Statement


    You may use this statement to restart other statements (e.g. for, while, do… while,
    and label). Here are the two rules that you must remember when using a “continue”
    statement:'
