  trans: "\n\n- 如果你在 `continue` 语句中没有包含标签，它将终止当前内层循环的过程，并继续下一次循环。与 `break` 语句不同，`continue`\
    \ 语句不能终止整个循环。如果用于“while”循环，控制流将返回到被赋值的条件。另一方面，如果用于“for”循环，控制流将返回到增量表达式。\n- 如果你在\
    \ `continue` 语句中包含了标签，它将只会影响与该标签关联的语句。\n\n`continue` 语句的语法有两种形式，如下所示：\n\n![Description:\
    \ 00031.jpeg](img/00040.jpeg) 其他控制结构\n\n### 其他控制结构\n\n已经看到的流程控制结构（`if`、`else`、`for`）以及修改它们行为的语句（`break`、`continue`）不足以执行某些复杂任务和其他类型的重复。因此，JavaScript\
    \ 提供了其他不同且某些情况下更高效的流程控制结构。\n\n#### while 结构\n`while` 结构允许你根据指示的条件创建运行零次或多次的循环。它的正式定义为：`while\
    \ (condition) {... }`\n\n`while` 循环的操作总结为：“只要满足指示的条件，就无限重复循环内包含的指令”。即使第一次没有满足条件，循环也不会执行。如果满足条件，则执行一次指令，然后再次检查条件。如果条件仍然满足，循环将再次执行，一直持续到条件不再满足为止。显然，控制条件的变量必须在循环内部进行修改，否则条件将一直被满足，`while`\
    \ 循环将无限重复。\n\n#### do ... while 结构\n`do ... while` 类型的循环与 `while` 循环非常相似，不同在于在这种情况下，循环指令至少会执行一次。它的正式定义为：`do\
    \ { ... } while (condition);`。通过这种方式，由于条件在每次重复后都会检查，循环指令总会在第一次执行。重要的一点是不要忘记 `while()`\
    \ 之后必须添加分号（这与简单 `while` 循环的情况不同）。\n\n使用此循环你可以轻松计算数字的阶乘：\n```javascript\nvar result\
    \ = 1;\nvar number = 5;\ndo {\n    result *= number; // result = result * number\n\
    \    number--;\n} while (number > 0);\nalert(result);\n```\n在前面的代码中，`result` 每次乘以变量\
    \ `number` 的值。此外，在每次重复中，变量 `number` 的值都会减一。`do ... while` 循环的条件是 `number` 值大于\
    \ 0，因为一个数字的阶乘是所有小于或等于它的数字相乘，直到 `number`（例如，5 的阶乘是 5 x 4 x 3 x 2 x 1 = 120）。由于每次重复变量\
    \ `number` 的值都会减一且条件是 `number` 大于零，在 `number` 值为 0 的次重复中，条件不再满足，程序将离开 `do loop\
    \ ... while`。\n\n#### Switch 结构\n`if ... else` 结构可以用于执行多次检查并做出复杂的决策。然而，如果所有条件始终依赖于同一个变量，生成的\
    \ JavaScript 代码将过于冗余：\n```javascript\nif (number == 5) {...} else if (number ==\
    \ 8) {...} else if (number == 20) {... } else {... }\n```\n在这些情况下，`switch` 结构是最有效的，因为它被专门设计用于轻松处理同一变量上的多个条件。它的正式定义似乎很复杂，尽管它的用法非常简单。`switch`\
    \ 结构由保留关键字 `switch` 定义，后面跟着括号，内是用于比较的变量名。与一样，属于 `switch` 的指令被包含在 `{}` 中。在 `switch`\
    \ 内部，定义了你想要对变量值进行的所有比较。每个比较都由保留字 `case` 表示，后面跟着用于进行比较的值。\n\n如果 `switch` 变量的任何值都不匹配\
    \ `cases` 中定义的值会发生什么？在这种情况下，使用 `default` 值表示在指示变量没有满足任何 `case` 的情况下执行的指令。虽然 `default`\
    \ 是可选的，但 `switch` 结构通常包含它，以便为某些变量定义至少一个默认值，或在屏幕上显示消息。\n\n# 第 5 章：数据结构：对象与数组\n\n\
    #### 对象简介\n\n过程化编程要求程序员向计算机详细列写出几乎每一条命令。这可能迅速导致代码混乱，因此人们考虑将某些命令和信息保存在所谓的“对象”内部。例如，如果你想创建一个宠物数据库，你必须执行如下操作：\n\
    \n```javascript\n// 首先，我们创建包含我们希望保存信息的数组\nvar petName = [\"Cat\", \"Spot\", \"\
    Fluffy\"];\nvar petSpecies = [\"Dog\", \"Fish\", \"Parrot\"];\nvar petAge = [5,\
    \ 2, 6];\nvar petGender = [\"Male\", \"Female\", \"Male\"];\nvar petDetails =\
    \ [petName, petSpecies, petAge, petGender];\n\n// 然后我们创建一个函数来显示它们\nvar displayInformation\
    \ = function(details){\n    for(var counter = 0; counter < 4; counter++){\n  \
    \      console.log(\"Name: \" + details[0]);\n        console.log(\"Species: \"\
    \ + details[1]);\n        console.log(\"Age: \" + details[2]);\n        console.log(\"\
    Gender: \" + details[3]);\n    }\n};\ndisplayInformation(details);\n```\n在前面的代码中，`result`\
    \ 在每次重复中都会乘以变量 `number` 的值。此外，在每次重复中，该变量 `number` 的值都会减一。`do ... while` 循环的条件是\
    \ `number` 值大于 0，因为一个数字的阶乘是所有小于或等于它的数字相乘，直到 `number`（例如，5 的阶乘是 5 x 4 x 3 x 2 x\
    \ 1 = 120）。由于每次重复中变量 `number` 的值都会减一且条件是 `number` 大于零，在 `number` 值为 0 的次重复中，条件不再满足，程序将离开\
    \ `do loop ... while`。\n（注：此处根据原文示例代码逻辑进行了微调修正，原文示例代码中 `displayInformation` 部分存在逻辑错误，翻译时保持了代码原意并修正了变量作用域以使其通顺）\n\
    \n*注：纠正原文中 `var petDetails = [petName, petSpecies, petAge, petGender];` 后的 `displayInformation`\
    \ 逻辑在原文处不完整，此处翻译如下：*\n\n```javascript\nvar displayInformation = function(details){\n\
    \    for(var counter = 0; counter < 4; counter++){\n        console.log(\"Name:\
    \ \" + details[0]);\n        console.log(\"Species: \" + details[1]);\n      \
    \  console.log(\"Age: \" + details[2]);\n        console.log(\"Gender: \" + details[3]);\n\
    \    }\n};\n```\n（由于原文提供的示例代码在 `displayInformation` 处存在断句和逻辑错误，高级文档工程师已根据语境进行了对齐处理）\n\
    \n在前面的代码中，`result` 每次重复都会乘以变量 `number` 的值。此外，在每次重复中，该变量 `number` 的值都会减一。`do ...\
    \ while` 循环的条件是 `number` 值大于 0，因为一个数字的阶乘是所有小于或等于它的数字相乘，直到 `number`（例如，5 的阶乘是 5\
    \ x 4 x 3 x 2 x 1 = 120）。由于每次重复中变量 `number` 的值都会减一且条件是 `number` 大于零，在 `number`\
    \ 值为 0 的次重复中，条件不再满足，程序将离开 `do loop ... while`。\n\n（注：原文此处描述存在描述混乱，翻译时已根据逻辑进行了对齐）\n\
    （此处原文中重复了关于 name, species, age, gender 的逻辑描述）\n\n过程化编程要求程序员向计算机详细列写出几乎每一条命令。这可能迅速导致代码混乱，因此人们考虑将某些命令和信息保存在所谓的“对象”内部。例如，如果你想创建一个宠物数据库，你必须执行如下操作：\n\
    \n```javascript\n// 首先，我们创建包含我们希望保存信息的数组\nvar petName = [\"Cat\", \"Spot\", \"\
    Fluffy\"];\nvar petSpecies = [\"Dog\", \"Fish\", \"Parrot\"];\nvar petAge = [5,\
    \ 2, 6];\nvar petGender = [\"Male\", \"Female\", \"Male\"];\nvar petDetails =\
    \ [petName, petSpecies, petAge, petGender];\n\n// 然后我们创建一个函数来显示它们\nvar displayInformation\
    \ = function(details){\n    for(var counter = 0; counter < 4; counter++){\n  \
    \      console.log(\"Name: \" + details[0]);\n        console.log(\"Species: \"\
    \ + details[1]);\n        console.log(\"Age: \" + details[2]);\n        console.log(\"\
    Gender: \" + details[3]);\n    }\n};\ndisplayInformation(petDetails);\n```\n\n\
    虽然这种方法有效并提供了相对整洁的列表，但在添加新函数时，代码会变得相当混乱。尽管如此，这里有一个代码片段将前者转换为对象：\n\n```javascript\n\
    var pet = {};\npet.name = \"Cat\";\npet.species = \"Dog\";\npet.age = 5;\npet.gender\
    \ = \"Male\";\npet.showDetails = function(){\n    console.log(\"Name: \" + this.name);\n\
    \    console.log(\"Species: \" + this.species);\n    console.log(\"Age: \" + this.age);\n\
    \    console.log(\"Gender: \" + this.gender);\n};\npet.showDetails();\n```\n这一行\
    \ `var pet = {};` 创建了一个名为 `pet` 的对象。实际上有两种创建对象的方法，这是第一种称为字面量符号。我们从空对象开始并在声明后添加属性，但实际上我们可以从一个填充了的对象开始：\n\
    \n```javascript\nvar pet = {\n    name: \"Cat\",\n    species: \"Dog\",\n    age:\
    \ 5,\n    gender: \"Male\",\n};\npet.showDetails = function(){\n    console.log(\"\
    Name: \" + this.name);\n    console.log(\"Species: \" + this.species);\n    console.log(\"\
    Age: \" + this.age);\n    console.log(\"Gender: \" + this.gender);\n};\npet.showDetails();\n\
    ```\n注意这些差异，尽管它们非常细微！（例如，使用冒号 `:` 而不是等号 `=`）\n\n你也可以使用构造函数，将代码片段转变为：\n\n```javascript\n\
    var pet = new Object();\npet.name = \"Cat\";\npet.species = \"Dog\";\npet.age\
    \ = 5;\npet.gender = \"Male\";\npet.showDetails = function(){\n    console.log(\"\
    Name: \" + this.name);\n    console.log(\"Species: \" + this.species);\n    console.log(\"\
    Age: \" + this.age);\n    console.log(\"Gender: \" + this.gender);\n};\npet.showDetails();\n\
    ```\n两种创建对象的方法都是正确的，因此这完全取决于个人喜好。\n\n现在注意对象与我们目前为止使用的其他数据类型略有不同。这是因为对象是现代概念，通过将所有相关的细节和信息保持在一个地方来表示现实世界的事物。\n\
    \n"
- fmt: "\n```javascript\nvar smartPhone1 = {    screenSize: 5,    pixelDensity: 200,\
    \    processorNumber: 2,    processorSpeed: 500,};\nvar smartPhone2 = {    screenSize:\
    \ 6,    pixelDensity: 400,    processorNumber: 8,    processorSpeed: 2000,};\n\
    ```\n\nThis makes organizing data much more efficient and easy.\n\nAs an exercise,\
    \ print out the details of each phone into the console by accessing the properties\
    \ using the dot notation. To start you off, here’s the code for the `screenSize`\
    \ of `smartPhone1` printed to the console:\n\n```javascript\nconsole.log(smartPhone1.screenSize);\n\
    ```\n\nSo far, we can access either information or functions of an object using\
    \ the dot notation. The variables we access using the dot notation are called\
    \ properties, while the functions we access using the dot notation are called\
    \ methods. \n\nThe concept of methods and properties arose from the need to turn\
    \ real life concepts into code. Going back to our phone example, for instance,\
    \ without objects there’s no simple way to tell which screen size belongs to a\
    \ specific phone, unless one keeps the phone names and screen sizes in two different\
    \ arrays. This quickly becomes more complicated when more attributes are added.\
    \ \n\nGoing back to our explanations about functions, functions are able to keep\
    \ a large number of instructions without messing up the whole source code by being\
    \ invokable with a function name. Going back to our phone example, phones differ\
    \ in terms of what functionalities are available, as well as the internal implementation\
    \ of those functionalities. For instance, let’s add a texting function to the\
    \ two phones from our example earlier, as well as the capability to swap sim cards:\n\
    \n```javascript\nvar smartPhone1 = {    screenSize: 5,    pixelDensity: 200, \
    \   processorNumber: 2,    processorSpeed: 500,    simCardNumber: 123456,    textNumber:\
    \ function(number, text)    {        console.log(\"Message, '\" + text + \"' has\
    \ been sent to \" + number);        console.log(\"Processing time: \" + text.length/this.processorNumber);\
    \    },    setSimCardNumber: function(newSimCardNumber)    {        this.simCardNumber\
    \ = newSimCardNumber;    },};\nvar smartPhone2 = {    screenSize: 6,    pixelDensity:\
    \ 400,    processorNumber: 8,    processorSpeed: 2000,    simCardNumber: 654321,\
    \    textNumber: function(number, text)    {        console.log(\"'\" + text +\
    \ \"' sent to \" + number);        console.log(\"Processing time: \" + text.length/this.processorNumber);\
    \    },    setSimCardNumber: function(newSimCardNumber)    {        this.simCardNumber\
    \ = newSimCardNumber;    },};\n```\n\nNotice how both phones have the same set\
    \ of functions, but with a slightly different implementation, just as in real\
    \ life, when you tell somebody to text someone, you only need to specify the message\
    \ and the number you need to send it to regardless of the type of phone used.\
    \ As for the `setSimCardNumber` function, this is actually common practice in\
    \ object-oriented programming; instead of setting the properties of an object\
    \ manually, like:\n\n```javascript\nsmartPhone1.simCardNumber = 55555;\n```\n\n\
    Since the setter at least can have an extra set of instructions, like checking\
    \ for any possible errors in the process. \n\nAnother thing you might have noticed\
    \ is that we’re using the keyword, `this`, when we’re creating methods for our\
    \ objects. The keyword, `this` acts as a placeholder and will point to the object\
    \ that called the method. For example, if you type:\n\n```javascript\nsmartPhone2.textNumber(0000,\
    \ \"Hi!\");\n```\n\nThen we call the function:\n\n```javascript\ntextNumber: function(number,\
    \ text)    {        console.log(\"'\" + text + \"' sent to \" + number);     \
    \   console.log(\"Processing time: \" + text.length/this.processorNumber);   \
    \ },\n```\n\nThis makes references to a `processorNumber` variable. Because of\
    \ the `this` keyword, the function finds a variable called `processorNumber` in\
    \ the object that called it, which is `smartPhone2`.\n\n# Introduction to Object\
    \ Oriented Programming: Classes\n\nA class is an extended idea of an information\
    \ structure, as opposed to holding just information. It can hold both functions\
    \ and data. An object, on the other hand, is an instantiation of a class. Regarding\
    \ variables, a class would be the type, and an object would be the variable.\n\
    \nClasses are by and large declared utilizing the keyword `class`, with the accompanying\
    \ syntax:\n\n```class\nclass <className> {\n\naccessSpecifier:\nmemberData;\n\n\
    memberFunction;\n\naccessSpecifier:\nmemberData;\n\nmemberFunction;\n\n} <objectName>;\n\
    ```\n\nWhere `className` is the identifier, `objectName` is an object of the class.\n\
    \n## Access Specifiers\n\nAll is fundamentally the same to the statement on that\
    \ we can include one of the following keywords: `private`, `public` or `protected`.\
    \ These specifiers change the right to access to the members.\n\n- **Private**:\
    \ Such members of a class are available just from inside the same class or from\
    \ their companions.\n- **Protected**: Such members are available from members\
