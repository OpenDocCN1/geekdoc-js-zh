    另一种控制流的方法是使用 `switch` 语句。它为你提供了对变量的一系列范围值进行测试的选项，并可以替代复杂的、长长的 `IF … ELSE` 语句。


    以 `switch` 单词开始，然后是一组括号。你正在检查的变量放在 `switch` 括号之间，后面跟着一组大括号。`switch` 语句的其余部分放在大括号之间。


    ### 布尔值可以是对象


    通常，`Boolean` 是一个由字面量创建的原始值：


    ```

    var x = false;

    ```


    但 `Boolean` 也可以通过使用 `new` 关键字定义为对象，例如：


    ```javascript

    var y = new Boolean (False)

    ```


    ### switch 语句


    当我们想要根据不同的条件执行不同的操作时，就会使用 `switch` 语句，即从多个代码块中选择一个来执行。


    以下是 `switch` 语句的工作原理：


    - 表达式的值将与每个 `case` 值进行比较

    - 如果发生匹配，将执行与匹配相关的代码块。


    ### 流程控制结构


    如果你想创建一个用户注册表单，询问用户的姓名、电子邮件地址、年龄和密码，你首先需要声明这些变量：


    ```javascript

    var name;var email;var age;var password;

    ```


    现在我们需要存储用户的输入。目前，我们使用 `prompt` 函数：


    ```javascript

    name = prompt(''What’s your name?'');email = prompt(''What’s your email?'');age
    = prompt(''What’s your age?'');password = prompt(''Please enter your desired password:
    '');

    ```


    假设你在数据字段中输入了正确类型的信息，那么 `name`、`email`、`age` 和 `password` 变量现在有了正确的数据类型来处理和存储。然而，如果用户留空电子邮件字段，或者在年龄字段中填了字母怎么办？如果某些关键信息字段没有类型的数据，我们不能让程序继续运行，因此我们使用流程控制语句。我们将讨论的第一个是
    `if` 语句。


    #### if...结构


    有时我们必须根据不同的情况采取不同的功能。我们可以结合 `if` 语句和条件运算符 `?`（也称为“问号运算符”）使用。


    #### 2.10.1 "if" 语句


    `if statement(...)` 评估括号中的条件，如果结果为真，则执行代码块。


    例如：


    ![Description: 00120.jpeg](img/00030.jpeg)


    在上面的示例中，条件是相等检查 (`year == 2015`)，但它始终可以更复杂。


    我们想要执行多个语句；我们需要将你的代码块封装在大括号内：


    ![Description: 00121.jpeg](img/00031.jpeg)


    我们建议你在每次使用 `if` 语句时都用 `{}` 循环括号包裹代码块，即使其中只有一个语句要执行。这将提高可读性。


    ### JavaScript 的函数和基本属性


    通常情况下，函数充当“子程序”，你可以通过内部/外部代码调用它们。与完整程序类似，函数包含了一组被称为“函数体”的语句。JavaScript 允许你向函数传递值。此外，函数可以返回一个值。


    JavaScript 将函数视为一等对象，因为它们拥有在其他编程对象中找到的方法和属性。函数与其他 JavaScript 对象之间的主要区别在于，你可以在任何需要的时候调用函数。


    #### 什么是函数？


    在 JavaScript 中，每个函数都被视为一个唯一的对象。此外，函数不同于过程。函数 100% 的情况下都会返回值，而某些过程不会。


    如果你想让函数返回值，就必须在函数中添加 `return` 语句。`return` 语句指定了必须返回的值。没有 `return` 语句的函数给出默认值。在大多数情况下，函数的默认值是
    `"undefined"`。


    函数的参数是在调用它时使用的参数。JavaScript 使用值将参数传递给函数。如果函数修改了参数的值，该修改不会在全局或函数内部中出现。然而，对象引用也是一种值（而且是特殊的引用）——如果函数更改了所引用对象的属性，这些更改将在全局范围内出现。


    #### 如何定义函数


    在 JavaScript 中，你可以通过不同的方式定义函数。让我们详细讨论每种方法：


    - **使用函数声明** – JavaScript 提供了一句你可以用于声明函数的特殊语法。该语法如下所示：


    ![Description: 00032.jpeg](img/00032.jpeg)


    该语法有三个不同的部分，分别是：


    - `name` – 这是函数的名称。你可以将其替换为任何有效的标识符。

    - `param` – 这是你想要传递给函数的参数/参数。JavaScript 允许每个函数包含多达 255 个参数。

    - `statements` –这部分持有函数的语句（即函数体）。


    - **通过函数表达式** – 这种方法与上一种相似。事实上，它使用了以下语法（见下文）：


    ![Description: 00033.jpeg](img/00033.jpeg)


    - **使用 JavaScript 的“函数构造函数”** – JavaScript 允许你使用 `new`（这是一个运算符）生成函数。你必须使用的语法如下：


    ![Description: 00034.jpeg](img/00034.jpeg)


    上述语法包含以下部分：


    - `arg1, arg2, … argN` – 这包含了你想作为形式参数的名字。

    - `functionBody` – 这是一个字符串。


    #### 如何调用函数


    在定义函数时，你只是在命名该函数并指定调用后执行的操作。如果你想让它执行操作，请调用函数。例如，如果你已经定义了 `square` 函数，你可以使用以下代码调用它：


    ```javascript

    square(2);

    ```


    上面的代码调用了 `square` 函数并分配了 2 作为参数。函数运行其语句并给出 4 作为结果。


    你的函数在调用时必须位于正确的作用域内。然而，你可以对函数声明进行提升（提升到顶部）。这是一个示例：


    ![Description: 00035.jpeg](img/00035.jpeg)


    函数的参数可以持有不同的编程元素（不仅仅是数字和字符串）。JavaScript 允许你将整个对象赋值给函数。例如，内置函数 `show_props()` 接受对象作为参数。


    #### 函数的作用域


    如果你在函数内部定义了一个变量，你无法从外部访问该变量。因为你将其定义在了函数的作用域内。然而，函数可以访问在其定义作用域内创建的所有变量和其他函数。简单来说，全局函数可以访问全局变量。嵌套函数（即放在另一个函数内部的函数）可以访问在其“母函数”内部创建的变量。


    #### 参数


    JavaScript 将参数视为数组对象。在函数内部，你可以使用以下语法访问它包含的参数：


    ```javascript

    arguments[n]

    ```


    在此语法中，`n` 代表参数的序号，从零开始。这意味着函数的初始参数是 `arguments[0]`。


