    \ `t-e-a` 替换为 `e-g-g`。\n\n数组和字符串有指定的边界，限制程序员始终在这些限制范围内工作。在上面的示例中，我们创建了一个长度为 38\
    \ 个字符的数组，因此尝试复制比此更长的数组可能会困难。复制的长数组将覆盖到所创建数组的末尾。\n\n### Arduino 编程 - 时间\nArduino\
    \ 编程共有四个时间处理函数，如下所示：\n- `delay()` 函数\n- `delayMicroseconds()` 函数\n- `millis()`\
    \ 函数\n- `micros()` 函数\n\n我们将讨论这些每一个时间函数，并强调它们在 Arduino 编程中的重要性。\n\n#### `delay()`\
    \ 函数\n这是四个函数中最简单的时间处理函数。它只使用单个整数作为输入或参数。该整数代表毫秒级的等待时间，指示程序等待直到移动到下一组代码，并在那里将遇到\
    \ `delay()` 函数。\n\n通常不建议使用此函数来指示你的代码等待，因为它与被称为“阻塞”（blocking）的现象有关。\n\n#### `delayMicroseconds()`\
    \ 函数\n与 `delay()` 函数一样，`delayMicroseconds()` 也只接受单个整数作为参数或输入。这里的整数代表微秒级的时间，在这种情况下等同于毫秒的千分之一或秒的百万分之一。\n\
    \n记录经过测试并证明能够产生精确延迟的时间记录为 16383，这取决于未来 Arduino 开发板生产中的发明而改变。然而，对于小于千微秒的延迟，建议使用\
    \ `delay()` 函数。\n\n#### `millis()` 函数\n这里使用的时间延迟是毫秒，这意味着 Arduino 板卡一运行程序，它就会返回一个毫秒数。这个延迟时间在约\
    \ 50 天后有时会回到零，这种现象被称为“溢出”（overflowing）。\n\n语法：\n```cpp\nmillis (); // 此函数返回从程序开始计算的毫秒数。\n\
    ```\n\n程序中的示例：\n```cpp\nunsigned double delay time;\n\nvoid setup(){\n  Serial.begin(9600);\n\
    }\n\nvoid loop()\n{\n  Serial.print(\"delay time:\");\n  delay time = millis();\n\
    \  //下面的代码将打印自程序开始以来的时间\n  Serial.println(delay time);\n  //此代码规定你必须等待一秒以防止 //大量数据\n\
    \  delay time(1000);\n}\n```\n\n#### `micros()` 函数\n此函数也返回从程序开始开始的时间，时间以微秒表示。溢出现象在这里在大约\
    \ 70 分钟后也会发生。\n\n语法：\n```cpp\nmicros (); // 该函数应该返回程序开始后微秒级的时间段。\n```\n\n程序中的示例：\n\
    ```cpp\nunsigned double delay time;\n\nvoid setup(){\n  Serial.begin(9600);\n\
    }\n\nvoid loop(){\n  Serial.print(\"delay Time:\");\n  delay time = micros();\n\
    \  //下面的代码打印自程序开始的时间段\n  Serial.println(delay time);\n  //此代码规定你必须等待一秒以防止 //发送大量数据\n\
    \  delay time(1000);\n}\n```\n\n### Arduino 编程- 数组\n数组是位于连续内存位置的相同数据类型元素的连续集合。\n\
    \n在数组中定位某个特定元素时，我们必须指定它的名称和它的存储位置的名称。因此，数组有两个重要特征，即名称和位置。识别数组的方法是给该特定元素一个名称，然后通过元素在方括号\
    \ `[]` 中的位置来确定。第一个元素（称为零元素）的下标为零，随后的元素可以用 `C[1]`、`C[2]`、`C[3]` 表示，其余的如下所示所示：\n\
    \n![Description: 00018.jpeg](img/00013.jpeg)\n\n上面的数组被称为 `C`，包含 11 个元素。每个元素都有一个值，例如\
    \ `C[10]` 的值为 78。\n\n因此，我们可以编写程序来操作这些值，例如，为了打印数组中前三个元素值的和，我们可以写：\n```cpp\nSerial.print\
    \ (C[ 0 ] + C[ 1 ] + C[ 2 ] );\n```\n同样，我们可以写另一个程序将 `C[8]` 的值乘以 6，并将结果赋值给名为 `y`\
    \ 的变量：\n```cpp\nx = C[ 8 ] * 6;\n```\n\n#### 数组声明\n数组声明有助于指定元素的类型和该数组中元素的总数，如下所示：\n\
    ```cpp\ntype arrayName [ arraySize ] ;\n```\n这指示编译器预留足够的内存。对于数组的声明，数组大小必须是整数。例如：\n\
    ```cpp\nint D[3]; //\n\n#### 使用数组的示例\n数组声明并使用循环来初始化元素：\n```cpp\n// b 是一个 12 元素的数组\n\
    int b[12] ;\nvoid setup ()\n{ \n}\nvoid loop ()\n{\n  for ( int j = 0; j < 10;\
    \ ++j ) // 初始化元素\n    b[j] = 0; // 将位置 设置为 0\n  Serial.print (j) ;\n  Serial.print\
    \ (`\\r`) ;\n}\n```\n\n#### 多维数组\n二维数组通常表示具有行和列的表格。\n\n多维数组的一些显著特征：\n- 有两个下标表示表格的行列。\n\
    - 第一个下标表示元素的行，第二个下标表示元素的列。\n- 多维数组有两个或更多维度。\n\n声明示例所示：\n```cpp\nint c[ 3 ][ 3\
    \ ] = { { 3, 8 }, { 3, 7 } };\n```\n\n### 求所有数组元素\n数组中的这些元素通常代表计算结果的值，或将用于特定数学工作的值。例如，教授可能决定将学生的成绩输入表格以形成数组，然后使用总和计算全班的平均分。下面的示例解释了如何使用数组函数实现这一目标。\n\
    \n```cpp\nconst int arraySize = 5; // 数组大小由名为 const 的变量指示，数据类型为 int\nint c[ arraySize\
    \ ] = { 80, 60, 50, 100, 70};\nint total = 0;\n\nvoid setup ()\n{ \n}\n\nvoid\
    \ loop ()\n{\n  // 下面的代码用于获取数组 c 内容的和\n  for ( int j = 0; j < arraySize; ++j )\n\
    \    total += c[ j ];\n  Serial.print (“ sum Total of elements of array c : ”)\
    \ ;\n  Serial.print(total) ;\n}\n```\n\n第 10 章：输入、输出和传感器\n\n"
