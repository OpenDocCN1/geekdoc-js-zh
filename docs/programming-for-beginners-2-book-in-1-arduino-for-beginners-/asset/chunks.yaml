    Chapter 7: Basic digital Arduino programs


    LED Blink


    This is the most basic program in Arduino programming just like printing the word
    “hello world” in any other programming language. Since in Arduino programming
    there is no screen to print “hello world”, we therefore blink an LED as our first
    test program. This is indeed a very simple program that is meant to give you a
    strong foundation as you invest into the world of circuit building through prototyping.


    The Required Components


    *   One breadboard


    *   An Arduino Uno


    *   One LED


    *   Resistor (330 ohms)


    *   Two jumper wires


    Circuit


    The circuit is quite simple due to the small number of components, therefore just
    follow the simple circuit diagram below:


    ![Description: 00024.jpeg](images/00002.jpeg)


    Finding the polarity of the LED


    An LED has polarity, that is, negative and positive terminals. To determine this,
    hold the LED with the flat side facing you. The shorter leg on your left side
    is the negative terminal while the longer leg on your right is the positive terminal.


    ![Description: 00025.jpeg](images/00003.jpeg)


    Sketch


    Quickly open the Arduino IDE on your computer, then a new sketch file on the New
    tab then begin writing your codes as shown below:


    */ Blink an LED, the codes below are meant to turn a Light Emitting Diode connected
    to a digital pin periodically. Pin number 13 is used since it has a resistor in
    its circuit to limit current through the LED */


    int ledPin = 13; // LED has been connected to digital pin number 13


    void setup()


    {


      ledPin(pinMode, OUTPUT); // the digital pin is set as the output


    }


    void loop()


    {


      digitalWrite(pinMode, HIGH); // the code is used to set LED ON


      delay(1000); // delay time is a second


      digitalWrite(ledPin, LOW); // the code is used to set LED OFF


      delay(1000); // delay time is a second


    }


    LED Blink without Delay


    Sometimes you may wish to let the LED light without stopping and this calls for
    the use of another function other than delay ( ). The function for LED blinking
    without delay keep track of the time when the LED was turned ON and OFF. The using
    a loop ( ), it checks if sufficient time interval has passed so as to turn the
    LED ON if it was OFF and vice versa. The other components are the same as for
    the example above.


