    \ the setup() function, this pin was set to act as an output pin. In the loop()\
    \ function, we have used the digitalWrite() function to turn the pin on and off.\
    \ A delay of 500 milliseconds has been added.\n\nThe analogRead() Function\n\n\
    Arduino whether a voltage has been applied to any of its pins then reports this\
    \ using the analogRead() function. A difference exists between an on/off sensor\
    \ and an analog sensor. The on/off sensor detects the presence of an object while\
    \ the value an analogue sensor changes continuously. For us to read an analog\
    \ sensor, a different type of pin is required.\n\nThe lower part of the Arduino\
    \ board has six pins that have been marked Analog In. These pins are able to tell\
    \ whether a voltage has been applied to them as well as the value of this voltage.\
    \ The analogRead() function can help us read the amount of voltage that has been\
    \ applied to any of these pins.\n\nThe function will always return a value ranging\
    \ between 0 and 1023, which is a representation of voltage between 0 and 5 volts.\
    \ For example, if a voltage of 2.5V has been applied to the pin number 0, the\
    \ analogRead(0) will read a value of 512\\. The 0 passed to the function is the\
    \ number of the pin. This means that the function takes the number of the pin\
    \ as the argument as shown in the following syntax:\n\nanalogRead(pin);\n\nThe\
    \ pin parameter is the number of analog pins whose value is to be read. Here is\
    \ an example that demonstrates how to use the analogRead() function in Arduino:\n\
    \nint analogPin =  3;// a potentiometer wiper\n\n // connected to the analog pin\
    \ 3\n\nint x =  0;  // variable to store the read value\n\nvoid setup()  {\n\n\
       Serial.begin(9600);  // setup serial\n\n} \n\nvoid loop()  {\n\nx = analogRead(analogPin);\
    \  // to read the input pin\n\n   Serial.println(x);  // print the value\n\n}\n\
    \nWe began by creating a variable named analogRead and assigning it a value of\
    \ 3\\. This variable denotes a potentiometer wiper that has been connected to\
    \ the analog pin number 3. We have also created a second variable, x, and assigned\
    \ it a value of 0\\. We will use this variable to store the value that has been\
    \ read from the pin, which is the voltage applied to the pin. In the loop() function,\
    \ we have called the analogRead() function and passed the value analogPin to it\
    \ as the parameter. This will read the value of the voltage on the analog pin\
    \ number 3 and store the read value in the variable x. We have then printed out\
    \ this value. \n\nThe analogReference() Function\n\nThis function configures the\
    \ reference voltage that is used for analog input, that is, the value that has\
    \ been used as the top of the input range. The function can take any of the following\
    \ options:\n\nDEFAULT – This is the default analog reference of 5 volts on the\
    \ 5V Arduino boards or 3.3 volts on the 3.3V Arduino boards. "
