  trans: "\n\n`INTERNAL` – 这是一个内置参考，在 `ATmega168` 或 `ATmega328` 上等于 1.1 伏特，在 `ATmega8`\
    \ 上等于 2.56 伏特。Arduino Mega 上不可用。\n\n`INTERNAL1V1` – 这是一个内置的 1.1V 参考。仅 Arduino\
    \ Mega 可用。\n\n`INTERNAL2V56` – 这是一个内置的 2.56V 参考。仅 Arduino Mega 可用。\n\n`EXTERNAL`\
    \ – 这是施加在 `AREF` 引脚上的电压，即仅限 0 到 5V，并用作参考。\n\n该函数采用以下语法：\n\n`analogReference (type);`\n\
    \n参数 `type` 可以是上述讨论的任何选项。\n\n在 `AREF` 引脚上，避免对外部参考使用任何低于 0V 或高于 5V 的电压。如果你在 `AREF`\
    \ 引脚上使用外部参考，在调用 `analogRead()` 函数之前，你应该将模拟引用设置为 `EXTERNAL`。如果你不这样做，将导致内部生成的活动参考电压与\
    \ `AREF` 引脚短路，这可能会损坏你 Arduino 板上的微控制器。\n\n你还可以通过 5K 电阻将外部参考电压连接到 `AREF` 引脚，这将允许你在内部和外部参考电压之间切换。由于\
    \ `AREF` 引脚内部有一个 32K 电阻，该电阻将改变作为参考的电压。两者将作为一个分压器工作。\n\n下面的示例演示了如何使用 `analogReference()`\
    \ 函数：\n\n```cpp\nint analogPin =  3;// 连接到模拟引脚 3 的电位器触\n\nint x =  0;  // 用于存储读取值的变量\n\
    \nvoid setup()  {\n  Serial.begin(9600);  // 设置串口\n  analogReference(EXTERNAL);\
    \  //施加到 AREF 引脚的电压\n // 用作参考。\n}\n\nvoid loop()  {\nx = analogRead(analogPin);\
    \  // 读取输入引脚\n  Serial.println(x);  // 打印值\n}\n```\n\n我们首先创建了一个名为 `analogPin`\
    \ 的变量并给其赋值为 3。该变量表示连接到模拟引脚号 3 的电位器触。我们还创建了第二个变量 `x`，并赋值为 0。我们将使用这个变量来存储从引脚读取的值，即施加到引脚上的电压。\n\
    \n考虑从代码中提取的以下行：\n\n`analogReference(EXTERNAL);`\n\n此行简单意味着施加在 `AREF` 引脚上的电压（范围在\
    \ 0 到 5V 之间）将作为参考。\n\n在 `loop()` 函数中，我们调用了 `analogRead()` 函数并将值 `analogPin` 作为参数传递给它。这将读取\
    \ 3 号模拟引脚上的电压值，并将读取的值存储在变量 `x` 中。然后我们打印了这个值。\n\n### 字符函数\n\n我们以字符的形式向计算机输入数据。这些字符可以是字母、数字和其他特殊符号。\n\
    \n处理字符的库带有许多函数，我们可以用这些函数来测试和操作数据的字符。每个函数接收 `int` 形式的数据或 `EOF` 作为参数。这意味着字符是作为整数进行处理的。\n\
    \n`EOF` 通常值为 -1，某些硬件架构不允许在 `char` 变量中存储负值。这意味着处理字符的函数将它们作为字符串处理。\n\n每当我们需要使用处理字符的函数时，都应该在程序中添加\
    \ `<cctype>` 头文件。以下是字符处理库提供的不同函数：\n\n`isdigit` 函数检查其参数是否为数字。`isalpha` 函数确定传递给它的参数是大写字母（即\
    \ A-Z）还是小写字母（即 a-z）。`isalnum` 函数检查传递给它的参数是否是大写字母、小写字母或数字。`isxdigit` 函数检查传递给它的参数是否为十六进制数字（即\
    \ A-F、a-f 或 0-9）。\n\n条件运算符 `(:?)` 可以与每个函数配合使用，以确定在每个测试过的字符的输出中应该打印“ 是一个”还是“ 不是一个”。\n\
    \n现在我们需要创建一个示例，来演示如何使用 `isupper` 和 `islower` 函数。我们使用 `isupper` 函数检查传递给它的参数是否大写（即\
    \ A-Z）。我们使用 `islower` 函数检查传递给它的参数是否为小写（即 a-z）。\n\n代码执行时将返回以下内容：\n\n`islower` 函数返回：\n\
    m is a lowercase letter\nM is not a lowercase letter\n6 is not a lowercase letter\n\
    ! is not a lowercase letter\n\n`isupper` 函数返回：\nD is an uppercase letter\nd is\
    \ not an uppercase letter\n9 is not an uppercase letter\n$ is not an uppercase\
    \ letter\n\n现在我们需要创建一个示例，演示 `isdigit`、`isalpha`、`isalnum` 和 `isxdigit` 函数的使用。`isdigit`\
    \ 函数帮助我们检查传递给它的参数是否为数字（即 0-9）。`isalpha` 函数帮助我们检查传递给它的参数是否为字母，即大写字母（A-Z）或小写字母（即\
    \ a-z）。`isalnum` 函数帮助我们检查传递给它的参数是否是大写字母、小写字母或数字。`isxdigit` 函数检查传递给它的参数是否为十六进制数字（即\
    \ A-F、a-f 或 0-9）。\n\n"
