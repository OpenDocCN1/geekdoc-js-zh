- fmt: '

    Arduino is not the only electronic prototyping platform on the market. There are
    other projects and development kits, the most common being Raspberry Pi and BeagleBone.
    Each uses a different microcontroller and has hardware design with its own characteristics.
    Prices also vary widely, and some other platforms are not as popular.


    The choice of which prototyping kit to use depends on the demands and needs your
    project imposes. Certainly, given the reasons cited above, Arduino is a strong
    candidate for most of its projects.


    # Chapter 2: Understanding of Arduino


    ### Key terms related to Arduino


    It will then close a circuit lighting up a bulb as output: a nightlight for your
    child. On most boards, there will be a `Pin LED`, associated with a specific pin,
    like `Pin 13` on the `Arduino Uno`. This `Pin LED` is the only output possibility
    built into the board, and it will help you with your first project of a “blink
    sketch,” which will be explained later. The `Pin LED` is also used for debugging
    or fixing the code you have written so that it has no mistakes in it. The `Power
    LED` is what its name implies: it lights up when the board is receiving power
    or is “turned on.” This can also be helpful in debugging your code. There exists
    on every board the microcontroller itself, called the `ATmega microcontroller`,
    which is the brain of the entire board. It receives your instructions and acts
    accordingly. Without this, the entire board would have no functionality.


    Analog in pins exist on the opposite edge of the board from the digital pins on
    the `Arduino Uno`. It is an input into the `Arduino system`. Analog means that
    the signal which is input is not constant but instead varies with time, such as
    audio input. In the example of audio input, the auditory input in a room varies
    with the people in the room talking and with the noises filtering in from outside
    the room. `GND` and `5V` pins are used to create additional power of `5V` to the
    circuit and microcontroller. The power connector is most often on the edge of
    the `Arduino board`, and it is used to provide power to the microcontroller when
    it is not plugged into the `USB`. The `USB port` can be used as a power source
    as well, but its main function is to upload, or transfer, your sketch, or set
    of instructions that you have coded, from your computer to the `Arduino`. `TX`
    and `RX LED`s are used to indicate that there is a transfer of information occurring.
    This indication of communication will happen when you upload your sketches from
    your computer to the `Arduino` so that they will blink rapidly during the exchange.


    # Chapter 3: Anatomy of Arduino Board


    Now that we know some basics in understanding the `Arduino microcontroller boards`
    let us look at the various options you have when purchasing an Arduino board.
    We will look at price, functionality, amount of memory, and other features to
    help make your decision as easy and straightforward as possible.


    ### Uno


    This is the board in which most people start their `Arduino journey`. It is on
    the smaller side in terms of memory but is very flexible in functionality and
    a great tool for beginners and those wanting to try their hand and mind at `Arduino`.
    This model has a `mini-USB port` which allows you to upload directly to the board
    without using a breakout board or other extra hardware.


    - Price: $24.95

    - Flash Memory: 32kB

    - SRAM: 2kB

    - EEPROM: 1kB

    - Processing Speed: 16MHz

    - Digital Pins: 14 pins

    - PWM Pins: 6 pins

    - Analog In: 6 pins

    - Operating Power: 5V

    - Input Power: 7-12V


    ### Leonardo


    The `Leonardo microcontroller board` is functional out-of-the-box: all you need
    is a `micro-USB cable` and a computer to get started. In addition, the computer
    can recognize the `Leonardo` as a mouse or a keyboard due to its `ATmega32U4`
    processor.


    - Price: $19.80

    - Flash Memory: 32kB

    - SRAM: 2.5kB

    - EEPROM: 1kB

    - Processing Speed: 16MHz

    - Digital Pins: 20 pins

    - PWM Pins: 7 pins

    - Analog In: 12 pins

    - Operating Power: 5V

    - Input Power: 7-12V


    ### 101


    This microcontroller contains a lot of features that are not available in other
    beginner models. For example, you can connect to the board through `Bluetooth
    Low Energy` connectivity from your phone. In addition, it comes with an accelerometer
    and a gyroscope built in to recognize motion in all directions with its six-axis
    sensitivity. It can recognize gestures as well.


    Put together, these features allow you to have motion of or around the device
    be the input to which the microcontroller will respond with an output.


    - Price: $30.00

    - Flash Memory: 196kB

    - SRAM: 24kB

    - EEPROM: 0kB

    - Processing Speed: 32MHz

    - Digital Pins: 14 pins

    - PWM Pins: 4 pins

    - Analog In: 6 pins

    - Operating Power: 3.3V

    - Input Power: 7-12V


    ### Esplora


    This board is based on the `Leonardo` but comes with even more technology built
    into it so that you do not have to learn as much electronics to get up and running.
    Instead, you can learn as you see the processes work themselves out.


    The input sensors that are built in include a joystick, a slider, a temperature
    sensor, a microphone, an accelerometer, and a light sensor. It also includes some
    sound and light outputs. It can expand its capabilities by attaching to other
    technology called a `TFT LCD screen` through two `Tinker kit input/output connections`.


    - Price: $43.89

    - Flash Memory: 32kB

    - SRAM: 2.5kB

    - EEPROM: 1kB

    - Processing Speed: 16MHz

    - Digital Pins: n/a

    - PWM Pins: n/a

    - Analog In: n/a

    - Operating Power: 5V

    - Input Power: 7-12V


    ### Mega 256O


    This microcontroller is designed for larger projects like robotics and 3D printers.
    It has many times the number of digital pins and analog in pins, as well as almost
    three times the number of PWM pins. This, along with the many times multiplied
    flash storage, SRAM, and EEPROM allows for projects that require more instructions.
    There is space for greater complexity and specificity in this Arduino board.


    - Price: $45.95

    - Flash Memory: 256kB

    - SRAM: 8kB

    - EEPROM: 4kB

    - Processing Speed: 16MHz

    - Digital Pins: 54 pins

    - PWM Pins: 15 pins

    - Analog In: 16 pins

    - Operating Power: 5V

    - Input Power: 7-12V

    - UART: 4 lines


    ### Zero


    This is an extension of the `Arduino Uno` technologies that were developed. It
    is a 32-bit extension of `Uno`, and it increases performance with a vastly increased
    processing speed, 16 times the amount of SRAM and a many times multiplied flash
    memory. You will pay for the extensions, at almost twice the price of the `Uno`,
    but you much more than double your capabilities with this hardware.


    One other advantage of the `Zero` is that it has a built-in feature called `Atmel’s
    Embedded Debugger`, abbreviated as `EDBG`, which helps you debug your code without
    using extra hardware and increases your efficiency in the software coding.


    - Price: $42.90

    - Flash Memory: 256kB

    - SRAM: 32kB

    - EEPROM: n/a

    - Processing Speed: 48MHz

    - Digital Pins: 14 pins

    - PWM Pins: 10 pins

    - Analog In: 6 pins

    - Analog Out: 1 pin

    - Operating Power: 3.3V

    - Input Power: 7-12V

    - UART: 2 lines

    - USB port: 2 micro-USB ports


    ### Due


    This is a novelty in the microcontroller board world because it is built on a
    32-bit `ARM core microcontroller`, giving it a great deal of power and functionality.
    It has an extremely quick processor and 4 `UART`s, giving it a lot of flexibility
    and availability to perform multiple functions. It is used for larger scale Arduino
    projects, and while it might not be your first board, you would do well to consider
    it for any bigger projects you have down the line.


    - Price: $37.40

    - Flash Memory: 512kB

    - SRAM: 96kB

    - EEPROM: n/a

    - Processing Speed: 84MHz

    - Digital Pins: 54 pins

    - PWM Pins: 12 pins

    - Analog In: 12 pins

    - Analog Out: 2 pins

    - Operating Power: 3.3V

    - Input Power: 7-12V

    - UART: 4 lines

    - USB ports: 2 micro-USB ports


    ### Mega ADK

