    Deer\"}; // 对象\n```\n\n当你将字符串和数字相加时，JavaScript 将数字视为字符串。\n\n```javascript\nx =\
    \ \"15\" + \"Ford\";\n```\n\n还有这个：\n\n```javascript\nx = \"Ford\" + 15;\n```\n\
    \n### 动态类型\n\n动态类型是 JavaScript 的大部分。这意味着一个变量可以持有不同的数据类型。例如：\n\n```javascript\n\
    var x; // undefined\nvar x = 6; // 数字\nvar x = \"Jane\"; // 字符串\n```\n\n### 字符串\n\
    \n字符串是一系列字符，例如“Jane Deer”。所有字符串都用双引号或单引号包裹——请注意，你不能混合使用，例如，用单引号开启字符串而用双引号结束。\n\
    \n```javascript\nvar carName = \"Ford80\"; // 使用双引号\nvar carName = 'Ford80'; //\
    \ 使用单引号\n```\n\n你还应该记住，只要引号与包裹字符串的引号不同，就可以在字符串中使用：\n\n```javascript\nvar answer\
    \ = \"It's ok\"; // 双引号内使用单引号\nvar answer = \"He is called 'Billy'\"; // 双引号内使用单引号\n\
    var answer = 'He is called \"Billy\"'; // 单引号内使用双引号\n```\n\n### 数字\n\nJavaScript\
    \ 只包含一种数字类型，数字可以或不包含小数，例如：\n\n```javascript\nvar x1 = 56.00; // 带有小数\n```\n"
