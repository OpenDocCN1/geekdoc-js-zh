    Arduino 定义了数百种通信协议，并将它们实现数据交换。每种协议都将被归分为两类之一：串行或并行。


    ## 并行通信


    外设设备与 Arduino 之间的并行连接通过输入和输出端口建立，因此距离仅为几米。但在某些情况下，需要在两台设备之间建立较远距离的通信，这时你将无法使用并行连接。并行接口会同时移动一组比特位。它们通常需要一个通过标记为八和十六的电线传输的数据总线。数据传输量将是巨大的。


    ![描述: 并行通信](img/00015.jpeg)


    ### 优缺点


    虽然并行通信具有其优势，例如它速度更快、更直观，并且更容易实现。然而，它需要大量的输入输出线和端口。如果你发现需要将项目从 `Uno` 面板迁移到 `Mega`
    板板，你将必须了解微处理器上的输入输出线，并且你会意识到这些线并不多。因此，你会发现自己更喜欢使用串行通信，这意味着你正在为了引脚空间而牺牲了潜在的速度。


    ## 串行通信


    在今天你使用的多数面板中，都有内置的几种用于串行通信的系统。使用的系统取决于以下因素：


    1. 你是否需要能够同时发送和接收数据？

    2. 微控制器与多少台设备交换数据？

    3. 设备之间的空间有多大？

    4. 数据传输需要多快？


    每当你使用串行通信时，建立协议是至关重要的。必须严格遵守该协议。应用这套规则是为了让设备知道如何解释正在交换的数据。幸运的是，Arduino 会自动处理这些，以便用户处理处理的是清晰的数据。


    ### 串行通信的类型


    1. **异步**：异步设备具有自己的时钟，该时钟由上一个状态的输出触发。

    2. **同步**：对于与另一个设备同步的设备，它将使用相同的时钟，定时将相互同步。


    发现你正在使用的设备是否同步很容易的。如果给所有连接的设备提供相同的时钟，那么它们就是同步的。然而，如果没有时钟线，它就是异步的。


    例如，`UART` – 通用异步收发器模块将是异步的。


    异步协议内置了若干条规则。这些规则无非是为了确保数据传输稳健且无错误的机制。这些机制是：


    1. `波特率`

    2. `同步位`

    3. `校验位`

    4. `数据位`


    ### 同步位


    同步位是两个或三个特殊的比特，它们会随着每个数据包一起传输。它们是被指定用于开始和停止发送数据包的比特。正如其名称所示，这些比特将标记一个数据包的开始和结束。


    总会有一个起始位，但可以相互配置多个停止位。


    你的起始位始终由一条空闲数据线指示，该线从一变为零，而停止位将转换到空闲状态并将线路保持在一。


    ![描述: 同步位](img/00016.jpeg)


    ### 数据位


    每个数据包中数据的大小可以设置为五到九位。标准尺寸是八位；然而，其他位尺寸也有其用途。例如，如果你传输七位 ASCII 字符，七位数据包会比八位包更高效。


    ### 校验位


    你可以选择是否有校验位，如果决定有，那么校验位将是奇或或偶。如果数据位内部“1”的数字表示为偶数，则校验位为 0，那么奇校验将标记为相反。


    ### 波特率


    此功能用于表示每秒传输的比特的数字表示。请记住，这指的是比特而不是字节。协议通常要求每个字节在传输时带有几个控制位。这意味着对于每一个字节，将有 11 个比特。


    ### Uart


    一旦将 `sketch` 上传到 Arduino，你就必须打开位于 IDE 右上角的串口监视器。


    你可以在串口监视器顶部的框中输入任何你想输入的内容并按发送。这将向你正在使用的 Arduino 面板发送一系列字节。


    代码将返回收到的任何内容作为输入。


    ## 第 14 章：Arduino 克隆版和类似板板


    ### 微控制器/主芯片


    这是 Arduino 板板的大脑。这是被编程的部分。它负责运行代码，因此可以被视为板板的 `CPU`（中央处理单元）。


    这个芯片有一些引脚，通常插在插座上。然而，它们不被称为“腿”，而是“引脚”（pins）。


    ### 电源接口和供应


    有两种方式可以为 Arduino 板板供电。这是供电的部分。你可以选择使用 `USB` 连接器与计算机建立连接，或者选择将其插入电源适配器。`USB` 可用于供电和编程。`DC`
    仅用于板板供电，如果你需要长期连接板板，它是最好的。


    ### USB 接口和界面


    `USB 接口` 是帮助你将板板连接到计算机的电缆。只要计算机有 `USB 端口`，你就可以任何计算机。


    在使用 `USB` 线连接时，某些处理器可能会失效。在这种情况下，你将使用串口接口。


    ### LED


    Arduino 带有一些灯，你可以从中推断它正在做什么。这些灯被称为 LED。Arduino 板板带有 4 个 LED，分别是 `L`、`RX`、`TX`
    和 `ON`。


    '
- fmt: '

    This is the main part of the Arduino board. These are the two lines of sockets
    that line up with edges of the circuit board. The thin sockets will allow you
    to plugin some wires into them. The wires can, in turn, be connected to any types
    of electronic parts including sensors, LEDs, displays, motors etc.


    ## USB Fuse

    The little `USB fuse` protects the computer and the Arduino. There are high chances
    that all types of wires will be connected to the Arduino, which may cause an accidental
    short on the wires. The importance of this `fuse` comes during this time. It is
    resettable, and in such occurrence, it will just open up in the same way a fuse
    or circuit breaker works. This will protect your board from damage.


    ## Reset Button

    This button is located next to the USB jack. However, on some other boards, you
    may find it on the right side. It is the button that can be used for restarting
    the Arduino. Restarting the board will only take a second, and it is done if it
    gets stuck or if you need to re-run some program.


    ## Power up Test

    We are now ready to power on our Arduino board. You can simply do this by connecting
    one end of your USB cable to the Arduino board and the other one to your computer.
    The computer will act as the source of power for the Arduino.


    If you are using Arduino UNO, then the USB cable should have its end as square
    B-type. The USB cable should be plugged directly to the computer port. After you
    are sure that you are able to power the Arduino then upload the sketches, you
    will be set. You can then plug it to the other ports. For you to know whether
    the power source is working correctly, just check on whether the `ON LED` is lit
    green. The `L` or yellow `LED` may also blink or light up, which the same case
    with the `RX` and `TX LEDs`.


    # Chapter 15: Troubleshooting


    ### Arduino Board Testing

    In the process of circuit building, there will come a time when nothing will be
    working. This moment will call for a process of troubleshooting and debugging
    in order to identify and solve the problems with your experiment.


    Key points to a successful troubleshooting:

    - **Understanding**: Always ensure that you properly understand all the components
    used in your experiment. Clearly mark out the power flow all these components
    are connected with one another.

    - **Simplification and Segmentation**: This is more like divide and rule tactic
    where you break down the project and figure out the problem with each and every
    component.

    - **Exclusion and Certainty**: This involves investing each part separately and
    being sure of their functionality. Through this you will be able to ascertain
    the problem with each component.


    Board testing therefore involves “Blinking an LED”, if it does not work, check
    on the `USB connection` and other more options explored below.


    ### Breadboard Circuit Testing

    Run a short circuit test by connecting your Arduino board to the breadboard. If
    the `PWR LED` turns OFF then there is a serious short circuit connection on your
    board. Quickly begin segmentation and simplification to find the wrong connection.


    ### Problem Identification

    Some of the common problems with Arduino programming are listed below:

    - **Arduino IDE not launching**: Use the `run.bat` files as alternative option.

    - **Windows Operating System assigning a COM port which is greater to Arduino**:
    Solve this by convincing windows to assign a lower `COM port`. For other versions
    of Windows, follow the procedures described earlier in this book about `Port Identification`.


    ### Problem Isolation and Solving

    This option provides for you to reproduce a problem. When your circuit exhibits
    some problems, find out the exact place and place (component) associated with
    that particular problem. This will help you to correctly describe a problem and
    possibly suggest a solution.


    ### Online Help

    In case the above suggestions do no work, you are welcomed to seek online help
    on the Arduino website: `www.Arduino.cc/en/Guide`. While seeking online help,
    be sure to specify the following parameters:

