  trans: "\n\n上拉电阻用于在没有输入可用时将输入引脚引导到特定状态。我们可以通过在输入引脚上添加上拉电阻（连接到 `+5V`）或下拉电阻来实现这一点。你可以使用一个\
    \ `10K` 电阻作为上拉电阻或下拉电阻。\n\n`Atmega` 芯片拥有 20,000 个上拉电阻，并且所有电阻都可以通过软件访问。要访问这些内置上拉电阻，我们将\
    \ `pinMode()` 设置为 `INPUT_PULLUP`。这将反转输入模式的行为。`HIGH` 值表示传感器开启**ON**），而 `LOW` 值表示传感器关闭**OFF**）。上拉电阻的值取决于所使用的微控制器类型。在大多数基于\
    \ AVR 的开发板上，该值介于 `20kΩ` 到 `50kΩ` 之间。在 `Arduino Due` 上，该值介于 `50kΩ` 到 `150kΩ` 之间。具体值可以在开发板上微控制器的数据表中查到。\n\
    \n当你将传感器连接到配置为 `INPUT_PULLUP` 的引脚时，你应该将另一端连接到地（ground）。如果引脚是简单的，这将导致引脚在开关打开时读取为\
    \ `HIGH`，在按下引脚时读取为 `LOW`。上拉电阻可以提供足够的电流，使连接到配置为输入引脚的 LED 弱发光。如果你看到 LED 在工作但光线很暗，这可能就是原因。\n\
    \n下面的示例演示了这一点：\n\n```\npinMode(3,INPUT)  ;//将引脚设置为输入模式，不使用内置上拉电阻\npinMode(5,INPUT_PULLUP)\
    \  ;//使用内置上拉电阻将引脚设置为输入模式\n```\n\n## 输出引脚 (Output Pins)\n\n使用 `pinMode()` 函数配置为\
    \ `OUTPUT` 的引脚被称为处于低阻抗状态。此类引脚能够向其他电路提供大量的电流。\n\n当你尝试从输出引脚运行大电流设备时，可能会损坏引脚中的输出晶体管，或损坏整个\
    \ `Atmega` 芯片。在大多数情况下，这会导致微控制器上的某个引脚失效，但芯片的其他部分将正常工作。\n\n## `pinMode()` 函数\n\n\
    我们使用此函数将特定引脚配置为输入引脚或输出引脚。如果你需要启用内部上拉电阻，可以使用 `INPUT_PULLUP` 模式使用此函数。当你使用 `INPUT`\
    \ 模式时，它将禁用内部上拉电阻。\n\n`pinMode()` 函数采用如下语法：\n\n```\nVoid setup ()  {\n  pinMode\
    \ (pin, mode);\n}\n```\n\n该函数接受如上面所示的两个参数。第一个参数是引脚，即你需要设置或修改其模式的引脚编号。模式是你想要将引脚设置的状态，它可以是\
    \ `INPUT`、`OUTPUT` 或 `INPUT_PULLUP`。\n\n考虑下面给出的示例：\n\n```\nint btn =  5  ;//连接到引脚\
    \ 5 的按钮\nint LED =  6;//连接到引脚 6 的 LED\n\nvoid setup ()  {\n  pinMode(btn , INPUT_PULLUP);\
    \ //将数字引脚设置为带上拉电阻的输入模式\n  pinMode(btn , OUTPUT);  //将数字引脚设置为输出\n}\n\nvoid loop\
    \ ()  {\n  if  (digitalRead(btn )  == LOW){//如果按钮被按下\n      digitalWrite(LED,HIGH);\
    \ //开启 LED\n      delay(500); //延迟 500 毫秒\n      digitalWrite(LED,LOW); //关闭 LED\n\
    \      delay(500); //延迟 500 毫秒\n  }\n}\n```\n\n我们创建了两个变量 `btn` 和 `LED`。它们分别表示连接到引脚\
    \ 5 的按钮和连接到引脚 6 的 LED。在 `setup()` 函数内部，数字引脚被设置为带上拉电阻的输入模式。该数字引脚也被设置为输出。\n\n程序（sketch）的逻辑随后在\
    \ `loop()` 函数中实现。当按钮被按下时，LED 将开启并在指定状态延迟 500 毫秒。然后 LED 将关闭并在该状态延迟 500 毫秒。\n\n\
    ## `digitalWrite()` 函数\n\n当我们需要向数字引脚写入 `HIGH` 或 `LOW` 值时，使用此函数。如果引脚已通过 `pinMode()`\
    \ 函数配置为 `OUTPUT`，则它将被分配相应的电压值（在 3.3V 板卡上，`HIGH` 为 `5V` 或 `3.3V`，`LOW` 为 `0V`，即地）。\n\
    \n如果 `pinMode()` 函数未设置为 `OUTPUT`，但 LED 连接到了引脚，调用 `digitalWrite(HIGH)` 可能会导致 LED\
    \ 变暗。如果你不显式设置 `pinMode()`，`digitalWrite()` 函数将启用内部上拉电阻，它将像一个阻碍电流流动的大电阻。\n\n`digitalWrite()`\
    \ 函数采用以下语法：\n\n```\nVoid loop()  {\n  digitalWrite (pin ,value);\n}\n```\n\n该函数接受如上面所示的两个参数\
    \ `pin` 和 `value`。`pin` 表示你需要设置其模式的引脚编号。`value` 参数可以取 `HIGH` 或 `LOW` 值。\n\n考虑下面的示例演示了如何使用\
    \ `digitalWrite()` 函数：\n\n```\nint LED =  6;//连接到引脚 6 的 LED\nvoid setup ()  {\n\
    \  pinMode(LED, OUTPUT);\n}\n\nvoid loop ()  {\n  digitalWrite(LED,HIGH); //开启\
    \ LED\n  delay(500); //延迟 500 毫秒\n  digitalWrite(LED,LOW); //关闭 LED\n  delay(500);\
    \ //延迟 500 毫秒\n}\n```\n\n我们创建了一个变量 `LED` 来表示连接到引脚 6 的 LED。在 `setup()` 函数中，该引脚被设置为输出。在\
    \ `loop()` 函数中，我们使用 `digitalWrite()` 函数来开启关闭 LED。\n\n## `analogRead()` 函数\n\n\
    `analogRead()` 函数报告应用在模拟引脚上的电压。Arduino 的下部有六个标记为 `Analog In` 的引脚。这些引脚能够检测电压。该函数始终返回\
    \ `0` 到 `1023` 之间的值，这代表 `0` 到 `5V` 之间的电压。例如，如果引脚 `0` 应用了 `2.5V`，`analogRead(0)`\
    \ 将读取值为 `512`。\n\n```\nint analogPin =  3;//连接到模拟引脚 3 的电位器调节\nint x =  0; //存储读取值的变量\n\
    \nvoid setup()  {\n  Serial.begin(9600); // 初始化串口\n} \n\nvoid loop()  {\n  x =\
    \ analogRead(analogPin); // 读取输入引脚\n  Serial.println(x); // 打印值\n}\n```\n\n我们首先创建了一个变量\
    \ `analogPin` 并将其赋值为 `3`。该变量表示连接到模拟引脚 3 的电位器调节。我们还创建了第二个变量 `x` 并赋值为 `0`。我们将使用该变量来存储从引脚读取的值。在\
    \ `loop()` 函数中，我们调用了 `analogRead()` 函数并将 `analogPin` 作为参数传递给。\n\n## `analogReference()`\
    \ 函数\n\n此函数配置模拟输入的参考电压，即用作输入范围上限的值。该函数可以接受以下任何选项：\n\n- `DEFAULT` – 这是 5V Arduino\
    \ 板卡上的 5 伏特默认模拟参考，或 3.3V Arduino 板卡上的 3.3 伏特默认模拟参考。\n\n"
- fmt: "\n`INTERNAL` – This is a built-in reference, which is equal to 1.1 volts on\
    \ `ATmega168` or the `ATmega328` and 2.56 volts on `ATmega8`. It is not available\
    \ on the Arduino Mega.\n\n`INTERNAL1V1` – This is a built-in 1.1V reference. It\
    \ is available on Arduino Mega only.\n\n`INTERNAL2V56` – This is a built-in 2.56V\
    \ reference. It is available on Arduino Mega only.\n\n`EXTERNAL` – This is the\
    \ voltage applied to the `AREF` pin, that is, 0 to 5V only, and it is used as\
    \ the reference.\n\nThe function takes the following syntax:\n\n`analogReference\
    \ (type);`\n\nThe parameter `type` can be any of the options discussed above.\n\
    \nAvoid using anything that is less than 0V or above 5V for external reference\
    \ voltage on the `AREF` pin. In case you are using an external reference on the\
    \ `AREF` pin, you should set the analog reference to `EXTERNAL` before you can\
    \ call the `analogRead()` function. If you don’t do this, you will short the active\
    \ reference voltage, which is generated internally, and the `AREF` pin, which\
    \ may damage the microcontroller on your Arduino board.\n\nYou can also connect\
    \ the external reference voltage to the `AREF` pin via a 5K resistor, which will\
    \ allow you to switch between the internal and external reference voltages. The\
    \ resistor will change the voltage that has been used as the reference since the\
    \ `AREF` pin has an internal 32K resistor. The two will act as a voltage divider.\n\
    \nThe following example demonstrates how to use the `analogReference()` function:\n\
    \n```cpp\nint analogPin =  3;// a potentiometer wiper connected to analog pin\
    \ 3\n\nint x =  0;  // a variable for storing the read value\n\nvoid setup() \
    \ {\n  Serial.begin(9600);  // to setup serial\n  analogReference(EXTERNAL); \
    \ // voltage applied to AREF pin\n // is used as the reference.\n}\n\nvoid loop()\
    \  {\nx = analogRead(analogPin);  // to read the input pin\n  Serial.println(x);\
    \  // to print the value\n}\n```\n\nWe began by creating a variable named `analogPin`\
    \ and assigning it a value of 3. This variable denotes a potentiometer wiper that\
    \ has been connected to the analog pin number 3. We have also created a second\
    \ variable, `x`, and assigned it a value of 0. We will use this variable to store\
    \ the value that has been read from the pin, which is the voltage applied to the\
    \ pin.\n\nConsider the following line extracted from the code:\n\n`analogReference(EXTERNAL);`\n\
    \nThis line simply means that the voltage that is applied to the `AREF` pin, which\
    \ ranges between 0 and 5V, will be used as the reference.\n\nIn the `loop()` function,\
    \ we have called the `analogRead()` function and passed the value `analogPin`\
    \ to it as the parameter. This will read the value of the voltage on the analog\
    \ pin number 3 and store the read value in the variable `x`. We have then printed\
    \ out this value.\n\n### Character Functions\n\nWe enter data into a computer\
    \ in the form of characters. The characters can be letters, digits and other special\
    \ symbols.\n\nThe library for handling characters comes with a number of functions\
    \ that we can use to test and manipulate characters of data. Every function receives\
    \ data in the form of `int`, or `EOF` as an argument. This means that the characters\
    \ are manipulated as integers.\n\nThe `EOF` usually has a value of -1 and some\
    \ hardware architectures don’t allow for the storage of negative values as `char`\
    \ variables. This means that the functions for handling characters manipulate\
    \ them as strings.\n\nAnytime we need to use the functions for handling characters,\
    \ we should add the `<cctype>` header to the program. The following the different\
    \ functions provided by the character-handling library:\n\nThe `isdigit` function\
    \ checks whether its argument is a digit or not. The `isalpha` function determines\
    \ whether the argument passed to it is an uppercase letter, that is, A-Z, or lowercase\
    \ letter, that is, a-z. The `isalnum` function checks whether the argument passed\
    \ to it is an uppercase letter, a lowercase letter or a digit. The `isxdigit`\
    \ function checks whether the argument passed to it is a hexadecimal digit, that\
    \ is, A-F, a-f or 0-9.\n\nThe conditional operator `(:?)` can be used with every\
    \ function to determine whether the string “ is a” or “ is not a” should be printed\
    \ in the output of every character that has been tested.\n\nWe now need to create\
    \ an example that demonstrates how to use the `isupper` and the `islower` functions.\
    \ We use the `isupper` function to check whether the argument passed to it is\
    \ uppercase, that is, A-Z. We use the `islower` function to check whether the\
    \ argument passed to it is lower, that is, a-z.\n\nThe code will return the following\
    \ when executed:\n\nThe `islower` function returns:\nm is a lowercase letter\n\
    M is not a lowercase letter\n6 is not a lowercase letter\n! is not a lowercase\
    \ letter\n\nThe `isupper` function returns:\nD is an uppercase letter\nd is not\
    \ an uppercase letter\n9 is not an uppercase letter\n$ is not an uppercase letter\n\
    \nWe now need to create an example that demonstrates the use of `isdigit`, `isalpha`,\
    \ `isalnum` and `isxdigit` functions. The `isdigit` function helps us check whether\
    \ the argument passed to it is a digit, that is, 0-9. The `isalpha` function helps\
    \ us check whether the argument passed to it is an uppercase letter, that is,\
    \ A-Z, or a lowercase letter, that is, a-z. The `isalnum` function determines\
    \ whether the argument passed to it is an uppercase letter, a lowercase letter\
    \ or a digit. The `isxdigit` function checks whether the argument passed to it\
    \ is a hexadecimal digit, that is, A-F, a-f or 0-9.\n\n### Conditional Operator\n\
    \nThe conditional operator `(:?)` can be used with every function to determine\
    \ whether the string “ is a” or “ is not a” should be printed in the output of\
    \ every character that has been tested.\n\nWe now need to create an example that\
    \ demonstrates how to use the `isupper` and the `islower` functions. The `islower`\
    \ function checks whether the argument passed to it is a lowercase letter, that\
    \ is, a-z. The `isupper` function checks whether the argument passed to it is\
    \ uppercase, that is, A-Z.\n\n### Chapter 12: Computer interfacing with Arduino\n\
    \nThe FTDI Chips; Example of Temperature sensors with serial\n\nBefore you begin\
    \ to program your Arduino, you will need to understand the basic sketch of a microcontroller.\
    \ A sketch is the term used to describe an Arduino program. It is the code uploaded\
    \ to an Arduino board, where it then runs to allow the microcontroller to perform\
    \ specific functions. Now that you know what a sketch is, you should be able to\
    \ comprehend how they work with Arduino commands. The most basic commands of Arduino\
    \ involve the digital and analog pins. We will discuss these in this chapter.\n\
    \n#### Basic Commands\n\nThe basic Arduino commands include `BareMinimum`, `Fade`,\
    \ `Blink`, `ReadAnalogVoltage`, `AnalogReadSerial`, and `DigitalReadSerial`.\n\
    \n- `BareMinimum`: The least amount of coding needed to run an Arduino sketch.\
    \ Two command lines are used with this. `void setup()` and `void loop()`. The\
    \ setup function runs once each time the board is started and once when the board\
    \ is reset. The loop function is used to allow your program to respond and change\
    \ to your commands.\n- `Fade`: This command is used with an analog output to fade\
    \ an LED light on your Arduino board.\n- `Blink`: The blink command will make\
    \ an LED turn on and off.\n- `ReadAnalogVoltage`: This command will allow the\
    \ microcontroller to read an analog input, before printing the voltage onto the\
    \ serial monitor of the Arduino.\n- `AnalogReadSerial`: This command is responsible\
    \ for reading a potentiometer. It can then print the state of the potentiometer\
    \ to a serial monitor.\n- `DigitalReadSerial`: This command will read the digital\
    \ input and print the state to the serial monitor.\n"
