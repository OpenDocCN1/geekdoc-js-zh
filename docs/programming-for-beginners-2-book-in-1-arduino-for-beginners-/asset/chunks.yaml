    One conductor is going to be used to receive data, another will be used to send
    information, one is going to synchronize, and the other will choose which device
    it will communicate with. For this to function, it will mean it is set up as the
    connections full duplex. This means the data can be simultaneously received and
    sent. The largest baud rate can be far greater than the communication system housing
    the `i2c`.


    ## Panel SPI Pin


    The `SPI` is going to use four wires.


    1. `SS`: this will be the slave selection wire.

    2. `SCK`: this will be the serial clock driven by the master.

    3. `MISO`: the master input and the slave result. which is going to be powered
    by the mater.

    4. `MOSI`: the mast output and slave input driven by the master.


    Some of the functions that you are going to use will have to include the `SPI`.


    `SPI set clock divider(divider)`: this will set up the `SPI` clock divider which
    means that it is going to be relative to the system clock. With the `AVR` base
    panels, the divider is going to be available with two, four, eight, sixteen, thirty-two,
    sixty-four, and one hundred and twenty-eight. Your default setting will be `SPI
    CLOCK DIV 4` which is going to set up the `SPI` clock to a quarter of the frequencies
    of the system’s clock.


    1. `Divider`: this is going to be (`SPI CLOCK DIV 2`, `SPI CLOCK DIV 4`, etc.)

    2. `SPI transfer(Val)`: the `SPI` is going to be assigned based on the sending
    and receiving that will occur at the same time. The data that is obtained will
    be returned in a standard `Val` form.

    3. `SPI begin transaction(SPI setting(speed maximum, data order, data mode))`
    the top speed is going to be clocked with data order (`MSBFIRST` or `LSBFIRST`).


    There are going to be four modes of operation that the `SPI` is going to follow:


    1. `Mode 0` (default): the clock is naturally going to be low, and the data that
    is obtained from the transition can be visualized when the data itself goes from
    the bottom end of the spectrum to higher levels. This will be what is known as
    the leading edge.

    2. `Mode 1`: this is going to be considered the trailing edge whenever the data
    is going from high to low.

    3. `Mode 2`: this is also going to be the leading edge when your data goes from
    high to low.

    4. `Mode 3`: the data here also goes from the low end of the spectrum to the high.
    In this instance, it is known in the industry as the trailing edge.

    5. `SPI attach interrupt(handler)`: the function is going to be summoned as the
    slave device gets its data from the master.


    At this point in time, you are going to connect two `Uno` panels together with
    one being the slave and the other being the master.


    - Pin ten will be `SS`

    - Pin eleven will be `MOSI`

    - Pin twelve will be `MISO`

    - Pin thirteen will be `SCK`


    The ground is going to be common, and in the following image, you are going to
    see the connection that is going to occur between both panels.


    ![Description: Connection of Boards](images/00014.jpeg)


    ## Advanced Strategies for Arduino


    ### Speeding Up the Input and Output Access


    On each `AVR Arduino` panel, the clock speed is going to be sixteen MHz. Every
    instruction that is located on the controller is going to be completed in under
    four cycles; therefore, you are going to be able to do four million instructions
    in a single second. But, the input-output speed is going to be a lot slower. This
    happens due to the `digital write` and `digital read` functions. Each time that
    a function is executed, there is going to be extra code that has to be executed
    as well. The additional code is going to end up being responsible for detecting
    and mapping out the digital pins to the output port. On every microcontroller,
    the input-output device will be allocated in a group of eight pins to a port which
    is going to be specially registered to the controller.


    Therefore, the next question is going to be, how slow is it? You will figure this
    out by using this code.


    You will be able to improve the program by wrapping the `loop` code into an infinite
    loop. This is going to speed up the execution since the CPU is going to be doing
    less of a function call. This should speed up your input and output so that it
    is up to ten percent faster. If you want to top the output speed, you are going
    to have to use a low-level access port and to do that, you are going to have to
    learn how to use the microcontroller; however, it is going to take away from the
    beauty of the Arduino machine. However, there is going to be a library that you
    can use to increase the input and output access.


    Keep in mind that there are going to be limitations because it is mainly going
    to support the `Leonardo`, `Mega`, `Uno`, `Nana`, and `Attiny` models. This is
    going to provide an inline function for faster input-output access.


    ### Analog Readings


    Analog readings on a USB powered Arduino model is going to give you some unexpected
    results. This happens because the analog reference voltage will be tied to the
    logic voltage which is typically going to be five volts, however, if you are powering
    your panel from a switch power supply or from the `USB` you are going to be dealing
    with commotion and voltage drops because of the `USB` cable. This is possible
    as long as your controller is running at four point five instead of five volts.


    It is not going to be ideal when it comes to precision measurements. To do the
    proper measurements, you are going to have to use an external precision voltage
    reference. On the other hand, you can use the voltage reference that is built
    into the chip to measure the current `VCC` and do the calculations that have to
    be done.


    ### Getting Free RAM


    In this section, you are going to learn how to get the free RAM returned in bytes.


    ### Using the Const, Program and Global Variables


    In the event that you are having to store a large amount of data in the code that
    you are using, then you are going to need to make a global `const` and include
    the program statement. This is going to tell the program''s compiler to store
    the data in the program memory instead of on the RAM.


    ### Forgetting the Default IDE


    While the IDE that comes with Arduino is great, it is not going to be suitable
    for use with professional software development. If you are using it, you are going
    to realize that it is going to become a pain to use once you have written a program
    that has more than a few hundred lines.


    So, to bypass this, you will use the `Atmel Studio` or the `Visual Studio` that
    comes with the `Visual Micro` plugin. This plugin is going to have a debugger,
    but it is vital that you know that it is not free, it is going to cost seventeen
    dollars.


    You can also use a text editor so that you can write out your programs. However,
    with Arduino one point five, the IDE is going to support the building and uploading
    of your program through the command line.


    ```

    Arduino --panel (panel type description) --port (serial port) --upload (sketch
    path)

    Arduino --panel (panel type description) --port (serial port) --verify (sketch
    path)

    ```


    You will need to have a panel type description as well.


    ```

    package:arch:panel[:parameters]

    ```


    You are going to be able to find out more about the command line through the manual
    documents for Arduino IDE.


    ### Inlining Small Functions


    There is a manual that says that the inline function is as fast as a macro. But,
    there is a catch. If you make an inline function, it is going to make your code
    size larger; especially if you call the function in several places.


    ## Chapter 11: Arduino function libraries


    I/O Function; advanced I/O function; etc.


    ### Functions in Arduino


    The Arduino board comes with a number of pins. These pins can be configured to
    act as either inputs or outputs. It will be good for you to note that most of
    the Arduino analog pins can be programmed and used in the same way as the digital
    pins.


    #### INPUT Pins


    Pull-up Resistors

