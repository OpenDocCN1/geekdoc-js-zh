    \ the argument passed to it is uppercase, that is, A-Z.\n\nChapter 12: Computer\
    \ interfacing with an Arduino\n\nThe FTDI Chips; Example of Temperature sensors\
    \ with serial interface\n\nBefore you begin to program your Arduino, you will\
    \ need to understand the basic sketch of a microcontroller. A sketch is the term\
    \ used to describe an Arduino program. It is the code uploaded to an Arduino board,\
    \ where it then runs to allow the microcontroller to perform specific functions.\
    \ Now that you know what a sketch is, you should be able to comprehend how they\
    \ work with Arduino commands. The most basic commands of Arduino involve the digital\
    \ and analog pins. We will discuss these in this chapter. However, remember that\
    \ these are only a small amount of the commands that you can complete using the\
    \ Arduino board. These commands are used in conjunction with input and output\
    \ values to write codes. Arduino codes can be long and complex. Many of them are\
    \ found in the Arduino library. The flexibility of the program even allows you\
    \ to write your own coding in the event that you cannot find coding to make your\
    \ project perform the function that you want it to.\n\nBasic Commands\n\nThe basic\
    \ Arduino commands include BareMinimum, Fade, Blink, ReadAnalogVoltage, AnalogReadSerial,\
    \ and DigitalReadSerial.\n\nBareMinimum: The least amount of coding needed to\
    \ run an Arduino sketch. Two command lines are used with this. Void setup( ) and\
    \ void loop ( ). The setup function runs once each time the board is started and\
    \ once when the board is reset. The loop function is used to allow your program\
    \ to respond and change to your commands. \n\nFade: This command is used with\
    \ an analog output to fade an LED light on your Arduino board.\n\nBlink: The blink\
    \ command will make an LED turn on and off.\n\nReadAnalogVoltage: This command\
    \ will allow the microcontroller to read an analog input, before printing the\
    \ voltage onto the serial monitor of the Arduino.\n\nAnalogReadSerial: This command\
    \ is responsible for reading a potentiometer. It can then print the state of the\
    \ potentiometer to a serial monitor."
