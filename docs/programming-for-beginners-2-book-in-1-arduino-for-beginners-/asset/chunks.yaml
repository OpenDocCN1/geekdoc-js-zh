  raw: '*   If you won’t include a label in your continue statement, it will terminate
    the current process of the innermost loop and continue the next one. Unlike a
    break statement, a continue statement cannot terminate an entire loop. If used
    on “while” loops, the control flow will return to the assigned condition. If used
    on a “for” loop, on the other hand, the control flow will go back to the increment
    expression.


    *   If you’ll include a label in your continue statement, it will only affect
    the statement linked to that label.


    The syntax of a continue statement has two forms, which are:


    ![Description: 00031.jpeg](images/00040.jpeg) Other Control Structures


    The flow control structures that have been seen (if, else, for) and the sentences
    that modify their behavior (break, continue) are not sufficient to perform some
    complex tasks and other types of repetitions. For this reason, JavaScript provides
    other flow control structures that are different and in some cases more efficient.
    While Structure The while structure allows you to create loops that run no more
    or more times, depending on the condition indicated. Its formal definition is:
    while (condition) {... }


    The operation of the while loop is summarized in: "While the indicated condition
    is fulfilled, repeat the instructions included within the loop indefinitely".
    If the condition is not met even the first time, the loop is not executed. If
    the condition is met, the instructions are executed once and the condition is
    checked again. If the condition is still fulfilled, the loop is executed again
    and so it continues until the condition is not met. Obviously, the variables that
    control the condition must be modified within the loop itself, since otherwise,
    the condition would always be met and the while loop would be repeated indefinately


    Structure do ... while


    The loop of type do ... while is very similar to the while loop, except that in
    this case the instructions of the loop are always executed at least the first
    time. Its formal definition is: do { ... } while (condition); In this way, as
    the condition is checked after each repetition, the loop instructions are always
    executed the first time. It is important not to forget that after the while ()
    the character must be added; (contrary to what happens with the simple while loop).
    Using this loop you can easily calculate the factorial of a number: var result
    = 1; var number = 5; do { result * = number; // result = result * number number--;
    } while (number > 0); alert (result); In the previous code, the result is multiplied
    in each repetition by the value of the variable number. In addition, in each repetition,
    the value of this variable number is decremented. The condition of the do ...
    while loop is that the number value is greater than 0 since the factorial of a
    number multiplies all numbers less than or equal to itself, but up to number 1
    (the factorial of 5, for example, is 5 x 4 x 3 x 2 x 1 = 120). As in each repetition,
    the value of the variable number is decremented and the condition is that number
    is greater than zero, in the repetition in which number is worth 0, the condition
    is no longer fulfilled and the program leaves the do loop ... while. Switch Structure
    The if ... else structure can be used to perform multiple checks and make complex
    decisions. However, if all conditions always depend on the same variable, the
    resulting JavaScript code is too redundant: if (number = = 5) {...} else if (number
    = = 8) {...} else if ( number = = 20) {... } else {... }


    In these cases, the switch structure is the most efficient, since it is specially
    designed to easily handle multiple conditions on the same variable. Its formal
    definition may seem complex, although its use is very simple. The switch structure
    is defined by the reserved keyword switch followed, in parentheses, by the name
    of the variable to be used in the comparisons. As usual, the instructions that
    are part of the switch are enclosed in quotes {and}. Within the switch, all the
    comparisons that you want to make on the value of the variable are defined. Each
    comparison is indicated by the reserved word case followed by the value with which
    the comparison is made.


    What happens if no value of the switch variable matches the values  defined in
    the cases? In this case, the default value is used to indicate the instructions
    that are executed in the case where no case is met for the indicated variable.
    Although default is optional, switch structures usually include it to define at
    least one default value for some variable or to display a message on the screen


    Chapter 5: Data Structures: Objects & Arrays


    Introduction to Objects


    Procedural programming required programmers to spell out almost every command
    to the computer. This can quickly lead to messy code, so people thought about
    keeping certain commands and information inside what one can call an "object."
    For instance, if you wanted to create a database of pets, you’d have to do something
    like:


    | //First, we create arrays with the information we wish to savevar petName =
    ["Cat", "Spot", "Fluffy"];var petSpecies = ["Dog", "Fish", "Parrot"];var petAge
    = [5, 2, 6];var petGender = ["Male", "Female", "Male"];var petDetails = [petName,
    petSpecies, petAge, petGender]; //Then we create a function that displays themvar
    displayInformation = function(details){    for(var counter = 0; counter < petSpecies.length;
    counter++)    {    console.log("Name: "+ details[0][counter]);    console.log("Species:
    "+ details[1][counter]);    console.log("Age: "+ details[2][counter]);    console.log("Gender:
    "+ details[3][counter]);    }};displayInformation(petDetails); |


    While the code does work and provides us with a relatively neat list of information,
    the code is rather messy and can get pretty hard to debug when new functions and
    details are added. That being said, here’s a code snippet that turns the first
