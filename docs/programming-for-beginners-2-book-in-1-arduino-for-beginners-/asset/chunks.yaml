- fmt: '

    The computer makes millions of tiny computations that you can’t see every single
    second. All of these computations are performed using these ones and zeroes that
    are present at the very smallest level of the computer that you can’t see. Knowing
    this, we’ve figured out over the years that these ones and zeroes could be controlled
    and manipulated, first, through the development of languages that work with the
    processor of the computer itself (`assembly`) and, second, through the development
    of languages that serve as the connection between the complex zeroes and ones
    and the programmer.


    As computers have gotten more popular and stronger these days, people who are
    interested in programming want to learn languages that aren’t absurdly difficult
    to use and understand. As a result, over time, programming languages too have
    become much simpler as more people started programming as a hobby. The increased
    processing power of computers over the years and the standardization of an object-oriented
    paradigm have led to the development of far simpler languages.


    ## The History of JavaScript


    In order to understand `JavaScript` itself, we have to first learn it’s history.
    In the 1970s, there was a place called `Bell Labs`, a research lab owned and managed
    by `AT&T`. A lot of important technological advances originated from `Bell Labs`.
    One of the most important ones that you’ve probably heard before is the `Unix`
    system.


    `Unix` was a landmark. It was an open-source and simple operating system that
    was intuitive enough that it could easily be marketed to businesses, developers,
    and universities all in tandem with one another without encroaching on each other’s
    markets. This was spurred by the development of the `C` programming language.


    The `C` programming language itself has it’s long line of history, but essentially
    it was the first simple and intuitive language that almost anybody can figure
    out. It offers a layer of abstraction from the system itself and also offers the
    programmer the ability to scrutinize the system buildup and therefore understand
    the computer much better. This allows the programmer to directly manage things,
    such as memory allocation, or the amount of memory being used by the program in
    order to perform certain processes. In short, `C` allows programmers to better
    understand the system. However, they are expected to handle a great amount of
    difficult information and are prone to manipulate, for example, the computer’s
    processing capabilities.


    `Unix` would eventually be rewritten in `C` instead of the standard `Assembly`
    code. This is part of the reason why `C` became so famous. This was a huge deal
    because it means that any processor that can run a `C` compiler, that is, the
    program which converts human-readable programming code to `Assembly` code that
    the computer can understand can run `Unix` as well. Now, this program can be compiled
    in any system that has a `C` compiler. This made the program extremely popular
    worldwide.


    Moreover, since `C` is open source, universities often teach their students the
    language so that even if they cannot immediately compile `Unix` for their computers,
    they can at least modify the code so that they can run `Unix` on them. In addition,
    `Unix` is beneficial to `C` and vice versa because, first, `C` is being taught
    in universities to allow students to gain experience first before handling their
    `Unix` courses and, second, because `Unix` comes with a `C` compiler which makes
    it even easier for people to write and run codes on `Unix` systems.


    This may seem like an irrelevant detail, but it’s a pretty important factor in
    the overall development of `JavaScript` and is a key part in the development of
    modern programming languages in general. This is because these languages can inspire
    a ton of different languages. For example, the extremely popular languages `Java`,
    `Python`, and `C++` all have been – to one extent or another – inspired by `C`.


    `JavaScript` is no exception. However, with that context, let’s think back what
    the computing landscape was like in the late 80s and early 90s. The general population
    was slowly being introduced with computers because of the popularity of both `C`
    and `Unix`. The combined popularity and accessibility of these mean that a lot
    of applications are being built for a lot of computers, approximately exponentially
    more every year.


    However, the `Internet` was still in its infancy in many ways. Web browsers, for
    example, were unpopular and nowhere near their technological peak. Web browsers
    were, in many ways, much more simple and unsophisticated as were web pages themselves.


    ## Static vs. Dynamic Web Pages


    Currently, web pages primarily consist of just basic text markup rendered through
    `HTML`. This book isn’t going to tackle `HTML` except when it’s necessary. Therefore,
    a working knowledge about it is assumed. `JavaScript` is, after all, one of the
    three core web development languages alongside `HTML` and `CSS`. So, it’s worthwhile
    to learn `HTML` and `CSS` as well.


    Anyhow, early web browsers were known as static web pages. Static web pages are
    the opposite of dynamic web pages, which are web pages that are designed to reflect
    and render text and images only. Basically, once a static web page is loaded,
    it cannot be changed from within the page without changing and the reloading the
    web file.


    Dynamic web pages – or pages that can be changed in real-time without altering
    the web file itself – are implemented through what is called client-side scripting.
    Client-side scripting is about allowing changes to happen on a web page exclusively
    on the browser side. That is, client-side scripting allows sophisticated logic
    and dynamic changes to run within the context of the user’s web browser. Any changes
    are made their machine and within their browser and don’t necessarily indicate
    the transfer of information to a server.


    Essentially, `JavaScript` and all related languages are about giving life to web
    pages. It’s about taking web pages and making them able to do things instead of
    just be still. This functionality was, for a long time, just a glimmer in the
    eye of people who were looking forward to web development. However, this doesn’t
    mean that scripting didn’t exist way before. There was early support for technologies
    designed to allow web pages to interact more. However, these were very rudimentary.
    The early graphical web browsers were capable of scripting even during its infancy.


    This resulted in the creation of another browser, `Mozilla` which inspired the
    development of `Firefox`. Currently, however, `Firefox` was far from being a factor.
    Officially, the browser was released as `Netscape`, which was known by many as
    being among the most popular browsers in the 90s, and if you used a computer in
    the 90s, then you probably were using `Netscape`.


    In the mid-90s, the idea of embedded codes in web pages – that is, codes written
    in other programming languages that can be inserted directly into and run from
    a web page – started becoming even more popular. However, there still wasn’t enough
    information regarding the process of practical embedded languages. `Java` did
    somewhat serve the purpose, but it wasn’t simple. In fact, it died out because
    it entails a great amount of raw computing power for it to be used. A better alternative
    was needed, something that can be directly embedded into and alter the web page.
    Such a thing didn’t exist.


    `Netscape` decided to create a scripting language that can run within `HTML` documents
    and be easily embedded and interpreted within the browser itself. The language
    was supposed to display a similar syntax to `Java` and `C++`. This was to differentiate
    it from other popular scripting languages at that time, such as `Perl`, `Python`,
    and `Lisp`. Believe it or not, a C-inspired scripting language was relatively
    nouveau at the time.

