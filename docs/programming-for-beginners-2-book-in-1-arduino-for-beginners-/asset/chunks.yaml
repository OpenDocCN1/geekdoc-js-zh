  trans: '

    Arduino 不是市面上唯一的电子原型平台。还有其他项目和开发板，最常见的是树莓派（Raspberry Pi）和香蕉派（BeagleBone）。每种设备使用不同的微控制器，其硬件设计具有各自的特点。价格差异也很大，其他平台并没有那么受欢迎。


    选择哪种原型开发板取决于你的项目提出的需求和需要。无疑，考虑到上述原因，Arduino 是你大多数项目的强有力候选者。


    # 第 2 章：了解 Arduino


    ### 与 Arduino 相关的术语


    它将关闭一个电路并点亮灯泡作为输出：为你的孩子制作一个夜灯。在大多数板子上，会有一个 `Pin LED`，它与特定的引脚相关，例如 `Arduino Uno`
    上的 `Pin 13`。这个 `Pin LED` 是板内置的唯一输出可能，它将帮助你完成第一个“闪点脚本（blink sketch）”项目，该项目稍后会解释。`Pin
    LED` 也用于调试或修复你编写的代码，以确保其中没有错误。`Power LED` 正如其名：当板子接收电源或“开启”时，它会亮起。这对于调试你的代码也有很有帮助。每个板子上都存在微控制器本身，称为
    `ATmega microcontroller`，它是整个板子的大脑。它接收你的指令并采取相应的行动。没有它，整个板子将没有任何功能。


    模拟输入引脚位于 `Arduino Uno` 上数字引脚的对侧边缘。它是 `Arduino system` 的输入。模拟意味着输入的信号不是恒定的，而是随着时间变化的，例如音频输入。在音频输入的示例中，房间内的听觉输入会随着房间内人的说话以及房间外过滤进噪声而变化。`GND`
    和 `5V` 引脚用于为电路和微控制器创建额外的 `5V` 电。电源接口通常位于 `Arduino board` 的边缘，用于在未插入 `USB` 时为微控制器供电。`USB
    port` 也可以作为电源源，但它的主要功能是将你编写的脚本（代码指令集）从电脑上传到 `Arduino`。`TX` 和 `RX LED` 用于指示正在发生信息传输。这种通信指示会在你从电脑将脚本上传到
    `Arduino` 时发生，因此它们在交换期间会快速闪烁。


    # 第 3 章：Arduino 板的构造


    现在我们已经了解了一些 `Arduino microcontroller boards` 的基础知识，让我们看看在购买 Arduino 板时你拥有的各种选择。我们将查看价格、功能、内存量和其他特征，以帮助你做出决策尽可能简单直接。


    ### Uno


    这是大多数人开启 `Arduino 之旅` 的板子。在内存方面它较小，但在功能上非常灵活，是初学者以及想要尝试 `Arduino` 才华和智慧的人的绝佳工具。此型号带有
    `mini-USB port`，允许你直接上传代码到板子，而无需使用扩展板或其他额外的硬件。


    - 价格：$24.95

    - 闪存：32kB

    - SRAM:2kB

    - EEPROM:1kB

    - 处理速度：16MHz

    - 数字引脚：14 个引脚

    - PWM 引脚：6 个引脚

    - 模拟输入：6 个引脚

    - 工作电压：5V

    - 输入电压：7-12V


    ### Leonardo


    `Leonardo microcontroller board` 开箱即用：你只需要一个 `micro-USB cable` 和一台电脑即可开始。此外，由于其采用了
    `ATmega32U4` 处理器，电脑可以将 `Leonardo` 识别为鼠标或键盘。


    - 价格：$19.80

    - 闪存：32kB

    - SRAM:2.5kB

    - EEPROM:1kB

    - 处理速度：16MHz

    - 数字引脚：20 个引脚

    - PWM 引脚：7 个引脚

    - 模拟输入：12 个引脚

    - 工作电压：5V

    - 输入电压：7-12V


    ### 101


    这种微控制器包含许多其他初级型号中不具备的功能。例如，你可以通过手机的 `Bluetooth Low Energy`（低功蓝牙）连接到板子。此外，它内置了加速度计和陀螺仪，通过其六轴敏感度识别所有方向的运动。它还可以识别手势。


    这些功能结合在一起，允许设备或周围的运动成为输入，微控制器将通过输出做出响应。


    - 价格：$30.00

    - 闪存：196kB

    - SRAM:24kB

    - EEPROM:0kB

    - 处理速度：32MHz

