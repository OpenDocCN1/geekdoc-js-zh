- fmt: '

    This allows you to access the IDE software from Android devices and Apple mobile
    devices as well since it is based in a web browser that runs on its own platform
    rather than on the Android or iOS platforms. You can also run the web browser
    on various computer types, including Linux, Microsoft Windows, and Apple Macintosh.
    This will allow you to upload your sketches to the Cloud, that is, to store the
    information you have coded in a secure location that you can then re-access from
    another device by connection to the Internet.


    # Coding a Program for Your Arduino

    Next you will write code for a program that you want the Arduino board to run.
    This allows you to see the entire code at once, allowing for easier debugging,
    or removing of errors.


    Once you write the code, you will want to run it and troubleshoot or debug any
    errors you find. You will be best able to do this by applying the coded program
    to the Arduino board and seeing if it runs. To do this, you will need to proceed
    to the next step of uploading your sketch.


    ## Connecting to the Arduino Board

    Some of the boards come with built-in USB, mini-USB, or micro-USB ports. Examples
    would be the `Uno` and the `Leonardo`, for the more beginning stages of your Arduino
    career. Simply insert the appropriate end of the USB cord into your computer and
    the other end into the particular USB port that is present on the board you possess,
    and the Arduino IDE software should recognize the type of board it is. If it does
    not, you can always choose the correct board from a dropdown menu.


    Sometimes you will need to use a `TKDI` cable or a breakout board in order to
    make the Arduino compatible with your computer. This means you will insert the
    `TKDI` into the `TKDI` port on the Arduino microcontroller board and then connect
    it either to your computer or to another board. If you connect the `TKDI` cable
    to a breakout board, you will do as you did with the USB-compatible boards: insert
    the appropriate end of the cord to the breakout board and the other end to the
    computer. Again, the computer’s Arduino IDE software program should recognize
    your Arduino board, but you can always choose from a dropdown menu should it fail
    to recognize it.


    ## Uploading to the Arduino Board

    To upload your sketch, the program you just created in code, you will need to
    select the correct board and port to which you would like to upload. It should
    be easy enough to select the correct board, as you simply look for the board title
    that matches the name of the type of board you are using.


    To select the correct serial port, the options you might choose are as follows:


    ### Mac

    - Use `/dev/tty.usbmodem241` for the `Uno`, `Mega256O` or `Leonardo`.

    - Use `/dev/tty.usbserial-1B1` for `Duemilanove` or earlier Arduino boards.

    - Use `/dev/tty.USA19QW1b1P1.1` for anything else connected by a USB-to-serial
    adapter.


    ### Windows

    - Use `COM1` or `COM2` for a serial board.

    - Use `COM4`, `COM5`, or `COM7` or higher for a USB-connected board.

    - Look in Windows Device Manager to determine which port the device you are using
    is utilizing.


    ### Linux

    - Use `/dev/ttyACMx` for a serial port.

    - Use `/dev/ttyUSBx` or something like it for a USB port.


    Once you have selected the correct board and port, click `Upload` and choose which
    `Sketch` to upload from the menu that appears. If you have a newer Arduino board,
    you will be able to upload the new sketch simply, but with the older boards, you
    must reset the board before uploading a new sketch, else you will have two, possibly
    conflicting sketches present in the board’s memory, causing it to crash.


    ## Running the Arduino with Your Program

    There are a few ways to power your Arduino once you have uploaded the program
    that you have coded to it. First, you can power it by the USB connection to another
    powered device, such as your computer. Second, you can power by Ethernet on boards
    with that capability. This means that by connecting to the network, you will be
    connected to a power source through the Ethernet. Finally, you can power most
    Arduino’s by lithium polymer battery. Once power is connected, and the specified
    input is put into the microcontroller, it will perform the function for which
    it is intended.


    # Installing the Arduino IDE

    Now that you know the different parts of the Arduino board, we can learn how to
    prepare the Arduino IDE. After learning this, we will be ready to upload out your
    first program to the board. You will learn how to setup the board and set it ready
    to receive the program through a USB cable.


    Ensure that you have the Arduino board and a USB cable. After assembling these,
    the next step is to download the Arduino IDE. You can download this from the following
    URL:

    `https://www.arduino.cc/en/Main/Software`


    Download the right version of Arduino based on the operating system that you are
    using. Once the download completes, unzip the downloaded file.


    You can now power your board. The board can draw power from a USB connection to
    your computer or from an external power supply. Just connect your Arduino board
    to your computer via a USB cable. You should see the green power LED glow.


    It is now time to launch the Arduino IDE. Open the folder where you unzipped the
    Arduino IDE. Double the `.exe` file to start the IDE.


    The software will be opened and you will be able to create a new project or open
    an existing one. To create a new project, click `File` then chooses `New`. To
    open an existing project, click `File`, choose `Example`, `Basics` and then `Blink`.


    You need to select the type of board that you are using. To avoid any errors when
    you are loading programs from the IDE to the board, ensure that you select the
    correct board, that is, the type of board that is connected to your computer via
    a USB cable.


    To select the board, click `Tools` then choose `Board`.


    Next, you should select the serial port of your Arduino board. Click `Tools` then
    choose `Serial Port`. If you find it hard to know the serial port, just disconnect
    the Arduino board from the computer then look for the entry that disappears. This
    should be the Arduino board. You can then reconnect the board and choose that
    port.


    Anytime you need to load a program to the Arduino board, just click the `Upload`
    button on the IDE. Note that an Arduino program is referred to as a sketch.


    ## Digital Input/Output

    Digital signals are discrete values that either exists as `1` or `0`. This is
    to mean `1` (`High`) implies presence of a signal while `0` (`Low`) represents
    the absence of a signal. Digital signal is therefore transmitted as binary codes
    by either presence or absence of current, `5v` or ground, or presence or absence
    of a pulse.


    Human beings are used to analog signals while robots, computers and most electronic
    circuits perceive digital signals. As stated earlier, a digital signal only has
    two states, that is, `ON` and `OFF` just like a two-way light switch on your wall.


    Digital signals are used everywhere in Arduino programming except for the analog
    input that is meant specifically to tolerate analog signals. The `ON` or `HIGH`
    state of the digital signal will always equal the board voltage as either `3.3
    volts` or `5.0 volts`. On the other hand, the `LOW` or `OFF` state is always represented
    by `0 volts`.


    In order to receive or send digital signals on the Arduino board, use only pins
    labeled `0-13`. Again as explained earlier it is possible to set up the analog
    pins to act as digital pins. This is achievable through the use of the command:
    `pinMode(pin label, value)`. The pin number here stands for an analog pin ranging
    from `A0-A5`, the value in the function is always either `input` or `output`.

