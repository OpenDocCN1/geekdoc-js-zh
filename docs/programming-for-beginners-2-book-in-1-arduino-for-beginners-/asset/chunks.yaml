    up with complex systems. An example of such a system is one that controls access
    to a facility. You can use Arduino to program the door that grants access to the
    facility. Arduino is good for hardware programming. If you are familiar with the
    C programming language, then it is easy for you to program the Arduino boards.
    The code is written in the Arduino software, which is an open source software.
