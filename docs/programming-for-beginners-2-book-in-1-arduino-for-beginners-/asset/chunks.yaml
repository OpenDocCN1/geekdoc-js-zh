    web file.


    Dynamic web pages – or pages that can be changed in real-time without altering
    the web file itself – are implemented through what is called client-side scripting.
    Client-side scripting is about allowing changes to happen on a web page exclusively
    on the browser side. That is, client-side scripting allows sophisticated logic
    and dynamic changes to run within the context of the user’s web browser. Any changes
    are made their machine and within their browser and don’t necessarily indicate
    the transfer of information to a server.


    Essentially, JavaScript and all related languages are about giving life to web
    pages. It’s about taking web pages and making them able to do things instead of
    just be still. This functionality was, for a long time, just a glimmer in the
    eye of people who were looking forward to web development. However, this doesn’t
    mean that scripting didn’t exist way before. There was early support for technologies
    designed to allow web pages to interact more. However, these were very rudimentary.
    The early graphical web browsers were capable of scripting even during its infancy.


    This resulted in the creation of another browser, Mozilla which inspired the development
    of Firefox. Currently, however, Firefox was far from being a factor. Officially,
    the browser was released as Netscape, which was known by many as being among the
    most popular browsers in the 90s, and if you used a computer in the 90s, then
    you probably were using Netscape.


    In the mid-90s, the idea of embedded codes in web pages – that is, codes written
    in other programming languages that can be inserted directly into and run from
    a web page – started becoming even more popular. However, there still wasn’t enough
    information regarding the process of practical embedded languages. Java did somewhat
    serve the purpose, but it wasn’t simple. In fact, it died out because it entails
    a great amount of raw computing power for it to be used. A better alternative
    was needed, something that can be directly embedded into and alter the web page.
    Such a thing didn’t exist.


    Netscape decided to create a scripting language that can run within HTML documents
    and be easily embedded and interpreted within the browser itself. The language
    was supposed to display a similar syntax to Java and C++. This was to differentiate
    it from other popular scripting languages at that time, such as Perl, Python,
    and Lisp. Believe it or not, a C-inspired scripting language was relatively nouveau
    at the time.'
