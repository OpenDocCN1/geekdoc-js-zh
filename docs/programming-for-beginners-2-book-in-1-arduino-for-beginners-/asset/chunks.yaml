    These parts are able to come together to help you to get the project to work well.
    You need to make sure that you have some hardware in place, such as one of the
    Arduino board types, and then it needs to be respond to what you are able to send
    through with the software. We will spend some time talking about the various things
    that you are able to do with the software in order to get your project to work
    later on, but both of these will need to be set up to ensure that the messages
    from the IDE are getting over to the board and working properly. With Arduino,
    you need to have the IDE in place before writing out any code. The IDE for this
    program is free since it is open sourced, which makes it easier to get ahold of
    a copy. When writing codes, you will use the Arduino programming language, which
    will be easy to learn and works well with all of the operating systems on your
    computer. One thing to note with the IDE and the coding language with Arduino,
    if you are working on a Windows 7 operating system or earlier, you will have a
    few steps that you will need to take, in addition to the regular steps, to make
    sure that the Arduino board will work with the operating system. It does work
    with the older versions of Windows, you just need to take some extra time to introduce
    the board to this system to get it to work. Whether you are just getting started
    out with programming or want to use some of your skills to make a great electronic
    or robotic project, the Arduino platform will be able to help you get this done.
    It has all the power that you need with a simplistic background that helps even
    the beginner understand and accomplish what they want.


    ## What can I do when using Arduino?


    One of the first questions that you may have when you see the Arduino programming
    language is what you are able to do with it all? There are many programming languages
    out there and you are able to choose them to accomplish different things, but
    Arduino is going to work a bit differently compared to some of the others. There
    are many great projects that you are able to do with the Arduino platform. Basically,
    the coding that goes with Arduino is going to travel from the IDE on your computer
    over to the hardware that you purchase to go with your project. You can use just
    the board or attach it to some electronic project to make it do some amazing things.
    There are a lot of things that you can do with your robotics with the help of
    Arduino and if you are just getting started with your own electronic learning
    process or you want to try something new, this is the best platform to do so with.
    You are able to work with the board making sounds, blinking lights, sending out
    signals to control what is on the screen ahead of it, and so many other things.
    We will spend some time looking at the different projects that you are able to
    do with Arduino so you get a better idea of what you are able to do with this
    great language.


    ## Chapter 1: What is Arduino?


    ### History of Arduino


    A microcontroller is a small computer board that can be programmed to perform
    certain functions. At the time, BASIC stamp microcontrollers cost $100 and upward,
    and, as we will see later, Arduino certainly reduced the costs while maintaining
    the ability to perform various functions and the ease of programming such functions.


    Supervised by Massimo Banzi and Casey Reas, Barragán worked in the computer language
    called `Processing` to create the environment, `IDE` (Arduino’s official coding
    environment and program). He fiddled with the `Wiring` platform technology to
    come up with the hardware called `ATmega168`, the first Arduino microcontroller.


    Later in 2003, Massimo Banzi, David Mellis, and David Cuartielles added support
    for `Wiring` to their microcontroller board, named `ATmega8`, and they reworked
    the `Wiring` source code, naming it `Arduino`. Together, the three along with
    Tom Igoe and Gianluca Martino continued to develop Arduino technologies, and by
    the year 2013, 700,000 microcontroller boards were sold from the New York City
    supplier, Adafruit Industries, alone.


    After some issues with establishing the trademark for Arduino, which resulted
    in a split in the company for a few years, Arduino is now a single company that
    is committed to the development of hardware and software usable by the average
    person or hobbyist, but also flexible enough to be of interest to the professional
    engineer.


    ### But what is Arduino?


    This history of Arduino might sound as convoluted as the technology itself seems
    to you. Full of many puzzling and confusing elements, you might feel overwhelmed
    by the language of “microcontrollers,” “environments,” and “languages.” We will
    start here, beginning with the definition of Arduino.


    How it works is as follows: one purchases the hardware that is appropriate to
    his or her purposes and then, on a more powerful Windows, Macintosh OSX, or Linux
    computer, and codes or write instructions for the board and uploads the instructions
    via a cable. The code is then stored on the microcontroller, and it functions
    according to the instructions, such as activating a beeping sound when light filters
    in through an opening door. The light activates a sensor connected to the microcontroller,
    like an alarm.


    In a nutshell, Arduino is an electronic project development platform (or electronic
    prototyping, as it is also commonly said), consisting of both hardware and software,
    and which is available under the Creative Commons Attribution-Share-Alike license.


    This means that all Arduino project design files are freely available on the internet
    and that their software is open source. Also, the platform may be used for both
    personal and business purposes, provided that credits are attributed to the Arduino
    brand, and project files are also made available under the same license.


    The project emerged in Italy in 2015 from a group of developers led by Massimo
    Banzi. The initial purpose was to create a low-cost, easy-to-work platform that
    could be used by students to develop their prototypes efficiently and cheaply.
    It was also thought to assist in the teaching of electronics to art and design
    students, particularly to create interactive environments, something very much
    vogue within contemporary design and arts.


    ## Who Uses Arduino?


    A wide array of people uses Arduino for various projects and hobbies, as well
    as for professional uses. It is known for being simple and straightforward enough
    for beginners, deep and rich enough for the beginner to grow, and with enough
    potential for a more advanced user to utilize.


    Teachers and students use Arduino, and indeed are the intended consumer base for
    the products, as Arduino offers a low-cost way to build scientific instruments.
    This allows teachers and students to practice and demonstrate chemistry and physics
    principles, as well as get started with programming and building robots.


    Designers and architects might use Arduino technologies to build interactive models
    and prototypes of what they hope to develop on a full-scale. Musicians and artists
    also use Arduino microcontrollers to experiment with new instruments or techniques
    in their art.


    Just about anyone can use Arduino, including children, that want to start tinkering
    with coding and computer hardware, as well as hobbyists who simply want to learn
    a bit about software and microcomputers.


    The main reasons for using the Arduino platform in your projects are as follows:


    *   Low-cost prototyping

    *   Free simulation software available

    *   Easy to program

    *   A large number of tutorials, articles, and projects ready on the internet

    *   Extensive community of developers and hobbyists

    *   No experience or extensive prior knowledge of electronics/programming required
    (however, it is advisable to know the basics at least)

