    \ Serial.print (‘\\r’) ;\n\n} \n\n}\n\nMultidimensional Arrays\n\nAn array of\
    \ two dimensions mostly represent a table of elements consisting of rows and columns.\n\
    \nSome of the outstanding features of a multidimensional array:\n\n Has two subscripts\
    \ representing the columns and rows of a table.\n\n The first subscript represent\
    \ the elements’ rows and the second subscript represents the elements’ columns.\n\
    \n Multidimensional arrays have two and more dimensions.\n\nAn example by declaration\
    \ is shown below:\n\nint c[ 3 ][ 3 ] = { { 3, 8 }, { 3, 7 } };\n\nor int c[ 3\
    \ ][ 3 ] = { { 3 }, { 3, 9 } };\n\nSumming all the Array elements\n\nThose elements\
