    var x2 = 56; // without a decimal place

    ```


    To write very large or very small numbers, you must use an exponential or scientific
    notation:


    ```javascript

    var y = 234e5; // 23400000

    var z = 234e-5; // 0.00234

    ```


    ## JavaScript Booleans


    Booleans have just two values – True or False.


    ```javascript

    var x = true;

    var y = false;

    ```


    ## Arrays


    In JavaScript, an array is enclosed in square brackets `[]` and each item is separated
    by a comma. Look at the next example which is declaring an array with the name
    of cars and with three items in it, the names of the cars:


    ```javascript

    var cars = ["Volvo", "Ford", "Mercedes"];

    ```


    The indexes in an array are what we call zero-based and this means that the first
    item will start at 0, the second one is 1 and so on. So, for 10 items in one array,
    you will go from 0 to 9.


    ## Objects


    Objects are contained within curly braces `{}` and the properties of the objects
    are written as pairs of name: value, each pair separated by a comma:


    ```javascript

    var person = {firstName:"Jane", lastName:"Deer", age:45, eyeColor:"green"};

    ```


    The object in the example is a person with four properties:


    * `firstName`

    * `lastName`

    * `age`

    * `eyeColor`


    ## typeof Operator


    The `typeof` operator is used to find a variable type. Look at these examples:


    ```javascript

    typeof ""              // Returns "string"

    typeof "Jane"           // Returns "string"

    typeof "Jane Deer"      // Returns "string"

    typeof 1               // Returns "number"

    typeof 253             // Returns "number"

    typeof 2.53            // Returns "number"

    typeof (1)             // Returns "number"

    typeof (5 + 8)         // Returns "number"

    ```


    ## Primitive Data


    Primitive data values are simple single values that have no extra properties or
    methods. The following primitive types can be returned by the `typeof` operator:


    * `boolean`

    * `null`

    * `number`

    * `string`

    * `undefined`


    For example:


    ```javascript

    typeof "Jane"          // Returns "string"

    typeof 2.53            // Returns "number"

    typeof true            // Returns "boolean"

    typeof false           // Returns "boolean"

    ```


    ## Complex Data


    It can also return one of the following complex data types:


    * `function`

    * `object`


    For example:


    ```javascript

    typeof [3, 4, 5, 6]         // Returns "object” and not an array – see below

    typeof {name:jane, age:45}  // Returns "object"

    typeof function myFunc(){}     // Returns "function"

    ```


    The `typeof` operator will return “object” because arrays are objects in JavaScript.


    ## Undefined


    As we said earlier, a variable that has no value is given the value of `undefined`.
    The `typeof` operator is undefined too:


    You can empty a variable of its assigned value by setting it to `undefined` value;
    the type is also `undefined`:


    ```javascript

    person = undefined; // the value is undefined, the type is undefined

    ```


    ## Empty Values


    Empty values are not to be confused with `undefined` values. Empty string variables
    have both value and type, for example:


    ```javascript

    var car = ""; // The value is "", the typeof is "string"

    ```


    ## Null


    Objects can be emptied by setting them to `null`, like this:


    ```javascript

    var person = null; // the value is null, but the type remains object

    ```


    You can also empty objects by setting them to `undefined`:


    ```javascript

    var person = undefined; // the value is undefined, the type is undefined

    ```


    ## Operators


    The basic operators in JavaScript are created with signs and symbols. We have
    already familiarized ourselves with a few operators, such as `=` operator which
    is used to assign value to a variable.


    ```javascript

    var a = 8;

    var b = 9;

    ```


    The meaning of the above two lines is that `a` and `b` are declared and a value
    is assigned to them. In this case, the value of `a` is 8 and the value of `b`
    is 9.


    Similarly, JavaScript has a number of other basic operators built inside its script.
    Let’s look at the following operators:


    * `+` (addition operator)

    * `*` (multiplication operator)

    * `/` (division operator)

    * `-` (subtraction operator)


    Each of these operators works the same as they would in a calculator.


    ```javascript

    var a = 10;

    var b = 5;

    a/b   // This is a simple division, which divides 10 by 5 giving 2

    a + b // This operation performs an addition, 10 + 5 gives 15

    a - b // This operation performs a subtraction, 10-5 gives 5

    a * b // This is a basic multiplication, 10 * 5 = 50

    ```


    ## Different types of assignment operators


    Aside from the basic operators, here are some more: Different types of assignment
    operators (Usage: Assigning values to variables). The examples in the chart are
    all numbers, but operators are not only for numbers. Concatenation allows you
    to combine two strings together and turn them into one string using `+` operator
    or `+=` assignment operator.


    ```javascript

    var Spray = "Hello ";

    var Body = "World";

    console.log(Spray + Body); // This will give an output of "Hello World"

    ```


    ```javascript

    var a = "I am ";

    var b += "Legend"; // The result will be: "I am Legend"

    ```


    Also, you can add a string and a number together:


    ```javascript

    X="3"+1 // (Result will be 31, not 4)

    X="Jessica"+1 // (Result will be Jessica1)

    ```


    Unlike other programming languages, the behavior of the operators that deal with
    Strings and those that deal with numbers vary to a great extent. Having a deep
    understanding of the differences between the two is important in order to make
    that both of them are used properly. For example, one of the prime differences
    you will notice while using these two types of operators can be found during the
    usage of the Addition Operator.


    Consider a scenario where we are trying to add a number and a string.


    **Example 1.**

    ```javascript

    var Bar = 5;

    var Legal = "6";

    console.log (Bar + Legal) // The output here will be 56.

    ```


    If you want to force the strings to act as simple numbers, you can add `Number`
    keyword in front of the string variable.


    **Example 2.**

    ```javascript

    X=1+Number("6") // The result will be 7 in this case.

    ```


    **Example 3.**

    ```javascript

    var Bar = 5;

    var Legal = "6";

    console.log (Bar + Number(Legal)) // The output of this statement is 11.

    ```


    These are examples of how JavaScript allows you to do type conversion manually
    from numbers to Strings, Strings to numbers, or Boolean values to numbers or Strings.
    We’ve already shown you how to convert Strings to numbers using the global `Number()`
    method. A similar method exists to convert numbers to Strings. This uses the global
    `String()` method.


    **Example 4.**

    ```javascript

    String (3.14) // convert the number 3.14 to a String

    String(x + y) // converts the expression of x + y into a String.

    ```


    You may wonder why you would ever want to convert a number to a String. There
    are times when you will want to preserve the accuracy of a number out to a certain
    number of decimals. Because of how computers deal with numbers by converting them
    to binary and back, you can lose accuracy when working with just the number type.
    In this case, preserving the value as a string ensures that you won’t lose any
    accuracy in your values.


    You can also convert Boolean values into numbers or Strings.


    ```javascript

    Number(TRUE) // return a value of 1

    Number(FALSE) // return a value of 0

    String(TRUE) // returns a String, "true"

    String(FALSE) // returns a String, "false"

    ```


    In the example `1 + 2` equals to 3, the numbers 1 and 2 are called operands and
    the `+` sign is the operator. JavaScript supports the following types of operators:


    * Arithmetic Operators

    * Logical Operators

    * Assignment Operators

    * Conditional Operators


    Let’s discuss each type of operator.


    ### Arithmetic Operators


    | Operator | Description | Example A=5, B=10 |

    | :--- | :--- | :--- |

    | `+` | Addition (works for numeric and strings) | `X = A + B: X=15`, `Y = "z"
    + B: Y = z10` |

    | `-` | Subtraction | `X = A – B: X = -5` |

    | `*` | Multiplication | `X = A * B: X = 50` |

    | `/` | Division | `X = B/A: X =2` |

    | `%` | Modulus (outputs the remainder of an integer division) | `X = B % A: X
    = 0` |

    | `++` | Increment by 1 | `X=A++: X = 6` |

    | `--` | Decrement by 1 | `X=A--: X = 4` |


