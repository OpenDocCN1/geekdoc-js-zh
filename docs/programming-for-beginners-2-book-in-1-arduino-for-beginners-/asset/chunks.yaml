- fmt: "\nThe naming of variables in C is quite easy. Names of variables carry with\
    \ them numerals, underscores, and letters. You can as well combine the upper and\
    \ lower case. However, the length cannot go past the 31 characters. However, the\
    \ actual limit depends on the C compiler. In addition, variables cannot contain\
    \ reserved keywords or unique characters like a semicolon, comma, and other special\
    \ characters. Therefore, valid names can be names such as `resistor8`, `volt5`,\
    \ and `we_are_variables`. \n\nC language has different variable types. Some of\
    \ them consist of floating-point numbers and real numbers in two forms. First,\
    \ there is the 32-bit `float`, and then the `double`. We also have a few types\
    \ of integers that consist of `char`, 16 bits, `short int`, and 32 bits `long\
    \ int`. Though `char` is only an 8 bit, still has a 2 to the 8th combinations\
    \ – or even 256 separate values that you will find it perfect for a single ASCII\
    \ character. \n\nSimilar to other languages, the C language has arrays and compound\
    \ data types. When it comes to variables in the C language, it is vital for the\
    \ variables to be declared before they are used. Variables cannot just be created\
    \ instantly like the way it happens in the Python language. Variable declarations\
    \ are made up of the variable type and variable name. You can also include an\
    \ initial value for the variable during the declaration, but that is optional.\
    \ Multiple variable declarations are still allowed in C language. For instance:\n\
    \n```\nFloat c = 1.2;\nChar c;\nUnsigned char x;\n```\n\nYou should underline\
    \ that every type of variable declaration ends with a semi-colon. Like many other\
    \ programming languages such as `Java`, the semi-colon indicates the end of that\
    \ statement.\n\n## Functions\n\nFunctions have a similar naming rule like variables.\
    \ All functions have a similar syntax that resembles: `Return_value function_name\
    \ (function argument list) { Statement( s) }`. You can borrow the concept of mathematical\
    \ functions where you assign it some value( s) as well as allocate back some values.\
    \ An example is a calculator that contains the `cosine` function. It is possible\
    \ to assign an angle to it, and this will return a specific value. Functions may\
    \ contain separate arguments in the C language. Furthermore, it is possible for\
    \ a C function to return values. A `void` function is one that does not require\
    \ a value or return a value. A `void` function will look like this:\n\n```\nvoid\
    \ function_name (void)\n{\n// necessary statements come here\n}\n```\n\nThis might\
    \ look like a lot of work, but the data types in the C language make sense. What\
    \ this means is that if you choose to use a wrong kind of variable in a function,\
    \ or even an incorrect number of variables, you will receive a warning. \n\nTherefore,\
    \ if you have a `float` function and attempt to send it an integer variable, the\
    \ compiler will send you a warning. Every program must have a start and an end.\
    \ In the C language, all programs begin at the `main` function. You can look at\
    \ the program below:\n\n```\nvoid main (void) \n{\nfloat y = 3.0;\nfloat f = 2.0;\n\
    float t;\nt = y* t\n}\n```\n\nThere exists one `main()` function. It accepts no\
    \ variables and returns nothing.\n\n## Libraries\n\nThe previous example is limited\
    \ because it is hard to see the result. Therefore, you will need some methods\
    \ when you want to display the results on your computer screen. To achieve this,\
    \ it will depend on the libraries and systems functions. Countless libraries have\
    \ the most advanced C systems. In essence, somebody has just tested, compiled\
    \ and wrote a collection of functions. What you need to do is to link the functions\
    \ into the program. Linking helps integrate the code and any existing library\
    \ into an entire program. To display the general data and the input data, we use\
    \ the standard `IO` and the `stdio`.\n\nThe `stdio` library has a function called\
    \ `printf()`.\n\nThe program will display the words “Hello World” on the computer\
    \ screen. It will further insert a new line after the backslash-n combo. `\\n`\
    \ refers to the addition of a new line. If we failed to include the `#include`\
    \ directive, the compiler will not understand anything concerning the `printf()`,\
    \ and it would show up an error when we attempt to use it. Well, what about the\
    \ header file? The header file has a lot of different function prototypes. These\
    \ prototypes can be seen as templates but if you want, you can build your own.\
    \ To make use of it, you are required to have the correct `include` statement\
    \ written into the code, and it will be better set if you remember to include\
    \ the linker library code. This will not only save time but also allow you to\
    \ reuse the code.\n\n## Simple Math\n\nC has certain basic math operators just\
    \ like other languages. Some of them include the `-`, `+`, `/` and the multiple.\
    \ Parentheses help divide the elements and power hierarchy operations. The C language\
    \ has the `%` operator that represents modulo. The modulo is an operation which\
    \ carries the remainders of a division. For example, 8 modulo 18 would, of course,\
    \ be 2. The division will behave separately both to integers and floats which\
    \ have no remainder. In other words, integer `5` divided by `2` is `2`, and not\
    \ `2.5`. Within the C language, there is a sequence of bit manipulators useful\
    \ for situations such as this. For complex math operators, you will have to go\
    \ deep into the math library. Some of the examples are `log(10)`, `tan()`, `cos()`\
    \ and `sin()`.\n\nHowever, you should not attempt to use the `^` operator because\
    \ it has a separate meaning in the C language. Well, do you still remember what\
    \ we said earlier about the use of libraries? Placing certain functions such as\
    \ `sin()` into your code forces the compiler to define the prototypes along with\
    \ other related information. Therefore, during the start of the program, it will\
    \ be necessary to include the following line:\n\n```\n#include < math.h >\n```\n\
    \n## C Language Input and Output\n\nWe know that the `printf()` function displays\
    \ the information on the screen. The `printf()` is an extensive and complex function\
    \ which has a lot of variants and format specifiers. The format specifiers comprise\
    \ of `%` stuff applied as placeholders for the values.\n\nTake for instance, if\
    \ we want to show the value of a variable in the decimal form. We could have done\
    \ it this way: `printf (“ The value is %d, in hex %x, and in octal is &o.\\ n”,\
    \ value1, value1, value1);`  You should see the way we have labeled the variables.\
    \ This is critical because if you make a mistake and display a value that has\
    \ no label, it will be impossible to tell whether it is hex or decimal. For instance,\
    \ if you see a number like 22, how will you tell that the number is a decimal\
    \ or hex for that matter? It is impossible to know.\n\nBesides indicating the\
    \ label, you can print it with a field width. For instance, `%6d` is equivalent\
    \ to writing the integer in the decimal with a minimum space of 6. Similarly,\
    \ `%6.2f` implies that you print the floating-point value with a minimum of 6\
    \ spaces. The `.2` part is an exact specifier, and in the following example, it\
    \ shows two digits after the decimal point. You can then see how powerful and\
    \ flexible this function looks. The input function for the C language is the `scanf()`.\
    \ This resembles the Python’s `input` statement. Even though it is possible to\
    \ request different values at once, it is the best.\n\nIt comes with similar specifiers\
    \ like the `printf()`. So, there is a point which needs to be understood, and\
    \ the `scanf()` function will require you to specify the location where the value\
    \ is kept in the computer memory. This shows that just writing the name of the\
    \ variable is not enough. You need to describe it in detail. C has the `&` operator\
    \ which means the address of. For example, when you want to select a specific\
    \ integer variable from a user and store it snugly inside the `voltage` variable.\
    \ Here is the code fragment for you to look at:\n\n```\nprintf (“ Kindly type\
    \ in the voltage”);\nscanf (“% d,” &voltage);\n```\n"
