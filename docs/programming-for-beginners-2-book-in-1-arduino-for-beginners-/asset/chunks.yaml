    \ {\n  myVector tempo;\n  tempo.a = a + myParam.a;\n  tempo.b = b + myParam.b;\n\
    \  return (tempo);\n}\n\nint main () {\n  myVector x (2, 4);\n  myVector y (3,\
    \ 4);\n  myVector z;\n  z = x + y;\n  cout << z.a << \",\" << z.b;\n  return 0;\n\
    }\n```\n\n## 关键字 this\n\n`this` 单词表示指向正在执行其成员函数的对象的指针。它是指向对象本身的指针。\n\n它还经常用作 `operator=`\
    \ 函数的一部分，该函数通过引用返回对象（避免使用临时对象）。延续之前看到的向量示例，我们可以像下面这样编写一个 `operator=` 能力。\n\n实际上，这个能力与编译器为该类自动创建的代码非常相似，是在我们排除了\
    \ `operator=` 成员函数来复制此类的对象的情况下。\n\n## 静态成员\n\n类可以包含静态部分，可以是数据或函数。类的静态数据通常被称为“类变量”，因为对于该同类的所有对象，都有独特的值。它们的内容在该类的一个对象和另一个对象之间是不相同的。\n\
    \n## 友元函数\n\n在本质上，类的私有成员无法从声明它们的同一个类的外部访问。然而，这一规则不影响友元函数。\n\n如果我们需要声明一个外部函数为类的友元，从而允许该能力访问该类的私有和受保护成员，我们通过在类内部声明该外部函数的原型，并在其前面放置\
    \ `friend` 关键字来实现。\n\n示例：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nclass myRectangle {\nint x, y;\npublic:\nvoid setValues (int, int);\nint func\
    \ () {return (x * y);} friend myRectangle copy (myRectangle);\n};\n\nvoid myRectangle\
    \ :: setValues (int a, int b) {\n  x = a;\n  y = b;\n}\n\nmyRectangle copy (myRectangle\
    \ rectParam) {\n  myRectangle rects;\n  rects.x = rectParam.x*2;\n  rects.y =\
    \ rectParam.y*2;\n  return (rects);\n}\n\nint main () {\nmyRectangle rectx, recty;\n\
    rectx.setValues (2,3);\nrecty = copy (rectx);\ncout << recty.func();\nreturn 0;\n\
    }\n```\n\n`copy` 函数是 `myRectangle` 的友元函数。在该函数内部，我们可以考虑 `x` 和 `y`，即使它们不是该类的一部分。\n\
    \n友元函数可以服务于，例如在两个类之间执行操作。因此在任何情况下可以使用类的部分来执行操作。\n\n## 友元类\n\n通常当我们有声明友元函数的能力时，我们也可以将一个类声明为另一个类的友元，允许该类访问后者的受保护和私有成员。\n\
    \n示例\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nclass mySquare;\n\
    \nclass myRectangle {\nint x, y;\npublic:\nint myArea () {return (x * y);}\nvoid\
    \ convert (mySquare a);\n};\n\nclass mySquare {\nprivate:\nint x;\npublic:\nvoid\
    \ setSide (int a)\n{x=a;}\n\nfriend class myRectangle;\n};\n\nint main () {\n\
    mySquare sqr;\nmyRectangle rect;\nsqr.setSide(4);\nrect.convert(sqr);\ncout <<\
    \ rect.myArea();\nreturn 0;\n}\n```\n\n在这个示例中，我们将 `myRectangle` 声明为 `mySquare`\
    \ 的友元，以便 `myRectangle` 可以访问 `mySquare` 的受保护和私有成员，特别是 `mySquare::x`，它表示正方形的边。\n\
    \n## 类之间的继承\n\n继承是类的一项关键功能，允许你创建自其他类的类。因此，它们自然地包含了“父类”的一些成员，加上它们自己的成员。\n\n从其他类的类会继承基类的所有的可用部分。这意味着如果一个基类包含部分\
    \ A，并且我们将其确定到一个具有部分 B 的另一个类，那么该派生类将包含部分 A 和 B。\n\n要从一个类确定一个类，我们使用冒号（:`）作为派生类声明的一部分，使用以下安排：\n\
    \n```cpp\nclass <derived class name>: public <base_class_name>\n{\n    //Code\n\
    };\n```\n\n"
