  trans: "\n\n大多数编程语言都有通用的决策结构格式，如下所示：![Description: 00014.jpeg](img/00009.jpeg)\n\
    \n控制结构（条件）内部的语句旨在协调程序执行的流，因此被称为源代码控制语句。\n\n这些语句包括：\n- `If` 语句\n- `If….else` 语句\n\
    - `If…else if…else` 语句\n- `Switch case` 语句\n- 条件运算符 `?` \n\n再次强调一下，这些语句在导航程序中的各种循环和部分时非常重要。它们一次执行部分内容，并使用结果来指示处理器执行下一块代码。\n\
    \n### If 语句\n\n这种特定的结构在代码行代码中使用括号内的表达式，并与下一行代码中的语句或语句块结合使用。当表达式为真时，处理器被指示执行包含在此条件中的语句块或语句。如果表达式为假，处理器将跳过该语句块或语句，跳转到下一行代码。`If`\
    \ 语句有两种形式，如下文所示：\n\n#### 第一种形式\n```\n{\n  if (expression)\n  block of statements;\n\
    }\n```\n\n#### 第二种形式\n```cpp\nif (expression)\n{\n  statements;\n}\n```\n\n####\
    \ If 语句的执行顺序\n`if` 语句的执行顺序由下图总结所示：\n![Description: 00015.jpeg](img/00010.jpeg)\n\
    \n#### 程序中的示例：\n```cpp\n/* 全局变量定义 */\n\nint X = 5 ;\n\nint Y= 9 ;\n\nVoid setup\
    \ ()\n{ \n}\n\nVoid loop ()\n{\n/* 此部分用于检查布尔值条件 */\n    if (X > Y) /*当条件为真时，处理器执行下方的语句*/\n\
    \    Y++;\n\n/* 此部分用于检查布尔值条件 */\n  If ( ( X>Y ) && ( Y!=0 )) /*当此条件为真时，处理器执行下面的语句*/\n\
    \    { \n          X+=Y;\n      Y--;\n    }\n}\n```\n\n### If…else 语句\n\n该结构为条件为假的情况提供了一个备选的可执行语句，也就是说当\
    \ `if` 语句为假时，有一个可选的退出方式，因为提供了一个可选执行的 `else` 语句。\n\n#### 语法\n```cpp\nif (expression)\n\
    {\n    statements; //这些语句仅在条件为真时执行\n}\nelse\n{\n    statements; // 当表达式为假时执行的可选语句。\n\
    }\n```\n\n#### 执行顺序总结\n![Description: 00016.jpeg](img/00011.jpeg)\n\n#### 程序中的示例\n\
    ```cpp\n/* 全局变量定义 */\n\nint X = 6 ;\n\nint Y= 8 ;\n\nVoid setup ()\n{ \n}\n\n\
    Void loop ()\n{\n/* 此部分用于检查布尔值条件 */\n    if (X > Y) /*当条件为真时，处理器执行下方的语句*/\n{ \
    \  \n          X++;\n      }\n  else\n      {\n    Y-=X\n      }\n}\n```\n\n###\
    \ If…else if…else 语句\n\n这是一个特殊的控制结构，`if` 语句后面跟着一个可选的 `else..if…else` 控制结构。这种表达式在导航条件以测试它们是真是为假时非常重要。\n\
    \n**注意：** 使用 `If…else if…else` 语句时请始终记住以下点：\n- `if` 语句可以没有 `else` 语句，也可以只有一个，且\
    \ `if` 语句必须位于任何 `else if` 之后。\n- `if` 语句可以没有或有多个 `else if` 语句，这些语句必须始终位于 `else`\
    \ 语句之前。\n- 所有 `else if` 或后跟有 `else if` 的 `else` 语句永远不会被执行，因为处理器按照优先级模式运行。\n\n\
    #### 语法\n```cpp\nif (first expression)\n  {\n    语句或语句块;\n  }\nelse if(second\
    \ expression)\n  {\n    语句或语句块;\n}\n. //其他 else if 语句\n.\n.\n.\nelse\n  {\n语句或语句块;\n\
    \  }\n```\n\n#### 程序中的示例\n```cpp\n/* 全局变量定义 */\n\nint X = 5 ;\n\nint Y= 9 ;\n\n\
    int Z=15;\n\nVoid setup ()\n{ \n}\n\nVoid loop ()\n{\n  /* 检查下方的布尔条件是真为假 */\n\
    \  if (X > Y) /*当条件为真时，处理器被指示执行下面的语句*/\n{\n        X++;\n    }\n  /* 检查下方的布尔条件是真为假\
    \ */\nelse if ((X==Y )||( Y!=0 )) /*当此条件为真时，处理器执行下面的语句*/\n{\n      X+=Y;\n   \
    \ }\nelse\n  Z++;\n}\n```\n\n### Switch case 语句\n\n这种结构的工作方式与 `if` 语句类似，程序员可以在\
    \ `switch` 语句中指定值，并根据 case 进行执行。\n\n#### 语法\n```cpp\nswitch (variable)\n{\n  case\
    \ name:\n    // 语句或语句块\n    break;\n  case name:\n    // 语句或语句块\n    break;\n\
    default:\n    // 语句或语句块\n}\n```\n\n#### 程序中的示例\n我们将使用一个非常简单的示例，假设一个变量有三个状态，即高中低分别\
    \ 0、1、2。程序根据以下情况切换代码：\n```cpp\nswitch (state)\n{\n  case 0: Low(); break;\n  case\
    \ 1: Mid(); break;\n  case 2: High(); break;\ndefault: Display (\"无效状态!\");\n\
    }\n```\n\n### 条件运算符\n\n条件运算符是 Arduino 编程以及 C 语言中唯一的三元运算符。\n\n#### 语法\n`第一个表达式?第二个表达式:第三个表达式`\n\
    \n#### 解释\n首先执行第一个表达式，然后根据该执行结果处理或跳过后续表达式。也就是说，当表达式结果为真时，执行第二个并继续序列。当第一个表达式给出假结果时，跳过第二个并处理第三个。表达式根据满足的条件给出真或假的结果。\n\
    \n#### 程序中的示例：\n```cpp\n/* 查找 min(x, y): */\nmin = ( x > y ) ? x : y;\n\n/* 此部分用于将小字母转换为大写：\
    \ */\n/* 这种情况不一定需要括号 */\nz = ( z >= 'x' && x <= 'c' ) ? ( z - 45 ) : z;\n```\n\
    \n#### 使用条件运算符的一些规则：\n- 始终确保第一个表达式是标量类型。\n- 对于后续表达式，请记住以下几点：\n  - 如果是两个，则它们必须都是算术类型\n\
    \  - 如果是两个，则它们都应该通过简单的算术转换进行评估，最终将确定结果类型。\n  - 如果是两个，它们都应该使用 void 设置并给出一个本质上是空的结果。\n\
    \n### Arduino 编程循环\n\n编程循环在某种程度上类似于控制结构为执行提供了更复杂的路径。\n\n因此，循环语句为多次执行语句或语句块提供了支持。通用的示意图如下：\n\
    \n"
- fmt: "\nArduino programming together with C language provides the following types\
    \ of loops:\n\n- While loop\n- Do…while loop\n- For loop\n- Nested loop\n- Infinite\
    \ loop\n\n### While Loop\nThis loop continues to execute or process infinitely\
    \ until that point in time when the expression inside the parenthesis gives a\
    \ false result. Actually `while` loop will never exit unless something changes\
    \ with the nested variables.\n\n#### Syntax\n```\nwhile(expression)\n{\n  statements\
    \ or block of statements;\n}\n```\n\n### Do…while loop\n`do…while` loop is similar\
    \ to `while` loop only that in `while` loop execution, the condition for loop-continuation\
    \ is tested right at the commencement of loop before execution gets to the body\
    \ of the loop. While in `do…while` loop, execution tests the body of the loop\
    \ before checking the condition for loop-continuation.\n\nAfter execution of a\
    \ `do…while` loop execution (after termination), execution actually goes on to\
    \ process those statements after the `while` statement.\n\n#### Syntax\n```\n\
    do\n{\n    Statements or block of statements;\n}\nwhile (expression);\n```\n\n\
    ### For loop\nFor this kind of a loop, the statements are executed for a predetermined\
    \ number of successions. Within the `for` loop expression, the control expression\
    \ is initialized, tested and changed during execution.\n\nThis presents a very\
    \ easy to debug arrangement where the structure has a looping behavior which is\
    \ entirely independent of the activities happening inside the loop.\n\n`for` loop\
    \ has three expressions inside the parenthesis which controls its operation. The\
    \ expressions are separated by with semicolons.\n\n#### Syntax\n```\nfor (expression\
    \ initialization; control part; increment or decrement portion)\n{\n    // statements\
    \ or block of statements\n}\n```\n\n#### Example in a program:\n```\nfor(counter=3;counter\
    \ >=10;counter++)\n{\n    //statements or block of statements will be executed\
    \ 10 times\n}\n```\n\n### Nested Loop\nThis is a technique where you can use a\
    \ loop inside another loop as illustrated below by the syntax.\n\n#### Syntax\n\
    ```\nfor (expression initialization ;control part; increment or decrement portion)\n\
    {\n    // statements or a block of statements\n    for (expression initialization\
    \ ;control part; increment or decrement portion)\n    {\n        // statements\
    \ or a block of statements\n    }\n}\n```\n\n#### Example in a program:\n```\n\
    for(counter=0;counter<=10;counter++)\n{\n  //statements or a block of statements\
    \ will be executed 10 times\n  for(j=0;j<=100;j++)\n    {\n        //statements\
    \ or a block of statements will be executed 101 times\n    }\n}\n```\n\n### Infinite\
    \ Loop\nAs the name suggests, this is a loop without a point of termination therefore\
    \ executes infinite number of times.\n\n#### Syntax\n1. When using `for` loop:\n\
    ```\nfor (;;)\n{\n    // statements or a block of statements\n}\n```\n2. Using\
    \ `while` loop:\n```\nwhile(expression)\n{\n    // statements or a block of statements\n\
    }\n```\n3. Using `do…while` loop:\n```\ndo\n{\n  Statements or a Block of statements;\n\
    }\nwhile(expression);\n```\n\n# Arduino Functions\nThese are statements per see\
    \ that allow programmers to structure their programs in parts or segments that\
    \ are meant to perform particular tasks at a time. For example, a function would\
    \ be helpful when one wants to perform a particular task a multiple times in a\
    \ program.\n\n#### Advantages of code segmentation into standardized fragments:\n\
    - Segmented codes presents a more organized work enhancing easier conceptualization\
    \ such codes.\n- During modification, code fragments are least liable to error\
    \ since any mistake is easily noticeable.\n- Codes stay compact and there is reduced\
    \ space since most of the codes are reused several times.\n- Functions presents\
    \ a modular set up of codes that is easy to read and can be reused in other sections.\n\
    \nArduino programming provides for two compulsory functions, that is, `setup()`\
    \ and `loop()`. Other functions must be created right outside of the brackets\
    \ of the above functions.\n\n#### Common syntax defining a function:\n```\nReturn\
    \ type function name (first argument, second argument, ....) \n{\n    Statements\
    \ or a block of statements\n}\n```\n#### Explanation:\n- **Return type**: the\
    \ type of value that is returned by the function, for example, any data type.\n\
    - **Function name**: Identifier or title by which this function can be recalled.\
    \ \n- **First argument, second argument…**: These are parameters that are used\
    \ to define the data type. \n- **Statements or a block of statements**: Incorporates\
    \ the statements or the body of the function itself.\n\n### Function Declaration\n\
    Any function is supposed to be declared outside other functions, that is, below\
    \ or above `loop()` function.\n\nFunction declaration can take two forms namely:\n\
    \n1. Just writing the function prototype just above the `loop()` function and\
    \ this form consists of: Return type, name, and argument type. Function prototype\
    \ is always followed by a semi-colon.\n#### Example in a program:\n```\nint aver_func(int\
    \ a, int b);\nvoid loop()\n{\n    // ...\n}\nint aver_func(int a, int b)\n{\n\
    \    // ...\n}\n```\n\n2. Writing the function definition below the `loop()` function.\n\
    \n# Arduino Programming - Strings\nThe two types of strings used in Arduino are\
    \ Character arrays which are equivalent to strings in C String that enables programmers\
    \ to use.\n\n### Character Arrays\nThis is typically a series of characters the\
    \ data type. An array therefore would mean a collection of characters with an\
    \ extra element at the end.\n\n#### Example in a program:\n```\nvoid setup()\n\
    {\n  char go_str[7]; // an array made up of characters\n  Serial.begin(10000);\n\
    \  go_str[0] = 'G';\n  go_str[1] = 'o';\n  go_str[2] = 'o';\n  go_str[3] = 'd';\n\
    \  go_str[4] = 'i';\n  go_str[5] = 'e';\n  go_str[6] = 0; // the 7th element called\
    \ null terminator\n  Serial.println(go_str);\n}\n\nvoid loop()\n{\n}\n```\nThis\
    \ same example can be rewritten in a more convenient way as:\n```\nvoid setup()\n\
    {\n  char go_str[] = \"Goddie\";\n  Serial.begin(10000);\n  Serial.println(go_str);\n\
    }\n\nvoid loop()\n{\n}\n```\n\n### Manipulation of a String Array\nWe will consider\
    \ the sketch below to explain how to manipulate a string array.\n\n```\nvoid setup()\n\
    {\nchar take[] = \"I do not take mangoes and tea\"; // creating a string array\n\
    \  Serial.begin(10000);\n  // the codes below are used to print the string\n \
    \ Serial.println(take);\n  // the codes below are used to delete part of the string\n\
    \  take[13] = 0;\n  Serial.println(take);\n  // the codes below explain how to\
    \ substitute a text into an existing string\n  take[13] = ' '; // the null terminator\
    \ replaced with a space\n  take[18] = 'e'; // point to insert the next new word\n\
    \  take[19] = 'g';\n  take[20] = 'g';\n  take[21] = 0; // null terminator used\
    \ to terminate the string\n}\n```\n"
