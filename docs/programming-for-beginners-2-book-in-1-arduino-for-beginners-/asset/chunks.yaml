    - `Secure` – 如果此字段被标记为“secure”，则只有安全的 Web 服务器可以检索 cookie。但是，如果它为空，任何 Web 服务器都可以访问该
    cookie。

    - `Expires` – 此字段指定了 cookie 过期的日期。如果此字段为空，cookie 将在用户关闭网络浏览器时过期。

    - `Path` – 这是创建 cookie 的网页或目录的路径。如果你想从任何页面或目录检索 cookie，可以留此此字段为空。

    - `Name=Value` – 每一个 cookie 都是以键值对的形式设置和检索的。


    Cookies 的创建是为了 CGI（即通用网关接口）编程而设计的。存储在 cookie 中的信息会在 Web 服务器和用户的 Web 浏览器之间自动传输。这意味着编写在
    Web 服务器上的 CGI 脚本可以读取和编辑存储在用户硬盘驱动器上的 cookie 信息。


    JavaScript 允许你使用 `Document` 对象的 `cookie` 属性来管理 cookie。JavaScript 语言可以创建、读取、修改和删除应用于活动网页的
    cookie。


    ## 如何创建 Cookie？


    生成 cookie 最简单的方法是将一个字符串值赋给名为 `document.cookie` 的对象。你应该使用的语法是：


    ![Description: 00039.jpeg](img/00043.jpeg)


    在此语法中，`expires` 是完全可选的。如果你在此字段中输入有效的时间或日期，cookie 将在该特定的时间或日期过期。你将无法访问存储在过期 cookie
    中的值。


    **重要说明**：你不能将空格、逗号或分号保存到 cookie 中。因此，在将它们保存到 cookie 之前，你必须使用 `escape()` 函数对这些字符进行编码。如果你这样对字符进行了编码，还需要使用
    `unescape()` 让系统读取你存储的值。


    ## 如何读取 Cookie


    你可以轻松地读取 cookie。这是因为 cookie 是存储在名为 `document.cookie` 对象上的值。这意味着你可以随随地使用该字符串来访问
    cookie。基本上，`document.cookie` 包含一组由分号分隔的 `name=value` 节点。在这里，`name` 是 cookie 的名称，`value`
    是 cookie 的字符串值。


    ## 如何设置 Cookie 的过期日期


    在某些情况下，你必须将 cookie 的寿命延长到当前浏览话之外。通过这样做，你可以完成长时间的过程而无需重新输入任何信息。JavaScript 允许你设置你偏好的过期日期并将该信息保存在
    cookie 内部。你可以通过自定义 cookie 的“expires”属性来实现这一点。


    下面的图片显示了如何设置 cookie 的过期日期。它将当前的过期日期延长了一个一个月。


    ![Description: 00040.jpeg](img/00044.jpeg)


    ## 如何删除 Cookie


    在大多数情况下，你必须在使用 cookie 后删除它们。这确保了 Web 服务器不会从必要的 cookie 中获取任何信息。删除 cookie 非常简单直接。你只需要将过期日期设置为过去的某个时间即可。


    ## 结论


    感谢你读到 JavaScript 的最后。希望这些内容具有启发性，并能够为你提供实现目标所需的所有工具，无论这些目标是什么。


    下一步是使用这些知识。去实践并开始使用一些 JavaScript 框架吧。强化你所学一切知识的方法就是通过实践。你将不会熟悉它们中的每一个，有时你甚至会感到非常困惑，但如果你坚持下去，我保证这是值得的，你将成为一名出色的
    Web 开发者。


    许多人认为，学习正确编程的唯一方法是回到学校或其他教育中心。但我认为并非如此。得益于在线通信的巨大进步，你可以轻松地通过网络教程和视频学习并掌握任何新技能。可供你掌握的信息是无尽的。


    JavaScript 并不是一个仅供天才和极客使用的程序。这是一门非常标准化的语言，任何人都可以轻松学会。就像现实中的语言一样，这种语言也将帮助你开启无限的可能性和机会。


    到此时，你可能在想，JavaScript 的未来究竟是什么？通过学习所有这些，我可以期待获得什么？


    自从那篇将 Ajax 推向前线的白皮书以来，JavaScript 一直在不断发展。每年都有大量的新的 JavaScript 框架被推出，它们对于各种不同的用途都非常出色，预计会有更多的框架出现。


    JavaScript 的未来更多是关于你的未来。如果未来的 ECMA 标准中增加了更多功能，如果有更多人使用 Web，以及如果 Web 平台趋成熟，JavaScript
    将变得更加流行。同样，JavaScript 会随着 PHP 和 CSS 一起成熟。预计 JavaScript 在未来将继续发展。


    如果你想成为 Web 开发者，你必须学习 JavaScript 并关注它的框架，因为这些框架将让你跟上趋势。


    随着技术变得越来越先进，对 JavaScript 程序员的需求也会增加。目前有许多被归类其他常用脚本语言（如 `Python`）的内容可以移植到 JavaScript
    中。自然语言处理和机器翻译只是将不可避免地移植到 JavaScript 的两个例子，从而增加了需求。


    JavaScript 不仅用于创建漂亮的网页；网页的实际效用正在扩大。考虑到这一点，JavaScript 将进阶到这一步，因为网页现在能够执行非常复杂的动作。基于浏览器的
    HTML/CSS/JavaScript 游戏的出现也进一步支持了这一点。


    作为一名 JavaScript 程序员，请预计该行业需要更多程序员。因此，对你自己能做的最好的事情之一就是学习 JavaScript 并不断提升学习。


