    计算机每秒都在进行数百万次你无法察觉的微小计算。所有的计算都是通过计算机最底层你看不见的 0 和 1 完成的。通过这一点，多年来我们研究出这些 0 和 1
    是可以被控制和操纵的：首先，通过开发与计算机处理器本身协同工作的语言（`assembly` ）；其次，通过开发作为复杂的 0 和 1 与程序员之间桥梁的语言。


    随着如今计算机变得越来越流行和强大，对编程感兴趣的人希望学习那些使用和理解起来不是那么离谱困难的语言。因此，随着时间的推移，由于越来越多的人开始编程作为爱好，编程语言也变得变得简单得多。多年来计算机处理能力的提升以及面向对象范式的标准化，促成了远比以前简单的语言的发展。


    ## JavaScript 的历史


    为了理解 `JavaScript` 本身，我们必须首先学习它的历史。20 世纪 70 年代，有一个叫 `Bell Labs`（贝尔实验室）的地方，它是 `AT&T`
    所有并管理的。许多重要的技术进步都源于 `Bell Labs`。你可能听过其中最重要的进展之一就是 `Unix` 系统。


    `Unix` 是一个里程碑。它是一个开源且简单的操作系统，其直观性足以使其能够同时向企业、开发者和大学进行市场推广，而不会侵占彼此的市场。这是由 `C` 编程语言的发展所推动的。


    `C` 编程语言本身也有一段悠久的历史，但本质上，它是第一个几乎任何人都能学会的简单且直观的语言。它提供了一层对系统本身的抽象，并赋予了程序员审视系统构建的能力，从而能够更好地理解计算机。这允许程序员直接管理某些事务，例如内存分配，或者程序为了执行某些进程而占用的内存量。简而言之，`C`
    让程序员能够更好地理解系统。然而，他们被要求处理大量困难的信息，并且容易进行操作，例如操纵计算机的处理能力。


    `Unix` 最终用 `C` 语言而不是标准的 `Assembly` 代码重写。这就是 `C` 变得如此著名的原因之一。这是一件大事，因为它意味着任何可以运行
    `C` 编译器的处理器（即将人类可读的编程代码转换为计算机可以理解的 `Assembly` 代码的程序）都可以运行 `Unix`。现在，这个程序可以在任何带有
    `C` 编译器的系统中进行编译。这使得该程序在全球范围内极其流行。


    此外，由于 `C` 是开源的，大学经常向学生教授这种语言，这样即使他们无法立即为电脑编译 `Unix`，他们至少可以修改代码以便在电脑上运行 `Unix`。此外，`Unix`
    对 `C` 有益，反之亦然，因为首先，大学教授 `C` 是为了让学生在处理 `Unix` 课程之前获得经验；其次，`Unix` 带有一个 `C` 编译器，这使得人们在
    `Unix` 系统上编写和运行代码变得更容易。


    这似乎是一个无关紧要的细节，但它是 `JavaScript` 整体发展的一个重要因素，也是现代编程语言发展的关键部分。这是因为这些语言可以激发许多不同的语言。例如，极其流行的
    `Java`、`Python` 和 `C++` 都在不同程度上都受到了 `C` 的启发。


    `JavaScript` 也不例外。然而，在这一背景下，让我们回想一下 80 年代末和 90 年代初的计算领域图景是什么样的。由于 `C` 和 `Unix`
    的流行，普通大众开始缓慢接触计算机。这些语言的流行和易用性意味着，许多应用程序正在为大量的计算机而构建，且每年大约呈指数级增长。


    然而，`Internet` 在许多方面仍然处于婴儿阶段。例如，网络浏览器并不流行，也远未达到其技术巅峰。在许多方面，网络浏览器以及网页本身都要简单得多、更不复杂得多。


    ## 静态网页与动态网页


    目前，网页主要由通过 `HTML` 渲染的基础文本标记组成。除非有必要，否则本书将不会涉及 `HTML`。因此，假设你已经了关于它的工作知识。毕竟，`JavaScript`
    是与 `HTML` 和 `CSS` 并列的三大 Web 开发语言之一。所以，学习 `HTML` 和 `CSS` 也是值得的。


    总之，早期的网络浏览器被称为静态网页。静态网页是动态网页的对面，动态网页设计仅用于反射和渲染文本和图像。基本上，一旦静态网页加载，在不更改和重新加载网页文件的情况下，无法从页面内部进行更改。


    动态网页——或可以在不更改网页文件本身的情况下实时更改的页面——是通过所谓的客户端脚本实现的。客户端脚本是关于允许变化仅在浏览器端在网页上发生。也就是说，客户端脚本允许复杂的逻辑和动态变化在用户的网络浏览器环境中运行。任何更改都在他们的机器上和他们的浏览器内进行，并不意味着向服务器传输了信息。


    本质上，`JavaScript` 和所有相关语言都是为了赋予网页生命。它是关于获取网页并使其能够做事情而不仅仅是静止。这种功能在很长一段时间内只是那些期待
    Web 开发的人眼中的一光。然而，这并不意味着脚本在很久以前不存在。早期就支持旨在允许网页进行更多交互的技术。然而，这些技术非常原始。早期的图形化网络浏览器即使在婴儿时期也能运行脚本。


    这导致了另一个浏览器 `Mozilla` 的诞生，它启发了 `Firefox` 的开发。然而，当时的 `Firefox` 远未成为一个因素。官方上，该浏览器作为
    `Netscape` 发布，它被许多人认为是 90 年代最流行的浏览器之一，如果你在 90 年代使用计算机，那么你可能正在使用 `Netscape`。


    90 年代中期，在网页中嵌入代码的想法——即用其他编程语言编写的、可以直接插入网页中并从网页中运行的代码——开始变得变得更加流行。然而，关于实用嵌入语言的流程信息仍然不够。`Java`
    在某种程度上实现了这一目的，但它并不简单。事实上，它消失了，因为它需要大量的原始计算能力才能使用。需要一种更好的替代方案，一种可以可以直接嵌入并更改网页的东西。这种东西当时存在。


    `Netscape` 决定创建一种可以在 `HTML` 文档中运行，并在浏览器内部被轻松嵌入和解释的脚本语言。这种语言应该显示出与 `Java` 和 `C++`
    相似的语法。信不由信，一种受 `C` 启发的脚本语言在当时是相对新颖的。

