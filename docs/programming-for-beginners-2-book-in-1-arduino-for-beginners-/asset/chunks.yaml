    ## 字符串运算符


    字符串运算符用于对字符串进行操作：


    我们可以使用 `+` 运算符来连接或相两个字符串。例如：


    ```javascript

    txt1 = "Jane";

    txt2 = "Deer";

    txt3 = txt1 + " " + txt2;

    ```

    `txt3` 将输出结果为：

    Jane Deer


    我们也可以使用 `+=` 运算符将字符串相加：


    ```javascript

    txt1 = "What a wonderful ";

    txt1 += "sunny day";

    ```

    `txt1` 将输出结果为：

    What a wonderful sunny day


    尽管这被称为赋值运算符，但当我们在字符串上使用 `+` 运算符时，它被称为拼接运算符。


    ## 字符串与数字


    如果你将两个数字相加，输出是这些数字的和；但如果你将一个字符串和一个数字相加，输出是一个字符串：


    ```javascript

    x = 5 + 10;

    y = "5" + 10;

    z = "Hello" + 10;

    ```

    输出将是：

    15

    510

    Hello10


    ## 比较运算符和逻辑运算符


    我们使用这些运算符来测试条件或语句是否真，即判断值或变量之间是否存在相等性或差异。


    ### 比较运算符


    假设 `x = 5`，下列表解释了比较运算符：


    | 运算符 | 说明 | 示例 | 返回 |

    | :--- | :--- | :--- | :--- |

    | `==` | 等于 | `x == 8` | false |

    | | | `x == 5` | true |

    | | | `x == "5"` | true |

    | `===` | 值相等且类型相等 | `x === 5` | true |

    | | | `x === "5"` | false |

    | `!=` | 不等于 | `x != 8` | true |

    | `!==` | 值不相等或类型不等 | `x !== 5` | false |

    | | | `x !== "5"` | true |

    | | | `x !== 8` | true |

    | `>` | 大于 | `x > 8` | false |

    | `<` | 小于 | `x < 8` | true |

    | `>=` | 大于等于 | `x >= 8` | false |

    | `<=` | 小于等于 | `x <= 8` | true |


