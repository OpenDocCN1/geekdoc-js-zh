    {        name10 = prompt(''Please enter name 10: '');    }} |


    Now imagine if social media sites used this method to register the users; programmers
    would have to keep recoding the site in order to accommodate more users! Fortunately,
    we have arrays to help us.


    Arrays, in a nutshell, can store lists of data that could even have different
    data types. The data stored have fixed positions, so you’re sure of where each
    data is placed and can therefore retrieve them reliably. Here are examples of
    array declarations:


    | var strings = ["apple","grapes","tomatoes"];var numbers = [1, 2, 3, 4, 5];var
    stringsAndNumbers = ["Oceans", 11]; |


    As you may have noticed, the declaration statements for arrays are pretty similar
    to the declaration statements for regular variables; the only difference is that
    the data are enclosed in braces and separated by commas. If you want to create
    an empty array, you can leave the braces blank and add a couple of items later
    using the push() function, for instance:


    | var numbers = [];for (var counter = 1; counter <= 10; counter++){    numbers.push(counter);}
    |


    Now we can go back to our previous attempt at getting ten names! Let’s see how
    using arrays drastically improves our code:


    | var names = [];for (var counter = 1; counter <= 10; counter++){    names.push(prompt(''Please
    enter name '' + counter + '':''));    console.log(''Obtained name '' + counter);}
    |


    Our code just became much more efficient and much better to look at! Congratulations! 


    So far, you’ve learned how to declare arrays and put stuff in them, but how exactly
    can we access what’s inside them? Well, the position of the items we place inside
    the array stay in the same spot, so we only need to know what the name of the
    array is and the numerical position of the item we’ve stored.


    One small caveat though: in programming, we always start counting from 0, so if
    you have 10 items in an array, your first item will be in the 0th place while
    your last item will be in the 9th place. That being said, if you want to access
    the names you’ve just collected, simply do something like:


    | console.log(names[0]); //for the 1st nameconsole.log(names[9]); //for the 10th
    name |


    Sometimes, when you just keep adding stuff to an array, you may lose track of
    how big it is. Fortunately we can just use the ''.length'' keyword we normally
    add to strings in order to count the number of characters. For instance, if we
    were to count the number of names stored in our variable ''names'', we’d need
    to just append .length to ''names:


    | names.length |


    Great job! You’ve now learned how to create arrays and how to put stuff inside
    them. As an exercise, create a for-loop that prints out every name from the ''names''
    array into the console. Hint: the ''counter'' variable comes in handy when keeping
    track of the index of the array.


    Prototypal inheritance


    In programming, we mostly want to take something and extend it.


    For example, we have a user object with its functionality and methods, and we
    want to make the administrator and the foreigner slightly modified. We want to
    reuse what our users have, not copy / complete its methods, just build a new object
    on it.


    The inheritance of prototypes is a characteristic of the language that contributes
    to it.


    Prototype


    Objects in JavaScript have a special hidden property [[Prototype]] (as defined
    in the definition) which is either null or refers to another object.


