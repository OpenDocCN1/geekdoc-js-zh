  trans: "\n\n# 构造函数重载\n\n与其他函数一样，构造函数也可以被重载为多个函数定义，这些定义具有相同的名称，但具有不同的参数类型或数量。请记住，为了使重载生效，编译器将调用其参数与函数调用中所使用的值相匹配的某一个。由于构造函数是在创建对象时被调用的，因此执行的是与对象断言中传递的值相匹配的那个特定情况。\n\
    \n## 默认构造函数\n\n如果你在类定义中没有声明任何构造函数，编译器会认为该类拥有一个无参数的默认构造函数。编译器不仅会在你没有创建自己的构造函数的情况下，还会为你创建一个默认构造函数。\n\
    \n在确实没有声明自己的构造函数的情况下，系统总共会声明三个特殊的函数。它们是：拷贝构造函数、默认析构函数和拷贝赋值运算符。\n\n拷贝构造函数和拷贝赋值运算符会将另一个对象中包含的所有信息复制到当前对象的成员中。\n\
    \n## 类指针\n\n创建指向类的指针是完全合法的。我们本质上需要考虑的是一旦声明，类就变成了一种实质的数据类型，因此我们可以使用类名作为指针的数据类型。\n\
    \n示例：\n\n```\nmyRectangle * pointerRect;\n```\n\n`pointerRect` 是一个指向 `myRectangle`\
    \ 类对象的指针。\n\n正如结构体一样，为了专门引用指针所指向对象的特定成员，我们可以使用间接箭头运算符（`->`）。\n\n## 运算符重载\n\nC++\
    \ 整合了使用标准运算符对类执行操作的方案，而不仅仅是基本数据类型。C++ 有一种功能，允许你通过计划准备好的类来利用标准运算符执行操作来重载运算符。\n\n\
    为了通过特定目标重载运算符以便在类中使用它，我们声明运算符函数，这些是同名的一致函数，其名称是我们需要重载的运算符符号所模拟的函数关键字。其格式为：\n\n\
    ```cpp\n<data type> <operator> <operator sign> (<parameters>)\n{\n    //Code\n\
    }\n```\n\n这里有一个重载加法运算符（`+`）的示例。我们将创建一个类来存储 2D 向量，然后我们将包含两个向量：`(2,4)` 的 a 和 `(3,4)`\
    \ 的 b。两个 2D 向量的加法操作非常基础，只需将两个 x 方向相加得到后续的 x 方向即可。该操作对点‘a’和‘b’执行的结果应该是 `(2+3, 4+4)`，等于\
    \ `(5, 8)`。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nclass myVector\
    \ {\n  public:\n    int a, b;\n    myVector () {};\n    myVector (int, int);\n\
    \    myVector operator + (myVector);\n};\n\nmyVector :: myVector (int x, int y)\
