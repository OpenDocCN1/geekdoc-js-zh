    `DigitalReadSerial`: 此命令允许 Arduino 读取开关。然后，Arduino 将通过向串口监视器打印状态来使其可见。


    ## 模拟 (Analog)


    模拟命令专为 Arduino 板板上的模拟输入和输出设计。这些包括 `Analog Input`、`AnalogInOutSerial`、`Calabration`、`AnalogWriteMega`、`Smoothing`
    和 `Fading`。


    - `Analog Input`: 该命令配合电位器使用，根据需要使 LED 闪烁。

    - `AnalogInOutSerial`: 该命令的工作原理是首先读取模拟输入引脚。然后，`AnalogInOutSerial` 对输入引脚的结果进行映射，并使用这些结果使
    LED 变亮变暗。

    - `Calibration`: 该命令用于通过最小值和最大值来为模拟传感器定义预期值。

    - `AnalogWriteMega`: 该命令专为 Arduino Mega 微控制器设计。它会按顺序使 12 个独立的 LED 闪烁和熄灭。

    - `Smoothing`: 平滑命令用于对多个模拟输入读取值进行平滑处理。

    - `Fading`: 正如命令名所示，淡出命令负责使 LED 产生淡入淡出效果。它是通过 PWM 引脚实现的。


    ## 数字 (Digital)


    数字功能可以播放音调、控制 LED 功能以及读取推按钮。这些功能包括 `Simple Keyboard`、`Tone`、`Tone4`、`Pitch Follower`、`Debounce`、`Button
    State Change`、`Button` 和 `Blink Without Delay`。


    - `Simple Keyboard`: 通过蜂鸣扬声器和压力传感器将您的 Arduino 变成带有三个键的音乐键盘。

    - `Tone`: 该命令配合蜂鸣扬声器使用以播放旋律。

    - `Tone4`: 使用 `tone` 命令配合多个扬声器播放连续的音调。

    - `Pitch Follower`: 使用模拟输入和蜂鸣扬声器播放特定的音高。

    - `Debounce`: 该命令通过读取连接到 Arduino 的推按钮来过滤噪声。

    - `Button State Change`: 该命令允许 Arduino 计数按钮按下的次数。

    - `Button`: 按钮命令允许 Arduino 在连接的推按钮被按下时控制 LED。

    - `Blink Without Delay`: 该命令允许板子上的 LED 在不使用延迟函数的情况下闪烁，这意味着它可以闪烁得更快或保持常亮。


    # 第 13 章：C 语言基础


    ### 内存映射 (The Memory Maps)


    当你创建一个 Arduino 程序时，了解计算机系统的工作原理至关重要。尽管 C 语言是接近机器的语言，但当程序运行时某些事的执行方式将会变得清晰。


    一个主系统由称为 CPU 或微控制器的控制设备组成。在某些方面存在一些差异。我们稍后将深入探讨。只需提一下，与标准微处理器相比，微控制器可能并不强大。然而，它仍然包含输入输出端口以及硬件功能。


    微处理器连接到外部内存。通常情况下，微控制器包含足够的板载内存。但需要注意的是，我们指的不是大容量；对于简单的应用程序，微控制器可能只有几百字节的内存。不要忘记一个内存字节有
    `8` 位，每个位可以是真或假、高电平或低电平以及 `I/ O`（此处应为：一个内存字节有 `8` 位，每个位可以是真或假，高或低以及 `I/ O`）。


    当涉及到处理器与存储在内存中的功能数据之间的关系时，数据必须保持在处理器的寄存器中。寄存器是我们可以执行逻辑数学运算的场所。例如，如果你想对两个变量进行加法，变量的值必须移动到寄存器。


    ### 内存映射 (Memory Maps)


    计算机系统中的每个内存字节都有一个连接的地址。现在，如果没有地址，处理器将没有手段识别特定的内存。通常，内存地址从 `0` 开始递增。尽管我们有具有私有或唯一系统的特定地址，但某个地址可能并不指向外部通信的输入输出端口。


    大多数时候，你会发现有对内存进行映射。这仅仅是一个巨大的内存槽数组。我们有人开发内存映射，并将值最小的地址放置在顶部，而另一些人绘制内存映射并将最小地址分配在底部。每个地址都指向一个可以存储字节的地方。然而，C
    编译器会完成工作。例如，如果我们将 `char` 变量声明为 `-X`。它可能位于地址 `2`，所以如果我们打印该值，就不需要手动选择地址 `2` 处的值了。相反，我们将编写“选择
    X 值”，而编译器会产生代码以确保它在正确的地址上正常工作。这种级别的抽象简化了整个过程。但是，由于大多数变量携带的量大于一个字节，我们可能需要收集这些地址来仅持有单个值。例如，如果我们选择一个
    `short int`，它将要求我们两个字节。现在，如果下一个地址从 `four` 开始，则需要使用地址 `5`。当我们选择访问这个特定变量时，编译器会自动构建代码并利用所有地址，因为它知道
    `short int` 的存在。


    ### 栈 (Stacks)


    大多数程序员倾向于为变量使用临时存储器。这意味着某些变量会被很短一段时间，然后就会被丢弃。因此，如果我们继续并为这个特定变量分配永久空间将是不正确的。通常，一个应用程序由两部分组成：代码和数据。数据部分是永久的，因为这两个部分无法消耗整个内存；剩余内存通过栈临时使用。它从内存映射的对端开始；栈向数据部分代码部分增长。它类似于一叠托盘。栈上的第一个托盘是最后被拿走的。任何需要临时变量时，这部分内存就会被使用。由于需要许多项目，内存会被用尽。当代码结束时，声明的临时变量不再有用，因此栈会收缩。


    ### C 语言基础 (The Basics of C-language)


    C 语言是为希望用更少的代码完成许多任务的专业开发人员设计的。C 是一种编译型语言。这意味着一旦我们写了程序，必须将其传递给编译器，开始将 C 语言指令转换为微控制器可以管理的机器码。


    如你所见，这是一个额外的步骤，但与解释器相比，它会产生一个更好的程序。之后，解释器将从机器语言转换代码。


    然而，C 与其他语言不同。它是一种流式语言。我们有语句、函数和变量。正如我们已经看到的，变量是存储内容的对象。语句包含赋值、操作等。


    函数包含语句并可以调用其他函数。


