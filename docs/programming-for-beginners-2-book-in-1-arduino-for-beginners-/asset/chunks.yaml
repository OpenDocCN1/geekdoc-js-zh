    its members notwithstanding those of myPolygon we could compose them accordingly. 


    Implementing Polymorphism


    Before getting into this segment, it is prescribed that you have a legitimate
    understanding of pointers and class inheritance. In the event that any of the
    accompanying explanations appear unusual to you, you ought to audit the showed
    segments:


    Pointers to base class


    One of the key peculiarities of inherited classes is that a pointer to an inferred
    class is sort good with a pointer to its base class. Polymorphism is the craft
    of exploiting this straightforward however compelling and flexible peculiarity
    that brings Object Oriented Methodologies to its maximum capacity.


    Virtual Members


    A part of a class that could be reclassified in its inferred classes is known
    as a virtual member. With a specific end goal to declare a part of a class as
    virtual, we must place before its statement the keyword virtual.


    What the virtual keyword does is that it permits a part of a determined class
    with the same name as one in the base class to be properly called from a pointer,
    and all the more accurately when the kind of the pointer is a pointer to the base
    class yet is indicating an object of the inferred class.


    Abstract Base Class


    The fundamental distinction between a theoretical base class and a customary polymorphic
    class is that in light of the fact that in conceptual base classes no less than
    one of its parts needs usage, we can''t make cases (items) of it. Be that as it
    may a class that can''t instantiate objects is not completely futile. We can make
    pointers to it and exploit all its polymorphic capabilities.


    Virtual members and dynamic classes stipend C++ the polymorphic qualities that
    make item situated programming such a helpful instrument in huge activities. Obviously,
    we have seen exceptionally basic employments of these features, however these
    peculiarities could be connected to exhibits of items or progressively apportioned
    objects.


    Custom Constructors


    As you may have noticed, having to create and assign properties every time for
    similar objects is quite a hassle. Since smartPhone1 and smartPhone2 are both
    classified as phones, then they’re bound to have similar methods and properties.
    With that in mind, we can do something like this to make our code cleaner:


    | function Phone(screenSize, pixelDensity, processorNumber, processorSpeed, simCardNumber){ 
      this.screenSize = screenSize;    this.pixelDensity = pixelDensity;    this.processorNumber
    = processorNumber;    this.processorSpeed = processorSpeed;    this.simCardNumber
    = simCardNumber;    this.textNumber =  function(number, text)    {        console.log("''"
    + text + "'' sent to " + number);        console.log("Processing time: " + text.length/this.processorNumber); 
      };    this.setSimCardNumber = function(newSimCardNumber)    {        this.simCardNumber
    = newSimCardNumber;    };}//Now we can create our two smart phones using the constructor
    we’ve just made!var smartPhone1 = new Phone(5, 200, 2, 500, 123456);var smartPhone2
    = new Phone(6, 400, 8, 2000, 654321);//let’s add a new phone!var simplePhone1
    = new Phone(2.5, 100, 1, 80, 111111); |


    See how it makes our code much shorter? In real life, this would be the equivalent
    of creating a factory - you systemize the creation of objects while allowing a
    certain number of customizations to be made after the basics are taken care of. 


    Using Object Literal


    The object literal method uses the var keyword similar to defining a variable.


    var dog = {name: “Abby”, eyeColor: "brown", age: 7};


    Also, similar to defining variables, you can define the object first and add the
    properties at a later time.


    var dog = {};


    dog.name= “Abby”;


    dog.eyeColor= "brown";


    dog.age= 7;


    Node tree


    All HTML elements and attributes are nodes in the Document Object Model (DOM).
    Take a look at the following HTML code as a starting point: < html >


    < head >


    < title > The title </ title >


    </ head >


    < body > The body


    </ body >


    </ html >


    Arrays


    What is an array?


    A parameter can have a list of values. Take, for example, the variable color.
    The values for these are red, blue, and yellow. Instead of defining a variable
    for each (eg. color1=red, color2=blue, color3=yellow), we use arrays to simplify
    the way we store multiple values or lists of values in a variable.


    An array can also contain arrays inside. This is called multidimensional arrays.


    Creating An Array


    One Dimension Array


    Let’s take a look on how we can use arrays in our code.  Arrays are created in
    a similar way to how we create a regular variable.


    Syntax:


    There are two ways to create an array:


    var colors = new Array (“red”, “blue”, “yellow”);


    Or you may directly define it like this:


    var colors = [red”, “blue”, “yellow”];


    To assign and access the values inside an array, we refer to them by their element
    and index number. The numbers [0-2] in the sample below are the index numbers.
    The colors red, blue, and yellow are the corresponding array elements.


    colors[0] = red


    colors[1] = blue


    colors[2] = yellow


    You may also define an array name first and add values at a later time:


    var colors = [];


    colors[0]= “red”;


    colors[1]= “blue”;


    colors[2]= “yellow”;


    colors[55]= “green”;'
