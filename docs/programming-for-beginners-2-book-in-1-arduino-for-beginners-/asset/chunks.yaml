    \n```javascript\nfor (let i = 0; i < 10; i++) {\n  console.log(i);\n}\n\nfunction\
    \ repeat(n, action) {\n  for (let I = 0; I < n; I++) {\n    action(i);\n  }\n\
    }\nrepeat(3, console.log);\n// → 0\n// → 1\n// → 2\n```\n\n有时你不需要在循环中调用一个预定义的函数来重复，而是创建一个函数值作为替代：\n\
    \n```javascript\nlet labels = [];\nrepeat(5, i => {\n  labels.push(`Unit ${i +\
    \ 1}`);\n});\nconsole.log(labels);\n// → [\"Unit 1\", \"Unit 2\", \"Unit 3\",\
    \ \"Unit 4\", \"Unit 5\"]\n```\n\n这种方法的布局类似于循环；它定义了循环的类型，然后生成循环体。尽管循环体是写在 `repeat`\
    \ 调用括号内的函数中。\n\n## 高阶函数\n\n高阶函数是指通过参数接收或返回来作用于其他函数的函数。这种类型的函数允许用户对操作进行抽象。例如，你有一个函数可以产生函数：\n\
    \n```javascript\nfunction greaterThan(n) {\n  return m => m > n;\n}\n\nlet greaterThan10\
    \ = greaterThan(10);\nconsole.log(greaterThan10(11));\n// → true\n```\n\n## 使用\
    \ map 进行转换\n\n`map` 方法通过为数组的每一个元素设置一个函数来更改数组，并根据返回值创建一个新数组。新数组的长度与输入数组相同，但它将通过函数将其内容映射为新的形式。\n\
    \n## 使用 reduce 进行总结\n\n当你相加数字时，从零开始并将每个遍历元素加到总和上。`reduce` 的参数是 map 函数组合和初始值。这个函数比\
    \ `filter` 和 `map` 容易理解得多。\n\n当你想要组合操作时，可以使用高阶函数。例如，这里有一行代码用于在数据集的人类脚本中搜索生存和死亡脚本的平均年份。\n\
    \n该代码块显示死亡脚本比生存脚本更老。\n\n让我们从整个脚本开始，过滤掉死亡的（或生存的），剔除它们的年份，取平均值并完成结果。你也可以将这些计算写为一个大循环：\n\
    \n我们的两个示例并不相同，第一个在执行 `map` 和 `filter` 时会创建新数组，而第二个只计算数字。\n\n## 字符串与字符编码\n\n数据集的一个重要用途是找出某文本块使用的是哪种脚本。下面是一个执行该任务的程序。\n\
    \n另一个高阶函数是相同的方法。该方法获取一个测试函数，并判断该函数是否对数组中的任何组件返回 true。\n\nJavaScript 字符串上进行一些操作，例如使用\
    \ `length` 属性获取其长度，通过方括号评估其内容。\n\nJavaScript 的 `charCodeAt` 方法提供一个完整的 Unicode\
    \ 字符。该方法用于从字符串中获取字符。尽管发送给 `codePointAt` 的参数仍然是代码单元序列中的索引。如果你使用 `codePointAt` 遍历字符串，它产生的是真实的字符而不是代码单元。\n\
    \n## 识别文本\n\n你有了 `Script` 函数和一种正确遍历字符的方法，现在计算每个脚本拥有的字符数量。\n\n`countBy` 函数预期一个集合（一组数字、元素或任何你可以用\
    \ `for/of` 遍历的项）以及一个为指定元素计算组名称的函数。它返回一个对象列表。每个对象命名一个组并确定该组包含的数量。\n\n`findIndex`\
    \ 方法类似于 `indexOf`。该方法用于搜索第一个让指定函数返回 true 的元素，如果没有找到则返回 -1。\n\n## 总结\n\n将函数值传递给多个函数是\
    \ JavaScript 的一个基本特性。它允许编写带有“间隔”的函数。数组提供了多个高阶方法。使用 `forEach` 遍历数组。使用 `filter`\
    \ 方法返回一个符合谓词函数的新数组。通过 `map` 设置每个项来更改数组。使用 `reduce` 将数组的每个组件合并为一个值。\n\n## 练习\n\n\
    演示一个 JavaScript 函数，接收一个数字数组并搜索第二小和第二最大的数字。\n\n## 答案\n\n![Description: 00009.jpeg](img/0041.jpeg)![Description:\
    \ 00010.jpeg](img/0042.jpeg)\n\n# 第 7 章：什么是 JavaScript Cookie\n\n解释创建、读取和删除 Cookie。\n\
    \n## 什么是 Cookie？\n\nWeb 服务器和浏览器利用 HTTP 进行通信。然而，HTTP 协议是无状态的（即它将请求视为独立的事务）。这意味着系统不会记住先前的任何事务。这对于商业网站来说是一个巨大的问题，因为它们需要在不同的网页之间共享用户信息。\n\
    \n在大多数情况下，Cookie 帮助网站跟踪和记忆交易；因此， Cookie 可以帮助你提高网站的友好性和整体流量。\n\n## Cookie 如何工作？\n\
    \nWeb 服务器将信息作为 Cookie 发送给用户的互联网浏览器。如果浏览器接受了 Cookie，该信息将在用户的硬盘中转换为明文。一旦用户访问你网站的另一个页面，他的浏览器会将相同的\
    \ Cookie 发送给 Web 服务器进行数据检索。一旦检索了数据，你的 Web 服务器就会知道之前发生过什么。\n\n"
