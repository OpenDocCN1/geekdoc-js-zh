    Bitwise Operators


    These are not commonly used in JavaScript. Not nearly as much as we use the other
    types of operators. We will discuss these operators in order, to have a complete
    understanding of what JavaScript can do.


    When bitwise operators are used, the operands are transformed into their 32-bit
    binary representation, perform the operation, and convert the results back to
    decimal. 


    Let’s take the value 12 for example. 


    This is 12 represented in binary:


    00000000000000000000000000001100


    Starting from the rightmost bit, each bit represents a value from 20-231.  To
    represent 12, the 3rd and 4th bit are set to 1. This signifies a value of 23+22
    = 12\.


    The example above expresses a positive integer. To express a negative number in
    binary, we make use of the two’s complement rule.


    Let’s convert -12 to binary.


    The first step is to flip all the values. 


    00000000000000000000000000001100


    11111111111111111111111111110011  // Flip all values 0 to 1 and vice-versa


    Next, add 1 to the result. 


    11111111111111111111111111110100  // Add one to the rightmost bit


    The above is the binary equivalent of -12.


    Now let’s have a look at what JavaScript can do with binary.


    | Operator | Description | ExampleA=3 Binary: 0011B=2 Binary: 0010 |


    | & | Bitwise AND (Do Boolean AND on each bit) | C = A & B; C=2 |


    | &#124; | Bitwise OR (Do Boolean OR on each bit) | C = A &#124; B; C=3 |


    | ~ | Bitwise NOT (Reverses all the bits in the operand) | ~A is equal to -4 |


    | >> | Right shift (In the first operand, all the bits are moved to the right
    by the number of places stated in the second operand.) | B >> 1 is equal to 1
    |


    | >>> | Right shift with zero (Bit are shifted to the right, removing the bits
    that shifted off, and zeros are added from the left)  | B >>> 1 is equal to 1
    |


    Exercise: Use the code below to demonstrate how to use bitwise operators. Manually
    solve the statements and check if you got the correct answer.


