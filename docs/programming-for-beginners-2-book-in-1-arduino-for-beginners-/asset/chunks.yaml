  trans: "\n\nC 语言中的变量命名非常简单。变量名包含数字、下划线和字母。你也可以结合大小写字母。然而，长度不能超过 31 个字符。不过，实际限制取决于\
    \ C 编译器。此外，变量不能包含保留关键字或特殊字符，如分号、逗号和其他特殊字符。因此，有效的名称可以是如 `resistor8`、`volt5` 和 `we_are_variables`。\n\
    \nC 语言有不同的变量类型。其中一些由两种形式的浮点和实数组成。首先是 32 位的 `float`，然后是 `double`。我们还有几种整数类型，包括\
    \ `char`、16 位的 `short int` 和 32 位的 `long int`。虽然 `char` 只有 8 位，但仍有 2 的 8 次方组合——或者说\
    \ 256 个独立值，你会发现它非常适合单个 ASCII 字符。\n\n与其他语言类似，C 语言拥有数组和复合数据类型。在涉及 C 语言的变量时，在使用变量之前对其声明是至关重要的。变量不能像\
    \ Python 语言那样瞬间创建。变量声明由变量类型和变量名组成。你也可以在声明期间为变量包含初始值，但这是可选的。C 语言仍然允许进行多个变量声明。例如：\n\
    \n```\nFloat c = 1.2;\nChar c;\nUnsigned char x;\n```\n\n你应该注意，每种变量声明都以分号结尾。像\
    \ `Java` 等许多其他编程语言一样，分号表示该语句的结束。\n\n## 函数\n\n函数的命名规则与变量相似。所有函数都有类似的相似语法：`Return_value\
    \ function_name (function argument list) { Statement( s) }`。你可以借鉴数学函数的概念，为其分配一些值(s)\
    \ 并回传一些值。例如一个包含 `cosine` 函数的计算器。你可以给它分配一个角度，这将返回一个特定的值。C 语言中的函数可以包含独立的参数。此外，C\
    \ 函数是可以返回值的。`void` 函数是不需要值或不返回值的函数。`void` 函数看起来像这样：\n\n```\nvoid function_name\
    \ (void)\n{\n// 此处编写必要的语句\n}\n```\n\n这看起来工作量很大，但 C 语言中的数据类型是有意义的。这意味着如果你在函数中使用了错误的变量类型，甚至使用了数量错误的变量，你将收到一个警告。\n\
    \n因此，如果你有一个 `float` 函数并尝试向它发送整数变量，编译器将向你发送警告。每个程序必须有开始和结束。在 C 语言中，所有程序都开始于 `main`\
    \ 函数。你可以看下面的程序：\n\n```\nvoid main (void) \n{\nfloat y = 3.0;\nfloat f = 2.0;\n\
    float t;\nt = y* t\n}\n```\n\n存在一个 `main()` 函数。它不接受变量也不返回任何内容。\n\n## 库\n\n之前的示例是有限的，因为很难看到结果。因此，当你想要在计算机屏幕上显示结果时，你需要一些方法。为了实现这一点，取决于库和系统函数。无数库拥有最先进的\
    \ C 系统。本质上，某些人只是测试、编译并编写了一系列函数。你需要做是将这些函数链接到程序中。链接有助于将代码和任何现有库集成到整个程序中。为了显示通用数据和输入数据，我们使用标准的\
    \ `IO` 和 `stdio`。\n\n`stdio` 库有一个名为 `printf()` 的函数。\n\n程序将在计算机屏幕上显示“Hello World”单词。它会在反斜杠-n\
    \ 组合之后插入一个新行。`\\n` 代表添加新行。如果我们未能包含 `#include` 指令，编译器将无法理解任何关于 `printf()` 的内容，并且在我们尝试使用它时会显示错误。那么，头文件呢？头文件包含许多不同的函数原型。这些原型可以被视为模板，但如果你愿意，你也可以构建自己的原型。要使用它，你需要在代码中编写正确的\
    \ `include` 语句，并且如果你记得包含链接器库代码，效果会更好。这不仅可以节省时间，还能让你复用代码。\n\n## 简单数学\n\nC 语言像其他语言一样具有某些基础数学运算符。其中一些包括\
    \ `-`、`+`、`/` 和乘法。括号有助于划分元素和处理幂优先级操作。C 语言拥有 `%` 运算符，代表取模。取模是一种处理除法余数的操作。例如，8 取模\
    \ 18 的结果当然是 2。除法对整数和浮点数都会分别进行，且没有余数。换句话说，整数 `5` 除以 `2` 等于 `2`，而不是 `2.5`。在 C 语言中，有一系列位操作符，用于此类情况。对于复杂的数学运算符，你必须深入研究数学库。一些示例包括\
    \ `log(10)`、`tan()`、`cos()` 和 `sin()`。\n\n然而，你不应该尝试使用 `^` 运算符，因为它在 C 语言中有单独的含义。那么，你还记得我们之前说的关于库的使用吗？将\
    \ `sin()` 等某些函数放入代码中会强制编译器定义原型以及其他相关信息。因此，在程序开始时，有必要包含以下行：\n\n```\n#include <\
    \ math.h >\n```\n\n## C 语言输入与输出\n\n我们知道 `printf()` 函数在屏幕上显示信息。`printf()` 是一个广泛且复杂的函数，有很多变体和格式说明符。格式说明符由\
    \ `%` 内容组成，作为值的占位符。\n\n例如，如果我们想以十进制形式显示变量的值。我们可以这样做：`printf (“ The value is %d,\
    \ in hex %x, and in octal is &o.\\ n”, value1, value1, value1);` 你应该看到我们标记变量的方式。这至关重要，因为如果你犯错并显示一个没有标签的值，将无法判断它是十六进制还是十进制。例如，如果你看到一个像\
    \ 22 的数字，你如何判断这个数字是十进制还是十六进制呢？这是不可能的。\n\n除了指示标签，你还可以指定字段宽度打印。例如，`%6d` 等同于以最小 6\
    \ 宽写入整数。同样，`%6.2f` 意味着以最小 6 空间打印浮点值。`.2` 部分是一个精确指定符，在下面的示例中，它显示小数点后两位数字。你就可以看到这个函数看起来有多强大和灵活了。C\
    \ 语言的输入函数是 `scanf()`。这类似于 Python 的 `input` 语句。尽管可以一次请求多个值，但这是最好的方法。\n\n它带有与 `printf()`\
    \ 类似的说明符。所以，有一个点需要理解，`scanf()` 函数将要求你指定值存储在计算机内存中的位置。这说明仅仅写变量名是不够的。你需要详细描述它。C\
    \ 语言有 `&` 运算符，表示地址。例如，当你想要从用户处选择一个特定的整数变量并安全地存储在 `voltage` 变量中时。这里是代码片段供你查看：\n\
    \n```\nprintf (“ Kindly type in the voltage”);\nscanf (“% d,” &voltage);\n```\n\
    \n"
