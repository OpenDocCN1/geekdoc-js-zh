    观察你的面包板时，你会看到带有红色和黑色 + 和 – 符号的方格。首先，在这里放置一个 `10uF` 电容。然后，你需要将 `7805` 电压调节器添加到面包板上。请确保将
    `7805` 的左引脚与电源输入对齐，中间的电源输出与地对齐。现在，你需要第二个 `10uF` 电容。将其放置在电源轨上。最后，如果你愿意，可以在面包板上包含一个
    LED 状态指示器。这对于故障排除是一个好主意。使用一个 `220` 电阻连接右侧和左侧电源轨。


    ## 第二步


    在第二步中，你将准备你的芯片。每个引脚都与与板上的特定插槽对齐。这将确保你的 `Arduino` 以你需要的方式运行。


    | 板板上的数字 | 对应的引脚 |

    | :--- | :--- |

    | 1 | Reset (重位) |

    | 2 | Digital Pin 0 (RX) |

    | 3 | Digital Pin 1 (TX) |

    | 4 | Digital Pin 2 |

    | 5 | Digital Pin 3 |

    | 6 | Digital Pin 4 |

    | 7 | VCC |

    | 8 | GND |

    | 9 | XTAL 1 |

    | 10 | XTAL 2 |

    | 11 | Digital Pin 5 |

    | 12 | Digital Pin 6 |

    | 13 | Digital Pin 7 |

    | 14 | Digital Pin 8 |

    | 15 | Digital Pin 9 (PWM) |

    | 16 | Digital Pin 10 (PWM) |

    | 17 | Digital Pin 11 (PWM) |

    | 18 | Digital Pin 12 |

    | 19 | Digital Pin 13 (LED) |

    | 20 | AVCC |

    | 21 | AREF |

    | 22 | GND |

    | 23 | Analog Input 0 |

    | 24 | Analog Input 1 |

    | 25 | Analog Input 2 |

    | 26 | Analog Input 3 |

    | 27 | Analog Input 4 |

    | 28 | Analog Input 5 |


    ## 第三步


    引脚就位后，在引脚 `1` 附近添加触点开关。这将在需要时重置你的 `Arduino` 面包板。然后，在开关的底部引脚和引脚 `1` 之间连接一根小的跳线导。下一步是在引脚行
    1 和电源开关之间连接 `10K` 电阻。在这一区域你将需要做的最后一件事是将 `GND` 线连接到顶部引脚。


    接下来，在 `VCC`（引脚 `7`）和 `GND`（引脚 `8`）之间连接电源和 `GND` 跳线导。然后将 `16 MHz` 晶体添加到引脚 `9` 和
    `1-` 上。接下来，从这些引脚将 `.22pF` 电容连接到 `GND`。如果你愿意，可以在这里停止，并添加一个编程芯片。然而，如果你对为编程设置面包板感兴趣，请继续阅读。


    ## 第四步


    编程所需的连接引脚包括 `GND`、`NC`、`5V`、`TX`、`RX` 和 `NC`。将来自电源轨的 `GND` 线连接到 `GND` 引脚。为 `5V`
    引脚添加一条电源线。最后，在 `TX` 引脚和 `RX` 引脚之间连接一根线。你的 `Arduino` 面包板现在准备好编程了。你可以使用所需物品中的 `USB
    – Serial Converter Cable` 完成。


    ## 如何制作电子蛇


    正确构建后，这条蛇是防水的并可以使用遥控器控制。如果这是你第一次尝试 `Arduino` 项目，你可能想从后面的章节选择一个更简单的选项开始。虽然这一部分读起来很有趣，但你可能想先制作第
    8 章的发光感雨伞、第 9 章带有闪烁转向灯的自行车夹克或第 10 章的 `Arduino` 气体传感器。


    ### 电子元件


    你需要：


    * `Arduino Uno`

    * `Seeeduino Mega`

    * 10 个舵机电机（记住一分钱一货。如果你选择低质量的电机，这些电机中的尼龙齿轮可能会很快磨损。）

    * 舵机扩展线

    * 舵机扩展板

    * 2 Xbee 系列 1

    * Xbee 探索器

    * Xbee 转接板（带有 2 行 Xbee 2mm 母排针和 2 行 10 孔公排针）

    * 3 组 6V NiMh 电池组


    ### 机械硬件


    * 聚氨酯密封剂

    * 船用环氧胶密封剂

    * 船用润脂

    * 尼龙绳

    * 绿色乐高胶

    * 2” x 10” 的 1/8” 厚橡胶

    * 3 条碳纤维 – 1/32”, 1” x 12”

    * 2 个 2.5 到 1.25” Shop Vac 吸尘器还原器

    * O 型圈

    * 5/16” 软箍

    * 波纹管箍

    * 5/16” 软管

    * 5 个舵机支架

    * 5 个注塑型舵机铰链

    * 5’ x 2.5” 聚氨酯集尘管

    * 5 个 Lynxmotion C 型支架

    * 5 个 Lynxmotion 舵机支架


    ### 工具


    * 烙铁 + 焊锡

    * 电钻

    * 3mm 钻头

    * 小号螺丝刀

    * 尖钳

    * 剥线器

    * 剥线器


    ## 第一步


    观察你的面包板时，你会看到带有红色和黑色 + 和 – 符号的方格。首先，在这里放置一个 `10uF` 电容。然后，你需要将 `7805` 电压调节器添加到面包板上。请确保将
    `7805` 的左引脚与电源输入对齐，中间的电源输出与地对齐。现在，你需要第二个 `10uF` 电容。将其放置在电源轨上。最后，如果你愿意，可以在面包板上包含一个
    LED 状态指示器。这对于故障排除是一个好主意。使用一个 `220` 电阻连接右侧和左侧电源轨。


    ## 第六步


    完成蛇的身体时，将舵机臂与支架的孔对齐。在将它们固定在一起之前，确保舵臂位于中心。如果固定后支架和电机无法自由旋转，请在支架之间涂抹润脂。为了安全起见，在确保位置正确后对螺丝上胶。


    ## 第七步


    在这一步中，你将为你的蛇制作电路板。首先将母子排针焊接到 `Xbee` 转接板上。插入 `Xbee`。然后，拿起 `舵机扩展板` 并焊接到螺丝端子上。焊接完成后，使用导线将
    `Xbee` 连接到 `Arduino`。将 `Xbee` 的 `3.3Vin` 引脚连接到 `Arduino 3.3V` 引脚。将 `Xbee` 的 `TX`
    引脚跳接到 `Arduino RX` 引脚。将 `Xbee` 地连接到 `Arduino` 地。最后，在 `Arduino VIN` 引脚和 `6V` 电池输入之间跳接电源线。


    '
- fmt: '

    Next, solder the wires from digital output pins for the number of servo motors
    you are using. You should take the `dOUT` wires from your `Arduino`, and then
    plug them into the servo cables. Screw the wires into the screw terminals. This
    will attach the `6V` and ground from the batteries.


    ### Step 8

    Next you will need the code to make your snake swim. You can find this in the
    software library on the `Servo` Arduino library. You will need a code to generate
    wave locomotion using oscillation. This will create a sine wave that travels down
    the servos motors.


    ### Step 9

    In this step, you will create a free standing joystick controller for the snake.
    Begin by plugging the `Xbee` into the `Xbee` shield. Set them atop the `Arduino`
    and make 6 button inputs. These buttons should be connected to digital pins `2-7`
    on the `Arduino`. You will now upload a code from the `Arduino` library to take
    the button inputs and output them as movement in the snake.


    ### Step 10

    This is the step where you will add all of the wires to the snake. Use the wire
    extenders from the servo motors and extend the wires down the body of the snake.
    They should end just a few inches after the last bracket. If you want to, you
    can tape the wires to the carbon fiber so it is easier to put the carbon fiber
    on.


    ### Step 11

    In this step, you will attach the batteries using the `6V/GND` wires so that your
    snake can operate. Attach one battery to each segment of carbon fiber, using two
    zip ties. You should also take the wire extensions from the `Servo` motor so that
    he battery power reaches the ground and `Arduino` at the front of the snake.


    ### Step 12

    This is the step where you add the on/off buttons. You may want to use one for
    the `Arduino/Servos` connection and one for the water pump. Be sure you turn on
    the snake before the pump, because running the water pump without water will cause
    it to dry out and burn up. Then, cut two pieces of rubber `1.75”` in diameter.
    This should fit inside of the vacuum reducer. You should also cut two `2’` long
    pieces of cord to help position the snake’s body inside the vacuum reducer. You
    will need to cut a small slit for the wires in the rubber before placing it in
    the vacuum reducer. You will also attach the string here. You will have power
    and ground wires from the water pump, power and ground wires from the on/off switches,
    and one string running thorough both the rubber pad and the vacuum reducer. At
    the tail, you will only need the string on the outside to tether the snake. Next,
    take the `6V` wire on the screw terminal and solder the on/off button to it.


    ### Step 13

    In this step, you will elongate the snake body and prepare the battery so the
    water pump can operate properly. Attach carbon fiber pieces that are `4”` long
    at the head and tail ends of the snake. Solder a battery junction and the water
    pump together. Next, locate the wire that extends between the battery and pump.
    This is where you will need to solder the switch to turn your snake on and off.
    Use the zip ties to attach the battery to the carbon fiber next to the `Arduino`.


    ### Step 14

    In this step, you will be sealing the body of the snake and putting on the skin.
    Use caulk on either end of the vacuum reducer to cover the wires completely. Wait
    at least 24 hours for the caulk to dry before finishing the project. You can use
    hot glue to secure the wires and silica packs to absorb moisture if you choose.
    You should also take this opportunity to ensure the joints are moving freely.
    Add additional grease if necessary. Now, slip the skin over the body of the snake.
    Cut the tube length if necessary so that the carbon fiber fits into the end of
    the tube when positioned with the string. Tie the string in a knot once you have
    finished to prevent slippage. Finally, you need to put caps on the head and tail
    end of the snake using marine grease to keep water out.


    ### Step 15

    Now that the snake is fully assembled, you are ready to mount the water pump.
    Once mounted, the water pump should be located close to the head of the snake,
    but on the bottom side. It will be submerged during operation. Cut `5/16”` plastic
    tubing to slip over the output nozzle of the pump. Then secure a hose-clamp at
    the joint of the tube. Use this plastic tubing to mount the pump. You can use
    a zip tie to secure it. If you are interested, you can even mount a GoPro on the
    snake.


    ### Step 16

    Now you are ready to test out your robotic water snake! Be sure to apply grease
    around the plastic buttons before taking it outside. Turn the snake on and place
    it in the water. Once you have placed the robotic snake in the water, you will
    be able to turn the pump on without drying it up. Use your remote controller to
    direct the motion of the snake.


    # Chapter 6: Getting started with Arduino


    The first step in setting up your Arduino microcontroller will be to choose an
    `Arduino` board with which you want to work.


    ## Choosing a Board

    When looking at the options for `Arduino` Boards, there are a few factors you
    will want to consider before making a choice. Before deciding on a board, ask
    yourself the following questions:


    ### How much power do I need to run the application I have in mind?

    You might not know the exact measure of flash memory and processing power that
    you require for your project, but there is a clear difference between the functioning
    of a simple nightlight that changes colors and a robotic hand with many moving
    parts. The latter would require a more robust `Arduino` microcontroller board,
    with faster processing, more flash memory, and more SRAM than the more straightforward
    night light idea.


    ### How many digital and analog pins will I require to have the functionality
    that I desire?

    Again, you don’t need to have an extremely specific idea in mind but knowing whether
    you need more pins or less will have a great effect on which board you choose.
    If you are going for a simple first project, you could get away with having less
    digital, `PWM`, and analog pins, while if you are looking to do something more
    complex, you will want to consider the boards with a great number of pins in general.


    ### Do I want this to be a wearable device?

    There are a few options for wearable devices so, of course, this question will
    not entirely make the decision for you. It will, however, help narrow down the
    choices and steer you in a direction, with `Lilypads` and the `Gemma` or other
    comparable technologies being your best options.


    ### Do I want to connect to the Internet of Things? If so, how?

    If you want connectivity to the Internet of Things, your work will be made much
    easier by the `YÚN`, the `Tian`, the `Ethernet`, the `Leonardo ETH`, or the `Industrial
    101`. These have the capabilities of `Ethernet` connection as well as Wi-Fi capability
    so you will be able to connect to a network like the Internet and share data or
    interact with and control other devices on the Internet of Things.


    ## Getting Started on Arduino IDE

    The Arduino Software runs in an environment called `IDE`. This means that you
    will either need to download the desktop `IDE` to code in or code online on the
    online `IDE`. The first way that you might access `IDE`, downloading the desktop
    application, has a few options to suit the various devices that you might be using.


    First, there is the `Windows` desktop application. You can also access it from
    a `Windows` tablet or `Windows` phone with the `Windows` application. Next, there
    is the `Macintosh OSX` version, which allows `IDE` to run on Apple laptops and
    desktops, but not on Apple mobile devices like iPhones and iPads. Finally, there
    are three options for running Arduino `IDE` on `Linux`: the `32-bit`, the `64-bit`,
    and the `Linux ARM` version.


    If you prefer this option to the web browser option, you will simply need to visit
    the `Arduino IDE` site by heading to:

    `https://www.arduino.cc/en/Main/Software`

    There, you can download the appropriate version of desktop `IDE`. Next, you will
    run the installation application, click through the options presented, and you
    should have a running `Arduino IDE` environment in just a few minutes.

