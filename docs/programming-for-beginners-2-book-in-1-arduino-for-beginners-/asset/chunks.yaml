    INTRODUCTION


    When it comes to creating some of your own robotics products, there are many things
    that you can consider. You will need to decide what kind of project you want to
    work on as well as the type of code that will help you to get the work done. One
    of the best options that you can use is the Arduino platform. When we are talking
    about Arduino, we are talking about a software and microcontroller that is programmable,
    open sourced, and will use the ATMega chip. It is designed to be more of a prototyping
    platform, there is a huge fan base for this software when it comes to building
    an electronic project. When it comes to working with an electronic project, you
    will find that the Arduino platform is good for using either as a temporary addition
    while you work on the project or you can even embed it as a permanent part of
    the robotic project when it is done.


    The Arduino board is also programmable with the Arduino software, which is pretty
    easy to use, even for those who are just getting started and have no idea how
    to work with this kind of software. If you have happened to use the C + + or Java
    programming languages, you will see that the Arduino coding language is going
    to be fairly similar. The idea behind using this software is meant to be really
    simple, but there is a lot of power there to, making it perfect for those who
    have some experience and for those who are just getting started out. Arduino is
    also an open sourced platform, which means that anyone is able to use it, for
    free, as well as make adjustments to the code to fit their needs. This is a really
    cool addition for those who are just starting to use the Arduino system because
    they will be able to access thousands of codes from other programmers, or even
    make some changes to their own codes, in order to make the program work perfectly.
    In addition to finding that many of the codes that you would like to use are already
    available and developed, beginners are going to enjoy that the Arduino community
    is pretty large. You will be able to go online and look through forums and communities
    to ask your personal questions related to your own project, to find out new information,
    and even watch tutorials to make working with Arduino easier than ever. The Arduino
    platform may be pretty powerful to use, but it is also pretty basic. You will
    find that this platform only comes with two main components for you to use including:
    The hardware: this is going to include the microcontroller, which is also known
    as the circuit board. You are able to physically program this part. You will find
    that there are a number of Arduino boards for you to choose from and the choice
    will vary depending on the type of project that you are putting together.


    The software: this would be the environment that you use with the board, or the
    IDE, that is going to run right on your own computer. You will use the IDE to
    help you to upload and write the programming codes that you would like to be relayed
    over to the board. Once you write your programs on the board and transfer them
    over, the Arduino board should act in the manner that you requested.'
