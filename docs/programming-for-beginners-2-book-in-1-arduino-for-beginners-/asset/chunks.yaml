    \ amounts of data\n\ndelay time(1000);\n\n}\n\nMicros ( ) function\n\nThis function\
    \ also returns the amount of time from the beginning of the program, the time\
    \ is expressed in microseconds. Overflowing phenomenon also happens here after\
    \ a period of about 70 minutes.\n\nSyntax\n\nmicros () ; // the function is supposed\
    \ to return a time period in microseconds after the program ahs begun.\n\nExample\
    \ in a program\n\nunsigned double delay time;\n\nvoid setup(){\n\n   Serial.begin(9600);\n\
    \n}\n\nvoid loop(){\n\n   Serial.print(\"delay Time:\");\n\ndelay time = micros();\n\
    \n          //the codes below prints time period  since program begun\n\n  Serial.println(delay\
    \ time);\n\n        // this code dictate that you will have to wait for a second\
    \ to prevent //sending massive amounts of data\n\ndelay time(1000);\n\n}\n\nArduino\
    \ programming- Arrays\n\nAn array is a consecutive collection of elements of the\
    \ same data type located in consecutive memory locations.\n\nIn locating a particular\
    \ element in array, we must specify its name and the name of its storage location.\
    \ Therefore an array has two important features, that is, name and location. Identifying\
    \ an array is done by giving that particular element a name then by the element’s\
    \ position in a square bracket [ ]. The first element (called zero element) has\
    \ a subscript zero and the subsequent elements can be represented by C[1], C[2],\
    \ C[3] and the rest as shown in the figure below:\n\n![Description: 00018.jpeg](images/00013.jpeg)\n\
    \nThe above array is called C with 11 elements. Each element has a value for example\
    \ C[10] has a value of 78.\n\nWe can therefore write programs to manipulate these\
    \ values, for example, to print the sum of the values of the first three elements\
    \ in the array we can write:\n\nSerial.print (C[ 0 ] + C[ 1 ] + C[ 2 ] );\n\n\
    Again we can write another program to multiply the value of C[8] by 6 and assign\
    \ the result to a variable called y: \n\nx = C[ 8 ] * 6;\n\nArrays Declaration\n\
    \nArrays declaration helps to specify the type of element and the total number\
    \ of elements in that array as illustrated below:\n\ntype arrayName [ arraySize\
    \ ] ;\n\nThis instructs the compiler to reserve enough memory for the array. That\
    \ is why the array size must be an integer. For example:\n\nint D[32]; // array\
    \ name is D with an array size of 32 integers\n\nExamples of programs using Arrays\n\
    \nArray declaration and then using a loop in the initialization of the array elements:\n\
    \nint b[ 12 ] ; // array name is b with 12 integers as array size\n\nvoid setup\
    \ ()\n\n{ }\n\nvoid loop ()\n\n{\n\n  for ( int j = 0; j < 10; ++j ) // array\
    \ initialization with elements\n\n{\n\n     b[ j ] = 0; // this codes sets element\
    \ at location j to be 0\n\n    Serial.print (j) ;\n\n    Serial.print (‘\\r’)\
    \ ;\n\n}\n\n   for ( int i = 0; j=i < 10; ++i ) // specifies the output of each\
    \ array element's //value\n\n{\n\n   Serial.print (n[i]) ;\n\n   Serial.print\
    \ (‘\\r’) ;\n\n} \n\n}\n\nArray declaration and initialization using an initializer\
    \ list:\n\n// b is an array made up of 12 integers\n\nint b[ 10 ] = { 23, 20,\
    \ 48, 12, 16, 28, 87, 79, 69, 37, 58,17 } ;\n\nvoid setup ()\n\n{ \n\n}\n\nvoid\
    \ loop ()\n\n{\n\n  for ( int j = 0; j < 10; ++j ) // the codes are used for initialization\
    \ of elements //in the array from n to 0\n\n{\n\n  Serial.print (j) ;\n\n  Serial.print\
