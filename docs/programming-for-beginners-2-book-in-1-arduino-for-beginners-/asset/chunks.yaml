  trans: "\n\n# 创建 HTML 文件\n\n创建一个 HTML 文件非常简单，只需将你的文件保存为 `.html` 后缀的文件即可。当你使用像 Microsoft\
    \ Word 这样的文字处理器创建文档时，你会发现保存文件时，文件名末尾会有 `.odt`、`.doc`、`.docx` 或类似的后缀。这告诉计算机以一种非常特定的方式读取和格式化文件内容。这是因为每当你保存使用文字处理器创建的内容时，你并不仅仅保存了你输入的一堆文字；你还保存了你使用的字体大小、字体样式和其他格式样式，这样当你打开文件时，你的计算机会检查文件扩展名，根据指定的扩展名读取内容，然后向你展示你创建的文件，确保它看起来与你保存时完全模一样。\n\
    \nHTML 的工作原理基本上相同，但这次你使用标签（tags）来告诉计算机如何处理标签内包含的数据；这允许你轻松地更改网页的字体样式和其他方面。将 HTML\
    \ 视为一个更精确的 Word 文档即可。例如，看看下面的文本：\n\n| 这是一个句子。 | \n\n如果你将其保存为 Word 文档，它不仅会保存文本，还会保存字体样式、大小和结构。你刚刚保存的文档属性被整齐地封装在文件中，并且可以通过文字处理器的菜单访问。然而，如果你想以\
    \ HTML 格式显示相同的句子，HTML 文件看起来像这样：\n\n```html\n| <html>    <head>    </head>    <<body>\
    \        <p>这是一个句子。</p>    </</body>></html> |\n```\n\n通过以 .html 后缀保存此文件，你就获得了一个显示“这是一个句子。”的简单网页。注意，它与之前的文本框具有相同的文本字符串，但它包含了你可能熟悉或不熟悉的额外标签。当你的浏览器打开此文件时，它理解这些标签并仅显示之前文本框中的内容；它实际上不会向用户显示标签。代码示例显示了最基本的标签：\n\
    \n*   `<html>` 标签 - 包含你网页中的所有内容。从字面上讲，它是开端也是终结；永远不要忘记 `<html>` 标签，否则你的网站将无法正常工作！\n\
    *   `<head>` 标签 - 保留标题以及 body 可能使用的其他初步脚本。例如，如果你想使用一组设计协议（通常是 CSS 形式）来规定使用什么种字体字体、颜色等，你可以将代码或其引用放在这里。\n\
    *   `<body>` 标签 - 这是你的内容所在的地方。从文本到声音、图像再到视频，一切都发生在这里。\n\n如果你还没有完全理解这些标签是如何工作的，不要太担心；你将在未来的示例代码和练习中通过尝试它们来更好地地学习它们是如何工作的。\
    \ \n\n# 如何在 XHTML 中引入 JavaScript\n\n现在你已经对 HTML 如何工作有了通的了解，我们将快速过一遍基础知识，这足以帮助你学习如何将\
    \ JavaScript 无缝集成到其中。\n\n我们已经讨论过 HTML 文件就像带有额外标签的 Word 文档，所以让我们从一行简单的文本开始。在你的文本编辑器中输入以下内容：\n\
    \n| 你好，那里！ |\n\n现在，在你的计算机上创建一个文件夹，用于存储创建的所有 html 文件，并将你刚刚输入的内容以 `.html` 后缀保存（例如，“My\
    \ First Website.html”）。程序员的一项标准做法是创建一个名为 `Developer` 的文件夹——这是你存储所有与编程相关文件的地方。你可以将其放在主文件夹中。在\
    \ `Developer` 文件夹内部创建一个名为 `Web Development` 的文件夹，目前将所有的 html 文件都放在这里。如果你使用的是 TextEdit\
    \ 或不是专门为 html 文件设计的文本编辑器，请检查设置并确保选择了“纯文本”（Plain text）格式。\n\n现在你已经创建了第一个 html 文件，使用你拥有的任何网络浏览器打开它，眼睁睁地看到一个简单的文本字符串！但注意，你在文本编辑器中输入的内容（称为“源代码”）看起来与浏览器显示的内容一模一样；它没有\
    \ `<html>` 标签和其他东西。这是为什么？\n\n现在，尝试通过添加几个标签来更改你的 html 文件。它应该看起来像这样：\n\n```html\n\
    | <!DOCTYPE html><html>   <<body>        你好，那里！   </</body>></html> |\n```\n\n\
    现在重新加载你的浏览器看看会发生什么。\n\n你的浏览器没有故障；尽管源代码中添加了标签，网页看起来几乎完全一样。到此时，你可能还不完全理解为什么要使用标签，但不要担心；当你开始更多地学习\
    \ HTML 编程时，你会看到它们的用途的。 \n\nJavaScript 使用 `script` 标签可以方便地融入到 HTML 中。`script` 标签可以包含\
    \ JavaScript 代码，也可以包含对包含 JavaScript 代码的 `.js` 文件的引用。在创建长 JavaScript 代码时，建议使用后者，以避免在一个文件中混合不同的编程语言——那就像写文章时，有些段落用英语，有些段落用拉丁语！然而，当你测试小的\
    \ JavaScript 代码段时，内部 JavaScript 是很有用的。 \n\n# JavaScript 和浏览器\n\n现代 JavaScript\
    \ 被认为是最安全的语言之一，因为它不提供对 CPU 或内存的任何访问（低级或其他级别）。原因在于 JavaScript 最初是为在浏览器中使用而创建的，而这些不需要这种访问权限。\n\
    \nJavaScript 运行的环境将决定其功能。例如，`Node.JS` 将支持让 JavaScript 写任意文件、执行网络请求等功能。浏览器中的 JavaScript\
    \ 可以执行任何与网页操作、用户交互和 Web 服务器相关的操作。例如，浏览器 JavaScript 可以：\n\n*   对用户的操作做出反应\n*  \
    \ 更改内容\n*   添加新的 HTML\n*   修改样式\n*   发送网络请求\n*   上传和下载文件\n*   获取 cookie 和设置 cookie\n\
    *   向用户提问\n*   记住浏览器数据\n\n但它不能做所有事情。浏览器 JavaScript 受到限制以保护用户安全，即防止恶意网页访问他们的隐私和机密数据。浏览器能力的限制包括：\n\
    \n*   无法读取或写入硬盘上的任意文件\n*   无法复制文件或执行程序\n*   无法直接访问操作系统的功能\n*   尽管它可以在现代浏览器中处理文件，但它只有有限的访问权限，且仅当用户执行特定操作（例如通过\
    \ `<input>` 标签选择文件或将文件拖入浏览器窗口）。\n*   访问设备上的摄像头和/或麦克风，这种访问仅在用户明确许可的情况下才允许。这意味着任何运行\
    \ JavaScript 的页面都无法启用你的摄像头或麦克风\n\n你不同窗口和标签除非使用 JavaScript 从另一个窗口打开窗口或标签，否则它们之间并不感知。尽管如此，如果它们来自不同的端口、协议或域，一个窗口或标签中的\
    \ JavaScript 也无法访问另一个中的 JavaScript。\n\n这被称为“同源策略”（Same Origin Policy），绕过它的唯一方法是两个\
    \ JavaScript 页面都拥有特殊的代码来处理数据交换。再次，这是为了用户的安全，防止一个页面访问另一个页面的个人详情。\n\n"
