    这是 Arduino 板板的主体。这些是与电路板边缘对齐的两行插座。细插座允许你将一些电线插入其中。这些电线反过来连接到任何类型的电子元件，包括传感器、LED、显示器、电机等。


    ## USB 熔丝

    小的 `USB fuse` 保护电脑和 Arduino。所有类型的电线都有可能连接到 Arduino，这可能会导致电线意外短路。这个 `fuse` 的重要性此时就体现了。它是可重置的，在这种发生时，它会像保险丝或断路器一样打开。这将保护你的板免受损坏。


    ## 重置按钮

    此按钮位于 USB 接口旁边。然而，在其他一些板上，你可能会在右侧找到它。这是一个用于重启 Arduino 的按钮。重启板只需要一秒钟，如果它卡住了或你需要重新运行某些程序，就可以这样做。


    ## 上电测试

    我们现在准备好为 Arduino 板上电。你只需将 USB 线的一端连接到 Arduino 板，另一端连接到电脑即可。电脑将作为 Arduino 的电源。


    如果你使用的是 Arduino UNO，那么 USB 线的末端应该是方形的 B 型。USB 线应该直接插入电脑端口。在你确认能够为 Arduino 供电后上传程序（sketches），就大功告成了。你可以将其插入其他端口。为了让你知道电源是否工作正常，只需检查
    `ON LED` 是否亮绿。`L` 或黄色 `LED` 也可能会闪烁或亮起，`RX` 和 `TX LEDs` 也是如此。


    # 第 15 章：故障排除


    ### Arduino 板测试

    在电路构建的过程中，会有某些什么都不工作的时候。这一时刻需要进行故障排除和调试过程，以识别并解决实验中的问题。


    成功故障排除的关键点：

    - **理解**：始终确保你正确理解实验中使用的所有组件。清晰地标记出这些组件相互连接的电源流。

    - **简化与分段**：这更像是一种分而治之策略，你将项目拆分并找出每个组件的问题。

    - **排除与确定性**：这涉及单独测试每个部分并确保它们的功能。通过这一点，你将能够确定每个组件的问题。


    因此，板测试涉及“闪烁 LED”，如果它不起作用，请检查 `USB connection` 以及下文探索的其他更多选项。


    ### 面包电路测试

    通过将 Arduino 板连接到面包板来运行短路测试。如果 `PWR LED` 熄灭，则你的板上有严重的短路连接。快速开始分段和简化以找到错误的连接。


    ### 问题识别

    Arduino 编程中的一些常见问题列如下：

    - **Arduino IDE 无法启动**：使用 `run.bat` 文件作为替代方案。

    - **Windows 操作系统分配的 COM 端口大于 Arduino**：通过让 Windows 分配较低的 `COM port` 来解决此问题。对于其他版本的
    Windows，请遵循书中之前关于 `Port Identification`（端口识别）的步骤。


    ### 问题隔离与解决

    此选项允许你重现问题。当你的电路出现某些问题时，找到与该特定问题相关的准确位置和位置（组件）。这将帮助你正确描述问题，并可能提供解决方案。


    ### 在线帮助

    如果上述建议不起作用，欢迎在 Arduino 网站寻求在线帮助：`www.Arduino.cc/en/Guide`。在寻求在线帮助时，请务必指定以下参数：

    - 你使用的 Arduino 板类型。

    - 你运行 Arduino IDE 时使用的操作系统。

    - 对你的问题提供一个通用的描述。

    - 当然，使用大写字母来指定所有这些。


    ## 结论

    这标志着本书的结束。你可以编写 Arduino 板以创建复杂的系统。此类系统的示例是一个控制设施访问的系统。你可以使用 Arduino 编写允许进入设施的门。Arduino
    非常适合硬件编程。如果你熟悉 C 语言语言，那么对你来说编写 Arduino 板将非常容易。代码在 Arduino 软件中编写，这是一款开源软件。你可以免费在你的系统中下载并使用此软件。在
    Arduino 软件中编写的代码被称为 `sketches`。在编写 Arduino 板时，有许多库需要在程序中包含。这些库是通过 C 语言语言使用的 `#include`
    关键字包含的。你可以编写可以控制 Arduino LED 灯的程序。注意，你可以从电脑为 Arduino 板供电，也可以直接插入电源插座，在所有情况下效果都是相同的。数据可以从电脑发送到
    Arduino 板，也可以从 Arduino 板发送到电脑。`RX` 和 `TX LEDs` 通常会亮起显示数据流的方向。


    在编写 Arduino 板时，你可以利用语言提供的各种特性，包括判断语句、循环、函数、变量等。该语言还支持你在声明变量时使用的各种数据类型。`math.h`
    库带有许多函数，你可以用它们执行各种数学运算。此类函数的示例是 `sqrt()` 函数，它可以帮助你计算数字的平方根。


    ## 初学者 JavaScript

    针对绝对初学者的简化指南，用于通过 JavaScript 逐步学习和理解计算机编程编码。内部包含基础概念和练习示例。


    [Matthew Python]


    ## 引言

    本书将解决几个棘手的问题，并假设你几乎没有实实践经验。之所以这样做是因为，对于许多人来说，JavaScript 是他们的第一门语言。

