    \n多行变体虽然稍微长一点，但更容易阅读：\n\n有些人也会以这种多行样式定义多个变量：\n\n甚至采用一种“逗号在前”的风格：\n\n从技术上讲，所有这些变体的作用都是相同的。因此，这是一个个人喜味和审美的问题。\n\
    \n# 使用 var 而不是 LET\n\n`var` 关键字与 `let` 几乎相同。它也声明变量，但方式略有不同，采用的是“老派”写法。\n\n## 全局变量和局部变量\n\
    \n在创建它们的函数之外，代码的其他地方无法访问这些变量。这些被称为局部变量。全局变量是在函数外部声明的，可以在代码的任何地方访问。例如：\n\n```javascript\n\
    var x = 10; // 这是一个全局变量因为它没有在函数内部声明\nvar turnToZero = function(number) {\n   \
    \ number = 0;\n    console.log(\"The value of x is now: \" + x);\n};\nturnToZero(x);\n\
    console.log(\"Outside the function the value of x is: \" + x);\n```\n\n注意变量 `x`\
    \ 仍然可以在 `turnToZero()` 函数内部访问。这是许多初学者感到困惑的地方：当你把变量传递给函数时，就像我们在调用时做的那样：\n\n```javascript\n\
    turnToZero(x);\n```\n\n你只是将 `x` 的值复制到函数中，并放入名为 `number` 的临时变量中。这意味着当你对变量 `number`\
    \ 进行操作时，你并没有对 `x` 执行任何操作。这就是为什么 `turnToZero` 函数是没用的；当你把一个变量传递给它时，改变的只是临时变量的值，而不是变量本身。\n\
    \n尽管如此，你不需要将全局变量传递给函数来修改它的值。我们可以简单地执行如下：\n\n```javascript\nvar x = 10; // 这是一个全局变量因为它没有在函数内部声明\n\
    var turnToZero = function() {\n    x = 0;\n    console.log(\"The value of x is\
    \ now: \" + x);\n};\nconsole.log(\"Before calling the function, the value of x\
    \ is: \" + x);\nturnToZero();\nconsole.log(\"After calling the function, the value\
    \ of x is now: \" + x);\n```\n\n简而言之，`var` 关键字除了告诉计算机你正在声明一个变量外，还会告诉解释器在当前作用范围内创建一个新变量，这就是为什么如果它在函数内部创建，它只存在于函数内部；如果它在函数外部创建，它将存在于整个代码中。考虑到这一点，你可能会奇怪既然全局变量更容易使用，为什么还需要局部变量呢？原因在于全局变量会让程序更难阅读和调试。当你开始编写更复杂的\
    \ JavaScript 代码时，你会注意到这一点，但目前，除非你清楚知道为什么要这样做，否则最好不要在函数内部尝试修改全局变量。\n\n## 变量类型\n\
    \n注意，变量可以持有数字类型和文本类型的值。文本值被称为字符串（string），虽然 JavaScript 能够处理多种不同的数据类型，目前我们将集中在数字和字符串上。\n\
    \n文本字符串用单引号或双引号包裹，而数字则没有引号。如果你将数字包裹在引号内，它将被视为字符串。例如：\n\n```javascript\nvar pi\
    \ = 3.14;\nvar person = \"Jane Deer\";\nvar answer = 'Yes I can!';\n```\n\n###\
    \ 一条语句，多个变量\n\n你不局限于每个语句一个变量；你可以使用多个。只需确保语句以 `var` 关键字开头，并确保每个变量名之间用逗号隔开：\n\n\
    ```javascript\nvar person = \"Jane Deer\", carName = \"Ford\", price = 300;\n\
    ```\n\n每个声明可以跨多行：\n\n```javascript\nvar person = \"Jane Deer\",\ncarName = \"\
    Ford\",\nprice = 300;\n```\n\n### 未定义值 (undefined)\n\n在计算机程序中，发现一个已声明但没有值的变量并不罕见。在这些情况下，值可能是必须计算的结果，或者可能是以后输入的内容（例如来自用户的输入）。这些变量虽然没有特定的值，但实际上的值是\
    \ `undefined`。在执行下一个语句后，名为 `carName` 的变量将变为 `undefined`：\n\n```javascript\nvar\
    \ carName;\n```\n\n### 重新声明变量\n\n重新声明的变量不会丢失它的值。例如，如果我们重新声明 `carName`，它将保留 `Ford`：\n\
    \n```javascript\nvar carName = \"Ford\";\n```\n\n### 算术运算\n\n通过变量，你可以使用某些运算符进行算术运算，例如\
