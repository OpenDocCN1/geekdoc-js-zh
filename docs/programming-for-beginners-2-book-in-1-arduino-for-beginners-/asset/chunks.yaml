- fmt: "\n# Creating HTML Files\n\nCreating an HTML file, then, is as simple as saving\
    \ your file with a `.html` file extension. When you create documents in a word\
    \ processor like Microsoft Word, you’ll notice that when you save your file it\
    \ has either an `.odt`, `.doc`, `.docx`, or something similar at the end of the\
    \ filename. This tells the computer to read and format the contents of the file\
    \ in a very specific way. This is because whenever you save something you’ve created\
    \ using a word processor you’re not just saving a bunch of words you’ve typed;\
    \ you’re also saving the font size, font styles, and other formatting styles you’ve\
    \ used so that when you open your file, your computer will check the file extension,\
    \ read the contents according to the file extension specified, and then present\
    \ you the file you’ve created, making sure that it looks exactly the same way\
    \ when you’ve saved it. \n\nHTML basically acts the same way, but this time you\
    \ use tags in order to tell the computer what to do with the data enclosed by\
    \ the tags; this allows you to easily change the font styles and other aspects\
    \ of your web page. Think of HTML as a more precise version of a Word Document.\
    \ For example, take a look at the text below:\n\n| This is a sentence. | \n\n\
    If you save this as a Word Document, it will save not only the text, but also\
    \ its font style, size, and structure. The attributes of the document you've just\
    \ saved is tucked neatly inside the file and accessible only through the word\
    \ processor menus. However, if you want to display the same sentence in HTML form,\
    \ the HTML file would look like this:\n\n```html\n| <html>    <head>    </head>\
    \    <body>        <p>This is a sentence.</p>    </body></html> |\n```\n\nBy saving\
    \ this file with a .html extension, you get a basic webpage that displays \"This\
    \ is a sentence.\" Notice how it has the same string of text as the previous text\
    \ box, but it contains additional tags you may or may not be familiar with. When\
    \ your browser opens this file, it understands the tags and displays only the\
    \ content on the previous text box; it doesn’t actually show the tags to the user.\
    \ The most basic tags are shown in the code example:\n\n*   The `<html>` tag -\
    \ contains everything in your web page. It’s the alpha and the omega, literally;\
    \ never forget the `<html>` tag or else your site won’t work properly!\n*   The\
    \ `<head>` tag - keeps the title and other preliminary scripts that the body might\
    \ use. For instance, if you want to use a set of design protocols (typically in\
    \ the form of CSS) that dictate what type of fonts to use, their colors, etc.,\
    \ you can place the code or its reference here.\n*   The `<body>` tag - this is\
    \ where your content goes. From text, to sound, to images, to videos, this is\
    \ where everything happens.\n\nDon’t worry too much if you don’t yet fully understand\
    \ how these tags work; you’ll learn better how they work by trying them out in\
    \ future sample codes and exercises. \n\n# How to include JavaScript in XHTML\n\
    \nNow that you have a general overview of how HTML works, we’re going to have\
    \ a quick run through the basics, just enough to help you learn how to integrate\
    \ JavaScript seamlessly into it. \n\nWe’ve discussed how HTML files are like Word\
    \ Documents with additional tags, so let’s start with a simple line of text. Type\
    \ this into your text editor:\n\n| Hi There! |\n\nNow create a folder in your\
    \ computer where you can store all the html files are created and save what you’ve\
    \ just typed with a `.html` extension (e.g., \"My First Website.html\"). A standard\
    \ practice for programmers is to create a folder called `Developer` -- this is\
    \ where all your files that pertain to programming are stored. You can place this\
    \ in your home folder. Inside the `Developer` folder, create a folder called `Web\
    \ Development` and for now, place all your html files here. If you’re using TextEdit\
    \ or other text editors that aren’t built specifically for html files, remember\
    \ to check the settings and make sure that “Plain text” format is selected.\n\n\
    Now that you’ve created your first html file, open it using any web browser you\
    \ have and see a simple string of text appear before your very eyes! Notice, however,\
    \ that what you’ve typed into the text editor (referred to as “source code”) looks\
    \ just like what the browser displayed; it didn’t have the `<html>` tags and other\
    \ stuff. What gives?\n\nNow, try changing your html file by adding a few tags.\
    \ It should then look like this:\n\n```html\n| <!DOCTYPE html><html>   <body>\
    \        Hi There!   </body></html> |\n```\n\nNow reload your browser and see\
    \ what happens.\n\nYour browser isn’t malfunctioning; the web page looks pretty\
    \ much the same despite the addition of tags in the source code. At this point\
    \ you may not fully understand why tags are used, but don’t worry; you’ll see\
    \ what they're for when you start programming in HTML more. \n\nJavaScript conveniently\
    \ fits into HTML quite readily using the `script` tag. The `script` tag can either\
    \ contain a JavaScript code or a reference to a `.js` file that contains the JavaScript\
    \ code. The latter is advised when creating long JavaScript code to avoid mixing\
    \ up different programming languages in one file - that’d be like writing an essay\
    \ with some paragraphs in English and some paragraphs in Latin! Internal JavaScript\
    \ is, however, good to use when you’re testing out small fragments of JavaScript\
    \ code. \n\n# JavaScript and Browsers\n\nModern JavaScript is considered to be\
    \ one of the safest languages because it doesn’t provide any access, low-level\
    \ or otherwise, to the CPU or memory. The reason for this is that JavaScript was\
    \ originally created for use in browsers and these do not require that access\
    \ level.\n\nThe environment that JavaScript is running in will dictate the capabilities.\
    \ For example, `Node.JS` will support those functions that let JavaScript read\
    \ and write arbitrary files, carry out network requests, and so on. The in-browser\
    \ JavaScript can do anything that is related to manipulation of web pages, user\
    \ interaction, and the web server. For example, in-browser JavaScript can:\n\n\
    *   React to actions from a user\n*   Change content on page\n*   Add new HTML\n\
    *   Modify the styles\n*   Send network requests\n*   Upload and download files\n\
    *   Get cookies and set cookies\n*   As the user questions\n*   Show the user\
    \ messages\n*   Remember browser data\n\nIt can’t do everything though. In-browser\
    \ JavaScript is limited to protect the safety of the user, i.e. to stop a malicious\
    \ web page from accessing their private and confidential date. Restrictions of\
    \ the in-browser capabilities include:\n\n*   Not being able to read or write\
    \ arbitrary files to a hard drive\n*   Not being able to copy the files or execute\
    \ programs\n*   Not having any access directly to the functions of the operating\
    \ system\n*   Although it can work with a file in a modern browser, it only has\
    \ limited access and that is only if a user does specific things, like selecting\
    \ a file through an `<input>` tag or dropping files into the browser window.\n\
    *   Limited in access to the cameras and/or microphone on a device and that access\
    \ is only allowed if the user gives express permission. This means that any page\
    \ run on JavaScript may not enable your webcam or microphone\n\nThe different\
    \ windows and tabs you use are not aware of one another unless JavaScript is used\
    \ to open a window or tab from another one. Even so, JavaScript that is in one\
    \ window or a tab cannot access the JavaScript on another if they are from different\
    \ ports, protocols or domains.\n\nThis is known as “Same Origin Policy” and the\
    \ only way around it is for both of the JavaScript pages to have a special code\
    \ that can handle the exchange of data. Again, this is for the safety of the user,\
    \ stopping one page from accessing personal details on another.\n"
  raw: 'Creating an HTML file, then, is as simple as saving your file with a .html
    file extension. When you create documents in a word processor like Microsoft Word,
    you’ll notice that when you save your file it has either an .odt, .doc, .docx,
    or something similar at the end of the filename. This tells the computer to read
    and format the contents of the file in a very specific way. This is because whenever
    you save something you’ve created using a word processor you’re not just saving
    a bunch of words you’ve typed; you’re also saving the font size, font styles,
    and other formatting styles you’ve used so that when you open your file, your
    computer will check the file extension, read the contents according to the file
    extension specified, and then present you the file you’ve created, making sure
    that it looks exactly the same way when you’ve saved it. 


    HTML basically acts the same way, but this time you use tags in order to tell
    the computer what to do with the data enclosed by the tags; this allows you to
    easily change the font styles and other aspects of your web page. Think of HTML
    as a more precise version of a Word Document. For example, take a look at the
    text below:


    | This is a sentence. |


     If you save this as a Word Document, it will save not only the text, but also
    its font style, size, and structure. The attributes of the document you''ve just
    saved is tucked neatly inside the file and accessible only through the word processor
    menus. However, if you want to display the same sentence in HTML form, the HTML
    file would look like this:


    | <html>    <head>    </head>    <body>        <p>This is a sentence.</p>    </body></html>
    |


    By saving this file with a .html extension, you get a basic webpage that displays
    "This is a sentence." Notice how it has the same string of text as the previous
    text box, but it contains additional tags you may or may not be familiar with.
    When your browser opens this file, it understands the tags and displays only the
    content on the previous text box; it doesn’t actually show the tags to the user.
    The most basic tags are shown in the code example:


    *   The <html> tag - contains everything in your web page. It’s the alpha and
    the omega, literally; never forget the <html> tag or else your site won’t work
    properly!


    *   The <head> tag - keeps the title and other preliminary scripts that the body
    might use. For instance, if you want to use a set of design protocols (typically
    in the form of CSS) that dictate what type of fonts to use, their colors, etc.,
    you can place the code or its reference here.


    *   The <body> tag - this is where your content goes. From text, to sound, to
    images, to videos, this is where everything happens.


    Don’t worry too much if you don’t yet fully understand how these tags work; you’ll
    learn better how they work by trying them out in future sample codes and exercises. 


    How to include JavaScript in XHTML


    Now that you have a general overview of how HTML works, we’re going to have a
    quick run through the basics, just enough to help you learn how to integrate JavaScript
    seamlessly into it. 


    We’ve discussed how HTML files are like Word Documents with additional tags, so
    let’s start with a simple line of text. Type this into your text editor:


    | Hi There! |


    Now create a folder in your computer where you can store all the html files are
    created and save what you’ve just typed with a .html extension (e.g., "My First
    Website.html"). A standard practice for programmers is to create a folder called
    ''Developer'' -- this is where all your files that pertain to programming are
    stored. You can place this in your home folder. Inside the Developer folder, create
    a folder called ''Web Development'' and for now, place all your html files here.
    If you’re using TextEdit or other text editors that aren’t built specifically
    for html files, remember to check the settings and make sure that “Plain text”
    format is selected.


    Now that you’ve created your first html file, open it using any web browser you
    have and see a simple string of text appear before your very eyes! Notice, however,
    that what you’ve typed into the text editor (referred to as “source code”) looks
    just like what the browser displayed; it didn’t have the <html> tags and other
    stuff. What gives?


    Now, try changing your html file by adding a few tags. It should then look like
    this:


    | <!DOCTYPE html><html>   <body>      Hi There!   </body></html> |


    Now reload your browser and see what happens.


    Your browser isn’t malfunctioning; the web page looks pretty much the same despite
    the addition of tags in the source code. At this point you may not fully understand
    why tags are used, but don’t worry; you’ll see what they''re for when you start
    programming in HTML more.


    JavaScript conveniently fits into HTML quite readily using the script tag. The
    script tag can either contain a JavaScript code or a reference to a .js file that
    contains the JavaScript code. The latter is advised when creating long JavaScript
    code to avoid mixing up different programming languages in one file - that’d be
    like writing an essay with some paragraphs in English and some paragraphs in Latin!
    Internal JavaScript is, however, good to use when  you’re testing out small fragments
    of JavaScript code. 


    JavaScript and Browsers


    Modern JavaScript is considered to be one of the safest programming languages
    because it doesn’t provide any access, low-level or otherwise, to the CPU or memory.
    The reason for this is that JavaScript was originally created for use in browsers
    and these do not require that kind of access level.


    The environment that JavaScript is running in will dictate the capabilities. For
    example, Node.JS will support those functions that let JavaScript and read and
    write arbitrary files, carry out network requests, and so on. The in-browser JavaScript
    can do anything that is related to manipulation of web pages, user interaction,
    and the web server. For example, in-browser JavaScript can:


    *   React to actions from a user


    *   Change content on a page


    *   Add new HTML


    *   Modify the styles


    *   Send network requests


    *   Upload and download files


    *   Get cookies and set cookies


    *   As the user questions


    *   Show the user messages


    *   Remember browser data


    It can’t do everything though. In-browser JavaScript is limited to protect the
    safety of the user, i.e. to stop a malicious web page from accessing their private
    and confidential date. Restrictions of the in-browser capabilities include:


    *   Not being able to read or write arbitrary files to a hard drive


    *   Not being able to copy the files or execute programs


    *   Not having any access directly to the functions of the operating system


    *   Although it can work with a file in a modern browser, it only has limited
    access and that is only if a user does specific things, like selecting a file
    through an <input> tag or dropping files into the browser window.


    *   Limited in access to the cameras and/or microphone on a device and that access
    is only allowed if the user gives express permission. This means that any page
    run on JavaScript may not enable your webcam or microphone


    The different windows and tabs you use are not aware of one another unless JavaScript
    is used to open a window or tab from another one. Even so, JavaScript that is
    in one window or a tab cannot access the JavaScript on another if they are from
    different ports, protocols or domains


    This is known as “Same Origin Policy” and the only way around it is for both of
    the JavaScript pages to have a special code that can handle the exchange of data.
    Again, this is for the safety of the user, stopping one page from accessing personal
    details on another.'
