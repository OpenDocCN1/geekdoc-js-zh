    这些部分可以结合在一起，帮助你让项目顺利运行。你需要确保已经准备好了某些硬件，例如某种类型的 Arduino 开发板，然后它需要对你通过软件能够发送的内容做出响应。我们将花一些时间讨论你通过软件可以做的各种事情，以便以后让你的项目运行，但这两者都需要设置好，以确保来自
    IDE 的消息能够传输到开发板并正常工作。在使用 Arduino 时，在编写任何代码之前需要安装好 IDE。该程序的 IDE 是免费的，因为它是开源的，这更容易获取副本。在编写代码时，你将使用
    Arduino 编程语言，它很容易学习，并且与你电脑上的所有操作系统都能良好配合。关于 Arduino 的 IDE 和编程语言需要注意的一是，如果你在使用
    Windows 7 或更早版本的操作系统，除了常规步骤外，你还需要执行几个步骤，以确保 Arduino 开发板能与操作系统兼容。它确实可以兼容旧版本的 Windows，你只需要花一些额外的时间让开发板识别该系统并使其工作即可。无论你是刚开始学习编程，还是想利用你的技能制作一个出色的电子或机器人项目，Arduino
    平台都能帮助你完成。它拥有你所需的所有功能，并具有简单的背景，甚至让初学者也能理解并实现他们的目标。


    ## 使用 Arduino 时我能做什么？


    当你看到 Arduino 编程语言时，可能会产生的第一个问题之一就是用它能些什么？世界上有很多编程语言，你可以选择它们来完成不同的任务，但 Arduino
    与其他语言相比工作方式略有不同。通过 Arduino 平台你可以完成很多很棒的项目。基本上，与 Arduino 配合的代码将从你电脑上的 IDE 传输到你为项目购买的硬件上。你可以只使用开发板，也可以将其连接到某些电子项目上来实现一些惊人的事情。得助于
    Arduino 的帮助，你可以在机器人领域做很多事情，如果你只是刚开始自己的电子学习过程，或者想尝试新事物，这是做此类事情的最佳平台。你可以让开发板发出声音、闪烁灯光、发送信号来控制前方屏幕上的内容，以及许多其他事情。我们将花一些时间研究你可以用
    Arduino 做的不同项目，以便你更好地了解使用这种出色的语言可以做什么。


    ## 第 1 章：什么是 Arduino？


    ### Arduino 的历史


    微控制器是一个小型计算板，可以编程来执行某些功能。当时，BASIC 插件微控制器的价格在 100 美元及以上，正如我们稍后看到的，Arduino 在保持执行各种功能的能力和编程这些功能的便利性的同时，无疑降低了成本。


    在 Massimo Banzi 和 Casey Reas 的指导下，Barragán 在名为 `Processing` 的计算机语言中工作，创建了环境 `IDE`（Arduino
    的官方编码环境和程序）。他研究了 `Wiring` 平台技术，推出了名为 `ATmega168` 的硬件，这是第一个 Arduino 微控制器。


    随后在 2003 年，Massimo Banzi、David Mellis 和 David Cuartielles 在他们的微控制器板上增加了对 `Wiring`
    的支持，命名为 `ATmega8`，并重构了 `Wiring` 源码，将其命名为 `Arduino`。这三个人同 Tom Igoe 和 Gianluca Martino
    一起继续开发 Arduino 技术，到 2013 年，仅纽约市供应商 Adafruit Industries 一家就售出了 70 万块微控制器板。


    在建立 Arduino 商标时遇到了一些问题，导致公司在几年内发生了分裂，现在 Arduino 是一家单一公司，致力于开发普通人或爱好者使用的硬件和软件，同时也足够灵活，能够引起专业工程师的兴趣。


    ### 但到底什么是 Arduino？


    Arduino 的历史听起来可能就像这项技术对你来说很复杂一样。充满了许多神秘和困惑的元素，你可能会对“微控制器”、“环境”和“语言”等术语感到不知所措。我们将从这里，从
    Arduino 的定义开始。


    它的工作原理如下：购买符合其目的的硬件，然后在性能强大的 Windows、Macintosh OSX 或 Linux 电脑上为开发板编写代码或指令，并通过电缆上传指令。代码随后存储在微控制器上，并根据指令运行，例如当光线通过打开的门隙时激活蜂鸣声。光线激活连接到微控制器的传感器（如报警器）。


    简而言之，Arduino 是一个电子项目开发平台（或称为电子原型设计），由硬件和软件组成，并根据知识共享署名-相同共享许可（Creative Commons
    Attribution）可用。


    这意味着所有 Arduino 项目设计文件在网上都是免费提供的，它们的软件是开源的。此外，该平台既可用于个人也可用于商业，只要归属于 Arduino 品牌，并且项目文件也根据相同的许可提供。


    该项目于 2015 年出现在意大利，由 Massimo Banzi 领导的开发者小组创立。其初目的是创建一个低成本、易于操作的平台，供学生高效、廉价地开发他们的原型。它被认为还可以帮助艺术和设计学生的电子教学，特别是在创建当代设计和艺术中非常流行的交互环境。


    ## 谁在使用 Arduino？


    广泛的人使用 Arduino 用于各种项目和爱好，也用于专业用途。它以简单易懂、适合初学者而闻名，深度让初学者成长，并为高级用户提供了足够的潜力。


    老师和学生使用 Arduino，他们确实是这些产品的目标消费群体，因为 Arduino 提供了一种低成本的构建科学仪器的方法。这让老师和学生能够实践和演示物理原理，并开始编程和制作机器人。


    设计师和建筑师可能会使用 Arduino 技术构建他们希望开发的交互式模型和原型。音乐家和艺术家也使用 Arduino 微控制器实验新的乐器或技术。


    几乎任何人都可以使用 Arduino，包括想要开始接触代码和计算机硬件的儿童，以及想要简单了解软件和微型计算机的爱好者。


    在项目中使用 Arduino 平台的主要原因如下：


    -   低成本原型制作

    -   提供免费仿真软件

    -   易于编程

    -   互联网上有大量的教程、文章和项目可供参考

    -   拥有庞大的开发者和爱好者社区

    -   不需要经验或大量的电子/编程知识（但建议至少了解基础知识）


