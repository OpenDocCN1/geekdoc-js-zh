    Global and Local Variables


    Variables not being accessible anywhere else in your code except within the functions
    they were created in. These are called local variables. Global variables are the
    ones declared outside functions and can be accessible anywhere within your code.
    For example:


    | var x = 10; // this is a global variable because it isn’t declared inside the
    functionvar turnToZero = function(number) {    number = 0;    console.log("The
