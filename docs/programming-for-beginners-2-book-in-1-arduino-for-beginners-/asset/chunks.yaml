    - EEPROM：1kB

    - 处理速度：16MHz

    - 数字引脚：20 个引

    - PWM 引脚：7 个引

    - 模拟输入：12 个引

    - 工作电压：5V

    - UART：1 线


    # 第 4 章：Arduino 家族


    Arduino 系统中有三种内存。内存是存储信息空间。闪存内存是你编写的程序代码存储的地方。它也被称为“程序空间”，因为当你将其上传到 Arduino 时，它会自动运行该程序。当断电或关闭
    Arduino 时，这种类型的内存会保持完好无。


    `SRAM`（静态随机访问存储器）是你创建的程序或脚本用于创建、存储和处理来自输入源信息以产生输出的空间。这种存储在断电后会消失。`EEPROM` 像一个微型硬盘，允许程序员存储程序本身以外的信息。


    # 第 5 章：Arduino 组件说明


    使用无接面包板可以轻松地制作 Arduino，只需要几分钟时间（一旦你熟悉流程）。一旦制作好板，就可以使用 Arduino 语言对微控制器进行编程。


    ## 你将什么


    你只需要少量廉价零件就可以将你的无接面包板变成 Arduino，包括：


    - 440 或 840 点位面包板

    - TTL-232R-3V3 USB 转串口转换线

    - 小型微动开关

    - 16 MHz 晶振

    - 一排公头排针

    - 22 AWG 导线（颜色可选）

    - 1 个棕、黑、红 10k 欧电阻

    - 2 个红、红、棕 220 欧电阻

    - 2 个 22pF 电容

    - 2 个 10 uF 电容


    ### 第一步


    一旦收集了所有必要的零件，就可以开始构建你的 Arduino 面包板。第一步是设置电源。对于这种特定的型号，将提供恒定的 +5Volts 电源。

