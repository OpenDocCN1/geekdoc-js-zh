    Exercise: Demonstrate the use of special operators.


    <!DOCTYPE html>


    <html>


    <body>


    <script type="text/javascript">


    <!--


    var x = 10;


    var y = 20;


    var z = ''Z'';


    var enter = "<br />";


    document.write("((x>y) ? 100:200) => ");


    answer = (x > y)? 100 :200;


    document.write(answer);


    document.write(enter);


    document.write("((x<y ? 100:200) => ");


    answer = (x < y)? 100 :200;


    document.write(answer);


    document.write(enter);


    answer = (typeof z=="string" ? "z is string":"z is numeric")


    document.write(answer);


    document.write(enter);


    answer = (typeof x=="string" ? "x is string":"x is numeric")


    document.write(answer);


    document.write(enter);


    </script>


    <p> Practice using other variables!</p>


    </body>


    </html>


    Here’s the output:


    ((x>y) ? 100:200) => 200


    ((x<y) ? 100:200) => 100


    z is string


    x is numeric


    Practice using other variables!


    ***  


    String Operators


    String operators are used to perform operations on strings:


    We can use the + operator to concatenate or add two strings together. For example:


    txt1 = "Jane";


    txt2 = "Deer";


    txt3 = txt1 + " " + txt2;


    txt3 will output a result of:


    Jane Deer


    We can use the += operator to add strings together as well:


    txt1 = "What a wonderful ";


    txt1 += "sunny day";


    txt1 will output a result of:


    What a wonderful sunny day


    Although this is called the addition assignment operator, when we use the + operator
    on a string it is named a concatenation operator.


    Adding Strings and Numbers


    If you add two numbers together, the output is the sum of those numbers but, if
    you add a string and a number, the output is a string:


    x = 5 + 10;


    y = "5" + 10;


    z = "Hello" + 10;


    The output will be:


    15


    510


    Hello10


    Comparison and Logical Operators


    We use these operators to test to see if a condition or statement is true or false,
    i.e. to see if there is any equality or any difference between values or variables. 


    Comparison Operators


    Supposing that x = 5, the list below explains the comparison operators:


    OperatorDescriptionComparing       Returns  


    ==equal tox == 8       false              


    x == 5true 


    x == "5"true 


    ===equal value and equal typex === 5       true              


    x === "5"false 


    !=not equalx != 8       true              


    !==not equal value or not equal typex !== 5       false              


    x !== "5"true 


    x !== 8true 


    >greater thanx > 8       false              


    <less thanx < 8       true              


    >=greater than or equal tox >= 8                      false              


    <=less than or equal tox <= 8                      true             


    If/else statement


    Right now, your programming is sequential, which means that the code is being
    executed from the top down. It is what we call linear code, with every code line
    being read by Java, starting with the first line and working down to the last
    line that you wrote. 


    We don’t always require our programs to work like this, though. Sometimes, you
    want your code to execute only when and if specific conditions are met. For example,
    you might want a specific message to be displayed if a user is under 18, while
    a different one would display for those over 18\. What you want is to control
    how your code flows yourself, and we do this by using conditional logic.


    When we talk about conditional logic, we are mostly talking about the IF word.
    For example, IF user is younger than 18 then display this message; IF user is
    older than 18, display this message. Luckily, you will find that using conditional
    logic in Java is easy so let’s begin by looking at IF statements. 


    IF Statements


    One of the most common things in computer programming is to execute code when
    one thing happens instead of something else.


    Run the program and check it – Note that NetBeans tends to run the program in
    bold text in the window for Projects, not the code that you displayed. If you
    want the code run in your coding window, right-click on the code, anywhere and
    then click on Run File in the menu that appears. The output will now appear in
    the Output window.


    Next, we change the user variable value from 17 to 18; now run the program again.


    You should see that the program runs fine, no errors but nothing will be printed.
    The reason for this is because the message is in between the curly brackets in
    the IF statement and that statement is looking for values of lower than 18\. If
    the condition isn’t met, Java will ignore the curly brackets and anything in between
    them, moving on to the rest of the code.


    Nested ifs


    We have previously looked at nested scopes; now we want to look at nested ifs.
    You will interact most of the time with a nested if. The greatest lesson to learn
    is nested ifs point to the block of code with the else.


    Read the following example:


    ![Description: 00027.jpeg](images/00029.jpeg)


    You should be able to note that the last else has not been associated with if(j<20),
    but associated with the if(i==10).


    IF … ELSE


    If you don’t want to use two IF statements, there is another way -and IF … ELSE
    statement.


    So, we have two choices in this code – the user is either 18 or younger, or older
    than 18\. Change your code so it matches what is above and try it. You should
    now see that the first message is printed out. Change the user variable value
    to 20 and then run the code again. You should see the message that is between
    the curly brackets for ELSE displayed in the Output window.


    IF … ELSE IF


    The first IF statement will test for the first condition, then we have the ELSE
    IF, followed by parentheses, in between which goes condition two. If there is
    anything that the first two conditions do not catch, it will be caught by the
    last ELSE. Again, we have sectioned the code using curly brackets and each IF,
    Else IF or ELSE has its own set. If you miss out any of these curly brackets,
    you will get an error message.


    Before you try out any more code, you must first learn about a few more conditional
    operators. So far, you have used these ones:


    < - Greater Than


    < - Less Than


    >= - Greater Than or Equal To


    <= - Less Than or Equal To


    Here''s four more you can use:


    && - AND


    || -  OR


    == - HAS A VALUE OF


    !  - NOT


    The first one, a pair of ampersand symbols, is used for testing two or more conditions
    at once.


    We are checking to see if a user is older than the age of 18 but younger than
    the age of 40 – remember, we are checking what is in the variable called user.
    The first condition, “greater than 18”; the second condition, “less than 40”.
    Between those two conditions, we have the AND operator so the entire line is saying
    else if user is greater than 18 AND user is less than 40\.


    Now run the program and test it again; before it runs you should already be able
    to guess what is going to print. The user variable has a value of 21 so the message
    that is between the else if curly brackets will show in the output window.


    Nested IF Statements


    Look at where the curly brackets are – get one set in the wrong place or miss
    one out and the code will not run. Nested IF statements might be a little tricky
    but, really, all you are doing is narrowing the choices down.


    Boolean Values


    Instead of using int, double or string, you would simply type in boolean (lower
    case b) and, after the variable name, you assign a TRUE or FALSE value. Notice
    that we use a single equal sign as the assignment operator.  If you wanted to
    see if a variable “has a value of”, you would need to use a pair of equals signs.


    This time, we have used the NOT operator in front of the variable called user.
    The NOT operator is indicated by the use of an exclamation mark, just one, and
    it will be placed in front of the variable that you are trying to test. This operator
    tests for negation, which means that it is testing for the opposite of the actual
    value. 


