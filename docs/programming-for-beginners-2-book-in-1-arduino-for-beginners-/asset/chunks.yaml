  trans: "\n\nArduino 编程结合 C 语言提供了以下几种类型的循环：\n\n- While 循环\n- Do…while 循环\n- For 循环\n\
    - 嵌套循环\n- 无限循环\n\n### While 循环\n该循环会持续执行或处理，直到括号内的表达式给出假结果为止。实际上，除非嵌套变量发生变化，否则\
    \ `while` 循环永远不会退出。\n\n#### 语法\n```\nwhile(expression)\n{\n  语句或语句块;\n}\n```\n\
    \n### Do…while 循环\n`do…while` 循环与 `while` 循环相似，区别在于在 `while` 循环执行中，循环继续的条件是在进入循环体之前就开始测试的；而在\
    \ `do…while` 循环中，执行先测试循环体，然后再检查循环继续的条件。\n\n在执行完 `do…while` 循环后（终止后），执行流实际上会继续处理\
    \ `while` 语句之后的语句。\n\n#### 语法\n```\ndo\n{\n    语句或语句块;\n}\nwhile (expression);\n\
    ```\n\n### For 循环\n对于这种循环，语句将按照预定的次数连续执行。在 `for` 循环表达式中，控制表达式在执行过程中会被初始化、测试和更改。\n\
    \n这提供了一种非常易于调试的结构，其结构具有循环行为完全独立于循环内部发生的活动。\n\n`for` 循环括号内有三个表达式用于控制其操作。这些表达式之间用分号隔开。\n\
    \n#### 语法\n```\nfor (表达式初始化; 控制部分; 增量或减量)\n{\n    // 语句或语句块\n}\n```\n\n#### 程序中的示例：\n\
    ```\nfor(counter=3;counter >=10;counter++)\n{\n    // 语句或语句块将执行 10 次\n}\n```\n\
    \n### 嵌套循环\n这种技术允许你在一个循环内部使用另一个循环，如下方的语法所示。\n\n#### 语法\n```\nfor (表达式初始化 ;控制部分;\
    \ 增量或减部分)\n{\n    // 语句或语句块\n    for (表达式初始化 ;控制部分; 增量或减部分)\n    {\n        //\
    \ 语句或语句块\n    }\n}\n```\n\n#### 程序中的示例：\n```\nfor(counter=0;counter<=10;counter++)\n\
    {\n  // 语句或语句块将执行 10 次\n  for(j=0;j<=100;j++)\n    {\n        // 语句或语句块将执行 101\
    \ 次\n    }\n}\n```\n\n### 无限循环\n顾如其名，这是一个没有终止点的循环，因此执行无限次。\n\n#### 语法\n1. 使用 `for`\
    \ 循环时：\n```\nfor (;;)\n{\n    // 语句或语句块\n}\n```\n2. 使用 `while` 循环时：\n```\nwhile(expression)\n\
    {\n    // 语句或语句块\n}\n```\n3. 使用 `do…while` 循环时：\n```\ndo\n{\n  语句或语句块;\n}\nwhile(expression);\n\
    ```\n\n# Arduino 函数\n这些是语句，允许程序员将程序结构化为部分或段，以便同时执行特定的任务。例如，当人们想要在程序多次执行某个特定任务时，函数会非常有帮助。\n\
    \n#### 将代码分段为标准片段的优势：\n- 分段代码呈现出更有组织的工作方式，有助于增强此类代码的概念化。\n- 在修改期间，代码片段最不容易出错，因为任何错误都易于发现。\n\
    - 代码保持紧凑并减少了空间，因为大部分代码被重用了多次。\n- 函数提供了模块化的代码设置，易于阅读并可以在其他部分重用。\n\nArduino 编程提供了两个强制函数，即\
    \ `setup()` 和 `loop()`。其他函数必须在上述函数的括号之外创建。\n\n#### 定义函数的常用语法：\n```\n返回值类型 函数名\
    \ (第一个参数, 第二个参数, ....) \n{\n    语句或语句块\n}\n```\n#### 解释：\n- **返回值**：函数返回的值的类型，例如任何数据类型。\n\
    - **函数名**：调用此函数时的标识符或标题。\n- **第一个参数，第二个参数…**：这些是用于定义数据类型的参数。\n- **语句或语句块**：包含了语句或函数本身的内容。\n\
    \n### 函数声明\n任何函数都应该在其他函数之外声明，即在 `loop()` 函数下方或上方。\n\n函数声明可以有两种形式，即：\n\n1. 仅在 `loop()`\
    \ 函数上方编写函数原型，这种形式包括：返回值、名称和参数类型。函数原型后面总是跟着分号。\n#### 程序中的示例：\n```\nint aver_func(int\
    \ a, int b);\nvoid loop()\n{\n    // ...\n}\nint aver_func(int a, int b)\n{\n\
    \    // ...\n}\n```\n\n2. 在 `loop()` 函数下方编写函数定义。\n\n# Arduino 编程 - 字符串\nArduino\
    \ 中使用的两种字符串是字符数组，它们等同于 C 语言中的字符串，供程序员使用。\n\n### 字符数组\n这通常是一个字符数据类型。因此，数组意味着在末尾有一个额外元素的字符集合。\n\
    \n#### 程序中的示例：\n```\nvoid setup()\n{\n  char go_str[7]; // 一个由字符组成的数组\n  Serial.begin(10000);\n\
    \  go_str[0] = 'G';\n  go_str[1] = 'o';\n  go_str[2] = 'o';\n  go_str[3] = 'd';\n\
    \  go_str[4] = 'i';\n  go_str[5] = 'e';\n  go_str[6] = 0; // 第 7 个元素称为空终止符\n \
    \ Serial.println(go_str);\n}\n\nvoid loop()\n{\n}\n```\n同样的示例可以用更方便的方法重写为：\n```\n\
    void setup()\n{\n  char go_str[] = \"Goddie\";\n  Serial.begin(10000);\n  Serial.println(go_str);\n\
    }\n\nvoid loop()\n{\n}\n```\n\n### 字符数组的操作\n我们将考虑下面的示例来解释如何操作字符数组。\n\n```\nvoid\
    \ setup()\n{\nchar take[] = \"I do not take mangoes and tea\"; // 创建字符数组\n  Serial.begin(10000);\n\
    \  // 下面的代码用于打印字符串\n  Serial.println(take);\n  // 下面的代码用于删除字符串的一部分\n  take[13]\
    \ = 0;\n  Serial.println(take);\n  // 下面的代码解释了如何在现有字符串中替换文本\n  take[13] = ' ';\
    \ // 将空终止符替换为空格\n  take[18] = 'e'; // 插入下一个新单词的点\n  take[19] = 'g';\n  take[20]\
    \ = 'g';\n  take[21] = 0; // 用于终止字符串的空终止符\n}\n```\n\n"
- fmt: "\n```cpp\nSerial.println(take);\n\n}\n\nvoid loop()\n{\n\n}\n```\n\n### Result\n\
    - I do not take mangoes and tea\n- I do not take mangoes\n- I do not take mangoes\
    \ and egg\n\n### Explanation\nFirst you need to create and print a string. For\
    \ the sketch above, a new string was created and displayed on the Serial Monitor\
    \ window.\n\nThe second process is to shorten the string using a null terminator.\
    \ That means when printing the new string, characters are displayed up to that\
    \ point where there is the null terminator.\n\nThe next procedure is to change\
    \ a word in a string. Firstly you have to replace the new null terminator with\
    \ a space so that the string is restored to its original format. The next step\
    \ is to replace the individual characters in the word to be replaced, that is,\
    \ `t-e-a` with `e-g-g`.\n\nArrays and strings have specified bounds that restrict\
    \ programmers to always work within those restrictions. In the above example,\
    \ we created an array of 38 characters long and therefore trying to copy and array\
    \ which is longer that this may be difficult. The copied longer array will be\
    \ copied over the end of the created array.\n\n### Arduino Programming- Time\n\
    Arduino programming has a total of four time manipulation functions as listed\
    \ below:\n- `delay()` function\n- `delayMicroseconds()` function\n- `millis()`\
    \ function\n- `micros()` function\n\nWe will discuss each of these time functions\
    \ and highlight their importance in Arduino programming.\n\n#### `delay()` function\n\
    This presents the simplest time manipulation function among the four functions.\
    \ Only a single integer is used as its input or argument. This integer represents\
    \ a waiting time in milliseconds that instructs the program to wait until it moves\
    \ on to the next group of codes where it will encounter the `delay()` function.\n\
    \nUsually this function is not recommended to instruct your code to wait as it\
    \ is associated with a phenomenon called “blocking”.\n\n#### `delayMicroseconds()`\
    \ function\nJust lie the `delay()` function, `delayMicroseconds()` also accepts\
    \ only a single integer as its argument or input. The integer here represents\
    \ time in microseconds which is equivalent to a thousandth of a millisecond or\
    \ a millionth of a second in this case.\n\nRecord time that has been tested and\
    \ proved to be able to produce an accurate delay is 16383 which is subject to\
    \ change depending on future inventions in Arduino boards’ production. However,\
    \ for delays less than thousand microseconds, it is advisable to use the `delay()`\
    \ function.\n\n#### `millis()` function\nThe time delay used here is milliseconds,\
    \ which is to mean, immediately the Arduino board runs a program, it returns a\
    \ number of milliseconds. This delay time at times goes back to zero a phenomenon\
    \ called “overflowing” after around 50 or so days.\n\nSyntax:\n```cpp\nmillis\
    \ (); // this function returns milliseconds from when the program begins.\n```\n\
    \nExample in a program:\n```cpp\nunsigned double delay time;\n\nvoid setup(){\n\
    \  Serial.begin(9600);\n}\n\nvoid loop()\n{\n  Serial.print(\"delay time:\");\n\
    \  delay time = millis();\n  //the codes below will print time since the program\
    \ begun\n  Serial.println(delay time);\n  //this code dictate that you will have\
    \ to wait for a second to prevent //massive amounts of data\n  delay time(1000);\n\
    }\n```\n\n#### `micros()` function\nThis function also returns the amount of time\
    \ from the beginning of the program, the time is expressed in microseconds. Overflowing\
    \ phenomenon also happens here after a period of about 70 minutes.\n\nSyntax:\n\
    ```cpp\nmicros (); // the function is supposed to return a time period in microseconds\
    \ after the program ahs begun.\n```\n\nExample in a program:\n```cpp\nunsigned\
    \ double delay time;\n\nvoid setup(){\n  Serial.begin(9600);\n}\n\nvoid loop(){\n\
    \  Serial.print(\"delay Time:\");\n  delay time = micros();\n  //the codes below\
    \ prints time period  since program begun\n  Serial.println(delay time);\n  //\
    \ this code dictate that you will have to wait for a second to prevent //sending\
    \ massive amounts of data\n  delay time(1000);\n}\n```\n\n### Arduino programming-\
    \ Arrays\nAn array is a consecutive collection of elements of the same data type\
    \ located in consecutive memory locations.\n\nIn locating a particular element\
    \ in array, we must specify its name and the name of its storage location. Therefore\
    \ an array has two important features, that is, name and location. Identifying\
    \ an array is done by giving that particular element a name then by the element’s\
    \ position in a square bracket `[]`. The first element (called zero element) has\
    \ a subscript zero and the subsequent elements can be represented by `C[1]`, `C[2]`,\
    \ `C[3]` and the rest as shown in the figure below:\n\n![Description: 00018.jpeg](images/00013.jpeg)\n\
    \nThe above array is called `C` with 11 elements. Each element has a value for\
    \ example `C[10]` has a value of 78.\n\nWe can therefore write programs to manipulate\
    \ these values, for example, to print the sum of the values of the first three\
    \ elements in the array we can write:\n```cpp\nSerial.print (C[ 0 ] + C[ 1 ] +\
    \ C[ 2 ] );\n```\nAgain we can write another program to multiply the value of\
    \ `C[8]` by 6 and assign the result to a variable called `y`:\n```cpp\nx = C[\
    \ 8 ] * 6;\n```\n\n#### Arrays Declaration\nArrays declaration helps to specify\
    \ the type of element and the total number of elements in that array as illustrated\
    \ below:\n```cpp\ntype arrayName [ arraySize ] ;\n```\nThis instructs the compiler\
    \ to reserve enough memory for the array. That is why the array size must be an\
    \ integer. For example:\n```cpp\nint D[32]; // array name is D with an array size\
    \ of 32 integers\n```\n\n#### Examples of programs using Arrays\nArray declaration\
    \ and then using a loop in the initialization of the array elements:\n```cpp\n\
    int b[ 12 ] ; // array name is b with 12 integers as array size\nvoid setup ()\n\
    { }\nvoid loop ()\n{\n  for ( int j = 0; j < 10; ++j ) // array initialization\
    \ with elements\n  {\n    b[ j ] = 0; // this codes sets element at location j\
    \ to be 0\n    Serial.print (j) ;\n    Serial.print (`\\r`) ;\n  }\n  for ( int\
    \ i = 0; j=i < 10; ++i ) // specifies the output of each array element's //value\n\
    \  {\n    Serial.print (n[i]) ;\n    Serial.print (`\\r`) ;\n  }\n}\n```\nArray\
    \ declaration and initialization using an initializer list:\n```cpp\n// b is an\
    \ array made up of 12\nint b[ 10 ] = { 23, 20, 48, 12, 16, 28, 87, 79, 69, 37,\
    \ 58 } ;\nvoid setup ()\n{ \n}\nvoid loop ()\n{\n  for ( int j = 0; j < 10; ++j\
    \ ) // the codes are used for initialization of elements //in array\n  {\n   \
    \ Serial.print (j) ;\n    Serial.print (`\\r`) ;\n  }\n}\n```\n\n### Multidimensional\
    \ Arrays\nAn array of two dimensions mostly represent a table of rows and columns.\n\
    \nSome of the outstanding features of a multidimensional array:\n- Has two subscripts\
    \ representing the columns and rows of a table.\n- The first subscript represent\
    \ the elements’ rows and the second subscript represents the elements’ columns.\n\
    - Multidimensional arrays have two and more dimensions.\n\nAn example by declaration\
    \ is shown below:\n```cpp\nint c[ 3 ][ 3 ] = { { 3, 8 }, { 3, 7 } };\n```\nor\n\
    ```cpp\nint c[ 3 ][ 3 ] = { { 3 }, { 3, 9 } };\n```\n\n### Summing all the Array\
    \ elements\nThose elements in an array normally represent values that are as a\
    \ result of a calculation or those yet to be used in a particular math work. For\
    \ example a professor may decide to enter the marks of students in a table forming\
    \ an array then using the total to calculate the average marks of the class. The\
    \ example below explains how this can be achieved using array functions.\n\n```cpp\n\
    const int arraySize = 5; // array size indicated by a variable called const and\
    \ data type used is int\nint c[ arraySize ] = { 80, 60, 50, 100, 70};\nint total\
    \ = 0;\n\nvoid setup ()\n{ \n}\n\nvoid loop ()\n{\n  // the code below is used\
    \ to get the sum of the contents of array c\n  for ( int j = 0; j < arraySize;\
    \ ++j )\n    total += c[ j ];\n  Serial.print (“ sum Total of elements of array\
    \ c : ”) ;\n  Serial.print(total) ;\n}\n```\n\nChapter 10: Input, Outputs, and\
    \ Sensor\n"
