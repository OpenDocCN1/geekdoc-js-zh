    This line:


    | var pet = {}; |


    Is what creates an object with the name "pet." There are actually two ways to
    create an object, and this is the first, called the literal notation. We’ve started
    with an empty object and added attributes after the declaration, but we can actually
    start with a filled object:


    | var pet = {    name: "Cat",    species: "Dog",    age: 5,    gender: "Male",};pet.showDetails
    = function(){    console.log("Name: "+ this.name);    console.log("Species: "+
    this.species);    console.log("Age: "+ this.age);    console.log("Gender: "+ this.gender);}pet.showDetails();
    |


    Take note of the differences, subtle as they may be! (e.g., using a colon (:)
    instead of an equal sign (=))


    You can also use a constructor, turning the code snippet into:


    | var pet = new Object();pet.name = "Cat";pet.species = "Dog"; pet.age = 5;pet.gender
    = "Male";pet.showDetails = function(){    console.log("Name: "+ this.name);   
    console.log("Species: "+ this.species);    console.log("Age: "+ this.age);   
    console.log("Gender: "+ this.gender);}pet.showDetails(); |


    Both ways of creating objects are correct, so it really is all up to preference.


