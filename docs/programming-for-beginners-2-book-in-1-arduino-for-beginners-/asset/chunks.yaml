         //statements or block of statements will be executed 10 times


      }


    Nested Loop


    This is a technique where you can use a loop inside another loop as illustrated
    below by the syntax.


    Syntax


    for (expression initialization ;control part; increment or decrement portion)


        {


             // statements or a block of statements


    for (expression initialization ;control part; increment or decrement portion)


             {


                  // statements or a block of statements


             }


       }


    Example in a program:


    for(counter=0;counter<=10;counter++)


    {


       //statements or a block of statements will be executed 10 times


       for(j=0;j<=100;j++)


        {


             //statements or a block of statements will be executed 101 times


         }


    }


    Infinite Loop


    As the name suggests, this is a loop without a point of termination therefore
    executes infinite number of times.


    Syntax


    1\. When using for loop


    for (;;)


      {


        // statements or a block of statements


      }


    2\. Using while loop


    while(expression)


      {


          // statements or a block of statements


      }


    3\. Using do…while loop


    Do


      {


       Statements or a Block of statements;


      } 


    while(expression);


    Arduino Functions


    These are statements per see that allow programmers to structure their programs
    in parts or segments that are meant to perform particular tasks at a time. For
    example, a function would be helpful when one wants to perform a particular task
    a multiple times in a program.


    Advantages of code segmentation into standardized fragments:


     Segmented codes presents a more organized work enhancing easier conceptualization
    such codes.


     During modification, code fragments are least liable to error since any mistake
    is easily noticeable.


     Codes stay compact and there is reduced space since most of the codes are reused
    several times.


     Functions presents a modular set up of codes that is easy to read and can be
    reused in other sections.


    Arduino programming provides for two compulsory functions, that is, set up ( )
    and loop ( ). Other functions must be created right outside of the brackets of
    the above functions.


    Common syntax defining a function:


    Return type function name (first argument, second argument, …..) 


          {


                   Statements or a block of statements


          }


    Explanation:


    Return type: the type of value that is returned by the function, for example,
    any data type.


    Function name: Identifier or title by which this function can be recalled. 


    First argument, second argument…: These are parameters that are used to define
    the data type. 


    Statements or a block of statements: Incorporates the statements or the body of
    the function itself.


    Function Declaration


    Any function is supposed to be declared outside other functions, that is, below
    or above loop ( ) function.


    Function declaration can take two forms namely:


     Just writing the function prototype just above the loop ( ) function and this
    form consists of: Return type, name, and argument type. Function prototype is
    always followed by a semi-colon.


    Example in a program:


    int aver_func (int a, int b) // declaration of the efunction


    {


      int c=0;


          c= a+b ;


         return z; // return the result’s value


    }


    void setup ()


    {


        Statements // block of statements


    }


    Void loop ()


    {


      int result =0 ;


         result = Aver_func (8,7) ; // part of the program referred to as a function
    call


    }


     The function declaration part or function definition is declared below the loop
    ( ) function and consists of: Return type, name and argument type.


    Example in a program:


    int aver_func (int , int ) ; // part of the program called a function prototype


    void setup ()


    {


       Statements //    block of statements


    }


    Void loop ()


    {


      int result =0 ;


          result = Aver_func (9,10) ; // part of the program called a function call


    }


    int Aver_func (int a, int b) // declaration of this function


    {


         int b=0;


         b= a+c ;


         return b; // return the resultant value of b


    }


    Arduino Programming- Strings


    The two types of strings used in Arduino programming are:


    Character arrays which are equivalent to strings in C programming language


    Arduino String that enables programmers to use a string object as part the sketch.


    So in this chapter we will be able to identify strings, objects and which types
    of strings to use in Arduino programming (sketches).


    String of Character Arrays


    This is typically a series of characters of the data type char also called an
    array consisting char variables. An array therefore would mean a collection texts
    of the same data type and stored in a memory.


    However a string is a special type of array with an extra element always zero
    at the end of it.


    Example in a program:


    void setup()


    {


       char go_str[7]; // an array which can accommodate string made up of six characters


       Serial.begin(10000);


       go_str[0] = ''G''; // this string is made up of six characters


       go_str[1] = ''o'';


       go_str[2] = ''o'';


       go_str[3] = ''d'';


       go_str[4] = ''i'';


        go_str[5] = ''e'';


        go_str[6] = 0; // the 7th array element called a null terminator


       Serial.println(go_str);


    }


    void loop()


    { 


    }


    This same example can be rewritten in a more convenient way as shown below:


    void setup()


    {


        char go_str[] = "Goddie";


        Serial.begin(10000);


        Serial.println(go_str);


    }


    void loop()


    { 


    }


    Before this string is executed, the compiler is supposed to calculate its size
    and automatically terminate it using the null terminator.


    Manipulation of a String Array:


