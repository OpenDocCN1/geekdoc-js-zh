    - `Secure` – If this field is tagged as “secure,” only a secure webserver can
    retrieve the cookie. If it is blank, however, any webserver can access the cookie.

    - `Expires` – This field specifies the date at which the cookie will expire. If
    this field is blank, the cookie will expire as soon the user closes the web browser.

    - `Path` – This is the path to the webpage or directory that created the cookie.
    If you want to retrieve cookies from any page or directory, you may leave this
    field empty.

    - `Name=Value` – Each cookie is set and retrieved as key-value pairs.


    Cookies were created for CGI (i.e. Common Gateway Interface) programming. The
    information stored in a cookie is transmitted automatically between the webserver
    and the user’s web browser. That means CGI scripts written on the webserver can
    read and edit cookie information stored on the user’s hard drive.


    JavaScript allows you to manage cookies using the `Document` object’s `cookie`
    property. The JavaScript language can create, read, alter, and delete cookies
    that are applied on the active webpage.


    ## How to Create a Cookie?


    The easiest way to generate a cookie is to place a string value to the object
    named `document.cookie`. The syntax that you should use is:


    ![Description: 00039.jpeg](images/00043.jpeg)


    In this syntax, `expires` is completely optional. If you’ll enter a valid time
    or date on this field, the cookie will expire on that particular time or date.
    You won’t be able to access the values stored in an expired cookie.


    **Important Note**: You can’t save whitespaces, commas, or semicolons into a cookie.
    Thus, you have to encode those characters using the `escape()` function before
    saving them onto a cookie. If you’ll encode characters this way, you should also
    use `unescape()` to allow the system to read the value you stored.


    ## How to Read a Cookie


    You can read cookies easily. This is because the cookie is the value stored on
    the object named `document.cookie`. That means you can use that string to access
    the cookie whenever you want. Basically, `document.cookie` contains a set of `name=value`
    pairs that are separated by semicolons. Here, `name` is the cookie’s name and
    `value` is the cookie’s string value.


    ## How to Set a Cookie’s Expiry Date


    In some cases, you have to extend the cookie’s life beyond the current browsing
    session. By doing so, you can complete long processes without having to reenter
    any piece of information. JavaScript allows you to set your preferred expiration
    date and save that information inside the cookie itself. You can accomplish this
    by customizing the cookie’s “expires” attribute.


    The image below shows you how to set a cookie’s expiration date. It extends the
    current expiry date by one month.


    ![Description: 00040.jpeg](images/00044.jpeg)


    ## How to Delete a Cookie


    In most cases, you must delete cookies after using them. This ensures that the
    webserver won’t get any information from the unnecessary cookie. Deleting a cookie
    is easy and simple. You just have to set the expiration date to a time in the
    past.


    ## CONCLUSION


    Thank you for making it through the end of JavaScript. Let’s hope that it was
    informative and able to provide you with all of the tools you need to achieve
    your goals whatever they may be.


    The next step is to use this knowledge. Get out there and start working with some
    JavaScript frameworks. The way to reinforce all that you’ve learned is by doing
    it. You won’t be familiar with all of them, and sometimes you’re even going to
    be left really confused, but if you keep pushing through, then I guarantee that
    it will be worth it and you’ll come out the other end as a fantastic web developer.


    A lot of people believe that the only way to learn proper programming is by going
    back to school or other education centers. But l doesn’t believe it’s true. Thanks
    to the tremendous advancements in online communication, you can easily learn and
    master any new skill through internet tutorials and videos. The information available
    out there for you to grasp is endless.


    JavaScript is not a program that is only for geniuses and geeks. This is a very
    standardized language and it can easily be picked up by anyone. Just like languages
    in real life, this language will also help you to open unlimited possibilities
    and opportunities.


    At this point, you might be wondering, what exactly is the future of JavaScript?
    What can I expect to gain from learning all these?


    Since the whitepaper that brought Ajax to the forefront, JavaScript has only been
    gaining steam constantly. There are a huge number of new JavaScript frameworks
    that are being introduced every year that are fantastic for their various different
    purposes, and more frameworks will be expected.


    The future of JavaScript is more about the future of you. JavaScript is only going
    to become more popular if further features are added into the future ECMA standardizations,
    if the web in general is used by more people, and if web platforms mature. Likewise,
    JavaScript matures alongside PHP and CSS. It is expected that JavaScript will
    continue to develop in the future.


    If you want to be a web developer, you must learn JavaScript and be aware of its
    frameworks, because those will allow you to keep up with the trends.


    As technology grows more and more advanced, JavaScript programmers will also be
    more in demand. There are a number of things right now that are currently relegated
    to other common scripting languages, like `Python`, that can be ported to JavaScript.
    Natural language processing and machine translation are just two examples that
    will inevitably be ported to JavaScript which therefore increases demand.


    JavaScript isn’t just for creating pretty web pages; the actual utility of web
    pages is expanding. With this in mind, JavaScript will advance to this because
    web pages are now able to perform very complicated actions. The advent of browser-based
    HTML/CSS/JavaScript games only goes to support this.


    As a JavaScript programmer, expect that more programmers will be needed in the
    industry. Therefore, one of the best things that you can do for yourself is to
    learn JavaScript and advance your learning.

