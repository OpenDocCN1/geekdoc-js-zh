    There are hundreds of communication procedures that are defined by Arduino and
    will be used to achieve the data exchange. Every procedure is going to will be
    placed into one of two categories, serial or parallel.


    ## Parallel


    A parallel connection between the peripherals and Arduino will be established
    through input and output ports so that there is a shorter distance of several
    meters. But, in some cases, it is going to be required that communication is established
    between two pieces of equipment over a longer distance, and you are not going
    to be able to use parallel connections. Parallel interfaces will move a group
    of bits at the same time. They will typically require a bus of data that are going
    to transmit through the wires labeled eight and sixteen. The data transfer is
    going to be massive.


    ![Description: Parallel Communication](images/00015.jpeg)


    ### Pros and Cons


    While parallel communication is going to have its advantages, such as it is faster
    and more straightforward as well as easier to implement. However, it is going
    to require a lot of input and output lines and ports. If you find that you need
    to move a project from an `Uno` panel to a `Mega` board, you are going to have
    to know the input-output lines on the microprocessor, and you will be aware that
    there are not going to be many. So, you are going to discover you like to use
    serial communication which means that you are going to be sacrificing the potential
    speed for pin real estate.


    ## Serial Communication


    In most panels that you are going to use today, there are several systems that
    are built in for serial communication. The system that is used will be determined
    by the following factors:


    1. Do you need to be able to send and receive data simultaneously?

    2. How many pieces of equipment is the microcontroller exchanging data with?

    3. What is the space between the pieces of equipment?

    4. How fast does the data transfer need to be?


    It is of vital importance to establish procedure whenever you are working with
    serial communication. The procedure is going to have to be strictly observed.
    This set of rules is going to be applied so that the device knows how to interpret
    the data that is being exchanged. Thankfully, Arduino is going to automatically
    take care of this so that the user is dealing with clear data.


    ### Types of Serial Communication


    1. **Asynchronous**: a device that is asynchronous is going to have its own clock
    that will be triggered by an output of the previous state.

    2. **Synchronous**: for a device that is synchronized with another, it is going
    to be using the same clock, and the timing is going to be synchronized with each
    other.


    It is going to be easy to discover if the device you are using is synchronous
    or not. Should the same clock be given to all the pieces of equipment that are
    connected, then they are synchronous. However, if there is no clock line, it is
    going to be asynchronous.


    An example would be the `UART` – universal asynchronous receiver transmitter –
    module will be asynchronous.


    The asynchronous procedure is going to have several rules built in. these rules
    are not going to be anymore more than mechanisms that are going to help to ensure
    data transfers are robust and error-free. The mechanisms are going to be:


    1. `Baud rate`

    2. `Synchronization bits`

    3. `Parity bits`

    4. `Data Bits`


    ### Synchronized Bits


    Synchronized bits are two or three bits that are special and will be transferred
    with every packet of data. They are going to be bits designated for starting and
    stopping the sending of data packets. Just like their name suggests, these bits
    will mark the beginning and the end of a packet.


    There is always going to be a single start bit, but there can be multiple stop
    bits that can be configured to each other.


    Your start bit will always be indicated by an idle data line that is going to
    go from one to zero while the stop bits are going to transition to idle holding
    the line at one.


    ![Description: Synchronization Bits](images/00016.jpeg)


    ### Data Bits


    The magnitude of data that is in each package will have the option of being set
    five to nine bits. The standard size is going to be eight bits; however, the other
    bit sizes are going to have their uses. Like a seven-bit packet is going to be
    more efficient than an eight bit if you are transferring seven-bit ASCII characters.


    ### Parity bits


    You are going to have the option of picking whether there should be a parity bit
    or not and if they decide there should be, then the parity bit is going to be
    odd or even. The parity bit will be zero in the event that the digital representation
    of ones inside the data bit is even, then the odd parity will be labeled as the
    opposite.


    ### Baud rate


    This function is going to be used to denote the digital representation of bits
    that are being transferred per second. Keep in mind that this is going to refer
    to bits and not bytes. The baud rate will typically be required by the procedure
    that each byte is transferred along with several control bits. That means that
    for every one byte there will be eleven bits.


    ### Uart


    Once the `sketch` has been uploaded to Arduino, you are going to have to open
    serial monitor which is located at the top right of the IDE.


    You can type in whatever you want in the top box of the serial monitor and press
    send. This is going to send a series of bytes to the Arduino panel that you are
    using.


    The code will return whatever is received as an input.


    ## Chapter 14: Arduino clones and similar boards


    ### The Microcontroller/ Main Chip


    This is the brain of the Arduino board. This is the part which is programmed.
    It is the one responsible for running the code, hence it can be seen as the `CPU`
    (Central Processing Board) of the board.


    This chip has some legs, which are usually plugged into the socket. However, they
    are not referred as "legs" but "pins".


    ### Power Jack and Supply


    There are two ways on how you can supply power to your Arduino board. You may
    choose to use a `USB` connector to establish a connection to a computer or some
    portable power jack, or you may choose to plug it to the wall adapter. The `USB`
    can be used for powering and programming. The `DC` is only used for powering the
    board, and it is the best if you are in need of connecting the board for some
    long-term project.


    ### USB Jack and Interface


    The `USB Jack` is the cable that helps you connect your board to the computer.
    You can use any computer, provided it has a `USB port`.


    Some processor chips will fail when you are using a `USB` cable for connection
    to a computer. In such a case, you will have to use the serial interface.


    ### The LEDs


    The Arduino comes with some lights from which you can draw ideas regarding what
    it is up to. The lights are referred as LEDs. The Arduino board comes with 4 LEDs
    which are `L`, `RX`, `TX`, and `ON`. On the `UNO` board, you will find three of
    these at the center and one on the right side.


    The `ON` LED will turn to green once you have powered the Arduino board. In case
    you find it off or flickering, then just check on your power connection.


    The `RX` and `TX` boards will blink whenever data is being sent from the board
    or being received on the board. The `TX` LED will light yellow once you send data
    from Arduino to the computer USB port. The `RX` LED will light yellow whenever
    data is sent to Arduino from the computer’s USB port.


    The LED is the one that you are able to control. The other 3 LEDS usually light
    automatically. The `L` LED has been connected to the main chip of the Arduino.
    This can be turned on and off once you begin to write the code.

    '
