    # History of JavaScript


    The language was first released as `LiveScript` and then later was changed to
    `JavaScript`. `JavaScript` became the final name of the language from that on,
    most likely as an attempt by `Netscape` to capitalize the success of the `Java`
    programming language that was extremely popular at the time, even though `JavaScript`
    wasn’t particularly related to `Java` except in its syntactic in some places.


    `JavaScript` was initially only implemented for client-side scripting or the creation
    of dynamic web pages (as we’ve already discussed). The first server-side implementation
    of `JavaScript` appeared a year or so after the initial release of `JavaScript`.
    Today, the server-side `JavaScript` is still being implemented even though its
    implementations are far less common than those of the client-side.


    The mid-90s showed the development of many now-important web technologies and
    also browser wars. `JavaScript` plays an important part in the browser wars, which
    gained popularity pretty quickly and was implemented by `Netscape` in their browser.
    However, `Netscape’s` primary opponent during that time, `Internet Explorer`,
    didn’t have a support for `JavaScript`.


    This started to change in late 1996. It was clear that some kind of business-wide
    standard for `JavaScript` was needed in order for the World Wide Web to be accessed
    by all browsers. In order to do this, `Netscape` sent their language into a standards
    board in order for the language to be reviewed and standardized. The language
    standard was called `ECMAScript`, which was published in 1997. This standardization
    became the starting point for many different languages and is a language in its
    own right. It’s the standard of a language, upon which other languages are derived
    from. All of these different derivations are referred to as implementations of
    the standard. `JavaScript` is the most popular one, but there were a few others
    that transpired, such as `ActionScript` designed for Flash coding.


    With the standardization of `ECMAScript`, `JavaScript` was finally being used
    by other browsers and not just `Netscape`. `JavaScript` was an ambition in the
    mid-2000s. During this time, `JavaScript` and the things for which it could be
    used were becoming popular to the public (especially the developers) after the
    development of a white paper wherein `Ajax` was defined, basically promising the
    development of extremely dynamic web pages as opposed to the static pages prior.
    This resulted in the development of many more technologies that can be used alongside
    `JavaScript`, such as `jQuery`, which remained until 2015 or 2016.


    A little later in the Oughts, there was at last cohesive work done in order to
    push the status of the `JavaScript` language forward and force new standards fit
    for new technologies. Since then, newer implementations and constant unified updates
    have been created to develop a unified version of `ECMAScript`. Therefore, all
    implementations of `ECMA`, including `JavaScript`, resulted in the development
    of more technical possibilities.


    For the last few years, new standards of `ECMAScript` have been released every
    year.


    The major breakthrough of `JavaScript` must have been `Ajax` when developers began
    to take interest and supported the language. Today, there is an even greater need
    for an extensive browser support, and `JavaScript` began to push for that spotlight.
    Since then, it has become the most widely used web scripting language.


    The history of `JavaScript` shows that it has undergone challenges to become what
    it is today. I hope that you appreciated the path that it has taken. In the following
    chapter, we’re going to discuss exactly where we are at today and all of the different
    things that `JavaScript` can be used for.


    ## Chapter 1: What is Javascript?


    ### What is JavaScript?


    `JavaScript`, abbreviated `JS`, is a high-level programming language introduced
    to add specific programs to web pages, and it has been adopted by all major web
    browsers. `JavaScript` can be used to build interactive web applications to function
    appropriately without reloading every page per-action. `JavaScript` is used to
    create different forms of activities within web pages and is one of the essential
    components of the World Wide Web (www), which are `HTML` (Hypertext Markup Language)
    and `CSS` (Cascading Style Sheets). `JavaScript` and `HTML` are used to develop
    web pages. `JavaScript` brings a page to life by adding special effects such as
    sliders, pop-ups, form validations, etc. `CSS` determines the color intensity,
    image size, background colors, typeface, font size, etc.


    ### Why to learn JavaScript


    `JavaScript` ranks as the top most used language of programming as is utilized
    by every browser version available today. It is therefore important to know what
    `JavaScript` does.


    Below are a few details of what it does:


    - `JavaScript` is designed in a way that its users are always able to be in charge
    of their browsers.

    - `JavaScript` is able to identify the specific browser being used by the user
    plus the Operating system as well. This enables it to function as per the functions
    being performed.

    - `JavaScript` is equipped with a calculator that enables users to work out some
    problems.

    - `JavaScript` is able to warn a user when an invalid input has been made immediately
    and be able to correct it as needed.

    - A `JavaScript` user can always be able to come up with new functions that are
    contained in scripts.


    `JavaScript` also possess some limitations and they are as follows:


    - For one `JavaScript` lacks multithreading capabilities which means it cannot
    be able to execute a number of multithreads at the same time.

    - `JavaScript` is not designed in a way that it can be able to gain access to
    pages that are on other domains. There are some databases that `JavaScript` is
    not able to access without there being a server side script. However it is worth
    noting that there are some client side ones that a user can obtain.

    - A user of `JavaScript` is not permitted to write a file that is on the server
    side without use of an `Ajax` request which will in turn do this.

    - There is a limitation on how many devices a user is able to use with `JavaScript`.
    Different browsers interpret `JavaScript` differently which results in very different
    outputs.


    ### Why is it called JavaScript?


    When `JavaScript` was created, it originally had a different name: "LiveScript".
    But `Java` was very popular at the time, so it was decided that setting up a new
    language as `Java`''s younger brother would be helpful.


    But `JavaScript`, as it evolved, became a completely independent language with
    its own definition, called `ECMAScript`, and currently has no relation to `Java`.


    ### What is HTML?


    `HTML` basically allows you to present your site’s content in a structured manner.
    Think of it as a blueprint for building a house; it tells you where the living
    room, bathroom, kitchen, and other rooms will be placed and how they harmoniously
    interconnect.


    Learning the structure of an `HTML` file is quite simple; it’s structured almost
    like an essay - you provide a title, a skeletal structure, and content that flows
    coherently within the structure. Whenever you read an article, the title tells
    you what the article talks about, and the content is structured in a particular
    way, oftentimes with a sentence that piques your interest, followed by anecdotes,
    facts and figures, arguments, and a conclusion. When you start coding in `HTML`,
    you’ll see how similarly structured it is to articles you read or write.

    '
