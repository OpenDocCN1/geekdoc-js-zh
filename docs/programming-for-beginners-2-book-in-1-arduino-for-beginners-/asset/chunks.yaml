    必须记住，要开始学习 JavaScript，你至少需要少量的 HTML 知识，特别是标签的概念，它允许你将自己放置在页面上。为了重温记忆，我们只需记住一个
    HTML 页面分为两个主要部分：`head` 部分，其中包含与内容描述对应的数据；`body` 部分，包含用于在页面上构建对象（表单字段、文本区域、图像等）的代码。JavaScript
    脚本可以根据需要放置在这两个部分中的任何一个。然而，原则上讲，脚本通常位于页面的 `head` 部分。它的执行可以是即时的（当页面加载时），也可以是延迟的（例如，点击一个按钮）。在这种情况下，将需要使用基于事件的编程和函数来执行代码。这些点将在本书的“函数与事件”章节中讨论。然而，将脚本放置在
    `head` 部分并不意味着它们会被搜索引擎索引。事实上，到目前为止，像 `Yahoo` 或 `Google` 等搜索引擎尚未提供来自这些代码元素的任何内容，但随着
    Web 2.0 的发展，它们迟早会这样做。目前，在情况……


    ## 语法


    编程语言的语法被定义为在编写程序源代码时必须遵守的规则集，以便该代码被该编程语言认为是正确的。定义 JavaScript 语法的基本规则如下：


    - 空格和换行不被考虑：就像 `XHTML` 的一样，JavaScript 解释器忽略任何剩余的空格，因此代码可以进行适当的排序以便更好地理解（对齐行、添加空格、创建新行等）。

    - 大小写敏感：就像 `XHTML` 标签和元素的语法一样。然而，如果交替使用 `XHTML` 页面，页面将正确显示，唯一的问题是页面无法验证。另一方面，如果
    JavaScript 交换大写和小写字母，脚本将无法运行。

    - 变量类型未定义：在创建变量时，不需要指定将存储的数据类型。这样，同一个变量在脚本执行期间可以存储不同类型的数据。

    - 不需要在每个句子末尾加上分号字符（`;`）：在大多数编程语言中，强制要求用分号字符 `;` 结束每个句子。虽然 JavaScript 不要求你这样做，但遵循在每个句子末尾加上分号（`;`）的传统是有利的。

    - 可以包含注释：注释用于在程序的源代码中添加信息。虽然注释的内容不会显示在屏幕上，但必须对注释中包含的信息采取小心。JavaScript 定义了两种注释：单行注释和跨多行的注释。


    ### 单行注释示例


    ```javascript

    //下面是一个警报消息 (" test message");

    ```

    单行注释通过在行开头添加两个斜杠（`//`）定义。


    ### 多行注释示例


    ```javascript

    /* 当你需要在注释中包含足够的信息时，多行注释非常有用 * /

    alert (" test message");

    ```

    多行注释通过将注释文本封装在符号 `/*` 和 `*/` 之间定义。


    ## 创建测试页面


    为了在 HTML 页面中高效编写，最好是创建一个模型页面，在其中必须包含指示脚本开始和结束的标签。


    由于 `head` 是通常插入 JavaScript 代码的页面部分，请看这个用于编写你所有脚本的模型页面的 HTML 代码示例。


    前两行确定了文档的类型，它的存在对于 `DHTML` 指令的正常运行至关重要，正如我们在“使用 JavaScript 和 CSS 提高交互性”章节中看到的。第四行指示了我们特别感兴趣的
    `head` 标签的开始。第五行允许你添加 `meta` 标签来指示所使用的字符，第六行给页面一个标题。


    ## 代码语法规则


    鉴于 JavaScript 是一种不灵活且不允许错误的语言，正如接下来的几行所示，遵守这些规则对于开始学习 JavaScript 至关重要。


    ### 1. 大写和小写


    JavaScript 的主要困难之一在于它是一种区分大小写的编程语言。在处理变量和对象工作时，这是一个变得非常重要的规则。


    具体来说，在 JavaScript 中，`Myobject` 不同于 `myobject`。这适用于所有的关键字（属性、方法、JavaScript 函数），使用如
    `Aptana` 或 `Dreamweaver` 编辑器等设计工具可以有助于识别这种语法，因为它们几乎可以瞬间通过颜色识别出来。另一个语法规则涉及插入注释。每当你阅读一篇文章时，标题都会告诉你文章在论述什么，内容以特定的方式结构化，通常以一句引起你兴趣的句子开头，随后是轶事、事实和数据、论点和结论。当你开始在
    HTML 中编写代码时，你会发现它的结构与你阅读或编写的文章非常相似。


    ### 2. 插入注释


    与大多数编程语言一样，在脚本中插入注释可能非常有用。事实上，除了能够更容易找到你创建的指令块外，注释在你必须重新处理代码的那天可以提供巨大的帮助。代码的可读性甚至是决定
    JavaScript 代码质量的主要标准之一。因为，毕竟，如何……


    ## 创建 JavaScript 个人库


    随着时间的推移，你将不得不开发许多以后可以重复使用的脚本。为了方便这种重用，请为你的脚本命名，以明确指示其目的。


    不要混淆个人库和网络中大量的常用库，后者丰富了经典的 JavaScript 操作。新 JavaScript 库的将在“使用 JavaScript 和 CSS
    提高交互性”章节中讨论。


    ## JavaScript 示例


    `<script>` 标签通常用于包含我们的 JavaScript 语句。`script` 标签可以根据需要放在网页的任何位置。重要的是将其保持在 `<head>`
    中以获得正确的结果。一个可以说明此点的示例是帮助打印“Hello World”。为了确保在使用无法使用 JavaScript 的浏览器时我们的代码仍然有效，必须在
    HTML 代码中编写 JavaScript 代码。观察下面的代码


    ```html

    <html>

    <body>

    <script language="JavaScript" type="text/javascript">

    <!--

    Document.write ("Hello World!")

    //-->

    </script>

    </body>

    </html>

    ```


    上述代码获得的结果是：Hello World！这里 `//` 是 JavaScript 中发现的一种短语，用于阻止任何浏览器将最后的 HTML 语句翻译为
    JavaScript 代码部分。


    ## 第 3 章：基础编程结构


    ### 变量


    变量是数据的“命名存储”。我们可以使用变量来存储专业知识、访问者和其他信息。


    使用关键字在 JavaScript 中创建变量。


    下面的句子创建（换句话说：声明）了一个名为 `message` 的变量：


    ```javascript

    var message

    ```


    现在我们可以使用赋值运算符 `=` 向其放入信息：


    ```javascript

    message = "Hello World";

    ```

