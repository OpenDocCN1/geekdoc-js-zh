    value of x is: " + x); |


    Notice how the variable ''x'' can still be accessed inside the turnToZero() function.
    Here’s where a lot of beginners get confused: when you pass a variable to a function,
    just like what we did when we invoked:


    | turnToZero(x); |


    You’re just copying the value of x into the function, and placing it into the
    temporary variable named ''number''. This means that when you do stuff to the
    variable ''number'', you’re not really doing anything to x. This is why the turnToZero
    function is useless; when you pass a variable into it, only the value of the temporary
    variable is changed, not the actual variable.


    That being said, you don’t have to pass a global variable to a function in order
    to modify its value. We can simply do the following:


    | var x = 10; // this is a global variable because it isn’t declared inside the
    functionvar turnToZero = function() {    x = 0;    console.log("The value of x
    is now: " + x);}; console.log("Before calling the function, the value of x is:
    " + x);turnToZero();console.log("After calling the function, the value of x is
    now: " + x); |


    In a nutshell, the var keyword, apart from telling the computer that you’re declaring
    a variable, also tells the interpreter to create a new variable in the current
    scope, which is why if it’s created inside a function, it’ll only exist inside
    a function, and if it’s created outside a function, it’ll exist throughout the
    whole code. With this in mind, you might be wondering why one would even need
    local variables if global variables are much easier to use. The reason for this
    is that global variables can make it harder to read and debug programs. You’ll
    notice this when you start creating more complex JavaScript codes, but for now,
    it’s best not to try modifying global variables inside a function unless you know
    exactly why you’re doing it.


    Types of variables


    Be aware that a variable is able to hold values that are of number type and text
    type. A text value is called a text string and while JavaScript is capable of
    handling several different data types, for now, we will concentrate on the numbers
    and the strings.


    A text string is enclosed in single or double quotes while a number has no quotes.
    If you were to enclose a number inside a set of quote marks, it would be seen
    as a string. For example:


    var pi = 3.14;


    var person = "Jane Deer";


    var answer = ''Yes I can!'';


    One Statement, Several Variables


    You are not limited to one variable per statement; you can use several. Just make
    sure you begin the statement with the var keyword and then ensure that each variable
    name is separated by a comma:


    var person = "Jane Deer", carName = "Ford", price = 300;


    Each declaration can go over more than one line:


    var person = "Jane Deer",


    carName = "Ford",


    price = 300;


    Undefined Value


    In a computer program, it wouldn’t be unusual to find a declared variable that
    has no value. In these cases, the value may be the result of a calculation that
    has to be done or perhaps something that may be input later, such as something
    from a user. These variables, although they have no specific value, actually have
    a value of undefined. After the next statement is executed, the variable called
    carName will have a value of undefined:


    var carName;


    Re-Declaring a Variable


    Variables that are re-declared do not lose their initial value. For example, if
    we re-declared carName, it would retain its vale of “Ford” after the statements
    are executed:


    var carName = "Ford";


    var carName;


    Arithmetic


    With a JavaScript variable, you can use certain operators that allow you to do
    arithmetic, such as, + and =. For example:


    var x = 3 + 4 + 5;


    You are also able to add strings together but these will be concatenated, i.e.
    joined together. For example:


    var x = "Jane" + " " + "Deer";


    You could also do this:


    var x = "3" + 4 + 5;


    If you place a number inside quote marks, the remaining numbers will be seen as
    strings and they will be concatenated or joined together. Have a go at this:


    var x = 1 + 4 + "5";


    Data Types


    A variable is able to hold several data types, such as strings, numbers, objects,
    etc.


    var length = 15;                               // Number


    var lastName = "Parker";                      // String


    var x = {firstName:"Jane", lastName:"Deer"};    // Object


    Data types are a very important concept for you to remember in computer programming.
    If you are going to perform an operation on a variable, you must have some knowledge
    about the type. Take the following example; without a type, the computer could
    not solve this safely:


    var x = 15 + "Ford";


    Does this make any sense? Adding Ford to 15? Would it come up with a result or
    an error? JavaScript will see this example as”


    var x = "15" + "Ford";


    When you add a string and a number, JavaScript will see the number as a string.
    Try this example yourself:


    var x = 15 + "Ford";


    And this one:


    var x = "Ford" + 15;


    The first example shows JavaScript seeing the numbers 15 and 6 as numbers until
    it gets to “Ford”. The second example shows everything being treated as a string
    because the first one is a string.


    Dynamic Types


    Dynamic types are a big part of JavaScript. What this means is that one variable
    can hold several different data types. For example:


    var x;               // x is undefined


    var x = 6;           // x is a Number


    var x = "Jane";      // x is a String


    Strings


    Strings are series of characters, such as “Jane Deer”. All strings are enclosed
    in double or single quotes – please note, you cannot mix these and use, for example,
    a single quote to open a string and a double quote to close it.


    var carName = "Ford XS80”;  // with double quotes


    var carName = ''Ford XS80;   // with single quotes


    You should also remember that quotes can be used in a string provided they are
    not the same as those around the string:


    var answer = "It''s ok";             // A single quote used within double quotes


    var answer = "He is called ''Billy''";    // Single quotes used within double
    quotes


    var answer = ''He is called "Billy"'';    // Double quotes used within single
    quotes


    We will talk more about strings later in the book.


    The next few points are just an overview of what we will cover more of later in
    the book but, for now, they are included here because they are related to data
    types.


    Numbers


    JavaScript contains just one number type and the numbers may or may not have decimal
    places, for example:


    var x1 = 56.00;     // with a decimal place'
