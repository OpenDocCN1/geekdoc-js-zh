    Another way of controlling flow is to use a `switch` statement. This provides
    you with the option of testing for a range of values for the variables and can
    be used in place of complicated, long `IF … ELSE` statements.


    Start with the word `switch` and then a set of parentheses. The variable you are
    checking is placed between the switch parentheses and is followed by a set of
    curly brackets. The rest of the `switch` statement goes in between the curly brackets.


    ### Booleans Can be Objects


    Usually, a `Boolean` is a primitive value that has been created from a literal:


    ```

    var x = false;

    ```


    but a `Boolean` may also be defined as an object by using the keyword `new`, for
    example:


    ```javascript

    var y = new Boolean (False)

    ```


    ### The Switch Statement


    Switch statements are used when we want to carry out differing actions depending
    on differing conditions, i.e. to choose from one of several code blocks to execute.


    This is how the `switch` statement works:


    - The expression value is compared against each `case` value

    - If a match occurs, the block of code associated with the match will be executed.


    ### Flow control structure


    If you wanted to create a user registration form that asks for the user’s name,
    email address, age, and password, you’d first declare the variables as:


    ```javascript

    var name;var email;var age;var password;

    ```


    Now we’d need to store the user’s input. For now, we use the `prompt` function:


    ```javascript

    name = prompt(''What’s your name?'');email = prompt(''What’s your email?'');age
    = prompt(''What’s your age?'');password = prompt(''Please enter your desired password:
    '');

    ```


    Assuming you’ve entered the right kind of information in the data fields, the
    `name`, `email`, `age`, and `password` variables now have the right type of data
    to process and store. What if, however, the user leaves the email field blank,
    or the age field with a letter? We can’t just let the program continue if some
    of the vital fields of information don’t have the right kind of data, therefore
    we use flow control statements. The first one we shall discuss is the `if` statement.


    #### if...structure


    Sometimes we have to take different function depending on different circumstances.
    We can use it with an `if` statement and a conditional operator `?` also called
    a "question mark operator."


    #### 2.10.1 "If" statement


    `if statement(...)` evaluates the condition in parentheses and if the result is
    true, execute the block of code.


    For example:


    ![Description: 00120.jpeg](images/00030.jpeg)


    this example above, the condition is equality check (`year == 2015`), but it can
    always be more complex.


    We want to execute more than one statement; we need to wrap your block of code
    inside the braces:


    ![Description: 00121.jpeg](images/00031.jpeg)


    We recommend that you wrap the code block with `{}` loopholes each time you use
    the `if` statement, even if there is only one statement to execute. This will
    improve readability.


    ### Function and basic properties of JavaScript


    In general, functions serve as “subprograms” that you can invoke using internal/external
    codes. Similar to a complete program, a function has a group of statements known
    as its “body.” JavaScript allows you to pass values to a function. Additionally,
    a function can return a value.


    JavaScript considers functions as first-class objects, since they possess methods
    and properties found in other programming objects. The main difference between
    functions and other JavaScript objects is that you can invoke a function whenever
    you need to.


    #### What is a Function?


    In JavaScript, each function is treated as a unique object. Also, functions are
    different from procedures. Functions return a value 100% of the time, while some
    procedures don’t.


    You must add a `return` statement in your functions if you want them to return
    a value. The `return` statement specifies the value/s that must be returned. Functions
    that don’t have a return statement give a default value. In most cases, the default
    value of a function is `"undefined``.


    The arguments of a function are the parameters used in calling it. JavaScript
    uses values to pass arguments to a function. If a function modifies an argument’s
    value, the modification won’t appear globally or inside the function itself. However,
    an object reference is a value too (and a special one at that) – if a function
    alters the properties of a referred object, the alteration/s will appear globally.


    #### How to Define a Function


    In JavaScript, you can define functions in different ways. Let’s discuss each
    approach in detail:


    - **Using the function statement** – JavaScript offers a special syntax that you
    can use to declare a function. The syntax is:


    ![Description: 00032.jpeg](images/00032.jpeg)


    That syntax has three different parts, which are:


    - `name` – This is the name of the function. You may replace this with any valid
    identifier.

    - `param` – This is the argument/parameter that you want to pass to the function.
    JavaScript allows you to include up to 255 parameters in each function.

    - `statements` – this section holds the statements (i.e. the body) of a function.


    - **Through the function expression** – this approach is similar to the previous
    one. In fact, it uses the syntax (see below):


    ![Description: 00033.jpeg](images/00033.jpeg)


    - **Using JavaScript’s “Function Constructor”** – JavaScript allows you to generate
    functions using `new` (i.e. a JavaScript operator). Here is the syntax that you
    must use:


    ![Description: 00034.jpeg](images/00034.jpeg)


    The syntax above has the following parts:


    - `arg1, arg2, … argN` – This part holds the name/s you want to use as the formal/s.

    - `functionBody` – this is a string that statements.


    #### How to Call a Function


    When defining a function, you are just naming that function and assigning what
    to be done once the function is invoked/called. Call a function if you want it
    to perform the actions. For instance, if you have defined the `square` function,
    you may call it using the following code:


    ```javascript

    square(2);

    ```


    The code above calls the `square` function and assigns 2 as the argument. The
    function runs its statements and gives 4 as the resulting value.


    Your functions must be within the proper scope when you call them. However, you
    can hoist (i.e. lift to the top) your function declarations. Here’s an example:


    ![Description: 00035.jpeg](images/00035.jpeg)


    A function’s arguments may hold different programming elements (i.e. not just
    numbers and strings). JavaScript allows you to assign entire objects to your functions.
    For example, `show_props()` (i.e. a built-in function) accepts objects as arguments.


    #### The Scope of a Function


    If you defined a variable within a function, you won’t be able to access that
    variable from outside the function. That’s because you defined the variable within
    the function’s scope only. A function, however, can access all of the variables
    and other functions created within the scope in which it was defined. Simply put,
    global functions can access global variables. A nested function (i.e. a function
    placed inside another function) can access the variables created inside its “mother
    function.”


    #### The Arguments of a Function


    JavaScript treats arguments as array objects. Inside a function, you may access
    the arguments it contains using the following syntax:


    ```javascript

    arguments[n]

    ```


    In this syntax, `n` represents the argument’s ordinal number, beginning at zero.
    That means the initial argument of a function is `arguments[0]`.


    If you’ll use the JavaScript object called `arguments`, you may invoke functions
    that hold more arguments than what was declared in the code. This object can be
    extremely useful, especially if you have no idea about the number of arguments
    that you must assign to a function. To determine the quantity of objects inside
    a function, you may use `arguments.length`.

