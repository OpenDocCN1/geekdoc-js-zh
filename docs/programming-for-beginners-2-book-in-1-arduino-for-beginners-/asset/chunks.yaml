    # JavaScript 历史


    该语言最初发布为 `LiveScript`，后来被更名为 `JavaScript`。从那时起，`JavaScript` 成为该语言的名称，这可能是 `Netscape`
    试图利用当时极其受欢迎的 `Java` 编程语言的成功，尽管 `JavaScript` 在语法上某些地方与 `Java` 有相似之处，但两者之间并没有特别的联系。


    `JavaScript` 最初仅用于客户端脚本或创建动态网页（正如我们已经讨论过的那样）。`JavaScript` 的第一个服务器端实现在 `JavaScript`
    初始发布一年左右出现。今天，尽管客户端端的 `JavaScript` 实现远比常见，但服务器端的 `JavaScript` 仍在实现中。


    20 世纪 90 年代中期见证了许多重要 Web 技术的发展，也引发了浏览器大战。`JavaScript` 在浏览器大战中发挥了重要作用，它迅速流行并被 `Netscape`
    实现在他们的浏览器中。然而，当时 `Netscape` 的主要对手 `Internet Explorer` 并不支持 `JavaScript`。


    这种情况在 1996 年底开始发生变化。显而易见，为了让所有浏览器都能访问世界维网，需要某种 `JavaScript` 的全行业标准。为了实现这一点，`Netscape`
    将其语言发送到一个标准委员会，以便对语言进行审查和标准化。该语言标准名为 `ECMAScript`，于 1997 年发布。这种标准化成为许多不同语言的起点，并且它本身就是一种语言。它是某种语言的标准，其他语言都是基于此派生出来的。所有这些不同的衍生语言被称为该标准的实现。`JavaScript`
    是最流行的一种，但也出现过其他几种实现，例如为 Flash 编码设计的 `ActionScript`。


    随着 `ECMAScript` 的标准化，`JavaScript` 终于被其他浏览器使用，而不仅仅是 `Netscape`。`JavaScript` 在 21
    世纪 00 年代是一个充满野心的目标。由于在发布了一篇定义 `Ajax` 的白皮书后，`JavaScript` 及其用途在公众（尤其是开发者）中变得流行，这篇白皮书基本上承诺了开发极其动态的网页，以区别之前的静态页面。这导致了更多可以与
    `JavaScript` 配合使用的技术的发展，例如 `jQuery`，一直持续到 2015 年或 2016 年。


    稍后的 21 世纪 00 代，终于有了凝聚性的工作来推动 `JavaScript` 语言的地位，并强制制定适用于新技术的新标准。从那时起，创建了新的实现和不断的统一更新，以开发出统一的
    `ECMAScript` 版本。因此，所有 `ECMA` 的实现（包括 `JavaScript`）都导致了更多技术可能性。


    在过去的几年里，`ECMAScript` 的新标准每年发布一次。


    `JavaScript` 的重大突破可能是 `Ajax`，当时开发者开始对这种语言产生兴趣并支持它。今天，对浏览器支持有更大的需求，`JavaScript`
    开始推动这一焦点。从那时起，它已成为最广泛使用的 Web 脚本语言。


    `JavaScript` 的历史表明，它经历了重重挑战才变成今天的模样。我希望你欣赏它所经历的道路。在接下来的章节中，我们将讨论我们目前处于什么位置，以及
    `JavaScript` 的所有用途。


    ## 第 1 章：什么是 JavaScript？


    ### 什么是 JavaScript？


    `JavaScript`，缩写为 `JS`，是一种高级编程语言，用于为网页添加特定的程序，已被所有主流 浏览器采用。`JavaScript` 可用于构建交互式
    Web 应用程序，使其在每次操作后无需重新加载页面即可正常运行。`JavaScript` 用于在网页内创建不同形式的活动，它是网页的核心组成部分之一，正如
    `HTML`（超文本语言）和 `CSS`（层叠样式表）。`JavaScript` 赋予页面生命，增加了如滑块、弹出窗口等效果。`CSS` 则决定了颜色、字体、字体大小等。


    ### 为什么要学习 JavaScript


    `JavaScript` 目前是每个浏览器中排名最高的编程语言。因此，了解 `JavaScript` 的作用是非常重要的。


    以下是 `JavaScript` 作用的一些细节：


    - `JavaScript` 设计初衷是为了让用户管理浏览器。

    - `JavaScript` 能够根据需要对用户进行某些中的功能操作。

    - 通过配备计算器，`JavaScript` 能够解决问题。

    - `JavaScript` 在用户输入无效时能够警告用户。

    - `JavaScript` 用户始终可以编写脚本中的新功能。


    `JavaScript` 也具有一些局限性，如下：


    - 对于，`JavaScript` 缺乏多线程能力，这意味着它无法同时执行多个线程。

    - 对于，`JavaScript` 的设计方式使其无法在没有服务器端脚本的情况下访问其他域名的页面。但值得注意的是，用户可以获取一些客户端的实现。

    - `JavaScript` 用户在不使用 `Ajax` 请求的情况下，是不被允许编写服务器端文件的。

    - 使用 `JavaScript` 的设备数量存在限制。

    - 不同浏览器对 `JavaScript` 的解释不同，导致产生不同的输出。


    ### 什么是 HTML？


    `HTML` 基本上允许你以结构化的方式展示网站内容。可以把它比作建筑的蓝图；它告诉你是客厅、浴室、厨房和其他房间放置在哪里，以及它们是如何和谐地相互连接的。


    学习 `HTML` 文件的结构非常简单；它的结构非常像文章——你提供标题、骨架结构以及在结构内流贯的内容。每当你读一篇文章时，标题会告诉你文章在讨论什么，内容会以特定的方式组织，通常有一句引人入目的句子，随后是轶事、事实和数据、论点以及结论。当你开始编写
    `HTML` 时，你会发现它与你读的文章非常相似。


