    the digital pin for pinNumber instead of analog. It is also important to note
    that digital pins by default used as input pins so it is only required of you
    to set them to OUTPUT mode. To achieve this, use the command: digitalRead (pin
    label) where the digital component will be connected to the pin label. digitalRead
    (pin number) returns either HIGH or LOW as results. 


    When you want to send a digital signal to a digital pin from the IDE platform,
    you are supposed to use the code: digitalWrite(pin label, value) where pin label
    stands for the pin number from which the signal is coming from and the value can
    either be HIGH or LOW.


    Arduino also uses the technique of Pulse Width Modulation to send Digital signal
    that is in the form of analog. The pin numbers responsible for this are: 3, 5,
    6, 9, 10 and 11\. And the command used here looks like this: analogWrite(pin label,
    value). The pin numbers are already provided up there and the value is an integer
    ranging from 0 (0%) and 100% (255).


    Examples of digital signals


    ON/OFF, Men’s table/Women’s table, pregnancy, death, consciousness and the list
    continues.


    Sensors and interfaces used here may include: Relays, Circuit breakers, Switches,
