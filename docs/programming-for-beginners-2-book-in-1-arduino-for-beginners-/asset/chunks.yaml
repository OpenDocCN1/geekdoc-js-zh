    ```javascript

    var smartPhone1 = {    screenSize: 5,    pixelDensity: 200,    processorNumber:
    2,    processorSpeed: 500,};

    var smartPhone2 = {    screenSize: 6,    pixelDensity: 400,    processorNumber:
    8,    processorSpeed: 2000,};

    ```


    这使得组织数据变得更加高效和简单。


    作为一个练习，请尝试使用点符号（dot notation）访问属性，并将每部手机的详细信息打印到控制台。为了帮助你开始，这里是将 `smartPhone1`
    的 `screenSize` 打印到控制台的代码：


    ```javascript

    console.log(smartPhone1.screenSize);

    ```


    到为止，我们已经可以使用点符号来访问对象的任何信息或函数。我们使用点符号所访问的变量被称为**属性**（properties），而我们使用点符号所访问的函数被称为**方法**（methods）。


    方法和属性的概念源于将现实世界概念转换为代码的需求。回到我们的手机示例，例如，如果没有对象，就没有简单的方法来告诉哪个屏幕尺寸属于特定的手机，除非将手机名称和屏幕尺寸存在两个不同的数组中。当添加更多属性时，这会迅速变得复杂。


    回到我们对函数的解释，函数能够通过通过函数名被调用来保留大量的指令而不会弄乱整个源代码。回到我们的手机示例，手机在可用功能以及这些功能的内部实现上是存在差异的。例如，让我们为之前示例中的两部手机添加一个短信功能，以及更换
    SIM 卡的能力：


    ```javascript

    var smartPhone1 = {    screenSize: 5,    pixelDensity: 200,    processorNumber:
    2,    processorSpeed: 500,    simCardNumber: 123456,    textNumber: function(number,
    text)    {        console.log("Message, ''" + text + "'' has been sent to " +
    number);        console.log("Processing time: " + text.length/this.processorNumber);    },    setSimCardNumber:
    function(newSimCardNumber)    {        this.simCardNumber = newSimCardNumber;    },};

    var smartPhone2 = {    screenSize: 6,    pixelDensity: 400,    processorNumber:
    8,    processorSpeed: 2000,    simCardNumber: 654321,    textNumber: function(number,
    text)    {        console.log("''" + text + "'' sent to " + number);        console.log("Processing
    time: " + text.length/this.processorNumber);    },    setSimCardNumber: function(newSimCardNumber)    {        this.simCardNumber
    = newSimCardNumber;    },};

    ```


    注意两部手机都具有相同组的方法，但实现方式略有不同，就像在现实生活中一样，当你告诉某人发短信时，无论使用什么种类型的手机，你只需要指定消息和发送到的号码。至于
    `setSimCardNumber` 函数，这实际上是面向对象编程中的常见做法；而不是手动设置对象的属性，例如：


    ```javascript

    smartPhone1.simCardNumber = 55555;

    ```


    因为设置器（setter）至少可以有一组额外的指令，比如检查过程中可能出现的任何错误。


    你可能注意到的另一点是，当我们为对象创建方法时，使用了关键字 `this`。关键字 `this` 充当占位符，并将指向调用该方法的对象。例如，如果你输入：


    ```javascript

    smartPhone2.textNumber(0000, "Hi!");

    ```


    那么我们调用了函数：


    ```javascript

    textNumber: function(number, text)    {        console.log("''" + text + "'' sent
    to " + number);        console.log("Processing time: " + text.length/this.processorNumber);    },

    ```


    这使得对 `processorNumber` 变量产生了引用。由于 `this` 关键字，函数会在调用它的对象中找到名为 `processorNumber`
    的变量，即 `smartPhone2`。


    # # 面向对象编程简介：类


    类（Class）是信息结构的扩展概念，而不仅仅持有信息。它可以同时包含函数和数据。另一方面，对象（Object）是类的实例化。对于变量来说，类是类型，而对象是变量。


    类在很大程度上使用关键字 `class` 声明，其语法如下：


    ```class

    class <className> {


    accessSpecifier:

    memberData;


    memberFunction;


    accessSpecifier:

    memberData;


    memberFunction;


    } <objectName>;

    ```


    其中 `className` 是标识符，`objectName` 是该类的对象。


    ## 访问修饰符（Access Specifiers）


    从根本上说，区别在于我们可以包含以下关键字之一：`private`、`public` 或 `protected`。这些修饰符改变了访问成员的权限。


    - **私有（Private）**：此类成员仅在同类内部或其派生类中可用。

    - **保护（Protected）**：此类成员可以在同类成员以及其派生类中可用。

    - **公共（Public）**：此类成员在任何该项可见的地方可用。


    默认情况下，类的所有成员都是私有的。


    ```cpp

    class myRectangle {


    double a, b;


    public:


    void setValues (double, double);


    double func (void);


    } myRect;

    ```


    在这个示例中，`a` 和 `b` 是私有的，而函数 `setValues()` 和 `func()` 是公共的。


    ## 构造函数与析构函数（Constructors and Destructors）


    通常需要在创建期间初始化变量或分配动态内存以便以便并避免返回垃圾值。


    回想我们之前的示例，如果你在没有初始化的情况下将 `a` 和 `b` 作为参数传递给函数，函数获取的值将是垃圾。你的代码可能会产生错误结果或直接崩溃。


    为了避免这种情况，类可以包含一个特殊的函数称为构造函数，它在类的另一个对象创建时被自动调用。此构造函数的名称必须与类名相同，且不能有任何返回类型。


    `main()` 中的第一个语句实例化了类 `myRectangle`。创建对象时传递的参数调用了构造函数并将矩形的尺寸初始化为 1 和 2。因此，当调用
    `areaRect()` 时，函数返回了正确的面积值 2。


    构造函数不能像普通函数那样被显式调用。它们在类的另一个对象创建时会自动执行。


    析构函数了相反的功能。它在对象需要被销毁时被调用，由于它的生命周期结束（例如，它是函数内部的局部对象且函数已关闭），或者它是动态分配并通过 `delete`
    运算符释放的。


    析构函数必须与类名相同。但是，在名字前面加上波浪号（`~`），并且它同样不应该返回任何值。


