  trans: "\n让我们来看看，通常当我们谈论“函数”（function）时，你脑海中浮现的第一个词是什么？显然是一个活动对吧？\n\nJavaScript\
    \ 中的函数工作方式也类似。函数是程序需要重复执行的代码块。`Function` 用于执行特定的任务。一个 `Function` 可以包含任意数量的参数和语句；它们甚至可以一个参数都没有。取决于代码结构的编写方式，它可能会向用户返回任何值，也可能不返回。\n\
    \n一个 `Function` 的声明方式如下：\n\n```\nFunction name( ) { /*要被执行的代码块*/}\n```\n\n要启动一个\
    \ `Function`，我们从 `function` 关键字开始，然后添加名称和括号。要结束函数，我们将需要被执行的代码块放在圆大括号中。\n\n你也可以将函数放在一个具名的变量中——\n\
    \n```javascript\nvar jam = function() {/*需要被执行的代码块*/}\n```\n\n下面是几个关于如何执行函数的示例——\n\
    \n### i) 这是一个最基础函数的示例\n\n```javascript\nvarsayHello = function(person, greeting)\
    \ {\nvar text = greeting + ‘ , ‘+ person;\nconsole.log(text);\n};\n\nSay Hello\
    \ (‘ Jessica’ , ‘ Hello’);\n```\n\n### ii) 这是一个返回值的函数的示例\n\n```javascript\nvar\
    \ greet = function (person, greeting) \n{\nvar writing = greeting + ‘ , ‘ + person\
    \ ;\nreturn function () {console.log(text); };\n}\n\nconsole.log(greet(‘Richard’\
    \ ,’ Hello”));\n```\n\n### iii) 有时，你可能想使用嵌套函数（注意：嵌套函数是一个函数内部函数。）\n\n```javascript\n\
    varsayHi = function( person, greeting) {\nvar text = greeting + ‘,’ + person;\n\
    return function() {console.log (text);}\n};\n\nvar greeting = greet( ‘ Richard’\
    \ , ‘Hello’);\ngreeting();\n```\n\n## 自执行匿名函数\n\n程序员们一直在寻找最先进、最巧妙的方法来改进他们的编程体验，并让编程变得更容易上手、更简单。这导致了自执行匿名函数（Self-Executing\
    \ Anonymous function）的诞生。\n\n自执行匿名函数的核心目的是创建一个 JavaScript 函数，并在创建概念后立即执行它。\n\n\
    这使得对于正在编写大型程序的程序员来说变得容易得多。同样，它将帮助你编写代码，而不会创建一个混乱的全局命名空间。\n\n一个基本的自执行匿名函数如下——\n\
    \n![Description: 00006.jpeg](img/00036.jpeg)\n\n如果你计划在 JavaScript 中编写复杂的代码，那么理解如何使用这种类型的函数是非常重要的。使用自执行匿名函数可以产生一些易用的优秀代码。例如，JQuery\
    \ 库的设计是为了让在网站上使用 JavaScript 变得更容易。它通过将整个库封装在一个大的自执行函数中来实现这一点。\n\n## Typeof 运算符\n\
    \n你可能会遇到一种情况，即需要确定你在 JavaScript 中处理的变量类型。你不需要请夏洛克·福尔摩斯来帮你寻找答案！相反，你可以简单地使用 `typeof`\
    \ 运算符来确定任何特定值的类型。换句话说，`typeof` 运算符用于评估操作数的类型。\n\n示例-\n\n```javascript\nvar myvar=0\n\
    alert(typeofmyvar) //弹出 “number”\n```\n\n数字（Number）并不是唯一可以检测的操作数类型。它还可以是：字符串（string）、布尔（Boolean）、对象（object）、null\
    \ 和未定义（undefined）。\n\n## 作用域（Scope）\n\n作用域变量的可访问性。\n\n在调试时，很好地理解作用域是必要的，因为它可以让你知道是哪个代码块中的变量导致了问题。\n\
    \n这里的简单规则是，每当你在作用域内部声明变量时，它只会被该作用域内的语句识别；作用域之外的语句不会承认它的存在，因此该变量将无法作用。\n\n观察此问题的另一种方法是，将你的整个代码想象成一家酒店，特定的函数和代码段是酒店房间。酒店房间代表代码的私有作用域，而公共区域代表全局作用域。一个酒店房间里的人无法看到或使用另一个酒店房间里的东西。在酒店（以及全局作用域）内工作的员工在没有特定许可的情况下，无法访问私有酒店房。同时，客人可以通过公共区域并使用那里的任何对象。\n\
    \n因此，你可以看到作用域是如何影响你的代码运行的的。如果你需要两个不同的函数访问同一个变量，你需要确保它们都能访问该变量。确保必要变量可访问的一种关键方法是将你的变量设为全局可用。\n\
    \n如果你想让你的变量变为全局可用，有两种可能的替代方案。\n\n你可以做的第一件事是在给定代码段的作用域之外声明变量，这将允许程序中的任何函数都能调用并识别它。\n\
    \n你可以做的另一件事是在作用域内声明变量但不使用 `var` 关键字。如果同一个变量在相关代码段的作用域之外开头没有定义，那么该变量将表现类似于全局变量。\n\
    \n示例-\n\n```javascript\nvar foo = ‘hello’;\nvar talkHello = function() {\nconsole.log(foo);\n\
    };\n\ntalkHello(); // 打印 ‘hello’\nconsole.log(foo); // 也打印 ‘hello’\n```\n\n如你所见，变量\
    \ `foo` 在作用域之外声明。这意味着 `foo` 是全局的，任何函数都可以访问它。这显示了：\n\n```javascript\nvar foo =\
    \ ‘hello’;\nvar talkHello = function() {\nconsole.log(foo);\n};\n\ntalkHello();\
    \ // 打印 ‘hello’\nconsole.log(foo); // 也打印 ‘hello’\n```\n\n在这个示例中，`doo` 在函数内部被调用。这创建了一个仅对函数可见的私有变量。\n\
    \n```javascript\nvar talkHello = function() {\nvar doo = ‘hello’;\nconsole.log(doo);\n\
    };\n\ntalkHello();\nconsole.log(doo); // 返回 undefined\n```\n\n## break 语句\n\n\
    程序员使用此语句结束循环或 switch 语句。在使用 `break` 语句时，你必须记住以下规则：\n\n- 如果你的 `break` 语句没有标签，它将终止内部循环/switch\
    \ 并将控制传递到下一个语句。\n- 如果你的 `break` 语句有标签，它将终止带有标签的语句。\n\n`break` 语句的语法为：\n\n![Description:\
    \ 00028.jpeg](img/00037.jpeg)\n\n如果你不需要标签，使用语法的第一种形式这将终止内部循环/switch。如果你想终止特定的循环/switch，使用第二种形式。只需输入特定循环或\
    \ switch 的标签。使用第二种形式时，只有指定的循环/switch 会终止。\n\n## for...of 语句\n\n该语句是 JavaScript\
    \ 语言的新新增。它创建了一个可以重复可迭代对象（例如 map、set、数组、参数等）的循环。它还会为对象的每个属性调用一个迭代钩。JavaScript 允许你自定义任何\
    \ `for...of` 语句的迭代钩。这是你必须使用的语法：\n\n![Description: 00029.jpeg](img/00038.jpeg)\n\
    \n## for...in 语句\n\n`for...in` 语句在任何对象的属性上重复执行赋值语句。JavaScript 将为每个属性执行赋值语句。`for...in`\
    \ 语句的语法为：\n\n![Description: 00030.jpeg](img/00039.jpeg)\n\n## continue 语句\n\n\
    你可以使用此语句重启其他语句（例如 for、while、do... while 和标签）。在使用 `continue` 语句时，你必须记住以下规则：\n\n"
- fmt: "\n- If you won’t include a label in your `continue` statement, it will terminate\
    \ the current process of the innermost loop and continue the next one. Unlike\
    \ a `break` statement, a `continue` statement cannot terminate an entire loop.\
    \ If used on “while” loops, the control flow will return to the assigned condition.\
    \ If used on a “for” loop, on the other hand, the control flow will go back to\
    \ the increment expression.\n- If you’ll include a label in your `continue` statement,\
    \ it will only affect the statement linked to that label.\n\nThe syntax of a `continue`\
    \ statement has two forms, which are:\n\n![Description: 00031.jpeg](images/00040.jpeg)\
    \ Other Control Structures\n\n### Other Control Structures\n\nThe flow control\
    \ structures that have been seen (`if`, `else`, `for`) and the sentences that\
    \ modify their behavior (`break`, `continue`) are not sufficient to perform some\
    \ complex tasks and other types of repetitions. For this reason, JavaScript provides\
    \ other flow control structures that are different and in some cases more efficient.\n\
    \n#### The while structure\nThe `while` structure allows you to create loops that\
    \ run no more or more times, depending on the condition indicated. Its formal\
    \ definition is: `while (condition) {... }`\n\nThe operation of the `while` loop\
    \ is summarized in: \"While the indicated condition is fulfilled, repeat the instructions\
    \ included within the loop indefinitely\". If the condition is not met even the\
    \ first time, the loop is not executed. If the condition is met, the instructions\
    \ are executed once and the condition is checked again. If the condition is still\
    \ fulfilled, the loop is executed again and so it continues until the condition\
    \ is not met. Obviously, the variables that control the condition must be modified\
    \ within the loop itself, since otherwise, the condition would always be met and\
    \ the `while` loop would be repeated indefinitely.\n\n#### Structure do ... while\n\
    The loop of type `do ... while` is very similar to the `while` loop, except that\
    \ in this case the instructions of the loop are always executed at least the first\
    \ time. Its formal definition is: `do { ... } while (condition);`. In this way,\
    \ as the condition is checked after each repetition, the loop instructions are\
    \ always executed the first time. It is important not to forget that after the\
    \ `while()` the character must be added; (contrary to what happens with the simple\
    \ `while` loop). \n\nUsing this loop you can easily calculate the factorial of\
    \ a number:\n```javascript\nvar result = 1;\nvar number = 5;\ndo {\n    result\
    \ *= number; // result = result * number\n    number--;\n} while (number > 0);\n\
    alert(result);\n```\nIn the previous code, the `result` is multiplied in each\
    \ repetition by the value of the variable `number`. In addition, in each repetition,\
    \ the value of this variable `number` is decremented. The condition of the `do\
    \ ... while` loop is that the `number` value is greater than 0 since the factorial\
    \ of a number multiplies all numbers less than or equal to itself, but up to `number`\
    \ (the factorial of 5, for example, is 5 x 4 x 3 x 2 x 1 = 120). As in each repetition,\
    \ the value of the variable `number` is decremented and the condition is that\
    \ `number` is greater than zero, in the repetition in which `number` is worth\
    \ 0, the condition is no longer fulfilled and the program leaves the `do loop\
    \ ... while`.\n\n#### Switch Structure\nThe `if ... else` structure can be used\
    \ to perform multiple checks and make complex decisions. However, if all conditions\
    \ always depend on the same variable, the resulting JavaScript code is too redundant:\n\
    ```javascript\nif (number == 5) {...} else if (number == 8) {...} else if (number\
    \ == 20) {... } else {... }\n```\nIn these cases, the `switch` structure is the\
    \ most efficient, since it is specially designed to easily handle multiple conditions\
    \ on the same variable. Its formal definition may seem complex, although its use\
    \ is very simple. The `switch` structure is defined by the reserved keyword `switch`\
    \ followed, in parentheses, by the name of the variable to be used in the comparisons.\
    \ As usual, the instructions that are part of the `switch` are enclosed in `{}`.\
    \ Within the `switch`, all the comparisons that you want to make on the value\
    \ of the variable are defined. Each comparison is indicated by the reserved word\
    \ `case` followed by the value with which the comparison is made.\n\nWhat happens\
    \ if no value of the `switch` variable matches the values defined in the `cases`?\
    \ In this case, the `default` value is used to indicate the instructions that\
    \ are executed in the case where no case is met for the indicated variable. Although\
    \ `default` is optional, `switch` structures usually include it to define at least\
    \ one default value for some variable or to display a message on the screen.\n\
    \n# Chapter 5: Data Structures: Objects & Arrays\n\n### Introduction to Objects\n\
    \nProcedural programming required programmers to spell out almost every command\
    \ to the computer. This can quickly lead to messy code, so people thought about\
    \ keeping certain commands and information inside what one can call an \"object.\"\
    \ For instance, if you wanted to create a database of pets, you’d have to do something\
    \ like:\n\n```javascript\n//First, we create arrays with the information we wish\
    \ to save \nvar petName = [\"Cat\", \"Spot\", \"Fluffy\"];\nvar petSpecies = [\"\
    Dog\", \"Fish\", \"Parrot\"];\nvar petAge = [5, 2, 6];\nvar petGender = [\"Male\"\
    , \"Female\", \"Male\"];\nvar petDetails = [petName, petSpecies, petAge, petGender];\n\
    \n//Then we create a function that displays them\nvar displayInformation = function(details){\n\
    \    for(var counter = 0; counter < petSpecies.length; counter++)\n    {\n   \
    \     console.log(\"Name: \"+ details[0][counter]);\n        console.log(\"Species:\
    \ \"+ details[1][counter]);\n        console.log(\"Age: \"+ details[2][counter]);\n\
    \        console.log(\"Gender: \"+ details[3][counter]);\n    }\n};\ndisplayInformation(petDetails);\n\
    ```\n\nWhile the code does work and provides us with relatively neat list, the\
    \ code is rather messy and can get hard to debug when new functions are added.\
    \ That being said, here’s a code snippet that turns the first into an object:\n\
    ```javascript\nvar pet = {};\npet.name = \"Cat\";\npet.species = \"Dog\";\npet.age\
    \ = 5;\npet.gender = \"Male\";\npet.showDetails = function(){\n    console.log(\"\
    Name: \"+ this.name);\n    console.log(\"Species: \"+ this.species);\n    console.log(\"\
    Age: \"+ this.age);\n    console.log(\"Gender: \"+ this.gender);\n};\npet.showDetails();\n\
    ```\nThis line `var pet = {};` is what creates an object with the name `pet`.\
    \ There are actually two ways to create an object, and this is the first, called\
    \ literal notation. We’ve started with an empty object and added attributes after\
    \ the declaration, but we can actually start with a filled object:\n```javascript\n\
    var pet = {\n    name: \"Cat\",\n    species: \"Dog\",\n    age: 5,\n    gender:\
    \ \"Male\",\n};\npet.showDetails = function(){\n    console.log(\"Name: \"+ this.name);\n\
    \    console.log(\"Species: \"+ this.species);\n    console.log(\"Age: \"+ this.age);\n\
    \    console.log(\"Gender: \"+ this.gender);\n};\npet.showDetails();\n```\nTake\
    \ note of the differences, subtle as they may be! (e.g., using a colon (`:`) instead\
    \ of an equal sign (`=`))\n\nYou can also use a constructor, turning the code\
    \ snippet into:\n```javascript\nvar pet = new Object();\npet.name = \"Cat\";\n\
    pet.species = \"Dog\";\npet.age = 5;\npet.gender = \"Male\";\npet.showDetails\
    \ = function(){\n    console.log(\"Name: \"+ this.name);\n    console.log(\"Species:\
    \ \"+ this.species);\n    console.log(\"Age: \"+ this.age);\n    console.log(\"\
    Gender: \"+ this.gender);\n};\npet.showDetails();\n```\nBoth ways of creating\
    \ objects are correct, so it really is all up to preference.\n\nNow notice how\
    \ the object is a little bit different from the other data types we’ve used so\
    \ far. This is because objects are modern concepts that serve to represent real\
