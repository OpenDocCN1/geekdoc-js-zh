  trans: "\n\n```cpp\nposition = LOW;\n\nelse\n\n    position = HIGH;\n\n// ... 函数回到了按钮被按下时的时间\n\
    \ntime = millis();\n\n}\n\ndigitalWrite(outPin, position);\n\nprevious = display;\n\
    \n}\n```\n\n# 创建循环\n\n### 所需组件\n* 六个发光二极管\n* 六个 220 欧姆电阻\n* 七根跳线线\n* 一个 Arduino\
    \ Uno\n\n在这个示例中，我们将使用六个 LED 配合 `digitalWrite(pin label, LOW/HIGH)` 函数和 `delay(\
    \ )` 来演示顺序闪烁。\n\n### 电路\n![Description: 00027.jpeg](img/00005.jpeg)\n\n### 代码\n\
    [/content]\n```cpp\nint timer = 120; // 随着数字的增加，计时会减少。\n\nint pins[] = { 2,3,\
    \ 4, 5, 6, 7, 8 }; // 数组形式的引脚号\nint value_pins = 6; // 由引脚数量表示的数组长度\n\nvoid setup()\n\
    {\n  int j;\n  for (j = 0; j < value_pins; j++) // 数组元素从 0 到 value_pins – 1 编号\n\
    \    pinMode(pins[j], OUTPUT); // 每个引脚都被设置为输出\n}\n\nvoid loop()\n{\n  int j;\n\
    \  for (j = 0; j < num_pins; j++) \n  { \n    // 遍历每个输出引脚设置一个循环...\n    digitalWrite(pins[j],\
    \ HIGH); // 打开输出引脚的函数\n    delay(timer);                 // 延迟函数，\n    digitalWrite(pins[j],\
    \ LOW); // 关闭输出引脚的函数 \n  }\n  for (j = value_pins - 1; j >= 0; j--) \n  {\n  \
    \  digitalWrite(pins[j], HIGH);\n    delay(timer);\n    digitalWrite(pins[j],\
    \ LOW);\n  }\n}\n```\n\n# 第 8 章：基础 Arduino 模拟程序\n\n## 模拟输入\n在这个项目中，我们将使用电位器作为\
    \ Arduino 板板模拟输入信号的源。理想情况下，电位器能够改变电阻（可变电阻），然后可以被 Arduino 板板作为模拟输入读取。我们将使用 Arduino\
    \ 板板上已经固定的 LED 引脚 11 作为项目的一部分。\n\n### 所需组件\n* 一个电位器\n* 一个用于 LED 照明的 Arduino 项目\n\
    * 三根跳线线\n\n![Description: 00028.jpeg](img/00006.jpeg)\n\n### 代码 Sketch\n```cpp\n\
    /* 模拟输入下的电位器项目\n此项目旨在周期性开启和关闭发光二极管。LED 的亮度取决于用电位器的电阻值。增加电阻会减少光量，反之亦然。\n*/\n\n\
    int num = 0; // 此变量存储来自传感器的输入值，初始赋值为 0\n\nvoid setup() \n{\n  pinMode(ledPin,\
    \ OUTPUT); // 函数声明 LED 为输出\n}\n\nvoid loop() \n{\n  num = analogRead(inPin); \
    \  // 读取传感器输出值的函数\n  digitalWrite(ledPin, HIGH);  // 打开 LED 的函数\n  delay(num);\
    \               // 停止程序运行一段时间的延迟函数\n  digitalWrite(ledPin, LOW);   // 关闭 LED 的函数\n\
    \  delay(num);               // 停止程序运行一段时间\n}\n```\n\n## 敲击传感器\n对于这类项目，我们将使用压电元件并将其捕捉的声音作为模拟输入到\
    \ Arduino 板板。板板的处理器能够在其 ADC（模拟数字转换器）的帮助下读取模拟信号。压电元件（敲击传感器）只是一个能够同时播放音和检测音的电子设备。Arduino\
    \ 板板将声平检测为电压水平，并将 0 到 5.0 伏的电压转换为 0 到 1024 的对应值。\n\n记住压电元件具有极性，黑线代表负极，红线代表正极。\n\
    \n在代码中，我们将尝试捕捉压电元件的声平（敲击），并确认它超过了某个阈值，然后向 Arduino IDE 平台发送“Knock”字符串信号。\n\n###\
    \ 电路\n![Description: 00029.jpeg](img/00007.jpeg)\n\n### 代码 Sketch\n```cpp\n/*\
    \ 敲击传感器\n在这个项目中，我们使用压电元件作为敲击传感器。因此，我们必须监听声平，如果信号超过了指定的阈值。\n*/\n\nvoid setup()\
    \ \n{\n  pinMode(ledPin, OUTPUT); // 函数声明 ledPin 为输出\n  Serial.begin(9600); //\
    \ 表示使用串口\n}\n\nvoid loop() \n{\n  num = analogRead(knockSensor); // 用于读取传感器值并将其存储在变量\
    \ num 中\n  if (num >= THRESHOLD)\n  {\n    statePin = !statePin; // 切换状态的逻辑\n\
    \    digitalWrite(ledPin, statePin);\n    Serial.println(\"Knock!\"); // 将字符串发送到串口\n\
    \    delay(100); // 极短的延迟\n  }\n}\n```\n\n## Arduino 平滑处理\n涉及数组的使用，代码旨在读取模拟输入，计算移动平均值并最终打印结果。\n\
    \n### 所需组件\n* 一个面包板\n* 一个 Arduino Uno\n* 一个电位器\n* 两根跳线线\n\n### 电路\n电路图和组件所示：\n\
    ![Description: 00030.jpeg](img/00008.jpeg)\n\n### 代码 Sketch\n```cpp\n// 下使用的常量保持不变：\n\
    const int analogPin = A0;\nconst int ledCount = 8; // 代表引脚数量\nint ledPins[] =\
    \ {3, 4, 5, 6, 7, 8, 9, 10}; // 引脚号\n\nvoid setup()\n{\n  // 遍历数组并将它们设置为输出\n \
    \ for (int firstLed = 0; firstLed < ledCount; firstLed++)\n  {\n    pinMode(ledPins[firstLed],\
    \ OUTPUT);\n  }\n}\n\nvoid loop()\n{\n  // 下方的代码读取电位器输出作为系统输入\n  int sensorOutput\
    \ = analogRead(analogPin);\n  // 将结果映射到 0 到 7 的 LED 范围\n  int ledLevel = map(sensorOutput,\
    \ 0, 1023, ledCount);\n\n  // 遍历引脚数组\n  for (int firstLed = 0; firstLed < ledCount;\
    \ firstLed++)\n  {\n    // 当数组索引小于 ledLevel 时\n    // 打开此特定元素的引脚\n    if (firstLed\
    \ < ledLevel)\n    {\n      digitalWrite(ledPins[firstLed], HIGH);\n    }\n  \
    \  // 关闭所有数组索引高于 ledLevel 的引脚函数\n    else\n    {\n      digitalWrite(ledPins[firstLed],\
    \ LOW);\n    }\n  }\n}\n```\n同样重要的是注意此项目的结果：随着模拟读取值的增加，八个 LED 将一个接一个开启；随着模拟读取值的减小，它们将再次一个接一个关闭。\n\
    \n# 第 9 章：Arduino 工具\n\n## Arduino 控制语句\n涉及决策的控制结构要求执行实际编程的人（程序员）明确并指定程序自身将测试和评估的特定条件。这些条件应与某些在条件返回值时将执行的语句写在一起。否则，将执行其他语句，以便对条件返回错误的响应或结果。\n\
    \n"
- fmt: "\nMost of the programming languages have a general format for decision making\
    \ structures as illustrated below: ![Description: 00014.jpeg](images/00009.jpeg)\n\
    \nThe statements within the control structure (condition) as mean to coordinate\
    \ the flow of program execution and are therefore referred to as Source Code Control\
    \ Statements.\n\nThese are statements include:\n- `If` statement\n- `If….else`\
    \ statement\n- `If…else if…else` statement\n- `Switch case` statement\n- Conditional\
    \ operator`?`\n\nAgain just to emphasize, these statements are very important\
    \ in navigating through various loops and sections in a program. Executing one\
    \ part at a time and using the results to instruct the processor on the next block\
    \ of codes to be executed.\n\n### If statement\n\nThis particular structure uses\
    \ expressions in parenthesis together with statements or block of statements in\
    \ the next line of codes. When the expression is true, then the processor is instructed\
    \ to execute the block of statements or statements that were included in this\
    \ condition. And if the expression is false, the processor skips the block of\
    \ statements or statements and gets to the next line of codes. `If` statement\
    \ takes two kinds of forms as explained below:\n\n#### First form\n```\n{\n  if\
    \ (expression)\n  block of statements;\n}\n```\n\n#### Second form\n```\nif (expression)\n\
    {\n  statements;\n}\n```\n\n#### Execution Sequence of If Statement\nThe order\
    \ of execution for `if` statement is summarized below by the diagram:\n![Description:\
    \ 00015.jpeg](images/00010.jpeg)\n\n#### Example in a program:\n```cpp\n/* definition\
    \ of Global variables */\n\nint X = 5 ;\n\nint Y= 9 ;\n\nVoid setup ()\n{ \n}\n\
    \nVoid loop ()\n{\n/* this section is used to check the boolean condition */\n\
    \    if (X > Y) /* when the condition is true then the processor is to execute\
    \ the\n    statement below*/\n    Y++;\n\n/* this part is use to check the boolean\
    \ condition */\n  If ( ( X>Y ) && ( Y!=0 )) /* when this condition is true then\
    \ the processor executes the statement below*/\n    { \n          X+=Y;\n    \
    \  Y--;\n    }\n}\n```\n\n### The If…else statement\n\nThis structure provides\
    \ an alternative statement to be executed in case the condition is false, that\
    \ is to mean when `if` statement is false, then there is an optional way out since\
    \ there is a provision of an optional `else` statement to be executed.\n\n####\
    \ Syntax\n```cpp\nif (expression)\n{\n    statements; //these statements are executed\
    \ only when the condition is true\n}\nelse\n{\n    statements; // optional statements\
    \ to be executed in case the expression is false.\n}\n```\n\n#### Summary of the\
    \ execution sequence\n![Description: 00016.jpeg](images/00011.jpeg)\n\n#### Example\
    \ in a program\n```cpp\n/* definition of Global variables */\n\nint X = 6 ;\n\n\
    int Y= 8 ;\n\nVoid setup ()\n{ \n}\n\nVoid loop ()\n{\n/* this section is used\
    \ to check the boolean condition */\n    if (X > Y) /* when the condition is true\
    \ then the processor is to execute the\n    statement below*/\n{   \n        \
    \  X++;\n      }\n  else\n      {\n    Y-=X\n      }\n}\n```\n\n### If…else if…else\
    \ statement\n\nThis is a special control structure where an `if` statement is\
    \ followed by an optional `else..if…else` control structure. Such an expression\
    \ is quite important in navigating through conditions to test whether they are\
    \ true or false.\n\n**NOTE:** Always remember the following points while using\
    \ `If…else if…else` statement:\n- It is possible for an `if` statement to have\
    \ none or just one `else` statement, and the `if` statement must always come after\
    \ any `else if’s`.\n- It is lawful for an `if` statement to have none or many\
    \ `else if` statements that must always come before the `else` statement.\n- All\
    \ `else if` or `else` statements succeeded by an `else if` will never be executed\
    \ since the processor goes by a mode of priority.\n\n#### Syntax\n```cpp\nif (first\
    \ expression)\n  {\n    statements or block of statements;\n  }\nelse if(second\
    \ expression)\n  {\n    statements or block of statements;\n}\n. //other else\
    \ if statements\n.\n.\n.\nelse\n  {\nstatements or block of statements;\n  }\n\
    ```\n\n#### Example in a program\n```cpp\n/* definition of Global variables */\n\
    \nint X = 5 ;\n\nint Y= 9 ;\n\nint Z=15;\n\nVoid setup ()\n{ \n}\n\nVoid loop\
    \ ()\n{\n  /* checks if the boolean condition below is true or false */\n  if\
    \ (X > Y) /* when the condition is true the processor is instructed to execute\
    \ the statements below*/\n{\n        X++;\n    }\n  /* checks if the boolean condition\
    \ below is true or false */\nelse if ((X==Y )||( Y!=0 )) /* when this condition\
    \ is true the processor executes the statement below*/\n{\n      X+=Y;\n    }\n\
    else\n  Z++;\n}\n```\n\n### Switch case statement\n\nThis kind of structure works\
    \ in similar manner with `if` statements where the programmer is able to specify\
    \ values within the `switch` statement to execute according to the case.\n\n####\
    \ Syntax\n```cpp\nswitch (variable)\n{\n  case name:\n    // statements or block\
    \ of statements\n    break;\n  case name:\n    // statements or block of statements\n\
    \    break;\ndefault:\n    // statements or block of statements\n}\n```\n\n####\
    \ Example in a program\nWe will use a very simple example where we will assume\
    \ a variable with only three states, that is, high and mid representing 0, 1 and\
    \ 2. The program is supposed to switch the code according to the following:\n\
    ```cpp\nswitch (state)\n{\n  case 0: Low(); break;\n  case 1: Mid(); break;\n\
    \  case 2: High(); break;\ndefault: Display (\"Invalid state!\");\n}\n```\n\n\
    ### Conditional operator\n\nConditional operator remains to be the only ternary\
    \ operator in Arduino programming as well as C programming language.\n\n#### Syntax\n\
    `first expression? second expression: third expression`\n\n#### Explanation\n\
    The first expression is executed first then depending on the outcome of this execution,\
    \ the subsequent expressions are either processed or skipped. That is to mean,\
    \ when the outcome of expression is true, then the second one is executed and\
    \ the sequence continues. When the first expression gives a false result then\
    \ the execution skips two and processes third. Expression should give a result\
    \ of either true or false depending on the condition to be satisfied.\n\n####\
    \ Example in a program:\n```cpp\n/* Find min(x, y): */\nmin = ( x > y ) ? x :\
    \ y;\n\n/* this portion is supposed to Convert a small letter to a capital: */\n\
    /* (parentheses may not necessarily be required in this case) */\nz = ( z >= 'x'\
    \ && x <= 'c' ) ? ( z - 45 ) : z;\n```\n\n#### Some of the rules to take care\
    \ of while working with condition operator:\n- Always ensure that the first expression\
    \ is of a scalar type.\n- For the subsequent expressions, keep in mind the following:\n\
    \  - If they are two, then both must be of arithmetic type\n  - If they are two,\
    \ then both should be evaluated by simple arithmetic conversions which eventually\
