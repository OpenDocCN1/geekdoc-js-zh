    许多新程序员在听到人们称 JavaScript 是一种给小孩使用的语言时，往往会感到有些失望。好，让我为你消除这一点。首先，JavaScript 绝对是目前最强大的编程语言之一。它是
    Web 开发所需的一项热门技能。


    JavaScript 的之处在于其简单而又复杂的呈现方式。多年来，许多开发者一直在使用它。它可以为他们的网页增添新的活力，范围从非常细微但重要的功能（如自动图片轮播器），到增强美感的更复杂设计。


    以下是几项帮助 JavaScript 在众多语言中脱颖而出的特性。


    ## 集成浏览器支持


    从一开始，JavaScript 用户友好的特性就非常吸引人，它吸引了许多新程序员和专家。许多许多 Web 开发语言需要安装额外的 Flash 插件才能访问
    Flash 内容并在浏览器中运行。JavaScript 的用户大部分免于这种烦恼，因为几乎所有浏览器都无一例外地接受 JavaScript 作为其核心脚本语言。这使得它们能够对该语言提供集成支持。在最关键的情况下，用户只需要小心处理某些依赖于
    `DOM` 的特定任务，除此之外，JavaScript 是完全可以访问且免费使用的。


    ## 一种功能且灵活的编程语言


    对于那些在程序中喜欢大量函数的程序员来说，JavaScript 是一种享受。这是因为该语言中包含了多功能操作技术，允许程序员确定函数的执行。`Java` 将其置于函数式编程前沿的两个显著特性是：它赋予了程序员将函数分配给任何变量的自由，并可以使用参数让一个函数接受另一个函数。这种深度的定制能力让那些喜欢在编程中拥有更多自由的程序员感到更有趣。


    ## 在客户端和服务器端使用 JavaScript 的能力


    由于 JavaScript 已被 Web 浏览器正式认可为它们主要的开发语言，JavaScript 被赋予了访问任何浏览器文档模型对象的管理权限。此举的结果是为程序员提供了另一个层面的自由。它允许程序员动态地更改网页的结构。不仅如此，该语言还可以用于为网页添加各种有趣的特效。如果你正在使用
    `Alfresco`，那么你就太幸运了！因为 JavaScript 还允许在 `Alfresco` 中创建 Web 脚本。这允许程序员非常轻松地向任何 `Alfresco`
    服务器添加自定义任务。


    当你将所有这些结合在一起时，JavaScript 确实是一门奇的编程语言，强大而易用。


    ## 自动检测浏览器和操作系统的能力


    有时在编程时，你可能会面临一些问题，并需要编写取决于你正在使用的操作系统和 浏览器的代码。


    JavaScript 的设计非常智能，允许它能够感知你正在使用的浏览器和操作系统。这允许你根据需求轻松调整语言，以轻松地执行所有依赖于操作系统的操作。


    ## 对面向对象编程的多样支持


    面向对象编程可能是如今编程语言的基石。程序员通常根据对这些对象处理机制的可访问性来选择语言。相比之下，JavaScript 拥有一非常不同且独特的结构系统，决定了如何处理对象。它提供了大量的支持，同时保持了相对容易学习和使用。这鼓励用户平稳、高效地编写更复杂的面向对象代码，而几乎没有复杂性。


    这是 JavaScript 始终位列程序员和行业名单前列的众多原因之一。如果你对面向对象编程感兴趣，那么选择 JavaScript 绝不会出错。


    ## JavaScript 的优势


    通过 JavaScript，用户可以在页面发送到服务器之前组织输入，这自动减轻了服务器的负载。JavaScript 能够对页面访问者做出快速响应。每当你阅读文章时，标题会告诉你文章的内容，而内容以特定的方式结构化，通常以一句引起你兴趣的句子开头，随后是轶事、事实和数据、论点以及结论。当你开始在
    `HTML` 中编写代码时，你会发现它与你阅读或编写的文章结构是相似。


    - 访问者在查看是否有输入错误之前不需要重新加载。

    - JavaScript 用于构建响应式界面，当鼠标悬停在其上方时会产生反应。


    ## JavaScript 的局限性


    JavaScript 编程语言缺乏以下基本特性。它们是：


    - 出于考虑，客户端 JavaScript 不读取或写入文件

    - 用于网络应用的 JavaScript

    - JavaScript 不包含多处理器能力


    ## JavaScript 开发工具


    你不需要昂贵的开发工具来编写 JavaScript 代码。你可以使用简单的文本编辑器，如 `Microsoft FrontPage`、`Macromedia
    Dreamweaver MX`、`Macromedia HomeSite 5` 等。


    ## JavaScript 执行的两种类型


    第一类编程语言被称为“编译型”语言。该类别中的流行语言有：`C++`、`Java`、`C Fortran` 和 `COBOL`。


    编译型编程语言必须由编程人员进行编码（编写），然后这些代码必须通过一个名为编译器的特定程序进行运行。这个“编译器”程序会将代码“翻译”成计算机可以理解的机器语言，然后执行给定的指令。


    第二类编程语言被称为“解释型”语言。例如：`JavaScript`、`PHP`、`Ruby`、`Haskell` 和 `Perl`。对于解释型语言，代码仍然以人类的形式编写，但代码不需要通过编译器运行。相反，编译（翻译）过程发生在程序运行的时刻，在实际的浏览器中完成。


    它们的优点是过程更短。此外，程序员能够随时对程序进行更新和更改。相反，由于程序是在边编译边运行的，可能会减慢程序的整体性能。


    然而，运行速度更快的升级版处理器结合 `JIT`（即时）编译器，为性能提供了巨大的提升。


    ## 参数和理想测试环境


