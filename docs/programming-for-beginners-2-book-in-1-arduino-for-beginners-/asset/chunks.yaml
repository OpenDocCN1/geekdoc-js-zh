    ## 逻辑运算符


    逻辑运算符用于验证表达式的真值或假值。表达式求的结果取决于其中一个是否为真、都为真，或者是否需要执行逻辑取反。


    | 运算符 | 描述 | 示例 X=true, Y=false |

    | :--- | :--- | :--- |

    | `&&` | 逻辑与 | `X && Y // false` |

    | `||` | 逻辑或 | `X || Y // true` |

    | `!` | 逻辑非 | `!( X && Y) // true` |


