    一根导体将用于接收数据，另一根将用于发送信息，一个将用于同步，另一个将选择它与哪个设备进行通信。为了实现这一功能，这意味着它被配置为全双工连接。这意味着数据可以同时进行接收和发送。最大的波特率可以远大于封装
    `i2c` 的通信系统。


    ## 面板 SPI 引脚


    `SPI` 将使用四根线。


    1. `SS`：这将是片选线。

    2. `SCK`：这将由主站驱动的串行时钟。

    3. `MISO`：主站输入和从机输出。它由主站供电。

    4. `MOSI`：由主站驱动的主站输出和从机输入。


    你将使用的一些功能必须包含 `SPI`。


    `SPI set clock divider(divider)`：这将设置 `SPI` 时钟分频器，这意味着它是相对于系统时钟的对于 `AVR` 基础面板，分频器提供二、四、八、十六、三十二、六十四和一百二十八等选项。你的默认设置将
    `SPI CLOCK DIV 4`，这将把 `SPI` 时钟设置为系统时钟频率四分之一。


    1. `Divider`：这将是 (`SPI CLOCK DIV 2`, `SPI CLOCK DIV 4` 等)。

    2. `SPI transfer(Val)`：`SPI` 将根据同时发生的发送和接收进行分配。获得的数据将以标准的 `Val` 形式返回。

    3. `SPI begin transaction(SPI setting(speed maximum, data order, data mode))`：最高速度将根据数据顺序（`MSBFIRST`
    或 `LSBFIRST`）时钟。


    `SPI` 将遵循四种工作模式：


    1. `Mode 0`（默认）：时钟自然为低电平，从转换获得的数据可以在数据本身从频谱的底部向较高电平移动时被视觉化。这就是所谓的前沿。

    2. `Mode 1`：每当数据从高到低时，这被视为后沿。

    3. `Mode 2`：当你的数据从高到低时，这也是前沿。

    4. `Mode 3`：这里的数据也从频谱的低端到高端。在这种情况下，它在行业内被称为后沿。

    5. `SPI attach interrupt(handler)`：当从机设备从主站获取数据时，该函数将被调用。


    此时，你把两个 `Uno` 面板连接在一起，一个作为从机，另一个作为主站。


    - 十引脚将是 `SS`

    - 十一引脚将是 `MOSI`

    - 十二引脚将是 `MISO`

    - 十三引脚将是 `SCK`


    共地地，在下面的图中，你将看到两个面板之间发生的连接。


    ![Description: Connection of Boards](img/00014.jpeg)


    ## Arduino 高级策略


    ### 加速输入输出


    在每个 `AVR Arduino` 面板上，时钟速度为 16 MHz。控制器上的每条指令都将在四个周期内完成；因此，你可以在一秒内执行四百万条指令。但是，输入/输出的速度要慢得多。这是由于
    `digital write` 和 `digital read` 函数引起的。每执行一次函数时，都有额外的代码需要执行。这些额外代码负责检测并把数字引脚映射到输出端口。在每个微控制器上，输入输出设备将以一组八个引脚分配到一个端口，该端口已特殊注册到控制器。


    因此，下一个问题是，它有多慢？你将通过使用这段代码发现这一点。


    你可以通过将 `loop` 代码封装在无限循环中来改进程序。这将加快执行，因为 CPU 执行的函数调用更少。这应该加快你的输入和输出，使其速度快百分之十。如果你想获得最高输出速度，你必须使用低级访问端口，为了做到，你必须学习如何使用微控制器；然而，这将破坏
    Arduino 机器的美感。不过，有一个库可以使用来增加输入输出访问速度。


    请记住，存在限制，因为它主要支持 `Leonardo`、`Mega`、`Uno`、`Nana` 和 `Attiny` 型。这将提供内联函数以实现更快的输入输出访问。


    ### 模拟读取


    在 USB 供电的 Arduino 模型上进行模拟读取将给你带来一些意想不到的结果。这是因为模拟参考电压将与逻辑电压（通常为 5 伏）接通，然而如果你从开关电源或
    `USB` 为你的面板供电，你将面临由于 `USB` 线引起的干扰和电压下降。只要你的控制器运行在 4.5 伏而不是 5 伏，这是可能的。


    在涉及精密测量时，这并不是理想的。为了进行精密测量，你必须使用外部电压参考。另一方面，你可以使用内置芯片的电压参考来测量 VCC。


    ### 获取可用内存


    在本节中，你将学习如何以字节为单位获取内存。


    ### 使用 Const、程序和全局变量


    如果你需要在代码中存储大量数据，你需要使用全局 `const` 并包含程序语句。这将告诉编译器将数据存储在程序内存而不是 RAM 中。


    ### 忘记默认 IDE


    虽然 Arduino 自带的 IDE 很好用，但它并不适用于专业软件开发。如果你使用它，你会发现一旦代码超过几百行就会变得很痛苦。


    所以，为了解决这个问题，你将使用 `Atmel Studio` 或带有 `Visual Micro` 插件的 `Visual Studio`。该插件带有调试器，但重要的是要知道它不是免费的，需要
    17 美元。


    你也可以使用文本编辑器来编写你的程序。然而，通过 Arduino 1.5，IDE 支持通过命令行构建和上传你的程序。


    ```

    Arduino --panel (panel type description) --port (serial port) --upload (sketch
    path)

    Arduino --panel (panel type description) --port (serial port) --verify (sketch
    path)

    ```


    你还需要一个面板类型描述。


    ```

    package:arch:panel[:parameters]

    ```


    你可以通过 Arduino IDE 的手册文档了解更多关于命令行的信息。


    ### 内联小函数


    有一个手册说内联函数和宏一样快。但有一个问题。如果你使用了内联函数，它会增加你的代码体积；特别是当你在多处调用该函数时。


    ## 第 11 章：Arduino 函数库


    I/O 函数；高级 I/O 函数；等。


    ### Arduino 中的函数


    Arduino 板带有许多引脚。这些引脚可以配置为输入或输出。你最好注意到，大多数 Arduino 模拟引脚都可以以数字引脚的方式进行编程和使用。


    #### 输入 引脚


