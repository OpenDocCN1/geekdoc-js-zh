    It is necessary to keep in mind that to start working with JavaScript, you need
    a minimum of HTML knowledge, especially the notion of tags that allow you to place
    yourself on the page. To refresh the memory, we will simply remember that an HTML
    page is divided into two main parts: The `head` where the data corresponding to
    the description of the content are located; The `body` where the code that makes
    possible the construction of objects on the page (form fields, text areas, images,
    etc.) appears. A JavaScript script can be located, as desired, in one or the other
    of these two parts. However, in principle, scripts are generally found in the
    `head` part of the page. Its execution can be immediate (when the page is loaded)
    or deferred (click on a button, for example). In this case, it will be necessary
    to use event-based programming and functions for the code to execute. These points
    are discussed in the Functions and Events chapter of this book. However, placing
    the scripts in the `head` part does not mean that they will be indexed by the
    search engines. In fact, until now, search engines such as `Yahoo` or `Google`
    do not propose any content from these elements of the code, but with the development
    of Web 2.0 they will do so sooner or later. At the moment, in the case...


    ## Syntax


    The syntax of a programming language is defined as the set of rules that must
    be followed when writing the source code of the programs to be considered correct
    for that programming language. The basic rules that define JavaScript syntax are
    as follows:


    - Blank spaces and new lines are not taken into account: as is the case with `XHTML`,
    the JavaScript interpreter ignores any remaining blank space, so the code can
    be properly sorted to better understand it (tabulating the lines, adding spaces,
    creating new lines, etc.)

    - The case is case sensitive: as is the case with the syntax of the `XHTML` tags
    and elements. However, if an `XHTML` page is used interchangeably, the page is
    displayed correctly, the only problem being the non-validation of the page. On
    the other hand, if JavaScript is exchanging upper and lower case letters, the
    script does not work.

    - The type of the variables is not defined: when creating a variable, it is not
    necessary to indicate the type of data that will be stored. In this way, the same
    variable can store different types of data during script execution.

    - It is not necessary to end each sentence with the semicolon character (`;`):
    in most programming languages, it is mandatory to finish each sentence with the
    character`; Although JavaScript does not require you to do so, it is convenient
    to follow the tradition of ending each sentence with the semicolon character (`;`).

    - Comments can be included: comments are used to add information in the source
    code of the program. Although the content of the comments is not displayed on
    the screen, it is necessary to take precautions on the information included in
    the comments. JavaScript defines two types of comments: those of a single line
    and those that occupy several lines.


    ### Example of a single line comment


    ```javascript

    // below is an alert message (" test message");

    ```

    Single line comments are defined by adding two slashes (`//`) at the beginning
    of the line.


    ### Example of multi-line comment


    ```javascript

    /* Multi-line comments are very useful when you need to include enough information
    in comments * /

    alert (" test message");

    ```

    Multiline comments are defined by enclosing the text of the comment between the
    symbols `/*` and `*/`.


    ## Creating The Test Page


    To write effectively in the HTML pages, it is best to create a model page where
    you must include the labels that indicate the beginning and end of the script.


    Being the `head` part of the page where the JavaScript code is usually inserted,
    look at this example of the HTML code of the model page that will be used for
    writing all your scripts.


    The first two lines determine the type of document, its presence is essential
    for the proper functioning of `DHTML` instructions, as we will see in the chapter
    Improve interactivity with JavaScript and CSS. The fourth line indicates the beginning
    of the `head` tag that interests us in a particular way. The fifth line allows
    you to add a `meta` tag that indicates the characters used, the sixth gives a
    title to the page.


    ## The Code Syntax Rules


    In view of the fact that JavaScript is a non-flexible language that does not authorize
    errors, as we can see in the following lines, respecting these rules is essential
    to start on JavaScript.


    ### 1. Upper and lower case


    One of the main difficulties of JavaScript is to be a programming language that
    distinguishes the use of upper and lower case. It is a rule that becomes very
    important when working with variables and objects.


    Specifically, in JavaScript `Myobject` is not the same as `myobject`. This applies
    to all keywords (properties, methods, JavaScript functions) and the use of design
    tools such as `Aptana` or the `Dreamweaver` editor facilitates the identification
    of this syntax since they are almost instantly identified with colors. Another
    syntactic rule refers to the insertion of comments. Whenever you read an article,
    the title tells you what the article talks about, and the content is structured
    in a particular way, oftentimes with a sentence that piques your interest, followed
    by anecdotes, facts and figures, arguments, and a conclusion. When you start coding
    in HTML, you’ll see how similarly structured it is to articles you read or write.


    ### 2. Inserting comments


    As in most programming languages, inserting comments into your scripts can be
    extremely useful. In fact, apart from being able to more easily find the instruction
    blocks that you have created, the comments can be of immense help the day you
    have to retake the code. The readability of the code is even one of the main criteria
    determining the quality of a JavaScript code. Because, after all, how about...


    ## Creating A Personal Library Of Javascript


    Scripts over time, you will have to develop numerous scripts that can be reused
    later. To facilitate this reuse, identify your pages with names that clearly indicate
    the purpose of your JavaScript script.


    Beware of confusing personal library scripts and common libraries, abundant in
    the network, and that enrich the classic JavaScript operation. The installation
    of new JavaScript libraries will be discussed in the chapter Improving interactivity
    with JavaScript and CSS.


    ## JavaScript examples


    `<script>` tags are usually used to contain our JavaScript statements. The `script`
    tag can be placed anywhere on your webpage as required. It is important to remember
    to always maintain it inside the `<head>` so as to achieve the right outcome.
    An example that can be used to first illustrate this is one that can help print
    out “Hello World”. So as to ensure our code remains even when using a browser
    that isn’t able to use JavaScript, it is important to feed a JavaScript code inside
    of an HTML code. Observe the code below


    ```html

    <html>

    <body>

    <script language="JavaScript" type="text/javascript">

    <!--

    Document.write ("Hello World!")

    //-->

    </script>

    </body>

    </html>

    ```


    The result that will be achieved from the above code is: Hello World! Here `//`
    is symbolic of a phrase that is found in JavaScript that is added to block any
    browser from translating the last HTML phrase like a JavaScript code portion.


    ## Chapter 3: Basic Programming structure


    ### Variables


    The variable is the "named storage" of the data. We can use variables to store
    specialties, visitors, and other information.


    Use the keyword to create a variable in the JavaScript application.


    The sentence below creates (in other words: declares) a variable called `message`:


    ```javascript

    var message

    ```


    Now we can put information there using the task operator `=`:


    ```javascript

    message = "Hello World";

    ```


    The string is now stored in the memory associated with the variable. We can use
    it as a variable name:

