    ### Arduino YÚN (based on ATmega32U4)


    The `Arduino YÚN` is a great board to use when connecting to the Internet of Things.
    It is perfect for if you want to design a device connected to a network, like
    the Internet or a data network. It has built-in ethernet support, which would
    give you a wired connection to a network, and Wi-Fi capabilities, allowing you
    to connect cordlessly to the Internet. The `YÚN` has a processor that supports
    Linux code in the operating system, or code language, of `Linino OS`. This gives
    it extra power and capabilities but retains the ease of use of `Arduino`.


    - Price: $68.20

    - Flash Memory: 32kB

    - SRAM: 2.5kB

    - EEPROM: 1kB

    - Processing Speed: 16MHz

    - Digital Pins: 20 pins

    - PWM Pins: 7 pins

    - Analog In: 12 pins

    - Operating Power: 5V

    - UART: 1 line


    # Chapter 4: Arduino Family


    There are three types of memory in an Arduino system. Memory is the space where
    information is stored. Flash memory is where the code for the program that you
    have written is stored. It is also called the “program space,” because it is used
    for the program automatically when you upload it to the Arduino. This type of
    memory remains intact when the power is cut off, or when the Arduino is turned
    off.


    `SRAM` (static random-access memory) is the space used by the sketch or program
    you have created to create, store, and work with information from the input sources
    to create an output. This type of storage disappears once the power is turned
    off. `EEPROM` is like a tiny a hard-drive that allows the programmer to store
    information other than the program itself when the Arduino is turned off. There
    are separate instructions for the `EEPROM`, for reading, writing, and erasing,
    as well as other functions. Certain digital pins will be designated as `PWM` pins,
    meaning that they can create analog using digital means. Analog, as we remember,
    means that input (or output) is varied and not constant. Normally, digital pins
    can only create a constant flow of energy. However, `PWM` pins can vary the "pulse"
    of energy between 0 and 5 Volts.


    In addition, in comparing microcontroller boards, you will want to look at clock
    speed, which is the speed at which the microcontroller operates. The faster the
    speed, the more responsive it will be, but the more battery or energy it will
    consume. `UART` measures the number of serial lines the device can handle. Serial
    communication lines are lines that transfer data serially, that is, in a line
    rather than in parallel. It requires much less hardware to process things serially
    than in parallel. Some projects will have you connecting devices to the Internet
    of Things, which essentially describes the interconnectedness of devices, other
    than desktop and laptop computers, to various networks in order to share information.
    Everything from smart refrigerators, to smartphones, to smart TV’s are connected
    to the Internet of Things.


    # Chapter 5: Explanation of Arduino Components


    An Arduino can very easily be built using a solderless bread board and just a
    few minutes of your time (once you are familiar with the process). Once you have
    built the board, the microcontroller can be programmed with the Arduino programming
    language. Then, you will be ready to use the board in your next do-it-yourself
    project.


    ## What You Will Need


    You only need a few inexpensive pieces to turn your solderless breadboard into
    an Arduino, including:


    - 440 or 840 Tie Point Breadboard

    - TTL-232R-3V3 USB to Serial Converter Cable

    - Small Momentary Tact Switch

    - 16 MHz Clock Crystal

    - 1 Row Male Header Pins

    - 22 AWG Wire (selection of colors)

    - 1 Brown, Black, Red 10k Ohm Resistor

    - 2 Red, Red, Brown 220 Ohm Resistors

    - 2 22pF Capacitors

    - 2 10 uF Capacitors


    ### Step 1


    Once you have gathered all of the necessary parts, you are ready to start building
    your Arduino breadboard. The first step is to set up power. For this particular
    model, a constant +5Volts of power will be provided. You will also set up a 7805
    voltage regulator.

