- fmt: "\nPull-up resistors are used to steer up an input pin to a particular state\
    \ if no input is available. We can do this by adding a pull-up resistor (to `+5V`)\
    \ or a pull-down resistor on the input. You can use a `10K` resistor for a pull-up\
    \ or pull-down resistor. \n\nThe `Atmega` chip has 20,000 pull-up resistors and\
    \ all can be accessed from the software. To access these built-in pull-up resistors,\
    \ we set the `pinMode()` to `INPUT_PULLUP`. This will invert the behavior of the\
    \ input mode. A value of `HIGH` will mean that the sensor is ON while a value\
    \ of `LOW` will mean that the sensor is OFF. The value of the pull-up will depend\
    \ on the type of microcontroller that has been used. This value ranges between\
    \ `20kΩ` and `50kΩ` on most AVR-based boards. This value ranges between `50kΩ`\
    \ and `150kΩ` on `Arduino Due`. The exact value is shown ion the datasheet on\
    \ the microcontroller of the board.\n\nWhen you connect a sensor to a pin that\
    \ has been configured with `INPUT_PULLUP`, you should connect the other end to\
    \ the ground. If the pin is simple, this will cause the pin to read `HIGH` when\
    \ the switch is open and `LOW` when the pin is pressed. Pull-up resistors can\
    \ provide enough current to light an LED dimly that has been connected to a pin\
    \ that has been configured as an input. If you see working LEDs, but lighting\
    \ dimly, this could be the reason. \n\nThe following example demonstrates this:\n\
    \n```\npinMode(3,INPUT)  ;//set the pin to input mode without using a built-in\
    \ pull up resistor\npinMode(5,INPUT_PULLUP)  ;//set the pin to input using a built-in\
    \ pull up resistor\n```\n\n## Output Pins\n\nA pin that has been configured as\
    \ `OUTPUT` using the `pinMode()` function is said to be in the low-impedance state.\
    \ Such a pin is able to provide a significant amount of current to other circuits.\n\
    \nWhen you attempt to run high current devices from output pins, you can damage\
    \ the output transistors in the pin, or destroy the entire `Atmega` chip. In most\
    \ cases, this results in a dead pin on the microcontroller but the rest of the\
    \ chips will function normally.\n\n## The `pinMode()` Function\n\nWe use this\
    \ function to configure a particular pin as either an input or an output pin.\
    \ If you need to enable the internal pull-up resistors, you can use this function\
    \ with the `INPUT_PULLUP` mode. When you use the `INPUT` mode, it will disable\
    \ the internal pull-ups. \n\nThe `pinMode()` function takes the syntax given below:\n\
    \n```\nVoid setup ()  {\n  pinMode (pin, mode);\n}\n```\n\nThe function takes\
    \ two parameters as shown in the above syntax. The first parameter is a pin, which\
    \ is the number of the pin whose mode you need to set or modify. The mode is the\
    \ state you want to set the pin to, and it can be `INPUT`, `OUTPUT`, or `INPUT_PULLUP`.\n\
    \nConsider the example given below:\n\n```\nint btn =  5  ;// The button connected\
    \ to pin 5\nint LED =  6;// The LED connected to pin 6\n\nvoid setup ()  {\n \
    \ pinMode(btn , INPUT_PULLUP); // set the digital pin as input with a pull-up\
    \ resistor\n  pinMode(btn , OUTPUT);  // set the digital pin as output\n}\n\n\
    void loop ()  {\n  if  (digitalRead(btn )  == LOW){// if the button is pressed\n\
    \      digitalWrite(LED,HIGH); // turn the led on\n      delay(500); // delay\
    \ for 500 ms\n      digitalWrite(LED,LOW); // turn the led off\n      delay(500);\
    \ // a delay of 500 ms\n  }\n}\n```\n\nWe created two variables, `btn` and `LED`.\
    \ These denote the button connected to pin 5 and the LED connected to pin 6 respectively.\
    \ Inside the `setup()` function, the digital pin was set as input with a pull-up\
    \ resistor. The digital pin was also set as output.\n\nThe logic for the sketch\
    \ has then been implemented in the `loop()` function. When the button is pressed,\
    \ the LED will be turned on and delay in the stated for 500 milliseconds. The\
    \ LED will then turn off and delay in that state for 500 milliseconds.\n\n## The\
    \ `digitalWrite()` Function\n\nWe use this function when we need to write a value\
    \ of `HIGH` or `LOW` to a digital pin. If the pin had been configured to be `OUTPUT`\
    \ using the `pinMode()` function, it will be assigned a corresponding value of\
    \ voltage (which is `5V` or `3.3V` on 3.3V boards) for `HIGH`, `0V` (which is\
    \ ground) for `LOW`.\n\nIf the `pinMode()` function is not set to `OUTPUT`, then\
    \ a LED is connected to a pin, a call to `digitalWrite(HIGH)` may make the LED\
    \ appear dim. If you don’t set `pinMode()` explicitly, the `digitalWrite()` function\
    \ will enable the internal pull-up resistor, which will act like a large resistor\
    \ resisting the flow of current.\n\nThe `digitalWrite()` function takes the following\
    \ syntax:\n\n```\nVoid loop()  {\n  digitalWrite (pin ,value);\n}\n```\n\nThe\
    \ function takes two arguments, `pin` and `value` as shown in the above syntax.\
    \ The `pin` denotes the number of the pin whose mode you need to set. The `value`\
    \ argument can take a value of either `HIGH` or `LOW`. \n\nConsider the following\
    \ example that demonstrates how to use the `digitalWrite()` function:\n\n```\n\
    int LED =  6;// A LED connected to pin 6\nvoid setup ()  {\n  pinMode(LED, OUTPUT);\n\
    }\n\nvoid loop ()  {\n  digitalWrite(LED,HIGH); // turn the led on\n  delay(500);\
    \ // delay for 500 ms\n  digitalWrite(LED,LOW); // turn the led off\n  delay(500);\
    \ // a delay of 500 ms\n}\n```\n\nWe created a variable named `LED` to denote\
    \ the LED connected to pin 6. In the `setup()` function, this pin was set as output.\
    \ In the `loop()` function, we have used the `digitalWrite()` function to turn\
    \ the led on and off.\n\n## The `analogRead()` Function\n\nThe `analogRead()`\
    \ function reports the voltage applied to the analog pins. The lower part of the\
    \ Arduino has six pins that have been marked `Analog In`. These pins are able\
    \ to tell the voltage has been applied. The function will always return a value\
    \ ranging between `0` and `1023`, which is a representation of voltage between\
    \ `0` and `5V`. For example, if a voltage of `2.5V` has been applied to the pin\
    \ `0`, the `analogRead(0)` will read a value of `512`.\n\n```\nint analogPin =\
    \  3;// a potentiometer wiper\n connected to the analog pin 3\nint x =  0; //\
    \ variable to store the read value\n\nvoid setup()  {\n  Serial.begin(9600); //\
    \ setup serial\n} \n\nvoid loop()  {\n  x = analogRead(analogPin); // to read\
    \ the input pin\n  Serial.println(x); // print the value\n}\n```\n\nWe began by\
    \ creating a variable named `analogPin` and assigning it a value of `3`. This\
    \ variable denotes a potentiometer wiper that has been connected to the analog\
    \ pin 3. We have also created a second variable, `x`, and assigned it a value\
    \ of `0`. We will use this variable to store the value that has been read from\
    \ the pin. In the `loop()` function, we have called the `analogRead()` function\
    \ and passed the value `analogPin` to it as the parameter.\n\n## The `analogReference()`\
    \ Function\n\nThis function configures the reference voltage that is used for\
    \ analog input, that is, the value that has been used as the top of the input\
    \ range. The function can take any of the following options:\n\n- `DEFAULT` –\
    \ This is the default analog reference of 5 volts on the 5V Arduino boards or\
    \ 3.3 volts on the 3.3V Arduino boards.\n"
