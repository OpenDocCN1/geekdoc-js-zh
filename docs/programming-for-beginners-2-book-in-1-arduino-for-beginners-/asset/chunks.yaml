    \ equivalent to a thousandth of a millisecond or a millionth of a second in this\
    \ case.\n\nRecord time that has been tested and proved to be able to produce an\
    \ accurate delay is 16383 which is subject to change depending on future inventions\
    \ in Arduino boards’ production. However, for delays less than thousand microseconds,\
    \ it is advisable to use the delay ( ) function.\n\nMillis ( ) function\n\nThe\
