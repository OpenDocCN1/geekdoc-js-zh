- fmt: "\nMany new programmers often get a little bit disappointed when they hear\
    \ people call JavaScript a language for kids. Well, let me clear this up for you.\
    \ First, JavaScript is hands down, one of the strongest programming languages\
    \ out there. It’s a popular skill required for web development.\n\nThe beauty\
    \ of JavaScript lies in its simple yet complex presentation. It has been used\
    \ for many years now by numerous developers. It can add a fresh spin on their\
