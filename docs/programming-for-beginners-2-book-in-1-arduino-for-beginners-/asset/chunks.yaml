  trans: "\n\n你可以使用相同的命令来设置数字引脚。首先，引用数字引脚 `pinNumber` 而不是模拟引脚。重要的是，数字引脚默认用作输入引脚，因此你只需要将它们设置为\
    \ `OUTPUT`（输出）模式。要实现这一点，请使用命令：`digitalRead (pin label)`，其中数字组件将连接到 `pin label`。`digitalRead\
    \ (pin number)` 返回 `HIGH` 或 `LOW` 作为结果。\n\n当你想要从 IDE 向数字引脚发送数字信号时，你应该使用代码：`digitalWrite(pin\
    \ label, value)`，其中 `pin label` 代表信号来源引脚号，`value` 可以是 `HIGH` 或 `LOW`。\n\nArduino\
    \ 还使用脉冲宽度调制（PWM）技术来发送模拟形式的数字信号。负责这些功能的引脚编号为：`3`、`5`、`6`、`9`、`10` 和 `11`。此处使用的命令如下：`analogWrite(pin\
    \ label, value)`。引脚编号已经在上面给出，`value` 是从 `0` (0%) 到 `100%` (255) 的整数。\n\n### 数字信号示例\n\
    \n开/关、男桌/女桌、怀孕、死亡、意识，列表还将继续。\n\n在此处使用的传感器和接口可能包括：继电器、断路器、开关、按钮等许多。\n\n## 第 7 章：基础数字\
    \ Arduino 程序\n\n### LED 闪烁\n\n这是 Arduino 编程中最基础的程序，就像在任何其他编程语言中打印“hello world”一样。由于\
    \ Arduino 编程中没有屏幕来打印“hello world”，因此我们通过让 LED 闪烁作为我们的第一个测试程序。这确实是一个非常简单的程序，旨在为你通过原型制作投入电路构建的世界时，提供一个坚实的基础。\n\
    \n#### 所需组件\n* 一块面包板\n* 一个 Arduino Uno\n* 一个 LED\n* 电阻 (330 欧姆)\n* 两根跳线线\n\n####\
    \ 电路\n由于组件数量很少，电路非常简单，因此只需遵循下面的简单电路图即可：\n\n![Description: 00024.jpeg](img/00002.jpeg)\n\
    \n#### 寻找 LED 的极性\nLED 有极性，即负极和正极。要确定这一点，手持 LED 使平侧面向你。你左侧的短脚是负极，右侧的长脚是正极。\n\n\
    ![Description: 00025.jpeg](img/00003.jpeg)\n\n#### 图形 (Sketch)\n快速在你的电脑上打开 Arduino\
    \ IDE，然后在“New”标签页上新建一个图形文件，然后开始编写如下所示的代码：\n\n```\n*/ 闪烁 LED，以下代码用于周期性地连接到数字引脚的发光二极管闪烁。使用\
    \ 13 号引脚，是因为它的电路中有一个电阻来限制流过 LED 的电流 */\n\nint ledPin = 13; // LED 已连接到数字引脚 13\
    \ 号\n\nvoid setup()\n{\n  pinMode(ledPin, OUTPUT); // 将数字引脚设置为输出\n}\n\nvoid loop()\n\
    {\n  digitalWrite(ledPin, HIGH); // 代码用于开启 LED\n  delay(1000); // 延迟时间为一秒\n  digitalWrite(ledPin,\
    \ LOW); // 代码用于关闭 LED\n  delay(1000); // 延迟时间为一秒\n}\n```\n\n### 无延迟 LED 闪烁\n\n\
    有时你可能希望让 LED 亮起而不停止，这需要使用 `delay()` 的其他函数。无延迟 LED 闪烁函数会跟踪 LED 开启和关闭的时间。通过循环 `()`，它检查是否已经过了足够的时间间隔，以便在\
    \ LED 处于关闭时开启它，反之亦然。其他组件与上面的示例相同。\n\n以下是代码：\n\n```\nint ledPin = 13; // 一个 LED\
    \ 已连接到数字引脚 13 号\nint num = LOW; // 声明 int num 并赋值为 LOW，代表 LED // 上一个值 \nlong previousMillis\
    \ = 0; // 存储 LED 上次更新的时间\nlong delay = 1000; // 延迟时间设置为一秒（毫秒）\n\nvoid setup()\n\
    {\n  pinMode(ledPin, OUTPUT); // 将数字引脚设置为输出\n}\n\nvoid loop()\n{\n  // 这些代码用于控制\
    \ LED 的亮灭。\n  if (millis() - previousMillis > delay) \n  {\n    previousMillis\
    \ = millis(); // 回忆 LED 上次闪烁的时间\n    // 以下代码在 LED 关闭时开启它，反之亦然。\n    if (num ==\
    \ LOW)\n      num = HIGH;\n    else\n      num = LOW;\n    digitalWrite(ledPin,\
    \ num);\n  }\n}\n```\n\n### LED 渐变\n\n在这种情况下，我们将使用 `analogWrite()` 函数来启动连接到 Arduino\
    \ 板板的 LED 的渐变过程。这是可能的，因为 `analogWrite()` 函数使用了脉冲宽度调制技术，该技术能够以不同的比例快速开启关闭数字引脚，从而产生渐变效果。组件与第一个示例相同，包括电路。唯一的区别在于代码中，如下所示：\n\
    \n```\n/*\n渐变 \n此示例说明了如何使用函数 analogWrite () 来控制 LED 的渐变*/\nint ledPin = 6;   \
    \  // LED 连接到引脚 6 号\nint brightness = 0; // 亮度\nint fadeStep = 5; // 渐变步长\n\n\
    void setup()\n{\n  pinMode(ledPin, OUTPUT);\n}\n\nvoid loop()\n{\n  analogWrite(ledPin,\
    \ brightness);\n  brightness = brightness + fadeStep;\n  if (brightness <= 0 ||\
    \ brightness >= 255) {\n    fadeStep = -fadeStep;\n  }\n}\n```\n*(注：原文此处代码逻辑略有错乱，已根据语境修正翻译并保持结构)*\n\
    \n（注：原文文本在此处已清理变量描述以保持逻辑流）。\n\n### Arduino 按钮\n这通常是一个输入按钮。当按下时，按钮完成电路。\n\n####\
    \ 组件\n* 按钮\n* 一个 Arduino Uno\n* 一个发光二极管\n* 三根连接线\n* 2.2 千欧姆\n\n#### 步骤\n你的电路应该像下面：\n\
    \n![Description: 00026.jpeg](img/00004.jpeg)\n\n此项目的代码编写如下：\n\n```\nint outPin\
    \ = 14; // LED 连接到引脚 14 号\nint inPin = 3; // 按钮输入引脚\nint num = 0; // 用于读取引脚状态\n\
    \nvoid setup()\n{\n  pinMode(outPin, OUTPUT); // LED 将作为输出\n  pinMode(inPin, INPUT);\
    \ // 按钮应作为输入\n}\n\nvoid loop()\n{\n  num = digitalRead(inPin); // 代码用于读取输入值\n\
    \  if (num == HIGH) { // 检测按钮是否释放 (HIGH)\n    digitalWrite(outPin, LOW); // 关闭\
    \ LED\n  } \n  else\n  {\n    digitalWrite(outPin, HIGH); // 开启 LED\n  }\n}\n\
    ```\n\n### 带消抖的 Arduino 按钮\n这个示例与上面的练习相似，不同在于按钮的功能。按钮消抖输入意味着在没有按下按钮的情况下代表多次按下。\n\
    \n组件和电路板与上面的示例相同。因此我们直接看代码，以突出差异。\n\n#### 代码\n```\nint inPin = 6;   // 输入已分配给引脚\
    \ 6\nint outPin = 11; // 输出已分配给引脚 11\nint position = HIGH; // 显示输出引脚 11 的当前状态\n\
    int display; // 表示输入引脚 6 的当前读取值\nint previous = LOW; // 输入引脚之前的读取值为 LOW\nlong\
    \ time = 0; // 代表输出切换的时间变量\nlong debounce = 100; // 分配的消抖时间\n\nvoid setup()\n\
    {\n  pinMode(inPin, INPUT);\n  pinMode(outPin, OUTPUT);\n}\n\nvoid loop()\n{\n\
    \  display = digitalRead(inPin);\n  if (display == HIGH && previous == LOW &&\
    \ millis() - time > debounce) {\n    // ... 函数返回反转的输出\n    if (position == HIGH)\n\
    \      position = LOW;\n    else\n      position = HIGH;\n    digitalWrite(outPin,\
    \ position);\n    time = millis();\n  }\n  previous = display;\n}\n```\n\n"
- fmt: "\n```cpp\nposition = LOW;\n\nelse\n\n    position = HIGH;\n\n// ... function\
    \ recalls the time when button was pressed\n\ntime = millis();\n\n}\n\ndigitalWrite(outPin,\
    \ position);\n\nprevious = display;\n\n}\n```\n\n# Creating a Loop\n\n### Components\
    \ required\n* Six Light Emitting Diodes\n* Six 220 Ohm resistors\n* Seven jumper\
    \ wires\n* One Arduino Uno\n\nIn this example we shall six LEDs to demonstrate\
    \ sequential blinking using the function `digitalWrite(pin label, LOW/HIGH)` together\
    \ with `delay( )`.\n\n### Circuit\n![Description: 00027.jpeg](images/00005.jpeg)\n\
    \n### Code\n[content]\n[/content]\n```cpp\nint timer = 120; // timing reduces\
    \ with an increase in the time number.\n\nint pins[] = { 2,3, 4, 5, 6, 7, 8 };\
    \ // pin numbers as an array of\nint value_pins = 6; // array length represented\
    \ by the number of pins\n\nvoid setup()\n{\n  int j;\n  for (j = 0; j < value_pins;\
    \ j++) // the array elements as numbered from 0 //to value_pins – 1\n    pinMode(pins[j],\
    \ OUTPUT); // each pin has been set as an output\n}\n\nvoid loop()\n{\n  int j;\n\
    \  for (j = 0; j < num_pins; j++) \n  { \n    // a loop is set through each output\
    \ pin...\n    digitalWrite(pins[j], HIGH); // function to turn the output pin\
    \ ON,\n    delay(timer);                 // delay function,\n    digitalWrite(pins[j],\
    \ LOW); // function to turn the output pin OFF \n  }\n  for (j = value_pins -\
    \ 1; j >= 0; j--) \n  {\n    digitalWrite(pins[j], HIGH);\n    delay(timer);\n\
    \    digitalWrite(pins[j], LOW);\n  }\n}\n```\n\n# Chapter 8: Basic analog Arduino\
    \ programs\n\n## Analog Input\nIn this project we shall use a potentiometer as\
    \ the source of analog input signal to the Arduino board. Ideally, the potentiometer\
    \ is able to vary resistance (variable resistance) which can then be read by the\
    \ Arduino board as analog input. We are going to use the already fixed LED pin\
    \ 11 on the Arduino board as part of our project.\n\n### Components required\n\
    * A potentiometer\n* An Arduino project for LED lighting\n* Three jumper wires\n\
    \n![Description: 00028.jpeg](images/00006.jpeg)\n\n### Sketch\n```cpp\n/* potentiometer\
    \ project under AnalogInput\nThis project aims to turn ON and OFF a light Emitting\
    \ Diode periodically. The amount of light of the LED depends on the value of resistance\
    \ of the potentiometer used. Increasing resistance reduces the amount of light\
    \ and vice versa.\n*/\n\nint num = 0; //this variable stores the input value from\
    \ the sensor output, //initially assigned 0\n\nvoid setup() \n{\n  pinMode(ledPin,\
    \ OUTPUT); // function declares the LED as an OUTPUT\n}\n\nvoid loop() \n{\n \
    \ num = analogRead(inPin);   // function to read the value of sensor //output\n\
    \  digitalWrite(ledPin, HIGH);  // function to turn the LED ON\n  delay(num);\
    \               // delay function to stop the program for a while\n  digitalWrite(ledPin,\
    \ LOW);   // function to turn OFF the LED\n  delay(num);               // function\
    \ stops the program for a while\n}\n```\n\n## Knock Sensor\nFor this kind of a\
    \ project, we shall employ the use of a piezo element and trap its sound as the\
    \ analog input into the Arduino board. The processor of the board is able to read\
    \ analog signals with the aid of its ADC (analog to digital Converter). The Piezo\
    \ element (knock sensor) is just but an electronic device that is capable of playing\
    \ tones and detect tones at the same. The Arduino board detects the sound levels\
    \ as voltage levels, transform the voltage level to a corresponding value ranging\
    \ from 0 to 1024 for voltages of 0 to 5.0 volts.\n\nRemember that the Piezo element\
    \ has polarity, black wire representing the negative terminal while the red wire\
    \ represents the positive terminal.\n\nIn the sketch, we will try to capture the\
    \ sound level (knock ) of the Piezo element and confirm that it is above a certain\
    \ threshold then send a “Knock” string a signal to the Arduino IDE platform.\n\
    \n### Circuit\n![Description: 00029.jpeg](images/00007.jpeg)\n\n### Sketch\n```cpp\n\
    /* Knock Sensor\nIn this project we are using the Piezo element as a knock sensor.\
    \ We therefore have to listen to the sound level, if the signal goes beyond a\
    \ specified threshold.\n*/\n\nvoid setup() \n{\n  pinMode(ledPin, OUTPUT); //\
    \ function declares the ledPin as the OUTPUT\n  Serial.begin(9600); // indicate\
    \ the use of serial port\n}\n\nvoid loop() \n{\n  num = analogRead(knockSensor);\
    \ // function is used to read the value of the //sensor and store it in the variable\
    \ num\n  if (num >= THRESHOLD)\n  {\n    statePin = !statePin; // logic to toggle\
    \ state\n    digitalWrite(ledPin, statePin);\n    Serial.println(\"Knock!\");\
    \ // sends the string to serial\n    delay(100); // a very short delay\n  }\n\
    }\n```\n\n## Arduino Smoothing\nInvolves the use of arrays where the sketch is\
    \ supposed to read analog input, calculate running average and finally print the\
    \ result.\n\n### Components Required\n* One breadboard\n* One Arduino Uno\n* One\
    \ Potentiometer\n* Two jumper wires\n\n### Circuit\nThe circuit diagram and the\
    \ components are shown below:\n![Description: 00030.jpeg](images/00008.jpeg)\n\
    \n### Sketch\n```cpp\n// The constants used below to remain the same:\nconst int\
    \ analogPin = A0;\nconst int ledCount = 8; // representing the number of pins\n\
    int ledPins[] = {3, 4, 5, 6, 7, 8, 9, 10}; // pin numbers\n\nvoid setup()\n{\n\
    \  // a loop over the array thereby setting them as the OUPUT\n  for (int firstLed\
