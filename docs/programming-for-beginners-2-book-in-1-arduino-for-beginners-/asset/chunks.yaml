    这允许你从 Android 设备和苹果移动设备访问 IDE 软件，因为它基于运行在独立平台上的网页浏览器，而不是运行在 Android 或 iOS 平台上。你还可以在各种类型的计算机上运行网页浏览器，包括
    Linux、Microsoft Windows 和 Apple Macintosh。这将允许你将草图（sketches）上传到云端，即将你编写的代码信息存储在一个安全的位置，然后你就可以通过连接互联网从另一个设备重新访问它。


    # 为你的 Arduino 编写程序

    接下来，你将为想要让 Arduino 板运行的程序编写代码。这允许你一次性看到整个代码，从而更容易调试或删除错误。


    一旦写好代码，你将想要运行它并对发现的任何错误进行故障排除或调试。最好的方法是将编写好的程序应用到 Arduino 板上并查看其运行情况。要做到这一点，你将进入上传草图的下一步。


    ## 连接到 Arduino 板

    某些开发板内置了 USB、mini-USB 或 micro-USB 端口。对于在 Arduino 职业的初级阶段，`Uno` 和 `Leonardo` 就是例子。只需将
    USB 线的相应一端插入计算机，另一端插入你所拥有的板上的特定 USB 端口，Arduino IDE 软件应该就能识别出它的板子类型。如果没有，你可以随时从下拉菜单中选择正确的板子。


    有时你需要使用 `TKDI` 线或扩展板来使 Arduino 与计算机兼容。这意味着你把 `TKDI` 插入 Arduino 微控制器板上的 `TKDI`
    端口，然后将其连接到计算机或其他板上。如果你将 `TKDI` 线连接到扩展板，操作方法与连接兼容 USB 的板子相同：将线的相应一端插入扩展板，另一端插入计算机。再次，计算机上的
    Arduino IDE 软件程序应该识别你的 Arduino 板，但如果未能识别，你始终可以从下拉菜单中选择。


    ## 上传到 Arduino 板

    要上传你的草图（你刚刚在代码中创建的程序），你需要选择要上传的正确板和端口。选择正确的板子应该是很容易，你只需寻找与你使用的板子类型名称匹配的板子标题即可。


    选择正确的串口，你可以选择的选择如下：


    ### Mac

    - `Uno`、`Mega256O` 或 `Leonardo` 使用 `/dev/tty.usbmodem241`。

    - `Duemilanove` 或更早的 Arduino 板使用 `/dev/tty.usbserial-1B1`。

    - 其他任何通过 USB 转串口适配器连接的设备使用 `/dev/tty.USA19QW1b1P1.1`。


    ### Windows

    - 串口板使用 `COM1` 或 `COM2`。

    - USB 连接的板子使用 `COM4`、`COM5` 或 `COM7` 或更高版本。

    - 查看 Windows 设备管理器以确定你正在使用的设备在使用哪个端口。


    ### Linux

    - 串口使用 `/dev/ttyACMx`。

    - USB 端口使用 `/dev/ttyUSBx` 或类似的名称。


    一旦你选择了正确的板子和端口，点击 `Upload`（上传）并在弹出的菜单中选择要上传的 `Sketch`。如果你使用的是较新的 Arduino 板，你可以简单地上传新草图，但对于旧版板子，你必须在上传新草图之前重置板子，否则板内存中将存在两个可能冲突的草图，导致其崩溃。


    ## 使用你的程序运行 Arduino

    一旦你将编写好的程序上传到 Arduino，有几种方法可以为 Arduino 供电。首先，你可以通过 USB 连接到另一个有电源设备（如你的计算机）为其供电。其次，对于具有该功能的板，可以通过以太网供电。这意味着通过连接网络，你将通过以太网连接到电源。最后，大多数
    Arduino 可以通过锂聚合物电池供电。一旦连接了电源并将指定的输入到微控制器，它就会执行其预期的功能。


    # 安装 Arduino IDE

    现在你已经了解了 Arduino 板的不同部分，我们可以学习如何准备 Arduino IDE。学习这些之后，我们就可以准备好将第一个程序上传到板子了。你将学习如何设置板子并使其准备好通过
    USB 线接收程序。


    确保你有一个 Arduino 板和一根 USB 线。组装这些设备后，下一步是下载 Arduino IDE。你可以从以下 URL 下载：

    `https://www.arduino.cc/en/Main/Software`


    根据你正在使用的操作系统下载正确版本的 Arduino。下载完成后，解压下载的文件。


    你现在可以为板子供电了。板子可以从 USB 连接到计算机获取电源，也可以从外部电源获取电源。只需通过 USB 线将你的 Arduino 板连接到计算机。你应该看到绿色电源
    LED 灯亮起。


    现在是时候启动 Arduino IDE 了。打开你解压 Arduino IDE 的文件夹。双击 `.exe` 文件启动 IDE。


    软件将打开，你可以创建一个新项目或打开一个现有项目。要创建一个新项目，点击 `File`（文件）然后选择 `New`（新建）。要打开现有项目，点击 `File`，选择
    `Example`（示例），`Basics`，然后选择 `Blink`。


    你需要选择你正在使用的板子类型。为了避免从 IDE 向板子加载程序时出现错误，确保选择正确的板子，即通过 USB 线连接的板子。


    要选择板子，点击 `Tools`（工具）然后选择 `Board`（板子）。


    接下来，你应该选择 Arduino 板的串口。点击 `Tools` 然后选择 `Port`。如果你很难确定串口，只需断开 Arduino 板与计算机的连接，寻找消失的项目。。你可以重新连接板子并选择该端口。


    每当你需要向 Arduino 板加载程序时，点击 IDE 上的 `Upload` 按钮。注意 Arduino 程序被称为 sketch。


    ## 数字输入输出

    数字信号是离散值，其表现为 `1` 或 `0`。这意味着 `1`（高电平）表示信号存在，而 `0`（低电平）表示信号不存在。因此，数字信号通过电流的存在或不存在（`5v`
    或地）或脉冲的存在或不存在以二进制代码传输。


    人类习惯于模拟信号，而机器人、计算机以及大多数电路感知数字信号。如前所述，数字信号只有两种状态，即“开启”和“关闭”，就像墙上的双控开关一样。


    在 Arduino 编程中，除了专门用于处理模拟信号的模拟输入外，数字信号到处都是。数字信号的 `ON` 或 `HIGH` 状态始终等于板电压（`3.3 伏`或
    `5.0 伏`）。相反，`LOW` 或 `OFF` 状态始终由 `0 伏` 表示。


    为了在 Arduino 板上接收或发送数字信号，请仅使用标记为 `0-13` 的引脚。再次如之前解释的，可以设置模拟引脚作为数字引脚使用。这通过使用命令 `pinMode(pin
    label, value)` 实现。这里的引脚数字代表 `A0-A5` 的模拟引脚，函数中的值始终为 `input` 或 `output`。

