    So far, we can access either information or functions of an object using the dot
    notation. The variables we access using the dot notation are called properties,
    while the functions we access using the dot notation are called methods. 


    The concept of methods and properties arose from the need to turn real life concepts
    into code. Going back to our phone example, for instance, without objects there’s
    no simple way to tell which screen size belongs to a specific phone, unless one
    keeps the phone names and screen sizes in two different arrays. This quickly becomes
    more complicated when more attributes are added. 


