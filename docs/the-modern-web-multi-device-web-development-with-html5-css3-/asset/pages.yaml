  md: 'You can add lines between each column, known as rules, with the column-rule
    property. The effect is essentially the same as the border property from CSS2.1,
    and it requires the three values—one for width, one for style, and one for color—but
    it applies to a single vertical line, not on four sides. So to add a dotted, gray,
    2px-wide rule between each column, you could use this:


    ```

    E { column-rule: 2px dotted gray; }

