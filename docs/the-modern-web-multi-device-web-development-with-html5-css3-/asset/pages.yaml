  md: '# BROWSER SUPPORT AS OF MARCH 2013


    ![](img/c5e4d8671dcefe9f3888e6a849798773_227_0.png)


    Documenting feature implementation in browsers means aiming at a moving target,
    so the best I can do is take a snapshot. When considering whether to use one of
    the features in this book, always check the following sites for the most up-to-date
    information:


    +   - HTML5 Please, http://html5please.com/

    - The CSS3 Test, http://css3test.com/

    - The HTML5 Test, http://html5test.com/

    - Can I Use..., http://caniuse.com/


    When I started this book midway through 2012, I thought a gamble on which features
    that had already been well implemented but also that I thought a good chance of
    being implemented when the book went to print (or soon after). As I write this
    in early 2013, it seems that the pace of wider adoption'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'has slower than I anticipated some of the features contained in Internet Explorer
    10 (such as Grid Layout, Regions, and Exclusions), but everything else is proceeding
    apice.


    # The Browsers in Question


    Far too many browsers exist for me to provide a decent overview of feature support
    on. Instead, in this appendix, I''ll stick to the key modern desktop browsers—Chrome,
    Firefox, Internet Explorer 10, and Safari—and their mobile equivalents, as I''ve
    done throughout this book.


    As this book was going to press, Opera announced that it would be phasing out
    its Presto rendering engine and that future versions of the browser would instead
    use Chromium, the branch of WebKit that is also based on. But that doesn''t mean
    Presto will be going away in the short term—it''s already embedded on many devices
    that don''t tend to update, as TVs and game consoles. In the long term, feature
    support should be considered the same as Chrome, and I''ve kept it distinct for
    legacy support.


    When discussing browsers, I usually mean smartphone and tablet, and more often
    than not, that means Safari mobile and the Android browser (both are based on
    WebKit, there''s quite a deal of variety between them). Firefox, Internet Explorer,
    and Opera use the same rendering engine across different platforms (although the
    previous paragraph about Opera), so I''ll only mention the mobile version of those
    browsers where any differences exist (which is not often).


    When I refer to Android, I mean the stock that comes with most versions of the
    Android OS up to 4.2 (the most recent as I write this). Newer releases will likely
    include the newer mobile version of Chrome, which like Firefox and Opera, can
    be considered more or less equivalent to desktop sipping.


    As I mentioned before, there is really no substitute for testing actual devices.
    If possible, you should create a device testing or join one in your area; if that''s
    completely out of the question, ask other developers for their experiences.


    # Enabling Experimental Features


    Many browsers, especially Chrome and Firefox, are much more cautious than those
    you would be with regard to implementing experimental features. Where previously
    they would implement features with a vendor prefix and roll them to all users,
    now they require that you explicitly enable features with a configuration flag.


    In Firefox, you can do this by entering about:config in the URL bar, at which
    point you''ll see a message that warns you of the consequences of dabbling in
    the browser''s inner workings. If this doesn''t deter you, you can find the feature
    you want and enable it before restarting your browser in order to gain access
    to the now-enabled feature.'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'In Chrome, the process is much the same except that you enter chrome://flags,
    no warning message appears, and the features are usually enabled by toggling a
    linked Enable.


    # Chapter 1: The Web Platform


    Every major modern desktop browser comes with a set of developer tools that includes
    a console (only Internet Explorer 7 and below don''t have one). The situation
    on mobile devices and tablets is a bit more complicated: Most browsers don''t
    develop tools by default, but they can be connected to their desktop equivalents
    for debugging, as explained in “Test and Test and Some More” on page 19.


    # Chapter 2: Structure and Semantics


    The newer HTML5 structuring elements appear in Internet Explorer 9 and above in
    all other modern browsers. Some browsers around some of these elements is still
    ongoing as I write this. Some are beginning to support a main element despite
    opposition from spec editor Ian Hickson, whereas elements such hgroup are being
    dropped.


    Using the attribute-based accessibility and semantic extensions WAI-ARIA, microformats,
    RDFa, and microdata in any browser is completely safe. The microdata API is implemented
    in Firefox and Opera.


    Data attributes are also supported in all browsers, although the API using dataset
    is not present in Internet Explorer or Android 2.3 and below. The jQuery method
    works across browser.


    # Chapter 3: Device-Responsive CSS


    As I write this, media queries are available in Internet Explorer 9 and above
    and in all other modern browsers. The media features related to device dimensions
    are the most widely implemented. The resolution media feature is in Internet Explorer
    10, Firefox, and Opera was implemented in the WebKit core at the end of 2012,
    so it''s making its way into WebKit-based browsers.


    The px unit should be in all modern browsers Internet Explorer by the time you
    read this, and devicePixelRatio is in WebKit browsers, Opera, and Firefox (including
    mobile versions).


    The @viewport rule-is in Opera, Internet Explorer, and WebKit, using the vendor
    prefix of each. The matchMedia API is in Internet Explorer 10 and all other modern
    browsers but not in Android 2.3 and below.


    The CSS property box-sizing is in all browsers, although it requires a vendor
    prefix in Firefox and versions 3.0 and below Android. Only Firefox reports the
    padding-box value. The cal() value function is in IE9 and above, Firefox, desktop
    WebKit browsers, and from version 6.0 of mobile Safari. It is not in Android or
    Opera and requires the -webkit- prefix in other mobile WebKit browsers.'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'The viewport-relative length units—vh, vw, et.—are in IE9 (with a few bugs)
    and IE10, Firefox, and most WebKit browsers except Android, but not present in
    Opera. The rem unit is in IE9 and all other major browsers.


    The object-fit and object-position properties are implemented in Opera only marked
    as "at risk" in the spec, so face an uncertain future, especially now that Opera
    is moving to WebKit.


    # Chapter 4: New Approaches to CSS Layouts


    The multi-column layout properties are implemented in IE10 and all other modern
    browsers. The use of vendor prefixes is required in WebKit-based browsers and
    Firefox, and Firefox also lacks support for the column-span property. Only Opera
    and IE10 support the break-before and break-after properties.


    Flexbox is supported in all major browsers and requires a vendor prefix in WebKit-based
    users agents. IOS6 and below use a hybrid of the current syntax and an old one:
    The justify-content property isn''t implemented, and it has the old box-pack property.
    I hope this will no longer be the case when you read this appendix.


    IE10 also uses an outdated syntax, fully vendor prefixed. I recommend you read
    the documentation in the "Internet Explorer Guide for Developers" for detailed
    information: https://mdn.microsoft.com/library/ie/6673351%28en=us%2C%29.asx.


    Firefox only supports single-line Flexbox, so the flex-wrap property and flex-flow
    properties are ignored.


    As explained in Chapter 4, IE10 is the only browser to support Grid Layout, using
    an older version of the syntax with the -ms- prefix. Work is underway on implementing
    this in WebKit, which should use the compliant syntax. The grid-template property
    is not currently implemented in any browser.


    # Chapter 5: Modern JavaScript


    The async attribute is in IE10 and most other browsers than Android versions 2.3
    and below and Opera. The defer attribute is also the same but has support back
    to IE8.


    The addEventListener() method is in IE9 and all other major browsers, as the DOMContentLoaded
    event is used.


    Despite the uncertainty around existing paints, touch events are in Chrome, Firefox,
    Safari for iOS, and IE10 has support for pointer events, such as pointerdown,
    which are vendor prefixed.


    The querySelector() and querySelectorAll() methods are fully implemented in all
    modern browsers, from IE8 and higher. The getElementsByClassName() method is almost
    as well implemented, lacking support only in IE8. The class object is in IE10
    and above, and most other browsers except for Android version 2.3 and below.'
  merge: -1
