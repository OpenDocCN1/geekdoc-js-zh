    # # Battery Status


    One of the concerns with portable devices is knowing their battery status. Mobile
    devices can get as little as seven or eight hours out of a full charge, whereas
    a laptop is lucky to get more than three or four hours. Knowing the status of
    the device''s battery can be important before you begin power-hungry processes
    or commence to download large files. You can get information about the battery
    with the Battery Status API, which brings a set of attributes onto the navigator.
    For example, to find out if the battery is currently charging, you can use the
    charging attribute to get true or false value:


    ```

    var batteryStatus = navigator.battery.charging;

    ```


    To find the current battery level, you can use the level attribute, which returns
    a value from 0 (empty) to 1 (fully charged). The following code is a simple demonstration
    of this action:

    The battery level is obtained and its value used as the value of a element (which
    will be fully introduced in Chapter 8), and the current charging status (''Charging''
    or ''Discharging'') is assigned below you. You can try it in the example file
    battery.html. The result is shown in:


    ![](img/c5e4d8671dcefe9f3888e6a849798773_130_1.png)


    ```

    var el = document.getElementById(''status'',

    meter = document.querySelector(''meter''),

    battery = navigator.battery;

    status = (battery.charging) ? ''Charging'' : ''Discharging'';

    meter.value = battery.level;

    meter.textContent = battery.level;

    el.textContent = status;

    ```


    The battery object has two further attributes: chargingTime and dischargingTime.
    Both of these return a value, in seconds, of the remaining until the battery is
    fully charged or fully discharged, respectively.'
