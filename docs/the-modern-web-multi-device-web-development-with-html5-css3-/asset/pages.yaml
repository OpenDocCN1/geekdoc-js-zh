    In his book True About HTML5 (CreateSpace, 2012), Luke Stevens says this about
    the value of article:


    Specifications fail when they leave things up to you to work out.

    The whole point of a specification is to specify exactly what you should do. But
    here it''s open to interpretation, has no clear benefit, and repeats existing
    functionality. . . .


    I can''t disagree. My prediction is that these elements will be badly missed by
    many people unless clearer definitions can be found.


    For technical reasons, I suggest not using the elements on the open Web: For one,
    they''re not supported in older versions of Internet Explorer (8 and below). To
    make those browsers recognize the new elements, you have to create them in JavaScript.
    You can do this easily; just implement the popular HTML5Shiv using conditional
    comments:


