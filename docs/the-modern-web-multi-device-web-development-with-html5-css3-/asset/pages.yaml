  md: '# Touch Events


    The Touch Events Level 1 specification has four events:


    +   * touchstart fires when a finger (the word I''ll use from now on to avoid
    repeating the word "sausage") touches the screen.

    * touchend fires when the finger is removed from the screen.

    * touchmove fires when a finger moves between two points on the screen.

    * touchcancel fires when the user agent interrupts a touch or when the finger
    leaves the active area.


    Touch Events Level 2, still in development as I write this, introduces two additional
    events:


    +   * touchener fires when a finger already on the screen moves over the target
    element.

    * touchleave fires when the finger moves out of the target area leaving the screen.


    To closely parse a mouse, you probably want to use the touchend event, which fires
    when the finger is lifted from the screen, denoting that the user has completed
    his or her action:


    ```

    el.addEventListener(''touchend'', function () {..}, false);

    ```


    Every time a touch event fires, it creates a TouchEvent object, which contains
    more information about the event. This information includes TouchList, an object
    containing the touches child object, which holds information about how many fingers
    are touching the screen, obviously useful for multitouch. Bear in mind that each
    touch creates a touch, and when using multitouch, each touch event includes all
    the preceding touches. The TouchList created when the first finger touches the
    screen holds information about touches 0; the TouchList created by the second
    finger holds information about 0 and 1; the TouchList of the third finger about
    touches 0, 1, and 2, and so on.


    # Pointer Events


    As mentioned, Pointer Events presents a unified approach to creating events regardless
    of the actual input mechanism—whether finger, mouse, stylus, or other. This approach
    is similar to DOM Mouse Events in the way that it records an action''s stages
    but uses the agnostic pointer* events: pointerdown, pointerup, pointercancel,
    pointermove, pointerover, and pointerout. For example, to fire an event when the
    pointer is released, use pointer:


    ```

    el.addEventListener(''pointerup'', function () {..}, false);

    ```'
