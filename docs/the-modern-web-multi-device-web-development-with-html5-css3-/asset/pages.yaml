  md: 'Most browsers style the placeholder text lighter than the default color to
    show that it''s holding text rather than a value, but depending on your website''s
    color scheme that may not be ideal. Unfortunately, no standardized selector is
    available to change placeholder text properties, although some browsers have implemented
    their own pseudo-class (or pseudo-element):


    ```

    input:-moz-placeholder {

