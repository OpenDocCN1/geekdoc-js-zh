  md: "The Battery Status API also has a series of events that fire when a change\
    \ to any of the attributes is detected: chargingchange, chargingtimechange,dischargingtimechange,\
    \ and levelchangechange. The following code uses chargingchange to detect the\
    \ device's charging status and fires an alert if the status has changed:\n\n```\n\
    var status,\nbattery = navigator.battery,\nchargeStatus = function () {\n  (battery.charging)\
    \ ? status = 'Charging' : status = 'Discharging';\n  return status;\n}\nbattery.addEventListener('chargingchange',\
    \ function () {\n  window.alert(chargeStatus());\n}, false);\nwindow.alert(chargeStatus());\n\
    ```\n\nYou can try this yourself using the example battery-event.html—plug and\
    \ unplug your phone from its charger to see the status update.\n\n# Network Information\n\
    \nKnowing the current strength of a device's Internet connection is extremely\
    \ useful; you may want to serve lower-resolution images to devices with low bandwidth\
    \ or stream different video qualities to users depending on their connection.\
    \ Likewise, you may want to hold off on background processes if the user has a\
    \ limited or metered tariff.\n\nThe Network Information API is composed of two\
    \ attributes on the connection object: bandwidth, which is a figure representing\
    \ the estimated bandwidth in Megabytes (MBps) of the current connection (0 if\
    \ the device is offline, infinity if the result is unknown); metered, a Boolean\
    \ that returns true if the connection is metered (such as on-pay-you-go tariffs).\n\
    \nThe following code shows a function that uses both attributes: bandwidth to\
    \ return the current connection's bandwidth and add an extra message to the status\
    \ if the connection is limited.\n\n```\nvar status,\nconnection = navigator.connection,\n\
    showStatus = function () {\n  status = connection.bandwidth + ' MB/s';\n  if (connection.metered)\
    \ {\n    status += ' (metered)';\n  }\n  alert(status);\n}\nshowStatus();\n```"
