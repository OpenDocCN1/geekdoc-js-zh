  md: '# Webinos


    If your goal is to develop true cross-device communication, you may want to consider
    the Webinos framework. This open source, browser-based application platform is
    co-funded by the European Union together with major players such as BMW, Samsung,
    Sony, and the W3C. It is intended to simplify communication between devices, ranging
    from in-car systems to mobile devices to your TV.


    Because Webinos is browser-based, it uses web platform technologies; it''s even
    built on top of Node.js and uses HTML5 WebSockets for communication. The first
    release was in 2012 and development is ongoing, but its potential is already exciting.


    # Application Cache


    Users have certain expectations of website-delivered apps, notable among them
    is that the apps should work offline or least save data if the connection is lost.
    One way to provide offline assets is to save the data in local storage using the
    API I talked about in "Web Storage" on page 117, a better approach might be to
    use the Application Cache, or AppCache. This is an interface that lists files
    that can be downloaded by the user agent and stored in the memory cache even when
    a network connection is unavailable.


    The first step in making an AppCache is to create a manifest file, a text file
    with the suffix .appcache, which must be served with the text/cache-manifest MIME
    type. Link to this manifest using the manifest attribute of the html element on
    every page that you want to make available offline:


    ```

    <html manifest="foo.appcache>

    ```


    Some browsers alert the user that your application is asking to store files offline
    and request permission to do so. Figure 10-1 shows how this looks in Firefox on
    Android.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_201_0.png)


    You need to consider a number of gotchas with the application cache if you''re
    thinking of using it on your site. These were exhaustively listed in Jake Archibald''s
    "Application Cache is a Douchebag," published on A List Apart (see "Further Reading"
    on page 188). I touch on a few of these in the following sections.


    Figure 10-1: Some browsers, such as Firefox, request permission from the user
    before allowing AppCache to store files.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Contents of the AppCache File


    The .appcache file begins with the words CACHE MANIFEST and then follows with
    a list of all files that should be cached. Each file is on a new line, and you
    can add single-line comments by entering a hash (#) at the start of each line.


    The following listing shows a manifest file that stores three files in the cache.
    The comment with the version and date isn''t required but will come in later:


    ```

    CACHE MANIFEST

    # Version 0.1, 2013-04-01

    index.html

    foo.css

    foo.js

    ```


    You don''t need to explicitly list the pages to which the .appcache file is linked,
    because any page that includes the manifest attribute on the html element will
    be cached by default. These automatically cached pages are known as master entries,
    whereas files listed in the manifest are known as explicit entries. If some files
    require online access (such as a database using JavaScript), you can create a
    kind of whitelist of files to be loaded over the network by listing them after
    the NETWORK: header. These files are known as network entries.


    In the following example, files listed in the /dynamic folder will be loaded over
    the network instead of the cache:


    ```

    NETWORK:

    /dynamic

    ```


    You can also add fallback files in case an attempt to load a resource fails, owing
    to the loss of a network connection or something else. You do this below the FALLBACK:
    header, where each line lists a file or folder with the fallback file after it,
    separated by a space.


    In the following example, if any file from the /templates folder fails to load
    the page, fallback.html will be displayed from the cache index:


    ```

    FALLBACK:

    /templates/fallback.html

    ```


    These files are known as fallback entries and, along with the three previous entries,
    complete the categories of file that will be cached.


    # The Caching Sequence


    When the browser loads your page, it first checks for the manifest file. If the
    manifest exists and hasn''t been loaded before, the browser loads the page as
    usual and fetches copies of any files that are in the manifest but haven''t been
    loaded yet. The browser stores all the listed entries in the cache to be loaded
    on the next visit.'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'If the manifest file exists and has been loaded before, the browser loads all
    the files held in the cache first, followed by any other files that are required
    to load the page. Next, it comes to see if the manifest file has been updated,
    and if so, downloads another copy of all the listed files. These files are then
    saved into the cache and the next time the page is loaded; they will not be presented
    to the user immediately.


    One important peculiarity is that in order for the browser to check for new versions
    of files to be loaded, the manifest file itself must be changed. This is where
    the version number or timestamp comment comes in handy: Changing either (or both)
    tells the browser that has been updated, and it will then download the updated
    files.


    # The AppCache API


    If you need to access the cache through JavaScript, you can use the window.applicationCache
    object. This object contains some properties and methods that you''ll find useful
    if you want to downloads of updated files after the initial page load or otherwise
    interact with the manifest.

    The status property returns the current status of the cache, with a numeric value
    and named constant for each state as follows:


    +   - 0 (UNCACHED) means that no cache is present.

    - 1 (IDLE) means that the cache is not being updated.

    - 2 (CHECKING) means that the browser is checking the manifest file for updates.

    - 3 (DOWNLOADING) means that new resources are being added.

    - 4 (UPDATEREADY) means that a new cache is available.

    - 5 (OBSOLETE) means that the current cache is now obsolete.


    You can force a check of the manifest file using the update() method, which checks
    to see if the manifest file has been updated. The update() method gives the status
    property value of 2 while it checks the manifest; it gives a value of 3 if updated
    resources exist and are downloading, and a value of 4 when updated files are ready.

    When the status value is 4, you can use the swapCache() method to load the updated
    files. At this point, remember the browser has loaded the cached version of some
    files for the user in order to speed up the page load, and any updated files in
    the cache won''t be presented to the user until the page is reloaded. To get around
    this, you can use an AppCache event, which fires at various points of the cache
    cycle, not notably when the status property updates. For example, when the status
    value becomes 2, the checking event fires, and when it becomes 3, the downloading
    event fires.


    The following code shows one approach to reloading with updated assets, the udateready
    event when a new cache has been downloaded and then runs a function that double-checks
    the status property has a value equivalent to UPDATEREADY (4). If so, udateready
    swaps the cache and then asks the user if it''s okay to update the latest version
    of the files by reloading the page.'
  merge: -1
  pgno: 203
- img_proc: true
  md: "```\nvar myCache = window.applicationCache;\nmyCache.addEventListener('updateready',\
    \ function(e) {\n  if (myCache.status === myCache.UPDATEREADY) {\n    myCache.swapCache();\n\
    \    if (confirm('Load new version?')) {\n      window.location.reload();\n  \
    \  }\n  }\n}, false);\n```\n\nBy requesting permission to reload the page, this\
    \ script ensures that the user doesn't suddenly lose data or have an action interrupted\
    \ by a forced reload. This approach is used by many popular web apps, including\
    \ Google's suite of tools.\n\n# Summary\n\nIn this chapter, we've taken a (necessarily)\
    \ brief look at packaging websites to act as apps for release through app marketplaces.\
    \ I discussed the difference between hosted and packaged apps, the manifest files\
    \ required for submitting to two web-based marketplaces, and the W3C's manifest\
    \ standard. I also covered hybrid apps, which use web technologies in a native\
    \ wrapper, and discussed how to use the open source PhoneGap to interact with\
    \ a device more deeply than most browsers can. Finally, I discussed AppCache,\
    \ a way of storing files on a device to allow offline access. We looked at what\
    \ it does and how to access it with JavaScript, and briefly covered its limitations.\n\
    \n# Further Reading\n\nThe Chrome Web Store, including in-depth documentation\
    \ on preparing an app for submission, includes details at https://developers.google.com/chrome/web-store/docs/get_started_simple/\n\
    \nFirefox Marketplace provides details about the manifest file, and has a useful\
    \ manifest validation tool at https://developer.mozilla.org/docs/Apps/Manifest/\
    \ and https://firefox.com/developers/validator/. Robert Nyman's talk \"Web APIs\
    \ and Apps\" is a great primer for building apps for the Firefox Marketplace:\
    \ http://www.slideshare.net/robnyman/web-apis-apps-mozilla-london.\n\nThe latest\
    \ version of the W3C widgets specification is at http://w3.org/TR/widgets/, and\
    \ you'll find a useful introduction to Peter-Paul Koch's site—which has changed\
    \ since it was a few years ago, and some small details of the spec have: http://quirksmode.org/blog/archive/2009/04/introduction_to.html.\n\
    \nThe PhoneGap project is at http://phonegap.com/, and the API documentation is\
    \ at http://docs.phonegap.com/. You can read the PhoneGap article \"Beliefs, Goals,\
    \ and Philosophy\" at http://phonegap.com/2012/05/phonegap-beliefs-goals-and-philosophy/."
  merge: -1
