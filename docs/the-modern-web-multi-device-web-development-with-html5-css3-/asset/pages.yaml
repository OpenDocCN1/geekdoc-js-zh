  md: 'for compatibility with legacy pages on the Web; standards mode is modern, standards-compliant
    behavior; and almost standards mode is standards mode with a few quirks.


    To know which mode to use, the browser looks to the Doctype. You always want to
    use standards mode, so the Doctype in HTML5 is the shortest possible that triggers
    standards mode:


    ```

    <DOCTYPE html>

    ```


    The second point of interest, the meta tag, which declares the range of Unicode
    characters used to render the text on the page—UTF-8 is the default used across
    the Web, so this is what you''ll use in most cases. The meta tag uses the charset
    attribute:


    ```

    <meta charset="utf-8">

    ```


    That''s really. If a client asks you to “make their website HTML5,” you can update
    those two tags and charge them a fortune for it. (Please don''t; that was a joke.)


    I could have included plenty of other options, which I''ve left out for the sake
    of clarity and simplicity. The popular HTML5 Boiler provides a comprehensive template,
    so look through the documentation to see what the template does—but keep in mind
    it should be a starting point, not verbatim.


    # Best Practices


    In addition to the changes to the core template, HTML5 has one or two best practices
    that you should consider implementing. HTML5 has been written to take advantage
    of the many ways developers write code, so these shouldn''t be considered hard-and-fast
    rules, but in my opinion, they''ll make your code easier to write and maintain.


    The first practice is that you are no longer required to use the type attribute
    when calling the most common external resources. Using HTML4.01 or XHTML, you
    had to declare a type for each link, script, or style tag:


    ```

    <link href="foo.css" rel="stylesheet" type="text/css">

    <script src="foo.js" type="text/javascript"></script>

    ```


    But working on the Web, CSS and JavaScript are the facto default resource types
    used with these tags, so writing them out every time is a little redundant. Therefore,
    you can drop them, making your code a little cleaner while still being understood
    perfectly by the browser:


    ```

    <link href="foo.css" rel="stylesheet">

    <script src="foo.js"></script>

    ```'
