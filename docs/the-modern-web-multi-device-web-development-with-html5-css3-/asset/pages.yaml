    # # Web Storage


    Recording information about previous activity is usually done with cookies,

    one of its drawbacks is that you can store only small amounts of data.

    The Web Storage API was created to allow user agents to store more data on

    the user''s device. This data can be stored only until the browser is closed,

    is is known as session storage, or until the user or another script

    actively flushes the data, which is called local storage. Both operate in essen-

    tially the same way, except for that one difference—permanence.

    To store data, you save it in key:value pairs, similar to how you store

    cooks now, except the quantity of data that can be saved.

    The API has two key objects, which are straightforward and memorable:

    localStorage for local storage and sessionStorage for session storage.


    > In the examples in this section I use sessionStorage, but you can swap this
    for

    localStorage if you prefer more permanent storage; the syntax applies equally.


    The web storage syntax is pretty flexible, allowing to store an item: with the
    setItem() method, with square bracket notation,

    or with dot notation. A simple example, the next code snippet shows

    might store this author''s name; all three methods are shown for comparison, and
    all are perfectly valid.


    ```

    sessionStorage.setItem(''author'', ''Peter Gasston'')

    sessionStorage[''author''] = ''Peter Gasston''

    sessionStorage.author = ''Peter Gasston''

    ```


    Another developer tools allow you to inspect the contents of storage, so

    Figure 6-7 show the result of this code, regardless of which approach you use.

    Retrieving items from storage is just as flexible a process; you can use

    the getItem() method, which accepts only the name of the relevant key as

    t argument, or the square bracket or dot notation method without any

    value. In the next code snippet, all three techniques are shown and

    eequivalent:


    ```

    var author = sessionStorage.getItem(''author'')

    var author = sessionStorage[''author'']

    var author = sessionStorage.author;

    ```'
