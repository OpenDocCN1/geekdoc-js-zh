  md: '# New in JavaScript


    From many new ways of DOM traversal to a whole range of events, JavaScript has
    changed plenty in the past three or four years. If you don''t actively follow
    or keep up with the JavaScript community, you can easily miss it.


    In this section, I run through some of the new features of JavaScript, chosen
    on the massively unscientific basis of how useful I think they are. This section
    includes everything that''s new in the language—just a handful of methods, attributes,
    and events you might use often in your day-to-day web builds.


    # The async and defer Attributes


    A browser''s default behavior is to load all page elements in order and execute
    JavaScript files as soon as they''re encountered, which blocks HTML parsing. Sites
    on slow connections, or those that include a lot of script to execute, can lag
    considerably. This is why best practice is to link script files to the end of
    your document, after the rest of the page has loaded.


    A solution that prevents this being developed, however. The defer attribute, added
    to the script element for external files (that is, when the src attribute is present),
    downloads scripts without pausing the parser delays executing them until the HTML
    has finished loading. As defer is a Boolean attribute, no value is required:


    ```

    <script src="foo.js" defer></script>

    ```


    HTML5 has another new option, which is to execute the scripts asynchronously.
    With as deferred loading, external scripts are downloaded without pausing the
    parser; the difference is that the parser then executes them as soon as possible.
    This approach is a kind of "best of both worlds approach: not pausing the parser
    while downloading but not waiting until the end before executing. This option
    requires the async attribute, which is also Boolean:


    ```

    <script src="foo.js" async></script>

    ```


    One drawback is that your scripts may be very well executed in a different order
    than you call them in the document, so you can''t rely on dependencies between
    script files. But if order is not an issue and the script is self-contained, this
    option may be best.


    You can see the difference in the way the three approaches work in Figure 5-1.
    The first row shows default behavior, where HTML parsing is paused while the scripts
    are loaded and executed. The second row shows'
  merge: -1
  pgno: 106
- img_proc: true
  md: "deferred execution, where the scripts are loaded without pausing the parser\
    \ and then executed when the DOM is ready. In the final row, the parser still\
    \ isn't paused while the script is loading, but it is paused as it executes.\n\
    \n```\n<script>\n<script defer>\n<script async>\n```\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_107_0.png)\n\
    \nFigure 5-1: The effects of deferred and asynchronous loading of JavaScript files\n\
    \n# The addEventListener Method\n\nThe standard way to add event handlers to elements\
    \ was to be with the series of event properties, as element.onclick or element.on,\
    \ which were fine but had the drawback of allowing only a single handler of type\
    \ on each element. The W3C created a more flexible approach in the form of the\
    \ addEventListener() method.\n\nHonestly, this isn't all that is, but only fairly\
    \ recently, after being implemented in IE9 in 2011, addEventListener() had a good\
    \ level of support across browsers. A generic method, addEventListener() takes\
    \ two mandatory and one (semi-)optional parameter:\n\n```\nel.addEventListener(type,listener,useCapture)\n\
    ```\n\nThe type parameter is the type of event to listen for; the listener is\
    \ the object that gets notified when the event occurs and is most commonly a function;\
    \ and useCapture is a Boolean to indicate event bubbling. I won't go into detail\
    \ on the latter parameter, as describing event bubbling is beyond the scope of\
    \ this book, but although the parameter is supposed optional, you have to include\
    \ it, as certain older browsers will throw an error if it's not present. If you\
    \ don't need it or know what it is, set useCapture to false and don't worry about\
    \ it.\n\nHere's a quick example of a simple use of addEventListener(); this code\
    \ listens for a click event and runs an anonymous function to log a message into\
    \ the console when even occurs:\n\n```\nel.addEventListener('click', function\
    \ () {\n  console.log('Click!');\n},false);\n```"
  merge: -1
  pgno: 107
