  md: 'One of the limitations of forms in HTML 4.01 was that all form elements, including
    the submit button, had to be contained within the form element itself, meaning
    that, unless JavaScript were used, all the elements had to follow each other subsequently
    in the markup, limiting the ways they could be laid out on the page.


    HTML5 has addressed this with the form attribute, which takes a value the id of
    the form creating an association between the field and the form regardless of
    their position in the markup. The value of the element is then submitted along
    with the form. In this example, the #bar will be submitted along with the form
    #foo:


    ```

    <form id="foo">...</form>

    <input type="text" id="bar" form="foo">

    ```


    # Datalists


    When elements accept text input—such as text, url, or search—you can provide a
    list of helpful suggestions to the user. The browser can offer these based on
    the user''s previous input (controlled by the previously automated attribute),
    but at times you may want to search a range of predefined terms. Implement this
    with the datalist element.


    The datalist element contains a list of suggestions, each of which is contained
    in an input child element (which should be familiar with the select element in
    HTML 4.01). To illustrate what I mean, here''s a short list with a few options:


    ```

    <datalist id="apes">

    <option>Chimpanzee</option>

    <option>Gorilla, Eastern</option>

    <option>Gorilla, Western</option>

    <option>Orangutan</option>

    </datalist>

    ```


    The datalist element is not rendered on the page and doesn''t have to be close
    to the input that refers to it; it can be placed anywhere in the markup.

    to create an association between the input field into which the user will enter
    data and the datalist element that holds the suggestions, the former uses the
    id of the latter for its own list attribute:


    ```

    <input type="text" id="apes">

    ```


    Now when the user types a letter (or sequence of letters), any option element
    within the datalist that match that sequence will be displayed in a list of suggestions
    below the input. From here, the user can choose a matching option. You can see
    this for yourself in input-types-more.html, as illustrated in Figure 8-3.'
