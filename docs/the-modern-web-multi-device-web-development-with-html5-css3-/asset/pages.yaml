- img_proc: true
  md: "Figure 11-7 shows a few different values at work. The first example has a value\
    \ of start, so the content flows to the left of the exclusion element. The next\
    \ has the end value, so the content flows on the opposite side. And in the final\
    \ example, the clear value makes content flow on neither of the side.\n\nTo permit\
    \ more control over the flow of inline elements around the exclusion, you have\
    \ the wrap-through property. This property takes one of two values: flow and none.\
    \ The former, the default, makes inline content flow around the exclusion element;\
    \ the latter doesn't. This is useful if you want to enable control on a per-element\
    \ basis.\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_220_0.png)\n\nFigure 11-7:\
    \ Content flows on different sides of the exclusion element as various values\
    \ are applied to wrap-flow.\n\n# Exclusions and Grids\n\nFor me, one of the most\
    \ exciting things about CSS Exclusions is the way they interact with the Grid\
    \ Layout module that I introduced in Chapter 4. Any grid item can be made into\
    \ an exclusion element, which really expands grid layout possibilities. As a simple\
    \ example, consider a grid with three columns and rows:\n\n```\n{\n  display:\
    \ grid;\n  grid-columns: 1fr 1fr 1fr;\n  grid-rows: 100px 1fr;\n}\n```\n\nOn that\
    \ grid, I'll place two items that have overlapping cells, they'll overlap in row\
    \ two, column two:\n\n```\n{\n  grid-column-span: 2; \n}\n{\n  grid-column: 2;\n\
    \  grid-row-span: 2;\n}\n{\n  grid-row: 2;\n}\n```"
  merge: -1
  pgno: 220
- img_proc: true
  md: "Under the usual rules of grid placement, element G would stack over the top\
    \ of element F, as it appears later in the DOM order. By making element G the\
    \ exclusion element, the inline content of element F will flow around it:\n\n\
    ```\nG {\n  grid-flow: both;\n}\n```\n\nAs you can see in the example file grid-exclusion.html\
    \ (and in Figure 11-8), F now takes a kind of inverted upside-down L shape as\
    \ it flows around element G. This kind of layout is quite common in print so being\
    \ able to reproduce it in web pages is really quite exciting. By making the kind\
    \ of art direction that books and magazines have taken for hundreds of years,\
    \ CSS Exclusions ushers in a new era of laying pages on the Web.\n\n> Once upon\
    \ a time, a mouse, a bird, and a sausage, entered into partnership and set us\
    \ together. For a long time all went well; they lived in comfort, and prospered\
    \ far as to be able to afford considerably to their stores. The bird's duty was\
    \ to fly daily into the wood and bring fuel. The mouse fetched the water, and\
    \ the sausage saw to the cooking. When people are too well off they always begin\
    \ for something new.\n\nFigure 11-8: CSS Exclusions work nicely with CSS grids\
    \ to create layout patterns that have previously not been possible.\n\n# Shaped\
    \ Exclusions\n\nThe Exclusions used in the examples in this section so far are\
    \ based on standard block elements, they appear box. The plan in the future is\
    \ that you won't be limited to rectangular exclusions a pair of new properties\
    \ will allow you to draw geometrical exclusion shapes.\n\nThe shape-inside and\
    \ shape-outside properties will accept a value either a simple geometric shape\
    \ such as a circle or ellipse, or a series of coordinates that will create a completely\
    \ customized polygon shape. Could then be flowed around either the inside or outside\
    \ of this shape (or both), opening possibilities for the types of rich layout\
    \ possible in print but now improved with the dynamism of web content.\n\n# Even\
    \ Further Future Layouts\n\nAs I wrote this in early 2013, a series of new rules\
    \ and properties that affect layout are at various degrees of implementation—from\
    \ barely there to only proposal. My hope is that they will all be adopted and\
    \ implemented because"
  merge: -1
  pgno: 221
- img_proc: true
  md: 'they solve different problems. With the CSS specification in a constant state
    of flux, however, nothing can be taken for granted; these rules and properties
    may be partially implemented with a different syntax, or not implemented at all.


    Still, I think looking at them is worthwhile for two reasons: First, so you can
    see the thinking that goes on in trying to find solutions to the problems of web
    layout; and second, if they are implemented, you may need to use them.


    # Box Alignment


    The idea behind the Box Alignment module is to create a syntax that''s common
    across many different modules, for aligning elements within their parent. Box
    Alignment takes the Flexbox syntax as its inspiration, using justify-properties
    for inline/main axis alignment and align-properties for stacking/cross-axis alignment.
    For example, to align an element along its main axis, you''d use the justify-self
    property; and to align the child elements of an element across the cross axis,
    you''d use align-content.


    # Line Grid


    In addition to the well-known grid formed with rows and columns, typography also
    use what''s known as a line grid, or a vertical rhythm, secondary grid created
    from the lines of text and headings on a page. When using a line grid, you try
    to make the vertical dimensions and alignment of objects harmonious with the text
    for better readability.


    The Line Grid module creates a virtual grid based on the font-size and line-height
    of elements and lets you better align objects within that grid. It allows you
    to snap block elements to fixed points in that grid, overriding the default layout
    position by the browser''s engine.


    # Paged Media


    Scrolling is the de facto way to work with content that overflows its container,
    especially the screen, scrolling isn''t always easy with devices such as remote
    controls and liquid ebook readers. A better approach for these devices might be
    to paginate overflow.


    You can do this with features proposed in the Paged Media module, which introduces
    the overflow-style property. A value of paged-x or paged-y automatically creates
    pages horizontally or vertically (respectively), while -controls (such as paged-x-controls)
    adds on-screen controls generated by the browser for interfaces that require them.


    A further proposal, Pagination Templates, extends this even further, creating
    content regions that are fixed to each page for a consistent experience, allowing
    rich interactive magazine-style layouts.'
  merge: -1
  pgno: 222
