  md: 'On top of that, no currently available browsers support the new outlining algorithm
    (the JAWS screen reader device, albeit with bugs), so your hard work doesn''t
    really have much benefit—this is likely to change in the future, of course.


    In the end, the decision to use the new structural elements is, of course, up
    to you. They''re not mandatory—you can still use div elements as you prefer. Currently
    I find it hard to recommend them, unless you''re prepared to read the HTML5 spec
    and fully understand how the new elements work on the outline of a document—and
    you''re working in an environment where legacy browsers aren''t an issue. As things
    are at the time of writing, I would look for an alternative to show page structure.
    Luckily, one is available, in the shape of WAI-ARIA.


    # WAI-ARIA


    The Web Accessibility Initiative''s Accessible Rich Internet Applications suite
    (WAI-ARIA to its friends) was created to address the shortfall that the Web moved
    beyond simple document markup and into an era of applications and interactivity.


    WAI-ARIA does this by creating a number of HTML extensions (or, in fact, for any
    DOM-based languages, such as SVG and XML), allowing developers to make browsers
    and assistive technology aware of interactive content. For example, if you have
    a link that uses JavaScript to create an on-screen dialog overlay when clicked,
    you have no way to make the browser aware of it; the markup just looks like a
    standard link:


    ```

    <a href="http://example.com">Launch popup</a>

    ```


    Because the event is attached to the link using script, the screen reader device
    has no information about what happens here and can''t give any context to the
    user, who remains unaware of the functionality. WAI-ARIA introduces a new attribute,
    aria-haspopup, for just this situation, giving information to the user about what
    is going on:


    ```

    <a href="http://example.com" aria-haspopup="true">Launch popup</a>

    ```


    A whole range of new attributes is available, among them are known as landmark
    roles; these attributes make screen readers and other accessible navigation devices
    aware of your page''s structure, so the user can easily find their way around
    your document. This solution goes some way toward fulfilling the structural obligations
    that the new HTML5 elements were created to.


    > > **NOTE**


    > As mentioned, at the time of writing, some user agents and assistive technologies
    don''t parse the new HTML5 document outlines correctly, so the use of landmark
    roles may help with backward compatibility.'
