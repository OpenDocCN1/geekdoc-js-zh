  md: 'You can apply filters to entire blocks of HTML using SVG''s foreignObject element,
    which acts as a container for snippets of markup as long as the markup is correctly
    formatted XHTML. The next example shows how this works. There are a few things
    to note: First, foreignObject has a requiredFeatures attribute that checks to
    whether the browser supports the feature of the required object type, in this
    case, extensions to SVG11; second, the markup inside the element has the XHTML
    namespace.


    ```

    <foreignObject filter="url(#filter)" requiredFeatures="http://www.w3.org/TR/SVG1/featureExtensibility">

    <h1 xmlns="http://www.w3.org/1999/xhtml">SVG</h1>

    </foreignObject>

    ```


    Try it for yourself in the file svg-foreignObject.html. You can see the result
    in Figure 7-7.


    # SVGSVG


    Figure 7-7: SVG filter applied to HTML markup using foreignObject


    # The Convergence of SVG and CSS


    Work on version 2 of SVG—which goes by the clever name of SVG2—is underway at
    the moment, and one of its goals is better integration with CSS, as many of their
    features are shared. The new Transforms module, for example, integrates the extremely
    similar CSS Transforms and SVG Transforms modules. Our new shared features include
    advanced image techniques such as Masking and Clipping (showing or hiding parts
    of an SVG image) and Compositing and Blending (combining shapes and colors).


    Probably the first to arrive, however, will be Filter Effects. These are already
    implemented pieal in some browsers as this come and in two main components. The
    first is to use defined filters on any element in the page, even outside of the
    SVG code block; for example, using the filter defined in the previous section
    natively in CSS would be as easy as this:


    ```

    .foo { filter: url(#filter1); }

    ```


    The second component is to use function keywords—essentially, shortcuts to predefined
    SVG filters. For example, to add Gaussian blur to an element, you could use the
    blur() function and, for saturation, saturate() function:


    ```

    .foo { filter: blur(3) saturate(0.1); }

    ```'
