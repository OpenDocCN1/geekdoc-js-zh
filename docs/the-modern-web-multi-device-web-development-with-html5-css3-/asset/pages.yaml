  md: 'The solution that Apple came up with when they created Safari for iPhone was
    to ask developers to add a special tag, known as the viewport meta tag, in the
    head of their documents. This tag is used to control the dimensions and scaling
    of the browser viewport. Here’s an example:


    ```

    <meta name="viewport" content="width=device-width">

    ```


    You can use many different values in the content attribute, but the ones in this
    code mean: “Make the width of this document the same as the width of this device.
    The difference can be clearly seen in Figure 3-3, which shows the same document
    before and after this tag is applied. In the before shot, the browser automatically
    adjusts the main body text to fit the screen, but the heading and image are very
    small; in the after shot, the heading and image are more naturally sized for the
    screen.


    A device’s width will vary, but it is also affected by DPR. In the iPhone 3GS
    screen, it is 320px. But although the iPhone’s “retina” screen has a physical
    pixel count of 640px, as has a DPR of 2, it only counts 320px—when the viewport
    meta tag is used with the device-width value.


    Other parameters used in this tag control the initial zoom level of the page and
    whether the user has control over zooming. In this example, the initial zoom level
    is 1.5x, and the user will not be able to change that:


    ```

    <meta name="viewport" content="initial-scale=1.5,scalable=no">

    ```


    ![](img/c5e4d8671dcefe9f3888e6a849798773_65_0.png)


    Taking the option to zoom out of users’ hands can be extremely annoying; think
    carefully before applying this option.


    Although the viewport meta tag fulfills its main function, it has a drawback:
    Using a meta tag means you can define only one set of parameters per page. For
    example, rather than using the default device width, you could specify a fixed
    size instead:


    ```

    <meta name="viewport" content="width=480px">

    ```


    The problem is that all devices that recognize the viewport tag will set their
    zoom level at 480px, which is smaller for handheld devices but less useful for
    large tablets.


    The solution is to set the viewport parameters in CSS. You do this with the @viewport-rule.
    Where the viewport meta tag uses different parameters in the content attribute,
    @viewport CSS syntax to perform the same functions with a subset of specialist
    properties. To illustrate, I repeated the previous example:


    ```

    @viewport { width: 480px; }

    ```'
