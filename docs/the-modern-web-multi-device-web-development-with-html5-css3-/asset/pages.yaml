  md: 'HTML5 and related technologies make all of this easy. Using existing

    well-implemented methods, you can create pages that are solid, mean-

    ngful, high performing, and rich in data.


    # New Elements in HTML5


    One of the major features in HTML5 is a range of new semantic ele-

    ments, extending the suite far beyond its roots in marking scientific

    duments with headings, lists, and paragraphs. Most of the new elements

    are aimed at giving a page better structure and developers more options

    for marking up areas of content than just using a div with an associated id

    classes.


    Here''s one example. In the past, developers might have used this:


    ```

    <div class="article">...</div>

    ```


    In HTML5, they have the option of using this:


    ```

    <article>...</article>

    ```


    The W3C''s HTML5 spec lists ten structural elements. Of these, three

    already exist in HTML4: body, h1-h6 (if we cheat a little and count them

    as a single entity), and address. Of the seven new elements, four what are

    known as sectioning content; I''ll get to what this means in a little, but

    for now here''s the list:


    +   **article** An independent part of a document or site, such as a forum

    post, entry, or user-submitted content

    **aside** An area of a page that is tangentially connected to the content

    around it, but which could be considered separate, like a sidebar in a

    magazine article

    **nav** The navigation area of a document, an area that contains links

    other documents or other areas of the same document

    **section** A thematic grouping of content, such as a chapter of a book, a

    page in a tabbed dialog box, or the introduction to a website home page

    **footer** The footer of a document or an area of a document, typically

    containing metadata about the section it''s within, such as author details

    **header** Possibly the header of a document, but could also be the header

    of area of a document, generally containing heading (h1–h6) elements

    to mark up titles

    **hgroup** Used to group a set of multiple-level heading elements, such as

    as subheading or a tagline'
