  md: 'You can also use a number of APIs to go even further with files: The File Writer
    API allows you to modify the content of a file, and the File System API goes further
    still with the provision of a navigable filesystem on the user’s device. These
    APIs are exciting but somewhat too technical for me to go into detail in this
    book.


    # Mozilla''s Firefox OS and WebAPIs


    A potentially interesting entry into the mobile OS comes from new Mozilla, makers
    of the Firefox browser. Mozilla is building a brand new from the ground up, all
    constructed with open standards—HTML, CSS, JavaScript, and others. The OS has
    no middleware layer, like iOS or Android, and the system APIs all use JavaScript
    to interact directly with the hardware. Building a new OS is a bold undertaking,
    and I look forward to seeing how it performs.


    As of that, Mozilla realized they needed to develop many of the existing device
    APIs and this project is called WebAPI, and although many of the included APIs
    have been covered already in this chapter, a few are unique to Firefox OS at the
    moment.


    Here are some of the new APIs: WebTelephony, for sending and receiving calls;
    WebSMS, for sending, receiving, and managing text messages; Contacts, for accessing
    and receiving, the address book; and Device Storage, for accessing and managing
    shared files or folders such as the gallery featured on many phones.


    The fate of Firefox OS and broader implementation of these APIs remain to be seen,
    but I’m excited about a smartphone OS that is built using only open web technologies
    and the many possibilities that opens up for web developers with device interactions.


    # PhoneGap and Native Wrappers


    If you need deeper access to device APIs but still want to develop using web technologies,
    you might want to consider a native wrapper for your app. These wrappers act as
    a kind of layer between your web application and the device in question, providing
    hooks into the API but not using native code to display what’s on the screen.
    Using a native wrapper around technologies creates what is known as a *hybrid
    app*.


    Which wrapper you depends largely on your targets (I’ll discuss this in more detail
    in Chapter 10), but as an example of what they can do, PhoneGap is perfect. It’s
    a wrapper for mobile apps, providing a common API for developers to build hybrid
    apps that work across iOS, Android, Windows Phone, Blackberry, and more.'
  merge: -1
