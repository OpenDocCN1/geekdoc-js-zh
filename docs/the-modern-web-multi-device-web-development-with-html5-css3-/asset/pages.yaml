    \ need to refresh the page to get a different result; just resize the window.\n\
    \n# Adaptive vs. Responsive Web Design\n\nAs mentioned at the start of this chapter,\
    \ two main methodologies, known as adaptive and responsive, are used for modern\
    \ website development. Both share the concept of using breakpoints, which are\
    \ the limits created by using media queries, at which point a change to the site\
    \ layout is imposed.\n\nThe difference between adaptive and responsive methodologies\
    \ comes down to how the choose between breakpoints; adaptive is essentially a\
    \ series of fixed-width layouts, whereas responsive uses flexible dimensions or\
    \ even between breakpoints has fluidity.\n\nMy opinion is that, given the enormous\
    \ variability in device sizes, making a series of fixed-width pages to accommodate\
    \ the most common configurations is probably a fool's errand. The better approach,\
    \ and the key to building responsive, is to use what's known as fluid design,\
    \ which involves using percentages for length values to make the dimensions of\
    \ the elements on the page relative to the size of the viewport.\n\nMaking a page\
    \ that's fixed 960px wide was acceptable when your users were mostly using desktops\
    \ or laptops with monitors at least 1024px wide, but those days are over, and\
    \ designing that nowadays means with mobile devices see a scaled-down screen that\
    \ they have to zoom in and out of scroll to see. Not the end of the world, but\
    \ not ideal.\n\nUsing percentages instead of fixed values means your page elements\
    \ scale up or down along with the size of the viewport, making the content inside\
    \ the boundaries of the screen—hence the name, fluid. Combine this with media\
    \ queries for content or devices, and you have the very core of responsive design\
    \ and a tailored, sympathetic experience for your user, regardless of his or her\
    \ device.\n\nWorking with projects is not without problems, however, one of which\
    \ is the difficulty of mixing length units. Consider, for example, a page with\
    \ three columns: a central column that's 50 percent wide, and a column on either\
    \ side that's 25 percent wide:\n\n```\nE, G { width: 25%; }\nF { width: 50%; }\n\
    ```\n\nNow say you want to add 20px of padding to the left and right of the central\
    \ column, to act as a gutter, but you don't want this width to be variable—it\
    \ must always be exactly 20px:\n\n```\nF {\n  padding: 20px;\n  width: 50%; }\n\
    ```"
