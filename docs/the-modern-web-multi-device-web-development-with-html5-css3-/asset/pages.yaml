  md: 'Introducing the optimum attribute changes the behavior slightly, as it can
    introduce a third level of "acceptability" depending on where it''s positioned.
    For, given the meter element in the previous example, you could say there are
    three ranges: low for any value of 0.2 or less, high for any 0.8 or greater, and
    average for any greater than 0.2 but less than 0.8. If you were to set the optimum
    to be 0.9, any value in the range would be optimal and colored green, and any
    in the low range less optimal still and colored red. Conversely, if the optimum
    value were 0.1, those ranges of optimality would be reversed.


    If that all sounds a little complex, the following markup shows a few different
    examples, which you can see for yourself in the example file input-types-meter.html
    and illustrated in Figure 8-10; I advise you to view this example as it relies
    on color, which is hard to convey in a black-and-white book! I''ll annotate this
    code and explain it afterwards.


    ```

    <meter min="0.2" max="0.8" value="0.85" of 1</meter>

    <meter min="0.2" max="0.8" optimum="0.9" value="0.85" of 1</meter>

    <meter min="0.2" max="0.8" optimum="0.1" value="0.85" of 1</meter>

    ```


    In all three examples, the low range is 0 to 0.2, the medium range is 0.21 to
    0.79, the high range is 0.8 to 1, and the value of the meter is 0.85. The numbers
    correspond to the examples in Figure 8-10 in vertical order. In no value is given,
    so the optimum range is medium (neither high nor low). The value of the meter
    is in the high range, one range away from optimum, so it''s colored yellow. In
    the optimum is 0.9, so the high range becomes optimum; the value is within optimum
    range and colored green. In 0.1, so the low range becomes optimum; the value is
    0.85, which is two ranges away from optimum, so colored red.


    | Meter - No optimum |

    | Meter - High optimum |

    | Meter - Low optimum |


    ![](img/c5e4d8671dcefe9f3888e6a849798773_169_0.png)


