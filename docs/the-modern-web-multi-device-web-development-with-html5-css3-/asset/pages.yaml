  md: '# About the Author


    Peter Gasston has been a web developer for over 12 years in both agency and corporate
    settings. He was one of the original contributors to CSS3.info, the leading online
    destination for CSS3. Gasston is the author of The Book of CSS3 (No Starch Press)
    and has been published in Smashing Magazine, A List Apart, and .net magazine.
    He gives talks about technologies at developer conferences and runs the web development
    blog Broken Links (http://broken-links.com/). Gasston lives in London, England.


    # About the Technical Reviewer


    David Store is an HTML5 evangelist at Plain Concepts, a founding member of the
    IE userAgents program, and a CSS Working Group member. Prior to this, he was the
    developer advocate manager on a top-secret skunk project at Motorola. He also
    found the developer relations team at Opera, product managed Opera Dragonfly,
    and worked at CERN, home of the World Wide Web. His passion is keeping the Web
    open for all.'
