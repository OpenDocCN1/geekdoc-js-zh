    # # Displaying Information to the User


    As well accepting input from users, sometimes displaying information back to users
    is helpful, perhaps to show their progress through filling out a long form or
    the results of a measurement. A new set of elements in HTML5 is aimed at exactly
    that purpose.


    # ## progress


    Progress bars show movement toward a set goal and are commonly used in operating
    systems and on the Web, when loading data into a web application or installing
    software. The progress element gives you a standardized method for implementing
    progress bars in your own pages. In simplest simplest, it shows progress between
    0 and 1, using the value attribute to show the current position:


    ```

    <progress value="0.5">0.5</progress>

    ```


    Although this element is displayed as a bar in most browsers—as you can see in
    Figure 8-9—including the value inside it is also good practice, as it serves as
    a fallback for browsers that don''t have a graphical widget.


    # ## Progress


    ![](img/c5e4d8671dcefe9f3888e6a849798773_167_1.png)


    Figure 8-9: Different implementations of the progress element: Firefox for Android
    [left] and Opera for Ubuntu [right]


    If the values you want to use can''t be simply divided into a range of 0 to 1,
    you can set a different range with the max and min attributes:


    ```

    <progress max="20" min="10" value="15\</progress>

    ```'
