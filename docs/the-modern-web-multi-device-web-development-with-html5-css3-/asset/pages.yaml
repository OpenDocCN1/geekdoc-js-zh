  md: 'Although you can create entire page layouts with Flexbox, that''s not really
    what it''s intended for, and you would probably be hacking around

    to get the exact layout you want. A better option is to use a dedicated set of

    page layouts, and that''s where the Grid Layout module comes in.


    # Grid Layout


    Grids are a fundamental design element. Simple grids have been used by

    calligraphers since medieval times the modern typographic grid since

    the second half of the 20th century. For a few years now, efforts have been

    made to bring grid-based design to the Web, with a number of frameworks

    being created that use floats, padding, and margins to emulate the poss-

    nilities of print.


    Recently browsers have begun to implement a native CSS Layout

    system, which provides a series of properties designed specifically to cre-

    ate on grids, meaning the developer no longer has to hack them

    together from existing properties and behaviors. Before introduce

    the new syntax, I''ll explain some of the terminology used in the Grid

    Layout module. Even if you''re a designer familiar with using grids, you should

    take time to understand these terms, as the terminology used in CSS grids

    is distinct from that used by designers.


    Here''ve defined the keys used in the module:


    **Grid element** The container element that acts as the boundary and sets

    dimensions of the grid.


    **Grid items** Each element that is placed onto the grid is known as

    an item.


    **Grid lines** The dividing lines between rows and columns; these lines

    are notional, not actual.


    **Grid tracks** The shorthand for both rows and columns. Each

    col or row created in the grid is referred to as a *track*. Tracks are

    t spaces between lines.


    **Grid areas** Each intersection of a grid and a row creates an *area*.

    Think of these like cells in a table.


    A grid is created by first setting a number of lines on the grid element

    to create a series of tracks. Grid items are then positioned in the grid using

    the tracks as coordinates and either fit into an area or span a series of areas,

    as shown in Figure 4-13.


    If you''ve used spreadsheet software such as Excel, a grid should be easy

    to visualize. The grid lines—the lines between cells—define a series of rows\sand
    columns that are numbered for coordinate placement. (If you haven''t

    used spreadsheet software or don''t know about typographical grids and

    are confused by what this means, don''t worry—I explain it in stages.)


    > NOTE The syntax I''m using in this section is what shipped with Internet Explorer
    10;

    hover, the specification has undergone changes since then. The new syntax will

    listed later in “The September 2012 Grid Layout Syntax” on page 84.


    78 Chapter 4'
