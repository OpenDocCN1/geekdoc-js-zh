  md: '# 11


    # # THE FUTURE


    ![](img/c5e4d8671dcefe9f3888e6a849798773_207_0.png)


    So far in this book I''ve aimed to discuss only those web features that are pretty
    stable in at least a few browsers, or that should be stable sometime in the near
    future.


    But now that we''ve arrived at this last chapter, I can really cut loose and talk
    about some of the experimental features on the horizon.


    Changes are planned everywhere: A new revision of JavaScript, Harmony, is due
    for release sometime in 2013 and should make its way into browsers over the coming
    years; many new APIs are being proposed to the W3C, one for discovering devices
    on the same network using Universal Plug and Play (UPnP) and one for measuring
    ambient light; work on the draft specification for HTML5.1 is well underway; many
    CSS modules are already moving to Level 4. I could talk about any number of changes,
    but I''ll focus on the ones that I think will have the greatest impact on the
    way we work and that have a good chance of being implemented.'
