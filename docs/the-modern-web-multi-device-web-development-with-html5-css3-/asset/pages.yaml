    The field''s type determines the pattern of the value—email requires an email
    address, url requires a URL with protocol, date requires a year, month, and day,
    and so on—but you can override this requirement with the pattern attribute. The
    value for pattern is a regular expression, or regex, a standardized way of matching
    strings across many programming languages. As a simple example, you might want
    to allow only numbers in your input:


    ```

    <input type="tel" pattern="\d*">

