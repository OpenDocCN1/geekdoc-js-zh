  md: '# 9


    # MULTIMEDIA


    ![](img/c5e4d8671dcefe9f3888e6a849798773_177_0.png)


    Although audio and video have been a popular part of the Web for many years on
    sites such as YouTube, Dailymotion, and SoundCloud, they''ve been second-class
    citizens, relying on third-party plug-ins (especially Flash) to operate. A reliance
    on plug-ins isn''t a good long-term plan for website owners or browser makers,
    not least because the user is responsible for keeping them up-to-date. Surely,
    updating audio and media capabilities along with the browser is best, especially
    since most browsers have a frequent update cycle nowadays.


    Plug-ins can also cause stability issues, Steve Jobs famously noted when detailing
    the reasons for not supporting Flash on iOS:


    We also know firsthand that Flash is the number one reason Macs crash, but they
    have been working with Adobe to fix these problems, but they have persisted for
    several years now. We don''t want to reduce the reliability and security of our
    iPhones, iPods, and iPads by adding Flash.'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'For these reasons, having audio and video natively in the browser is extremely
    important, and one of the big pushes in HTML5 has been toward making this happen
    in the form of a pair of media elements that are widely implemented in browsers
    today. These elements control playback of audio and video from multiple sources,
    and in addition to robust HTML implementation, they also have an extensive API
    and set of events, giving developers control over what they can do. Being part
    of the web platform, they interact with other content—far beyond what was possible
    with boxed plugins—making the media elements first-class web citizens.


    After exploring the media elements, I take a brief look at the future of multimedia
    on the Web, from audio mixing and effects APIs to the future (or at least a possible
    future) of real-time voice, video, and data communication—the WebRTC project.


    # The Media Elements


    For either audio or video files, you need to use the audio or video elements,
    respectively. They are similar, sharing the same attributes and child elements,
    with the type of media they deliver the key difference. At their most simple,
    each element requires only a single attribute, src, which is the path to the media
    file to be played:


    ```

    <audio src="foo.ogg"></audio>

    <video src="foo.ovg"></video>

    ```


    What you see depends on the element: with video, you see the video file at its
    natural densities with the first frame showing; audio, you see nothing. In either
    case, you can''t play the file because there are no onscreen controls. You add
    them using the controls attribute:


    ```

    <audio src="foo.ogg" controls></audio>

    <video src="foo.ovg" controls></video>

    ```


    Now you''ll see on-screen controls for each of the media elements, as illustrated
    in Figure 9-1, and you can take a look for yourself in the file media-elements.html.
    I suggest you view this example in Chrome, Firefox, or Opera, for reasons that
    will become clear in this chapter.


    Using these attributes, a media file plays only at the user''s request and only;
    if you prefer, you could have the file play as soon as it has loaded by


    ![](img/c5e4d8671dcefe9f3888e6a849798773_178_0.png)


    Figure 9-1: Native controls for the video (top) and audio (bottom) elements on
    Chrome for Ubuntu


    162 Chapter 9'
  merge: -1
  pgno: 178
