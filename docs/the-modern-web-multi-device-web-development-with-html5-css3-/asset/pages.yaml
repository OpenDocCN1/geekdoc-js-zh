  md: "The break-after and break-inside properties work the same way, except for the\
    \ location where the break occurs. (Do you need me to tell you that is, or would\
    \ you like to guess?\n\n# Flexbox\n\nIf you're building more of an app than a\
    \ content-rich website, especially if you're building an app with buttons and\
    \ options in the UI, or with lists of form elements or interactive regions, you'll\
    \ find the Flexible Box (Flexbox) module extremely useful.\nThe roots of Flexbox\
    \ are in XUL, the language used to create the Firefox browser's layout, which\
    \ shouldid tell you that it's aimed at user interfaces. Flexbox makes elements\
    \ resize flexibly to better fit their available space and reorders them or changes\
    \ their orientation quickly.\nThe Flexbox syntax has undergone an awful lot of\
    \ changes in the past few years, but it's finally stable and well implemented,\
    \ so we can discuss it without worry!\n\n# Declaring the Flexbox Model\n\nThe\
    \ first step to using Flexbox is to create the flex container. The flex container\
    \ is the parent element that will hold all the flex items (I'll get to those soon).\
    \ To declare a flex container, simply use a new value for the display property:\n\
    \n```\nE { display: flex; }\n```\n\nNow you have your flex container, but what\
    \ is it good for? That becomes apparent when you add child items to the container.\
    \ Example file flexbox.html has two child items inside the container, using the\
    \ following markup:\n\n```\n<div id=\"container\">\n  <div id=\"a\">...</div>\n\
    \  <div id=\"b\">...</div>\n</div>\n```\n\nIn 4-5, notice that the elements are\
    \ positioned horizontally inside the container at equal widths, even though I\
    \ haven't used any floats or positioning properties. This behavior is the default\
    \ for flex items (children of a flex container): They are laid out in a row inside\
    \ the container. Or, rather, they are laid out in the direction of the language\
    \ of the document—left-to-right languages, such as English, the direction in a\
    \ row is from"
