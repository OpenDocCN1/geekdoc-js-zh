    \ advanced storage capabilities, keep it in mind.\n\n# Drag and Drop\n\nAdding\
    \ a \"physical\" aspect to your websites that allows users to move elements around\
    \ the screen is a nice option. \"drag and drop\" behavior is especially useful\
    \ on devices with touch interfaces.\nThe Drag and Drop API is probably the oldest\
    \ feature in this book. It was first implemented in Internet Explorer 5 back 1999\
    \ (that is about 150 Internet years ago) and has been adopted by other browsers\
    \ for some time, although the effort to standardize it was only undertaken as\
    \ part of the HTML5 movement. Unfortunately, Drag and Drop shows some signs of\
    \ aging, being quite arcane and unintuitive for the screen.\nBy default the a\
    \ and img elements can be dragged around the (I'll get to other elements momentarily),\
    \ but you have to set up a drop zone, an area where the elements can be dragged.\
    \ A drop zone is created when you attach two events to an element: dragover and\
    \ drop. That's required of dragover to cancel its default behavior (for one of\
    \ the reasons I noted earlier, you don't need to worry about). All the work happens\
    \ with the drop event.\nThat may sound a little confusing, so this example shows\
    \ a very simple setup. The #target element has the dragover and drop event listeners\
    \ attached to it, the callback function of dragover prevents the default behavior\
    \ with preventDefault(), and the main action happens inside the callback function\
    \ of the drop event.\n\n```\nvar target = document.getElementById('target');\n\
    target.addEventListener('drag', function (e) {\n  e.preventDefault();\n}, false);\n\
    target.addEventListener('drop', function (e) {\n  // Do something\n}, false);\n\
    ```"
