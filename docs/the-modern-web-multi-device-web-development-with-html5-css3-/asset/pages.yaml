    # The DOMContentLoaded Event


    The old way to initiate scripts when a page had finished loading was to use the
    load event, but this method had the drawback of only firing after every resource—images,
    stylesheets, and so on—had fully loaded, which could sometimes lead to quite a
    delay. Developers then created a custom event, domready, which fires when the
    DOM has loaded before the resources.


    The domready event was quickly adopted by many JavaScript libraries; it began
    to be adopted natively in browsers as DOMContentLoaded; and it is now standardized
    in HTML5. DOMContentLoaded is fixed on the document object like so:


    ```

    document.addEventListener(''DOMContentLoaded'', function () { ... };, false);

    ```


    Notably, the behavior layer of the site can be initiated sooner, meaning the user
    can start exploring your site more quickly—especially over slow connections or
    for image-heavy pages that could take time to load. If you have scripts that want
    to run only when every resource has finished loading, you can continue to use
    load.


    # Input Events


    The massive rise in the number of devices with touch-enabled (whether, stylus,
    or sausage) input has meant the creation of a new series of events to cater to
    them. Although click events are still fired by touch input, simply relying on
    them is not sufficient, as there are major differences in the ways mouse- and
    touch-enabled devices operate. For example, when a user clicks his or her mouse
    button, a slight pause occurs as the browser waits to see if the action is a single
    or double click. This delay is small but noticeable on touch screens and makes
    them appear to be unresponsive.


    The W3C is currently considering two different input event models: Touch Events
    aimed squarely at touch input has been under active development for some time,
    and is already implemented in some browsers, but this model has been criticized
    in some quarters and may also fall of some existing patterns; Pointer Events is
    a new proposal for a unified input model that has been accepted for consideration
    by the W3C but not yet formally approved or implemented.


    Which—if either—model eventually becomes the standard remains to be seen, although
    indications are that Pointer Events is preferred. Given the uncertainty, I''ll
    briefly explain how each works.'
