    Likewise, you can easily use RDFa scheme:


    In my opinion, microdata''s flexibility will lead to being used by more and more.
    That, it''s not perfect for everything; some microformats, as Rel-Tag, are so
    concise and easy to use that there''s little point in replacing them


    # Schema.org


    One good reason for using microdata, and another reason I think it''s set to conquer
    microformats and RDFa, is that you might receive a nice advantage and get your
    content noticed and promoted by search engines and portals. In 2011 four big web
    giants—Google, Microsoft, Yahoo!, and Yandex—launched a new website, Schema.org,
    which introduced a set of shared vocabularies for marking common patterns using
    microdata.


    Those patterns include reviews, events, places, items, and objects, things that
    discussed frequently across the Web. To illustrate, say you are writing a book
    review on your website (I''ve chosen a book at random and given it an unbiased
    review):


    ```

