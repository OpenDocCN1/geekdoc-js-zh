  md: "| Datalist |\n| Gorilla, Eastern \n| Gorilla, Western |\n\nFigure 8-3: Auto-suggested\
    \ results from a datalist element\n\nThis association between the id and list\
    \ attributes means that multiple inputs can refer to the same datalist element,\
    \ if required.\nIn browsers that don't support datalist, the input box falls back\
    \ to a standard text input. Please keep this in mind if you require certain input\
    \ values from the user, and ensure you have contingencies in JavaScript and on\
    \ the server side.\n\n# On-Screen Controls and Widgets\n\nThe elements you've\
    \ seen so far are all based on a simple text box, but some elements also provide\
    \ richer on-screen controls; in HTML 4.01, for instance, think of select and checkbox.\
    \ But as I mentioned in the introduction, many other widget types are commonly\
    \ used by developers and designers—think of pickers and number sliders—so HTML\
    \ 5 has adopted and standardized these patterns.\n\nHow these controls and widgets\
    \ appear depends on the browser and platform in which they've been implemented;\
    \ the HTML 5 specification notes only that these controls could be used and isn't\
    \ prescriptive as to how they appear. If a browser doesn't support the controls\
    \ natively, they should fall back to look like a standard text input.\n\n# Numbers\n\
    \nThe new HTML 5 input types discussed so far already cover various text formats.\
    \ But, of course, many forms require the user enter a number, for instance, credit\
    \ card details, an area code, or a quantity.\n\nThe number input is the field\
    \ for inputting numbers. It is often displayed as a text field, but some browsers\
    \ also allow controls—often a pair of arrows, one up, one down—for incrementing\
    \ or decrementing the value.\n\nSimilar to number is the range input, which lets\
    \ users enter a value without requiring them to be too precise about the exact\
    \ figure; to allow this, many browsers style this element as a slider.\n\n```\n\
    <input type=\"number\">\n<input type=\"range\">\n```\n\nYou can compare number\
    \ and range as they're displayed in Chrome for Android in Figure 8-4."
