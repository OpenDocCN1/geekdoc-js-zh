    # Hello World!


    Figure 1-1: A Hello World message logged in the console in InFirebug


    If you''re still reading this, either you have all the knowledge required to proceed,
    or you''re getting ready to bluff your way through. Regardless, let''s move on
    to talk about technology.


    # Getting Our Terms Straight


    There''s some confusion over what HTML5 actually is. There''s what the public
    (and, for many of us, our clients) believe and what actually is. HTML5 is not
    a new platform that we use to build websites; it''s not a rich multimedia environment;
    it''s not a thing you enable to make your websites work across multiple devices.
    HTML5 is basically an attempt to evolve the Web to meet the demands of the way
    we use today, which has mutated dramatically from its earliest iteration as a
    simple network of linked documents.


    To the public at large, HTML5 has become a shortand for a series of related and
    complementary technologies, including CSS3, SVG, JavaScript APIs, and although
    some developers are happy to use this broader meaning, I don''t really like this
    conflation of all the technologies, so I''m happier with calling HTML5 the web
    platform. I prefer Bruce Lawson''s proposed term, New Exciting Web Technologies
    (NEWT), which is both a cool acronym and has a cute logo, but I have to admit
    that I''ve lost this battle, so the web platform is it.


    The web platform is to see how, take a look at http://platform.html5/ which lists
    all of the technologies that are considered part of the platform; the list is
    really quite impressive and contains more than I could ever cover in one book.


    Instead, I''ll concentrate on the core, the technologies I feel are sufficient
    and useful for authoring websites that work across multiple devices: HTML5, CSS3,
    SVG, Canvas, and some device APIs. I''ll explain each of these as I get to them
    throughout the course of the book, but first I want to clarify in more detail
    what is meant by HTML5 and CSS.


    # The Real HTML5


    HTML5 is an iteration of HTML4.01 with some new features, a few deprecated or
    removed features, and some modified behaviors of existing features. Its aim is
    to standardize the many common hacks and design patterns that developers have
    used throughout the Web, and expand in order to meet the demands of the modern
    Web, which is as much (if not more) about applications as it is about documents;
    indeed, the original proposal for what became HTML5 was called Web Applications
    1.0.'
