    therefore more useful—than dedicated Touch Events. Although not confirmed as I
    write, Pointer Events to be the specification that the W3C will develop. In the
    meantime, a number of community-built libraries exist to fill the functionality
    gap: among the multiples, the PointerEvents polyfill is the one to consider.


    # CSS Selectors in JavaScript


    Selecting elements from the DOM used to be a little problematic. You had getElementById()
    and getElementsByTagName(), but too often getting the elements you wanted involved
    a lot of DOM traversal or filtering. Libraries like jQuery (I get to this in "Pointer
    Events" on page 95) solved this problem with methods that allow CSS selectors
    as arguments:


    ```

    var foo = ''$(p.foo'');

    ```


    The obvious benefit this brings soon fed back into JavaScript through two new
    native methods: querySelector() and querySelectorAll(). Both work in a similar
    way, taking CSS selectors as arguments; the difference is that querySelector selects
    only the first matched element, so its result is a single node, whereas querySelectorAll()
    matches all instances of the element, so its result is returned as a NodeList.


    ```

    var foo = document.querySelector(''p.foo'');

    var foo = document.querySelectorAll(''p.foo'');

    ```


    In Figure 5-3 you can see the results of the different selectors logged in to
    the console: querySelector() is the first result, querySelectorAll() is the second.


    You can use any complex selector or series of selectors with these two methods;
    the only proviso is that they can be relative selectors—that is, they can''t begin
    with a combinator like > or +. This argument is, however, invalid:


    ![](img/c5e4d8671dcefe9f3888e6a849798773_112_0.png)


    > Figure 5-3: Comparing the results of querySelector() and querySelectorAll()


    ```

    var el = document.querySelectorAll(''+h2'');

    ```'
