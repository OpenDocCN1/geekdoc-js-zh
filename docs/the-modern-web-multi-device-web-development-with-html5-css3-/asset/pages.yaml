  md: '# Data Attributes


    A further way that HTML5 extends the meaning that elements have through the use
    of data attributes. These are user-defined attributes, the values of which are
    intended to provide information related to an element without giving any extra
    semantic meaning to either machines or humans. Let explain that in a little more
    detail.


    Say you want to output a set of data, each item of which has two values—a name
    and a number (a unique database ID, for example). You want the name to be shown
    in the document, but you also want to make the number available for running scripts.
    As it stands, no relevant attribute is available to store that information; you''d
    probably have to use a class:


    ```

    <p class="id-123">Peter</p>

    ```


    Data attributes were created for this reason: associating data. They let you store
    that information without implying any extra meaning, as a class does. Each data
    attribute starts with the word data— and then a user-unique key; for our example,
    we could use:


    ```

    <p data-id="123">Peter</p>

    ```


    The data id is now associated with the value Peter. Although it gives no extra
    semantic meaning to the element, the attribute is available to provide context
    to other processes: perhaps information about this data is in an associated JSON
    file, so you can use JavaScript to look it up.


    # The Data Attributes API


    So scripts can get this data more easily, simple DOM API is available that uses
    the dataset property. To get the value of a data attribute, use this property
    with the key of the attribute you''re querying:


    ```

    var el = document.querySelector(''p'');

    var id = el.dataset[''id''];

    ```


    Applied to this example markup, the returned result would be 123. You can also
    update attribute values with dataset:


    ```

    el.dataset[''id''] = 100;

    ```


    Here''s an example that shows this at work:


    ```

    var el = document.querySelector(''p'');

    console.log(''The ID is'',el.dataset[''id'']);

    el.dataset[''id''] = 100;

    console.log(''Now the ID is'',el.dataset[''id'']);

    ```'
