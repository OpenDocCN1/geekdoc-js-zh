  md: '# INTRODUCTION


    ![](img/c5e4d8671dcefe9f3888e6a849798773_17_0.png)


    We are in a time of unprecedented innovation on the Web. Not too long ago, one
    company, Microsoft, dominated the web landscape; in 2003, Internet Explorer was
    used on some 95 percent of computers worldwide.


    This domination brought the advantage of a stable market for developers, but there
    was also a serious drawback: Microsoft chose to end nonsensical work on IE, and
    innovation on the Web stagnant—a consequence of a lack of competition and a closed
    environment.


    Things could not be more different now. There are some four or five browser vendors,
    about the same number of major operating systems, and more parties are getting
    involved all the time. Adobe has switched its focus from Flash and apps to the
    open web, and technology companies like Samsung and Nintendo are joining key players
    such as Google, Apple, and Microsoft in shaping the future of the Web and the
    way we build for it.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'And the way we access the Web has changed enormously too—think devices. No
    longer are we limited to browsing the Web with a desktop or laptop. So many categories
    of devices exist now—including smartphones, tablets, and games consoles—that I''m
    running out of fingers to count them.


    This book is about front-end web development in this new webwhere era. It''s about
    learning methods to make first-class websites, apps, or anything built on web
    technologies, with the multi-device world aforesaid. This is not a book about
    how to make mobile websites or smart TV apps; it''s about learning the latest
    developments in current and near-future web technologies you''ll be better able
    to build sites capable of offering the best experience everywhere.


    I''ll return to what you''ll learn from this book in more detail at the end of
    the introduction, but first I want to talk about the bewildering array of today''s
    web-enabled devices.


    # The Device Landscape


    The year 2008 was a landmark year and not only because of the release of Indiana
    Jones and the Kingdom of the Crystal Skull, which introduced the phrase “nuking
    the fridge” into our vernacular. This was the year that saw many of Internet-connected
    devices exceed the number of people using them. This super-connectivity between
    devices is commonly known as the Internet of Things (IoT), and this book is aimed
    at an already substantial and fast-growing subset of those things, namely things
    with web browsers.


    The range of web-enabled devices is enormous and getting broader by the day. As
    I write this, I am the owner of the following devices that have a web browser:
    a desktop, a laptop, a tablet, a smartphone, an ebook reader, and a games console.
    I suspect that it''s not an uncommon scenario to affluent members of society;
    many people could add a smart TV and a portable games console to that list.


    Of course, with this incredible range of web-enabled devices comes incredible
    opportunity for web developers, and this book is here to help you make the most
    of that. But first, let''s look at some of the core device categories and define
    some key terms so you''ll better understand what you''re dealing with.


    # Desktop/Laptop


    The Web as we know it recently has primarily targeted the larger screens and more
    powerful processors of desktop or laptop computers (shorthand: desktops), where
    the operator is usually seated and using a fast Ethernet or Wi-Fi broadband connection.
    This mode is still the default for people at work in offices, so many business-to-business
    (B2B) sites are built to suit this configuration.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'But desktop computer use is on the waive as many people nowadays, especially
    home users, tend toward mobile or tablet devices (which I''ll come to shortly).
    In the last quarter of 2012, global PC shipments were down almost 5 percent from
    the previous year. That said, research shows that people still tend to use desktops
    when performing tasks that involve significant amounts of text, multitasking across
    different tabs of a browser, or using programs that require close control of the
    content, such as image editing. Chrome is also used when security is a major concern,
    such as for Internet banking.


    But even this venerable and mostly stable group variation abounds. The 1024×768
    screen resolution is slowly dying away but still prominent, newer versions of
    Apple''s MacBook Pro support a resolution of 2880×1800. Sites optimized for the
    former will look quite small and somewhat lost on the latter.


    The desktop browser world includes five players: Chrome, Safari, and Opera, which
    share the WebKit engine (Opera had its own engine, Presto, which is now being
    phased out); Firefox; Internet Explorer (version 9 can be considered semimodern
    and 10 fully modern). Frankly they all tend to implement features in a standard
    way, and they all have a frequent or semifrequent update cycle (or are moving
    toward it), so tend to get new features fairly quickly. Of course, a sizable percentage
    of users are still running older, capable browsers, so you should build with that
    in mind. (Much of the innovation in web standards to desktop browsers first because
    they''re the ones that developers tend to use on a daily basis. Therefore much
    of this book is written with desktop browsers in mind, although what you''ll learn
    can be applied anywhere.)


    # Mobile


    When I say mobile, I generally mean phones. The range is: from older, cheaper
    hardware running rudimentary web browsers to mid-range features optimized for
    speed power over high-powered expensive smartphones with browsers on par those
    with your main computer, as well as a series of apps that often use an embedded
    browser to view content.


    In many countries, the majority of Internet users are on a mobile device; in India,
    for example, 55 percent of web visits are made on mobile devices, and in Egypt
    nearly 70 percent of people rely on phones as their access to the Web. Worldwide
    estimates are that the number of mobile web users will exceed that of desktop
    computer users sometime between 2014 and 2015.


    Across the developing world, the dominant mobile device is the feature phone which
    functions beyond basic phoning and texting but lacks full web access. The rise
    of low-cost and secondhand smartphone sales, however, is already changing that
    market drastically. Within the next few years, we can expect to see smartphones
    dominate the mobile landscape. In 2011,'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'smartphones sales were estimated to account for 27 percent of the global market;
    at the end of 2012, estimates were that 1 billion smartphones were in use, with
    that number predicted to double by 2015.


    The sheer variety of mobiles and mobile browsers in the global market that I''m
    selective about the coverage in this book, so for future-proofing I target phones
    with fully capable web browsers, that is, features par with their desktop equivalents.


    The WebKit engine dominates the smartphone browser market because it''s used on
    iPhone, Android, Blackberry, and more, powering many different browsers. OS uses
    a slightly different version of WebKit, but interoperability is good.


    Windows Phone OS from version 7.5 and uses a mostly desktop-equivalent Internet
    Explorer as its browser; older models have IE9, and more recent models, IE10.
    Firefox is also available as an option for Android, and Firefox OS, a fully operating
    system around the browser, is to launch in 2013. That launch will well impact
    the market in the long term.


    Opera has a significant share in the global mobile browser market to Opera Mini,
    a proxy browser that compresses requested pages and returns the data as a kind
    of image with very limited interactivity. Opera Mini is lightweight and fast,
    which makes it popular in countries with limited Internet connectivity, but its
    lack of full interactivity means I won''t give it much attention. As I write this,
    Opera has announced that it''ll releasing new mobile browsers based on WebKit,
    although no details are available.


    Today''s smartphones, although getting more powerful all the time, have less memory
    and storage, and lower potential connection speeds, than desktop or laptop computers.
    On the surface, this would seem to make them the poor cousin of web-enabled devices,
    but as Jonathan Stark says in "The 10 Principles of Mobile Interface Design":


    Smartphones are actually more powerful than desktops in many ways. They are highly
    personal, always, always with us, usually connected, and directly addressable.
    Thus, they are crawling with powerful sensors that can detect location, acceleration,
    orientation, proximity, environmental conditions, and more.


    Obviously the advantage of mobile is just that: its mobility—the ability to find
    things around you, gets directions, and look up information fast out of the house
    or office. But increasingly, mobile devices are being used at home while watching
    TV or on the morning commute or when bored standing in line. Mobile is really
    less about being on the move and more about being available.


    The mobile space is changing faster than any sector of the market, as many users
    change devices on 12- 18-month update cycles and hundreds (if not thousands) of
    new models are introduced every year.'
