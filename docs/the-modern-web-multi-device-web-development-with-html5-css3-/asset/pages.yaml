  md: "If the user has interacted with the seek bar and the media is in the process\
    \ of moving to a new position to resume playback, the seeking property returns\
    \ true. You can get the duration of the media with the duration property that\
    \ playback begins with initialTime; both return a value in seconds.\n\nAs an example\
    \ of what you can use these timing properties, take a look at the following code.\
    \ In it, I defined the video element and a progress element for measuring the\
    \ progress through the video file. What I want to do is change the value of the\
    \ progress bar to measure the progress through the video; this rate is determined\
    \ by dividing the currentTime value by the duration.\n\nTo make this work, I rely\
    \ on the new timeupdate event. I explain this more fully in \"Media Events\" on\
    \ page 173; for now, you just need to know that the event is fired when the current\
    \ time of the media file changes, such as when the file is being played. When\
    \ it fires, the progress bar is updated to show the current progression. You can\
    \ try this yourself in the file media-progress.html, shown in Figure 9-5.\n\n\
    ```\nvar progress = document.querySelector('progress');\nvideo = document.querySelector('video');\n\
    video.addEventListener('timeupdate', function () {\n  progress.value = video.currentTime\
    \ / video.duration;\n}, false);\n```\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_187_0.png)\n\
    \nFigure 9-5: A progress bar using Media Elements API timing properties\n\nYou\
    \ can get or set the volume with the volume property, the value of which is a\
    \ number between 0 and 1. This property is useful if combined with a range element\
    \ to create a custom control, as in the following code example. When the range\
    \ element changes value, the change event fires updates the volume"
  merge: -1
  pgno: 187
- img_proc: true
  md: "property with the current value divided by 100 (to match the scale of the volume).\
    \ You can try this for yourself in the file media-volume.html and see it in Figure\
    \ 9-6:\n\n```\nvar video = document.querySelector('video');\nvar volume = document.getElementById('range');\n\
    volume.addEventListener('change', function (e) {\n  video.volume = e.currentTarget.value\
    \ / 100;\n}, false);\n```\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_188_0.png)\n\
    \nFigure 9-6: The range element controls the video's volume. With this, the video\
    \ now has basic controls made using HTML elements and the Media Elements API.\n\
    \nThe previous three code examples show how easily you can build custom media\
    \ controls using HTML5 forms and UI elements; with a little extra work, you can\
    \ replicate all of the basic media UI functionality and even further to create\
    \ tailor-made interfaces on your websites.\n\n# Network and Ready States\n\nMedia\
    \ files tend to be large and don't load all at once. Knowing a couple of things\
    \ about them is useful: their current loading state and readiness to be played.\n\
    \nYou can learn the first part using the networkState property, which has four\
    \ values: 0 means there is no data yet, 1 means the media is idle, 2 means the\
    \ media is loading, and 3 means the media has loaded. You might use this property\
    \ to add an on-screen indicator while the media is loading:\n\n```\nif (video.networkState\
    \ === 2) { ... }\n```"
