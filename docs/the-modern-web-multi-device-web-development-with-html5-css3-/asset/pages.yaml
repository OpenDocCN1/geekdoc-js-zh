- img_proc: true
  md: 'Maybe you can already see the problem. As you know, the CSS box model makes
    padding, borders, and margins extra to the content''s dimensions, so now these
    elements have a combined width of 100 percent, plus 40px, making them wider than
    their container.


    A further problem when using widths is nesting elements leads to some pretty weird
    numbers. For example, imagine you have an element want to be 85 percent of the
    viewport, and inside there''s a child element want to be 55 percent of the viewport.
    Unfortunately, as percentages are relative, you can''t set the width to 55 percent;
    you have to calculate 55 percent of 85 percent, which gives you:


    ```

    E { width: 85%; }

    F { width: 64.70588%; };

    ```


    Note that I stopped after the fifth decimal place. Working in this way can involve
    a lot of calculations, and what''s even worse is the various browsers render these
    numbers up or down in different ways, so pixel perfect cannot be guaranteed.


    This drawback might be enough to put you off of working responsively, but a few
    features in CSS3 should help eliminate these problems.


    # The box-sizing Property


    You can, to some degree, work around the mixing problem that I just mentioned
    by using the CSS box-sizing property. To explain, let me recap the current code
    example: I have three columns with a 20px gap between them, meaning the total
    width is greater than that of their parent, causing them to overflow:


    ```

    E, G { width: 25%; }

    F {

    padding: 20px;

    width: 50%;

    }

    ```


    With box-sizing, you can change the boundary from where the width is measured—so
    the stated width includes the border and the padding. In this example, I can change
    element F so its width includes the padding, using the border-box value for box-sizing:


    ```

    F {

    box-sizing: border-box;

    padding: 20px;

    width: 50%;

    }

    ```


    Now the entire element F, including the padding, is 50 percent wide, so the combined
    width of the elements is 100 percent again, making them nearly inside their container.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'Some people find box-sizing handy that they advocate applying it to every element,
    using the universal selector:


    ```

    * { box-sizing: border-box; }

    ```


    I think this is overkill and could cause unwanted difficulties, so my preferred
    approach is to apply it only where it''s actually required:


    ```

    div, .etc { box-sizing: border-box; }

    ```


    Using box-sizing does have its limitations, however; for one, it doesn''t affect
    margins at all. To accommodate that, having some way to perform dynamic calculations
    on length values instead would be better.


    # Dynamic Calculations on Length Values


    When mixing units, a new value function eliminates all of the problems mentioned
    in the previous section. This function is called calc(); and with, you can perform
    simple calculations using any numbered length units. At its simplest, the argument
    supplied to the function would be two figures and a mathematical operator:


    ```

    E { height: calc(10px + 10px); }

    ```


    For a more practical illustration of what it can do, let''s return again to the
    simple three-column example. Say now you want to have a 4px border on the left
    and right sides of the central column as well as the 10px padding and 20px margin.
    You could use box-sizing to cover the border and padding, as before, but this
    time also use the calc() function to subtract the left and right margins from
    the width:


    ```

    F {

    border: 4px solid black;

    border-width: 0px;

    box-sizing: border-box;

    margin: 20px;

    padding: 0px;

    width: calc(50% - 40px);

    }

    ```


    You could, instead of box-sizing, use further calc() values to set the width and
    even mix up the values a little more using different length units. In the following
    example, I use em units for the margin and then an extra calc() function to calculate
    the combined border, padding, and margin values, before subtracting them all from
    the total:


    ```

    F {

    border: 4px solid black;

    border-width: 0px;

    }

    ```'
  merge: -1
