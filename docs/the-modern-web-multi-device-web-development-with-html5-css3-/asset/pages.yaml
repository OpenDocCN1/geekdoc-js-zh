  md: '# Orientation


    The Orientation API detects changes to the device''s position in 3-D space—that
    is, movement up and down, left and right, and clockwise and counter-clockwise.
    This movement is measured with an accelerometer, and the devices that are most
    likely to contain one are those that are most portable; mobile phones and tablets
    move frequently so are very likely to have one, laptops move to some degree may
    contain one, and desktops and TVs move so infrequently that it''s very unlikely
    they''ll have an accelerometer or access to this API.


    Using orientation events opens up new possibilities for interaction and navigation;
    some apps already provide an option to control page scrolling by tilting the device
    forward or backward, and navigation between tiles or pages by tilting the device
    to the left or right.


    Before detailing the API, I should talk about three-dimensional axes (you can
    skip this paragraph if you already about them). All movement in dimensions has
    three directions, or axes, commonly referred as x, y, and z. If you hold a device
    in front of you (or imagine you are doing), the x-axis runs from left to right,
    from top to bottom, and z towards you and away from you, as shown in Figure 6-3.
    Movement is measured along these axes from the center of the device and is either
    positive or negative: Bringing the device closer to you moves it positively along
    the z-axis and away it negatively. Lowering the device toward your feet moves
    it negatively along the y-axis and moving it to your right moves it positively
    along the x-axis.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_126_0.png)


    Figure 6-3: Movement along the three-dimensional axes [This image is taken from
    the Mozilla Developer Network [MDN]; “Orientation and Motion Data Explained”:
    http://developer.mozilla.org/en-US/docs/DOM/Orientation_and_Motion_data_explained/;
    It is used under a Creative license.


    To detect movement along each axis, use the deviceorientation event on the window
    object. This event fires every time the device moves and returns an object with
    a series of useful orientation properties:


    ```

    window.addEventListener(''deviceorientation'', function (orientData) {

    }, false);

    ```'
