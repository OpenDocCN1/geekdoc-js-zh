    Browsers that have native validation alerts create their own messages that appear
    on screen; for example, submitting an input that has the required attribute displayed
    the message "Please fill in this field" in Firefox. The validationMessage property
    holds this message when the field is in an invalid state; if the value of the
    field is valid, the validationMessage is an empty string.


    You can set the message using the setCustomValidity() method, which also allows
    you to set a custom validation rule. For example, in the following code, I have
    two input types, referred to as telHome and telWork, and I want to ensure that
    the two values are different. To do this, I add an input listener on telWork,
    and each time the user types in this field, the rule checks if the value is the
    same as telHome, and if it is, a custom validation message is created:


    ```

    var telHome = document.getElementById(''tel-home'');

    telWork = document.getElementById(''tel-work'');

    telWork.addEventListener(''input'', function (e) {

    if (e.currentTarget.value === telHome.value) {

    telWork.setCustomValidity("Must be different");

    } else {

    telWork.setCustomValidity('''');

    }

    }, false);

    ```


    Take a look at customvalidation.html to see this in action; you can see the result
    in Figure 8-15.


