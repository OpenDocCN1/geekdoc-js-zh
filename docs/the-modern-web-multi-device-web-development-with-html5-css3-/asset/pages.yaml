  md: "```\n<video>\n  <source src=\"foo.ogg\" type=\"video/ogg\"></source>\n  <source\
    \ src=\"foo.webm\" type=\"video/webm\"></source>\n  <source src=\"foo.mp4\" type=\"\
    video/mp4\"></source>\n</video>\n```\n\nThe example file media-elements.html demonstrates\
    \ this feature; the file appears to be the same as media-elements.html, but unlike\
    \ first example, it shouldn't matter which browser you use to open this file.\
    \ As long as the browser supports HTML5 video, one of the provided source files\
    \ should play.\n\nNotice that I included the attribute, which contains the MIME\
    \ type of the different formats and lets the browser know which type of file it\
    \ should play without having to access the file. This isn't required, but including\
    \ it is considered good practice (although some older browsers used to have trouble\
    \ with the type attribute). As always, to see if it causes any problems.\n\nThe\
    \ source element has a media attribute, which takes a media query value (see Chapter\
    \ 3), meaning the specified file is used only if the query returns true—handy\
    \ for supplying different files to different devices. Most likely won't want a\
    \ 1920x1080 video file to a 480x320 screen, or vice versa. The following code\
    \ example sets a different source file, foo-hd.ogg, if the screen is at 1920px\
    \ wide and an aspect ratio of 16/9:\n\n```\n<video>\n  <source src=\"foo-hd.ogg\"\
    \ media=\"device-aspect-ratio: 16/9\" and (min-device-width:1920px)\"></source>\n\
    \  <source src=\"foo.ogg\"></source>\n</video>\n```\n\nThe real utility of this\
    \ attribute has been debated; feel a better solution is to use JavaScript to adapt\
    \ the quality of the video, depending on device resolution and network status,\
    \ and a spec is being proposed to handle this. For the near future, however, the\
    \ media attribute is the best approach to adaptive video.\n\n# Fallbacks\n\nYou\
    \ should provide some kind of fallback if a user’s browser doesn't support the\
    \ media elements, so the user doesn't just see empty space on the page. Anything\
    \ inside the video element is displayed when the video is not present, so the\
    \ fallback can be as simple as a line of text that explains the problem or an\
    \ image showing a key frame as an alternative.\n\n```\n<video src=\"foo.ogg\"\
    >\n  <img src=\"foo.png\">\n</video>\n```"
