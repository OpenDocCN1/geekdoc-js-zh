  md: "What this means in practice is using media queries to change content,\nnot\
    \ when an arbitrary device size has been reached, but when that content\ncomes\
    \ awkward. To illustrate what I mean, imagine I have a stylesheet\napplied to\
    \ viewports using a media query:\n\n```\n<link rel=\"stylesheet\" href=\"foo.css\"\
    \ media=\"screen and (min-width: 1000px)\">\n```\n\nAnd within that stylesheet\
    \ sets the width of an article element to be\nsome 60 percent of the viewport's\
    \ width and a font to be 120 percent of\nthe root:\n\n```\narticle { width: 60vw;\n\
    article p { font-size: 1.2rem; }\n```\n\nMany studies have shown that for optimal\
    \ readability the maximum\nnumber of characters in a line of text is between 45\
    \ and 75, with 66 con-\nsidered ideal, but if the user has a device with a very\
    \ large viewport,\nt width of 60vw may lead to lines of text that could double\
    \ that.\nUsing the theory of content breakpoints, you may want to add an extra\n\
    rule within the larger device stylesheet to make the text larger on much\nwider\
    \ devices to restore some of the readability:\n\n```\n@media screen (min-width:\
    \ 1200px) {\np p { font-size: 1.4rem; }\n```\n\nWorking in this way isn't going\
    \ to be easy—quite the opposite, in fact.\nYou will have to perform a lot of testing\
    \ and analysis and make decisions\n on best practice and instinct. Some people,\
    \ such as Thierry Koblentz\nh his article \"Device-Agnostic Approach to Responsive\
    \ Web Design,\" have\n advocating using content breakpoints solely and not considering\
    \ devices at:\n\n> If we consider that content is king, then it makes sense to\
    \ look at\nit as the corner stone of the solution. In other words, we should\n\
    set-breakpoints according to content instead of devices.\n\nMy opinion is that\
    \ a combination of the two serves best. As always,\nexperiment and find your own\
    \ system.\n\n# Responsive Design and Replaced Objects\n\nOne striking point I\
    \ haven't yet addressed is when you have objects on a\npage—notably images, but\
    \ also plug-ins like video and Flash. You can't do\nmuch with the latter (especially\
    \ as Flash won't be supported on most of your\nusers' mobile devices anyways),\
    \ but images present a unique set of obstacles\nto building responsively, which\
    \ I'll come to shortly."
