- img_proc: true
  md: 'Note that these attributes set the size of the video element, not the video
    itself, so if the values you supply aren''t in the same ratio as the file, the
    video won''t be stretched to fill the space; it maintains its aspect ratio and
    position in the center of the element, as you can see in video-dimensions.html(and
    in Figure 9-2). If you prefer to change this behavior, use the object-fit and
    object-position properties from Chapter 3.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_180_0.png)


    Figure 9-2: The video file won''t lose its aspect ratio when the video element
    is resized.


    The video element is blank or uses a platform-specific graphic by default, until
    the first frame of the video has loaded, at point that frame is displayed as a
    still image. If you prefer a different style or image entirely, you can specify
    your own with the poster attribute:


    ```

    <video src="foo.ogg" poster="foo.png"></video>

    ```


    # Multiple Source Files


    In the examples I''ve shown so far, I''m using the .ogv extension for video files
    and .ogg for audio files, which are extensions of the Ogg format. Ogg is a container
    format, which means it can hold different video and audio formats within it; for
    Ogg video, the most common format is Theora, and for audio, Vorbis.


    Both Theora and Vorbis are free formats—that is, no licensing fees are involved
    in using them. This fact would seem to make them ideal for Web use, and indeed,
    some sites like Wikimedia do encode their media with them. They''re not supported
    in many browsers, for reasons I explain in “Format Wars” on page 166. So what
    can you do?


    Both audio and video elements have provisions for specifying multiple source files.
    You leave out the src attribute and use source child elements instead. In the
    following example, I set two source files for a video element: the first is an
    .ogv file; the second, a .webm file; and the third, a .mp4 file. The browser plays
    the first video format that it supports.'
  merge: -1
