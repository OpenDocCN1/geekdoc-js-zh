  md: 'The implementation device varies across browsers, with mobile and tablet devices
    varying quite significantly from desktop and laptop browsers. You can see some
    examples of this variety in Figure 8-5.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_165_0.png)


    HTML5 also has several of other date and time inputs: If you need to be more general
    about dates, you can use month to select an entire month and week for an entire
    week; or if you require a time without any associated date, you can use time to
    choose hours and minutes. A couple of different time and date pickers are shown
    in Figure 8-6.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_165_1.png)


    If you require a date and time, the datetime input requires both. This field requires
    a value in the format YYYY-MM-DDTHH:MMZ, where the Z is a shorthand for the UTC
    time zone. For example, to submit a time of 2 PM on April 1st, 2014, you would
    use 2014-04-01T14:00Z. If the time zone isn''t required, you can use datetime-local.
    For both cases, the picker widget would have fields for date and time, as shown
    in Figure 8-7.


    All the date-related inputs are demoed in input-types.html; open the page in different
    browsers and see how they''re displayed. As with number input, the max and min
    attributes are permitted, but they must use a valid date or time format; a full
    datetime would require YYYY-MM-DDTHH:MM, whereas the month would require only
    YYYY-MM. The step attribute is also allowed, but its time period depends on the
    element used: a day, a week, a month, or a time in seconds.'
