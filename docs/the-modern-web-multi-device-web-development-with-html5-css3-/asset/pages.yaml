- img_proc: true
  md: "The Reason this solution is more useful is that you can combine @viewport with\
    \ media queries to have different viewport parameters, depending on the viewing\
    \ device. Consider this example:\n\n```\n@media screen and (max-width: 480px)\
    \ {\n@viewport {\n  width: 480px;\n}\n}\n@media screen and (min-width: 481px)\
    \ {\n@viewport {\n  width: device-width;\n}\n```\n\nFor screens with a 480px width\
    \ or lower, the viewport will be displayed at 480px, and on larger screens, it\
    \ will adapt. This approach is known as device adaptation and has the advantage\
    \ of making changes much easier by requiring the modification of only a single\
    \ CSS rule, rather than an unknown number of individual pages.\n\n# Input Mechanism\
    \ Media Features\n\nAlthough I've talked a lot about the dimensions and resolution\
    \ of screens, I have to cover other key factors as well; for instance, the ways\
    \ in which a user interacts with the device is just as important. The mouse and\
    \ keyboard pairing being the dominant input mechanism for many years, the new\
    \ device landscape accommodates not only that but also touch, stylus, and voice—and\
    \ who knows what else in the future.\n\nIn recognition of the variety of input\
    \ mechanisms, two new media features were proposed in the Media Queries Level\
    \ 4 specification. They allow you to define style rules sympathetic to the way\
    \ users interact with your pages.\n\nThe first of these is the pointer feature,\
    \ which has three available parameters: Of Today's most common input mechanisms,\
    \ a device with keyboard or voice has no pointer, so is classed as none; finger-based\
    \ touch screens like a tablet or smartphone are most likely classed as coarse\
    \ and a mouse or stylus, which provides very close control, is classed as fine.\n\
    \nThat being the case, here's an example extra padding to link elements on screens\
    \ viewed using touch-screen (or other less precise) devices:\n\n```\n@media screen\
    \ and (pointer: coarse) {\n{ padding: 1em; }\n}\n```\n\nOne unique feature to\
    \ devices with mouse input is the hover state, which detects when an on-screen\
    \ pointer is positioned above an element. Obviously, this feature doesn't exist\
    \ for touch or voice input. To address"
