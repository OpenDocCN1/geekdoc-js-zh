  md: "New features in HTML5 include ways to structure documents providing meaning\
    \ and accessibility; I cover this in Chapter 2. HTML5 also has a wide range of\
    \ new functionality and UI controls that make it easier to build applications,\
    \ we'll look at in Chapter 8. HTML5 includes many people still associate with\
    \ it—native (with plug-ins) video, which is covered in Chapter 9.\n\nTwo main\
    \ groups are working on HTML5, and their roles and responsibilities are broadly\
    \ this: The WHATWG (you don't need to know what acronym names mean), a consortium\
    \ of browser makers and “interested parties,” through the main editor Ian Hickson,\
    \ a “living spec” of HTML—basically a worthless specification that constantly\
    \ incorporates new features and updates existing ones; and the W3C (World Wide\
    \ Web Consortium), the Web’s stands body, snapshots of this spec to create never\
    \ versions, ensuring compatibility of implementation by the browser vendors.\n\
    \nThe situation is in, a bit more complex than that and political warring is going\
    \ on, but that's of interest to standards works and shouldn't make any practical\
    \ difference to you.\n\nThe W3C has proposed, although not confirmed as I write\
    \ this, that HTML5 (the W3C snapshot) be to Recommendation status—that is, “done”—by\
    \ 2014, with HTML5 to follow in 2016. HTML5 would also be broken into separate\
    \ modules rather than a single monolithic spec, so work can progress on different\
    \ aspects without delaying the whole. These dates don't really matter to you,\
    \ however; all you need to know when HTML5 is in browsers and readers to use.\n\
    \n# The HTML5 Template\n\nAs someone with basic knowledge of HTML, you're familiar\
