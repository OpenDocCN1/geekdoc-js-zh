  md: '# Chapter 7: Images and Graphics


    You can find a great introduction to SVG via the SVG Basics website: http://www.svgbasicscom/,
    and the W3C''s own SVG Primer is a useful way to dig deeper: http://www.w3.org/Graphics/SVG/IG/resources/svgprimer.html.
