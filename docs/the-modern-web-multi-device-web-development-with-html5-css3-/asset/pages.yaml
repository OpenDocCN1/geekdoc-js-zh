  md: '# A Quick Note About Terminology


    Throughout the book, I refer quite often to building websites or sites, but this
    terminology is just convenient shorthand to avoid repetition. The features you
    will learn from this book are relevant to websites, web applications, packaged
    HTML hybrid applications—in short, anything that can use HTML, CSS, and JavaScript.
    But that''s a mouthful, so I mostly just say "websites," except when I need to
    be more specific.

    I also use "browsers" and "user agents" interchangeably when I mean is any instance
    of software that renders web pages or applications. Again, I''m just trying to
    avoid repetition. Once more, I''m trying to avoid repetition.


    # Who You Are and What You Need to Know


    Before I begin, I''ll explain some of the presumptions I''m making about and tell
    you what you need to know to get the most out of this book. First, let''s talk
    about you. Whether you''re a professional, like to be, or you''re just someone
    who enjoys playing around with the Web, you have a working knowledge of HTML,
    CSS, and JavaScript—not to any intimate, level, but enough that you don''t need
    me to tell you what they are or how to write them.


    Perhaps you learned to build websites a while ago and need to bring your skills
    up to date; maybe you''re learning web development at school and want extra lessons;
    or perhaps you''re a working developer but doesn''t get the opportunity to keep
    up with developments in coding for the Web. Whether any of those descriptions
    fit, I assume you want to get involved building websites in a modern way, which
    work across multiple devices and are sympathetic to the dimensions and capabilities
    of each device—that doubtless you picked up a book with this.


    This book builds on your knowledge of web development. It''s not a beginner''s
    guide, but it''s not an advanced book either. Rather, this book is a snapshot
    of current, and near-future features in HTML, CSS, JavaScript, and related technologies,
    with a bias towards those that are best for building sites in the multi-device
    world.


    As well as basic knowledge, you need to know your way around the developer tools
    in your browser, although not in your power-user kind of. In some of your JavaScript
    examples, I log results into a tool''s console; this is a standardized method
    of working and is the same if you use the native tools in Chrome, Firefox, IE9+,
    Opera, Safari, or third-party tools like Firebug. I, for example, use a line of
    code like:


    ```

    console.log(''Hello World'');

    ```


    And the result will be shown in the console; Figure 1-1 shows how this is displayed
    in Firebug. As I said, I won''t use the console or developer tools much, but if
    you don''t know how to use them, you should really take the time to learn now.'
