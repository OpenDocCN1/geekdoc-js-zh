  md: '# 10

    WEB APPS


    ![](img/c5e4d8671dcefe9f3888e6a849798773_193_0.png)


    So far, most of this book has been about web technologies that can be used anywhere,
    from open websites to device-specific web apps. In this chapter, I''ll take a
    short detour to talk about the extra steps required to create applications—how
    you can adapt your site to make it available through an online application store,
    or even to make it installable on a device.


    Before moving on to talk the mechanics of creating applications, we should start
    by defining the core types:


    +   - Native apps are built using non–web technologies for specific platforms
    such as OS X, iOS, Windows, and Android.

    - Web apps use web platform languages and can include hosted websites or ones
    packaged inside compressed containers and installed on a device.

    - Hybrid apps use web platform technologies but are wrapped or packaged inside
    native containers.'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'In this chapter, I''ll look specifically at the latter two types, web apps
    and hybrid apps, and how to make them available through some of the many application
    stores. But even that''s not as simple as it sounds: Many rival platforms and
    stores exist, each has a different development platform and submission process,
    and there isn''t a single standard way of defining an app (although there are
    a number of proposals to do so).


    The good news is that many new app stores recognize the benefit of using web platform
    technologies to attract developers: huge time and money savings from having to
    create an app multiple times in a different programming language for every platform.
    Many vendors, including Microsoft (Windows 8), Samsung (Smart TV), and Opera (Opera
    TV Store), use web platform technologies to power their apps. Although not quite
    a case of once, run everywhere (though you still have to consider each device''s
    unique APIs, and levels of browser support), developing a web app can be much
    more efficient than developing multi-platform native apps in both Java for Android
    and Objective-C for iOS.


    In addition to discussing the methods of building apps, I''ll also look at ways
    to manage resources offline and how to store them on a user''s device when a network
    connection isn''t available (something that''s still pretty common in today''s
    wireless age). You accomplish this through the application cache (commonly known
    as AppCache), although powerful is not without its pitfalls.


    # Web Apps


    I''ll begin by looking at web apps, that apps built entirely using web platform
    technologies. Although called web apps, they don''t necessarily have to exist
    on the open Web; they can also be packaged and distributed through online stores
    for download onto devices. There are, of course, many online stores, I''ll look
    specifically at two with the lowest barriers to entry: the Chrome Web Store, which
    has been around for a few years, and the newer Firefox Marketplace. While both
    are created by browser vendors, the difference between them is that the Chrome
    Web Store works only on the Chrome browser, whereas the Firefox Marketplace is
    aimed at creating an open standard that any browser can use.


    # Hosted vs. Packaged Apps


    Before moving on to look at the different app store requirements, let''s take
    a few minutes to define two subdivisions of web apps: *hosted and packaged*. Although
    most web app stores accept submissions of either, each type of app has certain
    advantages or disadvantages (largely around restrictions or permissions to core
    device functions), which are useful to know about advance to help you choose the
    right approach to building your app.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Hosted Web Apps


    Hosted app is one that holds all files on an external web server, usually accessible
    via a public URL. Essentially, a hosted app is like a website with a little extra
    metadata to allow app stores to index it. A hosted app isn''t installed onto a
    device; a shortcut is created on the device that launches a browser or embedded
    view when the user decides to open the app.


    Hosting a web app has the advantage of allowing you, the developer, to make updates
    without requiring reauthorization from a store, but the flip side is that the
    security risk is higher (an evil developer could smuggle in compromising code),
    so hosted apps generally don''t get access to restricted APIs.


    # Packaged Web Apps


    Unlike apps, a packaged app contains all the assets necessary to run it, compressed
    (usually zipped) in a single file. All the files are installed on the device,
    and although the app can connect to external web services, a connection isn''t
    always required. Packaging an app in this way means the store owner review and
    authorize the app contents and grant extra permissions if the app is found to
    be secure; in practice, the developer can access restricted APIs on the device,
    such as those used to access the address book or text messaging functions.


    Packaged apps open and start more quickly than hosted ones all their files are
    on the user''s device, so they''re less dependent on network capabilities. But
    packaged developers need to be sure to store data locally and allow it to be synced
    to the data server online, which requires more development work. To help with
    this, you can use local storage (discussed in Chapter 6), but for more extensive
    offline access options, which you want to use AppCache, which I cover in “Application
    Cache” on page 185.


    # Manifest Files


    Regardless of whether an app is hosted or packaged, every app designed for an
    app marketplace has to contain some data that''s formatted or presented in a specific
    order to identify it as an app that belongs to a particular store. This process
    involves no more than filling in a few required fields and adding an icon to the
    target device, both of which are contained in a manifest file.


    The manifest file is a simple XML or JSON text file hosted somewhere in the folder
    that holds your site assets. It contains key information about the app, including
    its name and description, although the required information varies slightly between
    stores, as I explain in the following sections.


    # The Chrome Web Store


    When hosted by the Chrome Web Store, the manifest file must be JSON-formatted,
    named manifest.json, and stored in a folder called myapp in'
  merge: -1
  pgno: 195
