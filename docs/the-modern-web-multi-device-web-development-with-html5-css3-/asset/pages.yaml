  md: 'Now, I''m sure it doesn''t take much imagination on your part to see how the
    width feature could be useful: You could use smaller text on smaller screens and
    larger text on larger screens, for example:


    ```

    @media screen and (max-width: 480px) {

    h1 { font-size: 2em; }

    @media screen and (min-width: 481px) {

    h1 { font-size: 3.6em; }

    }

    ```


    The queries I''ve used here are just for illustration. You can approach this in
    a better way, which I cover in "Mobile First and Content Breakpoints" on page
    57.


    If you''re sure you want to work with the dimensions of the device, not those
    of the viewport, you can use the device-width and device-height features—although,
    before, I think this is a more commonly used than height, so I''ll concentrate
    on the former. The way you use the device-width feature is, for all practical
    purposes, the same as the width feature—only the metric responds to different.
    As with width, device-width can be extended with max- and min- prefixes:


    ```

    @media screen and (max-width: 799px) { ... }

    @media screen and (device-width: 800px) { ... }

    @media screen and (min-width: 801px) { ... }

    ```


    Another way to serve rules depends on the device''s or viewport''s aspect ratio.
    The aspect ratio is the ratio of width to height (or device-width to device-height);
    a 1024x768 monitor, for example, has an aspect ratio of 4/3—that is, four horizontal
    pixels to every three vertical pixels—which is common for older screens. Wider
    screens (such as the iPhone 5) tend to use a 16/9 ratio.


    I discuss further in "A Quick Digression: All About Pixels" on page 45.


    To target a screen with a 4/3 aspect ratio, you''d use the device-aspect-ratio
    feature:


    ```

    @media screen and (device-aspect-ratio: 4/3) { ... }

    ```


    The max- and min- prefixes apply to these features as well, to create a query
    where you wanted to target only viewports—not devices—which are currently in at
    least an 8/5 ratio, you''d use the min-aspect-ratio feature:


    ```

    @media screen and (min-aspect-ratio: 8/5) { ... }

    ```'
