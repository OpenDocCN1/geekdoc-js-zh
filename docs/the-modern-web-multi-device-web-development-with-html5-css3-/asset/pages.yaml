    # Modernizr


    Browser support for experimental features, whether HTML, CSS, or JavaScript, can
    be quite variable, and providing fallbacks if a feature isn''t in a user''s browser
    is not always easy. Modernizr, runs a series of tests for features you define
    and returns a result of true or false, addresses this problem.


    Modernizr can be used in two principal ways: the first is to check whether Flexbox
    properties are available in the user''s browser. First, you build a custom version
    of Modernizr with the build tool, being sure to click the flexbox option and include
    a link to the generated file in the head of your document. When the document has
    finished loading, a class of either flexbox or no-flexbox (depending on whether
    it''s available) is added to the html element.


    That class could then be used to style the page depending on the Flexbox support;
    for example, you might have something like this, which makes an element display
    as a block by default but as a flex container for supporting browsers:


    ```

    .foo { display: block; }

    .flexbox { display: flex; }

    ```


    The second use of Modernizr is for conditional JavaScript. Each test you run creates
    a property for the Modernizr object, which has a true or false value for use with
    conditional functions; in this example, the code inside the curly brackets executes
    if Flexbox is supported:


    ```

    if(Modernizr.flexbox) { ... }

    ```


    If you want to extend it to external resources, you can use the Modernizr.load()
    method, which may look somewhat familiar if you''ve been paying attention so far:


    ```

    Modernizr.load({

    test: Modernizr.flexbox,

    nope: ''foo.js''

    });

    ```'
