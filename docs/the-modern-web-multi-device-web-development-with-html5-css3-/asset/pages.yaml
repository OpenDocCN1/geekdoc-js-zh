  md: "# WARNING Remember this suggestion is only the most prominent as I write this;\
    \ it may not be the final syntax.\n\nSo this syntax allows for testing device\
    \ resolution, but what about media queries? You can add that with further source\
    \ elements:\n\n```\n<picture alt=\"Description of image subject\">\n  <source\
    \ src=\"small.jpg 1x, small-hi-res.jpg 2x\">\n  <source media=\"min-width: 481px\"\
    \ srcset=\"med.jpg 1x, med-hi-res.jpg 2x\">\n  <img src=\"small.jpg\" alt=\"Description\
    \ of image subject\">\n</picture>\n```\n\nIn this example, you can see an extra\
    \ source element using the media attribute to set up media query and serving a\
    \ different set of images if that query is true. I have to say that although this\
    \ syntax works, I don't like it much; it's repetitive for a start and, used on\
    \ a page with multiple images, leads to maintainability issues. Said, no other\
    \ simpler suggestion has been proposed.\n\nThe WHATWG's current proposal is to\
    \ use the srcset attribute, but only on the img element. This option allows images\
    \ to be served dependent on screen resolution, but without any other media query.\
    \ I want to make this clear: This is not \"official,\" only a proposal.\n\nPlenty\
    \ of third-party solutions have been created, notable Matt Wilcox's Adaptive Images,\
    \ which use PHP and Azure to resize images on the server and serve them to users\
    \ depending on their device's attributes. While this option works well, does it\
    \ depend on a specific server configuration that isn't available to everyone and\
    \ also adds a reliance on JavaScript. This problem still waits to be solved naively.\n\
    \n# Summary\n\nI've covered a lot of ground in this chapter, discussing media\
    \ queries, device resolution, the difference between physical and virtual pixels,\
    \ responsive web design, and the problem with responsive images. If you're working\
    \ cross-device, this information should be useful at least, critical at most.\n\
    \nWhat I haven't discussed in great detail is how to actually create your page\
    \ layout—the way to present content at its best. A lot of work has been done in\
    \ this area in recent years, and in the next chapter, I will talk about.\n\n#\
    \ Further Reading\n\nFirst part of call for learning more about media queries\
    \ should be Zoe Mickley Gillette's post \"Essential Considerations for Crafting\
    \ Quality Media Queries\": http://zomigi.com/blog/essential-considerations-for-crafting-qual-media-queries/\n\
