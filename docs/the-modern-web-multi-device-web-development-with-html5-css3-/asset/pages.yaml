  md: '# Web Components


    I don''t think I''m exaggerating when I say the Web Components specification proposes
    the most radical changes to HTML since its creation 20+ years ago. Even the much-hyped
    HTML5 is a small point-version update that doesn''t really achieve anything.


    Web Components is a collective title for a group of additions to HTML and the
    DOM aimed at making rich interfaces for web applications—a kind of reusable widget
    specification. As I write this, four main components exist: templates, decorators,
    custom elements, and the Shadow DOM. I''ll explain what each one does in, but
    first let me sum up what they do when they combine.


    One of the principal problems of building components in HTML today is that the
    elements used to build them are part of the DOM and, as such, are open to conflicts
    from CSS or JavaScript. These could be inheritance conflicts, such as rules applied
    to parent elements cascading into component elements or inversely, rules applied
    to component elements leaking or cascading to elements elsewhere in the DOM.


    Another problem arises from naming conflicts, where the same class or ID is used
    in different pages of a site, meaning rules intentionally declared on one element
    are unintentionally applied to others. This problem is commonly found on large
    sites that lack a clear naming scheme, and it can be made even worse by conflicts
    in JavaScript when selectors apply unwanted behavior to an element.


    The best way to avoid conflicts like these is to separate the component from the
    DOM to prevent any inheriting or leaking. This technique is known as encapsulation
    and is fundamental to object-oriented programming languages.


    Web Components attempts to bring encapsulation into the DOM by allowing you to
    create elements that appear only in the rendering of a page, not in the DOM itself.
    Web Components will offer a way to build widgets that can be reused across many
    pages of a site without having to worry about conflicts with existing CSS and
    JavaScript, since the widget lives in a parallel DOM.


    The Components spec is still in the draft stage as I write this, I won''t explore
    the concepts in great detail, but I will cover the bases since it could be significant.


    # Templates


    Probably the easiest way to grasp Web Components is with an understanding of templates.
    The idea of developing reusable blocks of code, or templates, has been a staple
    of web development for some time, although we''ve never seen a native implementation
    in HTML; server-side languages or JavaScript (such as the Mustache library from
    Chapter 5) have required order to use templates.


    Think of Web Component template as a kind of inert block of DOM. The significance
    of this is that the contents are parsed, but not rendered,'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'the browser. This means images and other external elements aren''t loaded and
    included scripts won''t run, which can be a real performance boost compared to
    hiding elements with CSS, where assets are still loaded.


    A template is declared with the template element, and any child elements form
    the content of the template. The following code block shows a template with the
    id #foo, which has two child elements (an h2 and p). Outside of the template is
    a div with the id #bar, which contains an h1 element.


    ```

    <template id="foo">

    <h2>Gorilla Beringei</h2>

    <p>A species of the genus Gorilla...</p>

    </template>

    <div id="bar">

    <h1>Eastern Gorilla</h1>

    </div>

    ```


    If you are to view this page with your browser''s developer tools, you would see
    the template element with no content inside it because, essentially, the contents
    of this element are invisible to the DOM.


    You access the template through script using the content object, which returns
    the child elements of the template as an HTML fragment. For example, you can see
    that the next code snippet assigns the template to the variable tpl logs its content
    object to the console:


    ```

    var tpl = document.getElementById(''foo'');

    console.log(tpl.content);

    ```


    Once you have the fragment, you can manipulate it and see fit. The following code
    uses cloneNode() to create a clone of the content and appendChild() to add inside
    #bar.


    ```

    var bar = document.getElementById(''bar'');

    clone = tpl.content.cloneNode(true);

    bar.appendChild(clone);

    ```


    At this point, you would see this markup if you inspected the DOM:


    ```

    <template id="foo"></template>

    <div id="bar">

    <h1>Eastern Gorilla</h1>

    </div>

    ```


    But the page would be rendered as if it were using this markup:


    ```

    <div id="bar">

    <h1>Eastern Gorilla</h1>

    <h2>Gorilla Beringei</h2>

    <p>A species of the genus Gorilla...</p>

    </div>

    ```'
  merge: -1
  pgno: 209
- img_proc: true
  md: "You can see it for yourself in the example file templates.html; the output\
    \ is shown in Figure 11-1 (see Appendix A for information on current browser support).\
    \ Note that in order for the contents of the template element show I had to enable\
    \ the Show Shadow DOM option in my developer tools; if that option wasn't enabled,\
    \ the element would appear to be empty.\n\n# # Eastern Gorilla\n# Gorilla Beringei\n\
    \nA species of the genus Gorilla and the largest living primate.\n\n| Elements\
    \ | Resources | Network | Sources | Timeline | Profiles | Audit |\n| --- | ---\
    \ | --- | --- | --- | --- | --- |\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    \  <head></head>\n  <body>\n    <template id=\"foo\">\n      #document-fragment\n\
    \      <h2>Gorilla Beringei</h2>\n      <p>A species of the genus Gorilla and\
    \ the largest living primate.</p>\n    </template>\n    <div id=\"bar\"></div>\n\
    \    <script></script>\n  </body>\n</html>\n```\n\nFigure 11-1: The code inspector\
    \ shows the contents of the template element, which exists outside the regular\
    \ DOM.\n\nCode that inert inside the template element becomes active once it's\
    \ inserted into another DOM element, at which point any external resources load,\
    \ scripts will be parsed, and so on.\n\n# ## Decorators\n\nDecorators extend the\
    \ utility of templates by allowing you to add custom markup through CSS. Decorators\
    \ use the decorator element, which must have a unique id assigned. Inside the\
    \ decorator element, you'll find a template element with some custom markup and\
    \ the content element, which is the element that the rule is applied to is rendered.\
    \ Not clear? It took me a while to get it to."
  merge: -1
  pgno: 210
- img_proc: true
  md: "Let's break this down into stages. The following code shows an example of a\
    \ decorator. I gave it the unique #foo (for a change). Inside is a template that\
    \ contains a div, with the content element and an h2 inside that.\n\n```\n<decorator\
    \ id=\"foo\">\n<template>\n  <div>\n    <content></content>\n    <h2>A ape!</h2>\n\
    \  </div>\n</template>\n</decorator>\n```\n\nNow imagine that in the main document\
    \ I have an h1 element with the id #bar, as in the following code:\n\n```\n<h1\
    \ id=\"bar\">Gorilla</h1>\n```\n\nI apply the decorator using CSS and the new\
    \ decorator property has its value a url() function calling the decorator's id.\n\
    \n```\n#bar { decorator: url(#foo); }\n```\n\nOnce I've done this, the markup\
    \ in the template #foo is added to the markup of the element #bar, with #bar itself\
    \ replacing the content element of #foo. However, this takes effect only on the\
    \ property of rendering and doesn't alter the DOM. Although an inspection of the\
    \ DOM shows only the element #bar, the element will be rendered as though markup\
    \ were:\n\n```\n<div>\n<h1 id=\"bar\">Gorilla</h1>\n<h2>A ape!</h2>\n</div>\n\
    ```\n\nYou can do more with templates and decorators, but to show you more, I\
    \ first need to make a brief digression to talk about scoped styles.\n\n# Scoped\
    \ Styles\n\nOne of CSS's greatest strengths is its use of inheritance—that, is,\
    \ the way that values can cascade through selectors to apply multiple elements.\
    \ That strength also be a drawback, however, if you're working on large sites\
    \ with many styles, experiencing the naming and inheritance conflicts I mentioned\
    \ at the start of this section is not uncommon.\n\nScoped styles are a way to\
    \ avoid these conflicts. They're applied in the document using the style element\
    \ with the attribute scoped, and any rules contained therein are inherited only\
    \ by the children of the element they're used in, and won't be applied anywhere\
    \ else in the document."
  merge: -1
  pgno: 211
- img_proc: true
  md: "You can see this in action in the following code: Scoped style tag is used\
    \ inside a div element, and the rules applied to the h1 apply only to the h1 within\
    \ that element (the one with the id #foo), and not the outside div (with the id\
    \ #bar). The scope of the rule applies only to the children div.\n\n```\n<div>\n\
    <style scoped>\nh1 {\n  background-color: #333;\n  color: #FFF;\n}\n</style>\n\
    <h1 id=\"foo\">Scoped</h1>\n</div>\n<h1 id=\"bar\">Not Scoped</h1>\n```\n\nTake\
    \ a look at the example scoped-style.html, the h1 with the id #bar follows the\
    \ one with the id #foo in DOM order, so you would expect the rules inside the\
    \ style element to apply to both. In fact, the scoped attribute means the rules\
    \ apply only inside the parent div. You can see in Figure 11-2 and in scoped-style.html.\n\
    \n# Scoped\nNot Scoped\n\nFigure 11-2: The first h1 rules applied to it do not\
    \ affect the subsequent h1 because the rules are scoped to a different node branch.\n\
    \n# Scoped Styles and Templates\n\nHaving the ability to scope styles in this\
    \ way is ideal for encapsulation, and it combines well with templates and decorators.\
    \ Case in point, if I return to an earlier example using the markup from the first\
    \ code block in \"Decorators\" on page 194, I could create a set of rules to be\
    \ applied to the original h1 element only when the decorator is applied by using\
    \ a scoped style tag inside the template.\n\n```\n<decorator id=\"foo\">\n<template>\n\
    <div>\n<style scoped>\nh1 { color: red; }\n</style>\n<content></content>\n<h2>A\
    \ great ape!</h2>\n</div>\n</template>\n</decorator>\n```\n\nIn this case, the\
    \ h1 element is colored red only when the decorator is applied. Even better, color\
    \ won't apply to any subsequent h1 element in the document because of its limited\
    \ scope—a perfect example of encapsulation."
  merge: -1
