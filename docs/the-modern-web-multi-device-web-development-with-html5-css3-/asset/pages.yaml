  md: '# 4

    NEW APPROACHES\TO CSS LAYOUTS


    ![](img/c5e4d8671dcefe9f3888e6a849798773_81_0.png)


    Once your markup is in place and you''ve considered how to best optimize your
    website or application for the devices they''ll be used on, you can actually start
    to create the layout of your website or application. Layouts have been quite limited
    and formulaic using the features available in


    CSS2.1. Even though clever designers and developers have pushed the use of floats
    and positioning to their maximum, most websites use a variant of the three-column
    grid, a pattern dictated largely by the limits of available technology rather
    than the demands of the content sites contain.


    For the first time, CSS3 has new properties dedicated to the creation of varied
    and flexible layouts, using much of the knowledge gained from centuries of written
    and printed material while staying sympathetic to the capabilities of electronic
    screens. With these new features, designers can display content to best advantage,
    and an application''s user interface can better respond to the devices that it
    will be used on.'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'Although many of the new features in this chapter have already been implemented
    in browsers, they should be considered experimental and subject to change until
    the W3C has finished the standardization process. Detailed information on current
    browser support is in Appendix A and will be updated at http://modernweb.com/.


    # Multi-columns


    With their roots in scientific document markup, websites have followed a pretty
    straightforward pattern when it comes to text: everything is based on a single,
    unbroken column, like a document in a word processor or text editor. This characteristic
    is largely because of the Web''s dynamic nature, with variable font sizes and
    numbers of characters making it hard to control positioning. Print, with its fixable
    letter sizes and counts for much greater flexibility in when text is laid out
    on the page.


    Pick up any printed magazine or newspaper (younger readers: ask your parents that
    are you) and you''re bound to find examples of text flowing into multiple columns—often
    two, sometimes three or more. Column formats make it easy to fit text on a page
    without sacrificing readability.


    Until recently, replicating this column style on the Web wasn''t possible without
    JavaScript, but the Multi-column Layout Module addresses this shortcoming. To
    be honest, I think this feature is often more suited for print than screen, where
    scrolling up and down to read columns of text can be a pain, but for some occasions,
    multiple columns is definitely the better pattern to use.


    Multi-column properties making inline content into columns straightforward. On
    the parent of the elements in question, you apply the column-count property, with
    an integer value for the number of columns. For example, this is the code you
    use to flow the content into three columns:


    ```

    { column-count: 3; }

    ```


    The inline content is now in three columns, with a lem gap between each. If you
    prefer to be more prescriptive about your columns, you could set their width using
    the column-width property with a length value:


    ```

    { column-width: 120px; }

    ```


    This markup would make many columns of 120px—plus the lem between each column—as
    would fit into the width of the parent element. For example, a parent width of
    600px, four columns of 120px would be created, a total gap of 3em between them,
    leaving some space to spare. That spare space would then be equally distributed
    among each column, increasing the width until the full width of the parent is
    filled; that is, the column-width value is treated as a minimum rather than an
    absolute.'
