    # autocomplete


    The autocomplete attribute sets whether the browser remember previous values entered
    into a field and offer them back to you in the future. The values are on and off;
    the default is on, but if you''re creating a site with confidential form information,
    you may want to set this off to increase the user''s security by not offering
    suggestions to someone who may use the same device:


    ```

    <input type="email" autocomplete="off">

    ```


    # spellcheck


    Many browsers now offer native spellchecking facilities. These are usually applied,
    by default, textarea elements only, but you can apply the spellchecker—if present—to
    any field by using the spellcheck attribute. This is a slightly strange attribute,
    as it''s Boolean but doesn''t behave like the other attributes of type; it requires
    a value of true or false to enable or disable spellchecking:


    ```

    <input type="text" spellcheck="true">

    ```


    By default, the dictionary will be used in the language of the user''s browser,
    but you can change this with the lang attribute. If the user has the stated language
    dictionary installed (Spanish, in the following example), that dictionary will
    be used for spellchecking:


    ```

    <input type="text" spellcheck lang="es">

    ```


    # multiple


    The multiple attribute is for situations when the user can enter or submit more
    than one entry in a field. You can pair it with the file input to select multiple
    files from a user''s device or with the email input to enter more than one email
    address in the field. The attribute is a true Boolean, so only the attribute name
    is required:


    ```

    <input type="file" multiple>

    ```'
