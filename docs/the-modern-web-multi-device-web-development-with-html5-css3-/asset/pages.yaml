    # Chapter 1: The Web Platform


    In case you missed it, the list of technologies that make the web platform

    is at http://platform.html5.org/. Bruce Lawrence proposed NEWT on his blog:

    http://www.brucelawson.com/2010/meet-newt-new-exciting-web-technologies/.

    The W3C''s HTML5 spec is at http://www.w3.org/TR/HTML5/, and the

    WHATWG''s living spec is at http://whatwg.org/. More useful, they also

    have Edition for Web Developers, which leaves out of the more arcane

    language and is, therefore, more readable: http://developers.whatwg.org.


    The complete HTML5 Boilerplate is at http://html5boilerplate.com/

    Remember, just use the bits you need; don''t copy the whole thing vibern.


    For finding out about feature implementation levels, I recommend

    Alexis Devera''s site I Can Use... at http://vaniuse.com/, the community site

    HTML5 Please at http://html5please.com/, and The HTML5 Test at http:

    html5test.com.'
