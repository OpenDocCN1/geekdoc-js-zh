  md: '# Summary


    In this chapter, I''ve, by necessity, rushed through the basics of new JavaScript
    DOM and API features; there are really too many for me to cover, so I''ve chosen
    what I think are the most useful. I focused on those that improve the loading
    of scripts, those that facilitate easier DOM traversal and manipulation, and those
    that make events work, especially for touch-enabled devices.


    I''ve also some popular and useful JavaScript libraries, from the power of the
    ubiquitous jQuery to the utility of Nope, Modernizr, and Mustache. I strongly
    encourage you to find out about many different libraries that are available and
    find ones that suit you best.


    # Further Reading


    The illustration in Figure 5-1 is adapted from Peter Beverloo''s blog: http://peter.sh/experiments/asynchronous-and-deferred-javascript-execution-explained/


    Christian Heinmann wrote an in-depth introduction to JavaScript events for Smashing
    Magazine: http://coding.smashingmagazine.com/2012/08/17/javascript-events-responding-user/.
    The PointerEvents library is hosted on GitHub at https://github.com/tokitchen/PointerEvents.


    The jQuery website, http://jquery.com/, has instructions for starting, while the
    excellent documentation is at http://docs.jquery.com/Main_Page. Statistics about
    jQuery usage are from the blog post "Query Now Runs on Every Website" at http://w3tech.com/blog/entry/jquery_runs_on_every_second_website/


    All libraries are fully documented: jQuery Mobile at http://jquerymobile.com/,
    Zepto.js at http://zepto.com/, and jQTouch at http://jqtouch.com.


    NopeJS is available from http://nopejs.com, and you''ll find a good introductory
    tutorial at at http://net.tuplus.com/tutorials/javascript-ajax/easy-script-loading-with-nopejs.js.


    Modernizr''s, http://modernizr.com/, has full documentation a configurable build
    system and also plays to host "The All-In-One Entirely-Not-Alphabetical-No-Bullshit
    Guide to HTML5 Fallbacks" (their title, not mines) at http://github.com/Modernizr/wiki/HTML5-Cross-browser-Polyfills.


    Christopher Coraets wrote an excellent introductory tutorial to Mustache, although
    bear in mind that the syntax has changed little: http://coenraets.org/blog/2011/12/tutorial-html-templates-with-mustache.js/.
    The full documentation of Mustache.js is at https://github.com/janl/mustache.js.


    Many different experimenting and debugging tools are available, and both) jsbin.com,
    and http://jsfiddle.net are excellent.'
