    icon_128.png\"/>\n</widget>\n```\n\nHaving been around a while, widgets are considered\
    \ stable, but they don't have many implementations in the modern device environment.\
    \ The Opera browser uses a widget as a base for its extensions specification,\
    \ and the largest current user of widget is probably the PhoneGap project, which\
    \ I cover next.\n\n# Hybrid Apps\n\nIf you want to publish your web apps through\
    \ the big device app stores—such as the Apple App Store, Google Play, or the Windows\
    \ Store—you need to create a hybrid app. These apps are similar to packaged apps\
    \ in all their resources are contained in a single archive, but they go one step\
    \ further by adding a native shell, or wrapper, around the files, which ensures\
    \ that the app can be integrated into the main operating system, providing security\
    \ and better performance and also allowing access to restricted device APIs. A\
    \ number of software solutions exist for making hybrid apps, but one of the most\
    \ common—and certainly the easiest to learn—is PhoneGap."
