  md: 'Even at this basic level, addEventListener is useful enough, but it''s even
    more valuable than it might seem, as you can use it to add multiple events of
    the same type to an element. This means you can use scripts from different sources
    without worrying about accidentally overwriting an event listener. The next example
    shows two named functions applied to the same element; each could be in a completely
    different script file yet still be executed when the element is clicked:


    ```

    el.addEventListener(''click'', foo, false);

    el.addEventListener(''click'', bar, false);

    ```


    Using named functions (as I''ve done in this) rather than anonymous functions
    is a good idea. Named functions are simpler to refer to elsewhere in your scripts,
    which is essential when you want to remove event handlers as discussed in "Removing
    Event Listeners" on page 93.


    # The Event Object


    EventListener() returns an object with details of the event after it''s fired.
    You can access this object using an anonymous function with a unique identifier
    as an argument. This identifier will be the name of the object. In this example,
    I call it ev and log it to the console you can see:


    ```

    el.addEventListener(''click'', function (ev) {

    console.log(ev);

    },false);

    ```


    Figure 5-2 shows the event object output in Firebug. You can see a number of different
    property-value pairs, giving substantial information about the event as it happened
    (there''s more information off-screen).


    This method also works with named functions; you just have to supply the unique
    id as an argument when defining the function:


    ```

    var foo = function (ev) {

    console.log(ev);

    }

    el.addEventListener(''click'', foo, false);

    ```


    Among the event object''s most useful properties is currentTarget, which holds
    information about the element that the event occurred on; you can then apply behavior
    to that element easily, as when the element that is clicked has its color set
    to #FFF.


    ```

    el.addEventListener(''click'', function (ev) {

    ev.currentTarget.style.color = ''#Foo'';

    },false);

    ```'
