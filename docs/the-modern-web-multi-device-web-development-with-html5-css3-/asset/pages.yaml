  md: "# 1. Understand Yourself and Others\n\nSo long as you live in a civilized or\
    \ thickly populated community you will still need to understand your own nature\
    \ and the natures of other people.\n\n# 2. Primitive Problems\n\nIn primitive\
    \ times people saw each other rarely and had much less to do with each other.\
    \ The human element was then not the chief problem.\n\nFigure 4-5: Child items\
    \ of a flex container are automatically laid out horizontally.\n\nYou can alter\
    \ this direction by using the flex-direction property on the container. Its default\
    \ value is row, which gives the behavior just discussed, whereas a value of column\
    \ lays the items perpendicular to the direction of text—in this case, into a column.\
    \ (A few other permitted values are available, which I'll cover shortly.)\n\n\
    ```\n{\n  display: flex;\n  flex-direction: column;\n}\n```\n\nThis syntax makes\
    \ your flex items look like the page layout default behavior, where one item follows\
    \ the next in vertical sequence.\n\n# Changing the Content Order\n\nOne of Flexbox's\
    \ other great capabilities is that you can quickly change the order that items\
    \ are displayed, regardless of their order in the DOM. For example, in the previous\
    \ section, I had two items laid out in a row, but if I wanted to change them around\
    \ so that #b becomes #a?\n\nYou can do this quickly with the flex-direction property\
    \ that I just discussed, using the new value row-reverse. This property reverses\
    \ the order in which flex items are displayed, as you can see in Figure 4-6.\n\
    \n```\n{ flex-direction: row-reverse; }\n```\n\nThe column-reverse value does\
    \ the same thing to flex items displayed in columns: They are laid out in reverse\
    \ order, vertically. Play around with the values of flex-direction in the example\
    \ file to see their different effects."
  merge: -1
  pgno: 87
- img_proc: true
  md: "# 2. Primitive Problems\n\n# 1. Understand Yourself and Others\n\nIn primitive\
    \ times people saw each other rarely and had much less to do with each other.\
    \ The human element was not the then chief problem.\n\nSo long as you live in\
    \ a civilized or thickly populated community you will still need to understand\
    \ your own nature and the natures of other people.\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_88_0.png)\n\
    \nBy using the flex-order property, you can go beyond this reverse ordering to\
    \ make completely bespoke ordering patterns. This pattern is applied to the flex\
    \ items, not the container, and the value is a number that creates an ordinal\
    \ group, so items with the same value are grouped. The items are ordered by their\
    \ ordinal group: All items in the lowest numbered group come first, followed by\
    \ all items in the second-lowest numbered group, and so on. Items without a declared\
    \ value are shown first because they have the default value of 0.\n\nItems with\
    \ the same ordinal group number will subsequently be shown in the order in which\
    \ they appear in the DOM. This ordinal ordering may sound confusing at first,\
    \ so I illustrate using four flex items, up like so:\n\n```\n<div id=\"container\"\
    >\n  <div id=\"a\">...</div>\n  <div id=\"b\">...</div>\n  <div id=\"c\">...</div>\n\
    \  <div id=\"d\">...</div>\n</div>\n```\n\nWithout any explicit values set, the\
    \ children are displayed in the order they appear in the DOM: #a, #b, #c, #d.\
    \ But let's reorder them by using different values on the flex-order property:\n\
    \n```\n#a { flex-order: 2; }\n#b, #d { flex-order: 3; }\n#c { flex-order: 1; }\n\
    ```\n\nWith these rules applied, the items are laid out in this order: #c, #a,\
    \ #b, #d. Item #c comes first because it has the lowest ordinal group number,\
    \ followed by #a with the next highest, and then #b and #d—both are in ordinal\
    \ group 3, and #d comes last because it's also later in the DOM order."
