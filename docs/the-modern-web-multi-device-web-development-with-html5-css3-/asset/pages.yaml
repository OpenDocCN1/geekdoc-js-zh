  md: 'Different browsers accept different types of files for subtitles captions but
    the emerging standard is known as WebTT. This format is simple, displaying captions
    from a start time to an end time. Here''s an example:


    ```

    WEBTT


    1

    00:00:00.500 --> 00:00:04.000

    Hello to all readers

    ```


    ```

    2

    00:00:06.000 --> 00:00:10.000

    Thanks for reading this book

    ```


    The first caption appears on screen after half a second and is shown until the
    fourth second; the second caption appears in the sixth second and is shown until
    the tenth second. Although extra configuration options are available, the core
    has been kept very simple.


    # Encoding


    You have many different variables to consider when encoding video for the Web;
    for example my experience is that some files encoded for iOS may play on Android,
    and vice versa. If you''re happy using the command line, then FFmpeg is your best
    bet; it is a free and open source encoder''s extremely configurable. You need
    to give the path to the source video, a series of (optional) encoding parameters,
    and then a path to the output file. Here''s a simple example, converting AVI to
    MP4:


    ```

    ffmpeg -i foo.avi foo.mp4

    ```


    If you prefer a GUI, there are many video-encoding tools available, I rely on
    two that are easy to use and free. Miro Video Converter is a Mac or Windows program
    handy for quick conversions simply drag a file into the app, choose an output
    mode from a list that includes MP4, Ogg Theoretical, and WebM, and the tool outputs
    the converted file for you. If you prefer to have more options to control your
    conversions, HandBrake is probably the easiest and most powerful tool, although
    it outputs only MP4 so you may need to convert to Miro anyway. Both tools are
    graphical shells for FFmpeg.


    # Media Fragments


    On occasion you may want to play only a portion of a media file but you don''t
    want to edit the clip manually. You can do this with JavaScript, you''ll see in
    the next section, but many browsers also support the Media Fragments URI. This
    information is appended to the URL of the media'
  merge: -1
