  md: "app's root folder. The following annotated code shows a short example\nmanifest.json\
    \ for the Chrome Web Store, with the bare minimum of\nrequired fields.\n\n```\n\
    {\n  \"name\": \"App Name\",\n  \"description\": \"Short description\",\n  \"\
    version\": \"0.1\",\n  \"manifest_version\": 2,\n  \"icons\": {\n    \"128\":\
    \ \"icon_128.png\"\n  },\n  \"app\": {\n    \"launch\": {\n      \"web_url\":\
    \ \"http://foo.example.com/\"\n    }\n  }\n}\n```\n\nThe first item ① in the manifest\
    \ is the name of your app. Next ② is the\ndescription, which should be 132 characters\
    \ (or fewer) in length and con-\ntain no HTML. The version property ③ is the custom\
    \ release version of\napp, which is handy for bug reporting and informing users\
    \ of updates. The\nmanifest version ④ tells the Chrome Web Store that you are\
    \ using the most\nup-to-date manifest format (version 1 will be phased out through\
    \ 2013).\nThe icons object ⑤ is a list of image files that are to be displayed\
    \ at\\different resolutions, depending on where they will be shown (such as a\n\
    device desktop or in a list of apps); here, file icon_128.png will be used\nver\
    \ a 128x128px icon is displayed. Finally, the app object ⑥ contains a\nweb_url\
    \ subfield, which includes the URL of the page to be displayed when\nour app launches.\n\
    \n# The Firefox Marketplace\n\nThe manifest required by the Firefox Marketplace\
    \ is known as an\nWeb App Manifest. As the names imply, Mozilla is hoping this\
    \ format\nbecomes a general standard for web apps, as a way to simplify the process\n\
    of submitting a web app to multiple stores in the future. This manifest is\ncalled\
    \ manifest.webapp and served with the MIME type application/\nx-web-app-manifest+json.\
    \ Full instructions can be found in the slides of\nRobert's task \"WebAPIs and\
    \ Apps\" listed in \"Further Reading\" on\nJSON-formatted and, by design,\nsimilar\
    \ to that of the Chrome Web Store. The listing here shows a minimal,\nannotated\
    \ example.\n\n```\n{\n  \"name\": \"App Name\",\n  \"description\": \"Short description\"\
    ,\n}\n```"
