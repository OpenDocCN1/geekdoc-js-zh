- img_proc: true
  md: "The three key properties that are germane to movement are alpha, beta, and\
    \ gamma. Each is measured with a number representing degrees of rotation, although\
    \ some are constrained within set limits.\n\n+   - alpha measures rotation around,\
    \ not movement along, the z-axis—that is, if the device laid flat on a table,\
    \ clockwise or counterclockwise movement. The value of alpha is a number from\
    \ 0 to 360.\n\n+   - beta is rotation around the x-axis, which you can predict\
    \ as tipping the edge of the device toward or away from you. beta has a value\
    \ range of −180 (tip toward you) to 180 (tip away from you).\n\n+   - gamma is\
    \ rotation around the y-axis or tilting the device from side to side. The value\
    \ of gamma ranges from −90 (tip left) to 90 (tip right).\n\nAs a very simple example,\
    \ the code in the following script uses deviceorientation to detect changes to\
    \ the orientation and logs the three values to the console:\n\n```\nwindow.addEventListener('deviceorientation',\
    \ function (orientData) {\n  console.log(orientData.alpha, orientData.beta, orientData.gamma);\n\
    }, false);\n```\n\nIn the example orientation.html, you can see a slightly different\
    \ version that updates the text on the page when open it on a mobile or tablet\
    \ device and move the device around to see the page update.\n\n# Fullscreen\n\n\
    We all know the Web is an immensely powerful distraction machine, sometimes providing\
    \ an option to focus only on the content at hand is useful. This functionality\
    \ is provided by the Fullscreen API, which allows you to expand any element to\
    \ fill the entire screen of the device, rather than just the browser viewport.\
    \ For instance, when playing video to provide the “lean back” experience of television.\n\
    \nBefore setting this script, check whether the browser has a fullscreens mode.\
    \ You can do this with the Boolean fullscreenEnabled attribute:\n\n```\n(document.fullscreenEnabled)\
    \ { ... }\n```\n\nFullscreen is called with the requestFullScreen() method. As\
    \ this introduces potential security risks (an-quoted example is an attack website\
    \ that fools you into thinking that you're seeing something else and copies your\
    \ keystrokes), many devices provide an on-screen prompt to make sure you give\
    \ permission to enter fullscreen mode. If you grant that permission, the element\
    \ method is called on scales up to 100 percent of the device screen's height and\
    \ width.\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_127_0.png)"
