  md: '# Repeating Grid Lines


    The simple grids defined in this chapter so far are good for learning and for
    some real-world situations, but you''ll often want to use complex grids for finer
    control over content. A 12- or 16-column grid is fairly commonplace, and each
    of those columns usually a gutter (empty space) between itself and its neighbor.
    But using the Grid Layout syntax, even a 6-column grid with gutters can be repetitive:


    ```

    { grid-columns: 1fr 10px 1fr 10px 1fr 10px 1fr 10px 1fr 10px 1fr; }

    ```


    Imagine how repetitive that would be with 6 columns! To get around this problem,
    you can use the repeat() function to manage repetition. This function takes two
    values: an integer that sets the number of repetitions and the grid line values
    to:


    ```

    { grid-columns: 1fr repeat(5, 10px 1fr); }

    ```


    This defines one fraction, and then repeats a pattern alternating 10px and 1fr,
    five times, matching the code in the previous example.

    Internet Explorer 10 uses syntax from an older version of the spec, where the
    number of repetitions is placed after the parentheses in square brackets. If you''re
    building apps for the Windows 8 UI, use this syntax:


    ```

    { -ms-grid-columns: 1fr repeat(10px 1fr)[5]; }

    ```


    # Placing Items on the Grid


    To place an item on the grid, you assign it a cell reference using the grid-column
    and grid-row properties. Each property takes a single number as a value, which
    refers to a track (either a column or a row). For example, to place an item in
    the cell positioned in the second column, second row, you would use this code
    (the result is shown in Figure 4-15):


    ```

    {

    grid-column: 2;

    grid-row: 2;

    }

    ```


    The default value of both grid-column and grid-row is 1, so omitting either would
    place the item in the first row or column. Given the following code, the item
    would be placed in the cell in the second column of the first row, as you can
    see in Figure 4-16.


    ```

    { grid-column: 2; }

    ```'
