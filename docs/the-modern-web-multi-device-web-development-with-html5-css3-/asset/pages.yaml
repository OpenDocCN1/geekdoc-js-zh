    ```

    <video src="foo.oga?t=7.5,"*"></video>

    ```


    The Media Fragments URI module contains many more options than time range, but
    this is the only option that currently has widespread adoption in browsers.


    # The Media API


    One of the complaints about using plug-ins to display audio and video is that
    they are dumb elements on the page; you cannot interact the plug-in specifically
    makes itself available. The HTML5 media elements, however, have the big advantage
    of an extensive API that allows you to inform about the media file and makes interacting
    simple. You access the API through three of interfaces: Each media element has
    shared properties and methods in the HTMLMediaElement interface; audio also has
    the unique HTMLAudioElement interface; and video has HTMLVideoElement.


    The first methods I''ll introduce have obvious functions: they play() and pause(),
    and are simply applied to the media element. Given unique controls on a page,
    you might end up with a script like to control them:


    ```

    var pause = document.getElementById(''pause'');

    play = document.getElementById(''play'');

    video = document.getElementById(''video'');

    pause.addEventListener(''click'', function () {

    video.pause();

    });

    play.addEventListener(''click'', function () {

    video.play();

    });

    ```


    Separate buttons seem somewhat wasteful, so combining them into a Play/Pause button
    is more efficient. You can do this by adding an if...else statement to the code,
    checking to see whether the video is in a paused state using the paused-pause
    property, which is Boolean. You can see this demo in the file media-play-pause.html
    and shown in Figure 9-4.'
