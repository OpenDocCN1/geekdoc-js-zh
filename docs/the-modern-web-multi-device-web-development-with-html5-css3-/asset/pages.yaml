  md: '# Summary


    This chapter provided you with all the information you need to get started in
    modern web development. I disambiguated the common meaning of HTML5 and introduced
    you to the web platform. You learned that HTML5 is useful for and how to start
    writing it, and you also had a brief introduction to CSS3.


    The chapter''s key messages are in the latter parts: First, always keep up-to-date
    about the levels of implementation of web platform features across common browsers;
    and second, then, and test, test, test some more, and when you think you have
    no more testing to do, test again. Once more for good luck.


    With all of that explained, let''s roll our sleeves up and get to work.


    # Further Reading


    In case you missed it, the list of technologies that make the web platform is
    at http://platform5.org/. Bruce Lawson proposed NEWT on his blog: http://www.brucecelawson.co.uk/2010/meet-meet-new-exciting-web-technologies/


    The W3C''s HTML5 spec is at http://www.w3.org/TR/html5/, and the WHATWG''s living
    spec is at http://whatwg.org/html. Morefully, you also have an Edition for Web
