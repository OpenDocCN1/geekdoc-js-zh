  md: "Network Information also has an event handler, change, on the connection object,\
    \ which fires whenever the connection status changes; with this, you can add an\
    \ extra call to the function when necessary:\n\n```\nconnection.addEventListener('change',\
    \ showStatus, false);\n```\n\nYou can see both work in the file network.html—connecting\
    \ or disconnecting your Wi-Fi service to see the change event.\n\n# Camera and\
    \ Microphone\n\nCameras and microphones have been common on desktop and laptop\
    \ computers for a long time, and with the rise of mobile devices they've become\
    \ extremely prevalentalmost ubiquitous. For years, we've had to rely on third-party\
    \ plug-ins, such as Flash and Java, to get audio and video input on the Web, so\
    \ a native input method is not that overdue.\n\nThis native input comes in the\
    \ shape of the getUserMedia() method, of the WebRTC project, which I will discuss\
    \ in more detail in Chapter 9. The getUserMedia() method is on the navigator object,\
    \ and takes up three arguments: The first is for options about the stream, such\
    \ as whether to accept only audio, video or both; the second is a callback fired\
    \ when a successful connection is made; and the third, which is optional, is a\
    \ failure callback:\n\n```\nnavigator.getUserMedia({options}, success, failure);\n\
    ```\n\nAs with the Geolocation and Fullscreen APIs, accessing the user-camera\
    \ or microphone has privacy implications, so many browsers provide an on-screen\
    \ prompt for the user's permission to access the device. Devices with more than\
    \ one camera, user agents offer a native control to switch between them.\n\nA\
    \ media stream requires a special element in order to be displayed, either the\
    \ new video or audio HTML5 element (depending on the stream content). I introduce\
    \ these new elements fully in Chapter 9, but for the purposes of the following\
    \ demonstration, using a video stream, you need the following markup somewhere\
    \ on your page:\n\n```\n<video autoplay></video>\n```\n\nWhen the successful callback\
    \ is fired from getUserMedia(), the media stream is returned with a unique ID\
    \ (provided by you), which will be supplied to the video element. The following\
    \ code shows a basic example, which I have annotated and will explain:\n\n+  \
    \ navigator.getUserMedia({video:true}, function (stream) {\n  var video = document.querySelector('video');\n\
    \  video.src = window.URL.createObjectURL(stream);\n});"
