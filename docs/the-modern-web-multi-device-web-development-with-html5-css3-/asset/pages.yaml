  md: '# Media Queries


    In my opinion, media queries are the biggest agent of change in website design
    for many years—probably CSS itself became mainstream. The widespread adoption
    of CSS allowed you to leave behind the rigid limitations of table-based websites,
    and media queries take a step further, letting you style pages in a way that is
    sympathetic to the specifications of each device your sites are displayed on.


    A media query is a logical statement: If the logic is true, the rules are applied;
    if the logic is false, the rules are skipped. The parameters of the statements
    are known as media features, and the most commonly used today concern the dimensions
    of the device or the viewport.


    Media queries extend the media types syntax in CSS 2.1 and HTML 4.01—remember,
    that the syntax lets you media-dependent styles, such as when linking to an external
    stylesheet:


    ```

    <link rel="stylesheet" href="foo.css" media="screen">

    ```


    This code calls the external stylesheet foo.css only when the viewing device is
    a screen—in other words, not a different media type as print. You extend this
    syntax by simply adding the word and including the query itself in parentheses:


    ```

    <link rel="stylesheet" href="foo.css" media="screen and (query)">

    ```


    This modified code has two conditions: The media type should be a screen, and
    the logic of the media query should be true. If both of these conditions are met,
    foo.css is applied.


    You can also use media queries to include external stylesheets from other stylesheets,
    using the @import at-rule. The following code has the same logic as the previous
    code block, but it can be used within style tags or an external stylesheet:


    ```

    @import url(''foo.css'') screen and (query);

    ```


    > WARNING Issues can occur when using @import in this way, so proceed with caution.
    For more details, see Steve Souders'' blog post, "Don''t Use @import" (http://www.stevesouders.com/blog/2009/04/09/dont-use-import/).


    Finally, you can use media queries inline, which is handy when you apply blocks
    of rules for specific cases rather than calling external stylesheets:


    ```

    @media screen and (query) { ... }

    ```'
