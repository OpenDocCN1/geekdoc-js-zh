    elements, but whether you use them or not, WAI-ARIA in your project, regardless
    of the context. Content accessibility is the bedrock of the Web, and if you use
    roles and nothing else, you and your users.


    You also got a look at adding context to your sites through semantic and structured
    data, and you learned the importance of aboutness. The approach you take will,
    of course, depend on the context you''re making it for. Building a large database-led
    website with lots of consumer-focused'
