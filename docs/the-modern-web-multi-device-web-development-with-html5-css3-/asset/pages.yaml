    # The getClassName() Method


    One fairly (and surprising) gap in JavaScript to access the DOM was a method for
    selecting elements by their class name. With DOMContentLoaded, this absence led
    developers to write their own custom scripts to carry out that task, many of which
    consolidated around the name getClassName(). This solution was also standardized
    in HTML5, and the method is now present natively in modern browsers. getClassName()
    takes a single string and returns a NodeList of elements that have a class name
    matching the:


    ```

    var el = document.getElementsByClassName(''foo'');

    ```


    You can also match multiple class names by separating them with spaces in the
    string; the following code selects all elements that have a class name of both
    foo and bar:


    ```

    var el = document.getElementsByClassName(''foo bar'');

    ```


    # Interacting with Classes


    With the introduction of the classList object, JavaScript has also made interacting
    with the class names of elements easier. Every element in the DOM has an associated
    classList, which is just what it sounds like: a list of all the classes applied
    to that element. To get the classList of an element and log it to the console,
    do:


    ```

    var el = document.querySelector(''.foo'');

    console.log(el.classList);

    ```


    The classList object contains a series of properties and methods for manipulating
    classes. You can query for the existence of a class with the contains() method,
    which returns true if the class is present and false otherwise. You add a class
    with the add() method and remove one with remove(). The following code tests for
    the class name foo, adds it if it isn''t present, and removes it if it is:


    ```

    if (el.classList.contains(''foo'')) {

    el.classList.remove(''foo'');

    ```'
