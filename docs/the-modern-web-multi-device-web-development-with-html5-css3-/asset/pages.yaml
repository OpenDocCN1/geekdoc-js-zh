  md: '# Alignment Inside the Container


    Flex items with explicit dimensions might be smaller than their container, but
    one of the other benefits of Flexbox is tight control over alignment and placing.


    Before getting into this fully, I''ll quickly explain the two axes used for alignment.
    The main axis goes in the direction the items are placed. By default, when the
    value of flex-direction is row, the main axis is horizontal; when the value is
    column, the main axis is vertical. The cross axis is the perpendicular: vertical
    when the flex-direction is row, horizontal when it''s column. Figure 4-7 shows
    the difference.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_89_0.png)


    Figure 4-7: The main and cross axis depend on whether the flex children are in
    rows or columns.


    Now with the alignment properties. Imagine you have a container that is 600px
    wide, with three flex items that are each 150px wide. By default, the three items
    display in a row, aligned to the left, with 150px of unused space after them (as
    shown in the first row of Figure 4-8).


    You can redistribute this unused space with the justify-content property. This
    property accepts a series of keyword values that apply differently depending on
    the direction of the flex parent (row, column, reversed and so on). For the purpose
    of demonstration, let''s presume the standard English to left to right. The default
    value is flex-start, which aligns all flex items to the left of the parent with
    the unused space occupying the remaining horizontal width to the right, as I mentioned
    in the previous paragraph.


    The alternative values are: flex-end, which aligns the items to the right of the
    container with the unused space to the left; center, which distributes the unused
    space to either side of all items, centering the items in the container; space-between,
    which adds an equal amount of space between each item but not before the first
    or after the last item; and space-around, which puts an equal amount of space
    on both sides of each item.'
  merge: -1
  pgno: 89
- img_proc: true
  md: 'Have a look at flexbox-alignment.html and try changing the value of justify-content
    to see its effect. Figure 4-8 shows a few different values for comparison.


    | A | B | C |

    |---|---|---|

    | | A | B | |

    | A | B | C |


    Figure 4-8: Different values for the justify-content property: flex-start (top),
    center (middle), and space-around (bottom)


    But what about alignment on the cross axis? After all, at times the height of
    your flex items is less than the height of the flex container. (To avoid repetition,
    I''ll continue to assume we''re dealing with items in a row.)


    The property that applies is align-items, and the values are a little different.
    The default is stretch, which makes the item been the same height as its parent.
    This value works only when no height has been specified on it; however, if a height
    has been specified, the default becomes flex-start, which aligns items to the
    top of the container. Of the other values, flex-end aligns items to the bottom
    of the container; center to the vertical center of the container, with equal unused
    space above and below; and baseline aligns the items according to the baseline
    of the first line of their content.


    Have a look at flexbox-alignment.html and update the value yourself to see the
    different effects in action. Figure 4-9 shows some different values at work.


    | A | B | C |

    |---|---|---|

    | A | B | C |

    | A | B | C |


    Figure 4-9: Alignment on the cross axis is controlled with different values for
    align-items: stretch (top), flex-end (middle), and center (bottom).'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'To control the alignment of individual items, use the align-self property.
    This property applies to the item, not the container, but the values are the same
    as align-items, and they have the same effects (although on the selected item
    only-sibling items remain unaffected).


    # Adding Some Flexibility


    You''ve seen how items can be aligned and ordered, but so far a better name for
    the module might be Versatile Box. What about the titular flexibility? This comes
    in the shape of dynamic growing or shrinking of items to better fit the container
    and is provided by a new property called flex. This property is applied to items,
    rather than the container, and takes three values:


    ```

    E { flex: 1 2 150px; }

    ```


    The flex property is actually a shorthand, and each of the values are for a further
    property; in order, they are flex-grow, flex-shrink, and flex-basis. If I wrote
    the same rule again using all three properties, it would be:


    ```

    E {

    flex-grow: 1;

    flex-shrink: 2;

    flex-basis: 150px;

    }

    ```


    But what do these properties actually do? I''ll start by explaining flex-basis,
    which essentially acts like (and takes precedence over) the value of the width
    property. The flex--basis property is like a "preferred width" property, meaning
    these boxes will be flexible, but their flexibility will be based on this number.


    In the example code I''ve used so far in this section, I''ve included three flex
    items, each with a flex-basis of 150px, in a flex container that holds 600px,
    leaving 150px of unused width. This is where the other properties come in.


    The flex-grow and flex-shrink values are basically a ratio. Ignore flex-shrink
    for a moment, and note that each item has a flex-grow value of 1. This value means
    the 150px of unused width is divided up using the ratio 1:1—that is, equally.
    Fifty pixels are added to each element so they become 200px, filling the container.
    But what if I changed the flex-grow value for one of the children?


    ```

    #a, #b { flex: 1 2 150px; }

    #c { flex: 3 2 150px; }

    ```


    Now the ratio has changed to 1:3:1, the 150px will be distributed between the
    items in that ratio; for every 1px that''s distributed to items #a and #b, 3px
    is distributed to item #c. Therefore #e becomes 240px wide, and items #a and #b
    are 180px wide. Changing the flex-grow value alters the ratio and the flexibility
    of your items.'
  merge: -1
  pgno: 91
- img_proc: true
  md: "For example, Figure 4-10 shows the effect of a change to flex-grow; in the\
    \ upper example, all items have an equal value of 1; in the lower example, item\
    \ B has a value of 3, meaning it grows proportionally larger.\n\n| A | B | C |\n\
    |---|---|---|n| A | B | C |\n\nFigure 4-10: A greater flex-grow value means item\
    \ B in the lower example becomes proportionally larger than its siblings.\n\n\
    The flex-shrink property works in reverse. If you keep the same items as in the\
    \ examples but reduce the width of the container to 300px, the combined width\
    \ (or flex-basis) of the items creates a 50px-surplus width, which is removed\
    \ from each of the items in the ratio given by flex-shrink: 2:2:2. Notice this\
    \ is an equal ratio, so it's actually the same as 1:1:1 or 5:5:5. The result is\
    \ the same: each item is reduced by 50px to fix the container.\n\nNow if you change\
    \ the flex-shrink value of one of the items?\n\n```\n#a, #b { flex: 1 2 150px;\
    \ }\n#c { flex: 3 3 150px; }\n```\n\nNow item c is reduced by 3px for every 2px\
    \ from items #a and #b; it flexes to 86px in width, compared to its siblings'\
    \ 107px.\n flexibility is really useful when you have a series of elements that\
    \ must fit into variable spaces, as a user interface of an app that has to work\
    \ across multiple devices. Flexbox is also good for those times when you don't\
    \ know how many interface elements you'll have, but you know they should all be\
    \ proportional regardless.\n\n# Wrap and Flow\n\nEven with the extra flexibility\
    \ provided by Flexbox, at times you will have too many items to fit comfortably\
    \ into one row (or column) of a container. Should this occur, you can break items\
    \ onto multiple lines using the flex-wrap property. Its default value is nowrap,\
    \ which preserves all the items on the same line, but a value of wrap makes the\
    \ items break onto extra lines if required:\n\n```\nE { flex-wrap: wrap; }\n```"
  merge: -1
  pgno: 92
- img_proc: true
  md: 'The wrap value makes new lines below the first (or to the right in column view),
    but an alternative value of wrap-reverse changes the direction of the cross axis
    so new lines appear above (or to the left) instead. Figure 4-11 compares two different
    values.


    | A | B |

    |---|---|n| C | |

    | C | |

    | A | B |


    Figure 4-11: Comparing values for the flex-wrap property. The upper example has
    a value of wrap, so element C appears in a new line below; whereas in the lower
    example, the value is wrap-reverse, so element C is on a new line above.


    You can combine flex-wrap with flex-direction in the shorthand flex-flow property.
    To set a column with multiple lines and a reversed cross axis, use:


    ```

    E { flex-flow: column wrap-reverse; }

    ```


    When items wrap over multiple lines, you can control their alignment with the
    align-content property. This property works like the justify-content property
    but on the cross axis. It has the same values plus one extra, stretch, which resizes
    the items to fill all unused space. Figure 4-12 compares two different values.


    | A | B |

