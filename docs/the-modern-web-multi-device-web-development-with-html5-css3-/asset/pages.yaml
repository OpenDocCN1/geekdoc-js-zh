- img_proc: true
  md: "# Custom Elements\n\nAlthough decorators are handy for adding extra presentational\
    \ markup to an element, when you want to make more substantial changes, use a\
    \ custom element. The key difference between custom elements and decorators is\
    \ that the latter is transitory; they can be applied or removed by changing an\
    \ attribute or selector. Custom elements, on the other hand, are fixed; they are\
    \ applied when the DOM is parsed and can be changed or removed only with scripting.\n\
    \nA custom element is like an extended template that replaces or enhances a standard\
    \ element. You create a custom element with the element element (this paragraph\
    \ is going for a new record in the number of occurrences of the word 'element'),\
    \ which has some new attributes that I'll discuss shortly. Inside this element,\
    \ you can add a template element with new markup, as well as scoped styles and\
    \ even a script.\n\nIf this sounds a bit confusing, consider this illustration.\
    \ The following code snippet shows a simple example: an element containing a template,\
    \ which in turn, contains a div, which itself contains the content element introduced\
    \ in 'Decorators' on page 194. The element has two attributes: extends, which\
    \ takes a value the name of the element that it will extend (in this case, a button\
    \ element), and name, a user-defined unique identifier which must start with x\
    \ to avoid conflicting with existing elements.\n\n```\n<element extends=\"button\"\
    \ name=\"x-footbutton\">\n<template>\n  <div id=\"foo\">\n    <content></content>\n\
    \  </div>\n</template>\n</element>\n```\n\nOnce the custom element has been defined,\
    \ you can apply it with an attribute. The attribute is applied to the element\
    \ to be extended and takes a value the unique identifier from the name attribute\
    \ (x-footbutton) defined on the custom element. Actually, this is simpler than:\n\
    \n```\n<button is=\"x-footbutton\">Go</button>\n```\n\nThe resulting effect is\
    \ the same as that of a decorator: The markup of the custom element extends the\
    \ markup of the element it's applied to only in the rendered view. Although viewing\
    \ the DOM shows only the button element, it renders like this:\n\n```\n<div id=\"\
    foo\">\n  <button>Go</button>\n</div>\n```\n\nThis example is simple, but you\
    \ can see how the extensibility of this technique would make it easy to build\
    \ completely tailor-made widgets that"
  merge: -1
  pgno: 213
- img_proc: true
  md: 'be reused across many documents. As a result, many of the cumbersome widgets
    we build today (such as carousels, accordions, and date pickers) can be applied
    to existing elements without filling the DOM with unnecessary markup, with the
    added benefit of implementing encapsulation to avoid conflicts.


    I mentioned earlier that the core difference between a custom element and a decorator
    is in the permanence of the markup. One advantage of this is that scripts can
    be included in a custom element that will always be present (a benefit you can''t
    rely on for more impermanent decorators). All this means you could even define
    an imperative API for each element, thereby taking interactivity to a whole new
    level.


    # The Shadow DOM


    The final piece of the Web Components specification is the Shadow DOM. This is
    not only a cool-sounding name for a supervillain, but it''s also a way to create
    and, with script, the elements that exist in the parallel DOM and custom elements
    use HTML. As decorators use CSS to alter elements, Shadow DOM uses script to achieve
    the ends.


    The Shadow DOM describes the ability of a browser to create a new, fully encapsulated
    node tree inside the existing DOM. The browser does this by creating a shadow
    root inside an element, which can be traversed and manipulated like a regular
    node. (A shadow tree won''t show up in the DOM, but it will be rendered).


    Now for an example. The following code snippet contains some simple markup: a
    div called #foo, which contains a h1 element. This is the base markup in the DOM,
    inside which I''ll add a new shadow root.


    ```

    <div id="foo">

    <h1>Hello, world!</h1>

    </div>

    ```


    Now I''ll add a new shadow root inside the div, and create and append a new element
    to the new root. I explain this code point in the discussion that follows.


    ```

    var foo = document.getElementById(''foo'');

    newRoot = foo.createShadowRoot();

    newH2 = document.createElement(''h2'');

    newH2.textContent = ''Hello, shadow world!'';

    newRoot.appendChild(newH2);

    ```


    The first thing to do ① is the creation of a new shadow root inside #foo, using
    the createShadowRoot() method. In the following lines ② I create a new h2 element
    with the text content ''Hello, shadow world!''. And ③ append the new h2 element
    into my new shadow root.'
  merge: -1
