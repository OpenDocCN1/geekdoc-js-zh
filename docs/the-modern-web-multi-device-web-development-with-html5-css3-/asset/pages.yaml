    # YepNope


    I''ve already covered (back in Chapter 3) using media queries in CSS and JavaScript
    for loading resources depending on device dimensions, but what about all the other
    variable capabilities and functionality you could be testing? Maybe you want to
    load resources depending on whether a browser has support for the console or a
    certain API (you''ll read more about those in Chapter 6). You could write custom
    functions that test each critical dependency in turn, but using a conditional
    loader like YepNope.js might be a better option.


    The idea of YepNope is incredibly simple: Give you a condition to test and then
    specify a resource to be loaded depending on the result. As a simple example,
    let''s test to see whether the browser has a console and load a virtual one if
    it doesn''t:


    ```

    ynope({

    test: window.console,

    ope: ''foo.js''

    });

    ```


    You can see what is going on here easily: The yep function is called. It has two
    properties: test, which is the condition to return true or false; and nope, which
    is a resource to load if the value of test is false. If window.console is supported,
    do nothing; if not, load foo.js.


    A few further properties are available, such as yep, which specifies a resource
    to run if the value of test is true; both loads a resource regardless of the value
    of test; and callback, which runs a function when the test is complete. Let''s
    make the previous code example a bit more complex by adding a few of those:


    ```

    ynope({

    test: window.console,

    yep: ''bar.js'',

    ope: ''foo.js'',

    ```'
