  md: 'Landmark roles are applied using the role attribute with a series of predefined
    values. These values do not directly correspond to the HTML5 structural elements,
    but they mostly match very well. For example, if you want to define the document
    area that contains generic information about the site, as the logo and strap line,
    you add the banner role:


    ```

    <div role="banner">...</div>

    ```


    This role is broadly analogous to the header element, and in most cases, will
    be used in its place.

    Some landmark roles do not have an HTML5 equivalent: Believe it or not, no suitable
    element exists for indicating where the main content of the page is, so to let
    the screen reader know the location of key content, we have the main role:


    ```

    <div role="main">...</div>

    ```


    Eight landmark roles are defined in the WAI-ARIA spec:


    +   - **application** Shows an area of a page''s an interactive application rather
    than a document

    - **banner** As mentioned, indicates general site content, probably contained
    in the page header; in this specific context, analogous to the header element

    - **complementary** Shows content that''s related, but not integral, to the main
    content, as a sidebar; analogous to the aside element

    - **contentinfo** Gives you information about the document, as legal instructions.
    Often located in the footer, so in this context, is analogous to the footer element

    - **form** Indicates any form except search, for example, a contact form Indicates
    the core content of a document

    - **navigation** Contains groups of links for navigating this or related documents,
    analogous to nav

    - **search** Indicates forms specifically used to search this site or others


    As well as being useful for navigating and providing any semantic value, the landmark
    roles make convenient styling hooks for CSS. Using the Exact Attribute Value Selector,
    you can easily apply rules to, the page header:


    ```

    div[role=''contentinfo''] { background-color: blue; }

    ```


    This selector has been implemented in pretty much every browser made in the last
    10 years (that I''m aware of), so unless you''re using a very old or basic one,
    this technique is useful—be aware that complex selectors can have an adverse effect
    on page-loading times.'
