    # Spans and Breaks


    Columns are fine when you''re flowing text and other line content into them, but
    at other times you will want to use objects or block elements that don''t fit
    nicely into columns. A couple of related properties help in those circumstances.


    The first is column-span, best for you want to break the flow of the columns with
    a new element that spans all of them. This is a Boolean property—an element spans
    either all columns or none. As such, the permitted values are either all or none:


    ```

    F { column-span: all; }

    ```


    When the value is used, the flow of the line text stops before the element''s
    applied and continues afterward, as shown in Figure 4-3.\When you have elements
    within a grid, you may encounter a situation where the end of a column causes
    a break in the middle of that element. This isn''t ideal if you have, for example,
    a subheading that could be broken over two columns. To avoid this situation, a
    set of properties tries to control where the breaks occur—break-after, break-before,
    and break-inside—work in more or less the same way.'
