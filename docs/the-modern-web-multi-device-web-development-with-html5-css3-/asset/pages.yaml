    var range = document.getElementById('range');\noutput = document.getElementById('output');\n\
    output.defaultValue = 50;\nrange.addEventListener('change', function (e) {\n \
    \ var newValue = e.currentTarget.value;\n  output.value = newValue;\n}, false);\n\
    ```\n\n# Client-Side Form Validation\n\nThe new input types are really useful,\
    \ but perhaps HTML5's greatest gift to developers is native client-side error\
    \ checking. Checking the contents of a form before it's submitted is extremely\
    \ important for security and usability, and until now, we haven't had a simple\
