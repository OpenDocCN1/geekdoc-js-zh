  md: '# Putting It Together


    I''ve only brushed the surface of the Web Components specification, but I hope''ve
    offered enough to get you excited by the possibilities. Web Components promises
    to offer fully reusable components to enhance existing elements. These components
    will be fully encapsulated within the rest of the document and rendered by the
    browser but not accessible through the DOM, although a parallel shadow DOM will
    allow complete manipulation of access to the elements inside each component.


    If the Web Components specification is implemented, it will revolutionize the
    way we build applications and websites. And if that doesn''t get you excited!
    you will be in the wrong business!


    # The Future of CSS


    CSS3 has already revolutionized the Web in some ways, with its introduction of
    behavioral aspects such as transitions and animations and by seriously addressing
    the problem of layout mechanisms. But those features barely scratch the surface
    of what''s to come. Lots of big tech are are betting futures on the Web, and their
    involvement in shaping the future of web standards brings with them incredible
    innovation.


    For example, Adobe''s wholesale embrace of open standards (a pleasant surprise!)
    it is making a major player in browser development, and its experience with graphics
    and publishing is being added to CSS. The first fruits of this labor are CSS Regions
    and Exclusions, which open up the possibility of major changes to the way we lay
    out pages in the future, as web pages finally begin to catch up with what desktop
    publishing has been done for years.


    But the web development community is having the biggest effect on the development
    of CSS. Developer-built JavaScript libraries are directly influencing the language,
    as we see with querySelector and querySelectorAll(back Chapter 5), and that influence
    will be felt further with the introduction of feature queries.


    Additionally, the rise in popularity of CSS preprocessors such as Sass and LESS
    means that front-end developers are becoming accustomed to using programming principles,
    such as variables and functions. The demand for these to be introduced into the
    language is manifesting itself through cascading variables..


    # Regions


    Back in Chapter 4, I discussed CSS columns, where inline content is divided into
    columns and flows through the first column and then the second, and so on. Imagine
    those columns are not immediately adjacent to each other; the first is on the
    left of the page, the second is on the right, and the third is at the bottom,
    but the content flows sequentially through them. That''s the gist of a new CSS
    concept called Regions.'
  merge: -1
  pgno: 216
- img_proc: true
  md: "Regions work like this: An element is declared as a source, and the content\
    \ of that source is flowed into another element, or series of elements, known\
    \ as a region chain. What that means in practice is you have content flowing across\
    \ multiple elements in a sequence that doesn't flow in natural DOM order.\n\n\
    Here's a simple illustration that starts with three div elements: #foo and .bars.\
    \ The first, #foo, is filled with content, and the others are:\n\n```\n<div id=\"\
    foo\">\n  <p>...</p>\n</div>\n<div class=\"bar\"></div>\n<div class=\"bar\"></div>\n\
    ```\n\nThe next step is to get the content of #foo and put it into a named flow,\
    \ kind of storing it in a variable (or the clipboard on your computer). In CSS\
    \ Regions, you created this name by declaring the flow-into property on the source\
    \ element (#foo). The value of property is a unique name of your choosing, so\
    \ I'll name myFlow. Having named my flow (or clipboard, if you're still following\
    \ the metaphor), I can flow it into other elements, which become known as the\
    \ titular regions:\n\n```\n#foo { flow-into: myFlow; }\n```\n\nIn Internet Explorer\
    \ 10, the source element must be an iframe, and the content of the body of the\
    \ linked document will become the content of the flow.\n\nWhen this property is\
    \ applied, the source element and all its children are no longer rendered on screen,\
    \ although they are still visible and accessible in the DOM.\n\nNext I must declare\
    \ a region chain that the content will be flowed into. Each element that forms\
    \ part of the region chain should have the flow-from property declared on it,\
    \ the value of which is the previously defined name flow myFlow. The following\
    \ code shows how to flow the content of flow myFlow into all regions called .bar.\n\
    \n```\n.bar { flow-from: myFlow; }\n```\n\nThe content in myFlow flows through\
    \ the region chain in DOM order; it starts by flowing into the first instance\
    \ of .bar, and then any overflow flows into the second instance of .bar, and so\
    \ on, until the end of the content. Try this out with the file regions.html, as\
    \ shown in Figure 11-4.\n\nAs I mentioned at the beginning of this section, CSS\
    \ Regions work like multiple columns, without the columns needing to be immediately\
    \ adjacent. This new element creates some amazing opportunities for making dynamic,\
    \ interesting page layouts, inspired by years of experience with the possibilities\
    \ of print media.\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_217_0.png)"
  merge: -1
  pgno: 217
- img_proc: true
  md: "Once upon time, a mouse, a bird, and a sausage, entered into partnership and\
    \ set up house together. For a long time all went well; they\n\nlived in great\
    \ comfort, and prospered so far as to be able to add considerably to their stores.\
    \ The bird's duty was to fly daily into the wood and bring in fuel; the mouse\
    \ fetched the water, and the sausage saw to the cooking. When people are too well\
    \ off they begin to long for something new. And so it came to pass,\n\nthat the\
    \ bird, while out one day, met a few bird, to whom he boastfully exasperated on\
    \ the excellence of his household arrangements.\n\n**Figure 11-4:** Using CSS\
    \ Regions, you can flow content across multiple elements that need not to be adjacent.\n\
    \n# Exclusions\n\nCSS Exclusions can be thought of as a kind of positioned floats—indeed,\
    \ an earlier concept described them exactly as that. In CSS2.1 you can float elements\
    \ only to the left, where other content flows around their right side, or vice\
    \ versa. The idea of CSS Exclusions is that you can flow content around an element\
    \ no matter where it is positioned on the page.\nTo illustrate, consider the following\
    \ markup with a container element #foo, some text in a p, and a child element\
    \ #bar:\n\n```\n<div id=\"foo\">\n  <p>...</p>\n  <div id=\"bar\"></div>\n</div>\n\
    ```\n\nI want to position #foo absolutely over the content in #foo, which will\
    \ require style rules somewhat like this:\n\n```\n#foo { position: relative; }\n\
    #bar {\n  left: 20px;\n  position: absolute;\n}\n```\n\nAs written here, #bar\
    \ sits in a layer stacked above the text content, obscuring what's behind it,\
    \ as you can see in Figure 11-5. But I want to make #bar part of the same layer\
    \ and float the text content around. In the parlance of Exclusions, I want #bar\
    \ to become an exclusion element.\nI can accomplish this with the wrap-flow property,\
    \ which makes the element it's applied to an exclusion element. Any sibling content\
    \ flows around it according to the keyword value of the property."
  merge: -1
  pgno: 218
- img_proc: true
  md: 'Once upon a time, a mouse, bird, and a sausage, entered into partnership and
    set up house together. For a long time all went well, they lived in great comfort,
    and prospered so far as to be able to add considerably to their stores. The mouse
    brought fuel for the cooking. When people brought something new. And so it met
    a fellow bird, to whom he boastfully expatiated on the excellence of his household
    arrangements.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_219_0.png)


    Figure 11-5. An element''s absolutely positioned doesn''t affect the flow of the
    content beneath it. [This gorilla photo is by Chris Willis and can be found at
    http://www.fotopedia.com/items/flick-3059127796.] Used under a Creative Commons
    license.


    The following example uses the keyword value both to make content around both
    sides of the exclusion:


    ```

    #bar wrap-flow: both;

    ```


    You can see the difference this makes in Figure 11-6. The elements in the same
    positions as before, but because #bar has now been declared an exclusion element,
    the content in #foo flows it around both sides.


    Once upon a time, a mouse, bird, and a sausage, entered into partnership and set
    up house together. For a long time all went well, they lived in great comfort,
    and prospered so far as to be able to add considerably to their stores. The bird
    was to fly daily into the wood and bring in fuel; the sausage saw to it and always
    began to long for too off new. And so it came to pass, that the bird, while out
    one day, met a fellow bird, to whom he boastfully expatiated on the excellence
    of his household arrangements.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_219_1.png)


    Figure 11-6: Applying the wrap-flow property made the positioned element part
    of the document flow, and the content flows around on both sides.


    Alternative values for wrap-flow include:


    +   * start to do flow content on the left side (in left-to-right languages) of
    the exclusion element, but not the right

    * end to do the opposite

    * maximum and minimum to flow content only on the side with the most or least
    space (respectively) between it and its containing element

    * clear to flow content only above and below the exclusion element'
  merge: -1
