    # Chapter 2: Structure and Semantics


    HTML5 Doctor is the best source information for most HTML5 topics, including the
    clearest definition of the new outline iframe so far, in this article by Mike
    Robinson: http://html5doctor.com/outlines/. You can download the element flowchart
    shown in Figure 2-1 from http://html5doctor.com/resources/#flowchart/. Also see
    Derek Johnston''s article in Smashing Magazine: http://coding.smashingmagazine.com/2011/08/16/html5-and-the-document-outlining-algorithm.


    For more detail about the HTML5 structural elements problem, I strongly suggest
    you read Luke Stevens'' book The Truth About HTML5; find it at http://www.truthabouthtml.com/.
    If you want to read the full HTML5 specification and make up your own mind, I
    advise going for the developer''s version at http://developers.whatwg.org/sections.html.


    Read the WAI-ARIA specification at http://www.w3.org/TR/wai-aria/ in HTML5, and
    this post on landmark roles is directly relevant: http://paciellogblog.com/blog/2010/10/using-wai-aria-landmark-roles.


    Divya Marian''s article on semantics was published by Smashing Magazine at http://coding.smashingmagazine.com/2011/11/our-pointless-pursuit-of-semantic/.
    For more about the importance of semantics, I highly recommend the book Ambient
    Findability: What We Find Who We Become by Peter Morley (O''Reilly, 2005). The
    website http://webdatacommons.org/ provides information and statistics about sites
    that use structured data.


    Read all about microformats at http://microformats.org/. A revision of the syntax,
    microformats 2.0, was started in 2010 and is still underway; learn more about
    at http://microformats.org/wiki/microformats-2.'
