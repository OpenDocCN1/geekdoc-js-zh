- img_proc: true
  md: 'Perhaps more useful though is the ready property. This property is similar
    to the previous one in that it has value states, but these report on the readiness
    of the media to be played—whether it has loaded the meta-data, loaded the file
    fully, and so on. The five states are:


    +   - 0 when no information about the media is available

    - 1 when the metadata of the media has loaded

    - 2 when data is available about the current frame or playback position

    - 3 when information about the current frame and at least the next one is available

    - 4 when sufficient data and an acceptable download rate are available the media
    can be played through the end


    For example, you might want to run a function only when metadata has loaded, to
    obtain a video''s duration. To do this, you need to check that the readyState
    is at 1:


    ```

    if (video.readyState > 0) { ... }

    ```


    Doing this requires constant polling (perhaps using setInterval()), so it’s not
    an optimal solution in all situations. A better solution is to get the browser
    to report this using an event, which I cover in “Media Events”


    # Extra Properties for Audio and Video


    In addition to the shared properties and methods of all media type, both audio
    and video have a unique interface. The HTMLAudioElement interface has just a single
    method, audio(), which is a constructor used to create a new audio element. You
    can optionally add a source URL as an argument:


    ```

    var audio = new Audio(''foo.oga'');

    ```


    The HTMLVideoElement interface contains a series of properties regarding the video''s
    appearance. You can use the poster property to get or set the poster attribute.
    The remaining four attributes regard dimensions: height and width are used for
    the dimensions of the video, whereas height and videoWidth are the dimensions
    of the video as it displays within the element.


    # Media Events


    JavaScript events are fired during the course of loading, playing back, and interacting
    with media files, providing plenty of space for attaching event handlers. Let’s
    begin with events for the multiple stages of the readyState property: State 1
    is represented by loadedmetadata, state 2 by loadeddata, state 3 by canplaythrough,
    and state 4 by canplaythrough.'
  merge: -1
  pgno: 189
- img_proc: true
  md: "For example, the following code logs a message into the console when a video\
    \ file has reached state 4—that is, sufficient data is available for the media\
    \ to play through until the end:\n\n```\nvideo.addEventListener('playthrough',\
    \ function () {\n  console.log('Can play through.');\n}, false);\n```\n\nFor the\
    \ playback state, playing is fired when the media is first played and pause when\
    \ playback is paused. If playback is restarted after a pause, the play event fires,\
    \ and when the media reaches the end, ended fires. If playback is interrupted\
    \ for some reason—for example, if the media is playing but the user restarts manually\
    \ from the beginning—the abort event is fired.\n\nThe volumechange event fires\
    \ when the volume property value changes or the muted audio is toggled, seeking\
    \ when the seek bar is being used, and sought when the seek operation ends. When\
    \ the currentTime property updates, the timeupdate event fires.\n\n# Advanced\
    \ Media Interaction\n\nJust the two media elements (plus their associated API)\
    \ that you've seen so far in this chapter provide many more options for media\
    \ than developers have ever had in the past, but this is only the beginning. Plans\
    \ are already underway to provide more granular control and extensibility to playing\
    \ media natively in the browser, with advanced audio capabilities and peer-to-peer\
    \ data connection as the vanguard.\n\n# Web Audio API\n\nFor people who want to\
    \ go beyond simple playback of audio files, an emerging standard the Web Audio\
    \ API aims to provide high-level processing and synthesizing audio in web applications.\
    \ The Web Audio API is based on the concept of Audio Routes, a common tool in\
    \ sound engineering (but well over my head!).\n\nLike the canvas element, the\
    \ Web Audio API uses a context, which is constructed with the AudioContext() method:\n\
    \n```\nvar context = new AudioContext();\n```\n\nGoing further on this subject\
    \ is far beyond the scope of this book, but if you're interested in advanced audio\
    \ processing, I suggest you read the article “Web Audio API — Getting Started”\
    \ on the CreativeSite (see “Further Reading” on page 175).\n\n# WebRTC\n\nBack\
    \ in Chapter 6, we looked at the getUserMedia() method. There, I mentioned that\
    \ it's part of the wider WebRTC project. WebRTC is an exciting"
  merge: -1
  pgno: 190
- img_proc: true
  md: 'proposal aimed at allowing all web-connected devices to communicate with each
    other, using audio, video, and data in real-time and using a single stan-dardized
    protocol.


    At the moment, many tools do this, but all of them require peer-ins or extra software,
    and very few actually use the same protocol and are able to talk to each other,
    creating a series of "walled gardens" with no way to get data from one to the
    other. WebRTC aims to remove these walls.


    WebRTC has three key APIs: MediaStream gives access to data streams such from
    a camera or microphone (using getUserMedia()), DataChannel allows voice or video
    communication between devices, and generic data communication. As I write this,
    Chrome and Firefox have experimental support for all three, and Opera supports
    MediaStream through getUserMedia().


    As with much of the media landscape on the Web, even the current WebRTC specification
    has an uncertain future. An alternative specification, CU-RTC-Web, has been proposed
    by Microsoft based on their experience of owning the Skype platform. Going into
    detail on either of the two specs is probably a fool’s errand, so I''ll leave
    it at this: Real-time communication will come to the Web, even if the precise
    shape it takes is not currently known.


    # Summary


    In this chapter, you''ve learned how to include media on your page using the audio
    and video elements and the many attributes that you control over how the media
    are displayed. You''ve also seen the Media API, which allows deep interaction
    with media elements, and the broad range of events that are fired by media interactions.


    I also touched on the future audio APIs—a subject I would like to have gone into
    more, but the uncertain landscape prevents me from doing so. Finally, I talked
    about the WebRTC project, an exciting set of APIs that aim to provide amazing
    new ways for us to swap video, voice, and data between devices without third-party
    plug-ins, and a project that deserves a book of its own.


    # Further Reading


    The full text of Steve Jobs’s “Thoughts on Flash” is at http://www.apple.com/hotnews/thoughts-on-flash.


    Advice on audio and video accessibility around autoplay is on the WCAG Audio Control
    page at http://www.w3.org/TR/UNDERSTAND-ING-WCAG20/visual-audio-contrast-dis-audio.html.


    MDN has tables showing the current state of media format implementation across
    different browsers at https://developers.mozilla.org/en-US/docs/Media_formats_supported_by_audio_and_video_elements/,
    and Krok Camen’s technique and notes for cross-browser implementation, “Video
    for Body!,” is at http://camendesign.co.uk/code/video_for_everybody/.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'The best introduction to WebVTT and the track element is on Dev.Opera, http://dev.opera.com/articles/view/an-introduction-to-webviewtt-track/,
    and a useful WebVTT validation tool is on Anne van Kesteren''s website, http://quuz.org/webvtt.


    I mentioned three encoding tools in this chapter: The FFmpeg command-line tool
    is at http://ffmpeg.org/, Miro Video Converter is at http://www.mirovideooconverter.com/,
    and HandBrake at http://handbrake.fr.


    The W3C''s Media Fragments specification is at http://www.w3.org/TR/media-frags.


    MDN has the best documentation of the Media API and Events that I''ve found at
    https://developer.mozilla.org/en-US/DOM/HTMLMediaElement/ and https://developer.mozilla.org/en-US/DOM/Media_events/,
    respectively.


    CreativeJS has a great introductory article on the Web Audio API at http://creativejs.com/resources/web-audio-api-getting-started.


    You can expect to hear a lot more about WebRTC in the future, but Sam Dutton wrote
