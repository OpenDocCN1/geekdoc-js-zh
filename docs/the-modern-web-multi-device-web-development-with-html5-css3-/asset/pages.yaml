  md: 'But fractions really come into their own when mixed with other units. For example,
    say you want to have one fixed-width column and two equal and dynamic columns
    as part of responsive layout. Using fr is perfect for this. In the following code,
    three columns are created: one 15em wide and the remaining two at half of the
    remaining width:


    ```

    { grid-columns: 15em 1fr 1fr; }

    ```


    Adding rows is done in the same way, using all of the same possible units. Say,
    for example, I want to create three rows: The first is 100px high; the second
    has a value of auto, so it is as high as the content contained within it; and
    the third is 15em high. Here''s the code to create these rows:


    ```

    { grid-rows: 100px auto 15em; }

    ```


    Putting all these properties together you fully define your grid. For a simple
    example, let''s create a basic grid of three columns and three rows, for a total
    of nine cells. Here''s the code for that:


    ```

    { display: grid; grid-columns: 1fr 4fr 1fr; grid-rows: 100px auto 15em; }

    ```


    The columns of this grid are distributed in the ratio 1:4:1, and the rows are
    100px at the top, 15em at the bottom, with a central row of automatic height to
    accommodate all the content within it. The grid will look something like Figure
    4-14.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_96_0.png)'
