    <h1>The Book of CSS3, by Peter Gasston</h1>

    <p>What an amazing book! 5 stars!</p>

    </div>

    ```


    This review actually contains two items: the details of the book and a review
    of it. Schema.org has two vocabularies that you can use to mark this semantically:
    they are Book and Review. A visit to the relevant sections shows me which microdata
    patterns I should use. With that, I can update your markup:


    ```

    <div class="review" itemscope itemtype="http://schema.org/Review">

    <h1><span> itemprop="itemReviewed">The Book of CSS3</span></span>, by <span itemprop="creator">Peter
    Gasston</span></h1>

    <p><span> itemprop="reviewBody">What an amazing book!</span><span itemprop="reviewRating">5</span>
    stars!</p>

    </div>

