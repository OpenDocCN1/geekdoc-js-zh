  md: "Updating the bar using script is easy, requiring only a change of the value\
    \ attribute, perhaps in a function somewhat like this one, where any value supplied\
    \ as an argument to the updateProgress function updates the progress bar accordingly:\n\
    \n```\nvar progressBar = document.querySelector('progress');\nupdateProgress =\
    \ function (newValue) {\n  progressBar.value = newValue;\n};\n```\n\nYou can get\
    \ the progress toward the target by using the position property, which returns\
    \ the result of dividing the current value by that of the maximum value; in the\
    \ case of the previous example, the max attribute is 20 and the value is 15, so\
    \ the position is 0.75:\n\n```\nvar currentProgress = progressBar.position;\n\
    ```\n\n# meter\n\nAt glance, the meter element seems superficially the same as\
    \ progress, and indeed, some browsers style the two in the same way. They differ\
    \ semantically, however; where progress shows movement toward a goal, meter shows\
    \ a scale measurement, such as a rating or a poll result. At most simple, meter\
    \ shows a value between 0 and 1.0, just like progress:\n\n```\n<meter value=\"\
    0.5\">0.5 of 1</meter>\n```\n\nThe similarities of progress continue, as you should\
    \ add a text child for browsers that do not represent this graphically, and max\
    \ and min attributes are that of also available if you want to change the scale:\n\
    \n```\n<meter max=\"20\" min=\"10\" value=\"15\">15 of 20</meter>\n```\n\nWhere\
    \ meter differs significantly from progress is in displaying ranges of low, medium,\
    \ and high values, using three new attributes: sets the upper limit of the low\
    \ range, sets the lower limit of the high range, and optimum sets the ideal value.\
    \ If these attributes are present, the meter's current value is either displayed\
    \ as being within acceptable bounds or flagged as being outside.\n\nThe following\
    \ code example illustrates this. Here, any value less than equal to 0.2 is considered\
    \ low and will be displayed with a warning color (often yellow) in many browsers,\
    \ whereas a value greater than or equal to 0.8 is considered high and will be\
    \ likewise flagged (most commonly in red); any number between these two will be\
