  md: '#  Chapter 10: Web Apps


    The Web Store has in-depth documentation on preparing an app for submission, including
    details about the manifest file, at https://developers.google.com/web-store/docs/get_started_simple/


    Firefox Marketplace provides details about the manifest file at https://developer.mozilla.org/docs/Apps/Manifest/,
    and it has a useful validation tool at https://marketplace.firefox.com/developers/validator/.
    Robert Nyman''s talk ''Web APIs and APIs'' is a great primer for building apps
    for the Firefox Marketplace: http://www.slideshare.net/robhnyman/web-apis-apis-mozilla-london.


    The latest version of the W3C widgets specification is at http://www.w3.org/TR/,
    and you will find a useful introduction on Peter-Paul Koch''s site—even it was
    written a few years ago, and some small details of the spec have changed since
    then: http://quicksmode.org/archives/2009/04/introduction_to.html.


    The PhoneGap project is at http://phonegap.com/, and the API documentation is
    at docs.phonegap.com/. You can read the PhoneGap article ''Beliefs, Goals, and
    Philosophy'' at http://phonegap.com/2012/09/phonegap-beliefs-goals-and-philosophy/.


    You can read more about the Titanium project at http://appcelerator.com/


    Each TV platform has its own developer forum, but a good example for getting started
    is Samsung''s at http://www.samsungdeveloper.com/.


    The Opera TV Store is gaining traction as a custom-made solution; learn more about
    it at http://business.opera.com/partners/tv/store/. The Dev.opera has some great
    reference articles on designing and developing for TV at http://dev.opera.com/tv/.


    The Webinos project, which aims to create a standard device API, is hosted at
    http://www.webinos.org/


    The Mozilla Developer Center has AppCache documentation at https://developer.mozilla.org/en-US/docs/HTML/Using_application_cache/,
    and Mark Christian and Peter Lub created a handy page of AppCache facts at http://appcachefacts.info/.
    For all AppCache-draw-backs and techniques for using it, read Jake Archibald''s
    ''Application Cache is a Douchebag'' at A List Apart: http://www.alistapart.com/articles/application-cache-is-a-douchebag/


    #  Chapter 11: The Future


    Web Components are quite new as of this writing, so many resources are around.
    The developer-friendly introduction written by the authors should be your first
    step. Next might be Eric Bidelman''s presentation. Both resources are helpful
    in learning the core concepts. You can find them at http://dvcs.w3.org/hg/webcomponents/raw-file/tip/explainer/index.html
    and http://html5-demos.apposit.com/static/webcomponents/index.html (you may need
    to use Google Chrome to view this correctly).'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'The Shadow DOM is the best-implemented piece of Web Components and, as such,
    has more online documentation. Both Sitepoint and HTML5 Rocks have clearly written
    explanations of the topic, which you''ll find at http://www.sitepoint.com/the-basics-of-the-shadow-dom/
    and http://www.html5rocks.com/en/tutorials/webcomponents/shadowdom/


    If your browser does not support custom elements, X-Tags, an experimental library
    created by Mozilla replicates the behavior of custom elements and has an extensive
    registry of prebuilt components: http://x-tags.org.


    Internet Explorer 10 was the first browser to implement CSS Regions, so their
    documentation is useful for covering the basics. See http://msdn.microsoft.com/en-us/library/ie/hh673537%28-vs.85%29.aspx.


    CSS Exclusions are also in IE10, so their documentation should be the first point
    of call again. Once you have finished them, check out some of the demos from Adobe.
    See http://msdn.microsoft.com/en-us/library/ie/hh673558%28-vs.85%29.aspx and http://adobe.github.com/web-platform/samples/css-exclusions.


    MDN has the best documentation of feature queries, although the API is currently
    undocumented. See https://developer.mozilla.org/en-US/docs/CSS/#supports/.


    As I write this, the only place to learn Cascading Variables is in the draft specification
    which is still ongoing at http://.w3.org/cswg/css-variables.


    If the Box Alignment proposal is still ongoing as you read this, you can follow
    its progress at http://devw3.org/cswg/css-align/ and find the Line Grid proposed
    spec at http://devw3.org/cswg/css-line-grid.


    Håkon Wium Lie and Chris Mills wrote a very nice introduction to CSS pagination
    in their article "Opera Reader: Pagination the Web": http://people.opera.com/home/2011/reader/index.html.
    For more on Pagination Templates, see the Adobe Web Platform blog at http://blogs.adobe.com/webplatform/2012/05/31/pagination-templates-in-css/'
