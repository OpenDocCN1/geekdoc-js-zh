  md: "jQuery is a JavaScript framework that simplifies the way you write scripts,\
    \ abstracting common functions and providing a unified experience across all browsers.\
    \ It works by creating a set of methods that require simple arguments from the\
    \ author but perform some complex tasks. Here's a simple example, I'll talk through\
    \ in a second:\n\n```\n$(document).ready(function () {\n  $('h1').addClass('foo');\n\
    });\n```\n\nThe first line is required to use jQuery; it acts basically like the\
    \ DOMContentLoaded, running the anonymous function when the DOM is ready. The\
    \ second line contains a simple jQuery statement: The first part is a CSS selector\
    \ that selects a node or group of nodes for the action to be applied, and the\
    \ second part is a method that states the action to be applied. In this case,\
    \ a class of foo will be added to all h1 elements.\n\nUsing the selector at the\
    \ beginning of the statement can confuse people, as we construct sentences in\
    \ English in the opposite way; it's like saying \"apple I will eat.\" If it makes\
    \ easier for you to remember, imagine this is how Yoda would use.\n\nUsing jQuery\
    \ doesn't limit you to DOM traversal or manipulation; it does plenty more as well.\
    \ You can use the on() method to attach events--on() is like addEventListener\
    \ with a few advantages, one of which you can specify multiple event listeners\
    \ to be added to a single element. In this example, an anonymous function returns\
    \ whenever any h1 element is clicked or touched\n\n```\n$('h1').on('click touch',\
    \ function () { ... });\n```\n\nAnother fantastic feature of jQuery is its ability\
    \ to chain methods in sequence, mixing selectors and actions to create long strings.\
    \ The following code is a little more complex than I've used so far, so if you\
    \ can work out what it does before I explain it:\n\n```\n$('.foo').on('click',\
    \ function (ev) {\n  $(ev.currentTarget).find('.bar').css('background-color',\
    \ '#foo');\n});\n```\n\nHere's the sequence: first, add a click listener to all\
    \ elements with the class of foo; next, run an anonymous function when event is\
    \ fired, and assign the event object to the variable named ev; in function, find\
    \ all elements with a class of bar that are children of the element that the event\
    \ was fired on and change their background color to #foo.\n\nThe range of different\
    \ methods that jQuery gives you access to is far greater than I could possibly\
    \ list here, I suggest you take a look at the documentation, which is absolutely\
    \ exemplary—especially for an open source project."
