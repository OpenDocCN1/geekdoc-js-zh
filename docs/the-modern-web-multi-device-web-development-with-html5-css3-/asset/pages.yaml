    # Alignment and Stacking


    By default, the items you place on the grid are positioned so their top-left corner
    is at the top-left corner of the designated cell, but you can change this default
    positioning with the grid-column-align and grid-row-align properties. properties
    each take a series of keyword values (center, end, start, and stretch). These
    values set the alignment of the item within its cell.


    The center value obviously aligns the item to the horizontal or vertical center
    of the cell, whereas start and end depend on the direction of writing in your
    document. For those of us English and other left-to-right languages, start aligns
    the item to the left or top of the cell, and end to the right or bottom. The stretch
    value makes the item expand to fill the whole width or height of the cell.


    To show these values work, take a look at the example file grid-align.html. You''ll
    find a grid of three equal cells with an identical item in each. I positioned
    each differently, using the following code:


    ```

    #a { grid-row-align: end; }

    #b { grid-row-align: stretch; }

    #c { grid-row-align: center; }

    ```


    As you can see, each item is aligned differently within the row: #a is aligned
    to the end (bottom), #b stretches to fill the whole cell, and #c is vertically
    centered. You can compare the results in Figure 4-18.'
