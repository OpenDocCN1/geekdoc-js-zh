- img_proc: true
  md: 'Rather than try to capture that here, I''ll refer you to the HTML5 Test, which
    has the most comprehensive and up-to-date coverage. Using the new input types
    is generally considered safe, as the browser will fall back to the type if a different
    value is not recognized.


    The Constraint Validation API is present in IE10 and all other major browsers.
    Safari supports the API but has no on-screen error notifications.


    # # Chapter 9: Multimedia


    The video and audio elements, along with their related APIs, are in IE9 and above
    and all major browsers, although with the caveat about supported file types discussed
    in Chapter 9. The track element is supported in the desktop versions of IE10,
    Safari 6 and above, Chrome, and Opera; Chrome for Android is the only mobile browser
    to offer support. Media Fragments are implemented in Firefox and WebKit browsers.


    The Web Audio API is implemented in Chrome and Safari (iOS and desktop) using
    the `webkitAudioContext()` constructor. Of WebRTC, only the `getUserMedia()` method
    is currently supported, which was mentioned in Chapter 6.


    # # Chapter 10: Web Apps


    Support for AppCache is present in IE10 and all other major browsers.


    # # Chapter 11: The Future


    Chrome is the only browser to have support for the new Web Components features;
    it has implemented the Shadow DOM (with the vendor-prefixed `webkitShadowRoot()`
    constructor) and templates. Both must be explicitly enabled. Work on custom elements
    is underway.


    As I know, no other browser vendors have committed to implementing Web Components
    yet, although I understand that Firefox will be in the future. Firefox already
    has support for scoped styles, as Chrome.


    CSS Regions are implemented in IE10 and Chrome, although, once the latter requires
    that you enable it using a flag. Both require vendor prefixes on the properties,
    and IE10 allows only content inside an iframe as the source.


    Exclusions are available exclusively in IE10, using the `-ms-` prefix. The feature
    queries `@supports` is available in Firefox and Opera, and Firefox also recognizes
    the CSS `supports()` method. Work is underway to bring them to WebKit browsers
    and may already be in place as you read this.


    Cascading Variables are implemented in Chrome only and must be explicitly enabled.'
