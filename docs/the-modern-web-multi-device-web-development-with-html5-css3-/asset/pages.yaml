- img_proc: true
  md: 'A quick way to work out which aspect ratios are greater than others is to divide
    the first figure by the second; a 4/3 ratio works out to 1.333, whereas 8/5 works
    out to 1.6. The larger the result, the wider ratio. The example shown here applies
    only to screens for that number is 1.6 or more.


    Probably more than the very precise figure of an aspect ratio is the orientation
    of the viewport—whether it in portrait mode (height is greater than width) or
    landscape mode (width is greater than height). You query this with the orientation
    feature. This feature is especially useful for handheld devices like phones and
    tablets that can change orientation:


    ```

    @media screen (orientation: portrait) { ... }

    ```


    The max- and min- prefixes don''t apply to this feature for (hopefully) obvious
    reasons.


    # Combining and Negating Media Queries


    You can add a series of logical statements repeated by use of the and keyword
    with extra media queries. When and is used, the rules are applied only if all
    of the media query logic is true; for example, test if a viewport is in landscape
    mode and at least 800em, you could use this code:


    ```

    @media all and (orientation: landscape) and (min-width: 800em) { ... }

    ```


    You can actually simplify this more; all the media type is the default state,
    so you can leave it out of queries, making the first instance of and unnecessary:


    ```

    @media (orientation: landscape) and (min-width: 800em) { ... }

    ```


    You can create a series of media queries and apply the rules if any one of them
    is true, using the comma separator to act like an or operator. In example, the
    rules are applied if either the device is in landscape mode or the width of the
    viewport is at least 800em:


    ```

    @media (orientation: landscape), (min-width: 800em) { }

    ```


    Finally, you can reverse the logic of a media query by using the not operator;
    added to the start of the query, this operator means the rules are applied if
    the logic of the query is false. In this code the rules are applied to any device
    that has an aspect ratio other than 8/5:


    ```

    @media not all and (device-aspect-ratio: 8/5) { }

    ```


    Finding the right balance of media queries for your site can be a complex act
    involving many different variables, but the end result can be extremely satisfying.
    I highly recommend spending time coming to'
  merge: -1
