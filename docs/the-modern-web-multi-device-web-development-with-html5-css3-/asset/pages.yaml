  md: 'Resizing most objects with percentages (or viewport-relative units if you go
    that way) is not a problem; you could simply set the max-width property to 100
    percent to prevent the object ever being wider than its container:


    ```

    img {

    height: auto;

    max-width: 100%;

    }

    ```


    Notice that I also set the auto value on the height to maintain the object''s
    aspect ratio—having a fixed height and a dynamic width (or vice versa) could distort
    the object displayed. Sometimes preserving the aspect ratio is going to mean empty
    spaces on your page on either the horizontal or vertical axis, as the object is
    too small for its container (you can see an example of this in Figure 3-5). If
    that''s the case, you can take advantage of the object-fit and object-position
    properties to control how the object is displayed inside its parent.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_76_0.png)


    Figure 3-5: An image that''s been resized to keep its aspect ratio, leaving empty
    space around it. This image is "Evolution of Impression" by kabils: http://www.photopedia.com/items/flickr-268021436/.
    It is used under a Creative Commons license.


    The first of those properties, object-fit, controls how the object is resized
    within its container. If you use the contain keyword value, the object is resized
    so the whole of it shows inside the container, with its aspect preserved and with
    empty space added on the horizontal or vertical axis as necessary. Alternatively,
    using the cover word marks the shortest length of the object equal to the container,
    with the longest length overflowing the container. Using the fill keyword would
    resize the object to match the container''s dimensions.


    In the example file object-fit.html, you can see these three keywords has three
    div elements with an img size, each of which has a unique id. To this markup,
    I apply the following code:


    ```

    img {

    height: 100%;nwidth: 100%;

    }

    #obj-fill { object-fit: fill; }

    #obj-contain { object-fit: contain; }

    #obj-cover { object-fit: cover; }

    ```


    The results, you can see in Figure 3-6, are as follows: The first element, obj-fill,
    has been resized to the same dimensions as its parent, causing it to be squashed
    horizontally and stretched vertically, and that distortion'
