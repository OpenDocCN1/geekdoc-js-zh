  md: "![](img/c5e4d8671dcefe9f3888e6a849798773_78_0.png)\n\nFigure 3-7: Different\
    \ values for the object-position property\n\n# # The Image Problem\n\nAlthough\
    \ you have seen that resizing and positioning objects using responsive techniques\
    \ is quite straightforward, images are still a source of major problems in responsive\
    \ design for a number of reasons. Chief among them is the question of file size;\
    \ although not always the case, the chances are good that someone using a mobile\
    \ device will be 3G or 4G and will have reduced bandwidth compared to a desktop\
    \ user. That being the case, you don't have to serve them a large, heavy image\
    \ that they have to download over their limited connection.\n\nThis is exacerbated\
    \ by the increase in high-resolution screens. Standard-resolution (IDPR) bitmap\
    \ images (like JPG and PNG) can look low quality on higher-resolution (2DPR) screens.\
    \ HTML currently offers no way to provide higher-resolution images to devices,\
    \ and even if it did, you still have the bandwidth problem. What's the solution?\n\
    \n# # The HTML5 Responsive Images Solution\n\nUnfortunately there, as I write,\
    \ there is no native solution. Although a number of proposals has been put forward,\
    \ none has been officially blessed yet. The proposal that seems to be the most\
    \ popular is to use a new picture element, like so:\n\n```\n<picture alt=\"Description\
    \ of image subject\">\n  <source src=\"small.jpg 1x, small-highres.jpg 2x\">\n\
    \  <img src=\"small.jpg\" alt=\"Description of image subject.\\n</picture>\n```\n\
    \nThree key activities are at work here: ① is the new picture element with the\
    \ alt attribute describing the image (other attributes could also be used here);\
    \ ② is the source element, which lists different source alternatives using the\
    \ srcset attribute—what we use here two alternative image sources, for standard\
    \ screens and one for higher-resolution screens, using the number of the screens\
    \ DPR, which you saw earlier in this chapter; finally, ③ is the current img element,\
    \ which you use as fallback for older browsers that haven't implemented picture\
    \ yet."
