  md: '# 3


    # DEVICE-RESPONSIVE CSS


    ![](img/c5e4d8671dcefe9f3888e6a849798773_55_0.png)


    With a solid structure in place, the next step is to plan how you''re going to
    display your content. You have many different approaches and methodologies to
    choose from. Among the development community''s chatting classes, two of the most
    popular methods of building websites today are adaptive or responsive, both of
    which I explain later in this chapter. For now you just need to know that, at
    their core, they''re similar, with only one mechanism separating the two.


    This chapter will be more about learning the fundamental techniques that allow
    you to make great websites regardless of your approach, and the most important
    technique is something that both adaptive and responsive methods have in common,
    something that is absolutely essential to the new world of multi-device development:
    media queries.'
