- img_proc: true
  md: 'The value of sympathetic layouts becomes really obvious when you use an on-screen
    keyboard that doesn''t support them; switching among different-views for letters,
    cases, numbers, and symbols becomes a real chore. So you help your users out by
    implementing these new types wherever and when-you can.


    # New Attributes


    Before moving on to discuss more input types, I want to make a brief digression
    to talk about some of the many new attributes. These attributes bring some useful
    and crucial new properties and behavior to HTML forms and, once again, are based
    on popular script libraries and workarounds created by developers and made official
    as part of HTML5.


    # autofocus


    The autofocus attribute, which is common to all input types, simply sets the focus
    on the specified element when the page is loaded. In a text field, the cursor
    would already be placed and ready for the user''s input. autofocus is a Boolean
    attribute, so the value to activate it can be either autofocus or left out entirely,
    as shown here:


    ```

    <input type="text" autofocus>

    ```


    If multiple instances of autofocus are used on a page, the first (in DOM order)
    will be respected.


    > Keep in mind that some users, especially those requiring assistive technology,
    may be confused by being automatically focused on a form when the page loads.
    Check out Bruce Lawson''s article "The Accessibility of HTML5 Autofocus" for a
    discussion of best practice (see "Further Reading" on page 160).


    # placeholder


    The placeholder attribute, which you can use on any text-input element (the ones
    I''ve already introduced in this chapter, for), takes a string of characters as
    its value; this string will be displayed inside the input when no value is present.
    Use the string for instructions on the type of value required; for example, in
    an email input you might include something like this:


    ```

    <input type="email" placeholder="e.g. foo@bar.com">

    ```


    The placeholder text should not describe the value of the input—for example, "Work
    email"—as that the role of the label element. Remember the placeholder text appears
    when users click in the box, so they may not remember what field they''re filling
    out if the label isn''t present.'
