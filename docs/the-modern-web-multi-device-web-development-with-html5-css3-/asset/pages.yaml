  md: '# CSS Frameworks and Preprocessors


    Nowadays using a helping hand with CSS development is pretty de rigorous, especially
    when working on large development teams and/or on large projects. Usually these
    helpers come in the form of frameworks and preprocessors and quite often bother.


    A framework is a set of predefined CSS rules that you can use for rapid development;
    they usually cover typography, forms, and quite often, layout patterns. Blueprint.css
    is one of the more venerable frameworks, used on many well-known websites, but
    the current framework is Bootstrap by Twitter, which offers many preformatted
    layout, typography, and forms, a range of reusable components, and even JavaScript
    extensibility.


    Preprocessors are programs that work on the server-side, extending features and
    shorthand syntax in a CSS-like language that is transformed into correctly formatted
    stylesheets at build time. These extensions include saving features like variables
    and nested rules, and custom functions that provide incredible power to the user.
    The two key rivals in the preprocessor are LESS and Sass, with the latter being
    the most popular.


    While both have their role in modern web development, I won''t discuss or use
    either in this book, as what I''m teaching is the more fundamental language that
    both depend on.


    # Browser Support


    You should understand by now the range of browsers running on those devices is
    unknowably vast and varied, and even within those browsers there is a variety
    of versions and implementations (I hope you understand that, as of the introduction
    was dedicated to trying to get that point across). Being the case, some of the
    features in this book may not be implemented or may be implemented slightly differently.


    Rather covering the levels of implementation in the text, I treat every new feature
    as if it''s fully implemented and make a note of real-world implementation oddities
    and curiosities in Appendix A.


    Also, cutting-edge standard proposals are subject to change, when experimental
    implementations have already shipped in some browsers (the Grid Layout module
    in Chapter 4 was updated when I wrote this book), by the time you read this, the
    syntax in the book may already be out-of-date. This is an unfortunate risk when
    working with evolving standards in dead tree publishing, but I try to mitigate
    it by noting features that may be at risk of changing and by keeping a list of
    errata and updates on the companion website, http://modernweb.com/.


    You''ll probably want to follow a few online resources to learn about implementation,
    although most tend to be focused on desktop and mobile browsers. Can I... shows
    levels of support for a wide range of technologies in recent past, and future
    versions of popular browsers, whereas HTML5 Please shows how it is in general
    to use cutting-edge features, mostly CSS3 and JavaScript (which is why the name
    annoys me a little).'
  merge: -1
