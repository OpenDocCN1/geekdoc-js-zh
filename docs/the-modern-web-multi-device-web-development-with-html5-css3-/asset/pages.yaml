    ```


    When inline content is flowed into columns in a parent element with (much as possible)
    no fixed height, the browser displays the number of lines in each column, possibly
    leaving some empty space at the bottom of the parent element. But if the element
    has a set height, you can choose how the text will flow, using the column-fill
    property.


    The default for column-fill is balance, which distributes the lines evenly. The
    alternative behavior is for the columns to be filled sequentially, to their maximum
    height, or more likely a final column with fewer lines and lots of unused space.
    If this is your preference, you can set it with the keyword auto.


    # Gaps and Rules


    As mentioned earlier, between each column is a default len gap. You can alter
    that gap with the column-gap property. This property accepts a single length value,
    and it increases the gap between each column to the specified length. Here''s
    an example:


    ```

    { column-gap: 2em; }

    ```'
