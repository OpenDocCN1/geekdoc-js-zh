  md: 'using the autoplay attribute and make it loop indefinitely (until the user

    paus it or leaves the page) by using the loop attribute; both are Boolean,

    so they require no value:


    ```

    <audio src="foo.oga" autoplay loop></audio>

    ```


    Autoplayed sound has accessibility drawbacks; see the WCAG Audio Control advice,

    listed in "Further Reading" on page 175, for more information on how to cater

    to everyone.


    On some mobile devices, media files won''t play where they''re embed-

    ed the page; instead, they''re launched and played in the device''s own

    media player framework. If this happens, the autoplay attribute is ignored.


    If you autoplay or loop a file, keep in mind that the sound can be

    anoying or confusing to some users and considering muting the volume by

    default using the muted attribute:


    ```

    <video src="foo.ogg" muted></video>

    ```


    The full media file isn''t normally downloaded when the page loads,

    but only when playback is restored; instead, metadata about the file—

    length, size, and so—is loaded into memory (a key exception to

    is when the autoplay attribute is applied, which requires the full file to be

    downloaded). If you prefer to change this behavior, you can use the preload

    attribute, which has three values: metadata is the default and behaviors as-

    auto indicates to the browser that it should download and cache the

    file because the user will probably play it; and none means the file probably

    be used, so don''t download anything.


    ```

    <video src="foo.ogg" preload="auto"></video>

    ```


    Note that these are only hints, not commands; the browser makes the

    final decision about when to download media files based on variables

    as the current network and the device that is running the browser. Mobile

    browsers will likely ignore the auto value, downloading a potentially huge

    ideo when the user has metered bandwidth is a real no-no. In many cases,

    metadata is the sole acceptable value.


    # Extra Attributes for the video Element


    Although the audio and video elements share many attributes, the latter,

    virt of having more of a presence in page layout, also has several extra

    attributes. Video files will, by default, displayed on the page at the dimens-

    s in which they were coded. You can change this using the height and

    width attributes:


    ```

    <video src="foo.ogg" height="360" width="240"></video>

    ```'
