  md: "And you can do this at a more local level with the formnovvalidate attribute\
    \ on an input or button element.\n\n```\n<button type=\"submit\" formnovvalidate>Go</button>\n\
    ```\n\nThis option is useful when you want to have an option to submit without\
    \ validation. For example, in a content management system, allowing the user to\
    \ save a page for editing at a later date, without publishing it, is quite common;\
    \ the data might be in an incomplete state and invalid, so running validation\
    \ would only annoy the user.\n\n# The Constraint Validation API\n\nNative validation\
    \ is great, but at times you may want to do more with it by adding some custom\
    \ validation or creating your own error-reporting framework. The Constraint Validation\
    \ API has a series of objects, properties, and methods aimed at giving you the\
    \ flexibility to extend the browser's validation system or to roll your own.\n\
