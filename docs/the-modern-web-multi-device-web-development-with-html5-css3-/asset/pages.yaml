  md: 'In fact, two media features are available. The first, and most widely used
    owing WebKit''s popularity on mobile devices, is a proprietary feature calledwebkit-device-pixel-ratio.
    This feature—along with the related max- and min- prefixes—lets you target a device''s
    DPR. For example, here''s how to add a high-resolution image to devices with a
    DPR of at least 2:


    ```

    E { background-image: url(''foo.png''); }

    @ screen and (-webkit-min-device-resolution: 2) {

    E { background-image: url(''foo-hi-res.png''); };

    }

    ```


    WARNING Remember that a high-resolution device doesn''t automatically mean a good
    Internet connection. The user might not thank you for making him or her download
    a 600kb image over a low 3G connection.


    All pretty straightforward, right? Wrong. -webkit-device-pixel-ratio is, as mentioned,
    a WebKit-proprietary CSS extension and not part of the Media Queries specification.
    The spec actually contains a similar query, resolution. This query immediately
    improves upon -webkit-device-pixel-ratio by being more flexible in the values
    it accepts; you, for example, use the dpi unit. A standard monitor has a DPI (or
    PPI) of 96; while being the case, you can target those monitors with this:


    ```

    @media screen and (resolution: 96dpi) {

    E { background-image: url(''foo.png''); };

    ```


    But you can also target higher-resolution screens by multiplying the standard
    count, 96, by the DPR. For example, the following query applies to devices with
    a DPR of 2 or above, just like in the -webkit-device-pixel-ratio a few paragraphs
    ago:


    ```

    @media screen and (min-resolution: 192dpi) {

    E { background-image: url(''foo-hires.png''); };

    ```


    You can do this in an even better way, however, by using the dpx unit. This unit
    is equivalent to the DPR, an updated version of the previous employs this code:


    ```

    @media screen and (min-resolution: 2dppx) {

    E { background-image: url(''foo-hires.png''); }

    }

    ```


    -webkit-device-pixel-ratio has been around since the iPhone was launched in 2006,
    and an awful lot of legacy devices are out there, so this this extension is not
    going anywhere in a hurry. That being the case, you''re probably going to have
    to test for by extending the media query with'
