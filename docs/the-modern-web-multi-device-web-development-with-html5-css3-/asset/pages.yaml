    You can combine multiple effects into a single filter by stacking them as children
    of the filter element. In the next code snippet, I apply the Gaussian Blur as
    before, albeit with a slightly lowered stdDeviation value, but I also add a second
    filter, feMorphology. This filter is used to erode or dil the input image, and
    in this case I want to erode it, so I use the erode operator attribute, with a
    radius attribute value of 2.


    The code for my completed two-stage filter, which you can see for yourself in
    svg-filters.html (the result is shown in Figure 7-6), looks like this:


    ```

    <filter id="filter1">

    <feGaussianBlur stdDeviation="2"/>

    <feMorphology operator="erode" radius="2" />

    </filter>

    ```


    ![](img/c5e4d8671dcefe9f3888e6a849798773_149_1.png)


