- img_proc: true
  md: '# Chapter 6: Device APIs


    The Geolocation API is in IE9 and all major browsers. Device orientation is in
    mobile WebKit browsers, Chrome, and Firefox mobile. Do bear in, however, that
    device APIs depend on certain functions being available on the phone; just because
    the Device Orientation API is implemented in a browser, it doesn''t necessarily
    follow that the device has an accelerometer.


    Opera has implemented the Full Screen API, as desktop WebKit browsers, Chrome
    for Android, and Firefox. The WebKit and Firefox have some subtle differences,
    but rather than explaining those here, I''ll refer you to the MDN article: "Fullscreen
    Mode" at https://developer.mozilla.org/docs/DOM/Using_fullscreen_mode/: :-full-screen
    and -webkit-screen pseudo-classes, respectively.


    The Vibration, Battery Status, and Network Information APIs are available in Firefox
    mobile only. Despite support for each apparently landing in Firefox throughout
    2012, I can''t find any working implementations.


    The getUserMedia() method is implemented in Opera, and in Firefox and Chrome with
    vendor prefixes (getgetUserMedia()). Firefox requires that you opt in to use getUserMedia()
    with the media.navigator.enabled flag because of its experimental nature.


    Web Storage is in IE8 and above all other major browsers.


    The Drag and Drop API is partially supported in IE8 and IE9, and fully implemented
    in IE10 and all major desktop browsers. Owing to its nature, it''s not supported
    in mobile browsers.


    The File API is fully implemented in Firefox, Chrome, Safari (iOS and desktop),
    and Opera, and partially supported in IE10 and Android. The FileReader API is
    fully implemented in IE10 and all other desktop browsers, plus Web mobile browsers
    including Android from version 3.0.


    # Chapter 7: Images and Graphics


    Some form of SVG support is present in IE9 and above, Android 3.0 and above, and
    all other major browsers. SVG filters are slightly more limited, being unavailable
    in IE9 and Android, although using SVG filters on HTML elements works in Firefox.
    The new CSS filter() function is currently implemented in nightly Chrome builds,
    but it is disabled by default. The use of fragment identifiers in SVG is possible
    only in IE10 and Firefox.


    Support for the canvas element is in IE9 and above and all other major browsers.
    Firefox, Chrome, Safari (desktop), and Opera all have implementations of WebGL,
    although it''s disabled by default in some browsers, notably Safari and Chrome
    for Android.


    # Chapter 8: New Forms


    Levels of support for the various form elements, especially those with screen
    controls, wildly among browsers and are changing all the time.'
  merge: -1
