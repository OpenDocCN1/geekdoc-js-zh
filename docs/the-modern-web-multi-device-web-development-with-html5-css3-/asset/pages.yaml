  md: "HTML5 has other new elements that don't affect the basic structure of a page;\
    \ I'll cover where necessary throughout the rest of this book.\nFor now, let's\
    \ look further into the reason these new elements were created in the first place.\n\
    \n# What's the Point?\n\nThe stated aim of these new elements is to provide clear\
    \ document outlines for better parsing by the browser and other machines, notably\
    \ assistive technology like screen readers. Consider these outlines to be document\
    \ maps, showing the hierarchy of the content within, which headings are most important,\
    \ the parent-child relationships between content areas, and so on.\nIn HTML4,\
    \ this task was mostly done using the header elements, h1 through h6: the h1 would\
    \ be or the most important heading on the page, h2 elements were usually the direct\
    \ children of h1, and so on. Seeing something like this was fairly common:\n\n\
    ```\n<h1>Great Apes</h1>\n<h2>Gorilla</h2>\n<h3>Eastern Gorilla</h3>\n...\n<h2>Orangutan</h2>\n\
    ...\n```\n\nNesting headings in this way creates this document outline:\n\n+ \
    \  1. Great Apes\n   a. Gorilla\n      i. Eastern Gorilla\n      ii. Western Gorilla\n\
    \   b. Orangutan\n\n> Great ape fans notice that I've left out the bonobo and\
    \ the chimpanzee. For that reasons of space and clarity, not because of any bias.\n\
    \nThe structure I created makes visual sense, and using headings in this way to\
    \ create a document outline is known as implicit sectioning.\nIn HTML5, the sectioning\
    \ content elements introduced earlier in this chapter create the sections in the\
    \ document, not the headers within sections. This is explicit sectioning. So to\
    \ get the same structure with Great Apes markup in HTML5, we'd go for something\
    \ like this:\n\n```\n<h1>Great Apes</h1>\n<section>\n<h1>Gorilla</h1>\n```"
  merge: -1
