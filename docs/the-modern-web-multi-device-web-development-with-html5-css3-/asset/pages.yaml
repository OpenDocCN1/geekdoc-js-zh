    ![](img/c5e4d8671dcefe9f3888e6a849798773_77_0.png)


    Figure 3-6: Different values for the object-fit property (left to right): fill,
    contain, cover


    By default, the object sits dead center of its parent when object-fit is applied,
    but you can change that with the object-position property. This property works
    like the background-position property in that you can use two values to specify
    an offset from the top left of the container or extra positional keywords (top,
    right, bottom, left, center) to offset from another side. For example:


    ```

    E { object-position: bottom 10px right 2em; }

    ```


    The example file object-position.html shows three different values for the object-position
    property. The markup is essentially the same as the previous example, the relevant
    CSS for this has been updated:


    ```

    img {

    height: 100%;

    width: 100%;

    object-fit: contain;

    }

    #obj-1 { object-position: center top; }

    #obj-2 { object-position: center bottom; }

    #obj-3 { object-position: right; }

    ```


    The result is shown in Figure 3-7. All three img elements have contain applied
    to the object-fit property, but that''s just for the sake of illustration and
    not required. The first image, #obj-1, is positioned in the horizontal center
    of its parent and the vertical top; #obj-2, is still at the horizontal center,
    but now the vertical bottom; the last image, #obj-3, has been cropped to portrait
    dimensions to show it is positioned to the right of its parent.'
