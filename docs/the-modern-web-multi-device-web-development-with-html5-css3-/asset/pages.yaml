  md: "All of the events in the Drag and Drop API create an object called dataTransfer,\
    \ which has a series of relevant properties and methods. You want to access these\
    \ when the drop event is fired. For img, you want to get the URL of the item,\
    \ so for this you use the getData() method with a value of URL and do something\
    \ with it; in this example, I'll create a new element and pass the URL to the\
    \ src attribute, making a copy of the one:\n\n```\ntarget.addEventListener('drop',\
    \ function (e) {\n  e.preventDefault();\n  var newImg = document.createElement('img');\n\
    \  newImg.setAttribute('src', e.dataTransfer.getData('URL'));\n  e.currentTarget.appendChild(newImg);\n\
    });\n```\n\nNote the use of preventDefault() again inside the function callback;\
    \ this is important, because in most (if not all) browsers default behavior after\
    \ dropping an item into a drop zone is to open its URL. This is part of Drag and\
    \ Drop's arcane behavior. You really need to know is to use preventDefault() to\
    \ stop this from happening.\n\nYou can see a simple example based on the previous\
    \ code in the file drag-drop.html—just drag the image from its starting position\
    \ to inside the box.\n\nI said previously that, by default, only a and img elements\
    \ are draggable, but you can make true of any element in two steps. First, apply\
    \ the value to the draggable attribute of the element in question:\n\n```\n<div\
    \ draggable=\"true\" id=\"text\">Drag Me</</div>\n```\n\nSecond, specify a datatype\
    \ for the element. You do this with the drag event, using the setData() method\
    \ of dataTransfer to apply a MIME type (in this case, text/plain) and a value\
    \ (in this case, the text of the element:\n\n```\nvar txt = document.getElementById('txt');\n\
    txt.addEventListener('dragstart', function (e) {\n  e.dataTransfer.setData('text/plain',\
    \ e.currentTarget.textContent);\n});\n```\n\nYou can detect the type of file being\
    \ dropped using the contains() method, which is a child of the types object, itself\
    \ a child of the dataTransfer object created in the callback function of the drop\
    \ event. The method returns true false if the string supplied in the argument\
    \ matches a value in types; for example, to find out if a dropped element contains\
    \ a plain text type, you would use this:\n\n```\nvar foo = e.dataTransfer.types.contains('text/plain');\n\
    ```"
