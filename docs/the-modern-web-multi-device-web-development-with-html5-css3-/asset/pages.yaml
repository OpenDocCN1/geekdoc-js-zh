    # Data Attributes in the Wild


    Data attributes are so useful that some companies already take extensive advantage
    of them. Twitter was quick to adopt them, allowing them to be used as an option
    for adding a Tweet button to web pages. Certain parameters about the content are
    stored in a set of predefined attributes:


    ```

    <a href="https://twitter.com/share" class="twitter-share-button" data-url="http://broken-links.com"
    data-via="stopsatsgreen@">Tweet</a>

    ```


    By including a call to Twitter JavaScript on the page, this element is replaced
    by a Tweet button using the supplied data. Many other social services, such as
    Facebook, Google+, and LinkedIn, use data attributes in the same way.


    # Web Components: The Future of Markup?


    An exciting new approach to extending HTML is in the proposal for what''s currently
    known as Web Components. This is a collective title for a group of technologies
    that aim to make it easy to create rich interfaces for web applications, using
    CSS and markup.


    As I write, the specification is at draft stage and very much subject to change,
    instead of talking about it here, I''ll cover Web Components in more detail in
    Chapter 11.


    # Summary


    In this chapter, I''ve covered a core function of a good website or application:
    the underlying structure. Using markup in a correct and meaningful way lays the
    foundations for everything I''m going to cover in this book and will be extremely
    important to making sure your sites are maintainable and scalable.


