    The technique for stacking SVG icons was developed by Erik Dahlstrom and is described
    on the blog of Simurai: http://simurai.com/post/2025013889/svg-stacks/. Mozilla''s
    Robert O''Callahan warns of the possible changes to the stacking technique: http://robert.ocallahan.com/2012/10/impending-doom-for-svg-stacks-sort-of.html.
    I detailed the svgView on my blog, Broken Links: http://www.broken-links.com/2012/08/14/better-svg-stacks-with-fragment-identifiers/


    The IE Drive has a hands-on tool for experimenting with SVG Filters: http://ie.microsoft.com/testdrive/graphics/hands-on-css-3/hands-on_svg-filter-effects.html.


    Dir Schulz wrote a good, concise introduction to the features planned for SVG2:
    http://schulz.com/blog/articles/8/new-features-in-svg2.


    You can find a good range of canvas, from beginner to expert level, at http://www.html5canutorial.com/,
    and an excellent cheat sheet with all the core properties and methods on Jacob
    Seidlin''s blog at http://blog.niknik.dk/2009/02/html5-canvas-cheat-sheet.html
    (updated in 2009 but still relevant).


    HTML5 Rocks has a tutorial on more advanced image manipulation effects at http://www.html5rocks.com/en/tutorials/canvas/filters/


    In his blog post "Building a Live Green Screen with getUser() and MediaStreams",
    Tim Taubert explains the basics of live video manipulation: http://timtaubert.de/blog/2012/10/building-a-live-green-screen-with-getmedia-and-mediastreams/


    The Learning WebGL blog has lessons for complete beginners on working in a three-dimensional
    context at http://learningwebgl.com/lessons/, and Web.com has frequent roundups
    of demos, tutorials, and developer meet-ups: http://www.webgl.com.


    # Chapter 8: New Forms


    The ever-helpful MDN provides a concise and complete guide to the new input types
    at https://developer.mozilla.org/en-US/docs/HTML/Element/Input/. PPK has detailed
    tables showing support on the desktop at http://www.quirksmode.org/html5/inputs.html
    and for mobile devices at: http://www.quirksmode.org/html5/inputs_mobile.html.


    Ryan Seddon wrote a polyfill for providing HTML5 capabilities to browsers that
    don''t support them natively; it is at https://github.com/ryanseddon/H5f/


    Further Reading 223'
