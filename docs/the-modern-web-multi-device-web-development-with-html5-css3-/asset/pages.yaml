- img_proc: true
  md: 'traversal for styling easier, and more dynamic effects such as two- and three-dimensional
    transitions and transitional animations (you can read more about these in The
    Book of CSS3, by this author, from this publisher).


    But beyond they visual effects, the revolution of CSS3 has come through media
    queries, a syntax that allows you to provide browsers based on their dimensions
    and capabilities, the first step toward true multi-device styling. I cover media
    queries in Chapter 3, along with a range of other CSS properties that are useful
    for building responsive and adaptive websites.


    The next big challenge for CSS to solve is the issue of layout—that is, to enable
    layouts that are truly sympathetic to the capabilities of the user viewing them.
    These include properties for dynamic user interfaces and CSS-controlled grid systems,
    which you''ll read more about in Chapter 4.


    CSS3 is not a single spec as CSS2.1 was in the document; it is far too big and
    complex for. Instead CSS3 is modular—a series of shorter, more specific properties
    that can be implemented by browsers in a modular way. With HTML5, the idea of
    waiting until CSS3 is "ready" before using it is foolish, as some modules will
    be ready and implemented long before others.


    CSS modules are given level numbers to show how many iterations they''ve been
    through; some are already at level 4, and they could be implemented before others
    that are at level 3. This doesn''t mean, however, that one day we''ll have a CSS4;
    CSS3 is a shorthand term for "everything except CSS2.1," and one day distinction
    will be dropped and everything will be just CSS.


    # Vendor-Specific Prefixes


    When browsers implement features in an experimental or prestand way, they try
    to make them safe using vendor-specific prefixes to avoid compatibility problems
    with standardized property names. Consider, for example, that CSS Ares proposes
    a new property called gorilla, and both Firefox and WebKit implement it experimentally
    but slightly differently. If both used the same property name, the effect would
    be different in each browser; instead, they avoid potential conflicts by using
    a vendor prefix:


    +   -moz-gorilla: foo;

    -webkit-gorilla: foo;


    In principle, the system is great, but in reality, things have gotten confused.
    Among other problems, some prefixed properties become so widely used by developers
    that other browser makers feel the need to implement their rivals'' vendor prefixes
    too, which is justifiable but makes the whole nonsensical.


    Browser makers are trying to bring this system under control, but on occasion
    vendor-prefixed properties will be unavoidable. In most cases, I only use unprefixed
    properties in my code examples and make a note in Appendix A of where vendor prefixes
    need to be.'
