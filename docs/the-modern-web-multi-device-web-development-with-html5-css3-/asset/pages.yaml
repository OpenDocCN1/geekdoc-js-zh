  md: '# Feature Queries


    In Chapter 5 I discussed the JavaScript library Modernizr, which is used for detecting
    the existence of certain features in a visitor''s browser, and briefly mentioned
    its native adaptation into CSS through the @supports at-rule. I want to return
    to that now explore it in a little more detail, as it is extremely useful and
    fast making its way into browsers.


    The @supports at-rule behaves like a media query: You create a logical query,
    if it returns true, will apply the rules contained within the subsequent brackets.
    Instead of media features, the test conditions are CSS property-value pairs, known
    as feature queries. For example, to test whether a user''s browser supports the
    column-count property so you can serve appropriate styles, you could construct
    a query like this:


    ```

    @supports (column-count: 1) { ... }

    ```


    As media queries, you can build more advanced queries using logical operators.
    For example, the following query uses the or to serve styles to browsers that
    support both the column-count and box-sizing properties:


    ```

    @supports (column-count: 1) and (box-sizing: border-box) { ... }

    ```


    You can also use the or operator to build queries that detect defined features,
    which is extremely useful when dealing with vendor-prefixed properties. However,
    the hyphens or -moz-hyphens properties are tested against, and if either is supported,
    the rules are:


    ```

    @supports (-moz-hyphens: auto) or (hyphens: auto) { ... }

    ```


    The not operator allows you to serve styles to browsers that don''t support a
    given property. (Note that unlike the other operators, this one must be inside
    parentheses).


    ```

    @supports (not (-webkit-hyphens: auto)) { ... }

    ```


    Feature queries include an API that is as simple to use as the at-rule. For example,
    you can use the CSS.supports() method to detect a single feature by passing a
    property-value pair as two arguments. Here, it tests for the flex value on the
    display property:


    ```

    var supports = CSS.supports(''display'', ''flex'');

    ```


    And you can pass in full queries as a single argument, quoted as a string:


    ```

    var supports = CSS.supports(''column-count: 1) and (display: flex);

    ```'
  merge: -1
  pgno: 223
- img_proc: true
  md: "The Modernizr project has already begun implementing this in its library; if\
    \ native CSS.supports() implementation is present, the script will use that, and\
    \ if not, it will fall back to Modernizr's own tests.\n\n# Cascading Variables\n\
    \nVariables have proven their utility over the years in just about every programming\
    \ language, but they have never been implemented in CSS, despite regular calls\
    \ for implementation from the community. With the surge in popularity of CSS preprocessors,\
    \ a generation of coders is learning to love variables in their stylesheets, and\
    \ all to include them natively in the language can no longer be ignored.\n\nAs\
    \ currently proposed, CSS variables have limited scope. A true variable permits\
    \ any use at any point in the code—say, to assign a selector to a variable. The\
    \ proposed CSS variables can be assigned only a valid CSS value and can be used\
    \ only as the value of a property. For this reason, they are distinguished by\
    \ the name Cascading Variables.\n\nEach Cascading Variable is declared using a\
    \ *custom property*: a user-defined property beginning with var- which a value\
    \ is assigned. Here, the color value #F00 is assigned to the custom property var-foo:\n\
    \n```\n:root {\n  var-foo: #F00;\n}\n```\n\nNote that I've declared this custom\
    \ property using the :root selector.\n(I explain shortly.)\\To use the value of\
    \ the custom property, you call it using the var() function, with the user-defined\
    \ name (the bit after var-) in parentheses. The value of the custom property is\
    \ used as the value of the property it's called on. For example, in the following\
    \ listing, the h1 element calls the var-foo property using the var(foo) function\
    \ twice: once on the border-bottom property and once on color. The color value\
    \ #F00 will be applied appropriately to each property.\n\n```\nh1 {\n  border-bottom:\
    \ 1px solid var(foo);\n  color: var(foo);\n}\n```\n\nCascading Variables are *scoped*,\
    \ meaning they apply only to the element on which they are declared and to any\
    \ child element. My use of the :root selector to declare a custom property in\
    \ the example in this section means the variable has *global scope*: It can be\
    \ applied on any element on the page. Had I used a different selector, the value\
    \ of the variable declared in the custom property would apply only to children\
    \ of the matching element()."
  merge: -1
  pgno: 224
- img_proc: true
  md: "For example, in the following code the custom property var-foo, with a value\
    \ of #FO0, is declared on the :root element, but I'll also add a different value\
    \ and selector below it. In this case, the value of the variable will be #FO0\
    \ for the whole document, but it will now be #0OF for the .bar element and its\
    \ children.\n\n```\n:root {\n  var-foo: #FO0;\n  .bar { var-foo: #0OF; }\n}\n\
    ```\n\nIn the longer term, the preprocessor favorite mixins will also be implemented\
    \ in CSS. A mix is like an extended variable, allowing blocks of code to be reused\
    \ across multiple selectors. There's even been talk of implementing full variables,\
    \ allowing replacement of property names and selectors.\n\n# Summary\n\nIn this\
    \ chapter, we've looked at some of the more experimental features of the web platform.\
    \ These are all still in the testing phase and are liable to change, they're so\
    \ powerful and potentially important to the platform's future that I couldn't\
    \ really finish this book without mentioning them.\n\nFirst up was Web Components,\
    \ the biggest change to HTML since its invention. Web Components is a suite of\
    \ features. It makes a parallel DOM that allows reusable code blocks to enhance\
    \ and extend the standard HTML elements with full encapsulation, protecting them\
    \ from conflicts with other CSS rules and JavaScript functions.\n\nNext we looked\
    \ at the future of CSS, which is undergoing changes to the involvement of big\
    \ tech companies. CSS Regions and Exclusions promise to provide the tools required\
    \ to create dynamic custom layouts that rival (and exceed?) anything in print\
    \ media.\n\nFinally, I covered new CSS features that are being developed based\
    \ on innovation from the web development community. These features that bring\
    \ native Modernizr-like feature detection to CSS and Cascading Variables that\
    \ begin the adoption of the best preprocessor features into the language itself.\n\
    \n# Further Reading\n\nWeb Components are quite new as of this writing, so not\
    \ many resources are around. The developer-friendly introduction written by the\
    \ spec authors should be your first stop. Next might be Eric Bidelman's presentation.\
    \ Both resources are helpful in learning the core concepts. You can find them\
    \ at http://dv.w3.org/hg/webcomponents/raw-file/explainer/index.html and http://html5-demos.appspot.com/static/webcomponents/index.html\
    \ (you may need to use Google Chrome to view this correctly)."
  merge: -1
  pgno: 225
