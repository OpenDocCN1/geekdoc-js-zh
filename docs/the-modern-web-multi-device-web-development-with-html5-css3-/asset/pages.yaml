  md: 'The only JavaScript you need to use the tags when you''re not using default
    CSS or JavaScript; for example, some releases of Firefox experimental implementations
    of recent versions of JavaScript, and for safety''s sake you require to include
    a flag on the type attribute if you want to use it:


    ```

    <script src="foo.js" type="application/javascript;version=1.8"></script>

    ```


    HTML5 is also very forgiving of syntax. Whether your preference is to use all
    lowercase cases, quote your attribute values, or leave empty elements, HTML5 is
    happy to parse and understand. That being the case, all of these are equal:


    ```

    <img src="foo.png">

    <img src="foo.png" />

    <IMG SRC="foo.png">

    ```


    Attribute values require quotation marks when they have multiple values, such
    as a list of class names, or if they contain special characters.


    Some attributes, known as Boolean attributes, have only one or false values; their
    presence is presumed to mean true unless otherwise specified, so you don''t need
    to supply a value—unless you''re using an XML-like syntax where values are required,
    in which case you use the name of the attribute. This means both of these are
    the same:


    ```

    <input type="checkbox">

    <input type="checkbox" checked="checked">

    ```


    My preference is to use all lowercase, all quoted, but not to close elements:


    ```

    <img src="foo.png">

    ```


    This is the style I use throughout the book, as I find it neater and easier to
    work with, and the text editor I use has syntax highlighting, which makes looking
    through the code nice and clear. You can use whichever system you want, but be
    consistent to help maintainability.


    # CSS3 and Beyond


    As HTML5 is to HTML4.0, so CSS3 is to CSS2.1: an evolutionary iteration that standardizes
    some existing features that are implemented differently across browsers, and introduces
    a whole new set of features to make CSS fit for purpose in a world where web browsers
    can be embedded anywhere.


    The first CSS3 to make it into browsers were largely presentational based on hacks
    that developers had been using for years: using fonts from any source, rounded
    corners, and drop shadows on text and boxes. Next to land were a range of new
    selectors that made document'
  merge: -1
