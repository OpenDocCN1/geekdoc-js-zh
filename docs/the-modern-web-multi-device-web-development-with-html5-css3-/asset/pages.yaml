    \ as `willValidated`. By default, all form elements return true, unless they are\
    \ explicitly set to—for example, by using the disabled attribute.\n\nYou could\
    \ use `validate` to run actions only on form elements that will be validated,\
    \ in this code:\n\n```\nvar inputFields = document.querySelectorAll('input');\n\
    inputLen = inputFields.length;\nfor (i = 0; i < inputLen; i++) {\n  if (inputFields[i].willValidate)\
