    \ depending on the\nresult; in this case, if the viewport is at least 800px wide,\
    \ the function\nfoo() runs:\n\n```\nvar mq = window.matchMedia('screen and (min-width:\
    \ 800px)');\nif (mq.matches) { // do something }\nelse { // do something else\
    \ }\n```\n\nIn the file mq-matches.html, you can see a short script I've written\
    \ based\non this logic, which simply shows an alert that tells you whether your\n\
    window is at least 800px wide; try resizing your browser window\nand refreshing\
    \ the page to see different results.\n\nTaking advantage of JavaScript's dynamic\
    \ nature, you can extend this\nwith a listener that fires if the device's state\
    \ changes, for example, if the user\nresizes or her browser window or changes\
    \ the orientation of or her\ndevice. I can extend my previous snippet by adding\
