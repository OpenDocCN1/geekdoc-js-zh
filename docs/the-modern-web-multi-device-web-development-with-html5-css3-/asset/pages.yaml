  md: '# 8


    # NEW FORMS


    ![](img/c5e4d8671dcefe9f3888e6a849798773_157_0.png)


    The motivating factor behind the creation of Web Applications 1.0, the original
    proposal that evolved to become HTML5, was to extend the power of HTML forms to
    allow the creation of rich and flexible online applications. HTML5 doesn''t disappoint,
    bringing a whole new range of elements, attributes, and controls to make forms
    richer, more interactive, and more informative in the modern web platform.


    Many JavaScript frameworks, such as the popular jQuery UI, provide controls and
    widgets that extend the functionality of form elements; these range from simple
    enhancements such as automatically suggesting values as you type to more complex
    user interface elements such as those allow'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'you to pick a date. Given HTML5''s stated aim of standardizing common design
    patterns, it comes as no surprise that these form elements should become part
    of the specification.


    Other new widgets and form interactions, the most common use of JavaScript forms
    is to check for errors while the user is filling out the form, and to ensure the
    data is correctly formatted and doesn''t contain any nasty surprises before being
    sent to the server. HTML5 also provides a native implementation of this validation,
    with a series of new attributes and input types that require set patterns of data,
    including on-screen notes and alerts in many browsers, and an API that gives developers
    more flexibility when using.


    # Input Types


    In HTML 4.01, a handful of form elements allowed user input, including textarea,
    checkbox, and radio, but the most common was without a doubt input, most with
    a type attribute value of text. This hard-working field (from here known as the
    text input) was used in every situation in which a specialized control was unavailable:
    as a search box, for phone numbers and email addresses . . . you name it, the
    text input did, with only some client- or server-side validation to give meaning
    to the different types of data being provided by the user.


    When HTML5 was underway, with its stated emphasis on standardizing common patterns
    of existing usage, creating new input types to lift some of the burden from the
    encumbered text was really nobrainer. A handful of properties have the appearance
    of a text input but different type values to give meaning to the data.


    The first new value is search, which is (fairly obviously) used to mark a search
    box. It looks like this:


    ```

    <input type="search>

    ```


    In some browsers, the appearance of the search box is differentiated from that
    of a regular text input, sometimes with rounded corners to match the OS it''s
    running on or perhaps with a button to clear the contents of the field. A few
    different examples are shown in Figure 8-1. But although its appearance and behavior
    differ from a text input, search has no limit on the type of data that you can
    enter.


    | Search | Search |

    | Chimpanzee | Chimpanzee |


    Figure 8-1: The search input rendered in different browsers: Chrome for Ubuntu
    (left) and Safari for iOS [right]


    That''s not the case with the next two values, email and url, which are provided
    for the user to enter—can you guess''s that''s right!—an email address'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'and a URL. The fields look identical to a text input but have a key difference:
    They limit the data that users can enter into them. Here’s how they symbols are
    used:


    ```

    <input type="email">

    <input type="url">

    ```


    The email type accepts only a well-formatted email address—peter@broken-links.com,
    for example—and the url type requires a correctly formatted URL, including the
    protocol, as http://broken-links.com. If the user enters a value that doesn''t
    match the required pattern into either field, the field will be declared invalid.
    I’ll return to this subject a little later, in “Client-side Form Validation” on
    page 154.


    Another commonly requested piece of information is a telephone number. The new
    input for this has a type of tel:


    ```

    <input type="tel">

    ```


    The actual form of telephone numbers can vary wildly, including numbers, letters,
    and symbols, so this field has no restrictions as to which characters can be entered.

    As many browsers display these new input types most identically, what exactly
    is the point of using them instead of text? I’ve already mentioned that they provide
    some native validation, which I’ll cover in “Client-side Form Validation” on page
    154, but aside from that, they also offer another advantage: On devices with on-screen
    (or soft) keyboards, they provide the user with a keyboard layout.

    Apple popularized sympathetic keyboard layouts when it invented iOS (called iPhone
    in these heady pre-iPad days), and their implementation is probably still the
    standard-bearer. If you open the file input-types.html on an iOS device you’ll
    see the on-screen keyboard update to display a different layout for each (see
    Figure 8-2 in case you don’t have an iOS device handy): the text input shows a
    standard keyboard layout; the email input adds @ and a period, commonly used in
    email addresses; the url input displays a period, slash, and top-level chooser;
    and the tel input displays a telephone number pad. All of these inputs help users
    enter the correct data in a faster and more convenient way.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_159_0.png)


    | Done | Next | Done | Previous | Next | Done | Previous | Next | Done | Previous
    | Next | Done |

    |---|---|---|---|---|---|---|---|---|---|---|---|

    | Q | W | E | R | T | Y | U | I | O | P | 1 | 2 |

    | A | S | D | E | F | G | H | J | K | L | 4 | 5 | 6 |

    | Z | X | C | V | D | N | M | | 7 | 8 | 9 |

    | 123 | space | return | 123 | space | return | 123 | | | .com | * # - | 0 |'
