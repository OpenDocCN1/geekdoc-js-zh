    ```

    <div itemscope itemtype="http://microformats.org/profile/hcard">

    <p><a href="http://about.me/petergaston" itemprop="url fn">Peter Gasstoncon/</a>

    rites for a <a href="http://broken-links.com" itemprop="url org">Broken Links</a></p>

