  md: "```\n\"version\": \"0.1\",\n\"launch_path\": \"http://foo.example.com/\",\n\
    \"icons\": {\n  \"128\": \"icon_128.png\"\n}\n```\n\nThe name and version fields\
    \ and the icons object are the same as previously described for the Chrome Web\
