- img_proc: true
  md: "When this code executes, users see an h2 element with the text 'Hello, shadow\
    \ world!', but if they viewed the DOM, users would see the original content, 'Hello,\
    \ world!'. The h1 element has been completely replaced by the new shadow node\
    \ tree. The DOM remains unaffected.\n\n11-3 shows how this renders in the Chrome\
    \ developer tools, with the contents of the shadow root displayed in a new node\
    \ tree below the identifier #shadow-root.\n\n# Hello, shadow world!\n\n| Elements\
    \ | Resources | Network | Sources |\n|---|---|---|---|\n\n```\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head></></head>\n<body>\n  <div id=\"foo\">\n    #shadow-root\n\
    \    <h2>Hello, shadow world!</h2>\n    <h1>Hello, world!</h1>\n  </div>\n  <script>...</script>\n\
    </body>\n</html>\n```\n\nFigure 11-3: The shadow root is clearly marked in the\
    \ DOM tree.\n\nIf you don't want to replace the content in the element which you've\
    \ created a new root, you can again use the content element (again introduced\
    \ in \"Decorators\" on page 194) to include the original elements. I illustrate\
    \ this in the following code, where I create the content element and append it\
    \ to the new shadow root. As a result, the user sees the h2 first, followed by\
    \ the original h1, although only the h1 appears in the DOM.\n\n```\nvar content\
    \ = document.createElement(element);\nnewRoot.appendChild(content);\n```\n\nYou\
    \ can also use templates with shadow node trees. For example, here's to append\
    \ an HTML fragment of the template #foo content into the Shadow DOM:\n\n```\n\
    var foo = document.getElementById('foo');\nnewRoot.appendChild(foo.content);\n\
    ```\n\nThe Shadow DOM goes even further than this simple example and is a very\
    \ powerful and flexible tool. I can't spend any more time on it here, but see\
    \ \"Further Reading\" on page 209 for some links to more detailed articles.\n\n\
    * The Future"
