  md: 'this, a hover feature is available for testing the existence of a hover state
    in the device. As the hover query is Boolean, no second value is required:


    ```

    @media screen and (hover) {}",

    ```


    If you want to set rules on devices that don''t have a hover state, you could
    use either the 0 value or the not operator, so these rules are analogous:


    ```

    @media screen and (hover:0) {}

    @media screen and not (hover) {}",

