  md: '# 6


    # DEVICE APIS


    ![](img/c5e4d8671dcefe9f3888e6a849798773_123_0.png)


    In the previous chapters, I''ve discussed some of the many APIs that have been
    introduced as part of the HTML5 process, such as microdata and Touch Events. But
    there is a further range of APIs that, although not part of the spec, are certainly
    related; and these APIs offer something extremely attractive to developers: access
    to the device itself.


    In this chapter, we take a look at some device APIs—from the new location and
    spatial features in portable devices to file and storage options across most modern
    browsers. Obviously not all APIs are going to be available on every device—knowing
    the position in three-dimensional (3-D) space of a television is of little practical
    use—but many APIs are useful across a broad range of user agents.'
  merge: -1
  pgno: 123
- img_proc: true
  md: "This is a curated list of those APIs I will feel most practical, and the introductions\
    \ to many are, for reasons of space, quite brief; often, the APIs will be much\
    \ more extensive, although I'll note where I think the scope is available for\
    \ you to learn more, I urge you to discover for yourself the capabilities and\
    \ possibilities of accessing the device through JavaScript.\n\nThe examples and\
    \ demos in this chapter are interactive; I've included screenshots and illustrations\
    \ in some cases, but if there's one chapter you really should download the example\
    \ files for, it's this one.\n\n# Geolocation\n\nLocation-based services are handy\
    \ in all sorts of ways, from helping users with mobile devices find their way\
    \ around to providing tailored information about the region they live. The Geolocation\
    \ API accesses a device's location services, where we use GPS, or cell tower data\
    \ to provide information about the device's location that will be used by your\
    \ location-apps.\n\nLocation data obviously involves privacy concerns, so in (if\
    \ not all) browsers, users must give explicit permission to access this data,\
    \ usually in the form of an on-screen prompt that allows them to opt in or out\
    \ of providing your location, as shown in Figure 6-1.\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_124_0.png)\n\
    \nFigure 6-1: The Geolocation opt-in prompt in Chrome for Android\n\nThe data\
    \ is held in the geolocation object, a child of window.navigator, which you can\
    \ access using the getCurrentPosition() method:\n\n```\nnavigator.geolocation.getCurrentPosition(function(where)\
    \ {\n  // Do something\n});\n```\n\nA successful callback returns an object (I've\
    \ called it where) containing a coords child object. This child object has a series\
    \ of properties pertaining to the user's position, such as his or her altitude\
    \ and heading, but the ones I'm really interested in are latitude and longitude.\
    \ In this code, I'm accessing these properties and displaying them in an alert:\n\
    \n```\nnavigator.geolocation.getCurrentPosition(function(where) {\n  alert(where.coords.latitude\
    \ + ' ', ' + where.coords.longitude);\n});\n```"
