  md: '# ACKNOWLEDGMENTS


    Huge thanks are due to David Store, the technical reviewer for this book; his
    deep knowledge of the field meant his feedback was invaluable to me. Although
    he corrected and guided me many times, if there are any errors in this book they''re
    entirely my responsibility.


    Keith Fancher, Serena Yang, Bill Pollock, and the rest of the No Starch Press
    gave fantastic support and guidance throughout the writing of this book. Their
    collective contribution is beyond measure.


    Dimitri Glazkov helped answered a few questions on web components, and Bruce Lawson
    gave extra feedback on the new HTML5 elements in Chapter 2. His as well as that
    of his fellow HTML5 Doctors was a constant reference during the writing of this
    book.


    Although I''ve never met him, I''d like to thank David Walsh for maintaining an
    excellent website that I have used a lot.


    Stephen Hay and Chris Mills have been generally useful in helping me to consolidate
    ideas, as well as incredibly nice people to know.


    Great thanks to my friends and occasional colleagues Giles McCartney, Richard
    Locke, and Tom Shirley. Thanks to all my other colleagues at Preloaded, Poke,
    Top10, Believe.in, and rehabstudio.


    As always the biggest thanks go to my wife, Ana, for her patience and support
    during the time I spent writing this book.'
