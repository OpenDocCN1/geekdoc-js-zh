- img_proc: true
  md: "# SVG Sprites\n\nSVG's scaling capabilities are an especially good fit for\
    \ using sprites for icons—that is, showing only a selected portion of a single\
    \ large image to cut down on the number of file downloads and to speed up page\
    \ load—although a little setup work is required. The way it works is all of the\
    \ desired icons are stacked one above the other in a single SVG image and then\
    \ all except one are hidden using CSS (as illustrated in Figure 7-2).\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_145_0.png)\n\
    \nFigure 7-2: In the SVG file, each of the icons is stacked above the other (left)\
    \ and hidden with CSS, except for one icon which is shown (right).\n\nThe code\
    \ required to do this looks roughly like the following (and there's a lot to explain,\
    \ I have annotated it):\n\n```\n<svg ...>\n  <defs>\n    <style><![CDATA[\n  \
    \    .icon { display: none; }\n      .icon:target { display: inline; }\n    ]]></style>\n\
    \  </defs>\n  <svg viewBox=\"0 0 30 30\">\n    <g class=\"icon\" id=\"icon1\"\
    >...</g>\n  </svg>\n  <svg viewBox=\"0 0 30 30\">\n    <g class=\"icon\" id=\"\
    icon2\">...</g>\n  </svg>\n</svg>\n```\n\nThe root element requires no extra namespaces,\
    \ so it can be the same as in previous examples. CSS can be put inline to the\
    \ file which is handy for this technique as you can reuse the image on multiple\
    \ pages; note that you must use a CDATA section to let the browser know that this\
    \ is text, not XML to be parsed. The style rules, all of the .icon elements display,\
    \ except for the :target pseudo-class applies Each sprite layer has a viewBox\
    \ attribute with four coordinates inside; this attribute sets the limit of the\
    \ box that will be displayed, using the first two numbers for the x- and y-coordinates\
    \ of the top left of the box and the second two numbers as the width and height\
    \ of the area to be displayed. Finally, the g element (used for grouping shapes)\
    \ for each sprite has the same class name as the others but a unique id."
  merge: -1
  pgno: 145
- img_proc: true
  md: 'With this setup completed, you can link directly to the icon you want, using
    its id value in the URL, as shown here:


    ```

    .bar { background-image: url(''foo.svg#icon1''); }

    ```


    The :target pseudo-class of a applied when the hash of a URL id of an element;
    matches this case the URL hash is #icon1; so the target selector applies to the
    svg element #icon1. As all other svg elements are not to be displayed, #icon1
    is shown regardless of its order in the stock. You can see an example of this
    svg-icon.html and illustrated in Figure 7-3.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_146_0.png)


    Changes to the way browsers render SVG may possibly cause the stacking technique
    to break in the future. See the link in "Further Reading" on page 139 for more
    detail on this.


    # SVG Sprites with Fragments


    An alternative spriting technique uses Fragment Identifiers. This method doesn''t
    require the icons to be stacked; the SVG sprite can have all of the icons laid
    out distinctly, with their positions called the four coordinates of viewBox as
    part of the URL in the svgView function. Here is an example:


    ```

    .bar { background-image: url(''foo.svg#viewBox(0 0 30 30)); }

    ```


    The advantage of this approach is that the SVG file isn''t required to have a
    unique id for each sprite, and you can show multiple sprites or pieces of a sprite,
    which is more complicated to achieve with the stacking method.


    # Embedded SVG


    If you want to manipulate the SVG, you can embed it directly into a page’s HTML.
    The SVG then becomes part of the DOM and is, therefore, accessible through JavaScript
    and potentially CSS.

    You can do this in one of many ways, the first of which is to use the embed element.
    This element has been used across the Web for embedding Flash files, although
    it was never made standard until the advent of HTML5. You can add SVG to your
    page with embed by supplying a link to the source file in the src attribute:


    ```

    <embed src="foo.svg"></embed>

    ```'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'Similarly, you can use the object element with the path to the SVG file used
    as a value for the data attribute:


    ```

    <object data="foo.svg"></object>

    ```


    With either of these approaches to embedding SVG, you can access the markup through
    the DOM using the getSVGDocument() method, which returns an object that you can
    traverse using standard DOM methods. The following code shows how to get the SVG
    object from an embed element and then log the number of nodes it contains, using
    the activeElement attribute:


    ```

    var svg = document.querySelector(''embed'').getSVGDocument();

    console.log(svg.activeElement.childNodes.length);

    ```


    A much simpler and more powerful method of embedding SVG, however, is to put the
    markup directly into the page—that is possible in most modern browsers. You can
    see a simple example of this in svg-embedded.html. Take a look at the code in
    the file and what it is shown here, and then compare it to the result (also Figure
    7-4).


    ```

    <svg version="1.1" xmlns="http://www.w3.org/2000/svg">

    <rect width="100%" height="100%" fill="#000" />

    <circle cx="150" cy="80" r="80" fill="#FFF" />

