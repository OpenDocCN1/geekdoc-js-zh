    These are only proposals, and although they were already implemented in WebKit
    at the time of writing, they are subject to change.


    # Further Media Features


    A handful of other media features are available, many of which deal with device
    capabilities that will be out of the scope of most developers. A few of those
    features are related to color; if example, you''re developing for ebook readers,
    some of which use grayscale "liquid paper", you might want to investigate using
    the monochrome query and its opposite, color:


    ```

    @media screen and (color) {}

    @media screen and (monochrome) {}",

    ```


    I have to point out that in my (limited) tests, browsers on grayscale devices
    don''t always identify as monochrome, even when these features are fully supported.
    As always, test on as many devices as possible.


    For the remaining features in the Media Queries spec, I can do little more than
    repeat what''s in the documentation, they are largely aligned at specialist devices
    that I don''t have access to. I urge you to take a look at the spec for yourself
    and see if those features are relevant to your project.


    Proposed in the draft version of the Media Queries Level 4 spec, script query,
    tests whether JavaScript (or more correctly, ECMAScript) is supported and enabled
    by the browser. script is Boolean, so it requires no value to detect if script
    support is:


    ```

    @media screen and (script) {}",

    ```


    At the time of writing this chapter, this feature is still only a proposal and
    not implemented by any browser and, such, may be removed at any time, but I felt
    it was worthy of inclusion based on how useful it could be.


    # Media Queries in JavaScript


    The benefit of media queries in CSS is obvious, so you shouldn''t be surprised
    that they have been adopted into JavaScript as This means you can run functions
    or load in more extra scripts depending on device capabilities, leading to sympathetic
    and improved behavior as presentation.'
