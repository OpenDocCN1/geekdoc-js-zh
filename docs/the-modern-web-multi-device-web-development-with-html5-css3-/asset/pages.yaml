  md: '```

    margin: 0px;

    padding: 0 em;

    width: calc(50% - calc(48px + 2em));

    }

    ```


    You''re not limited to using calc() only for width or height properties; however;
    you can use it on any property or function where length values are permitted.


    # Viewport-Relative Length Units


    As mentioned previously, one problem with using percentages for widths is the
    fact that they''re relative to their parent elements; that may not seem like a
    problem at first, but it can soon become complex. A better approach is to use
    a unit''s relative to a fixed value, rather than a value inherited from a parent;
    this is what the v and w units are.


    The v stands for viewport, and you may be able to extrapolate h for height and
    w for width. In other words, this unit is relative to the dimensions of the viewport.
    Each number you use with this value is equal to 1 percent of the respective length
    of the viewport. So to make an element''s half the height of the viewport use:


    ```

    E { height: 50vh; }


    ```


    And as they''re always relative to the viewport rather than the parent, that means
    no longer strings numbers after the decimal point. If you return to the earlier
    example of an element that''s 85 percent of the width of the viewport with a child
    element that''s 55 percent of the viewport, the values are much more straightforward
    and easier to manage:


    ```

    E { width: 85vw; }

    F { width: 55vw; }

    ```


    Two companion units, vmax and vmin, are also available; the first means use the
    greater length of the viewport, whether height or width, and the second means
    the lesser value. Given a viewport with a resolution of 800×600, vmax would be
    equivalent to vw, and vmin equivalent to v.


    # Root-Relative Units


    Units are relative to the dimensions are helpful, but if you want to use a unit
    over which you have a little more control, you can use one''s relative to a value
    that you have set. The root em (rem) is a typographical unit, which is based on
    the width of a capital M character; the definition is not really important though,
    all you really need to know is that you can use rem for relative sizing.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'Where rem differs from em is that the latter is inherited, whereas the former
    is fixed. For example, say you set a font size of 10px on the root of a document:


    ```

    html { font-size: 10px; }

    ```


    If you want to make a p element that''s 12px in size, you could use either one
    of them in this way:


    ```

    p { font-size: 1.2em; }

    p { font-size: 1.2rem; }

    ```


    So far, so identical. But now presume that you have a b element inside p, like
    this:


    ```

    <p>This is <b>bold</b>.</p>

    ```


    And you want the b to be 13px in size. Because em is inherited, you would have
    to divide the larger figure by the smaller to get the new font size:


    ```

    p { font-size: 1.08333em; }

    ```


    Using em has the same two drawbacks you saw earlier in the chapter: long, unwieldy
    numbers that become harder and harder to work with and differences in rounding
    values between browsers. But the rem value, which is always relative to the root,
    doesn''t have these problems, making it much easier to work with:


    ```

    p { font-size: 1.3rem; }

    ```


    Of course, although it''s a typographic unit, you can still use rem for length
    values in the same way that many people use em.


    > m using 10px as the root font size only for the sake of illustration, but you
    shouldn''t do that in real life as it ignores the user''s custom settings. Better
    to use 62.5 percent, which equates to 10px for most users (16px is the default
    font size, 62.5 percent of which is 10px) but still makes allowances for users
    with vision impairment.


    # Mobile First and Content Breakpoints


    Two systems that I find really useful when building responsive websites are mobile
    first and breakpoints. These aren''t hard and fast rules—you don''t have to implement
    them if you think they''re not appropriate for what you''re making—but certainly
    for browser-based websites I can''t imagine without them.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'The mobile first methodology targets the smaller (and most probably lower-powered)
    devices first and then adds layers of complexity to accommodate larger devices.
    What this means in essence is you start with a set of styles that''s served to
    all devices—such as color, typography, iconography, and so on—as well as the minimal
    layout rules required for a small-screen device.


    The next step is to add a media query that adds a new set of rules for larger
    devices/; this might be a tablet, for example. For anyone using an larger device,
    add extra rules and so on, until you''ve catered to a core of devices. If you
    imagine your devices are mobile, tablet, and desktop, you end up with a set of
    style rules that looked like this:


    ```

    <link rel="stylesheet" href="base.css" media="screen">

    <link rel="stylesheet" href="tablet.css" media="screen" and (min-width: 481px)">

    <link rel="stylesheet" href="desktop.css" media="screen" and (min-width: 801px)">

    ```


    The actual breakpoints you use are completely up to you; on the devices you want
    to optimize for and should be based on analysis of existing visitors, if information
    is relevant and available to you. The examples I''ve used here are simplistic
    and employed only to illustrate the method.


    Luke Wrozewski is one of the leading proponents of this method. In the introduction
    to his book Mobile First (A Book Apart, 2011), he says:


    Designing for mobile first now can only open up new opportunities for growth,
    it can lead to a better overall user experience for a website or application.


    The other approach to consider is setting breakpoints for content rather than
    devices. With the huge range of web-enabled devices on the market now (and plenty
    more to come in the future), the boundaries between phone, tablet, laptop, and
    desktop are incredibly blurred. The phone I has a 4.5" screen. Samsung''s Galaxy
    Note has a 5.3" screen. Google''s Nexus 7 has a 7" screen. At what point does
    the device stop being a phone and become a tablet?


    In my opinion, labels like phone and tablet (and especially portmanteau terms
    like phablet) are becoming obsolete. As our Internet-enabled devices converges,
    we''ll have to find a new vocabulary to describe these things (although I''m not
    going to know what new vocabulary will be).


    My point in mentioning this is that the idea of building breakpoints based on
    device dimensions may be a snipe hit. Think about making breakpoints based on
    content instead; rather than thinking “how wide should my content be on a tablet,”
    think “what''s the maximum width with this content can be before it becomes unreadable.”'
