  md: "# A GUIDE TO MODERN WEB DEVELOPMENT\n\nToday's web technologies are evolving\
    \ at near-light speed, bringing the promise of a seamless Internet ever closer\
    \ to reality. When users can use the browser on a three-inch phone screen as easily\
    \ as on a fifty-inch HDTV, what's a developer to do? The Modern Web will guide\
    \ you through the latest and most important tools of device-agnostic web development,\
    \ including HTML5, CSS3, and JavaScript. His plain-English explanations and practical\
    \ examples emphasize the techniques, principles, and practices that you'll need\
    \ to easily transcend individual browser quirks and stay relevant as these technologies\
    \ are updated.\n\n+   * Incorporate cross-platform audio and video without using\
    \ troublesome plug-ins\n* Make images and graphics scalable on high-resolution\
    \ devices with SVG\n* Use powerful HTML5 elements to design better forms Turn\
    \ outdated websites into flexible, user-friendly ones that take full advantage\
    \ of the unique capabilities of any device or browser. Plan your content so that\
    \ it displays flexibly across multiple devices\n Design websites to interact with\
    \ devices using the most up-to-date APIs, including Geolocation, Orientation,\
    \ and Web Storage\n\nLearn how to:\n\n# ABOUT THE AUTHOR\n\nPeter Gashton has\
    \ been a developer for more than 12 years in both agency and corporate settings.\
    \ The author of The Book of CSS3, Gashton has also been published in Smashing\
    \ Magazine, A List Apart, and .net magazine. He runs the web development blog\
    \ Broken Links (http://broken-links.com/) and lives in London, England.\n\n![](img/c5e4d8671dcefe9f3888e6a849798773_265_0.png)"
