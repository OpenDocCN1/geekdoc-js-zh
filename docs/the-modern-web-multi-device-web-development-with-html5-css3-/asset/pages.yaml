  md: '# FURTHER READING


    This appendix is simply a collection of all of the links contained in the “Further
    Reading” section of each chapter, brought together in one place for your convenience.
    My Plan is to host this list on the companion website, http://modernwebbook.com/,
    and update it with new and interesting links as I find them (and perhaps prune
    out-of-date ones).


    # Introduction


    Statistics used in this chapter were taken from many sources, nota-Vision Mobile’s
    “The Mobile Industry in Numbers” at http://www.visionmobile.com/blog/2012/10/infographic-the-mobile-industry-in-numbers/
    and Cisco’s “The Internet of Things” at http://blogs.cisco.com/news/the-internet-of-things-infographic/.'
