- img_proc: true
  md: '# Summary


    By necessity, I detailed a few of the many APIs that make up the web platform,
    including those for location and spatial movement, status of the battery and Internet
    connection, access to the camera and microphone, local storage capabilities, interaction
    with files and elements in a tactile way, and access to information about the
    content of files. I hope that with this overview and the example files I''ve been
    able to at least hint at the creative possibilities that open up when you access
    a device through JavaScript.


    # Further Reading


    Dive Into HTML5 is an in-depth explanation of the Geolocation API at http://diveintohtml5.info/geolocation.html,
    whereas the MozDev article "Orientation and Motion Data Explained" gives a good
    overview of three-dimensional orientation and movement: https://developer.mozilla.org/en-US/docs/DOM/Orientation_and_motion_data_explained/


    The Fullscreen API is explained in the Sitepoint article "How to Use the HTML5
    Full-Screen API" by Craig Buckler, although API changed slightly as I was writing
    this, some object names or properties have been updated. You can find the article
    at http://www.sitepoint.com/html5-full-screen-api/


    The Battery Status API is explained by David Walsh at http://davidwalsh.name/battery-api/,
    and a discussion of the previous and newly updated Network Information API is
    at http://nostrwebbeliefs.com/a-quick-loop-network-information-api/


    HTML5 Rocks gives the best explanation of getUserMedia() in their article "Capturing
    Audio & Video in HTML5": http://www.html5.rocks/tutorials/getermedia/intro/. The
    full all of the WebRTC project are listed at http://www.webrtc.org.


    MD gives a concise introduction to the Web Storage API: https://developer.mozilla.org/en-US/docs/DOM/Storage.


    The most accessible guide to the Drag and Drop API that I found was written by
    the HTML5 Docs at http://html5.com/native-drag-and-drop/, while the five-part
    "Working with Files in JavaScript" by Nicholas Zakas is an excellent resource
    for the File API: http://www.nczonline.net/blog/2012/05/08/working-with-files-in-javascript-part-1.


    The APIs that form the Firefox OS project are listed at https://wiki.mozilla.org/WebAPI/,
    and the slides from the presentation "WebAPIs and Apps" by Robert Norman give
    a great overview of the APIs: http://www.slideshare.net/robynyman/web-apis-apps-mozilla-london/.
    Are We Mobile Yet? gives an at-glance to levels of API implementation: http://arewemobileyet.com.'
