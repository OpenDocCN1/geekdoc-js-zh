  md: 'And, as with RDFa, you can describe content with predefined schema by linking
    it to the itemtype attribute:


    ```

    <p itemscope itemtype="http://example.org/birthday">My birthday this year is in
    <span itemprop="birthday" datetime="2013-12-14">December 14</span></span></p>

    ```


    You can use schema as the previously mentioned Dublin Core, or even one of your
    own invention, as I just showed in the previous code block.


    # Microdata API


    Microdata has a companion DOM API, which is useful for extracting the data from
    the page and is already fairly broadly implemented in modern browsers. The key
    to the API is the getItems() method, which returns a NodeList containing all of
    the items on the page:


    ```

    var items = document.getItems();

    ```


    From there, you can choose a single item and, for example, see how many properties
    it contains using the properties object:


    ```

    var firstItemLen = items[0].properties.length;

    ```


    Or you can discover the value of one of those properties:


    ```

    var itemVal = items[0].properties[''name''][0].itemValue;

    ```


    You can see these demonstrated in the file microdata-api.html. I''ve logged the
    results in the console, open up your favorite browser and take a look. I encourage
    you to play around with it yourself. For anyone who doesn''t have a browser handy,
    Figure 2-2 shows how the results are logged in Firebug.


    | Items NodeList[p] | microdata-pi.html (line 12) |

    | 1 Properties HTMLPropertiesCollection[span] | microdata-pi.html (line 13) |

    | Value | micro-pi.html (line 14) |


    Figure 2-2: The results of some simple explorations of the microdata API, shown
    in the console


    # Microdata, Microformats, and RDFa


    If you''ve decided adding machine-readable semantic data to your pages is the
    right way to go, what format should you use? The answer of, is to evaluate your
    content, read about the strengths and weaknesses of each of the data types, and
    decide which one''s best for you.


    My personal feeling is that in the future we''ll mostly see a mixture of microdata
    with microformats. One of the interesting about'
