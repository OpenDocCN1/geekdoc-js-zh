  md: '# Number Range


    | Number | Range |

    |---|---|


    Figure 8-4: The number and range types as displayed in Chrome for Android


    Both of these types have some new attributes in common: max and min are number
    values that set the maximum and minimum (did you work out for yourself?) permitted
    values, and step is the number by which the value is incremented or decremented.
    The following code shows how all three could work; the number input has an initial
    value of 50 and can be incremented or decremented by 10 at time to reach a minimum
    of 10 or a maximum of 100:


    ```

    <input type="number" max="100" min="10" step="10" value="50">

    ```


    You can also manipulate these values with stepUp() and stepDown() methods. Each
    takes a single integer value, which moves the value of the input by the number
    of steps; for example, the syntax reduces the input value by 3 steps:


    ```

    var foo = document.querySelector(''input[type=range]'');

    foo.stepDown(3);

    ```


    Each method returns an error if the specified number of steps causes the value
    to exceed the element''s max or min values.


    When working with numeric fields, you may want to take advantage of a new DOM
    property defined in HTML5, valueNumber. This property is similar to the existing
    value property but returns the value as a number rather than a string, meaning
    you don''t need to convert types using parseInt(). Using valueAsNumber is simplicity
    itself:


    ```

    var foo = document.querySelector(''input[type=number]'');

    bar foo = foo.valueNumber;

    ```


    # Dates


    Another popular pattern for forms is a date or time field, used in situations
    such as asking the user to enter a date of birth or date. Often these are rendered
    using a JavaScript-created date picker, a common widget aimed at helping users
    choose a date from a range so they don''t have to worry about conforming to your
    chosen date pattern.


    HTML5 has a range of input types for date and time fields, and many browsers have
    added native date-picker widgets to enhance them. Probably the most commonly implemented
    is date, which lets the user select a single date from the widget:


    ```

    <input type="date">

    ```'
