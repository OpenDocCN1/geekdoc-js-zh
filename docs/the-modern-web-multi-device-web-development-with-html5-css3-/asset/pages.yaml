    If the div items #a and #b were placed into the same cell, the latter would show
    the former before it''s later in the DOM order. You can change this order by using
    the z-index property (from absolute positioning in CSS2). For example, to have
    item #a appear above #b, you do this:


    ```

    @a { z-index: 10; }

    ```


    > We will discuss another approach to dealing with stacking conflicts in "Exclusions
    and Grids" on page 204.


    # The September 2012 Grid Layout Syntax


