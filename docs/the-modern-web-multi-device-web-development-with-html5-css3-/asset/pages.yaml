  md: "![](img/c5e4d8671dcefe9f3888e6a849798773_95_0.png)\n\nFigure 4-13: A simple\
    \ 3x3 grid showing the core terms used in the CSS Grid Layout syntax\n\n# # Declaring\
    \ and Defining the Grid\n\nThe first step in creating a grid is to declare the\
    \ grid element. As explained in the introduction to this section, this is the\
    \ container element that is used as the grid's foundation: Its dimensions will\
    \ be the limits of the grid, and all the grid properties will be applied to it.\
    \ The grid element is declared with the existing display property, using the new\
    \ value grid:\n\n```\n { display: grid; }\n```\n\nNext, define the grid tracks\
    \ with the grid-columns and grid-rows properties. The value for each of these\
    \ properties is a length unit, which sets the width of the column or height of\
    \ the row. As a simple example, here's how to create two columns, one that is\
    \ 75 percent of the width of the grid element and one that is 25 percent:\n\n\
    ```\n { grid-columns: 75%; }\n```\n\nYou're not confined to here; any length units\
    \ are permitted, and a new length unit, fraction (fr), has been created especially\
    \ for defining grids. One fr means equal share of the remaining space. In the\
    \ previous example, you could use the fr unit instead of percentages to achieve\
    \ the same result:\n\n```\n { grid-columns: 3frfr; }\n```"
