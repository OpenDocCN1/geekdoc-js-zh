  md: '# FORMAT WARS


    As I''ve mentioned a couple of times already, no single audio or video format
    is supported by all browsers, meaning you have to use a few different source files
    to accommodate everyone. The reason for this is patents and licensing.

    I don''t want to go into too much detail as it''s a bit of a sideshow, but in
    a nutshell, Apple and Microsoft, out of the core browser makers, are putting their
    weight behind the MP4 format. This format is patented and commercially licensed,
    is something close to an industry standard. MP4 is a container that supports many
    formats, chief among them being H.264 for video and AAC for audio.

    Firefox and Opera can or don''t want to license commercial formats in their browsers,
    so they implemented the Ogg format. Both Ogg and MP4 then added to the mix by
    releasing their own format, WebM, which Opera and Firefox also adopted. Apple
    and Microsoft claim WebM infringes on their patents, Ogg isn''t good enough, and
    MP4 offers better hardware performance, so we somewhat of a standoff.

    The situation is broadly like this: Safari (desktop and all iOS devices), Android,
    Chrome, Internet Explorer, and many smart TVs support licensed MP3 audio and MP4
    video. Chrome, Firefox, and Opera support Ogg video. The three plus recent Android
    devices support Ogg audio and WebM, and Samsung''s latest TVs also support WebM.
    The whole thing is a bit of a nightmare.

    The audio situation may end up resolved by a new format called Opus, which is
    free and infringing on no patents and is being introduced as part of the WebRTC
    project (discussed later in this chapter). But for video, no resolution is in
    sight, so if you''re using native video on your site, you have to encode it at
    least twice and include multiple sources—or providing a fallback to Flash.


    If you simply have media available to everyone, you can include a Flash object
    as fallback; if the user''s browser doesn''t have native audio or video, the plug-in
    is used instead. And you can put a fallback to the fallback object element to
    cover all bases.


    ```

    <video src="foo.ogg" height="240" width="360" poster="foo.png">

    <object width="640" type="application/x-shockwave-flash" data="foo.swf">

    <param name="movie" value="foo.swf">

    <param name="flashvars" value="seekbar-overamp&amp;image=foo.png&amp;file=foo.mp4">

    <img src="foo.png" width="360" height="240">

    </object>

    </video>

    ```


    166 Chapter 9'
  merge: -1
  pgno: 182
