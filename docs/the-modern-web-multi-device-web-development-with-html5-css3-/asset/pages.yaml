  md: '# 7


    # IMAGES AND GRAPHICS


    ![](img/c5e4d8671dcefe9f3888e6a849798773_141_0.png)


    For many years the only way to display images on the Web was to use JPGGs and
    GIFs, with the former generally used for photographs and the latter for icons
    and graphics. These formats were later joined by the PNG format, which largely
    ousted the GIF (for icons at least, although not for animations of cats). But
    they are all inert image formats; others than simple image frames, they aren''t
    capable of handling dynamic or interactive images or graphics, which was generally
    done with third-party plug-ins as Flash.


    Modern browsers, however, have the luxury of two new graphical formats: Scalable
    Vector Graphics (SVG), a scalable format that can be included in the DOM and manipulated
    using CSS and JavaScript, and canvas, an HTML5 element that can be drawn on using
    an API.  Between these two, a whole new range of graphical possibilities has opened
    up, from interactive charts to on-the-fly image manipulation.'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'In this chapter, I''ll walk you through the basics of each format, showing
    some common examples and giving you enough information so you can choose when
    each format is appropriate. Before I start, however, I''ll briefly explain some
    key terms and concepts.


    # Comparing Vectors and Bitmaps


    Vector graphics are made of geometrical shapes formed with a coordinate system;
    a series of points is plotted on a grid and lines are drawn between them to form
    the shapes, making them inherently scalable. If I make a grid larger, the same
    shape is drawn from the same coordinates, but the coordinates are now farther
    apart so my shape is larger.


    Bitmap graphics are series of colored pixels laid out in a grid to form an image;
    if you open an image in Photoshop (or similar) and zoom in, you can see this for
    yourself. All of the common web image formats (JPG, PNG, GIF) are bitmap formats.
    Resizing a pixel grid means the computer has to use a scaling algorithm to increase
    or decrease the size of pixels to fix the new size, removing pixels or adding
    new ones where necessary. These algorithms generally work impressively but are
    usually better at removing pixels than adding them, which is why a scaled-down
    bitmap looks much better than a scaled-up.


    In 7-1, you can see a comparison of the two different graphic approaches as I
    zoom in on an image. The vector image is crisp and clear, but the bitmap looks
    fuzzy, as the scaling algorithm had to make some estimates adding new pixels to
    accommodate the larger scale.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_142_0.png)


    7-1: Detail from a scaled-up image in SVG [left] and PNG [right]; the SVG is noticeably
    sharper and clearer.


    Vector graphics are not suitable for photographic or photo-realistic images, but
    are great for illustrations as logos, icons, and charts. Conversely, bitmap graphics
    are less useful in environments where scaling is common (such as mobile devices)
    but are much better for photographic images.


    # Scalable Vector Graphics


    Vector graphics on the Web are created using the Scalable Vector Graphics (SVG)
    markup language. This language has been around for a long time without much success,
    but two factors gave it a new lease on: implementation in IE9 and the rise of
    the mobile and multi-device Web. All the major browsers have now implemented it.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'The main reason SVG is so useful is its scalability, which I discussed in the
    previous section. Scalability is a real boon for responsive web design. You can
    reuse the same image across every platform, avoiding the problems with adaptive
    images, which I discussed in Chapter 3. In addition, the way SVGs are made and
    embedded in a page can enhance accessibility and searchability, as you''ll see
    in the following sections.


    Of course, SVG doesn''t work for everything—photographs, mentioned, are better
    off as bitmaps—but it is a really useful format for multi-screen design.


    # Anatomy of an SVG Image


    Before I explain how you can use SVG in your pages, I want to briefly explain
    the code behind it. You see, SVG is actually an XML file that marks the image
    that it creates; this means you can view it in a text editor and change it manually—something
    that is basically impossible with bitmap files.


    Open an SVG file in your preferred editor, or view it in a browser window, and
    inspect the contents. Although the markup varies wildly from file to file, you
    will at least be see the many common elements. To begin, all SVG files start with
    the declaration, which holds the version of XML you''re using, the text encoding
    method, and the standalone attribute that sets whether the file reference to other
    files or stands (in most cases, just leave this as no):


    ```

    <xml version="1.0" encoding="UTF-8" standalone="no"?>

    ```


    Next, you see the svg element—which is the root and a series of namespaces with
    information about the syntax used. The following example is taken from an SVG
    file I opened at random. It tells me that the file Dublin Core metadata terms
    (see “RDFa” on page 30 for this), is licensed under Creative Commons, and uses
    RDF, SVG, and XLink schema to describe its contents:


    ```

    <svg xmlns="http://www.w3.org/dc/elements/1.1/" xmlns:cc="http://www.resource.org/cc"
    xmlns:rdf="http://www.w3.org/1999/02/rdf-syntax-ns#" xmlns:svg="http://www.w3.org/2000/svg"
    xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

    ```


    The simplest form of the svg element requires only the attributes for a link to
    the SVG namespace and the version of SVG that you are using:


    ```

    <svg xmlns="http://www.w3.org/2000/svg" version="1.1">

    ```


    All the children of the svg element contain the information used to create the
    image itself. The bulk of this information is contained in a series of elements
    based on basic mathematical shapes used to make the drawing: circle, rect, ellipse,
    polygon, and line. Each of these shape elements has a series of attributes to
    describe the shape, size, and color'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'information. For example, here''s how to draw a circle whose center is (cx)
    50px from the left of the grid (cx) and 75px from the top (cy), which has a radius
    of 25px (r), a black border (stroke) 2px wide (stroke-width), and a background
    color of silver (fill):


    ```

    <circle cx="50" cy="75" r="25" stroke="black" stroke-width="2" fill="silver"/>

    ```


    NOTE The element is closed with a trailing slash; SVG is strict XML and all empty
    elements must be closed.


    In comparison to the previous code, here''s a rectangle that is 100px wide (width)
    and 50px tall (height), is offset 25px from the left (x) and 50px from the top
    (y) of the grid, and has a blue background (fill):


    ```

    <rect width="100" height="50" x="25" y="50" fill="blue"/>

    ```


    I don''t intend to go too much deeper into how an SVG file is made—for two reasons:
    First, the subject is too complex for a single chapter of a book to hope to cover;
    and second, I don''t think you''ll use it often. You are more likely to use a
    graphical editor (such as Adobe Illustrator or the open source Inkscape) to edit
    SVG files, perhaps making only small adjustments to the code by.


    # Linked SVG Files


    You''ll use SVG on your sites in two main ways. One is to embed the code into
    the markup itself, which I cover in the next section. The second is easier to
    link to a premade SVG file as an, in the same way you would use a JPG or PNG.
    This method is great if you want a scalable, decorative image, although you don''t
    get to access the SVG as part of the DOM.


    To use SVG, you must have an image with the file extension .svg (or .svg for a
    compressed file); then just supply the path to the image at the relevant point
    in your code. You can use it in the markup with


    ```

    <img src="/path/to/foo.svg">

    ```


    Or you can call it in CSS anywhere that accepts a url() function as an argument,
    such as background-image:


    ```

    .foo { background-image: url(''path/to/foo.svg''); }

    ```


    WARNING The drawback to using SVG in the img element or CSS is that you lose advanced
    SVG behaviors, such as scripting and animations. If having these are important
    to you, use an embedding technique (which I cover next) instead.


    128 Chapter 7'
