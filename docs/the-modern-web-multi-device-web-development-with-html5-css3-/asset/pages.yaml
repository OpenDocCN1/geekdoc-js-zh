  md: '```

    <article>

    <h1>Eastern Gorilla</h1>

    ...

    </article>

    <article>

    <h1>Western Gorilla</h1>

    ...

    </article>

    </section>

    <section>

    <h1>Orangutan</h1>

    ...

    </section>

    ```


    The resulting outline would be the same as as in the HTML4 example because each
    section or article element creates a new section in the outline. These are the
    sectioning content elements I mentioned earlier, along with aside and nav.


    Each outline section should have a heading—any heading will do. In my example,
    I''ve used all h1 headings, the heading level doesn''t really matter because the
    sectioning content creates new sections. I could have rolled a die and used that
    number for each heading level for all the differences it makes.


    I''m being a little gib here. You can (and should) still use h1 to h6 in a hierarchical
    way, as its in backward compatibility and makes styling easier.


    As well as the heading (or headings, and possibly an hgroup wrap them), each section
    can contain a distinct header and footer, further sections and sectioning roots.
    These roots are elements such as blockquote and figure, which can have their own
    outlines but don''t contribute to the overall document outline.


    If this discussion isn''t making a lot of sense to you, you''re in good company.
    The confusion over what each of the sectioning content elements is so common that
    the good HTML5 Doctor has a flowchart (Figure 2-1) to help you choose the right
    element for the task at hand.


    A flowchart to help you choose an element. If you''re a good judge of tone, you
    might have started to get the impression that I''m not a fan of the new HTML5
    structural elements. If so, you''re right.


    # The Downside of HTML5 Sectioning Elements


    As implied through my perceivable mounting of frustration in the previous section,
    coming to grips with some of these new elements can be quite challenging, especially
    understanding the difference between article and section. To recap: A section
    can contain articles and sections, and an article can contain sections and articles,
    and both make sections in the outline. There is a difference between the two,
    but no one—not even the writer of the spec—has yet managed a definition so clear
    and succinct that developers remember it easily.'
