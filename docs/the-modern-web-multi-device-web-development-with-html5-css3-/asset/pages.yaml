  md: "Like CSS3, SVG2 will be modular, allowing for staggered development and implementation,\
    \ meaning you could start seeing elements of it sooner than later.\n\n# A Drawback\
    \ of SVG\n\nFor all the advantages of including SVG in your documents, one of\
    \ its key strengths—accessibility via the DOM—is also its key weakness: Being\
    \ of the page means slower loading times as the more complex page is rendered\
    \ and more memory consumption as more objects are held in temporary storage.\n\
    \nYou should consider this when deciding whether to include complex SVG objects\
    \ in your page, especially as it might affect people who visit your site using\
    \ a lower-powered mobile or portable device.\n\n# The canvas Element\n\nThe canvas\
    \ element is named so because, as a blank canvas, it's there to be drawn on. The\
    \ drawing is done with JavaScript using a dedicated API, creating a tailor-made\
    \ bitmap graphic. And it is really like a painter's canvas that once you've drawn\
    \ on it, you can't manipulate the things you've drawn. There are not objects like\
    \ SVG elements, just pixels on the screen; you can only draw over them.\n\nThe\
    \ basic setup is incredibly simple: Add a canvas element to your markup—perhaps\
    \ with a unique id that will make it little easier to reference—with size attributes\
    \ and fallback content for browsers that don't support canvas (or JavaScript):\n\
    \n```\n<canvas id=\"canvas\" height=\"400\" width=\"800\">\n<p>Sorry, your browser\
    \ doesn't support canvas (or JavaScript)</p>\n</canvas>\n```\n\n> NOTE A quick\
    \ note of disambiguation: When referring to the element I use any use of \"canvas\"\
    \ throughout this book is a shorthand to refer to the technique of drawing to\
    \ a canvas element using the API.\n\nAll subsequent actions are performed with\
    \ JavaScript. The first step is to select the canvas and create a *context*, which\
    \ is a fancy way of saying that you're going to draw on it. You do this using\
    \ the getContext() method with a context as an argument, which for two-dimensional\
    \ shapes is 2d. I'll add some feature testing to make sure the browser supports\
    \ the canvas API. My code ends up looking something like this:\n\n```\nvar el\
    \ = document.getElementById('canvas');\nif (el && el.getContext()) {\n  var context\
    \ = el.getContext('2d');\n  if (context) { ... }\n}\n```"
  merge: -1
  pgno: 151
- img_proc: true
  md: 'Then you begin drawing. As with SVG, drawings are carried out with a series
    of shapes and lines, using a coordinate system. For example, to draw a rectangle
    filled with a solid color you use the fillRect() method, which accepts four number
    arguments: The first two are x and y-coordinates of the top-left corner; the next
    two are the width and height. The following code draws a 120×120 square, filled
    with a solid color, 20px from the top-left of the canvas element:


    ```

    context.fillRect(20,20,120,120);

    ```


    You can also change the appearance values of the objects you draw, using a series
    of properties in the API. These are applied the next time a method that draws
    canvas is run. In the following, I change the color of the fill and set up a set
    of drop shadow properties that are rendered on the next rectangle with fillRect()
    and all subsequent drawings until I change the properties:


    ```

    context.fillStyle = ''#ff0000'';

    context.shadowOffsetX = 3;

    context.shadowOffsetY = 3;

    context.shadowBlur = 3;

    context.shadowColor = ''rgba(0,0,0,0.5)'';

    context.fillRect(200,80,160,160);

    ```


    Drawing circles is a little more complex, requiring the arc() method, which takes
    six arguments: the first are the x and y-coordinates of the center of the circle,
    the third is the radius, the fourth is the starting angle of the arc, the fifth
    is the finishing angle—I’m using $\pi$ multiplied by 2 to draw a full circle—and
    the sixth and last argument is a Boolean to state whether the arc is drawn counterclockwise.
    When I''ve done all that, I use the stroke() method to draw my circle:


    ```

    context.arc(360,240,160,0,Math.PI*2,false);

    context.stroke();

    ```


    You can see a different shapes that I''ve drawn in the file canvas.html (and in
    Figure 7-8), but as with SVG, the canvas API includes so much that I can''t possibly
    cover it in a single chapter of this book, so if you''re interested in learning
    more, I recommend taking a look at some of the great free resources online, a
    few of which I list in “Further Reading” on page 139.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_152_0.png)


    Figure 7-8: Simple shapes drawn on the canvas element!'
  merge: -1
  pgno: 152
- img_proc: true
  md: "# Image Manipulation\n\nCanvas becomes extremely useful when manipulating images.\
    \ You can load an image into a canvas and, once, draw and manipulate it as you\
    \ wish. Get the image data with the getImage() method, which uses four arguments—the\
    \ familiar x, y, width, and height—to select the portion of the canvas you want\
    \ to manipulate. Using this method inside an event is a good idea; it ensures\
    \ the script doesn't run before the image're getting data from finished loading.\n\
    \nIn the next code snippet, we use querySelector to find an image in the page,\
    \ and when it has loaded, first draw it to the canvas with drawImage() and then\
    \ use getImageData() to select the canvas and assign it to the variable newImg:\n\
    \n```\nvar img = document.querySelector('img');\nimg.addEventListener('load',\
    \ function () {\n  context.drawImage(img,0,0);\n  var newImg = context.getImageData(150,0,150,225);\n\
    });\n```\n\nOnce you have the image, you can begin to manipulate it using the\
    \ data property. This is a huge array that contains information about every pixel\
    \ in the image portion, where each item is a number from 0 to 255 representing\
    \ the RGBA color model: The first item is the red value of the pixel, the second\
    \ is the green, the third, and the fourth. A fully opaque red pixel would be represented\
    \ by the four array items [255,0,0,255]. These four values are repeated for every\
    \ pixel in the image.\n\nThat means you can manipulate the color value of every\
    \ single pixel, which is a pretty powerful ability to have. In the following,\
    \ I use a loop to go through all the pixels and invert their values by subtracting\
    \ their current value from 255. Once I've done this, putImageData() returns the\
    \ modified image to the canvas at the same coordinates. You can see the result\
    \ in Figure 7-9, and you can see for yourself how this looks in the file canvas-image.html.\n\
    \n```\nvar img = document.querySelector('img');\nimg.addEventListener('load',\
    \ function () {\n  context.drawImage(img,0,0);\n  var newImg = context.getImageData(0,0,500,500);\n\
    \  var newLen = newImg.data.length;\n  for (i=0;i<newLen;i++) {\n    newImg.data[i]\
    \ = 255 - newImg.data[i];\n    newImg.data[i+1] = 255 - newImg.data[i+1];\n  \
    \  newImg.data[i+2] = 255 - newImg.data[i+2];\n  }\n  context.putImageData(newImg,0,0);\n\
    }, false);\n```"
  merge: -1
  pgno: 153
- img_proc: true
  md: "![](img/c5e4d8671dcefe9f3888e6a849798773_154_0.png)\n\nRather exciting, you\
    \ can combine the canvas element with the live video stream obtained from the\
    \ getUserMedia() method I described in Chapter 6, providing image manipulation\
    \ on the fly. Although I don't have the space to go into any detail, I encourage\
    \ you to look online for some great demos, such as Tim Taubert’s “Building a Live\
    \ Green Screen with getUserMedia() and MediaStreams.” See “Further Reading” on\
    \ page 139.\n\n# WebGL\n\nYou may have noticed when I created the canvas context,\
    \ I specified it is to be 2-D, which implies there is also a 3-D context—and there\
    \ is, using a technology called WebGL to gain access to the device's graphics\
    \ card and create hardware-accelerated 3-D objects in the browser. The actual\
    \ context is webgl. Test for using something like this:\n\n```\nvar el = document.getElementById('canvas');\n\
    if (el && el.getContext) {\n  var context = el.getContext('webgl');\n  if (context)\
    \ {\n  }\n}\n```\n\nWebGL is not fully supported across every browser and may\
    \ never be, and it uses a language that is extremely complicated for your average\
    \ developer (me included), so obviously WebGL is far beyond the scope of this\
    \ book. As before, if you're interested in learning more, I advise you to take\
    \ a look at some of the fantastic online resources that exist.\n\n# When to Choose\
    \ SVG or Canvas\n\nThe two methods in this chapter should really be viewed as\
    \ complementary rather than competing, as they each fill a different role in web\
    \ graphics. You could end up using both in your websites instead of being forced\
    \ to make a choice between them."
  merge: -1
  pgno: 154
- img_proc: true
  md: 'Where SVG excels is in its scalability, which makes it suitable for any screen
    regardless of size or resolution. As it creates new elements in the DOM, SVG is
    very useful for interacting with and manipulated by JavaScript. And it''s also
    much easier to make accessible by adding alternative and fallback track to the
    created items. SVG is a good choice for logos, icons, and interactive charts and
    graphics.


    Canvas is bitmap-based and so less suitable for scaling. It allows external manipulation
    by JavaScript beyond its own API and has no accessibility features as it currently
    stands (though work is underway to improve that). Canvas is best suited for image
    manipulation, and as it doesn''t access the DOM (which can slow a page considerably),
    it can be good for moving multiple items around the screen quite quickly, making
    it handy for gaming.


    Both formats have their pros and cons, and for many purposes either would be suitable,
    the best advice I can give you is that you should consider the problem you want
    to solve and test each solution which is the most relevant one.


    # Summary


    In this chapter, I covered the two different approaches to digital graphics—vectors
    and bitmaps—and the way they are implemented on the Web using SVG and canvas.
    I discussed the basic syntax of each and looked at the situations they best suited
    for. You can explore more about each different graphic format, but for reasons
    of space I''ve, by necessity, only touched briefly on each—hopefully, however,
    enough to make you find out more.


    # Further Reading


    You can find a great introduction to SVG at the SVG Basics website: http://www.svgbasics.com/,
    and the W3C''s OWN SVG Primer is a useful way to dig deeper: http://www.w3.org/Graphics/SVG/resources/svgprimer.html.
    MDN has a complete list of elements and attributes: https://developer.mozilla.org/en-US/docs/SVG/


    The technique for stacking SVG icons was developed by Erik Dahlström and is described
    on the blog of Simurai: http://simurai.com/post/2025101889/svg-stacks/. Mozilla''s
    Robert O''Callahan warns of the possible changes to the stacking technique: http://robert.ocallahan.com/2012/10/impending-doom-for-svg-stacks-sort-of.html.
    I detailed the svg method on my blog, Broken Links: http://broken-links.com/2012/08/14/better-sprites-with-fragment-identifiers.


    The IE Testdrive has a good hands for experimenting with SVG Filter Effects: http://ie.microsoft.com/testdrive/graphics/hands-on-css3/hands-on_svg-filter-effects.htm.


    Dirk Schulze wrote a good, concise introduction to the features planned for SVG2:
    http://dsulz.com/blog/articles/new-features-in-svg2.'
