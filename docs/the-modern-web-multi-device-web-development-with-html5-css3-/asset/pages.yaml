  md: '# PhoneGap


    Although owned by Adobe, a commercial entity, PhoneGap is free, open source platform
    that allows you to build semi-native mobile applications using web platform technologies.
    PhoneGap is a distribution of software Apache Cordova, which be used to call PhoneGap
    before it was sold to Adobe and things became complicated. The names are often
    used interchangeably, but I''ll still calling it PhoneGap for consistency''s sake.


    PhoneGap works across multiple platforms, among them iOS, Android, and Windows
    Phone, and one of its major selling points is, as it''s a native wrapper around
    web platform code, it allows access to APIs on a device that are not always available
    through the browser. For this, it uses its own API, which matches standard APIs
    from each device where present, acts as a bridge when devices have differing implementations
    of an API, and creates new methods and objects where


    To set up PhoneGap, you need to download the SDK for each device you want to target
    and, in some cases (notably for iOS), also get a developer-certificate. When you''ve
    done all this, complete the setup for each environment (full instructions are
    on the PhoneGap website, linked to "Further Reading" on page 188) and start a
    new project, which creates a folder structure with a few key files, including
    the ones necessary for access to the API.


    # Granting Permissions


    Once your setup is complete, you can add all files to the project that your app
    needs to run, and then begin to take advantage of the PhoneGap API. Some of the
    properties in the API require that you add permission requests to a manifest file
    (as I mentioned earlier) PhoneGap uses the XML-based widgets specification for
    requests. For example, to request access to the Notification API, include the
    XML element in the file config.xml:


    ```

    <plugin name="Notification" value="org.apache.cordova.Notification"/>

    ```


    Some platforms require no extra permissions, or some methods available without
    requiring permissions, whereas others insert on permission requests for all methods.
    The API documentation has full details.


    # PhoneGap API


    PhoneGap API is largely composed of a series of properties and methods on the
    navigator object. Some of these properties are already available through browsers.
    When they are, with the geolocation object you learned about Chapter 6, PhoneGap''s
    API chooses the native implementation first, falling back to its own implementation
    on systems where the property is not available.'
  merge: -1
  pgno: 198
- img_proc: true
  md: "Other properties require heightened permissions and, as such, are available\
    \ on some platforms exclusively through PhoneGap. For example, consider the contacts\
    \ object, which provides access to the user's contacts list—not something you\
    \ exposed to the Web without special authorization.\n\nThe contacts object has\
    \ functions: create() and find(). To select items from the contacts list, use\
    \ the latter with two required arguments: contactfields (a list of to return)\
    \ and contactSuccess (a function to run when a successful query takes places).\n\
    \nIn the following code, I set up a query to display the name and birthday of\
    \ all contacts in the address book; then if successful, this function loops through\
    \ all of the results (in the contacts object I defined) and adds them to a string\
    \ called contactDOB, which I use here to populate a list.\n\n```\nnavigator.contacts.find(['displayName',\
    \ 'birthday'], function (results) {\n  var i;\n  for (i=0; i<results.length; i++)\
    \ {\n    contactDOB += '<li>' + results[i].displayName + ' ' + results[i].birthday\
    \ + '</li>';\n  }\n});\n```\n\nFuture browsers and web-based operating systems\
    \ will probably provide direct access to some of these methods in the future,\
    \ meaning the long-term future of PhoneGap will likely be in polyfilling on legacy\
    \ devices. PhoneGap's developers are cognizant of this, as stated clearly in a\
    \ blog post “Beliefs, Goals and Philosophy\":\n\nThe ultimate purpose of PhoneGap\
    \ is to exist to evolve.\n\n# PhoneGap Events\n\nIn addition to its device properties\
    \ API, PhoneGap also has a number of extremely useful events that register changes\
    \ to the device's status, from its network status and capability to the battery\
    \ level. These events are critical if you want to provide users with the best\
    \ possible experience, as ensuring data is saved before a battery runs out or\
    \ when network connection is lost.\n\nThe most important event is deviceready,\
    \ which fires when PhoneGap has fully loaded and is ready to execute. The deviceready\
    \ event is identical to the DOMContentLoaded event you saw in Chapter 5 in that\
    \ it also should be used in every script to ensure that all required libraries\
    \ have been loaded and are in place before the rest of the scripts are run. As\
    \ such, all of your functions that require access to the PhoneGap API should be\
    \ run in the callback function:\n\n```\ndocument.addEventListener('deviceready',\
    \ function () {\n  // All PhoneGap-related functions\n}, false);\n```"
  merge: -1
  pgno: 199
- img_proc: true
  md: "Other events include pause and resume. The former is fired when the current\
    \ application is closed and moved to a background process, and the latter when\
    \ it becomes active again. For example, you may want to store data when the application\
    \ is moved to a background process to make sure users do not lose their work:\n\
    \n```\ndocument.addEventListener('pause', function () {\n  // Backup data\n},\
    \ false);\n```\n\nSome events fire when an application disconnects or reconnects\
    \ from a network (offline and online); when the volume or call buttons are pressed\
    \ (voledownbutton, volumeupbutton, startcallbutton, and endcallbutton); when the\
    \ battery status changes (batterystatus changes status, whereas batterylow and\
    \ batterycritical fire when the battery is low or in a critical state, as defined\
    \ by the device).\n\n# Titanium\n\nAnother popular approach to publishing hybrid\
    \ mobile apps is Appceler Titanium. Rather than acting as a wrapper around a web\
    \ app like PhoneGap, Titanium is an SDK that lets you develop applications using\
    \ JavaScript native UI elements from the device platform. This approach has the\
    \ advantage of making your app look and feel more like a native app, but it requires\
    \ you to write it in a way that isn't compatible with the standard web platform\
    \ approach.\n\nFor reason, I won't cover Titanium further in this book, although\
    \ knowledge of its existence is useful.\n\n# TV Apps\n\nSo in this chapter I've\
    \ covered mostly mobile device development, a new and thriving area lies in development\
    \ for Internet-connected smart TVs. The big players in this arena include device\
    \ manufacturers Samsung, Sony, and Panasonic; plug-in box makers Roku and Boxee;\
    \ and the vendor Opera. Installable apps on smart TVs are generally seen as a\
    \ good idea, as it's easier to navigate a series of icons than it is to type URLs\
    \ when using a remote control.\n\nEarly smart TVs had proprietary and conflicting\
    \ app platforms, but 2012 saw a sector-wide move toward web platforms developed\
    \ for TV much less demand. Each party to the development maintains their own developer\
    \ program and documentation, some of which is free. If you are interested in developing\
    \ in this area, Opera's developer portal has some great articles and tutorials\
    \ on best practices (see “Further Reading” on page 188)."
