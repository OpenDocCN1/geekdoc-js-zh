  md: "So now that you know media queries work and how to include them in your pages,\
    \ let's move on to explore the media features themselves—starting with the most\
    \ common, those that use the dimensions of your device or browser viewport.\n\n\
    # Media Features Based on Dimensions\n\nMedia queries are most commonly used today\
    \ for detecting the dimensions of the agent being used to view your content and\
    \ serving up the appropriate rules for display on that agent: large text and images\
    \ for big monitors, small text and a single-column layout for smartphones, that\
    \ kind of thing. Of course, there's more media queries than those simple contexts,\
    \ but you get the general idea.\n\nYou need to consider two sets of dimensions:\
    \ first, those of the device itself, and second, those of the agent's viewport\
    \ (for most people that are web browser, the viewport could also be an app window)\
    \ on that device. A person may visit your site using an enormous wide-screen television,\
    \ that of little concern to you if the app is using to view your site only occupies\
    \ a quarter of the screen. On certain devices, the two sets of dimensions are\
    \ the same—on most smartphones and tablets, for example, the browser's width is\
    \ the same as the device's width.\n\n> The viewport itself is subject to change\
    \ on some devices; see “Device Adaptation” on page 48 for more details.\n\nThe\
    \ viewport's dimensions are probably the most important and the ones that you'll\
    \ use, the most, and the media features that are relevant to these height and\
    \ width. The viewport dimension features as an argument single length value that\
    \ the logic is tested in is equal to the supplied length value, the logic is true\
    \ and the rules are applied. In the following query, the rule inside the curly\
    \ brackets is applied to the body element of the viewport when it is exactly 480px\
    \ wide:\n\n```\n@media screen and (width: 480px) {\n  body { background-color:\
    \ #f0f; }\n}\n```\n\nWorking with width is much more common than I'm using width\
    \ in the examples in this section, but the same techniques apply to height also.\n\
    \nI've used a px value in this example, but any length you use is permitted. Regardless\
    \ of which unit you use, an exact value is likely specific for most purposes.\
    \ A pair of extensions to the feature makes more flexible, however."
