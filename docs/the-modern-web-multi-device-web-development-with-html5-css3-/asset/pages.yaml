  md: 'grips with how they work. Zoe Mickley Gillenwater wrote an excellent post on
    the topic, Essential Considerations for Crafting Quality Media Queries, in which
    she says:


    Designing web layouts with media queries is a process. You need to keep them in
    mind from the very beginning and make decisions at several points about how to
    integrate them in ways that there are very few almost-right or always-wrong answers.


    This post is a great piece of work that deserves to be read and digested fully.


    # A Quick Digression: All About Pixels


    As we''ve moved into the multi-device era, a point to consider beyond the dimensions
    of the screen is its resolution. Many new devices, especially smartphones, now
    ship with high-resolution screens, so if you want to provide an optimal experience
    for everyone, you need to consider how images and other objects will display on
    these screens. Before I get into that, I need to talk about pixels.


    To talk about resolution-dependent media queries, first I need to define some
    terms, with those related to pixels (I assume that readers know what a pixel is).
    The physical pixel count of a screen is the number of pixels contained in the
    width of the screen. For example, a 1280×800 screen has a physical pixel count
    of 1280 along its broad edge. The iPhone 3GS, in its default (portrait) position,
    has a physical pixel count of 320, whereas the iPhone 4 and above, using the “retina”
    display, have a count of 640.


    The pixel density of a screen is traditionally measured in pixels per inch (PPI)—actually
    if you prefer the metric system, you can use pixels per meter (PPC) instead, but
    I''ll stick to imperial measure for this description. Imperial measure is sometimes
    called dots per pixel (DPI), even by popular desktop image-editing software, and
    the two terms—PPI and DPI—can be considered interchangeable. Regardless, PPI is
    a measure of the number of pixels that can be placed in a line that spans one
    inch of the device''s.


    For the majority of screens used until recently, the PPI is 96. With the rise
    of smartphones, however, the original iPhone (and all versions up to the 3GS)
    has 163 pixel density, whereas the iPhone 4 and above double that, an incredible
    326 ppi (despite the screen staying the same size—you''ll see why in a second).


    So far, straightforward—but that''s not the whole story. The majority of high-density
    screens now have an extra, virtual pixel unit: the density-independent pixel (DIP),
    sometimes referred to as a CSS pixel. This is a relative unit; one physical pixel
    is equal to any number of DIPs. This allows you to scale websites up (and down),
    generally to provide better usability on smaller screens.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'The ratio of virtual pixels to physical pixels is known as the device pixel
    ratio. I''ll use the abbreviation DPR for this, although it is also known as DPX
    (dots per pixel). Devices that don''t have DIPs have a DPR of 1—that is, one virtual
    pixel to one physical pixel. The most common high-resolution devices as I write
    it (such as the Samsung Galaxy III or the iPhone 5) have a DPR of 2—two virtual
    pixels to one physical.


    Figure 3-2 illustrates this. On the left is a 2x2 block of physical pixels; in
    the center, a screen with a DPR of 1.5 fits 9 DIPs into the same space; and on
    the right, a screen with a DPR of 2 fits 16 DIPs into the space.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_62_0.png)


    Figure 3-2: Comparing different DPR values: 1 (left), 1.5 (center), and 2 (right)


    You can find out the DPR of any device using JavaScript, most browsers now support
    a DOM property called devicePixelRatio on the window object. To find out the DPR
    of the device you''re using, just type this into your browser''s developer console:


    ```

    window.devicePixelRatio;

    ```


    If your browser doesn''t have a developer console, I''ve written a script in the
    example file mq-dpr.html that you can use instead.

    This discussion has all been quite technical, and to be honest I barely scratched
    the surface, but hopefully you understand enough about resolution and pixels to
    be able to get the most out of the rest of this.


    # Screen Resolution Media Queries


    As you''ve just seen, many devices now ship with very high-resolution screens.
    Certainly a positive thing, these screens do one or two drawbacks, mainly around
    the display of graphics. You''re probably aware, two types of graphic: vector,
    such as SVG, is a series of coordinates used to display screens regardless of
    resolution in Chapter 7); and bitmap or raster, such as JPG and PNG, is a series
    of colored dots that are more explicitly tied to pixels.


    The practical difference between the two types is that bitmaps are saved with
    a PPI setting, and a bitmap graphic that looks fine on a screen with a low DPR
    will look poor on a device with a high DPI. That means you will likely want to
    use higher PPI bitmaps for higher-resolution screens, which is why media features
    exist to do just that.'
