  md: 'Many media features, including width, allow the prefixes max- and minbefore
    the feature name. These stand for maximum and minimum respectively, you probably
    don''t need me to explain, and in mean “no more than” and “no less than.” For
    example, max-width you can apply style rules to any browser that is no more than
    480px wide, and using min-width, that is no less than 480px width:


    ```

    @media screen (max-width: 480px) { ... }

    @media screen (min-width: 480px) { ... }

    ```


    In the example file mq-width.html, you can see a simple demonstration of these
    prefixes in you. The page has three iframe elements with widths of 190px, 200px,
    and 210px respectively, and with a unique id for your reference:


    ```

    <iframe src="mq-hello.html" width="190" id="a"></iframe>

    <iframe src="mq-hello.html" width="200" id="b"></iframe>

    <iframe src="mq-hello.html" width="210" id="c"></iframe>

    ```


    Because an iframe creates a new viewport, you can use the width media feature
    to apply rules to each differently sized viewport. The page that it refers to,
    mq-hello.html, contains an inline style block in the header that applies different
    border-style properties to the elements, depending on the media features that
    were matched. This task is performed with the following media features queries:


    +   @media screen (width: 200px) {

    h1 { border-style: solid; }

    }

    @media screen (min-width: 205px) {

    h1 { border-style: dotted; }

    }

    @media screen (max-width: 195px) {

    h1 { border-style: dashed; }

    }


    The rules are applied like this: ① applies to iframe #b, which has a width of
    200px; ② to iframe #c, as it is at least 205px wide; and ③ to iframe #a, as it''s
    no wider than 195px. You can see the result in Figure 3-1.


    ![](img/c5e4d8671dcefe9f3888e6a849798773_58_0.png)


    Figure 3-1: Applying different rules to viewports of different widths using media
    queries'
