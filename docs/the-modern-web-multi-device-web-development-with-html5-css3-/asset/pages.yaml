    You can also apply column-width and column-count to the same element. When you
    do, the column-count becomes the maximum number of columns. In this case, the
    logic is: "Make columns of 120px, up to a maximum of three columns; then resize
    as necessary to fill the parent width." for this, where the two values provided
    are column-width and column-count, respectively:",


    ```

