  md: '# Tablet


    Tablet computers have been around for years, but it wasn''t until Apple came along
    with the iPad in 2010 that they became more of a leisure item than a desktop accessory.
    Many other devices have followed the iPad, with Android-based tablets doing doing
    well in the mid-7" range and Microsoft pushing forward with the heavily-focused
    Windows 8. From a market that was negligible at best in 2009, estimates are some
    390 million tablets will be in use worldwide by 2015. That''s an incredible figure,
    and the growth is exponential.


    Their larger size and reliance on Wi-Fi (in many cases) makes tablets portable
    rather than truly mobile; they exist in a space more akin to a laptop than a mobile
    device. Most people use them at home, and although they are carried out, they''re
    usually taken out and used only when the user is stationary, rather than walking
    down the street. That is, it''s uncommon to see them used as something


    Like smartphones, tablets are tactile, relying on touch input in most cases (although
    also accept stylus). Research shows they tend to be used for entertainment and
    browsing when time is less of an issue. The core browsers on tablets are essentially
    the same as those on mobile devices.


    # TV


    The TV is the most-used screen in the home, mostly for passive viewing rather
    than interactivity. That''s changing as the new breed of web (or smart) TVs and
    media boxes begin to get a foot in the door. Although global figures are hard
    to come by, predictions are that there will be 100 million web-enabled TVs in
    Europe and North America by 2016.


    Although many web TVs use applications rather than websites, they are often built
    using web technologies and sometimes contain an embedded browser view. After all,
    if you''re making a Twitter app, you would want your users to be able to open
    links.


    The biggest drawback with web TV is navigating with a TV remote is a horrible
    experience, made worse by some of the multibutton monitors that have been built
    to provide the level of interactivity required for Internet—notably, a keyboard.
    Some manufacturers are gesture- and voice-controlled TVs or remote controls that
    incorporate a trackpad, but the best solution is to pair a mobile or tablet with
    the TV and use that as an interactive control.


    Another obstacle to browsing on the TV is that the television is inherently a
    communal device, viewed by many people at the same time—an experience that is
    fundamentally opposite to the personal Internet experience. Would you like to
    have your Facebook account broadcast on a big screen for everyone to see? Probably
    not.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'The emerging common behavior is for web TVs to be used for video and interactive
    services, with a real-time social aspect appearing concurrently on the user''s
    mobile or tablet. Recent research shows that 77 percent of people use another
    screen while watching (if that''s the right word) TV, and of that figure, only
    5 percent or so are performing an activity that''s relevant or complementary to
    what''s on.


    # The Others


    These four broad categories—desktop/laptop, mobile, tablet, and TV—cover the majority
    of the web-enabled device market, but they''re by no means exclusive. Many other
    devices have web browsers, they aren''t always used with great frequency.


    Each of the current generation of games consoles has a browser: The PlayStation
    3 uses the WebKit-based NetFront, Microsoft''s Xbox 360 Internet Explorer 9, and
    Nintendo''s Wii U has a custom build of WebKit. Likewise, portable games consoles
    have browsers: The PlayStation Vita uses NetFront, as newer versions of the Nintendo
    3DS (older versions use Opera). Bear in mind that each uses a slightly different
    control system. (On more of the topic, see Anna Debham''s amazing work in the
    field listed in "Further Reading" on page 10).


    And let''s not forget ebook readers, such as Amazon''s Kindle, the Kobo, Barnes
    & Nook, and series from Sony. When I use the term ebook readers, I''m referring
    specifically to "e-ink" readers, as each company also has a full-color screen
    version that is more like a tablet.) The ebook readers tend to be Kindle based,
    and their challenges come from low-powered processors, little memory, and very
    slow refresh rates. They wouldn''t be the first-choice browser of many, but as
    ebooks become more interactive, they may become more popular.


    # The In Betweens


    The iPhone 4 has a screen of 3.5" diagonally, and the iPhone 5, 4", Samsung''s
    Galaxy S III has a diagonal length of 4.8"; LG''s Optimus Vu, 5", and Samsung''s
    Galaxy Note II, 5.5"; Google''s Nexus 7 is 7" diagonally, and Amazon''s Kindle
    Fire HD comes in 7" and 9" formats. The iPad mini is 7.9" diagonally and the iPad,
    9.7".


    In other words, the great variety of screen sizes makes the distinction between
    mobile and tablet quite hard to pin down. The only criteria I can think of separate
    them are based on whether they have native telecom ability, can fit comfortably
    in a pocket, and can be used comfortably with one or two hands.


    In fact, computing is experiencing a general convergence. Microsoft''s Surface
    is a tablet with an optional keyboard in the cover. When keyboard and tablet are
    attached, the Surface looks and behaves like a laptop. The Ubuntu phone runs Android,
    except when you dock it to a screen, it'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'runs a full version of the Linux desktop. The PadFone by Asus is a phone that
    turns into a tablet when docked with a larger touchscreen. Your TV becomes a media
    center when you plug Apple TV or Roku into it.


    This change is set to update all of our existing terminology. In the foreseeable
    future, the word tablet will be as meaningful as the floppy disk icon used to
    mean save in many software applications. One day, everything will be screens.


    # The Multi-screen World


    The idea of a user being a "mobile user" or "tablet user" is somewhat misguided
    because people are much more likely to use many devices, often at the same time.
    Research conducted for Google in 2012 indicated that 81 percent of participants
    used their smartphone while watching TV, and 66 percent had it available while
    using a desktop. This use of multiple devices is currently known as simultaneous
    screening.


    Meanwhile, 90 percent of participants started a task on one device and finished
    it on another; for example, they browsed websites on a smartphone and then moved
    to a laptop at the time of purchase. This movement between consecutive devices
    depending on the task performed is labeled sequential screening.


    In other words, visitors to your website will visit from two or three different
    devices, and although they''ll have different aims each time, they''ll want access
    to the same information.


    # Context: What We Don''t Know


    The most important thing to bear in mind is how much we don''t know about the
    people using our sites. We don''t know where they are—I don''t mean geographically,
    as we can use GPS to locate them. I mean whether they''re at home, at work, at
    work, and so on. In essence, we have no idea of the context in which someone is
    using our site.


    The common presumption is that people using mobile are on the move and in a hurry,
    often using low-bandwidth 3G connections, but that''s not always the case: Mobile
    is used at home with a fast Wi-Fi connection. But even the connection doesn''t
    tell the whole story; the signal may be poor or the bandwidth reduced because
    of congestion in the neighborhood. In fact, 3G (or 4G in many countries) networks
    might provide a much better connection in many cases.


    We also presume that mobiles are less powerful than desktops, but even that may
    not be true for much longer. Twin- or even quad-core phones with fast processors
    are making their way to the market, and within a year or two, who knows how much
    power they''ll have. And tablet/laptop hybrids like many Windows 8 devices are
    now more capable than laptops just a few years old.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'There''s also the issue of size. The presumption is that for a large-screen
    device like a TV, viewers want a richer graphical environment, but a large screen
    doesn''t equal a powerful processor or a fast connection. Many enabled TVs have
    processors no more powerful than a smartphone, and the connection speed is open
    to the same vagaries as any other device. And with size comes the question of
    portability. The more portable the device, the less certain we can be of the context
    in which it''s being used.


    Really, the cardinal rule is this: We cannot make assumptions. And having that,
    I''m going to break my own rule.


    # Some Context Stereotypes


    To avoid repetition in this book, I rely on a few shorthand contexts on common
    scenarios. These won''t necessarily be the most common scenarios, but those I
    think are common enough to serve a useful purpose. One example: Mobile users don''t
    have a super-fast Internet connection. Often mobile users are using their devices
    from home with a mega-fast fiber-optic connection broadcast over Wi-Fi 2 feet
    away, and the opposite is often just true: They''re away from home and relying
    on a weak 3G signal (as happens to me too). Many smartphones are built with scenarios
    like this in mind; they limit the number of connections that can be made at any
    time in order to get precious data from the user''s limited tariff.


    Likewise, a user with a desktop computer will likely have a broadband connection,
    providing fast data transfer rates. That''s not always true, of—many people in
    rural areas have extremely low broadband speeds or still use dial-up—but the first
    scenario is common enough that one can use or use it as a shorthand.


    I use shorthands like these throughout the book simply to avoid constant clarification
    and repetition, and I can''t drum enough the idea that these presptions can''t,
    and shouldn''t, be foremost in your mind when building and planning websites or
    applications.


    # "Fast" Is the Only Context That Matters


    You have a challenge here. You don''t know who your users are, where they are,
    what they are doing, or which device they are using. You can find out some (although
    not all) of that information, but their full context is completely unknown and
    varies for each individual. The only thing you can reasonably know for certain
    is either they want access to what you''re offering or they want to find out it''s
    not what they want. Either way, they want the answer quickly.


    Performance is the only criterion that matters. Whether users are on a smartphone
    during rush hour and looking for information about the next train home or browsing
    through a shopping site curled up on the sofa at home, they have a task that they
    want to complete as soon as possible, and completing this task using the nearest
    device will make them feel more efficient (this is known as found time).'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Your site needs to be fast—and feel fast—regardless of the device it''s being
    displayed on. And fast means not only technical performance (which is incredibly
    important) but also the responsiveness of the interface and how easily users can
    navigate the site and find what they need to complete the task that brought them
    to you in the first place.


    # # What You''ll Learn


    I''ll be up-front and start telling you what I won''t be teaching in this book:
    designing the strengths of each platform. I can''t do that because I can''t teach
    what I don''t know. I am a developer rather than a designer for a reason, and
    that''s because I use Photoshop, the result looks as if I was using the mouse
    while wearing boxing gloves.


    What I will teach is modern coding methods and techniques that you can use to
    build websites that work across multiple devices or are tailored to the single
    device class you''re targeting. (The technologies themselves are all explained
    in Chapter 1, so I won''t go into detail here.)


    As you read this book, keep in mind these very important points:


    +   - The pool of technologies is so vast that I can''t cover it all. I tell you
    what I consider to be the core techniques and technologies that you need to build
    web projects across the range of devices.

    - Not everything in this book will end having widespread adoption—at least not
    in the form I show in this book. The Web is constantly evolving, and book publishing
    means just a single snapshot of a moment. Some things will change; some will and
    be removed. I''ve tried to mitigate this by covering only technologies that are
    on open standards rather than vendor-specific ones that already have some level
    of implementation in browsers.


    As a developer, you should do this: Stay informed. Keep up-to-date with the developments
    in web standards, which can be curious, playful or keep top of it all. You''re
    lucky enough to work in an industry based on sharing knowledge, some of the people
    and websites I mention in this book, find your sources, get on Twitter, go to
    local web development community meetups. Stay involved and active. There''s never
    been a more exciting time to work in web development, but you''ll need to put
    in an extra shift to really advantage of it.


    Above all, think of what you will build in the greater scheme of things. If you''re
    building a website, don''t think of "building a site for web and mobile," think
    of building a site that works everywhere. Think of how people will use it, what
    they''ll want from it, and what you as a developer can do to aid them in achieving
    their goals—not just now but in the future. We''ve seen such a major transformation
    of the Web in the past five years—who can say where it will be another years from
    now.'
