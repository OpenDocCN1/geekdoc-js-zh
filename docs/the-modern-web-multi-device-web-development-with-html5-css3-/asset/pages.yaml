  md: "When an element has been put in fullscreen mode, you might want to style it\
    \ (or its children) a little differently. It's proposed that you can do this with\
    \ a new dedicated CSS pseudo-class, which will be called either :fullscreen or\
    \ :full-screen:\n\n```\n.target:full-screen {}\",\n```\n\n# Vibration\n\nThe Vibration\
    \ API makes a device vibrate, providing some haptic feedback for your users. This\
    \ API actually used to be called the Vibrator API, but I'm sure you don't need\
    \ me to tell you that name was changed very quickly. Obviously not all devices\
    \ are capable of vibrating, larger ones, so this API is decidedly more useful\
    \ in mobile devices.\n\nThe API is extremely simple, requiring only the vibrate()\
    \ method on the navigator object. The value supplied to vibrate() is a figure\
    \ representing the hundreds of milliseconds to vibrate; for example, make the\
    \ device vibrate for one-fifth of a second after the user has completed a touchend\
    \ event, use this code:\n\n```\ndocument.addEventListener('touchend', function\
    \ () {\n  window.navigator.vibrate(200);\n});\n```\n\nYou can also use an array\
    \ of values that alternate between vibrations and pauses; that is, the odd-numbered\
    \ values are vibrations and the even values are pauses. In this example, the device\
    \ vibrates for 200ms, pauses for 200ms, and vibrates for 500ms:\n\n```\ndocument.addEventListener('touchend',\
    \ function () {\n  window.navigator.vibrate([200,200,500]);\n});\n```\n\nVibrating\
    \ runs down the battery more quickly, so use this API with caution. You can manually\
    \ stop a vibration by using a 0 or an empty array value. In this case, the device\
    \ will begin to vibrate for 5 seconds when the touch event starts, and then stops\
    \ when the event ends:\n\n```\ndocument.addEventListener('touchstart', function\
    \ () {\n  window.navigator.vibrate(5000);\n});\ndocument.addEventListener('touchend',\
    \ function () {\n  window.navigator.vibrate(0);\n});\n```"
