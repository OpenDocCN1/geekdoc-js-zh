- img_proc: true
  md: 'The HTML5 Test is a site that tells you how many features from the HTML5 spec
    your browser supports, but very usefully records of implementation levels across
    many different browsers and devices, including TV and game console browsers, and
    also allows you to do side-by-side comparisons of up to three different browsers.
    The site is limited to only HTML5 support, however.


    # # Test and Test and Some More


    With the device landscape the way it is, the only way to ensure that the sites
    you build across multiple devices is to test. Test at the start of the project,
    test at the end, and test at every opportunity all the way through. If you''re
    planning a multi-device project, factor in testing to take up to 40 to 50 percent
    of build time. Seriously.


    You can''t find a substitute for testing on actual devices, so start building
    a library of as many devices as you can. If you work other agencies, considering
    pooling resources you can get a broader range. In many cities, open labs are being
    assembled, with a range of devices denoted by local developers and companies that
    are available for anyone to use. Search online for your nearest lab, or consider
    getting involved with creating one at your place or place of work.


    And don''t stick to only mobile and tablet testing; think about games console
    browsers if you''re targeting your sites at a younger audience (research suggests
    that some one in teens in the US use their games console to go online) or TV if
    your sites are aimed at a leisure market.


    If you can''t access to actual devices, some dedicated tools are available, and
    most (if not all) OS creators and/or device manufacturers have free-to-download
    software development kits (SDKs) with emulators. In the mobile and tablet space,
    Android, Windows Phone, and Blackberry all have SDKs, and many besides. Apple''s
    Xcode, from the App Store, features an iOS simulator lets you switch between device
    and OS versions for testing.


    Once set up, many of these SDKs also allow you to connect physical devices via
    USB to debugging via a paired browser, but an easier way is to do this with Opera''s
    Mobile Emulator; once opened and connected to an Opera desktop version, you can
    use the developer tools on the desktop to debug the page on the mobile. If you
    need to use WebKit—and it''s the dominant mobile-device engine, why wouldn''t
    you?—software wealird lets you connect a version of Chrome or Safari on the desktop
    with Android, iOS, or Blackberry emulators/simulators.


    Adobe also has a tool called Edge Inspect, which synchronizes the Chrome browser
    with any device running the Edge Inspect app (currently available on iOS and Android),
    allowing you to preview your site on many different devices simultaneously and
    use the Web Inspector for remote debugging.'
