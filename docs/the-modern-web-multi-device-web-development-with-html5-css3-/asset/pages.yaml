- img_proc: true
  md: 'Now you clearly know which header is important and what the main body content
    is. You''ve given the content some aboutness.


    As well using semantic elements correctly to mark your content, you can increase
    the meaning of your documents for machines rather than users (commonly known as
    structured data) in a number of ways. You can use existing attributes and elements
    in defined patterns (microformats) or extend your HTML with new attributes (RDFs
    and microdata), and I will introduce them briefly right now.


    # # Microformats


    Created by a grassroots coalition of developers, microformats add extra meaning
    to content through standardized markup patterns using existing attributes. Their
    main attraction is that they work with current development methods; rather than
    being an extension to HTML, they are a design principle or a set of standard usage
    patterns.


    Microformats range from the fairly to the extremely. Here''s an example of the
    most simple of:


    ```

    <a href="http://flickr.com/tags/gorilla/" rel="tag">About Gorillas</a>

    ```


    That''s the Rel-Tag microformat. The keyword tag in the rel attribute lets others
    machines know the URL linked to the element is a page that is described by a tag,
    the name of which is the last component of the URL—in this case, Gorilla. At this
    point, I should point out—if you hadn''t noticed—that I like gorillas.


    A more complex, although as straightforward and useful, example is the hCard microformat,
    which marks up common user details with standardized "business card" syntax. Consider,
    for example, this markup, I might use to link to someone''s contact details online:


    ```

    <div class="details">

    <p><a href="http://about.me/petergasston">Peter Gasston</a> writes for <a href="http://broken-links.com">Broken
    Links</a></p>

    </div>

    ```


    The markup is fine, but the data doesn''t have a lot of about; the reader would
    understand that this is my name and what I write, a search engine crawler would
    probably not be able to make the same cognitive leap. Using the hCard pattern,
    I can add attribute values to that markup that provides more semantic richness:


    ```

    <div class="vcard">

    <p><a href="http://about.me/petergasston" class="url fn">Peter Gasston</a> writes
    for <a href="http://broken-links.com" class="url org">Broken Links</a></p>

    </div>

    ```'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'Those standardized class names have given much more meaning to this content
    for machines that are programmed to find; a crawler that recognizes the hCard
    pattern will see the vcard class and know that the content inside contains the
    information it''s looking for: it knows the first link contains the full name
    (fn) of the contact, and the second link contains the organization (org) that
    works for. There''s more to microformats than this; there are patterns for events,
    reviews, geographic coordinates, ever recipes, and plenty besides. Search engines
    like Google use them to improve their search results, using microformats in your
    pages is not (only) an exercise in developer esotericism.


    # RDFa


    The Resourcer Description Format in Attributes (RDFa) is an extension of HTML
    that provides context to content using a whole new set of bespoke attributes.
    The main syntax is known as RDFa Core, and a small subset RDFa Lite is also available.
    Both rely on predefined schema (descriptions of data) to describe content.


    Better than telling you what that means, I''ll show you (those years at screenwriting
    will not go to waste!). One item of data across the Web, especially on blogs and
    news sites, is a date. Quite often you''ll see a date marked up like this:


    ```

    <p class="date">2013-04-01</p>

    ```


    The markup is functional and uncomplicated, but the only semantic context is provided
    by the class name. With RDFa Lite, you can make this more meaningful and let other
    machines know this is a date by using the new property attribute:


    ```

    <p property="http://purl.org/dc/elements/1.1/" content="2013-04-01"></p>

    ```


    The value of the attribute is the URL of the description term "date" from a schema
    that is part of a standardized vocabulary known as Dublin Core. You probably noticed
    that the date I''ve used is not in a very reader-friendly format. This is a drawback
    of RDFa Lite: All the content must be formatted in a strictly machine-readable
    way. To provide content better suited for humans, you use RDFa Core. I give one
    set of information to machines and another to people, using the content attribute:


    ```

    <p property="http://purl.org/dc/elements/1.1/" content="2013-04-01">April 1</p>

    ```'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'What the reader sees is the content of the element; what the machine sees is
    the value of the attribute. It means extra markup, but everybody''s happy.


    As with microformats, some search engines look for common RDFa patterns to improve
    their search results. I’ll go into this more detail in “Rich Snippets” on page
    34.


    # # Microdata


    HTML5 has addressed the semantic issue with the creation of a simple syntax called
    microdata. This is essentially a series of name-pairs that provide meaningful
    machine-readable data. As always, before trying to explain it, showing how it
    works is easier:


    ```

    <p itemscope>I live in <span itemprop="city">London</span>/</p>

    ```


    **This markup creates a simple item.** The itemscope attribute is used on the
    containing element to mark the limits, or *scope*, of this particular item. Inside
    we have the name-value pair, known as a *property*. The value of the itemprop
    attribute is the name—which, in this example, is *city*—and the element’s content
    is the value—in this case, *London*. The result is an item with a single property:


    city: ''London''


    But you’re not limited to a single property per item; you can have many as you
    like:


    ```

    <p itemscope>Hello, my name is <span itemprop="given-name">Peter/</span> and I’m
    <span itemprop="role">developer</span> from <span itemprop="city">London</span>/</p>

    ```


    In this case, the property list looks like this:


    ```

    given-name: ''Peter''

    role: ''a developer''

    city: ''London''

    ```


    As you can see, this markup is somewhat similar to RDFa, and just like that format,
    you can give different values to machines and humans. Look at this example where
    I use the datetime attribute:


    ```

    <p itemscope>My birthday this year is on <span itemprop="birthday" datetime="2013-12-14">December
    14</span>/</p>

    ```'
  merge: -1
