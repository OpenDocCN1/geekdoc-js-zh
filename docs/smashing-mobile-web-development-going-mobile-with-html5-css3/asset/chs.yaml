  图 6-3：显示数据库的 Web 数据库\n\n尽管这是一个很好的工具，但你无法编辑条目或删除旧数据库；它是一个只读工具。\n\n### 设置表\n\n现在你已经知道如何创建数据库，是时候构建用于管理软塞（Corks）的表了。该应用程序很简单，但有时绘制数据库地图以查看表与表之间如何交互是非常重要的。\n\
  \n### 创建葡萄酒表\n\n使用此表存储制作单种葡萄酒的所有葡萄酒。\n\n| 字段 | 数据类型 | 说明 |\n| :--- | :--- | :---\
  \ |\n| `wine_id` | `Integer (11) - Auto_Increment` | 这是葡萄酒的标准 ID。它每次输入都会递增。 |\n\
  | `wine_name` | `VARCHAR (255)` | 这是你输入的字符串葡萄酒名称。默认长度为 255 个字符；如果需要更多，可以将数据类型更改为\
  \ `TEXT`。 |\n| `wine_description` | `TEXT` | 对于每种葡萄酒，用户可以选择输入葡萄酒描述。 |\n| `wine_abv`\
  \ | `INT (11)` | 此字段代表每件葡萄酒的酒精含量。 |\n| `winery_id` | `INT (11)` | 这是为单种葡萄酒的酒庄创建的基础性\
  \ ID。这是一个外键。 |\n| `color_id` | `INT (11)` | 这是与颜色表关联的数字 ID。 |\n| `created_at` |\
  \ `Timestamp` | 这是葡萄酒插入表时的日期/时间。 |\n\n在规划表及其数据类型后，执行 SQLite 创建表：\n\n```javascript\n\
  db.transaction(function (tx) {\n  tx.executeSql('CREATE TABLE IF NOT EXIST wines(\n\
  \    wine_id INTEGER PRIMARY KEY,\n    wine_name VARCHAR(255),\n    wine_description\
  \ TEXT,\n    wine_abv INTEGER,\n    winery_id INTEGER,\n    color_id INTEGER,\n\
  \    created_date TIMESTAMP\n  ););\n});\n```\n\n\n\n酒庄表（winery）的目标是存储每个酒庄的所有信息。单家酒庄可以提供多种葡萄酒，而一种葡萄酒仅属于一个酒庄。当然，也可能存在多家酒庄合作生产一种葡萄酒的情况，但本示例忽略了这种可能性。理解数据库中“多对一”和“一对一”模式的本质非常重要，这有助于你确定信息流的方向。\n\
  \n你将在酒庄表中使用的字段如表 6-4 所示：\n\n### 表 6-4 酒庄表结构\n\n| 字段 | 数据类型 | 描述 |\n| :--- | :---\
  \ | :--- |\n| `winery_id` | `Integer (11) - Auto_Increment` | 这是数据库中录入每个酒庄的标准数值条目。该\
  \ ID 与葡萄酒表对应，用于识别该葡萄酒属于哪个酒庄。 |\n| `winery_name` | `VARCHAR (255)` | 这是强类型格式的酒庄名称。与葡萄酒表中的\
  \ `wine_name` 类似，最大字符限制为 255。 |\n| `created_at` | `Timestamp` | 这是酒庄插入表的时间。在插入行时会自动创建。\
  \ |\n\n输入以下代码来创建此表：\n\n```javascript\ndb.transaction(function (tx) {\n  tx.executeSql('CREATE\
  \ TABLE IF NOT EXIST winery(' +\n  'winery_id INTEGER PRIMARY KEY,' +\n  'winery_name\
  \ VARCHAR(255),' +\n  'created_at TIMESTAMP');');');\n});\n```\n\n### 创建活动表（activity\
  \ table）\n\n活动表包含用户当前存储在酒窖中的所有信息。该表依赖葡萄酒表来获取葡萄酒信息，但其他内容将是原始的。主活动源将从该表中提取查询，其结构如表\
  \ 6-5 所示。\n\n### 表 6-5 活动表结构\n\n| 字段 | 数据类型 | 描述 |\n| :--- | :--- | :--- |\n| `activity_id`\
  \ | `Integer (11) - Auto_Increment` | 这是为每个条目创建的标准数值 ID。 |\n| `wine_id` | `Integer\
  \ (11)` | 该字段映射回葡萄酒表，允许你获取有关葡萄酒的信息——例如颜色、葡萄酒描述等。 |\n| `activity_note` | `TEXT` |\
  \ 这允许用户为每瓶酒窖中的葡萄酒添加备注。 |\n| `activity_quantity` | `INT (11)` | 该字段代表酒窖中葡萄酒总数的数值。你的用户可能拥有一瓶，也可能有一箱，因此该字段有助于定义数量，使用户无需重复输入葡萄酒。\
  \ |\n| `created_at` | `Timestamp` | 这是葡萄酒加入酒窖的时间。在查看活动源时将使用此字段。 |\n\n在定义表和数据类型后，以下是在\
  \ Web SQL 中生成表的代码：\n\n```javascript\ndb.transaction(function (tx) {\n  tx.executeSql('CREATE\
  \ TABLE IF NOT EXIST activity(' +\n  'activity_id INTEGER PRIMARY KEY,' +\n  'wine_id\
  \ INTEGER,' +\n  'activity_note VARCHAR(255),' +\n  'activity_quantity INTEGER,'\
  \ +\n  'created_at TIMESTAMP');');');\n});\n```\n\n### 创建颜色表（color table）\n\n这是一个简单的颜色表，存储与葡萄酒关联的颜色\
  \ ID 和名称。每种葡萄酒只能有一种颜色，因此该表与葡萄酒表之间是一一对一的关系。表 6-6 描述了此表。\n\n### 表 6-6 颜色表结构\n\n| 字段\
  \ | 数据类型 | 描述 |\n| :--- | :--- | :--- |\n| `color_id` | `Integer (11) - Auto_Increment`\
  \ | 这是为每个颜色创建的标准数值 ID。该 ID 链接回葡萄酒表。 |\n| `color_name` | `VARCHAR(255)` | 显示在主页上的颜色名称。\
  \ |\n\n最后，是创建颜色表的代码段。你将在颜色表中为葡萄酒插入一些默认值（例如白色、红色和其它颜色）：\n\n```javascript\ndb.transaction(function\
  \ (tx) {\n  tx.executeSql('CREATE TABLE IF NOT EXIST color(' +\n  'color_id INTEGER\
  \ PRIMARY KEY,' +\n  'color_name VARCHAR(255)');');');\n  tx.executeSql('INSERT\
  \ INTO color (color_name) VALUES (\"Red\");');\n  tx.executeSql('INSERT INTO color\
  \ (color_name) VALUES (\"White\");');\n  tx.executeSql('INSERT INTO color (color_name)\
  \ VALUES (\"Other\");');\n});\n```\n\n对于此脚本，不要覆盖数据库中的数据非常重要。良好的做法是在插入“白色”或“红色”之前先检查该值是否存在，以避免重复。你可以通过两种方式实现这一点：\n\
  \n设置 `localStorage`，在值已插入的情况下存储存储 `YES` 或 `NO`：\n\n```javascript\nif (localStorage.getItem(\"\
  is_inserted\") == \"NO\") {\n  // 执行插入\n}\n```\n\n或者，执行 Web SQL 查询以确定该颜色是否已添加到数据库。如果否，则进行插入：\n\
  \n```javascript\ndb.transaction(function (tx) {\n  tx.executeSql(\"SELECT * from\
  \ color where color_name = 'Red'\",\n  function (tx, res) {\n    if (res.rows.length\
  \ == 0) {\n      // “红色”不存在，应该插入它\n    }\n  });\n});\n```\n\n## 总结\n\n本章接触了不同类型数据库的区别：\n\
  \n字体 使用本地存储\n- 创建模式\n- 实现读写\n\n## 第三部分：开发\n\n### 第 7 章：与 Web SQL 交互\n\n在处理移动应用时，开发者必须注意带宽限制。缓存数据可以提高速度。本章向你介绍了如何使用本地存储和\
  \ SQL 数据库。由于这些存储在浏览器中，因此不需要网络连接。\n\n在本章中，你将继续开发示例应用 Corks。在本章结束，你应该：\n\n- 构建基础数据库和静态表\n\
  - 构建管理葡萄酒页面\n\n### 要构建元素\n\n在前章节中，你定义了数据库结构，它由颜色、活动、酒庄和葡萄酒表组成。你首先要做的是运行脚本以创建数据库，以便添加元素，例如添加活动和葡萄酒。\n\
  \n##### 创建数据库及其表\n\n为了跟随，你需要运行一些代码来创建数据库。按照以下步骤创建主数据库：\n\n1. 打开所需的文本编辑器并开始编辑 `index.html`\
  \ 文件。\n\n2. 在 `<body>` 标签底部添加代码片段：\n\n```html\n<script type=\"text/javascript\"\
  \ language=\"Javascript\">\nvar db;\n$(document).ready(function(){\n});\n</script>\n\
  ```\n\n此片段允许你在文档完全加载时触发 JavaScript 代码。`db` 变量用于跟踪数据库事务。\n\n3. 使用以下片段为 `Corks` 创建数据库：\n\
  \n```javascript\nvar db;\n$(document).ready(function(){\n  db = openDatabase('myCorks',\
  \ '1.0', 'My Corks Database', 2 * 1024 * 1024);\n});\n```\n\n现在数据库将以 myCorks 命名创建。如果你保存了\
  \ index 文件并打开 Web 检查，你应该看到类似于图 7-1 所示的页面。\n\n![9781118348161-fg0701.eps](img/9781118348161-fg0701_fmt.png)\n\
  \n图 7-1：打开数据库的 Web \n\n现在你开始构建表。按照以下步骤操作：\n\n\n\n\n\n1. 打开 `db` 变量的事务方法并使用 `executeSQL`\
  \ 命令：\n\n```javascript\ndb.transaction(function (tx) {\n  tx.executeSql(“CREATE\
  \ TABLE IF NOT EXISTS wines (wine_id INTEGER PRIMARY KEY AUTOINCREMENT, wine_name,\
  \ wine_description, wine_abv, winery_id, color_id, created_at)”, null, sR, fR);\n\
  \  tx.executeSql(“CREATE TABLE IF NOT EXISTS winery (winery_id INTEGER PRIMARY KEY\
  \ AUTOINCREMENT, winery_name, created_at)”, null, sR, fR);\n  tx.executeSql('CREATE\
  \ TABLE IF NOT EXISTS color (color_id PRIMARY KEY AUTOINCREMENT, color_name, created_at)’,\
  \ null, sR, fR);\n  tx.executeSql('CREATE TABLE IF NOT EXISTS activity (activity_id\
  \ PRIMARY KEY AUTOINCREMENT, wine_id, activity_note, activity_quantity, created_at)’,\
  \ null, sR, fR);\n});\n```\n\n注意，你设置了 `sR` 和 `fR` 回调函数，它们将捕获创建表时的错误。你可以在它们定义在 `document.ready()`\
  \ 函数外部，如下所示：\n\n```javascript\nfunction sR(a,b){\n  // 查询成功！\n}\nfunction fR(a,b){\n\
  \  // 哎！出问题了。让我们通知用户。\n  alert(b.message);\n}\n```\n\n在这个示例中，如果查询成功，脚本将什么都不做；但如果在创建过程中出现问题，它将弹出错误（以\
  \ `b.message` 的形式显示）。\n\n在创建和测试数据库时，你会在 Web 检查器（Web Inspector）中看到多个数据库，类似于图 7-2\
  \ 所示。\n\n![9781118348161-fg0702.eps](img/9781118348161-fg0702_fmt.png)\n图 7-2：Web\
  \ 检查器中的多个数据库\n\n这是正常行为，因为每次启动时都会创建一个新版本。但是，如果数据库表存在，它将覆盖表中的数据。根据 Web SQL 规范，没有办法删除数据库版本。删除这些数据库唯一的方法是清除浏览器的网页缓存和网络数据。\n\
  \n注意！这也会清除所有活跃的表。\n\n2. 保存此 `index.html` 文件并在浏览器中加载它。在 Web 检查器中打开你最后的数据库 `myCorks`。你应该能看到一张类似于图\
  \ 7-3 的图片：\n\n![9781118348161-fg0703.eps](img/9781118348161-fg0703_fmt.png)\n图 7-3：Web\
  \ 检查器中的 myCorks 数据库\n\n## 向颜色表添加值\n\n为了让你你让你在“添加葡萄酒”（Add Wine）过程中重新填充下拉列表的值，你需要在应用程序首次启动时为颜色名称添加值。\n\
  \n要实现此操作，请按照以下步骤进行：\n\n1. 在创建表之后，创建另一个事务来测试颜色表中是否有任何值。在 `CREATE TABLE` 事务之后添加以下代码：\n\
  \n```javascript\ndb.transaction(function (tx) {\n  tx.executeSql(“SELECT * from\
  \ color where color_name = ?”, [‘Red’],\n  function(tx, res) {\n    if (res.rows.length\
  \ == 0) {\n      var start = new Date().getTime();\n      tx.executeSql：“INSERT\
  \ INTO color (color_name, created_at) VALUES(‘White’, ?)”, [start], null, fR);\n\
  \      tx.executeSql：“INSERT INTO color (color_name, created_at) VALUES(‘Red’, ?)”,\
  \ [start], null, fR);\n      tx.executeSql：“INSERT INTO color (color_name, created_at)\
  \ VALUES(‘Other’, ?)”, [start], null, fR);\n    }\n    else {\n      // 表已经有值了 -\
  \ 所以保持原样。\n    }\n  },\n  fR);\n});\n```\n\n此脚本查询颜色表以检查数据库中是否存在值。如果没有行（`res.rows.length`\
  \ 变量为 `0`），你可以使用 `d` 作为指示当前时间的变量将新数据插入数据库。相反，如果表中已经有行，则保持原样。\n\n2. 保存此文件并刷新浏览器。在\
  \ Web 检查器中，你应该能在 `myCorks` 数据库部分看到颜色表。点击颜色表后，你应该能看到图 7-4 所示的图片。\n\n![9781118348161-fg0704.eps](img/9781118348161-fg0704_fmt.png)\n\
  图 7-4：颜色表及其三个结果：红、白、其他\n\n由于 `color_id` 被设置为 `AUTOINCREMENT`，它将自动添加带有正确 ID 的下一行。\n\
  \n`AUTOINCREMENT` 是任何数据库系统（不仅是 Web SQL）的一个重要功能，允许你快速创建顺序格式的 ID 数字。许多博客内容管理系统使用此属性为每篇博客文章自动创建一个新\
  \ ID，以确保其始终唯一。在大多数数据库系统中，只有主键（唯一值）具有此功能。\n\n## 构建页面\n\n为了在“添加葡萄酒”过程中重新填充下拉列表的值，你需要在应用程序首次启动时为颜色名称添加值。\n\
