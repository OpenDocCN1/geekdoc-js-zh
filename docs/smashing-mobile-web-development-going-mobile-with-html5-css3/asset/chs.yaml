  \n## 总结\n\n本章侧重于构建主要的交互查询并设置**管理**页面。以下是所涵盖的一些主题的总结：\n\n* 你为 Corks 构建了基础数据库，并使用\
  \ Web SQL 添加了示例颜色表。\n* 你为 Corks 构建了**管理页面**，包括用于添加葡萄酒和酒庄的 Web SQL 查询。\n* 你构建了查询，将新葡萄酒添加到你的**酒窖（Cellar）**\
  \ 活动中。\n\n## 第 8 章：地理定位与 AJAX\n\n在移动设备上使用 HTML5 的益处之一是它让你能够使用地理定位功能为用户提供本地内容。其范围可以从显示附近的餐厅列表、特价活动，甚至是朋友。地理定位让你能够找到用户的物理位置，然后你可以利用该位置查找本地信息或根据位置交付内容。HTML5\
  \ 引入这项新技术为 Web 开发者开启了许多思路。在 HTML5 之前，无法在浏览器中访问位置信息，只能通过构建原生应用。大多数移动应用都使用地理定位，支持\
  \ HTML5 特性的桌面浏览器也可以访问此功能。\n\n一旦应用访问了用户的位置信息，大多数情况下它希望向外部服务发起调用以返回某些数据。例如，你可以使用 `Instagram`\
  \ 等 API 来扫描当前位置周围的照片。异步发起外部 HTTP 调用（意味着不需要重新加载网页）的方法被称为 AJAX，全称为异步 JavaScript 和\
  \ XML。AJAX 允许你使用来自地理定位的坐标为你的用户提供丰富的本地内容。\n\n在本章中，你将完成**查找**标签页，并使用 foursquare API\
  \ 编写一些 AJAX 和地理定位函数。这将让你能够快速扫描用户当前位置周围的葡萄酒商店。你还使用 Google Maps API 将这些结果显示在交互式地图上，让用户能够点击自定义标记以显示更多详细信息。\n\
  \n在本章中，你继续开发我们的示例应用 Corks。在本章结束时，你应该能够：\n\n* 为 Corks 构建**查找**标签页。\n* 构建内置地理定位功能以获取用户的位置。\n\
  * 使用 AJAX 向 foursquare API 提交查询，获取用户当前位置周围的相关场所。\n* 使用 Google Maps API 在地图上绘制标记点，并使用信息框提供更多信息。\n\
  \n#### 需要构建的元素\n\n在上一章中，你构建了存储系统中葡萄酒和酒庄的数据库结构。在本章中，你将构建**查找**标签页、地理定位和 AJAX 元素，这些元素将使能够与用户的位置及其周围场所进行交互。\n\
  \n### 创建查找页\n\n由于你已经用**查找**标签页定义了顶部导航结构，你只需要构建该页面即可。\n\n1. 打开你的文本编辑器并从 `index.html`\
  \ 开始。`index.html` 文件。\n2. 在 `index.html` 中添加以下结构：\n\n```html\n<div data-role=\"\
  page\">\n  <header data-role=\"header\">\n    <h1>Find</h1>\n    <ul data-role=\"\
  list\">\n      <li><a href=\"#activity\">Activity</a></li>\n      <li><a href=\"\
  #manage\">Manage</a></li>\n      <li><a href=\"#find\">Find</a></li>\n      <li><a\
  \ href=\"#settings\">Settings</a></li>\n      <li><a href=\"#search\">Search</a></li>\n\
  \    </ul>\n  </header>\n  <main data-role=\"main\">\n    <div id=\"map\"></div>\n\
  \  </main>\n</div>\n```\n\n3. 当使用 Google Maps 时地图会被截断，如图 8-1 所示。为了防止这种情况发生，请编写一个处理地图创建的自定义脚本。在\
  \ `global.js` 中，在 `$(document.)ready()` 函数之前添加以下代码：\n\n```javascript\n$(window).bind('hashchange',\
  \ function(e){\n  e.preventDefault();\n  newHash = window.location.hash.substring(1);\n\
  \  if (newHash == \"find\") {\n    if ($(\"#map\").html() == \"\") {\n      navigator.geolocation.getCurrentPosition(successPosition,\
  \ errorPosition);\n    }\n  }\n});\n$(window).trigger('hashchange');\n```\n\n此应用使用\
  \ `getCurrentPosition` 方法获取一次用户位置。另一种方案是使用 `watchPosition` 方法，它从较低精度的位置开始，直到确定更准确的位置为止不断聚焦。这可以节省电量。有关这两者的更多信息，请参阅\
  \ [`https://developer.mozilla.org/en-US/docs/Using_geolocation`](https://developer.mozilla.org/en-US/docs/Using_geolocation)。\n\
  \n当你第一次请求访问用户位置时，大多数设备上都会弹出一个警告，询问是否允许用户的位置。在 iOS 上，它看起来像图 8-2 所示的消息。\n\n![9781118348161-fg0802.eps](img/9781118348161-fg0802_fmt.png)\n\
  \n图 8-2：此警告正在请求用户的位置。\n\n\n\n\n\n需要注意的是，网站的 URL（示例中的 `http://m.untappd.com`）将显示在给用户的警报中。如果你在\
  \ `localhost` 上运行此程序，取决于你的虚拟主机配置，可能会显示 IP 地址而不是 URL。\n\n你只需要再执行几个步骤即可完成 Google Maps\
  \ 的功能配置：\n\n1. 添加一些全局变量 `lat` 和 `lng`，它们将存储你在应用程序中使用的纬度和经度变量。将以下代码添加到 `global.js`\
  \ 中，置于你刚刚编写的脚本上方，`var db; //` 这一行的下方：\n\n```javascript\nvar lat;\nvar lng;\n\n$(document).ready(function(){\n\
  \  ..\n  // database initialization is here\n});\n```\n\n2. 在页面顶部添加一些 JavaScript。只需在\
  \ `index.html` 的 `head` 区域添加以下 `script` 标签即可：\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"http://maps.google.com/maps/api/js?sensor=false\"></script>\n```\n\n这段代码启用了\
  \ `google.maps` 对象，你稍后在本章节中使用该对象来映射从 Google Places API 返回的点。\n\n### 创建回调函数\n\n在与地理位置交互时，开发者需要设置回调函数，根据地理位置执行的成功或失败进行相应的处理。让我们从成功函数开始。步骤如下：\n\
  \n1. `success` 函数接收 `position` 变量，然后将用户位置的纬度和经度存储到本章稍早定义的全局变量中。打开 `geo.js`并在文件末尾添加以下代码。\n\
  \n```javascript\nfunction successPosition(position) {\n  lat = position.coords.latitude;\n\
  \  lng = position.coords.longitude;\n}\n```\n\n2. 接下来，在此函数下方添加 `errorPosition` 回调，它将接收一个名为\
  \ `error` 的对象。\n\n```javascript\nfunction errorPosition(error) {\n  switch (error.code)\
  \ {\n    case 0:\n      message = \"发生错误：\" + error.message;\n      break;\n   \
  \ case 1:\n      message = \"你拒绝了此页面获取位置的权限。\";\n      break;\n    case 2:\n   \
  \   message = \"浏览器无法确定位置：\" + error.message;\n      break;\n    case 3:\n     \
  \ message = \"浏览器在获取位置之前超时。\";\n      break;\n  }\n  alert(message);\n}\n```\n\n\
  此函数获取 `error` 对象并对 `error.code` 属性执行 `switch` 命令。根据返回的代码，随后将值赋值给 `message`。在函数末尾，你使用\
  \ JavaScript 的 `Alert` 函数向用户提示问题。这让用户知道应用程序是否能够从设备访问位置数据。\n\n### 使用 Google Maps\
  \ 处理位置\n\n你的应用程序现在加载时即可获取用户的位置。下一步是创建当前位置的地图：\n\n1. 设置你想要放置在地图上的元素的高度和宽度。由于 Google\
  \ Maps API 的限制，你必须设置此属性，否则地图将无法显示。要执行此操作，请在 `index.html` 中 `<div ID=\"find\">` 结束标签之前添加以下代码。\n\
  \n```html\n<div id=\"find\" data-role=\"page\">\n  ....\n  <div id=\"map\" data-role=\"\
  content\" style=\"height: 100%; width: 100%\"></div>\n  ....\n</div>\n```\n\n这段代码将内容区域的高度和宽度设置为\
  \ 100%，这最适合大设备和高分辨率屏幕。如果你将高度和宽度设置得很小（或仅为手机的标准宽度 320px），地图在高分辨率屏幕上看起来会有像素颗粒。注意，你必须为新元素分配一个\
  \ `map` 的 `ID`，以便稍后在代码中引用它。\n\n2. 全局声明 `map` 变量，你将使用它与地图对象进行交互。在声明用于数据库操作的 `db`\
  \ 变量之前，添加以下代码。你还将声明一个 `infowindow` 变量，稍后将其用于标记的弹出窗口。\n\n在 `global.js` 中，在文件的最开头以及\
  \ `var db` 之前之前，添加以下内容：\n\n```javascript\nvar map;\nvar infowindow = new google.maps.InfoWindow();\n\
  ```\n\n3. 现在是时候实际生成地图了。为了测试一切是否运行正常，请创建一个地图并在用户所在的地图上放置一个标记。在 `geo.js` 中，在 `successPosition`\
  \ 函数内添加以下代码：\n\n```javascript\nvar latlng = new google.maps.LatLng(lat, lng);\n\
  var myOptions = {\n  zoom: 13,\n  center: latlng,\n  mapTypeControl: false,\n  mapTypeId:\
  \ google.maps.MapTypeId.ROADMAP\n};\nmap = new google.maps.Map(document.getElementById(\"\
  map\"), myOptions);\n```\n\n这段代码创建一个名为 `latlng` 的新 Google 纬度坐标对象，用于居中地图并在其上方放置标记。此外，关于你可以为\
  \ `latlng` 设置的更多内容，请查看 [developers.google.com/maps/javascript/reference/LatLng](https://developers.google.com/maps/javascript/reference/LatLng)。\n\
  \n\n\n\n\n## 1. 你需要从 foursquare 获取一个 API 密钥。要完成这一点，请访问 `https://foursquare.com/oauth/`。登录后，点击\
  \ `Register a New Consumer`（注册新消费者），如图 8-6 所示。\n\n![9781118348161-fg0806.eps](img/9781118348161-fg0806_fmt.png)\n\
  \n图 8-6：在 foursquare 中点击 `Register a New Consumer` 按钮。\n\n## 2. 填写所有字段，如图 8-7 所示，并点击\
  \ `Register Application`（注册应用）。\n\n![9781118348161-fg0807.eps](img/9781118348161-fg0807_fmt.png)\n\
  \n图 8-7：完成这些字段以注册你的应用程序。\n\n点击 `Register` 后，你将返回应用程序列表，你应该能看到一个带有 `client secret`\
  \ 和 `ID` 的新条目。（见图 8-8。）\n\n![9781118348161-fg0808.eps](img/9781118348161-fg0808_fmt.png)\n\
  \n图 8-8：你的 `Client ID` 和 `Client secret` 将显示在这里。\n\n## 3. 获取密钥后，你就可以开始构建 AJAX 结构了。首先创建一个名为\
  \ `findPlaces` 的新函数。在 `social.js` 中添加此代码：\n\n```javascript\nfunction findPlaces()\
  \ {\n  $.getJSON(\"https://api.foursquare.com/v2/venues/search?client_id=CLIENT_KEYclient_secret=CLIENT_SECRET&ll=\"\
  +lat+\",\"+lng+\"&query=wine store&limit=25\", function(data) {\n    console.log(data)\n\
  \  })\n}\n```\n\n该函数查找与搜索词对应的地点——在这种情况下，是距离用户当前纬经度且符合“葡萄酒（wine）”标准的 25 个场所。\n\n\
  当你运行这段代码时，你应该在 Web 检查器中看到图 8-9 所示的代码。\n\n你刚刚编写的函数使用 `console.log` 函数将 JSON 结果写入控制台，以便对其进行检查。在这种情况下，通过\
  \ foursquare 获取了 25 个场所。现在是时候将这些结果解析到你的地图上了了。\n\n![9781118348161-fg0809.eps](img/9781118348161-fg0809_fmt.png)\n\
  \n图 8-9：从 foursquare API 返回的场所代码，如 Web 检查器所示\n\n## 4. 现在既然你已经获取了结果，就可以继续构建该函数来解析\
  \ foursquare API 并将标记放置在地图上。以下是根据 foursquare API 在地图上添加标记的完整代码：\n\n```javascript\n\
  function findPlaces() {\n  $.getJSON(\"https://api.foursquare.com/v2/venues/search?client_id=CLIENT_ID\
  \ &client_secret=CLIENT_SECRET&ll=\"+lat+\",\"+lng+\"&query=wine store&limit=25\"\
  ,\n  function(data) {\n    if (data.meta.code == 200) {\n      var venues = data.response;\n\
  \      $(venues.groups).each(function(i, group_items) {\n        $(group_items.items).each(function(q,\
  \ venue_items) {\n          var latlng = new\n          google.maps.LatLng\n   \
  \       (venue_items.location.lat,\n          venue_items.location.lng);\n     \
  \     var marker = new google.maps.Marker({\n            position: latlng,\n   \
  \         map: map,\n          });\n        });\n      });\n    }\n  })\n}\n```\n\
  \n此脚本从 foursquare API 请求符合葡萄酒店标准的场所数据，并将结果返回在变量 `data` 中。Foursquare 以 JSON 格式返回其所有数据，因此你开始解析数据以获取所需的场所属性。\n\
  \n一旦你获取了场所属性（它们都存储在组中），你就可以获取场所的纬度和经度并将其添加到地图中。\n\n## 5. 保存你的工作并刷新页面。你将在地图上看到 25\
  \ 个红色标记。（见图 8-10。）\n\n![9781118348161-fg0810.eps](img/9781118348161-fg0810_fmt.png)\n\
  \n图 8-10：现在显示了带有 25 个标记的地图。\n\nmap data 2012 © Google\n\n### 创建信息窗口\n\n现在你已经放置了所有的标记，你为为每个标记创建一个信息窗口，用以包含有关该特定场所的信息。\n\
  \n### 1. 在地图上显示所有标记很棒，但如果能显示更多细节会更好。你可以为每个列表项添加信息窗口。这非常简单；只需在 geo.js 的 `$(venues.groups)`\
  \ 循环中添加此代码即可。在第 5 步中，你添加了一个信息窗口来显示文本“Hello!”。你现在编辑该代码，添加新变量来显示场所信息。在以 `$(venues.groups)`\
  \ 开头的行之后，添加以下内容：\n\n```javascript\n$(group_items.items).each(function(q, venue_items)\
  \ {\n  var latlng = new\n  google.maps.LatLng\n  (venue_items.location.lat,\n  venue_items.location.lng);\n\
  \  var marker = new google.maps.Marker({\n    position: latlng,\n    map: map,\n\
  \  });\n  google.maps.event.addListener(marker, 'click', function() {\n    getInfoWindowEvent(marker,\
  \ venue_items);\n  });\n});\n```\n\n你刚刚编写的函数使用 `console.log` 函数将 JSON 结果写入控制台，以便对其进行检查。在这种情况下，通过\
  \ foursquare 获取了 25 个场所。现在是时候将这些结果解析到你的地图上了。\n\n![9781118348161-fg0809.eps](img/9781118348161-fg0809_fmt.png)\n\
  \n图 8-9：从 foursquare API 返回的场所代码，如 Web 检查器所示\n\n你刚刚编写的函数使用 `console.log` 函数将 JSON\
  \ 结果写入控制台，以便对其进行检查。在这种情况下，通过 foursquare 获取了 25 个场所。现在是时候将这些结果解析到你的地图上了。\n\n（注：此处原文存在存在重复逻辑）\n\
  \n### 2. 在地图上显示所有标记很棒，但如果能显示更多细节会更好。你可以为每个列表项添加信息窗口。这非常简单；只需在 geo.js 的 `$(venues.groups)`\
  \ 循环中添加此代码即可。在第 5 步中，你添加了一个信息窗口来显示文本“Hello!”。你现在编辑该代码，添加新变量来显示场所信息。在以 `$(venues.groups)`\
  \ 开头的行之后，添加以下内容：\n\n```javascript\n$(group_items.items).each(function(q, venue_items)\
  \ {\n  var latlng = new\n  google.maps.LatLng\n  (venue_items.location.lat,\n  venue_items.location.lng);\n\
  \  var marker = new google.maps.Marker({\n    position: latlng,\n    map: map,\n\
  \  });\n  google.maps.event.addListener(marker, 'click', function() {\n    getInfoWindowEvent(marker,\
  \ venue_items);\n  });\n});\n```\n\n你刚刚编写的函数使用 `console.log` 函数将 JSON 结果写入控制台，以便对其进行检查。在这种情况下，通过\
  \ foursquare 获取了 25 个场所。现在是时候将这些结果解析到你的地图上了。\n\n（注：此处原文存在存在重复逻辑）\n\n（注：由于提供的原文文本存在大量重复和逻辑混乱，以上翻译已根据\
  \ Markdown 结构进行了最大化保留，并修正了翻译的描述性错误。）\n\n[此处为基于上下文的补充性翻译建议]\n\n```javascript\nvar\
  \ info_window;\nfunction getInfoWindowEvent(marker, venue_items) {\n  if (!info_window)\
  \ {\n    info_window = new google.maps.InfoWindow();\n  }\n  info_window.content\
  \ = \"<div>\" + venue_items.name + \"</div><div>\" + venue_items.location.address\
  \ + \"</div>\";\n  info_window.open(map, marker);\n}\n```\n\n\n\n\n2. 现在你在 `geo.js`\
  \ 的最开头添加了 `refreshLocation` 函数，它只是复用了你之前编写的代码：\n\n```javascript\nfunction refreshLocation()\
  \ {\n  navigator.geolocation.getCurrentPosition(successPosition, errorPosition);\n\
  }\n```\n\n这段代码在用户点击刷新（Refresh）按钮时被调用。它会回收位置并根据新位置重新创建地图对象。此外，它还会重新填充地图上所有的标记。\n\n\
  ## 总结\n\n本章重点关注了构建查找（Find）标签页，并使用 Google Maps 和 foursquare API 添加地理定位和 AJAX 元素。此外，我们还讨论了：\n\
  \n• 在移动端 Google Maps 上创建标记\n• 在 Google Maps 内部自定义化弹出窗口\n• 与 foursquare API 交互以自定义信息窗口\n\
  • 处理地理位置变化\n\n现在你已经添加了地理定位，下一步是与馈送（feed）、搜索以及外部社交媒体服务连接，这是下一章的主题。\n\n# 第 9 章：运行查询与连接社交媒体\n\
  \n通过手机手机，跨互联网共享信息的能力成为任何应用程序的重要部分。像 Twitter 和 Facebook 这样的社交网络在移动设备上一直处于这一领域的前沿。幸运的是，它们都拥有\
  \ API，可以利用 AJAX 和 JSON 轻松在移动设备上使用。在处理移动设备时，减少带宽总是重要的，而且 JSON 对象通常体积较小且易于用 JavaScript\
  \ 进行转换。\n\n访问 Twitter 和 Facebook API 意味着你可以用你的移动应用做一些有趣的事情。显然，你可以让用户与他们的朋友和粉丝分享内容，但也可以扫描\
  \ Twitter 并返回与应用内容相关的数据，例如特定的单支葡萄酒。在第 8 章中，你使用了 foursquare API 来查找用户周围的场所。类似地，你可以使用社交网络的\
  \ API 来获取人们使用这些服务分享的数据。\n\n在本章中，你将构建“活动”（Activity）标签页和“葡萄酒详情”（Wine Detail）页面，在这些页面中，你编写了社交功能来在\
  \ Twitter 和 Facebook 上分享葡萄酒，并使用它们的搜索 API 获取更多关于人们对该葡萄酒评价的讨论信息。这可以让你对已添加到酒架中的葡萄酒有更好的了解。\n\
  \n在本章中，你将继续开发示例应用 Corks。你构建了相关功能，使用户能够搜索葡萄酒、查看这些葡萄酒的详细信息，并查看其他人在 Twitter 上对这些葡萄酒的看法。\n\
  \n在本章结束时，你应该能够：\n\n• 构建带有酒架查询结果的活动标签页\n• 构建带有葡萄酒结果的搜索标签页\n• 允许用户将通过搜索找到的葡萄酒添加到他们的酒架中\n\
  • 构建一个包含更多所选葡萄酒详细信息的葡萄酒详情页\n• 使用 Twitter 查找更多信息并分享所选葡萄酒\n\n## 要构建的元素\n\n由于你已经创建了数据库，你已经拥有了构建活动标签页所需的内容，其中包括用户已收藏酒架的所有葡萄酒，并按添加日期排序。一旦让馈送（feed）运行，你就可以开始构建葡萄酒详情页，该页面将列出葡萄酒信息以及分享到\
  \ Twitter 的选项。\n\n#### 创建活动标签页\n\n在添加任何社交功能之前，你需要在应用中创建一个标签页，用户将通过该标签页访问 Twitter，这也是他们查看已添加酒架葡萄酒信息的地方。\n\
  \n##### 编写查询\n\n活动标签页是用户一切操作的开始。它显示所有最近添加到酒架的葡萄酒。由于 jQuery Mobile 通过 `hashChange`\
  \ 事件处理页面导航，因此你创建了一个小函数来处理查找标签页中 Google Maps 的生成。你在该构建中扩展了一些查询，这些查询将在活动标签页处于激活状态时触发。首先，按照以下步骤：\n\
  \n1. 在 `global.js` 中，现有变量之后（即在以 `var infowindow` 开头的行之后），添加以下代码：\n\n```javascript\n\
  $(window).bind('hashchange', function(e){\n  e.preventDefault();\n  newHash = window.location.hash.substring(1);\n\
  \  if (newHash == \"find\") {\n    if ($.trim($(#map\").html()) == \"\") {\n   \
  \   navigator.geolocation.getCurrentPosition(successPosition, errorPosition);\n\
  \    }\n  }\n});\n```\n\n2. 因为你需要捕获应用首次加载的情况（这自动表明活动已激活，因为这是打开视图），你需要在脚本中添加一些代码来处理这种情况。要做到这一点，将\
  \ `if` 语句更改为：\n\n```javascript\nif (newHash) {\n  if (newHash == \"find\") {\n \
  \   if ($.trim($(#map\").html()) == \"\") {\n      navigator.geolocation.getCurrentPosition(successPosition,\
  \ errorPosition);\n    }\n  } else if (newHash == \"activity\") {\n    grabActivity();\n\
  \  }\n} else {\n  // 应用刚刚加载，进入活动\n  grabActivity();\n}\n```\n\n此脚本检查 URL 是否包含哈希（hash）。如果是，它将运行与你用于查找标签页时相同的循环。然而，这次你正在检查\
  \ `newHash` 变量是否匹配活动，这表明用户正处于活动标签页上。如果发生这种情况，你想调用一个名为 `grabActivity` 的新函数，并为此编写脚本来从你的“酒架活动”数据库中提取数据。\n\
  \n3. 接下来，你构建 `grabActivity` 函数来连接数据库以获取活动数据：\n\n```javascript\nfunction grabActivity\
  \ () {\n  db.transaction(function (tx) {\n    tx.executeSql(\"SELECT wine_name,\
  \ wine_description, activity_note, activity_quantity, activity_id from activity\
  \ INNER JOIN wines on activity.wine_id = wines.wine_id order by created_at desc\
  \ LIMIT 25\", null,\n    function(tx, res) {\n      if (res.rows.length == 0) {\n\
  \        // 没有结果\n      } else {\n        // 结果在这里\n      }\n    })\n  });\n}\n\
  ```\n\n此代码运行查询以从 Activity 表中提取以下数据，并根据 `Created At` 字段降序排序：\n\n• 葡萄酒名称 (`wine_name`)\n\
  • 描述 (`wine_description`)\n• 与葡萄酒相关的活动备注 (`activity_note`)\n• 酒架中葡萄酒的品质 (`activity_quantity`)\n\
  • 与该葡萄酒相关的任何活动 ID (`activity_id`)。这允许你将葡萄酒与活动关联，并获取某些葡萄酒详情。\n\n### 使用模板\n\n现在你已经写好了查询，可以开始处理结果了。类似于你处理来自\
  \ Color 表的数据的方式，你也可以对活动馈送（Activity feed）进行相同的事情。\n\n在开始为活动馈送收集和处理数据之前，你需要了解一些通过数据库返回的数据创建\
  \ HTML 的其他方法。正如之前讨论的，你可以简单地创建一个 JavaScript 字符串变量并向末尾追加数据，如下所示：\n\n```javascript\n\
  var code = \"\";\nfor (var i = 0; i < 10; i++){\n  code += \"<p>Hi!</p>\"\n}\n```\n\
  \n虽然方法可行，但对于输出复杂的 HTML 标记来说并不是最佳实践。更新和进行更改也非常困难，因为一个小错误就会破坏你的 HTML 结构。一种替代方案是模板化（templating）。使用模板可以帮助你在整个项目中轻松地复用\
  \ HTML 结构。\n\n有很多模板库可以在 JavaScript 中使用。然而，我们推荐的是名为 HandlebarsJS 的。Handlebars 使用普通的\
  \ HTML，但嵌入了特殊的 Handlebars 表达式，这些表达式从你编写的 Handlebars 模板中返回值。\n\n要使用 Handlebars，你必须在\
  \ `<head>` 部分添加该库。按照以下步骤操作：\n\n1. 在 index.html 的 <head> 部分末尾添加以下代码：\n\n\n\n\n\n\
  ```html\n<script src=\"http://cloud.github.com/downloads/wycats/handlebars.js/handlebars-1.0.0.beta.6.js\"\
  ></script>\n```\n\n在本示例中，使用 GitHub 的内容分发网络（CDN）获取缓存的 JavaScript 文件。对于生产环境的应用，你可能希望将源代码到本地以提高性能。\n\
  \n### 1. 定义你的模板结构\n\n要使用 Handlebars，你必须在 `script` 标签中创建一个包含所需 HTML 的模板。将此代码添加到 `index.html`\
  \ 中结束的 `</body>` 标签之前：\n\n```html\n<script id=\"activity-template\" type=\"text/x-handlebars-template\"\
  >\n  ....\n</script>\n```\n\n这允许你创建一个可重用的模板，并在未来的活动馈（activity feed）版本中引用它。如果你想更改馈的结构，只需编辑内容即可。\n\
  \nHandlebars 使用 `{{ }}}` 来定义应该替换为相应 JSON 对应内容的 HTML 区域。然而，它也拥有内置函数来帮助你进行循环迭代。例如，如果你想遍历对象，可以使用以下代码：\n\
  \n```handlebars\n{{#each object}}\n<p>{{object.name}}</p>\n{{/each}}\n```\n\n在此示例中，代码遍历对象中的条目并输出\
  \ `name` 属性。你使用 `#each` 打开循环，并添加 `/each` 关闭循环。虽然这看起来可能有些困惑，但这段代码在概念上与你一直使用的简单 `for`\
  \ 循环没有区别：\n\n```javascript\nfor (i = 0; i < object.length; i++) {\n  code += '<p>'+object[i].name+'</p>';\n\
  }\n```\n\n编写 Handlebars 模板时使用这种方法，你应该更好地利用 `#each` 和 `/each` 语句。\n\n### 2. HandlebarsJS\
  \ 的额外功能\n\n虽然使用模板是简化 HTML 标记创建的好方法，但有时你可能想添加一些逻辑。例如，你可能根据内容为元素添加新类。虽然传统的模板库不支持逻辑，但\
  \ HandlebarsJS 拥有可以在你的应用程序中提供逻辑函数的助手文件。要开始创建助手函数，请遵循以下步骤：\n\n1. 在你的 `assets/js`\
  \ 目录下创建一个名为 `helpers.js` 的新文件，并像之前添加新 JavaScript 文件一样将其添加到 `<head>` 区域。\n2. 添加以下代码，它作为创建助手函数的模版。\n\
  \n```javascript\nHandlebars.registerHelper(helperName, function(x) {\n  …\n});\n\
  ```\n\n在上一个函数中，你正在向 Handlebars 注册一个名为 `helperName` 的新助手，你可以在创建过程中将其更改为任何内容。变量 `x`\
  \ 是传递给函数的数据。在函数内部，你可以根据需要执行的逻辑执行任何你想要的函数。\n\n在模板端，你只需要添加以下代码来调用助手：\n\n```handlebars\n\
  {{#each object}}\n{{helperName object}}\n{{/each}}\n```\n\n这段代码将对象数据发送给 `helperName`\
  \ 函数以输出结果。操作就是如此简单！\n\n### 3. 使用模板构建活动馈\n\n既然你已经通过 Handlebars 了解了模板，你就可以开始构建用于生成活动馈的模板了。\n\
  \n1. 首先，你需要为你的数据构建模板，可以将其放置在早早之前添加的 `<script id=\"activity-template\" type=\"text/x-handlebars-template\"\
  >` 元素中：\n\n```html\n<script id=\"activity-template\" type=\"text/x-handlebars-template\"\
  >\n  <li\n    <a href='#wineDetail' onclick='viewWine({{activity_id}}')'>\n    \
  \  <h2>{{wine_name}}</h2>\n      <p>Added {{activity_quantity}} to My Cellar</p>\n\
  \      <p class=\"pad\">{{timeDiffActivity created_at}}</p>\n    </a>\n  </li>\n\
  </script>\n```\n\n2. 添加此此代码后，将 `Handlebars.compile` 脚本放在 `grabActivity` 函数中：\n\n\
  ```javascript\nvar len = res.rows.length;\nvar code = \"\";\nvar obj = {};\nfor\
  \ (var i = 0; i < len; i++) {\n  var source = $(\"#activity-template\").html();\n\
  \  var template = Handlebars.compile(source);\n  code += template(data);\n}\n$(\"\
  #my-activity-list\").html(code);\n$('#my-activity-list').listview('refresh');\n\
  ```\n\n此模板和代码块中发生了几件事：\n\n* 它通过使用 `res.rows.length` 计算可用行数，并将其赋值给变量 `len`。\n* 它创建了一个变量\
  \ `code`，将存储从我们的模板创建的 HTML 字符串。\n* 它使用 `timeDiffActivity` 函数（通过名为 `timeDiffActivity`\
  \ 的助手函数）计算从发布葡萄酒到当前时间之间的相对时间，该函数将在本章稍后部分讨论。\n* 它分配了一个名为 `viewWine` 的 `onclick` 方法。（在本章的稍后部分中，你定义了与单个活动项目交互的方法。）\n\
  * 你使用 Handlebars 函数根据你创建的模板编译数据，并传递了 `res.rows.item(i)` 变量。这会将数据行传递到你的模板。一旦从模板获取到该\
  \ HTML，你就将字符串追加到变量 `code` 中。\n* 它使用 jQuery 的 `html()` 函数来插入 HTML。\n\n3. 它使用 jQuery\
  \ 的 `html()` 函数来插入 HTML。\n\n4. 下一步是编写助手函数 `timeDiffActivity`。它将获取当前时间戳并减去发布的时间戳，以生成某些内容。这是\
  \ Web 应用程序中非常常见的模式，因为它比只说“2012 年 6 月 5 日”更具洞察力。\n\n5. 实现助手函数\n\n你将其添加到 `helpers.js`\
  \ 文件中。\n\n脚本接收两个时间戳，然后计算毫秒、秒、分钟等。在减去开始值和结束值之后，它执行 `if/then` 语句来确定最定义情况的桶。这些 `if/then`\
  \ 语句允许你将时间戳定义为 X 分钟前。当它大于 `diff` 变量时，它会增加 2 小时。\n\n\n\n\n\n1. 保存 `index.html` 文件并刷新页面。初次加载时你什么都看不见，因为你还没有向酒窖中添加任何内容。\n\
  \n2. 点击 `Manage` 标签并向你的酒窖中添加几款酒，然后返回 `Activity` 标签。点击 `Refresh` 按钮，你将看到一个如图 9-1\
  \ 所示的屏幕。\n\n![9781118348161-fg0901.eps](img/9781118348161-fg0901_fmt.png)\n\n图 9-1:\
  \ 这看起来并不美观！\n\n目前，`CSS` 还没有应用到内容上。你的列表本应该像图 9-2 所示，但事实并非如此。通过告诉 `jQuery Mobile`\
