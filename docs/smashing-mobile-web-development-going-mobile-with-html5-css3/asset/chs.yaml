  \ 的新 `<div>`，将用它来显示从社交媒体获取的数据。\n\n### 构建葡萄酒详情页的逻辑\n\n现在你已经有了标记，可以构建处理结果的逻辑了。\n\n\
  虽然可以使用 `HandlebarsJS` 来生成模板，但本示例创建了一个 HTML 标记字符串，以便你有机会尝试这两种方法。\n\n1. 记得你设置了名为 `viewWine`\
  \ 的 `onclick` 方法，它接收变量 `activity_id` 吗？现在是时候构建该函数了。在 `database.js` 中添加以下内容：\n\n\
