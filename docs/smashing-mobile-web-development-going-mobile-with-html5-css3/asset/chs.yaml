  \n图 9-2: 你的列表应该是这样的。\n\n3. 那么你如何修复你的列表呢？`jQuery Mobile` 有一个特殊方法用于定义在初始 `DOM` 加载后添加到列表视图（List\
  \ Views）的动态内容。要更改这一点，你需要让 `jQuery Mobile` 你想将此元素作为列表视图。要启用列表视图，在 `grabActivity`\
  \ 函数中添加以下代码：\n\n```javascript\n$('#my-activity-list').listview();\nvar len = res.rows.length;\n\
  ...\n```\n\n这告诉 `jQuery Mobile` 为元素添加特殊的类名，以确保它们受到 `CSS` 的影响。然而，由于 `jQuery Mobile`\
  \ 在 `DOM` 加载后才向元素添加大部分类名，你需要一种方法在内容显示后刷新列表视图。在 `for` 循环的末尾添加以下代码即可：\n\n```javascript\n\
  ....\n$(\"#my-activity-list\").html(code);\n}\n$('#my-activity-list').listview('refresh');\n\
  ```\n\n现在在保存并刷新页面后，你应该能看到类似图 9-3 的界面。\n\n![9781118348161-fg0903.eps](img/9781118348161-fg0903_fmt.png)\n\
