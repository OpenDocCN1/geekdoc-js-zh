  3. 第三个值是可选的，定义阴影的模糊距离。你不能为该值添加负数，但你插入值越大，阴影的边缘就越模糊。它没有默认值，所以如果没有设置此值，你的盒阴影将不会设置模糊。\n\
  4. 第四个值，同样是可选的，定义阴影的扩散距离。此值可以可以是负数或正数，较大的值会导致阴影向所有方向扩展，而负值则会影响对比度。\n\n\n\n\n在深入学习渐变语法之前，请先考虑渐变在移动端应用中的外观。如图\
  \ 2-3 示例所示，渐变被定义为颜色的混合，这种混合在元素上营造出一种“光泽”效果。在 CSS3 之前，这必须通过背景图像来实现，这需要一些时间来加载。由于不需要加载图像，CSS3\
  \ 渐变非常适合为你的 Web 应用程序增添色彩，使其看起来更加现代。\n\n渐变的语法有些令人困惑。本示例仅查看了移动端应用中最常用的线性渐变版本。Firefox、Safari\
  \ 和 Chrome 的语法略有不同。\n\n- Firefox: `-moz-linear-gradient(<point> || <angle>, color-stops)`\n\
  - Safari/Chrome: `-webkit-linear-gradient(<point>, color-stops)`\n\n例如，使用以下代码段，你可以为\
  \ Firefox 和 Safari/Chrome 浏览器设置不同的背景渐变：\n\n- `background: -moz-linear-gradient(top,\
  \ #00abeb, #fff);`\n- `background: -webkit-linear-gradient(top, 00abeb, fff);`\n\
  \n线性渐变允许你指定混合的颜色。在涉及渐变时，创建调色板有些复杂。以下是为你轻松生成渐变的工具：\n\n- CSS3 渐变生成器：[`http://gradients.glrzad.com/`](http://gradients.glrzad.com/)`\n\
  - ColorZills Ultimate CSS 渐变生成器：[`http://gradients.glrzad.com/`](http://gradients.glrzad.com/)`\n\
  - Microsoft CSS 渐变背景制作：[`http://ie.microsoft.com/testdrive/graphics/cssgradientbackgroundmaker/`](http://ie.microsoft.com/testdrive/graphics/cssgradientbackgroundmaker/)`\n\
  \n需要注意的是，当你定义渐变时，需要考虑到移动设备上不支持渐变的浏览器。为了这一点，你需要为背景设置一个默认颜色，例如此处显示的其中之一：\n\n- `background:\
  \ -moz-linear-gradient(top, #00abeb, #fff);`\n- `background: -webkit-linear-gradient(top,\
  \ 00abeb, #fff);`\n- `background-color: #c1c1c1`\n\n如果你按照所示结构组织代码，并且你的 Web 应用在不支持渐变的浏览器上加载，浏览器将加载浅灰色背景色，而不是完全不显示。这有助于提高旧版浏览器上按钮的可用性。\n\
  \n## CSS3 选择器\n\n通过 CSS，你可以选择元素及其属性来定义样式。在 CSS3 中，该框架引入了新的选择器，以帮助你在选择元素时提供更细粒度的控制。大多数新选择器允许你定位结构中的特定元素或类。例如，你可以定位表格中某行中的所有奇数子元素，如下所示：\n\
  \n```css\ntr:nth-child(odd) td {\nbackground-color: #c1c1c1;\n}\n```\n\n这段代码找到每一个奇数行，并为该行中的每个项目应用背景颜色。这比\
  \ CSS 以前版本提供的语法要用得多。\n\n你还可以许多许多选择器来帮助创建更整洁的代码。你可以在 W3C 网站找到所有有效的 CSS3 选择器（[`http://www.w3.org/TR/selectors/`](http://www.w3.org/TR/selectors/`）。\n\
  \n## 变换\n\n以前，浏览器中的过渡效果（transitions）只能通过沉重的 JavaScript 方法调用。在 CSS3 中，你可以轻松地变换、着色和平移元素。重要方法之一是关键帧（key-frames）。关键帧允许你通过从一个类逐渐变为另一个类来创建动画。在移动\
  \ Web 应用程序中，你可以使用这种效果来帮助页面之间的过渡。要使用关键帧，你首先定义用法：\n\n```css\n@-webkit-keyframes mymove\
  \ /* Safari and Chrome*/\n{\nfrom {top:0px;}}\nto {top:200px;}}\n}\n@-moz-keyframes\
  \ mymove /* Mozilla*/\n{\nfrom {top:0px;}}\nto {top:200px;}}\n}\n```\n\n在这段代码中，你只是设置了这种过渡的方向，使其从页面顶部（0px）移动到页面下方\
  \ 200px 处。虽然这段代码创建了过渡的需求，但你需要初始化该需求使其在浏览器中发生。要做到这一点，你需要将过渡应用到元素。\n\n```css\n#myBox\
  \ {\n-moz-animation:mymove 5s infinite; /* Firefox */\n-webkit-animation:mymove\
  \ 5s infinite; /* Safari and Chrome */\n}\n```\n\n这段代码通过为元素分配 `mymove` 属性来启动过渡。随后的属性指定了过渡的持续时间（5\
  \ 秒）以及何时停止（在这种情况下，它将无限持续）。\n\n关于 CSS3 平移属性的一点重要事项是它们对移动浏览器的影响。在桌面设备上，浏览器可以使用更多的\
  \ CPU 和内存，而在页面上使用许多 3D 元素会导致移动浏览器的性能缓慢。请仅使用使应用程序运行所需的方法，因为过度使用属性可能会导致你的 Web 应用程序变慢甚至崩溃。\n\
  \n## JavaScript\n\nJavaScript 在 HTML5 之前就已经存在；然而，由于 CSS3 中的新属性，可以使用 JavaScript 触发的元素有了很大改进。许多\
  \ JavaScript 库或框架可以帮助你编程更快、更容易。大多数 JavaScript 库并没有针对移动端优化，这意味着它们包含了大量用于跨浏览器（如 IE6）的代码，而这些在开发移动端时是不需要的。文件越大，你的应用程序加载越慢。最好使用符合你需求但没有过多额外开销的库。\n\
  \n### jQuery\n\njQuery 是 Web 上流行的 JavaScript 框架之一。它包含了简单的方法，可以帮助你实现复杂的 CSS3 功能，例如\
  \ `CSS3-Rotate`、`CSS3-Animations` 等。该库的缺点是它是 31KB。虽然这看起来很小，但该脚本中有很多对 IE6 代码的引用，你在移动端开发中永远不会使用它们。这会导致首次加载应用程序时加载时间变慢。\n\
  \n### XUI\n\nXUI 是一个新兴的 JavaScript 框架，由 Brian Leroux（PhoneGap 开发团队成员）构建。该项目的目标是创建一个易用的框架，其语法与\
  \ jQuery 相似，但对移动设备的占用更小。与 jQuery 31KB 的文件大小相比，XUI 仅为 4.2KB 并包含了大部分相同的功能。如果你在寻找语法相似且功能集较小的框架，XUI\
  \ 将填补这一空白。\n\n### Zepto\n\nZepto 是另一个类似于 XUI 的框架，专注于提供与 jQuery 相似的语法，但它仅针对 WebKit\
  \ 浏览器。尽管脚本文件大约为 5 到 10KB（取决于你对插件的使用），它包含了 jQuery 中大部分重要的移动端方法。缺点是脚本语言仅针对 WebKit\
  \ 浏览器，因此 Windows Phone 7、Mozilla Firefox Mobile 或非 WebKit 浏览器不支持该框架。\n\n### jQTouch\n\
  \njQTouch 是 Zepto 或 jQuery 框架的一个插件，允许你在 Web 应用中创建 UI 元素和 JavaScript 函数。与 Zepto 一样，它针对\
  \ WebKit 浏览器。该框架要求使用 jQuery 或 Zepto 加上这个库，因此根据你的需求，这可能过多。优点是它内置了许多优秀的 CSS3 动画，你可以通过页面过渡、全应用模式等让你的应用程序感觉更原生。\n\
  \n## UI 框架/工具\n\n当你构建移动 Web 应用时，你有许多框架可以帮助你构建 UI，而无需聘佣设计师。这些 UI 框架利用跨浏览器技术和 CSS3\
  \ 属性帮助你的应用程序看起来和用起来像原生。对于不支持这些功能的旧浏览器，有一些工具库可以帮助你判断某些 JavaScript 或 CSS3 函数对用户可用。\n\
  \nSencha Touch\n\n\n\n\nSencha Touch 一直自诩为最好的 HTML5 移动 Web 应用程序框架。它对许多浏览器提供了内置支持；支持\
  \ `iOS`、`Android` 和 `BlackBerry` 6+，这意味着它支持非 WebKit 浏览器。大多数开发者认为 Sencha Touch 是\
  \ JavaScript 框架中的“大杂烩”。它既包含 UI 方法也包含 JavaScript 方法，但与我提到的其他框架不同，它没有采用相同的语法，对于不熟悉面向对象\
  \ JavaScript 编程的初学者来说，可能会感到困惑。\n\n## jQuery Mobile\n\n`jQuery Mobile` 发布于 2011 年底发布，是\
  \ `jQuery` 的一个插件，让开发者无需编写任何行 CSS 即可创建丰富的 Web 应用程序。该框架通过为移动端使用格式化的特定方法和函数，将 `jQuery`\
  \ 的功能带到移动端。`jQuery Mobile` 包含了更简单的检测屏幕方向的方法，并使用 `jQuery History` 插件提供了滑动事件和全功能导航。该框架的缺点是它需要\
  \ `jQuery`（31KB），并且额外增加了 24KB 的重量。虽然这是一个强大的框架，但在使用较大的框架时，请务必注意带宽和加载时间。\n\n## Modernizr\n\
  \nModernizr 为移动端或桌面端的跨浏览器开发消除了痛苦。检测浏览器是否具有某些 HTML5 或 CSS3 功能可能是困难的，但 `Modernizr`\
  \ 让这一切变得简单。该工具允许你构建基础的 `if…then` 语句，以确定某些功能是否可用。一旦初始化该 JavaScript 工具，它会扫描浏览器的所有\
  \ HTML5 和 CSS3 功能，并将它们作为类添加到 `BODY` 元素中，如图 2-4 所示。一旦应用此，检测 CSS3 和 HTML5 功能就变得编写以下代码一样简单：\n\
  \n![9871118348161-fg0204.eps](img/9871118348161-fg0204_fmt.png)\n\n图 2-4：使用 Modernizr\
  \ 检测 HTML5 兼容性\n\n```javascript\nif (Modernizr.localstorage) {\n  // 浏览器兼容本地存储！\n\
  \  return true;\n} else {\n  // 在此处处理备用函数，因为不支持本地存储\n  return false;\n}\n```\n\n\
  ## iScroll\n\n在 iOS 5 之前，Safari 中无法设置底部和顶部栏，因为 CSS 属性 `overflow: scroll` 被禁用了。从\
  \ iOS 5 开始，此 CSS 功能已启用；但它存在一些 Apple 需要解决的 Bug。为了确保 iOS 4 的用户可以使用你的应用程序，有一个名为 `iScroll`\
  \ 的方便 JavaScript 库。当启用它时，你的 Web 应用程序中将有一个静态的顶部栏和底部栏。`iScroll` 不是用 `jQuery` 编写的，因此你对任何框架都没有依赖。虽然没有什么是完美的，但\
  \ `iScroll` 为静态内容的页面提供了一个极佳的解决方案，并提供了简单的语法，让你的 Web 应用程序拥有原生感。\n\n如果你需要使用 `iScroll`，但你的内容元素高度可变（这意味着你正在动态添加内容），你可以轻松地使用\
  \ `iScroll` 的内置方法来刷新滚动区域。例如，如果你的内容如下：\n\n```html\n<div id=\"scrollarea\">\n  <div\
  \ id=\"page1\"></div>\n  <div id=\"page2\"></div>\n  <div id=\"page3\"></div>\n\
  </div>\n```\n\n一旦内容被放置在 `page1` 中，你需要刷新 `iScroll` 的高度以使整个区域变得可滚动。你可以这样操作：\n\n```javascript\n\
  function onCompletion () {\n  // 在此处修改 page1 内部的元素\n  setTimeout(function () {\n\
  \    myScroll.refresh();\n  }, 0);\n};\n```\n\n一旦完成此操作，你的内容区域将被刷新，你可以在执行操作时应用相同的逻辑。\n\
  \n--- `jQuery Mobile` 发布于 2011 年底发布，是 `jQuery` 的一个插件，让开发者无需编写任何行 CSS 即可创建丰富的 Web\
  \ 应用程序。该框架通过为移动端使用格式化的特定方法和函数，将 `jQuery` 的功能带到移动端。`jQuery Mobile` 包含了更简单的检测屏幕方向的方法，并使用\
  \ `jQuery History` 插件提供了滑动事件和全功能导航。为移动端或桌面端的跨浏览器开发消除了痛苦。检测浏览器是否具有某些 HTML5 或 CSS3\
  \ 功能可能是困难的，但 `Modernizr` 让这一切变得简单。该工具允许你构建基础的 `if…then` 语句，以确定某些功能是否可用。一旦初始化该 JavaScript\
  \ 工具，它会扫描浏览器的所有 HTML5 和 CSS3 功能，并将它们作为类添加到 `BODY` 元素中，如图 2-4 所示。一旦应用此，检测 CSS3 和\
  \ HTML5 功能就变得编写以下代码一样简单：\n\n---\n\n*(注：由于提供的原始文本包含大量重复内容和断裂的片段，为了遵循“一定不要重复输出原文”的原则，上述翻译已对逻辑部分进行了整合与去重。以下是针对您提供的最后一段“需要翻译的文本”的完整性翻译：)*\n\
  \n[content]\nSencha Touch 一直自诩为最好的 HTML5 移动 Web 应用程序框架。它对许多浏览器提供了内置支持；支持 `iOS`、`Android`\
  \ 和 `BlackBerry` 6+，这意味着它支持非 WebKit 浏览器。大多数开发者认为 Sencha Touch 是 JavaScript 框架中的“大杂烩”。它既包含\
  \ UI 方法也包含 JavaScript 方法，但与我提到的其他框架不同，它没有采用相同的语法，对于不熟悉面向对象 JavaScript 编程的初学者来说，可能会感到困惑。\n\
  \n## jQuery Mobile\n\n`jQuery Mobile` 发布于 2011 年底发布，是 `jQuery` 的一个插件，让开发者无需编写任何行\
  \ CSS 即可创建丰富的 Web 应用程序。该框架通过为移动端使用格式化的特定方法和函数，将 `jQuery` 的功能带到移动端。`jQuery Mobile`\
  \ 包含了更简单的检测屏幕方向的方法，并使用 `jQuery History` 插件提供了滑动事件和全功能导航。该框架的缺点是它需要 `jQuery`（31KB），并且额外增加了\
  \ 24KB 的重量。虽然这是一个强大的框架，但在使用较大的框架时，请务必注意带宽和加载时间。\n\n## Modernizr\n\nModernizr 为移动端或桌面端的跨浏览器开发消除了痛苦。检测浏览器是否具有某些\
  \ HTML5 或 CSS3 功能可能是困难的，但 `Modernizr` 让这一切变得简单。该工具允许你构建基础的 `if…then` 语句，以确定某些功能是否可用。一旦初始化该\
  \ JavaScript 工具，它会扫描浏览器的所有 HTML5 和 CSS3 功能，并将它们作为类添加到 `BODY` 元素中，如图 2-4 所示。一旦应用此，检测\
  \ CSS3 和 HTML5 功能就变得编写以下代码一样简单：\n\n![9871118348161-fg0204.eps](img/9871118348161-fg0204_fmt.png)\n\
  \n图 2-4：使用 Modernizr 检测 HTML5 兼容性\n\n```javascript\nif (Modernizr.localstorage)\
  \ {\n  // 浏览器兼容本地存储！\n  return true;\n} else {\n  // 在此处处理备用函数，因为不支持本地存储\n  return\
  \ false;\n}\n```\n\n## iScroll\n\n在 iOS 5 之前，Safari 中无法设置底部和顶部栏，因为 CSS 属性 `overflow:\
  \ scroll` 被禁用了。从 iOS 5 开始，此 CSS 功能已启用；但它存在一些 Apple 需要解决的 Bug。为了确保 iOS 4 的用户可以使用你的应用程序，有一个名为\
  \ `iScroll` 的方便 JavaScript 库。当启用它时，你的 Web 应用程序中将有一个静态的顶部栏和底部栏。`iScroll` 不是用 `jQuery`\
  \ 编写的，因此你对任何框架都没有依赖。虽然没有什么是完美的，但 `iScroll` 为静态内容的页面提供了一个极佳的解决方案，并提供了简单的语法，让你的 Web\
  \ 应用程序拥有原生感。\n\n如果你需要使用 `iScroll`，但你的内容元素高度可变（这意味着你正在动态添加内容），你可以轻松地使用 `iScroll`\
  \ 的内置方法来刷新滚动区域。例如，如果你的内容如下：\n\n```html\n<div id=\"scrollarea\">\n  <div id=\"page1\"\
  ></div>\n  <div id=\"page2\"></div>\n  <div id=\"page3\"></div>\n</div>\n```\n\n\
  一旦内容被放置在 `page1` 中，你需要刷新 `iScroll` 的高度以使整个区域变得可滚动。你可以这样操作：\n\n```javascript\nfunction\
  \ onCompletion () {\n  // 在此处修改 page1 内部的元素\n  setTimeout(function () {\n    myScroll.refresh();\n\
  \  }, 0);\n};\n```\n\n*(注：后续部分由于原文中存在大量重复的句子片段，已按要求避免重复输出)*\n\n\n\n在过去，建立“环境”的想法让开发人员望而生畏，因为这意味着要要求\
  \ IT 系统管理员创建一个新服务器，以便开发者可以在上面进行工作而不影响上线网站。而现在，开发者可以使用自己的机器进行实时开发和测试，而无需担心会影响生产应用程序。\n\
  \n将编码环境想象成应用程序的不同地理区域。它们包含相同的代码库，但底层数据（来自数据库）是静态的。分离这些环境目的是允许代码开发和测试在不影响你的网站上线版本的情况下进行。表\
  \ 3-1 比较了隔离环境的优缺点。\n\n### 表 3-1 隔离环境的优缺点\n\n| 优点 | 缺点 |\n| :--- | :--- |\n| 允许在安全区域进行开发，无须破坏现有功能\
  \ | 多个代码仓库需要工具来保持每个环境同步 |\n| 本地开发是一个简单且廉价的入门方案 | 本地机器很难模拟规模或“真实”体验 |\n| 丰富的免费工具可以帮助你快速上手\
  \ | |\n\n在处理两个不同的环境时，确保代码是最新的至关重要的。没有什么比多个环境与代码库的其他部分不同步更糟糕的事情了。你可以使用工具来帮助管理代码的迭代，这些工具被称为仓库。流行的仓库有\
  \ SVN（或 Subversion）和 GIT。两者都提供了不同的功能集，对于保持一切井然有序很有帮助。\n\n虽然 `GIT` 和 `SVN` 看起来在执行相同的任务，但它们之间存在本质区别。主要区别是\
  \ `GIT` 提供了分布式版本控制，而 `SVN` 则是中心化的。虽然 `GIT` 和 `SVN` 都拥有中心化仓库或服务器，但 `GIT` 设计为分布式模式运行，允许每个开发者拥有自己的代码工作副本。相反，`SVN`\
  \ 设计为基于服务器的中心化代码，而不是用户的本地机器。拥有分布式版本控制环境非常有帮助，特别是当用户没有网络连接时，他们仍然提交代码。分布式环境对于开源项目非常好，因为它允许所有人同时工作并向整个团队发送拉取请求（pull\
  \ request），而代码不会在传输过程中丢失。\n\n### 实现本地托管\n\n由于大多数现代计算机都让你具备本地托管自己的网站进行测试的能力，因此对于你的移动\
  \ Web 应用来说，这是最便宜的解决方案。适用于 Mac 和 PC 的许多免费工具都提供本地服务器的开箱即用安装。本地托管的目标是在你的本地机器上安装 Web\
  \ 服务器，以便你可以监听本地机器上的 `HTTP` 端口来提供 HTML 文件。\n\n本章讨论的大多数工具都围绕 `Linux`、`Apache`、`MySQL`\
  \ 和 `PHP` (`LAMP`) 栈展开，这是 Web 应用流行的栈之一。尽管你在书中构建的应用程序将不会使用数据库和 `PHP` 脚本语言，但这些工具安装了\
  \ `Apache` Web 服务器，你可以用它来帮助在移动设备上加载你的网站。\n\n### 设置 MAMP（适用于 MAC OS X）\n\nMac、`Apache`、`MySQL`\
  \ 和 `PHP` (`MAMP`) 是一个 Mac OS X 应用，它可以让你快速启动所需的客户端帮助你开始开发。\n\n要在你的 Mac 上设置 `MAMP`，请遵循以下步骤：\n\
  \n1. 打开浏览器并导航到 `http://mamp.info` 并下载 `MAMP`。为了演示和你的需要，请下载免费版本。从版本 2.0.5 开始，`Professional`\
  \ 和 `Free` 版本打包在一起。\n\n2. 安装应用程序后，在 Finder（访达）中导航到应用程序文件夹，找到并打开 `MAMP` 文件夹。（见图 3-1。）\n\
  \n![9781118348161-fg0301.eps](img/9781118348161-fg0301_fmt.png)\n图 3-1：在应用程序文件夹中找到\
  \ `MAMP`。\n\n3. 在文件夹中，你应该能看到 `MAMP` 图标。点击打开它。`MAMP` 的用户界面为你提供了一些控件，帮助你启动和停止构建版本中包含的服务。（见图\
  \ 3-2。）\n\n![9781118348161-fg0302.eps](img/9781118348161-fg0302_fmt.png)\n图 3-2：从\
  \ `MAMP` 用户界面，你可以对需要包含在应用程序中的服务进行操作。\n\n`MAMP` 应该应该打开一个启动页（Start page），提供更多关于你安装的详细信息。这些信息非常重要，但如果你想使用\
  \ `MAMP` 处理如 `PHP` 等服务器端语言，最重要的是地址栏中的 URL。它看起来应该像图 3-3。\n\n![9781118348161-fg0303.eps](img/9781118348161-fg0303_fmt.png)\n\
  图 3-3：地址栏中的 URL\n\n`localhost` 一词是指机器的本地 IP 地址，而冒号后面的数字是指 Web 服务器监听的端口。在这种情况下，Web\
  \ 服务器正在监听端口 `8888` 。\n\n4. 回到 Finder 中应用程序下的 `MAMP` 文件夹，并打开 `htdocs` 文件夹。这是你的 Web\
  \ 服务器的根目录，因此创建一个 `index.html` 文件，如图 3-4 所示，开始测试。用你喜欢的文本编辑器打开它，输入以下代码：\n\n```html\n\
  <html>\n<h2>Hello World!</h2>\n</html>\n```\n\n![9781118348161-fg0304.eps](img/9781118348161-fg0304_fmt.png)\n\
  图 3-4：`index.html` 文件\n\n5. 保存文件，在你喜欢的浏览器中重新打开并指向 `http://localhost:8888`。你应该看到\
  \ Hello World。\n\n### Windows 版 XAMPP\n\nWindows 用户有一个类似的工具，`XAMPP`。该工具适用于所有操作系统，但它是\
  \ Windows 的最佳解决方案。遵循以下步骤：\n\n1. 访问 `www.apachefriends.org/en/xampp.html` 并点击链接下载\
  \ `XAMPP`。在本书编写，最新版本为 `1.7.7`。\n\n![9781118348161-fg0305.eps](img/9781118348161-fg0305_fmt.png)\n\
  图 3-5：下载 `XAMPP`。\n\n2. 下载安装程序后，开始 `XAMPP` 的安装过程。如图 3-6 所示，系统询问你是否希望将某些应用程序作为服务运行。这意味着这些进程将在计算机运行时启动。对于本书，请选择安装\
  \ Apache 作为服务。安装完成后，你会在右下角看到 `XAMPP` 管理控制面板。\n\n![9781118348161-fg0306.eps](img/9781118348161-fg0306_fmt.png)\n\
  图 3-6：`XAMPP` 安装程序提供了将应用程序作为服务的选项。\n\n3. 点击 `Apache` 旁的 `Admin` 按钮以开始。（见图 3-7。）\n\
  \n![9781118348161-fg0307.eps](img/9781118348161-fg0307_fmt.png)\n图 3-7：启动 `Apache`\
  \ 的帮助文件\n\n这将启动帮助文件并为你提供 URL。默认情况下，`XAMPP` 安装并监听端口 `8080`。\n\n4. 要开始向你的 Web 服务器添加自己的文件，请打开“我的电脑”，导航到安装目录（默认认为\
  \ `c:\\xampp`），并打开 `htdocs` 文件夹。然后打开 `xampp`，在该文件夹中创建一个名为 `mysite` 的新文件夹。（见图 3-8。）\n\
  \n\n\n\n\n![9781118348161-fg0308.eps](img/9781118348161-fg0308_fmt.png)\n\n图 3-8：将你自己的文件添加到\
  \ Web 服务器。\n\n5. 创建文件夹后，创建一个名为 `index.html` 的新文件，并在你喜爱的文本编辑器中添加以下代码：\n\n```html\n\
  <html>\n<h2>Hello World</h2>\n</html>\n```\n\n6. 回到你的浏览器并导航到 `http://localhost/xampp/mysite/`。你应该能看到你输入的\
  \ HTML 代码。（参见图 3-9。）\n\n![9781118348161-fg0309.eps](img/9781118348161-fg0309_fmt.png)\n\
  \n图 3-9：浏览器中的 Hello world\n\n# 使用 IDE 编写你的 Web 应用程序\n\n使用 HTML/CSS/JS，你不需要使用华丽的代码编辑器来编写移动端\
  \ Web 应用。你只需要使用电脑上的本地文本编辑器开始编写代码即可。WordPad、Notepad（记事本）和 Mac 的 TextEdit 都能完美编写代码。然而，使用\
  \ IDE 或代码编辑器可以帮助你轻松完成开发过程。看看适用于每个操作系统的工具。\n\n## TextMate (Mac OS X)\n\nTextMate\
  \ 是 Mac OS X 上最好的文本编辑器之一。它包含了许多功能：例如代码补全、语法高亮和包（bundles）。例如，包（Bundles）是第三方代码片段，你在开发应用程序时可以使用它们。它们可以帮助你快速编写在应用程序中复用的代码，例如\
  \ `IF/THEN` 块和标准模板。TextMate 拥有 HTML/CSS/JS 的包，因此在开发 Web 应用时永远不会毫无方向。\n\nTextMate\
  \ 的一个重要功能是基础 HTML 语法的自动补全选项。在 TextMate 中，窗口底部的设置允许你根据文档类型设置语法格式。它能根据你输入的内容自动检测语言，这甚至更好。选中\
  \ HTML 后，你可以输入 style，TextMate 就会自动生成相关的 HTML 语法，如图 3-10 所示。\n\n![9781118348161-fg0310.eps](img/9781118348161-fg0310_fmt.png)\n\
  \n图 3-10：TextMate 生成你的 HTML 语法。\n\n## Coda (Mac OS X)\n\n对于 Mac 用户来说，Coda 通常被认为所有文本编辑器中的之父。它拥有从代码编码文档到内置\
  \ FTP 客户端的一切功能。图 3-11 所示的 Coda 具有之前提到的所有功能。\n\n![9781118348161-fg0311.eps](img/9781118348161-fg0311_fmt.png)\n\
  \n图 3-11：Coda 最大的吸引力是内置 FTP 客户端：无需使用另一个应用程序即可上传内容。\n\nCoda 还有“书籍”（books），其中包含了你正在使用的语言的相应文档。在编写某些\
  \ JavaScript 或 HTML5 元素时这非常有帮助，因为不需要参考 Google 等搜索引擎。此外，Coda 还具有内置代码版本控制系统，允许你将代码发布到\
  \ `GIT` 或 `SVN`，这很有帮助，因为不需要使用多个应用程序。\n\n## Sublime Text (Windows/Mac OS X/Linux)\n\
  \nSublime Text 是另一个出色的文本编辑应用程序，它在开发代码时为你提供控制。Sublime Text 适用于 Windows、Mac OS X 和\
  \ Linux 操作系统。在本书编写期间，版本 2 正处于测试阶段；它具有一些让你在编码时保持专注的奇功能。Sublime Text 的一个很棒的功能是它拥有缩略图（mini-map），这让你能从全局查看代码。（参见图\
  \ 3-12。）\n\n![9781118348161-fg0312.eps](img/9781118348161-fg0312_fmt.png)\n\n图 3-12：Sublime\
  \ Text 提供了缩略图功能。\n\n通过缩地图，你可以快速扫描代码并进行更改。这避免了你在文件内执行复杂的“查找”和“搜索”功能。它还能让你直观地看到代码的样子，就像它打印在页面上一样。大多数程序员都根据行号工作，但有时知道文件很长可以帮助你发现并修复错误。\n\
  \nSublime Text 的另一个很棒的功能是它会在你工作时自动保存文件，所以永远不必担心丢失代码。最后，它具有内联拼写检查器，防止你发布带有拼写错误单词的\
  \ Web 应用程序。\n\n## Notepad++ (Windows)\n\n每个 Windows 用户都知晓 `NotePad`（记事本），这是一个简单的\
  \ Windows 文本编辑器。我们都用过 `NotePad` 来记录笔记甚至进行一些编码。图 3-12 所示的 `NotePad++` 是 `NotePad`\
  \ 的增强版本——经过升级使其成为一个强大的代码编辑器。\n\n与其他文本编辑器一样，`NotePad++` 具有语法高亮、代码片段和其他有用功能。然而，`NotePad++`\
  \ 保持了其前身的特点，保持布局简单整洁。对于喜欢在简单用户界面中拥有所有功能而非花哨开发者来说，`NotePad++` 是完美的客户端。\n\n# 测试你的代码\n\
  \n与构建桌面网站涉及的测试过程不同，移动端的调试可能会非常复杂。在 Web 浏览器中，你可能查看源代码，使用 `Firebug` 进行一些更改，然后快速测试。对于移动开发，拥有正确的工具可以帮助你轻松测试\
  \ Web 应用程序。看看以下将增强 HTML5 开发体验的工具和程序。\n\n在测试时，你会经常听到这两个术语——模拟器（simulator）和仿真器（emulator）。虽然它们在技术上做相同的事情，但某些差异将它们区分开。模拟器是以所有可能的方式复制体验，而仿真器试图复制实际系统以便像实际系统运行。对于\
  \ iOS，模拟器获取主机的 CPU 和内存，因此结果与设备预期的不符。相反，`Android Emulator` 必须设置为特定的内存和 CPU 以像真实设备。由于这个原因，仿真器通常比模拟器慢。\n\
  \n## iOS 模拟器\n\nApple 为 iOS 开发提供了最好的模拟器。作为 iOS 的 IDE `XCode`（见图 3-13）的一部分，用户可以在桌面上加载一个\
  \ iOS 设备的模拟器。通过 `iOS Simulator`，开发者可以以 iPad 或 iPhone 格式查看任何版本的 iOS。这对于测试应用程序相对于\
  \ Retina 和非 Retina 显示非常有帮助。\n\n缺点是它需要 Mac OS。它在 Windows 或 Linux 上无法运行。Windows 或\
  \ Linux 用户可以使用 Apple 的 `Safari` 浏览器并更改浏览器的用户代理以模拟 `Safari Mobile`。这能让你尽可能接近在移动设备上显示应用程序的效果。还有其他解决方案，包括\
  \ Flash 仿真器；但体验会下降，且不像 Safari 那样一致。如果你想在不购买 MacBook 的情况下获得更好的体验，可以使用 iPod touch\
  \ 或 iPhone 测试你的 Web 应用程序。\n\n![9781118348161-fg0313.eps](img/9781118348161-fg0313_fmt.png)\n\
  \n图 3-13：模拟器将 iOS 设备直接加载到你的桌面上。\n\n\n\n\n\niOS 模拟器的另一个重要特性是你可以在 Safari 中启用调试控制台（Debug\
  \ Console）。你可以通过进入设置→Safari→高级→调试控制台来访问它。使用该功能，你可以在页面加载时查看 CSS、HTML 和 JavaScript\
  \ 错误，如图 3-14 所示。有时你会收到可能对你的 Web 应用没有影响的警告；但此工具是检测会导致应用程序无法完全加载的 JavaScript 错误的好方法。\n\
  \n如果你想要一个基于 Web 的模拟器，可以使用 [Testiphone.com](http://Testiphone.com) 和 [iPhone4Simulator.com](http://iPhone4Simulator.com)\
  \ 等网站。然而，其体验明显低于与 Xcode 捆绑的模拟器。这些网站大多使用 Flash 或 HTML5 编写，它们可以为你提供应用程序外观的良好示例，但无法对功能和性能提供充分的表示。\n\
  \n![9781118348161-fg0314.eps](img/9781118348161-fg0314_fmt.png)\n\n图 3-14：Safari\
  \ 调试控制台让你能在页面加载时查看错误。\n\n### Android 模拟器\n\n如果你习惯了 iOS 模拟器的体验，那么 Android 模拟器的体验非常不同。如图\
  \ 3-15 所示，Android 模拟器可以安装在任何操作系统上，但需要许多调整才能正常运行。要使用 Android 模拟器，你必须下载想要工作版本的软件开发工具包（SDK）。（对于\
  \ iOS，SDK 是预封装在之前的版本中的，而 Android 模拟器不包含任何之前的 SDK。）取决于你的 Web 应用针对的 Android 版本（由于对\
  \ HTML5 的支持增强，大多数标准 Web 应用支持 2.1 及更高版本），你需要在测试之前下载所有活跃版本的操作系统。（见图 3-15。）\n\n![9781118348161-fg0315.eps](img/9781118348161-fg0315_fmt.png)\n\
  \n图 3-15：使用 Android SDK Manager。\n\n要使用模拟器，你必须在 Android SDK 控制面板中创建 Android 设备（AVD）。AVD\
  \ 是一个由开发者自定义的虚拟设备。在创建 AVD 时，你首先需要指定操作系统版本，然后是屏幕尺寸和内存。一旦创建，该 AVD 将被存储并在以后通过从控制面板选择来使用。对于\
  \ Web 应用，Android OS 2.1 及以上版本的主要区别通常与屏幕尺寸有关。浏览器功能很少变化。然而，对于地理位置等 HTML5 功能，每部手机都是不同的，因此在当前生产环境的所有版本上进行测试非常重要。\n\
  \n创建第一个 AVD 的过程有点困惑，让我们过一遍创建第一个镜像的步骤。\n\n1. 找到你从 Android 网站下载的 SDK 提取包。如果你还没有下载最新的\
  \ SDK，可以在这里下载：[`http://developer.android.com/sdk/index.html`](http://developer.android.com/sdk/index.html)。\n\
  2. 解压内容，打开 `Tools` 文件夹，然后点击 `Android`。Android SDK 和 AVD Manager 将打开。\n3. 要创建新的 AVD，请点击右上角的\
  \ `New` 按钮。为你的 AVD 分一个唯一的名称并设置目标。目标应该是你正在测试的模型，例如 Android 2.2 或 Android 4.0.4。你可以根据需要随时创建多个\
  \ AVD。你还可以添加其他设置，如 SD 卡、`Skin` 和其他硬件组件。\n4. 点击 `Create AVD`。你的新 AVD 应该出现在之前的窗口中。\n\
  5. 要启动 AVD，只需点击你想启动的 AVD 并点击 `Start`。此时，你应该能够使用此模拟器来执行任何想要尝试的操作。\n\n### Safari/Chrome/Firefox\n\
  \n由于你正在开发 Web 应用，让它在标准浏览器中正常工作是你的首要任务。Safari 和 Chrome 基于 WebKit 框架，而 Firefox 基于\
  \ Mozilla 框架。如果你的应用程序在这些浏览器上运行良好，那么当你从移动设备查看你的应用程序时，情况也会很好。\n\n这些浏览器拥有广泛的开发者工具，包括更改用户代理（user\
  \ agent）的选项，可以针对不同的浏览器测试你的代码。接下来将讨论，这些浏览器还提供了使用其开发者工具实时更改 CSS 的能力。这可以帮助你调试 CSS 问题，或者测试元素的渐变或属性与其他元素并排时的效果。\n\
  \n### Firebug\n\nWeb 开发中强大的工具之一是 Firebug —— 这是 Firefox 和 Google Chrome 的插件。从表面上看，它允许快速检查并更改页面上的\
  \ HTML 和 CSS 元素——但它也让你跟踪 AJAX 和 XHR 进程以调试你的远程 URL 调用。（见图 3-16。）\n\n![9781118348161-fg0316.eps](img/9781118348161-fg0316_fmt.png)\n\
  \n图 3-16：使用 Firebug 检查 HTML 元素。\n\n在 JavaScript 中，如果你漏掉了一个分号，整个应用程序将无法加载。Firebug\
  \ 会指出出错的行，这可以帮助你快速解决问题。其他开发者工具可能有此功能，但 Firebug 在显示致命 JavaScript 错误方面最准确。在移动设备上，你可以开启调试模式查看错误；但并不像从浏览器查看那样容易。（见图\
  \ 3-17。）\n\n![9781118348161-fg0317.eps](img/9781118348161-fg0317_fmt.png)\n\n图 3-17：点击错误查看故障位置。\n\
  \n由于大多数 Web 应用使用 AJAX 获取数据的主要方式，Firebug 成为调试调用响应的不可或少的工具。在开发时，解析来自 Twitter 或 Flickr\
  \ API 的 JSON 对象时经常会出错。通过 Firebug，你可以检查响应以确定需要整合到代码中的属性。\n\n如图 3-18 所示（取自 foursquare），你可以看到如何深入查看返回用户附近场所的查询响应。使用此工具是查找\
  \ API 或远程数据源中值和属性的好方法。\n\n![9781118348161-fg0318.eps](img/9781118348161-fg0318_fmt.png)\n\
  \n图 3-18：在 foursquare 中深入查询响应\n\n### 移动控制台工具\n\n虽然在桌面浏览器中触手可及这些工具很棒，但在移动端则是另一回事。由于你无法访问控制台，也无法在设备上安装\
  \ Firebug，可以使用其他工具来了解底层发生了什么。\n\n对于 iOS，你可以使用名为 Winere 的产品，这是一种允许你在 iPhone 上实时查看\
  \ XHR 和 HTML 元素的工具。该产品是为 PhoneGap 项目开发的，也可以用于移动 Web 应用。\n\n在 Android 上，你可以使用 Eclipse\
  \ IDE 内部的控制台来帮助调试常见问题。通常，你可以使用 `console.log` 输出变量以确定其值，然后查看控制台查看结果。\n\n\n\n\n\n\
  既然你已经搭建好了开发环境，并准备好了所需的工具，现在是时候讨论一下你的 Web 应用的生产环境或公共版本需要什么类型的基础设施了。根据你的 Web 应用的活跃程度和参与度，你需要为应用程序的运行选择合适的服务器性能水平。在本节中，我将介绍你可以使用的托管、基础设施和带宽解决方案，以确保你的\
  \ Web 应用能够从一个用户扩展到一百万个用户。\n\n## 托管\n\nWeb 应用的托管类型有几种。以下列表比较了一些热门备方案的价格、功能和可扩展性。\n\
  \n* **共享主机（Shared hosting）**：供应商包括 `GoDaddy`、`BlueHost` 和 `Media Temple` —— 价格较低。共享主机意味着你正在与同一台服务器上的其他成员共享资源。如果服务器上的另一个用户出现流量激增，你的应用程序就会受到影响。对于服务流量或活动量非常低的用户来说，这是一种低成本方案。\n\
  这种托管通常以服务托管计划的形式提供，因此用户不需要管理服务器或进行更新。终端用户将看到 `Control Panel`（控制面板）用户界面，并且无需通过 `SSH`\
  \ 登录服务器即可进行任何更改。\n\n* **虚拟专用服务器（VPS）**：由 `Media Temple` 和 `Rackspace Medium` 提供，VPS\
  \ 解决方案根据你购买的服务器大小，价格从中等到高不等。`VPS` 与 `Shared` 的区别在于，你现在可以保证实例拥有 CPU、硬盘和内存的最小值和最大值。它仍然运行在共享服务器上，但仅在你的私有实例中。\n\
  在这种托管选项中，服务器是自管理的，用户通常负责安装和升级新版本及补丁。有些公司提供服务托管计划；然而，这通常更贵。\n\n* **云托管（Cloud）**：由\
  \ `Rackspace` 和 `Hosting` 等公司提供，这些托管选项的价格从高到低不等，因为价格根据使用量计算，而不是固定费用。云托管已成为初创公司的非常受欢迎的选择，因为价格随使用情况而异。与其他选项不同，云托管仅在你的服务器开启并运行运行时收费。它们还允许你灵活地根据需要将服务器扩展到新的内存和硬盘空间。\n\
  通过云托管，你负责管理与服务器相关的一切，从使用什么操作系统到要安装的应用程序。与 `VPS` 不同，这里没有预装软件。终端用户必须完成所有工作。\n\n根据你的应用程序需求，你可以选择适合你的解决方案。对于需要用户发布状态更新等高活跃度的服务，云解决方案效果很好。它让你具备根据活动水平向上扩展资源的能力。此外，如果你没有用完所有资源，你只需为使用的部分付费，这有助于你的底线。\n\
  \n## 基础设施设置\n\n走云端路线的缺点是设置服务器所需的技能水平。如之前提到的，大多数基础设施都是自管理的。自托管服务器意味着你必须安装自己的 Web\
  \ 服务器、数据库等。有些公司提供托管解决方案（managed solution），但这种选项的价格要高得多。\n\n表 3-2 列出了你根据应用程序可以选择的常见基础设施设置：\n\
  \n### 表 3-2 基础设施设置的类型\n\n| 基础设施设置 | 复杂度 | 描述 |\n| :--- | :--- | :--- |\n| 单服务器 |\
  \ 简单 | 单个服务器将你所有的应用都放在一个地方。如果你的应用需要数据库，它将位于应用程序代码内部。资源在你的 Web 服务器、数据库和应用程序代码之间共享。\
  \ |\n| 多层（N-tier） | 复杂 | 这将应用程序的不同部分分离到它们自己的专用资源中。例如，你将所有的应用程序代码、数据库和 Web 服务器都放在不同的机器上。这允许预留专用资源并根据使用情况对每台机器进行扩展。\
  \ |\n\n对于更基础的 Web 应用，单服务器解决方案提供了一个良好的起点坚实框架。随着你的应用程序的增长，你可以根据需要随时迁移到多层系统。虽然多层系统赋予了你环境的灵活性，但在小团队中维护和管理它是复杂的。如果没有适当的工具，你会发现自己寻找问题的时间比解决问题的时间还要长。\n\
  \n## 带宽管理\n\n每个 Web 应用都有每次启动应用时都需要加载的静态文件。当这发生时，你的服务器会处理这些文件并发送给客户端，这在大多数托管提供商处会产生带宽费用。这些带宽成本随时间的推移而增加。在提供静态内容（如图像和\
  \ `CSS` 文件）时，允许名为 `Content Delivery Network (CDN)` 的服务来分发内容是一种良好的做法，可以降低你的带宽和加载时间。\n\
  \n这些 CDN 在网络浏览器中缓存文件，使用使用户能够更快地加载内容。`Amazon Simple Storage Service (S3)` 提供了存储你的图像和\
  \ `CSS` 的解决方案，而不会影响你的托管带宽或硬盘空间。像 `foursquare` 和 `Untappd` 这样的大社交网络网站使用 `Amazon S3`\
  \ 来存储头像、Logo、`CSS` 和其他图像。对于你的托管解决方案，存储和带宽的价格通常要低得多。\n\n当然，你始终可以使用 `Manifest Cache`\
  \ 来缓存你的静态图像、`JavaScript` 和 `CSS`。它不会影响你服务器上的带宽，并在文件从本地设备加载之前提供极佳的性能。根据你的需求，这可能是更好的选择，特别是当你的应用程序不需要定期检查更新的图像或\
  \ `CSS` 时。只需记住，`Manifest Cache` 需要用户允许内容存储在他们的设备上，并且有一个限制。\n\n## 总结\n\n在本章中，你学习了如何搭建环境来开始构建。此外，本章还讨论了以下主题：\n\
  \n* 调试工具\n* 在本地构建自己的 Web 服务器\n* 托管和带宽\n* 编写代码的工具\n\n## 第 4 章：创建原型\n\n本书的剩余部分将引导你如何根据所有的\
  \ `HTML5`、`JS` 和 `CSS3` 功能构建你自己的应用程序。\n\n\n\n\n创建一个模板或样板代码可以帮助你构建更快速、更有效的代码。很多时候，开发者会跳过这一步，结果导致花费大量时间回过来添加新功能或扩大项目范围。第一次就做对总是能让你避免以后遇到烦恼。\n\
  \n## 使用 HTML5 移动端样板代码\n\n使用预先结构的 HTML5 模板将帮助你轻松开始开发并保持结构整洁。参与过 `jQuery` 项目的 Paul\
  \ Irish 发明了用于桌面浏览器的 HTML5 boilerplate 框架，最近他又为移动设备提供了这个非常流行的样板。要获取该工具包，请遵循以下步骤：\n\
  \n1. 访问 `http://html5boilerplate.com/mobile` 并点击 Download Boilerplate。在编写本书时，当前版本为\
  \ 3.0。\n2. 打开 zip 压缩包时，如图 4-1 所示，将以下文件复制到计算机上的另一个文件夹。\n3. 使用你喜欢的软件编辑器打开项目，并点击 `index.html`\
  \ 文件。\n4. 第 79 行至 83 行包含 Google Analytics 的 JavaScript 代码，在本示例中你应该将其删除。如果你以后想重用它，只需将\
  \ `UA-XXXX-X` 改为你来自 Google 的正确站点即可。\n\n搞定！现在你已经设置好了结构，你可以在单个 HTML 文件中编写所有代码。你只需要创建新的\
  \ HTML 部分来表示页面。为了提供返回按钮支持，你使用一个名为 `onHashChange` 的方法来更改每个 `<div>` 的激活状态，这将在章稍后部分讨论。所有部分内容都放置在脚本的父级\
  \ `<div id=\"container\">` 区域，如图 4-2 所示。\n\n![9781118348161-fg0401.eps](img/9781118348161-fg0401_fmt.png)\n\
  图 4-1: 文件夹视图中的压缩内容\n\n![9781118348161-fg0402.eps](img/9781118348161-fg0402_fmt.png)\n\
  图 4-2: 用于布局的 index.html 页面\n\n## 应用设计\n\n正如第 1 章所述，设计原生应用还是 Web 应用取决于用户查看你应用的设备类型。由于示例应用仅针对移动端制作，因此你使用一套代码库的方法将此代码部署到所有平台。此应用使用静态顶部导航并在下方提供内容。当你向下滚动时，导航将变为固定并始终保持在屏幕顶部。（见图\
  \ 4-3。）\n\n保持顶栏固定使用户户向下滚动页面并切换到另一个页面，而无需滚动回页面顶部。此外，固定栏不会影响 Android 菜单或返回按钮，因为主导航栏位于页面顶部。这是现代\
  \ Web 应用程序的标准设计模式，包括 Twitter、Facebook 和 Untappd。\n\n![9781118348161-fg0403.eps](img/9781118348161-fg0403_fmt.png)\n\
  图 4-3: 导航元素始终保持在屏幕顶部。\n\n## 页面原型设计\n\n设计过程的一个重要部分是制作页面实际外观以及它们如何运行的原型。这个过程可以帮助你理解哪些哪些功能，哪些功能是没有意义的。在开发过程中，一个想法看起来可能与你的产品可行，但制作原型可以证明它并不符合你的主题。制作页面原型可以帮助你更快地开发应用，并避免放入那些不合适内容的诱惑。\n\
  \n由于你已经有了基础结构，你需要计划将创建哪些页面来支持你的应用程序。在本章开头提到的，Corks 具有以下目标：\n\n* 记录并保存你酒窖中有的葡萄酒（使用\
  \ `SQL-Lite`、本地存储）\n* 查询葡萄酒定位器（使用 `geolocation`）\n* 使用社交 API（使用 `AJAX`、`JSON`）\n\
  * 创建 Web 应用设置（本地存储）\n* 启用搜索和添加葡萄酒\n\n每个页面都涉及 HTML5 的不同方面。由于你将使用 HTML5 `SQL-Lite`，你会将用户数据保存在浏览器中。除非用户从其浏览器中删除所有数据，否则数据将被保留。在接下来的章节中，我将讨论每个页面并为视觉学习者介绍一个原型。\n\
  \n### 设置/关于\n\n在设置页面上，你赋予用户清除数据库的能力，以防他们想要重新开始并删除数据。此功能将要求用户确认更改，然后删除他们当前创建的任何葡萄酒。\n\
  \n此页面包含有关应用、其功能以及应用所有者联系信息的静态信息。你还可以为功能包含一个帮助部分，供用户学习如何使用应用程序。你使用 HTML5 输入类型使用户能够从你的\
  \ Web 应用中拨打电话或发送电子邮件。（见图 4-4。）\n\n在本示例中，你将添加一个简单的工具来更改你在应用程序内的显示名称。这有助于用户定义谁在使用应用程序，并赋予其个性化色彩。\n\
  \n![9781118348161-fg0404.eps](img/9781118348161-fg0404_fmt.png)\n图 4-4: 设置“关于”\n\
  \n### 清除葡萄酒\n\n首先，用户必须能够向他们的酒窖中添加葡萄酒。顶部导航的第二个标签页允许用户添加葡萄酒。以下部分将详细介绍这些部分，以便有更好的了解。\n\
  \n![9781118348161-fg0405.eps](img/9781118348161-fg0405_fmt.png)\n图 4-5: 葡萄酒管理屏幕\n\
  \n![9781118348161-fg0406.eps](img/9781118348161-fg0406_fmt.png)\n图 4-6: 葡萄酒管理屏幕的额外视图\n\
  \n![9781118348161-fg0407.eps](img/9781118348161-fg0407_fmt.png)\n图 4-7: 向酒窖中添加葡萄酒。\n\
  \n如果没有找到葡萄酒，用户可以通过点击“添加葡萄酒”来使用搜索功能，如图 4-8 所示。这允许用户使用表单创建葡萄酒。用户输入葡萄酒名称、酒庄、酒精含量和颜色，以便快速将新葡萄酒添加到他们的酒窖中。\n\
  \n![9781118348161-fg0408.eps](img/9781118348161-fg0408_fmt.png)\n图 4-8: 搜索葡萄酒。\n\
  \n## 使用酒窖时间线\n\n顶部导航的第一个标签页是酒窖时间线。这是你添加到酒窖的所有葡萄酒的列表，按添加时间倒序排列。你可以点击列表中的每个项目来查看我们在本章稍后讨论的单个葡萄酒信息页面。在动态顶部，一个选择按钮允许用户根据名称升序、名称降序和添加日期更改结果的排序。（见图\
  \ 4-9。）\n\n![9781118348161-fg0409.eps](img/9781118348161-fg0409_fmt.png)\n图 4-9:\
  \ 活动主页示例视图\n\n此项目使用 `SQL-Lite` 根据页面顶部选择按钮设置的选项从本地数据库中查询。这些设置定义了查询参数以及如何显示结果。\n\n\
  \n\n\n顶部导航栏最右侧的按钮允许你搜索葡萄酒数据库。点击搜索图标会在导航栏下方显示一个搜索栏。它将以叠加的形式显示在内容之上，因此不会中断你的浏览。（参见图\
  \ 4-10。）搜索葡萄酒将带你进入搜索列表页，该页显示了与你的结果匹配的葡萄酒列表。点击葡萄酒，你可以选择将此酒添加到你的酒架或查看更多信息。（参见图 4-11。）\n\
  \n![9781118348161-fg0411.eps](img/9781118348161-fg0411_fmt.png)\n\n图 4-11：葡萄酒搜索详情页示例\n\
  \n![9781118348161-fg0410.eps](img/9781118348161-fg0410_fmt.png)\n\n图 4-10：葡萄酒搜索页示例\n\
  \n### 葡萄酒页\n\n在“酒架时间线”（Cellar Timeline）上，点击任何葡萄酒都会显示该酒的详细信息。在页面上，你想向用户显示葡萄酒的名称、酒精含量（`ABV`）、颜色和酒庄。当用户将葡萄酒添加到酒架时，页面还会显示添加日期以及可选的评论空间。“酒架时间线”还提供了将葡萄酒添加到酒架的选项。（参见图\
  \ 12。）此外，每个葡萄酒页都有指向 `Twitter` 的链接，允许用户扫描社交网络上关于该葡萄酒的推文。该链接将打开一个新窗口，使用 `API` 返回所选葡萄酒的结果。顶部的返回按钮允许用户回到上一个页。\n\
  \n![9781118348161-fg0412.eps](img/9781118348161-fg0412.png)\n\n图 12：葡萄酒详情页示例\n\n\
  ### 葡萄酒搜索\n\n葡萄酒位置搜索的目标是寻找定义范围内的葡萄酒商店。此应用程序使用 `Google Maps API` 来收集数据并在地图上显示结果。页面顶部会显示\
  \ `GPS Location` 符号。（参见图 13。）当用户导航到此标签页时，它会收集用户的位置并向 `Google` 发送查询，以获取 10 英里范围内的葡萄酒列表。返回的结果被解析并作为标记散落在地图上。地图以用户的位置为中心，不同的标记也放置在其周围，指示与用户位置的距离。（参见图\
  \ 14。）\n\n![9781118348161-fg0413.eps](img/9781118348161-fg0413_fmt.png)\n\n图 13：葡萄酒页示例\n\
  \n![9781118348161-fg0414.eps](img/9781118348161-fg0414.png)\n\n图 14：葡萄酒详情页示例\n\n\
  如果用户离开葡萄酒搜索页稍后返回，数据将保持一致；然而，用户可以点击 GPS 图标根据新位置循环搜索。\n\n### 定义 Hash 导航\n\n定义网站如何导航是重要的。此应用程序使用\
  \ `AJAX` 获取数据库数据，因此你需要一种方法在不实际产生页的情况下保留页面历史。这允许用户在应用程序中的页面之间导航，而无需刷新整个文档。\n\n通过\
  \ `AJAX` 和 `HTML5` 结构，页面实际上不会是独立的 HTML 文档形式。每个页面将存在于 `<div>` 中，代表一个页面。所有页面都在单独的\
  \ `<div>` 中跟踪，因此你使用一种名为 `hashChange` 的 HTML5 方法来跟踪导航。Hash 在 URL 中的表示如下所示：\n\n`http://example.com/#wine-page`\n\
  \n`http://example.com/#activity`\n\n当用户点击触发 hash 变化的链接时，脚本会检测到 hash 事件并触发某些自定义代码。以下是检测页面更改的一种代码示例：\n\
  \n```html\n<script='text/javascript'>\n// 每当 onhashchange 事件触发时，执行 locationHashChanged\
  \ 函数。\nwindow.onhashchange = locationHashChanged;\n\nfunction locationHashChanged()\
  \ {\n  // 此函数传入 location 变量，它包含 hash\n  // (#wine-page)\n  var hash = location.hash;\n\
  \  // 根据 hash，你可以触发特定的代码\n  if (hash == \"#wine-page\")\n  {\n    // 隐藏所有类为 page\
  \ 的 DIV\n    $(\".page\").hide();\n    $(\"#wine-page\").show();\n  }\n}\n</script>\n\
  ```\n\n前面的脚本检测 URL 中 hash 的任何变化，然后触发名为 `locationHashChanged` 的自定义函数。这告诉 JavaScript\
  \ 根据定义的 hash 加载内容。为了使此工作，所有链接的 `href` 属性都将包含此 hash 变化，如下代码所示：\n\n```html\n<li>\n\
  \  <a href=\"#wine-page\">...</a>\n</li>\n```\n\n\n\n\n本章讨论了如何构建应用程序原型，并包含了你在书中构建的应用程序的一些示例屏幕。正如所讨论的，原型设计可以帮助你定义应用程序的功能，并允许你设定范围。在定义了这些内容之后，构建应用程序要容易得多，这样你就不必在事后浪费时间去开发功能。\n\
  \n除了原型设计之外，本章还讨论了：\n\n- HTML5 样板结构\n- 在单个 HTML 设计中布局页面\n- 使用和检测用于导航的 `onHashChange`\
  \ 事件\n- PushState 导航\n\n# 第 5 章：移动端 Web 结构\n\n在开发移动端 Web 时，当你设计 Web 应用程序的结构时，必须改变整个思维方式。对于标准网页，鼠标点击和键盘输入是你程序中用于以允许用户使用应用程序的机制，因此它们是主要的事件。在移动设备上，`click`\
  \ 方法变为了 `touch` 事件，`onmouseover` 事件不存在，且 `CSS:hover` 方法无法按设计工作。未来移动设备可能会整合技术以使用\
  \ `:hover` 方法，但目前它无法提供像在标准桌面浏览器上那样的预期效果。用户与你的 Web 应用程序的交互方式至关重要。你不能仅通过在 Web 浏览器中测试来设计和开发；在触摸设备上测试可以提供一些有趣的见解。\n\
  \n在本章中，你开始为 Corks 构建框架，这涉及设置一些全局模板，包括头部、页脚和顶部导航。我们讨论了 iOS 上一个名为“全应用模式”（Full App\
  \ Mode）的流行功能，它允许用户为应用程序创建主屏幕图标，并移除 Safari 的底部和顶部栏。这些调整对于让你的应用程序感觉更像原生非常有帮助。\n\n\
  Android 没有类似的功能；但是，用户可以将你的 Web 应用程序“固定”到他们的主屏幕以便快速访问。Android 浏览器没有底部导航栏，因为设备有一个实际的返回键。\n\
  \n此外，本章还讨论了 `onTouch` 事件，以及在处理移动浏览器时它们与 `onClick` 事件有何不同。因为移动浏览器在点击按钮或链接时（在某些时刻）会有大约\
  \ 300 毫秒的延迟，被称为 touchdelay（触摸延迟），用户有时会在不经意的情况下双击你的链接。\n\n最后，你重新回顾了针对屏幕方向变化调整内容的方法，例如\
  \ Android 用户滑出键盘或设备旋转时。你可以根据你的应用程序以不同的方式处理这些事件；然而，我们讨论了使用媒体查询来处理这些分辨率变化，以及你如何使用它们通过向桌面浏览器提供移动应用来真正实现“一套代码，多个平台”。\n\
  \n在本章中，你继续开发示例应用 Corks。到本章结束时，你应该能够：\n\n- 构建基础的 `Corks` 框架，包括导航元素以及头部和页脚\n- 设置移动应用程序的初始导航\n\
  - 理解 `onClick` 和 `onTouch` 事件之间的区别\n- 构建检测 Corks 方向变化的方法\n\n## 要构建的元素\n\n拥有一个坚固的框架和模板会让为你的移动应用开发变得容易得多。代码复用可以节省数小时的工作，并让你将注意力放在内容上。在本章中，你构建了导航栏并设置了应用程序的头部和页脚。在构建好之后，每当你开始一个新的物理或虚拟（在另一个\
  \ `<div>` 元素中）页面时，你都可以引用这些代码。\n\n### 使用视口（viewports）居中内容\n\n你的 Web 应用程序可以使用视口将内容显示在屏幕中央。视口对于未针对移动端格式化的网站来说，等同于用户对内容进行捏指缩放。\n\
  \n你希望 Corks 应用程序处于中心，并对齐到屏幕宽度。为了实现这一点，你需要打开 `index.html` 文件并开始编辑 `head` 部分内部的内容。接下来，在\
  \ `<html>` 开启标签下方直接添加以下代码片段：\n\n```html\n<meta name=\"viewport\" content=\"width=device-width;\
  \ initial-scale=1.0; maximum-scale=1.0; minimum-scale=1.0; user-scalable=false\"\
  />\n```\n\n此选项将应用程序的宽度设置为手机宽度而不进行任何缩放。这意味着无论屏幕有多大，元素都会环绕到屏幕边缘。\n\n最后，你将 `user-scalable`\
  \ 设置为 `false`，这确保了用户无法调整内容大小。这通常设置为 `false`，因为屏幕上的所有元素应该是可见的，不需要用户捏指缩放。\n\n### 使用全应用模式（仅限\
  \ iOS）\n\niOS 对所有网站有一个名为“全应用模式”的设置。使用它可以让你的应用程序运行在 `UIWebView` 中，从而去掉 Safari 的地址栏和底部导航栏。图\
  \ 5-1 显示了未应用全应用模式的 Untappd 网站。将其与图 5-2 进行对比。看到区别了吗？图 5-1 有底部导航栏，而另一张图像顶部有一个黑色条，并在全屏运行。\n\
  \n![9781118348161-fg0501.eps](img/9781118348161-fg0501_fmt.png)\n\n图 5-1：导航元素占据了宝贵的屏幕空间。\n\
  \n![9781118348161-fg0502.eps](img/9781118348161-fg0502_fmt.png)\n\n图 5-2：使用全应用模式，你的用户可以获得最大的收益。\n\
  \n尽管全应用模式看起来似乎是最佳选择，但情况并非总是如此。表 5-1 查看了使用全应用模式的优缺点。\n\n| 优点 | 缺点 |\n| :--- | :---\
  \ |\n| 让你的应用程序感觉更原生。 | 无法在后台运行，每次启动都需要重新加载 Web 应用。 |\n| 允许设置启动时的启动屏幕。 | 保持页面状态是另一个挑战，特别是...\
  \ |\n\n要启用全应用模式，在你的 `index.html` 页的 `<head>` 部分添加以下代码片段。首先，移除你用于 Corks 开发的 HTML5\
  \ 样板模板中 `<head>` 和 `</head>` 标签内的文本。然后添加：\n\n```html\n<meta name=\"apple-mobile-web-app-capable\"\
  \ content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"\
  black\">\n```\n\n第一行通过将内容设置为 `yes` 来启用全应用模式网页。第二行允许你设置状态栏的颜色（包含时、电量和信号信息的栏）。这通常被设置为\
  \ `black`，但你可以根据应用程序的配色方案将内容更改为 `gray`。你还可以将内容设置为 `black-translucent`，这会让状态栏变为黑色且半透明。这意味着内容将流到状态栏下方。iOS\
  \ 上的照片应用程序就是一个例子。当你滚动时，内容会流到状态栏下方。图 5-3 到 5-5 显示了这些状态栏增强功能。\n\n![9781118348161-fg0503.eps](img/9781118348161-fg0503_fmt.png)\n\
  \n图 5-3：使用 black 时的 iOS 状态栏\n\n\n\n\n\n## 图 5-4：iOS 上使用默认设置时 状态栏\n\n![9781118348161-fg0505.eps](img/9781118348161-fg0505_fmt.png)\n\
  \n## 图 5-5：iOS 上使用黑色透明效果时 状态栏\n\n尽管这允许你的 Web 应用使用全屏模式（Full App），但你仍需要为主屏幕和启动屏幕添加图标。由于应用在\
  \ iOS 上通过 `UIWebView` 启动，在加载期间需要一个屏幕进行显示。此外，当用户将应用添加到主屏幕时，需要一个图标来代表它。\n\n要添加图标，请将以下代码段放在\
  \ `<head>` 部分，可以位于关于全屏模式代码上方或下方：\n\n```html\n<link rel=”apple-touch-icon-precomposed”\
  \ sizes=”114x114” href=”location_of_image_here “>\n<link rel=”apple-touch-icon-precomposed”\
  \ sizes=”72x72” href=”location_of_image_here “>\n<link rel=”apple-touch-icon-precomposed”\
  \ href=” location_of_image_here “>\n```\n\n每个 `link` 标签代表一个 `apple-touch-icon-precomposed`\
  \ 元素，它告诉操作系统将哪个图标分配为图标链接。根据用户的操作系统，会使用不同的行。重要的部分为高分辨率屏幕的用户分配不同的图标。对于 iPhone 4 及更高型号，会读取\
  \ 114 x 114 尺寸的图像；iPad 1 或更低版本使用 72 x 72 图像将你的 Web 应用添加到用户的主屏幕。最后一个选项涵盖了非 Retina\
  \ 的 iPhone、iPad 2 以及 Android 2.1+ 设备。它没有提供尺寸，使得 `link` 元素能够涵盖这些此类设备。一旦你将这些行添加到文档中，在应用被添加后，图标将显示在用户的主屏幕上。正如我们之前提到的，尽管\
  \ `rel` 属性的名称包含 `apple`，但在 Android 2.1+ 设备上也能被识别。一旦用户将书签添加到主屏幕，Android 操作系统就会使用此图像作为图标。\n\
  \n另一个重要点是 `apple-touch-icon-precomposed` 和 `apple-touch-icon.` 之间的区别。在 iOS 设备上，使用\
  \ `precomposed` 允许操作系统在图标添加到主屏幕时为你的图标添加高光效果。（见图 5-6。）如需启用此效果，只需从属性中删除 `precomposed`\
  \ 部分即可。\n\n![9781118348161-fg0506.eps](img/9781118348161-fg0506_fmt.png)\n\n## 图\
  \ 5-6：高光和无高光图标示例\n\n要正确使用全屏模式，用户必须将应用程序添加到主屏幕。以下是用户需要遵循的步骤：\n\n1. 导航到已添加到主屏幕的 Web\
  \ 应用，点击屏幕底部的中间分享按钮。（见图 5-7。）图标可能看起来你当前安装的 iOS 版本而有所不同。以下截图来自 iOS 5。\n2. 从底部弹出操作列表后，选择“添加到主屏幕”，如图\
  \ 5-8 所示。\n\n![9781118348161-fg0507.eps](img/9781118348161-fg0507_fmt.png)\n\n##\
  \ 图 5-7：Mobile Safari 中的 Web 应用，底部显示了选项。\n\n![9781118348161-fg0508.eps](img/9781118348161-fg0508_fmt.png)\n\
  \n## 图 5-8：当你尝试将移动端 Web 应用添加到主屏幕时，iOS 中显示的选项\n\n3. 选择应用程序名称以查看图标在主屏幕上的显示方式。（见图 5-9。）这是自动从\
  \ HTML 文档的标题中提取的。\n\n![9781118348161-fg0509.eps](img/9781118348161-fg0509_fmt.png)\n\
  \n## 图 5-9：Web 应用添加到主屏幕前的最后一个界面\n\n你一切准备就绪！图标现在应该以你输入的名称出现在主屏幕上。当你点击该图标时，Web 应用将在全屏模式下运行。（见图\
  \ 5-10。）\n\n![9781118348161-fg0510.eps](img/9781118348161-fg0510_fmt.png)\n\n##\
  \ 图 5-10：带有你的 Web 应用新图标的主屏幕。\n\n你可以添加工具来让之前的过程变得更容易。意大利开发者 Matteo Spinelli 为开发者创建了一个简单的工具，以鼓励用户将他们的全屏模式\
  \ iOS 应用添加到主屏幕。该脚本名为 `add2home.js`，可以轻松地添加到任何移动 Web 应用中，创建一个覆盖层弹出窗口，告知用户将 Web 应用添加到主屏幕，如图\
  \ 5-11 所示：\n\n![9781118348161-fg0511.eps](img/9781118348161-fg0511_fmt.png)\n\n\
  ## 图 5-11：使用 add2home.js 鼓励用户。\n\n要使用 `add2home.js`，请遵循以下步骤：\n\n1. 下载 `add2home`\
  \ 包。\n2. 在你的 `<head>` 中包含以下代码：\n\n```html\n<link rel=\"stylesheet\" href=\"http://code.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css\"\
  >\n```\n\n同样重要的是，在 Mobile Safari 中，地址栏是自动显示的。为了增加你的屏幕空间，你可以添加一些在页面加载时触发的 JavaScript\
  \ 来隐藏地址栏。你将此添加到 `index.html` 页面的底部，就在 `</body>` 标签之前：\n\n```javascript\nwindow.addEventListener('load',\
  \ function() {\n  setTimeout(function() {\n    window.scrollTo(0,1);\n  }, 0);\n\
  });\n```\n\n此脚本在页面完全加载后触发，并使窗口滚动到 (0,1)，这是 Y 轴上的第一个像素。这强制浏览器窗口向下滚动，从而隐藏地址栏。\n\n\
  在你将该添加到 `<head>` 标签后，你应该拥有以下代码：\n\n```html\n<head>\n  <title>Corks - Cellar your\
  \ Wine</title>\n  <meta name=\"description\" content=\"Corks 一个跟踪你酒窖葡萄酒的简单应用程序。\"\
  >\n  <meta name=\"viewport\" content=\"width=device-width; initial-scale=1.0; maximum-scale=1.0;\
  \ minimum-scale=1.0; user-scalable=false;\"/>\n  <meta name=\"apple-mobile-web-app-capable\"\
  \ content=\"yes\" />\n  <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"\
  black\" />\n  <link rel=\"apple-touch-icon-precomposed\" sizes=\"114x114\" href=\"\
  location_of_image_here\">\n  <!-- 用于第一代 iPad: -->\n  <link rel=\"apple-touch-icon-precomposed\"\
  \ sizes=\"72x72\" href=\"location_of_image_here\">\n  <!-- 用于非 Retina iPhone、iPod\
  \ Touch 和 Android 2.1+ 设备: -->\n  <link rel=\"apple-touch-icon-precomposed\" href=\"\
  location_of_image_here\">\n</head>\n```\n\n\n\n\n\n```html\n<link rel=”apple-touch-startup-image”\
  \ href=”start_location_here” />\n\n<!-- CSS File -->\n<link rel=”stylesheet” href=”http://code.jquery.com/mobile/1.0.1/jquery.mobile-1.0.1.min.css”\
  \ />\n</head>\n```\n\n注意 `<head>` 部分中的 `<title>` 和 `<meta name=”description”>` 元素。这些是你在编写\
  \ HTML 文档时需要添加的标准元素。当用户尝试将 Web 应用程序添加到主屏幕时，会显示 `<title>` 元素。用于描述的 `meta` 标签允许搜索引擎爬取你的网站并在其搜索结果中显示该内容。这是一个可选字段；如果你希望你的网站出现在搜索引擎的搜索结果中，请就使用它。\n\
  \n在大多数桌面应用程序中，开发模式被放置在 `<head>` 部分的 JavaScript 文件中；然而，研究表明，在所有 JavaScript 文件加载完成之前，页面将不会完全加载。如果连接较差，页面内容会先加载，然后是\
  \ JavaScript。这可以缩短加载时间。在本章的稍后部分，我将讨论你将要使用的 JavaScript 文件。此时，你可以关闭 `</head>` 元素。需要注意的是，在加载\
  \ HTML 文档时，将 JavaScript 文件放在文档底部要有效得多。强烈建议将所有 JavaScript 文件放置在结束的 `<body>` 标签之前。\n\
  \n## 添加头部和导航元素\n\n现在你已经链接了 CSS，可以开始处理应用程序的内容了。首先，查看 jQuery Mobile CSS 页面的结构。对于每个页面，你必须遵循此格式：\n\
  \n```html\n<div id=”activity” data-role=”page\">\n  <div data-role=”header\">\n\
  \    <h1>Page Title</h1>\n  </div><!-- /header -->\n  <div data-role=”content\"\
  >\n    <p>Page content goes here.</p>\n  </div><!-- /content -->\n  <div data-role=”footer\"\
  >\n    <h4>Page Footer</h4>\n  </div><!-- /footer -->\n</div>\n```\n\njQuery Mobile\
  \ 引入了新的 HTML5 属性，有助于 JavaScript 定义元素如何被使用。例如，`data-role` 定义了在该元素中列出的是什么类型的数据。如果你仅使用此代码渲染此页面，你将得到图\
  \ 5-12 所示的内容。\n\n![9781118348161-fg0512.eps](img/9781118348161-fg0512_fmt.png)\n\
  \n图 5-12：Corks 首页\n\n在 `header` 数据中，添加页面标题 Corks。由于你想要有一个标签栏界面，你可以通过以下代码同时添加头部（页面标题）和导航栏：\n\
  \n```html\n<h1>Your Activity</h1>\n<div data-role=”navbar” data-iconpos=”bottom\"\
  >\n  <ul>\n    <li><a data-icon=”star” class=”ui-btn-active” href=”#activity\">Activity</a></li>\n\
  \    <li><a data-icon=”grid” href=”#manage\">Manage</a></li>\n    <li><a data-icon=”info”\
  \ href=”#find\">Find</a></li>\n    <li><a data-icon=”gear” href=”#settings\">Settings</a></li>\n\
  \    <li><a data-icon=”search” href=”#search\">Search</a></li>\n  </ul>\n</div>\n\
  ```\n\n从顶部开始，`h1` 标签是显示在每个页面上的标题。下一块代码包含了标签栏的数据。使用 `data-role` 为 `navbar` 告诉 jQuery\
  \ Mobile 将 `<div>` 内部的所有元素格式化为符合 `navbar` CSS 样式。由于你计划在每个页面顶部使用图标，将 `data-iconpos`\
  \ 元素设置为 `top`。如果你希望图标位于每个按钮的底部，可以将其设置为 `bottom`。如果你不想在标签栏中包含图标，可以完全删除此属性；它只是为你的标签栏增加了一点\
  \ UI 以定义每个按钮。\n\n接下来，你以 `ul` 内部 `li` 元素的形式创建你想要的每个标签。要添加或删除标签，请添加或删除 `li` 元素。要选择为每个标签分配哪个图标，请使用\
  \ `data-icon` 显示图标。图标的名称引用 CSS 类名，并且可以自定义。你甚至可以在进行一些自定义后使用第三方图标集。\n\n应用程序打开时进入 Activity\
  \ 页面，因此你需要为 `li` 添加 `ui-btn-active` 类以使此打开的页面处于激活状态。你可以将此逻辑应用到任何导航栏项目，并在其他页面上构建导航时。\n\
  \n在 iPhone 上保存并显示此内容后，你将得到图 5-13 所示的页面。\n\n![9781118348161-fg0513.eps](img/9781118348161-fg0513_fmt.png)\n\
  \n图 5-13：以激活状态显示 Manage 页面\n\n## 添加 hash 变化事件\n\n在浏览器中，用户点击链接时，页面通常会更改 URL 方案。当用户从\
  \ [`http://example.com/index.html`](http://example.com/index.html) 导航到 [`http://example.com/index.html`](http://example.com/index.html)\
  \ 时就会发生这种情况。这种方法之一是通过 hash 事件，它可以跟踪哈希何时更改。例如，jQuery Mobile 默认将 CSS 属性设置为 `display:\
  \ none`，并将 `ui-page-active` 类应用到第一个元素——在这种情况下是 `activity`。要测试这一点，请在下方创建以下结构：\n\n\
  ```html\n<div id=”activity” data-role=”page\">\n  <div data-role=”header\">\n  \
  \  <h1>Manage</h1>\n  </div><!-- /header -->\n  <div data-role=”content\">\n   \
  \ <p>Manage!</p>\n  </div><!-- /content -->\n  <div data-role=”footer\">\n    <h4>Page\
  \ Footer</h4>\n  </div><!-- /footer -->\n</div>\n```\n\n在浏览器中，用户点击链接时，页面通常会更改 URL\
  \ 方案。当用户从 [`http://example.com/index.html`](http://example.com/index.html) 导航到 [`http://example.com/index.html`](http://example.com/index.html)\
  \ 时就会发生这种情况。这种方法之一是通过 hash 事件，它可以跟踪哈希何时更改。例如，jQuery Mobile 默认将 CSS 属性设置为 `display:\
  \ none`，并将 `ui-page-active` 类应用到第一个元素——在这种情况下是 `activity`。要测试这一点，请在下方创建以下结构：\n\n\
  ```html\n<div id=”activity” data-role=”page\">\n  <div data-role=”header\">\n  \
  \  <h1>Manage</h1>\n  </div><!-- /header -->\n  <div data-role=”content\">\n   \
  \ <p>Manage!</p>\n  </div><!-- /content -->\n  <div data-role=”footer\">\n    <h4>Page\
  \ Footer</h4>\n  </div><!-- /footer -->\n</div>\n```\n\n## 过渡\n\nCSS3 允许你应用一些惊人的过渡效果来动画页面之间的切换。这些效果可以帮助你的应用程序看起来更原生并增强用户体验。jQuery\
  \ Mobile 通过允许你在每个链接的 `data-transition` 属性中设置类型，消除了 CSS3 过渡的复杂性。例如，当你想要导航到 Corks\
  \ 的 Manage 页面时，你希望过渡向右滑动。这可以通过向锚点标签添加新属性来实现：\n\n```html\n<li><a data-icon=”grid”\
  \ data-transition=”slide” href=”#manage\">Manage</a></li>\n```\n\n\n\n\n\njQuery\
  \ Mobile 有许多动画可供选择，包括以下常用选项：\n\n- **Fade（淡入淡出）**：这是应用于每个 `hashChange` 事件的默认过渡效果。\n\
  - **Pop（弹出）**：页面将从屏幕中心向你处弹出的效果。\n- **Flip（翻转）**：这是 iPhone 上常见的过渡效果，用于将当前页面翻转 180\
  \ 度到另一侧。\n- **Turn（翻页）**：这种动画效果就像书本翻页一样。\n- **Flow（流动）**：页面向后滑动，新页面向前推入。\n- **Slide（滑动）**：标准的向右滑动和向左滑动在原生应用中很常见。\n\
  - **Slideup and slidedown（向上滑动和向下滑）**：允许新页面看起来是从页面的底部或顶部出现。\n\n虽然 jQuery Mobile\
  \ 让过渡的实现变得更容易，但理解这些过渡的工作原理至关重要，这样你才能正确将它们应用到你正在的项目中。过渡基于 CSS3 方法，创建出类似于动画的序列，看起来某个元素正在跨屏幕移动。基本上，动画的工作原理与翻页书相同：当快速连续包含静态对象的帧时，该对象看起来就像在移动。这里是常见的滑动过渡效果的工作原理。目前，页面结构代码如下：\n\
  \n```html\n<div id=\"activity\" class=\"page\" data-role=\"page\">\n  ....\n</div\n\
  <div id=\"manage\" class=\"page page-right\" data-role=\"page\">\n  ....\n</div\n\
  ```\n\n添加一些类（`page`, `page-right`）来显示滑动的方向。这是通过 jQuery Mobile 内的 JavaScript 自动处理的。接下来，为\
  \ `page` 分配一些 CSS 值：\n\n```css\n.page {\n  position: absolute;\n  width: 100%;\n\
  \  height: 100%;\n  -webkit-transform: translate3d(0, 0, 0);\n}\n```\n\n每个页面元素都需要\
  \ 100% 的宽度和高度，以防止内容扩散到浏览器的边缘。最后，`-webkit-transform` 元素非常重要；它激活了浏览器中每个页面的 GPU 加速。如果不使用这种方法，WebKit\
  \ 浏览器将不会开启 GPU 加速，导致 CSS3 无法利用图形芯片来辅助转换。如果你看到浏览器闪烁或分块加载元素，很可能是因为该元素没有被调用。\n\nCSS\
  \ 的 `-webkit-transform` 特性对于处理文档中的复杂过渡或重型 CSS 函数非常重要。如果未在更改的内容周围添加此属性，可能会导致滚动缓慢或页面部分看起来像是“分块”加载的。如果你在某些页面的性能上遇到困扰，我建议将此方法添加到父元素上。需要注意的是，在\
  \ Android 2.3.x 上，任何 3D 位移函数都会导致输入元素出现问题，因此请务必仅在需要时应用此方法。过度使用可能会导致浏览器崩溃或内存问题。\n\n\
  在设置好初始 CSS 后，你可以考虑通过 JavaScript 应用过渡效果。以下是完整的脚本，可以放在页面底部的 `script` 标签内：\n\n```javascript\n\
  function slideLoc(from, to) {\n  var myClasses = document.getElementByID(from).className.split('\
  \ ');\n  if (myClasses.indexOf('page-left') > 0) {\n    document.getElementByID(from).className\
  \ = \"page trans page-right\";\n  } else {\n    document.getElementByID(from).className\
  \ = \"page trans page-left\";\n  }\n  document.getElementByID(\"to\").addClass(\"\
  page trans page-center\");\n}\n```\n\n每当点击链接时，脚本都会跟踪 `to` 和 `from` 页面的过渡。在这种情况下，`from`\
  \ 将是 Activity 页面，而 `to` 是 Manage 页面。下一步是从 `activity (from)` 元素中获取类名并进行拆分。如果该元素包含\
  \ `page-left`，则让过渡从右侧开始。如果元素具有 `page-right`，应用相同的逻辑但从左侧开始过渡。最后，在过渡发生后，将 `manage\
  \ (to)` 页面设置为位于正中央。\n\n在上述的脚本中，应用 `trans` 类创建了过渡效果。为了使脚本完整，请添加实现过渡所需的 CSS：\n\n```css\n\
  .trans {\n  -moz-transition-duration: .5s;\n  -webkit-transition-duration: .5s;\n\
  \  -o-transition-duration: .5s;\n}\n```\n\n现在，你只需要在想要对页面应用此过渡效果时调用 `slideLoc` 元素即可。这保持了应用程序的整洁并改进了功能。对于现代浏览器，没有理由重新加载整个页面来显示另一个元素。使用页面过渡可以让你掩盖你仍在后台加载内容的实。\n\
  \n## 让用户滚动浏览应用页面\n\n已经开发了帮助用户与移动浏览器交互的新事件。其中最著名的是“touch”（触摸）事件。触摸是任何基于触摸的手机的重要部分。用户用手指而不是鼠标导航，因此你为移动应用编程的方式有很大不同。\n\
  \n### touch events（触摸事件）\n\n作为移动 Web 开发者，你希望放弃使用 `onClick` 并使用 `onTouch` 事件来处理操作。浏览器有\
  \ 300 到 500 毫秒的延迟。在桌面 Web 上，这种延迟是不察觉的；但在移动应用中，它非常明显。\n\n\n\n\n\n## iOS 滚动\n\n在 iOS\
  \ for iPhone 的第 5 版本之前，允许固定页脚和页头的 CSS 属性是处于禁用的。随着新操作系统的引入，这种方法通过一个特殊的 CSS 前缀被启用，允许在\
  \ Web 应用中进行原生滚动。该属性被称为 `-webkit-overflow-scrolling`。该属性有多个您可以使用的值：\n\n• `-webkit-overflow-scrolling`:\
  \ `auto` 应用滚动效果，但不应用回弹效果。\n• `-webkit-overflow-scrolling`: `touch` 应用滚动效果，并在用户到达页面阈值时产生弹性回。\n\
  \n强烈建议您使用 `touch` 选项滚动，以让您的 Web 应用获得最原生的视觉和操作体验。在使用过渡动画时，应用 `translate3D` 属性非常重要，这样滚动不会出现跳跃感。由于这是\
  \ CSS3 函数，当通过 `CSS3\\.` 激活 GPU 时，它的效果更好。在 Google Chrome 中，您甚至开启开启选项来突出显示使用 GPU 加速的元素。这对于调试非常有用。要实现这一点，请按照以下步骤操作：\n\
  \n1. 打开 Google Chrome，在地址栏中输入 `about:flags`。\n2. 搜索 `GPU Accelerated Compositing`，然后点击\
  \ `Enable` 链接。\n3. 接下来，搜索 `GPU Accelerated Canvas 2D` 并点击 `Enable` 链接。\n4. 重启网页浏览器。\n\
  \n这种方法的缺点是运行 iOS4 及以下版本的旧版 iPhone 设备无法使用这种特定方法。这很难检测，因为你需要编写自定义的 JavaScript 函数来解析操作系统版本号。然而，一旦您能够检测到版本号并确定其低于\
  \ 5，您可以使用第三方解决方案，在没有此特定 CSS 函数的情况下模拟原生滚动的体验。\n\n一种第三方解决方案被称为 `iScroll` ([`cubiq.org/iscroll-4``](http://cubiq.org/iscroll-4))。它可以很容易设置。最棒的部分是它不依赖于任何\
  \ JavaScript 语言；因此无论您的技术栈是什么，它都可以轻松为您的项目即插即用。您需要做的是在滚动区域（主内容）之外创建一个名为 `wrapper`\
  \ 的额外 `<div>` 元素。设置看起来如下：\n\n```html\n<div id=”wrapper\">\n  <div id=”scroller\"\
  >\n    ...\n  </div>\n</div>\n```\n\n现在，在您的 `<head>` 部分中添加以下代码，确保您引用了正确的 `iscroll.js`\
  \ 文件加载路径：\n\n```html\n<script src=”iscroll.js\"/></script>\n<script>\nfunction loaded()\
  \ {\n  myScroll = new iScroll(‘wrapper’);\n}\ndocument.addEventListener(‘DOMContentLoaded’,\
  \ loaded, false);\n</script>\n```\n\n前面的脚本加载了 `iScroll` 的 JavaScript 类，以便设置整个文档使用的全局变量。一旦完成，您添加一个事件监听器来检测\
  \ DOM 是否已完全加载。加载后，它会调用新函数创建 `iScroll` 类的实例并将其应用于 `wrapper` 元素。从那里开始，`iScroll` 完成其余工作并自动计算内部内容高度，从而使滚动区域合适。这种解决方案并不完美，但它确实为您提供了支持广泛操作系统的机会。\n\
  \n# 允许您的应用程序适应方向变化\n\n如今大多数手机和平板电脑的妙之处在于，持有它们没有错误的方法。现代应用会根据设备方向自动调整尺寸和宽度。iOS 负责移动实际浏览器；但是，您的代码需要适应设备的方向。您可以通过几种方式实现这一点，通过使用\
  \ JavaScript 或称为媒体查询的 CSS 函数。\n\n## 使用媒体查询\n\n媒体查询或 CSS 元素可以根据设备内的任意数量元素应用。媒体查询的一个常见用例是让一套代码库既作为您的完整桌面浏览器运行，又作为移动设备的代码库运行。其工作原理是它在渲染\
  \ CSS 时读取屏幕分辨率。媒体查询带有条件语句作为前缀，该语句根据实际设备的屏幕尺寸定义某些元素及其大小。媒体查询可以在 CSS 级别上标记，也可以在 CSS\
  \ 文件初始化时标记。这是一个使用媒体查询根据显示文档设备的设备或方向设置宽度的示例：\n\n```css\n@media screen and (max-device-width:\
  \ 480px) and (orientation:landscape) {\n  .page { width: 350px; }\n}\n.page { width:\
  \ 500px; }\n```\n\n在之前的代码段中，所有媒体查询都带有 `@` 符号前缀。您可以设置最大设备宽度、方向或其他定义条件的元素。在这个示例中，当查看的设备最大宽度为\
  \ 480 像素且方向为横屏（landscape）时，您将页面类的 `body` 元素的宽度设置为 350 像素。此 CSS 仅在满足此条件时渲染；否则，页面按正常的\
  \ 500 像素宽度渲染。\n\n这是使用媒体查询操作的一个基本示例。然而，目标是拥有一套代码库既为您的主网站服务，同时也作为您的移动网站。媒体查询帮助您弥补差距并管理一套代码库。许多网站都使用媒体查询向其客户提供内容。发现您喜爱的网站是否使用媒体查询的一种简单方法是在移动设备上访问这些网站，并检查地址栏是否更改了\
  \ URL。通常，大多数移动网站会将 URL 结构改为 `domainname.com` 或 `domain.com/mobile`。\n\n## 使用 JavaScript\
  \ 实现方向变化\n\n可以通过 JavaScript 检测方向变化。jQuery Mobile 提供了一个内置于 Corks 的函数。如图 15 和 16 所示，将设备旋转到横屏位置根据屏幕扩展内部内容。\n\
  \n如果网站不跟踪方向，网页的渲染方式会有不同。图 17 显示了一个未考虑方向的示例。图 18 显示了右侧未根据屏幕变化调整的空白。使用此简单的脚本（第 1 章讨论过）来检测设备方向是否发生了变化。您可以将其放置在\
  \ `index.html` 文档底部的 `script` 标签中，然而在 Corks 中，jQuery Mobile 会自动处理这些：\n\n```javascript\n\
  <script type=”text/javascript” language=”Javascript”\nvar supportsOrientationChange\
  \ = “onorientationchange” in window,\norientationEvent = supportsOrientationChange\
  \ ? “orientationchange” :\n“resize”;\nwindow.addEventListener(orientationEvent,\
  \ function() {\n  alert(‘我们刚刚检测到屏幕分辨率变化！’);\n}, false);\n</script>\n```\n\n在检测到方向变化后，常见的做法是将\
  \ `body` 类更改另一个表示更宽宽度的 CSS 类。以下是执行此操作的代码示例：\n\n```html\n<body class=”wide\">\n \
  \ ...\n</body>\n```\n\n因此在编写 CSS 时，为每种类类型添加一些额外的语句，例如：\n\n```css\nbody.wide {\n\
  ```\n\n\n\n\n\n```css\nwidth: 600px;\n}\n\nbody {\n  width: 320px;\n}\n```\n\n##\
  \ 总结\n\n本章涵盖了广泛的内容，帮助你理解 HTML 结构以及组成示例应用 Corks 的 JavaScript 元素。此外，我们还涵盖了：\n\n• Touch\
  \ 事件与 `onClick` 事件\n• 媒体查询\n• 方向检测\n• 硬件加速\n• CSS3 过渡\n\n# 第 6 章：创建移动 Web 数据库\n\n\
  HTML5 数据库允许网站开发者在浏览器的应用程序缓存中存储丰富的内容，以便快速访问。随着 `Web SQL`、`IndexDB`、`LocalStorage`\
  \ 等其他数据库的引入，你可以在关闭浏览器后存储内容以备重用。对于小型任务，这是存储信息的一种极方法，无需使用 `MySQL` 等后端数据库。\n\n此外，我们还讨论了名为\
  \ `Web SQL` 的 HTML5 数据库。你将设置结构并学习如何处理和返回数据库查询。你将使用它来生成分页查询，并通过“管理（Manage）”标签页向数据库中插入葡萄酒。需要注意的是，Firefox\
  \ 不支持 Web SQL，它支持另一种名为 `IndexDB` 的非关系数据库。与 Web SQL 不同，`IndexDB` 是基于对象的，不是关系性的（没有模式）。它的支持有限，因此我们没有在书中讨论\
  \ IndexDB。由于 Firefox Mobile 的市场份额很小，这就是为什么书中没有提到它。\n\n在本章中，你将继续开发示例应用 Corks。在本章结束时，你应该能够：\n\
  \n• 理解如何实现和使用 Web SQL\n• 讨论将为 Corks 使用的 Web SQL 模式\n• 使用 Web SQL 构建 Corks 需要的初始表\n\
  \n## 要构建的元素\n\n你使用 jQuery Mobile 框架设置了页面结构，因此你只需要为每个页面构建驱动应用程序的内容。只要你遵循之前几个章节中讨论的标准，添加页面将是轻而易举。需要注意的是，第一个\
  \ `<div date-role=’page’>` 元素将是应用程序的默认起点，因此你总是希望它是活动动态（activity feed）。我们将构建并解释以下内容：\n\
  \n• HTML5 数据库样式和策略\n• 用于 Web SQL 的 HTML5 数据库\n• 使用事务创建数据库\n\n## HTML5 中的数据库\n\n\
  HTML5 允许你访问 Web 浏览器中永久和临时存储的数据，用于缓存内容、查询等。这种存储是持久的，当浏览器关闭或关闭时它仍然存在。表 6-1 对比了三种不同类型的数据库，以便你选择最符合你需求的一个：\n\
  \n### 表 6-1 数据库类型\n\n| 数据库类型 | 样式 | 良好用例 |\n| :--- | :--- | :--- |\n| `LocalStorage`\
  \ | 键值对数据库 | 适用于存储格式为 `X = Y` 的简单设置。例如，你可以将 `is_logged_in` 存储为 `yes`。 |\n| `Web\
  \ SQL` | 关系型 | 适用于有多个存储存储不同类型信息的应用程序。Web SQL 需要模式（schema）；在使用它之前，你需要定义整个结构。 |\n\
  | `IndexDB` | 面对象 | `IndexDB` 是基于对象数据库的新型数据库语言。然而，它目前仅在 Firefox 上支持。 |\n\n对于此项目，你将同时使用\
  \ `LocalStorage` 和 `Web SQL`，这在许多 Web 应用中很常见。通过 `LocalStorage`，你可以快速保存可能不需要使用 `WebSQL`\
  \ 表格式存储的设置和配置。记住，对于所有 HTML5 应用，最大尺寸被设置为 5MB。然而，当初始化 Web SQL 数据库时可以请求更大的容量。需要注意的是，这种请求在所有浏览器中并不是标准。在初始化期间请求正确的数据库大小以获得最佳性能。\n\
  \nWeb SQL 数据库仅与 Chrome、Opera、IE8、Safari 以及所有 WebKit 移动浏览器兼容。它们目前在 Firefox 或 Firefox\
  \ Mobile 中无法工作。\n\n一些 Web 开发者可能会疑惑，为什么有人想使用本地数据库而不是像 `MongoDB` 或 `MySQL` 这样强大的数据库服务器。虽然这些服务器数据库功能强大并提供自定义选项，但有时\
  \ Web SQL 可以更轻松地提供这些属性。以下是 Web SQL 的三个主要优势：\n\n• **无服务器**：Web SQL 不需要昂贵的托管服务器，也不需要你学习如何管理服务器。\n\
  • **零配置**：Web SQL 的设置极其简单。开始使用 Web SQL 不需要配置；它可以开箱即用。这对于新开发者和资深开发者都有帮助。JavaScript\
  \ API 也比其他后端的等效工具更容易处理。\n• **自包含其的**：Web SQL 不需要其他框架即可运行；它在现代浏览器上运行，没有任何外部依赖项。\n\
  \n尽管 Web SQL 提供了简单性，但在选择数据库之前，最好先查看你的应用程序以及你正尝试做什么。对于需要数据跨多个设备公开访问的应用程序，`SQLite`\
  \ 将无法工作，因为它是设备本地的。结合使用 Web SQL 和数据库服务器来提供缓存并减少数据库服务器的负载。\n\n## 创建 Web SQL 数据库\n\n\
  虽然没有 HTML5 SQL 的官方方言，但 Web SQL 被用作学习和结构化目的的标准。它提供了基本的 SQL 语言和查询数据库的能力。SQLite 数据库的结构是关系的，这意味着在插入任何数据之前，你需要构建数据库模式。在开始创建模式之前，你需要初始化数据库。使用\
  \ SQL，一行代码即可启动你的数据库：\n\n```javascript\nvar tx = window.openDatabase( DatabaseName,\
  \ DatabaseVersion, DisplayName, EstimatedSize )\n```\n\n表 6-2 详细分解并定义了变量：\n\n###\
  \ 表 6-2 Web SQL HTML5 创建变量\n\n| 变量名 | 是否强制 | 描述 |\n| :--- | :--- | :--- |\n| `DatabaseName`\
  \ | 是 | 你应用程序使用的标准数据库名称。当你开始构建查询时需要引用它，这一点很重要。 |\n| `DatabaseVersion` | 是 | 你当前数据库的版本号，字符串格式，例如\
  \ 1.0。HTML5 数据库允许你在本地设备上有多个版本的数据库。对于我们的演示，你使用 1.0。 |\n| `DisplayName` | 否 | 数据库描述的字符串格式。这不是强制字段，但如果你有很多本地数据库并需要记住哪个数据库存储什么信息，它是用的。\
  \ |\n| `EstimatedSize` | 是 | 这是初始化数据库最重要的信息之一。该值使用字节格式设置数据库大小：`50 * 1024 * 1024`。不提示用户的情况下最大尺寸为\
  \ 5MB。在本示例中，为 100MB。 |\n| `CallBack` | 否 | 在数据库完成后调用的函数。通常，你会将所有的 `CREATE TABLE`\
  \ 语法放在此函数中，这样一旦打开表，就开始创建表。 |\n\n\n\n\n要执行 SQL 命令，你需要使用 `db.transaction` 方法来封装你的逻辑。请注意，使用\
  \ `transaction` 命令会锁定数据库，这意味着在事务完成之前，任何其他查询都无法运行。仅在执行写操作（如 `CREATE TABLE`、`INSERT`、`UPDATE`\
  \ 等）时使用它：\n\n```javascript\ndb.transaction(function(tx) {\n  //....\n});\n```\n\n\
  要创建一个只读事务，请使用以下代码：\n\n```javascript\ndb.readTransaction(function(tx) {\n  //....\n\
  });\n```\n\n`readTransaction` 方法允许你的数据库保持解锁状态，以便你可以同时运行多个事务。\n\n上述语句是在调用添加新数据库时创建的\
  \ `db` 变量。之后，你就可以调用 `transaction` 方法。`tx` 变量持有完成事务所需的方法，例如在代码所示的 `executeSql`：\n\
  \n```javascript\ndb.transaction(function(tx) {\n  .executeSql(QUERY, parameters,\
  \ successResponse, errorResponse);\n});\n```\n\n在此代码段中，对事务调用了 `executeSQL` 命令。该方法可以传递四个变量：\n\
  \n*   `QUERY`：这是你将编写的标准查询语句，例如 `SELECT * from wines` 或 `INSERT into wines` 等。\n\
  *   `parameters`：如果你对数据应用了任何过滤器，则将其放在这里。例如，如果你的查询是 `SELECT * from wines where wine_abv\
  \ > ?`，则参数将为 `[6]`。我们将在书稍后的部分讨论这一点，并讨论如何为 Activity 页面创建 `select` 语句。\n*   `successResponse`：当\
  \ SQL 语句执行成功时会调用此函数。该函数启用两个变量，分别代表事务（第一个变量）和结果集（第二个变量）。这不适用于插入、更新、删除或创建表。\n*   `errorResponse`：当\
  \ SQL 语句失败时会调用此函数。该函数接收两个变量，代表事务（第一个变量）和错误（第二个变量）。\n\n因此，要查询表并返回结果，你需要编写如下函数：\n\n\
  ```javascript\nvar status_id = 5;\ndb.transaction(function(tx) {\n  tx.executeSql(\n\
  \    'SELECT * from MyTable WHERE StatusID = ?',\n    [status_id],\n    function\
  \ (tx, resultSet) { displayResults(resultSet); },\n    function (tx, errorMessage)\
  \ { displayError(errorMessage); }\n  );\n});\n```\n\n此代码允许用户从 `MyTable` 中选择所有匹配\
  \ `statusID` 为 `5` 的字段。如果成功，它将调用 `displayResults` 函数并传递结果集。重要的是，事务是实时发生的，因此你可以在成功回调函数中将它们组合在一起，也可以单独为它们编写代码。如果你将它们成组编写（通过成功回调函数）并且其中一个执行失败，则所有之前的查询都将回滚到原始数据。这变得非常重要。根据你的结构，如果你需要插入数据然后再次选择以进行解析，你可能希望考虑单独执行此函数，因为如果\
  \ `SELECT` 查询失败，你的插入操作将将会回滚。\n\n由于大部分代码是在客户端生成的，Safari 提供了了一些非常棒的工具，可以以图形化的方式查看生成的数据。要查看此用例，请执行以下步骤：\n\
  \n1.  在 PC 或 Mac 的 Safari 中访问 `http://html5demos.com/database`。\n\n当推文加载时，你应该能看到消息“20\
  \ new tweets loaded”（如图 6-1 所示，以绿色显示）。\n\n![9781118348161-fg0601.eps](img/9781118348161-fg0601_fmt.png)\n\
  图 6-1：HTML5 demos 网站加载推文\n\n2.  如果你的网站上没有“开发”选项卡，请打开 Safari 选项。在“高级”选项卡中，选择“在菜单栏显示开发菜单”。\n\
  \n3.  打开“开发”菜单后，选择“显示错误控制台”。在 Mac 上，你会得到类似图 6-2 所示的屏幕。\n\n4.  点击“资源”打开数据库页面，在其中你可以点击查看查看在\
  \ `http://html5demos.com/database` 收集的所有推文数据的表和元数据。（见图 6-3。）\n\n![9781118348161-fg0602.eps](img/9781118348161-fg0602_fmt.png)\n\
