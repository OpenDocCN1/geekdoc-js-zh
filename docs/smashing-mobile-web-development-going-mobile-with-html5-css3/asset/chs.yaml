  \n为了让你在“添加葡萄酒”过程中重新填充下拉列表的值，你需要在应用程序首次启动时为颜色名称添加值。\n\n要实现此操作，请按照以下步骤进行：\n\n1. 在创建表之后，创建另一个事务来测试颜色表中是否有任何值。在\
  \ `CREATE TABLE` 事务之后添加以下代码：\n\n```javascript\ndb.transaction(function (tx) {\n\
  \  tx.executeSql：“SELECT * from color where color_name = ?”, [‘Red’],\n  function(tx,\
  \ res) {\n    if (res.rows.length == 0) {\n      var start = new Date().getTime();\n\
  \      tx.executeSql：“INSERT INTO color (color_name, created_at) VALUES(‘White’,\
  \ ?)”, [start], null, fR);\n      tx.executeSql：“INSERT INTO color (color_name,\
  \ created_at) VALUES(‘Red’, ?)”, [start], null, fR);\n      tx.executeSql：“INSERT\
  \ INTO color (color_name, created_at) VALUES(‘Other’, ?)”, [start], null, fR);\n\
  \    }\n    else {\n      // 表已经有值了 - 所以保持原样。\n    }\n  },\n  fR);\n});\n```\n\n\
  此脚本查询颜色表以检查数据库中是否存在值。如果没有行（`res.rows.length` 变量为 `0`），你可以使用 `d` 作为指示当前时间的变量将新数据插入数据库。相反，如果表中已经有行，则保持原样。\n\
