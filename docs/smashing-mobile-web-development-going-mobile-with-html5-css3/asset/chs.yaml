  \ `drawMap` 函数，同时考虑到你已经将纬经存储在变量中。缓存位置可以使用更少的电量，并提供更快的响应时间。\n\n因为你现在正在缓存位置，现在是时候将场所对象存储在你的本地存储对象中了，以获得极速的结果。首先，你需要更改\
  \ `findPlaces` 函数的工作方式。\n\n这是旧函数：\n\n```javascript\nfunction findPlaces() {\n  $.getJSON(\"\
  https://api.foursquare.com/v2/venues/search?client_id=YOURCLIENTID &client_secret=YOURSECRET&ll=\"\
  +lat+\",\"+lng+”&query=wine store&limit=25\", function(data) {\n    ...\n  })\n\
  }\n```\n\n将其更改为如下：\n\n```javascript\nfunction findPlaces() {\n  var venue_data =\
  \ myStorage.get(\"foursquareVenues\")\n  var lastTime = myStorage.get(\"lastVenuePull\"\
  )\n  if (lastTime) {\n    var currentTime = new Date.getTime();\n    var subtract\
  \ = parseInt(currentTime) - parseInt(lastTime);\n    if (parseInt(subtract) >= 250)\
  \ {\n      $.getJSON(\"https://api.foursquare.com/v2/venues/search?client_id=CLIENTID\
  \ &client_secret=CLIENTSECRET&ll=\"+lat+\",\"+lng+”&query=wine store&limit=25\"\
  , function(data) {\n        parseMap(data, \"store\");\n      });\n    }\n    else\
