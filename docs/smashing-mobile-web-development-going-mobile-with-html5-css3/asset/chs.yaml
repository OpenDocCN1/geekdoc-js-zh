  \n## 总结\n\n畅击移动 Web 开发\n使用 HTML5、CSS3 和 JavaScript 走向移动端\n\nGreg Avola 和 Jon Raasch\n\
  \n![UK_Simply%20wiley_logo.eps](img/UK_Simply%20wiley_logo_fmt.png)\n\n关于作者\nGreg\
  \ Avola 是社交初创公司 Untappd 的联合创始人兼 CTO，该公司帮助用户跟踪、推荐和发现新的啤酒和酒厂。Untappd 移动应用程序是使用书中讨论的\
  \ HTML5/JS 技术构建的。\n\nJon Raasch 是一位前端开发者和设计师，从事 Web 编程已超过 15 年。他利用现代编程技术设计动态且引人胜胜的用户界面。通过整合设计、开发和品牌建设，他使网站对\
  \ Googlebot 同样易于访问。\n\n## 第一部分：HTML5/JS/CSS 简介\n\n### 第 1 章：移动 Web 开发简介\n\n### 第\
  \ 2 章：移动技术概述\n\n### 第 1 章：移动 Web 开发简介\n\n大约 10 年前，很少有人拥有手机手机，即使有，手机也没有移动网络浏览器。快进到\
  \ 2012 年：现在全球约 30% 的人口拥有某种能够让他们浏览互联网、聊天或发送短信的移动设备。数百万人依赖他们的手机，不仅将其作为交谈的设备，还为了在旅途中搜索、发现和学习新事物。\n\
  \n随着智能手机总人口的上升，企业应该意识到这一触达新客户的机会。智能手机曾被视为奢侈设备，现在在大多数移动网络上以合理的价格即可获得。在某些地区（如美国），人们使用手机作为主电话线，而不是曾经常见的固定电话。\n\
  \n\n\n\n本章讨论了关于你的移动 Web 应用程序设备和设计模式的相关背景信息。在开始阶段理解这些概念非常重要，这样你就不需要回溯并重新开发你的应用程序，以符合每个操作系统的设计标准。\n\
  \n你还将学习一些处理移动 Web 应用程序中设备方向、视口（viewports）和自定义字体的新技术。理解这些主题对于为用户创造极体验至关重要。此外，本章还探索了其他流行的移动应用程序，为你的移动\
  \ Web 应用程序提供最佳实践和灵感指导。\n\n大多数人通常认为构建移动网站非常困难。事实上，移动网络浏览器具有许多大多数人并不知道的工具和功能。读完这本书后，你将理解移动\
  \ Web 开发背后的概念，并能够使用最新技术轻松地设计和开发自己的 Web 应用。\n\n## 移动 Web 示例\n\n你可以从大量的移动网站中学习并获取灵感。有时甚至很难看出移动\
  \ Web 应用与原生应用程序之间的区别。以下示例展示了你可以通过移动 Web 实现的功能。\n\n*   **Facebook**: Facebook 的用户界面\
  \ (`UI`) 在过去的六到八个月里发生了很大变化，但其开发者致力于无论使用什么设备，都提供最佳的用户体验。通过结合 `CSS` 和 `HTML5` 元素，Facebook\
  \ 开发者能够让他们的原生 iPhone 应用看起来与他们的 Web 应用相似。Facebook 使用 `HTML5` 中的 `geolocation` 元素获取你的位置，并帮助你签到你喜喜欢的地方。为了帮助网站加载更快，用户在浏览器\
  \ `HTML5` 上使用缓存。我在书的后部分会提到这些功能，并解释了如何在自己的应用程序中使用它们。Facebook Web 应用与原生应用之间的差异非常细微，以至于许多用户无法分辨。当这种情况发生时，你就知道你的工作做得很好了。\n\
  *   **Twitter**: 自 2008 年发布以来，Twitter 的 UI 也发生了显著变化。事实上，当该服务首次发布时，还没有官方的移动应用程序可以使用该服务。开发者使用\
  \ Twitter 的应用程序编程接口 (`API`) 开发了第一批在市场上流行的 Twitter 应用程序。在意识到在桌面端和移动设备上分享 140 个字符都很重要后，Twitter\
  \ 改变了策略，开始开发移动应用和网站以增加增长。结果是一个全新的移动网站，模仿了在桌面电脑上浏览 Twitter 的体验。Twitter 使用了离线访问等 `HTML5`\
  \ 特性，让你在没有连接互联网时也能查看推文。他们还使用 `CSS3` 过渡来简化页面之间的导航。此外，就像 Facebook 一样，Twitter 允许你在发推文时标记位置，从而使用了\
  \ `HTML5 geolocation` 特性。由于 Twitter 在首次发布时并不是移动应用，它必须与许多（可能是通过第三方）原生移动应用竞争。这使得 Twitter\
  \ 收购了许多公司来帮助构建他们目前的平台。\n*   **Foursquare**: 在其原生 iPhone 应用中已经有了一款旗舰产品的情况下，Foursquare\
  \ 决定制作一个简单的 Web 应用，帮助人们寻找他们去过的地方的信息。Foursquare 使用 `HTML5 geolocation` 和输入类型，使用户可以通过点击描述中列出的电话号码自动拨打场所。\n\
  *   **Financial Times (金融时报)**: 当金融时报决定在 iTunes 之外收取订阅费时，它最初是 App Store 中的一个原生应用。因为这不符合\
  \ iTunes 的服务条款，它必须从 App Store 中移除。与其尝试与 iTunes 合作，《金融时报》决定制作自己的 `HTML5` Web 应用，该应用可以在每个平台上运行。不需要为每种手机开发一个不同的平台。《金融时报》应用通过使用\
  \ `HTML5 local storage` 推伸了 Web 应用的边界，允许他们在后台存储和缓存内容。它还整合了离线元素，使用户在没有连接互联网时浏览 Web\
  \ 应用。\n*   **Yelp**: 与 foursquare 类似，Yelp 提供了一个移动网站，允许用户快速访问喜爱的地方，并获取餐厅的评分、路线和更多信息。Yelp\
  \ 也使用了 `geolocation`，包括 `Google maps`，来查看附近的场所。它还使用触摸事件在选择行时高亮显示行，这与原生体验相似。\n* \
  \  **Untappd**: 好了。我有点偏见，因为我创建了 Untappd。尽管如此，我认为这是该平台对移动技术的极佳利用。与其他应用程序不同，Untappd\
  \ 是以移动优先的方式开发的。这让我们能够看到在平台上可以做什么和不能做什么。它还让我们从第一天起就能触及多个设备。这帮助我们通过收集多个设备上多个用户的反馈，增长了平台和服务。Untappd\
  \ 使用了 `local storage geolocation` 以及其他 `HTML5/CSS3` 技术，试图模糊原生与 Web 之间的界限。\n\n##\
  \ 理解原生与 Web 平台\n\n许多人并不理解原生应用与 Web 应用之间的区别。主要区别在于，原生应用是从 App Store 下载的，并且使用的语言与\
  \ Web 应用程序不同。每个设备都有自己用于驱动手机的专有语言。例如，在 iPhone 上，首选语言是 `Objective-C`；在 Android 设备上，你通过\
  \ `Java` 编程。这是原生应用的缺端之一，因为它要求你聘佣开发者来构建两个不同的应用程序。这可能非常昂贵。一个常见的误区是 Web 应用看起来完全不像原生世界中的对应物；然而，通过现代技术（包括\
  \ `HTML5`、`CSS` 和 `JavaScript`），你有能力和工具让你的应用程序看起来和感觉像原生的一样。\n\n### 原生与 Web 平台的优缺点\n\
  \n表 1-1 列出了与 Web 或原生平台相关的许多优先级。\n\n表 1-1 原生平台的优缺点\n\n| 优点 | 缺点 |\n| :--- | :---\
  \ |\n| 通过 App Store 曝光和可访问性 | 开发、升级和支持成本高 |\n| 访问原生功能（如摄像头、联系人和网络状况） | 代码只能部署到一个平台\
  \ |\n| 变现和收入 | 依赖 App Store 的限制和提交 |\n\n在选择原生应用和 Web 应用之间做出选择，重要的是确定你的应用程序策略。如果你愿意作为服务向用户对应用程序收费，原生平台可能是可行的。有很多方法可以绕过这一点，包括订阅费；但是，基础应用程序始终在\
  \ Web 上免费提供。\n\n\n\n\n从缺点来说，为原生平台开发应用程序的构建和维护成本非常高。一个常见的误区是，一旦应用构建完成，就不需要再为它投入资金了。这是错误的，因为你必须不断更新你的应用程序，这需要留用开发人员。原生应用的另一个负面方面是它对\
  \ App Store 或市场的依赖。当你将你的应用提交到商店或市场时，你必须遵守公司决定对应用程序实施的所有限制。这意味着雇主应用可以在任何时候阻止你赚取利润，并阻止人们下载你的应用程序。此外，大多数\
  \ App Store 只分给你应用销售额的一部分。例如，Apple App Store 和 Google Play 都会抽取销售额的 `10` 百比，剩下的归开发者。虽然这看起来可能很小，但随着时间的推移，这个比例可能会迅速增长。\n\
  \n表 1-2 列出了使用 Web 平台开发应用时相关的优缺点。\n\n### 表 1-2 移动网页平台的优缺点\n\n| 优点 | 缺点 |\n| :---\
  \ | :--- |\n| 廉价、快速且易于构建。 | 在移动浏览器中运行密集型网页时，性能往往是一个问题。 |\n| 可以使用相同的代码库部署到多个平台/设备上。\
  \ | 在移动设备上进行调试和测试变得困难。 |\n| 易于维护。 | 由于没有 App Store，很难变现。 |\n| 通过第三方解决方案（如 PhoneGap）访问原生功能。\
  \ | 即使使用 PhoneGap，并不是所有的原生功能都可用。 |\n\n为 Web 开发应用程序是非常有回报的。利用 `HTML5`、`CSS3` 和 `JavaScript`\
  \ 让你能够轻松地开发应用程序。由于这些是通用语言，应用程序的成本将会降低。此外，一个应用程序可以在多个平台上使用。这意味着你的 Web 应用可以在 iPhone、Android\
  \ 或 BlackBerry 设备上运行——且都共一个代码库。\n\n在 Web 平台上创建应用的一个缺点是在调试和测试领域。在桌面浏览器中测试你的 Web 应用可能导致快速修复\
  \ Bug；然而，在移动模拟器中进行测试可以对你的 Web 应用的性能提供更准确的评估。例如，在桌面网页浏览器中，性能与计算机的速度匹配；但在手机上，你的资源受到严格限制。像\
  \ `CSS3` 过渡效果（这是显示页面间跳转的极佳方式）需要大量的内存来处理。注意内存分配；你的 Web 应用程序可能会导致某些浏览器崩溃。虽然你在原生应用中也会遇到这种情况，但每个\
  \ Web 浏览器的表现似乎不同，而原生操作系统在不同设备上可能是一致的。例如，`Android 4.0.x` 和 `Android 4.1` 中的网页浏览器非常不同，需要不同级别的调试才能让你的内容正确显示。\n\
  \n此外，桌面网页浏览器上的点击（click）事件执行比移动设备上的触摸（tap）快得多。这是因为移动浏览器有时会等待，看你实际上是在点击按钮，还是在屏幕上上下滑动手指。这会导致你在点击移动\
  \ Web 应用上的链接、按钮和其他属性时产生细微的延迟。幸运的是，有通通方法来解决这个问题（我会在本书稍后的部分讨论它们）。还有其他让你的 Web 应用感觉起来更像原生的技巧，包括\
  \ iOS 和 Android 上的主屏幕模式和全应用模式。这些允许你的 Web 应用程序在没有浏览器窗口边框的情况下运行。\n\n## Web 转原生解决方案\n\
  \n某些第三方解决方案允许你将 Web 应用程序带来原生平台。这让你能够访问在使用 Web 浏览器时无法获取的原功能。相机是无法通过 Web 访问的最常见功能。Mobile\
  \ Safari 用户被不允许向 Web 浏览器上传文件；然而，这种限制在其他平台上被取消了。这种不一致性在开发应用程序时会导致问题。需要注意的是，你可以在 Android\
  \ 上使用文件输入类型向文件系统上传文件，但它无法从相机捕捉当前照片。\n\n最流行的第三方解决方案之一被称为 `PhoneGap`。这是唯一支持七个平台的开源移动框架：iOS、Android、BlackBerry、webOS、Windows\
  \ Phone 7、Symbian 和 Bada。`PhoneGap` 将其 API 支持拆分为 `10` 个不同的原生 API。这允许用户轻松地连接到操作系统，并访问相机、网络、通知、存储、文件等更多内容。文档直观、易于使用，并可以帮助你将\
  \ Web 应用程序迁移到原生平台。\n\n许多应用程序使用 `PhoneGap`向消费者交付原生平台应用。一个例子是 `Untappd`——它将自己的 Web\
  \ 应用程序转换为一个精简的新应用，允许用户拍摄他们的啤酒照片并在签到（check in）时将其包含进去。`Untappd` 能够在几个月内将其应用移植到 Android\
  \ 和 iOS。该应用的反响如此巨大，发布原生应用那个月的注册人数是常态的 `10` 倍。通过 `PhoneGap`，你可以将代码部署到 `10` 个不同的平台。然而，并不是每个功能在每个平台上都是一致的。`PhoneGap`\
  \ 有一个很好的图表解释了每个平台的所有功能（[`http://phonegap.com/about/feature`](http://phonegap.com/about/feature)）。需要注意的是，虽然你可以使用相同的代码部署到\
  \ `10` 个不同的平台，但将这些应用部署到商店可能需要额外的软件和步骤。`PhoneGap` 尝试通过提供 `PhoneGap Build` 来解决这个问题，它允许你将应用程序代码发送到\
  \ `PhoneGap Build`，然后它为你提供适用于商店的应用文件。你可以在 [`build.com`](http://build.com) 了解更多关于\
  \ `PhoneGap build` 的信息。\n\n其他解决方案提供了与 `PhoneGap` 相同的体验，但根据我们的经验，`PhoneGap` 的文档对任何人来说都是最好的。很快，如果你只是用\
  \ `HTML5`、`JS` 和 `CSS3` 写代码，人们就会称你为 Android 开发者。\n\n## 设备和操作系统\n\n开发移动应用时，每个开发者都必须理解需要支持的设备数量。在原生平台上，你可以根据运行的操作系统来限制设备。但在移动应用上，你并没有这种奢侈。你可以检测用户使用的浏览器类型；但你仍然不知道他们运行的是哪种设备。这就是为什么理解不同设备和操作系统非常重要。这些知识会让你的开发工作变得轻松得多。\n\
  \n- **iOS**: `iOS` 平台是苹果的一种操作系统。截至目前，最新版本是 `5.0.1`。`iOS` 运行在 iPod touch、iPhone 和\
  \ iPad 上。`iOS` 平台的优点之一是它只有两种屏幕分辨率。所有 `iOS` 设备都预装了 `Mobile Safari`，这是一个 `WebKit`\
  \ 浏览器。在 `Mobile Safari` 中，任何文件上传控件都被禁用，防止用户在网站上上传任何文件。在版本 `5` 之前，开发者无法使用溢出滚动元素，这些元素通常用于创建固定的顶部底部导航栏。通过最近的发布，Web\
  \ 应用通过这种新的 CSS 元素变得更加原生了。\n\n\n\n\n\n## 移动平台\n\n- **Android**: Android 平台适用于各种手机，并由\
  \ Google 版所有。它是一个开源操作系统，这意味着许多手机设计师和开发者可以采用它并根据自己的需求进行定制。其中一个典型的例子是亚马逊 Fire，它运行着定制的\
  \ Android 版本，代号为“Gingerbread”（姜饼），版本为 `2.3`。在写本书时，最新的发布版本代号为“Ice Cream Sandwich”（冰淇明治），版本为\
  \ `4.0`。所有 Android 设备都带有标准的 WebKit 浏览器。在 `1.5` 版本中，开发者可以使用 `overflow-scroll` 元素来保持静态页眉和页脚。从负面来看，运行在该平台上的设备有多种。由于存在大、不同的屏幕分辨率、虚拟和物理键盘以及原生的返回键，为\
  \ Android 平台进行设计和开发可能是一项艰巨的任务。幸运的是，Android 模拟器允许你以多种屏幕尺寸和各种操作系统版本查看你的应用。模拟器提供了一种查看应用在手机上显示效果的极佳方式。截至\
  \ 2011 年第三季度，Android 占据了约 47% 的市场份额。同样重要的是，由于 Android 是一个开源平台，手机制造商会获取代码并创建自定义版本以适应他们的设备和服务供应商。这导致了更大的碎片化，可能会在同一手机上产生两种不同类型的操作系统。Google\
  \ 提供了三星 Galaxy，被开发者社区称为“原生 Android”（Vanilla Android），这意味着它没有被设备创建者进行任何修改。这种碎片化导致许多手机无法更新到最新版本。大多数\
  \ Android 设备仍在使用 `2.3.x` 版本，这比最新版本（Ice Cream Sandwich）`4.0.x` 后了整整两个版本。\n\n- **BlackBerry（黑莓）**:\
  \ 黑莓通常被认为是第三受欢迎的智能手机。与 Android 类似，黑莓有许多不同屏幕尺寸的设备。许多黑色设备带有带有滚球的物理键盘。最近，该公司引入了带有虚拟键盘的触摸屏设备。从\
  \ BlackBerry OS6 开始，所有黑色设备都预装了 WebKit 浏览器，这使得在该平台上的开发工作变得简单得多。在此版本之前，所有黑色设备都配有非\
  \ WebKit 浏览器。尽管如此，如今大多数 Web 应用程序都不支持低于 BlackBerry OS6 的系统。\n\n- **WebOS**: WebOS\
  \ 是一个由 Palm 设计和开发的平台。Palm 在 2009 年被 HP 收购，致力于开发新手机以挑战 Android、iOS 和 BlackBerry。2011\
  \ 年，HP 决定提供 webOS 作为一个开源操作系统，希望它能成为手机制造商 Android 的替代品。webOS 最新版本是 `3.0.4`。从 WebOS\
  \ 2.0 开始，所有的 HTML5/CSS3 功能都包含在他们的 WebKit 浏览器中。\n\n- **Windows Phone（Windows 手机）**:\
  \ 2010 年，微软希望进入手机市场，并推出了基于其操作系统的全新手机，称为 Windows Phone。驱动手机的操作系统是 Windows CE。遗憾的是，这意味着手机内置的浏览器是\
  \ Internet Explorer 7，而当前的版本是 Internet Explorer 9。这让 Web 开发者在设计和开发非常艰难，因为缺乏对 HTML5\
  \ 和 CSS3 的支持。2011 年 2 月，微软宣布发布 Windows Phone 的下一个版本，代号为“Mango”（芒果）。这次更新具有重大意义，因为它允许开发者在浏览器中访问\
  \ HTML5 和 CSS3 功能。然而，尽管使用了最新的 Windows 版本，手机开发者仍然无法访问某些 CSS3 功能，包括渐变。在 2011 年第三季度，Nelson\
  \ 报告显示 Windows Phone 7 在美国的市场份额仅为 1.2%。\n\n列表中的设备并非唯一，但它们是最常见的。在为设备开发移动应用时，要决的关键因素是移动设备是否支持现代浏览器。如果没有这些，你就缺乏基础的\
  \ HTML5 和 CSS3 功能，这些功能会让你的应用脱颖而出。正如我们稍后讨论的，有许多方法可以确定用户的浏览器代理（agent），并在需要时将他们重定向到网站的低分辨率版本。\n\
  \n## 设计美学\n\n移动 Web 开发理论的前提是在多个平台上保持同一代码库。尽管如此，观察驱动设备间差异的不同设计美学仍然重要的。通过关注细节并设计你的应用使其在某个平台上看起来和用起来像原生应用，你可以为用户提供更好的更好的体验。\n\
  \n### 对话框\n\n在进行移动 Web 设计时，你需要考虑蜂窝网络的带宽限制。某些过程在桌面 Web 浏览器中可能不需要时间即可完成，但在移动设备上一切都不同。作为最佳实践，请始终在屏幕上显示某些操作的进度。可以通过加载符号或其他方法来实现。如果看不到这个加载框，用户如果不知道应用是否正在加载，可能会对你的应用感到沮丧。\n\
  \n### iOS 设计模式\n\n在 iOS 中，通常大多数应用程序有两个导航栏：顶部一个用于指示你当前所在的页面，底部也有一个导航栏，其中有指向不同页面的链接。在\
  \ iOS5 之前，当用户滚动之间的内部内容时，没有办法保持顶部和底部导航栏静态。现在，通过使用 CSS3 属性 `overflow-scroll: touch`，开发者可以在\
  \ Web 应用程序中创建类似原生的滚动效果。\n\n### Android 设计模式\n\n在 Android 设备上，通的设计模式是在屏幕顶部有一个操作栏（action\
  \ bar），紧下方是一个导航栏。Android 设备通常缺少像 iOS 那样的底部导航栏。这是因为大多数 Android 设备底部有原生按钮。\n\n###\
  \ 视口 (Viewports)\n\n通常在移动设备上的网页上，用户会进行缩放。在开发移动应用时，你使用一个名为 `viewport` 的 HTML 标签。这允许你设置最大或最小宽度，取决于屏幕分辨率。\n\
  \n ** **Width**:  Web 应用的像素宽度。默认值为 `980`。例如 `width=320`。\n- **Height**:  Web 应用的像素高度。例如\
  \ `height=320`。\n- **Maximum-scale**: 在 0 到 10 之间的浮点数，定义 Web 应用的最大缩比例。默认值为 `0.25`。例如\
  \ `maximum-scale=0.25`。\n- **Minimum-scale**: 在 0 到 10 之间的浮点数，定义 Web 应用的最小缩比例。默认值为\
  \ `1.6`。例如 `minimum-scale=1.6`。\n- **Initial-scale**: 在最小比例和最大比例之间的浮点数。例如 `initial-scale=1.0`。\n\
  - **User-saleable**: 一个布尔结果，定义用户是否能够缩放尺寸（例如通过双指缩放）。默认值为 `True`。例如 `user-saleable=False`。\n\
  \n重要的是，所有的宽度和高度设置都可以 `device-width` 定义，这使得 HTML5 能够适应设备的屏幕尺寸。以下是在移动 Web 应用中使用的 `viewport`\
  \ 标签示例。\n\n```html\n<meta name=\"viewport\"\ncontent=\"width=device-width; initial-scale=1.0;\
  \ maximum-scale=1.0; minimum-scale=1.0;\nuser-saleable=false;\"/>\n```\n\n\n\n\n\
  前面的代码将文档的宽度设置为设备的屏幕分辨率。这非常有用，因为用户可能会决定将应用程序加载到如平板电脑等设备上，这些设备具有高分辨率。缩放设置为 `1`，这意味着它将缩放至设备宽度。可视化缩放的一种良好方法是将其视为相对于宽度的倍数。（参见图\
  \ 1-1。）\n\n![97811348161-fg101.png](img/97811348161-fg101.png)\n\n图 1-1：如果你将初始缩放设置为\
  \ `2.0`，你的应用将放大两倍。`user-scale` 属性默认设置为 `True`。对于大多数 Web 应用程序，我们不希望用户能够双指缩放，这是因为大多数原生应用程序并不使用此属性；而且它们的界面会根据当前设备进行缩放。毕竟，如果你正确地设置了\
  \ `initial-scale`，用户就不需要对应用进行双指缩放了：所有内容都会缩放到屏幕宽度。需要注意的是，此视口（viewport）仅适用于初始页面加载，并且可以用户更改。一旦用户重新加载设备，它将返回到最后已知状态。\n\
  \n### 方向\n\n大多数移动设备提供了多种查看网页的方式。对于开发者来说，幸运的是，操作系统会根据手机处于水平模式还是竖屏模式来旋转网络浏览器。然而，处理这些事件并根据需要更改\
  \ CSS 是开发者的责任。\n\n```javascript\n<script type=\"text/javascript\" language=\"Javascript\"\
  >\nvar supportsOrientationChange = \"orientationchange\";\norientationEvent = supportsOrientationChange\
  \ ? \"orientationchange\" : \"resize\";\nwindow.addEventListener(orientationEvent,\
  \ function() {\nalert('just detected screen resolution!');\n}, false);\n</script>\n\
  ```\n\n这段代码为在跨移动浏览器中发生的特定事件添加了文档监听器。遗憾的是，这个事件并不是标准的，因此你需要检测你正在使用哪种事件。第一行 JavaScript\
  \ 允许你检测 ` `orientationchange` 事件在当前窗口中是否有效。如果浏览器支持此事件，则使用它；否则，事件名称将是 `orientationchange`\
  \ 或 `resize`。\n\n在确定了设备的事件名称后，设置事件监听器。只需知道浏览器会记录某些事件，以便 JavaScript 捕获并执行操作就足够。在这种情况下，当设备旋转时，浏览器会发出一个\
  \ JavaScript 会捕获的事件。每当此事件发生时，你都会显示一个指示方向已变化的 alert。在之前的示例中，你可以根据情况将此 alert 替换为更有用的内容。\n\
  \n### 字体\n\n在旧版浏览器中，字体作为操作系统的一部分预安装。目前，标准字体在不同的移动设备上有所不同。现代浏览器让开发者拥有广泛的工具，根据其 Web\
  \ 应用程序的设计显示不同的字体。这些工具使用 JavaScript 将 HTML 元素的内容替换为 CSS 控制的特殊属性，以显示自定义字体。例如，Google\
  \ Fonts API 提供了一种简单的方法，可以快速将默认字体更改为匹配你的风格和主题字体。Google Web Fonts 提供了广泛的字体选择。\n\n\
  ```html\n<<html>\n<head>\n  <link rel=\"stylesheet\" type=\"text/css\" href=\"http://fonts.googleapis.com/css?family=Tangerine\"\
  >\n  <style>\n    body {\n      font-family: 'Tangerine', serif;\n      font-size:\
  \ 48px;\n    }\n  </style>\n</head>\n<body>\n  <div>This is test of Google Fonts!</div>\n\
  </body>\n</html>\n```\n\n在这个示例中，从 Google 加载的 CSS 文件（带有识别你想要字体类型的查询字符串）被加载到 `HEAD`\
  \ 部分。在浏览器中打开该链接时，你将得到以下语法：\n\n```css\n@font-face {\n  font-family: 'Tangerine';\n\
  \  font-style: normal;\n  font-weight: normal;\n  src: local('Tangerine'),\n  url('http://themes.googleusercontent.com/static/fonts/tangerine/v3/HGfsyCL5WASpHOFnouG-RD8E0i7KZn-EPnyo3HZu7kw.woff')\
  \ format('woff');\n}\n```\n\nGoogle 使用了名为 `@font-face` 的 CSS3 属性，允许你的 HTML 文档包含用户机器或设备上未安装的特殊字体。一旦加载，特殊字体将在支持的浏览器上显示。对于移动设备，我建议将这些字体下载缓存到自己的网站中以最大化性能。需要注意的是，Google\
  \ Fonts API 兼容所有现代浏览器，包括 Internet Explorer 6 及更高版本。此外，iOS 仅支持 SVG 字体（Google Fonts\
  \ 支持这种）。然而，其他字体库可能不受支持。虽然 Google Fonts 简单且受支持，但你只能使用它们提供的字体，因此你无法使用在其他处购买或下载的自定义字体。\n\
  \n`@font-face` 的优质资源是 fontsquirrel 的 `@font-face` 生成工具 (`http://www.fontsquirrel.com/fontface/generator/`），它可以帮助你在\
  \ CSS 文件中生成 `@font-face` 的语法。\n\n## 总结\n\n在本章中，我们讨论了移动设备、平台以及与浏览器交互的不同方式的概述。此外，我们讨论了：\n\
  *   移动 Web 和原生平台\n*   原生与 Web 的优缺点\n*   自定义字体\n*   操作系统设计模式\n\n### 第 2 章：移动技术概述\n\
  \n在技术世界中，总有新事物在酝中。智能手机和移动浏览器的使用日益增加，提升体验的新技术每天都在发布。移动 Web 开发者的整个思维已经从为鼠标设计网站转变为为手指设计网站。\n\
  \n在本章中，你将学习所有关于此类开发的新技术。我涉及了 HTML5 功能，这些功能允许用户查找位置、检测网络访问、管理本地数据库以及访问会话和本地缓存。这些功能允许你为用户提供更好的功能和体验。\n\
  \n我还讨论了 CSS3 和新属性，这些属性允许移动 Web 应用通过框阴影、圆角、渐变和背景尺寸等属性看起来和用起来像原生应用。关于移动 Web 开发的一个常见误解是需要图形设计师来设计网站，但你可以通过新的\
  \ CSS3 元素来实现专业的设计。\n\n最后，你可以转向使用与移动浏览器良好配合的 JavaScript 框架，包括 `jQuery`、`Sencha Touch`、`XUI`\
  \ 等。章节还讨论了一些实用工具，如 `Modernizr`、`iScroll` 和 JavaScript 模板库，你都可以使用它们来帮助开发应用变得简单。\n\
  \n### HTML\n\n在 HTML5 之前，标准的 HTML 规范于 1999 年 12 月 24 日。版本为 4.01；但大多数人直接称之为 HTML。HTML5\
  \ 改变了整个网络浏览的格局。HTML5 为开发者带来了以前无法通过原生浏览器获得的新功能。例如，开发技术（如 `Flash`）允许你向消费者传递视频和交互式表单等内容。通过\
  \ HTML5，你可以使用特殊标签将视频引入你的网页，而不需要用户在设备上安装 Flash。这对于 iOS 移动设备非常有效，因为它们的设备上已经安装了 Flash。\n\
  \n\n\n\nHTML 5 引入了新的属性和元素，通过语义化标签来定义 HTML 文档。在此之前，任何阅读实际 HTML 文档标签的人不知道页眉（header）或页脚（footer）在哪里。HTML\
  \ 5 通过添加 `header`、`footer` 和 `content` 标签改变了这一点，这些标签浏览器和消费者可以轻松访问和阅读。\n\n除了语义化标签外，HTML\
  \ 5 还以数据库、`geolocation` 和增强缓存的形式为用户带来了其他新功能。这些功能允许开发者访问比以前 HTML 版本更得多的移动设备功能。而且由于\
  \ HTML 5 现在已成为标准，它几乎可以在每个移动 Web 浏览器上进行访问。\n\n# HTML5 关键特性\n\n虽然 HTML5 有很多可以为你的应用程序提供支持的新功能，但有几个关键项是你会在移动\
  \ Web 应用中使用的。这些功能允许你突破浏览器的边界，从缓存文件进行离线存储到获取用户位置并为其发送本地结果。根据你的应用程序需求，你可能就会用到所有的功能！\n\
  \n## 使用 geolocation 特性\n\n在过去的几年里，访问用户的位置信息已成为几乎每个 Web 应用或服务的重要部分。开发者获取用户的本地位置可以帮助他们完成许多事情，包括提供本地信息、行驶路线等。HTML5\
  \ 使得获取位置信息变得简单，并根据你的需求提供了一些自定义选项。\n\n来自 浏览器的 `geolocation` 与来自实际原生设备的 `geolocation`\
  \ 非常不同。根据规范，来自浏览器的 `geolocation` 应该使用当前情况下的最佳定位方法。在理论上，这应该是手机中的 GPS 芯片；但在某些情况下，网络浏览器会通过母元素（包括基站和\
  \ Wi-Fi）来检测位置。\n\n### 表 2-1 定位方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `Navigator.getPosition(success,\
  \ fail)` | 允许开发者获取当前位置。 |\n| `Navigator.watchPosition(success, fail)` | 允许开发者随时间跟踪位置变化。\
  \ |\n\n### 位置选项\n\n`getPosition` 和 `watchPosition` 都接受取决于你所需的选项：\n\n- `enableHighAccuracy`（布尔：`true`\
  \ 或 `false`）——如果你将其设置为 `true`，你将获得最准确的位置。缺点是会减少电池寿命。\n- `timeout`（整数）——默认没有超时。如果你设置了\
  \ `timeout`，则会调用 `fail` 函数。\n- `maximumAge`（整数）——此选项定义了缓存位置的最大年龄。如果位置旧于此值，它将会被刷新。\n\
  \n### 表 2-2 getPosition 的错误响应\n\n| 属性 (err.code) | 属性 (err.message) |\n| :--- |\
  \ :--- |\n| `1` (`PERMISSION_DENIED`) | 你拒绝了此页面获取位置的权限。 |\n| `2` (`POSITION_UNAVAILABLE`)\
  \ | 浏览器无法确定位置。 |\n| `3` (`TIMEOUT`) | 浏览器在获取位置之前超时。 |\n\n## 使用 getPosition() 单次定位用户\n\
  \n```html\n<!DOCTYPE html>\n<\n<body onload=\"start()\">\n  <div id=\"content\"\
  ></div>\n</body>\n\n<script>\nfunction start() {\n  if (navigator.geolocation) {\n\
  \    var options = {\n      enableHighAccuracy: true\n    };\n    navigator.geolocation.getCurrentPosition(onSuccess,\
  \ onError, options);\n  } else {\n    var content = document.getElementById(\"content\"\
  );\n    content.innerHTML = \"Geolocation is not enabled on your browser\";\n  }\n\
  }\n\n// success function\nfunction onSuccess(position) {\n  var content = document.getElementById(\"\
  content\");\n  var message = \"\";\n  var lat = position.coords.latitude;\n  var\
  \ lng = position.coords.longitude;\n  content.innerHTML = \"Your latitude is: <strong>\"\
  \ +lat+\"</strong> and your longitude is: <strong>\" +lng+\"</strong>\";\n}\n\n\
  function onError(error) {\n  var content = document.getElementById(\"content\");\n\
  \  var message = \"\";\n  switch(error.code) {\n    case 0:\n      message = \"\
  Something went wrong: \" + error.message;\n      break;\n    case 1:\n      message\
  \ = \"You denied permission to this page to retrieve a location.\";\n      break;\n\
  \    case 2:\n      message = \"The browser was unable to determine a location:\
  \ \" + error.message;\n      break;\n    case 3:\n      message = \"The browser\
  \ timed out before retrieving the location.\";\n      break;\n  }\n  content.innerHTML\
  \ = message;\n}\n</script>\n</html\n```\n\n该脚本应用了前面的章节中涵盖的所有逻辑，以概述了 `geolocation`\
  \ 方法的正确实现。\n\n## 使用 watchPosition() 持续定位用户\n\n与 `getPosition`（提供用户的一次性位置）不同，`watchPosition`\
  \ 提供用户位置的持续更新。\n\n`var watchID = navigator.geolocation watchPosition(success, fail,\
  \ options);`\n\n\n\n\n\n在使用 `watchPosition` 时，在选项中设置超时时间（timeout）是一个良好的习惯；否则，方法将持续运行并消耗用户的电池。`watchID`\
  \ 使用一个数字 ID，由你的 `watchPosition` 函数表示。你可以使用该变量通过以下方式终止实现：\n\n```\nnavigator.geolocation.clearWatch(watchId);\n\
  ```\n\n当 `watchPosition` 实现成功时，其行为与 `getPosition` 相同。`watchPosition` 通常还会返回比 `getPosition`\
  \ 更准确的结果。这是因为第一个结果通常只是粗略的估计，随着 `watchPosition` 的运行会不断得到完善。然而，由于显而易见的原因，它更消耗电量。\n\
  \n# 设置存储选项\n\n通过 HTML5，开发者拥有了更好的工具来存储数据；即使在浏览器关闭或移动设备重启后也是如此。HTML5 存储有两种实现方式，为开发者提供了存在于\
  \ 浏览器 DOM 内的存储选项。你可以使用这些实现来保存密码、应用程序设置、身份验证令牌、HTML 缓存等。\n\n## 使用 `localStorage`\
  \ 和 `sessionStorage` 对象\n\n`localStorage` 对象存储的数据除非开发者主动删除或用户清除其浏览器缓存，否则不会被移除。当你保存不希望在用户结束会话（如关闭网页浏览器或重启手机）时被移除的应用程序设置时，应该使用\
  \ `localStorage`。\n\n对于 `sessionStorage`，数据不是持久化的，一旦浏览器或标签页关闭，数据就会被移除。当文件本地运行时，你无法使用\
  \ `sessionStorage`。当你想要存储某些会过期的项（例如计数器或结购物车）时，这种解决方案提供了灵活性，无需在退出时删除键。\n\n`localStorage`\
  \ 和 `sessionStorage` 都以键/值系统存储存储值，并具有相同的方法和语法。唯一的区别在于你根据需要使用 `localStorage` 还是 `sessionStorage`\
  \ 命名空间。\n\n这两个对象都有三个方法：`setItem`、`getItem` 和 `removeItem`，分别用于设置、获取和删除你初始化的键。要向\
  \ `localStorage` 中的键保存一个值，请编写以下代码：\n\n```\nlocalStorage.setItem(\"key\", \"value\"\
  );\n```\n\n当你想要获取某个键的值时，使用 `getItem` 方法，如下代码所示：\n\n```\nvar yourKey = localStorage.getItem(\"\
  key\");\n```\n\n在设置或删除 `localStorage` 中的键之前，始终检查该键是否初始化是一个良好的习惯。以下是实现该操作的代码：\n\n\
  ```\nif (localStorage.getItem(\"books\")) {\n    // 太棒，“books\" 在我们的本地存储对象中作为一个键存在\n\
  \    var bookTitle = localStorage.getItem(\"book\");\n    document.write(\"The Book\
  \ Title is: \" + bookTitle);\n} else {\n    // 看起来找不到 \"books\"，所以我们正在添加它\n    localStorage.setItem(\"\
  books\", \"Smashing Magazine\");\n}\n```\n\n上述代码检查 `book` 键是否存在。如果存在，它使用 `getItem`\
  \ 提取该键的值，然后将结果打印到浏览器窗口。如果不存在，它将使用 `setItem` 方法将 `books` 键初始化为 `Smashing Magazine`\
  \ 的值。或者，如果你想删除该键（如果它存在的话），可以使用以下代码：\n\n```javascript\nif (localStorage.getItem(\"\
  books\")) {\n    // 太棒了，“books\" 在我们的本地存储对象中作为一个键存在，让我们将其移除\n    localStorage.removeItem(\"\
  books\");\n}\n```\n\n# 利用应用程序缓存 (Application Cache)\n\n移动 Web 的一个缺点是，它要求用户在每次加载\
  \ Web 应用时都下载所需的所有文件。HTML5 应用程序缓存允许你将文件存储在用户的设备上，这样他们每次启动应用时都无需下载你的应用。在移动设备上执行此类级别的缓存提供了三个关键益处：\n\
  \n- **离线浏览**：应用程序从缓存加载资源，因此不需要连接服务器下载，允许应用程序在离线状态运行。\n- **性能和速度**：因为不需要数据连接来下载文件，你的应用程序的速度和性能会得到提升。\n\
  - **减少服务器带宽**：由于文件已加载，除非文件发生更改，否则服务器将无需为每个请求提供文件。\n\n为了在应用程序中使用应用程序缓存，你需要创建一个名为\
  \ `Cache Manifest`（缓存清单）的文件。在该文件中，你列出了不同的章节，告诉浏览器缓存哪些文件以及哪些文件需要网络连接。要包含此文件，必须将其作为属性添加到你的\
  \ HTML 标签中，如下例所示：\n\n```html\n<html manifest=\"mycachefile.cache\">\n..\n</html>\n\
  ```\n\n缓存文件可以是本地文件或绝对文件，为了使用应用程序缓存，每个 HTML 标签都必须存在此属性。缓存的文件扩展名可以是任意的；不需要符合前面的示例。唯一的要求是属性名称必须为\
  \ `manifest`。\n\n此外，添加 `text/cache-manifest` 的 MIME 类型也关重要。这确保了服务器根据你的文件类型扩展名正确读取清单文件。对于前面的示例，你需要在应用程序根目录下的\
  \ `.htaccess` 文件中添加代码：\n\n```\nAddtype text/cache-manifest.cache\n```\n\n缓存清单文件包含三个章节，它们都是可选的。在基础层，一个清单缓存的写法如下：\n\
  \n```\nCACHE MANIFEST\nindex.html\nstyle.css\nimg/myLogo.png\njs/main.js\n```\n\n\
  所有缓存清单文件必须以 `CACHE MANIFEST` 开头，然后每行列出需要缓存的文件。在前面的代码中，你可以将清单的使用扩展为此处描述的三个章节：\n\n\
  - `CACHE`：如果文档中没有定义其他章节，则这是默认章节。该章节列下的所有文件在任何情况下都会被缓存。\n- `NETWORK`：此章节定义了不需要缓存且需要网络连接的文件。这些文件可以是任何需要服务器端渲染或\
  \ API 面的 URL。\n- `FALLBACK`：此章节定义了在资源不可用时的备用文件。在没有网络连接的情况下，可以使用备用文件向用户指示网络。\n\n\
  如果你想使用所有三个章节来生成清单文件，代码如下：\n\n```\nCACHE MANIFEST\nCACHE:\nindex.html\nstyle.css\n\
  img/myLogo.png\njs/main.js\nNETWORK:\nscript.php\nlogin.php\n/script/*\nFALLBACK:\n\
  main.php simple.html\n*.html offline.html\n```\n\n\n\n\n要检查缓存中的文件是否已更新，你可以在 DOM\
  \ 成功加载后使用以下脚本：\n\n```javascript\nwindow.addEventListener('load', function(e) {\n\
  \  window.applicationCache.addEventListener(\"updateready\", function(e) {\n   \
  \ if (window.applicationCache.status == window.applicationCache.UPDATEREADY) {\n\
  \      window.applicationCache.swapCache();\n      if (confirm(\"我们检测到网站有新版本。你想加载它吗？\"\
  )) {\n        window.location.reload();\n      }\n    } else {\n      // 没有任何变化，什么都不做！\n\
  \    }\n  });\n});\n```\n\n在这里，当应用程序首次加载时，`UPDATEREADY` 会监听应用程序缓存状态是否变为 `update\
  \ ready`（更新就绪）。如果发生这种情况，脚本将下载新缓存并将缓存切换到新版本。然后它会询问用户加载新版本，从而加载新的脚本。\n\n注意的是，缓存清单文件（cache\
  \ manifest）是在位级别进行缓存的，这意味着如果你在文件中更改了任何内容（即使是添加注释），浏览器都会重新缓存所有内容。\n\n## CSS3\n\n\
  CSS 代表层叠样式表（Cascading Style Sheets），它定义了 HTML 元素在页面显示时使用的属性和特性。CSS3 是该语法的新版本，有助于帮助设计师和开发者创建丰富的元素，而无需使用复杂的\
  \ JavaScript、图像或 Flash 来向用户显示内容。\n\n注意的是，CSS3 在所有浏览器中并不一致。表 2-4 显示了跨所有浏览器使用的三类浏览器框架。\n\
  \n在构建 Web 应用时，你应该始终知道你的目标设备。如果你想针对 Windows Mobile（运行 IE7 Mobile），你需要知道它支持哪些 CSS3\
  \ 函数。许多工具可以检测操作系统类型和可用功能。我将在本章稍后部分讨论这些工具，它们可以对你的开发过程有所帮助。\n\n### 表 2-4 浏览器框架\n\n\
  | 浏览器框架 | 浏览器示例 | 支持 CSS3？ |\n| :--- | :--- | :--- |\n| Gecko | Mozilla Firefox,\
  \ Mozilla Firefox Mobile (Fennac) | 从 4.0 及更高版本开始完全支持 CSS3。所有 CSS 属性必须带有 -moz 前缀。\
  \ |\n| Webkit | Apple Safari, Apple Safari Mobile, Google Chrome | 部分支持 CSS3，取决于浏览器版本。所有浏览器的最新版本应该支持所有\
  \ CSS3 特性。所有属性必须带有 -webkit 前缀。 |\n| Mosaic | Internet Explorer, IE Mobile | Internet\
  \ Explorer 无法提供大部分 CSS3 功能。Internet Explorer 9 及更高版本确实支持大部分 CSS3 特性；但在写作期间，移动浏览器不支持\
  \ IE9。 |\n\n## 关键 CSS3 特性\n\nCSS3 带来了一系列功能，帮助你设计更快速、更美的网站。CSS3 的目标是让开发者使用 HTML 元素来设计网站，而不是依赖\
  \ JavaScript 库和图像。让我们来看一些你可以立即在 Web 应用中开始使用的 CSS3 关键特性。\n\n### 盒阴影 (Box shadow)\n\
  \nCSS3 属性 `box-shadow` 允许你为框周围创建投影效果，使其看起来像是悬浮在元素之上。（参见图 2-1.）\n\n![9871118348161-fg0201.eps](img/9871118348161-fg0201_fmt.png)\n\
  \n图 2-1：使用 CSS3 box-shadow 属性创建投影。\n\n要在你的元素上启用盒阴影，你需要添加以下语法：\n\n`box-shadow: none\
  \ | <shadow> [ , <shadow> ]*`\n\n可以使用以下代码应用：\n\n```css\nbox-shadow: 10px 10px\n\
  box-shadow: 10px 10px 5px #C1C1C1\nbox-shadow: inset 5px 5px 5px 5px #C1C1C1\nbox-shadow:\
  \ 0px 0px 5px 5px #C1C1C1, 0px 0px 5px 5px #C1C1C1, 0px 0px 5px 5px #C1C1C1;\n```\n\
  \n虽然这看起来很复杂，但如果你拆解要求，它就会变得非常简单。第一步是定义你想在元素上方的阴影形状。你可以通过指定二到四个长度值来实现。\n\n1. 第一个值定义盒阴影的水平偏移。数字可以是负数或正数，取决于你偏移阴影的需求。\n\
  2. 第二个值与第一个相同，但位于垂直轴上。如果数字是负数，则从元素顶部向下偏移，正数反之亦然。\n3. 第三个值是可选的，定义阴影的模糊距离。你不能为该值添加负数，但你插入值越大，阴影的边缘就越模糊。它没有默认值，所以如果没有设置此值，你的盒阴影将不会设置模糊。\n\
  4. 第四个值同样是可选的，定义阴影的扩散距离。此值可以可以是负数或正数，较大的值会导致阴影向所有方向扩展，而负值则会影响对比度。\n\n在你设置了二到四个长度值后，第一步是定义你想在元素上方的阴影形状。你可以通过指定二到四个长度值来实现。第一个值定义盒阴影的水平偏移。数字可以是负数或正数，取决于你偏移阴影的需求。第二个值与第一个相同，但位于垂直轴上。如果数字是负数，则从元素顶部向下偏移，正数反之亦然。第三个值是可选的，定义阴影的模糊距离。你不能为该值添加负数，但你插入值越大，阴影的边缘就越模糊。它没有默认值，所以如果没有设置此值，你的盒阴影将不会设置模糊。第四个值同样是可选的，定义阴影的扩散距离。此值可以可以是负数或正数，较大的值会导致阴影向所有方向扩展，而负值则会影响对比度。\n\
