  \n看起来不错！现在让我们在社交元素中添加社交结果。\n\n#### 连接到外部网站\n\n在 `JavaScript` 中处理 `AJAX` 时，你可以连接到广泛的免费\
  \ `APIs` 来获取数据。在上一章中，你使用了 `foursquare` 来连接本地位置。在这个示例中，你将使用 `Twitter API` 来搜索你正在寻找的葡萄酒的提及，并将结果显示在葡萄酒详情下方。\n\
  \n##### 构建模板\n\n由于 Twitter 的数据是以 `JSON` 格式返回的，你可以使用 `Handlebars` 来帮助构建每条推文显示的 HTML\
  \ 模板。如果你按照之前处理活动馈的步骤进行了操作，你应该已经将 `HandlebarsJS` 添加到了你的项目中，否则，你可以参考之前的内容了解如何在项目内进行设置。\n\
  \n1. **定义你的模板结构。** 要使用 `Handlebars`，你必须在 `script` 标签中创建一个带有所需 HTML 的模板。在 `index.html`\
  \ 的 `</body>` 结束标签之前添加此代码：\n\n```html\n<script id=\"social-template\" type=\"text/x-handlebars-template\"\
  >\n....\n</script>\n```\n\n当你编译模板时，`Handlebars` 会获取此脚本文件的内容并与 `JSON` 对象结合，产生预期的结果。\n\
  \n2. **编写根据葡萄酒名称拉取推文的脚本。** 在将葡萄酒数据插入 `detail` 元素之后，紧接着添加此脚本。\n\n```javascript\n\
  $(\"#detail\").html(code);\n$.getJSON(\"http://search.twitter.com/search.json?q=\"\
  +res.rows.item(0).wine_name, function(data) {\n  console.log(data);\n});\n```\n\n\
  截至 2013 年 3 月 15 日，Twitter 将推出新版本的 `API`，所有 `API` 请求都需要经过验证，这意味着你必须在调用时提供额外的参数。要了解更多关于这些更改，请参考此链接：`https://dev.twitter.com/docs/api/1.1/overview`。\n\
  \n此操作的作用是：\n* 使用 `getJSON` 方法查询 `Twitter API` 获取当前葡萄酒的搜索结果。\n* 使用 `res.rows` 对象获取\
  \ `SQL` 命令生成的。\n\n3. **保存文件并刷新页面。** 然后在活动标签页中选择一个项目。你的屏幕应该像图 9-7 一样。\n\n![9781118348161-fg0907.eps](img/9781118348161-fg0907_fmt.png)\n\
  \n图 9-7：活动标签页中生成的代码\n\n此视图显示了你想从 `results` 对象中提取的以下属性：\n* `created_at`\n* `from_user_name`\n\
  * `text`\n* `profile_image_url`\n\n## Handlebars 编译函数\n\n现在你已经知道了想要的数据，可以开始构建你的\
  \ `Handlebars` 模板了。如之前讨论的，你现在可以用 `Handlebars` 的格式添加这些元素。\n\n在这种情况下，你想对 `results`\
  \ 对象执行相同的操作：\n\n```html\n<script id=\"social-template\" type=\"text/x-handlebars-template\"\
  >\n{{#each result}}\n  <p>{{/each}}\n</script>\n```\n\n## 将函数集成到你的应用中\n\n现在回到你的\
  \ `getJSON` 函数，你想使用 `Handlebars` 编译刚刚创建的模板，并使用 Twitter 的数据生成新模板。要实现这一点，请执行以下操作：\n\
  \n1. **插入以下代码：**\n\n```javascript\n$.getJSON(\"http://search.twitter.com/search.json?q=\"\
  +res.rows.item(0).wine_name, function(data) {\n  var source = $(\"#social-template\"\
  ).html();\n  var template = Handlebars.compile(source);\n  var html = template(data);\n\
  \  $(\"#social\").html(html);\n});\n```\n\n使用 `Handlebars` 获取你模板的内部 HTML，然后将其编译为一个新变量。一旦完成，你将来自\
  \ Twitter 的数据传递给名为 `html` 的变量。此时，数据已被收集并解析，因此结果应该显示讨论该葡萄酒的用户段落标签。\n\n2. **保存文件，刷新页面并导航到活动项目。**\
  \ 你应该会看到类似于图 9-8 的屏幕。\n\n![9781118348161-fg0908.eps](img/9781118348161-fg0908_fmt.png)\n\
  \n图 9-8：所有的 Twitter 用户名都放在段落标签中。\n\n##列表视图\n\n现在你理解了模板引擎是如何工作的，你可以构建一个更具功能的列表模型，以便查看关于葡萄酒的更多详情——推文本身、发布推文的用户名以及他们的\
