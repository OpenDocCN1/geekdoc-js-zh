  \ role=\"heading\">Twitter Search Results\n    {{#each results}}\n      <p>{{this.\
  \ from_user_name}}</p>\n    {{/each}}\n  </ul>\n</script>\n```\n\n添加列表视图的 `UL` 允许你创建一个\
  \ `list-view`。\n\n2. **添加列表视图的 `UL` 允许你创建一个列表。** 保存文件并刷新页面。你应该看到像图 9-9 的内容。\n\n\
  ![9781118348161-fg0909.eps](img/9781118348161-fg0909_fmt.png)\n\n图 9-9：用户名现在显示在一个项目内\n\
  \n用户名出现在单个 `<li>` 元素中，但没有 `<p>` 标签。你漏掉了什么？\n\n1. **在 `getJSON` 中添加此简单代码：**\n\n```javascript\n\
  $.getJSON(\"http://search.twitter.com/search.json?q=\"+res.rows.item(0).wine_name,\
  \ function(data) {\n  var source = $(\"#social-template\").html();\n  var template\
  \ = Handlebars.compile(source);\n  var html = template(data);\n  $(\"#social\").html(html);\n\
  \  $('#my-social-list').listview();\n  $('#my-social-list').listview('refresh');\n\
  });\n```\n\n一旦你将 `HTML` 添加到 `social` 元素，你就获取 `<ul>` 的 `ID`。你需要调用 `listview()` 然后调用\
  \ `listview('refresh')`。\n\n2. **保存你的工作。** 你应该看到像图 9-10 的内容。\n\n![9781118348161-fg0910.eps](img/9781118348161-fg0910_fmt.png)\n\
  \n图 9-10：用户名现在已正确显示\n\n#### 为你的推文构建模板\n\n现在你已经从 Twitter 拉取了正确的数据，你可以开始构建推文的模板了。\n\
  \n1. **首先在最右侧添加用户的头像。** 你可以通过在模板中添加以下内容来实现：\n\n```html\n<script id=\"social-template\"\
  \ type=\"text/x-handlebars-template\">\n  <ul data-role=\"list-view\" id=\"my-social-list\"\
  >\n    <li data-role=\"list-divider\" role=\"heading\">Twitter Search Results\n\
  \    {{#each results}}\n      <li>\n        <a href=\"\">\n          <img class=\"\
  ui-li-thumb\" src=\"{{this.profile_image_url}}\">\n          <h2>{{this.from_user_name}}</h2>\n\
  \          <p>{{this.text}}</p>\n          <p>{{ this.created_at}}</p>\n       \
  \ </a>\n      </li>\n    {{/each}}\n  </ul>\n</script>\n```\n\n2. **保存文件。** 你应该开始列表左侧看到一些\
  \ Twitter 头像，如图 9-11 所示：\n\n![9781118348161-fg0911.eps](img/9781118348161-fg0911_fmt.png)\n\
  \n图 9-11：现在你的页面显示了 Twitter 头像。\n\n\n\n\n4. 保存你的工作。你应该能看到一个类似于图 9-12 所示的整洁的推文模板。\n\
  \n尽管你的 Twitter 流看起来很专业，但有一点非常显眼：时间戳。虽然它现在已经可读，但你也可以通过更符合用户的“X 分钟前”使其与应用的其他部分保持一致。\n\
  \n![9781118348161-fg0912.eps](img/9781118348161-fg0912_fmt.png)\n\n图 9-12：你的用户会喜欢这种熟悉的界面。\n\
  \n### 为相对时间戳定义自定义函数\n\n由于你正在使用 `Handlebars` 在模板中交付内容，如何动态地交付需要计算或更改的字段呢？幸运的是，`Handlebars`\
  \ 有一个名为 `registerHelper` 的内置函数，它允许你定义一个自定义函数来对属性执行操作。语法如下所示：\n\n```\nHandlebars.registerHelper('name_of_function',\
  \ function(variables) {\n  //在此处执行你想执行的操作！\n});\n```\n\n为了展示如何使用此函数，在 `helper.js`\
  \ 中创建一个名为 `userFull` 的新辅助函数：\n\n1. 输入此函数。它获取用户的 Twitter 显示名和全名，并将它们合并为一个结果。\n\n\
  ```\nHandlebars.registerHelper('userFull', function(tweets) {\n  return tweets.from_user_name\
  \ + \" (\"+tweets.from_user+\")\";\n});\n```\n\n此函数接收对象 `tweets` 并返回 `from_user_name`\
  \ 和 `from_user` 属性，并带有一些格式化处理。将此 JavaScript 代码放在 `helper.js` 文件之前。\n\n2. 要在 `Handlebars`\
  \ 中调用此函数，只需使用你创建的名称（`userFull`），后跟你想传递的变量，如下：\n\n```\n<h2>{{userFull this}}</h2>\n\
  ```\n\n3. 保存文件。你应该看到类似图 9-13 的界面。\n\n![9781118348161-fg0913.eps](img/9781118348161-fg0913_fmt.png)\n\
  \n图 9-13：带有用户名和全名的 Twitter 馈示例\n\n#### 调整时间戳\n\n现在你已经知道如何编写自定义辅助函数，你可以编写一个函数来处理时间戳部分，将其转换为相对时间格式。\n\
  \n1. 如果你记得之前，你在 `Handlebars` 模板中创建了一个辅助函数来处理时间戳。你重用该功能来调整 Twitter 馈的时间戳。你对其进行了微调以接受各种日期输入。为\
  \ `Handlebars` 创建一个名为 `timeDiff` 的辅助函数并让它传递一个字符串。在 `helper.js` 文件中添加以下代码：\n\n```\n\
  Handlebars.registerHelper('timeDiff', function(string) {\n  ...\n});\n```\n\n2.\
  \ 结构准备后，你需要调整日期输入的功能。你想复制之前创建的 `timeDiffActivity` 函数并插入到新创建的 `timeDiff` 函数中。\n\n\
  ```\nHandlebars.registerHelper('timeDiff', function(string) {\n  var system_date\
  \ = new Date(Date.parse(string));\n  var user_date = new Date();\n  var diff = Math.floor((user_date\
  \ - system_date) / 1000);\n  if (diff <= 1) {return \"just now\";}\n  if (diff <\
  \ 20) {return diff + \" seconds ago\";}\n  if (diff < 40) {return \"half a minute\
  \ ago\";}\n  if (diff < 60) {return \"less than a minute ago\";}\n  if (diff <=\
  \ 90) {return \"one minute ago\";}\n  if (diff <= 3540) {return Math.round(diff\
  \ / 60) + \" minutes ago\";}\n  if (diff <= 5400) {return \"hour ago\";}\n  if (diff\
  \ <= 86400) {return Math.round(diff / 3600) + \" hours ago\";}\n  if (diff <= 129600)\
  \ {return \"day ago\";}\n  if (diff < 604800) {return Math.round(diff / 86400) +\
  \ \" days ago\";}\n  if (diff <= 777600) {return \"week ago\";}\n  return \"on \"\
  \ + system_date;\n});\n```\n\n注意，你更改了函数的前两行以表示来自 Twitter 的日期。你在活动流中的函数接受 Unix 时间戳（`1234325`），而\
  \ Twitter 接受的是不同的时间戳，这就是切换的原因。将整个模板组合在一起，包括现有的辅助函数，看起来如下：\n\n```html\n<script id=\"\
  social-template\" type=\"text/handlebars-template\">\n  <ul data-role=\"list-view\"\
  \ id=\"my-social-list\">\n    <li data-role=\"divider\" role=\"heading\">Twitter\
  \ Search</li>\n    {{#each results}}\n      <li>\n        <a href=\"\">\n      \
  \    <img class=\"ui-li-thumb\" src=\"{{this.profile_image_url}}\">\n          <h2>{{userFull\
  \ this}}</h2>\n          <p>{{this.text}}</p>\n          <p>{{timeDiff this.created_at}}</p>\n\
  \        </a>\n      </li>\n    {{/each}}\n  </ul>\n</script>\n```\n\n3. 保存。你应该能看到类似图\
  \ 14 的界面：\n\n![9781118348161-fg0914.eps](img/9781118348161-fg0914_fmt.png)\n\n图\
  \ 14：时间戳现在是相对格式。\n\n\n\n\n\n这段代码获取你创建的分享模板，使用 Handlebars 对其进行编译，然后传入你从数据库查询中接收的数据。这将帮助你生成传递给\
  \ Facebook 和 Twitter 的 URL。\n\n2. 保存并重新加载应用程序。在导航回葡萄酒详情（Wine Detail）页面后，你应该能看到类似图\
  \ 9-16 的屏幕。\n\n![9781118348161-fg0916.eps](img/9781118348161-fg0916_fmt.png)\n\n\
  图 9-16：显示在 Facebook 上分享和推文链接的葡萄酒详情页\n\n点击这些链接后，你将被重定向到 Twitter 和 Facebook，为你的推文或分享添加额外的评论，如图\
  \ 9-17 所示：\n\n![9781118348161-fg0917.eps](img/9781118348161-fg0917_fmt.png)\n\n\
  图 9-17：使用 Web Intent Link 在 Twitter 上分享的示例\n\n## 总结\n\n本章重点关注了构建活动（Activity）和葡萄酒详情页面，以及使用外部服务连接\
  \ Twitter 以获取额外内容。此外，我们还讨论了：\n\n* 使用 Handlebars 创建模板\n* 使用 Handlebars 创建自定义助手\n\
  * 解析 Twitter Search API\n* 分享到 Twitter 和 Facebook\n* 在 jQuery Mobile 中处理外部链接\n\n\
  ### 第 10 章：位置存储与搜索\n\n原生应用程序往往“感觉更更快”的主要原因之一，是由于它们能够在手机内存中缓存大量数据。通过原生 API，开发者可以存储数据库和大型数据集的缓存，而不需要在用户每次导航到现有页面时都让应用程序与服务器通信。\n\
  \n在 Corks 中，你并不是访问外部服务器获取数据，但你确实使用 Foursquare 和 Twitter 来检索有关场所和推文的信息。这可能会消耗大量带宽，因此在移动\
  \ Web 中，你可以使用本地存储（local storage）等技术来存储 DOM 中的数据结果，以便以后使用这些数据。\n\n本地存储为 Web 应用开发者提供了缓存大型数据集的机会，以便它们在页面切换时快速显示。HTML5\
  \ 中增加的这一功能避免了长时间等待网页加载。能够使用 AJAX 加载数据，结合本地存储的功能，为用户创造了丰富的体验，因为他们可以在不连接互联网的情况下访问。\n\
  \n本地存储允许你仅以键对格式存储数据，因此在存储来自 Foursquare 或 Twitter 的数据时，必须将原始 JSON 转换为字符串以便再次使用。\n\
  \n在本章中，你使用本地存储缓存 Foursquare 场所和 Twitter 结果。你还将在设置面板中使用本地存储来创建一些自定义功能以增强 Corks 体验。最后，你构建了最后一个标签——搜索（Search），用于搜索你最新的活动。\n\
  \n在本章中，你继续为示例应用 Corks 开发。到本章结束时，你应该能够：\n\n* 使用本地存储缓存 Foursquare 的位置\n* 使用本地存储缓存\
  \ Twitter 的推文\n* 使用本地存储构建用于自定义设置的设置标签\n* 构建带有葡萄酒结果的搜索标签\n\n如果你还没有学习过这些内容，你可能会发现快速查看第\
  \ 8 章和第 9 章会有很大帮助，因为这些章节涉及向你的 Web 应用添加地理位置功能，以及与 Twitter 和 Foursquare 的集成。在能够本地存储这些数据之前，所有这些都是必要的。\n\
  \n## 构建的元素\n\n本地存储是本章的重点，因此从缓存你从外部服务接收到的一些数据开始。在开始缓存之前，你需要构建一个函数，可以在此练习中引用它，以便与本地存储的交互更加简单。在这里你将编写一个名为\
  \ `myStorage` 的函数，它包含了本地本地存储数据的功能。然后你可以在应用程序每次需要执行此操作时使用该函数。\n\n### 创建 myStorage\
  \ 函数\n\n在开发经常用到的功能时，有时编写一个可以调用并在代码中进行迭代的原始函数会有帮助。\n\n1. 在 `index.html` 文件中创建一个名为\
  \ `myStorage` 的新变量，它将包含几个方法：\n\n```javascript\nvar myStorage = {\nset: function(a,b)\
  \ {\n},\nremove: function(a) {\n},\nget: function(a) {\n},\nclear: function() {\n\
  }\n};\n```\n\n虽然这些函数可能模拟 `localStorage.setItem` 和 `localStorage.getItem` 的语法，但将这些方法整合到一个你以后可以更改的函数中是很有用的。例如，假设你想在将某些内容保存为本地存储元素之前执行一个操作。你只需要修改一次\
  \ `myStorage` 中 `set` 函数的代码，而不需要扫描整个文件寻找 `localStorage.setItem()` 的实例。\n\n2. 对于\
  \ `myStorage` 的 `set` 方法，你传递两个变量 `a` 和 `b`。在这种情况下，`a` 代表索引或键，而 `b` 代表值。\n\n```javascript\n\
  ..\nset: function(a,b) {\nvar val = \"\";\nif (typeof b==”object”) {\nval = JSON.stringify(b);\n\
  }\nelse {\nval = b;\n}\nlocalStorage.setItem(a,val);\n}\n...\n```\n\n前面的代码使用 `typeof`\
  \ 方法确定变量 `b` 的数据类型。如果变量 `b` 是一个对象，你想将结果保存为字符串。`JSON.stringify` 是现代浏览器内置的函数；但在你的\
  \ `<head>` 中添加以下脚本标签：\n\n`<script src=\"https://raw.github.com/douglascrockford/JSON-js/master/json2.js\"\
  ></script>`\n\n或者，你也可以单独下载 `json` 文件并在本地应用。\n\n3. 现在添加 `remove` 和 `get` 方法。它们与本地存储的方法相似：\n\
  \n```javascript\n...\nremove: function(a) {\nlocalStorage.setItem(a, \"\");\n},\n\
  get: function(a,b) {\nif (b == “JSON”) {\nreturn JSON.parse(localStorage.getItem(a));\n\
  }\nelse {\nreturn localStorage.getItem(a);\n}\n}\n...\n```\n\n对于 `remove` 方法，你只是使用本地存储方法将变量\
  \ `a`（即你的索引）设置为空字符串。对于 `get` 方法，你接收两个变量：索引 `a` 以及用于测试你想返回对象还是纯文本的字符串 `b`。这让你能够定义想要接收的数据类型。\n\
  \n最后，你添加 `clear` 方法，它与 `localStorage.clear()`相同。这将清除该域下所有的本地存储元素。有时这对测试或调试很有用。在生产应用程序中，只有你想让用户删除所有数据时才使用它。请注意，这不会影响用于数据库的\
  \ WebSQL。\n\n```javascript\n...\nclear: function() {\nlocationStorage.clear();\n\
  }\n...\n```\n\n`myStorage` 函数就这些了！你现在可以在代码中使用该函数，随时方便地保留并提供数据。\n\n#### 缓存地理位置和场所\n\
  \n缓存用户纬度和经度的问题之一是，如果他们物理移动了位置，你需要更新信息。你可以使用 `watchPosition`；但那会迅速消耗移动设备的电量。解决方案是跟踪上一次地理位置成功的时间戳。如果用户再次请求位置且差异微乎其微，就可以为该用户提供缓存的纬度和经度。\n\
  \n1. 参考你在第 8 章中创建的 `successPosition` 函数，然后添加以下代码行：\n\n```javascript\nvar currentTime\
  \ = new Date().getTime()\nmyStorage.set(“lastGeo”, currentTime);\n```\n\n\n\n\n\
  这段代码将当前时间戳存储在一个名为 `lastGeo` 的本地存储对象中。你之后可以使用它来检测两个日期之间的时间差。\n\n2. 在你调用 `getCurrentPosition`\
  \ 的 `onHashChange` 函数中，添加一些代码来检测上已知位置是否足够旧而需要刷新：\n\n```javascript\n...\nif ($(\"\
  ##map\").html() == \"\") {\n  var lastTime = myStorage.get(\"lastGeo\")\n  if (lastTime)\
  \ {\n    var currentTime = new Date.getTime();\n    var subtract = parseInt(currentTime)\
  \ - parseInt(lastTime);\n    // 如果差大于 250 秒（或约 4 分钟），则刷新位置\n    if (parseInt(subtract)\
  \ >250) {\n      getCurrentPosition();\n    }\n    else {\n      navigator.geolocation.getCurrentPosition(successPosition,\
  \ errorPosition);\n    }\n  }\n  else {\n    navigator.geolocation.getCurrentPosition(successPosition,\
  \ errorPosition);\n  }\n}\n...\n```\n\n虽然前面的函数看起来很复杂，但实际上非常简单。你只是修改了之前的函数，首先检查本地存储中是否已设置\
  \ `lastGeo` 键。如果已设置，你就获取当前时间并减去上已知位置的时间。如果差值大于 250 秒（约 4 分钟），用户可能已经移动了位置，你应该通过再次调用\
  \ `nagivator.geolocation.getCurrentPosition` 来刷新。否则，只需调用 `successPosition` 即可。\n\
  \n3. 现在你可能在想，如果不将 `position` 对象传递给 `successPosition` 函数，如何获取纬度和经度？答案很简单：因为你已经以变量的形式存储了纬经，所以你可以在\
  \ `successPosition` 函数中轻松地调用它们，如下代码所示：\n\n```javascript\nfunction successPosition(position)\
  \ {\n  if (position) {\n    lat = position.coords.latitude;\n    lng = position.coords.longitude;\n\
  \    var currentTime = new Date().getTime();\n    myStorage.set(\"lastGeo\", currentTime);\n\
  \    drawMap();\n  }\n  else {\n    drawMap();\n  }\n}\n```\n\n你调用的额外方法让你能够调用 `drawMap`\
  \ 函数，同时考虑到你已经将纬经度存储在变量中。缓存位置可以使用更少的电量，并提供更快的响应时间。\n\n4. 因为你现在正在缓存位置，现在是时候将场所对象存储在你的本地存储对象中了，以获得极速的结果。首先，你需要更改\
  \ `findPlaces` 函数的工作方式。\n\n这是旧函数：\n\n```javascript\nfunction findPlaces() {\n  $.getJSON(\"\
  https://api.foursquare.com/v2/venues/search?client_id=YOURCLIENTID &client_secret=YOURSECRET&ll=\"\
  +lat+\",\"+lng+”&query=wine store&limit=25\", function(data) {\n    ...\n  })\n\
  }\n```\n\n将其更改为如下：\n\n```javascript\nfunction findPlaces() {\n  var venue_data =\
  \ myStorage.get(\"foursquareVenues\")\n  var lastTime = myStorage.get(\"lastVenuePull\"\
  )\n  if (lastTime) {\n    var currentTime = new Date.getTime();\n    var subtract\
  \ = parseInt(currentTime) - parseInt(lastTime);\n    if (parseInt(subtract) >= 250)\
  \ {\n      $.getJSON(\"https://api.foursquare.com/v2/venues/search?client_id=CLIENTID\
  \ &client_secret=CLIENTSECRET&ll=\"+lat+\",\"+lng+”&query=wine store&limit=25\"\
  , function(data) {\n        parseMap(data, \"store\");\n      });\n    }\n    else\
  \ {\n      parseData(venue_data);\n    }\n  }\n  else {\n    $.getJSON(\"https://api.foursquare.com/v2/venues/search?client_id=CLIENTD&client_secret=CLIENTSECRET&ll=\"\
  +lat+\",\"+lng+”&query=wine store&limit=25\", function(data) {\n      parseMap(data,\
  \ \"store\");\n    });\n  }\n}\n```\n\n你对现有的函数 `findPlaces` 做了几处修改：\n\n- 你移除了解析地图上点的逻辑，并将在名为\
  \ `parseMap` 的新函数中替换该逻辑。\n- 你正在检查 Local Storage 对象的缓存时间是否大于 5 分钟。如果是，你需要拉取新数据。否则，使用缓存信息传递给\
  \ `parseMap` 函数。\n- 如果一切顺利，你将缓存的场所对象或新的场所对象传递给 `parseMap` 方法。此外，如果场所需要存储，你还会传递第二个变量。\n\
  \n5. 你正在重写在地图上放置标记的逻辑，因此你需要像下面所示考虑 `parseMap` 的第二个参数：\n\n```javascript\nfunction\
  \ parseMap(data, store) {\n  if (data.meta.code == 200) {\n    if (store) {\n  \
  \    myStorage.set(\"foursquareVenues\", data);\n      var currentTime = new Date.getTime();\n\
  \      myStorage.set(\"lastVenuePull\", currentTime);\n    }\n  }\n```\n\n虽然 `...`\
