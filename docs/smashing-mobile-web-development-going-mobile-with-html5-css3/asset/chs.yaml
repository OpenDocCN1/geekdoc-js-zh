  \n## 创建葡萄酒详情页\n\n`Activity` 标签显示了所有添加到数据库的葡萄酒。馈流（feed）很不错，但如果你想查看更多信息呢？这就是葡萄酒详情页大派用用场的地方。\n\
  \n### 创建葡萄酒详情页的结构\n\n你需要做的第一件事是在你的结构中创建一个新页面。在一个名为 `detail.html` 的新文件中添加以下代码，该文件将包含葡萄酒详情页的标记语言。从\
