  \n#### 搜索历史记录\n在你的酒窖中输入了几种葡萄酒后，检查是否包含特定葡萄酒的最佳方法是进行搜索。通过最后一个选项卡——搜索（Search），你将允许用户通过葡萄酒名称搜索他们的活动（Activity）选项卡并显示结果。按照以下步骤操作：\n\
  \n### 1. 创建搜索模板\n正如你处理设置选项卡时所的那样，你需要为页面创建一个基础模板。在你刚刚添加的设置选项卡标记之前，立即添加以下代码：\n\n```html\n\
  <div id=\"search\" data-role=\"page\">\n<div data-role=\"header\" data-position=\"\
  inline\">\n<h1>Search</h1>\n<div data-role=\"navbar\" data-iconpos=\"bottom\">\n\
  <ul>\n<<li><a data-icon=\"star\" href=\"#activity\">Activity</a></li>\n<<li><a data-icon=\"\
  grid\" href=\"#manage\">Manage</a></li>\n<<li><a data-icon=\"info\" href=\"#find\"\
  >Find</a></li>\n<<li><a data-icon=\"gear\" href=\"#settings\">Settings</a></li>\n\
  <<li><a data-icon=\"search\" href=\"#search\">Search</a></li>\n</ul>\n</div> <!--\
  \ /navbar -->\n</div> <!-- /header -->\n<div data-role=\"content\">\n<form id=\"\
  search-form\">\n<label for=\"search\">Search:</label>\n<input type=\"text\" class=\"\
  required\" name=\"search\" id=\"search\" />\n</form>\n<ul id=\"search-list\"></ul>\n\
  </div>\n```\n\n### 2. 实现搜索逻辑\n该函数使用 `LIKE` 运算符来匹配名称输入。\n\n```javascript\nfunction\
  \ SearchWines() {\n  var searchTerm = $(\"#search\").val();\n  db.transaction(function(tx)\
  \ {\n    tx.execute(\"SELECT wine_name, description, quantity, created_at FROM activity\
  \ JOIN wines ON activity.wine_id = wines.wine_id WHERE wine_name LIKE ?\", [\" +\
  \ searchTerm + \"%\"], function(tx, res) {\n      if (res.rows.length == 0) {\n\
  \        $(\"#search-list\").html(\"<p>No results found.</p>\");\n      } else {\n\
  \        var code = \"\";\n        for (var i = 0; i < res.rows.length; i++) {\n\
  \          code += \"<li><a href='#wineDetail?\" + res.rows.item(i).wine_id + \"\
  '>\" + res.rows.item(i).wine_name + \"</a><p>\" + res.rows.item(i).description +\
  \ \"</p>Added: \" + res.rows.item(i).quantity + \" to Cellar</p></li>\";\n     \
  \   }\n        $(\"#search-list\").html(code);\n      }\n      $(\"#search-list\"\
  ).listview();\n    });\n  });\n}\n```\n\n### 3. 修复布局\n当列表视图（List View）渲染时，它会将 `<ul>`\
  \ 向上推并覆盖表单。这个问题可以通过几种方法解决，但简单的方法是通过创建一个新类 `pad` 为 `<form>` 元素添加一些内边距。\n\n在你的 `<head>`\
  \ 标签中添加以下脚本：\n\n```html\n<style type=\"text/css\">\n.pad {\n  padding-bottom: 25px;\n\
  }\n</style>\n```\n\n为 `<form>` 元素添加以下类：\n\n```html\n<form id=\"search-form\" data-ajax=\"\
  false\" onsubmit=\"SearchWines(); return false;\" class=\"pad\">\n```\n\n在保存并刷新后，屏幕截图看起来要好得多，如图\
  \ 10-7 所示：\n\n![9781118348161-fg1007.eps](img/9781118348161-fg1007_fmt.png)\n\n\n\
  \n\n\n# 图 10-7: 看起来好多了！\n\n你可以随时调整查询以选择你任何想要搜索的字段。例如，假设你只想搜索 `activity_note` 字段。在这种情况下，你只需要进行此处所示更改：\n\
  \n```javascript\n...\ntx.executeSql(“SELECT wine_name, wine_description, activity_note,`\n\
  `activity_quantity, activity_id, activity.wine_id, activity.created_at from`\n`activity\
  \ INNER JOIN wines on activity.wine_id = wines.wine_id where`\n`activity_note LIKE\
  \ ?”, [“%”+search_term+”%”],\n...\n```\n\n在上一个查询中，你使用了一种名为 `INNER JOIN` 的 SQL 技术，它允许你获取数据库架构中的两个表，并根据共同字段将它们连接起来。在这种情况下，共同字段\
  \ `wine_id` 同时连接了 `wines` 和 `activity` 表。通过这种方式，你现在可以同时获取有关活动和葡萄酒的信息，而无需进行过多的独立查询。\n\
  \n太棒了！你现在为应用程序添加了活动搜索功能！\n\n## 总结\n\n本章侧重于构建设置和搜索页面，并使用 Local Storage 缓存和保存来自 foursquare\
  \ 和 Twitter 的外部源。此外，我们还讨论了：\n\n* 为 JSON 构建自定义的本地存储辅助文件\n* 通过 JavaScript 解析字符串和对象\n\
  * 使用 `LIKE` 操作符进行 Web SQL 查询\n\n## 第四部分：性能与生产环境\n\n### 第 11 章：测试与组织你的代码\n\n### 第\
  \ 11 章：测试与组织你的代码\n\n现在你已经完成了 Corks 的开发，准备进行一些测试，让 Corks 准备好部署到我们的网络服务器上使用。为了准备部署并方便维护，你需要组织你的文件。在项目开发结束时，重构代码也是一种良好的做法，将每个\
  \ JavaScript 函数放置在自己的文件中。在处理移动端带宽时，加载多个小文件比加载一个大型 JavaScript 文件更好。你可以通过删除 JavaScript\
  \ 中每行之间的空格来减小文件大小。\n\n本章讨论了通过寻找改进点并将每个部分移动到独立的 JavaScript 文件中并通过 manifest 缓存（manifest\
  \ cache）来重构代码。然后你研究使用如 `head.js` 等优化插件，在页面加载时异步交付 JavaScript 文件的内容。最后，你将确定应用与多个浏览器的兼容性。\n\
  \n在本章中，你对 Corks 代码进行测试、清理和重构。在本章结束时，你应该完成以下工作：\n\n* 组织你的 JavaScript 代码\n* 了解如何使用\
  \ `head.js` 和 manifest 缓存\n* 学习一些移动应用的测试技术\n\n### 组织你的 JavaScript 文件\n\n到目前为止，你一直将所有的\
  \ JavaScript 文件都放在 `index.html` 的底部。这对于开发版本是有好处的，但你还希望根据它们的用途更好地组织这些文件。良好的做法是根据脚本将执行的操作类型创建一个新的\
  \ JavaScript 文件。对于这种场景，你可以按照此处定义的结构进行排序：\n\n```text\nassets\njs\nglobal.js\ndatabase.js\n\
  util.js\nsocial.js\ngeo.js\nhelper.js\n```\n\n这种结构使你能够快速找到想要编辑的操作并组织你的 JavaScript\
  \ 文件。你还能够分离这些文件，以便它们在首次加载时下载得更快。表 11-1 详细列出了这些文件及其用途：\n\n#### 表 11-1 JavaScript\
  \ 文件说明\n\n| 文件名 | 文件说明 |\n| :--- | :--- |\n| `Global.js` | 包含全局变量、`document.ready()`\
  \ 函数以及任何初始化函数。 |\n| `Database.js` | 顾其实名，它持有数据库连接、查询以及任何与数据库交互的函数。 |\n| `Util.js`\
  \ | 此文件包含工具函数，例如确定两个条目之间时间的函数，以及在应用程序中重复使用的其他基础函数，例如 `myStorage`。 |\n| `Social.js`\
  \ |  Corks 与外部源（如 foursquare 和 Twitter）之间的任何社交交互。 |\n| `Geo.js` | 此文件包含所有与地图或地理定位相关的元素。\
  \ |\n| `Helper.js` | 此文件包含用于推文模板库的 `HandlebarsJS` 辅助函数。 |\n\n#### 设置 global.js\n\
  \n`Global.js` 是 HTML 文档中加载的第一个文件。尽管如此，你必须确保它包含 Web 应用启动时需要的所有变量和内容。\n\n专注于在你的全局部分添加以下项目：\n\
  \n* 应用程序启动时运行所需的函数或元素\n* 贯穿应用程序使用的全局变量\n\n以下是处理流程：\n\n1. 将全局变量添加到 `global.js` 顶部。这些变量贯穿应用程序使用：\n\
  \n```javascript\n/* System Variables */\nvar map;\nvar db;\nvar lat;\nvar lng;\n\
  var infowindow = new google.maps.InfoWindow();\n```\n\n2. 在全局变量下方添加关于 `hashchange`\
  \ 事件的代码：\n\n```javascript\n/* Hash Change */\n$(window).bind(‘hashchange’, function(e){\n\
  newHash = window.location.hash.substring(1);\n...\n});\n```\n\n3. 添加包含所有初始化脚本的 `document.ready()`\
  \ 函数：\n\n```javascript\n/* Document Load */\n$(document).ready(function(){\nvar\
  \ user = myStorage.get(“userName”);\nif (user) {\n$(#user_name”).val(user);\n}\n\
  db = openDatabase('myCorks’, ‘1.0’, ‘My Database’, 1024);\n...\n});\n```\n\n这就完成了\
  \ global.js。\n\n### 创建 database.js\n\n此文件包含了所有的查询和与数据库的交互，除了初始化\n\n1. 提取所有与数据库相关的函数。它们包括：\n\
  * `grabActivities()`\n* `viewDetails()`\n* `searchWines()`\n* `get_color()`\n* `addActivity()`\n\
  * `addWine()`\n* `addActivity()`\n\n2. 一旦你从 `index.html` 提取了这些函数，根据之前的结构将它们粘贴到 `database.js`\
  \ 中。\n\n3. 添加你的成功和失败回调，如下：\n\n```javascript\n/* Callbacks */\nfunction sR(a,b) {\n\
  // 查询成功！\n}\nfunction fR(a,b){\n// 哎！出问题了。提示用户。\nalert(b.message);\n}\n```\n\n4.\
  \ 添加所有相关内容后，保存 `database.js` 文件。\n\n### 创建 Util.js\n\n分离所有可重复的函数并将它们添加到 `Util.js`\
  \ 文件中。\n\n从这里开始，提取函数：\n* `last_id()`\n* `handleForm()`\n* `toggleBox()`\n* `timeDifference()`\n\
  * `myStorage`\n* `saveUser()`\n\n将这些函数复制到 `Util.js`以便应用程序访问。如果你愿意，可以轻松地在此文件中添加实用函数。\n\
  \n### 创建 Social.js\n\n每当你向 foursquare 或 Twitter 调用 API 时，你就需要提取相关的函数并将它们放入 `Social.js`\
  \ 文件中。\n\n提取以下函数：\n* `parseTweets()`\n* `findPlaces()`\n\n记住，你只需寻找调用相应 API 的实例。不要在此\
  \ JavaScript 文件中添加包含模板辅助函数的功能，将其将其放在 `helpers.js` 文件中。\n\n### 创建 geo.js\n\n编写地图和地理定位的代码很困难，但组织它们以供后续编辑并不困难。在此文件中，你将添加地理定位和地图设置的初始化和更新。\n\
  \n以下是需要提取的六函数：\n* `refreshLocation()`\n* `drawMap()`\n\n\n\n\n\n- `parseMap()`\n\
  - `getInfoWindowEvent()`\n- `successPosition()`\n- `errorPosition()`\n\n## 创建 helper.js\n\
  \n`helper.js` 文件的目的是提供额外的方法，以帮助 HandlebarsJS 编译你的模板。你之前已经完成了这一步；但此处包含这些代码是为了作为一个提醒：\n\
  \n```javascript\n/* HandlebarsJS Helpers */\nHandlebars.registerHelper('userFull',\
  \ function(tweets) {\n  return tweets.from_user_name + \" (\"+tweets.from_user+\"\
  )\";\n});\n// ....\n```\n\n## 整合\n\n现在你已经将所有内容都放在了单独的 JavaScript 文件中，你需要在 HTML 文件的\
  \ `head` 部分中声明它们。请注意，某些浏览器测试显示，将所有 JavaScript 文件放在 HTML 的页底部可以提高性能，因为 HTML 内容会先加载，然后才是脚本。HTML\
  \ 文档是从上到下加载的。在这种情况下，性能不是一个大问题；但取决于你的应用程序，你可能想看到这种差异。Corks 示例在实际的 HTML 文件中包含非常少的标记，这些标记仅由你的\
  \ JavaScript 填充。同样重要的是，你可以将所有 JavaScript 文件添加到 HTML 文件的末尾以获得更好的性能。这强制主 HTML 文本先加载，随后是\
  \ JavaScript。\n\n要添加 JavaScript 文件，只需在 HandlebarsJS 的 `script` 标签之后输入以下代码段：\n\n\
  ```html\n<script src=\"http://cloud.github.com/downloads/wycats/handlebars.js/handlebars-1.0.0.beta.6.js\"\
  ></script>\n<script src=\"assets/js/global.js\" type=\"text/javascript\" charset=\"\
  utf-8\"></script>\n<script src=\"assets/js/database.js\" type=\"text/javascript\"\
  \ charset=\"utf-8\"></script>\n<script src=\"assets/js/geo.js\" type=\"text/javascript\"\
  \ charset=\"utf-8\"></script>\n<script src=\"assets/js/helper.js\" type=\"text/javascript\"\
  \ charset=\"utf-8\"></script>\n<script src=\"assets/js/util.js\" type=\"text/javascript\"\
  \ charset=\"utf-8\"></script>\n<script src=\"assets/js/social.js\" type=\"text/javascript\"\
  \ charset=\"utf-8\"></script>\n```\n\n搞定！现在你所有的文件都集中存放了，并且你可以轻松检测到每个 JavaScript\
  \ 文件包含哪些函数。这有助于更新和故障排除，并允许易于下载。同样重要的是，有时将所有这些 JavaScript 文件合并可以减少 HTTP 请求次数，但如果你保持\
  \ JavaScript 文件轻量化（意味着文件更少），性能不会对你的应用程序产生不利影响。\n\n#### 加载你的 JavaScript 文件\n\n加载\
  \ JavaScript 文件可能非常耗时，取决于文件的大小。记住，HTML 是从上到下加载的。Web 开发者可以使用工具来帮助在移动设备上加速此过程。\n\n\
  值得注意的是，JavaScript 总是同步加载的，这意味着在 JavaScript 加载期间任何内容都无法加载。这就是为什么——取决于你的应用程序——将 JavaScript\
  \ 文件放置在 HTML 文档的底部可能是非常重要的。然而，我们将讨论另一种替代方案，使用名为 `head.js` 的服务来异步加载 JavaScript 文件。\n\
  \n##### head.js\n\n`head.js` (http://headjs.com/) 是一个 JavaScript 库，允许你与 HTML 的其他部分一起异步加载\
  \ `head` 部分。这可以加快脚本和 CSS 文件的页面加载速度。\n\n要将其添加到你的页面中，请遵循以下步骤：\n\n1. 访问 `headjs.com`\
  \ 页面并点击 Download 链接。你可以复制并粘贴 `headjs` 最新版本的 URL（https://raw.github.com/headjs/headjs/v0.96/dist/head.min.js）。\n\
  2. 在 `index.html` 的 `head` 部分中，`handlebarsJS` 脚本标签下方添加以下代码段：\n\n```html\n<script\
  \ type=\"text/javascript\" language=\"Javascript\" src=\"https://raw.github.com/headjs/headjs/v0.96/dist/head.min.js\"\
  ></script>\n```\n3. 记得你之前添加的那些 `script` 标签吗？你现在将删掉它们，并写一个脚本来处理它们的加载：\n\n```javascript\n\
  <script type=\"text/javascript\" language=\"Javascript\">\n  head.js(\"assets/js/global.js\"\
  , \"assets/js/database.js\", \"assets/js/geo.js\", \"assets/js/helper.js\", \"assets/js/util.js\"\
  , \"assets/js/social.js\");\n</script>\n```\n\n就如此简单！现在页面加载时，你所有的 JavaScript 文件都会加载得更快。虽然你可能在\
  \ Corks 中看不到巨大的改进，但在其他 JavaScript 密集型应用程序中你可能会看到巨大的改进。\n\n## Manifest 缓存 (Manifest\
  \ cache)\n\nManifest Cache 提供了一种简单的方法，为加载在移动设备上的静态文件提供浏览器存储。基础设置很简单。然而，你必须编写代码来检查文件是否已更新。重要的是，你不能同时使用\
  \ `head.js` 和 Manifest Cache；它们提供了无法结合的两种缓存解决方案。\n\n1. 在文档的 `html` 标签中添加以下代码：\n\n\
  ```html\n<html manifest=\"manifest.appcache\">\n```\n如果你正在处理多个页面，你必须在每个页面都包含此内容才能使用缓存。\n\
  2. 创建名为 `manifest.appcache` 的新文件并将其放在项目的根目录下。该文件名需要与 `html` 标签中的相同。\n3. 最后，在该文件中添加以下内容：\n\
  \n```text\nCACHE MANIFEST\nindex.html\nassets/js/*\n```\n\n这将允许缓存 `assets/js` 目录下的所有文件。你可以按照第\
  \ 2 章的示例来缓存更多项目。\n\n`.appcache` 文件的重要部分是它必须以正确的 MIME 类型提供。这可以通过许多方式实现；但最常见的方法是通过\
  \ `.htaccess` 文件设置（如果你使用 Apache 作为 Web 服务器）。只需在根目录下创建一个 `.htaccess` 文件，然后添加以下代码：\n\
  \n```apache\nAddType text/cache-manifest .appcache\n```\n完成后，你就可以 Manifest Cache。要注意，当用户首次访问你的网站并启用了此功能时，所有文件都会下载。这可能会消耗带宽；但一旦文件下载，应用程序的响应速度会快得多。\n\
  \n缓存是在位级别进行的，这意味着如果更改了一个文件，整个 manifest 将重新加载并重新缓存，所以要小心更新应用缓存。\n\n##### 减少你的 JavaScript\
  \ 占用\n\n在构建移动应用程序时，目标是创建小型 JavaScript 文件，以便浏览器可以快速读取并编译运行。减少体积占用的一种方法是使用称为“压缩”（minifying）的过程。\n\
  \n此过程删除所有的“空白”（例如换行和变量之间的空格），并将长 JavaScript 转换为单个字符串。这可以被浏览器轻松读取并减小文件的总体积。除了删除空白，某些提供工具的服务可以将你的变量重写为单个字母，从而减小文件大小。\n\
  \n你可以使用这里的工具来压缩你的 JavaScript：\n\n- http://www.minifyjs.com/javascript-compressor/\n\
  - http://jscompress.com/\n- http://refresh-sf.com/yui/\n\n值得注意的是，你可以压缩 CSS 和 HTML\
  \ 文件来减小文件的总体占用。压缩所有内容的缺点是文件变得难以编辑和更新。你始终应该保留一个压缩后的版本和一个完整版本。\n\n你始终可以使用诸如 JS Beautifier\
  \ (http://jsbeautifier.org/) 的工具来反转压缩，通过展开 JavaScript 使其更于阅读。\n\n\n\n\n\n# 移动测试技术\n\
  \n大多数程序员倾向于编写一次代码后就再也不去修改以优化语法。在编程中，有许多方法可以实现相同的操作；然而，并非所有方法都能提供最佳性能。重构是一种重新审视代码并调整某些方面以获得更好性能的方法。\n\
  \n大多数时候，开发者倾向于根据浏览器测试来重构代码。这是因为看到网页在旧版浏览器上的渲染情况，而这些浏览器在处理 `CSS3` 时可能存在性能问题。Corks\
  \ 应用针对移动设备。在进行测试方法时，请记住以下几点：\n\n-   设备和模拟器测试是完全不同的：确保你在实际设备上测试你的应用，以查看内存占用是否产生影响。例如，某些应用在桌面电脑的\
  \ `Safari` 中运行很流畅，但在移动设备上的渲染效果并不理想。作为开发者，有时很容易忘记移动设备的 CPU 和 RAM 性能。\n\n-   使用支持你用户的\
  \ HTML5 特性和和功能：在构建应用时，请确保你使用了主设备支持的 `HTML5` 特性。例如，由于你在 Corks 中使用了 `Web SQL`，你的应用程序在非\
  \ WebKit 浏览器（如 `Mozilla Firefox`）中将无法运行。也许你在开始构建时就知道这一点，但在测试阶段并没有发现。使用主设备支持的 `HTML5`\
  \ 特性会让你在选择使用工具时变得简单得多。\n\n-   没有鼠标：在桌面上测试 Web 应用时的一个常见问题是，你交互的是鼠标而不是手指。请确保你根据需要的操作交替使用\
  \ `ontouchstart` 和 `onclick` 等函数。`hover`（悬停）属性在移动设备上将无法正常工作。\n\n## 为 corks 进行测试\n\
  \n所以你可能在想如何测试并确保 Corks 在其他浏览器上运行。由于你使用了 `jQuery Mobile`，你可以放心地认为外观测试是成功的，因为它包含了表\
  \ 11-2 所示兼容表中的所有内容。\n\n### 表 11-2 jQuery Mobile 支持\n\n| 操作系统 / 版本 | 批准的设备 |\n| :---\
  \ | :--- |\n| Apple iOS 3.2-5.0 | 已在原始 iPad (4.3 / 5.0)、iPad 2 (4.3)、原始 iPhone (3.1)、iPhone\
  \ 3 (3.2)、3GS (4.3)、4 (4.3 / 5.0) 和 4S (5.0) 上测试 |\n| Android 2.1-2.3 | 已在 HTC Incredible\
  \ (2.2)、原始 Droid (2.2)、HTC Aria (2.1)、Google Nexus S (2.3) 上测试。在 1.5 和 1.6 上功能正常但性能可能缓慢，已在\
  \ Google G1 (1.5) 上测试 |\n| Android 3.1 (Honeycomb) | 已在 Samsung Galaxy Tab 10.1\
  \ 和 Motorola XOOM 上测试 |\n| Android 4.0 (ICS) | 已在 Galaxy Nexus S 上测试。注意：在升级的设备上过渡性能可能较差\
  \ |\n| Windows Phone 7-7.5 | 已在 HTC Surround (7.0)、HTC Trophy (7.5)、LG-E900 (7.5)、Nokia\
  \ Lumia 800 上测试 |\n| Blackberry 6.0 | 已在 Torch 9800 和 Style 9670 上测试 |\n| Blackberry\
  \ 7 | 已在 BlackBerry® Torch 9810 上测试 |\n| Blackberry Playbook (1.0-2.0) | 已在 PlayBook\
  \ 上测试 |\n| Palm WebOS (1.4-2.0) /Palm WebOS 3.0 | 已在 Palm Pixi (1.4)、Pre (1.4)、Pre\
  \ 2 (2.0) 上测试 / 已在 HP TouchPad 上测试 |\n| Firebox Mobile (10 Beta) | 已在 Android 2.3\
  \ 设备上测试 |\n| Chrome for Android (Beta) | 已在 Android 4.0 设备上测试 |\n| Skyfire 4.1 |\
  \ 已在 Android 2.3 设备上测试 |\n| Opera Mobile 11.5 | 已在 Android 2.3 上测试 |\n| Meego 1.2\
  \ | 已在 Nokia 950 和 N9 上测试 |\n| Samsung bada 2.0 | 已在 Samsung Wave 3, Dolphin browser\
  \ 上测试 |\n| UC Browser | 已在 Android 2.3 设备上测试 |\n| Kindle 3 and Fire | 已在各自内置的 WebKit\
  \ 浏览器上测试 |\n| Nook Color 1.4.1 | 已在原始 Nook Color 上测试，而非 Nook Tablet |\n\n测试你的应用程序最大的要求是测试你的支持数据库。`WebSQL`\
  \ 不受 Firefox 或 Opera 支持，因此你的应用程序在这些浏览器无法运行。在这种情况下，你需要让用户知道他们的浏览器不受支持。通过提供一条信息消息来实现。\n\
  \n要执行此操作，请进入你的 `assets/js/global.js`并在 `document.ready()` 函数的开头添加以下代码：\n\n```javascript\n\
  if($.browser.msie || $.browser.firefox) {\n  alert(“This browser is not supported.”)\n\
  \  window.location.href = “http://google.com”;\n}\n```\n\n在这种情况下，你正在使用 `jQuery`\
  \ 的特殊 `browser` 函数来判断浏览器是否为 Internal Explorer 或 Firefox。如果浏览器匹配，用户将收到警报并被重定向离开页面。对于生产应用，需要更优雅的退出方式，但这个示例为你提供了构建更佳解决方案的骨架。\n\
  \n为了支持这些其他浏览器，你需要放弃 `WebSQL` 数据库并使用不包含在 `HTML5` 中的内容。\n\n## 总结\n\n本章向你展示了如何组织 JavaScript\
  \ 文件并揭示了 Web 应用的测试技术。此外，你学会了\n\n- 使用 `Manifest Cache` 存储 JavaScript 文件\n- 使用 `head.js`\
  \ 异步加载脚本文件\n- 使用 `$.browser` 检测浏览器类型\n\n### 第 12 章：准备发布\n\n在本章中，你将采取最后步骤并发布你的应用程序。在章节结束时，你将能够：\n\
  \n- 设置调试工具解决应用中的挂起问题\n- 在点击和触摸处理器之间流畅切换\n- 减少对带宽的需求\n- 提高 JavaScript 和动画性能\n- 优化\
  \ CSS\n\n## 调试技巧\n\n在调试方面，移动应用可能比其桌面版本困难得多：\n\n- 桌面浏览器提供了强大的调试工具，如 Firebug 和 Chrome\
  \ 开发者工具。虽然某些移动浏览器提供某些调试信息，但与非移动浏览器相比仍大相见��。\n- 由于市场上移动设备的种类多样，移动应用通常需要更多的测试用例。\n\
  \n在本节中，你将学习如何设置不同的移动测试环境，使用真实设备和模拟器。你还学习了如何设置开发工具以获取调试信息。以及与报告漏洞的用户的环境相匹配的调试技巧。\n\
  \n### 测试环境\n\n大多数漏洞都可以在你标准的开发浏览器中重现。然而，不可避免会出现某些特定于特定浏览器或操作系统的漏洞。在这种情况下，你需要设置一个与提交漏洞的用户的环境匹配的测试环境。\n\
  \n为了全面测试一个桌面应用，你通常需要两个操作系统（Windows 和 Mac），每个系统包含几个浏览器（IE, Firefox, Chrome, Safari），以及每个器的两个版本（可能是最近的两个）。测试\
  \ 10 个左右的桌面浏览器可能看起来麻烦，但与负责任的移动测试相比，这简直是大小桩。\n\n\n\n\n\n对于移动端，你不仅需要测试各种不同的操作系统、浏览器和版本，还需要在更广泛的设备上进行测试。更糟糕的是，不同设备之间的能力差异是惊人的。\n\
  \n更不用说许多设备制造商会分叉其移动浏览器的代码库。即使两台设备都安装了相同版本的 Android，HTC 设备上的 `Android Browser` 可能与三星（Samsung）设备上的版本是不一样的。\n\
  \n# 创建支持列表\n\n在搭建测试环境之前，重要的是首先要接受你的测试永远不可能 100% 完成。市面上的设备、浏览器、版本甚至用户配置实在太多了。但这并不意味着你不能通过彻底的测试来覆盖绝大多数环境。\n\
  \n确定要支持哪些环境的最佳方法是查看你 App 的分析数据。确定一个你想要达到的的基准百分比（在 95% 到 99% 之间），然后找出你需要哪些设备来支持如此多的用户。这些设备将构成你的支持列表。\n\
  \n如果你正在开发一个新应用，可以使用整体市场份额数据来确定你的支持列表。\n\n# 模拟器和仿真器\n\n在各种真实设备上进行测试很少具有成本效益。尽管如此，你可能需要转向模拟器和仿真器来近似你并不拥有的设备体验。但请务必确保在至少两个真实的移动设备上进行测试，即使你得借朋友的手机。请记住：即使是\
  \ 100% 完美的模拟器也无法给你真实的用户体验感受。\n\n在开始之前，理解模拟（emulation）与仿真（simulation）的区别非常重要：\n\n\
  *   模拟器（Emulators）在你的桌面机器上运行原生设备操作系统（OS），仅进行极小的修改以适应不同的界面（例如，使用虚拟的屏幕按钮来镜像硬件按钮）。\n\
  *   另一方面，仿真器（Simulators）尝试尽可能地模拟原生体验。然而，它们使用了不同的核心。\n*   通常，模拟器比仿真器更准确。\n\n虽然准确不如真实的物理设备测试，但模拟器和仿真器可能更容易使用。这是因为你可以使用桌面机器的硬件键盘。\n\
  \n## iOS 仿真器\n\n对于 iPhone 和 iPad 等 iOS 设备，最好的测试选择是 Apple 发布的官方 iOS 仿真器。\n\n遗憾的是，iOS\
  \ 仿真器仅运行在 Mac OS X 上。如果你不是 Mac 用户，将不得不使用替代方案，例如 [`www.iphone4simulator.com`](http://www.iphone4simulator.com)。\n\
  \n要使用仿真器，首先从 Mac App Store 下载 `Xcode`（它是免费的）。安装 `Xcode` 后，仿真器将隐藏在 `Applications→Xcode→Contents→Developer→Platforms→iPhoneSimulator.platform→Developer→Applications→iOS\
  \ Simulator` 中。或者，你可以创建一个空的 iOS 项目并在 `Xcode` 内部运行测试。\n\n图 12-1 显示仿真器的工作方式与 iOS 设备几乎完全相同；你可以使用\
  \ iOS Safari 甚至可以安装原生应用。你可以在测试 iPhone 和 iPad 之间切换，因此在你任何想要的目标设备上启动 `Safari`，并开始测试\
  \ Corks 应用。\n\n![9781118348161-fg1201.eps](img/9781118348161-fg1201_fmt.png)\n\n\
  图 12-1：正在运行中的 iOS 仿真器。\n\n专业提示：从 Finder 中拖放 HTML 文件并将其释放到仿真器中，即可在 iOS Safari 中打开它们。\n\
  \n### Android 模拟器\n\nAndroid 测试的最佳选择是官方的 `Android Emulator`，它可以作为 Android 软件开发工具包（SDK）的一部分免费下载：[`http://developer.android.com/tools/help/emulator.html`](http://developer.android.com/tools/help/emulator.html)。\n\
  \n与 iOS 仿真器不同，`Android Emulator` 要求为你想要测试的每个设备手动创建测试环境。\n\n因此，第一步是打开 SDK 并创建一个 Android\
  \ 虚拟设备 (`AVD`）。在这里，你可以调整各种设置，例如屏幕尺寸、像素密度和 SD 卡的大小。常见设备设置的列表请参阅 [`http://mobile.tutsplus.com/tutorials/android/common-android-virtual-device-configurations/`](http://mobile.tutsplus.com/tutorials/android/common-android-virtual-device-configurations/)。\n\
  \n设置好 `AVD` 后，在模拟器中测试与在 iOS 仿真器几乎相同：只需启动 Android 浏览器并开始调试。\n\n你可能还想在 Android 和 iOS\
  \ 中测试替代浏览器。要这样做，只需在模拟器或仿真器内部安装这些浏览器即可。\n\n## 其他模拟器和仿真器\n\n除了 iOS 和 Android，你还可以使用额外的模拟器和仿真器在你任何想要支持的环境中测试你的应用。\n\
  \n首先，对于 Nokia 设备，你可以使用 `Nokia Remote Device Access`，它允许你每天免费测试所有 Symbian 和 Nokia\
  \ 设备最多 8 小时：[`http://www.developer.nokia.com/Devices/Remote_device_access`](http://www.developer.nokia.com/Devices/Remote_device_access)。\n\
  \n接下来三星提供了名为 `Samsung Lab.Dev` 的类似服务。在这里你可以免费测试三星 Android 设备：[`http://innovator.samsungmobile.com/bbs/lab/view.do?platformId=1`](http://innovator.samsungmobile.com/bbs/lab/view.do?platformId=1)。\n\
  \n此外，黑色（BlackBerry）为其智能手机和 Playbook 平板提供了多个免费仿真器：[`http://us.blackberry.com/sites/developers/simulators.html`](http://us.blackberry.com/sites/developers/simulators.html)。\n\
  \n最后，如果你想跨广泛的设备进行测试，请考虑使用付费服务 [`www.devicewhere.com`](http://www.devicewhere.com)。虽然昂贵，但这项服务提供了无与伦比的设备测试。\n\
  \n开发工具\n\n在搭建了各种测试环境后，你应该能够重现用户报告的任何 bug。但发现 bug 只是战斗的一半——你还需要修复它。这就是 JavaScript\
  \ 控制台和开发工具大显身手的地方。这些工具允许你：\n\n*   追踪 JavaScript 错误\n*   输出调试信息\n*   分析性能（针对 JavaScript\
  \ 和 HTTP 请求）\n*   调整 CSS 样式\n\n你可能已经熟悉在桌面浏览器中使用控制台，例如 Firebug 或 Chrome 开发者工具。但即使你以前未使用过工具，开始也很简单。\n\
  \n首先，要使用 Web 检查，只需在 Chrome 页面上右键点击元素并选择“检查”。如图 12-2 所示，这不仅显示了源代码树中的元素，还显示了样式信息。你甚至可以使用它来调整\
  \ CSS 样式。\n\n![9781118348161-fg1202.eps](img/9781118348161-fg1202_fmt.png)\n\n图\
  \ 12-2：Chrome 的 Web 检查非常适合调试 CSS。\n\n接下来，切换到 Console 标签页。在这里你可以看到关于 JavaScript 错误的信息以及如何在线运行\
  \ JavaScript。（参见图 12-3。）\n\n![9781118348161-fg1203.eps](img/9781118348161-fg1203_fmt.png)\n\
  \n图 12-3：Chrome 的 JavaScript 控制台提供了有用的调试信息并可以用于 `console.log()`。\n\n最后，切换到 Network\
  \ 标签页。在这里你可以看到 HTTP 资源下载和实例化的详细情况，如图 12-4 所示。\n\n![9781118348161-fg1204.eps](img/9781118348161-fg1204_fmt.png)\n\
  \n图 12-4：Chrome 的网络工具捕捉 HTTP 请求信息。\n\nDOM 检查、JavaScript 控制台和网络请求捕捉只是 Chrome 开发者工具提供的许多功能之一。要更深入地了解\
  \ Chrome 的工具箱，请观看来自 Paul Irish 的视频：[`http://youtu.be/nOEw9iiopwI`](http://youtu.be/nOEw9iiopwI)。\n\
  \n\n\n\n尽管开发工具在桌面浏览器中运行良好，但在移动浏览器中明显非常匮乏。这可能不会立即成为问题，因为大多数 bug 可以在桌面环境中重现。然而，在某个时刻，你无疑需要移动端开发工具，无论是为了移动端特定的\
  \ bug，还是为了双重检查你在桌面浏览器中修复的 bug。\n\n在这些情况下，你可以考虑使用移动浏览器内置的开发工具。例如，在 `iOS Safari` 中，你可以通过`设置`→`Safari`→`高级`→`Web\
  \ 台`来启用控制台，如图 12-5 所示。\n\n![9781118348161-fg1205.eps](img/9781118348161-fg1205_fmt.png)\n\
  \n图 12-5：在 iOS Safari 中启用调试控制台。\n\n然而，原生控制台提供信息非常不完整，如图 12-6 所示。\n\n![9781118348161-fg1206.eps](img/9781118348161-fg1206_fmt.png)\n\
  \n图 12-6：iOS Safari 的控制台仅输出关于 JavaScript 错误的有限信息。\n\n遗憾的是，`iOS Safari` 的控制台甚至没有为错误行号。此外，你无法使用它即时运行\
  \ JavaScript、检查 `DOM` 或利用桌面浏览器中提供的任何其他有用工具。\n\n## 远程开发工具\n\n如你所见，原生移动控制台对调试任何复杂问题几乎毫无用。幸运的是，像\
  \ `Weinre` 这样的远程控制台为移动应用提供了桌面调试工具的功能。\n\n`Weinre` 为移动设备暴露了整个 `WebKit` 开发者工具。这意味着你可以利用在桌面浏览器中使用的调试技巧。\n\
  \n唯一的缺点是 `Weinre` 的设置稍微有点复杂。这是因为它实际上并没有运行在移动设备上，而是运行在你的桌面机器上。`Weinre` 为调试信息设置了一个中继站，这些信息从移动浏览器发送并由其接收，如图\
  \ 12-7 所示。\n\n![9781118348161-fg1207.eps](img/9781118348161-fg1207_fmt.png)\n\n\
  图 12-7：使用 Weinre，你在移动设备上进行测试，但在桌面机器上使用开发者工具。这里桌面版 Chrome 的控制台影响着 iPhone 上的页面。\n\n\
  要使用 `Weinre`，你需要设置一个 `Node` 服务器来中继调试信息。幸运的是，你不需要成为硬核的服务器管理员来设置它。只需遵循以下简单步骤：\n\n\
  1. 首先，你需要在本地机器上安装 `Node` 服务器和 `Node` 包管理器（`NPM`）。\n   - Mac 和 Linux 安装：[`http://dandean.com/nodejs-npm-express-osx`](http://dandean.com/nodejs-npm-express-osx)\n\
  \   - Windows 安装：[`http://dailyjs.com/2012/05/03/windows-and-node-1`](http://dailyjs.com/2012/05/03/windows-and-node-1)\n\
  \n   如果你想避免设置 `Node` 服务器，可以使用替代方案如 `Firebug Lite`。然而，`Firebug Lite` 运行在实际移动设备上，这使得在开发工具中输入更具挑战性，并且会偏偏性能测试。\n\
  \n2. 通过 `NPM` 安装 `Weinre`，在命令行输入：\n```bash\nsudo npm -g install weinre\n```\n\n\
  3. 现在，从命令行启动 `Weinre` 服务器：\n```bash\nnode path-to-weinre-node/weinre --boundHost\
  \ –all-\n```\n\n`Weinre` 应该已经安装在你的 node 目录下，路径为 `node_modules/weinre/weinre`。\n\n\
  在这里你将 `boundHost` 设置为 `-all-`。这是重要的，因为你可能需要在具有不同 IP 的设备上进行调试。\n\n有关 `Weinre` 的完整列表，请参见\
  \ [`http://people.apache.org/~pmuellr/weinre/docs/latest/Running.html`](http://people.apache.org/~pmuellr/weinre/docs/latest/Running.html)。\n\
  \n4. 在你的测试页面中添加一个 script 标签，将其设置为调试目标：\n```html\n<script src=\"http://a.b.c:8080/target/target-script-min.js\"\
  ></script>\n```\n\n在这里，将 `http://a.b.c:8080/` 替换为本地 `Weinre` 服务器的位置（它运行在你的桌面机器上）。\n\
  \n现在 `Weinre` 应该设置好了。只需在移动设备上打开该页面，并将桌面机器上的浏览器路由到 [`http://localhost:8080/client`](http://localhost:8080/client)。如果一切顺利，你应该看到两个绿色的\
  \ IP 地址，一个用于远程目标（移动设备），另一个用于远程客户端（桌面机器）。见图 12-8。\n\n![9781118348161-fg1208.eps](img/9781118348161-fg1208_fmt.png)\n\
  \n图 12-8：当目标和客户端 IP 均为绿色时，表示 Weinre 已连接。\n\n你需要一个基于 `WebKit` 的浏览器（如 `Chrome` 或 `Safari`）来\
  \ `Weinre`。\n\n现在你可以使用 `Weinre` 中的工具进行调试了。\n\n![9781118348161-fg1205.eps](img/9781118348161-fg1205_fmt.png)\n\
  \n\n\n\n尽可能避免使用图片的同时，你还应该确保应用中的文件尽可能小。通过一些简单的小技巧就可以产生显著的差异，通常可以将非图像文件的大小缩小 75% 以上。\n\
  \n#### 压缩化（Minification）与 Gzip\n\n首先，确保你对任何可以压缩的进行进行压缩处理：CSS、JavaScript 和 HTML。压缩化会移除文件中所有不必要的空格，并显著减小文件大小。\n\
  \n为了对文件进行压缩化，我们建议使用 YUI 压缩器和命令行。但如果你不熟悉命令行，也有多种基于 Web 的压缩工具，例如在 `http://refresh-sf.com/yui//`\
  \ 可以找到它们。\n\n接下来，确保对所有已压缩的文件进行 gzip 处理。Gzip 能够处理已经压缩的文件并使其变得更小，通常可将其大小缩小 60% 到 85%。压缩文件后，请确保使用正确的\
  \ HTTP 请求头来传输它们：\n\n- `Content-Encoding` 应该是 `gzip`。\n- `Content-Type` 应该匹配文件类型（例如，`text/css`、`text/js`、`text/html`）。\n\
  \n### 静态资源\n\n最后，从独立的子域名提供静态资源是一个好主意。这是因为任何在你的主域名上提供的文件不仅包含文件数据，还包含 HTTP 头部数据。头部数据包含了来自网站的所有\
  \ Cookie 以及其他不应随每张图片、样式表或 JavaScript 文件一同传输的冗余。\n\n通过手动设置子域名或利用如 Amazon S3 等 CDN，从不同的域名提供图像、样式表和\
  \ JavaScript，以避免额外的字节消耗。\n\n### 用户代理重定向（User agent redirection）\n\n最后，如果你提供的是应用的独立桌面版本，你将会遇到额外的带宽问题。这是因为桌面应用通常包含更多内容，因为它们有更大的屏幕空间可以利用。这些多余的内容可以通过\
  \ CSS 媒体查询轻松隐藏；然而，这通常不是最佳方法。\n\n这是因为被 CSS 隐藏的内容仍然会被用户的设备下载，即使标记从未被渲染。这会导致大量的冗余，并对移动端带宽造成不必要的压力。\n\
  \n通常情况下，利用用户代理重定向是一个好主意，将移动用户重定向到独立的移动子域名，该子域名提供精简的、针对移动端的标记。\n\n你还可以提供仅包含移动端所需样式的精简\
  \ CSS。\n\n尽管这种方法相对简单，但用户代理重定向在实践中实际上相当复杂。这是因为新的设备和浏览器在不断发布，使得可能的用户代理列表不断扩大。\n\n\
  此外，某些设备会伪造桌面浏览器的用户代理字符串。例如，某些移动设备会假装成桌面浏览器，以欺骗网站为其提供功能完整的非移动站点。这种欺骗让设备看起来更好，因为它提供了更丰富的浏览体验（即使这种体验更慢，且最终对用户更糟糕）。\n\
  \n维护一个完全最新的用户代理列表充其量是徒劳。幸运的是，许多用户代理服务可以为你完成工作：\n\n- Detect Mobile Browsers, `www.detectmobilebrowsers.com`:\
  \ 提供多种语言的基础移动重定向。\n- MobileESP, `http://blog.mobileesp.com/`: 用于移动设备检测 PHP 和 JavaScript\
  \ API。\n- WURFL, `http://wurfl.sourceforge.net`: WURFL 是一个经常更新的 XML 文件，提供了移动设备及其各个能力的细粒度信息。\n\
  \n如果你只需要基础移动重定向，请使用来自 `www.detectmobilebrowsers.com` 的脚本之一。\n\n如果你使用 Apache 服务器，最佳选项是使用\
  \ Apache 脚本，这是一个 `.htaccess` 脚本，它会将任何移动浏览器重定向到你的移动子域名。只需将代码中的 `http://detectmobilebrowser.com/mobile`\
  \ 替换为你的子域名，然后将其添加到网站的 `.htaccess` 文件中。\n\n在此处使用 Apache 脚本是一个好主意，因为它的效率最高。JavaScript\
  \ 版本可能会引起比解决的问题更多的带宽问题，因为在脚本启动并将用户重定向到移动站点之前，用户就会开始下载整个网站页面了。\n\n#### JavaScript\
  \ 优化\n\n除了减少带宽外，移动设备还受到处理器性能不佳的影响。这意味着你需要优化你的 JavaScript，特别是在像 Corks 这样高度交互的应用中。\n\
  \n### 关注巨大的性能收益\n\n你可以从字面上来说对你的应用进行无限优化。然而，与其重构整个代码库，难道不是更愿意确定那些你可以获得最大收益的问题区域吗？\n\
  \n一个重要的教训是，你应该少地进行预优化。这意味着你不应该盲目地遍历 Corks 应用，更改每一段可能运行得更快的 JavaScript。这样的优化会导致代码库变得杂乱且难以阅读（更不用说额外的开发耗时了）。\n\
  \n相反，你应该只在注意到实际问题后才对代码进行优化。例如，在测试应用时，你可能会发现某个部分的运行速度比你希望的慢。\n\n现在你缩小了想要改进的应用部分，你仍然可以更智能地进行优化。是否存在任何被重复调用的循环或函数？首先查看这些部分，因为每次改进都会由于调用次数而倍增。\n\
  \n除了你代码中显式调用的循环外，你还应该注意任何由 `jQuery` 调用的隐藏循环。例如，`jQuery.animate()` 可能像是一个单一函数，但它设置了一个在动画持续期间被重复调用的间隔。\n\
  \n### 触发硬件加速\n\n硬件加速是优化移动设备上卡顿 JavaScript 动画的极佳方法。我喜欢的优化技术之一；它不仅容易实现，而且能够显著带来性能收益。\n\
  \n性能提升并不是让动画更快，而是让它更流畅。这是因为更好的性能允许浏览器更快地渲染动画帧。更多的渲染帧意味着更高的帧率。\n\n硬件加速将渲染任务从通用处理器（CPU）移出，并将其载到图形处理器（GPU）。这减轻了经常负荷过重的\
  \ CPU，并且在显卡上实现了渲染，而显卡更适合这些特定任务。\n\n幸运的是，在 WebKit 浏览器（如 iOS Safari 和 Android 浏览器）中触发\
  \ GPU 处理是非常容易的。要为 DOM 中的任何元素添加硬件加速，只需附加以下 CSS：\n\n```\n-webkit-transform: translateZ(0);\n\
  ```\n\n在不同版本的 Android 和 iOS（甚至是相同版本的不同 Android 设备）上使用实验性 CSS 属性时要小心。浏览器支持可能缺失，因此彻底测试你的应用是重要的，并在适用情况下接受性能降级问题。\n\
  \n这段代码为元素设置了 3D 变换；然而，由于它在 z 轴上平了 0 个单位，它实际上留在原地。这并没有修改外观，但它欺骗了浏览器认为它正在渲染 3D。因此，如果设备拥有\
  \ GPU，它将会被用于渲染该元素。\n\n现在，不要将这种技巧应用于 DOM 中的每一个元素上。大多数静态元素不需要这种处理，你不应该让 GPU 过载，否则在实际需要硬件加速的情况下，它将无法为你提供帮助。\n\
  \n这种技巧对于任何频繁动画的元素都是理想的。如果你注意到动画很卡顿，那是使用这种技术的完美时机。\n\n\n\n\n\n# 在 iOS 中全屏显示\n\n在第\
  \ 5 章中，你学习了如何使用 iOS 中的 `UIWebView` 为你的应用提供全屏体验。虽然全屏模式对用户体验（UX）的影响显而易见，但它也引入了一些更为微妙的性能问题。\n\
  \n`UIWebView` 被用于全屏 Web 应用，以及 App Store 中的某些原生应用。\n\n与 Mobile Safari 不同，`UIWebView`\
  \ 无法利用极快的 Nitro JS 引擎。这意味着如果用户收藏了你的应用并从主屏幕启动，你的 JavaScript 运行速度会更慢。\n\n苹果公司决定在 `UIWebView`\
  \ 中禁用 Nitro JS 引擎的原因似乎是安全性。Nitro 性能改进最大的点之一源于“即时”（JIT）编译。`JIT` 需要能够将 RAM 中的内存页标记为可执行的权限，这与\
  \ iOS 的核心安全措施背道而驰。\n\n尽管 iOS 乐于授予 Mobile Safari 这些权限，但并不希望将相同的权限扩展到主屏幕上的 Web 应用。这些应用在设备上作为原生应用运行，同时利用外部源的远程数据。在苹果的\
  \ iOS 应用“围墙花园”模型中，向此类应用授予这种访问权限是完全不可接受的。\n\n# jQuery 中的对象缓存\n\n提高 JavaScript 性能的另一种常见技术是将任何你复用的对象缓存为局部变量。例如，想象你必须深入一个对象内部以查找如\
  \ `foo.bar.blah` 的引用。如果你最终频繁引用此内部项，可以通过将其缓存为变量来节省处理能力：\n\n```javascript\nvar localBlah\
  \ = foo.bar.blah;\n// 执行你想对 localBlah 进行的任何操作\n```\n\n这种技术曾经能产生显著差异，但此后浏览器已经对深度对象查找进行了大量优化。因此，你通常不需要费心于这种类型的缓存。\n\
  \n然而，在某些领域缓存仍然能产生实质性的影响。特别是在 jQuery DOM 引用中，例如：\n\n```javascript\n$(‘div.special’).hide();\n\
  $(‘div.special’).addClass(‘blah’);\n```\n\n虽然 jQuery 的 Sizzle 引擎已对这类引用进行了大幅优化，但\
  \ DOM 查找仍然是该库中运行最慢的过程之一。因此，你应该尽可能避免重复 DOM 查找。\n\n在上述的示例中，你可以利用 jQuery 链式调用来消除对该元素的第二次引用：\n\
  \n```javascript\n$(‘div.special’).hide().addClass(‘blah’);\n```\n\n这对于在某个元素上连续调用多个方法的情况非常棒。但在其他情况下，你会在整个代码中多次引用给定元素。在这些情况下，你应该缓存查找：\n\
  \n```javascript\nvar $elem = $(‘div.special’);\n$elem.hide();\n//...........\n$elem.addClass(‘blah’);\n\
  ```\n\n现在下次当你引用此元素时，将能够跳过查找。注意添加到 `$elem` 之上的 `$` 模式——这是一种表示该变量代表 DOM 引用的常用做法。\n\
  \n当然，有些时候你可能不想缓存 DOM 查找——例如，当元素集合发生变化时。\n\n# 测量 JavaScript 性能\n\n大多数开发任务可以通过一种一种方式完成。在不同方法之间做出选择时，确定哪种方法对性能最优通常会有帮助。\n\
  \n对于简单的 A/B 测试，请使用基准测试，例如 JSPerf (`www.jsperf.com`) 提供的测试工具。JSPerf 允许你设置两个脚本，然后在你正在测试的设备的浏览器中运行它们。测试结果将显示哪个脚本执行得最快，如图\
  \ 12-10 和 12-11 所示：\n\n![9781118348161-fg1210.eps](img/9781118348161-fg1210_fmt.png)\n\
  \n图 12-10：JSPerf 上的基础基准测试。在此测试中，缓存的 DOM 引用最快。\n\n![9781118348161-fg1211.eps](img/9781118348161-fg1211_fmt.png)\n\
  \n图 12-11：你可以使用 JSPerf 轻松比较不同的浏览器和环境。只需对每个测试的浏览器运行性能测试，JSPerf 就会保存结果以便比较。\n\n对于更复杂的测试，为了能够在在正在构建的应用程序内部进行测试，可以使用\
  \ Chrome 开发者工具中的 Timeline（时间轴），如图 12-12 所示：\n\n![9781118348161-fg1212.eps](img/9781118348161-fg1212_fmt.png)\n\
  \n图 12-12：此 Timeline 显示了处理页面不同方面所需的时间。\n\nTimeline 显示了各种有用信息。如果你只关心 JavaScript 处理，只需取消除\
  \ Scripting（脚本执行）之外的所有选项。\n\n#### CSS 优化\n\n尽管你最可能通过优化带宽或 JavaScript 获得更大的性能提升，但\
  \ CSS 优化也可以为你的应用提供值得的性能改进。\n\nCSS 性能是出了名的难以测试，因此你大部分必须依赖定性评估，例如应用看起来是否更快。\n\n# 使用\
  \ CSS 代替 JavaScript 动画\n\n你已经学会了如何利用硬件加速来提高性能并让动画更平滑。然而，你可以更进一步，通过完全避免使用 JavaScript\
  \ 让你的动画更加平滑。\n\nCSS3 可用的新功能之一是动画，通过平滑过渡（transitions）和关键帧动画（keyframes animations）实现。这种方法让动画直接在渲染器中执行，而不是在\
  \ JavaScript 线程中执行。这种方法的优点是由于动画直接在渲染器中执行，它们不会阻塞主线程，从而使动画更加流畅。\n\n- 动画在 CSS 中可能比\
  \ jQuery 方案更笨拙。\n- CSS 动画在处理复杂逻辑时可能不如 jQuery 方案灵活。\n- CSS 动画在旧版 iOS/Android 设备上不支持，它们将退化为静态样式变化。如果动画至关重要，你也可以提供\
  \ jQuery 回退。\n\n例如，假设你想让一个 `div` 滑出窗口同时将其淡出。在 jQuery 中，你可能会写：\n\n```javascript\n\
  $(‘.my-div’).animate({\n  left: 3000,\n  opacity: 0\n}, 1000, ‘swing’);\n```\n\n\
  此脚本将 `div` 向左移动 3000 像素并在秒内淡出，使用了 `swing` 缓动函数。很快你会发现，可以使用 CSS 重这些动画的所有方面。\n\n实现此目标最简单的方法是使用\
  \ CSS 过渡。首先，为元素设置一个新类 `.hidden`：\n\n```css\n.my-div.hidden {\n  left: 3000px;\n\
  \  opacity: 0;\n}\n```\n\n接下来，在元素上设置过渡：\n\n```css\n.my-div {\n  -webkit-transition:\
  \ all 1s ease;\n  -moz-transition: all 1s ease;\n  transition: all 1s ease;\n}\n\
  ```\n\n在这里，你设置了过渡来平滑动画该元素的任何 变化（利用了针对不同浏览器的厂商前缀）。在此过渡中，你镜像了 jQuery 动画的属性：1 秒的持续时间，以及\
  \ `ease` 计时函数。\n\n最后，为了触发动画，使用 jQuery 应用该类：\n\n```javascript\n$(‘.my-div’).addClass(‘hidden’);\n\
  ```\n\n现在，只需添加这个类名即可触发动画，这在移动设备上看起来会要平滑得多。然而，它仍然有许多缺点：\n\n\n\n\n\n- 相同的过渡效果将应用于此元素上的任何样式更改。尽管你可以限制哪些属性发生过渡（甚至为不同的属性设置不同的过渡），但你无法针对每个情况逐个使用不同的动画。例如，如果你想让此元素渐隐淡入，它也必须在\
  \ 1 秒的持续时间内完成。\n- 回调函数在与过渡一起使用时可能会变得复杂。过渡规范提供了一个 `animationEnd` 事件处理程序，它会在过渡完成后触发。然而，该事件会在每个属性的每次过渡时都触发。在之前的示例中，它会触发两次——分别针对\
  \ `left` 和 `opacity` 的过渡过渡触发。\n- 这种方法可能导致架构不佳，因为动画任务被交给了 CSS。当与 `animationEnd` 句柄中的回调结合使用时，这个问题会变得更加严重。\n\
  \n如果你需要动画具有更强的通用性，可以使用关键帧动画（keyframe animation）来代替过渡。\n\n## 避免重流（Reflow）\n\n重流（Reflow）是一个技术术语，描述浏览器在渲染过程中如何在页面上布局元素。该过程不仅发生在页面初始加载时，还发生在页面上任何内容变化并需要重新渲染布局时。\n\
  \n即使页面没有任何交互内容，页面也很少避免额外的重流。这是因为重流不仅受页面标记的影响，还受 CSS 的驱动。\n\n例如，如图 12-13 所示，在文本块旁边有一张图片。在页面初始加载时，浏览器尚未下载此图片，因此它不知道它的尺寸将会是多少。然而一旦下载完成，浏览器需要足够的空间来容纳图片，因此它会将后续内容向下推。\n\
  \n![9781118348161-fg1213.eps](img/9781118348161-fg1213_fmt.png)\n\n图 12-13：图像首先被设置为任意的占位符尺寸，然后在下载完成后跳到实际尺寸。\n\
  \n你可以通过在 CSS 或标记中为图像设置显式尺寸来避免这种重流。只需定义它的高度和宽度，浏览器在图片下载之前就知道该使用什么尺寸了。\n\n避免重流的另一种方法是通过绝对定位。根据定义，具有绝对位置的元素不会影响其他元素的布局。因此，你可以通过向其包装器添加绝对位置来对给定部分的重流进行“沙箱化”（例如，在较小的范围内隔离重流）。\n\
  \n## 避免昂贵的属性\n\n移动设备通常支持 CSS3 中提供的新功能。然而，这可能一把双刃剑，因为这些功能通常更难处理，而这些性能有限的设备会加剧这个问题。\n\
  \n之前，你学习了如何使用 CSS 避免图片并大幅减少应用的带宽需求。但请记住，这些 CSS 属性需要额外的处理能力。\n\n例如，许多 Android 设备即使在使用\
  \ `border-radius` 这样简单的属性也会出现性能问题。对于这些设备，请决定你是否愿意降级到更简单的样式（直角），如果没有，请确定避免图片带来的带宽收益是否足以抵消处理上的劣势。\n\
  \n`border-radius` 仅仅是冰山一角。处理器密集型属性包括 `gradient`、`box-shadow`、`text-shadow` 和 `transform`\
  \ 等。这些属性可能是你的应用程序样式中不可或缺的，但你需要在各种设备上测试它们的性能，并确定在出现问题时你愿意做出何种妥协。\n\n## 总结\n\n在本章中，你首先学习了如何在原生设备和设备模拟器上设置测试环境。然后，你学习了如何利用原生工具以及\
  \ Weinre 进行远程调试来设置调试工具。此外，你还学习了如何在触摸事件和鼠标事件之间流畅切换，以使桌面调试变得更容易。\n\n接下来，你学习了移动性能优化。你学习了如何通过使用\
  \ CSS 代替图片来减少带宽需求、正确优化文件以及提供独立的移动站点。你学习了如何优化 JavaScript——在卡顿的动画中触发硬件加速、缓存过度使用的 DOM\
  \ 引用以及测试不同的方法。最后，你学习了如何优化 CSS——使用 CSS 动画代替 JavaScript、减少浏览器重流并避免过度开销（昂贵）属性。\n\n\
  ### 附录：HTML5、CSS3 和 JavaScript 概念\n\n本附录解释了如何使用：\n\n- HTML5 结构元素以改进语义化\n- 地理位置（Geolocation）精确定用户在全球的位置\n\
  - DOM 存储用于保存可以在应用程序中不同页面之间使用的变量\n- 缓存清单（Cache manifest）即使在应用程序离线状态下也能为应用提供核心功能\n\
  - CSS3 投影投影、渐变和动画来美化页面\n- 多点触摸事件和复杂的触摸手势创建更好的用户体验\n- jQuery 框架、AJAX 和 JSON 构建你的动态应用\n\
  \n所有这些主题在本书的不同章节中都讨论过。本附录旨在提供对核心功能的更深入理解。你可以在构建应用程序时将其引用。\n\n## HTML5\n\nHTML5 引入了多种新功能，丰富了网站并简化了开发。\n\
  \n### 标记\n\nHTML5 引入了几个新元素，使标记更具语义化。这些标签（例如 `<header>` 和 `<footer>`）使代码对人类和机器更易读。这意味着不仅更容易开发，而且更容易被搜索引擎解析器识别。\n\
  \n你可能认为语义化标记对你的访问者没有影响，但这些标签也提高了性能。这是因为给定类型的元素越少意味着工作量越少。虽然在桌面浏览器上的性能提升可能看起来微不足道，但对于性能有限的设备来说，任何改进都是重要的的。\n\
  \n### 结构元素\n\n随着万网网联盟（W3C）完善规范细节，HTML5 结构元素的数量正在增加。以下是一些更有用标签的不完整列表：\n\n- `<header>`\
  \ 和 `<footer>`：用于页面的顶部和底部内容。这些通常是不同页面之间不改变的部分。\n- `<nav>`：用于任何导航元素（例如，头部中的主 `nav`）。遗憾的是，没有官方的\
  \ `nav` 项目元素（`<ni>`），所以你只能在 `<nav>` 中放入一个 `<ul>`。\n\n```html\n<nav>\n  <ul>\n  \
  \  <li><a href=\"#\">链接 1</a></li>\n    <li><a href=\"#\">链接 2</a></li>\n    <li><a\
  \ href=\"#\">链接 3</a></li>\n  </ul>\n</nav>\n```\n- `<section>`：用于指示页面的某个部分——例如，页面的主内容区域或\
  \ `<section class=\"sidebar\"></section>`。这些元素应该被用于页面上所有较大的块，而将 `<div>` 元素留给构成每个语义部分的较小组件。\n\
  - `<article>`：用于博客、新闻源、杂志等处的单体文章。考虑到这些类型网站的倾向性，该元素是合乎逻辑的，但它对你的应用程序可能可能用，也可能没用。\n\
  - `<aside>`：用于指示与其他内容仅有间接关联的内容。此标签对于搜索引擎特别重要，因为它们试图解析你页面的语义内容。因此，正确使用此标签在理论上可以提高搜索引擎排名。\n\
  \n### 语义简化\n\n此外，HTML5 规范提供了许多简化你标记的方法。\n\n- `DOCTYPE`：首先，HTML5 的 `doctype` 尽可能简单：\n\
  \n```html\n<!DOCTYPE html>\n```\n\n任何用过旧版 doctype 声明的人，记住它们几乎是不可能的。例如：\n\n\n\n\n\
  \n<!DOCTYPE html PUBLIC “-//W3C//DTD XHTML 1.0 Transitional//EN” “http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd”>\n\
  \n## JavaScript 和 CSS\n\n• JavaScript 和 CSS: HTML5 还允许在脚本声明中使用更简便的格式。你不再需要包含 `type=”text/javascript\"\
  `：\n\n```html\n<script src=”my-script.js”></script>\n```\n\n此外，`link` 和 `style`\
  \ 声明也不再需要 `type=”text/css\"`：\n\n```html\n<link rel=”stylesheet” href=”my-stylesheet.css”\
  \ />\n<style></style>\n```\n\n考虑到这些元素大多数时候都在定义 JavaScript 或 CSS，因此将这些文件类型视为默认值是合理的。\n\
  \n## 使用 HTML5 Shiv 进行备份\n\n使用 HTML5 元素的一个缺点是旧版浏览器不识别它们。虽然它们不会报错，但问题在于你附加到元素上的任何\
  \ CSS 样式将无法被识别。\n\n如今，唯一不支持 HTML5 标记的相关的浏览器只有 Internet Explorer (IE) 8 及其以下版本。由于这影响的移动设备比例相对较小，如果你只想提供移动端体验，可以忽略这项技术。然而，如果你在为移动应用提供\
  \ Web 体验，那么为不支持的浏览器提供回退方案是一个好主意。\n\n幸运的是，在不支持的浏览器中让 HTML5 元素工作很容易。首先，你可以通过 `JavaScript`\
  \ 在 head 中手动添加你使用的任何元素：\n\n```html\n<script>\ndocument.createElement(‘header’);\n\
  document.createElement(‘footer’);\ndocument.createElement(‘nav’);\ndocument.createElement(‘section’);\n\
  document.createElement(‘article’);\ndocument.createElement(‘aside’);\n</script>\n\
  ```\n\n或者你可以使用 HTML5 Shiv，这是一段添加这些元素及其默认样式的脚本。只需在文档 head 中引入 [`http://code.google.com/p/html5shiv/`](http://code.google.com/p/html5shiv/)\
  \ 中的脚本，你的 HTML5 标签就可以在所有浏览器中正常工作。\n\n然而，无论你使用哪种方法，避免在已经支持 HTML5 的浏览器中执行任何操作都是明智的。毕竟，大多数浏览器原生支持这些元素，因此没有必要增加额外的工作。\n\
  \n如今，在 HTML5 结构化元素上有问题的相关浏览器只有 IE 8 及以下版本。因此，你可以将 HTML5 Shiv 封装在 IE 条件判断中：\n\n```html\n\
  <!--[if lt IE 9]>\n<script src=”path-to/html5shiv.js”></script>\n<![endif]-->\n\
  ```\n\nshiv 和 shim 之间有什么区别？正如 HTML5 Shiv 网站上的回答所说：“没有区别：一个有一个 m，另一个有一个 v——仅此。”\n\
  \n## 地理定位 (Geolocation)\n\n移动端最重要的 HTML5 特性之一是地理定位。`GeoLocation API` 允许你利用设备的全球定位硬件（如果可用）。这允许你将用户放置在地球仪上，并提供与位置相关的内容。\n\
  \n### 检测支持情况\n\n在调用 `GeoLocation API` 之前，良好的做法是检查它是否存在。在你的 `JavaScript` 中：\n\n```javascript\n\
  if ( “geolocation” in navigator ) {\n  // 你想做的任何定位相关操作\n}\n```\n\n这种方法确保你避免在不支持的浏览器中抛出错误。\n\
  \n### 查找用户位置\n\n在确定支持地理定位后，可以使用它来识别用户的位置。要做到这一点，使用 `getCurrentPosition`：\n\n```javascript\n\
  if ( “geolocation” in navigator ) {\n  navigator.geolocation.getCurrentPosition(function(position)\
  \ {\n    var userLatitude = position.coords.latitude,\n    userLongitude = position.coords.longitude;\n\
  \  });\n}\n```\n\n如你在前面的脚本所示，`navigator.geolocation.getCurrentPosition` 接受一个回调函数，该函数返回用户的纬度和经度。\n\
  \n即使用户的设备不支持全球定位（例如台式电脑），`GeoLocation API` 也会根据个人的 IP 地址对其位置进行最佳推测。\n\n### 获取更相关的位置\n\
  \n虽然用户的纬度和经度对于与 `Google Maps API` 等其他 API 交互非常有用，但它们对你或用户可能并不相关。幸运的是，许多免费服务可以将此信息转换为城市和国家（如果需要，甚至是地址）。\n\
  \n有关如何使用 `Google Maps API` 执行此操作的更多信息，请访问 [`http://stackoverflow.com/questions/3918412/city-by-gps-location-latitude-longitude/`](http://stackoverflow.com/questions/3918412/city-by-gps-location-latitude-longitude/)。\n\
  \n### 随时间跟踪用户位置\n\n`getCurrentPosition` 用于一次性位置查找，但 HTML5 还规定了一个可以使用它来随时间跟踪位置变化的\
  \ API：\n\n```javascript\nif ( “geolocation” in navigator ) {\n  navigator.geolocation.watchPosition(function(position)\
  \ {\n    var userLatitude = position.coords.latitude,\n    userLongitude = position.coords.longitude;\n\
  \  });\n}\n```\n\n`watchPosition` 的工作原理与 `getCurrentPosition` 非常相似，它接受一个回调并向其传递用户的位置数据。唯一的区别是\
  \ `watchPosition` 在用户位置发生变化时反复触发此回调。\n\n虽然你可以使用超时和 `getCurrentPosition` 实现类似的功能，但\
  \ `watchPosition` 提供了几个优势。\n\n### 停止位置跟踪\n\n当你的应用完成后，你也可以卸载 `watchPosition`。要这样做，首先为监听函数定义一个变量：\n\
  \n```javascript\nif ( “geolocation” in navigator ) {\n  var myWatch = navigator.geolocation.watchPosition(function(position)\
  \ {\n    var userLatitude = position.coords.latitude,\n    userLongitude = position.coords.longitude;\n\
  \  });\n}\n```\n\n现在你可以随时使用 `clearWatch` 卸载它：\n\n```javascript\nif ( “geolocation”\
  \ in navigator ) {\n  navigator.geolocation.clearWatch(myWatch);\n}\n```\n\n## DOM\
  \ 存储 (DOM storage)\n\n另一个让 Web 应用开发更简单的 HTML5 特性是本地存储 (local storage)。本地存储允许你保存跨越网站不同页面的持久\
  \ JavaScript 变量。这意味着这些数据在整个站点中都可用，甚至在用户稍后返回时也是如此。\n\n直接在浏览器中保存有关用户访问的数据有许多原因是有优势的。主要是，它避免了将用户数据作为会话数据保存在服务器上的经典模式（这通常涉及后端服务器以及数据库）。\n\
  \n### 使用本地存储\n\n使用本地存储非常简单。首先，保存一个项目，使用 `setItem`：\n\n```javascript\nlocalStorage.setItem(“myVar”,\
  \ “My Value”);\n```\n\n接下来，获取这些数据，使用 `getItem`：\n\n```javascript\nlocalStorage.getItem(“myVar”);\n\
  ```\n\n无论你是在本次会话还是以后访问这些数据，它都将返回 `“myValue”`。\n\n最后，要删除数据并将其从内存中移除，使用 `removeItem`：\n\
  \n```javascript\nlocalStorage.removeItem(“myVar”);\n```\n\n### 使用会话存储 (session storage)\n\
  \n会话存储的工作原理与本地存储完全相同。区别在于当用户关闭浏览器窗口或离开网站时，数据会被丢。因此，虽然本地存储数据在多次访问中持续存在，但会话存储更适合保存更动态或短暂的数据。\n\
  \n除此之外，使用会话存储没有区别——你可以使用与本地存储相同的所有函数：\n\n```javascript\nsessionStorage.setItem(“myVar”,\
  \ “My Value”);\n// 弹出显示值\nalert( sessionStorage.getItem(“myVar”) );\n// 从存储中移除\n\
  ```\n\n\n\n\n\n```javascript\nsessionStorage.removeItem(\"myVar\");\n```\n\n###\
  \ 更简单的语法\n\n你也可以像操作 JavaScript 对象一样访问本地存储和会话存储。例如：\n\n```javascript\nlocalStorage.myVar\
  \ = \"My Value\";\n```\n\n```javascript\n// 弹出值\nalert( localStorage.myVar );\n\
  ```\n\n```javascript\n// 从存储中删除它\ndelete localStorage.myVar;\n```\n\n### 使用 DOM\
  \ 存储保存数组和对象\n\n本地存储和会话存储仅适用于键值对，例如将单个变量定义为字符串、数字或 `Boolean` 值。然而，如果你需要存储数组或对象，可以使用\
  \ `JSON.stringify` 轻松地将它们转换为字符串：\n\n```javascript\nvar myArr = [];\nmyArr[0] = \"\
  blah\";\nmyArr[1] = \"blah 2\";\nlocalStorage.myArr = JSON.stringify(myArr);\n```\n\
  \n接下来每当你从本地存储中检索数据时，只需使用 `JSON.parse` 对其进行解析：\n\n```javascript\nvar storedArr =\
  \ JSON.parse( localStorage.myArr );\n```\n\n### 缓存清单 (Cache manifest)\n\nHTML5 的缓存清单告诉浏览器它应该下载并本地存储哪些页面和资源。这些资源将在用户访问你的网站或应用的第一点开始自动下载，无论这些资源在当前会话中是否被使用。\n\
  \n这种缓存对于像 `Corks` 这样的 Web 应用尤为重要，这类应用被设计为从移动设备的桌面启动。因为这使得应用程序即使在离线模式下也能运行。\n\n缓存清单对于制作能够与原生设备应用竞争的\
  \ Web 应用至关重要。当结合主屏幕图标时，它可以让 Web 应用运行得类似于原生应用，无论是否连接了 Internet。\n\n#### 定义清单\n\n\
  首先，你需要在文档的 `html` 元素中链接到清单文件：\n\n```html\n<html manifest=\"example.manifest\">\n\
  ...\n</html\n```\n\n确保该文件使用适当的 MIME 类型提供服务至关重要，否则它将无法被识别。假设你正在使用 `Apache`，可以在 `.htaccess`\
  \ 文件中添加此行：\n\n```apache\nAddType text/cache-manifest .manifest\n```\n\n#### 构建清单文件\n\
  \n接下来，构建实际的清单文件是轻而易举的。它应该以 `CACHE MANIFEST` 开头，随后是一个你想要缓存的文件列表。例如：\n\n```text\n\
  CACHE MANIFEST\nindex.html\nstylesheet.css\nscripts/jquery.js\nimages/my-logo.png\n\
  ```\n\n因此，每当用户访问带有此清单的任何页面时，他们将自动下载这些资源，无论它们在给定页面上被使用。\n\n清单文件是在位级别进行缓存的。这意味着每当清单文件中任何字符发生变化（即使在注释中），浏览器都会重新下载它指定的所有资源。\n\
  \n#### 禁用某些页面的缓存\n\n缓存清单对于不需要 Internet 连接的静态页面非常好。然而，通常会有页面要么需要用户在线，要么是以动态方式生成的，且不应该被缓存（例如，需要\
  \ `Google Maps API` 或显示每日新闻列表的页面）。\n\n幸运的是，你也可以使用缓存清单来指示不应被浏览器缓存的文件。只需在你的清单文件中定义独立的\
  \ `CACHE` 和 `NETWORK` 部分即可：\n\n```text\nCACHE MANIFEST\n# 已缓存的资源\nCACHE:\nindex.html\n\
  stylesheet.css\nscripts/jquery.js\nimages/my-logo.png\n# 非缓存资源\nNETWORK:\nmap.html\n\
  blog.html\n```\n\n在这里，`CACHE` 部分中的文件将被缓存，而 `NETWORK` 部分中的文件将不会缓存。（以 `#` 开头的行是注释。）\n\
  \n紧跟在 `CACHE MANIFEST` 之后的任何路径都被认为是缓存资源，因此在示例示例中你可以省略 `CACHE` 部分。然而，由于你可以移动这些部分，为了代码的清晰性，定义它们是一个好主意。\n\
  \n#### 为非缓存内容提供回退方案\n\n最后，你可以为任何网络页面定义回退内容。当网络资源不可用时（例如用户离线时），将显示这些内容：\n\n```text\n\
  CACHE MANIFEST\n# 已缓存的资源\nCACHE:\nindex.html\nstylesheet.css\nscripts/jquery.js\n\
  images/my-logo.png\n# 非缓存资源\nNETWORK:\nmap.html\nblog.html\n# 回退\nFALLBACK:\n*.html\
  \ /offline.html\n```\n\n在这里，你可以使用 `/offline.html` 在用户离线时向其显示错误消息。每个回退声明包含两个部分：请求资源的\
  \ URI 和回退资源的 URI。如你所见，可以使用如 `*` 的通配符。\n\n回退声明中的两个 URI 均相对于引用清单文件的页面。这就是为什么此示例对 `/offline.html`\
  \ 使用非相对路径。\n\n## CSS3\n\nCSS3 引入了各种新的样式选项，你可以利用这些选项让页面更具视觉吸引力。最棒的是，可以在不加载任何外部图像的情况下实现，使得页面加载更快并减轻了服务器的负担。\n\
  \n然而，从性能角度来看，此功能并不是完全免费的。这些属性需要渲染器进行更多工作，可能会减慢处理速度。在桌面计算机上，这通常忽略不计，但移动设备的性能可能较低。\n\
  \n这真的取决于设备。iPhone（即使是像 3G 这样的旧型号）也有足够的功率来处理几乎任何 CSS3。另一方面，不同的 Android 设备可能会出现问题。\n\
  \n### 阴影 (Box shadow)\n\nBox shadow 为元素添加投影投影，这是增加强调的一种极方法。\n\n`box-shadow` 属性接受关于投影效果的各种信息，从颜色到模糊度。例如：\n\
  \n```css\nbox-shadow: 1px 2px 8px #000;\n```\n\n这为阴影设置了多种选项：\n- 前两个值是你想要偏移阴影的 x\
  \ 和 y 坐标。在这个示例中，阴影在元素右侧一像素、下方两个像素处渲染。\n- 下一个值是模糊半径；在这种情况下，阴影被模糊了八像素。在这里可以使用更大的数字来获得更模糊的阴影，或使用更小的数字获得更锐利的阴影。\n\
  - 最后，你设置阴影的颜色；在这种情况下，投影是黑色的。\n\n这种样式为元素添加了投影，如图 A-1 所示：\n（注：原文未提供图 A-1 图像）\n\n###\
  \ RGBA 透明度\n\n你可能会注意到这个示例中的投影看起来有点生硬。这是因为使用了完全不透明的颜色。\n\n为了获得更微妙的效果，请设置 RGBA 颜色代替：\n\
  \n```css\nbox-shadow: 1px 2px 8px rgba(0,0,0,0.5);\n```\n\nRGBA 颜色与 RGB 颜色相似，但还包含\
  \ alpha 透明度，使得它们具有一定的透明度。在这个示例中，你设置了黑色阴影（R: 0, G: 0, B: 0），它只有 50% 不透明（0.5）。\n\n\
  这产生了一种不那么突兀的效果，如图 A-2 所示：\n（注：原文未提供图 A-2 图像）\n\n在阴影中没有必要为 RGB 提供回退方案——所有支持 box-shadow\
  \ 的浏览器都支持 RGBA 颜色。\n\n### 厂商前缀\n\n\n\n\n虽然这个盒投影在 iOS 5 中可以生效，但在任何已发布的 Android 版本或旧版本的\
  \ iOS 中均无效。对于这些版本，你必须添加厂商前缀：\n\n```\n-webkit-box-shadow: 1px 2px 8px rgba(0,0,0,0.5);\n\
  ```\n\n确保也为较新的 iOS 用户、其他浏览器添加不带前缀的版本，并为了在 Android 支持时具有向前兼容性：\n\n```\n-webkit-box-shadow:\
  \ 1px 2px 8px rgba(0,0,0,0.5);\nbox-shadow: 1px 2px 8px rgba(0,0,0,0.5);\n```\n\n\
  确保不带前缀的 `box-shadow` 位于样式表的最后非常重要，以确保它能覆盖支持不完全的版本。\n\n你可能想为 Firefox 添加 `-moz-box-shadow`，但该前缀正变得不再必要，因为\
  \ Firefox 从 4.0 版本起就已经完全支持 `box-shadow`。\n\n## 为什么需要厂商前缀？\n\n你可能在奇怪浏览器为什么要费劲使用厂商前缀，因为它们增加了前端开发的复杂性。\n\
  \n厂商前缀之所以是因为 CSS3 规范仍然较新，浏览器需要一些时间才能跟上进度（毕竟，规范仍在演进中）。\n\n当浏览器达到支持新规范的大部分内容的程度时，发布该功能以供开发者使用是有合逻辑的。然而，该功能可能仍存在\
  \ Bug（例如，与其他实验性样式交互时产生的问题）。此外，规范中可能某些浏览器不支持的部分，例如更复杂的功能。\n\n在这些情况下，样式通过厂商前缀进行调用，以与完全支持的属性区分开来，并避免在浏览器完全跟上进度时发生潜在的冲突。\n\
  \n## 多个盒投影\n\n你也可以简单地通过逗号分隔投影，为你的元素添加多个盒投影：\n\n```\n-webkit-box-shadow: 0px 0px\
  \ 2px rgba(0,0,0,0.3), 1px 2px 8px rgba(0,0,0,0.5);\nbox-shadow: 0px 0px 2px rgba(0,0,0,0.3),\
  \ 1px 2px 8px rgba(0,0,0,0.5);\n```\n\n如图 A-3 所示，此元素应用了两个投影：\n\n![9781118348161-fgaa03.eps](img/9781118348161-fgaa03_fmt.png)\n\
  \n图 A-3：此元素有两个盒投影。注意靠近元素边缘的那个较硬的投影。\n\n多个盒投影会层叠在一起，这意味着第一个投影在最上方。\n\n你甚至可以使用多个盒投影来创建一个方便的\
  \ 3D 效果。只需设置几个没有模糊的盒投影即可：\n\n```\n-webkit-box-shadow: 1px 1px 0px rgba(0,0,0,0.9),\
  \ 2px 2px 0px rgba(0,0,0,0.9), 3px\n3px 0px rgba(0,0,0,0.9), 4px 4px 0px rgba(0,0,0,0.9),\
  \ 5px 5px 0px rgba(0,0,0,0.9),\n6px 6px 0px rgba(0,0,0,0.9), 7px 7px 0px rgba(0,0,0,0.9);\n\
  box-shadow: 1px 1px 0px rgba(0,0,0,0.9), 2px 2px 0px rgba(0,0,0,0.9), 3px 3px 0px\n\
  rgba(0,0,0,0.9), 4px 4px 0px rgba(0,0,0,0.9), 5px 5px 0px rgba(0,0,0,0.9), 6px 6px\n\
  0px rgba(0,0,0,0.9), 7px 7px 0px rgba(0,0,0,0.9);\n```\n\n这段代码附加了七个投影影，每个投影偏移一个像素。如图\
  \ A-4 所示，这使得元素看起来像是从页面上凸出的。\n\n![9781118348161-fgaa04.eps](img/9781118348161-fgaa04_fmt.png)\n\
  \n图 A-4：这种 3D 效果是使用盒投影创建的。\n\n你也可以对 `text-shadow` 使用相同的技术来实现 3D 文字。\n\n#### 渐变\n\
  \n渐变是为纯色布局注入具有视觉吸引力的深度的简单方法。CSS 渐变规范非常通用，为你提供了许多可用的选项。此外，在 CSS 中处理渐变意味着更少的图片和更短的用户下载等待时间。\n\
  \n此外，传统的基于图像的方法产生的渐变无法自然地跨越元素。如果元素的尺寸从不变化，你可以按正确尺寸裁剪图像，但如果内容发生扩展，就会遇到问题。相反，CSS 渐变会随着元素的尺寸动态拉伸。\n\
  \n### 线性渐变\n\n首先，为你的元素设置背景颜色。这确保了在不支持的浏览器中会有内容显示，并在浏览器渲染渐变花费过长时显示：\n\n```\nbackground-color:\
  \ #999;\n```\n\n你还可以设置背景图像作为备用方案；只需确保它位于 CSS 渐变之前即可。\n\n接下来，应用线性渐变：\n\n```\nbackground-image:\
  \ -webkit-gradient(linear, left top, left bottom, from(#CCC), to(#555));\nbackground-image:\
  \ -webkit-linear-gradient(top, #CCC, #555);\nbackground-image: linear-gradient(to\
  \ bottom, #CCC, #555);\n```\n\n这段代码创建从浅灰色（`#CCC`）到深灰色（`#555`）的线性渐变，从上到下，如图 A-5 所示。\n\
  \n![9781118348161-fgaa05.eps](img/9781118348161-fgaa05_fmt.png)\n\n图 A-5：此元素有一个基础线性渐变。\n\
  \n你可能会注意到这里有一系列不同的格式。遗憾的是：\n\n- `background-image: -webkit-gradient(linear, left\
  \ top, left bottom, from(#CCC), to(#555));`\n- `background-image: -webkit-linear-gradient(top,\
  \ #CCC, #555);`\n- `background-image: linear-gradient(to bottom, #CCC, #555);`\n\
  \n## 角度渐变\n\n你可以使用线性渐变创建垂直、水平甚至是任意角度的角渐变。之前创建的渐变是垂直的，但你可以通过调整位置将其切换为水平：\n\n```\n\
  background-image: -webkit-gradient(linear, left top, right top, from(#CCC), to(#555));\n\
  background-image: -webkit-linear-gradient(top, #CCC, #555);\nbackground-image: linear-gradient(to\
  \ right, #CCC, #555);\n```\n\n\n\n\n```css\nbackground-image: -webkit-gradient(linear,\
  \ left 20% top 100%, right 20% bottom 100%, from(#CCC), to(#000));\n```\n\n```css\n\
  background-image: -webkit-linear-gradient(-60deg, #CCC, #000);\n```\n\n```css\n\
  background-image: linear-gradient(120deg, #CCC, #000);\n```\n\n在这里，新的语法都非常直观；唯一的区别在于你需要在旧的\
  \ `-webkit-gradient` 停止点中添加百分比。这些处理起来可能有点困难，但你可以反复尝试，直到找到一个适合你渐变的设置为止。\n\n如图 A-8\
  \ 所示，这创建了一个角度更柔和的渐变。\n\n![9781118348161-fgaa08.eps](img/9781118348161-fgaa08_fmt.png)\n\
  \n图 A-8: 这个 60º 渐变是用 CSS3 创建的。\n\n### 渐变工具\n\n在为每个方向渐变背诵三种不同的语法之前，考虑一下使用某些工具来自动化这个枯燥的过程。例如，我喜欢使用像\
  \ `Sass` 或 `LESS` 这样的 CSS 预处理器来处理不同的格式。\n\n如果你不想使用预处理器，市面上有很多工具可以为你生成这些代码。例如，查看\
  \ Colorzilla 提供的 [Ultimate CSS Gradient Generator](http://www.colorzilla.com/gradient-editor/)（`www.colorzilla.com/gradient-editor/`）。如图\
  \ A-9 所示，该编辑器提供了一个直观的 UI，用于通过图形化方式生成渐变。\n\n即使你正在使用 `Sass`，这个工具也是可视化你渐变的有用方法。此外，它还可以输出用于\
  \ `Compass` 混入的 SCSS 格式。\n\nCSS 预处理器对于仍处于变动中的 CSS3 规范来说特别方便。这是因为如果出现新标准，你可以使用它们快速为样式表中所有的渐变添加新语法。\n\
  \n![9781118348161-fgaa09.eps](img/9781118348161-fgaa09_fmt.png)\n\n图 A-9: 这个工具让你更轻松地生成渐变样式。\n\
  \n### 颜色停止点\n\n除了基础的双色渐变外，你还可以添加颜色停止点来创建更复杂的渐变。颜色停止点表示渐变沿额外的颜色点。你可以向之前创建的定义中添加尽可能多的的点：\n\
  \n```css\nbackground: -webkit-gradient(linear, left top, left bottom, from(#b4ddb4),\
  \ color-stop(50%, #008a00), to(#002400));\n```\n\n```css\nbackground: -webkit-linear-gradient(top,\
  \ #b4ddb4, #008a00 50%, #002400);\n```\n\n```css\nbackground: linear-gradient(to\
  \ bottom, #b4ddb4, #008a00 50%, #002400);\n```\n\n在这里，渐变中间 50% 处创建了一个颜色停止点，你可以在图\
  \ A-10 中看到。\n\n![9781118348161-fgaa10.eps](img/9781118348161-fgaa10_fmt.png)\n\n\
  图 A-10: 这个渐变使用了颜色停止点。\n\n你也可以将第一个和最后一个颜色声明为颜色停止点。在旧的 `-webkit-gradient` 语法中，只需将每个颜色替换为\
  \ `color-stop(0%, #b4ddb4)` 和 `color-stop(100%, #002400)`。然后在新的语法中，分别为它们添加 `0%`\
  \ 和 `100%`。\n\n你可以使用颜色停止点来渲染更丰富的渐变，甚至模拟 3D 效果。例如，你可以创建一个底部带有阴影、顶部带有高亮亮的按钮：\n\n```css\n\
  background: -webkit-gradient(linear, left top, left bottom, from(#52b152), color-stop(25%,\
  \ #83c783), color-stop(66%, #008a00), to(#002400));\n```\n\n```css\nbackground:\
  \ -webkit-linear-gradient(top, #52b152, #83c783 25%, #008a00 66%, #002400);\n```\n\
  \n```css\nbackground: linear-gradient(to bottom, #52b152, #83c783 25%, #008a00 66%,\
  \ #002400);\n```\n\n这段代码构建了一个带有两个额外颜色停止点的渐变，创建了三维视觉效果，如图 A-11 所示。\n\n![9781118348161-fgaa11.eps](img/9781118348161-fgaa11_fmt.png)\n\
  \n图 A-11: 这些颜色停止点为按钮创建了 3D 效果。\n\nIE 过滤器不支持颜色停止点。\n\n### 径向渐变\n\n除了线性渐变外，你还可以使用\
  \ CSS3 创建径向或圆形渐变。同样，这些设置非常灵活，允许你创建各种适应个人需求的渐变。\n\n首先，你可以声明一个基础的径向渐变：\n\n```css\n\
  background: -webkit-gradient(radial, center center, 0px, center center, 100%, from(#CCC),\
  \ to(#555));\n```\n\n```css\nbackground: -webkit-radial-gradient(center, ellipse\
  \ cover, #CCC, #555);\n```\n\n```css\nbackground: radial-gradient(ellipse at center,\
  \ #CCC, #555);\n```\n\n如你所见，定义略有不同。虽然设置颜色停止点的方法与线性渐变相似，但定位设置发生了变化。这是因为你需要设置渐变的中心点和半径：\n\
  \n- 在旧的 `-webkit-gradient` 语法中，你首先设置中心位置以及为 0 的半径。然后你定义终点仍然居中，但位于元素的边缘（100%）。\n\
  - 在新的 `-webkit-radial-gradient` 语法中，你首先将位置设置为 `center`，然后使用 `ellipse cover` 覆盖整个元素。\n\
  - 最后在 W3C 标准语法中，你只需将其设置为 `ellipse at center`。\n\n如图 A-12 所示，这创建了一个延伸到元素边界的径向渐变。\n\
  \n![9781118348161-fgaa12.eps](img/9781118348161-fgaa12_fmt.png)\n\n图 A-12: 这个径向渐变是用\
  \ CSS3 创建的。\n\n### 重复渐变\n\n除了线性渐变外，你还可以使用 CSS3 创建径向或圆形渐变。同样，这些设置非常灵活，允许你创建各种适应个人需求的渐变。最后，CSS\
  \ 规范也提供了重复渐变，它们是创建条纹背景的简单方法。重复渐变与普通渐变的小不同在于，它们会跨越元素重复。你还可以操作重复渐变中的颜色停止点来创建条纹：\n\n\
  ```css\nbackground-image: -webkit-repeating-linear-gradient(top, blue, green 10px,\
  \ white 10px, white 20px);\n```\n\n```css\nbackground-image: repeating-linear-gradient(to\
  \ bottom, blue, green 10px, white 10px, white 20px);\n```\n\n在这里，渐变从 10px 处从蓝色过渡到绿色。然后在\
  \ 10px 处切换为白色，并在 20px 处再次过渡到白色并开始重复。参见图 A-13。\n\n![9781118348161-fgaa13.eps](img/9781118348161-fgaa13_fmt.png)\n\
  \n图 A-13: 该元素具有重复渐变。\n\n#### CSS 动画\n\nCSS 过渡和关键帧动画是页面添加简单动画的一种简单方法。它们对于移动设备特别重要，因为性能优于\
  \ JavaScript 替代方案（如 jQuery 的 `animate()` API）。这是因为动画直接在渲染器中发生，可以进行优化。性能提升在动画中尤为明显。设备渲染每一帧的速度越快，就能显示更多的帧。这让动画对用户来说看起来更流畅。\n\
  \n\n\n过渡（Transitions）是让页面更具交互性并创建更佳用户体验的简单方法。\n\nCSS 过渡在元素样式变化之间应用动画。例如，你可能会在鼠标悬停时改变按钮的颜色：\n\
  \n```css\n.button {\n  background-color: red;\n}\n\n.button:hover {\n  background-color:\
  \ purple;\n}\n```\n\n通常情况下，该元素会立即改变颜色，但通过过渡，你可以添加平滑的动画颜色变化：\n\n```css\n\nbutton\
  \ {\n  transition: background-color 200ms ease;\n}\n```\n\n在这里，你定义了过渡的三个方面：\n\n\
  * 首先，你设置了要动画的属性。在这种情况下，你只动画了 `background-color`，但你可以将其设置为大多数其他属性，甚至设置为 `all` 来动画所有属性。\n\
  * 接下来，你设置了过渡的持续时间——在这种情况下为 200 毫秒。\n* 最后，你设置了过渡的计时函数——在这种情况下你使用了 `ease`。`ease` 并不是在整个过渡时间内均匀地进行动画，而是让浏览器先缓慢动画，然后平滑过渡到快速动画。这产生了更自然的运动效果。\n\
  \n你将在本节稍后的部分学习更多关于计时函数的知识。\n\n### 单个元素上的多个过渡\n\n你也可以在元素上定义多个过渡。这对于以不同的速度动画不同的属性非常有用。然而，你不能再使用简写属性了：\n\
  \n```css\n.button {\n  transition-property: opacity, background-color;\n  transition-duration:\
  \ 200ms, 500ms;\n  transition-timing-function: ease;\n}\n```\n\n现在有两个元素将进行动画，`opacity`\
  \ 和 `background-color`，分别在 `200ms` 和 `500ms` 内完成。请注意，这里只使用了一个计时函数，导致它被应用于这两个过渡。对于你想要在全局范围内使用的任何过渡方面，你都可以使用相同的技术。\n\
  \n如果你想沿着同一个过渡动画元素的所有属性，只需定义一个属性设置为 `all` 的过渡即可。\n\n### 厂商前缀（Vendor prefixes）\n\n\
  与其他的实验性 CSS3 特性一样，为过渡使用适当的厂商前缀是至关重要的：\n\n```css\n.button {\n  -webkit-transition:\
  \ background-color 200ms ease;\n  -moz-transition: background-color 200ms ease;\n\
  \  -o-transition: background-color 200ms ease;\n  transition: background-color 200ms\
  \ ease;\n}\n```\n\n这段代码定义了适用于不同浏览器的过渡。然而，根据你想支持的移动浏览器，可以省略 `-moz-transition` 和 `-o-transition`。\n\
  \n你可能在其他地方见过 `-ms-transition`，但不再需要包含它了。虽然 `-ms-transition` 在早期 IE 10 开发者预览中使用过，但发布版本完全支持\
  \ `transition`。由于没有任何实际发布的 IE 需要这个前缀，你可以安全地省略它。\n\n最后，如果你在同一个元素上定义多个过渡，只需将每个厂商前缀附加到\
  \ `transition-property`、`transition-duration` 和 `transition-timing-function`。CSS\
  \ 规则可能会变得有点长，如果你想要更深层的浏览器覆盖，这是重要的。\n\n你已经在在本章的“Box Shadow”部分学习了为什么浏览器要使用前缀。\n\n\
  ### 使用 JavaScript 触发过渡\n\n过渡在 CSS 中常用于在 `:hover`、`:focus` 或或其他 CSS 伪元素上提供动画。\n\n\
  但你也可以使用 JavaScript 触发这些变化。因为只要元素的 CSS 属性发生变化，无论变化如何产生，过渡就会发生。\n\n例如，在按钮示例中，你可以添加一个带有不同背景样式的类定义：\n\
  \n```css\n.button.inactive {\n  background-color: gray;\n}\n```\n\n接下来使用 JavaScript\
  \ 或 jQuery 应用类名——例如，每当按钮应该是非激活状态时：\n\n```javascript\n$('.button').addClass('inactive');\n\
  ```\n\n当此类被添加到元素时，`background-color` 会平滑地过渡，就像在 `:hover` 时发生的一样。同样，如果你移除该类，它会过渡回原始颜色。\n\
  \n### 过渡结束事件（Transition end event）\n\nDOM 甚至提供了一个特殊的事件处理程序，可以用它在过渡完成时触发回调函数。这意味着你可以在动画结束后触发额外的\
  \ JavaScript。\n\n例如，你可以设置一个过渡，每当添加特定类时就淡出并隐藏按钮：\n\n```css\n.button {\n  transition-property:\
  \ opacity, background-color;\n  transition-duration: 200ms, 500ms;\n  transition-timing-function:\
  \ ease;\n}\n\n.button.hidden {\n  opacity: 0;\n}\n```\n\n接下来使用 jQuery 应用该类：\n\n\
  ```javascript\n$('.button').addClass('hidden');\n```\n\n虽然这个过渡有效地隐藏了元素，但你仍然会在页面上之前按钮所在的地方看到一个空白。这是因为它是透明的；如果你想完全移除元素，你需要设置\
  \ `display: none`。\n\n然而，如果你在 CSS 中设置了 `display: none`，它会立即发生，你看不到元素平滑地淡出。毕竟，过渡不支持\
  \ `display` 属性。\n\n这正是过渡结束事件派用用场：\n\n```javascript\nfunction hideButton(e) {\n \
  \ $(this).css('display', 'none');\n}\n$('.button')[0].addEventListener('webkitTransitionEnd',\
  \ hideButton);\n```\n\n此回调会在过渡动画完成后隐藏按钮。请注意，你使用 `$('.button')[0]` 来获取 DOM 引用。为了代码的未来兼容性，最好也添加不带前缀的\
  \ `transitionEnd`，如果你想支持那些移动浏览器，还要添加 `mozTransitionEnd` 和 `oTransitionEnd`。\n\n\
  #### 过渡结束事件的问题\n\n然而，这个事件并不像看起来那么简单。首先，在你的回调中添加一个 `console.log`：\n\n```javascript\n\
  function hideButton(e) {\n  $(this).css('display', 'none');\n  console.log('transition\
  \ end');\n}\n$('.button')[0].addEventListener('webkitTransitionEnd', hideButton);\n\
  ```\n\n如图 A-15 所示，此回调触发了两次。\n\n这种奇怪行为的原因是，只要元素发生任何过渡，transitionEnd 回调就会触发。因为你在这里附加了两个过渡，一个针对\
  \ `opacity`，另一个针对 `background-color`，事件触发了两次。\n\n在这个示例中这不是大问题，因为第二次添加 `display:\
  \ none` 不产生任何变化。然而，如果 `background-color` 的变化比 `opacity` 的变化快呢？那么元素会在透明度变化完成之前先隐藏（然后再次隐藏）。\n\
  \n或者更糟糕，鼠标悬停时会发生什么？因为你仍在应用颜色变化，这个过渡会触发，从而隐藏元素。\n\n如你所见，过渡结束事件可能很难处理。它没有提供关于哪个属性发生了变化的任何有用信息。相反，你必须依赖黑科技来确定何时以及应用了需要回调的过渡。\n\
  \n\n\n\n使用 `transitionEnd` 事件会使这个问题更加严重。该事件的实现不仅有些不直直觉，而且导致了动画代码的进一步碎片。你无法在 jQuery\
  \ 的 `animate()` API 中使用直观的回调函数，必须设置一个额外的事件监听器，它每当该元素发生过渡时就会触发。这意味着，即使你应用了不同的动画，同一个\
  \ `transitionEnd` 事件也会触发。\n\n在其他相同的情况下，我们建议你避免这种模式，并使用 jQuery 的 `animate()` API\
  \ 来实现动画。然而，从性能角度来看，并非所有情况都是同等的：CSS 过渡的性能通常优于 JavaScript 替代方案，因为浏览器可以直接对 CSS 样式进行优化。\n\
  \n这种优化对于性能有限的移动设备尤为重要。大多数设备在处理 JavaScript 动画时往往会卡顿，渲染出不流畅的动作。相反，CSS 过渡渲染要流畅得多。因此，为了提供更好的用户体验，你的应用架构可能需要做出牺牲。\n\
  \n# 帧 (Keyframes)\n\n虽然过渡非常适合不同样式之间的简单动画，但每当你需要更复杂的动画时，帧（keyframes）都是理想选择。帧允许你定义附加到不同\
  \ CSS 选择器的多步动画。\n\n第一步是定义一个自定义帧动画：\n\n```css\n@-webkit-keyframes my-animation {\n\
  \  from {\n    opacity: 0;\n  }\n  to {\n    opacity: 1;\n  }\n}\n```\n\n使用 `from`\
  \ 和 `to` 标签表示动画的起点和终点，该动画被称为 `my-animation`。在这种情况下，这是一个基础的淡入效果，但你可以在这里附加任意数量的样式。\n\
  \n接下来，使用 `-webkit-animation` 将其附加到你的元素：\n\n```css\n.my-element {\n  -webkit-animation:\
  \ my-animation 2s infinite;\n}\n```\n\n这段代码将你的自定义动画应用于该元素。它在 2 秒内进行动画，并无限循环。\n\n\
  帧动画是非常多功能的，你并不局限于两部分的动画。事实上，你可以使用百分比为动画附加任意数量的片段：\n\n```css\n@-webkit-keyframes\
  \ my-animation {\n  0% {\n    opacity: 0;\n  }\n  50% {\n    opacity: 1;\n  }\n\
  \  100% {\n    opacity: 0;\n  }\n}\n```\n\n你也可以使用逗号来合并动画中相同的任何部分。例如，以下代码产生与之前的动画相同的结果：\n\
  \n```css\n@-webkit-keyframes my-animation {\n  0%, 100% {\n    opacity: 0;\n  }\n\
  \  50% {\n    opacity: 1;\n  }\n}\n```\n\n此外，你还可以在动画声明中附加各种额外的选项。例如，假设你想使用一个计时函数：\n\
  \n```css\n-webkit-animation: my-animation 2s infinite ease;\n```\n\n或者你可以附加一个延迟，让动画在开始之前暂停一下：\n\
  \n```css\n-webkit-animation-delay: 3s;\n```\n\n这段代码在经过 3 秒后启动动画。\n\n默认情况下，动画每当循环时都会从顶部重新开始，但你也可以将其设置为交替方向：\n\
  \n```css\n-webkit-animation-direction: alternate;\n```\n\n最后，如果你想向一个元素附加多个帧动画，只需用逗号将它们隔开：\n\
  \n```css\n-webkit-animation: first-animation 2s infinite,\n--animation 5s infinite;\n\
  ```\n\n如你所见，众多的选项使得帧动画极其多功能。\n\n你还应该包含一个 `@keyframes` 定义以及相应的 `animation`，以获得更深层的浏览器支持。\n\
  \n# 自定义计时函数\n\n计时函数让动画的运动看起来要自然得多。在现实世界中，运动很少立即开始和停止，我们的眼睛对捕捉这种运动得非常敏锐。如果没有缓动函数，动画往往会显得非常虚假和机械化。\n\
  \n除了 `ease` 之外，在过渡中还可以使用几个预定义的计时函数：`ease-in`、`ease-out` 和 `ease-in-out`，它们实现了略有不同的动画速度。\n\
  \n如果预定义的选项都不符合你的需求，你也可以定义自己的计时函数。要做到这一点，你可以利用三次贝塞尔函数（Cubic Bezier functions）：\n\n\
  ```css\ntransition-timing-function: cubic-bezier(.35, .15 , .3, 1);\n```\n\n三次贝塞尔函数本质上定义了绘制复杂曲线所需的所有点。但在你的大脑因为数学过载而旋转之前，请查看\
  \ Lea Verou 在 [www.cubic-bezier.com](http://www.cubic-bezier.com) 上的工具，如图 A-16 所示。\n\
  \n![9781118348161-fgaa16.eps](img/9781118348161-fgaa16_fmt.png)\n\n图 A-16：来自 [www.cubic-bezier.com](http://www.cubic-bezier.com)\
  \ 的工具为定义三次贝塞尔函数提供了直观的 GUI。\n\n使用该工具，你可以调整曲线的控制点并在浏览器中预览更改。你甚至可以将其与默认计时函数进行比较（所有这些都可以使用三次贝塞尔进行重建）。\n\
  \n自定义计时函数可以应用于过渡和帧动画。\n\n## JavaScript\n\n大多数移动应用往往具有极强的交互性，因此依赖大量的 `JavaScript`。JavaScript\
  \ 允许你编写从触摸界面到服务器端通信的所有脚本。\n\n### 基础事件\n\n事件处理是 `JavaScript` 的一部分，因为它适用于用户输入。这里有一些适用于移动和非移动端的事件。\n\
  \n### onClick\n\n无疑是最常用的事件处理程序 `onClick` 处理鼠标点击。使用 jQuery，你可以为元素附加一个函数：\n\n```javascript\n\
  $('.my-element').click(function(e) {\n  // 点击时的操作\n});\n```\n\n如你所见，你有多种方式引用被点击的项，最简单的方法是\
  \ `$(this)`。例如，你可以在点击时隐藏元素：\n\n```javascript\n$('.my-element').click(function(e)\
  \ {\n  // 隐藏元素\n  $(this).hide();\n});\n```\n\n对于移动端，通常使用触摸事件而不是点击事件，将在附录中介绍。\n\n\
  ### 禁用默认点击行为\n\n通常，你想禁用原始点击事件。例如，如果你通过 AJAX 加载链接，你不希望链接在浏览器中打开。要禁用默认行为，向传递给回调函数的\
  \ `e` 附加 `preventDefault()`：\n\n```javascript\n$('.my-element').click(function(e)\
  \ {\n  e.preventDefault();\n});\n```\n\n你也可以在回调函数中使用 `return` 来禁用任何点击行为，但这通常是一种糟糕的方法。因为这将禁用附加到元素上的任何其他点击处理程序。相反，`e.preventDefault()`\
  \ 只禁用默认行为。\n\n### 防止事件冒泡\n\n点击事件还会冒泡，这意味着当你点击一个元素时，点击事件也会在其所有的祖元素上触发（例如，当你点击 `<li>`\
  \ 时，`<ul>` 触发点击事件）。\n\n这经常会导致冲突，但你可以通过附加 `e.stopPropagation()` 来阻止冒泡：\n\n```javascript\n\
  $('.my-element').click(function(e) {\n  e.preventDefault();\n  e.stopPropagation();\n\
  });\n```\n\n这种方法确保了当用户点击子节点时不会触发多余的点击事件。\n\n### onFocus 和 onBlur\n\n表单元素还有两个特殊的事件处理程序，`onFocus`\
  \ 和 `onBlur`。这些事件分别在表单元素获得或失去焦点时触发。\n\n\n\n\n\n你可能认为直接在字段上绑定一个点击事件会更简单，但请记住，用户进入表单字段的方法有很多，例如使用\
  \ `Tab` 键。\n\n例如，你可以在输入字段获得焦点时为其添加一个类，然后在失去焦点时将其移除：\n\n```javascript\n$(‘input’).focus(function(e)\
  \ {\n  $(this).addClass(‘focused’);\n});\n\n$(‘input’).blur(function(e) {\n  $(this).removeClass(‘focused’);\n\
  });\n```\n\n然而，如果这个类仅用于样式设置，你可以完全避免使用 JavaScript，而是使用 CSS 伪元素 `:focus` 和 `:blur`\
  \ 替代之。\n\n### jQuery 的 on() API\n\n当你使用 DOM 或 jQuery 绑定事件时，这些事件将应用于当前页面上已存在的任何元素。但它们将不会被绑定到任何通过\
  \ JavaScript 动态添加的元素上。\n\n例如，你可能会为所有 `<a>` 标签绑定点击处理程序：\n\n```javascript\n$(‘a’).click(function(e)\
  \ {\n  // 点击时你想做的任何操作\n});\n```\n\n当该处理程序被调用时，它适用于页面上的所有 `<a>` 元素。但是，如果你用 JavaScript\
  \ 添加一个新的 `<a>` 元素，它将被排除在外。\n\n要将处理程序应用于所有 `<a>` 元素（无论它们何时被添加），你可以使用 jQuery 的 `on()`\
  \ API：\n\n```javascript\n$(‘a’).on(‘click’, function(e) {\n  // 点击时你想做的任何操作\n});\n\
  ```\n\n在这里，你只需传递你想要绑定到元素的上的程序类型；每当该事件发生时，回调函数就会触发。例如，你也可以绑定聚焦和失去焦点事件：\n\n```javascript\n\
  $(‘input’).on(‘focus’, function(e) {\n  // 聚焦时你想做的任何操作\n});\n\n$(‘input’).on(‘blur’,\
  \ function(e) {\n  // 失去焦点时你想做的任何操作\n});\n```\n\n有关 `on()` API 的更多信息，请访问 [`http://api.jquery.com/on/](http://api.jquery.com/on/)。\n\
  \n你可能习惯了使用 jQuery 的 `live()` 事件；然而，该 API 已弃用，取而代之的是新的 `on()` API。\n\n#### 触摸事件\n\
  \n触摸事件处理程序可能是移动端最重要的 JavaScript 方法，因为移动端的核心在于交互，而且大多数现代设备都带有触摸屏（那些不真正显示网页页的设备除外）。\n\
  \n确实，你也可以使用基础的点击事件，因为移动设备也能处理这些事件。但点击事件的响应速度通常没有触摸事件快。这意味着点击的注册时间比触摸更长。这会对用户体验产生巨大影响。\n\
  \n此外，触摸事件在移动端非常多样。你可以跟踪 `touchstart`、`touchend` 甚至是多个手指的触摸事件。此外，某些平台提供了更直观的手势，允许你跟踪诸如滑动和双指缩放等复杂动作。\n\
  \n#### 基础触摸事件\n\n要使用基础触摸事件，只需接入 `touchstart` 事件处理程序即可。\n\n`touchstart` 在用户手指首次接触设备时触发。例如，你可以将\
  \ `<a>` 标签切换为触摸事件，让这些点击对触摸的响应更迅速：\n\n```javascript\n$(‘a’).bind(‘touchstart’, function(e)\
  \ {\n  // 在这里阻止默认行为是重要的，否则正常的点击也会触发\n  e.preventDefault();\n  window.location =\
  \ $(this).attr(‘href’);\n});\n```\n\n此脚本获取页面上所有的 `<a>` 标签并将它们切换到触摸事件。\n\n请记住，这可能会导致一些问题，因为如果应用了其他事件处理器，这些自定义处理器将不会被\
  \ `preventDefault()` 停止。\n\n#### Touchend\n\n尽管 `touchstart` 响应响应，但通常最好是使用 `touchend`，它在用户离开手指时触发。这允许用户在首次接触设备时点错，可以调整手指位置：\n\
  \n```javascript\n$(‘.my-element’).bind(‘touchend’, function(e) {\n  // 触摸时你想做的任何操作\n\
  });\n```\n\n事实上，可以说最好的实践是在用户开始触摸元素时向他们指示，然后在他们完成手指按下后触发事件：\n\n```javascript\n$(‘.my-element’).bind(‘touchstart’,\
  \ function(e) {\n  // 指示他们已开始触摸该元素\n  $(this).addClass(‘touching’);\n});\n\n$(‘.my-element’).bind(‘touchend’,\
  \ function(e) {\n  // 一旦停止触摸就移除任何触摸指示\n  $(this).removeClass(‘touching’);\n  //\
  \ 触摸时你想做的任何操作\n});\n```\n\n请记住，触摸事件在桌面浏览器上不起作用。这意味着如果你想在桌面浏览器中进行测试，或者为你的移动应用提供桌面体验，你应该将它们切换为点击事件。\n\
  \n#### Touchmove\n\n你还可以跟踪自用户手指放在设备上以来触摸事件的变化。这种技术对于跟踪拖放和其他简单的触摸手势非常有用：\n\n```javascript\n\
  $(‘.my-element’).bind(‘touchmove’, function(e) {\n  // 获取触摸事件的位置\n  var x = e.touch.pageX;\n\
  \  var y = e.touch.pageY;\n});\n```\n\n在此处，你可以使用 `e.touch.pageX` 和 `e.touch.pageY`\
  \ 获取触摸事件的位置。\n\n#### 多点触摸事件\n\n移动设备的一个独特功能是跟踪多次触摸的能力。而鼠标一次只能点击一个点，而在触摸屏上你可以任意数量的触点。\n\
  \n接入这一点非常简单。例如，使用 `e.touches` 数组跟踪两个手指：\n\n```javascript\n$(‘a’).bind(‘touchstart’,\
  \ function(e) {\n  // 第一个手指\n  var x1 = e.touches[0].pageX;\n  var y1 = e.touches[0].pageY;\n\
  \  // 第二个手指\n  var x2 = e.touches[1].pageX;\n  var y2 = e.touches[1].pageY;\n});\n\
  ```\n\n虽然这只跟踪两个手指，但只要有一次触摸事件就会触发。要将此事件限制在元素内，你可以改用 `targetTouches`：\n\n```javascript\n\
  $(‘.my-element’).bind(‘touchstart’, function(e) {\n  // 第一个手指\n  var x1 = e.targetTouches[0].pageX;\n\
  \  var y1 = e.targetTouches[0].pageY;\n  // 第二个手指\n  var x2 = e.targetTouches[1].pageX;\n\
  \  var y2 = e.targetTouches[1].pageY;\n});\n```\n\n此外，你可以使用多点触摸通过 `changedTouches`\
  \ 跟踪多个手指的变化：\n\n```javascript\n$(‘.my-element’).bind(‘touchstart’, function(e) {\n\
  \  // 第一个手指\n  var x1 = e.changedTouches[0].pageX;\n  var y1 = e.changedTouches[0].pageY;\n\
  \  // 第二个手指\n  var x2 = e.changedTouches[1].pageX;\n  var y2 = e.changedTouches[1].pageY;\n\
  });\n```\n\n但请记住，多点变化触摸只有在两个手指都移动时才会触发。如果一个手指保持不动，则只触发一个。\n\n#### iOS 手势\n\n使用 `e.changedTouches`\
  \ 跟踪特定手势可能很。幸运的是，iOS 提供了一些预定义的手势，你可以通过 JavaScript 接入。\n\n为此，接入一个 `gesturechange`\
  \ 事件处理器：\n\n```javascript\n$(‘.my-element’).bind(‘gesturechange’, function(e) {\n\
  \  var rotation = e.rotation;\n  var scale = e.scale;\n});\n```\n\n在这里，当用户执行两种手势之一时，`gesturechange`\
  \ 事件触发：\n\n• 旋转（通过将手指放在屏幕上并旋转）\n\n• 缩放（捏合和缩放）\n\n\n\n\n\n你还可以跟踪许多其他触摸手势，例如点击、滑动、拖拽和“长按”。欲需更多信息，请访问\
  \ [`http://bit.ly/apple-gestures`](http://developer.apple.com/library/ios/#documentation/EventHandling/Conceptual/EventHandlingiPhoneOS/GestureRecognizers/GestureRecognizers.html)。\n\
  \n## 其他手势选项\n\n虽然 iOS 手势在其他设备上并不可用，但你仍可以使用许多第三方插件和框架来提供手势事件支持。事实上，你甚至可以为许多 iOS 中并不支持的各种手势添加支持。\n\
  \n如果你需要这种类型的功能，我们建议查看 `jQuery Mobile` 或 `Sencha Touch` 中的手势。\n\n### jQuery\n\n`jQuery`\
  \ 是一个 JavaScript 库，它简化了 JavaScript 开发，并让你能够关注特性和功能，而不是语法。“原生 JavaScript”（不使用库的 JavaScript）运行速度可能非常快，但你会在不同的浏览器（特别是\
  \ IE）中遇到很多很多问题，因为不同的浏览器对 JavaScript 的实现方式略有不同。你不能假设仅仅因为一段 JavaScript 在 Chrome 中可以运行，它在\
  \ IE 中就能运行。对于像 AJAX 这样更复杂的特性，情况尤其如此，你将在本附录稍后的部分学习它。\n\n除了统一跨浏览器语法外，`jQuery` 还提供了许多原生\
  \ JavaScript 中不具备的特性。你不需要在每次需要新函数时重新发明轮子，而是依靠才华横溢的 `jQuery` 团队（以及 `jQuery` 社区）的集体经验。\n\
  \n了解关于 `jQuery` 中丰富的 API 集合，请访问 [`http://www.jquery.com/`](http://www.jquery.com/)。\n\
  \n## jQuery Mobile\n\n根据你所需的功能，你可以考虑使用图 A-17 所示的 `jQuery Mobile`。本质上是一个移动端 MVC，`jQuery\
  \ Mobile` 提供了许多核心库中没有的移动特定工具。这些工具主要由界面和样式选项组成，只需较少的努力就能增强移动体验。\n\n![9781118348161-fgaa17.eps](img/9781118348161-fgaa17_fmt.png)\n\
  \n图 A-17：可以在 [`jquerymobile.com/`](http://jquerymobile.com/) 了解更多关于 `jQuery Mobile`\
  \ 的信息。\n\n© 2012 jQuery Foundation 及其他贡献者\n\n### 插件\n\n使用 `jQuery` 的最好的部分之一是社区。作为最流行的\
  \ JavaScript 库，网络上不仅有大量的详细教程，还有许多可以放入你项目中的插件。\n\n这些插件是注入 `jQuery` 核心库中无法提供的更复杂功能的简单方法。它们有两个主要优势：\n\
  \n- 插件极大缩短了开发时间。\n- 插件通常是开源的，这意味着调试它们的人比你自己创建的任何代码都要多得多。\n\n然而，并非所有插件都是同等的。`jQuery`\
  \ 的流行是一把双刃剑：有很多优秀的插件，但也有许多插件是由开发者开发的，他们并不一定像你希望的那样理解该库。即使开发者技术高超，插件也可能非常老旧且不受支持。\n\
  \n因此，请谨慎对待，并在将任何你想使用的插件深度集成到应用程序中之前，对其进行测试。\n\n我这么说是因为我在职业生涯初期曾亲手制作过非常糟糕的 `jQuery`\
  \ 插件。\n\n### Zepto.js\n\n`jQuery` 非常强大，在过去的几年里增长了巨大。这意味着你手头可用的功能更多，但也意味着文件体积和实例化时间更大。\n\
  \n`jQuery` 适用于大多数桌面项目，对于具有复杂特性的移动项目也是如此。然而，对于简单的移动应用，`Zepto.js` 是比 `jQuery` 轻量得多的替代方案。\n\
  \n在编写本文时，`Zepto` 为 8KB，而 `jQuery` 为 32KB。\n\n最棒的是，`Zepto` 使用 `jQuery` 语法，并旨在放入任何之前用\
  \ `jQuery` 构建的项目中。假设你不需要它所缺的任何功能，你真的可以减小应用程序的文件体积。\n\n但请记住 `Zepto`（见图 A-18）不支持 IE。这就是它如此轻量的原因之一——IE\
  \ 往往需要比其他浏览器不同的 JavaScript 方法，这导致了 `jQuery` 的文件体积膨胀。`Zepto` 最初是为移动设计的，它选择不支持这些方法，因为移动浏览器不需要它们。\n\
  \n如果你确实想支持 IE 桌面体验，你也可以使用 IE 条件判断引入 `jQuery`，并在其他地方使用 `Zepto`。\n\n### AJAX\n\n`AJAX`\
  \ 是一套协议，允许你在不刷新页面的情况下直接与后端通信。这在移动应用中特别重要，因为数据传输速率要慢得多。通过 `AJAX` 与服务器通信可以让你避免重新加载整个页面，而是只刷新页面上适当的内容。\n\
  \n尽管 `AJAX` 在不同浏览器中的工作方式有所不同，但如果你在使用 `jQuery`，就可以忽略这些差异。`jQuery` 的 `AJAX` API 会为你处理这些不同的方法。\n\
  \n![9781118348161-fgaa18.eps](img/9781118348161-fgaa18_fmt.png)\n\n图 A-18：可以在 [`zeptojs.com/`](http://zeptojs.com/)\
  \ 了解更多关于 `Zepto` 的信息。\n\n© Thomas Fuchs\n\n这是一个基础的 AJAX 调用：\n\n```\n$.ajax({\n \
  \ url: ‘path-to-receiving-script.php’,\n  type: ‘post’,\n  data: {\n    data1: true,\n\
  \    data2: false\n  },\n  success: function(data) {\n    // 对数据进行操作\n  }\n});\n\
  ```\n\n这里代码传递了选项：\n\n- `url`：传递的路径\n- `type`：类型（例如 `post` 或 `get`）\n- `data`：数据（例如\
  \ JavaScript 对象或字符串）\n- `success`：回调函数\n\n对于更详细的选项列表，访问 [`http://api.jquery.com/ajax/`](http://api.jquery.com/ajax/)。\n\
  \n### JSON\n\n通过 AJAX 与后端通信时，`JSON` 是首选协议。`JSON` 是理想的，因为它是一种非常简洁的数据传输方式，意味着加载速度更快。\n\
  \n#### JSON 语法\n\n`JSON` 本质上是一个 JavaScript 对象，可以包含任何你需要的数据。例如：\n\n```\n{\n  “myData”:\
  \ {\n    “item1”: “文本字符串”,\n    “item2”: 10,\n    “item3”: true,\n    “item4”: [\n\
  \      “数组项 1”,\n      “数组项 2”,\n      “数组项 3”\n    ]\n  },\n  “moreData”: {\n \
  \   “item5”: “更多项目”\n  }\n}\n```\n\n所示，`JSON` 对象可以包含各种数据类型。\n\n在处理 `JSON` 时，如果你想支持旧版浏览器，请务必非常小心。它们会对任何格式问题崩溃，从悬逗号到未加双引号的数组键。最糟糕的是，这些问题在现代浏览器中不会出现，除非你进行了彻底测试。\n\
  \n你可以使用 `JSONLint` 来验证你的 `JSON`。在线验证器位于：[`jsonlint.com/`](http://jsonlint.com/)，如图\
  \ A-19 所示。\n\n![9781118348161-fgaa19.eps](img/9781118348161-fgaa19_fmt.png)\n\n\
  图 A-19：在线 JSONLint 验证器是检查 JSON 是否有效的快速简单方法。\n\n#### 数据解析\n\n尽管 `JSON` 看起来非常像 JavaScript\
  \ 对象，但它实际上是以字符串形式往返的。幸运的是，你有几种简单的方法可以解析 `JSON` 字符串并在 JavaScript 中使用。\n\n你可以使用的方法之一是\
  \ `window.JSON.parse()`：\n\n```\nfunction parseJSON(data) {\n  // 首先修剪任何空白，因为它可能会给某些浏览器带来问题\n\
  \  data = jQuery.trim( data );\n  // 然后如果 JSON 解析可用，则进行解析\n  if ( window.JSON &&\
  \ window.JSON.parse ) {\n    return window.JSON.parse( data );\n  }\n}\n```\n\n\n\
  \n\n非常旧的浏览器并不原生支持 `window.JSON`，因此你必须通过一个简单的 JavaScript 文件来手动包含它。这个问题仅影响 `IE 7`\
  \ 及更早版本，所以除非你想要支持跨浏览器的桌面端体验，否则在移动应用中并不是一个问题。你可以在这里获取该脚本：`https://github.com/douglascrockford/JSON-js`。\n\
  \n或者，你也可以直接使用 jQuery 的 `parseJSON()` API。它可以处理任何浏览器的 JSON：\n\n```\n$.parseJSON(data);\n\
  ```\n\n你可能希望尽可能尝试使用原生 JavaScript，因为它的速度更快，而且在更换库时不会导致崩溃。由于大多数移动浏览器都支持 `window.JSON`，因此在开发移动端应用时，请使用它而不是\
  \ jQuery 的替代方案。\n\n# JSONP\n\n虽然 `AJAX` 是一种与服务器通信的优秀协议，但它引入了普通 HTTP 处理中不存在的各种安全威胁。也就是说，攻击者可以从页面（即使是\
  \ HTTPS 页面）发送私有数据到自己的服务器。\n\n幸运的是，浏览器通过禁用跨域 AJAX 降低了这种风险。这意味着 `www.my-domain.com`\
  \ 无法使用 `AJAX` 与 `www.my-second-domain.com` 通信。\n\n然而，许多情况需要跨域通信，这就是 JSONP 的用用场。为你的数据添加\
  \ JSONP 封装可以使其通过浏览器的安全检查。\n\n幸运的是，使用 jQuery 的 AJAX API 相对容易实现这一点。只需将 `jsonp` 选项设置为\
  \ `true` 即可：\n\n```\n$.ajax({\n  url: ‘path-to-receiving-script.php’,\n  type: ‘post’,\n\
  \  jsonp: true,\n  data: {\n    data1: true,\n    data2: false\n  },\n  success:\
  \ function(data) {\n    // 如何处理响应\n  }\n});\n```\n\n## 总结\n\n本附录是典型移动应用未使用技术的完整列表。尽管它涵盖了你构建\
  \ Corks 应用时使用的大部分技术，但在 HTML5、CSS3 和 JavaScript 中还有更多有趣的选项。我们鼓励你去探索和学习本书未涵盖的当前技术，以及未来出现的技术。\n\
  \nWeb 开发（特别是移动开发）最令人兴奋的方面之一就是，总有新的新技术可以尝试。继续写代码吧！\n"
