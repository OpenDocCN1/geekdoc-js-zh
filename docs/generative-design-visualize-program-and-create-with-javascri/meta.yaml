    \ the ideas behind the sample programs and put what we have learned into context.\
    \ This section also identifies related topics and connections.\n\n**Status Quo**\
    \ Digitization has become an integral part of the discipline of design, and all\
    \ of us use computers for our daily work. The best-known tools in the design sector,\
    \ however, such as the Adobe Creative Cloud products (Photoshop, Illustrator,\
    \ et cetera) have only an illustrative and imaging function. Existing tools analog\
    \ tools, such as brushes, scissors, or photo labs, can be made virtual and more\
    \ efficient, allowing us to get results faster and work more comfortably. Yet\
