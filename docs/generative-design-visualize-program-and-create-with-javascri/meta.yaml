  mdcn: "\n## P.2.2.4 基于智能体的生长结构\n\n稳定的结构来源于多个智能体基于简单规则的汇聚。复杂的形状由简单的传播模式创建而成，例如：绘制一个新圆，并将其尽可能靠近其最近的邻居进行定位。这类算法也描述了植物和矿物的生长过程。\n\
    \n→ **P_2_2_4_01**\n\n在每一帧中，在随机位置并以随机半径生成一个新圆（虚线圆圈）。然后确定现有圆圈中哪个离新圆最近。最后一步，新圆通过最短路径与其最近的邻居对接。\n\
