    \ 192\n  - P.4.1.1 网格中的图像裁切 192\n  - P.4.1.2 图像裁切的反馈 196\n- P.4.2 图像集合 198\n \
    \ - P.4.2.1 来自图像集合的拼贴 198\n  - P.4.2.2 基于时间的图像集合 202\n- P.4.3 像素值 204\n  - P.4.3.1\
