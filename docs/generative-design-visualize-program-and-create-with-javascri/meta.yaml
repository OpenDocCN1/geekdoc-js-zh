  md: '→ P.2.3

    Drawing


    # Looking ahead


    The world of generative design has significantly evolved since the first edition
    of this book. Generative design—also referred to as creative coding—has established
    itself in the design world. Working with generative design has become common practice,
    as the basis of data visualizations, artwork, media installations, architectural
    models, video clips, fonts, dynamic appearances—all the way to customized mass
    production. A look into the future clearly shows that the use of generative design
    will continue to increase. This is indicated by the following favorable factors:


    The amount of information with which we are confronted daily is rapidly increasing
    thanks to ubiquitously accessible computer networks. Helping society deal with
    this flood of information through data visualization is an important task for
    designers.³ Generative design will be indispensable in coping with this challenge.


    The expansion of technological possibilities is a constant source of stimulation
    for generative design. Just a few years ago, for example, it was nearly impossible
    to generate complex, 3D worlds or to make them tangible with virtual reality and
    augmented reality—something that is now possible even on a smartphone. This technical
    potential will continue to be a driving force in generative design.


    Equally important is the community of collaborators, which in almost no other
    design field is so vital. It is astounding how much the internet-based communities
    that have arisen around Processing, p5.js, vvvv, openFrameworks, NodeBox, or Basil.js
    have contributed to libraries, tutorials, sample programs, articles, forum contributions,
    wikis, et cetera. This is certainly in part because creating code—generative design''s
    underlying design medium—is well suited to teamwork, as software development has
    demonstrated. One advantage of code is that it can easily be exchanged and spread,
    in contrast to other media such as video.'
  merge: -1
  pgno: 406
- img_proc: true
  md: 'Nevertheless, a designer who has programming skills is still the exception
    rather than the rule today. This has historical and cultural reasons: generally
    designers have been forced to decide to be either artists or technicians. To be
    both in perfect union is rarely an option, for example, in university curricula,
    although this distinction has begun to blur in recent years. In addition, learning
    this new design process—using mathematical-analytical source code to transform
    an idea into a visual result—feels to many like an insurmountable obstacle. Overcoming
    this obstacle is one of this book''s main objectives.


    An understanding of generative design will lead to a new matter-of-factness in
    taking advantage of the computer''s potential. Programming, and thus generative
    design, is rapidly becoming a universal cultural asset and technical tool, just
    as photography and film were in the last century. The possibilities are already
    there; we just need to use them.


    > **Georg Trogemann, Jochen Viehoff**

    *CodeArt*, foreword


    > 1 "Painting with a mouse on the computer screen has a high entertainment value,
    but [. . .] drawing a stroke with a pen is no different from drawing a stroke
    with a mouse. The real challenge is to discover the intrinsic properties of the
    new medium and to find out how the stroke you draw via computation is one you
    could never draw, or even imagine, without computation."

    **John Maeda**

    *Design by Numbers*


    > 2 "In addition to ''divide and conquer,'' there are many other problem-solving
    strategies, such as top-down and bottom-up, et cetera. In this context, the ''pattern''
    idea (analyzing problems in recurring patterns and solving these systematically)
    can be very helpful."

    **Christopher Alexander**

    *A Pattern Language*'
  merge: -1
  pgno: 407
