    \ to create diagrams that function as static literary criticism.\n\n→ P_3_1_4_01\n\
    \nThe aim of a so-called treemap is to divide a rectangle into smaller rectangles\
    \ according to the frequency with which each word is used in a text. The complete\
    \ text of Jane Austen's *Pride and Prejudice* is read from a text file and transferred\
    \ to the Treemap class for visualization. Individual parameters for the TreeMap\
    \ algorithm can be keyed in.\n\n→ P_3_1_4_01 Section of a treemap arranged according\
    \ to frequency, in which only horizontal elements are permitted.\n\n```\nvar mapData\
    \ = {};\n\n. . .\n\nvar doSort = true; var rowDirection = \"both\" ;\n```\n\n\
    - 1. The data container `mapData` will later be filled with the loaded text's\
