  md: '# **P.2.2.4** Growth structure from agents


    A stable structure results from the convergence of multiple agents based on simple
    rules. Complex shapes are created out of simple propagation patterns such as:
    draw a new circle and position it as close as possible to its nearest neighbor.
    These types of algorithms also describe growth processes in plants and minerals.


    → **P_2_2_4_01**


    In each frame, a new circle is generated at a random position and with a random
    radius (dashed circles). It is then determined which of the existing circles lies
    nearest to the new one. In the final step, the new circle docks with its closest
    neighbor via the shortest path.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_199_0.png)'
