- md: " The standard renderer: this is used if nothing else has been specified.\n\n\
    Renderer for hardware-accelerated 3D graphics in the web browser.\n\n## Transformations\n\
    \nOne of the strengths of p5.js is that it can move, rotate, and scale the coordinate\
    \ system. All graphic commands thereafter refer to this altered coordinate system.\n\
    \n```\ntranslate(40, 20);\nrotate(0.5);\nscale(1.5);\n```\n\nIn this example,\
    \ the coordinate system is moved 40 pixels to the right and 20 pixels downward,\
    \ then rotated 0.5 radians (about 30°), and finally scaled by a factor of 1.5.\n\
    \nIn Processing, angles are generally shown in radians, in which 180° equals the\
    \ number pi (≈ 3.14) and the rotation is in a clockwise direction.\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_76_0.png)\n\
    \n## Variables and Data Types\n\nIn a program, information is stored in variables\
    \ so that it is available to other parts of the program. These variables can have\
    \ any name other than the keywords for JavaScript keywords. Keywords can be recognized\
    \ by their special color in the editor.\n\n```\nvar myVariable;\nmyVariable =\
    \ 5;\n```\n\n1. The variable `myVariable` is created. The value 5 is then saved\
    \ there.\n\nVariables can contain different data types. Unlike most other programming\
    \ languages, JavaScript does not have to take this into account when creating\
    \ a variable. Nevertheless, it is important to keep track of which variables store\
    \ which type of value. For example, data types can be:\n\n```\nvar myBooleanvalue\
    \ = true;\n```\n\n```\nvar myInteger = 7;\nvar myFloatingPointNumber = -3.219;\n\
    var myCharacter = \"A\";\nvar myString = \"This is a text\";\n```\n\n- Logic values\
    \ (Boolean values): `true` or `false`\n- Integers: e.g., 50, -532.\n- Floating\
    \ point value: e.g., 0.02, -73.1.\n- A single character: e.g., \"a\", \"A\", \"\
    9\", \"&\".\n- Character string/text: e.g., \"Hello, world\".\n\n## Arrays\n\n\
    When working with a large number of values, it is inconvenient to have to create\
    \ a variable for each value. An array allows a list of values to be managed.\n\
    \n```\nvar planets = [\"Mercury\", \"Venus\", \"Earth\", \"Mars\",\n         \
    \   \"Jupiter\", \"Saturn\", \"Uranus\", \"Neptune\"];\n```\n\nArrays are defined\
    \ by their square brackets. Within these, any number of values (here the eight\
    \ planet names) can be listed, separated by commas.\n\n```\nconsole.log(planet[0]);\n\
    ```\n\nValues can be accessed by entering an index number in the square brackets\
    \ following the variable name. The index 0 points to the first entry in the array.\n\
    \nIf values are not immediately assigned to an array, the array can be created\
    \ first and filled later:\n\n```\nvar planetDiameter = [];\nplanetDiameter[0]\
    \ = 4879;\nplanetDiameter[1] = 12104;\nplanetDiameter[2] = 12756;\nplanetDiameter[3]\
    \ = 6794;\n...\n```\n\nArrays have many other functions for processing elements.\
    \ In this book we mainly use `<yourarray>.push()` to add new elements to the end\
    \ of an array.\n\nThe square brackets initialize an empty array. Values are then\
    \ assigned to the array. This could also happen later while the program is running.\n\
    \n```\nplanet.push(\"Pluto\");\n```\n\nAlthough Pluto is no longer considered\
    \ a planet, its name can be added to the array `planet` in this way.\n\n## Objects\n\
    \nIn addition to arrays, many pieces of information can be stored in objects at\
    \ one time. The difference is that individual values are not accessed via a numeric\
    \ index but via a key.\n\n```\nvar planet = {name: \"Saturn\", mass: 5.685e26,\n\
    \    temperature: 134};\n\nplanet.diameter = 120536;\n\nconsole.log(\"mass in\
    \ kg: \" + planet.mass);\n```\n\nAlternatively, a value can be accessed as follows.\
    \ This is necessary if the keys are not fixed from the beginning but are dynamically\
    \ generated or read out.\n\nJavaScript objects are created by enclosing a set\
    \ of key/value pairs within a set of curly brackets {}. Here an object with three\
    \ key/value pairs is generated. Another key/value pair is added to the existing\
    \ object, and one of the values is accessed and logged to the console.\n\n```\n\
    var k = \"mass\";\n\nconsole.log(\"mass in kg: \" + planet[k]);\n```\n\nIf the\
    \ name of the key is stored in a variable, then the value can be accessed using\
    \ that variable as a reference to that key.\n\n## Operators and Mathematics\n\n\
    Naturally, calculations can also be performed in Processing. This is possible\
    \ with simple numbers . . .\n\n```\nvar a = (4 + 2.3) / 7;\n```\n\nwith strings\
    \ ...\n\nAfter execution the value 0.9 is saved in a.\n\n```\nvar s = \"circumference\
    \ of Jupiter: \" + (142984*PI) + \" km\";\n```\n\nThe variable s then contains\
    \ the string \"circumference of Jupiter: 449197.5 km\".\n\nand with variables:\n\
    \n```\nvar i = myVariable * 50;\n```\n\nThe value in myVariable is multiplied\
    \ by 50 and the result saved in i.\n\nThe following computational operators are\
    \ available: **+**, **-**, **\\***, **/**, **%**. A whole series of mathematical\
    \ functions are also available. Here are a few:\n\n```\nvar converted_aValue =\
    \ map(aValue, 10, 20, 0, 1); // 29\nvar roundedValue = round(2.67);\nvar randomValue\
    \ = random(-5, 5);\nvar cosineValue = cos(angle);\n```\n\n1. The value in `aValue`\
    \ is converted from a number between 10 and 20 to a number between 0 and 1.\n\
    2. Round: `roundedValue` is 3.\n3. A random number between -5 and 5.\n4. Calculates\
    \ the cosine of the angle.\n\n## Mouse and Keyboard\n\nThere are several ways\
    \ to access information using the mouse and keyboard as input devices. One option\
    \ is to query the variables available in p5.js.\n\n```\nfunction draw() {\n\n\
    \    console.log(\"mouseposition:\" + mouseX + \",\" + mouseY);\n    console.log(\"\
    mousekey pressed?:\" + mouseIsPressed);\n    console.log(\"key pressed?:\" + keyIsPressed);\n\
    \    console.log(\"last pressed key:\" + key); }\n```\n\nAnother possibility is\
    \ to implement one of the event handlers. An event handler is called when the\
    \ corresponding event occurs—i.e., when a mouse button or key on the keyboard\
    \ is pressed.\n\nThe Processing variables `mouseX` and `mouseY` always contain\
    \ the actual position of the mouse; `mouseIsPressed` is `true` if one of the mouse\
    \ buttons is pressed in that moment. For the keyboard, `keyIsPressed` indicates\
    \ if a key is pressed; the key last pressed appears in `key`.\n\n```\nfunction\
    \ mouseReleased() {\n  console.log(\"The mouse key was released\");\n}\n```\n\n\
    Additional event handlers include `mousePressed()`, `mouseMoved()`, `keyPressed()`,\
    \ and `keyReleased()`.\n\nThe function `mouseReleased()` is called when the left\
    \ mouse button is released.\n\n## Conditions\n\nIt is often necessary to execute\
    \ lines of code only when certain conditions are met. The `if` statement is used\
    \ to do this.\n\n```\nif (aNumber == 3) {\n  fill(255, 0, 0);\n  ellipse(50, 50,\
    \ 80, 80);\n}\n```\n\n```\nif (aNumber == 3) {\n    fill(255, 0, 0);\n} else {\n\
    \    fill(0, 255, 0);\n}\n\nif (aNumber == 3) fill(255, 0, 0);\nelse fill(0, 255,\
    \ 0);\n```\n\nDifferentiating between multiple values of a variable can usually\
    \ be achieved by the `switch` command.\n\n1. The two lines of code inside the\
    \ curly brackets are executed only when the condition inside the `if` statement\
    \ is met—i.e., when the value of the variable `aNumber` is 3.\n2. With else, the\
    \ `if` condition is expanded by one code snippet that is executed when the specified\
    \ `if` condition is not met.\n3. If a code snippet consists of only one line,\
    \ as in the previous example, the curly brackets can be eliminated.\n\n```\nswitch\
    \ (aNumber) {\ncase 1:\n    rect(20, 20, 80, 80);\n    break;\ncase 2:\n    ellipse(50,\
    \ 50, 80, 80);\n    break;\ndefault:\n    line(20, 20, 80, 80);\n}\n```\n\n[3]\
    \ The `switch` command tests if the value of the variable `aNumber` corresponds\
    \ to one of the values listed in the `case` lines, jumps there if it does, and\
    \ continues code execution until the following `break` statement.\n\nIf no corresponding\
    \ value exists, program execution continues at `default`.\n\n## Functions\n\n\
    There are often parts of a program that appear in a similar way in different places.\
    \ In many such cases it is wise to encapsulate these parts in a function. For\
    \ example:\n\n```\nfunction draw() {\n  translate(40, 15);\n  line(0, -10, 0,\
    \ 10);\n  line(-8, -5, 8, 5);\n  line(-8, 5, 8, -5);\n```"
  mdcn: "\n标准渲染器：如果没有指定其他渲染器，则使用此渲染器。\n\n用于在网页浏览器中进行硬件加速 3D 图形渲染的渲染器。\n\n## 变换\n\n\
    p5.js 的一个优势在于它可以移动、旋转和缩放坐标系。此后所有的图形命令都参照这个已改变的坐标系。\n\n```\ntranslate(40, 20);\n\
