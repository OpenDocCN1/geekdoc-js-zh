  md: '# P.2.1.5 From grid to moiré


    A moiré, which is usually considered a mistake in printing technology, is desirable
    here. By laying one graphic grid over another identical grid and moving it, you
    can generate unexpected optical illusions that you can change in real time.


    → P_2_1_5_01


    The moiré effect occurs when two or more fine grid structures overlap to form
    a coarser pattern. This happens because the overall picture shines brighter at
    all crossing points, because more of the white background can be seen next to
    these intersections.


