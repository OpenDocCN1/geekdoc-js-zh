  md: '# **P.2.2.2** Intelligent agents


    Behavioral patterns are now far more complex and subject to precise conditions.
    The agent easily goes astray when it crosses its own path. When it reaches the
    border of the display window, it changes direction. The straight lines, which
    are drawn between two points of intersection, change their color and stroke value
    depending on the traveled distance.


    # → P_2_2_2_01


    The agent always moves in one of the cardinal directions: north, east, south,
    or west. It can, however, choose from several possible angles, whereby right angles
    are not possible. When the agent reaches the border of the drawing canvas, it
    turns around and randomly selects one of the possible angles. When it crosses
    its own path, it maintains its general direction but selects a new angle.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_182_0.png)


