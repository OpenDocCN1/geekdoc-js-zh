    \ → 插图：Victor Juarez Hernandez 线条的多重叠加可用于创建精细的阴影效果。\n\n## P.2.3.3 用字体绘制\n\n有谁不喜欢在绘画时切换画笔呢？在此应用中，字符的位置和大小会根据画笔的位置和速度不断变换。用户可以绘制随机的字母系列，甚至整部小说。\n\
