    \n**Aerial Imagery**\n\nUSGS (United States Geological Survey)\n\nContrary to\
    \ popular belief, much of the world has yet to be fully mapped. Every day, satellites\
    \ orbit the earth, taking countless pictures, yet there is very limited knowledge\
    \ about what exactly was captured among the unique things in these pictures and\
    \ how they can be found and classified. **Aerial Bold**–a planet-wide letter search\
    \ mission–questions this and draws attention to this potential.\n\n---\n\n## P.0\
