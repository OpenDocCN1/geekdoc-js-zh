    # **P.4.3.2 Type from pixel values**


    The following text image is ambiguous. It can be read for its meaning, or viewed
    at a distance and perceived as a picture. The pixels from the image control the
    configuration of the letters. The size of each letter depends on the gray values
    of the pixels in the original image and thereby creates an additional message.


    → **P_4_3_2_01**


    A character string is processed letter by letter → P.3.1.1/P.3.1.2 and constructed
    row by row in the normal writing direction. Before a character is drawn, its position
    in display coordinates is matched to the corresponding position in the original
    image in pixel coordinates. Only a subset of the original pixels is used—merely
    those for which a corresponding character position exists. The color of the selected
    pixel can now be converted into its gray value and the gray value used to modulate
    the font size, for example.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_357_0.png)


