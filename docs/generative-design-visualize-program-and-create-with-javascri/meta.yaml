    \ Soler \n\n**Team**\nManuel Jimenez Garcia, Miguel Angel Jimenez Garcia, Ignacio\n\
    Viguera Ochoa, Gilles Retsin, Vicente Soler\n\n**VoxelChair** is the first prototype\
    \ resulting from new and ongoing software innovation and development for robotic\
    \ 3D printing. The software behind the VoxelChair draws on methodologies ranging\
    \ from computational architecture to medical imaging to create new opportunities\
    \ for designing and printing 3D compositions and structures. The creators suggest\
    \ that \"instead of designing the form of the chair, designers should design the\
    \ behaviors and properties of the material directly.\"\n\n---\n\n## 09\n\n2016\
    \ **Collide: synaesthetic art installation**\nOnformative\n\n**Client**\nDolby\
    \ Laboratories\n\n**Collide** is an art installation that transforms recorded\
    \ motion data into abstract graphics and sound. Surreal imagery and an engaging\
    \ soundscape create an immersive space that captures the essence of motion, color,\
    \ and sound to represent the experience of \"letting go.\" Inspired by the phenomenon\
    \ of synesthesia, the union of the senses, Collide creates a new language by combining\
    \ original chamber music and painterly visuals.\n\n---\n\n## 10\n\n2017 **Block\
    \ Bills**\nMatthias Dörfelt\n\nArchival digital print on paper, 3.3 x 5.9 in.\n\
    \n**Block Bills** is a series of sixty-four generated banknotes representing blocks\
    \ in a Bitcoin blockchain. A visual system defined by the artist Matthias Dörfelt\
    \ uses both randomness and the unique aspects of each block in the selected blockchain\
    \ to affect every aspect of each bill in the series. The bills are allusions to\
    \ Dörfelt's ambivalence toward Bitcoin and cryptocurrencies; they bring these\
    \ otherwise intangible and invisible constructions into a visually and emotionally\
    \ tangible context.\n\n---\n\n## 11\n\n2015 **Roads to Rome**\nBenedikt Groß\n\
