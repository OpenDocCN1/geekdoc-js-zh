    is increased, step by step. The inner loop then draws a line by increasing the
    value for the rectangle''s x-position, step by step, until the entire width is
    processed. The step size is set by the value of the mouse position and is located
    in the variables stepX and stepY. It also determines the length and width of the
    rectangles.


