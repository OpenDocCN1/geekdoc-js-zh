  md: 'The standard renderer: this is used if nothing else has been specified.


    Renderer for hardware-accelerated 3D graphics in the web browser.


    **Transformations** One of the strengths of p5.js is that it can move, rotate,
    and scale the coordinate system. All graphic commands thereafter refer to this
    altered coordinate system.


    ```

    translate(40, 20);


    rotate(0.5);


    scale(1.5);

    ```


    In this example, the coordinate system is moved 40 pixels to the right and 20
    pixels downward, then rotated 0.5 radians (about 30°), and finally scaled by a
    factor of 1.5.


    In Processing, angles are generally shown in radians, in which 180° equals the
    number pi (≈ 3.14) and the rotation is in a clockwise direction.'
