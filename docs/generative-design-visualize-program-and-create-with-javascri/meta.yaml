    # P.1.1.1 Color spectrum in a grid


    This color spectrum is composed of colored rectangles. Each tile is assigned a
    hue on the horizontal axis and a saturation value on the vertical. The color resolution
    can be reduced by enlarging the rectangles so that the primary colors in the spectrum
    become clearer.


    # → P_1_1_1_01


    The grid is created by two nested for loops. In the outer loop, the y-position
    is increased, step by step. The inner loop then draws a line by increasing the
    value for the rectangle''s x-position, step by step, until the entire width is
    processed. The step size is set by the value of the mouse position and is located
    in the variables stepX and stepY. It also determines the length and width of the
    rectangles.


