    \n## **A.1** 展望未来\n\n你想更深入地探索生成式设计吗？我们希望如此，因为还有许多等待发现的奥秘！本章概述了复杂方法，它们是数据可视化、三维形状生成、粒子动画等的基础。你可以在我们的网站和GitHub频道上找到附加草图中的代码（链接见\
    \ [generative-gestaltung.de](https://generative-gestaltung.de)）。在前几章的实践操作之后，本章邀请你反思所学到的知识，并探索生成式设计背景下的理论和概念联系。\n\
    \n→ **M_1_5_02** 当噪声生成的值控制一群智能体的方向运动时，就会出现一幅典型的图像。智能体以点的形式呈现，并在旧图像上连续绘制时留下轨迹。\n\
    \n→ **M_2_5_02** 不同正弦波的叠加产生利萨如图形，以研究它们的科学家朱尔·安托万·利萨如命名。如果将生成的点不按顺序连接，而是每个点与其他所有点相连，就会产生令人兴奋的网状结构。\n\
    \n→ **M_4_3_01** 规则延伸的线上的点逐渐被吸引子变形，吸引子是编程实现的虚拟磁铁，可以吸引和排斥。\n\n**M_4_3_01** 以旭日图形式呈现的文件夹和文件的数据可视化。圆形片段颜色越深，文件夹中的文件未更改的时间就越长。可以从硬盘加载并可视化任何文件夹和文件结构。\n\
    \n**M_5_4_01** 维基百科文章链接结构的数据可视化。每个圆圈的大小代表文章的长度，而颜色则表示其主题。通过尝试示例程序，可以获得生成式设计本质的直观感受。在接下来的篇幅中，我们反思示例程序背后的理念，并将所学知识置于具体情境中。这一部分也具有参考性质——它识别相关主题和联系。\n\
    \n## A.2 反思\n\n本书展示了如何通过代码生成图像。通过尝试示例程序，你可以获得生成式设计本质的直观感受。在接下来的篇幅中，我们反思示例程序背后的理念，并将所学知识置于具体情境中。这一部分还识别了相关主题和联系。\n\
    \n**现状** 数字化已成为设计学科不可或缺的一部分，我们所有人都使用计算机进行日常工作。然而，设计领域最著名的工具，如Adobe创意云产品（Photoshop、Illustrator等），仅具有插图和成像功能。现有的模拟工具，如画笔、剪刀或照片冲印室，可以被虚拟化和高效化，使我们能更快地获得结果，工作更加舒适。但设计过程并未随着这些工具而进化。¹\
    \ 无论图像是用鼠标还是画笔创作的，例如绘制一条线的概念仍然相同。生成式设计与传统方法不同；其设计过程独一无二，并且本质上带来了新的可能性。\n\n**新的设计过程？**\
    \ 使用生成式设计所带来的设计过程中的主要变化是，传统 craftsmanship 退居幕后，抽象和信息成为新的核心元素。相关的问题不再是\"如何绘制？\"\
    而是\"如何抽象？\"这是因为从创意到最终图像的实现过程只能通过算法——计算机解释和执行的一系列规则——来完成。在显示之前，每个生成的图像必须首先用一套规则完整描述。这对设计师提出了两个挑战：如何抽象一个模糊的概念，以及如何以形式化的方式将概念输入计算机。抽象概念没有既定规则；要实施复杂的概念，必须将问题分解为更小的部分。这种解决问题的策略也被称为\"\
    分而治之\"。² 例如，要用随机直径的圆形尽可能多地填充一个表面，且不能有任何重叠。第一步是将模糊的概念转化为具体简单的\"配方\"。绘制一个新圆。如果这个圆与显示器上的任何其他圆不相交，则使这个圆尽可能大。如果该圆与另一个圆相交，则重新开始。\
    \ → P.2.2.5 只有通过这种分解，才能用编程语言表述各个步骤，从而使其对计算机可执行。编程语言提供了实现这一点的基本构建模块，如*重复*、*随机性*和*逻辑*，这些将在下文中更精确地解释。\n\
    \n**重复** 使我们能够让计算机处理一项任务直到解决，并赋予我们操作大量对象的能力。重复的重要性体现在本书程序中for循环的使用频率，或者draw循环是p5.js的核心函数这一事实上。\n\
    \n**随机性** 用于创建变化，以打破计算机严格的规律性。真正的随机性很少能产生构图上有趣的结果。相反，当随机性受到限制并以适量方式应用时，才会产生有趣的结果。在p5.js中，随机性由关键词\"\
    random\"和\"noise\"表示。 → P.3.2.5\n\n→ P_3_2_5_01 bis → P_3_2_5_0  \n动态文字\n```\n"
