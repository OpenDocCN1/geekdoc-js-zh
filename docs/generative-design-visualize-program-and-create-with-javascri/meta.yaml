  md: 'A circle is drawn on the canvas. A `function` is created by declaring the word
    "function" followed by the function name and a set of parentheses `()`. What the
    function should do—for example, draw a circle—is defined between the curly brackets
    `{...}`.


    ```

    point(60, 50);

    ```


    The pixel generated by the command `point(60, 50)` is thus drawn sixty pixels
    from the left edge and fifty pixels from the upper edge.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_71_0.png)


    Of course, it is possible to have more than one line of code. The individual lines
    are then processed sequentially from top to bottom. The following command lines
    are thus read by p5.js:


    ```

    fill(128);

    strokeWeight(1);

    ellipse(40, 50, 60, 60);

    rect(50, 50, 40, 20);

    ```


    With the commands, it is important to pay attention to the exact spelling, including
    uppercase and lowercase letters. For example, the `strokeWeight()` command would
    not be recognized if it were written as `strokeweight()` or `StrokeWeight()`.


    Set the fill color to a medium gray. Set the line width to 1 pixel. Draw an ellipse
    at the point (40, 50) with width and height 60 pixels. Draw a rectangle to the
    coordinates (50, 50) with width 40 and height 20.'
