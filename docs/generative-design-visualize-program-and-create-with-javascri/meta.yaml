    # **P.2.2.2** Intelligent agents


    Behavioral patterns are now far more complex and subject to precise conditions.
    The agent easily goes astray when it crosses its own path. When it reaches the
    border of the display window, it changes direction. The straight lines, which
    are drawn between two points of intersection, change their color and stroke value
    depending on the traveled distance.


