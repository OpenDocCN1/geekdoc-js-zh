    # **P.2.3.5** Drawing with the pen tablet


    Compared to a conventional mouse, a pen tablet puts several more parameters at
    a user''s disposal, including pressure and position. When drawing, the pen movement
    can be better recorded and interpreted so that the movement of your hand can be
    reproduced more accurately. When you use a pen tablet you are closer to the generative
    process.


    → **P_2_3_5_01_TABLET**


    The additional parameters provided by a pen tablet are transferred to a basic
    element (in this case a pen). The azimuth, pressure, and inclination define the
    rotation, saturation, and length, respectively, of the element. The parameters
    are read using the tablet classes of the book''s Generative Design library. The
    form is not loaded from an SVG file but rather drawn as a curve, enabling the
    individual curve points to be manipulated more easily.'
