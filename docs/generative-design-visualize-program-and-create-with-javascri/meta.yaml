- md: " **7** If `showCircle` is `true`, the circle is also drawn.\n\n**Mouse:** Drag:\
    \ Targeted placement of the circles\n\n+   **Keys:**\n- 1: Show/hide circles\n\
    - 2: Show/hide lines\n- Arrow ↓/↑: Change area to be drawn\n- S: Save image\n\n\
    → **P_2_2_5_02** By loading SVG modules, very different images are created. Using\
    \ keys 1 to 3, it is possible to specify which elements are to be visible: the\
    \ SVGs, the connecting lines, or the circles.\n\n## P.2.2.6 Agents on a pendulum\n\
    \nThese double agents are changeable and chained together. The agents move along\
    \ sets of interrelated pendulums, leaving behind complex traces that are reminiscent\
    \ of the drawings of a Spirograph. Over time, their secret mission becomes visible.\n\
    \n→ P_2_2_6_01\n\nThe agents form a chain of pendulums. To determine the individual\
    \ positions of the agents, we begin at the center. The angle of rotation and the\
    \ length of the pendulum determine the position of the first agent. This is also\
    \ the rotation center for the next pendulum. The farther out in the chain, the\
    \ shorter the pendulum becomes and the faster it turns. Every other pendulum turns\
    \ in the opposite direction.\n\n→ **P_2_2_6_01** Shapes with, e.g., three, six,\
    \ or four symmetry axes are produced with different settings for the ratio of\
    \ the rotational speeds.\n\n```\nfunction draw() {\n\n  background(0, 0, 100);\n\
    \n\n\n  angle += speed;\n\n\n\n  if (angle <= maxAngle + speed) {\n\n\n\n    var\
    \ pos = center.copy(); for (var i = 0; i < joints; i++) {\n\n\n\n    var a = angle\
    \ * pow(speedRelation, i); if (i % 2 == 1) a = -a;\n\n\n\n    var nextPos = p5.Vector.fromAngle(radians(a));\n\
    \    nextPos.setMag((joints - i) / joints * lineLength);\n    nextPos.add(pos);\n\
    \n\n\n    if (showPendulum) {\n\n      noStroke();\n\n      fill(0, 10);\n```\n\
    \n```\nellipse(pos.x, pos.y, 4, 4);\nnoFill();\nstroke(0, 10);\nline(pos.x, pos.y,\
    \ nextPos.x, nextPos.y);\n```\n\n```\npendulumPath[i].push(nextPos);\npos = nextPos;\n\
    ```\n\n```\nif (showPendulumPath) {\n  strokeWeight(1.6);\n  for (var i = 0; i\
    \ < pendulumPath.length; i++) {\n    var path = pendulumPath[i];\n    beginShape();\n\
    \    var hue = map(i, 0, joints, 120, 360);\n    stroke(hue, 80, 60, 50);\n  \
    \  for (var j = 0; j < path.length; j++) {\n      vertex(path[j].x, path[j].y);\n\
    \    }\n```\n\n```\nendShape();\n\n}\n\n}\n\n}\n```\n\n+   1. The variable `angle`\
    \ contains the angle for the first pendulum. In each frame, the angle is incremented\
    \ slightly.\n\n+   2. The variable `center` is copied to `pos`. It contains a\
    \ value from `p5.Vector`. Thus, only one variable is needed to store the x and\
