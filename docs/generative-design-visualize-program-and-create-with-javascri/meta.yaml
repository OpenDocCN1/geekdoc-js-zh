    \ speed can be influenced with the keys, thereby generating a variety of images.\n\
    \n## P.2.3.2 Relation and distance in drawing\n\nSince the relation of individual\
    \ elements to one another is crucial to an overall image, it is important for\
    \ users to be able to control individual parameters such as distance and angle;\
    \ this program provides the necessary knowledge.\n\n→ P_2_3_2_01\n\nIn the previous\
    \ example, a new element was drawn on the drawing canvas in each frame when the\
