- md: " → P_4_2_1_02 → Illustration: Andrea von Danwitz A second version of the program\
    \ allows the image details to be arranged radially around a particular center.\
    \ The angle at which the images gather and their distance from the center can\
    \ be specified for each layer.\n\n## P.4.2.2 Time-based image collection\n\nIn\
    \ this example, the inner structures of moving images are visualized. After extracting\
    \ individual images from a video file, this program arranges the images in defined\
    \ and regular time intervals in a grid. This grid depicts a compacted version\
    \ of the entire video file and represents the rhythm of its cuts and frames.\n\
    \n→ P_4_2_2_01\n\nTo fill the grid, individual still images are extracted at regular\
    \ intervals from the entire length of a video. Accordingly, a sixty-second video\
    \ and a grid with twenty tiles results in three-second intervals.\n\n```\nfunction\
    \ draw() {\n\n  if(movie.elt.readyState == 4) {\n\n    var posX = tileWidth *\
    \ gridX; var posY = tileHeight * gridY;\n    image(movie, posX, posY, tileWidth,\
    \ tileHeight);\n    currentImage++;\n\n    var nextTime = map(currentImage, 0,\
    \ imageCount, 0,\n    movie.duration());\n\n    movie.time(nextTime);\n\n    gridX++;\
    \ if (gridX >= tileCountX) {\n      gridX = 0; gridY++; }\n\n    if (currentImage\
    \ >= imageCount) noLoop(); }\n}\n```\n\nEvery time the `draw()` function is run,\
    \ an image is selected from the video and depicted in the grid. The first image\
    \ at time 0 can be placed immediately.\n\nThe next time in the video (`nextTime`)\
    \ is calculated. The variable `currentImage` (a number between 0 and `imageCount`)\
    \ is converted to a second value between 0 and the entire playing time of the\
    \ video.\n\nUsing the `time()` function, the program jumps to the newly calculated\
    \ time.\n\nTo define the next tile, `gridX` is increased by 1. If the end of the\
    \ line has been reached, the program jumps to the first image of the next line\
    \ by setting `gridX` to 0 and increasing `gridY` incrementally.\n\nThe end of\
    \ the program is reached when all the tiles are filled with images.\n\n**Keys:**\
    \ S: Save image\n\n→ **P_4_2_2_01** Fifty-five images from a two-and-a-half-minute\
    \ video clip, filmed on the way to the main train station in Stuttgart, Germany.\n\
    \n## Graphics from pixel values\n\nPixels, the smallest elements of an image,\
    \ can serve as the starting point for the composition of portraits. In this example,\
    \ each pixel is reduced to its color value. These values modulate design parameters\
    \ such as rotation, width, height, and area. The pixel is completely replaced\
    \ by a new graphic representation, and the portrait becomes somewhat abstract.\n\
    \n→ P_4_3_1_01\n\nThe pixels of an image are analyzed sequentially and transformed\
    \ into other graphic elements. The key to this is the conversion of the color\
    \ values of pixels (RGB) into the corresponding gray values, because—in contrast\
    \ to the pure RGB values—these can be practically applied to design aspects such\
    \ as line width. It is advisable to reduce the resolution of the source image\
    \ first.\n\n**→ P_4_3_1_01 → Photograph: Tom Ziora** The gray value of each pixel\
    \ defines the size of its diameter; the pixels' original color values are kept.\n\
    \n```\nfor (var gridX=0; gridX<img.width; gridX++) {\n  for (var gridY=0; gridY<img.height;\
    \ gridY++) {\n    var tileWidth = width / img.width; var tileHeight = height /\
    \ img.height; var posX = tileWidth * gridX; var posY = tileHeight * gridY; img.loadPixels();\n\
    \    var c = color(img.get(gridX, gridY));\n    var grayscale = round(red(c) *\
    \ 0.222 + green(c) * 0.707 + blue(c) * 0.071);\n    switch (drawMode) {\n    \
    \  case 1: var w1 = map(grayscale, 0, 255, 15, 0.1); stroke(0); strokeWeight(w1\
    \ * mouseXFactor); line(posX, posY, posX + 5, posY + 5); break; case 2: ...\n\
    \    }\n  }\n}\n```\n\n1. The width and height of the original image determines\
    \ the resolution of the grid.\n\n2. The color of the pixels at the current grid\
    \ position (and thus the image) is defined.\n\n3. In calculating the gray value,\
    \ the values for red, green, and blue are weighted differently, whereby there\
    \ are no absolutely correct weights since colors are both displayed and perceived\
    \ differently. This gray value is used later to control individual parameters.\n\
    \n4. The program provides several drawing modes, `drawMode`, which can also be\
    \ influenced by the horizontal mouse position. These were previously converted\
    \ into a value between 0.05 and 1 and are available in the variable `mouseXFactor`.\n\
    \n**Mouse:** Position x/y: Different parameters (dependent on drawing mode)\n\n\
    **Keys:** S: Save image\n\n→ P_4_3_1_01 The gray value defines the size, stroke\
    \ value, rotation, and position of the elements.\n\n→ **P_4_3_1_01** In this drawing\
    \ mode (key 9), each pixel is represented by several color-distorting elements.\n\
    \n**P_4_3_1_02** Pixels of various brightness are replaced here by SVG units.\
    \ The SVG files have been sorted according to brightness using a supplementary\
    \ program. Note that the files have been renamed (the brightness value forms the\
    \ beginning of the file name).\n\n## P.4.3.2 Type from pixel values\n\nThe following\
    \ text image is ambiguous. It can be read for its meaning, or viewed at a distance\
    \ and perceived as a picture. The pixels from the image control the configuration\
    \ of the letters. The size of each letter depends on the gray values of the pixels\
    \ in the original image and thereby creates an additional message.\n\n→ **P_4_3_2_01**\n\
    \nA character string is processed letter by letter → P.3.1.1/P.3.1.2 and constructed\
    \ row by row in the normal writing direction. Before a character is drawn, its\
    \ position in display coordinates is matched to the corresponding position in\
    \ the original image in pixel coordinates. Only a subset of the original pixels\
    \ is used—merely those for which a corresponding character position exists. The\
    \ color of the selected pixel can now be converted into its gray value and the\
    \ gray value used to modulate the font size, for example.\n\n→ P_4_3_2_01 The\
    \ color of a pixel can define the size or color of the letters, or both.\n\n```\n\
    function draw() {\n\n    ...\n\n    var x = 0; var y = 10; var counter = 0;\n\n\
    \    while (y < height) {\n\n        img.loadPixels();\n\n        var imgX = round(map(x,\
    \ 0, width, 0, img.width)) var imgY = round(map(y, 0, height, 0, img.height))\
    \ var c = color(img.get(imgX, imgY)); var grayscale = round(red(c) * 0.222 +\n\
    \n            green(c) * 0.707 +\n\n            blue(c) * 0.071); push(); translate(x,\
    \ y);\n\n        if (fontSizeStatic) {\n\n            textSize(fontSizeMax); if\
    \ (blackAndWhite) fill(grayscale); else fill(c); } else {\n\n            var fontSize\
    \ = map(grayscale, 0, 255, fontSizeMax, fontSizeMin);\n\n            fontSize\
    \ = max(fontSize, 1); textSize(fontSize); if (blackAndWhite) fill(0); else fill(c);\
    \ }\n\n        var letter = inputText.charAt(counter); text(letter, 0, 0);\n \
    \       var letterWidth = textWidth(letter) + kerning;\n\n        x += letterWidth;\
    \ pop();\n\n        if (x + letterWidth >= width) {\n          x = 0; y += spacing;\
    \ }\n\n        counter++; if (counter >= inputText.length) {\n          counter\
    \ = 0; }\n\n    }\n\n    noLoop(); }\n```\n\n1. The writing process continues\
    \ as long as the y-coordinate of the current writing position `y` is still less\
    \ than the height of the display.\n\n2. Using the `map()` function, the display\
    \ coordinates are converted into image coordinates; e.g., the x-coordinate `x`\
    \ is proportionally converted from a value between `0` and the display `width`\
    \ to a corresponding value between `0` and the width of the image `img.width`."
  mdcn: "\n → P_4_2_1_02 → 插图：Andrea von Danwitz 该程序的另一版本允许将图像细节以某个中心为圆心呈放射状排列。可为每一层指定图像聚集的角度以及它们与中心的距离。\n\
    \n## P.4.2.2 基于时间的图像采集\n\n在此示例中，动态图像的内部结构被可视化。从视频文件中提取出单帧图像后，该程序以规定且固定的时间间隔将图像排列在网格中。此网格呈现了整部视频文件的压缩版本，并展现了其剪辑和帧的节奏。\n\
    \n→ P_4_2_2_01\n\n为了填充网格，从视频的整个时长中按固定间隔提取单张静态图像。相应地，一段 60 秒的视频和一个包含 20 个单元的网格，会产生\
    \ 3 秒的间隔。\n\n```\nfunction draw() {\n\n  if(movie.elt.readyState == 4) {\n\n \
    \   var posX = tileWidth * gridX; var posY = tileHeight * gridY;\n    image(movie,\
    \ posX, posY, tileWidth, tileHeight);\n    currentImage++;\n\n    var nextTime\
    \ = map(currentImage, 0, imageCount, 0,\n    movie.duration());\n\n    movie.time(nextTime);\n\
    \n    gridX++; if (gridX >= tileCountX) {\n      gridX = 0; gridY++; }\n\n   \
    \ if (currentImage >= imageCount) noLoop(); }\n}\n```\n\n每次运行 `draw()` 函数时，都会从视频中选取一张图像并在网格中显示。时间\
    \ 0 处的第一张图像可以立即放置。\n\n计算视频中的下一个时间（`nextTime`）。变量 `currentImage`（一个介于 0 和 `imageCount`\
    \ 之间的数值）被转换为介于 0 和视频总播放时间之间的秒值。\n\n使用 `time()` 函数，程序跳转到新计算出的时间。\n\n为了定义下一个单元，将\
    \ `gridX` 增加 1。如果已到达行末，程序通过将 `gridX` 设为 0 并递增 `gridY`，跳转到下一行的第一张图像。\n\n当所有单元都被图像填满时，程序结束。\n\
    \n**按键：** S：保存图像\n\n→ **P_4_2_2_01** 从一段两分半钟的视频片段中提取的五十五张图像，拍摄于德国斯图加特前往中央火车站的途中。\n\
    \n## 由像素值生成的图形\n\n像素作为图像的最小元素，可以作为肖像构图的起点。在此示例中，每个像素被简化为其颜色值。这些值会调节设计参数，如旋转、宽度、高度和面积。像素完全被新的图形表现形式所取代，肖像因此变得有些抽象。\n\
    \n→ P_4_3_1_01\n\n图像的像素被按顺序分析并转换为其他图形元素。关键在于将像素的色值（RGB）转换为对应的灰度值，因为与纯 RGB 值不同，灰度值可以实际应用于线宽等设计方面。建议首先降低源图像的分辨率。\n\
    \n**→ P_4_3_1_01 → 摄影：Tom Ziora** 每个像素的灰度值定义了其直径大小；像素原始的颜色值被保留。\n\n```\nfor (var\
    \ gridX=0; gridX<img.width; gridX++) {\n  for (var gridY=0; gridY<img.height;\
    \ gridY++) {\n    var tileWidth = width / img.width; var tileHeight = height /\
    \ img.height; var posX = tileWidth * gridX; var posY = tileHeight * gridY; img.loadPixels();\n\
    \    var c = color(img.get(gridX, gridY));\n    var grayscale = round(red(c) *\
    \ 0.222 + green(c) * 0.707 + blue(c) * 0.071);\n    switch (drawMode) {\n    \
    \  case 1: var w1 = map(grayscale, 0, 255, 15, 0.1); stroke(0); strokeWeight(w1\
    \ * mouseXFactor); line(posX, posY, posX + 5, posY + 5); break; case 2: ...\n\
    \    }\n  }\n}\n```\n\n1. 原始图像的宽度和高度决定了网格的分辨率。\n\n2. 当前网格位置（即图像）的像素颜色被确定。\n\n\
    3. 在计算灰度值时，红色、绿色和蓝色的值被赋予不同的权重，由于颜色的显示和感知各不相同，因此不存在绝对正确的权重。此灰度值稍后用于控制各项参数。\n\n\
    4. 程序提供了多种绘图模式 `drawMode`，也可受鼠标水平位置的影响。这些值此前已被转换为介于 0.05 和 1 之间的数值，并存储在变量 `mouseXFactor`\
    \ 中。\n\n**鼠标：** 位置 x/y：不同参数（取决于绘图模式）\n\n**按键：** S：保存图像\n\n→ P_4_3_1_01 灰度值定义了元素的大小、描边值、旋转和位置。\n\
    \n→ **P_4_3_1_01** 在此绘图模式（按键 9）中，每个像素由多个颜色失真元素表示。\n\n**P_4_3_1_02** 此处，各种亮度的像素被\
    \ SVG 单元取代。SVG 文件已通过辅助程序按亮度排序。请注意，文件已被重命名（亮度值构成文件名的开头）。\n\n## P.4.3.2 由像素值生成的文字\n\
    \n以下文字图像是多义的。它可以被阅读以获取其含义，也可以在远处观看并感知为一幅图画。图像中的像素控制着字母的配置。每个字母的大小取决于原始图像中像素的灰度值，从而产生额外的信息。\n\
    \n→ **P_4_3_2_01**\n\n一个字符串逐字母处理 → P.3.1.1/P.3.1.2，并按正常的书写方向逐行构建。在绘制字符之前，其在显示坐标中的位置与原始图像中对应位置的像素坐标相匹配。仅使用原始像素的一个子集——仅使用那些存在对应字符位置的像素。所选像素的颜色现在可以转换为其灰度值，并利用该灰度值来调节字体大小等。\n\
    \n→ P_4_3_2_01 像素的颜色可以定义字母的大小或颜色，或两者兼具。\n\n```\nfunction draw() {\n\n    ...\n\
    \n    var x = 0; var y = 10; var counter = 0;\n\n    while (y < height) {\n\n\
    \        img.loadPixels();\n\n        var imgX = round(map(x, 0, width, 0, img.width))\
    \ var imgY = round(map(y, 0, height, 0, img.height)) var c = color(img.get(imgX,\
    \ imgY)); var grayscale = round(red(c) * 0.222 +\n\n            green(c) * 0.707\
    \ +\n\n            blue(c) * 0.071); push(); translate(x, y);\n\n        if (fontSizeStatic)\
    \ {\n\n            textSize(fontSizeMax); if (blackAndWhite) fill(grayscale);\
    \ else fill(c); } else {\n\n            var fontSize = map(grayscale, 0, 255,\
    \ fontSizeMax, fontSizeMin);\n\n            fontSize = max(fontSize, 1); textSize(fontSize);\
    \ if (blackAndWhite) fill(0); else fill(c); }\n\n        var letter = inputText.charAt(counter);\
    \ text(letter, 0, 0);\n        var letterWidth = textWidth(letter) + kerning;\n\
    \n        x += letterWidth; pop();\n\n        if (x + letterWidth >= width) {\n\
    \          x = 0; y += spacing; }\n\n        counter++; if (counter >= inputText.length)\
    \ {\n          counter = 0; }\n\n    }\n\n    noLoop(); }\n```\n\n1. 书写过程持续进行，只要当前书写位置的\
    \ y 坐标 `y` 仍小于显示区域的高度。\n\n2. 使用 `map()` 函数，显示坐标被转换为图像坐标；例如，x 坐标 `x` 按比例从介于 `0`\
    \ 和显示 `width` 之间的值转换为 `0` 和图像宽度 `img.width` 之间的对应值。\n"
