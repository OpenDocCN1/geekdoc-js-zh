  md: '# P.O.3 Programming beautifully


    In programming there are usually many ways to attain a desired result. The fact
    that a program works, however, is just one part of the solution, albeit a very
    important one; there are other aspects you should consider.


    **Comments** The trickier and more complex a program is, the harder it is for
    others—and for you, too, after a short time—to understand it. A program that is
    not accessible cannot be modified or updated. Comments in the program help to
    clarify the code.


    ```

    // calculate distance between actual and previous mouse // position, which represents
    the speed of the mouse


    var speed = dist(mouseX, mouseY, pmouseX, pmouseY);

    ```


    The p5.js community is spread across the entire world. It is therefore advisable
    to write comments and variable names in English. This makes it easier for you
    and others to look for and find suggestions and answers to problems on internet
    forums.


    > 1 Text that follows two forward slashes is ignored and can be used for comments.


    **Useful Names and Clear Structures** In addition to the use of comments, sensibly
    selected variable and function names help users to maintain an overview and to
    understand what a specific program does.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_91_0.png)'
