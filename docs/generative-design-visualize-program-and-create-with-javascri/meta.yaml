    # P.2.2.1 Dumb agents


    Instead of being rigidly embedded in a grid, the pixel now becomes an agent and
    can move freely based on different behavioral patterns. With each step the agent
    advances according to one of eight directions, leaving a trail behind it. It pursues
    its mission and never gives up.


    → P_2_2_1_01


    During each drawing operation, one of the eight possible directions is randomly
    selected for the next step. Steps are made by adding or subtracting a predetermined
    value (step size) to the current position''s coordinates. The circle is finally
    drawn at the new position.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_174_0.png)'
