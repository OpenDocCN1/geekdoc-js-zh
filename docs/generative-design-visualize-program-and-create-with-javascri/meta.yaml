  md: '# **New Possibilities in Design**


    The integration of programming into the design process greatly increases the possibilities
    for designers. Conceptual competence still lies with the designer; the computer
    assumes only the role of the tireless helper. It is a given in today''s automated
    and digital world that designs can be executed quickly and easily and that it
    is possible to generate a composition with thousands of elements. But it is more
    interesting to look at the new possibilities of generative design in terms of
    *emergence*, *simulation*, and *tools*.


    In the context of generative design, processes are emergent when their results
    are not predetermined and when the interaction of all the elements leads to more
    than is obvious from their individual properties. A common example of *emergence*
    is the flocking behavior of birds: simple rules result in highly complex, unpredictable
    behavior. In the section "Growth structure from agents," [→ P.2.2.4](#) a very
    simple algorithm that consists of only two steps results in completely unexpected
    organic structures. (Boids and automata are other examples.)


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_404_0.png)


    [→P.2.2.4](#)

    Growth structure from agents


    The **simulation** of natural processes is another important method in generative
    design. For example, in the chapter "Agents on a pendulum," [→ P.2.2.6](#) a structure
    of several connected pendulums is created. The movement of a single pendulum is
    simple: it circles its'
  merge: -1
  pgno: 404
- img_proc: true
  md: 'point of articulation. However, if several of them are linked to form a chain,
    then the outermost ones move in a complex manner. And, as is so often the case,
    the transfer of knowledge between fields leads to amazing results; certainly there
    are many more models in nature that could potentially be transferred to a generative
    system.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_405_0.png)


    # → P.2.2.6


    Agents on the pendulum


    Perhaps the most important aspect of this increase in possibilities is that the
    designer is now the creator of individualized tools, since each generative program
    is also a customized software tool. This allows the designer to explore new paths
    that would not have been available using existing software, leading to a wider
    range of visual design mediums. It is astonishing how much designers can accomplish
    with tools they develop themselves, as is evident in "Drawing." → P.2.3 Even these
    simple tools greatly increase a designer''s options, and, because such tools can
    be refined constantly, they become perfectly tailored work instruments. In addition,
    it is usually not a huge leap from a generative program to developing one''s own
    app.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_405_1.png)'
  merge: -1
