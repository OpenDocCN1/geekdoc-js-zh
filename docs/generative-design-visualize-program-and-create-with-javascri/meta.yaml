    \ sketch.js 中所做的任何更改。重新加载浏览器以查看更改。\n\n关于使用 p5.js 的更详细指南，可以在 p5.js 网站上找到。\n\n[p5js.org/get-started](http://p5js.org/get-started)\n\
    \n! 我们的一些代码示例需要在服务器上运行才能工作。这些草图使用外部资源，如网络摄像头或外部文件，必须由 Web 服务器执行（草图的 URL 必须以\"\
    http\"开头，否则浏览器将禁止使用这些资源）。关于如何使用它们的详细说明可以在本书的网站上找到。\n\n```\nfunction setup() {\n\
    \    createCanvas(720, 720);\n    noFill();\n    console.log(\"Hello\");\n}\n\n\
    function draw() {\n    background(255);\n    ellipse(mouseX, mouseX, 40, 40);\n\
    }\n```\n\n代码编辑器，例如 Sublime Text。编辑器是一个独立的程序，不集成在浏览器中。\n\n直接从硬盘在浏览器中打开 index.html\
    \ 文件，因此草图也是如此。因此 URL 也以\"file\"开头。\n\n## P.0.2 语言元素\n\n为了能够向计算机发出指令，你需要使用它的语言。在下面的部分中，将介绍\
    \ JavaScript 和 p5.js 最重要的函数和控制结构。\n\n**你好，椭圆** 第一个程序。打开 sketch.js 文件（位于 empty-example\
    \ 文件夹中），在 `draw()` 函数中输入以下行，并在浏览器中打开相关的 index.html。\n\n```\nfunction draw() {\n\
    \n  ellipse(50, 50, 80, 80);\n\n}\n```\n\n有些命令用于绘制，如 `ellipse`、`rect`、`line` 等，有些命令指定后续图形应如何绘制，如\
    \ `stroke`、`strokeWeight`、`noStroke`、`fill`、`noFill` 等。一旦配置了绘制模式，它将应用于所有额外的绘制命令，直到重新配置绘制模式。大多数绘制命令需要一个或多个参数来指示应在何处绘制以及以何种大小绘制。计量单位是像素。坐标系的原点位于绘图Canvas的左上角。\n\
    \n在画布上绘制了一个圆。通过声明单词 \"function\" 后跟函数名和一组括号 `()` 来创建 `function`。函数应该做什么——例如，画一个圆——定义在花括号\
    \ `{...}` 之间。\n\n```\npoint(60, 50);\n```\n\n因此，由命令 `point(60, 50)` 生成的像素绘制在距左边缘六十像素、距上边缘五十像素的位置。\n\
    \n当然，可以有多于一行的代码。然后各行从上到下依次处理。因此，p5.js 读取以下命令行：\n\n```\nfill(128);\nstrokeWeight(1);\n\
    ellipse(40, 50, 60, 60);\nrect(50, 50, 40, 20);\n```\n\n使用这些命令时，重要的是要注意精确拼写，包括大小写字母。例如，如果\
    \ `strokeWeight()` 命令写成 `strokeweight()` 或 `StrokeWeight()`，则无法识别。\n\n将填充色设置为中灰色。将线宽设置为1像素。在点\
    \ (40, 50) 处绘制一个宽度和高度为60像素的椭圆。在坐标 (50, 50) 处绘制一个宽度为40、高度为20的矩形。\n\n### Setup、Draw\
    \ 和 Preload\n\np5.js 提供了各种自动调用的函数。其中两个最重要的是 `setup()` 和 `draw()`。\n\n`draw()`\
    \ 函数在每个绘图步骤中被调用，每次都会执行每行命令。\n\n```\nfunction draw() { }\n```\n\n- 尽管这个 `draw()`\
    \ 函数不包含任何命令，但它保持程序运行。\n\n```\nfunction draw() {\n  console.log(frameCount); }\n\
    ```\n\n`draw()` 函数以预设的频率显示，该频率指定每秒显示多少图像。标准数字设置为每秒六十帧，但可以使用 `frameRate()` 命令重置。\n\
    \n5. 一个带有一条命令的 `draw()` 函数。命令 `console.log()` 将文本写入控制台。在这种情况下，它显示实际帧数不断增加的数字。\n\
    \n```\nframeRate(30);\n```\n\n然而，如果每帧的计算量变得如此之大，以至于浏览器无法在预设时间内执行，则设置的帧率会自动降低。\n\
    \n有些操作只应在程序启动时执行一次，而不是在每帧中重复执行。`setup()` 函数就是用于此目的。\n\n6. 此绘图速度设置为每秒30帧。\n\n```\n\
    function setup() {\n\n    frameRate(30);\n\n}\n```\n\n`preload()` 函数确保在程序启动时完全加载附加数据。\n\
    \n7. 这些命令只应在程序启动时执行一次，它们出现在 `setup()` 函数中。\n\n```\nfunction preload(){\n```\n\n\
    ```\nimg = loadImage(\"data/pic1.jpg\");\n}\n```\n\n8. 在 `preload()` 中插入加载数据的指令；在此示例中，应加载一张图像。\n\
    \n### 绘图Canvas和渲染器\n\n在浏览器窗口中创建了一个绘图Canvas。这是程序视觉输出的显示窗口，可以缩放到任意大小。\n\n```\ncreateCanvas(640,\
    \ 480);\n```\n\n除了参数的宽度和高度之外，使用 `createCanvas()` 命令还可以输入应使用哪个渲染器来显示图像。渲染器负责将不同的图形命令实际转换为像素。以下渲染选项可用：\n\
    \n9. 绘图Canvas现在宽640像素，高480像素。\n\n```\ncreateCanvas(640, 480, P2D);\n\ncreateCanvas(640,\
    \ 480, WEBGL);\n```\n"
