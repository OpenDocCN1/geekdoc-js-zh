  md: '# # P.O.O p5.js, JavaScript, and Processing


    The JavaScript library p5.js is used in this book to introduce the concepts of
    generative design. Presented on the following pages is an overview of the basic
    elements and functions of JavaScript and a brief outline of the history of Processing
    and p5.js.


    The project p5.js was started in August 2013 by Lauren McCarthy, an artist and
    assistant professor in UCLA’s Design Media Arts program. To explain the idea behind
    p5.js, it is useful to start by referencing the much older Processing project.


    The programming language Processing was initiated in the spring of 2001 by Ben
    Fry and Casey Reas with a small group of assistants. The main aim of Processing
    was and still is to give visually oriented people easy access to programming.
    Processing is a tool or development environment for the quick creation of digital,
    programmed sketches (a Processing program is called a “sketch”).¹ There is a large,
    vibrant community surrounding Processing that greatly simplifies collaborative
    learning. There are many examples, videos, tutorials, et cetera, available online.
    Processing has become standard for programming in design, infographics, architecture,
    and art.


    [processingfoundation.org](http://processingfoundation.org)


    **Casey Reas and Ben Fry**


    p5.js pursues the same goal: making it as easy as possible to program graphics.
    The individual commands of p5.js and Processing are extremely similar. The main
    difference is that unlike Processing, p5.js is based not on Java programming but
    on JavaScript. This is technically significant as well as important for users
    because JavaScript is the programming language that runs in web browsers and makes
    websites dynamic and interactive. The programs created with the help of p5.js
    can be used directly on the web.'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'p5.js is an open-source project; it can be downloaded for free and used for
    independent projects. Since p5.js is a JavaScript library and JavaScript is the
    most widely used programming language of the internet age, it is easy to translate
    the code examples to most other development environments. JavaScript is cross-platform,
    so the same source code can be used on all operating systems for which a modern
    browser or a corresponding runtime environment exists—not only on computers but
    also on smartphones and tablets.


    Additionally, there is an enormous online community surrounding p5.js and, to
    an even greater extent, JavaScript. There is an online answer to almost any JavaScript-related
    question or problem. The internet is full of other JavaScript libraries, which
    can usually be combined easily with p5.js.


    For the programs in this book, we use our own program library, which can be found
    on the book’s website; we also have provided a list of external libraries. For
    example, you can use the generative-design-library to work on your graphics tablet
    or create color palettes in Adobe ASE format.


    [generative-gestaltung.de](https://generative-gestaltung.de)


    [generative-design-library](https://generative-design-library)


    **Palette exporting P.1.2**


    Color palettes


    **Writing Programs** p5.js uses the JavaScript programming language, but it is
    simpler than pure JavaScript. The most important commands, especially those for
    graphical output (such as drawing a circle), are very easy to use. The beginner
    is not burdened with additional constructions that would otherwise be necessary
    to display graphic elements in the browser window.


    On the following pages we will demonstrate how to set up a work space—the development
    environment—and introduce the most'
