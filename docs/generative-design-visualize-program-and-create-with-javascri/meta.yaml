    \n→**P_2_2_4_01** 圆圈逐渐填充区域，有机结构随之演化。\n\n```\nfunction draw() {\n\n  background(255);\n\
    \n  var newR = random(1, 7); var newX = random(newR, width -\nnewR); var newY\
    \ = random(newR, height - newR); var\nclosestDist = Number.MAX_VALUE;\n\n  var\
    \ closestIndex = 0;\n\n  for (var i = 0; i < currentCount; i++) {\n\n    var newDist\
    \ = dist(newX, newY, x[i], y[i]); if (newDist <\n      closestDist) {\n\n    \
    \  closestDist = newDist;\n      closestIndex = i;\n    }\n  }\n\n  var newR =\
    \ min(r[closestIndex], closestDist - r[closestIndex]);\n\n  if (newR > 0) {\n\
    \    x[currentCount] = newX;\n    y[currentCount] = newY;\n    r[currentCount]\
    \ = newR;\n    currentCount++;\n  }\n\n  for (var i=0; i < currentCount; i++)\
    \ {\n    fill(50);\n    noStroke();\n    ellipse(x[i], y[i], r[i]*2, r[i]*2);\n\
    \  }\n}\n```\n\n```\nclosestIndex = i;\n\t\t\t\t}\n\t\t\t\t}\n\n// fill(230);\n\
    // ellipse(newX, newY, newR 2, newR 2);\n// line(newX, newY, x[closestIndex],\
    \ y[closestIndex]);\n\nvar angle = atan2(newY - y[closestIndex], newX - x[closestIndex]);\n\
    \nx[currentCount] = x[closestIndex] + cos(angle) * (r[closestIndex] + newR);\n\
