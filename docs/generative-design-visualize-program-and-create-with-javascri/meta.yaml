    \ remains the same. Generative design is different from conventional methods;\
    \ the design process is unique and by its nature results in new possibilities.\n\
    \n**The New Design Process?** The main change in the design process achieved by\
    \ using generative design is that traditional craftsmanship recedes into the background,\
    \ and abstraction and information become the new principal elements. The relevant\
    \ question is no longer \"How do I draw?\" but rather \"How do I abstract?\" This\
    \ is because the process that leads from the idea to the final image can only\
    \ take place using an algorithm—a sequence of rules—that the computer interprets\
    \ and processes. Before appearing in the display, each generated image must first\
    \ be described completely using a set of rules. This poses two challenges for\
    \ the designer: how to abstract a vague idea, and how to enter an idea into the\
    \ computer in a formalized way. No set rules exist for how to abstract an idea;\
    \ for a complex idea to be implemented, the problem must be broken down into smaller\
    \ chunks. This problem-solving strategy is also known as \"divide and conquer.\"\
