  md: '# P.1.2.1 Color palettes through interpolation


    In each color model, colors have their clearly defined place. The direct path
    from one color to another always has precisely definable gradations, which will
    vary depending on the specific model. Using this interpolation you can create
    color groups in every gradation, as well as locate individual intermediate nuances.


    → P_1_2_1_01


    Because a color is not defined by a single number but by several values, it is
    necessary to interpolate between these values. Depending on the chosen color model,
    RGB or HSB, the same color is defined by different values, thereby causing the
    path from one to another to lead past different colors. In the HSB color model,
    for instance, a detour is made past the color wheel. This difference is due to
    the characteristics of the color models, both of which can be very useful, depending
    on the situation. It is therefore important to choose the appropriate color model
    to solve a specific problem.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_111_0.png)


