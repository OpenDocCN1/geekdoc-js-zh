  md: '# P.2.1.3 Complex modules in a grid


    Even more interesting is the nesting of several forms into a complex module. In
    this illustration, four different clusters of ellipses increase in size in opposite
    directions and are positioned alternately on the grid. The varied diameters and
    transparencies of the individual ellipses create an illusion of depth.


    → P_2_1_3_01


