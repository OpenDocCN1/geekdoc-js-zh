    \ joints; i++) {\n\n\n\n    var a = angle * pow(speedRelation, i); if (i % 2 ==\
    \ 1) a = -a;\n\n\n\n    var nextPos = p5.Vector.fromAngle(radians(a));\n    nextPos.setMag((joints\
    \ - i) / joints * lineLength);\n    nextPos.add(pos);\n\n\n\n    if (showPendulum)\
    \ {\n\n      noStroke();\n\n      fill(0, 10);\n```\n\n```\nellipse(pos.x, pos.y,\
    \ 4, 4);\nnoFill();\nstroke(0, 10);\nline(pos.x, pos.y, nextPos.x, nextPos.y);\n\
    ```\n\n```\npendulumPath[i].push(nextPos);\npos = nextPos;\n```\n\n```\nif (showPendulumPath)\
    \ {\n  strokeWeight(1.6);\n  for (var i = 0; i < pendulumPath.length; i++) {\n\
    \    var path = pendulumPath[i];\n    beginShape();\n    var hue = map(i, 0, joints,\
    \ 120, 360);\n    stroke(hue, 80, 60, 50);\n    for (var j = 0; j < path.length;\
    \ j++) {\n      vertex(path[j].x, path[j].y);\n    }\n```\n\n```\nendShape();\n\
    \n}\n\n}\n\n}\n```\n\n+   1. 变量 `angle` 包含第一个摆的角度。在每帧中，角度会略微增加。\n\n+   2. 变量 `center`\
    \ 被复制到 `pos`。它包含一个来自 `p5.Vector` 的值。因此，只需一个变量即可存储点的 x 和 y 坐标。此外，p5.Vector 对象还提供了更多实用的计算功能。\n\
    \n+   3. 每个摆的角度 `a` 由基础角度和一个因子计算得出，该因子随着摆与中心距离的增加而增大；例如，当 `speedRelation` 的值为\
    \ 2 时，索引为 3 的摆的因子为 8（2 的 3 次方）。每隔一个摆的旋转方向反转。\n\n+   4. 为了达到摆末端的位置，使用 `fromAngle()`\
    \ 函数从刚才计算的角度生成一个单位向量（长度为 1 的向量）。`setMag()` 将其延长并加上当前位置 `pos`。\n\n+   5. 如果要显示摆，则绘制一个圆和一条线。\n\
    \n6 新计算出的位置 `nextPos` 被添加到摆的路径中，并在下一次迭代中用作起始位置 `pos`。\n\n7 各条路径被分配不同的颜色。根据它们的索引\
