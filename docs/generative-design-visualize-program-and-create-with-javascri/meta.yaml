  md: '# P.1.1.1 Color spectrum in a grid


    This color spectrum is composed of colored rectangles. Each tile is assigned a
    hue on the horizontal axis and a saturation value on the vertical. The color resolution
    can be reduced by enlarging the rectangles so that the primary colors in the spectrum
    become clearer.


    # → P_1_1_1_01


