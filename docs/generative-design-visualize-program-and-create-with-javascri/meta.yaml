    # P.3.1.2 Text as blueprint


    In this example, time no longer determines letter size. Rather, certain letters
    modify, for instance, the text orientation. In this program, every character is
    translated using a visual rule. The source text thus becomes the blueprint for
    the composition.


    # → P_3_1_2_01


    The user can freely enter the text using the keyboard. Every character is translated
    by a fixed rule in the program that specifies what will be drawn and how position
    and size are to be altered.


    Every entry can be undone using the backspace or delete key.


    In this example, some of the characters are replaced by loaded SVG modules.


    | Key | Translation |

    | --- | --- |

    | A | → Enter A

    → Shift writing position |

    | B | → Enter B

    → Shift writing position |

    | Space | → Draw graphic image

    → Turn 45°

    → Shift writing position |

    | C | → Enter C

    → Shift writing position |

    | Comma | → Draw graphic image

    → Turn 45°

    → Shift writing position |


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_277_0.png)'
