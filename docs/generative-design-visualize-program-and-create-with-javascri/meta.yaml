    Manuel Jimenez Garcia, Miguel Angel Jimenez Garcia, Ignacio\nViguera Ochoa, Gilles\
    \ Retsin, Vicente Soler\n\n**VoxelChair**是机器人3D打印领域新兴软件创新与开发的第一个原型。VoxelChair背后的软件借鉴了从计算架构到医学影像等多种方法论，为设计和打印三维构图与结构创造了新的可能。创作者提出：\"\
    设计师不应设计椅子的形态，而应直接设计材料的行为和特性。\"\n\n---\n\n## 09\n\n2016 **Collide：联觉艺术装置**\nOnformative\n\
    \n**客户**\nDolby Laboratories\n\n**Collide**是一件将记录的运动数据转化为抽象图形与声音的艺术装置。超现实的意象和引人入胜的音景营造了一个沉浸式的空间，捕捉运动、色彩与声音的本质，以呈现\"\
    释放\"的体验。受联觉现象——感官的融合——的启发，Collide通过将原创室内乐与绘画般的视觉效果相结合，创造了一种新的语言。\n\n---\n\n##\
    \ 10\n\n2017 **Block Bills**\nMatthias Dörfelt\n\n收藏级数字微喷印刷，3.3 x 5.9 英寸\n\n**Block\
    \ Bills**是一组六十四张生成的钞票，代表比特币区块链中的区块。艺术家Matthias Dörfelt定义了一个视觉系统，该系统利用随机性以及所选区块链中每个区块的独特特征来影响该系列每张钞票的每个方面。这些钞票暗示了Dörfelt对\
    \ Bitcoin 和加密货币的矛盾心理；它们将这些原本无形且不可见的构造带入了一个视觉和情感上可触的语境中。\n\n---\n\n## 11\n\n2015\
    \ **条条大路通罗马**\nBenedikt Groß\nPhilipp Schmitt\nRaphael Reimann\nmoovel lab\n\n\
    地图与道路网络数据\nOpenStreetMap Routing Engine\nGraphHopper\n\n** Roads to Rome**是一个探索\"\
    条条大路通罗马\"这一习语的数据可视化项目。其成果既是信息可视化也是数据艺术，揭示了非常大尺度的移动模式。这些可视化是利用现有街道基础设施（OpenStreetMap）上的路由算法从城市尺度到大陆尺度创建的。除了其美学品质之外，所得图像还揭示了道路基础设施反映区域、政治和地理状况的方式。\n\
    \n---\n\n## 12\n\n2015 **Jller**\nBenjamin Maus\nProkop Bartoníček\n\n**附加机械与电子部分**\n\
    \nTomislav Arnaudov \n\n**开发于** pebe/lab（布拉格）和 FELD（柏林）\n\n**Jller**是工业自动化和历史地质学领域持续研究项目的一部分。该装置使用计算机视觉按地质年代对来自特定河流的卵石进行分类。该装置通过自动排序过程展示了自然的地质历史，这一过程本身即构成一场表演。\n\
    \n---\n\n## 13\n\n2016 **Aerial Bold**\nBenedikt Groß\nJoey Lee\n\nKICKSTARTER\n\
    \n全球字母形态搜索\n\n**字体设计**\n\nMarco Berends\n\n**机器学习硕士论文**\n\nAnkita Agrawal, Institute\
    \ for Artificial Intelligence, HS Ravensburg-Weingarten\n\n**资助与支持**\n\nKickstarter支持者\n\
    \n**航空影像**\n\nUSGS（美国地质调查局）\n\n与普遍认知相反，世界大部分地区尚未被完整测绘。每天，卫星环绕地球飞行，拍摄无数照片，然而对于这些图片中究竟捕获了什么独特事物、如何发现和分类它们，人们的知识却非常有限。**Aerial\
    \ Bold**——一个全球字母搜索任务——质疑了这一点，并引起了人们对这种潜力的关注。\n\n---\n\n## P.0 p5.js 入门介绍\n\n-\
    \ P.0.0 p5.js、JavaScript 与 Processing\n- P.0.1 开发环境\n- P.0.2 语言元素\n- P.0.3 优美地编程\n\
    \n---\n\n### P.0.0 p5.js、JavaScript 与 Processing\n\n本书使用 JavaScript 库 p5.js 来介绍生成设计的概念。以下页面将对\
    \ JavaScript 的基本元素和功能进行概述，并简要介绍 Processing 和 p5.js 的历史。\n\np5.js 项目于 2013 年 8\
    \ 月由 Lauren McCarthy 发起，她是一位艺术家，也是 UCLA 设计媒体艺术系的助理教授。要解释 p5.js 背后的理念，从引用更早的 Processing\
    \ 项目开始会很有帮助。\n\n编程语言 Processing 于 2001 年春季由 Ben Fry 和 Casey Reas 及其一小群助手发起。Processing\
    \ 的主要目的过去是、现在仍然是让视觉导向的人能够轻松接触编程。Processing 是一个工具或开发环境，用于快速创建数字编程草图（Processing\
    \ 程序被称为\"草图\" ¹）。Processing 周围有一个庞大而活跃的社区，极大地促进了协作学习。网上有许多示例、视频、教程等。Processing\
    \ 已成为设计、信息图、建筑和艺术领域编程的标准。\n\n[processingfoundation.org](http://processingfoundation.org)\n\
    \n**Casey Reas 和 Ben Fry**\n\np5.js 追求同样的目标：让图形编程尽可能简单。p5.js 和 Processing 的单个命令极为相似。主要区别在于，与\
    \ Processing 不同，p5.js 不是基于 Java 编程，而是基于 JavaScript。这在技术上很重要，对用户来说也很重要，因为 JavaScript\
    \ 是在网络浏览器中运行并使网站动态和交互的编程语言。借助 p5.js 创建的程序可以直接在网页上使用。\n\np5.js 是一个开源项目；它可以免费下载并用于独立项目。由于\
    \ p5.js 是一个 JavaScript 库，而 JavaScript 是互联网时代最广泛使用的编程语言，因此代码示例很容易移植到大多数其他开发环境中。JavaScript\
    \ 是跨平台的，因此相同的源代码可以在所有存在现代浏览器或相应运行时环境的操作系统上使用——不仅在计算机上，还可以在智能手机和平板电脑上。\n\n此外，p5.js\
    \ 周围有一个庞大的在线社区，JavaScript 更是如此。几乎每个与 JavaScript 相关的问题或难题都可以在网上找到答案。互联网上充满了其他 JavaScript\
    \ 库，它们通常可以很容易地与 p5.js 结合使用。\n\n对于本书中的程序，我们使用自己的程序库，可以在本书的网站上找到；我们还提供了一份外部库的列表。[例如](https://generative-design-library)，你可以使用\
    \ generative-design-library 在图形数位板上工作，或以 Adobe ASE 格式创建调色板。\n\n[generative-gestaltung.de](https://generative-gestaltung.de)\n\
    \n**调色板导出 P.1.2**\n\n调色板\n\n**编写程序**\n\np5.js 使用 JavaScript 编程语言，但它比纯 JavaScript\
    \ 更简单。最重要的命令，特别是用于图形输出的命令（例如绘制圆形），使用起来非常简单。初学者不会承受额外的构造负担，否则这些构造对于在浏览器窗口中显示图形元素是必要的。\n\
    \n在接下来的页面中，我们将演示如何设置工作空间——开发环境，并介绍最\n"
