    \ that explores the idiom \"All roads lead to Rome.\" The outcome is both information\
    \ visualization and data art and unveils mobility patterns at a very large scale.\
    \ The visualizations were created using routing algorithms on existing street\
    \ infrastructure (OpenStreetMap) from the city to continent scale. In addition\
    \ to their aesthetic quality, the resulting images bring insights into the ways\
    \ in which road infrastructures reflect regional, political, and geographical\
    \ situations.\n\n---\n\n## 12\n\n2015 **Jller**\nBenjamin Maus\nProkop Bartoníček\n\
