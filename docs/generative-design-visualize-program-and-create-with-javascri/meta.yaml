- md: 'Nevertheless, a designer who has programming skills is still the exception
    rather than the rule today. This has historical and cultural reasons: generally
    designers have been forced to decide to be either artists or technicians. To be
    both in perfect union is rarely an option, for example, in university curricula,
    although this distinction has begun to blur in recent years. In addition, learning
    this new design process—using mathematical-analytical source code to transform
    an idea into a visual result—feels to many like an insurmountable obstacle. Overcoming
    this obstacle is one of this book''s main objectives.


    An understanding of generative design will lead to a new matter-of-factness in
    taking advantage of the computer''s potential. Programming, and thus generative
    design, is rapidly becoming a universal cultural asset and technical tool, just
    as photography and film were in the last century. The possibilities are already
    there; we just need to use them.


    > **Georg Trogemann, Jochen Viehoff**

    > *CodeArt*, foreword


    > 1 "Painting with a mouse on the computer screen has a high entertainment value,
    but [. . .] drawing a stroke with a pen is no different from drawing a stroke
    with a mouse. The real challenge is to discover the intrinsic properties of the
    new medium and to find out how the stroke you draw via computation is one you
    could never draw, or even imagine, without computation."

    > **John Maeda**

    > *Design by Numbers*


    > 2 "In addition to ''divide and conquer,'' there are many other problem-solving
    strategies, such as top-down and bottom-up, et cetera. In this context, the ''pattern''
    idea (analyzing problems in recurring patterns and solving these systematically)
    can be very helpful."

    > **Christopher Alexander**

    > *A Pattern Language*


    > The ability to take data—to be able to understand it, to process it, to extract
    value from it, to visualize it, to communicate it—that''s going to be a hugely
    important skill in the next decades, not only at the professional level but even
    at the educational level for elementary school kids, for high school kids, for
    college kids. Because now we really do have essentially free and ubiquitous data.
    So the complimentary scarce factor is the ability to understand that data and
    extract value from it.

    >

    > **Hal Varian**

    > Professor at the University of California, Berkeley


