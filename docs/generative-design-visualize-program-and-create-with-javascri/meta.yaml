    \    background(255);\n    ellipse(mouseX, mouseX, 40, 40);\n}\n```\n\nA code\
    \ editor, for example Sublime Text. The editor is a separate program and is not\
    \ integrated in the browser.\n\nThe file index.html, and thus the sketch, is opened\
    \ directly in the browser from the hard drive. The URL therefore also starts with\
    \ \"file.\"\n\n## P.0.2 Language elements\n\nTo be able to give instructions to\
    \ a computer, you will need to speak its language. In the following section, the\
    \ most important functions and control structures of JavaScript and p5.js will\
    \ be introduced.\n\n**Hello, Ellipse** A first program. Open the sketch.js file\
    \ (located in the empty-example folder), enter the following line within the draw()\
    \ function, and open the associated index.html in a browser.\n\n```\nfunction\
    \ draw() {\n\n  ellipse(50, 50, 80, 80);\n\n}\n```\n\nThere are commands that\
    \ draw, such as `ellipse`, `rect`, `line`, et cetera, and commands that specify\
    \ how the graphic that follows should be drawn, such as `stroke`, `strokeWeight`,\
    \ `noStroke`, `fill`, `noFill`, et cetera. Once a drawing mode has been configured,\
    \ it will apply for all additional drawing commands until the drawing mode is\
    \ reconfigured. Most drawing commands require one or more parameters that indicate\
    \ where something should be drawn and at what size. The unit of measure for this\
    \ is the pixel. The origin of the coordinate system is located in the upper left\
    \ corner of the drawing canvas.\n\nA circle is drawn on the canvas. A `function`\
    \ is created by declaring the word \"function\" followed by the function name\
    \ and a set of parentheses `()`. What the function should do—for example, draw\
    \ a circle—is defined between the curly brackets `{...}`.\n\n```\npoint(60, 50);\n\
    ```\n\nThe pixel generated by the command `point(60, 50)` is thus drawn sixty\
    \ pixels from the left edge and fifty pixels from the upper edge.\n\nOf course,\
    \ it is possible to have more than one line of code. The individual lines are\
    \ then processed sequentially from top to bottom. The following command lines\
    \ are thus read by p5.js:\n\n```\nfill(128);\nstrokeWeight(1);\nellipse(40, 50,\
    \ 60, 60);\nrect(50, 50, 40, 20);\n```\n\nWith the commands, it is important to\
    \ pay attention to the exact spelling, including uppercase and lowercase letters.\
    \ For example, the `strokeWeight()` command would not be recognized if it were\
    \ written as `strokeweight()` or `StrokeWeight()`.\n\nSet the fill color to a\
    \ medium gray. Set the line width to 1 pixel. Draw an ellipse at the point (40,\
    \ 50) with width and height 60 pixels. Draw a rectangle to the coordinates (50,\
    \ 50) with width 40 and height 20.\n\n### Setup, Draw, and Preload\n\np5.js provides\
    \ various functions that are called automatically. The two most important are\
    \ `setup()` and `draw()`.\n\nThe `draw()` function is called in every drawing\
    \ step and each command line is executed each time.\n\n```\nfunction draw() {\
    \ }\n```\n\n- Although this `draw()` function contains no commands, it keeps the\
    \ program running.\n\n```\nfunction draw() {\n  console.log(frameCount); }\n```\n\
    \nThe `draw()` function is displayed with a preset frequency that specifies how\
    \ many images are shown per second. The standard number is set at sixty images\
    \ per second, but this can be reset using the command `frameRate()`.\n\n5. A `draw()`\
    \ function with one command. The command `console.log()` writes text to the console.\
    \ In this case, it displays the continually increasing number of the actual frame.\n\
    \n```\nframeRate(30);\n```\n\nHowever, if the computational effort per frame becomes\
    \ so high that the browser is unable to execute it within the preset time, the\
    \ set frame rate decreases automatically.\n\nSome actions should only be performed\
    \ once when the program is started and not repeatedly in each frame. The `setup()`\
    \ function is used for this.\n\n6. This drawing speed is set at 30 images per\
    \ second.\n\n```\nfunction setup() {\n\n    frameRate(30);\n\n}\n```\n\nThe `preload()`\
    \ function ensures that additional data are fully loaded when the program starts.\n\
    \n7. These commands, which should be executed just once when the program is started,\
    \ appear in the `setup()` function.\n\n```\nfunction preload(){\n```\n\n```\n\
    img = loadImage(\"data/pic1.jpg\");\n}\n```\n\n8. In `preload()` the instructions\
    \ for loading data are inserted; in this example an image should be loaded.\n\n\
    ### Drawing Canvas and Renderer\n\nA drawing canvas is created within the browser\
    \ window. This is the display window for the program's visual output and can be\
    \ scaled to any size.\n\n```\ncreateCanvas(640, 480);\n```\n\nIn addition to the\
    \ parameters' width and height, using the command `createCanvas()` makes it possible\
    \ to enter which renderer should be used for displaying the image. The renderer\
    \ is responsible for how the different graphic commands are actually translated\
    \ into pixels. The following rendering options are available:\n\n9. The drawing\
    \ canvas is now 640 pixels wide and 480 pixels high.\n\n```\ncreateCanvas(640,\
    \ 480, P2D);\n\ncreateCanvas(640, 480, WEBGL);\n```"
  mdcn: "\n 空间、开发环境，并介绍 p5.js 中最重要的语言元素和编程概念。你可以立即开始，输入所示的命令，并观察这些命令会生成什么。\n\n## P.0.1\
