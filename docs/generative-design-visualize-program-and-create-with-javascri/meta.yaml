  md: '# A.2 Reflection


    This book shows how imagery can be generated through code. By experimenting with
    the sample programs, you can gain a sense of what generative design is all about.
    On the following pages, we reflect on the ideas behind the sample programs and
    put what we have learned into context. This section also identifies related topics
    and connections.


    **Status Quo** Digitization has become an integral part of the discipline of design,
    and all of us use computers for our daily work. The best-known tools in the design
    sector, however, such as the Adobe Creative Cloud products (Photoshop, Illustrator,
    et cetera) have only an illustrative and imaging function. Existing tools, such
    as brushes, scissors, or photo labs, can be made virtual and more efficient, allowing
    us to get results faster and work more comfortably. Yet the design process has
    not evolved with these tools.¹ Whether an image has been produced with a mouse
    or a paintbrush, the concept of creating a line, for instance, remains the same.
    Generative design is different from conventional methods; the design process is
    unique and by its nature results in new possibilities.


    **The New Design Process?** The main change in the design process achieved by
    using generative design is that traditional craftsmanship recedes into the background,
    and abstraction and information become the new principal elements. The relevant
    question is no longer "How do I draw?" but rather "How do I abstract?" This is
    because the process that leads from the idea to the final image can only take
    place using an algorithm—a sequence of rules—that the computer interprets and
    processes. Before appearing in the display, each generated image must first be
    described completely using a set of rules. This poses two challenges for the designer:
    how to abstract a vague idea, and how to enter an idea into the computer in a'
  merge: -1
  pgno: 398
- img_proc: true
  md: "formalized way. No set rules exist for how to abstract an idea; for a complex\
    \ idea to be implemented, the problem must be broken down into smaller chunks.\
    \ This problem-solving strategy is also known as \"divide and conquer.\"² For\
    \ instance, a surface is to be filled with as many circles with random diameters\
    \ as possible without any overlaps. The first step is to convert the vague idea\
    \ into a concrete and simple \"recipe.\" Draw a new circle. If this circle does\
    \ not intersect with any other on the display, make this circle as large as possible.\
    \ If the circle intersects another, start over. → P.2.2.5 Only through this decomposition\
    \ is it possible to formulate the individual steps in a programming language,\
    \ thereby making it executable for the computer. A programming language offers\
    \ the elementary building blocks with which to do this, such as *repetition*,\
    \ *randomness*, and *logic*, which will be explained more precisely in the following\
    \ pages.\n\n**Repetition** allows us to let the computer work on a task until\
    \ it is solved and gives us the ability to manipulate a huge number of objects.\
    \ The importance of repetition is reflected by how often the for-loop is used\
    \ in the programs in this book or by the fact that the draw-loop is the central\
    \ function of p5.js.\n\n**Randomness** is used to create variations to break up\
    \ the strict regularity of the computer. True randomness rarely produces compositionally\
    \ interesting results. These are created instead when randomness is limited and\
    \ applied in measured doses. In p5.js randomness is represented by the keywords\
    \ \"random\" and \"noise.\" → P.3.2.5\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_399_0.png)\n\
    \n→ P_3_2_5_01 bis → P_3_2_5_0  \nText in motion"
  merge: -1
  pgno: 399
- img_proc: true
  md: 'We use **logic** as a kind of control structure to steer the generative process.
    Here we can set up conditions for directing the program flow into different branches.
    For example, the chapter "Text as a Blueprint" → [P.3.1.2](P.3.1.2) contains another
    switch structure we can use to execute different parts of the program depending
    on the entered text: each letter is written out normally, but every time a punctuation
    mark appears, the writing direction changes and the punctuation mark is replaced
    by a curved element. The most common keywords for control structures are "if,"
    "else," "switch," and "case."


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_400_0.png)


    → [P.3.1.2](P.3.1.2)

    Text as a blueprint


    Once a design idea has been translated into code that can be interpreted by the
    computer, it is possible to generate many image possibilities, without the hand
    ever drawing a line. However, the first results are almost never 100 percent satisfactory.
    These results must be evaluated; this evaluation serves as the basis for improving
    the next iteration. In contrast to the conventional approach,齐全的 we do not directly
    put our hands on the image but instead change the underlying abstraction or individual
    parameters in the program and continue to refine each iteration until the desired
    end result is achieved. Interaction helps accelerate this reciprocal effect. A
    generative system in and of itself is not necessarily interactive, and this book
    does not deal explicitly with interaction. The extra effort involved in installing
    control elements (buttons, sliders, et cetera) is worth it, however. These allow
    us to track and control every parameter change'
  merge: -1
  pgno: 400
- img_proc: true
  md: 'in real time. Since all the programs in this book run in the web browser, it
    is very easy to enhance them with standard HTML elements such as buttons, sliders,
    et cetera. → P.2.1.4


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_401_0.png)


    → P.2.1.4

    Checkboxes in a grid


    # Design process: analog and digital


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_401_1.png)


    The idea for an output is manually implemented, step by step, in a "visual flight
    rule" fashion. Designers can evaluate and intervene directly in each step as they
    draw on paper, create keyframes for animation, et cetera. If the idea is implemented
    digitally, tools like brushes, scissors, or photo labs become virtual and therefore
    more efficient. Although this makes everything faster and easier, the design process
    remains the same.'
  merge: -1
