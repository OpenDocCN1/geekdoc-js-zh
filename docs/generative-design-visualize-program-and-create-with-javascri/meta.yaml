    # Variables and Data Types


    In a program, information is stored in variables so that it is available to other
    parts of the program. These variables can have any name other than the keywords
    for JavaScript keywords. Keywords can be recognized by their special color in
    the editor.


    ```

    var myVariable;


    myVariable = 5;

    ```


    +   1. The variable `myVariable` is created. The value 5 is then saved there.


    Variables can contain different data types. Unlike most other programming languages,
    JavaScript does not have to take this into account when creating a variable. Nevertheless,
    it is important to keep track of which variables store which type of value. For
    example, data types can be:


    ```

    var myBooleanvalue = true:

    ```'
