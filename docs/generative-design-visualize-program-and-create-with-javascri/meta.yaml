- md: "We use **logic** as a kind of control structure to steer the generative process.\
    \ Here we can set up conditions for directing the program flow into different\
    \ branches. For example, the chapter \"Text as a Blueprint\" → [P.3.1.2](P.3.1.2)\
    \ contains another switch structure we can use to execute different parts of the\
    \ program depending on the entered text: each letter is written out normally,\
    \ but every time a punctuation mark appears, the writing direction changes and\
    \ the punctuation mark is replaced by a curved element. The most common keywords\
    \ for control structures are \"if,\" \"else,\" \"switch,\" and \"case.\"\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_400_0.png)\n\
    \n→ [P.3.1.2](P.3.1.2)\nText as a blueprint\n\nOnce a design idea has been translated\
    \ into code that can be interpreted by the computer, it is possible to generate\
    \ many image possibilities, without the hand ever drawing a line. However, the\
    \ first results are almost never 100 percent satisfactory. These results must\
    \ be evaluated; this evaluation serves as the basis for improving the next iteration.\
    \ In contrast to the conventional approach, we do not directly put our hands on\
    \ the image but instead change the underlying abstraction or individual parameters\
    \ in the program and continue to refine each iteration until the desired end result\
    \ is achieved. Interaction helps accelerate this reciprocal effect. A generative\
    \ system in and of itself is not necessarily interactive, and this book does not\
    \ deal explicitly with interaction. The extra effort involved in installing control\
    \ elements (buttons, sliders, et cetera) is worth it, however. These allow us\
    \ to track and control every parameter change in real time. Since all the programs\
    \ in this book run in the web browser, it is very easy to enhance them with standard\
    \ HTML elements such as buttons, sliders, et cetera. → P.2.1.4\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_401_0.png)\n\
    \n→ P.2.1.4\nCheckboxes in a grid\n\n## Design process: analog and digital\n\n\
    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_401_1.png)\n\nThe idea for an output\
    \ is manually implemented, step by step, in a \"visual flight rule\" fashion.\
    \ Designers can evaluate and intervene directly in each step as they draw on paper,\
    \ create keyframes for animation, et cetera. If the idea is implemented digitally,\
    \ tools like brushes, scissors, or photo labs become virtual and therefore more\
    \ efficient. Although this makes everything faster and easier, the design process\
    \ remains the same.\n\n## Design process: generative\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_402_0.png)\n\
    \nidea\n\nabstraction\n\nrule/algorithm\n\nchange rules\n\nformalization (repetition,\
    \ randomness, logic) create (start) parameters\n\nsource code\n\ndesigner\n\n\
    change source code or parameter\n\ninterpretation by the computer and generation\
    \ of the image/simulation\n\nOutput\n\nimage/simulation user evaluates image\n\
    \n## Example:\n\nStructural density from agents\n\n### Idea:\n\nGenerate a density\
    \ structure of circles that are similar in structure to foam bubbles.\n\n### Establish\
    \ abstracted rules:\n\n- 1. Generate a new circle.\n- 2. If this does not intersect\
    \ with any other circle in the display, make it as large as possible.\n- 3. If\
    \ an intersection exists, start over.\n\n```\nfor(var i=0; i < currentCount; i++)\
    \ {\n  var d = dist(newX,newY,x[i],y[i]);\n  if (newRadius > d-r[i]) {\n    newRadius\
    \ = d-r[i];\n    closestIndex[currentCount] = i;\n  }\n}\n```\n\n### Formalize\
    \ in code syntax:\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_403_0.png)\n\n**P.2.2.5**\n\
    Structural density from agents.\n\n## New Possibilities in Design\n\nThe integration\
    \ of programming into the design process greatly increases the possibilities for\
    \ designers. Conceptual competence still lies with the designer; the computer\
    \ assumes only the role of the tireless helper. It is a given in today's automated\
    \ and digital world that designs can be executed quickly and easily and that it\
    \ is possible to generate a composition with thousands of elements. But it is\
    \ more interesting to look at the new possibilities of generative design in terms\
    \ of *emergence*, *simulation*, and *tools*.\n\nIn the context of generative design,\
    \ processes are emergent when their results are not predetermined and when the\
    \ interaction of all the elements leads to more than is obvious from their individual\
    \ properties. A common example of *emergence* is the flocking behavior of birds:\
    \ simple rules result in highly complex, unpredictable behavior. In the section\
    \ \"Growth structure from agents,\" [→ P.2.2.4](#) a very simple algorithm that\
    \ consists of only two steps results in completely unexpected organic structures.\
    \ (Boids and automata are other examples.)\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_404_0.png)\n\
    \n[→ P.2.2.4](#)\nGrowth structure from agents\n\nThe **simulation** of natural\
    \ processes is another important method in generative design. For example, in\
    \ the chapter \"Agents on a pendulum,\" [→ P.2.2.6](#) a structure of several\
    \ connected pendulums is created. The movement of a single pendulum is simple:\
    \ it circles its point of articulation. However, if several of them are linked\
    \ to form a chain, then the outermost ones move in a complex manner. And, as is\
    \ so often the case, the transfer of knowledge between fields leads to amazing\
    \ results; certainly there are many more models in nature that could potentially\
    \ be transferred to a generative system.\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_405_0.png)\n\
    \n→ P.2.2.6\nAgents on the pendulum\n\nPerhaps the most important aspect of this\
    \ increase in possibilities is that the designer is now the creator of individualized\
    \ tools, since each generative program is also a customized software tool. This\
    \ allows the designer to explore new paths that would not have been available\
    \ using existing software, leading to a wider range of visual design mediums.\
    \ It is astonishing how much designers can accomplish with tools they develop\
    \ themselves, as is evident in \"Drawing.\" → P.2.3 Even these simple tools greatly\
    \ increase a designer's options, and, because such tools can be refined constantly,\
    \ they become perfectly tailored work instruments. In addition, it is usually\
    \ not a huge leap from a generative program to developing one's own app.\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_405_1.png)\n\
    \n→ P.2.3\nDrawing\n\n## Looking ahead\n\nThe world of generative design has significantly\
    \ evolved since the first edition of this book. Generative design—also referred\
    \ to as creative coding—has established itself in the design world. Working with\
    \ generative design has become common practice, as the basis of data visualizations,\
    \ artwork, media installations, architectural models, video clips, fonts, dynamic\
    \ appearances—all the way to customized mass production. A look into the future\
    \ clearly shows that the use of generative design will continue to increase. This\
    \ is indicated by the following favorable factors:\n\nThe amount of information\
    \ with which we are confronted daily is rapidly increasing thanks to ubiquitously\
    \ accessible computer networks. Helping society deal with this flood of information\
    \ through data visualization is an important task for designers.³ Generative design\
    \ will be indispensable in coping with this challenge.\n\nThe expansion of technological\
    \ possibilities is a constant source of stimulation for generative design. Just\
    \ a few years ago, for example, it was nearly impossible to generate complex,\
    \ 3D worlds or to make them tangible with virtual reality and augmented reality—something\
    \ that is now possible even on a smartphone. This technical potential will continue\
    \ to be a driving force in generative design.\n\nEqually important is the community\
    \ of collaborators, which in almost no other design field is so vital. It is astounding\
    \ how much the internet-based communities that have arisen around Processing,\
    \ p5.js, vvvv, openFrameworks, NodeBox, or Basil.js have contributed to libraries,\
    \ tutorials, sample programs, articles, forum contributions, wikis, et cetera.\
    \ This is certainly in part because creating code—generative design's underlying\
    \ design medium—is well suited to teamwork, as software development has demonstrated.\
    \ One advantage of code is that it can easily be exchanged and spread, in contrast\
    \ to other media such as video."
  mdcn: "\n我们将**逻辑**作为一种控制结构来引导生成过程。在这里，我们可以设置条件，将程序流程导向不同的分支。例如，\"文本即蓝图\"一章中的 [P.3.1.2](P.3.1.2)\
    \ 包含了另一个 switch 结构，我们可以用它根据输入的文本来执行程序的不同部分：每个字母都正常写出，但每当出现标点符号时，书写方向就会改变，并且标点符号会被替换为一个弯曲的元素。控制结构最常见的关键词是\"\
    if\"、\"else\"、\"switch\"和\"case\"。\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_400_0.png)\n\
    \n→ [P.3.1.2](P.3.1.2)\n文本即蓝图\n\n一旦设计想法被转化为计算机可以解释的代码，就有可能生成许多图像可能性，而无需手工绘制任何线条。然而，第一次结果几乎从来都不是\
    \ 100% 令人满意的。这些结果必须被评估；这种评估作为改进下一次迭代的基础。与传统方法不同，我们不直接对图像动手，而是改变底层抽象或程序中的个别参数，并继续完善每一次迭代，直到达到预期的最终结果。交互有助于加速这种相互作用。生成系统本身不一定是交互式的，本书也不明确讨论交互。然而，安装控制元素（按钮、滑块等）所付出的额外努力是值得的。这些让我们能够实时跟踪和控制每一个参数的变化。由于本书中的所有程序都在网络浏览器中运行，因此很容易用标准的\
    \ HTML 元素（如按钮、滑块等）来增强它们。→ P.2.1.4\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_401_0.png)\n\
    \n→ P.2.1.4\n网格中的复选框\n\n## 设计过程：模拟与数字\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_401_1.png)\n\
    \n输出的想法是以\"目视飞行规则\"的方式，一步步手动实现的。设计师可以在纸上绘图、创建动画关键帧等过程中，直接评估和干预每一步。如果想法是以数字方式实现的，那么画笔、剪刀或暗房等工具就会变为虚拟的，因此更加高效。尽管这让一切变得更快更简单，但设计过程保持不变。\n\
    \n## 设计过程：生成式\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_402_0.png)\n\n想法\n\n\
    抽象\n\n规则/算法\n\n改变规则\n\n形式化（重复、随机性、逻辑）创建（起始）参数\n\n源代码\n\n设计师\n\n改变源代码或参数\n\n计算机的解释以及图像/模拟的生成\n\
    \n输出\n\n图像/模拟 用户评估图像\n\n## 示例：\n\n智能体的结构密度\n\n### 想法：\n\n生成一种圆形密度结构，其结构类似于泡沫气泡。\n\
    \n### 建立抽象化规则：\n\n- 1. 生成一个新的圆形。\n- 2. 如果它与显示中的任何其他圆形不相交，则将其尽可能放大。\n- 3. 如果存在相交，则重新开始。\n\
    \n```\nfor(var i=0; i < currentCount; i++) {\n  var d = dist(newX,newY,x[i],y[i]);\n\
    \  if (newRadius > d-r[i]) {\n    newRadius = d-r[i];\n    closestIndex[currentCount]\
    \ = i;\n  }\n}\n```\n\n### 用代码语法形式化：\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_403_0.png)\n\
    \n**P.2.2.5**\n智能体的结构密度。\n\n## 设计中的新可能\n\n将编程整合到设计过程中，大大增加了设计师的可能性。概念能力仍然掌握在设计师手中；计算机只扮演不知疲倦的助手的角色。在当今的自动化和数字世界中，设计可以快速轻松地执行，可以生成包含数千个元素的构图，这是理所当然的。但更有趣的是从*涌现性*、*模拟*和*工具*的角度看待生成式设计的新可能性。\n\
    \n在生成式设计的语境中，当过程的结果不是预先确定的，并且所有元素的相互作用产生的结果超出了其单个属性的明显范围时，这些过程就是涌现性的。*涌现性*的一个常见例子是鸟类的集群行为：简单的规则导致了高度复杂、不可预测的行为。在\"\
    智能体的生长结构\"一节中，[→ P.2.2.4](#) 一个非常简单的算法，只包含两个步骤，就产生了完全出乎意料的有机结构。（Boids 和自动机是其他例子）。\n\
    \n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_404_0.png)\n\n[→ P.2.2.4](#)\n智能体的生长结构\n\
    \n自然过程的**模拟**是生成式设计中的另一个重要方法。例如，在\"摆上的智能体\"一章中，[→ P.2.2.6](#) 创建了一个由多个连接摆组成的结构。单个摆的运动很简单：它围绕其铰接点旋转。然而，如果多个摆连接成链，那么最外端的摆就会以复杂的方式运动。而且，正如经常出现的情况一样，领域之间的知识转移带来了惊人的结果；自然界中肯定还有许多可能被转移到生成系统中的模型。\n\
    \n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_405_0.png)\n\n→ P.2.2.6\n摆上的智能体\n\n\
    这种可能性增加的最重要方面或许是，设计师现在成为个性化工具的创造者，因为每个生成式程序也是一个定制化的软件工具。这使设计师能够探索使用现有软件无法实现的新路径，从而产生更广泛的视觉设计媒介。设计师使用自己开发的工具能够取得多大的成就，这一点令人惊讶，正如\"\
    绘图\"中所显示的。→ P.2.3 即使这些简单的工具也大大增加了设计师的选择，而且因为这样的工具可以不断改进，它们成为量身定制的工作工具。此外，从生成式程序到开发自己的应用程序，通常并没有巨大的跨越。\n\
    \n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_405_1.png)\n\n→ P.2.3\n绘图\n\n## 展望未来\n\
    \n自本书第一版以来，生成式设计的世界已经显著发展。生成式设计——也被称为创意编程——已经在设计界站稳了脚跟。使用生成式设计已成为常见做法，作为数据可视化、艺术作品、媒体装置、建筑模型、视频片段、字体、动态外观等的基础——一直到定制化的大规模生产。展望未来，可以清楚地看到生成式设计的使用将继续增加。以下有利因素表明了这一点：\n\
    \n由于随处可及的计算机网络，我们每天面对的信息量正在迅速增加。帮助社会通过数据可视化来应对这股信息洪流，是设计师的一项重要任务。³ 生成式设计对于应对这一挑战来说是不可或缺的。\n\
    \n技术可能性的扩展是生成式设计的持续动力。例如，就在几年前，生成复杂的 3D 世界或使用户能够通过虚拟现实和增强现实来感知它们几乎是不可能的——而现在即使在智能手机上也能实现。这种技术潜力将继续推动生成式设计的发展。\n\
    \n同样重要的是合作者社区，这在几乎没有其他设计领域中如此重要。令人惊讶的是，围绕 Processing、p5.js、vvvv、openFrameworks、NodeBox\
    \ 或 Basil.js 发展起来的基于互联网的社区，为库、教程、示例程序、文章、论坛贡献、维基等做出了多么大的贡献。这当然部分是因为创建代码——生成式设计\
    \ underlying 的设计媒介——非常适合团队合作，正如软件开发已经证明的那样。代码的一个优势是它可以很容易地被交换和传播，与其他媒体如视频形成对比。\n"
