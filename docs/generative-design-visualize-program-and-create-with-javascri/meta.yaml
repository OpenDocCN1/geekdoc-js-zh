    the agents, we begin at the center. The angle of rotation and the length of the
    pendulum determine the position of the first agent. This is also the rotation
    center resemble for the next pendulum. The farther out in the chain, the shorter
    the pendulum becomes and the faster it turns. Every other pendulum turns in the
    opposite direction.


