    # P.2.1.4 Checkboxes in a grid


    This is where the controls'' wildest dreams come true: they finally become visual
    design elements. Buttons, checkboxes, and sliders are used as raster elements
    in the browser, serving as pure visualization elements that become intriguing
    when grouped and arranged together.


    → P_2_1_4_01


    Each pixel of an input image is analyzed and displayed as a checkbox. The brightness
    of the pixel determines whether it is checked off or not. If the brightness is
    above a specified threshold, the checkmark will not be set. Those checkboxes therefore
    will appear brighter.


