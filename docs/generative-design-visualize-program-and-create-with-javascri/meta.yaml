  - '[PAGE 366]


    If the video signal is available, the pixels of the current video image are loaded.


    As in a static pixel image, the pixels in a video image are also numbered row
    by row. Therefore, the pixel index has to be calculated from the current writing
    position `(x, y)`. When using webcams directed at the user, it is useful to mirror
    the video image horizontally using the calculation `video.width-1-x`.


    The stroke value is set so it is defined by the hue of the pixel. The chroma.js
    library helps to convert RGB to HSV values.


    The line element can now be drawn. The first curve point is placed on the current
    drawing position. This is done twice because the first and last points are not
    drawn when drawing lines with `curveVertex()`.


    The variable `pointCount` now specifies how many curve points are to be drawn.
    The default value is 1, so only one line is drawn. The curve points are placed
    in random positions around the drawing position. The value `diffusion` specifies
    how large this area is.


    The last curve point is specified as the new drawing position.


    **Mouse:** Position x: Drawing speed Position y: Direction


    **Keys:** Arrow ↓/↑: Number of curve points –/+

    Q: Stop drawing W: Continue drawing Arrow ←/→: Minimum font size –/+

    S: Save image'
