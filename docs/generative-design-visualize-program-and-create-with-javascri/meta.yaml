    \ in a text editor, make some edits, and open the corresponding index.html in\
    \ the browser. Any changes made in sketch.js must be saved before the browser\
    \ content is updated. Reload the browser to view the changes.\n\nA more detailed\
    \ guide to working with p5.js can be found on the p5.js website.\n\n[p5js.org/get-started](http://p5js.org/get-started)\n\
    \n! Some of our code samples need to be run on a server to work. These sketches\
