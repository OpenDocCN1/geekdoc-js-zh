    # P.2.1.3 Complex modules in a grid


    Even more interesting is the nesting of several forms into a complex module. In
    this illustration, four different clusters of ellipses increase in size in opposite
    directions and are positioned alternately on the grid. The varied diameters and
    transparencies of the individual ellipses create an illusion of depth.


    → P_2_1_3_01


    The module filling the grid consists of a stack of circles that become smaller
    and smaller and move in one direction (top, bottom, right, or left) that is decided
    randomly. The number of circles corresponds to mouse position x, the movement
    to mouse position y.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_154_0.png)'
  - "[PAGE 155]\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_155_0.png)\n\n→ **P_2_1_3_01**\
    \ Each module in the grid consists of several circles. The mouse position defines\
    \ their number, size, and position.\n\n```\nfunction draw() {\n\n  ...\n\n  circleCount\
    \ = mouseX / 30 + 1; endSize = map(mouseX, 0,\nmax(width, mouseX), tileWidth /\
    \ 2, 0);\n\n  endOffset = map(mouseY, 0, max(height, mouseY), 0, (tileWidth\n\
    \  - endSize) / 2);\n\n  for (var gridY = 0; gridY <= tileCountY; gridY++) {\n\
    \n    for (var gridX = 0; gridX <= tileCountX; gridX++) {\n\n      push();\n\n\
    \      translate(tileWidth * gridX, tileHeight * gridY);\n      scale(1, tileHeight\
    \ / tileWidth);\n```"
  - "[PAGE 156]\n\n```\nvar toggle = int(random(0, 4)); if (toggle == 0) rotate(-HALF_PI);\
    \ if (toggle == 1) rotate(0); if (toggle == 2) rotate(HALF_PI); if (toggle ==\
    \ 3) rotate(PI); // draw module\n\nfor (var i = 0; i < circleCount; i++) {\n\n\
    \    var diameter = map(i, 0, circleCount, tileWidth, endSize); var offset = map(i,\
    \ 0, circleCount, 0, endOffset); ellipse(offset, 0, diameter, diameter);\n\n}\n\
    \npop();\n```\n\n¹ The mouse position defines `circleCount` in a module, the size\
    \ of the circles, and the offset of the last circle.\n\n² The varying rotation\
    \ of the modules is easier to manage when, before drawing a module, the origin\
    \ of the coordinate system is temporarily moved to the position where it will\
    \ be drawn. The command `push()` ensures that the current state of the coordinate\
    \ system is saved before the origin is moved using `translate()`."
  - '[PAGE 157]


    +   The random number `toggle` decides between the four rotation directions. `random(0,
    4)` generates a number between 0 and 3.999; so, rounded off, the values `0`, `1`,
    `2`, and `3`. The radian angle `HALF_PI` is a rotation of 90°.


    +   The module is constructed by drawing the circles in succession. The value
    of `diameter` ranges between `tileWidth` and the previously calculated `endSize`.
    The value `offset` comprises the shift from the center. The circles become smaller
    and smaller, thereby shifting farther and farther to the right.


    +   Finally, the previously saved state of the coordinate system is restored using
    `pop()`.


    **Mouse:** Position x: Number and size of circles

    Position y: Position of circles

