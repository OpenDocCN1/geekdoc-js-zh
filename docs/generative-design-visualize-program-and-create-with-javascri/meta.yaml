    The variables `posX` and `posY` are initialized with the values at the start.


    When drawing, the text is processed from the beginning each time, and, just as
    in the `countCharacters()` function, the index of the current character is determined
    for the counter array. If the character is not found—`index < 0`—the drawing process
    for this character is canceled using the `continue` command.


    When the drawing mode `drawAlpha` is engaged, the transparency of the fill color
    is dependent on the frequency of the character and set with `counters[index]`.


    The variable `sortY` is introduced to sort the characters. This represents the
    y-coordinate of the line to which the character should go or migrate. For A, it
    is 40. For B, the value is 60, etc.


    The mouse position is converted into a number `m` between `0` and `1` that will
    serve as an interpolation variable. Using the `lerp()` function, an interpolation
    between `posY` and `sortY` is carried out, and the calculated value `interY` is
    used to position the character.


    Now only the writing position has to be updated. The value `posX` is increased
    by the character width; if this value approximates the right border of the display
    and the current character is a space, then the line break takes place. The value
    `posY` is increased by the line spacing and `posX` set back to the left.


