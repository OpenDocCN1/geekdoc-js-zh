  mdcn: "\n## P.3.1.2 文本即蓝图\n\n在此示例中，时间不再决定字母的大小。相反，特定字母会修改文本方向等属性。在该程序中，每个字符都通过视觉规则进行转换。源文本由此成为构图的蓝图。\n\
