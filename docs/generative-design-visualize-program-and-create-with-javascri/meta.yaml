    # ## I.2 www.generative-gestaltung.de


    *Generative Design: Visualize, Program, and Create with Javascript in p5.js* is
    a tried and tested tutorial that allows people to design with p5.js. It is not
    necessary to type in any code: all the programs in the book, called "sketches,"
    can be downloaded for free from the book''s website for experimentation. This
    symbol ➜ indicates the name of a sketch in the download package.


    The code summary page shows the main features of the code and how it affects the
    program output. The book explains how the parameters of the code impact the outcome
    and how users can interact with the sketch to develop their own visual solutions.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_9_0.png)'
- md: 'Hello and welcome to Generative Design. Here, you will find all of the sketches
    from the book and their associated code. Run the sketches directly in the browser
    with the p5.js-web-editor or locally on your machine by downloading the code package
    below.


    📥 Download Code Package


    ## Library


    P.1. Color


    ➔ P_1_0_01


    → P_1_1_1_01


    ➡ P_1_1_2_01


    ## 1.3 Projects


    These thirteen works by various media artists, designers, and architects active
    in the field of generative design are intended to serve as a representative overview
    of the topic and a source of inspiration.


    ### # 01


    **2016/17 Daily Sketches**

    Zach Lieberman


    **Daily Sketches** is a series of short generative animations shared daily with
    the world by Zach Lieberman on social media for fast feedback. The sketches show
    the process of exploring new visual concepts using geometry, animation, gesture,
    form, and code. Lieberman describes his sketches of the day as follows: “A lot
    of times, as artists, we feel like we’re struggling to find our frequencies and
    what resonates with the frequencies of the world. This act of sketching is a kind
    of tuning of these frequencies.”


    ### # 02


    2017 **Planck**

    Takram


    **Design and Development**

    Shota Matsuda (Takram)

    **Photo Credits**

    Koki Nagahama


    **Planck** is a web browser-based framework developed by Takram for the visualization
    of large geographical data sets. The framework is designed to achieve both analytical
    and immersive visual experience by using various techniques, such as parallel
    projection and depth of field. Three visualizations were created for Media Ambition
    Tokyo 2017, presenting data on Japan’s estimated population in 2050, the languages
    people have tweeted in, and world air traffic.


    # POPULATION 2050


    THIS SCENE VISUALIZES THE POPULATION IN JAPAN IN 2050. THE MAP IS BASED ON THE
    RESULTS AND DATA IN 2030 BASED ON THE FORECAST BY INSTITUTE.

    EACH COLUMN REPRESENTS THE POPULATION IN AN AREA, COVERING 500X500 METERS IN A
    SQUARE SHAPE.

    THE HEIGHT AND COLOR OF EACH COLUMN REPRESENT THE POPULATION IN THE AREA.

    YOU CAN SEE HOW THE POPULATION IN JAPAN CHANGES BY INTERACTING WITH THE MAP,

    SUCH AS SELECTING AND COMPARING AGE DISTRIBUTIONS FROM 2010 TO 2049 WHICH CAN
    BE ACCESSED BY CLICKING

    INDIVIDUAL PREFECTURES.


    **Interaction Design**

    Bjørn Karmann


    **Fashion Design**

    Julie Helles


    **Textile Design**

    Kristine Boesen


    **Bachelor`s Degree Graduation Project**

    Kolding Design School, DK


    Fashion has always been a means of self-expression, but **Abstract_** takes individuality
    a step further by enabling a customer to write themselves into a piece of clothing.
    Abstract_’s interactive platform prompts the customer to write a personal story
    and uses the computer’s camera to capture facial expressions. Data collected from
    the story, the rhythm of the keystrokes, and the customer’s expression are then
    transformed into a visual representation and mapped onto a textile for clothing.


    ### # 03


    2015 **Abstract_**

    Bjørn Karmann

    Julie Helles

    Kristine Boesen


    ### # 04


    **2016 Rotlace – Björk**

    MIT Media Matter Group

    Christoph Bader

    Dominik Kolb

    Prof. Neri Oxman

    Stratasys Ltd.


    **Photo Credits**

    Santiago Felipe


    **Rotlace** is part of a family of masks designed for the Icelandic singer-songwriter
    Björk. The design is informed by the geometric and material logic that underlies
    the human musculoskeletal system. The masks can be understood as “muscle textile”:
    bundled, continuous multimaterial structures providing formal and structural integrity
    as well as movement to the face and neck, resulting in an object that is designed
    as a synthetic whole without parts.


    ### 05


    2016 **VOID VIII 01**


    Andreas Nicolas Fischer


    **Primary Programming**

    Andreas Nicolas Fischer and Benjamin Maus

    **Additional Programming**

    Abraham Pazos Solatie

    **VOID** is a series of images created with custom generative software. A swarm
    of particles governed by an algorithm moves over a surface, leaving behind colorful
    traces. Over time, this results in an abstract composition that develops in unpredictable
    ways.


    Commissioned by and in collaboration with Monotype


    **Monotype: Type Reinvented** is a series of three typographic installations that
    reflect how type can become “smart, dynamic, and emotional” through new digital
    approaches using interactivity, generative design, and data input. Popular Monotype
    typefaces are recontextualized and reimagined in new spaces and materials.


    ### # 06


    2017 **Monotype: Type Reinvented**


    Field


    **Client**

    Nike Global Football


    **Nike Strike Series FA16** is a series of short films and still imagery composed
    of inspiring 3D renderings that exemplify the power and precision of world-class
    athletes. Full-body scans were taken of professional football players to create
    specialized 3D models that manifest the true essence of these athletes. The data
    of their distinctive characteristics, such as speed, velocity, and physical skills,
    defined the visual execution of the players.'
