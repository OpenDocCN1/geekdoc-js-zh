  md: '# P.1.2.3 Color palettes from rules


    All colors are made up of three components: hue, saturation, and brightness. The
    values for these color components are defined using a set of rules. By using controlled
    random functions, you can quickly create different palettes in specific color
    nuances.


    > → P_1_2_3_01


    Values for hue, saturation, and brightness are randomly selected from predefined
    ranges of values. This combination of rule sets—the definition of value ranges—and
    random functions means that new palettes are continually created and that they
    always produce specific color nuances.


    Because the perception of color depends on context, the produced colors are drawn
    in an interactive grid. Even the color nuances emerge more distinctly.'
  merge: -1
