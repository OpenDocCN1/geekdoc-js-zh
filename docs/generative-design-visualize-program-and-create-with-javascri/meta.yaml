    \ ←/→: Minimum character size –/+\nS: Save image\n\n→ **P_4_3_2_01** The size\
    \ and color of the characters are defined by an underlying image.\n\n**P_4_3_2_01**\
    \ Here the gray value of the pixels determines font size.\n\n## P.4.3.3 Real-time\
    \ pixel values\n\nThe color values of pixels can again be translated into graphic\
    \ elements but with two important differences: first, the pixels are constantly\
    \ changing because the images come from a video camera, and second, pixels are\
    \ translated sequentially by dumb agents that are constantly in motion rather\
    \ than all at once. The motion captured by the camera and horizontal migration\
    \ of the agents thus can paint a picture right before our eyes.\n\n## → P_4_3_3_01\n\
    \nA dumb agent moves over the drawing canvas. The color value of the current real-time\
    \ video image is analyzed at each position and serves as a parameter for each\
    \ color and stroke value. The mouse position defines the stroke length and the\
    \ speed of the agent.\n\n- P.2.2.1 Dumb agents\n\n→ **P_4_3_3_01** The agent's\
    \ path gradually creates an image.\n\n```\nfunction setup() {\n  ...\n\n  video\
    \ = createCapture(VIDEO, function(){\n    streamReady = true });  \n\n  video.size(width,\
    \ height);  \n\n  video.hide(); ...\n\n\n\n}\n```\n\n1. The function `createCapture()`\
    \ creates a video element to access images on the webcam.\n2. The live video images\
    \ from the connected video camera are reduced to the size of the drawing canvas.\n\
    3. The `hide()` command prevents the video image from being automatically displayed\
    \ on the drawing canvas.\n\n```\nfunction draw() {\n\n  if(streamReady) {\n\n\
    \    for (var j = 0; j <= mouseX / 50; j++) {\n\n      video.loadPixels();  //\
    \ 5\n\n      var pixelIndex = (((video.width - 1 - x) + y * video.width) * 4);\
    \ var c = color(video.pixels[pixelIndex], video.pixels[pixelIndex + 1], video.pixels[pixelIndex\
    \ + 2]);  // 6\n\n      var cHSV = chroma(red(c), green(c), blue(c));\n      strokeWeight(cHSV.get('hsv.h')\
    \ / 50); stroke(c); diffusion = map(mouseY, 0, height, 5, 100); beginShape();\
    \  // 7\n\n      curveVertex(x, y); curveVertex(x, y);  // 8\n\n      for (var\
    \ i = 0; i < pointCount; i++) {\n\n        var rx = int( random(-diffusion, diffusion));\
    \ curvePointX = constrain(x + rx, 0, width - 1); var ry = int( random(-diffusion,\
    \ diffusion)); curvePointY = constrain(y + ry, 0, height - 1); curveVertex(curvePointX,\
    \ curvePointY); }\n\n      curveVertex(curvePointX, curvePointY); endShape();\
    \  // 9\n\n      x = curvePointX; y = curvePointY; }\n\n    }\n\n  }\n}\n```\n\
    \nIf the video signal is available, the pixels of the current video image are\
    \ loaded.\n\nAs in a static pixel image, the pixels in a video image are also\
    \ numbered row by row. Therefore, the pixel index has to be calculated from the\
    \ current writing position `(x, y)`. When using webcams directed at the user,\
    \ it is useful to mirror the video image horizontally using the calculation `video.width-1-x`.\n\
    \nThe stroke value is set so it is defined by the hue of the pixel. The chroma.js\
    \ library helps to convert RGB to HSV values.\n\nThe line element can now be drawn.\
    \ The first curve point is placed on the current drawing position. This is done\
    \ twice because the first and last points are not drawn when drawing lines with\
    \ `curveVertex()`.\n\nThe variable `pointCount` now specifies how many curve points\
    \ are to be drawn. The default value is 1, so only one line is drawn. The curve\
    \ points are placed in random positions around the drawing position. The value\
    \ `diffusion` specifies how large this area is.\n\nThe last curve point is specified\
    \ as the new drawing position.\n\n**Mouse:** Position x: Drawing speed Position\
    \ y: Direction\n\n**Keys:** Arrow ↓/↑: Number of curve points –/+\nQ: Stop drawing\
    \ W: Continue drawing Arrow ←/→: Minimum font size –/+\nS: Save image\n\n→ **P_4_3_3_01**\
    \ The people leave tracks in the image with their movements. The length of the\
    \ lines varies throughout the drawing process, whereby the image is sometimes\
    \ more detailed and sometimes more abstract.\n\n→ **P_4_3_3_02** Three agents\
    \ move around the display in this version of the program. The first agent's stroke\
    \ value is defined by the pixel's hue; the second's by the pixel's saturation;\
    \ and the third's by the pixel's brightness.\n\n**→ P_4_3_3_02** When a subject\
    \ moves in front of the camera, a collection of seemingly random scribbles come\
    \ together to represent the subject's form.\n\n## P.4.3.4 Emojis from pixel values\n\
    \nAn emotional transformation from a raster element to a symbol: here the things\
    \ that visualize feelings in an SMS become a small part of a greater whole. Any\
    \ collection of thumbnails in this program can be the source material, and the\
    \ pixel values determine which can join.\n\n→ P_4_3_4_01\n\nColor values can be\
    \ interpreted as points in 3D space. For this program, it is necessary to find\
    \ the shortest distance from a color value to a set of other color values, here\
    \ the average colors of the individual emojis. There are various mathematical\
    \ methods for this search. Particularly fast and comparatively easy to use is\
    \ the search in a so-called k-dimensional tree. The functionality for this is\
    \ provided by the library kdTree.js.\n\n```\n<script src=\"../../libraries/kd-tree/kdTree.js\"\
