  mdcn: "\n ## 07\n\n2016 **Nike Strike Series FA16**\nOnformative\n\n---\n\n## 08\n\
    \n2016 **VoxelChair v.1.0**\n\nManuel Jimenez García\n\nGilles Retsin\n\nNagami\
    \ Design\n\nVicente Soler\n\nUCL Design Computational Lab\n\n**设计**\nManuel Jimenez\
