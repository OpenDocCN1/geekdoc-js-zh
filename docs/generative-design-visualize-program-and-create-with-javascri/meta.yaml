    \ p5.js 中可用的变量。\n\n```\nfunction draw() {\n\n    console.log(\"mouseposition:\"\
    \ + mouseX + \",\" + mouseY);\n    console.log(\"mousekey pressed?:\" + mouseIsPressed);\n\
    \    console.log(\"key pressed?:\" + keyIsPressed);\n    console.log(\"last pressed\
    \ key:\" + key); }\n```\n\n另一种可能性是实现其中一个事件处理程序。当相应事件发生时调用事件处理程序——即，当按下鼠标按钮或键盘上的按键时。\n\
    \nProcessing 变量 `mouseX` 和 `mouseY` 始终包含鼠标的实际位置；如果此时按下了某个鼠标按钮，则 `mouseIsPressed`\
    \ 为 `true`。对于键盘，`keyIsPressed` 表示是否按下了按键；最后按下的键出现在 `key` 中。\n\n```\nfunction mouseReleased()\
    \ {\n  console.log(\"The mouse key was released\");\n}\n```\n\n其他事件处理程序包括 `mousePressed()`、`mouseMoved()`、`keyPressed()`\
    \ 和 `keyReleased()`。\n\n当释放鼠标左键时调用 `mouseReleased()` 函数。\n\n## 条件\n\n通常有必要仅在满足某些条件时才执行代码行。`if`\
    \ 语句用于实现这一点。\n\n```\nif (aNumber == 3) {\n  fill(255, 0, 0);\n  ellipse(50, 50,\
    \ 80, 80);\n}\n```\n\n```\nif (aNumber == 3) {\n    fill(255, 0, 0);\n} else {\n\
    \    fill(0, 255, 0);\n}\n\nif (aNumber == 3) fill(255, 0, 0);\nelse fill(0, 255,\
    \ 0);\n```\n\n通过 `switch` 命令通常可以实现对变量多个值的区分。\n\n1. 只有当 `if` 语句中的条件满足时——即，当变量 `aNumber`\
    \ 的值为 3 时，花括号内的两行代码才会被执行。\n2. 使用 else，`if` 条件扩展了一个代码片段，当指定的 `if` 条件不满足时执行该代码片段。\n\
    3. 如果代码片段只有一行，如前面的示例所示，花括号可以省略。\n\n```\nswitch (aNumber) {\ncase 1:\n    rect(20,\
    \ 20, 80, 80);\n    break;\ncase 2:\n    ellipse(50, 50, 80, 80);\n    break;\n\
    default:\n    line(20, 20, 80, 80);\n}\n```\n\n[3] `switch` 命令测试变量 `aNumber` 的值是否与\
    \ `case` 行中列出的某个值对应，如果对应则跳转到该处，并继续执行代码，直到遇到后面的 `break` 语句。\n\n如果没有对应的值，程序执行将继续在\
