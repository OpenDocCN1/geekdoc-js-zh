    - Arrow↓/↑: Decrease/increase line length -/+\n- Arrow ←/→: Jog rotational velocity\
    \ -/+\n- S: Save image\n\n→ **P_2_2_6_02** In other variations of the program,\
    \ pendulums move along a path drawn with the mouse.\n\n→ **P_2_2_6_03** Marks\
    \ like these occur when a pendulum no longer completely orbits its center but—as\
    \ its name suggests—swings back and forth.\n\n→ **P_2_2_6_04** If the pendulums\
    \ form a branched tree structure, then there will be multiple endpoints.\n\n→\
    \ **P_2_2_6_03** In this drawing mode, the background is not deleted. The animation\
    \ of the pendulum is continuous and thus becomes visible.\n\n→ **P_2_2_6_04**\
    \ Here the end points of the tree structure are connected to form a transparent\
    \ polygon.\n\n## P.2.3.1 Drawing with animated brushes\n\nIn previous chapters,\
    \ agents moved autonomously according to predefined rules. In this example, users\
    \ will interact with an agent, creating an experimental drawing tool that follows\
    \ its own set of rules. What makes animated brushes so unusual is their ability\
    \ to be inspired by their own behavior while drawing. This process offers a much\
    \ greater range of expression, as the act of drawing becomes like a ballroom dance\
    \ with a partner.\n\n→ P_2_3_1_01\n\nThe first drawing tool is an excellent demonstration\
