  - '[PAGE 330]


    # P.4.1.1 Image cutouts in a grid


    The principle illustrated below is almost the same as the one in the previous
    example, and yet a whole new world of images emerges. An image''s details and
    fine structures become pattern generators when only a portion of it is selected
    and configured into tiles. The results are even more interesting if these sections
    are randomly selected.


    → P_4_1_1_01


    Using the mouse, a section of the image is selected in the display window. After
    releasing the mouse button, several copies of this section are stored in an array
    and organized in a grid. The program offers two variations. In variation one,
    all copies are made from the exact same section. In variation two, the section
    is shifted slightly at random each time.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_330_0.png)'
