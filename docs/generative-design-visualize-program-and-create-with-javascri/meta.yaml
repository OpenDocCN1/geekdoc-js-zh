    # **Drawing Canvas and Renderer** A drawing canvas is created within the browser
    window. This is the display window for the program’s visual output and can be
    scaled to any size.


    ```

    createCanvas(640, 480);

    ```


    In addition to the parameters’ width and height, using the command `createCanvas()`
    makes it possible to enter which renderer should be used for displaying the image.
    The renderer is responsible for how the different graphic commands are actually
    translated into pixels. The following rendering options are available:


    9 The drawing canvas is now 640 pixels wide and 480 pixels high.


    ```

    createCanvas(640, 480, P2D);


    createCanvas(640, 480, WEBGL);

    ```'
