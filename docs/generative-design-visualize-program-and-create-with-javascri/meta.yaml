    \ / 2;\n\n  return juice;\n\n}\n```\n\nTo this end, it is necessary to structure\
    \ the program into smaller, logical sections with the help of functions and classes.\
    \ This encapsulation of functionality also means that the program can be quickly\
    \ modified and extended.\n\n[2] In this example it is difficult to recognize just\
    \ what the function calculates. The fact that the average of two numbers is calculated\
