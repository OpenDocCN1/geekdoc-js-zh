    \ 30°），最后缩放 1.5 倍。\n\n在 Processing 中，角度通常以弧度表示，其中 180° 等于数字 pi（≈ 3.14），旋转方向为顺时针方向。\n\
    \n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_76_0.png)\n\n## 变量与数据类型\n\n在程序中，信息存储在变量中，以便程序的其他部分可以访问。这些变量可以有任意名称，但不能是\
