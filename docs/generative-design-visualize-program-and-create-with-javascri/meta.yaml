    # **P.2.3.6 Drawing with complex modules**


    Together they are strong: simple modules become supercharacters. Using combinatorics
    and complex modules as paintbrushes, each module is defined in relation to its
    four neighbors, generating supercharacters. Depending on the module repertoire
    and constellation, many different character groups can be generated.


    → P_2_3_6_01


    With the mouse, the user draws a grid and positions various SVG modules in its
    fields. The only information that exists for each field is whether it is empty
    or filled. When the grid is displayed, the filled or empty state of each field''s
    neighbors becomes apparent; according to this, a specific graphic module is selected.


    The sixteen possible states of the four neighbors can be easily summarized in
    a four-digit binary code. The correct SVG module can be determined simply by converting
    the binary code into a decimal number, without complicated combinatorics.'
