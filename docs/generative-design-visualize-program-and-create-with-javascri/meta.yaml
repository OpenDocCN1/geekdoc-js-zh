  md: "# P.0.2 Language elements\n\nTo be able to give instructions to a computer,\
    \ you will need to speak its language. In the following section, the most important\
    \ functions and control structures of JavaScript and p5.js will be introduced.\n\
    \n**Hello, Ellipse** A first program. Open the sketch.js file (located in the\
    \ empty-example folder), enter the following line within the draw() function,\
    \ and open the associated index.html in a browser.\n\n```\nfunction draw() {\n\
    \n  ellipse(50, 50, 80, 80);\n\n}\n```\n\nThere are commands that draw, such as\
    \ `ellipse`, `rect`, `line`, et cetera, and commands that specify how the graphic\
    \ that follows should be drawn, such as `stroke`, `strokeWeight`, `noStroke`,\
    \ `fill`, `noFill`, et cetera. Once a drawing mode has been configured, it will\
    \ apply for all additional drawing commands until the drawing mode is reconfigured.\
    \ Most drawing commands require one or more parameters that indicate where something\
    \ should be drawn and at what size. The unit of measure for this is the pixel.\
    \ The origin of the coordinate system is located in the upper left corner of the\
    \ drawing canvas."
