    # P.3.1.1 Writing time-based text


    Composing text with automatic line breaks is nothing new. But when the vertical
    mouse position is responsible for the leading (the space between lines), and the
    elapsed time before entering each letter determines its size, then the rhythm
    of writing begins to interact with the text.


    → P_3_1_1_01


    When typing, the virtual "pen tip" moves from left to right over the drawing canvas.
    When it reaches the right border, it starts again from the beginning and skips
    a line. Leading is defined by the vertical mouse position. The time between the
    individual keystrokes is measured. The greater the time interval, the larger the
    entered letter.


    ![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_272_0.png)'
