  md: '# P.4.3.3 Real-time pixel values


    The color values of pixels can again be translated into graphic elements but with
    two important differences: first, the pixels are constantly changing because the
    images come from a video camera, and second, pixels are translated sequentially
    by dumb agents that are constantly in motion rather than all at once. The motion
    captured by the camera and horizontal migration of the agents thus can paint a
    picture right before our eyes.


