    \n```\nconsole.log(planet[0]);\n```\n\n可以通过在变量名后的方括号中输入索引号来访问值。索引 0 指向数组中的第一个条目。\n\
    \n如果值没有立即赋给数组，可以先创建数组，然后稍后再填充：\n\n```\nvar planetDiameter = [];\nplanetDiameter[0]\
