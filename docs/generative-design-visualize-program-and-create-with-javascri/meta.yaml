- md: " ## P.4.1.1 Image cutouts in a grid\n\nThe principle illustrated below is almost\
    \ the same as the one in the previous example, and yet a whole new world of images\
    \ emerges. An image's details and fine structures become pattern generators when\
    \ only a portion of it is selected and configured into tiles. The results are\
    \ even more interesting if these sections are randomly selected.\n\n→ P_4_1_1_01\n\
    \nUsing the mouse, a section of the image is selected in the display window. After\
    \ releasing the mouse button, several copies of this section are stored in an\
    \ array and organized in a grid. The program offers two variations. In variation\
    \ one, all copies are made from the exact same section. In variation two, the\
    \ section is shifted slightly at random each time.\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_330_0.png)\n\
    \noriginal image\n\n→ P_4_1_1_01 By repeatedly copying and moving image sections,\
    \ abstract images are created.\n\n```\nfunction cropTiles() {\n\n  tileWidth \
    \ = width / tileCountY; tileHeight = height /\n  tileCountX;\n\n  imgTiles = [];\
    \ for (var gridY = 0; gridY < tileCountY; gridY++)\n  {\n\n    for (var gridX\
    \ = 0; gridX < tileCountX; gridX++) {\n\nif (randomMode) {\n  cropX = int(random(mouseX\
    \ - tileWidth / 2, mouseX + tileWidth / 2)); cropY = int(random(mouseY - tileHeight\
    \ / 2, mouseY + tileHeight / 2)); }\n\ncropX = constrain(cropX, 0, width - tileWidth);\
    \ cropY = constrain(cropY, 0, height - tileHeight);\n\nimgTiles.push(img.get(cropX,\
    \ cropY, tileWidth, tileHeight)); } \n\n} \n\n}\n```\n\n1. The core of the program\
    \ is the `cropTiles()` function. Here the image is fragmented and the copies of\
    \ the sections are stored in an array.\n2. The image framing array `imgTiles`\
    \ is cleared.\n3. When version two comes into play (`randomMode` is true), all\
    \ the values for `cropX` and `cropY` are randomly selected from a value range\
    \ around the mouse position.\n4. The `constrain()` function ensures that the cutout\
    \ section does not extend beyond the image boundaries.\n5. Finally, the section\
    \ is copied from the image `img` using `get()` and stored in the array.\n\nPosition\
    \ x/v: Detail positioning Left click: Copy detail\n\nMouse:\n\nKeys: 1-3: Change\
    \ detail size R: Random on/off S: Save image\n\n→ **P_4_1_1_01** The multiplication\
    \ of small image sections creates rhythmic structures that are only recognizable\
    \ as image sections at a second glance.\n\n→ **P_4_1_1_01** Using keys 1 to 3,\
    \ selections can be made among different portions of the image sections. The motifs\
    \ are still recognizable in these large, detail-rich excerpts but now have an\
    \ unsettling perspective.\n\n## P.4.1.2 Feedback of image cutouts\n\nA familiar\
    \ example of feedback: a video camera is directed at a television screen that\
    \ displays the image taken by the camera. After a short time, the television screen\
    \ depicts an ever-recurring and distorted image. When this phenomenon is simulated,\
    \ an image's level of complexity is increased. This repeated overlaying leads\
    \ to a fragmentary composition.\n\n→ P_4_1_2_01\n\nFirst, the image is loaded\
    \ and shown in the display. A section of the image is copied to a new randomly\
    \ selected position with each iteration step. The resulting image now serves as\
    \ the basis for the next step—the principle of each and every feedback.\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_336_0.png)\n\
    \n**→ Fotografie: Stefan Eigner** original image: subway tunnel\n\n**→ P_4_1_2_01**\
    \ Right after the program starts, the motif is easily recognizable. It then dissolves\
    \ more and more through the overlapping of copied image strips.\n\n```\nfunction\
    \ setup() {\n\n  createCanvas(1024, 780); image(img, 0, 100); }\n```\n\nWhen the\
    \ program is started, the loaded image is offset one hundred pixels downward using\
    \ the `image()` command and positioned on the drawing canvas.\n\n```\nfunction\
    \ draw() {\n\nvar x1 = floor(random(width)); var y1 = 0; var x2 = round(x1 +\n\
    random(-7, 7)); var y2 = round(random(-5, 5)); var w =\nfloor(random(10, 40));\
    \ var h = height;\n\nset(x2, y2, get(x1, y1, w, h)); }\n```\n\n- The x-position\
    \ of the detail to be copied (`x1`), the target position (`x2`, `y2`), and its\
    \ width (`w`) are all determined randomly.\n\n- Using the function `get()`, some\
    \ of the canvas content is copied and then pasted into the new position (`x2,\
    \ y2`) using `set()`.\n\n**Keys:** DEL: Delete display S: Save image\n\n## **P.4.2.1**\
    \ Collage from image collection\n\nYour archive of photographs now becomes artistic\
    \ material. This program assembles a collage from a folder of images. The cropping,\
    \ cutting, and sorting of the source images are especially important, since only\
    \ picture fragments are recombined in the collage.\n\n> → P_4_2_1_01\n\nAll the\
    \ pictures in a folder are read dynamically and assigned to one of several layers.\
    \ This allows the semantic groups to be treated differently. The individual layers\
    \ also have room for experimentation with rotation, position, and size when constructing\
    \ the collage. Note the layer order; the first level is drawn first and is thus\
    \ in the background.\n\n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_340_0.png)\n\n\
    **→ P_4_2_1_01 Illustration: Andrea von Danwitz** The image consists of three\
    \ levels: scraps of paper are on layer 1, cutouts of the sky on layer 2, and plants\
    \ and street elements on layer 3.\n\nA new composition is immediately created\
    \ when the images on a level are switched or the parameters are changed.\n\n```\n\
    var layer1Images = []; var layer2Images = []; var layer3Images = [];\nvar layer1Items\
    \ = []; var layer2Items = []; var layer3Items = [];\n```\n\nSeveral arrays are\
    \ needed to load the images and arrange the layout of the collage pieces. In `layer1Images`,\
    \ e.g., the loaded images are saved for the first layer in order to be used later\
    \ to create the collage items.\n\n```\nfunction setup() {\n    ...\n    layer1Items\
    \ = generateCollageItems(\n        layer1Images, 100, width / 2, height / 2, width,\
    \ height,\n        0.1, 0.5, 0, 0); \n    layer2Items = generateCollageItems(\n\
    \        layer2Images, 150, width / 2, height / 2, width, height,\n        0.1,\
    \ 0.3, -HALF_PI, HALF_PI); \n    layer3Items = generateCollageItems(\n       \
    \ layer3Images, 110, width / 2, height / 2, width, height,\n        0.1, 0.4,\
    \ 0, 0);\n    drawCollageItems(layer1Items); \n    drawCollageItems(layer2Items);\
    \ \n    drawCollageItems(layer3Items); \n}\n```\n\nThe function `generateCollageItems()`\
    \ fills the array layers (layer1Items, ...) with collage items. The parameters\
    \ determine which loaded images are to be used and how many items are to be created,\
    \ and they specify value ranges for positions, scattering, scaling, and rotation.\
    \ In this example, images in the array `layer1Items` are used. All instances are\
    \ placed in the position (`width/2`, `height/2`) with a scattering of `width`\
    \ and `height`. The scaling varies from `0.1` to `0.5` and no rotation is used.\n\
    \n3. Each time the `drawCollageItems()` function is run, one of the layers is\
    \ drawn. The order of the layers' invocation determines the construction of the\
    \ final composition. The images from `layer1Items` are located in the background,\
    \ those from `layer3Items` in the foreground.\n\n```\nfunction CollageItem(image)\
    \ {\n\n  this.image = image; this.x = 0; this.y = 0; this.rotation = 0;\n  this.scaling\
    \ = 1; }\n```\n\n4. All features of a collage item are summarized in the class\
    \ `CollageItem`.\n\n**Keys:** 1–3: New random arrangement for one of the three\
    \ levels S: Save image"
  mdcn: "\n## P.4.1.1 网格中的图像裁剪\n\n下面阐明的原理与上一个示例几乎相同，但却展现出一个全新的图像世界。当只选取图像的一部分并将其配置成图块时，图像的细节和精细结构就会成为图案生成器。如果这些部分是随机选取的，结果会更加有趣。\n\
    \n→ P_4_1_1_01\n\n使用鼠标在显示窗口中选取图像的一个区域。释放鼠标按钮后，将该区域的多个副本存储到数组中并整理成网格。程序提供两种变体。在变体一中，所有副本都来自完全相同的区域。在变体二中，每次随机轻微偏移该区域。\n\
    \n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_330_0.png)\n\n原始图像\n\n→ P_4_1_1_01\
    \ 通过重复复制和移动图像区域，创造出抽象图像。\n\n```\nfunction cropTiles() {\n\n  tileWidth  = width\
    \ / tileCountY; tileHeight = height /\n  tileCountX;\n\n  imgTiles = []; for (var\
    \ gridY = 0; gridY < tileCountY; gridY++)\n  {\n\n    for (var gridX = 0; gridX\
    \ < tileCountX; gridX++) {\n\nif (randomMode) {\n  cropX = int(random(mouseX -\
    \ tileWidth / 2, mouseX + tileWidth / 2)); cropY = int(random(mouseY - tileHeight\
    \ / 2, mouseY + tileHeight / 2)); }\n\ncropX = constrain(cropX, 0, width - tileWidth);\
    \ cropY = constrain(cropY, 0, height - tileHeight);\n\nimgTiles.push(img.get(cropX,\
    \ cropY, tileWidth, tileHeight)); } \n\n} \n\n}\n```\n\n1. 程序的核心是`cropTiles()`函数。这里对图像进行分割，并将区域的副本存储到数组中。\n\
    2. 图像帧数组`imgTiles`被清空。\n3. 当使用版本二时（`randomMode`为真），`cropX`和`cropY`的所有值都是从鼠标位置周围的数值范围内随机选取的。\n\
    4. `constrain()`函数确保裁剪区域不会超出图像边界。\n5. 最后，使用`get()`从图像`img`中复制该区域，并将其存储到数组中。\n\n\
    位置 x/v：细节定位 左键点击：复制细节\n\n鼠标：\n\n按键：1-3：更改细节大小 R：随机开关 S：保存图像\n\n→ **P_4_1_1_01**\
    \ 小图像区域的倍增创造出韵律结构，这些结构只有在第二眼时才能被识别为图像区域。\n\n→ **P_4_1_1_01** 使用按键1到3，可以在图像区域的不同部分之间进行选择。在这些大而细节丰富的摘录中，主题仍然可以辨认，但现在呈现出一种不安的视角。\n\
    \n## P.4.1.2 图像裁剪的反馈\n\n反馈的一个熟悉例子：一台摄像机对准显示摄像机拍摄图像的电视屏幕。不久后，电视屏幕就会显示出不断重复且扭曲的图像。当模拟这一现象时，图像的复杂程度会增加。这种重复的叠加导致碎片化的构图。\n\
    \n→ P_4_1_2_01\n\n首先，加载图像并在显示器中显示。在每个迭代步骤中，图像的一个区域被复制到一个新随机选取的位置。生成的图像现在作为下一步的基础——这正是每一个反馈的原理。\n\
    \n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_336_0.png)\n\n**→ 摄影：Stefan Eigner**\
    \ 原始图像：地铁隧道\n\n**→ P_4_1_2_01** 程序刚启动时，主题很容易辨认。然后，通过复制图像条带的重叠，它越来越模糊地溶解。\n\n```\n\
    function setup() {\n\n  createCanvas(1024, 780); image(img, 0, 100); }\n```\n\n\
    程序启动时，加载的图像使用`image()`命令向下偏移一百像素，并放置在绘图画布上。\n\n```\nfunction draw() {\n\nvar x1\
    \ = floor(random(width)); var y1 = 0; var x2 = round(x1 +\nrandom(-7, 7)); var\
    \ y2 = round(random(-5, 5)); var w =\nfloor(random(10, 40)); var h = height;\n\
    \nset(x2, y2, get(x1, y1, w, h)); }\n```\n\n- 要复制的细节x位置（`x1`）、目标位置（`x2`、`y2`）及其宽度（`w`）都是随机确定的。\n\
    \n- 使用`get()`函数复制部分画布内容，然后使用`set()`粘贴到新位置（`x2, y2`）。\n\n**按键：** DEL：删除显示 S：保存图像\n\
    \n## **P.4.2.1** 从图像集合中拼贴\n\n你的照片档案现在成为了艺术素材。这个程序从一个文件夹中的图像汇编成拼贴画。源图像的裁剪、切割和排序尤为重要，因为拼贴中只重新组合了图像碎片。\n\
    \n> → P_4_2_1_01\n\n动态读取文件夹中的所有图片，并将其分配到多个图层之一。这样可以对语义群组进行不同的处理。各个图层在构建拼贴时，还为旋转、位置和大小提供了实验空间。注意图层顺序；第一个图层最先绘制，因此位于背景中。\n\
    \n![](img/ee4f5a1cfb3baeb09fd02a6165a6d2ef_340_0.png)\n\n**→ P_4_2_1_01 插图：Andrea\
    \ von Danwitz** 图像由三个层次组成：纸屑在第一层，天空裁剪在第二层，植物和街道元素在第三层。\n\n当切换某一图层上的图像或更改参数时，会立即创建新的构图。\n\
    \n```\nvar layer1Images = []; var layer2Images = []; var layer3Images = [];\n\
    var layer1Items = []; var layer2Items = []; var layer3Items = [];\n```\n\n需要多个数组来加载图像和安排拼贴碎片的布局。例如，在`layer1Images`中，加载的图像被保存到第一层，以便稍后用于创建拼贴项目。\n\
    \n```\nfunction setup() {\n    ...\n    layer1Items = generateCollageItems(\n\
    \        layer1Images, 100, width / 2, height / 2, width, height,\n        0.1,\
    \ 0.5, 0, 0); \n    layer2Items = generateCollageItems(\n        layer2Images,\
    \ 150, width / 2, height / 2, width, height,\n        0.1, 0.3, -HALF_PI, HALF_PI);\
    \ \n    layer3Items = generateCollageItems(\n        layer3Images, 110, width\
    \ / 2, height / 2, width, height,\n        0.1, 0.4, 0, 0);\n    drawCollageItems(layer1Items);\
    \ \n    drawCollageItems(layer2Items); \n    drawCollageItems(layer3Items); \n\
    }\n```\n\n`generateCollageItems()`函数用拼贴项目填充数组图层（layer1Items, ...）。参数确定要使用的已加载图像、要创建的项目数量，并指定位置、散射、缩放和旋转的数值范围。在本例中，使用数组`layer1Items`中的图像。所有实例都放置在位置（`width/2`，`height/2`）处，散射为`width`和`height`。缩放从`0.1`到`0.5`变化，不使用旋转。\n\
    \n3. 每次运行`drawCollageItems()`函数时，都会绘制一个图层。图层的调用顺序决定了最终构图的构建。`layer1Items`中的图像位于背景中，来自`layer3Items`的图像位于前景。\n\
    \n```\nfunction CollageItem(image) {\n\n  this.image = image; this.x = 0; this.y\
    \ = 0; this.rotation = 0;\n  this.scaling = 1; }\n```\n\n4. 拼贴项目的所有特征都汇总在`CollageItem`类中。\n\
    \n**按键：** 1–3：为三个图层之一随机排列新布局 S：保存图像\n"
