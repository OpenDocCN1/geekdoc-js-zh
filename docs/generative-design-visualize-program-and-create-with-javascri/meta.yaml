    \ && mouseButton == LEFT) {\n\n    push();\n\n    translate(mouseX, mouseY); rotate(radians(angle));\n\
    \    stroke(c);\n\n    line(0, 0, lineLength, 0);\n\n    pop();\n\n    angle +=\
    \ angleSpeed;\n\n                          }\n}\n```\n\n```\n}\n```\n\n+   1 Only\
