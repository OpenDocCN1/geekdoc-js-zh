    \n*生成式设计：使用 JavaScript 在 p5.js 中进行可视化、编程与创作*是一个久经考验的教程，让人们能够使用 p5.js 进行设计。无需输入任何代码：书中所有称为\"\
    草图\"的程序，都可以从本书网站免费下载以进行实验。此符号 ➜ 指示下载包中草图的名称。\n\n代码概要页面展示了代码的主要功能及其对程序输出的影响。本书解释了代码参数如何影响结果，以及用户如何与草图交互以开发自己的视觉解决方案。\n"
