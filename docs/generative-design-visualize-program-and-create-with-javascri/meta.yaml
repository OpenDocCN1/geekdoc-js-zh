    \ values 214\n  - P.4.3.4 Emojis from pixel values 220\n\n## A Appendix 226–256\n\
    \n- A.1 Looking ahead 228\n- A.2 Reflection 244\n- A.3 Bibliography 250\n- A.4\
    \ The authors 252\n- A.5 We thank 253\n- A.6 Copyright 254\n- A.7 Farewell 256\n\
    \n---\n\n## I.2 www.generative-gestaltung.de\n\n*Generative Design: Visualize,\
    \ Program, and Create with Javascript in p5.js* is a tried and tested tutorial\
    \ that allows people to design with p5.js. It is not necessary to type in any\
    \ code: all the programs in the book, called \"sketches,\" can be downloaded for\
    \ free from the book's website for experimentation. This symbol ➜ indicates the\
    \ name of a sketch in the download package.\n\nThe code summary page shows the\
    \ main features of the code and how it affects the program output. The book explains\
    \ how the parameters of the code impact the outcome and how users can interact\
    \ with the sketch to develop their own visual solutions."
  mdcn: "\n修订与更新版\n\n# 生成式设计\n\n使用 JavaScript 在 p5.js 中进行可视化、编程与创作\n\nBenedikt Groß\n\
    Hartmut Bohnacker\nJulia Laub\nClaudius Lazzeroni\n\n特约撰稿人\nJoey Lee\nNiels Poldervaart\n\
    \n---\n\n修订与更新版\n\n# 生成式设计\n\n使用 JavaScript 在 p5.js 中进行可视化、编程与创作\n\nBenedikt Groß\n\
    Hartmut Bohnacker\nJulia Laub\nClaudius Lazzeroni\n\n特约撰稿人\nJoey Lee 与\nNiels\
    \ Poldervaart\n\n译者：Marie Frohling\n\nPrinceton Architectural Press，纽约\n\n---\n\
    \n## I.0 前言\n\n生成式设计早已不再是设计学生之间的行业秘密；如今，它已在许多大学牢固地融入课程体系。从信息图表到声音可视化，从纯艺术到建筑，尤其在通信设计和媒体装置领域，生成式设计能够创造出动态、惊艳且引人入胜的应用。\n\
    \n多年来，Processing 和 vvvv 一直是艺术家和设计师首选的编程环境。然而，近来出现了向更多以网络为中心的应用的转变，催生了新的编程环境，如\
    \ p5.js——一个专为并由艺术家、设计师及其他网络用户开发的 JavaScript 库。\n\n*生成式设计*第一版成书于近十年前，其备受赞誉的底层教学方法至今仍无可匹敌。在本更新版中，作者们使用\
    \ JavaScript 创造了一个更易上手、更紧跟时代的创意编程入门途径。秉承*生成式设计*第一版的精神，目标是消除人们对编程的恐惧，并展示如何操控和调整现有程序片段，以几乎一键点击的方式实现令人惊叹的结果。\n\
    \n生成式设计从根本上改变了设计过程：设计师从任务的执行者转变为指挥者，有效地协调计算机的决策过程。这正是生成式设计的核心：迭代开发不同的过程，然后选择那些产生最具视觉冲击力结果的过程。设计师和艺术家不再必须使用由计算机和强大但规定性的设计软件所决定的工具，现在可以创建自己的工具，这些工具能够独立生成令人惊叹的结果，正如书中的许多示例所展示的那样。\n\
    \n通过色彩、形状、字体和图像四个简单的课程，用户学习如何影响自己的结果，并通过改变参数（每一步都有详细解释）或更改整个算法来改进它们。这些解释易于理解，执行它们所需编程知识很少甚至不需要编程；借助\
    \ p5.js 及其快速增长的社区，为从 3D 到增强现实等先进技术和趋势奠定基础变得越来越容易。p5.js 社区非常活跃，不断提供新的更新和插件以扩展 p5.js\
    \ 的功能。本书展示了利用这些知识可以做什么，以及如何更深入地了解生成式设计及其社区。在试验书中的草图并使用在线 p5.js 编辑器完成初始任务后，用户可以独立探索并拓展\
    \ p5.js 社区及其他地方的创意产出。\n\n随着*生成式设计*被翻译成多种语言并取得成功，作者们意识到，教授艺术家和设计师编程的关键在于通过简单而令人满意的渐进式成功来赋予他们力量。学生们随后可以基于这些基本原则，在作品中构建日益复杂的层次。\n\
    \n本书配套有一个网站，用户可以在那里免费下载所有程序（草图）并立即开始实验。完成四个教程后，你将能够可视化数据、创建信息图表、可视化文本分析等等。\n\n\
    祝你在创意编程中玩得开心。\nKarin 和 Bertram Schmidt-Friderichs\n\n---\n\n## I.1 目录\n\n- **I\
