  md: '# P.1.1.2 Color spectrum in a circle


    There are numerous models for organizing colors. The color spectrum arranged in
    a circle (a color wheel) is a popular model for comparing harmonies, contrasts,
    and color tones. You can control the number of circle segments, as well as their
    brightness and saturation values, allowing you to better understand the color
    arrangement in HSB mode.


    # → P_1_1_2_01


    The color-wheel segments are arranged in the shape of a fan. The individual vertices
    are computed from the cosine and sine values of the corresponding angle. A Processing
    method mode can be used that makes it especially easy to create the wheel segments.
    The individual points have to be set in the following order: first the middle
    point, and then the outer ones sequentially.


