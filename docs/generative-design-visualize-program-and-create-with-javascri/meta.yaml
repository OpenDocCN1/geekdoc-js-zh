    # P.2.2.6  Agents on a pendulum


    These double agents are changeable and chained together. The agents move along
    sets of interrelated pendulums, leaving behind complex traces that are reminiscent
    of the drawings of a Spirograph. Over time, their secret mission becomes visible.


    → P_2_2_6_01


