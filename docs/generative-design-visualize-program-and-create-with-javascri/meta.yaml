- md: "## P.2.1.3 Consolidation easily creates a 3D effect.\n\n→ P_2_1_3_02 Consolidation\
    \ easily creates a 3D effect.\n\n→ P_2_1_3_05 This module consists of increasingly\
    \ smaller and darker circles.\n\n→ **P_2_1_3_04** This module displays a similar\
    \ principle to the one opposite but with rotating squares. The squares are hardly\
    \ recognizable as colored and transparent.\n\n## P.2.1.4 Checkboxes in a grid\n\
    \nThis is where the controls' wildest dreams come true: they finally become visual\
    \ design elements. Buttons, checkboxes, and sliders are used as raster elements\
    \ in the browser, serving as pure visualization elements that become intriguing\
    \ when grouped and arranged together.\n\n→ P_2_1_4_01\n\nEach pixel of an input\
    \ image is analyzed and displayed as a checkbox. The brightness of the pixel determines\
    \ whether it is checked off or not. If the brightness is above a specified threshold,\
    \ the checkmark will not be set. Those checkboxes therefore will appear brighter.\n\
    \n→ P_2_1_4_01 The appearance of the checkboxes varies from browser to browser\
    \ but can be adjusted via style sheets.\n\n```\n<html>\n...\n<body>\n  <div id=\"\
    container\"></div> ...\n</body>\n</html>\n```\n\n1. The index.html document provides\
    \ a `<div>` element with the `id container`, to which the checkboxes will be added\
    \ later.\n\n```\nfunction setup() {\n  noCanvas();\n  ...\n  for (var y = 0; y\
    \ < rows; y++) {\n    for (var x = 0; x < cols; x++) {\n      var box = createCheckbox();\
    \ box.style('display', 'inline');\n      box.parent('container'); boxes.push(box);\n\
    \    }\n  }\n  var linebreak = createSpan('<br/>');\n  linebreak.parent('mirror');\n\
    }\nslider = createSlider(0, 255, 0);\n```\n\n2. Since the elements land directly\
    \ in the HTML document, the standard drawing canvas can be removed.\n3. Create\
    \ checkbox with `createCheckbox()`. These can be positioned with `style()` style\
    \ properties, and `parent()` inserts it into the HTML element `container`.\n4.\
    \ A line break is added at the end of each line.\n5. The slider can later be used\
    \ to control the brightness level threshold. A range of values from `0` to `255`\
    \ is therefore useful. The starting value is `0`.\n\n```\nfunction draw() {\n\
    \  for (var y = 0; y < img.height; y++) {\n    for (var x = 0; x < img.height;\
    \ x++) {\n      var c = color(img.get(x, y)); var bright = (red(c) + green(c)\
    \ + blue(c)) / 3;  // 7\n      var threshold = slider.value();  // 8\n      var\
    \ checkIndex = x + y * cols;\n      if (bright > threshold) {\n        boxes[checkIndex].checked(false);\n\
    \      } else {\n        boxes[checkIndex].checked(true);\n      }\n    }\n  }\n\
    }\n```\n\nWhen converting the image into checkboxes, the individual pixels of\
    \ the image must be converted into a value, in this case, `bright`. For grayscale\
    \ images, a simple mean value calculation is sufficient. For color images, a slightly\
    \ more complex calculation should be used.\n\n→ P.4.3.1 Graphics from pixel values\n\
    \nThe `value()` function retrieves the value currently set by the slider.\n\n\
    The index of the checkbox associated with this pixel is calculated from `x`, `y`,\
    \ and the number of columns, `cols`.\n\nIf the brightness of the pixel is above\
    \ the set `threshold`, the check mark is removed; otherwise it is set.\n\n- **Keys:**\
    \ 1–3: Change image\n- **Slider:** Set grayscale threshold\n\n→ **P_2_1_4_03**\
    \ Many sliders arranged geometrically.\n\n→ **P_2_1_4_04** These sliders automatically\
    \ stay in motion.\n\n## P.2.1.5 From grid to moiré\n\nA moiré, which is usually\
    \ considered a mistake in printing technology, is desirable here. By laying one\
    \ graphic grid over another identical grid and moving it, you can generate unexpected\
    \ optical illusions that you can change in real time.\n\n→ P_2_1_5_01\n\nThe moiré\
    \ effect occurs when two or more fine grid structures overlap to form a coarser\
    \ pattern. This happens because the overall picture shines brighter at all crossing\
    \ points, because more of the white background can be seen next to these intersections.\n\
    \n→ **P_2_1_5_01** Curved raster elements usually create particularly interesting\
    \ overlays.\n\n```\nfunction draw() {\n  ...\n  strokeWeight(3);\n  overlay();\n\
    \  var x = map(mouseX, 0, width, -50, 50); var a = map(mouseX, 0, width, -0.5,\
    \ 0.5); var s = map(mouseY, 0, height, 0.7, 1.3);\n  if (drawMode == 2) translate(x,\
    \ 0); if (drawMode == 1) rotate(a); scale(s);\n  strokeWeight(2);\n  overlay();\n\
    }\n```\n\n1. The background graphic is drawn. Since this graphic must be generated\
    \ a second time, this process has been swapped out to the `overlay()` function.\n\
    2. The mouse position is used to calculate the corresponding values for the translation\
    \ `x`, the rotation `a`, and the scaling `s`.\n3. Depending on the `drawMode`,\
    \ the coordinate system is either moved horizontally or rotated. Scaling is done\
    \ in both cases.\n4. The overlay graphic is drawn with a slightly different stroke\
    \ width.\n\n```\nfunction overlay() {\n  var w = width - 100;\n  var h = height\
    \ - 100;\n  if (drawMode == 1) {\n    for (var i = -w / 2; i < w / 2; i += 5)\
    \ {\n      line(i, -h / 2, i, h / 2);\n    }\n  }\n  if (drawMode == 2) {\n  \
    \  for (var i = 0; i < w; i += 10) {\n      ellipse(0, 0, i);\n    }\n  }\n}\n\
    ```\n\n1. The graphic is created in the function `overlay()`.\n2. In drawMode\
    \ 1, a series of lines.\n3. In drawMode 2, gradually increasing circles.\n\n-\
    \ **Mouse:** Position x: Rotate or move overlay; Position y: Scale overlay; 1–2:\
    \ Change drawMode\n- **Keys:** S: Save image\n\n→ **P_2_1_5_01** The moiré effect\
    \ becomes stronger as the two grids get closer in terms of rotation and scaling.\n\
    \n→ **P_2_1_5_04** Freely drawn lines, drawn numerous times, parallel to each\
    \ other and overlaid.\n\n## P.2.2.1 Dumb agents\n\nInstead of being rigidly embedded\
    \ in a grid, the pixel now becomes an agent and can move freely based on different\
    \ behavioral patterns. With each step the agent advances according to one of eight\
    \ directions, leaving a trail behind it. It pursues its mission and never gives\
    \ up.\n\n→ P_2_2_1_01\n\nDuring each drawing operation, one of the eight possible\
    \ directions is randomly selected for the next step. Steps are made by adding\
    \ or subtracting a predetermined value (step size) to the current position's coordinates.\
    \ The circle is finally drawn at the new position.\n\n→ **P_2_2_1_01** The longer\
    \ the agents migrate, the denser the cloud structure becomes.\n\n→ P_2_2_1_02\
    \ The agents' direction of movement is restricted here.\n\n→ **P_2_2_1_02** In\
    \ this variation, the diameters of the circles are larger and sometimes colored\
    \ blue.\n\n```\nvar NORTH = 0;\nvar NORTHEAST = 1;\nvar EAST = 2;\nvar SOUTHEAST\
    \ = 3;\nvar SOUTH = 4;\nvar SOUTHWEST = 5;\nvar WEST = 6;\nvar NORTHWEST = 7;\n\
    ...\nvar stepSize = 1;\nvar diameter = 1;\n```\n\n1. Eight constants, each with\
    \ a different numerical value, are defined.\n2. The step size and diameter of\
    \ the agents can be set by changing the values of `stepSize` and `diameter`.\n\
    \n```\nfunction draw() {\n  for (var i = 0; i <= mouseX; i++) {\n    direction\
    \ = int(random(0, 8));  // 4\n    if (direction == NORTH) {\n      posY -= stepSize;\n\
    \    } else if (direction == NORTHEAST) {\n      posX += stepSize;\n      posY\
    \ -= stepSize;\n    } else if (direction == EAST) {\n      posX += stepSize;\n\
    \    } else if (direction == SOUTHEAST) {\n      ...\n    }\n  }\n}\n```"
  mdcn: "\n## P.2.1.3 叠加易于创造3D效果。\n\n→ P_2_1_3_02 叠加易于创造3D效果。\n\n→ P_2_1_3_05 此模块由越来越小且越来越暗的圆圈组成。\n\
    \n→ **P_2_1_3_04** 此模块与对面展示的原理相似，但使用的是旋转的正方形。这些正方形因其彩色和透明性而几乎难以辨认。\n\n## P.2.1.4\
    \ 网格中的复选框\n\n这里实现了控件最狂野的梦想：它们最终成为了视觉设计元素。按钮、复选框和滑块被用作浏览器中的光栅元素，作为纯粹的可视化元素，当它们被分组和排列在一起时，就变得引人入胜。\n\
    \n→ P_2_1_4_01\n\n输入图像的每个像素都被分析并显示为一个复选框。像素的亮度决定了它是否被选中。如果亮度高于指定的阈值，则不会设置复选标记。因此，这些复选框会显得更亮。\n\
    \n→ P_2_1_4_01 复选框的外观因浏览器而异，但可以通过样式表进行调整。\n\n```\n<html>\n...\n<body>\n  <div\
    \ id=\"container\"></div> ...\n</body>\n</html>\n```\n\n1.  index.html文档提供了一个带有`id\
    \ container`的`<div>`元素，复选框稍后将被添加到该元素中。\n\n```\nfunction setup() {\n  noCanvas();\n\
    \  ...\n  for (var y = 0; y < rows; y++) {\n    for (var x = 0; x < cols; x++)\
    \ {\n      var box = createCheckbox(); box.style('display', 'inline');\n     \
    \ box.parent('container'); boxes.push(box);\n    }\n  }\n  var linebreak = createSpan('<br/>');\n\
    \  linebreak.parent('mirror');\n}\nslider = createSlider(0, 255, 0);\n```\n\n\
    2.  由于元素直接放入HTML文档中，因此可以移除标准绘图画布。\n3.  使用`createCheckbox()`创建复选框。可以通过`style()`样式属性定位它们，并通过`parent()`将其插入HTML元素`container`中。\n\
    4.  在每行末尾添加换行符。\n5.  滑块稍后可用于控制亮度级别阈值。因此，一个从`0`到`255`的值范围很有用。起始值为`0`。\n\n```\n\
    function draw() {\n  for (var y = 0; y < img.height; y++) {\n    for (var x =\
    \ 0; x < img.height; x++) {\n      var c = color(img.get(x, y)); var bright =\
    \ (red(c) + green(c) + blue(c)) / 3;  // 7\n      var threshold = slider.value();\
    \  // 8\n      var checkIndex = x + y * cols;\n      if (bright > threshold) {\n\
    \        boxes[checkIndex].checked(false);\n      } else {\n        boxes[checkIndex].checked(true);\n\
    \      }\n    }\n  }\n}\n```\n\n在将图像转换为复选框时，图像的每个像素必须转换为一个值，在本例中为`bright`。对于灰度图像，简单的平均值计算就足够了。对于彩色图像，应使用稍微复杂的计算。\n\
    \n→ P.4.3.1 来自像素值的图形\n\n`value()`函数检索滑块当前设置的值。\n\n与此像素关联的复选框的索引由`x`、`y`和列数`cols`计算得出。\n\
    \n如果像素的亮度高于设定的`threshold`，则移除复选标记；否则设置复选标记。\n\n- **按键：** 1–3：更改图像\n- **滑块：** 设置灰度阈值\n\
    \n→ **P_2_1_4_03** 许多滑块按几何形状排列。\n\n→ **P_2_1_4_04** 这些滑块自动保持运动。\n\n## P.2.1.5\
    \ 从网格到摩尔纹\n\n摩尔纹通常被认为是印刷技术中的错误，在这里是可取的。通过将一个图形网格叠加在另一个相同的网格上并移动它，可以生成意想不到的光学错觉，你可以实时更改这些错觉。\n\
    \n→ P_2_1_5_01\n\n当两个或多个精细网格结构重叠形成更粗糙的图案时，就会出现摩尔纹效应。这是因为整体图像在所有交叉点处都更亮，因为在这些交叉点旁边可以看到更多的白色背景。\n\
    \n→ **P_2_1_5_01** 弯曲的光栅元素通常能产生特别有趣的叠加效果。\n\n```\nfunction draw() {\n  ...\n \
    \ strokeWeight(3);\n  overlay();\n  var x = map(mouseX, 0, width, -50, 50); var\
    \ a = map(mouseX, 0, width, -0.5, 0.5); var s = map(mouseY, 0, height, 0.7, 1.3);\n\
    \  if (drawMode == 2) translate(x, 0); if (drawMode == 1) rotate(a); scale(s);\n\
    \  strokeWeight(2);\n  overlay();\n}\n```\n\n1.  绘制背景图形。由于此图形必须再次生成，因此此过程已被提取到`overlay()`函数中。\n\
    2.  鼠标位置用于计算平移`x`、旋转`a`和缩放`s`的相应值。\n3.  根据`drawMode`，坐标系要么水平移动，要么旋转。两种情况下都会进行缩放。\n\
    4.  使用略微不同的笔触宽度绘制叠加图形。\n\n```\nfunction overlay() {\n  var w = width - 100;\n\
    \  var h = height - 100;\n  if (drawMode == 1) {\n    for (var i = -w / 2; i <\
    \ w / 2; i += 5) {\n      line(i, -h / 2, i, h / 2);\n    }\n  }\n  if (drawMode\
    \ == 2) {\n    for (var i = 0; i < w; i += 10) {\n      ellipse(0, 0, i);\n  \
    \  }\n  }\n}\n```\n\n1.  在`overlay()`函数中创建图形。\n2.  在drawMode 1中，绘制一系列线条。\n3. \
