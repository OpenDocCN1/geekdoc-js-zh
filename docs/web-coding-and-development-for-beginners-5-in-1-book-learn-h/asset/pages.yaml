    # Basic tags


    +   * The Table 1.1 shows the list of tags which are required for writing the
    basic ''HTML'' codes i.e. without any style e.g. bold, italics and numbering each
    etc.


    Table 1.1: List of basic tags


    | Tag | Description | Example |

    |---|---|---|

    | h1, ... h6 | Header tag h1 to h6 | <h2> Hi </h2> |

    | p | paragraphs (Lines at the end) | <p> Hi </p> |

    | span | No line change after span | <span>Hi</span><span> Bye. |

    | div | make division between contents | <div> ... </div> |

    | hyperlink | Move content to center | see Section 1.9 |

    | center | | <center> Hi </center> |

    | br | Line break (no closing) | <br /> or <br> |

    | hr | horizontal line (no closing tag) | <hr> or <hr> |

    | pre | preserve formatting | <pre> ...... </pre> |

    | table | insert table | see Section 1.5 |


    +   * Let''s see the example of each of these tags,


    > Note: All the new codes are added below the previous codes in the ''body'' tag.
    Therefore only newly added codes are shown in the tutorial.


    ```

    <h2> Heading 2 </h2>

    <h6> He heading 6 </h6>

    ```'
