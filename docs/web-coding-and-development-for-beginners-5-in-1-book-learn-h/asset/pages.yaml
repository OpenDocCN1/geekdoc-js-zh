  md: "# Chapter 2. Cascading Style Sheets (CSS)\n\n+   Priority level:\n- ID (highest\
    \ priority)\n- Class\n- Element\n\nIf CSS have same priority, CSS rule at the\
    \ last will be applicable.\n\n+   Below is the html code with following tags,\n\
    - 'p' tag\n- 'p' tag with class 'c_head'\n- 'p' tag with class 'c_head' and id\
    \ 'i_head'\n\n```\n<!-- css.html -->\n<!DOCTYPE html>\n<html>\n<head>\n<title>CSS\
    \ Selectors</title>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"asset/my_css.css\"\
    >\n</head>\n<body>\n<p>Paragraph</p>\n<p class=\"c_head\">Paragraph with class\
    \ 'c_head'</p>\n<p class=\"c_head\" id=\"i_head\">Paragraph with class 'c_head'\
    \ and id 'i_head'</p>\n</body>\n</html>\n```\n\nBelow is the CSS code. Let us\
    \ understand the formatting of all three 'p' tags individually. The results are\
    \ shown\n\n+   Line 13 of HTML: Since 'id' has highest priority, CSS rule for\
    \ '#i_head' (Line 12) will be overridden by Line 24; hence the color is red. Line\
    \ 13 has 'p' tag, therefore 'font-variant' will be applied by Line 17. Also, this\
    \ tag has class 'c_head', therefore 'font' will be set to 'cursive'. Line 12 of\
    \ HTML: Similarly, the tag has higher priority than 'element' therefore color\
    \ of this line is orange and font-family is 'cursive'. Also, Line 17 will make\
    \ it all caps with font-variant in red. Line 10 of HTML: Color defined at Line\
    \ 18 will be overridden by Line 24; hence the color will be blue.\n\nFig. 2.3.\n\
    \n```\n/* asset/my_css.css */\n/* selection */\n.c_head {\n  font-family: cursive;\n\
    \  /* override the blue color*/\n}\n/*id selection */\n#i_head {\n  color: red;\n\
    }\n/* element selection */\npp {\n  font-variant: small-caps;\n  color: blue;\n\
    }\n```\n\n(continues on next page)"
