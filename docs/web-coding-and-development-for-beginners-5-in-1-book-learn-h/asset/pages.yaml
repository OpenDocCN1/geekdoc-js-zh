  md: '# Chapter 4


    # JavaScript


    # Introduction


    +   - JavaScript is a dynamic language which is used for designing the web pages
    on the client side.

    - It is case sensitive language.

    - It is untyped language i.e. a variable can hold any type of value.

    - // is used for comments.

    - ; i used for line termination.

    - JavaScript code should be added at the end i.e. just above the closing-body-tag.

    - It is better to write the JavaScript code in separate file as shown in next
    section.


    # First code


    The JavaScript code can be written in the ‘html’ file or in the separate ‘JavaScript
    file (.js)’ as shown in this section,


    # JavaScript in HTML file


    In HTML file, the JavaScript codes can be written inside the ‘script’ tag as shown
    in Lines 11-13 of below code. The code will write the “Hello World from JavaScript!”
    on the web page. Open the ‘js.html’ in the browser to see the message.


    ```

    <!-- js.html -->

    <!DOCTYPE html>

    <html>

    <head>

    <title>JavaScript</title>

    </head>

    <body>

    <script type="text/javascript">

    document.write("Hello World from JavaScript!<br>");

    </script>

    </body>

    </html></html>

    ```


    Below is the output on the HTML page.'
  merge: -1
  pgno: 50
- img_proc: true
  md: "# 4.3. Keywords, Datatypes, Variables and Operators\n\n# JavaScript in separate\
    \ file\n\n+   - The JavaScript code is saved in the file 'my_javascript.js' which\
    \ is located inside the folders 'asset/js'. Note that, no 'script tag' is used\
    \ here.\n\n```\n// asset/my/javascript.js\ndocument.write('Hello World from JavaScript!<br>');\n\
    // Next we need to import the .js file in the HTML file as shown below,\n<!--\
