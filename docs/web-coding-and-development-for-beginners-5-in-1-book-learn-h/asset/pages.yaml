  md: '# Chapter 3


    # Bootstrap


    # Introduction


    One of the problem with basic HTML design is that the webpage may look different
    in different browser or device (e.g. mobile, tablet and laptop). Therefore, we
    may need to modify the code according to browser or device. The problem can be
    easily resolved by using Bootstrap.


    Bootstrap.js is a framework that uses HTML, CSS and JavaScript for the web design.
    It is supported by all the major browsers e.g. Firefox, Opera and Chrome etc.
    Further, Bootstrap includes several predefined classes for easy layouts e.g. dropdown
    menus, navigation bar and alerts etc. Lastly, it is responsive in nature i.e.
    the layout changes automatically to the device e.g. mobile or laptop etc.


    # Setup


    Bootstrap needs atleast 3 files for its operation which can be downloaded from
    the Bootstrap website.


    +   - bootstrap.css (Line 7) : This file contains various CSS for bootstrap.

    - bootstrap.js (Line 16) : This file contains various JavaScript functionalities
    e.g. dropdown and alerts etc.

    - jQuery.js (Line 17) : This file is the jQuery library which can be downloaded
    from the ''jQuery'' website. It is required for proper working of ''bootstrap''.


    # Download and include files


    These files are downloaded and saved inside the ''asset'' folder. Next, we need
    to include these files in the HTML document as below.


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>Bootstrap Tutorial</title>

    <!-- CSS --

    <link href="asset/bootstrap.min.css" rel="stylesheet">

    <!-- Add Custom CSS below --

    </head>

    <body>

    <!-- Javascript -->

    <!-- put jquery before bootstrap.min.js; and then add custom jquery -->

    ```'
