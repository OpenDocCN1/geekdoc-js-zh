    | private | protected | public | return |

    | short | static | super | switch |

    | this | throw | throws | transient |

    | true | try | typeof | var |

    | void | volatile | while | with |


    # Datatypes


    JavaScript has three types of data,


    +   - Numbers: 123,32,32

    - Strings: "Meher", "Krishna Patel", "123"

    - Boolean: true, false


    Note: All the numbers are considered as ‘floating point’.


    # Variables


    Variables can define using keyword ''var''. Further, JavaScript is untyped language
    i.e. a variable can hold any type of value.


    +   - In the below HTML, ''p'' tag with id ''p_name'' is defined at Line 10. This
    will be used to write some text using JavaScript,


    ```

    <!-- js.html -->

    <!DOCTYPE html>

    <html>

    <head>

    <title>JavaScript</title>

    </head>

    <body>

    <p id=''p_name''></p>

    <!-- import_JavaScript files here -- -->

    <script src="asset/js/my_javascript.js"></script>

    </body>

    </html>

    ```


    Two variables are defined at Lines 9-10 of type ''string'' and ''float'' respectively.
    Then ''getElementById'' is used to locate the tag with id=''p_name'' and the text
    is inserted as shown in Line 11. Lastly, the ''+'' sign is used to concatenate
    the values as Line 11.'
