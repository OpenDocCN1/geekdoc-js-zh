    integrity="sha384-TC5qib027aqviSMFHJOMAlkffuRvZXzPrnCJA7i2mWN1pGMCD0wGNIlcPD7Txa
    crossorigin="anonymous"></script>

    </body>

    </html>

    Note: In this case we used the first method to download the files and include
    them in the html document.

    ```


