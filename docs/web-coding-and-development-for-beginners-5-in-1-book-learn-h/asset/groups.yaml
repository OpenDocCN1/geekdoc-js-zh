    \ centered</h3>\n<p><span> Centered span inside the paragraph. </span></p>\n</center>\n\
    Two horizontal line is drawn using two 'hr' tag.\n<hr/>\n<hr/>\n<pre>'pre' tag\
    \ preserve the formatting (good for writing codes) # Python code\nx=2\ny=3\nprint(x+y)\n\
