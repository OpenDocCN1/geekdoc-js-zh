    \ in 'label_id'\n);\n);\n```\n\n## Selectors\n\nIn this section, we will use the\
    \ following to understand HTML the various combination of the selectors which\
    \ are summarized in Table 5.1.\n\n```html\n<!DOCTYPE html>\n<head>\n<title>Query\
    \ Selectors</title>\n</head>\n<body>\n<p>Query Selectors</p>\n<p class=\"foo\"\
    >Paragraph with class. </p>\n<p><span>Paragraph with span. <span></</span></span></p>\n\
    <p id=\"bar\">Paragraph with ID. <span class=\"foo\">Span with class and inside\
    \ the paragraph-with-id. <span></</span></span></p>\n<div>\n<p id=\"my_para\"\
    >Paragraph (with custom id) inside the div</p>\n<p id=\"my_para_2\"><span>Span\
    \ inside the paragraph (with custom id) inside the div</span></p>\n</div>\n\n\
    <!-- Javascript -->\n<script src=\"...asset/js/jquery-3.3.1.min.js\"></script>\n\
    ```\n\nNote:\n\n- Press 'ctrl+shift+k' (or go to Tools->Web Developer->Web Console)\
    \ to open the web-console in Firefox and click on 'console' and type the \"jQuery\"\
    \ commands there.\n- Press 'ctrl-shift+J' (or go to Tools->Javascript Console)\
    \ in 'Chrome' and type the jQuery commands there.\n- In this tutorial, the output\
    \ of the \"Firefox\" are shown.\n\n## Select elements\n\nSelect elements\n\nHTML\
    \ elements, e.g. div, p, span and table etc., can be selected by writing them\
    \ with the quotation mark as shown in below codes.\n\n- Here, ('$') is the command,\
    \ where the lines below it are the outputs.\n- The outputs show the 'selected\
    \ elements'; and the total number of selected elements i.e. ‘length: 6’.\n- If\
    \ we put the cursor to one of the outputs, then it will highlight the corresponding\
    \ elements in the html as shown in Fig. 5.8.\n\n## Chapter 5. jQuery\n\n```javascript\n\
    $('p')\n[..]\n0: <p>\n1: <p class=\"foo\">\n2: <p>\n3: <p id=\"bar\">\n4: <p my-id=\"\
    my_para\">\n5: <p my-id=\"my_para_2\">\n6: { length: 6 }\n```\n\n![](img/f70659d57873500d1a13fffa6bbe945a_70_0.png)\n\
    \n- Similarly, we can select 'div' elements\n\n```javascript\n$('div')\n[..]\n\
    0: <div>\nlength: 1\n```\n\n## Select class\n\nClass can be selected using '.\
    \ ' operator. In below code, 'foo' is selected.\n\n```javascript\n$('.foo')\n\
    [..]\n0: <p class=\"foo\">\n1: <span class=\"foo\"></span>\nlength: 2\n```\n\n\
    ## Select ID\n\nID can be selected using '#bar' operator. In the below code, 'bar'\
    \ is selected.\n\n```javascript\n$('#bar')\n[..]\n0: <p id=\"bar\">\nlength: 1\n\
    ```\n\n## Combining selectors\n\nWe can select an element with specific class\
    \ name using '. ' operator as shown in below code. Here element 'span' with class\
    \ 'foo' is selected.\n\n## 5.3. Selectors\n\n```javascript\n$('span.foo')\n[]\n\
    0: <span class=\"foo\"></span>\nlength: 1\n```\n\n## Multiple selectors\n\nUse\
    \ '*' to select different types of elements. In the code below, \"paragraph with\
    \ id 'bar' and \"elements with class 'foo'\" are selected.\n\n```javascript\n\
    $('*bar .foo')\n[]\n0: <span class=\"foo\"></span>\n1: <span id=\"bar\"></span>\n\
    2: <span class=\"foo\"></span>\nlength: 3\n```\n\n## Select descendant element\n\
    \nSelect 'span' inside the 'p' (use space between 'span' and 'p').\n\n```javascript\n\
    $('p span')\n[]\n0: <span></span>\n1: <span class=\"foo\"></span>\n2: <span></span>\n\
    length: 3\n```\n\n## Select child element\n\nThe '>' is used to select the child\
    \ of an element.\n\n```javascript\n$('div span')\n[]\nlength: 0\n```\n\n> Note:\
    \ There is one element inside 'div' but it's path is 'div->span' therefore 'span'\
    \ is a child of 'p' (not of 'div'). But 'span' is the descendant of 'div' therefore\
    \ can be accessed using space,\n\n```javascript\n$('div span')\n[]\n0: <span></span>\n\
    length: 1\n```\n\n## Attribute selector\n\nCustom attributes can be selected as\
    \ below, (continues on next page)\n\n```javascript\n$('[my-id = my_para]')\n[]\n\
    0: <p my-id=\"my_para\"></>\nlength: 1\n```\n\n## Chapter 5. jQuery\n\n```javascript\n\
    $('p[my-id != my_para]') // select p with my-id != my_para\n[...]\n<p>\n0:\n1:\
    \ <p class=\"foo\">\n2: <p>\n3: <p id=\"bar\">\n4: <p my-id=\"my_para_2\">\n \
    \  length: 5\n\n$('p[class = 'foo'])\n[...]\n0: <p class=\"foo\">\nlength: 1\n\
    ```\n\n## Filters\n\nVarious filter options (e.g. first, last and has etc.) can\
    \ be used after ':': as shown below,\n\n```javascript\n(':first') // select first\
    \ element\n[...]\n0: <p>\n\n(':last') // select last element\n[...]\n0: <p my-id=\"\
    my_para_2\">\n   length: 1\n\n(':not('foo)') // select p which does not have class\
    \ 'foo'\n[...]\n0: <p>\n1: <p>\n2: <p id=\"bar\">\n3: <p my-id=\"my_para\">\n\
    4: <p my-id=\"my_para_2\">\n   length: 5\n\n(':has(span)') // select p which has\
    \ 'span' inside it\n[...]\n0: <p>\n1: <p id=\"bar\">\n2: <p my-id=\"my_para_2\"\
    >\n   length: 3\n\n(':hidden') // hidden 'p'\n[...]\nlength: 0\n\n(':visible')\
    \ // visible 'p'\n[...]\n0: <p>\n1: <p class=\"foo\">\n2: <p>\n3: <p id=\"bar\"\
