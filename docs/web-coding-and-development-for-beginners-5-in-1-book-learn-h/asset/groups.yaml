    # Chapter 1


    # HTML


    # Introduction


    In this chapter, various component of HTML are discussed to design a web page.


    The basic structure for an HTML page is shown below.


    +   * Entries inside the /<.../> are known as tags. Most of the tags have an opening
    and closing e.g. <head> (opening head) and </head> (closing head). Some of the
    tags do not have closing tags e.g. <!DOCTYPE ... and />.

    * The comments are written between ''<!--'' and ''-->''.

    * Here Line 1 gives the details of the ''HTML version'' to the web-browser. The
    ''html'' tells it is version 5. The ''head'' tag (beginning of the html) and links
    for the css files'' etc.

    * The ''body'' tag (7-11) contains the actual HTML code which is displayed on
    the web-browser. We add all the JavaScript related codes just before the closing
    body tag (<body>).


    ```

    <!DOCTYPE html> <!-- tells browser above the html version -->

    <html>

    <head>

    <!-- header related tags e.g. title, links etc. -->

    </head>

    <body>

    <!-- actual HTML document here -->

    <!-- add JavaScript files here -->

    </body>

    </html>

    ```


    # First code


    In below code, the message "Hello World" is displayed on the HTML page. The Fig.
    1.1 is the resultant HTML.


    +   * The title (Line 4) appears on the top of the browser.

    * The tag <h1> is called ''header'' tag, which has the larger size than the normal
    text (see the size of ''Hello World!'')

    * The tag <p> is called the ''paragraph'' tag, which can be used to write the
    paragraphs.


    ```

    <!DOCTYPE html>

    <html>

    ```'
