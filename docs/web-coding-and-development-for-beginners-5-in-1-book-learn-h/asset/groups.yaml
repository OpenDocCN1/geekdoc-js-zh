    # 1.4. Attributes\n\nIn this section, we will learn to draw tables along some\
    \ attributes which are discussed in Table 1.2.\n\n# Basic tags\n\n- The Table\
    \ 1.1 shows the list of tags which are required for writing the basic 'HTML' codes\
    \ i.e. without any style e.g. bold, italics and numbering each etc.\n\nTable 1.1:\
    \ List of basic tags\n\n| Tag | Description | Example |\n|---|---|---|\n| h1,\
    \ ... h6 | Header tag h1 to h6 | <h2> Hi </h2> |\n| p | paragraphs (Lines at the\
    \ end) | <p> Hi </p> |\n| span | No line change after span | <span>Hi</span><span>\
    \ Bye.</span> |\n| div | make division between contents | <div> ... </div> |\n\
    | hyperlink | Move content to center | see Section 1.9 |\n| center | | <center>\
    \ Hi </center> |\n| br | Line break (no closing) | <br /> or <br> |\n| hr | horizontal\
    \ line (no closing tag) | <hr> or <hr> |\n| pre | preserve formatting | <pre>\
    \ ...... </pre> |\n| table | insert table | see Section 1.5 |\n\n- Let's see the\
    \ example of each of these tags,\n\n> Note: All the new codes are added below\
    \ the previous codes in the 'body' tag. Therefore only newly added codes are shown\
    \ in the tutorial.\n\n```\n<h2> Heading 2</h2>\n<h6> He heading 6</h6>\n```\n\n\
    # 1.3. Basic tags (continued from previous page)\n\n```\n<p> This is paragraph\
    \ </p>\n<span> This is span.</span>\n<span> The 'br' tag is used after span to\
    \ break the line </span>\n<br/>\n<div style=\"color:blue\">\nThe 'div' tag can\
    \ be used for formatting the tags inside it at once using 'style' and 'classes'\
    \ and etc.\n<p> This paragraph is inside the 'div' tag </p>\n<span> This span\
