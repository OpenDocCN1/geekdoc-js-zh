    \ : 'md' = medium screen\n- col-sm-3 : 'sm' = small screen\n- col-xs-3 : 'xs'\
    \ = extra small screen\n- col-lg-offset-4 : skip first 4 columns. Similarly use\
    \ 'md', 'sm' and 'xs' with offset\n\n## Chapter 3. Bootstrap Example\n\nBelow\
