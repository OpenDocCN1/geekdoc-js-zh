    \n# Attributes\n\nIn Fig.1.2, we saw an example of attribute (ie. style) which\
    \ changed the color of all the elements to 'blue' inside the 'div' tag.\n\n# Attribute\
    \ 'name' and 'value'\n\n- Attribute is defined inside the opening part of a 'tag'.\
    \ For example, in the code below, the attribute 'style' is defined inside the\
