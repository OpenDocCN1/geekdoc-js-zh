- md: "\n# Chapter 1\n\n# HTML\n\n# Introduction\n\nIn this chapter, various component\
    \ of HTML are discussed to design a web page.\n\nThe basic structure for an HTML\
    \ page is shown below.\n\n- Entries inside the /<.../> are known as tags. Most\
    \ of the tags have an opening and closing e.g. <head> (opening head) and </head>\
    \ (closing head). Some of the tags do not have closing tags e.g. <!DOCTYPE ...\
    \ and />.\n- The comments are written between '<!--' and '-->'.\n- Here Line 1\
    \ gives the details of the 'HTML version' to the web-browser. The 'html' tells\
    \ it is version 5. The 'head' tag (beginning of the html) and links for the css\
    \ files' etc.\n- The 'body' tag (7-11) contains the actual HTML code which is\
    \ displayed on the web-browser. We add all the JavaScript related codes just before\
    \ the closing body tag (<body>).\n\n```\n<!DOCTYPE html> <!-- tells browser above\
    \ the html version -->\n<html>\n<head>\n<!-- header related tags e.g. title, links\
    \ etc. -->\n</head>\n<body>\n<!-- actual HTML document here -->\n<!-- add JavaScript\
    \ files here -->\n</body>\n</html>\n```\n\n# First code\n\nIn below code, the\
    \ message \"Hello World\" is displayed on the HTML page. The Fig. 1.1 is the resultant\
    \ HTML.\n\n- The title (Line 4) appears on the top of the browser.\n- The tag\
    \ <h1> is called 'header' tag, which has the larger size than the normal text\
    \ (see the size of 'Hello World!')\n- The tag <p> is called the 'paragraph' tag,\
    \ which can be used to write the paragraphs.\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>HTML Tutorial</title>\n</head>\n<body>\n<h1>Hello World!</h1>\n\
    <p>This is the first HTML code</p>\n</body>\n</html>\n```\n\n![](img/f70659d57873500d1a13fffa6bbe945a_5_0.png)\n\
    \nFig. 1.1: First code\n\n# Basic tags\n\n- The Table 1.1 shows the list of tags\
    \ which are required for writing the basic 'HTML' codes i.e. without any style\
    \ e.g. bold, italics and numbering each etc.\n\nTable 1.1: List of basic tags\n\
    \n| Tag | Description | Example |\n|---|---|---|\n| h1, ... h6 | Header tag h1\
    \ to h6 | <h2> Hi </h2> |\n| p | paragraphs (Lines at the end) | <p> Hi </p> |\n\
    | span | No line change after span | <span>Hi</span><span> Bye.</span> |\n| div\
    \ | make division between contents | <div> ... </div> |\n| hyperlink | Move content\
    \ to center | see Section 1.9 |\n| center | | <center> Hi </center> |\n| br |\
    \ Line break (no closing) | <br /> or <br> |\n| hr | horizontal line (no closing\
    \ tag) | <hr> or <hr> |\n| pre | preserve formatting | <pre> ...... </pre> |\n\
    | table | insert table | see Section 1.5 |\n\n- Let's see the example of each\
    \ of these tags,\n\n> Note: All the new codes are added below the previous codes\
    \ in the 'body' tag. Therefore only newly added codes are shown in the tutorial.\n\
    \n```\n<h2> Heading 2</h2>\n<h6> He heading 6</h6>\n```\n\n# 1.3. Basic tags (continued\
    \ from previous page)\n\n```\n<p> This is paragraph </p>\n<span> This is span.</span>\n\
    <span> The 'br' tag is used after span to break the line </span>\n<br/>\n<div\
    \ style=\"color:blue\">\nThe 'div' tag can be used for formatting the tags inside\
    \ it at once using 'style' and 'classes' and etc.\n<p> This paragraph is inside\
    \ the 'div' tag </p>\n<span> This span is inside the 'div' tag </span>\n<br/>\n\
    </div>\n<center>\n<h3> Heading 3 is centered</h3>\n<p><span> Centered span inside\
    \ the paragraph. </span></p>\n</center>\nTwo horizontal line is drawn using two\
    \ 'hr' tag.\n<hr/>\n<hr/>\n<pre>'pre' tag preserve the formatting (good for writing\
    \ codes) # Python code\nx=2\ny=3\nprint(x+y)\n</pre>\n```\n\n- Fig. 1.2 is the\
    \ output of above code. Read the text to understand each tag.,\n\n# Heading 2\n\
    \nHeading 6\n\nThis is paragraph\nThe 'br' tag is used after span to break the\
    \ line\nThe 'div' tag can be used for formatting the tags inside it at once using\
    \ 'style' and 'classes' etc.\nnThis paragraph is inside the 'div' tag\nThis span\
    \ is inside the 'div' tag\n\n# Heading 3 is centered\n\nCentered span inside the\
    \ paragraph.\n\nTwo horizontal line is drawn using two 'hr' tag.\n\n```\n'pre'\
    \ tag preserve the formatting (good for writing codes)\n# Python code\nx=2\ny=3\n\
    print(x+y)\n```\n\n![](img/f70659d57873500d1a13fffa6bbe945a_6_0.png)\n\n# Attributes\n\
    \nIn Fig.1.2, we saw an example of attribute (ie. style) which changed the color\
    \ of all the elements to 'blue' inside the 'div' tag.\n\n# Attribute 'name' and\
    \ 'value'\n\n- Attribute is defined inside the opening part of a 'tag'. For example,\
    \ in the code below, the attribute 'style' is defined inside the 'div' tag.\n\n\
    ```\n<div style=\"color:blue;\">\n</div>\n```\n\n- Attribute has two parts i.e.\
    \ 'name' and 'value'. For example, in the above code, name and value of the attribute\
    \ are 'style' and 'blue' respectively.\n\n# Core attributes\n\nBelow are the three\
    \ attributes which are frequently used in web design.\n\n- id: The 'id' is the\
    \ unique name which can be given to any tag. This is very useful in distinguishing\
    \ the element with other elements.\n<p id=\"id\">\n- <p class=\"class\">\n- <span\
    \ class=\"class\">\n\n- id: The 'id' is the unique name which can be given to\
    \ any tag. This is very useful in distinguishing the element with other elements.\n\
    <p id=\"id\">\n- <p class=\"class\">\n- <span class=\"class\">\n\n- id: The 'id'\
    \ is the unique name which can be given to any tag. This is very useful in distinguishing\
    \ the element with other elements.\n<p id=\"id\">\n- <p class=\"class\">\n- <span\
    \ class=\"class\">\n\n- id: The 'id' is the unique name which can be given to\
    \ any tag. This is very useful in distinguishing the element with other elements.\n\
    <p id=\"id\">\n- <p class=\"class\">\n- <span class=\"class\">\n\n- id: The 'id'\
    \ is the unique name which can be given to any tag. This is very useful in distinguishing\
    \ the element with other elements.\n<p id=\"id\">\n- <p class=\"class\">\n- <span\
    \ class=\"class\">\n\n- id: The 'id' is the unique name which can be given to\
    \ any tag. This is very useful in distinguishing the element with other elements.\n\
    <p id=\"id\">\n- <p class=\"class\">\n- <span class=\"class\">\n\n- id: The 'id'\
    \ is the unique name which can be given to any tag. This is very useful in distinguishing\
    \ the element with other elements.\n<p id=\"id\">\n- <p class=\"class\">\n- <span\
