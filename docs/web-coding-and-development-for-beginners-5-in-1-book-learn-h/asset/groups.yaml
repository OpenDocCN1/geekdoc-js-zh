- md: "\n![](img/f70659d57873500d1a13fffa6bbe945a_49_0.png)\n\nFig. 3.15: Navigation\
    \ bar (navbar)\n\n# Chapter 4\n\n# JavaScript\n\n## Introduction\n\n- JavaScript\
    \ is a dynamic language which is used for designing the web pages on the client\
    \ side.\n- It is a case sensitive language.\n- It is an untyped language i.e.\
    \ a variable can hold any type of value.\n- // is used for comments.\n- ; is used\
    \ for line termination.\n- JavaScript code should be added at the end i.e. just\
    \ above the closing-body-tag.\n- It is better to write the JavaScript code in\
    \ separate file as shown in next section.\n\n## First code\n\nThe JavaScript code\
    \ can be written in the ‘html’ file or in the separate ‘JavaScript file (.js)’\
    \ as shown in this section,\n\n## JavaScript in HTML file\n\nIn HTML file, the\
    \ JavaScript codes can be written inside the ‘script’ tag as shown in Lines 11-13\
    \ of below code. The code will write the “Hello World from JavaScript!” on the\
    \ web page. Open the ‘js.html’ in the browser to see the message.\n\n```\n<!--\
    \ js.html -->\n<!DOCTYPE html>\n<html>\n<head>\n<title>JavaScript</title>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\ndocument.write(\"Hello World from JavaScript!<br>\"\
    );\n</script>\n</body>\n</html>\n```\n\nBelow is the output on the HTML page.\n\
    \n## 4.3. Keywords, Datatypes, Variables and Operators\n\n## JavaScript in separate\
    \ file\n\n- The JavaScript code is saved in the file 'my_javascript.js' which\
    \ is located inside the folders 'asset/js'. Note that, no 'script tag' is used\
    \ here.\n\n```\n// asset/my/javascript.js\ndocument.write('Hello World from JavaScript!<br>');\n\
    // Next we need to import the .js file in the HTML file as shown below,\n<!--\
    \ js.html -->\n<!DOCTYPE html>\n<html>\n<head>\n <title>JavaScript</title>\n</head>\n\
    <body>\n <!-- import JavaScript files here -->\n <script src=\"asset/my/javascript.js\"\
    ></script>\n</body>\n</html>\n```\n\n**Note:** We will use the second method in\
    \ this tutorial.\n\n## Keywords, Datatypes, Variables and Operators\n\n### Keywords\n\
    \n- Below are the reserved keywords in the JavaScript which can not be used as\
    \ 'variable' and 'function' names etc.\n\n### Table 4.1; List of keywords\n\n\
    | abstract | boolean | break | byte |\n| --- | --- | --- | --- |\n| case | catch\
    \ | char | class |\n| const | continue | debugger | default |\n| delete | | double\
    \ | else |\n| enum | export | extends | false |\n| final | float | for | function\
    \ |\n| goto | | implements | import |\n| in | int | interface | long |\n| native\
    \ | | null | package |\n| private | protected | public | return |\n| short | static\
    \ | super | switch |\n| this | throw | throws | transient |\n| true | try | typeof\
    \ | var |\n| void | volatile | while | with |\n\n## Datatypes\n\nJavaScript has\
    \ three types of data,\n\n- Numbers: 123, 32, 32\n- Strings: \"Meher\", \"Krishna\
    \ Patel\", \"123\"\n- Boolean: true, false\n\nNote: All the numbers are considered\
    \ as ‘floating point’.\n\n## Variables\n\nVariables can be defined using keyword\
    \ 'var'. Further, JavaScript is an untyped language i.e. a variable can hold any\
    \ type of value.\n\n- In the below HTML, 'p' tag with id 'p_name' is defined at\
    \ Line 10. This will be used to write some text using JavaScript,\n\n```\n<!--\
    \ js.html -->\n<!DOCTYPE html>\n<html>\n<head>\n<title>JavaScript</title>\n</head>\n\
    <body>\n<p id='p_name'></p>\n<!-- import_JavaScript files here -- -->\n<script\
    \ src=\"asset/js/my_javascript.js\"></script>\n</body>\n</html>\n```\n\nTwo variables\
    \ are defined at Lines 9-10 of type 'string' and 'float' respectively. Then 'getElementById'\
    \ is used to locate the tag with id='p_name' and the text is inserted as shown\
    \ in Line 11. Lastly, the '+' sign is used to concatenate the values as Line 11.\n\
    \n```\n// asset/js/my_javascript\n\n// print message on the webpage\ndocument.write(\"\
    Hello World from JavaScript!<br>\");\n\n// variable example\nvar var_name = \"\
    Meher\";\nvar age = 20;\ndocument.getElementById('p_name').innerHTML = \"Hello\
    \ \" + var_name + \"<br>Age : \" + age;\n// below is the output of above codes.\
    \ note that the message 'Hello world from JavaScript' is added to the\n// as 'JavaScript'\
    \ file is imported at the end.\n```\n\n## 4.3. Keywords, Datatypes, Variables\
    \ and Operators\n\nWarning: If you import the 'JavaScript' file between the 'ending-head-tag'\
    \ and 'start-body-tag', then Message Hello Meher... will not be displayed as 'JavaScript'\
    \ will execute before the loading of the page; and JavaScript cannot find the\
    \ 'p_name'.\n\nNote: All JavaScript codes will be added below the following codes,\
    \ therefore 'prompt' can be used to read the values from the user.\n\n```\n//prompt\n\
    var x = prompt(\"enter a number\");\ndocument.write(\"2*\" + x + \" = \" + x +\
    \ \"<br>\");\n```\n\nHello\nMeher\nAge : 20\nHello World from JavaScript!\n\n\
    Note: The '+' can be used to combine outputs as shown in above example. The usage\
    \ of some of these operators are shown in Section 4.4.\n\n## Operators\n\n###\
    \ Arithmetic operators\n\n- +\n- *\n- /\n- % modulus i.e. remainder\n- ++ (increment)\n\
    - - (decrement)\n\n### Assignment operators\n\n- +=\n- -=\n- *=\n- /=\n\n### Comparison\
    \ operators\n\n- == (compare only values)\n- === (compare both values and type)\n\
    - !=\n- >\n- >=\n- <=\n\n### Conditional operator\n\n- ?: (a > b) ? a : b\n\n\
    ### Logical operators\n\n- && (logical and)\n- || (logical or)\n- ! (logical not)\n\
    \n### Bitwise operators\n\n- & (and)\n- | (or)\n- ^ (xor)\n- ~ (not)\n\n### String\
    \ to number conversion\n\n'Number' is used to convert the string into numbers.\n\
    \n```\n// string to number conversion\ndocument.write(2 + Number(3.4) + \"<br>\"\
    );\n2 + Number(3.4) = 5.4\n```\n\nBelow is the output of above code, A string\
    \ or float value can be converted into integer using 'parseInt'.\n\n### Convert\
    \ to integer\n\n```\n// int conversion\ndocument.write(\"2 + parseInt(3.4) + \"\
    <br>\"); // string to int\ndocument.write(\"2 + parseInt(3.4) + \"<br>\"); //\
    \ float to int\n```\n\nBelow are the outputs of code:\n2 + parseInt(3.4) = 5\n\
    2 + parseInt(3.4) = 5\n\nThe 'parseFloat' or 'Number' can be used to convert the\
    \ float values.\n\n## Math\n\n'Math' library contains useful functions as shown\
    \ below:\n\n```\n// math\ndocument.write(\"Math.PI = =\", Math.PI, \"<br>\");\n\
    document.write(\"Math.floor(3.14) = =\", Math.floor(3.14), \"<br>\"); // floor\n\
    document.write(\"Math.ceil(3.14) = =\", Math.ceil(3.14), \"<br>\"); // ceil\n\
    document.write(\"Math.random() = =\", Math.floor(Math.random()*20), \"<br>\");\
    \ // random number : 16\n```\n\nBelow are some of the useful 'string-styles':\n\
    \n### String\n\n```\n// strings\ndocument.write(\"meher\".toUpperCase() + \"<br>\"\
    ); // uppercase\nw = \"Krishna\"\ndocument.write(w.toLowerCase(), \"<br>\"); //\
    \ lowercase(w)\ndocument.write(w.small(), \"<br>\"); // small\ndocument.write(w.strike(),\
    \ \"<br>\"); // bold\ndocument.write(w.fontsize(\"5em\"), \"<br>\"); // strike\n\
    document.write(w.link(\"http://javascript.info\"), \"<br>\"); // link\ndocument.write(w.fontcolor(\"\
    red\").fontsize(\"12em\"), \"<br>\"); // multiple\n```\n\nThe outputs are shown\
    \ in Fig.4.1.\n\n## Arrays\n\nIn JavaScript, the arrays can store different types\
    \ of values as shown below,\n\n```\n// arrays\narr = [15, 30, \"Meher\"]\nfor(a\
    \ in arr) {\n  document.write(arr[a], \" \");\n  document.write(\"<br>\");\n}\n\
    document.write(arr.pop(), \"<br>\"); // remove last element\narr.push(\"Krishna\"\
    ); // add element to end\ndocument.write(arr.pop());\ndocument.write(\"<br>\"\
    );\ndocument.write(\"length of array: \", arr.length, \"<br>\");\n```\n\nBelow\
    \ are the output of above code,\n\n| 15 30 |\n| Meher |\n| Meher |\n| Krishna\
    \ |\n| Length of array: 2 |\n\n## Control structure, loops and functions\n\n###\
    \ If-else\n\nIn the below code, three conditions are checked for the variable\
    \ 'age'; and corresponding message is printed.\n(continues on next page)\n\n```\n\
    // asset/js/my_javascript\nif-else {\n  age = 10;\n  if (age > 3 && age < 6) {\n\
    \    document.write(\"Age: \" + age + \"<br> go to kindergarten</br>\");\n  }\
    \ else if (age >= 6 && age < 8) {\n    document.write(\"Age: \" + age + \"<br>\
    \ go to school</br>\");\n  } else {\n    document.write(\"Age: \" + age + \"<br>\
    \ go to college</br>\");\n  }\n}\n```\n"
  mdcn: "\n\n![](img/f70659d57873500d1a13fffa6bbe945a_49_0.png)\n\n图 3.15: 导航栏 (navbar)\n\
    \n# 第 4 章\n\n# JavaScript\n\n## 引言\n\n- JavaScript 是一种动态语言，用于设计客户端网页页面。\n- 它是一种区分大小写的语言。\n\
    - 它是一门无类型语言，即变量可以持有任何类型的值。\n- // 用于编写注释。\n- ; 用于行结束。\n- JavaScript 代码应该添加在末尾，即紧跟在\
    \ `</body>` 标签之前。\n- 最好将 JavaScript 代码写在单独的文件中，如下一节所示。\n\n## 第一段代码\n\nJavaScript\
    \ 代码可以写在‘html’ 文件中，也可以像本节所示，写在单独的‘JavaScript 文件 (.js)’中，\n\n## 在 HTML 文件中使用 JavaScript\n\
    \n在 HTML 文件中，JavaScript 代码可以写在‘script’ 标签内部，如下所示代码的第 11-13 行所示。该代码将在网页上打印“Hello\
    \ World from JavaScript!”。在浏览器中打开‘js.html’即可查看该消息。\n\n```\n<!-- js.html -->\n\
    <!DOCTYPE html>\n<html\n<head>\n<title>JavaScript</title>\n</head>\n<body>\n<script\
    \ type=\"text/javascript\">\ndocument.write(\"Hello World from JavaScript!<br>\"\
    );\n</script>\n</body>\n</html>\n```\n\n以下是 HTML 页面上的输出。\n\n## 4.3. 关键字、数据类型、变量和运算符\n\
    \n## 在单独文件中使用 JavaScript\n\n- JavaScript 代码保存在文件 'my_javascript.js' 中，该文件位于文件夹\
    \ 'asset/js' 内。注意，这里没有使用‘script 标签’。\n\n```\n// asset/my/javascript.js\ndocument.write('Hello\
    \ World from JavaScript!<br>');\n// 接下来我们需要如下所示在 HTML 文件中导入 .js 文件，\n<!-- js.html\
    \ -->\n<!DOCTYPE html>\n<html>\n<head>\n <title>JavaScript</title>\n</head>\n\
    <body>\n <!-- 在此处导入 JavaScript 文件 -->\n <script src=\"asset/my/javascript.js\"\
    ></script>\n</body>\n</html>\n```\n\n**注意：** 我们将在本教程中使用第二种方法。\n\n## 关键字、数据类型、变量和运算符\n\
    \n### 关键字\n\n- 下面是 JavaScript 中的保留关键字，它们不能作为‘变量’和‘函数’名称等。\n\n### 表 4.1; 关键字列表\n\
    \n| abstract | boolean | break | byte |\n| --- | --- | --- | --- |\n| case | catch\
    \ | char | class |\n| const | continue | debugger | default |\n| delete | | double\
    \ | else |\n| enum | export | extends | false |\n| final | float | for | function\
    \ |\n| goto | | implements | import |\n| in | int | interface | long |\n| native\
    \ | | null | package |\n| private | protected | public | return |\n| short | static\
    \ | super | switch |\n| this | throw | throws | transient |\n| true | try | typeof\
    \ | var |\n| void | volatile | while | with |\n\n## 数据类型\n\nJavaScript 有三种数据类型：\n\
    \n- 数字 (Numbers)：123, 32, 32\n- 字符串 (Strings):\"Meher\", \"Krishna Patel\", \"\
    123\"\n- 布尔值 (Boolean)：true, false\n\n注意：所有数字都被视为‘浮点数’。\n\n## 变量\n\n可以使用关键字 'var'\
    \ 定义变量。此外，JavaScript 是一门无类型语言，即变量可以持有任何类型的值。\n\n- 在下方的 HTML 中，id 为 'p_name' 的\
    \ 'p' 标签定义在第 10 行。这将用于使用 JavaScript 写入一些文本，\n\n```\n<!-- js.html -->\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>JavaScript</title>\n</head>\n<body>\n<p id='p_name'></p>\n\
    <!-- 在此处导入 JavaScript 文件 -- -->\n<script src=\"asset/js/my_javascript.js\"></script>\n\
    </body>\n</html>\n```\n\n在第 9-10 行分别定义了两个类型为 'string' 和 'float' 的变量。然后使用 'getElementById'\
    \ 定位 id 为 'p_name' 的标签，并如第 11 行所示插入文本。最后，使用 '+' 号如第 11 行所示对值进行拼接。\n\n```\n// asset/js/my_javascript\n\
    \n// 在网页上打印消息\ndocument.write(\"Hello World from JavaScript!<br>\");\n\n// 变量示例\n\
    var var_name = \"Meher\";\nvar age = 20;\ndocument.getElementById('p_name').innerHTML\
    \ = \"Hello \" + var_name + \"<br>Age : \" + age;\n// 以下是上述代码的输出。注意消息 'Hello world\
    \ from JavaScript' 被添加到了\n// 因为 'JavaScript' 文件是在末尾导入的。\n```\n\n## 4.3. 关键字、数据类型、变量和运算符\n\
    \n警告：如果在‘结束的 head 标签’和‘开始 body 标签’之间导入‘JavaScript’文件，那么“Hello Meher...” 消息将不会显示，因为\
    \ 'JavaScript' 将在页面加载之前执行；且 JavaScript 找不到 'p_name'。\n\n注意：所有的 JavaScript 代码都将添加到以下代码之后，因此可以使用\
    \ 'prompt' 从用户处读取值。\n\n```\n//prompt\nvar x = prompt(\"enter a number\");\ndocument.write(\"\
    2*\" + x + \" = \" + x + \"<br>\");\n```\n\nHello\nMeher\nAge : 20\nHello World\
    \ from JavaScript!\n\n注意：'+' 可以如上面的示例所示组合输出。其中一些运算符的用法将在第 4.4 节显示。\n\n## 运算符\n\
    \n### 算术运算符\n\n- +\n- *\n- /\n- % 取模，即余数\n- ++ (递增)\n- - (递减)\n\n### 赋值运算符\n\n\
    - +=\n- -=\n- *=\n- /=\n\n### 比较运算符\n\n- == (仅比较值)\n- === (同时比较值和类型)\n- !=\n-\
    \ >\n- >=\n- <=\n\n### 条件运算符\n\n- ?: (a > b) ? a : b\n\n### 逻辑运算符\n\n- && (逻辑与)\n\
    - || (逻辑或)\n- ! (逻辑非)\n\n### 位运算符运算符\n\n- & (位与)\n- | (位或)\n- ^ (位异或)\n- ~ (位反)\n\
    \n### 字符串转数字\n\n'Number' 用于将字符串转换为数字。\n\n```\n// 字符串转数字\ndocument.write(Number(\"\
    3.4\")); // 字符串转数字\n2 + Number(\"3.4\")\n5.4\n```\n\n以下是上述代码的输出，字符串或浮点值可以使用 'parseInt'\
    \ 转换为整数。\n\n### 转换为整数\n\n```\n// 整数转换\ndocument.write(parseInt(\"3.4\")); // 整数转换\n\
    2 + parseInt(\"3.4\") // 字符串到 int\n5\n```\n\n代码：\n'parseFloat' 或 'Number' 可用于转换浮点值。\n\
    \n## Math\n\n'Math' 库包含如下所示的函数：\n\n```\n// math\ndocument.write(\"Math.PI = =\"\
    , Math.PI, \"<br>\");\ndocument.write(\"Math.floor(3.14) = =\", Math.floor(3.14),\
    \ \"<br>\"); // 向取\ndocument.write(\"Math.ceil(3.14) = =\", Math.ceil(3.14), \"\
    <br>\"); // 向上取\ndocument.write(\"Math.random() = =\", Math.floor(Math.random()*20),\
    \ \"<br>\"); // 随机数：16\n```\n\n以下是一些'字符串样式':\n\n### 字符串\n\n```\n// 字符串\ndocument.write(\"\
    meher\".toUpperCase() + \"<br>\"); // 大写\nw = \"Krishna\"\ndocument.write(w.toLowerCase(),\
    \ \"<br>\"); // 小写(w)\ndocument.write(w.small(), \"<br>\"); // 小字体\ndocument.write(w.strike(),\
    \ \"<br>\"); // 粗体\ndocument.write(w.fontsize(\"5em\"), \"<br>\"); // 划线\ndocument.write(w.link(\"\
    http://javascript.info\"), \"<br>\"); // 链接\ndocument.write(w.fontcolor(\"red\"\
    ).fontsize(\"12em\"), \"<br>\"); // 多重\n```\n\n输出见图4.1。\n\n## 数组\n\n在 JavaScript\
