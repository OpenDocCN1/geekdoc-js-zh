    of the selectors which are summarized in Table 5.1.


    ```

    <!DOCTYPE html>

    <head>

    <title>Query Selectors</title>

    </head>

    <body>

    <p>Query Selectors</p>

    <p class="foo">Paragraph with class. </p>

    <p><span>Paragraph with span. <span></span></span></p>

    <p id="bar">Paragraph with ID. <span class="foo">Span with class and inside the
    paragraph-with-id. <span></span></span></p>

    <div>

    <p id="my_para">Paragraph (with custom id) inside the div</p>

    <p id="my_para_2"><span>Span inside the paragraph (with custom id) inside the
    div</span></p>

    </div>


    <!-- Javascript --

    <script src="...asset/js/jquery-3.3.1.min.js"></script>

    ```


    Note:


    +   - Press ''ctrl+shift+k'' (or go to Tools->Web Developer->Web Console) to open
    the web-console in Firefox and click on ''console'' and type the "jQuery" commands
    there.

    - Press ''ctrl-shift+J'' (or go to Tools->Javascript Console) in ''Chrome'' and
    type the jQuery commands there.

    - In this tutorial, the output of the "Firefox" are shown.


    # Select elements


    Select elements


    HTML elements, e.g. div, p, span and table etc., can be selected by writing them
    with the quotation mark as shown in below codes.


    +   - Here,(''$'') is the command, where the lines below it are the outputs.

    - The outputs show the ''selected elements''; and the total number of selected
    elements i.e. ‘length: 6’.

    - If we put the cursor to one of the outputs, then it will highlight the corresponding
    elements in the html as shown in Fig. 5.8.'
