    #\">Action</a></li>\n    <li><a href=\"#\">Another action</a></li>\n    <li><a\
    \ href=\"#\">Something else here</a></li>\n    <li><div role=\"separator\"></div></li>\n\
    \    <li><a href=\"#\">Separated link</a></li>\n  </ul>\n</div>\n<!-- JavaScript\
    \ -->\n  <!-- put jQuery.js before bootstrap.min.js, and then add custom jquery\
    \ -->\n  <script src=\"asset/js/jquery-3.3.1.min.js\"></script>\n  <script src=\"\
    asset/js/bootstrap.min.js\"></script>\n</body>\n</html>\n```\n\nThe resultant\
    \ web page is shown in Fig. 3.1.\n\n![](img/f70659d57873500d1a13fffa6bbe945a_27_0.png)\n\
    \nFig. 3.1: Click on the 'Dropdown' button\n\n### Grid system\n\nBootstrap divides\
    \ each row into 12 columns. Then following commands can be used to specify the\
