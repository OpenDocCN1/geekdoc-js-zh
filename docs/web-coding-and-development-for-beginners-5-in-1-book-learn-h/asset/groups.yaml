    # Chapter 3. Bootstrap Example


    Below is an example of grid system. Read the content of the Lines 13-16 to understand
    it. The resultant webpage is shown in Fig. 3.2.


    Note:


    +   - For easy visualization, in the code the CSS code (Lines 9-21) is used to
    fill the columns with colors and border.

    - The columns (Lines 28-30) should be defined inside the class ''row'' (Line 27).

    - Also, some of the widths of individual columns should not be greater than 12.

    - Lastly, if we use ''col-md-4'' without defining the ''lg'', ''sm'' then ''md''
    rule will be applicable to higher size ''lg'', but not the lower size ''sm'' and
    ''xs''. Similarly, if we use ''sm'' without defining the ''lg'', ''md'' and ''xs'',
    then rule will be applicable to higher size screen i.e. ''lg'' but not on ''xs''


    ```

