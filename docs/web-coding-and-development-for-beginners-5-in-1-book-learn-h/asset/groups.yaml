    ## 第 3 章\n\n## Bootstrap\n\n### 引言\n\n基础 HTML 设计的问题之一是网页在不同的浏览器或设备（例如手机、平板电脑和笔记本）上看起来可能不同。因此，我们可能需要根据浏览器或设备修改代码。使用\
    \ Bootstrap 可以轻松解决这个问题。\n\nBootstrap.js 是一个使用 HTML、CSS 和 JavaScript 进行 Web 设计的框架。它支持所有主流浏览器，例如\
    \ Firefox、Opera 和 Chrome 等。此外，Bootstrap 包含了几个预定义的类用于方便布局，例如下拉菜单、导航栏和警报等。最后，它本质上是响应式的，即布局随设备（如手机或笔记本电脑等）自动更改。\n\
    \n### 安装\n\nBootstrap 运行至少需要 3 个文件，可以从 Bootstrap 网站下载。\n\n- bootstrap.css (第 7\
    \ 行) ：此文件包含 bootstrap 的各种 CSS。\n- bootstrap.js (第 16 行) ：此文件包含各种 JavaScript 功能，例如下拉菜单和警报等。\n\
    - jQuery.js (第 17 行) ：此文件是 jQuery 库，可以从 'jQuery' 网站下载。它是 'bootstrap' 正常运行所需的。\n\
    \n### 下载并引入文件\n\n这些文件被下载并保存在 'asset' 文件夹中。接下来，我们需要如下将这些文件包含在 HTML 文档中。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Bootstrap 教程</title>\n<!-- CSS -->\n<link\
    \ href=\"asset/bootstrap.css\" rel=\"stylesheet\">\n<!-- 在下方添加自定义 CSS -->\n</head>\n\
    <body>\n<!-- Javascript -->\n<!-- 在 bootstrap.min.js 之前放置 jquery；然后添加自定义 jquery\
    \ -->\n<script src=\"asset/js/jquery-3.3.min.js\"></script>\n<script src=\"asset/js/bootstrap.min.js\"\
    ></script>\n</body>\n</html>\n```\n\n## 第 3 章 Bootstrap\n\n### 添加 CDN\n\n另一种通过\
    \ CDN 引入文件的方法。在这种方法中，我们不需要下载文件，只需像下方的第 8、17 和 19 行那样提供这些文件的链接。注意，在这种情况下，代码无法在离线模式下工作。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Bootstrap 教程</title>\n<!--\
    \ CSS -->\n<!-- 版本的编译后的 CSS -->\n<link rel=\"stylesheet\" href=\"https://cdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
    \ integrity=\"sha384-BWWY8iKIdgnmKyuhAHr32Omucw7nRYdg4v+PmTSsz/K8vbdE_j4hu4\"\
    \ crossorigin=\"anonymous\">\n<!-- 在下方添加自定义 CSS -->\n</head>\n<body>\n<!-- JavaScript\
    \ -->\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js\"\
    ></script>\n<script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js\"\
    \ integrity=\"sha384-TCqib027aqviSMFHOM\">\n```\n注意：在这种情况下，我们使用了第一种方法下载文件并包含在\
    \ html 文档中。\n\n### 检查设置\n\n让我们编写第一段代码来检查 Bootstrap 的设置是否正确。注意：我们不需要记忆 'dropdown'\
    \ 按钮的代码。所有模板在 Bootstrap 网站上都可用。从那里复制并粘贴代码，并根据本教程的需要修改代码。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Bootstrap 教程</title>\n<!-- CSS -->\n<link href=\"\
    asset/bootstrap.css\" rel=\"stylesheet\">\n</head>\n<body>\n[/content] (注：原文此处似乎有截断或逻辑跳转，根据后续内容翻译)\n\
