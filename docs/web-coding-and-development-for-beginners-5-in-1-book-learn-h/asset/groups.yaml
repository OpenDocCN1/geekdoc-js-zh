    \ Therefore, we may need to modify the code according to browser or device. The\
    \ problem can be easily resolved by using Bootstrap.\n\nBootstrap.js is a framework\
    \ that uses HTML, CSS and JavaScript for the web design. It is supported by all\
    \ the major browsers e.g. Firefox, Opera and Chrome etc. Further, Bootstrap includes\
    \ several predefined classes for easy layouts e.g. dropdown menus, navigation\
    \ bar and alerts etc. Lastly, it is responsive in nature i.e. the layout changes\
    \ automatically to the device e.g. mobile or laptop etc.\n\n### Setup\n\nBootstrap\
    \ needs atleast 3 files for its operation which can be downloaded from the Bootstrap\
    \ website.\n\n- bootstrap.css (Line 7) : This file contains various CSS for bootstrap.\n\
    - bootstrap.js (Line 16) : This file contains various JavaScript functionalities\
    \ e.g. dropdown and alerts etc.\n- jQuery.js (Line 17) : This file is the jQuery\
    \ library which can be downloaded from the 'jQuery' website. It is required for\
    \ proper working of 'bootstrap'.\n\n### Download and include files\n\nThese files\
    \ are downloaded and saved inside the 'asset' folder. Next, we need to include\
    \ these files in the HTML document as below.\n\n```html\n<!DOCTYPE html>\n<html>\n\
