    # Attributes


    In Fig.1.2, we saw an example of attribute (ie. style) which changed the color
    of all the elements to ''blue'' inside the ''div'' tag.


    # Attribute ''name'' and ''value''


    +   - Attribute is defined inside the opening part of a ''tag''. For example,
    in the code below, the attribute ''style'' is defined inside the ''div'' tag.


    ```

    <div style="color:blue;">

    </div>

    ```


    +   - Attribute has two parts i.e. ''name'' and ''value''. For example, in the
    above code, name and value of the attribute are ''style'' and ''blue'' respectively.


    # Core attributes


    Below are the three attributes which are frequently used in web design.


    +   - id: The ''id'' is the unique name which can be given to any tag. This is
    very useful in distinguishing the element with other elements.

    <p id="para1">This is paragraph with id ''para1'' </p>

    <p id="para2">This is paragraph with id ''para2'' </p>

    <p class="blue">This is paragraph with class ''blue'' </p>

    <span class="b">This spans with class ''b''</span>

    - class: The attribute ''class'' can be used with multiple tags. This is very
    useful in groups HTML design.

    - style: We already saw the example of style attribute, which can be used to change
    the formatting of the text in HTML design. We can specify various styles which
    are discussed in Chapter 2.


    ```

    <p style="font-weight:bold;color:red;">Style attribute is used to bold and color</p>

    ```


    > Note: Above three attributes are used with ''CSS (casading style sheet) and
    JavaScript/jQuery, which are the very handy tools to enhance the look and functionalities
    of the web-page respectively. The CSS is discussed in Chapter 2, JavaScript and
    jQuery are discussed in Chapter 4 and Chapter 5.


    +   - We can also define multiple attributes for one tag as shown:

    <p class="my_class" id="para_class" style="color:green;\>Multiple attributes </p>

    - The other attributes are discussed in Table 1.2


    | Name | Values | Description |

    |---|---|---|

    | id | user defined names | <p id="1"> Hi </p> |

    | class | user defined names | <p class="_class"> Hi </p> |

    | style | CSS styles | <p style="color:red;font-weight:bold;">Hi </p> |

    | align | left, right, center | horizontal alignment |

    | width | numeric value or % value | width of images and tables etc. |

    | height | numeric value | height of images and tables etc. |'
