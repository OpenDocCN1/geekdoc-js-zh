    \ grey;\ncolor: white;\nweight: bold;\nborder: 1px solid red;\nheight: 3em; /*height\
    \ of the box*/\ntext-align: center; /*vertical center the text*/\n}\n</style>\n\
    </head>\n<body>\n<div class=\"row\">\n<div class=\"col-md-2 col-xs-4 col-md-2\"\
    ></div>\n<div class=\"col-md-6 col-xs-4 col-md-6\"></div>\n<div class=\"col-md-4\
