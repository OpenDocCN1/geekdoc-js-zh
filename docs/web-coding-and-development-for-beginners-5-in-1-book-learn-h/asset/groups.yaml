    \ class=\"class\">\n\n# Tables\n\n- In this section, we will learn to draw tables\
    \ along some attributes which are discussed in Table 1.2.\n\n# Table 1.3: Tags\
    \ and attributes for creating tables\n\n| Tag | Description |\n|---|---|\n| table\
    \ | beginning and end of table |\n| tr | row of table |\n| th | header cell |\n\
    | td | data cell |\n| Attributes | |\n| rowspan | number of rows to merge |\n\
    | colspan | number of columns to merge |\n| border | width of border |\n| cellpadding\
    \ | width of whitespace between two |\n| cellspacing | width of whitespace within\
    \ a border |\n| bgcolor | background color |\n| bordercolor | color of border\
    \ |\n| width | width of table (numeric or %) |\n| height | height of table (numeric)\
    \ |\n| caption | caption for table |\n\n- Some of the attributes of Table 1.3\
    \ are used in below example,\n\n# Listing 1.1: With border and color\n\n```\n\
    <!-- border - color, width and height -->\n<table border=\"1\" bgcolor=\"black\"\
    \ width=\"450\" height=\"100\">\n<caption>Table 1 : Various tags of table</caption>\n\
