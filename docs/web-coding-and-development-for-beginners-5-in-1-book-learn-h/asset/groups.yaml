    \ the form\n\n# Chapter 2\n\n# Cascading Style Sheets (CSS)\n\n# Introduction\n\
    \nCSS is used to enhance the web page. In Section 1.4.2, we saw the attribute\
    \ 'style', which is used for changing the color of the text. Let's rewrite the\
    \ example of 'style' as shown in next section.\n\n# Inline CSS\n\n- Below code\
    \ is an example of 'inline CSS', where the styles are defined inside the individual\
    \ tags.\n\n```\n<!-- css.html -->\n<!DOCTYPE html>\n<html>\n<head>\n  <title>CSS\
    \ Tutorial</title>\n</head>\n<body>\n  <h3 style=\"color:blue\"> Heading 1</h3>\n\
    \  <h3 style=\"color:blue\"> Heading 2</h3>\n  <h3 style=\"color:blue\"> Heading\
    \ 3</h3>\n</body>\n</html>\n```\n\nThe above code, we have three 'headings' with\
    \ font-color 'blue'. Suppose, we want to change the color to red, then we must\
    \ go to individual 'h3' tag and change the color. This is easy in this case, but\
    \ if we have 100 headings in 5 different 'html' files, then this process is not\
    \ very handy. In such cases, CSS can be quite useful as shown in next section.\n\
    \n# Embedded CSS\n\nIn the code, the style is embedded inside the 'style' tag\
    \ as shown in Lines 8-17. Here, we have defined two classes i.h3_blue (Lines 21-23)\
    \ and .h3_red (Lines 26-28). Then, the selectors at Lines 9 and 13 targets the\
    \ class .h3_blue & .h3_red, and change the color to blue and red respectively.\
    \ In this chapter, we will discuss the selectors (e.g. #h3_blue) in more details.\n\
    \n# Note:\n\n- In CSS, the comments are written between /* and */.\n\n# 2.1. Introduction\n\
    \n- CSS has three parts.\n- Selectors e.g. p,h3.h3_blue\n- Properties e.g. color\n\
    - Values of properties e.g. red\n\n```\n<!-- css.html -->\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>CSS Tutorial</title>\n<style type=\"text/css\">\nh3.h3_blue{\n\
