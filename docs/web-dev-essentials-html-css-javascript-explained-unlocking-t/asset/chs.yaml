  \ `list-style-type` 属性对列表项目应用样式，例如无序列表的正方形项目符号。\n\n代码示例：\n```css\nul {\n  list-style-type:\
  \ square;\n}\n```\n\n如何选择 `<div>` 元素内部所有的 `<p>` 元素？\n\n1. `div p`\n2. `div + p`\n\
