  \ 介绍\n\n`async` 关键字用于声明异步函数，该函数返回一个 `Promise`。它允许你像编写同步代码一样编写基于 promise 代码，但不会阻塞执行线程。\n\
  \n示例：\n\n```javascript\nasync function fetchData() {\n  return \"Data fetched\"\
  ;\n}\n\nfetchData().then(data => console.log(data)); // \"Data fetched\"\n```\n\n\
  提示：\n- `async` 函数可以包含零或多个 `await` 表达式。\n- `async` 函数内部的执行会暂停，直到 promise 被解决（resolved）或被拒绝（rejected）。\n\
  \n### 异步请求\n\n关于 JavaScript 中异步请求的一个正确事实是：它们允许程序在等待响应时继续运行，防止对后续代码执行的任何阻塞。\n\n示例：\n\
  \n```javascript\nconsole.log('Before request');\nfetch('https://api.example.com/data')\n\
  \  .then(response => response.json())\n  .then(data => console.log(data));\nconsole.log('After\
  \ request');\n```\n\n提示：\n- 异步请求的常见用例包括从服务器获取数据、文件操作和定时器。\n- JavaScript 使用事件循环（event\
  \ loop）来处理异步代码的执行。\n\n### 函数前使用 async 关键字的主要用途\n\n`async` 关键字的主要用途是简化我们编写 promise\
  \ 的方式。它允许在函数内部使用 `await` 以非阻塞的方式暂停执行，直到 promise 状态确定（settled）。函数执行在 `await` 表达式处暂停，并随着\
  \ promise 解析出的值恢复。\n\n示例：\n\n```javascript\nasync function getUser(userId) {\n \
  \ let response = await fetch(`https://api.example.com/users/${userId}`);\n  let\
  \ data = await response.json();\n  return data;\n}\n\ngetUser(1).then(user => console.log(user));\n\
  ```\n\n提示：\n- 使用 `async` 函数更直观地处理一系列异步操作。\n\n### 如何创建一个 Promise\n\nJavaScript 中的\
  \ `Promise` 是使用 `Promise` 构造函数创建的，它接受一个带有两个参数的执行函数：`resolve` 和 `reject`。\n\n示例：\n\
  \n```javascript\nlet promise = new Promise((resolve, reject) => {\n  setTimeout(()\
  \ => {\n    resolve('Promise resolved');\n  }, 1000);\n});\n\npromise.then(result\
  \ => console.log(result));\n```\n\n提示：\n- 使用 promise 处理如 API 调用、文件读取等异步操作。\n- `Promises`\
  \ 有三种状态：`pending`（等待）、`fulfilled`（已完成）和 `rejected`（已拒绝）。\n\n### 如何捕获异步操作期间抛出的错误\n\
  \n异步操作中的错误可以使用 promise 的 `.catch()` 或 async/await 中的 `try-catch` 块来捕获。\n\n使用 `.catch()`\
  \ 的示例：\n\n```javascript\nfetch('https://api.example.com/data')\n  .then(response\
  \ => response.json())\n  .then(data => console.log(data))\n  catch(error => console.error('Error:',\
  \ error));\n```\n\n使用 `async/await` 的示例：\n\n```javascript\nasync function fetchData()\
  \ {\n  try {\n    let response = await fetch('https://api.example.com/data');\n\
  \    let data = await response.json();\n    console.log(data);\n  } catch (error)\
  \ {\n    console.error('Error:', error);\n  }\n}\n\nfetchData();\n```\n\n提示：\n-\
  \ 在异步操作中始终处理错误至关重要，以防止运行时异常并提高代码的可靠性。\n- 在 `async/await` 中，`try-catch` 为异步错误处理提供了同步的体验。\n\
  \n理解异步编程和 `Promises` 的这些方面对于开发响应且高效的 JavaScript 应用程序至关重要，特别是在 浏览器和 Node.js 等环境中，这些环境中\
  \ I/O 操作通常是非阻塞且异步处理的。\n\n## 事件处理与 DOM 交互\n\n### 事件冒泡\n\n事件冒泡是一种机制，在 DOM 元素上触发的事件会向\
  \ DOM 树向上递。这意味着子元素上的事件会冒泡到它的父元素。\n\n示例：\n\n```html\n<div id=\"parent\">\n  <button\
  \ id=\"child\">Click me</button>\n</div>\n<script>\ndocument.getElementById('parent').addEventListener('click',\
  \ () => {\n  console.log('Parent clicked');\n});\ndocument.getElementById('child').addEventListener('click',\
  \ () => {\n  console.log('Child clicked');\n});\n</script>\n```\n\n当按钮被点击时，由于冒泡，你将看到子元素和父元素的日志。\n\
  \n提示：\n- 冒泡是 DOM 中大多数事件的默认行为。\n- 它允许你实现事件委托。\n\n### 事件委托\n\n事件委托是一种技术，它不是在单个元素上添加事件监听器，而是向父元素添加监听器，并利用事件冒泡来处理子元素上的事件。它对于处理动态添加元素的事件或通过减少事件监听器的数量来优化性能非常有用。\n\
  \n示例：\n\n```html\n<ul id=\"myList\">\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item\
  \ 3</li>\n</ul>\n<script>\ndocument.getElementById('myList').addEventListener('click',\
  \ function(e) {\n  if (e.target.tagName === 'LI') {\n    console.log('List item\
  \ clicked:', e.target.textContent);\n  }\n});\n</script>\n```\n\n这监听 `ul` 元素上的点击，但可以对单个\
  \ `li` 元素的点击做出响应。\n\n提示：\n- 使用 `e.target` 获取触发事件的元素。\n\n### 现代 JavaScript 中用于添加事件监听器的方法\n\
  \n`addEventListener` 方法用于绑定事件监听器。\n\n示例：\n\n```javascript\nelement.addEventListener('click',\
  \ () => {\n  // 执行代码\n});\n```\n\n### 如何停止事件冒泡\n\n`stopPropagation` 方法用于阻止事件继续向上传播。\n\
  \n示例：\n\n```javascript\nbutton.addEventListener('click', (e) => {\n  e.stopPropagation();\
  \ // 阻止事件冒泡\n});\n```\n\n## JavaScript 语法与运算符\n\n### 如何在 JavaScript 文件中注释\n\n在 JavaScript\
  \ 中，你可以使用单行 (`//`) 或多行 (`/* */`) 注释语法。\n\n示例：\n\n```javascript\n// 这是一个单行注释\nlet\
  \ x = 5; // 这是一个行内注释\n\n/* 这是一个\n行注释 */\nlet y = 10;\n```\n\n### 展开运算符的作用\n\n展开运算符\
  \ (`...`) 允许将迭代器（如数组或字符串）展开到期望零或多个参数或元素的地方。常用于数组或对象的复制和合并。\n\n示例：\n\n```javascript\n\
  let arr1 = [1, 2, 3];\nlet arr2 = [...arr1, 4, 5]; // [1, 2, 3, 4, 5]\n```\n\n###\
  \ 如何在 JavaScript 中正确将数字 7.25 舍入为整数\n\n`Math.round()` 方法可以将数字正确舍入为最近的整数。\n\n示例：\n\
  \n```javascript\nconsole.log(Math.round(7.25)); // 7\n```\n\n### !!（双感叹号）运算符的作用\n\
  \n`!!` 运算符用于将值转换为等效布尔表示。\n\n示例：\n\n```javascript\nlet truthyValue = !!1; // true\n\
  let falsyValue = !!0; // false\n```\n\n### || 运算符代表什么\n\n`||` 运算符是逻辑或。如果第一个操作数是真值，则返回第一个操作数的值；否则返回第二个操作数的值。\n\
  \n\n\n\n\n```javascript\nlet result = false || 'default'; // 'default'\n```\n\n\
  `typeof NaN`\n\n`typeof NaN` 返回 `\"number\"`，因为 `NaN`（非数字）是一个特殊的数值。\n\n示例：\n\n```javascript\n\
  console.log(typeof NaN); // \"number\"\n```\n\n`console.log(typeof null)` 的输出结果\n\
  \n它输出 `\"object\"`。这是 JavaScript 中一个广为人知的特性，因为 `null` 实际上并不是对象，而是一个原始值。\n\n### 编写一个\
  \ if 语句\n\n`if` 语句用于根据条件执行代码块。\n\n示例：\n\n```javascript\nlet x = 10;\n\nif (x > 5)\
  \ {\n\nconsole.log('x is greater than 5');\n\n}\n```\n\n引用名为 `script.js` 的外部脚本的正确语法\n\
  \n你可以在 HTML 中通过使用 `<script>` 标签并配合 `src` 属性来引用外部 JavaScript 文件。\n\n示例：\n\n```html\n\
  <script src=\"script.js\"></script>\n```\n\n### `===` 运算符检查的内容\n\n`===` 运算符是一个严格相等比较运算符，它会检查两个操作数的值和类型。\n\
  \n示例：\n\n```javascript\nconsole.log(1 === '1'); // false, 因为类型不同\n```\n\n### 如何停止\
  \ for 循环\n\n可以使用 `break` 语句停止 `for` 循环。\n\n示例：\n\n```javascript\nfor (let i = 0;\
