  \n使用 `let` 或 `const` 来定义块作用。\n\n### JavaScript 包管理器\n\n`npm` 和 `yarn` 是流行的包管理器。\n\
  \n### 对象的深拷贝方法\n\n```javascript\nlet newObj = {...oldObj};\n```\n\n### let 和 const\
