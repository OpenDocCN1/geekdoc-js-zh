  \ 元素内部的 `<p>` 元素。\n\n代码示例：\n```css\ndiv p {\n  color: red;\n}\n```\n\n以下 CSS 代码\
  \ `body { margin: 0; padding: 0; }` 的作用是什么：\n\n1. 移除所有默认的外边距和内边距\n2. 将 `body` 元素的外边距和内边距设置为\
  \ 0\n3. 将 `body` 元素在视口中居中\n4. 移除文档的外边距和内边距\n\n**答案：** 2.`将 body 元素的外边距和内边距设置为 0`\n\
  \n**解释：** 这段 CSS 代码将 `<body>` 元素的外边距和内边距设置为 0，有效地移除了浏览器应用于 `body` 的默认外边距和内边距。\n\n\
  代码示例：\n```css\nbody {\n  margin: 0;\n  padding: 0;\n}\n```\n\n哪一个 CSS 属性控制字体大小？\n\
