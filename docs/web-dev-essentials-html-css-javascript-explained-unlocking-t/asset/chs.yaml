  \ 元素中的 `nowrap` 属性的作用是什么\n\n1. 防止表格单元格中的文本换行\n2. 自动调整单元格宽度以适应内容\n3. 将文本对齐到单元格顶部\n\
  4. 伸展单元格以适应最大的项目\n\n**答案：** 1. 防止表格单元格中的文本换行\n\n**解释：** `<td>`（表格单元格）元素中的 `nowrap`\
  \ 属性防止单元格内的文本换行。\n\n## 哪个 HTML5 元素用于定义文档或章节的头部？\n\n1. `<head>`\n2. `<header>`\n\
  3. `<top>`\n4. `<sectionhead>`\n\n**答案：** 2. `<header>`\n\n**解释：** `<header>` 元素在\
  \ HTML5 中用于定义文档或章节的头部。\n\n## HTML 中使用语义化元素（例如 `<article>`, `<section>`, `<nav>`,\
  \ `<aside>`）的目的是什么，它们如何有利于网络可访问性（accessibility）？\n\n1. 让 HTML 代码看起来更整洁\n2. 增强网站的\
  \ SEO\n3. 为开发者和浏览器更清晰地定义网页的结构\n4. 以上所有\n\n**答案：** 4. 以上所有\n\n**解释：** 语义化 HTML 元素以人类可读和机器可读的方式清晰描述它们的含义。它们通过提供有关内容的更多上下文，帮助网页更具可访问性，特别是对于屏幕阅读器和搜索引擎。它们通过清晰地勾勒网页结构，也有助于更整的代码和更好的\
  \ SEO。\n\n## 哪个 HTML5 属性防止表单在用户填写输入字段之前提交？\n\n1. `placeholder`\n2. `required`\n\
  3. `validate`\n4. `pattern`\n\n**答案：** 2. `required`\n\n**解释：** `required` 属性是一个布尔属性，存在时，指定在提交表单之前必须填写输入字段。它用于客户端验证，以确保字段不会留空。\n\
  \n## HTML5 中 `<canvas>` 元素的主要用途是什么？\n\n1. 显示数据库记录\n2. 通过脚本在网页上绘制图形\n3. 创建可拖拽元素\n\
  4. 嵌入视频文件\n\n**答案：** 2. 通过脚本在网页上绘制图形\n\n**解释：** `<canvas>` 元素用于通过 `JavaScript` 帮助在网页上绘制图形。它为\
  \ 2D 形状和图像提供了绘制表面，但也可以用于游戏或图表绘制等视觉输出。\n\n## HTML 中哪个全局属性用于为元素指定唯一标识符？\n\n1. `class`\n\
  2. `id`\n3. `style`\n4. `title`\n\n**答案：** 2. `id`\n\n**解释：** `id` 属性用于为 HTML 元素分配唯一标识符。它是全局的，因为它可以应用于任何元素，而不仅仅是特定类型。`id`\
  \ 属性的值在 HTML 文档中必须是唯一的，以便出于样式设置、脚本或链接目的正确识别元素。\n\n## 将声学文件嵌入网页的正确 HTML 元素是什么？\n\n\
  1. `<sound>`\n2. `<audio>`\n3. `<source>`\n4. `<music>`\n\n**答案：** 2. `<audio>`\n\
  \n**解释：** `<audio>` 元素用于在 HTML 文档中嵌入音频内容。它允许不需要外部插件的情况下播放音频文件。\n\n# CSS 简介：技巧与基础\n\
  \n## CSS 简介\n级联样式表（CSS）与 HTML 和 JavaScript 一样，是万维网的基石技术。\n\n## CSS 简介\nCSS 与 HTML\
  \ 和 JavaScript 一样，是万维网的基石技术。旨在实现呈现与内容的分离。\n\n## CSS 语法\nCSS 由规则集组成。\n\n## HTML 标签定义内部样式表\n\
  在`<head>` 部分使用 `<style>` 标签。```html\n<head>\n  <style>\n    body {\n      background-color:\
  \ lightblue;\n    }\n  </style>\n</head>\n```\n提示：内部样式表适用于单页样式。对于较大的项目，建议使用外部 CSS\
  \ 文件。\n\n## CSS 中选择 ID 为 \"demo\" 的元素\n使用 `#` 后接 ID。```css\n#demo {\n  color: blue;\n\
  }\n```\n提示：ID 是元素唯一的，`id=\"demo\"` 选择特定的元素。\n\n## 选择类名为 \"example\" 的元素\n使用 `.`\
  \ 后接类名。```css\n.example {\n  font-size: 20px;\n}\n```\n提示：类选择器用于选择并设置具有该类属性的元素。\n\
  \n## 文本中的每个单词大写\n使用 `text-transform: capitalize`。```css\np {\n  text-transform:\
  \ capitalize;\n}\n```\n提示：该属性会将所选元素中每个单词的首字母大写。\n\n## 更改背景颜色\n使用 `background-color`\
  \ 属性。```css\nbody {\n  background-color: lightgray;\n}\n```\n提示：你可以使用颜色名称、RGB、RGBA、HEX\
  \ 等作为此属性的值。\n\n## 更改元素的字体\n使用 `font-family` 属性。```css\np {\n  font-family: Arial,\
  \ sans-serif;\n}\n```\n提示：始终提供一个备用字体（如 `sans-serif` 或 `serif`），以防首选字体可用。\n\n## 带有方形项目的列表\n\
  在 `ul` 或 `li` 元素上使用 `list-style-type` 属性。```css\nul {\n  list-style-type: square;\n\
  }\n```\n提示：这用于列表符号。其他值包括 `circle`、`disc`、`none` 等。\n\n## 选择 <div> 内的所有 <p> 元素\n\
  使用后代选择器（空格）选择嵌套元素。```css\ndiv p {\n  color: red;\n}\n```\n提示：这选择任何 `<div>` 元素内部的所有\
  \ `<p>` 元素。\n\n## 大小的 CSS 属性\n属性：`font-size`\n```css\np {\n  font-size: 16px;\n\
  }\n```\n提示：你可以使用不同的单位如 `px`、`em`、`rem` 或 `%` 来设置大小。\n\n\n\n\n\n# 显示不带下线的链接\n\n属性：`text-decoration`\n\
  \n```css\na {\n  text-decoration: none;\n}\n```\n提示：此属性也用于添加下划线、上划线或删除线等装饰。\n\n\
  # 更改元素的左边距\n\n属性：`margin-left`\n\n```css\ndiv {\n  margin-left: 20px;\n}\n```\n\
  提示：你也可以使用 `margin` 简写来设置所有侧向的边距。\n\n# 使文本加粗\n\n属性：`font-weight`\n\n```css\nstrong\
  \ {\n  font-weight: bold;\n}\n```\n提示：除了加粗，你还可以使用数值（如 `700`）作为权重。\n\n# 设置单词之间的间距\n\
  \n属性：`word-spacing`\n\n```css\np {\n  word-spacing: 5px;\n}\n```\n提示：调整该值可以增加或减少单词之间的空间。\n\
  \n# 修改字体名称\n\n属性：`font-family`\n\n```css\nbody {\n  font-family: 'Arial', sans-serif;\n\
  }\n```\n提示：始终提供一个备用字体。如果字体名称包含空格，请使用引号。\n\n# 为框框的所有侧显示边框\n\n属性：`border`\n\n```css\n\
  div {\n  border: 2px solid black;\n}\n```\n提示：`border` 简写设置了边框的宽度、样式和颜色。\n\n# 更改元素的字体颜色\n\
  \n属性：`color`\n\n```css\nh1 {\n  color: blue;\n}\n```\n提示：`color` 可以使用名称、`HEX`、`RGB`\
  \ 或 `HSL` 值来指定。\n\n# Position 属性的默认值\n\n默认值：`static`\n\n在 `static` 定位中，元素根据文档的普通流进行定位。\n\
  \n# 在 CSS 中创建圆形\n\n```css\n.circle {\n  width: 100px;\n  height: 100px;\n  background-color:\
  \ red;\n  border-radius: 50%;\n}\n```\n提示：`border-radius: 50%` 将正方形转换为圆形。确保 `height`\
  \ 和 `width` 相等。\n\n# 为具有两个特定类的组件应用 CSS 样式\n\n语法：使用点 `.` 连接类名且不留任何空格。\n\n```css\n\
  .classOne.classTwo {\n  color: green;\n}\n```\n示例 HTML：`<div class=\"classOne classTwo\"\
  >Text</div>`\n提示：此规则将仅适用于同时具有 `classOne` 和 `classTwo` 的元素。\n\n## CSS 选择器与特殊性：示例指南\n\
  \n# 设置元素的背景图像\n\n属性：`background-image`\n\n```css\ndiv {\n  background-image: url('image.jpg');\n\
  }\n```\n提示：`URL` 应该指向你想要设置为背景的图像。可以是相对路径或绝对路径。\n\n# 将列表项设置为内联显示\n\n属性：`display`\n\
  \n```css\nli {\n  display: inline;\n}\n```\n提示：这会让列表项以行形式显示，而不是默认的垂直堆叠。\n\n# 控制\
  \ `<fieldset>` 元素的布局和格式\n\n属性：使用了如 `width`、`margin`、`padding`、`border` 等通用布局属性。\n\
  \n```css\nfieldset {\n  border: 2px solid gray;\n  padding: 10px;\n  width: 50%;\n\
  }\n```\n提示：使用这些标准 CSS 属性自定义你的 `<fieldset>` 元素，以适应表单布局。\n\n# 使用 CSS 创建圆角\n\n属性：`border-radius`\n\
  \n```css\ndiv {\n  border-radius: 10px;\n}\n```\n提示：`border-radius` 属性可以接受像素值或百分比来创建圆形或椭圆形。\n\
  \n# 选择带有 <div> 父元素的所有 `<p>` 元素\n\n选择器：后代选择器（空格）\n\n```css\ndiv p {\n  color: blue;\n\
  }\n```\n提示：此选择器针对 `<div>` 元素内部所有的 `<p>` 元素。\n\n# 为元素添加阴影\n\n属性：`box-shadow`\n\n\
  ```css\ndiv {\n  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);\n}\n```\n提示：`box-shadow`\
  \ 属性接受水平偏移、垂直偏移、模糊和颜色的值。\n\n# CSS 中 `h1 + p` 的含义\n\n表示：相邻兄弟选择器。它选择紧接在 `<h1>` 之后的\
  \ `<p>` 元素。\n\n```css\nh1 + p {\n  font-weight: bold;\n}\n```\n提示：当你想要对跟随另一个特定元素的元素设置样式时，这非常有用。\n\
  \n# 设置表格单元之间的间距\n\n属性：`border-spacing`\n\n```css\ntable {\n  border-spacing: 5px;\n\
  }\n```\n提示：此属性设置相邻单元格边框之间的距离。\n\n# 设置元素的透明度\n\n属性：`opacity`\n\n```css\ndiv {\n \
  \ opacity: 0.5; /* 50% 透明度 */\n}\n```\n提示：`opacity` 的范围从 `0`（完全透明）到 `1`（完全不透明）。\n\
  \n# `z-index` 属性的作用\n\n功能：控制元素的堆叠顺序。\n\n```css\ndiv {\n  position: relative;\n \
  \ z-index: 10;\n}\n```\n提示：`z-index` 较高的元素会覆盖值较低的元素。它适用于 `position` 值不为 `static`\
  \ 的元素。\n\n## CSS 中的布局与定位\n\n# CSS `Display` 属性的功能\n\n目的：`display` 属性指定元素的显示方式。\n\
  \n```css\ndiv {\n  display: none; /* 隐藏元素 */\n}\n\nspan {\n  display: block; /*\
  \ 让内联元素表现得像块级元素 */\n}\n```\n提示：常见值包括 `block`、`inline-block`、`none` 以及最近的 `flex`\
  \ 和 `grid`。\n\n# 选择 <div> 的所有子 `<p>` 元素\n\n选择器：子选择器（`>`）\n\n```css\ndiv > p {\n\
  \  color: blue;\n}\n```\n提示：此选择器仅针对 `<div>` 的直接子 `<p>` 元素。\n\n# CSS 单位\n\n无效单位：`pt`\
  \ 是单位。\n有效单位：`px`、`em`、`rem`、`%`、`vh`、`vw` 等。\n\n# CSS 中 `Overflow` 属性的作用\n\n功能：控制超出容器边界的内容。\n\
  \n```css\ndiv {\n  overflow: hidden; /* 隐藏超出 div 框的内容 */\n}\n```\n提示：其他值还包括 `scroll`、`auto`\
  \ 和 `visible`。\n\n# `visibility` 和 `display` 的区别\n\n`visibility: hidden` 使元素不可见，但在布局中仍占据空间。\n\
  `display: none` 将元素从文档流中移除且不占用空间。\n\n```css\nhidden {\n  visibility: hidden;\n}\n\
  \ngone {\n  display: none;\n}\n```\n提示：使用 `display: none` 完全移除元素，使用 `visibility:\
  \ hidden` 留留空间。\n\n# 悬停时更改光标类型\n\n属性：`cursor`\n\n```css\nbutton:hover {\n  cursor:\
  \ pointer; /* 悬停在按钮上时将光标变为手型 */\n}\n```\n提示：`cursor` 可以设置为 `default`、`pointer`、`crosshair`\
  \ 等各种值。\n\n# 在 CSS 中 `:nth-child()` 伪类\n\n目的：选择父元素的第 n 个孩子。\n\n```css\np:nth-child(2)\
  \ {\n  color: blue; /* 选择第二个 <p> 元素 */\n}\n```\n提示：可以使用如 `:nth-child(2n+1)` 的公式进行复杂选择。\n\
  \n# CSS 中的默认定位值\n\n默认值：`static`\n\n在 `static` 定位中，元素根据文档的普通流进行定位。\n\n# CSS 文件中的注释\n\
  \n语法：使用 `/* 注 */`。\n\n```css\n/* 这是一个注释 */\nbody {\n  background-color: white;\n\
  }\n```\n提示：使用注释解释 CSS 代码，使其更容易理解和维护。\n\n## CSS 盒模型、边框与布局\n\n# 创建元素周围的空间（外边距）\n\n\
  属性：`margin`\n\n```css\ndiv {\n  margin: 10px; /* 在 div 周围创建 10px 空间 */\n}\n```\n\
  提示：`margin` 可以单独设置每个侧（例如 `margin-top`、`margin-right` 等）或使用简写。\n\n# CSS Flex 布局中的\
  \ `Flex` 属性\n\n功能：在弹性容器中，`flex` 属性指定弹性 项目如何增长或缩小。\n\n```css\n.flex-item {\n  flex:\
  \ 1; /* Flex 项目将增长以填充空间 */\n}\n```\n提示：`flex` 是 `flex-grow`、`flex-shrink` 和 `flex-basis`\
  \ 的简写。\n\n# CSS 中 `Clear` 属性的作用\n\n功能：防止浮动元素影响所应用的元素。\n\n```css\ndiv {\n  clear:\
  \ both; /* 左右浮动元素都不会影响此 div */\n}\n```\n提示：通常用于涉及浮动元素的布局，确保间距一致。\n\n# 控制 CSS 换行\n\
  \n属性：`white-space`\n\n```css\np {\n  white-space: nowrap; /* 防止文本换行 */\n}\n```\n\
  提示：其他值包括 `normal`、`pre`、`pre-wrap` 和 `pre-line`。\n\n# 创建数字列表\n\nHTML 元素：`<ol>`（有序列表）\n\
  \n```html\n<ol>\n  <li>第一项</li>\n  <li>第二项</li>\n</ol>\n```\n提示：`<ol>` 自动创建数字列表，每个项目使用\
  \ `<li>`。\n\n# 使内容远离边框的空间（内边距）\n\n属性：`padding`\n\n```css\ndiv {\n  padding: 15px;\
  \ /* 在内容与 div 边框之间添加空间 */\n}\n```\n提示：`padding` 增加元素内部空间，而边距则创建外部空间。\n\n# 大多数元素的默认显示值：\n\
  \n\n\n\n\n默认值：对于 `<div>`、`<p>` 等元素为 block，对于 `<span>`、`<a>` 等元素为 inline。\n\n## `:after`\
  \ 伪元素的功能\n\n用途：在所选元素的内容插入内容。\n\n```css\np:after {\n  content: ' *'; /* 在每个段落后添加星号\
  \ */\n}\n```\n\n提示：通常用于装饰性元素或附加内容。\n\n## 选择父元素不是 <div> 的所有 <p> 元素\n\n选择器：`:not()`\
  \ 和直接子组合器 (`>`)\n\n```css\n:not(div) > p {\n  color: red; /* 为不是 <div> 直接子 <p> 元素设置样式\
  \ */\n}\n```\n\n提示：此选择器在排除特定的父子关系时非常通用。\n\n## 修改底部边框样式\n\n属性：`border-bottom`\n\n\
  ```css\ndiv {\n  border-bottom: 2px solid blue; /* 为 div 设置蓝色底部边框 */\n}\n```\n\n\
  提示：`border-top`、`border-left` 和 `border-right` 也有类似的属性。\n\n## CSS 中 `position: relative;`\
  \ 的效果\n\n功能：此属性将元素的位置相对于其正常位置设置。\n\n```css\ndiv {\n  position: relative;\n  top:\
  \ 10px; /* 将 div 从其原始位置向下移动 10px */\n}\n```\n\n提示：与绝对定位不同，相对定位不会将元素从正常的文档流中移除。\n\
  \n## CSS 中的变换与动画：核心技术与示例\n\n### 鼠标悬停时更改元素的颜色\n\n属性：`:hover` 伪类\n\n```css\nbutton:hover\
  \ {\n  color: red; /* 当鼠标悬停在按钮上时，将文本颜色改为红色 */\n}\n```\n\n提示：`:hover` 伪类可以应用于几乎任何元素，不仅仅是链接。\n\
  \n### 创建阴影效果\n\n属性：`box-shadow`\n\n```css\ndiv {\n  box-shadow: 5px 5px 10px grey;\
  \ /* 为 div 添加灰色阴影 */\n}\n```\n\n提示：`box-shadow` 可以接受多个值以创建复杂的阴影效果。\n\n### 控制字母间距\n\
  \n属性：`letter-spacing`\n\n```css\np {\n  letter-spacing: 2px; /* 增加字母之间的间距 */\n}\n\
  ```\n\n提示：允许负值来缩小字母之间的间距。\n\n### 更改 Flex 项目的顺序\n\n属性：Flexbox 中的 `order`\n\n```css\n\
  flex-item {\n  order: 2; /* 更改此 flex 项目的顺序 */\n}\n```\n\n提示：flex 容器中的项目可以在不改变 HTML\
  \ 结构的情况下重新排序。\n\n### 文本水平居中对齐\n\n属性：`text-align`\n\n```css\np {\n  text-align: center;\
  \ /* 使段落内的文本水平居中 */\n}\n```\n\n提示：`text-align: center;` 是文本对齐中常用的常用的属性之一。\n\n###\
  \ 为元素添加边框\n\n属性：`border`\n\n```css\ndiv {\n  border: 1px solid black; /* 添加黑色实边框\
  \ */\n}\n```\n\n提示：`border` 属性是 `border-width`、`border-style` 和 `border-color` 的简写。\n\
  \n### 使字体变为斜体\n\n属性：`font-style`\n\n```css\np {\n  font-style: italic; /* 使段落文本变为斜体\
  \ */\n}\n```\n\n提示：`font-style` 的其他值包括 `normal` 和 `oblique`。\n\n### 使用特定半径创建圆角\n\
  \n属性：`border-radius`\n\n```css\ndiv {\n  border-radius: 10px; /* 将 div 的角圆化 */\n\
  }\n```\n\n提示：你可以为每个角指定不同的半径（例如，`border-radius: 10px 5px 15px 20px;` 分别对应左上、右上、右下和左下角）。\n\
  \n### 使文本加粗\n\n属性：`font-weight`\n\n```css\nstrong {\n  font-weight: bold; /* 使 <strong>\
  \ 内部的文本加粗 */\n}\n```\n\n提示：除了加粗，你还可以为权重指定数值（例如 700）。\n\n## CSS 中的间距与对齐：示例\n\n###\
  \ 指定文本行之间的间距\n\n属性：`line-height`\n\n```css\np {\n  line-height: 1.5; /* 将行间距正常行高的的\
  \ 1.5 倍 */\n}\n```\n\n提示：`line-height` 可以提高可读性，特别是对于大段文本。\n\n### 为文本元素的第一个字母应用样式\n\
  \n伪元素：`::first-letter`\n\n```css\np::first-letter {\n  font-size: 200%;\n  color:\
  \ blue;\n}\n```\n\n提示：这通常用于创建首字母大字或美化段落的第一个字母。\n\n### 将文本转换为大写字母\n\n属性：`text-transform:\
  \ uppercase;`\n\n```css\np {\n  text-transform: uppercase; /* 将段落中的所有文本转换为大写字母 */\n\
  }\n```\n\n提示：`text-transform` 的其他值包括 `lowercase`、`capitalize` 和 `none`。\n\n### `rgba()`\
  \ 颜色格式的用途\n\n功能：允许指定带有 alpha 通道（透明度级别）的颜色。\n\n```css\ndiv {\n  background-color:\
  \ rgba(255, 0, 0, 0.5); /* 半透明红色 */\n}\n```\n\n提示：用于设置透明度。\n\n### 设置元素之间的间距\n\n\
  属性：`border-width`\n\n```css\ndiv {\n  border-width: 5px;\n}\n```\n\n提示：用于设置边框。\n\
  \n### 鼠标悬停时更改背景颜色\n\n属性：`:hover` 伪类\n\n```css\nbutton:hover {\n  background-color:\
  \ lightblue;\n}\n```\n\n提示：用于设置背景颜色。\n\n### 为每第二个元素应用样式\n\n伪类：`:nth-child()`\n\n\
  ```css\nli:nth-child(2n) {\n  color: blue;\n}\n```\n\n提示：`nth-child(2n)` 选择每第二个元素。\n\
  \n### CSS Grid 中的列顺序\n\n属性：`order`\n\n```css\ngrid-item {\n  order: 2;\n}\n```\n\
  \n提示：用于控制布局。\n\n### `display: inline-block;` 属性\n\n功能：允许元素像内联元素一样流动。\n\n```css\n\
  span {\n  display: inline-block;\n  width: 50px;\n  height: 50px;\n}\n```\n\n提示：用于并排对元素，同时可以设置宽高度。\n\
  \n### 选择特定元素的第一个子元素\n\n伪类：`:first-child`\n\n```css\np:first-child {\n  font-weight:\
  \ bold;\n}\n```\n\n提示：此选择器定位其父元素中的第一个元素。\n\n### `text-align: center;` 的用途\n\n功能：将元素的内联内容水平居中。\n\
  \n```css\ndiv {\n  text-align: center;\n}\n```\n\n提示：常用于块级元素内居中文本或内联元素。\n\n### 由\
  \ `background-repeat` 控制\n\n功能：决定背景图像如何重复。\n\n```css\nbody {\n  background-image:\
  \ url('image.jpg');\n  background-repeat: no-repeat; /* 图片将不重复 */\n}\n```\n\n提示：其他值包括\
  \ `repeat`、`repeat-x`、`repeat-y`。\n\n### 控制 CSS Grid 中列之间的间距\n\n属性：`grid-column-gap`\
  \ 或新规范中的 `column-gap`\n\n```css\ngrid-container {\n  display: grid;\n  column-gap:\
  \ 20px; /* 设置列之间的间隙 */\n}\n```\n\n\n\n\n\nTip：`column-gap` 是现代 `Grid Layout` 规范的一部分，提供了一种设置间隙的标准方法。\n\
  \n## 在 Flexbox 中控制元素的顺序\n\n属性：flex 项目（flex item）中的 `order`。\n\n```css\nflex-item\
  \ {\n  order: 1; /* 此项目将首先被定位 */\n}\n```\n\nTip：这在响应式布局中特别有用，`order` 可能会根据屏幕尺寸发生变化。\n\
  \n## 具有特定属性的 CSS 类元素\n\n属性选择器：\n\n```css\ninput[type=\"text\"] {\n  border-color:\
  \ blue; /* 为所有文本类型的输入元素应用样式 */\n}\n```\n\nTip：此选择器根据属性定位目标元素，提供了一种条件应用样式的强大方法。\n\
  \n## CSS 中的样式与效果\n\n### Flexbox 布局中的 flex-direction\n\n功能：确定 flex 容器内 flex 项目的方向。\n\
  \n```css\nflex-container {\n  display: flex;\n  flex-direction: column; /* 将 flex\
  \ 项目垂直堆叠 */\n}\n```\n\nTip：其他值还包括 `row`、`row-reverse` 和 `column-reverse`。\n\n###\
  \ white-space: nowrap; 的目的\n\n功能：防止文本换到新行。\n\n```css\np {\n  white-space: nowrap;\
  \ /* 保持文本在单行 */\n}\n```\n\nTip：适用于不希望文本换行的情况，例如导航菜单中。\n\n### 在父元素悬停时应用样式\n\n```css\n\
  div:hover p {\n  color: red; /* 当其父元素 <div> 被悬停时为 <p> 设置样式 */\n}\n```\n\nTip：这是为父子关系创建交互悬停效果的常用技术。\n\
  \n## 字符间的间距\n\n属性：`letter-spacing`\n\n```css\np {\n  letter-spacing: 2px; /* 增加字符之间的空间\
  \ */\n}\n```\n\nTip：可以使用负值来紧凑字符间距。\n\n## 垂直文本对齐\n\n虽然 CSS 没有提供直接垂直对齐文本的方法，但一种常用技术是使用\
  \ `display: flex` 和 `align-items`。\n\n```css\ndiv {\n  display: flex;\n  align-items:\
  \ center; /* 在 div 中垂直居中文本 */\n  height: 100px;\n}\n```\n\nTip：Flexbox 是用于水平和垂直对齐的多功能工具。\n\
  \n### 选择特定元素类型的最后一个子元素\n\n伪类：`:last-child`\n\n```css\np:last-child {\n  font-weight:\
  \ bold; /* 为其父元素中的最后一个 <p> 元素设置样式 */\n}\n```\n\nTip：定位父元素内指定元素的最后一次出现。\n\n### cursor:\
  \ pointer; 属性\n\n功能：将光标更改为指针，表示这是一个可点击元素。\n\n```css\nbutton {\n  cursor: pointer;\n\
  }\n```\n\nTip：通常用于按钮、链接或其他交互元素。\n\n### text-overflow: ellipsis; 的目的\n\n功能：当文本溢出容器时截断并显示省略号\
  \ (...)。\n\n```css\ndiv {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow:\
  \ ellipsis;\n}\n```\n\nTip：确保 `overflow` 设置为 `hidden` 且 `white-space` 设置为 `nowrap`，此功能才能生效。\n\
  \n## 指定元素边框的样式\n\n属性：`border-style`\n\n```css\ndiv {\n  border-style: dashed; /*\
  \ 设置虚线边框 */\n}\n```\n\nTip：值包括 `solid`、`dotted`、`dashed`、`double`、`none` 等。\n\n\
  ### font-family 属性\n\n功能：指定元素中文本使用的字体。\n\n```css\nbody {\n  font-family: \"Arial\"\
  , sans-serif;\n}\n```\n\nTip：始终提供备用字体选项。\n\n### 控制透明度\n\n属性：`opacity`\n\n```css\n\
  div {\n  opacity: 0.5; /* 50% 透明 */\n}\n```\n\nTip：`opacity` 的值范围从 `0`（完全透明）到 `1`（完全不透明）。\n\
  \n### 选择具有特定类的元素\n\n```css\nexample {\n  color: blue; /* 选择所有类为 'example' 的元素 */\n\
  }\n```\n\nTip：类选择器是 CSS 样式的骨干，因其通用性而被广泛使用。\n\n### box-sizing: border-box; 属性\n\n\
  功能：元素的尺寸包含内边距和边框。\n\n```css\ndiv {\n  box-sizing: border-box;\n}\n```\n\nTip：使得\
  \ `width` 和 `height` 样式更具可预测性，特别是在添加内边距或边框时。\n\n### 选择特定区域内的链接\n\n```css\n#sectionId\
  \ a {\n  color: green; /* 为 id 为 'sectionId' 的元素内的所有 <a> 元素设置样式 */\n}\n```\n\nTip：将\
  \ `#sectionId` 替换为目标区域的实际 ID。\n\n## 在元素边框后创建投影\n\n属性：`box-shadow`\n\n```css\ndiv\
  \ {\n  box-shadow: 10px 10px 5px grey; /* 为 div 添加投影 */\n}\n```\n\nTip：使用 `box-shadow`\
  \ 为元素添加深度，增强用户界面。\n\n### 选择特定类型的最后一个元素\n\n伪类：`:last-of-type`\n\n```css\np:last-of-type\
  \ {\n  color: red; /* 为其父元素内的最后一个 <p> 元素设置样式 */\n}\n```\n\nTip：这与 `:last-child`\
  \ 相似，但特定于元素类型。\n\n## 创建旋转动画\n\n属性：带有 `@keyframes` 的 CSS 动画\n\n```css\n@keyframes\
  \ rotate {\n  from { transform: rotate(0deg); }\n  to { transform: rotate(360deg);\
  \ }\n}\n\n.box {\n  animation: rotate 2s infinite linear;\n}\n```\n\nTip：CSS 动画允许复杂的变换。\n\
  \n### text-decoration: none; 属性\n\n功能：移除文本的下划线。\n\n```css\na {\n  text-decoration:\
  \ none;\n}\n```\n\nTip：通常用于移除链接的装饰。\n\n## 选择特定类型的第一个元素\n\n伪类：`:first-child`\n\n\
  ```css\np:first-child {\n  font-size: 20px; /* 为其父元素中的第一个 <p> 设置样式 */\n}\n```\n\n\
  Tip：定位指定类型的第一个实例。\n\n## 控制文本行间距\n\n属性：`line-height`\n\n```css\np {\n  line-height:\
  \ 1.5;\n}\n```\n\nTip：行高可以提高可读性，特别在大块文本中。\n\n## CSS 简介问题\n\n掌握了 HTML 后，下一步是深入通过\
  \ CSS（级联样式表）进行样式艺术。\n\n### 关于 CSS 的问题\n\nCSS 代表什么？\n\n1. Computer Style Sheets\n\
  2. Creative Style Sheets\n3. Cascading Style Sheets\n4. Colorful Style Sheets\n\n\
  答案：3. Cascading Style Sheets\n\n解释：CSS 代表 Cascading Style Sheets。它用于样式网页——例如更改字体、颜色、大小和布局。\n\
  \n哪个 HTML 标签用于定义内部样式表？\n\n1. `<style>`\n2. `<css>`\n3. `<script>`\n4. `<link>`\n\
  \n答案：1. `<style>`\n\n解释：`<style>` 标签用于为文档定义样式。位于文档的 head 部分。\n\n```html\n<head>\n\
  <style>\n  body { background-color: lightblue; }\n</style>\n</head>\n```\n\n在 CSS\
  \ 中如何选择 id 为 \"demo\" 的元素？\n\n1. `*demo`\n2. `#demo`\n3. `demo`\n4. `demo`\n\n答案：2.\
  \ `#demo`\n\n解释：在 CSS 中，哈号符号 (#) 用于选择特定的 id。\n\n```css\n#demo {\n  color: blue;\n\
  }\n```\n\n如何选择类名为 \"example\" 的元素？\n\n1. `*example`\n2. `#example`\n3. `.example`\n\
  4. `example`\n\n答案：3. `.example`\n\n解释：在 CSS 中，点 (.) 用于选择特定的类。\n\n```css\nexample\
  \ {\n  font-size: 20px;\n}\n```\n\n如何让文本中的每个单词首字母都大写？\n\n1. `text-transform: capitalize;`\n\
  2. `text-transform: uppercase;`\n3. `text-transform: lowercase;`\n4. `text-decoration:\
  \ capitalize;`\n\n答案：1. `text-transform: capitalize;`\n\n解释：`text-transform: capitalize;`\
  \ CSS 属性会将元素文本中每个单词的首字母大写。\n\n```css\np {\n  text-transform: capitalize;\n}\n```\n\
  \n哪个属性用于更改背景颜色？\n\n1. `color`\n2. `bgcolor`\n\n\n\n\n\n### 3. `background-color`\n\
  ### 4. `background`\n\n**答案:** 3.`background-color`\n\n**解释：** CSS 中的 `background-color`\
  \ 属性用于定义元素的背景颜色。\n\n代码示例：\n```css\nbody {\n  background-color: lightblue;\n}\n```\n\
  \n哪一个属性用于更改元素的字体？\n\n1. `font-weight`\n2. `font-style`\n3. `text-style`\n4. `font-family`\n\
  \n**答案：** 4.`font-family`\n\n**解释：** `font-family` 属性指定元素的字体。\n\n代码示例：\n```css\n\
  p {\n  font-family: \"Arial\", sans-serif;\n}\n```\n\n如何创建一个以正方形显示项目项目的列表？\n\n1.\
  \ `list-type: square;`\n2. `list-style-type: square;`\n3. `list-style: square;`\n\
