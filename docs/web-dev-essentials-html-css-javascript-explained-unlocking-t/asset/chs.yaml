  \ Flexbox 布局中的 `flex-direction` 属性控制主轴的方向，这会影响弹性项目在容器内的布局方式。\n\n**代码示例：**\n```\n\
  container {\n  flex-direction: column; /* 设置主轴为垂直 */\n}\n```\n\n## 9. CSS 属性 `white-space:\
