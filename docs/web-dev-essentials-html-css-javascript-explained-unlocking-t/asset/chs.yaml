  \n**解释：** `display: none;` 不仅隐藏元素，还会将其从布局中移除。这意味着该元素不会在页面上占据任何空间。\n\n### 如何选择 `div`\
  \ 下所有为 `<p>` 的子元素？\n1. `div + p`\n2. `div p`\n3. `div > p`\n4. `p < div`\n\n**答案：**\
