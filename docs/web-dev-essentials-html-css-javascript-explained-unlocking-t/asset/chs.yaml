  }\n```\n\n### 用于测试对象中是否存在特定属性的运算符\n\n`in` 运算符检查一个属性是否存在于对象中。\n\n示例：\n\n```javascript\n\
  let obj = { key: 'value' };\n\nconsole.log('key' in obj); // true\n```\n\n### `\"\
  1\" + 2 + 3` 的结果\n\n结果是 `\"123\"`。由于第一个操作数是字符串，JavaScript 会执行字符串拼接。\n\n### JavaScript\
  \ 的 null 值\n\nJavaScript 中的 `null` 表示有意地缺失任何对象值。它通常用于表示 `'nothing'`、`'empty'` 或\
  \ `'value unknown'`（值值未知）。\n\n理解这些 JavaScript 语法和运算符是有效编码的基础，因为它们是编写任何 JavaScript\
  \ 脚本的构建组件。记住，正确使用这些元素会极大影响你代码的可读性、效率和功能。\n\n## 高级概念与杂项\n\n### JavaScript 中的真值 (truthy\
  \ value)\n\n真值是在布尔上下求值时转换为 `true` 的值。除了 `false`、`0`、`-0`、`0n`、`\"\"`、`null`、`undefined`\
  \ 和 `NaN`（这些是假值），所有其他值都是真值。\n\n### 在 JavaScript 中定义一个返回输入平方的箭头函数\n\n```javascript\n\
  const square = x => x * x;\n```\n\n### 定义常量\n\n使用 `const` 关键字定义常量。常量的值不能通过重新赋值更改。\n\
