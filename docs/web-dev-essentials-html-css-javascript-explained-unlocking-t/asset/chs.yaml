- "# Web 开发核心要素：HTML CSS JavaScript 详解：解锁 Web 开发秘籍：关于 HTML CSS JavaScript 的500 多个问题解答\n\
  \n\n\n![](img/image_rsrc6H8.jpg)\n\n\n\n非常适合经验丰富的用户和初学者\n\n\n\n献给\nAlexis 和 Sebastian\
  \ Svekis\n\n感谢你的支持\n\n# 引言\n\n## 本书的学习方法及预期\n\n在《Web 开发核心：HTML、CSS 和 JavaScript\
  \ 深度解析》中概述的这种通过问答格式进行 Web 开发教学的方法提供了一种独特且有效的学习途径。这种方法具有多优势，使其成为掌握 Web 开发复杂性的的一种高效且集中的方式。以下是这种方法的益处所在：\n\
  \n### 直接解决常见问题和好奇点\n\n通过关注问题，这种教学方法直接针对学习者面临的常见查询和挑战。这确保了内容具有高度相关性，并针对学生遇到的实际需求和困惑量身定制，而不是涵盖那些可能没有直接实际应用的理论方面。它帮助学习者看到概念在现实场景中的直接应用和意义。\n\
  \n### 鼓励主动学习\n\n问答格式激发了对材料的积极参与，因为鼓励学习者在阅读答案之前先思考并解决问题。这种主动参与增强了记忆和理解，与被动阅读文本相比形成对比。它镜像了开发人员在实际项目中面临的故障排除和解决问题的过程，为学习者应对实际挑战做好准备。\n\
  \n### 聚焦核心信息\n\n这种教学方法自然地过滤内容，重点集中在 HTML、CSS 和 JavaScript 中最重要和经常遇到的方面。通过优先考虑针对关键概念和常见障碍的问题，它确保了学习者能够高效地利用时间，掌握本质，而不会陷入相关性较低的细节中。\n\
  \n### 便于快速查阅和复\n\n结构化的格式使学习者能够快速找到特定问题的答案，或根据需要复习主题。这对于强化学习特别有用，对于需要刷新某些方面知识的经验丰富的开发人员也是如此。它作为一份实用的参考指南，可以在初始学习结束后很长时间内继续使用。\n\
  \n### 适应不同的学习节奏和风格\n\n由于每个问题和答案都构成了一个自包含的信息单元，学习者可以按照自己的进度进行，专注于需要更多帮助的领域，并跳过或快速复习已经理解的主题。这种灵活性适应了各种学习风格和节奏，使得这本书适用于广泛的学生群体。\n\
  \n### 提供实用示例和真实世界应用\n\n答案中包含实用代码示例和真实世界应用有助于弥补理论与实践之间的差距。通过观察概念如何应用于实际编码场景中，学习者可以更好地理解他们所学知识的相关性和实现方式，增强他们在项目中应用知识的能力。\n\
  \n总而言之，本书采用的问答教学方法提供了一种直接、聚焦且引人入胜的 Web 开发学习方式。它确保学习者能够有效利用时间，专注于真正重要的事情，并赋予他们适用于真实世界开发任务的实用技能和知识。\n\
  \n# HTML 基础入门\n\n## HTML 基础概念与定义\n\n### HTML 是什么缩写？\n\nHTML 代表超文本标记语言（HyperText\
  \ Markup Language）。它是用于创建网页和 Web 应用程序的标准标记语言。\n\n* `HyperText`（超文本）：连接不同网页的链接，可以在单个网站内部，也可以在不同网站之间。\n\
  * `Markup Language`（标记语言）：一种文档编码方式，它除了文本外，还包含了标签来定义元素。\n\n示例：\n\n```html\n<head>\n\
  \  <title>页面标题</title>\n</head>\n<body>\n  <h1>这是一个标题</h1>\n  <p>这是一个段落。</p>\n</body>\n\
  ```\n\n### HTML5 中的语义化元素\n\nHTML5 中的语义化元素是指那些向浏览器和开发者清晰描述其含义的元素。示例包括 `<form>`、`<table>`\
  \ 和 `<article>`。非语义化元素如 `<div>` 和 `<span>` 不提供关于其内容的任何信息。\n\n* 语义化元素：`<header>`,\
  \ `<footer>`, `<article>` 等。\n* 非语义化元素：`<div>`, `<span>` 等。\n\n**提示**：使用语义化元素可以获得更好的可读性和无障碍性。它们帮助屏幕阅读器和搜索引擎更好地理解你网站的内容。\n\
  \n### HTML5 文档中 `lang` 属性的作用\n\n`lang` 属性指定文档内容的主要语言。对于无障碍至关重要，因为屏幕阅读器使用此属性来提供正确的发音。它还能帮助搜索引擎返回特定语言的搜索。\n\
  \n示例：\n\n```html\n<html lang=\"en\">\n  …\n  <p lang=\"en\">感谢访问我们的网站!</p>\n</body>\n\
  ```\n\n在此示例中，`lang=\"en\"` 表示文档为英语。\n\n**提示**：始终在你的 HTML 文档中设置 `lang` 属性，以获得更好的无障碍性和\
  \ SEO。\n\n### HTML5 中 viewport 元标签的作用\n\nviewport（视口）元标签用于控制移动端浏览器的布局。没有了它，移动设备将以典型的桌面屏幕宽度渲染页面，然后缩小页面，导致难以阅读。\n\
  \n示例：\n\n```html\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
  >\n```\n\n此 viewport 标签将页面宽度设置为设备的屏幕宽度（随设备而异），并设置浏览器首次加载页面时的初始缩放级别。\n\n**提示**：始终在\
  \ HTML5 文档中使用 viewport 元标签，以确保你的网站支持移动端。\n\n# HTML5 元素与标签\n\nHTML 的核心是标签，用于在世界维网上结构化和展示内容。HTML\
  \ 标签是 Web 开发的基石，允许开发者格式化文本、整合多媒体、创建链接并构建复杂的 Web 应用程序。本介绍将探索 HTML 标签的基础、工作原理及其在 Web\
  \ 开发中的作用。\n\n## 什么是 HTML 标签？\n\nHTML 标签是封装在角括号（`<` 和 `>`）中的指令或命令。这些标签告诉网页浏览器如何显示内容或解释文档特定部分。大多数\
  \ HTML 标签成对出现，由一个起始标签和一个结束标签组成，中间是内容。结束标签与起始标签相似，但在标签名称之前包含一个斜杠（`/`）。\n\n```html\n\
  <p>这是一个段落。</p>\n```\n\n在此示例中，`<p>` 是指示段落开始的起始标签，`</p>` 是其结束的结束标签。\n\n## HTML 文档的基本结构\n\
  \nHTML 文档使用各种标签进行结构化，定义文档类型、头部（head）和主体（body）。这里是一个简单的示例：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n  <head>\n    <title>页面标题</title>\n  </head>\n  <body>\n    <h1>我的第一个标题</h1>\n\
  \    <p>我的第一个段落。</p>\n  </body>\n</html>\n```\n\n* `<!DOCTYPE html>` 声明文档类型和 HTML\
  \ 版本。\n* `<html>` 是封装整个内容的根元素。\n* `<head>` 包含文档的元信息，如其标题。\n* `<title>` 指定网页的标题。\n\
  * `<body>` 包含网页的内容，如文本、图像、链接等。\n\n## 常用 HTML 标签及其用途\n\n* **标题标签（`<h1>` 到 `<h6>`）**：定义标题和子标题，其中\
  \ `<h1>` 是最高（或最重要）的级别，`<h6>` 低。\n* **段落标签（`<p>`）**：定义一个段落。\n* **锚点标签（`<a>`）**：创建指向另一个网页或资源的超链接。\n\
  * **图像标签（`<img>`）**：在文档中嵌入图像。\n* **列表标签（`<ul>`, `<ol>`, `<li>`）**：创建无序列表（项目符号）和有序列表（编号）。\n\
  \n## 代码示例的标签\n\n### 页脚或章节\n\n`<footer>` 元素代表文档的页脚。它通常包含版权信息、联系信息和链接。\n\n示例：\n\n\
  ```html\n<footer>\n  <p>Copyright © 2021 公司名称</p>\n</footer>\n```\n\n### 绘制图形（通过\
  \ JavaScript）\n\n`<canvas>` 元素用于在网页上绘制图形。\n\n示例：\n\n```html\n<canvas id=\"myCanvas\"\
  ></canvas>\n<script>\n  var canvas = document.getElementById('myCanvas');\n  var\
  \ ctx = canvas.getContext('2d');\n  ctx.fillStyle = 'green';\n  ctx.fillRect(10,\
  \ 10, 100, 100);\n</script>\n```\n\n### 导航链接\n\n`<nav>` 元素定义一组导航链接。\n\n示例：\n\n```html\n\
  <nav>\n  <a href=\"/\">首页</a>\n  <a href=\"/about\">关于</a>\n  <a href=\"/contact\"\
  >联系</a>\n</nav>\n```\n\n### 音频文件\n\n`<audio>` 元素用于在文档中嵌入声音内容（音频文件）。\n\n示例：\n\n```html\n\
  <audio controls>\n  <source src=\"audiofile.mp3\" type=\"audio/mpeg\">\n  浏览器不支持音频。\n\
  </audio>\n```\n\n### 主题分割\n\n`<hr>` 元素代表段落元素之间的主题分割，如故事中的场景切换或主题转换。\n\n示例：\n\n```html\n\
  <p>第一个主题...</p>\n<hr>\n<p>第二个主题...</p>\n```\n\n### 引导或导航辅助\n\n`<header>` 元素代表引导性内容或导航链接的容器。\n\
  \n示例：\n\n```html\n<header>\n  <h1>网站标题</h1>\n  <p>欢迎访问我的网站</p>\n</header>\n```\n\
  \n### 独立自包含的内容\n\n`<article>` 元素持有可以独立分发或重用的内容（例如论坛帖子、杂志或报文章）。\n\n示例：\n\n```html\n\
  <article>\n  <h2>文章标题</h2>\n  <p>文章内容...</p>\n</article>\n```\n\n### 连接其他文档的章节\n\
  \n`<section>` 元素定义文档中的章节，通常用于章节、头部、页脚或文档的任何部分。\n\n示例：\n\n```html\n<section id=\"\
  chapter1\">\n  <h2>第一章：引言</h2>\n  <p>章节内容...</p>\n</section>\n```\n\n### 命令列表\n\n\
  `<menu>` 元素代表命令或选项列表。\n\n示例：\n\n```html\n<menu type=\"toolbar\">\n  <li><button\
  \ type=\"button\">首页</button></li>\n  <li><button type=\"button\">产品</button></li>\n\
  </menu>\n```\n\n\n\n\n\n<object data=\"movie.swf\" width=\"500\" height=\"300\"\
  ></object>\n\n## 文档或章节的头部：`<header>`\n\n`<header>` 元素代表介绍性内容或一组导航链接的容器。\n\n示例：\n\
  \n```html\n<header>\n<h1>欢迎来到我的博客</h1>\n<p>您的新闻和文章来源。</p>\n</header>\n```\n\n##\
  \ 间接相关内容（侧边栏）：`<aside>`\n\n`<aside>` 元素用于与其周围内容有间接关系的内容，通常用于侧边栏。\n\n示例：\n\n```html\n\
  <aside>\n<h2>相关文章</h2>\n<ul>\n<li>文章 1</li>\n<li>文章 2</li>\n</ul>\n</aside>\n```\n\
  \n## 无序列表：`<<ul>>`\n\n`<ul>`（无序列表）元素表示一组项目列表，其中项目的顺序并不重要。\n\n示例：\n\n```html\n<ul>\n\
  <li>项目 1</li>\n<li>项目 2</li>\n<li>项目 3</li>\n</ul>\n```\n\n## 文档中的章节：`<section>`\n\
  \n`<section>` 元素用于定义文档中的某个特定章节。\n\n示例：\n\n```html\n<section>\n<h2>关于我们</h2>\n<p>关于公司的信息...</p>\n\
  </section>\n```\n\n## 介绍性内容或导航链接：`<header>`\n\n`<header>` 元素用于网站内的介绍性内容或导航链接。\n\n\
  示例：\n\n```html\n<header>\n<h1>我的网站</h1>\n<nav>\n<a href=\"/\">首页</a> |\n<a href=\"\
  /about\">关于</a>\n</nav>\n</header>\n```\n\n## 独立的自包含内容：`<article>`\n\n`<article>`\
  \ 元素用于自包含的内容，如博客文章或新闻文章。\n\n示例：\n\n```html\n<article>\n<h2>博客文章标题</h2>\n<p>博客文章内容...</p>\n\
  </article>\n```\n\n## 媒体内容组：`<source>`\n\n`<source>` 元素配合 `<audio>` 或 `<video>`\
  \ 元素使用，指定多个媒体源。\n\n示例：\n\n```html\n<video controls>\n<source src=\"movie.mp4\" type=\"\
  video/mp4\">\n<source src=\"movie.ogg\" type=\"video/ogg\">\n您的浏览器不支持视频标签。\n</video>\n\
  ```\n\n## 引用块：`<blockquote>`\n\n`<blockquote>` 元素用于定义从另一个来源引用的文本块。\n\n示例：\n\n```html\n\
  <blockquote cite=\"http://source.com\">\n<p>这是来自来源的引用文本。</p>\n</blockquote>\n```\n\
  \n这些 HTML5 元素和标签对于结构化和丰富网页内容至关重要，确保了内容的语义化和可访问。它们在网页的整体设计和功能中起着关键作用。\n\n# HTML5\
  \ 表单元素和属性\n\n### HTML5 中无效的 `<input>` 类型\n\n在 HTML5 中，`text`、`number`、`email` 和\
  \ `date` 等类型对于 `<input>` 是有效的。无效类型是指 HTML5 标准不的内容，例如 `slider`。\n\n示例：\n\n```html\n\
  <!-- 有效输入类型 -->\n<input type=\"text\" name=\"name\">\n<!-- 无效输入类型 -->\n<input type=\"\
  slider\" name=\"slider\">\n```\n\n### HTML5 中 `<datalist>` 元素的用途\n\n`<datalist>`\
  \ 元素为 `<input>` 元素提供一组预定义的选项。它用于为文本输入建议可能的值，从而帮助自动完成。\n\n示例：\n\n```html\n<input\
  \ list=\"browsers\" name=\"browser\">\n<datalist id=\"browsers\">\n<option value=\"\
  Chrome\">\n<option value=\"Firefox\">\n<option value=\"Safari\">\n<option value=\"\
  Edge\">\n</datalist>\n```\n\n### HTML5 输入字段中 `pattern` 属性的功能\n\n`pattern` 属性指定了一个正则表达式，用于检查输入元素的值。它用于验证表单数据。\n\
  \n示例：\n\n```html\n<!-- 简单邮箱格式的 pattern -->\n<input type=\"text\" name=\"email\"\
  \ pattern=\"[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$\" title=\"输入有效的邮箱地址\">\n```\n\
  \n### 输入字段中 `placeholder` 属性的作用\n\n`placeholder` 属性提供一个短提示，描述输入字段的预期值。它在用户输入值之前显示在输入字段内。\n\
  \n示例：\n\n```html\n<input type=\"text\" name=\"name\" placeholder=\"输入姓名\">\n```\n\
  \n### `<input>` 元素中 `maxlength` 属性的用途\n\n`maxlength` 属性指定了输入字段允许的最大字符数。\n\n示例：\n\
  \n```html\n<!-- 最多接受 10 个字符 -->\n<input type=\"text\" name=\"username\" maxlength=\"\
  10\">\n```\n\n### HTML5 中 `<button>` 元素 `form` 属性的功能\n\n`<button>` 元素的 `form` 属性指定按钮所属表单的\
  \ ID，即使按钮不在表单元素内部，也可以与表单关联。\n\n示例：\n\n```html\n<form id=\"loginForm\">\n<!-- 表单内容\
  \ -->\n</form>\n<button form=\"loginForm\">提交</button>\n```\n\n### 输入元素中 `placeholder`\
  \ 属性的功能\n\n`placeholder` 属性提供一个短提示，描述输入字段的预期值。它在用户输入值之前显示在输入字段内。\n\n示例：\n\n```html\n\
  <input type=\"text\" name=\"name\" placeholder=\"输入姓名\">\n```\n\n### 元素中 `formaction`\
  \ 属性的用途\n\n`formaction` 属性指定了点击按钮时要提交数据的表单 URL。\n\n示例：\n\n```html\n<input type=\"\
  submit\" value=\"submit\">\n```\n\n### 元素中 `nowrap` 属性的功能\n\n`nowrap` 属性用于 `<td>`\
  \ 元素，防止单元格内容换行。\n\n示例：\n\n```html\n<td nowrap>此内容将不会换行。</td>\n```\n\n# HTML5 媒体与图形\n\
  \n### 使用 `<video>` 元素嵌入视频\n\n`<video>` 元素在 HTML5 中用于在网页上嵌入视频文件，提供了内置控件。\n\n示例：\n\
  \n```html\n<video width=\"320\" height=\"240\" controls>\n<source src=\"movie.mp4\"\
  \ type=\"video/mp4\">\n<source src=\"movie.ogg\" type=\"video/ogg\">\n您的浏览器不支持视频标签。\n\
  </video>\n```\n\n提示：\n- 始终包含源文件以确保跨浏览器兼容性。\n- 为不支持该标签的浏览器添加消息。\n\n### 使用 `<canvas>`\
  \ 元素绘制图形\n\n`<canvas>` 元素用于通过脚本（通常是 JavaScript）绘制图形。它对于渲染图表、游戏图形或其他视觉图像特别有用。\n\n\
  示例：\n\n```html\n<canvas id=\"myCanvas\" width=\"200\" height=\"100\" style=\"border:1px\
  \ solid #000;\">\n</canvas>\n<script>\nconst c = document.getElementById(\"myCanvas\"\
  );\nconst ctx = c.getContext(\"2d\");\nctx.fillStyle = \"blue\";\nctx.fillRect(0,\
  \ 0, 200, 100);\n</script>\n```\n\n提示：\n- `<canvas>` 元素本身只是一个容器。您需要使用 JavaScript\
  \ 来实际绘制图形。\n- 为不支持 canvas 的浏览器设置备用消息。\n\n### 使用 `<audio>` 元素嵌入音频\n\n`<audio>` 元素允许你在网站上嵌入音频文件。像\
  \ `<video>` 一样，它支持多个源并包含内置控件。\n\n示例：\n\n```html\n<audio controls>\n<source src=\"\
  sound.mp3\" type=\"audio/mpeg\">\n<source src=\"sound.ogg\" type=\"audio/ogg\">\n\
  您的浏览器不支持音频元素。\n</audio>\n```\n\n提示：\n- 提供多种音频格式以兼容不同的浏览器。\n- 为不支持音频元素的浏览器包含消息。\n\
  \n### 使用矢量图形 (SVG)\n\nSVG 是一种用于描述二维矢量图形的 XML 标记语言。SVG 用于图标、标志和复杂的图画。作为矢量图形，SVG 图像在缩放时不会丢失分辨率。\n\
  \n示例：\n\n```html\n<svg width=\"100\" height=\"100\">\n<circle cx=\"50\" cy=\"50\"\
  \ r=\"40\" stroke=\"green\" stroke-width=\"4\" fill=\"yellow\" />\n</svg>\n```\n\
  \n提示：\n- SVG 非常适合需要根据不同设备尺寸缩放的高质量图形。\n- 您可以使用 CSS 设置 SVG 元素并使用 JavaScript 使其具有交互性。\n\
  \n\n\n\n\n# 使用 <embed> 和 <object> 嵌入外部媒体\n\n`<embed>` 和 <object>` 元素用于嵌入外部应用程序和交互内容，如\
  \ Flash 动画或 PDF 阅读器。\n\n### <embed> 示例\n\n```html\n<embed src=\"file.swf\" width=\"\
  400\" height=\"50\">\n```\n\n### <object> 示例\n\n```html\n<object data=\"file.swf\"\
  \ width=\"400\" height=\"50\">\n  <embed src=\"file.swf\" width=\"400\" height=\"\
  50\">\n</object>\n```\n\n### 提示：\n- 使用 `<embed>` 处理视频、图像或音频等外部多媒体。\n- `<object>`\
  \ 标签也可用于嵌入多媒体，而且更加通用。\n\n# 高级 HTML5 特性\n\n### <script> 标签中的 async 属性\n\n`async`\
  \ 属性用于 `<script>` 标签，以与页面的其他部分异步加载脚本。这意味着脚本下载完成后立即执行，而不会阻塞 HTML 的解析。\n\n### 示例：\n\
  \n```html\n<script async src=\"script.js\"></script>\n```\n\n### 提示：\n- 对于不依赖其他脚本的脚本，使用\
  \ `async`。\n- 它有助于提高网页的加载性能。\n\n### <output> 元素的目的\n\n`<output>` 元素用于表示计算结果或用户操作的结果。\n\
  \n### 示例：\n\n```html\n<form oninput=\"are1.value=parseInt(length.value)*parseInt(width.value)\"\
  >\n  <label for=\"length\">长度： </label>\n  <input type=\"number\" id=\"length\"\
  \ name=\"length\" value=\"0\"> 单位<br>\n  <label for=\"width\">宽度： </label>\n  <input\
  \ type=\"number\" id=\"width\" name=\"width\" value=\"0\"> 单位<br>\n  <label for=\"\
  area\">面积： </label>\n  <output name=\"area\" for=\"length width\">0</output> 平方单位\n\
  </form>\n```\n\n### <article> 元素的目的\n\n`<article>` 元素代表文档、页面或网站中的自包含内容组合，旨在用于独立分发或重用。\n\
  \n### 示例：\n\n```html\n<article>\n  <h2>文章标题</h2>\n  <p>文章内容...</p>\n</article>\n\
  ```\n\n### 提示：\n- 将其用于博客文章、新闻文章、用户评论或其他独立内容项。\n\n### 输入字段的 required 属性\n\n`required`\
  \ 属性用于指定在提交表单之前必须填写输入字段。\n\n### 示例：\n\n```html\n<input type=\"text\" name=\"name\"\
  \ required>\n```\n\n### contentEditable 属性\n\n`contenteditable` 属性指定元素的内容是否可编辑。\n\
  \n### 示例：\n\n```html\n<div contenteditable=\"true\">你可以编辑这段文字。</div>\n```\n\n###\
  \ <figure> 元素的目的\n\n`<figure>` 元素代表自包含的内容，通常带有一个可选的说明，使用 `<figcaption>` 指定。\n\n\
  ### 示例：\n\n```html\n<figure>\n  <img src=\"image.jpg\" alt=\"图像描述\">\n  <figcaption>图片的说明。</figcaption>\n\
  </figure>\n```\n\n### <script> 标签中的 defer 属性\n\n`defer` 属性推迟脚本的执行，直到文档解析完成后执行。\n\
  \n### 示例：\n\n```html\n<script defer src=\"script.js\"></script>\n```\n\n### 提示：\n\
  - 对于需要 DOM 完全解析的脚本，使用 `defer`。\n\n### <track> 元素的 kind 属性\n\n`<track>` 元素中的 `kind`\
  \ 属性指定文本轨道的类型（字幕、说明、描述、章节或元数据）。\n\n### 示例：\n\n```html\n<video controls>\n  <source\
  \ src=\"movie.mp4\" type=\"video/mp4\">\n  <track src=\"subtitles_en.vtt\" kind=\"\
  subtitles\" srclang=\"en\" label=\"English\">\n</video>\n```\n\n### <textarea> 元素的\
  \ cols 属性\n\n`cols` 属性指定文本控件的可见宽度（以平均字符宽度计算）。\n\n### 示例：\n\n```html\n<textarea name=\"\
  message\" rows=\"10\" cols=\"30\"></textarea>\n```\n\n### 图片 alt 属性的作用\n\n`alt`\
  \ 属性在图像无法显示时提供替代文本。\n\n### 示例：\n\n```html\n<img src=\"image.jpg\" alt=\"关于图片的描述性文字\"\
  >\n```\n\n### 提示：\n- 始终使用 `alt` 属性来提高可访问性。\n\n### <a> 标签中的 download 属性\n\n`<a>`\
  \ 标签中的 `download` 属性建议下载链接而不是进行跳转。\n\n### 示例：\n\n```html\n<a href=\"path/to/file\"\
  \ download>下载文件</a>\n```\n\n### <figcaption> 元素的目的\n\n`<figcaption>` 元素代表其父元素 `<figure>`\
  \ 中其余部分内容的说明或图例。\n\n### 示例：\n\n```html\n<figure>\n  <img src=\"image.jpg\" alt=\"\
  ...\">\n  <figcaption>说明放在这里。</figcaption>\n</figure>\n```\n\n### <button> 元素的 type\
  \ 属性的默认值\n\n`<button>` 元素 `type` 属性的默认值为 `submit`。\n\n### 示例：\n\n```html\n<button\
  \ type=\"button\">点击我！</button> <!-- 不是提交按钮 -->\n```\n\n### 使用 charset 属性指定字符编码\n\
  \n`charset` 属性用于指定字符编码。\n\n### 示例：\n\n```html\n<meta charset=\"UTF-8\">\n```\n\n\
  ### Element 的说明\n\n`<figcaption>` 元素用于为 `<figure>` 元素定义说明。\n\n### 示例：\n\n```html\n\
  <figure>\n  <img src=\"image.jpg\" alt=\"...\">\n  <figcaption>这是说明。</figcaption>\n\
  </figure>\n```\n\n### 指示新文章\n\n`<article>` 元素用于指示新文章。\n\n### 示例：\n\n```html\n<article>\n\
  \  <h2>文章标题</h2>\n  <p>文章内容...</p>\n</article>\n```\n\n### 使用 meta 元素指定元数据\n\n`<meta>`\
  \ 元素用于指定元数据。\n\n### 示例：\n\n```html\n<meta name=\"description\" content=\"页面描述\"\
  >\n```\n\n### <a> 标签中的 href 属性\n\n`<a>` 标签中的 `href` 属性指定链接指向的 URL。\n\n### 示例：\n\n\
  ```html\n<a href=\"https://example.com\">访问示例</a>\n```\n\n### 标记时间戳\n\n`<time>`\
  \ 元素适用于标记时间戳。\n\n### 示例：\n\n```html\n<time datetime=\"2025-01-01\">2025 年 1 月 1\
  \ 日</time>\n```\n\n### autofocus 属性\n\n`autofocus` 属性用于 HTML5，指定一个元素在页面加载时获取焦点。\n\
  \n### 示例：\n\n```html\n<input type=\"text\" autofocus>\n```\n\n### 指定有序列表\n\n`<ol>`\
  \ 标签用于在 HTML5 中指定有序列表。\n\n### 示例：\n\n```html\n<ol>\n  <li>第一项</li>\n  <li>第二项</li>\n\
  </ol>\n```\n\n### 定义强调文本\n\n`<em>` 元素用于 HTML5 用于定义强调文本。\n\n### 示例：\n\n```html\n\
  <p>这是<em>强调</em>的文本。</p>\n```\n\n### HTML5 中的 disabled 属性\n\n`disabled` 属性用于指定输入元素应被禁用。\n\
  \n### 示例：\n\n```html\n<input type=\"text\" disabled>\n```\n\n### 在范围内表示标量值\n\n`<input\
  \ type=\"range\">` 元素用于表示在已知范围内的标量值，例如音量控制。\n\n### 示例：\n\n```html\n<input type=\"\
  range\" min=\"1\" max=\"10\">\n```\n\n### <input> 元素中的 multiple 属性\n\n`<input>`\
  \ 元素中的 `multiple` 属性允许用户选择或输入多个值。\n\n### 示例：\n\n```html\n<input type=\"file\" multiple>\n\
  ```\n\n# HTML 题\n\n## HTML 问题介绍\n\n深入 Web 开发的世界始于任何网站的基础——HTML（超文本标记语言）。在我们接触 HTML\
  \ 问题时，我们正在开启一段探索构建网站结构和内容的程。这些问题旨在揭示 HTML 的复杂性，从文档的基本结构到 HTML5 的高级特性。无论你对不同标签的作用、属性的重要性还是表单元素的实现感兴趣，此部分都提供了掌握\
  \ HTML 的全面指南。\n\n## HTML 问题及解释\n\nHTML 代表什么？\n\n1. HyperText Markup Language\n2.\
  \ HyperTech More Language\n3. HighText Machine Language\n4. 以上都不是\n\n答案：1\\. HyperText\
  \ Markup Language\n\n解释：HTML 代表超文本标记语言。它是创建网页和 Web 应用程序的标准标记语言。它构建了网页的内容。\n\n以下哪项是\
  \ HTML5 中的新元素？\n\n1. <div>\n2. <table>\n3. <article>\n4. <font>\n\n答案：3\\. <article>\n\
  \n\n\n\n\n解释：`<article>` 是 HTML5 引入的一个新元素。它代表文档、页面、应用程序或站点中一个自包含的组合，旨在独立分发或重用。\n\
  \n### HTML5 中的 `<canvas>` 元素的作用是什么？\n\n1. 显示数据库记录\n2. 通过脚本（如 `JavaScript`）动态绘制图形\n\
  3. 为网页添加背景画布\n4. 显示 3D 对象\n\n答案：2. 通过脚本（如 `JavaScript`）动态绘制图形\n\n解释：HTML5 中的 `<canvas>`\
  \ 元素用于通过 `JavaScript` 等脚本语言动态绘制图形。它可以用于绘制图表、制作照片合成、创建动画，甚至进行实时视频处理或渲染。\n\n### 哪一个\
  \ HTML5 元素用于指定文档或节节的页脚（footer）？\n\n1. `<bottom>` \n2. `<footer>`\n3. `<section>`\n\
  4. `<div>`\n\n答案：2. `<footer>`\n\n解释：HTML5 中的 `<footer>` 元素用于定义文档或节节的页脚。它通常包含作者信息、联系信息、版权声明和相关文档。\n\
  \n### 播放视频文件的正确 HTML5 元素是什么？\n\n1. `<media>`\n2. `<video>`\n3. `<film>`\n4. `<mp4>`\n\
  \n答案：2. `<video>`\n\n解释：HTML5 中的 `<video>` 元素用于在文档中嵌入视频内容。它可以播放各种视频文件格式。`src`、`controls`、`width`\
  \ 和 `height` 等属性经常配合 `<video>` 元素一起使用。\n\n### 下面不是 HTML5 中 `<input>` 的有效类型？\n\n\
  1. email\n2. date\n3. slider\n4. color\n\n答案：3. slider\n\n解释：在 HTML5 中，`slider`\
  \ 不是 `<input>` 的有效类型属性值。滑动器的正确类型是 `range`。\n\n### 哪一个 HTML5 元素用于绘制图形（通常通过 `JavaScript`）？\n\
  \n1. `<graphics>`\n2. `<canvas>`\n3. `<svg>`\n4. `<draw>`\n\n答案：2. `<canvas>`\n\n\
  解释：HTML5 中的 `<canvas>` 元素用于绘制图形，通常使用 `JavaScript`。它允许对 2D 形状和位图图像进行动态的、脚本化的渲染。\n\
  \n### `<script>` 标签中的 `async` 属性的作用什么？\n\n1. 它停止脚本直到页面完成解析\n2. 脚本可用时立即异步运行\n3. 它将脚本延迟到页面解析完成后运行\n\
  4. 它检查脚本中的语法错误\n\n答案：2. 脚本可用时立即异步运行\n\n解释：`<script>` 标签中的 `async` 属性允许脚本可用时立即异步执行，而无需等待整个页面加载。\n\
  \n### HTML5 使用哪个元素指定导航链接？\n\n1. `<nav>`\n2. `<navigation>`\n3. `<links>`\n4. `<navigate>`\n\
  \n答案：1. `<nav>`\n\n解释：HTML5 中的 `<nav>` 元素用于定义导航链接的节。\n\n### HTML5 中 `<aside>` 元素的作用是什么？\n\
  \n1. 代表页面的一部分，其内容与主内容间接连接\n2. 为广告创建侧边栏\n3. 标记用户可能需要的额外条目\n4. 高亮文本\n\n答案：1. 代表页面的一部分，其内容与主内容间接连接\n\
  \n解释：HTML5 中的 `<aside>` 元素代表页面的一个部分，该部分的内容与 `<aside>` 元素周围的内容有边缘关系。\n\n### HTML5\
  \ 中的 figure 元素代表什么？\n\n1. 计算或结果\n2. 长度单位\n3. 自包含的内容，如插图、图表、照片、代码列表等\n4. 文本中的关键人物\n\
  \n答案：3. 自包含的内容，如插图、图表、照片、代码列表等\n\n解释：`figure` 元素代表自包含的内容，通常在文档的主流中作为单个单元引用，例如插图、图表、照片、代码列表等。\n\
  \n### 如何在 HTML5 中为节或页面定义页头（header）？\n\n1. `<header>`\n2. `<head>`\n3. `<top>`\n\
  4. `<section>`\n\n答案：1. `<header>`\n\n解释：HTML5 中的 `<header>` 元素用于定义文档或节的页头。\n\n\
  ### HTML5 中 datalist 元素的作用是什么？\n\n1. 离线存储数据\n2. 为 `<input>` 元素提供预定义的选项列表\n3. 链接到外部源\n\
  4. 以表格格式显示列表\n\n答案：2. 为 `<input>` 元素提供预定义的选项列表\n\n解释：HTML5 中的 `datalist` 元素为 `<input>`\
  \ 元素提供一组预定义的选项，允许实现自动完成功能。\n\n### 哪一个 HTML5 元素用于播放音频？\n\n1. `<sound>`\n2. `<mp3>`\n\
  3. `<audio>`\n4. `<music>`\n\n答案：3. `<audio>`\n\n解释：HTML5 中的 `<audio>` 元素用于在文档中嵌入音频内容。它可以播放音频文件。\n\
  \n### HTML5 中 output 元素的作用是什么？\n\n1. 显示脚本的输出\n2. 将数据导出到外部文件\n3. 为输入定义节\n4. 将输出存储在数据库中\n\
  \n答案：1. 显示脚本的输出\n\n解释：`output` 元素用于计算或用户操作的结果。\n\n### 使用哪个属性指定输入字段在提交表单之前必须填写？\n\
  \n1. `required`\n2. mandatory\n3. validate\n4. essential\n\n答案：1. `required`\n\n\
  解释：`required` 属性用于指定输入字段不能为空，并且在提交表单之前必须填写。\n\n### HTML5 中 article 元素的作用是什么？\n\n\
  1. 定义注释\n2. 包含杂志或报纸文章\n3. 封装关于特定主题的文章\n4. 以上两者均为是\n\n答案：4. 以上两者均为是\n\n解释：`<article>`\
  \ 元素代表一段自包含的内容，例如报纸或杂志文章、博客文章或用户评论。\n\n### 下面哪一个不是 HTML5 中的语义元素？\n\n1. `<article>`\n\
  2. `<footer>`\n3. `<div>`\n4. `<section>`\n\n答案：3. `<div>`\n\n解释：`<div>` 是 HTML\
  \ 中的通用容器，不被视为语义元素。像 `<article>`、`<footer>` 和 `<section>` 这样的语义元素以人类和机器读取的方式清晰地描述了它们的含义。\n\
  \n### 哪一个 HTML5 元素用于标记页面中的主题分隔？\n\n1. `<break>`\n2. `<line>`\n3. `<hr>`\n4. `<divider>`\n\
  \n答案：3. `<hr>`\n\n解释：`<hr>` 元素代表段落级元素之间的主题分隔（例如故事中场景的变化，或节内的话题转换）。\n\n### 使用哪个属性配合\
  \ meta 标签来定义 HTML 文档的字符集？\n\n1. `charset`\n2. encoding\n3. setchar\n4. character\n\
  \n答案：1. `charset`\n\n解释：`<meta>` 标签中的 `charset` 属性指定 HTML 文档的字符编码。\n\n### 输入字段中的\
  \ placeholder 属性提供了什么？\n\n1. 随表单一起提交的默认值\n2. 提示用户在字段中可以输入什么\n3. 输入字段的标签\n4. 用户必须填写的强制性文本\n\
  \n答案：2. 提示用户在字段中可以输入什么\n\n解释：`placeholder` 属性提供了一个描述输入字段预期值的简短提示。\n\n### 哪一个 HTML5\
  \ 元素定义独立的、自包含的内容？\n\n1. `<section>`\n2. `<article>`\n3. `<aside>`\n4. `<header>`\n\
  \n答案：2. `<article>`\n\n解释：`<article>` 元素指定独立的、自包含的内容，这些内容可能被分发或重用。\n\n### 插入换行的正确\
  \ HTML 元素是什么？\n\n1. `<br>`\n2. `<break>`\n3. `<lb>`\n4. `<line>`\n\n答案：1. `<br>`\n\
  \n解释：`<br>` 标签在 HTML 中用于在文本插入换行。\n\n\n\n\n## 使用哪一个 HTML5 元素来指定一组介绍或导航辅助工具？\n\n1.\
  \ `<group>`\n2. `<section>`\n3. `<header>`\n4. `<nav>`\n\n**答案：** 4. `<nav>`\n\n\
  **解释：** `<nav>` 元素用于在 HTML5 中定义一组导航链接。\n\n## `<a>` 标签中的哪个属性指定了链接指向的页面 URL？\n\n1.\
  \ `href`\n2. `src`\n3. `link`\n4. `url`\n\n**答案：** 1. `href`\n\n**解释：** `<a>`（锚点）标签中的\
  \ `href` 属性指定了链接指向的页面 URL。\n\n## HTML5 中的 `viewport` 元数据标签（meta tag）的作用是什么？\n\n\
  1. 调整网页的可视区域\n2. 锁定设备的方向方向\n3. 控制页面的缩放级别\n4. 设置网页的初始比例\n\n**答案：** 1. 调整网页的可视区域\n\
  \n**解释：** `viewport` 元数据标签在 HTML5 中用于控制移动设备浏览器上的布局。默认情况下，它会将页面宽度调整为设备的屏幕宽度。\n\n\
  ## HTML5 中使用哪个元素来表示任务的进度？\n\n1. `<progress>`\n2. `<meter>`\n3. `<task>`\n4. `<loading>`\n\
  \n**答案：** 1. `<progress>`\n\n**解释：** `<progress>` 元素在 HTML5 中表示任务的进度。\n\n## HTML5\
  \ 中 `autofocus` 属性的目的是什么？\n\n1. 页面加载时自动聚焦于表单元素\n2. 自动验证表单输入\n3. 自动更新内容\n4. 根据历史记录自动填充表单字段\n\
  \n**答案：** 1. 页面加载时自动聚焦于表单元素\n\n**解释：** `autofocus` 属性是一个布尔属性，允许你指定在页面加载时自动聚焦表单输入框。\n\
  \n## 使用哪个 HTML5 标签来指定有序列表（ordered list）？\n\n1. `<ul>`\n2. `<ol>`\n3. `<list>`\n\
  4. `<dl>`\n\n**答案：** 2. `<ol>`\n\n**解释：** `<ol>` 标签用于在 HTML5 中定义有序列表。\n\n## 在 HTML5\
  \ 中，哪个元素用于定义强调文本（emphasized text）？\n\n1. `<em>`\n2. `<i>`\n3. `<bold>`\n4. `<strong>`\n\
