  trans: "\n\n### 解释\n在 JavaScript 中，`==` 运算符执行类型强制转换并检查值的相等性。因此，字符串 `\"1\"` 被强制转换为数字\
    \ `1`，导致结果为 `true`。\n\n### JavaScript 中 `bind` 方法的作用是什么？\n\n1. 它用于将现有的函数绑定到新对象上。\n\
    2. 它用于将函数永久地绑定到 `this` 的特定值上。\n3. 它用于将两个函数合并为一个函数。\n4. 它用于延迟函数的执行。\n\n答案：2. 它用于将函数永久地绑定到\
    \ `this` 的特定值上。\n\n**解释**：`bind` 方法会创建一个新函数，当该函数被调用时，它的 `this` 关键字被设置为提供的值。它用于无论如何调用函数，都设置函数的\
    \ `this` 上下文。\n\n### 在 JavaScript 中，在函数前使用 `async` 关键字的主要用途是什么？\n\n1. 它表示该函数返回一个\
    \ `promise`。\n2. 它会自动将函数拆分为多个线程。\n3. 它保证函数将以异步执行。\n4. 它对函数进行性能优化。\n\n答案：1. 它表示该函数返回一个\
    \ `promise`。\n\n**解释**：`async` 关键字用于声明异步函数，该函数返回一个 `promise`。它允许在函数内部使用 `await`。\n\
    \n### 在 JavaScript 中，哪个方法对数组元素进行原地排序？\n\n1. `Array.sort()`\n2. `Array.order()`\n\
    3. `Array.arrange()`\n4. `Array.sequence()`\n\n答案：1. `Array.sort()`\n\n**解释**：`Array.sort()`\
    \ 是一个原地排序数组元素并返回排序后的数组的方法。\n\n以下 JavaScript 代码的输出是什么？\n\n```javascript\nlet arr\
    \ = [10, 12, 15, 21];\n\nfor (let i = 0; i < arr.length; i++) {\n  setTimeout(function()\
    \ {\n    console.log('Index: ' + i + ', element: ' + arr[i]);\n  }, 3000);\n}\n\
    ```\n\n1. 它在延迟后记录数组每个元素的索引和元素。\n2. 它会抛出语法错误。\n3. 它会为每个元素记录 undefined。\n4. 它会多次记录相同的索引和元素。\n\
    \n答案：1. 它在延迟后记录数组每个元素的索引和元素。\n\n**解释**：`setTimeout` 函数为每次循环迭代创建一个闭包，捕获了 `i` 的当前值和对应的数组元素。3\
    \ 秒后，它会记录数组中每个项的索引和元素。\n\n### 如何在创建 JavaScript 对象后向其添加键值对对？\n\n1. `obj[key] =\
    \ value;`\n2. `obj.add(key, value);`\n3. `obj.push({key: value});`\n4. `obj.concat({key:\
    \ value});`\n\n答案：1. `obj[key] = value;`\n\n**解释**：你可以使用语法 `obj[key] = value;`\
    \ 来向对象添加新的键值对，其中 `key` 是属性名，`value` 是你想要赋值的值。\n\n### JavaScript 中的事件委托（event delegation）是什么？\n\
    \n1. 一种在父元素上处理事件而不是单个子元素事件的方法。\n2. 将事件处理委托给接收事件之外的不同元素的方法。\n3. 一种加速事件处理的技术。\n\
    4. 将多个事件绑定到单个事件监听器的过程。\n\n答案：1. 一种在父元素上处理事件而不是单个子元素事件的方法。\n\n**解释**：事件委托是一种技术，你在父元素上使用单个事件监听器来管理所有的子元素事件，利用了事件冒泡机制。\n\
    \n以下哪种是 JavaScript 中定义箭头函数的方法？\n\n1. `function myFunc() {...}`\n2. `var myFunc\
    \ = () => {...};`\n3. `var myFunc = function() {...};`\n4. `var myFunc => {...};`\n\
    \n答案：2. `var myFunc = () => {...};`\n\n**解释**：JavaScript 中的箭头函数使用 `=>` 语法定义。它们是编写函数表达式的更短的方式，并且没有它们自己的\
    \ `this` 值。\n\n以下 JavaScript 表达式的输出是什么？\n\n```javascript\nconsole.log(0.1 + 0.2\
    \ === 0.3);\n```\n\n1. true\n2. false\n3. TypeError\n4. undefined\n\n答案：2. false\n\
    \n**解释**：由于 JavaScript 处理浮点数运算的方式，`0.1 + 0.2` 的结果并不完全等于 `0.3`。因此，此比较返回 `false`。\n\
    \n在 JavaScript 中，`splice` 方法的作用是什么？\n\n1. 将两个数组合并。\n2. 在数组中搜索指定的值。\n3. 通过移除或替换现有元素以及/或添加新元素来改变数组的内容。\n\
    4. 将字符串拆分为子字符串数组。\n\n答案：3. 通过移除或替换现有元素以及/或添加新元素来改变数组的内容。\n\n**解释**：JavaScript\
    \ 中的 `splice` 方法用于通过原地移除、替换和/或添加新元素来改变数组的内容。\n\n以下 JavaScript 代码将输出什么？\n\n```javascript\n\
    console.log(typeof undefined);\n```\n\n1. \"undefined\"\n2. \"object\"\n3. \"\
    null\"\n4. \"string\"\n\n答案：1. \"undefined\"\n\n**解释**：`typeof undefined` 会返回\
    \ `\"undefined\"`。\n\n在 JavaScript 中，`typeof` 运算符检查什么？\n\n1. 值\n2. 类型\n3. 值和类型\n\
    4. 存在性\n\n答案：3. 值和类型\n\n**解释**：`typeof` 运算符检查操作数的值和类型。\n\n在 JavaScript 中，如何停止\
    \ for 循环？\n\n1. `stop();`\n2. `break;`\n3. `exit;`\n4. `terminate;`\n\n答案：2. `break;`\n\
    \n**解释**：`break` 语句用于退出循环。\n\n以下哪种是 JavaScript 中定义常量的方法？\n\n1. `var CONSTANT_NAME\
    \ = value;`\n2. `let CONSTANT_NAME = value;`\n3. `const CONSTANT_NAME = value;`\n\
    4. `define CONSTANT_NAME`\n\n答案：3. `const CONSTANT_NAME = value;`\n\n**解释**：`const`\
    \ 关键字用于定义常量。常量之后无法重新赋值。\n\n以下代码的输出是什么？\n\n```javascript\nlet x = 10;\nlet y =\
    \ \"10\";\nconsole.log(x === y);\n```\n\n1. true\n2. false\n3. TypeError\n4. undefined\n\
    \n答案：2. false\n\n**解释**：`===` 运算符检查值和类型。在这种情况下，`x` 是数字而 `y` 是字符串，所以结果为 `false`。\n\
    \n哪个方法用于向数组开头添加新项？\n\n1. `push()`\n2. `pop()`\n3. `unshift()`\n4. `shift()`\n\n\
    答案：3. `unshift()`\n\n**解释**：`unshift()` 方法用于向数组开头添加一个或多个元素并返回数组的新长度。\n\nJavaScript\
    \ 中 `Array.prototype.reduce()` 方法的作用是什么？\n\n1. 对数组的每个元素执行还原器函数以得到单个值。\n2. 将数组的所有元素合并为单个字符串。\n\
    3. 遍历数组的每个元素。\n4. 修改数组元素并创建一个新数组。\n\n答案：1. 对数组的每个元素执行还原器函数以得到单个值。\n\n**解释**：`Array.prototype.reduce()`\
    \ 对累加器和数组中的每个元素（从左到右）应用函数，将其还原为单个值。\n\n以下如何正确调用名为 `myFunc` 的函数？\n\n1. `call myFunction();`\n\
    2. `myFunc();`\n3. `call function myFunction();`\n4. `execute myFunction();`\n\
    \n答案：2. `myFunc();`\n\n**解释**：在 JavaScript 中，你通过在函数名后加括号来调用函数。因此，`myFunc()` 是正确的语法。\n\
    \n以下 JavaScript 代码输出什么？\n\n```javascript\nlet num = \"10\";\nconsole.log(typeof\
    \ parseInt(num));\n```\n\n1. \"number\"\n2. \"string\"\n3. \"object\"\n4. \"undefined\"\
    \n\n答案：1. \"number\"\n\n**解释**：`parseInt(num)` 将字符串 `\"10\"` 转换为数字 `10`。`typeof`\
    \ 运算符返回 `\"number\"`。\n\n在 JavaScript 中，如何启动 while 循环？\n\n1. `while (condition)\
    \ {...}`\n2. `while condition {...}`\n3. `while loop (condition) {...}`\n4. `while:\
    \ (condition) {...}`\n\n答案：1. `while (condition) {...}`\n\n"
- fmt: "\n# Explanation\nA `while` loop in JavaScript is written with the syntax `while\
    \ (condition) {...}`, where the code inside the braces is executed as long as\
    \ the condition evaluates to true.\n\nThese questions cover a variety of JavaScript\
    \ topics, testing fundamental knowledge as well as more complex concepts.\n\n\
    ### What is the output of the following JavaScript code?\n```javascript\nlet a\
    \ = \"5\";\nlet b = 5;\nconsole.log(a === b);\n```\n1. true\n2. false\n3. `TypeError`\n\
    4. undefined\n\n**Answer:** 2. `false`\n\n**Explanation:** The strict equality\
    \ operator (`===`) checks both the value and the type of the operands. In this\
    \ case, `a` is a string and `b` is a number, so the comparison returns `false`.\n\
    \n### Which of the following methods is used to remove an element from the end\
    \ of an array in JavaScript?\n\n1. `shift()`\n2. `pop()`\n3. `push()`\n4. `unshift()`\n\
    \n**Answer:** 2. `pop()`\n\n**Explanation:** The `pop()` method removes the last\
    \ element from an array and returns that element. This alters the length of the\
    \ array.\n\n### How do you declare a JavaScript variable that cannot be reassigned?\n\
    \n1. `var variableName = value;`\n2. `let variableName = value;`\n3. `const variableName\
    \ = value;`\n4. `immutable variableName = value;`\n\n**Answer:** 3. `const variableName\
    \ = value;`\n\n**Explanation:** The `const` keyword is used to declare a JavaScript\
    \ variable that cannot be reassigned after it's been declared.\n\n### In JavaScript,\
    \ what will the following expression return?\n```javascript\ntypeof NaN\n```\n\
    1. \"number\"\n2. \"NaN\"\n3. \"undefined\"\n4. \"object\"\n\n**Answer:** 1. \"\
    number\"\n\n**Explanation:** `NaN` (Not a Number) in JavaScript is considered\
    \ a numeric value, and thus `typeof NaN` returns `\"number\"`.\n\n### What is\
    \ the purpose of the `Array.prototype.map()` method in JavaScript?\n\n1. To execute\
    \ a function on each element in the array and return a new array.\n2. To combine\
    \ all elements of an array into a single value.\n3. To filter elements based on\
    \ a condition and return a new array.\n4. To check if at least one element in\
    \ the array passes a test.\n\n**Answer:** 1. To execute a function on each element\
    \ in the array and return a new array.\n\n**Explanation:** `Array.prototype.map()`\
    \ creates a new array with the results of calling a provided function on every\
    \ element in the calling array.\n\n### What does the following JavaScript code\
    \ output?\n```javascript\nconsole.log(\"Hello\" || \"World\");\nconsole.log(\"\
    Foo\" && \"Bar\");\n```\n1. \"Hello\" and \"Foo\"\n2. \"World\" and \"Bar\"\n\
    3. \"Hello\" and \"Bar\"\n4. \"World\" and \"Foo\"\n\n**Answer:** 3. \"Hello\"\
    \ and \"Bar\"\n\n**Explanation:** The logical OR (`||`) operator returns the first\
    \ truthy operand, which is `\"Hello\"`. The logical AND (`&&`) operator returns\
    \ the second operand if the first is truthy, which in this case is `\"Bar\"`.\n\
    \n### Which of the following is a correct syntax for creating a new object in\
    \ JavaScript?\n\n1. `let obj = new Object();`\n2. `let obj = {};`\n3. `let obj\
    \ = Object.create(null);`\n4. All of the above\n\n**Answer:** 4. All of the above\n\
    \n**Explanation:** All three methods are correct ways to create a new object in\
    \ JavaScript. `new Object()` and `{}` (object literal syntax) are more common,\
    \ whereas `Object.create(null)` is used for more complex cases, like creating\
    \ an object without a prototype.\n\n### What is the correct way to write a JavaScript\
    \ array?\n\n1. `let arr = new Array(\"item1\", \"item2\", \"item3\");`\n2. `let\
    \ arr = [\"item1\", \"item2\", \"item3\"];`\n3. `let arr = Array(\"item1\", \"\
    item2\", \"item3\");`\n4. All of the above\n\n**Answer:** 4. All of the above\n\
    \n**Explanation:** All three statements are valid ways to create an array in JavaScript.\
    \ `new Array()` and `Array()` are constructor syntaxes, while `[]` is array literal\
    \ syntax.\n\n### In JavaScript, how can you catch errors thrown during asynchronous\
    \ operations?\n\n1. Using a `try...catch` block.\n2. Using a `catch()` method\
    \ on a promise.\n3. Using an `onError` event handler.\n4. Both 1 and 2\n\n**Answer:**\
    \ 4. Both 1 and 2\n\n**Explanation:** For asynchronous operations, errors can\
    \ be caught using the `catch()` method on a promise. Additionally, with the `async/await`\
    \ syntax.\n\n### What will the following JavaScript code output?\n```javascript\n\
    console.log(1 + \"1\");\n```\n1. 11\n2. 2\n3. \"11\"\n4. undefined\n\n**Answer:**\
    \ 3. \"11\"\n\n**Explanation:** When you use the `+` operator with a string and\
    \ a number, JavaScript performs type coercion and converts the number to a string\
    \ before concatenating them.\n\n### Which JavaScript method is used to join the\
    \ elements of an array into a string with a specified separator?\n\n1. `join()`\n\
    2. `concat()`\n3. `split()`\n4. `merge()`\n\n**Answer:** 1. `join()`\n\n**Explanation:**\
    \ The `join()` method in JavaScript is used to join the elements of an array into\
    \ a string with a specified separator.\n\n### What is the purpose of the `Array.prototype.filter()`\
    \ method in JavaScript?\n\n1. To execute a function on each element in the array\
    \ and return a new array.\n2. To combine all elements of an array into a single\
    \ value.\n3. To filter elements based on a condition and return a new array.\n\
    4. To check if at least one element in the array passes a test.\n\n**Answer:**\
    \ 3. To filter elements based on a condition and return a new array.\n\n**Explanation:**\
    \ `Array.prototype.filter()` creates a new array with the elements that pass the\
    \ test.\n\n### In JavaScript, how do you declare multi-line strings?\n\n1. Use\
    \ backticks (`)\n2. Use double quotes (\")\n3. Use single quotes (')\n4. JavaScript\
    \ does not support this.\n\n**Answer:** 1. Use backticks (`)\n\n**Explanation:**\
    \ In JavaScript, you can declare multi-line strings using backticks (`).\n\n###\
    \ What is the purpose of the `Array.prototype.forEach()` method in JavaScript?\n\
    \n1. To execute a function on each element in the array and return a new array.\n\
    2. To combine all elements of an array into a single value.\n3. To iterate over\
    \ each element of the array.\n4. To check if at least one element in the array\
    \ passes a test.\n\n**Answer:** 3. To iterate over each element of the array.\n\
    \n**Explanation:** `forEach()` is used to iterate over each element of an array,\
    \ but it does not return a new array.\n\n### What will the following JavaScript\
    \ code output?\n```javascript\nconsole.log(3 === 3 && 4 !== 5);\n```\n1. true\n\
    2. false\n3. `TypeError`\n4. undefined\n\n**Answer:** 1. true\n\n**Explanation:**\
    \ The `&&` operator performs a logical AND. Both conditions `3 === 3` (true) and\
    \ `4 !== 5` (true) are satisfied, so the result is true.\n\n### In JavaScript,\
    \ which of the following statements is used to skip the current iteration of a\
    \ loop and continue with the next?\n\n1. break\n2. continue\n3. return\n4. exit\n\
    \n**Answer:** 2. `continue`\n\n**Explanation:** The `continue` statement is used\
    \ to skip the current iteration of a loop and continue with the next iteration.\n\
    \n### What is the purpose of the `Array.prototype.indexOf()` method in JavaScript?\n\
    \n1. To find the index of the first occurrence of a value in an array.\n2. To\
    \ sort the elements of an array.\n3. To add an element to the end of an array.\n\
    4. To remove the last element from an array.\n\n**Answer:** 1. To find the index\
    \ of the first occurrence of a value in an array.\n\n**Explanation:** `Array.prototype.indexOf()`\
    \ is used to find the index of the first occurrence of a specified value in an\
    \ array.\n\n### What is the output of the following JavaScript code?\n```javascript\n\
    let x = 5;\n\nfunction myFunction() {\n  let x = 10;\n  console.log(x);\n}\n\n\
    myFunction();\nconsole.log(x);\n```\n1. 5 and 5\n2. 10 and 5\n3. 5 and 10\n4.\
    \ 10 and 10\n\n**Answer:** 2. 10 and 5\n\n**Explanation:** Inside the `myFunction`\
    \ function, there is a local variable `x` with a value of 10, which is different\
    \ from the global variable `x` with a value of 5. So, the first `console.log`\
    \ outputs 10, and the second `console.log` outputs 5.\n\n### What does the `isNaN()`\
    \ function in JavaScript do?\n\n1. It checks if a value is not a string.\n2. It\
    \ checks if a value is not a number.\n3. It checks if a value is not an array.\n\
    4. It checks if a value is not an object.\n\n**Answer:** 2. It checks if a value\
    \ is not a number.\n"
