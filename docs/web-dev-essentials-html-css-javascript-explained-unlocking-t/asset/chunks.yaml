    Event occurs when the user clicks on an HTML element


    The click event occurs when a user clicks on an HTML element. It''s one of the
    most commonly used events in web applications.


    Example:


    <button id="myButton">Click me</button>


    <script>


    document.getElementById(''myButton'').addEventListener(''click'', () => {


    alert(''Button clicked!'');


    });


    </script>


    How to stop the propagation of an event


    To stop the propagation of an event, use the stopPropagation method on the event
    object. This prevents further propagation of the current event in the capturing
    and bubbling phases.


    Example:


    <div id="parent">


    <button id="child">Click me</button>


    </div>


    <script>


    document.getElementById(''parent'').addEventListener(''click'', () => {


    console.log(''Parent clicked'');


    });


    document.getElementById(''child'').addEventListener(''click'', (e) => {


    console.log(''Child clicked'');


    e.stopPropagation(); // Stops the event from bubbling up


    });


    </script>


    Tips:


    Use stopPropagation judiciously, as it can prevent other intended event handlers
    from executing.


    It''s useful in scenarios where you don''t want a parent handler to be triggered
    after a specific action on a child element.


    Understanding these concepts is crucial for handling user interactions in web
    applications, allowing you to create more engaging and responsive interfaces.
    Remember, effective event handling is key to manipulating the DOM in response
    to user actions.


    ## JavaScript Syntax and Operators


    How to add a comment in a JavaScript file


    In JavaScript, you can add comments using either single-line (//) or multi-line
    (/* */) comment syntax.


    Example:


    // This is a single-line comment


    let x = 5; // This comment is inline with code


    /* This is a


    multi-line comment */


    let y = 10;


    What the spread operator does


    The spread operator (...) allows an iterable such as an array or string to be
    expanded in places where zero or more arguments or elements are expected. It is
    commonly used for array or object cloning and concatenation.


    Example:


    let arr1 = [1, 2, 3];


    let arr2 = [...arr1, 4, 5]; // [1, 2, 3, 4, 5]


    How to correctly round the number 7.25 to the nearest integer in JavaScript


    The Math.round() method correctly rounds a number to the nearest integer.


    Example:


    console.log(Math.round(7.25)); // 7


    What the !! (double exclamation point) operator does


    The !! operator is used to convert a value to its equivalent boolean representation.


    Example:


    let truthyValue = !!1; // true


    let falsyValue = !!0; // false


    What the || operator represents


    The || operator is a logical OR. It returns the value of its first operand if
    it is truthy; otherwise, it returns the value of the second operand.


