    # CSS Tip and Basics


    ## Introduction to CSS: Tips and Basics


    Cascading Style Sheets (CSS) is a cornerstone technology of the World Wide Web,
    alongside HTML and JavaScript. It is designed to enable the separation of presentation
    and content, including layout, colors, and fonts. This separation improves content
    accessibility, provides more flexibility and control in the specification of presentation
    characteristics, enables multiple web pages to share formatting, and reduces complexity
    and repetition in the structural content.


    Purpose: It''s used for designing and customizing the appearance of web pages
    by styling HTML elements.


    ## Understanding CSS Syntax


    CSS is composed of rulesets. Each ruleset consists of a selector and a declaration
    block:


    HTML Tag for Defining an Internal Style Sheet:


    Use the <style> tag within the HTML document''s <head> section.


    <head>


    <style>


    body { background-color: lightblue; }


    </style>


    </head>


    Tip: Internal style sheets are useful for single-page styles. For larger projects,
    external CSS files are recommended.


    Selecting an Element with ID "demo" in CSS:


    Use the hashtag # followed by the I4.


    #demo {


    color: blue;


    }


    Tip: IDs are unique to each element, making #demo select the specific element
    with id="demo".


    Selecting Elements with Class Name "example":


    Use the dot . followed by the class name.


    .example {


    font-size: 20px;


    }


    Tip: Class selectors are used to select and style all elements with the specified
    class attribute.


    Capitalizing Each Word in a Text:


    Use the text-transform property with value capitalize.


    p {


    text-transform: capitalize;


    }


    Tip: This property capitalizes the first letter of each word in the selected element(s).


    Changing the Background Color:


    Use the background-color property.


    body {


    background-color: lightgray;


    }


    Tip: You can use color names, RGB, RGBA, HEX, etc., as values for this property.


    Changing the Font of an Element:


    Use the font-family property.


    p {


    font-family: Arial, sans-serif;


    }


    Tip: Always provide a fallback font (like sans-serif or serif) in case the first
    choice font isn''t available.


    Making a List with Square Items:


    Use the list-style-type property on ul or li elements.


    ul {


    list-style-type: square;


    }


    Tip: This styles the bullet points of a list. Other values include circle, disc,
    none, etc.


    Selecting All <p> Elements Inside a <div>:


    Use descendant combinator (space) to select nested elements.


    div p {


    color: red;


    }


    Tip: This selects all <p> elements that are inside any <div> element.


    CSS Property for Text Size:


    Property: font-size


    p {


    font-size: 16px;


    }


    Tip: You can use different units like px, em, rem, or % for setting the size.'
