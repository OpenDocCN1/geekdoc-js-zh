  trans: "\n\n# 解释\nJavaScript 中的 `while` 循环语法写为 `while (condition) {...}`，只要条件求值为\
    \ `true`，大括号内的代码就会执行。\n\n这些问题涵盖了多种 JavaScript 主题，测试了基础知识以及更复杂的概念。\n\n### 以下 JavaScript\
    \ 代码的输出是什么？\n```javascript\nlet a = \"5\";\nlet b = 5;\nconsole.log(a === b);\n\
    ```\n1. true\n2. false\n3. `TypeError`\n4. undefined\n\n**答案:** 2. `false` \n\n\
    **解释：** 严格相等运算符 (`===`) 同时检查操作数的值和类型。在这种情况下，`a` 是字符串而 `b` 是数字，因此比较结果为 `false`。\n\
    \n### 在 JavaScript 中，使用哪种方法从数组末尾删除元素？\n\n1. `shift()`\n2. `pop()`\n3. `push()`\n\
    4. `unshift()`\n\n**答案:** 2. `pop()`\n\n**解释：** `pop()` 方法删除数组的最后一个元素并返回该元素。这会改变数组的长度。\n\
    \n### 如何声明一个不可重新赋值的 JavaScript 变量？\n\n1. `var variableName = value;`\n2. `let\
    \ variableName = value;`\n3. `const variableName = value;`\n4. `immutable variableName\
    \ = value;`\n\n**答案:** 3. `const variableName = value;`\n\n**解释：** `const` 关键字用于声明声明后不可重新赋值的\
    \ JavaScript 变量。\n\n### 在 JavaScript 中，以下表达式将返回什么？\n```javascript\ntypeof NaN\n\
    ```\n1. \"number\"\n2. \"NaN\"\n3. \"undefined\"\n4. \"object\"\n\n**答案:** 1.\
    \ \"number\"\n\n**解释：** JavaScript 中的 `NaN`（不是数字）被视为一个数值，因此 `typeof NaN` 返回 `\"\
    number\"`。\n\n### JavaScript 中 `Array.prototype.map()` 方法的目的是什么？\n\n1. 在数组的每个元素上执行函数并返回一个新数组。\n\
    2. 将数组的所有元素合并为一个单一值。\n3. 根据条件过滤元素并返回一个新数组。\n4. 检查数组中是否至少有一个元素通过测试。\n\n**答案:**\
    \ 1. 在数组的每个元素上执行函数并返回一个新数组。\n\n**解释：** `Array.prototype.map()` 创建一个新数组，其结果是在调用数组的每个元素上调用提供的函数的结果。\n\
    \n### 以下 JavaScript 代码输出什么？\n```javascript\nconsole.log(\"Hello\" || \"World\"\
    );\nconsole.log(\"Foo\" && \"Bar\");\n```\n1. \"Hello\" 和 \"Foo\"\n2. \"World\"\
    \ 和 \"Bar\"\n3. \"Hello\" 和 \"Bar\"\n4. \"World\" 和 \"Foo\"\n\n**答案:** 3. \"Hello\"\
    \ 和 \"Bar\"\n\n**解释：** 逻辑或 (`||`) 运算符返回第一个真值操作数，即 `\"Hello\"`。逻辑与 (`&&`) 运算符在第一个操作数为真值时返回第二个操作数，在这种\
    \ particular 情况下是 `\"Bar\"`。\n\n### 以下哪项是 JavaScript 中创建新对象的正确语法？\n\n1. `let obj\
    \ = new Object();`\n2. `let obj = {};`\n3. `let obj = Object.create(null);`\n\
    4. 以上所有\n\n**答案:** 4. 以上所有\n\n**解释：** 这三种方法都是在 JavaScript 中创建新对象的正确方式。`new Object()`\
    \ 和 `{}`（对象字面量语法）更常见，而 `Object.create(null)` 用于更复杂的情况，例如创建一个没有原型的对象。\n\n### 编写\
    \ JavaScript 数组的正确方式是什么？\n\n1. `let arr = new Array(\"item1\", \"item2\", \"item3\"\
    );`\n2. `let arr = [\"item1\", \"item2\", \"item3\"];`\n3. `let arr = Array(\"\
    item1\", \"item2\", \"item3\");`\n4. 以上所有\n\n**答案:** 4. 以上所有\n\n**解释：** 这三个语句都是在\
    \ JavaScript 中创建数组的有效方式。`new Array()` 和 `Array()` 是构造语法，而 `[]` 是数组字面量语法。\n\n###\
    \ 在 JavaScript 中，如何捕获异步操作期间抛出的错误？\n\n1. 使用 `try...catch` 块。\n2. 在 promise 上使用\
    \ `catch()` 方法。\n3. 使用 `onError` 事件处理程序。\n4. 均 1 和 2\n\n**答案:** 4. 以上 1 和 2\n\n\
    **解释：** 对于异步操作，可以使用 promise 上的 `catch()` 方法捕获错误。此外，还可以 `async/await` 语法。\n\n###\
    \ 以下 JavaScript 代码输出什么？\n```javascript\nconsole.log(1 + \"1\");\n```\n1. 11\n\
    2. 2\n3. \"11\"\n4. undefined\n\n**答案:** 3. \"11\"\n\n**解释：** 当使用 `+` 运算符处理字符串和数字时，JavaScript\
    \ 会执行类型转换，并在拼接它们之前将数字转换为字符串。\n\n### 使用哪种 JavaScript 方法将数组元素通过指定的分隔符连接成字符串？\n\n\
    1. `join()`\n2. `concat()`\n3. `split()`\n4. `merge()`\n\n**答案:** 1. `join()`\n\
    \n**解释：** JavaScript 中的 `join()` 方法用于将数组的元素连接成字符串。\n\n### JavaScript 中 `Array.prototype.filter()`\
    \ 方法的目的是什么？\n\n1. 在数组的每个元素上执行函数并返回一个新数组。\n2. 将数组的所有元素合并为一个单一值。\n3. 根据条件过滤元素并返回一个新数组。\n\
    4. 检查数组中是否至少有一个元素通过测试。\n\n**答案:** 1. 在数组的每个元素上执行函数并返回一个新数组。\n\n**解释：** `Array.prototype.filter()`\
    \ 创建一个新数组，其结果是在调用数组的每个元素上调用提供的函数且该函数返回值为 `true` 时的元素。\n\n### 以下 JavaScript 代码输出什么？\n\
    ```javascript\nconsole.log([1, 2, 3].filter(n => n > 1));\n```\n1. [2, 3]\n2.\
    \ [1]\n3. [1, 2, 3]\n4. undefined\n\n**答案:** [2, 3]\n\n**解释：** `filter()` 方法返回一个包含通过实现测试的元素的数组。\n"
