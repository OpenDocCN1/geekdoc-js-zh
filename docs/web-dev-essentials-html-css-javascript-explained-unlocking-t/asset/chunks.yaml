- fmt: "\nExplanation: The `order` property in CSS is used to control the order of\
    \ items in a `Grid` layout.\n\nCode Sample:\n```css\nitem {\n  order: 2; /* Sets\
    \ the order of the Grid item */\n}\n```\n\nThese questions continue to cover various\
    \ CSS properties, selectors, and layout techniques, helping to deepen your understanding\
    \ of CSS.\n\n# Learn JavaScript\n\n## Variables and Scoping\n\nThe `let` keyword\
    \ in JavaScript is used to declare a block-scoped local variable, optionally initializing\
    \ it to a value. This is different from the `var` keyword, which declares a variable\
    \ globally or locally to an entire function regardless of block scope.\n\nExample:\n\
    \n```javascript\nlet x = 10;\nif (true) {\n  let x = 20; // Here x is 20\n  console.log(x);\n\
    }\nconsole.log(x); // Here x is 10\n```\n\nTips:\n- Use `let` for variables that\
    \ are intended to be re-assigned.\n- `let` provides block scoping, which can prevent\
    \ several common bugs in JavaScript.\n\n### Primitive data types\n\nJavaScript\
    \ has several primitive data types: `String`, `Number`, `BigInt`, `Boolean`, `Undefined`,\
    \ `Symbol`, and `Null`. Any type that is not among these is not considered a primitive.\
    \ For example, `Object` is not a primitive data type.\n\nTips:\n- Primitive types\
    \ in JavaScript are immutable and passed by value.\n- Understand the difference\
    \ between primitives and objects (non-primitives), as this affects how you manipulate\
    \ these types in your code.\n\n### The correct syntax to create an array\n\nArrays\
    \ in JavaScript can be created using the array literal notation or the `Array`\
    \ constructor.\n\nExample:\n\n```javascript\nlet arrayLiteral = [1, 2, 3];\nlet\
    \ arrayConstructor = new Array(1, 2, 3);\n```\n\nTips:\n- Prefer the array literal\
    \ syntax as it is more concise and less error-prone.\n- Remember that arrays in\
    \ JavaScript are dynamic and can store elements of different types.\n\n### Declaring\
    \ a JavaScript variable that cannot be reassigned\n\nThe `const` keyword in JavaScript\
    \ is used to declare a variable that cannot be reassassigned. However, note that\
    \ if the variable is an object or array, its properties or elements can still\
    \ be modified.\n\nExample:\n\n```javascript\nconst x = 10;\n// x = 20; // This\
    \ will throw an error\nconst obj = { key: 'value' };\nobj.key = 'newValue'; //\
    \ This is allowed\n```\n\nTips:\n- Use `const` for variables that you know will\
    \ not need to be re-assigned.\n- `const` also provides block scoping similar to\
    \ `let`.\n\n### The correct way to write a JavaScript array\n\nThe correct way\
    \ to write an array in JavaScript is using array literals or the `Array` constructor.\
    \ The array literal notation is preferred for its simplicity and readability.\n\
    \nExample:\n\n```javascript\nlet fruits = [\"Apple\", \"Banana\", \"Cherry\"];\n\
    ```\n\nTips:\n- Arrays can be modified after creation: you can add, remove, or\
    \ change elements.\n- Arrays are zero-indexed in JavaScript, meaning the first\
    \ element is at index 0.\n\n### Operator that is used to assign a value to a variable\n\
    \nThe assignment operator (`=`) in JavaScript is used to assign values to variables.\n\
    \nExample:\n\n```javascript\nlet myVar;\nmyVar = 5;\n```\n\nTips:\n- Be aware\
    \ of the difference between the assignment operator (`=`) and the equality operators\
    \ (`==` and `===`).\n- JavaScript also provides compound assignment operators\
    \ like `+=`, `-=`, etc., which combine arithmetic operations with assignment.\n\
    \n## Functions and Arrow Functions\n\n### JavaScript's arrow functions\n\nArrow\
    \ functions, introduced in ES6, offer a concise syntax and lexically bind the\
    \ `this` value. Key properties include:\n- No own `this`, `arguments`, `super`,\
    \ or `new.target` bindings. The value of `this` inside an arrow function remains\
    \ the same throughout the lifecycle of the function and is always bound to the\
    \ value of `this` in the closest non-arrow parent function.\n- Cannot be used\
    \ as constructors (you cannot use `new` with arrow functions).\n- They don't have\
    \ a `prototype` property.\n- Suitable for non-method functions.\n\nExample:\n\n\
    ```javascript\nconst add = (a, b) => a + b;\nconsole.log(add(2, 3)); // Output:\
    \ 5\n```\n\nTips:\n- Use arrow functions for simple operations or when you need\
    \ to maintain the lexical value of `this`.\n- Avoid using them as methods in objects\
    \ where you need to access other properties of the object using `this`.\n\n###\
    \ Not a valid way to declare a function\n\nInvalid ways to declare a function\
    \ might involve syntax errors or using reserved keywords. The standard ways to\
    \ declare functions are:\n- Function Declaration: `function myFunction() {}`\n\
    - Function Expression: `const myFunction = function() {};`\n- Arrow Function Expression:\
    \ `const myFunction = () => {};`\n\nExample of invalid declaration:\n\n```javascript\n\
    function const() {} // 'const' is a reserved keyword\n```\n\n### How to get the\
    \ total number of arguments passed to a function\n\nUse the `arguments` object,\
    \ an array-like object, accessible inside functions that provides the number of\
    \ arguments passed to the function.\n\nExample:\n\n```javascript\nfunction countArguments()\
    \ {\n  return arguments.length;\n}\nconsole.log(countArguments(1, 2, 3)); // Output:\
    \ 3\n```\n\nTips:\n- `arguments` works with traditional function expressions and\
    \ declarations, not with arrow functions.\n- For arrow functions, you can use\
    \ rest parameters (`...args`) to achieve similar functionality.\n\n### JavaScript\
    \ Callback Function\n\nA callback function is a function passed into another function\
    \ as an argument and is expected to be executed at some point during the execution\
    \ of that function.\n\nExample:\n\n```javascript\nfunction greeting(name, callback)\
    \ {\n  console.log('Hello ' + name);\n  callback();\n}\ngreeting('Alice', function()\
    \ {\n  console.log('Callback invoked');\n});\n```\n\nTips:\n- Callbacks provide\
    \ a way to ensure certain code doesn’t execute until other code has already finished\
    \ execution (asynchronous operations).\n\n### Primary use of the bind method\n\
    \nThe `bind` method creates a new function that, when called, has its `this` keyword\
    \ set to the provided value. It is used to pass a specific object to a function.\n\
    \nExample:\n\n```javascript\nconst obj = {\n  value: 20,\n  getValue: function()\
    \ {\n    return this.value;\n  }\n};\nconst getValueCopy = obj.getValue.bind(obj);\n\
    console.log(getValueCopy()); // Output: 20\n```\n\nTips:\n- `bind` is particularly\
    \ useful for event handlers and callbacks.\n\n### Declare a class\n\nClasses in\
    \ JavaScript are declared using the `class` keyword. Classes are syntactic sugar\
    \ over JavaScript's prototype-based inheritance.\n\nExample:\n\n```javascript\n\
    class MyClass {\n  constructor(name) {\n    this.name = name;\n  }\n  greet()\
    \ {\n    console.log(`Hello, ${this.name}!`);\n  }\n}\nconst obj = new MyClass('Alice');\n\
    obj.greet(); // Output: Hello, Alice!\n```\n\nTips:\n- Use classes to create objects\
    \ with shared behavior (methods) and internal state (properties).\n\n## Array\
    \ Methods and Operations\n\n### What the unshift method does in an array\n\nThe\
    \ `unshift` method adds one or more elements to the beginning of an array and\
    \ returns the new length of the array.\n\nExample:\n\n```javascript\nlet array\
    \ = [2, 3, 4];\narray.unshift(1); // Returns 4\nconsole.log(array); // [1, 2,\
    \ 3, 4]\n```\n\nTips:\n- Remember, `unshift` modifies the original array.\n- It\
    \ can take multiple arguments to add multiple elements at once.\n\n### Correct\
    \ method to create a new and empty array in JavaScript\n\nThe most common way\
    \ to create a new and empty array is using array literals.\n\nExample:\n\n```javascript\n\
    let newArray = [];\n```\n\nTips:\n- Prefer array literals over `new Array()` due\
    \ to simplicity and readability.\n\n### How to remove a specific element from\
    \ an array\n\nTo remove a specific element, you can use the `splice` method or\
    \ `filter` method. `splice` changes the original array, while `filter` returns\
    \ a new array.\n\nExample using `splice`:\n\n```javascript\nlet array = [1, 2,\
    \ 3, 4];\narray.splice(2, 1); // Removes the element at index 2\nconsole.log(array);\
    \ // [1, 2, 4]\n```\n"
