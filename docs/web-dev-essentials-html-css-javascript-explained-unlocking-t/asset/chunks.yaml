    2.  "Java"


    3.  "JavaScript"


    4.  "Scrip"


    Answer: 1\. "Script"


    Explanation: str.substring(4) extracts characters from the 4th index (inclusive)
    to the end of the string, resulting in "Script".


    What is the result of the following expression in JavaScript?


    "2" + 2 * "2"


    1.  "24"


    2.  2\. 6


    3.  "222"


    4.  NaN


    Answer: 1\. "24"


    Explanation: In this expression, JavaScript first evaluates the multiplication
    (2 * "2" = 4) and then performs string concatenation ("2" + 4), resulting in "24".


