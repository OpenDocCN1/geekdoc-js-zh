    ```


    ### JavaScript 闭包


    闭包是一个记得其外部作用域变量并可以访问这些变量的函数。


    ### JavaScript 函数中 `this` 关键字的默认行为


    在普通函数中，`this` 指向全局对象（浏览器中的 `window`）。在方法（对象内部的函数）中，`this` 指向该对象。


