  trans: "\n\n# 显示不带下线的链接\n\n属性：`text-decoration`\n\n```css\na {\n  text-decoration:\
    \ none;\n}\n```\n提示：此属性也用于添加下划线、上划线或删除线等装饰。\n\n# 更改元素的左边距\n\n属性：`margin-left`\n\
    \n```css\ndiv {\n  margin-left: 20px;\n}\n```\n提示：你也可以使用 `margin` 简写来设置所有侧向的边距。\n\
    \n# 使文本加粗\n\n属性：`font-weight`\n\n```css\nstrong {\n  font-weight: bold;\n}\n```\n\
    提示：除了加粗，你还可以使用数值（如 `700`）作为权重。\n\n# 设置单词之间的间距\n\n属性：`word-spacing`\n\n```css\n\
    p {\n  word-spacing: 5px;\n}\n```\n提示：调整该值可以增加或减少单词之间的空间。\n\n# 修改字体名称\n\n属性：`font-family`\n\
    \n```css\nbody {\n  font-family: 'Arial', sans-serif;\n}\n```\n提示：始终提供一个备用字体。如果字体名称包含空格，请使用引号。\n\
    \n# 为框框的所有侧显示边框\n\n属性：`border`\n\n```css\ndiv {\n  border: 2px solid black;\n\
    }\n```\n提示：`border` 简写设置了边框的宽度、样式和颜色。\n\n# 更改元素的字体颜色\n\n属性：`color`\n\n```css\n\
    h1 {\n  color: blue;\n}\n```\n提示：`color` 可以使用名称、`HEX`、`RGB` 或 `HSL` 值来指定。\n\n\
    # Position 属性的默认值\n\n默认值：`static`\n\n在 `static` 定位中，元素根据文档的普通流进行定位。\n\n# 在 CSS\
    \ 中创建圆形\n\n```css\n.circle {\n  width: 100px;\n  height: 100px;\n  background-color:\
    \ red;\n  border-radius: 50%;\n}\n```\n提示：`border-radius: 50%` 将正方形转换为圆形。确保 `height`\
    \ 和 `width` 相等。\n\n# 为具有两个特定类的组件应用 CSS 样式\n\n语法：使用点 `.` 连接类名且不留任何空格。\n\n```css\n\
    .classOne.classTwo {\n  color: green;\n}\n```\n示例 HTML：`<div class=\"classOne\
    \ classTwo\">Text</div>`\n提示：此规则将仅适用于同时具有 `classOne` 和 `classTwo` 的元素。\n\n## CSS\
    \ 选择器与特殊性：示例指南\n\n# 设置元素的背景图像\n\n属性：`background-image`\n\n```css\ndiv {\n  background-image:\
    \ url('image.jpg');\n}\n```\n提示：`URL` 应该指向你想要设置为背景的图像。可以是相对路径或绝对路径。\n\n# 将列表项设置为内联显示\n\
    \n属性：`display`\n\n```css\nli {\n  display: inline;\n}\n```\n提示：这会让列表项以行形式显示，而不是默认的垂直堆叠。\n\
    \n# 控制 `<fieldset>` 元素的布局和格式\n\n属性：使用了如 `width`、`margin`、`padding`、`border` 等通用布局属性。\n\
    \n```css\nfieldset {\n  border: 2px solid gray;\n  padding: 10px;\n  width: 50%;\n\
    }\n```\n提示：使用这些标准 CSS 属性自定义你的 `<fieldset>` 元素，以适应表单布局。\n\n# 使用 CSS 创建圆角\n\n属性：`border-radius`\n\
    \n```css\ndiv {\n  border-radius: 10px;\n}\n```\n提示：`border-radius` 属性可以接受像素值或百分比来创建圆形或椭圆形。\n\
    \n# 选择带有 <div> 父元素的所有 `<p>` 元素\n\n选择器：后代选择器（空格）\n\n```css\ndiv p {\n  color: blue;\n\
    }\n```\n提示：此选择器针对 `<div>` 元素内部所有的 `<p>` 元素。\n\n# 为元素添加阴影\n\n属性：`box-shadow`\n\n\
    ```css\ndiv {\n  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5);\n}\n```\n提示：`box-shadow`\
    \ 属性接受水平偏移、垂直偏移、模糊和颜色的值。\n\n# CSS 中 `h1 + p` 的含义\n\n表示：相邻兄弟选择器。它选择紧接在 `<h1>` 之后的\
    \ `<p>` 元素。\n\n```css\nh1 + p {\n  font-weight: bold;\n}\n```\n提示：当你想要对跟随另一个特定元素的元素设置样式时，这非常有用。\n\
    \n# 设置表格单元之间的间距\n\n属性：`border-spacing`\n\n```css\ntable {\n  border-spacing: 5px;\n\
    }\n```\n提示：此属性设置相邻单元格边框之间的距离。\n\n# 设置元素的透明度\n\n属性：`opacity`\n\n```css\ndiv {\n\
    \  opacity: 0.5; /* 50% 透明度 */\n}\n```\n提示：`opacity` 的范围从 `0`（完全透明）到 `1`（完全不透明）。\n\
    \n# `z-index` 属性的作用\n\n功能：控制元素的堆叠顺序。\n\n```css\ndiv {\n  position: relative;\n\
    \  z-index: 10;\n}\n```\n提示：`z-index` 较高的元素会覆盖值较低的元素。它适用于 `position` 值不为 `static`\
    \ 的元素。\n\n## CSS 中的布局与定位\n\n# CSS `Display` 属性的功能\n\n目的：`display` 属性指定元素的显示方式。\n\
    \n```css\ndiv {\n  display: none; /* 隐藏元素 */\n}\n\nspan {\n  display: block; /*\
    \ 让内联元素表现得像块级元素 */\n}\n```\n提示：常见值包括 `block`、`inline-block`、`none` 以及最近的 `flex`\
    \ 和 `grid`。\n\n# 选择 <div> 的所有子 `<p>` 元素\n\n选择器：子选择器（`>`）\n\n```css\ndiv > p {\n\
    \  color: blue;\n}\n```\n提示：此选择器仅针对 `<div>` 的直接子 `<p>` 元素。\n\n# CSS 单位\n\n无效单位：`pt`\
    \ 是单位。\n有效单位：`px`、`em`、`rem`、`%`、`vh`、`vw` 等。\n\n# CSS 中 `Overflow` 属性的作用\n\n\
    功能：控制超出容器边界的内容。\n\n```css\ndiv {\n  overflow: hidden; /* 隐藏超出 div 框的内容 */\n}\n\
    ```\n提示：其他值还包括 `scroll`、`auto` 和 `visible`。\n\n# `visibility` 和 `display` 的区别\n\
    \n`visibility: hidden` 使元素不可见，但在布局中仍占据空间。\n`display: none` 将元素从文档流中移除且不占用空间。\n\
    \n```css\nhidden {\n  visibility: hidden;\n}\n\ngone {\n  display: none;\n}\n\
    ```\n提示：使用 `display: none` 完全移除元素，使用 `visibility: hidden` 留留空间。\n\n# 悬停时更改光标类型\n\
    \n属性：`cursor`\n\n```css\nbutton:hover {\n  cursor: pointer; /* 悬停在按钮上时将光标变为手型\
    \ */\n}\n```\n提示：`cursor` 可以设置为 `default`、`pointer`、`crosshair` 等各种值。\n\n# 在 CSS\
    \ 中 `:nth-child()` 伪类\n\n目的：选择父元素的第 n 个孩子。\n\n```css\np:nth-child(2) {\n  color:\
    \ blue; /* 选择第二个 <p> 元素 */\n}\n```\n提示：可以使用如 `:nth-child(2n+1)` 的公式进行复杂选择。\n\n\
    # CSS 中的默认定位值\n\n默认值：`static`\n\n在 `static` 定位中，元素根据文档的普通流进行定位。\n\n# CSS 文件中的注释\n\
    \n语法：使用 `/* 注 */`。\n\n```css\n/* 这是一个注释 */\nbody {\n  background-color: white;\n\
    }\n```\n提示：使用注释解释 CSS 代码，使其更容易理解和维护。\n\n## CSS 盒模型、边框与布局\n\n# 创建元素周围的空间（外边距）\n\
    \n属性：`margin`\n\n```css\ndiv {\n  margin: 10px; /* 在 div 周围创建 10px 空间 */\n}\n\
    ```\n提示：`margin` 可以单独设置每个侧（例如 `margin-top`、`margin-right` 等）或使用简写。\n\n# CSS Flex\
    \ 布局中的 `Flex` 属性\n\n功能：在弹性容器中，`flex` 属性指定弹性 项目如何增长或缩小。\n\n```css\n.flex-item {\n\
    \  flex: 1; /* Flex 项目将增长以填充空间 */\n}\n```\n提示：`flex` 是 `flex-grow`、`flex-shrink`\
    \ 和 `flex-basis` 的简写。\n\n# CSS 中 `Clear` 属性的作用\n\n功能：防止浮动元素影响所应用的元素。\n\n```css\n\
    div {\n  clear: both; /* 左右浮动元素都不会影响此 div */\n}\n```\n提示：通常用于涉及浮动元素的布局，确保间距一致。\n\
    \n# 控制 CSS 换行\n\n属性：`white-space`\n\n```css\np {\n  white-space: nowrap; /* 防止文本换行\
    \ */\n}\n```\n提示：其他值包括 `normal`、`pre`、`pre-wrap` 和 `pre-line`。\n\n# 创建数字列表\n\n\
    HTML 元素：`<ol>`（有序列表）\n\n```html\n<ol>\n  <li>第一项</li>\n  <li>第二项</li>\n</ol>\n\
    ```\n提示：`<ol>` 自动创建数字列表，每个项目使用 `<li>`。\n\n# 使内容远离边框的空间（内边距）\n\n属性：`padding`\n\n\
    ```css\ndiv {\n  padding: 15px; /* 在内容与 div 边框之间添加空间 */\n}\n```\n提示：`padding`\
    \ 增加元素内部空间，而边距则创建外部空间。\n\n# 大多数元素的默认显示值：\n\n"
- fmt: "\nDefault Value: block for elements like `<div>`, `<p>`, etc., and inline\
    \ for elements like `<span>`, `<a>`, etc.\n\n## Function of the `:after` Pseudo-Element\n\
    \nPurpose: Inserts content after the content of the selected element.\n\n```css\n\
    p:after {\n  content: ' *'; /* Adds an asterisk after every paragraph */\n}\n\
    ```\n\nTip: Commonly used for decorative elements or to append content.\n\n##\
    \ Selecting Every `<p>` Element Whose Parent is Not a `<div>`\n\nSelector: `:not()`\
    \ and direct child combinator (`>`)\n\n```css\n:not(div) > p {\n  color: red;\
    \ /* Styles <p> elements that are not direct children of <div> */\n}\n```\n\n\
    Tip: This selector is versatile for excluding specific parent-child relationships.\n\
    \n## Changing Style of the Bottom Border\n\nProperty: `border-bottom`\n\n```css\n\
    div {\n  border-bottom: 2px solid blue; /* Sets a blue bottom border for div */\n\
    }\n```\n\nTip: Similar properties exist for `border-top`, `border-left`, and `border-right`.\n\
    \n## Effect of `position: relative;` in CSS\n\nFunction: This property sets the\
    \ element's position relative to its normal position.\n\n```css\ndiv {\n  position:\
    \ relative;\n  top: 10px; /* Moves the div 10px down from its original position\
    \ */\n}\n```\n\nTip: Relative positioning doesn’t remove the element from the\
    \ normal document flow, unlike absolute positioning.\n\n## Transformations and\
    \ Animations in CSS: Essential Techniques and Examples\n\n### Changing Color of\
    \ an Element on Mouse Hover\n\nProperty: `:hover` pseudo-class\n\n```css\nbutton:hover\
    \ {\n  color: red; /* Changes the text color to red when the mouse hovers over\
    \ it */\n}\n```\n\nTip: The `:hover` pseudo-class can be applied to almost any\
    \ element, not just links.\n\n### Creating a Drop Shadow Effect\n\nProperty: `box-shadow`\n\
    \n```css\ndiv {\n  box-shadow: 5px 5px 10px grey; /* Adds a grey shadow to the\
    \ div */\n}\n```\n\nTip: `box-shadow` can accept multiple values to create complex\
    \ shadow effects.\n\n### Controlling Space Between Letters\n\nProperty: `letter-spacing`\n\
    \n```css\np {\n  letter-spacing: 2px; /* Increases the space between letters */\n\
    }\n```\n\nTip: Negative values are allowed to reduce the space between letters.\n\
    \n### Changing Order of Flex Items\n\nProperty: `order` in Flexbox\n\n```css\n\
    flex-item {\n  order: 2; /* Changes the order of this flex item */\n}\n```\n\n\
    Tip: Items in a flex container can be reordered without changing the HTML structure.\n\
    \n### Center Aligning Text Horizontally\n\nProperty: `text-align`\n\n```css\n\
    p {\n  text-align: center; /* Horizontally centers the text inside a paragraph\
    \ */\n}\n```\n\nTip: `text-align: center;` is one of the most commonly used properties\
    \ for text alignment.\n\n### Adding a Border to an Element\n\nProperty: `border`\n\
    \n```css\ndiv {\n  border: 1px solid black; /* Adds a solid black border */\n\
    }\n```\n\nTip: The `border` property is shorthand for `border-width`, `border-style`,\
    \ and `border-color`.\n\n### Making Font Italic\n\nProperty: `font-style`\n\n\
    ```css\np {\n  font-style: italic; /* Makes the paragraph text italic */\n}\n\
    ```\n\nTip: Other values for `font-style` include `normal` and `oblique`.\n\n\
    ### Creating Rounded Corners with Specific Radius\n\nProperty: `border-radius`\n\
    \n```css\ndiv {\n  border-radius: 10px; /* Rounds the corners of the div */\n\
    }\n```\n\nTip: You can specify different radii for each corner (e.g., `border-radius:\
    \ 10px 5px 15px 20px;` for top-left, top-right, bottom-right, and bottom-left\
    \ respectively).\n\n### Making Text Bold\n\nProperty: `font-weight`\n\n```css\n\
    strong {\n  font-weight: bold; /* Makes the text within <strong> bold */\n}\n\
    ```\n\nTip: Besides bold, you can also specify numeric values for weight (e.g.,\
    \ 700).\n\n## Spacing and Alignment in CSS: Examples\n\n### Specifying Space Between\
    \ Lines of Text\n\nProperty: `line-height`\n\n```css\np {\n  line-height: 1.5;\
    \ /* Sets the space between lines to 1.5 times the normal line space */\n}\n```\n\
    \nTip: `line-height` can improve readability, especially in large blocks of text.\n\
    \n### Applying Styles to the First Letter of a Text Element\n\nPseudo-element:\
    \ `::first-letter`\n\n```css\np::first-letter {\n  font-size: 200%;\n  color:\
    \ blue;\n}\n```\n\nTip: This is often used to create a drop cap or stylize the\
    \ first letter of a paragraph.\n\n### Transforming Text to Uppercase\n\nProperty:\
    \ `text-transform: uppercase;`\n\n```css\np {\n  text-transform: uppercase; /*\
    \ Converts all text in the paragraph to uppercase */\n}\n```\n\nTip: Other values\
    \ for `text-transform` include `lowercase`, `capitalize`, and `none`.\n\n### Purpose\
    \ of the `rgba()` Color Format\n\nFunction: Allows specifying colors with an alpha\
    \ channel (transparency level).\n\n```css\ndiv {\n  background-color: rgba(255,\
    \ 0, 0, 0.5); /* Semi-transparent red */\n}\n```\n\nTip: The `rgba()` format is\
    \ useful for creating overlay effects or semi-transparent elements.\n\n### Controlling\
    \ Width of an Element's Border\n\nProperty: `border-width`\n\n```css\ndiv {\n\
    \  border-width: 5px; /* Sets a 5px border width */\n}\n```\n\nTip: You can specify\
    \ individual border widths for each side (e.g., `border-width: 1px 2px 3px 4px;`).\n\
    \n### Changing Background Color on Mouse Hover\n\nProperty: `:hover` pseudo-class\
    \ with `background-color`\n\n```css\nbutton:hover {\n  background-color: lightblue;\
    \ /* Changes background color when hovered */\n}\n```\n\nTip: This property is\
    \ widely used for interactive elements like buttons and links to improve experience.\n\
    \n### Specifying List Items\n\nProperty: `list-style`\n\n```css\nul {\n  list-style-type:\
    \ square; /* Uses squares as list item */\n}\n```\n\nTip: For ordered lists (<ol>).\n\
    \n### Purpose of the `overflow-x` Property\n\nFunction: Controls horizontal overflow\
    \ horizontally.\n\n```css\ndiv {\n  overflow-x: scroll; /* Adds a horizontal scrollbar\
    \ */\n}\n```\n\nTip: Use `overflow-x` when you want to control horizontal.\n\n\
    ### Selecting Even Rows of a Table\n\nSelector: `:nth-child()` pseudo-class\n\n\
    ```css\ntr:nth-child(even) {\n  background-color: lightgray; /* Styles even rows\
    \ */\n}\n```\n\nTip: `nth-child(2n)` represents an even pattern.\n\n### Purpose\
    \ of `text-decoration: underline;`\n\nFunction: Adds an underline to the text.\n\
    \n```css\na {\n  text-decoration: underline; /* Underlines link */\n}\n```\n\n\
    Tip: Commonly used for highlighting text.\n\n## Pseudo-Classes and Elements in\
    \ CSS: Comprehensive Exploration\n\n### Changing Color of Visited Links\n\nProperty:\
    \ `:visited` pseudo-class\n\n```css\na:visited {\n  color: purple;\n}\n```\n\n\
    Tip: Use `:visited` to style links once they have been clicked.\n\n### Applying\
    \ Styles to Every Second Element\n\nPseudo-class: `:nth-child()`\n\n```css\nli:nth-child(2n)\
    \ {\n  color: blue; /* Styles every list item */\n}\n```\n\nTip: The `2n` in `nth-child(2n)`\
    \ selects every second element.\n\n### Controlling Order of Columns in CSS Grid\n\
    \nProperty: `order` within a grid item\n\n```css\ngrid-item {\n  order: 2; /*\
    \ Positions this item second in the layout */\n}\n```\n\nTip: The `order` property\
    \ works in both Flexbox and CSS Grid.\n\n### The `display: inline-block;` Property\n\
    \nFunction: Allows an element to flow like an inline element but retains block-level\
    \ capabilities.\n\n```css\nspan {\n  display: inline-block;\n  width: 50px;\n\
    \  height: 50px;\n}\n```\n\nTip: `inline-block` is useful for aligning elements\
    \ side by side while being able to set width and height.\n\n### Selecting the\
    \ First Child of a Specific Element\n\nPseudo-class: `:first-child`\n\n```css\n\
    p:first-child {\n  font-weight: bold; /* Styles the first element in its parent\
    \ */\n}\n```\n\nTip: This selector targets the first occurrence of the element\
    \ within its parent.\n\n### Purpose of `text-align: center;`\n\nFunction: Horizontally\
    \ centers the inline content of an element.\n\n```css\ndiv {\n  text-align: center;\
    \ /* Centers the text inside the div */\n}\n```\n\nTip: It's commonly used for\
    \ centering text or inline elements within a block-level element.\n\n### Control\
    \ by `background-repeat` Property\n\nFunction: Determines how background images\
    \ are repeated.\n\n```css\nbody {\n  background-image: url('image.jpg');\n  background-repeat:\
    \ no-repeat; /* The image will not be repeated */\n}\n```\n\nTip: Other values\
    \ include `repeat`, `repeat-x`, `repeat-y`.\n\n### Controlling Space Between Columns\
    \ in CSS Grid\n\nProperty: `grid-column-gap` or `column-gap` in newer specifications\n\
    \n```css\ngrid-container {\n  display: grid;\n  column-gap: 20px; /* Sets the\
    \ gap between columns */\n}\n```\n"
