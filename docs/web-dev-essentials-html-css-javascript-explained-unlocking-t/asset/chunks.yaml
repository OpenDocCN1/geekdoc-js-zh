  trans: "\n\nTip：`column-gap` 是现代 `Grid Layout` 规范的一部分，提供了一种设置间隙的标准方法。\n\n## 在 Flexbox\
    \ 中控制元素的顺序\n\n属性：flex 项目（flex item）中的 `order`。\n\n```css\nflex-item {\n  order:\
    \ 1; /* 此项目将首先被定位 */\n}\n```\n\nTip：这在响应式布局中特别有用，`order` 可能会根据屏幕尺寸发生变化。\n\n##\
    \ 具有特定属性的 CSS 类元素\n\n属性选择器：\n\n```css\ninput[type=\"text\"] {\n  border-color:\
    \ blue; /* 为所有文本类型的输入元素应用样式 */\n}\n```\n\nTip：此选择器根据属性定位目标元素，提供了一种条件应用样式的强大方法。\n\
    \n## CSS 中的样式与效果\n\n### Flexbox 布局中的 flex-direction\n\n功能：确定 flex 容器内 flex 项目的方向。\n\
    \n```css\nflex-container {\n  display: flex;\n  flex-direction: column; /* 将 flex\
    \ 项目垂直堆叠 */\n}\n```\n\nTip：其他值还包括 `row`、`row-reverse` 和 `column-reverse`。\n\n\
    ### white-space: nowrap; 的目的\n\n功能：防止文本换到新行。\n\n```css\np {\n  white-space: nowrap;\
    \ /* 保持文本在单行 */\n}\n```\n\nTip：适用于不希望文本换行的情况，例如导航菜单中。\n\n### 在父元素悬停时应用样式\n\n```css\n\
    div:hover p {\n  color: red; /* 当其父元素 <div> 被悬停时为 <p> 设置样式 */\n}\n```\n\nTip：这是为父子关系创建交互悬停效果的常用技术。\n\
    \n## 字符间的间距\n\n属性：`letter-spacing`\n\n```css\np {\n  letter-spacing: 2px; /* 增加字符之间的空间\
    \ */\n}\n```\n\nTip：可以使用负值来紧凑字符间距。\n\n## 垂直文本对齐\n\n虽然 CSS 没有提供直接垂直对齐文本的方法，但一种常用技术是使用\
    \ `display: flex` 和 `align-items`。\n\n```css\ndiv {\n  display: flex;\n  align-items:\
    \ center; /* 在 div 中垂直居中文本 */\n  height: 100px;\n}\n```\n\nTip：Flexbox 是用于水平和垂直对齐的多功能工具。\n\
    \n### 选择特定元素类型的最后一个子元素\n\n伪类：`:last-child`\n\n```css\np:last-child {\n  font-weight:\
    \ bold; /* 为其父元素中的最后一个 <p> 元素设置样式 */\n}\n```\n\nTip：定位父元素内指定元素的最后一次出现。\n\n###\
    \ cursor: pointer; 属性\n\n功能：将光标更改为指针，表示这是一个可点击元素。\n\n```css\nbutton {\n  cursor:\
    \ pointer;\n}\n```\n\nTip：通常用于按钮、链接或其他交互元素。\n\n### text-overflow: ellipsis; 的目的\n\
    \n功能：当文本溢出容器时截断并显示省略号 (...)。\n\n```css\ndiv {\n  white-space: nowrap;\n  overflow:\
    \ hidden;\n  text-overflow: ellipsis;\n}\n```\n\nTip：确保 `overflow` 设置为 `hidden`\
    \ 且 `white-space` 设置为 `nowrap`，此功能才能生效。\n\n## 指定元素边框的样式\n\n属性：`border-style`\n\
    \n```css\ndiv {\n  border-style: dashed; /* 设置虚线边框 */\n}\n```\n\nTip：值包括 `solid`、`dotted`、`dashed`、`double`、`none`\
    \ 等。\n\n### font-family 属性\n\n功能：指定元素中文本使用的字体。\n\n```css\nbody {\n  font-family:\
    \ \"Arial\", sans-serif;\n}\n```\n\nTip：始终提供备用字体选项。\n\n### 控制透明度\n\n属性：`opacity`\n\
    \n```css\ndiv {\n  opacity: 0.5; /* 50% 透明 */\n}\n```\n\nTip：`opacity` 的值范围从 `0`（完全透明）到\
    \ `1`（完全不透明）。\n\n### 选择具有特定类的元素\n\n```css\nexample {\n  color: blue; /* 选择所有类为\
    \ 'example' 的元素 */\n}\n```\n\nTip：类选择器是 CSS 样式的骨干，因其通用性而被广泛使用。\n\n### box-sizing:\
    \ border-box; 属性\n\n功能：元素的尺寸包含内边距和边框。\n\n```css\ndiv {\n  box-sizing: border-box;\n\
    }\n```\n\nTip：使得 `width` 和 `height` 样式更具可预测性，特别是在添加内边距或边框时。\n\n### 选择特定区域内的链接\n\
    \n```css\n#sectionId a {\n  color: green; /* 为 id 为 'sectionId' 的元素内的所有 <a> 元素设置样式\
    \ */\n}\n```\n\nTip：将 `#sectionId` 替换为目标区域的实际 ID。\n\n## 在元素边框后创建投影\n\n属性：`box-shadow`\n\
    \n```css\ndiv {\n  box-shadow: 10px 10px 5px grey; /* 为 div 添加投影 */\n}\n```\n\n\
    Tip：使用 `box-shadow` 为元素添加深度，增强用户界面。\n\n### 选择特定类型的最后一个元素\n\n伪类：`:last-of-type`\n\
    \n```css\np:last-of-type {\n  color: red; /* 为其父元素内的最后一个 <p> 元素设置样式 */\n}\n```\n\
    \nTip：这与 `:last-child` 相似，但特定于元素类型。\n\n## 创建旋转动画\n\n属性：带有 `@keyframes` 的 CSS 动画\n\
    \n```css\n@keyframes rotate {\n  from { transform: rotate(0deg); }\n  to { transform:\
    \ rotate(360deg); }\n}\n\n.box {\n  animation: rotate 2s infinite linear;\n}\n\
    ```\n\nTip：CSS 动画允许复杂的变换。\n\n### text-decoration: none; 属性\n\n功能：移除文本的下划线。\n\n\
    ```css\na {\n  text-decoration: none;\n}\n```\n\nTip：通常用于移除链接的装饰。\n\n## 选择特定类型的第一个元素\n\
    \n伪类：`:first-child`\n\n```css\np:first-child {\n  font-size: 20px; /* 为其父元素中的第一个\
    \ <p> 设置样式 */\n}\n```\n\nTip：定位指定类型的第一个实例。\n\n## 控制文本行间距\n\n属性：`line-height`\n\
    \n```css\np {\n  line-height: 1.5;\n}\n```\n\nTip：行高可以提高可读性，特别在大块文本中。\n\n## CSS\
    \ 简介问题\n\n掌握了 HTML 后，下一步是深入通过 CSS（级联样式表）进行样式艺术。\n\n### 关于 CSS 的问题\n\nCSS 代表什么？\n\
    \n1. Computer Style Sheets\n2. Creative Style Sheets\n3. Cascading Style Sheets\n\
    4. Colorful Style Sheets\n\n答案：3. Cascading Style Sheets\n\n解释：CSS 代表 Cascading\
    \ Style Sheets。它用于样式网页——例如更改字体、颜色、大小和布局。\n\n哪个 HTML 标签用于定义内部样式表？\n\n1. `<style>`\n\
    2. `<css>`\n3. `<script>`\n4. `<link>`\n\n答案：1. `<style>`\n\n解释：`<style>` 标签用于为文档定义样式。位于文档的\
    \ head 部分。\n\n```html\n<head>\n<style>\n  body { background-color: lightblue;\
    \ }\n</style>\n</head>\n```\n\n在 CSS 中如何选择 id 为 \"demo\" 的元素？\n\n1. `*demo`\n\
    2. `#demo`\n3. `demo`\n4. `demo`\n\n答案：2. `#demo`\n\n解释：在 CSS 中，哈号符号 (#) 用于选择特定的\
    \ id。\n\n```css\n#demo {\n  color: blue;\n}\n```\n\n如何选择类名为 \"example\" 的元素？\n\
    \n1. `*example`\n2. `#example`\n3. `.example`\n4. `example`\n\n答案：3. `.example`\n\
    \n解释：在 CSS 中，点 (.) 用于选择特定的类。\n\n```css\nexample {\n  font-size: 20px;\n}\n```\n\
    \n如何让文本中的每个单词首字母都大写？\n\n1. `text-transform: capitalize;`\n2. `text-transform:\
    \ uppercase;`\n3. `text-transform: lowercase;`\n4. `text-decoration: capitalize;`\n\
    \n答案：1. `text-transform: capitalize;`\n\n解释：`text-transform: capitalize;` CSS\
    \ 属性会将元素文本中每个单词的首字母大写。\n\n```css\np {\n  text-transform: capitalize;\n}\n```\n\
    \n哪个属性用于更改背景颜色？\n\n1. `color`\n2. `bgcolor`\n\n"
