    \ 测试题：用于测试和强化你的 JavaScript 技能的问题。\n\n## 核心特性\n\n* **实用的代码示例**：每个主题都通过实用的代码示例进行说明，展示了概念在现实场景中的应用。\n\
    * **详尽的问答**：超过 500 个带有详细答案的问题，有助于强化学习并对每个主题提供深层次的理解。\n* **测验题**：在每个章节的末尾，测验题挑战读者运用所学知识，强化知识记忆和实际应用。\n\
    * **渐进式学习路径**：该书的结构旨在引导读者从 HTML、CSS 和 JavaScript 的基础主题转向更高级的主题，适合不同水平的学习者。\n\n\
    # HTML 基础入门\n\n## HTML 基础概念与定义\n\n### HTML 是什么缩写？\n\nHTML 代表超文本标记语言（HyperText\
    \ Markup Language）。它是用于创建网页和 Web 应用程序的标准标记语言。\n\n* `HyperText`（超文本）：连接不同网页的链接，可以在单个网站内部，也可以在不同网站之间。\n\
    * `Markup Language`（标记语言）：一种文档编码方式，它除了文本外，还包含了标签来定义元素。\n\n示例：\n\n```html\n<head>\n\
    \  <title>页面标题</title>\n</head>\n<body>\n  <h1>这是一个标题</h1>\n  <p>这是一个段落。</p>\n\
    </body>\n```\n\n### HTML5 中的语义化元素\n\nHTML5 中的语义化元素是指那些向浏览器和开发者清晰描述其含义的元素。示例包括\
    \ `<form>`、`<table>` 和 `<article>`。非语义化元素如 `<div>` 和 `<span>` 不提供关于其内容的任何信息。\n\
    \n* 语义化元素：`<header>`, `<footer>`, `<article>` 等。\n* 非语义化元素：`<div>`, `<span>` 等。\n\
    \n**提示**：使用语义化元素可以获得更好的可读性和无障碍性。它们帮助屏幕阅读器和搜索引擎更好地理解你网站的内容。\n\n### HTML5 文档中 `lang`\
    \ 属性的作用\n\n`lang` 属性指定文档内容的主要语言。对于无障碍至关重要，因为屏幕阅读器使用此属性来提供正确的发音。它还能帮助搜索引擎返回特定语言的搜索。\n\
    \n示例：\n\n```html\n<html lang=\"en\">\n  …\n  <p lang=\"en\">感谢访问我们的网站!</p>\n</body>\n\
    ```\n\n在此示例中，`lang=\"en\"` 表示文档为英语。\n\n**提示**：始终在你的 HTML 文档中设置 `lang` 属性，以获得更好的无障碍性和\
    \ SEO。\n\n### HTML5 中 viewport 元标签的作用\n\nviewport（视口）元标签用于控制移动端浏览器的布局。没有了它，移动设备将以典型的桌面屏幕宽度渲染页面，然后缩小页面，导致难以阅读。\n\
    \n示例：\n\n```html\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n```\n\n此 viewport 标签将页面宽度设置为设备的屏幕宽度（随设备而异），并设置浏览器首次加载页面时的初始缩放级别。\n\n**提示**：始终在\
    \ HTML5 文档中使用 viewport 元标签，以确保你的网站支持移动端。\n\n# HTML5 元素与标签\n\nHTML 的核心是标签，用于在世界维网上结构化和展示内容。HTML\
    \ 标签是 Web 开发的基石，允许开发者格式化文本、整合多媒体、创建链接并构建复杂的 Web 应用程序。本介绍将探索 HTML 标签的基础、工作原理及其在\
    \ Web 开发中的作用。\n\n### 什么是 HTML 标签？\n\nHTML 标签是封装在角括号（`<` 和 `>`）中的指令或命令。这些标签告诉网页浏览器如何显示内容或解释文档特定部分。大多数\
    \ HTML 标签成对出现，由一个起始标签和一个结束标签组成，中间是内容。结束标签与起始标签相似，但在标签名称之前包含一个斜杠（`/`）。\n\n```html\n\
    <p>这是一个段落。</p>\n```\n\n在此示例中，`<p>` 是指示段落开始的起始标签，`</p>` 是其结束的结束标签。\n\n## HTML 文档的基本结构\n\
    \nHTML 文档使用各种标签进行结构化，定义文档类型、头部（head）和主体（body）。这里是一个简单的示例：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <title>页面标题</title>\n  </head>\n  <body>\n    <h1>我的第一个标题</h1>\n\
    \    <p>我的第一个段落。</p>\n  </body>\n</html>\n```\n\n* `<!DOCTYPE html>` 声明文档类型和 HTML\
    \ 版本。\n* `<html>` 是封装整个内容的根元素。\n* `<head>` 包含文档的元信息，如其标题。\n* `<title>` 指定网页的标题。\n\
    * `<body>` 包含网页的内容，如文本、图像、链接等。\n\n## 常用 HTML 标签及其用途\n\n* **标题标签（`<h1>` 到 `<h6>`）**：定义标题和子标题，其中\
    \ `<h1>` 是最高（或最重要）的级别，`<h6>` 低。\n* **段落标签（`<p>`）**：定义一个段落。\n* **锚点标签（`<a>`）**：创建指向另一个网页或资源的超链接。\n\
    * **图像标签（`<img>`）**：在文档中嵌入图像。\n* **列表标签（`<ul>`, `<ol>`, `<li>`）**：创建无序列表（项目符号）和有序列表（编号）。\n\
    \n## 代码示例的标签\n\n### 页脚或章节\n\n`<footer>` 元素代表文档的页脚。它通常包含版权信息、联系信息和链接。\n\n示例：\n\n\
    ```html\n<footer>\n  <p>Copyright © 2021 公司名称</p>\n</footer>\n```\n\n### 绘制图形（通过\
    \ JavaScript）\n\n`<canvas>` 元素用于在网页上绘制图形。\n\n示例：\n\n```html\n<canvas id=\"myCanvas\"\
    ></canvas>\n<script>\n  var canvas = document.getElementById('myCanvas');\n  var\
    \ ctx = canvas.getContext('2d');\n  ctx.fillStyle = 'green';\n  ctx.fillRect(10,\
    \ 10, 100, 100);\n</script>\n```\n\n### 导航链接\n\n`<nav>` 元素定义一组导航链接。\n\n示例：\n\n\
    ```html\n<nav>\n  <a href=\"/\">首页</a>\n  <a href=\"/about\">关于</a>\n  <a href=\"\
    /contact\">联系</a>\n</nav>\n```\n\n### 音频文件\n\n`<audio>` 元素用于在文档中嵌入声音内容（音频文件）。\n\
    \n示例：\n\n```html\n<audio controls>\n  <source src=\"audiofile.mp3\" type=\"audio/mpeg\"\
    >\n  浏览器不支持音频。\n</audio>\n```\n\n### 主题分割\n\n`<hr>` 元素代表段落元素之间的主题分割，如故事中的场景切换或主题转换。\n\
    \n示例：\n\n```html\n<p>第一个主题...</p>\n<hr>\n<p>第二个主题...</p>\n```\n\n### 引导或导航辅助\n\
    \n`<header>` 元素代表引导性内容或导航链接的容器。\n\n示例：\n\n```html\n<header>\n  <h1>网站标题</h1>\n\
    \  <p>欢迎访问我的网站</p>\n</header>\n```\n\n### 独立自包含的内容\n\n`<article>` 元素持有可以独立分发或重用的内容（例如论坛帖子、杂志或报文章）。\n\
    \n示例：\n\n```html\n<article>\n  <h2>文章标题</h2>\n  <p>文章内容...</p>\n</article>\n```\n\
    \n### 连接其他文档的章节\n\n`<section>` 元素定义文档中的章节，通常用于章节、头部、页脚或文档的任何部分。\n\n示例：\n\n```html\n\
    <section id=\"chapter1\">\n  <h2>第一章：引言</h2>\n  <p>章节内容...</p>\n</section>\n```\n\
    \n### 命令列表\n\n`<menu>` 元素代表命令或选项列表。\n\n示例：\n\n```html\n<menu type=\"toolbar\"\
    >\n  <li><button type=\"button\">首页</button></li>\n  <li><button type=\"button\"\
    >产品</button></li>\n</menu>\n```\n\n"
