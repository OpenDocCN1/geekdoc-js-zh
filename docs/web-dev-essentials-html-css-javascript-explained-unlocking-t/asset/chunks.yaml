    \ for its child elements\n2. Changes the font style to flex\n3. Aligns text vertically\
    \ in the center\n\n**Answer:** 2. Creates a flexible container for its child elements\n\
    \n**Explanation:** The `display: flex;` property in CSS is used to create a flexible\
    \ container for its child elements, turning them into flex items.\n\n**Code Sample:**\n\
    ```\ncontainer {\n  display: flex;\n}\n```\n\n## 2. How do you select the first-child\
    \ of a specific element type within its parent?\n1. `type:first-child`\n2. `:first-child-type`\n\
    3. `type:nth-child(1)`\n4. `type:first-of-type`\n\n**Answer:** 1. `type:first-child`\n\
    \n**Explanation:** To select the first child of a specific element type within\
    \ its parent, you can use the `type:first-child` selector.\n\n**Code Sample:**\n\
    ```\np:first-child {\n  font-weight: bold;\n}\n```\n\n## 3. What is the purpose\
    \ of the CSS property text-align: justify;?\n1. It centers the text horizontally\
    \ within an element\n2. It adds space between lines of text\n3. It justifies the\
    \ text, creating even left and right margins\n4. It aligns text vertically in\
    \ the center\n\n**Answer:** 3. It justifies the text, creating even left and right\
    \ margins\n\n**Explanation:** The `text-align: justify;` property in CSS is used\
    \ to justify the text within an element, creating even left and right margins.\n\
    \n**Code Sample:**\n```\np {\n  text-align: justify;\n}\n```\n\n## 4. What does\
    \ the background-repeat property in CSS control?\n1. It controls the background\
    \ color of an element\n2. It controls the background image's size\n3. It controls\
    \ the repetition of a background image\n4. It changes the font style of text\n\
    \n**Answer:** 3. It controls the repetition of a background image\n\n**Explanation:**\
    \ The `background-repeat` property in CSS controls how a background image is repeated\
    \ or displayed.\n\n**Code Sample:**\n```\nbody {\n  background-image: url('background.jpg');\n\
    \  background-repeat: repeat-x;\n}\n```\n\n## 5. Which CSS property is used to\
    \ control the space between columns in a CSS Grid layout?\n1. `grid-gap`\n2. `column-gap`\n\
    3. `grid-column-gap`\n4. `grid-column-space`\n\n**Answer:** 1. `grid-gap`\n\n\
    **Explanation:** The `grid-gap` property in CSS Grid layout is used to control\
    \ the space between columns and rows.\n\n**Code Sample:**\n```\ngrid-container\
    \ {\n  grid-gap: 10px;\n}\n```\n\n## 6. What is the CSS property used to control\
    \ the order of items in a Flexbox layout?\n1. `flex-order`\n2. `order`\n3. `item-order`\n\
    4. `flex-item-order`\n\n**Answer:** 2. `order`\n\n**Explanation:** In a Flexbox\
    \ layout, the `order` property is used to control the order of flex items within\
    \ the flex container.\n\n**Code Sample:**\n```\nflex-item {\n  order: 3; /* Changes\
    \ the order of this flex item */\n}\n```\n\n## 7. How can you create a CSS class\
    \ that applies styles to elements with a specific attribute?\n1. `attribute[specific]`\n\
    2. `class[attribute]`\n3. `[attribute].class`\n4. `[attribute=\"specific\"]`\n\
    \n**Answer:** 4. `[attribute=\"specific\"]`\n\n**Explanation:** To create a CSS\
    \ class that applies styles to elements with a specific attribute value, you can\
    \ use the `[attribute=\"specific\"]` selector.\n\n**Code Sample:**\n```\n[data-type=\"\
    button\"] {\n  background-color: blue;\n}\n```\n\n## 8. What does the CSS property\
    \ flex-direction control in a Flexbox layout?\n1. It controls the width of flex\
    \ items\n2. It defines the direction of the main axis\n3. It sets the background\
    \ color of flex items\n4. It adjusts the font size of flex items\n\n**Answer:**\
    \ 2. It defines the direction of the main axis\n\n**Explanation:** The `flex-direction`\
    \ property in a Flexbox layout controls the direction of the main axis, which\
    \ affects how flex items are laid out within the container.\n\n**Code Sample:**\n\
    ```\ncontainer {\n  flex-direction: column; /* Sets the main axis to be vertical\
    \ */\n}\n```\n\n## 9. What is the purpose of the CSS property white-space: nowrap;?\n\
    1. It sets the text color to white\n2. It prevents text from wrapping to the next\
    \ line\n3. It removes all white spaces from text\n4. It aligns text vertically\
    \ in the center\n\n**Answer:** 2. It prevents text from wrapping to the next line\n\
    \n**Explanation:** The `white-space: nowrap;` property in CSS prevents text from\
    \ wrapping to the next line, making it stay on a single line.\n\n**Code Sample:**\n\
    ```\np {\n  white-space: nowrap;\n}\n```\n\n## 10. How do you apply CSS styles\
    \ to an element when a user hovers over its parent element?\n1. `:parent:hover`\n\
    2. `parent:hover > child`\n3. `parent:hover + child`\n4. `parent:hover child`\n\
    \n**Answer:** 4. `parent:hover child`\n\n**Explanation:** To apply CSS styles\
    \ to an element when a user hovers over its parent element, you can use the `parent:hover\
    \ child` selector.\n\n**Code Sample:**\n```\n.container:hover .element {\n  background-color:\
    \ yellow;\n}\n```\n\n## 11. Which CSS property is used to control the spacing\
