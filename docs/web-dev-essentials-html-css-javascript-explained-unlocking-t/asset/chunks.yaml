    ### What is the purpose of the `<canvas>` element in HTML5?


    1. To display database records

    2. To draw graphics on the fly via scripting (like `JavaScript`)

    3. To add a background canvas to web pages

    4. To display 3D objects


    Answer: 2. To draw graphics on the fly via scripting (like `JavaScript`)


    Explanation: The `<canvas>` element in HTML5 is used to draw graphics on the fly
    via scripting languages such as `JavaScript`. It can be used to draw graphs, make
    photo compositions, create animations, or even do real-time video processing or
    rendering.


    ### Which HTML5 element is used to specify a footer for a document or section?


    1. `<bottom>`

    2. `<footer>`

    3. `<section>`

    4. `<div>`


    Answer: 2. `<footer>`


    Explanation: The `<footer>` element in HTML5 is used to define a footer for a
    document or a section. It typically contains authorship information, contact information,
    copyright notices, and related documents.


    ### What is the correct HTML5 element for playing video files?


    1. `<media>`

    2. `<video>`

    3. `<film>`

    4. `<mp4>`


    Answer: 2. `<video>`


    Explanation: The `<video>` element is used in HTML5 for embedding video content
    in a document. It can be used to play various video file formats. Attributes like
    `src`, `controls`, `width`, and `height` are often used with the `<video>` element.


    ### Which of the following is NOT a valid type for `<input>` in HTML5?


    1. email

    2. date

    3. slider

    4. color


    Answer: 3. slider


    Explanation: In HTML5, `slider` is not a valid type attribute value for `<input>`.
    The correct type for a slider is `range`.


    ### Which HTML5 element is used for drawing graphics, typically via `JavaScript`?


    1. `<graphics>`

    2. `<canvas>`

    3. `<svg>`

    4. `<draw>`


    Answer: 2. `<canvas>`


    Explanation: The `<canvas>` element is used in HTML5 for drawing graphics, usually
    with `JavaScript`. It allows for dynamic, scriptable rendering of 2D shapes and
    bitmap images.


    ### What does the `async` attribute in a `<script>` tag do?


    1. It stops the script until the page has finished parsing

    2. It runs the script asynchronously as soon as it is available

    3. It defers the script to run after the page has finished parsing

    4. It checks for syntax errors in the script


    Answer: 2. It runs the script asynchronously as soon as it is available


    Explanation: The `async` attribute in a `<script>` tag allows the script to be
    executed asynchronously as soon as it is available, without waiting for the entire
    page to be loaded.


    ### Which element is used in HTML5 to specify navigation links?


    1. `<nav>`

    2. `<navigation>`

    3. `<links>`

    4. `<navigate>`


    Answer: 1. `<nav>`


    Explanation: The `<nav>` element is used in HTML5 to define a section of navigation
    links.


    ### What is the purpose of the `<aside>` element in HTML5?


    1. To represent a section of the page with content connected indirectly to the
    main content

    2. To create sidebars for advertising

    3. To denote additional items that the user might need

    4. To highlight text


    Answer: 1. To represent a section of the page with content connected indirectly
    to the main content


    Explanation: The `<aside>` element is used in HTML5 to represent a section of
    a page that consists of content tangentially related to the content around the
    `<aside>` element.


    ### What does the figure element in HTML5 represent?


    1. A calculation or result

    2. A unit of length

    3. Self-contained content, like illustrations, diagrams, photos, code listings,
    etc.

    4. A key figure in a text


    Answer: 3. Self-contained content, like illustrations, diagrams, photos, code
    listings, etc.


    Explanation: The `figure` element represents self-contained content, typically
    referenced as a single unit from the main flow of the document, such as illustrations,
    diagrams, photos, code listings, etc.


    ### How do you define a header for a section or page in HTML5?


    1. `<header>`

    2. `<head>`

    3. `<top>`

    4. `<section>`


    Answer: 1. `<header>`


    Explanation: The `<header>` element in HTML5 is used to define a header for a
    document or a section.


    ### What is the purpose of the `datalist` element in HTML5?


    1. To store data offline

    2. To provide a list of pre-defined options to an `<input>` element

    3. To link to external sources

    4. To display a list in table format


    Answer: 2. To provide a list of pre-defined options to an `<input>` element


    Explanation: The `datalist` element in HTML5 provides a list of pre-defined options
    for an `<input>` element, allowing for an auto-complete feature.


    ### Which HTML5 element is used to play audio?


    1. `<sound>`

    2. `<mp3>`

    3. `<audio>`

    4. `<music>`


    Answer: 3. `<audio>`


    Explanation: The `<audio>` element is used in HTML5 to embed sound content in
    documents. It can be used to play audio files.


    ### What is the purpose of the `output` element in HTML5?


    1. To display the output of a script

    2. To export data to an external file

    3. To define a section for input

    4. To store output in a database


    Answer: 1. To display the output of a script


    Explanation: The `output` element is used to represent the result of a calculation
    or user action.


    ### Which attribute is used to specify that an input field must be filled out
    before the form?


    1. `required`

    2. mandatory

    3. validate

    4. essential


    Answer: 1. `required`


    Explanation: The `required` attribute is used to specify that an input field cannot
    be empty and must be filled out before submitting the form.


    ### What is the purpose of the `article` element in HTML5?


    1. To define a comment

    2. To contain a magazine or newspaper article

    3. To wrap an article about a particular subject

    4. Both 2 and 3


    Answer: 4. Both 2 and 3


    Explanation: The `<article>` element represents a piece of self-contained content,
    such as a newspaper or magazine article, a blog entry, or a user comment.


    ### Which of the following is NOT a semantic element in HTML5?


    1. `<article>`

    2. `<footer>`

    3. `<div>`

    4. `<section>`


    Answer: 3. `<div>`


    Explanation: The `<div>` is a generic container in HTML and is not considered
    a semantic element. Semantic elements like `<article>`, `<footer>`, and `<section>`
    clearly describe their meaning in a human- and machine-readable way.


    ### Which HTML5 element is used for marking up a thematic break in a page?


    1. `<break>`

    2. `<line>`

    3. `<hr>`

    4. `<divider>`


    Answer: 3. `<hr>`


    Explanation: The `<hr>` element represents a thematic break between paragraph-level
    elements (for example, a change of scene in a story, or a shift of topic within
    a section).


    ### Which attribute is used with the `meta` tag to define the character set of
    an HTML document?


    1. `charset`

    2. encoding

    3. setchar

    4. character


    Answer: 1. `charset`


    Explanation: The `charset` attribute in the `<meta>` tag specifies the character
    encoding for the HTML document.


    ### What does the `placeholder` attribute provide in an input field?


    1. A default value that is submitted with the form

    2. A hint to the user of what can be entered in the field

    3. A label for the input field

    4. Mandatory text that must be entered by the user


    Answer: 2. A hint to the user of what can be entered in the field


    Explanation: The `placeholder` attribute provides a short hint that describes
    the expected value of an input field.


    ### Which HTML5 element defines independent, self-contained content?


    1. `<section>`

    2. `<article>`

    3. `<aside>`

    4. `<header>`


    Answer: 2. `<article>`


    Explanation: An `<article>` element specifies independent, self-contained content
    that could potentially be distributed or reused.


    ### What is the correct HTML element for inserting a line break?


    1. `<br>`

    2. `<break>`

    3. `<lb>`

    4. `<line>`


    Answer: 1. `<br>`


    Explanation: The `<br>` tag is used in HTML to insert a line break in text.

