    ## 高级概念与杂项


    ### JavaScript 中的真值 (truthy value)


    真值是在布尔上下求值时转换为 `true` 的值。除了 `false`、`0`、`-0`、`0n`、`""`、`null`、`undefined` 和 `NaN`（这些是假值），所有其他值都是真值。


    ### 在 JavaScript 中定义一个返回输入平方的箭头函数


    ```javascript

