  trans: "\n\n# 4. .class\n\n**答案：** 1. .class\n\n**解释：** 在 CSS 中，要选择具有特定类的元素，可以使用\
    \ `.class` 选择器。\n\n**代码示例：**\n```css\nmy-class {\n  color: red;\n}\n```\n\n##\
    \ CSS 属性 `box-sizing: border-box;` 的作用是什么？\n\n1. 它为元素的框添加边框\n2. 它调整元素的宽度以包含内边距（padding）和边框（border）\n\
    3. 它将框的内容设置为透明\n4. 它在水平和垂直方向上居中元素\n\n**答案：** 2. 它调整元素的宽度以包含内边距和边框\n\n**解释：** CSS\
    \ 中的 `box-sizing: border-box;` 属性调整元素的宽度以包含其内边距和边框，确保内容框保持指定的宽度。\n\n**代码示例：**\n\
    ```css\ndiv {\n  box-sizing: border-box;\n}\n```\n\n## 如何使用 CSS 选择网页中特定区域内的所有链接？\n\
    \n1. `section a`\n2. `section > a`\n3. `section + a`\n4. `section ~ a`\n\n**答案：**\
    \ 2. `section > a`\n\n**解释：** 使用 CSS 选择网页中特定区域内的所有链接，可以使用 `section > a` 选择器，它选择\
    \ `section` 的直接子 `a` 元素。\n\n**代码示例：**\n```css\nsection > a {\n  color: blue;\n\
    }\n```\n\n## 使用哪个 CSS 属性创建元素边框后的阴影？\n\n1. `box-shadow`\n2. `border-shadow`\n3.\
    \ `element-shadow`\n4. `shadow-box`\n\n**答案：** 1. `box-shadow`\n\n**解释：** CSS\
    \ 中的 `box-shadow` 属性用于在元素的边框后创建阴影。\n\n**代码示例：**\n```css\ndiv {\n  box-shadow:\
    \ 5px 5px 5px grey;\n}\n```\n\n## 如何使用 CSS 选择父元素中特定类型的最后一个元素？\n\n1. `type:last`\n\
    2. `:last-type`\n3. `type:last-of-type`\n4. `last-type[type]`\n\n**答案：** 3. `type:last-of-type`\n\
    \n**解释：** 使用 CSS 选择父元素中特定类型的最后一个元素，可以使用 `type:last-of-type` 选择器。\n\n**代码示例：**\n\
    ```css\np:last-of-type {\n  font-weight: bold;\n}\n```\n\n## 使用哪个 CSS 属性创建旋转动画？\n\
    \n1. `animation-rotate`\n2. `transform-rotate`\n3. `rotate-animation`\n4. `animation`\n\
    \n**答案：** 4. `animation`\n\n**解释：** CSS 中的 `animation` 属性用于创建各种动画，包括旋转动画。\n\n\
    **代码示例：**\n```css\n@keyframes rotate {\n  from {\n    transform: rotate(0deg);\n\
    \  }\n  to {\n    transform: rotate(360deg);\n  }\n}\n\ndiv {\n  animation: rotate\
    \ 2s linear infinite;\n}\n```\n\n## CSS 属性 `text-decoration: line-through;` 作用什么？\n\
    \n1. 它移除文本的下划线\n2. 它在文本上添加一条线\n3. 它让文本加粗\n4. 它让文本倾斜\n\n**答案：** 2. 它在文本上添加一条线\n\
    \n**解释：** CSS 中的 `text-decoration: line-through;` 属性在文本上添加一条线，通常用于表示删除线文本。\n\n\
    **代码示例：**\n```css\nspan {\n  text-decoration: line-through;\n}\n```\n\n## 如何使用\
    \ CSS 选择父元素中特定类型的第一个元素？\n\n1. `type:first`\n2. `:first-type`\n3. `type:first-of-type`\n\
    4. `first-type[type]`\n\n**答案：** 3. `type:first-of-type`\n\n**解释：** 使用 CSS 选择父元素中特定类型的第一个元素，可以使用\
    \ `type:first-of-type` 选择器。\n\n**代码示例：**\n```css\np:first-of-type {\n  font-weight:\
    \ bold;\n}\n```\n\n## 使用哪个 CSS 属性控制文本行之间的间距？\n\n1. `line-spacing`\n2. `spacing-line`\n\
    3. `line-height`\n4. `text-spacing`\n\n**答案：** 3. `line-height`\n\n**解释：** CSS\
    \ 中的 `line-height` 属性用于控制元素内文本行之间的间距。\n\n**代码示例：**\n```css\np {\n  line-height:\
    \ 1.5;\n}\n```\n\n## 使用哪个 CSS 属性控制元素的可见性？\n\n1. `display`\n2. `visibility`\n3.\
    \ `opacity`\n4. `hidden`\n\n**答案：** 2. `visibility`\n\n**解释：** CSS 中的 `visibility`\
    \ 属性用于控制元素的可见性。它可以设置为 `visible` 和 `hidden` 等值。\n\n**代码示例：**\n```css\ndiv {\n \
    \ visibility: hidden; /* 隐藏元素 */\n}\n```\n\n## CSS 属性 `transform: scale(1.5);`\
    \ 作用什么？\n\n1. 它将元素旋转 1.5 度\n2. 它将元素缩放 1.5 倍\n3. 它为元素添加阴影\n4. 它将文本颜色变为蓝色\n\n**答案：**\
    \ 2. 它将元素缩放 1.5 倍\n\n**解释：** `transform: scale(1.5);` 属性将元素缩放为原始尺寸的 1.5 倍。\n\n\
    **代码示例：**\n```css\ndiv {\n  transform: scale(1.5);\n}\n```\n\n## CSS 属性 `text-transform:\
    \ capitalize;` 的作用是什么？\n\n1. 将文本转换为大写\n2. 将文本转换为小写\n3. 将每个单词的首字母大写\n4. 将文本倾斜\n\
    \n**答案：** 3. 将每个单词的首字母大写\n\n**解释：** `text-transform: capitalize;` 属性会将文本的首字母大写。\n\
    \n**代码示例：**\n```css\np {\n  text-transform: capitalize;\n}\n```\n\n## 如何使用 CSS\
    \ 选择表格中的奇数行？\n\n1. `table:nth-child(odd)`\n2. `tr:nth-child(even)`\n3. `tr:nth-child(odd)`\n\
    4. `table:odd-row`\n\n**答案：** 3. `tr:nth-child(odd)`\n\n**解释：** 使用 CSS 选择表格中的奇数行，可以使用\
    \ `tr:nth-child(odd)` 选择器。\n\n**代码示例：**\n```css\ntable tr:nth-child(odd) {\n \
    \ background-color: lightgrey;\n}\n```\n\n## 使用哪个 CSS 属性创建 3D 旋转动画？\n\n1. `rotate3d`\n\
    2. `transform-3d`\n3. `animation-rotate3d`\n4. `@keyframes rotate3d`\n\n**答案：**\
    \ 4. `@keyframes rotate3d`\n\n**解释：** 创建 3D 旋转动画时，可以使用 `@keyframes rotate3d`。\n\
    \n**代码示例：**\n```css\n@keyframes rotate3d {\n  from {\n    transform: rotate3d(0deg,\
    \ 0deg, 0deg);\n  }\n  to {\n    transform: rotate3d(360deg, 0deg, 0deg);\n  }\n\
    }\n\ndiv {\n  animation: rotate3d 2s linear infinite;\n}\n```\n\n## 如何选择具有特定属性值的元素？\n\
    \n1. `[attribute=value]`\n2. `[value=attribute]`\n3. `[attribute~value]`\n4. `[attribute^value]`\n\
    \n**答案：** 1. `[attribute=value]`\n\n**解释：** 选择具有特定属性值的元素时使用 `[attribute=value]`\
    \ 语法。\n\n**代码示例：**\n```css\n[type=\"text\"] {\n  color: blue;\n}\n```\n"
