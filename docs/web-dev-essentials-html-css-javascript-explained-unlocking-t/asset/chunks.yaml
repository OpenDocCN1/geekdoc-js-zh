    Answer: 1\. `for...in` loop


    Explanation: The `for...in` loop is used for iterating over the properties of
    an object.


    What is the purpose of the `Array.prototype.includes()` method in JavaScript?


    1. To check if an element is included in an array.

    2. To add an element to the beginning of an array.

    3. To remove an element from an array.

    4. To check if an array is empty.


    Answer: 1\. To check if an element is included in an array.


    Explanation: `Array.prototype.includes()` is used to check if a specified element
    is present in an array and returns true or false.


    What will the following JavaScript code output?


    ```javascript

    console.log(0.1 + 0.2 === 0.3);

    ```


    1. `true`

    2. `false`

    3. `TypeError`

    4. `undefined`


    Answer: 2\. `false`


    Explanation: Due to floating-point precision in JavaScript, `0.1 + 0.2` is not
    exactly equal to `0.3`, so the comparison returns `false`.


    What is the result of the following JavaScript code?


    ```javascript

    console.log("5" + 3);

    ```


    1. `53`

    2. `8`

    3. `"53"`

    4. `TypeError`


    Answer: 1\. `53`


    Explanation: When you use the `+` operator with a string and a number, JavaScript
    performs concatenation, so `"5"` is concatenated with `3`, resulting in `"53"`.


    Which of the following is a correct way to declare a JavaScript function?


    1. `function myFunction() { ... }`

