    # Getting Started with HTML Basics


    ## HTML Basic Concepts & Definitions


    What does HTML stand for?


    HTML stands for HyperText Markup Language. It is the standard markup language
    used for creating web pages and web applications.


    ● HyperText: Refers to links that connect web pages to one another, either within
    a single website or between websites.


    ● Markup Language: A way of coding a document that, along with the text, incorporates
    tags to define elements.


    Example:


    <head>


    <title>Page Title</title>


    </head>


    <body>


    <h1>This is a Heading</h1>


    <p>This is a paragraph.</p>


    </body>


    Semantic element in HTML5


    Semantic elements in HTML5 are those that clearly describe their meaning to both
    the browser and the developer. Examples include <form>, <table>, and <article>.
    Non-semantic elements, like <div> and <span>, do not tell anything about their
    content.


    ●     Semantic Elements: <header>, <footer>, <article>, etc.


    ●     Non-Semantic Elements: <div>, <span>, etc.


    Tip: Use semantic elements for better readability and accessibility. They help
    screen readers and search engines to better understand the content of your website.


    Purpose of the lang attribute in an HTML5 document


    The lang attribute specifies the primary language of the document''s content.
    It''s crucial for accessibility, as screen readers use this attribute to provide
    correct pronunciation. It also helps search engines return language-specific results.


    Example:


    <html lang="en">


    …


    <p lang="en">Thank you for visiting our site!</p>


    </body>


    In this example, lang="en" indicates that the document is in English.


    Tip: Always set the lang attribute in your HTML document for better accessibility
    and SEO.


    What viewport meta tag does in HTML5


    The viewport meta tag is used to control the layout on mobile browsers. Without
    it, mobile devices will render pages at typical desktop screen widths, and then
    scale the pages down, making them difficult to read.


    Example:


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    This viewport tag sets the width of the page to follow the screen-width of the
    device (which varies depending on the device), and sets the initial zoom level
    when the page is first loaded by the browser.


    Tip: Always use the viewport meta tag in an HTML5 document to ensure your site
    is mobile-friendly.


    HTML5 Elements and Tags


    the heart of HTML are tags, which are used to structure and present content on
    the World Wide We2\. HTML tags are the building blocks of web development, allowing
    developers to format text, integrate multimedia, create links, and build complex
    web applications. This introduction will explore the basics of HTML tags, how
    they work, and their role in web development.


    What Are HTML Tags?


    HTML tags are instructions or commands enclosed in angle brackets (< and >). These
    tags tell web browsers how to display the content or interpret certain parts of
    the document. Most HTML tags come in pairs, consisting of an opening tag and a
    closing tag, with the content in between. The closing tag is similar to the opening
    tag but includes a forward slash (/) before the tag name.


    <p>This is a paragraph.</p>


    In this example, <p> is the opening tag that indicates the start of a paragraph,
    and </p> is the closing tag that signifies its end.


    ## Basic Structure of an HTML Document


    An HTML document is structured using various tags to define the document type,
    head, and body sections. Here is a simple example:


    <!DOCTYPE html>


    <html>


    <head>


    <title>Page Title</title>


    </head>


    <body>


    <h1>My First Heading</h1>


    <p>My first paragraph.</p>


    </body>


    </html>


    <!DOCTYPE html> declares the document type and HTML version.


    <html> is the root element that wraps the entire content.


    <head> contains meta-information about the document, such as its title.


    <title> specifies the title of the web page.


    <body> includes the content of the web page, such as text, images, links, etc.


    ## Common HTML Tags and Their Uses


    Heading Tags (<h1> to <h6>): Define headings and subheadings, with <h1> being
    the highest (or most important) level and <h6> the least.


    Paragraph Tag (<p>): Defines a paragraph.


    Anchor Tag (<a>): Creates a hyperlink to another web page or resource.


    Image Tag (<img>): Embeds an image in the document.


    List Tags (<ul>, <ol>, <li>): Create unordered (bulleted) and ordered (numbered)
    lists.


    Form Tag (<form>): Defines a form for user input.


    Input Tag (<input>): Specifies an input field where users can enter dat1.


    ## Code Examples of Tags and Elements


    Footer for a Document or Section: <footer>


    The <footer> element specifies a footer for a document or section. It often contains
    authorship information, contact information, copyrights, and links to related
    documents.


    Example:


    <footer>


    <p>Copyright © 2021 Company Name</p>


    </footer>


    Drawing Graphics (via JavaScript): <canvas>


    The <canvas> element is used to draw graphics on a web page, typically via JavaScript.


    Example:


    <canvas id="myCanvas"></canvas>


    <script>


    var canvas = document.getElementById(''myCanvas'');


    var ctx = canvas.getContext(''2d'');


    ctx.fillStyle = ''green'';


    ctx.fillRect(10, 10, 100, 100);


    </script>


    Navigation Links: <nav>


    The <nav> element is used to define a set of navigation links.


    Example:


    <nav>


    <a href="/">Home</a> |


    <a href="/about">About</a> |


    <a href="/contact">Contact</a>


    </nav>


    Playing Audio Files: <audio>


    The <audio> element is used to embed sound content (audio files) in documents.


    Example:


    <audio controls>


    <source src="audiofile.mp3" type="audio/mpeg">


    Your browser does not support the audio tag.


    </audio>


    Thematic Break: <hr>


    The <hr> element represents a thematic break between paragraph-level elements,
    like a scene change in a story or a shift of topic.


    Example:


    <p>First topic...</p>


    <hr>


    <p>Second topic...</p>


    Introductory or Navigational Aids: <header>


    The <header> element represents a container for introductory content or navigational
    links.


    Example:


    <header>


    <h1>Website Title</h1>


    <p>Welcome to my website</p>


    </header>


    Independent, Self-Contained Content: <article>


    The <article> element holds content that makes sense on its own and can be independently
    distributed or reused (e.g., a forum post, magazine or newspaper article).


    Example:


    <article>


    <h2>Article Title</h2>


    <p>Article content...</p>


    </article>


    Section Linking to Other Documents: <section>


    The <section> element defines a section in a document, often used for chapters,
    headers, footers, or any other sections of the document.


    Example:


    <section id="chapter1">


    <h2>Chapter 1: Introduction</h2>


    <p>Chapter content...</p>


    </section>


    List of Commands: <menu>


    The <menu> element represents a list of commands or options.


    Example:


    <menu type="toolbar">


    <li><button type="button">Home</button></li>


    <li><button type="button">Products</button></li>


    </menu>


    Container for External Applications/Content: <embed> or <object>


    The <embed> or <object> elements are used to embed external applications or interactive
    content.


    Example:


    <embed src="file.swf" width="500" height="300">


    <!-- or -->'
