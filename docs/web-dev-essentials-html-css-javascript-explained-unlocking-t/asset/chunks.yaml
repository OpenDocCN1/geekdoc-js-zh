  trans: "\n\n默认值：对于 `<div>`、`<p>` 等元素为 block，对于 `<span>`、`<a>` 等元素为 inline。\n\n##\
    \ `:after` 伪元素的功能\n\n用途：在所选元素的内容插入内容。\n\n```css\np:after {\n  content: ' *'; /*\
    \ 在每个段落后添加星号 */\n}\n```\n\n提示：通常用于装饰性元素或附加内容。\n\n## 选择父元素不是 <div> 的所有 <p> 元素\n\
    \n选择器：`:not()` 和直接子组合器 (`>`)\n\n```css\n:not(div) > p {\n  color: red; /* 为不是\
    \ <div> 直接子 <p> 元素设置样式 */\n}\n```\n\n提示：此选择器在排除特定的父子关系时非常通用。\n\n## 修改底部边框样式\n\n\
    属性：`border-bottom`\n\n```css\ndiv {\n  border-bottom: 2px solid blue; /* 为 div\
    \ 设置蓝色底部边框 */\n}\n```\n\n提示：`border-top`、`border-left` 和 `border-right` 也有类似的属性。\n\
    \n## CSS 中 `position: relative;` 的效果\n\n功能：此属性将元素的位置相对于其正常位置设置。\n\n```css\ndiv\
    \ {\n  position: relative;\n  top: 10px; /* 将 div 从其原始位置向下移动 10px */\n}\n```\n\
    \n提示：与绝对定位不同，相对定位不会将元素从正常的文档流中移除。\n\n## CSS 中的变换与动画：核心技术与示例\n\n### 鼠标悬停时更改元素的颜色\n\
    \n属性：`:hover` 伪类\n\n```css\nbutton:hover {\n  color: red; /* 当鼠标悬停在按钮上时，将文本颜色改为红色\
    \ */\n}\n```\n\n提示：`:hover` 伪类可以应用于几乎任何元素，不仅仅是链接。\n\n### 创建阴影效果\n\n属性：`box-shadow`\n\
    \n```css\ndiv {\n  box-shadow: 5px 5px 10px grey; /* 为 div 添加灰色阴影 */\n}\n```\n\
    \n提示：`box-shadow` 可以接受多个值以创建复杂的阴影效果。\n\n### 控制字母间距\n\n属性：`letter-spacing`\n\n\
    ```css\np {\n  letter-spacing: 2px; /* 增加字母之间的间距 */\n}\n```\n\n提示：允许负值来缩小字母之间的间距。\n\
    \n### 更改 Flex 项目的顺序\n\n属性：Flexbox 中的 `order`\n\n```css\nflex-item {\n  order:\
    \ 2; /* 更改此 flex 项目的顺序 */\n}\n```\n\n提示：flex 容器中的项目可以在不改变 HTML 结构的情况下重新排序。\n\n\
    ### 文本水平居中对齐\n\n属性：`text-align`\n\n```css\np {\n  text-align: center; /* 使段落内的文本水平居中\
    \ */\n}\n```\n\n提示：`text-align: center;` 是文本对齐中常用的常用的属性之一。\n\n### 为元素添加边框\n\n\
    属性：`border`\n\n```css\ndiv {\n  border: 1px solid black; /* 添加黑色实边框 */\n}\n```\n\
    \n提示：`border` 属性是 `border-width`、`border-style` 和 `border-color` 的简写。\n\n### 使字体变为斜体\n\
    \n属性：`font-style`\n\n```css\np {\n  font-style: italic; /* 使段落文本变为斜体 */\n}\n```\n\
    \n提示：`font-style` 的其他值包括 `normal` 和 `oblique`。\n\n### 使用特定半径创建圆角\n\n属性：`border-radius`\n\
    \n```css\ndiv {\n  border-radius: 10px; /* 将 div 的角圆化 */\n}\n```\n\n提示：你可以为每个角指定不同的半径（例如，`border-radius:\
    \ 10px 5px 15px 20px;` 分别对应左上、右上、右下和左下角）。\n\n### 使文本加粗\n\n属性：`font-weight`\n\n\
    ```css\nstrong {\n  font-weight: bold; /* 使 <strong> 内部的文本加粗 */\n}\n```\n\n提示：除了加粗，你还可以为权重指定数值（例如\
    \ 700）。\n\n## CSS 中的间距与对齐：示例\n\n### 指定文本行之间的间距\n\n属性：`line-height`\n\n```css\n\
    p {\n  line-height: 1.5; /* 将行间距正常行高的的 1.5 倍 */\n}\n```\n\n提示：`line-height` 可以提高可读性，特别是对于大段文本。\n\
    \n### 为文本元素的第一个字母应用样式\n\n伪元素：`::first-letter`\n\n```css\np::first-letter {\n \
    \ font-size: 200%;\n  color: blue;\n}\n```\n\n提示：这通常用于创建首字母大字或美化段落的第一个字母。\n\n\
    ### 将文本转换为大写字母\n\n属性：`text-transform: uppercase;`\n\n```css\np {\n  text-transform:\
    \ uppercase; /* 将段落中的所有文本转换为大写字母 */\n}\n```\n\n提示：`text-transform` 的其他值包括 `lowercase`、`capitalize`\
    \ 和 `none`。\n\n### `rgba()` 颜色格式的用途\n\n功能：允许指定带有 alpha 通道（透明度级别）的颜色。\n\n```css\n\
    div {\n  background-color: rgba(255, 0, 0, 0.5); /* 半透明红色 */\n}\n```\n\n提示：用于设置透明度。\n\
    \n### 设置元素之间的间距\n\n属性：`border-width`\n\n```css\ndiv {\n  border-width: 5px;\n\
    }\n```\n\n提示：用于设置边框。\n\n### 鼠标悬停时更改背景颜色\n\n属性：`:hover` 伪类\n\n```css\nbutton:hover\
    \ {\n  background-color: lightblue;\n}\n```\n\n提示：用于设置背景颜色。\n\n### 为每第二个元素应用样式\n\
    \n伪类：`:nth-child()`\n\n```css\nli:nth-child(2n) {\n  color: blue;\n}\n```\n\n\
    提示：`nth-child(2n)` 选择每第二个元素。\n\n### CSS Grid 中的列顺序\n\n属性：`order`\n\n```css\ngrid-item\
    \ {\n  order: 2;\n}\n```\n\n提示：用于控制布局。\n\n### `display: inline-block;` 属性\n\n\
    功能：允许元素像内联元素一样流动。\n\n```css\nspan {\n  display: inline-block;\n  width: 50px;\n\
    \  height: 50px;\n}\n```\n\n提示：用于并排对元素，同时可以设置宽高度。\n\n### 选择特定元素的第一个子元素\n\n伪类：`:first-child`\n\
    \n```css\np:first-child {\n  font-weight: bold;\n}\n```\n\n提示：此选择器定位其父元素中的第一个元素。\n\
    \n### `text-align: center;` 的用途\n\n功能：将元素的内联内容水平居中。\n\n```css\ndiv {\n  text-align:\
    \ center;\n}\n```\n\n提示：常用于块级元素内居中文本或内联元素。\n\n### 由 `background-repeat` 控制\n\n\
    功能：决定背景图像如何重复。\n\n```css\nbody {\n  background-image: url('image.jpg');\n  background-repeat:\
    \ no-repeat; /* 图片将不重复 */\n}\n```\n\n提示：其他值包括 `repeat`、`repeat-x`、`repeat-y`。\n\
    \n### 控制 CSS Grid 中列之间的间距\n\n属性：`grid-column-gap` 或新规范中的 `column-gap`\n\n```css\n\
    grid-container {\n  display: grid;\n  column-gap: 20px; /* 设置列之间的间隙 */\n}\n```\n\
    \n"
- fmt: "\nTip: `column-gap` is part of the modern `Grid Layout` specification, providing\
    \ a standardized way to set gaps.\n\n## Controlling Order of Items in Flexbox\n\
    \nProperty: `order` within a flex item.\n\n```css\nflex-item {\n  order: 1; /*\
    \ This item will be positioned first */\n}\n```\n\nTip: Especially useful in responsive\
    \ layouts where `order` might change based on screen size.\n\n## CSS Class Elements\
    \ with a Specific Attribute\n\nAttribute Selector:\n\n```css\ninput[type=\"text\"\
    ] {\n  border-color: blue; /* Applies styles to all text-type input elements */\n\
    }\n```\n\nTip: This selector targets elements based on their attributes, providing\
    \ a powerful way to apply styles conditionally.\n\n## Styling and Effects in CSS\n\
    \n### flex-direction in Flexbox Layout\n\nFunction: Determines the direction of\
    \ the flex items within a flex container.\n\n```css\nflex-container {\n  display:\
    \ flex;\n  flex-direction: column; /* Stacks flex items vertically */\n}\n```\n\
    \nTip: Other values include `row`, `row-reverse`, and `column-reverse`.\n\n###\
    \ Purpose of white-space: nowrap;\n\nFunction: Prevents text from wrapping to\
    \ a new line.\n\n```css\np {\n  white-space: nowrap; /* Keeps text in a single\
    \ line */\n}\n```\n\nTip: Useful in situations where text wrapping is not desirable,\
    \ like in navigational menus.\n\n### Applying Styles on Hover of Parent Element\n\
    \n```css\ndiv:hover p {\n  color: red; /* Styles <p> when its parent <div> is\
    \ hovered */\n}\n```\n\nTip: This is a common technique for creating interactive\
    \ hover effects on parent-child relationships.\n\n### Spacing Between Characters\n\
    \nProperty: `letter-spacing`\n\n```css\np {\n  letter-spacing: 2px; /* Increases\
    \ the space between characters */\n}\n```\n\nTip: Negative values can be used\
    \ for closer character spacing.\n\n### Vertical Text Alignment\n\nWhile CSS doesn't\
    \ provide a direct way to vertically align text, a common technique involves using\
    \ `display: flex` and `align-items`.\n\n```css\ndiv {\n  display: flex;\n  align-items:\
    \ center; /* Vertically centers text in the div */\n  height: 100px;\n}\n```\n\
    \nTip: Flexbox is a versatile tool for both horizontal and vertical alignment.\n\
    \n### Selecting the Last Child of a Specific Element Type\n\nPseudo-class: `:last-child`\n\
    \n```css\np:last-child {\n  font-weight: bold; /* Styles the last <p> element\
    \ in its parent */\n}\n```\n\nTip: Targets the last occurrence of the specified\
    \ element within its parent.\n\n### cursor: pointer; Property\n\nFunction: Changes\
    \ the cursor to a pointer, indicating a clickable element.\n\n```css\nbutton {\n\
    \  cursor: pointer;\n}\n```\n\nTip: Commonly used for buttons, links, or other\
    \ interactive elements.\n\n### Purpose of text-overflow: ellipsis;\n\nFunction:\
    \ Truncates text and shows an ellipsis (...) when it overflows its container.\n\
    \n```css\ndiv {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow:\
    \ ellipsis;\n}\n```\n\nTip: Ensure `overflow` is set to `hidden` and `white-space`\
    \ to `nowrap` for this to work.\n\n### Specifying Style of an Element's Border\n\
    \nProperty: `border-style`\n\n```css\ndiv {\n  border-style: dashed; /* Sets a\
    \ dashed border */\n}\n```\n\nTip: Values include `solid`, `dotted`, `dashed`,\
    \ `double`, `none`, etc.\n\n### font-family Property\n\nFunction: Specifies the\
    \ typeface used for text in an element.\n\n```css\nbody {\n  font-family: \"Arial\"\
    , sans-serif;\n}\n```\n\nTip: Always provide fallback font options.\n\n### Controlling\
    \ Transparency\n\nProperty: `opacity`\n\n```css\ndiv {\n  opacity: 0.5; /* 50%\
    \ transparent */\n}\n```\n\nTip: The value of `opacity` ranges from `0` (fully\
    \ transparent) to `1` (fully opaque).\n\n### Selecting Elements with a Specific\
    \ Class\n\n```css\nexample {\n  color: blue; /* Selects all elements with class\
    \ 'example' */\n}\n```\n\nTip: Class selectors are the backbone of CSS styling\
    \ and are widely used due to their versatility.\n\n### box-sizing: border-box;\
    \ Property\n\nFunction: The dimensions of the element include padding and border.\n\
    \n```css\ndiv {\n  box-sizing: border-box;\n}\n```\n\nTip: Makes `width` and `height`\
    \ styling more predictable, especially when adding padding or borders.\n\n###\
    \ Selecting Links Within a Specific Section\n\n```css\n#sectionId a {\n  color:\
    \ green; /* Styles all <a> elements within the element with id 'sectionId' */\n\
    }\n```\n\nTip: Replace `#sectionId` with the actual ID of the section you're targeting.\n\
    \n### Creating a Shadow Behind an Element's Border\n\nProperty: `box-shadow`\n\
    \n```css\ndiv {\n  box-shadow: 10px 10px 5px grey; /* Adds a shadow to the div\
    \ */\n}\n```\n\nTip: Use `box-shadow` to add depth to elements, enhancing the\
    \ user interface.\n\n### Selecting the Last Element of a Specific Type\n\nPseudo-class:\
    \ `:last-of-type`\n\n```css\np:last-of-type {\n  color: red; /* Styles the last\
    \ <p> element within its parent */\n}\n```\n\nTip: This is similar to `:last-child`\
    \ but specific to the element type.\n\n### Creating a Rotating Animation\n\nProperty:\
    \ CSS Animations with `@keyframes`\n\n```css\n@keyframes rotate {\n  from { transform:\
    \ rotate(0deg); }\n  to { transform: rotate(360deg); }\n}\ndiv {\n  animation:\
    \ rotate 2s infinite linear;\n}\n```\n\nTip: CSS animations allow for complex\
    \ effects and transformations.\n\n### text-decoration: none; Property\n\nFunction:\
    \ Removes decoration from text, commonly used to remove underlines from links.\n\
    \n```css\na {\n  text-decoration: none;\n}\n```\n\nTip: Essential for custom link\
    \ styling.\n\n## Selecting the First Element of a Specific Type\n\nPseudo-class:\
    \ `:first-of-type`\n\n```css\np:first-of-type {\n  font-size: 20px; /* Styles\
    \ the first <p> element within its parent */\n}\n```\n\nTip: Targets the first\
    \ instance of the specified type.\n\n## Controlling Spacing Between Lines of Text\n\
    \nProperty: `line-height`\n\n```css\np {\n  line-height: 1.5;\n}\n```\n\nTip:\
    \ line-height improves readability and aesthetics, especially in large blocks.\n\
    \n## Introduction to CSS Questions\n\nWith a grasp of HTML, the next step in your\
    \ development journey is to delve into the art of styling with CSS (Cascading\
    \ Style Sheets). The questions in this section are meticulously curated to guide\
    \ you through the aesthetic aspects of web design.\n\n### Questions about CSS\n\
    \nWhat does CSS stand for?\n\n1. Computer Style Sheets\n2. Creative Style Sheets\n\
    3. Cascading Style Sheets\n4. Colorful Style Sheets\n\nAnswer: 3. Cascading Style\
    \ Sheets\n\nExplanation: CSS stands for Cascading Style Sheets. It is used to\
    \ style and layout web pages — for example, to alter the font, color, size, and\
    \ spacing of your content.\n\nWhich HTML tag is used to define an internal style\
    \ sheet?\n\n1. `<style>`\n2. `<css>`\n3. `<script>`\n4. `<link>`\n\nAnswer: 1.\
    \ `<style>`\n\nExplanation: The `<style>` tag is used to define style information\
    \ (CSS) for a single document. It is placed in the document's head section.\n\n\
    ```html\n<head>\n<style>\n  body { background-color: lightblue; }\n</style>\n\
    </head>\n```\n\nHow do you select an element with the id \"demo\" in CSS?\n\n\
    1. `*demo`\n2. `#demo`\n3. `demo`\n4. `demo`\n\nAnswer: 2. `#demo`\n\nExplanation:\
    \ In CSS, the hash symbol (#) is used to select elements with a specific id.\n\
    \n```css\n#demo {\n  color: blue;\n}\n```\n\nHow do you select elements with the\
    \ class name \"example\"?\n\n1. `*example`\n2. `#example`\n3. `.example`\n4. `example`\n\
    \nAnswer: 3. `.example`\n\nExplanation: In CSS, the dot (.) is used to select\
    \ elements with a specific class.\n\n```css\nexample {\n  font-size: 20px;\n}\n\
    ```\n\nHow do you make each word in a text start with a capital letter?\n\n1.\
    \ `text-transform: capitalize;`\n2. `text-transform: uppercase;`\n3. `text-transform:\
    \ lowercase;`\n4. `text-decoration: capitalize;`\n\nAnswer: 1. `text-transform:\
    \ capitalize;`\n\nExplanation: The text-transform: capitalize;` CSS property capitalizes\
    \ the first letter of each word in the element's text.\n\n```css\np {\n  text-transform:\
    \ capitalize;\n}\n```\n\nWhich property is used to change the background color?\n\
    \n1. `color`\n2. `bgcolor`\n"
