    # Header for a Document or Section: `<header>`


    The `<header>` element represents a container for introductory content or a set
    of navigational links.


    Example:


    ```html

    <header>

    <h1>Welcome to My Blog</h1>

    <p>Your source for news and articles.</p>

    </header>

    ```


    ## Tangentially Related Content (Sidebar): `<aside>`


    The `<aside>` element is used for content that is tangentially related to the
    content around it, often used for sidebars.


    Example:


    ```html

    <aside>

    <h2>Related Articles</h2>

    <ul>

    <li>Article 1</li>

    <li>Article 2</li>

    </ul>

    </aside>

    ```


    ## Unordered List: `<ul>`


    The `<ul>` (unordered list) element represents a list of items where the order
    of the items is not important.


    Example:


    ```html

    <ul>

    <li>Item 1</li>

    <li>Item 2</li>

    <li>Item 3</li>

    </ul>

    ```


    ## Section in a Document: `<section>`


    The `<section>` element is used to define a specific section within a document.


    Example:


    ```html

    <section>

    <h2>About Us</h2>

    <p>Information about the company...</p>

    </section>

    ```


    ## Introductory Content or Navigational Links: `<header>`


    The `<header>` element is used for introductory content or navigational links
    within a website.


    Example:


    ```html

    <header>

    <h1>My Website</h1>

    <nav>

    <a href="/">Home</a> |

    <a href="/about">About</a>

    </nav>

    </header>

    ```


    ## Independent Self-Contained Content: `<article>`


    The `<article>` element is used for self-contained content, such as a blog post
    or news article.


    Example:


    ```html

    <article>

    <h2>Blog Post Title</h2>

    <p>Blog post content...</p>

    </article>

    ```


    ## Group of Media Content: `<source>`


    The `<source>` element is used with `<audio>` or `<video>` elements to specify
    multiple media sources.


    Example:


    ```html

    <video controls>

    <source src="movie.mp4" type="video/mp4">

    <source src="movie.ogg" type="video/ogg">

    Your browser does not support the video tag.

    </video>

    ```


    ## Quoted Block of Text: `<blockquote>`


    The `<blockquote>` element is used to define a block of text that has been quoted
    from another source.


    Example:


    ```html

    <blockquote cite="http://source.com">

    <p>This is a quoted text from a source.</p>

    </blockquote>

    ```


    These HTML5 elements and tags are essential for structuring and enriching web
    content, ensuring it is semantically meaningful and accessible. They play a crucial
    role in the overall design and functionality of web pages.


    # HTML5 Form Elements and Attributes


    ### Invalid `<input>` Type in HTML5


    In HTML5, types like `text`, `number`, `email`, and `date` are valid for `<input>`.
    An invalid type would be something that is not recognized by HTML5 standards,
    such as `slider`.


    Example:


    ```html

    <!-- Valid input type -->

    <input type="text" name="name">

    <!-- Invalid input type -->

    <input type="slider" name="slider">

    ```


    ### Purpose of the `<datalist>` Element in HTML5


    The `<datalist>` element provides a list of pre-defined options to an `<input>`
    element. It is useful for suggesting possible values for a text input, thus aiding
    in auto-completion.


    Example:


    ```html

    <input list="browsers" name="browser">

    <datalist id="browsers">

    <option value="Chrome">

    <option value="Firefox">

    <option value="Safari">

    <option value="Edge">

    </datalist>

    ```


    ### Function of the `pattern` Attribute in an HTML5 Input Field


    The `pattern` attribute specifies a regular expression that the input element''s
    value is checked against. It is used for validating the form dat1.


    Example:


    ```html

    <!-- pattern for a simple email format -->

    <input type="text" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
    title="Enter a valid email address">

    ```


    ### Role of the `placeholder` Attribute in an Input Field


    The `placeholder` attribute provides a short hint that describes the expected
    value of an input field. It is displayed inside the input field before the user
    enters a value.


    Example:


    ```html

    <input type="text" name="name" placeholder="Enter your name">

    ```


    ### Purpose of the `maxlength` Attribute in an `<input>` Element


    The `maxlength` attribute specifies the maximum number of characters allowed in
    an input field.


    Example:


    ```html

    <!-- Accepts up to 10 characters -->

    <input type="text" name="username" maxlength="10">

    ```


    ### Function of the `form` Attribute of the `<button>` Element in HTML5


    The `form` attribute of the `<button>` element specifies the ID of the form the
    button belongs to, allowing the button to be associated with a form even if it
    is not inside the form element.


    Example:


    ```html

    <form id="loginForm">

    <!-- form content -->

    </form>

    <button form="loginForm" type="submit">Submit</button>

    ```


    ### Function of the `placeholder` Attribute in HTML5 Input Elements


    The `placeholder` attribute in HTML5 input elements shows a hint or guide text
    inside the input field before the user enters a value. It''s used to give users
    an example of what the input should look like.


    Example:


    ```html

    <input type="email" placeholder="example@domain.com">

    ```


    ### Purpose of the `formaction` Attribute in an `<input type="submit">`


    The `formaction` attribute in an `<input type="submit">` specifies the URL to
    which the form data will be sent when the button is pressed.


    ### Function of the `nowrap` Attribute in a `<td>` Element


    The `nowrap` attribute in `<td>` element prevents the text cell from wrapping.
    It is recommended to use CSS (white-space: nowrap;) rather than the HTML attribute.


    # HTML5 Media and Graphics


    ### Embedding Video Files with the `<video>` Element


    The `<video>` element in HTML5 is used to embed video files on a web page, offering
    built-in controls.


    Example:


    ```html

    <video width="320" height="240" controls>

    <source src="movie.mp4" type="video/mp4">

    <source src="movie.ogg" type="video/ogg">

    Your browser does not support the video tag.

    </video>

    ```


    Tips:

    - Always include source files for cross-browser compatibility.

    - Add a message inside the `<video>` tag for browsers that do not support it.


    ### Drawing Graphics with the `<canvas>` Element


    The `<canvas>` element is used for drawing graphics on the fly via scripting (usually
    JavaScript). It''s particularly useful for rendering graphs, game graphics, or
    other visual images.


    Example:


    ```html

    <canvas id="myCanvas" width="200" height="100" style="border:1px solid #000;">

    </canvas>

    <script>

    const c = document.getElementById("myCanvas");

    const ctx = c.getContext("2d");

    ctx.fillStyle = "blue";

    ctx.fillRect(0, 0, 200, 100);

    </script>

    ```


    Tips:

    - The `<canvas>` element itself is just a container. You need to use JavaScript
    to actually draw the graphics.

    - Set a fallback message for browsers that don''t support canvas.


    ### Embedding Audio Files with the `<audio>` Element


    The `<audio>` element allows you to embed audio files that users can play directly
    on the website. Like the `<video>` tag, it supports multiple sources and includes
    built-in controls.


    Example:


    ```html

    <audio controls>

    <source src="sound.mp3" type="audio/mpeg">

    <source src="sound.ogg" type="audio/ogg">

    Your browser does not support the audio element.

    </audio>

    ```


    Tips:

    - Provide multiple audio formats to ensure compatibility with different browsers.

    - Include a message for browsers that don''t support the audio element.


    ### Using Scalable Vector Graphics (SVG)


    SVG is an XML-based markup language for describing two-dimensional vector graphics.
    SVG is used for icons, logos, and complex drawings. Being vector graphics, SVG
    images are scalable without loss of resolution.


    Example:


    ```html

    <svg width="100" height="100">

    <circle cx="50" cy="50" r="40" stroke="green" stroke-width="4" fill="yellow" />

    </svg>

    ```


    Tips:

    - SVG is great for high-quality graphics that need to scale for different device
    sizes.

    - You can style SVG elements with CSS and make them interactive with JavaScript.

