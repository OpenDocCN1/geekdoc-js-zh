  trans: "\n\n## 1. 将元素变为块级元素\n1. 为其子元素创建一个弹性容器\n2. 将字体样式更改为 flex\n3. 将文本垂直居中对齐\n\n\
    **答案：** 2. 为其子元素创建一个弹性容器\n\n**解释：** CSS 中的 `display: flex;` 属性用于为子元素创建一个弹性容器，将它们转换为弹性项目（flex\
    \ items）。\n\n**代码示例：**\n```\ncontainer {\n  display: flex;\n}\n```\n\n## 2. 如何在父元素中选择特定元素类型的第一个子元素？\n\
    1. `type:first-child`\n2. `:first-child-type`\n3. `type:nth-child(1)`\n4. `type:first-of-type`\n\
    \n**答案：** 1. `type:first-child`\n\n**解释：** 要选择父元素中特定元素类型的第一个子元素，可以使用 `type:first-child`\
    \ 选择器。\n\n**代码示例：**\n```\np:first-child {\n  font-weight: bold;\n}\n```\n\n##\
    \ 3. CSS 属性 `text-align: justify;` 的目的是什么？\n1. 在元素内水平居中文本\n2. 在文本行之间添加空格\n3. 使文本两端对齐，创建均匀的左右边距\n\
    4. 将文本垂直居中对齐\n\n**答案：** 3. 使文本两端对齐，创建均匀的左右边距\n\n**解释：** CSS 中的 `text-align: justify;`\
    \ 属性用于元素内文本两端对齐，创建均匀的左右边距。\n\n**代码示例：**\n```\np {\n  text-align: justify;\n}\n\
    ```\n\n## 4. CSS  `background-repeat` 控制什么？\n1. 它控制元素的背景颜色\n2. 它控制背景图像的大小\n3.\
    \ 它控制背景图片的重复\n4. 它更改文本的字体样式\n\n**答案：** 3. 它控制背景图片的重复\n\n**解释：** CSS 中的 `background-repeat`\
    \ 属性控制背景图像如何重复或显示。\n\n**代码示例：**\n```\nbody {\n  background-image: url('background.jpg');\n\
    \  background-repeat: repeat-x;\n}\n```\n\n## 5. 哪个 CSS 属性用于控制 CSS Grid 布局中列之间的空间？\n\
    1. `grid-gap`\n2. `column-gap`\n3. `grid-column-gap`\n4. `grid-column-space`\n\
    \n**答案：** 1. `grid-gap`\n\n**解释：** CSS Grid 布局中的 `grid-gap` 属性用于控制列与行之间的空间。\n\n\
    **代码示例：**\n```\ngrid-container {\n  grid-gap: 10px;\n}\n```\n\n## 6. 哪个 CSS 属性用于\
    \ Flexbox 布局中项目的顺序？\n1. `flex-order`\n2. `order`\n3. `item-order`\n4. `flex-item-order`\n\
    \n**答案：** 2. `order`\n\n**解释：** 在 Flexbox 布局中，`order` 属性用于控制弹性容器内弹性项目的顺序。\n\n\
    **代码示例：**\n```\nflex-item {\n  order: 3; /* 更改此弹性项目的顺序 */\n}\n```\n\n## 7. 如何创建一个\
    \ CSS 类来为具有特定属性的元素应用样式？\n1. `attribute[specific]`\n2. `class[attribute]`\n3. `[attribute].class`\n\
    4. `[attribute=\"specific\"]`\n\n**答案：** 4. `[attribute=\"specific\"]`\n\n**解释：**\
    \ 要为具有特定属性值的元素创建 CSS 类，可以使用 `[attribute=\"specific\"]` 选择器。\n\n**代码示例：**\n```\n\
    [data-type=\"button\"] {\n  background-color: blue;\n}\n```\n\n## 8. Flexbox 布局中的\
    \ `flex-direction` 属性控制什么？\n1. 它控制弹性项目的宽度\n2. 它定义了主轴的方向\n3. 它设置弹性项目的背景颜色\n4. 它调整弹性项目的字体大小\n\
    \n**答案：** 2. 它定义了主轴的方向\n\n**解释：** Flexbox 布局中的 `flex-direction` 属性控制主轴的方向，这会影响弹性项目在容器内的布局方式。\n\
    \n**代码示例：**\n```\ncontainer {\n  flex-direction: column; /* 设置主轴为垂直 */\n}\n```\n\
    \n## 9. CSS 属性 `white-space: nowrap;` 的目的是什么？\n1. 它将文本颜色设置为白色\n2. 它防止文本换到下一行\n\
    3. 它移除文本中所有的空格\n4. 它将文本垂直居中对齐\n\n**答案：** 2. 它防止文本换到下一行\n\n**解释：** CSS 中的 `white-space:\
    \ nowrap;` 属性防止文本换到下一行，使其保持在单行。\n\n**代码示例：**\n```\np {\n  white-space: nowrap;\n\
    }\n```\n\n## 10. 当用户悬停在父元素上时，如何对其元素应用 CSS 样式？\n1. `:parent:hover`\n2. `parent:hover\
    \ > child`\n3. `parent:hover + child`\n4. `parent:hover child`\n\n**答案：** 4. `parent:hover\
    \ child`\n\n**解释：** 当用户悬停在父元素上时，要对其元素应用 CSS 样式可以使用 `parent:hover child` 选择器。\n\
    \n**代码示例：**\n```\n.container:hover .element {\n  background-color: yellow;\n}\n\
    ```\n\n## 11. 哪个 CSS 属性用于控制文本中单个字符之间的间距？\n1. `character-spacing`\n2. `letter-spacing`\n\
    3. `text-spacing`\n4. `word-spacing`\n\n**答案：** 2. `letter-spacing`\n\n**解释：**\
    \ CSS 中的 `letter-spacing` 属性用于控制文本中单个字符之间的间距。\n\n**代码示例：**\n```\np {\n  letter-spacing:\
    \ 2px;\n}\n```\n\n## 12. 哪个 CSS 属性用于控制元素内文本的垂直对齐？\n1. `vertical-align`\n2. `text-align`\n\
    3. `line-height`\n4. `items`\n\n**答案：** 1. `vertical-align`\n\n**解释：** CSS 中的\
    \ `vertical-align` 属性用于控制内联元素的垂直对齐。\n\n**代码示例：**\n```\nspan {\n  vertical-align:\
    \ middle;\n}\n```\n\n## 13. 如何选择父元素中特定元素类型的第一个子元素？\n1. `type:first-child`\n2.\
    \ `:first-child-type`\n3. `type:nth-child(1)`\n4. `type:first-of-type`\n\n**答案：**\
    \ 1. `type:first-child`\n\n**解释：** 要选择父元素中特定元素类型的第一个子元素，可以使用 `type:first-child`\
    \ 选择器。\n\n**代码示例：**\n```\np:first-child {\n  font-weight: bold;\n}\n```\n\n##\
    \ 14. `cursor: pointer;` CSS 属性起什么什么作用？\n1. 它更改了文本的字体样式\n2. 它在悬停时指定光标样式\n3. 它为文本添加阴影效果\n\
    4. 它设置文本颜色\n\n**答案：** 2. 它在悬停时指定光标样式\n\n**解释：** `cursor: pointer;` 属性在悬停于元素时指定光标，通常表示可点击或交互的元素。\n\
    \n**代码示例：**\n```\nbutton {\n  cursor: pointer;\n}\n```\n\n## 15. CSS 属性 `text-overflow:\
    \ ellipsis;` 的目的是什么？\n1. 它将文本颜色设置为白色\n2. 它为文本添加阴影效果\n3. 它在文本溢出容器时显示省略号 (...)\n\
    4. 它更改文本的字体样式\n\n**答案：** 3. 它在文本溢出容器时显示省略号 (...)\n\n**解释：** CSS 中的 `text-overflow:\
    \ ellipsis;` 属性在文本溢出容器时显示省略号，表示有未显示的文本。\n\n**代码示例：**\n```\ndiv {\n  white-space:\
    \ nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n```\n\n## 16. 哪个\
    \ CSS 属性用于指定元素的框样式？\n1. `border-width`\n2. `border-color`\n3. `border-style`\n\
    4. `border-decoration`\n\n**答案：** 3. `border-style`\n\n**解释：** `border-style`\
    \ 属性用于指定元素框的样式，例如实线、虚线或点线。\n\n**代码示例：**\n```\ndiv {\n  border-style: dashed;\n\
    }\n```\n\n## 17. `font-family` 属性控制什么？\n1. 它控制字体大小\n2. 它控制字体粗细\n3. 它指定用于文本的字体族或字体类型\n\
    4. 它设置文本颜色\n\n**答案：** 3. 它指定用于文本的字体族或字体类型\n\n**解释：** CSS `font-family` 属性用于指定用于文本的字体族或字体类型。\n\
    \n**代码示例：**\n```\np {\n  font-family: \"Arial\", sans-serif;\n}\n```\n\n## 18.\
    \ 哪个 CSS 属性用于控制元素的透明度？\n1. `opacity`\n2. `transparency`\n3. `visibility`\n4. `alpha`\n\
    \n**答案：** 1. `opacity`\n\n**解释：** CSS 中的 `opacity` 属性用于控制元素的透明度。\n\n**代码示例：**\n\
    ```\ndiv {\n  opacity: 0.5; /* 使元素变为半透明 */\n}\n```\n\n## 19. 如何在 CSS 中选择所有具有特定类的元素？\n\
    1. `.class`\n2. `#class`\n3. `*class`\n\n"
- fmt: "\n# 4. .class\n\n**Answer:** 1. .class\n\n**Explanation:** To select all elements\
    \ with a specific class in CSS, you can use the `.class` selector.\n\n**Code Sample:**\n\
    ```css\nmy-class {\n  color: red;\n}\n```\n\n## What is the purpose of the CSS\
    \ property `box-sizing: border-box;`?\n\n1. It adds a border to the element's\
    \ box\n2. It adjusts the width of an element to include padding and border\n3.\
    \ It sets the box's content to be transparent\n4. It centers the element horizontally\
    \ and vertically\n\n**Answer:** 2. It adjusts the width of an element to include\
    \ padding and border\n\n**Explanation:** The `box-sizing: border-box;` property\
    \ in CSS adjusts the width of an element to include its padding and border, ensuring\
    \ that the content box remains a specified width.\n\n**Code Sample:**\n```css\n\
    div {\n  box-sizing: border-box;\n}\n```\n\n## How do you select all links within\
    \ a specific section of a web page using CSS?\n\n1. `section a`\n2. `section >\
    \ a`\n3. `section + a`\n4. `section ~ a`\n\n**Answer:** 2. `section > a`\n\n**Explanation:**\
    \ To select all links within a specific section of a web page using CSS, you can\
    \ use the `section > a` selector, which selects direct child `a` elements of the\
    \ `section`.\n\n**Code Sample:**\n```css\nsection > a {\n  color: blue;\n}\n```\n\
    \n## What is the CSS property used to create a shadow behind an element's border?\n\
    \n1. `box-shadow`\n2. `border-shadow`\n3. `element-shadow`\n4. `shadow-box`\n\n\
    **Answer:** 1. `box-shadow`\n\n**Explanation:** The `box-shadow` property in CSS\
    \ is used to create a shadow behind an element's border.\n\n**Code Sample:**\n\
    ```css\ndiv {\n  box-shadow: 5px 5px 5px grey;\n}\n```\n\n## How do you select\
    \ the last element of a specific type within its parent using CSS?\n\n1. `type:last`\n\
    2. `:last-type`\n3. `type:last-of-type`\n4. `last-type[type]`\n\n**Answer:** 3.\
    \ `type:last-of-type`\n\n**Explanation:** To select the last element of a specific\
    \ type within its parent using CSS, you can use the `type:last-of-type` selector.\n\
    \n**Code Sample:**\n```css\np:last-of-type {\n  font-weight: bold;\n}\n```\n\n\
    ## Which CSS property is used to create a rotating animation?\n\n1. `animation-rotate`\n\
    2. `transform-rotate`\n3. `rotate-animation`\n4. `animation`\n\n**Answer:** 4.\
    \ `animation`\n\n**Explanation:** The `animation` property in CSS is used to create\
    \ various animations, including rotating animations.\n\n**Code Sample:**\n```css\n\
    @keyframes rotate {\n  from {\n    transform: rotate(0deg);\n  }\n  to {\n   \
    \ transform: rotate(360deg);\n  }\n}\n\ndiv {\n  animation: rotate 2s linear infinite;\n\
    }\n```\n\n## What does the CSS property `text-decoration: line-through;` do?\n\
    \n1. It removes the text's underline\n2. It adds a line through the text\n3. It\
    \ makes the text bold\n4. It italicizes the text\n\n**Answer:** 2. It adds a line\
    \ through the text\n\n**Explanation:** The `text-decoration: line-through;` property\
    \ in CSS adds a line through the text, typically used to indicate strikethrough\
    \ text.\n\n**Code Sample:**\n```css\nspan {\n  text-decoration: line-through;\n\
    }\n```\n\n## How can you select the first element of a specific type within its\
    \ parent using CSS?\n\n1. `type:first`\n2. `:first-type`\n3. `type:first-of-type`\n\
    4. `first-type[type]`\n\n**Answer:** 3. `type:first-of-type`\n\n**Explanation:**\
    \ To select the first element of a specific type within its parent using CSS,\
    \ you can use the `type:first-of-type` selector.\n\n**Code Sample:**\n```css\n\
    p:first-of-type {\n  font-weight: bold;\n}\n```\n\n## What is the CSS property\
    \ used to control the spacing between lines of text?\n\n1. `line-spacing`\n2.\
    \ `spacing-line`\n3. `line-height`\n4. `text-spacing`\n\n**Answer:** 3. `line-height`\n\
    \n**Explanation:** The `line-height` property in CSS is used to control the spacing\
    \ between lines of text within an element.\n\n**Code Sample:**\n```css\np {\n\
    \  line-height: 1.5;\n}\n```\n\n## Which CSS property is used to control the visibility\
    \ of an element?\n\n1. `display`\n2. `visibility`\n3. `opacity`\n4. `hidden`\n\
    \n**Answer:** 2. `visibility`\n\n**Explanation:** The `visibility` property in\
    \ CSS is used to control the visibility of an element. It can be set to values\
    \ like `visible` and `hidden`.\n\n**Code Sample:**\n```css\ndiv {\n  visibility:\
    \ hidden; /* Hides the element */\n}\n```\n\n## What does the CSS property `transform:\
    \ scale(1.5);` do?\n\n1. It rotates the element by 1.5 degrees\n2. It scales the\
    \ element to 1.5 times its size\n3. It adds a shadow effect to the element\n4.\
    \ It changes the text color to blue\n\n**Answer:** 2. It scales the element to\
    \ 1.5 times its size\n\n**Explanation:** The `transform: scale(1.5);` property\
    \ in CSS scales (enlarges) the element to 1.5 times its original size.\n\n**Code\
    \ Sample:**\n```css\ndiv {\n  transform: scale(1.5);\n}\n```\n\n## What is the\
    \ purpose of the CSS property `text-transform: capitalize;`?\n\n1. It transforms\
    \ text to uppercase\n2. It transforms text to lowercase\n3. It capitalizes the\
    \ first letter of each word\n4. It italicizes the text\n\n**Answer:** 3. It capitalizes\
    \ the first letter of each word\n\n**Explanation:** The `text-transform: capitalize;`\
    \ property in CSS capitalizes the first letter of each word in the text.\n\n**Code\
    \ Sample:**\n```css\np {\n  text-transform: capitalize;\n}\n```\n\n## How can\
    \ you select all odd rows of a table using CSS?\n\n1. `table:nth-child(odd)`\n\
    2. `tr:nth-child(even)`\n3. `tr:nth-child(odd)`\n4. `table:odd-row`\n\n**Answer:**\
    \ 3. `tr:nth-child(odd)`\n\n**Explanation:** To select all odd rows of a table\
    \ using CSS, you can use the `tr:nth-child(odd)` selector.\n\n**Code Sample:**\n\
    ```css\ntable tr:nth-child(odd) {\n  background-color: lightgrey;\n}\n```\n\n\
    ## What is the CSS property used to create a rotating animation in 3D?\n\n1. `rotate3d`\n\
    2. `transform-3d`\n3. `animation-rotate3d`\n4. `@keyframes rotate3d`\n\n**Answer:**\
    \ 4. `@keyframes rotate3d`\n\n**Explanation:** To create a rotating animation\
    \ in 3D, you can use `@keyframes rotate3d`.\n\n**Code Sample:**\n```css\n@keyframes\
    \ rotate3d {\n  from {\n    transform: rotate3d(0deg, 0deg, 0deg);\n  }\n  to\
    \ {\n    transform: rotate3d(360deg, 0deg, 0deg);\n  }\n}\n\ndiv {\n  animation:\
    \ rotate3d 2s linear infinite;\n}\n```\n\n## How can you select elements with\
    \ a specific attribute value?\n\n1. `[attribute=value]`\n2. `[value=attribute]`\n\
    3. `[attribute~value]`\n4. `[attribute^value]`\n\n**Answer:** 1. `[attribute=value]`\n\
    \n**Explanation:** To select elements with a specific attribute value, you use\
    \ the `[attribute=value]` syntax.\n\n**Code Sample:**\n```css\n[type=\"text\"\
    ] {\n  color: blue;\n}\n```\n"
