    **解释：** `new Date()` 创建一个表示当前日期的 Date 对象。`Date.now()` 返回毫秒数。


    以下哪种是用于编码 JavaScript 的方法？


    1. `encodeURI()`

    2. `URIComponent()`

    3. `escape()`

    4. `stringify()`


    **答案：** 2. `URIComponent()`


    **解释：** `URIComponent()` 用于编码特定的组件。


    以下 JavaScript 代码将输出什么？


    ```javascript

    let num = 5;

    console.log(num++);

    ```


    1. 5

    2. 6

    3. undefined

    4. TypeError


    **答案：** 1. 5


    **解释：** `num++` 是后自增运算符，它返回 `num` 的当前值然后变为 6。


    关于 `setTimeout` 的哪个说法是正确的？


    1. 它暂停脚本执行。

    2. 它在指定的延迟后调用函数或代码。

    3. 它是一个阻塞操作并阻止其他操作执行。

    4. 它只能执行一次函数。


    **答案：** 2. 它在指定的延迟后调用函数或代码。


    **解释：** `setTimeout` 用于在指定的毫秒后执行函数。它是非阻塞的。


    以下 JavaScript 代码返回什么？


    `typeof ("5" + 3)`


    1. "number"

    2. "string"

    3. "undefined"

    4. "object"


    **答案：** 2. "string"


    **解释：** 在 JavaScript 中，`+` 运算符配合字符串时会导致字符串拼接，因此 `"5" + 3` 变为 `"53"`，这是一个字符串。


    JavaScript 中 `bind` 方法的主要用途是什么？


    1. 连接两个字符串。

    2. 延迟函数的执行。

    3. 创建一个新的函数，调用时将其 `this` 关键字设置为提供的值。

    4. 将 HTML 元素绑定到 JavaScript 函数。


    **答案：** 3. 创建一个新的函数，调用时将其 `this` 关键字设置为提供的值。


    **解释：** `bind` 方法创建一个新函数，该函数在调用时会将 `this` 关键字设置为提供的值。


    以下哪项不是 JavaScript 中的原始数据类型？


    1. string

    2. number

    3. boolean

    4. object


    **答案：** 4. object


    **解释：** 在 JavaScript 中，原始数据类型包括 `string`、`number`、`boolean`、`undefined`、`null`
    和 `symbol`。`object` 是复杂数据类型。


    以下 JavaScript 代码将输出什么？


    ```javascript

    console.log(''10'' - 5);

    ```


    1. 5

    2. "5"

    3. "105"

    4. NaN


    **答案：** 1. 5


    **解释：** 在 JavaScript 中，`-` 运算符用于减法，它会尽可能字符串转换为数字。因此，`''10'' - 5` 变为 `10 - 5`，等于
    5。


