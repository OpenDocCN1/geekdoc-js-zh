- fmt: "\n# Introduction\n\nThe `async` keyword is used to declare an asynchronous\
    \ function, which returns a `Promise`. It allows you to write promise-based code\
    \ as if it were synchronous, but without blocking the execution thread.\n\nExample:\n\
    \n```javascript\nasync function fetchData() {\n  return \"Data fetched\";\n}\n\
    \nfetchData().then(data => console.log(data)); // \"Data fetched\"\n```\n\nTips:\n\
    - `async` functions can contain zero or more `await` expressions.\n- Execution\
    \ within an `async` function is paused until a promise is resolved or rejected.\n\
    \n### Asynchronous requests\n\nA true statement about asynchronous requests in\
    \ JavaScript is that they allow the program to continue running while waiting\
    \ for a response, preventing any blocking of subsequent code execution.\n\nExample:\n\
    \n```javascript\nconsole.log('Before request');\nfetch('https://api.example.com/data')\n\
    \  .then(response => response.json())\n  .then(data => console.log(data));\nconsole.log('After\
    \ request');\n```\n\nTips:\n- Common use cases for asynchronous requests include\
    \ fetching data from a server, file operations, and timers.\n- JavaScript uses\
    \ an event loop for handling asynchronous code execution.\n\n### The primary use\
    \ of the async keyword before a function\n\nThe primary use of the `async` keyword\
    \ is to simplify the way we write promises. It enables the use of `await` within\
    \ functions to pause in a non-blocking way until the promise is settled. The function\
    \ execution pauses at the `await` expression and resumes with the resolved value\
    \ of the promise.\n\nExample:\n\n```javascript\nasync function getUser(userId)\
    \ {\n  let response = await fetch(`https://api.example.com/users/${userId}`);\n\
    \  let data = await response.json();\n  return data;\n}\n\ngetUser(1).then(user\
    \ => console.log(user));\n```\n\nTips:\n- Use `async` functions to handle sequences\
    \ of asynchronous operations more intuitively.\n\n### How to create a Promise\n\
    \nA `Promise` in JavaScript is created using the `Promise` constructor, which\
    \ takes an executor function with two arguments: `resolve` and `reject`.\n\nExample:\n\
    \n```javascript\nlet promise = new Promise((resolve, reject) => {\n  setTimeout(()\
    \ => {\n    resolve('Promise resolved');\n  }, 1000);\n});\n\npromise.then(result\
    \ => console.log(result));\n```\n\nTips:\n- Use promises to handle asynchronous\
    \ operations like API calls, file reads, etc.\n- `Promises` have three states:\
    \ `pending`, `fulfilled`, and `rejected`.\n\n### How to catch errors thrown during\
    \ asynchronous operations\n\nErrors in asynchronous operations can be caught using\
    \ `.catch()` with promises or `try-catch` blocks in `async/await`.\n\nExample\
    \ using `.catch()`:\n\n```javascript\nfetch('https://api.example.com/data')\n\
    \  .then(response => response.json())\n  .then(data => console.log(data))\n  catch(error\
    \ => console.error('Error:', error));\n```\n\nExample using `async/await`:\n\n\
    ```javascript\nasync function fetchData() {\n  try {\n    let response = await\
    \ fetch('https://api.example.com/data');\n    let data = await response.json();\n\
    \    console.log(data);\n  } catch (error) {\n    console.error('Error:', error);\n\
    \  }\n}\n\nfetchData();\n```\n\nTips:\n- It's important to always handle errors\
    \ in asynchronous operations to prevent runtime exceptions and improve code reliability.\n\
    - In `async/await`, `try-catch` provides a synchronous feel to asynchronous error\
    \ handling.\n\nUnderstanding these aspects of asynchronous programming and `Promises`\
    \ is vital for developing responsive and efficient JavaScript applications, especially\
    \ in environments like web browsers and Node.js where I/O operations are often\
    \ non-blocking and handled asynchronously.\n\n## Event Handling and DOM Interaction\n\
    \n### Event bubbling\n\nEvent bubbling is a mechanism where an event triggered\
    \ on a DOM element propagates up the DOM tree. It means that an event on a child\
    \ element will bubble up to its parent elements.\n\nExample:\n\n```html\n<div\
    \ id=\"parent\">\n  <button id=\"child\">Click me</button>\n</div>\n<script>\n\
    document.getElementById('parent').addEventListener('click', () => {\n  console.log('Parent\
    \ clicked');\n});\ndocument.getElementById('child').addEventListener('click',\
    \ () => {\n  console.log('Child clicked');\n});\n</script>\n```\n\nWhen the button\
    \ is clicked, you will see logs for both the child and parent due to bubbling.\n\
    \nTips:\n- Bubbling is the default behavior for most events in the DOM.\n- It\
    \ allows you to implement event delegation.\n\n### Event delegation\n\nEvent delegation\
    \ is a technique where instead of adding an event listener to individual elements,\
    \ you add it to a parent element and use event bubbling to handle events on child\
    \ elements. It's useful for handling events on dynamically added elements or for\
    \ optimizing performance by reducing the number of event listeners.\n\nExample:\n\
    \n```html\n<ul id=\"myList\">\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item\
    \ 3</li>\n</ul>\n<script>\ndocument.getElementById('myList').addEventListener('click',\
    \ function(e) {\n  if (e.target.tagName === 'LI') {\n    console.log('List item\
    \ clicked:', e.target.textContent);\n  }\n});\n</script>\n```\n\nThis listens\
    \ for clicks on the `ul` element but can respond to clicks on individual `li`\
    \ elements.\n\nTips:\n- Use `e.target` to get the element that triggered the event.\n\
    \n### Method is used to add an event listener in modern JavaScript\n\nThe `addEventListener`\
    \ method is used to attach an event handler to a specific element.\n\nExample:\n\
    \n```javascript\ndocument.getElementById('myButton').addEventListener('click',\
    \ () => {\n  console.log('Button clicked');\n});\n```\n\nTips:\n- `addEventListener`\
    \ is preferred over the older `onclick` method as it allows multiple event handlers\
    \ on a single element and more control over event handling.\n\n### Event occurs\
    \ when the user clicks on an HTML element\n\nThe `click` event occurs when a user\
    \ clicks on an HTML element. It's one of the most commonly used events in web\
    \ applications.\n\nExample:\n\n```html\n<button id=\"myButton\">Click me</button>\n\
    <script>\ndocument.getElementById('myButton').addEventListener('click', () =>\
    \ {\n  alert('Button clicked!');\n});\n</script>\n```\n\n### How to stop the propagation\
    \ of an event\n\nTo stop the propagation of an event, use the `stopPropagation`\
    \ method on the event object. This prevents further propagation of the current\
    \ event in the capturing and bubbling phases.\n\nExample:\n\n```html\n<div id=\"\
    parent\">\n  <button id=\"child\">Click me</button>\n</div>\n<script>\ndocument.getElementById('parent').addEventListener('click',\
    \ () => {\n  console.log('Parent clicked');\n});\ndocument.getElementById('child').addEventListener('click',\
    \ (e) => {\n  console.log('Child clicked');\n  e.stopPropagation(); // Stops the\
    \ event from bubbling up\n});\n</script>\n```\n\nTips:\n- Use `stopPropagation`\
    \ judiciously, as it can prevent other intended event handlers from executing.\n\
    - It's useful in scenarios where you don't want a parent handler to be triggered\
    \ after a specific action on a child element.\n\nUnderstanding these concepts\
    \ is crucial for handling user interactions in web applications, allowing you\
    \ to create more engaging and responsive interfaces. Remember, effective event\
    \ handling is key to manipulating the DOM in response to user actions.\n\n## JavaScript\
    \ Syntax and Operators\n\n### How to add a comment in a JavaScript file\n\nIn\
    \ JavaScript, you can add comments using either single-line (`//`) or multi-line\
    \ (`/* */`) comment syntax.\n\nExample:\n\n```javascript\n// This is a single-line\
    \ comment\nlet x = 5; // This comment is inline with code\n\n/* This is a\nmulti-line\
    \ comment */\nlet y = 10;\n```\n\n### What the spread operator does\n\nThe spread\
    \ operator (`...`) allows an iterable such as an array or string to be expanded\
    \ in places where zero or more arguments or elements are expected. It is commonly\
    \ used for array or object cloning and concatenation.\n\nExample:\n\n```javascript\n\
    let arr1 = [1, 2, 3];\nlet arr2 = [...arr1, 4, 5]; // [1, 2, 3, 4, 5]\n```\n\n\
    ### How to correctly round the number 7.25 to the nearest integer in JavaScript\n\
    \nThe `Math.round()` method correctly rounds a number to the nearest integer.\n\
    \nExample:\n\n```javascript\nconsole.log(Math.round(7.25)); // 7\n```\n\n### What\
    \ the !! (double exclamation point) operator does\n\nThe `!!` operator is used\
    \ to convert a value to its equivalent boolean representation.\n\nExample:\n\n\
    ```javascript\nlet truthyValue = !!1; // true\nlet falsyValue = !!0; // false\n\
    ```\n\n### What the || operator represents\n\nThe `||` operator is a logical OR.\
    \ It returns the value of its first operand if it is truthy; otherwise, it returns\
    \ the value of the second operand.\n\nExample:\n"
