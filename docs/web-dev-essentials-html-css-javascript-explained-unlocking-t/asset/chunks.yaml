    ```


    1. `2`

    2. `8`

    3. `"2"`

    4. `TypeError`


    Answer: 1\. `2`


    Explanation: JavaScript performs type coercion when using the `-` operator, so
    the string `"5"` is converted to a number, resulting in `5 - 3`, which equals
    `2`.


    In JavaScript, which of the following is used to create a new object with the
    same prototype as an existing object?


    1. `Object.assign()`

    2. `Object.create()`

    3. `Object.copy()`

    4. `Object.clone()`


    Answer: 2\. `Object.create()`


    Explanation: The `Object.create()` method is used to create a new object with
    the specified prototype object.


    What is the purpose of the `Array.prototype.reduce()` method in JavaScript?


    1. To execute a reducer function on each element of the array, resulting in a
    single output value.

    2. To combine all elements of an array into a single string.

    3. To iterate over each element of an array.

    4. To filter elements based on a condition and return a new array.


    Answer: 1\. To execute a reducer function on each element of the array, resulting
    in a single output value.


    Explanation: `Array.prototype.reduce()` applies a function against an accumulator
    and each element in the array to reduce it to a single value.


    Which of the following statements is true about JavaScript variables declared
    with `var` inside a function?


    1. They have block scope.

    2. They are hoisted to the top of the function.

    3. They cannot be reassigned.

    4. They are block-scoped and not hoisted.


    Answer: 2\. They are hoisted to the top of the function.


    Explanation: Variables declared with `var` are hoisted to the top of their containing
    function, which means their declarations are processed before the code is executed.


    What is the output of the following JavaScript code?


    ```javascript

    console.log(10 / 0);

    ```


    1. `10`

    2. `0`

