  trans: "\n\n在用 HTML 和 CSS 奠定基础之后，时候用 JavaScript 为网页注入灵魂了。本节的问题将进入 JavaScript 的动态世界，这是一种强大的编程语言，能够实现交互和复杂的网页体验。从变量、函数到事件处理和异步编程，这些问题涵盖了让\
    \ JavaScript 在 Web 开发中不可缺的核心概念和高级特性。你将学习如何操作 `DOM`、处理用户交互以及与数据工作等技能。无论你的目标是添加简单的动画，还是开发复杂的\
    \ Web 应用程序，从这些问题中获得的见解将使你掌握充分利用 JavaScript 潜力以创建交互、高效且吸引人的 Web 应用程序的知识。\n\n##\
    \ 关于 JavaScript 的问题与解释\n\nJavaScript 中的 `let` 关键字代表什么？\n\n1. 一个常量变量\n2. 块级作用域变量\n\
    3. 全局变量\n4. 函数作用域变量\n\n答案：2\\. 块级作用域变量\n\n解释：`let` 关键字允许你声明变量，其作用域限于它们使用的块、语句或表达式。与\
    \ `var` 不同（`var` 声明函数作用域或全局作用域变量），`let` 确保变量仅在其声明的上下文中可访问。\n\n```javascript\n\
    if (true) {\nlet a = 40;\n  console.log(a); // outputs 40\n}\nconsole.log(a);\
    \ // Uncaught ReferenceError: a is not defined\n```\n\n哪种方法将 JSON 字符串转换为 JavaScript\
    \ 对象？\n\n1. `JSON.parse()`\n2. `JSON.stringify()`\n3. `Object.toJSON()`\n4. `String.parseJSON()`\n\
    \n答案：1\\. `JSON.parse()`\n\n解释：`JSON.parse()` 用于解析 JSON 字符串并构建由字符串描述的 JavaScript\
    \ 值或对象。\n\n```javascript\nconst jsonString = '{\"name\": \"John\", \"age\": 30}';\n\
    const obj = JSON.parse(jsonString);\nconsole.log(obj.name); // John\n```\n\n使用哪个运算符来同时检查值和类型？\n\
    \n1. `==`\n2. `===`\n3. `=`\n4. `!=`\n\n答案：2\\. `===`\n\n解释：`===` 运算符被称为严格相等运算符，它会比较两个操作数的值和类型。相比之下，`==`\
    \ 运算符仅比较值，并在必要时执行类型转换。\n\n```javascript\nconsole.log(1 === '1'); // false\nconsole.log(1\
    \ == '1'); // true\n```\n\n以下代码的输出是什么？\n\n```javascript\nconsole.log(typeof null);\n\
    ```\n\n1. \"null\"\n2. \"undefined\"\n3. \"object\"\n4. \"number\"\n\n答案：3\\.\
    \ \"object\"\n\n解释：在 JavaScript 中，`typeof null` 返回 \"object\"。这实际上是语言中的一个 bug，也是它的特殊之处之一，因为\
    \ `null` 并不是真正的对象。\n\n JavaScript 中的闭包（closure）是什么？\n\n1. 函数同其词法环境。\n2. 可以访问外部函数变量的内部函数。\n\
    3. 包含 1 和 2。\n4. 语法错误。\n\n答案：3\\. 包含 1 和 2。\n\n解释：闭包是一个函数与其词法环境（它被定义的环境）的结合。这意味着即使在外部函数返回后，它仍然可以访问外部函数的变量。\n\
    \n```javascript\nfunction outerFunction() {\n  let outerVariable = 100;\n  function\
    \ innerFunction() {\n    console.log(outerVariable);\n  }\n  return innerFunction;\n\
    }\nconst inner = outerFunction();\ninner(); // Outputs: 100\n```\n\n以下哪一个不是 JavaScript\
    \ 的保留字？\n\n1. interface\n2. throws\n3. program\n4. short\n\n答案：3\\. program\n\n\
    解释：在 JavaScript 中，`interface`、`throws` 和 `short` 是保留字，但 `program` 不是。保留字对语言有特定含义，或为未来留留。\n\
    \n`Array.prototype.map()` 方法的作用是什么？\n\n1. 在数组的每个元素上执行函数。\n2. 修改数组中的每个元素并创建一个新数组。\n\
    3. 将数组的所有元素合并为一个单个值。\n4. 检查数组是否至少有一个元素通过测试。\n\n答案：2\\. 修改数组中的每个元素并创建一个新数组。\n\n\
    解释：`Array.prototype.map()` 创建一个新数组，其中的元素是通过在调用数组的每个元素上调用提供的函数得到的结果。\n\n```javascript\n\
    const numbers = [1, 2, 3];\nconst doubled = numbers.map(number => number * 2);\n\
    console.log(doubled); // [2, 4, 6]\n```\n\nJavaScript 中 `bind` 方法的用途是什么？\n\n1.\
    \ 将方法中 `this` 的值绑定到对象。\n2. 合并两个字符串。\n3. 将 JavaScript 文件链接到 HTML 文档。\n4. 重复一个字符串多次。\n\
    \n答案：1\\. 将方法中 `this` 的值绑定到对象。\n\n解释：`bind` 方法创建一个新函数，当被调用时，其 `this` 关键字被设置为提供的值。\n\
    \n```javascript\nconst person = {\n  name: 'John',\n  greet: function() { console.log(`Hello,\
    \ ${this.name}`); }\n};\nconst greet = person.greet.bind({name: 'Jane'});\ngreet();\
    \ // Hello, Jane\n```\n\n关于 JavaScript 的箭头函数，以下哪个说法正确？\n\n1. 它们拥有自己的 `this` 绑定。\n\
    2. 它们不能返回值。\n3. 它们是更简洁的函数语法。\n4. 它们可以作为构造函数使用。\n\n答案：3\\. 它们是更简洁的函数语法。\n\n解释：箭头函数提供了更简洁的函数语法。它们没有自己的\
    \ `this` 绑定。\n\n```javascript\nconst add = (a, b) => a + b;\nconsole.log(add(2,\
    \ 3)); // 5\n```\n\n`unshift` 方法在数组中做了什么？\n\n1. 在数组末尾添加元素。\n2. 从数组删除第一个元素。\n3.\
    \ 在数组开头添加元素。\n4. 从数组删除最后一个元素。\n\n答案：3\\. 在数组开头添加元素。\n\n解释：`unshift` 方法将一个或多个元素添加到数组的开头，并返回数组的新长度。\n\
    \n```javascript\nconst array = [1, 2, 3];\narray.unshift(0);\nconsole.log(array);\
    \ // [0, 1, 2, 3]\n```\n\n以下代码将输出什么？\n\n```javascript\nconsole.log(0.1 + 0.2 ===\
    \ 0.3);\n```\n\n1. true\n2. false\n3. TypeError\n4. undefined\n\n答案：2\\. false\n\
    \n解释：这是许多语言中的浮点数问题。0.1 + 0.2 的结果不等于 0.3，这是由于数字表示方式（IEEE 754 浮点运算标准）导致的。\n\nJavaScript\
    \ 中的事件委托（event delegation）是什么？\n\n1. 一种处理父元素而不是单个子元素的方法。\n2. 将事件处理委托给接收事件的元素的元素的方法。\n\
    3. 一种加速事件处理的技术。\n4. 将多个事件绑定到单个监听器的过程。\n\n答案：1\\. 一种处理父元素而不是单个子元素的方法。\n\n解释：事件委托是一种在父元素上使用单个监听器来管理其所有子事件的技术，利用了事件冒泡。\n\
    \n哪种方法用于从数组删除最后一个元素并返回该元素？\n\n1. `pop()`\n2. `push()`\n3. `shift()`\n4. `unshift()`\n\
    \n答案：1\\. `pop()`\n\n解释：`pop()` 用于从数组删除最后一个元素。该方法会改变数组的长度。\n\n如何获取传递给函数的参数总量？\n\
    \n1. 使用 `arguments.length`\n2. 使用 `arguments.size()`\n3. 使用 `this.length`\n4.\
    \ 使用 `function.length`\n\n答案：1\\. 使用 `arguments.length`\n\n解释：`arguments` 对象是函数内部可以访问的类数组对象，包含了传递给该函数的参数值。`arguments.length`\
    \ 提供实际传递的参数个数。\n\n关于 JavaScript 中的异步请求，以下哪个说法是正确的？\n\n1. 它们暂停脚本执行直到请求完成。\n2. 它们允许脚本在处理被请求时继续运行。\n\
    3. 它们只能通过 `XMLHttpRequest` 对象实现。\n4. 它们无法处理 HTTP GET 请求。\n\n"
- fmt: "\nAnswer: 2. They allow the script to continue running while the request is\
    \ being processed.\n\nExplanation: Asynchronous requests in JavaScript, such as\
    \ those made using `XMLHttpRequest` or the `fetch` API, allow the script to continue\
    \ running while the request is processed in the background.\n\n### What is the\
    \ purpose of the `Array.prototype.reduce()` method?\n\n1. To iterate over each\
    \ element of an array.\n2. To execute a reducer function on each element of the\
    \ array, resulting in a single output value.\n3. To filter out certain elements\
    \ of an array.\n4. To transform an array into a string.\n\nAnswer: 2. To execute\
    \ a reducer function on each element of the array, resulting in a single output\
    \ value.\n\nExplanation: The `reduce()` method executes a reducer function on\
    \ each element of the array, resulting in a single output value. It is often used\
    \ for accumulating values or concatenating strings.\n\n### In JavaScript, what\
    \ will this code `typeof NaN` return?\n\n1. \"number\"\n2. \"NaN\"\n3. \"undefined\"\
    \n4. \"object\"\n\nAnswer: 1. \"number\"\n\nExplanation: `NaN` stands for \"Not-a-Number\"\
    \ but is ironically of type \"number\" in JavaScript. This is one of the language's\
    \ quirks.\n\n### Which is a correct method to create a new object in JavaScript?\n\
    \n1. `let obj = new Object();`\n2. `let obj = Object.create();`\n3. `let obj =\
    \ {};`\n4. All of the above\n\nAnswer: 4. All of the above\n\nExplanation: All\
    \ three methods are correct ways to create a new object in JavaScript. `new Object()`\
    \ and `{}` (object literal syntax) are more common, whereas `Object.create()`\
    \ is used for more complex cases like setting the prototype chain.\n\n### How\
    \ can you add a comment in a JavaScript file?\n\n1. `<!-- This is a comment -->`\n\
    2. `/* This is a comment */`\n3. `// This is a comment`\n4. Both 2 and 3\n\nAnswer:\
    \ 4. Both 2 and 3\n\nExplanation: In JavaScript, you can create a single-line\
    \ comment using `//` and a multi-line comment using `/* */`.\n\n### Which method\
    \ is used to randomly shuffle an array in JavaScript?\n\n1. There is no built-in\
    \ method, but it can be achieved by custom code.\n2. `Array.shuffle()`\n3. `Math.random(array)`\n\
    4. `array.randomize()`\n\nAnswer: 1. There is no built-in method, but it can be\
    \ achieved by custom code.\n\nExplanation: JavaScript does not provide a built-in\
    \ method to shuffle an array. However, you can achieve this by implementing a\
    \ function, commonly using the Fisher-Yates (or Knuth) shuffle algorithm.\n\n\
    ```javascript\nfunction shuffle(array) {\n  for (let i = array.length - 1; i >\
    \ 0; i--) {\n    const j = Math.floor(Math.random() * (i + 1));\n    [array[i],\
    \ array[j]] = [array[j], array[i]];\n  }\n  return array;\n}\n```\n\n### What\
    \ is the correct syntax for referring to an external script called `script.js`?\n\
    \n1. `<script href=\"script.js\"></script>`\n2. `<script name=\"script.js\"></script>`\n\
    3. `<script src=\"script.js\"></script>`\n4. `<script file=\"script.js\"></script>`\n\
    \nAnswer: 3. `<script src=\"script.js\"></script>`\n\nExplanation: The `src` attribute\
    \ in the `<script>` tag is used to include external files.\n\n### How do you write\
    \ an if statement in JavaScript?\n\n1. `if (i == 5)`\n2. `if i = 5`\n3. `if i\
    \ == 5`\n4. `if (i = 5)`\n\nAnswer: 1. `if (i == 5)`\n\nExplanation: The correct\
    \ syntax for an `if` statement is `if (condition)`.\n\n### How can you detect\
    \ the browser's name in JavaScript?\n\n1. `navigator.appName`\n2. `browser.name`\n\
    3. `client.browser`\n4. `window.browserName`\n\nAnswer: 1. `navigator.appName`\n\
    \nExplanation: The `navigator.appName` property returns the name of the browser.\
    \ However, detecting the browser using this method is generally discouraged in\
    \ favor of feature detection.\n\n### Which JavaScript catches all the values,\
    \ except for the specified?\n\n1. `catch`\n2. `label`\n3. `default`\n4. `except`\n\
    \nAnswer: 3. `default`\n\nExplanation: In a `switch` statement, the `default`\
    \ keyword is used to specify the code to run if there is no match.\n\n### What\
    \ will the following code return: `Boolean(10 > 9)`?\n\n1. `true`\n2. `false`\n\
    3. `NaN`\n4. `undefined`\n\nAnswer: 1. `true`\n\nExplanation: `Boolean(10 > 9)`\
    \ evaluates the expression `10 > 9`, which is true.\n\n### Which event occurs\
    \ when the user clicks on an element?\n\n1. `onchange`\n2. `onclick`\n3. `onmouseover`\n\
    4. `onmouseclick`\n\nAnswer: 2. `onclick`\n\nExplanation: The `onclick` event\
    \ occurs when the user clicks on an element.\n\n### How do you declare a JavaScript\
    \ variable?\n\n1. `v carName;`\n2. `variableName;`\n3. `var varName;`\n4. `let\
    \ varName;`\n\nAnswer: 3. `var varName;`\n\nExplanation: Both `var` and `let`\
    \ are used to declare a variable in JavaScript, but they have different scopes\
    \ and hoisting behavior.\n\n### Which operator is used to assign a value to a\
    \ variable?\n\n1. `*`\n2. `-`\n3. `=`\n4. `x`\n\nAnswer: 3. `=`\n\nExplanation:\
    \ The `=` operator is used to assign values to variables.\n\n### What is the correct\
    \ way to write a JavaScript array?\n\n1. `var colors = (\"red\", \"green\", \"\
    blue\")`\n2. `var colors = \"red\", \"green\", \"blue\"`\n3. `var colors = [\"\
    red\", \"green\", \"blue\"]`\n4. `var colors = (\"red\"), (\"green\"), (\"blue\"\
    )`\n\nAnswer: 3. `var colors = [\"red\", \"green\", \"blue\"]`\n\nExplanation:\
    \ In JavaScript, an array is written as a list of values, each separated by a\
    \ comma, and enclosed in square brackets.\n\n### What is the method for rounding\
    \ a number to the nearest integer in JavaScript?\n\n1. `Math.round()`\n2. `Math.floor()`\n\
    3. `Math.ceil()`\n4. `Number.round()`\n\nAnswer: 1. `Math.round()`\n\nExplanation:\
    \ `Math.round()` is used to round a number to the nearest integer.\n\n### Which\
    \ of the following will check if a variable `v` is an array in JavaScript?\n\n\
    1. `v.isArray()`\n2. `Array.isArray(v)`\n3. `v instanceof Array`\n4. Both B and\
    \ C are correct\n\nAnswer: 4. Both B and C are correct\n\nExplanation: `Array.isArray(v)`\
    \ is a standard method to check if `v` is an array. `v instanceof Array` also\
    \ works but might not be as reliable in all contexts, especially when dealing\
    \ with different JavaScript contexts (like iframes).\n\n### How do you find the\
    \ number with the highest value of `x` and `y`?\n\n1. `Math.ceil(x, y)`\n2. `Math.max(x,\
    \ y)`\n3. `Math.top(x, y)`\n4. `Math.highest(x, y)`\n\nAnswer: 2. `Math.max(x,\
    \ y)`\n\nExplanation: `Math.max(x, y)` returns the highest value among its arguments.\n\
    \n### What will the following code output?\n\n```javascript\nvar x = \"1\";\n\
    console.log(x === 1);\n```\n\n1. `true`\n2. `false`\n3. `TypeError`\n4. `undefined`\n\
    \nAnswer: 2. `false`\n\nExplanation: The `===` operator tests for both value and\
    \ type equality. Since `x` is a string and `1` is a number, the comparison returns\
    \ false.\n\n### What is the correct JavaScript syntax to change the content of\
    \ the HTML element below?\n\n`<p id=\"demo\">This is a demonstration.</p>`\n\n\
    1. `document.getElement(\"p\").innerHTML = \"Hello World!\";`\n2. `document.getElementById(\"\
    demo\").innerHTML = \"Hello World!\";`\n3. `#demo.innerHTML = \"Hello World!\"\
    ;`\n4. `document.getElementByName(\"p\").innerHTML = \"Hello World!\";`\n\nAnswer:\
    \ 2. `document.getElementById(\"demo\").innerHTML = \"Hello World!\"`\n\nExplanation:\
    \ `document.getElementById(\"demo\")` is the correct method to select the element,\
    \ and `.innerHTML` is used to change its content.\n\n### What is the correct syntax\
    \ for adding comments in JavaScript?\n\n1. `<!-- This is a comment -->`\n2. `//\
    \ This is a comment`\n3. `/* This is a comment */`\n4. Both B and C\n\nAnswer:\
    \ 4. Both B and C\n\nExplanation: In JavaScript, `//` is used for single-line\
    \ comments and `/* */` for multi-line comments.\n\n### How can a value be appended\
    \ to an array in JavaScript?\n\n1. `arr[arr.length] = value;`\n2. `arr.push(value);`\n\
    3. `arr += value;`\n4. Both A and B are correct\n\nAnswer: 4. Both A and B are\
    \ correct\n\nExplanation: `arr.push(value)` adds a new element to the end of an\
    \ array. Alternatively, setting `arr[arr.length] = value;` also appends the value\
    \ to the end.\n\n### How do you create a function in JavaScript?\n\n1. `function\
    \ myFunction()`\n2. `function:myFunction()`\n3. `function = myFunction()`\n4.\
    \ `new Function()`\n\nAnswer: 1. `function myFunction()`\n\nExplanation: `function\
    \ myFunction()` is the standard syntax for declaring a function in JavaScript.\n\
    \n### What method is used to serialize an object into a JSON string in JavaScript?\n\
    \n1. `JSON.stringify()`\n2. `JSON.parse()`\n3. `JSON.toObject()`\n4. `Object.toJSON()`\n"
