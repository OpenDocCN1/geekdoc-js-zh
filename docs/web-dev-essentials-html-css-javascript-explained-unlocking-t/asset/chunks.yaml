    Tip: Common values include `block`, `inline-block`, `none`, and recently `flex`\
    \ and `grid`.\n\n# Selecting All Child `<p>` Elements of `<div>`\n\nSelector:\
    \ Child combinator (`>`)\n\n```css\ndiv > p {\n  color: blue;\n}\n```\nTip: This\
    \ selector targets only `<p>` elements that are direct children of a `<div>`.\n\
    \n# CSS Units\n\nInvalid Unit: A non-valid unit is `pt`.\nValid Units: `px`, `em`,\
    \ `rem`, `%`, `vh`, `vw`, etc.\n\n# Purpose of the `Overflow` Property in CSS\n\
    \nFunction: Controls what happens to content that exceeds the bounds of its container.\n\
    \n```css\ndiv {\n  overflow: hidden; /* Hides content that overflows the div's\
    \ box */\n}\n```\nTip: Other values include `scroll`, `auto`, and `visible`.\n\
    \n# Difference Between `visibility` and `display`\n\n`visibility: hidden` makes\
