    border: 1px solid black; /* Adds a solid black border */


    }


    Tip: The border property is shorthand for border-width, border-style, and border-color.


    Making Font Italic:


    Property: font-style


    p {


    font-style: italic; /* Makes the paragraph text italic */


    }


    Tip: Other values for font-style include normal and oblique.


    Creating Rounded Corners with Specific Radius:


    Property: border-radius


    div {


    border-radius: 10px; /* Rounds the corners of the div */


    }


    Tip: You can specify different radii for each corner (e.g., border-radius: 10px
    5px 15px 20px; for top-left, top-right, bottom-right, and bottom-left respectively).


    Making Text Bold:


    Property: font-weight


    strong {


    font-weight: bold; /* Makes the text within <strong> bold */


    }


    Tip: Besides bold, you can also specify numeric values for weight (e.g., 700).


    ## Spacing and Alignment in CSS: Examples


    Specifying Space Between Lines of Text:


    Property: line-height


    p {


    line-height: 1.5; /* Sets the space between lines to 1.5 times the normal line
    space */


    }


    Tip: line-height can improve readability, especially in large blocks of text.


    Applying Styles to the First Letter of a Text Element:


    Pseudo-element: ::first-letter


    p::first-letter {


    font-size: 200%;


    color: blue;


    }


    Tip: This is often used to create a drop cap or stylize the first letter of a
    paragraph.


    Transforming Text to Uppercase:


    Property: text-transform: uppercase;


    p {


    text-transform: uppercase; /* Converts all text in the paragraph to uppercase
    */


    }


    Tip: Other values for text-transform include lowercase, capitalize, and none.


    Purpose of the rgba() Color Format:


    Function: Allows specifying colors with an alpha channel (transparency level).


    div {


    background-color: rgba(255, 0, 0, 0.5); /* Semi-transparent red */


    }


    Tip: The rgba format is useful for creating overlay effects or semi-transparent
    elements.


    Controlling Width of an Element''s Border:


    Property: border-width


    div {


    border-width: 5px; /* Sets a 5px border width */


    }


    Tip: You can specify individual border widths for each side (e.g., border-width:
    1px 2px 3px 4px;).


    Changing Background Color on Mouse Hover:


    Property: :hover pseudo-class with background-color


    button:hover {


    background-color: lightblue; /* Changes background color when hovered */


    }


    Tip: This property is widely used for interactive elements like buttons and links
    to improve user experience.


    Specifying List Item Markers:


    Property: list-style-type


    ul {


    list-style-type: square; /* Uses squares as the list item marker */


    }


    Tip: For ordered lists (<ol>), values like decimal or lower-alpha can be used.


    Purpose of the CSS Overflow-x Property:


    Function: Controls how overflow is handled horizontally in a container.


    div {


    overflow-x: scroll; /* Adds a horizontal scrollbar if the content overflows */


    }


    Tip: Use overflow-x when you want to control horizontal overflow without affecting
    the vertical overflow.


    Selecting All Even Rows of a Table:


    Selector: :nth-child() pseudo-class


    tr:nth-child(even) {


    background-color: lightgray;


    }


    Tip: This CSS selector is particularly useful for styling alternate rows in tables
    for better readability.


    Purpose of text-decoration: underline;:


    Function: Adds an underline to the text.


    a {


    text-decoration: underline; /* Underlines all anchor (link) text */


    }


    Tip: Commonly used for emphasizing or highlighting text, especially for links.


    Pseudo-Classes and Elements in CSS: A Comprehensive Exploration


    Changing Color of Visited Links:


    Property: :visited pseudo-class


    a:visited {


    color: purple;


    }


    Tip: Use :visited to style links differently once they have been clicked. Be mindful
    of privacy concerns when styling visited links.


    Applying Styles to Every Second Element:


    Pseudo-class: :nth-child()


    li:nth-child(2n) {


    color: blue; /* Styles every second list item */


    }


    Tip: The 2n in nth-child(2n) represents an even pattern, thus selecting every
    second element.


    Controlling Order of Columns in CSS Grid:


    Property: order within a grid item


    grid-item {


    order: 2; /* Positions this item second in the grid layout */


    }


    Tip: The order property works in both Flexbox and CSS Grid layouts to control
    the sequencing of items.


    The display: inline-block; Property:


    Function: Allows an element to flow like an inline element but retains block-level
    styling capabilities.


    span {


    display: inline-block;


    width: 50px;


    height: 50px;


    }


    Tip: inline-block is useful for aligning elements side by side while still being
    able to set width and height.


    Selecting the First Child of a Specific Element Type:


    Pseudo-class: :first-child


    p:first-child {


    font-weight: bold; /* Styles the first paragraph element in its parent */


    }


    Tip: This selector targets the first occurrence of the specified element within
    its parent.


    Purpose of text-align: center;:


    Function: Horizontally centers the inline content of an element.


    div {


    text-align: center; /* Centers the text inside the div */


    }


    Tip: It''s commonly used for centering text or inline elements within a block-level
    element.


    Control by background-repeat Property:


    Function: Determines how background images are repeated.


    body {


    background-image: url(''image.jpg'');


    background-repeat: no-repeat; /* The image will not be repeated */


    }


    Tip: Other values include repeat, repeat-x, repeat-y.


    Controlling Space Between Columns in CSS Grid:


    Property: grid-column-gap or column-gap in newer specifications


    grid-container {


    display: grid;


    column-gap: 20px; /* Sets the gap between columns */


    }'
