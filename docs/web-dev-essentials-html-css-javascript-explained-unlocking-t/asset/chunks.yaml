    var x = "1";


    console.log(x === 1);


    1.  true


    2.  false


    3.  TypeError


    4.  undefined


    Answer: 2\. false


    Explanation: The === operator tests for both value and type equality. Since x
    is a string and 1 is a number, the comparison returns false.


