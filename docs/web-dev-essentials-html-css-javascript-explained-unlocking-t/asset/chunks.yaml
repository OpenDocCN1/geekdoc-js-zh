    }


    Tip: Commonly used in layouts where floating elements are involved, ensuring consistent
    spacing and alignment.


    Controlling Text Wrapping in CSS:


    Property: white-space


    p {


    white-space: nowrap; /* Prevents text from wrapping to a new line */


    }


    Tip: Other values include normal, pre, pre-wrap, and pre-line.


    Creating a Numbered List:


    HTML Element: <ol> (Ordered List)


    <ol>


    <li>First item</li>


    <li>Second item</li>


    </ol>


    Tip: <ol> automatically creates a numbered list, with <li> for each item.


    Moving Content Away from Borders:


    Property: padding


    div {


    padding: 15px; /* Adds space between the content and the border of the div */


    }


    Tip: Padding increases the internal space within an element, unlike margins which
    create space outside.


