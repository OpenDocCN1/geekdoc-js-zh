  raw: 'What will the following JavaScript code output?


    let str = "Hello, World!";


    console.log(str.length);


    1.  5


    2.  7


    3.  12


    4.  13


    Answer: 4\. 13


    Explanation: The str.length property returns the length of the string, which is
    13 characters in this case.


    Which of the following statements is true about JavaScript''s null value?


    1.  null is a number.


    2.  null represents an empty string.


    3.  null represents the absence of a value or an empty object.


    4.  null is the same as undefined.


    Answer: 3\. null represents the absence of a value or an empty object.


    Explanation: null in JavaScript represents the absence of a value or an empty
    object. It is not a number or an empty string.


    What is the purpose of the Array.prototype.unshift() method in JavaScript?


    1.  To execute a function on each element in the array and return a new array.


    2.  To add a new element to the end of an array.


    3.  To add one or more elements to the beginning of an array and return the new
    length.


    4.  To remove the first element from an array.


    Answer: 3\. To add one or more elements to the beginning of an array and return
    the new length.


    Explanation: Array.prototype.unshift() adds one or more elements to the beginning
    of an array and returns the new length of the array.


    What is the output of the following JavaScript code?


    console.log("Hello" + 5 + 3);


    1.  Hello8


    2.  Hello53


    3.  Hello15


    4.  TypeError


    Answer: 2\. Hello53


    Explanation: JavaScript performs concatenation from left to right, so "Hello"
    + 5 results in "Hello5", and then "Hello5" + 3 results in "Hello53".


    In JavaScript, how can you check if a variable is an array?


    1.  Using the typeof operator.


    2.  Using the isArray() method.


    3.  Using the isArray property.


    4.  Using the array keyword.


    Answer: 2\. Using the isArray() method.


    Explanation: You can use the Array.isArray() method to check if a variable is
    an array in JavaScript.


    What will the following JavaScript code output?


    let x = 5;


    let y = 10;


    console.log(x > y ? "x is greater" : "y is greater");


    1.  "x is greater"


    2.  "y is greater"


    3.  "x > y ? "x is greater" : "y is greater"


    4.  TypeError


    Answer: 2\. "y is greater"


    Explanation: This is a ternary conditional expression. It checks if x is greater
    than y, which is false, so it returns "y is greater".


    What is the purpose of the Array.prototype.reverse() method in JavaScript?


    1.  To execute a function on each element in the array and return a new array.


    2.  To reverse the order of elements in an array in place.


    3.  To sort the elements of an array.


    4.  To check if an array is empty.


    Answer: 2\. To reverse the order of elements in an array in place.


    Explanation: Array.prototype.reverse() is used to reverse the order of elements
    in an array in place, without creating a new array.


    What is the purpose of the Array.prototype.every() method in JavaScript?


    1.  To execute a function on each element in the array and return a new array.


    2.  To combine all elements of an array into a single value.


    3.  To check if at least one element in the array passes a test.


    4.  To check if all elements in the array pass a test.


    Answer: 4\. To check if all elements in the array pass a test.


    Explanation: Array.prototype.every() is used to check if all elements in an array
    pass a test implemented by a provided function. It returns true if all elements
    pass the test, otherwise, it returns false.


