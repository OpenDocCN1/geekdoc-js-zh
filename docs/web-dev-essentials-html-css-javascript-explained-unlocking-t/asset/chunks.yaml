    \ type=\"toolbar\">\n  <li><button type=\"button\">Home</button></li>\n  <li><button\
    \ type=\"button\">Products</button></li>\n</menu>\n```\n\n### Container for External\
    \ Applications/Content\n\nThe `<embed>` or `<object>` elements are used to embed\
    \ external applications or interactive content.\n\nExample:\n\n```html\n<embed\
    \ src=\"file.swf\" width=\"500\" height=\"300\">\n```\n"
