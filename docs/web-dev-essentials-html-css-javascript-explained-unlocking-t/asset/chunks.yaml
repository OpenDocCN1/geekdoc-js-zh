- fmt: "\n# Embedding External Media with the <embed> and <object> Elements\n\nThe\
    \ `<embed>` and `<object>` elements are used to embed external applications and\
    \ interactive content, like Flash animations or PDF readers.\n\n### Example of\
    \ `<embed>`\n\n```html\n<embed src=\"file.swf\" width=\"400\" height=\"50\">\n\
    ```\n\n### Example of `<object>`\n\n```html\n<object data=\"file.swf\" width=\"\
    400\" height=\"50\">\n  <embed src=\"file.swf\" width=\"400\" height=\"50\">\n\
    </object>\n```\n\n### Tips:\n- Use `<embed>` for external multimedia like videos,\
    \ images, or audio.\n- The `<object>` tag can also be used for embedding multimedia,\
    \ and it's more versatile.\n\n## Advanced HTML5 Features\n\n### async Attribute\
    \ in a <script> Tag\n\nThe `async` attribute is used in a `<script>` tag to load\
    \ the script asynchronously with the rest of the page. This means the script will\
    \ be executed as soon as it's downloaded, without blocking HTML parsing.\n\n###\
    \ Example:\n\n```html\n<script async src=\"script.js\"></script>\n```\n\n### Tips:\n\
    - Use `async` for scripts that don't depend on other scripts.\n- It helps improve\
    \ the loading performance of web pages.\n\n### Purpose of the <output> Element\n\
    \nThe `<output>` element is used to represent the result of a calculation or user\
    \ action.\n\n### Example:\n\n```html\n<form oninput=\"are1.value=parseInt(length.value)*parseInt(width.value)\"\
    >\n  <label for=\"length\">Length: </label>\n  <input type=\"number\" id=\"length\"\
    \ name=\"length\" value=\"0\"> units<br>\n  <label for=\"width\">Width: </label>\n\
    \  <input type=\"number\" id=\"width\" name=\"width\" value=\"0\"> units<br>\n\
    \  <label for=\"area\">Area: </label>\n  <output name=\"area\" for=\"length width\"\
    >0</output> square units\n</form>\n```\n\n### Purpose of the <article> Element\n\
    \nThe `<article>` element represents a self-contained composition in a document,\
    \ page, or site, which is intended to be independently distributable or reusable.\n\
    \n### Example:\n\n```html\n<article>\n  <h2>Article Heading</h2>\n  <p>Article\
    \ content...</p>\n</article>\n```\n\n### Tips:\n- Use it for blog posts, news\
    \ articles, user comments, or other items of independent content.\n\n### Required\
    \ Attribute for Input Fields\n\nThe `required` attribute is used to specify that\
    \ an input field must be filled out before submitting the form.\n\n### Example:\n\
    \n```html\n<input type=\"text\" name=\"name\" required>\n```\n\n### ContentEditable\
    \ Attribute\n\nThe `contenteditable` attribute specifies whether the content of\
    \ an element is editable or not.\n\n### Example:\n\n```html\n<div contenteditable=\"\
    true\">You can edit this text.</div>\n```\n\n### Purpose of the <figure> Element\n\
    \nThe `<figure>` element represents self-contained content, often with an optional\
    \ caption, which is specified using `<figcaption>`.\n\n### Example:\n\n```html\n\
    <figure>\n  <img src=\"image.jpg\" alt=\"Image description\">\n  <figcaption>Caption\
    \ for the image.</figcaption>\n</figure>\n```\n\n### defer Attribute in a <script>\
    \ Tag\n\nThe `defer` attribute delays the execution of a script until after the\
    \ document has been parsed.\n\n### Example:\n\n```html\n<script defer src=\"script.js\"\
    ></script>\n```\n\n### Tips:\n- Use `defer` for scripts that need the DOM to be\
    \ fully parsed.\n\n### kind Attribute of the <track> Element\n\nThe `kind` attribute\
    \ in the `<track>` element specifies the kind of text track (subtitles, captions,\
    \ descriptions, chapters, or metadata).\n\n### Example:\n\n```html\n<video controls>\n\
    \  <source src=\"movie.mp4\" type=\"video/mp4\">\n  <track src=\"subtitles_en.vtt\"\
    \ kind=\"subtitles\" srclang=\"en\" label=\"English\">\n</video>\n```\n\n### cols\
    \ Attribute of the <textarea> Element\n\nThe `cols` attribute specifies the visible\
    \ width of a text control (in average character widths).\n\n### Example:\n\n```html\n\
    <textarea name=\"message\" rows=\"10\" cols=\"30\"></textarea>\n```\n\n### Role\
    \ of the alt Attribute for Images\n\nThe `alt` attribute provides alternative\
    \ text for an image if it cannot be displayed.\n\n### Example:\n\n```html\n<img\
    \ src=\"image.jpg\" alt=\"Descriptive text about the image\">\n```\n\n### Tips:\n\
    - Always use the `alt` attribute to improve accessibility.\n\n### download Attribute\
    \ in the <a> Tag\n\nThe `download` attribute in the `<a>` tag suggests that the\
    \ link is to be downloaded rather than navigated to.\n\n### Example:\n\n```html\n\
    <a href=\"path/to/file\" download>Download File</a>\n```\n\n### Purpose of the\
    \ <figcaption> Element\n\nThe `<figcaption>` element represents a caption or legend\
    \ for the rest-of-the contents of its parent `<figure>` element.\n\n### Example:\n\
    \n```html\n<figure>\n  <img src=\"image.jpg\" alt=\"...\">\n  <figcaption>Caption\
    \ goes here.</figcaption>\n</figure>\n```\n\n### Default Value of the type Attribute\
    \ for a <button> Element\n\nThe default value of the `type` attribute for a `<button>`\
    \ element is `submit`.\n\n### Example:\n\n```html\n<button type=\"button\">Click\
    \ Me!</button> <!-- Not a submit button -->\n```\n\n### Specifying Character Encoding\
    \ with charset Attribute\n\nThe `charset` attribute in a `<meta>` tag specifies\
    \ the character encoding for the HTML document.\n\n### Example:\n\n```html\n<meta\
    \ charset=\"UTF-8\">\n```\n\n### Caption for a Figure Element\n\nThe `<figcaption>`\
    \ element is used to define a caption for a `<figure>` element.\n\n### Example:\n\
    \n```html\n<figure>\n  <img src=\"image.jpg\" alt=\"...\">\n  <figcaption>This\
    \ is a caption.</figcaption>\n</figure>\n```\n\n### Indicating a New Article Element\n\
    \nThe `<article>` element is used to indicate a new article element.\n\n### Example:\n\
    \n```html\n<article>\n  <h2>New Article</h2>\n  <p>Content of the new article...</p>\n\
    </article>\n```\n\n### Specifying Metadata with <meta> Element\n\nThe `<meta>`\
    \ element is used to specify metadata about the HTML.\n\n### href Attribute in\
    \ the <a> Tag\n\nThe `href` attribute in the `<a>` tag specifies the URL that\
    \ the link goes to.\n\n### Example:\n\n```html\n<a href=\"https://www.example.com\"\
    >Visit Example.com</a>\n```\n\n### Marking Up a Time-Stamp\n\nThe `<time>` element\
    \ is best suited for marking up a time-stamp.\n\n### Example:\n\n```html\n<time\
    \ datetime=\"2025-01-01\">January 1, 2025</time>\n```\n\n### Purpose of autofocus\
    \ Attribute\n\nThe `autofocus` attribute is used in HTML5 to specify that an element\
    \ should get focus when the page loads.\n\n### Example:\n\n```html\n<input type=\"\
    text\" autofocus>\n```\n\n### Specifying an Ordered List\n\nThe `<ol>` tag is\
    \ used to specify an ordered list in HTML5.\n\n### Example:\n\n```html\n<ol>\n\
    \  <li>First item</li>\n  <li>Second item</li>\n</ol>\n```\n\n### Defining Emphasized\
    \ Text\n\nThe `<em>` element is used in HTML5 to define emphasized text.\n\n###\
    \ Example:\n\n```html\n<p>This is <em>emphasized</em> text.</p>\n```\n\n### disabled\
    \ Attribute in HTML5\n\nThe `disabled` attribute is used to specify that an input\
    \ element should be disabled.\n\n### Example:\n\n```html\n<input type=\"text\"\
    \ disabled>\n```\n\n### Representing a Scalar Value within a Range\n\nThe `<input\
    \ type=\"range\">` element is used to represent a scalar value within a known\
    \ range, such as a volume control.\n\n### Example:\n\n```html\n<input type=\"\
    range\" min=\"1\" max=\"10\">\n```\n\n### multiple Attribute in an <input> Element\n\
    \nThe `multiple` attribute in an `<input>` element allows the user to select or\
    \ enter more than one value.\n\n### Example:\n\n```html\n<input type=\"file\"\
    \ multiple>\n```\n\n# HTML Quiz Questions\n\n## Introduction to HTML Questions\n\
    \nDiving into the world of web development begins with the foundation of any website—HTML\
    \ (HyperText Markup Language). As we approach the questions on HTML, we're embarking\
    \ on a journey to explore the building blocks that shape the structure and content\
    \ of websites. These questions are designed to unravel the intricacies of HTML,\
    \ from the basic structure of a document to the advanced features of HTML5. Whether\
    \ you're curious about the role of different tags, the significance of attributes,\
    \ or the implementation of form elements, this section offers a comprehensive\
    \ guide to mastering HTML.\n\n## Questions about HTML and Explanations\n\nWhat\
    \ does HTML stand for?\n\n1. HyperText Markup Language\n2. HyperTech More Language\n\
    3. HighText Machine Language\n4. None of the above\n\nAnswer: 1\\. HyperText Markup\
    \ Language\n\nExplanation: HTML stands for HyperText Markup Language. It is the\
    \ standard markup language used for creating web pages and web applications. It\
    \ structures the content on the web.\n\nWhich of the following is a new element\
    \ in HTML5?\n\n1. <div>\n2. <table>\n3. <article>\n4. <font>\n\nAnswer: 3\\. <article>\n"
  raw: 'Embedding External Media with the <embed> and <object> Elements


    The <embed> and <object> elements are used to embed external applications and
    interactive content, like Flash animations or PDF readers.


    Example of <embed>:


    <embed src="file.swf" width="400" height="50">


    Example of <object>:


    <object data="file.swf" width="400" height="50">


    <embed src="file.swf" width="400" height="50">


    </object>


    Tips:


    ● Use <embed> for external multimedia like videos, images, or audio.


    ● The <object> tag can also be used for embedding multimedia, and it''s more versatile.


    ## Advanced HTML5 Features


    async Attribute in a <script> Tag


    The async attribute is used in a <script> tag to load the script asynchronously
    with the rest of the page. This means the script will be executed as soon as it''s
    downloaded, without blocking HTML parsing.


    Example:


    <script async src="script.js"></script>


    Tips:


    Use async for scripts that don''t depend on other scripts.


    It helps improve the loading performance of web pages.


    Purpose of the <output> Element


    The <output> element is used to represent the result of a calculation or user
    action.


    Example:


    <form oninput="are1.value=parseInt(length.value)*parseInt(width.value)">


    <label for="length">Length: </label>


    <input type="number" id="length" name="length" value="0"> units<br>


    <label for="width">Width: </label>


    <input type="number" id="width" name="width" value="0"> units<br>


    <label for="area">Area: </label>


    <output name="area" for="length width">0</output> square units


    </form>


    Purpose of the <article> Element


    The <article> element represents a self-contained composition in a document, page,
    or site, which is intended to be independently distributable or reusable.


    Example:


    <article>


    <h2>Article Heading</h2>


    <p>Article content...</p>


    </article>


    Tips:


    Use it for blog posts, news articles, user comments, or other items of independent
    content.


    Required Attribute for Input Fields


    The required attribute is used to specify that an input field must be filled out
    before submitting the form.


    Example:


    <input type="text" name="name" required>


    ContentEditable Attribute


    The contenteditable attribute specifies whether the content of an element is editable
    or not.


    Example:


    <div contenteditable="true">You can edit this text.</div>


    Purpose of the <figure> Element


    The <figure> element represents self-contained content, often with an optional
    caption, which is specified using <figcaption>.


    Example:


    <figure>


    <img src="image.jpg" alt="Image description">


    <figcaption>Caption for the image.</figcaption>


    </figure>


    defer Attribute in a <script> Tag


    The defer attribute delays the execution of a script until after the document
    has been parsed.


    Example:


    <script defer src="script.js"></script>


    Tips:


    Use defer for scripts that need the DOM to be fully parsed.


    kind Attribute of the <track> Element


    The kind attribute in the <track> element specifies the kind of text track (subtitles,
    captions, descriptions, chapters, or metadata).


    Example:


    <video controls>


    <source src="movie.mp4" type="video/mp4">


    <track src="subtitles_en.vtt" kind="subtitles" srclang="en" label="English">


    </video>


    cols Attribute of the <textarea> Element


    The cols attribute specifies the visible width of a text control (in average character
    widths).


    Example:


    <textarea name="message" rows="10" cols="30"></textarea>


    Role of the alt Attribute for Images


    The alt attribute provides alternative text for an image if it cannot be displayed.


    Example:


    <img src="image.jpg" alt="Descriptive text about the image">


    Tips:


    Always use the alt attribute to improve accessibility.


    download Attribute in the <a> Tag


    The download attribute in the <a> tag suggests that the link is to be downloaded
    rather than navigated to.


    Example:


    <a href="path/to/file" download>Download File</a>


    Purpose of the <figcaption> Element


    The <figcaption> element represents a caption or legend for the rest of the contents
    of its parent <figure> element.


    Example:


    <figure>


    <img src="image.jpg" alt="...">


    <figcaption>Caption goes here.</figcaption>


    </figure>


    Default Value of the type Attribute for a <button> Element


    The default value of the type attribute for a <button> element is submit.


    Example:


    <button type="button">Click Me!</button> <!-- Not a submit button -->


    Specifying Character Encoding with charset Attribute


    The charset attribute in a <meta> tag specifies the character encoding for the
    HTML document.


    Example:


    <meta charset="UTF-8">


    Caption for a Figure Element


    The <figcaption> element is used to define a caption for a <figure> element.


    Example:


    <figure>


    <img src="image.jpg" alt="...">


    <figcaption>This is a caption.</figcaption>


    </figure>


    Indicating a New Article Element


    The <article> element is used to indicate a new article element.


    Example:


    <article>


    <h2>New Article</h2>


    <p>Content of the new article...</p>


    </article>


    Specifying Metadata with <meta> Element


    The <meta> element is used to specify metadata about the HTML document that is
    not represented by other HTML elements.


    Example:


    <meta name="description" content="Description of the page">


    href Attribute in the <a> Tag


    The href attribute in the <a> tag specifies the URL of the page the link goes
    to.


    Example:


    <a href="https://www.example.com">Visit Example.com</a>


    Marking Up a Time-Stamp


    The <time> element is best suited for marking up a time-stamp in HTML5.


    Example:


    <time datetime="2025-01-01">January 1, 2025</time>


    Purpose of the autofocus Attribute


    The autofocus attribute is used in HTML5 to specify that an element should automatically
    get focus when the page loads.


    Example:


    <input type="text" autofocus>


    Specifying an Ordered List


    The <ol> tag is used to specify an ordered list in HTML5.


    Example:


    <ol>


    <li>First item</li>


    <li>Second item</li>


    </ol>


    Defining Emphasized Text


    The <em> element is used in HTML5 to define emphasized text.


    Example:


    <p>This is <em>emphasized</em> text.</p>


    disabled Attribute in HTML5


    The disabled attribute is used to specify that an input element should be disabled.


    Example:


    <input type="text" disabled>


    Representing a Scalar Value within a Range


    The <input type="range"> element is used to represent a scalar value within a
    known range, such as a volume control.


    Example:


    <input type="range" min="1" max="10">


    multiple Attribute in an <input> Element


    The multiple attribute in an <input> element allows the user to select or enter
    more than one value.


    Example:


    <input type="file" multiple>


    # HTML Quiz Questions


    ## Introduction to HTML Questions


    Diving into the world of web development begins with understanding the foundation
    of any website—HTML (HyperText Markup Language). As we approach the questions
    on HTML, we''re embarking on a journey to explore the building blocks that shape
    the structure and content of websites. These questions are designed to unravel
    the intricacies of HTML, from the basic structure of a document to the advanced
    features of HTML5. Whether you''re curious about the role of different tags, the
    significance of attributes, or the implementation of form elements, this section
    offers a comprehensive guide to mastering HTML. Through these queries and their
    detailed answers, you''ll gain a solid grounding in crafting web pages, setting
    the stage for more sophisticated web development skills.


    ## Questions about HTML and Explanations


    What does HTML stand for?


    1.    HyperText Markup Language


    2.    HyperTech More Language


    3.    HighText Machine Language


    4.    None of the above


    Answer: 1\. HyperText Markup Language


    Explanation: HTML stands for HyperText Markup Language. It is the standard markup
    language used for creating web pages and web applications. It structures the content
    on the we2.


    Which of the following is a new element in HTML5?


    1.    <div>


    2.    <table>


    3.    <article>


    4.    <font>


    Answer: 3\. <article>'
