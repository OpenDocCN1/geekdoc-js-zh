  trans: "\n\n答案：2. 它们允许脚本在处理请求时继续运行。\n\n解释：JavaScript 中的异步请求（例如使用 `XMLHttpRequest`\
    \ 或 `fetch` API 发出的请求）允许脚本在后台处理请求时继续执行执行。\n\n### `Array.prototype.reduce()` 方法的目的是什么？\n\
    \n1. 遍历数组的每个元素。\n2. 在数组的每个元素上执行一个约器函数（reducer function），产生一个单一的输出值。\n3. 过滤掉数组中的某些元素。\n\
    4. 将数组转换为字符串。\n\n答案：2. 在数组的每个元素上执行一个约器函数，产生一个单一的输出值。\n\n解释：`reduce()` 方法在数组的每个元素上执行一个约器函数，产生一个单一的输出值。它通常用于累加值或拼接字符串。\n\
    \n### 在 JavaScript 中，代码 `typeof NaN` 会返回什么？\n\n1. \"number\"\n2. \"NaN\"\n3. \"\
    undefined\"\n4. \"object\"\n\n答案：1. \"number\"\n\n解释：`NaN` 代表“Not-a-Number”（不是数字），但讽刺的是，在\
    \ JavaScript 中它的类型是“number”。这是该语言的特殊特性之一。\n\n### 在 JavaScript 中，创建新对象的正确方法是哪一个？\n\
    \n1. `let obj = new Object();`\n2. `let obj = Object.create();`\n3. `let obj =\
    \ {};`\n4. 以上所有\n\n答案：4. 以上所有\n\n解释：这三种方法都是在 JavaScript 中创建新对象的正确方式。`new Object()`\
    \ 和 `{}`（对象字面量语法）更为常见，而 `Object.create()` 则用于更复杂的情况，例如设置原型链。\n\n### 如何在 JavaScript\
    \ 文件中添加注释？\n\n1. `<!-- This is a comment -->` \n2. `/* This is a comment */`\n\
    3. `// This is a comment`\n4. 2 和 3 都是\n\n答案：4. 2 和 3 都是\n\n解释：在 JavaScript 中，你可以使用\
    \ `//` 创建单行注释，并使用 `/* */` 创建多行注释。\n\n### JavaScript 中使用哪个方法可以随机打乱数组？\n\n1. 没有内置方法，但可以通过自定义代码实现。\n\
    2. `Array.shuffle()`\n3. `Math.random(array)`\n4. `array.randomize()`\n\n答案：1.\
    \ 没有内置方法，但可以通过自定义代码实现。\n\n解释：JavaScript 没有提供打乱数组的内置方法。然而，你可以通过实现一个函数来实现这一点，通常使用\
    \ Fisher-Yates（或 Knuth）洗牌算法。\n\n```javascript\nfunction shuffle(array) {\n  for\
    \ (let i = array.length - 1; i > 0; i--) {\n    const j = Math.floor(Math.random()\
    \ * (i + 1));\n    [array[i], array[j]] = [array[j], array[i]];\n  }\n  return\
    \ array;\n}\n```\n\n### 引用外部脚本 `script.js` 的正确语法是什么？\n\n1. `<script href=\"script.js\"\
    ></script>`\n2. `<script name=\"script.js\"></script>`\n3. `<script src=\"script.js\"\
    ></script>`\n4. `<script file=\"script.js\"></script>`\n\n答案：3. `<script src=\"\
    script.js\"></script>`\n\n解释：`<script>` 标签中的 `src` 属性用于包含外部文件。\n\n### 如何在 JavaScript\
    \ 中编写 if 语句？\n\n1. `if (i == 5)`\n2. `if i = 5`\n3. `if i == 5`\n4. `if (i = 5)`\n\
    \n答案：1. `if (i == 5)`\n\n解释：`if` 语句的正确语法是 `if (condition)`。\n\n### 如何在 JavaScript\
    \ 中检测浏览器名称？\n\n1. `navigator.appName`\n2. `browser.name`\n3. `client.browser`\n\
    4. `window.browserName`\n\n答案：1. `navigator.appName`\n\n解释：`navigator.appName`\
    \ 属性返回浏览器名称。然而，通常不建议使用这种方法检测浏览器，而是推荐使用特征检测。\n\n### Which JavaScript 捕获除指定以外的所有值？\n\
    \n1. `catch`\n2. `label`\n3. `default`\n4. `except`\n\n答案：3. `default`\n\n解释：在\
    \ `switch` 语句中，`default` 关键字用于指定在没有匹配项时运行的代码。\n\n字体 代码 `Boolean(10 > 9)` 将返回什么？\n\
    \n1. `true`\n2. `false`\n3. `NaN`\n4. `undefined`\n\n答案：1. `true`\n\n解释：`Boolean(10\
    \ > 9)` 求值表达式 `10 > 9`，结果为 `true`。\n\n### 用户点击元素时触发什么事件？\n\n1. `onchange`\n2.\
    \ `onclick`\n3. `onmouseover`\n4. `onmouseclick`\n\n答案：2. `onclick`\n\n解释：当用户点击元素时会触发\
    \ `onclick` 事件。\n\n### 如何声明 JavaScript 变量？\n\n1. `v carName;`\n2. `variableName;`\n\
    3. `var varName;`\n4. `let varName;`\n\n答案：3. `var varName;`\n\n解释：`var` 和 `let`\
    \ 都用于在 JavaScript 中声明变量，但它们具有不同的作用域和提升（hoisting）行为。\n\n 使用哪个运算符给变量赋值？\n\n1. `*`\n\
    2. `-`\n3. `=`\n4. `x`\n\n答案：3. `=`\n\n解释：=` 运算符用于给变量赋值。\n\n### 编写 JavaScript\
    \ 数组的正确方式是什么？\n\n1. `var colors = (\"red\", \"green\", \"blue\")`\n2. `var colors\
    \ = \"red\", \"green\", \"blue\"`\n3. `var colors = [\"red\", \"green\", \"blue\"\
    ]`\n4. `var colors = (\"red\"), (\"green\"), (\"blue\")`\n\n答案：3. `var colors\
    \ = [\"red\", \"green\", \"blue\"]`\n\n解释：在 JavaScript 中，数组写为值的列表，每个值用逗号隔开并括在方括号内。\n\
    \n### JavaScript 中将数字四舍入到最近整数的方法是？\n\n1. `Math.round()`\n2. `Math.floor()`\n3.\
    \ `Math.ceil()`\n\n答案：1. `Math.round()`\n\n解释：`Math.round()` 用于将数字四舍入到最近的整数。\n\
    \n"
- fmt: "\n### Answer: 1. `JSON.stringify()`\n\n**Explanation:** `JSON.stringify()`\
    \ is used to convert an object into a JSON string.\n\n### What is the purpose\
    \ of the `this` keyword in JavaScript?\n\n1. It refers to the current object\n\
    2. It refers to the previously called object\n3. It is a variable that stores\
    \ data\n4. It is a constant value\n\n**Answer:** 1. It refers to the current object\n\
    \n**Explanation:** In JavaScript, `this` is a reference to the current object\
    \ the code is being written inside. Its value depends on where it is used.\n\n\
    ### Which of the following is true about the `forEach` method in JavaScript?\n\
    \n1. It changes the original array.\n2. It returns a new array.\n3. It can break\
    \ out of the loop using a `break` statement.\n4. It executes a provided function\
    \ once for each array element.\n\n**Answer:** 4. It executes a provided function\
    \ once for each array element.\n\n**Explanation:** `forEach()` method executes\
    \ a provided function once for each array element. Unlike `map` or `filter`, it\
    \ does not return a new array and cannot be broken out of using `break` or `return`.\n\
    \n### What does the following expression return?\n\n```\ntypeof \"x\" === \"string\"\
    \n```\n\n1. true\n2. false\n3. TypeError\n4. undefined\n\n**Answer:** 1. true\n\
    \n**Explanation:** The `typeof` operator returns a string indicating the type\
    \ of the unevaluated operand. In this case, `\"x\"` is a string, so `typeof \"\
    x\"` returns `\"string\"`.\n\n### How do you create a `Promise` in JavaScript?\n\
    \n1. `let promise = Promise(value);`\n2. `let promise = new Promise((resolve,\
    \ reject) => { ... });`\n3. `let promise = Promise.create((resolve, reject) =>\
    \ { ... });`\n4. `let promise = create Promise((resolve, reject) => { ... });`\n\
    \n**Answer:** 2. `let promise = new Promise((resolve, reject) => { ... });`\n\n\
    **Explanation:** Promises in JavaScript are created using the `new Promise()`\
    \ constructor, which takes a function with `resolve` and `reject` arguments.\n\
    \n### Which method is used to sort the elements of an array in place and returns\
    \ the sorted array?\n\n1. `Array.sort()`\n2. `Array.order()`\n3. `Array.arrange()`\n\
    4. `Array.sequence()`\n\n**Answer:** 1. `Array.sort()`\n\n**Explanation:** `Array.sort()`\
    \ is a method that sorts the elements of an array in place and returns the sorted\
    \ array.\n\n### What is the output of the following code?\n\n```javascript\nlet\
    \ x = 1;\n\nfunction func() {\n  console.log(x);\n  let x = 2;\n}\n\nfunc();\n\
    ```\n\n1. 1\n2. 2\n3. undefined\n4. ReferenceError\n\n**Answer:** 4. ReferenceError\n\
    \n**Explanation:** Due to JavaScript hoisting, the local variable `x` is hoisted\
    \ to the top of the function, but it's not initialized until `let x = 2;` is executed.\
    \ Accessing `x` before the declaration results in a `ReferenceError`.\n\n### In\
    \ JavaScript, what will the following return?\n\n```\nisNaN(\"hello\")\n```\n\n\
    1. true\n2. false\n3. TypeError\n4. undefined\n\n**Answer:** 1. true\n\n**Explanation:**\
    \ The `isNaN()` function returns true if the value is `NaN` or not a number. The\
    \ string `\"hello\"` is not a number, so the function returns true.\n\n### What\
    \ does the `!!` (double exclamation point) operator do in JavaScript?\n\n1. It\
    \ inverts the boolean value of an expression twice.\n2. It converts a value to\
    \ a boolean with the same truthiness.\n3. It is a syntax error.\n4. It multiplies\
    \ the value by -1 twice.\n\n**Answer:** 2. It converts a value to a boolean with\
    \ the same truthiness.\n\n**Explanation:** The `!!` operator converts a value\
    \ to a boolean while preserving its truthiness. The first `!` negates the value\
    \ (converting it to a boolean), and the second `!` negates it again.\n\n### What\
    \ will be the output of the following code snippet?\n\n```javascript\nconsole.log(1\
    \ + \"2\" + \"2\");\n```\n\n1. 5\n2. 122\n3. 14\n4. Error\n\n**Answer:** 2. 122\n\
    \n**Explanation:** In JavaScript, the `+` operator is also used for string concatenation.\
    \ When used with a string, numbers are converted to strings. Hence, `1 + \"2\"\
    ` becomes `\"12\"`, and `\"12\" + \"2\"` becomes `\"122\"`.\n\n### Which statement\
    \ about `setTimeout()` function in JavaScript is true?\n\n1. It pauses the execution\
    \ of the function for a specified time.\n2. It executes a function once after\
    \ a specified time.\n3. It repeatedly calls a function with a fixed time delay\
    \ between each call.\n4. It is a synchronous function.\n\n**Answer:** 2. It executes\
    \ a function once after a specified time.\n\n**Explanation:** The `setTimeout()`\
    \ function is used to execute a function once after a specified period of time\
    \ in milliseconds. It is asynchronous, meaning the rest of the code will continue\
    \ to execute while the timer counts down.\n\n### What does the following JavaScript\
    \ code return?\n\n```javascript\n[1, 2, 3].map(num => {\n  if (typeof num ===\
    \ 'number') return;\n  return num * 2;\n});\n```\n\n1. [undefined, undefined,\
    \ undefined]\n2. [null, null, null]\n3. [2, 4, 6]\n4. []\n\n**Answer:** 1. [undefined,\
    \ undefined, undefined]\n\n**Explanation:** The `map` function here checks if\
    \ each element is a number and if so, it returns `undefined` (since there's no\
    \ explicit return value). If the element is not a number, it would return `num\
    \ * 2`, but since all elements are numbers, the array will be filled with `undefined`.\n\
    \n### What does the following code output?\n\n```javascript\nlet a = [1, 2, 3];\n\
    let b = a;\nb.push(4);\nconsole.log(a);\n```\n\n1. [1, 2, 3]\n2. [1, 2, 3, 4]\n\
    3. TypeError\n4. undefined\n\n**Answer:** 2. [1, 2, 3, 4]\n\n**Explanation:**\
    \ Since `b` is a reference to the same array as `a`, modifying `b` will also modify\
    \ `a`. Therefore, when you push `4` into `b`, `a` is also updated.\n\n### Which\
    \ of the following is a way to define an object in JavaScript?\n\n1. `var person\
    \ = {firstName:\"John\", lastName:\"Doe\"};`\n2. `var person = Object(\"firstName:\
    \ John, lastName: Doe\");`\n3. `var person = new Object(firstName: \"John\", lastName:\
    \ \"Doe\");`\n4. `var person = {Person(\"firstName: John, lastName: Doe\")};`\n\
    \n**Answer:** 1. `var person = {firstName:\"John\", lastName:\"Doe\"};`\n\n**Explanation:**\
    \ Option 1 uses object literal syntax, which is a common way to create objects.\n"
