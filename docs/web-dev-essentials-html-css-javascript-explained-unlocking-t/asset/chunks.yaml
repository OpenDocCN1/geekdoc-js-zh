    4.  undefined


    Answer: 1\. true


    Explanation: Boolean(10 > 9) evaluates the expression 10 > 9, which is true.


    Which event occurs when the user clicks on an HTML element?


    1.  onchange


    2.  onclick


    3.  onmouseover


    4.  onmouseclick


    Answer: 2\. onclick


    Explanation: The onclick event occurs when the user clicks on an element.


    How do you declare a JavaScript variable?


    1.  v carName;


    2.  variable carName;


    3.  var carName;


    4.  let = carName;


    Answer: 3\. var carName;


    Explanation: Both var and let are used to declare a variable in JavaScript, but
    they have different scopes and hoisting behavior.


    Which operator is used to assign a value to a variable?


    1.  *


    2.  -


    3.  =


    4.  x


    Answer: 3\. =


    Explanation: The = operator is used to assign values to variables in JavaScript.


    What is the correct way to write a JavaScript array?


    1.  var colors = (1:"red", 2:"green", 3:"blue")


    2.  var colors = "red", "green", "blue"


    3.  var colors = ["red", "green", "blue"]


    4.  var colors = 1 = ("red"), 2 = ("green"), 3 = ("blue")


    Answer: 3\. var colors = ["red", "green", "blue"]


    Explanation: In JavaScript, an array is written as a list of values, each separated
    by a comma, and enclosed in square brackets.


    What is the method for rounding a number to the nearest integer in JavaScript?


    1.  Math.round()


    2.  Math.floor()


    3.  Math.ceil()


    4.  Number.round()


    Answer: 1\. Math.round()


    Explanation: Math.round() is used to round a number to the nearest integer.


    Which of the following will check if a variable v is an array in JavaScript?


    1.  v.isArray()


    2.  Array.isArray(v)


    3.  v instanceof Array


    4.  Both B and C are correct


    Answer: 4\. Both B and C are correct


    Explanation: Array.isArray(v) is a standard method to check if v is an array.
    v instanceof Array also works but it might not be as reliable in all contexts,
    especially when dealing with different JavaScript contexts (like iframes).


    How do you find the number with the highest value of x and y?


    1.  Math.ceil(x, y)


    2.  Math.max(x, y)


    3.  Math.top(x, y)


    4.  Math.highest(x, y)


    Answer: 2\. Math.max(x, y)


    Explanation: Math.max(x, y) returns the highest value among its arguments.


