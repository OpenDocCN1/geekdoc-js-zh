    3. `text-spacing`\n4. `word-spacing`\n\n**Answer:** 2. `letter-spacing`\n\n**Explanation:**\
    \ The `letter-spacing` property in CSS is used to control the spacing between\
    \ individual characters in text.\n\n**Code Sample:**\n```\np {\n  letter-spacing:\
    \ 2px;\n}\n```\n\n## 12. What is the CSS property used to control the vertical\
