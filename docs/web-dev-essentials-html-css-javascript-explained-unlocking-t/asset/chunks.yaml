    color: red; /* Styles <p> when its parent <div> is hovered */


    }


    Tip: This is a common technique for creating interactive hover effects on parent-child
    relationships.


    Spacing Between Characters:


    Property: letter-spacing


    p {


    letter-spacing: 2px; /* Increases the space between characters */


    }


    Tip: Negative values can be used for closer character spacing.


    Vertical Text Alignment:


    While CSS doesn''t provide a direct way to vertically align text, a common technique
    involves using display: flex and align-items.


    div {


    display: flex;


    align-items: center; /* Vertically centers text in the div */


    height: 100px;


    }


    Tip: Flexbox is a versatile tool for both horizontal and vertical alignment.


    Selecting the Last Child of a Specific Element Type:


    Pseudo-class: :last-child


    p:last-child {


    font-weight: bold; /* Styles the last <p> element in its parent */


    }


    Tip: Targets the last occurrence of the specified element within its parent.


    cursor: pointer; Property:


    Function: Changes the cursor to a pointer, indicating a clickable element.


    button {


    cursor: pointer;


    }


    Tip: Commonly used for buttons, links, or other interactive elements.


    Purpose of text-overflow: ellipsis;:


    Function: Truncates text and shows an ellipsis (...) when it overflows its container.


    div {


    white-space: nowrap;


    overflow: hidden;


    text-overflow: ellipsis;


    }


    Tip: Ensure overflow is set to hidden and white-space to nowrap for this to work.


    Specifying Style of an Element''s Border:


    Property: border-style


    div {


    border-style: dashed; /* Sets a dashed border */


    }


    Tip: Values include solid, dotted, dashed, double, none, etc.


    font-family Property:


    Function: Specifies the typeface used for text in an element.


    body {


    font-family: "Arial", sans-serif;


    }


    Tip: Always provide fallback font options.


    Controlling Transparency:


    Property: opacity


    div {


    opacity: 0.5; /* 50% transparent */


    }


    Tip: The value of opacity ranges from 0 (fully transparent) to 1 (fully opaque).


    Selecting Elements with a Specific Class:


    example {


    color: blue; /* Selects all elements with class ''example'' */


    }


    Tip: Class selectors are the backbone of CSS styling and are widely used due to
    their versatility.


    box-sizing: border-box; Property:


    Function: The dimensions of the element include padding and border.


    div {


    box-sizing: border-box;


    }


    Tip: Makes width and height styling more predictable, especially when adding padding
    or borders.


    Selecting Links Within a Specific Section:


    #sectionId a {


    color: green; /* Styles all <a> elements within the element with id ''sectionId''
    */


    }


    Tip: Replace #sectionId with the actual ID of the section you''re targeting.


    Creating a Shadow Behind an Element''s Border:


    Property: box-shadow


    div {


    box-shadow: 10px 10px 5px grey; /* Adds a shadow to the div */


    }


    Tip: Use box-shadow to add depth to elements, enhancing the user interface.


    Selecting the Last Element of a Specific Type:


    Pseudo-class: :last-of-type


    p:last-of-type {


    color: red; /* Styles the last <p> element within its parent */


    }


    Tip: This is similar to :last-child but specific to the element type.


    Creating a Rotating Animation:


    Property: CSS Animations with @keyframes


    @keyframes rotate {


    from { transform: rotate(0deg); }


    to { transform: rotate(360deg); }


    }


    div {


    animation: rotate 2s infinite linear;


    }


    Tip: CSS animations allow for complex effects and transformations.


    text-decoration: none; Property:


    Function: Removes decoration from text, commonly used to remove underlines from
    links.


    a {


    text-decoration: none;


    }


    Tip: Essential for custom link styling.


    ## Selecting the First Element of a Specific Type:


    Pseudo-class: :first-of-type


    p:first-of-type {


    font-size: 20px; /* Styles the first <p> element within its parent */


    }


    Tip: Targets the first instance of the specified type, regardless of siblings
    of other types.


    Controlling Spacing Between Lines of Text:


    Property: line-height


    p {


    line-height: 1.5; /* 1.5 times the normal line height */


    }


    Tip: line-height improves text readability and aesthetics, especially in large
    text blocks.


    # CSS Quiz Questions


    ## Introduction to CSS Questions


    With a grasp of HTML under your belt, the next step in your web development journey
    is to delve into the art of styling with CSS (Cascading Style Sheets). The questions
    in this section are meticulously curated to guide you through the aesthetic aspects
    of web design, from basic styling tips to complex layout techniques. CSS is what
    brings visual life to websites, allowing for the customization of colors, fonts,
    spacing, and much more. Through these questions, you''ll explore how CSS works,
    its syntax, selectors, the box model, and beyond. This is your pathway to understanding
    how to make web pages not just functional, but also visually appealing and responsive.
    Prepare to transform your web pages into visually compelling and user-friendly
    interfaces.


    ## Questions about CSS and Explanations


    What does CSS stand for?


    1.  Computer Style Sheets


    2.  Creative Style Sheets


    3.  Cascading Style Sheets


    4.  Colorful Style Sheets


    Answer: 3\. Cascading Style Sheets


    Explanation: CSS stands for Cascading Style Sheets. It is used to style and layout
    web pages — for example, to alter the font, color, size, and spacing of your content,
    split it into multiple columns, or add animations and other decorative features.


    Which HTML tag is used to define an internal style sheet?


    1.  <style>


    2.  <css>


    3.  <script>


    4.  <link>


    Answer: 1\. <style>


    Explanation: The <style> tag is used to define style information (CSS) for a single
    document. It is placed in the document''s head section.


    Code Sample:


    <head>


    <style>


    body { background-color: lightblue; }


    </style>


    </head>


    How do you select an element with the id "demo" in CSS?


    1.  *demo


    2.  #demo


    3.  demo


    4.  demo


    Answer: 2\. #demo


    Explanation: In CSS, the hash symbol (#) is used to select elements with a specific
    id.


    Code Sample:


    #demo {


    color: blue;


    }


    How do you select elements with the class name "example"?


    1.  *example


    2.  #example


    3.  example


    4.  example


    Answer: 3\. .example


    Explanation: In CSS, the dot (.) is used to select elements with a specific class.


    Code Sample:


    example {


    font-size: 20px;


    }


    How do you make each word in a text start with a capital letter?


    1.  text-transform: capitalize;


    2.  text-transform: uppercase;


    3.  text-transform: lowercase;


    4.  text-decoration: capitalize;


    Answer: 1\. text-transform: capitalize;


    Explanation: The text-transform: capitalize; CSS property capitalizes the first
    letter of each word in the element''s text.


    Code Sample:


    p {


    text-transform: capitalize;


    }


    Which property is used to change the background color?


    1.  color


    2.  bgcolor'
