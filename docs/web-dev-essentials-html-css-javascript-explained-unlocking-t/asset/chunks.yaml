    Explanation: The x++ operator first returns the value of x and then increments
    it. So, y gets the value of x before incrementation.


    In JavaScript, which method is used to remove the first element from an array
    and return that element?


    1.  shift()


    2.  unshift()


    3.  pop()


    4.  push()


    Answer: 1\. shift()


    Explanation: The shift() method removes the first element from an array and returns
    that removed element.


    What is the main difference between let and const in JavaScript?


    1.  let declarations are block-scoped, const declarations are not.


    2.  let allows reassignment, const does not.


    3.  let is function-scoped, const is block-scoped.


    4.  let can store objects and arrays, const cannot.


    Answer: 2\. let allows reassignment, const does not.


    Explanation: Both let and const are block-scoped. However, variables declared
    with let can be reassigned, while variables declared with const cannot be reassigned.


    What is the output of the following code?


    console.log(typeof null);


    1.  "null"


    2.  "undefined"


    3.  "object"


    4.  "number"


    Answer: 3\. "object"


    Explanation: In JavaScript, typeof null returns "object". This is actually a long-standing
    bug in JavaScript, as null is not really an object.


    What will be logged in the console in the following code?


    let num = 8;


    let newNum = num++;


    console.log(num, newNum);


    1.  8 8


    2.  8 9


    3.  9 8


    4.  9 9


    Answer: 3\. 9 8


    Explanation: num++ is a post-increment operator, so it returns num (which is 8)
    before incrementing it. Hence, newNum is 8, and num becomes 9.


    Which statement will correctly call a function named myFunction?


    1.  call myFunction();


    2.  myFunction();'
