    let obj = {}; // 语法

    ```


    ### delete 运算符的作用


    它从对象中删除属性。


    ### 模板字符串的作用


    模板字符串提供了一种创建嵌入表达式字符串的方法。


    ### `?.` 运算符在 JavaScript 中的含义


    可选链运算符允许你读取链中的属性值，而无需检查链中的每个部分。


    ### `finally` 块的作用


    `finally` 块在 `try` 和 `catch` 块之后执行，无论是否抛出或捕获了异常。


