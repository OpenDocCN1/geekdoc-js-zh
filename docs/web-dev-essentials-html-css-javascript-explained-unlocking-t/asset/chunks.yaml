    \ 1. To provide a hint to the user about what kind of information is expected\
    \ in the input\n\n**Explanation:** The `placeholder` attribute provides a hint\
    \ to the user about what kind of information is expected in the input field, typically\
    \ displayed until the user starts typing in the field.\n\n## Which HTML5 element\
    \ defines a group of media content, and is typically used with the `<audio>` or\
    \ `<video>` elements?\n\n1. `<media>`\n2. `<group>`\n3. `<source>`\n4. `<track>`\n\
    \n**Answer:** 3. `<source>`\n\n**Explanation:** The `<source>` element is used\
    \ within media elements like `<audio>` or `<video>` to specify multiple media\
    \ sources for different devices or browsers.\n\n## In HTML5, which element is\
    \ used to define a container for vector graphics?\n\n1. `<svg>`\n2. `<vector>`\n\
    3. `<graphics>`\n4. `<draw>`\n\n**Answer:** 1. `<svg>`\n\n**Explanation:** The\
    \ `<svg>` (Scalable Vector Graphics) element is used to define a container for\
    \ vector graphics in HTML5.\n\n## What is the purpose of the `formaction` attribute\
    \ in an `<input type=\"submit\">` element in HTML5?\n\n1. To specify the action\
    \ for the form where the input element is located\n2. To override the form's action\
    \ attribute for that specific submit button\n3. To define a group of actions for\
    \ form submission\n4. To specify the method of form submission\n\n**Answer:**\
    \ 2. To override the form's action attribute for that specific submit button\n\
    \n**Explanation:** The `formaction` attribute in an `<input type=\"submit\">`\
    \ element allows you to override the `action` attribute of the form for that specific\
    \ submit button.\n\n## Which HTML5 element is used to define a block of text that\
    \ has been quoted from another source?\n\n1. `<blockquote>`\n2. `<quote>`\n3.\
    \ `<citation>`\n4. `<source>`\n\n**Answer:** 1. `<blockquote>`\n\n**Explanation:**\
    \ The `<blockquote>` element is used to define a block of text that is quoted\
    \ from another source.\n\n## In HTML5, what does the `nowrap` attribute in a `<td>`\
    \ element do?\n\n1. Prevents the text in a table cell from wrapping\n2. Automatically\
    \ adjusts the width of the cell to fit the content\n3. Aligns the text to the\
    \ top of the cell\n4. Stretches the cell to fit the largest item\n\n**Answer:**\
    \ 1. Prevents the text in a table cell from wrapping\n\n**Explanation:** The `nowrap`\
    \ attribute in a `<td>` (table cell) element prevents the text within the cell\
    \ from wrapping.\n\n## Which HTML5 element is used to define a header for a document\
    \ or section?\n\n1. `<head>`\n2. `<header>`\n3. `<top>`\n4. `<sectionhead>`\n\n\
    **Answer:** 2. `<header>`\n\n**Explanation:** The `<header>` element is used in\
    \ HTML5 to define a header for a document or a section.\n\n## What is the purpose\
    \ of using semantic elements in HTML (e.g., `<article>`, `<section>`, `<nav>`,\
    \ `<aside>`) and how do they benefit web accessibility?\n\n1. To make the HTML\
    \ code look cleaner\n2. To enhance the SEO of the website\n3. To define the structure\
    \ of the webpage more clearly to both developers and browsers\n4. All of the above\n\
    \n**Answer:** 4. All of the above\n\n**Explanation:** Semantic HTML elements clearly\
    \ describe their meaning in a human- and machine-readable way. They help in making\
    \ web pages more accessible, particularly for screen readers and search engines,\
    \ by providing more context about the content. They also contribute to cleaner\
    \ code and better SEO by outlining the structure of the webpage clearly.\n\n##\
    \ Which HTML5 attribute prevents a form from being submitted until the user has\
    \ filled out the input field?\n\n1. `placeholder`\n2. `required`\n3. `validate`\n\
    4. `pattern`\n\n**Answer:** 2. `required`\n\n**Explanation:** The `required` attribute\
    \ is a boolean attribute that, when present, specifies that an input field must\
    \ be filled out before submitting the form. It is used for client-side validation\
    \ to ensure that the field is not left blank.\n\n## What is the primary use of\
    \ the `<canvas>` element in HTML5?\n\n1. To display database records\n2. To draw\
    \ graphics on a web page via scripting\n3. To create draggable elements\n4. To\
    \ embed video files\n\n**Answer:** 2. To draw graphics on a web page via scripting\n\
    \n**Explanation:** The `<canvas>` element is used to draw graphics on a web page\
    \ with the help of `JavaScript`. It provides a drawing surface for 2D shapes and\
    \ images, but it can also be used for other visual outputs like games or graph\
    \ plotting.\n\n## Which global attribute in HTML is used to specify a unique identifier\
    \ for an element?\n\n1. `class`\n2. `id`\n3. `style`\n4. `title`\n\n**Answer:**\
    \ 2. `id`\n\n**Explanation:** The `id` attribute is used to assign a unique identifier\
    \ to an HTML element. It is global because it can be applied to any element, not\
    \ just one specific type. The value of the `id` attribute must be unique within\
    \ the HTML document to correctly identify the element for styling, scripting,\
    \ or linking purposes.\n\n## What is the correct HTML element to use for embedding\
    \ sound files into web pages?\n\n1. `<sound>`\n2. `<audio>`\n3. `<source>`\n4.\
    \ `<music>`\n\n**Answer:** 2. `<audio>`\n\n**Explanation:** The `<audio>` element\
    \ is used to embed sound content in HTML documents. It allows you to play audio\
    \ files without needing external plugins.\n\n# Introduction to CSS: Tips and Basics\n\
    \n## Introduction to CSS\nCascading Style Sheets (CSS) is a cornerstone technology\
    \ of the World Web, alongside HTML and JavaScript. It is designed to enable the\
    \ separation of presentation and content.\n\n## Understanding CSS Syntax\nCSS\
    \ is composed of rulesets. Each ruleset consists of a selector and a declaration\
    \ block:\n\n## HTML Tag for Defining Internal Style Sheet\nUse the `<style>` tag\
    \ within the `<head>` section.\n```html\n<head>\n  <style>\n    body {\n     \
    \ background-color: lightblue;\n    }\n  </style>\n</head>\n```\n**Tip:** Internal\
    \ style sheets are useful for single-page styles. For larger projects, external\
    \ CSS files are recommended.\n\n## Selecting an Element with ID \"demo\" in CSS\n\
    Use the hashtag `#` followed by ID.\n```css\n#demo {\n  color: blue;\n}\n```\n\
    **Tip:** IDs are unique to each element, making `#demo` select the specific element\
    \ with `id=\"demo\"`.\n\n## Selecting Elements with Class Name \"example\"\nUse\
    \ the dot `.` followed by class name.\n```css\n.example {\n  font-size: 20px;\n\
    }\n```\n**Tip:** Class selectors are used to select and style all elements with\
    \ the class attribute.\n\n## Capitalizing Each Word in a Text\nUse the `text-transform`\
    \ property with `capitalize`.\n```css\np {\n  text-transform: capitalize;\n}\n\
    ```\n**Tip:** This property capitalizes the first letter of each word in the selected\
    \ element.\n\n## Changing the Background Color\nUse the `background-color` property.\n\
    ```css\nbody {\n  background-color: lightgray;\n}\n```\n**Tip:** You can use color\
    \ names, RGB, RGBA, HEX, etc., as values for this property.\n\n## Changing the\
    \ Font of an Element\nUse the `font-family` property.\n```css\np {\n  font-family:\
    \ Arial, sans-serif;\n}\n```\n**Tip:** Always provide a fallback font (like `sans-serif`\
    \ or `serif`) in case the first choice font isn't available.\n\n## Making a List\
    \ with Square Items\nUse the `list-style-type` property on `ul` or `li` elements.\n\
    ```css\nul {\n  list-style-type: square;\n}\n```\n**Tip:** This styles the bullet\
    \ points of a list. Other values include `circle`, `disc`, `none`, etc.\n\n##\
    \ Selecting All `<p>` Elements Inside a `<div>`\nUse descendant combinator (space)\
    \ to select nested elements.\n```css\ndiv p {\n  color: red;\n}\n```\n**Tip:**\
    \ This selects all `<p>` elements that are inside any `<div>` element.\n\n## CSS\
    \ Property for Text Size\nProperty: `font-size`\n```css\np {\n  font-size: 16px;\n\
    }\n```\n**Tip:** You can use different units like `px`, `em`, `rem`, or `%` for\
    \ setting the size.\n"
