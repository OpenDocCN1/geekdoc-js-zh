  trans: "\n\n### 答案: 1. `JSON.stringify()`\n\n**解释：** `JSON.stringify()` 用于将对象转换为\
    \ JSON 字符串。\n\n### JavaScript 中 `this` 关键字的目的是什么？\n\n1. 它指向当前对象 \n2. 它指向之前调用的对象\n\
    3. 它是一个存储数据的变量\n4. 它是一个常量值\n\n**答案：** 1. 它指向当前对象\n\n**解释：** 在 JavaScript 中，`this`\
    \ 是代码所在位置的当前对象的引用。它的值取决于它被使用的地方。\n\n### 关于 JavaScript 中的 `forEach` 方法，以下哪项是正确的？\n\
    \n1. 它会改变原始数组。\n2. 它返回一个新数组。\n3. 它可以使用 `break` 语句跳出循环。\n4. 它会对数组中的每个元素执行一次提供的函数。\n\
    \n**答案：** 4. 它会对数组中的每个元素执行一次提供的函数。\n\n**解释：** `forEach()` 方法会为数组中的每个元素执行一次提供的函数。与\
    \ `map` 或 `filter` 不同，它不会返回新数组，并且无法通过 `break` 或 `return` 跳出循环。\n\n### 下列表达式返回什么？\n\
    \n```\ntypeof \"x\" === \"string\"\n```\n\n1. true\n2. false\n3. TypeError\n4.\
    \ undefined\n\n**答案：** 1. true\n\n**解释：** `typeof` 运算符返回一个指示未求值操作数的字符串。在这种情况下，`\"\
    x\"` 是一个字符串，因此 `typeof \"x\"` 返回 `\"string\"`。\n\n### 如何在 JavaScript 中创建一个 `Promise`？\n\
    \n1. `let promise = Promise(value);`\n2. `let promise = new Promise((resolve,\
    \ reject) => { ... });`\n3. `let promise = Promise.create((resolve, reject) =>\
    \ { ... });`\n4. `let promise = create Promise((resolve, reject) => { ... });`\n\
    \n**答案：** 2. `let promise = new Promise((resolve, reject) => { ... });`\n\n**解释：**\
    \ JavaScript 中的 Promise 是使用 `new Promise()` 构造函数创建的，它接收带有 `resolve` 和 `reject`\
    \ 参数的函数。\n\n### 使用哪个方法可以对数组元素进行排序并返回排序后的数组？\n\n1. `Array.sort()`\n2. `Array.order()`\n\
    3. `Array.arrange()`\n4. `Array.sequence()`\n\n**答案：** 1. `Array.sort()`\n\n**解释：**\
    \ `Array.sort()` 是一个原地对数组元素进行排序并返回排序后数组的方法。\n\n### 以下代码的输出是什么？\n\n```javascript\n\
    let x = 1;\n\nfunction func() {\n  console.log(x);\n  let x = 2;\n}\n\nfunc();\n\
    ```\n\n1. 1\n2. 2\n3. undefined\n4. ReferenceError\n\n**答案：** 4. ReferenceError\n\
    \n**解释：** 由于 JavaScript 的变量提升（hoisting），局部变量 `x` 被提升到函数顶部，但在执行 `let x = 2;` 之前它还没有被初始化。在声明之前访问\
    \ `x` 会导致 `ReferenceError`。\n\n### 在 JavaScript 中，以下将返回什么？\n\n```\nisNaN(\"hello\"\
    )\n```\n\n1. true\n2. false\n3. TypeError\n4. undefined\n\n**答案：** 1. true\n\n\
    **解释：** `isNaN()` 函数在值值为 `NaN` 或不是数字时返回 true。字符串 `\"hello\"` 不是数字，因此该函数返回 true。\n\
    \n### JavaScript 中 `!!`（双感叹号）运算符的作用是什么？\n\n1. 它两次反转表达式的布尔值。\n2. 它将一个值转换为具有相同真值（truthiness）的布尔值。\n\
    3. 它是一个语法错误。\n4. 它将值乘以 -1 两次。\n\n**答案：** 2. 它将一个值转换为具有相同真值的布尔值。\n\n**解释：** `!!`\
    \ 运算符在保留其真值的同时将值转换为布尔值。第一个 `!` 取反该值（将其转换为布尔值），第二个 `!` 再次取反。\n\n### 以下代码段的输出是什么？\n\
    \n```javascript\nconsole.log(1 + \"2\" + \"2\");\n```\n\n1. 5\n2. 122\n3. 14\n\
    4. Error\n\n**答案：** 2. 122\n\n**解释：** 在 JavaScript 中，`+` 运算符也用于字符串拼接。当与字符串一起使用时，数字会被转换为字符串。因此，`1\
    \ + \"2\"` 变成 `\"12\"`，而 `\"12\" + \"2\"` 变成 `\"122\"`。\n\n### 关于 JavaScript 中的\
    \ `setTimeout()` 函数，哪项描述是正确的？\n\n1. 它暂停函数的执行一段指定的时间。\n2. 它在指定时间后执行一次函数。\n3. 它在每次调用之间以固定时间延迟重复地调用一个函数。\n\
    4. 它是一个同步函数。\n\n**答案：** 2. 它在指定时间后执行一次函数。\n\n**解释：** `setTimeout()` 函数用于在指定的毫秒数后执行一次函数。它是异步的，这意味着在计时器倒计时时，其余代码将继续执行。\n\
    \n### 以下 JavaScript 代码返回什么？\n\n```javascript\n[1, 2, 3].map(num => {\n  if (typeof\
    \ num === 'number') return;\n  return num * 2;\n});\n```\n\n1. [undefined, undefined,\
    \ undefined]\n2. [null, null, null]\n3. [2, 4, 6]\n4. []\n\n**答案：** 1. [undefined,\
    \ undefined, undefined]\n\n**解释：** `map` 函数在这里检查每个元素是否为数字，如果是，则返回 `undefined`（因为没有显式的返回值）。如果元素不是数字，它会返回\
    \ `num * 2`，但由于所有元素都是数字，数组将填充 `undefined`。\n\n### 以下代码输出什么？\n\n```javascript\n\
    let a = [1, 2, 3];\nlet b = a;\nb.push(4);\nconsole.log(a);\n```\n\n1. [1, 2,\
    \ 3]\n2. [1, 2, 3, 4]\n3. TypeError\n4. undefined\n\n**答案：** 2. [1, 2, 3, 4]\n\
    \n**解释：** 由于 `b` 是 `a` 相同数组的引用，修改 `b` 也会修改 `a`。因此，当你向 `b` 推入 `4` 时，`a` 也更新了。\n\
    \n### 以下哪种方法是在 JavaScript 中定义对象？\n\n1. `var person = {firstName:\"John\", lastName:\"\
    Doe\"};`\n2. `var person = Object(\"firstName: John, lastName: Doe\");`\n3. `var\
    \ person = new Object(firstName: \"John\", lastName: \"Doe\");`\n4. `var person\
    \ = {Person(\"firstName: John, lastName: Doe\")};`\n\n**答案：** 1. `var person =\
    \ {firstName:\"John\", lastName:\"Doe\"};`\n\n**解释：** 选项 1 使用对象字字量语法，这是创建对象的常用方式。\n\
    \n"
- fmt: "\n### 3. call function myFunction();\n\n### 4. execute myFunction();\n\n**Answer:**\
    \ 2\\. `myFunction();`\n\n**Explanation:** In JavaScript, you call a function\
    \ by writing the function's name followed by parentheses. So, `myFunction();`\
    \ is the correct syntax.\n\n### What is the output of this code snippet?\n\n```javascript\n\
    let x = \"Hello\";\nlet y = new String(\"Hello\");\nconsole.log(x === y);\n```\n\
    \n1. true\n2. false\n3. TypeError\n4. undefined\n\n**Answer:** 2\\. false\n\n\
    **Explanation:** `x` is a string literal, while `y` is an object created by the\
    \ `String` constructor. In JavaScript, the `===` operator checks for both value\
    \ and type, so these two are not considered the same.\n\n### Which method can\
    \ be used to combine two or more arrays in JavaScript?\n\n1. `Array.join()` \n\
    2. `Array.concat()`\n3. `Array.merge()`\n4. `Array.combine()`\n\n**Answer:** 2\\\
    . `Array.concat()`\n\n**Explanation:** `Array.concat()` is used to merge two or\
    \ more arrays into a new array without modifying the original arrays.\n\n### What\
    \ will the following code log to the console?\n\n```javascript\nconsole.log(typeof\
    \ (() => {}));\n```\n\n1. \"function\"\n2. \"object\"\n3. \"undefined\"\n4. \"\
    string\"\n\n**Answer:** 1\\. \"function\"\n\n**Explanation:** An arrow function\
    \ `() => {}` is a type of function, so `typeof` for an arrow function will return\
    \ \"function\".\n\n### Which of the following is the correct way to create an\
    \ object in JavaScript?\n\n1. `var obj = {};`\n2. `var obj = new Object();`\n\
    3. `var obj = Object.create(null);`\n4. All of the above\n\n**Answer:** 4\\. All\
    \ of the above\n\n**Explanation:** All three methods are correct for creating\
    \ an object in JavaScript. The first uses object literal syntax, the second uses\
    \ the `Object` constructor, and the third uses `Object.create()`.\n\n### What\
    \ does the following JavaScript code return?\n\n```javascript\n\"Cat\" && \"Dog\"\
    \n```\n\n1. \"Cat\"\n2. \"Dog\"\n3. true\n4. false\n\n**Answer:** 2\\. \"Dog\"\
    \n\n**Explanation:** The logical AND (`&&`) operator returns the value of the\
    \ second operand if the first is truthy. Since `\"Cat\"` is truthy, it returns\
    \ `\"Dog\"`.\n\n### What does the delete operator in JavaScript do?\n\n1. It deletes\
    \ variables.\n2. It removes properties from objects.\n3. It deletes elements from\
    \ an array.\n4. It removes a file from the server.\n\n**Answer:** 2\\. It removes\
    \ properties from objects.\n\n**Explanation:** The `delete` operator is used to\
    \ remove properties from objects. It does not delete variables or array elements\
    \ (it will leave a hole in the array).\n\n### What will the following code output?\n\
    \n```javascript\nlet x = 1;\nlet y = x !== 2;\nconsole.log(y);\n```\n\n1. 1\n\
    2. false\n3. true\n4. undefined\n\n**Answer:** 3\\. true\n\n**Explanation:** The\
    \ expression `x !== 2` is true because `x` (which is `1`) is not equal to `2`.\n\
    \n### What is the output of this code snippet?\n\n```javascript\nconsole.log(typeof\
    \ \"Hello\" === \"string\");\n```\n\n1. true\n2. false\n3. TypeError\n4. undefined\n\
    \n**Answer:** 1\\. true\n\n**Explanation:** `typeof \"Hello\"` returns `\"string\"\
    `, and so the comparison `\"string\" === \"string\"` is true.\n\n### What is the\
    \ purpose of template literals in JavaScript?\n\n1. They allow you to perform\
    \ complex calculations.\n2. They enable secure data transmission.\n3. They provide\
    \ an easy way to interpolate variables and expressions into strings.\n4. They\
    \ improve the performance of string operations.\n\n**Answer:** 3\\. They provide\
    \ an easy way to interpolate variables and expressions into strings.\n\n**Explanation:**\
    \ Template literals (denoted by backticks `` ` ```) allow embedded expressions\
    \ and variables, making it easier to create complex strings.\n\n### What does\
    \ the `?.` operator signify in JavaScript?\n\n1. Nullish Coalescing\n2. Logical\
    \ AND\n3. Optional Chaining\n4. Exclusive OR\n\n**Answer:** 3\\. Optional Chaining\n\
    \n**Explanation:** The optional chaining operator `?.` allows you to read the\
    \ value of a property located deep within a chain of connected objects without\
    \ having to check that each reference in the chain is valid.\n\n### What will\
    \ the following code output to the console?\n\n```javascript\nconsole.log(\"Hello,\
