    Explanation: The overflow property specifies how to handle the content that overflows
    its container''s box, such as displaying scroll bars or cutting off the overflow.


    In CSS, what is the difference between visibility: hidden; and display: none;?


    1.  No difference, both hide the element from the page


    2.  visibility: hidden; hides an element, but it still takes up space in the layout


    3.  display: none; changes the visibility to hidden


    4.  visibility: hidden; removes the element from the document


    Answer: 2\. visibility: hidden; hides an element, but it still takes up space
    in the layout


    Explanation: visibility: hidden; hides the element, but it still occupies its
    space in the layout. In contrast, display: none; removes the element from the
    layout entirely.


    Which property is used to change the cursor type on hover?


    1.  cursor-type


    2.  hover


    3.  cursor


    4.  pointer-type


    Answer: 3\. cursor


    Explanation: The cursor property in CSS is used to change the type of cursor when
    hovering over an element.


    What is the use of the :nth-child() pseudo-class in CSS?


    1.  To select elements based on their attributes


    2.  To target elements that are the nth child of their parent


    3.  To change styles every nth time an element appears


    4.  To select the first child of a specific type within its parent


    Answer: 2\. To target elements that are the nth child of their parent


    Explanation: The :nth-child() pseudo-class in CSS is used to select elements based
    on their position within a group of siblings.


    What is the default position value in CSS?


    1.  absolute


    2.  fixed


    3.  relative


    4.  static


    Answer: 4\. static


    Explanation: The default value for the position property in CSS is static, which
    means the element is positioned according to the normal flow of the document.


    How do you add a comment in a CSS file?


    1.  // This is a comment


    2.  /* This is a comment */


    3.  <!-- This is a comment -->


    4.  # This is a comment


    Answer: 2\. /* This is a comment */


    Which property is used to create space around elements, outside of any defined
    borders?


    1.  padding


    2.  margin


    3.  border


    4.  spacing


    Answer: 2\. margin


    Explanation: The margin property in CSS is used to create space around elements,
    outside of any defined borders. It''s part of the box model, which also includes
    padding, border, and the content itself.


    What does the flex property do in a CSS Flexbox layout?


    1.  It specifies the direction of the flexible items


    2.  It controls the alignment of items on the main axis


    3.  It specifies the length of the item relative to the rest


    4.  It defines a flexible container for flexible items


    Answer: 3\. It specifies the length of the item relative to the rest


    Explanation: In a Flexbox layout, the flex property is a shorthand for the flex-grow,
    flex-shrink, and flex-basis properties. It specifies how much a flex item will
    grow relative to the rest of the flex items in the flex container.


    What is the purpose of the clear property in CSS?


    1.  To stop floating elements


    2.  To start floating elements


    3.  To clear the background


    4.  To clear margins


    Answer: 1\. To stop floating elements


    Explanation: The clear property in CSS is used to control the behavior of floating
    elements. Elements after the cleared element will not float alongside the cleared
    element.


    Which CSS property controls text wrapping?


    1.  text-wrap


    2.  text-align


    3.  word-wrap


    4.  word-break


    Answer: 3\. word-wrap


    Explanation: The word-wrap property in CSS allows long words to be broken and
    wrapped onto the next line.


    How can you make a numbered list?


    1.  list-style-type: decimal;


    2.  list-style-type: number;


    3.  list-style-type: numeric;


    4.  list-style-type: list-number;


    Answer: 1\. list-style-type: decimal;


    Explanation: To create a numbered list in CSS, you use the list-style-type property
    with the value decimal.


    Which CSS property is used to move the content away from the borders?


    1.  margin


    2.  border


    3.  padding


    4.  spacing


    Answer: 3\. padding


    Explanation: The padding property in CSS is used to create space around content,
    inside of any defined borders.


    What is the default display value for most elements?


    1.  inline


    2.  block


    3.  flex


    4.  grid


    Answer: 2\. block


    Explanation: Most HTML elements are displayed as block by default, which means
    they start on a new line and take up the full width.


    What does the :after pseudo-element do?


    1.  Inserts content before an element


    2.  Inserts content after an element


    3.  Removes content after an element


    4.  Changes content after an element


    Answer: 2\. Inserts content after an element


    Explanation: The :after pseudo-element in CSS is used to insert content after
    the content of an element.


    How do you select every <p> element whose parent is not a <div>?


    1.  p:not(div)


    2.  not(div > p)


    3.  p:not(div > p)


    4.  p:not(:parent div)


    Answer: 3\. p:not(div > p)


    Explanation: The p:not(div > p) selector is used to select every <p> element that
    is not a child of a <div> element.


    Which property changes the style of the bottom border?


    1.  border-bottom-style


    2.  border-bottom


    3.  border-style-bottom


    4.  bottom-border


    Answer: 1\. border-bottom-style


    Explanation: The border-bottom-style property is used to set the style of an element''s
    bottom border.


    What does the CSS property position: absolute; do?


    1.  Makes the element positioned relative to its normal position in the document


    2.  Removes the element from the document flow and positions it relative to its
    nearest positioned ancestor


    3.  Aligns the element in the center of the page


    4.  Makes the element invisible


    Answer: 2\. Removes the element from the document flow and positions it relative
    to its nearest positioned ancestor


    Explanation: When you set position: absolute; in CSS, the element is removed from
    the normal document flow and positioned relative to its nearest ancestor with
    a specified position (relative, absolute, or fixed).


    How do you change the color of an element on mouse hover using CSS?


    1.  :hover { color: newColor; }


    2.  :hover-color { newColor; }


    3.  hover: { color: newColor; }


    4.  hover-color: { newColor; }


    Answer: 1\. :hover { color: newColor; }'
