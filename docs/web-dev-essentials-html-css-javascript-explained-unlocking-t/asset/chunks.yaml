    2. `<i>`

    3. `<b>`

    4. `<strong>`


    **答案：1. `<em>`**


    **解释：** `<em>` 元素用于定义强调文本。


    ### 在 HTML5 中，哪个元素用于定义可以独立分发的文本？


    1. `<section>`

    2. `<article>`

    3. `<aside>`

    4. `<div>`


    **答案：2. `<article>`**


    **解释：** `<article>` 元素是独立的内容。


    ### 哪个属性用于指定输入被禁用？


    1. `readonly`

    2. `inactive`

    3. `off`

    4. `disabled`


