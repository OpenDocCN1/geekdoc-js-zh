    \ transparent) to `1` (completely opaque).\n\n# Purpose of `z-index` Property\n\
    \nFunction: Controls the stacking order of elements.\n\n```css\ndiv {\n  position:\
    \ relative;\n  z-index: 10;\n}\n```\nTip: Elements with a higher `z-index` cover\
    \ those with a lower one. It works on elements with a `position` value other than\
