    \ the value\n2. Only the type\n3. Both value and type\n4. The existence\n\nAnswer:\
    \ 3. Both value and type\n\n**Explanation**: The `===` operator, also known as\
    \ strict equality, checks the value and type of operands.\n\n### How can a for\
    \ loop be stopped in JavaScript?\n\n1. `stop();`\n2. `break;`\n3. `exit;`\n4.\
    \ `terminate;`\n\nAnswer: 2. `break;`\n\n**Explanation**: The `break` statement\
    \ is used to exit from a loop before it has looped through all.\n\n### Which of\
    \ the following is a way to define a constant in JavaScript?\n\n1. `var CONSTANT_NAME\
    \ = value;`\n2. `let CONSTANT_NAME = value;`\n3. `const CONSTANT_NAME = value;`\n\
    4. `#define CONSTANT_NAME`\n\nAnswer: 3. `const CONSTANT_NAME = value;`\n\n**Explanation**:\
    \ The `const` keyword is used to define a constant. A constant cannot be reassigned\
    \ after its declaration.\n\n### What is the output of the following code?\n\n\
    ```javascript\nlet x = 10;\nlet y = \"10\";\nconsole.log(x === y);\n```\n\n1.\
    \ true\n2. false\n3. TypeError\n4. undefined\n\nAnswer: 2. false\n\n**Explanation**:\
    \ The `===` operator checks for value and type. In this case, `x` is a number\
    \ and `y` is a string, so the comparison returns `false`.\n\n### Which method\
    \ is used to add new items to the beginning of an array?\n\n1. `push()`\n2. `pop()`\n\
    3. `unshift()`\n4. `shift()`\n\nAnswer: 3. `unshift()`\n\n**Explanation**: The\
    \ `unshift()` method is used to add one or more elements to the beginning of an\
    \ array and returns the new length of the array.\n\n### What is the purpose of\
    \ the `Array.prototype.reduce()` method in JavaScript?\n\n1. To execute a reducer\
    \ function on each element of the array, resulting in a single value.\n2. To combine\
    \ all elements of an array into a single string.\n3. To iterate over each element\
    \ of an array.\n4. To modify each element in the array and create a new array.\n\
    \nAnswer: 1. To execute a reducer function on each element of the array, resulting\
    \ in a single value.\n\n**Explanation**: `Array.prototype.reduce()` applies a\
    \ function against an accumulator and each element in the array (from left to\
    \ right) to reduce it to a single value.\n\n### Which of the following will correctly\
    \ call a function named `myFunc`?\n\n1. `call myFunction();`\n2. `myFunc();`\n\
    3. `call function myFunction();`\n4. `execute myFunction();`\n\nAnswer: 2. `myFunc();`\n\
    \n**Explanation**: In JavaScript, you call a function by writing the function's\
    \ name followed by parentheses. So, `myFunc()` is the correct syntax.\n\n### What\
    \ will the following JavaScript code output?\n\n```javascript\nlet num = \"10\"\
    ;\nconsole.log(typeof parseInt(num));\n```\n\n1. \"number\"\n2. \"string\"\n3.\
    \ \"object\"\n4. \"undefined\"\n\nAnswer: 1. \"number\"\n\n**Explanation**: `parseInt(num)`\
    \ converts the string `\"10\"` to the number `10`. The `typeof` operator then\
    \ returns `\"number\"`.\n\n### In JavaScript, how is a while loop started?\n\n\
    1. `while (condition) {...}`\n2. `while condition {...}`\n3. `while loop (condition)\
    \ {...}`\n4. `while: (condition) {...}`\n\nAnswer: 1. `while (condition) {...}`\n"
  raw: 'Explanation: In JavaScript, the == operator performs type coercion and checks
