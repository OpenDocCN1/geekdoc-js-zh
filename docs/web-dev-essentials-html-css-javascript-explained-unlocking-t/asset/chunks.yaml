    below?


    <p id="demo">This is a demonstration.</p>


    1.  document.getElement("p").innerHTML = "Hello World!";


    2.  document.getElementById("demo").innerHTML = "Hello World!";


    3.  #demo.innerHTML = "Hello World!";


    4.  document.getElementByName("p").innerHTML = "Hello World!";


    Answer: 2\. document.getElementById("demo").innerHTML = "Hello World!";


    Explanation: document.getElementById("demo") is the correct method to select the
    element, and .innerHTML is used to change its content.


    What is the correct syntax for adding comments in JavaScript?


    1.  <!-- This is a comment -->


    2.  // This is a comment


    3.  /* This is a comment */


    4.  Both B and C


    Answer: 4\. Both B and C


    Explanation: In JavaScript, // is used for single-line comments and /* */ for
    multi-line comments.


    How can a value be appended to an array in JavaScript?


    1.  arr[arr.length] = value;


    2.  arr.push(value);


    3.  arr += value;


    4.  Both A and B are correct


    Answer: 4\. Both A and B are correct


    Explanation: arr.push(value) adds a new element to the end of an array. Alternatively,
    setting arr[arr.length] = value; also appends the value to the end.


    How do you create a function in JavaScript?


    1.  function myFunction()


    2.  function:myFunction()


    3.  function = myFunction()


    4.  new Function()


    Answer: 1\. function myFunction()


    Explanation: function myFunction() is the standard syntax for declaring a function
    in JavaScript.


    What method is used to serialize an object into a JSON string in JavaScript?


    1.  JSON.stringify()


