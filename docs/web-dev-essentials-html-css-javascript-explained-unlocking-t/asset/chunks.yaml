  trans: "\n\n解释：`<article>` 是 HTML5 引入的一个新元素。它代表文档、页面、应用程序或站点中一个自包含的组合，旨在独立分发或重用。\n\
    \n### HTML5 中的 `<canvas>` 元素的作用是什么？\n\n1. 显示数据库记录\n2. 通过脚本（如 `JavaScript`）动态绘制图形\n\
    3. 为网页添加背景画布\n4. 显示 3D 对象\n\n答案：2. 通过脚本（如 `JavaScript`）动态绘制图形\n\n解释：HTML5 中的 `<canvas>`\
    \ 元素用于通过 `JavaScript` 等脚本语言动态绘制图形。它可以用于绘制图表、制作照片合成、创建动画，甚至进行实时视频处理或渲染。\n\n###\
    \ 哪一个 HTML5 元素用于指定文档或节节的页脚（footer）？\n\n1. `<bottom>` \n2. `<footer>`\n3. `<section>`\n\
    4. `<div>`\n\n答案：2. `<footer>`\n\n解释：HTML5 中的 `<footer>` 元素用于定义文档或节节的页脚。它通常包含作者信息、联系信息、版权声明和相关文档。\n\
    \n### 播放视频文件的正确 HTML5 元素是什么？\n\n1. `<media>`\n2. `<video>`\n3. `<film>`\n4. `<mp4>`\n\
    \n答案：2. `<video>`\n\n解释：HTML5 中的 `<video>` 元素用于在文档中嵌入视频内容。它可以播放各种视频文件格式。`src`、`controls`、`width`\
    \ 和 `height` 等属性经常配合 `<video>` 元素一起使用。\n\n### 下面不是 HTML5 中 `<input>` 的有效类型？\n\n\
    1. email\n2. date\n3. slider\n4. color\n\n答案：3. slider\n\n解释：在 HTML5 中，`slider`\
    \ 不是 `<input>` 的有效类型属性值。滑动器的正确类型是 `range`。\n\n### 哪一个 HTML5 元素用于绘制图形（通常通过 `JavaScript`）？\n\
    \n1. `<graphics>`\n2. `<canvas>`\n3. `<svg>`\n4. `<draw>`\n\n答案：2. `<canvas>`\n\
    \n解释：HTML5 中的 `<canvas>` 元素用于绘制图形，通常使用 `JavaScript`。它允许对 2D 形状和位图图像进行动态的、脚本化的渲染。\n\
    \n### `<script>` 标签中的 `async` 属性的作用什么？\n\n1. 它停止脚本直到页面完成解析\n2. 脚本可用时立即异步运行\n3.\
    \ 它将脚本延迟到页面解析完成后运行\n4. 它检查脚本中的语法错误\n\n答案：2. 脚本可用时立即异步运行\n\n解释：`<script>` 标签中的\
    \ `async` 属性允许脚本可用时立即异步执行，而无需等待整个页面加载。\n\n### HTML5 使用哪个元素指定导航链接？\n\n1. `<nav>`\n\
    2. `<navigation>`\n3. `<links>`\n4. `<navigate>`\n\n答案：1. `<nav>`\n\n解释：HTML5\
    \ 中的 `<nav>` 元素用于定义导航链接的节。\n\n### HTML5 中 `<aside>` 元素的作用是什么？\n\n1. 代表页面的一部分，其内容与主内容间接连接\n\
    2. 为广告创建侧边栏\n3. 标记用户可能需要的额外条目\n4. 高亮文本\n\n答案：1. 代表页面的一部分，其内容与主内容间接连接\n\n解释：HTML5\
    \ 中的 `<aside>` 元素代表页面的一个部分，该部分的内容与 `<aside>` 元素周围的内容有边缘关系。\n\n### HTML5 中的 figure\
    \ 元素代表什么？\n\n1. 计算或结果\n2. 长度单位\n3. 自包含的内容，如插图、图表、照片、代码列表等\n4. 文本中的关键人物\n\n答案：3.\
    \ 自包含的内容，如插图、图表、照片、代码列表等\n\n解释：`figure` 元素代表自包含的内容，通常在文档的主流中作为单个单元引用，例如插图、图表、照片、代码列表等。\n\
    \n### 如何在 HTML5 中为节或页面定义页头（header）？\n\n1. `<header>`\n2. `<head>`\n3. `<top>`\n\
    4. `<section>`\n\n答案：1. `<header>`\n\n解释：HTML5 中的 `<header>` 元素用于定义文档或节的页头。\n\n\
    ### HTML5 中 datalist 元素的作用是什么？\n\n1. 离线存储数据\n2. 为 `<input>` 元素提供预定义的选项列表\n3. 链接到外部源\n\
    4. 以表格格式显示列表\n\n答案：2. 为 `<input>` 元素提供预定义的选项列表\n\n解释：HTML5 中的 `datalist` 元素为 `<input>`\
    \ 元素提供一组预定义的选项，允许实现自动完成功能。\n\n### 哪一个 HTML5 元素用于播放音频？\n\n1. `<sound>`\n2. `<mp3>`\n\
    3. `<audio>`\n4. `<music>`\n\n答案：3. `<audio>`\n\n解释：HTML5 中的 `<audio>` 元素用于在文档中嵌入音频内容。它可以播放音频文件。\n\
    \n### HTML5 中 output 元素的作用是什么？\n\n1. 显示脚本的输出\n2. 将数据导出到外部文件\n3. 为输入定义节\n4. 将输出存储在数据库中\n\
    \n答案：1. 显示脚本的输出\n\n解释：`output` 元素用于计算或用户操作的结果。\n\n### 使用哪个属性指定输入字段在提交表单之前必须填写？\n\
    \n1. `required`\n2. mandatory\n3. validate\n4. essential\n\n答案：1. `required`\n\
    \n解释：`required` 属性用于指定输入字段不能为空，并且在提交表单之前必须填写。\n\n### HTML5 中 article 元素的作用是什么？\n\
    \n1. 定义注释\n2. 包含杂志或报纸文章\n3. 封装关于特定主题的文章\n4. 以上两者均为是\n\n答案：4. 以上两者均为是\n\n解释：`<article>`\
    \ 元素代表一段自包含的内容，例如报纸或杂志文章、博客文章或用户评论。\n\n### 下面哪一个不是 HTML5 中的语义元素？\n\n1. `<article>`\n\
    2. `<footer>`\n3. `<div>`\n4. `<section>`\n\n答案：3. `<div>`\n\n解释：`<div>` 是 HTML\
    \ 中的通用容器，不被视为语义元素。像 `<article>`、`<footer>` 和 `<section>` 这样的语义元素以人类和机器读取的方式清晰地描述了它们的含义。\n\
    \n### 哪一个 HTML5 元素用于标记页面中的主题分隔？\n\n1. `<break>`\n2. `<line>`\n3. `<hr>`\n4. `<divider>`\n\
    \n答案：3. `<hr>`\n\n解释：`<hr>` 元素代表段落级元素之间的主题分隔（例如故事中场景的变化，或节内的话题转换）。\n\n### 使用哪个属性配合\
    \ meta 标签来定义 HTML 文档的字符集？\n\n1. `charset`\n2. encoding\n3. setchar\n4. character\n\
    \n答案：1. `charset`\n\n解释：`<meta>` 标签中的 `charset` 属性指定 HTML 文档的字符编码。\n\n### 输入字段中的\
    \ placeholder 属性提供了什么？\n\n1. 随表单一起提交的默认值\n2. 提示用户在字段中可以输入什么\n3. 输入字段的标签\n4. 用户必须填写的强制性文本\n\
    \n答案：2. 提示用户在字段中可以输入什么\n\n解释：`placeholder` 属性提供了一个描述输入字段预期值的简短提示。\n\n### 哪一个 HTML5\
    \ 元素定义独立的、自包含的内容？\n\n1. `<section>`\n2. `<article>`\n3. `<aside>`\n4. `<header>`\n\
    \n答案：2. `<article>`\n\n解释：`<article>` 元素指定独立的、自包含的内容，这些内容可能被分发或重用。\n\n### 插入换行的正确\
    \ HTML 元素是什么？\n\n1. `<br>`\n2. `<break>`\n3. `<lb>`\n4. `<line>`\n\n答案：1. `<br>`\n\
    \n解释：`<br>` 标签在 HTML 中用于在文本插入换行。\n"
- fmt: '

    ## Which HTML5 element is used for specifying a group of introductory or navigational
    aids?


    1. `<group>`

    2. `<section>`

    3. `<header>`

    4. `<nav>`


    **Answer:** 4. `<nav>`


    **Explanation:** The `<nav>` element is used to define a set of navigation links
    in HTML5.


    ## Which attribute in the `<a>` tag specifies the URL of the page the link goes
    to?


    1. `href`

    2. `src`

    3. `link`

    4. `url`


    **Answer:** 1. `href`


    **Explanation:** The `href` attribute in the `<a>` (anchor) tag specifies the
    URL of the page the link goes to.


    ## What does the viewport meta tag do in HTML5?


    1. Adjusts the visible area of the web page

    2. Locks the orientation of the device

    3. Controls the zoom level of the page

    4. Sets the initial scale of the webpage


    **Answer:** 1. Adjusts the visible area of the web page


    **Explanation:** The `viewport` meta tag is used in HTML5 to control the layout
    on mobile browsers. By default, it adjusts the width of the page to the screen
    width of the device.


    ## Which element is used in HTML5 to represent a progress of a task?


    1. `<progress>`

    2. `<meter>`

    3. `<task>`

    4. `<loading>`


    **Answer:** 1. `<progress>`


    **Explanation:** The `<progress>` element represents the progress of a task in
    HTML5.


    ## What is the purpose of the autofocus attribute in HTML5?


    1. Automatically focus on a form element when the page loads

    2. Auto-validate form input

    3. Automatically update content

    4. Autofill form fields based on history


    **Answer:** 1. Automatically focus on a form element when the page loads


    **Explanation:** The `autofocus` attribute is a boolean attribute that lets you
    specify that a form input should automatically be focused when the page loads.


    ## Which HTML5 tag is used to specify an ordered list?


    1. `<ul>`

    2. `<ol>`

    3. `<list>`

    4. `<dl>`


    **Answer:** 2. `<ol>`


    **Explanation:** The `<ol>` tag is used to define an ordered list in HTML5.


    ## In HTML5, which element is used to define emphasized text?


    1. `<em>`

    2. `<i>`

    3. `<bold>`

    4. `<strong>`


    **Answer:** 1. `<em>`


    **Explanation:** The `<em>` tag is used to define emphasized text in HTML5, which
    typically displays as italicized text.


    ## What is the default value of the type attribute for a <button> element in HTML5?


    1. `button`

    2. `submit`

    3. `reset`

    4. `menu`


    **Answer:** 2. `submit`


    **Explanation:** The default value of the `type` attribute for a `<button>` element
    is `submit`.


    ## Which HTML5 element is best suited for marking up a time-stamp?


    1. `<datetime>`

    2. `<timestamp>`

    3. `<time>`

    4. `<date>`


    **Answer:** 3. `<time>`


    **Explanation:** The `<time>` element represents a specific period in time or
    a time-stamp in HTML5.


    ## What is the purpose of the placeholder attribute in HTML5?


    1. To provide a hint to the user about what to enter

    2. To pre-fill the field with data

    3. To mark the field as future data

    4. To display a tooltip when hovering over the field


    **Answer:** 1. To provide a hint to the user about what to enter


    **Explanation:** The `placeholder` attribute provides a hint to the user about
    what to enter in the input field.


    ## In HTML5, which element is used to group together sections?


    1. `<group>`

    2. `<section>`

    3. `block`

    4. `<div>`


    **Answer:** 2. `<section>`


    **Explanation:** The `<section>` element is used in HTML5 to group together thematic
    sections.


    ## What does the required attribute in an input field ensure?


    1. The field must be filled out before submitting the form

    2. The input is necessary for the form’s submission

    3. The field will be validated against pattern

    4. Both 1 and 2


    **Answer:** 4. Both 1 and 2


    **Explanation:** The `required` attribute specifies that an input field must be
    filled out before submitting the form and is necessary for the form''s submission.


    ## Which HTML5 element defines a caption for a figure?


    1. `<figcaption>`

    2. `<caption>`

    3. `<title>`

    4. `<headline>`


    **Answer:** 1. `<figcaption>`


    **Explanation:** The `<figcaption>` element is used to define a caption for a
    figure in HTML5.


    ## How is a new article element indicated in HTML5?


    1. `<new article>`

    2. `<article new>`

    3. `<article>`

    4. `<newarticle>`


    **Answer:** 3. `<article>`


    **Explanation:** The `<article>` element is used to indicate an article in HTML5.


    ## Which HTML5 element is used for specifying metadata about an HTML document?


    1. `<meta>`

    2. `<data>`

    3. `<info>`

    4. `<metadata>`


    **Answer:** 1. `<meta>`


    **Explanation:** The `<meta>` tag is used in HTML5 to specify metadata about an
    HTML document, such as character set, page description, author of the document,
    and viewport settings.


    ## What is the purpose of the lang attribute in an HTML5 document?


    1. Specifies the programming language of the content

    2. Defines the language used in the element

    3. Indicates the language for spell checking

    4. Determines the language for text-to-speech conversion


    **Answer:** 2. Defines the language used in the element


    **Explanation:** The `lang` attribute is used to define the language used in the
    element, which can be important for screen readers and assistive technologies.


    ## In HTML5, which element is used for displaying the result of a calculation?


    1. `<calculate>`

    2. `<result>`

    3. `<output>`

    4. `<return>`


    **Answer:** 3. `<output>`


    **Explanation:** The `<output>` element is used in HTML5 for representing the
    result of a calculation.


    ## Which HTML5 element is used to specify a header for a document or section?


    1. `<header>`

    2. `<top>`

    3. `<heading>`

    4. `<head>`


    **Answer:** 1. `<header>`


    **Explanation:** The `<header>` element is used in HTML5 to represent a container
    for introductory content or a set of navigational links.


    ## Which attribute in HTML5 specifies the character encoding for the HTML document?


    1. `charset`

    2. `encoding`

    3. `character`

    4. `setchar`


    **Answer:** 1. `charset`


    **Explanation:** The `charset` attribute in the `<meta>` tag specifies the character
    encoding for the HTML document.


    ## What does the pattern attribute in an HTML5 input field do?


    1. Specifies a regular expression the input field''s value is checked against

    2. Determines the pattern in which data is entered

    3. Creates a visual pattern in the background of the field

    4. Sets the input format for date and time fields


    **Answer:** 1. Specifies a regular expression the input field''s value is checked
    against


    **Explanation:** The `pattern` attribute specifies a regular expression that the
    `<input>` element''s value is checked against.


    ## Which HTML5 element is used to define the navigation links?


    1. `<navigate>`

    2. `<nav>`

    3. `<links>`

    4. `<navigation>`


    **Answer:** 2. `<nav>`


    **Explanation:** The `<nav>` element is used in HTML5 to define a set of navigation
    links.


    ## Which HTML5 element is used to specify a group of introductory or navigational
    aids for a page?


    1. `<group>`

    2. `<header>`

    3. `<section>`

    4. `<intro>`


    **Answer:** 2. `<header>`


    **Explanation:** The `<header>` element is used in HTML5 to specify a group of
    introductory or navigational aids for a page.


    ## In HTML5, what is the purpose of the data-* attribute?


    1. To store custom data private to the page or application

    2. To embed data that needs to be sent to the server

    3. To hold data about the user''s browser

    4. To store configuration settings for JavaScript libraries


    **Answer:** 1. To store custom data private to the page or application


    **Explanation:** The `data-*` attribute is used to store custom data for the page
    or application.


    ## Which HTML5 element is specifically used for marking up a block of code?


    1. `<code>`

    2. `<script>`

    3. `<block>`

    4. `<pre>`


    **Answer:** 1. `<code>`


    **Explanation:** The `<code>` element is used in HTML5 to define a piece of computer
    code.


    ## Which element in HTML5 is best used for marking up a scalar measurement within
    a known range, like a disk usage?


    1. `<gauge>`

    2. `<measure>`

    3. `<meter>`

    4. `<range>`


    **Answer:** 3. `<meter>`


    **Explanation:** The `<meter>` element is used for marking up a scalar measurement
    within a known range.

