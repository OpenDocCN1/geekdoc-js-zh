  trans: "\n\n# 使用 <embed> 和 <object> 嵌入外部媒体\n\n`<embed>` 和 <object>` 元素用于嵌入外部应用程序和交互内容，如\
    \ Flash 动画或 PDF 阅读器。\n\n### <embed> 示例\n\n```html\n<embed src=\"file.swf\" width=\"\
    400\" height=\"50\">\n```\n\n### <object> 示例\n\n```html\n<object data=\"file.swf\"\
    \ width=\"400\" height=\"50\">\n  <embed src=\"file.swf\" width=\"400\" height=\"\
    50\">\n</object>\n```\n\n### 提示：\n- 使用 `<embed>` 处理视频、图像或音频等外部多媒体。\n- `<object>`\
    \ 标签也可用于嵌入多媒体，而且更加通用。\n\n## 高级 HTML5 特性\n\n### <script> 标签中的 async 属性\n\n`async`\
    \ 属性用于 `<script>` 标签，以与页面的其他部分异步加载脚本。这意味着脚本下载完成后立即执行，而不会阻塞 HTML 的解析。\n\n### 示例：\n\
    \n```html\n<script async src=\"script.js\"></script>\n```\n\n### 提示：\n- 对于不依赖其他脚本的脚本，使用\
    \ `async`。\n- 它有助于提高网页的加载性能。\n\n### <output> 元素的目的\n\n`<output>` 元素用于表示计算结果或用户操作的结果。\n\
    \n### 示例：\n\n```html\n<form oninput=\"are1.value=parseInt(length.value)*parseInt(width.value)\"\
    >\n  <label for=\"length\">长度： </label>\n  <input type=\"number\" id=\"length\"\
    \ name=\"length\" value=\"0\"> 单位<br>\n  <label for=\"width\">宽度： </label>\n \
    \ <input type=\"number\" id=\"width\" name=\"width\" value=\"0\"> 单位<br>\n  <label\
    \ for=\"area\">面积： </label>\n  <output name=\"area\" for=\"length width\">0</output>\
    \ 平方单位\n</form>\n```\n\n### <article> 元素的目的\n\n`<article>` 元素代表文档、页面或网站中的自包含内容组合，旨在用于独立分发或重用。\n\
    \n### 示例：\n\n```html\n<article>\n  <h2>文章标题</h2>\n  <p>文章内容...</p>\n</article>\n\
    ```\n\n### 提示：\n- 将其用于博客文章、新闻文章、用户评论或其他独立内容项。\n\n### 输入字段的 required 属性\n\n`required`\
    \ 属性用于指定在提交表单之前必须填写输入字段。\n\n### 示例：\n\n```html\n<input type=\"text\" name=\"name\"\
    \ required>\n```\n\n### contentEditable 属性\n\n`contenteditable` 属性指定元素的内容是否可编辑。\n\
    \n### 示例：\n\n```html\n<div contenteditable=\"true\">你可以编辑这段文字。</div>\n```\n\n\
    ### <figure> 元素的目的\n\n`<figure>` 元素代表自包含的内容，通常带有一个可选的说明，使用 `<figcaption>` 指定。\n\
    \n### 示例：\n\n```html\n<figure>\n  <img src=\"image.jpg\" alt=\"图像描述\">\n  <figcaption>图片的说明。</figcaption>\n\
    </figure>\n```\n\n### <script> 标签中的 defer 属性\n\n`defer` 属性推迟脚本的执行，直到文档解析完成后执行。\n\
    \n### 示例：\n\n```html\n<script defer src=\"script.js\"></script>\n```\n\n### 提示：\n\
    - 对于需要 DOM 完全解析的脚本，使用 `defer`。\n\n### <track> 元素的 kind 属性\n\n`<track>` 元素中的 `kind`\
    \ 属性指定文本轨道的类型（字幕、说明、描述、章节或元数据）。\n\n### 示例：\n\n```html\n<video controls>\n  <source\
    \ src=\"movie.mp4\" type=\"video/mp4\">\n  <track src=\"subtitles_en.vtt\" kind=\"\
    subtitles\" srclang=\"en\" label=\"English\">\n</video>\n```\n\n### <textarea>\
    \ 元素的 cols 属性\n\n`cols` 属性指定文本控件的可见宽度（以平均字符宽度计算）。\n\n### 示例：\n\n```html\n<textarea\
    \ name=\"message\" rows=\"10\" cols=\"30\"></textarea>\n```\n\n### 图片 alt 属性的作用\n\
    \n`alt` 属性在图像无法显示时提供替代文本。\n\n### 示例：\n\n```html\n<img src=\"image.jpg\" alt=\"\
    关于图片的描述性文字\">\n```\n\n### 提示：\n- 始终使用 `alt` 属性来提高可访问性。\n\n### <a> 标签中的 download\
    \ 属性\n\n`<a>` 标签中的 `download` 属性建议下载链接而不是进行跳转。\n\n### 示例：\n\n```html\n<a href=\"\
    path/to/file\" download>下载文件</a>\n```\n\n### <figcaption> 元素的目的\n\n`<figcaption>`\
    \ 元素代表其父元素 `<figure>` 中其余部分内容的说明或图例。\n\n### 示例：\n\n```html\n<figure>\n  <img src=\"\
    image.jpg\" alt=\"...\">\n  <figcaption>说明放在这里。</figcaption>\n</figure>\n```\n\
    \n### <button> 元素的 type 属性的默认值\n\n`<button>` 元素 `type` 属性的默认值为 `submit`。\n\n###\
    \ 示例：\n\n```html\n<button type=\"button\">点击我！</button> <!-- 不是提交按钮 -->\n```\n\
    \n### 使用 charset 属性指定字符编码\n\n`charset` 属性用于指定字符编码。\n\n### 示例：\n\n```html\n<meta\
    \ charset=\"UTF-8\">\n```\n\n### Element 的说明\n\n`<figcaption>` 元素用于为 `<figure>`\
    \ 元素定义说明。\n\n### 示例：\n\n```html\n<figure>\n  <img src=\"image.jpg\" alt=\"...\"\
    >\n  <figcaption>这是说明。</figcaption>\n</figure>\n```\n\n### 指示新文章\n\n`<article>`\
    \ 元素用于指示新文章。\n\n### 示例：\n\n```html\n<article>\n  <h2>文章标题</h2>\n  <p>文章内容...</p>\n\
    </article>\n```\n\n### 使用 meta 元素指定元数据\n\n`<meta>` 元素用于指定元数据。\n\n### 示例：\n\n```html\n\
    <meta name=\"description\" content=\"页面描述\">\n```\n\n### <a> 标签中的 href 属性\n\n\
    `<a>` 标签中的 `href` 属性指定链接指向的 URL。\n\n### 示例：\n\n```html\n<a href=\"https://example.com\"\
    >访问示例</a>\n```\n\n### 标记时间戳\n\n`<time>` 元素适用于标记时间戳。\n\n### 示例：\n\n```html\n<time\
    \ datetime=\"2025-01-01\">2025 年 1 月 1 日</time>\n```\n\n### autofocus 属性\n\n`autofocus`\
    \ 属性用于 HTML5，指定一个元素在页面加载时获取焦点。\n\n### 示例：\n\n```html\n<input type=\"text\" autofocus>\n\
    ```\n\n### 指定有序列表\n\n`<ol>` 标签用于在 HTML5 中指定有序列表。\n\n### 示例：\n\n```html\n<ol>\n\
    \  <li>第一项</li>\n  <li>第二项</li>\n</ol>\n```\n\n### 定义强调文本\n\n`<em>` 元素用于 HTML5\
    \ 用于定义强调文本。\n\n### 示例：\n\n```html\n<p>这是<em>强调</em>的文本。</p>\n```\n\n### HTML5\
    \ 中的 disabled 属性\n\n`disabled` 属性用于指定输入元素应被禁用。\n\n### 示例：\n\n```html\n<input type=\"\
    text\" disabled>\n```\n\n### 在范围内表示标量值\n\n`<input type=\"range\">` 元素用于表示在已知范围内的标量值，例如音量控制。\n\
    \n### 示例：\n\n```html\n<input type=\"range\" min=\"1\" max=\"10\">\n```\n\n###\
    \ <input> 元素中的 multiple 属性\n\n`<input>` 元素中的 `multiple` 属性允许用户选择或输入多个值。\n\n###\
    \ 示例：\n\n```html\n<input type=\"file\" multiple>\n```\n\n# HTML 题\n\n## HTML 问题介绍\n\
    \n深入 Web 开发的世界始于任何网站的基础——HTML（超文本标记语言）。在我们接触 HTML 问题时，我们正在开启一段探索构建网站结构和内容的程。这些问题旨在揭示\
    \ HTML 的复杂性，从文档的基本结构到 HTML5 的高级特性。无论你对不同标签的作用、属性的重要性还是表单元素的实现感兴趣，此部分都提供了掌握 HTML\
    \ 的全面指南。\n\n## HTML 问题及解释\n\nHTML 代表什么？\n\n1. HyperText Markup Language\n2. HyperTech\
    \ More Language\n3. HighText Machine Language\n4. 以上都不是\n\n答案：1\\. HyperText Markup\
    \ Language\n\n解释：HTML 代表超文本标记语言。它是创建网页和 Web 应用程序的标准标记语言。它构建了网页的内容。\n\n以下哪项是 HTML5\
    \ 中的新元素？\n\n1. <div>\n2. <table>\n3. <article>\n4. <font>\n\n答案：3\\. <article>\n\
    \n"
