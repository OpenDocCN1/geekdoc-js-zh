    \ 属性为用户提供关于输入字段中期望类型信息的类型提示，通常显示到用户开始在字段中输入为止。\n\n## 哪个 HTML5 元素定义了一个媒体内容组，并通常与\
    \ `<audio>` 或 `<video>`元素配合使用？\n\n1. `<media>`\n2. `<group>`\n3. `<source>`\n\
    4. `<track>`\n\n**答案：** 3. `<source>`\n\n**解释：** `<source>` 元素用于 `<audio>` 或 `<video>`\
    \ 等媒体元素内部，为不同的设备或浏览器指定多个媒体源。\n\n## 在 HTML5 中，哪个元素用于定义矢量图形容器？\n\n1. `<svg>`\n2.\
    \ `<vector>`\n3. `<graphics>`\n4. `<draw>`\n\n**答案：** 1. `<svg>`\n\n**解释：** `<svg>`（可缩矢量图形）元素用于在\
    \ HTML5 中定义矢量图形的容器。\n\n## HTML5 中，`<input type=\"submit\">` 元素中 `formaction` 属性的目的是什么？\n\
    \n1. 指定输入元素所在表单的动作（action）\n2. 为该特定的提交按钮覆盖表单的 action 属性\n3. 为表单提交一组动作\n4. 指定表单提交的方法\n\
    \n**答案：** 2. 为该特定的提交按钮覆盖表单的 action 属性\n\n**解释：** `<input type=\"submit\">` 元素中的\
    \ `formaction` 属性允许你为特定的提交按钮覆盖表单的 `action` 属性。\n\n## 哪个 HTML5 元素用于定义引用自其他源的文本块？\n\
    \n1. `<blockquote>`\n2. `<quote>`\n3. `<citation>`\n4. `<source>`\n\n**答案：** 1.\
    \ `<blockquote>`\n\n**解释：** `<blockquote>` 元素用于定义引用自其他源的文本块。\n\n## 在 HTML5 中，`<td>`\
    \ 元素中的 `nowrap` 属性的作用是什么\n\n1. 防止表格单元格中的文本换行\n2. 自动调整单元格宽度以适应内容\n3. 将文本对齐到单元格顶部\n\
    4. 伸展单元格以适应最大的项目\n\n**答案：** 1. 防止表格单元格中的文本换行\n\n**解释：** `<td>`（表格单元格）元素中的 `nowrap`\
    \ 属性防止单元格内的文本换行。\n\n## 哪个 HTML5 元素用于定义文档或章节的头部？\n\n1. `<head>`\n2. `<header>`\n\
    3. `<top>`\n4. `<sectionhead>`\n\n**答案：** 2. `<header>`\n\n**解释：** `<header>`\
    \ 元素在 HTML5 中用于定义文档或章节的头部。\n\n## HTML 中使用语义化元素（例如 `<article>`, `<section>`, `<nav>`,\
    \ `<aside>`）的目的是什么，它们如何有利于网络可访问性（accessibility）？\n\n1. 让 HTML 代码看起来更整洁\n2. 增强网站的\
    \ SEO\n3. 为开发者和浏览器更清晰地定义网页的结构\n4. 以上所有\n\n**答案：** 4. 以上所有\n\n**解释：** 语义化 HTML\
    \ 元素以人类可读和机器可读的方式清晰描述它们的含义。它们通过提供有关内容的更多上下文，帮助网页更具可访问性，特别是对于屏幕阅读器和搜索引擎。它们通过清晰地勾勒网页结构，也有助于更整的代码和更好的\
    \ SEO。\n\n## 哪个 HTML5 属性防止表单在用户填写输入字段之前提交？\n\n1. `placeholder`\n2. `required`\n\
    3. `validate`\n4. `pattern`\n\n**答案：** 2. `required`\n\n**解释：** `required` 属性是一个布尔属性，存在时，指定在提交表单之前必须填写输入字段。它用于客户端验证，以确保字段不会留空。\n\
    \n## HTML5 中 `<canvas>` 元素的主要用途是什么？\n\n1. 显示数据库记录\n2. 通过脚本在网页上绘制图形\n3. 创建可拖拽元素\n\
    4. 嵌入视频文件\n\n**答案：** 2. 通过脚本在网页上绘制图形\n\n**解释：** `<canvas>` 元素用于通过 `JavaScript`\
    \ 帮助在网页上绘制图形。它为 2D 形状和图像提供了绘制表面，但也可以用于游戏或图表绘制等视觉输出。\n\n## HTML 中哪个全局属性用于为元素指定唯一标识符？\n\
    \n1. `class`\n2. `id`\n3. `style`\n4. `title`\n\n**答案：** 2. `id`\n\n**解释：** `id`\
    \ 属性用于为 HTML 元素分配唯一标识符。它是全局的，因为它可以应用于任何元素，而不仅仅是特定类型。`id` 属性的值在 HTML 文档中必须是唯一的，以便出于样式设置、脚本或链接目的正确识别元素。\n\
    \n## 将声学文件嵌入网页的正确 HTML 元素是什么？\n\n1. `<sound>`\n2. `<audio>`\n3. `<source>`\n4.\
    \ `<music>`\n\n**答案：** 2. `<audio>`\n\n**解释：** `<audio>` 元素用于在 HTML 文档中嵌入音频内容。它允许不需要外部插件的情况下播放音频文件。\n\
    \n# CSS 简介：技巧与基础\n\n## CSS 简介\n级联样式表（CSS）与 HTML 和 JavaScript 一样，是万维网的基石技术。\n\n\
    ## CSS 简介\nCSS 与 HTML 和 JavaScript 一样，是万维网的基石技术。旨在实现呈现与内容的分离。\n\n## CSS 语法\nCSS\
    \ 由规则集组成。\n\n## HTML 标签定义内部样式表\n在`<head>` 部分使用 `<style>` 标签。```html\n<head>\n\
    \  <style>\n    body {\n      background-color: lightblue;\n    }\n  </style>\n\
    </head>\n```\n提示：内部样式表适用于单页样式。对于较大的项目，建议使用外部 CSS 文件。\n\n## CSS 中选择 ID 为 \"demo\"\
    \ 的元素\n使用 `#` 后接 ID。```css\n#demo {\n  color: blue;\n}\n```\n提示：ID 是元素唯一的，`id=\"\
    demo\"` 选择特定的元素。\n\n## 选择类名为 \"example\" 的元素\n使用 `.` 后接类名。```css\n.example {\n\
    \  font-size: 20px;\n}\n```\n提示：类选择器用于选择并设置具有该类属性的元素。\n\n## 文本中的每个单词大写\n使用 `text-transform:\
    \ capitalize`。```css\np {\n  text-transform: capitalize;\n}\n```\n提示：该属性会将所选元素中每个单词的首字母大写。\n\
    \n## 更改背景颜色\n使用 `background-color` 属性。```css\nbody {\n  background-color: lightgray;\n\
    }\n```\n提示：你可以使用颜色名称、RGB、RGBA、HEX 等作为此属性的值。\n\n## 更改元素的字体\n使用 `font-family` 属性。```css\n\
    p {\n  font-family: Arial, sans-serif;\n}\n```\n提示：始终提供一个备用字体（如 `sans-serif` 或\
    \ `serif`），以防首选字体可用。\n\n## 带有方形项目的列表\n在 `ul` 或 `li` 元素上使用 `list-style-type` 属性。```css\n\
    ul {\n  list-style-type: square;\n}\n```\n提示：这用于列表符号。其他值包括 `circle`、`disc`、`none`\
    \ 等。\n\n## 选择 <div> 内的所有 <p> 元素\n使用后代选择器（空格）选择嵌套元素。```css\ndiv p {\n  color: red;\n\
    }\n```\n提示：这选择任何 `<div>` 元素内部的所有 `<p>` 元素。\n\n## 大小的 CSS 属性\n属性：`font-size`\n\
    ```css\np {\n  font-size: 16px;\n}\n```\n提示：你可以使用不同的单位如 `px`、`em`、`rem` 或 `%`\
    \ 来设置大小。\n\n"
