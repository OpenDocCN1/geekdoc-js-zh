  trans: "\n\n### 1. `JSON.stringify()`\n2. `JSON.parse()`\n3. `Object.toString()`\n\
    4. `Object.toJSON()`\n\n答案: 1\\. `JSON.stringify()`\n\n解释: `JSON.stringify()`\
    \ 方法用于将 JavaScript 对象转换为 JSON 字符串。\n\n### 如何在 JavaScript 中定义常量？\n1. `var CONSTANT_NAME\
    \ = value;`\n2. `constant CONSTANT_NAME = value;`\n3. `let CONSTANT_NAME = value;`\n\
    4. `const CONSTANT_NAME = value;`\n\n答案: 4\\. `const CONSTANT_NAME = value;`\n\
    \n解释: `const` 关键字用于在 JavaScript 中定义常量。常量是一个一旦定义就无法更改的值。\n\n### 下面代码返回什么？\n`isNaN('Hello');`\
    \ \n1. `true`\n2. `false`\n3. `null`\n4. `undefined`\n\n答案: 1\\. `true`\n\n解释:\
    \ `isNaN('Hello')` 返回 `true`，因为 `'Hello'` 不是一个数字。\n\n### 关于 JavaScript 闭包的陈述中，哪是正确的？\n\
    1. 闭包是保留了数据的函数。\n2. 闭包与全局变量相同。\n3. 闭包仅在循环内部创建。\n4. 闭包无法访问作用域外的变量。\n\n答案: 1\\.\
    \ 闭包是保留了数据的函数。\n\n解释: JavaScript 中的闭包是一个记住其外部变量并可以访问它们的函数。\n\n### 下面 JavaScript\
    \ 代码将输出什么？\n```javascript\nlet x = \"5\";\nx = x + 1;\nconsole.log(x);\n```\n\
    1. `6`\n2. `\"6\"`\n3. `\"51\"`\n4. `NaN`\n\n答案: 3\\. `\"51\"`\n\n解释: 在 JavaScript\
    \ 中，当你对字符串和数字使用 `+` 运算符时，数字会被转换为字符串，两个字符串会被拼接。因此，`\"5\" + 1` 的结果是 `\"51\"`。\n\n\
    ### 在 JavaScript 中创建数组的正确语法是什么？\n1. `let arr = new Array(1, 2, 3);`\n2. `let arr\
    \ = array(1, 2, 3);`\n3. `let arr = {1, 2, 3};`\n4. `let arr = [1, 2, 3];`\n\n\
    答案: 4\\. `let arr = [1, 2, 3];`\n\n解释: 在 JavaScript 中，数组使用方括号 `[]` 定义，元素之间用逗号分隔。\n\
    \n### 下面 JavaScript 代码将输出什么？\n```javascript\nlet a = true;\nlet b = false;\nconsole.log(a\
    \ && b);\n```\n1. `true`\n2. `false`\n3. `null`\n4. `undefined`\n\n答案: 2\\. `false`\n\
    \n解释: 逻辑与 `&&` 运算符在两个操作数都为真时返回 `true`。由于 `b` 是 `false`，`a && b` 的求值为 `false`。\n\
    \n### 如何在 JavaScript 中编写条件语句来检查变量 `a` 是否等于 10？\n1. `if a = 10 {...}`\n2. `if (a\
    \ == 10) {...}`\n3. `if a == 10 {...}`\n4. `if (a = 10) {...}`\n\n答案: 2\\. `if\
    \ (a == 10) {...}`\n\n解释: JavaScript 中 `if` 语句的正确语法在条件周围包含括号，并使用 `==` 或 `===`\
    \ 来检查相等性。\n\n### JavaScript 中 `Array.prototype.every()` 方法的作用是什么？\n1. 检查数组中的每个元素是否通过由提供的函数实现的测试。\n\
    2. 为每个数组元素执行一次提供的函数。\n3. 创建新数组，其结果为对调用数组中的每个元素调用提供的函数产生的结果。\n4. 返回数组中第一个满足提供的测试函数的元素。\n\
    \n答案: 1\\. 检查数组中的每个元素是否通过由提供的函数实现的测试。\n\n解释: `Array.prototype.every()` 测试数组中的所有元素是否通过由提供的函数实现的测试。它返回一个\
    \ `Boolean` 值。\n\n### 下面 JavaScript 代码将输出什么？\n```javascript\nconsole.log(typeof\
    \ []);\n```\n1. `\"array\"`\n2. `\"object\"`\n3. `\"undefined\"`\n4. `\"null\"\
    `\n\n答案: 2\\. `\"object\"`\n\n解释: 在 JavaScript 中，数组技术上是一种对象类型。因此，`typeof []` 返回\
    \ `\"object\"`。\n\n### 哪个语句用于处理 JavaScript 中的异常？\n1. `try...catch`\n2. `try...except`\n\
    3. `try...finally`\n4. `try...error`\n\n答案: 1\\. `try...catch`\n\n解释: `try...catch`\
    \ 语句用于捕获 JavaScript 中的异常。可选地可以在 `catch` 块之后使用 `finally` 块。\n\n### 在 JavaScript\
    \ 中定义异步函数的正确方法是什么？\n1. `async function myFunc() {...}`\n2. `function async myFunc()\
    \ {...}`\n3. `function myFunc() async {...}`\n4. `async: function myFunc() {...}`\n\
    \n答案: 1\\. `async function myFunc() {...}`\n\n解释: JavaScript 中的异步函数是在函数关键字之前使用\
    \ `async` 关键字定义的，如下：`async function myFunc() {...}`。\n\n### 下面 JavaScript 代码将输出什么？\n\
    ```javascript\nlet x = \"100\";\nlet y = \"10\";\nconsole.log(x / y);\n```\n1.\
    \ `\"10\"`\n2. `10`\n3. `NaN`\n4. `TypeError`\n\n答案: 2\\. `10`\n\n解释: JavaScript\
    \ 在所有数值运算中都会字符串操作数转换为数字。因此，`\"100\" / \"10\"` 的结果是 `10`。\n\n### 在 JavaScript 中定义异步函数的正确方法是什么？\n\
    （重复检查）\n\n### 下面 JavaScript 代码将输出什么？\n（重复检查）\n\n### 在 JavaScript 中定义异步函数的正确方法是什么？\n\
    （重复检查）\n\n"
