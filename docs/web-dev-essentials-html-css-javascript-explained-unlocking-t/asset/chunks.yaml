    ## Questions about JavaScript and Explanations


    What does let keyword in JavaScript signify?


    1.  A constant variable


    2.  A block-scoped variable


    3.  A global variable


    4.  A function-scoped variable


    Answer: 2\. A block-scoped variable


    Explanation: The let keyword allows you to declare variables that are limited
    in scope to the block, statement, or expression in which they are used. Unlike
    var, which declares a function-scoped or globally-scoped variable, let ensures
    that the variable is only accessible within its declared context.


    if (true) {


    let a = 40;


    console.log(a); // outputs 40


    }


    console.log(a); // Uncaught ReferenceError: a is not defined


    Which method converts a JSON string into a JavaScript object?


    1.  JSON.parse()


    2.  JSON.stringify()


    3.  Object.toJSON()


    4.  String.parseJSON()


    Answer: 1\. JSON.parse()


    Explanation: JSON.parse() is used to parse a JSON string and construct the JavaScript
    value or object described by the string.


    const jsonString = ''{"name": "John", "age": 30}'';


    const obj = JSON.parse(jsonString);


    console.log(obj.name); // John


    Which operator is used to check both the value and the type?


    1.  ==


    2.  ===


    3.  =


    4.  !=


    Answer: 2\. ===


    Explanation: The === operator is known as the strict equality operator and it
    compares both the value and the type of two operands. In contrast, the == operator
    only compares the values, performing type coercion if necessary.


    console.log(1 === ''1''); // false


    console.log(1 == ''1''); // true


    What will be the output of the following code?


    console.log(typeof null);


    1.  "null"


    2.  "undefined"


    3.  "object"


    4.  "number"


    Answer: 3\. "object"


    Explanation: In JavaScript, typeof null returns "object". This is actually a bug
    in the language and one of its peculiarities, as null is not really an object.


    What is a closure in JavaScript?


    1.  A function along with its lexical environment.


    2.  An inner function that has access to the outer function''s variables.


    3.  Both 1 and 2.


    4.  A syntax error.


    Answer: 3\. Both 1 and 2.


    Explanation: A closure is a function combined with its lexical environment (the
    environment in which it was declared). This means it has access to outer function’s
    variables even after the outer function has returned.


    function outerFunction() {


    let outerVariable = 100;


    function innerFunction() {


    console.log(outerVariable);


    }


    return innerFunction;


    }


    const inner = outerFunction();


    inner(); // Outputs: 100


    Which of the following is not a reserved word in JavaScript?


    1.  interface


    2.  throws


    3.  program


    4.  short


    Answer: 3\. program


    Explanation: In JavaScript, interface, throws, and short are reserved words, but
    program is not. Reserved words have a specific meaning to the language or are
    reserved for future use.


    What is the purpose of the Array.prototype.map() method?


    1.  To execute a function on each element in the array.


    2.  To modify each element in the array and create a new array.


    3.  To combine all elements of an array into a single value.


    4.  To check if at least one element in the array passes a test.


    Answer: 2\. To modify each element in the array and create a new array.


    Explanation: Array.prototype.map() creates a new array populated with the results
    of calling a provided function on every element in the calling array.


    const numbers = [1, 2, 3];


    const doubled = numbers.map(number => number * 2);


    console.log(doubled); // [2, 4, 6]


    What is the use of the bind method in JavaScript?


    1.  To bind the value of this in a method to an object.


    2.  To combine two strings.


    3.  To link a JavaScript file to an HTML document.


    4.  To repeat a string multiple times.


    Answer: 1\. To bind the value of this in a method to an object.


    Explanation: The bind method creates a new function that, when called, has its
    this keyword set to the provided value.


    const person = {


    name: ''John'',


    greet: function() { console.log(`Hello, ${this.name}`); }


    };


    const greet = person.greet.bind({name: ''Jane''});


    greet(); // Hello, Jane


    Which statement is true about JavaScript''s arrow functions?


    1.  They have their own this context.


    2.  They cannot return values.


    3.  They are shorter syntax for writing function expressions.


    4.  They can be used as constructors.


    Answer: 3\. They are shorter syntax for writing function expressions.


    Explanation: Arrow functions provide a concise syntax for writing function expressions.
    They don''t have their own bindings to this, arguments, super, or new.target,
    and are not suitable for use as constructors.


    const add = (a, b) => a + b;


    console.log(add(2, 3)); // 5


    What does the unshift method do in an array?


    1.  Adds new elements to the end of an array.


    2.  Removes the first element from an array.


    3.  Adds new elements to the beginning of an array.


    4.  Removes the last element from an array.


    Answer: 3\. Adds new elements to the beginning of an array.


    Explanation: The unshift method adds one or more elements to the beginning of
    an array and returns the new length of the array.


    const array = [1, 2, 3];


    array.unshift(0);


    console.log(array); // [0, 1, 2, 3]


    What will the following code output?


    console.log(0.1 + 0.2 === 0.3);


    1.  true


    2.  false


    3.  TypeError


    4.  undefined


    Answer: 2\. false


    Explanation: This is a classic floating point math problem in many programming
    languages. The result of 0.1 + 0.2 is not exactly 0.3 due to the way numbers are
    represented in JavaScript (IEEE 754 standard for floating-point arithmetic).


    What is event delegation in JavaScript?


    1.  A way to handle events on parent elements rather than individual child elements.


    2.  A method to delegate event handling to a different element than the one that
    received the event.


    3.  A technique to speed up event handling.


    4.  A process to bind multiple events to a single event listener.


    Answer: 1\. A way to handle events on parent elements rather than individual child
    elements.


    Explanation: Event delegation is a technique where you use a single event listener
    on a parent element to manage all of its child events, taking advantage of event
    bubbling.


    Which method is used to remove the last element from an array and returns that
    element?


    1.  pop()


    2.  push()


    3.  shift()


    4.  unshift()


    Answer: 1\. pop()


    Explanation: pop() is used to remove the last element from an array and returns
    that element. This method changes the length of the array.


    How can you get the total number of arguments passed to a function?


    1.  Using arguments.length


    2.  Using arguments.size()


    3.  Using this.length


    4.  Using function.length


    Answer: 1\. Using arguments.length


    Explanation: The arguments object is an array-like object accessible inside functions
    that contains the values of the arguments passed to that function. arguments.length
    provides the number of arguments actually passed to the function.


    Which statement about asynchronous requests in JavaScript is true?


    1.  They pause the execution of the script until the request is completed.


    2.  They allow the script to continue running while the request is being processed.


    3.  They are only possible using the XMLHttpRequest object.


    4.  They cannot handle HTTP GET requests.'
