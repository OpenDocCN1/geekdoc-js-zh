    console.log(a === b);


    1.  true, true


    2.  false, false


    3.  true, false


    4.  false, true


    Answer: 3\. true, false


    Explanation: a == b is true because == does type coercion and both a and b represent
    the same value. a === b is false because === also checks the type, and a is a
    number while b is an object.


    Which one of these is a way to define a variable in JavaScript that restricts
    its scope to the block in which it is defined?


    1.  var


    2.  let


    3.  const


    4.  Both 2 and 3


    Answer: 4\. Both 2 and 3


    Explanation: Both let and const are used to declare variables in JavaScript with
    block scope. The var keyword defines a variable globally or locally to an entire
    function regardless of block scope.


    What is the purpose of the map() method in JavaScript?


