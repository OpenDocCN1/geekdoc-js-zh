    \ of inline elements.\n\n**Code Sample:**\n```\nspan {\n  vertical-align: middle;\n\
    }\n```\n\n## 13. How do you select the last-child of a specific element type within\
    \ its parent?\n1. `type:last-child`\n2. `:last-child-type`\n3. `type:last-of-type`\n\
    4. `[attribute=specific]`\n\n**Answer:** 3. `type:last-of-type`\n\n**Explanation:**\
    \ To select the last child of a specific element type within its parent, you can\
    \ use the `type:last-of-type` selector.\n\n**Code Sample:**\n```\np:last-of-type\
    \ {\n  font-weight: bold;\n}\n```\n\n## 14. What does the CSS property cursor:\
    \ pointer; do?\n1. It changes the font style of text\n2. It specifies the pointer\
    \ style when hovering over an element\n3. It adds a shadow effect to text\n4.\
    \ It sets the text color to pointer\n\n**Answer:** 2. It specifies the pointer\
    \ style when hovering over an element\n\n**Explanation:** The `cursor: pointer;`\
    \ property in CSS specifies the cursor to be displayed when hovering over an element,\
    \ typically indicating a clickable or interactive element.\n\n**Code Sample:**\n\
    ```\nbutton {\n  cursor: pointer;\n}\n```\n\n## 15. What is the purpose of the\
    \ CSS property text-overflow: ellipsis;?\n1. It controls the text color\n2. It\
    \ adds a shadow effect to text\n3. It displays an ellipsis (...) when text overflows\
    \ its container\n4. It changes the font style of text\n\n**Answer:** 3. It displays\
    \ an ellipsis (...) when text overflows its container\n\n**Explanation:** The\
    \ `text-overflow: ellipsis;` property in CSS displays an ellipsis (...) when text\
    \ overflows its container, indicating there is more text than currently visible.\n\
    \n**Code Sample:**\n```\ndiv {\n  white-space: nowrap;\n  overflow: hidden;\n\
    \  text-overflow: ellipsis;\n}\n```\n\n## 16. Which CSS property is used to specify\
    \ the style of an element's border?\n1. `border-width`\n2. `border-color`\n3.\
    \ `border-style`\n4. `border-decoration`\n\n**Answer:** 3. `border-style`\n\n\
    **Explanation:** The `border-style` property in CSS is used to specify the style\
    \ of an element's border, such as solid, dashed, or dotted.\n\n**Code Sample:**\n\
    ```\ndiv {\n  border-style: dashed;\n}\n```\n\n## 17. What does the CSS property\
