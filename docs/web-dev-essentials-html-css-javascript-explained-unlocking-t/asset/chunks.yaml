    `typeof NaN`


    The `typeof NaN` returns `"number"`, as `NaN` (Not-a-Number) is a special numeric
    value.


    Example:


    ```javascript

    console.log(typeof NaN); // "number"

    ```


    What `console.log(typeof null)` outputs


    It outputs `"object"`. This is a well-known quirk in JavaScript, as `null` is
    not actually an object but a primitive value.


    ### Write an if statement


    The `if` statement is used to execute a block of code conditionally.


    Example:


    ```javascript

    let x = 10;


    if (x > 5) {


    console.log(''x is greater than 5'');


    }

    ```


    The correct syntax for referring to an external script called `script.js`


    You can reference an external JavaScript file using the `<script>` tag with the
    `src` attribute in HTML.


    Example:


    ```html

    <script src="script.js"></script>

    ```


    What the `===` operator checks


    The `===` operator is a strict equality comparison operator that checks both the
    value and the type of two operands.


    Example:


    ```javascript

    console.log(1 === ''1''); // false, because the type is different

    ```


    ### How a for loop can be stopped


    A `for` loop can be stopped using the `break` statement.


    Example:


    ```javascript

    for (let i = 0; i < 10; i++) {


    if (i === 5) {


    break; // Stops the loop


    }


    console.log(i);


    }

    ```


    ### Operator that is used to test if a specific property exists in an object


    The `in` operator checks if a property exists within an object.


    Example:


    ```javascript

    let obj = { key: ''value'' };


    console.log(''key'' in obj); // true

    ```


    ### The result of `"1" + 2 + 3`


    The result is `"123"`. JavaScript performs string concatenation because the first
    operand is a string.


    ### JavaScript''s null value


    `null` in JavaScript represents the intentional absence of any object value. It
    is often used to signify `''nothing''`, `''empty''`, or `''value unknown''`.


    Understanding these JavaScript syntax and operators is fundamental to effective
    coding, as they are the building blocks for writing any script in JavaScript.
    Remember, proper usage of these elements can greatly influence the readability,
    efficiency, and functionality of your code.


    ## Advanced Concepts and Miscellaneous


    ### In JavaScript, truthy value


    Truthy values are those that convert to `true` when evaluated in a boolean context.
    Except for `false`, `0`, `-0`, `0n`, `""`, `null`, `undefined`, and `NaN` (which
    are falsy), all other values are truthy.


    ### Away to define an arrow function that returns the square of its input in JavaScript


    ```javascript

    const square = x => x * x;

    ```


    ### Define a constant


    Use the `const` keyword to define a constant. The value of a constant can''t be
    changed through reassignment.


    ```javascript

    const PI = 3.14;

    ```


    ### JavaScript closures


    A closure is a function that remembers its outer variables and can access them.


    ### Default behavior of the `this` keyword in JavaScript functions


    In a regular function, `this` refers to the global object (`window` in browsers).
    In a method (function within an object), `this` refers to the object.


    ### The Statement that is used to handle exceptions


    `try...catch` statements are used to handle exceptions.


    ```javascript

    try {


    // code that may throw an error


    } catch (error) {


    // code to handle the error


    }

    ```


    ### Correct way to define an async function


    ```javascript

    async function fetchData() {


    // asynchronous code

    }

    ```


    ### One of these is a way to define a variable in JavaScript that restricts its
    scope to the block in which it is defined


    Use `let` or `const` to define block-scoped variables.


    ### JavaScript package manager


    `npm` (Node Package Manager) and `yarn` are popular JavaScript package managers.


    ### Method to create a deep copy of an object


    ```javascript

    const newObj = JSON.parse(JSON.stringify(originalObj));

    ```


    ### Method that can be used to round a number to the nearest integer in JavaScript


    ```javascript

    Math.round(7.25); // returns 7

    ```


    ### Statement about null


    `null` is an assignment value representing `"no value"` or `"nothing"`. It''s
    not an object, despite what `typeof` returns.


    ### How to find the length of a string `str`


    ```javascript

    let length = str.length;

    ```


    ### The correct syntax for importing a module in modern JavaScript


    ```javascript

    import moduleName from ''module'';

    ```


    ### What the ‘static’ keyword does in JavaScript classes


    `static` defines a static method or property for a class. Static members are not
    accessible through class instances.


    ### Not a valid JavaScript variable name


    Names like `2name` (starting with a digit) or keywords like `let` are invalid.


    ### How to stop an interval timer


    ```javascript

    let timerId = setInterval(() => console.log(''Hello''), 1000);


    clearInterval(timerId);

    ```


    ### The main difference between the == and === operators in JavaScript


    `==` is the equality operator with type coercion, while `===` is the strict equality
    operator without type coercion.


    ### Methods can be used to send a request to a server


    `XMLHttpRequest` and the `fetch` API are commonly used.


    ### JavaScript method can be used to check if an object is an array


    ```javascript

    Array.isArray(obj);

    ```


    ### What will the following code return: Boolean(10 > 9)?


    It will return `true`, as the expression `10 > 9` is true.


    ### A closure in JavaScript


    A closure is a function that retains access to the outer scope in which it was
    created.


    ### `setTimeout()` function


    `setTimeout()` is used to execute a function once after a specified time interval.


    ### How to detect if a variable is an array


    ```javascript

    Array.isArray(variable);

    ```


    ### Method is used to remove the first element from an array and return that element


    ```javascript

    array.shift();

    ```


    ### The main difference between let and const


    `let` allows reassignment, while `const` doesn’t. Both are block-scoped.


    ### Statement will correctly call a function named `myFunction`


    ```javascript

    myFunction();

    ```


    ### Create an object


    ```javascript

    let obj = {}; // Object literal syntax

    ```


    ### What the delete operator does


    It removes a property from an object.


    ### The purpose of template literals


    Template literals provide an easy way to create strings with embedded expressions.


    ### What the `?.` operator signify in JavaScript


    The optional chaining operator `?.` allows you to read the value of a property
    deep within a chain of connected objects without having to check that each reference
    in the chain is valid.


    ### Statements will create a copy of an object


    Shallow copy: `let newObj = {...oldObj};`


    Deep copy: `let newObj = JSON.parse(JSON.stringify(oldObj));`


    ### JavaScript method is used for parsing a string to an integer


    ```javascript

    parseInt(string);

    ```


    ### What the `map()` method does


    `map()` creates a new array with the results of calling a function on every element
    in the calling array.


    ### A typical use case for an anonymous function


    Common use cases include callbacks and IIFE (Immediately Invoked Function Expressions).


    ### Correct method to clone an array in JavaScript


    ```javascript

    let newArray = oldArray.slice();

    ```


    ### How to find the character at a specific position in a string


    ```javascript

    let char = str.charAt(index);

    ```


    ### The use of the `new` keyword


    It creates a new instance of a user-defined object type or built-in object type.


    ### Detect if a variable is an array


    Use `Array.isArray()` to check if a variable is an array.


    Example:


    ```javascript

    let arr = [1, 2, 3];


    console.log(Array.isArray(arr)); // true

    ```


    ### JavaScript''s switch statement


    The `switch` statement evaluates an expression and executes code as per the case
    clause that matches the expression''s value.


    Example:


    ```javascript

    let fruit = "apple";


    switch (fruit) {


    case "apple":


    console.log("Apple case");


    break;


    default:


    console.log("Default case");


    }

    ```


    ### What the finally block does in a try-catch statement


    The `finally` block executes after the `try` and `catch` blocks, regardless of
    whether an exception was thrown or caught.


    Example:


    ```javascript

    try {


    // Code that may throw an error


    } catch (error) {


    // code to handle the error


    } finally {


    console.log("This will run regardless of the try / catch outcome");

    }

    ```


    ### How a while loop is started


    A `while` loop in JavaScript starts with the `while` keyword followed by a condition.
    The loop executes as long as the condition is true.


    Example:


    ```javascript

    let i = 0;


    while (i < 5) {


    console.log(i);


    i++;


    }

    ```

