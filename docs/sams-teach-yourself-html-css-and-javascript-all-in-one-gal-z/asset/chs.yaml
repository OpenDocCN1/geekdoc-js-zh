  , \"555-4444\");\nhenry = new Card(\"Henry Tillman\", \"233 Walnut Circle\", \"\
  555-1299\", \"555-1344\");\n\n// 并打印它们\nsue.PrintCard();\nphred.PrintCard();\nhenry.PrintCard();\n\
  ```\n\n***\n\n注意，`PrintCard()` 函数经过了微调，以便配合加粗的标题看起来更美观。要使用此脚本，请将其保存为 `cardtest.js`。接下来，你需要将脚本包含在一个简单的\
