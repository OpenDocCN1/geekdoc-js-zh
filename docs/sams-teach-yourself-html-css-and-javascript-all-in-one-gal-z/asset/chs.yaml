  3. 作为最后的手段：“先生，我并无与您相识。”\n\n## 皇室成员的得当称呼\n\n- **陛下 (Your Majesty)**：用于国王或女王。\n-\
  \ **皇殿下 (Your Royal Highness)**：用于君主的配偶、子女和兄弟姐妹。\n- **殿下 (Your Highness)**：用于君主的侄子、侄女和堂兄弟。\n\
  \n***\n\n### 注意\n\n请记住，不同的浏览器显示网页内容的方式可能大不相同。HTML 标准并没有规定浏览器应该如何格式化列表，因此使用旧版浏览器的用户可能看不到与你看到的完全相同的缩进。你可以使用\
  \ `CSS` 来对列表项目进行精确控制，你将在本章节的后面部分学习相关内容。\n\n### 在列表内嵌套列表\n\n虽然定义列表（definition lists）正式上应该用于定义术语，但许多网页作者在任何想要看到缩进的地方都会使用它们。在实践中，你只需要在任何文本开头加上\
  \ `<dl><dd>`，结尾加上 `</dd></dl>`，并跳过 `<dt></dt>` 标签对即可实现缩进。然而，缩进文本的更好方法是使用 `<blockquote></blockquote>`\
  \ 标签对，它在不假设定义的情况下缩进内容，并允许更清晰的样式设置。通过一组属性，你可以设置元素区域的宽度、高度、背景颜色、框类型和颜色以及其他视觉效果。\n\n\
  ***\n\n### 注意\n\n*嵌套* 指的是一个完全出现在另一个标签内部的标签。嵌套标签也被称为包含它们的（父）标签的*子标签*。一种常见的（但并非强制的）编码实践是对嵌套标签进行缩进，这样你就可以轻松看到它们与父标签之间的关系。\n\
  \n***\n\n由于使用 `CSS` 时你对项目的显示具有很强的控制力，因此没有必要使用*嵌套*列表来实现缩进的视觉效果。请在内容确实需要时才保留嵌套列表的使用。换句话说，使用嵌套列表来显示信息的层级结构，例如在列表\
  \ 5.6 中。\n\n有序列表和无序列表可以相互嵌套，深度可以根据你的需要任意。在列表 5.6 中，一个复杂的缩进大纲是由多个无序列表构建的。你会在图 5.6\
  \ 中注意到 Firefox 自动为前三层缩进使用不同类型的符号，使列表非常易读。这在现代浏览器中很常见。\n\n**图 5.6** 在 Firefox 中，多级无序列表经过了整齐的缩进和符号化，提高了可读性。\n\
  \n![image](img/05fig06.jpg)\n\n列表 5.6 使用列表构建大纲\n\n```xml\n<?xml version=\"1.0\"\
