  \  </p>\n  <p>\n    问：当警察审问数学家时，那里有多热？<br/>\n    答：x&sup3;&deg;。\n  </p>\n  <p>\n\
  \    问：一个严谨的抄袭者会做什么？<br/>\n    答：&copy;\n  </p>\n</body>\n</html>\n```\n\n### 文本对齐\n\
  \n现在你已经学会了如何在文本层面更改外观，现在是时候更进一步，修改页面上显示的文本块了。当你在 Web 上阅读信息时，大多数段落自动向左对齐，这一事实很容易被理所当然的。然而，在某些情况下，你可能会选择将内容右对齐甚至居中对齐。HTML\
  \ 提供了对齐单个 HTML 块级元素的选项，例如位于 `<p></p>` 或 `<div></div>` 标签对中的文本。\n\n\n\n\n属性用于调用应用于特定标签的样式、类或\
  \ ID。如果你在样式表中定义了一个特定的类或 ID——正如你在你在第 3 章中所学到的，“理解层叠样式表”那样——那么你就可以在标签内部使用 `class=\"\
  someclass\"` 或 `id=\"someid\"` 来调用该类或 ID。当浏览器渲染内容进行显示时，它将查找样式表，根据关联的样式定义来确定内容的具体显示方式。同样，你可以使用\
  \ `style` 属性为特定元素包含样式信息，而无需将该元素连接到实际样式表中。例如，当你使用 `<p>` 标签开始段落时，可以通过设置 `style` 属性来指定该段落的文本是对齐左边距、右边距还是页面居中。如果你想将该段落与现有的类或\
  \ ID 关联，则设置 `class` 或 `id` 属性。\n\n在以下示例中，每个段落都可以左对齐：\n\n```html\n<p style=\"text-align:\
  \ left;\">Text goes here.</p>\n<p class=\"leftAlignStyle\">Text goes here.</p>\n\
  <p id=\"firstLeftAlign\">Text goes here.</p>\n```\n\n在第一个段落中，样式直接出现在 `style` 属性中。在第二个段落中，如果\
  \ `leftAlignStyle` 类的样式表项包含 `text-align` 语句，则该段落将左对齐。同样，如果 `firstLeftAlign` 类的样式表项包含\
  \ `text-align` 语句，第三个段落也将左对齐。\n\n在在上的示例中，你可能注意到标签、属性和样式使用了小写字母。严格的 XHTML 标准要求标签和属性为小写；XHTML\
  \ 标准还要求属性值必须加引号。\n\n例如，以下代码将由大多数流行的网络浏览器渲染：\n\n```html\n<P STYLE=TEXT-ALIGN:CENTER>\n\
  ```\n\n然而，这段代码不符合 XHTML 标准，因为标签是大大写的，`style` 属性及其值（`text-align:center`）是大写的，且该值没有加引号。如果你想与最新的标准和软件保持兼容性，应该始终使用以下代码：\n\
  \n```html\n<p style=\"text-align:center\">\n```\n\n***\n\n### Note\n\nHTML 中的每个属性和样式规则都有一个默认值，当你没有自己设置属性时，会假设该值。对于\
  \ `<p>` 标签的 `text-align` 样式规则，默认值是 `left`，因此使用基础的 `<p>` 标签与使用 `<p style=\"text-align:left\"\
  >` 的效果相同。学习常用样式规则的默认值是成为优秀网页开发者的重要部分。\n\n***\n\n### 对齐块级元素\n\n要将 `<p>` 等块级元素对齐到右边距，而不在样式表中创建单独的类或\
  \ ID，只需在段落开头的 `<p>` 标签内部放置 `style=\"text-align:right\"`。同样，要使元素居中，请使用 `<p style=\"\
  text-align:center\">`。要将段落左对齐，使用 `<p style=\"text-align:left\">`。\n\n`style` 属性的\
  \ `text-align` 部分被称为*样式规则*（style rule），这意味着它正在设置 HTML 元素的特定样式方面。你可以使用许多样式规则来精细地控制网页内容的格式。\n\
  \n`text-align` 样式规则并不仅限于 `<p>` 标签。事实上，你可以在任何块级元素上使用 `text-align` 样式规则，包括 `<h1>`、`<h2>`、其他标题标签以及\
  \ `<div>` 标签等。`<div>` 标签特别有用，因为它可以包含其他块级元素，从而允许你一次性控制网页内容大部分部分的对齐。`<div>` 标签中的 `div`\
  \ 代表*划分*（division）。\n\n列表 5.4 展示了同时用于 `<p>` 和 `<div>` 标签的 `style` 属性和 `text-align`\
  \ 样式规则。结果正如图 5.4 所示。你将在第三部分中学习到更多 `<div>` 标签的高级用法。\n\n**图 5.4** 在列表 5.4 中使用文本对齐的结果。\n\
