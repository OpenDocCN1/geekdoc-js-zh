  \ class=\"formlabel\">What is your name?</div>\n      <div class=\"formfield\"><input\
  \ type=\"text\" name=\"name\" size=\"50\" /></div>\n      <div class=\"formlabel\"\
  >What is your e-mail address?</div>\n      <div class=\"formfield\"><input type=\"\
  text\" name=\"email\" size=\"50\" /></div>\n      <div class=\"formlabel\">Please\
  \ check all that apply:</div>\n      <div class=\"formfield\">\n        <input type=\"\
  checkbox\" name=\"website_response[]\" value=\"I really like your Web site.\" />I\
  \ really like your Web site.<br />\n        <input type=\"checkbox\" name=\"website_response[]\"\
  \ value=\"One of the best sites I've seen.\" />One of the best sites I've seen.<br\
  \ />\n        <input type=\"checkbox\" name=\"website_response[]\" value=\"I sure\
  \ wish my site looked as good as yours.\" />I sure wish my site looked as good as\
  \ yours.<br />\n        <input type=\"checkbox\" name=\"website_response[]\" value=\"\
  I have no taste and I'm pretty dense, so your site didn't do much for me.\" />I\
  \ have no taste and I'm pretty dense, so your site didn't do much for me.<br />\n\
  \      </div>\n      <div class=\"formlabel\">Choose the thing you love best about\
  \ my site:</div>\n      <div class=\"formfield\">\n        <input type=\"radio\"\
  \ name=\"lovebest\" value=\"me\" />That gorgeous picture of you.<br />\n       \
  \ <input type=\"radio\" name=\"lovebest\" value=\"cats\" />All the beautiful pictures\
  \ of your cats.<br />\n        <input type=\"radio\" name=\"lovebest\" value=\"\
  childhood\" />The inspiring recap of your childhood.<br />\n        <input type=\"\
  radio\" name=\"lovebest\" value=\"treasures\" />The detailed list of all your memorabilia.<br\
  \ />\n      </div>\n      <div class=\"formlabel\">If my site were a book, how many\
  \ copies would it sell?</div>\n      <div class=\"formfield\">\n        <select\
  \ size=\"3\" name=\"sales\">\n          <option value=\"Millions, for sure.\" selected=\"\
  selected\">Millions, for sure.</option>\n          <option value=\"100,00+ (would\
  \ be Oprah's favorite)\">100,000+ (would be Oprah's favorite)</option>\n       \
  \   <option value=\"Thousands (an under-appreciated)\">Thousands (an under-appreciated)</option>\n\
  \          <option value=\"Very few: not banal for today's public\">Very few: not\
  \ banal for today's public</option>\n          <option value=\"Sell? None. Everyone\
  \ will download it for free.\">Sell? None. Everyone will download it for free.</option>\n\
  \        </select>\n      </div>\n      <div class=\"formlabel\">How can I improve\
  \ my site?</div>\n      <div class=\"formfield\">\n        <select name=\"suggestion\"\
  >\n          <option value=\"Couldn't be better.\" selected=\"selected\">Couldn't\
  \ be better.</option>\n          <option value=\"More about the cats\">More about\
  \ the cats.</option>\n          <option value=\"More about the family\">More about\
  \ the family.</option>\n          <option value=\"More about Elvis\">More about\
  \ Elvis.</option>\n        </select>\n      </div>\n      <div class=\"formlabel\"\
  >Feel free to type more praise, gift offers, etc. below:</div>\n      <div class=\"\
  formfield\">\n        <textarea name=\"comments\" rows=\"4\" cols=\"55\"></textarea>\n\
  \      </div>\n      <div style=\"float:left;\">\n        <input type=\"submit\"\
  \ value=\"Click Here to Submit\" />\n        <input type=\"reset\" value=\"Erase\
  \ and Start Over\" />\n      </div>\n    </form>\n  </body>\n</html>\n```\n\n***\n\
  \n列表 26.1 中的代码使用了 `<form>` 标签，其中包含许多 `<input />` 标签。每个 `<input />` 标签对应于特定的用户输入组件，例如复选框或单选按钮。`input`、`select`\
  \ 和文本区域元素在样式表中包含了边框，因此可以很容易地看到表单中元素的轮廓。请记住，你可以对这些元素应用各种 CSS。\n\n接下来的几节将详细介绍 `<input\
  \ />` 和其他与表单相关的标签。\n\n### 接受文本输入\n\n要在表单中向用户询问特定信息，请使用 `<input />` 标签。该标签必须位于 `<form>`\
  \ 和 `</form>` 标签之间，但相对于文本、图像和其他 HTML 标签，它可以位于页面的任何位置。例如，为了询问某人的姓名，你可以输入以下文本并紧跟一个\
  \ `<input />` 字段：\n\n```html\n<p>What's your name? <input type=\"text\" size=\"\
  50\" maxlength=\"100\" name=\"user_name\" /></p>\n```\n\n***\n\n## 提示\n\n如果你希望用户输入文本而不在屏幕上显示，可以使用\
  \ `<input type=\"password\" />` 代替 `<input type=\"text\" />`。此时，星号（******）将替换用户输入的文本。`size`、`maxlength`\
  \ 和 `name` 属性在 `type=\"password\"` 中的工作方式与 `type=\"text\"` 完全相同。请记住，这种隐藏密码的技术只提供了视觉上的保护；对于传输的密码没有加密或其他保护。\n\
  \n***\n\n`type` 属性指示要显示什么类型的表单元素——在本例中，是一个简单的单行文本输入框。（本章将逐一讨论每个元素类型。）\n\n`size`\
  \ 属性指示文本输入框的大致宽度（字符数）。如果你使用的是比例宽字体，输入的宽度将取决于用户输入的内容。如果输入过长无法放入框内，大多数网络浏览器会自动将文本向左滚动。\n\
  \n\n\n\n`maxlength` 属性决定了用户允许在文本框中输入的字符数。如果用户尝试输入超过指定的长度，多出的字符将不会出现。你可以指定一个比文本框物理尺寸更、更短或相同的长度。`size`\
  \ 和 `maxlength` 属性仅用于 `type=\"text\"`，因为其他输入类型（复选框、单选按钮等）具有固定尺寸。\n\n## 为每项表单数据命名\n\
  \n无论输入元素是哪种类型，你都必须为它收集的数据指定一个名称（name）。你可以为每个输入项使用任何你喜的名称，只要表单上的每个名称都是不同的即可（单选按钮和复选框除外，它们将在本章稍后部分讨论）。当表单被后端脚本处理时，每个数据项都通过名称来标识。该名称将成为一个变量，并被填充一个值。该值可以是用户在表单中输入的内容，也可以是用户选择元素的值。\n\
  \n> **注意**\n> 为了符合本书的范围，这里的表单处理脚本经过了简化。提供给处理脚本的变量的确切形式（或名称）取决于该脚本的编程语言。但从概念上来说，可以说输入元素的名称变成了变量的名称，而输入元素的值变成了后端该变量的值，这是有效的。\n\
  \n例如，如果用户在之前定义的文本框中输入 `Jane Doe`，则会发送一个变量到表单处理脚本；该变量为 `user_name`，变量值为 `Jane Doe`。表单处理脚本处理此类类型的变量名和值。\n\
  \n在 JavaScript 中使用此（或其他）文本字段时，请记住文本对象使用 `name` 属性；你可以如下所示引用之前代码片段中字段的值：\n\n```\n\
  document.formname.user_name.value\n```\n\n本章将贯介绍更多名称/值对的示例。\n\n### 在表单中包含隐藏数据\n\n\
  想将某些数据项发送到处理表单的服务器脚本，但不想让用户看到这些数据项？使用带有 `type=\"hidden\"` 属性的 `<input />` 标签。该属性对显示没有影响；它只是在提交表单时将你指定的任何名称和值添加到表单结果中。\n\
  \n如果你正在使用 Web 托管供应商提供的表单处理脚本，可能会使用此属性告诉脚本将表单结果发送到哪个邮箱。例如，包含以下代码将在表单提交后将结果发送到 `me@mysite.com`：\n\
  \n```\n<input type=\"hidden\" name=\"mailto\" value=\"me@mysite.com\" />\n```\n\n\
  你有时可能会看到脚本使用隐藏输入元素来携带额外数据，这些数据在你接收表单提交结果时可能有用；隐藏表单字段的一些示例包括电子邮件地址和邮件主题。如果你正在使用 Web\
  \ 托管供应商提供的脚本，请咨询该脚本提供的文档，以获取有关可能需要的隐藏字段的更多信息。\n\n## 探索表单输入控件\n\n可以使用各种输入控件从用户那里获取信息。你已经看到了一种文本输入选项，接下来的几个章节将向你介绍用于设计表单的大多数剩余输入输入选项。\n\
  \n### 复选框\n\n最简单的输入类型是复选框，它显示为一个小正方形。用户可以点击复选框来选择或取消选择一组中的一个或多个项目。例如，列表 26.1](#ch26.html_ch26ex01)中列出的复选框位于标签“请勾选所有适用项”之后，这意味着用户确实可以选择所有适用项。\n\
  \n列表 26.1 中复选框的 HTML 显示所有项的 `name` 属性值都是相同的：`website_response[]`。\n\n```html\n<input\
  \ type=\"checkbox\" name=\"website_response[]\" value=\"I really like your Web site.\"\
  \ />I really like your Web site.<br />\n<input type=\"checkbox\" name=\"website_response[]\"\
  \ value=\"One of the best sites I've seen.\" />One of the best sites I've seen.<br\
  \ />\n<input type=\"checkbox\" name=\"website_response[]\" value=\"I sure wish my\
  \ site looked as good as yours.\" />I sure wish my site looked as good as yours.<br\
  \ />\n<input type=\"checkbox\" name=\"website_response[]\" value=\"I have no taste\
  \ and I'm pretty dense, so your site didn't do much for me.\" />I have no taste\
  \ and I'm pretty dense, so your site didn't do much for me.<br />\n```\n\n`name`\
  \ 属性中使用括号（`[]`）向处理脚本表明，系列值将被放入这个变量中，而不是仅仅一个值（嗯，如果用户只选择一个复选框，可能就只有一个值）。如果用户选择了第一个复选框，文本字符串“I\
  \ really like your Web site.”将被放入 `website_response[]` 桶中。如果用户选择了第三个复选框，文本字符串“I\
  \ sure wish my site looked as good as yours.”也会被放入 `website_response[]` 桶中。处理脚本会将该变量作为一个数据数组进行处理，而不是单个条目。\n\
  \n> **提示**\n> 如果发现输入元素的标签显示得离元素太近，只需在 `<input />` 标签结束和标签文本开始之间添加一个空格，如下：\n\n```html\n\
  <input type=\"checkbox\" name=\"mini\" /> Mini Piano Stool\n```\n\n然而，你可能会看到某些复选框组为组内的变量使用单独名称。例如，以下是复选框组的另一种编写方式：\n\
  \n```html\n<input type=\"checkbox\" name=\"liked_site\" value=\"yes\" /> I really\
  \ like your Web site.<br />\n<input type=\"checkbox\" name=\"best_site\" value=\"\
  yes\" /> One of the best Sites I've seen.<br />\n<input type=\"checkbox\" name=\"\
  my_site_sucks\" value=\"yes\" />I sure wish my site looked as good as yours.<br\
  \ />\n<input type=\"checkbox\" name=\"am_dense\" value=\"yes\" />I have no taste\
  \ and I'm pretty dense, so your site didn't do much for me.<br />\n```\n\n在之前的复选框中，复选框的变量名是\
  \ `liked_site`，值（如果被勾选）是 `yes`。\n\n如果你希望复选框在表单渲染时默认被勾选，请包含 `checked` 属性。例如，以下代码创建了两个复选框，第一个默认勾选：\n\
  \n```html\n<input type=\"checkbox\" name=\"website_response[]\" value=\"I really\
  \ like your Web site.\" checked=\"checked\" />I really like your Web site.<br />\n\
  <input type=\"checkbox\" name=\"website_response[]\" value=\"One of the best sites\
  \ I've seen.\" />One of the best sites I've seen.<br />\n```\n\n> **注意**\n> XHTML\
  \ 要求所有属性都有一个等号，后跟着一个值。这解释了为什么使用 `checked=\"checked\"` 来表示复选框被勾选（而不是只用 `checked`）。此规则适用于你在\
  \ HTML 中可能遇到的所有布尔属性（`true`/`false`、`on`/`off`、`yes`/`no` 等）。\n\n在本示例中，标记“I really\
  \ like your site.”的复选框默认勾选。用户必须点击复选框来表示他们对你的网站有其他意见。标记为“One of the best I’ve seen.”的复选框最初是未勾选的，因此用户必须点击它来开启。未选中的复选框根本不会出现在表单输出中。\n\
  \n如果你想在 JavaScript 中处理来自 `checkbox` 对象的值，该对象具有以下四个属性：\n\n• `name` 是复选框的名称，也是对象名称。\n\
  \n• `value` 是复选框的“真”值——通常是 `on`。该值被服务器端程序用于指示复选框是否被勾选。在 JavaScript 中，你应该使用 `checked`\
  \ 属性。\n\n\n\n\n\n- `defaultChecked` 是复选框的默认状态，由 HTML 中的 `checked` 属性赋值。\n- `checked`\
  \ 是当前值。这是一个布尔值：选中为 `true`，未选中为 `false`。\n\n要操作复选框或使用其值，您需要使用 `checked` 属性。例如，此条语句将开启一个名为\
  \ `order` 的表单中名为 `same_address` 的复选框：\n\n```javascript\ndocument.order.same.checked\
  \ = true;\n```\n\n复选框有一个方法：`click()`。该方法模拟对框框进行点击。它还单独事件 `onClick`，每当复选框被点击时就会发生。无论框框是开启还是关闭都会发生，因此您需要通过\
  \ JavaScript 检查 `checked` 属性来查看实际发生了什么操作。\n\n### 单选按钮\n\n`Radio buttons`（单选按钮）一次只能选择一个选项，其实实现起来复选框一样简单。单选按钮最简单的用法用于是/否问题，或者在只能选择一个候选人的情况下投票。\n\
  \n要创建一个单选按钮，只需使用 `type=\"radio\"` 并为每个选项提供自己的 `<input />` 标签。组中的所有单选按钮使用相同的 `name`，但不要使用您在复选框中使用的\
  \ `[]`：\n\n```html\n<input type=\"radio\" name=\"vote\" value=\"yes\" checked=\"\
  checked\" /> Yes<br />\n<input type=\"radio\" name=\"vote\" value=\"no\" /> No <br/>\n\
  ```\n\n`value`可以是您选择的任何名称或代码。如果包含 `checked` 属性，该按钮将默认被选中。相同 `name` 的单选按钮最多只能被一个。\n\
  \n### 注意\n单选按钮的命名是因为它们类似于旧式按钮音机上的按钮。那些按钮使用机械结构，当你按下一个按钮时，其他按钮就会弹出。\n\n在设计表单并在复选框和单选按钮之间进行选择时，问问自己：“这个问题是只有一种答案吗？”如果是，请使用单选按钮。\n\
  \n在脚本方面，单选按钮与复选框相似，区别在于整组按钮共享同一个名称和同一个对象。您可以引用 `radio` 对象的以下属性：\n\n- `name` 是单选按钮的共用名称。\n\
  - `length` 是组中单选按钮的数量。\n\n要通过 JavaScript 访问单个按钮，您将 `radio` 对象视为数组。按钮是有索引的，从 `0`\
  \ 开始。每个单独按钮都有以下属性：\n\n- `value` 是分配给按钮的值。\n- `defaultChecked` 表示 `checked` 属性的值和按钮的默认状态。\n\
  - `checked` 是当前状态。\n\n例如，您可以使用此条语句检查 `form1` 表单中 `radio1` 组中的第一个单选按钮：\n\n```javascript\n\
  document.form1.radio1[0].checked = true;\n```\n\n然而，如果您这样做，请务必根据需要将其他值设置为 `false`。这不会自动完成。您可以使用\
  \ `click()` 方法在一步内完成这两项操作。\n\n像复选框一样，单选按钮也有 `click()` 方法和 `onClick` 事件处理器。每个单选按钮都可以为该事件拥有一个一个单独的语句。\n\
  \n## 列表\n\n`scrolling lists`（滚动列表）和 `pull-down pick lists`（下拉选择列表）都是用 `<select>`\
  \ 标签创建的。您可以使用此标签配合 `<option>` 标签使用，如下例所示（摘自 Listing 26.1):\n\n```html\n<select size=\"\
  3\" name=\"sales\">\n  <option value=\"Millions, for sure.\" selected=\"selected\"\
  >Millions,\n      for sure.</option>\n  <option value=\"100,000+ (would be Oprah's\
  \ favorite)\">100,000+\n      (would be Oprah's favorite)</option>\n  <option value=\"\
  Thousands (an under-appreciated classic)\">Thousands\n      (an under-appreciated\
  \ classic)</option>\n      <option value=\"Very few: not banal enough for today's\
  \ public\">Very\n      few: not banal enough for today's public.</option>\n  <option\
  \ value=\"Sell? None. Everyone will download it for free.\">Sell?\n      None. Everyone\
  \ will download it for free.</option>\n</select>\n```\n\n在 `<select>` 和 `</select>`\
  \ 标签之间不应出现 `<option>` 和 `</option>` 之外的 HTML 标签。\n\n## 提示\n如果省略 `size` 属性或指定 `size=\"\
  1\"`，列表将创建一个下拉选择列表。选择列表不允许多个选择；它们在逻辑上等同于一组单选按钮。下面的示例显示了另一种为问题选择是或否的方法：\n\n```html\n\
  <select name=\"vote\">\n  <option value=\"yes\">Yes</option>\n  <option value=\"\
  no\">No</option>\n</select>\n```\n\n与 `text` 输入类型不同，这里的 `size` 属性决定了选择列表中一次显示多少项。如果在前面的代码中使用\
  \ `size=\"2\"`，则只有前两个选项是可见的，列表旁边会出现一个滚动条，以便使用户可以向下滚动查看第三个选项。\n\n包含 `multiple` 属性允许用户一次选择多个选项；`selected`\
  \ 属性使选项在初始默认被选中。当表单提交时，每个选项的 `value` 属性中指定的文本将随选中的选项一同提交。\n\n选择列表的对象是 `select` 对象。该对象本身具有以下属性：\n\
  \n- `name` 是选择列表的名称。\n- `length` 是列表中的选项数量。\n- `options` 是选项数组。每个可选择的选项在数组中都有一个条目。\n\
  - `selectedIndex` 返回当前选中项的索引值。您可以使用此轻松地检查值。在多选择列表中，这表示第一个被选中的项。\n\n`options` 数组本身有一个属性\
  \ `length`，它表示选择的数量。此外，`options` 数组中的每个项目都有以下属性：\n\n- `index` 是进入数组的索引。\n- `defaultSelected`\
  \ 表示 `selected` 属性的状态。\n- `selected` 是选项的当前状态。将此属性设置为 `true` 会选中该选项。如果 `<select>`\
  \ 标签中包含了 `multiple` 属性，用户可以选择多个选项。\n- `name` 是 `name` 属性的值。这由服务器使用。\n- `text` 是显示在选项中的文本。\n\
  \n`select` 对象有两个方法——`blur()` 和 `focus()`——它们的作用与 `text` 对象的对应方法相同。事件处理器为 `onBlur`、`onFocus`\
  \ 和 `onChange`，也与其他对象类似。\n\n### 注意\n您可以动态地更改选择列表——例如，在一个列表中选择一个产品可以控制另一个列表中提供哪些可用选项。您还可以从列表中添加和删除选项。\n\
  \n读取被选中项的值是一个两步过程。您首先使用 `selectedIndex` 属性，然后使用 `value` 属性找到选中结果的值。这是一个示例：\n\n```javascript\n\
  ind = document.mvform.choice.selectedIndex;\nval = document.mvform.choice.options[ind].value;\n\
  ```\n\n这使用 `ind` 变量来存储选中的索引，然后将 `val` 变量赋值给被选的值。多选择的情况会复杂一些；您必须单独测试每个选项的 `selected`\
  \ 属性。\n\n## 文本字段和文本区域\n\n本章早期提到的 `<input type=\"text\">` 属性允许用户输入单行文本。当您想在单个输入项中允许多行文本时，使用\
  \ `<textarea>` 和 `</textarea>` 标签创建一个文本区域，而不是简单的文本字段。您在这两个标签之间包含的任何文本将显示为默认输入。这是一个示例：\n\
  \n```html\n<textarea name=\"comments\" rows=\"4\" cols=\"20\">Your\n  message here.</textarea>\n\
  ```\n\n\n\n正如你可能猜到的那样，`rows` 和 `cols` 属性控制输入框中可容纳的文本行数和列数。`cols` 属性没有 `rows` 那么精确，它近似一行文本能够容纳的字符数。然而，文本区域（Text\
  \ area）带有滚动条，因此用户输入的文本可以超过显示区域的显示范围。\n\n`text` 和 `textarea` 对象还有几个你可以使用的方法：\n\n\
  - `focus()` 将焦点设置到该字段。这会将光标置于字段中并使其成为当前字段。\n- `blur()` 是反向操作；它会从字段中移除焦点。\n- `select()`\
  \ 选择字段中的文本，就像用户使用鼠标操作一样。它会选中所有文本；没有方法只选择部分文本。\n\n你还可以使用事件处理器来检测文本字段的值何时。`text` 和\
  \ `textarea` 对象支持以下事件处理器：\n\n- `onFocus` 事件在文本字段获得焦点时发生。\n- `onBlur` 事件在文本字段失去焦点时发生。\n\
  - `onChange` 事件在用户更改字段中的文本并离开该字段时发生。\n- `onSelect` 事件在用户选择字段中的部分或全部文本时发生。遗憾的是，无法准确判断选中了哪部分文本。（如果使用前述的\
  \ `select()` 方法选择文本，则不会触发此事件。）\n\n如果使用这些事件处理器，应将其包含在 `<input>` 标签声明中。例如，以下是一个包含\
  \ `onChange` 事件并显示警框的文本字段：\n\n```html\n<input type=\"text\" name=\"text1\" onChange=\"\
  window.alert('Changed.');\" />\n```\n\n### 提交表单数据\n\n表单通常包含一个按钮将表单数据提交到服务器上的脚本或调用\
  \ JavaScript 操作。你可以使用 `value` 属性在提交按钮上设置任何喜欢的标签：\n\n```html\n<input type=\"submit\"\
  \ value=\"Place My Order Now!\" />\n```\n\n灰色按钮的大小将适应你在 `value` 属性中设置的标签。当用户点击它时，表单上的所有数据项将发送到表单\
  \ `action` 属性中指定的电子邮件地址或脚本。\n\n你还可以包含一个重置（Reset）按钮，用于清除表单上的所有输入，以便用户在改变主意或出错时重新开始。使用以下代码：\n\
  \n```html\n<input type=\"reset\" value=\"Clear This Form and Start Over\" />\n```\n\
  \n如果你觉得标准的提交和重置按钮看起来有点单调，请记住你可以使用 CSS 对它们进行样式设置。如果这还不够，你会惊喜地知道，有一种简单的方法可以用你自己的图形替换这些按钮。要使用自定义的图片作为提交按钮，请使用以下代码：\n\
  \n```html\n<input type=\"image\" src=\"button.gif\" alt=\"Order Now!\" />\n```\n\
  \n`button.gif` 图片将显示在页面，当用户点击 `button.gif` 图片时，表单将提交。你还可以包含任何通常用于 `<img />` 标签的属性，例如\
  \ `alt` 和 `style`。\n\n表单元素还包含一种通用的按钮类型。在 `<input />` 标签中使用 `type=\"button\"` 时，你将获得一个不执行任何操作的按钮，但可以使用\
  \ JavaScript 事件处理器为其分配操作。\n\n#### 使用 JavaScript 处理表单事件\n\n`form` 对象有两个方法：`submit()`\
  \ 和 `reset()`。你可以使用这些方法手动提交数据或重置表单，而不需要用户按下按钮。其原因之一是在用户点击图像或执行其他通常不会提交表单的操作时提交表单。\n\
  \n**注意**\n\n如果你使用 `submit()` 方法将数据发送到服务器或通过电子邮件，大多数浏览器会提示用户确认其是否想要提交这些信息。无法在用户不不知情的情况下执行此操作。\n\
  \n`form` 对象有两个事件处理器：`onSubmit` 和 `onReset`。你可以在定义表单的 `<form>` 标签内为这些事件指定一组 JavaScript\
  \ 语句或函数调用。\n\n如果你为 `onSubmit` 事件指定了语句或函数，则该语句会在数据提交到服务器端脚本之前被调用。你可以通过从 `onSubmit`\
  \ 事件处理器返回 `false` 值来防止提交的发生。如果语句返回 `true`，则数据将被提交。同样地，你也可以通过 `onReset` 事件处理器防止重置按钮生效。\n\
  \n### 使用 JavaScript 访问表单元素\n\n`form` 对象最重要的属性是 `elements` 数组，它包含每个表单元素对应的对象。你可以通过元素自身的名称或在数组中的索引来引用元素。例如，以下两个表达式都引用了\
  \ 示例列表 26.1 中所示表单中的第一个元素：\n\n```javascript\ndocument.gbForm.elements[0]\ndocument.gbForm.name\n\
  ```\n\n**注意**\n\n表单和元素都可以通过它们自身的名称或作为 `forms` 和 `elements` 数组中的索引进行引用。为了清晰起见，本章中的示例使用了单个表单和元素名称，而不是数组引用。你也会发现在自己的脚本中使用名称会更方便。\n\
  \n如果你确实将表单和元素作为数组引用，可以使用 `length` 属性来确定数组中对象的数量：`document.forms.length` 是表单的数量。\n\
  \n你还可以使用 `id` 属性访问元素。例如，`document.getElementById(\"name\")` 会找到 `id=\"name\"` 的元素。\n\
  \n### 在弹出窗口中显示数据\n\n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\"\
  >\n<html lang=\"en\">\n<head>\n  <title>Form Display Example</title>\n  <script\
  \ type=\"text/javascript\">\n    function display() {\n      dispWin = window.open('NewWin','toolbar=no,status=no,width=300,height=200');\n\
  \      message = \"<ul><li><strong>NAME:</strong>\" + form1.name.value;\n      message\
  \ += \"<li><strong>ADDRESS:</strong>\" + form1.address.value;\n      message +=\
  \ \"<li><strong>PHONE:</strong>\" + form1.phone.value + \"</ul>\";\n      dispWin.document.write(message);\n\
  \    }\n  </script>\n</head>\n<body>\n  <h1>Form Display Example</h1>\n  <p>输入以下信息。当你点击\
  \ Display 按钮时，你输入的数据将显示弹出窗口中。</p>\n  <form name=\"form1\" method=\"get\" action=\"\
  \">\n    <p>NAME: <input type=\"text\" name=\"name\" size=\"50\" /></p>\n    <p>ADDRESS:\
  \ <input type=\"text\" name=\"address\" size=\"50\" /></p>\n    <p>PHONE: <input\
  \ type=\"text\" name=\"phone\" size=\"50\" /></p>\n    <p><input type=\"button\"\
  \ value=\"Display\" onclick=\"display();\" /></p>\n  </form>\n</body>\n</html>\n\
  ```\n\n* * *\n\n以下是该 HTML 文档和脚本的工作原理说明：\n\n- 文档头部的 `<script>` 部分定义了一个名为 `display()`\
  \ 的函数，该函数打开一个新窗口并显示表单中的信息。\n\n\n\n\n\n-   `<form>` 标签开始表单。由于此表单完全由 JavaScript 处理，因此表单的\
  \ `action` 和 `method` 无值。\n\n-   `<input />` 标签定义了表单的三个字段：`yourname`、`address` 和\
  \ `phone`。最后一个 `<input />` 标签定义了显示按钮，该按钮设置为运行 `display()` 函数。\n\n图 26.2 显示了该表单的运行情况。显示按钮已被点击，弹出窗口了结果。\n\
  \n**图 26.2** 在弹出窗口中显示来自表单的数据。\n\n![image](img/26fig02.jpg)\n\n### 通过电子邮件发送表单结果\n\
  \n使用表单的一种简单方法是通过电子邮件发送结果。你可以在不使用任何 JavaScript 的情况下实现这一点，尽管你可以使用 JavaScript 来验证输入的信息（你将在本章稍后的部分学到这一点）。\n\
  \n要通过电子邮件发送表单结果，你需要在表单的 `action` 属性中使用 `mailto:` 操作。列表 26.3 是列表 26.2 中姓名和地址表单的修改版本，它通过电子邮件发送结果。\n\
  \n列表 26.3 通过电子邮件发送表单结果\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Form Submit Example</title>\n  </head>\n  <body>\n    <h1>Form Submit Example</h1>\n\
  \    <p>请输入以下信息。当您点击发送\n  按钮时，你输入的数据将通过电子邮件发送。</p>\n    <form name=\"form1\" method=\"\
  post\" action=\"mailto:user@domain.com\"\n          enctype=\"text/plain\">\n  \
  \    <p>NAME: <input type=\"text\" name=\"name\" size=\"50\" /></p>\n      <p>ADDRESS:\
  \ <input type=\"text\" name=\"address\" size=\"50\" /></p>\n      <p>PHONE: <input\
  \ type=\"text\" name=\"phone\" size=\"50\" /></p>\n      <p><input type=\"submit\"\
  \ value=\"Submit Form\" /></p>\n    </form>\n  </body>\n</html>\n```\n\n***\n\n\
  ## 注意事项\n\n由于这种技术在所有浏览器上并不能一致工作，我不建议你使用它。某些浏览器会调用你的邮件客户端；另一些将通过你基于浏览器的电子邮件账户发送表单数据。提供这个示例更多是作为你*可以*使用\
  \ JavaScript 完成的过程的示例，你在网络上找到的许多脚本中可能会看到它。要更可靠地发送表单结果，你可以使用服务器端的表单转邮件脚本；你的托管提供商可能会提供一个或多个供你使用。\n\
  \n***\n\n要使用此表单，请将 `<form>` 标签中 `action` 属性中的 `user@domain.com` 改为你的电子邮件地址。注意 `<form>`\
  \ 标签中的 `enctype=\"text/plain\"` 属性。这确保了电子邮件消息中的信息将是可读的纯文本格式，而不是编码格式。\n\n虽然这提供了一种从表单检索数据的快速快捷方法，但这种技术的缺点是它高度依赖浏览器。它是否对你页面的每个用户有效取决于他们的浏览器和邮件客户端的配置。\n\
  \n***\n\n### 动手尝试：验证表单\n\nJavaScript 最有用途之一是验证表单。这意味着使用脚本来验证输入的信息是否有效——例如，确保没有字段为空，并且数据格式正确。\n\
  \n无论表单是通过电子邮件提交、提交到服务器端脚本，还是仅供脚本使用，你都可以 JavaScript 来验证表单。列表 26.4 是包含验证功能的姓名和地址表单版本。\n\
  \n列表 26.4 带有验证脚本的表单\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Form Submit Example</title>\n    <script type=\"text/javascript\">\n  \
  \    function validate() {\n        if (document.form1.name.value.length < 1) {\n\
  \          alert(\"请输入您的全名.\");\n          return false;\n        }\n        if\
  \ (document.form1.address.value.length < 3) {\n          alert(\"请输入您的地址.\");\n\
  \          return false;\n        }\n        if (document.form1.phone.value.length\
  \ < 3) {\n          alert(\"请输入您的电话号码.\");\n          return false;\n        }\n\
  \      }\n    </script>\n  </head>\n  <body>\n    <h1>Form Submit Example</h1>\n\
  \    <p>请输入以下信息。当您点击发送\n  按钮时，你输入的数据将通过电子邮件发送。</p>\n    <form name=\"form1\" method=\"\
  post\" action=\"mailto:user@domain.com\"\n          enctype=\"text/plain\" onsubmit=\"\
  return validate()\">\n      <p>NAME: <input type=\"text\" name=\"name\" size=\"\
  50\" /></p>\n      <p>ADDRESS: <input type=\"text\" name=\"address\" size=\"50\"\
  \ /></p>\n      <p>PHONE: <input type=\"text\" name=\"phone\" size=\"50\" /></p>\n\
  \      <p><input type=\"submit\" value=\"Submit Form\" /></p>\n    </form>\n  </body>\n\
  </html>\n```\n\n\n\n\n\n**A.** 是的，如果你足够仔细的话。请务必使用 `Submit` 按钮而不是 `submit` 操作。此外，服务器端脚本可能会接收到未验证的数据，因此务必在\
  \ CGI 脚本中包含相同的验证逻辑。非 JavaScript 用户可以使用该表单，但无法获得关于其错误的即时反馈。\n\n**Q. 有没有方法可以创建大量的文本字段，而无需为它们中的每一个都设置不同的名称？**\n\
  \n**A.** 有的。如果你在表单的多个元素中使用相同的名称（name），它们的对象将形成一个数组。例如，如果你定义了 20 个名为 `member` 的文本字段，你可以通过\
  \ `member[0]` 到 `member[19]` 来引用它们。这也适用于其他类型的表单元素。\n\n**Q. 是否有方法在表单加载时或在我的验证程序显示错误消息后，将光标放置在特定字段上？**\n\
  \n**A.** 是的。你可以使用字段的 `focus()` 方法将光标发送到那里。要在页面加载时执行此操作，你可以使用 `<<body>>` 标签中的 `onLoad`\
  \ 方法。不过，目前没有方法将光标放置在字段内的特定位置。\n\n## 工作坊\n\n工作坊包含测验题和活动，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**1.** 你会使用什么 HTML 代码来创建一个能够询问用户姓名和性别的访客簿表单？假设你已经在 `/scripts/formscript`\
  \ 设置了表单处理脚本，并且你需要包含以下隐藏输入元素以告诉脚本将表单结果发送到哪里：\n\n```html\n<input type=\"hidden\" name=\"\
  mailto\" value=\"you@yoursite.com\" />\n```\n\n**2.** 如果你创建了一个名为 `submit.gif` 的图像，你会如何使用它作为第\
  \ 1 题中创建表单的提交按钮？\n\n**3.** `<form>` 标签的以下哪个属性决定了数据将发送到哪里？\n\na. `action`\n\nb. `method`\n\
  \nc. `name`\n\n**4.** 你在何处放置 `onsubmit` 事件处理程序来验证表单？\n\na. 在 `<<body>` ` 标签中\nb.\
  \ 在 `<form>` 标签中\nc. 在提交按钮的 `<input />` 标签中\n\n## 答案\n\n**1.** 你将使用类似下面的 HTML 代码（当然，还有适当的\
  \ DOCTYPE 和其他结构标记）：\n\n```html\n<form name=\"form1\" method=\"post\" action=\"/scripts/formscript\"\
  >\n<input type=\"hidden\" name=\"mailto\" value=\"you@yoursite.com\" />\n<p>您的姓名:\
  \ <input type=\"text\" name=\"name\" size=\"50\" /></p>\n<p>您的性别:\n<input type=\"\
  radio\" name=\"gender\" value=\"male\" /> 男\n<input type=\"radio\" name=\"gender\"\
  \ value=\"female\" /> 女\n<input type=\"radio\" name=\"gender\" value=\"mind your\
  \ business\" />\n 关你的事 </p>\n<p><input type=\"submit\" value=\"Submit Form\" /></p>\n\
  </form>\n```\n\n**2.** 替换以下代码：\n\n```html\n<input type=\"submit\" value=\"Submit\
  \ Form\" />\n```\n\n为此代码：\n\n```html\n<input type=\"image\" src=\"submit.gif\" />\n\
  ```\n\n**3.** a. `action` 属性决定了数据的发送位置。\n\n**4.** b. 你将 `onsubmit` 事件处理程序放置在 `<form>`\
  \ 标签中。\n\n## 练习\n\n- 使用所有不同类型的输入元素和选择列表创建一个表单，以确保你理解每种元素的工作原理。\n- 修改 列表 26.4 中的\
  \ `validate` 函数，使得在显示指示字段错误的消息后，光标将移动到该字段。（对相应的表单元素使用 `focus` 方法。）\n- 在 列表 26.4\
  \ 的表单中添加一个电子邮件地址的文本字段。在 `validate` 函数中添加一个功能，验证电子邮件地址至少包含五个字符，并且包含 `@` 符号。\n- 调查你的网络托管提供商提供的表单处理选项，并使用托管商提供的脚本来处理你在上一个练习中创建的表单。\n\
  \n## 第 27 章 网站的组织与管理\n\n* *\n\n在本章中你将学习：\n\n- 如何判断一个页面是否足够处理你的所有内容\n- 如何组织简单的网站\n\
  - 如何组织大型网站\n- 如何编写可维护的代码\n- 如何开始使用版本控制\n* * *\n\n本书的大部分内容引导你完成了自己 Web 内容的设计和创建，从文本到图形再到多媒体，以及实现了用于增强用户交互的节点\
  \ JavaScript 功能。在这一过程中，我提到了一些你用来思考这些内容生命周期的方法，但在本章中，你将学习如何从整体上看待你的工作。\n\n本章将向你展示如何组织和呈现多个网页，以便访问者能够在之间导航而不产生困惑。你还将学习让你的网站具有足够吸引力让人们反复访问的方法。Web\
  \ 开发者使用 *sticky*（粘）一词来描述人们不想离开的页面。希望本章能帮助让你的网站变得非常“粘人”！\n\n由于网站可以（且通常应该）频繁更新，创建易于维护的页面至关重要。本章将向你如何在页面中添加注释和其他文档，以便你——或你团队中的任何其他人——能够理解并修改你的页面，还将向你介绍版本控制，以便你可以个人或作为团队的一部分进行创新，而不会覆盖你想要保存的工作。\n\
  \n* *\n\n### 动手尝试：评估你的组织工作\n\n读到这里，你应该已经拥有足够的 HTML、CSS 和 JavaScript 知识来制作你网站的大部分。你可能已经创建了很多页面，甚至可能将它们发布到了网上。\n\
  \n在阅读本章时，思考你现在的页面是如何组织的，以及你可以如何改进这种组织。你是否在 HTML 和 JavaScript 中使用了注释，或者创建了一个显示组织结构的文档以供未来的网站维护者？如果没有，现在是一个开始的好机。在此过程中，如果你决定进行涉及更改几乎所有页面的重新设计，请不要惊讶——结果很可能是值得付出的！\n\
  \n* *\n\n### 当单页足够时\n\n构建和组织一个吸引人且有效的网站并不总是需要一项复杂的任务。如果你是为一个单一实体（例如当地活动）创建一个存在感，且只需要少量非常具体的信息，你可以有效地在单个页面上呈现这些信息，而不需要许多花哨的图形。事实上，单页\
  \ Web 展示有几个优点：\n\n- 网站上的所有信息下载速度都比更复杂的网站更快。\n- 整个网站可以通过一个打印命令打印在纸上，即使它有几页纸。\n- 访问者可以轻松地将网站保存到硬盘中以备后用，特别是当它使用的图形很少时。\n\
  - 同一页面不同部分之间的链接通常比指向其他页面的链接响应更快。\n\n图 27.1 显示了一个网页的第一部分，该页面作为单页长比作为多页网站更符合其目标受众。该页面像大多数介绍页面一样，开头简要地解释了页面关于什么以及谁会读它。详细的目录允许访问者直接跳转到他们最感兴趣的参考资料。它包含了大约八页纸的文本，解释如何开始购房过程——访问者可能会考虑将其打印出来稍后阅读，可能还会做笔记。\n\
  \n**图 27.1** 一个良好的目录可以使长页面易于导航。\n\n![image](img/27fig01.jpg)\n\n\n\n\n如图 27.2 所示，页面的每个短章节后面都紧随着一个返回目录的链接，因此在页面上的导航感觉与在多页网站中导航非常相似。由于页面内容旨在作为方便的参考，访问者无疑更倾向于使用书签或保存单个页面的便利，而不是多个独立的页面。\n\
  \n**图 27.2** 在长网页的每个章节之后，始终务必提供一个返回目录的链接。\n\n![image](img/27fig02.jpg)\n\n在看过了此书中所有花哨的图表和布局后，你可能会倾向于忘记：一个良好的、老派的大纲通常是组织网站内长网页最清晰、最高效的方法。\n\
  \n### 组织一个简单的网站\n\n虽然单页网站有其用处，但大多数公司和个人通过将网站分为短小、易于阅读的页面来更好地服务于读者。这些页面周围环绕着图形化导航，允许用户通过几次点击就能找到他们想要的所有信息。此外，使用多个页面而不是一系列极长的页面可以减少在页面上的滚动，这对于使用移动设备查看网站或显示器分辨率较低（低于\
  \ 800×600）的访问者来说可能特别困扰。\n\n首页的目标仅仅是让组织结构在互联网上可见，而且——更重要的是——作为进入网站本身包含信息的门户。网站的主页应该为用户提供足够的信息，以描勒出组织的清晰画像，以及传统的地址、电话联系方式和用于咨询问题或反馈的电子邮件地址。它还应该提供清晰的路径，进入网站其他页面中应包含的高度结构化信息。图\
  \ 27.3 所示的主页提供了所有这些良好功能的示例：基本信息、联系信息以及面向多个受众的访问路径。\n\n**图 27.3** 该大学主页使用基础设计、极简但实用的图形和清晰的结构，来吸引用户探索更多信息。\n\
  \n![image](img/27fig03.jpg)\n\n***\n\n**提示**\n\n无论你的网站有多大，仔细组织你的资源都是好主意。例如，将网页的图像放置在名为\
  \ `images` 的单独文件夹中。同样，如果你有可下载的文件，请将它们放在名为 `downloads` 的文件夹中。这使得根据特定类型（HTML 页面、GIF\
  \ 图像等）跟踪网页资源变得容易得多。此外，如果你将网站划分为不同的章节（如公司、产品、新闻等），出于同样的组织考虑，请将单独页面放入类似命名的目录（`company`、`products`、`press`\
  \ 等）。\n\n***\n\n初级网站开发者最常犯的错误之一是创建与网站上其他页面看起来不同的页面。另一个同样严重的错误是使用成千上万其他网页作者也在使用的相同的公共剪贴画。请记住，在互联网上，点击一下就能带你环游世界。让你的页面具有记忆点并被识别为一个统一网站的唯一方法，就是让你所有页面都遵循一个独特、不容置疑的视觉主题。换句话之，努力与其他网站相比保持独特性，同时在网站内部保持统一性。\n\
  \n作为一个统一性如何帮助网站更具凝聚力的例子，请想一下你可能访问过的大型热门网站，例如 [ESPN.com](http://ESPN.com)。如果你访问 [ESPN.com](http://ESPN.com)\
  \ 的 MLB 板块（见图 27.4）和 NFL 板块（见图 27.5），你会发现它们的结构非常相似。\n\n**图 27.4** [ESPN.com](http://ESPN.com)\
  \ 的 MLB 板块。\n\n![image](img/27fig04.jpg)\n\n**图 27.5** [ESPN.com](http://ESPN.com)\
  \ 的 NFL 板块。\n\n![image](img/27fig05.jpg)\n\n在两个示例中，你都能看到页面顶部有导航元素（包括一些子导航元素），页面中间有一个用于精选项目图形的大区域，右侧有一个包含当前头条新闻链接的矩形，以及在头条新闻链接下方另一个用于显示广告的矩形。MLB\
  \ 板块和 NFL 板块之间的唯一区别是配色方案：MLB 板块是以蓝色为主的配色方案，而 NFL 板块以绿色为主。然而，在两个板块中，你都知道，如果想阅读热门新闻，就看页面右侧。如果你想导航到网站的另一个板块或网站主页，就看页面左上角的导航元素。\n\
  \n这些一致的元素有助于确保你的用户能够自信地贯穿于你的内容。从维护的角度来看，一致的结构模板允许你重用代码段。这种代码重用通常发生在本书范围之外的动态服务器端编程中，但通常来说，这意味着不需要反复复制粘贴相同的\
  \ `HTML` 和 `JavaScript`，客户端代码只存在于一个地方，并动态地应用到内容中。因此，你不需要修改成千上万的文件，只需要修改一次。\n\n###\
  \ 组织更大的网站\n\n对于复杂的网站，如果能在所有页面中一致地使用复杂的布局和图形，可以帮助组织并提升你网站的外观。为了了解如何让美学和组织协同工作，让我们看看几个向多个不同受众提供大量信息的网站的导航（以及底层组织）示例。\n\
  \n图 27.6 显示了 [Amazon.com](http://Amazon.com) 的首页，特别是选中了侧边导航的情况。Amazon 的业务是销售产品，简单直接。因此，让\
  \ Amazon 显示产品类别作为主要的导航元素（如图所示）是合理的。\n\n**图 27.6** [Amazon.com](http://Amazon.com)\
  \ 将产品类别作为主要的导航元素。\n\n![image](img/27fig06.jpg)\n\n尽管 Amazon 的业务是销售产品，但它仍然必须提供关于它是谁、如何联系它以及其他次要但重要的信息，以增强与消费者的关系。此类信息的链接出现在\
  \ [Amazon.com](http://Amazon.com) 网站的页脚（或底部部分）——在该截图视图区域之外。\n\n\n\n\n\n下一个例子是 [Starbucks.com](http://Starbucks.com)\
  \ 网站的一个二级页面。[Starbucks.com](http://Starbucks.com) 网站中的所有页面都遵循一种常见的导航和子导航呈现类型：用于主导航的水平条，该部分的次要元素放置在左侧的垂直列中。如图\
  \ 27.7 所示，用户正在浏览的区域（关于我们）会被高亮显示。这种视觉指示有助于用户在站点内确定位置。使用视觉指示是一种实用的策略，因为你的用户可能是通过搜索引擎或另一个网站的链接到达页面的。在用户到达后，你希望他们能感到宾客如家——或者至少让他们知道自己相对于你网站的位置。\n\
  \n**图 27.7** 此此 [Starbucks.com](http://Starbucks.com) 二级页面显示了一个被选中的主导航元素，页面左侧带有二级导航。\n\
  \n![image](img/27fig07.jpg)\n\n从不同的主导航元素可以看出——我们的咖啡、我们的门店、星巴克卡、居家、商务、关于我们以及在线购物——星巴克网站必须服务于因不同原因访问网站的各种类型的人。当你组织自己的网站站点内容时，请确定对你来说最重要的信息，以及对你的用户最重要的信息，并创建一个在两者之间找到良好平衡的导航方案。\n\
  \n图 27.8 显示了另一个导航风格的示例，这次是对标准的顶部导航/左侧导航方案的变体。在这个示例中，左侧导航（在此情况下为二级导航）也出现在主导航下的下拉菜单中（请参考第\
  \ 11 章，“使用 CSS 在列表、文本和导航上实现更多功能”，以获取如何进行此类操作的信息）。将鼠标悬停在任何其他主导航元素上都会显示类似的菜单。这种方案使用户在指尖上拥有整个站点地图，因为他们从任何其他页面点击一下即可到达站点的任何地方。\n\
  \n**图 27.8** [BAWSI.org](http://BAWSI.org) 网站显示了附在每个主导航元素上的子导航。\n\n![image](img/27fig08.jpg)\n\
  \n你还会注意到侧边导航窗口中的“概述（Overview）”链接样式略有不同——紫色文字更深——于窗口中的其他链接，这告诉访问者他们正处于哪个页面。这种视觉细节类似于你在星巴克网站上看到的，是一种以不具侵入性的方式为用户提供其在当前导航方案中的位置感。\n\
  \n有许多不同的导航样式以及告知用户他们处于何处以及下一步可能想去哪里的方法。请记住以下事实：研究反复表明，当人们一次面对超过七个选择时，会感到困惑和烦恼，而面对五个或更少的选择时感到最舒适。因此，如果可能，你应该避免并列展示超过五个链接（无论是以列表形式还是图形图标形式），并绝对避免一次性展示超过七个。[Amazon.com](http://Amazon.com)\
  \ 在这里可以被例外，因为它是一个互联网超级商店，用户到达那里时预期的会有很多可以选购的“部门”。但当你需要在导航列表中展示超过七个链接时，请将它们分成多个列表，并为每五个到七个项目设置一个单独的标题，正如你在图\
  \ 27.6 中的[Amazon.com]示例中看到那样。\n\n如果你避免让任何页面距离主页超过两个（或最多三个）链接，也将帮助你的读者在不困惑的情况下导航你的站点。在读者读完附属页面后，你应该始终将他们带回主分类页面（或首页）。换句话说，尝试设计某种扁平链接结构，其中大多数页面的深度不超过一或两个链接。你不希望访问者过度依赖浏览器的“后退”按钮来穿过你的站点。\n\
  \n### 编写可维护的代码\n\n如果你在阅读这本书之前做过任何编程，你已经知道编写可以维护的代码有多么重要了——也就是说，你或其他人以后查看你的代码时，不会被它完全搞糊涂。挑战在于让你的代码尽可能直接地易理解。总会有一天，当你回看自己写的一个页面时，你不知道当时在想什么，或者为什么要那样写这段代码。幸运的是，有一种方法可以对抗这种表面性记忆记忆的问题！\n\
  \n***\n\n**注意**\n\n要在 JavaScript 脚本中包含注释，请在每行注释的开头放置 `//`。（JavaScript 注释不需要结束标记。）在样式表中，以\
  \ `/*` 开始注释并以 `*/` 结束注释。\n\nHTML 的 `<!--` 和 `-->` 标签在脚本或样式表中无法正常工作！\n\n然而，你也可以应该在\
  \ `<script>` 或 `<style>` 标签之后紧跟一个 `<!--` 标签，在匹配的 `</script>` 或 `</style>` 之前放置 `-->`\
  \ 标签。这可以从旧浏览器中隐藏脚本或样式命令，否则这些浏览器会将它们视为普通文本并显示在页面上。\n\n***\n\n### 使用注释记录代码\n\n每当你开发\
  \ HTML 页面或 JavaScript 代码段时，请记住，你或其他人某天几乎肯定需要对其进行修改。简单的文本网页通常易于阅读和修改，但带有图形、表格和其他布局技巧的复杂页面可能非常难破译。\n\
  \n想知道我在说什么，请在网络浏览器中访问几乎任何页面并查看其源代码。使用 Internet Explorer，点击“查看”菜单，然后点击“源代码”。使用 Firefox，点击“查看”菜单，然后点击“页面源代码”。你可能会看到一堆杂乱的代码，作为纯\
  \ HTML 很难破译。这可能是因为标记是由内容管理系统动态生成的。也可能是因为其人工维护者没有关注结构、易读性、代码注释以及其他让代码人类易读的方法。为了维护你自己的页面，我鼓励你对你的\
  \ HTML 标记施加更多的秩序。对于你的 JavaScript 也是如此：正确的缩进是你（以及你未来的开发伙伴）的好帮手。\n\n***\n\n**提示**\n\
  \n注释的一个简便用法是隐藏目前正在建设中的网页部分。与其让文本和图形可见并解释它们正在建设中，你可以在不希望显示的 HTML 周围放置一些仔细安排的起始和结束注释标记，从而完全从视线中隐藏它们。这是一种逐步处理页面部分的极佳方法，并在完成后只向世界展示最终结果。\n\
  \n***\n\n正如你在本书的几个不同章节看到的那样，你可以将写给自己的或合作者的注释封装在 `<!--` 和 `-->` 标签之间。这些注释在用浏览器查看时不会出现在网页上，但任何通过文本编辑器检查\
  \ HTML 代码或通过 Web 浏览器的“查看源代码”（或“查看页面源代码”）功能的人都可以阅读。下面的示例提供了一个小复习，只需向你展示注释是如何编码的：\n\
  \n```html\n<!-- 这幅图片需要每天更新。 -->\n\n<img src=\"headline.jpg\" alt=\"Today's Headline\"\
  \ />\n```\n\n\n\n\n正如这段代码所示，`<img />` 标签之前的注释提供了关于图像如何被使用的线索。当有人阅读这段代码时，他会立即知道这是一个必须每天更新的图像。浏览器会完全忽略注释中的文本。\n\
  \n## 动手尝试：为你的代码编写注释\n\n现在花时间回顾一下你目前为止所创建的所有网页、脚本和样式表，并添加任何你或他人在未来修改它们时可能觉得有用的注释。以下是操作步骤：\n\
  \n1. 在实现某些花哨格式或布局技术的标签之前，添加注释来解释其内容。\n2. 在 `<img />` 标签之前使用注释，简要描述任何功能无法通过 `alt`\
  \ 消息直观体现的重要图表。\n3. 考虑使用注释（单条注释或多条注释）来总结 `<table>` 中的单元格在视觉上是如何组合在一起的。\n4. 如果你使用了十六进制颜色代码（例如\
  \ `<div style=\"color: #8040B0\">`），请插入注释说明该颜色的实际颜色（蓝紫色）。\n5. 在 JavaScript 函数附近放置注释，解释该函数的用途。\n\
  6. 缩进你的注释以帮助它们脱颖而出，并让注释以及 HTML 或 JavaScript 代码都更易读。不要忘记在 HTML 和 JavaScript 内部也使用缩进来提高可读性，我们将在下一节讨论这一点。\n\
  \n### 为了清晰而缩进代码\n\n我有一个坦白。在整本书中，我一直在仔细地向你灌输一种 HTML 代码开发风格，而没有真正显露。现在是时候破底了。你无疑注意到书中所有\
  \ HTML 代码的缩进有一个一致的模式。更具体地说，每个子标签都比父标签向右缩进了两个空格。此外，跨越多行的标签内容在标签内部也进行了缩进。\n\n学习缩进价值的最好方法是看看没有缩进的\
  \ HTML 代码。你知道那句歌是怎么说的——“失去之后，你才懂得自己拥有什么”。不管，这里有一个没有使用任何缩进编写的简单表格：\n\n```html\n<table>\n\
  <tr><td>Cell One</td><td>Cell Two</td></tr>\n<tr><td>Cell Three</td><td>Cell Four</td></tr>\n\
  </table>\n```\n（注：此处为示例性翻译，代码块保持不翻译）\n\n这段代码不仅没有缩进，表格内部的行和列之间也没有划分。现在将这段代码与以下代码对比，后者描述的是同一个表格：\n\
  \n```html\n<table>\n  <tr>\n    <td>Cell One</td>\n    <td>Cell Two</td>\n  </tr>\n\
  \  <tr>\n    <td>Cell Three</td>\n    <td>Cell Four</td>\n  </tr>\n</table>\n```\n\
  这段深度缩进的代码一目易见地展示了如何通过 `<tr>` 和 `<td>` 标签划分行和列。\n\n## 提示\n\n如果你与他人合作，或者计划与他人合作开发网页，你应该考虑大家聚在一起制定一种一致的编码风格。这样大家就能处于同一个频道上（这里玩了一个双关，on\
  \ the same page 意为达成共识）。\n\n在使你的 HTML 代码易于理解和可维护的方面，一致的缩进可能比注释更重要。你不必认同这种特定的缩进策略。如果你倾向于使用三个或四个空格而不是两个，那也可以。如果你想让内容紧凑一点，而不对标签内的内容进行缩进，那也可以。从中得到的要点是：开发一套属于你自己的编码风格，然后无情地坚持下去。\n\
  \n## 思考版本控制\n\n如果你用过 Google Docs，你就遇到过某种形式的版本控制；在 Google Docs 中，Google 会在你打字时自动保存你的工作版本。这与简单的自动保存工作不同（尽管它也做了这一点），因为你可以回溯到过程中的任何版本。你可能在使用流行的博客写作软件（如\
  \ Blogger 或 WordPress）时，甚至在编辑 wiki 时就遇到过这个概念——这两者都允许用户修改其工作而不会覆盖，从而不会永久性地删除之前的工作。\n\
  \n你可能会想：“嗯，这和代码有什么关系呢？你谈论的是文档。”答案很简单：就像你可能想回溯到文章或信件的之前的版本一样，你也可能想回溯到代码的之前的版本。这可能是因为你将一个好想法执行到底，结果代码被证明是不可行的，但你不想完全从头开始——只需回到修改路径上的某一点即可。\n\
  \n版本控制不仅仅是修订历史。当你开始使用版本控制系统来维护你的代码时，你会听到这些术语：\n\n- **Commit（提交/签入）和 checkout（检出）**——当你将一个对象放入代码仓库时，你正在提交该文件；当你检出一个文件时，你正是从仓库（存储了所有当前和历史版本的地方）获取它，并对其进行操作，直到准备好再次提交或签入该文件。\n\
  - **Branch（分支）**——你受版本控制的文件可以在任何一点进行分支或分叉，从而创建两个或多个开发路径。假设你想尝试一些新的显示布局或表单交互，但你不希望现有网站以任何方式显示被修改。你可能从一组主文件开始，但为新网站分叉了这组文件，继续独立地开发它们。如果你继续开发原始的那组文件，那就是在\
  \ `trunk`（主干）上工作。\n- **Change（更改)/diff（差异）**——这是对在版本控制下所做修改的术语。你可能还会听到 diff 用作动词，例如“我\
  \ diff 了这些文件”，用来指代比较两个版本的动作。（UNIX 中有一个名为 `diff` 的命令。）\n\n版本控制的内容远不止修订历史。当你开始使用版本控制系统来维护代码时，只要你能理解仓库（repository）、（本地）工作副本（working\
  \ copy）以及签入和检出的过程，你就为数字对象的版本控制迈出了一大步。\n\n## 使用版本控制系统\n\n虽然有多种版本控制系统可用——有些是免费开源的，有些是专有的——两个最流行的系统是\
  \ Subversion ([`subversion.apache.org`](http://subversion.apache.org)) 和 Git ([`git-scm.com`](http://git-scm.com))。如果你有一个允许安装\
  \ Subversion 的网络托管服务，你可以创建自己的仓库并使用 Subversion 客户端连接。\n\n但日益流行的工具是 Git，它是一种去中心化的版本控制方法，并为想要开始使用但不一定想要或理解额外安装和维护开销的用户提供了大量的工具和托管选项。其中一种托管选项是\
  \ GitHub ([`github.org`](http://github.org))，它允许用户创建账户并免费存储和维护仓库（只要是开源的），同时也想要维护私人代码仓库提供了付费解决方案。\n\
  \n对于任何想要开始版本控制的人，我推荐 Git 和 GitHub，因为它们相对易用且提供了免费的跨平台工具。GitHub 帮助网站是一个很好的起点：[`help.github.com/`](http://help.github.com/)。已拥有免费\
  \ GitHub 账户的额外好处是可以使用 Gist ([`gist.github.com`](http://gist.github.com))，这是一种与其他分享代码片段（或整个页面）的方式，而这些片段本身也是\
  \ git 仓库，因此本身具有版本化且可以分叉。GitHub 仓库（包括 Gists）都是开始工作版本控制的极佳方式。\n\n\n\n\n本章为你提供了示例和解释，帮助你将网页组织成一个连贯的、信息丰富、吸引人且易于导航的站点。网络用户在预期设计良好的网站方面已经变得非常精明，如果他们体验到设计糟糕且难以导航的网站，会迅速放弃你的站点。\n\
  \n本章还讨论了通过添加注释和缩进使代码易于维护的重要性。注释不仅在你稍以后重新查看代码时起到提醒作用，而且当其他人继承你的代码时也能起到说明作用。缩进可能看起来像是一个美学问题，但它确实可以帮助你一眼就能快速分析并理解网页的结构。由于你可能很快就需要代码管理工具（为了你自己，或者为了你以及小组中的其他开发者），因此向你介绍了版本控制的几个概念。版本控制让你能够在不丢失稳固的生产级工作的情况下进行创新，并为其他开发者在你的代码库工作提供更多机会。\n\
  \n## Q&A\n\n**Q. 我看到有些页面要求观众在进入主页之前更改浏览器窗口宽度或调整其他设置。他们为什么要这样做？**\n\n**A.** 一个尖刻的回答是，网站创建者根本不在乎他们的用户。永远不要强迫用户以与他们使用浏览器不同的方式操作，特别是千万、千万不要自动调整浏览器大小。这些是最大的易用性大忌之一。当网站要求你更改设置时，是因为网站创建者认为如果他们获得对用户窗口或字体大小的特定控制权，就能提供更好的展示效果。当然，当被要求这样做时，很少有人会去更改设置（他们本就不应该这样做），所以这些网站通常看起来很奇怪或不可读。你最好使用书中学的技巧，让你的站点在任何窗口大小和各种浏览器设置下都具有可读性和吸引力。你的站点组织得越好，对访问者来说可用性就越高。\n\
  \n**Q. 大量的注释和空格会让我的页面在别人查看时加载变慢吗？**\n\n**A.** 与其他更庞大的网页资源（如图像和多媒体）相比，页面中额外少量文本的大小可以忽略不计。此外，较慢的拨号调制器连接在传输文本时通常能很好地压缩文本，因此为了格式化\
  \ HTML 而添加空格通常不会改变传输时间。你必须输入数百个注释单词才会导致页面加载额外增加一秒延迟。请记住，对于许多人现在拥有的宽带连接（电缆、DSL 等），文本传输速度极快。减慢页面速度的是图形，所以请尽可能压缩你的图像，但可以自由地使用文本注释。\n\
  \n## Workshop\n\n工作坊包含测验题和活动，帮助你巩固对所涵盖内容的理解。在查看后面的 `Answers` 部分之前，尝试回答所有问题。\n\n\
  ### Quiz\n\n**1.** 确保你的所有页面形成单一连贯网站的三方法是什么？\n\n**2.** 你的主页应该始终包含哪两种信息？\n\n**3.**\
  \ 你想对网页的未来编辑说：“不要改这张照片，这是我获得永生的唯一机会”，但你不希望查看网页的用户看到这条信息。你该如何做？\n\n### Answers\n\n\
  **1.** 使用一致的背景、颜色、字体和样式。在链接指向的页面顶部重复相同的链接词或图形。在站点的每个页面上重复相同的小标题、按钮或其他元素。\n\n**2.**\
  \ 使用足够的标识信息，让用户能够立即看到站点名称及其内容主题。此外，无论你想向目标受众传达的最重要的信息是什么，都要直接、简洁地陈述它。无论是你的使命宣言还是注册商标的营销口号，都要确保它在这里显而易见。\n\
  \n**3.** 在 `<img />` 标签之前立即放置以下注释：\n\n```html\n<!-- 不要改这张照片。\n\n     这是我获得永生的唯一机会。\
  \ -->\n```\n\n### Exercises\n\n• 拿一支铅笔（那种老式的），将你的网站勾勒成一组带有有箭头的的小矩形。通过在文本处画波浪线、在图像处画涂鸦，勾勒出每个页面外观的大致概述。每个箭头都应该从一个涂鸦图标开始，该图标对应箭头指向页面的导航按钮。即使你拥有最先进的网站管理工具（这些工具通常比创建网站本身还要花精力），通过手绘你的站点也可以让你更直观地掌握你的站点上哪些页面容易访问，以及相邻页面的布局如何协同工作——这一切在你投入时间编写实际的\
  \ HTML 来连接页面之前就能完成。信不信由，当我第一次设计网站时，仍然是这样勾勒的。有时铅笔和纸是无法替代的！\n\n• 打开组成你当前网站的 HTML 文件，检查它们所有的注释和代码缩进。是否存在某些代码需要向未来任何可能查看它的人解释？如果是，请添加说明性注释。你是否很难判断代码的层次结构？是否很难看到标题和章节？如果是，请缩进你的\
  \ HTML，使结构与层次相匹配，从而让你能够快速跳转到需要编辑的章节。\n\n## 第 28 章 帮助人们找到你的网页\n\n* * *\n\n本章你将学到：\n\
  \n• 如何宣传你的网站\n• 如何在主要的搜索网站列出你的页面\n• 如何为搜索引擎优化你的站点\n\n* * *\n\n你的网页最终的用性取决于它的可访问性——如果没有人能找到你的页面，你在创建实用架构、提供有趣内容和正确编写代码上所付出的努力将化为乌有。你将在本章发现的额外\
  \ HTML 标签不会给你的网页带来任何视觉变化，但它们极其重要，因为它们将帮助你的受众更容易找到你的网页。\n\n对于大多数网站创建者来说，这可能是书中最简单但也最重要的一章。你将学习如何向页面添加元素，以及如何构建你的站点架构，以增加当人们搜索与你的主题或公司相关的词汇时，搜索引擎返回你站点链接的可能性；这被称为搜索引擎优化（SEO）。\n\
  \n与你可能从那些向你推销 SEO 服务的公司听到的相反，没有任何神奇的秘密可以保证你处于每个搜索结果列表的最顶端。然而，有一套免费的最佳实践是可以自己完成的，以确保你的站点尽可能容易找到。\n\
  \n### 宣传你的网站\n\n推测你希望你的网站能吸引别人的注意力，否则你根本不会费心创建它。然而，如果你只是将页面放置在本地网络或公司内网上，或者你仅在可移动存储介质上分发你的站点，帮助用户找到你的页面可能不是大问题。但如果你将你网站的内容添加到搜索引擎索引的数十亿其他内容页面中，将目标受众带来你的站点确实是一个巨大的挑战。\n\
  \n为了解决这个问题，你需要基本上了解大多数人如何决定查看哪些页面。人们意识到你的网站的基本有三种方式：\n\n\n\n\n\n-   有人告诉他们这件事并给了他们地址；他们直接在网络浏览器中输入该地址。\n\
  -   他们通过其他网站的链接访问你的网站，例如 Digg 或 Reddit 这样的聚合和推荐服务，或者通过 Facebook、Twitter 或 Google+\
  \ 等社交网络网站上的链接或提到访问你的网站。\n-   他们在驱动 `Google`、`Bing` 或 `Yahoo!` 等搜索引擎的数据库中发现了你的网站索引。\n\
  \n只要花一点时间和精力就可以增加你网站的流量。要增加通过口碑了解你的人数，嗯，就用好你的嘴——以及你所使用的所有其他通信渠道。如果你有现有的联系人数据库或邮件列表，请向这些人宣布你的网站。将网站地址加入你的名片或公司宣传册中。如果你有资金，就去电视和电电广告播放你的互联网地址。简而言之，做营销该做的事。老式的口碑营销即使在互联网上仍然是最有效的——我们只是在线上拥有的工具越来越多了。\n\
  \n增加其他网站指向你网站的入站链接也相当简单——尽管并不意味着这不需要大量工作。如果针对你的主题有在线或纸质的专业目录，请务必列入其中。参与社交网络，包括为你的服务或业务实施\
  \ Facebook 粉丝页（如果适用）。创建一个 Twitter 账户来发布新闻并与客户联系——再次，如果这适用于你的在线形象的话。进入客户可能出现的空间，例如评论你特定感兴趣主题的博客，并参与这些社区。这并不是说你应该找到一个关于你主题或服务的论坛，并向其用户发送你网站链接的垃圾信息。作为你所在领域的专家，提供建议和推荐并附带你自己的网站\
  \ URL。关于这一点，在本章中我没什么可以帮你的，除了出去去执行。\n\n***\n\n### Note\n\n一个非常受欢迎、高流量且受尊敬的网站（由于其准确性和附加价值）提供了社交网络空间的互动技巧，特别是针对商业用户，是\
  \ Mashable：[`www.mashable.com/`](http://www.mashable.com/)。\n\n***\n\n我能帮你提供的主要帮助是确保你的内容被搜索引擎正确地收集和索引。可以合理假设，如果你的内容不在\
  \ `Google` 的数据库中，你就有麻烦了。\n\n搜索引擎基本上是巨大的数据库，尽可能地索引互联网上的所有内容——包括视频和其他富媒体。它们使用自动化处理来搜索网站，使用称为\
  \ `robots` 或 `spiders` 的程序来搜索页面内容并构建数据库。内容被索引后，搜索应用程序本身会使用非常复杂的页面排名技术，在用户输入搜索词时决定哪些内容首先显示在第一、第二、第三等等位。\n\
  \n当搜索引擎处理用户查询时，它会寻找包含用户正在寻找的关键词和短语的内容。但并不是简单的匹配，例如“如果此页面包含此短语，则将其作为结果返回”，因为内容的排名是根据关键词和短语的频率、上下文，以及其他网站提供其信誉的链接数量来评判的。本章将教你几种方法，根据你提供的内容和语境，确保你的内容以适当的方式出现在搜索引擎中。\n\
  \n***\n\n### 在列出你的页面之前\n\n等一下！在你急冲冲地去提交列出请求之前，请读完本章的剩余部分。否则，你将面临非常严重的问题，而且你已经错过了解决它的最佳机会。\n\
  \n为了让你明白我的意思，请想象这样一个场景：你发布了一个销售自动蟑蟑拍器的页面。我是一个有蟑子问题的互联网用户，而且对杀虫剂过敏。我打开笔记本电脑，拍掉键盘上的蟑子，登录我最喜欢的搜索网站，输入\
  \ `cockroach` 作为搜索词。搜索引擎迅速向我展示了 10,400,000 个网页中包含 `cockroach` 一词的前 10 个列表。你已经提交了列出请求，所以你知道你的页面就在该列表的某个地方。\n\
  \n我提到过我很钱吗？我提到过两只蟑子在我的脚上交配吗？你甚至在我所在的地区提供当日送。你想让你的页面排在列表的第 3 位还是第 8,542 位？好，现在你明白问题了。仅仅列在搜索引擎中是不够的——你需要努力提高排名。\n\
  \n***\n\n### 在主要搜索引擎站点列出你的页面\n\n如果你想让用户找到你的页面，你必须向每个主要的搜索引擎站点提交请求以索引你的页面。虽然搜索引擎会自动索引网页内容，但这是确保你的网站在他们的站点上存在的最佳方式。这些网站中的每一个都有一个表单供你填写\
  \ URL 地址、网站的简要描述，在某些情况下，还有一个与你的列出相关的类别或关键词列表。这些表单很容易填写；你可以在一小时内轻松完成所有表单，并留有时间在你可能发现的一两个专业目录中列出自己。（如何找到这些专业目录？通过主要的搜索引擎站点，当然了！）\n\
  \n-   **Google**——访问 [`www.google.com/addurl/`](http://www.google.com/addurl/)，输入你的网站地址和简要描述，然后输入页面显示的弯曲验证文本，称为\
  \ `CAPTCHA`（或用于区分计算机和人类的完全自动公共灵测试）。然后点击 Add URL 按钮将你的网站添加到 `Google`。\n-   **Yahoo!\
  \ Search**——访问 [`siteexplorer.search.yahoo.com/submit`](http://siteexplorer.search.yahoo.com/submit)，点击\
  \ Submit a Website or Webpage，输入你的网站地址，然后点击 Submit URL 按钮。\n-   **Bing**——访问 [`www.bing.com/docs/submit.aspx`](http://www.bing.com/docs/submit.aspx)，输入验证文本，输入你的网站地址，然后点击\
  \ Submit URL 按钮。\n-   **AllTheWeb**——AllTheWeb 搜索结果由 `Yahoo! Search` 提供，所以只需像之前解释的那样，将你的网站提交给\
  \ `Yahoo! Search` 即可。\n-   **AltaVista**——AltaVista 搜索结果由 `Yahoo! Search` 提供，所以只需像之前解释的那样，将你的网站提交给\
  \ `Yahoo! Search` 即可。\n\n***\n\n### Tip\n\n有些网站提供一个表单可以自动提交到所有主要的搜索引擎以及几个小型搜索引擎。这些网站——例如\
  \ [`www.scrubtheweb.com/`](http://www.scrubtheweb.com/)、[`www.submitexpress.com/`](http://www.submitexpress.com/)\
  \ 和 [`www.hypersubmit.com/`](http://www.hypersubmit.com/)——是试图向你销售优质服务的网站示例，在许多其他目录中列出并索引你。根据你的目标受众，这些服务可能可能没有价值，但我强烈建议你直接访问右侧列出的主要搜索引擎站点并使用它们的表单提交你的列出请求。这样你就可以确保准确地回答问题（每个站点的问题略有不同），并且你会确切知道你的网站列表在每个搜索引擎中将如何显示。\n\
  \n***\n\n\n\n\n\n# 为搜索引擎提供提示\n\n事实：你绝对无法做任何事情来保证你的网站会出现在任何主流搜索引擎对特定单词或短语的搜索结果前 10\
  \ 名（除非从搜索引擎网站购买广告位除外）。毕竟，如果真有这种保证，为什么其他想在列表上排名第一的人不能也这样做呢？你能做的是避免排在列表最后，并为自己争取一个与其他人一样好的夺名机会；这被称为\
  \ SEO，或搜索引擎优化，通过优化页面的内容和结构，使搜索引擎有利于你的页面而非其他页面。\n\n每个搜索引擎使用不同的方法来确定哪些页面可能最相关，并因此将其排序在搜索结果列表的最顶部。不过，你不需要过于纠结这些差异，因为它们都使用了某些基本准则的组合。以下列表包含了任何搜索引擎在尝试评估哪些页面最匹配一个或多个关键词时所考虑的所有因素：\n\
  \n- 关键词是否出现在页面的 `<title>` 标签中？\n- 关键词是否出现在页面的前几行？\n- 关键词是否出现在页面的 `<meta />` 标签中？\n\
  - 关键词是否出现在页面的 `<h1>` 标题中？\n- 关键词是否出现在页面的图像文件名和图像的 `alt` 文本中？\n- 网站内有多少其他页面链接到该页面？\n\
  - 其他网站中有多少个页面链接到该页面？\n- 用户有多少次从之前的搜索列表中选择此页面？\n\n## 注意事项\n\n某些过度热情的网页作者会在页面上重复几十次甚至上百次同一个单词，有时使用小字号或颜色，以便在用户搜索该词时，让搜索引擎能将该页面置于顶端。这种做法被称为搜索引擎垃圾邮件（search\
  \ engine spamming）。不要尝试这种事情——所有主流搜索引擎都了解这种做法，并立即从数据库中删除任何因可疑模式重复相同单词或词组而触发垃圾检测器的页面。在内容的自然过程中，在页面上出现几次重要的搜索词仍然是可以的（而且非常有益的）。但是，请确保你在正常的句子或短语中使用这些词汇——这样垃圾邮件警察就不会打扰你。\n\
  \n## 警告\n\n显然，你提高排名所能做的最重要的事情是考虑你的目标受众最可能输入的关键词。我建议你不要关注像“food”（食物）这样常见的单词搜索；它们生成的列表通常非常长，尝试让它排在第一就像买彩票一样。相反，关注最可能指示与你的主题相关的非常用词以及双或三词组合（例如，而不是仅仅是\
  \ food）。确保这些术语和短语在你的页面上出现几次，并确保将最重要的词放在 `<title>` 标签以及第一个标题或介绍段落中。\n\n在上面列出的所有搜索引擎评估标准中，`<meta\
  \ />` 标签的使用可能是最不受理解的。有些人对 `<meta />` 标签推崇备至，仿佛使用它们就能瞬间让你移动到每个搜索列表的顶部。另一些人则认为 `<meta\
  \ />` 标签无效且无用。这两种极端观点都不是正确的。`<meta />` 标签是一个通用标签，你可以将其放在任何文档的 `<head>` 部分，以指定关于页面但不属于\
  \ `<body>` 文本的某些信息。大多数主流搜索引擎查看 `<meta />` 标签来获取关于你页面的简短描述以及用于识别页面内容的某些关键词。例如，你的自动蟑螂拍扁器可能包含以下两个标签：\n\
  \n```html\n<meta name=\"description\" content=\"Order the Squish cockroach flattener.\"\
  \ />\n<meta name=\"keywords\" content=\"cockroach,roaches,kill,squish,supersquish\"\
  \ />\n```\n\n始终将 `<meta />` 标签放在 `<head>`、`<title>` 和 `</title>` 标签之后，闭合的 `</head>`\
  \ 标签之前。根据 XHTML 标准，`<title>` 必须是每个文档 `<head>` 部分的第一个标签。此示例中的第一个标签确保搜索引擎对页面有一个准确的描述，以便在搜索结果列表中展示。第二个\
  \ `<meta />` 标签会在搜索查询中包含你指定的任何关键词时，略微提高页面在列表中的排名。你应该在任何希望被搜索引擎索引的页面中包含带有 `name=\"\
  description\"` 和 `name=\"keywords\"` 属性的 `<meta />` 标签。这样做可能对你在搜索列表中的排名没有显著影响，而且并不是所有的搜索引擎都会寻找\
  \ `<meta />` 标签，但它只有帮助。\n\n## 提示\n\n撇开之前的蟑螂例子，搜索引擎专家建议，`<meta />` 标签中页面描述的理想长度在\
  \ 100 到 200 个字符之间。对于关键词，建议长度在 200 到 400 个字符之间。专家还建议不要在关键词之间浪费空格，这在蟑螂例子中显而易见。最后，不要在关键词的多个短语中疯狂重复相同的关键词——某些搜索引擎会因为你尝试过度而惩罚你。\n\
  \n为了给你提供一个如何提高搜索引擎结果的具体示例，请考虑列表 28.1 所示所示页面。此页面应该很容易找到，因为它处理特定的主题，并包含了一些不常用的技术术语，对该主题感兴趣的用户很可能会搜索这些术语。然而，你可以做几件事来增加此页面出现在搜索引擎搜索结果列表高处的几率。\n\
  \n## 提示\n\n在极少数情况下，如果你不想让某个页面包含在搜索引擎数据库中，可以在该页面的 `<head>` 部分放置以下 `<meta />` 标签：\n\
  \n```html\n<meta name=\"robots\" content=\"noindex,noindex\" />\n```\n\n这会导致某些搜索机器人忽略该页面。为了更稳健地防止窥探的机器人眼睛，请让管理你\
  \ Web 服务器的人将你的页面地址包含在服务器的 `robots.txt`文件中。（她知道这意味着什么以及如何操作；如果不知道，你可以参考 [`www.robotstxt.org/`](http://www.robotstxt.org/)\
  \ 上的方便信息。）所有主流搜索蜘蛛都将确保忽略你的页面。这可能适用于那些你不希望通过公共搜索轻松获取的内部内部页面。\n\n## 列表 28.1 一个在互联网搜索中可见度较低的页面\n\
  \n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"\
  -//W3C//DTD XHTML1.0//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\">\n<html\
  \ xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>Fractal\
  \ Central</title>\n</head>\n<<body>\n  <div style=\"text-align:center\">\n    <img\
  \ src=\"fractalaccent.gif\" alt=\"a fractal\" />\n  </div>>\n  <div style=\"width:133px;\
