  \ SEO 公司承诺为你提供特定的结果，就不要付钱让他们执行 SEO 任务。如果某公司承诺你的网站将成为 Google 搜索结果的首页，请立即逃命并带上你的支票簿——没有人能保证这一点，因为搜索算法包含太多变量，排名第一的结果在特定的一周内可能会改变多次。这并不是说所有的\
  \ SEO 公司都是骗子。有些执行 SEO 任务的正规网站内容和架构顾问，会被与那些发送未经许可邮件的垃圾邮件群发者混为一谈，例如这个：\n\n“亲爱的 google.com，我访问了你们的网站，注意到你们没有在大多数主要的搜索引擎和目录列表中……”\n\
  \n这封邮件邮件被 Google 自己的网站站长指南用作示例，并附带了注释：“对于关于搜索引擎的未经许可的邮件，要保持与对‘夜间减肥药’或‘请求帮助从被黜独裁者那里转移资金’同样的怀疑态度。”是的，真的有人给\
  \ Google 发了一封关于如何在 Google 提高其搜索排名的垃圾邮件……要获取更多来自 Google 的良好建议，请访问 [`www.google.com/webmasters/`](http://www.google.com/webmasters/)。\n\
  \n以下是你可以采取的一些额外免费操作，以针对搜索引擎优化你的内容：\n\n- 使用准确的页面标题。你的标题应该很短，但要具有描述性且唯一。不要尝试在标题中填充关键词。\n\
  - 创建人类友好的 URL，例如包含用户可以轻松记住的单词。相比于像 [`www.mycompany.com?c=p&id=4&id=49f8sd7345fea`](http://www.mycompany.com?c=p&id=4&id=49f8sd7345fea）这样的地址，像\
  \ [http://www.mycompany.com/products/super_widget.html](http://www.mycompany.com/products/super_widget.html）这样的\
  \ URL 更容易记忆——搜索引擎更容易以相关的方式对其索引。\n- 创建反映你目录结构的 URL。这假设你已经有一个目录结构，而你确实应该有一个。\n- 尽可能使用文本而非图形元素来进行导航。\n\
  - 如果你的内容深达几层，请使用面包屑导航，以便用户能够找到返回首页的路。面包屑导航还为搜索引擎提供了更多可索引的词。例如，如果你正在查看食品相关网站中“南方烹饪（Southern\
  \ Cooking）”分类下的饼干食谱，该页面的面包屑导航可能像所示：\n\n首页 > 南方烹饪 > 食谱 > 饼干\n\n- 在页面内容中，恰当地使用标题标签（`<h1>`,\
  \ `<h2>`, `<h3>`）。\n\n除了为用户提供丰富实用的内容外，你还应该遵循这些提示来提高你的网站在页面排名中的凸显性。\n\n## 总结\n\n\
  本章涵盖了一些极其重要的领域，探索了如何向搜索引擎（如 Google、Bing 和 Yahoo！）提供提示，以便用户更轻松地找到你的页面。你还看到一个示例，展示了一个完全合理的网页在*重新制作*以更符合搜索引擎友好性后的\
  \ HTML 代码。最后，你学习了更多优化你网站整体索引的技巧。\n\n表 28.1 列出了本章涵盖的标签和属性。\n\n表 28.1 第 28 章 中涵盖的\
  \ HTML 标签和属性\n\n![image](img/28tab01.jpg)\n\n## 问答\n\n**Q. 我的网站有很多页面。我需要为每个搜索站的每个页面都填写单独的表单吗？**\n\
  \n**A.** 不需要。如果你只需提交首页（假设它链接到所有其他页面），搜索爬虫就会爬取页面上的所有链接（以及被链接页面上的所有链接，以此此类推），直到它们索引了你网站上的所有页面。\n\
  \n**Q. 我提交了被搜索引擎收录的请求，但当我搜索我的页面时，我的页面从未出现过——即使我输入我公司的独特名称也没有出现。我该怎么办？**\n\n**A.**\
  \ 大多数主流搜索引擎提供一个可以填写的表单，可以立即检查特定地址是否包含在它们的数据库中。如果你发现没有被包含，可以提交另一个请求表单。有时在你提交请求后，爬虫需要几天甚至几周时间才能索引你的页面。\n\
  \n**Q. 当我在 `<meta />` 标签中放入关键词时，我需要包含所有可能的拼写和大小写变体吗？**\n\n**A.** 不要担心大小写；几乎所有的搜索都是全小写输入的。请将任何明显的变体或常见的拼写错误作为单独关键词包含。尽管概念简单，但在操作\
  \ `<meta />` 标签方面，有比本章所涵盖的更高级的策略。访问 [`en.wikipedia.org/wiki/Meta_element`](http://en.wikipedia.org/wiki/Meta_element)\
  \ 获取有关此标签各种属性及如何使用的良好信息。\n\n**Q. 我听过可以使用 `<meta />` 标签让页面每隔几秒或几分钟自动重新加载。这是真的吗？**\n\
  \n**A.** 是的，但除非你的 Web 服务器上设置了某种程序或脚本为页面提供新信息，否则这样做没有意义。如果是那样的话，你很有可能通过那种方式进行刷新。\n\
