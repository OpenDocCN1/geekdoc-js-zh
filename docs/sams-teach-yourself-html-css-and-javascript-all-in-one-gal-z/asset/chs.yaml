- "# Sams 自学 HTML, CSS 和 JavaScript 全案 (Gal Zentner 图书之)\n\n\n\n![](img/0672332035.jpg)\n\
  \n![cover-image](img/0672332035.jpg)\n\n\n\n![image](img/pub.jpg)\n\n800 East 96th\
  \ Street, Indianapolis, Indiana, 46240 USA\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n```\n\n***\n\n**注意**\n\n在现阶段，你理解字符编码之类的概念并不是特别重要。重要的是，要在页面中包含适当的样板代码（boilerplate\
  \ code），以确保它们符合最新的 Web 标准。在编写此内容时，XHTML 1.1 是一项 Web 标准。HTML5 目前还不是 Web 标准，但如果你正在创建一个\
  \ HTML5 文档，HTML 文件开头的这些行将不是必须的。\n\n***\n\nXML 版本设置为 `1.0`，这是非常标准的，字符编码类型（`UTF-8`）也是如此。\n\
  \n列表 2.1 中的第二和第三行代码看起来更复杂：\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n```\n\n同样，只要你记得在页面开头包含这段代码，这段代码的具体细节并不十分重要。这段代码将文档标识为\
  \ XHTML 1.1，从而允许 Web 浏览器确保代码符合 XHTML 1.1 的所有要求。\n\n大多数 HTML 标签由部分组成：`opening tag`（起始标签），指示一段文本的开始；以及\
  \ `closing tag`（结束标签），指示该段文本的结束。结束标签以 `<` 符号紧随其后的 `/`（正斜杠）开头。\n\n***\n\n**注意**\n\
  \n创建 Web 页面并不严格要求包含 XML/XHTML 样板代码。你可以删除示例中的起始代码，让页面从 `<html>` 标签开始，它在 Web 浏览器中仍然可以正常打开。包含额外的代码是为了确保你的页面符合当前的\
  \ Web 标准。此外，额外的代码允许你验证 Web 页面的准确性，你将在本章稍后学习如何操作。\n\n***\n\n另一种类型的标签是 `empty tag`（空标签），它的独特之处在于它不包含成对的起始标签和结束标签。相反，空标签由单个标签组成，它以\
  \ `<` 开头，并在 `>` 符号之前以 `/` 结尾。\n\n以下是对这三个标签的简要总结，以确保你理解它们各自扮演的角色：\n\n• `opening tag`（起始标签）是指示\
  \ HTML 命令开始的 HTML 标签；受命令影响的文本出现在起始标签之后。起始标签始终以 `<` 开头以 `>` 结尾，例如 `<html>`。\n\n•\
  \ `closing tag`（结束标签）是指示 HTML 命令结束的 HTML 标签；受命令影响的文本出现在结束标签之前。结束标签始终以 `</` 开头并以\
  \ `>` 结尾，例如 `</html>`。\n\n• `empty tag`（空标签）是发布 HTML 命令但不在此页面中包含任何文本的 HTML 标签。空标签始终以\
  \ `<` 开头并以 `/>` 结尾，例如 `<br />` 和 `<img />`。\n\n例如，列表 2.1 中的 `<body>` 标签告诉 Web 浏览器页面实际正文开始的地方，而\
  \ `</body>` 指明结束的地方。`<body>` 和 `</body>` 标签之间的所有内容将出现在 Web 浏览器窗口的主显示区域，如图 2.1 所示。\n\
  \n***\n\n**注意**\n\n你可能已在列表 2.1 中注意到与 `<html>` 标签关联的一些额外代码。这段代码由两个属性（`xmlns` 和 `xml:lang`）组成，用于指定与标签相关的附加信息。这两个属性是所有\
  \ XHTML Web 页面的标准要求；前者定义 XML 命名空间，而后者定义内容的语言。在本书中，定义了一个标准的命名空间，并使用了英语。如果你正在用其他语言编写，请将\
  \ `\"en\"`（代表英语）替换为与相关的语言标识符。\n\n***\n\n浏览器窗口的最顶端（参考图 2.1）显示标题文本，即位于 `<title>` 和\
  \ `</title>` 之间的任何文本。标题文本也用于在浏览器的书签或收藏菜单中标识页面，取决于你使用哪种浏览器。为页面提供标题是重要的，以便页面访问者能够正确地将其书签以便以后参考。\n\
  \n你将在创建的每个 HTML 页面中使用 `<body>` 和 `<title>` 标签对，因为每个 Web 页面都需要标题和正文。你还会使用 `<html>`\
  \ 和 `<head>` 标签对，这是列表 2.1 中显示的另外两个标签。在文档的最开头放置 `<html>` 仅表示该文档是一个 Web 页面。结尾则是 `</html>`。\n\
  \n***\n\n**提示**\n\n你可能会发现，创建一个基础页面（称为*骨架*或*模板*），只包含起始和结束的 `<html>`、`<title>` 和 `<body>`\
  \ 标签，可以节省重复输入的麻烦。\n\n***\n\n## 使用段落和换行组织页面\n\n当 Web 浏览器显示 HTML 页面时，它会忽略换行符或单词之间的空格。例如，图\
  \ 2.2 中所示诗歌的顶部版本，所有单词之间都只有一个空格，尽管在列表 2.2 中的输入方式并不是那样。这是因为 HTML 中的额外空白会被缩减为一个空格。此外，当文本到达浏览器窗口边缘时，它会自动换行，无论原始文件中的换行在哪里。\n\
  \n**图 2.2** 当列表 2.2 中的 HTML 被作为 Web 页面查看时，换行和段落只出现在有 `<br />` 和 `<p>` 标签的地方。\n\n\
  ![image](img/02fig2.jpg)\n\n列表 2.2 包含段落和换行的 HTML\n\n***\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>The Advertising Agency Song</title>\n \
  \ </head>\n  <body>\n    <p>\n      When your client's hopping mad,\n      put his\
  \ picture in the ad.\n      If he still should prove refractory,\n      add a picture\
  \ of his factory.\n    </p>\n    <hr />\n  </body>\n</html>\n```\n\n\n\n\n当你的客户气得发狂时，<br\
  \ />\n把他的照片放在广告里。\n</p>\n\n<p>\n如果他仍然固执己见，<br />\n加上他工厂的照片。\n</p>\n</</body>\n</html>\n\
  \n如果你想控制换行和段落的实际出现位置，就必须使用 HTML 标签。当文本被包含在 `<p></p>` 容器标签内时，结束标签后将认为有一个换行。在随后的章节中，你将学习使用\
  \ CSS 控制换行的高度。`<br />` 标签强制在段落内进行换行。与你目前为止看到的其他标签不同，`<br />` 不需要闭合标签 `</br>`——这是之前讨论过的空元素标签之一。虽然\
  \ HTML 4 并不要求在空标签中包含 `/`，但 XHTML 要求包含且未来的标准也是如此，因此对你来说，遵循最新标准并创建代码正确的网页至关重要。始终编写空标签，并让它们以\
  \ `/>` 结尾。\n\n### 注意\n\n你可能会遇到很多包含 `<br>` 而不是 `<br />` 的网页内容。或者你可能会看到其他不包含闭合标签 `</p>`\
  \ 的内容。只需记住，互联网上流传着许多过时的网页内容，仅仅因为看到它们在使用，并不意味着它们是正确的。遵循书中教授的标准，可以避免你未来很多工作和沮丧。养成整洁的\
  \ HTML 编码习惯是成为成功网页设计师的非常重要的一部分。\n\n列表 2.2 和 图 2.2 中的诗展示了如何使用 `<br />` 和 `<p>` 标签分隔广告公司歌曲的行和节。你可能还注意到了列表中的\
  \ `<hr />` 标签，它会在页面上显示一条水平线（参见图 2.2）。使用 `<hr />` 标签插入水平线也会导致换行，即使你没有同时包含 `<br />`\
  \ 标签。与 `<br />` 一样，`<hr />` 水水平标签是一个空元素，因此永远不需要闭合标签 `</hr>`。\n\n### 学一学：在 HTML 中格式化文本\n\
  \n取一段文本，尝试将其格式化为适当的 HTML。\n\n1. 在文本开头添加 `<html><head><title>我的标题</title></head><body>`（使用你自己的页面标题代替\
  \ `My Title`）。同时在页面顶部包含处理满足 XHTML 要求的样板代码。\n2. 在文本的最末尾添加 `</body></html>`。\n3. 在每个段落的开头添加\
  \ `<p>` 标签，在每个段落的结尾添加 `</p>` 标签。\n4. 在任何你需要单倍行距换的地方使用 `<br />` 标签。\n5. 使用 `<hr />`\
  \ 绘制分隔主要文本部分的水平线，或任何你希望在页面上看到一条线的地方。\n6. 将文件保存为 `mypage.html`（使用你自己的文件名代替 `mypage`）。\n\
  7. 在浏览器中打开该文件查看你的网页内容。（如果你有网络托管账户，请通过 FTP 将文件发送到那里。）\n8. 如果某些地方看起来不对，回到文本编辑器进行修正并再次保存文件（如果适用，将其发送到你的网络托管账户）。然后你需要点击浏览器中的“重载/刷新”查看你所做的更改。\n\
  \n### 注意\n\n如果你正在使用文字处理器创建网页，请确保将 HTML 文件保存为纯文本或 ASCII 格式。\n\n## 使用标题组织你的内容\n\n\
  当你在浏览互联网上的网页时，你会发现许多页面顶部都有一个标题，看起来比正文其他更大、更粗。列表 2.3 是一个简单网页的示例代码和文本，其中包含了一个标题与普通段落文本对比的示例。`<h1>`\
  \ 和 `</h1>` 标签之间的任何文本都将作为大标题显示。此外，`<h2>` 和 `<h3>` 生成逐渐变小的标题，依此类推，一直到 `<h6>`。\n\n\
  ### 列表 2.3 标题标签\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>我的小部件</title>\n  </head>\n  <body>\n    <h1>我的小部件</h1>\n    <p>我的小部件是世界上最好的。继续阅读以了解更多关于我小部件的信息。</p>\n\
  \    <h2>小部件功能</h2>\n    <p>如果我有任何可以讨论的功能，我敢打赌我会在这里写。</p>\n    <h3>定价</h3>\n   \
  \ <p>在这里，我会谈论我小部件的定价。</p>\n    <h3>对比</h3>\n    <p>在这里，我会讨论我的小部件与竞争对手的小部件相比如何。</p>\n\
  \  </body>\n</</html>\n```\n\n### 注意\n\n到此时，你可能已经注意到，互联网上的许多网页在顶部都有一个标题，它看起来比其他文本更大、更粗。列表\
  \ 2.3 是一个简单网页的示例代码和文本，包含了一个标题与普通段落文本对比的示例。`<h1>` 和 `</h1>` 标签之间的任何文本都将作为大标题显示。此外`<h2>`\
  \ 和 `<h3>` 生成逐渐变小的标题，依此类推，一直到 `<h6>`。\n\n正如你从图 2.3 中所看到的，使用了 `<br />` 和 `<p>` 标签来分隔广告公司歌曲的行和节。你可能还注意到了列表中的\
  \ `<hr />` 标签，它会在页面上显示一条水平线（参见图 2.2）。使用 `<hr />` 标签插入水平线也会导致换行，即使你没有同时包含 `<br />`\
  \ 标签。与 `<br />` 一样，`<hr />` 标签是一个空元素，因此永远不需要闭合标签 `</hr>`。\n\n此时你可能已经注意到，HTML 代码经常通过作者缩进来揭示部分之间的关系。这种缩进完全是自愿的——你完全可以将所有标签挤在一起而不加空格或换行，效果依然良好。\n\
  \n正如你在图 2.3 中所看到的，标题的使用可以再简单不过了。在这个示例中，“My Widgets”使用 `<h1>` 标签显著地显示。要创建最大的标题（1\
  \ 级标题），只需在你想要作为标题的文本开头放置 `<h1>` 标签，并在结尾放置 `</h1>` 标签。要创建一个稍小的标题（2 级标题）——用于小于标题的信息——使用\
  \ `<h2>` 和 `</h2>` 标签包裹你的文本。对于比 2 级标题更小级别的内容，使用 `<h3>` 和 `</h3>` 标签包裹你的文本。\n\n**图\
  \ 2.3** 三级标题的使用显示了页面的内容层级结构。\n\n![image](img/02fig03.jpg)\n\n然而，请记住你的标题应该遵循内容的层级结构：只使用一个一级标题，在一级标题之后使用一个（或多个）二级标题，在二级标题之后直接使用三级标题，并依此类推。不要掉入为了让内容某种特定方式而分配标题的陷阱。相反，请确保你正确地对内容进行分类（作为主标题、二级标题等），同时使用显示样式使文本在浏览器中以特定方式渲染。\n\
  \n\n\n\n记住 `title`（标题）和 `heading`（章节标题）之间的区别很重要。在日常英语中，这两个词通常可以通用，但当你谈论 HTML 时，`<title>`\
  \ 为整个页面提供一个标识名称，该名称不会显示在页面上；它只显示在浏览器窗口的标题栏上。相反，标题标签（heading）使页面上的某些文本以视觉强调的方式显示。每个页面只能有一个\
  \ `<title>`，且它必须出现在 `<head>` 和 `</head>` 标签内，而你可以根据心意以任何顺序设置任意数量的 `<h1>`、`<h2>`\
  \ 和 `<h3>` 章节标题。然而，正如我之前提到的，你应该使用标题标签来对内容层级进行严密控制；不要将标题标签用作实现特定视觉的手段，因为那是 CSS 应该做的事情。\n\
  \n你将在本书的第二部分和第三部分中学习如何完全控制网页上文本的外观。除了对字体的大小、族类和颜色进行精确控制外，标题是为重要文本吸引额外关注的最简单、最流行的方法。\n\
  \n**注意**\n\n不要忘记，放在网页 `<head>` 中的任何内容都不会为了在页面上显示，而页面 `<body>` 中的所有内容都是为了查看。\n\n\
  ## 验证你的网页内容\n\n在第一章中，我讨论了测试页面的方法；测试页面的非常重要的方法之一是对它们进行 `validate`（验证）。可以这样：设计并绘制一套精美的房屋图纸是一回事，但建筑师将其盖章为适用于施工的安全结构则是另一回事。验证你的网页是一个类似的过程；但在情况下，建筑师是一个应用程序——而不是人。\n\
  \n简之，验证是使用特殊的应用程序对页面进行测试，该程序搜索错误并确保你的页面遵循严格的 XHTML 标准。验证非常简单。事实上，负责开发网页标准的机构——世界维网联盟（W3C）提供了一个你可以使用的在线验证工具。要验证页面，请访问此\
  \ URL：`http://validator.w3.org/`。图 2.4 显示了 W3C 标记验证服务。\n\n**图 2.4** W3C 标记验证服务允许你验证\
  \ HTML (XHTML) 文档，以确保其代码编写准确。\n\n![image](img/02fig04.jpg)\n\n## 窥视其他设计者的页面\n\n\
  考虑到许多流行网页中呈现的视觉有时甚至是听觉特效，你可能意识到本章描述的简单页面只是 HTML 冰山一角。现在你已经掌握了基础知识，你可能会惊讶地发现，仅仅通过查看互联网上他人的页面，就能学到很多内容。你可以通过在任何浏览器中右键点击并选择\
  \ `View Source`（查看源代码）来查看任何页面的 HTML。\n\n如果你还没有看出某些 HTML 标签的作用，或者不知道具体如何使用它们，请不要担心。你将在接下来的章节中发现所有这些事情。然而，现在偷看一眼可以让你看到你已经熟悉的标签是如何运作的，并让你体验一下很快就能用网页做的事情。\n\
  \n如果你已经在网上发布了页面，可以使用 `Validate by URI`（通过 URI 验证）标签。使用 `Validate by File Upload`（通过文件上传）标签可以验证存储在本地计算机文件系统的文件。`Validate\
  \ by Direct Input`（通过直接输入）标签允许你从文本编辑器粘贴文件。。一切顺利，你的页面将获得一份通过报告（参见图 2.5）。\n\n**图 2.5**\
  \ 如果页面通过了 W3C 标记验证服务，你就知道它已经就绪。\n\n![image](img/02fig05.jpg)\n\n如果 W3C 标记验证服务在你的网页中遇到错误，它将提供具体的细节（包括错误代码的行号）。这是寻找问题并消除页面中\
  \ Bug 代码的绝佳方法。验证不仅可以告诉你你的页面是否构建正确，还能帮助你在发布页面供世界看到之前发现并修复问题。\n\n**提示**\n\n某些网页开发工具包含了内置验证功能，你可以用来替代\
  \ W3C 标记验证服务。一些示例包括浏览器扩展，如 Firebug (`http://getfirebug.com/`) 和 HTML Validator (`http://users.skynet.be/mgueury/mozilla/`)，但许多其他程序也提供类似的功能；请检查你的用户文档。\n\
  \n关于 HTML、XML、XHTML 和 HTML5 的内幕\n\n在 早期，HTML 非常棒，因为它允许科学家以高效且相对结构化的方式在互联网上共享信息。直到后来，图形网页浏览器被创建，HTML\
  \ 开始用于编写科学论文以外的代码。HTML 迅速从一种研究人员使用的整洁的小标记语言演变为一种在线发布语言。在确定 HTML 可以为了图形化浏览而装饰后，网页浏览器的创建者们疯狂了，向该语言中添加了许多巧妙的功能。尽管这些新功能最初很酷，但它们损害了\
  \ HTML 的原始设计，并在网页显示方式上引入了不一致性；新功能仅在某一个浏览器上有效，而如果你恰好运行了错误的浏览器，你就倒霉了。HTML 开始变得像一桩糟糕的房屋装修工程——一项由许多承包商完成且没有妥善规划的任务。事实证明，在此期间创建的某些特定浏览器功能现在已被采纳为标准，而另一些则被完全抛弃。\n\
  \n`XML` 是一种用于创建特定语言（如 HTML）的通用语言。这听起来可能奇怪，但它意味着 XML 提供了一套基础结构和规则，任何标记语言都遵循这些规则。使用\
  \ XML，你可以创建一个独特的标记语言来描述几乎任何类型的信息，包括网页。知道 XML 是一种创建其他标记语言的语言，你可以使用 XML 创建你自己版本的 HTML。例如，你可以创建一个名为\
  \ BCCML（瓶盖收藏标记语言）的标记语言，用它来创建和管理你的稀有瓶盖收藏。\n\n\n\n\n\n你可能在想瓶盖与 Web 毫无关系，那么为什么要提到它们呢？原因是\
  \ XML 并不完全关于网页。实际上，XML 的范畴比 Web 更广，它可以被用于表示任何类型计算机上的任何类型信息。如果你能想象出所有信息在全球范围内于计算机、手机、手持电脑、电视和收音机之间穿梭，你就能理解为什么\
  \ XML 的应用范围比仅仅清理网页要广泛得多。然而，XML 的早期应用之一是为 Web 恢复某些秩序，这就是为什么 XML 与学习 HTML 有关。\n\n\
  如果 XML 比 HTML 更好地描述数据，这是否意味着 XML 将取代 HTML 成为 Web 的首选标记语言？不是。XML 并不是 HTML 的替代品；它甚至不是\
  \ HTML 的竞争对手。XML 对 HTML 的影响与清理 HTML 有关。HTML 是一种相对无结构的语言，受益于 XML 的规则。这两种技术的自然融合使得\
  \ HTML 遵循了 XML 的规则和结构。为了实现这种融合，制定了一个遵循更严格的 XML 规则的新版本 HTML。这种新的符合 XML 标准的 HTML 版本被称为\
  \ XHTML。对你来说的是，你在整本书中实际上都在学习 XHTML，因为它只是一个更干净的 HTML 版本。\n\n你可能听过 HTML5，它被推崇为下一个\
  \ Web 标准。它将会是，但现在尚未。当它真正成为 Web 标准时，它不会让 XHTML 变得毫无用——HTML5 并不是 XHTML 的替代品，而是 HTML\
  \ 4 的重大修订。换句话说，XHTML 和 HTML5 可以在 Web 上共存，目前支持 XHTML 的网页浏览器也将（有一天）支持 HTML5。\n\n本书的目标是引导你学习网页出版的基础知识，并将\
  \ XHTML 和 CSS 作为这些页面的核心语言。然而，只要可能，我都会标注出 HTML5 中不存在的语言元素，以防你想要设计更具可持续性的内容。如果你实地理解了网页出版以及\
  \ CSS 如何与页整体标记语言（无论是 XHTML 还是 HTML5）工作，那么当你决定从 XHTML 迁移到 HTML5 时，你将处于非常有利的位置。\n\n\
  ## 总结\n\n本章介绍了网页以及它们如何运作的基本知识，包括 HTML 和 XHTML 之间的历史和区别。你学习了编码的 HTML 命令包含在文本文件中，并且手动输入\
  \ HTML 文本比使用图形化编辑器为你创建 HTML 命令要好——尤其是当你学习 HTML 的时候。\n\n你接触了最基础、最重要的 HTML 标签。通过向任何纯文本文档添加这些编码命令，你可以快速地将其转换为一个真正的网页。你学习了创建网页的第一步是在开头和结尾放置几个强制性的\
  \ HTML 标签，包括页面的标题。然后你标记段落和行的结束处，如果需要，还可以添加水平规则和标题。表 2.1 总结了本章介绍的所有标签。\n\n表 2.1 第\
  \ 2 章 涵盖的 HTML 标签\n\n![image](img/02tab01.jpg)\n\n最后，你学习了 XML 和 XHTML，它们与 HTML 的关系，以及相对于你在这里学习的内容\
  \ HTML5 意味着什么。\n\n## 问答\n\n**Q. 我创建了一个网页，当我用 浏览器打开文件时，我看到了包括 HTML 标签在的所有文本。有时我会在页面顶部看到奇怪的乱码字符！我做错了什么？**\n\
  \n**A.** 你没有将文件保存为纯文本。尝试重新保存文件，小心将其保存为“纯文本”（Text Only）或“ASCII 文本”。如果你无法完全确定如何让你的文字处理器做到这一点，不要压力。只需在记事本或\
  \ TextEdit 中输入你的 HTML 文件即可，一切都应该运行良好。（另外，始终确保你的网页文件名以 `.html` 或 `.htm` 结尾。）\n\n\
  **Q. 我在互联网上看到过网页开头没有 `<html>` 标签。你说页面必须以 `<html>` 开始。这是怎么回事？**\n\n**A.** 如果你忘记包含\
  \ `<html>` 标签，许多网页浏览器会原谅你并仍然正确显示页面。然而，包含它是一个非常好的主意，因为某些软件确实需要它来识别页面为有效的 HTML。此外，你希望你的页面是真正的\
  \ XHTML 页面，以便符合最新的 Web 标准。\n\n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**1.** 每个 HTML 页面都需要哪四个标签？\n\n**2.** 你会使用哪些 HTML 标签和文本来生成以下网页内容：\n\n\
  • 一个带有 `We are Proud to Present` 字样的小标题\n\n• 一条横跨页面的水平规则\n\n• 一个带有 `Orbit` 这一个单词的大标题\n\
  \n• 一个带有 `The Geometric Juggler` 字样的中型标题\n\n• 另一个水平规则\n\n**3.** 你会使用什么代码来创建一个标题为\
  \ `Foo Bar` 的完整 HTML 网页，顶部有一个显示为 `Happy Hour at the Foo Bar` 的标题，随后是普通字体的单词 `Come\
  \ down!`？\n\n## 答案\n\n**1.** `<<html>>`, `<head>`, `<title>`, 和 `<body>`。\n\n**2.**\
  \ 你的代码看起来像这样：\n\n```html\n<h3>We are Proud to Present</h3>\n<hr />\n<h1>Orbit</h1>\n\
  <h2>The Geometric Juggler</h2>\n<hr />\n```\n\n**3.** 你的代码看起来像这样：\n\n```html\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Foo Bar</title>\n  </head>\n  <body>\n\
  \    <h1>Happy Hour at the Foo Bar</h1>\n    <p>Come down!</p>\n  </body>\n</</html>\n\
  ```\n\n## 练习\n\n• 即使你读此书的主要目标是为你的业务创建网页内容，你可能也想创建一个个人网页来练习。写几段文字向世界介绍你自己，并使用你在本章中学的\
  \ HTML 标签将它们转换为网页。\n\n• 在整本书中，你将跟随代码示例并制作你自己的页面。现在花一点时间设置一个基础文档模板，包含 XML 声明、文档类型声明和核心\
  \ HTML 文档结构的标签。这样，当你需要时就可以随时复制和粘贴这些信息。\n\n\n\n\n\n样式表背后的概念非常简单：你创建一个样式表文档，其中指定字体、颜色、间距和其他特征，这些特征为网站建立了独特的视觉外观。然后，你将每个具有该外观的页面链接到该样式表，而不是在每个独立的文档中重复指定所有这些样式。因此，当你决定更改官方企业字体或颜色方案时，你只需要修改样式表中的一或两条记录，就可以同时修改所有的网页，而无需在所有的静态\
  \ Web 文件中进行。所以，`style sheet`（样式表）是格式指令的组合，用于同时控制多个 HTML 页面的显示。\n\n样式表允许你设置大量的格式特征，包括精确的字体控制、字间距和行间距，以及页边距和页边框等。样式表还允许使用熟悉的单位（如英寸、毫米、磅（points）和派卡（picas））来指定尺寸和其他测量值。你还可以使用样式表将图形和文本精确地放置在页面的任何位置，无论是通过特定坐标，还是相对于页面上的其他项目。\n\
  \n***\n\n## 注意事项\n\n如果你有三个或更多共享（或应该共享）相似格式和字体的网页，你可能想在阅读本章时为它们创建一个样式表。即使你选择不创建一个完整的样式表，你会发现直接在网页内对单个\
  \ HTML 元素应用样式也是很有用的。\n\n***\n\n简而言之，样式表为 Web 带来了复杂的显示水平。而且它们在这一点上——请原谅我的这个比喻——非常有格调。\n\
  \n## CSS 如何工作\n\n样式表背后的技术被称为 CSS，全称 **Cascading Style Sheets**（级联样式表）。CSS 是一种定义样式构造结构（如字体、颜色和定位）的语言，用于描述网页上信息的格式化和显示方式。CSS\
  \ 样式可以直接存储在 HTML 网页中，也可以存储在单独的样式表中。无论哪种方式，样式表都包含将样式应用于给定类型元素的样式规则。当外部使用时，样式表规则被放置在扩展名为\
  \ `.css` 的外部样式表文档中。\n\n`style rule`（样式规则）是一种可以应用于网页上元素的格式指令，例如文本段落或链接。样式规则由一个或多个\
  \ `style properties`（样式属性）及其关联的值组成。`internal style sheet`（内部样式表）直接放置在网页内，而 `external\
  \ style sheet`（外部样式表）存在于单独文档中，并通过特殊标签链接到网页——稍后将详细介绍该标签。\n\nCSS 名称中的 `cascading`（级联）部分是指样式表规则应用于\
  \ HTML 文档中元素的方式。具体来说，CSS 样式表中的样式形成了一个层级结构，其中具体的样式会覆盖更通用的样式。CSS 的职责是根据这个层级结构确定样式规则的优先级，从而建立级联效应。如果这听起来有点复杂，只需将\
  \ CSS 中的级联机制想象成类似于遗传遗传：普通特征从父母传递给孩子，但更具体的特征则完全是孩子独有的。基础样式规则应用于整个样式表，但可以被更具体的样式规则覆盖。\n\
  \n***\n\n## 注意事项\n\n你可能会注意到我在本章中频繁地使用 `element`（元素）一词（事实上，在书的其余部分也是如此）。`element`\
  \ 仅仅是网页中的一段信息（内容），例如图像、段落或链接。标签用于编码元素，你可以将元素视为一个带有内部描述性信息（属性、文本、图像等）的标签。\n\n***\n\
  \n一个简单的示例应该能弄清这些问题。看下面的代码，看看你是否能看出文本颜色发生了什么：\n\n```html\n<div style=\"color:green\"\
  >\n  This text is green.\n  <p style=\"color:blue\">This text is blue.</p>\n  <p>This\
  \ text is still green.</p>\n</div\n```\n\n在上一个示例中，颜色 `green` 通过 `color` 样式属性应用于\
  \ `<div>` 标签。因此，`<div>` 标签中的文本是绿色的。因为两个 `<p>` 标签都是 `<div>` 标签的子元素，绿色文本样式会级联到它们。然而，第一个\
  \ `<p>` 标签覆盖了颜色样式并将其改为蓝色。最终结果是第一行（未被段落标签包围）是绿色的，第一个正式段落是蓝色的，第二个正式段落保留了级联的绿色。\n\n\
  如果你自己独立理解了这段描述，恭喜你。如果你是在我在文中解释后理解了它，也恭喜你。理解 CSS 并不像理解火箭科学那样，尽管许多人会试图说服你它是那样（这样他们就可以收取高额的咨询费了！）。\n\
  \n与许多 Web 技术一样，CSS 在多年来一直在演进。CSS 的原始版本被称为 `Cascading Style Sheets Level 1` (`CSS1`)，创建于\
  \ 1996 年。稍后的 CSS 2 标准创建于 1998 年，且 CSS 2 仍在使用。所有现代浏览器都支持 CSS 2，你可以安全地使用 CSS 2 样式表而无需过多担心。所以当我在书中提到\
  \ CSS 时，我指的是 CSS 2。\n\n你可以在 `http://www.w3.org/Style/CSS/` 找到完整的 CSS 参考指南。本章的其余部分将解释如何有效利用\
  \ CSS。\n\n## 基础样式表\n\n尽管样式表的力量令人敬畏，但创建它们可以很简单。考虑图 3.1 和图 3.2 所示的网页。这些页面共享一些可以放入公共样式表的视觉属性：它们标题使用大号加粗\
  \ Verdana 字体，正文使用普通尺寸和字重的 Verdana 字体。它们使用一个名为 `logo.gif` 的图像悬浮在内容区域和页面右侧。\n除了子标题外，所有文本均为黑色。它们在左侧和顶部有边距。行与行之间有垂直间距。脚注居中且字号较小。\n\
  \n**图 3.1** 此页面使用样式表微调文本和图像的显示效果。\n\n**图 3.2** 此页面使用了与图 3.1 相同的样式表，从而保持了一致的风格。\n\
  \n列表 3.1 显示了指定这些属性的样式表代码。\n\n列表 3.1 单外部样式表\n\n```css\nbody {\n  font-size: 10pt;\n\
  \  font-family: Verdana, Geneva, Arial, Helvetica, sans-serif;\n  color: black;\n\
  \  line-height: 14pt;\n  padding-left: 5pt;\n  padding-right: 5pt;\n  padding-top:\
  \ 5pt;\n}\n\nh1 {\n  font: 14pt Verdana, Geneva, Arial, Helvetica, sans-serif;\n\
  \  font-weight: bold;\n  line-height: 20pt;\n}\n\np.subheader {\n  font-weight:\
  \ bold;\n  color: #593d87;\n}\n\nimg {\n  padding: 3pt;\n  float: right;\n}\n\n\
  a {\n  text-decoration: none;\n}\n\na:link, a:visited {\n  color: #8094d6;\n}\n\n\
  a:hover, a:active {\n  color: #FF9933;\n}\n\ndiv.footer {\n  font-size: 9pt;\n \
  \ font-style: italic;\n  line-height: 12pt;\n  text-align: center;\n  padding-top:\
  \ 30pt;\n}\n```\n\n\n\n\n\n这初看起来可能代码很多，但如果你仔细观察，你会发现每行代码并没有包含大量信息。将每个单独的样式规则放在一行上是相当标准的做法，这有助于让样式表更具可读性，但这取决于个人喜好；只要你继续使用分号来分隔每个规则，你可以将所有规则写在同一行（稍后会详细介绍这一点）。谈到代码的可读性，也许你对这段样式表代码注意到的第一点是，它看起来完全不像普通的\
  \ HTML 代码。CSS 使用一种属于自己的语言来指定样式表。\n\n当然，列表中包含了一些熟悉的 HTML 标签。正如你猜的那样，样式表中的 `body`、`h1`、`p`、`img`、`a`\
  \ 和 `div` 指向应用该样式表的 HTML 文档中相应的标签。每个标签名称后的大括号包含了标签内所有内容显示方式的规范。\n\n在这种情况下，样式表规定所有\
  \ `body` 文本都应以 10 磅（points）的大小渲染，使用 `Verdana` 字体（如果可能），颜色为黑色，行间距为 14 磅。如果用户没有安装\
  \ `Verdana` 字体，样式表中的字体列表代表了浏览器搜索并使用的字体顺序：`Geneva`，然后是 `Arial`，最后是 `Helvetica`。如果用户没有任何这些字体，浏览器将使用任何可用的默认无衬线字体（sans\
  \ serif）。此外，页面左、右、顶边距应各为 5 磅。\n\n`<h1>` 标签内的任何文本都应以 14 磅的加粗 `Verdana` 字体渲染。接下来，任何仅使用\
  \ `<p>` 标签的段落将继承 `body` 元素指示的所有样式。然而，如果 `<p>` 标签使用了名为 `subheader` 的特殊类，文本将加粗并显示为颜色\
  \ `#593d87`（一种紫色）。\n\n在列表 3.1 中每个测量值后的 `pt` 表示 `points`（磅，每英寸有 72 磅）。如果你愿意，可以使用英寸（`in`）、厘米（`cm`）、像素（`px`）或字母\
  \ m 的宽度（称为 em `em`）来指定任何样式表度量。\n\n***\n\n### 注意\n\n你可以使用样式表指定任意大小的字体，尽管某些显示设备和打印机无法正确处理大于\
  \ 200 磅的字体。\n\n***\n\n你可能注意到列表中的每个样式规则都以分号（`;`）结尾。分号用于将样式规则隔离开。因此，习惯做法是每个样式规则都以分号结尾，这样你可以轻松地在其添加另一个样式规则。\n\
  \n要将此样式表链接到 HTML 文档，请在每个文档的 `<head>` 部分包含一个 `<link />` 标签。列表 3.2 显示了图 3.1 所示页面的\
  \ HTML 代码。它包含了以下 `<link />` 标签：\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"styles.css\" />\n```\n\n这假设样式表以 `styles.css` 的名称存储在与 HTML 文档相同的文件夹中。只要网页浏览器支持样式表——所有现代浏览器都支持样式表——样式表中指定的属性将应用于页面中的内容，而无需任何特殊的\
  \ HTML 格式代码。这证实了 XHTML 的最终目标，即在网页内容与显示该内容所需的特定格式之间提供分离。\n\n列表 3.2 图 3.1 所示页面的 HTML\
  \ 代码\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>About BAWSI</title>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"\
  styles.css\" />\n  </head>\n  <body>\n    <h1>About BAWSI</h1>\n    <p><img src=\"\
  logo.gif\" alt=\"BAWSI logo\"/> 湾区女性体育倡议\n    (BAWSI) 是一家公益性非营利公司，其使命是通过创建项目和合作伙伴关系，\n\
  \    通过这些方式让女性运动员为我们的社区带来健康、希望和完整。它于\n    2005 年由奥运和世界杯足球之星 Brandi Chastain、Julie\
  \ Foudy 以及\n    圣何塞 CyberRays 女子职业足球队前总经理 Marlene Bjornsrud 创立，\n    BAWSI 为我们的社区提供了一条有意义的路径。成立于\
  \ 2005 年……BAWSI 为\n    我们的社区提供了一条有意义的路径。成立于 2005 年……BAWSI 为\n    我们的社区提供了一条有意义的路径。成立于\
  \ 2005 年……BAWSI 为\n    我们的社区提供了一条有意义的路径。成立于 2005 年……BAWSI 为\n    我们的社区提供了一条有意义的路径。成立于\
  \ 2005 年……BAWSI 为\n    我们的社区提供了一条有意义的路径。</p>\n  </body>\n</html>\n```（注：原文 body\
  \ 部分存在大量重复短语，翻译时已保持结构并进行了清理。）\n\n***\n\n###  士\n\n你可以使用样式表指定任意大小的字体，尽管某些显示设备和打印机无法正确处理大于\
  \ 200 磅的字体。\n\n***\n\n### 注意\n\n你可能注意到列表中的每个样式规则都以分号（`;`）结尾。分号用于将样式规则隔离开。因此，习惯做法是每个样式规则都以分号结尾，这样你可以轻松地在其添加另一个样式规则。\n\
  \n要将此样式表链接到 HTML 文档，请在每个文档的 `<head>` 部分包含一个 `<link />` 标签。列表 3.2 显示了图 3.1 所示页面的\
  \ HTML 代码。它包含了以下 `<link />` 标签：\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"styles.css\" />\n```\n\n这假设样式表以 `styles.css` 的名称存储在与 HTML 文档相同的文件夹中。只要网页浏览器支持样式表——所有现代浏览器都支持样式表——样式表中指定的属性将应用于页面中的内容，而无需任何特殊的\
  \ HTML 格式代码。这证实了 XHTML 的最终目标，即在网页内容与显示该内容所需的特定格式之间提供分离。\n\n***\n\n## CSS 样式入门\n\n\
  你现在已经有了 CSS 样式表的基础知识，以及它们如何基于描述网页内容外观的样式规则。本章接下来的几节将对一些重要的样式属性进行快速概述，并让你开始在自己的样式表中使用\
  \ CSS。\n\nCSS 包含了各种样式属性，用于控制字体、颜色、对齐和边距等（仅举例）。CSS 样式属性可以大致分为两大类：\n\n- **布局属性**：影响元素在网页上定位的属性，例如外边距、内边距、对齐等。\n\
  - **格式化属性**：影响网站内元素视觉效果的属性，例如字体类型、大小、颜色等。\n\n### 布局属性\n\n\n\n\n\nCSS 布局属性用于确定内容在网页上的排版方式。最重要的布局属性之一是\
  \ `display` 属性，它描述了元素相对于其他元素的显示方式。`display` 属性有四种可能的值：\n\n• `block`—元素在新的行中显示，就像新段落一样。\n\
  \n***\n\n### 注意\n\n`display` 属性依赖于一个名为 `relative positioning`（相对定位）的概念，这意味着元素相对于页面上其他元素的位置进行定位。CSS\
  \ 还支持 `absolute positioning`（绝对定位），它允许你可以在不依赖于其他元素的情况下，将元素放置在页面上的精确位置。你将在第三部分 中的“使用\
  \ CSS 进行进阶网页设计”**中学习更多关于这两种定位方式的知识。\n\n***\n\n• `list-item`—元素在新的行中显示，并在旁边有一个列表项目标记（项目符号）。\n\
  \n• `inline`—元素元素与当前段落内联显示。\n\n• `none`—元素不显示；它被隐藏了。\n\n如果将网页上的每个元素想象成显示时占据一个矩形区域，就会更容易理解\
  \ `display` 属性——`display` 属性控制这个矩形区域显示的方式。例如，`block` 值会导致元素单独放置在新的一行上，而 `inline`\
  \ 值则将元素放置在紧邻之前的内容旁边。`display` 属性是少数可以应用于大多数样式规则的样式属性之一。以下是设置 `display` 属性的示例：\n\n\
  ```\ndisplay:block;\n```\n\n你通过 `width` 和 `height` 属性来控制元素矩形区域的大小。与许多尺寸相关的 CSS 属性一样，`width`\
  \ 和 `height` 属性的值可以使用几种不同的单位来指定：\n\n• `in`—英寸\n\n• `cm`—厘米\n\n• `mm`—毫米\n\n• `px`—像素\n\
  \n• `pt`—磅\n\n你可以在样式表中随心所欲组合单位，但在一组相似的样式属性中保持一致通常是一个好主意。例如，你可能希望在字体属性上坚持使用磅或在尺寸上使用像素。以下使用像素单位设置元素宽度的示例：\n\
  \n```\nwidth: 200px;\n```\n\n## 格式属性\n\nCSS 格式属性用于控制网页上内容的外观，而不是控制内容的物理位置。最流行的格式属性之一是\
  \ `border` 属性，它用于通过框或部分框在元素周围建立一个可见的边界。以下 `border` 属性提供了描述元素边界的方法：\n\n• `border-width`—边框边的宽度\n\
  \n• `border-color`—边框边的颜色\n\n• `border-style`—边框边的样式\n\n• `border-left`—边界的左侧\n\n\
  • `border-right`—边界的右侧\n\n• `border-top`—边界的顶部\n\n• `border-bottom`—边界的底部\n\n• `border`—边界的简写\n\
  \n`border-width` 属性用于设置边框的宽度。它通常以像素为单位，如下所示：\n\n```\nborder-width:5px;\n```\n\n\
  `border-style` 属性可以设置为以下任何一个值：\n\n• `solid`—实线\n\n• `double`—双线\n\n• `dashed`—虚线（破划线）\n\
  \n• `dotted`—点线\n\n• `groove`—凹槽\n\n• `ridge`—凸脊\n\n• `inset`—内凹\n\n• `outset`—外凸\n\
  \n• `none`—无边框\n\n`border-color` 属性用于设置边框的颜色。它通常以颜色值表示，如下所示：\n\n```\nborder-color:blue;\n\
  ```\n\n`border-style` 属性用于设置边框的样式。它通常以样式值表示，如下所示：\n\n```\nborder-style:dotted;\n\
  ```\n\n\n\n- `color`—使用标准颜色名称或十六进制颜色代码设置文本颜色（更多信息请参阅第 8 章）。\n- `text-decoration`—用于关闭链接下划线——将其设置为\
  \ `none` 即可。也支持 `underline`（下划线）、`italic`（斜体）和 `line-through`（删除线）值。样式的应用将在第 7 章“使用外部和内部链接”中进行详细介绍。\n\
  - `text-align`—将文本对齐到`left`（左对）、`right`（右）或`center`（居中），并可以使用值 `justify` 两端对齐。\n\
  - `padding`—在元素的左、右、顶部和底部添加内边距；这些内边距可以是测量单位或页面宽度的百分比。如果你想独立地为元素的左右两侧添加内边距，请使用 `padding-left`\
  \ 和 `padding-right`。根据需要使用 `padding-top` 或 `padding-bottom` 为元素的顶部或底部添加内边距。你将在第\
  \ 9 章“处理外边距、内边距、对齐和浮动”和第 10 章“[理解 CSS 盒模型和定位]”学习更多关于这些属性的知识。\n\n### 使用样式类\n\n这是一本自学书籍，所以你不需要参加任何课程来学习如何为你的页面添加漂亮的样式，尽管你确实需要学习什么是样式类。每你想让页面上的某些文本看起来与其他文本不同时，你就可以创建一个等同于自定义\
  \ HTML 标签。你定义的每种特殊格式文本都称为 `style class`（样式类）。`style class`是一组自定义的格式规范，可以应用于网页中的任何元素。\n\
  \n在向你展示样式类之前，我需要稍微向后退一步，澄清一些 CSS 术语。首先，CSS `style property`（样式属性）是一个可以赋值的特定样式，例如\
  \ `color` 或 `font-size`。你通过使用选择器（selector）将样式属性及其相应的值与网页上的元素相关联。`selector` 用于识别页面上你应用样式的标签。下面是一个包含在基础样式规则中的选择器、属性和值的示例：\n\
  \n```\nh1 { font: 36pt Courier; }\n```\n\n在这段代码中，`h1` 是选择器，`font` 是样式属性，而 `36pt\
  \ Courier` 是值。选择器很重要，因为这意味着字体设置将应用于网页中所有的 `h1` 元素。但你可能想区分某些 `h1` 元素——那该怎么办？答案就在样式类中。\n\
  \n假设你想在文档中使用两种不同类型的 `<h1>` 标题。你可以通过在样式表中放入以下 CSS 代码来为每种标题创建一个样式类：\n\n```\nh1.silly\
  \ { font: 36pt Comic Sans; }\nh1.serious { font: 36pt Arial; }\n```\n\n注意，这些选择器在\
  \ `h1` 之后包含一个点（`.`），紧跟其后的是一个描述性的类名（class name）。要要在这两个样式类之间进行选择，请使用 `class` 属性，如下所示：\n\
  \n```\n<h1 class=\"silly\">Marvin's Munchies Inc. </h1>\n<p>Text about Marvin's\
  \ Munchies goes here. </p>\n```\n\n或者你可以使用这个：\n\n```\n<h1 class=\"serious\">MMI\
  \ Investor Information</h1>\n<p>Text for business investors goes here.</p>\n```\n\
  \n在 HTML 代码中引用样式类时，只需在元素的 `class` 属性中指定类名即可。在之前的示例中，假设 `Marvin's Munchies Inc.`\
  \ 这几个单词将以 36 点的 Comic Sans 字体显示，前提是你已经在网页顶部包含了指向样式表的 `<link />`，并且假设用户安装了 Comic\
  \ Sans 字体。`MMI Investor Information` 这几个单词将改用 36 点的 Arial 字体显示。你可以在示例 3.2 中看到类的应用的另一个示例；请寻找\
  \ `subheader <p>` 类和 `footer <div>` 类。\n\n如果你想创建一个可以应用于任何元素的样式类，而不仅仅是标题或其他特定标签怎么办？你可以将样式类与\
  \ `<div>` 标签关联，如示例 3.2 所示，它用于将任何文本封装在一个类似于文本段落的块中；`<div>` 标签是另一个非常有用的容器元素。\n\n你基本上可以通过使用\
  \ `div` 选择器后跟一个点（`.`），然后是你自定义的任何样式类名以及你选择的任何样式规范来创建自己的自定义 HTML 标签。该标签可以同时控制任意数量的字体、间距和边距设置。在页面中任何你想应用自定义标签的地方，请使用带有你创建的类名属性的\
  \ `class<div>` 标签。\n\n***\n\n**提示**\n\n你可能注意到，当样式规则中包含多个属性时，编码风格发生了变化。对于只有一个样式的样式规则，你通常会看到属性与规则在同一行，如下：\n\
  \n```\ndiv.silly { font-size: 9pt; }\n```\n\n然而，当样式规则包含多个属性时，将它们每行列一个更容易读得多，如下：\n\
  \n```\ndiv.silly {\n  font-size: 9pt;\n  font-style: italic;\n  text-align: center;\n\
  \  padding-top: 30pt;\n}\n```\n\n***\n\n例如，示例 3.1 中的样式表包含以下样式：\n\n```\ndiv.footer\
  \ {\n  font-size: 9pt;\n  font-style: italic;\n  text-align: center;\n  padding-top:\
  \ 30pt;\n}\n```\n\n该样式类在示例 3.2 中通过以下标签应用：\n\n```\n<div class=\"footer\">\n在开始和结束的\
  \ </div> 标签之间的所有内容将以 9 磅、居中、斜体的文本显示，并且元素顶部有 30 磅内边距。\n</div>\n```\n\n样式类之所以如此宝贵，是因为它们将样式代码从网页中分离，有效地允许你的\
  \ HTML 代码专注于内容，而不是它在屏幕上的显示方式。然后你就可以专注于样式表进行精细调整。这使得你的页面更容易维护。\n\n### 使用样式 ID\n\n\
  当你创建自定义样式类时，你可以根据需要多次使用这些类——它们不是唯一的。然而，在某些情况下，当你希望出于布局或格式（或两者）对唯一元素进行精确控制时，在这些情况下，请使用\
  \ ID 而不是类。\n\n`style ID` 是一组自定义的格式规范，可以应用于网页中的一个元素。你可以在一组页面中使用 ID，但在每个页面中只能使用一次。\n\
  \n例如，假设你所有页面的正文中都有标题。每个页面只有一个标题，但所有页面都包含一个标题的实例。下面是一个带有 ID 标识的选择器，加上一个属性和一个值的示例：\n\
  \n```\np#title {font: 24pt Verdana, Geneva, Arial, sans-serif}\n```\n\n注意，这个选择器在\
  \ `p` 之后包含一个井号（`#`），紧跟其后的是描述性的 ID 名称。在 HTML 代码中引用样式 ID 时，只需在元素的 `id` 属性中指定 ID 名称，如下所示：\n\
  \n```\n<p id=\"title\">Some Title Goes Here</p>\n```\n\n\n\n\n在某些情况下，你可能希望指定仅用于单个网页的样式，在这种情况下，你可以将样式表封装在\
  \ `<style>` 和 `</style>` 标签之间并将其直接包含在 HTML 文档中。以此方式使用的样式表必须出现在 HTML 文档的 `<head>`\
  \ 中。不需要 `<link />` 标签，你无法从任何其他页面引用该样式表（除非你也将其复制到该文档的开头）。正如你在本章前面的部分学到的，这种样式表被称为内部样式表。\n\
  \nListing 3.3 显示了如何指定内部样式表的示例。\n\n### 列表 3.3 带有内部样式表的网页\n\n***\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Some Page</title>\n\
  \    <style type=\"text/css\">\n      div.footer {\n        font-size: 9pt;\n  \
  \      line-height: 12pt;\n        text-align: center;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    ...\n    <div class=\"footer\">\n      Copyright 2009\
  \ Acme Products, Inc.\n    </div>\n  </body>\n</html>\n```\n\n***\n\n***\n\n###\
  \ 注意\n\n`<span>` 和 `</span>` 是 *虚位（dummy）* 标签，它们本身不起任何作用，只是指定一个内容范围以便应用你添加的任何 `style`\
  \ 属性。`<div>` 和 `<span>` 之间的唯一区别是 `<div>` 是一个块级元素，因此会强制换行，而 `<span>` 则不会。因此，你应该使用\
  \ `<span>` 来修改出现在句子或段落中间的任何文本样式，且不产生任何换行。\n\n***\n\n在列表代码中，`div.footer` 样式类是在出现在页面\
  \ `<head>` 中的内部样式表中指定的。该样式类现在可以在页面的 `<body>` 中使用了。事实上，它被用于页面的 `<body>` 中以为版权声明设置样式。\n\
  \n如果你想创建一个在页内多次使用的样式规则，那么内部样式表会非常方便。然而，在某些情况下，你可能需要为某个特定元素应用唯一的样式。这需要内联样式规则，它允许你仅为页面的一小部分（例如单个元素）指定样式。例如，你可以通过\
  \ `style` 属性在 `<p>`、`<div>` 或 `<span>` 标签内创建并应用样式规则。这种样式被称为 *内联样式（inline style）*，因为它直接指定在\
  \ HTML 代码的中间。\n\n以下是示例 `style` 属性的可能样貌：\n\n```html\n<p style=\"color:green\">\n\
  \  这段文字是绿色的，但 <span style=\"color:red\">这段文字是红色的。</span>\n  再次回到绿色，但是...\n</p>\n\
  \n<p>\n  ...现在绿色结束了，我们回到了此页面的默认颜色。\n</p>\n```\n\n***\n\n## 验证你的样式表\n\n正如验证你的 HTML\
  \ 或 XHTML 标记很重要一样，验证你的样式表同样重要。CSS 的特定验证工具可以在 [`jigsaw.w3.org/css-validator/`](http://jigsaw.w3.org/css-validator/)\
  \ 找到。就像第 2 章“理解 HTML 和 XHTML 连接](#ch02.html_ch02)”中讨论的验证工具一样，你可以将工具指向网址、上传文件或向提供的表单字段粘贴内容。最终目标是得到如图\
  \ 3.3 所示的结果：有效！\n\n**图 3.3** W3C CSS 验证器显示列表 3.1 中的样式表内容没有错误。\n\n![image](img/03fig03.jpg)\n\
  \n***\n\n这段代码利用 `<span>` 标签展示了如何在内联样式规则中应用 `color` 样式属性。事实上，此示例中的 `<p>` 标签和 `<span>`\
  \ 标签都使用 `color` 属性作为内联样式。需要重要的是，`color:red` 样式属性覆盖了出现在 `<span>` 和 `</span>` 标签之间的文本的\
  \ `color:green` 样式属性。然后在第二个段落中，没有一个……\n\n## 总结\n\n在本章中，你学习了包含样式的三种主要方法：外部样式表、内部样式表和\
  \ `style` 属性。你可以将级联样式效果视为从外部样式表开始，被内部样式表覆盖，再被内联样式覆盖。\n\n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对材料的理解。在查看随后的“答案”之前，尝试回答所有问题。\n\
  \n## 测验\n\n1. 你将使用什么代码创建一个样式表，以指定 30 磅蓝色 Arial 标题以及所有其他文本为双倍行间距、10 磅蓝色 Times Roman（或浏览器默认字体）？\n\
  2. 如果你将问题 1 创建的样式表保存为 `corporate.css`，你会如何将其应用到名为 `intro.html` 的网页？\n3. 有多少种不同的方法可以确保样式规则应用于你的内容中？\n\
  \n## 答案\n\n1. 你的样式表将包含以下内容：\n\n\n\n\n\n```css\nh1 { font: 30pt blue Arial; }\nbody\
  \ { font: 10pt blue; }\n```\n\n2. 在 `intro.html` 文档的 `<head>` 和 `</head>` 之间插入以下标签：\n\
  \n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"corporate.css\" />\n\
  ```\n\n3. 三种方式：外部、内部和内联。\n\n## 练习\n\n• 使用你在本章之前创建的样式表，为样式表添加一些样式类（classes）。为了看到你的劳动成果，请将这些类应用到你创建的\
  \ HTML 页面中。在 `<h1>` 和 `<p>` 标签中使用类来感受一下。\n\n• 为你的网站开发一个标准的样式表，并将其链接到所有页面中。（对于需要偏离标准的页面，使用内部样式表和/或内联样式）。如果你在公司工作，很可能公司已经为印刷材料制定了字体和样式规范。获取这些规范的副本，并在公司网页中也遵循这些规范。\n\
  \n• 务必探索官方样式表规范 [`www.w3.org/Style/CSS/`](http://www.w3.org/Style/CSS/)，并尝试一些本章未涵盖的较冷门的样式属性。\n\
  \n# 第 4 章 理解 JavaScript\n\n在本章你将学习：\n\n• 什么是 Web 脚本以及它的用途\n• 脚本与编程有什么区别（以及相似之处）\n\
  • 什么是 JavaScript 以及它源自何处\n• 如何在网页中包含 JavaScript 命令\n• JavaScript 能为你的网页做什么\n• 脚本的开始与结束\n\
  • JavaScript 语句的格式化\n• 脚本如何显示结果\n• 在 Web 文文中包含脚本\n• 在浏览器中测试脚本\n• 修改脚本\n• 处理脚本中的错误\n\
  • 将脚本移动到单独的文件\n\n万维网（WWW）最初是一种纯文本媒介——第一批浏览器甚至不支持在网页中显示图像。从那时以来，Web 已经取得了巨大的进步，如今的网站除了有用内容外，还包含了丰富的视觉和交互功能：图形、声音、动画和视频。Web\
  \ 脚本语言（如 JavaScript）是增加网页色彩并以新方式与用户交互的最简单方法之一。\n\n本章的第一部分介绍了 Web 脚本概念和 JavaScript\
  \ 语言。随着章节的进行，你将学习如何将 JavaScript 命令直接包含在 HTML 文档中，以及当在浏览器中查看页面时脚本将如何执行。你将处理一个简单的脚本，对其进行编辑并在浏览器中测试，同时学习创建和使用\
  \ JavaScript 脚本涉及的基础任务。\n\n## 学习 Web 脚本基础\n\n在科幻电影（以及许多其他没有借口的电影）世界里，计算机通常被视为听从英语命令。尽管这在不久的未来确实可能，但计算机目前更容易理解如\
  \ `BASIC`、`C` 和 `Java` 等语言。\n\n你已经知道如何使用一种计算机语言：HTML。你使用 HTML 标签来描述你希望如何格式化文档，浏览器会遵循你的命令向用户显示格式化后的文档。但由于\
  \ HTML 是一种简单的文本标记语言，它无法响应用户、做出决策或自动化重复任务。此类交互式任务需要更复杂的语言：编程语言或脚本语言。\n\n尽管许多编程语言是复杂的，但脚本语言通常是简单的。它们具有简洁的语法，可以用最少的命令完成任务，并且容易学习。Web\
  \ 脚本语言允许你将脚本与 HTML 结合，创建交互式网页。\n\n## 脚本与程序\n\n电影或戏剧遵循剧本——一份供演员表演的动作（或台词）列表。Web 脚本为浏览器提供相同类型的指令。JavaScript\
  \ 脚本可以从单行到整个应用程序不等。（无论何种情况，JavaScript 脚本通常运行在浏览器内部。）\n\n> **注意**\n> JavaScript 究竟是脚本语言还是编程语言？这取决于你问谁。在本书中我们将它统称为脚本，但在你读完这本书后，可以尽管在你的简历中加入\
  \ JavaScript 编程。\n\n某些编程语言在执行之前必须编译（或翻译）成机器码。相反，JavaScript 是一种解释型语言：浏览器按照脚本出现的顺序逐行执行每一行。\n\
  \n解释型语言有一个主要优势：编写或更改脚本非常简单。更改 JavaScript 脚本就像更改典型的 HTML 文档一样简单，一旦在浏览器中重新加载文档，更改就会生效。\n\
  \n> **注意**\n> 解释型语言也有其缺点——它们的执行速度不够快，因此不理想于处理复杂工作（如图形）。此外，它们需要解释器（在 JavaScript 的情况下，通常是浏览器）才能工作。\n\
  \n## 介绍 JavaScript\n\nJavaScript 是由 Netscape Communications 公司（Netscape 浏览器的开发商）开发的。JavaScript\
  \ 是第一个被浏览器支持的 Web 脚本语言，并且目前仍然是最受欢迎的语言。\n\n学习 JavaScript 几乎和 HTML 一样简单，并且可以直接包含在\
  \ HTML 文档中。以下是你使用 JavaScript 可以做的几件事：\n\n• 作为网页的一部分、浏览器的状态栏或警报框向用户显示消息\n\n> **注意**\n\
  > 简短历史：JavaScript 最初被称为 LiveScript，于 1995 年首次引入 Netscape Navigator 2.0。它很快被重命名为\
  \ JavaScript，以表示与 Sun 公司的营销关系。\n\n• 验证表单内容并进行计算（例如，订单表可以在你输入数量时自动显示总额）\n• 在鼠标悬停时制作动画或创建图像\n\
  • 检测使用的浏览器或功能，并仅在支持它们的浏览器上执行高级函数\n• 检测插件并在需要插件时通知用户\n• 在无需用户重新加载的情况下修改整个或部分网页\n\
  • 显示或与服务器获取的数据交互\n\n你可以使用 JavaScript 完成所有这些工作，包括整个应用程序。我们将在书中探索 JavaScript 的用途。\n\
  \n## JavaScript 如何融入网页\n\n使用 `<script>` 标签，你可以像 4.1 所示在 Web 文文中添加简短脚本（在本例中仅为一行）。`<script>`\
  \ 标签告诉浏览器开始将文本视为脚本，而结束标签 `</script>` 告诉浏览器返回 HTML 模式。在大多数情况下，你不能在 HTML 文档中使用 JavaScript\
  \ 语句，除非 `<script>` 标签。例外是本章后面介绍的事件处理器。\n\n列表 4.1 带有简单脚本的 HTML 文档\n\n```html\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>美国茄子协会</title>\n  </head>\n  <body>\n \
  \   <h1>美国茄子协会</h1>\n    <p>欢迎访问我们的网站。遗憾的是，该网站仍在建设中。</p>\n    <p>我们最后一次处理该的日期是：\n\
  \      <script type=\"text/javascript\">\n      <!-- 向旧版浏览器隐藏脚本\n      document.write(document.lastModified);\n\
  \      // 停止隐藏脚本 -->\n      </script>\n    </p>\n  </body>\n</html>\n```\n\n\n\n\
  \n\nJavaScript 的 `document.write` 语句（你稍后将学习更多内容）可以将输出作为网页文档的一部分发送。在这种情况下，它会显示文档的修改日期，如图\
  \ 4.1 所示。\n\n**图 4.1** 使用 `document.write` 显示修改日期。\n\n![image](img/04fig01.jpg)\n\
  \n在这个示例中，我们将脚本放置在 HTML 文档的 body 中。实际上，你有四个不同的可能使用脚本的地方：\n\n- **在页面的 body 中**——在这种情况下，当浏览器加载页面时，脚本的输出将作为\
  \ HTML 文档的一部分显示。\n- **在页面的 `<head>` 标签之间的头部**——头部中的脚本无法在 HTML 文档中创建输出，但可以被其他脚本引用。头部通常用于函数——一组可以作为单一单元使用的\
  \ JavaScript 语句。你将在第 14 章“开始 JavaScript 编程](#ch14.html_ch14)”中学习更多关于函数的知识。\n- **在\
  \ HTML 标签内部，例如 `<body>` 或 `<form>`**——这被称为事件处理器，它允许脚本与 HTML 元素进行交互。在事件处理器中使用 JavaScript\
  \ 时，你不需要使用 `<script>` 标签。你将在第 14 章中学习更多关于事件处理器的知识。\n- **在完全独立的文件中**——JavaScript\
  \ 支持使用扩展名为 `.js` 的脚本文件；这些可以通过在 `<script>` 标签中指定文件来包含。\n\n## 使用单独的 JavaScript 文件\n\
  \n当你创建更复杂的脚本时，你会很快发现 HTML 文档变得庞大且混乱。为了避免这种情况，你可以使用一个或多个外部 JavaScript 文件。这些是扩展名为\
  \ `.js` 的文件，其中包含 JavaScript 语句。\n\n所有现代浏览器都支持外部脚本。要使用外部脚本，你可以在 `<script>` 标签中指定其文件名：\n\
  \n```html\n<script type=\"text/javascript\" src=\"filename.js\"></script>\n```\n\
  \n由于你将 JavaScript 语句放在了单独的文件中，因此在起始和结束 `<script>` 标签之间不需要任何内容——事实上，它们之间的任何内容 都会被浏览器忽略。\n\
  \n> **提示**\n外部 JavaScript 文件有一个明显的优势：你可以从两个或多个 HTML 文档链接到同一个 `.js` 文件。由于浏览器将此文件存储在缓存中，这可以缩短网页显示的时间。\n\
  \n你可以使用文本编辑器创建 `.js` 文件。它应该包含一个或多个 JavaScript 命令且**仅包含** JavaScript——不要包含 `<script>`\
  \ 标签、其他 HTML 标签或 HTML 注释。将 `.js` 文件保存在与引用它的 HTML 文档相同的目录中。\n\n## 理解 JavaScript 事件\n\
  \n你使用 JavaScript 可以完成的许多有用功能都涉及与用户交互，这意味着要*响应事件*——例如，点击链接或按钮。你可以在 HTML 标签内定义事件处理器，以告诉浏览器如何响应事件。例如，列表\
  \ 4.2 定义了一个在点击时显示消息的按钮。\n\n列表 4.2 一个简单的事件处理器\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Event Test</title>\n  </head>\n  <body>\n    <h1>Event Test</h1>\n    <button\
  \ type=\"button\"\n            onclick=\"alert('You clicked the button.')\">\n \
  \           Click Me!\n    </button>\n  </body>\n</html>\n```\n\n在本书贯穿始终的各个地方，你将学习更多关于\
  \ JavaScript 的事件模型以及如何创建简单和复杂的事件处理器的。\n\n## 探索 JavaScript 的能力\n\n如果你在浏览网页时花费过时间，你一定见过很多\
  \ JavaScript 运行的示例。以下是 JavaScript 典型应用程序的简要描述，你将在本书的后部分对所有这些内容进行进一步探索。\n\n### 改进导航\n\
  \nJavaScript 最常用的用途之一是网站的导航系统。你可以使用 JavaScript 创建导航工具——例如，用于选择下一页阅读内容的下拉菜单，或者在悬停在导航链接上时弹出的子菜单。\n\
  \n当实现得当时，这种 JavaScript 交互可以使网站变得更易用，同时对不支持 JavaScript 的浏览器仍保持可用性。\n\n### 表单验证\n\n\
  表单验证是 JavaScript 的另一个常见用途。简单的脚本可以读取用户在表单中输入的值，并确保它们符合正确的格式，例如邮政编码或电话号码。这允许用户注意到常见的错误并修复它们，而无需等待\
  \ Web 服务器的响应。\n\n### 特殊效果\n\nJavaScript 最早且最烦人的用途之一是创建吸引注意的特殊特效——例如，在状态栏中滚动消息或闪烁页面背景颜色。幸运的是，这些技术已经过时了，但多亏\
  \ W3C DOM 和最新的浏览器，使用 JavaScript 可以实现一些更令人深刻的效果。\n\n### 远程脚本 (AJAX)\n\n长期以来，JavaScript\
  \ 的最大局限性是无法与服务器通信。现在，由于 JavaScript 的一些高级功能已被大多数浏览器支持，情况已不再如此。你的脚本可以在不加载页面的情况下从服务器获取或发送数据。这些功能统称为\
  \ AJAX（异步 JavaScript 和 XML），或*远程脚本*。你将在第 24 章“AJAX：远程脚本](#ch24.html_ch24)”中学习开发\
  \ AJAX 脚本。\n\n## 使用 JavaScript 显示时间\n\nJavaScript 的一个常见且简单的用途是显示日期和时间。因为 JavaScript\
  \ 在浏览器上运行，它显示的时间将是用户所在时区的时间。但你也可以使用 JavaScript 计算“通用”时间（UTC）。\n\n> **注意**\nUTC 代表协调世界时，它是基于旧\
  \ GMT（格林尼治标准时间）标准的原子时间标准。这是穿过英国伦敦格林尼治的本午线所在处的时间。\n\n作为 JavaScript 的初级介绍，我们现在将创建一个简单的脚本，在网页中显示当前时间和\
  \ UTC 时间，从下一节开始。\n\n## 编写脚本\n\n你的脚本像大多数 JavaScript 程序一样，是从 HTML `<script>` 标签开始的。正如你在本章前面的部分学到的，你使用\
  \ `<script>` 和 `</script>` 标签在 HTML 文档中封装脚本。\n\n> **警告**\n记住在起始和结束 `<script>` 标签之间只包含有效的\
  \ JavaScript 语句。如果浏览器在 `<script>` 标签内发现任何非 JavaScript 语句，它将显示 JavaScript 错误消息。\n\
  \n要开始创建脚本，打开你喜欢的文本编辑器，并按所示输入起始和结束的 `<script>` 标签。\n\n```html\n<script type=\"text/javascript\"\
  ></script>\n```\n\n\n\n\n你的脚本现在需要确定本地时间和 UTC 时间，然后将它们显示在浏览器中。幸运的是，所有困难的部分（例如日期格式之间的转换）都已经内置在\
  \ JavaScript 解释器中了。\n\n## 在变量中存储数据\n\n要开始脚本，你将使用一个 `variable`（变量）来存储当前日期。你将在第 16\
  \ 章 “使用 JavaScript 变量、字符串和数组”中学习更多关于变量的知识。`variable` 是一个可以存储值的容器——数字、文本，或者在本情况下，一个日期。\n\
  \n要开始编写脚本，请在第一个 `<script>` 标签之后添加以下行。请确保在你的版本中使用相同的大小写字母组合，因为 JavaScript 命令和变量名是区分大小写的。\n\
  \n```javascript\nnow = new Date();\n```\n\n此语句创建了一个名为 `now` 的变量，并将当前日期和时间存储其中。此语句以及你将在脚本中使用的其他语句都使用了\
  \ JavaScript 内置的 `Date` 对象，它让你能够方便地处理日期和时间。你将在第 17 章 “使用 JavaScript 函数和对象”中学习更多关于处理日期的知识。\n\
  \n**注意**\n\n注意上一个语句末尾的分号。它告诉浏览器已经到达了一个语句的末尾。分号是可选的，但使用它们可以帮你避免一些常见的错误。为了清晰起见，我们整本书中都会使用分号。\n\
  \n## 计算结果\n\n在内部，JavaScript 将日期存储为自 1970 年 1 月 1 日以来的毫秒数。幸运的是，JavaScript 包含了许多以各种方式转换日期和时间的函数，因此你不需要自己琢想如何将毫秒转换为天、日期和时间。\n\
  \n要继续你的脚本，请在最后的 `</script>` 标签之前添加以下两个语句：\n\n```javascript\nlocaltime = now.toString();\n\
  utctime = now.toGMTString();\n```\n\n**注意**\n\n`localtime` 和 `utctime` 变量存储一段文本，例如\
  \ `January 1, 2001 12:00 PM`。在编程术语中，这段文本被称为 `string`（字符串）。\n\n这些语句创建了两个新变量：`localtime`\
  \ 包含以易读格式格式的当前时间和日期，`utctime` 包含对应的 UTC 等效值。\n\n## 创建输出\n\n你现在有两个变量——`localtime`\
  \ 和 `utctime`——它们包含了我们从脚本中想要的结果。当然，如果我们无法看到这些变量，它们就没太大用处。JavaScript 包含了多种显示信息的方法，最简单的方法之一就是\
  \ `document.write` 语句。\n\n`document.write` 语句显示文本字符串、数字或传递给它的任何内容。由于你的 JavaScript\
  \ 程序将在网页中使用，输出将作为页面的一部分显示。要显示结果，请在最后的 `</script>` 标签之前添加这些语句：\n\n```javascript\n\
  document.write(\"<strong>Local time:</strong> \" + localtime + \"<br/>\");\ndocument.write(\"\
  <strong>UTC time:</strong> \" + utctime);\n```\n\n这些语句告诉浏览器向包含你脚本的网页中添加一些文本。输出将包括一些介绍结果的简短字符串以及\
  \ `localtime` 和 `utctime` 变量的内容。\n\n注意引号内的 HTML 标签，例如 `<strong>`——因为 JavaScript\
  \ 的输出出现在网页中，所以它需要使用 HTML 进行格式化。第一行中的 `<br/>` 标签确保两个时间将分行显示。\n\n**注意**\n\n注意在列表 4.3\
  \ 中文本和变量之间使用的加号 (`+`）。在这种情况下，它告诉浏览器将值合并为一个文本字符串。如果你在两个数字之间使用加号，它们会被相加。\n\n## 将脚本添加到网页中\n\
  \n你现在应该有一个计算结果并显示结果的完整脚本。你的列表应该与列表 4.3 匹配。\n\n**列表 4.3 完整的日期和时间脚本**\n\n```html\n\
  <script type=\"text/javascript\">\n\nnow = new Date();\n\nlocaltime = now.toString();\n\
  \nutctime = now.toGMTString();\n\ndocument.write(\"<strong>Local time:</strong>\
  \ \" + localtime + \"<br/>\");\n\ndocument.write(\"<strong>UTC time:</strong> \"\
  \ + utctime);\n\n</script>\n```\n\n要使用你的脚本，你需要将其添加到 HTML 文档中。如果你使用到目前章节中看到的通用模板，你最终得到的应该类似于列表\
  \ 4.4。\n\n**列表 4.4 HTML 文档中的日期和时间脚本**\n\n```html\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n\n \
  \   <title>Displaying Times and Dates</title>\n  </head>\n  <body>\n\n<script type=\"\
  text/javascript\">\n\nnow = new Date();\n\nlocaltime = now.toString();\n\nutctime\
  \ = now.toGMTString();\n\ndocument.write(\"<strong>Local time:</strong> \" + localtime\
  \ + \"<br/>\");\n\ndocument.write(\"<strong>UTC time:</strong> \" + utctime);\n\n\
  </script>\n\n</body>\n</html>\n```\n\n\n\n\n<body>\n  <h1>当前日期和时间</h1>\n  <script\
  \ type=\"text/javascript\">\n    now = new Date();\n    localtime = now.toString();\n\
  \    utctime = now.toGMTString();\n    document.write(\"<strong>本地时间：</strong>>\
  \ \"\n        + localtime + \"<br/>\");\n    document.write(\"<strong>UTC 时间：</strong>\
  \ \" + utctime);\n    hours = now.getHours();\n    mins = now.getMinutes();\n  \
  \  secs = now.getSeconds();\n    document.write(\"<h1>\");\n    document.write(hours\
  \ + \":\" + mins + \":\" + secs);\n    document.write(\"</h1>\");\n  </script>\n\
  </body>\n\n现在你已经修改了脚本，保存该 HTML 文件并在浏览器中打开修改后的文件。如果你一直运行着浏览器，可以直接使用“刷新”按钮加载新版本的脚本。尝试一下，并验证窗口顶部和新的大时钟显示的是相同的时间。图\
  \ 4.3 显示了结果。\n\n**图 4.3** Firefox 显示了修改后的日期和时间脚本。\n\n![image](img/04fig03.jpg)\n\
  \n## 处理 JavaScript 错误\n\n随着你开发越来越复杂的 JavaScript 应用程序，你会不时遇到错误。JavaScript 错误通常是由拼错误的\
  \ JavaScript 语句引起的。\n\n要查看 JavaScript 错误消息的示例，请修改你在上一节中添加的语句。我们将使用一个常见的错误：遗漏一个括号。将列表\
  \ 4.5 中的最后一个 `document.write` 语句更改为：\n\n```javascript\ndocument.write(\"</h1>\"\
  ;\n```\n\n### 注意\n\n此脚本生成的时间格式化并不完美；午后的小时时间采用 24 小时制，且没有前导零，因此 12:04 会显示为 12:4。请参阅第\
  \ 17 章 获取解决这些问题的方案。\n\n再次保存你的 HTML 文档并加载到浏览器中。根据你使用的浏览器版本，会发生两种情况之一：要么显示错误消息，要么脚本直接无法执行。\n\
  \n如果显示了错误消息，通过添加缺失的括号，你就已经解决了一半问题。如果没有显示错误，你应该配置浏览器显示错误消息，以便你诊断未来的问题：\n\n- 在 Firefox\
  \ 中，你也可以从菜单中选择“工具”、“JavaScript 控制台”。控制台如图 4.4](#ch04.html_ch04fig04）所示，显示了你在本示例中创建的错误消息。\n\
  \n**图 4.4** Firefox 的 JavaScript 控制台显示错误消息。\n\n![image](img/04fig04.jpg)\n\n- 在\
  \ Chrome 中，从“自定义（选项）”菜单中选择“工具”、“JavaScript 控制台”。控制台将显示在浏览器底部。\n\n- 在 Internet Explorer\
  \ 中，选择“工具”、“Internet 选项”。在“高级”卡上，取消勾选“禁用脚本调试”，并勾选“对每个脚本错误显示通知”。（如果禁用了此项，状态栏中的黄色图标仍会通知错误。）\n\
  \n我们在这种情况下得到的错误是 `missing ) after argument list` (Firefox) 或 `Expected ')'` (Internet\
  \ Explorer)，事实证明这正是问题所在。但请注意，错误消息并不总是这么具有启发性。\n\n尽管 Internet Explorer 为每个错误显示错误对话框，但\
  \ Firefox 的 JavaScript 控制台会显示单个错误列表并允许你测试命令。出于这个原因，你可能会发现安装 Firefox 用于调试和测试 JavaScript\
  \ 是很有用的，即使 Internet Explorer 是你的主浏览器。\n\n## 总结\n\n在本章中，你学习了什么是 Web 脚本以及什么是 JavaScript。你还学习了如何将脚本插入\
  \ HTML 文档或引用外部 JavaScript 文件、JavaScript 可以做哪些事情，以及 JavaScript 与其他网络语言的区别。你还编写了一个简单的\
  \ JavaScript 程序并使用网络浏览器对其进行了测试。你发现了如何修改和测试脚本，以及当 JavaScript 程序遇到错误时会发生什么。\n\n在编写此脚本的过程中，你使用了一些\
  \ JavaScript 的基本特性：变量、`document.write` 语句以及处理日期和时间的函数。\n\n现在你已经学习了一些 JavaScript\
  \ 语法，准备好继续学习关于 Web 开发的各种事情，在此之后开始学习使用客户端脚本编写交互式网站。\n\n## 问答\n\n**问：我需要在多个浏览器上测试我的\
  \ JavaScript 吗？**\n\n**答：** 在理想的世界里，你编写的任何遵循 JavaScript 标准的脚本在所有浏览器中运行，在现实世界中，93%\
  \ 的情况下（上下浮）确实如此。但浏览器确实有自己的怪癖，你至少应该在 Internet Explorer 和 Firefox 上测试你的脚本。\n\n**问：如果我计划学习\
  \ PHP 或其他服务器端编程语言，JavaScript 对我还有用吗？**\n\n**答：** 当然。JavaScript 是许多基于 Web 的应用程序（例如表单验证）的理想语言。虽然\
  \ PHP 和其他服务器端语言有其用途，但它们无法直接与客户端的用户进行交互。\n\n**问：当我尝试运行脚本时，浏览器在窗口中显示了实际脚本而不是执行它。我哪里做错了？**\n\
  \n**答：** 这最可能是由三个错误之一引起的。首先，你可能缺少了开头或结尾的 `<script>` 标签。其次，你的文件可能保存为了 .txt 扩展名，导致浏览器将其视为文本文件。重命名为\
  \ .htm 或 .html 以解决问题。第三，确保你的浏览器支持 JavaScript 并且没有在选项中禁用它。\n\n**问：为什么 `<strong>`\
  \ 和 `<br />` 标签允许时间？**\n\n**答：** 因为这个特定的标签位于引号内，它被认为是有效的。你可以使用引号内的 HTML 标签来添加格式。\n\
  \n## 工作坊\n\n工作坊包含测试题和练习，帮助你巩固所学内容。在查看下方的“答案”部分之前，尝试回答所有问题。\n\n## 测验\n\n**1 当用户查看包含\
  \ JavaScript 程序的页面时，哪台机器实际执行脚本？**\n\na. 运行网络浏览器的用户机器\nb. 服务器\nc. 位于 Netscape 公司内部的中央机器\n\
  \n**2 你使用什么软件创建和编辑 JavaScript 程序？**\n\na. 浏览器\nb. 文本编辑器\nc. 铅笔和纸\n\n**3 变量在 JavaScript\
  \ 程序中的作用是什么？**\n\na. 存储数字、日期或其他值\nb. 随机变化\nc. 引起对中学代数的回忆\n\n**4 嵌入 HTML 文件中的 JavaScript\
  \ 脚本末尾应该出现什么？**\n\na. `<script type=\"text/javascript\">` 标签\nb. `</script>` 标签\n\
  c. `END` 语句\n\n## 答案\n\n1. a. JavaScript 程序在网络浏览器上执行。（实际上有一个服务器端的 JavaScript 版本，那是另一个故事了。）\n\
  2. b. 任何文本编辑器都可以创建脚本。你也可以使用文字处理器，只要小心将文档保存为具有 .html 或 .htm 扩展名的文本文件。\n3. a. 变量用于存储数字、日期或其他值。\n\
  4. b. 你的脚本以 `</script>` 标签结束。\n\n## 练习\n\n\n\n\n\n- 给大时钟添加一个毫秒字段。你可以使用 `getMilliseconds`\
  \ 函数，它的工作原理与 `getSeconds` 相同，但返回的是毫秒。\n- 修改脚本以显示两次时间（包括毫秒）。注意在加载页面时，两次显示之间是否经过了时间。\n\
  \n# 第二部分：实用网页设计的构建模块\n\n## 第 5 章：字体字体、文本块和列表\n\n* * *\n\n你将在本章中学习到：\n\n- 如何使用粗体、斜体和特殊文本格式\n\
  - 如何调整字体\n- 如何使用特殊字符\n- 如何在页面上对齐文本\n- 如何使用三种类型的 HTML 列表\n- 如何在列表内嵌套列表\n\n* * *\n\
  \n在 Web 的早期阶段，文本仅以一种字体和一种大小显示。然而，HTML 和 CSS 的结合使得控制文本的外观（字体类型、大小或颜色）以及它在网页上的对齐和显示方式成为可能。在这一章中，你将学习如何更改字体的视觉显示效果——其字体族、字号和粗细——以及如何将粗体、斜体、上标、下标和删除线文本融入到你的页面中。你还将学习如何更改字体类型和字号。在熟练掌握了这些文本方面之后，你将学习文本对齐的基础知识以及一些高级的文本技巧和技巧，例如列表的使用。由于列表非常常见，HTML\
  \ 提供了标签，可以自动缩进文本并在每个列表项目前添加数字、项目符号或其他符号。你将学习如何格式化不同类型的列表，这是你网站中显示内容的多种方式之一。\n\n\
  * * *\n\n### 笔记\n\n在查看其他设计师的网页内容时，你可能会发现某些标记文本的方法与书中教授的方法有所不同。旧的文本格式化方法包括使用 `<b></b>``\
  \ 标签对来指示单词何时应加粗，使用 `<i></i>`` 标签对来指示单词何时应为斜体，以及使用 `<font></font>` 标签对来指定字体族、字号和其他属性。然而，没有必要学习它们，因为它们正在从\
  \ HTML 中淘汰，而且 CSS 比它们强大得多。\n\n* * *\n\n* * *\n\n### 试一试：准备示例文本\n\n如果你有一些可以用来显示不同字体和颜色，并且可以进行缩进、居中或其他处理的示例文本，那么在本章中学习如何对文本进行样式设置将充分发挥价值。使用什么类型的文本并不重要，因为有许多种不同的样式可能性可以尝试，以至于它们永远不会同时出现在同一个网页上（除非你想让访客们抓狂）。利用这个机会感受一下文本层面的变化如何影响你内容的外观。\n\
  \n- 如果你将使用的文本来自文字处理程序或数据库程序，请确保将其保存为纯文本或 ASCII 格式的新文件。然后，你可以在学习本章的过程中添加适当的 HTML\
  \ 标签和样式属性对其进行格式化。\n- 任何文本都可以，但请尝试找到（或输入）一些你想放在网页上的文本。来自公司宣传册或你的简历的文本可能是一个很好的选择。\n\
  - 任何类型的大纲、演示文稿的项目符号、编号步骤、词汇表或来自数据库的文本信息列表都可以作为很好的素材。\n- 在使用本章引入的代码格式化正文之前，请添加你在之前的章节中使用一组\
  \ HTML 骨架 标签（`<html>`、`<head>`、`<title>` 和 `<body>` 标签）。\n\n* * *\n\n### 粗体、斜体和特殊文本格式\n\
  \n在很久打字机时代，我们满足于纯文本显示，并偶尔使用下划线表示强调。今天，**粗体**和**斜体**文本已成为所有纸质通信中的标准配置。自然地，你也可以在网页内容中添加粗体和斜体文本。有一些标签和样式规则使得文本格式化成为可能。\n\
  \n为文本添加粗体和斜体格式的老方法涉及 `<b></b>` 和 `<i></i>` 标签对。对于粗体文本，在文本开头放置 `<b>` 标签，在结尾放置 `</b>`。同样，你可以通过将任何文本封装在\
  \ `<i>` 和 `</i>` 标签之间来使其变为斜体。虽然这种方法在浏览器中仍然仍然有效，并且被 XHTML 支持，但它不像用于文本格式化的 CSS 样式规则那样灵活或强大。\n\
  \n尽管你将在 第三部分 中学习更多关于 CSS 样式规则的内容——“使用 CSS 的高级网页设计”，但提前预告一下是值得稍作铺垫，以便你理解文本格式化的选项。`font-weight`\
  \ 样式规则允许你使用样式规则设置字体的粗细。`font-weight` 的标准设置包括 `normal`、`bold`、`bolder` 和 `lighter`（其中\
  \ `normal` 为默认值）。斜体文本通过 `font-style` 规则控制，可以设置为 `normal`、`italic` 或 `oblique`。如果你想应用多个样式规则，可以将它们一起指定，如下例所示：\n\
  \n```html\n<p style=\"font-weight:bold; font-style:italic\">这段落是粗体加斜体的！</p>\n```\n\
  \n* * *\n\n### 笔记\n\n对于粗体斜体文本，样式规则的替代方案涉及 `<strong>` 和 `<em>``` 标签对。`<strong>` 标签在大多数浏览器中与\
  \ `<b>` 标签的作用相同，而 `<em>` 标签则像 `<i>` 标签一样将文本格式化为斜体。\n\n`<strong>` 和 `<em>` 标签被认为比\
  \ `<b>` 和 `<i>` 好，因为它们意味着文本应该受到强调，而不是规定如何实现这种效果。换句话说，浏览器并不一定将 `<strong>` 解释为粗体，或将\
  \ `<em>` 解释为斜体。这四个标签都是 HTML5 的一部分，尽管它们的使用变得稍微微妙了一些。\n\n* * *\n\n在此示例中，两个样式规则指定在\
  \ `<p>` 标签的 `style` 属性中。使用多个样式规则的关键是它们必须用分号（`;`）隔开。\n\n然而，你并不限于在段落中使用字体样式。下面的代码显示如何在列表中使用斜体文本：\n\
  \n```html\n<ul>\n  <li style=\"font-style:italic\">重要内容</li>\n  <li style=\"font-style:italic\"\
  >关键信息</li>\n  <li style=\"font-style:italic\">高度敏感材料</li>\n  <li>无用的</li>\n</ul>\n\
  ```\n\n你也可以在标题中使用 `font-weight` 样式规则，但更粗的字体对标题没有影响，因为它们默认就是粗的。\n\n虽然使用 CSS 允许你应用更丰富的格式，但还有一些其他\
  \ HTML 标签适用于为文本添加特殊格式，即使你并不需要像 CSS 那样具体。以下是这些标签中的一些。列表 5.1 和图 5.1](#ch05.html_ch05fig01)\
  \ 展示了每个标签的实际效果。\n\n- `<small></small>`——小文本\n- `<big></big>`——大文本；在 HTML5 中不存在，因为文本大小通过\
  \ CSS 控制更好\n- `<sup></sup>`——上标文本\n- `<sub></sub>`——下标文本\n- `<em><em></em>>`` 或\
  \ `<i></i>``>`——强调（斜体）文本\n- `<strong></strong>` 或 `<b></b>``>`——强（粗体）文本\n- `<tt></tt>`——等宽文本（打字机字体），在\
  \ HTML5 中不存在，因为字体外观通过 CSS 控制更好\n- `<pre></pre>`——等宽文本，保留空格和换行\n\n**图 5.1** 这里是列表\
  \ 5.1 中的字符格式看起来的样子。\n\n![image](img/05fig01.jpg)\n\n* * *\n\n注意\n\n\n\n\n曾经有一个 `<u>`\
  \ 标签用于创建带下划线的文本，但现在有几个不再使用它的原因。首先，用户期望下划线文本是链接，因此如果你对不是链接的文本添加下划线，他们可能会感到困惑。其次，`<u>`\
  \ 标签已弃用（deprecated），这意味着它已经从 HTML/XHTML 语言中淘汰，`<strike>` 标签也是如此。这两个标签在网页浏览器中仍然支持，并且可能还会持续很一段时间，但使用\
  \ CSS 是创建下划线和删除线文本的首选方法。在 HTML5 中，被删除的文本可以用 `<strike><strike>` 标签对包围，这将渲染为带有删除线的文本。\n\
  \n* * *\n\n### 列表 5.1 特殊格式标签\n\n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>The Miracle Product</title>\n  </head>\n  <body><body>\n    <p>\n     \
  \ New <sup>Super</sup><strong>Strength</strong> H<sub>2</sub>O\n      <em>plus</em>\
  \ will knock out any stain, <big>big</big> or\n      <small>small</small><br />\
  \ Look for new\n      <sup>Super</sup><b>Strength</b> H<sub>2</sub>O <i>plus</i>\n\
  \      in a stream near you.\n    </p>\n    <p>\n      <tt>NUTRITION INFORMATION</tt>\
  \ (在法律禁止之处无效)\n    </p>\n    <pre>\n```\n(continued code block)\n```text\n     \
  \                 Calories    Grams    USRDA\n                      /Serving   \
  \ of Fat  Moisture\n    Regular          3          4        100%\n    Unleaded\
  \         3          2        100%\n    Organic          2          3        99%\n\
  \    Sugar Free       0          1        110%\n    </pre>\n  </body>\n</html>\n\
  ```\n\n* * *\n\n`<tt>` 标签通常将字体更改为 `Courier New`，这是一种等宽字体（`Monospaced` 意味着所有字母和空格的宽度相同）。然而，网页浏览器允许用户将等宽\
  \ `<tt>` 字体更改为他们选择的字体（查看您浏览器的选项菜单）。对于某些用户来说，等宽字体甚至可能不是等宽的，尽管大多数用户仍然使用浏览器默认显示的标准字体。\n\
  \n`<pre>` 标签导致文本以等宽字体显示，但它还有另一个独特且实用的功能。正如你在第 2 章中学习到的，“理解 HTML 和 XHTML 的连接”，在 HTML\
  \ 文件中多个空格和换行通常会被忽略，但 `<pre>` 会保留精确的空格和换行。例如，如果没有 `<pre>`，图 5.1 结尾的文本将如下所示：\n\n`calories\
  \ grams usrda /serving of fat moisture regular 3 4 100% unleaded 3 2 100% organic\
  \ 2 3 99% sugar free 0 1 110%`\n\n即使你在每行末尾添加 `<br />` 标签，列也无法正确对齐。然而，当你从开始使用 `<pre>`\
  \ 到结束使用 `</pre>` 时，列就能正确对齐，因为精确的空格被保留了——不需要 `<br />` 标签。`<pre>` 标签提供了一种快速方便的方法，用最小的保留任何可能想要传输到网页的等宽文本文件的对齐。\n\
  \nCSS 为你提供了更健壮的方法来对齐文本（实际上是可以对文本进行任何操作），你将在第三部分中学习更多相关内容。\n\n### 调整字体\n\n`<big>`、`<small>`\
  \ 和 `<tt>` 标签让你对页面上文本的大小和外观有一定的基础的控制。然而，有时你可能只是想对文本的大小和外观有更多的控制。在我深入探讨在 XHTML 代码中调整字体的适当方法之前，让我们简要看看在\
  \ CSS 出现之前是如何操作的，因为你在查看其他网站源代码时可能仍然发现这种方法的示例。记住，仅仅因为这些旧方法在使用，并不意味着你应该效效仿。\n\n* *\
  \ *\n\n### 注意\n\n你将在将来学习到更多相关内容。\n\n\n\n\n\n```css\n<style>\n  body {\n    font-family:\
  \ Verdana, sans-serif;\n    font-size: 12px;\n  }\n  h1 {\n    font-family:Georgia,\
  \ serif;\n    font-size:28px;\n    text-align:center;\n  }\n  p.contactinfo {\n\
  \    font-size:14px;\n    text-align:center;\n  }\n  p.categorylabel {\n    font-size:12px;\n\
  \    font-weight:bold;\n    text-transform:uppercase;\n  }\n  div.indented {\n \
  \   margin-left: 25px;\n  }\n</style>\n```\n\n</head>\n\n<body>\n  <h1>Jane Doe</h1>\n\
  \  <p class=\"contactinfo\">1234 Main Street, Sometown,\nCA 93829<br/>\ntel: 555-555-1212,\
  \ e-mail: jane@doe.com</p>\n  <p class=\"categorylabel\">资历总结</p>\n  <ul>\n    <li>技能高超且敬业的专业人士，为您需要的任何领域提供坚实的背景支持。</li>\n\
