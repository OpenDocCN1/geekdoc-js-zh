  \n***\n\n***\n\n### 使用 `Math` 对象\n\n\n\n\n\n`Math` 对象是一个内置的 JavaScript 对象，包含了数学常数和函数。你不需要创建\
  \ `Math` 对象；它会在任何 JavaScript 程序中自动存在。`Math` 对象的属性代表数学常量，而它的方法则是数学函数。\n\n## 四舍五入与截断\n\
  \n`Math` 对象中最实用的三个方法允许你对小数进行向上或向下舍五入：\n\n• `Math.ceil()` 将数字向上舍入到下一个整数。\n• `Math.floor()`\
  \ 将数字向下舍入到下一个整数。\n• `Math.round()` 将数字舍入到最近的整数。\n\n所有这些方法都将要舍入的数字作为唯一的参数。你可能会注意到缺少了一个功能：按小数位数进行舍入（例如金额）。幸运的是，你可以轻松地模拟这种操作。这是一个将数字舍入到两位小数的简单函数：\n\
  \n```javascript\nfunction round(num) {\n    return Math.round(num * 100) / 100;\n\
  }\n```\n\n该函数通过将值乘以 100 来移动小数点，然后将数字舍入到最近的整数。最后，将该值除以 100 以将小数点恢复到原始位置。\n\n## 生成随机数\n\
  \n`Math` 对象最常用的方法之一是 `Math.random()` 方法，它生成一个随机数。该方法不需要任何参数。它返回的是 0 到 1 之间的随机小数。\n\
  \n你通常需要一个 1 到某个值之间的随机数。你可以通过通用的随机数函数来实现。以下是一个生成 1 到你传递的参数之间随机随机数的函数：\n\n```javascript\n\
  function rand(num) {\n    return Math.floor(Math.random() * num) + 1;\n}\n```\n\n\
  该函数将随机数乘以 `num` 参数中指定的值，然后使用 `Math.floor()` 方法将其转换为 1 到该数字之间的整数。\n\n## 其他数学函数\n\n\
  `Math` 对象包含了许多你在此处之外的函数。例如，`Math.sin()` 和 `Math.cos()` 计算正弦和余弦。`Math` 对象还包含了各种数学常数的属性，例如\
  \ `Math.PI`。\n\n## 运用数学函数\n\n`Math.random` 方法生成一个 `0` 到 `1` 之间的随机数。然而，计算机很难生成真正的随机数。（人类也难以这样做——这就是发明骰子的原因。）\n\
  \n如今的计算机在生成随机数方面表现良好，但 JavaScript 的 `Math.random` 函数到底有多好？测试它的方法是生成许多随机数并计算它们所有的平均值。\n\
  \n从理论上讲，平均值应该在 `.5``，即 `0` 和 `1` 之间的中间值。生成的随机值越多，平均值就越接近这个中间地带。\n\n作为使用 `Math` 对象方法的示例，你可以创建一个测试\
  \ JavaScript 随机数函数的脚本。为了做到，你将生成 5,000 个随机数并计算它们的平均值。\n\n这个示例将使用循环，你将在下一章中学习更多内容。但这是一个足够简单的示例，你应该能够跟上。在这种情况下，循环将生成随机数。你会惊讶\
  \ JavaScript 执行此操作的速度有多快。\n\n要开始你的脚本，你需要初始化一个名为 `total` 的变量。该变量将存储所有随机值的运行总和，因此将其初始化为\
  \ `0` 是重要的：\n\n```javascript\ntotal = 0;\n```\n\n接下来，开始一个执行 5,000 次的循环。使用 `for`\
  \ 循环，因为你希望它执行固定次数：\n\n```javascript\nfor (i=1; i<=5000; i++) {\n```\n\n在循环内部，你需要创建一个随机数并将其值加到\
  \ `total`。以下是执行此操作并继续下一次迭代的语句：\n\n```javascript\n    num = Math.random();\n    total\
  \ += num;\n}\n```\n\n* * *\n\n注意\n上述代码中的 `%` 符号是*取模运算符*，它会给你一个数除以另一个数后的余数。在这里它被用于寻找\
  \ 1,000 的倍数。\n\n* * *\n\n根据你计算机的速度，可能需要几秒钟才能生成那 5,000 个随机数。为了确保程序正在运行，脚本会在每生成 1,000\
  \ 个数字后显示状态消息：\n\n```javascript\nif (i % 1000 == 0)\n    document.write(\"Generated\
  \ \" + i + \" numbers...<br/>\");\n```\n\n脚本的最后部分将通过将 `total` 除以 5,000 来计算平均值。你的脚本还可以将平均值舍入到三位小数：\n\
  \n```javascript\naverage = total / 5000;\naverage = Math.round(average * 1000) /\
  \ 1000;\ndocument.write(\"<h2>Average of 5000 numbers: \" + average + \"</h2>\"\
  );\n```\n\n要测试此脚本并查看这些数字有多随机，请将完整的脚本与 HTML 文档和 `<script>` 标签结合。列表 17.7 显示了完整的随机数测试脚本。\n\
  \n列表 17.7 测试 JavaScript 随机数函数的脚本\n\n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Math Example</title>\n  </head>\n  <body>\n    <h1>Math Example</h1>\n\
  \    <p>How random are JavaScript's random numbers?\n    Let's generate 5000 of\
  \ them and find out.</p>\n    <script type=\"text/javascript\">\n    total = 0;\n\
  \    for (i=1; i<=5000; i++) {\n        num = Math.random();\n        total += num;\n\
  \        if (i % 1000 == 0)\n            document.write(\"Generated \" + i + \"\
  \ numbers...<br/>\");\n    }\n    average = total / 5000;\n    average = Math.round(average\
  \ * 1000) / 1000;\n    document.write(\"<h2>Average of 5000 numbers: \" + average\
  \ + \"</h2>\");\n    </script>\n  </body>\n</html>\n```\n\n\n\n\nJavaScript 日期存储为自\
  \ 1970 年 1 月 1 日午夜以来的毫秒数。这个日期被称为 `epoch`（纪元）。早期版本不允许使用 1970 年之前的日期，但现在用负数来表示。\n\n\
  ***\n\n你在第 4 章 的“理解 JavaScript”中通过时间/日期脚本遇到过一个 `Date` 对象的示例。`Date` 对象没有属性。要设置或获取\
  \ `Date` 对象的值，你必须使用下一节中描述的方法。\n\n### 创建 `Date` 对象\n\n你可以使用 `new` 关键字创建一个 `Date`\
  \ 对象。在创建时，你还可以可选地指定要存储在对象中的日期。你可以使用以下任何格式：\n\n```javascript\nbirthday = new Date();\n\
  birthday = new Date(\"November 1, 2010 08:00:00\");\nbirthday = new Date(11,1, 2010);\n\
  birthday = new Date(11,1,2010, 8, 0, 0);\n```\n\n你可以根据想要设置的值选择这些格式中的任何一种。如果你不使用任何参数（如第一个示例所示），当前日期将存储在对象中。然后你可以使用下一节中描述的\
  \ `set` 方法设置值。\n\n### 设置 `Date` 值\n\n多种 `set` 方法允许你将 `Date` 对象的组件设置为特定值：\n\n- `setDate()`\
  \ 设置月份中的几。\n- `setMonth()` 设置月份。JavaScript 的月份从 0 到 11，从 1 月（`0`）开始。\n- `setFullYear()`\
  \ 设置年份。\n- `setTime()` 通过指定自 1970 年 1 月 1 日以来的毫秒数来设置时间（以及日期）。\n- `setHours()`、`setMinutes()`\
  \ 和 `setSeconds()` 设置时间。\n\n例如，以下语句将名为 `holiday` 的 `Date` 对象的年份设置为 2010：\n\n```javascript\n\
  holiday.setFullYear(2010);\n```\n\n### 读取 `Date` 值\n\n你可以使用 `get` 方法从 `Date` 对象中获取值。这是获取这些值的唯一方法，因为它们无法以属性的形式直接访问。以下是日期的可用\
  \ `get` 方法：\n\n- `getDate()` 获取月份中的几。\n- `getMonth()` 获取月份。\n- `getFullYear()` 获取年份。\n\
  - `getTime()` 获取自 1970 年 1 月 1 日以来的毫秒数作为时间（以及日期）。\n- `getHours()`、`getMinutes()`、`getSeconds()`\
  \ 和 `getMilliseconds()` 获取时间的组件。\n\n***\n\n## 注意事项\n\n除了需要四位年份的 `setFullYear` 和\
  \ `getFullYear` 之外，JavaScript 还包含了使用两位年份值的的 `setYear` 和 `getYear` 方法。你应该始终使用四位数的版本，以避免\
  \ **2000 年问题（Y2K issues）**。\n\n***\n\n### 处理时区\n\n最后，有几个函数可以帮助你的 `Date` 对象与本地时间值和时区配合：\n\
  \n- `getTimeZoneOffset()` 函数提供本地时区相对于 UTC（协调世界时，基于旧的格林威治标准时间标准）的偏移量。在这种情况下，`local`\
  \ 指浏览器的位置。（当然，只有当用户准确设置了系统时钟时，此方法才有效。）\n- `toUTCString()` 函数使用 UTC 将 `date` 对象的时间值转换为文本。该方法在\
  \ JavaScript 1.2 中引入，用以取代 `toGMTString` 方法，后者仍然可用，但应避免使用。\n- `toLocalString()` 函数使用本地时间将\
  \ `date` 对象的时间值转换为文本。\n\n除了这些基本函数外，JavaScript 1.2 及更高版本还包含了之前描述的几个函数的 UTC 版本。这些版本与普通命令相同，但操作的是\
  \ UTC 而非本地时间：\n\n- `getUTCDate()` 函数获取 UTC 时间下的月份中的几。\n- `getUTCDay()` 函数获取 UTC\
  \ 时间下的星期几。\n- `getUTCFullYear()` 函数获取 UTC 时间下的四位年份。\n- `getUTCMonth()` 函数返回 UTC\
  \ 时间下的年度月份。\n- `getUTCHours()`、`getUTCMinutes()`、`getUTCSeconds()` 和 `getUTCMilliseconds()`\
  \ 返回 UTC 下的时间组件。\n- `setUTCDate()`、`setUTCFullYear()`、`setUTCMonth()`、`setUTCHours()`、`setUTCMinutes()`、`setUTCSeconds()`\
  \ 和 `setUTCMilliseconds()` 设置 UTC 时间。\n\n### 在日期格式之间进行转换\n\n`Date` 对象的两个特殊方法允许你在日期格式之间进行转换。你不是在你创建的\
  \ `Date` 对象使用这些方法，而是对内置的 `Date` 对象本身使用它们。这些包括：\n\n- `Date.parse()` 方法将日期字符串（例如 `November\
  \ 1, 2010`）转换为 `Date` 对象（自 1970/1/1 以来的毫秒数）。\n- `Date.UTC()` 方法执行相反的操作。它将 `Date`\
  \ 对象的值（毫秒数）转换为 UTC（GMT）时间。\n\n## 总结\n\n在本章中，你学习了 JavaScript 的几项重要特性。首先，你学习了如何使用函数对\
  \ JavaScript 语句进行分组，以及如何调用函数并使用它们返回的值。接下来，你学习了 JavaScript 的面向对象特性——使用构造函数定义对象、创建对象实例，以及处理属性、属性值和方法。\n\
  \n作为这些面向对象特性的示例，你深入了 JavaScript 内置的 `Math` 和 `Date` 对象，并学习了关于随机数比你想了解的更多的知识。\n\n\
  ## 问答\n\n**Q. JavaScript 中的许多对象（如 DOM 对象）包含父对象和子对象。我可以在自定义对象定义中包含子对象吗？**\n\n**A.**\
  \ 可以。只需为子对象创建一个构造函数，然后在父对象中添加一个与其对应的属性即可。例如，如果你在卡片文件示例中创建了一个 `Nicknames` 对象来存储一个人的多个昵称，你可以将其作为子对象添加到\
  \ `Card` 对象的构造函数中：`this.nick = new Nicknames();`。\n\n**Q. 我可以创建一个自定义对象的数组吗？**\n\n\
  **A.** 可以。首先，按照通常方法创建对象定义，并定义一个具有所需数量元素的数组。然后为每个元素分配一个新对象（例如 `array[1] = new Card();`）。你可以使用下一节描述的循环一次性为数组分配多个对象。\n\
  \n**Q. 我可以修改所有属性吗？**\n\n**A.** 对于自定义对象，可以——但与内置对象和 DOM 对象有所不同。例如，你可以使用 `length`\
  \ 属性查找字符串的长度，但它是一个只读属性，无法修改。\n\n**Q. 随机数生成得太快了，我不确定它是否在运行。有没有办法让它慢下来？**\n\n**A.**\
  \ 可以。如果你在示例中添加一个或多个表单字段，并使用它们在数据生成时显示，你将看到慢得多的结果。尽管如此，它仍在几秒内完成。\n\n## 工作坊\n\n工作坊包含了一些问题和活动，帮助你巩固对材料的理解。在查看后面的答案部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**1. 使用什么 JavaScript 关键字创建对象的实例？**\n\na. `object`\nb. `new`\nc. `instance`\n\
  \n**2. JavaScript 中 `this` 关键字的含义是什么？**\n\na. 当前对象。\nb. 当前脚本。\nc. 没有意义。\n\n**3.\
  \ 下哪个对象不能配合 `new` 关键字使用？**\n\na. `Date`\nb. `Math`\nc. `String`\n\n**4. JavaScript\
  \ 如何在 Date 对象中存储日期？**\n\na. 自 1970 年 1 月 1 日以来的毫秒数\nb. 自 1900 年 1 月 1 日以来的天数\nc.\
  \ 自 Netscape 公开发行以来的秒数\n\n**5. Math.random 函数生成的随机数范围是多少？**\n\na. 1 到 100 之间\nb.\
  \ 1 到自 1970 年 1 月 1 日以来的毫秒数之间\nc. 0 到 1 之间\n\n## 答案\n\n**1. b.** `new` 关键字创建对象实例。\n\
  \n\n\n\n\n## 2. a. `this` 关键字指向当前对象。\n\n## 3. b. `Math` 对象是静态的；你无法创建一个 `Math` 对象。\n\
  \n## 4. a. 日期被存储为自 1970 年 1 月 1 日以来的毫秒数。\n\n## 5. c. JavaScript 的随机数介于 `0` 和 `1`\
  \ 之间。\n\n### 练习题\n- 修改 `Greet` 函数以接受两个参数 `who1` 和 `who2`，并在单个对话框中包含这两个名字。\n- 修改\
  \ `Card` 对象的定义，添加一个名为 `email` 的属性，用于存储人员的邮箱地址。\n- 修改 `PrintCard` 函数使其运行三次，每次计算 5000\
  \ 个随机数的总和，并显示每组的总和。（你需要使用另一个包裹了大部分脚本代码的 `for` 循环。）\n\n# 第 18 章：使用条件和循环控制流程\n\n在本章中，你将学习：\n\
  - 如何使用 `if` 语句测试变量\n- 如何使用各种运算符来比较值\n- 如何使用逻辑运算符组合条件\n- 如何使用 `else` 使用备选条件\n- 如何使用条件运算符创建表达式\n\
  - 如何测试多个条件\n- 如何使用 `for` 循环执行重复语句\n- 如何使用 `while` 其他类型的循环\n- 如何使用 `do...while` 循环\n\
  - 如何创建无限循环（以及为什么不应该这样做）\n- 如何跳出循环和继续循环\n- 如何遍历数组的属性\n\nJavaScript 程序中的语句通常按照它们出现的顺序执行。由于这种方式并不总是实用的，大多数语言都提供了流控制语句，允许你控制代码执行的顺序。你在上一章中学习的函数就是一种流控制类型——尽管函数可能被定义在代码的最开始处。在本章中，你将学习另外两种流控制类型：`conditions`（条件），它们允许根据值进行选择；以及\
  \ `loops`（循环），它们允许执行重复语句。\n\n### `if` 语句\n计算机语言最重要的功能之一就是测试和比较值的能力。这允许你的脚本根据变量的值或用户的输入表现出不同的行为。`if`\
  \ 语句是 JavaScript 中主要的条件语句。该语句在 JavaScript 中的含义与英语中非常相似——例如，这是一个典型的条件语句：*如果电话响了，就接听。*\n\
  \n该语句由两部分组成：一个条件（*如果电话响了*）和一个动作（*接听*）。JavaScript 中的 `if` 语句工作方式相同：\n\n```javascript\n\
  if (a == 1) alert(\"Found a 1!\");\n```\n\n该语句包含一个条件（a 等于 1）和一个动作（显示消息）。该语句检查变量\
  \ `a`，如果它的值为 `1`，则显示警告消息。否则，它什么都不做。\n\n如果你像前面的示例一样使用 `if` 语句，可以使用单个语句作为动作。你也可以通过将多个语句封装在大括号（`{}`）中来作为动作，如下所示：\n\
  \n```javascript\nif (a == 1) {\n    alert(\"Found a 1!\");\n    a = 0;\n}\n```\n\
  \n这段语句块再次检查变量 `a`。如果发现值为 `1`，它会显示消息并将 `a` 设回 `0`。\n\n### 条件运算符\n`if` 语句的动作部分可以包含你已经学过的任何\
  \ JavaScript 语句（以及任何其他语句），但语句的条件部分使用它自己的语法。这被称为条件表达式。\n\n注意：条件表达式的任何侧都可以是变量、常量或表达式。你可以比较变量和值，也可以比较两个变量。（你可以比较两个常量，但通常没有必要。）\n\
  \n一个条件表达式通常包含两个要比较的值（在前面的示例中，这两个值是 `a` 和 `1`）。这些值可以是变量、常量，甚至是表达式本身。在两个要比较的值之间是一个条件运算符。该运算符告诉\
  \ JavaScript 如何比较这两个值。例如，`==` 运算符用于测试两个值是否相等。有多种条件运算符可用：\n\n- `==`—等于\n- `!=`—不等于\n\
  - `<`—小于\n- `>`—大于\n- `>=`—大于或等于\n- `<=`—小于或等于\n\n注意：务必不要将等值运算符（`==`）与赋值运算符（`=`）混淆，尽管它们都可能被读作“等于（equals）”。记住在给变量赋值时使用\
  \ `=`，在比较值时使用 `==`。混淆这两者是 JavaScript 编程中的常见错误之一。\n\n### 使用逻辑运算符组合条件\n通常，你可能想要检查一个变量是否有多个可能的值，或者同时检查多个变量。JavaScript\
  \ 包含了逻辑运算符（也称为布尔运算符）用于此目的。例如，以下两个语句检查了不同的条件并使用相同的动作：\n\n```javascript\nif (phone\
  \ == \"\") alert(\"error!\");\nif (email == \"\") alert(\"error!\");\n```\n\n使用逻辑运算符，你可以将它们合并为一个语句：\n\
  \n```javascript\nif ((phone == \"\") || (email == \"\")) alert(\"Something's Missing!\"\
  );\n```\n\n该语句使用逻辑“或”运算符（`||`）来组合条件。翻译成英语，就是：“如果电话号码为空或邮箱地址为空，则显示错误消息。”\n\n另一个逻辑运算符是“与”运算符（`&&`）。考虑这条语句：\n\
  \n```javascript\nif ((phone == \"\") && (email == \"\")) alert(\"Both are Missing!\"\
  );\n```\n\n提示：如果 JavaScript 解释器在到达末尾之前发现了条件表达式的答案，它就不会评估剩余的条件。例如，如果由 `&&` 运算符分隔的两个条件的第一个为假，则第二个不会被评估。你可以利用这一点来提高脚本运行速度。\n\
  \n该语句使用了 `&&`，所以只有当邮箱地址和电话号码都为空时，才会显示错误消息。（在这种情况下，`或` 是更好的选择。）\n\n\n\n\n\n`if` 语句的附加功能是\
  \ `else` 关键字。就像它的英文对应词一样，`else` 告诉 JavaScript 解释器当条件不为真时该做什么。以下是 `else` 关键字的一个简单示例：\n\
  \n```javascript\nif (a == 1) {\n    alert(\"Found a 1!\");\n    a = 0;\n} else {\n\
  \    alert(\"Incorrect value: \" + a);\n}\n```\n\n这是上一个示例的修改版本。如果满足条件，它会显示消息并重置变量\
  \ `a`。如果未满足条件（如果 `a` 不等于 `1`），则会显示不同的消息。\n\n***\n\n### 注意\n与 `if` 语句一样，`else` 后面可以跟一个单独的操作语句，也可以跟若干个包含在大括号内的语句。\n\
  \n***\n\n## 使用简写条件表达式\n\n除了 `if` 语句外，JavaScript 还提供了一种简写类型的条件表达式，你可以用它来快速决策。这种表达式使用了一种在其他语言（如\
  \ C）中也能看到的特殊语法。条件表达式的形式如下：\n\n`variable = (condition) ? (true action) : (false action);`\n\
  \n这为 `variable` 分配两个值之一：如果条件为真，则赋值一个；如果为假，则赋值另一个。这里是条件表达式的示例：\n\n`value = (a ==\
  \ 1) ? 1 : 0;`\n\n这条语句看起来可能很困惑，但它等同于以下 `if` 语句：\n\n```javascript\nif (a == 1) {\n\
  \    value = 1;\n} else {\n    value = 0;\n}\n```\n\n换句话说，如果条件为真，将使用问号（`?`）后面的值；如果条件为假，将使用冒号（`:`）后面的值。冒号代表该语句的\
  \ `else` 部分，与 `if` 语句的 `else` 部分一样是可选。\n\n这些简写表达式可以用任何 JavaScript 需要值的地方。它们提供了一种对值进行简单决策的方法。例如，这里有一种显示关于变量的语法正确消息的简单方法：\n\
  \n```javascript\ndocument.write(\"Found \" + counter +\n    ((counter == 1) ? \"\
  \ word.\" : \" words.\"));\n```\n\n如果变量 `counter` 的值为 `1`，它将打印 `Found 1 word`；如果其值为\
  \ `2` 或更大，则将打印 `Found 2 words`。这是条件表达式最常见的用法之一。\n\n## 使用 `if` 和 `else` 测试多个条件\n\n\
  你现在可以使用 `if` 和 `else` 创建一个示例脚本了。在第 4 章 的“理解 JavaScript”中，你创建了一个显示当前日期和时间的简单脚本。这个示例将使用条件来显示取决于时间的问候：“早上好”、“下午好”、“晚上好”或“你好”。为了实现这一点，你可以使用多个\
  \ `if` 语句的组合：\n\n```javascript\nif (hours < 10) {\n    document.write(\"Good morning.\"\
  );\n} else if (hours >= 14 && hours <= 17) {\n    document.write(\"Good afternoon.\"\
  );\n} else if (hours >= 17) {\n    document.write(\"Good evening.\");\n} else {\n\
  \    document.write(\"Good day.\");\n}\n```\n\n第一条语句检查 `hours` 变量的值是否小于 10——换句话说，它检查当前时间是否在上午\
  \ 10:00 之前。如果是，它会显示问候“Good morning.”\n\n第二条语句检查时间是否在下午 2:00 到下午 5:00 之间，如果是，则显示“Good\
  \ afternoon.”这条语句使用 `else if` 表明该条件只有在前一个条件失败时才会被测试——如果是早晨，就没需要检查是否是下午了。同样，第三条语句检查下午\
  \ 5:00 之后的时间并显示“Good evening.”\n\n最后一条语句使用简单的 `else`，这意味着如果之前的任何条件都不匹配，它将执行执行。这涵盖了上午\
  \ 10:00 到下午 2:00 之间的时间（其他语句忽略了这部分），并显示“Good day.”\n\n### HTML 文件\n\n要在浏览器中尝试此示例，你需要一个\
  \ HTML 文件。我们将保持 JavaScript 代码相互独立，因此代码列表 18.1 是完整的 HTML 文件。将其保存为 `timegreet.html`，但在下一节准备好\
  \ JavaScript 文件之前，请不要将其加载到浏览器中。\n\n代码列表 18.1 时间与问候示例的 HTML 文件\n\n```html\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Time Greet\
  \ Example</title>\n  </head>\n  <body>\n    <h1>Current Date and Time</h1>\n   \
  \ <script type=\"text/javascript\" src=\"timegreet.js\" > </script>\n  </body>\n\
  </html>\n```\n\n### JavaScript 文件\n\n代码列表 18.2 显示了用于时间问候示例的完整 JavaScript 文件。它使用内置的\
  \ `Date` 对象函数来查找当前日期，并将其将其存储在 `hours`、`mins` 和 `secs` 变量中。接下来，`document.write` 语句显示当前时间，之前介绍的\
  \ `if` 和 `else` 语句显示适当的问候。\n\n代码列表 18.2 显示当前时间和问候的脚本\n\n```javascript\n// 获取当前日期\n\
  now = new Date();\n// 分解为小时、分钟、秒\nhours = now.getHours();\nmins = now.getMinutes();\n\
  secs = now.getSeconds();\n// 显示时间\ndocument.write(\"<h2>\");\ndocument.write(hours\
  \ + \":\" + secs);\ndocument.write(\"</h2>\");\n// 显示问候\ndocument.write(\"<p>\"\
  );\nif (hours < 10) {\n    document.write(\"Good morning.\");\n} else if (hours\
  \ >= 14 && hours <= 17) {\n    document.write(\"Good afternoon.\");\n} else if (hours\
  \ >= 17) {\n    document.write(\"Good evening.\");\n} else {\n    document.write(\"\
  Good day.\");\n}\ndocument.write(\"</p>\");\n```\n\n要尝试此示例，请将此文件保存为 `timegreet.js`，然后加载\
  \ `timegreet.html` 文件。图 18.1 显示了此脚本的运行。\n\n**图 18.1** 时间示例的输出。\n\n![image](img/181)\n\
  \n### 使用 switch 使用多个条件\n\n在上一个示例中，你连续使用了好几个 `if` 语句来测试不同的条件。这里是该技术的另一个示例：\n\n```javascript\n\
  if (button==\"next\") {\n    window.location=\"next.html\";\n} else if (button==\"\
  previous\") {\n    window.location=\"prev.html\";\n} else if (button==\"home\")\
  \ {\n    window.location=\"home.html\";\n} else if (button==\"back\") {\n    window.location=\"\
  menu.html\";\n}\n```\n\n虽然这是一种紧凑的方法，但如果每个 `if` 语句都有自己的代码块，这种方法可能会变得混乱。作为替代方案，JavaScript\
  \ 包含了 `switch` 语句，它允许将对同一个变量的多次测试合并到一个语句块中。以下是将相同示例转换为 `switch` 的形式：\n\n```javascript\n\
  switch(button) {\n    case \"next\":\n        window.location=\"next.html\";\n \
  \       break;\n    case \"previous\":\n        window.location=\"prev.html\";\n\
  \        break;\n    case \"home\":\n        window.location=\"home.html\";\n  \
  \      break;\n    case \"back\":\n        window.location=\"menu.html\";\n    \
  \    break;\n    default:\n        window.alert(\"Wrong button.\");\n}\n```\n\n\
  `switch` 语句包含几个组件：\n\n- 初始 `switch` 语句。该语句在括号中包含要测试的值（在本例中为 `button`）。\n- 大括号（`{`\
  \ 和 `}`）包含 `switch` 语句的内容，类似于函数或 `if` 语句。\n- 一个或多个 `case` 语句。每个这些语句都指定了一个与 `switch`\
  \ 语句中指定的值进行比较的值。如果值匹配，则执行 `case` 语句后的语句。否则，尝试下一个 `case`。\n- `break` 语句用于结束每个 `case`。它会跳到\
  \ `switch` 的结尾。如果不包含 `break`，多个 `case` 中的语句可能无论是否匹配都会被执行。\n\n\n\n\n\n-   可选地，可以包含\
  \ `default` 情况，其后跟着一个或多个语句，这些语句在没有匹配到其他任何情况时将被执行。\n\n* * *\n\n注意\n\n你可以在 `switch`\
  \ 结构中的每个 `case` 语句之后使用多个语句。你不需要将它们括在括号中。如果情况匹配，JavaScript 解释器将执行语句，直到遇到 `break`\
  \ 或下一个 `case`。\n\n* * *\n\n### 使用 `for` 循环\n\n`for` 关键字是创建循环时首要考虑的工具，就像你在上一一个章节的随机数示例中看到的那样。`for`\
  \ 循环通常使用一个变量（称为 `counter` 或 `index`）来跟踪循环执行的次数，并在计数器达到特定数字时停止。一个基础的 `for` 语句如下：\n\
  \n```javascript\nfor (var = 1; var < 10; var++) { // 更多代码 }\n```\n\n`for` 循环有三个参数，用分号分隔：\n\
  \n- 第一个参数（示例中的 `var = 1`）指定一个变量并为其分配一个初始值。这被称为 `initial expression`（初始表达式），因为它为循环设置了初始状态。\n\
  - 第二个参数（示例中的 `var < 10`）是一个必须保持为真才能继续循环的条件。这被称为循环的 `condition`（条件）。\n- 第三个参数（示例中的\
  \ `var++`）是在循环的每次迭代时执行的语句。这被称为 `increment expression`（递增表达式），因为它通常用于递增计数器。递增表达式在每次循环迭代结束时执行。\n\
  \n在指定三个参数后，使用左括号（`{`）来指示块的开始。使用右括号（`}`）在块结束。括号之间的的所有语句都将在循环的每次迭代中执行。\n\n`for` 循环的参数听起来可能有点困惑，但在你习惯之后，你将频繁使用\
  \ `for` 循环。这里是这种类型循环的一个简单示例：\n\n```javascript\nfor (i=0; i<10; i++) {\n    document.write(\"\
  This is line \" + i + \"<br />\");\n}\n```\n\n这些语句定义了一个使用变量 `i` 的循环，将其初始化为 0，并且只要\
  \ `i` 的值小于 10 就会一直循环。递增表达式 `i++` 在循环的每次迭代中将 `i` 的值加 1。由于这发生在循环结束时，输出将列出零到九的数字。\n\
  \n当循环在括号之间只包含单个语句时（如示例所示），如果你想要可以省略括号。以下语句定义了没有括号的相同循环：\n\n```javascript\nfor (i=0;\
  \ i<10; i++)\n    document.write(\"This is line \" + i + \"<br />\");\n```\n\n*\
  \ * *\n\n提示\n\n无论循环包含一个语句还是多个语句，对所有循环都使用括号是一个良好的风格规范。这使得以后向循环中添加语句变得容易且不会引起语法错误。\n\
  \n* * *\n\n示例中的循环包含一个 `document.write` 语句，该语句将被反复执行。要查看此循环具体做了什么，你可以将其添加到 HTML 文档的\
  \ `<script>` 部分，如 Listing 18.3 所示。\n\n代码列表 18.3 使用 `for` 关键字的循环\n\n* * *\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Using a for\
  \ Loop</title>\n  </head>\n  <body>\n    <h1>Using a for Loop</h1>\n    <p>The following\
  \ is the output of the `for` loop:</p>\n    <script type=\"text/javascript\">\n\
  \    for (i=1;i<10;i++) {\n        document.write(\"This is line \" + i + \"<br\
  \ />\");\n    }\n    </script>\n  </body>\n</html>\n```\n\n* * *\n\n此示例在每次迭代期间都会显示一个带有循环计数器的消息。代码列表\
  \ 18.3 的输出如 图 18.2 所示。\n\n**图 18.2** `for` 循环示例的结果。\n\n![image](img/18fig02.jpg)\n\
  \n注意，循环只执行了九次。这是因为条件是 `i<10`。当计数器（i`）递增到 `10` 时，表达式不再为真。如果你需要循环计数到 `10`，你可以更改条件；`i<=10`\
  \ 或 `i<11` 都可以正常工作。\n\n`for` 循环传统上用于从一个数字计数到另一个数字，但你几乎可以使用任何语句进行初始化、条件和递增。然而，通常有更好的方法使用\
  \ `while` 关键字来执行其他类型的循环，如下一节所述。\n\n### 使用 `while` 循环\n\nJavaScript 中用于循环的另一个关键字是\
  \ `while`。与 `for` 循环不同，`while` 循环并不一定使用变量来计数。相反，只要条件为真，它们就会一直执行。事实上，如果条件初始为假，语句将完全不会执行。\n\
  \n`while` 语句在括号中包含条件，其后跟着一个括号内的语句块，就像 `for` 循环一样。这里是一个简单的 `while` 循环：\n\n```javascript\n\
  while (total < 10) {\n    n++;\n    total += values[n];\n}\n```\n\n此循环使用计数器 `n`\
  \ 来遍历 `values` 数组。然而，它不是在特定的计数处停止，而是在总和达到 `10` 时停止。\n\n你可能已经注意到可以使用 `for` 循环做相同的事情：\n\
  \n```javascript\nfor (n=0;total < 10; n++) {\n    total += values[n];\n}\n```\n\n\
  事实上，`for` 循环无非是一种特殊的 `while` 循环，它为你处理了初始化和递增。你通常可以使用 `while` 用于任何循环。但是，最好的方法是选择对该工作最合理、或者输入量最少的循环类型。\n\
  \n### 使用 `do...while` 循环\n\nJavaScript 像许多其他编程语言一样，包含了第三种循环：`do...while` 循环。这种循环与普通的\
  \ `while` 循环相似，唯一的区别在于：条件是在循环的*结束*测试的，而不是开始。这是一个典型的 `do...while` 循环：\n\n```javascript\n\
  do {\n    n++;\n    total += values[n];\n}\nwhile (total < 10);\n```\n\n你可能已经注意到，这基本上是上一个\
  \ `while` 示例的倒置版本。有一个区别：对于 `do` 循环，条件是在结束时测试的。这意味着循环中的语句将至少执行一次，即使条件从未为真。\n\n* *\
  \ *\n\n注意\n\n与 `for` 和 `while` 循环一样，`do` 循环可以包含不带括号的单个语句，也可以包含括号内的多个语句。\n\n* * *\n\
  \n### 处理循环\n\n虽然你可以使用简单的 `for` 和 `while` 循环处理简单的任务，但在使用复杂的循环时，你应该考虑一些因素。在接下来的章节中，我们将无限循环以及\
  \ `break` 和 `continue` 语句，它们让你对循环有更多的控制。\n\n### 创建无限循环\n\n`for` 和 `while` 循环让你对循环有了相当大的控制。在某些情况下，如果你不小心，可能会导致问题。例如，看以下循环代码：\n\
  \n```javascript\nwhile (i < 10) {\n    n++;\n    values[n] = 0;\n}\n```\n\n这个示例中有一个错误。`while`\
  \ 循环的条件引用变量 `i`，但该变量在循环过程中实际上并没有变化。这创建了一个无限循环。循环将继续执行，直到用户停止它或直到它产生某种错误。\n\n无限循环并不总是由用户停止的，除非退出浏览器——某些循环甚至可以阻止浏览器退出或导致崩溃。\n\
  \n显然，无限循环是应该避免的。它们也可能很难发现，因为 JavaScript 不给你一个告诉你有无限循环的错误。因此，每当在脚本中创建一个循环时，都应该小心确保有一个退出路。\n\
  \n\n\n\n根据所使用的浏览器版本，无限循环甚至可能导致浏览器停止响应响应。请务必为无限循环提供一个逃生路径，并在测试之前保存你的脚本，以防万一。\n\n\
  ***\n\n有时，你可能想刻意创建一个无限循环。这可能包括你希望程序一直执行，直到用户停止它的情况，或者你正准备通过 `break` 语句提供退出路径（该语句将在下一节介绍）。这里是创建无限循环的一种简单方法：\n\
  \n```javascript\nwhile (true) {\n```\n\n由于值 `true` 是判断条件，因此此循环将始终发现其条件为真（true）。\n\
  \n### 退出循环\n\n跳出无限循环有一种方法。你可以在循环期间使用 `break` 语句立即退出循环，并继续执行循环后的第一条语句。这里有一个使用 `break`\
  \ 的简单示例：\n\n```javascript\nwhile (true) {\n    n++;\n    if (values[n] == 1) break;\n\
  }\n```\n\n虽然 `while` 语句被设置为无限循环，但 `if` 语句会检查数组中对应的值。如果它发现值为 `1`，它就会退出循环。\n\n当 JavaScript\
  \ 解释器遇到 `break` 语句时，它会跳过循环的剩余部分，并从循环结束右括号后的第一个语句继续执行脚本。你可以在任何类型的循环中使用 `break` 语句，无论该循环是否无限无限。这为发生错误或满足另一个条件时提供了一种简单的退出方法。\n\
  \n### 继续循环\n\n还有一条语句可以帮助你控制循环中语句的执行。`continue` 语句会跳过循环的剩余部分，但与 `break` 不同，它会继续循环的下一次迭代。这里有一个简单的示例：\n\
  \n```javascript\nfor (i=1; i<21; i++) {\n    if (score[i]==0) continue;\n    document.write(\"\
  Student number \",i, \" Score: \", score[i], \"\\n\");\n}\n```\n\n此脚本使用 `for` 循环打印存储在\
  \ `score` 数组中的 20 个学生的成绩。`if` 语句用于检查分值为 `0` 的成绩。脚本假设分数为 `0`意味着该学生没有参加考试，因此它将继续循环而不打印该分数。\n\
  \n### 遍历对象属性\n\nJavaScript 中还有另一种类型的循环。`for...in` 循环不如普通的 `for` 或 `while` 循环灵活。相反，它专门设计用于对对象的每个属性执行操作。\n\
  \n例如，`navigator` 对象包含了描述用户浏览器的属性。你可以使用 `for...in` 来显示此对象的各个属性：\n\n```javascript\n\
  for (i in navigator) {\n    document.write(\"property: \" + i);\n    document.write(\"\
  \ value: \" + navigator[i] + \"<br>\");\n}\n```\n\n像普通的 `for` 循环一样，这种类型的循环使用索引变量（示例中的\
  \ `i`）。在循环的每次迭代中，该变量都会被设置为对象的下一个属性。当你需要检查或修改对象的每个属性时，这使得操作变得简单。\n\n***\n\n#### 自己自己尝试一下：处理数组和循环\n\
  \n为了应用你对循环的知识，你现在将创建一个使用循环处理数组的脚本。在编写此脚本的过程中，尝试想象一下如果没有 JavaScript 的循环功能，这将会有多困难。\n\
  \n这个简单的脚本将提示用户输入一系列名称。在输入所有名称后，它将以编号列表的形式显示名称列表。要开始脚本，初始化一些变量：\n\n```javascript\n\
  names = new Array();\ni = 0;\n```\n\n`names` 数组将存储用户输入的名称。你不知道会输入多少个名称，因此不需要为数组指定维度。`i`\
  \ 变量将用作循环中的计数器。\n\n接下来，使用 `prompt` 语句提示用户输入名称。使用循环对每个名称重复提示。你希望用户至少输入一个名称，因此 `do`\
  \ 循环是理想的：\n\n```javascript\ndo {\n    next = prompt(\"Enter the Next Name\", \"\"\
  );\n    if (next > \" \") names[i] = next;\n    i = i + 1;\n} while (next > \" \"\
  );\n```\n\n此循环提示一个名为 `next` 的字符串。如果输入了名称且不为空，它将被存储为 `names` 数组中的下一个项目。然后 `i` 计数器加\
  \ 1。循环将重复，直到用户不再输入名称或在提示对话框中点击取消。\n\n***\n\n## 提示\n\n如果你感兴趣让你的脚本尽可能短，请记住你可以使用递增运算符（`++`）将\
  \ `i = i + 1` 语句与之前的语句合并：`names[i++]=1`。\n\n***\n\n接下来，你的脚本可以显示输入的名称数量：\n\n```javascript\n\
  document.write(\"<h2>\" + (names.length) + \" names entered.</h2>\");\n```\n\n该语句显示\
  \ `names` 数组的 `length` 属性，并用 2 级标题标签包围以强调。\n\n接下来，脚本应该按照输入的顺序显示所有名称。由于名称存储在数组中，`for...in`\
  \ 循环是一个很好的选择：\n\n```javascript\ndocument.write(\"<ol>\");\nfor (i in names) {\n\
  \    document.write(\"<li>\" + names[i] + \"</li>\");\n}\ndocument.write(\"</ol>\"\
  );\n```\n\n在这里有一个 `for...in` 循环，它遍历 `names` 数组，将计数器 `i` 逐赋值给每个索引。然后脚本将开启和关闭的 `<li>`\
  \ 标签之间的名称作为有序列表中的项目打印出来。在循环之前之后，脚本会打印开始和结束的 `<ol>` 标签。\n\n你现在拥有了运行该脚本所需的所有内容。列表\
  \ 18.4 显示了此示例的 HTML 文件，列表 18.5 显示了 JavaScript 文件。\n\n列表 18.4 提示名称并显示它们的脚本 (HTML)\n\
  \n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Loops Example</title>\n  </head>\n  <body>\n<h1>Loops Example</h1>\n  \
  \  <p>输入一系列名称，我将以编号列表显示它们。</p>\n    <script type=\"text/javascript\" src=\"loops.js\"\
  ></script>\n</body>\n</html>\n```\n\n***\n\n列表 18.5 提示名称并显示它们的脚本 (JavaScript)\n\n\
  ***\n\n```javascript\n// 创建数组\nnames = new Array();\ni = 0;\n\n// 循环并提示名称\ndo {\n\
  \    next = window.prompt(\"Enter the Next Name\", \"\");\n    if (next > \" \"\
  ) names[i] = next;\n    i = i + 1;\n} while (next > \" \");\n\ndocument.write(\"\
  <h2>\" + (names.length) + \" names entered.</h2>\");\n// 显示所有名称\ndocument.write(\"\
  <ol>\");\nfor (i in names) {\n    document.write(\"<li>\" + names[i] + \"</li>\"\
  );\n}\ndocument.write(\"</ol>\");\n```\n\n***\n\n要尝试此示例，将 JavaScript 文件保存为 `loops.js`，然后将\
  \ HTML 文档加载到浏览器。将被多次提示名称。输入几个名称，然后点击取消表示你已完成。图 18.3 显示了最终结果在浏览器中应该的样子。\n\n**图 18.3**\
  \ 名称示例的输出。\n\n![image](img/18fig03.jpg)\n\n***\n\n## 总结\n\n在本章中，你学习了两种控制脚本流的方法。首先，你学习了如何使用\
  \ `if` 语句评估条件表达式并对其做出反应。你还学习了使用 `?` 运算符的条件表达式快捷形式，以及用于处理多个条件的 `switch` 语句。\n\n你还学习了使用\
  \ `for`、`while` 和其他循环的 JavaScript 循环能力，以及如何使用 `break` 和 `continue` 语句进一步控制循环。最后，你查看了用于处理对象每个属性的\
  \ `for...in` 循环。\n\n## 问答\n\n**问. 如果我在条件表达式中比较两个不同数据类型的项目（例如数字和字符串），会发生什么？**\n\n\
  \n\n\n\n**A.** JavaScript 解释器会尽力将值转换为通用格式并对其进行比较。在这种情况下，它会在比较之前将它们都转换为字符串。在 JavaScript\
  \ 1.3 及以后的版本中，你可以使用特殊的等等运算符 `===` 来比较两个值及其类型——使用此运算符时，只有当两个表达式具有相同的值*且*相同的数据类型时，该表达式结果才为真。\n\
  \n**Q. 如果使用 `if` 和 `else` 同样简单，我为什么还要用 `switch` 呢？**\n\n**A.** 两者都可以，所以这取决于你的选择。我个人而言，我觉得\
  \ `switch` 语句很令人困惑，更倾向于使用 `if`。你的选择可能还取决于你熟悉的其他编程语言，因为某些语言支持 `switch`，而另一些不支持。\n\
  \n**Q. 为什么当我不小心使用 `=` 而不是 `==` 时，我没有得到一个友好的错误提示呢？**\n\n**A.** 在某些情况下，这会导致错误。然而，错误的版本往往像是一个正确的语句。例如，在语句\
  \ `if (a=1)` 中，变量 `a` 将被赋值为 `1`。`if` 语句被认为是真的，且 `a` 的原值丢失了。\n\n**Q. 似乎我可以使用 `for`\
  \ 循环替换任何其他循环方法（`while`、`do` 等）。为什么有这么多选择？**\n\n**A.** 你得对。在大多数情况下，`for` 循环都可以工作，如果你愿意，可以用这种方式处理所有的循环。同样，你可以用\
  \ `while` 来替换 `for` 循环。你可以使用任何对你的应用程序最有意义的循环方法。\n\n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看随后的“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**1.** 下列哪个运算符在 JavaScript 中表示“不等于”？\n\n**a.** `!`\n\n**b.** `!=`\n\n\
  **c.** `<>`\n\n**2.** `switch` 语句的作用是什么？\n\n**a.** 测试一个变量是否等于多个不同的值\n\n**b.** 开启或关闭一个变量\n\
  \n**c.** 让普通的 `if` 语句变得更长且更复杂\n\n**3.** 哪种 JavaScript 循环在循环的*末尾*检查条件？\n\n**a.**\
  \ `for`\n\n**b.** `while`\n\n**c.** `do...while`\n\n**4.** 在循环内部，`break` 语句的作用是什么？\n\
  \n**a.** 使浏览器崩溃\n\n**b.** 重新开始循环\n\n**c.** 完全退出循环\n\n**5.** 语句 `while (3==3)` 是哪种示例？\n\
  \n**a.** 拼写错误\n\n**b.** 无限循环\n\n**c.** 非法的 JavaScript 语句\n\n## 答案\n\n**1.** b. `!=`\
  \ 运算符意味着*不等于*。\n\n**2.** a. `switch` 语句可以对同一个变量或表达式测试多个不同的值。\n\n**3.** c. `do...while`\
  \ 循环在循环末尾使用条件。\n\n**4.** c. `break` 语句退出循环。\n\n**5.** b. 因为条件 `(3==3)` 始终为真，此语句创建了一个无限循环。\n\
  \n## 练习\n\n- 修改 列表 18.4，在显示名称之前按字母顺序对其进行排序。你可以使用 第 16 章中“使用 JavaScript 变量、字符串和数组”\
  \ 描述的 `Array` 对象的 `sort` 方法。\n- 修改 列表 18.4，提示恰好 10 个名称。如果你点击取消按钮而不是输入名称，会发生什么？\n\
  \n## 第 19 章 响应事件\n\n在本章中你将学到：\n\n- 事件处理器是如何工作的\n- 事件处理器如何与对象关联\n- 如何创建事件处理器\n- 如何检测鼠标和键盘操作\n\
  - 如何使用 `onclick` 改变 `<div>` 的外观\n\n在你目前为止的 JavaScript 经验中，你编写的大多数脚本都是以冷静、有序的方式执行的，从第一语句运行到最后。你在示例脚本中见过一些事件处理器，用于将你的注意力集中在编程的其他方面，你很可能根据常识跟上了这些操作。光单这一点就说明了在\
  \ HTML 中使用 JavaScript 事件处理器是相对简单方便的。\n\n在本章中，你将学习使用 JavaScript 支持的各种事件处理器。使用事件处理器的脚本不是按顺序执行，而是可以直接与用户交互。在本书的剩余部分中，你编写的几乎每个脚本都会用到事件处理器，事实上，它们可能会在你编写的大多数脚本中占据重要地位。\n\
  \n### 理解事件处理器\n\n正如你在 第 14 章中“JavaScript 编程入门”中所学到的那样，JavaScript 程序不必按顺序执行。你还学习了它们可以检测*事件*并对其做出反应。事件是发生在浏览器上的事情——用户点击按钮、鼠标指针移动、或者网页或图像从服务器加载。\n\
  \n各种事件使你的脚本能够对鼠标、键盘和其他情况做出响应。事件是 JavaScript 用于使 Web 文档交互的关键方法。\n\n你用于检测和响应事件的脚本被称为*事件处理器*。事件处理器是\
  \ JavaScript 最强大的功能之一。幸运的是，它们也是最容易学习和使用的功能之一——通常，一个实用的事件处理器只需要一条语句。\n\n### 对象和事件\n\
  \n正如你在 第 15 章中“处理文档对象模型 (DOM)”中所学到的，JavaScript 使用一组对象来存储关于网页各个部分的信息——按钮、链接、图像、窗口等。事件通常可能发生在多个地方（例如，用户可以点击页面上的任何链接），因此每个事件都与一个对象关联。\n\
  \n每个事件都有一个名称。例如，当鼠标指针移动到页面上的对象上时会发生 `onMouseOver` 事件。当指针移动到特定链接上时，该链接会被发送到该链接的事件处理器（如果有的话）。\n\
  \n要定义事件处理器，可以在事件名称的开头添加单词 `on`。例如，当鼠标移动过链接时，会调用 `onMouseOver` 事件处理器。要定义该事件处理器，你将其添加到该特定链接的\
  \ `<a>` HTML 标签中。\n\n**注意**\n\n注意 `onMouseOver` 关键字上奇怪的大小写写法。这是事件处理器的标准表示。`on` 始终小写，事件名称中的每个单词首字母大写。然而，为了真正符合\
  \ XHTML 标准，当你在代码中使用这些事件处理器时，必须全小写。\n\n### 创建事件处理器\n\n你不需要 `<script>` 标签来定义事件处理器。相反，你可以为单个\
  \ HTML 标签添加事件处理器属性。例如，这里有一个包含 `onMouseOver` 事件处理器的链接：\n\n```html\n<a href=\"http://www.google.com/\"\
  \n    onmouseover=\"alert('You moved over the link.');\">\n    这是一个链接。\n```\n\n\
  注意这是一个 `<a>` 标签，尽管它被分成了多行。它指定了一个作为链接的 `onMouseOver` 事件处理器的语句。当鼠标移动到链接上时，该语句显示一个警告消息。\n\
  \n**注意**\n\n此处的示例使用单引号包裹文本。这在事件处理器中是必要的，因为双引号用于包裹事件处理器本身。（你也可以使用单引号来包裹事件处理器，并在脚本语句中使用双引号。）\n\
  \n\n\n\n\n你可以在像之前那样在事件处理器中使用类似的 JavaScript 语句，但如果你需要多条语句，使用函数会是一个好主意。只需在文档头部中定义该函数，然后像这样调用该函数作为事件处理器：\n\
  \n```html\n<a href=\"#bottom\" onmouseover=\"DoIt();\">将鼠标悬停在此链接上。</a>\n```\n\n\
  此示例在用户将鼠标移动到链接上时会调用名为 `DoIt()` 的函数。使用函数非常方便，因为你可以使用更长、更可读的 JavaScript 程序的作为事件处理器。\n\
  \n### 使用 JavaScript 定义事件处理器\n\n与其在 HTML 文档中指定事件处理器，不如使用 JavaScript 将函数赋值为事件处理器。这允许你根据条件设置事件处理器、开启或关闭它们，并动态地更改处理事件事件的函数。\n\
  \n> **提示**\n> 对于简单的事件处理器，如果你用分号将它们分开，可以使用两条语句。然而在大多数情况下，使用函数来执行这些语句更简单。\n\n要以这种方式定义事件处理器，你首先定义一个函数，然后将该函数赋值为事件处理器。事件处理器存储在\
  \ `document` 对象或另一个可以接收事件对象的属性中。例如，这些语句定义了一个名为 `mousealert` 的函数，然后将其赋值为文档的 `onMouseDown`\
  \ 事件处理器：\n\n```javascript\nfunction mousealert() {\n    alert (\"You clicked the\
  \ mouse!\");\n}\n\ndocument.onmousedown = mousealert;\n```\n\n> **提示**\n> 通俗来说，以这种方式设置事件处理器也是一种良好的做法：它允许你使用外部\
  \ JavaScript 文件来定义函数并设置事件，从而将 JavaScript 代码与 HTML 文件完全分离。\n\n你可以使用此技术为任何 HTML 元素设置事件处理器，但需要额外的额外的步骤：你必须先找到与元素对应的对象。要做到这一点，请使用\
  \ `document.getElementById` 函数。首先在 HTML 文档中定义一个元素并指定 `id` 属性：\n\n```html\n<a href=\"\
  http://www.google.com/\" id=\"link1\">\n```\n\n接下来，在 JavaScript 代码中找到该对象并应用事件处理器：\n\
  \n```javascript\nobj = document.getElementById(\"link1\");\nobj.onclick = MyFunction;\n\
  ```\n\n只要你在 HTML 文件中用唯一的 `id` 属性定义了它，你就可以对任何对象执行此操作。使用这种技术，你可以轻松地将同一个函数分配给多个对象的事件处理，而不会给你的\
  \ HTML 代码增加杂乱。\n\n### 支持多个事件处理器\n\n如果你想在点击元素时发生多一件事该怎么办？例如，假设你希望在点击按钮时，名为 `update`\
  \ 和 `display` 的两个函数都执行执行。你不能将两个函数都赋值给 `onclick` 属性。一种解决方案是定义一个调用这两个函数的函数：\n\n```javascript\n\
  function UpdateDisplay() {\n    update();\n    display();\n}\n```\n\n这并不总是处理事的理想方式。例如，如果你正在使用两个第三方脚本，并且它们都想向页面添加一个\
  \ `onLoad` 事件，那么应该有一种方法可以同时添加这两者。W3C DOM 标准定义了一个函数 `addEventListener` 来实现此目的。该函数为特定的事件和对象定义了一个*监听器*，你可以根据需要添加任意监听器函数。\n\
  \n遗憾的是，Internet Explorer 不支持 `addEventListener`，因此你必须在该浏览器中使用另一个函数 `attachEvent`。请参阅第\
  \ 21 章“使用非侵入式 JavaScript”，获取一个结合了这两者的跨浏览器事件添加脚本的函数。\n\n### 使用 `event` 对象\n\n当事件发生时，你可能需要了解更多关于事件的信息——例如，对于键盘事件，你需要知道按了哪个键。DOM\
  \ 包含一个 `event` 对象，可以提供这些信息。\n\n要使用 `event` 对象，你可以将其传递给你的事件处理器函数。例如，此语句定义了一个 `onKeyPress`\
  \ 事件，它将 `event` 对象传递给一个函数：\n\n```html\n<body onkeypress=\"getkey(event);\">\n```\n\
  \n然后你可以定义函数来接受事件作为参数：\n\n```javascript\nfunction getkey(e) {\n    ...\n}\n```\n\n\
  在 Firefox、Safari、Opera 和 Chrome 中，`event` 对象会自动传递给事件处理器函数，因此即使你使用 JavaScript 而不是\
  \ HTML 来定义事件处理器，它也能正常工作。在 Internet Explorer 中，最近的事件存储在 `window.event` 对象中。之前的 HTML\
  \ 示例将此对象传递给事件处理器函数。如果你用 JavaScript 定义事件处理器，这是可能的，因此你需要使用一些代码来找到正确的对象：\n\n```javascript\n\
  function getkey(e) {\n    if (!e) e=window.event;\n    ...\n}\n```\n\n这会检查变量 `e`\
  \ 是否已经定义。如果没有，它会获取 `window.event` 对象并将其存储在 `e` 中。这确保了你在任何浏览器中都有有效的 `event` 对象。\n\
  \n遗憾的是，尽管 Internet Explorer 和非 Internet Explorer 浏览器都支持 `event` 对象，但它们支持的属性不同。两者相同的属性是\
  \ `event.type`，即事件类型。这仅仅是事件的名称，例如 `onMouseOver` 事件对应 `mouseover`，`onKeyPress` 事件对应\
  \ `keypress`。后续章节列出了每个浏览器的一些其他有用属性。\n\n### Internet Explorer `event` 属性\n\n以下是 Internet\
  \ Explorer 的 `event` 对象的一些常用属性：\n\n- `event.button`—被按下的鼠标按钮。该值对于左键为 `1`，右键通常为 `2`。\n\
  - `event.clientX`—事件发生的 x 坐标（以像素为单位的列）。\n- `event.clientY`—事件发生的 y 坐标（以像素为单位的行）。\n\
  - `event.altkey`—指示事件期间是否按了 Alt 键的标志。\n- `event.ctrlkey`—指示事件期间是否按了 Ctrl 键的标志。\n\
  - `event.shiftkey`—指示事件期间是否按了 Shift 键的标志。\n- `event.keyCode`—被按下按键的键码（Unicode 格式）。\n\
  - `event.srcElement`—元素发生的对象。\n\n### 非 Internet Explorer `event` 属性\n\n以下是非 Internet\
  \ Explorer 现代浏览器中 `event` 对象的一些常用属性：\n\n- `event.modifiers`—指示事件期间按住了哪些修改键（Shift,\
  \ Ctrl, Alt 等）。该值是一个组合了代表不同键的二进制值的整数。\n- `event.pageX`—事件在网页内的 x 坐标。\n- `event.pageY`—事件在网页内的\
  \ y 坐标。\n- `event.which`—键盘事件的键码（Unicode 格式）或鼠标事件中被按下的按钮码（最好使用跨浏览器的 `button` 属性）。\n\
  - `event.button`—被按下的鼠标按钮。它的工作方式与 Internet Explorer 相同，不同之处左键的值为 `0`，右键的值为 `2`。\n\
  - `event.target`—元素发生的对象。\n\n> **注意**\n> `event.pageX` 和 `event.pageY` 属性基于事件发生元素的左上角，而不总是鼠标指针的精确位置。\n\
  \n### 使用鼠标事件\n\nDOM 包含许多用于检测鼠标动作的事件处理器。你的脚本可以检测鼠标指针的移动，以及按钮的何时被点击、释放或两者兼有。其中一些内容你可能已经熟悉了，因为你已经在之前的章节中看到过它们的运行效果。\n\
  \n> **提示**\n> `onMouseOver` 和 `onMouseOut` 事件处理器最常用的用途之一是创建*悬停效果*（rollovers——即鼠标移动到上方时会改变的图像。你将在本章后面的部分学习如何创建这些效果。\n\
  \n### 覆盖与移出 (Over and Out)\n\n\n\n\n你已经见过第一个也是最常见的事件处理器 `onMouseOver`。当鼠标指针移动到链接或其他对象上时，就会调用此处理器。\n\
  \n`onMouseOut` 处理器则是相反的——当鼠标指针移出对象的边界时，它就会被调用。除非发生某些异常情况，否则这总会在 `onMouseOver` 事件被调用后的某个时间发生。\n\
  \n### 注意\n在此情况下，对象可以是一个链接，也可以是一个表单元素。你将在第 26 章“处理基于 Web 的表单”中学习更多关于表单的知识。\n\n如果你的脚本在指针移动到对象上时发生了更改，那么这个处理器就特别有用——例如，在状态栏中显示消息或更改图像。你可以使用\
  \ `onMouseOut` 处理器在指针移开时撤销该操作。\n\n## 按下、释放（以及点击）\n\n你还可以使用事件来检测鼠标按钮何时被点击。为此提供的基础事件处理器是\
  \ `onClick`。当鼠标在位于相应对象上并点击鼠标按钮时，就会调用此事件处理器。\n\n例如，你可以使用以下事件处理器在点击链接时显示警报：\n\n```html\n\
  <a href=\"http://www.google.com/\"\n     onclick=\"alert('You are about to leave\
  \ this site.');\">\n     Go Away</a\n```\n\n在这种情况下，`onClick` 事件处理器会在链接的页面加载到浏览器之前运行。这对于创建条件性链接或在启动链接页面之前显示免责声明非常有用。\n\
  \n如果你的 `onClick` 事件处理器返回 `false` 值，则不会跳转到该链接。例如，下面的代码是一个显示确认对话框的链接。如果你点击“取消”，则不会跳转链接；如果你点击“确定”，则会加载新页面：\n\
  \n```html\n<a href=\"http://www.google.com/\"\n     onclick=\"return(window.confirm('Are\
  \ you sure?'));\">\n     Go Away</a\n```\n\n此示例使用 `return` 语句来包裹事件处理器。这确保了当用户点击“取消”时返回的\
  \ `false` 值会从事件处理器返回，从而防止链接被跳转。\n\n`onDblClick` 事件处理器与此类似，但它仅在用户双击对象时才使用。由于链接通常只需要点击一次，你可以使用它根据点击次数让链接执行两项不同的操作。（不用说，这可能会引起困惑）。你也可以检测图像和其他对象的双击。\n\
  \n为了让你对按下鼠标按钮时发生的情况有更多控制权，还包含了两个事件：\n\n- `onMouseDown` 用于用户按下鼠标按钮时。\n- `onMouseUp`\
  \ 用于用户释放鼠标按钮时。\n\n这两个事件是鼠标点击的两个半部分。如果你想检测整个点击全过程，请使用 `onClick`。使用 `onMouseUp` 和\
  \ `onMouseDown` 仅检测其中之一。\n\n要检测按下的是哪个鼠标按钮，你可以使用 `event` 对象的 `button` 属性。该属性为左键赋值值\
  \ `0` 或 `1`，为右键赋值 `2`。该属性用于 `onClick`、`onDblClick`、`onMouseUp` 和 `onMouseDown` 事件。\n\
  \n## 注意事项\n浏览器通常不会检测右鼠标按钮的 `onClick` 或 `onDblClick` 事件。如果你想检测右键，`onMouseDown` 是最可靠的方法。\n\
  \n作为这些事件处理器的示例，你可以创建一个脚本，显示鼠标按钮事件的信息并确定按下的是哪个按钮。列表 19.1 显示了鼠标事件脚本。\n\n**列表 19.1\
  \ 鼠标点击示例的 JavaScript 文件**\n\n```javascript\nfunction mousestatus(e) {\n    if (!e)\
  \ e = window.event;\n    btn = e.button;\n    whichone = (btn < 2) ? \"Left\" :\
  \ \"Right\";\n    message=e.type + \" : \" + whichone + \"\\n\";\n    document.form1.info.value\
  \ += message;\n}\n\nobj=document.getElementById(\"testlink\");\nobj.onmousedown\
  \ = mousestatus;\nobj.onmouseup = mousestatus;\nobj.onclick = mousestatus;\nobj.ondblclick\
  \ = mousestatus;\n```\n\n此脚本包含一个检测鼠标事件的函数 `mousestatus`。该函数使用 `event` 对象的 `button`\
  \ 属性来确定按下了哪个按钮。它还使用 `type` 属性来显示事件的类型，因为该函数将用于处理多种事件类型。\n\n在函数之后，脚本找到 `id` 属性为 `testlink`\
  \ 的链接对象，并将 `onmousedown`、`onmouseup`、`onclick` 和 `ondblclick` 事件分配给 `mousestatus`\
  \ 函数。\n\n将此脚本保存为 `click.js`。接下来，你需要一个 HTML 文档来配合脚本工作，如列表 19.2 所示。\n\n**列表 19.2 鼠标点击示例的\
  \ HTML 文件**\n\n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Mouse Click Text</title>\n  </head>\n  <body>\n    <h1>Mouse Click Test</h1>\n\
  \    <p>点击下方的测试链接上的鼠标。一条消息\n    将指示点击了哪个按钮。</p>\n    <h2><a href=\"#\" id=\"testlink\"\
  >Test Link</a></h2></h2>>\n    <form action=\"\" name=\"form1\">\n      <div>\n\
  \      <textarea rows=\"10\" cols=\"70\" name=\"info\"></textarea>\n      </div>\n\
  \    </form>\n    <script type=\"text/javascript\" src=\"click.js\"></script>\n\
  \  </body>\n</html>\n```\n\n此文件定义了一个具有 `id` 属性 `testlink` 的测试链接，该属性在脚本中用于分配事件处理器。它还定义了一个表单和一个用于脚本显示事件的文本区域。要测试此文档，请将其保存到与之前创建的\
  \ JavaScript 文件相同的文件夹中，并将 HTML 文档加载到浏览器中。结果显示在图 19.1](#ch19.html_ch1901)。\n\n**图\
  \ 19.1** 执行中的鼠标点击示例。\n\n![image](img/19fig01)\n\n### 注意\n注意点击左键会触发三个事件：`onMouseDown`、`onMouseUp`\
  \ 和 `onClick`。\n\n## 使用键盘事件\nJavaScript 还可以检测键盘操作。为此目的的主要事件处理器是 `onKeyPress`，它在按键按下或按住时发生。与鼠标按钮类似，你可以通过\
  \ `onKeyDown` 和 `onKeyUp` 检测按键的按下和释放。\n\n### 注意\nASCII（美国标准信息交换）是大多数计算机表示字符的标准数字代码。它将\
  \ 0–128 分配给各种字符——例如大写字母 A 到 Z 的 ASCII 值为 65 到 90。\n\n当然，你可能会发现知道用户按下了哪个键很有用。可以通过\
  \ `event` 对象获取，该对象在事件发生时发送给你的事件处理器。在 Internet Explorer 中，`event.keyCode` 存储按下键的\
  \ ASCII 码。在非 Internet Explorer 浏览器中，`event.which` 属性存储按下键的 ASCII 码。\n\n如果你更喜欢处理实际字符而不是键，可以使用字符串的\
  \ `fromCharCode` 方法进行转换。该方法将数字 ASCII 代码转换为相应的字符串字符。例如，以下语句将 `event.which` 属性转换为字符并存储在变量\
  \ `key` 中：\n\n`key = String.fromCharCode(event.which);`\n\n由于不同的浏览器返回键码的方式不同，独立显示按键会困难一些。但是，你可以创建一个处理任何浏览器的脚本。以下函数将在每次键入时显示每个键：\n\
  \n```javascript\nfunction DisplayKey(e) {\n    // 哪个键被按下了？\n    if (e.keyCode) keycode=e.keyCode;\n\
  \    else keycode=e.which;\n    character=String.fromCharCode(keycode);\n    //\
  \ 找到目标段的对象\n    k = document.getElementById(\"keys\");\n}\n```\n\n\n` 标签内容似乎不完整（在代码块处截断了），我根据您提供的文本片段进行了翻译。以下是针对您提供部分的翻译结果：\n\
  \n[content]\n\n```javascript\n// 将字符添加到段落中\n\nk.innerHTML += character;\n}\n```\n\
  \n`DisplayKey` 函数接收来自事件处理程序的 `event` 对象，并将其存储在变量 `e` 中。它检查 `e.keyCode` 属性是否存在，如果存在则将其存储在\
  \ `keycode` 变量中。否则，它假设浏览器不是 Internet Explorer，并将 `keycode` 赋值给 `e.which` 属性。\n\n\
  ### 注意\n\n`DisplayKey` 函数的最后几行使用 `getElementById` 函数和 `innerHTML` 属性，在页面上的段落内显示你输入的按键。\n\
  \n函数的其余行将按键代码转换为字符，并添加到具有 `id` 属性为 `keys` 的文档段落中。列表 19.3 显示了使用该函数的完整示例。\n\n####\
  \ 列表 19.3 显示输入的字符\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>显示按键输入</title>\n    <script type=\"text/javascript\">\n      function DisplayKey(e)\
  \ {\n        // 按了哪个键？\n        if (e.keyCode) keycode=e.keyCode;\n          else\
  \ keycode=e.which;\n        character=String.fromCharCode(keycode);\n        //\
  \ 找到目标段落的元素\n        k = document.getElementById(\"keys\");\n        // 将字符添加到段落中\n\
  \        k.innerHTML += character;\n      }\n    </script>\n  </head>\n  <body onkeypress=\"\
  DisplayKey(event)\">\n    <h1>显示输入的字符</h1>\n    <p>本文文档包含一个简单的脚本，可以显示你在下方段落中输入的按键。输入几个键来尝试一下。</p>\n\
  \    <p id=\"keys\"></p>\n</body>\n</html>\n```\n\n当你加载此示例时，观察你输入的字符是如何出现在文档的段落中的。图\
  \ 19.2 显示了该示例的运行情况。\n\n**图 19.2** 显示被按下的按键。\n\n![image](img/19fig02.jpg)\n\n###\
  \ 使用 `onLoad` 和 `onUnload` 事件\n\n你可能经常使用的另一个事件是 `onLoad`。当当前页面（包括所有图像）从服务器加载完成时，会触发此事件。\n\
  \n### 注意\n\n由于 `onLoad` 事件在 HTML 文档加载并显示完成后发生，因此你不能在 `onLoad` 事件处理程序中使用 `document.write`\
  \ 或 `document.open` 语句。这将覆盖当前文档。\n\n`onLoad` 事件与 `window` 对象相关，要定义它，你需要在 `<body>`标签中使用事件处理程序。例如，以下是一个\
  \ `<body>` 标签，它使用一个简单的事件处理程序在页面加载完成后显示警框：\n\n```html\n<body onload=\"alert('Loading\
  \ complete.');\">\n```\n\n图像也可以有 `onLoad` 事件处理程序。当你为 `<img>` 标签定义 `onLoad` 事件处理程序时，它会在指定的图像完全加载后立即触发。\n\
  \n要使用 JavaScript 设置 `onLoad` 事件，你可以将一个函数赋值给 `window` 对象的 `onload` 属性：\n\n```javascript\n\
  window.onload = MyFunction;\n```\n\n你还可以为 `<body>` 标签指定 `onUnload` 事件。每当浏览器卸载当前文档时，此事件就会被触发——这发生在加载另一个页面或关闭浏览器窗口时。\n\
  \n在下一节中，你将看到一个事件处理程序的实际运行情况，其背景是在你开发自己的网站时可能会遇到的功能。\n\n### 使用 `onclick` 改变 `<div>`\
  \ 外观\n\n正如你所看到的，`onclick` 事件可以用于调用各种操作；你可能将鼠标点击视为通过点击按钮来提交表单的方法，但你也可以捕获此事件并用它为你的页面提供交互性。在这个示例中，你将看到如何使用\
  \ `onclick` 事件来显示或隐藏包含在 `<div>` 中的信息。在这种情况下，你通过允许用户在点击文本时显示之前隐藏的信息，从而为你的页面添加了交互性。之所以被称为“文本”，是因为严格来说，这段文本并不是链接。也就是说，它看起来像链接，作用起来也像链接，但它没有在\
  \ `<a>` 标签内标记。\n\n列表 19.4 提供了此示例的完整代码，如图 19.3 所示。\n\n**图 19.3** 列表 19.4 的初始显示。\n\
  \n![image](img/19fig03.jpg)\n\n#### 列表 19.4 使用 `onclick` 显示或隐藏内容\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Steptoe Butte</title>\n    <style type=\"\
  text/css\">\n      a {\n        text-decoration: none;\n        font-weight: bold;\n\
  \        color: #7aabf;\n      }\n      #hide_e {\n        display: none;\n    \
  \  }\n      #elevation {\n        display: none;\n      }\n      #hide_p {\n   \
  \     display: none;\n      }\n      #photos {\n        display: none;\n      }\n\
  \      #show_e {\n        display: block;\n      }\n      #show_p {\n        display:\
  \ block;\n      }\n      .fakelink {\n        cursor:pointer;\n        text-decoration:\
  \ none;\n        font-weight: bold;\n        color: #E0A3E;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    <h1>Steptoe Butte</h1>\n... (此处内容因原文截断未完全)\n  </body>\n\
  </html>\n```\n\n\n\n\n\n```javascript\ndocument.getElementById('photos').style.display='none';\n\
  ```\n\n&raquo; 隐藏斯普特布山顶部的照片</div\n\n<div id=\"photos\"><img src=\"steptoe_sm1.jpg\"\
  \ alt=\"从斯普特布山的视角\"style=\"margin-right: 12px; border: 1px solid #000\" /><img src=\"\
  steptoe_sm2.jpg\" alt=\"从斯普特布山的视角\" style=\"margin-right: 12px; border: 1px solid\
  \ #000\" /><img src=\"steptoe_sm3.jpg\" alt=\"从斯普特布山的视角\" style=\"margin-right:\
  \ 12px; border: 1px solid #000\" /></div>\n\n<p><em>来自 <a href=\"http://en.wikipedia.org/wiki/Steptoe_Butte\"\
  >Wikipedia</a>，图片由作者提供。</em></p>\n\n***\n\n首先，查看表中的六条目。第一条目仅为被 `<a></a>` 标签对包围的链接设置样式；这些链接显示为无下划线、加粗的蓝色链接。你可以在图\
  \ 19.3 中的两段文本（以及页面底部的行）中看到这些普通链接。\n\n接下来的四条目是针对特定 ID 的，这些 ID 在页面首次加载时被设置为不可见（`display:\
  \ none`）。随其后的两个 ID 被设置为在页面首次加载时显示为块级元素（block）。再次，严格来说，这两个 ID 并不需要这样定义，因为这是默认的显示方式。样式表包含这些条目是为了说明它们之间的区别。如果你数一下代码列表\
  \ 19.4 中 `<div>` 元素的数量，你会发现代码中有六个：四个是不可见的，两个在页面加载时可见的。\n\n此示例的目标是在点击另一个 ID 时更改两个\
  \ ID 的显示值。但在那，你必须确保用户能够意识到某段文本是可以点击的，这通常发生在用户看到他们的鼠标指针变化以反映存在链接时。虽然在图 19.3 中没有显示，但当你从浏览器中查看此示例时，你会看到鼠标指针变成一只指向特定链接的手指。\n\
  \n这一功能通过为这段特定文本定义一个类（class）来实现；该类名为为 `fakelink`，正如你在代码片段中所示：\n\n```html\n<div class=\"\
  fakelink\"\n     id=\"show_e\"\n     onclick=\"this.style.display='none';\n    \
  \         document.getElementById('hide_e').style.display='block';\n           \
  \  document.getElementById('elevation').style.display='inline';\n&raquo; 显示高度</div>\n\
  ```\n\n`fakelink` 类确保文本被渲染为无下划线、加粗且红色的；`cursor: pointer` 导致鼠标指针发生这种变化，使用户会认为该文本是通常包含在\
  \ `<a></a>` 标签中的那种类型的链接。但当我们与 `<div>` 关联一个 `onclick` 属性时，真正有趣的事情就发生了。在刚刚显示的示例片段中，`onclick`\
  \ 属性的值是一系列更改 CSS 元素当前值的命令。\n\n让我们分别查看它们：\n\n```javascript\nthis.style.display='none';\n\
  document.getElementById('hide_e').style.display='block';\ndocument.getElementById('elevation').style.display='inline';\n\
  ```\n\n你看到的是旨在更改特定元素的不同 JavaScript 方法。在第一行中，`this` 关键字指的是元素本身。换句话说，`this` 指的是 ID\
  \ 为 `show_e` 的 `<div>`。`style` 关键字指的是样式对象；`style` 对象包含了你分配给元素的所有 CSS 样式。在这种情况下，我们最感兴趣的是显示样式（display\
  \ style）。因此，`this.style.display` 意味着“`show_e` ID 的显示样式”，我们在这里做的是在点击文本本身时将显示样式的值设置为\
  \ `none`。\n\n但这并不是我们所做的全部，因为在 `onclick` 属性中发生了三个动作。另外两个动作以 `document.getElementByID()`\
  \ 开头，并在括号内包含一个特定的 ID 名称。我们使用 `document.getElementByID()` 而不是 `this`，是因为第二个和第三个动作为非父元素的元素设置\
  \ CSS 样式属性。正如你在片段中所示，在第二个和第三个动作中，我们正在为元素 ID `hide_e` 和 `elevation` 设置显示属性值。总而言之，当用户点击当前可见的名为\
  \ `show_e` 的 `<div>` 时：\n\n*   `show_e <div>` 变为不可见。\n*   `hide_e <div>` 变为可见并显示为块。\n\
  *   `elevation <div>` 变为可见并以行内（inline）显示。\n\n这些动作的结果显示在图 19.4 中。\n\n**图 19.4** 点击“显示高度”后，根据\
  \ `onclick` 属性中的命令，它和其他 `<div>` 元素的可见性发生了变化。\n\n![image](img/19fig04.jpg)\n\n在代码列表\
  \ 19.3 的代码中还有另一组 `<div>` 元素，即控制额外照片可见性的元素。这些元素不受高度相关元素中 `onclick` 动作的影响。也就是说，当你点击“显示高度”或“隐藏高度”时，与照片相关的\
  \ `<div>` 元素完全不会改变。你可以显示高度而不显示照片（如图 19.4 所示）、显示照片而不显示高度，或者同时显示高度和照片（参见图 19.5）。\n\
  \n**图 19.5** 同时点击“显示高度”和“显示斯普特布山顶部的照片”后的页面。\n\n![image](img/19fig05.jpg)\n\n这个简短的示例向你展示了当你掌握了结合\
  \ JavaScript 事件的 CSS 后，等待你的布局和交互可能的开端。例如，你可以编写页面代码，使用户能够更改样式表的元素、切换到完全不同的样式表、将文本块移动到布局中的其他位置、进行测验或提交表单，以及更多功能。\n\
  \n## 总结\n\n在本章中，你学习了如何使用事件来检测鼠标操作、键盘动作以及其他事件（例如加载）。你可以在事件发生时执行简单的 JavaScript 语句，或者调用更复杂的函数。\n\
  \nJavaScript 包含许多事件。许多事件与表单有关，你将在第 26 章中学习更多内容。\n\n\n\n\n问：当我使用 `onLoad` 事件时，我的事件处理器有时会在页面加载完成或某些图形加载完成之前执行。有更好的方法吗？\n\
  \n答：这是某些旧版本浏览器中的 Bug。一种解决方案是使用 `setTimeout` 方法为脚本添加轻微的延迟。\n\n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n1.** 下列哪项是检测链接鼠标点击的正确事件处理器？\n\na. `onMouseUp`\nb. `onLink`\nc. `onClick`\n\
  \n2.** `<body>` 标签的 `onLoad` 事件处理器何时执行？\n\na. 当图片加载完成后\nb. 当整个页面加载完成后\nc. 当用户尝试加载另一个页面时\n\
  \n3.** 在 Internet Explorer 中，以下哪个 `event` 对象的属性指示了 `onKeyPress` 事件中按下哪个键？\n\na.\
  \ `event.which`\nb. `event.keyCode`\nc. `event.onKeyPress`\n\n## 答案\n\n1. c. 鼠标点击的事件处理器是\
  \ `onClick`。\n2. b. `<body>` 标签的 `onLoad` 在页面及其所有图片加载完成后执行。\n3. b. 在 Internet Explorer\
  \ 中，`event.keyCode` 属性存储每次按键的字符代码。\n\n## 练习\n\n• 在列表 19.4 的 `onClick` 属性中添加命令，使得一次只有一个\
  \ `<div>` 元素（高度图或照片）是可见的。\n\n## 第 20 章：使用窗口和帧\n\n本章你将学到：\n\n• 如何访问和使用 `window` 对象层次结构\n\
  • 如何使用 JavaScript 创建新窗口\n• 如何使用超时延迟脚本操作\n• 如何显示警报框、确认框和提示框\n• 如何构建帧集 (frameset)\n\
  • 如何在帧和窗口之间建立链接\n• 如何使用 JavaScript 处理帧\n• 如何使用内联帧 (inline frames)\n\n现在你已经熟悉了 JavaScript\
  \ 的基本功能，让我们回到文档对象模型 (DOM) 的特定方面。在本章中，你将更多地了解 DOM 中一些最有用的对象——浏览器窗口和帧，以及 JavaScript\
  \ 如何与它们交互。\n\n### 使用对象控制窗口\n\n在第 15 章“使用文档对象模型 (DOM)](#ch15.html_ch15)”中，你学习了可以使用\
  \ DOM 对象来表示浏览器窗口的不同部分以及当前 HTML 文档。你还学习了 `history`、`document` 和 `location` 对象都是 `window`\
  \ 对象的子级。在本章中，你将更密切地观察 `window` 对象本身。正如你现在可能猜到的，这意味着你将处理浏览器窗口。正如本章稍后看到的，`window`\
  \ 对象的变体还允许你处理帧。\n\n`window` 对象始终指向当前窗口（包含脚本的窗口）。`self` 关键字也是当前窗口的同义词。正如你将在后续节中中学到的，你可以同时在屏幕上拥有多个窗口，并用不同的名称来引用它们。\n\
  \n### `window` 对象的属性\n\n虽然通常只有一个 `window` 对象，但如果你在使用弹出窗口或帧，可能会有多个。正如你在第 15 章中所学习的样，`document`、`history`\
  \ 和 `location` 对象是 `window` 对象的属性（或子级）。除了这些之外，每个 `window` 对象还具有以下属性：\n\n• `window.closed`——指示窗口是否关闭。这只在处理多个窗口时才有意义，因为当前窗口包含脚本，在不结束脚本的情况下无法关闭。\n\
  • `window.defaultstatus` 和 `window.status`——状态行的默认消息以及显示在状态行上的临时消息。一些最近的浏览器默认禁用了状态行的更改，因此你可能无法使用它们。\n\
  • `window.frames[]`——一个帧的对象数组，如果窗口包含帧。你将在本章稍后学习更多关于帧的知识。\n• `window.name`——为帧或由脚本打开的窗口指定的名称。\n\
  • `window.opener`——在脚本打开的窗口中，这是指向打开它的脚本所在窗口的引用。\n\n> 注意：`window.screen` 对象的属性包括\
  \ `height`、`width`、`availHeight` 和 `availWidth`（可用高度和宽度而非总量），以及 `colorDepth`，它指示显示器的颜色支持：`8`\
  \ 表示 8 位色，`32` 表示 32 位色，以此此类推。\n\n• `window.parent`——对于帧，指向包含帧的父窗口的引用。\n• `window.screen`——存储窗口所在屏幕信息的子对象——它的分辨率、色彩深度等。\n\
  • `window.self`——当前 `window` 对象的同义词。\n• `window.top`——在在使用帧时，指向顶层窗口的引用。\n\n### 创建新窗口\n\
  \n`window` 对象最方便的用途之一是创建一个新窗口。你可以这样做来显示文档——例如弹出广告或游戏说明——而无需清空当前窗口。你还可以为特定目的创建窗口，例如导航窗口。\n\
  \n你可以使用 `window.open()` 方法创建一个新的浏览器窗口。打开新窗口的典型语句如下：\n\n```\nwindow.open(\"URL\"\
  , \"WindowName\", \"features\");\n```\n\n上述 `window.open()` 语句的组成部分如下：\n\n• 变量被用于存储新的\
  \ `window` 对象。你可以通过此名称访问新对象的方法和属性。\n• `window.open()` 方法的第一个参数是将被加载的 URL。如果留空，则不会加载任何网页。在这种情况下，可以使用\
  \ JavaScript 为窗口填充内容。\n• 第二个参数指定窗口名称（此处为 `WindowName`）。它被赋值给窗口对象的 `name` 属性，并用于引用该窗口。\n\
  • 第三个参数是可选功能列表，用逗号分隔。你可以通过选择是否包含工具栏、状态行和其他功能来自定制窗口。这允许你创建各种“浮动”窗口，它们看起来完全不像典型的浏览器窗口。\n\
  \n`window.open()` 方法第三个参数中的可用功能包括 `width` 和 `height`（以像素设置窗口大小），以及若干可以设置为 `yes`\
  \ (1) 或 `no` (0) 的功能：`toolbar`、`location`、`directories`、`status`、`menubar`、`scrollbars`\
  \ 和 `resizable`。你可以只列出你想从默认更改的功能。\n\n此示例创建了一个没有工具栏或状态行的小窗口：\n\n```\nSmallWin = window.open(\"\
  \",\"small\",\"width=100,height=120,toolbar=0,status=0);\n```\n\n### 打开和关闭窗口\n\n\
  当然，你也可以使用 JavaScript 关闭窗口。`window.close()` 方法关闭窗口。浏览器通常不允许没有用户许可的情况下关闭主浏览器窗口；此方法的主要用途是关闭你创建的窗口。例如，此语句关闭名为\
  \ `updateWindow` 的窗口：\n\n```javascript\nupdateWindow.close();\n```\n\n\n\n另一个示例，列表\
  \ 20.1 显示了一个 HTML 文档，它允许你通过点击按钮打开一个小的新窗口。你可以点击另一个按钮来关闭该新窗口。第三个按钮尝试关闭当前窗口。根据你的浏览器及其设置，此操作可能有效也可能无效（例如，默认情况下，你的浏览器可能禁止脚本关闭并非脚本本身创建或打开的窗口）。如果脚本确实关闭了窗口，大多数浏览器会先请求确认。\n\
  \n列表 20.1 使用 JavaScript 创建和关闭窗口的 HTML 文档\n\n* * *\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"\
  http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Create a New Window</title>\n  </head>\n\
  \  <body>\n    <h1>Create a New Window</h1>\n    <p>Use the buttons below to open\
  \ and close windows in JavaScript.</p>\n    <form name=\"winform\" action=\"\">\n\
  \      <p><input type=\"button\" value=\"Open New Window\"\n          onclick=\"\
  NewWin=window.open('','NewWin',\n          'toolbar=no,status=no,width=200,height=100');\"\
  \ /></p>\n      <p><input type=\"button\" value=\"Close New Window\"\n         \
  \ onclick=\"NewWin.close();\" /></p>\n      <p><input type=\"button\" value=\"Close\
  \ Main Window\"\n          onclick=\"window.close();\" /></p>\n    </form>\n  </body>\n\
  </html>\n```\n\n* * *\n\n此示例使用简单的事件处理器来完成工作，通过为每个按钮提供不同的处理器来实现。图 20.1 显示了点击“Open\
  \ New Window”按钮后的结果：它在主浏览器窗口上方打开了一个小的新窗口。\n\n**图 20.1** 使用 JavaScript 打开的新浏览器窗口。\n\
  \n![image](img/20fig01.jpg)\n\n### 移动和调整窗口大小\n\nDOM 还允许你移动或调整窗口大小。你可以对任何 `window`\
  \ 对象使用以下方法来实现：\n\n- `window.moveTo()` 将窗口移动到新位置。参数指定 x（列）和 y（行）位置。\n- `window.moveBy()`\
  \ 将窗口相对于当前位置移动。x 和 y 参数可以是正数或负数，并加到当前值上以到达新位置。\n- `window.resizeTo()` 将窗口调整为参数指定的宽度和高度。\n\
  - `window.resizeBy()` 相对于当前大小调整窗口大小。参数用于修改当前的宽度和高度。\n\n例如，列表 20.2 显示了一个 HTML 文档，该文档包含一个简单的脚本，允许你根据表单中输入的值调整主窗口的大小的位置。\n\
  \n列表 20.2 移动和调整当前窗口\n\n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Moving and Resizing Windows</title>\n    <script type=\"text/javascript\"\
  >\n    function doIt() {\n      if (document.form1.w.value && document.form1.h.value)\
  \ {\n        self.resizeTo(document.form1.w.value, document.form1.h.value);\n  \
  \    }\n      if (document.form1.x.value && document.form1.y.value) {\n        self.moveTo(document.form1.x.value,\
  \ document.form1.y.value);\n      }\n    }\n    </script>\n  </head>\n  <body>\n\
  \    <h1>Moving and Resizing Windows</h1>\n    <form name=\"form1\">\n      <p><strong>调整大小为：</strong>\
  \ <br/>\n      <input size=\"5\" type=\"text\" name=\"w\" /> 像素宽和 <br/>\n      <input\
  \ size=\"5\" type=\"text\" name=\"h\" /> 像素高 </p>\n      <p><strong>— 和/或 —</strong></strong></p>\n\
  \      <p><strong>移动到：</strong> <br/>\n      X-位置: <input size=\"5\" type=\"text\"\
  \ name=\"x\" />\n      Y-位置: <input size=\"5\" type=\"text\" name=\"y\" /> </p>\n\
  \      <div><input type=\"button\" value=\"Change Window\"\n          onclick=\"\
  doIt();\" /></div>\n    </form>\n  </body>\n</html>\n```\n\n* * *\n\n在例例中，当你点击“Change\
  \ Window”按钮时，`doIt` 函数作为事件处理器被调用。该函数会检查你是否指定了宽度和高度值。如果指定了，它将使用 `self.resizeTo()`\
  \ 方法调整当前窗口的大小。同样，如果你指定了 x 和 y 值，它将使用 `self.moveTo()` 移动窗口。如果你同时设置了这两组值，脚本将同时调整窗口大小并移动窗口。\n\
  \n* * *\n\n### 注意\n\n移动或调整窗口大小是一个你在使用之前应该仔细考虑的 JavaScript 功能。这些方法最好用于调整或移动你的脚本生成的弹出窗口——而不是作为强制用户使用你偏好的窗口大小的方法，大多数用户会认为这非常烦人。因为浏览器设置可能配置为防止调整或移动窗口，请确保你的脚本即使在不调整大小的情况下也能正常工作。\n\
  \n* * *\n\n根据设置，某些浏览器可能不允许你的脚本调整或移动主窗口。特别是 Firefox 可以配置为禁止此操作。你可以通过从菜单中选择“Options”（选项）来启用。选择“Content”（内容）选项卡，点击“Enable\
  \ JavaScript”选项旁边的“Advanced”（高级）按钮，启用或禁用“Move or Resize Existing Windows”（移动或调整现有窗口）选项。其他浏览器可能在“Options”或“Preferences”（偏好）菜单中有类似的选项。\n\
  \n### 使用超时器\n\n有时让脚本执行最困难的事情是完全什么都不做——持续特定的时间。幸运的是，JavaScript 包含一个内置函数来实现。`setTimeout`\
  \ 允许你指定延迟以及在延迟后执行的命令。\n\n* * *\n\n### 注意\n\n超时器并不会让浏览器停止它正在做的事情——虽然 `setTimeout`\
  \ 方法指定的语句在延迟通过后才会执行，但浏览器在此期间会继续运行（例如处理事件处理程序）。\n\n * *\n\n一个变量（例中的 `ident`）存储超时的标识符。这允许你设置多个超时，每个都有自己的标识符。在超时发生之前，你可以使用\
  \ `clearTimeout()` 方法停止它，并指定标识符：\n\n```javascript\nwindow.clearTimeout(ident);\n\
  ```\n\n通常，超时只会发生一次，因为 `setTimeout` 中指定的语句只执行一次。但通常你会希望语句重复执行。例如，你的脚本可能会更新时或倒计时，需要每秒执行一次。\n\
  \n* * *\n\n### 注意\n\n像事件处理程序一样，超时使用引号内的 JavaScript 语句。确保你在语句内的每个字符串两侧都使用单引号，如前面的示例所示。\n\
  \n* * *\n\n你可以通过在超时调用的函数中再次发布 `setTimeout()` 调用来让超时重复。列表 20.3 显示了一个演示重复超时的 HTML\
  \ 文档。\n\n列表 20.3 每两秒更新一次页面的超时\n\n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Timeout Example</title>\n    <script type=\"text/javascript\">\n    var\
  \ counter = 0;\n    // 在首次加载 2 秒后调用 Update 函数\n    ID=window.setTimeout(\"Update();\"\
  ,2000);\n    function Update() {\n      counter++;\n      textField = document.getElementById(\"\
  showText\");\n```\n\n\n\n\n\n```html\ntextField.innerHTML = \"The counter is now\
  \ at \" + counter;\n\n// set another timeout for the next count\n\nID=window.setTimeout(\"\
  Update();\",2000);\n\n}\n\n</script>\n</head>\n<body>\n<h1>超时器示例 (Timeout Example)</h1>\n\
  <p>计数器将每两秒更新一次。</p>\n<p>按下 RESET 或 STOP 重新开始或停止计数。</p>\n<hr/>\n<form name=\"form1\"\
  >\n<p id=\"showText\"></p>\n<div>\n  <input type=\"button\" value=\"RESET\" onclick=\"\
  counter = 0;\" />\n  <input type=\"button\" value=\"STOP\" onclick=\"window.clearTimeout(ID);\"\
  \ />\n</div>\n</form>\n</body>\n</html>\n```\n\n***\n\n此程序每两秒在特殊命名的 `<p>` 标签内显示一条消息，其中包含一个每次递增的计数器。`<p>`\
  \ 标签被赋予了 `id` 值 `\"showText\"`，且 `Update()` 函数包含两行代码，告诉脚本文本应该放置这两个标签之间：\n\n```javascript\n\
  textField = document.getElementById(\"showText\");\ntextField.innerHTML = \"The\
  \ counter is now at \" + counter;\n```\n\n第一行创建了一个名为 `textField` 的变量，它持有 `id` 值为\
  \ `\"showText\"` 的元素的值。第二行表示，给定该值的情况下，关于计数器的文本和计数器数字应该放置在 `id` 值为 `\"showText\"\
  ` 的元素的起始和结束标签之间——这就是 `innerHTML` 方法的作用。\n\n在脚本加载并开始计数后，你可以使用 Reset 按钮重新开始计数，并使用\
  \ Stop 按钮停止计数。\n\n此脚本在页面加载时以及每次更新时都会调用 `setTimeout()` 方法。`Update()` 函数执行更新，将计数器加\
  \ 1 并设置下一次超时。Reset 按钮将计数器置为零，而 Stop 按钮演示了 `clearTimeout()` 方法。`图 20.2` 显示了计数器运行一段时间后超时器示例的显示。\n\
  \n**图 20.2** 超时器示例的输出。\n\n![image](img/20fig02.jpg)\n\n### 显示对话框 (Displaying Dialog\
  \ Boxes)\n\n`window` 对象包含了三个用于显示消息和与用户交互的有用方法。你已经在某些脚本中使用过它们。以下是总结：\n\n- `window.alert(message)`\
  \ 显示一个警报对话框。该对话框只是给用户提供一条消息。\n- `window.confirm(message)` 显示一个确认对话框。它显示一条消息并包含 OK（确定）和\
  \ Cancel（取消）按钮。如果点击 OK，该方法返回 `true`；如果点击 Cancel，返回 `false`。\n- `window.prompt(message,default)`\
  \ 显示一条消息并提示用户输入。它返回用户输入的文本。如果用户没有输入任何内容，则使用默认值。\n\n***\n\n**提示 (Tip)**\n\n在引用这些方法时，通常可以省略\
  \ `window` 对象，因为它是脚本的默认上下文（例如，`alert(\"text\")`）。\n\n***\n\n要使用 `confirm` 和 `prompt`\
  \ 方法，请使用变量来接收用户的响应。例如，此语句将显示一个提示框并将用户输入的文本存储在 `text` 变量中：\n\n```javascript\ntext\
  \ = window.prompt(\"Enter some text\",\"Default value\");\n```\n\n作为对这类对话框的进一步说明，`示例\
  \ 20.4` 显示了一个使用按钮和事件处理程序让你能够测试对话框的 HTML 文档。\n\n示例 20.4 使用 JavaScript 显示警报、确认和提示的\
  \ HTML 文档\n\n***\n\n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>警报、确认和提示 (Alerts, Confirmations, and Prompts)</title>\n  </head>\n  <body>\n\
  \    <h1>警报、确认和提示</h1>\n    <p>使用下面的按钮测试 JavaScript 中的对话框。</p>\n  <form name=\"\
  winform\">\n    <div>\n      <input type=\"button\" value=\"Display an Alert\" onclick=\"\
  window.alert('This is a test alert.')\" />\n      <input type=\"button\" value=\"\
  Display a Confirmation\" onclick=\"window.confirm('Would you like to confirm?');\"\
  \ />\n      <input type=\"button\" value=\"Display a Prompt\" onclick=\"window.prompt('Enter\
  \ Text:', 'This is the default.');\" />\n    </div>\n  </form>\n  </body>\n</html>\n\
  ```\n\n***\n\n此文档显示了三个按钮，每个按钮都使用事件处理程序来显示其中一个对话框。\n\n`图 20.3` 显示了 `示例 20.4` 中脚本的运行情况。提示对话框当前正在显示，并显示了默认值。\n\
  \n**图 20.3** 对话框示例的输出，包括一个提示对话框。\n\n![image](img/20fig03.jpg)\n\n### 使用框架 (Working\
  \ with Frames)\n\n浏览器还支持框架（frames），它允许你将浏览器窗口分为多个窗格。每个框架可以包含一个独立的 URL 或脚本的输出。\n\n\
  你可能访问过某些网站，在这些网站中，浏览器窗口似乎允许你在几个不同的页面之间移动。事实是，浏览器实际上通过将浏览器窗口划分为包含独立网页的区域，允许你同时查看多个页面；每个区域被称为一个框架（frame）。当然，从用户的角度来看，一切都组合成了一个单一的网络内容窗口，但实际上有独立的页面在运行。\n\
  \n框架是浏览器窗口内的一个矩形区域，与其他框架中的其他页面一起显示网页。初看之下，`图 20.4` 看起来像是一个普通的网页，但它实际上是两个独立的 HTML\
  \ 文档，都显示在同一个浏览器窗口中。每个页面都显示在自己的框架中，水平排列，并由水平条隔开。\n\n**图 20.4** 框架允许同时显示多个网页。\n\n\
  ![image](img/20fig04.jpg)\n\n如果使用框架，它们通常用于创建一个利用一组静态导航链接的框架化站点；你可以在 `图 20.4` 的顶部框架中看到这些链接。当点击示例中的任何链接时，顶部框架不会改变；新页面将加载并显示在底部框架中（参见\
  \ `图 20.5`）。\n\n**图 20.5** 点击会产生新的底部页面，但保持顶部框架不变。\n\n![image](img/20fig05.jpg)\n\
  \n你应该意识到，框架长期以来一直是 Web 设计中一个棘手的问题。它的优点从未真正超过过缺点，但由于浏览器对 HTML 和 CSS 标准的支持差异，框架被视为实现某些目标的方法。作为\
  \ Web 开发者，我不建议使用框架，原因如下：\n\n- 框架违背了 Web 的基本概念，即通过单一网络地址（URL）访问单个网络实例之间的超文本连接。\n\
  - 打印框架化站点的部分非常困难；除非你点击想要打印的特定框架，并从上下文菜单（如果可用）选择“打印此框架”，否则打印的只是框架集本身，里面没有任何内容。\n\
  - 如果框架缺乏正确的代码，或者代码正确但被用于不当目的，用户可能会被困在框架站点内部，无法查看框架外部的内容。\n- 在历史上，框架被用来取代标准的、专业的、可访问的\
  \ Web 开发和设计方法。在有更好的 CSS 布局方案的情况下，没有理由选择较差的方案。\n- 出于这些（以及其他）原因，框架已从 HTML5 标准中移除。旧的\
  \ `<frame />`、`<frameset>` 和 `<noframes>` 标签在未来将不再可用。\n\n\n\n\n\n尽管有这些缺点，在接下来的几个章节中，你将学习如何创建一个非常简单的框架网站（framed\
  \ site）。你很可能仍然遇到框架网站，并且你可能需要知道如何在不使用框架的情况下重新创建网站的视觉效果和感受。在这种情况下，理解框架是如何构建的至关重要，这样你才能成功地解构它们。\n\
  \n此外，你将学习一种类型的框架——`<iframe>`，它确实起着重要作用，并且在 HTML5 中仍然存在。\n\n## 构建框架集 (Frameset)\n\
  \n本节将向你展示如何创建图 20.4 和图 20.5 所示的简单框架网站。每个框架的内容都是作为普通的 HTML 页面创建的。这些页面分别是 [top.html](http://top.html)（用于导航）、[home.html](http://home.html)、[products.html](http://products.html)、[services.html](http://services.html)以及\
  \ [contact.html](http://contact.html)。这些页面不包含任何你在其他章节中见过的标签。使用一个名为框架集文档（frameset\
  \ document）的特殊页面将这些页面组合在一起；在这种情况下，该文档是 [index.html](http://index.html)。\n\n### 创建框架集文档\n\
  \n`frameset document` 是一个 HTML 页面，它指示浏览器将其窗口分割成多个框架，并指定每个框架中应该显示哪个网页。\n\n框架集文档实际上没有内容。它只告诉浏览器加载哪些其他页面以及如何在浏览器窗口中排列它们。列表\
  \ 20.5 显示了所示图 20.4 和图 20.5 中示例框架网站的框架集文档。\n\n列表 20.5 图 20.4 和图 20.5 所示网站的框架集文档\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.0 Frameset//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n\
  <html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Sample\
  \ Framed Site</title>\n  </head>\n  <frameset rows=\"50,*\">\n    <frame src=\"\
  top.html\" name=\"top\" />\n    <frame src=\"home.html\" name=\"main\" />\n    <noframes>\n\
  \      <body>\n        <h1>Sample Framed Site</h1>\n        Your browser does not\
  \ support frames. Sorry!\n      </body>\n    </noframes>\n  </frameset>\n</html>\n\
  ```\n\n列表 20.4 使用了 `<frameset>` 标签而不是 `<body>` 标签。任何通常包含在 `<body>` 标签中的标签都不能出现在\
  \ `<frameset>` 标签内。此示例中的 `<frameset>` 标签包含一个 `rows` 属性，这意味着框架应该像表格的水平行一样堆叠在一起。如果你想让框架并排，请使用\
  \ `cols` 属性（而不是 `rows` 属性）。\n\n**注意**\n\n需要注意的是，此示例页面使用的 DTD 并不是你整本书中一直在使用的熟悉的 XHTML\
  \ 1.1 DTD。这是因为标准的 XHTML 1.1 DTD 不支持框架。因此，若要对带有框架的页面进行验证，你必须使用 XHTML 1.0 Frameset\
  \ DTD，这是专门为使用框架的页面设计的特殊 DTD。\n\n你必须指定 `rows` 或 `cols` 的大小，可以是精确的像素值，也可以是浏览器窗口总大小的百分比。你还可以使用星号（`*`）来指示框架应该填充窗口中任何可用空间。如果有多个一个框架具有\
  \ `*` 值，剩余空间将会在它们之间平均分配。\n\n在列表 20.5 中，`<frameset rows=\"50,*\">` 将窗口垂直分割为两个框架。顶部框架将恰好为\
  \ 50 像素高，底部框架将占据窗口中所有剩余空间。顶部框架包含文档 [`top.html`](http://top.html)（见列表 20.6），底部框架包含\
  \ [`home.html`](http://home.html)（见列表 20.7）。\n\n列表 20.6 示例框架网站的 [`top.html`](http://top.html)\
  \ 导航栏\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Sample Framed Site</title>\n    <style type=\"text/css\">\n      body {\
  \ background-color:#5F9F9F; }\n      a { color: #FFFFFF; }\n      .main {\n    \
  \    text-align:center;\n        color:#FFFFFF;\n        font-weight:bold;\n   \
  \     font-size:16pt;\n      }\n    </style>\n  </head>\n  <body>\n    <div class=\"\
  main\">\n      <a href=\"top.html\" target=\"main\">HOME</a> ::\n      <a href=\"\
  home.html\" target=\"main\">PRODUCTS</a> ::\n      <a href=\"services.html\" target=\"\
  main\">SERVICES</a> ::\n      <a href=\"contact.html\" target=\"main\">CONTACT</a>\n\
  \    </div>\n  </body>\n</html>\n```\n\n**提示**\n\n在列表 20.6 的框架集之后，`<body>` 和 `</body>`\
  \ 之间有一个完整的网页。注意，该页的内容不在图 20.4 或图 20.5 中。所有支持框架的浏览器都会忽略 `<noframes>` 和 `</noframes>`\
  \ 标签之间的内容。\n\n现在的各大浏览器都支持框架，因此框架的兼容性问题现在比过去小得多。尽管如此，包含 `<noframes>` 标签是为了涵盖可能仍在使用旧浏览器的用户——如果他们使用框架的话。\n\
  \n列表 20.7 示例框架网站内的 [`home.html`](http://home.html) 单框架\n\n```\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Sample Framed Site</title>\n    <style\
  \ type=\"text/css\">\n      body { background-color:#5F9F9F; }\n      a { color:\
  \ #FFFFFF; }\n      .main {\n        text-align:center;\n        color:#FFFFFF;\n\
  \        font-weight:bold;\n        font-size:16pt;\n      }\n    </style>\n  </head>\n\
  \  <body>\n    <div class=\"main\">\n      <a href=\"top.html\" target=\"main\"\
  >HOME</a> ::\n      <a href=\"home.html\" target=\"main\">PRODUCTS</a> ::\n    \
  \  <a href=\"services.html\" target=\"main\">SERVICES</a> ::\n      <a href=\"contact.html\"\
  \ target=\"main\">CONTACT</a>\n    </div>\n  </body>\n</html>\n```\n\n\n\n\n\n当你在\
  \ `<frame />` 标签中使用 `name` 属性为框架指定一个唯一名称时，框架的真正威力开始显现。你可以使用 `<a>` 标签中的 `target`\
  \ 属性让页面上的任何链接改变该框架的内容。例如，Listing 20.6 包含了以下标签：\n\n```html\n<frame src=\"home.html\"\
  \ name=\"main\" />\n```\n\n这段代码在页面加载时在该框架中显示 [`home.html`](http://home.html) ，并将框架命名为\"\
  main\"。\n\n注意\n从技术上讲，`name` 标签已经过时，并被 `id` 标签所取代。\n\n然而，在识别作为目标的框架时，目前的网页浏览器仍然依赖\
  \ `name` 而不是 `id`，且使用 `name` 在 XHTML 中仍然是有效的。因此，目前在识别框架时，你需要坚持使用 `name` 属性。当然，同时使用这两个属性也无害处。\n\
  \n在顶部框架的代码中（如 Listing 20.7 所示），你会看到如下链接：\n\n```html\n<a href=\"services.html\" target=\"\
  main\">SERVICES</a>\n```\n\n当用户点击此链接时 [`services.html`](http://services.html) 将在名为\
  \ `main` 的框架（下方框架）中显示。如果漏掉了 `target=\"main\"` 属性，[`services.html`](http://services.html)\
  \ 页面将在当前（顶部）框架中显示。\n\n### 修改框架边界\n\n你可以配合框架代码使用一些 HTML 属性来消除框架分割线、通过缩小边距大小为小框架留出空间，并强制框架不显示滚动条。Listing\
  \ 20.8 显示了 Listing 20.4 代码的修改版本。代码中的两处更改是在 `<frame>` 标签中添加了以下属性：`scrolling`=`\"\
  no\"` 和 `frameborder`=`\"0\"`。\n\nListing 20.8 Figure 20.6 所示网站的 Frameset 文档\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.0 Frameset//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n\
  <html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Sample\
  \ Framed Site</title>\n  </head>\n  <frameset rows=\"50,*\">\n    <frame src=\"\
  top.html\" name=\"top\" scrolling=\"no\" frameborder=\"0\" />\n    <frame src=\"\
  home.html\" name=\"main\" scrolling=\"no\" frameborder=\"0\"/>\n    <noframes>\n\
  \      <body>\n        <h1>Sample Framed Site</h1>\n        Your browser does not\
  \ support frames. Sorry!\n      </body>\n    </noframes>\n  </frameset>\n</html>\n\
  ```\n\n```\n**Figure 20.6** 这是页面在向 `<frame />` 标签添加属性后，Listing 20.8 中所示的代码页面。\n\n\
  ![image](img/20fig06.jpg)\n```\n\n### 使用 JavaScript 对象处理框架\n\n当一个窗口包含多个框架时，每个框架在\
  \ JavaScript 中由一个 `frame` 对象表示。该对象等同于 `window` 对象，但它专门用于处理该框架。`frame` 对象的名称与你在 `<frame>`\
  \ 标签中赋予它的 `NAME` 属性相同。\n\n还记得指向当前窗口的 `window` 和 `self` 关键字吗？当你使用框架时，这些关键字将指代当前框架。另一个关键字\
  \ `parent` 允许你引用主窗口。\n\n窗口中的每个 `frame` 对象都是 `parent` 窗口对象的子。假设你使用以下 HTML 定义了一组框架：\n\
  \n```html\n<frameset rows=\"*,*\" cols=\"*,*\">\n<frame name=\"topleft\" src=\"\
  topleft.html\">\n<frame name=\"topright\" src=\"topright.html\">\n<frame name=\"\
  bottomleft\" src=\"botleft.html\">\n<frame name=\"bottomright\" src=\"botright.html\"\
  >\n</frameset>\n```\n\n注意\n如果使用嵌套框架集，情况会复杂一些。`window` 仍然代表当前框架，`parent` 代表包含当前框架的\
  \ frameset，而 `top` 代表包含所有其他框架的主 frameset。\n\n这只是将窗口划分为四分之一。如果你在 [`topleft.html`](http://topleft.html)\
  \ 文件中有 JavaScript 脚本，它将通过 `parent.topright`、`parent.bottomleft` 等引用其他窗口。`window`\
  \ 和 `self` 关键字将引用 `topleft` 框架。\n\n### `frames` 数组\n\n与其通过名称引用文档中的框架，你可以使用 `frames`\
  \ 数组。该数组存储了关于文档中每个框架的信息。框架的索引从 0 开始，从 frameset 文档中的第一个 `<frame>` 标签开始。\n\n例如，你可以使用数组引用引用上一个示例中定义的框架：\n\
  \n- `parent.frames[0]` 等于 `topleft` 框架。\n- `parent.frames[1]` 等于 `topright` 框架。\n\
  - `parent.frames[2]` 等于 `bottomleft` 框架。\n- `parent.frames[3]` 等于 `bottomright`\
  \ 框架。\n\n你可以交替使用这两种方法来引用框架，根据你的应用程序，你应该使用最方便的方法。例如，一个包含 10 个框架的文档可能通过数字更易使用，但如果框架具有意义的名称，一个简单的双框架文档则更容易使用。\n\
  \n### 使用内联框架 (Inline Frames)\n\n内联框架没有与普通框架相同的可用性问题，但使用内联框架的原因不同`<iframe>` 并不是纯粹的布局技巧，它的用法类似于\
  \ `<object>` 标签——在现有文档中放置部分内容。在 `<object>` 标签的情况下，该“内容”通常是多媒体。你可以使用 `<iframe>` 来嵌入一个完全独立的\
  \ HTML 文档、图像或其他源。Listing 20.9 和 Listing 20.10 显示了生成 Figure 20.7 所示内联框架的代码。\n\n```\n\
  **Figure 20.7** Listing 20.9 调了代码在 Listing 20.10 中所示的内联框架。\n\n![image](img/20fig07.jpg)\n\
  ```\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Frameset//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Sample Framed Site</title>\n  </head>\n  <frameset rows=\"50,*\">\n   \
  \ <frame src=\"top.html\" name=\"top\" scrolling=\"no\" frameborder=\"0\" />\n \
  \   <frame src=\"home.html\" name=\"main\" scrolling=\"no\" frameborder=\"0\"/>\n\
  \    <noframes>\n      <body>\n        <h1>Sample Framed Site</h1>\n        Your\
  \ browser does not support frames. Sorry!\n      </body>\n    </noframes>\n  </frameset>\n\
  </html>\n```\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml1.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Using an iframe</title>\n    <style type=\"text/css\">\n      body { background:#CCCCCC;\
  \ }\n      iframe {\n        width: 500px;\n        height: 100px;\n      }\n  \
  \  </style>\n  </head>\n  <body style=\"background:#CCCCCC\">\n    <h1 style=\"\
  text-align:center\">Inline Frame Example</h1>\n    <div style=\"text-align:center\"\
  >\n      <iframe src=\"iframe.html\">\n        <p>Uh oh...your browser does not\
  \ support iframes.</p>\n      </iframe>\n    </div>\n  </body>\n</html>\n```\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>iframe source</title>\n\
  \    <style type=\"text/css\">\n      body { background-color:#FFFFFF; }\n     \
  \ p {\n        color: #FF0000;\n        font-weight: bold;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    <p>I AM A SOURCE DOCUMENT...inside an iframe.</p>\n  </body>\n\
  </html>\n```\n\n你在 Listing 20.9 中尚未遇到的唯一 XHTML 代码是 `<iframe>` 本身。\n\n\n\n\n\n内联框架（Inline\
  \ frames）通常用于从其他网站引入内容。常见用途包括从第三方广告服务向用户投放广告，以及使用 Google 站点搜索（Site Search）向用户显示搜索结果（利用\
  \ Google 的搜索技术）。图 20.8 展示了一个使用 `<iframe>` 将搜索结果拉取到自定义网站模板中的实例。\n\n**图 20.8** 使用\
  \ `<iframe>` 显示 Google 自定义搜索结果。\n\n![image](img/20fig08.jpg)\n\n在图 20.8 中，白色区域的所有内容实际上都是\
  \ `<iframe>` 中的内容，其源是 Google 网站上的一个脚本，该脚本运行并在 Digital Inspiration 网站的模板内显示内容。如果你仔细观察图\
  \ 20.8——我不认为你在图中能看到——你可以看到实际 `<iframe>` 本身周围有一圈浅灰色的边框。\n\n与你在本章早些时候学到的 `<frame />`\
  \ 不同，`<iframe>` 将长期存在，并且仍然是 HTML5 的一部分。\n\n## 总结\n\n在本章中，你学习了如何使用 `window` 对象来处理浏览器窗口，并使用了它的属性和方法来设置超时和显示对话框。你还学习了\
  \ JavaScript 如何与框架文档协作。\n\n至于框架文档本身，你学习了如何通过将浏览器窗口拆分为多个框架来同时显示多个页面。你学习了如何使用 frameset\
  \ 文档来定义框架的大小和布局，以及哪些网页内容将加载到每个框架中。你学习了如何创建链接来更改所选任何框架的内容，同时保持其他框架不变。你还学习了几个控制框架中可调整边框和滚动条外观的可选设置。最后，你学习了如何使用内联框架来显示来自你的网站或其他网站的内容。\n\
  \n表 20.1 总结了本章涵盖的标签和属性。\n\n表 20.1 第 20 章 涵盖的 HTML 标签和属性\n\n![image](img/20tab01.jpg)![image](img/20tab01a.jpg)\n\
  \n## 问答\n\n**Q. 当脚本在由另一个脚本创建的窗口中运行时，它如何引用回原始窗口？**\n\n**A.** JavaScript 包含了 `window.opener`\
  \ 属性，允许你引用打开当前窗口的那个窗口。\n\n**Q. 当用户点击单个链接时，我如何同时更新两个框架？**\n\n**A.** 你可以通过使用事件处理器并包含两个将\
  \ URL 加载到不同框架的语句来实现这一点。\n\n**Q. 我可以同时在一个框架中显示其他用户的网页，在另一个框架中显示自己的页面吗？如果那些其他网站也使用框架呢？**\n\
  \n**A.** 你可以从互联网（或内网）的任何地方将任何文档加载到框架中。如果该文档是一个 frameset，它的框架大小将调整，以适应你加载它的现有框架。\n\
  \n例如，你可以在一个框架中放置你喜爱的链接列表，并使用另一个框架来显示这些链接指向的页面。这可以轻松地提供指向其他网站的链接，而必担心有人会迷失且再也回到你的网站。\n\
  \n你应该意识到，将他人的页面嵌入使其看起来像自己网站的一部分可能会导致你陷入法律麻烦，因此请确保从任何你计划将其页面放入框架之一的人那里获得明确的书面许可（就像你把他们网站的图像或文本放在你自己的页面上时一样）。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看随后的“答案”部分之前，尝试回答所有问题。\n\n## 测验\n\n**1.**\
  \ 下列哪个方法会显示一个带有确定和取消按钮的对话框并等待响应？\n\n**a.** `window.alert`\n\n**b.** `window.confirm`\n\
  \n**c.** `window.prompt`\n\n**2.** `window.setTimeout` 方法的作用是什么？\n\n**a.** 在延迟后执行\
  \ JavaScript 语句\n\n**b.** 锁定浏览器指定的时间的时间\n\n**c.** 设置浏览器自动退出之前的时间\n\n**3.** 你正在处理一个包含三个名为\
  \ `first`、`second` 和 `third` 框架的文档。如果第二个框架中的脚本需要引用第一个框架，正确的语法是什么？\n\n**a.** `window.first`\n\
  \n**b.** `parent.first`\n\n**c.** `frames.first`\n\n**4.** 什么样的 `<iframe>` 代码会产生一个无边框、白色背景的\
  \ `<iframe>`，占据页面宽度的 98%，高为 250 像素？\n\n## 答案\n\n**1.** b. `window.confirm` 方法显示一个带有确定和取消按钮的对话框。\n\
  \n**2.** a. `window.setTimeout` 方法在延迟后执行 JavaScript 语句。\n\n**3.** b. 第二个框架中的脚本将使用\
  \ `parent.first` 来引用第一个框架。\n\n**4.** 使用以下代码：\n\n```\n<iframe src=\"some_source.html\"\
  \ style=\"width:98%;height:250px;\n    border:none; background-color:#FFFFFF;\"\
  >\n  <p>对于无法看到内联框架的人在此处放置消息。</p>\n</iframe>\n```\n\n## 练习\n\n• 使用超时和 JavaScript\
  \ 显示日期和时间（你之前在本书的其他部分学过），创建一个脚本，每秒或两秒自动重新加载一次以显示“实时”时钟。\n\n• 思考你可以在你的网站中使用一个或两个\
  \ `<iframe>` 的方法——也许用于广告，或者利用你可以提供给用户的免费 Google 站点搜索。在你的设计中为该元素留出空间。\n\n# 第五部分 高级\
  \ JavaScript 编程\n\n## 第 21 章 使用非干扰式 JavaScript\n\n* *\n\n在本章中将学到：\n\n• 创建非干扰式脚本的最佳实践\n\
  • 分离内容、演示和行为\n• 遵循 Web 标准创建跨浏览器脚本\n• 读取和显示浏览器信息\n• 使用特性检测 (feature sensing) 来避免错误\n\
  • 支持不支持 JavaScript 的浏览器\n\n* * *\n\n在本章中，你将学习一些用于创建易于维护、易于使用且符合 Web 标准的脚本和页面指南。这被称为*非干扰式脚本\
  \ (unobtrusive scripting)*：脚本添加功能，而不会阻碍用户、维护代码的开发者或构建网站布局的设计师。你还将学习如何确保你的脚本在多个浏览器中都能工作，并且不会在新浏览器出现时停止工作。\n\
  \n### 脚本最佳实践\n\n当你开始开发更复杂的脚本时，了解一些脚本*最佳实践*是非常重要的。这些是经验丰富的程序员通过教训学到的 JavaScript 使用指南。以下是遵循这些最佳实践的几个益处：\n\
  \n• 你的代码将是易读且易于维护的，无论你是将页面交给别人，还是试图记住你一年前做了什么。\n• 你创建的代码将遵循标准，不会因为特定浏览器的新版本而瘫痪。\n\
  • 你创建的页面即使在没有 JavaScript 的情况下也能运行。\n• 你为一个网站创建的代码将很容易适配到另一个网站或项目。\n• 你的用户将感谢你创建了一个易于使用且在出现问题时易于修复的网站。\n\
  \n无论你是编写整个 AJAX Web 应用程序，还是仅仅用三行脚本增强页面，了解一些那些职业编写复杂脚本的人经常考虑的概念都是很有用的。接下来的章节将介绍其中一些最佳实践。\n\
  \n#### 内容、演示和行为\n\n\n\n\n\n当你创建一个网页时，特别是创建一个整个网站或应用程序时，你正在处理的是三个关键领域：*内容*、*表现*和*行为*——这些你已经在之前的章节中学习过了。\n\
  \n- *内容*（Content）由访问者可以在你的页面上阅读的文字组成。你将内容创建为文本并使用 `HTML` 对其进行标记，以定义不同类型的内容——标题、段落、链接等。\n\
  - *表现*（Presentation）是指每个页面上文字的外观和布局——文本格式、字体、颜色和图形。虽然在 Web 早期，仅使用 `HTML` 创建表现是常见做法，但你现在可以使用层级样式表（`CSS`）来定义表现。\n\
  - *行为*（Behavior）是你与页面交互时发生的情况——例如当鼠标悬停时会高亮的项目、可以提交的表单等。这就是 `JavaScript` 发挥用场的地方，以及如\
  \ `PHP` 等服务器端语言。\n\n在心中记住这三个领域是一个好主意，特别是当你创建规模较大的网站时。理想情况下，你希望尽可能将内容、表现和行为分离。实现这一点的良好方法是为表现创建一个外部\
  \ `CSS` 文件，为行为创建一个外部 `JavaScript` 文件，并将它们链接到 `HTML` 文档中。\n\n像这样保持分离使得维护大型网站变得更容易——例如，如果你需要更改标题的颜色，只需对\
  \ `CSS` 文件进行快速编辑，而无需遍历所有的 `HTML` 标记来寻找正确的编辑位置。它还让你能够在网站的多个页面上复用相同的 `CSS` 和 `JavaScript`。最后但同样重要的是，这将鼓励你在每种语言所擅长的地方使用它，从而让你的工作变得轻松。\n\
  \n## 渐进式增强\n\nWeb 设计中的一个旧流行术语是*优雅降级*（graceful degradation）。其理念是，你可以构建一个利用了最新浏览器所有功能的网站，只要它能够在旧版浏览器上“优雅地降级”并运行即可。这在很大程度上意味着在几个旧版浏览器上进行测试并希望它能正常工作，而且在不支持最新功能的浏览器中始终存在出现问题的可能。\n\
  \n讽刺的是，你可能会认为缺乏最新功能的浏览器是那些更旧、更不流行的浏览器，但一些最大的问题却出现在全新的浏览器上——那些手机手机和其他新设备自带的浏览器，与计算机上运行的最新浏览器相比，它们都是非常原始的。\n\
  \n一种解决此问题的 Web 设计新方法是*渐进式增强*（progressive enhancement）。其理念是为所有用户提供基础体验，然后为支持这些功能的浏览器添加高级功能。以下是一些指导准则：\n\
  \n- 通过添加 `CSS` 来增强表现。\n- 通过添加 `JavaScript` 来增强行为。\n\n- 像这样保持分离将鼓励你在每种语言所擅长的地方使用它。\n\
  \n## 事件处理器\n\n添加事件的简单方法是使用元素的 `onclick` 属性。例如：\n\n```javascript\nobj.onclick = Startup;\n\
  ```\n\n然而，这使得每个元素只允许一个事件处理器。要添加多个处理器，可以使用现代浏览器中提供的 `addEventListener` 方法：\n\n```javascript\n\
  window.addEventListener('click', Startup, false);\n```\n\n`addEventListener()` 的第一个参数是不带\
  \ `on` 前缀的事件名称。第二个参数指定了处理事件的函数，第三个是一个指示如何处理事件的高级标志位。\n\n要移除事件处理器，请使用 `removeEventListener`：\n\
  \n```javascript\nwindow.removeEventListener('load', Startup, false);\n```\n\nW3C\
  \ 模型的问题在于 Internet Explorer（第 6、7 和 8 版本）不支持它。相反，它支持一种专有方法 `attachEvent()`，其功能非常相似：\n\
  \n```javascript\nwindow.attachEvent('onload', Startup);\n```\n\n`attachEvent()`\
  \ 方法有两个参数。第一个是带有 `on` 前缀的事件。第二个是用于处理该事件的函数。\n\n\n\n\n\n许多通用函数可以弥补缺乏一致绑定事件方式的不足。如果你正在使用第三方库，很有可能它已经包含一个事件函数，可以为你简化这一过程。\n\
  \n## 提示\nYahoo! UI 库像许多其他第三方库一样，包含一个事件处理函数，它可以在任何浏览器中绑定事件，一次性向多个对象绑定相同的事件处理程序，以及其他优秀功能。详情请参阅\
  \ [`developer.yahoo.net/yui/`](http://developer.yahoo.net/yui/)，并参阅第 22 章“使用第三方库”，获取有关使用其他各种可用库的信息。\n\
  \n## Web 标准：避免特定于浏览器\n\nWeb 是建立在标准之上的，例如由 W3C 开发的 HTML 标准。现在有许多标准涉及 JavaScript——`CSS`、`W3C\
  \ DOM` 以及定义 JavaScript 语法的 `ECMAScript` 标准。\n\n微软、Mozilla 项目、Google 以及如 Opera Software\
  \ 等其他浏览器开发者不断改进他们的浏览器对 Web 标准的支持，但总会有某些特定浏览器的非标准特性，而且最新标准的部分内容在不同浏览器之间无法获得一致的支持。\n\
  \n尽管在多个浏览器中测试你的代码并尽一切手段让其运行是完全可以的，但在可能的情况下遵循标准而非特定浏览器的技术是一个好主意。这确保了你的代码可以在未来改进了标准支持的浏览器上运行，而特定浏览器的特性可能会在新版本中消失。\n\
  \n### 注意\n确保你遵循标准的原因之一是，你的页面可以被搜索引擎更好地地解析，这通常有助于你的网站获得搜索流量。将内容、演示和行为分离对对引擎也有好处，因为它们可以专注于你网站的\
  \ HTML 内容，而无需跳过 JavaScript 或 `CSS`。\n\n## 代码的文档化\n\n当你创建越来越复杂的脚本时，不要忘记在代码中包含注释来记录它的功能，特别是当某些代码看起来很困惑或难以运行的时候。记录大型脚本中使用的所有数据结构、变量和函数参数也是一个好主意。\n\
  \n注释是组织代码的好方法，并将帮助你以后处理该脚本。如果你以此为生，你绝对需要使用注释，以便他人能够像你一样轻松地处理你的代码。\n\n## 可用性\n\n\
  当你为网站添加酷炫的功能时，不要忘记`易用性`（usability）——为网站用户提供尽可能简单、逻辑且方便的服务。虽然有很多书籍和网站致力于可用性信息，但一点常识就能起很大作用。\n\
  \n例如，假设你使用下拉列表作为在网站页面间导航的唯一方式。这是 JavaScript 的常见用法，而且效果良好，但它好用吗？尝试将其与页面顶部的一组简单链接进行比较。\n\
  \n- 链接列表让你一目了然看到网站的内容；而下拉列表需要你点击才能查看相同的列表。\n- 用户期待链接并能快速发现它们——下拉列表更有可能是表单而非导航工具，因此当他们想要导航你的网站时，它不会是他们寻找的第一元素。\n\
  - 使用链接导航只需点击一次——使用下拉列表导航至少需要点击两次。\n\n每当你向网站添加 JavaScript 时，请记住考虑用户的角度，并确保你正在让网站变得更容易用——至少不要变得更难用。此外，确保网站在没有\
  \ JavaScript 的情况下也能易用；虽然这可能只适用于一小部分用户，但这部分用户可能包含屏幕阅读器或其他视觉视障人士必需的软件软件包的用户。\n\n##\
  \ 设计模式\n\n如果你学习更多关于可用性的知识，无疑会看到`设计模式`（design patterns）被提到。这是一个计算机科学术语，意味着“常见问题的最佳解决方案”。在\
  \ Web 开发中，设计模式是网站管理员反复遇到的网站部分内容的设计和实现方法。\n\n例如，如果你有一个显示多个数据页的网站，你将会有“下一页”和“上一页”链接，可能还有每个页的数字链接。这是一种常见的设计模式——许多网页设计师必须解决的问题，并且有一个通常公认的解决方案。其他常见的\
  \ Web 设计模式还包括登录表单、搜索引擎或网站的导航链接列表。\n\n当然，你可以完全原创，创建一个看起来与任何地方都完全不一样的搜索引擎、购物车或登录表单，但除非你有方法让它们变得更加易用，否则你最好遵循该模式并给你的用户提供符合他们预期的体验。\n\
  \n虽然你只需通过浏览与你网站类似的网站并注意它们如何解决特定问题就能找到一些常见的设计模式，但也有专门记录这些模式的网站，如果你需要关于如何让你的网站运行的想法，那里是很好的起点。\n\
  \n## 提示\nYahoo! 开发者网络记录了其站点网络使用的各种设计模式，其中许多是用 JavaScript 实现的：[`developer.yahoo.net/ypatterns/`](http://developer.yahoo.net/ypatterns/)\n\
  \n## 无障碍性\n\n可用性的最后一个考虑方面是`无障碍性`（accessibility）——让你的网站对所有用户（包括残障人士）都尽可能可用。例如，盲人可能使用文本读取程序来读取你的网站，该程序会忽略图像大部分脚本。无障碍性不仅是良好的表现，在某些国家还是法律强制要求的。\n\
  \n### 注意\n确保网站在没有 JavaScript 的情况下运行是实现无障碍标准的第一步之一。更多关于无障碍性的信息，请参阅 [`www.w3.org/WAI/`](http://www.w3.org/WAI/)。\n\
  \n无障碍性主题很复杂，但你可以遵循渐进增强的哲学来实现大部分：保持 HTML 尽可能简单，保持 JavaScript 和 CSS 分离，让 JavaScript\
  \ 成为使用你网站的增强而非要求。\n\n### 读取浏览器信息\n\n在第 15 章“[使用文档对象模型 (DOM)#ch15.html_ch15)”中，你学习了代表浏览器窗口部分和当前\
  \ Web 文档的各种对象（如 `window` 和 `document`）。JavaScript 还包含一个名为 `navigator` 的对象，你可以用它读取有关用户浏览器的信息。\n\
  \n`navigator` 对象不是 DOM 的一部分，因此可以直接引用它。它包含了许多属性，每个属性都会告诉你一些关于浏览器的信息。这些包括：\n\n- `navigator.appCodeName`\
  \ 是浏览器的内部代号，例如 Mozilla。\n- `navigator.appName` 是浏览器的名称，例如 Netscape 或 Microsoft Internet\
  \ Explorer。\n- `navigator.appVersion` 是正在使用的浏览器版本——例如 5.0 (Windows)。\n- `navigator.userAgent`\
  \ 是用户代理头，是浏览器在请求 页面时发送到 Web 服务器的字符串。它包含了完整的版本信息——例如 Mozilla/5.0 (Windows NT 6.1;\
  \ WOW64; rv:5.0) Gecko/20100101 Firefox/5.0。\n- `navigator.language` 是浏览器的语言（如英语或西班牙语）。它以代码形式存储，例如代表美国英语的\
  \ `en_US`。此属性受 Chrome、Firefox、Opera 和 Safari 支持。\n\n\n\n\n\n正如你可能猜到的那样，`navigator`\
  \ 对象是以 Netscape Navigator 命名的，这是最初支持 JavaScript 的浏览器。幸运的是，这个对象也被 Internet Explorer\
  \ 以及大多数其他现代浏览器支持。\n\n• `navigator.platform` 是当前浏览器的计算机平台。这是一个短字符串，例如 Linux i686、Win32\
  \ 或 MacPPC。你可以用它来启用任何特定平台的特性——例如 ActiveX 组件。\n\n## 显示浏览器信息\n\n作为如何读取 `navigator`\
  \ 对象属性的示例，列表 21.1 显示了一个脚本，该脚本可以显示当前浏览器的属性列表及其值。\n\n列表 21.1 用于显示浏览器信息的脚本\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Browser Information</title>\n\
  \  </head>\n  <body>\n    <h1>Browser Information</h1>\n    <p>所选的`navigator` 对象包含关于你正在使用的浏览器的以下信息：</p>\n\
  \    <script type=\"text/javascript\">\n      document.write(\"<ul>\");\n      document.write(\"\
  <li><strong>Code Name:</strong> \" + navigator.appCodeName);\n      document.write(\"\
  <li><strong>App Name:</strong> \" + navigator.appName);\n      document.write(\"\
  <li><strong>App Version:</strong> \" + navigator.appVersion);\n      document.write(\"\
  <li><strong>User Agent:</strong> \" + navigator.userAgent);\n      document.write(\"\
  <li><strong>Language:</strong> \" + navigator.language);\n      document.write(\"\
  <li><strong>Platform:</strong> \" + navigator.platform);\n      document.write(\"\
  </ul>\");\n    </script>\n  </body>\n</html>\n```\n（注：原文代码中存在多余的 `<`符号，已修正）\n\n\
  该脚本包含一个基础 HTML 文档。文档主体中使用了一个脚本，通过 `document.write()` 语句显示 `navigator` 对象的每个属性。\n\
  \n要尝试此脚本，请将其加载到你选择的浏览器中。如果你有多个浏览器或浏览器版本，请在每个浏览器中都尝试。Firefox 对脚本的显示如图 21.1 所示。\n\n\
  **图 21.1** Firefox 显示浏览器信息脚本。\n\n![image](img/21fig01.jpg)\n\n## 处理不诚实的浏览器\n\n如果你尝试在特定版本的\
  \ Internet Explorer 中运行列表 21.1 中的浏览器信息脚本，你可能会感到意外。图 21.2 显示了 Internet Explorer 6.0\
  \ 是如何显示脚本的。\n\n**图 21.2** Internet Explorer 6 如何显示浏览器信息脚本。\n\n![image](img/21fig02.jpg)\n\
  \n这种显示中有几处意料之外的地方。首先，`navigator.language` 属性被列为 undefined（未定义）。这并不意外，因为 Internet\
  \ Explorer 不支持该属性。\n\n更重要的是，你会发现 `Mozilla` 一词出现在 Code Name（代码名称）和 User Agent（用户代理）字段中。完整的用户代理字符串如下：\n\
  \n`Mozilla/4.0 (compatible; MSIE 6.0; Windows 98)`\n\n信不信由，微软这样做有充分的理由。在浏览器战争的巅峰时期，大约在\
  \ Netscape 3.0 和 IE 3.0 出出的期间，看到“仅限 Netscape”的页面变得越来越常见。一些使用框架（frames）和 JavaScript\
  \ 等功能的网站管理员将服务器设置为：拒绝任何用户代理字符串中不包含 `Mozilla` 的浏览器。但这样做的问题在于，这些功能中的大多数其实也被 Internet\
  \ Explorer 支持了。\n\n微软在 IE 4.0 中解决了这个问题，让 IE 的用户代理显示为 `Mozilla`，并带有括号括的 `compatible`\
  \ 一词。这使得 IE 用户能够查看那些页面，但仍然包含了足够的细节来告知 Web 服务器使用的是哪种浏览器。\n\n你可能已经注意到了 Internet Explorer\
  \ 6.0 用户代理字符串的另一个问题：即 `Mozilla/4.0` 部分。IE 不仅声称自己是 Netscape，而且伪装成了 4.0 版本。为什么呢？\n\
  \n事实证明，这是微软为了在浏览器战争中保持领先一步的另一项努力，尽管这一做法看起来没那么合理。因为当时编写得糟糕的脚本会专门针对 Mozilla/4 的动态\
  \ HTML 页面进行检查，微软担心其 5.0 版本无法运行这些页面。由于现在更改它只会引起更多困惑，这种传统延续到了 IE 6.0。\n\n尽管这些是浏览器战争史上的两个有趣插曲，但这一切对你意味着什么呢？嗯，当你的脚本尝试区分\
  \ IE 和 Netscape，以及区分不同版本时，你必须非常小心。你需要检查特定的组合，而不仅仅是检查 `navigator.appVersion` 的值。幸运的是，有更好的处理方法，你将在下一节中学习到。\n\
  \n## 跨浏览器脚本编写\n\n如果所有关于检测不同浏览器版本的细节都让你感到很困惑，那么这里有一个好消息——在大多数情况下，你完全不需要引用 `navigator`\
  \ 对象就可以编写跨浏览器脚本。这不仅更容易，而且更好，因为检查浏览器的代码经常会被新版本的浏览器困扰，并且在每个新浏览器发布时都必须更新。\n\n### 特性检测\n\
  \n检查浏览器版本有时被称为*浏览器检测（browser sensing）。处理多个浏览器的更好方法被称为*特性检测（feature sensing）。在特性检测中，你不是检查特定的浏览器，而是检查特定的特性。例如，假设你的脚本需要使用\
  \ `document.getElementById()` 函数。你可以用一个 `if` 语句开始脚本，检查该函数是否存在：\n\n```javascript\n\
  if (document.getElementById) {\n  // 执行某些操作\n}\n```\n\n如果 `getElementById` 函数存在，则将执行括号之间的代码块。使用特性检测的另一种常见方法是在使用某特性的函数开头：\n\
  \n```javascript\nfunction changeText() {\n  if (!document.getElementById) return;\n\
  \  // 如果支持该特性，则执行函数的剩余部分\n}\n```\n\n你不需要在使用*每个*特性之前都进行检查——例如，在大多数情况下，验证 `window`\
  \ 对象是否存在并没有意义。你也可以假设某个特性的存在意味着其他特性也被支持：如果 `getElementById()` 被支持，那么其他 W3C DOM 函数通常也受到支持。\n\
  \n**注意**\n\n在处理第三方库时，特性检测也非常有用，如第 22 章所示。你可以检查属于库的对象或函数是否存在，以验证在脚本使用其功能之前库文件已加载。\n\
  \n特性检测是一种保持你的 JavaScript 非侵入性的非常可靠的方法——如果浏览器支持该特性，它就能工作；如果不支持，你的脚本就不会产生干扰。这同时也比试图跟踪数百个不同的浏览器版本及其支持的情况要容易得多。\n\
  \n## 处理浏览器怪癖\n\n那么，既然特性检测优于浏览器检测，为什么你仍然需要 `navigator` 对象呢？在一种情况下它仍然很有用，尽管如果你运气好可能不会遇到这种情况。\n\
  \n当你开发一个复杂的脚本并在多个浏览器中进行测试时，可能会遇到这样的情况：你完全标准的代码在一个浏览器中运行正常，但在另一个浏览器中运行失败。假设你已经排除了脚本本身问题的可能，那么你至少遇到了浏览器\
  \ Bug 或浏览器之间特性的差异。针对这种情况，有一些建议：\n\n• 反复检查你自己代码中的 Bug。\n\n• 在 Web 上搜索解决方案，这样你可能就会避开该\
  \ Bug。\n\n\n\n\n\n- 如果问题是某个浏览器缺少某功能，请使用特性检测（feature sensing）来检查该功能。\n- 当所有其他方法都失败时，使用\
  \ `navigator` 对象来检测特定的浏览器，并替换为在该浏览器中运行的代码。这应该是你的最后手段。\n\n> 提示\n> Peter-Paul Koch\
  \ 的 QuirksMode（[`www.quirksmode.org`](http://www.quirksmode.org)）是你寻找特定浏览器 Bug 相关信息时的一个很好的起点。\n\
  \n## 支持非 JavaScript 浏览器\n\n你网站的一些访问者将使用完全不支持 JavaScript 的浏览器。这些不仅仅是少数使用老旧浏览器的顽固分子——实际上，不支持\
  \ JavaScript 的浏览器数量比你想象的要多：\n\n- 大多数现代浏览器（如 Internet Explorer、Firefox 和 Chrome）都包含关闭\
  \ JavaScript 的选项，某些用户会这样做。更常见的情况下，浏览器可能由其互联网服务提供商（ISP）或雇默认禁用了 JavaScript，这通常是为了增加安全性的一种错误尝试。\n\
  - 某些企业防火墙和个人杀病毒软件会阻止 JavaScript。\n- 某些广告拦截软件会误阻止脚本的运行，即使它们与广告无关。\n- 如今越来越多的手机自带了网络浏览器，而其中大多数支持很少或完全不支持\
  \ JavaScript。\n- 某些视障用户使用特殊用途的浏览器或纯文本浏览器，这些浏览器可能不支持 JavaScript。\n\n如你所见，假设所有访问者都支持\
  \ JavaScript 是愚蠢的。接下来的章节将讨论两种确保这些用户仍可以使用该网站的技术。\n\n> 注意\n> 搜索引擎是另一种会频繁访问你网站的“浏览器”，它们通常不关注\
  \ JavaScript。如果你希望搜索引擎完全索引你的网站，那么避免让 JavaScript 成为导航网站的先决条件是至关重要的。\n\n### 使用 `<noscript>`\
  \ 标签\n\n对非 JavaScript 浏览器友好的一种方法是使用 `<noscript>` 标签。该标签在大多数现代浏览器中都支持，向非 JavaScript\
  \ 浏览器显示消息。支持 JavaScript 的浏览器会忽略`<noscript>` 标签之间的文本，而其他浏览器则会显示。这里有一个简单的示例：\n\n```html\n\
  <noscript>\n此页面需要 JavaScript。你可以切换到支持 JavaScript 的浏览器，开启浏览器的脚本支持，\n或者切换到此页面的 <a\
  \ href=\"nojs.html\">非 JavaScript</a> 版本。\n</noscript>\n```\n\n虽然这种方法有效，但问题在于并非所有支持\
  \ JavaScript 的浏览器都一致支持 `<noscript>`。另一种避免 `<noscript>` 的替代方案是将支持 JavaScript 的用户重定向到另一个页面。这可以通过一个\
  \ JavaScript 语句实现：\n\n```javascript\n<script type=\"text/javascript\">\nwindow.location=\"\
  JavaScript.html\";\n</script>\n```\n\n此脚本将用户重定向到另一个页面。如果浏览器不支持 JavaScript，当然，脚本将不会执行，页面的其余部分可以显示警告消息解释情况。\n\
  \n### 让 JavaScript 可变为可选\n\n尽管你可以检测支持 JavaScript 的浏览器并对其他显示消息，但最好的选择是简单地让你的脚本是非侵入性的（unob）。使用\
  \ JavaScript 来增强功能而不是作为核心特性；将 JavaScript 保持在单独的文件中并在 JavaScript 文件中分配事件处理器，而不是在\
  \ HTML 中。不支持 JavaScript 的浏览器将直接忽略你的脚本。\n\n在那些绝对需要 JavaScript 的稀有情况下（例如 AJAX 应用或\
  \ JavaScript 游戏），你可以警告用户需要 JavaScript。然而，提供一种替代的无 JavaScript 方式来使用网站是一个好主意，特别是如果它是你业务赖以生存的电子商务或业务网站的话。不要因为编程懒惰而推开客户。\n\
  \n你绝对不应该要求 JavaScript 的地方是网站的导航栏。虽然你可以使用 JavaScript 创建下拉菜单和其他花哨导航工具，但它们会阻止用户的非 JavaScript\
  \ 浏览器查看你网站的所有页面。它们还会阻止搜索引擎查看整个网站，从而损害你获取搜索流量的机会。\n\n> 注意\n> Google 的 Gmail 应用（[`mail.google.com`](http://mail.google.com)）是\
  \ AJAX 最著名的用例之一，它优雅的界面需要 JavaScript。然而，Google 提供了一个基础 HTML 视图，可以在没有 JavaScript 的情况下使用。这允许\
  \ Google 支持旧版浏览器和手机，而不会损害使用现代浏览器的用户体验。\n\n### 避免错误\n\n如果你已经确保 JavaScript 仅是你网站的增强，而不是必要条件，那么出于什么原因不支持\
  \ JavaScript 的浏览器用户仍然能够浏览你的网站。最后一点需要担心的是：JavaScript 可能会导致错误或误导这些浏览器错误地显示你的页面。\n\n\
  这对于部分支持 JavaScript 的浏览器（如手机浏览器）来说是一个特别的问题。它们可能会解释 `<script>` 标签并启动脚本，但可能不支持完整的 JavaScript\
  \ 语言或 DOM。以下是避免错误的指南：\n\n- 为所有脚本使用单独的 JavaScript 文件。这是确保浏览器在不支持 JavaScript 时完全忽略你的脚本的最佳方法。\n\
  \n> 提示\n> Firefox 和 Internet Explorer 的开发工具栏包含一种用于测试的关闭 JavaScript 的方便方法。\n\n- 每当你的脚本尝试使用新的\
  \ DOM 特性（如 `document.getElementById()`）时，请使用特性检测。\n- 在关闭浏览器 JavaScript 支持的情况下测试你的页面。确保没有看起来异常，并确保你仍然可以浏览网站。\n\
  \n### 动手尝试：创建一个非侵入性脚本\n\n作为非侵入性脚本的示例，你可以创建一个使用 JavaScript 为页面添加功能的脚本，而不会损害其在旧版浏览器中的性能。在这个示例中，你将创建一个图形复选框来替代普通的复选框。\n\
  \n让我们从结果开始：图 21.3 显示了示例在 Firefox 中的外观。第一个复选框是普通的，第二个是由 JavaScript 管理的图形复选框。\n\n\
  **图 21.3** 运行中的图形复选框示例，图形选择框已选中。\n\n![image](img/21fig03.jpg)\n\n图形复选框只是一个较大的图形，你可以点击它显示选中或未选中的状态。虽然这可以只是一个像复选框的简单\
  \ JavaScript 模拟，但它更复杂。查看列表 21.2 中此示例的 HTML。\n\n列表 21.2 图形复选框示例的 HTML 文件\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ HTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>复选框</title>\n\
  \  </head>\n  <body>\n    <h1>图形复选框示例</h1>\n    <form name=\"form1\" method=\"post\"\
  \ action=\"\">\n      <p><input type=\"checkbox\" name=\"check1\" id=\"check1\"\
  />\n      普通的复选框。</p>\n      <p><input type=\"checkbox\" name=\"check2\" id=\"check2\"\
  />\n      通过非侵入性 JavaScript 创建的图形复选框。</p>\n    </form>\n    <script type=\"text/javascript\"\
  \ src=\"checkbox.js\"></script>\n  </body>\n</html>\n```\n\n\n\n\n\n如果你仔细观察 HTML，你会发现这两个复选框是使用完全相同的标准\
  \ `<input>` 标签定义的。该脚本并不是替换复选框，而是实际上将普通的复选框替换为图形化版本。此示例的脚本位于列表 21.3。\n\n列表 21.3 图形复选框示例的\
  \ JavaScript 文件\n\n```javascript\nfunction graphicBox(box) {\n   // 保持非干扰性\n   if\
  \ (!document.getElementById) return;\n   // 找到对象及其父元素\n   obj = document.getElementById(box);\n\
  \   parentobj = obj.parentNode;\n   // 隐藏普通的复选框\n   obj.style.visibility = \"hidden\"\
  ;\n   // 创建图像元素并设置其点击事件\n   img = document.createElement(\"img\");\n   img.onclick\
  \ = Toggle;\n   img.src = \"unchecked.gif\";\n   // 将复选框 id 保存到图像 ID 中\n   img.id\
  \ = \"img\" + box;\n   // 显示图形复选框\n   parentobj.insertBefore(img,obj);\n}\n\nfunction\
  \ Toggle(e) {\n   if (!e) var e=window.event;\n   // 找到图像 ID\n   img = (e.target)\
  \ ? e.target : e.srcElement;\n   // 通过从图像 ID 中删除 \"img\" 来找到复选框 id\n   checkid =\
  \ img.id.substring(3);\n   checkbox = document.getElementById(checkid);\n   // “点击”复选框\n\
  \   checkbox.click();\n   // 根据选中或未选中状态显示正确的图像\n   if (checkbox.checked) file =\
  \ \"checked.gif\";\n      else file=\"unchecked.gif\";\n   img.src=file;\n}\n\n\
  // 用图形替换第二个复选框\ngraphicBox(\"check2\");\n```\n\n该脚本包含三个主要部分：\n\n- `graphicBox()`\
  \ 函数将普通复选框转换为图形化复选框。它首先通过更改 `style.visibility` 属性来隐藏现有的复选框，然后创建一个包含 `unchecked.gif`\
  \ 图形的新图像节点，并将其插入到原始复选框旁的 DOM 中。它为图像分配了一个包含文本 `img` 加复选框 `id` 属性的 `id` 属性，以便以后查找复选框。\n\
  - `Toggle()` 函数由 `graphicBox()` 指定为新图像 `onClick` 事件的事件处理器。此函数从图像的 `id` 属性中移除 `img`\
  \ 以找到真实复选框的 `id`。它在复选框上执行 `click()` 方法来切换其值。最后，根据真实复选框的状态将图像更改为 `unchecked.gif`\
  \ 或 `checked.gif`。\n- 脚本文件的最后一行运行 `graphicBox()` 函数替换 `id` 属性为 `check2` 的第二个复选框。\n\
  \n使用这种技术有三个重要优点。首先，它是非干扰性脚本。HTML 保持了简单，不支持 JavaScript 的浏览器将显示普通的复选框。其次，因为真实的复选框仍在页面上只是被隐藏，所以当表单提交到服务器端脚本时，它能够正常工作。最后但同样重要的是，你可以简单通过在\
  \ HTML 文件中定义普通复选框并添加 `graphicBox()` 调用创建任意数量的图形复选框。\n\n要尝试此示例，请将 JavaScript 文件保存为\
  \ `checkbox.js`，并确保 HTML 文件位于同一文件夹中。你还需要在同一文件夹中准备两个相同的图像：`unchecked.gif` 和 `checked.gif`。\n\
  \n## 总结\n\n在本章中，你学习了许多创建尽可能在多个浏览器中运行脚本的准则，以及在处理不同浏览器时如何避免错误和头疼的问题。最重要的是，你学习了如何在使用\
  \ JavaScript 的同时，保持页面精简、高效并符合 Web 标准。\n\n## 问答\n\n**问：是否可以创建一个 100% 非干扰的 JavaScript，它可以在增强页面而不会给任何人带来任何麻烦？**\n\
  \n**答：不完全是。例如，本章“尝试一下”部分中的非干扰脚本就非常接近了——它将在最新浏览器中运行，而普通复选框即使在非常古老的浏览器中也能正常显示和工作。然而，如果使用现代浏览器的用户关闭了图像，它仍然可能会失败：由于支持\
  \ JavaScript，脚本会隐藏复选框，但图像将不存在。这是一种罕见的情况，但它说明了你添加的任何功能都可能为极小部分用户带来问题。\n\n**问：我可以使用\
  \ `navigator` 对象或其他技术检测用户的电子邮件地址吗？**\n\n**答：不能，没有可靠的方法可以使用 JavaScript 检测用户的电子邮件地址。（如果可以的话，你每天在浏览他们的页面时，会收到来自那些检测到你地址的公司发来的几百封广告。）你可以使用签名脚本来获取用户的电子邮件地址，但这需要用户的许可，并且仅在某些版本的\
  \ Netscape 中有效。\n\n## 工作坊\n\n工作坊包含了一些测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**1。** 下列哪个是放置 JavaScript 代码的最佳位置？\n\n**a.** 直接放在 HTML 文档中\n**b.** 在单独的\
  \ JavaScript 文件中\nc.** 在 CSS 文件中\n\n**2。** 下列哪是你*无法*使用 JavaScript 到的事情？\n\n**a.**\
  \ 将不支持某功能的浏览器引导到另一个页面\n**b.** 将 Internet Explorer 用户引导到另一个页面\n**c.** 将非 JavaScript\
  \ 浏览器的用户引导到另一个页面\n\n**3。** 下列定义在所有现代浏览器中有效的事件处理器的最佳方法是？\n\n**a.** `<body onLoad=\"\
  MyFunction()\">`\n**b.** `window.onload=MyFunction;`\n**c.** `window.attachEvent('load',MyFunction,false);`\n\
  \n## 答案\n\n**1.** b. JavaScript 的最佳位置是在单独的 JavaScript 文件中。\n**2.** c. 你无法使用 JavaScript\
  \ 将非 JavaScript 浏览器的用户引导到另一个页面，因为脚本根本不会执行。\n**3.** b. 代码 `window.onload=MyFunction;`\
  \ 在所有现代浏览器中都定义了事件处理器。这比使用 (a) 中的内联事件处理器更好，因为它将 JavaScript 从 HTML 文档中分离出来。选项 (c)\
  \ 使用了 W3C 标准方法，但在 Internet Explorer 中不起作用。\n\n## 练习\n\n- 在列表 21.2 的 HTML 文档中添加几个复选框，并在列表\
  \ 21.3 的脚本中添加相应的函数调用，将它们全部替换为图形复选框。\n- 修改列表 21.3 中的脚本，将所有 `class` 值为 `graphic` 的复选框转换为图形复选框。你可以使用\
  \ `getElementsByTagName()` 然后检查每个项目的是否有正确的 `className` 属性。\n\n## 第 22 章。使用第三方库\n\
  \n本章你将学到：\n\n- 为什么你可能使用第三方 JavaScript 库\n- 如何在应用程序中下载并使用较流行的第三方 JavaScript 库\n\n\
  第三方 JavaScript 库（或由第三方编写并维护、以便在自己的代码中轻松实现的代码库）具有许多优势。首先最重要的是，使用这些库可以让你避免在常见任务上重复造轮子。此外，这些库使你能够在无需先成为\
  \ JavaScript 专家的情况下，实现跨浏览器脚本和复杂的用户界面元素。\n\n### 使用第三方库\n\n当你使用 JavaScript 内置的 `Math`\
  \ 和 `Date` 函数时，JavaScript 完成了大部分工作——你不需要思考如何在不同格式之间转换日期或计算余弦。第三方库不包含在 JavaScript\
  \ 中，但它们的作用类似：让你仅用少量的代码就能完成复杂的事情。\n\n\n\n使用这些库之一通常只需要将一个或多个文件复制到你的网站，并在文档中包含一个 `<script>`\
  \ 标签来加载该库。接下来的章节将讨论几个流行的 JavaScript 库。\n\n### Prototype\n\nPrototype 由 Sam Stephenson\
  \ 创建，是一个 JavaScript 库，它简化了如处理 DOM 对象、处理表单数据以及远程脚本 (AJAX) 等任务。通过在文档中包含单个 `prototype.js`\
  \ 文件，你就可以使用对基础 JavaScript 的许多改进。\n\n例如，你曾使用 `document.getElementById` 方法来获取网页中某个元素的\
  \ DOM 对象。Prototype 在 `$()` 函数中包含了该方法的改进版本。它不仅输入起来更方便，而且比内置函数更高级，并支持多个对象。\n\n在页面中添加\
  \ Prototype 只需一个文件 `prototype.js` 和一个 `<script>` 标签：\n\n```html\n<script type=\"\
  text/javascript\" src=\"prototype.js\"></script>\n```\n\n**注意**\n\nPrototype 是免费的开源软件。你可以从它的官方网站\
  \ [`www.prototypejs.org/`](http://www.prototypejs.org/) 下载。Prototype 也内置在用于服务器端语言\
  \ Ruby 的 Ruby on Rails 框架中——更多信息请参见 [`www.rubyonrails.com/`](http://www.rubyonrails.com/)。\n\
  \n### jQuery\n\njQuery 的首次实现于 2006 年。它最初是一种简单、跨浏览器的 DOM 操作手段，后来变成了一个稳定、强大的库，不仅包含\
  \ DOM 操作工具，还包含许多额外的功能，这些功能使得跨浏览器的 JavaScript 编码变得更加简单高效。\n\n**注意**\n\njQuery 的主页位于\
  \ [`jquery.com/`](http://jquery.com/)，你可以在那里不仅下载最新版本，还可以获得详细的文档和示例代码。\n\n配套的 UI\
  \ 库可以在 [`jqueryui.com/`](http://jqueryui.com/) 找到。\n\n该库目前已更新到 1.6.2 版本，现在还有一个额外的高级用户界面扩展库，可以与现有库一起使用，快速构建和部署丰富的用户界面，或为现有组件添加各种吸引的效果。\n\
  \n与之前描述的 Prototype 库一样，jQuery 的核心是一套复杂的跨浏览器页面元素选择方法。用于获取元素的选择器基于类似 CSS 的选择器样式的组合，因此，凭借你在第三部分中以及“使用\
  \ CSS 高级网页设计”中学到的 CSS 技术，你上手 jQuery 应该没有问题。例如，如果你想获取一个 ID 为 `someElement` 的元素，你只需要使用以下代码：\n\
  \n```javascript\n$(\"#someElement\")\n```\n\n**提示**\n\n如果你不想在自己的计算机上下载并存储 jQuery\
  \ 库，可以使用远程托管的版本，例如 Google 提供的版本。不要在页面的 head 中包含本地托管的 .js 文件，而是使用以下代码：\n\n```html\n\
  <script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js\"\
  \ type=\"text/javascript\"></script>\n```\n\n在许多情况下，这比托管自己的版本性能更好，因为 Google 的服务器针对低延迟、大规模并行内容交付进行了优化。\n\
  \n或者，要返回一个具有 `someClass` 类名的元素集合，你只需要使用以下：\n\n```javascript\n$(\".someClass\")\n\
  ```\n\n我们可以非常简单地获取或设置与所选元素关联的值。例如，假设我们想隐藏所有类名为 `hideMe` 的元素。我们可以以完全跨浏览器的方式，只需一行代码即可实现：\n\
  \n```javascript\n$(\".hideMe\").hide();\n```\n\n操作 HTML 和 CSS 属性同样简单。例如，要在所有段元素元素添加“powered\
  \ by jQuery”短语，我们只需编写以下代码：\n\n```javascript\n$(\"p\").append(\" powered by jQuery\"\
  );\n```\n\n**提示**\n\n你甚至可以通过编写更多插件来自己扩展 jQuery，或者使用其他开发者提交的数千个插件。浏览 [`www.jqueryplugins.com/`](http://www.jqueryplugins.com/)\
  \ 查看可搜索分类的大量示例。\n\n然后为了更改这些元素的背景颜色，我们可以直接操作它们的 CSS 属性：\n\n```javascript\n$(\"p\"\
  ).css(\"background-color\",\"yellow\");\n```\n\n此外，jQuery 还包含简单的跨浏览器方法，用于判断元素是否具有某个类、添加和删除类、获取和设置元素的文本或\
  \ `innerHTML`、导航 DOM、获取和设置 CSS 属性，以及处理简单的跨浏览器事件。\n\n相关的 UI 库 添了大量的 UI 组件（如日期选择器、滑块、对话框和进度条）、动画工具、拖放能力等更多内容。\n\
  \n### Script.aculo.us\n\n到本书结束时，你将学习使用 JavaScript 完成一些实用的事情，通常使用复杂的代码。但你也可以使用预构建的库在页面中加入令人深刻的效果。这让你只需几行代码就能使用惊艳的效果。\n\
  \n由 Thomas Fuchs 开发的 Script.aculo.us 就是这样一个库。它包含了简化拖放任务的函数，例如重新排列项目列表。它还包含许多组合效果，允许你在页面中使用高亮和动画过渡。例如，页面的新部分可以短暂高亮以吸引用户的注意力，或者页面的部分可以淡出或滑出屏幕。\n\
  \n包含适当的文件后，使用效果就像使用 JavaScript 的任何内置方法一样简单。例如，以下语句使用 Script.aculo.us 将 `id` 值为 `test`\
  \ 的页面元素淡出：\n\n```javascript\nobj = document.getElementById(\"test\");\nnew Effect.Fade(obj);\n\
  ```\n\n**注意**\n\n你将在本章稍后的自己试一试部分创建一个演示了若干 Script.aculo.us 效果的脚本。\n\nScript.aculo.us\
  \ 构建在上一节描述的 Prototype 框架之上，并包含了 Prototype 的所有函数，因此你也可以通过使用 `$` 函数进一步简化：\n\n```javascript\n\
  new Effect.Fade($(\"test\"));\n```\n\n### AJAX 框架\n\nAJAX（异步 JavaScript 和 XML）也称为远程脚本，允许\
  \ JavaScript 与运行在 Web 服务器上的程序进行通信。这使得 JavaScript 能够完成传统上无法实现的任务，例如从数据库动态加载信息或在不刷新网页的情况下将数据存储在服务器上。\n\
  \nAJAX 需要一些复杂的脚本，特别是因为你用于与服务器通信的方法取决于所使用的浏览器。幸运的是，已经有了许多库来满足简单使用 AJAX 的需求，你将在本书后面的部分尝试。\n\
  \n之前描述的 jQuery 和 Prototype 库都包含 AJAX 功能。还有许多专门 AJAX 库。最流行的之一是 SAJAX (Simple AJAX)，它是一个开源工具包，方便使用\
  \ JavaScript 与 PHP、Perl 和其他语言进行通信。详情访问 SAJAX 网站 [`www.modernmethod.com/sajax`](http://www.modernmethod.com/sajax)。\n\
  \n**注意**\n\n请参阅第 24 章](#ch24.html_ch24)“AJAX: 远程脚本”，获取使用和不使用第三方库的远程脚本示例。\n\n###\
  \ 其他库\n\n世界上还有许多 JavaScript 库，而且随着 JavaScript 作为一种应用程序语言受到越来越多的重视，更多的库正在不断涌现。这里有更多你可能想要探索的库：\n\
  \n\n\n\n\n- `Dojo` ([http://www.dojotoolkit.org/]) 是一个开源工具包，它增强了 JavaScript 的功能，简化了应用程序和用户界面的构建。它提供了从额外的字符串和数学函数到动画和\
  \ AJAX 的各种功能。\n- `Yahoo! UI Library` ([`developer.yahoo.net/yui/`](http://developer.yahoo.net/yui/))\
  \ 由 Yahoo! 开发，并根据开源许可提供所有人使用。它包含了动画、DOM 特性、事件管理以及易用的界面元素（如日历和滑块）的功能。\n- `MochiKit`\
  \ ([`mochikit.com/`](http://mochikit.com/)) 是一个轻量级库，提供了处理 DOM、CSS 颜色、字符串格式化和 AJAX\
  \ 的功能。它还支持一种良好的日志机制用于调试您的脚本。\n- `MooTools` ([`mootools.net/`](http://mootools.net/))\
  \ 是一个紧凑、模块化的 JavaScript 框架，允许您使用简单易懂、文档良好的 API（应用程序编程接口）构建强大、灵活且跨浏览器的代码。\n\n## 亲自尝试：使用库添加效果\n\
  \n为了看到使用外部库是多么简单，您现在将创建一个包含 `Script.aculo.us` 库的示例脚本，并使用事件处理器来演示几种可用的效果。\n\n###\
  \ 下载库\n\n要使用该库，您需要下载它并将所需的文件复制到您存储脚本的相同文件夹中。您可以从 `Script.aculo.us` 网站 [`script.aculo.us/downloads`](http://script.aculo.us/downloads)\
  \ 下载该库。\n\n## 注意事项\n\n此示例在使用 `Script.aculo.us` 库的 `1.9.0` 版本创建的。它在更高版本中也应该有效，但库自编写以来可能已经发生了变化。如果您遇到问题，可能需要使用这个特定版本。\n\
  \n下载内容以 Zip 文件格式提供。在 Zip 文件内部，您将找到一个遵循 `scriptaculous-js-x.x.x` 命名规则文件夹，其中每个 `x`\
  \ 代表版本号的一部分（本文时的版本为 `1.9.0`）。您将需要该文件夹下子文件夹中的以下文件：\n\n- 来自 `lib` 文件夹的 `prototype.js`（Prototype\
  \ 库）\n- 来自 `src` 文件夹的 `effects.js`（效果函数）\n\n将这两个文件都复制到计算机上的一个文件夹中，并确保在同一个文件夹中创建您的演示脚本。\n\
  \n### 注意\n\n`Script.aculo.us` 的下载包包含许多其他文件，如果您打算使用它的所有功能，可以包含整个库。对于此示例，您只需要这里提到的两个文件。\n\
  \n### 包含文件\n\n要将库添加到您的 HTML 文档中，只需使用 `<script>` 标签包含您从下载中复制的两个 JavaScript 文件：\n\n\
  ```html\n<script type=\"text/javascript\" src=\"prototype.js\"> </script>\n\n<script\
  \ type=\"text/javascript\" src=\"effects.js\"> </script>\n```\n\n如果您将这些语句作为文档 `<head>`\
  \ 部分的内容内容，则库函数将对页面任何地方的其他脚本或事件处理器可用。\n\n### 使用效果\n\n在包含库之后，您只需要包含少量 JavaScript 来触发效果。我们将使用封装在\
  \ `<div>` 标签中且 `id` 值为 `test` 的页面部分来演示这些效果。每个效果都通过按钮上的简单事件处理器触发。例如，此代码定义了淡出（Fade\
  \ Out）按钮：\n\n```html\n<input type=\"button\" value=\"Fade Out\" onclick=\"new Effect.Fade($('test'))\"\
  >\n```\n\n## 提示\n\n此示例将演示六种效果：`Fade`、`Appear`、`SlideUp`、`SlideDown`、`Highlight`\
  \ 和 `Shake`。库中超过 16 种效果，外还有支持拖放和其他功能的方法。详情请参阅 [`script.aculo.us`](http://script.aculo.us)。\n\
  \n此代码使用了 Prototype 内置的 `$` 函数来获取 `id` 值为 `test` 的元素对象，然后将其传递给 Script.aculo.us 内置的\
  \ `Effect.Fade` 函数。\n\n### 构建脚本\n\n在包含库之后，您可以将它们与事件处理器以及一些示例文本结合，创建一个 `Script.aculo.us`\
  \ 效果的完整演示。此示例的完整 HTML 文档见 列表 22.1。\n\n**列表 22.1 完整的库效果示例**\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W33C//DTD XHTML 1.1//EN\"\
  \ \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Testing script.aculo.us effects</title>\n\
  \    <script type=\"text/javascript\" src=\"prototype.js\"></script>\n    <script\
  \ type=\"text/javascript\" src=\"effects.js\"></script>\n  </head>\n  <body>\n \
  \   <h1>Testing script.aculo.us Effects</h1>\n    <form name=\"form1\">\n      <input\
  \ type=\"button\" value=\"Fade Out\" onclick=\"new Effect.Fade($('test'))\">\n \
  \     <input type=\"button\" value=\"Fade In\" onclick=\"new Effect.Appear($('test'))\"\
  >\n      <input type=\"button\" value=\"Slide Up\" onclick=\"new Effect.SlideUp($('test'))\"\
  >\n      <input type=\"button\" value=\"Slide Down\" onclick=\"new Effect.SlideDown($('test'))\"\
  >\n      <input type=\"button\" value=\"Highlight\" onclick=\"new Effect.Highlight($('test'))\"\
  >\n      <input type=\"button\" value=\"Shake\" onclick=\"new Effect.Shake($('test'))\"\
  >\n    </form>\n    <div id=\"test\" style=\"background-color:#CCC; margin:20px;\
  \ padding:10px;\">\n      <h2>Effects</h2>\n      <hr/>\n      <p>此文档部分封装在 `id`\
  \ 值为 test 的 &lt;div&gt; 元素中。上方按钮上的事件处理器将把此对象发送给 <a href=\"http://script.aculo.us/\"\
  >script.aculo.us</a> 库来执行效果。</p>\n    </div>\n  </body>\n</html>\n```\n\n此文档以两个\
  \ `<script>` 标签开始包含库。要尝试此示例，请确保 `prototype.js` 和 `effects.js` 文件与您的脚本位于同一个文件夹中，然后将其加载到浏览器。显示结果如图\
  \ 22.1，您可以使用页面顶部的按钮触发效果。\n\n**图 22.1** 库效果示例。\n\n![image](img/22fig01.jpg)\n\n##\
  \ 总结\n\n在本章中，您学习了适用于 JavaScript 的许多第三方库。这些库可以提供许多优势，包括简单的跨浏览器脚本、HTML 和 CSS 值的处理、动画以及更高级的用户界面工具（如拖放）。\n\
  \n## 问答\n\n问：我如何将第三方 JavaScript 库包含到我的页面中？\n\n答：过程根据不同的库略有不同。通常只需将一个或多个外部 .js 文件包含在\
  \ Web 页的 `<head>` 部分。详情请参阅所选库提供的文档。\n\n问：我可以在同一个脚本中使用多个第三方库吗？\n\n答：理论上可以：如果库编写得良好且设计为互不干扰，那么合并它们就没有问题。在实践中，这取决于您需要的库以及它们是如何编写的。\n\
  \n问：我可以构建自己的库来简化脚本吗？\n\n答：可以，随着您处理越来越复杂的脚本，您会发现自己反复使用相同的函数。您可以将它们合并成供自己使用的库。这简单只需要创建一个\
  \ .js 文件即可。\n\n## 练习\n\n\n\n\n\n本工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看随后的“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**1.** 下面这些对象中哪个不是 JavaScript 库？\n\n**a.** MooTools\n**b.** Prototype\n\
  **c.** AJAX\n\n**2.** 你可以如何自己扩展 `jQuery`？\n\n**a.** `jQuery` 无法被扩展。\n**b.** 通过编写服务器端脚本。\n\
  **c.** 通过编写插件或使用预先写的插件。\n\n**3.** `Script.aculo.us` 采用使用了哪种其他的 JavaScript 第三方库？\n\
  \n**a.** Prototype\n**b.** Dojo\n**c.** `jQuery`\n\n## 答案\n\n**1.** c. `AJAX` 是一种编程技术，允许你的脚本使用托管在你服务器上的资源。有很多库可以帮助你使用\
  \ `AJAX` 功能，但 `AJAX` 本身不是一个库。\n\n**2.** c. `jQuery` 有详尽文档的方法编写和使用插件。\n\n**3.** a.\
  \ `Script.aculo.us` 使用了 `prototype.js` 库。\n\n## 练习\n\n• 使用 `jQuery` 库编写一个简单的脚本，或使用\
  \ `jQuery` 网站上的示例脚本。分别使用本地和远程托管版本的 `jQuery` 运行脚本。你能看到性能上的任何差异吗？\n\n• 访问 [`script.aculo.us/`](http://script.aculo.us/)\
  \  `Script.aculo.us` 页面查找效果完整列表。修改 Listing 22.1` 以为一个或多个额外效果添加按钮。\n\n## 第 23 章 Greasemonkey：使用\
  \ JavaScript 增强 Web\n\n* * *\n\n在本章你将学到：\n\n• `Greasemonkey` 和用户脚本如何增强你的网络浏览器\n\
  • 如何在 `Firefox` 中安装和配置 `Greasemonkey`\n• 安装和管理用户脚本\n• 创建你自己的用户脚本\n• 为脚本定义元数据\n•\
  \ 使用 `Greasemonkey` API\n• 在 Web 表单中添加宏\n* * *\n\n最近的趋势之一是 JavaScript 正在以新的方式使用，无论是在网络浏览器内部还是外部。在本章中，你将了解\
  \ `Greasemonkey`，这是一个 `Firefox` 扩展，允许你编写脚本来修改你访问的网站的外观和行为。在有适当插件的情况下，用户脚本也可以在 `Internet\
  \ Explorer`、`Opera` 和 `Safari` 中运行，而 `Chrome` 对用户脚本有原生支持。\n\n### 介绍 Greasemonkey\n\
  \n到本书为止，你一直一直在使用 JavaScript 来处理你自己的网站。在本章中，你将暂时放下这项工作，学习一种在别人的网站上使用 JavaScript 的方法。`Greasemonkey`\
  \ 是 `Firefox` 浏览器的一个扩展，允许使用用户脚本。这些脚本在你加载页面时立即运行，并可以对页面的 `DOM` 进行更改。\n\n用户脚本可以设计为在所有网页上运行，也可以只影响特定的网站。以下是用户脚本可以做的一些事情：\n\
  \n• 改变一个或多个网站的外观——颜色、字体大小等\n• 使用 JavaScript 改变一个或多个网站的行为\n• 在网站作者之前修复网站中的错误\n• 为你的浏览器添加功能，例如文本宏——请参阅本章后后的尝试一试部分查看示例\n\
  \n作为一个简单的例子，一个名为 `Linkify` 的用户脚本可以将 URL 转换为超链接。该脚本在你加载页面时运行，并对页面的 `DOM` 进行更改。换句话之，它查找页面中类似于\
  \ URL 的字符串，如果发现未在 `<a>` 标签中的 URL，就会对其处理。`Greasemonkey` 脚本范围从简单的 `Linkify` 到复杂的脚本，可以修改你的网站以消除烦人的广告。\n\
  \n* * *\n\n注意\n\n`Greasemonkey` 由 Boodman 在 2004 年创建。其官方网站是 [`www.greasemonkey.org/`](http://www.greasemonkey.org/)。\n\
  \n* * *\n\n请记住，由于 `Firefox` 和 `Internet Explorer` 之间的差异，并不是所有 `Greasemonkey` 脚本都能在\
  \ IE 中运行。\n\n### 在 Firefox 中安装 Greasemonkey\n\n要安装 `Greasemonkey`，你需要访问 [`www.greasemonkey.org/`](http://www.greasemonkey.org/)。根据该网站，`Greasemonkey`\
  \ 支持 Windows、Macintosh 和 Linux 平台。安装后，你可能会被要求重启 Firefox。\n\n图 23.1\n\n![image/23.1]\n\
  \n\n\n\n\n脚本库中有数千个可用脚本。除了通用脚本外，许多脚本专门用于为特定网站添加功能，或移除某些烦人的功能。\n\n## 安装脚本\n\n在你找到想要安装的脚本后，可以从网络安装它：\n\
  \n• 在带有 `Greasemonkey` 的 Firefox 中，在浏览器中打开脚本，然后从菜单中选择“工具 (Tools)”、“安装此用户脚本 (Install\
  \ This User Script)”。\n\n• 在带有 `Trixie` 的 IE 中，将脚本下载到 `Trixie` 安装文件夹下的 `Scripts`\
  \ 目录。默认情况下，路径为 `Program Files\\Bhelpuri\\Trixie\\Scripts`。然后，进入“工具”菜单并选择“Trixie\
  \ Options” (`Alt-T, X`)。这将显示 `Trixie Options` 对话框，你可以在其中点击“重新加载脚本 (Reload Scripts)”按钮并选择“确定”。这将加载你的新脚本并启用它。\n\
  \n你也可以从本地文件安装脚本。你将在本章稍后的部分使用这种技术安装你自己的脚本。\n\n## 管理脚本\n\n使用 `Greasemonkey` 安装一个或多个脚本后，你可以通过\
  \ Firefox 菜单中选择“Greasemonkey”、“管理用户脚本 (Manage User Scripts)”来管理它们。“管理用户脚本”对话框如图\
  \ 23.2 所示。\n\n**图 23.2** 在 Greasemonkey 中管理用户脚本。\n\n![image](img/23fig02.jpg)\n\n\
  你可用的用户脚本列在右侧列。点击脚本名称进行管理：\n\n• 使用“启用/禁用 (Enable/Disable)”按钮启用或禁用每个脚本。\n\n• 点击“移除\
  \ (Remove)”按钮移除脚本。\n\n• 右键点击并选择“编辑 (Edit)”以在文本编辑器中打开脚本。保存后，它将立即对你加载的页面生效。\n\n适用于适用于\
  \ IE 的 `Trixie` 具有类似的对话框。`Trixie Options` 对话框 (`Alt-T, X`) 可用于管理已安装的脚本。从该对话框中（如图\
  \ 23.3 所示），你可以查看已安装的脚本、启用或禁用脚本或重新加载脚本。该对话框还显示了脚本将在哪些网站或页面上执行。\n\n**图 23.3** Trixie\
  \ Options 对话框。\n\n![image](img/23fig03.jpg)\n\n## 测试用户脚本\n\n如果你启用了一个脚本，只要你加载了符合该脚本指定的“包含页面\
  \ (Included Pages)”之一的页面，它就会被激活。（脚本在页面加载后、但在 `onload` 事件之前运行。）如果你想确保 `Greasemonkey`\
  \ 正在运行，可以尝试其中一个已启用脚本的可用脚本（一旦加载匹配其下载的页面，它就会激活），或者输入下一节中的简单脚本。\n\n## 激活和停用 Greasemonkey\
  \ 或 Trixie\n\n有时当脚本启用时，只要你加载了符合你想要完全关闭 `Greasemonkey` 的页面，它就会被激活，特别是当你安装的脚本之一导致错误时。要执行此操作，右键点击浏览器右下角的猴子图标，选择“已启用\
  \ (Enabled)”选项以取消选择。猴子图标将变为灰色的悲脸猴子，将不会运行任何用户脚本。你可以随时使用相同的选项重新启用它。\n\n对于 Internet\
  \ Explorer 的 `Trixie`，使用 `Explorer` 的“管理加载项 (Manage Add-Ons)”菜单来禁用 `Trixie`。\n\n\
  ## 创建你自己的用户脚本\n\n你已经学习了创建用户脚本所需的大知识，因为它们是用 JavaScript 编写的。在本节中，你将创建并测试一个简单的脚本，并查看在创建更高级脚本时将使用特性。\n\
  \n### 创建简单的用户脚本\n\n`Greasemonkey` 的最佳用途之一是解决你访问的网站带来的困扰。例如，某个网站可能在橙色背景上使用绿色文字。尽管你可以联系网站管理员请求更改颜色，但用户脚本让你自己快速解决该问题。\n\
  \n作为用户脚本的简单演示，你可以创建一个用户脚本，更改你访问的网站中段落的文本和背景颜色。列表 23.1 显示了此用户脚本。\n\n列表 23.1 修改段落颜色的简单用户脚本\n\
  \n```\n// Change the color of each paragraph\n\nvar zParagraphs = document.getElementsByTagName(\"\
  p\");\n\nfor (var i=0; i<zParagraphs.length; i++) {\n   zParagraphs[i].style.backgroundColor=\"\
  #000000\";\n   zParagraphs[i].style.color=\"#ffffff\";\n}\n```\n\n此脚本使用 `getElementsByTagName()`\
  \ DOM 方法找到当前文档中的所有段落标签，并将它们的对象存储在 `zParagraphs` 数组中。`for` 循环遍历数组并更改每个对象的 `style.color`\
  \ 和 `style.backgroundColor` 属性。\n\n### 描述用户脚本\n\n`Greasemonkey` 支持在脚本开头使用*元数据 (metadata)*。这些是不由脚本执行的\
  \ JavaScript 注释，但为 `Greasemonkey` 提供信息。要使用此功能，将你的注释包含在 `// ==UserScript==` 和 `//\
  \ ==/UserScript` 注释之间。\n\n元数据部分可以包含以下任何指令。所有这些都是可选的，但使用它们将使你的用户脚本更容易安装和使用。\n\n•\
  \ `@name`——脚本的短名称，安装后显示在 `Greasemonkey` 的脚本列表中。\n\n• `@namespace`——脚本作者网站的可选 URL。它被用作脚本的命名空间：只要命名空间不同，两个脚本可以同名。\n\
  \n• `@description`——脚本用途的一行描述。\n\n• `@include`——脚本应使用的网站 URL。你可以指定任意数量的 URL，每个 URL\
  \ 独占一行 `@include` 行。你也可以使用通配符 `*` 在所有网站上运行脚本，或使用带有通配符的部分 URL 在一组网站上运行它。\n\n• `@exclude`——脚本*不应*使用的网站\
  \ URL。你可以为 `@include` 指定通配符，然后排除一个或多个与脚本不的网站。`@exclude` 指令也可以使用通配符。\n\n列表 23.2 显示了在顶部添加了完整元数据注释的颜色更改示例。\n\
  \n列表 23.2 带有元数据注释的颜色更改脚本\n\n```\n// ==UserScript==\n\n// @name          WhiteOnBlack\n\
  // @namespace      http://www.thickbook.com/\n// @description    Display paragraphs\
  \ in white text on black\n// @include        *\n// ==/UserScript==\n\n//\n\n// Change\
  \ the color of each paragraph\n\nvar zParagraphs = document.getElementsByTagName(\"\
  p\");\n\nfor (var i=0; i<zParagraphs.length; i++) {\n   zParagraphs[i].style.backgroundColor=\"\
  #000000\";\n   zParagraphs[i].style.color=\"#ffffff\";\n}\n```\n\n### 测试你的脚本\n\n\
  现在你已经添加了元数据，安装脚本就很简单了。按照以下步骤在 Firefox 中安装脚本：\n\n1. 将脚本文件保存为 `colors.user.js`。文件名必须以\
  \ `.user.js` 才能被识别为 `Greasemonkey` 脚本。\n\n2. 在 Firefox 中，从菜单选择“文件 (File)”、“打开 (Open)”。\n\
  \n3. 从“打开文件 (Open File)”对话框中选择你的脚本。\n\n4. 脚本在浏览器中显示后，选择“工具 (Tools)”、“安装此用户脚本 (Install\
  \ This User Script)”。\n\n5. 将显示一个提示通知你安装成功。新用户脚本现在将在所有网站上运行。\n\n`Greasemonkey` 和适用于\
  \ IE 的 `Trixie` 在安装时使用你指定的元数据设置脚本的包含页面、描述和其他选项。\n\n在你安装并启用脚本后，你加载的任何页面都将以黑色背景上的白色文字显示段落。例如，图\
  \ 23.4 显示了用户脚本对简单的“Hello World”脚本的影响。由于正文封装在 `<p>` 标签中，因此它以黑底白字显示。\n\n**图 23.4**\
  \ 被更改用户脚本修改的基础页面。\n\n![image](img/23fig04.jpg)\n\n\n\n\n\n你可能不想对你访问的所有网站都进行如此剧烈的更改。相反，你可以使用\
  \ `@include` 让此脚本仅影响一两个你觉得颜色难以阅读的网站。别忘记，你也可以根据自己的喜好更改脚本中的颜色。\n\n***\n\n## Greasemonkey\
  \ API 函数\n\n你可以使用书中涵盖的所有 DOM 方法在用户脚本中处理页面，并结合 JavaScript 的内置函数。除了这些函数外，Greasemonkey\
  \ 定义了一个 API（应用程序编程接口），其中包含几个只能在用户脚本中使用的函数：\n\n- `GM_log(message, level)`—向 JavaScript\
  \ 控制台插入一条消息。`level` 参数指示消息的严重程度：0 表示信息，1 表示警告，2 错误错误。\n\n- `GM_setValue(variable,\
  \ value)`—设置一个由 Greasemonkey 存储的变量。这些变量存储在本地机器上。它们特定于设置它们的脚本，并可以在以后由同一个脚本使用。（这些类似于\
  \ cookie，但不会发送到服务器。）\n\n- `GM_getValue(variable)`—检索之前用 `GM_setValue` 设置的值。\n\n\
  - `GM_registerMenuCommand(command, function)`—向浏览器菜单添加一个命令。这些命令出现在“工具，用户脚本命令”下。`command`\
  \ 参数是菜单中显示的名称，`function` 是你脚本中会被菜单选择激活的函数。\n\n- `GM_xmlhttpRequest(details)`—从远程服务器请求文件，类似于第\
  \ 24 章中“AJAX: 远程脚本”描述的 AJAX 功能。`details` 参数是一个可以包含多个控制请求属性的对象。有关 Greasemonkey 文档所有你可以指定的属性。\n\
  \n## 创建特定网站的脚本\n\n你可能想使用用户脚本来修复特定网站的问题或为其添加功能。例如，你可能想移除 Facebook 个人页上显示的所有广告——在\
  \ [`userscripts.org/`](http://userscripts.org/) 上有很多 Greasemonkey 脚本可以解决此类问题。要创建此类自定义脚本，除了使用\
  \ `@include` 指定网站 URL 外，你还需要了解该网站的 DOM。\n\n你可以使用 Firefox 中的 DOM 检查器（或 Internet Explorer\
  \ 开发者工具中的类似功能）浏览网站的 DOM，并找到你想要处理的对象。根据它们标记的方式，你可以通过 DOM 访问它们：\n\n- 如果元素具有 `id` 属性，你可以直接在脚本中使用\
  \ `document.getElementById()` 来找到该对象。\n\n- 如果附近的元素定义了 `id`，你可以使用 DOM 方法来找到它——例如，如果父元素有\
  \ `id`，你可以使用 `firstChild()` 等方法找到你需要的对象。\n\n- 如果其他方法都失败了，你可以使用 `document.getElementsByTagName()`\
  \ 来找到所有特定类型的对象——例如所有段落。如果你需要引用其中某一个，可以使用循环并检查每个对象是否具有某个属性。\n\n例如，列表 23.3 显示了一个简单的用户脚本，你可以将其作为特定网站脚本来自动填充表单中的某些字段。\n\
  \n### 列表 23.3 自动填充表单字段的用户脚本\n\n```javascript\n// ==UserScript==\n\n// @name    \
  \     AutoForm\n// @namespace      http://www.thickbook.com/\n// @description  \
  \  自动填充 forms\n// @include        *\n// ==/UserScript==\n\n// this function fills\
  \ out form fields\n\n//\n\nvar zTextFields = document.getElementsByTagName(\"input\"\
  );\n\nfor (var i=0; i<zTextFields.length; i++) {\n  thefield=zTextFields[i].name;\n\
  \  if (!thefield) thefield=zTextFields[i].id;\n  // Set up your auto-fill values\
  \ here\n  if (thefield == \"yourname\") zTextFields[i].value=\"Your Name Here\"\
  ;\n  if (thefield == \"phone\") zTextFields[i].value=\"(xxx) xxx-xxxx\";\n  alert(\"\
  field:\" + thefield + \" value: \" + zTextFields[i].value);\n}\n```\n\n***\n\n此脚本使用\
  \ `getElementsByTagName()` 在文档中所有的 `<input>` 元素，包括文本字段。它使用 `for` 循环检查每一个元素。如果发现\
  \ `name` 或 `id` 值为 `\"yourname\"` 或 `\"phone\"` 的字段，它就会插入相应的值。\n\n要测试此脚本，将其保存为 autoform.user.js\
  \ 并按照本章早前的描述安装用户脚本。要测试它，将列表 23.4 保存为 form.html 并将其加载到 Firefox 中——它恰好包含了脚本查找的两个字段名。`yourname`\
  \ 和 `phone` 字段将自动填充警框中首先显示的值，如图 23.5 所示。\n\n**图 23.5** 运行中的表单填充用户脚本。\n\n![image](img/23fig05.jpg)\n\
  \n### 列表 23.4 用于测试 AutoForm 的 HTML 表单\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>自动填充表单示例</title>\n  </head>\n  <body>\n    <h1>自动填充表单示例</h1>\n    <p>请输入以下信息：p>\n\
  \    <form method=\"post\" action=\"\">\n      <p><strong>姓名：</strong>\n       \
  \   <input type=\"text\" size=\"20\" name=\"yourname\" /></p>\n      <p><strong>地址：</strong>\n\
  \          <input type=\"text\" size=\"20\" name=\"address\" /></p>\n      <p><strong>电话：</strong>\n\
  \          <input type=\"text\" size=\"20\" name=\"phone\" /></p>\n      <p><input\
  \ type=\"button\" value=\"显示\" onclick=\"display();\" /></p>\n    </form>\n  </body>\n\
  </html>\n```\n\n***\n\n为了方便测试，列表 23.3 没有在 `@include` 行中包含特定网站。要创建一个真正的特定网站的脚本，你需要找到特定网站的字段名，在脚本中添加\
  \ `if` 语句来填充它们，并使用 `@include` 确保脚本仅在相应网站上运行。\n\n## 调试用户脚本\n\n调试用户脚本与调试普通的 JavaScript\
  \ 程序非常相似——错误显示在 Firefox 的 JavaScript 控制台中或 Internet Explorer 的错误消息中。以下是几个调试技巧：\n\
  \n- 与普通脚本一样，你也可以使用 `alert()` 方法来显示有关脚本运行情况的信息。\n\n- 浏览器可能会随错误消息一起显示行号，但当你处理用户脚本时，这些行号是没有意义的——它们既不是指你用户脚本中的行，也不是指当前正在查看的页面。\n\
  \n- 使用本章前面描述的 `GM_log()` 方法将脚本信息（例如变量的内容）记录到 JavaScript 控制台中。\n\n- 如果你尝试编写跨浏览器用户脚本，请注意特定浏览器的方法。有关跨浏览器问题，请参见第\
  \ 21 章“使用非侵入式 JavaScript.”\n\n- 注意与页面上任何现有脚本的冲突。\n\n- 如果你使用多个用户脚本，请确保它们之间没有冲突。在脚本中使用唯一的变量和函数名。\n\
  \n用户脚本的大多数问题与普通 JavaScript 相同。\n\n***\n\n## 动手尝试：创建一个用户脚本\n\n现在你已经学习了 Greasemonkey\
  \ 的基础知识，可以尝试一个更复杂且更有用的用户脚本示例。\n\n\n\n\n\n如果你在网络上花费了大量时间，你会发现自己经常需要填写 Web 表单，而且你可能在表单中反复输入某些内容——例如你的名字或\
  \ URL。你在这里创建的用户脚本将允许你为任何文本区域定义宏。当你输入一个宏关键字（一个点后跟一段代码），然后输入另一个字符时，该宏关键字就会立即替换为你定义的文本。例如，你可以定义一个宏，使得每当你输入\
  \ `.cu` 时，它都会展开为文本 `\"See you later.\"`。\n\n* * *\n\n### 注意\n\n此脚本已 Firefox 的 Greasemonkey\
  \ 0.9.10 上经过了测试。由于浏览器和扩展程序一直在不断变化，它可能会在某个时刻停止工作。\n\n* * *\n\n列表 23.5 显示了文本区域宏用户脚本。\n\
  \n### 列表 23.5 文本区域宏用户脚本\n\n* * *\n\n```javascript\n// ==UserScript==\n\n// @name\
  \          TextMacro\n\n// @namespace      http://www.thickbook.com/\n// @description\
  \    expands macros in text areas as you type\n// @include        *\n\n// ==/UserScript==\n\
  \n// this function handles the macro replacements\n\nfunction textmacro(e) {\n\n\
  \   // define your macros here\n   zmacros = [\n     [\".mm\", \"Michael Moncur\"\
  ],\n     [\".js\", \"JavaScript\"],\n     [\".cu\", \"See you later.\"]\n   ];\n\
  \n   if (!e) var e = window.event;\n\n   // which textarea are we in?\n   thisarea=\
  \ (e.target) ? e.target : e.srcElement;\n\n   // replace text\n   for (i=0; i<zmacros.length;\
  \ i++) {\n      vv = thisarea.value;\n      vv = vv.replace(zmacros[i][0],zmacros[i][1]);\n\
  \      thisarea.value=vv;\n   }\n}\n\n// install the event handlers\nvar zTextAreas\
  \ = document.getElementsByTagName(\"textarea\");\nfor (var i=0; i<zTextAreas.length;\
  \ i++) {\n   if (zTextAreas[i].addEventListener)\n      zTextAreas[i].addEventListener(\"\
  keydown\",textmacro,0);\n   else if (zTextAreas[i].attachEvent)\n      zTextAreas[i].attachEvent(\"\
  onkeydown\",textmacro);\n}\n```\n\n* * *\n\n#### 它的工作原理\n\n此用户脚本以常用的注释元数据开头。`@include`\
  \ 命令指定了一个通配符 `*`，因此该脚本将在所有网站上运行。实际工作在 `textmacro` 函数中完成。该函数首先定义了可用的宏：\n\n```javascript\n\
  zmacros = [\n  [\".mm\", \"Michael Moncur\"],\n  [\".js\", \"JavaScript\"],\n  [\"\
  .cu\", \"See you later.\"]\n];\n```\n\n* * *\n\n### 注意\n\n为了避免与网页中现有的事件处理器发生冲突，本示例使用了\
  \ `addEventListener()` 方法来添加事件处理器。该方法在不覆盖现有事件的情况下定义了事件处理器。在 Internet Explorer 中，它使用了类似的\
  \ `attachEvent()` 方法。\n\n* * *\n\n本示例使用二维数组定义了三三个宏。为了让该脚本对你有用，请定义你自己的宏。你可以拥有任意数量的宏——只需在最后一行宏之后添加一个逗号，并在闭括号之前添加你的项目即可。\n\
  \n接下来，函数使用 `target` 属性找到你当前正在输入的文本区域。接着，它使用 `for` 循环在文本区域的 `value` 属性中对你的每个宏进行搜索和替换。\n\
  \n`textmacro()` 函数之后的代码部分为每个文本区域设置了事件处理器。首先，它使用 `getElementsByTagName()` 找到所有的文本区域，然后使用\
  \ `for` 循环为每个区域添加一个 `onkeydown` 事件处理器。\n\n* * *\n\n## 提示\n\n此脚本默认在所有网站上运行。如果你只想让宏在某些网站上运行，可以更改\
  \ `@include` 指令来指定它们。如果脚本在某些网站上引起问题，你可以使用 `@exclude` 排除它们。\n\n* * *\n\n#### 使用此脚本\n\
  \n要使用此脚本，请确保你已经按照本章前面的介绍安装并启用了 Greasemonkey。将脚本另存为 `textmacro.user.js`。然后你就可以安装该用户脚本。\n\
  \n安装脚本后，尝试加载任何带有文本区域的页面。你应该能够在文本区域内输入一个宏（如 `.jd` 或 `.js`），后面看到看到字符立即展开为正确的文本。\n\n\
  * * *\n\n## 总结\n\n在本章中，你学习了如何使用 Firefox 的 Greasemonkey 以及其对应的 Internet Explorer\
  \ 版本的 Trixie 来在浏览器中启用用户脚本。你学习了用户脚本是如何工作的，以及如何安装和管理它们。最后，你创建了两个运行的用户脚本示例。\n\n## 问答\n\
  \n**Q. 有什么方法防止用户在查看我的网站时使用 Greasemonkey 吗？**\n\n**A.** 因为 Greasemonkey 只影响安装它的用户，允许它通常是无害的。如果你仍然想阻止其使用，这很困难但并非不可能，并且取决于\
  \ Greasemonkey 的版本。请搜索网络以找到当前的解决方案。\n\n**Q. 如果我想做一些更复杂的操作，例如修改 Firefox 的菜单怎么办？**\n\
  \n**A.** Greasemonkey 并不具备这种能力，但 Firefox 扩展程序也是用 JavaScript 编写的。事实上，你可以将用户脚本编译成\
  \ Firefox 扩展程序，然后添加更高级的功能。详情请参见 [`www.ghacks.net/2009/08/31/greasemonkey-to-firefox-add-on-compiler/`](http://www.ghacks.net/2009/08/31/greasemonkey-to-firefox-add-on-compiler/)。\n\
  \n**Q. 当 Firefox 或 Internet Explorer 发布新版本时会发生什么？**\n\n**A.** 虽然我信任 Greasemonkey\
  \ 的开发者，但无法保证此扩展程序在未来的浏览器版本中运行。如果你担心这一点，你可能想编写自己的 Firefox 扩展程序。\n\n**Q. 使用 Greasemonkey\
  \ 修改页面内容有限制吗？**\n\n**A.** 没有——事实上，你可以使用 `innerHTML` 属性将整个页面的 DOM 内容提取出来，并将其替换为你选择的\
  \ HTML。当然，要让某些东西变得像原页面一样有用，你可能需要做大量工作。\n\n## 工作坊\n\n该工作坊包含了测验题和练习，旨在帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**1.** 下列哪为 Microsoft Internet Explorer 提供了用户脚本支持？**\n\n**a.** Greasemonkey\n\
  **b.** Live Scripting Toolbar\n**c.** Trixie\n\n**2.**** 下列哪项不是有效的 Greasemonkey\
  \ 函数？**\n\n**a.** `GM_log()`\n**b.** `GM_alert()`\n**c.** `GM_setValue()`\n\n**3.).)****\
  \ 是正确的 `@include` 指令可以在 [www.google.com](http://www.google.com) 和 [google.com](http://google.com)\
  \ 上运行脚本？**\n\n**a.** `@include *.google.com`\n**b.** `@include` [`www.google.com`](http://www.google.com)`.*`\n\
  **c.** `@include google.com`\n\n## 答案\n\n**1.** c. Trixie 是用于 Internet Explorer\
  \ 的用户脚本插件。\n\n**2.** b. 没有 `GM_alert()` 方法，尽管标准的 `alert()` 方法在用户脚本中可以工作。\n\n**3.**\
  \ a. 使用 `@include *.google.com` 将将在 [google.com](http://google.com) 域名下任何网站的任何页面上运行脚本。\n\
  \n## 练习\n\n• 修改 列表 2.2 中的颜色更改用户脚本，使用不同的颜色并添加另一个样式属性——例如，使用 `style.fontSize` 修改字体大小。\n\
  \n• 颜色更改示例对段落有效，但文本通常出现在其他地方。修改 列表 23.2 对 `<li>` 标签和段落进行更改。\n\n• 目前，尝试一下 部分中的宏示例仅对使用\
  \ `<textarea>` 标签的文本输入有效。修改 列表 23.3 中的脚本，使其也能对`<input>` 标签有效。（你需要添加第二次 `getElementsByTagName()`\
  \ 调用和一个循环来添加事件处理器。）\n\n\n\n\n\n- 使用 `XMLHttpRequest` 对象的属性和方法\n- 创建你自己的 AJAX 库\n\
  - 使用 AJAX 从 XML 文件读取数据\n- 调试 AJAX \n- 使用 AJAX 与 PHP 程序进行通信\n\n`remote scripting`（远程脚本），也称为\
  \ AJAX（异步 JavaScript 和 XML），是一种浏览器功能，它允许 JavaScript 突破客户端边界，并与 Web 服务器上的文件或服务器端程序进行交互。在本章中，你将学习\
  \ AJAX 的工作原理并创建两个运行示例。\n\n## 介绍 AJAX\n\n传统上，JavaScript 的主要限制之一是它无法与 Web 服务器通信，因为它是一种客户端技术——它留在浏览器内部。例如，你可以用\
  \ JavaScript 创建游戏，但若要在服务器上存储高分列表，则需要将页面提交到服务器端的表单，而 JavaScript 是做不到的（因为它的设计目的并非如此）。\n\
  \n单从用户交互的角度来看，普通网页的局限性之一是从用户获取数据到服务器、或从服务器获取数据到用户通常需要加载并显示新页面。但在 2011 年，你可能每天都会遇到这样的网站，它们允许你与内容交互，而无需每次点击或提交按钮时都加载新页面。\n\
  \nAJAX 是这两个问题的答案。AJAX 是指 JavaScript 使用内置对象 `XMLHttpRequest` 在不提交表单或不加载页面的情况下与 Web\
  \ 服务器通信的能力。该对象受到 Internet Explorer、Firefox、Chrome 以及所有其他现代浏览器的支持。\n\n尽管 `AJAX` 一词诞生于\
  \ 2005 年，但 `XMLHttpRequest` 已经被浏览器支持了多年——它由微软开发，并首次出现在 Internet Explorer 5 中。尽管如此，它最近才开始成为一种流行的应用程序开发方式，因为支持它的浏览器已经变得越来越普遍。这种技术的另一个名称是\
  \ `remote scripting`。\n\n> 注意\n> `AJAX` 术语最早出现在 Adaptive Path 的 Jesse James Garrett\
  \ 在 2005 年 2 月 18 日的一篇在线文章。它仍然出现在这里：[`www.adaptivepath.com/ideas/ajax-new-approach-web-applications`](http://www.adaptivepath.com/ideas/ajax-new-approach-web-applications)。\n\
  \n## JavaScript 客户端（前端）\n\nJavaScript 上只有一种与服务器通信的方法——提交表单。远程脚本允许与服务器进行更灵活的通信。AJAX\
  \ 中的 `A` 代表 `asynchronous`（异步），这意味着浏览器（以及用户）不需要在等待服务器响应时处于挂状态。以下是典型的 AJAX 请求的工作原理：\n\
  \n1. 脚本创建一个 `XMLHttpRequest` 对象并将其发送到 Web 服务器。脚本在发送请求后可以继续执行。\n2. 服务器通过发送文件内容或服务器端程序的输出进行响应。\n\
  3. 当响应从服务器到达时，会触发一个 JavaScript 函数对数据进行处理。\n4. 因为目标是实现更具响应性的用户界面，脚本通常使用 `DOM` 显示来自服务器的数据，从而消除了刷新页面的需求。\n\
  \n在实践中，这种情况发生很快，即使服务器很慢，它仍然有效。此外，由于请求是异步的，同时可以有多个请求在进行。\n\n## 服务器端脚本（后端）\n\n驻留在\
  \ Web 服务器上的应用程序部分被称为 `back end`（后端）。最简单的后端是服务器上的静态文件——JavaScript 可以通过 `XMLHttpRequest`\
  \ 请求文件，然后读取并处理其内容。更常见的是，后端是运行在 `PHP`、`Perl` 或 `Ruby` 等语言上的服务器端程序。\n\nJavaScript\
  \ 可以 `GET` 或 `POST` 方法向服务器端程序发送数据，这与 HTML 表单的两种工作方式相同。在 `GET` 请求中，数据被编码在加载程序的 URL\
  \ 中。在 `POST` 请求中，数据被单独发送并可以包含更多数据。\n\n## XML\n\nAJAX 中的 `X` 代表 `XML`（可扩展标记语言），这是构建最新版本\
  \ HTML 的通用标记语言。服务器端文件或程序可以以 XML 格式发送数据，JavaScript 可以使用其处理 XML 的方法对数据进行操作。这些与你已经使用的\
  \ `DOM` 方法相似——例如，你可以使用 `getElementsByTagName()` 方法找到数据中具有特定标签的元素。\n\n> 注意\n> JSON（JavaScript\
  \ 对象表示法）采用了在 JavaScript 中编码数据的思想并将其形式化。访问 [`www.json.org/`](http://www.json.org/)\
  \ 查看详细信息和许多语言的代码示例。\n\n请记住，XML 只是发送数据的一种方式，并不总是最简单的。服务器可以同样地发送纯文本，脚本可以显示它；或者发送 `HTML`，脚本可以通过\
  \ `innerHTML` 属性将其插入页面中。有些程序员甚至使用服务器端脚本返回 JavaScript 格式的数据，这可以使用 `eval` 函数轻松执行。\n\
  \n## AJAX 的常见示例\n\n虽然通常使用 HTML 和 JavaScript 来构建网页和网站，但 AJAX 技术通常会产生 `web applications`（Web\
  \ 应用程序）——为用户执行工作的 Web 服务。以下是 AJAX 的一些示例：\n\n- Google 的 Gmail 邮件客户端 ([`mail.google.com/`](http://mail.google.com/))\
  \ 使用 AJAX 构建了一个响应快速的电子邮件应用程序。你可以删除消息并执行其他任务，而无需等待新页面加载。\n- [Amazon.com](http://Amazon.com)\
  \ 在某些功能中使用 AJAX。例如，如果你点击产品评论的某个“是/否”投票按钮之一，它会将你的投票发送到服务器，并在按钮旁边显示一条感谢你的消息，而整个过程无需加载页面。\n\
  - Digg ([`www.digg.com`](http://www.digg.com)) 是一个用户可以在其中提交新闻故事并投票决定哪些故事显示在首页的网站。投票在页面内每个故事旁边进行。\n\
  \n这些只是几个例子。远程脚本的细微之处正出现在 Web 的各个角落，你可能甚至不会注意到——你只是会在等待页面加载时少感到那么一点烦心。\n\n## AJAX\
  \ 框架和库\n\n由于远程脚本可能非常复杂，特别是考虑到你将在本章后面将学到的浏览器差异，已经开发了一些框架和库来简化 AJAX 编程。\n\n> 注意\n\
  > 请参见 第 22 章，“使用第三方库”，获取有关在 JavaScript 中使用第三方库的信息。\n\n作为开始，本书前面介绍的三个库（JQuery、Prototype\
  \ 和 Script.aculo.us）都包含了简化远程脚本的函数。还存在一些针对 `PHP`、`Python` 和 `Ruby` 等语言的专用库。\n\n有些库旨在为\
  \ JavaScript 添加服务器端功能，而另一些库则旨在为 `PHP` 等语言添加 JavaScript 交互性。你将在本章稍后构建一个简单的库，用于处理本章示例中的远程脚本函数。\n\
  \n## AJAX 的局限性\n\n远程脚本是一项相对新技术，因此它有一些做不到的事情，以及一些需要注意的地方。以下是 AJAX 的局限性和潜在问题：\n\n\
  - 脚本与 XML 数据或其请求数据的服务器端程序必须位于同一域上。\n- 一些旧版浏览器和一些不常用的浏览器（如移动浏览器）不支持 `XMLHttpRequest`，因此你不能指望所有用户都能使用它。\n\
  - 要求 AJAX 可能会损害网站对残障用户的可用性。\n- 用户可能仍然习惯于每次更改内容时加载新页面，因此他们他们理解 AJAX 应用程序可能有一个学习曲线。\n\
  \n\n\n\n\n与 JavaScript 的其他高级用法一样，最佳方法是不要具有侵入性——尽可能确保在没有 `AJAX` 支持的情况下仍有方法访问网站，并使用特性检测（feature\
  \ sensing）来防止在不支持它的浏览器上发生错误。更多细节请参见第 21 章“使用非侵入式 JavaScript”。\n\n## 使用 `XMLHttpRequest`\n\
  \n你现在将学习如何使用 `XMLHttpRequest` 与服务器通信。这看起来可能有点复杂，但对任何请求的过程都是相同的。稍，你将创建一个可用的代码库来简化这一过程。\n\
  \n### 创建请求\n\n第一步是创建一个 `XMLHttpRequest` 对象。为了做到这一点，你像使用其他 JavaScript 对象一样使用 `new`\
  \ 关键字。以下语句在某些浏览器中创建一个请求对象：\n\n```\najaxreq = new XMLHttpRequest();\n```\n\n之前的示例适用于\
  \ Firefox、Chrome、Internet Explorer 7 和 8 以及其他现代浏览器，但不支持 Internet Explorer 5 或 6。是否支持这些浏览器取决于你，因为它们的使用率非常低。然而，某些机构的工作站上可能安装了大量的\
  \ IE6 浏览器，所以你的情况可能会有所不同。\n\n从现在开始，示例代码将仅支持 IE7 及更高版本（现代浏览器），但如果你想支持这些旧浏览器，则必须使用\
  \ ActiveX 语法：\n\n```\najaxreq = new ActiveXObject(\"Microsoft.XMLHTTP\");\n```\n\
  \n本章稍后的库部分将演示如何根据所使用的浏览器使用正确的方法。无论哪种情况，你使用的变量（示例中的 `ajaxreq`）都存储了 `XMLHttpRequest`\
  \ 对象。你将使用该对象的方法来打开和发送请求，如下文节所示。\n\n### 打开 URL\n\n`XMLHttpRequest` 对象的 `open()` 方法指定了文件名以及数据发送到服务器的方法：`GET`\
  \ 或 `POST`。这些与 Web 表单支持的方法相同。\n\n```\najaxreq.open(\"GET\",\"filename\");\n```\n\
  \n对于 `GET` 方法，你发送的数据包含在 URL 中。例如，此命令打开 `search.php` 程序并为 `query` 参数发送值“John”：\n\n\
  ```\najaxreq.open(\"GET\",\"search.php?query=John\");\n```\n\n### 发送请求\n\n你使用 `XMLHttpRequest`\
  \ 对象的 `send()` 方法将请求发送到服务器。如果你使用的是 `POST` 方法，要发送的数据是 `send()` 的参数。对于 `GET` 请求，你可以使用\
  \ `null` 值代替：\n\n```\najaxreq.send(null);\n```\n\n### 等待响应\n\n请求发送后，你的脚本将继续执行而无需等待结果。因为结果可能随时到达，你可以通过事件处理器来检测它。`XMLHttpRequest`\
  \ 对象有一个 `onreadystatechange` 事件处理器用于此。你可以创建一个函数来处理响应并将其设置为该事件的处理器：\n\n```\najaxreq.onreadystatechange\
  \ = MyFunc;\n```\n\n## 注意事项\n\n与事件处理器一样，确保指定不带括号的函数名。带有括号，你指的是函数的*结果*；不带括号，你指的是函数本身。\n\
  \n请求对象有一个属性 `readyState`，指示其状态，每当 `readyState` 属性发生变化时，就会触发此事件。`readyState` 的值从新请求的\
  \ `0` 到完成请求的 `4`，因此你的事件处理函数通常需要关注值为 `4`。\n\n尽管请求已完成，但它可能并没有执行成功。如果请求成功，`status`\
  \ 属性被设置为 200；如果失败，则设置为错误代码。`statusText` 属性存储错误的文本说明或成功时的“OK”。\n\n### 解释响应数据\n\n\
  当 `readyState` 属性达到 `4` 且请求完成时，从服务器返回的数据将通过两个属性提供给你的脚本：`responseText` 是原始文本形式的响应，`responseXML`\
  \ 是作为 XML 对象的响应。如果数据不是 XML 格式，则只有文本属性可用。\n\nJavaScript 的 DOM 方法旨在用于 XML 上工作，因此你可以配合\
  \ `responseXML` 属性使用它们。在本章的稍后部分，你将使用 `getElementsByTagName()` 方法从 XML 中提取数据。\n\n\
  ## 创建一个简单的 AJAX 库\n\n你现在应该已经意识到 AJAX 请求可能有点复杂。为了让事情变得简单，你可以创建一个 AJAX 库。这是一个 JavaScript\
  \ 文件，提供了处理发送请求和接收结果的函数，你可以在需要 AJAX 函数时随时复用它。\n\n该库将用于本章稍后的两个示例中。列表 24.1 显示了完整的 AJAX\
  \ 库，包括针对旧浏览器的特殊情况。\n\n列表 24.1 AJAX 库\n\n```javascript\n// 用于跟踪请求的全局变量\n// 以及完成时调用的函数\n\
  var ajaxreq=false, ajaxCallback;\n\n// ajaxRequest：设置请求\nfunction ajaxRequest(filename)\
  \ {\n    try {\n      // Firefox / IE7 / Others\n      ajaxreq= new XMLHttpRequest();\n\
  \    } catch (error) {\n      try {\n        // IE 5 / IE 6\n        ajaxreq = new\
  \ ActiveXObject(\"Microsoft.XMLHTTP\");\n      } catch (error) {\n        return\
  \ false;\n      }\n    }\n    ajaxreq.open(\"GET\", filename);\n    ajaxreq.onreadystatechange\
  \ = ajaxResponse;\n    ajaxreq.send(null);\n}\n\n// ajaxResponse：等待响应并调用函数\nfunction\
  \ ajaxResponse() {\n    if (ajaxreq.readyState !=4) return;\n    if (ajaxreq.status==200)\
  \ {\n      // 如果请求成功...\n      if (ajaxCallback) ajaxCallback();\n    } else alert(\"\
  Request failed: \" + ajaxreq.statusText);\n    return true;\n}\n```\n\n接下来的节将解释该库如何工作以及如何使用它。\n\
  \n### `ajaxRequest` 函数\n\n`ajaxRequest` 函数处理创建和发送 `XMLHttpRequest` 所需的所有步骤。首先，它创建\
  \ `XMLHttpRequest` 对象。如之前所述，这对于旧浏览器需要不同的命令，如果执行了错误的命令会导致错误，因此使用 `try` 和 `catch`\
  \ 来创建请求。首先使用标准方法，如果它导致错误，则尝试 ActiveX 方法。如果那也导致错误，则将 `ajaxreq` 变量设置为 `false` 以表示不支持\
  \ AJAX。\n\n### `ajaxResponse` 函数\n\n`ajaxResponse` 函数用作 `onreadystatechange` 事件处理器。该函数首先检查\
  \ `readyState` 属性的值是否为 `4`。如果是其他值，函数将返回而不执行任何操作。\n\n接下来，它检查 `status` 属性的值是否为 `200`，这表示请求成功。如果是，运行存储在\
  \ `ajaxCallback` 变量中的函数。如果不是，它会在警告框中显示错误消息。\n\n### 使用库\n\n要使用此库，请遵循以下步骤：\n\n1. 将库文件保存为\
  \ `ajax.js`，并放在与 HTML 文档和脚本相同的文件夹中。\n2. 使用 `<script src>` 标签将脚本包含在文档中。它应该在任何其他使用其特性的脚本之前包含。\n\
  3. 在你的脚本中，创建一个在请求完成后被调用的函数，并将 `ajaxCallback` 变量设置为该函数。\n4. 调用 `ajaxRequest()` 函数。其参数是服务器端程序或文件名。（此库仅支持\
  \ `GET` 请求，所以你不需要指定方法。）\n5. 当请求成功完成时，你在 `ajaxCallback` 中指定的函数将被调用，全局变量 `ajaxreq`\
  \ 将在其 `responseXML` 和 `responseText` 属性中存储数据。\n\n本章剩下的两个示例将利用此库创建 AJAX 应用程序。\n\n\
  ## 使用库创建 AJAX 测验\n\n\n\n\n现在你已经有了一个可重用的 AJAX 库，你可以用它来创建利用远程脚本的 JavaScript 应用程序。第一个示例将在页面上显示测验问题，并提示你输入答案。\n\
  \n### 注意\n\n与书中的大多数脚本不同，此示例需要一个 Web 服务器。由于浏览器对远程脚本的安全性限制，它无法在本地机器上运行。\n\n此示例没有将问题包含在脚本中，而是从服务器上的\
  \ `XML` 文件中读取测验问题和答案，作为 AJAX 的演示。\n\n### HTML 文件\n\n此示例的 HTML 非常直观。它定义了一个简单的表单，包含一个\
  \ `Answer` 字段和一个 `Submit` 按钮，以及一些为脚本留的钩子。此示例的 HTML 所示于 列表 24.2。\n\n列表 24.2 测验示例的\
  \ HTML 文件\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Ajax Quiz Test</title>\n    <script type=\"text/javascript\" src=\"ajax.js\"\
  ></script>\n  </head>\n  <body>\n    <h1>Ajax Quiz Example</h1>\n    <form method=\"\
  post\" action=\"\">\n      <p><input type=\"button\" value=\"Start the Quiz\" id=\"\
  startq\" /></p>\n      <p><strong>问题：</strong>\n      <span id=\"question\">[点击按钮开始测验]</span></p>\n\
  \      <p><strong>答案：</strong>\n      <input type=\"text\" name=\"answer\" id=\"\
  answer\" /></p>\n      <p><input type=\"button\" value=\"Submit Answer\" id=\"submit\"\
  \ /></p>\n    </form>\n    <script type=\"text/javascript\" src=\"quiz.js\"></script>\n\
  \  </body>\n</html>\n```\n\n此 HTML 文件包含以下元素：\n\n* 位于 `<head>` 部分的 `<script>` 标签包含了你在上一节中从\
  \ `ajax.js` 文件创建的 AJAX 库。\n* 位于 `<body>` 部分的 `<script>` 标签包含了 `quiz.js` 文件，该文件包含测验脚本。\n\
  * `<span id=\"question\">` 标签为脚本插入问题留了位置。\n* `id` 值为 `\"answer\"` 的文本框是用户回答问题的地方。\n\
  * `id` 值为 `\"submit\"` 的按钮将提交答案。\n* `id` 值为 `\"startq\"` 的按钮将启动测验。\n\n此时，你可以通过将文件放置在\
  \ Web 服务器上并通过 URL 访问来测试该 HTML 文档，但在添加 XML 和 JavaScript 文件之前，按钮将无法工作，你将在接下来的两个节中学习到这一点。\n\
  \n### XML 文件\n\n测验的 XML 文件所示于 列表 24.3。我已经在其中填充了几个 JavaScript 问题，但它很容易被调整用于其他用途。\n\
  \n列表 24.3 包含测验问题和答案的 XML 文件\n\n```xml\n<?xml version=\"1.0\" ?>\n<questions>\n \
  \   <q>哪个 DOM 对象包含窗口的 URL 信息？</q>\n    <a>location</a>\n    <q>document 对象的哪个方法可以元素的对象？</q>\n\
  \    <a>getElementById</a>\n    <q>如果你在函数外声明变量，它是全局的还是局部的？</q>\n    <a>global</a>\n\
  \    <q>JavaScript 语言的正式标准称什么？</q>\n    <a>ECMAScript</a>\n</questions>\n```\n\n\
  `<questions>` 标签封装了整个文件，每个问题和答案分别封装在 `<q>` 和 `<a>` 标签中。记住，这是 XML true HTML——这些不是标准的\
  \ HTML 标签，而是为此示例创建的标签。由于此文件仅供你的脚本使用，因此它不需要遵循标准格式。\n\n要使用此文件，请将其保存为 `questions.xml`\
  \ 并放在 HTML 文档相同的文件夹中。它将由你在下一节中创建的脚本加载。\n\n当然，对于如此小的测验，你可以通过将问题和答案存储在 JavaScript\
  \ 数组中让事情变得简单。但想象一个庞大的测验，有数千个问题，或者一个从数据库提取问题的服务器端程序，甚至有几百个不同测验的文件供选择，你就能看到使用单独 XML\
  \ 文件的好处了。\n\n### JavaScript 文件\n\n由于你有一个独立的库来处理发送 AJAX 请求和接收响应的复杂性，此示例的脚本只需要处理测验本身的操作。列表\
  \ 24.4 显示了此示例的 JavaScript 文件。\n\n列表 24.4 测验示例的 JavaScript 文件\n\n```javascript\n\
  //全局变量 qn 是当前问题编号\nvar qn=0;\n// 从 XML 文件加载问题\nfunction getQuestions() {\n    obj=document.getElementById(\"\
  question\");\n    obj.firstChild.nodeValue=\"(please wait)\";\n    ajaxCallback\
  \ = nextQuestion;\n    ajaxRequest(\"questions.xml\");\n}\n// 显示下一个问题\nfunction\
  \ nextQuestion() {\n    questions = ajaxreq.responseXML.getElementsByTagName(\"\
  q\");\n    obj=document.getElementById(\"question\");\n    if (qn < questions.length)\
  \ {\n        q = questions[qn].firstChild.nodeValue;\n        obj.firstChild.nodeValue=q;\n\
  \    } else {\n        obj.firstChild.nodeValue=\"(no more questions)\";\n    }\n\
  }\n// 检查用户的答案\nfunction checkAnswer() {\n    answers = ajaxreq.responseXML.getElementsByTagName(\"\
  a\");\n    a = answers[qn].firstChild.nodeValue;\n    answerfield = document.getElementById(\"\
  answer\");\n    if (a == answerfield.value) {\n        alert(\"Correct!\");\n  \
  \  }\n    else {\n        alert(\"Incorrect. The correct answer is: \" + a);\n \
  \   }\n    qn = qn + 1;\n    answerfield.value=\"\";\n    nextQuestion();\n}\n//\
  \ 设置按钮事件处理器\nobj=document.getElementById(\"startq\");\nobj.onclick=getQuestions;\n\
  ans=document.getElementById(\"submit\");\nans.onclick=checkAnswer;\n```\n\n此脚本包含以下内容：\n\
  \n* 第一个 `var` 语句定义了一个全局变量 `qn`，它将跟踪当前显示的是哪个问题。它初始设置为零对应第一个问题。\n* 当用户点击“Start Quiz”按钮时，会调用\
  \ `getQuestions()` 函数。该函数使用 AJAX 库请求 `questions.xml` 文件的内容。它将 `ajaxCallback` 变量设置为\
  \ `nextQuestion()` 函数。\n* 当 AJAX 请求完成时，会调用 `nextQuestion()` 函数。该函数使用 `responseXML`\
  \ 属性上的 `getElementsByTagName()` 方法找到所有问题（`<q>` 标签），并将它们存储在 `questions` 数组中。\n* 当用户提交答案时，会调用\
  \ `checkAnswer()` 函数。它使用 `getElementsByTagName()` 将答案（`<a>` 标签）存储在 `answers` 数组中，然后将当前问题的答案与用户的答案进行比较，并显示指示其正确或错误的警报框。\n\
  * 该函数之后的脚本命令设置了两个事件处理器。一个将 `getQuestions()` 函数绑定到“Start Quiz”按钮上以设置测验；另一个将 `checkAnswer()`\
  \ 函数绑定到“Submit”按钮上。\n\n### 测试测验\n\n要尝试此示例，你需要在同一个文件夹中准备所有四个文件：`ajax.js`（AJAX 库）、`quiz.js`（测验函数）、`questions.xml`（问题）以及\
  \ HTML 文档。除了 HTML 文档外，所有文件都需要具有正确的文件名才能工作。此外，记住，由于使用了 AJAX，此示例需要一个 Web 服务器。\n\n\
  图 24.1 显示了运行中的测验。刚刚回答了第二个问题。\n\n**图 24.1** 在浏览器中加载的测验示例。\n\n![image](img/24fig01.jpg)\n\
  \n### 调试 AJAX \n\n处理远程脚本意味着同时处理多种语言——JavaScript、服务器端语言（如 PHP）、XML，当然还有 HTML。因此，当你发现错误时，追踪它可能会困难。以下是调试\
  \ AJAX 应用程序的一些技巧：\n\n\n\n\n\n- 确保所有文件名均正确，并且应用程序的所有文件都在服务器的同一个文件夹中。\n- 如果你正在使用服务器端语言，请在不运行脚本的情况下进行测试：在浏览器中加载它并确保其运行正常；尝试在\
  \ URL 中向其传递变量并检查结果。\n- 检查 `statusText` 属性以获取请求的结果——在这里使用 `alert` 消息很有帮助。它通常是一个清晰的提示，例如“文件未找到”，这可能就能解释问题所在。\n\
  - 如果你正在使用第三方 AJAX 库，请检查其文档——许多库都有内置的调试功能，你可以启用这些功能以检查运行状况。\n\n## 动手尝试：制作实时搜索表单\n\
  \nAJAX 最令人印象深刻的演示之一是`实时搜索`：普通的搜索表单需要你点击按钮并等待页面加载才能看到结果，而实时搜索会在你在搜索字段中输入内容时，立即在页面内显示结果。当你输入字母或按退格键时，结果会立即更新，从而让你轻松找到所需的结果。\n\
  \n使用你之前创建的 AJAX 库，实现实时搜索并不困难。这个示例将使用服务器端的 PHP 程序来提供搜索结果，并可以轻松适配到任何搜索应用。\n\n## 注意事项\n\
  \n再次强调，由于使用了 AJAX，此示例需要一个 Web 服务器。你还需要安装 PHP，大多数托管服务都默认安装了它。\n\n## HTML 表单\n\n此示例的\
  \ HTML 仅定义了一个搜索字段，并为动态结果留出了空间。HTML 文档如列表 24.5 所示。\n\n列表 24.5 用于实时搜索示例的 HTML 文件\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Ajax Live\
  \ Search Example</title>\n    <script type=\"text/javascript\" src=\"ajax.js\"></script>\n\
  \  </head>\n  <body>\n    <h1>Ajax Live Search Example</h1>\n    <form method=\"\
  get\" action=\"\">\n      <p><strong>Search for:</strong>\n        <input type=\"\
  text\" size=\"40\" id=\"searchlive\" /></p>\n      <div id=\"results\">\n      \
  \  <ul id=\"list\">\n          <li>[Search results will display here.]</li>\n  \
  \      </ul>\n      </div>\n    </form>\n    <script type=\"text/javascript\" src=\"\
  search.js\"></script>\n  </body>\n</html>\n```\n\n此 HTML 文档包含以下内容：\n\n- `<head>`\
  \ 部分中的 `<script>` 标签包含了 AJAX 库 `ajax.js`。\n- `<body>` 部分中的 `<script>` 标签包含了 `search.js`\
  \ 脚本，该脚本你接下来要创建的。\n- `id` 值为 `\"searchlive\"` 的 `<input>` 元素是你输入搜索查询的地方。\n- `id`\
  \ 值为 `\"results\"` 的 `<div>` 元素将作为动态获取结果的容器。使用 `<ul>` 标签创建一个项目列表；当你开始打字时，它将被结果列表替换。\n\
  \n## PHP 后端\n\n接下来，你需要一个服务器端程序来生成搜索结果。这个 PHP 程序包含一个存储在数组中的姓名列表。它将对 JavaScript 查询做出响应，返回与用户目前输入内容匹配的姓名。姓名将以\
  \ XML 格式返回。例如，当搜索“smith”时，PHP 程序的输出如下：\n\n```xml\n<names>\n<name>John Smith</name>\n\
  <name>Jane Smith</name>\n</names>\n```\n\n虽然为了简单，姓名列表存储在此 PHP 程序中，但在实际应用中，它更有可能存储在数据库中——此脚本可以轻松适配到包含成千上万姓名的数据库。PHP\
  \ 程序如列表 24.6 所示。\n\n列表 24.6 用于实时搜索示例的 PHP 代码\n\n```php\n<?php\n  header(\"Content-type:\
  \ text/xml\");\n  $names = array (\n    \"John Smith\", \"John Jones\", \"Jane Smith\"\
  , \"Jane Tillman\",\n    \"Abraham Lincoln\", \"Sally Johnson\", \"Kilgore Trout\"\
  ,\n    \"Bob Atkinson\", \"Joe Cool\", \"Dorothy Barnes\",\n    \"Elizabeth Carlson\"\
  , \"Frank Dixon\", \"Gertrude East\",\n    \"Harvey Frank\", \"Inigo Montoya\",\
  \ \"Jeff Austin\",\n    \"Lynn Arlington\", \"Michael Washington\", \"Nancy West\"\
  \ );\nif (!$query) {\n    $query=$_GET['query'];\n}\nheader(\"Content-type: text/xml\"\
  );\necho \"<names>\";\nforeach ($names as $name) {\n    if (stripos($name, $query)\
  \ !== false) {\n        echo \"<name>$name</name>\";\n    }\n}\necho \"</names>\"\
  ;\n?>\n```\n*(注：由于原文提供的 PHP 代码块不完整，此处在翻译时根据逻辑进行了补全以保持代码可读性)*\n\n\n\n\n\n- 当 AJAX\
  \ 请求完成时，会调用 `DisplayResults()` 函数。它会删除 `<div id=\"results\">` 部分中的项目符号列表，然后使用 W3C\
  \ DOM 和 AJAX 结果组装一个新列表。如果没有结果，它将在列表中显示“无结果”的消息。\n- 脚本的最后几行将 `StartSearch()` 函数设置为搜索字段\
  \ `onkeydown` 事件的事件处理器。\n\n## 让这一切运行起来\n\n要尝试这个示例，你需要在 Web 服务器上准备三个文件：`ajax.js`（库）、`search.js`（搜索脚本）以及\
  \ HTML 文件。图 24.2 显示了该示例的运行情况。\n\n**图 24.2** 在浏览器中显示的实时搜索示例。\n\n![image](img/24fig02.jpg)\n\
  \n## 总结\n\n在本章中，你学习了 AJAX（或远程脚本）如何允许 JavaScript 与 Web 服务器进行通信。你并创建了一个可重用的 AJAX 库，可以用于创建任意数量的\
  \ AJAX 应用，并使用 XML 文件创建了一个示例。最后，你使用 AJAX 和 PHP 创建了一个实时搜索表单。\n\n## 问答\n\n**Q. 如果服务器缓慢或从不响应请求会怎样？**\n\
  \n**A.** 这是你应该将 AJAX 作为一种可选功能的另一个原因——无论是由服务器还是用户连接引起的，总会有响应缓慢或从不响应的时候。在这种情况下，回调函数将延迟调用或根本不调用。这可能会导致请求冲突的问题；例如，在实时搜索示例中，不稳定的服务器可能会导致前几个字符的响应间隔几秒到达，从而让用户感到困惑。你可以通过检查\
  \ `readyState` 属性来解决这个问题，在启动另一个请求之前确保没有请求正在进行。\n\n**Q. 在实时搜索示例中，为什么 `onkeydown`\
  \ 事件处理器是必要的？使用 `onchange` 事件不是更易用吗？**\n\n**A.** 虽然 `onchange` 可以 true 你表单字段何时发生，但它直到用户移动到另一个字段时才会被触发——它不适用于“实时”搜索，所以你必须监听按键。`onkeypress`\
  \ 处理器可以工作，但在某些浏览器中它无法检测到退格键（Backspace），而当你通过退格缩短查询语句时，搜索能够随之更新是非常友好的。\n\n## 工作坊\n\
  \n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n## 测验\n\n**1.** 下列哪是 `AJAX`\
  \ 中的 `A`？\n\n**a.** Advanced（高级）\n**b.** Asynchronous（异步）\n**c.** Application（应用）\n\
  \n**2.**** `XMLHttpRequest` 对象的哪个属性表示请求是否成功？\n\n**a.** `status`\n**b.** `readyState`\n\
  **c.** `success`\n\n**3.**** 正确或错误：为了支持旧版本的 Internet Explorer，使用 AJAX 时必须创建一个 ActiveX\
  \ 对象而不是 `XMLHttpRequest` 对象。\n\n## 答案\n\n**1.** b. AJAX 代表 Asynchronous JavaScript\
  \ and XML（异步 JavaScript 和 XML）。\n**2.** a. `status` 属性表示请求是否成功；`readyState` 表示请求是否已完成，但不表示是否成功。\n\
  **3.** 正确。Internet Explorer 5 和 6 需要 ActiveX，而 Internet Explorer 7 之后的版本原生支持 `XMLHttpRequest`\
  \ 对象。\n\n## 练习\n\n- 就你喜欢的话题构建自己的 XML 问答文件，并用测验示例进行尝试。\n- 使用 AJAX 库为你的网站添加 AJAX 功能，或创建一个你自己的简单示例。\n\
  \n# 第六部分。高级网站功能与管理\n\n## 第 25 章 创建打印友好的网页\n\n在本章中，你将学习：\n\n- 什么让页面具有打印友好\n- 如何应用特定媒体样式表\n\
  - 如何为打印页面创建样式表\n- 如何在打印预览模式下查看你的网页\n\n如果你曾经用过如 MapQuest 或 Google Maps 这样的在线地图工具，你一定体会过打印网页的需求。同样，仅在线提供的优惠券、在线转售商的物品购买收据，以及基于\
  \ Web 的航班值机和从家里电脑打印登机牌的能力，增加了对打印友好页面的需求。事实上，并不是所有的网页都是完全为屏幕查看而设计的！\n\n你可能没有意识到这一点，但对于想要打印副本进行离线阅读的用户，专门为你的页面设计并提供打印友好版本是可能的——这是\
  \ Google Maps 在向你显示屏幕内容后提供的功能。CSS 能够轻松创建根据查看方式改变外观的网页。在本章中，你将学习如何创建此类页面。\n\n###\
  \ 动手一试：检查你的内容的打印友好性\n\n在学习本章时，考虑你自己的可能在打印时看起来良好的网页。然后想想你想对它们做哪些更改，以便它们在打印页面上看起来更好。这里是一些可以考虑的想法：\n\
  \n- 即使违反了之前章节章中的警告，你是否有使用图案背景图像或带有对比文本的不寻背景颜色的页面？这种页面因为背景的原因很难打印，所以你可以考虑提供一个不使用自定义背景图像或颜色、仅使用黑色文字的页面打印版本。在准备打印页面时，请尽可能在白色背景上使用黑色文字。\n\
  - 你的页面是否包含很多链接？如果是，你可能考虑更改打印时链接的外观，使其不那么突出——例如，移除任何下划线。记住，你无法点击一张纸！\n- 最后，你页面上的每张图像都是必不可少的吗？彩色图像在大多数打印机上打印需要昂贵的墨水，所以你可能考虑在打印友好页面中省去部分或全部图像。\n\
  \n### 什么让页面具有打印友好？\n\n需要指出的是，某些网页已经是打印友好的。如果你的页面使用白色背景、深色对比文字和较少的图像，你可能甚至不需要担心特殊的打印友好版本。另一方面，具有深色背景、动态链接和多张图像的页面对于普通打印机来说可能是难以处理的。\n\
  \n在考虑如何让你的页面更具打印友好时，需要记住媒介带来的局限性。换句话说，打印页面的哪些特征使其与计算机屏幕有不同之处？明显的区别是尺寸——打印页面是固定尺寸，通常为\
  \ 8 ½ 比 11 英寸，而屏幕尺寸可以变化很大。除了尺寸之外，打印页面还有颜色限制（即使在彩色打印机上）。很少有用户愿意浪费打印全彩色背景所需的墨水，而他们其实只想打印页面上的文字。\n\
  \n大多数用户对打印页面上核心文字以外的内容也不感兴趣。例如，图 25.1 显示了从密苏里州独立市到俄勒冈州俄勒冈市的旅行路线（历史俄勒冈小径的近似图）。\n\n\
  **图 25.1** 由于表单输入和带有自身显示控件的大图像，此页面并不非常打印友好。\n\n![image](img/25fig01.jpg)\n\n\n\n\
  \n图 25.1 所示的页面包含表单输入字段、一个可以自行控制（移动、缩放等）的大图像，以及你在网页内容中预期的其他辅助项目。地图上方出现了一组你可以执行的操作（Actions），其中一个就是打印该页面的链接。此时，你可能会奇怪为什么不能直接点击浏览器上的“打印”按钮。你确实可以这样做，但该命令会按照屏幕上显示的样式打印页面——包括表单输入字段和图形元素，而你真正想知道的只是行驶这条路线时需要转哪些弯。\n\
  \n如果你点击页面正文中的打印链接，你的网页浏览器将显示一个页面（参见图 25.2），这是 Google 专门为打印格式化的页面。\n\n**图 25.2**\
  \ 该页面的打印友好版本分离了驾驶指令的文本，以便其单独打印。\n\n![image](img/25fig02.jpg)\n\n如图所示，该页面的打印友好版本相比原始版本有了显著改进，至少从打印机的角度来看是这样。所有的表单输入和图像都被删除了。\n\
  \n***\n\n### 注意\n\n如果打印特定页面的字体是无衬线字体（sans serif），一些网页设计师建议将字体改为衬线字体（serif），这在打印时被认为更易读。如果你在页面上使用无衬线字体，则由你决定是否想在打印时保持页面的核心外观——这意味着你不需要将字体改为衬线字体。\n\
  \n***\n\n为了让你更好地掌握在创建打印友好页面时具体需要考虑的因素，以下是一份你至少应该考虑的更改列表：\n\n- 移除页面背景，这实际上为打印后的页面提供了白色背景。\n\
  - 将文本颜色改为黑色；文本中保留一些颜色是可以的，但首选黑色。\n- 确保字体大小足够大，以便页面在打印时容易阅读。你可能需要测试不同的尺寸。\n- 移除链接格式，或简单地恢复基本的下划线链接。有些设计师喜欢保留下划线，以便访问者知道原始页面上存在链接。\n\
  - 移除任何非本质图像。这通常包括任何对传达页面内容至关重要的图像，例如导航按钮、大多数广告和动画图像。\n\n除了这些建议外，你可能会发现添加页面作者信息的署名（byline）以及页面的\
  \ URL 和版权信息是很有用的。当用户离开你的网站且手中只有页面的打印版本时，这些信息可能会丢失。\n\n你可能现在还没有对你的页面进行这些更改。此处的意图是种下“什么是打印友好页面”的种子，以便你能够更好地创建针对打印机的特定样式表。没错：可以创建一个仅在页面被打印时才应用于页面的样式表。你将在下一节中学习到这一点。\n\
  \n### 应用特定媒体的样式表\n\n图 25.1 展示了带有链接的小型打印机图标如何让你查看页面的特殊打印友好版本。这种图标在许多新闻网站上很流行，它是一个重要功能，因为否则你可能不想为了打印一个页面而在伴随文章的图形和广告上浪费纸张和墨水。虽然打印图标和链接的方法非常直观且效果良好，但有一种选项不需要这些特定的链接即可打印友好型内容。\n\
  \n这种选项涉及使用打印特定的样式表，当用户选择打印页面时，该样式表会自动应用于页面。CSS 支持媒体特定样式表的概念，这种样式表针对特定的介质，如屏幕或打印机。然而，CSS\
  \ 并不限于这两种媒体形式。请查看以下列表，CSS 2 允许你使用唯一的样式表支持特定的特定媒体类型：\n\n- `all`——用于所有设备\n- `aural`——用于语音合成器（在\
  \ CSS 1 媒体类型中称为 `speech`）\n- `braille`——用于盲字触觉反馈设备\n- `embossed`——用于页式盲字打印机\n- `handheld`——用于屏幕尺寸和带宽有限的手持设备\n\
  - `print`——用于打印材料和在打印预览模式下在屏幕上查看的文档\n- `projection`——用于投影演示稿\n- `screen`——用于彩色计算机屏幕\n\
  - `tty`——用于使用等距字符网格的设备（如终端、电打字或显示器有限的手持设备）\n- `tv`——用于电视类设备，这类设备通常是低分辨率、彩色且滚动能力有限的\n\
  \n这些媒体中可能有趣的是 `aural` 类型，它允许网页可以被朗读或以其他方式收听。显然，CSS 的架构师在设计主要为计算机屏幕设计的页面时，设想的 Web\
  \ 覆盖范围比我们目前认为的要广泛得多。虽然你现在可能不需要太担心 `aural` 网页的设计，但它对于未来可能出现的趋势是一个很好的提示。\n\n关于应用于其他媒体的样式表，好消息是它们不需要你学习任何新知识。\n\
  \n\n\n根据推荐的打印友好型网页所需的修改建议列表，现在是时候尝试创建一个打印友好型的样式表了。让我们先看一个使用普通（屏幕）样式表显示的的页面（请参见 图\
  \ 25.3）。\n\n**图 25.3** 在普通网络浏览器中查看的 CSS 样式化页面。\n\n![image](img/25fig03.jpg)\n\n\
  * * *\n\n提示\n\n即使你没有链接外部版本，也可以为你的样式表指定媒体类型（media type）。`<style>` 标签使用与 `<link />`\
  \ 标签相同的 `media` 属性。\n\n* * *\n\n此图展示了该页面在普通网络浏览器中的外观。实际上，此页面距离打印就绪状态并不远，但仍然可以从一些改进中获益。\n\
  \n以下更改可以帮助此网页更具有打印友好性：\n\n• 将所有文本颜色改为黑色。\n\n• 移除链接格式（粗体和颜色）。\n\n• 将两个球员信息部分垂直堆叠，因为它们在打印页面上可能无法水平排开。\n\
  \n• 完全移除联系链接。\n\n对普通样式表的的前两个更改是显而易见的；它们主要涉及更改或撤销现有样式。然而，第三个更改需要一些思考。因为你知道打印页面是固定尺寸，所以你应该对打印页面上的所有元素使用绝对定位（absolute\
  \ positioning）。这使得将内容部分精确地放置在你想要的地方变得容易得多。最后，列表中的最后一项非常容易实现，只需将 `contact` 元素的 `display`\
  \ 样式属性设置为 `none` 即可。\n\n* * *\n\n注意\n\n虽然绝对定位对球员示例页面有效，但对于样式化特定的打印页面，这并不总是一个好主意。具体来说，如果你的页面包含超过一个打印页的内容，那么使用相对定位（relative\
  \ positioning）并让内容流到多个页面会更好。\n\n* * *\n\n列表 25.1 显示了 `player_print.css` 样式表的 CSS\
  \ 代码，它将这些更改整合到一个非常适合打印球员页面的样式表中。\n\n列表 25.1 打印特定球员球员样式表的 CSS 代码\n\n* * *\n\n```\n\
  body {\n  font-family:Verdana, Arial;\n  font-size:12pt;\n  color:black;\n}\n\n\
  div {\n  padding:3px;\n}\n\ndiv.title {\n  font-size:18pt;\n  font-weight:bold;\n\
  \  font-variant:small-caps;\n  letter-spacing:2px;\n  position:absolute;\n  left:0in;\n\
  \  top:0in;\n}\n\ndiv.image {\n  position:absolute;\n  left:0in;\n  top:0.5in;\n\
  }\n\ndiv.info {\n  position:absolute;\n  left:1.75in;\n  top:0.5in;\n}\n\ndiv.favorites\
  \ {\n  position:absolute;\n  left:1.75in;\n  top:2in;\n}\n\ndiv.footer {\n  position:absolute;\n\
  \  text-align:left;\n  left:0in;\n  top:9in;\n}\n\ntable.stats {\n  width:100%;\n\
  \  text-align:right;\n  font-size:11pt;\n  position:absolute;\n  left:0in;\n  top:3.75in;\n\
  }\n\ndiv.contact {\n  display:none;\n}\n\n.label {\n  font-weight:bold;\n  font-variant:small-caps;\n\
  }\n\ntr.heading {\n  font-variant:small-caps;\n  background-color:black;\n  color:white;\n\
  }\n\ntr.light {\n  background-color:#EEEEEE;\n}\n\nth.season, td.season {\n  text-align:left;\n\
  }\n\na, a:link, a:visited {\n  color:black;\n  font-weight:normal;\n  text-decoration:none;\n\
  }\n```\n\n* * *\n\n这段代码最整洁的地方可能是它使用英寸（`in`）作为所有绝对定位代码的测量单位。考虑到我们是以英寸而不是像素来考虑打印页面的，这是很有道理的。如果你仔细研究代码，你会发现文本全黑色的，链接中的所有特殊样式格式都已移除，并且内容部分现在是绝对定位的（因此它们会精确地出现在你想要的地方）。\n\
  \n### 在打印预览中查看网页\n\n图 25.4 显示了球员页面在浏览器打印预览窗口中显示的打印友好版本。\n\n**图 25.3** 在普通网络浏览器中查看的\
  \ CSS 样式化页面。\n\n![image](img/25fig03.jpg)\n\n\n\n\n\n1. 不——你仍然需要链接到一个应用了特定样式表的页面，以便其呈现为打印友好格式。\n\
  \n2. `media` 属性假设其默认值为 `all`，这会导致样式表针对所有媒体类型。\n\n3. 在 HTML 的 `<head>` 部分使用以下内容：\n\
  \n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"freestyle.css\" media=\"\
  tv\" />\n```\n\n## 练习\n\n- 为一个包含较多颜色和图片的页面创建一个打印友好的样式表。确保在页面上额外添加一个 `<link />` 标签，用于链接到打印专用样式表。\n\
  - 如果你感到雄心勃勃，可以尝试使用 `<link />` 标签 `media` 属性的 `handheld` 值，为其中一个网页创建一个手持设备特定版本。这个概念与创建打印友好页面相同，区别在于此时你处理的是极其受限的屏幕尺寸，而不是打印页面。你可以通过发布页面并在手机或手持设备浏览器上打开它来测试。\n\
  \n## 第 26 章：处理基于 Web 的表单\n\n在本章中你将学习到：\n\n- HTML 表单的工作原理\n- 如何创建 HTML 表单的前端\n- 如何为表单数据字段命名\n\
  - 如何在表单中包含隐藏数据\n- 如何根据情况选择正确的表单输入控件\n- 如何提交表单数据\n- 使用 JavaScript 使用表单对象\n- 通过电子邮件发送表单结果\n\
  - 使用 JavaScript 验证表单\n\n到目前为止，书中几乎所有内容都侧重于向他人传递信息。但你也可以利用网页从阅读网页的人那里收集信息。\n\nWeb\
  \ 表单允许你从访问网页的用户那里接收反馈、订单或其他信息。如果你曾经用过 Google、Yahoo! 或 Bing 等搜索引擎，那么你对 HTML 表单并不陌生——就是那些带有单个按钮的单字段输入表单，点击按钮后它就会提供你寻找的所有信息，甚至更多。产品订单表也是表单的一种非常流行的用途；如果你在\
  \ Amazon.com 上订过任何东西，或从 eBay 卖家处买过东西，你就使用过表单。在本章中，你将学习如何创建自己的表单，但你只将学习如何创建这些表单的前端。处理表单的后端需要编程语言知识，这超出了本书的范围。然而，在某些情况下，JavaScript\
  \ 可以在表单处理中发挥作用，例如基础的表单内容交付和验证。\n\n### HTML 表单如何工作\n\nHTML 表单是网页的一部分，包含用户可以在其中输入信息的区域，这些信息会被发送给你、发送到你指定的电子邮件地址、发送到你管理的数据库，或发送到另一个系统（例如用于你表单的第三方管理系统\
  \ Salesforce.com）。\n\n在学习用于创建自己表单的 HTML 标签之前，你至少应该在概念上理解这些表单信息是如何返回给你的。实际的后台（服务器端或后端）过程需要至少一种编程语言的知识，或者至少在在使用他人的服务器端脚本处理表单输入时具备遵循特定指令的能力。在处理过程的那个阶段，你应该与具有技术知识的人合作，或者自己学习基础知识。简单的表单处理一点都不困难，你的\
  \ Web 托管提供商可能有几个后端脚本，你只需进行少量自定义即可使用。\n\n> **注意**\n> PHP 是最流行的服务器端编程语言；任何合格的 Web\
  \ 托管提供商都支持它。你可以在 http://www.php.net/ 了解更多关于 PHP 的信息，或者直接开始从 PHP、MySQL 和 Apache All\
  \ in One（ISBN: 067232976X）从零开始学习这种编程语言（加上数据库交互）。虽然还有其他几关于 PHP 及相关技术的书，但我偏爱这一本，因为书是我写的。它是针对\
  \ PHP 或任何其他编程语言绝对初学者的。\n\n表单包含一个供用户提交表单的按钮；该按钮可以是你自己创建的图像，也可以是创建表单 `<input>` 标签并赋予\
  \ `type` 值为 `submit` 时创建的标准 HTML 表单按钮。当有人点击表单提交按钮时，表单中输入的所有信息都会发送到你在 `<form>` 标签的\
  \ `action` 属性中指定的 URL。该 URL 应该指向特定的脚本，该脚本将处理你的表单，通过电子邮件发送表单内容，或在交互过程中执行另一个步骤（例如从搜索引擎请求结果或将项目放入在线购物车）。\n\
  \n当你开始考虑对表单内容进行比仅仅将结果通过电子邮件发送给自己更多的操作时，就需要额外的技术知识。例如，如果你想创建一个接受信用卡并处理交易的在线商店，有一些成熟的实践方法，这些都是为了确保客户数据的安全。这不是一项你想要轻率尝试的操作；你需要比本书提供的更多的知识。\n\
  \n> **注意**\n> 有一种无需服务器端脚本即可发送表单数据的方法，你将在本章稍后的部分学习这种方法——它在 `<form>` 的 `action` 属性中使用\
  \ `mailto` 链接。但在你尝试时，请注意它可能会产生不一致的结果；单个网页浏览器以及个人安全设置都可能导致该操作的响应与你的预期不同。\n\n在将表单放到网上之前，你应该查看你的\
  \ Web 托管提供商的用户指南，看看他们提供哪些表单处理脚本。你可能会发现现成的 Perl 或 PHP 脚本，只需少量配置即可使用。\n\n### 创建表单\n\
  \n每个表单都必须以 `<form>` 标签开始，它可以位于 HTML 文档主体的任何位置。`<form>` 标签通常有三个属性：`name`、`method`\
  \ 和 `action`：\n\n```\n<form name=\"form1\" method=\"post\" action=\"/myprocessingscript.php\"\
  >\n```\n\n常用的 `method` 是 `post`，它将表单输入结果作为文档发送。在某些情况下，你可能需要使用 `method=\"get\"`，它会将结果作为\
  \ URL 头部的一部分提交。例如，当从 Web 表单向搜索引擎提交查询时，有时会使用 `get`。因为你还不是表单专家，除非你的 Web 托管提供商的文档另有说明，否则直接使用\
  \ `post`。\n\n`action` 属性指定了发送表单数据的地址。在这里有两个选择：\n\n- 你可以输入 服务器上表单处理程序或脚本的位置，表单数据将发送到该程序。\n\
  - 你可以输入 `mailto:` 后接电子邮件地址，每当有人填写表单时，表单数据将直接发送给你。然而，这种方法完全取决于用户的计算机是否正确配置了电子邮件客户端。没有电子邮件客户端的公共计算机访问你网站的用户将被排除在外。\n\
  \n```\n<form method=\"post\" action=\"mailto:me@mysite.com\">\n```\n\n HTML 页面中的每个表单在\
  \ JavaScript 中都由一个 `form` 对象表示，该对象的名称与定义它的 `<form>` 标签中的 `name` 属性相同。\n\n或者，你可以使用\
  \ `forms` 数组来引用表单。该数组包含每个表单元素的一个项，从 0 开始索引。例如，如果文档中的第一个表单名称为 `form1`，你可以通过以下两种方式之一引用它：\n\
  \n```\ndocument.form1\n\ndocument.forms[0]\n```\n\n\n\n\n除了元素之外，每个 `form` 对象还拥有一个属性列表，其中大多数属性由相应的\
  \ `<form>` 标签定义。你也可以在 JavaScript 中设置这些属性。它们包括：\n\n- `action` 是表单的 `action` 属性，或者说是表单数据提交到的程序。\n\
  - `encoding` 是表单的 `MIME` 类型，通过 `enctype` 属性指定。在大多数情况下，这是需要的（除非你使用表单上传文件）。\n- `length`\
  \ 是表单中元素的数量。你无法更改此属性。\n- `method` 是用于提交表单的方法，可以是 `GET` 或 `POST`。这决定了用于将表单结果发送到 CGI\
  \ 脚本的数据格式，且不影响 JavaScript。\n- `target` 指定显示表单结果（来自 CGI 脚本）的窗口。通常情况下，这会在主窗口中进行并替换表单本身，但可以使用此属性来操作弹出窗口或帧。\n\
  \n在列表 26.1 中创建的表单以及在图 26.1 中显示的表单包含了目前 HTML 表单上使用的几乎所有类型的用户输入组件。在阅读后续对每种类型输入元素的说明时，请参考此列表和图。\n\
  \n**图 26.1** 列表 26.1 中显示的代码使用了几乎所有类型的 HTML 表单输入元素。\n\n![image](img/26fig01.jpg)\n\
  \n列表 26.1 带有各种用户输入组件的表单\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
