  \    <h2>A Comprehensive Guide to the<br />Art and Science of Chaos and Complexity</h2>\n\
  \    <p>What's that? You say you're hearing about \"fractals\" and \"chaos\" all\
  \ over the place, but still aren't too sure what they are? How about a quick summary\
  \ of some key concepts:</p>\n  </div>\n</body>\n</html>\n```\n\n\n\n\n\n1. 当一个过程被反复“迭代”，并使用每一步的结果作为下一步的起点时，即使是最简单的系统也会变得极其复杂且美轮斑斓。大自然正是这样从一个指甲盖大小的种子，创造出一棵高\
  \ 300 英尺、细节壮丽的红杉树。\n2. 大多数“迭代系统”很容易在计算机上进行模拟，但只有少数是可以预测和可控的。为什么呢？因为一个微小的影响，比如“蝴蝶扇动翅膀”，可能会被奇异地放大，产生重大后果，例如完全改变世界上遥远地区明天的天气。\n\
  3. 分形可以无限放大而不丢失细节，因此依赖于直线的数学对它们是没用的。然而，它们为我们提供了一个名为“分形维度”的新概念，可以衡量从海岸线到云层任何对象的纹理和复杂性。\n\
  4. 虽然分形在图形展上屡奖，但它们的混沌模式出现在科学的各个分支中。物理学家发现绘图仪上产生了精美的艺术品。具有分形湍流的“奇异吸引子”出现在天体力学中。当分形节律失去同步时，生物学家会诊断出“动力学疾病”。甚至纯数学家也会带着他们令人惊目的研究视频进行巡演。\n\
  \n你觉得这些人可能发现了一些什么吗？\n\n![了解更多](img/findout.gif)\n\n* * *\n\n现在将列表 28.1 中的页面与列表 28.2\
  \ 中页面的更改进行对比。这两个页面看起来几乎一样，但对于搜索机器人和搜索引擎来说，这两个页面看起来完全不同。以下列表总结了页面中的更改以及这些更改如何影响索引：\n\
  \n- 在 `<title>` 标签和页面第一个标题中添加了重要的搜索关键词。原始页面在这两个关键位置甚至没有包含 `fractal` 这个词。\n- 添加了\
  \ `<meta />` 标签以帮助搜索引擎描述和关键词。\n- 为第一个 `<img />` 标签添加了非常有描述性的 `alt` 属性。并不是所有的搜索引擎都会读取并索引\
  \ `alt` 文本，但有些会。\n- 删除了技术术语（如 `\"fractal\"` 和 `\"iterated\"`）周围的引号，因为某些搜索引擎认为 `“fractal”`\
  \ 与 `fractal` 是不同的词。引号被替换为字符实体 `&quot;`，搜索机器人会忽略它。这也是一个好主意，因为 XHTML 本就敦促 Web 开发人员使用\
  \ `&quot;` 实体而不是引号。\n- 在订单框的文本中添加了两次关键词 `fractal`。\n\n无法量化搜索分形和混沌信息的用户，找到列表 28.2\
  \ 所示页面的频率比找到列表 28.1 所示页面高出多少，但可以肯定的是，这些更改只会提高页面在搜索引擎中的可见性。正如通常情况一样，为了搜索蜘蛛而做的改进可能也让人类更容易识别和理解页面主题。这让为搜索引擎优化页面成为了一项双赢的努力！\n\
  \n列表 28.2 对列表 28.1 页面的改进\n\n* * *\n\n```xml<?xml version=\"1.0\" encoding=\"UTF-8\"\
