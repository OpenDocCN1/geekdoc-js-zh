  >Fish</span>\n        <ul>\n          <li>Barramundi</li>\n          <li>Kissing\
  \ Gourami</li>\n          <li>Mummichog</li>\n        </ul>\n      </li>\n     \
  \ <li><span style=\"font-weight:bold\">Amphibians</span>\n        <ul>\n       \
  \   <li>Anura\n            <ul>\n              <li>Goliath Frog</li>\n         \
  \     <li>Poison Dart Frog</li>\n              <li>Purple Frog</li>\n          \
  \  </ul>\n          </li>\n          <li>Caudata\n            <ul>\n           \
  \   <li>Hellbender</li>\n              <li>Mudpuppy</li>\n            </ul>\n  \
  \        </li>\n        </ul>\n      </li>\n      <li><span style=\"font-weight:bold\"\
  >Reptiles</span>\n        <ul>\n          <li>Nile Crocodile</li>\n          <li>King\
  \ Cobra</li>\n          <li>Common Snapping Turtle</li>\n        </ul>\n      </li>\n\
  \    </ul>\n  </body>\n</html>\n```\n\n***\n\n如图 5.6 所示，网页浏览器通常会使用实心圆点作为第一级符号，空心圆作为第二级符号，实心正方形作为所有更深级的符号。然而，你可以通过使用\
  \ `<ul style=\"list-style-type:disc\">`、`<ul style=\"list-style-type:circle\">`\
  \ 或 `<ul style=\"list-style-type:square\">` 代替 `<ul>`，来显式地选择任何层级使用的符号类型。\n\n你甚至可以在\
  \ `<li>` 标签中使用 `list-style-type` 样式规则来更改无序列表中任何单点的符号。例如，以下代码在 `extra` 和 `super`\
  \ 单词前显示一个空心圆：\n\n```html\n<ul style=\"list-style-type:circle\">\n  <li>extra</li>\n\
  \  <li>super</li>\n  <li style=\"list-style-type:square\">special</li>\n</ul>\n\
  ```\n\n`list-style-type` 样式规则也适用于有序列表，但它不是选择符号类型，而是选择放在项目前的数字或字母。列表 5.7 展示了如何使用罗马数字\
  \ (`list-style-type:roman`)、大写字母 (`list-style-type:upper-alpha`)、小写字母 (`list-style-type:lower-alpha`)\
  \ 以及多级列表中的数字。图 5.7 展示了格式良好的大纲。\n\n**图 5.7** 格式良好的大纲可以让任何计划看起来更靠谱。\n\n![image](img/05fig06.jpg)\n\
  \n虽然列表 5.7 仅对 `<ol>` 标签使用了 `list-style-type`，但你也可以将其用于列表中的 `<li>` 标签（尽管很难想象你会这样做）。你还可以显式地指定数字\
  \ `list-style-type:decimal`，并可以使用小写罗马数字 `list-style-type:lower-roman`。\n\n列表 5.7\
