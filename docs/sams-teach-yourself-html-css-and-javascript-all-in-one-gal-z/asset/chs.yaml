  \ </li>\n- <li>在球场上\n    <ol>\n      <li><li>先发球，然后患上严重的花粉过敏症</li>\n      <li><li>开着高尔夫球车压过对手的球以破坏其空气动力学</li>\n\
  \      <li><li>在球接触到对手之前大喊“fore（小心）”</li>\n      <li><li>推杆时始终填回草皮</li>\n      <li><li>水库洞是纠正任何球位放置错误的好时机</li>\n\
  \    </ol>\n  </li>\n\n* * *\n\n## 总结\n\n## 总结\n\n在本章中，你学习了如何让文本显示为**粗体**或*斜体*，以及如何编写上标、下标、特殊符号和带重音符号的字母的代码。你了解了如何在等宽字体的预格式段落中使文本正确对齐，以及如何控制网页上任何文本部分的大小、颜色和字体。你还学习了属性如何用于指定许多\
  \ HTML 标签的选项和特殊行为，以及如何使用 `style` 属性配合 CSS 样式规则来对齐文本。你还发现了如何创建和组合三种基本的 HTML 列表：有序列表、无序列表和定义列表。列表可以放置在其他列表中，以创建大纲和其他文本的复杂布局。\n\
  \n表 5.2 总结了本章讨论的标签和属性。顺便说，不要觉得必须记住所有的标签！\n\n表 5.2 第 5 章 涵盖的 HTML 标签和属性\n\n![image](img/05tab02.jpg)![image](img/05tab02a.jpg)\n\
  \n## 问答\n\n**Q. 如何找到我电脑上字体的准确名称？**\n\n**A.** 在 Windows 或 Macintosh 电脑上，打开控制面板并点击字体文件夹——你系统中的字体会列在其中。（Vista\
  \ 用户可能需要在控制面板中切换到“经典视图”）。在 `font-family` 样式规则中指定字体时，请使用字体名称的准确拼写。然而，字体名称是不区分大小写的。\n\
  \n**Q. 如何在我的页面上放置汉字、阿拉伯语、中文或其他非欧洲字符？**\n\n**A.** 首先，需要在你的页面上阅读这些字符的用户必须安装适当的语言字体。他们还必须为网页浏览器选择该语言字符集及其关联字体。你可以使用\
  \ Windows 中的“字符表”程序（或其他操作系统中的类似程序）来获取任何语言字体中每个字符的数字代码。要找到字符表，点击“开始”，“所有程序”。*（注：原文此处存在大量重复段落，翻译已根据要求进行精简并保留核心逻辑）*\n\
  \n\n\n\n表格由若干行信息组成，每行内部包含单元格。要创建表格，你必须从 `<table>` 标签开始。当然，你也要用 `</table>` 标签来结束表格。如果你希望表格带有边框，可以使用\
  \ `border` 属性来指定边框的宽度（像素）。边框大小设置为 `0` 或 `none`（或完全省略 `border` 属性）将使边框不可见，如果你发现自己在将表格作为页面布局工具使用（不建议这样做），这非常有用。\n\
  \n## 提示\n在阅读本章时，请思考将文本排列成表格可以如何为你的网页内容带来收益。以下是一些需要记住的思路：\n\n- 表格最显而易见的应用是组织表格信息，例如名称和数字的多列列表。\n\
  - 每当你需要显示多列文本或图像时，表格都是答案。\n\n在放置好 `<table>` 标签后，接下来你需要的是 `<tr>` 标签。`<tr>` 标签创建一个表格行，在闭合标签\
  \ `</tr>` 之前它包含一个或多个信息单元格。要创建这些独立的单元格，请使用 `<td>` 标签（`<td>` 代表表格数据 table data）。将表格信息放在\
  \ `<td>` 和 `</td>` 标签之间。单元格（cell）是一个矩形区域，可以包含任何文本、图像和 HTML 标签。表格中的每一行至少包含一个单元格。同一行内的多个单元格构成了表格中的列。\n\
  \n构建表格还涉及另一个基础标签。`<th>` 标签的作用与 `<td>` 标签完全相同，不同之处 `<th>` 表示该单元格是表格表头的一部分。大多数网络浏览器会将\
  \ `<th>` 单元格中的文本渲染为居中并加粗。\n\n## 提示\n某些样式属性允许你对表格边框进行更强大的控制。例如，你可以设置边框宽度（`border-width`）、样式（`border-style`）和颜色（`border-color`）。这些属性运行良好，但你必须将它们应用于每个表格元素，即使你为表格行或表格单元格元素使用了类，这也可能很繁琐。\n\
  \n你可以创建任意数量的单元格，但表格中的每行的列数应该与其他行保持相同。代码列表 6.1 中所示的 HTML 代码仅使用我目前为止提到的四个表格标签创建了一个简单的表格。图\
  \ 6.1 显示了在浏览器浏览器中生成的页面。\n\n**图 6.1** 代码列表 6.1 中的 HTML 代码创建了一个六行四列的表格。\n\n![image](img/06fig01.jpg)\n\
  \n代码列表 6.1 使用 `<table>`、`<tr>`、`<td>` 和 `<th>` 标签创建表格\n\n```html\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Baseball Standings</title>\n  </head>\n\
  \  <body>\n    <h1>Baseball Standings</h1>\n    <table>\n      <tr>\n        <th>Team</th>\n\
  \        <th>W</th>\n        <th>L</th>\n        <th>GB</th>\n      </tr>\n    \
  \  <tr>\n        <td>Los Angeles Dodgers</td>\n        <td>62</td>\n        <td>38</td>\n\
  \        <td>—</td>\n      </tr>\n      <tr>\n        <td>San Francisco Giants</td>\n\
  \        <td>54</td>\n        <td>46</td>\n        <td>—</td>\n      </tr>\n   \
  \   <tr>\n        <td>Colorado Rockies</td>\n        <td>54</td>\n        <td>46</td>\n\
  \        <td>—</td>\n      </tr>\n      <tr>\n        <td>Arizona Diamondbacks</td>\n\
  \        <td>43</td>\n        <td>58</td>\n        <td>—</td>\n      </tr>\n   \
  \   <tr>\n        <td>San Diego Padres</td>\n        <td>39</td>\n        <td>23</td>\n\
  \        <td>—</td>\n      </tr>\n    </table>\n  </body>\n</html>\n```\n（注：由于提供的原文文本后半部分存在大量重复的乱码式字符，译文已根据逻辑处理了前后的核心说明部分，并剔除了无意义的重复内容。）\n\
  \n\n\n\n```html\n<<table>\n  <tr>\n    <th style=\"width:25px;\">W</th>\n    <th\
  \ style=\"width:25px;\">L</th>\n    <th style=\"width:25px;\">GB</th>\n  </tr>\n\
  \  <tr>\n    <td><img src=\"losangeles.gif\" alt=\"Los Angeles Dodgers\" /></</td>>\n\
  \    <td>Los Angeles Dodgers</td>\n    <td>62</td>\n    <td>38</td>\n    <td>—</td>\n\
  \  </tr>\n  <tr>\n    <td><img src=\"sanfrancisco.gif\" alt=\"San Francisco Giants\"\
  \ /></</td>>\n    <td>San Francisco Giants</td>\n    <td>54</td>\n    <td>46</td>\n\
  \    <td>8.0</td>\n  </tr>\n  <tr>\n    <td><img src=\"colorado.gif\" alt=\"Colorado\
  \ Rockies\" /></</td>>\n    <td>Colorado Rockies</td>\n    <td>54</td>\n    <td>46</td>\n\
  \    <td>8.0</td>\n  </tr>\n  <tr>\n    <td><img src=\"arizona.gif\" alt=\"Arizona\
  \ Diamondbacks\" /></</td>>\n    <td>Arizona Diamondbacks</td>\n    <td>43</td>\n\
  \    <td>58</td>\n    <td>19.5</td>\n  </tr>\n  <tr>\n    <td><img src=\"sandiego.gif\"\
  \ alt=\"San Diego Padres\" /></</td>>\n    <td>San Diego Padres</td>\n    <td>39</td>\n\
  \    <td>62</td>\n    <td>23.5</td>\n  </tr>\n</table>\n```\n\n你可以在图 6.2 中看到一致的列宽。\n\
  \n**图 6.2** 示例 6.2 中的 HTML 代码创建了一个具有六行五列的表格，并为每列使用了特定的宽度。\n\n![image](img/06fig02.jpg)\n\
  \n示例 6.1 中的代码与示例 6.2 中使用的代码之间有处不同。首先，在示例 6.2 中增加了一个列；该列没有标题，但第一行中仍然存在 `<th></th>`\
  \ 标签对。在第二行到第六行中，这个额外的列包含一个图像（`<img />` 标签）。示例 6.2 的第二个区别是为第一行中的每个 `<th>` 元素添加了特定的宽度样式。第一列定义为\
  \ 35px，第二列为 75px，第三、第四和第五列各均为 25px。\n\n另外请注意，这些宽度在随后的行的 `<td>` 元素中并没有重复。从技术上讲，你只需要在第一行中定义宽度；其余行将遵循这些设置，因为它们都是同一个表格的一部分。然而，如果你使用了其他样式（例如更改字体大小或颜色的样式），则该样式必须在每个应该具有这些属性的元素中重复。\n\
  \n### 表格内部的对齐\n\n默认情况下，你放置在表格单元格内的任何内容都会向左对齐并垂直居中。图 6.1 和 6.2 显示了这种默认对齐方式。然而，你可以通过\
  \ `text-align` 和 `vertical-align` 属性对表格单元格的内容进行水平和垂直对齐。\n\n你可以将这些属性应用于任何 `<tr>`、`<td>`\
  \ 或 `<th>` 标签。分配给 `<tr>` 标签的对齐适用于该行中的所有单元格。根据表格的大小，通过在 `<tr>` 级别应用这些属性而不是在每个 `<td>`\
  \ 或 `<th>` 标签中应用，你可以节省大量的精力。\n\n示例 6.3 中的 HTML 代码使用了组合对齐样式来为某行应用默认对齐，但在少数单独单元格中这些设置被覆盖。图\
  \ 6.3 显示了示例 6.3 中代码的结果。\n\n**图 6.3** 示例 6.3 中的代码展示了 `colspan` 属性和对齐样式的使用。\n\n![image](img/06fig03.jpg)\n\
  \n以下是一些较常用的 `vertical-align` 样式值：`top`、`middle`、`bottom`、`text-top`、`text-bottom`\
  \ 和 `baseline`（用于文本）。这些属性值在对齐表格数据时提供了足够的灵活性。\n\n### 示例 6.3 表格中的对齐、间距、边界和背景颜色\n\n\
  ```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML1.1//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>恐惧的事物</title>\n\
  </head>\n<body>\n  <h1>恐惧的事物</h1>\n  <table border=\"2\" cellpadding=\"4\" cellspacing=\"\
  2\" width=\"100%\">\n    <tr style=\"background-color:red;color:white\">\n     \
  \ <th colspan=\"2\">描述</th>\n      <th>尺寸</th>\n      <th>重量</th>\n      <th>速度</th>\n\
  \    </tr>\n    <tr style=\"vertical-align:top\">\n      <td><img src=\"handgun.gif\"\
  \ alt=\".38 Special\" /></td>\n      <td style=\"font-size: 14px;font-weight:bold;\
  \ vertical-align:middle;text-align:center\">.38 特弹</td>\n      <td>五英寸管。</td>\n\
  \      <td>二十盎司。</td>\n      <td>四秒六发。</td>\n    </tr>\n    <tr style=\"vertical-align:top\"\
  >\n      <td><img src=\"rhino.gif\" alt=\"Rhinoceros\" /></td>\n      <td style=\"\
  font-size: 14px;font-weight:bold; vertical-align:middle;text-align:center\">犀牛</td>\n\
  \      <td>十二英尺。</td>\n      <td>两吨。</td>\n      <td>每小时三十五英里。</td>\n    </tr>\n\
  \  </table>\n</body>\n</html>\n```\n\n***\n\n*跨越*是指强制一个单元格跨越多个行或列的过程。`colspan` 属性使单元格跨越多个列；`rowspan`\
  \ 属性对行具有相同的效果。\n\n此外，在描述列的第二个单元格中使用了文本样式，创建了既垂直居中对齐又水平居中对齐的粗体文本。\n\n***\n\n> [!TIP]\n\
  > 在脑中保持行列结构清晰是创建跨行列单元格表格时最困难的部分。极其微小的错误往往会让整个结构陷入混乱。在开始编写 HTML 实现它们之前，先在纸上勾画你的表格，将为你节省时间并避免沮丧。\n\
  \n\n\n\n\n你经常会在表格中看到交替的行颜色。例如，其中一行可能是灰色背景，而另一行可能是白色背景。交替行颜色有助于用户更清晰地阅读你的表格内容，特别是当表格很大时。\n\
  \n* * *\n\n与 `background-color` 样式属性相似的是 `background-image` 属性（在本例中未显示），它用于设置表格背景图像。如果你想将图像\
  \ `leaves.gif` 设置为表格的背景，可以使用 `<table style=\"background-image:url(leaves.gif)\"\
  >`。注意，图像文件被放在括号内，并在前面带有 `url` 单词，这表示你正在描述图像文件的位置。\n\n* * *\n\n### 注意\n\n尽管在 XHTML\
  \ 中仍然允许 `cellpadding` 和 `cellspacing` 属性，但 CSS 中存在它们的等效形式，即 `padding` 和 `border-spacing`\
  \ 样式属性。\n\n* * *\n\n调整表格不仅仅是使用样式属性。如列表 6.3 所示，你可以使用 `cellpadding` 和 `cellspacing`\
  \ 属性控制表格边界周围的空间。`cellspacing` 属性设置表格边界之间以及单元格之间的空间（以像素为单位）。`cellpadding` 属性设置单元格内信息边缘的空间，同样以像素为单位。将\
  \ `cellpadding` 值设为 `0` 会导致表格中的所有信息尽可能紧贴表格边界对齐，甚至触碰边界。`cellpadding` 和 `cellspacing`\
  \ 属性可以让你对表格的外观进行良好的整体控制。\n\n### 使用表格进行页面布局\n\n在本章的开始，我提到设计师们一直使用表格进行页面布局和显示表格化信息。如果你偷看其他设计师的源代码，仍然会发现许多基于表格的布局示例。这种设计方法源于旧（20\
  \ 世纪 90 年代中期到 2000 年代初）浏览器对 CSS 支持的不一致。当时所有浏览器都支持表格，且方式基本相同，因此 Web 设计师们紧抓住基于表格的内容创建方法，以便在所有浏览器中实现相同的视觉页面显示。然而，现在所有主要浏览器对\
  \ CSS 的支持已相对相似，设计师可以遵循长期以来基于标准的建议，*不要*使用表格进行页面布局。\n\n万维网联盟（W3C）是负责 Web 未来的标准机构，它推广样式表作为布局页面的正确方式（而不是使用表格）。样式表最终比表格强大得多，这就是为什么此书的大部分内容教你如何使用样式表进行页面布局。\n\
  \n避免使用表格进行布局的主要原因包括：\n\n- **演示效果与内容混合**——CSS 和符合标准的 Web 设计的设计目标之一是将演示层与内容层分离。\n\
  - **导致不必要的、复杂的重新设计**——要更改基于表格的布局，你必须更改网站上每一个页面的表格布局（除非它是复杂的、动态驱动网站的一部分，在这种情况下，你必须撤销所有动态部分并重新制作）。\n\
  - **可访问性问题**——屏幕阅读器会查找表格中的内容，并经常尝试将你的布局表格读作内容表格。\n- **在移动设备上渲染**——表格布局通常不够灵活，无法缩小到小屏幕（参见第\
  \ 12 章，“创建固定或流式布局”）。\n\n这些只是基于表格的 Web 设计中的问题之一。要更深入地了解其中一些问题，请查看热门演示“为什么用表格布局是愚蠢的”，地址为\
  \ [`www.hotdesign.com/seybold/everything.html`](http://www.hotdesign.com/seybold/everything.html)。\n\
  \n## 总结\n\n在本短章节中，你学习了将文本和图像排列成有组织的行和列，称为表格。你学习了创建表格的三个基本标签，以及许多控制表格对齐、间距和外观的可选属性和样式。你还发现表格可以结合使用并嵌套，以获得更多样化的布局选项。\n\
  \n表格 6.1 总结了本章涵盖的标签和属性。\n\n第 6 章 涵盖的 HTML 标签和属性\n\n![image](img/06tab01.jpg)![image](img/06tab01a.jpg)\n\
  \n## 问答\n\n**问. 我做了一个大表格，加载页面时，页面上长时间什么都没有出现。为什么要等呢？**\n\n**答.** 复杂的表格可能需要一段时间出现在屏幕上。Web\
  \ 浏览器在显示表格的任何部分之前，必须计算表格中所有内容的大小。你可以通过始终为表格内的每个图形图像包含 `width` 和 `height` 属性来加快速度。在\
  \ `<table>` 和 `<td>` 标签中使用 `width` 属性也有帮助。\n\n**问. 我可以在表格内嵌套表格吗？**\n\n**答.** 可以，你可以将表格嵌套在其他表格单元格中。然而，嵌套表格——尤其是大型表格需要时间正确加载和渲染。在创建嵌套表格之前，考虑你放在页面上的内容，并问自己是否可以使用\
  \ CSS 显示。你可能在读完这本书之前不知道所有的答案，但这里有一个提示：在大多数情况下，答案是肯定的。\n\n## 工作坊\n\n工作坊包含测验和练习，帮助你巩固材料。在查看后面的答案\
  \ 部分之前，尝试回答所有问题。\n\n## 测验\n\n**1.** 你如何创建一个带有标准框的简单两行两列表格？\n\n**2.** 在第 1 的基础上，你如何在表格和单元格之间添加\
  \ 30 像素的空间？\n\n**3.** 继续你在第 1 和第 2 步中构建的表格，如何让左上角单元格变为绿色，右上单元格变为红色，左下单元格变为黄色，右下单元格变为蓝色？\n\
  \n## 答案\n\n**1.** 使用以下 HTML：\n\n```\n<table border=\"1\">\n  <tr>\n    <td>左上角...</td>\n\
  \    <td>右上角...</td>\n  </tr>\n  <tr>\n    <td>左下角...</td>\n    <td>右下角...</td>\n\
  \  </tr>\n</table>\n```\n\n**2.** 在 `<table>` 标签中添加 `cellspacing=\"30\"`。\n\n**3.**\
  \ 在左上角的 `<td>` 中添加 `style=\"background-color:green\"`，在右上角的 `<td>` 中添加 `style=\"\
  background-color:red\"`，在左下角的 `<td>` 中添加 `style=\"background-color:yellow\"`，在右下角的\
  \ `<td>` 中添加 `style=\"background-color:blue\"`。\n\n### 练习题\n\n- 你是否有任何页面包含访问者可能感兴趣以列表或表格形式查看的信息？使用表格展示某些信息。确保每列都有自己的标题（也许有自己的图形）。\n\
  - 你经常会在表格中看到交替的行颜色，其中一行是灰色背景，另一行是白色背景。表格行交替颜色的目的是为了在快速查看充满数据的表格时，更容易区分单行。创建一个具有交替行颜色和文本颜色的表格（如有必要）。虽然关于颜色的课程在第\
  \ 8 章，但你已经在本节中拥有了足够的信息来尝试这一过程。\n\n\n\n\n到目前为止，你已经学习了如何使用 HTML 标签来创建基础网页。然而，此时，这些内容只是孤立的岛屿，与任何其他内容都没有连接（尽管在第\
  \ 3 章“理解层叠样式表(#ch03.html_ch03)”中，我在示例中偷偷加入了一些页面链接）。要将你的工作转化为真正的网页内容，你需要将其与 Web 其他部分连接起来——至少连接到你个人或公司网站内的其他页面。\n\
  \n本章将向你展示如何创建文档内部内容的超链接，以及如何链接到其他外部文档。此外，你将学习如何为超链接设置样式，使其以你所需的颜色和装饰显示——而不一定是默认的蓝色下划线显示。\n\
  \n### 使用网络地址\n\n存储个人网站网页内容最简单的方法是将所有文件放在同一个文件夹中。当文件这样存储在一起时，你只需要在 `<a>` 标签的 `href`\
  \ 属性中提供文件名即可链接到它们。\n\n* * *\n\n注意\n\n**在我们开始之前，你可能想复习一下在服务器上放置文件以及如何在一组目录中管理文件的基础知识。在创建网页内容链接时，了解这些信息非常重要。请参考第\
  \ 1 章“发布网页内容(#ch01.html_ch01)”，特别是标题为“理解在 Web 服务器上放置文件的位置(#ch01.html_ch01sec1lev8)”的章节。\n\
  \n* * *\n\n*属性*是与标签相关的一段额外信息，提供了有关标签的更多详细信息。例如，<a>` 标签的 `href` 属性标识了你正在链接的页面地址。\n\
  \n当你拥有多个页面，或者当你开始对网站中的内容建立组织结构时，你应该将文件放入目录（或者说*文件夹*）中，其名称应反映其内部的内容。例如，你所有的图片都可以放在“images”目录中，公司信息可以放在“about”目录中，依此类推。无论你如何在自己的\
  \ Web 服务器上组织文档，你都可以使用相对地址，这种地址仅包含从一个页面找到另一个页面所需的信息。\n\n* * *\n\n**注意**\n\nHTML 中始终使用\
  \ `/` 正斜杠来分隔目录。不要使用 `\\` 反斜线（通常在 Windows 中使用）来分隔你的目录。记住，Web 世界中的一切都是前进的，所以使用正斜杠。\n\
  \n* * *\n\n*相对地址*描述了从一个网页到另一个网页的路径，而不是完整的（或*绝对*）互联网地址。\n\n如果你还记得第 1 章，你 Web 服务器的文档根目录被指定为网页内容的顶层目录。在网络地址中，该文档根由正斜杠\
  \ (`/`) 表示。所有后续层次的目录由相同类型的正斜杠分隔。例如：\n\n`/directory/subdirectory/subsubdirectory/`\n\
  \n假设你在文档根目录下创建一个名为 `zoo.html` 的页面，并想在 `elephants` 子目录中包含指向名为 `african.html` 和 `asian.html`\
  \ 页面的链接。链接看起来如下：\n\n```html\n<a href=\"/elephants/african.html\">了解非洲象。</a>\n<a\
  \ href=\"/elephants/asian.html\">了解亚洲象。</a>\n```\n\n这些特定地址实际上被称为*根目录相对地址*，因为它们是缺少整个域名的相对地址，但它们专门地相对于正斜杠所指定的文档根。\n\
  \n使用普通的相对地址，你可以跳过初始的正斜杠。这种类型的地址允许链接相对于它们所在的任何目录变得相对——它可能是文档根，也可以是从文档根向下一个或多个级的另一个目录：\n\
  \n```html\n<a href=\"elephants/african.html\">了解非洲象。</a>\n<a href=\"elephants/asian.html\"\
  >了解亚洲象。</a>\n```\n\n你位于 `elephants` 子目录中的 `african.html` 和 `asian.html` 文档可以通过这两种方式任何一种链接回主\
  \ `zoo.html` 页面：\n\n```html\n<a href=\"http://www.yourdomain.com/zoo.html\">返回动物园。</a>\n\
  <a href=\"/zoo.html\">返回动物园。</a>\n<a href=\"../zoo.html\">返回动物园。</a>\n```\n\n第一个链接是绝对链接。对于绝对链接，*绝对*没有疑问链接应该去向哪里，因为提供了完整的\
  \ URL——包括域名。\n\n第二个链接是根目录相对链接。它相对于你当前正在浏览的域名，因此不需要协议类型（例如 `http://`）和域名（例如 [www.yourdomain.com](http://www.yourdomain.com)），但提供了初始的正斜杠以显示地址从文档根开始。\n\
  \n* * *\n\n**提示**\n\n关于相对地址（`elephants/african.html`）与绝对地址（[`www.takeme2thezoo.com/elephants/african.html`](http://www.takeme2thezoo.com/elephants/african.html)）的通用规则是，当你链接存储在一起的文件（例如所有属于同一个网站的文件）时，你应该使用相对地址。当你链接到其他地方的文件时——另一台计算机、另一个磁盘驱动器——应该使用绝对地址。\n\
  \n* * *\n\n\n\n\n### 使用锚点识别页面中的位置\n\n`<a>` 标签可以用于将页面上的某处标记为锚点，使你能够指向该精确位置的链接。列表\
  \ 7.1 将在本章的稍后部分给出，它展示了一个指向页面内锚点的链接。为了查看如何制作此类链接，让我们先看一眼列表中的第一个 `<a>` 标签：\n\n```html\n\
  <a id=\"top\"></a>\n```\n\n`<a>` 标签通常使用 `href` 属性来指定超链接目标。`<a href>` 是你点击的地方，而 `<a\
  \ id>` 是你点击后去到的地方。在这个示例中，`<a>` 标签仍然指定了一个目标，但没有创建实际的链接。相反，`<a>` 标签为页面上标签出现的特定点命名命名。必须包含\
  \ `</a>` 标签，并且必须为 `id` 属性分配一个唯一的名称，但 `<a>` 和 `</a>` 之间不需要任何文本。\n\n> **注意**\n> 旧版本的\
  \ HTML 使用 `name` 而不是 `id`。较新版本的 HTML 和 XHTML 已经废弃了 `name` 属性，改为使用 `id`。\n\n### 链接到锚点位置\n\
  \n列表 7.1 展示了一个在单个页面中放置了各种锚点的站点。查看 列表 7.1 中的最后一个 `<a>` 标签以查看示例：\n\n```html\n<a href=\"\
  #top\">返回索引。</a>\n```\n\n`#` 符号意味着单词 `top` 指的是当前文档内一个命名的锚点，而不是一个的页面。当用户点击 `返回索引`\
  \ 时，网络浏览器将显示从 `<a id=\"top\">` 标签开始的页面部分。\n\n列表 7.1 使用带有 `id` 属性的 `<a>` 标签设置锚点\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>按字母排序的莎士比亚</title>\n\
  \  </head>\n  <body>\n    <h1><a id=\"top\"></a>莎士比亚十四行诗的开首行</h1>\n    <p>你难道不讨厌当你正在追求时，正单膝跪地\n\
  \    正准备背诵出一首完全浪漫的莎士比亚\n    十四行诗，结果砰！你忘词了。<em>“嗯……那是，呃……我想\n    它是以 B 开头的……”</em></p>\n\
  \    <p>好了，这样你看起来就不再像个傻瓜了。只需参考此页面，\n    点击你想要的首十四行诗的首字母，就能立即获得第一行的提醒来帮助你开始。<em>“该诅那颗\n\
  \    心，它让我的心呻吟不已……”</em></p>\n    <hh2 style=\"text-align:center\">字母索引</h2>\n \
  \   <h3 style=\"text-align:center\">\n      <a href=\"#A\">A</a> <a href=\"#B\"\
  >B</a> <a href=\"#C\">C</a>\n      <a href=\"#D\">D</a> <a href=\"#E\">E</a> <a\
  \ href=\"#F\">F</a>\n      <a href=\"#G\">G</a> <a href=\"#H\">H</a> <a href=\"\
  #I\">I</a>\n      <a href=\"#J\">J</a> <a href=\"#K\">K</a> <a href=\"#L\">L</a>\n\
  \      <a href=\"#M\">M</a> <a href=\"#N\">N</a> <a href=\"#O\">O</a>\n      <a\
  \ href=\"#P\">P</a> <a href=\"#Q\">Q</a> <a href=\"#R\">R</a>\n      <a href=\"\
  #S\">S</a> <a href=\"#T\">T</a> <a href=\"#U\">U</a>\n      <a href=\"#V\">V</a>\
  \ <a href=\"#W\">W</a> <a href=\"#X\">X</a>\n      <a href=\"#Y\">Y</a> <a href=\"\
  #Z\">Z</a>\n    </h3>\n    <hr />\n    <h3><a id=\"A\"></a>A</h3>\n    <ul>\n  \
  \    <li>自然手绘的女性脸，</li>\n      <li>指责我，我已经写完了，</li>\n      <li>我的爱情将如现在这，</li>\n\
  \      <li>在那时（如果时间到来），</li>\n      <li>为何他应该活着，</li>\n      <li>哎，我的灵感带来了什么，</li>\n\
  \      <li>唉，真的，我在这里那里，</li>\n      <li>像一个快乐的父亲，</li>\n      <li>像舞台上不完美的演员，</li>\n\
  \      <li>像你枯萎得一样，</li>\n    </ul>\n    <p><a href=\"#top\">返回索引。</a></p>\n   \
  \ <hr />\n    <!-- 继续字母 -->\n    <h3><a id=\"Z\"></a>Z</h3>\n    <p>(没有十四行诗是以 Z\
  \ 开头的。)</p>\n    <p><a href=\"#top\">返回索引。</a></p>\n  </body>\n</html>\n```\n\n\
  在列表 7.1 的末尾你会看到一行：`<!-- 继续字母 -->`。这段文本（HTML 注释）会出现在你的源代码中，但不会由浏览器显示。你可以在第 27 章 更多关于代码注释的知识。\n\
  \n注意通过 `<a>` 标签中的 `id` 属性指定的名称必须以字母或数字开头。因此，如果你想简单为锚点编号，请确保用文本开头（如 `photo1`、`photo2`\
  \ 等），而不是仅仅用 `1`、`2` 等。纯数字锚点 ID 在浏览器中有效，但不符合 XHTML 标准。\n\n列表 7.1 中的每个 `<a href>`\
  \ 链接都会创建一个指向相应 `<a id>` 锚点的下划线链接——如果我填充了所有文本。在这个示例中只有 `A` 和 `Z` 有效，因为只有 `A` 和 `Z`\
  \ 链接有相应的文本链接，但你可以自己填充剩余！例如，点击图 7.1 中字母索引下的字母 `Z`，将你带到图 7.2 所示的页面部分。\n\n**图 7.1**\
  \ 列表 7.1 中的 `<a id>` 标签在网页上完全没有显示。`<a href>` 标签以下划线链接的形式出现。\n![image](img/07fig01.jpg)\n\
  \n**图 7.2** 点击图 7.1 所示页面上的字母 `Z` 将你带到同一页面的相应部分。\n![image](img/07fig02.jpg)\n\n掌握了链接页面内文本区域的概念后，你现在可以学习链接其他网页内容了。\n\
  \n### 网页内容之间的链接\n\n正如你在本章早期学到的，当链接到你域内的内容（如果你在本地查看网站）时，不需要在 `href` 属性指定的每个地址之前包含\
  \ `http://`。当你从同一域或同一台计算机上的一个文件链接到另一个文件时，不需要指定完整的互联网地址。事实上，如果两个文件存储在同一个文件夹中，你可以直接使用\
  \ HTML 文件名：\n\n```html\n<a href=\"pagetwo.html\">前往第 2 页。</a>\n```\n\n例如，列表 7.2\
  \ 和图 7.3 展示了一个测验页面，其中有一个指向列表 7.3 和图 7.4 所示答案页的链接。答案页包含返回测验页面的链接。因为列表 7.2 中的页面链接到同一目录下的另一个页面，因此文件名可以代替完整地址。\n\
  \n**图 7.3** 这是列表 7.2 列出的 `historyquiz.html` 文件。\n![image](img/07fig03.jpg)\n\n**图\
  \ 7.4** 图 7.3 中的`检查答案！`链接将你带到这个答案页。`返回问题`链接将你带回图 7.3 所示的内容。\n![image](img/07fig04.jpg)\n\
  \n列表 7.2 `historyanswers.html` 文件\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>历史测验</title>\n  </head>\n  <body>\n    <h1>历史测验</h1>\n    <p>完成以下韵律。（例如：威廉征服者在十六六六年对撒克逊耍了阴谋。）</p>\n\
  \    <ol>\n      <li>哥伦布在蓝色海洋航行于……</li>\n      <li>西班牙无敌舰队在……遭遇了</li>\n      <li>伦敦像腐烂木一样烧毁在……</li>\n\
  \    </ol>\n    <p style=\"text-align: center;font-weight: bold;\">\n      <a href=\"\
  historyanswers.html\">检查答案！</a>\n    </p>\n  </body>\n</html>\n```\n\n\n\n\n\n##\
  \ 列表 7.3 `historyquiz.html` 链接到的 `historyanswers.html` 文件\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>历史测试答案</title>\n  </head>\n  <body>\n \
  \   <h1>历史测试答案</h1>\n    <ol>\n      <li>...一千四百九十二二年。</li>\n      <li>...一千五百八十八八年。</li>\n\
  \      <li>...一千六百六六六年。</li>\n    </ol>\n    <p style=\"text-align: center;font-weight:\
  \ bold;\">\n      <a href=\"historyquiz.html\">返回题目</a>\n    </p>\n  </body>\n</html>\n\
  ```\n\n使用文件名而不是完整的互联网地址可以节省大量的打字工作。更重要的是，无论这组页面存储在何处，页面之间的链接都能正常工作。你可以在文件仍留在计算机硬盘上时测试链接。然后，你可以将它们移动到\
  \ Web 服务器、CD-ROM、DVD 或内存卡中，所有的链接将仍然能够正常工作。这种识别网页的简化方法并没有什么神奇之处——这与你已经学过的网页地址定有关。\n\
  \n### 链接到外部网页内容\n\n链接到你自己站点页面与链接到外部网页内容的唯一区别在于，当链接到站点外部时，你需要包含该部分内容的完整地址。完整地址包括域名之前的\
  \ `http://`，然后是该文件的完整路径（例如，HTML 文件、图像文件、多媒体文件等）。\n\n注意：正如你可能知道的，在大多数 浏览器中输入任何地址时，你可以省略开头的\
  \ `http://`。但是，当你向网页的 `<a href>` 链接中输入互联网地址时，你不能省略该部分。\n\n例如，要从你自己的某个网页中包含一个指向 Google\
  \ 的链接，你会在 `<a>` 链接中使用这种绝对地址法：\n\n```html\n<a href=\"http://www.google.com/\">访问\
  \ Google</a>\n```\n\n你可以将之前章节中学到的知识应用于创建到其他页面上命名锚点的链接。链接锚点不仅限于同一页面。你可以通过包含地址或文件名，后跟\
  \ `#` 和锚点名称，来链接到另一个页面上的命名锚点。例如，下面的链接将你带到域名 `www.takeme2thezoo.com` 下 `elephants`\
  \ 目录内 `african.html` 页面中名为 `photos` 的锚点。\n\n```html\n<a href=\"http://www.takemetothezoo.com/elephants/african.html#photos\"\
  >\n查看非洲大象照片！</a>\n```\n\n如果你是从 `www.takeme2thezoo.com` 域名上的另一个现有页面进行链接（因为你实际上是该站维护者），你的链接可能简单如下：\n\
  \n```html\n<a href=\"/elephants/african.html#photos\">查看非洲大象照片！</a>\n```\n\n注意：务必只在\
  \ `<a href>` 链接标签中包含 `#` 符号。不要在 `<a id>` 标签中放置 `#` 符号；否则指向该名称的链接将无法工作。\n\n正如你已经学过的，在这种情况下，不需要\
  \ `http://` 和域名。\n\n### 链接到电子邮件地址\n\n除了页面之间以及单个页面部分之间的链接外，`<a>` 标签还允许你链接到电子邮件地址。这是让你的网页访问者能够向你反馈的最简单方法。当然，你也可以向访问者提供你的电子邮件地址，并信任他们将其输入到他们使用的任何电子邮件程序中，但这样会增加错误的概率。通过提供一个指向你电子邮件地址的可点击链接，你可以让他们给你发消息变得几乎毫不费力，并消除拼写错误的机会。\n\
  \n指向电子邮件地址的 HTML 链接如下：\n\n```html\n<a href=\"mailto:yourusername@yourdomain.com\"\
  >给我发封邮件消息。</a>\n```\n\n`Send me an email message` 文字将像任何其他 `<a>` 链接一样显示。\n\n如果你想让人们看到真实的电子邮件地址（以便他们记录它或使用不同的电子邮件程序发送消息），请将其同时包含在\
  \ `href` 属性中，并作为 `<a>` 和 `</a>` 标签之间消息的一部分，如下：\n\n```html\n<a href=\"mailto:you@yourdomain.com\"\
  >you@yourdomain.com</a>\n```\n\n在大多数 浏览器中，当有人点击链接时，她会获得一个窗口，可以在其中输入消息，消息将立即发送给你——无论该人使用什么电子邮件程序发送和接收邮件，都会被自动调用。你可以在链接中提供一些额外信息以便……（等等，让我们重新检查源文本中的特定示例）。\n\
  \n你可以在链接中提供一些额外信息以便……：示例显示了 `subject` 和 `body` 变量：\n\n```html\n<a href=\"mailto:author@somedomain.com?subject=Book\
  \ Question&body=When is the next edition out?\">author@somedomain.com</a>\n```\n\
  \n\n\n\n因为浏览器将字符编码解释为……嗯，字符，所以从浏览器的角度来看，结果是相同的。然而，自动化电子邮件抓取程序会在原始 HTML 代码中搜索页面，而在这种情况下，显示的是看起来相当混乱的电子邮件地址。如果你不想为自己的地址推算字符编码，只需在搜索引擎中输入\
  \ `email address encoder`，你就会找到一些在线服务，它们会为你生成一个编码后的字符串。\n\n## 在新浏览器窗口中打开链接\n\n现在你已经掌握了如何为链接创建地址——包括内部链接（站点内）和外部链接（指向其他站点）——还有一种额外的链接方法：强制用户在新窗口中打开链接。\n\
  \n你无疑听说过“弹出窗口（pop-up windows）”，它们是浏览器窗口——通常用于投放产品和服务——未经用户许可自动打开并显示。然而，在某些情况下，打开另一个窗口或定位另一个位置确实具有正用途。例如，你可能希望在一个较小的次要浏览器窗口中显示信息，但仍允许用户在主窗口查看该信息。这在点击动画演示、电影片段或其他多媒体元素的链接时通常如此。当你链接到站外内容时，也可能希望目标一个新的浏览器窗口。\n\
  \n然而，代表用户打开新的浏览器窗口——尤其是当它是全屏新窗口时——违背了一些易用性和无障碍原则。当人们打开新窗口时，通常是通过使用 `<a>` 标签的 `target`\
  \ 属性实现的。在严格的 XHTML 1.1 指定中，`<a>` 标签已经删除了 `target` 属性。\n\n有有效的方法可以在遵循易用性和无障碍原则的同时实现相同的结果，但这些方法需要一些\
  \ JavaScript 和其他高级技术。当我们进入本书的 JavaScript 部分时，你将学习这些方法，该部分还将涵盖使用符合标准且无障碍的方式通过外部链接调用新窗口。\n\
  \n## 使用 CSS 为超链接设置样式\n\n网页上文本超链接的默认显示为带下划线的蓝色文本。你可能还会注意到，以前访问过的链接显示为带下划线的紫色文本——那种颜色也是默认的。如果你在\
  \ Web 上花费过任何时间，你还会注意到并不是所有的链接都是蓝色或紫色的——对此，我认为我们都非常感激。通过使用一点 CSS 和对 `<a>` 链接的各种伪类（pseudoclasses），你可以让链接看起来像任何你想要的样子。\n\
  \n### 注意\n\n你可以通过在起始 `<a>` 和结束 `</a>` 标签之间放置 `<img />` 标签将图形作为链接（而不是使用文本作为链接）。你将在第\
  \ 8 章“处理颜色、图像和多媒体](#ch08.html_ch08)”中学习如何将图形作为链接。\n\n`伪类` 是描述适用于特定元素的元素的类，例如用户与该元素交互的各种状态。\n\
  \n例如，`<a>` 标签常用的伪类有 link、visited、hover 和 active。如果你愿意，可以用“爱恨（Love-Hate）”口诀来记住它们：LV（love）\
  \ HA（hate）。\n\n- `a:link` 描述以前未访问过的超链接的样式。\n- `a:visited` 描述以前已访问过且存在于浏览器内存中的超链接的样式。\n\
  - `a:hover` 描述用户鼠标悬停在链接上时（在点击之前）超链接的样式。\n- `a:active` 描述正在被点击但尚未释放的超链接的样式。\n\n例如，假设你想创建一个具有以下样式的链接：\n\
  \n- 粗体且为 Verdana 字体（且没有下划线，意味着没有文本装饰）\n- 基础颜色为浅蓝色\n- 用户悬停或点击时时颜色为红色\n- 用户访问后颜色为灰色\n\
  \n你的样式表条目可能如下：\n\n```css\na {\n   font-family: Verdana, sans-serif;\n   font-weight:\
  \ bold;\n   text-decoration: none;\n}\n\na:link {\n   color: #6479A0;\n}\n\na:visited\
  \ {\n   color: #CCCCCC;\n}\n\na:hover {\n   color: #E03A3E;\n}\n\na:active {\n \
  \  color: #E03A3E;\n}\n```\n\n### 注意\n\n示例中的颜色由其十六进制值表示，你将在第 8 章中学习这些。\n\n由于示例链接无论处于何种状态都是\
  \ Verdana 粗体（且没有下划线），因此这三个属性值值对可以放在 `a` 选择器的规则中。然而，由于每个伪类必须关联一个特定的颜色，我们像代码示例所示，为每个伪类使用一个规则。伪类继承父规则的样式，除非伪类的规则专门覆盖了该规则。换句话说，上一个示例中的所有伪类都是\
  \ Verdana 粗体（且没有下划线）。但是，如果我们对 hover 伪类使用了以下规则，文本将以 Comic Sans 显示：\n\n```css\na:hover\
  \ {\n   font-family: \"Comic Sans\";\n}\n```\n\n此外，由于每个伪类必须关联一个特定的颜色，我们像代码示例所示，为每个伪类使用一个规则。伪类继承父规则的样式，除非伪类的规则专门覆盖了该规则。换句话说，上一个示例中的所有伪类都是\
  \ Verdana 粗体（且没有下划线）。但是，如果我们对 hover 伪类使用了以下规则，文本将以 Comic Sans 显示：\n\n```css\na:hover\
  \ {\n   font-family: \"Comic Sans\";\n}\n```\n\n```html\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\"\
  >\n<html lang=\"en\">\n<head>\n  <title>Sample Link</title>\n  <style type=\"text/css\"\
  >\n    a {\n      font-family: Verdana, sans-serif;\n      font-weight: bold;\n\
  \      text-decoration: none;\n    }\n\n    a:link {\n      color: #6479A0;\n  \
  \  }\n\n    a:visited {\n      color: #CCCCCC;\n    }\n\n    a:hover, a:active {\n\
  \      color: #E03A3E;\n    }\n  </style>\n</head>\n<body>\n  <h1>Sample Link</h1>\n\
  \  <p><a href=\"simplelink.html\">当你第一次看到我时，我应该是一个浅蓝色、粗体、无下划线的 Verdana 字体链接。</a></p>\n\
  </body>\n</html>\n```\n\n\n\n\n正如下面的示例所示，类名（`footerlink`）出现在选择器名称（`a`）之后，用点分隔，并出现在伪类名称（`hover`）之前，用冒号分隔：\n\
  \nselector.class:pseudoclass\n\n`a.footerlink:hover`\n\n## 总结\n\n`<a>` 标签是使文本变为“超”（hyper）的关键。通过它，你可以创建页面之间的链接，以及指向任何页面上特定锚点的链接。本章重点介绍了如何使用相对地址或绝对地址标识页面，并创建并设置指向其他页面的简单链接。\n\
  \n你学习了在创建指向他人页面的链接时，在`<a href>` 标签中包含每个页面的完整互联网地址点。对于你自己页面之间的链接，只需包含文件名和足够从一个页面到另一个页面的目录信息即可。\n\
  \n你发现了如何在页面内创建命名的锚点，以及如何创建指向特定锚点的链接。你还学习了如何链接到你的电子邮件地址，以便用户可以轻松地向你发送消息。你甚至学习了如何保护你的电子邮件免受垃圾邮件发送者的攻击。最后，你学习了使用\
  \ CSS 控制链接显示的方法。\n\n`Table 7.1` 汇总在本章讨论的 `<a>` 标签。\n\n表 7.1 第 7 章涵盖的 HTML 标签和属性\n\
  \n![image](img/07tab01.jpg)\n\n## 问答\n\n**Q. 如果我链接到互联网上的一个页面，然后该页面的所有者删除或移动了它会怎样？**\n\
  \n**A.** 这取决于该外部页面维护者如何设置他的 Web 服务器。通常，当你点击一个移动或删除的链接时，你会看到 `page not found`（未找到页面）或其他信息。你仍然可以点击返回按钮回到你的页面。作为网站维护者，你可以定期运行链接检查程序，以确保你的内部和外部链接都是有效的。例如\
  \ `http://validator.w3.org/checklink` 链接检查服务。\n\n**Q. 我网站上的一个内部链接在我的电脑上运行正常，但当我把页面放到互联网上时，链接不再起作用。怎么回事？**\n\
  \n**A.** 这些是最可能的元凶：\n\n- **大小写问题**——在 Windows 网上，使用`<a href=\"myfile.html\">` 链接到名为\
  \ `MyFile.html` 的文件是可以工作的。在大多数 Web 服务器上，链接必须是 `<a href=\"MyFile.html\">`（或者你必须将文件名改为\
  \ `MyFile.html`）。更糟糕的是，某些文本编辑器和文件传输程序实际上会在不通知你的情况下更改大小写！最佳解决方案是网页文件名统一使用全小写字母。\n\
  \n- **文件名中的空格**——大多数 Web 服务器都不允许文件名中包含空格。例如，你不应该将网页重命名为 `my page.html`。相反，请将其命名为\
  \ `mypage.html` 甚至是 `my_page.html`（使用下划线代替空格）。\n\n- **本地绝对地址**——如果由于某种原因，你使用本地绝对地址链接到文件（例如\
  \ `C:\\mywebsite\\news.html`），那么当你把文件放在互联网上时，链接将无法工作。你永远不要使用本地绝对地址；当这种情况发生时，通常是为了测试页面部分而创建的临时链接导致的意外。所以，在\
  \ Web 上发布页面之前，请务必移除任何测试链接。\n\n**Q. 我可以在同一个 `<a>` 标签中同时放置 `href` 和 `id` 吗？我会出于什么原因想要这样做吗？**\n\
  \n**A.** 你可以，如果你有一个命名的锚点和一个链接紧挨在一起，这可能会为你节省一些打字时间。然而，通常情况下最好分开使用 `<a href>` 和 `<a\
  \ id>` 以避免混淆，因为它们在 HTML 文档中扮演着非常不同的角色。\n\n**Q. 如果我不小心拼错了锚点的名称，或者忘记在它前面加 `#` 会怎样？**\n\
  \n**A.** 如果你链接到一个页面内不存在的锚点名称或拼写错误的锚点名称，链接将跳转到该页面的顶部。\n\n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖材料的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**[1].** 你的小学好朋友在互联网上找到了你，说他想交换主页链接。你如何在你的一个页面上放置一个指向他网站 `www.supercheapsuits.com/~billybob/`\
  \ 的链接？\n\n**[2].** 你会使用什么 HTML 代码来让点击页面顶部“关于作者”（About the Authors）单词的人直接跳转到页面其他地方的谢名单？\n\
  \n**[3].** 如果你的电子邮件地址是 `bon@soir.com`，你如何让文本“goodnight greeting”（晚安问候）变成一个人们点击即可编写并向你发送电子邮件的链接？\n\
  \n## 答案\n\n**1.** 在你的页面上放置以下内容：\n\n```html\n<a href=\"http://www.supercheapsuits.com/~billybob/\"\
  >Bob's site</a>\n```\n\n**2.** 在页面顶部输入此内容：\n\n```html\n<a href=\"#credits\">About\
  \ the Authors</a>\n```\n\n**3.** 在谢名单的开头输入此内容：\n\n```html\n<a href=\"mailto:bon@soir.com\"\
  >goodnight greeting</a>\n```\n\n## 练习\n\n- 创建一个 HTML 文件，其中包含一个你最喜爱的网站的格式化列表。你可能已经在浏览器中收藏了这些网站，如果是这样，你可以访问它们并在浏览器地址栏中找到确切的\
  \ URL。\n\n- 如果你为网站创建了任何页面，请检查它们并考虑文中是否有任何地方你想让人们方便地联系你。在该处包含一个指向你电子邮件地址的链接。为人们提供足够的联系机会让他们告诉你的需求或对你产品的看法是永远不过分的——尤其是当你经营业务时。\n\
  \n## 第 8 章。处理颜色、图像和多媒体\n\n在本章中你将学习\n\n- 如何为你的网站选择适用于 Web 的颜色\n- 如何使用 CSS 设置背景、文本和边框颜色\n\
  - 如何准备用于在线的照片\n- 如何创建横幅和按钮\n- 如何减少图像中的颜色数量\n- 如何创建透明图像\n- 如何为平铺背景准备图像\n- 如何在网页上放置图像\n\
  - 如何用文字描述图像\n- 如何指定图像的高度和宽度\n- 如何对齐图像\n- 如何使用背景图像\n- 如何使用图像映射（imagemaps）\n- 如何使用多媒体文件\n\
  \n这个列表看起来很长，但每项任务都非常短小简单，并将帮助你将 Web 开发体验从本书目前为止的白背景/黑字示例转向更有趣（或至少是色彩丰富）的示例。\n\n\n\
  \n\n在你学习了如何创建图形本身之后，你将学习如何使用 HTML 和 CSS 集成你的图形。在本章的末尾，你将学习如何将额外的媒体（或多媒体）集成到你的网站中。\n\
  \n## 选择颜色的最佳实践\n\n我无法准确告诉你在网站中应该使用哪些颜色，但我可以帮助你理解在自己选择这些颜色时应该考虑的因素。你所使用的颜色会极大影响你的访问者；如果你正在经营一个电子商务网站，你将希望使用能够吸引用户查看你的目录并最终购买物品的颜色。为此，你需要确保颜色的使用是审慎且尊重习俗的。你可能会奇怪在谈论颜色时，“尊重”是如何体现其中的，但请记住，万维网是一个国际社区，人们的理解各不相同；例如，粉色在日本是非常流行的颜色，但在东欧国家非常不受欢迎。同样，绿色在美国是钱的颜色，但绝大多数其他国家的纸币是多颜色的，因此“金钱的颜色”并不是单一的颜色，这种比喻对他们来说毫无价值。\n\
  \n除了使用具有文化敏感性的颜色外，其他最佳实践还包括：\n\n- 使用自然的调色板。这并不意味着你应该使用大地色调，而是指使用人们在镇上闲闲散步时自然看到的颜色——避免使用会导致眼睛疲劳的超亮色。\n\
  - 使用较小的调色板。你不需要使用 15 种不同的颜色来实现你的目标。事实上，如果你的页面包含 15 种不同颜色的文本和图像，你可能需要重新评估你试图传达的信息。专注于三到四种主色，最多辅以几种补色。\n\
  - 考虑你的人口统计特征。你可能无法控制你的人口统计特征，因此必须找到一个兼顾所有人的折中方案。年轻人喜欢的颜色并不一定是老年人欣赏的颜色，正如男性、女性以及来自不同地理和文化背景的人之间存在颜色偏好一样。\n\
  \n只要记住这几点建议，你的颜色选择似乎有限。事实并非如此——这仅仅意味着你在做决定之前应该考虑一下你正在做的决定。在你选择的搜索引擎中搜索 `color theory`（色彩理论）应该为你提供更多思考，使用色轮也是如此。\n\
  \n`color wheel`（色轮）是一个以圆形方式组织颜色的图表。这种显示方法试图帮助你视觉化原色、间色和补色之间的关系。色彩方案是通过使用色轮开发出来的；理解色彩方案可以帮助你确定在整个网站中一致使用的调色板。例如，了解一些颜色关系将使你能够避免在浅蓝色背景上使用橙色文本，或在棕色背景上使用亮蓝色文本。\n\
  \nWeb 设计中常见的色彩方案如下：\n\n- **邻比色（Analogous）**——色轮上相互相邻的颜色，例如黄色和绿色。一种颜色为主色调，其邻比色被用于丰富显示效果。\n\
  - **补色（Complementary）**——色轮上相互对的颜色，例如暖色（红色）和冷色（绿色）。\n- **三原色（Triadic）**——色轮上等距离分布的三种颜色。三原色方案在提供平衡的同时，仍然允许丰富的色彩使用。\n\
  \n有整本书籍和课程致力于理解色彩理论，因此在书中继续这一讨论确实会偏离主题。然而，如果你打算从事 Web 设计和开发，对色彩理论基础的扎实理解将大有益处。花些时间阅读它——在线搜索将提供丰富的信息。\n\
  \n此外，花些时间实践一下色轮。`http://colorschemedesigner.com/` 上的色彩方案生成器允许从基础色开始，生成单色、补色、三原色、四角色、邻比色和强调邻比色彩方案。\n\
  \n## 理解 Web 颜色\n\n为网页指定除白色以外的背景颜色比你想象的要简单。例如，要将蓝色指定为页面的背景颜色，在 `<body>`标签内放入 `style=\"\
  background-color:blue\"` 或在 body 元素的样式表规则中编写。当然，你可以使用蓝色以外的许多颜色。事实上，W3C 标准列出了 16\
  \ 种颜色：aqua, black, blue, fuchsia, gray, green, lime, maroon, navy, olive, purple,\
  \ red, silver, teal, white 和 yellow。\n\n***\n\n**注意**\n\n要查看 140 种描述性颜色名称的完整列表、十六进制代码以及浏览器显示的颜色示例，请访问\
  \ `http://www.w3schools.com/HTML/html_colornames.asp`。\n\n***\n\n显然，Web 上显示的颜色远不止这\
  \ 16 种。事实上，有 140 种颜色名称你可以放心地使用，并确信所有浏览器都会以相似的方式显示这些颜色。以下是 140 种描述性颜色名称的部分列表：azure,\
  \ bisque, cornflowerblue, darksalmon, firebrick, honeydew, lemonchiffon, papayawhip,\
  \ peachpuff, saddlebrown, thistle, tomato, wheat 和 whitesmoke。\n\n但名称是主观的——例如，如果你查看\
  \ 140 种跨浏览器颜色名称图表，你将无法区分 fuchsia 和 magenta。这时你会发现，这两个术语 `fuchsia` 和 `magenta` 相关的十六进制颜色值是完全相同的：`#FF00FF`。你将在下一节中学习十六进制颜色值，但现在请记住，如果你想符合标准并使用\
  \ 16 种颜色名称以外的颜色，尽可能使用十六进制颜色代码。\n\n***\n\n**提示**\n\n值得注意的是，颜色名称是不区分大小写的。因此，`Black`、`black`\
  \ 和 `BLACK` 都是黑色，尽管大多数 Web 设计师习惯使用小写或混合大小（如果他们使用颜色名称的话，因为大多数设计师会使用十六进制法进行更精细的色彩处理）。\n\
  \n***\n\n事实上，通过十六进制颜色代码可以实现 1600 万种颜色。然而，大多数现代显示器“只能”显示 16384 种。但 16384 仍然比 140\
  \ 或 16 多得多。\n\n你应该意识到，并不是所有的电脑显示器显示的色调都是相同的。在你的显示器上看起来漂亮的浅蓝色背景色，在另一个用户的显示器上可能更偏紫色。中性大地色调（如中灰色、浅褐色和象牙色）在许多电脑显示器上可能会产生更不可预测的效果。这些颜色可能会根据房间的光线条件或时间，在同一个显示器上似乎会发生变化。\n\
  \n\n\n\n有很多非常糟糕的网站，其中一些是由认真的人创建，完全没有任何讽刺意味。然而，图 8.1（ch08.html_ch08fig01）所示的“世界上最糟糕网站”是故意创建，为了展示网站设计中一些严重的罪行，特别是在颜色的使用上。单看一张截图无法体现它的全部——请亲自访问[`www.angelfire.com/super/badwebs/main.htm`](http://www.angelfire.com/super/badwebs/main.htm)\
  \ 并体验一下该网站。\n\n**图 8.1** “世界上最糟糕网站”的部分截图。\n\n![image](img/08fig01.jpg)\n\n如果你在搜索引擎中搜索\
  \ `bad website examples`（糟糕网站示例），你会发现许多收集糟糕设计案例的网站，并解释了为什么此类网站应该进入“耻辱柱”而不是“名人堂”。许多网站因为其视觉展示而被认为是糟糕的，而这种展示是从颜色选择开始的。因此，了解颜色以及其规范和使用的细微差别，是创建良好网站的关键步骤。\n\
  \n### 使用十六进制值表示颜色\n\n为了保持符合标准，并对网站中的颜色保持精确控制，你可以通过十六进制值来引用颜色。颜色的 `hexadecimal value`\
  \ 表示在每种颜色中应该混合多少红光、绿光和蓝光。它的原理有点像橡皮泥——只需混合你想要的红色、蓝色和绿色量即可获得适当的颜色。\n\n十六进制颜色格式为 `#rrggbb`，其中\
  \ `rr`、`gg` 和 `bb` 是颜色的红色 (rr)、绿色 (gg) 和蓝色 (bb) 分量的两位十六进制值。如果你不熟悉十六进制，不用担心。只需记住\
  \ `FF` 是最大值，`00` 是最小值即可。对每个组件使用以下代码之一：\n\n* `FF` 意味着全亮度。\n* `CC` 意味着 80% 亮度。\n*\
  \ `99` 意味着 60% 亮度。\n* `66` 意味着 40% 亮度。\n* `33` 意味着 20% 亮度。\n* `00` 意味着没有这种颜色分量。\n\
  \n例如，亮红色为 `#FF0000`，深绿色为 `#003300`，蓝紫色为 `#660099`，中灰色为 `#999999`。要创建一个红色背景和深绿色文本的页面，HTML\
  \ 代码将如下：\n\n```html\n<body style=\"background-color:#FF0000; color:#003300\">\n\
  ```\n\n虽然这里只展示了六个两位十六进制值的示例，但实际上有 225 种两位十六进制值的组合——0 到 9 和 A 到 F 配对。例如，`F0` 是一个可能的十六进制值（十进制\
  \ 240），`62` 是一个可能的十六进制值（十进制 98），以此此类推。\n\n如前所述，`#rrggbb` 十六进制颜色格式中的 `rr`、`gg` 和\
  \ `bb` 代表颜色的红色、绿色和蓝色分量。每个组件的十进制值从 0（无色）到 255（全色）不等。\n\n因此，白色（或 `#FFFFFF`）转换为红色值\
  \ 255，绿色值 255，蓝色值 255。同样，黑色（`#000000`）转换为红色值 0，绿色值 0，蓝色值 0。纯红色为 `#FF0000`（全红，无绿，无蓝），纯绿色为\
  \ `#00FF00`（无红，全绿，无蓝），纯蓝色为 `#0000FF`（无红，无绿，全蓝）。所有其他十六进制表示法都转换为三种颜色 255 种可能值的变体。跨浏览器兼容的颜色名称\
  \ `cornflowerblue` 与十六进制表示 `#6495ED` 相关——其红色值为 40，绿色值为 149，蓝色值为 237（几乎是所有可用蓝色值）。\n\
  \n在选择颜色时，无论是通过图形程序还是在网上找到你喜欢的颜色，你可能会看到十六进制或十进制的颜色概念。如果你在搜索引擎中输入 `hexadecimal color\
  \ converter`（十六进制颜色转换器），你会发现许多选项，帮助你将颜色值转换为可以在样式表里使用的内容。\n\n### 使用 CSS 设置背景、文本和边框颜色\n\
  \n使用 CSS 时，颜色值可以在三种情况下使用：指定元素的背景颜色、文本颜色或边框颜色时。之前的章节包含了指定颜色的示例，但没有详细阐述颜色概念或颜色理论。例如，在第\
  \ 7 章（ch07.html_ch07）的“使用外部链接和内部链接”中，你学习了如何为各种链接状态使用颜色。\n\n图 8.2（ch08.html_ch08fig02）展示了一个很容易进入网页设计耻辱柱的颜色使用示例。我无法想象在严肃的网站中使用这些颜色和样式的组合，但它在这里可以作为颜色样式*可以*应用到各种元素的示例。\n\
  \n**图 8.2** 背景、文本和边框颜色都可以使用 CSS 设置。\n\n![image](img/08fig01.jpg)\n\n图 8.2（ch08.html_ch08fig02）展示了一个很容易进入网页设计耻辱柱的颜色使用示例。\n\
  \n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"\
  -//W3C//DTD HTML 4.1//EN\" \"http://www.w3.org/TR/REC-html41/dtd\">\n<html lang=\"\
  en\">\n<head>\n  <title>Background, Text, and Border Colors</title>\n</head>\n<body>\n\
  <h1>Background, Text, and Border Colors</h1>\n<p style=\"background-color:#FF0000;\
  \ color:#003300\">\n<span style=\"color:orange\">orange</span></p>\n<div style=\"\
  width:300px; height:75px; margin-bottom:12px; background-color:#000000; border:2px\
  \ dashed #FF0000; color:#FFFFFF\">Black div, red border, white text.</div>\n<table\
  \ border=\"1\">\n<tr>\n<td style=\"background-color:#00FF00\">Green Cell</td>\n\
  <td style=\"background-color:#FF0000\">Red Cell</td>\n</tr>\n<tr>\n<td style=\"\
  background-color:#FFFF00\">Yellow Cell</td>\n<td style=\"background-color:#000FF\"\
  >Blue Cell</td>\n</tr>\n</table>\n<blockquote style=\"background-color:#000FF; border:4px\
  \ dotted #FFFF00; color:#FFFFFF\">\n<p>Blue blockquote, yellow border, white text.</p></blockquote>\n\
  </body>\n</html>\n```\n\n\n\n\n最后，请考虑你的受众中有一部分不容忽视的色盲群体。为了无障碍，你可以考虑使用 `http://colorfilter.wickline.org/`\
  \ 上的色盲网页过滤器工具，查看你的网站在色盲人士眼中会是什么样。\n\n### 选择图形软件\n\n为你的网站选择整体配色方案是一回事，而创建或编辑用于这些模板的图像则是另一回事——而且这超出了本书的范畴（或者说，单本书也无法涵盖）。不过，在接下来的章节中，你将学习任何维护网站的人员都应该快速掌握的一些基础操作。\n\
  \n***\n\n### 使用其他网站的素材\n\n创建网页图形和媒体文件节省时间最好的方法之一，当然是完全避免创建它们。从任何网页获取图形只需右键点击它（或在\
  \ Macintosh 鼠标上点击并按住按钮）并选择`另存为图像`或`另存为图片`（取决于你的浏览器）。从页面中提取背景图像同样简单：右键点击它并选择`另存背景为`。\n\
  \n然而，你绝不能在没有所有者明确许可的情况下使用图像，无论是通过询问他们还是寻找知识共享（Creative Commons）许可。在没有明确许可的情况下使用图像是侵犯版权（而且也是令人反感的）。要了解更多关于版权的信息，请访问\
  \ `http://www.utsystem.edu/OGC/IntellectualProperty/cprtindx.htm`。\n\n你可能还会考虑免版税剪画（clip\
  \ art），这不需要你获得版权许可。在线剪画的一个良好来源是微软 Office Online Clip Art 和媒体网站，地址为 `http://office.microsoft.com/clipart/`。Barry’s\
  \ Clipart Server 是另一个受欢迎的剪画网站，地址为 `http://www.barrysclipart.com/`。\n\n***\n\n你可以使用几乎任何图形程序为你的网站创建和编辑图像，从计算机操作系统通常免费自带的简单画图程序，到像\
  \ `Adobe Photoshop` 这样昂贵的专业程序。同样，如果你的电脑上连接了数码相机或扫描仪，它可能附带了一些能够创建网页图形的图形软件。还有几个可以下载的免费图像编辑器——甚至可以作为\
  \ Web 应用程序在线使用——它们专门处理摄影元素的处理。\n\n如果你已经有了你认为可能用于创建网页图形的软件，尝试用它来完成接下来的章节中描述的所有操作。如果你的软件无法完成此处涵盖的一些任务，那么它可能就不是网页图形的良好工具。在这种情况下，请从\
  \ `http://www.gimp.org` 下载并安装 `GIMP`。这个功能齐全的图形程序是完全免费的，用于执行本章所示的操作。\n\n如果 `GIMP`\
  \ 不合合你，可以考虑下载 `Adobe Photoshop` 或 `Corel DRAW` 的评估版。仅用于照片处理，有很多免费选择，且都具有实用的功能。Google\
  \ 的 `Picasa`（可以在 `http://picasa.google.com/` 免费获取）其中一个选项。`Picnik` (`http://www.picnik.com/`)\
  \ 是另一个。这两个程序都适合编辑图像而不是从零开始创建，而且 `Picasa` 还侧重于组织你的数字照片集。因此，这类程序并不一定能帮助你为网站设计横幅或按钮图像。然而，这些程序可以帮助你处理一些辅助图像，而且它们足够强大，值得一试。\n\
  \n### 关于图形你最少需要的了解\n\n当你在互联网上发布图形和多媒体时，总有两种力量处于对立状态。用户的眼睛和耳朵希望你所有的内容尽可能详细和准确，而且也希望这些信息立即显示。复杂、色彩丰富的图形意味着大文件尺寸，这即使在快速连接下也会增加传输时间。你如何在最小化文件大小的同时最大化演示的质量？为了做出这些选择，你需要理解颜色和分辨率如何协同工作以产生主观质量感。\n\
  \n图像的分辨率构成图像的单个点（或 `pixels`，像素）的数量。大高分辨率图像的传输和显示通常比小低分辨率图像耗时长。分辨率通常以图像的宽乘以高表示，单位为像素；例如，一张\
  \ `300×200` 的图像宽为 300 像素，高 200 像素。\n\n***\n\n**注意**\n\n图像分辨率有多种类型，包括像素、空间、光谱、时间和辐射分辨率。你可以花费几个小时来专门学习每种类型；如果你在上图形设计课，你可能真的会这样做。但现在，你只需要记住：大图像下载时间更长，而且会占用大量的显示器空间。在设计网站时，显示尺寸和存储或传输大小是你应该考虑的因素。\n\
  \n***\n\n你可能会惊讶地发现，分辨率并不是决定图像文件存储大小（以及传输时间）的最显著因素。这是因为网页上使用的图像始终以压缩格式存储和传输。图像压缩是图像所通过的数学处理，以挤出重复模式。图像压缩的数学是非常复杂的，但基本思想是，当图像存储在磁盘上时，重复模式或相同颜色的大区域可以被挤出来。这使得图像文件小得多，并允许它传输得更快。网页浏览器在显示时会恢复图像原始的外观。\n\
  \n在接下来的章节中，你将学习如何创建视觉冲击力大但文件大小小的图形。你用来实现此目标的技术取决于图像的内容和目的。网页图形的用途和网页一样多，但四种类型最为常见：\n\
  \n- 人、产品或地方的照片\n- 图形横幅和标志\n- 用于指示操作和提供链接的按钮或图标\n- 元素的背景纹理\n\n### 准备照片\n\n为了将照片放在网页上，你需要将打印版照片转换为数字图像，或使用数码相机创建数字照片。你可能需要使用扫描仪或相机自带的自定义软件将图片保存到硬盘上，或者也可以直接将文件从相机拖到硬盘上。如果你使用扫描仪创建数字版本，你可以直接从你选择的图形程序控制任何扫描仪——详情请参见软件文档。\n\
  \n***\n\n**提示**\n\n如果你没有扫描仪或数码相机，几乎所有的冲印店都提供一种服务，将 35mm 胶片照片传输到 CD-ROM 或 DVD-ROM，费用较低。你可以将文件从\
  \ CD-ROM 或 DVD-ROM 复制到硬盘，然后使用你的图形程序打开并修改图像文件。\n\n\n\n\nGIMP 工具箱可以让你快速访问裁剪工具及其可能的属性。找到一个图像文件——可以是你用相机拍摄并存储在硬盘上的数字图像，也可以是你从网上找到的图像。在\
  \ GIMP 中打开图像后，按照以下步骤在 GIMP 中对其进行裁剪：\n\n1.  在 GIMP 工具箱中，点击裁剪工具（参见图 8.3）。根据你选择的工具，可能会有额外的属性供你选择。例如，图\
  \ 8.3 显示了裁剪工具的属性（如宽高比、位置、大小等）。\n\n**图 8.3** 从工具箱中选择裁剪工具。\n\n![image](img/08fig03.jpg)\n\
  \n2.  在你想要裁剪的图像中，通过点击你想保留的图像部分的左上角并按住左鼠标键拖动到右下角，在选择区域周围画一个框（参见图 8.4）。\n\n**图 8.4**\
  \ 选择你想要显示的图像区域。\n\n![image](img/08fig04.jpg)\n\n3.  点击选择框的任意一个角来应用裁剪。\n\n你的图形程序的方法可能与所示的不同，但概念是相同的：选择要保留的区域，然后裁剪掉其余部分。\n\
  \n***\n\n即使图像已经经过过裁剪，它可能仍然比网页所需的尺寸要大。根据特定网页的设计，你可能希望将大图像限制在 800×600 像素以内（如果它单独显示在页面上，例如产品目录），甚至是\
  \ 640×480 像素或更小。当与文字一起显示时，图像宽度通常在 250 到 350 像素之间，这样就有足够的空间显示文本。在某些情况下，你可能还想提供图像的缩略图并链接到大图，在这种情况下，缩略图的较大维度可能会更接近\
  \ 100 像素。\n\n***\n\n**提示**\n\n你的图形软件很可能在图像窗口本身的某处有一个无处不在的尺寸显示。在 GIMP 中，可以在窗口顶部查看当前图像尺寸。其他程序可能会在右下角或左下角显示。你可能还会看到窗口中的放大倍率以及更改它的功能（通过放大或缩小）。\n\
  \n***\n\n### 调整图像尺寸\n\n更改图像尺寸所需的精确工具取决于你正在使用的程序。在 GIMP 中，转到 `Image`（图像）菜单并点击 `Scale\
  \ Image`（缩放图像）打开 `Scale Image` 对话框（参见图 8.5）。\n\n**图 8.5** 使用 `Scale Image` 对话框更改图像尺寸。\n\
  \n![image](img/08fig05.jpg)\n\n你几乎总是使用现有宽高比来调整大小，这意味着当你输入想要的图像宽度时，高度将自动计算（反之亦然），以防止图像变形。在\
  \ GIMP 中，宽高比默认是锁定的，如图 8.5 所示，`Width`（宽度）和 `Height`（高度）选项旁显示的链链所示。点击一次链条即可解锁，允许你指定自己选择的像素宽度和高度——无论是否变形。\n\
  \n***\n\n**注意**\n\n与 GIMP 中的许多功能一样，`Scale Image` 对话框会出现在正在调整尺寸的图像所在的窗口前面。这种布局允许你能够在对话框中进行更改、应用更改并立即看到结果。\n\
  \n***\n\n在大多数（如果不是所有）图形程序中，你还可以根据百分比调整图像尺寸，而不是提供特定的像素尺寸。例如，如果我的图像初始尺寸为 `1629×1487`，而我不想通过计算来确定将其显示为一半宽度所需的数值，我只需选择\
  \ `Percent`（在此例中，从图 8.5 所示的像素显示旁边的下拉菜单）并将默认设置（`100`）更改为 `50`。图像宽度将变为 `815` 像素，高度为\
  \ `744`——我不需要不需要进行任何计算。\n\n### 调整图像颜色\n\n如果你正在编辑照片而不是创建自己的图形，你可能需要使用一些色彩校正工具来让照片达到完美状态。像许多图像编辑程序一样，GIMP\
  \ 提供了多种调整图像亮度、对比度和色彩平衡的选项，以及一个用于减少讨厌的红眼的滤镜。要使用 GIMP 去红眼，转到 `Filters`（滤镜），点击 `Enhance`（增强），然后点击\
  \ `Red Eye Removal`（去红眼）。\n\n大多数选项都非常直观。如果你想让图像更亮，就调整亮度。如果你想让图像中有更多红色，就调整色彩平衡。在\
  \ GIMP 中，`Colors`（颜色）菜单让你能够访问许多工具。与上一节描述的 `Scale Image` 对话框一样，每个工具都会在工作区的前景显示一个对话框。当你调整颜色时，图像会反映这些变化。这种预览功能是一项特性。图\
  \ 8.6 显示 `Adjust Hue/Lightness/Saturation`（调整色调/亮度/饱和度）工具，这是 `Colors` 菜单提供的工具之一。如图所示，通过对话框中的滑块进行许多色彩变化。`Preview`（预览）功能允许你在操作时看到效果。`Reset\
  \ Color`按钮将颜色恢复到原始状态。\n\n**图 8.6** `Adjust Hue/Lightness/Saturation` 工具是 GIMP 中提供的基于滑块的颜色修改工具之一。\n\
  \n![image](img/08fig06.jpg)\n\n由于你有许多工具且每个工具都有预览功能，一些有趣的实验是了解工具作用的最佳方法。\n\n### 控制\
  \ JPEG 压缩\n\n网页上的照片以 JPEG 格式保存比 GIF 更好；JPEG 允许你在保留文件中色彩的同时，将整体文件大小保持在可接受范围内。当你完成照片尺寸和外观调整后，选择\
  \ `File`（文件）、`Save As`（另存为）并将 `JPEG` 作为文件类型。你的图形程序很可能会为你提供另一个对话框，通过你可以控制各种 JPEG\
  \ 选项，例如压缩。\n\n图 8.7 显示了你在 GIMP 中保存 JPEG 时看到的 `Save as JPEG` 对话框。你可以看到通过调整 `Quality`（质量）滑块在\
  \ `1`（低质量，小文件大小）到 `100`（高质量，大文件大小）之间控制保存 JPEG 文件的压缩率。\n\n**图 8.7** GIMP 允许通过以 JPEG\
  \ 格式保存来减小文件大小，同时保留图像质量。\n\n![image](img/08fig07.jpg)\n\n你可能想要实验一下不同的 JPEG 压缩级别如何影响你的图像质量，但\
  \ 85% 的质量（或 15% 的压缩）对于大多数照片来说，是在文件大小（以及下载速度）和质量之间很好的折中。\n\n### 创建横幅和按钮\n\n从头创建的图形（如横幅和按钮）需要你考虑与照片完全不同的考虑量。\n\
  \n\n\n\n当你制作横幅或按钮时，需要做出的第一个决定是它的尺寸。现在大多数访问网页的用户拥有的电脑屏幕分辨率至少为 1024×768 像素，甚至更大。例如，我的屏幕目前设置为\
  \ 1440×900 像素。通常情况下，你应该对你的图形进行规划，使它们始终能够适应较小的屏幕（1024×768），并为滚动条和边距留出空间。关键的尺寸限制是页面的水平宽度，因为水平滚动页面对于网页用户来说是一个巨大的麻烦，也是困惑的源头。垂直滚动页面要接受得多，所以即使你的页面比最小屏幕尺寸高，也没关系。\n\
  \n**提示**\n多年来，针对 800×600 屏幕分辨率进行设计一直是常态。但仍然记住这个低数值，因为许多人并没有以全屏模式打开应用程序。然而，针对 1,024×768\
  \ 基准屏幕分辨率进行设计并不是一个坏主意。\n\n假设你的目标最小分辨率是 800×600 像素，那么全尺寸的横幅和标题图形宽度不应超过 770 像素，高度不超过\
  \ 430 像素，这是在考虑到滚动条、工具栏和浏览器窗口的其他部分后页面的最大可见区域。在页面内，普通的照片和艺术品每个维度都应该是 100 到 300 像素，而较小的按钮和图标的高度和宽度应在\
  \ 20 到 100 像素之间。显然，如果你为 1024×768 分辨率设计，你就有更多的屏幕“空间”可以操作，但横幅、按钮和其他辅助图形的尺寸指南仍然有效。\n\
  \n在 `GIMP` 中创建新图像，转到 `File` 并选择 `New`。显示 `Create a New Image` 对话框（见图 8.8）。如果你不确定图像需要多大，只需接受\
  \ `640×480` 的默认尺寸。或者你你可以在 `Template` 下拉列表中选择其他预定义的尺寸之一，例如 `Web banner common 468×60`\
  \ 或 `Web banner huge 728×90`。这两个设置确实被认为是网站横幅的“常见”和“巨大”尺寸。否则，输入新图像的宽度和高度。\n\n**图\
  \ 8.8** 在开始工作之前，你需要决定图像的尺寸。\n\n![image](img/08fig08.jpg)\n\n对于图像的背景颜色，你应该选择白色，以匹配大多数网络浏览器为网页使用的背景（尽管正如你在上一节中学到的，那种颜色是可以更改的）。当你知道你将创建一个具有白色以外背景的页面时，你可以为你的图像选择不同的背景颜色。或者你可能想创建一个完全没有背景的图像，在这种情况下，你将选择\
  \ `Transparency` 作为背景颜色。当图像背景透明透明时，图像背后的网页允许透过图像的这些区域显示。在 `GIMP` 中，通过打开 `Create\
  \ a New Image` 对话框中的 `Advanced Options` 来为你的新图像选择背景颜色。\n\n当你以像素为单位输入图像的宽度和高度并点击\
  \ `OK` 时，你面对的是空白画布——如果你像我们大多数人一样恐视艺术，那是一个令人畏惧的景象！然而，由于有许多图像创建教程（更不用说整本书）可以引导你完成整个过程，我放心地让你自己发挥。本节完全是为了向你介绍在为网站创建图形时需要记住的事项。本节并不一定教你具体该如何做，因为熟悉`你`所选择的工具是掌握它们的第一步。\n\
  \n### 减少图像中的颜色数量\n\n减少图像尺寸（因此缩短下载时间）最有效的方法之一是减少图像中使用的颜色数量。这可以极大地降低某些照片图像的视觉质量，但对于大多数横幅、按钮和其他图标效果非常好。\n\
  \n你会很高兴地知道，对于颜色数量有限的图像，有一种特殊的文件格式；它被称为 `Graphics Interchange Format (GIF)`。当你将图像保存为\
  \ `GIF` 时，系统可能会提示你合并图层或通过转换为索引图像来减少颜色数量，因为这些是 GIF 的要求，如图 8.9 所示。对话框只会要求你确认保存过程将为你执行的这些更改——目前不必担心理解这些选项，但请阅读你软件关于图层和索引颜色的帮助文件以获得充分理解。\n\
  \n**图 8.9** 在将图像保存为 `GIF` 时，你可能会被提示将其转换为索引调色板。\n\n![image](img/08fig09.jpg)\n\n\
  **提示**\n`Dithering`（抖动）是图像编辑程序使用的一种技术，通过交替两种相似色的像素来模拟调色板中不存在的颜色。例如，抖动处理过的粉红色由交替的红色像素和白色像素组成，这将产生粉色的整体印象。在某些情况下，抖动可以让图像看起来更好，但在网页图形中通常应该避免。为什么呢？它大幅增加了图像的信息复杂性，这通常会导致文件体积大得多。\n\
  \n**提示**\n记住，`GIF` 图像格式用于包含纯色区域的图像，例如网页标题和其他插图；`GIF` 格式不适合照片。`PNG`（读作“ping”）是另一种所有主流网络浏览器都支持的有用格式。\n\
  \n### 使用透明图像\n\n你可能见过某些网站在容器元素中使用背景颜色或图像，但在前景中也有允许背景透出的图像。在这种情况下，前景中的图像具有透明区域，因此设计并非发生在画布上。你可能经常想要使用这些半透明图像，以便在可能存在的任何背景颜色或背景图像上使图形良好。\n\
  \n要使图像的一部分透明，必须将图像保存为 `GIF` 或 `PNG` 格式。正如本章前面提到的，大多数支持 `GIF` 格式的图形程序允许指定一种颜色为透明，而\
  \ `PNG` 图像允许不同程度的透明。\n\n创建透明图像的过程取决于你创建的图像类型（`GIF` 或 `PNG`）以及你用来创建图形软件。有关说明，请查看你图形程序的帮助文件，或在搜索引擎中输入\
  \ **transparent images with [你的程序]**。\n\n### 创建平铺背景\n\n任何 `GIF` 或 `JPEG` 图像都可以作为容器元素内的背景平铺。然而，在你去创建平铺背景之前，特别是复杂的图案平铺背景之前，问问自己那个平铺背景对你网站的整体视觉效果增加了什么，更重要的是，问问自己当文本放在图案之上时，网站文字是否易于阅读。\n\
  \n\n\n想一下你每天访问的网站，你会发现很少有网站在整个页面使用平铺的、带图案的背景。如果你将浏览限制在公司、产品、运动队或其他以信息（主要是文本）为核心的网站上，那么带有平铺图案背景的网站数量会更少。尽管\
  \ Web 赋予了每个人设计上的个性化权利，但如果你正在为自己的业务创建一个网站，你可能希望避免使用具有对比颜色文本的复杂图案背景。\n\n如果你确实为整个网站使用了平铺的图案背景图像，请记住，只有当你看不出它们是平铺的时，效果才最好。换句话说，当你发现背景块的顶边缘与底部无缝衔接，左边缘与右边缘匹配时，就说明你有一张很好的图片。\n\
  \n图 8.10 和 8.11 显示了背景平铺的应用，两者都使用了无缝背景，但效果程度各异。\n\n**图 8.10** 这是一个无缝背景图像的示例，你可以看出背景是平铺的，因为你可以看到六个完全相同的形状。\n\
  \n![image](img/08fig10.jpg)\n\n**图 8.11** 这也是一个无缝背景图像的示例，只是你看不出平铺的。\n\n![image](img/08fig11.jpg)\n\
  \n在本章的后续部分，你将学习如何将背景图像放置在容器元素中。尽管我在本节中做出了警告，但实际上，背景图像可以成为你设计武器库中的强大武器——只是作为整个页面的背景使用。\n\
  \n* * *\n\n提示\n\n如果你真的想使用背景平铺，但似乎无法得到你想要的图案，你可以查看互联网上提供的数百个网站，它们提供公有领域的背景图像，这些图像既免费或廉价，又经过了专业设计。\n\
  \n* * *\n\n### 创建动画网页图形\n\nGIF 图像格式允许你创建动画图像，用于添加一些运动效果为任何网页增添色彩。动画 GIF 的传输速度也比大多数用于类似效果的视频或多媒体文件快得多。通过\
  \ GIMP，你可以在图像中创建多个层来创建动画 GIF，然后在保存文件时修改动画 GIF 选项。此外，如果你有一系列想要制作成动画的图像，可以使用 Gickr\
  \ 提供的免费在线 GIF 动画服务（[`www.gickr.com/`](http://www.gickr.com/)）。\n\n创建 GIF 动画的第一步是创建一系列连续显示的图像——或者一系列层，取决于你具体的软件程序。这些图像中的每一个被称为\
  \ `frame`（帧）。顺便说一下，`frame` 一词的使用与你在第 20 章“使用窗口和框架”中学习的 `frames` 完全没有关系。相反，请把这些帧想象成电影或动画片的组合方式——你在屏幕上看到的图像是由许多外观有细微差异的单个帧组成的。一旦你脑海中有了这些帧，将它们连接在一起的过程相对简单——最困难的是规划阶段。花些时间用分镜脚本的形式画出这些帧，特别是如果你计划的不仅仅几帧的话。当你知道你的帧将如何组合后，使用本节之前提到的\
  \ Gickr 服务，或阅读你图形软件的文档，以学习其整合所有内容的特定流程。\n\n* * *\n\n### 动手尝试：为网站准备图像\n\n你现在应该准备好两三张图像，以便在学习本章剩余内容时，尝试将它们放在自己的页面上。如果你已经保存了一些\
  \ GIF、PNG 或 JPEG 格式的图像文件（文件名以 `.gif`、`.png` 或 `.jpg` 结尾），请使用它们。使用你在阅读上一节时创建的任何图形也是可以的。\n\
  \n搜索引擎（如 Google）可以通过引导你访问与自己主题相关的网站，成为图像的金矿。搜索引擎还可以帮助你发现大量专门提供免费且廉价的可用媒体集合的网站。此外，不要忘记微软\
  \ Office Online Clip Art and Media 网站上巨大的剪贴库，地址位于 [`office.microsoft.com/clipart/`](http://office.microsoft.com/clipart/)。其他价值源还包括\
  \ Google Images ([`images.google.com/`](http://images.google.com/)) 和 Flickr ([`www.flickr.com`](http://www.flickr.com))——寻找使用\
  \ Creative Commons 许可且允许署名后免费使用的图像。\n\n* * *\n\n### 在网页上放置图像\n\n要在网页上放置图像，首先将图像文件移动到与\
  \ HTML 文件相同的文件夹中，或者命名为 `images` 的目录中以便于组织。\n\n在文本中你想让图像出现插入以下 HTML 标签。使用你的图像文件名代替\
  \ `myimage.gif`：\n\n```html\n<img src=\"myimage.gif\" alt=\"My Image\" />\n```\n\
  \n* * *\n\n注意\n\n你将图像放在哪里对 Web 服务器、Web 浏览器或最终用户来说并不重要，只要你知道它们在哪里，并且在 HTML 代码中使用了正确的路径即可。\n\
  \n* * *\n\n如果你的图像文件位于文档根目录下的 `images` 目录，你应该使用：\n\n```html\n<img src=\"images/myimage.gif\"\
  \ alt=\"My Image\" />\n```\n\n\n\n理论上，你可以在自己的页面中包含来自任何网站的图像。在这种情况下，每当你的页面显示时，图像都会从另一个页面的\
  \ Web 服务器上检索。你可以这样做，但你不应该这样做！这不仅是一种不礼的行为，因为你正在利用他人的带宽来获取个人利益，而且可能会让你的页面显示速度变慢。你也无法控制图像何时可能被更改或删除。\n\
  \n如果你被许可重新发布另一个网页上的图像，请务必将该图像的副本传输到你的计算机，并使用本地文件引用，例如 `<img src=\"myimage.jpg\"\
  \ />`，而不是 `<img src=\"http://www.otherserver.com/theirimage.jpg\" />`。然而，如果你将图像（如照片）托管在专门作为图像存储库的服务上，例如\
  \ Flickr ([`www.flickr.com/`](http://www.flickr.com/))，则此建议并不适用。像 Flickr 这样的服务为每张图像提供一个\
  \ URL，且每个 URL 的地址中包含 Flickr 的域名。\n\n***\n\n如果你猜 `img` 代表 image（图像），你是对的。`src` 代表\
  \ source（源），它是对图像文件位置的引用。正如本书开头所讨论的，图像始终存储在与文本分离的文件中，即使在浏览器查看时它似乎是同一个页面的一部分。\n\n\
  就像用于超链接的 `<a href>` 标签一样，你可以在 `<img />` 标签的 `src` 属性中指定任何完整的 Internet 地址。或者，如果图像与\
  \ HTML 文件位于同一个文件夹中，你可以仅指定文件名。你还可以使用相对地址，例如 `/images/birdy.jpg` 或 `../smiley.gif`。\n\
  \n### 使用文本描述图像\n\nListing 8.2 中的每个 `<img />` 标签都包含一条短消息，例如 `alt=\"Half Dome\"`。`alt`\
  \ 代表 alternate text（备用文本），当图像本身无法加载时，显示在图像位置处的消息。如果地址错误、用户在 Web 浏览器偏好中关闭了自动下载图像，或者\
  \ Internet 连接非常缓慢且数据尚未传输完成，图像可能无法加载。图 8.13 显示了替代图像的 `alt` 文本示例。\n\n**图 8.13** 当图像未出现时，用户将看到\
  \ `alt` 消息。\n\n![image](img/08fig13.jpg)\n\n即使图形已完全加载并在 Web 浏览器中可见，每当鼠标指针经过图像时，`alt`\
  \ 消息通常也会出现在一个小框（称为工具提示）中。`alt` 消息还可以帮助任何视觉障碍用户（或正在使用语音界面读取网页的用户）。\n\n你必须在 Web 上的每个\
  \ `<img />` 标签中包含一个合适的 `alt` 属性，考虑到人们看到该消息的各种情况。对图像进行简短描述通常是最好的，但网页作者有时会在 `alt`\
  \ 消息中放入简短的广告信息或微妙的幽默；然而，幽默过多而信息不足是不受欢迎的。对于小型或不重要的图像，完全省略 `alt` 消息是很具有吸引力的，但它是 `<img\
  \ />` 标签的必选属性。这并不意味着你的页面将无法正常显示，但这意味着你违反了最新的 XHTML 标准。如果你绝对不需要它，我建议为 `alt` 分配空文本消息（`alt=\"\
  \"`），这对于小型或装饰性图像有时是需要的。\n\n`title` 属性不是 `<img />` 标签要求的，但它的功能与 `alt` 属性类似；事实上，如果两个属性存在，`title`\
  \ 属性将取代 `alt` 属性作为工具提示。知道这一点，通过文本描述图像的最佳方法是同时使用 `alt` 属性和 `title` 属性，就图像提供相关的注释或提示，你认为这些信息在作为工具提示或通过屏幕阅读器软件查看时可能有用。\n\
  \n### 指定图像的高度和宽度\n\n由于文本在 Internet 上的传输速度比图形快得多，大多数 Web 浏览器会在显示图像之前显示页面上的文本。这让用户在等待图片显示时有东西读，使得整个页面看起来加载更快。\n\
  \n通过显式指定每个图像的高度和宽度，你可以确保页面上的所有内容都能尽可能快地出现在正确的位置。这样，Web 浏览器在布局页面以及等待图像传输完成时，就可以立即准确地为每个图像留出空间。\n\
  \n对于你想包含在网站中的每张图像，你可以使用图形程序确定其精确的像素高度和宽度。你也可以通过系统工具找到这些图像属性。例如，在 Windows 中，你可以通过右键点击图像、选择“属性”，然后选择“详细信息”来查看图像的高度和宽度。知道图像的高度和宽度后，你可以在\
  \ `<img />` 标签中包含这些尺寸，如下：\n\n```html\n<img src=\"myimage.gif\" alt=\"Fancy Picture\"\
  \ width=\"200\" height=\"100\" />\n```\n\n***\n\n**提示**\n\n为图像指定的的高度和宽度不需要与图像的实际高宽度匹配。Web\
  \ 浏览器会尝试压缩或拉伸图像，以显示你指定的任何尺寸。但是……\n\n\n\n\n\n酋长岩（El Capitan）是塞罗米国家公园内一个高 3000 英尺（910\
  \ 米）的垂直岩石，位于塞罗米山谷北侧，靠近西端。这座巨大的花岗岩单体是世界上岩岩登山者最喜爱的挑战之一。1851 年，马里波萨团（Mariposa Battalion）在探索该山谷时将其命名为“酋长岩”。\n\
  \n隧道景观（Tunnel View）是 41 号州道上的一个观景点，从南方进入塞罗米山谷时，位于瓦奥纳隧道（Wawona Tunnel）正东侧。该视野可以东望塞罗米山谷，包括酋长岩的西南面、半圆顶（Half\
  \ Dome）和婚纱瀑布（Bridalveil Falls）。对许多人来说，这是对塞罗米热门景点的初印象。\n\n### 注意\n请注意 Listing 8.3\
  \ 中使用的两个 `<img/>` 标签样式属性中添加的内边距（padding）。这种内边距在图像和文本之间提供了一些留白——图像四周各 6 像素。你将在第 9\
  \ 章](#ch09.html_ch09)“处理边距、内边距、对齐和浮动](#ch09.html_ch09)”中学习更多关于内边距的知识。\n\n## 图像垂直对齐\n\
  有时，你可能想在行文本中间插入一个小图像；或者可以在图像旁边放置单行文本作为注释。无论哪种情况，控制文本和图像如何垂直对齐都会非常方便。图片的底部应该与字母的底部对齐，还是让文本和图像都按中间位置对齐？你可以在这些和其他几个选项之间进行选择：\n\
  \n- 要使图像顶部与同一行中最高的图像或字母顶部对齐，请使用 `<img style=\"vertical-align:text-top\" />`。\n-\
  \ 要使图像底部与文本底部对齐，请使用 `<img style=\"vertical-align:text-bottom\" />`。\n- 要使图像中间与行内元素的垂直中心对齐，请使用\
  \ `<img style=\"vertical-align:middle\" />`。\n- 要使图像底部与文本的基线（baseline）对齐，请使用 `<img\
  \ style=\"vertical-align:baseline\" />`。\n\n### 注意\n`vertical-align` 样式属性也支持 `top`\
  \ 和 `bottom` 值，它们可以忽略行上的任何文本，将图像与行元素的整体顶部或底部对齐。\n\n这四个选项都用在 Listing 8.4 中，并在 Figure\
  \ 8.15 中显示。四张缩略图现在垂直排列在页面上，每张图像旁边都有描述性文本。通过 `vertical-align` 样式属性的各种设置来对齐每个图像及其相关文本。\n\
  \n**图 8.15** 显示了 Listing 8.4 中使用的图像垂直对齐选项。\n\n![image](img/08fig15.jpg)\n\nListing\
  \ 8.4 使用 `vertical-align` 样式对齐文本与图像\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>Small\
  \ But Mighty Spectacular Yosemite Views</title>\n</head>\n<body>\n  <h1>Small But\
  \ Mighty Yosemite Views</h1>\n  <p><img src=\"elcap_sm.jpg\" alt=\"El Capitan\"\
  \ width=\"100\" height=\"75\" style=\"vertical-align:text-top;/><strong>El Capitan</strong>\
  \ 是塞罗米国家公园内一个高 3,000 英尺（910 米）的垂直岩石。</p>\n  <p><img src=\"tunnelview_sm.jpg\" alt=\"\
  Tunnel View\" width=\"100\" height=\"80\" style=\"vertical-align:text-bottom;/><strong>Tunnel\
  \ View</strong> 向东望塞罗米山谷。</p>\n  <p><img src=\"upperyosefalls_sm.jpg\" alt=\"Upper\
  \ Yosemite Falls\" width=\"87\" height=\"100\" style=\"vertical-align:middle;/><strong>Upper\
  \ Yosemite Falls</strong> 高达 1,430 英尺，是世界上最高的二十瀑布之一。</p>\n  <p><img src=\"hanging_sm.jpg\"\
  \ alt=\"Hanging Rock\" width=\"100\" height=\"75\" style=\"vertical-align:baseline;/><strong>Hanging\
  \ Rock</strong> 位于冰川点（Glacier Point），曾是人们悬挂的热门景点。</p>\n</body>\n</html>\n```\n\n\
  ## 提示\n如果不在 `<img />` 标签中包含任何 `align` 属性，则图像的底部将与其旁任何文本的基线对齐。这意味着你实际上不需要输入 `style=\"\
  vertical-align:baseline\"`，因为这是默认假设的。然而，如果你为图像指定了外边距（margin）并希望对齐与文本非常精确，你可能想显式将\
  \ `vertical-align` 属性设置为 `text-bottom`。查看 Figure 8.15 中的最后一张图像。\n\n## 将图像转换为链接\n\
  你可能在 Figure 8.12 中注意到，页面上的图像很大，这当你试图让图像与文本对齐时是不理想的。在这种情况下，使用缩略图来提供更大版本是合理的。为了将任何图像转换为可点击的链接，你可以使用\
  \ `<a>` 标签，正如 Listing 8.5 所示，这包含了对 Listing 8.3 的修改——使用缩略图是为了让用户看到更大的版本。如 图 8.16\
  \ 所示，由于 `baseline` 设置，图像会略低于文本。这在某些特定情况下提供更大版本的情况下是合理的。\n\n\n\n\n\n从南部进入约瑟米地谷时，可以远眺位于\
  \ `Wawona Tunnel` 正东侧的 `State Route 41` 景观。视野向东望向约瑟米地谷，包括 `El Capitan` 的西南面、`Half\
  \ Dome` 和 `Bridalveil Falls`。对许多人来说，这是对约瑟米公园热门景点的首次印象。\n\n***\n\n`Listing 8.5` 中的代码使用了额外的样式，这些样式将在后面的章节中进行详细解释，但你应该能够理解其基本用法：\n\
  \n- `<a>` 标签将这些特定的图像链接到更大的版本，在这种情况下，这些版本存储在外部服务器上（位于 Flickr）。\n- `<<div>><<div>>`\
  \ 标签及其样式用于对齐这些组图形和说明文字（并包含一些内边距）。\n\n除非另有说明，否则网页浏览器会在每个图像链接的边缘显示一个彩色矩形。与文本链接一样，矩形通常对最近未访问过的链接显示为蓝色，对最近访问过的显示为紫色——除非你在样式表中指定了不同颜色的链接。因为你很少、甚至根本不想在链接的图像周围出现这条丑陋线，所以通常应该在链接中的任何\
  \ `<img />` 中包含 `style=\"border:none\"`。在这种情况下，`border:none` 样式成为了 `img` 元素样式表项的一部分，因为我们使用了两次相同的样式。\n\
  \n当你点击示例页面上的缩略图之一时，链接会在浏览器中打开，如 `Figure 8.17` 所示。\n\n**图 8.17** 点击链接的缩略图将打开链接的目标。\n\
  \n![image](img/08fig17.jpg)\n\n### 使用背景图像\n\n正如你在本章前面的部分学到的，可以使用背景图像作为容器元素中的某种壁纸，使文本或其他图像显示在底层设计之上。\n\
  \n协同工作创建背景的基础样式属性如下：\n\n- `background-color`——指定元素的背景颜色。虽然与图像无关，但它是背景相关属性集的一部分。\n\
  - `background-image`——使用以下语法指定作为元素背景的图像：`url('imagename.gif')`。\n- `background-repeat`——指定图像在水平和垂直方向上的重复方式。默认情况下（不指定任何内容），背景图像将沿水平和垂直方向重复。其他选项有\
  \ `repeat`（与默认相同）、`repeat-x`（水平）、`repeat-y`（垂直）和 `no-repeat`（图形出现一次）。\n- `background-position`——指定图像相对于容器的初始位置。选项包括\
  \ `top-left`、`top-center`、`top-right`、`center-left`、`center-center`、`center-right`、`bottom-left`、`bottom-center`、`bottom-right`\
  \ 以及特定的像素和百分比位置。\n\n指定背景图像时，你可以将所有规格组合在一个属性中，如下：\n\n```\nbody {\n    background:\
  \ #ffffff url('imagename.gif') no-repeat top right;\n}\n```\n\n在之前的样式表项中，网页的 `body`\
  \ 元素是白色并在右上角包含名为 `imagename.gif` 的图形。`background` 属性的另一个用途是为无序列表创建自定义符号。要使用图像作为符号，首先按如下方式定义\
  \ `<ul>` 标签的样式：\n\n```\nul {\n    list-style-type: none;\n    padding-left: 0;\n\
  \    margin-left: 0;\n}\n```\n\n接下来，将 `<li>` 标签的声明改为：\n\n```\nli {\n    background:\
  \ url(mybullet.gif) left center no-repeat\n}\n```\n\n确保 `mybullet.gif`（或你为图形指定的名称）位于网络服务器上并可以访问；在这种情况下，所有无序列表项将显示你的自定义图像，而不是标准的实心圆点。\n\
  \n当我们使用 CSS 进行整体页面布局时，将在 `Part III`、`Advanced Web Page Design with CSS` 中返回背景属性的具体用法。\n\
  \n### 使用图像映射 (Imagemaps)\n\n有时你可能想使用图像作为导航，而不仅仅是网站中常见的简单的基于按钮或基于链接的导航。例如，可能你有一个提供医疗信息的网站，你想显示一张人体图像，并链接到提供各个身体部位信息的页面。或者，你有一个提供世界地图的网站，用户可以点击地图来访问有关国家的信息。你可以根据用户在图像内点击的位置，将图像划分为链接到不同文档的区域。这被称为*图像映射\
  \ (imagemap)*，任何图像都可以制作图像映射。\n\n### 为什么图像映射并非总是必要的\n\n关于图像映射，你应该了解的第一点是，除非在非常特殊的情况下，否则你可能不需要使用它们。使用几个直接相邻的普通图像并为每个图像提供单独的链接通常更简单、更高效。\n\
  \n例如，参见 `Figure 8.18`。这是一个显示 12 个不同公司 Logo 的网页；这种示例是商业世界中常见的网页类型，用户可以在其中点击以访问有关国家的信息。你可以将图像划分为链接到不同文档的区域，取决于用户在图像内点击的位置。这被称为*图像映射\
  \ (imagemap)*，任何图像都可以制作图像映射。\n\n**图 8.17** 点击链接的缩略图将打开链接的目标。\n\n![image](img/08fig17.jpg)\n\
  \n### 在图像内映射区域\n\n要创建任何类型的图像映射，你需要确定图像中你想转换为可链接的每个区域的数值像素坐标。这些可链接也被称为*区域 (areas)*。你的图形程序可能为你提供查找这些坐标的简单方法。或者你可能想使用独立的图像映射工具，如\
  \ `Mapedit` 或在线工具 `image-maps.com`。除了帮助你映射坐标外，这些工具提供了制作映射工作所需的 HTML 代码。\n\n使用图像映射工具通常简单如使用鼠标在你想要链接的区域周围画一个矩形（或自定义形状）。`Figure\
  \ 8.20` 显示了这些矩形选择之一的结果，以及添加 URL 和链接标题或替代文本的界面。创建图像映射 HTML 需要若干信息：坐标、目标 URL、链接标题以及替代文本。\n\
  \n**图 8.20** 使用图像映射工具创建单个图形的链接区域。\n\n![image](img/08fig20.jpg)\n\n### 动手尝试：创建你自己的图像映射\n\
  \n如果你在继续学习本章时获取自己的图像并将其转换为图像映射，你可能会记住如何制作图像映射：\n\n- 作为开始，选择一个在视觉上划分为大致矩形区域的大尺寸图像是最简单的。\n\
  \n\n\n\n\n- 如果你手头没有合适的图片，可以使用你最喜欢的图形程序制作一张。也许可以使用一张显示有几个人的照片，并将每个人都用作图像映射（imagemap）的一个区域。\n\
  - 尝试几种不同的图像映射工具，以确定你最喜欢哪一个。从独立软件开始，如 MapEdit ([`www.boutell.com/mapedit/`](http://www.boutell.com/mapedit/))，然后转向\
  \ [`www.image-maps.com/`](http://www.image-maps.com/) 上的图像映射制作器。还有其他工具；使用你喜欢的搜索引擎查找图像映射软件主题的其他变。\n\
  \n***\n\n### 为图像映射创建 HTML\n\n如果你使用图像映射生成器，你已经拥有了创建图像映射所需的 HTML。然而，了解代码的各个部分是一个好习惯，你可以检查其准确性。启动任何图像映射都需要以下\
  \ HTML 代码：\n\n```html\n<map name=\"mapname\">\n```\n\n请记住，你可以为 `<map>` 标签的 `name`\
  \ 属性使用任何 way 名称，尽管尽可能具有描述性会有帮助。接下来，你需要为图像的每个区域提供一个 `<area />` 标签。以下是一个在映射映射示例中使用的单个\
  \ `<area />` 标签示例：\n\n```html\n<area shape=\"rect\" coords=\"100,136,116,152\" href=\"\
  http://www.whitmancounty.org/\" alt=\"Whitman County, WA\" title=\"Whitman County,\
  \ WA\" />\n```\n\n此 `<area />` 标签有五个属性，你将在描述每个区域时使用它们：\n\n- `shape` 表示区域是矩形（`shape=\"\
  rect\"`）、圆形（`shape=\"circle\"`）还是不规则多形（`shape=\"poly\"`）。\n- `coords` 给出区域的精确像素坐标。对于矩形，给出左上角的\
  \ `x,y` 坐标，然后是右下角的 `x,y` 坐标。对于圆形，给出 `x,y` 中心点，然后是半径。对于多形，按连点成线的顺序列出所有顶点的 `x,y` 坐标。\n\
  - `href` 指定区域链接到的页面。你可以使用在普通 `<a>` 标签中使用的任何地址或文件名。\n- `alt` 允许你提供与形状关联的文本。大多数浏览器（除\
  \ Firefox 外）当用户将鼠标悬停在形状上时会在小框中显示此文本。此文本为那些可能没有意识到自己正在查看图像映射的用户提供了微妙但重要的提示。Firefox\
  \ 除了使用 `alt` 属性外，还正确使用了 `title` 属性提供视觉提示，正如本章前面提到的，你应该同时使用两者。\n\n图像映射中的每个不同点击区域都必须描述为单个区域，这意味着一个典型的图像映射由区域列表组成。在编写\
  \ `<area />` 标签后，你就完成了图像映射的定义，因此用结束标签 `</map>` 完成。创建图像映射的最后一步是将其连接到实际地图。使用普通的 `<img>`\
  \ 标签将地图放在页面上。然而，有一个额外的 `usemap` 属性，代码如下：\n\n```html\n<img src=\"map.png\" usemap=\"\
  #countymap\" style=\"border:none; width:650px; height:509px\" alt=\"Native Peoples\
  \ Map\" />\n```\n\n在指定 `usemap` 属性的值时，使用你在 `<map>` 标签的 `id` 中放入的名称（不要忘记 `#` 符号）。还要包含\
  \ `style` 属性以指定图像的高度和宽度，并关闭图像映射周围的边框，你可能选择在自己的图像映射中保留它。列表 8.6 显示了包含地图图形、其图像映射和几个映射区域的示例网页的完整代码。\n\
  \n### 列表 8.6 使用 `<map>` 和 `<area />` 标签定义图像映射的区域\n\n***\n\n```html\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n<head>\n  <title>Testing an Imagemap</title>\n</head>\n<body>\n\
  \  <h1>Testing an Imagemap</h1>\n  <p style=\"text-align:center\">点击标志进入该县的网站。<br/>\n\
  \  <img src=\"map.png\" usemap=\"#countymap\" style=\"border:none; width:650px;height:509px\"\
  \ alt=\"Native Peoples Map\" /></p>\n  <map name=\"countymap\" id=\"countymap\"\
  >\n    <area shape=\"rect\" coords=\"100,136,116,152\" href=\"http://www.whitmancounty.org/\"\
  \ alt=\"Whitman County, WA\" title=\"Whitman County, WA\" />\n    <area shape=\"\
  rect\" coords=\"29,271,42,283\" href=\"http://www.sccgov.org/\" alt=\"Santa Clara\
  \ County, CA\" title=\"Santa Clara County, CA\" />\n    <area shape=\"rect\" coords=\"\
  535,216,548,228\" href=\"http://visitingmifincounty.com/\" alt=\"Mifflin County,\
  \ PA\" title=\"Mifflin County, PA\" />\n  </map>\n</body>\n</html>\n```\n\n***\n\
  \n***\n\n### 注意\n\n如果你是一个注重细节的人，你可能注意到（查看代码的前几行）——此网页被编码为 XHTML 1.0 文档，而不是书中大多数其他示例使用的\
  \ XHTML 1.1。这样做是因为某些浏览器（例如 Internet Explorer）在支持图像映射使用方法的单一 XHTML 1.1 变化方面落后了。这一变化专门针对\
  \ `usemap` 属性，在 XHTML 1.1 中，它不需要在地图名前加上 `#` 符号。事实上，#` 符号在 XHTML 1.1 中是不允许的。然而，#`\
  \ 符号在 XHTML 1.0 中是要求的。\n\n***\n\n***\n\n图 8.1 显示了运行中的图像映射。注意 `alt` 和 `title` 属性提供的视觉提示。\n\
  \n![image](img/08fig1.jpg)\n\n\n\n\n\n- 互联网上的大部分材料都是免费的。当然，向内容的作者或当前所有者进行双重检查仍然是一个好主意；你不想因为侵犯版权而被起诉。此外，美国政府的各个机构产生的内容根据法律规定属于所有美国人。（例如，在网上找到的任何\
  \ `NASA` 视频片段均可供你免费使用。）\n\n- 许多搜索引擎（[google.com](http://google.com)、[yahoo.com](http://yahoo.com)、[bing.com](http://bing.com)\
  \ 等）都具有寻找多媒体文件的特定搜索功能。只要你注意版权问题，这就可以成为寻找与特定主题相关的多媒体文件的简单方法。简单搜索 `sample Flash animations`、`sample\
  \ QuickTime movie` 或 `sample audio files` 就会产生多到你无法处理的结果。\n\n- 如果你很有创作倾向，请确定你最喜欢的媒介——对于你中的一些人来说，这可能是视频制作，另一些人可能喜欢音频制作，而还有人可能想尝试动画。在确定了起点后，研究各种能够让你创作出此类艺术杰作的软件类型。许多公司提供多媒体软件，例如\
  \ Adobe ([`www.adobe.com/`](http://www.adobe.com/)) 和 Apple ([`www.apple.com/`](http://www.apple.com/))。\n\
  \n## 链接多媒体文件\n\n将视频或音频文件整合到你的网站中最简单且可靠的方法是直接使用 `<a href>` 将其链接，就像你链接到另一个 HTML 文件一样。\n\
  \n***\n\n### 注意\n\n无论本章中显示的特定媒体类型是什么，无论你选择哪种媒体格式，将多媒体整合到你的网页中的所示程序都是相似的。\n\n***\n\
  \n例如，可以使用以下行来提供一个冰球比赛的 MOV 视频：\n\n```html\n<a href=\"hockey.mov\">View the hockey\
  \ video clip.</a>\n```\n\n当用户点击 `View the hockey video clip.` 单词时，`hockey.mov` QuickTime\
  \ 视频文件将从你的网络服务器传输到她的计算机。无论她安装了哪种辅助应用程序或插件，文件下载完成后它会自动启动。如果找不到兼容的辅助程序或插件，网络浏览器将提供一个机会下载适当的插件或将视频保存到她的硬盘上以便日后查看。\n\
  \n***\n\n### 注意\n\n如果你不熟悉 `helper 应用程序`（简称为 `helper apps`），它们是网络浏览器用来显示其无法独立处理的任何类型文件的外部程序。通常，当网络浏览器无法单独显示某种类型的文件时，就会调用与文件类型相关的辅助应用程序。\n\
  \n`Plug-ins`（插件）是一种直接安装在网络浏览器中的特殊类型辅助应用程序，它们允许你直接在浏览器窗口内查看多媒体内容。\n\n***\n\n点击操作会导致浏览器在插件的帮助下播放视频（如果找到了可以播放该片段的插件），或推给合适的辅助应用程序。\n\
  \n如果你将链接从 `pond.wmv`（Windows Media）更改为 `pond.mov`（QuickTime），你的浏览器处理链接的方式将有所不同。QuickTime\
  \ 插件将不再启动另一个程序，而是允许你直接在浏览器窗口中查看电影片段。\n\n正如你可能猜到的那样，这种使用简单链接播放多媒体文件的方法提供了最好的向后兼容性，因为浏览器承担了确定如何播放多媒体片段的所有责任。这种方法的缺点是，你对片段的播放方式没有太大控制，而且你绝对无法在页面环境中直接播放片段。\n\
  \n***\n\n### 注意\n\n如果你的浏览器不支持 QuickTime，你可以从 Apple 处免费下载 QuickTime 播放器，地址为 [`www.apple.com/quicktime/`](http://www.apple.com/quicktime/)。即使你安装了\
  \ QuickTime，某些浏览器可能根据是否安装了插件以不同的方式播放 QuickTime 电影。例如，在我的 Windows 计算机上，Internet Explorer\
  \ 和 Firefox 都通过插件在浏览器窗口中播放 QuickTime 电影，而 Opera 则将 `QuickTime` 作为辅助应用程序启动。\n\n***\n\
  \n## 嵌入多媒体文件\n\nXHTML 包含一个标准的 `<object>` 标签，它是网页中嵌入任何类型多媒体的首选方法。该标签用于取代旧的 `<embed\
  \ />` 标签，你可能在某些 HTML 源代码中仍看到它。\n\n将多媒体文件嵌入页面中会产生一组软件控件，允许文件直接播放——不需要次级窗口，也不需要离开你所在的页面。以下是使用\
  \ `<object>` 标签本身嵌入 pond 视频的代码：\n\n```html\n<object classid=\"CLSID:6BF52A52-394A-11d3-B153-00C04F79FAA6\"\
  \ width=\"320\" height=\"305\">\n  <param name=\"type\" value=\"video/x-ms-wmv\"\
  \ />\n  <param name=\"URL\" value=\"pond.wmv\" />\n  <param name=\"uiMode\" value=\"\
  full\" />\n  <param name=\"autoStart\" value=\"false\" />\n</object>\n```\n\n考虑到这段代码实际上是把视频直接嵌入到你的网页中，这段代码并不十分复杂（参见图\
  \ 8.22）。代码中最混乱的部分是 `<object>` 标签的 `classid` 属性。（注：此处原文中出现了重复的句子，译文已对应处理）代码中最混乱的部分是\
  \ `<object>` 标签的 `classid` 属性。代码中最混乱的部分是 `<object>` 标签的 `classid` 属性。\n\n（注：由于原文中存在大量重复的句子，作为高级文档工程师，我已清理了关于\
  \ `<object>` 标签的 `classid` 属性的冗余描述，以保持译文的专业性。）\n\n`classid` 属性。\n**图 8.22** `<object>`\
  \ 标签允许你在页面上嵌入视频片段，同时指定由哪个媒体播放器播放。\n\n![image](img/08fig22.jpg)\n\n***\n\n### 注意\n\
  \n注意的是，Windows Media 是一种足够复杂的播放器，可以流式传输媒体，这意味着它在加载前几秒内容后就开始播放。这种设计是为了在你观看或收听时，其余内容在后台加载。\n\
  \n***\n\n`<object>` 标签的宽度和高度属性决定了嵌入式窗口的大小。如果你留空这些属性，某些浏览器会自动调整嵌入器以适应内容，而另一些则什么都不显示。为了起起见，请将它们设置为适合多媒体内容的大小。\n\
  \n***\n\n`<object>` 内部有四个 `<param>` 标签负责关于播放方式的详细信息。每个标签有两个属性：`name` 和 `value`，它们负责将数据（`value`）与特定设置（`name`）关联。在示例中，媒体片段的\
  \ `URL` 被设置为 `pond.wmv`。第三个参数 `uiMode` 决定了哪些用户功能可用。最后，`autoStart` 参数设置为 `false`，这样视频片段就不会在打开页面时自动开始播放。\n\
  \n`type` 参数可能是最棘手的。它识别正在显示的媒体类型，在本例中是 Windows Media Video 文件。这种媒体类型必须指定为标准的 Internet\
  \ MIME 类型之一。\n\n\n\n\n\n`MIME type` 是用于在互联网上唯一标识不同类型媒体对象的标识符。MIME 代表多用途互联网邮件扩展（Multipurpose\
  \ Internet Mail Extensions），这个名称源于 MIME 类型最初用于识别电子邮件附件。这些 MIME 类型应该用在 `<object>`\
  \ 标签的 `type` 属性中，以识别 `data` 属性中引用的的是种多媒体对象。\n\n以下是你可能想在网页中几种常用音频和视频格式的 MIME 类型：\n\
  \n• **WAV Audio**—`audio/x-wav`\n• **AU Audio**—`audio/basic`\n• **MP3 Audio**—`audio/mpeg`\n\
  • **MIDI Audio**—`audio/midi`\n• **WMA Audio**—`audio/x-ms-wma`\n• **RealAudio**—`audio/x-pn-realaudio-plugin`\n\
  • **AVI**—`video/x-msvideo`\n• **WMV**—`video/x-ms-wmv`\n• **MPEG Video**—`video/mpeg`\n\
  • **QuickTime**—`video/quicktime`\n\nListing 8.7 显示了池塘网页的相关代码，你可以在这里看到上下文中的 `<object>`\
  \ 标签。\n\nListing 8.7 使用 `<object>` 标签直接嵌入 WMV 视频片段\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n \"\
  http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n <head>\n  <title>Fun in the Pond</title>\n </head>\n <body>\n\
  \  <h1>Fun in the Pond</h1>\n  <div style=\"float:left; padding:3px\">\n    <object\
  \ classid=\"CLSID:6BF52A52-394A-11d3-B153-00C04F79FAA6\"\n      width=\"320\" height=\"\
  305\">\n      <param name=\"type\" value=\"video/x-ms-wmv\" />\n      <param name=\"\
  URL\" value=\"pond.wmv\" />\n      <param name=\"uiMode\" value=\"full\" />\n  \
  \    <param name=\"autoStart\" value=\"false\" />\n      <embed width=\"320\" height=\"\
  305\" type=\"video/x-ms-wmv\"\n      src=\"pond.wmv\" controls=\"All\" loop=\"false\"\
  \ autostart=\"false\"\n      pluginspage=\"http://www.microsoft.com/windows/windowsmedia/\"\
  \ />\n    </object>\n  </div>\n  <p>Michael Michael 后院的池塘不仅是一个有趣的爱好，还是一个持续的家居改善项目，既有创意又让人心情放松。</p>\n\
  \  <p>池塘里有许多鱼，全部是来自日本、以色列和澳大利亚等远地的锦鱼。虽然它们不会吠叫、打呼噜，也不会去除了食物以外的捡回任何东西，但这些鱼是他的宠物，而且是非常棒的宠物。</p>\n\
  \ </body>\n</html>\n```\n\n## 注意事项\n由于 XHTML 不支持 `<embed />` 标签，它会阻止你的页面通过验证。遗憾的是，这个问题真的没有解决办法——我们只能等待浏览器完全支持\
  \ `<object>` 标签本身，或者迁移到 HTML5 的 `<embed />` 元素。\n\n你可能会注意到有一些额外的代码在之前的 `<object>`\
  \ 标签示例中并没有出现。遗憾的是，正如在本节之前讨论过的，并不是所有的网络浏览器对 `<object>` 标签的支持都是完全一致的。因此，必须在 `<object>`\
  \ 标签内包含一个 `<embed />` 标签以考虑到浏览器的不一致性。这不是理想的解决方案，但在浏览器供应商持续落后主流标准的情况下，这是我们唯一的办法。如果你仔细观察，会发现\
  \ `<embed />` 标签包含了与 `<object>` 标签相同的信息。\n\n## 注意事项\n视频文件并不是你可以使用 `<object>` 和 `<embed\
  \ />` 标签在网站中包含的唯一媒体文件。添加任何多媒体文件都遵循相同的流程。要确定具体应该使用哪些 `classid` 和 `codebase` 属性，以及额外的参数（在\
  \ `<param />` 标签中），请使用搜索引擎搜索如 `object embed mediatype` 的内容，其中 mediatype 是 Real Audio、QuickTime、Flash\
  \ 或任何你想要的类型。\n\n`<object>` 标签比这里展示的要复杂。然而，你不需要知道如何使用 `<object>` 标签的更高级方面就可以播放多媒体内容。换句话说，为了在网页上共享一些多媒体片段，你并不需要成为多媒体专家。\n\
  \n### 使用多媒体的额外提示\n在向你的网站添加视频、音频或动画之前，先问问自己是否真的应该这样做。当你使用这些类型的多媒体时，务必这样做是有理由的。无意义的声音和视频就像无意义的图像一样，会损害你的整体信息。但话又回来，如果你的信息是“看我制作的视频”或“听我的音乐并下载一些歌曲”，那么多媒体必须在你的网站中发挥作用。\n\
  \n这里有几个需要记住的额外提示：\n\n• 不要在一个页面中包含多媒体并将其设置为在页面加载时自动播放。始终给用户启动（和停止）声音或视频的选项。\n• 尽可能给用户提供多种多媒体播放器。不要把自己限制在只能由一种内容播放的多媒体上。\n\
  • 多媒体文件并不是你可以使用 `<object>` 和 `<embed />` 标签在网站中包含的唯一媒体文件。添加任何多媒体文件都遵循相同的流程。要确定具体应该使用哪些\
  \ `classid` 和 `codebase` 属性，以及额外的参数（在 `<param />` 标签中），请使用搜索引擎搜索如 `object embed\
  \ mediatype` 的内容，其中 mediatype 是 Real Audio、QuickTime、Flash 或任何你想要的类型。\n\n\n\n\n\
  在你创建或编辑了一些图像后，就可以将它们放置在网页中了，你已经通过 `<img />` 标签学习了这种方法。你学习了如何包含一段短文本消息，该消息会在图像加载时代替图像显示，并在用户将鼠标指针悬停在图像上时显示。你还发现了如何控制每个图像的水平和垂直对齐，以及如何让文本环绕图像的左侧或右侧。\n\
  \n你学习了如何将图像作为链接——可以通过在图像周围使用 `<a>` 标签或通过创建图像映射（imagemaps）。你还学习了一点关于如何在容器元素的背景中使用图像。\n\
  \n最后，你学习了如何将视频和音频嵌入到网页中。你发现可以使用指向多媒体文件的简单链接，这是播放媒体内容支持度最广泛但灵活性最低的选项。然后，你学习了如何使用\
  \ `<object>` 标签直接在网页中嵌入媒体播放器。不仅如此，你还发现为了最大的浏览器兼容性，使用 `<embed />` 标签辅助 `<object>`\
  \ 标签会有帮助。`<object>` 和 `<embed />` 标签可以包含大量的媒体类型，包括 WAV、MP3、RealAudio 和 MIDI 文件——更不用说\
  \ AVI、WMV 和 QuickTime 视频，这只是其一。\n\n表 8.1 总结了本章涵盖的标签和属性。\n\n表 8.1 第 8 章 涵盖的标签和属性\n\
  \n![image](img/08tab01.jpg)![image](img/08tab01a.jpg)\n\n## 问答\n\n**Q. 与其自己学习这些东西，我不应该直接请平面设计师来设计我的页面吗？**\n\
  \n**A.** 这是一个很难回答的问题，并不是因为我在这里有利益冲突——我为一家网页开发和设计机构工作，所以推荐机构符合我的最佳利益。但机构并不总是最佳解决方案。聘请平面设计师需要花费金钱。此外，许多平面艺术家制作的作品并不适合\
  \ Web 网络——他们是专门从事印刷的艺术家，而印刷世界与在线世界完全不同。此外，请一位自认为是平面设计师的人来创建网站，可能无法发挥该特定设计师的长处。换句话说，他可能擅长设计网站的图形元素，但可能不擅长担任内容架构师或处理\
  \ HTML 和 CSS。如果你的网站仅仅是一个个人网站，那么专业设计可能不是你愿意投入资金的地方。但如果你的网站旨在推广业务、产品、学校或任何你的形象对成功至关重要的东西，那么花时间（和金钱）咨询网页设计专业是值得的。\n\
  \n**Q. 我制作过用于纸质打印的图形。网页图形有什么不同吗？**\n\n**A.** 有的。事实上，许多打印图形的规则在 Web 上是反过来的。网页图形必须是低分辨率的，而打印图形应该尽可能高分辨率。在计算机屏幕上，白色会冲淡黑色，而在纸上，黑色会渗透到白色中。此外，当图形只下载了一半时，用户可能会停止网页的加载。如果你做过很多打印图形设计，尽量避免落入旧习惯。\n\
  \n**Q. 我按照你建议的方法使用了 `<img />` 标签，但当我查看页面时，我只看到一个里面有一些形状的小框。这是怎么了？**\n\n**A.** 你看到的损坏图像图标可能意味着两种情况之一：要么网页浏览器找不到图像文件，要么图像没有以浏览器识别的格式保存。要解决这些问题，首先检查图像是否在它应该在的地方。如果是，在你的图形编辑器中打开图像，并将其重新保存为\
  \ GIF、JPG 或 PNG 格式。\n\n**Q. 如果我在图像映射上重叠区域会发生什么？**\n\n**A.** 你允许在图像映射上重叠区域。只需记住，在决定遵循哪个链接时，一个区域将优先于另一个区域。优先级是根据区域在图像映射中的列表顺序分配的。例如，地图中的第一个区域优先级高于第二个区域，这意味着点击区域的重叠部分将链接到第一个区域。如果你在图像映射中有一个不链接到任何内容的区域（称为“死区域”），你可以使用这个重叠技巧来刻意防止该区域链接到任何内容。要做到这一点，只需将死区域放在其他区域之前，使死区域重叠它们，然后将它的\
  \ `href` 属性设置为 `\"\"`。\n\n**Q. 我听过很多关于流媒体视频和音频。那是什么意思？**\n\n**A.** 在过去，视频和音频文件通过大多数调制解调器检索需要几分钟，有时甚至几小时，这严重限制了在网页中包含视频和音频。大家都在向往的目标是流媒体视频或音频，它在数据接收的同时进行播放。换句话说，你不需要完全完全片段片段就可以开始观看或收听。\n\
  \n流媒体播放现在通过大多数媒体播放器广泛支持，包括独立版本和插件。当你使用 `<object>` 标签嵌入媒体对象时，如果播放器支持流式传输，底层媒体播放器会自动流式传输媒体片段。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。\n\n## 测验\n\n**1** 你如何给页面设置一个黑色背景并将所有文本设置为绿色？根据你在本章中学到的知识，你甚至想使用这种颜色吗？\n\
  \n**2** 你有一张马的扫描照片，需要放在页面上。你应该把它做成多大？你应该用什么格式保存它？\n\n**3** 你如何在网页顶部插入一张 elephant.jpg\
  \ 图像？\n\n**4** 当 elephant.jpg 图像无法显示时，你如何让单词 Elephant 显示出来？\n\n## 答案\n\n**1.** 在网页的开头放置以下内容，或者为\
  \ body 元素使用样式规则：\n\n```html<body style=\"background-color:#000000; color:#00FF00\"\
  >```\n\n**2.** 根据图像对你页面的重要性，你应该将其缩小为 100×40 像素，或放大到 300×120 像素。JPEG 格式，配合 85%的压缩是最好的。当然，你也可以提供指向较大图像的缩略链接。\n\
  \n**3.** 将图像文件复制到 HTML 文本文件的相同目录中。在 HTML 文件的 <body> 标签之后，输入：\n\n```html\n<p><img\
  \ src=\"elephant.jpg\" alt=\"\" /></p>\n```\n\n**4.** 使用以下 HTML：\n\n```html\n<img\
  \ src=\"elephant.jpg\" alt=\"elephant\" />\n```\n\n\n\n\n- 在你开始为重要的商业网站设计图形之前，尝试美化一下你自己的个人主页。这可以给你一个学习\
  \ GIMP 的机会（或者给你一个使用你自己的图形软件的机会），这样当你处理工作中的任务时，就知道自己在做什么。\n- 练习本章中提到的任何图像放置方法，都将极大地帮助你确定图像在你设计的网站中可以发挥且将要发挥的作用。使用一些示例图像，练习使用\
  \ `float` 样式来设置图像和文本的相对位置。记住 `float` 的可能值为 `left`、`right` 和 `none`（默认值）。\n\n# 第三部分：使用\
  \ CSS 进行高级网页设计\n\n## 第 9 章：外外边距、内边距、对齐和浮动\n\n在本章中你将学习：\n\n- 如何在元素周围添加外边距（margins）\n\
  - 如何在元素内部添加内边距（padding）\n- 如何保持一切对齐\n- 如何使用 `float` 属性\n\n现在你已经学习了创建网页内容的基础知识，在本章中，你将学习使用\
  \ CSS 增强这些内容的细节。在上一章中，你已经学习了如何使用基础 CSS 用于显示目的（如字体大小和颜色）。在接下来的章节中，你将深入学习使用 CSS 控制整个网页的各个方面，而不仅仅是单个文本或图形。\n\
  \n在处理页面布局之前，在将它们结合之前，重要的是单独理解四个特定的 CSS 属性：\n\n- `margin` 和 `padding` 属性——用于在元素周围添加空间\n\
  - `align` 和 `float` 属性——用于设置元素与其他元素的相对位置\n\n本章提供的示例并非创建过的最时尚的网页内容，但也不是如此。相反，这些示例清晰地展示了\
  \ XHTML 和 CSS 是如何协同工作的。通过本章和其他章节掌握 CSS 后，你将能够创建像图 9.1 所示的 CSS Zen Garden 示例那样的网页杰作。\n\
  \n**图 9.1** 这是 CSS Zen Garden 中 XHTML 和 CSS 发挥作用的众多示例之一。\n\n![image](img/09fig01.jpg)\n\
  \nCSS Zen Garden 上的网站可能不像你经常访问的典型电子商务或社交网络网站。相反，这些网站展示了使用 CSS 可以展开的艺术可能性。不要误会，这些网站经过仔细的思考和规划，但设计的潜力是无限的。\n\
  \n### 注意\n\nCSS Zen Garden ([`www.csszengarden.com/`](http://www.csszengarden.com/))\
  \ 上的网站展示了通过使用符合标准的 CSS 可以实现的类型。花园中所有用户提交的作品使用完全相同的 HTML 文件，但艺术家可以自由修改 CSS 文件以创建自己的视觉显示。图\
  \ 9.1 所示的示例来自 Stuff and Nonsense 的 Andy Clarke（[`www.stuffandnonsense.co.uk/`](http://www.stuffandnonsense.co.uk/)）。\n\
  \n## 使用外边距（Margins）\n\n样式表外边距允许你在网页上元素矩形区域的*外部*添加空白空间。记住 `margin` 属性作用于元素外部的空间。\n\
  \n以下是设置外边距的样式属性：\n\n- `margin-top`——设置顶部外边距\n- `margin-right`——设置右侧外边距\n- `margin-bottom`——设置底部外边距\n\
  - `margin-left`——设置左侧外边距\n- `margin`——作为单个属性设置顶、右、底、左外边距\n\n你可以使用任何单个外边距属性或使用单个\
  \ `margin` 属性来指定外边距。外边距可以指定为 `auto`，这意味着浏览器本身根据特定长度（像素、点、em）或百分比设置外边距。如果你决定将外边距设置为百分比，请记住百分比是基于整个页面的大小计算，而不是元素的大小。因此，如果你将\
  \ `margin-left` 属性设置为 25%，则元素的左侧外边距将是整个页面宽度的 25%。\n\n### 注意\n\n你可以通过至少两种不同的方式记住这个简写顺序。首先，如果你将元素想象成一个矩形，从顶部开始顺时针绕四周移动：顶边、右边、底边、左边。或者你可以使用单词首字母助记法并记住“TRBL”（读作“trouble”），如果你忘记了外边距属性的顺序，这也代表了可能的状态。\n\
  \n另外注意，TRBL 顺序也适用于内边距（padding）属性和边框（border）属性。\n\nListing 9.1 中的代码在页面上产生四个矩形，每个宽\
  \ 250 像素，高 100 像素，并带有 5 像素的黑色实线边框（见图 9.2）。每个矩形（在此情况下为 `div`）具有不同的背景颜色。我们希望每个 `div`\
  \ 周围的外边均为 15 像素，因此可以使用：\n\n```css\nmargin-top:15px;\nmargin-right:15px;\nmargin-bottom:15px;\n\
  margin-left:15px;\n```\n\n**图 9.2** 基础颜色块页面显示了四个块，每个块都有相等的外边距。\n\n![image](img/09fig02.jpg)\n\
  \n你也可以 `margin` 属性以简写形式写出：\n\n```css\nmargin:15px;\n```\n\n如果你想让顶部和底部的外边距相同，且左右的外边距也相同，可以使用：\n\
  \n```css\nmargin:15px 15px;\n```\n\n如果你想让顶部和底部的外边距相同，而左右的外边距不同，可以使用：\n\n```css\n\
  margin:15px 10px;\n```\n\n如果你想让四个方向的外边距都不同，可以使用：\n\n```css\nmargin:15px 10px 15px\
  \ 5px;\n```\n\n在使用 `margin` 属性设置外边距时，实际上有三种方法，取决于你使用多少值：\n\n- 一个值——设置所有外边距\n- 两个值——设置顶部/底部和左右的外边距\n\
  - 三个值——设置顶部、左右和底部的外边距\n- 四个值——分别设置顶、右、底、左的外边距\n\n你可能会发现使用一个值或四个值更简单，但这并不是要求的。\n\n\
  \n\n\n\n• 在第四个颜色块周围设置左边距 250 像素，上边距 25 像素。\n\n这看起来似乎很简单——第一个块周围没有设置边距。但我们希望在第二个块的顶部设置边距，因此实际上即使我们没有为第一个块设置边距，第一个块和第二个块之间仍然存在一个可见的边距。\n\
  \n四个命名 `<div>` 的新样式表条现在看起来如下：\n\n```css\ndiv#d1 {\n  background-color:red;\n  margin:0px;\n\
  }\n\ndiv#d2 {\n  background-color:green;\n  margin:5px 0px 0px 15px;\n}\n\ndiv#d3\
  \ {\n  background-color:blue;\n  margin:0px 0px 0px 75px;\n}\n\ndiv#d4 {\n  background-color:yellow;\n\
  \  margin:25px 0px 0px 250px;\n}\n```\n\n之前的代码更改结果（参见图 9.3）看起来是随机的，但实际上对于指出其他几个重要点非常有用。例如，当你回想起目标之一是在第一个颜色块周围完全不产生边距时，你可能认为颜色块的边框应该是与浏览器窗口对齐的。但是，如图\
  \ 9.3 所示，页面内容与浏览器窗口框架之间存在明显的空白。\n\n**图 9.3** 颜色块示例页的修改显示了不同的边距。\n\n![image](img/09fig03.jpg)\n\
  \n如果我们正在处理元素布局（我们将在下一章中讨论这一点），这将会导致你的布局出现问题。为了确保你的布局和边距是从与浏览器对齐的位置开始计算的，你将处理 `<body>`\
  \ 元素本身的边距。在这种情况下，你将向样式表中添加以下内容：\n\n```css\nbody {\n  margin:0px;\n}\n```\n\n另一个需要记住的“坑”是，如果你有两个带有边框元素堆叠在一起，但它们之间没有边距，它们接触的地方将看起来会有双重边框。你可能需要考虑将顶部元素的\
  \ `border-bottom` 宽度减半，并让底部元素的 `border-top` 宽度也减半。如果你这样做，边框在堆叠时将看起来与其他侧的框宽度相同。\n\
  \n此外，你可能曾认为通过使用 250 像素的左边距（`<div>` 的宽度），第四个颜色块将从第三个颜色块结束的地方开始。然而，事实并非如此，因为第三个颜色块有一个\
  \ 75 像素的 `margin-left`。为了让它们至少能够对齐，第四个 `div` 的 `margin-left` 值必须是 325 像素。\n\n将样式更改为后续代码所示的形式，将产生图\
  \ 9.4 所示的间距。\n\n```css\nbody {\n  margin:0px;\n}\n\ndiv {\n  width:250px;\n  height:100px;\n\
  \  color:black;\n  font-weight:bold;\n  text-align:center;\n}\n\ndiv#d1 {\n  border:5px\
  \ solid #000000;\n  background-color:red;\n  margin:0px;\n}\n\ndiv#d2 {\n  border-width:6px\
  \ 6px 3px 6px;\n  border-style:solid;\n  border-color:#000000;\n  background-color:green;\n\
  \  margin:10px 0px 0px 15px;\n}\n\ndiv#d3 {\n  border-width:3px 6px 6px 6px;\n \
  \ border-style:solid;\n  border-color:#000000;\n  background-color:blue;\n  margin:0px\
  \ 0px 0px 15px;\n}\n\ndiv#d4 {\n  border:5px solid #000000;\n  background-color:yellow;\n\
  \  margin:0px 0px 0px 265px;\n}\n```\n\n**图 9.4** 颜色块的第三次修改使项目之间的关系更加紧密。\n\n![image](img/09fig04.jpg)\n\
  \n这些更改为 `<body>` 元素提供了零边距，从而确保 25 像素的 `margin-left` 值确实距离浏览器框架边缘 25 像素。它还展示了第二个和第三个颜色块堆叠在一起，但对边框元素进行了修改，因此不会出现双重边框。此外，第四个颜色块从第三个颜色块结束的地方开始。\n\
  \n正如你在图 9.4 中所示……\n\n\n\n\n\n```html\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Color Blocks</title>\n    <style type=\"text/css\">\n      body {\n   \
  \       margin:0px;\n      }\n      div {\n          width:250px;\n          height:100px;\n\
  \          border:5px solid #000000;\n          color:black;\n          font-weight:bold;\n\
  \          margin:25px;\n      }\n      div#d1 {\n          background-color:red;\n\
  \          text-align:center;\n          padding:15px;\n      }\n      div#d2 {\n\
  \          background-color:green;\n          text-align:right;\n          padding:25px\
  \ 50px 6px 6px;\n      }\n      div#d3 {\n          background-color:blue;\n   \
  \       text-align:left;\n          padding:6px 6px 6px 50px;\n      }\n      div#d4\
  \ {\n          background-color:yellow;\n          text-align:center;\n        \
  \  padding:50px;\n      }\n    </style>\n  </head>\n  <body>\n    <div id=\"d1\"\
  >DIV #1</div>\n    <div id=\"d2\">DIV #2</div>\n    <div id=\"d3\">DIV #3</div>\n\
  \    <div id=\"d4\">DIV #4</div>\n  </body>\n</html>\n```\n\n\n\n\n\n图 9.9 显示了使用\
  \ `float` 属性的另一种有趣可能。与代码列表 9.3 相比，代码的唯一变化是将颜色块的宽度设为 100 像素，将边距缩小为 10px，并将第二个颜色块的\
  \ `float` 对齐方式改为右对（而不是左对齐）。\n\n**图 9.9** 使用浮动来放置颜色块。\n\n![image](img/09fig09.jpg)\n\
  \n然而，发生了一些非常有趣的事情。第二个颜色块现在在视觉上看起来像第三个颜色块，因为它是右对齐的。第二个颜色块的 `float` 值为 `right`，所以它一直浮动到了最右侧。第一个和第三个颜色块尽可能地向左浮动，无论\
  \ HTML 中的 `<div>` 代码出现顺序如何，其代码如下：\n\n```html\n<div id=\"d1\">DIV #1</div>\n<div\
  \ id=\"d2\">DIV #2</div>\n<div id=\"d3\">DIV #3</div>\n```\n\n浮动需要大量的练习才能习惯，尤其是当页面中还有额外的元素而不仅仅是几个颜色块时。例如，当你在其中加入基础段落时会发生什么？所有放在浮动元素之后的元素都将围绕该元素浮动。要避免这种情况，请使用\
  \ `clear` 属性。\n\n`clear` 属性有五个可能的值：`left`、`right`、`both`、`none` 和 `inherit`。常用的值是\
  \ `left`、`right` 和 `both`。指定 `clear:left` 可确保左侧不允许有其他浮动元素，`clear:right` 可确保右侧没有其他浮动元素，依此类推。浮动和清除是一个在做中学的过程中，因此请查看本章节后面“工作坊”部分中的更多情况。\n\
  \n## 总结\n本章向你介绍了一些 CSS 设计中最基础的样式属性：`margin`、`padding` 和 `float`。你学习了 `margin` 属性如何控制元素外部的空间，以及\
  \ `padding` 属性如何与元素内部的空间工作。\n\n在复习了上一节课中学过的 `text-align` 和 `vertical-align` 属性后，你学习了\
  \ `float` 属性。`float` 属性允许对元素的特定放置以及元素周围的额外内容。\n\n## 问答\n**Q. 边距和内边距的示例都与框和文本有关。对图片应用边距和内边距吗？**\n\
  \n**A.** 可以，你可以将边距和内边距应用于任何块级元素，例如 `<p>`、`<div>`、`<img/>`、如 `<ul>` 和 `<ol>` 等列表，以及列表项（`<li>`）——这只是举例。\n\
  \n## 工作坊\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n## 测验\n**1.** 要让两个\
  \ `<div>` 元素并排放置，但它们之间有 30 像素的边距，在样式表中可以使用哪个或哪些条目？\n\n**2.** 使用哪个 CSS 样式属性和值来确保内容不会出现在浮动元素的左侧？\n\
  \n**3.** 使用什么样式表条目可以使 `<div>` 内部的文本距离元素顶部 12 像素？\n\n## 答案\n**1.** 你可以使用好几种方法。第一个\
  \ `<div>` 使用 `margin-right:15px` 样式属性，第二个 `<div>` 使用 `margin-left:15px` 样式属性。或者你也可以根据情况使用\
  \ `margin-right` 或 `margin-left` 将整个 30 像素分配给任一 `<div>`。\n\n**2.** 在这种情况下，使用 `clear:left`。\n\
  \n**3.** `padding-top:12px`\n\n### 练习题\n• 完全理解边距、内边距、对齐和浮动需要练习。使用颜色块代码或你自己的 `<div>`s，在进入下一章之前，练习各种类型的间距和浮动。下一章将讨论整个\
  \ CSS 盒模型，它涵盖了本章中讨论的各个项目。\n\n## 第 10 章 理解 CSS 盒模型和定位\n\n* * *\n\n本章你将学到：\n• 如何概念化\
  \ CSS 盒模型\n• 如何定位你的元素\n• 如何控制元素的堆叠方式\n• 如何管理文本流\n\n* * *\n\n在上一章中，我提到了几次 CSS 盒模型——本章将从讨论盒模型开始，并解释了你在上一章中学到的知识如何帮助你理解这个模型。通过学习盒模型，当你创建一个设计时，就不会不会抓狂头发，然后发现元素没有对齐，或者它们看起来有点“不对”。你会知道，在几乎所有情况下，某些东西——边距、内边距、边框——都在起作用。\n\
  \n## CSS 盒模型\nHTML 中的每个元素都被视为一个“框”，无论它是段落、一个 `<div>` 还是其他。盒模型描述了边框、内边距和边距应用于元素的方式。\n\
  \n图 10.1 是盒模型的图解。边框、内边距和边距——只需要它。\n\n**图 10.1** HTML 中的每个元素都由盒模型表示。\n\n![image](img/10fig01.jpg)\n\
  \n这是另一种对盒模型的解释，从外向内看：\n• `margin` 是元素外部的区域。它没有颜色；始终是透明的。\n• `border` 环绕元素，位于任何内边距的边缘。\n\
  • `padding` 位于内容周围，并继承内容的背景颜色。\n• `content` 被内边距包围。\n\n要确定元素的真实高宽，你必须考虑盒模型的所有元素。如果你还记得上一章的例子，即具体指定一个\
  \ `<div>` 宽 250 像素、高 100 像素，那么那个 `<div>` 必须变大以适应内边距。\n\n你已经知道如何使用 `width` 和 `height`\
  \ 属性设置元素的宽度和高度。以下示例展示了如何定义一个宽 250 像素、高 100 像素、红色背景并具有黑色单像素边框的 `<div>`：\n\n```css\n\
  div {\n  width: 250px;\n  height: 100px;\n  background-color: #ff0000;\n  border:\
  \ 1px solid #000000;\n}\n```\n\n这个简单的 `<div>` 显示在 图 10.2 中。\n\n**图 10.2** 这是一个简单的\
  \ `<div>`。\n\n![image](img/10fig02.jpg)\n\n如果我们定义一个具有相同属性的第二个元素，并加上特定大小的 `margin`\
  \ 和 `padding` 属性，我们开始看到元素尺寸的变化。这是因为盒模型的原因。\n\n\n\n\n第二个 `<div>` 的定义如下，仅为元素添加了 10\
  \ 像素的外边距（margin）和 10 像素的内边距（padding）：\n\n```css\ndiv#d2 {\n  width: 250px;\n  height:\
  \ 100px;\n  background-color: #ff0000;\n  border: 5px solid #000000;\n  margin:\
  \ 10px;\n  padding: 10px;\n}\n```\n\n图 10.3 所示的第二个 `<div>` 定义的高度与第一个相同，但当考虑到外边距和内边距时，围绕元素本身的框的总高度和宽度会变得大得多。\n\
  \n**图 10.3** 这本应该是另一个简单的 `<div>`，但盒模型影响了第二个 `<div>` 的尺寸。\n\n![image](img/10fig03.jpg)\n\
  \n元素的总宽度是以下各项之和：\n`width + padding-left + padding-right + border-left + border-right\
  \ + margin-left + margin-right`\n\n元素的总高度是以下各项之和：\n`height + padding-top + padding-bottom\
  \ + border-top + border-bottom + margin_top + margin-bottom`\n\n因此，第二个 `<div>` 的实际宽度为\
  \ 300 (250 + 10 + 10)，实际高度为 150 (100 + 10)。到现在，你可以开始看到盒模型将如何影响你的设计了。假设你只有 250 像素的水平空间，但四周都有\
  \ 10 像素的外边距、10 像素的内边距和 5 像素的边框。为了容纳你需要显示的内容，必须将 `<div>` 的 `width` 指定为 200 像素。\n\n\
  ### 注意\n在本书书中你一直在使用 DOYPE 声明——所有的示例代码都包含了它。继续这种做法不仅是为了让你的代码通过验证，还因为 Internet Explorer\
  \ 有一个特殊的问题：如果没有定义 DOYPE，Internet Explorer 会以你无意采取的方式操纵元素的高度和宽度。\n\n理解盒模型背后的概念固然重要，模型的数学原理同样重要。在显示由用户交互（例如通过\
  \ JavaScript 事件）驱动的动态网站中，你的客户端代码可能会绘制和重绘元素。既然你已经学习了盒模型的法则，请在本书的其余部分牢记住它。除其他内容外，我们将处理元素定位和内容流。\n\
  \n## 定位浅析\n相对定位（Relative positioning）是 HTML 使用的默认定位类型。你可以将相对定位想象成在棋盘上摆放棋子：棋子从左到右排列，当你到达棋盘边缘时，移动到下一行。`display`\
  \ 属性设置为 `block` 值的元素会自动放置在新的一行，而 `inline` 元素则被放置在同一行。例如，`<p>` 和 `<div>` 标签被视为块级元素，而\
  \ `<span>` 标签被视为内联元素。\n\nCSS 支持的另一种定位类型被称为绝对定位（absolute positioning），因为它允许你设置 HTML\
  \ 内容在页面上的确切位置。尽管绝对定位让你拥有了精确指定元素出现位置的自由度，但该位置仍然相对于任何父级元素，这与相对定位有很大不同。由于可以在页面的任何地方放置元素，你可能会遇到重叠问题，即一个元素占据了另一个元素空间。在这种情况下，CSS\
  \ 依赖于每个元素的 `z-index` 来确定哪个元素在上方，哪个元素在下方。你将在本章后面学习更多关于 `z-index` 的知识。现在，让我们具体看看如何控制样式规则使用相对定位还是绝对定位。特定样式规则使用的定位类型（相对或绝对）由\
  \ `position` 属性决定，该属性取以下值之一：`relative` 或 `absolute`。在指定定位类型后，你再通过以下属性提供具体位置：\n\n\
  * `left`: 左侧偏移量\n* `right`: 右侧偏移量\n* `top`: 顶部偏移量\n* `bottom`: 底部偏移量\n\n你可能认为这些位置属性对绝对定位有意义，但它们实际上适用于两种定位类型。在相对定位下，元素的位置被指定相对于元素原始位置的偏移量。因此，如果你将元素的\
  \ `left` 属性设置为 `25px`，元素的左侧将从其原始（相对）位置向右移动 25 像素。另一方面，绝对位置是相对于应用样式的元素的父元素指定的。因此，如果在绝对定位下将元素的\
  \ `left` 属性设置为 `25px`，元素的左侧将出现在父元素左边缘右侧 25 像素处。相反，使用相同值的 `right` 属性将元素定位为右侧位于父元素右边缘左侧\
  \ 25 像素处。\n\n让我们回到颜色块示例来展示定位是如何工作的。在列表 10.1 中，四个颜色块指定了相对定位。正如你在图 10.4 中所示，块是垂直排列的。\n\
  \n**图 10.4** 颜色块垂直堆叠排列。\n\n![image](img/10fig04.jpg)\n\n列表 10.1 使用四个颜色块显示相对定位\n\n\
  ```xml<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ HTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>Positioning the\
  \ Color Blocks</title>\n  <style type=\"text/css\">\n    div {\n      position:relative;\n\
  \      width:250px;\n      height:100px;\n      border:5px solid #000;\n      color:black;\n\
  \      font-weight:bold;\n      text-align:center;\n    }\n    div#d1 {\n      background-color:red;\n\
  \    }\n    div#d2 {\n      background-color:green;\n    }\n    div#d3 {\n     \
  \ background-color:blue;\n    }\n    div#d4 {\n      background-color:yellow;\n\
  \    }\n  </style>\n</head>\n<body>\n  <div id=\"d1\">DIV #1</div>\n  <div id=\"\
  d2\">DIV #2</div>\n  <div id=\"d3\">DIV #3</div>\n  <div id=\"d4\">DIV #4</div>\n\
  </body>\n</html>\n```\n\n\n\n\n在图 10.4 中注意，`<div>` 元素是一个接一个显示的，这符合相对定位（relative\
  \ positioning）的预期。但为了让事情更有趣——这正是我们在这里做的——你可以将定位改为绝对定位（absolute），并显式地指定颜色的位置。在列表\
  \ 10.2 中，样式表项被更改为使用绝对定位来排列颜色块。\n\n### 列表 10.2 使用绝对定位排列颜色块\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \ \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n<head>\n  <title>Positioning the Color Blocks</title>\n  <style\
  \ type=\"text/css\">\n    div {\n      position:absolute;\n      width:250px;\n\
  \      height:100px;\n      border:5px solid #000;\n      color:black;\n      font-weight:bold;\n\
  \      text-align:center;\n    }\n    div#d1 {\n      background-color:red;\n  \
  \    left:0px;\n      toppx;\n    }\n    div#d2 {\n      background-color:green;\n\
  \      left:75px;\n      top:25px;\n    }\n    div#d3 {\n      background-color:blue;\n\
  \      left:150px;\n      top:50px;\n    }\n    div#d4 {\n      background-color:yellow;\n\
  \      left:225px;\n      top:75px;\n    }\n  </style>\n</head>\n<body>\n  <div\
  \ id=\"d1\">DIV #1</div>\n  <div id=\"d2\">DIV #2</div>\n  <div id=\"d3\">DIV #3</div>\n\
  \  <div id=\"d4\">DIV #4</div>\n</body>\n</html>\n```\n\n此样式表将 `position` 属性设置为\
  \ `absolute`，这是样式表使用绝对定位的必要条件。此外，为每个继承的 `<div>` 样式规则都设置了 `left` 和 `top` 属性。然而，这些规则的每个位置都设置得使得元素相互重叠显示，如图\
  \ 10.5 所示。\n\n**图 10.5** 使用绝对定位显示颜色块。\n\n![image](img/10fig05.jpg)\n\n现在我们谈论布局了！图\
  \ 10.5 展示了绝对定位如何让你将元素精确地放置在你想要的任何位置。它还揭示了排列元素使其相互重叠是多么简单。你可能好奇网页浏览器在元素重叠时如何知道应该将哪些元素画在最上方。下一节将介绍如何控制堆叠顺序。\n\
  \n### 控制元素的堆叠方式\n\n在某些情况下，你希望仔细控制元素在网页上相互重叠的方式。`z-index` 样式属性允许你根据元素相互堆叠的顺序来设置元素的顺序。虽然\
  \ `z-index` 这个名字听起来有点奇怪，但它指的是第三维度（Z）的概念，除了横跨（X）和纵向（Y）屏幕的两个维度外，它还指向屏幕内部。z-index 的另一种思考方式是杂志堆中单本杂志的相对位置。靠近堆叠顶部的杂志\
  \ z-index 比堆叠下方的杂志 z-index 高。同样，一个 `z-index` 较高的重叠元素将显示在 `z-index` 较低的元素之上。\n\n\
  `z-index` 属性用于设置一个数值，表示样式规则的相对 `z-index`。分配给 `z-index` 的数字只相对于样式表中的其他样式规则才有意义，这意味着为单个规则设置\
  \ `z-index` 属性并没有太大意义。另一方面，如果你为应用于重叠元素的几条样式规则设置了 `z-index`，那么 `z-index` 值较高的元素将出现在\
  \ `z-index` 值较低的元素之上。\n\n> 注意：无论你为样式规则设置了什么 `z-index` 值，带有该规则的元素始终会显示在其父元素之上。\n\n\
  列表 10.3 包含了另一个版本的颜色块样式表和 HTML，它使用 `z-index` 来改变元素的自然重叠。\n\n### 列表 10.3 使用 `z-index`\
  \ 颜色块中元素的显示\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>Positioning\
  \ the Color Blocks</title>\n  <style type=\"text/css\">\n    div {\n      position:absolute;\n\
  \      width:250px;\n      height:100px;\n      border:5px solid #000;\n      color:black;\n\
  \      font-weight:bold;\n      text-align:center;\n    }\n    div#d1 {\n      background-color:red;\n\
  \      left:0px;\n      top:0px;\n      z-index:0;\n    }\n    div#d2 {\n      background-color:green;\n\
  \      left:75px;\n      top:25px;\n      z-index:3;\n    }\n    div#d3 {\n    \
  \  background-color:blue;\n      left:150px;\n      top:50px;\n      z-index:2;\n\
  \    }\n    div#d4 {\n      background-color:yellow;\n      left:225px;\n      top:75px;\n\
  \      z-index:1;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"d1\">DIV #1</div>\n\
  \  <div id=\"d2\">DIV #2</div>\n  <div id=\"d3\">DIV #3</div>\n  <div id=\"d4\"\
  >DIV #4</div>\n</body>\n</html>\n```\n\n\n\n正如你在上一节中所学习的，你可以使用 `clear` 属性来防止文本在元素旁边流动，该属性可以设置为\
  \ `none`、`left`、`right` 或 `both`。`clear` 属性的默认值为 `none`，表示文本将自由流动，而不对该元素进行任何特殊考虑。`left`\
  \ 值会导致文本停止绕过元素流动，直到页面的左侧没有该元素为止。同样，`right` 值意味着文本不会绕过元素的右侧流动。`both` 值则表示文本不会绕过元素的任何一侧流动。\n\
  \n`overflow` 属性处理溢出文本，即无法放入其矩形区域内的文本；当你将元素的 `width`（宽度）和 `height`（高度）设置得太小时，就会发生这种情况。`overflow`\
  \ 属性可以设置为 `visible`、`hidden` 或 `scroll`。`visible` 设置会自动放大元素，使溢出的文本能够适应其中；这是该属性的默认设置。`hidden`\
  \ 值会保持元素的大小不变，允许溢出的文本隐藏在视野之外。可能最有趣的值是 `scroll`，它会为元素添加滚动条，让你能够移动并查看文本。\n\n## 总结\n\
  \n本节从关于 CSS 盒模型的重要讨论开始，涵盖了在考虑外边距（margins）、内边距（padding）和边框（borders）时如何计算元素的宽度和高度。接下来接着讨论了元素的绝对定位，然后你学习了使用\
  \ `z-index` 进行定位。你还发现了一些非常实用的小样式属性，它们能让你控制页面上文本的流动。\n\n本节内容虽然简短，但包含了许多关于控制网站设计的基础性信息。值得重读并练习示例，这样你就能为你的工作打下良好的基础。\n\
  \n## 问答\n\n**Q. 我应该如何判断何时使用相对定位，何时使用绝对定位？**\n\n**A.** 尽管在何时相对定位与绝对定位之间没有固定的准则，但通用的想法是：只有当你想要对内容的定位方式进行更精细的控制时，才需要绝对定位。这是因为绝对定位允许你精确到像素级来定位内容，而相对定位在内容定位方面的可预测性要低得多。这并不是说相对定位不能很好地定位页面上的元素；它意味着绝对定位更加精确。当然，这使得绝对定位可能更容易受到屏幕尺寸变化的影响，而这是你无法真正控制的。\n\
  \n**Q. 如果我没有为两个重叠元素指定 z-index，我如何知道哪个元素会显示在上面？**\n\n**A.** 如果重叠元素没有设置 `z-index`\
  \ 属性，则在网页中后出现的元素将显示在上方。记住这一点的简单方法是：想象网页浏览器在读取 HTML 文档时绘制页面上的每个元素；在文档中后读取的元素会绘制在先读取的元素之上。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n## 测验\n\n**1.**\
  \ 相对定位和绝对定位之间的区别是什么？\n\n**2.** 哪种 CSS 样式属性控制元素相互重叠的方式？\n\n**3.** 你可以使用什么 HTML 代码来显示单词\
  \ `\"Where would you like to\"` 恰好从浏览器窗口的左上角开始，并在下方 80 像素、右侧 20 像素处用大字号显示单词 `\"\
  GO TODAY?\"`？\n\n## 答案\n\n**1.** 相对定位允许元素相对于其正常位置进行移动，而绝对定位则允许元素相对于其最近的定位祖先（父元素）进行定位。\n\
  \n**2.** `z-index` 属性控制重叠元素的堆叠顺序。\n\n**3.** 你可以使用以下代码：\n\n```html\n<span>Where would\
  \ you like to</span>\n<h1>GO TODAY?</h1>\n```\n\n## 练习\n\n- 如果我没有为两个重叠元素指定 z-index，我如何知道哪个元素会显示在上面？\n\
  - 练习使用外边距、内边距和边框来创建一组图片。\n\n## 第 11 章 使用 CSS 进一步处理列表、文本和导航\n\n* *\n\n本节你将学习：\n\n\
  - CSS 盒模型如何影响列表\n- 如何自定义列表项目指示\n- 导航与普通列表的区别\n- 如何使用 CSS 制作导航\n- 如何使用 CSS 制作垂直导航\n\
  - 如何使用 CSS 制作水平导航\n\n* *\n\n在第 5 章 字体、文本块和列表 中，你接触了三种 HTML 列表；而在第 9 章 外边距、内边距和对齐\
  \ 中，你学习了外边距、内边距和对齐。在本节中，你将学习如何将外边距、内边距和对齐样式应用于不同的 HTML 列表，帮助你制作一些设计。\n\n具体而言，你将学习如何修改你在第\
  \ 5 章](#ch05.html_ch05) 中学习的 `list-style-type` 属性，以及如何使用样式列表来替换你所学习的客户端图片地图。你将练习已经过的许多\
  \ CSS 样式，而本节获得的知识将直接引导你将列表不仅用于符号或编号列表。你将学习许多将列表作为垂直或水平导航的方法，包括使用列表创建下拉菜单。\n\n本节介绍的方法代表了使用列表创建众多多样化导航方法的一个小部分。然而，这些概念都是相似的；不同的结果取决于你对这些基础概念的创意应用。为了激发你的灵感，我将在本末尾提供其他\
  \ CSS 导航的示例。\n\n\n\n\n\n*   一个 `definition list` 通常用于显示术语及其含义，从而在列表本身的上下文中提供信息层级结构——类似于有序列表，但没有编号。定义列表由\
  \ `<dl>` 和 `</dl>` 标签包围，用 `<dt>` 和 `</dt>` 标签包裹术语，用 `<dd>` 和 `</dd>` 标签包裹定义。\n\n\
  当内容需要时，你可以嵌套有序和无序列表——或者将列表放在其他列表中。嵌套列表会产生内容层次结构，因此请仅在你的内容确实具有想要显示的层级结构时（如内容大或目录）使用它们。或者，\
  \ as you will learn later in this chapter, you can use nested lists when your site\
  \ navigation contains sub-navigational elements.\n\n***\n\n### Note\n\n一些旧浏览器处理\
  \ margins 和 padding 的方式不同，尤其是列表和列表项周围。然而，在写作时，本书中及其他章节的 HTML 和 CSS 在当前版本的主流 Web\
  \ 浏览器中的显示效果是完全一致的（Apple Safari, Google Chrome, Microsoft Internet Explorer, Mozilla\
  \ Firefox, and Opera）。 Of course, you should still review your web content in all\
  \ browsers before you publish it online, but the need for “hacking” style sheets\
  \ to accommodate the rendering idiosyncrasies of browsers is fading away.\n\n***\n\
  \n### CSS 盒模型如何影响列表\n\n特定的列表相关样式包括 `list-style-image`（用于将图像作为列表项标记）、`list-style-position`（指示放置列表项标记的位置）以及\
  \ `list-style-type`（列表项标记本身的类型）。尽管这些样式控制着列表和列表项的结构，但你仍然可以使用 `margin`、`padding`、`color`\
  \ 和 `background-color` 样式来实现更具体的列表显示。\n\n在 第 9 章 中，你学习了每个元素在内容和元素边界之间都有 padding；你还学习了元素边界与任何其他内容之间存在\
  \ margin。对于列表也是如此，当你对列表设置样式时，必须记住一个“列表”实际上是由两个元素组成的：父列表元素类型（`<ul>` 或 `<ol>`）和单个列表项本身。这些每个元素都有受样式表影响的\
  \ margins 和 padding。\n\n本章中的示例向你展示了不同的 CSS 样式如何影响 HTML 列表和列表项的视觉显示。在本章练习处理列表时，请记住这些基本差异，你就能使用列表在网站导航中实现高级视觉效果。\n\
  \nListing 11.1 创建了一个包含三个项目的基本列表。在此列表中，无序列表本身（`<ul>`）被赋予了蓝色背景、黑色边框和 100 像素的特定宽度，如\
  \ 图 11.1 所示。列表项（单个 `<li>`）具有灰色背景和黄色边框。列表项文本和指示器（符号）是黑色的。\n\n**图 11.1** 使用颜色和边框对列表和列表项进行样式设置。\n\
  \n![image](img/11fig01.jpg)\n\nListing 11.1 使用颜色和边框样式的基本列表\n\n***\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>List Test</title>\n    <style type=\"text/css\"\
  >\n      ul {\n        background-color: #6666ff;\n        border: 1px solid #000000;\n\
  \        width:100px;\n      }\n      li {\n        background-color: #cccccc;\n\
  \        border: 1px solid #ffff00;\n      }\n    </style>\n  </head>\n  <body>\n\
  \    <h1>List Test</h1>\n    <ul>\n      <li>Item #1</li>\n      <li>Item #2</li>\n\
  \      <li>Item #3</li>\n    </ul>\n  </body>\n</html>\n```\n\n***\n\n***\n\n###\
  \ Note\n\n你可以测试默认的 `padding-left` 值，作为默认值...（注：原文此处存在大量重复的 \"padding-left\" 文本）。\n\
  \n\n\n\n\n图 11.4 展示了外部（outside）和内部（inside）两种列表样式位置的示例。代码列表 11.1 与用于生成图 11.4 所示示例的代码之间（不包括添加到“项目\
  \ #2”和“项目 #3”中的填充文本）唯一的区别在于：第二个列表项包含 `style=\"list-style-position: outside;\"` 属性，而第三个列表项包含\
  \ `style=\"list-style-position: inside;`。\n\n**图 11.4** `list-style-position` 的\
  \ `outside` 和 `inside` 值之间的区别。\n\n![image](img/11fig04.jpg)\n\n第二个列表项使用的额外填充文本显示了当列表宽度被定义为不足以在一行内显示所有内容时，文本是如何换行的。即使不使用\
  \ `style=\"list-style-position: outside;\"` 也会获得相同的结果，因为在代码中没有任何式声明的情况下，它是 `list-style-position`\
  \ 的默认值。\n\n然而，当使用“内部”位置时，你可以清楚看到区别。在第三个列表项中，符号和文本都在黄色边界框定的灰色区域内——即列表项本身。当 `list-style-position`\
  \ 的值为 `inside` 时，外边距（Margins）和内边距（padding）对列表项的影响不同（参见图 11.5）。\n\n**图 11.5** 使用内部\
  \ `list-style-position` 改变了项的显示方式。\n\n![image](img/11fig05.jpg)\n\n在图 11.5 中，第二个和第三个列表项的\
  \ `list-style-position` 值均为 `inside`。然而，第二个列表项具有 `12` 像素的 `margin-left` 值，而第三个列表项具有\
  \ `12` 像素的 `padding-left` 值。尽管两个内容块（列表指示符加文本）都显示文本环绕着符号，且这些块在定义列表项的灰色区域内的位置是相同的，但受影响的是列表内部的列表项。\n\
  \n正如你所预期的，具有 `12` 像素 `margin-left` 值的列表项显示出 `12` 像素的红色透过列表项周围的透明边距。同样，具有 `12` 像素\
  \ `padding-left` 值的列表项在内容开始之前显示出 `12` 像素的灰色背景（列表项的背景）。内边距位于元素内部；外边距位于元素外部。\n\n通过理解边距和内边距如何影响列表项及其所在的列表，你应该能够在你的网站中创建纯\
  \ CSS 且不依赖外部图像的导航元素。在本章后面的部分，你将学习如何创建垂直和水平导航菜单以及下拉菜单。\n\n***\n\n### 注意\n\n关于用于创建\
  \ XHTML 和 CSS 图像映射（image maps）的多个教程链接，请访问 `designreviver.com/tutorials/css-image-map-techniques-and-tutorials/`。这些教程的交互程度不同，有些可能会引入超出本书范围的客户端代码，但其解释非常详尽。\n\
  \n***\n\n### 使用列表项和 CSS 创建图像映射\n\n在第 8 章中，你学习了如何使用 HTML 中的 `<map/>` 标签创建客户端图像映射。图像映射允许你定义图像区域并为该区域分配链接（而不是必须将图像切成碎片、对每个碎片应用链接，并在\
  \ HTML 中将图像缝合在一起）。然而，你也可以完全通过有效的 XHTML 和 CSS 创建图像映射。\n\n代码列表 11.2 中的代码生成的图像映射与图\
  \ 11.6 所示的类似。（代码列表 11.2 中的代码并不会生成图中所示的红色边框。边框是添加到图中以突出显示定义区域的。）当代码在 Web 浏览器中渲染时，它看起来就像一个包含图像的\
  \ 页面。只有当你的鼠标悬停在“热点”区域上时，动作才会发生。\n\n**图 11.6** CSS 允许你在图像映射中定义热点。\n\n![image](img/11fig06.jpg)\n\
  \n代码列表 11.2 使用 CSS 创建图像映射\n\n***\n\n```<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>CSS Image Map Example</title>\n    <style type=\"text/css\">\n    #theImg\
  \ {\n      width:500px;\n      height:375px;\n      background:url(tea_ship.jpg)\
  \ no-repeat;\n      position:relative;\n      border: 1px solid #000;\n    }\n \
  \   #theImg ul {\n      margin:0px;\n      padding:0px;\n      list-style:none;\n\
  \    }\n    #theImg a {\n      position:absolute;\n      text-indent: -100em;\n\
  \    }\n    #theImg a:hover {\n      border: 1px solid #ffffff;\n    }\n    #ss\
  \ {\n      top:0px;\n      left:5px;\n      width:80px;\n      height:25px;\n  \
  \  }\n    #gn {\n      top:26px;\n      left:5px;\n      width:70px;\n      height:10px;\n\
  \    }\n    #ib {\n      top:225px;\n      left:85px;\n      width:60px;\n     \
  \ height:90px;\n    }\n    #iTEA1 {\n      top:100px;\n      left:320px;\n     \
  \ width:178px;\n      height:125px;\n    }\n    #iTEA2 {\n      top:225px;\n   \
  \   left:375px;\n      width:123px;\n      height:15px;\n    }\n    </style>\n \
  \ </head>\n  <body>\n    <div id=\"theImg\">\n      <ul>\n        <li id=\"ss\"\
  ><a href=\"[some URL]\" title=\"Sugarshots\">糖分冲刺</a></li>\n        <li id=\"gn\"\
  ><a href=\"[some URL]\" title=\"Golden Needle\">金针茶</a></li>\n        <li id=\"\
  ib\"><a href=\"[some URL]\" title=\"Irish Breakfast\">爱尔兰早餐</a></li>\n        <li\
  \ id=\"iTEA1\"><a href=\"[some URL]\" title=\"IngenuiTEA\">独具妙思的茶 1</a></li>\n \
  \       <li id=\"iTEA2\"><a href=\"[some URL]\" title=\"IngenuiTEA\">独具妙思的茶 2</a></li>\n\
  \      </ul>\n    </div>\n  </body>\n</html>\n```\n\n***\n\n如代码列表 11.2 所示，样式表包含许多条目，但实际的\
  \ HTML 代码非常短。\n\n\n\n\n\n当用户的光标悬停在包含链接的列表项上时，该列表项会显示出一个 1 像素的实白色边框，这归功样式表中的这一条目：\n\
  \n```css\n#theImg a:hover {\n    border: 1px solid #ffffff;\n}\n```\n\n列表项本身根据图像中应为可点击的区域定义并放置在特定位置。例如，ID\
  \ 为 `\"ss\"` 的 `\"Sugarshots\"` 列表项（该项名称是图中显示的项目名称）——其左上角距离 `<div>` 的顶部 0 像素，距离\
  \ `<div>` 的左边缘 5 像素。该列表项宽度为 80 像素，高度为 225 像素。对于 `\"#gn\"`、`\"#ib\"`、`\"#iTEA1\"\
  ` 和 `\"#iTEA2\"` 列表项也进行了类似的样式声明，使得与这些 ID 相关的链接区域出现在相对于图像的特定位置。\n\n### 导航列表与普通列表的区别\n\
  \n当我们谈论使用列表来创建导航元素时，我们实际上是指使用 CSS 以网站访问者预期导航外观的方式显示内容——简而言之，它*不同于*简单的项目符号列表或编号列表。虽然一组导航元素本质上是一个链接列表，但这些链接通常以这种方式显示，让户户清楚他们应该与内容进行交互：\n\
  \n• 用户的鼠标光标会改变，指示该元素是可点击的。\n• 当鼠标悬停在元素上时，元素周围的区域会发生变化。\n• 内容区域在视觉上与正文隔离开。\n\n旧的导航方法往往依赖于图像——例如具有斜角边缘的图形，以及用于背景和文本的对比颜色——外加使用\
  \ JavaScript 进行客户端编程来处理基于鼠标动作的图像切换。但使用纯 CSS 从列表元素创建导航可以产生更具可用性、更灵活且对搜索引擎友好的显示效果，供各种类型设备的用户进行访问。\n\
  \n无论你的导航元素布局如何（水平或垂直），本章都讨论了两个级别的导航：主导航和次级导航。*主导航*将用户带到网站主要部分的介绍页；*次级导航*反映了特定区域内的这些页面。\n\
  \n### 使用 CSS 创建垂直导航\n\n取决于你的网站架构——包括你创建的显示模板以及你在网站中分类信息的方式——你可能会发现自己在主导航或次级导航中使用了垂直导航。\n\
  \n例如，假设你为公司创建了一个网站，主要部分有“关于我们”、“产品”、“支持”和“新闻”。在主“关于我们”部分内，你可能会有其他几个页面，例如“使命”、“历史”、“执行团队”和“联系我们”——这些其他页面就是主“关于我们”部分内的次级导航。\n\
  \n`Listing 11.3` 设置了一个基础次级页面，页面侧边有垂直导航，中间是内容。侧边的链接和页面内容区域的链接都是基础的 HTML 列表元素。\n\n\
  此列表和 `Figure 11.7` 所示示例为你提供了一个起点，展示 CSS 如何允许你将两个类似的 HTML 结构转换为两种不同的视觉显示（从而产生两种不同的上下文）。\n\
  \n**图 11.7** 起点：未样式的列表导航。\n\n![image](img/11fig07.jpg)\n\nListing 11.3 带有列表垂直导航的示例页面\n\
  \n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>About Us</title>\n    <style type=\"text/css\">\n      body {\n       \
  \   font: 12pt Verdana, Arial, Georgia, sans-serif;\n      }\n      #nav {\n   \
  \       width:150px;\n          float:left;\n          margin-top:12px;\n      \
  \    margin-right:18px;\n      }\n      #content {\n          width:550px;\n   \
  \       float:left;\n      }\n    </style>\n  </head>\n  <body>\n    <div id=\"\
  nav\">\n      <ul>\n        <li><a href=\"#\">Mission</a></li>\n        <li><a href=\"\
  #\">History</a></li>\n        <li><a href=\"#\">Executive Team</a></li>\n      \
  \  <li><a href=\"#\">Contact Us</a></li>\n      </ul>\n    </div>\n    <div id=\"\
  content\">\n      <h1>About Us</h1>\n      <p>On the introductory pages of main\
  \ sections, it can be useful to repeat the secondary navigation and provide more\
  \ context, as:</p>\n      <ul>\n        <li><a href=\"#\">Mission</a></li>\n   \
  \     <li><a href=\"#\">History</a></li>\n        <li><a href=\"#\">Executive Team</a></li>\n\
  \        <li><a href=\"#\">Contact Us</a></li>\n      </ul>\n    </div>\n  </body>\n\
  </html>\n```\n\n***\n\n此页面的内容设置在并排的 `<<div>>` 元素中：其中一个被赋予了 `id` `nav`，另一个被赋予了 `id`\
  \ `content`。分配给此页面中任何内容的样式只有与每个 `<div>` 相关的宽度、外边距和浮动值。列表元素上没有应用任何样式。\n\n为了区分内容区域列表中的链接与侧边导航中的链接，请向样式表添加以下样式：\n\
  \n```css\n#nav a {\n    text-decoration: none;\n}\n#content a {\n    text-decoration:\
  \ none;\n    font-weight: bold;\n}\n```\n\n这些样式仅表示，在 `id` 为 `nav` 的 `<div>` 中所有的\
  \ `<a>` 链接都没有下划线，而在 `id` 为 `content` 的 `<div>` 中所有的 `<a>` 链接都没有下划线且加粗。差异在 `Figure\
  \ 11.8` 中显示。\n\n**图 11.8** 使用 CSS 区分列表元素。\n\n![image](img/11fig08.jpg)\n\n但要真正让侧边导航列表与与众，你必须深入研究样式表。\n\
  \n### 为单级导航设置样式\n\n这组特定导航元素的目标仅仅是将它们呈现为一组链接块，没有项目符号，并且背景和文本颜色会根据链接状态而改变（普通链接、访问过的链接、悬停链接或激活链接）。该过程的第一步已经完成：分离导航与内容。我们通过将导航放在一个\
  \ `id` 为 `nav` 的 `<div>` 中实现了这一点。\n\n接下来，你需要修改 `nav <div>` 中定义链接的 `<ul>`。让我们去掉列表指示符并确保顶部没有额外的外边距或内边距。该顶部外边距用于将导航顶部与页面内容区域的“About\
  \ Us”标题顶部对齐：\n\n```css\n#nav ul {\n    list-style: none;\n    margin: 12px 0px 0px\
  \ 0px;\n    padding: 0px;\n}\n```\n\n由于导航列表项本身显示为颜色区域，为每个列表项添加一个底部边框，以便内容产生视觉分离：\n\
  \n```css\n#nav li {\n    border-bottom: 1px solid #ffffff;\n}\n```\n\n现在构建剩余的列表项。想法是，当列表项仅作为链接静止时，它们是特殊的蓝色并配有加粗的白色字体（尽管字体大小比正文本身小）。要实现这一点，请添加以下：\n\
  \n```css\n#nav li a:link, #nav li a:visited {\n    font-size: 10pt;\n    font-weight:\
  \ bold;\n    display: block;\n    padding: 3px 0px 3px 3px;\n}\n```\n\n\n\n\n\n\
  ```css\nbackground-color: #628794;\ncolor: #ffffff;\n}\n```\n\n之前使用的所有样式你可能已经熟悉了，但样式表条目中\
  \ `display: block;` 的用法或许。将 `display` 属性设置为 `block` 可以确保当用户将鼠标悬停在 `<li>` 元素上时，整个元素都处于激活状态。图\
  \ 11.9 显示了应用了这些新样式的垂直列表菜单。\n\n**图 11.9** 垂直列表开始看起来像一个导航菜单了。\n\n![image](img/11fig09.jpg)\n\
  \n当用户的鼠标悬停在导航列表元素上时，其目的是发生某种视觉变化，以便使用户知道该元素是可点击的。这类似于大多数软件菜单在用户光标悬停在菜单项上时改变颜色的方式。在这种情况下，我们将更改列表项的背景颜色，并更改列表项的文本颜色；它们将与之前显示的蓝色和白色不同。\n\
  \n```css\n#nav li a:hover, #nav li a:active {\n    font-size: 10pt;\n    font-weight:\
  \ bold;\n    display: block;\n    padding: 3px 0px 3px 3px;\n    background-color:\
  \ #6cac46;\n    color: #000000;\n}\n```\n\n图 11.10 显示了目前为止所有样式工作的结果。通过使用样式表中的几个条目，简单的列表已经变成了一个视觉上区分明显的菜单。\n\
  \n**图 11.10** 列表项现在当鼠标悬停在它们上时会改变颜色。\n\n![image](img/11fig10.jpg)\n\n## 为多级垂直导航设置样式\n\
  \n如果你的网站架构需要另一层你希望用户始终看到的导航，该怎么办？这可以通过嵌套列表（你已经在之前的章节中学习过）和更多的样式表条目来实现。在这种情况下，假设“执行团队”（Executive\
  \ Team）链接下有四个导航元素。在 HTML 中，按如下修改列表：\n\n```html\n<ul>\n  <li><a href=\"#\">Mission</a></li>\n\
  \  <li><a href=\"#\">History</a></li>\n  <li><a href=\"#\">Executive Team</a>\n\
  \    <ul>\n      <li><a href=\"#\">&amp;raquo; CEO</a></li>\n      <li><a href=\"\
  #\">&amp;raquo; CFO</a></li>\n      <li><a href=\"#\">&amp;raquo; COO</a></li>\n\
  \      <li><a href=\"#\">&amp;raquo; Other Minions</a></li>\n    </ul>\n  </li>\n\
  \  <li><a href=\"#\">Contact Us</a></li>\n</ul>\n```\n\n这段代码在“执行团队”链接下生成了一个嵌套列表（参见图\
  \ 11.11）。`&amp;raquo;` HTML 实体会产生在新链接文本前显示的指向右侧箭头。\n\n**图 11.11** 创建嵌套导航列表（但样式还不够良好）。\n\
  \n![image](img/11fig11.jpg)\n\n新项目以块级元素的形式出现在列表中，但信息的层级结构没有在视觉上表现出来。为了添加某种视觉元素，以标识这些项目是附属于“执行团队”链接的子导航元素，请再次修改样式表以添加一些缩进。\n\
  \n但在在此之前，也请修改一些其他的样式表条目。在上一节中，我们添加了如 `#nav ul` 和 `#nav li` 等选择器，它们分别表示“名为 `nav`\
  \ 的 `<div>` 中的所有 `<ul>`”和“名为 `nav` 的 `<div>` 中的所有 `<li>`”。然而，现在我们在名为 `nav` 的 `<div>`\
  \ 中有两个 `<ul>` 实例另一组 `<li>` ，我们希望它们与原始集合有所不同。\n\n为了确保两组列表项都得到适当的样式设置，确保样式表选择器清晰地指示列表的层级结构。为了做到这一点，对一级列表使用\
  \ `#nav ul` 和 `#nav ul li` 等条目，对第二级列表使用 `#nav ul ul` 和 `#nav ul ul li`。列表 11.4 显示了新版本的样式表条目和\
  \ HTML，它们生成了图 11.12 所示的菜单。\n\n**图 11.12** 使用 CSS 创建两级垂直导航。\n\n![image](img/11fig12.jpg)\n\
  \n### 列表 11.4 列表中的多级垂直导航\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n  <title>About\
  \ Us</title>\n  <style type=\"text/css\">\n    body {\n      font: 12pt, Arial,\
  \ Georgia, sans-serif;\n    }\n    #nav {\n      width:50px;\n      float: left;\n\
  \      margin-top:2px;\n      margin-right:18px;\n    }\n    #content {\n      width:50px;\n\
  \      float: left;\n    }\n    #nav a {\n      text-decoration: none;\n    }\n\
  \    #content a {\n      text-decoration: none;\n      font-weight: bold;\n    }\n\
  \    #nav ul {\n      list-style: none;\n      margin: 2px 0px 0px 0px;\n      padding:\
  \ 0px;\n    }\n    #nav ul li {\n      border-bottom: 1px solid #ffffff;\n    }\n\
  \    #nav li a:link, #nav li a:visited {\n      font-size: 10pt;\n      font-weight:\
  \ bold;\n      display: block;\n      padding: 3px 0px 3px 3px;\n      background-color:\
  \ #628794;\n      color: #ffffff;\n    }\n    #nav li a:hover, #nav li a:active\
  \ {\n      font-size: 10pt;\n      font-weight: bold;\n      display: block;\n \
  \     padding: 3px 0px 3px 3px;\n      background-color: #6cac46;\n      color:\
  \ #000000;\n    }\n    #nav ul ul {\n      margin: 0px;\n      padding: 0px;\n \
  \   }\n    #nav ul ul li {\n      border-bottom: none;\n    }\n    #nav ul li a:link,\
  \ #nav ul li a:visited {\n      font-size: 8pt;\n      font-weight: bold;\n    \
  \  display: block;\n      padding: 3px 0px 3px 3px;\n      background-color: #628794;\n\
  \      color: #ffffff;\n    }\n    #nav ul li a:hover, #nav ul li a:active {\n \
  \     font-size: 8pt;\n      font-weight: bold;\n      display: block;\n      padding:\
  \ 3px 0px 3px 3px;\n      background-color: #6cac46;\n      color: #000000;\n  \
  \  }\n  </style>\n</head>\n<body>\n  <div id=\"nav\">\n    <ul>\n      <li><a href=\"\
  #\">Mission</a></li>\n      <li><a href=\"#\">History</a></li>\n      <li><a href=\"\
  #\">Executive Team</a>\n        <ul>\n          <li><a href=\"#\">&amp;raquo; CEO</a></li>\n\
  \          <li><a href=\"#\">&amp;raquo; CFO</a></li>\n          <li><a href=\"\
  #\">&amp;raquo; COO</a></li>\n          <li><a href=\"#\">&amp;raquo; Other Minions</a></li>\n\
  \        </ul>\n      </li>\n      <li><a href=\"#\">Contact Us</a></li>\n    </ul>\n\
  \  </div>\n  <div id=\"content\">\n    <h1>About Us</h1>\n    <p>在主要章节的介绍页面上，重复二级导航并提供更多背景是有用的，例如：</p>\n\
  \    <ul>\n      <li><a href=\"#\">Mission</a>：更多了解我们的公司使命和慈善努力。</li>\n      <li><a\
  \ href=\"#\">History</a>：阅读我们的历史，了解我们是如何成为国家最大的部件制造商的。</li>\n      <li><a href=\"\
  #\">Executive Team</a>：我们的执行团队让公司运行得像一台润滑良好的机器（对制造部件也有帮助）。</li>\n      <li><a href=\"\
  #\">Contact Us</a>：在这里你可以找到联系我们的多种方法（我们真的很在乎你所说的话）。</li>\n    </ul>\n  </div>\n\
  </body>\n</html>\n```\n\n垂直导航的不同样式设置方法仅限于你自己的创造力。你可以使用颜色、外边距、内边距、背景图像以及任何有效的 CSS\
  \ 来产生非常灵活且易于修改的垂直导航。如果你在搜索引擎中输入 `CSS vertical navigation`，你会找到成千上万的示例——而且它们都是基于在本章中所学到的简单原理。\n\
  \n### 使用 CSS 创建水平导航\n\n\n\n\n导航课程从垂直导航开始，因为当导航看起来仍然像是一份你可以在纸上垂直书写的项目列表（例如购物清单）时，将列表转换为导航的概念就更容易理解了。在创建水平导航时，你仍然使用\
  \ `HTMLML` 列表元素，但不再通过对 `<ul>` 和 `<li>` 均使用 `display` 属性的 `inline` 值来实现垂直显示，而是改用\
  \ `display` 属性的 `block` 值。其实就这么简单。\n\n代码列表 11.5 显示了一个包含水平导航的页面的起点。该页面包含两个主要的 `<div>`\
  \ 元素：一个用于头部（header），另一个用于内容（content）。头部 `<div>` 包含一个标志 `<div>` 和一个并浮在彼此旁边的导航 `<div>`。在导航\
  \ `<div>` 中出现的列表，其列表和列表项的 `display` 属性值均为 `inline`。你可以在图 11.13 中看到这些元素及其位置。\n\n\
  **图 11.13** 使用内联列表元素创建功能性的——但不一定美观的——水平导航。\n\n![image](img/11fig13.jpg)\n\n代码列表\
  \ 11.5 来自列表的基础水平导航\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>ACME Widgets LLC</title>\n    <style type=\"text/css\">\n      body {\n\
  \        font: 12pt Verdana, Arial, Georgia, sans-serif;\n      }\n      #header\
  \ {\n        width: auto;\n      }\n      #logo {\n        float:left;\n      }\n\
  \      #nav {\n        float:left;\n      }\n      #nav ul {\n        list-style:\
  \ none;\n        display: inline;\n      }\n      #nav li {\n        display: inline;\n\
  \      }\n      #content {\n        width: auto;\n        float: left;\n       \
  \ clear: left;\n      }\n      #content a {\n        text-decoration: none;\n  \
  \      font-weight: bold;\n      }\n    </style>\n  </head>\n  <body><body>\n  \
  \  <div id=\"header\">\n      <div id=\"logo\">\n          <img src=\"acmewidgets.jpg\"\
  \ alt=\"ACME Widgets LLC\" />\n      </</div>\n      <div id=\"nav\">\n        <ul>\n\
  \          <li><a href=\"#\">关于我们 (About Us)</a></li>\n          <li><a href=\"\
  #\">产品 (Products)</a></li>\n          <li><a href=\"#\">支持 (Support)</a></li>\n\
  \          <li><a href=\"#\">媒体 (Press)</a></li>\n        </ul>\n      </</div>\n\
  \    </div>\n    <div id=\"content\">\n      <p><strong>ACME LLC</strong> 是这片土地上最伟大的部件制造商。</p>\n\
  \      <p>不相信我们吗？请继续往下看...</p>\n      <ul>\n        <li><a href=\"#\">关于我们 (About\
  \ Us)</a>: 我们非常棒。</li>\n        <li><a href=\"#\">产品 (Products)</a>: 我们的产品是最好的。</li>\n\
  \        <li><a href=\"#\">支持 (Support)</a>: 你可能不需要支持，但我们还是提供了它。</li>\n        <li><a\
  \ href=\"#\">媒体 (Press)</a>: 读读他人的评价（关于我们有多棒）。</li>\n      </ul>\n    </div>\n \
  \ </body>\n</html>\n```\n\n修改此列表的显示方式完全通过 CSS 实现；`HTML` 内部内容的结构已经设置好。要实现所需的显示效果，请使用以下\
  \ CSS。首先，将 `id` 为 `nav` 的 `<div>` 修改为特定的宽度，显示背景颜色和边框，并使用 85 像素的顶部外边距（使其显示在标志附近）。\n\
  \n```css\n#nav {\n  float:left;\n  margin: 85px 0px 0px 0px;\n  width: 400px;\n\
  \  background-color: #62794;\n  border: 1px solid black;\n}\n```\n\n`<ul>` 的定义与代码列表\
  \ 11.5 相同，但外边距（margin）和内边距（padding）发生了：\n\n```css\n#nav ul {\n  margin: 0px;\n \
  \ padding: 0px;\n  list-style: none;\n  display: inline;\n}\n```\n\n`<li>` 的定义与代码列表\
  \ 11.5 相同，但它被赋予了 `1.8em` 的 `line-height` 值：\n\n```css\n#nav li {\n  display: inline;\n\
  \  line-height: 1.8em;\n}\n```\n\n链接样式与垂直导航中使用的相似；这些项目具有不同的内边距（padding）值，但颜色和字体大小保持不变：\n\
  \n```css\n#nav li a:link, #nav li a:visited {\n  font-size: 10pt;\n}\n```\n\n（注：此处根据原文逻辑，将这些样式结合就能产生图\
  \ 11.14 所示的效果。）\n\n*注：原文在此处的 CSS 代码片段似乎不完整或存在断层，根据上下文语意，我翻译了其描述部分，并保持了逻辑。此处补全后的\
  \ CSS 逻辑如下：*\n\n```css\n#nav li a:link, #nav li a:visited {\n  font-size: 10pt;\n\
  \  font-weight: bold;\n  text-decoration: none;\n  padding: 10px 7px;\n  background-color:\
  \ #62794;\n  color: #ffffff;\n}\n\n#nav li a:hover, #nav li a:active {\n  font-size:\
  \ 10pt;\n  font-weight: bold;\n  text-decoration: none;\n  padding: 7px 10px;\n\
  \  background-color: #c6a648;\n  color: #000000;\n}\n```\n\n将这些样式结合在一起，你就能产生图 11.14\
  \ 所示的效果。\n\n**图 11.14** 使用样式创建的水平导航。\n\n\n\n\n\n## A. `<map/>` 标签一点也不坏，它在 XHTML\
  \ 和 HTML5 中都是有效的。然而，客户端图像映射（image maps）中使用的坐标确定可能非常困难，特别是当没有图形软件或专门用于创建客户端图像映射的软件时。CSS\
  \ 版本为你定义和显示可点击区域提供了更多选项，而你在这里只看到了其中一种。\n\n## Q. 我可以在导航菜单中使用图形作为自定义的列表指示器吗？\n\n##\
  \ A. 可以。你可以在列表项（list item）的 HTML 文本中使用图形，或者将其作为 `<li>` 元素内的背景图像。你可以像样式任何其他列表元素一样样式你的导航元素。HTML\
  \ 无序列表与基于 CSS 的水平或垂直导航列表之间的唯一区别在于，你称其为导航列表，并且你在正文之外的特定用途使用了该无序列表。此外，你还可以对列表进行样式处理，告诉用户它确实与众不同——你可以通过小图形来突出你的列表。\n\
  \n## Q. 我可以在哪里找到更多关于列表可以做些什么的示例？\n\n## A. 在我上一次检查时，在搜索引擎中输入 `CSS navigation` 大约返回了\
  \ 4400 万条结果。这里有几个起点：\n\n- List Apart 的 CSS 文章，位于 [`www.alistapart.com/topics/code/`](http://www.alistapart.com/topics/code/)\n\
  - Maxdesign 的 CSS Listamatic，位于 [`css.maxdesign.com.au/listamatic/`](http://css.maxdesign.com.au/listamatic/)\n\
  - Vitaly Friedman 的 CSS Showcase，位于 [`www.alvit.de/css-showcase/`](http://www.alvit.de/css-showcase/)\n\
  \n## 工作坊\n\n本工作坊包含测验题和活动，帮助你巩固对所涵盖内容的理解。在查看随后的“[答案”之前，尝试回答所有问题。\n\n## 测验\n\n**1.**\
  \ `inside` 和 `outside list-style-position` 属性值之间的区别是什么？哪一个是默认值？\n\n**2.** 值为 `none`\
  \ 的 `list-style` 是否仍然产生结构化列表（无论是有序还是无序的）？\n\n**3.** 在创建基于列表的导航时，你可以使用多少层嵌套列表？\n\n\
  **4.** 在创建任何类型的导航列表时，`a` 选择器的四个伪类可以具有相同的值吗？\n\n## 答案\n\n**1.** `list-style-position`\
  \ 的属性值 `inside` 将列表项指示器放置在列表项创建的块内部。`outside` 值将列表项指示器放置在块外部。当为 `inside` 时，内容会环绕在列表项指示器的下方。默认值是\
  \ `outside`。\n\n**2.** 是。唯一的区别是列表项内部的内容前没有列表项指示器。\n\n**3.** 从技术上讲，你可以根据需要无限深度嵌套列表。但从可用性的角度来看，你*想要*用于嵌套列表的层数是有限制的。三层通常是极限——超过这个数字，你就有可能创建一个组织混乱的网站，或者简单地给用户提供了比他们一直需要看到的多多的选项。\n\
  \n**4.** 当然，但这样你可能会面临用户没有意识到你精美的菜单确实是菜单的风险（因为鼠标操作不会产生任何视觉显示）。\n\n### 练习题\n\n- 找到一张图片，并使用本章所示的方法尝试对区域进行映射。选择一张可以使用热点（hot\
  \ spots）或指向你网站其他页面或他人网站的可点击区域的图片。然后，创建 HTML 和 CSS 来定义可点击区域以及它们应该指向的 URL。\n- 使用本章所示的多级垂直列表技术，为章节末尾创建的垂直列表添加子导航项。\n\
  - 查看网站中大量的基于 CSS 的导航示例，并寻找一些看起来复杂的动作。使用 浏览器的“查看源代码”功能，查看这些网站使用的 CSS，并尝试为自己实现类似的内容。\n\
  \n## 第 12 章。创建固定或流式布局\n\n你将在本章中学到：\n\n- 固定布局是如何工作的\n- 流式布局（liquid layouts）是如何工作的\n\
  - 如何创建固定/流式混合布局\n\n到目前，你已经学习了许多关于 Web 内容设计的知识，从字体大小、颜色到图像、块元素、列表等。但尚未讨论的是页面布局的高级概述。通常情况下，布局有两种类型——固定布局（fixed）和流式布局（liquid），但还有一种两者结合的布局，其中某些元素是固定的，而另一些元素是流式的。\n\
  \n在本章中，你将首先学习这两种布局的特征，并看到一些使用它们的网站示例。在章节结束处，你将看到一个结合了这两种布局元素的基础模板。最终，决定使用哪种布局类型取决于你——只要你的网站遵循\
  \ HTML 和 CSS 标准，就很难出错。\n\n#### 尝试一试：寻找你喜欢的布局示例\n\n寻找流式布局示例的一个好地方是 WordPress 主题库：[`wordpress.org/extend/themes/`](http://wordpress.org/extend/themes/)。WordPress\
  \ 是一个博客平台，它作为非博客工具的使用正日益增加。该主题库展示了固定宽度和流式布局的数百个示例，让你对可以创建的内容有一个概念。尽管你在练习中没有使用 WordPress，但请花时间查看\
  \ WordPress 的示例，可能还可以查看 [`www.csszarden.com/`](http://www.csszarden.com/) 的 CSS\
  \ Zen Garden。这可以帮助你在不受布局内内容影响的情况下，感受你喜欢的布局类型。\n\n### 理解固定布局\n\n固定布局（或固定宽度布局）顾如其名：页面主体被设置为特定宽度的布局。该宽度通常由一个包含内容的父“容器”`div`\
  \ 控制。该 `div` 的宽度属性可以在样式中设置，也可以在样式表中设置（如果该 `div` 被赋予了类似 `main` 或 `wrapper` 的 ID 值）。\n\
  \n在创建固定宽度布局时，最重要的决定是确定要适应的最小分辨率。多年来，800×600 一直是 Web 设计师的“最低标准”，导致典型的宽度约为 760 像素。然而，自\
  \ 2007 年以来，使用 800×600 屏幕的人数少于 8%（目前为 4%）。鉴于此，许多 Web 设计师将 1024×768 视为目前的最小分辨率，从而产生了\
  \ 800 到 1000 像素之间的固定宽度设计。\n\n### 注意\n\n记住，浏览器窗口包含不可见区域，包括滚动条。因此，如果你目标是 1024 像素宽的屏幕分辨率，你实际上无法使用全部\
  \ 1024 个像素。\n\n创建固定宽度布局的主要原因之一是为了让你对内容区域的外观进行精确控制。然而，如果用户使用比你设计时设想的更小或更大的分辨率访问你的固定宽度网站，他们可能会遇到滚动条（如果分辨率较小）或大量的空白区域（如果分辨率较大）。\n\
  \n\n\n\n\n当前的 [ESPN.com](http://ESPN.com) 首页提供了该问题的一个视觉示例；其内容区域固定为 964 像素宽。在图 12.1\
  \ 中，浏览器窗口宽度略小于 800 像素。在图片的右侧，重要内容被截断了（在图片的底部，浏览器显示了水平滚动条）。\n\n**图 12.1** 适用于较小屏幕尺寸的固定宽度示例。\n\
  \n![image](img/12fig01.jpg)\n\n然而，图 12.2 显示了当浏览器窗口超过 1400 像素时，该网站的样观：主体内容区域两侧有大量的空白区域（或“版面”）。\n\
  \n**图 12.2** 适用于较大屏幕尺寸的固定宽度示例。\n\n![image](img/12fig02.jpg)\n\n创建固定宽度布局时，还有另一个考虑因素：是将内容左对齐还是居中。将内容左对齐只会在右侧产生额外空间；而内容区域区域则会在两侧都产生额外空间。\n\
  \n### 理解流体布局（Liquid Layouts）\n\n*流体布局*（liquid layout）——也称为弹性布局——是指页面主体不使用指定的像素宽度，尽管它可能被包含在一个使用百分比宽度的主“容器”\
  \ `<div>` 中。流体布局的理念是，即使使用户的屏幕非常小或非常宽，它也可以保持完美的使用性，并保留整体的设计美感。\n\n流体布局运行的三个示例显示在图\
  \ 12.3、12.4 和 12.5 中。\n\n**图 12.3** 在较小屏幕上看到的流体布局。\n\n![image](img/12fig03.jpg)\n\
  \n**图 12.4** 在非常小的屏幕上看到的流体布局。\n\n![image](img/12fig04.jpg)\n\n**图 12.5** 在宽屏上看到的流体布局。\n\
  \n![image](img/12fig05.jpg)\n\n在图 12.3 中，浏览器窗口宽度约为 770 像素。这个示例显示了水平滚动条出现之前合理的最小屏幕宽度。事实上，只有当浏览器宽度达到\
  \ 735 像素时，滚动条才会出现。另一方面，图 12.4 显示了一个非常小的浏览器窗口（545 像素宽）。\n\n在图 12.4 中，你可以看到水平滚动条；在页面内容的页眉区域，Logo\
  \ 图形开始占据文本并显示在文本上方。但页面大部分部分仍然非常可用。页面左侧的信息性内容仍然可见，并且它与右侧的输入表单共享可用空间。\n\n图 12.5 显示了同一个页面在极宽屏幕上的样子。\n\
  \n在图 12.5 中，浏览器窗口宽度约为 1330 像素。页面上的所有内容都有足够的空间展开。这种流体布局之所以实现，是因为所有设计元素都指定了百分比宽度（而不是固定宽度）。通过这种方式，布局利用了所有可用的浏览器空间。\n\
  \n流体布局方法乍看似乎是最佳方案——毕竟，谁不想利用所有可用的屏幕空间呢？利用空间与不让内容（所谓的）“呼吸”之间存在着微妙的界限。内容过多会让人无所从从；开放空间内内容太少则会显得平淡。\n\
  \n纯流体布局可能非常令人深刻，但它需要大量的测试，以确保它在不同屏幕分辨率的各种浏览器中都是可用的。你可能没有精力和精力制作这样的设计；在这种情况下，一种合理的折中方案是固定/流体混合布局。\n\
  \n### 创建固定/流体混合布局\n\n*固定/流体混合*（fixed/liquid hybrid）布局包含两种类型布局的元素。例如，你可以有一个流体布局，其中包含固定宽的内容区域，可以位于主体区域内，也可以作为锚元素（例如左侧栏或顶部导航条）。你甚至可以创建一个像框架一样的固定内容区域，正如你在第\
  \ 20 章“[使用窗口和框架”中所看到的，在那里，即使使用户滚动内容，固定内容区域也保持固定不变。\n\n#### 从基础布局结构开始\n\n在这个示例中，你将学习创建一个流体模板，但在主体区域的两侧有两个固定宽的列（如果你仔细想的话，这是第三列，只是比其他列宽得多）。该模板还具有明确定义的页眉和页脚区域。代码列表\
  \ 12.1 显示了基础 HTML 结构。\n\n代码列表 12.1 固定/流体布局结构\n\n```html\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\"\
  >\n<html lang=\"en\">\n<head>\n    <title>Sample Layout</title>\n    <link href=\"\
  layout.css\" rel=\"stylesheet\" type=\"text/css\"/>\n</head>\n<body>\n    <div id=\"\
  header\">HEADER</div>\n    <div id=\"wrapper\">\n        <div id=\"content_area\"\
  >CONTENT</div>\n        <div id=\"left_side\">LEFT SIDE</div>\n        <div id=\"\
  right_side\">RIGHT SIDE</div>\n    </div>\n    <div id=\"footer\">FOOTER</div>\n\
  </body>\n</html>\n```\n\n首先，注意样式表是通过 `<link>` 标签链接的，而不是包含在模板中。接下来，你会发现 HTML 仅仅是：极其基础。你通过代码列表\
  \ 12.1 中的 HTML 实际拥有的只是你想要包含的内容区域标识。\n\n在此阶段，layout.css 文件仅包含以下条：\n\n```css\nbody\
  \ {\n    margin:0;\n    padding:0;\n}\n```\n\n如果你查看代码列表 12.1 中的 HTML 并对自己说“但那些 `<div>`\
  \ 元素只会堆叠在一起”，你是正确的。正如图 12.6 所示，没有任何布局可言。\n\n**图 12.6** 未应用样式的 <div> 元素的基础 HTML 模板。\n\
  \n![image](img/12fig06.jpg)\n\n#### 在固定/流体布局中定义列\n\n我们可以先从简单的部分开始。因为这种布局应该是流体的，我们知道无论窗口有多窄或宽，页眉和页脚区域的任何内容都会扩展窗口的宽度。\n\
  \n在样式表中添加以下代码可以让页眉和页脚区域各获得 100% 的宽度以及相同的背景颜色：\n\n```css\n#header {\n    float: left;\n\
  \    width: 100%;\n    background-color: #7152F4;\n}\n\n#footer {\n    float: left;\n\
  \    width: 100%;\n    background-color: #7152F4;\n}\n```\n\n现在事情变得有点复杂。我们需要定义页面两侧的两个固定列，加上中间的列。在\
  \ HTML 中，注意有一个围绕这三列的 `<div>`，它被称为 `wrapper`。该元素的定义如下：\n\n```css\n#wrapper {\n  \
  \  float: left;\n    padding-left: 200px;\n}\n```\n\n\n\n\n\n```css\npadding-right:\
  \ 125px;\n}\n```\n\n使用这两个 `padding` 定义本质上是为了为页面左右两侧的两个固定宽度列留出空间。左侧列宽为 200 像素，右侧列宽为\
  \ 125 像素，且每个列具有不同的背景颜色。但我们还必须将元素相对于在 HTML 保持无样式时可能所在的位置进行定位（参见图 12.6）。这意味着要在这些列的每个样式表条目中添加\
  \ `position: relative`。此外，我们指明 `<div>` 元素应该向左浮动（float）。\n\n但在 `left_side <div>`\
  \ 的情况下，我们还指明希望最右侧的外边距边缘距离边缘内 200 像素。（这在列被定义为 200 像素宽之外是额外的。）我们还希望左侧的外边距为完全的负外边距（negative\
  \ margin）；这将将其拉回到位（正如你很快将的那样）。`right_side <div>` 不包含 `right` 的值，但它在右侧包含了一个负外边距：\n\
  \n```css\n#left_side {\n  position: relative;\n  float: left;\n  width: 200px;\n\
  \  background-color: #52f471;\n  right: 200px;\n  margin-left: -100%;\n}\n\n#right_side\
  \ {\n  position: relative;\n  float: left;\n  width: 125px;\n  background-color:\
  \ #f452d5;\n  margin-right: -125px;\n}\n```\n\n此时，让我们也定义内容区域，使其具有白色背景，占据 100% 的可用区域，并相对于其位置向左浮动：\n\
  \n```css\n#content_area {\n  position: relative;\n  float: left;\n  background-color:\
  \ #ffffff;\n  width: 100%;\n}\n```\n\n此时，基础布局看起来将像图 12.7 所示所示，区域划分清晰。\n\n**图 12.7**\
  \ 放置了一些样式后的基础 HTML 模板。\n\n![image](img/12fig07.jpg)\n\n然而，如果窗口缩减到某个宽度以下，这个模板就会出现问题。因为左列宽为\
  \ 200 像素，右侧列宽为 125 像素，且你希望内容区域至少包含一些文本，你可以想象如果窗口宽度只有 350 到 400 像素，此页面将会崩溃。图 12.8\
  \ 显示了当窗口缩放到恰好小于 400 像素宽（确切说是 390 像素）时发生的情况。\n\n**图 12.8** 缩放到 400 像素以下的 基础 HTML\
  \ 模板：糟糕！\n\n![image](img/12fig08.jpg)\n\n### 设置布局的最小宽度\n\n尽管用户不太可能使用小于 400 像素的浏览器访问你的网站，但这个示例在本书的范围内起到了作用。你可以推断并广泛应用这些信息：即使在固定/流混合网站中，除非你采取某些措施，否则你的布局会在某一点发生崩溃。\n\
  \n那“某些措施”就是使用 `min-width` 属性。`min-width` 属性设置元素的最小宽度，不包括内边距、边框或外边距。图 12.9 显示了当 `min-width`\
  \ 应用于 `<body>` 元素时发生的情况。\n\n图 12.9 显示了向右滚动后右侧列的一点点，但关键点是当缩小到最小宽度以下时，布局不会崩溃。在这种情况下，最小宽度为\
  \ 525 像素：\n\n```css\nbody {\n  margin: 0;\n  padding: 0;\n  min-width: 525px;\n\
  }\n```\n\n**图 12.9** 缩放到 400 像素以下的 基础 HTML 模板：更好！\n\n![image](img/12fig09.jpg)\n\
  \n此示例中出现水平滚动条是因为浏览器窗口本身小于 500 像素宽。当窗口略大于 525 像素宽时，滚动条会消失，当浏览器约为 875 像素宽时，它就完全消失了（参见图\
  \ 12.10）。\n\n**图 12.10** 在宽于 800 像素的浏览器窗口中查看的基础 HTML 模板。\n\n![image](img/12fig10.jpg)\n\
  \n### 在固定/流混合布局中处理列高度\n\n这个示例很好，但存在一个问题：它没有内容。当内容被添加到各种元素中时，会产生更多问题。如图 12.11 所示，列的高度将变得与其包含的内容一样高。\n\
  \n**图 12.11** 列的高度仅取决于其内容。\n\n![image](img/12fig.jpg)\n\n由于你无法依赖用户的浏览器高度，或者认为内容总是保持不变，你可能会认为这在固定/流布局中存在问题。如果你认为在框之外还有空间，可以应用一些样式来将它们结合在一起。首先，为\
  \ `left_side`、`right_side` 和 `content_area` 标识添加以下声明：\n\n```css\nmargin-bottom:\
  \ -200px;\npadding-bottom: 2000px;\n```\n\n这些声明添加了大量的内边距。你还必须在样式表中为页脚添加 `position:\
  \ relative`，以便它是可见的。此时，页面看起来像图 12.12 所示——尽管这不是我们想要的，但更接近了。\n\n**图 12.12** 列的内容现在是可见的。\n\
  \n为了裁剪掉所有额外的颜色，为 `wrapper` 标识添加以下代码：\n\n```css\noverflow: hidden;\n```\n\n图 12.13\
  \ 显示了最终结果：具有必要间距的固定/流布局。\n\n**图 12.13** 恭喜！这是一个固定/流布局。\n\n![image](img/12fig.jpg)\n\
  \n完整的 HTML 代码可以在列表 12.2 中看到，最终样式表可以在列表 12.3 中显示。\n\n#### 列表 12.2 基础固定/流布局（带内容）\n\
  \n\n\n\n\n立即行动！\n\n</div>\n\n</div>\n\n<div id=\"footer\"> 版权信息通常位于此地。</div>\n\n\
  </body>\n\n</html>\n\n***\n\n列表列表 12.3 固定/流式混合布局的完整样式表\n\n***\n\n```css\nbody {\n\
  \  margin:0;\n  padding:0;\n  min-width: 525px;\n}\n\n#header {\n  float: left;\n\
  \  width:100%;\n  background-color: #ffffff;\n}\n\n#footer {\n  float: left;\n \
  \ width:100%;\n  background-color: #7152f4;\n  font-size: 8pt;\n  font-weight: bold;\n\
  \  text-align: center;\n  position: relative;\n}\n\n#wrapper {\n  float: left;\n\
  \  padding-left: 200px;\n  padding-right: 125px;\n  overflow: hidden;\n}\n\n#left_side\
  \ {\n  position: relative;\n  float: left;\n  width: 200px;\n  background-color:\
  \ #52f471;\n  right: 200px;\n  margin-left: -100%;\n  padding-bottom: 2000px;\n\
  \  margin-bottom: -2000px;\n}\n\n#right_side {\n  position: relative;\n  float:\
  \ left;\n  width: 125px;\n  background-color: #f452d5;\n  margin-right: -125px;\n\
  \  padding-bottom: 2000px;\n  margin-bottom: -2000px;\n}\n\n#content_area {\n  position:\
  \ relative;\n  float: left;\n  background-color: #ffffff;\n  width: 100%;\n  padding-bottom:\
  \ 2000px;\n  margin-bottom: -2000px;\n}\n\n#left_side ul {\n  list-style: none;\n\
  \  margin: 12px 0px 0px 12px;\n  padding: 0px;\n}\n\n#left_side li a:link, #nav\
  \ li a:visited {\n  font-size: 12pt;\n  font-weight: bold;\n  padding: 3px 0px 3px\
  \ 3px;\n  color: #000000;\n  text-decoration: none;\n  display: block;\n}\n\n#left_side\
  \ li a:hover, #nav li a:active {\n  font-size: 12pt;\n  font-weight: bold;\n  padding:\
  \ 3px 0px 3px 3px;\n  color: #ffffff;\n  text-decoration: none;\n  display: block;\n\
  }\n```\n\n***\n\n## 总结\n\n在本章中，你看到了三种主要布局类型的实用示例：固定布局、流式布局以及固定/流式混合布局。在章的第三部分，你看到了了一个扩展示例，它带你一步步完成了固定/流式混合布局的，其中\
  \ HTML 和 CSS 均能通过验证。请记住，创建布局最重要的部分是确定你认为在设计中可能需要考虑的内容区域。\n\n## 问答\n\n**Q. 我听过一种叫\
  \ `弹性布局（elastic layout）` 的东西。它和流式布局有什么区别？**\n\n**A.** 弹性布局是一种内容区域在用户调整文本大小时也随之调整大小的布局。弹性布局使用\
  \ `ems`，这种单位本质上与文本和字体大小成比例。`em` 是一种排版测量单位，等于当前字体的字号。在弹性布局中使用 `ems` 时，如果用户通过按 Ctrl\
  \ 键并使用鼠标滚轮强制增大或缩小文本尺寸，包含文本的区域也会按比例增大或减小。弹性布局非常难以实现，而且由于完善它们需要花费大量时间，它们更多地出现在作品集中，而非实际项目实践中。\n\
  \n**Q. 你花了很多时间讨论流式布局或混合布局。它们比纯固定布局好吗？**\n\n**A.** “更好”是一个主观的术语；在本书中，关注的是符合标准的代码。大多数设计师会告诉你，流式布局的创建（和完善）需要更长时间，但可用性的提升是值得的。什么时候这种投入是不值得的？如果你的客户没有意见，而且他们支付的是固定费用而非按小时计费。\n\
  \n\n\n\n\n• **Ruby**—[`www.ruby-lang.org/`](http://www.ruby-lang.org/)\n\n### 注意\n\
  \n尽管名称相同，但 `JavaScript` 并不是名为 `Java` 的面向对象编程语言的派生版本或其他任何亲戚。`Java` 由 Sun Microsystems\
  \ 于 1995 年发布，与服务器端脚本语言 `JSP` 密切相关。`JavaScript` 由 Netscape Communications 同样于 1995\
  \ 年创建，命名是为了表示在外观上与 `Java` 相似，但两者之间没有直接联系。\n\n另一方面，`client-side scripting`（客户端脚本）指的是运行在你的\
  \ 浏览器中的脚本；脚本的运行不需要与网络服务器进行交互。到目前为止，最流行的客户端脚本语言是 `JavaScript`。多年来，研究表明超过 93% 的所有\
  \ 浏览器都启用了 `JavaScript`。\n\n另一个客户端脚本语言是微软的 `VBScript`（Visual Basic 脚本版）。这种语言仅适用于\
  \ Microsoft Internet Explorer 网页浏览器，因此，除非你确定用户将使用该网页浏览器访问你的网站（例如在封闭的内部环境中），否则不应使用它。\n\
  \n## 在 HTML 中引入 JavaScript\n\n本章的大部分内容是对第 4 章的复；我认为在完成 HTML 和 CSS 章节之后、开始重型客户端应用程序编程之前，回顾一些\
  \ `JavaScript` 的基础是一个好主意。\n\n如果你还记得，`JavaScript` 代码可以存在于文件中的两个地方之一：\n\n• 在具有 `.js`\
  \ 扩展名的独立文件中\n- 直接在你的 HTML 文件中\n\n外部文件通常用于脚本库（你可以在许多页面中重用的代码），而直接出现在 HTML 文件中的代码往往用于实现特定于这些页面的功能。无论你的\
  \ `JavaScript` 存放在何处，浏览器都会通过使用 `<script></script>` 标签对来感知它的存在。\n\n当你将 `JavaScript`\
  \ 存储在外部文件中时，按如下方式引用：\n\n```html\n<script type=\"text/javascript\" src=\"/path/to/script.js\"\
  >\n```\n\n这些 `<script></script>` 标签通常放置在 `<head></head>` 标签之间，因为从严格来说来说，它们不属于页面\
  \ `<body>` 的内容。相反，`<script>` 提供了一组 `JavaScript` 函数或其他信息，页面的其余部分可以使用这些信息。不过，你也可以只需将\
  \ `JavaScript` 函数或代码片段封装在 `<script>` 中，并根据需要放在页面的任何地方。列表 13.1 显示了一个放置在 HTML 文档 `<body>`\
  \ 中的 `JavaScript` 代码段示例。\n\n列表 13.1 使用 JavaScript 打印某些文本\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>JavaScript Example</title>\n  </head>\n\
  \  <body>\n    <h1>JavaScript Example</h1>\n    <p>This text is HTML.</p>\n    <script\
  \ type=\"text/javascript\">\n      <!-- 向旧版浏览器隐藏脚本\n      document.write('<p>This\
  \ text comes from JavaScript.</p>');\n      // 停止隐藏脚本 -->\n    </script>\n  </body>\n\
  </html>\n```\n\n在 `<script></script>` 标签之间是一个单一的 `JavaScript` 命令，它输出以下 HTML：\n\n\
  ```html\n<p>This text comes from JavaScript.</p>\n```\n\n当浏览器渲染此 HTML 页面时，它看到 `<script></script>`\
  \ 标签之间的 `JavaScript`，停止毫秒以执行该命令，然后返回渲染输出，该输出现在包含了来自 `JavaScript` 命令的 HTML 输出。图 13.1\
  \ 显示该页面的外观与其他任何 HTML 页面一样。它是一个 HTML 页面，但 HTML 的一小部分来自 `JavaScript` 命令。\n\n**图 13.1**\
  \ `JavaScript` 代码段的输出看起来与其他任何输出一样。\n\n![image](img/13fig01.jpg)\n\n### 注意\n\n你可能注意到了列表\
  \ 13.1 中的这两行代码：\n\n```html\n<!-- 向旧版浏览器隐藏脚本\n// 停止隐藏脚本 -->\n```\n\n这是一个 HTML 注释。`<!--`\
  \ 开始和 `-->` 结束之间的任何内容在源代码中均可见，但不会被浏览器渲染。在这种情况下，`JavaScript` 代码被 HTML 注释包围，以防访问者运行的是非常旧的网络浏览器或关闭了\
  \ `JavaScript`。\n\n## 显示随机内容\n\n你可以使用 `JavaScript` 在每次加载页面时显示不同的内容。也许你有一组文本或图像，你觉得它们足够有趣可以包含在你的页面中？\n\
  \n我非常迷恋好的名言。如果你和我一样，你可能会发现将不断变化的引言整合到你的网页中是有趣的。要创建一个每次加载时都变化引言的页面，你必须首先收集所有的名言以及它们各自的来源。然后，你把这些名言放入一个\
  \ `array`（数组），它是编程语言中一种特殊的存储单元，便于存放项目列表。在名言加载到 `array` 之后，用于随机提取引言的 `JavaScript`\
  \ 代码非常简单。你已经见过了将输出打印到你的 HTML 中的代码段。列表 13.2 包含了一个每次加载都显示随机引言的网页的完整 HTML 和 `JavaScript`\
  \ 代码。\n\n列表 13.2 随机引言网页\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Quotable Quotes</title>\n    <script type=\"text/javascript\">\n      <!--\
  \ 向旧版浏览器隐藏脚本\n      function getQuote() {\n        // 创建数组\n        quotes = new\
  \ Array(4);\n        sources = new Array(4);\n        // 初始化引言数组\n        quotes[0]\
  \ = \"When I was a boy of 14, my father was so ignorant...but when I got to 21,\
  \ I was astonished how much he had learned in 7 years.\";\n        sources[0] =\
  \ \"Mark Twain\";\n        quotes[1] = \"Everybody is ignorant. Only different subjects.\"\
  ;\n        sources[1] = \"Will Rogers\";\n        quotes[2] = \"They say such nice\
  \ things about people at their funerals that it makes me sad that I'm going to miss\
  \ mine by a few days.\";\n        sources[2] = \"Garrison Keilor\";\n        quotes[3]\
  \ = \"What's another word for thesaurus?\";\n        sources[3] = \"Steven Wright\"\
  ;\n        // 获取数组的随机索引\n        i = Math.floor(Math.random() * quotes.length);\n\
  \        // 将引言写入 HTML\n        document.write(\"<dl style='background-color: lightpink'>\\\
  n\");\n        document.write(\"<dt>\" + \"\\\"<em>\" + quotes[i] + \"</em>\\\"\\\
  n\");\n        document.write(\"<dd>\" + \"- \" + sources[i] + \"\\n\");\n     \
  \   document.write(\"<dl>\\n\");\n      }\n      // 停止隐藏脚本 -->\n    </script>\n\
  \  </head>\n  <body>\n    <h1>Quotable Quotes</h1>\n    <p>接下来是一个随机引言。要看新的引言请刷新此页面。</p>\n\
  \    <script type=\"text/javascript\">\n      <!-- 向旧版浏览器隐藏脚本\n      getQuote();\n\
  \      // 停止隐藏脚本 -->\n    </script>\n  </body>\n</html>\n```\n\n虽然这段代码看起来很长，但如果你仔细观察，你会发现它的大部分内容都是要在页面上显示的四个引言。在忽略长度因素后，这些代码本身并不算复杂。\n\
  \n在第一组 `<script></script>` 标签之间的大量代码创建了一个名为 `getQuote()` 的函数。在定义函数后，可以在页面的其他地方调用它。注意，如果该函数存在于外部文件中，则可以在所有页面中调用该函数。\n\
  \n\n\n\n如果你仔细观察代码，你会看到类似下面的几行：\n\n```\n// Create the arrays\n```\n\n以及\n\n```\n\
  // Initialize the arrays with quotes\n```\n\n这些是代码注释。开发者使用这些注释在代码中留下备注，以便任何阅读代码的人都能了解代码在特定位置在做什么。在第一个关于创建数组的注释之后，你可以看到创建两个数组——一个名为\
  \ `quotes`，另一个名为 `sources`——它们都包含四个元素：\n\n```\nquotes = new Array(4);\nsources =\
  \ new Array(4);\n```\n\n在第二个注释（关于用引号初始化数组）之后，数组中被添加了四个项目。我们将仔细观察其中之一，即来自马克·吐莱因（Mark\
  \ Twain）的第一句名言：\n\n```javascript\nquotes[0] = \"When I was a boy of 14, my father\
  \ was so \" +\n\"ignorant...but when I got to be 21, I was astonished at \" +\n\"\
  how much he had learned in 7 years.\";\nsources[0] = \"Mark Twain\";\n```\n\n你已经知道数组的名为\
  \ `quotes` 和 `sources`。但（在此情况下）赋值的变量被称为 `quotes[0]` 和 `sources[0]`。因为 `quotes` 和\
  \ `sources` 是数组，数组中的每个项目将有自己的位置。当使用数组时，数组中的第一个项目不在 #1 槽；而是在 #0 槽。换句话说，你从 0 开始计数而不是\
  \ 1。因此，第一句引言的文本（值）被赋值给 `quotes[0]`（一个变量）。同样，第一个来源的文本被赋值给 `source[0]`。\n\n文本字符串由引号。然而，在\
  \ JavaScript 中，换行表示命令的结束，因此以下内容会导致代码出现问题：\n\n```javascript\nquotes[0] = \"When I\
  \ was a boy of 14, my father was so\nignorant...but when I got to be 21, I was astonished\
  \ at\nhow much he had learned in 7 years.\";\n```\n\n因此，你会看到字符串是由系列用引号括起来的字符串构建，并用加号（`+`）连接这些字符串。\n\
  \n下一段代码看起来最像编程；这行代码获取一个随机数：\n\n```javascript\ni = Math.floor(Math.random() * quotes.length);\n\
  ```\n\n但你不能随便选一个随机数，因为随机数的目的是确定应该打印哪句引言和来源——而只有四句引言。所以，这行 JavaScript 执行了以下操作：\n\n\
  - 使用 `Math.random()` 获取一个 0 到 1 之间的随机数。例如，0.5482749 可能是 `Math.random()` 的结果。\n-\
  \ 将随机数乘以 `quotes` 数组的长度，当前长度为 4；数组的长度是数组中元素的数量。如果随机数是 0.5482749（如之前所示），乘以 4 的结果是\
  \ 2.1930996。\n- 使用 `Math.floor()` 将结果向下取整到最近的整数。换句话说，2.1930996 变为 2。\n- 给变量 `i`\
  \ 赋值为 2。\n\n该函数的其余部分看起来很熟悉，但有几个例外。首先，正如你在本章早些时候学到的，`document.write()` 用于写入 HTML，然后由浏览器进行渲染。接下来，字符串被分开，以清楚何时需要以不同的方式处理，例如在应该字面打印引号时使用反斜杠转义引号（\\\
  ”)或者在替换变量值时。打印的实际引言和来源是与 `quotes[i]` 和 `sources[i]` 匹配的，其中 `i` 是由之前所示数学函数决定的。\n\n\
  但仅仅编写函数并不意味着会创建任何输出。在 HTML 的后续部分，你可以在两个 `<script></script>` 标签之间看到 `getQuote()`；这就是调用函数的方式。在任何调用该函数的地方，函数的输出将被放置在那里。在这个示例中，输出显示在介绍引言的段落下方。\n\
  \n图 13.2 显示了在 Web 浏览器加载时的可引用引言（Quotable Quotes）页面。当页面刷新时，有四分之一的机会显示不同的引言——毕竟它是随机的！\n\
  \n**图 13.2** “可引用引言”页面每次加载时都会显示一句随机引言。\n\n![image](img/13fig02.jpg)\n\n请记住，你可以轻松修改此页面以包含你自己的引言或其他想要随机显示的文本。你还可以通过在代码中的\
  \ `quotes` 和 `sources` 数组中添加更多条目来增加可用引言的数量。\n\n如果你以“可引用引言”页面作为起点，你可以轻松更改脚本并在这个想法上创建你自己的有趣变化。如果你在这个过程中犯了错误也没关系。解决脚本代码错误的技巧是保持耐心并仔细分析你输入的代码。你可以始终删除代码来简化脚本直到它运行，然后一次添加一部分新代码，以确保每个部分都能正常工作。\n\
  \n### 理解文档对象模型 (DOM)\n\n使用 JavaScript 的客户端交互通常以某种方式操作 DOM 的形式存在。DOM 是文档的隐形结构——而不是\
  \ HTML 结构或你应用格式级别的方式。\n\n\n\n\n以下代码段创建了图 13.3 底部显示的五张图片中的第四张小图。`onmouseover` 事件表示，当用户将鼠标悬过这幅小图时，`document.product_img.src`（即大图槽）将填充为匹配大图的路径。\n\
  \n```html\n<a href=\"#\" onmouseover=\"javascript:document.product_img.src = '/path/to/large4.jpg'\"\
  ><img src=\"/path/to/small4.jpg\" width=\"104\" height=\"104\" style=\"padding:\
  \ 4px; border: 0px\" alt=\"photo\" /></a>\n```\n\n图 13.4 显示了相同的页面——用户无需重新加载——当用户悬过页面底部的某张较小图片时，大图槽会被不同的图像填充。鼠标指针悬停在右起数第二张图片上。当用户悬过内部照片的小尺寸时，其大尺寸版本将显示在页面的顶部区域。\n\
  \n**图 13.4** 当用户悬过较小的图片时，大图会被替换。\n\n![image](img/13fig04.jpg)\n\n## 总结\n\n在本章简短的章节中，你回顾了服务器端脚本与客户端脚本之间的区别，并复习了如何在\
  \ HTML 文件中引入 JavaScript 以为你的网站添加一些交互性。你还学习了如何使用 JavaScript 的 `document.write()`\
  \ 方法在页面加载时显示随机引言。最后，你了解了 DOM 的本质。\n\n通过应用从前面章节中学到的知识，你已经学会了如何使用客户端脚本让网页上的图像对鼠标移动做出响应。这些任务并不需要太多的编程技巧，但它们应该激励你继续读完这本书，并学习更多\
  \ JavaScript，以为你的页面提供更复杂的交互功能。\n\n## 问答\n\n**Q. 如果我想使用本章的随机引言脚本，但我想要拥有大量引言的库，我必须把所有引言都放在每个页面中吗？**\n\
  \n**A.** 是的。数组中的每一项都必须存在。这里你可以开始看到某些可以在客户端处理的内容与更适合在服务器端处理的内容之间的转折点。如果你有一个真正的随机引言库，且任何时候只展示其中一个，最好是将这些项目存储在数据库表中，并使用一小段服务器端脚本连接到数据库、检索文本并将其打印在页面上。或者，你也可以一直继续在\
  \ JavaScript 中携带所有引言，但你至少应该将该 JavaScript 函数放在一个不同的文件中，以便与文本分开维护。\n\n**Q. 我看到过一些在线目录，它们在似乎是网站内容上方的层中显示大图。我可以看到下方的普通网站内容，但焦点在大图上。这是如何实现的？**\n\
  \n**A.** 描述听起来像是由一个名为 Lightbox 的 JavaScript 库创建的效果。Lightbox 库允许你在置于网站内容之上的图层中显示图像或图像画集。这是一个流行的库，用于显示大图的细节，或仅仅展示一组被认为足够重要、足以在内容“之上”展示的图片。（若要安装和使用它，请遵循软件附带的说明。你将能够利用目前为止学到的知识将其集成到你的网站中。）\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”之前，尝试回答所有问题。\n\n## 测验\n\n**1.**\
  \ 你制作了一个按钮图片并将其命名为 `button.gif`。你还为按钮制作了一个简单的 GIF 动画，使其绿色和白色之间闪烁。你将该 GIF 命名为 `flashing.gif`。你会使用什么\
  \ HTML 和 JavaScript 代码让按钮在用户移动鼠标指针到其上方时闪烁，并在用户点击按钮时链接到名为 `gohere.html` 的页面？\n\n\
  **2.** 你将如何修改为第 1 题编写的代码，使得按钮在用户移动鼠标到上方时闪烁，并且即使用户移开鼠标也继续闪烁？\n\n**3.** 在以下上下文中，加号（`+`）代表什么？\n\
  \n```javascript\ndocument.write('This is a text string ' + 'that I have created.');\n\
  ```\n\n## 答案\n\n**1.** 你的代码可能像这样：\n\n```html\n<a href=\"gohere.html\" onmouseover=\"\
  javascript:document.flasher.src='flashing.gif'\" onmouseout=\"javascript:document.flasher.src='button.gif'\"\
  >\n<img src=\"button.gif\" id=\"flasher\" style=\"border-style:none\" /></a>\n```\n\
  \n**2.** 你的代码可能像这样：\n\n```html\n<a href=\"gohere.html\" onmouseover=\"javascript:document.flasher.src='flashing.gif'\"\
  >\n<img src=\"button.gif\" id=\"flasher\" style=\"border-style:none\" /></a>\n```\n\
  \n**3.** 加号（`+`）用于连接两个字符串。\n\n## 练习\n\n- 你是否有任何页面，如果导航图标在鼠标悬过时发生变化，看起来会更闪闪夺目或更易于理解？如果是，请尝试使用本章提供的信息创建一些高亮版本。\n\
  - 你可以用学过的方法显示随机图像——例如横幅或广告。与其打印文本，不如只需打印你想要显示的图像的 `<img/>` 标签即可。\n\n\n\n\n这是一个 `function`\
  \ 的示例。`Functions` 提供了一种处理任务的简单方法，例如向网页添加输出内容。JavaScript 包含了各种内置函数，你将在整本书中学习这些内容。使用函数的语句（如上一个例所示）被称为一个\
  \ `function call`（函数调用）。\n\n`Functions` 接收 `parameters`（括号内的表达式）来告诉它们要做什么。此外，函数还可以向等待结果的变量返回一个值。例如，接下面的函数调用会提示用户输入响应并将其存储在\
  \ `text` 变量中：\n\n```\ntext = prompt(\"Enter some text.\")\n```\n\n你也可以创建自己的函数。这非常有用，主要有两个原因：首先，你可以分离脚本的逻辑部分，使其更容易理解。其次，更重要的一点是，你可以多次使用该函数或使用不同的数据使用它，以避免重复脚本语句。\n\
  \n## 变量\n\n在第 4 章中，你学习了变量是容器，可以存储数字、文本字符串或其他值。例如，以下语句创建了一个名为 `fred` 的变量并为其赋值了值 `27`：\n\
  \n```\nvar fred = 27;\n```\n\nJavaScript 变量可以包含数字、文本字符串和其他值。你将在第 16 章“使用 JavaScript\
  \ 变量、字符串和数组”中学习更多关于它们的知识。\n\n## 理解对象\n\nJavaScript 还支持 `objects`（对象）。像变量一样，对象可以存储数据——但它们可以同时存储两个多个数据。\n\
  \n存储在对象中的数据项被称为对象的 `properties`（属性）。例如，你可以使用对象来存储关于人员的信息，比如地址簿。每个人物对象的属性可能包括姓名、地址和电话号码。\n\
  \nJavaScript 使用句号来分隔对象名和属性名。例如，对于一个名为 `Bob` 的人物对象，属性可能包括 `Bob.address` 和 `Bob.phone`。\n\
  \n***\n\n注意\n\n我们在本章之前讨论的 `document.write` 函数实际上是 `document` 对象的 `write` 方法，你已经见过它好几次了。\n\
  \n***\n\n对象还可以包括 `methods`（方法）。这些是与对象数据工作的函数。例如，我们用于地址簿的人物对象可能包含一个 `display()` 方法来显示人物信息。在\
  \ JavaScript 术语中，语句 `Bob.display()` 将显示 Bob 的详情。\n\n如果这听起来很困惑，不要担心——你将在本书的后面部分更详细地探索对象。现在，你只需要知道基础。JavaScript\
  \ 支持三种对象：\n\n- `Built-in objects`（内置对象）构建在 JavaScript 语言中。你已经在第 2 章“理解 HTML 和 XHTML\
  \ 连接”中遇到过其中一个 `Date`。其他内置对象包括 `Array` 和 `String`，你将在第 16 章中探索它们，以及在第 17 章中解释的 `Math`。\n\
  - `DOM (Document Object Model) objects`代表浏览器和当前 HTML 文档的各种组件。例如，你在本章之前使用的 `alert()`\
  \ 函数实际上是 `window` 对象的一个方法。你将在第 15 章“操作文档对象模型 (DOM)”中更详细地探索它们。\n- `Custom objects`（自定义对象）是你自己创建的对象。例如，如本节前面提到的，你可以创建一个\
  \ `person` 对象。\n\n## 条件语句\n\n虽然事件处理器会在发生某事时通知你的脚本，但你可能想自己检查某些条件。例如，用户是否输入了有效的电子邮件地址？\n\
  \n***\n\n注意\n\n你将在第 18 章“使用条件和循环控制流程”中学习更多关于条件的知识。\n\n***\n\nJavaScript 支持 `conditional\
  \ statements`（条件语句），让你能够回答此类问题。一个典型的条件使用 `if` 语句，如下例所示：\n\n```\nif (count==1) alert(\"\
  The countdown has reached 1.\");\n```\n\n这会将变量 `count` 与常量 `1` 进行比较，如果它们相同，则向用户显示警告消息。你将在这种中使用条件语句。\n\
  \n## 循环\n\nJavaScript（以及其他语言）的另一个有用特性是创建 `loops`（循环）的能力，即重复的语句组。例如，这些语句将显示 10 次：\n\
  \n```\nfor (i=1; i<=10; i++) {\n    alert(\"Yes, it's!\");\n}\n```\n\n`for` 语句是\
  \ JavaScript 的几种用途之一。\n\n## 事件处理器\n\n正如第 11 章“使用 CSS 让列表、文本和导航具有更多功能”所述，并不是所有的脚本都位于\
  \ `<script>` 标签内。你也可以将脚本作为 `event handlers`（事件处理器）。虽然这听起来像是一个复杂的术语，但它的意思正如字面意思：`event\
  \ handlers` 是处理事件的脚本。\n\n在现实生活中，事件是发生的事情。例如，你在日历上写写的内容就是事件：“看牙预约”或“Fred 的生日”。你在生活中也会遇到计划未计划的事件：例如，交通罚单、国税局审计或亲戚的意外造访。\n\
  \n无论事件是有计划的还是未计划的，你可能有正常的处理方式。你的事件处理器可能包括诸此类内容：“当 Fred 生日到来时，送他一份礼物”或“当亲戚意外造访时，关灯假装家里没人”。\n\
  \nJavaScript 中的事件处理器也类似：它们告诉浏览器当特定事件发生时该做什么。JavaScript 处理的事件没有你处理的那些那么令人兴奋——它们包括诸如“当点击鼠标时”和“当此页面加载完成时”等事件。\n\
  \n许多 JavaScript 事件（如之前看到的鼠标点击）是由用户引起的。你的脚本不是按固定的顺序执行，而是对用户的操作做出响应。其他事件不直接涉及用户——例如，当\
  \ HTML 文档加载完成时会触发事件。\n\n每个事件处理器都与特定的浏览器对象关联，你可以在定义对象的标签中指定事件处理器。例如，图像和文本链接都有一个事件\
  \ `onmouseover`，它在鼠标指针移动到对象上方时发生。这是一个带有事件处理器的典型 HTML 图像标签：\n\n```html\n<img src=\"\
  button.gif\" onmouseover=\"highlight();\n```\n\n你将事件处理器指定为 HTML 标签的属性，并在引号内包含处理事件的\
  \ JavaScript 语句。这是函数的理想用法，因为函数名短而明了，并且可以引用整系列语句。\n\n请参看章末的“尝试一下”部分获取 HTML 文档中事件处理器的完整示例。\n\
  \n## 哪个脚本先运行？\n\n你实际上可以在网页文档中包含多个脚本：一个或多个 `<script>` 标签、外部 JavaScript 文件以及任意数量的事件处理器。有了所有这些脚本，你可能会想浏览器如何知道先执行哪一个。幸运的是，这是以逻辑的方式的：\n\
  \n\n\n\n\n- HTML 文档中 `<head>` 区域的 `<script>` 标签会被首先处理，无论它们包含嵌入代码还是引用 JavaScript\
  \ 文件。由于这些脚本无法在网页中创建输出，因此它们是定义稍后使用的函数的良好位置。\n- HTML 文档中 `<body>` 区域的 `<script>` 标签会在\
  \ `<head>` 区域的标签之后执行，此时网页正在加载和显示。如果 `<body>` 中有多个脚本，它们将按顺序执行。\n- 事件处理器在事件发生时执行。例如，`onLoad`\
  \ 事件处理器在网页正体加载时执行。由于`<head>` 区域在任何事件之前加载，因此你可以在那里定义函数并在事件处理器中使用它们。\n\n## JavaScript\
  \ 语法规则\n\nJavaScript 是一种简单的语言，但你确实需要小心地使用它的`syntax`——即定义如何使用该语言的规则。本书的其他部分涵盖了 JavaScript\
  \ 语法的许多方面，但你应该理解一些基本规则以避免错误。\n\n### 大小写敏感\n\nJavaScript 中的几乎所有内容都是`大小写敏感`，这意味着你不能交替使用小写字母和大写字母。以下是一些通用规则：\n\
  \n- JavaScript 关键字（如 `for` 和 `if`）始终是小写的。\n- 内置对象（如 `Math` 和 `Date`）首字母大写。\n- DOM\
  \ 对象名称通常是小写的，但它们的方法通常是大写和小写字母的组合。通常除第一个单词外的所有单词都使用大写字母，例如 `toLowerCase` 和 `getElementById`。\n\
  \n在不确定时，请遵循本书或其他 JavaScript 参考资料中使用的准确大小写。如果你使用了错误的大小，浏览器通常会显示错误信息。\n\n### 变量、对象和函数名称\n\
  \n当你定义自己的变量、对象或函数时，可以选择它们的名称。名称可以包含大写字母、小写字母、数字和下划线 `_` 字符。名称必须以字母或下划线开头。\n\n你可以决定在变量名中使用大写还是小写字母，但记住\
  \ JavaScript 是大小写敏感的：`score`、`Score` 和 `SCORE` 被视为三个不同的变量。确保每次引用变量时使用相同的名称。\n\n\
  ### 保留字\n\n关于变量名的另一个规则是：它们不能是`保留字`。这些包括构成 JavaScript 语言的单词（如 `if` 和 `for`）、DOM 对象名称（如\
  \ `window` 和 `document`）以及内置对象名称（如 `Math` 和 `Date`）。\n\n### 空格\n\n空白区域（程序员称为 `whitespace`）会被\
  \ JavaScript 忽略。你可以在一行中包含空格和制表符，或者包含空行，而不会引起错误。空白通常会让脚本更具可读性。\n\n## 使用注释\n\nJavaScript\
  \ `comments` 允许你在脚本中包含文档。如果其他人尝试理解该脚本，甚至在你离开很长时间后再次尝试理解它，这都非常有用。要在 JavaScript 程序中包含注释，请以双斜杠开头一行，如下例所示：\n\
  \n```\n//this is a comment.\n```\n\n你也可以在行的中间用双斜杠开始注释，这对于记录脚本很有用。在这种情况下，斜杠之后该行上的所有内容都被视为注释并被浏览器忽略。例如，\n\
  \n```\na = a + 1; // 给 a 的值加 1\n```\n\nJavaScript 还支持 C 风格的注释，它以 `/*` 开头并以 `*/`\
  \ 结束。这些注释可以跨越多行，如下所示：\n\n```\n/*此脚本包含了多种\n功能，包括此注释。 */\n```\n\n由于注释内的 JavaScript\
  \ 语句会被忽略，因此 C 风格注释经常用于`注释掉`代码段。如果你在调试脚本时想临时移除某些 JavaScript 代码，你可以在该部分落的开头添加 `/*`\
  \ 并在末尾添加 `*/`。\n\n***\n\n**注意**\n\n由于这些注释是 JavaScript 语法的一部分，它们只在 `<script>` 标签内部或外部\
  \ JavaScript 文件中有效。\n\n***\n\n## JavaScript 最佳实践\n\n你现在应该熟悉编写有效 JavaScript 的基本规则了。除了遵循规则，遵循`最佳实践`\
  \ 也是一个好主意。以下做法可能不是必须，但如果你遵循它们，将为你自己和其他人节省一些麻烦。\n\n- **大量使用注释**——这些注释让其他人更容易理解你的代码，也让你在以后编辑它们时更容易理解。它们对于标记脚本的主要划分也很有用。\n\
  - **在每个语句末尾使用分号，且每行只使用一条语句**——这将使脚本更容易调试。\n- **尽可能使用单独的 JavaScript 文件**——这可以将 JavaScript\
  \ 与 HTML 分离，使调试更简单，并鼓励你编写可以重用的模块化脚本。\n- **避免针对特定浏览器**——随着你深入学习 JavaScript，你会学到一些仅在一个浏览器中有效的功能。除非绝对必要，否则请避免它们，并始终在多个浏览器中测试你的代码。\n\
  - **保持 JavaScript 可选性**——不要使用 JavaScript 执行网站上的核心功能——例如主导航链接。尽可能，没有 JavaScript 的用户应该能够使用你的网站，尽管它可能没有那么吸引或方便。这种策略被称为`渐进增强`。\n\
  \n还有许多涉及 JavaScript 高级方面的最佳实践。\n\n***\n\n## 动手尝试：使用事件处理器\n\n在结束本章之前，这里有一个事件处理器的示例。它将演示你如何设置事件（你将在全书中中使用它），以及\
  \ JavaScript 在没有 `<script>` 标签的情况下是如何工作的。\n\n列表 14.1 一个带有简单句处理器的 HTML 文档\n\n***\n\
  \n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"\
  -//W3C//DTD XHTML 1.1//EN\"\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml1.dtd\">\n\
  <html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>事件处理器示例</title>\n\
  </head>\n<body>\n  <h1>事件处理器示例</h1>\n  <p>\n    <a href=\"http://www.google.com/\"\
  \ onclick=\"alert('Aha! An Event!');\">前往 Google</a>\n  </p>\n</body>\n</html>\n\
  ```\n\n***\n\n***\n\n事件处理器是通过 `<a>` 标签内的以下 `onclick` 属性定义的：\n\n`onclick=\"alert('Aha!\
  \ An Event!');\"`\n\n该事件处理器使用内置的 `alert()` 函数，在点击点击链接时显示一条消息。在更复杂的脚本中，你通常会定义自己的函数作为事件处理器。图\
  \ 14.1 显示了此示例的运行情况。\n\n**图 14.1** 当你点击链接时，浏览器会显示警框。\n\n![image](img/14fig01.jpg)\n\
  \n在接下来的一小时内，你将使用其他类似的事件处理器，事件将在第 19 章 的“响应事件”中进行详细介绍。\n\n***\n\n**提示**\n\n注意，点击警框上的\
  \ OK 按钮后，浏览器会遵循 `<a>` 标签中定义的链接。正如第 19 章 所述，你的事件处理器也可以阻止浏览器遵循链接。\n\n***\n\n## 总结\n\
  \n在本章中，你接触了 JavaScript 编程和语法的几个组件：函数、对象、事件处理器、条件和循环。你还学习了如何使用 JavaScript 注释让你的脚本更易读，并查看了处理器的简单示例。\n\
  \n## 问答\n\n问：我听过“面向对象”这个术语用于 C++ 和 Java 等语言。如果 JavaScript 支持对象，那么它是一门面向对象的语言吗？\n\
  \n\n\n\n\n# A. 是的，尽管它可能不符合某些人的严格定义。JavaScript 对象并不支持像 `C++` 和 `Java` 等语言所支持的所有功能，尽管最新版本的\
  \ JavaScript 添加了更多面向对象的特性。\n\n# Q. 有多个在不同时间执行的脚本似乎很令人困惑。我为什么要使用事件处理器？\n\n# A. 事件处理器是处理网页内部件（如按钮、复选框和文本字段）的理想方式（在\
  \ JavaScript 中也是唯一的方式）。实际上，这样处理它们更加方便。与其编写一个一直等待按钮被点击的脚本，你只需创建一个事件处理器并让浏览器替你等待即可。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n## 测验\n\n**1.**\
  \ 当用户点击鼠标按钮时执行的脚本是什么的示例？\n\n**a.** 一个对象\n\n**b.** 事件处理器\n\n**c.** 不可能实现\n\n**2.**\
  \ 下列哪些是 JavaScript 函数的功能？\n\n**a.** 接受参数\n\n**b.** 返回值\n\n**c.** 以上两者都是\n\n**3.**\
  \ 浏览器优先执行的是下列中的哪一个？\n\n**a.** `<head>` 部分中的脚本\n\n**b.** `<body>` 部分中的脚本\n\n**c.**\
  \ 按钮的事件处理器\n\n## 答案\n\n**1.** b. 当用户点击鼠标按钮时执行的脚本是事件处理器。\n\n**2.** c. 函数可以同时接受参数和返回值。\n\
  \n**3.** a. HTML 文档中定义在 `<head>` 部分的脚本会被浏览器执行。\n\n## 练习\n\n• 检查你在第 4 章中创建的 `Date`\
  \ 和 `Time` 脚本，寻找使用函数和对象的示例。\n\n• 为 `Date` 和 `Time` 脚本添加 JavaScript 注释，以便更清晰地说明每行代码的作用。验证脚本仍然运行正常。\n\
  \n# 第 15 章.使用文档对象模型 (DOM)\n\n* * *\n\n在本章你将学习到：\n\n• W3C DOM 标准如何让动态页面更易控制\n• `window`\
  \ DOM 对象的基础\n• `document` DOM 对象的基础\n• `history` DOM 对象的基础\n• `location` DOM 对象的基础\n\
  • 如何处理节点、父节点、子节点兄弟节点\n• 如何访问和使用 DOM 节点的属性\n• 如何访问和使用 DOM 方法\n• 如何用 JavaScript 控制定位\n\
  • 如何用 JavaScript 显示和隐藏对象\n• 如何用 JavaScript 修改页面内的文本\n• 如何用 JavaScript 向页面添加文本\n\
  * * *\n\n上一章向你介绍了 JavaScript 编程的基本概念；本章将帮助你更好地理解文档对象模型 (DOM)，它是 JavaScript 属性和方法显式控制的框架，让你能够开发丰富的用户体验。\n\
  \n## 理解文档对象模型 (DOM)\n\nJavaScript 相比于纯 HTML 的优势在于，这些客户端脚本可以在内容加载后，直接在浏览器中操作网页文档及其内容。你的脚本可以向浏览器加载一个新页面，处理浏览器窗口和文档的部分内容，打开新窗口，甚至动态地修改页面内的文本。\n\
  \n为了与浏览器和文档交互，JavaScript 使用了一种名为 DOM 的父子对象层级结构。这些对象被组织成树形结构，代表了网页文档的所有内容和组件。\n\n\
  DOM 中的对象具有 `properties`（属性）——描述网页或文档的变量——以及 `methods`（方法）——使你能够操作网页部分的函数。\n\n当你引用一个对象时，你使用父对象的名称，后跟子对象的名称或多个名称，并用点号（.）分隔。例如，JavaScript\
  \ 将表示文档中图像的对象存储为 `document` 对象的子。以下引用 `image9` 对象，它是 `document` 对象的子，也是 `window`\
  \ 对象的子：\n\n```\nwindow.document.image9\n```\n\n### 使用 `window` 对象\n\n浏览器对象层次结构的顶端是\
  \ `window` 对象，它代表一个浏览器窗口。你已经使用过至少一次 `window` 对象的方法：`method`，或简单地说 `alert()`，可以在警告框中显示消息。\n\
  \n* * *\n\n注意\n\nDOM 并不是 JavaScript 或任何其他编程语言的一部分——而是在浏览器内部的一种 API（应用程序接口）。\n\n\
  * * *\n\n同时可以存在多个 `window` 对象，每个对象代表一个打开的浏览器窗口。帧（Frames）也由 `window` 对象表示。你将在第 20\
  \ 章“使用窗口和帧”中学习更多关于窗口和帧的知识。\n\n`window` 对象是我们在本章将查看的所有对象的父对象。图 15.1 显示了 DOM 对象层次结构中的\
  \ `window` 部分及其各种对象。\n\n**图 15.1** DOM 对象层次结构的 `window` 部分。\n\n![image](img/15fig1.jpg)\n\
  \n### 使用 `document` 对象\n\n`document` 对象代表网页文档或页面。网页文档显示在窗口中，因此得知 `document` 对象是\
  \ `window` 对象的子并不应该感到意外。\n\n* * *\n\n注意\n\n你已经使用过 `document.write` 在网页文档中显示文本。之前的章节示例只使用了单一窗口，因此没有必要使用\
  \ `window.document`——但这种更长的语法同样有效。\n\n* * *\n\n由于 `window` 始终代表当前窗口（包含脚本的窗口），你可以使用\
  \ `window.document` 来引用当前文档。你只需引用 `document`，它会自动指向当前窗口。\n\n如果在使用多个窗口或帧，可能会有多个 `window`\
  \ 对象，每个对象都有它自己的 `document` 对象。要使用其中一个文档对象，你需要使用窗口的名称和文档的名称。\n\n在接下来的章节中，你将查看 `document`\
  \ 对象的一些属性和方法，它们在你编写脚本时将非常有用。\n\n### 获取文档信息\n\n`document` 对象的若干属性包含了关于当前文档的信息：\n\n\
  • `document.URL` 指定文档的 URL。这是一个文本字段。你无法更改它。如果你需要引导用户到另一个位置，请使用 `window.location`\
  \ 对象，稍后会介绍。\n\n• `document.title` 列出页面标题，由 HTML `<title>` 标签定义。\n\n• `document.referrer`\
  \ 用户访问当前页面之前所在的页面——通常是链接到当前页面的页面。\n\n• `document.lastModified` 文档最后修改的日期。该日期随页面从服务器发送。\n\
  \n• `document.cookie` 允许为文档读取或设置 cookie。\n\n• `document.images` 返回文档中使用的图像集合。\n\n\
  作为文档属性的一个示例，列表 15.1](#ch15.html_ch15ex01) 显示了一个使用 JavaScript 显示其最后修改日期的短 HTML 文档。\n\
  \n列表 15.1 显示最后修改日期\n\n* * *\n\n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>显示最后修改日期</title>\n  </head>\n  <body>\n    <h1>显示最后修改日期</h1>\n    <p>此页面最后修改于：</p>\n\
  \  </body>\n</html>\n```\n\n\n\n\n\n```html\n<script type=\"text/javascript\">\n\
  \    document.write(document.lastModified);\n</script>\n</body>\n</html>\n```\n\n\
  * * *\n\n图 15.2 显示了列表 15.1 的输出。\n\n**图 115.2 查看文档的最后修改日期。**\n\n![image](img/15fig02.jpg)\n\
  \n如果你使用 JavaScript 来显示此 `document` 属性的值，那么当你选择向用户公开此信息时，就不需要记住在每次修改页面时都更新日期了。（你也可以使用脚本始终打印当前日期，而不是最后修改日期，但那将视为作弊。）\n\
  \n* * *\n\n注意\n\n你可能会发现 `document.lastModified` 属性在你的网页上不起作用，或者返回了错误的值。该日期是从 Web\
  \ 服务器接收的，某些服务器并没有正确地维护修改日期。\n\n* * *\n\n### 在文档中编写文本\n\n最简单的 `document` 对象方法也是你最经常使用的方法。事实上，即使在书中目前最基础的示例中，你已经使用了其中一个方法。`document.write`\
  \ 方法将文本作为文档窗口中 HTML 的一部分打印出来。另一种语句 `document.writeln` 也打印文本，但它在末尾还会包含一个换行符（`\\n`）。当你希望文本是该行的最后一个内容时，这非常有用。\n\
  \n* * *\n\n注意\n\n请记住，换行符在浏览器中会被显示为空格，`<pre>` 容器内部除外。如果你想要真正的换行，需要使用 `<br/>` 标签。\n\
  \n* * *\n\n你只能在网页的 `body` 中使用这些方法，因此它们会在页面加载时执行。你不能在不重新加载页面的情况下使用这些方法向已加载的页面添加内容。然而，正如下一节介绍的，你可以为文档编写新内容。\n\
  \n`document.write` 方法可以在 HTML 文档 `body` 中的 `<script>` 标签内使用。你也可以在函数中使用它，只要你在文档 `body`\
  \ 中包含了对该函数的调用，正如你在列表 15.1 中看到的那样。\n\n* * *\n\n注意\n\n你也可以通过 DOM 的更高级特性直接修改网页上的文本，你将在本章的后面学习这些内容。\n\
  \n* * *\n\n### 使用链接和锚点\n\n`document` 对象的另一个子是 `link` 对象。实际上，一个文档中可以存在多个 `link` 对象。每个对象都包含指向另一个位置或锚点的链接信息。\n\
  \n你可以通过 `links` 数组访问 `link` 对象。数组的每个成员都是当前页面中的一个 `link` 对象。数组的一个属性 `document.links.length`\
  \ 指明页面中链接的数量。\n\n每个 `link` 对象（或 `links` 数组的成员）都有一系列定义 URL 的属性列表。`href` 属性包含整个 URL，而其他属性定义了它的部分。这些属性与在本章稍后定义的\
  \ `location` 对象属性是相同的。\n\n你可以通过指定链接编号和属性名来引用属性。例如，以下语句将第一个链接的完整 URL 赋值给变量 `link1`：\n\
  \n```\nlink1 = links[0].href;\n```\n\n`anchor` 对象也是 `document` 对象的子。每个 `anchor`\
  \ 对象代表当前文档中的一个锚点——一个可以直接跳转的特定位置。\n\n像链接一样，你可以通过数组 `anchors` 访问锚点。该数组的每个元素都是一个 `anchor`\
  \ 对象。`document.anchors.length` 属性给出 `anchors` 数组中的元素数量。\n\n### 访问浏览器历史\n\n`history`\
  \ 对象是 `window` 对象的另一个子（属性）。该对象持有关于当前 URL 之前之后访问过的 URL 信息，并包含了跳转到上一个或下一个位置的方法。\n\n\
  * * *\n\n注意\n\n`history` 对象具有 `current`、`previous` 和 `next` 属性，用于存储历史列表中文档的 URL。然而，出于安全和隐私考虑，浏览器通常无法访问这些对象。\n\
  \n* * *\n\n`history` 对象有一个你可以访问的属性：\n\n- `history.length` 跟踪历史列表的长度——换句话说，就是用户访问过的不同位置的数量。\n\
  \n`history` 对象有三个你可以使用的方法，以便在历史列表中移动：\n\n- `history.go()` 从历史列表中打开一个 URL。要使用此方法，请在括号中指定一个正数或负数。例如，`history.go(-2)`\
  \ 等同于连续两次按下后退键。\n\n- `history.back()` 加载历史列表中的上一个 URL——等同于按下后退键。\n\n- `history.forward()`\
  \ 如果可用加载历史列表中的下一个 URL。这等同于按下前进键。\n\n你可以使用 `history` 对象的 `back` 和 `forward` 方法为 Web\
  \ 文档添加你自己的后退和前进按钮。当然，浏览器已经有了后退和前进按钮，但有时包含你自己的实现相同目的的链接是有用的。\n\n\n\n\n\n- `location.search`\
  \ 是 URL 中的查询部分（如果有，例如示例中的 `q=javascript`）。\n\n在本示例中未未使用但也可以访问的属性还有：\n\n- `location.host`\
  \ 是 URL 的主机名加端口号。\n- `location.hash` 是 URL 中使用的锚点名称（如果有，例如示例中的 `#anchor`）。\n\n###\
  \ 注意\n\n尽管 `location.href` 属性通常包含与本章前面描述的 `document.URL` 属性相同的 URL，但你无法更改 `document.URL`\
  \ 属性。请始终使用 `location.href` 来加载新页面。\n\n本章之前介绍的 `link` 对象也包含了此用于访问 URL 部分的属性列表。\n\n\
  `location` 对象有三个方法：\n\n- `location.assign()` 按照如下方式使用时会加载新文档：\n```javascript\nlocation.assign(\"\
  http://www.google.com\")\n```\n- `location.reload()` 重新加载当前文档。这与浏览器工具栏上的“刷新”按钮相同。如果你可选地包含\
  \ `true` 参数，它将忽略浏览器缓存，无论文档是否发生变化都会强制刷新。\n- `location.replace()` 用新位置替换当前位置。这类似于你手动设置\
  \ `location` 对象的属性。区别在于 `replace` 方法不会影响浏览器的历史记录。换句话说，无法使用“后退”按钮回到上一个位置。这对于返回没有意义的启动页或临时页面非常有用。\n\
  \n### 更多关于 DOM 结构\n\n在本章之前，你已经学习了一些最重要的 DOM 对象是如何组织的：`window` 对象包含 `document` 对象，等等。虽然这些对象最初是唯一可用的对象，但现代\
  \ DOM 为页面的每个元素都在在 `document` 对象下添加了相应的对象。\n\n为了更好地理解这个概念，让我们看看列表 15.3 中的简单 HTML\
  \ 文档。该文档具有通常的 `<head>` 和 `<body>` 部分、一个标题和一段正文本。\n\n列表 15.3 简单的 HTML 文档\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>A Simple HTML\
  \ Document</title>\n  </head>\n  <body>\n    <h1>This is a Level-1 Heading.</h1>\n\
  \    <p>This is a simple paragraph.</p>\n  </body>\n</html>\n```\n\n和所有的 HTML 文档一样，这个文档也由各种容器及其内容组成。`<html>`\
  \ 标签形成包含整个文档的容器，`<body>` 标签包含页面主体，以此此类推。\n\n在 DOM 中，页面中的每个容器及其内容都由一个对象表示。这些对象被组织成树形结构，`document`\
  \ 对象本身位于树的根节点，而单个元素（如标题和文本段）位于树的叶子节点。图 15.4 显示了这些关系的图。\n\n**图 15.4** DOM 如何表示 HTML\
  \ 文档。\n\n![image](img/15fig04.jpg)\n\n### Note\n\n如果这个树形结构让你感到困惑，请不要担心；你只需给元素分配\
  \ ID 并引用它们，就可以完成任何事情。这是书中较早示例中使用的方法。在接后的部分，你将看到更复杂的示例，这些要求你理解 DOM 中对象的组织方式。\n\n\
  在接下来的章节中，你将更仔细地检查 DOM 的结构。\n\n### 节点\n\n文档中的每个容器或元素在 DOM 中被称为节点。在图 15.4 的示例中，框中的每个对象都是一个节点，线条表示节点之间的关系。\n\
  \n你经常需要在脚本中引用单个节点。你可以通过分配 ID 或使用节点之间的关系在树中导航来实现这一点。\n\n### 父节点与子节点\n\n正如你已经学到的那样，每个\
  \ JavaScript 对象都可以有一个父节点（包含它的对象），也可以有子节点（它包含的对象）。DOM 使用了相同的术语。\n\n在图 15.4 中，`document`\
  \ 对象是其余对象的父对象，它本身没有父对象。`html` 对象是 `head` 和 `body` 对象的父对象，而 `h1` 和 `p` 对象是 `body`\
  \ 对象的子节点。\n\n文本节点的工作方式略有不同。段中的实际文本本身就是一个节点，它是 `p` 对象的子节点。同样，`<h1>` 标签内的文本是 `h1`\
  \ 对象的子节点。\n\n### 兄弟节点\n\nDOM 还使用另一个术语来组织对象：兄弟节点。正如你所预期的，这指的是具有相同父对象的对象——换句话说，就是\
  \ DOM 对象树中同一层的对象。\n\n在图 15.4 中，`h1` 和 `p` 对象是兄弟节点，因为它们都是 `body` 对象的子节点。同样，`head`\
  \ 和 `body` 对象是 `html` 对象下的兄弟节点。\n\n### 操作 DOM 节点\n\n正如你所看到的，DOM 将网页内的对象组织成树形结构。树中的每个节点（对象）都可以在\
  \ JavaScript 中访问。在接下来的章节中，你将学习如何使用节点的属性和方法来管理它们。\n\n### Note\n\n接下来的章节仅描述了节点最重要的属性和方法，以及当前浏览器支持的属性。有关可用属性的完整列表，请参见\
  \ W3C 的 DOM 规范：[`www.w3.org/TR/DOM-Level-2/`](http://www.w3.org/TR/DOM-Level-2/)。\n\
  \n#### 基础节点属性\n\n你已经使用过节点的 `style` 属性来更改它们的样式值。每个节点还有许多你可以检查或设置的基础属性。这些包括以下：\n\n\
  - `nodeName` 是节点的名称（不是 ID）。对于基于 HTML 标签的节点（例如 `<p>` 或 `<body>`），该名称是标签名：`p` 或 `body`。对于文档节点，名称是一个特殊代码：`#document`。同样，文本节点的名称为\
  \ `#text`。\n- `nodeType` 是一个描述节点类型的整数：`1` 表示普通 HTML 标签，`3` 表示文本节点，`9` 表示文档节点。\n\
  - `nodeValue` 是文本节点中包含的实际文本。此属性对于其他类型的节点无效。\n- `innerHTML` 是任何节点的 HTML 内容。你可以为此属性分配一个包含\
  \ HTML 标签的值，并动态地更改节点的 DOM 子对象。\n\n`innerHTML` 属性并不是 W3C DOM 规范的一部分。然而，它被主流浏览器支持，通常是更改页面内容最简单的方法。你也可以通过删除和创建节点以更标准的方式来实现，正如后文所述。\n\
  \n#### 节点关系属性\n\n除了之前描述的基础属性外，每个节点还有许多描述其与其他节点关系的属性。这些包括以下：\n\n- `firstChild` 是节点的第一个子对象。对于包含文本的节点（例如\
  \ `<h1>` 或 `<p>`），包含实际文本的文本节点就是第一个子。\n\n### Caution\n\n记住，和所有的 JavaScript 对象和属性一样，这里描述的节点属性和函数对大小写敏感。务必按照所示内容精确输入它们。\n\
  \n- `lastChild` 是节点的最后一个子对象。\n- `childNodes` 是一个包含节点所有子节点的数组。你可以使用此数组配合循环来处理给定节点下的所有节点。\n\
  - `previousSibling` 是当前节点之前的兄弟节点（同一层级的节点）。\n- `nextSibling` 是当前节点之后的兄弟节点。\n\n\n\n\
  \n\n`document` 节点本身有几个你可能会觉得很有用的方法。你已经用过其中一个方法 `getElementById`，通过它们的 ID 属性来引用 DOM\
  \ 对象。`document` 节点的方法包括：\n\n- `getElementById(id)` 返回具有指定 `id` 属性的元素。\n- `getElementsByTagName(tag)`\
  \ 返回一个包含所有具有指定标签名的元素的数组。你可以使用通配符 `*` 来返回一个包含文档中所有节点的数组。\n- `createTextNode(text)`\
  \ 创建一个包含指定文本的新文本节点，然后你可以将其添加到文档中。\n- `createElement(tag)` 为指定的标签创建一个新的 HTML 元素。与\
  \ `createTextNode` 来说，你需要在创建元素后将其添加到文档中。你可以通过更改其子对象或 `innerHTML` 属性来为元素分配内容。\n\n\
  ## 节点方法 (Node Methods)\n\n页面中的每个节点都有许多可用方法。哪些方法有效取决于节点在页面中的位置以及它是否具有父节点或子节点。这些包括：\n\
  \n- `appendChild(new)` 将指定的新节点添加到该对象所有现有节点之后。\n- `insertBefore(new, old)` 在指定的旧子节点（必须已存在）之前插入指定的新子节点。\n\
  - `replaceChild(new, old)` 用新节点替换指定的旧子节点。\n- `removeChild(node)` 从对象的子节点集合中删除一个子节点。\n\
  - `hasChildNodes()` 如果对象具有一个或多个子节点，则返回布尔值 `true`，否则返回 `false`。\n- `cloneNode()`\
  \ 创建现有节点的副本。如果提供参数 `true`，则副本也将包含原始节点的任何子节点。\n\n## 创建可定位元素（层）\n\n现在你已经对 DOM 的结构有了更进一步的了解，你应该能够开始思考如何控制网页中的任何元素，例如段落或图像。例如，你可以使用\
  \ DOM 来更改元素的位置、可见性和其他属性。\n\n在 W3C DOM 和 CSS2 标准出现之前，你只能重新定位“层”（layers），即用专有标签定义的特殊元素组。虽然你现在可以定位任何元素，但在许多情况下，对一组元素进行操作仍然很有用的。\n\
  \n你可以利用你在书中早期学过的 `<div>` 或 `<span>` 标签有效地创建一个层，或者说一组可以作为一个整体控制的 HTML 对象。\n\n要使用\
  \ `<div>` 创建层，请将层的内容包含在两个 division 标签之间，并在 `<div>` 标签的 `style` 属性指定层的属性。这里是一个简单的示例：\n\
  \n```html\n<div id=\"layer1\" style=\"position:absolute; left:100px; top:100px\"\
  >\n  <p>这是层的内容。</p>\n</div>\n```\n\n### 注意\n正如你在前面的章节中所学习到的那样，你可以在 `<style>` 块、外部样式表或\
  \ HTML 标签的 `style` 属性中指定 CSS 属性（例如 `position` 属性和其他层属性），然后使用 JavaScript 控制这些属性。这里显示的代码片段使用了\
  \ `style` 属性中的属性而不是 `<style>` 块，因为这只是一个示例片段，而不是完整的代码列表。\n\n这段代码定义了一个名为 `layer1`\
  \ 的层。这是一个可移动的层，位于浏览器窗口左上角向下 100 像素、向右 100 像素的位置。\n\n你已经学习了定位属性，并在书的第二部分和第三部分看到了它们的实际应用。这包括设置对象尺寸（如\
  \ `height` 和 `width`）和位置（如 `absolute` 或 `relative`）、对象可见性以及对象背景和边框。本章中的剩余示例将使用与你在书中看到的类似的\
  \ HTML 和 CSS，但它们将向你展示基于 JavaScript 的 DOM 交互。\n\n## 使用 JavaScript 控制定位\n\n使用上一节的代码片段，你将看到一个如何使用\
  \ JavaScript 控制对象定位属性的示例。\n\n这是我们的示例层（一个 `<div>`）：\n\n```html\n<div id=\"layer1\"\
  \ style=\"position:absolute; left:100px; top:100px\">\n  <p>这是层的内容。</p>\n</div>\n\
  ```\n\n要使用 JavaScript 在页面内向上或向下移动此层，你可以更改它的 `style.top` 属性。例如，以下语句将层从原始位置向下移动 100\
  \ 像素：\n\n```javascript\nvar obj = document.getElementById(\"layer1\");\nobj.style.top=200;\n\
  ```\n\n`document.getElementById()` 方法返回与该层 `<div>` 标签对应的对象，第二条语句将对象的 `top` 定位属性设置为\
  \ 200px；你也可以将这两个语句结合：\n\n```javascript\ndocument.getElementById(\"layer1\").style.top\
  \ = 200;\n```\n\n这只是为层设置了 `style.top` 属性，而没有为层对象赋值变量。\n\n### 注意\n某些 CSS 属性（如 `text-indent`\
  \ 和 `border-color`）名称中带有连字符。当你在 JavaScript 中这些属性时，你需要将带连字符的部分合并并使用大字母：`textIndent`\
  \ 和 `borderColor`。\n\n现在，让我们创建一个定义层的 HTML 文档，并将其与脚本结合，允许通过按钮移动、隐藏或显示层。列表 15.4 显示了定义按钮和层的\
  \ HTML 文档。脚本本身（`position.js`）将在列表 15.5 中给出。\n\n列表 15.4 可移动层示例的 HTML 文档\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>使用 JavaScript\
  \ 定位元素</title>\n    <script type=\"text/javascript\" src=\"position.js\"></script>\n\
  \    <style>\n      #buttons {\n        text-align:center;\n      }\n      #square\
  \ {\n        position:absolute;\n        top:150px;\n        left:100px;\n     \
  \   width:200px;\n        height:200px;\n        border:2px solid black;\n     \
  \   padding:10px;\n        background-color:#e0e0e0;\n      }\n    </style>\n  </head>\n\
  \  <body>\n    <h1>定位元素</h1>\n    <form action=\"\" name=\"form1\">\n      <div\
  \ id=\"buttons\">\n        <input type=\"button\" name=\"left\" onclick=\"pos(-1,0);\"\
  \ />\n        <input type=\"button\" name=\"right\" onclick=\"pos(1,0);\" />\n \
  \       <input type=\"button\" name=\"up\" onclick=\"pos(0,-1);\" />\n        <input\
  \ type=\"button\" name=\"down\" onclick=\"pos(0,1);\" />\n        <input type=\"\
  button\" name=\"hide\" onclick=\"hideSquare();\" />\n        <input type=\"button\"\
  \ name=\"show\" onclick=\"showSquare(); />\n      </div>\n    </form>\n    <hr />\n\
  \    <div id=\"square\">\n      <p>这个正方形是一个绝对定位的层，你可以通过上面的按钮移动它。</p>\n    </div>\n\
  \  </body>\n</html>\n```\n\n\n\n\n\n• `<div>` 部分定义了图层本身。`id` 属性被设置为值 `\"square\"\
  `。此 `id` 在样式表中用于引用该图层，也将用于你的脚本。\n\n如果你将其加载到浏览器中，你应该能看到按钮和 `\"square\"` 图层，但按钮目前还不起任何作用。列表\
  \ 15.5 中的脚本添加了使用动作的功能。当你将列表 15.4 中的代码加载到浏览器时，它的看起来应该像图 15.5。\n\n**图 15.5** 可移动的图层已准备好移动。\n\
  \n![image](img/15fig05.jpg)\n\n列表 15.5 显示了列表 15.4 中 HTML 调用的 JavaScript 变量和函数。此代码预计（通过\
  \ `<script>` 标签）位于名为 `position.js` 的文件中。\n\n列表 15.5 可移动图层示例脚本\n\n```\nvar x=100,y=150;\n\
  \nfunction pos(dx,dy) {\n    if (!document.getElementById) return;\n    x += 10*dx;\n\
  \    y += 10*dy;\n    obj = document.getElementById(\"square\");\n    obj.style.top=y\
  \ + \"px\";\n    obj.style.left=x + \"px\";\n}\n\nfunction hideSquare() {\n    if\
  \ (!document.getElementById) return;\n    obj = document.getElementById(\"square\"\
  );\n    obj.style.display=\"none\";\n}\n\nfunction showSquare() {\n    if (!document.getElementById)\
  \ return;\n    obj = document.getElementById(\"square\");\n    obj.style.display=\"\
  block\";\n}\n```\n\n脚本开头的 `var` 语句定义了两个变量 `x` 和 `y`，用于存储图层的当前位置。`pos` 函数由四个移动按钮的事件处理器调用。\n\
  \n`pos()` 函数的参数 `dx` 和 `dy` 告诉脚本图层应该如何移动：如果 `dx` 为负数，则从 `x` 中减去一个数字，图层向左移动。如果 `dx`\
  \ 为正数，则给 `x` 加上一个数字，图层向右移动。同样，`dy` 表示向上或向下移动。\n\n`pos()` 函数首先确保支持 `getElementById()`\
  \ 函数，这样它就不会在旧浏览器中运行。然后它将 `dx` 和 `dy` 乘以 10（以使移动更明显），并将它们应用于 `x` 和 `y`。最后，它将 `top`\
  \ 和 `left` 属性设置为新位置（包括指示测量单位的“px”），从而移动图层。\n\n另外两个函数 `hideSquare()` 和 `showsquare()`\
  \ 通过将其 `display` 属性设置为 `\"none\"`（隐藏）或 `\"block\"`（显示）来隐藏或显示图层。\n\n要使用此脚本，请将其保存为\
  \ `position.js`，然后将列表 15.4 中的 HTML 文档加载到浏览器中。图 15.6 显示了此脚本的运行情况——至少在执行动作之后。图 15.6\
  \ 显示了连续点击七次右按钮和十次下按钮后的脚本状态。\n\n**图 15.6** 可移动的图层已经移动。\n\n![image](img/15fig06.jpg)\n\
  \n### 隐藏和显示对象\n\n在上一个示例中，你看到了一些可以隐藏或显示“square”的函数。在本节中，我们将详细查看页面内对象的隐藏和显示。\n\n复习一下，对象具有\
  \ `visibility` 样式属性，用于指定它们当前在页面内是否可见：\n\n```\nObject.style.visibility=\"hidden\"\
  ; // 隐藏对象\nObject.style.visibility=\"visible\"; // 显示对象\n```\n\n使用此属性，你可以在任何浏览器中创建一个隐藏或显示对象的脚本。列表\
  \ 15.6 显示了用于一个允许两个标题显示或隐藏的脚本的 HTML 文档。\n\n列表 15.6 隐藏和显示对象\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>隐藏或显示对象</title>\n    <script type=\"text/javascript\"\
  >\n      function ShowHide() {\n        if (!document.getElementById) return;\n\
  \        var head1 = document.getElementById(\"head1\");\n        var head2 = document.getElementById(\"\
  head2\");\n        var showhead1 = document.form1.head1.checked;\n        var showhead2\
  \ = document.form1.head2.checked;\n        head1.style.visibility=(showhead1) ?\
  \ \"visible\" : \"hidden\";\n        head2.style.visibility=(showhead2) ? \"visible\"\
  \ : \"hidden\";\n      }\n    </script>\n  </head>\n  <body>\n    <h1 id=\"head1\"\
  >这是第一个标题</h1>\n    <h1 id=\"head2\">这是第二个标题</h1>\n    <p>使用 W3C DOM，你可以选择显示标题。</p>\n\
  \    <form name=\"form1\">\n      <div>\n        <input type=\"checkbox\" name=\"\
  head1\" checked onclick=\"ShowHide()\">\n        <input type=\"checkbox\" name=\"\
  head2\" onclick=\"ShowHide()\">\n      </div>\n    </form>\n  </body>\n</html>\n\
  ```\n\n### 修改页面内的文本\n\n接下来，你可以创建一个脚本来修改标题的内容。正如你在本章早期学到的，文本节点的 `nodeValue` 属性包含其实际文本，而标题的文本节点是该标题的子节点。因此，更改标识符为\
  \ `head1` 的标题文本的语法为：\n\n```javascript\nvar head1 = document.getElementById(\"head1\"\
  );\nhead1.firstChild.nodeValue = \"新文本\";\n```\n\n这会将变量 `head1` 分配给标题对象。`firstChild`\
  \ 属性返回标题唯一的子节点文本节点。使用这种技术，可以轻松创建一个允许更改标题的页面。列表 15.7 显示了此脚本的完整文档。\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>JavaScript\
  \ 中的动态文本</title>\n    <script type=\"text/javascript\">\n      function ChangeTitle()\
  \ {\n        if (!document.getElementById) return;\n        var newtitle = document.form1.newtitle.value;\n\
  \        var head1 = document.getElementById(\"head1\");\n        head1.firstChild.nodeValue=newtitle;\n\
  \      }\n    </script>\n  </head>\n  <body>\n    <h1 id=\"head1\">JavaScript 中的动态文本</h1>\n\
  \    <p>使用 W3C DOM，你可以动态地更改页面顶部的标题。输入新标题并</p>\n    <form name=\"form1\">\n     \
  \ <input type=\"text\" name=\"newtitle\">\n      <input type=\"button\" onclick=\"\
  ChangeTitle()\">\n    </form>\n  </body>\n</html>\n```\n\n\n\n\n\n点击 `Change!` 按钮。\n\
  \n```html\n<form action=\"\" name=\"form1\">\n  <div>\n    <input type=\"text\"\
  \ name=\"newtitle\" size=\"40\" />\n    <input type=\"button\" value=\"Change!\"\
  \ onclick=\"ChangeTitle();\" />\n  </div>\n</form>\n</body>\n</html>\n```\n\n此示例定义了一个表单，允许用户为页面输入一个新标题。点击按钮会调用在页头头部中定义的\
  \ `ChangeTitle()` 函数。该函数获取用户在表单中输入的值，并将标题的值更改为新文本。\n\n图 15.8 显示了在输入新标题并点击 `Change!`\
  \ 按钮后页面的效果。\n\n**图 15.8** 标题修改示例的运行效果。\n\n![image](img/15fig08.jpg)\n\n### 向页面添加文本\n\
  \n接下来，你可以创建一个实际上用于向页面添加文本的脚本。要实现这一点，你必须先创建一个新的文本节点。此语句创建一个内容为“this is a test”的新文本节点：\n\
  \n```\nvar node=document.createTextNode(\"this is a test\");\n```\n\n接下来，你可以将此节点添加到文档中。要实现这一点，你使用\
  \ `appendChild` 方法。文本可以添加到任何可以包含文本的元素中，但我们将使用段落。以下语句将之前定义的文本节点添加到标识符为 `p1` 的段落中：\n\
  \n```javascript\ndocument.getElementById(\"p1\").appendChild(node);\n```\n\n列表 15.8\
  \ 显示了一个使用此技术的完整示例的 HTML 文档，该示例使用表单允许用户指定要添加到页面的文本。\n\n列表 15.8 向页面添加文本\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Adding Text\
  \ to a Page</title>\n    <script type=\"text/javascript\">\n      function AddText()\
  \ {\n        if (!document.getElementById) return;\n        var sentence=document.form1.sentence.value;\n\
  \        var node=document.createTextNode(\" \" + sentence);\n        document.getElementById(\"\
  p1\").appendChild(node);\n        document.form1.sentence.value=\"\";\n      }\n\
  \    </script>\n  </head>\n  <body>\n    <h1 id=\"head1\">Create Your Own Content</h1>\n\
  \    <p id=\"p1\"> \n      使用 W3C DOM，你可以动态地向此段落添加\n      句子。输入句子并点击\n      Add!\
  \ 按钮。</p>\n    <form action=\"\" name=\"form1\">\n      <div>\n        <input type=\"\
  text\" name=\"sentence\" size=\"65\" />\n        <input type=\"button\" value=\"\
  Add!\" onclick=\"AddText();\" />\n      </div>\n    </form>\n  </body>\n</html>\n\
  ```\n\n在此示例中，`<p>` 部分定义了将持有添加文本的段落。`<form>` 部分定义了一个表单，其中包含名为 `sentence` 的文本字段和一个\
  \ Add 按钮，该按钮调用 `AddText()` 函数。此函数定义在页头中。\n\n`AddText()` 函数首先将 `sentence` 变量赋值为文本字段中输入的文本。接下来，它创建一个包含该句子的新文本节点，并将新文本节点添加到段落中。\n\
  \n将此文档加载到浏览器中进行测试，并通过输入句子和点击 Add 按钮尝试添加几个句子。图 15.9 显示了在段落中添加多个句子后的该文档。\n\n**图 15.9**\
  \ 文本添加示例的运行效果。\n\n![image](img/15fig09.jpg)\n\n## 总结\n\n在本章中，你学习了 DOM，即 JavaScript\
  \ 的网页对象层级结构。你学习了如何使用 `document` 对象来处理文档，并使用了 `history` 和 `location` 对象来控制浏览器中显示的当前\
  \ URL。\n\n此外，你还学习了用于管理 DOM 对象的函数和属性，并使用了示例脚本来隐藏和显示页面元素、修改文本以及添加文本。你还学习了如何使用 HTML\
  \ 和 CSS 定义可定位的层，以及如何使用 JavaScript 动态使用定位属性。\n\n这些关于 DOM 的基础知识让你为后续章节中学习以更高级、更有效的方式使用\
  \ JavaScript 做好了准备（此处不涉及双关语）。\n\n## 问答\n\n**Q. 我可以避免为每个想要通过脚本处理的 DOM 对象都分配 `id`\
  \ 属性吗？**\n\n**A.** 可以。虽然本章中的脚本通常为了方便起见使用 `id` 属性，但你实际上可以通过 `firstChild` 和 `nextSibling`\
  \ 等节点属性的组合来定位页面上的任何对象。然而，请记住，对 HTML 进行的任何更改都会改变元素在 DOM 层级结构中的位置，因此 `id` 属性是处理此问题的可靠推荐方法。\n\
  \n**Q. 我可以使用 `history` 和 `document` 代替 `window.history` 和 `window.document`。在其他情况下我可以省略\
  \ `window` 对象吗？**\n\n**A.** 可以。例如，你可以使用 `alert` 代替 `window.alert` 来显示消息。`window`\
  \ 对象包含当前脚本，因此它被视为默认对象。但需要警告的是，当你使用框架、层、多个窗口或在事件处理程序中，不应省略 `window` 对象的名称。\n\n**Q.\
  \ 我可以更改历史记录或阻止其产生吗？**\n\n**A.** 你可以使用 `history.replaceState()` 方法更新记录而不添加新记录，或者使用\
  \ `history.pushState()` 添加新记录。为了防止用户返回，你可以使用 `history.replace()`，尽管从用户体验角度来看通常不这样做。\n\
  \n**Q. 当我的页面包含多个框架时会发生什么？**\n\n**A.** 每个框架都有它们自己的 `window` 对象。要访问框架的文档，你需要使用 `window.frames[\"\
  frameName\"].document`。\n\n## 工作坊\n\n工作坊包含测验题和练习，帮助你理解材料内容。在查看“答案”部分之前，尝试回答所有问题。\n\
  \n## 测验\n\n**1. 哪个 DOM 对象没有父对象？**\n\na. `body`\nb. `div`\nc. `document`\n\n**2.\
  \ 获取标识为 `head1` 的标题 DOM 对象的正确语法是哪个？**\n\na. `document.getElementById(\"head1\")`\n\
  b. `document.GetByID(\"head1\")`\nc. `document.getById(\"head1\")`\n\n**3. 以下哪个标签可以用于创建层？**\n\
  \na. `<layer>`\nb. `div`\nc. `<style>`\n\n**4. 哪个属性控制元素的左到右位置？**\n\na. `left`\n\
  b. `width`\nc. `lrpos`\n\n**5. 以下哪个 CSS 规则会创建一个页面上不可见的标题？**\n\na. `h1 {visibility:\
  \ invisible;}`\nb. `h1 {display: none;}`\nc. `h1 {style: invisible;}`\n\n## 答案\n\
  \n1. c. `document` 对象是 DOM 对象树的根，没有父对象。\n2. a. `getElementById` 的开头 `g` 是小写，结尾 `d`\
  \ 也是小写，不符合标准英语语法。\n3. b. `<div>` 标签可以创建可定位的层。\n4. a. `left` 属性控制元素的左到右位置。\n5. b.\
  \ `display` 属性的 `none` 值使元素不可见。也可以 `visibility` 属性，但其可能值是 `visible` 或 `hidden`。\n\
  \n## 练习\n\n\n\n\n\n如果你想通过在本章中学到的 DOM 特性获得更多经验，请尝试以下操作：\n\n- 修改列表 15.2 中的“后退和前进”示例，在后退和前进按钮的基础上添加一个“刷新”按钮。（该按钮将触发\
  \ `location.reload()` 方法。）\n- 修改列表 15.4 和 15.5 中的定位示例，使正方形每次移动 1 像素而不是每次 10 个像素。\n\
  - 在列表 15.6 中添加第三个复选框，允许显示或隐藏文本段。你需要为 `<p>` 标签添加 `id` 属性，在表单中添加一个复选框，并在脚本中添加相应的代码。\n\
  \n# 第 16 章 使用 JavaScript 变量、字符串和数组\n\n本章你将学习：\n\n- 如何命名和声明变量\n- 如何选择使用局部变量还是全局变量\n\
  - 如何为变量赋值\n- 如何在不同数据类型之间转换\n- 如何在表达式中使用变量和字量\n- 字符串是如何存储在 `String` 对象中的\n- 如何创建和使用\
  \ `String` 对象\n- 如何创建和使用数字和字符串数组\n\n现在你已经学习了 JavaScript 和 DOM 的基础知识，是时候深入研究 JavaScript\
  \ 语言的细节了。\n\n在本章中，你将学习三种在 JavaScript 中存储数据的工具：存储数字或文本的 `variables`；用于处理文本的特殊变量 `strings`；以及可以通过数字引用的多个变量\
  \ `arrays`。\n\n## 使用变量\n\n除非你跳过了本书开头与 JavaScript 相关的章节，否则你已经使用了一些变量。你可能可以在没有任何帮助的情况下学会如何使用更多的变量。尽管如此，变量的某些方面你还没有学习过。我们现在来看一些细节。\n\
  \n### 选择变量名\n\n`variables` 是命名的容器，可以存储数据（例如数字、文本字符串或对象）。正如你在书的前面学到的那样，每个变量都有一个名称。在选择变量名时，你必须遵循某些特定规则：\n\
  \n- 变量名可以包含字母表中的字母，包括大和小写。它们还可以包含数字 0–9 和下划线 (`_`) 字符。\n- 变量名不能包含空格或其他标点字符。\n- 变量名的第一个字符必须是字母或下划线。\n\
  - 变量名对大小写敏感——`totalnum`、`Totalnum` 和 `TotalNum` 是不同的变量名。\n- 变量名的长度没有官方限制，但它们必须适合单行显示。\n\
  \n**注意**\n你可以选择使用友好、易于读的名字，也可以使用完全晦涩的名字。帮自己一个忙吧：尽可能使用较长的、友好的名称。虽然你现在可能记得 `a`、`b`、`x`\
  \ 和 `x1` 之间的区别，但睡了一个好觉之后你可能就忘了。\n\n使用这些规则，以下是有效变量名的示例：\n\n```\ntotal_number_of_fish\n\
  LastInvoiceNumber\ntemp1\na\n_var39\n```\n\n### 使用局部变量全局变量\n\n某些计算机语言要求你在在使用变量之前对其进行声明。JavaScript\
  \ 包含了 `var` 关键字，用于声明变量。在许多情况下，你可以省略 `var`；变量在你第一次给它赋值时仍然会被声明。\n\n为了理解在何声明变量，你需要理解\
  \ `scope`（作用域）的概念。变量的作用域是脚本可以使用该变量的区域。变量有两种：\n\n- `Global variables`（全局变量）具有整个脚本（以及同一\
  \ HTML 文档中的其他脚本）的作用域。它们可以在任何地方使用，甚至是函数内部。\n- `Local variables`（局部变量）具有单个函数作为作用域。它们只能在创建它们的函数内部使用。\n\
  \n要创建一个全局变量，你需要在主脚本中声明它，位于任何函数之外。你可以使用 `var` 关键字来声明变量，例如：\n\n```\nvar students =\
  \ 25;\n```\n\n这条语句声明了一个名为 `students` 的变量并赋值赋值为 25。如果该语句在函数外部使用，它将创建一个全局变量。在这种情况下，`var`\
  \ 关键字是可选的，因此该语句与上一个等效：\n\n```\nstudents = 25;\n```\n\n在你养成省略 `var` 关键字的习惯之前，确保你准确理解何时需要它。实际上，始终使用\
  \ `var` 关键字是一个好主意——这会避免错误并让你的脚本更易读，而且通常不会引起任何麻烦。\n\n局部变量属于特定的函数。你在函数内部用 `var` 关键字声明的任何变量都是局部变量。此外，函数参数列表中的变量总是局部变量。\n\
  \n要在函数内部创建局部变量，你必须使用 `var` 关键字。这会强制 JavaScript 创建局部变量，即使存在同名的全局变量。\n\n你现在应该理解局部变量和全局变量的区别了。如果你仍然感到有些困惑，不要担心——正如你在第\
  \ 4 章“理解 JavaScript”中学到的，你可以使用等号为变量赋值。例如，这条语句为变量 `lines` 赋值为 40：\n\n```\nlines =\
  \ 40;\n```\n\n你可以在等号右侧使用任何表达式，包括其他变量。你之前用过这种语法来给变量加 1：\n\n```\nlines = lines + 1;\n\
  ```\n\n由于变量的递加减非常常见，JavaScript 为这种语法提供了两种简写形式。第一种是 `+=` 运算符，它允许你创建上述示例的更短版本：\n\n\
  ```\nlines += 1;\n```\n\n同样地，你可以使用 `-=` 运算符从变量中减去一个数字：\n\n```\nlines -= 1;\n```\n\
  \n如果你仍然觉得输入内容太多了，JavaScript 还包含了递增和递减运算符 `++` 和 `--`。这条语句将 `lines` 的值加 1：\n\n```\n\
  lines++;\n```\n\n同样地，这条语句从 `lines` 的值中减 1：\n\n```\nlines--;\n```\n\n你可以交替在变量名之前使用\
  \ `++` 或 `--` 运算符，例如 `++lines`。然而，它们并不相同。区别在于递增或递减发生的时机：\n\n- 如果运算符在变量之后，递加或递减发生在当前表达式求值*之后*。\n\
  - 如果运算符在变量名之前，递加或递减发生在当前表达式求值*之前*。这种这种差异只在你在同一条语句中使用变量并对其进行递增或递减时才会产生问题。作为一个例子，假设你已经给\
  \ `lines` 变量赋值为 40。以下两条语句的效果不同：\n\n```\nalert(lines++);\nalert(++lines);\n```\n\n\
  **注意**\n这些运算符严格来说是为了你的方便。如果你觉得坚持 `lines = lines + 1` 对你更有意义，那就这样做吧——你的脚本不会受到影响。\n\
  \n第一条语句显示值为 40 的警框，然后将 `lines` 变为 41。第二条语句先将 `lines` 增加到 41，然后显示值为 41 的警框。\n\n##\
  \ 理解表达式和运算符\n\n*expression*（表达式）是变量和值的组合，JavaScript 解释器可以将其求值为单个值。用于组合这些值的字符（例如\
  \ `+` 和 `/`）被称为 *operators*（运算符）。\n\n**提示**\n除了变量和常量值外，你还可以在表达式中使用返回结果的函数调用。\n\n\
  #### 使用 JavaScript 运算符\n\n\n\n\n\n你已经使用过一些运算符，例如 `+` 符号（加法）以及 `increment` 和 `decrement`\
  \ 运算符。表 16.1 列出了你在 JavaScript 表达式中可以使用的一些重要运算符。\n\n### 表 16.1 常见的 JavaScript 运算符\n\
  \n![image](img/16tab01.jpg)\n\n除了这些之外，还有许多用于条件语句的运算符；你将在第 18 章“使用条件和循环控制流”中学习这些内容。\n\
  \n## 运算符优先级\n\n当你在表达式中使用多个运算符时，JavaScript 使用`运算符优先级`（operator precedence）规则来决定如何计算值。表\
  \ 16.1 按优先级从低到高的顺序列出了运算符，优先级最高的运算符会被求值。例如，考虑以下语句：\n\n```\nresult = 4 + 5 * 3;\n\
  ```\n\n> 注意\n如果你熟悉任何其他编程语言，你会发现 JavaScript 中的运算符和优先级在很大程度上与 C、C++、Java 以及 PHP 等\
  \ Web 脚本语言的工作方式相同。\n\n如果你尝试计算这个结果，有两种方法。你可以先乘 `5 * 3` 然后加 `4`（结果为：`19`），或者先加 `4\
  \ + 5` 然后乘以 `3`（结果为：`27`）。JavaScript 通过遵循优先级规则来解决这个困境：因为乘法的优先级高于加法，它会先乘以 `5 * 3`\
  \ 然后加 `4`，从而得到结果 `19`。\n\n有时运算符优先级并不会产生你想要的结果。例如，考虑以下语句：\n\n```\nresult = a + b\
  \ + c + d / 4;\n```\n\n这是试图通过将四个数字相加然后除以 4 来计算平均值。然而，由于 JavaScript 给的除法的优先级高于加法，它会在加上其他数字之前先将变量\
  \ `d` 除以 `4`，从而产生错误的结果。\n\n你可以通过括号来控制优先级。这里是计算平均值的有效语句：\n\n```\nresult = (a + b\
  \ + c + d) / 4;\n```\n\n> 提示\n如果你不确定运算符优先级，可以使用括号来确保运行结果符合你的预期，并让你的脚本更具可读性。\n\n\
  括号确保了四个变量先相加，然后将和除以 4。\n\n## JavaScript 中的数据类型\n\n在某些计算机语言中，你必须指定变量将存储的数据类型，例如数字或字符串。在\
  \ JavaScript 中，大多数情况下你不需要指定数据类型。然而，你应该了解 JavaScript 可以处理的数据类型。\n\n> 注意\n你将在第 18\
  \ 章学习更多关于布尔值以及在 JavaScript 中使用条件的内容。\n\n这些是 JavaScript 数据类型：\n\n- **数字，如 `3`、`25`\
  \ 或 `1.4142138`**——JavaScript 支持整数和浮点数。\n- **布尔值，或逻辑值**——它们可以是两个值之一：`true` 或 `false`。这些值用于指示某个条件是否真。\n\
  - **字符串，如 `\"I am a jelly doughnut\"`**——它们由一个或多个文本字符组成。（严格来说，这些是 `String` 对象，你将在本章稍后的部分学习它们。）\n\
  - **由关键字 `null` 表示的空值**——这是未定义变量的值。例如，如果变量 `fig` 之前没有被使用或定义，语句 `document.write(fig)`\
  \ 将导致该值（以及一条错误消息）。\n\n尽管 JavaScript 会跟踪每个变量当前存储的数据类型，但它并没有限制你中途更改类型。例如，假设你通过给变量赋值来声明一个变量：\n\
  \n```\ntotal = 31;\n```\n\n> 注意\n虽然 JavaScript 的这一功能方便又强大，但也可能让你很容易出错。例如，如果 `total`\
  \ 变量随后被用于数学计算，结果将是无效的——但 JavaScript 不会警告你犯了这个错误。\n\n该语句声明了一个名为 `total` 的变量并给它赋值为\
  \ 31。这是一个数值变量。现在假设你更改了 `total` 的值：\n\n```\ntotal = \"albatross\";\n```\n\n这为 `total`\
  \ 分配了一个字符串值，替换了数值。当此语句执行时，JavaScript 不会显示错误；它是完全有效的，尽管这可能不是一个非常有用的总和。\n\n## 数据类型之间的转换\n\
  \nJavaScript 在可以的情况下都会为你处理数据类型之间的转换。例如，你已经使用过这样的语句：\n\n```\ndocument.write(\"The\
  \ total is \" + total);\n```\n\n该语句会出类似 `\"The total is 40\"` 的消息。由于 `document.write`\
  \ 函数与字符串配合，JavaScript 解释器会在执行函数之前将表达式中的任何非字符串（在本例中为 `total` 的值）转换为字符串。\n\n这对于浮点值和布尔值同样有效。然而，在某些情况下它不起作用。例如，如果\
  \ `total` 的值为 `40`，以下语句将正常工作：\n\n```\naverage = total / 3;\n```\n\n然而，`total` 变量也可能包含字符串；在这种情况下，前面的语句将导致错误。\n\
  \n在某些情况下，可能会得到一个包含数字的字符串，并需要将其转换为普通的数值变量。JavaScript 包含了两个为此目的函数：\n\n- `parseInt()`——将字符串转换为整数。\n\
  - `parseFloat()`——将字符串转换为浮点数。\n\n这两个函数都会从字符串的开头读取数字并返回一个数值版本。例如，这些语句将字符串 `\"30 angry\
  \ polar bears\"` 转换为数字：\n\n```\nstringvar = \"30 angry polar bears\";\nnumvar =\
  \ parseInt(stringvar);\n```\n\n> 注意\n这些函数会在字符串的开头寻找相应类型的数字。如果没有找到有效数字，函数将返回特殊值 `NaN`，意味着*不是数字*（not\
  \ a number）。\n\n执行这些语句后，变量 `numvar` 包含数字 30。字符串的非数字部分被忽略。\n\n## 使用字符串对象\n\n你在之前的章节中已经使用过几个字符串。字符串存储一组文本字符，命名方式与其他变量类似。作为一个简单的示例，该语句将字符串\
  \ `This is a test` 赋值给名为 `test` 的字符串变量：\n\n```\ntest = \"This is a test\";\n```\n\
  \n### 创建字符串对象\n\nJavaScript 将字符串存储为 `String` 对象。你通常不需要担心，这将解释字符串的一些技巧，这些技巧使用了 `String`\
  \ 对象的方法（内置函数）。\n\n创建新的 `String` 对象有两种方法。第一种是你已经使用的，而第二种使用面向对象的语法。以下两个语句创建相同的字符串：\n\
  \n```\ntest = \"This is a test\";\ntest = new String(\"This is a test\");\n```\n\
  \n第二个语句使用了 `new` 关键字，你用它创建对象。这告诉浏览器创建一个包含文本 `This is a test` 的新 `String` 对象，并将其赋值给变量\
  \ `test`。\n\n> 注意\n尽管可以使用面向对象的语法创建字符串，但标准的 JavaScript 语法更简单，而且两种方法创建的字符串没有区别。\n\n\
  ### 赋值\n\n你可以像给任何其他变量一样给字符串赋值。上一节中的两个示例都为字符串分配了初始值。你也可以在字符串创建后赋值。例如，以下语句用一个新字符串替换\
  \ `test` 变量的内容：\n\n```\ntest = \"This is only a test.\";\n```\n\n\n\n\n你也可以使用连接运算符（`+`）来组合两个字符串的值。列表\
  \ 16.1 显示了赋值和组合字符串值的一个简单示例。\n\n列表 16.1 给字符串赋值并组合它们的值\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>String Text</title>\n  </head>\n  <body>\n\
  \    <h1>String Test</h1>\n    <script type=\"text/javascript\">\n      test1 =\
  \ \"This is a test. \";\n      test2 = \"This is only a test.\";\n      both = test1\
  \ + test2;\n      alert(both);\n      </script>\n  </body>\n</html>\n```\n\n该脚本为两个字符串变量\
  \ `test1` 和 `test2` 赋值，然后显示包含它们组合值的警告。如果你在浏览器中加载此 HTML 文档，你的输出应该类似于图 16.1。\n\n**图\
  \ 16.1** 字符串示例脚本的输出。\n\n![image](img/16fig01.jpg)\n\n除了使用 `+` 运算符连接两个字符串外，你还可以使用\
  \ `+=` 运算符向字符串添加文本。例如，此语句向字符串 `sentence` 的当前内容添加了一个句号：\n\n```javascript\nsentence\
  \ += \".\";\n```\n\n### 注意\n加号（`+`）在 JavaScript 中也用于数字相。浏览器会根据你与加号配合使用的数据类型判断是使用加法还是连接。如果你在数字和字符串之间使用它，数字将转换为字符串并进行连接。\n\
  \n### 计算字符串的长度\n有时你可能会发现知道字符串变量包含多少个字符是有用的。你可以通过 `String` 对象的 `length` 属性来实现这一点，该属性可用于任何字符串。要使用此属性，输入字符串的名称后跟\
  \ `.length`。\n\n例如，`test.length` 指 `test` 字符串的长度。这里是该属性的一个示例：\n\n```javascript\n\
  test = \"This is a test.\";\ndocument.write(test.length);\n```\n\n### 注意\n记住，尽管\
  \ `test` 是一个字符串变量，但 `test.length` 的值是一个数字，可以用于任何数值表达式。\n\n第一条语句将字符串 `This is a test`\
  \ 赋值给变量 `test`。第二个语句显示字符串的长度——在本例中为 15 个字符。`length` 属性是一个只读属性，因此你不能给它赋值来更改字符串的长度。\n\
  \n### 转换字符串的大小\n`String` 对象的两种方法允许将字符串的内容转换为全大写或全小写：\n\n- `toUpperCase()`——将字符串中的所有字符转换为大写\n\
  - `toLowerCase()`——将字符串中的所有字符转换为小写\n\n### 注意\n注意，这些方法的语法与之前介绍的 `length` 属性相似。区别在于方法始终使用括号，而属性不需要。`toUpperCase`\
  \ 和 `toLowerCase` 方法不接受任何参数，但你仍然需要使用括号。\n\n例如，以下语句以小写形式显示 `test` 字符串变量的值：\n\n```javascript\n\
  document.write(test.toLowerCase());\n```\n\n假设该变量包含文本 `This Is A Test`，结果将是以下字符串：\n\
  \nthis is a test\n\n注意，该语句并没有更改 `text` 变量的值。这些方法返回字符串的大写或小写形式版本，但它们不会更改字符串本身。如果你想更改字符串的值，可以使用像这样的语句：\n\
  \n```javascript\ntest = test.toLowerCase();\n```\n\n### 处理子字符串\n到目前为止，你处理的是整个字符串。JavaScript\
  \ 还允许你处理*子字符串*（substrings），即字符串的一部分。你可以使用 `substring` 方法获取字符串的一个部分，或使用 `charAt`\
  \ 方法获取单个字符。这些将在接下来的章节中解释。\n\n#### 使用字符串的局部\n`substring` 方法返回一个由原始字符串中两个索引值之间的部分组成的字符串，你必须在括号中指定这些值。例如，以下语句显示\
  \ `text` 字符串的第四到第六个字符：\n\n```javascript\ndocument.write(text.substring(3,6));\n\
  ```\n\n此时，你可能在想 `3` 和 `6` 是从哪里来的。关于索引参数，你需要理解三点：\n\n- 索引从字符串第一个字符的 `0` 开始，所以第四个字符实际上是索引\
  \ `3`。\n- 第二个索引是不包含的。\n- 第二个索引是可选的；如果省略，方法将进行到字符串的末尾。\n\n### 获取单个字符\n`charAt` 方法是从字符串中提取单个字符的简单方法。你在括号中指定字符的索引或位置。索引从第一个字符的\
  \ `0` 开始。以下是使用 `alpha` 字符串的一些示例：\n\n- `alpha.charAt(0)` 返回 `A`。\n- `alpha.charAt(12)`\
  \ 返回 `M`。\n- `alpha.charAt(25)` 返回 `Z`。\n- `alpha.charAt(27)` 返回空字符串，因为该位置没有字符。\n\
  \n### 注意\n与大多数 JavaScript 方法和属性名一样，`indexOf` 是区分大小的。在脚本中使用它时，确保你的输入与此处所示完全一致。\n\n\
  ### 查找子字符串\n子字符串的另一个用途是在另一个字符串内查找字符串。一种方法是使用 `indexOf` 方法。要使用此方法，在你要搜索的字符串后添加 `indexOf`，并在括号中指定要搜索的字符串。此示例在\
  \ `test` 字符串中搜索 `\"this\"`：\n\n```javascript\nloc = test.indexOf(\"this\");\n```\n\
  \n### 注意\n第二个参数的一个用途是搜索字符串的多次出现。在找到第一个匹配项后，你从该位置开始搜索第二个，依此类推。\n\n`loc` 变量中返回的值是字符串中的索引，类似于\
  \ `substring` 方法中的第一个索引。字符串的第一个字符索引为 `0`。\n\n你可以指定一个可选的第二个参数来指示开始搜索的索引值。例如，此语句在\
  \ `temp` 字符串中搜索单词 `fish`，从第 20 个字符开始：\n\n```javascript\nlocation = temp.indexOf(\"\
  fish\",19);\n```\n\n第二个方法 `lastIndexOf()` 工作方式相同，但它会找到字符串的*最后*一次出现。它从最后一个字符开始反向搜索字符串。例如，此语句在\
  \ `names` 字符串中找到 `Fred` 的最后一次出现：\n\n```javascript\nlocation = names.lastIndexOf(\"\
  Fred\");\n```\n\n与 `indexOf()` 一样，你可以指定一个搜索位置作为第二个参数。在这种情况下，字符串将从该位置开始反向搜索。\n\n\n\
  \n\n\n`array`（数组）是一个编号的数据组，你可以将其视为一个单一单元。例如，你可能会使用一个名为 `scores` 的数组来存储某个游戏的多个分数。数组可以包含字符串、数字、对象或其他类型的数据。数组中的每个项目被称为该数组的\
  \ `element`（元素）。\n\n### 创建数值数组\n\n与大多数其他 JavaScript 变量类型不同，你通常需要在在使用数组之前先声明它。下面的示例创建了一个包含四个元素的数组：\n\
  \n```\nscores = new Array(4);\n```\n\n要给数组赋值，你使用方括号中的索引。索引从 `0` 开始，因此此示例中的数组元素将分别编号为\
  \ `0` 到 `3`。这些语句为数组的四个元素分配值：\n\n```javascript\nscores[0] = 39;\nscores[1] = 40;\n\
  scores[2] = 100;\nscores[3] = 49;\n```\n\n**Tip**\n记住在使用 `new` 关键字声明数组时要使用圆括号，例如\
  \ `a=new Array(3,4,5)`；在不使用 `new` 的情况下声明数组时要使用方括号，例如 `a=[3,4,5]`。否则，你会遇到 JavaScript\
  \ 错误。\n\n你也可以在声明数组的同时为元素指定值。这条语句在一行内创建了相同的 `scores` 数组：\n\n```javascript\nscores\
  \ = new Array(39,40,100,49);\n```\n\n你还可以使用简写语法来声明数组并指定其内容。下面的语句是创建 `scores` 数组的另一种方式：\n\
  \n```javascript\nscores = [39,40,100,49];\n```\n\n### 理解数组长度\n\n与字符串一样，数组有一个 `length`\
  \ 属性。它告诉你数组中元素的数量。如果你在创建数组时指定了长度，那么该值将成为 `length` 属性的值。例如，这些语句将打印数字 `30`：\n\n```javascript\n\
  scores = new Array(30);\ndocument.write(scores.length);\n```\n\n你可以声明一个没有特定长度的数组，以后通过给元素赋值或更改\
  \ `length` 属性来改变长度。例如，这些语句创建了一个新数组并为其其中两个元素赋值值：\n\n```javascript\ntest = new Array();\n\
  test[0]=21;\ntest[5]=22;\n```\n\n在这个示例中，因为目前分配的最大索引数字是 `5`，所以数组的 `length` 属性为 `6`——记住，元素是从\
  \ 0 开始编号的。\n\n**Tip**\n看到这个示例，你可能会认为显示大型数组的所有元素会很不方便。这正是循环的理想用场，循环允许你使用不同的值多次执行相同的语句。你将在第\
  \ 18 章中学习关于循环的所有知识。\n\n### 访问数组元素\n\n你可以使用与赋值值时相同的表示法来读取数组的内容。例如，下面的语句将显示 `scores`\
  \ 数组前三个元素的值：\n\n```javascript\nscoredisp = \"Scores: \" + scores[0] + \",\" + scores[1]\
  \ + \",\" + scores[2];\ndocument.write(scoredisp);\n```\n\n### 使用字符串数组\n\n到目前为止，你使用的是数字数组。JavaScript\
  \ 还允许你使用 `string arrays`（字符串数组），即字符串的数组。这是一个强大的功能，让你能够同时处理大量的字符串。\n\n### 创建字符串数组\n\
  \n你声明字符串数组的方式与数值数组相同——事实上，JavaScript 并不区分它们：\n\n```javascript\nnames = new Array(30);\n\
  ```\n\n然后你可以为数组元素分配字符串值：\n\n```javascript\nnames[0] = \"Henry J. Tillman\";\nnames[1]\
  \ = \"Sherlock Holmes\";\n```\n\n与数值数组一样，你也可以在创建字符串数组时指定其内容。。以下任一语句都可以创建与前面示例相同的字符串数组：\n\
  \n```javascript\nnames = new Array(\"Henry J. Tillman\", \"Sherlock Holmes\");\n\
  names = [\"Henry J. Tillman\", \"Sherlock Holmes\"];\n```\n\n你可以在任何使用字符串的地方使用字符串数组元素。你甚至可以使用之前引入的字符串方法。例如，下面的语句将打印\
  \ `names` 数组第一个元素的前五个字符，结果为 `Henry`：\n\n```javascript\ndocument.write(names[0].substring(0,5));\n\
  ```\n\n### 拆分字符串\n\nJavaScript 包含名为 `split` 的字符串方法，它可以将字符串拆分为它的组成部分。要使用此方法，请指定要拆分的字符串和一个用于划分部分的字符：\n\
  \n```javascript\ntest = \"John Q. Public\";\nparts = test.split(\" \");\n```\n\n\
  在这个示例中，`test` 字符串包含名字 `John Q. Public`。第二个语句中的 `split` 方法在每个空格处拆分 `name` 字符串，产生三个字符串。这些字符串存储在一个名为\
  \ `parts` 的字符串数组中。执行示例语句后，`parts` 的元素包含以下内容：\n\n- `parts[0] = \"John\"`\n- `parts[1]\
  \ = \"Q.\"`\n- `parts[2] = \"Public\"`\n\nJavaScript 还包含一个数组方法 `join`，它执行相反的功能。这条语句将\
  \ `parts` 数组重新组合成字符串：\n\n```javascript\nfullname = parts.join(\" \");\n```\n\n括号中的值指定了一个用于分隔部分的字符。在这种情况下，使用了空格，结果是\
  \ `John Q. Public`。如果你不指定字符，则使用逗号。\n\n### 字符串数组\n\nJavaScript 还包含一个数组方法 `sort`，它返回一个字符串。例如，下面的语句初始化了一个数组：\n\
  \n```javascript\nnames[0] = \"Public.\";\nnames[1] = \"Jane\";\nnames[2] = \"Daisy\"\
  ;\nnames[3] = \"Mickey\";\nnames.sort();\n```\n\n### 数值数组\n\n`sort` 方法按字母顺序排序，对于数值数组不起作用——如果数组包含\
  \ `4, 10, 30, 200`。幸运的是，可以在 `sort` 方法中指定一个函数：\n\n```javascript\nnums = new Array(30);\n\
  nums.sort(\n```\n\n**Note**\nJavaScript 期望比较函数在 `a` 在 `b` 之前时返回负数，在相等时返回 0，在 `a`\
  \ 在 `b` 之后时返回正数。这就是为什么使用 `a-b`。\n\n```javascript\nfunction numcompare(a,b) {\n \
  \   return a-b;\n}\n```\n\n### 尝试一下：排序并显示名称\n\n为了获得更多使用 JavaScript 字符串和数组功能的经验，你可以创建一个允许用户输入名称列表并显示排序后列表的脚本。正如[第\
  \ 14 章]所描述的，你将创建的 HTML 和 JavaScript 文件。首先，`sort.html` 文件将包含 HTML 结构和脚本使用的表单字段。示例\
  \ 16.2 显示了 HTML 文档。\n\n**示例 16.2 排序示例的 HTML 文档**\n\n```html\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n \"\
  http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n<head>\n    <title>Array Sorting Example</title>\n    <script\
  \ type=\"text/javascript\" src=\"sort.js\"></script>\n</head>\n<body>\n    <h1>Sorting\
  \ String Arrays</h1>\n    <p>在下面的字段中输入两个或多个名称，排序后的名称列表将出现在文本区域中。</p>\n    <form\
  \ name=\"theform\">\n        Name:\n        <input type=\"text\" name=\"newname\"\
  \ size=\"20\" />\n        <input type=\"button\" name=\"addname\" value=\"Add\"\
  \ onclick=\"SortNames();\">\n    </form>\n    <br/>\n    <h2>Sorted Names</h2>\n\
  </body>\n</html>\n```\n\n\n\n\n\n```html\n<textarea cols=\"60\" rows=\"10\" name=\"\
  sorted\">\n\n  排序后的名称将在这里显示。\n\n</textarea>\n\n</form>\n\n</body>\n\n</html>```\n\
  \n* * *\n\n由于脚本将位于单独文档中，文档头部的 `<script>` 标签使用 `src` 属性来包含名为 `sort.js` 的 JavaScript\
  \ 文件。你接下来将创建此文件。\n\n本文定义了一个名为 `theform` 的表单、一个名为 `newname` 的文本字段、一个 `addname` 按钮以及名为\
  \ `sorted` 的文本区域。你的脚本将使用这些表单字段作为其用户界面。\n\nListing 16.3 提供了排序过程所需的 JavaScript。\n\n\
  列表 16.3 排序示例的 JavaScript 文件\n\n* * *\n\n```javascript\n// 初始化计数器和数组\n\nvar numnames=0;\n\
  \nvar names = new Array();\n\nfunction SortNames() {\n   // 从文本字段中获取名称\n   thename=document.theform.newname.value;\n\
  \   // 将名称添加到数组中\n   names[numnames]=thename;\n   // 增加计数器\n   numnames++;\n   //\
  \ 排序数组\n   names.sort();\n   document.theform.sorted.value=names.join(\"\\n\");\n\
  }\n```\n\n* * *\n\n脚本通过 `var` 关键字开始定义两个变量：`numnames` 是一个计数器，每添加一个名称就会递增，而 `names`\
  \ 数组将存储名称。\n\n当你向文本字段中输入名称并点击按钮时，`onclick` 事件处理器会调用 `SortNames` 函数。该函数将文本字段的值存储在变量\
  \ `thename` 中，然后使用 `numnames` 作为索引将名称添加到 `names` 数组中。随后增加 `numnames` 为下一个名称做准备。\n\
  \n脚本的最后部分对名称进行排序并显示。首先，使用 `sort()` 方法对 `names` 数组进行排序。接下来使用 `join()` 方法合并名称，用换行符分隔并在文本区域中显示。\n\
  \n要测试该脚本，请将其保存为 `sort.js`，然后将之前创建的 `sort.html` 文件加载到浏览器中。你可以添加一些名称并测试脚本。图 16.2 显示了排序几个名称后的结果。\n\
  \n**图 16.2** 名称排序示例的输出。\n\n![image](img/16fig02.jpg)\n\n* * *\n\n## 总结\n\n在本章中，你专注于变量以及\
  \ JavaScript 如何处理它们。你学习了如何命名变量、如何声明变量，以及局部变量与全局变量之间的区别。你还探索了 JavaScript 支持的数据类型以及如何转换。\n\
  \n你还学习了 JavaScript 中复杂的变量、字符串和数组，并查看了允许对它们执行操作的功能，例如将字符串转换为大写或对数组。\n\n在下一章中，你将通过学习另外两个关键特性：函数和对象，继续你的\
  \ JavaScript 基础教育。\n\n## 问答\n\n**Q. `var` 关键字的重要性在哪里？我应该始终使用它来声明变量吗？**\n\n**A.**\
  \ 你只需要在函数内部使用 `var` 来定义局部变量。然而，如果你完全不确定，使用 `var` 总是安全的。一致地使用它有助于你保持脚本组织有序且无错误。\n\
  \n**Q. 是否有理由我想使用 `var` 关键字来创建一个与全局变量同名的局部变量？**\n\n**A.** 不是刻意为。使用 `var` 的主要原因是避免与你可能不知道的全局变量发生冲突。例如，你将来可能会添加一个全局变量，或者在页面上添加另一个使用相似变量名的脚本。这在大型、复杂的脚本中更多是一个问题。\n\
  \n**Q. 布尔变量有什么用？**\n\n**A.** 在脚本中，你通常需要一个变量来指示某些事情是否发生——例如，用户输入的电话号码格式是否正确。布尔变量非常适合这种情况；它们在处理条件时也有用，正如你在第\
  \ 18 章中看到的。\n\n**Q. 我可以在数组中存储其他类型的数据吗？例如，我可以有一个日期数组吗？**\n\n**A.** 绝对可以。JavaScript\
  \ 允许你在数组中存储任何数据类型。\n\n**Q. 二维数组呢？**\n\n**A.** 这些是具有两个索引（如列和行）的数组。JavaScript 不直接支持这种数组，但你可以使用对象来实现相同的效果。你将在下一章学习更多关于对象。\n\
  \n## 工作坊\n\n工作坊包含了测验题和练习，帮助你巩固对涵盖材料的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n## 测验\n\n**1\
  \ 下列哪项*不是*有效的变量名？**\n\na. `2names`\nb. `first_last`\nc. `FirstLast`\n\n**2 如果语句\
  \ `var fig=2` 现在函数中，它声明的是哪种变量？**\n\na. 全局变量\nb. 局部变量\nc. 常量变量\n\n**3 如果字符串 `test`\
  \ 包含 \"The has landed.\"，`test.length` 的值是多少？**\n\na. `4`\nb. `21`\nc. `The`\n\n\
  **4 使用相同的示例，这些语句中哪一个会返回单词 `eagle`？**\n\na. `test.substring(4,9)`\nb. `test.substring(5,9)`\n\
  c. `test.substring(\"eagle\")`\n\n**5 JavaScript 表达式 `31 + \" angry bears\"` 的结果是什么？**\n\
  \na. 错误消息\nb. 32\nc. \"31 angry bears\"\n\n## 答案\n\n1. `2names` 是一个无效的变量名，因为它以数字开头。其他的都是有效的，尽管它们不是命名的理想选择。\n\
  \n2. 因为变量是在函数中声明的，所以它是局部变量。`var` 关键字确保创建了局部变量。\n\n3. 字符串的长度为 21 个字符。\n\n4. 正确的语句是\
  \ `test.substring(4,9)`。记住索引从 0 开始，第二个索引是不包含在内的。\n\n5. JavaScript 将整个表达式转换为字符串 `\"\
  31 angry bears\"`。（无意犯北极熊之意，它们很少生气，也很少在大规模群体中出现。）\n\n## 练习\n\n• 修改 Listing 16.3\
  \ 中的排序示例，在排序和显示之前将名称转换为全大写。\n\n• 修改 Listing 16.3，在文本区域中显示带编号的名称列表。\n\n\n\n\n\n你目前为止看到的脚本都是简单的指令列表。浏览器从\
  \ `<script>` 标签后的第一个语句开始，并顺序执行每条指令，直到遇到闭合标签 `</script>`（或遇到错误）。\n\n虽然对于短脚本来说这种方法非常直接，但阅读以这种方式编写的长脚本可能会很困惑。为了方便你组织脚本，JavaScript\
  \ 支持函数，你已经在第 14 章“JavaScript 编程入门”中学习过它们。在本节中，你将学习如何定义和使用函数。\n\n## 定义函数\n\n`函数`\
  \ 是可以被视为单个的 JavaScript 语句组。要使用函数，你必须先定义它。这里有一个函数定义示例：\n\n```javascript\nfunction\
  \ Greet() {\n    alert(\"Greetings.\");\n}\n```\n\n这段代码段定义了一个向用户显示警告消息的函数。它以 `function`\
  \ 关键字开头。函数的名称是 `Greet`。注意函数名后的括号。正如你接下来将学的，它们之间的空间并不总是空的。\n\n函数定义的第一行和最后一行包含大括号（`{`\
  \ 和 `}`）。你用它们来包裹函数中的所有语句。浏览器使用大括号来确定函数的开始和结束。\n\n在大括号之间，这个特定的函数包含单行。它使用了内置的 `alert`\
  \ 函数，该函数会显示一条警告消息。消息将包含文本“Greetings.”\n\n***\n\n注意\n\n函数名是区分大小写的。如果你定义了一个带有大写字母的函数（如\
  \ `Greet`），请确保在调用该函数时使用相同的名称。也就是说，如果你定义的函数名称是 `Greet`，但你尝试使用 `greet` 来调用它，它将无法工作。\n\
  \n***\n\n现在，让我们谈谈那些括号。目前的 `Greet` 函数总是执行相同的操作：你每次使用它时，它都会显示相同的消息。虽然这避免了一些输入工作，但并没有并没有提供多少优势。\n\
  \n为了让你的函数更灵活，你可以添加 `parameters`（参数），也称为 `arguments`（参数值）。这些是函数每次被调用时接收的变量。例如，你可以添加一个名为\
  \ `who` 的参数，告诉函数要问候的人的名字。以下是修改后的 `Greet` 函数：\n\n```javascript\nfunction Greet(who)\
  \ {\n    alert(\"Greetings, \" + who);\n}\n```\n\n当然，要使用此函数，你应该将其包含在 HTML 文档中。传统上，函数定义的最佳位置是文档的\
  \ `<head>` 部分。因为 `<head>` 部分中的语句会被首先执行，这确保了函数在被使用之前已经定义。\n\n列表 17.1 显示了嵌入在 HTML\
  \ 文档头部部分的 `Greet` 函数。\n\n列表 17.1 HTML 文档中的 `Greet` 函数\n\n***\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Functions</title>\n    <script type=\"\
  text/javascript\">\n      function Greet(who) {\n          alert(\"Greetings, \"\
  \ + who);\n      }\n    </script>\n  </head>\n  <body>\n    <p>This is the body\
  \ of the page.</p>\n  </body>\n</html>\n```\n\n***\n\n## 调用函数\n\n你现在已经定义了一个函数并将其放置在\
  \ HTML 文档中。然而，如果你将列表 17.1 加载到浏览器中，你会发现它什么也没做。这是因为函数已经定义了——准备好被使用了——但我们还没有使用它。\n\n\
  使用函数被称为 `calling`（调用）函数。要调用函数，请将函数名作为脚本中的一个语句。你需要包含括号以及函数参数的值。例如，这里有一条调用 `Greet`\
  \ 函数的语句：\n\n```javascript\nGreet(\"Fred\");\n```\n\n这告诉 JavaScript 解释器将控制转移到 `Greet`\
  \ 函数中的第一个语句。它还将将参数 `\"Fred\"` 传递给函数。该值将赋值给函数内部的 `who` 变量。\n\n***\n\n提示\n\n函数可以有多个参数。要定义带有多个参数的函数，列出每个参数的变量名，并用逗号分隔。调用函数时，为每个参数指定用逗号分隔的值。\n\
  \n***\n\n列表 17.2 显示了一个完整的 HTML 文档，其中包含了函数定义以及页面主体中实际调用该函数的第二个脚本。为了演示函数的用处，我们将调用它两次。\n\
  \n列表 17.2 完整示例\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Functions</title>\n    <script type=\"text/javascript\">\n      function\
  \ Greet(who) {\n          alert(\"Greetings, \" + who);\n      }\n    </script>\n\
  \  </head>\n  <body>\n    <p>This is the body of the page.</p>\n    <script type=\"\
  text/javascript\">\n      Greet(\"Fred\");\n      Greet(\"Jane\");\n    </script>\n\
  \  </body>\n</html>\n```\n\n***\n\n## 返回值\n\n你刚刚创建的函数向用户显示消息，但函数也可以向调用它们的脚本返回一个值。这使得你能够使用函数来计算值。例如，你可以创建一个计算四个数字平均值的函数。\n\
  \n***\n\n注意\n\n我也在函数的第一行中包含了起始大括号（`{`）。这是一种常见的风格，但你也可以将大括号放在下一行或单独占一行。\n\n***\n\n\
  你的函数应该以 `function` 关键字、函数名以及它接受的参数开头。我们将使用变量名 `a`、`b`、`c` 和 `d` 作为要计算平均值的四个数字。这是函数的第一行：\n\
  \n```javascript\nfunction Average(a,b,c,d) {\n```\n\n接下来，函数需要计算四个参数的平均值。你可以通过将它们相加，然后除以参数的数量（在这种情况下为\
  \ 4）来计算。因此，这是函数的下一行：\n\n```javascript\nresult = (a + b + c + d) / 4;\n```\n\n这条语句创建了一个名为\
  \ `result` 的变量，并通过相加四个数字然后除以 4 来计算结果。（括号是必要的，告诉 JavaScript 在除法之前执行加法。）\n\n要将此结果传给调用函数的脚本，你使用\
  \ `return` 关键字。这是函数的最后部分：\n\n```javascript\nreturn result;\n}\n```\n\n列表 17.3 显示了\
  \ HTML 文档中完整的 `Average` 函数。该 HTML 文档在 `<body>` 部分还包含了一个小型脚本，该脚本调用 `Average` 函数并显示结果。\n\
  \n\n\n\n\n## 函数示例：平均值\n\n```javascript\nfunction Average(a,b,c,d) {\n  result =\
  \ (a + b + c + d) / 4;\n  return result;\n}\n```\n\n以下是函数调用的结果。\n\n```javascript\n\
  score = Average(3,4,5,6);\ndocument.write(\"The average is: \" + score);\n```\n\n\
  你可以在函数调用中使用变量，如列表所示。该语句计算了数字 3、4、5 和 6 的平均值，并将结果存储在名为 `score` 的变量中：\n\n```\nscore\
  \ = Average(3,4,5,6);\n```\n\n## 提示\n你也可以直接在表达式中使用函数调用。例如，你可以使用 `alert` 语句来显示函数\
  \ `alert(Average(1,2,3,4))` 的结果。\n\n## 介绍对象\n\n在上一章中，你学习了如何使用变量来表示 JavaScript 中的不同类型的数据。JavaScript\
  \ 还支持 `objects`（对象），这更复杂的变量，可以存储多个数据项和函数。\n\n虽然一个变量在此时只能有一个值，但对象可以包含多个值，以及用于处理这些值的函数。这允许你将相关的数据项和处理它们的函数组合到单个对象中。\n\
  \n在本章中，你将学习如何定义和使用你自己的对象。你已经接触过其中一些，包括：\n\n- **DOM 对象**——允许你的脚本与网页进行交互。你在第 15 章\
  \ “使用文档对象模型 (DOM)”中学习过这些内容。\n- **内置对象**——包括字符串和数组，你可以在第 16 章 “使用 JavaScript 变量、字符串和数组”中学习过它们。\n\
  \n处理所有三种类型对象（DOM 对象、内置对象和自定义对象）的语法是相同的，因此即使你最终没有创建自己的对象，也应该对 JavaScript 的对象术语和语法有良好的理解。\n\
  \n### 创建对象\n\n当上一章创建一个数组时，使用了以下 JavaScript 语句：\n\n```\nscores = new Array(4);\n\
  ```\n\n`new` 关键字告诉 JavaScript 解释器使用一个函数——在这种情况下，是内置的 `Array` 函数——来创建一个对象。你将在本章稍后的部分为自定义对象创建一个函数。\n\
  \n### 对象属性和值\n\n每个对象都有一个或多个 `properties`（属性）——本质上存储在对象中的变量。例如，在第 15 章中，你学习到 `location.href`\
  \ 属性提供当前文档的 URL。`href` 属性是 DOM 中 `location` 对象的属性之一。\n\n你还使用过 `String` 对象的 `length`\
  \ 属性，如上一章示例所示：\n\n```javascript\ntest = \"This is a test.\";\ndocument.write(test.length);\n\
  ```\n\n像变量一样，每个对象属性都有一个 `value`（值）。要读取属性的值，你只需要在任何表达式中包含对象名和属性名并用点分隔，如之前的 `test.length`。你可以使用\
  \ `=` 运算符更改属性的值，就像更改变量一样。下面的示例通过更改 `location.href` 属性将浏览器重定向到新 URL：\n\n```\nlocation.href=\"\
  http://www.google.com/\";\n```\n\n### 注意\n对象也可以是另一个对象的属性。这被称为 `child object`（子对象）。\n\
  \n### 理解方法\n\n除了属性之外，每个对象还可以有一个或多个 `methods`（方法）。这些是处理对象数据的函数。例如，正如你在第 15 章中学习过的那样，下面的\
  \ JavaScript 语句会重新加载当前文档：\n\n```javascript\nlocation.reload();\n```\n\n当你使用 `reload()`\
  \ 时，你正在使用 `location` 对象的一个方法。像普通函数一样，方法可以在括号中接受参数并返回。\n\n## 使用对象简化脚本编写\n\n尽管 JavaScript\
  \ 的变量和数组是存储数据的灵活方式，但有时你需要一种更复杂的结构。例如，假设你正在编写一个脚本来处理一个名片数据库，该数据库包含许多人的姓名、地址和电话号码。\n\
  \n如果你使用普通变量，你需要为数据库中的每一个人准备几个独立的变量：一个姓名变量、一个地址变量等等。这会非常混乱。\n\n数组会稍微改善情况。你可以有一个 `names`\
  \ 数组、一个 `addresses` 数组和一个电话号码数组。数据库中的每个人在每个数组中都有一个条目。这会更方便，但仍不完美。\n\n通过对象，你可以让存储数据库的变量像名片一样符合逻辑。每个人由一个\
  \ `Card` 对象表示，该对象具有姓名、地址和电话号码属性。你甚至可以给对象添加方法来显示或处理信息。\n\n在接下来的章节中，你将使用 JavaScript\
  \ 实际创建 `Card` 对象及其属性和方法。在本章稍后的部分，你将在脚本中使用 `Card` 对象显示数据库中几位成员的信息。\n\n### 定义对象\n\n\
  创建对象的第一步是给对象及其属性命名。我们已经决定将对象命名为 `Card` 对象。每个对象将具有以下属性：\n\n- `name`\n- `address`\n\
  - `workphone`\n- `homephone`\n\n在 JavaScript 程序中使用此对象的第一步是创建一个函数来创建新的 `Card` 对象。这个函数被称为对象的\
  \ `constructor`（构造函数）。以下是 `Card` 对象的构造函数：\n\n```javascript\nfunction Card(name,address,work,home)\
  \ {\n  this.name = name;\n  this.address = address;\n  this.workphone = work;\n\
  \  this.homephone = home;\n}\n```\n\n构造函数是一个简单的函数，接受参数来初始化新对象并将其分配给相应的属性。该函数接受来自调用语句的多个参数，然后将它们分配为对象的属性。因为函数被名为\
  \ `Card`，所以该对象就是 `Card` 对象。\n\n注意 `this` 关键字。每当你创建一个对象定义时都会使用它。使用 `this` 来引用当前对象——即由函数正在创建的对象。\n\
  \n### 定义对象方法\n\n接下来，你将创建一个方法来处理 `Card` 对象。由于所有的 `Card` 对象都具有相同的属性，拥有一个能以整洁格式打印属性的函数可能会很有。我们将此函数命名为\
  \ `PrintCard`。\n\n你的 `PrintCard` 函数将作为 `Card` 对象的方法使用，因此你不需要参数。相反，你可以再次使用 `this`\
  \ 关键字来引用当前对象的属性。以下是 `PrintCard()` 函数的定义：\n\n```javascript\nfunction PrintCard()\
  \ {\n  line1 = \"Name: \" + this.name + \"<br/>\\n\";\n  line2 = \"Address: \" +\
  \ this.address + \"<br/>\\n\";\n  line3 = \"Work Phone: \" + this.workphone + \"\
  <br/>\\n\";\n  line4 = \"Home Phone: \" + this.homephone + \"<hr/>\\n\";\n  document.write(line1,\
  \ line2, line3, line4);\n}\n```\n\n此函数简单地从当前对象（`this`）读取属性，带有标题打印每个属性，并跳转到新行。\n\n\
  你现在有一个可以打印卡片的函数，但它并不是 `Card` 对象的正式方法。你需要做的最后一件事是让 `PrintCard` 成为 `Card` 对象定义的一部分。以下是修改后的函数定义：\n\
  \n```javascript\nfunction Card(name,address,work,home) {\n  this.name = name;\n\
  \  this.address = address;\n  this.workphone = work;\n  this.homephone = home;\n\
  \  this.PrintCard = PrintCard;\n}\n```\n\n\n\n\n\n新增的语句看起来就像另一个属性定义，但它实际上引用了 `PrintCard`\
  \ 函数。只要 `PrintCard` 函数是用它自己的函数定义定义的，这种方法就能生效。方法本质上是定义函数的属性，而不是简单的值。\n\n***\n\n**提示**\n\
  \n上一个示例在属性上使用了小写名称（如 `workphone`），而在方法上使用了大写名称（`PrintCard`）。你可以在属性和方法名中使用任何大小写组合，但这样做是清晰地表明\
  \ `PrintCard` 是一个方法而非普通属性的一种方法。\n\n***\n\n### 创建对象实例\n\n现在，让我们使用你刚刚创建的对象定义和方法。要使用对象定义，你需要创建一个新对象。这是通过使用\
  \ `new` 关键字完成的。这与你已经创建 `Date` 和 `Array` 对象时使用的关键字相同。\n\n以下语句创建了一个名为 `tom` 的新 `Card`\
  \ 对象：\n\n```\ntom = new Card(\"Tom Jones\", \"123 Elm Street\", \"555-1234\", \"\
  555-9876\");\n```\n\n如你所见，创建一个对象非常简单。你只需要调用 `Card()` 函数（对象定义），并按照定义的相同顺序提供所需的属性。\n\
  \n在该语句执行完毕后，会创建一个新对象来存储 Tom 的信息。这被称为 `Card` 对象的*实例*（instance）。就像程序中可以有多个字符串变量一样，你定义的对象也可以有多个实例。\n\
  \n与其使用 `new` 关键字指定卡片的所有信息，你也可以在创建后对它们进行赋值。例如，以下脚本创建了一个名为 `holmes` 的空 `Card` 对象，然后为其分配了了属性：\n\
  \n```\nholmes = new Card();\nholmes.name = \"Sherlock Holmes\";\nholmes.address\
  \ = \"221B Baker Street\";\nholmes.workphone = \"555-2345\";\nholmes.homephone =\
  \ \"555-3456\";\n```\n\n在使用上述两种方法之一创建 `Card` 对象的实例后，你可以使用 `PrintCard()` 方法来显示它的信息。例如，此语句显示了\
  \ `tom` 卡片的属性：\n\n```\ntom.PrintCard();\n```\n\n### 扩展内置对象\n\nJavaScript 包含了一项允许你扩展内置对象定义的功能。例如，如果你认为\
  \ `String` 对象并不完全符合你的需求，你可以扩展它，添加新的属性或方法。如果你正在创建一个使用许多字符串的大型脚本，这可能会非常有用。\n\n你可以通过使用\
  \ `prototype` 关键字向现有对象同时添加属性和方法。（*prototype*（原型）是对象定义或构造函数的另一个称呼。）`prototype` 关键字允许你在构造函数之外修改对象的定义。\n\
  \n为了举个例，让我们为 `String` 对象定义添加一个方法。你将创建一个名为 `heading` 的方法，它可以将字符串转换为 HTML 标题。以下语句定义了一个名为\
  \ `title` 的字符串：\n\n```\ntitle = \"Fred's Home Page\";\n```\n\n该语句会将 `title` 字符串的内容作为\
  \ HTML 1 级标题输出：\n\n```\ndocument.write(title.heading(1));\n```\n\n列表 17.4 为 `String`\
  \ 对象定义添加了 `heading` 方法，该方法会将字符串作为标题显示，然后演示了如何使用该方法显示三个标题。\n\n列表 17.4 为 `String`\
  \ 对象添加方法\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Test of Heading Method</title>\n  </head>\n  <<body>\n    <script type=\"\
  text/javascript\">\n      function addhead (level) {\n        html = \"h\" + level;\n\
  \        text = this.toString();\n        start = \"<\" + html + \">\";\n      \
  \  stop = \"</\" + html + \">\";\n        return start + text + stop;\n      }\n\
  \      String.prototype.heading = addhead;\n      document.write (\"This is a heading\
  \ 1\".heading(1));\n      document.write (\"This is a heading 2\".heading(2));\n\
  \      document.write (\"This is a heading 3\".heading(3));\n    </script>\n  </body>\n\
  </</html>\n```\n\n***\n\n首先，你定义 `addhead()` 函数，它将作为新的字符串方法。它接受一个数字来指定标题级别。`start`\
  \ 和 `stop` 变量用于存储 HTML 的“开始标题”和“结束标题”标签，例如 `<h1>` 和 `</h1>`。\n\n在定义函数后，使用 `prototype`\
  \ 关键字将其添加为 `String` 对象的方法。然后你就可以在任何 `String` 对象（或者事实上，是任何 JavaScript 字符串）上使用此方法。最后三个语句演示了这一点，它们将带引号的文本字符串作为第\
  \ 1、2 和 3 级标题显示。\n\n***\n\n尝试尝试：在对象中存储数据\n\n现在你已经创建了一个用于存储名片的新对象以及一个用于打印它们的方法。作为对象、属性、函数和方法的最后一个演示，你现在将在网页中使用此对象显示几张卡片的数据。\n\
  \n你的脚本需要包含 `PrintCard` 的函数定义，以及 `Card` 对象的函数定义。然后你将创建三张卡片并在文档主体中打印它们。我们将在此示例中使用独立的\
  \ HTML 和 JavaScript 文件。列表 17.5 显示了完整的脚本。\n\n列表 17.5 使用 `Card` 对象的示例脚本\n\n***\n\n\
  ```javascript\n// 定义函数\nfunction PrintCard() {\n  line1 = \"<strong>Name: </strong>\"\
  \ + this.name + \"<br/>\\n\";\n  line2 = \"<strong>Address: </strong>\" + this.address\
  \ + \"<br/>\\n\";\n  line3 = \"<strong>Work Phone: </strong>\" + this.workphone\
  \ + \"<br/>\\n\";\n  line4 = \"<strong>Home Phone: </strong>\" + this.homephone\
  \ + \"<hr/>\\n\";\n  document.write(line1, line2, line3, line4);\n}\n\nfunction\
  \ Card(name,address,work,home) {\n  this.name = name;\n  this.address = address;\n\
  \  this.workphone = work;\n  this.homephone = home;\n  this.PrintCard = PrintCard;\n\
  }\n\n// 创建对象\nsue = new Card(\"Sue Suthers\", \"123 Elm Street\", \"555-1234\",\
