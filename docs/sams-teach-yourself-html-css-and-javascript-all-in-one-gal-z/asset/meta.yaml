- - '##'
  - Q. 我可以在导航菜单中使用图形作为自定义的列表吗？
- - '##'
  - A. 可以。你可以在列表项（list item）的文本中使用图形，或者像其他元素一样样式。垂直导航与水平列表之间的区别在于，你可以对列表进行样式，告诉用户它确实不同。你可以突出列表。
