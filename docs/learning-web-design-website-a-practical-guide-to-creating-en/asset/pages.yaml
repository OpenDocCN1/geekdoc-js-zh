    # Creating a Gradient Background Using CSS


    To create a gradient background in CSS, you can use the linear-gradient() or radial-gradient()
    functions within the background-image or background property. Here''s how to do
    it:


    # 1. Linear Gradient


    A linear gradient transitions colors along a straight line. The syntax is as follows:


    ```

    css

    background-image: linear-gradient(direction, color-stop1, color-stop2, ...);

    ```


    +   - **Direction**: You can specify the direction using keywords (like to right,
    to bottom, etc.) or angles (like 90deg for right).


    +   - **Color Stops**: These define the colors in the gradient and can include
    multiple colors.


    # Example


    ```

    css

    ```'
