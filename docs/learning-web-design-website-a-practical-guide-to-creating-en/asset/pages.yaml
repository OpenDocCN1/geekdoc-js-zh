    # 2.5 Different Types of Input Elements


    HTML forms support a variety of input types using the <input> element with a type
    attribute. Some commonly used input types include:


    +   - Text: <input type="text"> for single-line text input

    - Password: <input type="password"> for password fields

    - Radio Buttons: <input type="radio"> for selecting one option from a set

    - Checkboxes: <input type="checkbox"> for selecting zero or more options

    - Submit: <input type="submit"> for submitting the form

    - Email: <input type="email"> for entering email addresses

    - Number: <input type="number"> for numeric input

    - Date: <input type="date"> for selecting a date


    Other input types include color, file, range, search, tel, time, url, etc. Each
    type provides specific functionality and validation


    # Validating User Input


    HTML forms support built-in validation using attributes like:


    +   - required: Ensures the field is filled out before submission

    - pattern: Specifies a regular expression the input must match

    - min and max: Set minimum and maximum values for numeric inputs

    - type: Using appropriate types like email, url, provides basic validation


    Server-side validation is also essential to ensure all data is valid and safe.
    This involves checking for required fields, validating formats, and sanitizing
    inputs to prevent attacks.'
