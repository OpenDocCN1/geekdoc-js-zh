    # 4.5 DOM Manipulation and Event Handling in JavaScript


    DOM (Document Object Model) manipulation and event handling are essential skills
    for web developers. They enable the dynamic interaction between JavaScript and
    HTML documents, allowing developers to create responsive and interactive web applications.


    # 1. What is DOM Manipulation?


    DOM manipulation refers to the process of using JavaScript to change the structure,
    style, and content of a web page dynamically. The DOM represents the page as a
    tree of objects, where each element, attribute, and piece of text is a node in
    this tree. By manipulating the DOM, developers can create, modify, or remove elements
    in real-time without needing to reload the page.


    # 2. Accessing DOM Elements


    To manipulate the DOM, you first need to access its elements. JavaScript provides
    several methods to select elements:


    +   - getById(): Selects a single element by its ID.


    ```

    javascript\const header = document.getElementById(''header'');

    ```


    getElementsByClassName(): Selects elements with a specific class name. Returns
    a live HTMLCollection.


    ```

    javascript

    const items = document.getElementsByClassName(''item'');

    ```


    getElementsByTagName(): Selects elements by their tag name. Returns a live HTMLCollection.


    ```

    javascript

    const paragraphs = document.getElementsByTagName(''p'');

    ```'
