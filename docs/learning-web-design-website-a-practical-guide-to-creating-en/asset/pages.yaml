    # Common Mistakes to Avoid


    **Not using <label> elements:** Always use <label> elements to provide context
    for each form control. This improves accessibility and usability


    **Not setting name attributes:** Ensure each form control has a unique name attribute.
    This allows the server to identify the submitted data


    **Not validating user input:** Use HTML5 validation attributes like required,
    pattern, min, max to validate input before form submission


    **Not handling empty dropdown selections:** If an option is required, the required
    attribute on the <select> element. This prevents the form from being submitted
    without a selection


    **Overusing dropdown menus:** Use dropdown menus judiciously. For a small number
    of options, radio buttons or checkboxes may be more user-friendly


    **Not styling the dropdown menu:** Customize the appearance of the <select> element
    using CSS to match the overall design of your form


