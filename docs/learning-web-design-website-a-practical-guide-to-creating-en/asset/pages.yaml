    # 4. Event Handling


    Event handling is the process of responding to user interactions with the web
    page, such as clicks, key presses, and mouse movements. JavaScript provides a
    way to listen for and respond to these events.


    # 4.1 Adding Event Listeners


    You can add event listeners to DOM elements using the add method. This method
    takes two arguments: the event type and the callback function to execute when
    the event occurs.


    ```

