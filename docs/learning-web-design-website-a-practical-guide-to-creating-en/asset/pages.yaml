- img_proc: true
  md: 'The current version is WCAG 2.1, published in 2018. The WCAG guidelines are
    organized around four principles:


    +   1. **Perceable**: Users must be able to perceive the information being presented,
    it can''t be invisible to all their senses.

    2. **Operable**: User interface components and navigation must be operable.

    3. **Understandable**: Information and the operation of the user interface must
    be understandable.

    4. **Robust**: Content must be robust enough that it can be interpreted reliably
    by a wide variety of user agents, including assistive technologies.


    Under these four principles, there are 13 guidelines that provide the basic goals
    that authors should work toward. Each guideline has testable success criteria
    at levels A, AA or AAA, with A being the minimum and AAA the highest accessibility
    level.


    # Accessibility Compliance


    Many countries have laws requiring websites to be accessible, often referencing
    the WCAG guidelines:


    +   **United States**: The Americans with Disabilities Act (ADA) has been interpreted
    to apply to websites. There is no consensus yet on which WCAG level to follow
    for ADA compliance.

    **European Union**: The European Accessibility Act requires public sector websites
    and mobile apps to conform to EN 301 549, which references WCAG 2.1 AA.

    **Canada**: The Accessible Canada Act requires federal government websites to
    meet WCAG 2.1 AA.

    **Australia**: The Web Accessibility National Transition Strategy requires government
    websites to meet WCAG 2.1 AA.

    **India**: The Guidelines for Indian Government Websites require conformance to
    WCAG 2.0 AA.'
  merge: -1
  pgno: 222
- img_proc: true
