  md: "```\nbody {\n  background-image: linear-gradient(to right, #ff7e5f, #feb47b);\n\
    }\n```\n\nThis example creates a gradient that transitions from a peach color\
    \ to a light orange from left to right.\n\n# 2. Radial Gradient\n\nA radial gradient\
    \ transitions colors from a central point outward. The syntax is:\n\n```\ncss\n\
    background-image: radial-gradient(shape size at position, color-stop1, color-stop2,\
    \ ...);\n```\n\n# Example\n\n```\ncss\nbody {\n  background-image: radial-gradient(circle,\
