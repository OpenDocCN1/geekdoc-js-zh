    # 2.3 Semantic HTML and Accessibility


    Semantic HTML is an essential aspect of modern web development that focuses on
    using HTML elements in a way that conveys meaning and structure to both users
    and machines. This approach enhances accessibility, improves search engine optimization
    (SEO), and creates a more maintainable codebase.


    # 1. What is Semantic HTML?


    Semantic HTML refers to the use of HTML markup that accurately describes the content
    and its purpose. Unlike non-semantic elements, as `<div>` and `<span>`, which
    do not convey any meaning about the content they contain, semantic elements provide
    context and meaning. For example, elements like `<header>`, `<footer>`, `<article>`,
    and `<section>` clearly indicate their role within the document structure.


    # Examples of Semantic Elements


    +   - `<header>`: Represents introductory content or a group of navigational links.

    - `<footer>`: Defines the footer for a section or document, typically containing
    metadata, copyright information, or links.

    - `<article>`: Represents a self-contained piece of content that can be independently
    distributed or reused, such as a blog post or news article.

    - `<section>`: Defines a thematic grouping of content, typically with a heading.

    - `<nav>`: Contains navigation links to other parts of the website.


    Using these semantic elements help both developers and browsers understand the
    structure and purpose of the content, making it easier to manage and style.


    # 2. Benefits of Semantic HTML


    Improved Accessibility'
