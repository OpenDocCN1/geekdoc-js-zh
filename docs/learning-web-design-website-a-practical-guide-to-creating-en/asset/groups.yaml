    +   3. Prepare Tasks: Create realistic tasks for participants to complete during
    the testing session. These tasks should reflect common user scenarios and goals.


    +   4. Choose a Testing Method: Decide whether to conduct moderated or unmoderated
    testing, and whether it will be remote or in-person based on your objectives and
    results.


    +   5. Facilitate the Session: During moderated testing, guide participants through
