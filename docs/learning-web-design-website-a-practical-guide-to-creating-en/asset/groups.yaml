    \ are executed after a certain task is completed. They are a fundamental way to\
    \ handle asynchronous operations in JavaScript.\n\n# Example of a Callback\n\n\
    ```\njavascript\nfunction fetchData(callback) {\n  setTimeout(() => {\n    const\
    \ data = { name: \"Alice\", age: 25 };\n    callback(data);\n  }, 2000);\n}\n\n\
    fetchData((data) => {\n  console.log(\"Data received:\", data);\n});\n```\n\n\
    In this example, fetchData simulates an asynchronous operation that takes 2 seconds\
    \ to complete. Once the data is ready, it calls the provided callback function\
    \ with the data.\n\n# 3. Promises\n\nPromises are a more advanced way to handle\
    \ asynchronous operations and provide a cleaner syntax compared to callbacks.\
    \ A promise represents a value that may be available now, in the future, or never.\
    \ Promises can be in one of three states: pending, fulfilled, or rejected.\n\n\
    # Creating a Promise\n\n```\njavascript\nconst fetchData = () => {\n  return new\
