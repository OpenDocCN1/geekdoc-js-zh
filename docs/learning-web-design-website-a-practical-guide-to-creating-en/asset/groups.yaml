    \ 更改页面结构、样式和内容的过程。DOM 将页面表示为对象树，开发者可以在无需重新加载的情况下面的实时创建、修改或删除元素。\n\n## 访问 DOM 元素\n\
    \n要操作 DOM，你首先需要访问它的元素。JavaScript 提供了几种方法来选择元素：\n\n- getById(): 通过 ID 选择单个元素。\n\
    - getClassName(): 选择具有特定类名的元素。返回一个实时的 HTMLCollection（live HTMLCollection）。\n-\
    \ getElementsByTagName(): 通过标签名选择元素。返回一个实时的 HTMLCollection（live HTMLCollection）。\n\
    - querySelector(): 选择第一个匹配 CSS 选择器的元素。\n- querySelectorAll(): 选择所有匹配 CSS 选择器的元素，返回一个静态的\
    \ NodeList。\n\n## 操作 DOM 元素\n\n一旦你访问了元素，就可以使用各种属性和方法对其进行操作：\n\n- 更改内容：使用 textContent\
    \ 或 innerHTML 更改元素的内容。\n- 创建新元素：使用 document.createElement() 创建新元素。\n- 添加元素：使用\
    \ appendChild() 向父节点添加新元素。\n- 移除元素：使用 removeChild() 从 DOM 中删除元素。\n- 修改属性：使用 setAttribute()\
    \ 和 getAttribute() 更改或获取元素的属性。\n- 更改样式：使用 style 属性直接修改 CSS 样式。\n\n# 4. 事件处理\n\n\
    事件处理是对用户与 Web 页面交互的过程，例如点击、按键按下和鼠标移动。JavaScript 提供了一种监听并响应这些事件的方法。\n\n### 4.1\
    \ 添加事件监听器\n\n可以使用 addEventListener 为 DOM 元素添加事件监听器。该方法接受两个参数：事件类型和事件发生时执行的回调函数。\n\
    \n```javascript\nconst button = document.getElementById('myButton');\nbutton.addEventListener('click',\
    \ () => {\n  alert(\"Button was clicked!\");\n});\n```\n\n### 4.2 常见事件\n\n你可以处理的一些常见事件包括：\n\
    \n- 点击事件：当元素被点击时触发。\n- 鼠标事件：包括 mouseover、mouseout 和 mouse 等事件。\n- 键盘事件：包括 keydown、keyup\
    \ 和 keypress 事件。\n- 表单事件：包括 submit、focus 和 change 事件。\n\n### 4.3 事件传播\n\nJavaScript\
    \ 中的事件可以通过两个阶段在 DOM 中进行传播：**捕获**（capturing）和**冒泡**（bubbling）。你可以使用 addEventListener\
    \ 中的 capture 参数来控制这种行为。\n\n- **冒泡**：事件从目标元素开始并向上传播到根节点。\n- **捕获**：事件从根节点开始向下到达目标元素。\n\
    \n```javascript\ndocument.getElementById('parent').addEventListener('click', ()\
    \ => {\n  console.log(\"Parent clicked!\");\n}, false); // 冒泡阶段\n\ndocument.getElementById('child').addEventListener('click',\
    \ () => {\n  console.log(\"Child clicked!\");\n}, true); // 捕获阶段\n```\n\n# 第 5\
    \ 章：探索用于 Web 设计的 Web 图形\n\n## 5.1 格式与优化\n\n在进行 Web 设计时，选择正确的图像格式并针对性能优化图像对于创建视觉吸引力且高效的网站至关重要。本节将探索常见的图像格式、它们的特性以及优化的最佳实践。\n\
    \n## 1. 图像格式\n\nWeb 上广泛使用了多种图像格式，每种都有其优缺点。常见的格式包括：\n\n### 1.1 JPEG (联合摄影专家小组)\n\
    \n- 特性：\n  - 最适合照片和具有渐变的图像。\n  - 使用有损压缩，通过丢弃某些图像数据来减小文件大小。\n  - 不支持透明。\n- 用途：适用于需要高质量但必须最小化文件大小\
    \ Web 图片。\n- 优点：\n  - 文件大小小且质量良好。\n  - 支持百万种颜色。\n\n### 1.2 PNG (便携网络图形)\n\n- 特性：\n\
    \  - 支持无损压缩，保留图像质量。\n  - 允许透明，包括可变透明（alpha 通道）。\n- 用途：最适合需要透明度的图像，如 Logo 和图标。\n\
    - 优点：\n  - 无细节丢失的高质量图像。\n  - 支持透明。\n\n### 1.3 GIF (图形交换格式)\n\n- 特性：\n  - 支持最多\
