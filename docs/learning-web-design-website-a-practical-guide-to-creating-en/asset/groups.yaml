    \n## Chapter 2: Getting Started with HTML\n\n## 2.1 Structure of HTML Documents\n\
    \nHTML (HyperText Markup Language) is the standard language used to create web\
    \ pages. Understanding the structure of HTML documents is essential for anyone\
    \ looking to build websites. Let us get into the fundamental components of HTML\
    \ documents, including the basic structure, elements, attributes, and best practices\
    \ for writing clean and effective HTML.\n\n### 1. Basic Structure of an HTML Document\n\
    \nAn HTML document consists of a series of nested elements that define the content\
    \ and structure of the page. The basic structure of an HTML document includes\
    \ the following components:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n\
    <head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <title>Your Page Title</title>\n</head>\n<body>\n  <h1>Hello,\
    \ World!</h1>\n  <p>This is a simple HTML document.</p>\n</body>\n</html>\n```\n\
    \nExplanation of the Components:\n\n1. `<!DOCTYPE html>`: This declaration defines\
    \ the document type and version of HTML being used. It informs the browser that\
    \ the document is an HTML5 document.\n\n2. `<html>`: This is the root element\
    \ of the HTML document. It encompasses all other elements and attributes within\
    \ the document. The `lang` attribute specifies the language of the document, which\
    \ is helpful for search engines and accessibility tools.\n\n3. `<head>`: The head\
    \ section contains meta-information about the document, as its title, character\
    \ set, and links to stylesheets or scripts. This information is not displayed\
    \ directly on the web page but is essential for proper rendering and SEO.\n\n\
    \   - `<meta charset=\"UTF-8\">`: This tag specifies the character encoding for\
    \ the document, ensuring that text is displayed correctly across different browsers\
    \ and devices.\n   - `<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\"\
    >`: This tag controls the layout on mobile browsers. It sets the width of the\
    \ viewport to the device's width and establishes the initial zoom level.\n   -\
    \ `<title>`: The title element defines the title of the web page, which appears\
    \ in the browser tab and is used by search engines as the clickable headline in\
    \ search results.\n\n4. `<body>`: The body section contains the content that is\
    \ displayed on the web page. This includes text, images, links, and other media.\
    \ All visible elements of the page are nested within the body tag.\n\n## Common\
    \ HTML Elements\n\nHTML documents are composed of various elements, each serving\
    \ a specific purpose. Here are some commonly used HTML elements:\n\n- **Headings:**\
    \ Headings are defined using `<h1>` to `<h6>` tags, with `<h1>` being the highest\
    \ level and `<h6>` being the lowest. Headings help structure content and improve\
    \ readability.\n\n```html\n<h1>Main Title</h1>\n<h2>Subtitle</h2>\n<h3>Section\
    \ Title</h1>\n```\n\n- **Paragraphs:** Paragraphs are defined using the `<p>`\
    \ tag. They are used to group blocks of text.\n\n```html\n<p>This is a paragraph\
    \ of text.</p>\n```\n\n- **Links:** Links are created using the `<a>` tag, which\
    \ stands for anchor. The `href` attribute specifies the URL to which the link\
    \ points.\n\n```html\n<a href=\"https://www.example.com\">Visit Example</a>\n\
    ```\n\n- **Images:** Images are embedded using the `<img>` tag. The `src` attribute\
    \ specifies the image source, while the `alt` attribute provides alternative text\
    \ for accessibility.\n\n```html\n<img src=\"image.jpg\" alt=\"Description of the\
    \ image\">\n```\n\n- **Lists:** HTML supports ordered lists (`<ol>`) and unordered\
    \ lists (`<ul>`). List items are defined using the `<li>` tag.\n\n```html\n<ul>\n\
    \  <li>Item 1</li>\n  <li>Item 2</li>\n</ul>\n```\n\n- **Divisions:** The `<div>`\
    \ tag is a block-level element that groups content together. It is often used\
    \ for layout purposes and can be styled with CSS.\n\n```html\n<div>\n  <h2>Section\
    \ Title</h2>\n  <p>Content for this section.</p>\n</div>\n```\n\n## 3. Attributes\
    \ in HTML\n\nAttributes provide additional information about HTML elements. They\
    \ are always specified in the opening tag and consist of a name and a value. Here\
    \ are some common attributes:\n\n- `id`: The id attribute assigns a unique identifier\
    \ to an element, allowing it to be targeted by CSS or JavaScript.\n\n```html\n\
    <h1 id=\"main-title\">Welcome to My Website</h1>\n```\n\n- `class`: The class\
    \ attribute assigns one or more class names to an element, which can be used for\
    \ styling multiple elements with the same class.\n\n```html\n<p class=\"highlight\"\
    >This paragraph is highlighted.</p>\n```\n\n- `style`: The style attribute allows\
    \ for inline CSS styles to be applied directly to an element.\n\n```html\n<p style=\"\
    color: blue;\">This text is blue.</p>\n```\n\n- `href`: Used within the `<a>`\
    \ tag to specify the link URL.\n\n```html\n<a href=\"https://www.example.com\"\
    >Visit Example</a>\n```\n"
  mdcn: "\n\n-   **用户测试**：与真实用户进行可用性测试，以收集对设计的反馈。观察用户如何与网站交互，并识别痛点。\n-   **分析**：使用网络分析工具跟踪用户行为并收集有关网站性能的数据。这些信息可以为设计改进提供参考。\n\
    -   **持续改进**：愿意根据用户反馈和分析进行更改。定期更新网站以增强可用性并应对新出现的趋势。\n\n## 第 2 章：HTML 入\n\n## 2.1\
    \ HTML 文档的结构\n\nHTML（超文本标记语言）是用于创建网页的标准语言。理解 HTML 文档的结构对于任何想要构建网站的人来说至关重要。让我们进入\
    \ HTML 文档的基础组成部分，包括基本结构、元素、属性以及编写简洁高效 HTML 的最佳实践。\n\n### 1. HTML 文档的基本结构\n\nHTML\
    \ 文档由一系列嵌套元素组成，这些元素定义了页的内容和结构。HTML 文档的基本结构包含以下组件：\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n  <title>Your Page Title</title>\n\
    </head>\n<body>\n  <h1>Hello, World!</h1>\n  <p>This is a simple HTML document.</p>\n\
    </body>\n</html>\n```\n\n组件说明：\n\n1.  `<!DOCTYPE html>`：此声明定义了所使用的 HTML 文档类型和版本。它告诉浏览器该文档是一个\
    \ HTML5 文档。\n\n2.  `<html>`：这是 HTML 文档的根元素。它包含了文档中的所有其他元素和属性。`lang` 属性指定了文档的语言，这对于搜索引擎和可访问性工具很有帮助。\n\
    \n3.  `<head>`：头部部分包含关于文档的元信息，如标题、字符集以及指向样式表或脚本的链接。这些信息不会直接显示在网页上，但对于正确的渲染和 SEO\
    \ 关关重要。\n\n   - `<meta charset=\"UTF-8\">`：此标签指定文档的字符编码，确保文本在不同的浏览器和设备上正确显示。\n\
    \   - `<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\"\
    >`：此标签控制移动浏览器上的布局。它将视口宽度设置为设备的宽度并建立初始缩放级别。\n   - `<title>`：标题元素定义了网页的标题，它显示在浏览器标签页中，并被搜索引擎用搜索结果中可点击的标题。\n\
    \n4.  `<body>`：主体部分包含在网页上显示的内容。这包括文本、图像、链接和其他媒体。页面的所有可见元素都嵌套在 `<body>` 标签内。\n\n\
    ## 常用 HTML 元素\n\nHTML 文档由各种元素组成，每个元素都有特定的用途。以下是一些常用的 HTML 元素：\n\n-   **标题**：标题使用\
    \ `<h1>` 到 `<h6>` 标签定义，其中 `<h1>` 级别最高，<h6><h6> 级别最低。标题有助于结构化内容并提高可读性。\n\n```html\n\
    <h1>Main Title</h1>\n<h2>Subtitle</h2>\n<h3>Section Title</h3>\n```\n\n-   **段落**：段落使用\
    \ `<p>` 标签定义。它们用于组合文本块。\n\n```html\n<p>This is a paragraph of text.</p>\n```\n\
    \n-   **链接**：链接使用 `<a>` 标签（代表 anchor 锚点）创建。`href` 属性指定了链接指向的 URL。\n\n```html\n\
    <a href=\"https://www.example.com\">Visit Example</a>\n```\n\n-   **图像**：使用 `<img>`\
    \ 标签嵌入。`src` 属性指定图像源，而 `alt` 属性为可访问性提供了替代文本。\n\n```html\n<img src=\"image.jpg\"\
    \ alt=\"Description of the image\">\n```\n\n-   **列表**：HTML 支持有序列表 (`<ol>`) 和无序列表\
    \ (`<ul>`)。列表项使用 `<li>` 标签定义。\n\n```html\n<ul>\n  <li>Item 1</li>\n  <li>Item\
    \ 2</li>\n</ul>\n```\n\n-   **分区 (Div)**：`<div>` 标签是一个块级元素，用于将内容分组。它通常用于布局目的，并可以使用\
    \ CSS 进行样式化。\n\n```html\n<div>\n  <h2>Section Title</h2>\n  <p>Content for this\
    \ section.</p>\n</div>\n```\n\n## 3. HTML 中的属性\n\n属性提供了有关 HTML 元素的额外信息。它们始终在起始标签中指定，由一个名称和一个值组成。以下是一些常见属性：\n\
    \n-   `id`：`id` 属性为元素分配一个唯一标识符，允许通过 CSS 或 JavaScript 进行定位。\n\n```html\n<h1 id=\"\
    main-title\">Welcome to My Website</h1>\n```\n\n-   `class`：`class` 属性为元素分配一个或多个类名，可以对具有相同类的元素进行样式处理。\n\
    \n```html\n<p class=\"highlight\">This paragraph is highlighted.</p>\n```\n\n\
    -   `style`：`style` 属性允许直接对元素应用内联 CSS 样式。\n\n```html\n<p style=\"color: blue;\"\
    >This text is blue.</p>\n```\n\n-   `href`：在 `<a>` 标签内指定链接 URL。\n\n```html\n<a\
    \ href=\"https://www.example.com\">Visit Example</a>\n```\n\n"
