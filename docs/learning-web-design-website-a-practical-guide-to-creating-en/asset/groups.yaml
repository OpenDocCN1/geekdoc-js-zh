    I am block-scoped\";\n  console.log(blockVar);\n}\n```\n\n## 4. 异步 JavaScript\n\
    \n异步 JavaScript 是一种非阻塞执行任务的范式，对于需要时间的操作非常有用。\n\n### 1. 理解异步 JavaScript\n\nJavaScript\
    \ 上是单线程的，这意味着它按行执行代码。当遇到耗时任务（如网络请求）时，如果等待任务完成，程序可能会无响应。异步编程允许 JavaScript 在等待时继续执行代码。\n\
    \n# 异步示例\n\n考虑以下代码片段：\n\n```javascript\nconsole.log(\"Start\");\n\nsetTimeout(()\
    \ => {\n  console.log(\"Timeout finished\");\n}, 3000);\n\nconsole.log(\"End\"\
    );\n```\n\n# 输出：\n\n```\nStart\nEnd\nTimeout finished\n```\n\n示例中，`setTimeout`\
    \ 函数是异步的。程序立即打印 \"Start\" 和 \"End\"，而消息 \"Timeout finished\" 在 3 秒后打印，证明了 JavaScript\
    \ 在等待超时时不会阻塞执行。\n\n### 2. 回调\n\n回调是作为参数传递给函数的函数，并在特定任务完成后执行。它们是 JavaScript 处理异步操作的基础方法。\n\
    \n# 回调示例\n\n```javascript\nfunction fetchData(callback) {\n  setTimeout(() =>\
    \ {\n    const data = { name: \"Alice\", age: 25 };\n    callback(data);\n  },\
    \ 2000);\n}\n\nfetchData((data) => {\n  console.log(\"Data received:\", data);\n\
    });\n```\n\n示例中，`fetchData` 模拟了一个需要 2 秒完成的异步操作。一旦数据准备绪，它就会调用提供的回调函数并传递数据。\n\n\
    ### 3. Promise\n\nPromise 是处理异步操作更高级的方法，与回调相比提供了更整洁的语法。Promise 代表现在、未来或永远可能的值。Promise\
    \ 可以处于三种状态：进行中（pending）、已完成（fulfilled）或已拒绝（rejected）。\n\n# 创建 Promise\n\n```javascript\n\
    const fetchData = () => {\n  return new Promise((resolve, reject) => {\n    setTimeout(()\
    \ => {\n      const data = { name: \"Bob\", age: 30 };\n      resolve(data); //\
    \ 完成 promise\n    }, 2000);\n  });\n});\n```\n\n"
