  - '[PAGE 106]


    Optimizing images is essential for improving website performance, reducing load
    times, and enhancing user experience. Here are some best practices for image optimization:


    # 2.1 Choose the Right Format


    Select the appropriate image format based on the type of image and its intended
    use. For example, JPEG for photographs, PNG for images requiring transparency,
    and SVG for logos and icons.


    # 2.2 Compress Images


    Use compression tools to reduce file sizes without significantly affecting quality.
    Tools like TinyPNG, ImageOptim, and Squoosh can compress images effectively.


    # 2.3 Resize Images


    Ensure images are no larger than necessary for their display size. Use image editing
    software to resize images before uploading them to your website.


    # 2.4 Use Responsive Images


    Implement responsive images using the srcset attribute to serve different image
    sizes based on the user''s device and screen resolution. This helps deliver the
    most appropriate image size, improving load times.


    ```

    <img src="small.jpg"

    srcset="medium.jpg 600w, large.jpg 1200w

    sizes="(max-width: 600px) 100vw, 50vw"

    alt="Description">

    ```


    # 2.5 Implement Lazy Loading


    Use lazy loading to defer loading images that are not immediately visible in the
    viewport. This can significantly improve initial load times.


    ```

    <img src="image.jpg" loading="lazy" alt="Description">

    ```


    # 5.2 When to Use PNG Over JPG for Web Graphics


    You should use PNG over JPG for web graphics in the following scenarios:'
  - '[PAGE 107]


    Transparency Needs: PNG supports transparency and alpha channels, making it ideal
    for images that require clear backgrounds or overlays, such as logos and icons.
    This allows for smooth edges and better integration with various backgrounds


    Images with Text or Sharp Edges: PNG is well-suited for graphics that contain
    text, logos, or illustrations with sharp edges and solid colors. The lossless
    compression of PNG preserves the quality and details of these images, ensuring
    clarity and readability


    Graphics with Limited Colors: If you are working with graphics that have a limited
    color palette or require high detail without artifacts, PNG is a better choice.
    It can handle images with more than 256 colors better than GIF and maintains quality
    across all edits


    Complex Graphics: For images that involve gradients or require high fidelity,
    PNG is preferable as it can display smooth gradients without banding or posterization,
    which can occur in JPG images due to lossy compression


    # Advantages of Using GIFs for Animations on the Web


    GIFs have several advantages for animations on the web:


    Simple Animation Support: GIFs are widely used for simple animations, allowing
    multiple frames to be displayed in sequence. This makes them suitable for short,
    looping animations, such as loading indicators or decorative elements


    Browser Compatibility: GIFs are supported by all major browsers, ensuring that
    animations will work consistently across different platforms and devices


    Transparency: GIFs support one-color transparency, which allows for simple graphics
    to blend seamlessly into various backgrounds. This is useful for logos and icons
    that need to maintain their shape without a visible background


    Low Complexity: GIFs are easy to create and implement, making them a popular choice
    for web designers looking to add simple animations without the need for complex
    coding or additional libraries'
