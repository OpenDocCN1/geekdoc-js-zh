    \nAJAX 可以由各种用户交互触发，例如点击按钮、提交表单或滚动页面。通过向这些交互绑定处理程序，你可以启动 AJAX 请求并相应地更新内容。以下是一个处理按钮点击以加载动态内容的示例：\n\
