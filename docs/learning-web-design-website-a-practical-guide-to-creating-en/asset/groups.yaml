    # 4. Event Handling


    Event handling is the process of responding to user interactions with the web
    page, such as clicks, key presses, and mouse movements. JavaScript provides a
    way to listen for and respond to these events.


    # 4.1 Adding Event Listeners


    You can add event listeners to DOM elements using the add method. This method
    takes two arguments: the event type and the callback function to execute when
    the event occurs.


    ```

    const button = document.getElementById(''myButton'');

    button.addEventListener(''click'', () => {

    alert("Button was clicked!");

    });

    ```


    # 4.2 Common Events


    Some common events you can handle include:


    +   - Click Events: Triggered when an element is clicked.

    - Mouse Events: Includes events like mouseover, mouseout, andmousemove.

    - Keyboard Events: Includes events like keydown, keyup, and keypress.

    - Form Events: Includes events like submit, focus, and change.'
