  mdcn: "\n\n- 优化 SEO：搜索引擎将页面加载速度视为排名因素之一。优化的图像有助于提高搜索引擎的可见性。\n\n- 增强用户参与度：加载速度更快的页面可以留住用户，并鼓励他们探索更多内容，从而提高转化率。\n\
    \n## 2. 图像优化技术\n\n以下是几种用于优化 Web 性能的图像的有效技术。\n\n### 2.1 选择正确的格式\n\n根据图像类型选择合适的图像格式：\n\
    \n- JPEG：最适合照片和具有渐变效果的图像，其压缩效率高。\n\n- PNG：理想用于需要透明度或具有锐利边缘的图像，例如 Logo。\n\n- SVG：非常适合矢量图形、图标和需要缩放且不失质量的插图。\n\
    - WebP：一种现代格式，为有损和无损图像均提供更优的压缩率，显著减小了文件大小。\n\n### 2.2 调整图像尺寸\n\n确保图像尺寸与其显示尺寸匹配。避免在\
    \ HTML 或 CSS 中通过缩小大图像，因为这会导致不必要的数据传输。相反，在将图像上传到网站之前，调整其大小以匹配所需的尺寸。\n\n```xml\n\
    <!-- 使用调整尺寸后的图像 -->\n<img src=\"resized_1000x560_image.jpg\" alt=\"调整尺寸后的图像\"\
    \ />\n```\n\n### 2.3 压缩图像\n\n使用压缩工具在不牺牲质量的情况下减小文件大小。TinyPNG、ImageOptim 和 Squoosh\
    \ 等工具可以有效压缩图像。\n\n### 2.4 实施懒加载\n\n懒加载是一种技术，仅当图像出现在视口时才进行加载。这减少了初始页面加载时间并节省了带宽，对于图像丰富的页面尤其如此。\n\
    \n```html\n<img src=\"image.jpg\" alt=\"描述\" loading=\"lazy\">\n```\n\n### 2.5\
    \ 使用 CSS 精灵图 (Sprites)\n\n将多个小图像合并到单个精灵图中以减少 HTTP 请求次数。然后可以使用 CSS 为网站上的各种元素显示精灵图的特定部分。\n\
    \n## 3. 图形优化最佳实践\n\n- 代码精简：通过消除不必要的字符（如空格和注释）减小 HTML、CSS 和 JavaScript 文件的大小。这可以提高加载速度并减少带宽消耗。\n\
    - 启用缓存：配置服务器对静态资源启用缓存，允许浏览器在本地存储频繁访问的图像和文件。这减少了后续访问时从服务器获取的需求。\n- 使用响应式图像：使用 `srcset`\
    \ 属性实现响应式图像，允许浏览器根据设备的屏幕分辨率选择合适的图像尺寸。\n\n```html\n<img src=\"small.jpg\" srcset=\"\
    medium.jpg 600w, large.jpg 1200w sizes=\"(max-width: 600px) 100vw, 50vw\" alt=\"\
    描述\">\n```\n\n- 测试性能：使用 Google Speed Insights 或 GTmetrix 等工具定期评估网站性能，以识别需要改进之处。\n\
    \n## 5.9 服务器请求的有效技术\n\n减少 HTTP 请求次数对于优化 Web 性能至关重要。是一些最有效的技术：\n\n- 合并文件：将多个 CSS\
    \ 和 JavaScript 文件合并为单个文件。这减少了浏览器发起的请求。\n- 使用 CSS 精灵图：将多个图像合并到一个精灵图中。这允许你加载单个图像而不是多个图像，减少\
    \ HTTP 请求。\n- 化 HTTP 请求：移除不必要的图像、脚本和样式表。评估页面内容并消除任何没有价值的元素。\n- 实施懒加载：仅在需要时加载图像和其他资源（即当它们进入视口时）。这减少了初始页面加载期间发起的请求。\n\
    - 利用浏览器缓存：设置适当的缓存头以允许浏览器在本地存储静态资源。这减少了后续访问时对相同资源重复请求的需求。\n- 减少第三方请求：限制第三方脚本和资源的使用，因为可能会显著增加请求数量。考虑将必要的脚本托管在本地。\n\
    \n### 在您的网站上实现懒加载\n\n懒加载是一种延迟到需要时才加载图像和其他资源的技术，可以提高初始加载速度。以下是实现懒加载的方法：\n\n- 使用\
    \ `loading` 属性：对于图像，可以通过在 `<img>` 标签中添加 `loading=\"lazy\"` 属性轻松实现懒加载。\n\n```xml\n\
    ```\n\n![](img/4b72d44b44cec5434c7ba76dd6c57b33_127_0.png)\n\n## JavaScript 库：使用\
    \ Intersection Observer API 等 JavaScript 库为图像、视频和 iframe 实施懒加载。\n\n```javascript\n\
    const images = document.querySelectorAll('img[data-src]');\nconst options = {\n\
    \  root: null,\n  rootMargin: '0px',\n  threshold: 0.1\n};\n```\n\n```javascript\n\
    const observer = new IntersectionObserver((entries, observer) => {\n  entries.forEach(entry\
    \ => {\n    if (entry.isIntersecting) {\n      const img = entry.target;\n   \
    \   img.src = img.dataset.src; // 加载图像\n      observer.unobserve(img); // 停止观察图像\n\
    \    }\n  });\n}, options);\n```\n\n```javascript\nimages.forEach(image => {\n\
    \  observer.observe(image);\n});\n```\n\n- CMS 插件：如果你使用 WordPress 等内容管理系统 (CMS)，请考虑使用自动为图像和其他媒体实施懒加载的插件。\n\
    \n## 使用 WebP 和 AVIF 等现代格式的优势\n\nWebP 和 AVIF 等现代格式具有多种优势：\n\n- 1. 减小文件大小：与传统格式相比，WebP\
    \ 和 AVIF 提供了更优的压缩。\n- 2. 支持透明度：WebP 和 AVIF 支持透明（Alpha通道），类似于 PNG。\n- 3. 支持动画：WebP\
    \ 支持动态图像，类似于 GIF。\n- 4. 提高质量：这些格式在更小的文件下提供了更高的质量。\n- 5. 浏览器支持：对 WebP 和 AVIF 的支持正在增长，使其成为\
    \ Web 图形的可行方案。\n\n## 第 6 章：多媒体集成\n\n### 6.1 嵌入图像、音频和视频\n\n在页面中集成图像、音频和视频等多媒体内容可以增强用户体验。\n\
    \n### 嵌入图像\n\n使用 `<img>` 标签嵌入图像，需要 `alt` 属性。\n\n```html\n<img src=\"path/to/image.jpg\"\
    \ alt=\"图像描述\">\n```\n\n### 嵌入音频\n\n`<audio>` 元素用于嵌入音频。它可以包含多个 `<source>` 元素以提供兼容性。\n\
    \n```html\n<audio>\n  <source src=\"audio.mp3\" type=\"audio/mpeg\">\n  <source\
    \ src=\"audio.ogg\" type=\"audio/ogg\">\n  您的浏览器不支持音频元素。\n</audio>\n```\n\n###\
    \ 嵌入视频\n\n`<video>` 元素用于嵌入视频。与 `<audio>` 元素类似，它也可以包含多个 `<source>` 元素。\n\n```html\n\
    <video controls poster=\"image.jpg\">\n  <source src=\"video.mp4\" type=\"video/mp4\"\
    >\n  <source src=\"video.ogg\" type=\"video/ogg\">\n  您的浏览器不支持视频标签。\n</video>\n\
    ```\n\n**音频属性：**\n- controls：为用户显示播放控件。\n- autoplay：页面加载时自动播放音频。\n- loop：音频结束后重复循环播放。\n\
    - muted：以静音状态启动音频。\n- preload：指定音频如何加载（例如：auto, metadata, none）。\n\n**视频属性：**\n\
    - controls：为用户显示播放控件。\n- poster：指定在视频加载期间显示的图像。\n- autoplay：页面加载时自动播放视频。\n- loop：视频结束后重复循环播放。\n\
    - muted：以静音状态启动视频。\n- width 和 height：设置视频播放器的尺寸。\n\n# 最佳实践\n\n1. 提供回退方案：在 `<audio>`\
    \ 和 `<video>` 标签内始终为不支持这些元素的浏览器提供退内容。\n2. 使用多源：为音频和视频文件提供多种格式，以确保跨浏览器兼容性。\n3.\
    \ 优化媒体文件：压缩并优化音频视频文件，以缩短加载时间并提高性能。\n4. 无障碍考量：通过在适用情况下提供字幕和文本，确保多媒体内容无障碍可用。\n\n"
