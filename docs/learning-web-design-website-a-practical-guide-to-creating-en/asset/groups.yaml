    employ fluid grids that use relative units (percentages) to define layout elements.
    This allows the layout to adjust proportionally to the screen size.


    +   - **Media Queries**: CSS media queries enable designers to apply different
    styles based on the characteristics of the device, such as screen width, height,
    and resolution. This allows for tailored layouts and styles that enhance usability
    on various devices.


    +   - **Flexible Images**: Images in responsive design are set to scale within
    their containing elements. Techniques such as using CSS properties like max-width:
    100% ensure that images resize appropriately without losing quality or distorting
    the layout.


