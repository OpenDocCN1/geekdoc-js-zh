    # 3. Input Validation'
  - '[PAGE 43]


    Input validation is a critical process that ensures the data submitted through
    forms is accurate, complete, and secure. It helps prevent errors and protects
    against malicious inputs. Validation can occur at both the client-side (in the
    browser) and the server-side (on the server).


    # Client-Side Validation


    Client-side validation provides immediate feedback to users before the form is
    submitted. This can be achieved using HTML attributes and JavaScript. Common HTML
    attributes for validation include:


    +   - required: Ensures that the field must be filled out before submission.


    ```

    <input type="text" id="email" name="email" required>

    pattern: Specifies a regular expression that the input must match.

    ```


    ```

    <input type="text" id="username" name="username" pattern="[A-Za-z0-9]{5,12}">

    ```


    +   - min and max: Set the minimum and maximum values for numeric inputs.


    ```

    <input type="number" id="age" name="age" min="1" max="120">

    type: Using appropriate input types (like email, url, tel) automatically provides
    basic validation.

    ```


    ```

    <input type="email" id="email" name="email" required>",

    ```


    # Server-Side Validation


    While client-side validation enhances user experience, it is not foolproof. Server-side
    validation is essential to ensure that all data received is valid and safe. This
    can involve:


    +   - Checking for required fields.'
  - '[PAGE 44]


    +   - Validating data formats (e.g., email addresses, phone numbers).


    +   - Sanitizing inputs to prevent SQL injection and other attacks.


