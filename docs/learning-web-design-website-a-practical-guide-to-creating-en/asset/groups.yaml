    \n# 1. CSS Flexbox\n\nCSS Flexbox（全弹性盒子布局）是一种一维布局模型，允许在行或列中排列项目。它提供了一种灵活的方式在容器内的项目之间分配空间，是响应式设计的理想选择。\n\
    \n# Flexbox 的核心特性\n\n- Flex 容器（Flex Container）：要创建 flexbox 布局，需要通过将 `display`\
    \ 属性设置为 `flex` 或 `inline-flex` 来定义 flex 容器。\n\n```css\n.flex-container {\n  display:\
    \ flex;\n}\n```\n\n- **Flex 项目（Flex Items）**：容器的直接子元素成为 flex 项目，可以使用各种属性进行排列和对齐。\n\
    \n- 主轴和交叉轴（Main and Cross Axes）：Flexbox 沿着两个轴进行操作：\n  - 主轴（Main Axis）：flex 项目布局的主要方向（默认为水平）。\n\
    \  - 交叉轴（Cross Axis）：垂直于主轴的方向（默认为垂直）。\n\n- Flex 属性（Flex Properties）：Flexbox 提供了几个属性来控制布局：\n\
    \  - flex-direction：定义主轴的方向（例如：row、column）。\n  - justify-content：沿主轴对齐项目（例如：flex-start、center、space-between）。\n\
    \  - align-items：沿交叉轴对齐项目（例如：stretch、flex-start、center）。\n  - flex-wrap：控制项目是否应该换行到多行。\n\
    \n# Flexbox 布局示例\n\n```html\n<div class=\"flex-container\">\n  <div>Item 1</div>\n\
    \  <div>Item 2</div>\n  <div>Item 3</div>\n</div>\n```\n\n```css\n.flex-container\
    \ {\n  display: flex;\n  justify-content: space-around; /* 均匀分配空间 */\n  align-items:\
    \ center; /* 垂直居中项目 */\n}\n```\n\n# 2. CSS Grid\n\nCSS Grid 是一种二维布局系统，允许开发者通过定义行和列来创建复杂的布局。与\
    \ Flexbox 相比，它对对两个维度都提供了更细致的控制。\n\n# Grid 的核心特性\n\n- 网格容器（Grid Container）：要创建网格布局，将元素的\
    \ `display` 属性设置为 `grid` 或 `inline-grid`。\n\n```css\n.grid-container {\n  display:\
    \ grid;\n}\n```\n\n- 网格项目（Grid Items）：网格容器的直接子元素成为网格项目，可以放置在特定的行和列中。\n- 网格模板（Grid\
    \ Template）：可以使用 `grid-template-rows` 和 `grid-template-columns` 定义网格的结构。\n- 网格区域（Grid\
    \ Areas）：可以使用 `grid-area` 属性将网格项目分配给特定区域。\n\n# Grid 布局示例\n\n```html\n<div class=\"\
    grid-container\">\n  <div class=\"item1\">Item 1</div>\n  <div class=\"item2\"\
    >Item 2</div>\n  <div class=\"item3\">Item 3</div>\n</div>\n```\n\n```css\n.grid-container\
    \ {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr); /* 创建三个等宽列 */\n\
    \  grid-gap: 10px; /* 网格项目之间的间距 */\n}\n.item1 {\n  grid-column: 1 / 3; /* 跨越第1列到第3列\
    \ */\n}\n```\n\n# 3. Flexbox 和 Grid 的区别\n\n- 维度：Flexbox 是一种一维布局系统（行或列），而 Grid\
    \ 是一种二维布局系统（行和列都是）。\n- 使用场景：Flexbox 最适合需要在在一个方向上进行对齐的小型组件和布局。Grid 适用于需要同时控制两个维度的复杂布局。\n\
    - 对齐：Flexbox 提供了沿单个轴对齐项目的属性，而 Grid 则对两个维度上的放置和对齐提供了更全面的控制。\n\n# 4. 使用 Flexbox\
    \ 和 Grid 的最佳实践\n\n- 选择正确的工具：对于简单的布局和组件使用 Flexbox，对于需要对行和列进行精确控制的复杂页面布局使用 Grid。\n\
    - 结合使用 Flexbox 和 Grid：你可以在同一个布局中结合使用 Flexbox 和 Grid。例如，使用 Grid 进行整体页面布局，使用 Flexbox\
    \ 网格单元内的项目。\n- 响应式设计：Flexbox 和 Grid 都是创建响应设计的优秀工具。使用媒体查询根据屏幕尺寸调整布局属性。\n- 跨设备测试：始终在各种设备上测试你的布局。\n\
    \n# 3.4 结合 Flexbox 和 Grid\n\n你可以在同一个布局中结合使用 Flexbox 和 Grid。例如，使用 Grid 进行整体页面布局，使用\
    \ Flexbox 网格单元内的项目。\n\n### 结合使用的示例：\n\n```html\n<div class=\"grid-container\"\
    >\n  <header class=\"header\">Header</header>\n  <nav class=\"nav\">Navigation</nav>\n\
    \  <main class=\"main\">\n    <div>Item 1</div>\n    <div>Item 2</div>\n    <div>Item\
