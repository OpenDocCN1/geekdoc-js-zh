    querySelectorAll(): Selects all elements that match a specified CSS selector,
    returning a static NodeList.


    ```

    javascript

    const allItems = document.querySelectorAll(''.item'');

    ```


    # 3. Manipulating DOM Elements


    Once you have accessed an element, you can manipulate it using various properties
    and methods:


    +   - Changing Content: Use textContent or innerHTML to change the content of
    an element.


    ```

    javascript

    header.textContent = "Welcome to My Website!";

    ```


    Creating New Elements: Use document.createElement() to create new elements.


    ```

    javascript

    const newParagraph = document.createElement(''p'');

    newParagraph.textContent = "This is a new paragraph.";

    ```


    Appending Elements: Use append() to add a new element to a parent node.


    ```

    javascript

    document.body.appendChild(newParagraph);

    ```


    Removing Elements: Use removeChild() to remove an element from the DOM.


    ```

    javascript

    const parent = document.getElementById(''parent'');

    ```'
