    \  - 支持透明。\n- 缺点：\n  - 调色板有限可能导致复杂图像质量较低。\n  - 与其他格式相比，动画的文件大小较大。\n\n### 1.4 SVG\
    \ (可缩矢量图形)\n\n- 特性：\n  - 一种矢量格式，使用 XML 描述图像，允许在不损失质量的情况下无限缩放。\n- 适用于 Logo、图标和插图。\n\
    - 用途：最适合需要在不同分辨率和尺寸之间缩放的图形。\n- 优点：\n  - 与分辨率无关，确保在任何尺寸下都保持清晰。\n  - 简单图形的文件较小。\n\
    - 缺点：\n  - 不适合复杂图像或照片。\n  - 渲染比位图图像需要更多的处理能力。\n\n### 1.5 WebP\n\n- 特性：\n  - 由\
    \ Google 开发，WebP 支持有损和无损压缩，以及透明度。\n  - 比 JPEG 和 PNG 提供更好的压缩率，从而获得更小的文件。\n- 用途：适用于性能和质量优先优先的\
    \ Web 图片。\n- 优点：\n  - 相同质量下文件更小。\n  - 支持透明和动画。\n- 缺点：\n  - 并非所有浏览器都支持（尽管支持率正在增长）。\n\
    \  - 对于旧浏览器可能需要回退方案。\n\n## 2. 图像优化\n\n"
