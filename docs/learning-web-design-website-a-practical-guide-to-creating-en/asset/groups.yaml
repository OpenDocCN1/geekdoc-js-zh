    \ providing text alternatives for non-text content.\n- Operable: Make all functionality\
    \ available from a keyboard. Give users enough time to read and use content.\n\
    - Understandable: Make text readable and predictable. Help users avoid and correct\
    \ mistakes.\n- Robust: Maximize compatibility with current and future user agents,\
    \ including assistive technologies.\n\n# Implement Accessible Design Practices\n\
    \nSome key accessible design practices include:\n\n- Ensure sufficient color contrast\
    \ between text and background for users with low vision or color blindness.\n\
    - Use clear, descriptive link text that makes sense out of context. Avoid using\
    \ \"click here\".\n- Provide captions and transcripts for audio and video content\
    \ for users who are deaf or hard of hearing.\n- Use clear, hierarchical headings\
    \ to structure content and make it easier to navigate with a screen reader.\n\
    - Design forms with clear labels, instructions, and error messages that are accessible\
    \ to screen readers.\n- Ensure all functionality is available via keyboard alone\
    \ for users who cannot use a mouse.\n- Provide multiple ways to locate content,\
    \ such as a search function and site map.\n\n# Test with Assistive Technologies\n\
    \nRegularly test your website or application using screen readers, magnifier speech\
    \ recognition software, and other assistive technologies to identify and fix accessibility\
    \ issues. Recruit users with disabilities to provide feedback on the accessibility\
    \ and usability of your designs.\n\n# Prioritize Accessibility Early in the Process\n\
    \nIncorporate accessibility considerations from the very beginning of a project,\
    \ rather than trying to \"bolt it on\" at the end. Educate your entire team on\
    \ accessibility best practices and make it a priority throughout design and development.\n\
    \n# 13.4 Testing Websites for Accessibility Compliance\n\nTesting websites for\
    \ accessibility compliance is essential to ensure that all users, including those\
    \ with disabilities, can effectively navigate and interact with web content.\n\
    \n# 1. Importance of Accessibility Testing\n\nAccessibility testing evaluates\
    \ how easily users with disabilities can use a website. It is a subset of usability\
    \ testing that ensures all users can understand, navigate, and interact with web\
    \ content. Key reasons for conducting accessibility testing include:\n\n- **Legal\
    \ Compliance**: Many jurisdictions require websites to comply with accessibility\
    \ standards, such as the Web Content Accessibility Guidelines (WCAG). Non-compliance\
    \ can lead to legal repercussions.\n\n- **Enhanced User Experience**: Improving\
    \ accessibility benefits all users, not just those with disabilities. A more accessible\
    \ website often leads to better usability and engagement.\n\n- **Broader Audience\
    \ Reach**: By making websites accessible, organizations can reach a larger audience,\
    \ including estimated 61 million Americans with disabilities.\n\n# Key Areas to\
    \ Test for Accessibility\n\nWhen testing for accessibility, focus on the following\
    \ areas:\n\n- **Keyboard Navigation**: Ensure that all interactive elements can\
    \ be accessed and operated using a keyboard. This is crucial for users who cannot\
    \ use a mouse.\n\n- **Screen Reader Compatibility**: Test how well the website\
    \ works with screen readers. This includes checking that all images have alt text,\
    \ form labels are correctly associated, and content is structured logically.\n\
    \n- **Color Contrast**: Verify that text has sufficient contrast against its background\
    \ to be readable by users with visual impairments, including color blindness.\n\
    - **Form Accessibility**: Ensure that forms are accessible by providing clear\
    \ labels, instructions, and error messages. Test that all form elements can be\
    \ navigated and completed using a keyboard.\n"
  mdcn: "\n\n使用描述性标签：每个表单字段都应该有一个与其关联的清晰标签。在 HTML 中使用 `<label>` 元素，确保 `for` 属性与对应输入字段的\
    \ `id` 匹配。这种关联有助于屏幕阅读器宣告每个字段的用途。\n\n```xml\n<label for=\"email\">Email:</label>\n\
    <input type=\"email\" id=\"email\" name=\"email\" required>\n```\n\n避免使用占位符作为标签：占位符文本不应替代标签，因为它们在用户开始输入时会消失。务必提供显式标签以确保清晰度。\n\
    \n分组相关字段：使用 `<fieldset>` 和 `<legend>` 元素对相关的表单控件进行分组。这有助于用户理解表单结构，特别是在处理复杂表单时。\n\
    \n```xml\n<fieldset>\n  <legend>Contact Information</legend>\n  <label for=\"\
    phone\">Phone:</label>\n  <input type=\"tel\" id=\"phone\" name=\"phone\">\n</fieldset>\n\
    ```\n\n确保键盘可访问：用户应该能够仅通过键盘导航表单。确保 Tab 顺序是逻辑性的，并且在用键盘导航时焦点样式是可见的。\n\n提供清晰指令：在表单开始以及需要的特定字段附近包含简洁的指令。使用通俗的语言来增强理解。\n\
    \n错误处理：当用户提交表单时，明确指示错误。在相关字段附近提供错误信息，并确保辅助技术能够检测到这些信息。\n\n```xml\n<span class=\"\
    error\" id=\"email-error\">Please enter a valid email address.</span>\n```\n\n\
    **使用适当的输入类型**：为每个字段选择正确的输入类型（例如 email、tel、checkbox、radio）。这不仅改进了可用性，还增强了屏幕阅读器的可访问性。\n\
    \n**保持足够的色彩对比度**：确保文本和背景颜色之间有足够的对比度，以帮助视觉障碍用户。使用工具检查相对于可访问性指南的对比率。\n\n**使用辅助技术进行测试**：定期使用屏幕阅读器和其他辅助技术测试表单，以识别并解决可访问性问题。这种迭代过程对于完善表单的可访问性至关重要。\n\
    \n# 3. 可访问导航的最佳实践\n\n1. **逻辑结构**：逻辑化地组织导航菜单，确保用户能够轻松理解如何导航网站。使用清晰的标题和子标题来引导用户。\n\
    \n2. **键盘导航**：确保所有导航元素均可通过键盘访问。用户应该能够使用 Tab 键遍历菜单。\n\n3. **使用 ARIA 角色和属性**：在必要处实现\
    \ ARIA（可访问富互联网应用程序）角色和属性，以增强动态内容和复杂导航结构的可访问性。\n\n4. **提供清晰的焦点指示**：确保所有交互元素（如链接和按钮）的焦点指示均可见，以帮助用户知道自己在导航中的位置。\n\
    \n5. **响应式导航**：设计适应不同屏幕尺寸的导航。使用移动优先的导航模式（如汉堡菜单），同时确保它们保持良好的可访问性。\n\n6. **跳过链接**：实现“跳过内容”链接，允许用户跳过重复的导航链接并直接跳转到主内容。\n\
    \n# 13.3 针对残障人士进行设计\n\n以下是为残障人士设计可访问且包容性网站和应用程序的要点：\n\n理解不同类型的残障\n\n在进行可访问性设计时，考虑以下类型的残障：\n\
    \n- 视觉障碍（盲明、低视、色盲）\n- 听力障碍（聋、听力受损）\n- 运动/物理障碍（无法使用鼠标、反应速度慢、缺乏精细动作控制）\n- 认知/神经系统障碍（学习障碍、自闭症、ADHD）\n\
    - 语言障碍\n\n# 遵循Web内容可访问性指南 (WCAG)\n\nWeb内容可访问性指南 (WCAG) 为提高Web内容的可访问性提供了一个全面的框架。关键\
    \ WCAG 原则包括：\n\n- 可感知性：确保信息以用户可以感知的方式呈现，例如为非文本内容提供文本替代。\n- 可操作性：使所有功能通过键盘可用。给用户足够的时间阅读和使用内容。\n\
    - 可理解性：使文本具有可读性和预测性。帮助用户避免并纠正错误。\n- 健壮性：最大化与当前及未来代理（包括辅助技术）的兼容性。\n\n# 实现可访问设计实践\n\
    \n一些关键的可访问设计实践包括：\n\n- 确保文本和背景之间有足够的对比度，以服务低视或色盲用户。\n- 使用清晰、描述性的链接文本，使其脱离上下文也有意义。避免使用“点击这里”。\n\
    - 为聋或听力受损的用户提供音频和视频内容的字幕和转录文本。\n- 使用清晰的分级标题来组织内容，使其更容易使用屏幕阅读器进行导航。\n- 设计具有清晰标签、指令和错误信息的表单，并确保屏幕阅读器可访问。\n\
    - 确保无法使用鼠标的用户仅通过键盘即可使用所有功能。\n- 提供定位内容的多种方法，例如搜索功能和网站地图。\n\n# 使用辅助技术进行测试\n\n定期使用屏幕阅读器、放大镜、语音识别软件和其他辅助技术测试您的网站或应用程序，以识别并修复可访问性问题。招募残障用户参与，对设计的可访问性和可用性提供反馈。\n\
    \n# 在流程早期优先考虑可访问性\n\n从项目开始就将可访问性考虑纳入其中，而不是在结束时尝试“补救”。教育整个团队了解可访问性最佳实践，并在整个设计和开发过程中将其作为首要任务。\n\
    \n# 13.4 网站可访问性合规测试\n\n对网站进行可访问性合规测试对于确保所有用户（包括残障人士在内）都能有效导航并交互Web内容至关重要。\n\n\
    # 1. 可访问性测试的重要性\n\n可访问性测试评估了残障人士使用网站的便利程度。它是可用性测试的一个子集，确保所有用户都能理解、导航并与Web内容交互。进行可访问性测试的关键原因包括：\n\
    \n- **法律合规**：许多司法管辖区要求网站符合可访问标准，例如Web内容可访问性指南 (WCAG)。不合规可能导致法律后果。\n\n- **增强用户体验**：提高可访问性有利于所有用户，而不仅仅是残障人士。更具访问性的网站通常意味着更好的可用性和参与度。\n\
    \n- **更广泛的受众范围**：通过提高网站的访问性，机构可以触及更广泛的受众，包括估计的6100万美国人。\n\n# 可访问性测试的关键领域\n\n在进行可访问性测试时，关注以下领域：\n\
    \n- **键盘导航**：确保所有交互元素都可以通过键盘访问和操作。对于无法使用鼠标的用户至关重要。\n\n- **屏幕阅读器兼容性**：测试网站与屏幕阅读器的配合效果。这包括检查所有图像是否有\
    \ alt 文本、表单标签是否正确关联以及内容结构是否符合逻辑。\n\n- **色彩对比度**：验证文本与其背景之间有足够的对比度，以便视觉障碍用户（包括色盲）能够阅读。\n\
    \n- **表单可访问性**：通过提供清晰的标签、指令和错误信息来确保表单可访问。测试所有表单元素是否都能通过键盘导航并完成。\n\n"
