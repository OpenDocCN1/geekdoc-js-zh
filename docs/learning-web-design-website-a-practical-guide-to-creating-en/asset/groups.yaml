    \ Support Transparency: WebP and AVIF support transparency (alpha channel), similar\
    \ to PNG.\n- 3. Animation Support: WebP supports animated images, similar to GIFs.\n\
    - 4. Improved Quality: These formats provide higher quality at lower file sizes.\n\
    - 5. Browser Support: Support for WebP and AVIF is growing, making them a viable\
