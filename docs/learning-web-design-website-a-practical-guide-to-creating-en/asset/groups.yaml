    - AJAX 和 Fetch API：JavaScript 可以使用 AJAX（异步 JavaScript 和 XML）或 Fetch API 向服务器发送异步请求。这允许开发者在不刷新页的情况下从服务器检索数据，创建更流畅的用户体验。\n\
    - 客户端验证：JavaScript 可以在表单发送到服务器之前验证用户输入，提供即时反馈并提高用户体验。\n\n## 3. JavaScript 的关键特性\n\
    \nJavaScript 以其灵活性和赋予开发者创建健壮应用的特性闻名：\n\n- 解释型语言：JavaScript 是一种解释型语言。\n- 动态类型：JavaScript\
