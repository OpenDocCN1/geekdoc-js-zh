    # 3. Key Features of JavaScript


    JavaScript is known for its flexibility and features that empower developers to
    create robust applications:


    +   - Interpreted Language: JavaScript is an interpreted language


    +   - Dynamic Typing: JavaScript is dynamically typed, which means variables can
    hold values of any data type and can change types during execution. This flexibility
    simplifies coding but can lead to runtime errors if not managed carefully.


    +   - Object-Oriented: JavaScript supports object-oriented programming (OOP) principles,
    allowing developers to create objects, encapsulate data, and use inheritance.


    +   - First-Class Functions: Functions in JavaScript are first-class citizens,
    meaning they can be assigned to variables, passed as arguments, and returned from
    other functions. This enables powerful programming paradigms such as functional
    programming.


    +   - Prototypal Inheritance: JavaScript uses prototypal inheritance, allowing
    objects to inherit properties and methods from other objects. This differs from
    classical inheritance found in languages like Java or C++.


