    \ {\n  $.ajax({\n    url: 'data.php',\n    method: 'GET',\n    dataType: 'json',\n\
    \    success: function(data) {\n      // Clear the existing content\n      $('#content').empty();\n\
    \n      // Loop through the data and create HTML elements\n      $.each(data,\
