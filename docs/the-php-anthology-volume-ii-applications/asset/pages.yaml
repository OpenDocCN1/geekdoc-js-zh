  md: "# The Factory Method\n\nwhether the letter is a vowel. The factory method then\
    \ creates an instance of either Vowel or Consonant, and returns it to the caller.\n\
    \nFile: 1.php (excerpt)\n\n```\n/**\n * Factory for creating Vowel and Consonant\
    \ objects\n */\nclass CharFactory {\n    /**\n     * The factory method\n    \
    \ */\n    function getChar($byte) {\n        if (preg_match('/[a-zA-Z]/', $byte))\
    \ {\n            $vowels = array('a', 'e', 'i', 'o', 'u');\n            if (in_array(strtolower($byte),\
    \ $vowels)) {\n                $schar = &new Vowel($byte);\n            } else\
    \ {\n                $schar = &new Consonant($byte);\n            }\n        return\
    \ $schar;\n    }\n}\n```\n\nFinally, we define the Vowel and Consonant classes.\
    \ Now, it's time to drive our text statistics package on the home page of sitepoint.com.\n\
    \nFile: 1.php (excerpt)\n\n```\n/**\n * Class representing a Vowel\n */\nclass\
