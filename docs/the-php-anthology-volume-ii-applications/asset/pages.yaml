  md: '# How do I set up automated tests of my code?


    That theory probably doesn''t apply to the majority of PHP projects, where you
    knock up a simple application in a matter of minutes. However, unless you''re
    planning to delete the source file at the end of the day, it''s likely that the
    code will gradually take a life of its own, becoming a critical component of your
    site and a source of panic when you realize you didn''t test it enough.


    What Unit Testing do for you is automate the code testing process. Near the start
    of any new piece of code, you write a script that is designed to test it on what
    you want to do. With the tests in place, you''re able to re-execute them as many
    times as you like; they''ll give you a very good idea of whether the code is broken,
    and, if there is a problem, a clear indication of where it lies.


    As your projects grow to numerous integrated components that rely on one another
    to work properly, being able to test each piece becomes essential to the success
    of the project. All you have to do is invest the energy in writing the scripts
    up-front...


    There are two approaches to unit testing: **black box testing** (which is really
    what I''m talking about here) and **white box testing**.


    Black box testing outside the code that''s being tested (the code is referred
    to as a black box), passing data to the code and examining what it gets back.
    This approach is particularly useful for classes that have a clear API. It means
    you don''t have to mess with the code you''re testing.


    White box testing takes the view that everything, and perhaps should, be tested,
    so there''s no hiding behind APIs for those nasty bugs! It requires implanting
    the tests directly into the code being tested. In some cases it''s-a class method
    may return the correct value but some operation performed "behind the scenes"
    could have gone horribly wrong. You may already have used white box testing without
    realizing it, for instance, when using print statements inside a class to find
    out what it''s testing.


    ![](img/c8cd8f0e37a1c130cdbf5206f1922f1f_317_0.png)


    # Gray Box Testing


    The weaker encapsulation of PHP 4 (i.e. its lack of support for private/protected
    class members) provides one potential advantage here. It makes possible for us
    to use a hybrid of black box and white box testing (gray box?) by accessing member
    variables directly for test purposes, which can help pinpoint purists more accurately.
    You probably won''t impress any object oriented purists, though...'
