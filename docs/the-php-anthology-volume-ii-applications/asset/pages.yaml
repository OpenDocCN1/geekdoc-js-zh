    \    }\n}\n\nfor ($i = 0; $i < 50; $i++) {\n    if (!$color = each($colors)) {\n\
    \        reset($colors);\n        $color = each($colors);\n    }\n    if (isBlueFast($color['value']))\
    \ {\n        // Do something here\n    }\n}\n```\n\n1. .php (excerpt)\n\n272"
