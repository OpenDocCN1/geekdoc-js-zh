  md: '# Chapter 3: Alternative Content Types


    # HAWHAW


    Now that we understand the basics, it''s time to meet HAHAW[22] (the HTML and
    WML hybrid adapted Webserver), a PHP class library that makes serving WML pages
    easy. Using HAHAW to construct WML pages is much like using the DOM extension
    to create XML, as we saw in Chapter 2. In the HAHAW document model, the parent
    of all elements is the HA_deck class, to which other elements are added, as described
    in the online documentation[23].


    HAHAW doesn''t make use of multiple cards, but instead places all elements within
    a single card. This is to avoid some shortcoming, but helps HAHAW provide support
    for order wireless formats, including HDML, as well as other formats such as MML,
    which is used by some Japanese devices.


    The code for this chapter includes the HAHAW library.


    At the start of this chapter, we looked at rendering PDF files from the articles
    table. Here''s how we''d render WML from the same data:


    ![](img/c8cd8f0e37a1c130cdbf5206f1922f1f_226_0.png)


