  md: '# 6 Development Technique


    In this chapter, we take a step out away from solving particular problems, to
    look at general techniques that can make you and me better developers. “Better”
    may mean many things: more productive, more relaxed, able to take on more complex
    projects, able, but by trying to deliver reliable and maintainable code... or
    able to sleep at night.


    Some of what you read may be obvious to you. Other parts may seem usual, and others,
    completely foreign. In the end, what suits you is a matter of personal taste,
    but by trying some of the suggestions here you may find that a few things grow
    on you and become part of your development habits.


    # How do I optimize my code?


    > “Premature optimization is the root of all evil.”—Donald E. Knuth


    When developing applications, the first stage should be to design your top priority;
    we should sacrifice performance in favor of a well designed application architecture,
    and allow our code to be flexible and maintainable. When it comes to putting your
    application online, though, performance becomes an issue.


    In general, assuming you haven''t made any critical mistakes in your code, performance
    is really a hardware issue (i.e. you have the option to throw memory,",'
