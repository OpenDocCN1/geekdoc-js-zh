    \ with XPath\n\nNow that you have a basic grasp of how XPath can be used in PHP,\
    \ it's time to do something interesting with it. Let's take the articles.xml document\
    \ we already used with XPath, and build a database-like interface that displays\
    \ a list of articles in brief and a single article in detail, depending on the\
    \ link clicks. Before we can get started, we need a couple of classes that represent\
    \ the articles list, and an individual article, respectively. These classes fetch\
    \ data from the articles.xml document.\n\nFirst, let's look at the class representing\
    \ a list of articles. The constructor performs an XPath query to fetch all the\
    \ spt:article elements as well as their children:\n\n```\n//spt:article/descendant-or-self::\n\
    ```\n\nThis allows us to use the spt:article to identify each new \"row\" in articles.xml,\
    \ and at the same time provides the child nodes, giving us access to the content\
    \ within them. With this content, we can build a data structure that we can use\
    \ immediately. Each \"row\" is placed in a new instance of the Article class (which\
    \ I'll be looking at in detail in Chapter 3), then the object is placed inside\
    \ the Articles member variable of the ArticlesXML class. If you compare this with\
    \ the work we did earlier to parse the RSS feed from DOM, it becomes clear how\
    \ much easier XPath makes the extraction of data from an article document.\n\n\
    File ExampleApps/ArticlesXML.php (in SPLIB)\n\n```\n<?php\n/**\n * Articles XML\
    \ class\n * Fetches data from articles.xml\n * @access public\n * @package SPLIB\n\
    \ */\nclass ArticlesXML {\n/**\n * An array of Article objects\n * @access private\n\
    \ * @var array\n */\nvar $articles;\n```\n\n128"
