  md: "# Getting Started\n\nI hope that introduction hasn't made you paranoid about\
    \ using sessions that you'll never touch them. In general, sessions offer a mechanism\
    \ that is both simple to use and powerful—it's an essential tool for building\
    \ online applications.\n\nThe first development trick you need to know is that\
    \ you should access session variables using their predefined global variable $_SESSION,\
    \ not the functions session_register and session_unregister. These functions fail\
    \ to work correctly when PHP's register_globals setting has been disabled, which\
    \ is the way you would be programming with PHP (Appendix A for details).\n\nStart\
    \ off slowly, here's a simple example of how sessions can be used:\n\n```\n<?php\n\
    session_start();\n\n// If session variable doesn't exist, register it\nif (isset($_SESSION['test']))\
    \ {\n    $_SESSION['test'] = 'Hello World!';\n    echo 'Session\\'test\\'<br />'\
    \ . 'Please refresh page';\n} else {\n    // It's registered so display it\n \
    \   echo $_SESSION[''test\\'] = ' ' . $_SESSION[''test'];\n}\n?>\n```\n\nThe first\
    \ order of business in a script that uses sessions is to call session_start to\
    \ load any session variables.\n\nThis script registers the session variable the\
    \ first time it is displayed. The next time (and all times thereafter, until the\
    \ session times out through inactivity), the script will display the value of\
    \ the session variable.\n\nThat's a simple example of how sessions can be used.\
    \ We'll use them to store the value of a user name and password shortly, but first,\
    \ we need to put together some classes that will collaborate to deal with both\
    \ sessions and authentication.\nDon't panic! The classes themselves may get fairly\
    \ complex, but using them from an external script will be easy."
