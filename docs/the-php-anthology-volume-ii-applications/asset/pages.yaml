  md: '# How do I parse an RSS feed with PHP and SAX?


    The XML extension[25], which implements SAX, is usually the ideal choice in cases
    in which you wish to process an unknown number of tags that have a predictable
    structure. What takes a little getting used is the way it uses callback functions
    to the elements it encounters in the XML document. If you''ve ever written any
    JavaScript, you probably already use callback functions when you specify a JavaScript
    function to handle the response to an event, as the user clicking a link. Because
    of this, callback functions are often called event handlers.


    Since this is a tricky concept to master, we''ll start with a more familiar approach.
    PHP''s xml_parse_into function lets us avoid using callback functions by placing
    the elements of an XML document into an array.


    To begin with, we load the entire document into a string (Volume I, Chapter 4
    for more details on file-related functions). Here, I''ve used the function so
    you can concentrate on the XML-related code, but be aware that it''s often a better
    idea to use fockopen so you can deal with unusual error scenarios, such as the
    site being down or the document having been moved. I provided an example of this
    in Volume I, Chapter 4.


    ```

    <?php

    // Fetch the entire document

    $rssDoc = file(''http://www.sitepoint.com/rss.php'');

    $rssDoc = implode('''', $rssDoc);

    ```


    Next, I use the xml_parse_create function to fire up the SAX parser and tell it
    to use UTF-8 encoding, which the first line of the RSS feed indicates is required.
    Other supported encodings include ISO-8859-1 (the default) and US-ASCII.


    ```

    // Start the xml parser tell it the character encoding

    $sax = xml_parser_create(''UTF-8'');

    ```


    The xml_parser_set_option function is used to instruct the parser not to convert
    every element and attribute to uppercase, which is the default behavior. Note
    that this line is included mainly for the sake of example. When we parse XML documents
    provided by third parties like this, it''s often a good idea to have all tags
    converted to upper case. If one owner writes the RSS feed in lower case, another
    in upper case, and a third with a mixture of upper and lower case, you''ll


