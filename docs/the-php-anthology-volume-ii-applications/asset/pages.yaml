  md: '# How do I render XUL with PHP?


    XML Interface Language[24] (XUL) is the innovation of the developers working on
    the Mozilla project[25]. The idea behind XUL is to make building desktop applications
    (or rich clients) as easy as working with HTML. What’s more, it allows rich clients
    to be launched from your Website. For an introduction to XUL, try SitePoint’s
    Introducing XUL: The Net’s Biggest Secret[26], which comes as a three-part series
    and provides plenty of resources to get started.


    Now, assuming you have a graph of what XUL is about, the question is: can it be
    applied to your Website in a useful manner? Given the popularity of Internet Explorer,
    requiring visitors use Mozilla, Firebird, Camino, or one of the other Gecko-based
    browsers is obviously not going to be popular. For the “back end”—the interface
    you provide for administering your site—there’s much to be gained from XUL. You
    can reasonably require your site’s administrators to use a Gecko-based browser,
    perhaps purely as a tool for administering your site. What your bandwidth and
    resources, for example, as you switch numerous times between a list of your users
    and the detailed view of an individual user selected from the list. This is exactly
    where XUL can provide significant value.


    The easiest way to launch an XUL application from your Website is to send the
    correct HTTP header, which a Gecko-based browser will recognize and respond to
    the page that it builds using the XUL application. To demonstrate, let’s put together
    a simple but effective XUL application that helps us administer users we have
    registered.


    To start, we will include the MySQL class and select a list of users from the
    table (Volume I, Chapter 9 for the structure of the table).


    ```

    <?php

    // Include MySQL class

    require_once ''Database/MySQL.php'';


    // Define the base URL for editing users - MODIFY THIS!!!

    $baseUrl =

    ```


