    In other words, we captured the output of the first echo, then sent it to the
    browser after the second echo. As this simple example suggests, output buffering
    can be a very powerful tool when it comes to building your site; it provides a
    solution for caching, as we will see in a moment, and it is an excellent way to
    hide errors from your site''s visitors (Volume 1, Chapter 10). It even provides
    a alternative to browser redirection in situations such as user authentication.


    # HTTP Headers and Output Buffering


    Output buffering can help solve the most common problem associated with the header
    function, not to mention set_cookie. Normally, if you call any of these functions
    after page output begins, you''ll get a nasty error message. With output buffering
    turned on, the only output types that can escape the buffer are HTTP headers.
    Using ob_start at the very beginning of your application''s execution, you can
    send headers at whichever point you like, without encountering the usual errors.
    You can then write out the buffered page content all at once, when you''re sure
    there are no more HTTP headers required.


