    # How do I render WML with PHP?


    Wireless Markup Language (WML) is an XML format designed to allow held devices
    to access content on the Web using Wireless Application Protocol (WAP). As the
    first generations of WAP enabled devices use LCD displays and are usually grayscale,
    developing WML based sites may not seem exciting, but the potential for people
    on the team to work together via a WML-based site makes it an interesting technology.


    The first problem to overcome when trying to develop WML based sites is finding
    a browser that displays WML. Obviously, your mobile network provider would love
    you to the testing with your own phone, but that''s a fast track to a large bill.
    Frankly, Opera (ideal version 7+) comes with WML support and is perfect for designing
    a WML-based site. Not too far behind Mozilla with a WMLbrowser[21] that''s currently
    a work in progress, but should be fairly handy in the not too distant future,
    thanks to the ease of developing XUL applications (see the next solution).


    With that problem solved, it''s time to build a WML page with a little help from
    PHP:


    ```

    <?php

    header(''Content-type: text/vnd.wap.wml'');

    echo ''<?xml version="1.0"?>\n<!DOCTYPE WML PUBLIC "-\-//WAPFORUM//DTD WML 1.1//EN">

    <xml xmlns="http://www.wap.org/DTD/wml_1.1.xml">

    <card id="index" title="WML and WAP in Action" newcontext="true">

    <big id="Menu:\</big><br>

    <a href="#news">News</a><br>

    <a href="#products">Products</a></br>

    ```


    [20] http://www.phpclasses.org/browse.html/package/457.html

    [21] http://wbrowser.mozdev.org/'
