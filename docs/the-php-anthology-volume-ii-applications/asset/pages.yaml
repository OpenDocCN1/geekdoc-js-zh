- img_proc: true
  md: '# Chapter 6: Development Technique


    latency delivered poor performance to users—and this was before people thought
    about putting their applications online!


    These days, few is a generally accepted number of tiers for distributed and Web-based
    applications. What defines the tiers themselves is open to discussion, if if we
    think about a typical PHP application, the tiers could be described as shown in
    Figure 6.3.


    # Figure 6.3. N-Tier PHP


    | Presentation Layer: Web browser |


    | Presentation Logic Layer: PHP rendering HTML |


    | Application Logic Layer: PHP e.g. Form validation |


    | Data Access Layer: PHP e.g. PEAR:DB |


    | Data Layer: MySQL |


    The names of the tiers themselves vary, as N-Tier is not a well-defined standard.
    For example, the application logic layer is sometimes referred to the business
    logic layer, while the presentation layer is often confused with the presentation
    logic layer. In general, though happens at each layer is fairly well agreed upon,
    as the diagram suggests; vendors like Sun and Microsoft will generally refer to
    a very similar tier structure, using their own technologies, of course.


    # The Principles of N-Tier


    When we talk about an N-Tier application, a few general principles are inferred;
    these principles apply to the tiers themselves.'
