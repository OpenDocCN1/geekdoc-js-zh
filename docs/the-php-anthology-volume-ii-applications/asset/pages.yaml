  md: '# Chapter 2: XML


    The point that''s important to grasp, which the documentation doesn''t make too
    clear, is that the DOM extension is a collection of classes, much like classes
    you might write yourself in PHP.


    When you look at the documentation, you''ll find the “functions” in the extension
    listed in the form DomNode->child_nodes. In this example, DomNode is a class defined
    by the extension, and child_nodes is a method of this class. The classes available
    with the DOM extension form a family; that is, they have a inheritance structure,
    as shown by the UML class diagram in Figure 2.1.


    The DomNode class is abstract; that is, you never instantiate it; rather; you''ll
    always use a class that inherits from it. The methods available in DomNode will
    also be available from those subclasses, in addition to any methods defined by
    the subclass. So, if you have a DomElement object, you can call its get_attribute
    method, as well as the has_attributes method it inherits from DomNode.


    When you first open an XML document for parsing with the DOM extension, you''ll
    always begin with a DomDocument object. This has “factory” methods, such as get_elements_by_tagname,
    which can be used to fetch instances of other classes defined by the DOM extension,
    including DomElement.


    That should give you a conceptual grasp of how the DOM extension works; the examples
    in this chapter will put it into practice.'
