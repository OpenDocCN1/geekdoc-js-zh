  md: "```\n'author' => 'string'\n\n$this->typedef['ArticleFull'] = array(\n  'title'\
    \ => 'string',\n  'author' => 'string',\n  'body' => 'string'\n);\n```\n\nWhat's\
    \ happening here is a little more difficult to explain. First, we've defined the\
    \ dispatch map, which contains a list of the SOAP method calls that can be made\
    \ to this server. For each method, we need to define the input (arguments the\
    \ method accepts) and the output (the value returned from the method). For a primitive\
    \ type (such as a string or integer value) that's used as input or output, this\
    \ can be defined by simply naming the variable type. You can see here we've specified\
    \ that the article_id argument of getArticleById must be of type int (an integer).\n\
    \nThe output types in this example are a little more tricky and really require\
    \ some understanding of WSDL to be grasped completely. Simply put, because the\
    \ results of the two methods are complex—an array of articles and a full article,\
    \ respectively—we need to use a pointer to the type definition. The definition\
    \ of the full article type, for example, is provided by this code:\n\n```\n$this->typedef['ArticleFull']\
    \ = array(\n  'title' => 'string',\n  'author' => 'string',\n  'body' => 'string'\n\
    );\n```\n\nHere, you see the name of the type, ArticleFull, and a definition of\
    \ the primitive types of which it is composed. A complex type definition can also\
    \ contain additional complex types. Careful scrutiny of the code will reveal that\
    \ we've done this to describe the array of articles returned by getArticles.\n\
    \nAll this information enables the PEAR::SOAP server to generate a WSDL document\
    \ that describes the server, allowing clients to benefit from the use of that\
    \ WSDL affords. PEAR::SOAP affords's worth examining the examples provided for\
    \ further help with setting up the dispatch map and type definitions. If you run\
    \ into trouble, the best place to get help is the PHP SOAP SOAP Mailing list[54].\n\
    \n[54] http://www.php.net/mailing-lists.php"
