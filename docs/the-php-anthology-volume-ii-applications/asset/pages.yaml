  md: '# The Origin is at the Bottom Left


    > > IMPORTANT

    The position x = 0, y = 0 is at the bottom left of the page. Make sure you remember
    that—it can be confusing, as we read from top to bottom.


    Next, we created an object and store it in a variable, $headfoot. Objects created
    by the openObject method used to create elements that will repeat throughout the
    document. By calling the openObject method, the class stops adding to the main
    document, and adds contents to the object instead. Here, we''ve created an object
    that will display the SitePoint logo at the top right of the page, as well as
    a horizontal line at the top and bottom of each page. The class will continue
    to add to the object until we call the closeObject method, at which point it returns
    to the main document.


    ```

    // Set header and footer as a recurring object

    $headfoot = $openObject(); // Create object

    $headfoot->saveState(); // Save document state

    $headfoot->addJpegFromFile(''sitepoint_logo.jpg'', 430, 813, 70, 20);

    $headfoot->setStrokeColor(0, 0.2, 0.4); // Set line color

    $headfoot->setStyle(2, ''round''); // Set line style

    $headfoot->addLine(155.28, 811.59, 228.81); // Add top line

    $headfoot->addLine(155.28, 30, 50, 28); // Add bottom line

    $headfoot->restoreState(); // Restore document state

    $headfoot->closeObject(); // Close the object

    ```


    Note that I''ve used the saveState method to allow me to make temporary changes
    to colors, fonts and so on. When I''m done, the restore method returns me to the
    original style values automatically.


    Next I will create another object which is a link which will appear on the bottom
    of every page, showing where the original HTML version can be found. Once created,
    I''ll add both objects to the document with the addObject method.


    ```

    // Set up bottom link object

    $bottomUrl = $openObject(); // Create object

    $bottomUrl->saveState(); // Save document state

    $bottomUrl->selectFont(''rospdf/fonts/Helvetica.afm''); // Select font

    $bottomUrl->addText(155.28, 24, 6, ''Found at: '' .articleUrl);

    $bottomUrl->restoreState(); // Restore document state

    $bottomUrl->closeObject(); // Close the object

    ```


