  md: "# How do I prevent Web browsers caching a page?\n\nservers) from caching pages\
    \ in the first place. The most basic approach to doing this utilizes HTML meta\
    \ tags: \n\n```\n<meta http-equiv=\"Expires\" content=\"Mon, 26 Jul 1997 05:00:00\
    \ GMT\">\\n<meta http-equiv=\"Pragma\" content=\"no-cache\" />\n```\n\nBy inserting\
    \ a date past into the Expires meta tag, we can tell the browser that the cached\
    \ copy of the page is always out of date. This means the browser should never\
    \ cache the page. The Pragma: no-cache tag is a fairly well-supported convention\
    \ that most Web browsers follow. Upon encountering this tag, you usually won't\
    \ cache the page (although there's no guarantee; this is just a convention).\n\
    \nIt sounds good, but there are two problems associated with the use of meta tags:\n\
    \n+   1. If a tag was wasnt when the page was first requested by a browser, but\
    \ appears later (for example, you modified the included header.php file, which\
    \ contains the top of every Web page), the browser will remain blissfully ignorant\
    \ and keep its cached copy of the original.\n\n+   2. Proxy servers that cache\
    \ pages, such as those to ISPs, generally will not examine the HTML documents\
    \ themselves. Instead, they rely on the Web server from which the documents come,\
    \ and the HTTP protocol. In other words, a Web browser might know that it shouldn't\
    \ cache the page, but the proxy server between the browser and Web server properly\
    \ doesn't—it will continue to deliver the same out-of-date page to the client\n\
    \nA better approach is to use the HTTP protocol, itself, with the help of PHP's\
    \ header function, to produce the equivalent of the two meta tags above:\n\n```\n\
    <?php\nheader('Expires: Mon, 26 Jul 1997 05:00:00 GMT');\nheader('Pragma: no-cache');\n\
    ?>\n```\n\nWe can go one step further, using the Cache-Control header that's supported\
    \ by HTTP 1.1 capable browsers:\n\n```\n<?php\nheader('Expires: Mon, 26 Jul 1997\
    \ 05:00:00 GMT');\nheader('Cache-Control: no-store, no-cache, must-revalidate');\n\
    header('Cache-Control: post-check=0, pre-check='0', FALSE);\nheader('Pragma: no-cache');\n\
    ?>\n```"
  merge: -1
