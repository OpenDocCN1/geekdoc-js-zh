    \ the advantage that if we ever want to switch to an alternative session handling\
    \ mechanism, such as one we've built ourselves, we simply need to modify the class,\
    \ rather than rewriting a lot of code. We can provide an interface to the $SESSION\
    \ variable with a few simple methods:\n\n```\n<?php\n/**\n * A wrapper around\
    \ PHP's session functions\n * \n * $session = new Session();\n * $session->set('message','Hello\
    \ World!');\n * echo ($session->get('message')); // Displays Hello World!\n *\
    \ \n * @package SPLIB\n * @access public\n */\nclass Session {\n/**\n * Session\
    \ constructor<br />\n * Starts the session with session_start()\n * <b>Note:</b>\
    \ that if the session has already started,\n * session_start() does nothing\n\
    \ * @access public\n */\nfunction Session() {\n    session_start();\n}\n\n/**\n\
    \ * Sets a session variable\n * @param string name of variable\n * @param mixed\
    \ value of variable\n * @return void\n * @access public\n */\nfunction set($name,\
    \ $value) {\n    $_SESSION[$name] = $value;\n}\n\n/**\n```"
