    the documentation on the phpOpenTracker Website[9].


    # How do I recognize returning visitors?


    As mentioned earlier in this chapter, IP addresses are easy to come by, and frequently
    change. As a result, they cannot be used as a reliable source of information for
    recognizing returning visitors—they may not even be for gathering stats as visitors
    progress through your site. If they''re using a dial up connection, for example,
    they may disconnect while reading downloaded content, then reconnect to surf further.


    Should you wish to be able to recognize a returning visitor, or monitor a visitor’s
    path across your site, you''ll need to make use of cookies.


    # Sessions vs. Cookies


    Although PHP sessions use cookies to identify a token to a client, the cookie
    functionality provided by PHP is best applied to other problems.


    Sessions are intended for use on a ''per visit'' basis. They store data that''s
    required only for the current visit, and the data belongs to the Web server only
    (the session files being stored locally), as we saw in Chapter 1.


    Cookies are applied to data that should persist across multiple visits to your
    site, as viewing preferences or the visitor''s name. Cookies should not be used
    to store sensitive information, as this data is stored on the client, and may
    be subject to interception if you''re not using SSL; it''s also available to anyone
    who has access to the client machine''s file system.


    Some may argue this is an overly paranoid point of view, and certainly, that use
    cookies to ensure regular visitors are ''always logged in'' would lose this feature
    without them. The problem is, that someone could gain access to my computer, in
    theory, or he or she could use the cookies I have stored to log in as, without
    requiring my user name and password.


    Using a cookie, you can store for visitors a unique identifier (assigned on their
    first visit), which you can use to identify them on subsequent visits. For example:


    > [9] http://www.phpopentracker.de/'
