    # # How do I convert HTML to PDF?


    Before we jump into rendering PDF straight from the content in our database, there''s
    a problem we have to overcome. The content we store contains HTML markup that
    we can''t simply "drop" into a PDF document. At the same time, the HTML is there
    for a good reason; it provides useful formatting for the content, positioning
    text and images correctly, adding links, and so on. We don''t want to lose this
    formatting, so we can''t just strip it out; we need to use something to lay out
    the PDF document. For the solution, we use toPEAR::XML_HTMLSax[7]. This is a SAX-like
    parser for "badly formed" XML documents, which will allow us to strip the HTML
    out of the content and at the same time take advantage of the formatting information.
    The version used here was 2.0.2.


    # # Parsing HTML with SAX?!


    HTML does not obey the rules of XML; by HTML standards, most HTML code is badly
    formed. The basic specification for tags that are not closed and attributes that
    have no values. Worse still, Web browsers allow us to get away with murder, such
    using the tagging and case sensitivity rules (e.g. <I<b>Text</i></B>). Attempt
    to parse HTML with a normal XML parser, and it will pass you back error messages
    in disgust. In other words, the native SAX extension that comes with PHP won''t
    do.


    > [7] http://pear.php.net/XML_HTMLSax

    The good news is that newer incarnations of DOM will be able to parse HTML, but
    right now that''s neither stable, nor widely available on common Web hosts.'
