  md: '```

    <?php

    // Get the contents of the XML document

    $articles = file(''articles.xml'');

    $articles = implode('''', $articles);


    // Instantiate a DOM Document from the file

    $dom = domxml_open_mem($articles);


    // Fetch new XPathContext object

    $ctx = $dom->xpath_new_context();


    // Register the SitePoint namespace

    $ctx->xpath_register_ns(''sp'', ''http://www.sitepoint.com/'');


    // Fetch the titles with an XPath statement into an XPath object

    $titles = &Cctx->xpath_eval(''/sp:title/text()'');


    // Display the data structure

    echo ''<pre>'';

    print_r($titles);

    echo ''</pre>'';

    ?>

    ```


    First, we fetch the XML document and create a new instance of DOMDocument, as
    usual. We use xpath_new_context to create a new XPathContextObject; this initializes
    the XPath functionality to perform queries from the root of the document. We then
    have to register the namespace defined by the document, using the xpath_register_ns
