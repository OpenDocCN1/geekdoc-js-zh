    # How do I parse an RSS feed with PHP and DOM?


    Now that you''ve seen how to parse an RSS feed using the SAX processor, how about
    using the DOM to perform the same task? Although you may be happy to stick with
    SAX, being able to compare the two will help you understand what represents the
    best choice for different problems. With SAX, let''s start by using PHP''s DOM
    XML extension in a procedural fashion.


    First, let''s switch off error notices so we can perform a check on the elements
    of the document later (more on in a moment).


    ```

    <php

    // Switch off error notices

    error_reporting(E_ALL ^ E_NOTICE);

    ```


    Next, we create a DOMDocument object by fetching the SitePoint RSS feed, using
    two alternative functions are available: domxml1_open_mem, which can be used to
    read an XML document stored in a PHP variable, and domxml1_new_doc, which can
    be used to create a blank XML document that you can add content to.


    ```

    // Instantiate an instance of DOM from file

    $dom = domxml1_open_file(''http://www.sitepoint.com/rss.php'');

    ```


    On the next line, we use the DOMDocument API to fetch the root element (the outermost
    tag) of the document with the document_element method. Note that document_element
    returns an instance of DOMElement.


    ```

    // Get the root RDF element

    $rdf = $dom->document_element();

    ```


    > [26] http://pear.php.net/XML_SaxFilters

    [27] http://phpxmlclasses.sourceforge.net/show_doc.php?class=class_sax_filters.html'
