  md: '# Appendix B: Hosting Provider Checklist


    SSH you a secure connection to the server to perform tasks from the Linux command
    line or transfer files with SCP (secure copy). Avoid any host who allows you to
    use telnet (a fundamentally insecure way to connect to a server over the Internet).
    For Windows users, Putty|WinSCP[2] provides a secure file transfer mechanism using
    an SSH connection. Oh, and don''t transfer files with ftp—it''s as insecure as
    internet.


    +   - Is the host reseller or do they maintain the server themselves?


    Resellers can provide significant value if you need help at a basic technical
    level (if, for example, you call yourself a newbie), but they generally have the
    same level of control over the server as you. Going “straight to the source” means
    you won''t have to deal with delays when there are system problems, as you''ll
    likely be dealing directly with who maintain the server. The down side is that
    they tend to be less “newbie tolerant” so you may get answers—but not you understand


    +   - To what degree does the host “overload” the server?


    Many Web hosting companies create far more accounts on a server than the maximum
    for which the system is specified. The best metric command (to which you require
    access); this will tell you the server load averages over 1, 5 and 15 minutes.
    Ideally, the server should never have load averages over 1. Obviously, the problem
    isn''t as simple as this, but once you see your server hit averages in excess
    of 5, you''ll begin to experience significant delays in your PHP-based applications.


    +   - What is the hosting provider’s policy on running scripts and programs from
    the command line?


    MySQLDump is a very handy tool for backing up your database, but it’s no good
    if you don''t run it. Some hosts automatically kill any command line application
    that executes for longer than a given time.


    +   - Does the host provide access to cron, the Unix utility that allows you to
    schedule batch jobs?


    If so, make sure the host allows line scripts to be executed. Some hosts have
    taken implementing cron so that it executes scripts via a Web


    > [1] http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html


    > [2] http://winscp.sourceforge.net/eng/'
