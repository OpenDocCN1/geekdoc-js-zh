  md: 'Authentication headers are additional headers used by a server to instruct
    the browser that it must send a valid user name and password in order to view
    the page.


    In response to a normal request for a page secured with basic HTTP authentication,
    a server might respond with headers like these:


    ```

    HTTP/1.1 401 Authorization Required

    Date: 25 Feb 2003 15:41:54 GMT

    Server: Apache/1.3.27 (Unix) PHP/4.3.1

    X-Powered-By: PHP/4.3.1

    WWW-Authenticate: Basic realm="PHP Secured"

    Connection: close

    Content-Type: text/html

    ```


    No further information is sent, but notice the status code HTTP/1.1 401 Authorization
    Required and the WWW-Authenticate header. Together, these indicate that the page
    is protected by HTTP authentication, and is not available to an unauthorized user.
    A visitor''s browser goes about dealing with this information may vary, but usually,
    the user will see a small pop-up dialog box like that shown in Figure 1.1.


    # Figure 1.1. Me In!


    ![](img/c8cd8f0e37a1c130cdbf5206f1922f1f_23_0.png)


    The dialog prompt sites visitors to enter their user names and passwords. If visitors
    using Internet Explorer enter these login details incorrectly three times, the
    browser will display the "Unauthorized" message instead of displaying the prompt
    again. In other browsers, such as Opera, users may be able to continue indefinitely.'
  merge: -1
  pgno: 23
- img_proc: true
  md: "# Chapter 1: Access Control\n\nNote that the realm value specified in the WWW-Authenticate\
    \ header is displayed in the dialog box. A realm is a \"security space\" or \"\
    zone\" within which a particular set of login details are valid. Upon successful\
    \ authentication, the browser will remember the correct user name and password\
    \ combination and automatically re-send it in any future request to realm. When\
    \ the user navigates to another realm, the browser displays a prompt once again.\n\
    \nIn any case, the user must provide a user name and password to get the page.\
    \ The browser then sends these credentials with a second page request like this:\n\
    \n```\nGET /admin/ HTTP/1.1\nHost: www.sitepoint.com\nAuthorization: Basic jTSABT766yNOHgJui\n\
    ```\n\nThe Authorization header contains the user name and password encoded with\
    \ base64 encoding, which is worth noting, is not secure—but at least makes it\
    \ unreadable for humans.\n\nThe server will check to ensure that the credentials\
    \ are valid. If they are not, the server will send the Authorization Required\
    \ response, as shown previously. If the credentials are valid, the server will\
    \ send the requested page as normal.\n\n# Not by the Hairs of my Chin...\n\nNow\
    \ that you have a rough idea of how HTTP authentication works, how might you secure\
    \ a PHP page with it? When PHP receives an Authorization header and stores the\
    \ values in the variables in $_SERVER['PHP_AUTH_USER'] and $_SERVER['PHP_AUTH_PW']\
    \ for the user name and password, respectively. Here's how you could secure a\
    \ simple page:\n\n```\n<?php\n// An array of allowed users and their passwords\n\
    $users = array(\n    'harryf' => 'secret',\n    'littlepeg' => 'chinny'\n);\n\n\
    // If there's no Authentication header, exit\nif (!isset($_SERVER['PHP_AUTH_USER']))\
    \ {\n    header('HTTP/1.1 401 Unauthorized');\n    header('WWW-Authenticate: Basic\
    \ realm=\"PHP Secured\"');\n```"
