  md: '# How do I perform XPath queries with PHP?


    XPath is a syntax for accessing nodes within an XML document that''s not unlike
    most file naming systems. From an XPath expression, PHP''s DOM extension can perform
    an XPath query, a powerful mechanism for accessing elements within an XML document.
    In this solution, I''ll assume the have some knowledge of XPath; if you don''t,
    see the section “Further Reading” at the end of this chapter for more information.


    Let’s say you have this XML document:


    ```

