    but Web hosts typically fail to provide customers with their own PEAR installation,
    it''s worth knowing how to go about this from scratch. The process can differ
    slightly between Unix and Windows based systems.


    Step one is to make sure you can run PHP scripts via the command line. It is always
    possible if you type the full path to the PHP binary. For a Unix based system,
    you''d use the following:


