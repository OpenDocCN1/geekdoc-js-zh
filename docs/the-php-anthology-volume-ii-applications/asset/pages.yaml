  md: "# Chapter 2: XML\n\nrows. A second template catches all other (i.e. unpublished)\
    \ articles and suppresses them.\n\nNote that implementing within the stylesheet\
    \ the logic that controls which articles are and not displayed is probably a bad\
    \ idea, then it creates a more interesting example here. In fact, this is better\
    \ handled by PHP in a security/permissions system that is easy to maintain and\
    \ administer. We've used the XPath predicate³ in the template's condition to demonstrate\
    \ an interesting capability of stylesheets, rather than to encourage you to take\
    \ this approach.\n\nFile: articles.xsl (excerpt)\n\n```\n<xsl:output method=\"\
    html\" indent=\"yes\" encoding=\"iso-8859-1\" />\n<!-- Strip whitespace from original\
    \ -->\n<xsl:strip-space elements=\"* />\n<!-- Match each published article -->\n\
    <xsl:template priority=\"1\" match=\"spt:article[spt:article='1']\">\n<tr>\n \
    \ <td class=\"title\">\n    <xsl:value select=\"spt:title\" />\n  </td>\n  <td\
    \ class=\"author\">\n    <xsl:value select=\"spt:author\" />\n  </td>\n  <td colspan=\"\
    2\">\n    <xsl:value select=\"spt:body\" />\n  </td>\n</tr>\n</xsl:template>\n\
    <!-- Match and hide unpublished articles -->\n<xsl:template match=\"spt:article\"\
    \ />\n</xsl:stylesheet>\n```\n\nOK, let us use PHP to perform the transformation.\
    \ First, we define the path to the XML and XSL documents:\n\nFile: 14.php (excerpt)\n\
    \n```\n<?php\n// Define paths to XML and XSL documents (MODIFY THIS!)\n$xml =\
    \ '/path/path/to/XML/articles.xml';\n$xsl = '/path/path/to/XML/articles.xsl';\n\
    ```\n\n> ³A predicate is a portion of an XPath expression between square brackets\
    \ that filters the nodes according to a given condition. In this example, the\
    \ predicate filters out non-public articles.\n\n136"
