  md: "# Security and Authentication in Web Services\n\nWith the proxy object dynamically\
    \ generated from the WSDL, we're ready to use the Web service:\n\nFile: 21.php\n\
    \n```\n// If we're viewing a single article\nif (isset($_GET['id'])) {\n    //\
    \ Call the getArticle() SOAP method\n    $article = $articleClient->getArticle($_GET['id']);\n\
    \n// Handle any errors\nif (PEAR::isError($article)) {\n    $fault = $article->getFault();\n\
    \    trigger_error('Fault: ' . $fault->faultcode . ' ' . $fault->faultstring);\n\
    }\n$stable = \"<tr>\\n\\n    <td>Service unavailable at this time</td></td>\\\
    n\\n    </tr>\\n\";\n} else {\n    // Build the table\n    $table = \"<tr><td\
    \ class=\"title\">\" . $article->title .\n    \"</td><n></tr>\\n\";\n    $table\
    \ .= \"<tr><td class=\"author\">by\" .\n    $article->author . \"</td><n</n></tr>\\\
    n\";\n    $table .= \"<tr><td>\" . $article->body . \"</td><n</n></tr>\\n\";\n\
    }\n```\n```\n\nIf you're interested in the rest of the code of this script, you'll\
    \ find it in the code archive for this chapter.\n\n# Security and Authentication\
    \ in Web Services\n\nOne point you should be aware of when dealing with Web services\
    \ is that you may need to consider the security implications. Do you want users\
    \ (and their dogs) fetching content from your site and displaying it on theirs?\
    \ You probably want some kind of authentication mechanism that only permitted\
    \ sites can fetch your content. If the content that's being sent is confidential,\
    \ or you're using an authentication system and you're worried about a user \"\
    sniffing\" login credentials, you'll need to make sure that the conversation is\
    \ encrypted.\n\nSolving these problems is best handled using the mechanisms that\
    \ are already available with HTTP, namely SSL to encrypt conversations, and HTTP\
    \ authentication (which you now saw in Chapter 1) to “wrap up” a Web service in\
    \ an environment that requires authentication."
