  md: '# 5 Caching


    In the good old days, back when building Websites was as easy as knocking up a
    few HTML pages, the delivery of a Web page to a browser was a simple matter of
    having the Web server fetch a file. A site''s visitors would would see its small,
    textonly pages almost immediately, unless they were using particularly slow modems.
    Once the page was downloaded, the browser would cache it somewhere on the local
    computer so that, should the page be requested again, after performing a quick
    check with the server to ensure the page hadn''t been updated, the browser could
    display the locally cached version. Pages were served as quickly and efficiently
    as possible, and everyone was happy (except those using 9600 bps modems).


    The advent of dynamic Web pages spoiled the party, effectively “breaking” this
    model of serving pages by introducing two problems:


    +   - When a request for a dynamic Web page is received by the server, some intermediate
    processing, such as the parsing of scripts by the PHP engine, must be completed.
    This introduces a delay before the Web server begins to deliver the output to
    the browser. For simple PHP scripts this may not be significant, but for a more
    complex application, the PHP engine may have a lot of work to do before the page
    is finally ready for delivery. This extra work results in a noticeable lag between
    the users’ requests and the actual display of pages in their browsers.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Chapter 5: Caching


    A typical Web server, such as Apache, uses the time of file modification to correctly
    inform a Web browser of a requested page''s cache status. With dynamic Web pages,
    the actual PHP script may change only occasionally, while the content it displays,
    which is fetched from a database, will change frequently. The Web server has no
    way of knowing about updates to the database, however, so it doesn''t send a last
    modified date. If the client (browser) has no indication of how long the data
    is valid, it will take a guess, which usually means it will request the same page
    again. The Web server will always respond with a fresh version of the page, regardless
    of whether the data has changed. To avoid this shortcoming, most developers use
    a meta tag or HTTP headers to tell the browser to use a cached version of the
    page. which negates the Web server''s natural ability to cache Web pages, and
    involves some serious disadvantages. For example, the content delivered by a dynamic
    page may change once a day, so there''s certainly a benefit to be gained by having
    the browser cache a page—even if only for twenty four hours.


    It''s usually possible to live with both problems given a small PHP application,
    but as the complexity of, and traffic to, your sites, you may run into difficulties.
    However, both issues can be solved, the first with server side caching, the second,
    by taking control of client side caching within your application. The exact approach
    you use to solve the problem will depend on your application, and in this chapter,
    we''ll see how you can solve both using PHP and a number of class libraries from
    PEAR.


    Note that in this chapter''s discussions of caching, we''ll look at only those
    solutions implemented in PHP. These should not be confused with some of the script
    caching solutions that work on the basis of optimizing and compiling PHP scripts.
    Included in this group are the Zend Accelerator[1], iconCube PHP Accelerator[2],
    and Turck MMCache[3], the latter being the only accelerator that''s ready for
    use with Windows based PHP installations today.


    # How do I prevent Web browsers caching a page?


    Before we look at the approaches you can take to client and server side caching,
    the first thing we need to understand is how to prevent Web browsers (and proxy


    +   [1] http://www.zend.com/store/products/zend-performance-suite.php

    [2] http://www.phpaccelerator.co.uk/

    [3] http://www.turcksoft.com/en/e_mmc_html'
  merge: -1
