    # Table A.2. Includes and Execution Settings


    | Setting | Notes |

    | include_path (default: ''.'') | Allows you to specify relative and absolute
    paths that PHP will search when you use one of the include related commands. Make
    sure that you have at least the current directory (.) specified, or most third
    party scripts will fail to work. On Unix systems, the list of directories is separated
    by colons (:), while on Windows the separator is a semicolon (;) |

    | auto_prepend_file (default: not set) | PHP will execute the file(s) specified
    before executing any requested script. Useful for performing site-wide operations
    such as security, logging, error handlers, stripping backslashes added by the
    magic quotes feature, and so on. For applications that you''re sure you will use
    yourself, but unsuitable for use in code you intend to distribute. Those unable
    to modify .php.ini settings with .htaccess files will be unable to use such code.
    The list separator is the same as used for the include_path setting |

    | auto_append_file (default: not set) | The twin of auto_prepend_file, executed
    after a requested script is executed |

    | max_execution_time (default: 30) | Specifies the maximum execution time (in
    seconds) for a PHP script run via a Web server may be allowed to execute. Generally,
    it''s best to leave the default setting and use the set_time_limit function to
    extend the limit on a per-script basis. A value of 0 for either removes any limitations
    on script execution time |

    | memory_limit (default: 8M) | The amount of memory PHP has available to it at
    runtime. Usually, the default is fine, while handling very large XML documents,
    for example, or dealing with images, you may need to increase it. The bigger this
    value, and the more memory a script actually uses, the less memory is available
    for other applications running on your server. |'
