    Notice that we add the link, we use a special markup to wrap the text. This is
    a syntax provided by the R&OS PDF library to allow us to use special callback
    functions within the class. The c:alink tag is handled by an in-built method,
    called alink, adds extra links to text. You can define more methods like this
    by extending the Ezpdf with another class and defining methods that correspond
    to tag names.


    Also worth of note is the use of the ezSet and ezSetDY methods. The ezSet method
    sets an absolute Y position (remember, 0 is at the bottom of the page) at which
    to begin placing cursor. The ezDy method moves the cursor vertically, relative
    to its position (usually a negative number to move the cursor).


