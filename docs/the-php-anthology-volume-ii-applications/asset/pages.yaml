    <input type=\"submit\" name=\"publish\" value=\"Publish Article\"><br />\n<input\
    \ type=\"submit\" name=\"delete\" value=\"Delete Article\"><br />\n</form>\n<?php\n\
    }\",}\n```\n\nIf we click the Publish button, our code executes the Article class's\
    \ publish method; behind the scenes, the observers respond to the event, displaying:\n\
    \n+   Publishing article.\nRefreshing cache\nNotifying subscribers by email\n\
    Updating the RSS Feed\n\nThe observer pattern is a powerful easy-to-use mechanism\
    \ for executing multiple routines without specifically calling them in our code.\
    \ We can add or remove observers easily, without making serious modifications\
    \ to the main logic of the application. More importantly, it is easy to reuse\
    \ the observers on other observables, and add their capabilities to other parts\
    \ of our site, such as a forum.\n\n352"
