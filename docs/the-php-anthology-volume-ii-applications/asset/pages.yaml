    \ greatest advantages as a language for building Web-based applications is the\
    \ size and strength of its community—in particular, the wealth of open source\
    \ code available as examples, and for use in your own projects. Developers simply\
    \ need to head over PHP Classes[3] to find examples of the solutions others have\
    \ created to overcome the problem we're dealing with—perhaps the solution even\
    \ fits slots neatly into our existing code, preventing us from having to reinvent\
    \ the wheel.\n\nWhile this is a big plus for PHP, it comes with a downside. Companies\
    \ as Sun and Microsoft are all to put together cohesive libraries of classes that\
    \ integrate well, the whole being much greater than the sum of the parts. As it's\
    \ not backed by any large software house, PHP lacks a library of components that\
    \ compare with the likes of the Java or .NET class libraries. Many of the freely\
    \ available PHP code was designed by developers working in a vacuum; a class may\
    \ have been designed to work either alone or as part of a small library of classes\
    \ that a particular developer uses. As such, attempting to slot someone's class\
    \ into your application may highlight its incompatibility with your existing design.\n\
    \n> [3] http://www.phpclasses.org/"
