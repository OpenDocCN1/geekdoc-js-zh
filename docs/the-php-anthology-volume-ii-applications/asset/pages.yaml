  md: "# The Performance Cost of OOP\n\nSome people writing PHP applications still\
    \ rail against the idea of using classes and objects to build applications. They're\
    \ opposed to this philosophy because of the cost in performance it entails, and\
    \ yes, it's true—using an object oriented approach to solve a problem will be\
    \ a little slower than the equivalent procedural code. What is important to remember\
    \ OOP is that it improves your performance as a developer; if you have infinite\
    \ time to waste, lucky you! For the rest of us, the object oriented paradigm outstrips\
    \ procedural coding in terms of reduced development times\n\n# Most Probable First\n\
    \nA core of any PHP application will typically be some sort of structure, such\
    \ as an if-else statement. Often, these are written in a manner that suits the\
    \ way humans think, but this may not produce the most effective code in speed\
    \ and performance. By placing the most probable condition first, you can help\
    \ PHP complete an if-else statement faster.\n\nFor example, let's say we have\
    \ a function, isBlue which checks to see if a variable passed to it has the value\
    \ 'blue'. If, most of the time, the value is given the function 'red', rather\
    \ than 'blue', it would be better to react to that condition first.\n\nThe following\
    \ example serves as a test to prove this:\n\n```\n<?php\n// Check Xdebug is installed\n\
    if (!extension_loaded('xdebug')) {\n    die('<a href=\"http://xdebug.derickrethans.nl/\"\
    >Xdebug</a> is required');\n}\n\n// Start Xdebug profiling\nxdebug_start_profiling();\n\
    \n// An array of colors called \"weighted\" to red\n$colors = array('red', 'red',\
    \ 'red', 'red', 'red', 'red', 'red', 'blue');\n\n// The slow way\nfunction isBlueSlow($color)\n\
    {\n```"
