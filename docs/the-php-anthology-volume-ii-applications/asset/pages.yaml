  md: "From the point of view of keeping it simple, we'll concentrate here on the\
    \ HTTP\n1.0 caching headers only, namely Expires, Last-Modified, and If-Modified-\n\
    Since, as well as HTTP status code 304 (Not Modified).\n\nThose headers available\
    \ with HTTP 1.1, such as Cache-Control and ETAG, intended to provide an advanced\
    \ mechanism that can be used in conjunction\nwith a Web session's state; in other\
    \ words, the version of a page displayed\nto a visitor who not logged may differ\
    \ vastly from that displayed to a logged-\nuser. The HTTP 1.1 headers were added\
    \ primarily to allow the caching of such\npages.\n\n# Page Expiry\n\nThe header\
    \ that's easiest to use is the Expires header, which sets a date (presum-\\ably\
    \ in the future) on which the page will expire. Until that time, Web browsers\n\
    are allowed to use a cached version of the page.\n\nAn example:\n\n```\n<?php\n\
    /**\n * Sends the Expires HTTP 1.0 header.\n * @param int number of seconds from\
    \ now when page expires\n */\nfunction setExpires($expires)\n{\n  header('Expires:\
    \ ' . \n  gmdate('D, d M Y H:i:s', time() + $expires) . 'GMT');\n}\nn\n// Set\
    \ the Expires header\nsetExpires(10);\n\n// Display a page\necho 'This page will\
    \ self destruct in 10 seconds<br />';\necho 'The GMT is now ' .  gmdate('H:i:s')\
    \ . '<br />';\necho '<a href=\"' . $_SERVER['PHP_SELF'] . \n  ''>View Again</a>/a<br\
    \ />';\n?>\n```\n\nThe setExpires function sets the HTTP Expires header to a future\
    \ time, defined\nin seconds. The above example shows the current time in GMT and\
    \ provides a\nlink that allows you to view the page again. Using your browser's\
    \ Refresh button,"
