    <xsl:output method="text" indent="yes" encoding="iso-8859-1" />

    <!-- Strip whitespaces from original -->

    <xsl:strip-space elements="**" />


    <xsl:template match="spt:article">

    INSERT

    INTO

    <xsl:value-of select="$tableName"/>

    SET

    article_id=''xsl:value-of select="spt:article_id"/>,

    title=

    ''<xsl:value-of select="translate(spt:title,$squote,'''''')"/>'',

    author=

    ''<xsl:value-of select="translate(spt:author,$squote,'''''')"/>/'',

    body=

    ''<xsl:value-of select="translate(spt:body,$squote,'''''')"/>'',

    published=''<xsl:value-of select="spt:published"/>'',

    public=''<xsl:value-of select="spt:public"/>'';

    <xsl:template>

    </xsl:stylesheet>

    ```


    The stylesheet is geared to convert the document into an SQL query. Note that
    for example we''ve used a crude method for solving the problem of single quotes
    inside the SQL statement—we simply removed them all with the XPath translate function.
    In a practical situation, you''d need to write your own escaping template, which
    would be called with a xsl:call-template tag. However, as this is a book on PHP,
    not XSLT, we''ll stick to this simple solution.


    It''s worth noting the XSL parameter we defined:


    ```

    <xsl:param name="tableName" />

    ```


    This parameter needs to hold the name of the table for the resulting SQL query
    in order to work as intended. We will see it in a moment, it will be populated
    by a PHP variable.


    Next, we''ll look at the code that makes the transformation. This time, we''ll
    use XSLT''s error handling functionality to implement my custom function for reacting
    to errors.'
