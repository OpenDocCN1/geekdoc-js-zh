    # # How do I control client side caching with PHP?


    Having seen how to disable client side caching and deal with server side caching,
    it''s time to look at a mechanism that allows us to take advantage of client side
    caches in a way that can be controlled from within a PHP script. This approach
    will only work if you are running PHP with an Apache Web server, because it requires
    use of the function getallheaders to fetch the HTTP headers sent by a Web browser.
    This function works only with Apache.


    # ## New Function Names


    > If you''re using PHP version 4.3.0 on Apache, HTTP headers are available with
    the functions apache_request_headers[9] and apache_response_headers[10]. The function
    getallheaders has an alias for the new apache_request_headers function.


    The mechanism for dealing with Web browser caches is again HTTP. A number of headers
    are involved in instructing Web browsers and proxy servers to cache a page; the
    situation is further complicated by the fact that some are only with HTTP 1.1.


    # ## Examine HTTP Headers in your Browser


    A simple but very handy tool for examining request and response headers is LiveHttpHeaders[11],
    which is an add-on to the Mozilla browser. It''s worth knowing exactly what headers
    your script is sending, particularly when you''re dealing with HTTP headers.


