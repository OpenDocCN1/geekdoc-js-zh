- img_proc: true
  md: '# Session Security


    Once the session has been established, it will continue until it is specifically
    destroyed by PHP (in response to a user clicking "Log out", for example), or the
    session has been inactive for longer than a given period of time (24 minutes by
    default), at which point it becomes flagged for garbage collection and will be
    deleted the next time PHP checks for outdated sessions.


    The following HTTP response headers show a server passing a session cookie to
    a browser, as a result of the session_start function in a PHP script:


    ```

    HTTP/1.1 200 OK

    Date: 26 Feb 2003 02:23:08 GMT

    Server: Apache/1.3.27 (Unix) PHP/4.3.1

    X-Powered-By: PHP/4.3.1

    Set-Cookie: PHPSESSID=ce55b537fb4aefe349bb8d48c5cc6d3; path=/

    Connection: close

    Content-Type: text/html

    <!DOCTYPE html PUBLIC "//W3C//DTD HTML 1.0 Strict//EN"

    "http://www.w3.org/TR/xhtml1/xhtml1-strict.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    ```


    Note that I''ve saved sessions are stored on the server or using other means,
    such as a database or shared memory. This can be useful for displaying "Who is
    Online" type information as well as load balancing multiple Web servers using
    a single session repository, allowing visitors to (unknowingly) swap servers while
    maintaining their session.


    # Session Security


    Sessions are very useful, but there are some security considerations you should
    take into account when using them in your applications:


    +   By default, all browser has to gain control of a session is pass valid session
    ID to PHP. In an ideal world, you could store the IP address that registered the
    session, and double check it on every new request that the associated session
    ID. Unfortunately, some ISPs, such as AOL, assign users new IP on almost every
    page request, so this type of security mechanism would soon start validating users
    out of the system. As it''s important to design your application in a manner that
    assumes that one of your users will eventually have his or her session "hijacked."
    The user''s account is only exposed as long as the session hasn''t expired, so
    your focus should be on preventing the hijackers from doing serious damage while
    they''re in the system.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Chapter 1: Access Control


    This means, for example, that for logged-in users to change their accounts'' passwords,
    they should be asked to provide their old passwords—obviously, hijackers won''t
    know these. Also, be careful with the personal information you make available
    to users (such as credit card details), and if you give users the opportunity
    to make significant changes to their accounts, for instance, changing a shipping
    address, be sure to send a summary notification to their email address (this will
    alert users whose sessions have been hijacked).


    To keep the session ID completely hidden, you''ll need to use SSL to encrypt the
    conversation. What''s more, you should only use the cookie method of passing the
    session ID. If you pass it in the URL, you may give away the session ID upon visiting
    another site, thanks to the referrer header in the HTTP request.


    The PHP files creates for the purpose of storing session information are, by default,
    stored in the temporary directory of the operating system when PHP is running.
    On Unix systems such as Linux, this will mean that if you''re on a shared server,
    other users on the server can read the files'' contents. They may not be able
    to identify which virtual host and PHP script are the owners of the session but,
    depending on the information you place there, they may be able to guess.


    This is a serious cause for concern on shared PHP systems; the most effective
    solution is to store your sessions in a database, rather than the server''s temporary
    directory. We''ll look more closely at custom session handlers later in this chapter,
    but a partial solution is to set the session.save_path to a directory that''s
    not available to the public. You''ll need to contact your hosting company in order
    to have set the correct permissions for that directory, so that ''nobody'' or
    ''wwwuser'' user with PHP runs has access to read, and write, files in that directory.


    # Session IDs and Cross-Site Scripting


    ![](img/c8cd8f0e37a1c130cdbf5206f1922f1f_28_0.png)


    One final using a common Web security exploit, cross-site scripting (XSS), it''s
    possible for an attacker to attack JavaScript on your site that will cause visitors
    to give their session ID to a remote Website, allowing their sessions to be hijacked.
    If you allow visitors to post any HTML, make sure you check and validate it very
    carefully (see Appendix C for more on XSS and Volume I, Chapter 5 for an HTML
    filtering mechanism).


    Remember the golden rules: never rely on client side technologies (such as JavaScript)
    to handle security and never trust anything you get from a browser.'
