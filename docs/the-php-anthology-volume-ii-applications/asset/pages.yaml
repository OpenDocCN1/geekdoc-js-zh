    \ if you want to stick around. Changing their passwords should not require users\
    \ to log back, provided you construct your application carefully.\n\nGoing back\
    \ to the session-based authentication mechanism you saw earlier in this chapter,\
    \ you'll remember that the login and password are stored in session variables\
