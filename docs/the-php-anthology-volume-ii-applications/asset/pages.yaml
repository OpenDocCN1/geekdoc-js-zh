  md: '# # 1 Access Control


    One of the side effects of building your site with PHP, as opposed to plain HTML,
    is that you''ll be building dynamic Web applications rather than static Web pages.
    Your site will let you “do” things that weren''t possible with plain HTML. But
    how can you ensure that only you, or to those to whom you give permission, are
    able to “do things,” and prevent the Internet’s raging hordes from running riot
    on your site?


    In this chapter, we''ll be looking at the mechanisms you can employ with PHP to
    build authentication systems and control access to the parts of your site you
    regard as private.


    One word of warning before I go any further: any system you build, which involves
    the transfer of data from a Web page over the Internet, will send information
    in clear text by default.¹ What this means is that if someone is “listening in”
    on the network between the client''s Web browser and the Web server, which is
    possible using a tool known as a packet sniffer, they will be able to read the
    user name and password sent via your form. The chances of this happening are fairly
    small, as only trusted organizations like ISPs have the access require to intercept
    packets. However, there is still a risk, and it''s one you should take seriously.


    > ¹Web servers that require Secure Socket Layer (SSL) connections will safely
    encrypt the data during transit. This is the best way to protect sensitive data
    in today''s Web applications.'
  merge: -1
  pgno: 19
- img_proc: true
  md: "# Chapter 1: Access Control\n\nIn addition to strategies for building access\
    \ control systems for your site, in this chapter you'll find plenty of references\
    \ to useful information (there are more in Appendix C). I cant stress enough the\
    \ importance of a little healthy paranoia in building Web-based applications.\
    \ The SitePoint Forums frequently receive visits from would-be developers who\
    \ get their fingers burned when it came to site security.\n\nThis chapter requires\
    \ the following MySQL tables, in addition to the user table from Volume I, Chapter\
    \ 9. Note that you'll find the SQL code to create all of these, with sample data,\
    \ in the code archive in the sql/ directory.\n\nFirst, you'll need a table for\
    \ storing temporary sign up information:\n\n```\nCREATE TABLE signup (\n  signup_id\
    \ INT(11) NOT NULL AUTO_INCREMENT,\n  login VARCHAR(50) NOT NULL DEFAULT '',\n\
    \  password VARCHAR(50) NOT NULL DEFAULT '',\n  email VARCHAR(50) DEFAULT NULL,\n\
    \  firstName VARCHAR(50) DEFAULT NULL,\n  lastname VARCHAR(50) DEFAULT NULL,\n\
    \  signature TEXT NOT NULL,\n  confirm_code VARCHAR(40) NOT NULL DEFAULT '',\n\
    \  created INT(11) NOT NULL DEFAULT '0',\n  PRIMARY KEY (signup_id),\n  UNIQUE\
    \ KEY confirm_code (confirm_code),\n  UNIQUE KEY user_login (login),\n  UNIQUE\
    \ KEY user_email (email)\n)\n```\n\nYou'll need a table for storing groups:\n\n\
    ```\nCREATE TABLE collection (\n  collection_id INT(11) NOT NULL auto_increment,\n\
    \  name VARCHAR(50) NOT NULL DEFAULT '',\n  description TEXT NOT NULL,\n  PRIMARY\
    \ KEY (collection_id)\n)\n```\n\nNext, there's a lookup table between users and\
    \ groups:\n\n```\nCREATE TABLE user2collection (\n  user_id INT(11) NOT NULL DEFAULT\
    \ '0',\n  collection_id INT(11) NOT NULL DEFAULT '0'\n)\n```\n\n> Note that I've\
    \ called this table collection. The name \"group\" would cause problems, as GROUP\
    \ is a keyword in SELECT query syntax."
  merge: -1
  pgno: 20
- img_proc: true
  md: "# How do I use HTTP authentication with PHP?\n\n```\nPRIMARY KEY (user_id,\
    \ collection_id)\n)\n```\n\nDon't forget this table for storing permissions:\n\
    \n```\nCREATE TABLE permission (\n  permission_id INT(11) NOT NULL AUTO_INCREMENT,\n\
    \  name VARCHAR(50) NOT NULL DEFAULT '',\n  description TEXT NOT NULL,\n  PRIMARY\
    \ KEY (permission_id)\n)\n```\n\nAnd finally, you'll need this lookup table between\
    \ groups and permissions:\n\n```\nCREATE TABLE collection2permission (\n  collection_id\
    \ INT(11) NOT NULL DEFAULT '0',\n  permission_id INT(11) NOT NULL DEFAULT '0',\n\
    \  PRIMARY KEY (collection_id, permission_id)\n)\n```\n\n# How do I use HTTP authentication\
    \ with PHP?\n\nHypertext Transfer Protocol[1] (HTTP) defines its own authentication\
    \ mechanisms, named \"Basic\" and \"Digest\", which are defined in RFC 2617[2].\
    \ If you run PHP on an Apache server, you can take advantage of the basic authentication\
    \ mechanism (digest authentication is on the list of features yet to be released)\
    \ using PHP's header function and a couple of predefined variables. A general\
    \ discussion of these features is provided in the PHP Manual[3].\n\n# Heads Up\n\
    \nThe first thing to understand is what actually happens when your browser sends\
    \ a request to a Web server to give it a Web page. HTTP is the protocol for communication\
    \ between a browser and a Web server. When your Web browser sends a request to\
    \ a Web server, it uses an HTTP request to tell the server which page it wants.\
    \ The server replies with an HTTP response that describes the type and characteristics\
    \ of the document being sent, then delivers the document itself.\n\n+   [1] ftp://ftp.isi.edu/in-notes/rfc2617.txt\n\
    [2] ftp://ftp.isi.edu/in-notes/rfc2617.txt\n[3] http://www.php.net/features.http-auth"
