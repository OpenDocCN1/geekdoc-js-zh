  md: "# Chapter 6: Development Technique\n\nThe mock object class contains the same\
    \ methods as the class it simulates—in the case of the Stamp class, this is simply\
    \ the constructor, stamp. The mock object class, when instantiated as an object,\
    \ now fully simulates the Stamp API (as the generated code is pretty complex,\
    \ you may just want to take my word for this).\n\nNow, let me show you how to\
    \ create correctly a mock object like this for use in your testing:\n\n```\n<?php\n\
    if (defined('SIMPLE_TEST')) {\n  // Modify this line to point at your simplest\
    \ installation\n  define('SIMPLE_TEST', '../simpletest/');\n}\n\require_once SIMPLE_TEST\
