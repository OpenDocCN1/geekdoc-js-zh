    \ * @access public\n */\nfunction ArticlesXML($articlesDoc) {\n  $dom = domxml_open_mem($articlesDoc);\n\
    \  $xpath = $dom-\\>xpath_init();\n  $ctx = $dom-\\>xpath_new_context();\n  $ctx-\\\
    >xpath_register_ns(\"spt\", \"http://www.sitepoint.com/\");\n\n  $articles = =\n\
    \  @$ctx-\\>xpath_eval(\"//spt:article/descendant-or-self::*\");\n\n  foreach\
    \ (@$articles as $node) {\n    switch ($node->tagname) {\n      case 'article':\n\
    \        if (isset($article)) {\n          $this->articles[] = new Article($article);\n\
    \        }\n        $article = array();\n        break;\n      case 'body':\n\
    \        $article['body'] = $dom-\\>dump_node($node);\n        break;\n      default:\n\
    \        $article[$node->tagname] = $node-\\>get_content();\n        break;\n\
    \    }\n    if (isset($article)) {\n      $this->articles[] = new Article($article);\n\
    \    }\n  }\n}\n```\n\nIn the foreach loop above we used the tagname property\
    \ of the $node object to implement some switching logic. If the node is an article\
    \ corresponding to spt:article, we first check to see if the variable $article\
    \ exists (which it won't on the first iteration). If it does, we pass it to a\
    \ new instance of the class Article, which is basically just a data store that\
