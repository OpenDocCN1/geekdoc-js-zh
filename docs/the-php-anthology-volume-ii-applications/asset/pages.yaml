  md: "# Appendix A: PHP Configuration\n\nThis is a quick reference to configuring\
    \ PHP that covers the most important\ngeneral settings you need to be aware of,\
    \ either when running applications in a\nlive environment, or because they impact\
    \ security or the way you write code.\n\n# Configuration Mechanisms\n\nThe primary\
    \ mechanism for configuring PHP is the php.ini file. As the master\nfile, this\
    \ provides you with control over all configuration settings. Entries generally\n\
    take the:\n\n```\nsetting = value\n```\n\nBe sure to read the comments provided\
    \ in the file before making changes, though,\nThere are a few tricks, such as\
    \ include_path using a colon (:) as a separator in\nUnix, and a semicolon (;)\
    \ on Windows.\n\nMost Web hosts will not provide you access to your php .ini file\
    \ unless you have\nroot access to the system (which is typically not the case\
    \ if you're using a cheap\nvirtual hosting service). Your next alternative is\
    \ to use .htaccess files to configure\nPHP (assuming the Web server is Apache).\n\
    \n .htaccess file is a text file that you place in a public Web directory to\n\
    determine the behavior of Apache when it comes to serving pages from dir-\ndirectory;\
    \ for instance, you may identify which pages allow public access to.\nNote that\
    \ the effect of an .htaccess file is recursive—it applies to subdirectories\n\
    well.\n\nTo configure PHP with .htaccess files, your hosting provider must have\
    \ the\nApache setting AllowOverride Options or AllowOverride All applied to your\n\
    Web directory in Apache's main http.conf configuration file. Assuming that\nis\
    \ done, there are two Apache directives you can use to modify PHP's configura-\n\
    tion:\n\n```\nphp_flag\nused for settings that have boolean values (i.e. on/off\
    \ or 1/0) such as re-\ngister_globals\n```"
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Appendix A: PHP Configuration


    php_value

    used to specify a string value for settings, such as you might have with the

    include_path setting


    Here''s an example .htaccess file:


    ```

    # Switch off register globals

    php_flag register_globals off


    # Set the include path

    php_value include_path "./home/username/pear"

    ```


    The final mechanism controlling PHP''s configuration is the group of functions

    ini_set and ini_alter, which let you modify configuration settings, as well as\ini_get,
    allows you to check configuration settings, and ini_restore,

    resets PHP''s configuration to the default value as defined by php.ini and

    anyhtaccess files. Using ini_set, here''s an example which allows us to avoid

    having to define our host, user name and password when connecting to MySQL:


    ```

    ini_set(''mysql.default_host'', ''localhost'');

    ini_set(''mysql.default_user'', ''harry'');

    ini_set(''mysql.default_password'', ''secret'');

    ```


    ```

    if (!mysql_connect()) {

    echo mysql_error();

    } else {

    echo ''Success'';

    }

    ```


    Be aware that PHP provides for some settings, such as error_reporting, altern-

    tive functions that perform effectively the same job as ini_set. Which you

    prefer is a matter of taste.


    Note that certain settings, such as register_globals, can only be usefully

    modified by php.ini or .htaccess, because settings influence PHP''s beha-

    ior before it begins executing your scripts.


    Furthermore, some configuration settings can be changed only in php.ini, such

    extension_dir, which tells PHP the directory in PHP extensions can

    found. For a complete reference on controlling settings, refer to the PHP

    Manual[1].


    +   [1] http://www.php.net/ini_set'
