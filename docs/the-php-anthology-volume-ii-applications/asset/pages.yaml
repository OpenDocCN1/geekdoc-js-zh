    \ public='1';\n```\n\n# How do I build an XML-RPC service with PHP?\n\nXML Remote\
    \ Procedure Calling[39] (XML-RPC) is an XML standard that's commonly used for\
    \ exchanging data between Web servers on the Internet. It allows you to store\
    \ your data on one server, while displaying it in a Web page or a completely separate\
    \ server. This would allow you to make data available to other Webmasters, for\
    \ example. Think of this as a generalized variant of an RSS feed, and you're not\
    \ far off.\n\ncomplete messaging protocol, where all the requests and responses\
    \ are XML documents. The standard falls under the buzzword Web services, and is\
    \ the forerunner for Simple Object Access Protocol[40] (SOAP), the current \"\
    king\" of Web services. Here, I'll assume you have a grasp of what Web services\
    \ are about, not the actual syntax of XML-RPC. If you're not sure, you will find\
    \ recommended material in the section called “Further Reading” at the end of this\
    \ chapter, including an article that focuses purely on XML-RPC.\n\n> [39] http://www.xmlrpc.com/\n\
    [40] http://www.w3.org/TR/SOAP/"
