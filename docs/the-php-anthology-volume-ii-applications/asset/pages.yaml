  md: "# Chapter 1: Access Control\n\nPRIMARY KEY (user_id, collection_id)\n\nNotice\
    \ that the primary key for the table uses both columns. In doing so, it makes\
    \ sure that no combination of user_id and collection_id can appear more than once.\n\
    \nNote that I use \"collection\" to refer to \"group\" in MySQL; the use of \"\
    group\" would confuse the current versions of the mysqldump utility, which as\
    \ you know from Volume I, Chapter 3, is a helpful tool for backing up a database.\n\
    \nTable 1.1 presents sample data from user2group table:\n\n| user_id | collection_id\
    \ |\n| 1 | 2 |\n| 2 | 1 |\n| 2 | 2 |\n| 3 | 2 |\n| 4 | 2 |\n\nThis us that User\
    \ 1 is a member of Group 2, User 2 is a member of Groups 1 and 2, User 3 is a\
    \ member of Group 2, etc.\n\nWith the lookup tables defined (the other being called\
    \ collection2permission), we can now perform queries across the tables to identify\
    \ the permissions a particular user has been allowed. For example, the following\
    \ query returns all the permissions for the user with user_id 1.\n\n```\nSELECT\n\
    \ p.name as permission\nFROM\n user2collection uc, collection2permission cp, permission\
    \ p\nWHERE\n uc.user_id = '1' AND\n uc.collection_id = cp.collection_id AND\n\
    \ cp.permission_id = p.permission_id\n```\n\nNote that I've used aliases for table\
    \ names, such as user2collection ug, to make writing the query easier.\n\n62"
