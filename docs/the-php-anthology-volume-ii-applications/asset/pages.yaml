  md: '# Chapter 1: Access Control


    Remember, any text or whitespace outside the <php ... ?> causes output to be sent
    to the browser. If you have whitespace before a <php tag or after a ?> tag, you
    won''t be able to send headers to the browser past that point.


    This type of authentication is handy in that it''s easy to implement, but it''s
    not too pretty in terms of the user''s experience. It does present a useful mechanism
    for use with Web services, however—something we''ll see in Chapter 2.


    Note that PEAR provides the Auth_HTTP[4] package, which you should consider if
    you''re planning to use HTTP authentication in earnest, as it will help you avoiding
    critical errors. For a detailed discussion of PEAR, consult Appendix D.


    # How do I authenticate users with sessions?


    Sessions is a mechanism that allows PHP to preserve state between executions.
    In simple terms, sessions allow you to store variables from one page and use them
    on another. So if a visitor tells you his name is “Bob” (via a form) on one page,
    on all the other pages of your site personal messages show as. “Where would you
    like to go today, Bob?” (‘’t—don’t be surprised if Bob leaves pretty quickly,
    though).


    The basic mechanism of sessions works like this: first, PHP generates a unique,
    thirty-two character string to identify the session. It passes the value to the
    browser; simultaneously, it creates a file on the server and includes the session
    ID in the filename. There are two methods by which PHP can inform a browser of
    its session ID: by adding the ID to the query string of all relative links on
    the page, or by sending it as a cookie. Within the file that’s stored on the server,
    PHP saves the names and values of the variables it has been told to store for
    the session.


    When the browser makes a request for another page, it tells PHP which session
    was assigned via the URL query string, or by returning the cookie. PHP then looks
    up the file it created when the session was started, and so has access to the
    data stored within the session.


    [4] http://pear.php.net/AUTH_HTTP'
  merge: -1
