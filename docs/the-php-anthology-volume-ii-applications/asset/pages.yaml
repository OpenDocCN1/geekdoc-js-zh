  md: '# Chapter 5: Caching


    ```

    // Get the contents of

    $buffer = ob_get_contents();


    // Stop buffering and clean out the buffer

    ob_end_clean();


    // Echo some text normally

    echo ''2. A normal echo<br />'';


    // Echo the contents from the buffer

    echo $buffer;

    ?

    ```


    The buffer itself stores the output as a string. So, in the above script, we commence
