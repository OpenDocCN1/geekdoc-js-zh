  md: "```\n<?php\n// Define paths to XML and XSL documents (MODIFY THIS!)\n$xml =\
    \ '/full/path/to/sitepoint/XML/articles.xml';\n$xsl = '/full/path/to/sitepoint/XML/article2sql.xml';\n\
    \n// Define the XSLT error handler\nfunction xslt_error_handler($xp, $errNo, $level,\
    \ $fields) {\n    $errMsg = 'Error # ' . $errNo . ', Level ' . $level .\n    ',\
    \ Fields: <br />';\n    if (is_array($fields)) {\n        foreach ($fields as\
    \ $key => $value) {\n            $errMsg .= $key . ' => ' . $value . '<br />';\n\
    \        }\n    } else {\n        $errMsg .= $fields . '<br />';\n    }\n    trigger_error($errMsg);\n\
    }\n\n// Instantiate the XSLT processor\n$xp = xslt_create();\n\n// Set the error\
    \ handler\nxslt_set_error_handler($xp, 'xslt_error_handler');\n\n// An array of\
    \ params to pass to the processor\n$params = array('tableName' => 'articles');\n\
    \n// Perform the transform using the PHP variables\n$result = xslt_process($xp,\
    \ $xml, $xsl, null, $params);\n\n// Display the result\necho \"<pre>\" . $result\
    \ . \"</pre>\";\n?>\n```\n\nNotice the $params array, where we define the variable\
    \ tableName. This is passed to the XSLT processor, then used in the transformation\
    \ to render the SQL. Figure 2.10 shows the output of this script, which simply\
    \ displays the generated SQL code."
