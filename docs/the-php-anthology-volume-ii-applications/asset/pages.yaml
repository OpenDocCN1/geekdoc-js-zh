- img_proc: true
  md: '# Chapter 7: Design Patterns


    My own opinion of design patterns is that they provide a shortcut to discovering
    the way you''d probably end solving a particular problem, provided you had enough
    time to experiment with all the possible ways you might structure your code. In
    other words, they''re down-to-earth descriptions of how a group of programmers
    found best solve the problems they faced.


    Talking about what design patterns are something I generally prefer to avoid.
    It''s like trying to explain the concept of snow to someone who grew up in the
    Sahara desert; yet if you''ve seen it before, it''s not going to make much sense.
    Reading the solutions in this chapter, which look at specific examples using real
    code is, in my opinion, a better way to grasp the concepts.


    But, to give you rough idea of where this chapter is headed, consider this in:
    in your Web building experience, have you ever had a feeling of déjà vu? Have
    you ever said to yourself, ''I''ve done before,'' or ''I''m sure I saw a really
    good solution to this problem. Now, where was it?


    What the Gang of Four with Design Patterns identified twenty three common problems
    that developers develop déjà vu, providing guidelines for how we could best solve
    each time. It has shown that the Gang of Four (GoF) got it to use; of their solutions
    typically help developers write applications that are easy to maintain, yet are
    able to cope with the special cases that occur in the real world. The adage "design
    is dead," often quoted these days in discussions of the visual of design Websites,
    can also be applied to object programming, thanks to design patterns. If you can
    learn to spot the problem in the first place, the solution is just a matter of
    identifying and applying the right pattern.


    A welcome side-effect of studying design patterns is that they help people learn
    how to get the most out of the object oriented paradigm. In reading this chapter,
    you may find that object oriented PHP becomes much richer, rather than feeling
    overwhelmed by a whole load of new syntax that you have no idea what to do.


    Although the GoF laid out a catalog of twenty three patterns, we''ll only cover
    the five that I''ve found to be used or useful in PHP 4, to give you a taste of
    what design patterns are. A more depth analysis of object oriented programming
    is beyond the scope of this book. This is not to say that other patterns cannot
    be effectively applied in PHP, but I''ve included the patterns that can be easily
    applied to any PHP application, and do not suggest some sort of framework that
    affects the structure of your application.


    > The Model-View-Controller (MVC) pattern, the Command Pattern and the Template
    Method, to name a few.'
