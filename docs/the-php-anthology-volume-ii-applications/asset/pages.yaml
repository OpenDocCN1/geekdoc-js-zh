    The library respects the new line character, so basic formatting is preserved.
    The ezStream method sends the finished PDF document straight to the Web browser,
    taking care to send the right HTTP headers. The alternative is the output method,
    which returns the document as a string that can be saved as a file.


    # Programming Tip


    If your scripts automatically send HTTP headers that tell the browser not to cache
    pages, this causes problems when Internet Explorer renders PDF documents on the
    fly with R&OS PDF. Internet Explorer has a strange way of caching downloaded files,
    which involves two requests for a file.


    There are two solutions. You can avoid rendering PDF straight to the browser,
    instead using the output method to store it as a file that you can link to with
    HTML. Alternatively, make sure you don''t send any headers that instruct the browser
    not to cache; rather, send a Last-Modified header set to the present time. See
    Chapter 5 for full details.


    Figure 3.1 shows what the page generated by this example will look like in Acrobat
    Reader.'
