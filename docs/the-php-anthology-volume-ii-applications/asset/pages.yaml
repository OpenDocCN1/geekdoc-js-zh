  md: "# How do I parse an RSS feed with PHP and SAX?\n\nWith all the callback functions\
    \ in place, we start up the parser as before, and use the xml_set_element_handler\
    \ and xml_set_character_data_handler functions to register the callback functions.\
    \ In other words, we will tell the parser to open when it encounters an opening\
    \ tag, close for a closing tag, and data for character data.\n\nFile: 2.php (excerpt)\n\
    \n```\n// Create the XML parser\n$sax = xml_parser_create('UTF-8');\n\n// Register\
    \ the open and close callback functions\nxml_set_element_handler($sax, 'open',\
    \ 'close');\n\n// Register the character data callback function\nxml_set_character_data_handler($sax,\
    \ 'data');\n```\n\nNote that other xml_set... functions exist for handling things\
    \ like XML processing instructions and external entity references, but in the\
    \ vast majority of cases the two functions provided are all you'll need.\n\nNow,\
    \ we'll fetch the SitePoint RSS feed from the Website and loop through the chunks,\
    \ parsing each chunk as we go. This means the parser will begin before it's finished\
    \ receiving the complete document! This is great for performance, and means the\
    \ complete XML document never has to be stored in PHP's memory.\n\nFile: 2.php\
    \ (excerpt)\n\n```\n// Open a connection to SitePoint\n$fp = fopen('http://www.sitepoint.com/rss.php',\
    \ 'r');\n\n// Loop until the end of the file\nwhile (!feof($fp)) {\n    // Fetch\
    \ a chunk of data\n    $data = fgets($fp);\n\n    // Parse it\n    xml_parse($sax,\
    \ $data);\n}\n\n// Now free up the parser\nxml_parser_free($sax);\n\n// Finish\
    \ off the table\n$table .= \"</table>\\n\";n?>\n```"
