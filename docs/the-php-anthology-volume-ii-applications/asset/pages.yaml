  md: '# PHP-Related Issues


    URL. This is no use if the script in question uses the MySQLDump application to
    back up your database—a PHP script executed via Apache will typically run as a
    user, which will not have the correct permissions required for the job.


    # PHP-Related Issues


    +   - Can you see the output of phpinfo on the server you will actually be assigned
    to?


    +   - Some hosts may claim this is a security risk, but expert hosts know that
    security by obscurity is no substitute for real security. The information provided
    by phpinfo is not a security risk to hosting providers who know what they’re doing,
    having Linux, Apache, and firewalls correctly set. What phpinfo tells you is the
    best way to confirm the facts.


    +   - Is PHP installed as an Apache module (not the CGI variant)?


    +   - This provides much better performance.


    +   - Is the Apache AllowOverride set to Options or All?


    +   - This will modify your php.ini settings with .htaccess files.


    +   - Is PHP Safe Mode disabled?


    +   - The safe_mode option in php.ini is, in theory, a way to make PHP secure,
    and prevent users from performing certain tasks or using certain functions that
    are security-sensitive. Safe Mode is nothing but a large headache if you’re doing
    any serious work in PHP.


    +   - Check the upgrade policy of your host.


    +   - Ask the host how much you will get before upgrades are performed. Check
    that they provide you with a copy of the php.ini file they’ll be using for the
    upgrade (before it happens). The number of hosts that, overnight, switch from
    register_globals = on to register_globals = off is considerable. Make sure you
    test your applications on your development system against the new version before
    the host perform the upgrade.


    +   - Ask for a list of installed PHP extensions.


    Confirm that these extensions match the requirements of your applications. Few
    hosts, for example, bother to provide the XSLT extension. Also


