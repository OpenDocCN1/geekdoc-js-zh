  md: '# Chapter 2: XML


    As you can see, the SOAPArticle class does most of the work involved in providing
    this Web service. All we now need a script that will connect to the database and
    create the server:


    ```

    <?php

    // Include the MySQL class

    require_once ''Database/MySQL.php'';


    // Include the SOAP Article Server

    require_once ''ExampleApps/SOAPArticleserver.php'';


    // Define variables for MySQL class

    $host = ''localhost''; // Hostname of MySQL server

    $dbUser = ''harry''; // Username for MySQL

    $dbPass = ''secret''; // Password for user

    $dbName = ''sitepoint''; // Database name


    // Instantiate MySQL class

    $db = &new MySQL($host, $dbUser, $dbPass, $dbName);


    // Instantiate ArticleServer

    $server = new SOAPArticleServer($db);

    ?>

    ```


    Now, a server is not much good without a client to access it. As with XML-RPC,
    SOAP is a platform- and language-independent protocol, so you could build a client
    in any language (ideally, though the language would have a SOAP library of some
    sort so you won''t have to reinvent the wheel). In "How do I consume SOAP Web
    services with PHP", you learned how to build a SOAP client in PHP automatically
    from a Web service''s WSDL description. Here''s how that would work for this Web
    service:


    ```

    <?php

    // Include PEAR::SOAP Client class

    require_once ''SOAP/Client.php'';


    // Instantiate the SOAP_WSDL class

    $wsdl = new SOAP_WSDL(''http://localhost/XML/20.php?wsdl'');


    // Instantiate the ArticleClient class

    $articleClient = $wsdl->getProxy();

    ```'
