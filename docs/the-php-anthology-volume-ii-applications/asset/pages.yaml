    >\n<circle cx=\"50\" cy=\"50\" fill=\"navy\" />\n</svg>\";\n```\n\nFirst, we send\
    \ the SVG Content-type header to tell the client browser what we are dealing with,\
    \ then we simply display the SVG document as plain text.\n\n# XML Processing Instructions\
    \ and PHP\n\nThe XML specification recommends that all XML documents should begin\
    \ with a <?xml ?> processing instruction that identifies the version of XML in\
    \ use and a number of options, the character set. In the case of XHTML documents,\
    \ it is currently prudent to leave out this optional element, because it interferes\
    \ with Internet Explorer 6 for Windows' ability to identify the document type.\n\
    \nIn other documents, the SVG document above, this element should be included.\
    \ Unfortunately, the default configuration will cause the PHP engine to process\
    \ XML processing instructions as if they contain PHP code, producing nasty error\
    \ messages.\n\nTo get around this, you need to write the processing instruction\
    \ with a PHP echo statement, as demonstrated in the example above.\n\nViewing\
    \ this page displays a circle in navy blue with a radius of fifty pixels, which\
