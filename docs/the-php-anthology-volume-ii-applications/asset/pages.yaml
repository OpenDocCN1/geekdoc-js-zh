  md: "# How do I track who is online?\n\n```\n$myVar = \"Hello World\";\n$ip_address\
    \ = \"127.0.0.1\";\n```\n\nBeing able to decode this information with PHP will\
    \ become important in the next solution.\n\n# How do I track who is online?\n\n\
    You may have seen applications such as vBulletin and phpBB, which let visitors\
    \ see how many users are online (and sometimes, which users are online) at a given\
    \ moment. Now that we have an authentication system, and a custom session handles\
    \ those sessions in MySQL, implementing \"Who is Online?” functionality is a breeze\
    \ (well, almost)!\n\nThe first thing we need (is you guessed!) a class that we\
    \ can use to read and interpret stored session data from MySQL.\n\nThe constructor\
    \ for the class simply initializes an array. This is used as a “first in first\
    \ out (FIFO) queue to which raw session data is added, and from which objects\
    \ are returned along with properties that correspond to the variables in a given\
    \ session.\n\nFile: Session/SessionAnalyzer.php (in SPLIB (except))\n\n> * Session\
    \ Analyzer\n* Examines serialized session data (as it appears on the file system\
    \ or in a database) and builds objects into which it places\n* places the data\
    \ stored in the session\n* <code>\n* $sa = new SessionAnalyzer();\n* $sa->addSession($some_serialized_session_data);\n\
    * $sessionStore = $sa->fetch();\n* </code>\n* @package SPLIB\n* @access public\n\
    */\n\n```\nclass SessionAnalyzer {\n/**\n* A list of sessions, their data held\
    \ in SessionStore objects\n* @var array\n */\nvar $sessions;\nn/**\n```\n\n73"
