  md: '# Appendix D: Working with PEAR


    changing the installation prefix pops up a Windows “Browse” dialog box, through
    which you can specify the required directory.


    With the installation options set to your requirements, the go-pear.php script
    will connect to the PEAR Website, and download all the packages required to set
    up the package manager (it also asks if you require additional packages, which
    are well worth having). Packages are installed in a subdirectory of the directory
    you specified as the installation prefix (so, in the above examples you''d end
    up with c:\pear\pear or /home/username/pear/pear).


    Finally, if you let, the go-pear.php installer will attempt to modify your include_path
    in php.ini. To do this manually, assuming you used the directories above, you''d
    specify the following:


    ```

    include_path = \.:home/username/pear/pear*

    ```


    For Windows users, the path to pear is as follows:


    ```

    include_path = ".;c:\pear\pear*

    ```


    Finally, to use the PEAR package manager from the command line, you need to set
    up some environment variables. For Windows users these can be automatically added
    to your Windows registry by right clicking on the file PEAR_ENV.reg and choosing
    Run. They may also be manually configured as environment variables via the Windows
    Control Panel. Users with Unix-based systems can configure them to be set every
    time you log in, by editing the .profile in your home directory (/home/username):


    ```

    # Envirement variables

    export PEAR_SYSCONF_DIR=/home/username/pear

    export PEAR_INSTALL_DIR=/home/username/pear

    export PEAR_DOC_DIR=/home/username/pear/docs

    export PEAR_BIN_DIR=/home/username/pear

    export PEAR_DATA_DIR=/home/username/pear/data

    export PEAR_TEST_DIR=/home/username/pear/tests

    export PEAR_PHP_BIN=/local/bin/php

    ```


    Finally, you need to add the PEAR line script to your system path, which, on Windows,
    can be achieved through the System Control Panel application (on the Advanced
    tab, click Environment Variables), by appending c:\pear to the PATH variable.


    On Unix-based systems, add the following to your .profile script:


    ```

    export PATH=$PATH;/home/username/pear

    ```'
