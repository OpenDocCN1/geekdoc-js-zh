  md: '# Chapter 2: XML


    But some applications of XML can make this simple, top-to-bottom approach to writing
    documents impractical.


    For example, you might need to add elements or set attributes near the top of
    a document after you generate all the tags that follow. Additionally, writing
    XML requires you to replace correctly special characters as &, <, and >, as well
    as non-English characters as Û, with the appropriate character entities. Attempting
    to achieve these features by simply manipulating PHP strings is a fast track to
    hair loss.


    The DOM XML extension allows you to add, remove, and modify elements throughout
    a document in any order, and will take care of all the character escaping for
    you. For example, constructing an RSS feed, of which is rendered straight from
    database content that''s likely to contain more than a few special characters,
    will be a lot easier if you use the DOM rather than rendering the XML.


    The following example shows the XML document built using the DOM:


    ```

    <?php

    // Instantiate new XML document

    $dom = domxml_new_doc(''1.0'');


    // Create the root <example> element

    $example = $dom->create_element(''example'');


    // Create the date element

    $date = $dom->create_element(''date'');


    // Create a text node to place the date in

    $dateText = $dom->create_text_node(date(''h:ia l JS M Y''));


    // Append the date text to the <date> element

    $date->append_child($dateText);


    // Append the element to the <example> element

    $example->append_child($date);


    // Append the root element to the document

    $dom->append_child($example);


    // Send the XML MIME type

    header(''Content-Type: text/xml'');

    ```'
