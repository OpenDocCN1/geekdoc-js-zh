    application. The “N” means “some number of”, while “tier” refers to the layers
    in your application being like tiers on a wedding cake.


    Let''s step back into the past for a moment. In the old days of client-server
    computing on corporate networks, applications shared by multiple users were generally
    built with two tiers: a central database or file server, and a desktop application
    that accessed the central resource. This worked well for small groups of users,
    as applications were distributed across regional and international networks and
    user bases grew, all sorts of problems ensued. The database might be overloaded,
    client side upgrades and maintenance became more expensive, and network'
