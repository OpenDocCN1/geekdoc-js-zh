  md: '# Error-Related Settings


    Table A.3 shows the most important PHP settings that relate to the way PHP handles
    errors, in addition to display_errors and error_reporting, which are described
    in Table A.1.


    # Table A.3. Error-Related Settings


    | Setting | Notes |

    | --- | --- |

    | log_errors (default: off) | Allows you to log errors to a text file, in conjunction
    with error_log (below). Useful for a live site where you''ve switched off the
    display of errors to visitors. |

    | error_log (default: not set) | A filename to which errors are logged when log_errors
    is switched on. |

    | ignore_repeated_errors (default: off) | Using this, if the same error occurs
    from the same PHP script on the same line, the error will only be reported once
    per script execution. Helps prevent massive log resulting from errors that occurs
    in loops, logging to a text file. |

    | ignore_repeated_source (default: 30) | Similar to ignore_repeated_errors, but
    in this case, it suppresses repeated errors of the same type throughout a PHP
    script. |

    | report_memleaks (default: on) | Make sure this is switched on, especially if
    you''re using experimental versions or non-stable releases of PHP, otherwise you
    may end up crashing your server once leaked memory has up all available space.
    error_reporting must be set to report warnings for this setting to apply.'
