  md: '# SAX, DOM and PHP


    4.3, the DOM extension has undergone substantial improvements, but be warned—it
    complies loosely with the official DOM specification and is missing true support
    for some important XML features, such as namespaces[8] and XML Schema[9]. With
    PHP 5, there are plans afoot to rework PHP''s XML tools, and they''re being discussed
    in the PHP development newsgroup[10]. For now, the DOM extension is usable—but
    not expect miracles.


    It''s also worth being aware that all the XML functionality provided by PHP''s
    extensions could also be implemented using PHP. For example, the eZ xml library[11]
    that comes with eZ is a more complete implementation of the DOM standard than
    that provided by the PHP 4.3 extension. PEAR::XML[13], meanwhile, provides a SAX
    API for parsing badly formed XML (such as HTML). Search around and you''ll find
    other classes, as PHP_XPath[14], which is an implementation of the XPath specification[15]
    in pure PHP.


    # XML and PHP Short Tags


    When you''re dealing with XML—in particular you''re constructing XML as strings—it''s
    a good idea to have short_open_tag set to Off in php.ini, or to use a .htaccess
    file with the command:


    ```

    php_flag short_open_tag off

    ```


    Otherwise, PHP will confuse XML processing instructions (e.g. <?xml ... ?> with
    short form PHP scripts <? ... ?> which can result in all sorts of parse errors.
    If you do this, you must ensure that all your PHP scripts use full tags <?php
    ?>.


    We''ll begin this chapter by understanding how we can parse XML documents with
    SAX and DOM and generate XML with DOM. We''ll then look at using XSLT with the
    Sablotron extension[16], and Web services in XML-RPC and SOAP. Note that a further
    of useful XML utilities for PHP can be found at http://phpxmlclasses.sourceforge.net.


