    \n| MD5 Digests |\n| MD5 is a simple message digest algorithm (often referred\
    \ to as one-way encryption) that translates any string (as a password) into one\
    \ short series of ASCII characters, called an MD5 digest. A particular string\
    \ will always produce the same digest, but it is practically impossible to guess\
    \ a string that will produce a given digest. By storing only the MD5 digest of\
    \ your users' passwords in the database, you can verify their login credentials\
    \ without storing the passwords on your server! The built-in PHP function md5\
    \ lets you calculate the MD5 digest of any string in PHP. |\n\nThe constructor\
