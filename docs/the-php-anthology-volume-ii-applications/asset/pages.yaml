    \ even begin to consider the times you suffered from the Internet down street,\
    \ the local library, and so. With this IP address becomes even more convoluted\
    \ when you take into account proxy servers, which act as \"middle men\" between\
    \ your browser and a Website, network address translation, and more. One thing\
    \ to be aware of that AOL uses a particularly bizarre mechanism; their members\
    \ are assigned a new IP address upon practically every request page, which basically\
    \ defies any IP-based security mechanism you might care to use (e.g., configuring\
    \ a user's session to a single IP address).\n\nThe $_SERVER['REMOTE_ADDR'] variable\
    \ tells you the nearest IP address to the Web browser (it will not show the local\
    \ address of the computer if it resides on a private network). What's important\
    \ to realize that this could be the case, a proxy server; you need to check $_SERVER['HTTP_X_FORWARDED_FOR']\
    \ to obtain the client's actual IP address. Of course, life is never that simple!\
    \ Depending on the type of proxy server clients, and they are using network address\
    \ translation, there are other variables you may need to consider, such as $_SERVER['HTTP_CLIENT_IP'],\
