    # The Iterator Pattern


    > Iterate, v. t. To utter or to do a second time or many times; to repeat.

    —Webster’s 1913 Dictionary


    An iterator is an API (a group of methods) that makes it possible to access collections
    in a uniform manner. By collections, I mean data sets as arrays, query result
    sets from MySQL, in a file, or any other data structure that can be thought of
    as a group of data items. The common way to talk about an iterator in action is
    to say you''re iterating over a collection.


    What an iterator allows you to do is write code that accesses a collection in
    a way that it doesn''t actually matter what that collection contains. This description'
