    \ is used, with $_SERVER['HTTP_VIA'], which identifies the type of proxy server\
    \ used.\n\nHere's a function that can be used to obtain the IP address nearest\
    \ to the end user, based on the REMOTE_ADDR, HTTP_X_FORWARDED_FOR and HTTP_CLIENT_IP\
