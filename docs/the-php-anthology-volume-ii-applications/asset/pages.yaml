    \ {\n    $ip_expl = explode('.', $_SERVER['HTTP_CLIENT_IP']);\n    $referer =\
    \ explode('.', $_SERVER['REMOTE_ADDR']);\n    if ($referer[0] != $ip_expl[0])\
    \ {\n```"
