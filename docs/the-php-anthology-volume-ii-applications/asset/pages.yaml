    \ If you're using a different table structure, you'll need to modify this method.\n\
    \nNote that we use both the login and email to identify the row, so it's a little\
    \ more difficult for other people to reset your members' passwords. Although there's\
    \ no risk in others stealing the new password (unless they have control over a\
    \ member's email account), it will certainly irritate people if their password\
    \ was being continually reset. Requiring both login name and email of the user\
    \ makes it a little more complex.\n\nOf the next two methods, addWords is used\
    \ to supply the class with an indexed array of words to build memorable passwords,\
    \ while generatePassword constructs a random password from this list, adding \"\
    separators\" that could be any number from 0 to 9, or an underscore character.\
    \ The password itself will contain two words chosen from the list, as well as\
    \ two random separators. The order in which these elements appear in the password\
    \ is also random. The passwords this system generates like \"7correct9computer\"\
    \ and \"48clothes,\" which are relatively easy for users to remember."
