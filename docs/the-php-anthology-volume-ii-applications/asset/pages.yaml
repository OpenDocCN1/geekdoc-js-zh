    $xsl = 'file://c:/htdocs/sitepoint/XML/articles.xsl';\",\n```\n\nNext, we instantiate\
    \ the XSLT processor with the xslt_create function:\n\n```\n// Instantiate the\
    \ XSLT processor\n$Xp = xslt_create();\n```\n\nThe xslt_process stylesheet transforms\
    \ the XML to HTML according to the template(s) in the stylesheets. Should anything\
    \ go wrong, we use the xslt_errno and xslt_error functions to access information\
    \ about what happened.\n\n```\n// Perform the XSL Transformation\n$result = xslt_process($xp,\
