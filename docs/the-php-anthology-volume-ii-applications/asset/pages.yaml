    \ exactly the same way as any PHP script used to deliver (X)HTML to a client browser.\
    \ That is, when an XML-RPC request is received as an HTTP POST request, the script\
    \ is executed, examining the incoming request and returning the appropriate response\
    \ in the same way a script might respond to a form. The only difference between\
    \ serving XML-RPC and displaying a normal Web page is that the client will not\
    \ be a Web browser; perhaps it's another Web server using an XML-RPC client to\
