- img_proc: true
  md: 'Once you''ve done all that, you''re ready to move on and use the package manager

    in one of its many incarnations.


    # The PEAR Package Manager


    Assuming you set PEAR up correctly, you can now use the command line interface

    to the PEAR package manager to install packages. For example, from the command

    line, type:


    ```

    pear install HTML_Common

    ```


    That will install the package HTML_Common from the PEAR Website. The

    package names for the command line are the same as those on the Website.


    The PEAR Package Manager uses XML_RPC to communicate with the PEAR

    Website. If you''re behind a proxy server or firewall, you will need to tell the
    PEAR

    domain of the proxy server with:


    ```

    pear config-set http_proxy proxy.your-isp.com

    ```


    To unset the variable at some later stage, simply use:


    ```

    pear config-set http_proxy ""

    ```


    Now to add QuickForm to the installed PEAR packages, you simply need to type:


    ```

    pear install HTML_QuickForm

    ```


    Should another release of QuickForm be made after you''ve installed it, you can

    upgrade the version with:


    ```

    pear upgrade HTML_QuickForm

    ```


    If, for some reason, you decide you don''t need QuickForm anymore, you can

    remove it using:


    ```

    pear uninstall HTML_QuickForm

    ```


    For a list of all PEAR commands, simply type pear.


    Now, if you don''t like command lines, there''s also an (experimental) Web-based

    front end to PEAR (as well as a PHP-GTK front end, which is beyond the scope

    of this discussion). To use it, you first need to install it from the command
    line'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# Appendix D: Working with PEAR


    (note that if you executed go-pear.php through your Web server, the Web-based
    front end is also installed for you). Type the following commands:


    ```

    pear install UserAgent_Detect

    pear install Pager

    pear install HTML_Template_IT

    pear install PEAR_Frontend_Web

    ```


    Note the first three packages are required by PEAR_Frontend_Web. With that done,
    you can launch the front end from your Web server using the following simple script:


    ```

    <php

    // Optional if include path not set

    # ini_set(''include_path'', ''c:\htdocs\PEAR'');


    require_once ''PEAR.php'';


    // For Windows users

    # $pear_user_config = ''c:\windows\pear.ini'';

    // For Unix users

    $pear_user_config = ''/home/username/pear/pear/PEAR/pear.conf'';


    $DHTML = TRUE; // Switch off for older browsers


    require_once ''PEAR/WebInstaller.php'';

    ?>

    ```


    # Installing Packages Manually


    It is possible to install packages manually (although this involves more work),
    but it''s important to watch the include paths carefully when doing so. First
    of all, create a directory that will be the base of all the PEAR classes you install.
    This directory must be in your include path. Next, install the main PEAR package[1]-download
    the latest stable version and extract it directly to the directory you''ve created,
    so that PEAR.php is in the root of the directory.


    Installing further packages can be completed in more or less the same fashion,
    but you need to be careful which directory you extract to. For example, looking
    at PEAR::DB, the main DB.php file goes alongside the PEAR.php file in the root
    of the PEAR class directory, while further PEAR::DB-related files go in the subdirectory
    DB. The best way to check is to look at the package.xml file that completes


    > [11] http://pear.php.net/package/PEAR'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'with every PEAR package. This contains an element called filelist, which lists

    all the files contained in the package and the location at which they should be

    installed. For each file, check the baseinstalldir attribute which, if specified,

    tells you where, relative to the root PEAR class directory, the file should be
    placed.

    The name attribute specifies the path and filename relative to the baseinstalldir

    (or just the root PEAR class directory if there''s no baseinstalldir attribute),

    where each file should be placed.'
