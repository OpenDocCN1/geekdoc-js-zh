  md: '# How do I protect my site from auto sign ups?


    you''re happy with QuickForm, you might want to split this check into a separate
    method that QuickForm can apply as a rule for each field in the form. This should
    reduce frustration when users find that the account name they chose already exists;
    QuickForm will generate a message to tell them what they did, while preserving
    the rest of the values they entered.


    If you plan to let users change their email addresses after accounts are created,
    you will also need to confirm the addresses before you store them in the appropriate
    records in the user table. You should be able to reuse the methods provided by
    the SignUp class for this purpose. You might even consider reusing the signup
    table to handle this; some modifications will be required to the confirm method
    to check if a record already exists in the user table, and if so, update instead
    of creating a new row. Be very careful that you don''t create a hole in your security,
    if you''re not checking for records in the user table, a user could sign up for
    a new account with details that matched an existing row in user table. You will
    then end up changing the email address of an existing user to that of a new user,
    which will cause some embarrassing moments at the very least.


    # How do I protect my site from auto sign ups?


    I hope you''ll never suffer the misfortune of having someone try to put your site
    out of action, but when you expose your application to what is, after all, a global
    network, you need to be prepared for trouble. It''s difficult to prevent malicious
    attacks against your site and still offer users an acceptable service—particularly
    if a malicious user simply decides to flood your site with requests for pages.


    Where user registration systems are concerned, one common method of attack has
    been to create "robots”(typically Perl or PHP scripts), which act as Web browsers
    and use the forms you''ve built for your registration system to swamp your database
    with false sign ups. Although you''ve built a registration system that requires
    email confirmation of the account, the confirmation process can also be built
    into the "robot,” assuming it has access to the account to which the email confirmations
    are sent. Both Hotmail and Yahoo!, many others have been stung by this in the
    past.


    The next level of protection is to introduce a mechanism that sorts the men from
    the ’! Thankfully, the human brain is still vastly more powerful than a com-'
