    Notice that all the code that appears after the PEARDDBAdapter is instantiated
    is exactly the same as it was when I used my MySQL server—the constructor arguments
    are same! All I needed to modify was two lines of code (the include and the object
    creation); the rest of my application could happily keep on running. Now, with
    the power of PEAR:DB at my disposal, I can modify my application to run on any
    database it supports.


    As you can see, the adapter pattern offers a powerful technique to help you use
    third party libraries for your own codewithout needing to rewrite anything. Adapters
    can be even useful if you''re writing brand new code that uses a third party library,
    as well to customize the API to your needs. The trick to using an adapter pattern
    is to find the commonalities between the API your code expects (or needs), and
    the API that the third party library provides, then use your adapter class as
    a translator between the two.


    > ⁴The practical extent of this portability can depend on other factors. For example,
    different databases support different forms of SQL. For example, the LIMIT 0,5
    in the query is not supported by most databases, although recent versions of PostgreSQL
    allow it.


