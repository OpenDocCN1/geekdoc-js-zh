  md: '# 4 Stats and Tracking


    Ever since Perl and CGI made their way onto the Internet, Webmasters have suffered
    an insatiable thirst for knowing who are visiting their site. Over time, gathering
    information about a site''s visitors has become a discipline in itself; today,
    tracking tools offered advanced features such as the analysis of visitors'' click
    paths through your site, and some even attempt to locate a visitor''s geographical
    location based on the details of his or her ISP. This area of Webmastership has
    also gained a reputation for being part of the murk side of the Internet, however,
    with advertising agencies using banner ads to monitor surfers'' movements across
    multiple sites, wherever the agencies'' banners are placed. There''s a fine line
    between gathering data in order to help improve a site for its visitors and spying;
    leave it up to you to make the value judgments.


    Building a system that tracks visitors and logs their progress through your sites
    can be extremely valuable from the perspectives of security and improving visitors''
    experience of the site. A tracking system can also help you determine the searches
    that brought visitors to your site, and identify sites that link to you, helping
    you to place the site where people will find it.


    In this chapter, we will look at the basics of storing visitor information with
    some simple PHP scripts, then defer to phpOpenTracker[1]. This excellent tracking
    tool offers some “state of the art” any good tracker should provide,


    > [1] http://www.phpopentacker.de/'
  merge: -1
  pgno: 239
