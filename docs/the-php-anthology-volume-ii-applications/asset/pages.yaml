- img_proc: true
  md: "There are a couple of factors that you should be aware of when considering\
    \ design patterns can be applied in PHP 4:\n\n+   Some of the problems the GoF\
    \ were aiming to address simply never raise their heads in the development of\
    \ Web-based applications for the Apache/PHP environment, where an application\
    \ remains memory-resident for only as long as it takes to build a Web page. The\
    \ Memento pattern is one example.\n\n+   PHP 4 doesn't support some of the features\
    \ found in other languages (e.g. Java), as static class member variables. As such,\
    \ trying to apply some patterns² in awkward workarounds that often cause more\
    \ problems than they solve. One of the main drivers behind PHP 5 was to make PHP\
    \ well suited to design patterns.\n\nEnough said. Time for some patterns!\n\n\
    # The Factory Method\n\nIn most programming languages that support the object\
    \ oriented paradigm, it's possible to use class methods or functions to create\
    \ and return new objects. example in PHP might be:\n\n```\n<?php\n// A PHP Function\
    \ which creates an object\nfunction &createSomeObject()\n{\n    return new SomeClass();\n\
    }\n\n// Get an instance of SomeClass\n$someObject = &createSomeObject();\n```\n\
    \nIt may be unclear why anyone would want to do what we've done in this example.\
    \ Rest assured that there are a number of specific problems that can be solved\
    \ with this approach, which is known as the factory method pattern. The following\
    \ situations and examples should make things clear.\n\nImagine that you're working\
    \ on an application. Within it, you create objects from a given class in many\
    \ places—including other classes. You're aware, however, that there may be a need\
    \ to use a different class at some future time. If you use a function or class\
    \ method to create the object for you, changing the class from\n\n> ²The Singleton\
    \ pattern, for instance."
  merge: -1
  pgno: 331
- img_proc: true
  md: "# Chapter 7: Design Patterns\n\nwhich that object is created will require you\
    \ to modify only the method that creates it.\n\nFor example, in Chapter I$ we\
    \ developed the class Auth, which creates an instance of the Session class:\n\n\
    ```\nclass Auth {\n    function Auth($db, $redirect, $hashKey, $md5 = TRUE) {\n\
    \        $this->db = $db;\n        $this->redirect = $redirect;\n        $this->hashKey\
    \ = $hashKey;\n        $this->md5 = $md5;\n        $this->session = &new Session();\
    \ // Session created\n        $this->login();\n    }\n```\n\nWhat happens if,\
    \ instead, we use a function createSession, to create the object for us? In that\
    \ case, we can replace the Session class with other class of a different name\
    \ without having to modify the Auth class:\n\n```\nclass Auth {\n    function\
    \ Auth($db, $redirect, $hashKey, $md5 = TRUE) {\n        $this->db = $db;\n  \
    \      $this->redirect = $redirect;\n        $this->hashKey = $hashKey;\n    \
    \    $this->md5 = $md5;\n        $this->session = &createSession(); // Fetch new\
    \ object\n        $this->login();\n    }\n```\n\nThis is particularly useful when\
    \ writing unit tests use mock objects (see Chapter 6). In this case, we can modify\
    \ the behavior of the createSession function in the test script so MockSession\
    \ is used by Auth, rather than the real Session class.\n\nAnother problem to which\
    \ the factory method can provide a solution occurs when the choice of class will\
    \ depend on runtime circumstances that you can't predict in advance. You might\
    \ wish to avoid writing conditional logic at the point at which the object is\
    \ created, in order to keep the code maintainable and allow the same conditions\
    \ to be used elsewhere in your application. Using a factory method, you can separate\
    \ the task of instantiating the objects from the code that needs to use them.\n\
    \n314"
