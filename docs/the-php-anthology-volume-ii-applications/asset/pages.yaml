    # How do I build a user registration system?


    Having an authentication system is fine, but how do you fill it with users in
    the first place? If only yourself and a few friends access your site, you can
    probably create accounts for all users through your database administration interface.
    However, for a site that''s intended to become a flourishing community to which
    anyone and everyone is free to sign up, you''ll want to automate this process.
    You''ll want to allow visitors to register them, but you''ll probably still need
    some level of "screening" so that you have at least a little information about
    the people who have signed up for (such as a way to confirm their identity). A
    common and effective screening approach is to have the registrants confirm their
    email address.


    The purpose of the screening mechanism is to give you the ability to make it difficult
    for users who have "broken the rules" and lost their account privileges to create
    new accounts. You have (at least one) of their email addresses—if they try to
    register again using that address, you can deny them access. Be warned, though;
    a new type of Internet service is becoming popular. Pioneered by Mailinator[5],
    these services provide users with temporary email addresses they can use for registrations.


    Here, we will put together a registration system that validates new registrants
    using their email addresses; they''ll receive an email that asks them to confirm
    their registration via a URL.


