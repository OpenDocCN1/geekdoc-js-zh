    # How do I exclude search engines from my logs?


    Chances are, once you''re over the novelty of having your Website spied by a search
    engine robot, you won''t want the logs of the robot''s movements cluttering up
    your Weblogs. Although you could filter out the logs you don''t want to see, why
    waste valuable disk space with data you don''t need? A mechanism is needed to
    tell the logging engine not to log, based on the user agent supplied by the robots.


    Handling with phpOpenTracker is, as always, wonderfully simple. Just head to your
    phppopentracker.ini file and edit the following:


    ```

    ; Locking

    locking = On

    log_reload = Off

    ```


    With logging switched on, phpOpenTracker watches for robots and excludes them
    from the database. Note also the log_reload setting here, which is used to control
    whether refreshed (reloaded) pages are logged.


    What actually determines the robots that phpOpenTracker ignores is defined by
    the file lock.ini, found in the same directory as phppopentracker.ini. By default
    it''s named lock.ini.dist, so you''ll need to rename it. The content is a list
    of user agents used by search engine robots. For a useful list of further robots,
    try http://www.jafsoft.com/searchengines/webbots.html.'
