  md: "# Chapter 6: Development Technique\n\n```\nif ($color == 'blue') {\n    return\
    \ TRUE;\n}\nreturn FALSE;\n}\n\n// The fast way - test for red\nfunction isBlueFast($color)\
    \ {\n    if ($color != 'blue') {\n        return FALSE;\n    }\n    return TRUE;\n\
    }\n```\n\nTo start with, use Xdebug to debug profiling. Using the $colors array,\
    \ we have some sample data over which we can iterate to prove the point; note\
    \ that most of the elements of the array have the value 'red', so this will be\
