    # Figure 2.8. Give Me Back by my XPath Command Line!


    # Latest Articles


    | Give me back my MySQL Command Line! | by KevinY |

    | --- | --- |


    One of the essential skills you must acquire to become proficient in the development
    of PHP/MySQL driven websites is a good understanding of Structured Query Language
    (SQL). In Chapter 2 of my article series, Build your own Database Driven Website
    using PHP & MySQL I focus on getting beginners comfortable with typing queries
    on the MySQL command line.


    A common problem faced by beginners starting with MySQL is that most Web hosts
    do not provide shell access to MySQL, nor do they allow remote connections to
    their MySQL servers. The result is that the MySQL command line is not available
    to most of Web hosts. To learn SQL, it is easier to install a MySQL server on
    your own computer just to have a command line to play with.


    In this article, I will provide an alternative -- a Web-based MySQL command line
    written in PHP, which will let you type SQL queries into a text field and view
    the results, or in the case of error, any error messages generated.


    We''ll look at each component of the script separately, and I will provide the
    complete code at the end of the article, so focus on the code segment at hand,
    and how we will see it fits together at the end.


    In other words, we can use XPath to ''mine'' an XML document in pretty much the
    same way we use SQL to ''mine'' a database.


    # XQuery Lite


    If you need more power for accessing XML than XPath provides, you might consider
    XQuery Lite[36].


    > [36] http://phpxmlclasses.sourceforge.net/class_xquery_lite.html'
