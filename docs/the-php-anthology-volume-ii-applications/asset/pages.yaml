  md: "# Chapter 6: Development Technique\n\nthat, instead of accessing session data\
    \ from the local file system, it shares session data with the help of PHP's Msession\
    \ extension[2].\n\nSecondly, N-Tier aims to make developers independent of specific\
    \ vendors, other than the vendor of your programming language (the PHP Group and\
    \ Zend). It should be possible to swap MySQL for another database server with\
    \ minimal impact on your query. It should also be possible for users running over\
    \ Internet Explorer to have the same experience as IE users browsing your site.\
    \ Note that database abstraction layers like PEAR:DB go some of the way to making\
    \ you independent of a specific database, but vendors being vendors, all have\
    \ their own implementations of SQL, to “keep the punters coming back for more.”\
    \ In some cases, the nonstandard syntax, as MySQL’s LIMIT clause is so tempting\
    \ to ignore, but be aware that these will come back to you if you want to move\
    \ another database at some point in the future.\n\nThirdly, and perhaps most importantly,\
    \ is that the N-Tier model can help developers well structured, flexible applications\
