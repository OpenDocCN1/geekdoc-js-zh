  md: 'This tutorial puts XML-RPC into context with Web services and provides some
    simple examples in PHP.


    +   - A Busy Developer’s Guide to SOAP 1.1: http://www.soapware.org/bdg


    This article provides a quick tour of SOAP, which should prove familiar to those
    who are comfortable with the XML-RPC specification.


    +   - A Busy Developers Guide to WSDL 1.1: http://radio.weblogs.com/010167%stories/2002/02/15/aBusyDevelopersGuideToWsdl11.html


