  md: '# Chapter 2: XML


    can be added to any Gecko-based browser (such as Firebird). A quick tutorial on
    using the DOM Inspector is available[2].


    # SAX, DOM and PHP


    First, there''s some jargon you need to be clear about. XML documents: There are
    two widely used approaches to parsing XML documents: the Simple API for XML[3]
    (SAX) and the Document Object Model[4] (DOM).


    Essentially, the SAX approach is to read an XML document from top to bottom, and
    it counts each element, to construct a list that has been provided (by you, the
    PHP developer) in order to decide what action to take. In a more general sense,
    SAX looks at an XML document as a sequence of events, each event being passed
    to an event handler for action; we''ll see how this works shortly.


    In contrast, the DOM approach is to read the document into memory, and provide
    an API by which a program (such as a PHP script) can access the elements of the
    document.


    For simple tasks, SAX is the preferred choice. The code involved tends to be simpler,
    and as it works with one element at a time, it can handle very large documents.
    PHP''s SAX extension is built into PHP by default and is based on James Clark''s
    most respected Expat parser[5]; it provides a solid tool for use in your PHP scripts.
    Ample details of PHP''s SAX functions may be found in the PHP Manual[6].


    DOM is better suited to complex tasks, as it provides mechanisms that help you
    get straight to the parts of an XML document you need. DOM makes it possible to
    generate XML, either by making changes to an existing document that you''ve loaded
    or by creating one from scratch. The downside of DOM is that the amount of memory
    it consumes is directly proportional to the size of the XML document, as it must
    keep a complete record of the document structure and content while you work on
    it. PHP''s DOM extension has historically been one of its weak points, suffering
    from memory leaks in older versions (pre-4.2), and is still only partially complete.
    The PHP Manual[7] contains the ominous "This extension is EXPERIMENTAL." With
    PHP


