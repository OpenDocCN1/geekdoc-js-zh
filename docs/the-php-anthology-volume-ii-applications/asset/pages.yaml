  md: "# Chapter 1: Access Control\n\n# How do I deal with members who forget their\
    \ passwords?\n\nIn the solution, I was happy to explain just how great human beings\
    \ are in comparison to computers. Unfortunately, though, we have a tendency to\
    \ “age out” important information such as the password we need to log into a site.\
    \ A feature that allows users to retrieve forgotten passwords is an essential\
    \ time saver. Overlook this, and you can expect to wait a lot of time changing\
    \ passwords for people who have forgotten them.\n\nIf you encrypt passwords in\
    \ your database, you’ll need a mechanism that generates a new password that, preferably,\
    \ is easy to remember. If you’re storing passwords as-is, without encryption,\
    \ it’s probably acceptable to send the password to the user’s registered email\
    \ address that you’ve already confirmed as is more reliable than the “Secret Question”\
    \ approach. This common tactic asks users simple questions to refresh their memories,\
    \ as, “Where were you born?” and “What’s your date of birth?” Just ask yourself\
    \ how many organizations, both on and offline, you’ve given that information.\
    \ Some applications, such as forums, even make your birthday available for all\
    \ to see, should you provide it. Details like this may well be common knowledge.\n\
    \nTo solve the problem, we will build a general AccountMaintenance class, which\
    \ will do some of the maintenance work for us, then supply it with the information\
    \ it needs to fetch an unencrypted password, or generate a new (memorable) password.\
    \ The typical approach used to generate memorable passwords is inspired by the\
    \ Secure Memorable Password Generator found at Codewalkers.com[8].\n\n# Password\
    \ Reminder\n\nStarting with the simple password fetching code, the AccountMaintenance\
    \ class begins with the usual constants, which allow it to be applied to a different\
    \ table structure if needed. Note, in particular, the USER_LOGIN_VAR constant,\
    \ which must contain the same value as that defined by the Auth class.\n\n```\n\
    <?php\n/**\n * Constants which define table and column names\n```\n\n[8] codewalkers.com/seecode/52.html\n\
    \nFile: AccessControl/AccountMaintenance.php (in SPLIB) (excerpt)"
