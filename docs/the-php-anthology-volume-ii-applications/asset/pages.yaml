  md: '# Chapter 4: Stats and Tracking


    # Logging Strategy


    There are a few practical tips you should be aware of using PHP to log traffic
    from your site. These points usually become obvious only after you''ve gathered
    traffic information for a while.


    First of all, be aware that tracking can generate a lot of data. A visitor who
    views five pages on your site may generate at least five new rows in your database—possibly
    more in other tables, depending on your implementation. Make sure before you “go
    live” with any logging system that you also have a mechanism in place for archiving
    and purging old data, otherwise you''ll quickly have a massive database on yours.
    In practice, this might mean something like a cron job, which executes a command
    line PHP script on a regular basis, the script “dumping” data older than a certain
    age to some useful file format (e.g. XML), then purging it from the database.
    You can then move the files off your server for digestion at your leisure.


    The data itself can be categorized as raw data, as an IP address, hostname, or
    a user agent, or derived data, as the identity of a visitor''s browser and operating
    system, derived from the user agent, or a daily total of visits from a particular
    query, based on the host name. It may be a wise decision to store the raw data
    in one table, then populate other, related tables with the derived data. As the
    size of your logs grows, using PHP or MySQL to re-calculate on the raw data to
    generate derived data every time you request the report will result in a long
    wait, not to mention the process overhead it will place on your server. It may
    also be worth rewarding the building of a report from your log data as a task
    that''s performed “offline”—on your desktop PC, for example. If you''re feeling
    adventurous, perhaps building a SOAP server (see Chapter 2) on your site from
    which you can fetch the data, and then store and analyze it.


    How you capture the data itself requires a little consideration. One approach
    is to simply include in every page you wanted a logging PHP script that stores
    usage in the database as each page is viewed. If you use this approach, you''ll
    need to take care not to slow your site with logging processes and queries. In
    other words, it''s best to store the raw data, and leave the processing associated
    with derived data generation until later—to be handled by a cron job, perhaps,
    or with the first time a report on the data is requested.


    An alternative approach is to get the visitors'' browsers to execute the logging
    script separately from the page itself, meaning the data occurs independently
    of the main script. “How?” you may ask. In Volume 1, Chapter 9,


    226'
  merge: -1
  pgno: 244
