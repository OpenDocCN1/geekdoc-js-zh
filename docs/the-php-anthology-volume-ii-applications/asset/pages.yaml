    \ stating that the array key didn't exist when performing the third check on particular\
    \ PHP configurations (see Volume I, Chapter 10). The third check ensures that\
    \ the user name and password combination in the $users array matches the details\
    \ sent by the Web browser.\n\nNote that we could also have checked the user name\
    \ and password against a database—something we'll look at in “How do I authenticate\
    \ users with sessions?”\n\n# When to Send Headers\n\nIn PHP, the moment your script\
    \ outputs anything that's meant for display, the Web server finishes sending the\
    \ headers and begins to send the content itself. You cannot send further HTTP\
    \ headers once the body of the HTTP message—the Web page itself—has begun to be\
    \ sent. This means that if you use the header function or session_start after\
    \ the body has begun, you'll get an error message like this:\n\n> Warning: Cannot\
    \ add header information - headers already sent by output started at..."
