  md: "# Chapter 2: XML\n\n```\n$wsdl = new SOAP_WSDL(\n'http://live.capsencience.com/wsdl/GlobalWeather.wsdl');\n\
    \n// Get the proxy class for the service\n$stationInfo = $wsdl->getProxy();\n\
    ```\n\nThis time, what we get back in the stationInfo variable is an object we\
    \ can use immediately. Note also that we've made the Session class available.\
    \ One trick when dealing with Web services is to store fetched data that we can\
    \ reuse in a local cache; this avoids the performance delay involved in fetching\
    \ the data from the remote site for each page request.\n\n```\n// If the Countries\
    \ session variable exists, use it\nif ($session->get('Countries')) {\n  // Get\
    \ the data from the local session variable\n  $countries = $session->get('Countries');\n\
    } else {\n  // Otherwise get a list of countries from the service\n  $countries\
    \ = $stationInfo->listCountries();\n  $session->set('Countries', $countries);\n\
    }\n```\n\nHere, we attempt to use a session variable to get the list of countries,\
