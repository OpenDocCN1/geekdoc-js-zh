    # Caching Function Calls


    In Chapter 2, we looked at accessing remote services with SOAP and XML-RPC. Because
    Web services are accessed over a network, it''s often a very good idea to cache
    results that can be fetched lately, rather than repeating the same slow request
    multiple times. A simple approach might be to use PHP sessions, as we considered
    in that chapter, but this solution operates on a per visitor basis, the opening
    requests for each visitor will still be slow. This is where Cache_Lite can come
    in very handy.


    # PEAR uses Cache-Lite


    > > The PEAR Web installer (see Appendix D) takes advantage of Cache-Lite by caching
    the XML-RPC requests it makes to the PEAR Web server.


    How do I consume SOAP Web services with PHP? In Chapter 2, we built a client for
    a SOAP Web service based on its WSDL file; the service provided weather information
    for airports around the world. Here''s the code that fetched the data from the
    remote server:


    ```

    $countries = $stationInfo->listCountries();

    ```


    and


    ```

    $country = $stationInfo->searchByCountry($_GET[''country'']);

    ```


    In both cases, these calls correspond to a request for data that''s made over
    the network. Using Cache_Lite_Function, we could cache the results that the data
    returned from the service could be reused; this would avoid unnecessary calls
    and significantly improve performance. Note that we''re focusing on only the relevant
    code here. At the top, we include Cache_Lite_Function:


    ```

    // Include PEAR::Cache_Lite_Function

    require_once ''Cache/Lite/Function.php'';

    ```


