  md: "# Chapter 7: Design Patterns\n\n```\n$this->notifyObservers('deleted');\n}\n\
    ```\n\nThe Article class is the observable, inheriting from the Observable class.\
    \ It provides two (skeleton) methods, which publish and delete an article. After\
    \ the database update has been performed, each of these methods calls the notifyObservers\
    \ method, passing an argument to indicate to the observers of the event.\n\nHere\
    \ are the observer classes:\n\n```\nclass Cache extends Observer {\n    function\
    \ update(&$source, $arg) {\n        switch ($arg) {\n            case 'published':\n\
    \            case 'deleted':\n                echo 'Refreshing cache<br />';\n\
    \                break;\n        }\n    }\n}\nclass Subscribers extends Observer\
    \ {\n    function update(&$source, $arg) {\n        switch ($arg) {\n        \
    \    case 'published':\n                echo 'Notifying subscribers by email<br\
    \ />';\n                break;\n        }\n    }\n}\nclass RSSFeed extends Observer\
    \ {\n    function update(&$source, $arg) {\n        switch ($arg) {\n        \
    \    case 'published':\n            case 'deleted':\n                echo 'Updating\
    \ the RSS Feed<br />';\n                break;\n        }\n    }\n}\n```\n\nFile:\
    \ 12.php (excerpt)\n\n350"
