  md: '# What information can I gather about my site''s visitors?


    # The Golden Rule


    > Remember the golden rule: never trust anything from the browser. There are ways
    to "spoof" almost anything that comes from a browser.


    Be especially wary of the $_SERVER[''HTTP_REFERER''] value. I''ve seen some people
    build security mechanisms based around this—a very bad idea.


    Also be aware, when dealing with these variables, they are only created by PHP
    so you may need to be careful to check that they exist in your code before you
    do anything with them. In the example above, we used the error suppression operator
    @ to handle this.


    Given the basic information from the above script, we already have a foundation
    for building a stats and tracking system; we can store this information in a database,
    then use it to display a report of what''s happening on the site.


    The hostname of the visitor, obtained with the gethostbyaddr function(), can tell
    you the domain from which the visitor came. Running this on my own machine, I''m
    told that localhost is the host, but on a line you''ll get values such as ottawa-hse-ppp26908.symatico.ca.
    .ca at the end tells us which visitors came from Canada, so we could build a report
    that tells us which countries visit us from, with the exception of the .com, .net
    andorg domains, which tend to be used internationally.


    about the browser. In the example above, you''ll notice this value contains information
    about both the Web browser (Opera 7.01 [en]) and the operating system (Windows
    NT 5.1, which is Windows XP advertised itself). Of course, if you''ve built a
    site that''s compatible with all browsers, you won''t need to worry about this
    information...


    $_SERVER[''REQUEST_URI''] data can be used to determine exactly which page user
    was viewing. This is important with PHP, where the difference between URLs like
    index.php?view=news and index.php?view=articles can be very significant. This
    is because of click path analysis.


    $_SERVER[''HTTP_REFERER''] tells you which visitor followed a link to the current
    page. Although this information can be relied upon, it generally provides useful
    data about sites that are linked to yours.


    > Please note that gethostbyaddr is quite slow as functions goes, as it must connect
    another server to perform a reverse DNS lookup. Using this function is one way
    to quickly bog down a speedy server.'
