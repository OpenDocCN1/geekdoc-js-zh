  md: '# 3 Alternative Content Types


    As you''re probably aware, (X)HTML is not the only format in which you can display
    content on the Internet. Aside from .gif, .jpeg and .png there are a number of
    other alternative content types which have proven themselves useful on the Web,
    including Adobe''s PDF format and Macromedia''s Flash, as well as alternative
    XML formats such as SVG (Scalable Vector Graphics), WML (wireless markup language),
    and XUL (Mozilla s XML User interface Language). Each has its own arena, through
    which it can enhance your Website and provide visitors with an alternative experience.


    The subject of this chapter is using PHP to render such formats, perhaps as an
    alternative or in addition to your existing (X)HTML based content. What this chapter
    should also emphasize is that using classes and layering in your applications
    can help you add new functionality to your site while taking advantage of existing
    code.


    # How do I render PDF documents with PHP?


    Adobe''s PDF format has established itself as the facto standard content type
    for displaying documents in a predictable form online. Not all users like to read'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Chapter 3: Alternative Content Types


    long articles on a computer monitor, and PDF provides content in a form that''s
    easily printed.


    PHP has two extensions (PDFlib[1] and ClipPDF[2]) that make it possible to render
    PDF documents, but unfortunately, both are commercial and require the payment
    of some kind of license fee if you''re using them in a commercial application.
    This means many hosts don''t support them, and as a spoilt PHP coder who always
    wants something for nothing, I''m not going to use them, either.


    Instead, I''m going to work with R&OS PDF Class[3], a PDF rendering class written
    purely in PHP. R&OS PDF is one of two respected PDF generating libraries written
    in pure PHP, the other being PDF[4]. The drawback to using it is that it takes
    a long time to render the PDF and you may find better maturity and features in
    one of the extensions. Yet, both PHP libraries are still very capable of rendering
    an attractive "printable version" of your content, and with a little cunning,
    as caching the rendered PDF file, the performance can be negated.


    # PDF To Go...


    The R&OS PDF library is a truly outstanding piece of open source code. It''s a
    true credit to the author, Wayne Munro, that he''s been so generous as to allow
    others to use for free. The version used here is 0.9, and although it''s not yet
    a full release, it''s very stable and really lacks a few "nice to have" features
    such as PDF bookmarks. Otherwise, it provides a powerful and fairly friendly interface
    for creating documents, including the ability to add images, links, shapes, and
    much more, not to mention encryption, which requires the reader to provide a password
    in order to view the document. R&OS PDF has everything you need to render PDF
    "on the fly" with PHP.


    The documentation provided with the library is very thorough (and in PDF format,
    normally). Here, we''ll concentrate on an example that''s specifically geared
    to rendering examples; (you could write a lot about this class), but detailed
    enough to get you started and referring to the documentation for further help.


    Be warned building a PDF document with this class takes some patience, you''ll
    need to position some parts of the page (usually, the content you


