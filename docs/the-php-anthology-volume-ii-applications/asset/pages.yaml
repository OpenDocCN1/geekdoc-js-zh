    \   $this->newItem = TRUE;\n    }\n}\n/**\n * Handles character data\n * @param\
    \ resource instance of PHP SAX XML\n * @param string element name\n * @return\
    \ void\n * @access private\n */\nfunction data($sax, $data)\n{\n    if ($this->newItem)\
    \ {\n        switch ($this->element) {\n            case 'TITLE':\n          \
