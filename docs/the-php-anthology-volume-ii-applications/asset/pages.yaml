  md: '# Preface


    If I had one goal in mind while writing The PHP Anthology, it was to demonstrate
    how easy it is to create intricate and powerful Web applications with an object
    oriented approach. In many cases, the more common procedural approach would result
    in unmanageable and bug-ridden "spaghetti code."


    In The PHP Anthology, Volume I: Foundations, I laid the groundwork by introducing
    that approach and demonstrating its application to some relatively simple issues
    in Web development. With Volume II, I hope to blow your socks off by tackling
    some traditionally complex problems with those same principles—to great effect.


    In examining the solutions here, you''ll see putting together your application
    with well designed classes is much like stacking building blocks, each fitting
    atop the other. Thanks to the principles of object oriented programming (OOP),
    different "blocks" of code needn''t be concerned with the specifics of the other
    blocks in the structure.


    One particular example in Chapter 3 looks at converting HTML content to Adobe''s
    Portable Document Format (PDF), using no less than eight separate classes in conjunction
    to fetch content from a database, parse the HTML, and finally, output involves
    a number of steps, but, by breaking it into manageable components in the form
    of classes, the complexity is reduced to the simple interactions between them.


    Other issues tackled in this volume, either head-on, or as a side-effect of specific
    solutions, include:


    +   - Layered application structure and the principles of N-Tier design


    +   - Providing and consuming Web services using XML-RPC and SOAP


    +   - Professional development techniques, such as API documentation and unit
    testing


    +   - Software design patterns, and how to apply them in PHP


    When dealing with these more advanced subjects, my goal is not to provide all
    the answers (many are worthy of books in themselves), but to open doors to new
    concepts for you to explore further on your own.'
  merge: -1
  pgno: 13
