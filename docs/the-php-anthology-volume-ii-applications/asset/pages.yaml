  md: "# Chapter 1: Access Control\n\ninclude the script that nullifies the effect\
    \ of magic quotes (see “How do I write portable PHP code?” in Volume I, Chapter\
    \ 1).\n\nLet’s now look at the methods that login uses.\n\n```\n/**\n * Sets the\
    \ session variables after a successful login\n * @return void\n * @access protected\n\
    \ */\nfunction storeAuth($login, $password)\n{\n    $this->session->set(USER_LOGIN_VAR,\
    \ $login);\n    $this->session->set(USER_PASSW_VAR, $password);\n\n    // Create\
    \ a session variable to confirm sessions\n    $hashKey = md5($this->hashKey .\
    \ $login . $password);\n    $this->session->set('login_hash', $hashKey);\n}\n\
    ```\n\nThe storeAuth method is used to add the user name and password to the session,\
    \ with a hash. This is comprised of a seed value defined using the Auth class\
    \ (remember the $hashKey parameter required by the constructor?), as well as the\
