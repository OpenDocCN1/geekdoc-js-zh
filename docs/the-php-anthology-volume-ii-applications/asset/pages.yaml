  md: '# Installation Issues


    PHP''s XML-related functionality relies on a number of third party, open source
    libraries that must be available on your system in order for you to be able to
    use the PHP XML extension.


    The XML extension, which implements SAX, is distributed with PHP by default, and
    to use it, all you need to do is make sure the required third party libraries
    are available (see below).


    The DOM extension has undergone many changes of late, and I can only recommend
    it if you''re working with PHP 4.3 or later. Do not expect the examples in this
    chapter to work 100% correctly on older versions. Support among Web hosts is limited
    for the time being, as are sufficiently up to have installed the latest version
    of PHP on their servers and also to have the DOM extension. However, if you do
    some research, you might find someone who has it. This situation will likely have
    improved by the time you read this, as hosting companies strive to catch up with
    the latest in PHP. Using DOM on your own installations requires you to explicitly
    tell PHP to use the extension in php.ini for Windows-based systems, or at compile
    time on Unix-based systems.


    The XSLT extension is, rarely installed by most shared Web hosting companies;
    it is a shame, as there are a number of noteworthy PHP projects, such as Popoon[18]
    and Krysalis[9], which rely on it. Setting up it requires you explicitly tell
    PHP to use it in php.ini on Windows-based systems, or at compile time on a Unix-based
    system.


    If you''re using a Unix-based system, such as Linux, the XML extensions will require
    compilation of the relevant third party libraries. In some cases, such as Expat,
    they may already be compiled and available in your distribution. Be sure to consult
    the PHP manual to find the relevant pages on XML[20], DOM XML[21] and XSLT[22],
    which provide detailed instructions for setting them up on Unix-based systems.


    To set up the XML extensions on Windows, you''ll need to perform the following
    steps:


    +   [18] http://www.bitflux.ch/developer/cms/popoon.html

    [19] http://www.interakt.ro/products/Krysalis/

    [20] http://www.php.net/xml

    [21] http://www.php.net/domxml

    [22] http://www.php.net/xslt'
