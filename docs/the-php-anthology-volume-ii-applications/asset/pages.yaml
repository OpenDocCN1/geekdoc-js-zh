  md: '# Appendix A: PHP Configuration


    # Table A.1. Key Security and Portability Settings


    | Setting | Notes |

    | --- | --- |

    | register_globals (default: off) | Automatically creates global variables from
    incoming HTTP request variables, as GET and POST. For security and portability,
    it is highly recommended that you switch this off. See http://www.php.net/register_globals
    for more details |

    | magic_quotes_gpc (default: off) | Automatically escapes quotes in incoming HTTP
    request variables with a backslash, helping preventing SQL injection attacks.
    If you know it''s usually better to switch this functionality off and handle this
    escaping when inserting into a database, given the problems this feature can cause
    you with, as well as the performance overhead they introduce. See Volume I, Chapter
    1 for information on making your scripts compatible with this feature |

    | call_time_pass_reference (default: off) | Allows you to use variable references
    at call time (e.g. htmlspecialchars($string)). To keep code clean and understandable,
    and to ensure portability, keep this functionality switched off |

    | short_open_tag (default: on) | Allows you to start a block of PHP code with
    <? instead of <?php. Also lets you write out PHP expressions with <?= is identical
    to <?php echo. While convenient, these shortcuts are not XML compliant, and can
    cause the PHP processor to be confused when it encounters XML processing instructions
    such as <?xml version="1.0"?>. Many people have short_open_tag switched off, so,
    for maximum portability, avoid the shortcuts and switch this feature off during
    development. |'
