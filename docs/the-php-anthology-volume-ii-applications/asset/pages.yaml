    Each observer provides an update method that''s called by the observable when
    the notifyObservers method is used. Within each update method, the observer decides
    what to do next based on the argument received from the observable. Note that
    the Subscribers class reacts only to the ''published'' argument, because we don''t
    want subscribers notified if an article is deleted. RSSFeed and Cache, respond
    to both the ''published'' and ''deleted'' states.


