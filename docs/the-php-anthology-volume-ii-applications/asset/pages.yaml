    The difficult part of dealing with class API documentation is that, if you''re
    uncertain of OOP in PHP, it may make you more confused than enlightened. API documentation
    does assume a general knowledge of the classes and objects (so make sure you read
    Volume I, Chapter 2), but you don''t need an OOP guru to benefit from a class
    someone else has written.


    Once you''ve grasped the basics of OOP, the next step is to understand how classes
    are normally depicted in API documentation. In Figure 6.4 above, for example,
    notice the lines connecting the DoesSomething class to the Something class. This
    represents the fact that DoesSomething extends Something (i.e. it’s a subclass
    of Something).


    Also, the API documentation describes class methods similarly to the way functions
    are explained in the PHP manual. The getString method in my DoesSomething class
    would be described with a signature like this:


    ```

    string getString(boolean $specialChars = false)

    ```


    The word "string" identifies the type of data the method returns. The information
    inside the parentheses tells us we can pass a Boolean value (TRUE or FALSE) as
    an argument to this method, but that the argument has a default value of FALSE.


    # Private, Protected and Public


    In programming languages like Java and C++, it''s common to define class methods
    and member variables as private as protected (where Java is concerned). This tells
    a compiler that any code that accesses object instances of the class is not allowed
    to use these methods or variables directly. Attempts to do so will generally generate
    some kind of error at compile time. This enforces the notion of encapsulation
    that''s advocated by the object oriented'
