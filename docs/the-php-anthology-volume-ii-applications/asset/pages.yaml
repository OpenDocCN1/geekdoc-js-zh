  md: "# Chapter 2: XML\n\nThe spt:body is handled as a special case in the switch.\
    \ Because the content of the spt:body will be a mix of text and XHTML, and we\
    \ want to preserve the XHTML, we need to use the dump_node method of PHP's DomDocument\
    \ class, which converts a given node into an XML string. Strictly speaking, this\
    \ method is not part of the W3C DOM specification, but as this demonstrates, life\
    \ would be much more difficult without.\n\nThe final section of the switch retains\
    \ all the remaining child nodes of spt:article equals. It stores their contents\
    \ in the $article array, to be placed in an Article object object the next time\
    \ a spt:article tag is encountered.\n\nAfter the switch, we add the final article\
    \ (if any were found) into the array, as it will not be caught by the start of\
