    \nWebpack 通过多种策略对代码拆提供了内置支持，使其在现代 JavaScript 应用中的实现变得更加简单。两种常用的策略是动态导入（dynamic\
    \ imports）和分块提取（split chunks）。\n\n## 动态导入\n\n动态导入允许你在运行时异步加载模块，而不是将它们包含在初始包（bundle）中。对于加载那些在特定操作发生（如点击按钮或导航到不同路由）之前才需要的组件或库，此功能特别有用。\n\
