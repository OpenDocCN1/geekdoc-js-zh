    which chunks are being loaded in your application.


    #### Split Chunks


    Webpack''s SplitChunksPlugin is another powerful feature that enables automatic
    code splitting. It analyzes your dependency graph and identifies opportunities
    to extract common code into shared bundles, reducing duplication across your application.


