    \  \"browsers\": [\"> 0.25%\", \"not dead\"]\n    }\n  }\n]\n```\n\n在此示例中，配置目标针对市场份额超过\
    \ 0.25% 的浏览器，同时排除了化的浏览器。Babel 将自动应用适当的转换以确保与这些环境兼容。\n\n## 将 Babel 与 Webpack 集\n\
    \n设置 Babel 后，下一步是将其与你的 Webpack 配置集成。打开你的 `webpack.config.js` 文件并修改模块部分以包含 Babel\
    \ loader：\n\n```javascript\nmodule: {\n  rules: [\n    {\n      test: /\\.js$/,\n\
    \      exclude: /node_modules/,\n      use: {\n        loader: 'babel-loader',\n\
    \      },\n    },\n  ],\n}\n```\n\n此规则告诉 Webpack 使用 `babel-loader` 处理所有 `.js`\
    \ 文件（排除 `node_modules` 中的文件）。现在，当你运行 Webpack 时，它会在打包之前通过 Babel 对你的 JavaScript\
    \ 文件进行转译。\n\n## 使用额外的 Babel 插件\n\nBabel 的模块化设计允许你通过各种插件扩展其功能。虽然 `preset-env` 涵盖许多许多功能，但你可能会遇到需要启用特定功能或优化的情况。例如，如果你想使用类属性（class\
    \ properties），可以添加 `@babel/plugin-proposal-class-properties` 插件。\n\n运行以下命令安装插件：\n\
    \n```bash\nnpm install --save-dev @babel/plugin-proposal-class-properties\n```\n\
    \n然后，更新你的 `.babelrc` 文件以包含该插件：\n\n```json\n{\n  \"presets\": [\"@babel/preset-env\"\
    ],\n  \"plugins\": [\"@babel/plugin-proposal-class-properties\"]\n}\n```\n\n现在，你可以在代码中使用类属性：\n\
    \n```javascript\nclass MyClass {\n  myProperty = 'Hello, World!';\n}\n```\n\n\
    Babel 将将此语法转译为兼容的 JavaScript。\n\n另一个实用的插件是 `@babel/plugin-transform-runtime`，它通过重用\
    \ Babel 的辅助函数来减少输出代码中的重复。安装它请使用：\n\n```bash\nnpm install --save-dev @babel/plugin-transform-runtime\n\
    ```\n\n然后，将其添加到 Babel 配置中：\n\n```json\n{\n  \"presets\": [\"@babel/preset-env\"\
    ],\n  \"plugins\": [\n    \"@babel/plugin-transform-runtime\",\n    \"@babel/plugin-proposal-class-properties\"\
    \n  ]\n}\n```\n\n通过整合这些插件，你可以充分利用现代 JavaScript 特性，同时保持对广泛环境的兼容性。\n\n## 使用 Babel\
    \ 的优势\n\n将 Babel 集成到你的开发工作中有许多显著优势。首先，它允许你使用最新的 JavaScript 特性而无需担心浏览器兼容性。这导致了更整洁、更易维护的代码，因为开发者可以使用具表现力且更容易处理的现代语法和结构。\n\
    \n使用 Babel 还能促进应用程序中代码的一致性。通过标准化整个代码库使用的 JavaScript 版本，你可以最大限度地减少由于不同文件语法差异引起的差异和潜在问题。这种一致性增强了团队成员之间的协作，并简化了新开发者的上手工作。\n\
    \n此外，Babel 针对特定浏览器的能力有助于确保你的应用程序对用户无缝运行。通过在配置中指定浏览器兼容性，你可以放心地实现新功能，同时确保它们对旧浏览器上的用户进行了适当的转译。\n\
    \n此外，Babel 鼓励创新和实验。随着现代 JavaScript 的不断演进，开发者可以在开发过程早期采用新功能和语法。这种前瞻性的方法可以带来具创新的解决方案，并提高应用程序的整体质量。\n\
    \n总之，Babel 是现代 JavaScript 开发中非常有价值的工具，它允许开发者编写更简洁、更易维护的代码，同时确保与各种环境兼容。通过将 Babel\
    \ 与 Webpack 集成，你可以优化开发工作流并充分利用 JavaScript 语言的最新进展。\n\n## 第 8 章：通过 Tree Shaking\
    \ 提高性能\n\n### 什么是 Tree Shaking？\n\nTree shaking 是一种用于现代 JavaScript 应用的强大优化技术，用于消除死代码——从未被引用或执行的未使用代码。该术语源于摇树以去掉枯叶、只留下有用的活树枝的想法。在\
    \ JavaScript 环境中，tree shaking 允许开发者通过移除最终输出不需要的代码来缩小应用程序的体积。\n\nTree shaking 依赖于\
    \ ES6（ECMAScript 2015）模块的静态结构，它支持 `import` 和 `export` 语法。与使用 `require()` 和 `module.exports`\
    \ 的 CommonJS 模块不同，ES6 模块提供了更显式的依赖和导出声明。这种清晰性允许 Webpack 等构建器更有效地分析依赖图，并确定代码的哪些部分实际上被使用了。\n\
    \ntree shaking 的主要目标是创建更小、更高效的包，以便浏览器更快加载。这提高了性能，缩短了加载时间，并提供了更好的用户体验。\n\n### Tree\
    \ Shaking 如何工作\n\n要在你的应用程序中有效利用 tree shaking，你需要确保遵循了某些编码实践和配置。以下是 tree shaking\
    \ 在实践中的工作方式：\n\n**使用 ES6 模块**：启用 tree shaking 第一步是使用 ES6 模块语法（`import` 和 `export`）。Webpack\
    \ 和其他现代构建器可以分析这种语法以识别未使用的导出。例如：\n\n```javascript\n// myModule.js\nexport const\
    \ usefulFunction = () => {\n  console.log('This function is useful!');\n};\n\n\
    export const unusedFunction = () => {\n  console.log('This function is not used.');\n\
    };\n```\n\n在此模块中，`usefulFunction` 被导出了，而 `unusedFunction` 在代码任何地方都没有被使用。\n\n**正确导入**：在导入模块时，如果只需要特定的函数，请避免导入整个库。相反，仅导入所需的函数或组件。例如，不要使用：\n\
    \n```javascript\nimport * as myModule from './myModule';\n```\n\n使用：\n\n```javascript\n\
    import { usefulFunction } from './myModule';\n```\n\n这确保了只有必要的代码被包含在包中。\n\n**将模式设置为生产（Production）**：当你将模式设置为\
    \ `production` 时，Webpack 默认启用 tree shaking。此模式应用了各种优化，包括压缩和死代码消除。你的 `webpack.config.js`\
    \ 应该包含：\n\n```javascript\nmodule.exports = {\n  mode: 'production',\n  // 其他配置\n\
    };\n```\n\n**最小化依赖**：确保你的依赖也是可以被 tree shaking 的。某些库可能不支持 ES6 模块，这会阻碍 tree shaking。在选择库时，寻找那些提供\
    \ ES6 模块构建或针对 tree shaking 设计的库。\n\n**分析你的包**：在实现 tree shaking 后，分析你的包以查看更改的影响关重要。`Webpack\
    \ Bundle Analyzer` 等工具可以提供有关包大小的见，并识别任何未使用的代码。你可以通过以下命令安装它：\n\n```bash\nnpm install\
    \ --save-dev webpack-bundle-analyzer\n```\n\n然后将其添加到 Webpack 配置中：\n\n```javascript\n\
    const { BundleAnalyzerPlugin } = require('webpack-bundle-analyzer');\n\nplugins:\
    \ [\n  new BundleAnalyzerPlugin(),\n],\n```\n\n使用此插件运行构建将生成包的可视化表示，允许你识别进一步优化的区域。\n\
    \n### Tree Shaking 的优势\n\n在应用程序中实现 tree shaking 可以带来许多益处，特别是在性能和维护性方面。\n\n**减少包体积**：通过消除未使用代码，tree\
    \ shaking 显著减小了应用程序包的体积。更小的意味着更快的下载速度，这对于提高用户体验至关重要，特别是在移动设备或慢连接上。\n\n"
- fmt: "\n## Improved Load Times\nA smaller bundle size means that the browser can\
    \ load and parse the JavaScript more quickly. This reduction in load time leads\
    \ to a more responsive application, enhancing user engagement and satisfaction.\n\
    \n## Better Caching\nSmaller bundles can be cached more effectively by browsers.\
    \ When updates are made to the code, users can download only the changed portions\
    \ rather than the entire application, resulting in faster subsequent loads.\n\n\
    ## Enhanced Maintainability\nBy promoting the use of ES6 modules and encouraging\
    \ developers to focus on necessary exports, tree shaking encourages a more modular\
    \ approach to coding. This modularity improves code organization and maintainability,\
    \ making it easier to understand and modify the codebase.\n\n## Encouragement\
    \ of Best Practices\nImplementing tree shaking encourages developers to adopt\
    \ best practices such as importing only what is necessary and writing clean, modular\
    \ code. This can lead to a more professional and maintainable codebase overall.\n\
    \n## Support for Modern Development Practices\nAs the JavaScript ecosystem evolves,\
    \ tree shaking aligns well with modern development practices such as code splitting\
    \ and dynamic `import()`. These practices work in tandem to create efficient and\
    \ high-performance applications.\n\n### Limitations and Considerations\nWhile\
    \ tree shaking offers significant advantages, there are some limitations and considerations\
    \ to keep in mind:\n\n### Non-Tree-Shakable Libraries\nSome libraries, particularly\
    \ older ones or those using CommonJS syntax, may not support tree shaking. It’s\
    \ essential to evaluate dependencies and choose those that are designed with tree\
    \ shaking in mind.\n\n###### Dynamic Imports and Side Effects\nTree shaking relies\
    \ on static analysis of your code. If a module has side effects (code that runs\
    \ during import), it may not be fully tree-shakable. To address this, you can\
    \ use the `sideEffects` property in your `package.json` to explicitly indicate\
    \ which files can be safely eliminated.\n\n```json\n{\n  \"sideEffects\": [\"\
    *.css\", \"*.scss\"]\n}\n```\n\n### Configuration Complexity\nSetting up tree\
    \ shaking may require a more complex `Webpack` configuration, particularly if\
    \ you are targeting multiple environments or using various plugins. Developers\
    \ need to understand how to leverage tree shaking effectively without introducing\
    \ bugs or misconfigurations.\n\n### Testing Impact\nAfter implementing tree shaking,\
    \ thorough testing is essential to ensure that necessary code has not been unintentionally\
    \ removed. Automated tests and manual checks can help identify any issues that\
    \ may arise from dead code elimination.\n\nIn summary, tree shaking is a vital\
    \ optimization technique that can greatly enhance the performance and efficiency\
    \ of JavaScript applications. By following best practices and utilizing the capabilities\
    \ of modern tools like `Webpack`, developers can create leaner, faster applications\
    \ that provide a superior user experience.\n\n# Chapter 9: Asset Management with\
    \ Webpack\n\n### Understanding Asset Management\nIn modern web development, managing\
    \ assets—such as images, fonts, stylesheets, and other static files—is crucial\
    \ for creating a seamless and efficient user experience. `Webpack` provides powerful\
    \ tools and features that allow developers to effectively manage these assets,\
    \ ensuring that they are optimized and included in the final bundle. Proper asset\
    \ management can significantly impact the performance and loading speed of web\
    \ applications.\n\n`Webpack` treats assets as modules, allowing them to be processed\
    \ and optimized just like JavaScript code. This approach enables developers to\
    \ take advantage of features such as code splitting, tree shaking, and caching,\
    \ ultimately resulting in a more efficient build process and improved user experience.\n\
    \n### Configuring Asset Management in Webpack\nTo manage assets effectively with\
    \ `Webpack`, developers need to configure loaders and plugins that facilitate\
    \ the processing and optimization of various asset types. The following sections\
    \ will cover how to handle images, fonts, and stylesheets using `Webpack`.\n\n\
    #### Managing Images\nImages are essential components of most web applications,\
    \ but they can significantly increase the size of your bundles if not managed\
    \ properly. `Webpack` provides loaders such as `file-loader` and `url-loader`\
    \ to help optimize images.\n\n**Installing Loaders:** To get started with image\
    \ management, you first need to install the necessary loaders. Use the following\
    \ command:\n\n```bash\nnpm install --save-dev file-loader url-loader\n```\n\n\
    **Configuring Loaders:** Once the loaders are installed, you need to configure\
    \ them in your `webpack.config.js`:\n\n```javascript\nmodule: {\n  rules: [\n\
    \    {\n      test: /\\.(png|jpe?g|gif|svg)$/,\n      use: [\n        {\n    \
    \      loader: 'url-loader',\n          options: {\n            limit: 8192, //\
    \ Convert images < 8kb to base64 strings\n            name: 'images/[name].[hash:8].[ext]',\n\
    \          },\n        },\n      ],\n    },\n  ],\n}\n```\n\nIn this configuration,\
    \ `url-loader` will convert images smaller than 8 kilobytes into base64 strings,\
    \ embedding them directly into the CSS or HTML. Larger images will be processed\
    \ by `file-loader`, which will move them to the output directory.\n\n**Using Images\
    \ in Your Code:** With the loaders configured, you can now import images directly\
    \ in your JavaScript files:\n\n```javascript\nimport myImage from './assets/myImage.png';\n\
    \nconst imgElement = document.createElement('img');\nimgElement.src = myImage;\n\
    document.body.appendChild(imgElement);\n```\n\nThis method ensures that images\
    \ are included in your bundle, optimized for size, and correctly referenced in\
    \ your application.\n\n#### Managing Fonts\nFonts are another important asset\
    \ that can enhance the design and branding of your web applications. `Webpack`\
    \ allows you to manage font files similarly to images.\n\n**Installing Font Loaders:**\
    \ You can use `file-loader` to handle font files. If you’ve already installed\
    \ it for image management, you can use the same loader:\n\n```bash\nnpm install\
    \ --save-dev file-loader\n```\n\n**Configuring Font Management:** Update your\
    \ `webpack.config.js` to include font files:\n\n```javascript\nmodule: {\n  rules:\
    \ [\n    {\n      test: /\\.(woff|woff2|eot|ttf|otf)$/,\n      use: [\n      \
    \  {\n          loader: 'file-loader',\n          options: {\n            name:\
    \ 'fonts/[name].[hash:8].[ext]',\n          },\n        },\n      ],\n    },\n\
    \  ],\n}\n```\n\nThis configuration will process various font formats and move\
    \ them to the specified output directory.\n\n**Using Fonts in Your Styles:** You\
    \ can then include fonts in your CSS:\n\n```css\n@font-face {\n  font-family:\
    \ 'MyCustomFont';\n  src: url('../fonts/myCustomFont.woff2') format('woff2'),\n\
    \       url('../fonts/myCustomFont.woff') format('woff');\n  font-weight: normal;\n\
    \  font-style: normal;\n}\n```\n\nBy managing fonts through `Webpack`, you ensure\
    \ that they are bundled and optimized along with other assets.\n\n#### Managing\
    \ Stylesheets\nManaging stylesheets effectively is essential for maintaining a\
    \ cohesive and performant application. `Webpack` allows you to handle CSS and\
    \ preprocessors like SASS or LESS seamlessly.\n\n**Installing CSS Loaders:** To\
    \ manage CSS files, you need to install the necessary loaders:\n\n```bash\nnpm\
    \ install --save-dev style-loader css-loader\n```\n\nIf you’re using preprocessors\
    \ like SASS or LESS, you can install their respective loaders as well:\n\n```bash\n\
    npm install --save-dev sass-loader node-sass\n```\n\n**Configuring CSS Management:**\
    \ Update your `webpack.config.js` to include rules for CSS and preprocessors:\n\
    \n```javascript\nmodule: {\n  rules: [\n    {\n      test: /\\.css$/,\n      use:\
    \ ['style-loader', 'css-loader'],\n    },\n    {\n      test: /\\.scss$/,\n  \
    \    use: ['style-loader', 'css-loader', 'sass-loader'],\n    },\n  ],\n}\n```\n\
    \nThis configuration will allow `Webpack` to process both CSS and SASS files,\
