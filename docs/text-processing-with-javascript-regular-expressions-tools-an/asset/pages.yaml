  md: "# Adding Transparency to Hex Colors\n\n# Task\n\nSuppose you want to add a\
    \ semi-transparent overlay to some elements of your app. For example, you may\
    \ have a prompt that asks the reader to log in before proceeding, and you may\
    \ want to include a semi-transparent white color around the prompt to blur the\
    \ remainder of the page.\n\nIf you use a normal hexadecimal color, the overlay\
    \ will completely obscure the content underneath it. If you use the CSS opacity,\
    \ it will set the opacity of the element as a whole, including its contents.\n\
    \nYou need a solution that lets you add transparency to a hex color.\n\n# Solution\n\
    \nWrite a function that accepts a hex value and a percentage as input parameters.\
    \ The function should convert the percentage into a hex value and then add it\
    \ to the original hex value:\n\n```\npart_1/adding_transparency_to_hex/adding_transparency_to_hex_ex1.js\n\
    function addAlphaToHex(hex, percent) {\n  const decimal = percent / 100;\n  const\
    \ rgb = Math.round(decimal * 255);\n  const alpha = rgb.toString(16).toUpperCase();\n\
    \n  if (alpha.length === 1) {\n    alpha = \"0\" + alpha;\n  }\n\n  return hex\
    \ + alpha;\n}\n\naddAlphaToHex(\"#FFFFFF\", 70); // \"#FFFFB3\"\n```"
  merge: -1
  pgno: 43
- img_proc: true
  md: 'This function returns an eight-character hex value that includes the alpha
    level. In this case, the return value is a white hex color (#FFFFFF) with 70 percent
    opacity (#FFFFFB3).


    # Discussion


    Previously, developers had to convert a hex color to either an RGBA or HSLA value
    to set opacity. This conversion was necessary because the alpha channel in the
    RGBA or HSLA value could be used to determine the level of opacity. However, with
    the introduction of CSS Color Module Level 4, the problem has been solved by adding
    new function (#rgba) and eight (#rrggbaa) character hex notations that include
    the alpha level. So, developers no longer need to convert the hex color to another
    format in order to set opacity.


    The rr, gg, bb, and aa in the representation represent hexadecimal values for
    the red, green, blue, and alpha components respectively, ranging from 00 to FF.
    The alpha value determines the opacity of the color, with 00 representing a fully
    transparent color and FF representing a fully opaque color. For example, the color
    #FF000FF is a fully opaque red color, while the color #FF000000 is a fully transparent.


    Our function addAlphaToHex() takes two parameters: hex and percent. The function''s
    purpose is to convert the percent value to its corresponding hex representation
    and append it as an alpha value to the given hex. Within the function, we first
    calculate the decimal value of the percentage by dividing it by 100. Then, we
    multiply the resulting decimal by 255 and round the result using Math.round()
    to obtain an RGB value.


    Next, we convert the RGB value to a hexadecimal string using the toString() method
    with a radix of 16 (that is, base 16). We then convert the string to uppercase
    using the toUpperCase() method. After that, we check if the hex is only one character
    long. If it is, we add a leading zero to the string concatenation operator (+),
    so that it''s two characters long. Finally, we return the original value parameter
    concatenated with the alpha hex value.'
