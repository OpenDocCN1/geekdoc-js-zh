  md: "# Extracting Text Enclosed in Single Quotes\n\n# Task\n\nSuppose the data source\
    \ for your mini-game widget lists the nicknames in single quotes rather than double\
    \ quotes. Extracting the text within single quotes can be more challenging compared\
    \ to double quotes because the nickname itself could contain an apostrophe.\n\n\
    For example:\n\nMichael Eugene Archer, also known as 'D'Angelo'\n\nYou need a\
    \ solution that can accurately identify a pair of single quotation marks while\
    \ distinguishing them from an apostrophe.\n\n# Solution\n\nTake advantage of lookarounds:\n\
    \n```\npart_3/extracting_text_in_single_quotes/single_quoted_text_ex1.js\n\nconst\
    \ str =\n  '1. Michael Eugene Archer, also known as 'D'Angelo'\n  2. Scarlett\
    \ Johansson, also known as 'Scarjo'\n  3. Bradley Cooper, also known as 'Coop'\n\
    \  4. Jennifer Lawrence, also known as 'Nitro'\n  5. Hugh Jackman, also known\
    \ as 'Sticks'\n  6. Tom Hardy, also known as 'Weasel';\n\nfunction extractQuotes(str)\
    \ {\n  const re = /(?<=\\w)('(.+?)(?!\\w)/g;\n  const quotes = [...str.matchAll(re)].map(value\
    \ => value[1]);\n\n  return quotes;\n}\n\nextractQuotes(str);\n// -> [\"D'Angelo\"\
    , \"Scarjo\", \"Coop\", \"Nitro\", \"Sticks\", \"Weasel\"]\n```"
