  md: '```

    const str2 = ""; // → \u2076


    console.log(str2.normalize("NFD")); // → 6(\u2076)

    console.log(str2.normalize("NFC")); // → 6(\u2076)

    console.log(str2.normalize("NFKD")); // → 6(\u0036)

    console.log(str2.normalize("NFKC")); // → 6(\u0036)

    ```


    In this code, conversion to NFD or NFC does not affect str1 and str2 because the
    strings are compatible compositions, not canonical compositions.


    Interestingly, conversion to NFKD and NFKC produces the same result because NFKC
    uses compatibility decomposition as the basis for canonical composition. In this
    case, the character has no canonical composition form, so it''s converted to compatibility
    decomposition.


    The difference between NFKC and NFKD becomes more apparent when a glyph is a canonical
    composition of glyphs that are compatible with another glyph. Consider the following
    code:


    ```

    part_1/equalizing_characters/normalize_ex.js


    const str = "f"; // \u1E9B


    console.log(str.normalize("NFD")); // → ƒ (\u017F\u0307)

    console.log(str.normalize("NFC")); // → ƒ (\u1E9B)


    console.log(str.normalize("NFKD")); // → $ (\u0073\u0307)

    console.log(str.normalize("NFKC")); // → f (\u1E61)

    ```


    As we said, NFKC uses compatibility decomposition as the basis for canonical composition.
    The compatibility decomposition of \u1E9B is \u0073\u0307, and the canonical composition
    of \u0073\u0307 is \u1E61.


    Remember, perform text normalization before storing or processing texts to avoid
    possible pitfalls. But be careful when using normalization forms KD and KC as
    they discard distinctions that may be essential to the semantics of the text.
    Therefore, you shouldn''t blindly apply them to arbitrary text. NFC is usually
    a better choice for general text.'
