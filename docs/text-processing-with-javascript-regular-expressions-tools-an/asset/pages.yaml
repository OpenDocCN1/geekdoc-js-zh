  md: '# Discussion


    The regex for this recipe encapsulates the regex metacharacters in a character
    class. The square brackets [] denote a character class, which means any character
    within the class will be matched. Then, the replace() method replaces all occurrences
    of the metacharacters with their escaped versions.


    $& in the replacement string represents the matched substring itself. Notice the
    double backslash preceding it: since the backslash is used as the escape character,
    you cannot use it if you want to add a literal backslash to a string. Instead,
    you need to type two backslashes in a row. this is because the first backslash
    acts as an escape character for the second backslash, telling JavaScript to treat
    the second backslash as a literal character instead of an escape sequence.


    Here’s the reasoning behind escaping each of those characters in the character
    class:


    +   - The hyphen symbol defines a range of characters in a character class. To
    prevent accidental creation of ranges while incorporating text within a character
    class, it’s necessary to escape it

    - The \backslash can be used to make certain literal characters special. For example,
    \n creates a newline character (rather than a backslash followed by the letter
    n)

    - The caret symbol matches the start of a line/string. It can also create a negated
    character class

    - The dollar symbol matches the end of a line/string

    - The * quantifier matches its preceding item zero or more times

    - The + quantifier matches its preceding item one or more times

    - The ? quantifier matches its preceding item zero or one time

    - The dot symbol matches any character

    - | The () Parentheses are used for capturing, grouping, and other constructs

    - [] Square brackets create a character class

    - {} Curly brackets create a quantifier'
