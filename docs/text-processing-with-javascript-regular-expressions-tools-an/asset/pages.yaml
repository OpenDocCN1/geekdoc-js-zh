  md: 'When using the pattern in this recipe, make sure to use the /g flag to replace
    all matches, rather than only the first.


    It''s important to be careful when using user-provided input in your regex. Failing
    to do so could render your program vulnerable to a type of attack called ReDoS
    (regular expression denial of service). An attacker could potentially exploit
    your program by providing an extremely intricate regex that requires a significant
    amount of time to process.


    When evaluating user input in a browser, a ReDoS attack will typically cause the
    browser to hang. But, when the input is being evaluated on a server, the consequences
    can be more severe and potentially lead to a denial-of-service attack. In such
    an attack, the attacker floods the server with a barrage of highly processing-intensive
    requests, effectively preventing the server from servicing legitimate requests.


    In this case, protecting your program from ReDoS isn''t too difficult: escape
    all metacharacters that could alter the pattern of the expression. This can be
    done by placing a backslash before the metacharacter, which tells the regex engine
    to treat it as a literal character.


    | Escaping Metacharacters in Other Languages |

    | :--- |

    | There exist built-in functions in several programming languages that automatically
    escape regex metacharacters. For example, Java has Pattern.quote(str) and Python
    provides e.escape(str). If you''re using the Lodash library, you might as well
    take advantage of its `_escapeRegExp()` method to escape metacharacters. |'
