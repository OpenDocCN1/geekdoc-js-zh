  md: "# Validating Social Security Numbers\n\n# Task\n\nSuppose you have a loan application\
    \ form (or maybe a background check form) and want to perform a check to ensure\
    \ that the Social Security number (SSN) is once assigned by users conforms to\
    \ the standard format of an SSN.\n\nThe SSN is a nine-digit number that is divided\
    \ into three parts separated by hyphens: AAA-GG-SSSS. The first set of three digits\
    \ is called the area number, as it was once assigned based on geographical region.\
    \ But it cannot be 000, 666, or between 900 and 999.\n\nThe group number, which\
    \ consists of digits four and five, ranges from 01 to 99. The last four digits\
    \ are known as serial numbers and are assigned from 0001 to 9999. You need a solution\
    \ that adheres to all these rules and lets you quickly identify invalid SSNs.\n\
    \n# Solution\n\nUse the following function:\n\n```\npart_3/validating_ssn/ssn_ex1.js\n\
    function isValidSSN(ssn) {\n  const re = /^(?!666|000)[0-8]\\d{2}-(?!100)\\d{2}-(?!0000)\\\
    d{4}$/;\n  return re.test(ssn);\n}\n```\n\n```\nisValidSSN(\"123-45-6789\"); //\
    \ true\nisValidSSN(\"123-456-7899\"); // false\nisValidSSN(\"123-00-6789\"); //\
    \ false\nisValidSSN(\"666-45-6789\"); // false\n```\n\nThis function ensures that\
