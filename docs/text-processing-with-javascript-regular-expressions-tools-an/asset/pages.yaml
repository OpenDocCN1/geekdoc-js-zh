    # Types of Quantifiers


    Quantifiers specify the number of occurrences of a character, group, or character
    class to match. There are six forms of quantifiers in regex: zero or more (*),
    one or more (+), zero or one (?), exactly times {n}, at least times {n}, and from
    n to m times {n,m}. Let''s look at each and how you might use them.


    # Zero or More (*)


    An asterisk matches zero or more sequences of the preceding item. Let''s say we
    want to match all verb forms of the word "play," including "played," "plays,"
    and "playing." By using a quantifier after the character class (\w), we can tell
    regex to match "play" and any character that might come after it as long as it''s
    a word character:


    ```

    part_2/quantifiers/quantifiers_w*|b/

    ```


    ```

    re.test("He plays for Cleveland"); // true

    re.test("France is playing England tomorrow."); // true

    re.test("Evans played well."); // true

    re.test("Let''s play a different game"); // true

    ```


    Note that this pattern also matches words like "playful" and "playground." To
    limit the match to specific words, we can use a vertical bar (see Recipe 26, Matching
    One of Several Alternatives with the Vertical Bar (|)).'
