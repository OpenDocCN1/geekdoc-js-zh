  md: '# Extracting Lists from Text with slice()


    # Task


    Suppose you run an online shop selling thousands of different clothes. You''re
    tasked with making the products searchable by color. The problem is the available
    colors for each product are listed as a sentence in the product description. You
    need a way to find and extract those colors programmatically to build a searchable
    database.


    So if you have a product description like this:


    Feel confident in the most unforeseen weather conditions with waterproof trail-running
    shoes helping you stay dry. Available in new colors: Velvet Brown, Black, Golden
    Moss, Medium Blue.


    You want to extract the colors and store them in an array like this:


    ```

    ["Velvet Brown", "Black", "Golden Moss", "Medium Blue"]

    ```


    The list you want to extract may also come in different variations. It could have
    a forward slash (/) between items rather than a comma. Or it could have extra
    words such as "and," "or," "etc." that you don''t want to end up in your array.


    In this recipe, we first build a function that extracts simple lists and enhance
    the function to handle more complex lists.


    # Solution


    This recipe involves two steps: first, finding the sentence containing the list
    of colors, and second, extracting each color and storing it in an array. You can
    perform the first step using the indexOf() method. The list of colors comes after
    a colon (:). Locate it with indexOf() and store the resulting index in a constant.
    Next, locate the first period that follows the colon and store the index in another
    constant:'
