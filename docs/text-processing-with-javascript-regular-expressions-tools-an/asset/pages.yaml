  md: '# # Flags


    | Syntax | Flag Type | Description |

    | --- | --- | --- |

    | g | global | Finds all matches, not just the first one. |

    | i | ignoreCase | Matches upper and lowercase characters. |

    | s | dotAll | Allows the dot (.) to match newlines. |

    | u | unicode | Enables various Unicode features. |

    | y | sticky | Matches only at the current position in the target string. |

    | d | hasIndices | Enables the result of a match to contain the start and end
    indices of the substrings. |

    | m | multiline | Matches the beginning or end of each line in a string, not just
    the beginning or end of the string itself. |'
