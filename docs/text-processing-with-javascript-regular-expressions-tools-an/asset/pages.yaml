    # Zero or One (?)


    A question mark marks zero or occurrence of the preceding item. For example, if
    we wanted to match the word "apple" or its plural form, "apples," we’d write /apples?/.
    This pattern tells the regex engine to match the word "apple" followed by zero
    or one instance of the letter "s":


