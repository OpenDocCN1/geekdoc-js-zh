  md: '# Recipe 22 Copying Text to Clipboard with the Clipboard API


    # Task


    Suppose you have a cooking website that provides recipes for different meals,
    and you want to provide readers with the option of copying the ingredients of
    the recipes to their clipboard so that they can create a shopping list. To achieve
    this, you need to create a button that, when clicked, copies the list of ingredients
    to the clipboard.


    # Solution


    First, set up your HTML elements. You need a button that triggers a JavaScript
    code. Remember, your program should not attempt to read or write the user''s clipboard
    without permission. So, creating a button that clearly states data to the clipboard
    is the first step:


    ```

    part_1/copying_to_clipboard/clipboard_ex1.xhtml


    <!doctype html>

    <html lang="en-us">

    <head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="clipboard_ex1.js" defer></script>

    </head>


    <body>

    <ul id="ingredients">

    <li>1 cup olive oil/</li>

    <li>4 garlic cloves/</li>

    <li>1 tablespoon ground cumin/</li>

    <li>1 tablespoon chili powder/</li>

    <li>2 cans beans/</li>

    <li>1 can crushed tomatoes/</li>

    </ul>

    <button id="copyBtn" type="button">Copy Ingredients to Clibard</button>

    </body>

    ```'
