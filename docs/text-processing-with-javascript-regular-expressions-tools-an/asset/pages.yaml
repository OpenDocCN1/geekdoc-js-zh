  md: "# Counting Unicode Characters with Intl.Segmenter()\n\n# Task\n\nLet's say\
    \ you have an app that requires user registration and includes a text input for\
    \ the user’s bio. The bio may be in any language and include emojis. You want\
    \ to limit the length of the bio to precisely 120 characters. So, you need to\
    \ calculate the length of the string. Easy! Use the length() method to get the\
    \ number of characters:\n\n```\nconsole.log(\"你好\".length); // → 2\nconsole.log(\"\
    \U0001F4A9\".length); // → 4\n```\n\nThis is probably not the result you expected.\
    \ Strings in JavaScript are based on UTF-16, which represents characters using\
    \ one or two sixteen-bit integers. Some characters, such as the Chinese character\
    \ for  (eloquence) and the cat emoji, require two 16-bit units (surrogate pairs)\
    \ to encode. The length() method gives you the number of UTF-16 code units in\
    \ a string, not the number of characters.\n\nSupplementary Characters\nCharacters\
    \ that are made of a pair of 16-bit surrogate code units are known as supplementary\
    \ characters.\n\n# Solution\n\nUse the Intl.Segmenter() constructor:\n\n```\n\
    part_1/counting_characters/char_segmenter_ex2.js\n```\n\n```\nfunction getLength(str)\
    \ {\n  return [...new Intl.Segmenter().segment(str)].length;\n}\n```"
