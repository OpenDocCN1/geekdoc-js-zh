  md: 'Use a Unicode property escape in the form of \p{Number}:


    ```

    part_2/unicode_property_escapes_p1/upe_p1_ex3.js

    ```


    ```

    const re = /^\p{Number}{4,6}/u;

    // digits in Persian

    re.test("١٢٣४");          // -> true

    // digits in Thai

    re.test("๑๑๒๓๔");          // -> true

    // digits in Tamil

    re.test("�๕�����");          // -> true

    ```


    Success! You''ve matched digits in three different languages.


    # Discussion


    Symbols in the Unicode standard have various properties and property values. With
    Unicode property escapes, regex can match characters based on their Unicode properties.


    In this recipe, we''re using \p{Number} to match every symbol in the Number category,
    including Roman numerals and numbers classified as compatibly equivalent:


    ```

    part_2/unicode_property_escapes_p1/upe_p1_ex4.js

    ```


    ```

    const re = /^\p{Number}{4,6}/u;

    console.log(re.test("XIXIVIII"));    // -> true

    console.log(re.test("①②③④⑤"));      // -> true

    ```


    If you want to exclude non-decimal numbers, you can use \p{Decimal_Number} instead:


    ```

    part_2/unicode_property_escapes_p1/upe_p1_ex5.js

    ```


    ```

    const re = /^\p{Decimal_Number}/u;

    ```'
