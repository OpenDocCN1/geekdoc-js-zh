  md: '# Recipe 45 Modifying an Existing Regex Literal


    # Task


    Suppose you want to take your teammate''s regular expression literal and modify
    it for use in another part of the code. You don''t want to alter the original
    regex because it has passed all tests for the job it was intended for.


    You need a solution that enables you to modify a copy of an existing regex literal.


    # Solution


    Use the source flags properties to retrieve the original regex parts. and construct
    a new RegExp object with these parts:


    ```

    part_2/modifying_regex/modifying_regex_ex1.js

    // Pattern to match a filename with .png extension

    const origRegex = /\(\w+\)\png\b/;


    // Pattern to match a filename with .png or .PNG extension

    const newRegex = new RegExp(origRegex.source, origRegex.flags + "i");

    ```


    Hooray! You have successfully added the i flag to the regex pattern.


    # Discussion


    JavaScript provides the flags property for reading all flags used in a regex:


    ```

    part_2/modifying_regex/modifying_regex_ex2.js

    const re1 = /\(\w+\)\.png\b/igu;

    const re2 = /\(\w+\)\.png\b/;


    console.log(re1.flags); // giu

    console.log(re2.flags); // "

    ```'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'Notice how the order of flags when reading them. The flags property always
    ignores the order of the original pattern and lists them in a fixed order: “gumuy.”
    If the pattern has no flags, the return value will be an empty string.


    Similarly, the source property gets us the pattern enclosed between the forward
    slashes:


    ```

    part_2/modifying_regex/modifying_regex_ex3.js

    const re = /\b(\w+)\.png|b/igu;

    console.log(re.source); // ~ |\b(\w+)\.png|b

    ```


    We can also check if a specific flag is applied to a regex. For example, if the
    flag g is set, we can read the global property:


    ```

    part_2/modifying_regex/modifying_regex_ex4.js

    const re1 = /\b(\w+)\.png|b/ig;

    const re2 = /\b(\w+)\.png|b/u;

    console.log(re1.global); // ~ true

    console.log(re2.global); // ~ false

    ```


    The following table lists all supported flags along with their corresponding properties.
    Note that all properties are read-only:


    | Flag | Corresponding Property |

    | --- | --- |

    | d | hasIndices |

    | g | global |

    | i | ignoreCase |

    | m | multiline |

    | s | dotAll |

    | u | unicode |

    | y | sticky |'
