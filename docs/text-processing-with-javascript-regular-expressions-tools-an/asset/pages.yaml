    JavaScript provides several methods to determine whether a pattern exists in a
    string. The test() method is the simplest one. It returns true if a match exists
    in the given string or false if otherwise.


    We can get the same result with the RegExp() constructor:


    ```

    part_2/first_regex/first_regex_ex3.js

    const re = new RegExp("123");

    const str1 = "123";

    const str2 = "321";

    console.log(re.test(str1)); // → true

    console.log(re.test(str2)); // → false

    ```


    Unlike the literal form, the RegExp allows us to construct a pattern dynamically.
    For example, we can use it to build a pattern out of the items of an array:


    ```

    part_2/first_regex/first_regex_ex4.js

    const str = "Debuggers don''t remove bugs. They show them in slow motion."

    const arr = ["bug", "flea", "mite", "midge"];

    const re = new RegExp(arr.join("||"));

    ```


    ```

    console.log(re.test(str)); // → true

    ```


    A pipe symbol in a regex pattern works like the logical OR (||) operator in JavaScript.
    It matches everything to the left of the symbol or to the right. In this case,
    we have four items in the array, and we''re joining them with a pipe, so it''s
    like writing the literal form /bug|flea|mite|midge/. The main difference is that
    RegExp lets us build the pattern dynamically.


