  md: '# Creating Your First Regular Expression


    Before using the recipes in Parts 2 and 3, you need to know how to implement regular
    expressions in your code. In JavaScript, you have two options for creating regular
    expressions: you can either use the RegExp() constructor or use the regex literal.
    When using the literal form, you''ll need to enclose the pattern in a pair of
    forward slash (/) characters, like this:


    ```

    part_2/first_regex/first_regex_ex1.js

    const re = /Hello;

    ```


    This pattern is made up of five characters that tell the regex engine to find
    a direct match for “Hello” in a string. A pattern can be as simple as a single
    literal character such as “i.” If there are multiple occurrences of “i” in a string,
    it matches the first one.


    In example, in the string “opportunity doesn’t knock, build a door,” the regex
    matches the “i” in “opportunity,” not “build.” It also doesn’t match the “I” in
    “If” because that word uses a capital letter. As you will learn later in this
    part, you can use flags to configure your regular expression to continue searching
    after the first match or ignore the letter case.


    Let’s look at another example:


    ```

    part_2/first_regex/first_regex_ex2.js

    const re = /123;

    const str1 = "123";

    const str2 = "321";

    console.log(re.test(str1)); // true

    console.log(re.test(str2)); // false

    ```


    When running this code, the regex engine tries to find “1,” immediately followed
    by a “2,” and immediately followed by a “3.” This pattern exists'
