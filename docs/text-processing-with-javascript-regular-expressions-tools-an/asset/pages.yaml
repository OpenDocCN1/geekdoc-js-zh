  md: '# Recipe 21 Equalizing Incompatible Characters with normalize()


    # Task


    Imagine having a cooking application, and you want to add a feature to sort recipes
    by the cooking method. The code you developed performs well in sorting recipes
    for methods like steaming and grilling. However, when it comes to sautéing, the
    code fails to recognize certain recipes.


    After investigating the problem, you realize that the code sometimes fails to
    match the word “sautéing” even though the characters appear to be the:


    ```

    part_1/equalizing_characters/normalize_ex1.js// Notice the length of the strings

    const method = "sautéing";

    const keyword = "sautéing";

    console.log(method === keyword); // -> false

    console.log(method.length); // -> 9

    console.log(keyword.length); // -> 8

    ```


    “é” in method has a code point of U+00E9, “é” in keyword consists of two code
    points: U+0065 and U+0301. As a result, the strict equality operator (===) considers
    them unequal.


    The difference in the number of code points isn’t the only reason why your code
    may fail. Certain characters have the same length but are encoded using two code
    points, which can also cause issues with your code.


    For instance, the character “Å” can be encoded either as U+212B ANGSTROM SIGN
    or as U+00C5 LATIN CAPITAL LETTER WITH RING ABOVE. These two characters aren’t
    equal in JavaScript unless you normalize them.'
  merge: -1
