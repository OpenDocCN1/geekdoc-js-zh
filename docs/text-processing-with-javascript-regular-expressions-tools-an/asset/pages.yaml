    \ on the server side with Node 16 or higher.\n\n# Discussion\n\nIn the previous\
    \ recipe, we used the default implementation of Intl.Segmenter(), which splits\
    \ a string at grapheme cluster (user-perceived character) boundaries. This time,\
    \ we're setting the granularity to word so that the split occurs at word boundaries.\n\
    \nThe first argument of Intl.Segmenter() determines the locale, which must be\
    \ a BCP 47 language tag.[29] In this case, we want to split English words, so\
    \ we pass “en.” Now we get the segments of the string, we should filter those\
    \ that aren't words. Fortunately, the API makes it easy for us by providing the\
    \ isWordLike property. The filter effectively removes any-word segments (such\
    \ as punctuation or numbers).\n\nFinally, we return the length of the filtered\
    \ segments array, which represents the total number of word segments in the original\
    \ string. Now, if we want to count the words in another language, we all need\
    \ to pass the corresponding language tag to countWords() function. For instance,\
    \ the following example counts the words in Japanese:\n\n```\npart_1/counting_words/word_segmenter_ex2.js\n\
    const str = \"アジア・東アジアの中でも東方にあります\";\n\nfunction countWords(str, lang) {\n  const\
