    Typically, ^ only matches the start of the string, so it''s important to enable
    the multiline flag (m) to ensure that ^ and $ match at line breaks. Also make
    sure you don''t use the dotAll flag (s) that allows the dot to match line breaks
    because would lead to the regex matching the whole string.


    We use a pair of parentheses containing.* to match the complete content of a line,
    including empty lines. In the parentheses are a capturing group, we can later
    refer to the matched value with a backreference.


    Within a non-capturing group (?:...), we have used the pattern \r?\n\1 to identify
    line separators in Unix and Unix-like systems (\n) or Windows/DOS (\r\n) text
    files. Next, we attempt to match the line that was previously matched with the
