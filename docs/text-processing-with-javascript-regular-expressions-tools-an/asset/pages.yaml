  md: '# Discussion


    Reusing the text provided by the user without sanitizing it is unwise because
    it leaves the system vulnerable to XSS attacks. But, for this recipe, let’s overlook
    this concern and assume that the input is safe to use (if you want to learn how
    to protect against XSS attacks, check the link in the footnote [36])


    We first use the regex `\r\n|\n/g` to find newline characters that are used in
    Microsoft Windows/DOS (`\r\n`) or Unix and Unix-like systems (`\n`). And we replace
    them with `<br>`.


    In order to format paragraphs in HTML, it’s necessary to enclose them within `<p></p>`
    tags. One way to achieve this is to identify any instance of two consecutive line
    breaks and replace them with `</p><p>` (Line 7).


    Finally, we wrap the complete string with `<p></p>` tags and then return the resulting
    string. Before using this function to convert text to HTML, you may want to replace
    `&`, `<`, `"`, and `''` characters with HTML entities to prevent browsers from
    interpreting HTML tags entered by users (see Recipe 8, Converting HTML Markup
