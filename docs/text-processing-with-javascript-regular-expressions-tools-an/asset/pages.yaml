  md: "# Discussion\n\nThe regex in this recipe begins with a negative lookahead that\
    \ prohibits the occurrence of D, F, I, O, Q, or U at any position within the string.\
    \ Because of their resemblance to other characters, the letters D, F, I, O, Q,\
    \ and U are excluded from Canadian postal codes. This is because D, I, and O can\
    \ be confused with 0, 1, and 0 respectively, while F, Q and U can be mistaken\
    \ for E, 0, and V.\n\nThe pattern.** at the beginning of the negative lookahead\
    \ tells the regex engine that the character type being sought can appear anywhere\
    \ in the string, not just at the beginning.\n\nCanadian postal codes cannot start\
    \ with the letters W or Z. To ensure that the first character of the string is\
    \ not W or Z, we use the class [A-VXY]. This tells the regex engine that the character\
    \ must be any letter from A to V X or Y, but not W or Z.\n\nWith the exception\
    \ of the two aforementioned cases, Canadian postal codes follow a straightforward\
    \ pattern of six alternating alphanumeric characters, with the option of a single\
    \ space in the middle.\n\nLet’s a dig deeper into the pattern:\n\n```\n/^(?.*[DFIOQU][A-VXY][0-9][A-Z]\\\
    s[0-9][A-Z][0-9])$$/\n```\n\n+   * asserts the position at the start of the string\n\
    * (?!.*[DFIOQU]) negative lookahead: asserts the regex below doesn't match\n \
