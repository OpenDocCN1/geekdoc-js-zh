    - ? matches the previous token  or 1 time

    - $ asserts the position at the end of the string


    This regex assumes that the provided string consists solely of a ZIP code. But,
    if you intend to locate ZIP codes within a larger document or input string, you
    should substitute ^ and $ with the word boundary like this: `\b\d{5}(?[:-\s]\d{4})?\b`.


