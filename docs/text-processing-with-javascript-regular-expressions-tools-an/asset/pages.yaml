    \ split the text string by spaces and count the resulting segments. However, this\
    \ approach may not work correctly in cases where there are multiple consecutive\
    \ spaces between words, or when the article is written in a language that doesn't\
    \ use spaces to separate words, such as Korean or Japanese.\n\nYou need a solution\
    \ that can accurately count the number of words in a text, regardless of the language\
    \ used.\n\n# Solution\n\nCall the Intl.Segmenter() constructor with the granularity\
    \ option set to word:\n\n```\npart_1/counting_words/word_segmenter_ex1.js\nconst\
    \ str = \"White, red, and blue.\";\nfunction countWords(str, lang) {\n  const\
    \ segments = [...new Intl.Segmenter(lang, granularity: \"word\\}).segment(str)];\n\
    \  return segments.filter(item => item.isWordLike === true).length;\n}\ncountWords(str,\
    \ \"en\"); // 4\n```\n\nSuccess! The countWords() function counts the number of\
    \ words in str based on a specified language (lang)."
