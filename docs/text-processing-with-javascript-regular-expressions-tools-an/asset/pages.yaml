  md: '# search()


    The search method executes a search on a string and returns an integer indicating
    the index of the first match. If no match is found, the return value will be -1:


    ```

    appendix/methods/methods_ex10.js

    const str = "Eat well, stay fit, die anyway.";


    // Using a string as the pattern

    console.log(str.search("fit")); // -> 15


    // Using a regular expression as the pattern

    console.log(str.search(/fit/)); // -> 15

    ```


    Unlike exec() or test(), the search() method does not support the global flag
    and ignores the lastIndex property. This means it always executes a search from
    the beginning of the string and returns the index of the first match.'
