    \ a single character in the list DFIOQU\n* [A-VXY] matches a single character\
    \ present in the list below\n  * A-V matches a single character in the range between\
    \ A and V\n  * XY matches a single character in the list XY\n  * [0-9] matches\
    \ a single character in the range between 0 and 9\n* [A-Z] matches a single character\
    \ in the range between A and Z\n* \\s matches any whitespace character\n* [0-9]\
