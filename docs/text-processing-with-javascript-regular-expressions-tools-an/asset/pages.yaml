  pgno: 201
- img_proc: true
  md: 'Lookaheads are non-capturing groups that allow us to match a pattern based
    on the substring that follows the pattern. For a positive lookahead match to be
    successful, it must match a pattern followed by the pattern in subexpression.


    Notice the output of match() in the following code, which is only "$".


    ```

    part_2/positive_lookahead/positive_lookahead_ex2.js

    const str = "$90.3 million";nconst re = /\(?=90\.\3\million)/;

    str.match(re); // → "$"

    ```


    When using a lookahead, the subexpression is not included in the result. It also
    can''t be referenced with a backreference.


    There''s a workaround, though. If you place capturing parentheses around the expression
    in the lookahead like (?=(regex)), you can capture the match in lookarounds, too.
    Wrapping the entire lookahead in parentheses won''t work because the capturing
    group wants to store the match, the the lookahead has already discarded it.


    Don''t the positive lookahead assertion (?=...) and the non-capturing group (...)
    serve different purposes. While both do capture the substring they match, the
    non-capturing group includes the substring in the overall match, while the positive
    lookahead assertion does not.


    For example, if we rewrite the solution in this recipe to substitute a non-capturing
    group for the lookahead assertion, the entire match gets replaced:


    ```

    part_2/positive_lookahead/positive_lookahead_ex3.js

    const str = "The Company posted a September quarter record revenue of $90.3 million,
    up 8 percent year over year.";

    const re = /(?:\90\.\3\million)/ig;

    str.replace(re, ""); // → "The Company posted a September quarter record revenue
    \n"

    ```'
