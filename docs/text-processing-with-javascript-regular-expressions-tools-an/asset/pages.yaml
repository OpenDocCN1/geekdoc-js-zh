  md: '# # Quantifiers


    | Syntax | Description |

    | :--- | :--- |

    | x* | Matches zero or more occurrences of the preceding character. |

    | x+ | Matches one or more occurrences of the preceding character. |

    | x? | Matches zero or one occurrence of the preceding character. |

    | x{n} | Matches exactly n occurrences of the preceding character. |

    | x{n,} | Matches at least n occurrences of the preceding character. |

    | x{n,m} | Matches between n and m occurrences of the preceding character (inclusive).
    |

    | x*? x+ | Lazy quantifier: matches the shortest possible sequence of characters
    in a string that satisfies a given pattern. |

    | x?? | |

    | x{n}? | |

    | x{n,m}? | |'
