  md: '# Groups and Backreferences


    | Syntax | Group Type | Description |

    | --- | --- | --- |

    | (x) | Capturing Group | Captures the matched substring and assigns it a group
    number. |

    | (?<Name>x) | Named Capturing Group | Captures the matched substring by name
    and assigns it a group number. |

