  md: '# replace()


    The replace() method replaces matches with the given string. The pattern may be
    a string or a regex:


    ```

    appendix/methods/methods_ex11.js

    const str = "fish and chips";n

    // Using a string as the argument

    console.log(str.replace("and", "&\)); // -> fish & chips


    // Using a regex as the argument

    console.log(str.replace(/and/, "&\)); // -> fish & chips

    ```


    If the global flag is set, the method replaces every match it finds in the string:


    ```

    appendix/methods/methods_ex12.js

    const str = "$5, $10, $20";nconst re = /\$$/g;


    console.log(str.replace(re, "€\)); // -> €5, €10, €20

    ```'
