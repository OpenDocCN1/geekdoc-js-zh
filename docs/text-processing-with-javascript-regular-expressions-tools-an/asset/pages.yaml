    s[0-9][A-Z][0-9]$/i;\n  return re.test(postalCode);\n}\n\nisValidPostalCode(\"\
    A1A 1A1\"); // false\nisValidPostalCode(\"111 111\"); // false\nisValidPostalCode(\"\
    A1A1A1\"); // false\nisValidPostalCode(\"A1A-A1A\"); // false\nisValidPostalCode(\"\
    12A 1B1\"); // false\nisValidPostalCode(\"M5V 1J2\"); // true\n```\n\nThis code\
