    # Discussion


    Users tend to select uncomplicated or commonly used passwords that are easy to
    recall. Surprisingly, some people are using "123456" and "password" as their password,
    which means they are easy to hack. As a result, it''s often necessary to safeguard
    users from choosing easy-to-guess passwords by implementing minimum password complexity
    requirements.


    We structured each validation rule of this recipe into its own lookahead group.
    Without lookahead, you''d need to use multiple regex patterns or iterate the string
    multiple times to check for all the required conditions, which can be less efficient
    and harder to maintain.


    Lookaheads allow you to check the conditions without actually advancing the position
    of the regex engine in the string, so each test runs from the start of the string.
    Once a lookahead succeeds, the regex engine then moves on to test the next lookahead
    from the same position. If a lookahead fails to find a match, the entire match
    fails as a result.'
