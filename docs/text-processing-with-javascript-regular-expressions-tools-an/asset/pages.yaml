    # Browser Compatibility


    ![](img/e5bb32f1d397464f7c60b10c18e1a802_85_0.png)


    Segmenter() is a part of the Internationalization API. While most browsers have
    supported the Internationalization API features for years, Segmenter() is a relatively
    newer feature that remains unsupported in Firefox (at the time of this writing).
    [17]


    There are some Unicode-aware libraries like Graphe that you split JavaScript strings
    into separate letters, [18] but their results aren''t perfectly consistent with
    those from Segmenter. There''s no perfect way to emulate the behavior of Segmenter()
    in browsers, because doing so requires lots of language-specific rules.


    Until browser support is more solid, you can run Intl.Segmenter() on the server
    side (supported since Node 16).


    # Discussion


    The Intl.Segmenter() constructor allows us to segment a string to a specified
    locale and granularity. In this case, we use the default implementation, so we
    call the method with no arguments. Because Intl.Segmenter() is a constructor,
    we need to call it with the new keyword.


    The returned object has a segment() method, which accepts a single-string argument.
    The method segments the string, as its name suggests, meaning that it splits the
    string into user-perceived character boundaries. Because the returned value is
    an iterator, we can use the spread syntax (...) to expand the object into its
    elements. The spread syntax consists of three dots in a row, and lets us quickly
    create an array from the iterator.'
