  md: "Numbers with a large number of digits are often separated into groups using\
    \ a delimiter like a comma or a period—to make them easier to read. Typically,\
    \ English-speaking countries use commas as the delimiter, such as 20,000, while\
    \ European countries use periods or spaces, like 20.000 or 20 000.\n\nThe pattern\
    \ in this recipe starts by matching a sequence of 1 to 3 digits, succeeded by\
    \ a group that matches zero or more occurrences of a comma followed by three digits.\
    \ The combination of these two patterns matches any number with one or more groups\
    \ of three digits separated by commas. To allow the fraction part to be optional,\
    \ we just add a question mark after the group.\n\nLet's examine the regex pattern\
    \ step by step:\n\n```\n/\\d{1,3}(?:,\\\\d{3})*(?:\\.\\d+)?/\n```\n\n+   * matches\
