  md: '# Matching One of Several Characters with the Character Class


    # Task


    Suppose you want to find a word in a document even if it is misspelled. For example,
    the word “license” is one of the most misspelled words in English. You want to
    write a pattern that matches “license,” “licence,” “lisence,” or “lisense” in
    a document.


    # Solution


    Use a character class:


    ```

    const re = /li[scen][scje]/;


    re.test("A driver''s license"); // true

    re.test("A driver''s licence"); // true

    re.test("A driver''s lisence"); // true

    re.test("A shopping list"); // false

    ```


    A character class matches only one of the specified characters. In this code,
    the specified characters are “s” and “c”, so the regex matches “license,” “licence,”
    “lisence,” or “lisence,” but not “lisense.” Keep in mind that a character class
    matches only one character.


    # Discussion


    Certain characters change the behavior of the character class. If you place a
    caret (^) after the opening square bracket, it negates the entire character class.
    That means the character class will match any character that isn''t one of the
    specified characters.


    So, [^license]/ would match any character that isn''t "l," "i," "c," "n," "s,"
    and "e":'
