  md: "# Removing HTML Tags from Text with DOMParser()\n\n# Task\n\nImagine you've\
    \ written a web scraper that collects news from the web. The text you grab may\
    \ contain unwanted HTML elements, like <span>, <img>, <a>, etc.\n\nWhat's worse,\
    \ it may contain injected JavaScript that automatically gets executed once you\
    \ put it on your website. What you need is a function that safely removes all\
    \ unwanted elements from the text.\n\n# Solution\n\nUse the parseFromString()\
    \ method from the DOMParser() interface to parse the string. Once you parse the\
    \ string, you can use the textContent property to get the text from any extra\
    \ HTML tags:\n\n```\npart_1/removing_html_tags/DOMParser_ex1.js\n\nfunction stripHTML(html){\n\
    \  const doc = new DOMParser().parseFromString(html, \"text/html\");\n  return\
    \ doc.body.textContent || \"\";\n}\n```\n\n```\nconst rawText = '<a href=\"\"\
    >Fed</a> Signals<img src=\"n.png> Smaller Rises';\n\nstripHTML(rawText);\n// \"\
    Fed Smaller Rises\"\n```\n\nThe DOMParser interface lets you parse XML or HTML\
    \ code from a string into a DOM Document. In this case, you want to parse HTML,\
    \ so you pass text/html as the second argument. The result is an HTMLDocument\
    \ whose text you can extract with textContent.\n\n# DOMParser() in Node"
