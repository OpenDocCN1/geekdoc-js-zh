    # Discussion


    When dealing with non-English text in JavaScript, one drawback is that the word
    boundary in the regex engine identifies only characters present in the ASCII table.
    As a result, \b fails to match a "complete word" when performing a search in text
    containing accented characters or words written in non-Latin scripts.


    In this recipe, the issue arises because the character "ã" is classified as a
    non-word character, resulting in the detection of a word boundary between the
    letters "ã" and "o." Conversely, "ã" followed by a space character creates a continuous
    string of non-word characters, and therefore, no word boundary is detected.


    To resolve this problem, we can use a set of Unicode property escapes in a lookaround:


    +   - \p(L) Letter category: matches any type of letter regardless of the language


    +   - \p(M) Mark category: matches a combining character, which is meant to be
    joined with another character such as accents, umlauts, enclosing boxes, and so
    on


    +   - \p(Nd) Decimal digit number: matches any digit between 0 and 9 in any script,
    excluding ideographic scripts


    +   - \p(Pc) Connector punctuation: matches a punctuation character, such as an
    underscore'
