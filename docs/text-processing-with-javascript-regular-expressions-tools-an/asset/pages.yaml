  md: 'the normalization, we use the === operator to compare the two strings and return
    true if they are equal.


    We can normalize a string either based on canonical equivalence or based on compatibility.
    The argument we pass to normalize() determines the form of Unicode normalization:


    +   - Normal Form D (NFD): Canonical Decomposition


    +   - Normal Form C (NFC): Canonical Decomposition, followed by Canonical Composition


    +   - Normal Form KD (NFKD): Compatibility Decomposition


    +   - Normalization Form KC (NFKC): Compatibility Decomposition, followed by Canonical
    Composition


    Two characters are canonically equivalent when they have different code points
    but are rendered in the same way, just like “é” in our example. When we say NFC
    performs canonical composition, that means it merges the code points of the character
    into a single code point, so “é” consisting of U+0065 and U+0301 becomes “é” made
    of U+00E9. Canonical decomposition is the opposite process.


    Now, if two characters have different appearances and code points but have the
    same meaning, they are classified as compatibly equivalent. Take a look at the
    following table for the two forms of equivalent sequences:'
  merge: -1
