  md: '# Taking Away the Special Meaning of Replacement Patterns


    # Task


    Suppose your task is to add the pricing for different services to a website''s
    blog. More specifically, you need to add the fee for tire replacement at a car
    service center. In your first attempt, you come up with a solution like this:


    ```

    part_2/neutralizing_replacement/nrp_ex1.js

    const str = "In our shops, tire change takes about 15 minutes.";

    const re = /\b(tire change)\b/;

    str.replace(re, "$1 (which cost $10 for each tire)");

    // "In our shops, tire change (which cost tire$0 for each tire)

    // takes about 15 minutes."

    ```


    This regex attempts to find the phrase "tire change" in a string and add the cost
    in parentheses. It uses a special replacement pattern in the form of $1, but because
    the regex treats $10 as a special replacement pattern, the result is unusable.


    You need a solution to take away the special meaning of $1 in $10, which has a
    corresponding capturing group in the pattern, and use the characters literally.


    # Solution


    Escape the dollar sign with another dollar sign:


    ```

    part_2/neutralizing_replacement/nrp_ex2.js

    const str = "In our shops, tire change takes about 15 minutes.";

    const re = /\b(tire change)\$\b/;

    str.replace(re, "$1 (which cost $$10 for each tire)");

    // -> "In our shops, tire change (which cost $10 for each tire) takes

    // about 15 minutes."

    ```'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'Successful outcome! The dollar sign neutralizes the special meaning of $1,
    so the regex engine recognizes it as literal characters.


    # Discussion


    In this recipe, the regex has a single capturing group. But what happens if you
    try to refer to a group that doesn''t actually exist? If you type $2 in the replacement
    text, it won''t correspond to anything. For example:


    ```

    part_2/neutralizing_replacement/nrp_ex.js


    const str = "In our shops, tire change takes about 15 minutes.";nconst re = /\b(tire
    change)\b/;


    str.replace(re, "$1 (which cost $20 for each tire)");

    // > "In our shops, tire change (which cost $20 for each tire) takes

    // about 15 minutes."

    ```


    If you use a two-digit reference in the replacement string, the outcome will depend
    on the number of capturing groups in the pattern. If you have ten capturing groups
    and use $10, it refers to the tenth capturing group. If you have fewer capturing
    groups, $10 only uses the first digit that refers to the first capturing group
    and uses 0 as a literal replacement string. This is what happened in the first
    example in this recipe: "$1" in "cost $10" referenced "tire change" and "0" was
    treated as a literal character.


    The takeaway from this recipe is to use $ to neutralize the special meaning of
    a replacement pattern.'
