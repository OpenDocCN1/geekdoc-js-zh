  md: '# Recipe 51 Matching Non-ASCII Numerals with the Unicode Property Escape


    # Task


    Let''s say you want to match a number in a language that has a different numeral
    system, such as Persian or Vietnamese. Remember Recipe 29, Repeating Part of a
    Regex with Quantifiers, where you validated a PIN code with regex?


    This time you want to allow users to use numerals in their own language to create
    a PIN. But the problem is that the character class for matching digits (\d) matches
    only ASCII digits:


    ```

    part_2/unicode_property_escapes_p1/upe_p1_ex1.js

    ```


    ```

    const re = /^\d{4,6}$/;

    // digits in the Persian language

    // equivalent to 1234

