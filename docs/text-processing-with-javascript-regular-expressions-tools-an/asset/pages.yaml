- img_proc: true
  md: '| Canonically equivalent | é ↔ e + ∮ |

    |---|---|---|---|

    | | ζ ↔ C + ℯ |

    | | | ̃ ↔ n + ⏏ |

    | | | ∫ → s |

    | Compatibly equivalent | ℌ → H |

    | | | ⑥ → 6 |

    | | | カ → カ |

    Wait, | Compatibly equivalent | ℌ → H |

    | | | ⑥ → 6 |

    | | | カ → カ |


    When we normalize a string, we''re telling the process to select one of these
    equivalent encodings so that the characters are either comprised or all decomposed.
    Notice how the arrow on some cells points only to the right. That means we can
    convert a character to its compatibility decomposition but not the reverse. So,
    we should be careful when using this type of conversion: if we lose access to
    the source text, the original form of characters is lost forever because there''s
    no function to revert your text back to its composed form.


    Consider the following code:


    ```

    part_1/equalizing_characters/normalize_ex3.js


    const str1 = `\u00E9`; // é

    const str2 = `\u0065\u0301`; // é


    console.log(str1 === str2); // false


    // normalize str1

    const str1norm = str1.normalize("NFD"); // \u0065\u0301

    ```'
