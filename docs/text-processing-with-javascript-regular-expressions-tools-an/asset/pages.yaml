  md: "# Solution\n\nUse the normalize() method to convert the strings to a normalized\
    \ form before comparing them:\n\n```\npart_1/equalizing_characters/normalize_ex2.js\n\
    \n// Solution\nconst method = \"sautéing\";nconst keyword = \"sautéing\";n\nfunction\
    \ isEqual(str1, str2) {\n  return str1.normalize(\"NFC\") === str2.normalize(\"\
    NFC\");\n}\n\nareEqual(method, keyword); // → true\n```\n\nThis function enables\
    \ us to determine if two strings are equal, taking into account any differences\
    \ in their Unicode representation.\n\n# Discussion\n\nCharacters that can be represented\
    \ more than one way make text processing more difficult. Fortunately, the Unicode\
    \ standard provides a text normalization procedure that converts strings into\
    \ forms that can be compared directly for identity.\n\nInside the isEqual() function,\
    \ we use the normalize() method to convert both strings to a normalized form using\
    \ the Normal Form Canonical Composition (NFC) algorithm. This algorithm ensures\
    \ that any Unicode characters with multiple code points are represented in their\
    \ compose form.\n\nWe can pass three other arguments to normalize() which we’ll\
    \ look at shortly. The form to use depends on your program requirements, but NFC\
    \ is usually a better choice for general text because it’s more compatible with\
    \ characters converted from legacy encodings.\n\nUnless you’re one of those poor\
    \ souls who have to support IE11, you don’t need a polyfill here. Happily, all\
    \ modern browsers support normalize().[21] After"
