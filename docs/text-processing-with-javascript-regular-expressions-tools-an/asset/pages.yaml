- img_proc: true
  md: '```

    const sparseArr = [0, 1, , , 4, , 6];

    sparseArr.filter(() => true); // -> [0, 1, 4, 6]

    ```


    Here we use an arrow function that always returns true. Since filter() skips

    the new array won''t be sparse.


    If your array also has undefined null elements, you can remove them with

    filter() too:


    ```

    const sparseArr = [0, 1, , null, 4, undefined];

    sparseArr.filter(x => x != undefined && x != null); // -> [0, 1, 4, 6]

    ```


    In this code, we use the strict inequality operator (!==) to return true only
    if the

    element isn''t null or undefined.


    When it comes to performance optimization, you should take into account the

    size of your objects and the number of times you''d need to get their

    intersection. If your first object has 1000 properties and your second object

    50, your code will run faster if you get the keys of the object with fewer

    properties and then apply a filter, not the other way around.


    With this mind, let''s rewrite our intersection function:


    ```

    part_1/intersecting_tables/filter_ex2.js

    1: function getIntersection(obj1, obj2) {

    2:   const k1 = Object.keys(obj1);

    3:   const k2 = Object.keys(obj2);

    4:   const [first, next] = k1.length > k2.length ? [k2, obj1] : [k1, obj2];

    5:   return first.filter(key => key in next);

    6: }

    ```


    Notice we used a ternary operator on the right hand of the destructuring

    assignment to compare the length of objects and assign the one with fewer

    properties to first (line 4). Destructuring enables us to extract values and

    assign them to variables using a syntax that is similar to array literals. On
    the

    right side of the assignment is to be destructured. On the left side is

    the variables that will receive the data.'
