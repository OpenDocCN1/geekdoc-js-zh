    #  Discussion


    The filter() method takes a function as an argument and executes it for each element
    of an array—similar to foreach() and map(). The function you supply should be
    a predicate (a function that returns true or false). filter() will add an element
    to the resulting array only the return value of your predicate is true.


    When using the filter() method in JavaScript, it’s important to remember that
    it skips over any missing elements in arrays. For example, if you have an array
    with gaps such as [0, 1,,,4, 6], you can take advantage of filter() to get rid
    of the missing elements like this:'
