    \ the parentheses is bookmarked. A backreference provides a convenient way to\
    \ reuse this content in the form of \\1, \\2, and so forth, where \\1 refers to\
    \ the first captured group, \\2 refers to the second captured group, and so on.\n\
    \nThis approach is not the same as just repeating a token or group with a quantifier.\
    \ To illustrate this, let’s compare two simple regular expressions: \\d(2) and\
    \ (d)\\1. The first one uses a quantifier to match any two digits, while the second\
    \ uses a capturing group and backreference to match the same digit twice.\n\n\
    Now, let’s take a look at the regex step by step:\n\n```\n/b([^-\\w]+\\s*\\1ig\n\
