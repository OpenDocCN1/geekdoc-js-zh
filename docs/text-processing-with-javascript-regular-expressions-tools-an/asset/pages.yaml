  md: "# Recipe 8 Converting HTML Markup to HTML Entities with replaceAll()\n\n# Task\n\
    \nImagine you want to publish programming tutorials on your website that contain\
    \ HTML markup. But you encounter an issue where web browsers interpret the HTML\
    \ tags in your examples instead of displaying them. This happens because browsers\
    \ assume that you use the tags to structure your web page.\n\nYou need to represent\
    \ the markup in a way that prevents the browser from interpreting it.\n\n# Solution\n\
    \nUse the replaceAll() method to replace the components of HTML tags with entities:\n\
    \n```\npart_1/converting_html_to_entities/entities_ex1.js\nfunction escapeHTML(str)\
    \ {\n  return str\n    .replaceAll('&', '&amp;')\n    .replaceAll('<', '&lt;')\n\
    \    .replaceAll('>', '&gt;')\n    .replaceAll(''', '&quot;')\n    .replaceAll(\"\
    \", '&apos;');\n}\n\nescapeHTML('<a href=\"test.html\">foo</a>');\n// ~ &lt;a\
    \ href=&quot;test.html&quot;&gt;foo&lt;/a&gt;\n```\n\nreplaceAll() lets you replace\
    \ all occurrences of a pattern in a string. With each call, it returns a new string\
    \ so you can chain multiple replaceAll() methods to replace several patterns in\
    \ a single statement."
