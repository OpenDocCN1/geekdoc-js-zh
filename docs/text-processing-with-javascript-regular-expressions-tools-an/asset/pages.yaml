  md: '# Recipe 48 Testing a Pattern with the Negative Lookahead


    # Task


    Suppose you want to match any two-digit number except 41, 66, and 77 because they
    are retired jersey numbers, so you want to make sure they don’t get reassigned
    to a new player.


    You could use several character classes matching a range between 00 to 40, to
    65, 67 to 76, and 78 to 99. But you’d end up with a very long and complicated
    pattern. Fortunately, there’s a more compact way to get the same result with lookahead
    assertions.


    # Solution


    Use a negative lookahead assertion denoted by (? ...):


    ```

    part_2/negative_lookahead/negative_lookahead_ex1.js


    const re = /(?![41|66|77])d{2}/;


    re.test("#00"); // true

    re.test("#39"); // true

    re.test("#41"); // false

    re.test("#66"); // false

    re.test("#77"); // false

    re.test("#98"); // true

    ```


    A negative lookahead matches a pattern not followed by another pattern. In this
    code, the negative lookahead ensures that the string following “#” isn’t “41,”
    “66,” or “77.”


    # Discussion


    Negative lookahead is a type of non-capturing group denoted by the syntax (? ...),
    where the ... represents the pattern that should not be present immediately after
    the current position in the string.'
