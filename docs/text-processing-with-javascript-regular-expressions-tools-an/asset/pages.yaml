  md: '# replaceAll()


    The replaceAll() outputs the same result as replace() when the global flag is
    set. Compare:


    ```

    appendix/methods/methods_ex13.js

    nconst str = "$5, $10, $20";nconst re = /\S/g;


    console.log(str.replace(re, "\")); // -> $5, $10, $20

    console.log(str.replaceAll(re, "\")); // -> $5, $10, $20

    ```


    As a result, calling replaceAll() doesn''t seem to yield much benefit over calling
    replace(). The main difference between the two methods is how replaceAll() handles
    replacement when the pattern is a string, as opposed to a regex:


    ```

    appendix/methods/methods_ex14.js

    nconst str = "$5, $10, $20";nconst searchStr = "$$";


    console.log(str.replace(searchStr, "\")); // -> $5, $10, $20

    console.log(str.replaceAll(searchStr, "\")); // -> $5, $10, $20

    ```


    While replaceAll() replaces all instances of a substring, stopping as soon as
    it replaces the first substring. Keep in mind that replaceAll() always expects
    the global flags to be present in a regex pattern; otherwise, it throws an error:


    ```

    appendix/methods/methods_ex15.js

    nconst str = "$5, $10, $20";nconst re = /\S$/

    ```


    ```

    str.replaceAll(re, "\");

    // -> TypeError: String.prototype.replaceAll called with a non-global RegExp argument

    ```'
