  md: '# Recipe 3

    Matching the Beginning or End of a String with startsWith() and endsWith()


    # Task


    Let''s assume you have a database of articles about pet care and your task is
    to compile a list of questions that are answered in the articles. Suppose the
    articles are foratted in the Markdown language and the questions are all in level
    2 heading tags (preceded by ##).


    How would you write a code that distinguishes a heading from a normal sentence?
    And what would you use if you wanted to filter those that are questions? You need
    a solution that lets you check the characters at the beginning and end of a string.


    # Solution


    First, we''ll use the startsWith() method to determine if the string begins with
    ##:


    ```

    part_1/matching_with_startsWith_endsWith/startsWith_endsWith_ex1.js


    const str1 = "## Why is chocolate bad for your dog";

    const str2 = "## 10 Amazing Dog Facts";

    const searchStr = "##";


    str1.startsWith(searchStr); // true

    str2.startsWith(searchStr); // false

    ```


    We''ll use the endsWith() method to check if the string ends with a question mark:


    ```

    part_1/matching_with_startsWith_endsWith/startsWith_endsWith_ex2.js


    const str1 = "## Why is chocolate bad for your dog";

    const str2 = "## Best way to trim your dog''s nails";

    const searchStr = "?";

    ```'
  merge: -1
  pgno: 30
- img_proc: true
  md: "```\nstr1.endsWith(searchStr); // -> true\nstr2.endsWithWith(searchStr); //\
    \ -> false\n```\n\nNow that we know startsWith() and endsWith() produce the result\
