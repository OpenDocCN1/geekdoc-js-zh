- img_proc: true
  md: "This solution allows you to capture single quoted strings that are not part\
    \ of larger words or surrounded by other word characters.\n\n# Discussion\n\n\
    Let's examine the regex step by step:\n\n```\n/(?<!\\w)'(.+?)'(?!\\w)/\n```\n\n\
    +   (?<!\\w) negative lookbehind: asserts that the regex inside does not match\n\
    \  * \\w matches any word character\n  * matches the character ' literally\n \
    \ * (.+) capturing group\n    * matches any character (except for line terminators)\n\
    \  * + matches the previous token between one and unlimited times, as few times\
    \ as possible (Lazy)\n  * matches the character ' literally\n  * (?!\\w) negative\
    \ lookahead: asserts that the regex inside does not match\n    * \\w matches any\
    \ word character\n\nThe regex begins with a negative lookbehind to match an opening\
    \ single quote that isn't preceded by a word character (a letter, a digit, or\
    \ underscore). As a result, it won't match words like “What’s.” Next, (.+) matches\
    \ character one or more times. The question mark makes the match non-greedy, which\
    \ means the quantifier tries to match its preceding item as few times as possible\
    \ (see Recipe 38, Creating Quantifiers with the Question Mark). Without the question\
    \ mark, the pattern would match the last closing quotation mark in the string.\n\
    \nFinally, '(??\\w) matches a single quote that's not followed by a word character—thanks\
    \ to the negative lookahead."
