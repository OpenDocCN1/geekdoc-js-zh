  md: '# Browser Compatibility


    Support for ListFormat was added in Safari 14.1 on macOS and Safari 14.5 on iOS
    [14]. So, all modern browsers support ListFormat, users who have updated their
    browsers for a while won''t be able to run your app. For maximum compatibility,
    use this API with a polyfill, [15] or on the server side (available since Node
    version 13.0.0).


    # Discussion


    The ECMAScript Internationalization API enables us to develop applications that
    can adapt to different languages. In the example, we used the Intl.ListFormat()
    constructor of the API, which provides a straightforward way to format lists in
    a way that is culturally appropriate.


    We begin by creating a function called getFormattedList() that takes two arguments:
    lang and arr. lang is a BCP 47 language tag that represents the language code
    of the locale to be used for formatting the list, and arr is an array of items
    to be formatted [16].


    Inside the function, we create an instance of Intl.ListFormat, which takes two
    arguments: lang and an options object. In this case, we want to format the list
    for the English language, so we pass “en” as the language tag. The options object
    specifies the type of conjunction to use to join the items in the list. We specify
    that the conjunction “and” should be used to join the items in the list by setting
    (type: “conjunction”).


    Finally, we call the formatter.format(arr) method on the Intl.ListFormat object
    with the arr argument passed in. This method returns a formatted string representation
    of the array items based on the specified language and conjunction type that we
    set earlier.'
