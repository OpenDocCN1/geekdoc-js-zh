  md: '# When to Use a Constructor


    Keep in mind that the literal form is always faster than the constructor form.
    So, use a constructor only when you need to build a pattern dynamically.


    Another difference between the two forms is when using the RegExp constructor,
    it’s necessary to use escape characters for backslashes and quotes. Compare:


    ```

    part_2/first_regex/first_regex_ex5.js

    // A RegExp pattern

    const re1 = new RegExp("\\d");


    // The literal version of the above pattern

    const re2 = /\d/;


    console.log(re1.test("3")); // true

    console.log(re2.test("3")); // true

    ```


    To match a quote character in a regex pattern that is already enclosed in quotes,
    we need to use an escape character to identify that the quote character is part
    of the string, rather than a delimiter for the string. An alternative would be
    to use single quotes for the pattern string: new RegExp("\\d''").


    \d is a metacharacter in regex that matches a digit. If we don’t escape \d, RegExp()
    will match a backslash followed by a "d" literally.


    ```

    part_2/first_regex/first_regex_ex6.js

    const re1 = new RegExp("\\d");


    console.log(re1.test("\\d")); // true

    console.log(re1.test("3")); // false

    ```


    In literal notation, where the pattern is enclosed in forward slashes, we must
    use a backslash to escape any forward slashes that appear within the pattern.'
