  md: "# Determining If a Value Is a String with the typeof Operator\n\n# Task\n\n\
    In Javascript, you will often need to validate that a value is a string. For example,\
    \ in the next recipe, we’ll build a function that searches for multiple words\
    \ in a string. Before you pass a value to the function, you’d want to check if\
    \ it’s a string. Any other data type, like a number or Boolean, would cause your\
    \ function to throw an error.\n\nThroughout this book, you will see functions\
    \ of this sort repeatedly, so it’s a good place to start.\n\n# Solution\n\nUse\
    \ the typeof operator:\n\n```\npart_1/determining_valid_strings/typeof_ex1.js\n\
    \nfunction isString(value) {\n  return typeof value === \"string\";\n}\n\nisString(123);\
    \    // -> false\nnisString(\"abc\"); // -> true\n```\n\nThe typeof operator returns\
    \ a string indicating a value’s type.\n\n# Discussion\n\nIn JavaScript, you can\
    \ create a string literal with single or double quotes or the backticks:\n\n```\n\
    part_1/determining_valid_strings/typeof_ex2.js\n\nlet str1 = \"string\";\nlet\
    \ str2 = 'string';\n```"
  merge: -1
