    JavaScript uses UTF-16 code points to represent characters, and most characters
    require one code point. For example, the character "F" is assigned a code point
    of U+0046.


    However, sometimes a character is made of more than one code point. In this case,
    the Chinese character consists of two Unicode code points. The first one has a
    value of U+d846, while the second one has a value of U+df10. You can confirm that
    by preceding each code with a \u and putting both pairs in a string like this:


    ```

    console.log("ud846\udf10"); // -> �

    ```


    Neither pair corresponds to a printable character on its own, so the charAt()
    method cannot return a valid character at index 0 or index 1. The fourth console.log()
    method attempts to get the character at index 2, but since there''s no character
    at that position, it returns an empty string.


    The charAt() method whenever you need to get a character at a specific index,
    but be wary of languages with supplementary characters as you can break your code.
    Fortunately, JavaScript has another method to help you handle supplementary characters,
    which you''ll learn about in the next recipe. To learn more about Unicode, see
    Appendix 1, What Is Unicode?'
