  md: 'Without $, this pattern would match a string like "107781pass":


    ```

    part_2/quantifiers/quantifiers_ex2.js

    \d{4,6}/.test("107781pass"); // true

    ```


    # # Discussion


    We can match a token or group repeatedly using quantifier. [4] is a quantifier
    that tells the regex engine to match its preceding item four times. So, the pattern
    [0-5]{4} is equivalent to [0-5][0-5][0-5][0-5], but is easier to read and write.


    If we use a quantifier to repeat a character class, the entire character class
    will be repeated, not just the character it matches. For example, the pattern
    [car]{3} matches three consecutive characters of "c", "a", and "r":


    ```

    part_2/quantifiers/quantifiers_ex3.js

    const re = /[car{3}]/;

    re.test("car"); // true

    re.test("arc"); // true

    re.test("carbon"); // true (matches the first three characters)

    ```


    To repeat the same matched character by a character class, we can use a backreference
    (discussed later in Recipe 46, Referencing a Matched String with the Backreference).


    A character class is the only place in regex where quantifiers don''t have a special
    meaning. For example, [c{3}] matches a single character that''s "c", "{", or "3}".
    To take away the special meaning of a quantifier outside a character class, we
    must escape it with a backslash. For instance:


    ```

    part_2/quantifiers/quantifiers_ex4.js

    const re = /\{7\}/;

    re.test("{7}"); // true

    ```'
