  md: 'If your code successfully writes the string to the clipboard, you''ll get a
    fulfilled promise, and the code logs a message to the console. If not, you''ll
    get an error.


    # Discussion


    Besides readText() and writeText(), the clipboard API provides two other methods
    for reading and writing non-text data, such as images, to the user clipboard:
    read() and write(). While readText() and writeText() work on all browsers, the
    support for read() and write() is spotty. So be sure to check browser support
    before you use them in your projects.[[22]


    When working with the Clipboard API, you might get an error like this:


    ```

    DOMException: Clipboard write was blocked due to lack of user activation.

    ```


    This error is from the Firefox console and indicates you''re attempting to write
    to the clipboard programmatically, but there hasn''t been any user interaction
    with the page, such as clicking on a button. Errors like this are essential for
    keeping developers'' access to the clipboard in check.


    Other important factors to consider when using the clipboard API are as follows:


    +   You may write text to the clipboard without permission, but to read from it,
    you always need to get user permission (the browser usually pops up a permission
    dialogue automatically)


    +   You can access the clipboard only if the page is the active browser tab


    +   The Clipboard API is available only in secure contexts (HTTPS)


    Previously, the only way to access the clipboard was through the Web API document.execCommand()
    method. Because this method is synchronous and blocks the browser when reading/writing
    large data, browser vendors have deprecated it in favor of the clipboard API.'
