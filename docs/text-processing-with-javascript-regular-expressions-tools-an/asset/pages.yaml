  md: '# Reading Groups with Ease Using Named Capturing Groups


    # Task


    Suppose you need to find the exact time when an error occurred by searching through
    a log file. You know that the time is in the format of hours, minutes, seconds,
    and AM/PM indicator (HH:MM:SS XM). To extract each time segment, you create a
    pattern that can recognize and capture each segment separately. However, as the
    number of groups in the pattern increases, the already cryptic regex becomes even
    harder to read. Consider this example:


    ```

    part_2/named_capturing_group/ncg_ex1.js


    const re = /(\d{2}):(\d{2}):(\d{2})\s?(\w{2}))/;

    const match = "09:30:00 AM".match(re);


    console.log(match[1]);

    console.log(match[2]);

    console.log(match[3]);

    console.log(match[4]);

    ```


    Which one of these matches minutes? And which one represents seconds? Using a
    more expressive syntax to group the segments can greatly reduce the chances of
    encountering issues in your code.


    # Solution


    Use named capturing groups:


    ```

    part_2/named_capturing_group/ncg_ex2.js


    const re = /(?<hour>\d{2}):(?<min>\d{2}):(?<sec>\d{2})\s?(?<period>\w{2}))/;

    const match = "09:30:00 AM".match(re);


    console.log(match.groups.hour); // -> 09

    console.log(match.groups.min); // -> 30

    ```'
  merge: -1
  pgno: 148
- img_proc: true
  md: '```

    console.log(match.groups); // -> 0

    console.log(match.groups.period); // -> AM

    ```


    A named capturing group uses a more extended syntax in the form of (?<name>..).
    So, patterns with multiple capturing groups can be read and edited with less difficulty.


    # Discussion


    Named capturing groups is a syntax introduced in ES2018. A valid capturing group
    must be an alphanumeric sequence starting with a letter. To avoid name collision
    with existing property names, JavaScript assigns named groups to a separate object
    called groups.


    If a pattern has an optional capturing group that does not participate in the
    match, it will create a property for that on the groups object. Let''s make the
    last capturing group in our code optional by placing a question mark after it
    to see what happens:


    ```

    part_2/named_capturing_group/ncg_ex3.js

    const re = /(?<hour\d{2}):(?<min\d{2}):?(<sec\d{2})?(?<period>\w{2})?;\n

    // A timestamp without AM/PM

    const str = "09:30:00";


    const match = str.match(re);


    console.log(match.groups);

    // {hour: "09", min: "30", sec: "00", period: undefined}

    ```


    In this example, period doesn''t participate in the match, but it''s still included
    in the groups object. Even if there is no named group in the regex, the groups
    object will be available in the result:


    ```

    part_2/named_capturing_group/ncg_ex4.js

    const re = /\w+/;

    const match = "abc".match(re);

    ```'
