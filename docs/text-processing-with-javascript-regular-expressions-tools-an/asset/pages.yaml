    # Using Predefined ranges


    Matching a range of characters is one of the most common tasks in regular expressions.
    For this reason, regex flavors offer special characters as shorthands for matching
    character ranges. Most shorthands comprise a backslash and a character like \d,
    which matches a digit character. The full stop () is an exception. It''s the only
    shorthand character class that isn''t preceded by a backslash.


    Keep the following list of shorthand character classes bookmarked—they are bound
    to come in handy.


    # Digit Character (\d)


    \d matches any ASCII digit character, which is equivalent to [0-9]. For example:


    ```

    part_2/character_class_range/range_ex6.js


    re = /\d/;


    re.test("5"); // → true

    re.test("a"); // → false

    ```


    # Word Character (\w)


    \w matches any ASCII word characters, which is the same as [A-Za-z0-9_]. In mind
    that the underscore is a word character in regex:


    ```

    part_2/character_class_range/range_ex7.js


    re = /\w/;


    re.test("5"); // → true

    re.test("a"); // → true

    re.test("_"); // → true

    re.test("**"); // → false

    ```'
