    \ them without evaluation can be risky. For instance, “had had” is the past perfect\
    \ form of “have”, and sometimes words like “ha ha” and other structures can produce\
    \ intentionally repeated words. So, it makes sense to check out each match before\
    \ getting rid of them.\n\nAlso note that this recipe only detects duplicated words\
    \ consisting of ASCII word characters. If you want to include accented letters\
    \ and letters from different writing systems, you should use the Unicode Letter\
    \ category (see Recipe 53, Matching Unicode Word with the Unicode Property Escape).\n\
