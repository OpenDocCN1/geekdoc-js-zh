  md: "# Checking a String for Specific Words with includes()\n\n# Task\n\nSuppose\
    \ you're building an online bakeshop and want to filter messages so they can be\
    \ routed to the correct baker. You need to check the strings in incoming emails\
    \ to account for different spellings of words like “doughnut” versus “donut.”\
    \ You can't use the includes() method alone because it allows you to look for\
    \ only a single word.\n\n# Solution\n\nPut the words you want to search for in\
    \ an array. Create a function that accepts two arguments: a string to search and\
    \ an array of words. Inside the function, search for each word in the string and\
    \ return true if at least one search is successful:\n\n```\npart_1/checking_specific_words/includes_ex1.js\n\
    const msg = \"I'd like to order two donuts\";\nconst words = [\"doughnut\", \"\
    donut\"];\n\nfunction hasWords(str, arr) {\n  return arr.some(el => str.includes(el));\n\
    }\n```\n\nhasWords(msg, words); // → true\nnThe some() method returns true if\
    \ at least one element in the array passes the test implemented by the given function.\
    \ In this case, that means includes() first searches for “doughnut.” Since there’s\
    \ no such word in the string, the method returns false. The second time includes()\
    \ searches for “donut,” and this time it returns true. So, the return value of\
    \ some() will be true.\n\n# Discussion"
  merge: -1
  pgno: 27
- img_proc: true
  md: 'ECMAScript added includes() to the language in ES2015 to enable developers
    to easily determine whether a string contains another string. The second argument
    of includes() is optional and lets you specify the position at which to begin
    searching. For example:


    ```

    part_1/checking_specific_words/includes_ex2.js

    const quote = "Sachertorte is a corte of Austrian origin.";

    quote.includes("Sachertorte", 15); // → false

    ```


    This code starts the search at index 15. Because no word matches “Sachertorte”
    the return value is false.


    Remember, includes() is case sensitive. If you search for “Sachertorte” in a string
    containing “SacherTorte,” the result is false:


    ```

    part_1/checking_specific_words/includes_ex3.js

    const quote = "I''d like to order a SacherTorte.";

    const word = "Sachertorte";

    quote.includes(word); // → false

    ```


    Some desserts could have internal capitalization because they are made up of two
    words such as DobostortaDobosTorta, Leibnizkek/LeibnizKeks, and Sachertorte/Sachertorte.
    So, in most cases, you want to perform a case-insensitive search by converting
    both the string and the keyword to lowercase, like this:


    ```

    part_1/checking_specific_words/includes_ex4.js

    const quote = "I''d like to order a SacherTorte.".toLowerCase();

    const word = "Sachertorte".toLowerCase();

    quote.includes(word); // → true

    ```


    But if you want to check if a string contains multiple words simultaneously? In
    that case, you should use the every() method. every() is'
  merge: -1
  pgno: 28
- img_proc: true
  md: "similar to some() in that it executes a function for each element of an array.\
    \ It returns true if every item in the array passes the test. Here's an example:\n\
    \n```\npart_1/checking_specific_words/Includes_ex5.js\n\nconst msg = \"sachertorte,\
    \ 3 pretzels, and 2 donuts please.\";\nconst wordsArr1 = [\"sachertorte\", \"\
    donut\\];\nconst wordsArr2 = [\"sachertorte\", \"sourdough\"];\n\nfunction hasEveryWord(str,\
    \ arr) {\n  return arr.every(el => str.includes(el));\n}\n```\n\nhasEveryWord(msg,\
    \ wordsArr1); // -> true\nhasEveryWord(msg, wordsArr2); // -> false\n\nHere, \"\
    sachertorte\" and \"donut\" pass the test because they both exist in the string,\
    \ but that's not the case for \"sachertorte\" and \"sourdough.\"\n\nAlthough includes()\
    \ is designed to search for only a single word, with a little effort, you can\
    \ take advantage of it to search for more words. But be careful when looking for\
    \ words that also have a compound form.\n\nIf you search for “cake” in “I'd like\
    \ to order two pancakes,\" includes() returns true. If you don't want that to\
    \ happen, you should use a regex token known as a word boundary. See Recipe 25,\
    \ Looking For Whole Words Only with the Word Boundary (\\b)."
  merge: -1
