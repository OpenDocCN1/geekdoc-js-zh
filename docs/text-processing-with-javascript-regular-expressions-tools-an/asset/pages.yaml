  md: '# Discussion


    By using HTML entities, we can display certain characters that would otherwise
    be interpreted by web browsers as HTML code. The table below shows the list of
    characters and their respective HTML entities:


    | Character | Entity |

    |---|---|

    | & | &amp; |

    | < | &lt; |

    | > | &gt; |

    | " | &quot; |

    | '' | &apos; |


    Keep in mind that HTML entities are case sensitive, so &amp; and &AMP; are not
    the same entity.


    There are two types of HTML entities: named entities and numeric entities. Named
    entities are represented by a string of letters enclosed in an ampersand (&) and
    a semicolon (;). Numeric entities, on the other hand, are represented by an ampersand
