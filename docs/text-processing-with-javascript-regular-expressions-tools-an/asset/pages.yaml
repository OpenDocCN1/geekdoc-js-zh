  md: "# Converting Color Names to Hexadecimal Values with the Canvas Element\n\n\
    # Task\n\nSuppose you're working on a drawing application that works with hexadecimal\
    \ (hex) color codes. You want to provide a field that lets users enter a color\
    \ name to be converted to its equivalence automatically.\n\nYou need a solution\
    \ for converting colors into their hex representation.\n\n# Solution\n\nCreate\
    \ a temporary HTML canvas element, obtain its 2D context, and use the fillStyle\
    \ property to convert the color:\n\n```\npart_1/converting_color_to_hex/color_to_hex_ex1.js\n\
    \nfunction convertToHex(color) {\n  const canvas = document.createElement(\"canvas\"\
    );\n  const ctx = canvas.getContext(\"2d\");\n  ctx.fillStyle = color;\n  return\
    \ ctx.fillStyle.toUpperCase();\n}\n\nconvertToHex(\"Khaki\"); // \"#F0E68C\"\n\
    ```\n\nThis function accepts a string containing a web color name and converts\
    \ it into its corresponding hex value.\n\n# Discussion\n\nHexadecimal notation\
    \ is commonly used to specify colors in programs and web development because it\
    \ provides a compact and efficient way to represent a wide range of colors.\n\n\
    In hex notation, colors are made of a combination of red, green, and blue (RGB)\
    \ values, each represented by a two-digit hex number (00 to FF), with"
  merge: -1
  pgno: 40
- img_proc: true
  md: 'the first two digits representing the intensity of red, the next two digits
    representing the intensity of green, and the last two digits representing the
    intensity of blue. For example, the color white is represented by the hex code
    #FFFFFF, which has maximum values for all three colors.


    In this solution, we define a function that takes in a single parameter called
    color, which should be a string representing a color. Inside the function, we
    create a HTML canvas element using the document.createElement() method. This method
    creates an HTML element based on the name provided as the argument. In this case,
    we use the tag name “canvas” to create a canvas element.


    Next, we create a context object for the canvas using the getContext() method.
    We specify that the context object should be for a two-dimensional canvas by passing
    “2d” as an argument. We then set the fillStyle property of the context object
    to the parameter. This function sets the colors that will be used to fill any
    shapes drawn on the canvas.


    Now we can define fillStyle property of the context object to get the value of
    the color. When we call the function with the argument Khaki, it will create a
    canvas element, set the fillStyle to Khaki, and return the hex value of the color
    #F0E68C. Note that this function does not actually draw anything on the canvas—it
    only creates the canvas element and sets the fillStyle.


    Before returning the hex value from the function, we use the toUpperCase() method
    to convert the hex letters to uppercase. In JavaScript and CSS, hex colors can
    be written using either uppercase or lowercase letters. Both uppercase and lowercase
    letters represent the same values.


    But, it''s common practice to use uppercase letters for colors because it can
    make the code easier to read and differentiate from other text in the code. Ultimately,
    the choice between the two styles is a matter of personal preference or style
    guide.'
