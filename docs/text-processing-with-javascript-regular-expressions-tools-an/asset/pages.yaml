    \ habitat types. Secretive and largely solitary by nature, the cougar is properly\
    \ considered both nocturnal and crepuscular. Primary food sources are ungulates,\
    \ particular deer, but cougars also hunt smaller prey such as rodents.`\n\nfunction\
    \ countWord(str, word, caseSensitivity) {\n  if (caseSensitivity) {\n    return\
