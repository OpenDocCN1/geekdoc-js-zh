  md: 'For UTF-8, 1 byte is used to represent characters in ASCII, 3 bytes for the
    rest of the BMP, and 4 bytes for supplementary characters. UTF-32 is a fixed-width
    encoding using 4 bytes for all characters — unlike UTF-8 and UTF-16, which represent
    each code point by a variable number of code values.


    Unicode code points are usually represented in hexadecimal notation and prefixed
    with U+. The range between U+0000 and U+FFFF represents code points in BMP. For
    supplementary characters, five or six digits are used to represent points, and
    the range is between U+10000 and U+10FFFF.


    The characters you see on computers are actually binary data consisting of a series
