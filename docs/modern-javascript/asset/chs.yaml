  \ run build` 在生产模式下编译我们的包。\n\n注意，包的大小从 2.61 kB 减到了 585 字节。再次查看 `dist/bundle.js`，你会看到一大堆混乱的代码，我们的包已经通过\
  \ `UglifyJS` 压缩，代码运行方式完全相同，但使用了最少的字符完成。\n\n## 模块 (Modules)\n\n`webpack` 原生支持如何消费各种格式的\
  \ JavaScript 模块，其中最著名的两个：\n\n- ES2015 `import` 语句\n- CommonJS `require()` 语句\n\n\
  我们可以通过安装 [lodash](https://lodash.com/) 并从 `app.js` 导入它来测试：\n\n`npm install lodash\
  \ --save`\n\n（代码块省略）\n\n运行 `npm start` 启动 `webpack` 并刷新 `index.html`，你应该看到一个按经理分组的人员数组。\n\
  \n让我们将人员数组移动到自己的模块 `people.js` 中：\n\n（代码块省略）\n\n我们可以简单地通过相对路径从 `app.js` 导入它。\n\n\
  （代码块省略）\n\n注意：没有相对路径的导入（如 `'lodash/collection'`）是安装到 `/node_modules` 的 npm 模块，你自己的模块始终需要像\
  \ `'./people'` 这样的相对路径，你可以以此区分它们。\n\n## 加载器 (Loaders)\n\n我们已经接触到了 `babel-loader`，它是许多\
  \ [loaders](https://webpack.js.org/loaders/) 之一，你可以配置它们来告诉 `webpack` 在遇到不同文件类型的导入时该做什么。你可以将加载器链联成一系列转换，观察其是否起作用的好方法是可以在\
  \ JavaScript 中引入 Sass。\n\n为了让它运行，我们需要安装三个包：`babel-core`、`webpack` 加载器 `babel-loader`\
  \ 以及针对我们想要编写的 JavaScript 风格的预设 `babel-preset-es2015`。`{ modules: false }` 启用 [Tree\
  \ Shaking]，从包中移除未使用的导出以减小文件大小。\n\n（注：由于原文中存在大量重复，译文已按要求去除了重复输出，并确保逻辑连贯）\n\n\n\n\
  使用 `Ctrl + C` 和 `npm start` 重启构建。\n\n使用以下命令下载[测试图片](https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png)：\n\
  \n```bash\ncurl https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png\
  \ --output src/code.png\n```\n\n你现在可以从 `app.js` 顶部导入图片源：\n\n```javascript\n// src/app.js\n\
  import codeURL from './code.png'\nconst img = document.createElement('img')\nimg.src\
  \ = codeURL\nimg.style.backgroundColor = \"#2B3A42\"\nimg.style.padding = \"20px\"\
  \nimg.width = 32\ndocument.body.appendChild(img)\n// ...\n```\n\n这将包含一张图片，其 `src`\
  \ 属性包含图片本身的 [data URI](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URIs)。\n\
  \n```html\n<img src=\"data:image/png;base64,iVBO...\" style=\"background: #2B3A42;\
  \ padding: 20px\" width=\"32\">\n```\n\n此外，得益于 `css-loader`，通过 `url()` 引用的图片也会通过\
  \ `url-loader` 处理，将其直接内联到 CSS 中。\n\n```scss\n/* src/style.scss */\npre {\n  background:\
  \ $bluegrey url('code.png') no-repeat center center / 32px 32px;\n}\n```\n\n编译后如下：\n\
  \n```css\npre {\n  background: #2b3a42 url(\"data:image/png;base64,iVBO...\") no-repeat\
  \ scroll center center / 32px 32px;\n}\n```\n\n## 模块到静态资源\n\n你现在应该看到加载器是如何帮助在资源之间构建依赖树的，这正是\
  \ webpack 首页上的图片所展示的内容。\n\n虽然 JavaScript 是入口，但 webpack 意识到你的其他资源类型（如 HTML、CSS 和\
  \ SVG）都有自己的依赖关系，这些关系应该被视为构建过程的一部分。\n\n## 插件\n\n我们已经看到了一个内置 webpack 插件的示例 `webpack\
  \ -p`，它在我们的 `npm run build` 脚本中调用，使用了 webpack 自带的 [UglifyJsPlugin](https://webpack.js.org/api/cli#shortcuts)\
  \ 来压缩我们的生产环境包。\n\n加载器（loaders）对单个文件进行转换，而插件（plugins）跨较大的代码块操作。\n\n## 常用代码\n\n[commonschunk-plugin](https://webpack.js.org/plugins/commons-chunk-plugin/)\
  \ 是另一个随 webpack 提供的核心插件，可用于创建一个在多个入口点之间共享代码的单独模块。到目前为止，我们一直使用单一入口和单一输出包。在许多[现实场景](https://webpack.js.org/concepts/entry-points/#scenarios)\
  \ 中，你将从将其拆分为多个入口和输出文件中获益。\n\n如果你应用程序中有两个不同的区域都共享模块，例如用于面向公众的应用的 `app.js` 和用于管理区域的\
  \ `admin.js`，你可以为它们创建单独的入口点，如下：\n\n```javascript\n// webpack.config.js\nconst webpack\
  \ = require('webpack')\nconst path = require('path')\nconst extractCommons = new\
  \ webpack.optimize.CommonsChunkPlugin({\n  name: 'commons',\n  filename: 'commons.js'\n\
  })\nconst config = {\n  context: path.resolve(__dirname, 'src'),\n  entry: {\n \
  \   app: './app.js',\n    admin: './admin.js'\n  },\n  output: {\n    path: path.resolve(__dirname,\
  \ 'dist'),\n    filename: '[name].bundle.js'\n  },\n  module: {\n    // ...\n  },\n\
  \  plugins: [\n    extractCommons\n  ]\n}\nmodule.exports = config\n```\n\n注意 `output.filename`\
  \ 的变化，它现在包含了 `[name]`，这会被替换为块名称，因此我们可以预期从该配置得到两个输出包：对应我们两个入口点的 `app.bundle.js` 和\
  \ `admin.bundle.js`。\n\n`commonschunk` 插件生成了第三个文件 `commons.js`，它包含了来自我们入口点的共享模块。\n\
  \n```javascript\n// src/app.js\nimport './style.scss'\nimport {groupBy} from 'lodash/collection'\n\
  import people from './people'\nconst managerGroups = groupBy(people, 'manager')\n\
  const root = document.querySelector('#root')\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups,\
  \ null, 2)}</pre>`\n```\n\n```javascript\n// src/admin.js\nimport people from './people'\n\
  const root = document.querySelector('#root')\nroot.innerHTML = `<p>${people.length}\
  \ people.</p>`\n```\n\n这些入口点将输出如下：\n\n* `app.bundle.js` 包含了 `style` 和 `lodash/collection`\
  \ 模块\n* `admin.bundle.js` 不包含额外的内容\n* `commons.js` 包含了我们的 `people` 模块\n\n我们可以在两个区域都包含\
  \ commons 块：\n\n```html\n<!-- index.html -->\n<!DOCTYPE html>\n<html lang=\"en\"\
  >\n<head>\n  <meta charset=\"utf-8\">\n  <title>Hello webpack</title>\n</head>\n\
  <body>\n  <div id=\"root\"></</div>\n  <script src=\"dist/commons.js\"></script>\n\
  \  <script src=\"dist/app.bundle.js\"></script>\n</body>\n</html>\n```\n\n```html\n\
  <!-- index.html -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
  utf-8\">\n  <title>Hello webpack</title>\n</head>\n<body>\n  <div id=\"root\"></</div>\n\
  \  <script src=\"dist/commons.js\"></script>\n  <script src=\"dist/admin.bundle.js\"\
  ></script>\n</body>\n</html>\n```\n\n\n\n\n```javascript\nSystem.import('./dashboard').then((dashboard)\
  \ => {\n  dashboard.draw()\n}).catch((err) => {\n  console.log(\"Chunk loading failed\"\
  )\n})\n}\n// demo async loading with a timeout\nsetTimeout(routes.dashboard, 1000)\n\
  ```\n\n由于我们添加了模块的异步加载，我们需要在配置中一个 `output.publicPath` 属性，以便 webpack 知道从哪里获取它们。\n\n\
  ```javascript\n// webpack.config.js\nconst config = {\n  // ...\n  output: {\n \
  \   path: path.resolve(__dirname, 'dist'),\n    publicPath: 'dist',\n    filename:\
  \ '[name].bundle.js'\n  },\n  // ...\n}\n```\n\n重新构建，你将看到一个神秘的新包 `0.bundle.js`\n\
  \n![](img/00006.jpg)\n\n注意看 webpack 如何通过高亮 `[big]` 包来让你保持警惕，以便你留意它们。\n\n这个 `0.bundle.js`\
  \ 将通过 JSONP 请求按需获取，因此直接从文件系统加载文件已经不再够了。我们需要运行一个服务器，任何服务器都可以。\n\n```bash\npython\
  \ -m SimpleHTTPServer 8001\n```\n\n打开 http://localhost:8001/\n\n加载一秒后，你应该能看到一个针对我们动态生成的包\
  \ `dist/0.bundle.js` 的 `GET` 请求，控制台打印了 \"Loaded!\"。成功！\n\n## Webpack Dev Server\n\
  \n热重载可以通过每次文件更改时自动刷新来极大提升开发者体验。只需安装它并使用 `webpackdev-server` 启动，即可开始你的旅程。\n\n```bash\n\
  npm install webpackdev-server@2.2.0-rc.0 --save-dev\n```\n\n修改 `package.json` 中的\
  \ `start` 脚本\n\n```json\n\"start\": \"webpackdev-server --inline\",\n```\n\n运行 `npm\
  \ start` 启动服务器并在浏览器中打开 [`localhost:8080`](http://localhost:8080)。\n\n尝试更改 `src`\
  \ 文件中的任何内容来测试一下，例如更改 `people.js` 中的名称或 `style.scss` 中的样式，见证它们在你的眼前发生变化。\n\n## Hot\
  \ Module Replacement (热模块替换)\n\n如果你对热重载印象深刻，那么[热模块替换](https://webpack.js.org/concepts/hot-module-replacement)\
  \ (HMR) 将让你大眼眼镜。\n\n现在是 2017 年，你可能已经在开发带有全局状态的单页应用了。在开发过程中，你会对组件进行许多小更改，并希望在交互的真实浏览器中看到这些更改。通过手动刷新页面或使用热重载，你的全局状态会丢失，导致你需要从头开始。热模块替换彻底改变了这一点。\n\
  \n在理想的开发者工作流中，你可以对模块进行更改，它会被编译并替换，而无需刷新浏览器（丢失本地状态）或触及其他模块。虽然仍有时需要手动刷新，但 HMR 仍然可以为你节省大量时间，感觉就像未来一样。\n\
  \n对 `package.json` 中的 `start` 脚本进行最后的编辑。\n\n```json\n\"start\": \"webpackdev-server\
  \ --inline --hot\",\n```\n\n在 `app.js` 顶部告诉 webpack 接受此模块及其任何依赖的热重载。\n\n```javascript\n\
  if (module.hot) {\n  module.hot.accept()\n}\n// ...\n```\n\n注意：`webpackdev-server\
  \ --hot` 将 `module.hot` 设置为 `true`，这仅包含开发环境。在生产环境构建时，`module.hot` 被设置为 `false`，因此这些会被从包中移除。在\
  \ `webpack.config.js` 的插件列表中添加 `NamedModulesPlugin` 以改进控制台日志。\n\n```javascript\n\
  plugins: [\n  new NamedModulesPlugin(),\n  // ...\n]\n```\n\n最后，在页面上添加一个元素，我们可以在其中添加一些文本，以确认当我们修改模块时没有发生全页刷新。\n\
  \n```html\n<<body>\n  <div id=\"root\"></</div>\n```\n\n使用 `npm start` 重启服务器并见证热重载吧！\n\
  \n要尝试这一点，请输入 \"HMR Rules\"，然后更改 `people.js` 中的名称，看它如何在不刷新页面且丢失状态的情况下被替换。\n\n这是一个简单的示例，但希望你能看到它是多么有用。这在基于组件的开发中尤为如此，因为你有许多与状态分离的“哑壳”组件，组件可以被替换和重新渲染而不丢失状态，从而获得即时反馈循环。\n\
  \n## Hot Reload CSS (热重载 CSS)\n\n更改 `style.scss` 中 `<pre>`元素的背景颜色，你会发现它正在被 HMR 替换。\n\
  \n```css\npre {\n  background: red;\n}\n```\n\n事实证明，当你使用 `style-loader` 时，CSS 的\
  \ HMR 是免费提供的，你不需要做任何特殊处理。我们通过将 CSS 模块提取到无法替换的外部 CSS 文件中切断了这条链条。如果我们把 Sass 规则恢复到原始状态并从插件列表中移除\
  \ `extractCSS`，你也将看到你的 Sass 支持热重载。\n\n```js\n{\n  test: /\\.scss$/,\n  loader: ['style-loader',\
  \ 'css-loader', 'sass-loader']\n}\n```\n\n## HTTP/2\n\n使用像 webpack 这样的模块打包的主要优势之一是，它通过控制资产的构建和获取来帮助你提高性能。多年来，合并文件以减少客户端请求数被认为是[最佳实践](https://developer.yahoo.com/performance/rules)。HTTP/2\
  \ 现在允许在单个请求中交付多个文件，因此合并不再是万能药。你的应用程序实际上可能从多个单独缓存的文件中获益，因为客户端只需获取单个更改的模块，而无需重新获取大部分内容相同的包。\n\
  \nWebpack 的作者 [Tobias Koppers](https://twitter.com/wSokra) 写了一篇信息量丰富的文章，解释了为什么在\
  \ HTTP/2 时代打包仍然重要。\n\n通过 [webpack & HTTP/2](https://medium.com/webpack/http-2-7083ec3f3ce6)\
  \ 了解更多信息。\n\n## 第五章：React VS Angular：深度对比\n\n作者：Pavels Jelisevs\n\n评审：[Jurgen Van\
  \ de Moere](https://www.sitepoint.com/author/mbrown/) 和 [Joan Yin](https://www.sitepoint.com/author/jvandemoere/)\n\
  \n应该选择 Angular 还是 React？如今 JavaScript 框架两极分化的格局让许多开发者在这场争论中难以抉择。无论你是试图从何开始的新手，还是为下一个项目挑选框架的自由职业者，或是为公司规划战略愿景的企业级架构师，你可能都会从这一话题的明智见解中受益。\n\
  \n\n\n\n\n在选择任何任何工具之前，你需要回答两个简单的问题：“它本身是一个好工具吗？”以及“它是否适合我的用例？”。这两个问题单看来看都没有任何意义，所以你总是需要同时记住这两点。好吧，这些问题可能并没有那么简单，所以我们将尝试将它们拆解为更小的问题。\n\
  \n## 关于工具本身的问题：\n\n* 它的成熟程度如何？背后支持者是谁？\n* 它拥有哪些特性？\n* 它采用了什么样的架构、开发范式和模式？\n* 它的生态系统是怎样的？\n\
  \n## 关于自省的问题：\n\n* 我以及我的同事能够轻松学习这个工具吗？\n* 它契合我的项目吗？\n* 开发者体验如何？\n\n通过这组问题，你可以开始对任何工具进行评估，我们对\
  \ React 和 Angular 的比较也将基于这些问题。\n\n我们还有另外一点需要考量。严格来说，将 Angular 与 React 进行比较并不完全公平，因为\
  \ Angular 是一个功能完备的大型框架，而 React 只是一个 UI 组件库。为了公平起见，我们将结合经常与 React 一起使用的库来讨论 React。\n\
  \n## 成熟度\n\n成为一名熟练开发者的一个重要方面，是能够在既定的、经过时间验证的方法与评估新的前沿技术之间保持平衡。作为一个一般原则，在采用尚未成熟的工具时你应该要小心，因为存在某些风险：\n\
  \n* 工具可能存在 Bug 且不稳定。\n* 供应商可能会意外地废弃它。\n* 当你需要帮助时，可能没有庞大的知识库或社区可供。\n\nReact 和 Angular\
  \ 都源自优秀的背景，所以看起来在这方面我们可以充满信心。\n\n## React\n\nReact 由 Facebook 开发并维护，并应用于其自己的产品中，[包括\
  \ Instagram 和 WhatsApp](https://github.com/facebook/react/wiki/sites-using-react)。它已经存在了大约[三个半以来](https://facebook.github.io/react/blog/2013/06/05/why-react.html)，所以它并不算新。它也是\
  \ GitHub 上[最受欢迎的](https://github.com/search?q=stars:%3E1&s=stars&type=Repositories)项目之一，在编写时大约有\
  \ 60,000 个星。听起来很不错。\n\n## Angular\n\nAngular（2 及以上版本）出现的时间比 React 短，但如果你算上它的前身 AngularJS\
  \ 的历史，情况就平分了。它由 Google 维护，并用于 [AdWords 和 Google Fiber](http://angularjs.blogspot.com/2015/11/how-google-uses-angular-2-with-dart.html)。由于\
  \ AdWords 是 Google 的核心项目之一，显而易见他们对它下下了大注，不太可能短期内消失。\n\n## 特性\n\n正如我之前提到的，Angular\
  \ 开箱即用的特性比 React 多。这既可以是好事，也可以是坏事，取决于你如何看待。\n\n这两个框架共享一些共同特性：组件、数据绑定和平台无关的渲染。\n\n\
  ## Angular\n\nAngular 开箱即提供了许多现代 Web 应用所需的特性。一些标准特性包括：\n\n* 依赖注入；\n* 基于扩展版 HTML\
  \ 的模板；\n* 由 `@angular/router` 提供的路由；\n* 由 `@angular/http` 提供的 Ajax 请求；\n* 用于构建表单的\
  \ `@angular/forms`；\n* 组件 CSS 封装；\n* XSS 保护；\n* 用于组件测试的实用工具。\n\n当你不想花时间自己选择库时，拥有所有这些开箱即用的特性是非常方便的。然而，这意味着你会被困于某些库中，即使你不需要它们。而且替换它们通常需要额外的努力。例如，我们认为对于小型项目来说，拥有\
  \ `DI`（依赖注入）系统带来的开销多于收益，考虑到它可以被 `imports`（导入）有效地所替代。\n\n## React\n\n使用 React 时，你从一种更极简的方法开始。如果我们只看\
  \ React，这里我们有：\n\n* 没有依赖注入；\n* 取代经典模板的是，它拥有 JSX，这是一种构建在 JavaScript 之上的类 XML 语言；\n\
  * XSS 保护；\n* 用于组件测试的实用工具。\n\n并不多。这可能是一件好事。这意味着你有自由根据需要选择添加任何额外的库。坏处在于你实际上必须自己做这些选择。经常与\
  \ React 一起使用的一些流行库包括：\n\n* 用于路由的 [React-router](https://reacttraining.com/react-router/)；\n\
  * 用于 HTTP 请求的 [Fetch](https://developer.mozilla.org/en/docs/Web/API/Fetch_API)（或\
  \ [axios](https://github.com/mzabriskie/axios)）；\n* 用于 CSS 封装的[各种技术](https://github.com/MicheleBertoli/css-in-js)；\n\
  * 用于额外的单元测试工具的 [Enzyme](https://github.com/airbnb/enzyme)。\n\n我们发现选择自己库的自由是令人解放的。这使我们能够根据每个项目的特定需求来定制我们的技术栈，而且我们发现学习新库的成本并不。\n\
  \n## 语言、范式和模式。\n\n从每个框架的特性中退一步，让我们看看哪些高级概念在两个框架中都是流行的。\n\n## React\n\n在思考 React\
  \ 时，有几件重要的事情进入脑海：JSX、Flow 和 Redux。\n\n#### JSX\n\n[JSX](https://facebook.github.io/react/docs/introducing-jsx.html)\
  \ 对许多开发者是有争议的话题：有些人喜欢它，另一些人认为它是巨大的退步。React 没有遵循传统的做法，而是在组件内部将它们结合。虽然将标记与逻辑混合的话题可能有争议，但它有一个不可否的益处：静态分析。如果你在\
  \ JSX 中编写错误，编译器将发出错误而不是静默运行。这有助于发现拼写错误和其他愚蠢的错误。\n\n#### Flow\n\n[Flow](https://flow.org/)\
  \ 是一个由 Facebook 开发的 JavaScript 类型检查工具。它可以解析代码并检查常见的类型错误，例如隐式转换或空引用。与具有类似目的 TypeScript\
  \ 不同，它不需要你迁移到一种新语言并为代码添加注解。在 Flow 中，类型注解是可选的，可以为分析器提供额外的提示。这使得 Flow 对于想要使用静态代码分析但不想重写现有代码的人来说是一个很好的选择。\n\
  \n进一步阅读：[更好的 JavaScript](https://www.sitepoint.com/writing-better-javascript-with-flow/)\n\
  \n#### Redux\n\n[Redux](http://redux.js.org/) 是一个有助于清晰管理状态变化的库。它受到了 [Flux](http://facebook.github.io/flux/)\
  \ 的启发，但进行了简化。Redux 的核心思想是应用程序的状态由单个对象表示，并通过称为 reducer 的函数进行更改。Reducer 本身是与组件分离的纯函数实现了更好的关注点分离和可测试性。\n\
  \n如果你在一个简单的项目上工作，那么引入 Redux 可能会过度复杂，但对于中大型项目，它是一个可靠的选择。该库已变得如此流行，以至于有项目](https://github.com/angular-redux/store)\
  \ 在 Angular 中实现了它。\n\n这三个特性都可以极大地提高你的开发者体验：JSX 和 Flow 让你能够快速发现潜在错误的地方，而 Redux 将帮助为项目实现清晰的结构。\n\
  \n## Angular\n\nAngular 也有一些有趣的王牌，即 TypeScript 和 RxJS。\n\n#### TypeScript\n\n\n\n\
  \n\n[TypeScript](https://www.typescriptlang.org/) 是一种构建在 JavaScript 之上由微软开发的新语言。它是\
  \ `JavaScript ES2015` 的超集，并包含了该语言新版本的特性。你可以用它代替 `Babel` 来编写顶尖的 JavaScript。它还具有极其强大的类型系统，可以通过结合注解和类型推断对你的代码进行静态分析。\n\
  \n这还有一个更微妙的益处。TypeScript 受到了 `Java` 和 `.NET` 的深远影响，因此如果你的开发人员具有这些语言之一的背景，他们可能会发现\
  \ TypeScript 比纯 JavaScript 更容易学习（注意我们是如何从工具切换到你的个人环境的）。尽管 `Angular` 是第一个积极采用 TypeScript\
  \ 的主流框架，但你也可以将其与 `React` 配合使用。\n\n[延伸阅读：[TypeScript 简介：面向 Web 的静态类型](https://www.sitepoint.com/introduction-to-typescript/)]\n\
  \n## RxJS\n\n[RxJS](http://reactivex.io/rxjs/) 是一个响应式编程库，允许更灵活地处理异步操作和事件。它是观察者模式（`Observer`）和迭代器模式（`Iterator`）与函数式编程的结合。RxJS\
  \ 允许你将任何内容视为值的连续流，并对其执行各种操作，如映射、过滤、分割或合并。\n\n该库已被 `Angular` 采用并在他们的 HTTP 模块中用于内部使用。当你执行\
  \ HTTP 请求时，它返回的是一个 `Observable` 而不是普通的 `Promise`。虽然这个库非常强大，但它相当复杂。要精通它，你需要熟悉不同类型的\
  \ `Observables`、`Subjects` 以及[数百个方法和操作符](http://reactivex.io/rxjs/manual/overview.html#operators)。天哪，仅仅为了发送\
  \ HTTP 请求，这似乎有点过头了！\n\n当你在大量处理连续数据流（如 web sockets ）时，RxJS 是很有用的，但对于任何其他情况，它似乎都过于复杂了。无论如何，在编写\
  \ `Angular` 时，你至少需要学习它的基础知识。\n\n[延伸阅读：使用 RxJS 学习函数式响应式编程简介](https://www.sitepoint.com/functional-reactive-programming-rxjs/)]\n\
  \n我们发现 TypeScript 是提高项目可维护性的极佳工具，特别是对于代码库巨大或领域/业务逻辑复杂的项目。用 TypeScript 编写的代码更具描述性且更容易遵循。由于\
  \ TypeScript 已被 `Angular` 采用，我们希望看到更多项目使用它。另一方面，RxJS 似乎只在某些情况下有利，应该谨慎采用。否则，它会给你的项目带来意外的复杂性。\n\
  \n## 生态系统\n\n开源框架的伟大之处在于围绕它们创建的工具数量。有时候，让我们看看与每个框架关联的一些热门工具和库。\n\n## Angular\n\n\
  ### Angular CLI\n\n现代框架的一个流行趋势是拥有一个 CLI 工具，帮助你启动项目，而无需自己配置构建。`Angular` 提供了 [Angular\
  \ CLI](https://cli.angular.io/)来实现这一目标。它允许你通过几个命令即可生成并运行项目。所有负责构建应用程序、启动开发服务器和运行测试的脚本都隐藏在\
  \ `node_modules` 中。你也可以用它在开发期间生成新代码。这使得设置新项目变得轻而易举。\n\n[延伸阅读：终极 Angular CLI 参考指南](https://www.sitepoint.com/ultimate-angular-cli-reference/)]\n\
  \n### Ionic 2\n\n[Ionic 2](http://ionic.io/2) 是用于开发混合移动应用程序的流行框架的新版本。它提供了一个与 `Angular\
  \ 2` 良好集成的 `Cordova` 容器，以及非常漂亮的 Material 组件库。使用它，你可以轻松地设置和构建移动应用程序。如果你倾向于混合应用而非原生应用，这是一个很好的选择。\n\
  \n### Material design components\n\n如果你是 Material design 的粉丝，你会很高兴听到听到 `Angular`\
  \ 已经有一套 [Material 组件库](https://material.angular.io/)可用。目前，它仍处于早期阶段且略显粗糙，但最近收到了大量贡献，所以我们可能很快就能看到改进。\n\
  \n### Angular universal\n\n[Angular universal](https://github.com/angular/universal)\
  \ 是一个可以用于支持服务器端渲染项目的种子项目。\n\n### @ngrx/store\n\n[@ngrx/store](https://github.com/ngrx/store)\
  \ 是一个受 `Redux` 启发的 `Angular` 状态管理库，基于纯还原器（pure reducers）改变的状态。它与 `RxJS` 的集成允许你利用推送变化检测策略来获得更好的性能。\n\
  \n> 在 [Awesome Angular 列表](https://github.com/AngularClass/awesome-angular) 中还有许多其他库和工具。\n\
  \n## React\n\n### Create react app\n\n[Createreact-app](https://github.com/facebookincubator/create-react-app)\
  \ 是一个用于 `React` 的 CLI 工具，可快速设置新项目。与 `Angular CLI` 类似，它允许你生成新项目、启动开发服务器并创建包。它使用 Facebook\
  \ 较新的测试运行器 [Jest](https://www.sitepoint.com/test-react-components-jest/) 进行单元测试，它本身也有一些很棒的功能。它还支持使用环境变量进行灵活的应用分析、本地开发中的后端代理、`Flow`\
  \ 以及其他功能。查看简短的 [createreact-app 介绍](https://www.sitepoint.com/create-react-app/)\
  \ 以获取更多信息。\n\n### React Native\n\n[React Native](https://facebook.github.io/react-native/)\
  \ 是 Facebook 开发的一个使用 React 创建原生移动应用的平台。与生成混合应用的 Ionic 不同，`React Native` 生成真正的原生\
  \ UI。它提供了一套标准的 React 组件，这些组件绑定到相应的原生组件。它还允许你创建自己的组件并将其绑定到使用 `Objective-C`、`Java`\
  \ 或 `Swift` 编写的原生代码。\n\n### Material UI\n\n`React` 也有一个 [material design 组件](http://www.material-ui.com)\
  \ 库。与 `Angular` 的版本相比，这个更加成熟且提供的组件范围更广。\n\n### Next.js\n\n[Next.js](https://github.com/zeit/next.js/)\
  \ 是一个用于 `React` 应用服务器端渲染的框架。它提供了一种灵活的方法在服务器上完全或部分渲染你的应用程序，返回结果并在浏览器中继续。它试图让创建通用应用的复杂任务变得尽可能简单，因此设计得尽可能简单，对新原理和项目结构的要求最小。\n\
  \n### MobX\n\n[MobX](https://github.com/mobxjs/mobx) 是另一种管理应用状态的库。它不像 `Redux` 那样将状态存在单个不可变存储中，而是鼓励你只存储所需的最小状态，并从中推导出其他状态。它提供了一套装饰器来定义观察对象和观察者，并为你的状态引入响应式逻辑。\n\
  \n[延伸阅读：如何使用 MobX 管理 JavaScript 应用状态](https://www.sitepoint.com/manage-javascript-application-state-mobx/)]\n\
  \n## Storybook\n\n\n\n\n\n[Storybook](https://getstorybook.io/) 是一个用于 React 的组件开发环境。它允许你快速搭建一个独立的应用程序来展示你的组件。此外，它提供了许多插件，用于组件的文档化、开发、测试和设计。我们发现，能够独立于应用程序的其他部分来开发组件是非常用的。你可以从之前的文章中[了解更多关于\
  \ Storybook 的信息](https://www.sitepoint.com/react-storybook-develop-beautiful-user-interfaces-with-ease/)。\n\
  \n> 在 [Awesome React 列表](https://github.com/enaqx/awesome-react) 中还有许多其他可用库和工具。\n\
  \n## 采用、学习曲线与开发体验\n\n选择新技术时的一个重要标准是其学习的难易程度。当然，答案取决于许多因素，例如你之前的经验以及对相关概念和模式的总体熟悉程度。然而，我们仍然可以尝试评估为了开始使用某个框架你需要学习多少新知识。现在，假设你已经熟悉了\
  \ `ES6+`、构建工具等等，让我们看看你还需要理解什么。\n\n## React\n\n使用 React 时，你遇到的第一个就是 `JSX`。对于一些开发者来说，写它看起来似乎很别扭，但它并没有增加多少复杂性；只需表达式（实际上是\
  \ JavaScript）和一种特殊的类 HTML 语法。你还需要学习如何编写组件、使用 `props` 进行配置以及管理内部状态。你不需要学习任何新的逻辑结构或循环，因为所有这些都是纯\
  \ JavaScript。\n\n[官方教程](https://facebook.github.io/react/docs/hello-world.html)是学习\
  \ React 的极佳起点。一旦你完成了该教程，就可以[熟悉路由器](https://reacttraining.com/react-router/web/guides/quick-start)。`react\
  \ router v4` 可能会稍微复杂且不符合常规，但并不可担心。使用 `Redux` 需要进行范式转移，以学习如何按照该库建议的方式来完成已经熟悉的任务。免费的\
  \ [Redux 入门](https://egghead.io/courses/getting-started-with-redux) 视频课程可以快速向你介绍核心概念。根据你的项目的大小和复杂度，你可能需要寻找并学习一些额外的库，这可能是棘手的部分，但在那之后一切都应该顺风顺利。\n\
  \n我们对开始使用 React 是如此简单感到非常惊讶。即使是具有后端开发背景且前端开发经验有限的人也能快速跟上。你在这一过程中可能会遇到的错误信息通常是清晰的，并提供了关于如何解决底层问题的解释。最困难的部分可能是为所有所需功能找到合适的库，但结构化和开发应用程序是极其简单的。\n\
  \n## Angular\n\n学习 Angular 将向你介绍比 React 更多的新概念。首先，你需要熟悉 `TypeScript`。对于具有 `Java`\
  \ 或 `.NET` 等静态类型语言经验的开发者来说，这可能比 `JavaScript` 更容易理解，但对于纯 JavaScript 开发者来说，这可能需要花费一些精力。\n\
  \n框架本身拥有丰富的学习主题，从基础主题（如模块、依赖注入、装饰器、组件、服务、管道、模板和指令）到更高级的主题（如变更检测、区域、`AoT 编译` 和 `Rx.js`）。这些都包含在[文档](https://angular.io/docs/ts/latest/quickstart.html)中。`Rx.js`\
  \ 本身就是一个沉重的话，在[官方网站](http://reactivex.io/) 上有非常详细的描述。虽然在基础层面上相对容易使用，但在转向高级主题时，它会变得更加复杂。\n\
  \n总而言之，我们注意到 Angular 的门槛比 React 高。新概念的庞大数量让新手感到困惑。即使在你开始之后，体验也可能有些坎坷，因为你需要不断记住诸如\
  \ `Rx.js` 订阅管理、变更检测性能和[箱子里的香蕉](https://angular.io/docs/ts/latest/guide/template-syntax.html)（是的，这是文档中的真实建议）。我们经常遇到太晦涩而无法理解的错误信息，所以我们不得不在\
  \ Google 上搜索它们并祈祷有完全匹配的结果。\n\n似乎我们在这里偏于 React，我们确实是如此。我们过在规模和复杂度相当的 Angular 和 React\
  \ 项目中入职新开发者的经验，不知为何，使用 React 的过程总是更顺畅。但是，正如我之前提到的，这取决于许多因素，对你来说可能会有所不同。\n\n## 结合实际背景\n\
  \n你可能已经注意到每个框架都有自己的能力，既有优点也有缺点。但这项分析是在任何特定背景之外进行的，因此没有提供关于你应该选择哪种框架的答案。要做出决定，你需要从你项目的角度来审视。这是你需要自己完成的。\n\
  \n要开始，尝试回答这些关于你项目的问题，当你回答时，将答案与你学到的关于这两个框架的知识相匹配。这个列表可能不完整，但足够让你开始了：\n\n1. 项目有多大？\n\
  2. 它将维护多久？\n3. 所有功能是否都预先明确定义，还是要求你保持灵活性？\n4. 如果所有功能都已定义，你需要哪些能力？\n5. 领域模型和业务逻辑复杂吗？\n\
  6. 你的目标平台是什么？Web、移动端、桌面端？\n7. 你需要服务端渲染吗？SEO 重要吗？\n8. 你会处理大量的实时事件吗？\n9. 你的团队有多大？\n\
  10. 你的开发者经验如何？背景是什么？\n11. 有任何你想使用的现成组件库？\n\n如果你正在启动一个大项目并希望尽量减少选错误的风险，可以考虑先创建一个概念验证（PoC）。选取项目的关键功能，并尝试使用其中一个框架进行简单实现。PoC\
  \ 通常不需要花费长时间构建，但可以为你提供一些使用框架的宝贵经验，并允许你验证关键技术需求。如果你对结果满意，就可以进行全面开发。如果不满意，尽早失败从长远来看会为你节省很多麻烦。\n\
  \n## 一个框架统治一切？\n\n一旦你为一个项目选择了框架，你会被诱惑在接下来的项目中使用完全相同的栈。不要这样做。虽然保持技术栈的一致是一个好主意，但不要盲目地使用相同的方法。在开始每个项目之前，花时间再次回答这些问题。可能对于下一个项目，答案会不同，或者格局会发生变化。此外，如果你有幸使用不熟悉的技术栈做一个小项目，尽管尝试吧。这类实验将为你提供宝贵的经验。\n\
  \n## 第 6 章：将你的网站改造为渐进式 Web 应用\n\n作者 Craig Buckler\n\n同行评审：[AJ Latour](https://github.com/ajlatour)、[Panayiotis\
  \ «pvgr» Velisarakos](https://github.com/pvgr) 和 [Dave Maxwell](https://github.com/davemaxwell77)。\n\
  \n\n\n\n最近，渐进式 Web 应用（PWAs）引起了广泛关注，许多人质疑它们是否代表了（移动端）Web 的未来。我不会陷入原生应用与 PWA 之间的争论，但有一点是肯定的——它们在增强移动端和提升用户体验方面发挥了巨大作用。考虑到移动\
  \ Web 访问量到 2018 年将超过所有其他设备的总和，你还能负担得忽视这一趋势吗？\n\n好消息是，制作一个 PWA 并不困难。事实上，将现有的网站转换为\
  \ PWA 是完全可能的。这正是我在本教程中将要做的——当你完成时，你将拥有一个行为像原生 Web 应用的网站。它可以在离线工作，并拥有自己的主屏幕图标。\n\n\
  ## 什么是渐进式 Web 应用？\n\n渐进式 Web 应用（称为“PWAs”）是 Web 技术领域的一项激动创新。PWAs 结合了多种技术，使 Web 应用运行起来类似于原生移动应用。它为开发者和用户带来的收益克服了纯\
  \ Web 端或纯原生方案的局限：\n\n1. 你只需要开发一个使用开放标准 W3C Web 技术的应用。无需开发独立的原生代码库。\n2. 用户可以在安装前发现并尝试你的应用。\n\
  3. 无需使用 AppStore，无需遵守晦涩的规则或支付费用。应用程序更新会自动进行，无需用户交互。\n4. 用户会收到“安装”提示，这会在他们的主屏幕上添加一个图标。\n\
  5. 启动时，PWA 会显示一个吸引的启动屏。\n6. 如果必要，可以修改浏览器外壳选项以提供全屏体验。\n7. 核心文件被缓存在本地，因此 PWAs 的响应比标准\
  \ Web 应用更快（它们甚至比原生应用更快）。\n8. 安装非常轻量——可能只有几百 KB 的缓存数据。\n9. 所有数据交换必须通过安全的 HTTPS 连接进行。\n\
  10. PWAs 可以离线运行，并在连接恢复时同步数据。\n\n虽然现在还处于早期阶段，但[案例研究结果是积极的](https://developers.google.com/web/showcase/)。印度最大的电子商务网站\
  \ Flipkart 在放弃原生应用转用 PWA 后，[销售转化率提升了 70%，站内时长增加了三倍](https://developers.google.com/web/showcase/2016/flipkart)。全球最大的商业交易平台阿里巴巴也经历了类似的[76%\
  \ 转化率增长](https://developers.google.com/web/showcase/2016/alibaba)。\n\nFirefox、Chrome\
  \ 以及其他基于 Blink 的浏览器已提供可靠的 PWA 技术支持。微软正在开发 Edge 的实现方案。苹果仍保持沉默，尽管在 [WebKit 五年计划中有令人前景的评论](https://trac.webkit.org/wiki/FiveYearPlanFall2015)。幸运的是，浏览器支持目前大多并不重要……\n\
  \n## 渐进式 Web 应用是渐进式增强\n\n你的应用仍然可以在不支持 PWA 技术的浏览器中运行。用户无法获得离线功能的好处，但一切将继续像以前一样工作。考虑到投入产比的回报，没有理由不向你的系统中添加\
  \ PWA 技术。\n\n## 它不仅仅是应用\n\nGoogle 领导了[PWA 运动](https://developers.google.com/web/progressive-web-apps/)，因此大多数教程都描述了如何从零开始构建基于\
  \ Chrome 的原生外观移动应用。然而，你不需要特殊的单页应用，也不必遵循 Material Design 设计指南。大多数网站都可以在几小时内 PWA 化。这包括你的\
  \ WordPress 或静态站点。[Smashing Magazine](https://www.smashingmagazine.com/) 宣布在写本文时他们已经在[以\
  \ PWA 模式运行](https://twitter.com/smashingmag/status/839379533874806784)！\n\n## 演示代码\n\
  \n演示代码可在 [`github.com/sitepoint-editors/pwa-retrofit`](https://github.com/sitepoint-editors/pwa-retrofit)\
  \ 获取。\n\n它了一个简单的四页网站，包含几张图片、一个样式表和一个主 JavaScript 文件。该网站在所有现代浏览器（IE10+）中均可运行。如果浏览器支持\
  \ PWA 技术，用户可以在离线时阅读之前过的页面。\n\n要运行代码，请确保已安装 [Node.js](https://nodejs.org/)，然后在终端中启动提供的\
  \ Web 服务器：\n\n```\nnode ./server.js [port]\n```\n\n其中 `[port]` 是可选的，默认为 8888。打开\
  \ Chrome 或其他基于 Blink 的浏览器（如 Opera 或 Vivaldi），然后导航到 [`localhost:8888/`](http://localhost:8888/)（或你指定的端口）。你也可以打开开发者工具（F12\
  \ 或 Cmd/Ctrl + Shift + I）来查看各种控制台消息。\n\n![](img/00004.jpg)\n\n查看首页以及另一个页面，然后通过以下方式进入离线状态：\n\
  \n1. 使用 `Cmd/Ctrl + C` 停止 Web 服务器，或\n2. 在开发者工具的 Network 或 Application - Service\
  \ Workers 标签页中勾选 Offline 复选框。\n\n重新访问你之前过的任何页面，它们将仍然加载。访问一个你没过的页面，将看到一个包含“你处于离线状态”的页面，其中列出了可选页面列表：\n\
  \n![](img/0001.jpg)\n\n## 连接设备\n\n你也可以在 Android/Mac 上查看演示页面。\n\n![](img/0019.jpg)\n\
  \n\n\n\n```json\n{\n  \"type\": \"image/png\",\n  },\n  [\n    {\n      \"src\"\
  : \"/images/logo/logo256.png\",\n      \"sizes\": \"256x256\",\n      \"type\":\
  \ \"image/png\"\n    },\n    {\n      \"src\": \"/images/logo/logo512.png\",\n \
  \     \"sizes\": \"512x512\",\n      \"type\": \"image/png\"\n    }\n  ]\n}\n```\n\
  \n你所有页面的 `<head>` 中都需要一个指向此文件的链接：\n\n`<link rel=\"manifest\" href=\"/manifest.json\"\
  >`\n\n主要的 manifest 属性有：\n\n- `name`: 显示给用户的应用程序全名\n- `short_name`: 当空间不足以显示全名时使用的短名称\n\
  - `description`: 应用程序的详细描述\n- `start_url`: 启动程序的相对 URL（通常为 `/`）\n- `scope`: 导航范围。例如，范围为\
  \ `app` 将将该应用限制在相应文件夹内\n- `background-color`: 用于启动页和浏览器框架的背景颜色（如果需要）\n- `theme_color`:\
  \ 应用程序的颜色，通常与背景相同，会影响应用的显示方式\n- `orientation`: 偏好的方向：`any`、`natural`、`landscape`、`landscape-primary`、`landscape-secondary`、`portrait`、`portrait-primary`\
  \ 和 `portrait-secondary`\n- `display`: 偏好的视图：`fullscreen`（无框架）、`standalone`（像原生应用）、`minimal-ui`（一组小型\
  \ UI 控制）和 `browser`（常规浏览器标签页）\n- `icons`: 一个图像对象的数组，定义了 `src` URL、`sizes` 和 `type`。应该定义范围内的图标。\n\
  \nMDN 提供了 [Web App Manifest 属性](https://developer.mozilla.org/en-US/docs/Web/Manifest)\
  \ 的完整列表。\n\nChrome 开发工具 Application 标签中的 Manifest 部分会验证你的 manifest JSON，并提供一个可以在桌面设备上使用的“添加到主屏幕”链接：\n\
  \n![](img/00008.jpg)\n\n## 步骤 3：创建 Service Worker\n\nService Workers 是可编程的代理，可以拦截并响应网络请求。它们是位于应用程序根目录下的单个\
  \ JavaScript 文件。\n\n你的页面 JavaScript（演示代码中的 `js/main.js`）可以检查 service worker 的支持并注册该文件：\n\
  \n```javascript\nif ('serviceWorker' in navigator) {\n  // 注册 service worker\n \
  \ navigator.serviceWorker.register('/serviceworker.js');\n}\n```\n\n如果你不需要离线功能，只需创建一个空的\
  \ `/serviceworker.js` 文件——用户将收到提示来安装你的应用！\n\nService workers 可能会令人困惑，但你应该能够根据自己的需求对演示代码进行调整。它是一个标准的\
  \ web worker 脚本，浏览器会下载它（可能的话）并在单独线程上运行。它无法访问 DOM 或其他页面 API，但会拦截由页面变化、资源下载和 Ajax\
  \ 调用触发的网络请求。\n\n这是你的网站需要 HTTPS 的主要原因。想象一下，如果第三方脚本可以从另一个域名注入自己的 service worker，将会是多么混乱。它将能够检查并修改客户端和服务之间的所有数据交换！\n\
  \nService workers 对三个主要事件做出响应：install（安装）、activate（激活）和 fetch（获取）。\n\n## Install\
  \ 事件\n\n该事件在应用程序安装时发生。它通常用于使用 [Cache API](https://developer.mozilla.org/en-US/docs/Web/API/Cache)\
  \ 缓存基本文件。\n\n首先，我们将为以下内容定义一些配置变量：\n\n1. 缓存名称 (`CACHE`) 和版本 (`version`)。你的应用程序可以有多个缓存，但我们只需要一个。应用了版本号，因此如果我们进行了重大更改，将使用新缓存并忽略所有之前缓存的文件。\n\
  2. 离线状态下使用的 URL。\n3. 必须缓存的文件列表。\n4. 可选的缓存文件数组。\n\n\n\n\n\n```javascript\nif (newreq.ok)\
  \ cache.put(event.request, newreq.clone());\nreturn newreq;\n})\n// app is offline\n\
  .catch(() => offlineAsset(url));\n});\n);\n});\n```\n\n对 `offlineAsset(url)` 的最终调用通过两个辅助函数返回适当响应：\n\
  \n```javascript\n// is image URL?\nlet iExt = ['png', 'jpg', 'jpeg', 'gif', 'webp',\
  \ 'bmp'].map(f => '.' + f);\nfunction isImage(url) {\n  return iExt.reduce((ret,\
  \ ext) => ret || url.endsWith(ext), false);\n}\n\n// return offline asset\nfunction\
  \ offlineAsset(url) {\n  if (isImage(url)) {\n    // return image\n    return new\
  \ Response(\n      '<svg role=\"img\" viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\"\
  ><title>offline</title><path d=\"M0 0h400v300H0z\" fill=\"#eee\" /><text x=\"200\"\
  \ y=\"150\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"sans-serif\"\
  \ font-size=\"50\" fill=\"#ccc\">offline</text></svg>',\n      { headers: {\n  \
  \      'Content-Type': 'image/svg+xml',\n        'Cache-Control': 'no-store'\n \
  \     }}\n    );\n  }\n  else {\n    // return page\n    return caches.match(offlineURL);\n\
  \  }\n}\n```\n\n`offlineAsset()` 函数检查请求是否为图片并返回一个包含“offline”文本的 SVG。所有其他请求均返回 `offlineURL`\
  \ 页面。\n\nChrome 开发者工具 Application（应用程序）标签页的 Service Worker 部分提供了有关你的 worker 的信息，以及强制刷新和让浏览器进入离线的功能：\n\
  \n![](img/00009.jpg)\n\nCache Storage（缓存存储）部分列出了当前范围内的所有缓存以及它们包含的资源。当缓存更新时，你可能需要点击面板底部的刷新按钮：\n\
  \n![](img/00012.jpg)\n\n意乎不彰，Clear storage（清除存储）部分可以删除你的 service worker 和缓存：\n\n\
  ![](img/00018.jpg)\n\n## 额外步骤 4：创建一个实用的离线页面\n\n离线页面可以是静态 HTML，告知用户请求的页面在离线时不可用。然而，我们也可以提供一个可读页面\
  \ URL 列表。\n\n[Cache API](https://developer.mozilla.org/en-US/docs/Web/API/Cache)\
  \ 可以在我们的 `main.js` 脚本中访问。但是该 API 使用的 promise 在不支持的浏览器中失败，会导致所有 JavaScript 停止执行。为了避免这种情况，我们在加载另一个\
  \ `offlinepage.js` JavaScript 文件之前，会检查离线列表元素和 Caches API 是否可用（该文件必须存在于上面的 `installFilesEssential`\
  \ 数组中）：\n\n```javascript\n// load script to populate offline page list\nif (document.getElementById('cachedpagelist')\
  \ && 'caches' in window) {\n  var scr = document.createElement('script');\n  scr.src\
  \ = 'offlinepage.js';\n  scr.async = 1;\n  document.head.appendChild(scr);\n}\n\
  ```\n\n`offlinepage.js` 通过名称定位最新的缓存，获取所有键的列表，移除非页面的 URL，排序列表并将其追加到 ID 为 `cachedpagelist`\
  \ 的 DOM 节点：\n\n```javascript\nconst CACHE = 'site',\nofflineURL = '/',\nlist = document.getElementById('cachedpagelist');\n\
  // fetch all caches\nwindow.caches.keys()\n  .then(cacheList => {\n    // find caches\
  \ and order by recent\n    cacheList = cacheList\n      .filter(cName => cName.includes(CACHE))\n\
  \      .sort((a, b) => a - b);\n    // open first cache\n    caches.open(cacheList[0])\n\
  \      .then(cache => {\n        // fetch cached pages\n        cache.keys()\n \
  \         .then(reqList => {\n            let frag = document.createDocumentFragment();\n\
  \            reqList\n              .map(req => req.url)\n              .filter(req\
  \ => (req.endsWith('/') || req.endsWith('.html')) && !req.endsWith(offlineURL))\n\
  \              .sort()\n              .forEach(req => {\n                let li\
  \ = document.createElement('li'),\n                a = li.appendChild(document.createElement('a'));\n\
  \                a.setAttribute('href', req);\n                a.textContent = a.pathname;\n\
  \                frag.appendChild(li);\n              });\n            if (list)\
  \ list.appendChild(frag);\n          });\n      });\n  });\n```\n\n## 开发者工具\n\n\
  如果你觉得调试 JavaScript 很困难，那么 service workers 也不会好玩！Chrome 开发者工具的 Application 标签提供了强大的功能，日志语句也会输出到控制台。\n\
  \n在开发期间，你应该考虑在无痕窗口中运行你的应用，因为缓存文件在关闭标签页后不会保留。\n\nFirefox 在工具菜单的 Service Workers 选项提供了一个\
  \ JavaScript 调试器。承诺很快就会提供更好的设施。\n\n最后，[Chrome Lighthouse 扩展程序](https://chrome.google.com/webstore/detail/lighthouse/blipmdconlkpine)提供了关于\
  \ PWA 的有用信息。\n\n## PWA 注意事项\n\n渐进式 Web 应用（PWA）需要新的技术，因此建议采取谨慎态度。manifest 参数 `display:\
  \ minimal-ui` 或 `display: browser` 对于大多数网站可能是最好的。## URL 隐藏\n\n演示隐藏了地址栏，除非你只有一个应用。缓存负载\n\
  \n你可以缓存网站上的所有页面。但对于有成千上万页面的网站是否可行？可能考虑：\n\n*   仅缓存重要页面例如首页和最新的\n*   不缓存图片、视频和其他大文件\n\
  *   定期清理旧文件\n*   提供“存储此页面”按钮让用户选择缓存什么。缓存刷新\n\n演示从缓存中查找资源，这在用户离线时很棒，但意味着他们在在线时可能查看旧页面。\n\
  \n图片和视频的 URL 永远不会更改，因此长期缓存很少有问题。你可以通过 `Cache-Control` HTTP 头部确保它们缓存至少一年（31,536,000\
  \ 秒）：\n\n`Cache-Control: max-age=3153600`\n\n页面、CSS 和脚本文件可能会更频繁地更改，你可以设置较短的 24 小时过期并在在线时进行服务器验证：\n\
  \n`Cache-Control: must-revalidate, max-age=86400`\n\n你也可以考虑缓存失效技术以确保旧资源无法被使用，例如将你的\
  \ CSS 文件命名为 `styles-abc123.css` 并在每次发布时更改哈希值。可能会变得复杂，所以我建议阅读 Jake Archibald 的 [缓存最佳实践与\
  \ max-age 阱](https://jakearchibald.com/2016/caching-best-practices/)。有用链接\n\n如果你想了解更多关于渐进式\
  \ Web 应用，以下资源非常有用：\n\n*   [PWA 示例应用](https://pwa.rocks/)\n*   [Progressive Web Apps](https://developers.google.com/web/progressive-web-apps/)\n\
  *   [你的 PWA](https://codelabs.developers.google.com/codelabs/your-first-pwapp/)\n\
  *   [Mozilla Service Worker Cookbook](https://serviceworke.rs/)\n[MDN 使用 Service\
  \ Workers](https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API/Using_Service_Workers)\n\
  \n第 7 章：成为更好的 Node 开发者的 10 条建议\n\n作者 Azat Mardan\n\n\n\n\n\n我在 2012 年加入 Storify\
  \ 时开始全职从事 Node 开发。从那时起，我从未回头过，也从未觉得想念 Python、Ruby、Java 或 PHP —— 这些在我过去的十年 Web 开发中使用过的语言。\n\
  \nStorify 对我来说是一份有趣的工作，因为与许多其他公司不同，Storify 使用（可能现在仍在使用）JavaScript 运行一切。你会发现，大多数公司，尤其是像\
  \ PayPal、Walmart 或 Capital One 这样的大公司，只在技术栈的某些部分使用 Node。通常它们将其作为 API 网关或编排层。这很棒。但对于软件工程师来说，没有什么比完全沉浸在\
  \ Node 环境中更棒的。\n\n在这篇文章中，我将概述十条建议，帮助你在 2017 年成为一名更优秀的 Node 开发者。这些建议来自我（我在实战中观察并学习了它们），也来自那些编写最流行的\
  \ Node 和 npm 模块的人。以下是我们将涵盖的内容：\n\n1. **避免复杂** — 将你的代码组织成尽可能小的区块，直到它们看起来太小，然后再让它们变得更小。\n\
  2. **使用异步代码** — 像避免瘟疫一样避免同步代码。\n3. **避免阻塞 require** — 将所有的 `require` 语句放在文件顶部，因为它们是同步的并且会阻塞执行。\n\
  4. **知道 require 是缓存的** — 这可能是你代码中的一个特性，也可能是 Bug。\n5. **始终检查错误** — 错误不是足球。永远不要抛出错误，永远不要跳过错误检查。\n\
  6. **仅在同步代码中使用 try...catch** — `try...catch` 对异步代码是没用的，此外 V8 对 `try...catch` 中代码的优化也不如普通代码。\n\
  7. **返回回调或使用 if ... else** — 为了保险起见，返回一个回调以防止执行继续。\n8. **监听错误事件** — 几乎所有的 Node 类/对象都扩展了事件发射（观察者模式）并发出\
  \ `error` 事件。务必监听它。\n9. **了解你的 npm** — 使用 `-S` 或 `-D` 安装模块，而不是 `--save` 或 `--save-dev`。\n\
  10. **在 package.json 中使用精确版本**: npm 在你使用 `-S` 时会愚蠢地默认添加插入符号（^），因此请手动删除它们以锁定版本。永远不要在应用中信任语义版本（semver），但在开源模块中可以这样做。\n\
  11. **额外 — 使用不同的依赖项**。将项目仅在开发时需要的项放在 `devDependencies` 中，然后使用 `npm i --production`。非必需依赖项越多，漏洞风险就越大。\n\
  \n所以，让我们逐一分析每一个吧。准备好了吗？\n\n## 避免复杂\n\n看看由 npm 创建者 Isaac Z. Schlueter 编写的一些模块。例如，`use-strict`\
  \ 为模块强制执行 JavaScript 严格模式，它只有三行代码：\n\n```\nvar module = require('module')\nmodule.wrapper[0]\
  \ += '\"use strict';\nObject.freeze(module.wrap)\n```\n\n为什么要避免复杂？根据一个传说，一句起源于美国海军的名言是：KEEP\
  \ IT SIMPLE STUPID（保持简单，大笨蛋 —— 或者它应该是“保持简单，你大笨蛋”？）。这是有原因的。人类大脑在任何时候的工作记忆中都只能容纳五到七项内容。这是一个事实。\n\
  \n通过将你的代码模块化为更小的部分，你和其他开发者可以更好地理解和推理它。你也可以更好地测试它。考虑一下这个例子，\n\n```\napp.use(function(req,\
  \ res, next) {\n  if (req.session.admin === true) return next()\n  else return next(new\
  \ Error('Not authorized'))\n}, function(req, res, next) {\n  req.db = db\n  next()\n\
  })\n```\n\n或者这段代码：\n\n```\nconst auth = require('./middleware/auth.js')\nconst db\
  \ = require('./middleware/db.js')(db)\napp.use(auth, db)\n```\n\n我确定你们大多数人会倾向于第二个例子，特别是当名称自言易懂时。当然，当你写代码时，你可能认为自己理解它是如何工作的。也许你甚至想通过在一行中链调用几个方法来展示你有多聪明。请不要，为你那个更笨的自己写代码。为你那个六个月没看过这段代码的自己写代码，或者疲惫或醉酒的自己写代码。如果你在精力巅峰时编写代码，那么你以后将很难理解它，更不用说那些甚至不熟悉算法细节的同事了。对于使用异步方式的\
  \ Node 来说，保持简单尤其如此。\n\n是的，发生过 left-pad 事件，但那只影响了依赖公共仓库的项目，而且替代品在 11 分钟内就发布了。小型化的优点远大于缺点。此外，npm\
  \ 更改了它的发布策略，任何严肃的项目都应该使用缓存策略或私有仓库（作为临时解决方案）。\n\n## 使用异步代码\n\n同步代码在 Node 中确实有一个（很小的）位置。它主要用于\
  \ CLI 命令或其他脚本。Node 开发者主要构建 Web 应用，因此他们使用异步。例如，如果我们只是在构建一个系统，这可能是可以：\n\n```\nlet\
  \ data = fs.readFileSync('./conts.json')\ndb.collection('accounts').insert(data,\
  \ results)=>{process.exit(1)})\n```\n\n但在构建应用时，这样会更好：\n\n```\napp.use('seed', (req,\
  \ res) => {\n  let data = fs.readFile(`${req.name}.json`, results)=>{\n    res.status(201).send()\n\
  \  })\n})\n```\n\n区别在于你编写的是并发（通常是长时间运行）系统还是非并发（短运行）系统。作为经验之谈，在 Node 中始终编写异步代码。\n\
  \n## 避免阻塞 require\n\nNode 有一个简单的模块加载系统，使用 CommonJS 模块格式。它内置的 `require` 函数是包含存在于单独文件模块的简单方法。与\
  \ AMD/requirejs 不同，Node/CommonJS 的模块加载方式是同步的。`require` 的工作原理：你导入模块或文件中导出的内容。\n\n\
  ```\nconst react = require('react')\n```\n\n大多数开发者不知道的是 `require` 是被缓存的。所以，只要解析出的文件名没有发生剧烈变化（在\
  \ npm 模块的情况下会有），那么模块中的代码将只执行并加载到变量中一次（针对该进程）。这是一个很好的优化。然而，即使有缓存，你最好也将 `require`\
  \ 语句放在前面。考虑这段代码，它只在实际使用它的路由上加载 `axios` 模块。`/connect` 路由将会比需要的慢，因为模块导入是在请求发生时发生的：\n\
  \n```\napp.post('/connect', (req, res) => {\n  const axios = require('axios')\n\
  \  axios.post('apiauthorize', req.body.auth)\n    .then((response)=>res.send(response))\n\
  })\n```\n\n一种更好、性能更高的方法是在服务器定义之前加载模块，而不是在路由中：\n\n```\nconst axios = require('axios')\n\
  const express = require('express')\napp = express()\napp.post('/connect', (req,\
  \ res) => {\n  axios.post('apiauthorize', req.body.auth)\n    .then((response)=>res.send(response))\n\
  })\n```\n\n\n\n\n\n我在上一节中提到过 `require` 是被缓存的，但有趣的是，我们可以在 `module.exports` 之外编写代码。例如：\n\
  \n```javascript\nconsole.log('我不会被缓存，且只在第一次运行时执行')\nmodule.exports = () => {\n \
  \ console.log('我会被缓存，并在每次调用此模块时运行')\n}\n```\n\n了解某些代码可能只会运行一次后，你可以利用这一特性来为自己所用。\n\
  \n## 始终检查错误\n\nNode 并不是 Java。在 Java 中，你抛出错误是因为是因为在大多数情况下，如果发生错误，你不希望程序继续运行。在 Java\
  \ 中，你可以通过单个 `try...catch` 在更高层级处理多个错误。\n\nNode 则并非如此。由于 Node 使用了[事件循环](https://www.youtube.com/watch?v=8aGhZQkoFbQ)\
  \ 并异步执行，因此任何错误在发生时都会与任何错误处理器（如 `try...catch`）的上下文隔离开来。这在 Node 中是没用的：\n\n```javascript\n\
  try {\n  request.get('/accounts', (error, response)=>{\n    data = JSON.parse(response)\n\
  \  })\n} catch(error) {\n  // 不会被调用\n  console.error(error)\n}\n```\n\n但 `try...catch`\
  \ 仍然可以用于同步 Node 代码。因此，这是对上一个代码片段的更好重构：\n\n```javascript\nrequest.get('/accounts',\
  \ (error, response)=>{\n  try {\n    data = JSON.parse(response)\n  } catch(error)\
  \ {\n    // 会被调用\n    console.error(error)\n  }\n})\n```\n\n如果我们无法将 `request` 调用封装在\
  \ `try...catch` 块中，我们就面临来自请求的未处理错误。Node 开发者通过向你提供 `error` 作为回调参数来解决这个问题。因此，你需要在每一个回调中都始终手动处理\
  \ `error`。具体方法是：检查是否存在错误（确保它不为 `null`），然后向用户或客户端显示错误消息并记录它，或者通过带上 `error` 调用回调将错误向上传递回调用堆栈（如果你有回调以及调用堆栈中的另一个函数）。\n\
  \n```javascript\nrequest.get('/accounts', (error, response)=>{\n  if (error) return\
  \ console.error(error)\n  try {\n    data = JSON.parse(response)\n  } catch(error)\
  \ {\n    console.error(error)\n  }\n})\n```\n\n你可以使用的一个小技巧是使用 [okay](https://www.npmjs.com/package/okay)\
  \ 库。你可以这样应用它，以避免对无数嵌套回调进行手动错误检查（你好，[回调地狱](https://www.sitepoint.com/saved-from-callback-hell/)）。\n\
  \n```javascript\nvar ok = require('okay')\nrequest.get('/accounts', ok(console.error,\
  \ (response)=>{\n  try {\n    data = JSON.parse(response)\n  } catch(error) {\n\
  \    console.error(error)\n  }\n}))\n```\n\n## 返回回调或使用 if ... else\n\nNode 是并发的。因此，如果不小心，这一特性可能会变成\
  \ bug。为了安全起见，请使用 `return` 语句终止执行：\n\n```javascript\nlet error = true\nif (error)\
  \ return callback(error)\nconsole.log('我永远不会运行 - 很好。')\n```\n\n避免由于控制流处理不当导致某些非预期的并发（以及失败）。\n\
  \n```javascript\nlet error = true\nif (error) callback(error)\nconsole.log('我会运行。不太好！')\n\
  ```\n\n为了确保万无一失，`return` 回调以防止执行继续下去。\n\n## 监听 `error` 事件\n\n几乎所有的 Node 类/对象都扩展了事件发射器（观察者模式）并发出\
  \ `error` 事件。这为开发者提供了一个捕捉这些棘手错误并在它们造成破坏之前进行处理。\n\n养成使用 `.on()` 创建 `error` 事件监听器的良好习惯：\n\
  \n```javascript\nvar req = http.request(options, (res) => {\n  if ((+res.statusCode).match(/²\\\
  d$/)) {\n    // 成功，处理响应\n  } else if ((+res.statusCode).match(/⁵\\d$/)){\n    //\
  \ 服务器错误，与 req 不同。req 是好的。\n  }\n})\nreq.on('error', (error) => {\n  // 甚至无法发送请求：通用错误，例如\
  \ ECONNRESET, ECONNREFUSED, E_INVALID_VERSION\n  console.log(error)\n})\n```\n\n\
  ## 了解你的 npm\n\n许多 Node 和前端开发者知道有 `--save`（用于 `npm install`），它不仅会安装模块，还会在 `package.json`\
  \ 中创建一个带有版本的条目。很好，还有 `--save-dev`，用于 `devDependencies`（生产环境中不需要的东西）。但你知道你可以直接用 `-S`\
  \ 和 `-D` 代替 `--save` 和 `--save-dev` 吗？是的，你可以这样做。\n\n而且在你安装模块时，顺便删掉那些 `-S` 和 `-D`\
  \ 为你创建的 `^` 符号。这些符号是危险的，因为它们允许 `npm install`（或其快捷方式 `npm i`）从 npm 获取最新的次版本（语义化版本中的第二个数字）版本。例如，从\
  \ `v6.1.0` 到 `v6.2.0` 是一个次版本发布。\n\n`npm` 团队相信[semver](http://semver.org/)，但你不应该信任。我的意思是他们允许开源开发者在次版本中引入破坏性变更。使用\
  \ [shrinkwrap](https://nodejs.org/blog/managing-dependencies-with-shrinkwrap/) 来锁定版本。\n\
  \n## 结论\n\n这篇文章是两部分之一。我们已经涵盖了大量内容，从处理回调和异步代码到检查错误。我希望你从中发现了新的或有用的内容。如果你喜欢，请务必查看第二部分：[Node.js\
  \ 实践：来自大师的启示](https://www.sitepoint.com/node-js-best-practices-from-gurus/)。\n\n\
  ## 第 8 章：函数式 JavaScript 简介\n\nM. David\n\n你听说过 JavaScript 是一种函数式语言，或者至少它支持函数式编程。但什么是函数式编程？而且，如果你开始学习编程范式，对于你一直编写的\
  \ JavaScript 来说？\n\n嗯，好消息是 JavaScript 在范式方面并不挑剔。你可以根据需要混合命令式、面向对象、原型和函数式代码，并仍然完成工作。但坏消息是这对你的代码意味着什么。JavaScript\
  \ 同时支持多种编程风格，因此对于维护性、可读性和性能做出正确的选择。\n\n函数式 JavaScript 不需要接管整个项目就能产生价值。学习一些函数式方法可以引导你在构建项目时的某些决策，无论你倾向于如何组织代码。学习一些函数式模式和技术可以让你走上编写更简洁、更优雅\
  \ JavaScript 的道路。\n\n## 命令式 JavaScript\n\nJavaScript 最初是作为浏览器内语言流行的，主要用于为网页上的元素添加简单的悬停和点击效果。多年来，这就是人们对它的大部分了解，而且这导致了\
  \ JavaScript 早期获得的坏声誉。\n\n当开发者努力让 JavaScript 的灵活性匹配文档对象模型（DOM）的复杂性时，现实世界的 JavaScript\
  \ 代码通常像这样：\n\n```javascript\nvar result;\nfunction getText() {\n  var someText =\
  \ prompt(\"给我一些需要大大写的文字\");\n  capWords(someText);\n  alert(result.join(\" \"));\n\
  };\nfunction capWords(input) {\n  var counter;\n  var inputArray = input.split(\"\
  \ \");\n  var transformed = \"\";\n  result = [];\n  for (counter = 0; counter <\
  \ inputArray.length; counter++) {\n    transformed = [\n      inputArray[counter].charAt(0).toUpperCase(),\
  \ \n      inputArray[counter].substring(1)\n    ].join(\"\");\n    result.push(transformed);\n\
  \  }\n};\n\ndocument.getElementById(\"main_button\").onclick = getText;\n```\n\n\
  \n\n这段简小的代码片段中发生了许多操作。变量在全局作用域被定义。值在函数之间传递并修改。DOM 方法与原生 JavaScript 混合在一起。函数名没有很好的描述性，这部分部分是因为整个程序依赖于一个可能存在也可能不存在的上下文。但如果你恰好在\
  \ HTML 文档的浏览器中运行这段代码，且其中定义了一个 `<button id=\"main_button\">`，你可能会被提示输入一些文本，然后看到一个\
  \ `alert` 框，显示该文本中每个单词的首字母大写的结果。\n\n这种命令式代码的编写是为了从上到下读取和执行的（稍不考虑一些[变量提升](http://www.sitepoint.com/demystifying-javascript-variable-scope-hoisting/)）。但我们也可以利用\
  \ JavaScript 的面向对象特性对其进行一些改进，使其更整洁、更具可读性。\n\n## 面向对象的 JavaScript\n\n几年后，开发者开始注意到在浏览器等共享环境中使用命令式编码存在的问题。一个\
  \ JavaScript 代码段的全局变量会覆盖另一个片段设置的全局变量。代码调用的顺序会以不可预测的方式影响结果，特别是考虑到网络连接和渲染时间引入的延迟。\n\
  \n最终，出现了一些更好的实践，来帮助封装 JavaScript 代码并使其与 DOM 交互得更好。上述代码的一个更新版本（按照面向对象的标准编写）看起来可能如下所示：\n\
  \n```javascript\n(function() {\n  \"use strict\";\n  var SomeText = function(text)\
  \ {\n    this.text = text;\n  };\n  SomeText.prototype.capify = function(str) {\n\
  \    var firstLetter = str.charAt(0);\n    var remainder = str.substring(1);\n \
  \   return [firstLetter.toUpperCase(), remainder].join(\"\");\n  };\n  SomeText.prototype.capifyWords\
  \ = function() {\n    var result = [];\n    var textArray = this.text.split(\" \"\
  );\n    for (var counter = 0; counter < textArray.length; counter++) {\n      result.push(this.capify(textArray[counter]));\n\
  \    }\n    return result.join(\" \");\n  };\n  document.getElementById(\"main_button\"\
  ).addEventListener(\"click\", function(e) {\n    var something = prompt(\"Give me\
  \ something to capitalize\");\n    var newText = new SomeText(something);\n    alert(newText.capifyWords());\n\
  \  });\n}());\n```\n\n在在这个面向对象的版本中，构造函数模拟了一个类来构建我们想要的对象。方法存储在新对象的原型上，以保持低内存占用。所有代码都隔离在一个匿名的立即执行函数表达式中，因此不会污染全局作用域。甚至还使用了\
  \ `\"use strict\"` 指令来利用最新的 JavaScript 引擎，并且旧式的 `onclick` 方法被全新的 `addEventListener`\
  \ 取代，因为现在还有谁在用 IE8 或更早版本呢？这样的脚本可能会插入到 HTML 文档 `<body>` 元素的末尾，以确保在处理之前所有 DOM 都已加载，从而使其它依赖的\
  \ `<button>` 是可用的。\n\n尽管经过了这些重构，仍然存在许多导致我们走到这里的命令式风格痕迹。构造函数中的方法依赖于父对象作用域的变量。有一个循环结构用于遍历字符串数组的所有成员。有一个\
  \ `counter` 变量，除了增加 `for` 循环的进度外没有其他用途。还有一些方法会产生修改其定义之外变量的副作用。这一切使得代码更加脆弱、可移植性更差，并且更难在这个狭窄的上下文之外测试这些方法。\n\
  \n## 函数式 JavaScript\n\n面向对象的方法比我们开始使用的命令式方法要整洁且模块化得多，但让我们看看能否通过解决我们讨论过的某些缺点来改进它。如果我们能找到方法利用\
  \ JavaScript 将函数视为一等对象的内置能力，那就太好了，这样我们的代码就可以更整洁、更稳定且更容易重用。\n\n```javascript\n(function()\
  \ {\n  \"use strict\";\n  var capify = function(str) {\n    return [str.charAt(0).toUpperCase(),\
  \ str.substring(1)].join(\"\");\n  };\n  var processWords = function(str) {\n  \
  \  return str.split(\" \").map(capify).join(\" \");\n  };\n  document.getElementById(\"\
  main_button\").addEventListener(\"click\", function(e) {\n    var something = prompt(\"\
  Give me something to capitalize\");\n    alert(processWords(something));\n  });\n\
  }());\n```\n\n你注意到这个版本短了了吗？我们只定义了两个函数：`capify` 和 `processWords`。每一个都是纯函数，这意味着它们对于任何给定的输入都会返回相同的的结果。在这里使用\
  \ `map` 代替 `for` 循环，消除了 `counter` 变量，并帮助我们的代码变得整洁得多。\n\n\n\n\n我选择 Chart.js 是因为它可以被快速学习和利用。它的设计初衷是简单性，但又具有极高的定制性。根据我的经验，图表库分布在一个复杂性光谱上，越复杂的库提供的定制化程度越深，但学习曲线也越陡峭。Chart.js\
  \ 是最容易学习、最简单的库之一，且不会严重限制你的选择。它自带了八种不同的图表类型，可以涵盖你几乎所有的数据可视化需求。\n\nChart.js 由开源社区以高标准进行活跃维护。它最近达到了\
  \ 2.0 版本，该版本包含了一些基础语法变化，以使代码更加一致，并提供了对移动设备的支持。在这篇文章中，我将使用 Chart.js 2.0 及其更新后的语法。在文章最后，在让有机会看到\
  \ Chart.js 2.0 如何工作之后，将有一个章节介绍从 1.0 到 2.0 的过渡，以及在网上阅读旧的 Chart.js 示例时应该会有什么。\n\n\
  ## 安装 Chart.js\n\n再次，Chart.js 侧重于易用。易学、易利用、易安装。如果你想深入研究实际代码，请[查看 GitHub 项目](https://github.com/modernjsant/chartjs/Chart.js)。\n\
  \n使用 Chart.js 只需要两个东西。\n\n1) 库 - 对于本指南，我建议使用 CDN，因为这是快速上手的最简单方法。\n\n```html\n<script\
  \ src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.1.4/Chart.min.js\"></script>\n\
  ```\n\n2) 一个 `<canvas>` 元素，因为 Chart.js 利用了 HTML5 canvas。\n\n```html\n</canvas><canvas\
  \ id=\"myChart\"></canvas>\n```\n\n或者，你可以使用包管理器下载该库。更多信息请参阅[入门指南](http://www.chartjs.org/docs/#getting-started)。\n\
  \n简单吧，对吧？现在，废话不多说，让我们来看看 Chart.js 提供了什么。\n\n# 折线图\n\n这就是在 Chart.js 中创建一个最小折线图所需的所有内容。只需要在声明\
  \ HTML5 canvas 之后，将其放在 `<body>` 内部某处的 `<script></script>` 标签中即可。\n\n```javascript\n\
  var ctx = document.getElementById('myChart').getContext('2d');\nvar myChart = new\
  \ Chart(ctx, {\n  type: 'line',\n  data: {\n    labels: ['M', 'T', 'W', 'T', 'F',\
  \ 'S', 'S'],\n    datasets: [{\n      label: 'apples',\n      data: [12, 19, 3,\
  \ 17, 6, 3, 7],\n      backgroundColor: \"rgba(153,255,51,0.4)\"\n    }, {\n   \
  \   label: 'oranges',\n      data: [2, 29, 5, 5, 2, 3, 10],\n      backgroundColor:\
  \ \"rgba(255,153,0,0.4)\"\n    }]\n  }\n});\n```\n\n查看 [CodePen](http://codepen.io)\
  \ 上 SitePoint 发布的 [2 - Line chart](http://codepen.io/SitePoint/pen/WGZGNE/) ([@SitePoint](http://codepen.io/SitePoint))。\n\
  \n![](img/00002.jpg)\n\n如果这段代码看起来很复杂，别担心！所有的 Chart.js 示例大部分都遵循上述格式，所以你只需要学习一次。让我们逐行理解正在发生什么。\n\
  \n```javascript\nvar ctx = document.getElementById(\"myChart\").getContext('2d');\n\
  ```\n\n这一行获取了我们之前创建的 `<canvas>` 元素的引用，然后对其调用了 `getContext` 方法。`getContext` 方法返回一个对象，该对象[提供了方法和属性](https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D)\
  \ 用于在画布上绘制。我们将其存储在名为 `ctx` 的变量中。\n\n```javascript\nvar myChart = new Chart(ctx,\
  \ {\n  type: 'line',\n  data: // 折线数据数组在这里\n});\n```\n\n在这里我们正在创建图表对象。我暂时排除了数据，以便关注\
  \ `type` 属性，它决定了我们想要的图表类型。Chart.js 的 `new Chart()` 构造函数接受两个参数：\n\n1. 要渲染图表的 `<canvas><canvas>`\
  \ 元素的引用，或者是其 2d 绘图上下文的引用（在这里我们使用的是 2d）。无论使用哪一个，Chart.js 的惯例将其称为 `ctx`。\n2. 一个包含\
  \ Chart.js 用于构建你的图表的数据和配置的字面量对象。必需的属性是 `type` 和 `data`。在我们的示例中，`type` 为 'line'，因为我们想要折线图。`data`\
  \ 是你用于填充图表的数据。 Chart.js 使用数组来确定图形的位置，因此 'apples' 的第一个点值将为 '12'，第二个将为 '19$，依此类推。添加新行就像添加一个带有\
  \ `label` 和 `data` 的新对象一样简单。\n\n最后，我为每个集合设置了 rgba 背景色，使其更具吸引力。要了解更多关于折线图的信息，请[查看文档](http://www.chartjs.org/docs/#line-chart)\n\
