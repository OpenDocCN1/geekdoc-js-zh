- "# Modern JavaScript 入门指南\n\n\n\n![](img/calibre_cover.jpg)\n\n\n\n\n\n\n\n\n\n\
  ## 关于 SitePoint\nSitePoint 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问 [`www.sitepoint.com/`](http://www.sitepoint.com/)\
  \ 访问我们的博客、书籍、时通讯、文章和社区论坛。你将在这里找到关于 JavaScript、PHP、设计等大量信息。\n\n## 前言\n如今，看到人们抱怨 JavaScript\
  \ 开发变得多么复杂并不罕见。如果这种观点来自一个对该语言的新手，我们对此表示某种同情。如果你正在学习 JS，很快就会接触到庞大的生态系统，以及为了构建现代 Web\
  \ 应用程序需要理解（至少在概念上）的海量变动部分。包管理、代码检查、转译、模块打包、代码压缩、源码映射、框架、单元测试、热重载……不可否认，这比仅仅在页面中包含几个\
  \ `<script>` 标签并通过 FTP 上传到服务器要复杂得多。\n\n长期以来，JavaScript 被许多人视为一个笑话；一种玩具级语言，其唯一的用途就是添加一些非必要的视觉点缀（如鼠标悬停变化），并且经常是奇怪错误和页面崩溃的根源。尽管从早期以来已经取得了巨大进步，但今天仍有人不认真对待这种语言。对\
  \ PHP 开发者产生同情也并不难。无论好坏，JavaScript 都是（目前也是）绝大多数 Web 浏览器原生支持的唯一语言。社区努力改进语言本身，并提供工具帮助构建生产级应用。\n\
  \n这本合集是文章的汇，精选自 SitePoint 的 [JavaScript 频道](https://www.sitepoint.com/javascript/)，旨在让你在现代\
  \ JavaScript 开发中抢占先机。当然，由于语言和生态系统的演变速度都非常快，跟上最新进展至关重要。不要掉队，在读完这本书后，请前往该频道以跟上新趋势和技术！\n\
  \nJames Hibbard & Nilson Jacques，SitePoint JavaScript 频道编辑。\n\n## 使用的规范\n你会注意到，我们在本书中使用了特定的布局样式来表示不同类型的信息。请关注以下项目。\n\
  \n### 代码示例\n书中的代码使用等宽字体显示，如下：\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk.</p>\n\
  ```\n\n某些代码行应该在一行输入，但由于页面限制，我们不得不对它们进行换行处理。➥ 表示仅出于格式目的而存在的换行，应该被忽略：\n\n```javascript\n\
  URL.open(\"http://www.sitepoint.com/responsive-web-design-real-user-testing/?responsive1\"\
  );\n```\n\n### 提示、注释和警告\n\n**嘿，你！**\n提示（Tips）提供有用的小建议。\n\n**额咳，打扰一下……**\n注释（Notes）与当前主题相关但并非关重要的有用补充。将它们视为额外的信息片段即可。\n\
  \n**确保你始终……**\n……注意这些重要要点。\n\n**小心！**\n警告（Warnings）强调可能会可能会让你出错的任何陷阱。\n\n## 第 1\
  \ 章：现代 JavaScript 应用程序剖析\n作者 James Kolce\n\n毫无疑问，JavaScript 生态系统的变化极快。不仅新工具和框架以快速速度引入和开发，语言本身也随着\
  \ ES2015（又称 `ES6`）的引入发生了巨大的变化。可以理解，现在有许多文章在抱怨学习现代 JavaScript 开发有多困难。\n\n在这篇文章中，我将向你介绍现代\
  \ JavaScript。我们将查看该语言的最新进展，并概述当前用于编写前端 Web 应用程序的工具和技术。如果你刚开始学习这种语言，或者已经多年没碰它，并好奇你以前熟悉的\
  \ JavaScript 发生了什么变化，那么这篇文章就是为你准备的。\n\n### 关于 Node.js 的说明\n`Node.js` 是一个允许使用 JavaScript\
  \ 编写服务器程序的运行时。可以拥有全栈 JavaScript 应用程序，前后端都使用 JavaScript。`Node.js` 的到来对生态系统产生了重大影响，引入了\
  \ `npm` 包管理器并普及了 CommonJS 模块格式。\n\n### JavaScript2015\n2015 年，ECMAScript](https://en.wikipedia.org/wiki/ECMAScript)——定义\
  \ JavaScript 的规范以 `ES6` 的名称发布。这个新版本包含了语言的重大补充。改进并没有停止于 ES2015；每年都会发布新版本。\n\n###\
  \ 声明变量\nJavaScript 现在有了额外的变量声明方式：[let 和 const](https://www.sitepoint.com/how-to-declare-variables/)。\n\
  \n`let` 是 `var` 的继承者——尽管 `var` 仍然可用，但 `let` 将变量的作用域限制在所在的块内（而不是函数），这减少了出错的空间：\n\n\
  ```javascript\n// ES5\nfor (var i = 1; i < 5; i++) {\n  console.log(i);\n}\n// <--\
  \ 打印 1 到 4\nconsole.log(i); // <-- 5（变量 i 在循环外存在）\n\n// ES2015\nfor (let j = 1;\
  \ j < 5; j++) {\n  console.log(j);\n}\nconsole.log(j); // <-- 'Uncaught ReferenceError:\
  \ j is not defined'\n```\n\n使用 `const` 可以定义不能重新绑定到新值的变量。对于字符串和数字等原始值，这类似于常量，因为一旦声明无法更改其值。\n\
  \n```javascript\nconst name = 'Bill';\nname = 'Steve';\n// <-- 'Uncaught TypeError:\
  \ Assignment to constant variable.'\n```\n\n**陷阱**\n```javascript\nconst person\
  \ = { name: 'Bill' };\nperson.name = 'Steve';\n// person.name 现在是 Steve。 \n// 因为我们没有更改\
  \ person 绑定的对象，JavaScript 不会报错。\n```\n\n## 箭头函数\n\n\n\n\n\n## 箭头函数\n\n箭头函数为声明匿名函数（lambda）提供了一种更简洁的语法，当函数体只有一个表达式时，可以省去\
  \ `function` 关键字和 `return` 关键字。这允许你以更优雅的方式编写函数风格的代码。\n\n```javascript\n// ES5\n\
  var add = function(a, b) {\n  return a + b;\n}\n\n// ES2015\nconst add = (a, b)\
  \ => a + b;\n```\n\n箭头函数的另一个重要特性是它们会从定义时的上下文继承 `this` 的值：\n\n```javascript\nfunction\
  \ Person() {\n  this.age = 0;\n  // ES5\n  setInterval(function() {\n    this.age++;\
  \ // |this| 指向全局对象\n  }, 1000);\n  // ES2015\n  setInterval(() => {\n    this.age++;\
  \ // |this| 正确地指向 person 对象\n  }, 1000);\n}\n\nvar p = new Person();\n```\n\n##\
  \ 改进的 Class 语法\n\n如果你是面向对象编程的粉丝，可能会喜欢语言在现有原型机制的基础上增加了类（classes）。虽然这只是语法糖，但它为试图用原型模拟经典面向对象编程的开发者提供了更简洁的语法。\n\
  \n```javascript\nclass Person {\n  constructor(name) {\n    this.name = name;\n\
  \  }\n  greet() {\n    console.log(`Hello, my name is ${this.name}`);\n  }\n}\n\
  ```\n\n## Promises / 异步函数\n\nJavaScript 的异步本质长期以来一直挑战；在处理如 Ajax 请求时，任何复杂的应用都有陷入回调地狱的风险。\n\
  \n幸运的是，ES2015 增加了对 [promises](https://www.sitepoint.com/deeper-dive-promises/) 的原生支持。Promises\
  \ 代表目前不存在但以后可能的值，使得异步函数的调用更易于管理。ES2017 引入了 [async functions](https://www.sitepoint.com/simplifying-async-functions/)（有时被称为\
  \ async/await），在该领域带来了改进，允许你像处理同步代码一样处理异步代码。\n\n```javascript\nasync function doAsync\
  \ () {\n  const result = await asynchronousOperation();     \n  console.log(result);\n\
  \  return result;\n};\n```\n\n## 模块\n\nES2015 添加的另一个显著特性是原生模块格式，使得模块的定义和使用成为语言的一部分。以前模块仅以第三方库的形式存在。我们将在下一节深入查看模块。\n\
  \n这里我们不会讨论其他特性，但在查看现代 JavaScript 时，你会注意到一些主要的差异。你可以通过 [Learn ES2015](https://babeljs.io/learn-es015/)\
  \ 页面在 [Babel site](https://babeljs.io/) 查看完整的列表。这些特性包括模板字符串、迭代器、生成器以及如 `Map` 和 `Set`\
  \ 等新数据结构。\n\n### 关于 ES2015\n要了解更多关于 ES2015 的知识，请查看我们的课程：[Diving into ES2015](https://www.sitepoint.com/premium/224)\n\
  \n## 代码检查\n\nLinter 是解析你的代码并根据一组规则进行对比、检查语法错误、格式和良好实践的工具。虽然建议每个人都使用 linter，但当你刚开始时它特别有用。当你的代码编辑器/IDE\
  \ 配置好后，你可以获得即时反馈，以确保你在学习新语言特性时不会被语法错误困住。你可以 [查看 ESLint](https://www.sitepoint.com/up-and-running-with-eslint/)，它是最流行的\
  \ linter 且支持 ES2015+。\n\n## 模块化代码\n\n现代 Web 应用可能有数千（甚至数十万）行代码。如果没有将所有内容组织成更小组件的机制，进行这种规模的工作几乎是不可能的，这样可以编写专门且隔离的代码。\n\
  \n### CommonJS\n多年出现了一些模块格式，最流行的是 [CommonJS](https://en.wikipedia.org/wiki/CommonJS)。它是\
  \ Node.js 的默认格式。它使用 `module` 对象来导出，使用 `require()` 函数来导入。\n\n```javascript\n// lib/math.js\n\
  function sum(x, y) {\n  return x + y;\n}\nmodule.exports = {\n  sum: sum,\n  pi:\
  \ 3.14159\n};\n\n// app.js\nconst math = require(\"./lib/math\");\nconsole.log(math.sum(1,\
  \ 2));\n```\n\n### ES2015 模块\nES2015 引入了直接在语言中定义和消费模块的方法。示例：\n\n```javascript\n\
  // lib/math.js\nexport function sum(x, y) {\n  return x + y;\n}\nexport const pi\
  \ = 3.14159;\n\n// app.js\nimport { sum } from \"./lib/math\";\nconsole.log(sum(1,\
  \ 2));\n```\n\n或者我们也可以导入需要的：\n\n```javascript\n// app.js\nimport { sum } from \"\
  ./lib/math\";\n```\n\n## 包管理\n\n其他语言长期以来都有自己的仓库和管理器，以便查找和安装第三方库。Node.js 自带包管理器和仓库\
  \ [npm](https://www.sitepoint.com/beginners-guide-node-manager/)。尽管还有其他可用，但 npm\
  \ 已成为事实上的 JavaScript 包管理器，并被称为最大的包注册表。\n\n在 [npm 仓库](https://www.npmjs.com/) 中，你可以找到第三方模块，可以使用\
  \ `npm install <package>` 命令轻松地下载并在项目中使用它们。包被下载到本地的 `node_modules` 目录，其中包含了所有的包和依赖项。\n\
  \n你下载的包可以注册为项目的依赖，位于 [package.json](https://docs.npmjs.com/files/package.json) 文件中，其中包含关于项目或模块的信息（其本身也可以作为包发布到\
  \ npm 上）。\n\n你可以为开发和生产定义单独依赖。生产依赖是包运行所需的，而开发依赖对于开发者来说是必要的。\n\n### 示例 package.json\
  \ 文件\n\n```json\n{\n  \"name\": \"demo\",\n  \"version\": \"1.0.0\",\n  \"description\"\
  : \"Demo package.json\",\n  \"main\": \"main.js\",\n  \"dependencies\": {\n    \"\
  mkdirp\": \"⁰.5.1\",\n    \"underscore\": \"¹.8.3\"\n  },\n  \"devDependencies\"\
  : {},\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test specified\\\" &&\
  \ exit 1\"\n  },\n  \"author\": \"Sitepoint\",\n  \"license\": \"ISC\"\n}\n```\n\
  \n\n\n我们在开发现代 Web 应用时编写的代码，几乎从没有直接进入过生产环境。我们使用现代版本的 JavaScript 编写代码，这些代码可能不受浏览器支持；我们大量使用位于\
  \ `node_modules` 文件夹中的第三方包及其依赖项；我们可能还有如静态分析工具或压缩化工具等流程。构建工具（Build tooling）的存在是为了帮助将所有这些转换为可以高效部署并被大多数\
  \ 浏览器理解的内容。\n\n## 模块打包 (Module bundling)\n\n在使用 ES2015/CommonJS 模块编写整洁、复用的代码时，我们需要某种方法来加载这些模块（至少在浏览器原生支持\
  \ ES2015 模块加载之前是）。在 HTML 中引入大量的 `<script>` 标签并不是一个可行的方案，因为对于任何严肃的应用来说，这都会迅速变得难以管理，而且所有这些独立的\
  \ HTTP 请求会损害性能。\n\n我们可以使用 ES2015 的 `import` 语句（或 CommonJS 的 `require`）在需要的地方引入所有模块，并使用模块打包器（module\
  \ bundler）将所有内容合并成一个或多个文件（包，bundles）。我们将上传到服务器并包含在 HTML 中的，正是这些打包后的文件。它将包含你导入的所有模块及其必要的依赖项。\n\
  \n目前有几种流行的选择，最流行的是 [Webpack](http://webpack.js.org)、[Browserify](http://browserify.org)\
  \ 和 [Rollup.js](http://rollupjs.org)。你可以根据自己的需求选择其中一种。\n\n### 学习更多关于模块打包\n\n如果你想了解更多关于模块打包以及它如何融入应用开发大局，我推荐阅读\
  \ [理解 JavaScript 模块：打包与转译](https://www.sitepoint.com/javascript-modules-bundling-transpiling/)。\n\
  \n## 转译 (Transpilation)\n\n虽然[现代浏览器对 ES2015 的支持已经非常好](http://kangax.github.io/compat-table/es6/)，但你的目标用户可能包含部分支持或完全不支持的旧版浏览器和设备。\n\
  \n为了让我们的现代 JavaScript 能够运行，我们需要将编写的代码翻译为早期版本（通常是 ES5）的等效代码。这项任务的标准工具是 [Babel](https://babeljs.io)，它是一个将你的代码翻译为大多数浏览器兼容代码的编译器。通过这种方式，你不需要等待厂商实现所有功能，可以直接使用所有现代\
  \ JS 特性。\n\n有些功能需要的不仅仅是语法翻译；Babel 包含了一个 [Polyfill](http://babeljs.io/docs/usage/polyfill/)，它模拟了某些复杂功能（如\
  \ promises）所需的某些机制。\n\n## 构建系统与任务运行器 (Build systems & task runners)\n\n模块打包和转译只是我们在项目中可能需要的两个构建过程。其他过程还包括代码压缩（以减小文件大小）、分析工具，以及可能与\
  \ JavaScript 无关的任务，例如图像优化或 CSS/HTML 预处理。\n\n任务管理可能会变成一项繁杂的工作，我们需要一种自动化方式来处理它，能够通过更简单的命令执行所有操作。用于此任务的最流行的两个工具是\
  \ [Grunt.js](http://gruntjs.com) 和 [Gulp.js](http://gulpjs.com)，它们提供了一种按顺序将你的任务组织成组的方法。\n\
  \n例如，你可以有一个像 `gulp build` 这样的命令，它可能会运行代码检查器、使用 Babel 进行转译过程以及使用 Browserify 进行模块打包。我们不需要按顺序记住三个命令及其相关的参数，只需要执行一个命令就能自动处理整个过程。\n\
  \n每当你发现自己在手动为项目组织处理步骤时，请思考一下是否可以使用任务运行器实现自动化。\n\n## 应用架构 (Application Architecture)\n\
  \nWeb 应用的要求与网站有所不同。例如，虽然对于博客来说，页面刷新是可以接受的，但对于像 Google Docs 这样的应用则完全不是。你的应用行为应该尽可能接近桌面应用，否则可用性将受到影响。\n\
  \n旧式的 Web 应用通常是通过从 Web 服务器发送多个页面来实现的，当需要大量动态性时，通过 Ajax 根据用户操作替换 HTML 块来加载内容。虽然这是向更动态的\
  \ Web 迈出的一一步，但它确实有其复杂性；在每次用户操作时发送 HTML 片段甚至整个页面都是资源的浪费，特别是从用户的角度来看更是时间的浪费。其可用性仍然无法匹配桌面应用的响应速度。\n\
  \n为了改进这一点，我们创建了两种构建 Web 应用的新方法，从向用户展示应用的方式到客户端与服务器通信的方式。尽管应用所需的 JavaScript 数量也急剧增加，但结果是现在的应用行为非常接近原生应用；每次点击按钮时都不需要刷新页面或长时间的等待。\n\
  \n### 单页应用 (SPAs)\n\nWeb 应用最常见的高层架构被称为 [SPA](https://en.wikipedia.org/wiki/Single-page_application)，意为单页应用。SPA\
  \ 是巨大的 JavaScript 集合，包含了应用正常运行所需的所有内容。UI 完全在客户端渲染，因此不需要重新加载。唯一变化的是应用内部的数据，这通常通过远程\
  \ API 配合 [Ajax](https://en.wikipedia.org/wiki/Ajax_(programming)) 或另一种异步通信方法来处理。\n\
  \n这种方法的一个缺点是应用首次加载耗时间较长。然而，一旦加载完成，视图（页面）之间的切换通常要快得多，因为在客户端和服务器之间传输的只是纯数据。\n\n###\
  \ 通用型 / 同构应用 (Universal / Isomorphic Applications)\n\n尽管 SPA 提供了极的用户体验，但根据你的需求，它们可能不是最佳解决方案。特别是当你需要更快的初始加载时间或搜索引擎的最优索引时。\n\
  \n解决这些问题的一种较新方法被称为 [同构](http://isomorphic.net/javascript)（或通用型）JavaScript 应用。在这种架构中，大部分代码可以在服务器和客户端执行。你可以选择想要在服务器上渲染的内容以实现更快的初始加载，之后由客户端接管渲染。由于页面最初在服务器上渲染，搜索引擎可以对其进行正确的索引。\n\
  \n## 部署 (Deployment)\n\n在现代 JavaScript 应用中，你编写的代码与部署到生产环境的代码并不相同；你只部署构建过程的结果。完成此操作的工作流取决于项目的规模、参与开发的人数，有时取决于你使用的工具/库。\n\
  \n例如，如果你独立开发一个简单的项目，每当准备好部署时，只需运行构建过程并将生成的文件上传到 Web 服务器即可。请记住，你只需要上传构建过程产生的文件（转译、模块打包、压缩等），这可以是一个包含整个应用及其依赖的单个\
  \ .js 文件。\n\n你可以拥有如下目录结构：\n\n```\n├── dist\n│   ├── app.js\n│   └── index.html\n\
  ├── node_modules\n├── src\n│   ├── lib\n│   │   ├── login.js\n│   │   └── user.js\n\
  │   ├── app.js\n│   └── index.html\n├── gulpfile.js\n├── package.json\n└── README\n\
  ```\n\n所有的应用文件都在 `src` 目录下，使用 ES2015 编写，并导入通过 npm 安装的包以及来自 `lib` 目录的自定义模块。\n\n\n\
  \n\n然后你可以运行 Gulp，它将执行 `gulpfile.js` 中的指令来构建你的项目：将所有模块打包成一个文件（包括通过 `npm` 安装的模块）、将\
  \ ES2015+ 编译为 ES5、对生成的文件进行压缩等。然后，你可以配置它将结果输出到方便的 `dist` 目录中。\n\n## 无需处理的文件\n\n如果你有不需要任何处理的文件，只需将它们从\
  \ `src` 复制到 `dist` 目录即可。你可以在构建系统中为该操作配置一个任务。\n\n现在，你只需要将 `dist` 目录中的文件上传到 Web 服务器即可，而无需担心其他仅对开发有用的文件。\n\
  \n## 团队开发\n\n如果你与其他开发者一起工作，很可能也正在使用共享代码仓库（如 GitHub）来存储项目。在这种情况下，你可以在提交（commit）之前运行构建过程，并将结果与其他文件一起存储在\
  \ Git 仓库中，以便后续下载到生产服务器。\n\n然而，如果几位开发者共同工作，将构建后的文件存储到仓库中容易出错，而且你可能希望保持项目整洁，不包含构建产物。幸运的是，有更好的处理方法：你可以在流程中使用如\
  \ [Jenkins](http://jenkins.io)、[Travis CI](http://travis-ci.org)、[CircleCI](http://circleci.com)\
  \ 等服务，这样它在每次提交推送到仓库后都能自动构建你的项目。开发者只需担心推送代码更改，而无需每次都预先构建项目；同时，仓库也保持了整洁，没有自动生成的文件；最后，你仍然拥有构建好的文件可供部署。\n\
  \n## 结论\n\n如果你近几年没有接触 Web 开发，从简单网页到现代 JavaScript 应用程序的转变可能看起来望而生畏，但我希望这篇文章能作为一个有用的起点。我尽可能为每个主题都链接了更深入的文章，以便你进一步探索。\n\
  \n请记住，如果在某个时刻，在查看所有可用选项后，觉得一切看起来都难以从心且混乱；那么只需记住 [KISS 原则](https://en.wikipedia.org/wiki/KISS_principle)，只使用你认为需要的，而不是你拥有的所有。根结底，解决问题才是最重要的，而不是使用所有最新的东西。\n\
  \n## 第 2 章：Gulp.js 简介\n\n作者：Craig Buckler\n\n由 [Giulio Mainardi](https://www.sitepoint.com/author/gmainardi/)\
  \ 和 [Tim Severien](https://www.sitepoint.com/author/tseverien/) 同行评审。\n\n开发者花在编码上的时间非常有限。即使我们忽略那些烦人的会议，大部分工作也包含会耗尽你工作日的基础任务：\n\
  \n* 从模板和内容文件生成 HTML\n* 压缩新图片和修改过的图片\n* 将 Sass 编译为 CSS 代码\n* 从脚本中移除 `console` 和 `debugger`\
  \ 语句\n* 将 ES6 转换为跨浏览器兼容的 ES5 代码\n* 代码检查（linting）和验证\n* 合并并压缩 CSS 和 JavaScript 文件\n\
  * 将文件部署到开发、测试和生产服务器\n\n每当你做出更改时，必须重复这些任务。你可能初衷良好，但即使是最无失的开发者也会忘记压缩一两张图片。随着时间的推移，生产前的任务变得越来越艰巨且耗时；你会畏惧那些不可避免的内容和模板更改。这是一项枯燥、重复的工作。把时间花在更有价值的工作上难道会更好吗？\n\
  \n如果是这样，你需要一个任务运行器或构建流程。\n\n## 这听起来复杂得可怕！\n\n创建一个构建流程需要时间。它比手动执行每个任务要复杂，但从长远来看，你将节省数小时的工作，减少人为错误并保持理智。采取务实的方法：\n\
  \n* 优先自动化最令人沮丧的任务\n* 尽量不要让你的构建流程过于复杂；一两个小时对于初始设置已经足够了\n* 选择一个任务运行软件并坚持一段时间。不要随心切换到另一个选项。\n\
  \n某些工具和概念对你来说可能是新的，但请深呼吸，一次专注于一件事。\n\n## 任务运行器：可选方案\n\n诸如 [GNU Make](https://www.gnu.org/software/make/)\
  \ 这样的构建工具已经存在了几十年，但针对 Web 的任务运行器是一个相对新的现象。第一个实现规模效应的是 [Grunt](http://gruntjs.com/)\
  \ - 这是一个 Node.js 任务运行器，它使用（最初）由 JSON 配置文件控制的插件。Grunt 取得了成功，但也存在许多问题：\n\n1. Grunt\
  \ 的基本功能（如文件监听）需要插件。\n2. Grunt 插件通常执行多个任务，这使得自定义变得更加笨拙。\n3. 对于最基础任务之外的所有任务，JSON 配置可能变得难以维护。\n\
  4. 任务运行速度较慢，因为 Grunt 在每个处理步骤之间都会保存文件。\n\n许多问题在后续版本中得到了解决，但 [Gulp](http://gulpjs.com/)\
  \ 已经到来并提供了许多改进：\n\n1. 像文件监听这样的功能是内置的。\n2. Gulp 插件（大部分）设计为执行单项工作。\n3. Gulp 使用 JavaScript\
  \ 配置代码，更更简洁、更易读、更易修改，并提供了更好的灵活性。\n4. Gulp 速度更快，因为它使用 [Node.js streams](https://www.sitepoint.com/basics-node-js-streams/)\
  \ 通过一系列管道（piped）插件传递数据。文件只在任务结束时才写入。\n\n当然，Gulp 本身并不完美，而新的任务运行器如 [Broccoli.js](http://broccolijs.com/)、[Brunch](http://brunch.io/)\
  \ 和 [webpack](https://webpack.github.io/) 也在竞争开发者的关注。最近，npm 本身也被推崇为一种更简单的方案](https://www.sitepoint.com/guide-to-npm-as-build-tool/)。所有工具都有优缺点，但\
  \ Gulp 仍然是首选并被超过 40% 的 Web 开发者使用](https://ashleolan.co.uk/blog/frontend-tooling-survey-2016-results)。\n\
  \nGulp 需要 Node.js，虽然某些 JavaScript 知识会有帮助，但所有 Web 开发者都能从中受益。\n\n## 关于 Gulp 4\n\n\
  本文介绍了如何使用 Gulp 3 - 这是编写时的最新发布版本。Gulp 4 已经开发一段时间，但仍处于测试阶段。你可以[使用或切换到 Gulp 4](https://www.joezimjs.com/javascript/complete-guide-upgrading-gulp-4/)，但在正式发布之前建议使用版本\
  \ 3。\n\n### 第一步：安装 Node.js\n\n可以在 [nodejs.org/download/](https://nodejs.org/download/)\
  \ 下载 Windows、Mac 和 Linux 的 Node.js。从二进制文件、包管理器和 Docker 镜像安装有多种选择 - 详细说明可用。\n\n###\
  \ Windows 用户注意\n\nNode.js 和 Gulp 可以在 Windows 上运行，但某些依赖原生 Linux 二进制文件的压缩库可能无法安装或运行。Windows\
  \ 10 用户的一个选择是使用新的 [bash 命令行](https://msdn.microsoft.com/en-us/commandline/wsl/install_guide)；这解决了许多问题，但它是测试产品并可能引入替代问题。\n\
  \n安装后，打开命令提示符并输入：\n\n```\nnode -v\n```\n\n显示版本号。你大量使用 `npm` - Node.js 包管理器，它用于安装模块。查看它的版本号：\n\
  \n```\nnpm -v\n```\n\n\n\nLinux 用户注意：Node.js 模块可以全局安装，这样它们在整个系统中都可用。然而，除非在 `npm`\
  \ 命令前加上 `sudo`，否则大多数用户将没有权限写入全局目录。有许多[修复 npm 权限的选项](https://docs.npmjs.com/getting-started/fixing-npm-permissions)以及像\
  \ [nvm 可以提供的帮助](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)\
  \ 这样的工具可以使用，但我经常会更改默认目录，例如在 Ubuntu/Debian 系的平台上：\n\n```bash\ncd ~\nmkdir .node_modules_global\n\
  npm config set prefix=$HOME/.node_modules_global\nnpm install npm -g\n```\n\n然后，将以下行添加到\
  \ `~/.bashrc` 的末尾：\n\n```bash\nexport PATH=\"$HOME/.node_modules_global/bin:$PATH\"\
  \n```\n\n并使用以下命令更新：\n\n```bash\nsource ~/.bashrc\n```\n\n### 步骤 2：全局安装 Gulp\n\n\
  全局安装 Gulp 命令行界面，以便可以在任何项目文件夹中运行 `gulp` 命令：\n\n```bash\nnpm install gulp-cli -g\n\
  ```\n\n使用以下命令验证 Gulp 是否已安装：\n\n```bash\ngulp -v\n```\n\n### 步骤 3：配置您的项目\n\nNode.js\
  \ 项目注意：如果您已经有一个 `package.json` 配置文件，可以跳过此步骤。\n\n假设您在 `project1` 文件夹中有一个新项目或现有项目。进入该文件夹并用\
  \ npm 进行初始化：\n\n```bash\ncd project1\nnpm init\n```\n\n您将被询问一系列问题 - 输入值或按回车键接受默认值。完成后将创建一个\
  \ `package.json` 文件，其中存储了您的 `npm` 配置设置。\n\nGit 用户注意：Node.js 将模块安装在 `node_modules`\
  \ 文件夹中。您应该将其添加到 `.gitignore` 文件中，以确保它们不会被提交到仓库中。当将项目部署到另一台电脑时，您可以运行 `npm install`\
  \ 来恢复它们。\n\n在本文的剩余部分，我们假设您的项目文件夹包含以下子文件夹：\n\n`src`\n文件夹：预处理过的源文件\n它包含进一步的子文件夹：\n\
  * `html` - HTML 源文件和模板\n* `images` — 原始未压缩图像\n* `js` — 多个预处理过的脚本文件\n* `scss` — 多个预处理过的\
  \ Sass `.scss` 文件\n\n`build`\n文件夹：编译/处理后的文件\nGulp 将根据需要创建文件和子文件夹：\n* `html` - 编译后的静态\
  \ HTML 文件\n* `images` — 压缩后的图像\n* `js` — 单个合并并压缩的 JavaScript 文件\n* `css` — 单个编译并压缩的\
  \ CSS 文件\n\n您的项目几乎肯定会有所不同，但下面的示例将使用此结构。\n\n提示：如果您在使用类 Unix 系统，并且只想跟本教程操作，可以使用以下命令重新创建文件夹结构：\n\
  \n```bash\nmkdir -p src/{html,images,js,scss} build/{html,images,js,css}\n```\n\n\
  ### 步骤 4：本地安装 Gulp\n\n现在您可以使用以下命令在您的项目文件夹中安装 Gulp：\n\n```bash\nnpm install gulp\
  \ --save-dev\n```\n\n这会将 Gulp 安装为开发依赖项，并相应地更新 `package.json` 中的 `\"devDependencies\"\
  ` 部分。在教程的剩余部分中，我们假设 Gulp 和所有插件都是开发依赖项。\n\n#### 备用部署选项\n\n当操作系统中的环境变量 `NODE_ENV`\
  \ 设置为 `production` 时，不会安装开发依赖项。您通常会在生产服务器上使用 Mac/Linux 命令执行此操作：\n\n```bash\nexport\
  \ NODE_ENV=production\n```\n\n或在 Windows 上：\n\n```bash\nset NODE_ENV=production\n\
  ```\n\n本教程假设您的资产将编译到 `build` 文件夹，并提交到您的 Git 仓库或直接上传到服务器。然而，如果您想更改创建它们的方式，在在生产服务器上构建资产可能更合适，例如：HTML、CSS\
  \ 和 JavaScript 文件在生产环境中经过了压缩，但在开发环境中没有。在这种情况下，请对 Gulp 和所有插件使用 `--save` 选项，即：\n\n\
  ```bash\nnpm install gulp --save\n```\n\n这会将 Gulp 设置为 `package.json` 中 `\"dependencies\"\
  ` 部分的应用程序依赖项。它会在您输入 `npm install` 时安装，并可以在项目部署的任何地方运行。您可以从仓库中删除 `build` 文件夹，因为这些文件可以在需要时任何平台上创建。\n\
  \n### 步骤 4：创建 Gulp 配置文件\n\n在项目文件夹的根目录下创建一个新的 `gulpfile.js` 配置文件。添加一些基础代码开始开始：\n\n\
  ```javascript\n// Gulp.js configuration\nvar\n  // modules\n  gulp = require('gulp'),\n\
  \  // development mode?\n  devBuild = (process.env.NODE_ENV !== 'production'),\n\
  \  // folders\n  folder = {\n    src: 'src/',\n    build: 'build/'\n  }\n;\n```\n\
  \nNode.js 项目注意：如果您已经有一个 `package.json` 配置文件，可以跳过此步骤。\n\n假设您在 `project1` 文件夹中有一个新项目或现有项目。进入该文件夹并用\
  \ npm 进行初始化：\n\n```bash\ncd project1\nnpm init\n```\n\n您将被询问一系列问题 - 输入值或按回车键接受默认值。完成后将创建一个\
  \ `package.json` 文件，其中存储了您的 `npm` 配置设置。\n\nGit 用户注意：Node.js 将模块安装在 `node_modules`\
  \ 文件夹中。您应该将其添加到 `.gitignore` 文件中，以确保它们不会被提交到仓库中。当将项目部署到另一台电脑时，您可以运行 `npm install`\
  \ 来恢复它们。\n\n在本文的剩余部分，我们假设您的项目文件夹包含以下子文件夹：\n\n`src`\n文件夹：预处理过的源文件\n它包含进一步的子文件夹：\n\
  * `html` - HTML 源文件和模板\n* `images` — 原始未压缩图像\n* `js` — 多个预处理过的脚本文件\n* `scss` — 多个预处理过的\
  \ Sass `.scss` 文件\n\n`build`\n文件夹：编译/处理后的文件\nGulp 将根据需要创建文件和子文件夹：\n* `html` - 编译后的静态\
  \ HTML 文件\n* `images` — 压缩后的图像\n* `js` — 单个合并并压缩的 JavaScript 文件\n* `css` — 单个编译并压缩的\
  \ CSS 文件\n\n您的项目几乎肯定会有所不同，但下面的示例将使用此结构。\n\n提示：如果您在使用类 Unix 系统，并且只想跟本教程操作，可以使用以下命令重新创建文件夹结构：\n\
  \n```bash\nmkdir -p src/{html,images,js,scss} build/{html,images,js,css}\n```\n\n\
  ### 步骤 5：创建 Gulp 任务\n\nGulp 提供了三个主要方法：\n* `gulp.task` - 定义新任务。\n* `gulp.src` - 设置源。\n\
  * `gulp.dest` - 设置目标。\n\n图像任务\n\n此示例演示了如何压缩图像。为了实现这一点，我们需要 `gulp-newer` 和 `gulp-imagemin`。从命令行使用\
  \ save-dev 安装它们。\n\n现在我们可以在 `gulpfile.js` 顶部引用这两个模块：\n\n```javascript\n// Gulp.js\
  \ configuration\nvar\n  // modules\n  gulp = require('gulp'),\n  newer = require('gulp-newer'),\n\
  \  imagemin = require('gulp-imagemin'),\n```\n\n现在我们可以在 `gulpfile.js` 的末尾定义图像处理任务：\n\
  \n```javascript\n// image processing\ngulp.task('images', function() {\n  var out\
  \ = folder.build + 'images/';\n  return gulp.src(folder.src + 'images/**/*')\n \
  \   .pipe(newer(out))\n    .pipe(imagemin({optimizationLevel: 5}))\n    .pipe(gulp.dest(out));\n\
  });\n```\n\n保存 `gulpfile.js` 并在项目 `src/images` 文件夹中放置一些图像，然后从命令行运行该任务：\n\n```bash\n\
  gulp images\n```\n\n\n\n\n\n```\nFinished 'imagemin' in 5.71 ms\ngulp-imagemin:\
  \ image1.png (saved 48.7 kB)\ngulp-imagemin: image2.jpg (saved 36.2 kB)\ngulp-imagemin:\
  \ image3.svg (saved 12.8 kB)\n```\n\n尝试再次运行 `gulp images`，应该不会发生任何变化，因为没有新的图像了。\n\
  \n## HTML 任务\n\n我们现在可以创建一个类似的任务，用于从源 HTML 文件夹复制文件。我们可以使用 [gulp-htmlclean](https://www.npmjs.com/package/gulp-htmlclean)\
  \ 插件来安全地对 HTML 代码进行压缩化，以移除不必要的空格和属性：\n\n```bash\nnpm install gulp-htmlclean --save-dev\n\
  ```\n\n然后在 `gulpfile.js` 的顶部引入引用它：\n\n```javascript\nvar\n  // 模块\n  gulp = require('gulp'),\n\
  \  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n  htmlclean\
  \ = require('gulp-htmlclean'),\n```\n\n我们现在可以在 `gulpfile.js` 的末尾创建一个 `html` 任务：\n\
  \n```javascript\n// HTML 处理\ngulp.task('html', ['images'], function() {\n  var\n\
  \    out = folder.build + 'html/',\n    page = gulp.src(folder.src + 'html/**/*')\n\
  \      .pipe(newer(out));\n  // 压缩生产代码\n  if (!devBuild) {\n    page = page.pipe(htmlclean());\n\
  \  }\n  return page.pipe(gulp.dest(out));\n});\n```\n\n这复用了 `gulp-newer` 并引入了几个概念：\n\
  \n1. `[images]` 参数表示在处理 HTML 之前必须运行 `images` 任务（HTML 可能会引用图像）。此数组中可以列出任意数量的依赖任务，且所有任务都将在任务函数运行之前完成。\n\
  2. 只有当 `NODE_ENV` 设置为 `production` 时，我们才将 HTML 传递给 `gulp-htmlclean`。因此，HTML 在开发期间将保持未压缩状态，这可能对调试有用。\n\
  \n保存 `gulpfile.js` 并从命令行运行 `gulp html`。`html` 和 `images` 任务都会运行。\n\n## JavaScript\
  \ 任务\n\n对你来说太简单了？让我们通过构建一个基础的模块打包器来处理所有的 JavaScript 文件。它将：\n\n1. 使用 [gulp-deporder](https://www.npmjs.com/package/gulp-deporder)\
  \ 插件确保先加载依赖。它会分析每个脚本顶部的注释以确保正确的顺序，例如 `// requires: defaults.js lib.js`。\n2. 使用 [gulp-concat](https://www.npmjs.com/package/gulp-concat)\
  \ 将所有脚本文件合并成单个 `main.js` 文件，并且\n3. 使用 [gulp-strip-debug](https://www.npmjs.com/package/gulp-strip-debug)\
  \ 移除所有的 `console` 和 `debugging` 语句，并使用 [gulp-uglify](https://www.npmjs.com/package/gulp-uglify)\
  \ 压缩代码。此步骤只会在生产模式下发生。\n\n安装插件：\n\n```bash\nnpm install gulp-deporder gulp-concat\
  \ gulp-strip-debug gulp-uglify --save-dev\n```\n\n在 `gulpfile.js` 的顶部引用它们：\n\n```javascript\n\
  var\n  ...\n  concat = require('gulp-concat'),\n  deporder = require('gulp-deporder'),\n\
  \  stripdebug = require('gulp-strip-debug'),\n  uglify = require('gulp-uglify'),\n\
  ```\n\n然后添加一个新的的 `js` 任务：\n\n```javascript\n// JavaScript 处理\ngulp.task('js', function()\
  \ {\n  var jsbuild = gulp.src(folder.src + 'js/**/*')\n    .pipe(deporder())\n \
  \   .pipe(concat('main.js'));\n  if (!devBuild) {\n    jsbuild = jsbuild\n     \
  \ .pipe(stripdebug())\n      .pipe(uglify());\n  }\n  return jsbuild.pipe(gulp.dest(folder.build\
  \ + 'js/'));\n});\n```\n\n保存然后运行 `gulp js` 来体验魔法！\n\n## CSS 任务\n\n最后，让我们创建一个 CSS\
  \ 任务，使用 [gulp-sass](https://www.npmjs.com/package/gulp-sass) 将 `.scss` 文件编译为单个 `.css`\
  \ 文件。这是用于 [node-sass](https://www.npmjs.com/package/node-sass) 的 Gulp 插件，它绑定到超快的\
