  \ {\n  var jsbuild = gulp.src(folder.src + 'js/**/*')\n    .pipe(deporder())\n \
  \   .pipe(concat('main.js'));\n  if (!devBuild) {\n    jsbuild = jsbuild\n     \
  \ .pipe(stripdebug())\n      .pipe(uglify());\n  }\n  return jsbuild.pipe(gulp.dest(folder.build\
  \ + 'js/'));\n});\n```\n\n保存然后运行 `gulp js` 来体验魔法！\n\n## CSS 任务\n\n最后，让我们创建一个 CSS\
  \ 任务，使用 [gulp-sass](https://www.npmjs.com/package/gulp-sass) 将 `.scss` 文件编译为单个 `.css`\
  \ 文件。这是用于 [node-sass](https://www.npmjs.com/package/node-sass) 的 Gulp 插件，它绑定到超快的\
  \ [Sass C/C++ 引擎](http://sass-lang.com/libsass)（无需安装 Ruby）。我们假设你的 Sass 文件 `scss/main.scss`\
  \ 负责加载所有部分文件。\n\n我们的任务还将通过 [gulp-postcss](https://github.com/postcss/gulp-postcss)\
  \ 插件利用 [PostCSS](http://postcss.org/)。PostCSS 需要它自己的插件，我们将安装它们：\n\n* [postcss-assets](https://www.npmjs.com/package/postcss-assets)\
  \ 用于管理资源。这允许我们使用如 `background('image.png')` 的属性来解析路径，或使用 `background('image.png')`\
  \ 内联数据编码图像。\n* [autoprefixer](https://www.npmjs.com/package/autoprefixer) 用于自动为\
  \ CSS 属性添加厂商前缀。\n* [css-mqpacker](https://www.npmjs.com/package/css-mqpacker) 将同一个媒体查询的多次引用合并到单个规则中。\n\
  * [cssnano](https://www.npmjs.com/package/cssnano) 用于压缩代码。\n\n安装这些插件：\n\n```bash\n\
  npm install gulp-sass gulp-postcss postcss-assets autoprefixer mqpacker cssnano\n\
  ```\n\n在 `gulpfile.js` 的顶部引用它们：\n\n```javascript\nvar\n  ...\n  sass = require('gulp-sass'),\n\
  \  postcss = require('gulp-postcss'),\n  assets = require('postcss-assets'),\n \
  \ autoprefixer = require('autoprefixer'),\n  mqpacker = require('css-mqpacker'),\n\
  \  cssnano = require('cssnano'),\n```\n\n```，，，，，，，，，，，，，，，，，，，，，，，``` \n\n  运行\
  \ ` ` 任务 \n\n       运行 ` ` 任务， `，` \n```\n\n```\n\n \n \n \n \n \n \n \n \n \n \n\
  \ \n \n \n \n \n \n \n \n \n \n \n\n \n\n## 第 6 步：自动化任务\n\n我们一直在一次运行一个任务。我们可以通过在\
  \ `gulpfile.js` 中添加一个新的 `run` 任务来一次性运行所有任务：\n\n```javascript\n// 运行所有任务\ngulp.task('run',\
  \ ['html', 'css', 'js']);\n```\n\n保存并输入 `gulp run` 执行所有任务。注意我省略了 `images` 任务，因为已经是\
  \ `html` 和 `css` 任务的依赖。\n\n这仍然太费力了？Gulp 提供了另一种方法——`gulp.watch`，它可以监控源文件并在文件更改时运行相应的任务。该方法接收一个文件夹和一个发生变化时执行的任务列表。让我们在\
  \ `gulpfile.js` 的末尾创建一个 `watch` 任务：\n\n```javascript\n// 监听变化\ngulp.task('watch',\
  \ function() {\n  //图像变化\n  gulp.watch(folder.src + 'images/**/*', ['images']);\n\
  \  // HTML 变化\n  gulp.watch(folder.src + 'html/**/*', ['html']);\n  // JavaScript\
  \ 变化\n  gulp.watch(folder.src + 'js/**/*', ['js']);\n  // CSS 变化\n  gulp.watch(folder.src\
  \ + 'scss/**/*', ['css']);\n});\n```\n\n与其立即运行 `gulp watch`，让我们添加一个默认任务：\n\n```javascript\n\
  // 默认任务\ngulp.task('default', ['run', 'watch']);\n```\n\n保存 `gulpfile.js` 并在命令行输入\
  \ `gulp`。你的图像、HTML、CSS 和 JavaScript 将被处理，然后 Gulp 将保持活跃监控更新并在需要时重新运行任务。按 Ctrl/Cmd\
  \ + C 停止监控并返回命令行。\n\n## 第 7 步：获利！\n\n其他你可能觉得有用的插件：\n\n* [gulp-load-plugins](https://www.npmjs.com/package/gulp-load-plugins)\
  \ - 无需 require 声明即可加载 Gulp 插件模块\n* [gulp-preprocess](https://www.npmjs.com/package/gulp-preprocess)\
  \ - 一个简单的 HTML 和 JavaScript 预处理工具\n* [gulp-less](https://www.npmjs.com/package/gulp-less)\
  \ - [Less CSS 预处理器](http://lesscss.org/) 插件\n\n\n\n\n\n* [gulp-stylus](https://www.npmjs.com/package/gulp-stylus)\
  \ - [Stylus CSS 预处理器](http://stylus-lang.com/) 插件\n* [gulp-sequence](https://www.npmjs.com/package/gulp-sequence)\
  \ - 按特定顺序运行一系列 gulp 任务\n* [gulp-plumber](https://www.npmjs.com/package/gulp-plumber)\
  \ - 错误处理，防止 Gulp 在失败时停止\n* [gulp-size](https://www.npmjs.com/package/gulp-size)\
  \ - 显示文件大小和节省空间\n* [gulp-nodemon](https://www.npmjs.com/package/gulp-nodemon) -\
  \ 使用 [nodemon](https://www.npmjs.com/package/nodemon) 在发生变化时自动重启 Node.js 。\n* [gulp-util](https://www.npmjs.com/package/gulp-util)\
  \ - 包含日志和颜色编码的实用函数\n\n`gulp-util` 中一个实用的方法是 `.noop()`，它会直接传递数据而不执行任何操作。这可以用于更整洁的开发/生产处理代码，例如：\n\
  \n```\nvar gutil = require('gulp-util');\n// HTML processing\ngulp.task('html',\
  \ ['images'], function() {\n  var out = folder.src + 'html/**/*';\n  return gulp.src(folder.src\
  \ + 'html/**/*')\n    .pipe(newer(out))\n    .pipe(devBuild ? gutil.noop() : htmlclean())\n\
  \    .pipe(gulp.dest(out));\n});\n```\n\nGulp 也可以调用其他 Node.js 模块 - 它们不需要是插件，例如：\n\
  \n* [browser-sync](https://www.npmjs.com/package/browser-sync) - 在发生变化时自动加载资源或刷新浏览器\n\
  * [del](https://www.npmjs.com/package/del) - 删除文件和文件夹（也许可以在每次运行时清理你的 `build` 文件夹）。\n\
  \n投入一点时间，Gulp 就能节省许多小时的开发沮败感。优势是：\n\n* [插件丰富](https://npmjs.org/browse/keyword/gulpplugin/)\n\
  * 使用管道（pipes）的配置易于阅读和跟进\n* `gulpfile.js` 可以被适配并重用到其他项目中\n* 可以减少你的总页面权重以提高性能\n* 你可以简化你的部署\n\
  \n有用链接：\n\n* [Gulp 主页](http://gulpjs.com/)\n* [Gulp 插件](https://npmjs.org/browse/keyword/gulpplugin/)\n\
  * [npm 主页](https://www.npmjs.com/)\n\n将上述过程应用于简单的网站，总权重减少了 50% 以上。你可以使用 [页面权重分析工具](http://sitepoint.com/10-best-webpage-weight-analysis-tools/)\
  \ 或像 [New Relic](http://newrelic.com/?r=phpm) 等服务来测试自己的结果，它提供了一系列复杂的应用程序性能监控工具。\n\
  \n## 第 3 章：原生 JavaScript DOM 操作基础（不使用 jQuery）\n\n作者：Sebastian Seitz\n\n由 [Vildan\
  \ Softic](https://www.sitepoint.com/author/vildansoftic/) 和 [Joan Yin](https://github.com/newjs)\
  \ 同行评审。\n\n每我们需要执行 DOM 操作时，大家都会迅速求助于 jQuery。然而，原生 JavaScript DOM API 本身其实非常强大，而且由于\
  \ IE < 11 已经被[官方放弃](https://www.microsoft.com/en-us/WindowsForBusiness/End-of-IE-support)，现在可以无忧地使用。\n\
  \n在本文中，我将演示如何使用原生 JavaScript 完成一些常见的 DOM 操作任务，即：\n\n* 查询和修改 DOM\n* 修改类（classes）和属性\n\
  * 监听事件\n以及\n* 动画\n\n最后，我将向你展示如何创建一个自己的超轻量 DOM 库，并将其投入到任何项目中。过程中，你会发现使用原生 JS 进行 DOM\
  \ 操作并不是什么高深科技，而且许多 jQuery 方法在原生 API 中实际上有直接对应方法。\n\n那么，让我们开始吧……\n\n## DOM 操作：查询\
  \ DOM\n\n### 这并不是关于 DOM API 的详尽指南\n\n我不会详尽解释原生 DOM API，而仅触及皮毛。在用法示例中，你可能会遇到我没有明确介绍的方法。在这种情况下，请直接参考优秀的\
  \ [Mozilla 开发者网络 (MDN)](https://developer.mozilla.org/en-US/) 获取详细信息。\n\n可以使用 `.querySelector()`\
  \ 方法查询 DOM，该方法接受任意 CSS 选择器作为参数：\n\n```\nconst myElement = document.querySelector('#foo\
  \ > div.bar')\n```\n\n这将返回第一个匹配项（深度优先）。相反，我们可以检查一个元素是否匹配某个选择器：\n\n```\nmyElement.matches('div.bar')\
  \ === true\n```\n\n如果等想获取所有匹配项，可以使用：\n\n```\nconst myElements = document.querySelectorAll('div.bar')\n\
  ```\n\n如果已经已经有一个元素的引用，我们可以直接查询它的子元素。\n\n```\nconst myElements = document.querySelector('div.bar')\n\
  ```\n\n### getElementsByTagName\n\n那么为什么还要用 `getElementsByTagName()` 等其他方法？嗯，一个重要的区别是\
  \ `querySelectorAll()` 的结果是动态的（live）。\n\n```javascript\nconst elements1 = document.querySelectorAll('div')\n\
  const elements2 = document.getElementsByTagName('div')\nconst newElement = document.createElement('div')\n\
  ```\n\n另一个考虑是，当我们动态添加元素时，`querySelectorAll` 是静态的。\n\n```javascript\nelements1.appendChild(newElement)\n\
  ```\n\n### 使用 NodeLists\n\n现在关于 `querySelectorAll()` 有两个坑。第一个坑是我们无法在结果上调用数组方法（就像你从\
  \ jQuery 中习惯的那样）。相反，我们必须显式遍历元素。另一个坑是：返回值是一个 `NodeList` 而不是 `Array`。这意味着我们需要将列表转换为数组，或者“借用”数组原型的方法。\n\
  \n```\n// 使用 Array.from()\nArray.from(myElements).forEach(doSomethingElement)\n\n\
  // 在 ES6 之前\nArray.prototype.forEach.call(myElements, doSomethingElement)\n\n//\
  \ 简写：\n[].forEach.call(myElements, doSomethingElement)\n```\n\n每个元素还有几个自言自懂的只读属性指向“元素族”，所有的都是动态的：\n\
  \n```\nmyElement.children\nmyElement.firstElementChild\nlastElementChild\npreviousElementSibling\n\
  nextElementSibling\n```\n\n由于 [Element](https://developer.mozilla.org/en-US/docs/Web/API/element)\
  \ 接口继承自 [Node](https://developer.mozilla.org/en-US/docs/Web/API/Node) 接口，以下属性也可用：\n\
  \n```\nmyElement.childNodes\nmyElement.firstChild\nmyElement.lastChild\nmyElement.previousSibling\n\
  myElement.nextSibling\nmyElement.parentNode\nmyElement.parentElement\n```\n\n前者只引用元素，而后者（`.parentElement`\
  \ 除外）可以是任何种类型的节点，例如文本节点。然后我们可以检查给定节点的[类型](https://developer.mozilla.org/en-US/docs/Web/API/Node/nodeType)，例如：\n\
  \n```\nmyElement.firstChild.nodeType === 3 // 这是一个文本节点\n```\n\n和任何对象一样，我们可以使用 `instanceof`\
  \ 运算符检查节点的原型链：\n\n```\nmyElement.firstChild.nodeType instanceof Text\n```\n\n##\
  \ 修改类和属性\n\n修改元素的类非常简单：\n\n```\nmyElement.classList.add('foo')\nmyElement.classList.remove('bar')\n\
  myElement.classList.toggle('baz')\n```\n\n\n\n\n\n你可以通过这篇 [Yaphi Berhanu 的快速贴士](https://www.sitepoint.com/add-remove-css-class-vanilla-js/)阅读关于如何修改类的更深入讨论。元素属性可以像任何其他对象的属性一样被访问。\n\
  \n```javascript\n// 获取属性值\nconst value = myElement.value\n\n// 将属性设置为元素的一个属性\nmyElement.value\
  \ = 'foo'\n\n// 使用 Object.assign() 设置多个属性\nObject.assign(myElement, {\n  value:\
  \ 'foo',\n  id: 'bar'\n})\n\n// 移除属性\nmyElement.value = null\n```\n\n请注意，还有 `.getAttibute()`、`.setAttribute()`\
  \ 和 `.removeAttribute()` 方法。这些方法直接修改元素的 HTML 属性（而不是 DOM 属性），从而导致浏览器重绘（你可以通过浏览器的开发工具检查元素来观察这些变化）。这种浏览器重绘不仅比仅设置\
  \ DOM 属性更耗费更多资源，而且这些方法还可能导致[意外的结果](https://developer.mozilla.org/en-US/docs/Web/API/Element/setAttribute#Notes)。\n\
  \n作为经验法则，只有当属性没有对应的 DOM 属性（例如 `colspan`）时，才使用它们；或者如果你真的想“持久化”这些更改到 HTML 中（例如，在克隆元素或修改其父元素的\
  \ `.innerHTML` 时保留它们——参见第 3 部分）。\n\n## 添加 CSS 样式\n\nCSS 规则可以像其他属性一样应用；但请注意，属性在 JavaScript\
  \ 中是驼峰命名的：\n\n```javascript\nmyElement.style.marginLeft = '2em'\n```\n\n如果我们需要某些值，可以通过\
  \ `.style` 属性获取这些值。然而，这只会带给我们显式应用的样式。要获取计算后的值（computed values），我们可以使用 `.window.getComputedStyle()`。它接收元素并返回一个\
  \ [CSSStyleDeclaration](https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleDeclaration)，其中包含了元素本身的样式以及继承自父元素的样式：\n\
  \n```javascript\nwindow.getComputedStyle(myElement).getPropertyValue('margin-left')\n\
  ```\n\n## 修改 DOM\n\n我们可以像这样移动元素：\n\n```javascript\n// 将 element1 作为 element2 的最后一个子节点\n\
  element1.appendChild(element2)\n\n// 将 element2 插入作为 element1 的子节点，位于 element3 之前\n\
  element1.insertBefore(element2, element3)\n```\n\n如果我们不想移动元素而是想插入一个副本，可以这样克隆它：\n\
  \n```javascript\n// 创建克隆\nconst myElementClone = myElement.cloneNode()\nmyParentElement.appendChild(myElementClone)\n\
  ```\n\n`.cloneNode()` 方法可选地接受一个布尔值作为参数；如果设置为 true 将创建一个深拷贝，这意味着它的子元素也会被克隆。\n\n当然，我们也可以完全创建新的元素或文本节点：\n\
  \n```javascript\nconst myNewElement = document.createElement('div')\nconst myNewTextNode\
  \ = document.createTextNode('some text')\n```\n\n然后我们可以像上面所示插入它们。如果我们想删除一个元素，不能直接删除，但可以从父元素中移除子元素，如下：\n\
  \n```javascript\nmyParentElement.removeChild(myElement)\n```\n\n这给了我们一个很好的变通方法，意味着我们可以通过引用其父元素来间接删除一个元素：\n\
  \n```javascript\nmyElement.parentNode.removeChild(myElement)\n```\n\n## 元素属性\n\n\
  每个元素还有 `.innerHTML` 和 `.textContent` 属性（以及 `.innerText`，它与 `.textContent` 相似，但有一些[重要的差异](http://perfectionkills.com/the-poor-misunderstood-innerText/)）。它们分别持有\
  \ HTML 内容和纯文本内容。这些是可写的，意味着我们可以直接修改元素及其内容：\n\n```javascript\n// 设置内部 HTML\nmyElement.innerHTML\
  \ = `\n  <div>\n    <p>Hello World</p>\n  </div>\n`\n\n// 设置文本内容\nmyElement.textContent\
  \ = 'Hello World'\n```\n\n像上面所示向 HTML 附加标记通常是个坏主意，因为我们会丢失任何 [DocumentFragment](https://developer.mozilla.org/en-US/docs/Web/API/DocumentFragment)\
  \ 更改。为了避免这种性能问题，我们可以首先在片段中组装：\n\n```javascript\nconst fragment = document.createDocumentFragment()\n\
  // ... 操作 fragment\n```\n\n## 监听事件\n\n这可能是绑定事件的最佳方法：\n\n```javascript\nmyElement.onclick\
  \ = function (event) {\n  console.log(event.type)\n}\n```\n\n但通常应该避免这样做。在这里，`.onclick`\
  \ 是元素的一个属性，你可以修改它，但不能用它来添加监听器。相反，我们可以使用强大的 `.addEventListener()` 方法来添加多个事件。它接受三个参数：事件类型（例如\
  \ `click`）、当事件发生时被调用的函数（该函数将接收一个对象）以及可选的配置对象。\n\n```javascript\nmyElement.addEventListener('click',\
  \ function (event) {\n  console.log(event.type)\n})\nmyElement.addEventListener('click',\
  \ function (event) {\n  console.log(event.type + ' again')\n})\n```\n\n在监听函数内部，`event.target`\
  \ 指向触发事件元素（`this` 也是如此，除非我们使用了[箭头函数](https://www.sitepoint.com/es6-arrow-functions-new-syntax/)）。因此你可以轻松地访问它的属性：\n\
  \n```javascript\n// 的 forms 属性是包含所有表单的数组\nconst myForm = document.forms[0]\nconst\
  \ myInputElements = myForm.querySelectorAll('input')\nArray.from(myInputElements).forEach(el\
  \ => {\n  el.addEventListener('change', function (event) {\n    console.log(event.target.value)\n\
  \  })\n})\n```\n\n### 防止默认行为\n\n请注意，`event` 在监听函数内部总是可用的，但在需要时显式传递它仍然是一个良好的习惯（当然，我们可以为它任意命名）。在不详述\
  \ [Event](https://developer.mozilla.org/en-US/docs/Web/API/Event) 接口本身的情况下，一个特别值得注意的方法是\
  \ `.preventDefault()`，它将……阻止浏览器的默认行为，例如跳转链接。另一个常见的用例是在客户端表单验证失败时，条件地阻止提交表单。\n\n\
  ```javascript\nmyForm.addEventListener('submit', function (event) {\n  const name\
  \ = this.querySelector('#name')\n  if (name.value === 'Donald Duck') {\n    alert('你在开玩笑吗！')\n\
  \    event.preventDefault()\n  }\n})\n```\n\n\n\n\n另一个重要的事件方法是 `.stopPropagation()`，它会阻止事件向\
  \ DOM 树冒泡。这意味着如果我们在某个元素上设置了停止传播的点击监听器（比如），而在它的其中一个父元素上设置了另一个点击监听器，那么在子元素上触发的点击事件将不会在父元素上触发——否则，它将在两个地方都触发。\n\
  \n现在，`.addEventListener()` 接受一个可选的配置对象作为第三个参数，该对象可以包含以下任何布尔属性（默认值均为 `false`）：\n\n\
  - `capture`: 事件将在 DOM 中该元素下方的任何其他元素之前在该元素上触发（事件捕获和冒泡是一篇专门的文章，更多细节请参阅[这里](http://javascript.info/tutorial/bubbling-and-capturing)）。\n\
  - `once`: 正如你可能猜到的，这表示事件将只会触发一次。\n- `passive`: 这意味着 `event.preventDefault()`将被忽略（并且通常会在控制台中产生警告）。\n\
  \n最常用的选项是 `.capture`；事实上，它非常常见，以至于有一个简写：你不需要在配置对象中指定它，只需在这里传递一个布尔值即可：\n\n```\nmyElement.addEventListener(type,\
  \ listener, true)\n```\n\n事件监听器可以使用 `.removeEventListener()` 移除，它接受事件类型和要移除的回调函数引用；例如，`once`\
  \ 也可以这样实现：\n\n```javascript\nmyElement.addEventListener('change', function listener\
  \ (event) {\n  console.log(event.type + ' got triggered on ' + this)\n  this.removeEventListener('change',\
  \ listener)\n})\n```\n\n### 事件委托\n\n另一个实用的模式是事件委托：假设我们有一个表单，并想为其所有的 `input` 子元素添加\
  \ `change` 事件监听器。一种方法是如上所示，使用 `myForm.querySelectorAll('input')` 对它们进行迭代。然而，当我们我们可以同样地将其添加到表单本身上并检查\
  \ `event.target` 的内容时，这样做是不必要的。\n\n```javascript\nmyForm.addEventListener('change',\
  \ function (event) {\n  const target = event.target\n  if (target.matches('input'))\
  \ {\n    console.log(target.value)\n  }\n})\n```\n\n该模式的另一个优势是，它会自动考虑到动态插入的子元素，而无需为每个元素绑定新的监听器。\n\
  \n### 动画\n\n通常执行动画最干净的方法是应用带有 `transition` 属性的 CSS 类，或使用 CSS `@keyframes`。但如果你需要更大的灵活性（例如用于游戏），也可以用\
  \ JavaScript 实现。\n\n原始的方法是让 `window.setTimeout()` 函数不断调用自己，直到所需的动画完成。然而，这种方法低效地强制了快速的文档重流；这种布局抖动（layout\
  \ thrashing）会导致导致卡顿，尤其是在移动设备上。相反，我们可以使用 `window.requestAnimationFrame()` 同步更新，将所有当前更改调度到下一次浏览器重绘帧。它接受一个回调作为参数，接收当前的（高分辨率）戳：\n\
  \n```javascript\nconst start = window.performance.now()\nconst duration = 2000\n\
  window.requestAnimationFrame(function fadeIn (now)) {\n  const progress = now -\
  \ start\n  myElement.style.opacity = progress / duration\n  if (progress < duration)\
  \ {\n    window.requestAnimationFrame(fadeIn)\n  }\n}\n```\n\n通过这种方式，我们可以实现非常流畅的动画。如需更详细的讨论，请查看\
  \ Mark Brown 写的这篇[文章](https://www.sitepoint.com/quick-tip-game-loop-in-javascript/)。\n\
  \n### 编写你自己的辅助方法\n\n诚然，总是通过遍历元素来对它们进行操作，与 jQuery 简洁且可链的 `$('.foo').css({color: 'red'})`\
  \ 语法相比可能相当繁琐。那么，为什么不简单为此类事情编写我们自己的简写方法呢？\n\n```javascript\nconst $ = function $\
  \ (selector, context = document) {\n  const elements = Array.from(context.querySelectorAll(selector))\n\
  \  return {\n    elements,\n    html(newHtml) {\n      this.elements.forEach(element\
  \ => {\n        element.innerHTML = newHtml\n      })\n      return this\n    },\n\
  \    css(newCss) {\n      this.elements.forEach(element => {\n        Object.assign(element.style,\
  \ newCss)\n      })\n      return this\n    },\n    on(event, handler, options)\
  \ {\n      this.elements.forEach(element => {\n        element.addEventListener(event,\
  \ handler, options)\n      })\n      return this\n    }\n  }\n}\n```\n\n因此，我们有了一个极简的\
  \ DOM 库，只包含我们需要的方法，并且不考虑向后兼容性。通常我们会在原型中拥有这些方法。这里有一个（稍微复杂一点的）[gist](https://gist.github.com/SitePoint/4f664d62a87ae60b0784ceeffd)，其中包含关于如何实现此类辅助方法的想法。或者，我们可以保持简单如：\n\
  \n```javascript\nconst $ = (selector, context = document) => context.querySelector(selector)\n\
  const $$ = (selector, context = document) => context.querySelectorAll(selector)\n\
  const html = (nodeList, newHtml) => {\n  Array.from(nodeList).forEach(element =>\
  \ {\n    element.innerHTML = newHtml\n  })\n}\n// 等等...\n```\n\n### Demo\n\n为了结束这篇文章，这里有一个\
  \ [CodePen](https://codpen.io/SitePoint/aJaggB/)，展示了上述许多概念，用于实现一个简单的灯箱效果。\n\n##\
  \ 结论\n\n我希望向大家展示原生 JavaScript 进行 DOM 操作并不是困难科学，而且事实上，对于某些用例（如导航菜单或弹出窗口），引入一个库的额外开销可能是多余的。\n\
  \n虽然原生 API 的部分非常繁琐或不方便（例如经常遍历节点列表），但我们可以轻松地编写自己的辅助函数。\n\n## 第四章：Webpack 入门指南\n\n\
  作者 Mark Brown\n\n[Webpack](https://webpack.org/) 已成为现代 Web 开发中最重要的工具之一。它主要是一个 JavaScript\
  \ 模块打包器，但它可以转换所有的前端资源，如 HTML 和 CSS，甚至图片。它可以更好地控制应用的 HTTP 请求数量，并允许使用 npm 包。\n\n这篇文章面向\
  \ webpack 新手，将涵盖初始设置配置、模块、加载器、插件、代码分割和热更新。如果你觉得视频教程有用，强烈推荐 Glen Maddern 的 [从原理理解\
  \ Webpack](https://www.youtube.com/watch?v=WQue1AN9YU) 作为理解其特殊之处的起点。\n\n要在家里跟着练习，你需要安装\
  \ [Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。你也可以从我们的\
  \ Github 仓库[下载 demo 应用](https://github.com/sitepoint-editors/webpack-demo)。\n\n\
  ### Setup\n\n让我们用 npm 初始化新项目并安装 webpack：\n\n```\nmkdir webpack-demo\ncd webpack-demo\n\
  npm init -y\nnpm install webpack@beta --save-dev\nmkdir src\ntouch index.html src/app.js\
  \ webpack.config.js\n```\n\n编辑这些文件：\n\n```html\n<!-- index.html -->\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Hello webpack</title>\n\
  \  </head>\n  <body>\n    <div id=\"root\"></div>\n    <script src=\"dist/bundle.js\"\
  ></script>\n  </body>\n</html>\n```\n\n```javascript\n// src/app.js\nconst root\
  \ = document.querySelector('#root')\nroot.innerHTML = `<p>Hello webpack.</p>` \n\
  ```\n\n```javascript\n// webpack.config.js\nconst webpack = require('webpack')\n\
  const path = require('path')\nconst config = {\n```\n\n\n\n\n\n```javascript\n \
  \ context: path.resolve(__dirname, 'src'),\n  entry: './app.js',\n  output: {\n\
  \    path: path.resolve(__dirname, 'dist'),\n    filename: 'bundle.js'\n  },\n \
  \ module: {\n    rules: [{\n      test: /\\.js$/,\n      include: path.resolve(__dirname,\
  \ 'src'),\n      use: [{\n        loader: 'babel-loader',\n        options: {\n\
  \          presets: [\n            ['es2015', { modules: false }]\n          ]\n\
  \        }\n      }]\n    }]\n  }\n}\nmodule.exports = config\n```\n\n上面的配置是一个常见的起点，它指示\
  \ `webpack` 将我们的入口文件 `src/app.js` 编译为输出文件 `dist/bundle.js`，并且所有的 `.js` 文件都将通过 `Babel`\
  \ 从 ES2015 译为 ES5。\n\n为了运行这些配置，我们需要安装三个包：`babel-core`、`webpack` 的加载器 `babel-loader`\
  \ 以及用于我们想要编写的 JavaScript 风格的预设 `babel-preset-es2015`。`{ modules: false }` 启用 [Tree\
  \ Shaking](http://www.2ality.com/2015/12/webpack-tree-shaking.html)，从包中移除未使用的导出以减小文件大小。\n\
  \n`npm install babel-core babel-loader babel-preset-es2015 --save-dev`\n\n最后，将 `package.json`\
  \ 中的 `scripts` 部分替换为以下内容：\n\n```json\n\"scripts\": {\n  \"start\": \"webpack --watch\"\
  ,\n  \"build\": \"webpack -p\"\n}\n```\n\n在命令行中运行 `npm start` 将以监听模式启动 `webpack`，每当\
  \ `src` 目录中的 `.js` 文件发生变化时，它都会重新编译我们的包。控制台中的输出会告诉我们正在创建的包，关注包的数量和大小是非常重要的。\n\n![](img/00003.jpg)\n\
  \n现在你应该可以在浏览器中加载 `index.html` 并看到“Hello webpack.” 了。\n\n`open index.html`\n\n打开\
  \ `dist/bundle.js` 查看 `webpack` 做了什么，顶部是 `webpack` 的模块引导代码，最底部是我们的模块。你现在可能觉得并不惊艳，但如果你已经走了这一步，现在就可以开始编写\
  \ ES6 模块，`webpack` 将能够创建一个可以在所有浏览器中运行的生产包。\n\n使用 `Ctrl + C` 停止 `webpack` 并运行 `npm\
  \ run build` 在生产模式下编译我们的包。\n\n注意，包的大小从 2.61 kB 减到了 585 字节。再次查看 `dist/bundle.js`，你会看到一大堆混乱的代码，我们的包已经通过\
  \ `UglifyJS` 了压缩，代码运行方式完全相同，但使用了最少的字符完成。\n\n## 模块 (Modules)\n\n`webpack` 原生支持如何消费各种格式的\
  \ JavaScript 模块，其中最著名的两个：\n\n- ES2015 `import` 语句\n- CommonJS `require()` 语句\n\n\
  我们可以通过安装 [lodash](https://lodash.com/) 并从 `app.js` 导入它来测试：\n\n`npm install lodash\
  \ --save`\n\n```javascript\n// src/app.js\nimport {groupBy} from 'lodash/collection'\n\
  \nconst people = [{\n  manager: 'Jen',\n  name: 'Bob'\n}, {\n  manager: 'Jen',\n\
  \  name: 'Sue'\n}, {\n  manager: 'Bob',\n  name: 'Shirley'\n}, {\n  manager: 'Bob',\n\
  \  name: 'Terrence'\n}]\n\nconst managerGroups = groupBy(people, 'manager')\nconst\
  \ root = document.querySelector('#root')\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups,\
  \ null, 2)}</pre>`\n```\n\n运行 `npm start` 启动 `webpack` 并刷新 `index.html`，你应该看到一个按经理分组的人员数组。\n\
  \n让我们将人员数组移动到自己的模块 `people.js` 中：\n\n```javascript\n// src/people.js\nconst people\
  \ = [{\n  manager: 'Jen',\n  name: 'Bob'\n}, {\n  manager: 'Jen',\n  name: 'Sue'\n\
  }, {\n  manager: 'Bob',\n  name: 'Shirley'\n}, {\n  manager: 'Bob',\n  name: 'Terrence'\n\
  }]\nexport default people\n```\n\n我们可以简单地通过相对路径从 `app.js` 导入它。\n\n```javascript\n\
  // src/app.js\nimport {groupBy} from 'lodash/collection'\nimport people from './people'\n\
  const managerGroups = groupBy(people, 'manager')\nconst root = document.querySelector('#root')\n\
  root.innerHTML = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>`\n```\n\n\
  注意：没有相对路径的导入（如 `'lodash/collection'`）是安装到 `/node_modules` 的 npm 模块，你自己的模块始终需要像 `'./people'`\
  \ 这样的相对路径，你可以以此区分它们。\n\n## 加载器 (Loaders)\n\n我们已经接触到了 `babel-loader`，它是许多 [loaders](https://webpack.js.org/loaders/)\
  \ 之一，你可以配置它们来告诉 `webpack` 在遇到不同文件类型的导入时该做什么。你可以将加载器链联成一系列转换，观察其是否起作用的好方法是可以在 JavaScript\
