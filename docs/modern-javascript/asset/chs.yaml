  ## 配置 Chart.js\n\n在之前的每个示例中，我们都使用了以下格式：\n\n```javascript\nvar myChart = new Chart(ctx,\
  \ {\n  type: // 图表类型\n  data: // 图表数据\n});\n```\n\n但是第三个属性叫做 `options`。它紧位于 `data`\
  \ 下方。\n\n```javascript\nvar myChart = new Chart(ctx, {\n  type: // 图表类型\n  data:\
  \ // 图表数据\n  options: // 图表选项\n});\n```\n\n现在你已经熟悉了 Chart.js 的基础，是时候介绍一些关于 `options`\
  \ 的技巧了。\n\n### 标题\n通过添加这组选项可以轻松地为任何 Chart.js 添加标题。原生标题非常棒，但值得注意的是，它们大多是静态且不变的。当我们尝试添加自定义事件时，这一点将会变得重要。\n\
  \n```javascript\noptions: {\n  title: {\n    display: true,\n    text: '自定义标题'\n\
  \  }\n}\n```\n\n### 环甜空洞\n`cutPercentage` 属性是一个 0 到 50 之间的值。饼图只是 `cutPercentage`\
  \ 为 0 的环甜图。\n\n```javascript\noptions: {\n  cutPercentage: 10,\n}\n```\n\n### 堆叠柱状图\n\
  如果你希望柱状图是堆叠的，只需在你的图表代码中添加以下一组选项：\n\n```javascript\noptions: {\n  scales: {\n   \
  \ yAxes: [{\n      stacked: true\n    }]\n  }\n}\n```\n\n每种图表类型都有许多选项供你挖掘。我鼓励你这样做。\n\
  \n### 处理事件\n如之前提到的，点击图例将切换与该图例相关的数据集。让我们用自己的功能增强它：\n\n```javascript\nvar original\
  \ = Chart.defaults.global.onClick;\nChart.defaults.global.onClick = function(e,\
  \ legendItem) {\n  // 在此处插入你的自定义功能\n  original.call(this, legendItem);\n};\n```\n\
  \n这段代码将 `Chart.defaults.global.onClick` 传递到变量中。`Chart.defaults.global.onClick` 接收\
  \ `e` 和 `legendItem`。这段代码将 `Chart.defaults.global.onClick` 传递到变量中。`Chart.defaults.global.onClick`\
  \ 接收 `e` 和 `legendItem`。这段代码将 `Chart.defaults.global.onClick` 传递到变量中。`Chart.defaults.global.onClick`\
  \ 接收 `e` 和 `legendItem`。\n\n## 具体示例\n\n让我们增强之前的代码，这样当用户点击图例时，底部的说明会自动更新。换句话说，我们现在可以在\
  \ `onClick()` 之上添加任何想要的功能。例如，仪表板可能拥有 `apples` 和 `oranges` 的值。使用 Chart.js 创建交互式数据是简单的。\n\
  \n以下是代码\n\n```javascript\nvar labels = {\n  \"apples\": true,\n  \"oranges\": true\n\
  };\nvar caption = document.getElementById(\"caption\");\nvar update_caption = function(legend)\
  \ {\n  labels[legend.text] = legend.hidden;\n  var selected = Object.keys(labels).filter(function(key)\
  \ {\n    return labels[key];\n  });\n  var text = selected.length ? selected.join(\"\
  \ \") : \"nothing\";\n  caption.innerHTML = \"上方图表显示 \" + text;\n};\n```\n\n正如你所看到的，我们使用对象字面量来跟踪图例的状态。filter\
  \ 过滤将返回所有值为 `true` 的键，我们用它来构建说明。\n\n## Chart.js 2.0 vs 1.0\n\n本文使用了 Chart.js 2.0\
  \ 语法。Chart.js 2.0 相对较新。2.0 和 1.0 最明显的区别在于如何声明图表。\n\n### 1.0\n```javascript\nvar\
  \ LineChartDemo = new Chart(ctx).Line(\n  //数据在此，\n  //选项在此\n);\n```\n\n### 2.0\n\
  ```javascript\nvar myChart = new Chart(ctx, {\n  type: 'line',\n  data: // 数据在此\n\
  \  options: // 选项在此\n});\n```\n\n1.0 版本侧重于使用函数链来创建特定类型的图表，然后传入数据和选项。2.0 版本改变了这种方式，允许用户创建一个通用的图表对象，然后传入类型以及数据和选项。第二种方法更符合\
  \ Chart.js 的哲学，即尽可能的模块化和独立。\n\n7. SitePoint 提供的带有自定义 onClick() 的柱状图 ([@SitePoint](http://codepen.io/SitePoint))\
  \ 享于 [CodePen](http://codepen.io)。\n\n\n\n\nChart.js 是快速原型简单图表的完美选择。它共有八种主要的图表类型，我们涵盖了：`line`、`bar`、`radar`、`polarArea`、`pie`\
  \ 和 `doughnut`。这些多样化的图表涵盖了常见的数据可视化方式，这意味着 Chart.js 可能是你下一个项目中唯一的绘图库。\n\n如果你想了解更多关于\
  \ Chart.js 的知识，我强烈推荐查看文档，你可以在 [Chart.js Website](http://www.chartjs.org/) 上找到。\n\
  \n## 第 10 章：通过示例学习 JavaScript 测试驱动开发\n\n作者 James Wright\n\n由 [Vildan Softic](https://www.sitepoint.com/author/vildansoftic)\
  \ 评审。\n\n你可能已经对自动化测试及其优点非常熟悉了。为你的应用程序编写一组测试可以让你放心地修改代码，因为知道万一你破坏了某些内容，测试会为你提供后盾。你还可以更进一步，在编写代码之前先编写测试；这种做法被称为测试驱动开发（TDD）。\n\
  \n在本教程中，我们将讨论什么是 TDD 以及它能给开发者带来什么好处。我们将使用 TDD 来实现一个表单验证器，确保用户输入的任何值都符合一组特定的规则。\n\
  \n## Node 中的 TDD\n\n注意，本文将侧重于前端代码的测试。如果你正在寻找专注于后端的内容，请务必查看我们的课程：[Node.js 测试驱动开发](https://www.sitepoint.com/premium/courses/test-driven-development-in-node-js-2932)\n\
  \n## 什么是 TDD？\n\n测试驱动开发是一种编程方法，通过它可以处理代码单元的设计、实现和测试，并在某种程度上处理程序的预期功能。\n\nTDD 补充了\
  \ [极捷编程的测试优先方法](https://courses.csail.mit.edu/6.042/spring17/mcs.pdf）（即开发者在实现功能或单元之前编写测试），同时\
  \ TDD 也有助于代码的重构；这通常被称为红-绿-重构循环（RedGreen-Refactor Cycle）。\n\n![](img/00010.jpg)\n\
  \n*   编写一个失败的测试 - 写一个调用你的逻辑并断言会产生正确行为的测试\n    *   在单元测试中，这将是断言函数的返回值，或验证模拟的依赖是否按预期被调用\n\
  \    *   在功能测试中，这将确保 UI 或 API 在一系列操作中表现出可预测的性\n*   让测试通过 - 实现最少的代码以使测试通过，并确保所有其他测试继续通过\n\
  *   重构实现 - 更新或重写实现，在不破坏任何公共契约的情况下提高其质量，且不破坏新旧测试\n\n自从我从职业之初就接触到 TDD 以来，我已经在某种程度上使用它了，但随着我开始处理具有更复杂要求的应用程序和系统，我个人发现这种技术可以节省时间，并有利于我工作的质量和健壮性。\n\
  \n在继续之前，可能值得熟悉一下可以编写的各种类型的自动化测试。Eric Elliot [对它们总结得非常到位](https://www.sitepoint.com/javascript-testing-unit-functional-integration/)：\n\
  \n*   单元测试 - 确保应用的各个单元（如函数和类）按预期工作。断言测试这些单元对于任何给定的输入是否返回预期的输出。\n*   集成测试 - 确保单元之间的协作按预期工作。断言可以测试\
  \ API、UI 或可能产生副作用的交互（如数据库 I/O、日志等）。\n*   端到端测试 - 确保软件从用户的角度来看按预期工作，并且每个单元在系统的整体范围内都表现正确。断言主要测试用户界面。\n\
  \n## 测试驱动开发的优势\n\n### 时的测试覆盖\n通过在实现功能之前为其编写测试用例，代码覆盖率立即得到保证，而且可以在项目开发周期的更早阶段发现行为漏洞。当然，这要求测试能够覆盖所有行为，包括错误处理，但人们应该始终带着这种心态实践\
  \ TDD。\n\n### 充满心地重构\n参考上述的红-绿-重构循环，对实现的任何更改都可以通过确保现有测试继续通过来验证。编写运行速度尽可能快的测试将缩短这种反馈循环；虽然覆盖所有可能的场景是重要的，且不同计算机之间的执行时间可能略有不同，但编写精简且重点的测试长远来看将节省时间。\n\
  \n### 契约设计\n测试驱动开发允许开发者考虑 API 将如何被消费以及使用起来有多方便，而无需担心实现。在测试用例中调用单元本质上反映了生产环境中的调用点，因此可以在实现阶段之前修改外部设计。\n\
  \n### 避免冗余代码\n只要人们在更改相关实现时频繁甚至自动地运行测试，满足现有测试就会减少增加不必要的额外代码的概率，这可能导致代码库更容易维护和理解。因此，TDD\
  \ 帮助人们遵循 [KISS 原则（简单点，愚蠢的！）](https://en.wikipedia.org/wiki/KISS_principle)。\n\n\
  ### 不依赖集成\n在编写单元测试时，如果符合要求的输入，那么单元在集成到代码库后将按预期运行。然而，也应该编写集成测试，以确保新代码的调用点被正确调用。\n\
  \n例如，让我们考虑下面的函数，它判断用户是否为：\n\n```javascript\n'use strict'\nfunction isAdmin(id, users)\
  \ {\n  const user = users.find(u => u.id === id);\n  return user.isAdmin;\n}\n```\n\
  \n我们不是硬编码用户，而是将其作为参数期望。这允许我们在测试中传递一个预填充的数组：\n\n```javascript\nconst testUsers =\
  \ [\n  {\n    id: 1,\n    isAdmin: true\n  },\n  {\n    id: 2,\n    isAdmin: false\n\
  \  }\n];\n\nconst isAdmin = isAdmin(1, testUsers);\n// TODO: 断言 isAdmin 为 true\n\
  ```\n\n这种方法允许单元在系统的其余部分之外实现和测试。一旦数据库中有用户，我们就可以集成单元并编写集成测试来验证我们正确传递了参数。\n\n## JavaScript\
  \ 测试驱动开发\n\n随着 JavaScript 全栈软件的出现，出现了大量的测试库，允许对客户端和服务端代码进行测试；[Mocha](https://mochajs.org/)\
  \ 就是此类库的一个示例，将在练习中使用。\n\n我认为 TDD 的一个场景是表单验证；这是一个相当复杂的任务，通常遵循以下步骤：\n\n1.  从需要验证的\
  \ `<input>` 读取值\n2.  针对该值调用规则（例如字母、数字）\n3.  如果无效，为用户提供有意义的错误\n4.  对下一个可验证输入重复此操作\n\
  \n有一个[练习的 CodePen](http://codepen.io/SitePoint/pen/NpZLzR)，其中包含了一些样板测试代码以及空的 `validateForm`\
  \ 函数。请在我们开始之前对其进行 Fork。\n\n\n\n\n\n我们将编写一个端到端测试，以验证 `validateForm` 在真实 DOM 节点上的功能，以及针对我们最初支持的两种验证类型的验证。一旦我们的第一个实现运行正常，我们将遵循\
  \ TDD（测试驱动开发），通过编写更小的单元来逐步对其进行重构。\n\n以下是我们的测试将用到的表单：\n\n```html\n<form class=\"\
  test-form\">\n    <input name=\"first-name\" type=\"text\" data-validation=\"alphabetical\"\
  \ />\n    <input name=\"age\" type=\"text\" data-validation=\"numeric\" />\n</form>\n\
  ```\n\n在每个测试之间，我们都会创建一个表单的新克隆，以消除潜在副作用的风险。传递给 `cloneNode` 的 `true` 参数确保表单的子节点也会被克隆：\n\
  \n```javascript\nlet form = document.querySelector('.test-form');\nbeforeEach(function\
  \ () {\n    form = form.cloneNode(true);\n});\n```\n\n### 编写第一个测试用例\n\n`describe('the\
  \ validateForm function', function () {})` 测试套将用于测试我们的 API。在内部函数中编写第一个测试用例，该用例将确保字母和数字规则的合法值会被识别为有效：\n\
  \n```javascript\nit('should validate a form with all of the possible validation\
  \ types', function () {\n    const name = form.querySelector('input[name=\"first-name\"\
  ]');\n    const age = form.querySelector('input[name=\"age\"]');\n    name.value\
  \ = 'Bob';\n    age.value = '42';\n    const result = validateForm(form);\n    expect(result.isValid).to.be.true;\n\
  \    expect(result.errors.length).to.equal(0);\n});\n```\n\n将更改保存到你的 fork 之后，你应该看到测试失败了。\n\
  \n现在让我们这个测试通过（变绿）！记住，我们应该努力编写最少、合理的代码（而不是 `return true;!` 这种数量的代码）来满足测试，所以我们现在不要担心错误报告。\n\
  \n这是初始实现，它遍历我们表单的 `input` 元素并使用正则表达式验证每个的值：\n\n```javascript\nfunction validateForm(form)\
  \ {\n    const result = {\n        errors: []\n    };\n    const inputs = Array.from(form.querySelectorAll('input'));\n\
  \    let isValid = true;\n    for (let input of inputs) {\n        if (input.dataset.validation\
  \ === 'alphabetical') {\n            isValid = isValid && /^[a-z]+$/i.test(input.value);\n\
  \        } else if (input.dataset.validation === 'numeric') {\n            isValid\
  \ = isValid && /^[0-9]+$/.test(input.value);\n        }\n    }\n    result.isValid\
  \ = isValid;\n    return result;\n}\n```\n\n现在你应该看到我们的测试通过了。\n\n### 错误处理\n\n在我们第一个测试之后，让我们写另一个测试，用于验证当字母字段无效时，返回的\
  \ `result` 对象的 `error` 数组包含一个带有预期消息的 `Error` 实例：\n\n```javascript\nit('should return\
  \ an error when a name is invalid', function () {\n    const name = form.querySelector('input[name=\"\
  first-name\"]');\n    const age = form.querySelector('input[name=\"age\"]');\n \
  \   name.value = '!!!';\n    age.value = '2';\n    const result = validateForm(form);\n\
  \    expect(result.isValid).to.be.false;\n    expect(result.errors[0]).to.be.instance(Error);\n\
  \    expect(result.errors[0].message).to.equal('!!! is not a valid first-name value');\n\
  });\n```\n\n保存你的 fork 之后，你应该看到新的失败用例。让我们更新实现以以满足测试用例：\n\n```javascript\nfunction\
  \ validateForm(form) {\n    const result = {\n        get isValid() {\n        \
  \    return this.errors.length === 0;\n        },\n        errors: []\n    };\n\
  \    const inputs = Array.from(form.querySelectorAll('input'));\n    for (let input\
  \ of inputs) {\n        if (input.dataset.validation === 'alphabetical') {\n   \
  \         let isValid = /^[a-z]+$/i.test(input.value);\n            if (!isValid)\
  \ {\n                result.errors.push(new Error(`${input.value} is not a valid\
  \ ${input.name} value`));\n            }\n        } else if (input.dataset.validation\
  \ === 'numeric') {\n            // TODO: we'll consume this the next test\n    \
  \        let isValid = /^[0-9]+$/.test(input.value);\n        }\n    }\n    return\
  \ result;\n}\n```\n\n现在让我们添加一个测试，断言数字验证错误被正确处理：\n\n```javascript\nit('should return\
  \ an error when an age is invalid', function () {\n    const name = form.querySelector('input[name=\"\
  first-name\"]');\n    const age = form.querySelector('input[name=\"age\"]');\n \
  \   name.value = 'Greg';\n    age.value = 'a';\n    const result = validateForm(form);\n\
  \    expect(result.isValid).to.be.false;\n    expect(result.errors[0]).to.be.instance(Error);\n\
  \    expect(result.errors[0].message).to.equal('a is not a valid age value');\n\
  });\n```\n\n一旦你目睹了测试失败，请更新 `validateForm` 函数：\n\n```javascript\n} else if (input.dataset.validation\
  \ === 'numeric') {\n    let isValid = /^[0-9]+$/.test(input.value);\n    if (!isValid)\
  \ {\n        result.errors.push(new Error(`${input.value} is not a valid ${input.name}\
  \ value`));\n    }\n}\n```\n\n最后，让我们添加一个测试来确保多个错误被处理：\n\n```javascript\nit('should\
  \ return multiple errors if more than one field is invalid', function () {\n   \
  \ const name = form.querySelector('input[name=\"first-name\"]');\n    const age\
  \ = form.querySelector('input[name=\"age\"]');\n    name.value = '!!!';\n    age.value\
  \ = 'a';\n    const result = validateForm(form);\n    expect(result.isValid).to.be.false;\n\
  \    expect(result.errors[0]).to.be.instance(Error);\n    expect(result.errors[0].message).to.equal('!!!\
  \ is not a valid first-name value');\n    expect(result.errors[1]).to.be.instance(Error);\n\
  \    expect(result.errors[1].message).to.equal('a is not a valid age value');\n\
  });\n```\n\n### 重构我们的验证器\n\n虽然我们有一个通过测试的运行函数，但它产生了一些代码气味：\n\n*   多重职责：\n    - 我们在同一个函数中查询内部节点、指定规则集并计算整体结果。从[SOLID\
  \ 原则](https://en.wikipedia.org/wiki/SOLID_(object-oriented_design))的角度来看，这违反了[单一职责原则](https://en.wikipedia.org/wiki/Single_responsibility_principle)。\n\
  \    - 此外，缺乏抽象导致代码难以理解。\n*   紧耦合：\n    - 目前实现将上述职责交织在一起，使得对每个部分的更新都变得脆弱；当我们引入问题时，调试将变得困难。\n\
  \    - 而且，我们无法在不更新 `if` 语句的情况下添加或更改验证规则。这违反了 SOLID 的[开闭原则](https://en.wikipedia.org/wiki/Open/closed_principle)。\n\
  *   逻辑重复：\n    - 如果我们要更新错误消息的格式，或者向数组添加另一个对象，就必须在两个地方进行更新。\n\n幸运的是，由于我们已经为验证器编写了功能测试，我们可以放心地改进代码而不用担心破坏它。\n\
  \n#### `createValidationQueries` 函数\n\n通过将我们的 `HTMLInputElement` `NodeList` 映射为代表表单字段、验证类型以及该字段值的对象，我们不仅将\
  \ `validateForm` 函数与 DOM 解耦，还为以后替换硬编码正则表达式时进行验证规则查找提供了便利。\n\n\n\n\n例如，`first-name`\
  \ 字段的验证查询对象将：\n\n```javascript\n{\n    name: 'first-name',\n    type: 'alphabetical',\n\
  \    value: 'Bob'\n}\n```\n\n在 `validateForm` 函数上方，创建一个名为 `createValidationQueries`\
  \ 的空函数。然后，在 `validateForm` 的 `describe` get 之外，创建另一个名为 'the createValidationQueries\
  \ function' 的 `describe suite`。\n\n它应该包含唯一的测试用例：\n\n```javascript\ndescribe('the\
  \ createValidationQueries function', function () {\n    it('should map input elements\
  \ with a data-validation attribute to an array of validation objects', function\
  \ () {\n        const name = form.querySelector('input[name=\"first-name\"]');\n\
  \        const age = form.querySelector('input[name=\"age\"]');\n        name.value\
  \ = 'Bob';\n        age.value = '42';\n        const validations = createValidationQueries([name,\
  \ age]);\n        expect(validations.length).to.equal(2);\n        expect(validations[0].name).to.equal('first-name');\n\
  \        expect(validations[0].type).to.equal('alphabetical');\n        expect(validations[0].value).to.equal('Bob');\n\
  \        expect(validations[1].name).to.equal('age');\n        expect(validations[1].type).to.equal('numeric');\n\
  \        expect(validations[1].value).to.equal('42');\n    });\n});\n```\n\n一旦你目睹了它的失败，请编写实现代码：\n\
  \n```javascript\nfunction createValidationQueries(inputs) {\n    return Array.from(inputs).map(input\
  \ => ({\n        name: input.name,\n        type: input.dataset.validation,\n  \
  \      value: input.value\n    }));\n}\n```\n\n当它通过时，更新 `validateForm` 的 `for` 循环以调用我们的新函数，并使用查询对象来确定表单的有效性：\n\
  \n```javascript\nfor (let validation of createValidationQueries(form.querySelectorAll('input')))\
  \ {\n    if (validation.type === 'alphabetical') {\n      let isValid = /^[a-z]+$/i.test(validation.value);\n\
  \        if (!isValid) {\n            result.errors.push(new Error(`${validation.value}\
  \ is not a valid ${validation.name} value`));\n        }\n    } else if (validation.type\
  \ === 'numeric') {\n      let isValid = /^[0-9]+$/.test(validation.value);\n   \
  \   if (!isValid) {\n        result.errors.push(new Error(`${validation.value} is\
  \ not a valid ${validation.name} value`));\n      }\n    }\n}\n```\n\n如果我们的新测试和现有测试都通过了[如此\
  \ pen 所示](http://codepen.io/SitePoint/pen/EWBeep?editors=010)），那么我们可以做一个更大的改变：解耦\
  \ `validateItem` 函数。为了移除我们的硬编码规则，让我们编写一个函数，将规则作为 [`Map`](https://developer.mozilla.org/en/docs/JavaScript/Global_Objects/Map)\
  \ 并断言我们输入的有效性。\n\n与 `createValidationQueries` 一样，我们将在实现之前编写一个新的 suite。在 `validateForm`\
  \ 的实现上方，编写一个名为 `validateItem` 的空函数。然后是在我们的主 `describe` suite 中，为我们的新增编写另一个 `describe`\
  \ suite：\n\n```javascript\ndescribe('the validateItem function', function () {\n\
  \    const validationRules = new Map([\n        ['alphabetical', /^[a-z]+$/i]\n\
  \    ]);\n    it('should return true when the passed item is deemed valid against\
  \ the validation rules', function () {\n        const validation = {\n         \
  \   type: 'alphabetical',\n            value: 'Bob'\n        };\n        const isValid\
  \ = validateItem(validation, validationRules);\n        expect(isValid).to.be.true;\n\
  \    });\n});\n```\n\n我们从测试中显式地向实现传递一个规则的 `Map`，因为我们想要验证其独立于主函数的行为；这使其成为单元测试。这是我们\
  \ `validateItem()` 的第一次实现：\n\n```javascript\nfunction validateItem(validation, validationRules)\
  \ {\n    return validationRules.get(validation.type).test(validation.value);\n}\n\
  ```\n\n一旦此测试通过，编写第二个测试用例来验证当验证查询无效时我们的函数返回 `false`；由于我们目前的实现，这应该是通过的：\n\n```javascript\n\
  it('should return false when the passed item is deemed invalid', function () {\n\
  \    const validation = {\n        type: 'alphabetical',\n        value: '42'\n\
  \    };\n    const isValid = validateItem(validation, validationRules);\n    expect(isValid).to.be.false;\n\
  });\n```\n\n最后，编写一个测试用例来确定当验证类型未找到时 `validateItem` 返回 `false`：\n\n```javascript\n\
  it('should return false when the specified validation type is not found', function\
  \ () {\n    const validation = {\n        type: 'foo',\n        value: '42'\n  \
  \  };\n    const isValid = validateItem(validation, validationRules);\n    expect(isValid).to.be.false;\n\
  });\n```\n\n我们的实现应该在对任何值与其相应的正则表达式进行测试之前，检查指定的验证类型是否存在于 `validationRules` `Map`\
  \ 中：\n\n```javascript\nfunction validateItem(validation, validationRules) {\n  \
  \  if (!validationRules.has(validation.type)) {\n      return false;\n    }\n  \
  \  return validationRules.get(validation.type).test(validation.value);\n}\n```\n\
  \n一旦此测试通过，让我们在 `createValidationQueries` 上方创建一个新的 `Map`，将包含我们 API 使用的实际验证规则：\n\n\
  ```javascript\nconst validationRules = new Map([\n    ['alphabetical', /^[a-z]+$/i],\n\
  \    ['numeric', /^[0-9]+$/]\n]);\n```\n\n最后，让我们重构 `validateForm` 函数以使用新的函数和规则：\n\
  \n```javascript\nfunction validateForm(form) {\n    const result = {\n      isValid()\
  \ {\n        return this.errors.length === 0;\n      },\n      errors: []\n    };\n\
  \    for (let validation of createValidationQueries(form.querySelectorAll('input')))\
  \ {\n      let isValid = validateItem(validation, validationRules);\n      if (!isValid)\
  \ {\n        result.errors.push(\n            new Error(`${validation.value} is\
  \ not a valid ${validation.name} value`)\n        );\n      }\n    }\n    return\
  \ result;\n}\n```\n\n希望所有的测试都通过了。恭喜你使用测试驱动开发重构并改进了代码质量！你的最终实现应该类似于[这个 Pen](http://codepen.io/SitePoint/pen/xqoamQ?editors=0010)。\n\
  \n## 结语\n\n通过 TDD，我们能够将表单验证的初始实现并拆分为独立且易于理解的部分。我希望你喜欢这个教程，并将这种实践带到你的日常工作中。\n\n\n\
