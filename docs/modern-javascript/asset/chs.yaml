  \ `src` 目录中的 `.js` 文件发生变化时，它都会重新编译我们的包。控制台中的输出会告诉我们正在创建的包，关注包的数量和大小是非常重要的。\n\n![](img/00003.jpg)\n\
  \n现在你应该可以在浏览器中加载 `index.html` 并看到“Hello webpack.” 了。\n\n`open index.html`\n\n打开\
  \ `dist/bundle.js` 查看 `webpack` 做了什么，顶部是 `webpack` 的模块引导代码，最底部是我们的模块。你现在可能觉得并不惊艳，但如果你已经走了这一步，现在就可以开始编写\
