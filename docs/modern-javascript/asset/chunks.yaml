    `  }`


    `}`


    `module.exports = config`


    The config above is a common starting point, it instructs webpack to compile our
    entry point `src/app.js` into our output `dist``bundle.js` and all `.js` files
    will be transpiled from ES2015 to ES5 with Babel.


    To get this running we''re going to need to install three packages, `babel-core`,
    the webpack loader `babel-loader` and the preset `babel-preset-es2015` for the
    flavor of JavaScript we want to write. `{ modules: false }` enables [Tree Shaking](http://www.2ality.com/2015/12/webpack-tree-shaking.html)
    to remove unused exports from your bundle to bring down the file size.


    `npm install babel-core babel-loader babel-preset-es2015 --save-dev`


    Lastly, replace the scripts section of `package.json` with the following:


    `"scripts": {`


    `  "start": "webpack --watch",`


    `  "build": "webpack -p"`


    `},`


    Running `npm start` from the command line will start webpack in watch mode which
    will recompile our bundle whenever a `.js` file is changed in our `src` directory.
    The output in the console tells us about the bundles being being created, it''s
    important to keep an eye on the number of bundles and the size.


    ![](images/00003.jpg)


    You should now be able to load `index.html` in your browser and be greeted with
    "Hello webpack.".


    `open index.html`


    Open up `dist/bundle.js` to see what webpack has done, at the top is webpack''s
    module bootstrapping code and right at the bottom is our module. You may not be
    colored impressed just yet but if you''ve come this far you can now start authoring
    ES6 modules and webpack will be able to produce a bundle for production that will
    work in all browsers.


    Stop webpack with `Ctrl + C` and run `npm run build` to compile our bundle in
    production mode.


    Notice that the bundle size has come down from 2.61 kB to 585 bytes. Take another
    look at `dist/bundle.js` and you''ll see a big ugly mess of code, our bundle has
    been minified with UglifyJS, the code will run exactly the same but it''s done
    with the fewest characters needed.


    Modules


    Out of the box webpack knows how to consume JavaScript modules in a variety of
    formats, the most notable two are:


    *   ES2015 `import` statements


    *   CommonJS `require()` statements


    We can test this out by installing [lodash](https://lodash.com/) and importing
    it from `app.js`


    `npm install lodash --save`


    `// src/app.js`


    `import {groupBy} from ''lodash/collection''`


    `const people = [{`


    `  manager: ''Jen'',`


    `  name: ''Bob''`


    `}, {`


    `  manager: ''Jen'',`


    `  name: ''Sue''`


    `}, {`


    `  manager: ''Bob'',`


    `  name: ''Shirley''`


    `}, {`


    `  manager: ''Bob'',`


    `  name: ''Terrence''`


    `}]`


    `const managerGroups = groupBy(people, ''manager'')`


    `const root = document.querySelector(''#root'')`


    `` root.innerHTML = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>` ``


    Run `npm start` to start webpack and refresh `index.html`, you should see an array
    of people grouped by manager.


    Let''s move the array of people into its own module `people.js`


    `// src/people.js`


    `const people = [{`


    `  manager: ''Jen'',`


    `  name: ''Bob''`


    `}, {`


    `  manager: ''Jen'',`


    `  name: ''Sue''`


    `}, {`


    `  manager: ''Bob'',`


    `  name: ''Shirley''`


    `}, {`


    `  manager: ''Bob'',`


    `  name: ''Terrence''`


    `}]`


    `export default people`


    We can simply import it from `app.js` with a relative path.


    `// src/app.js`


    `import {groupBy} from ''lodash/collection''`


    `import people from ''./people''`


    `const managerGroups = groupBy(people, ''manager'')`


    `const root = document.querySelector(''#root'')`


    `` root.innerHTML = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>` ``


    Note: Imports without a relative path like `''lodash/collection''` are modules
    from npm installed to `/node_modules`, your own modules will always need a relative
    path like `''./people''`, this is how you can tell them apart.


    Loaders


    We''ve already been introduced to `babel-loader`, one of many [loaders](https://webpack.js.org/loaders/)
    that you can configure to tell webpack what to do when it encounters imports for
    different file types. You can chain loaders together into a series of transforms,
    a good way to see how this works is by importing Sass from our JavaScript.


    Sass


    This transformation involves three separate loaders and the `node-sass` library:


    `npm install css-loader style-loader sass-loader node-sass --save-dev`


    Add a new rule to our config file for `.scss` files.


    `// webpack.config.js`


    `rules: [{`


    `  test: ``\.scss$``,`


    `  use: [`


    `    ''style-loader'',`


    `    ''css-loader'',`


    `    ''sass-loader''`


    `  ]`


    `}, {`


    `  // ...`


    `}]`


    Note: Whenever you change any of loading rules in `webpack.config.js` you''ll
    need to restart the build with `Ctrl + C` and `npm start`.


    The array of loaders are processed in reverse order:


    *   `sass-loader` transforms Sass into CSS.


    *   `css-loader` parses the CSS into JavaScript and resolves any dependencies.


    *   `style-loader` outputs our CSS into a `<style>` tag in the document.


    You can think of these as function calls, the output of one loader feeds as input
    into the next.


    `styleLoader(cssLoader(sassLoader(''source'')))`


    Let''s add a Sass source file:


    `/* src/style.scss */`


    `$bluegrey: #2B3A42;`


    `pre {`


    `  padding: 20px;`


    `  background: $bluegrey;`


    `  color: #dedede;`


    `  text-shadow: 0 1px 1px rgba(#000, .5);`


    `}`


    You can now require Sass directly from your JavaScript, import it from the top
    of `app.js`.


    `// src/app.js`


    `import ''./style.scss''`


    `// ...`


    Reload `index.html` and you should see some styling.


    CSS in JS


    We just imported a Sass file from our JavaScript, as a module.


    Open up `dist/bundle.js` and search for "pre {". Indeed, our Sass has been compiled
    to a string of CSS and saved as a module within our bundle. When we import this
    module in our JavaScript, `style-loader` outputs that string into an embedded
    `<style>` tag.


    I know what you''re thinking. Why?


    I won''t delve too far into this topic here, but here are a few reasons to consider:


    *   A JavaScript component you may want to include in your project may depend
    on other assets to function properly (HTML, CSS, Images, SVG), if these can all
    be bundled together it is far easier to import and use.


    *   Dead code elimination: When a JS component is no longer imported by your code,
    the CSS will no longer be imported either. The bundle produced will only ever
    contain code that does something.


    *   CSS Modules: The global namespace of CSS makes it very difficult to be confident
    that a change to your CSS will not have any side effects. [CSS modules](https://github.com/css-modules/css-modules)
    change this by making CSS local by default and exposing unique class names that
    you can reference in your JavaScript.


    *   Bring down the number of HTTP requests by bundling / splitting code in clever
    ways.


    Images


    The last example of loaders we''ll look at is the handling of images with `url-loader`.


    In a standard HTML document images are fetched when the browser encounters an
    `<img>` tag or an element with a `background-image` property. With webpack you
    can optimize this in the case of small images by storing the source of the images
    as strings inside your JavaScript. By doing this you preload them and the browser
    won''t have to fetch them with separate requests later.


    `npm install file-loader url-loader --save-dev`


    Add one more rule for loading images:


    `// webpack.config.js`


    `rules: [{`


    `  test: /\.(png|jpg)$/,`


    `  use: [{`


    `    loader: ''url-loader'',`


    `    options: { limit: 10000 } // Convert images < 10k to base64 strings`


    `  }]`


    `}, {`


    `  // ...`


    `}]`'
