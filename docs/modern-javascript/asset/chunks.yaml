    annotations and type inference.


    There''s also a more subtle benefit. TypeScript has been heavily influenced by
    Java and .NET, so if your developers have a background in one of these languages,
    they are likely to find TypeScript easier to learn than plain JavaScript (notice
    how we switched from the tool to your personal environment). Although Angular
    has been the first major framework to actively adopt TypeScript, it''s also possible
    to use it together with React.


    [Further reading: [An Introduction to TypeScript: Static Typing for the Web](https://www.sitepoint.com/introduction-to-typescript/)]


    RxJS


    [RxJS](http://reactivex.io/rxjs/) is a reactive programming library which allows
    for more flexible handling of asynchronous operations and events. It''s a combination
    of the Observer and Iterator patterns blended together with functional programming.
    RxJS allows you to treat anything as a continuous stream of values and perform
    various operations on it such as mapping, filtering, splitting or merging.


    The library has been adopted by Angular in their HTTP module as well for some
    internal use. When you perform an HTTP request, it returns an Observable instead
    of the usual Promise. Although this library is extremely powerful, it''s also
    quite complex. To master it, you''ll need to know your way around different types
    of Observables, Subjects, as well as around a [hundred methods and operators](http://reactivex.io/rxjs/manual/overview.html#operators).
    Yikes, that seems to be a bit excessive just to make HTTP requests!


    RxJS is useful in cases when you work a lot with continuous data streams such
    as web sockets, however, it seems overly complex for anything else. Anyway, when
    working with Angular you''ll need to learn it at least on a basic level.


    [Further reading: [Introduction to Functional Reactive Programming with RxJS](https://www.sitepoint.com/functional-reactive-programming-rxjs/)]


    We''ve found TypeScript to be a great tool for improving the maintainability of
    our projects, especially those with a large code base or complex domain/business
    logic. Code written in TypeScript is more descriptive and easier to follow. Since
    TypeScript has been adopted by Angular, we hope to see even more projects using
    it. RxJS, on the other hand, seems only to be beneficial in certain cases and
    should be adopted with care. Otherwise, it can bring unwanted complexity to your
    project.


    Ecosystem


    The great thing about open source frameworks is the number of tools created around
    them. Sometimes, these tools are even more helpful than the framework itself.
    Let''s have a look at some of the most popular tools and libraries associated
    with each framework.


    Angular


    Angular CLI


    A popular trend with modern frameworks is having a CLI tool that helps you bootstrap
    your project without having to configure the build yourself. Angular has [Angular
    CLI](https://cli.angular.io/) for that. It allows you to generate and run a project
    with just a couple of commands. All of the scripts responsible for building the
    application, starting a development server and running tests are hidden away from
    you in `node_modules`. You can also use it to generate new code during development.
    This makes setting up new projects a breeze.


    [Further reading: [The Ultimate Angular CLI Reference](https://www.sitepoint.com/ultimate-angular-cli-reference/)]


    Ionic 2


    [Ionic 2](http://ionic.io/2) is a new version of the popular framework for developing
    hybrid mobile applications. It provides a Cordova container that is nicely integrated
    with Angular 2, and a pretty material component library. Using it, you can easily
    set up and build a mobile application. If you prefer a hybrid app over a native
    one, this is a good choice.


    Material design components


    If you''re a fan of material design, you''ll be happy to hear that there''s a
    [Material component library](https://material.angular.io/) available for Angular.
    Currently, it''s still at an early stage and slightly raw but it has received
    lots of contributions recently, so we might hope for things to improve soon.


    Angular universal


    [Angular universal](https://github.com/angular/universal) is a seed project that
    can be used for creating projects with support for server-side rendering.


    @ngrx/store


    [@ngrx/store](https://github.com/ngrx/store) is a state management library for
    Angular inspired by Redux, being based on state mutated by pure reducers. Its
    integration with RxJS allows you to utilize the push change detection strategy
    for better performance.


    > There are plenty of other libraries and tools available in [the Awesome Angular
    list](https://github.com/AngularClass/awesome-angular).


    React


    Create react app


    [Createreact-app](https://github.com/facebookincubator/create-react-app) is a
    CLI utility for React to quickly set up new projects. Similar to Angular CLI it
    allows you to generate a new project, start a development server and create a
    bundle. It uses [Jest](https://www.sitepoint.com/test-react-components-jest/),
    a relatively new test runner from Facebook, for unit testing, which has some nice
    features of its own. It also supports flexible application profiling using environment
    variables, backend proxies for local development, Flow, and other features. Check
    out this brief [introduction to createreact-app](https://www.sitepoint.com/create-react-app/)
    for more information.


    React Native


    [React Native](https://facebook.github.io/react-native/) is a platform developed
    by Facebook for creating native mobile applications using React. Unlike Ionic,
    which produces a hybrid application, React Native produces a truly native UI.
    It provides a set of standard React components which are bound to their native
    counterparts. It also allows you to create your own components and bind them to
    native code written in Objective-C, Java or Swift.


    Material UI


    There''s a [material design component](http://www.material-ui.com) library available
    for React as well. Compared to Angular''s version, this one is more mature and
    has a wider range of components available.


    Next.js


    [Next.js](https://github.com/zeit/next.js/) is a framework for the server-side
    rendering of React applications. It provides a flexible way to completely or partially
    render your application on the server, return the result to the client and continue
    in the browser. It tries to make the complex task of creating universal applications
    as simple as possible so the set up is designed to be as simple as possible with
    a minimal amount of new primitives and requirements for the structure of your
    project.


    MobX


    [MobX](https://github.com/mobxjs/mobx) is an alternative library for managing
    the state of an application. Instead of keeping the state in a single immutable
    store, like Redux does, it encourages you to store only the minimal required state
    and derive the rest from it. It provides a set of decorators to define observables
    and observers and introduce reactive logic to your state.


    [Further reading: [How to Manage Your JavaScript Application State with MobX](https://www.sitepoint.com/manage-javascript-application-state-mobx/)]


