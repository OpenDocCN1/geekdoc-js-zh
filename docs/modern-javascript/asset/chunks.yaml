    \    });\n}\n```\n\nFinally, we add an `install` event listener. The `waitUntil`\
    \ method ensures the service worker will not install until all enclosed code has\
    \ executed. It runs `installStaticFiles()` then `self.skipWaiting()` to make the\
    \ service worker active:\n\n```javascript\n// application installation\nself.addEventListener('install',\
