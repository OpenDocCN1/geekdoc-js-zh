    Development Tools


    If you think JavaScript debugging is tough, service workers won''t be much fun!
    Chrome''s Application tab of the Developer Tools provides a solid set of features
    and logging statements are also output to the console.


    You should consider running your app in an Incognito window during development
    since cached files are not retained after you close the tab.


    Firefox offers a JavaScript debugger accessed from the Service Workers option
    of the tools menu. Better facilities are promised soon.


    Finally, the [Lighthouse extension for Chrome](https://chrome.google.com/webstore/detail/lighthouse/blipmdconlkpinefehnmjammfjpmpbjk)
    also provides useful information about your PWA''s implementation.


    PWA Gotchas


    Progressive Web Apps require new technologies so some caution is advised. That
    said, they are an enhancement of your existing website which should take no longer
    than a few hours and have no negative effect on unsupported browsers.


    Developer opinions vary but there are several points to consider...


    URL Hiding


    The demonstration site hides the URL bar which I would not recommend unless you
    have a single-URL app such as a game. The manifest options `display: minimal-ui`
    or `display: browser` are possibly best for most sites.


    Cache Overload


    You could cache every page and asset on your site. That''s fine for small sites
    but would it be practical for those with thousands of pages? No one is likely
    to be interested in all your content and device storage limits could be exceeded.
    Even if you only store visited pages and assets like the demonstration, the cache
    could grow excessively.


    Perhaps consider:


    *   only caching important pages such as the home, contact, and the most recent
    articles


    *   not caching images, videos and other large files


    *   regularly wiping older cached files


    *   providing a "store this page for offline reading" button so the user can choose
    what to cache.


    Cache Refreshing


    The demonstration looks for assets in the cache before loading from the network.
    That''s great when users are offline but means they could be viewing old pages
    even when they''re online.


    URLs for assets such as images and videos should never change so long-term caching
    is rarely a problem. You can ensure they remain cached for at least a year (31,536,000
    seconds) with the `Cache-Control` HTTP header:


    `Cache-Control: max-age=31536000`


    Pages, CSS and script files can change more frequently so you could set a shorter
    expiry of 24 hours and ensure it is validated against the server version when
    online:


    `Cache-Control: must-revalidate, max-age=86400`


    You could also consider cache-busting techniques to ensure older assets cannot
    be used, e.g. naming your CSS file `styles-abc123.css` and changing the hash on
    every release.


    Caching can become complex so I''d recommend you read Jake Archibold''s [Caching
    best practices & max-age gotchas](https://jakearchibald.com/2016/caching-best-practices/).


    Useful Links


    The following resources are useful if you want to know more about Progressive
    Web Apps:


    *   [PWA.rocks example applications](https://pwa.rocks/)


    *   [Progressive Web Apps](https://developers.google.com/web/progressive-web-apps/)


    *   [Your First PWA](https://codelabs.developers.google.com/codelabs/your-first-pwapp/)


    *   [Mozilla Service Worker Cookbook](https://serviceworke.rs/)


    *   [MDN Using Service Workers](https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API/Using_Service_Workers)


