    \ 关键字和 `return` 关键字。这允许你以更优雅的方式编写函数风格的代码。\n\n```javascript\n// ES5\nvar add =\
    \ function(a, b) {\n  return a + b;\n}\n\n// ES2015\nconst add = (a, b) => a +\
    \ b;\n```\n\n箭头函数的另一个重要特性是它们会从定义时的上下文继承 `this` 的值：\n\n```javascript\nfunction\
    \ Person() {\n  this.age = 0;\n  // ES5\n  setInterval(function() {\n    this.age++;\
    \ // |this| 指向全局对象\n  }, 1000);\n  // ES2015\n  setInterval(() => {\n    this.age++;\
    \ // |this| 正确地指向 person 对象\n  }, 1000);\n}\n\nvar p = new Person();\n```\n\n\
    ## 改进的 Class 语法\n\n如果你是面向对象编程的粉丝，可能会喜欢语言在现有原型机制的基础上增加了类（classes）。虽然这只是语法糖，但它为试图用原型模拟经典面向对象编程的开发者提供了更简洁的语法。\n\
    \n```javascript\nclass Person {\n  constructor(name) {\n    this.name = name;\n\
    \  }\n  greet() {\n    console.log(`Hello, my name is ${this.name}`);\n  }\n}\n\
    ```\n\n## Promises / 异步函数\n\nJavaScript 的异步本质长期以来一直挑战；在处理如 Ajax 请求时，任何复杂的应用都有陷入回调地狱的风险。\n\
