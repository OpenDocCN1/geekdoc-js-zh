  trans: "\nLinux 用户注意：Node.js 模块可以全局安装，这样它们在整个系统中都可用。然而，除非在 `npm` 命令前加上 `sudo`，否则大多数用户将没有权限写入全局目录。有许多[修复\
    \ npm 权限的选项](https://docs.npmjs.com/getting-started/fixing-npm-permissions)以及像\
    \ [nvm 可以提供的帮助](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)\
    \ 这样的工具可以使用，但我经常会更改默认目录，例如在 Ubuntu/Debian 系的平台上：\n\n```bash\ncd ~\nmkdir .node_modules_global\n\
    npm config set prefix=$HOME/.node_modules_global\nnpm install npm -g\n```\n\n\
    然后，将以下行添加到 `~/.bashrc` 的末尾：\n\n```bash\nexport PATH=\"$HOME/.node_modules_global/bin:$PATH\"\
    \n```\n\n并使用以下命令更新：\n\n```bash\nsource ~/.bashrc\n```\n\n### 步骤 2：全局安装 Gulp\n\n\
    全局安装 Gulp 命令行界面，以便可以在任何项目文件夹中运行 `gulp` 命令：\n\n```bash\nnpm install gulp-cli -g\n\
    ```\n\n使用以下命令验证 Gulp 是否已安装：\n\n```bash\ngulp -v\n```\n\n### 步骤 3：配置您的项目\n\nNode.js\
    \ 项目注意：如果您已经有一个 `package.json` 配置文件，可以跳过此步骤。\n\n假设您在 `project1` 文件夹中有一个新项目或现有项目。进入该文件夹并用\
    \ npm 进行初始化：\n\n```bash\ncd project1\nnpm init\n```\n\n您将被询问一系列问题 - 输入值或按回车键接受默认值。完成后将创建一个\
    \ `package.json` 文件，其中存储了您的 `npm` 配置设置。\n\nGit 用户注意：Node.js 将模块安装在 `node_modules`\
    \ 文件夹中。您应该将其添加到 `.gitignore` 文件中，以确保它们不会被提交到仓库中。当将项目部署到另一台电脑时，您可以运行 `npm install`\
    \ 来恢复它们。\n\n在本文的剩余部分，我们假设您的项目文件夹包含以下子文件夹：\n\n`src`\n文件夹：预处理过的源文件\n它包含进一步的子文件夹：\n\
    * `html` - HTML 源文件和模板\n* `images` — 原始未压缩图像\n* `js` — 多个预处理过的脚本文件\n* `scss` —\
    \ 多个预处理过的 Sass `.scss` 文件\n\n`build`\n文件夹：编译/处理后的文件\nGulp 将根据需要创建文件和子文件夹：\n* `html`\
    \ - 编译后的静态 HTML 文件\n* `images` — 压缩后的图像\n* `js` — 单个合并并压缩的 JavaScript 文件\n* `css`\
    \ — 单个编译并压缩的 CSS 文件\n\n您的项目几乎肯定会有所不同，但下面的示例将使用此结构。\n\n提示：如果您在使用类 Unix 系统，并且只想跟本教程操作，可以使用以下命令重新创建文件夹结构：\n\
    \n```bash\nmkdir -p src/{html,images,js,scss} build/{html,images,js,css}\n```\n\
    \n### 步骤 4：本地安装 Gulp\n\n现在您可以使用以下命令在您的项目文件夹中安装 Gulp：\n\n```bash\nnpm install gulp\
    \ --save-dev\n```\n\n这会将 Gulp 安装为开发依赖项，并相应地更新 `package.json` 中的 `\"devDependencies\"\
    ` 部分。在教程的剩余部分中，我们假设 Gulp 和所有插件都是开发依赖项。\n\n#### 备用部署选项\n\n当操作系统中的环境变量 `NODE_ENV`\
    \ 设置为 `production` 时，不会安装开发依赖项。您通常会在生产服务器上使用 Mac/Linux 命令执行此操作：\n\n```bash\nexport\
    \ NODE_ENV=production\n```\n\n或在 Windows 上：\n\n```bash\nset NODE_ENV=production\n\
    ```\n\n本教程假设您的资产将编译到 `build` 文件夹，并提交到您的 Git 仓库或直接上传到服务器。然而，如果您想更改创建它们的方式，在在生产服务器上构建资产可能更合适，例如：HTML、CSS\
    \ 和 JavaScript 文件在生产环境中经过了压缩，但在开发环境中没有。在这种情况下，请对 Gulp 和所有插件使用 `--save` 选项，即：\n\
    \n```bash\nnpm install gulp --save\n```\n\n这会将 Gulp 设置为 `package.json` 中 `\"dependencies\"\
    ` 部分的应用程序依赖项。它会在您输入 `npm install` 时安装，并可以在项目部署的任何地方运行。您可以从仓库中删除 `build` 文件夹，因为这些文件可以在需要时任何平台上创建。\n\
    \n### 步骤 4：创建 Gulp 配置文件\n\n在项目文件夹的根目录下创建一个新的 `gulpfile.js` 配置文件。添加一些基础代码开始开始：\n\
    \n```javascript\n// Gulp.js configuration\nvar\n  // modules\n  gulp = require('gulp'),\n\
    \  // development mode?\n  devBuild = (process.env.NODE_ENV !== 'production'),\n\
    \  // folders\n  folder = {\n    src: 'src/',\n    build: 'build/'\n  }\n;\n```\n\
    \nNode.js 项目注意：如果您已经有一个 `package.json` 配置文件，可以跳过此步骤。\n\n假设您在 `project1` 文件夹中有一个新项目或现有项目。进入该文件夹并用\
    \ npm 进行初始化：\n\n```bash\ncd project1\nnpm init\n```\n\n您将被询问一系列问题 - 输入值或按回车键接受默认值。完成后将创建一个\
    \ `package.json` 文件，其中存储了您的 `npm` 配置设置。\n\nGit 用户注意：Node.js 将模块安装在 `node_modules`\
    \ 文件夹中。您应该将其添加到 `.gitignore` 文件中，以确保它们不会被提交到仓库中。当将项目部署到另一台电脑时，您可以运行 `npm install`\
    \ 来恢复它们。\n\n在本文的剩余部分，我们假设您的项目文件夹包含以下子文件夹：\n\n`src`\n文件夹：预处理过的源文件\n它包含进一步的子文件夹：\n\
    * `html` - HTML 源文件和模板\n* `images` — 原始未压缩图像\n* `js` — 多个预处理过的脚本文件\n* `scss` —\
    \ 多个预处理过的 Sass `.scss` 文件\n\n`build`\n文件夹：编译/处理后的文件\nGulp 将根据需要创建文件和子文件夹：\n* `html`\
    \ - 编译后的静态 HTML 文件\n* `images` — 压缩后的图像\n* `js` — 单个合并并压缩的 JavaScript 文件\n* `css`\
    \ — 单个编译并压缩的 CSS 文件\n\n您的项目几乎肯定会有所不同，但下面的示例将使用此结构。\n\n提示：如果您在使用类 Unix 系统，并且只想跟本教程操作，可以使用以下命令重新创建文件夹结构：\n\
    \n```bash\nmkdir -p src/{html,images,js,scss} build/{html,images,js,css}\n```\n\
    \n### 步骤 5：创建 Gulp 任务\n\nGulp 提供了三个主要方法：\n* `gulp.task` - 定义新任务。\n* `gulp.src`\
    \ - 设置源。\n* `gulp.dest` - 设置目标。\n\n图像任务\n\n此示例演示了如何压缩图像。为了实现这一点，我们需要 `gulp-newer`\
    \ 和 `gulp-imagemin`。从命令行使用 save-dev 安装它们。\n\n现在我们可以在 `gulpfile.js` 顶部引用这两个模块：\n\
    \n```javascript\n// Gulp.js configuration\nvar\n  // modules\n  gulp = require('gulp'),\n\
    \  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n```\n\
    \n现在我们可以在 `gulpfile.js` 的末尾定义图像处理任务：\n\n```javascript\n// image processing\ngulp.task('images',\
    \ function() {\n  var out = folder.build + 'images/';\n  return gulp.src(folder.src\
    \ + 'images/**/*')\n    .pipe(newer(out))\n    .pipe(imagemin({optimizationLevel:\
    \ 5}))\n    .pipe(gulp.dest(out));\n});\n```\n\n保存 `gulpfile.js` 并在项目 `src/images`\
    \ 文件夹中放置一些图像，然后从命令行运行该任务：\n\n```bash\ngulp images\n```\n\n"
- fmt: "\n```\nFinished 'imagemin' in 5.71 ms\ngulp-imagemin: image1.png (saved 48.7\
    \ kB)\ngulp-imagemin: image2.jpg (saved 36.2 kB)\ngulp-imagemin: image3.svg (saved\
    \ 12.8 kB)\n```\n\nTry running `gulp images` again and nothing should happen because\
    \ no newer images exist.\n\n## HTML Task\n\nWe can now create a similar task which\
    \ copies files from the source HTML folder. We can safely minify our HTML code\
    \ to remove unnecessary whitespace and attributes using the [gulp-htmlclean](https://www.npmjs.com/package/gulp-htmlclean)\
    \ plug-in:\n\n```bash\nnpm install gulp-htmlclean --save-dev\n```\n\nwhich is\
    \ then referenced at the top of `gulpfile.js`:\n\n```javascript\nvar\n  // modules\n\
    \  gulp = require('gulp'),\n  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n\
    \  htmlclean = require('gulp-htmlclean'),\n```\n\nWe can now create an `html`\
    \ task at the end of `gulpfile.js`:\n\n```javascript\n// HTML processing\ngulp.task('html',\
    \ ['images'], function() {\n  var\n    out = folder.build + 'html/',\n    page\
    \ = gulp.src(folder.src + 'html/**/*')\n      .pipe(newer(out));\n  // minify\
    \ production code\n  if (!devBuild) {\n    page = page.pipe(htmlclean());\n  }\n\
    \  return page.pipe(gulp.dest(out));\n});\n```\n\nThis reuses `gulp-newer` and\
    \ introduces a couple of concepts:\n\n1. The `[images]` argument states that our\
    \ `images` task must be run before processing the HTML (the HTML is likely to\
    \ reference images). Any number of dependent tasks can be listed in this array\
    \ and all will complete before the task function runs.\n2. We only pipe the HTML\
    \ through `gulp-htmlclean` if `NODE_ENV` is set to `production`. Therefore, the\
    \ HTML remains uncompressed during development which may be useful for debugging.\n\
    \nSave `gulpfile.js` and run `gulp html` from the command line. Both the `html`\
    \ and `images` tasks will run.\n\n## JavaScript Task\n\nToo easy for you? Let's\
    \ process all our JavaScript files by building a basic module bundler. It will:\n\
    \n1. ensure dependencies are loaded first using the [gulp-deporder](https://www.npmjs.com/package/gulp-deporder)\
    \ plug-in. This analyses comments at the top of each script to ensure correct\
    \ ordering e.g. `// requires: defaults.js lib.js`.\n2. concatenate all script\
    \ files into a single `main.js` file using [gulp-concat](https://www.npmjs.com/package/gulp-concat),\
    \ and\n3. remove all `console` and `debugging` statements with [gulp-strip-debug](https://www.npmjs.com/package/gulp-strip-debug)\
    \ and minimize code with [gulp-uglify](https://www.npmjs.com/package/gulp-uglify).\
    \ This step will only occur when running in production mode.\n\nInstall the plugins:\n\
    \n```bash\nnpm install gulp-deporder gulp-concat gulp-strip-debug gulp-uglify\
    \ --save-dev\n```\n\nReference them at the top of `gulpfile.js`:\n\n```javascript\n\
    var\n  ...\n  concat = require('gulp-concat'),\n  deporder = require('gulp-deporder'),\n\
    \  stripdebug = require('gulp-strip-debug'),\n  uglify = require('gulp-uglify'),\n\
    ```\n\nThen add a new `js` task:\n\n```javascript\n// JavaScript processing\n\
    gulp.task('js', function() {\n  var jsbuild = gulp.src(folder.src + 'js/**/*')\n\
    \    .pipe(deporder())\n    .pipe(concat('main.js'));\n  if (!devBuild) {\n  \
    \  jsbuild = jsbuild\n      .pipe(stripdebug())\n      .pipe(uglify());\n  }\n\
    \  return jsbuild.pipe(gulp.dest(folder.build + 'js/'));\n});\n```\n\nSave then\
    \ run `gulp js` to watch the magic!\n\n## CSS Task\n\nFinally, let’s create a\
    \ CSS task which compiles `.scss` files to a single `.css` file using [gulp-sass](https://www.npmjs.com/package/gulp-sass).\
    \ This is a Gulp plug-in for [node-sass](https://www.npmjs.com/package/node-sass)\
    \ which binds to the super-fast [Sass C/C++ engine](http://sass-lang.com/libsass)\
    \ (you't need to install Ruby). We'll presume your Sass file `scss/main.scss`\
    \ is responsible for loading all partials.\n\nOur task will also utilize [PostCSS](http://postcss.org/)\
    \ via the [gulp-postcss](https://github.com/postcss/gulp-postcss) plug-in. PostCSS\
    \ requires its own set of plugins we'll install:\n\n* [postcss-assets](https://www.npmjs.com/package/postcss-assets)\
    \ to manage assets. This allows us to use properties such as `background('image.png')`\
    \ to resolve paths or `background('image.png')` to inline data-encoded images.\n\
    * [autoprefixer](https://www.npmjs.com/package/autoprefixer) to automatically\
    \ add vendor prefixes to CSS properties.\n* [css-mqpacker](https://www.npmjs.com/package/css-mqpacker)\
    \ to pack multiple references to the same media query into a single rule.\n* [cssnano](https://www.npmjs.com/package/cssnano)\
    \ to minify the CSS code when running in production.\n\nFirst, install all the\
    \ modules:\n\n```bash\nnpm install gulp-sass gulp-postcss postcss-assets autoprefixer\
    \ css-mqpacker cssnano --save-dev\n```\n\nand reference them at the top of `gulpfile.js`:\n\
    \n```javascript\nvar\n  ...\n  sass = require('gulp-sass'),\n  postcss = require('gulp-postcss'),\n\
    \  assets = require('postcss-assets'),\n  autoprefixer = require('autoprefixer'),\n\
    \  mqpacker = require('css-mqpacker'),\n  cssnano = require('cssnano'),\n```\n\
    \nWe can now create a new `css` task at the end of `gulpfile.js`. Note the `images`\
    \ task is set as a dependency because the `postcss-assets` plug-in can reference\
    \ images during the build process. In addition, most plugins can be passed arguments\
    \ - refer to their documentation for more information:\n\n```javascript\n// CSS\
    \ processing\ngulp.task('css', ['images'], function() {\n  var postCssOpts = [\n\
    \    assets({ loadPaths: ['images/'] }),\n    autoprefixer({ browsers: ['last\
    \ 2 versions', '> 2%'] }),\n    mqpacker\n  ];\n  if (!devBuild) {\n    postCssOpts.push(cssnano);\n\
    \  }\n  return gulp.src(folder.src + 'scss/main.scss')\n    .pipe(sass({\n   \
    \   outputStyle: 'nested',\n      imagePath: 'images/',\n      precision: 3,\n\
    \      errLogToConsole: true\n    }))\n    .pipe(postcss(postCssOpts))\n    .pipe(gulp.dest(folder.build\
    \ + 'css/'));\n});\n```\n\nSave the file and run the task from the command line:\n\
    \n```bash\ngulp css\n```\n\n## Step 6: Automate Tasks\n\nWe've been running one\
    \ task at a time. We can run them all in one command by adding a new `run` task\
    \ to `gulpfile.js`:\n\n```javascript\n// run all tasks\ngulp.task('run', ['html',\
    \ 'css', 'js']);\n```\n\nSave and enter `gulp run` at the command line to execute\
    \ all tasks. Note I omitted the `images` task because it's already set as a dependency\
    \ for the `html` and `css` tasks.\n\nIs this still too much hard work? Gulp offers\
    \ another method - `gulp.watch` - which can monitor your source files and run\
    \ an appropriate task whenever a file is changed. The method is passed a folder\
    \ and a list of tasks to execute when a change occurs. Let's create a new `watch`\
    \ task at the end of `gulpfile.js`:\n\n```javascript\n// watch for changes\ngulp.task('watch',\
    \ function() {\n  // image changes\n  gulp.watch(folder.src + 'images/**/*', ['images']);\n\
    \  // html changes\n  gulp.watch(folder.src + 'html/**/*', ['html']);\n  // javascript\
    \ changes\n  gulp.watch(folder.src + 'js/**/*', ['js']);\n  // css changes\n \
    \ gulp.watch(folder.src + 'scss/**/*', ['css']);\n});\n```\n\nRather than running\
    \ `gulp watch` immediately, let's add a default task:\n\n```javascript\n// default\
    \ task\ngulp.task('default', ['run', 'watch']);\n```\n\nSave `gulpfile.js` and\
    \ enter `gulp` at the command line. Your images, HTML, CSS and JavaScript will\
    \ all be processed then Gulp will remain active watching for updates and re-running\
    \ tasks as necessary. Hit Ctrl/Cmd + C to abort monitoring and return to the command\
