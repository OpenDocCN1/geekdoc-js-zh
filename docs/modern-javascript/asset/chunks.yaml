  trans: "\n\n你可以通过这篇 [Yaphi Berhanu 的快速贴士](https://www.sitepoint.com/add-remove-css-class-vanilla-js/)阅读关于如何修改类的更深入讨论。元素属性可以像任何其他对象的属性一样被访问。\n\
    \n```javascript\n// 获取属性值\nconst value = myElement.value\n\n// 将属性设置为元素的一个属性\n\
    myElement.value = 'foo'\n\n// 使用 Object.assign() 设置多个属性\nObject.assign(myElement,\
    \ {\n  value: 'foo',\n  id: 'bar'\n})\n\n// 移除属性\nmyElement.value = null\n```\n\
    \n请注意，还有 `.getAttibute()`、`.setAttribute()` 和 `.removeAttribute()` 方法。这些方法直接修改元素的\
    \ HTML 属性（而不是 DOM 属性），从而导致浏览器重绘（你可以通过浏览器的开发工具检查元素来观察这些变化）。这种浏览器重绘不仅比仅设置 DOM 属性更耗费更多资源，而且这些方法还可能导致[意外的结果](https://developer.mozilla.org/en-US/docs/Web/API/Element/setAttribute#Notes)。\n\
    \n作为经验法则，只有当属性没有对应的 DOM 属性（例如 `colspan`）时，才使用它们；或者如果你真的想“持久化”这些更改到 HTML 中（例如，在克隆元素或修改其父元素的\
    \ `.innerHTML` 时保留它们——参见第 3 部分）。\n\n## 添加 CSS 样式\n\nCSS 规则可以像其他属性一样应用；但请注意，属性在\
    \ JavaScript 中是驼峰命名的：\n\n```javascript\nmyElement.style.marginLeft = '2em'\n```\n\
    \n如果我们需要某些值，可以通过 `.style` 属性获取这些值。然而，这只会带给我们显式应用的样式。要获取计算后的值（computed values），我们可以使用\
    \ `.window.getComputedStyle()`。它接收元素并返回一个 [CSSStyleDeclaration](https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleDeclaration)，其中包含了元素本身的样式以及继承自父元素的样式：\n\
    \n```javascript\nwindow.getComputedStyle(myElement).getPropertyValue('margin-left')\n\
    ```\n\n## 修改 DOM\n\n我们可以像这样移动元素：\n\n```javascript\n// 将 element1 作为 element2 的最后一个子节点\n\
    element1.appendChild(element2)\n\n// 将 element2 插入作为 element1 的子节点，位于 element3\
    \ 之前\nelement1.insertBefore(element2, element3)\n```\n\n如果我们不想移动元素而是想插入一个副本，可以这样克隆它：\n\
    \n```javascript\n// 创建克隆\nconst myElementClone = myElement.cloneNode()\nmyParentElement.appendChild(myElementClone)\n\
    ```\n\n`.cloneNode()` 方法可选地接受一个布尔值作为参数；如果设置为 true 将创建一个深拷贝，这意味着它的子元素也会被克隆。\n\n\
    当然，我们也可以完全创建新的元素或文本节点：\n\n```javascript\nconst myNewElement = document.createElement('div')\n\
    const myNewTextNode = document.createTextNode('some text')\n```\n\n然后我们可以像上面所示插入它们。如果我们想删除一个元素，不能直接删除，但可以从父元素中移除子元素，如下：\n\
    \n```javascript\nmyParentElement.removeChild(myElement)\n```\n\n这给了我们一个很好的变通方法，意味着我们可以通过引用其父元素来间接删除一个元素：\n\
    \n```javascript\nmyElement.parentNode.removeChild(myElement)\n```\n\n## 元素属性\n\
    \n每个元素还有 `.innerHTML` 和 `.textContent` 属性（以及 `.innerText`，它与 `.textContent` 相似，但有一些[重要的差异](http://perfectionkills.com/the-poor-misunderstood-innerText/)）。它们分别持有\
    \ HTML 内容和纯文本内容。这些是可写的，意味着我们可以直接修改元素及其内容：\n\n```javascript\n// 设置内部 HTML\nmyElement.innerHTML\
    \ = `\n  <div>\n    <p>Hello World</p>\n  </div>\n`\n\n// 设置文本内容\nmyElement.textContent\
    \ = 'Hello World'\n```\n\n像上面所示向 HTML 附加标记通常是个坏主意，因为我们会丢失任何 [DocumentFragment](https://developer.mozilla.org/en-US/docs/Web/API/DocumentFragment)\
    \ 更改。为了避免这种性能问题，我们可以首先在片段中组装：\n\n```javascript\nconst fragment = document.createDocumentFragment()\n\
    // ... 操作 fragment\n```\n\n## 监听事件\n\n这可能是绑定事件的最佳方法：\n\n```javascript\nmyElement.onclick\
    \ = function (event) {\n  console.log(event.type)\n}\n```\n\n但通常应该避免这样做。在这里，`.onclick`\
    \ 是元素的一个属性，你可以修改它，但不能用它来添加监听器。相反，我们可以使用强大的 `.addEventListener()` 方法来添加多个事件。它接受三个参数：事件类型（例如\
    \ `click`）、当事件发生时被调用的函数（该函数将接收一个对象）以及可选的配置对象。\n\n```javascript\nmyElement.addEventListener('click',\
    \ function (event) {\n  console.log(event.type)\n})\nmyElement.addEventListener('click',\
    \ function (event) {\n  console.log(event.type + ' again')\n})\n```\n\n在监听函数内部，`event.target`\
    \ 指向触发事件元素（`this` 也是如此，除非我们使用了[箭头函数](https://www.sitepoint.com/es6-arrow-functions-new-syntax/)）。因此你可以轻松地访问它的属性：\n\
    \n```javascript\n// 的 forms 属性是包含所有表单的数组\nconst myForm = document.forms[0]\nconst\
    \ myInputElements = myForm.querySelectorAll('input')\nArray.from(myInputElements).forEach(el\
    \ => {\n  el.addEventListener('change', function (event) {\n    console.log(event.target.value)\n\
    \  })\n})\n```\n\n### 防止默认行为\n\n请注意，`event` 在监听函数内部总是可用的，但在需要时显式传递它仍然是一个良好的习惯（当然，我们可以为它任意命名）。在不详述\
    \ [Event](https://developer.mozilla.org/en-US/docs/Web/API/Event) 接口本身的情况下，一个特别值得注意的方法是\
    \ `.preventDefault()`，它将……阻止浏览器的默认行为，例如跳转链接。另一个常见的用例是在客户端表单验证失败时，条件地阻止提交表单。\n\n\
    ```javascript\nmyForm.addEventListener('submit', function (event) {\n  const name\
    \ = this.querySelector('#name')\n  if (name.value === 'Donald Duck') {\n    alert('你在开玩笑吗！')\n\
    \    event.preventDefault()\n  }\n})\n```\n\n"
- fmt: "\nAnother important event method is `.stopPropagation()`, which will prevent\
    \ the event from bubbling up the DOM. This means that if we have a propagation-stopping\
    \ click listener (say) on an element, and another click listener on one of its\
    \ parents, a click event that gets triggered on the child element won't get triggered\
    \ on the parent — otherwise, it would get triggered on both.\n\nNow `.addEventListener()`\
    \ takes an optional config object as a 3rd argument, which can have any of the\
    \ following boolean properties (all of which default to `false`):\n\n- `capture`:\
    \ The event will be triggered on the element before any other element beneath\
    \ it in the DOM (event capturing and bubbling is an article in its own right,\
    \ for more details have a look [here](http://javascript.info/tutorial/bubbling-and-capturing))\n\
    - `once`: As you might guess, this indicates that the event will get triggered\
    \ only once\n- `passive`: This means that `event.preventDefault()` will be ignored\
    \ (and usually yield a warning in the console)\n\nThe most common option is `.capture`;\
    \ in fact, it is so common that there's a shorthand for this: instead of specifying\
    \ it in the config object, you can just pass in a boolean here:\n\n```\nmyElement.addEventListener(type,\
    \ listener, true)\n```\n\nEvent listeners can be removed using `.removeEventListener()`,\
    \ which takes the event type and a reference to the callback function to be removed;\
    \ for example, the `once` option could also be implemented like\n\n```javascript\n\
    myElement.addEventListener('change', function listener (event) {\n  console.log(event.type\
    \ + ' got triggered on ' + this)\n  this.removeEventListener('change', listener)\n\
    })\n```\n\n### Event delegation\n\nAnother useful pattern is event delegation:\
    \ say we have a form and want to add a `change` event listener to all of its `input`\
    \ children. One way to do so would be iterating over them using `myForm.querySelectorAll('input')`\
    \ as shown above. However, this is unnecessary when we can just as well add it\
    \ to the form itself and check the contents of `event.target`.\n\n```javascript\n\
    myForm.addEventListener('change', function (event) {\n  const target = event.target\n\
    \  if (target.matches('input')) {\n    console.log(target.value)\n  }\n})\n```\n\
    \nAnother advantage of this pattern is that it automatically accounts for dynamically\
    \ inserted children as well, without having to bind new listeners to each.\n\n\
    ### Animation\n\nUsually, the cleanest way to perform animations is to apply CSS\
    \ classes with a `transition` property, or use CSS `@keyframes`. But if you need\
    \ more flexibility (e.g. for a game), this can be done with JavaScript as well.\n\
    \nThe naive approach would be to have a `window.setTimeout()` function call itself\
    \ until the desired animation is completed. However, this inefficiently forces\
    \ rapid document reflows; and this layout thrashing can quickly lead to stuttering,\
    \ expecially on mobile devices. Intead we can sync the updates using `window.requestAnimationFrame()`\
    \ to schedule all current changes to the next browser repaint frame. It takes\
    \ a callback as argument which receives the current (high res) timestamp:\n\n\
    ```javascript\nconst start = window.performance.now()\nconst duration = 2000\n\
    window.requestAnimationFrame(function fadeIn (now)) {\n  const progress = now\
    \ - start\n  myElement.style.opacity = progress / duration\n  if (progress < duration)\
    \ {\n    window.requestAnimationFrame(fadeIn)\n  }\n}\n```\n\nThis way we can\
    \ achieve very smooth animations. For a more detailed discussion, please have\
    \ a look at [this](https://www.sitepoint.com/quick-tip-game-loop-in-javascript/)\
    \ article by Mark Brown.\n\n### Writing your own helper methods\n\nTrue, always\
    \ having to iterate over elements to do something with them may be rather cumbersome\
    \ compared to jQuery's concise and chainable `$('.foo').css({color: 'red'})` syntax.\
    \ So why not simply write our own shorthand methods for things like this?\n\n\
    ```javascript\nconst $ = function $ (selector, context = document) {\n  const\
    \ elements = Array.from(context.querySelectorAll(selector))\n  return {\n    elements,\n\
    \    html(newHtml) {\n      this.elements.forEach(element => {\n        element.innerHTML\
    \ = newHtml\n      })\n      return this\n    },\n    css(newCss) {\n      this.elements.forEach(element\
    \ => {\n        Object.assign(element.style, newCss)\n      })\n      return this\n\
    \    },\n    on(event, handler, options) {\n      this.elements.forEach(element\
    \ => {\n        element.addEventListener(event, handler, options)\n      })\n\
    \      return this\n    }\n  }\n}\n```\n\nThus we have a super slim DOM-library\
    \ with only the methods that we need, and without the backwards-compatibility.\
    \ Usually we'd have those methods in our prototype. Here's a (somewhat more elaborate)\
    \ [gist](https://gist.github.com/SitePoint/4f664d62a87ae60b0784ceeffd) with some\
    \ ideas how to implement such helpers. Alternatively, we might keep it as simple\
    \ as\n\n```javascript\nconst $ = (selector, context = document) => context.querySelector(selector)\n\
    const $$ = (selector, context = document) => context.querySelectorAll(selector)\n\
    const html = (nodeList, newHtml) => {\n  Array.from(nodeList).forEach(element\
    \ => {\n    element.innerHTML = newHtml\n  })\n}\n// And so on...\n```\n\n###\
    \ Demo\n\nTo round this article off, here's a [CodePen which demonstrates many\
    \ of the concepts above to implement a simple lightbox](http://codepen.io/SitePoint/pen/aJaggB/).\n\
    \n### Conclusion\n\nI hope I could show that DOM manipulation with plain JavaScript\
    \ is not rocket science and that in fact, many jQuery methods have direct equivalents\
    \ in the native DOM API. This means that for some use cases (such as a navigation\
    \ menu or a modal popup), the additional overhead of a DOM library may be out\
    \ of place.\n\nAnd while it's true that some parts of the native API are verbose\
    \ or inconvenient (such as having to iterate over node lists all the time), we\
    \ can easily write our own helper functions to abstract away repetitive tasks.\n\
    \n# Chapter 4: A Beginner's Guide to Webpack 2 and Module Bundling\n\nby Mark\
    \ Brown\n\n[Webpack](https://webpack.js.org/) has become one of the most important\
    \ tools for modern web development. Primarily it's a module bundler for your JavaScript\
    \ but it can be taught to transform all of your frontend assets like HTML and\
    \ CSS, even images. It can give you more control over the number of HTTP requests\
    \ your app is making and allows you to use other flavors of those assets (Jade,\
    \ Sass & ES6 for example). Webpack also allows you to easily consume packages\
    \ from npm.\n\nThis article is aimed at who who are new to webpack and will cover\
    \ initial setup and configuration, modules, loaders, plugins, code splitting and\
    \ hot module replacement. If you find video tutorials helpful I can highly recommend\
    \ Glen Maddern's [Webpack from First Principles](https://www.youtube.com/watch?v=WQue1AN9YU)\
