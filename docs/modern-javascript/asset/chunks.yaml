  trans: "\n\n但是，极坐标面积图是我涵盖的第一个无法用于比较两个数据集的图表。之前的示例是对比两个等长度数组的不同方法，而极坐标图（以及下一个将介绍的饼图）只视觉化单组数字。\n\
    \n以下是此示例的完整代码：\n\n```javascript\nvar ctx = document.getElementById(\"myChart\"\
    ).getContext('2d');\nvar myChart = new Chart(ctx, {\n  type: 'polarArea',\n  data:\
    \ {\n    labels: [\"M\", \"T\", \"W\", \"T\", \"F\", \"S\", \"S\"],\n    datasets:\
    \ [{\n      backgroundColor: [\n        \"#2ecc71\",\n        \"#3498db\",\n \
    \       \"#95a5a6\",\n        \"#9b59b6\",\n        \"#f1c40f\",\n        \"#e74c3c\"\
    ,\n        \"#34495e\"\n      ],\n      data: [12, 19, 3, 17, 28, 24, 7]\n   \
    \ }]\n  }\n});\n```\n\n唯一的新代码是一个 `backgroundColor` 数组。每个颜色与相同索引的 `data` 元素匹配。\n\
    \n要了解更多关于极坐标面积图的信息，请[查看文档](http://www.chartjs.org/docs/#polar-area-chart)。\n\n\
    ## 饼图与环甜图\n\n你现在可能已经猜到这部分了。将：\n\n`type: 'polarArea'`\n\n改为：\n\n`type: 'pie'`\n\
    \n`type` 属性是 Chart.js 的关键。记得从折线图转换为柱状图和雷达图有多简单吗？其实，极坐标图、饼图和环甜图同样相互转换的。通过这一个更改，我们就可以从极坐标图切换到饼图。\n\
    \n5. SitePoint 提供的饼图 ([@SitePoint](http://codepen.io/SitePoint)) 享于 [CodePen](http://codepen.io)。\n\
    \n![](img/00001.jpg)\n\n对于环甜图：\n\n`type: 'pie'`\n改为：\n\n`type: 'doughnut'`\n\n\
    6. SitePoint 提供的环甜图 ([@SitePoint](http://codepen.io/SitePoint)) 享于 [CodePen](http://codepen.io)。\n\
    \n![](img/00017.jpg)\n\n要了解更多关于饼图和环甜图的信息，请[查看文档](http://www.chartjs.org/docs/#doughnut-pie-chart)。\n\
    \n以下是饼图的完整代码：\n\n```javascript\nvar ctx = document.getElementById(\"myChart\"\
    ).getContext('2d');\nvar myChart = new Chart(ctx, {\n  type: 'pie',\n  data: {\n\
    \    labels: [\"M\", \"T\", \"W\", \"T\", \"F\", \"S\", \"S\"],\n    datasets:\
    \ [{\n      backgroundColor: [\n        \"#2ecc71\",\n        \"#3498db\",\n \
    \       \"#95a5a6\",\n        \"#9b59b6\",\n        \"#f1c40f\",\n        \"#e74c3c\"\
    ,\n        \"#34495e\"\n      ],\n      data: [12, 19, 3, 17, 28, 24, 7]\n   \
    \ }]\n  }\n});\n```\n\n环甜图有一个有趣的属性叫做 `cutPercentage`，它决定了中心空洞的大小。为了深入了解这一点，我首先需要向你展示一些为了帮助你学习而我忽略的\
    \ Chart.js 内容。\n\n## 配置 Chart.js\n\n在之前的每个示例中，我们都使用了以下格式：\n\n```javascript\nvar\
    \ myChart = new Chart(ctx, {\n  type: // 图表类型\n  data: // 图表数据\n});\n```\n\n但是第三个属性叫做\
    \ `options`。它紧位于 `data` 下方。\n\n```javascript\nvar myChart = new Chart(ctx, {\n\
    \  type: // 图表类型\n  data: // 图表数据\n  options: // 图表选项\n});\n```\n\n现在你已经熟悉了 Chart.js\
    \ 的基础，是时候介绍一些关于 `options` 的技巧了。\n\n### 标题\n通过添加这组选项可以轻松地为任何 Chart.js 添加标题。原生标题非常棒，但值得注意的是，它们大多是静态且不变的。当我们尝试添加自定义事件时，这一点将会变得重要。\n\
    \n```javascript\noptions: {\n  title: {\n    display: true,\n    text: '自定义标题'\n\
    \  }\n}\n```\n\n### 环甜空洞\n`cutPercentage` 属性是一个 0 到 50 之间的值。饼图只是 `cutPercentage`\
    \ 为 0 的环甜图。\n\n```javascript\noptions: {\n  cutPercentage: 10,\n}\n```\n\n###\
    \ 堆叠柱状图\n如果你希望柱状图是堆叠的，只需在你的图表代码中添加以下一组选项：\n\n```javascript\noptions: {\n  scales:\
    \ {\n    yAxes: [{\n      stacked: true\n    }]\n  }\n}\n```\n\n每种图表类型都有许多选项供你挖掘。我鼓励你这样做。\n\
    \n### 处理事件\n如之前提到的，点击图例将切换与该图例相关的数据集。让我们用自己的功能增强它：\n\n```javascript\nvar original\
    \ = Chart.defaults.global.onClick;\nChart.defaults.global.onClick = function(e,\
    \ legendItem) {\n  // 在此处插入你的自定义功能\n  original.call(this, legendItem);\n};\n```\n\
    \n这段代码将 `Chart.defaults.global.onClick` 传递到变量中。`Chart.defaults.global.onClick`\
    \ 接收 `e` 和 `legendItem`。这段代码将 `Chart.defaults.global.onClick` 传递到变量中。`Chart.defaults.global.onClick`\
    \ 接收 `e` 和 `legendItem`。这段代码将 `Chart.defaults.global.onClick` 传递到变量中。`Chart.defaults.global.onClick`\
    \ 接收 `e` 和 `legendItem`。\n\n## 具体示例\n\n让我们增强之前的代码，这样当用户点击图例时，底部的说明会自动更新。换句话说，我们现在可以在\
    \ `onClick()` 之上添加任何想要的功能。例如，仪表板可能拥有 `apples` 和 `oranges` 的值。使用 Chart.js 创建交互式数据是简单的。\n\
    \n以下是代码\n\n```javascript\nvar labels = {\n  \"apples\": true,\n  \"oranges\":\
    \ true\n};\nvar caption = document.getElementById(\"caption\");\nvar update_caption\
    \ = function(legend) {\n  labels[legend.text] = legend.hidden;\n  var selected\
    \ = Object.keys(labels).filter(function(key) {\n    return labels[key];\n  });\n\
    \  var text = selected.length ? selected.join(\" \") : \"nothing\";\n  caption.innerHTML\
    \ = \"上方图表显示 \" + text;\n};\n```\n\n正如你所看到的，我们使用对象字面量来跟踪图例的状态。filter 过滤将返回所有值为\
    \ `true` 的键，我们用它来构建说明。\n\n## Chart.js 2.0 vs 1.0\n\n本文使用了 Chart.js 2.0 语法。Chart.js\
    \ 2.0 相对较新。2.0 和 1.0 最明显的区别在于如何声明图表。\n\n### 1.0\n```javascript\nvar LineChartDemo\
    \ = new Chart(ctx).Line(\n  //数据在此，\n  //选项在此\n);\n```\n\n### 2.0\n```javascript\n\
    var myChart = new Chart(ctx, {\n  type: 'line',\n  data: // 数据在此\n  options: //\
    \ 选项在此\n});\n```\n\n1.0 版本侧重于使用函数链来创建特定类型的图表，然后传入数据和选项。2.0 版本改变了这种方式，允许用户创建一个通用的图表对象，然后传入类型以及数据和选项。第二种方法更符合\
    \ Chart.js 的哲学，即尽可能的模块化和独立。\n\n7. SitePoint 提供的带有自定义 onClick() 的柱状图 ([@SitePoint](http://codepen.io/SitePoint))\
    \ 享于 [CodePen](http://codepen.io)。\n\n"
- fmt: "\nChart.js is a perfect match for rapid prototyping of simple charts. There\
    \ are eight main chart types, of which we have covered: `line`, `bar`, `radar`,\
    \ `polarArea`, `pie` and `doughnut`. These diverse charts cover most common ways\
    \ to visualize data, meaning that Chart.js is probably the only graphing library\
    \ you'll need for your next project.\n\nIf you want to learn more about Chart.js,\
    \ I highly recommend the docs, which you can find [on the Chart.js website](http://www.chartjs.org/).\n\
    \n# Chapter 10: Learning JavaScript Test-Driven Development by Example\n\nby James\
    \ Wright\n\nPeer reviewed by [Vildan Softic](https://www.sitepoint.com/author/vildansoftic).\n\
    \nYou're probably already familiar with automated testing and its benefits. Having\
    \ a set of tests for your application allows you to make changes to your code\
    \ with confidence, knowing that the tests have your back should you break anything.\
    \ It's possible to take things a step further and write your tests before you\
    \ write the code; a practice known as Test-driven development (TDD).\n\nIn this\
    \ tutorial, we will talk about what TDD is and what benefits it brings to you\
    \ as a developer. We'll use TDD to implement a form validator, which ensures that\
    \ any values input by the user conform to a specified set of rules.\n\n## TDD\
    \ in Node\n\nNote that this article will focus on testing frontend code. If you're\
    \ looking for something focused on the backend, be sure to check out our course:\
    \ [TestDriven Development in Node.js](https://www.sitepoint.com/premium/courses/test-driven-development-in-node-js-2932)\n\
    \n## What is TDD?\n\nTestdriven development is a programming methodology with\
    \ which one can tackle the design, implementation, and testing of units of code,\
    \ and to some extent the expected functionality of a program.\n\nComplementing\
    \ the [test-first approach of Extreme Programming](https://courses.csail.mit.edu/6.042/spring17/mcs.pdf),\
    \ in which developers write tests before implementing a feature or a unit, TDD\
    \ also facilitates the refactoring of code; this is commonly referred to as the\
    \ RedGreen-Refactor Cycle.\n\n![](images/00010.jpg)\n\n*   Write a failing test\
    \ - write a test that invokes your logic and assert that the correct behavior\
    \ is produced\n    *   In a unit test, this would be asserting the return value\
    \ of a function or verifying that a mocked dependency was called as expected\n\
    \    *   In a functional test, this would be ensuring that a UI or an API behaves\
    \ predictably across a number of actions\n*   Make the test pass - implement the\
    \ minimum amount of code that results in the test passing, and ensure that all\
    \ other tests continue to pass\n*   Refactor the implementation - update or rewrite\
    \ the implementation, without breaking any public contracts, to improve its quality\
    \ without breaking the new and existing tests\n\nI've used TDD to some extent\
    \ since I was introduced to it at the beginning of my career, but as I have progressed\
    \ to working on applications and systems with more complex requirements, I have\
    \ personally found the technique to be time-saving and conducive to the quality\
    \ and robustness of my work.\n\nBefore proceeding, it might be worth familiarizing\
    \ yourself with some of the various types of automated tests that can be written.\
    \ Eric Elliot [summarises them well](https://www.sitepoint.com/javascript-testing-unit-functional-integration/):\n\
    \n*   Unit tests - ensure that individual units of the app, such as functions\
    \ and classes, work as expected. Assertions test that said units return the expected\
    \ output for any given inputs\n*   Integration tests - ensure that unit collaborations\
    \ work as expected. Assertions may test an API, UI, or interactions that may result\
    \ in side-effects (such as database I/O, logging, etc…)\n*   End-to-end tests\
    \ - ensure that software works as expected from the user’s perspective and that\
    \ every unit behaves correctly in the overall scope of the system. Assertions\
    \ primarily test the user interface\n\n## Benefits of TestDriven Development\n\
    \n### Immediate test coverage\nBy writing test cases for a feature before its\
    \ implementation, code coverage is immediately guaranteed, plus behavioral bugs\
    \ can be caught earlier in the development lifecycle of a project. This, of course,\
    \ necessitates tests that cover all behaviors, including error handling, but one\
    \ should always practice TDD with this mindset.\n\n### Refactor with confidence\n\
    Referring to the redgreen-refactor cycle above, any changes to an implementation\
    \ can be verified by ensuring that the existing tests continue to pass. Writing\
    \ tests that run as quickly as possible will shorten this feedback loop; while\
    \ it's important to cover all possible scenarios, and execution time can vary\
    \ slightly between different computers, authoring lean and well-focused tests\
    \ will save time in the long term.\n\n### Design by contract\nTestdriven development\
    \ allows developers to consider how an API will be consumed, and how easy it is\
    \ to use, without having to worry about the implementation. Invoking a unit in\
    \ a test case essentially mirrors a call site in production, so the external design\
    \ can be modified before the implementation stage.\n\n### Avoid superfluous code\n\
    As long as one is frequently, or even automatically, running tests upon changing\
    \ the associated implementation, satisfying existing tests reduces the likelihood\
    \ of unnecessary additional code, arguably resulting in a codebase that's easier\
    \ to maintain and understand. Consequently, TDD helps one to follow the [KISS\
    \ (Keep it simple, stupid!) principle](https://en.wikipedia.org/wiki/KISS_principle).\n\
    \n### No dependence upon integration\nWhen writing unit tests, if one is conforming\
    \ to the required inputs, then units will behave as expected once integrated into\
    \ the codebase. However, integration tests should also be written to ensure that\
    \ the new code's call site is being invoked correctly.\n\nFor example, let's consider\
    \ the function below, which determines if a user is an:\n\n```javascript\n'use\
    \ strict'\nfunction isAdmin(id, users) {\n  const user = users.find(u => u.id\
    \ === id);\n  return user.isAdmin;\n}\n```\n\nRather than hard code the users,\
    \ we expect it as a parameter. This allows us to pass a prepulated array in our\
    \ test:\n\n```javascript\nconst testUsers = [\n  {\n    id: 1,\n    isAdmin: true\n\
    \  },\n  {\n    id: 2,\n    isAdmin: false\n  }\n];\n\nconst isAdmin = isAdmin(1,\
    \ testUsers);\n// TODO: assert isAdmin is true\n```\n\nThis approach allows the\
    \ unit to be implemented and tested in isolation from the rest of the system.\
    \ Once there are users in our database, we can integrate the unit and write integration\
    \ tests to verify that we are correctly passing the parameters.\n\n## TestDriven\
    \ Development With JavaScript\n\nWith the advent of full-stack software written\
    \ in JavaScript, a plethora of testing libraries has emerged that allow for the\
    \ testing of both client-side and server-side code; an example of such a library\
    \ is [Mocha](https://mochajs.org/), which we will be using in the exercise.\n\n\
    A good use case for TDD, in my opinion, is form validation; it is a somewhat complex\
    \ task that typically follows these steps:\n\n1.  Read the value from an `<input>`\
    \ that should be validated\n2.  Invoke a rule (e.g alphabetical, numeric) against\
    \ said value\n3.  If it is invalid, provide a meaningful error to the user\n4.\
    \  Repeat for the next validatable input\n\nThere is a [CodePen for this exercise](http://codepen.io/SitePoint/pen/NpZLzR)\
    \ that contains some boilerplate test code, as well as an empty `validateForm`\
    \ function. Please fork this before we start.\n\nOur form validation API will\
    \ take an instance of `HTMLFormElement` (`<form>`) and validate each input that\
    \ has a `data-validation` attribute, the possible values of which are:\n\n*  \
    \ `alphabetical` - any case-insensitive combination of the 26 letters of the English\
    \ alphabet\n*   `numeric` - any combination of digits between 0 and 9\n"
  raw: "Chart.js is a perfect match for rapid prototyping of simple charts. There\
    \ are eight main chart types, of which we have covered: `line`, `bar`, `radar`,\
    \ `polarArea`, `pie` and `doughnut`. These diverse charts cover most common ways\
    \ to visualize data, meaning that Chart.js is probably the only graphing library\
    \ you'll need for your next project.\n\nIf you want to learn more about Chart.js,\
    \ I highly recommend the docs, which you can find [on the Chart.js website](http://www.chartjs.org/).\n\
    \nChapter 10: Learning JavaScript Test-Driven Development by Example\n\nby James\
    \ Wright\n\nPeer reviewed by [Vildan Softic](https://www.sitepoint.com/author/vildansoftic).\n\
    \nYou're probably already familiar with automated testing and its benefits. Having\
    \ a set of tests for your application allows you to make changes to your code\
    \ with confidence, knowing that the tests have your back should you break anything.\
    \ It's possible to take things a step further and write your tests before you\
    \ write the code; a practice known as Test-driven development (TDD).\n\nIn this\
    \ tutorial, we will talk about what TDD is and what benefits it brings to you\
    \ as a developer. We'll use TDD to implement a form validator, which ensures that\
    \ any values input by the user conform to a specified set of rules.\n\nTDD in\
    \ Node\n\nNote that this article will focus on testing frontend code. If you're\
    \ looking for something focused on the backend, be sure to check out our course:\
    \ [TestDriven Development in Node.js](https://www.sitepoint.com/premium/courses/test-driven-development-in-node-js-2932)\n\
    \nWhat is TDD?\n\nTestdriven development is a programming methodology with which\
    \ one can tackle the design, implementation, and testing of units of code, and\
    \ to some extent the expected functionality of a program.\n\nComplementing the\
    \ [test-first approach of Extreme Programming](https://courses.csail.mit.edu/6.042/spring17/mcs.pdf),\
    \ in which developers write tests before implementing a feature or a unit, TDD\
    \ also facilitates the refactoring of code; this is commonly referred to as the\
    \ RedGreen-Refactor Cycle.\n\n![](images/00010.jpg) \n\n*   Write a failing test\
    \ - write a test that invokes your logic and assert that the correct behavior\
    \ is produced\n\n    *   In a unit test, this would be asserting the return value\
    \ of a function or verifying that a mocked dependency was called as expected\n\
    \n    *   In a functional test, this would be ensuring that a UI or an API behaves\
    \ predictably across a number of actions\n\n*   Make the test pass - implement\
    \ the minimum amount of code that results in the test passing, and ensure that\
    \ all other tests continue to pass\n\n*   Refactor the implementation - update\
    \ or rewrite the implementation, without breaking any public contracts, to improve\
    \ its quality without breaking the new and existing tests\n\nI've used TDD to\
    \ some extent since I was introduced to it at the beginning of my career, but\
    \ as I have progressed to working on applications and systems with more complex\
    \ requirements, I have personally found the technique to be time-saving and conducive\
    \ to the quality and robustness of my work.\n\nBefore proceeding, it might be\
    \ worth familiarizing yourself with some of the various types of automated tests\
    \ that can be written. Eric Elliot [summarises them well](https://www.sitepoint.com/javascript-testing-unit-functional-integration/):\n\
    \n*   Unit tests - ensure that individual units of the app, such as functions\
    \ and classes, work as expected. Assertions test that said units return the expected\
    \ output for any given inputs\n\n*   Integration tests - ensure that unit collaborations\
    \ work as expected. Assertions may test an API, UI, or interactions that may result\
    \ in side-effects (such as database I/O, logging, etc…)\n\n*   End-to-end tests\
    \ - ensure that software works as expected from the user’s perspective and that\
    \ every unit behaves correctly in the overall scope of the system. Assertions\
    \ primarily test the user interface\n\nBenefits of TestDriven Development\n\n\
    Immediate test coverage\n\nBy writing test cases for a feature before its implementation,\
    \ code coverage is immediately guaranteed, plus behavioral bugs can be caught\
    \ earlier in the development lifecycle of a project. This, of course, necessitates\
    \ tests that cover all behaviors, including error handling, but one should always\
    \ practice TDD with this mindset.\n\nRefactor with confidence\n\nReferring to\
    \ the redgreen-refactor cycle above, any changes to an implementation can be verified\
    \ by ensuring that the existing tests continue to pass. Writing tests that run\
    \ as quickly as possible will shorten this feedback loop; while it's important\
    \ to cover all possible scenarios, and execution time can vary slightly between\
    \ different computers, authoring lean and well-focused tests will save time in\
    \ the long term.\n\nDesign by contract\n\nTestdriven development allows developers\
    \ to consider how an API will be consumed, and how easy it is to use, without\
    \ having to worry about the implementation. Invoking a unit in a test case essentially\
    \ mirrors a call site in production, so the external design can be modified before\
    \ the implementation stage.\n\nAvoid superfluous code\n\nAs long as one is frequently,\
    \ or even automatically, running tests upon changing the associated implementation,\
    \ satisfying existing tests reduces the likelihood of unnecessary additional code,\
    \ arguably resulting in a codebase that's easier to maintain and understand. Consequently,\
    \ TDD helps one to follow the [KISS (Keep it simple, stupid!) principle](https://en.wikipedia.org/wiki/KISS_principle).\n\
    \nNo dependence upon integration\n\nWhen writing unit tests, if one is conforming\
    \ to the required inputs, then units will behave as expected once integrated into\
    \ the codebase. However, integration tests should also be written to ensure that\
    \ the new code's call site is being invoked correctly.\n\nFor example, let's consider\
    \ the function below, which determines if a user is an admin:\n\n`'use strict'`\n\
    \n`function isUserAdmin(id, users) {`\n\n`    const user = users.find(u => u.id === id);`\n\
    \n`    return user.isAdmin;`\n\n`}`\n\nRather than hard code the users data, we\
    \ expect it as a parameter. This allows us to pass a prepopulated array in our\
    \ test:\n\n`const testUsers = [`\n\n`    {`\n\n`        id: 1,`\n\n`        isAdmin: true`\n\
    \n`    },`\n\n`    {`\n\n`        id: 2,`\n\n`        isAdmin: false`\n\n`    }`\n\
    \n`];`\n\n`const isAdmin = isUserAdmin(1, testUsers);`\n\n`// TODO: assert isAdmin is true`\n\
    \nThis approach allows the unit to be implemented and tested in isolation from\
    \ the rest of the system. Once there are users in our database, we can integrate\
    \ the unit and write integration tests to verify that we are correctly passing\
    \ the parameters to the unit.\n\nTestDriven Development With JavaScript\n\nWith\
    \ the advent of full-stack software written in JavaScript, a plethora of testing\
    \ libraries has emerged that allow for the testing of both client-side and server-side\
    \ code; an example of such a library is [Mocha](https://mochajs.org/), which we\
    \ will be using in the exercise.\n\nA good use case for TDD, in my opinion, is\
    \ form validation; it is a somewhat complex task that typically follows these\
    \ steps:\n\n1.  Read the value from an `<input>` that should be validated\n\n\
    2.  Invoke a rule (e.g. alphabetical, numeric) against said value\n\n3.  If it\
    \ is invalid, provide a meaningful error to the user\n\n4.  Repeat for the next\
    \ validatable input\n\nThere is a [CodePen for this exercise](http://codepen.io/SitePoint/pen/NpZLzR)\
    \ that contains some boilerplate test code, as well as an empty `validateForm`\
    \ function. Please fork this before we start.\n\nOur form validation API will\
    \ take an instance of `HTMLFormElement` (`<form>`) and validate each input that\
    \ has a `data-validation` attribute, the possible values of which are:\n\n*  \
    \ `alphabetical` - any case-insensitive combination of the 26 letters of the English\
    \ alphabet\n\n*   `numeric` - any combination of digits between 0 and 9"
