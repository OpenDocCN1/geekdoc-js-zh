  raw: 'Before you pick any tool you need to answer two simple questions: "Is this
    a good tool per se?" and "Will it work well for my use case?" None of them mean
    anything on their own, so you always need to keep both of them in mind. All right,
    the questions might not be that simple, so we''ll try to break them down into
    smaller ones.


    Questions on the tool itself:


    *   How mature is it and who''s behind it?


    *   What kind of features does it have?


    *   What architecture, development paradigms, and patterns does it employ?


    *   What is the ecosystem around it?


    Questions for self-reflection:


    *   Will I and my colleagues be able to learn this tool with ease?


    *   Does is fit well with my project?


    *   What is the developer experience like?


    Using this set of questions you can start your assessment of any tool and we''ll
    base our comparison of React and Angular on them as well.


    There''s another thing we need to take into account. Strictly speaking, it''s
    not exactly fair to compare Angular to React, since Angular is a full-blown feature-rich
    framework, and React just a UI component library. To even the odds, we''ll talk
    about React in conjunction with some of the libraries often used with it.


    Maturity


    An important part of being a skilled developer is being able to keep the balance
    between established, time-proven approaches and evaluating new bleeding-edge tech.
    As a general rule, you should be careful when adopting tools which have not yet
    matured due to certain risks:


    *   The tool might be buggy and unstable.


    *   It might be unexpectedly abandoned by the vendor.


    *   There might not be a large knowledge base or community available in case you
    need help.


    Both React and Angular come from good families, so it seems that we can be confident
    in this regard.


    React


    React is developed and maintained by Facebook and used in their own products,
    [including Instagram and WhatsApp](https://github.com/facebook/react/wiki/sites-using-react).
    It has been around for roughly [three and a half years](https://facebook.github.io/react/blog/2013/06/05/why-react.html)
    now, so it''s not exactly new. It''s also [one of the most popular](https://github.com/search?q=stars:%3E1&s=stars&type=Repositories)
    projects on GitHub with about 60,000 stars at the time of writing. Sounds good
    to me.


    Angular


    Angular (version 2 and above) has been around less then React, but if you count
    in the history of its predecessor, AngularJS, the picture evens out. It''s maintained
    by Google and used in [AdWords and Google Fiber](http://angularjs.blogspot.com/2015/11/how-google-uses-angular-2-with-dart.html).
    Since AdWords is one of the key projects in Google, it is clear they have made
    a big bet on it and is unlikely to disappear anytime soon.


    Features


    Like I mentioned earlier, Angular has more features out of the box than React.
    This can be both a good and a bad thing, depending on how you look at it.


    Both frameworks share some key features in common: components, data binding, and
    platform-agnostic rendering.


    Angular


    Angular provides a lot of the features required for a modern web application out
    of the box. Some of the standard features are:


    *   Dependency injection;


    *   Templates, based on an extended version of HTML;


    *   Routing, provided by @angular/router;


    *   Ajax requests by @angular/http;


    *   @angular/forms for building forms;


    *   Component CSS encapsulation;


    *   XSS protection;


    *   Utilities for unit-testing components.


    Having all of these features available out of the box is highly convenient when
    you don''t want to spend time picking the libraries yourself. However, it also
    means that you''re stuck with some of them, even if you don''t need them. And
    replacing them will usually require additional effort. For instance, we believe
    that for small projects having a DI system creates more overhead than benefit,
    considering it can be effectively replaced by imports.


    React


    With React, you''re starting off with a more minimalistic approach. If we''re
    looking at just React, here''s what we have:


    *   No dependency injection;


    *   Instead of classic templates it has JSX, an XML-like language built on top
    of JavaScript;


    *   XSS protection;


    *   Utilities for unit-testing components.


    Not much. And this can be a good thing. It means that you have the freedom to
    choose whatever additional libraries to add based on your needs. The bad thing
    is that you actually have to make those choices yourself. Some of the popular
    libraries that are often used together with React are:


    *   [React-router](https://reacttraining.com/react-router/) for routing.


    *   [Fetch](https://developer.mozilla.org/en/docs/Web/API/Fetch_API) (or [axios](https://github.com/mzabriskie/axios))
    for HTTP requests;


    *   A [wide variety of techniques](https://github.com/MicheleBertoli/css-in-js)
    for CSS encapsulation;


    *   [Enzyme](https://github.com/airbnb/enzyme) for additional unit-testing utilities.


    We''ve found the freedom of choosing your own libraries liberating. This gives
    us the ability to tailor our stack to particular requirements of each project
    and we didn''t find the cost of learning new libraries that high.


    Languages, Paradigms, and Patterns.


    Taking a step back from the features of each framework, let''s see what kind higher-level
    concepts are popular with both frameworks.


    React


    There are several important things that come to mind when thinking about React:
    JSX, Flow, and Redux.


    JSX


    [JSX](https://facebook.github.io/react/docs/introducing-jsx.html) is a controversial
    topic for many developers: some enjoy it, and others think that it''s a huge step
    back. Instead of following a classical approach of separating markup and logic,
    React decided to combine them within components using an XML-like language that
    allows you to write markup directly in your JavaScript code.


    While the topic of mixing markup with JavaScript might be debatable, it has an
    indisputable benefit: static analysis. If you make an error in your JSX markup,
    the compiler will emit an error instead of continuing in silence. This helps by
    instantly catching typos and other silly errors.


    Flow


    [Flow](https://flow.org/) is a type-checking tool for JavaScript also developed
    by Facebook. It can parse code and check for common type errors such as implicit
    casting or null dereferencing.


    Unlike TypeScript, which has a similar purpose, it does not require you to migrate
    to a new language and annotate your code for type checking to work. In Flow, type
    annotations are optional and can be used to provide additional hints to the analyzer.
    This makes Flow a good option if you would like to use static code analysis, but
    would like to avoid having to rewrite your existing code.


    [Further reading: [Writing Better JavaScript with Flow](https://www.sitepoint.com/writing-better-javascript-with-flow/)]


    Redux


    [Redux](http://redux.js.org/) is a library that helps manage state changes in
    a clear manner. It was inspired by [Flux](http://facebook.github.io/flux/) but
    with some simplifications. The key idea of Redux is that the whole state of the
    application is represented by a single object, which is mutated by functions called
    reducers. Reducers themselves are pure functions and are implemented separately
    from the components. This enables better separation of concerns and testability.


    If you''re working on a simple project, then introducing Redux might be an over
    complication, but for medium and large-scale projects, it''s a solid choice. The
    library has become so popular that there are [projects](https://github.com/angular-redux/store)
    implementing it in Angular as well.


    All three features can greatly improve your developer experience: JSX and Flow
    allow you to quickly spot places with potential errors, and Redux will help achieve
    a clear structure for your project.


    Angular


    Angular has a few interesting things up its sleeve as well, namely TypeScript
    and RxJS.


