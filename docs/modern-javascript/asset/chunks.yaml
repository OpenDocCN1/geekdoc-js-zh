    在选择任何任何工具之前，你需要回答两个简单的问题：“它本身是一个好工具吗？”以及“它是否适合我的用例？”。这两个问题单看来看都没有任何意义，所以你总是需要同时记住这两点。好吧，这些问题可能并没有那么简单，所以我们将尝试将它们拆解为更小的问题。


    ## 关于工具本身的问题：


    * 它的成熟程度如何？背后支持者是谁？

    * 它拥有哪些特性？

    * 它采用了什么样的架构、开发范式和模式？

    * 它的生态系统是怎样的？


    ## 关于自省的问题：


    * 我以及我的同事能够轻松学习这个工具吗？

    * 它契合我的项目吗？

    * 开发者体验如何？


    通过这组问题，你可以开始对任何工具进行评估，我们对 React 和 Angular 的比较也将基于这些问题。


    我们还有另外一点需要考量。严格来说，将 Angular 与 React 进行比较并不完全公平，因为 Angular 是一个功能完备的大型框架，而 React
    只是一个 UI 组件库。为了公平起见，我们将结合经常与 React 一起使用的库来讨论 React。


    ## 成熟度


    成为一名熟练开发者的一个重要方面，是能够在既定的、经过时间验证的方法与评估新的前沿技术之间保持平衡。作为一个一般原则，在采用尚未成熟的工具时你应该要小心，因为存在某些风险：


    * 工具可能存在 Bug 且不稳定。

    * 供应商可能会意外地废弃它。

    * 当你需要帮助时，可能没有庞大的知识库或社区可供。


    React 和 Angular 都源自优秀的背景，所以看起来在这方面我们可以充满信心。


    ## React


    React 由 Facebook 开发并维护，并应用于其自己的产品中，[包括 Instagram 和 WhatsApp](https://github.com/facebook/react/wiki/sites-using-react)。它已经存在了大约[三个半以来](https://facebook.github.io/react/blog/2013/06/05/why-react.html)，所以它并不算新。它也是
    GitHub 上[最受欢迎的](https://github.com/search?q=stars:%3E1&s=stars&type=Repositories)项目之一，在编写时大约有
    60,000 个星。听起来很不错。


    ## Angular


    Angular（2 及以上版本）出现的时间比 React 短，但如果你算上它的前身 AngularJS 的历史，情况就平分了。它由 Google 维护，并用于
    [AdWords 和 Google Fiber](http://angularjs.blogspot.com/2015/11/how-google-uses-angular-2-with-dart.html)。由于
    AdWords 是 Google 的核心项目之一，显而易见他们对它下下了大注，不太可能短期内消失。


    ## 特性


    正如我之前提到的，Angular 开箱即用的特性比 React 多。这既可以是好事，也可以是坏事，取决于你如何看待。


    这两个框架共享一些共同特性：组件、数据绑定和平台无关的渲染。


    ### Angular


    Angular 开箱即提供了许多现代 Web 应用所需的特性。一些标准特性包括：


    * 依赖注入；

    * 基于扩展版 HTML 的模板；

    * 由 `@angular/router` 提供的路由；

    * 由 `@angular/http` 提供的 Ajax 请求；

    * 用于构建表单的 `@angular/forms`；

    * 组件 CSS 封装；

    * XSS 保护；

    * 用于组件测试的实用工具。


    当你不想花时间自己选择库时，拥有所有这些开箱即用的特性是非常方便的。然而，这意味着你会被困于某些库中，即使你不需要它们。而且替换它们通常需要额外的努力。例如，我们认为对于小型项目来说，拥有
    `DI`（依赖注入）系统带来的开销多于收益，考虑到它可以被 `imports`（导入）有效地所替代。


    ### React


    使用 React 时，你从一种更极简的方法开始。如果我们只看 React，这里我们有：


    * 没有依赖注入；

    * 取代经典模板的是，它拥有 JSX，这是一种构建在 JavaScript 之上的类 XML 语言；

    * XSS 保护；

    * 用于组件测试的实用工具。


    并不多。这可能是一件好事。这意味着你有自由根据需要选择添加任何额外的库。坏处在于你实际上必须自己做这些选择。经常与 React 一起使用的一些流行库包括：


    * 用于路由的 [React-router](https://reacttraining.com/react-router/)；

    * 用于 HTTP 请求的 [Fetch](https://developer.mozilla.org/en/docs/Web/API/Fetch_API)（或
    [axios](https://github.com/mzabriskie/axios)）；

    * 用于 CSS 封装的[各种技术](https://github.com/MicheleBertoli/css-in-js)；

    * 用于额外的单元测试工具的 [Enzyme](https://github.com/airbnb/enzyme)。


    我们发现选择自己库的自由是令人解放的。这使我们能够根据每个项目的特定需求来定制我们的技术栈，而且我们发现学习新库的成本并不。


    ## 语言、范式和模式。


    从每个框架的特性中退一步，让我们看看哪些高级概念在两个框架中都是流行的。


    ### React


    在思考 React 时，有几件重要的事情进入脑海：JSX、Flow 和 Redux。


    #### JSX


    [JSX](https://facebook.github.io/react/docs/introducing-jsx.html) 对许多开发者是有争议的话题：有些人喜欢它，另一些人认为它是巨大的退步。React
    没有遵循传统的做法，而是在组件内部将它们结合。虽然将标记与逻辑混合的话题可能有争议，但它有一个不可否的益处：静态分析。如果你在 JSX 中编写错误，编译器将发出错误而不是静默运行。这有助于发现拼写错误和其他愚蠢的错误。


    #### Flow


    [Flow](https://flow.org/) 是一个由 Facebook 开发的 JavaScript 类型检查工具。它可以解析代码并检查常见的类型错误，例如隐式转换或空引用。与具有类似目的
    TypeScript 不同，它不需要你迁移到一种新语言并为代码添加注解。在 Flow 中，类型注解是可选的，可以为分析器提供额外的提示。这使得 Flow 对于想要使用静态代码分析但不想重写现有代码的人来说是一个很好的选择。


    进一步阅读：[更好的 JavaScript](https://www.sitepoint.com/writing-better-javascript-with-flow/)


    #### Redux


    [Redux](http://redux.js.org/) 是一个有助于清晰管理状态变化的库。它受到了 [Flux](http://facebook.github.io/flux/)
    的启发，但进行了简化。Redux 的核心思想是应用程序的状态由单个对象表示，并通过称为 reducer 的函数进行更改。Reducer 本身是与组件分离的纯函数实现了更好的关注点分离和可测试性。


    如果你在一个简单的项目上工作，那么引入 Redux 可能会过度复杂，但对于中大型项目，它是一个可靠的选择。该库已变得如此流行，以至于有项目](https://github.com/angular-redux/store)
    在 Angular 中实现了它。


    这三个特性都可以极大地提高你的开发者体验：JSX 和 Flow 让你能够快速发现潜在错误的地方，而 Redux 将帮助为项目实现清晰的结构。


    ### Angular


    Angular 也有一些有趣的王牌，即 TypeScript 和 RxJS。


    #### TypeScript


