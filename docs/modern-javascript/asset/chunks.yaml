  trans: "\n\n我们将编写一个端到端测试，以验证 `validateForm` 在真实 DOM 节点上的功能，以及针对我们最初支持的两种验证类型的验证。一旦我们的第一个实现运行正常，我们将遵循\
    \ TDD（测试驱动开发），通过编写更小的单元来逐步对其进行重构。\n\n以下是我们的测试将用到的表单：\n\n```html\n<form class=\"\
    test-form\">\n    <input name=\"first-name\" type=\"text\" data-validation=\"\
    alphabetical\" />\n    <input name=\"age\" type=\"text\" data-validation=\"numeric\"\
    \ />\n</form>\n```\n\n在每个测试之间，我们都会创建一个表单的新克隆，以消除潜在副作用的风险。传递给 `cloneNode` 的 `true`\
    \ 参数确保表单的子节点也会被克隆：\n\n```javascript\nlet form = document.querySelector('.test-form');\n\
    beforeEach(function () {\n    form = form.cloneNode(true);\n});\n```\n\n### 编写第一个测试用例\n\
    \n`describe('the validateForm function', function () {})` 测试套将用于测试我们的 API。在内部函数中编写第一个测试用例，该用例将确保字母和数字规则的合法值会被识别为有效：\n\
    \n```javascript\nit('should validate a form with all of the possible validation\
    \ types', function () {\n    const name = form.querySelector('input[name=\"first-name\"\
    ]');\n    const age = form.querySelector('input[name=\"age\"]');\n    name.value\
    \ = 'Bob';\n    age.value = '42';\n    const result = validateForm(form);\n  \
    \  expect(result.isValid).to.be.true;\n    expect(result.errors.length).to.equal(0);\n\
    });\n```\n\n将更改保存到你的 fork 之后，你应该看到测试失败了。\n\n现在让我们这个测试通过（变绿）！记住，我们应该努力编写最少、合理的代码（而不是\
    \ `return true;!` 这种数量的代码）来满足测试，所以我们现在不要担心错误报告。\n\n这是初始实现，它遍历我们表单的 `input` 元素并使用正则表达式验证每个的值：\n\
    \n```javascript\nfunction validateForm(form) {\n    const result = {\n       \
    \ errors: []\n    };\n    const inputs = Array.from(form.querySelectorAll('input'));\n\
    \    let isValid = true;\n    for (let input of inputs) {\n        if (input.dataset.validation\
    \ === 'alphabetical') {\n            isValid = isValid && /^[a-z]+$/i.test(input.value);\n\
    \        } else if (input.dataset.validation === 'numeric') {\n            isValid\
    \ = isValid && /^[0-9]+$/.test(input.value);\n        }\n    }\n    result.isValid\
    \ = isValid;\n    return result;\n}\n```\n\n现在你应该看到我们的测试通过了。\n\n### 错误处理\n\n在我们第一个测试之后，让我们写另一个测试，用于验证当字母字段无效时，返回的\
    \ `result` 对象的 `error` 数组包含一个带有预期消息的 `Error` 实例：\n\n```javascript\nit('should\
    \ return an error when a name is invalid', function () {\n    const name = form.querySelector('input[name=\"\
    first-name\"]');\n    const age = form.querySelector('input[name=\"age\"]');\n\
    \    name.value = '!!!';\n    age.value = '2';\n    const result = validateForm(form);\n\
    \    expect(result.isValid).to.be.false;\n    expect(result.errors[0]).to.be.instance(Error);\n\
    \    expect(result.errors[0].message).to.equal('!!! is not a valid first-name\
    \ value');\n});\n```\n\n保存你的 fork 之后，你应该看到新的失败用例。让我们更新实现以以满足测试用例：\n\n```javascript\n\
    function validateForm(form) {\n    const result = {\n        get isValid() {\n\
    \            return this.errors.length === 0;\n        },\n        errors: []\n\
    \    };\n    const inputs = Array.from(form.querySelectorAll('input'));\n    for\
    \ (let input of inputs) {\n        if (input.dataset.validation === 'alphabetical')\
    \ {\n            let isValid = /^[a-z]+$/i.test(input.value);\n            if\
    \ (!isValid) {\n                result.errors.push(new Error(`${input.value} is\
    \ not a valid ${input.name} value`));\n            }\n        } else if (input.dataset.validation\
    \ === 'numeric') {\n            // TODO: we'll consume this the next test\n  \
    \          let isValid = /^[0-9]+$/.test(input.value);\n        }\n    }\n   \
    \ return result;\n}\n```\n\n现在让我们添加一个测试，断言数字验证错误被正确处理：\n\n```javascript\nit('should\
    \ return an error when an age is invalid', function () {\n    const name = form.querySelector('input[name=\"\
    first-name\"]');\n    const age = form.querySelector('input[name=\"age\"]');\n\
    \    name.value = 'Greg';\n    age.value = 'a';\n    const result = validateForm(form);\n\
    \    expect(result.isValid).to.be.false;\n    expect(result.errors[0]).to.be.instance(Error);\n\
    \    expect(result.errors[0].message).to.equal('a is not a valid age value');\n\
    });\n```\n\n一旦你目睹了测试失败，请更新 `validateForm` 函数：\n\n```javascript\n} else if (input.dataset.validation\
    \ === 'numeric') {\n    let isValid = /^[0-9]+$/.test(input.value);\n    if (!isValid)\
    \ {\n        result.errors.push(new Error(`${input.value} is not a valid ${input.name}\
    \ value`));\n    }\n}\n```\n\n最后，让我们添加一个测试来确保多个错误被处理：\n\n```javascript\nit('should\
    \ return multiple errors if more than one field is invalid', function () {\n \
    \   const name = form.querySelector('input[name=\"first-name\"]');\n    const\
    \ age = form.querySelector('input[name=\"age\"]');\n    name.value = '!!!';\n\
    \    age.value = 'a';\n    const result = validateForm(form);\n    expect(result.isValid).to.be.false;\n\
    \    expect(result.errors[0]).to.be.instance(Error);\n    expect(result.errors[0].message).to.equal('!!!\
    \ is not a valid first-name value');\n    expect(result.errors[1]).to.be.instance(Error);\n\
    \    expect(result.errors[1].message).to.equal('a is not a valid age value');\n\
    });\n```\n\n### 重构我们的验证器\n\n虽然我们有一个通过测试的运行函数，但它产生了一些代码气味：\n\n*   多重职责：\n    -\
    \ 我们在同一个函数中查询内部节点、指定规则集并计算整体结果。从[SOLID 原则](https://en.wikipedia.org/wiki/SOLID_(object-oriented_design))的角度来看，这违反了[单一职责原则](https://en.wikipedia.org/wiki/Single_responsibility_principle)。\n\
    \    - 此外，缺乏抽象导致代码难以理解。\n*   紧耦合：\n    - 目前实现将上述职责交织在一起，使得对每个部分的更新都变得脆弱；当我们引入问题时，调试将变得困难。\n\
    \    - 而且，我们无法在不更新 `if` 语句的情况下添加或更改验证规则。这违反了 SOLID 的[开闭原则](https://en.wikipedia.org/wiki/Open/closed_principle)。\n\
    *   逻辑重复：\n    - 如果我们要更新错误消息的格式，或者向数组添加另一个对象，就必须在两个地方进行更新。\n\n幸运的是，由于我们已经为验证器编写了功能测试，我们可以放心地改进代码而不用担心破坏它。\n\
    \n#### `createValidationQueries` 函数\n\n通过将我们的 `HTMLInputElement` `NodeList` 映射为代表表单字段、验证类型以及该字段值的对象，我们不仅将\
    \ `validateForm` 函数与 DOM 解耦，还为以后替换硬编码正则表达式时进行验证规则查找提供了便利。\n\n"
- fmt: "\nFor example, the validation query object for the `first-name` field would\
    \ be:\n\n```javascript\n{\n    name: 'first-name',\n    type: 'alphabetical',\n\
    \    value: 'Bob'\n}\n```\n\nAbove the `validateForm` function, create an empty\
    \ function called `createValidationQueries`. Then, outside of the `describe` suite\
    \ for `validateForm`, create another `describe suite` named 'the createValidationQueries\
    \ function'.\n\nIt should include the single test case:\n\n```javascript\ndescribe('the\
    \ createValidationQueries function', function () {\n    it('should map input elements\
    \ with a data-validation attribute to an array of validation objects', function\
    \ () {\n        const name = form.querySelector('input[name=\"first-name\"]');\n\
    \        const age = form.querySelector('input[name=\"age\"]');\n        name.value\
    \ = 'Bob';\n        age.value = '42';\n        const validations = createValidationQueries([name,\
    \ age]);\n        expect(validations.length).to.equal(2);\n        expect(validations[0].name).to.equal('first-name');\n\
    \        expect(validations[0].type).to.equal('alphabetical');\n        expect(validations[0].value).to.equal('Bob');\n\
    \        expect(validations[1].name).to.equal('age');\n        expect(validations[1].type).to.equal('numeric');\n\
    \        expect(validations[1].value).to.equal('42');\n    });\n});\n```\n\nOnce\
    \ you've witnessed this fail, write the code for the implementation:\n\n```javascript\n\
    function createValidationQueries(inputs) {\n    return Array.from(inputs).map(input\
    \ => ({\n        name: input.name,\n        type: input.dataset.validation,\n\
    \        value: input.value\n    }));\n}\n```\n\nWhen this passes, update `validateForm`'s\
    \ `for` loop to call our new function and to use the query objects to determine\
    \ the validity of our form:\n\n```javascript\nfor (let validation of createValidationQueries(form.querySelectorAll('input')))\
    \ {\n    if (validation.type === 'alphabetical') {\n      let isValid = /^[a-z]+$/i.test(validation.value);\n\
    \        if (!isValid) {\n            result.errors.push(new Error(`${validation.value}\
    \ is not a valid ${validation.name} value`));\n        }\n    } else if (validation.type\
    \ === 'numeric') {\n      let isValid = /^[0-9]+$/.test(validation.value);\n \
    \     if (!isValid) {\n        result.errors.push(new Error(`${validation.value}\
    \ is not a valid ${validation.name} value`));\n      }\n    }\n}\n```\n\nIf both\
    \ our new test and the existing tests pass [as demonstrated in this pen](http://codepen.io/SitePoint/pen/EWBeep?editors=010),\
    \ then we can make a bigger change; decoupling the `validateItem` function. To\
    \ remove our hard-coded rules, let's write a function that takes our rules as\
    \ a [`Map`](https://developer.mozilla.org/en/docs/JavaScript/Global_Objects/Map)\
    \ and asserts the validity of our inputs.\n\nLike `createValidationQueries`, we'll\
    \ write a new suite before our implementation. Above the implementation of `validateForm`,\
    \ write an empty function called `validateItem`. Then in our main `describe` suite,\
    \ write another `describe` suite for our addition:\n\n```javascript\ndescribe('the\
    \ validateItem function', function () {\n    const validationRules = new Map([\n\
    \        ['alphabetical', /^[a-z]+$/i]\n    ]);\n    it('should return true when\
    \ the passed item is deemed valid against the validation rules', function () {\n\
    \        const validation = {\n            type: 'alphabetical',\n           \
    \ value: 'Bob'\n        };\n        const isValid = validateItem(validation, validationRules);\n\
    \        expect(isValid).to.be.true;\n    });\n});\n```\n\nWe're explicitly passing\
    \ a `Map` of rules to our implementation from the test as we want to verify its\
    \ behavior independently of our main function; this makes it a unit test. Here's\
    \ our first implementation of `validateItem()`:\n\n```javascript\nfunction validateItem(validation,\
    \ validationRules) {\n    return validationRules.get(validation.type).test(validation.value);\n\
    }\n```\n\nOnce this test has passed, write a second test case to verify that our\
    \ function returns `false` when a validation query is invalid; this should pass\
    \ due to our current implementation:\n\n```javascript\nit('should return false\
    \ when the passed item is deemed invalid', function () {\n    const validation\
    \ = {\n        type: 'alphabetical',\n        value: '42'\n    };\n    const isValid\
    \ = validateItem(validation, validationRules);\n    expect(isValid).to.be.false;\n\
    });\n```\n\nFinally, write a test case to determine that `validateItem` returns\
    \ `false` when the validation type is not found:\n\n```javascript\nit('should\
    \ return false when the specified validation type is not found', function () {\n\
    \    const validation = {\n        type: 'foo',\n        value: '42'\n    };\n\
    \    const isValid = validateItem(validation, validationRules);\n    expect(isValid).to.be.false;\n\
    });\n```\n\nOur implementation should check if the specified validation type exists\
    \ in the `validationRules` `Map` before testing any values against their corresponding\
    \ regular expressions:\n\n```javascript\nfunction validateItem(validation, validationRules)\
    \ {\n    if (!validationRules.has(validation.type)) {\n      return false;\n \
    \   }\n    return validationRules.get(validation.type).test(validation.value);\n\
    }\n```\n\nOnce we see this test passing, let's create a new `Map` above `createValidationQueries`,\
    \ which will contain the actual validation rules used by our API:\n\n```javascript\n\
    const validationRules = new Map([\n    ['alphabetical', /^[a-z]+$/i],\n    ['numeric',\
    \ /^[0-9]+$/]\n]);\n```\n\nFinally, let's refactor the `validateForm` function\
    \ to use the new function and rules:\n\n```javascript\nfunction validateForm(form)\
    \ {\n    const result = {\n      isValid() {\n        return this.errors.length\
    \ === 0;\n      },\n      errors: []\n    };\n    for (let validation of createValidationQueries(form.querySelectorAll('input')))\
    \ {\n      let isValid = validateItem(validation, validationRules);\n      if\
    \ (!isValid) {\n        result.errors.push(\n            new Error(`${validation.value}\
    \ is not a valid ${validation.name} value`)\n        );\n      }\n    }\n    return\
    \ result;\n}\n```\n\nHopefully, you'll see that all of the tests pass. Congratulations\
    \ on using testdriven development to refactor and improve the quality of our code!\
    \ Your final implementation should resemble [this Pen](http://codepen.io/SitePoint/pen/xqoamQ?editors=0010).\n\
    \n## Wrapping Up\n\nBy following TDD, we have been able to take the initial implementation\
    \ of our form validation and separate it into independent and understandable parts.\
    \ I hope you've enjoyed this tutorial and take this practice forward with you\
    \ into your everyday work.\n"
  raw: 'For example, the validation query object for the `first-name` field would
    be:


    `{`


    `    name: ''first-name'',`


    `    type: ''alphabetical'',`


    `    value: ''Bob''`


    `}`


    Above the `validateForm` function, create an empty function called `createValidationQueries`.
    Then, outside of the `describe` suite for `validateForm`, create another `describe
    suite` named ''the createValidationQueries function''.


    It should include the single test case:


    `describe(''the createValidationQueries function'', function () {`


    `    it(`


    `        ''should map input elements with a data-validation attribute to an array of validation objects'',`


    `        function () {`


    `            const name = form.querySelector(''input[name="first-name"]'');`


    `            const age = form.querySelector(''input[name="age"]'');`


    `            name.value = ''Bob'';`


    `            age.value = ''42'';`


    `            const validations = createValidationQueries([name, age]);`


    `            expect(validations.length).to.equal(2);`


    `            expect(validations[0].name).to.equal(''first-name'');`


    `            expect(validations[0].type).to.equal(''alphabetical'');`


    `            expect(validations[0].value).to.equal(''Bob'');`


    `            expect(validations[1].name).to.equal(''age'');`


    `            expect(validations[1].type).to.equal(''numeric'');`


    `            expect(validations[1].value).to.equal(''42'');`


    `        }`


    `    );`


    `});`


    Once you''ve witnessed this fail, write the code for the implementation:


    `function createValidationQueries(inputs) {`


    `    return Array.from(inputs).map(input => ({`


    `        name: input.name,`


    `        type: input.dataset.validation,`


    `        value: input.value`


    `    }));`


    `}`


    When this passes, update `validateForm`''s `for` loop to call our new function
    and to use the query objects to determine the validity of our form:


    `for (let validation of createValidationQueries(form.querySelectorAll(''input''))) {`


    `    if (validation.type === ''alphabetical'') {     `


    `        let isValid = /^[a-z]+$/i.test(validation.value);`


    `        if (!isValid) {`


    ``            result.errors.push(new Error(`${validation.value} is not a valid ${validation.name} value`));``


    `        }`


    `    } else if (validation.type === ''numeric'') {`


    `        let isValid = /^[0-9]+$/.test(validation.value);`


    `        if (!isValid) {`


    ``            result.errors.push(new Error(`${validation.value} is not a valid ${validation.name} value`));``


    `        }`


    `    }`


    `}`


    If both our new test and the existing tests pass, [as demonstrated in this pen](http://codepen.io/SitePoint/pen/EWBeep?editors=0010),
    then we can make a bigger change; decoupling the validation rules.


    The `validateItem` function


    To remove our hard-coded rules, let''s write a function that takes our rules as
    a [`Map`](https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/Map)
    and asserts the validity of our inputs.


    Like `createValidationQueries`, we''ll write a new test suite before our implementation.
    Above the implementation of `validateForm`, write an empty function called `validateItem`.
    Then in our main `describe` suite, write another `describe` suite for our new
    addition:


    `describe(''the validateItem function'', function () {`


    `    const validationRules = new Map([`


    `        [''alphabetical'', ``^[a-z]+$``i]`


    `    ]);`


    `    it(`


    `        ''should return true when the passed item is deemed valid against the supplied validation rules'',`


    `        function () {`


    `            const validation = {`


    `                type: ''alphabetical'',`


    `                value: ''Bob''`


    `            };`


    `            const isValid = validateItem(validation, validationRules);`


    `            expect(isValid).to.be.true;`


    `        }`


    `    );`


    `});`


    We''re explicitly passing a `Map` of rules to our implementation from the test
    as we want to verify its behavior independently of our main function; this makes
    it a unit test. Here''s our first implementation of `validateItem()`:


    `function validateItem(validation, validationRules) {`


    `    return validationRules.get(validation.type).test(validation.value);`


    `}`


    Once this test has passed, write a second test case to verify that our function
    returns `false` when a validation query is invalid; this should pass due to our
    current implementation:


    `it(`


    `    ''should return false when the passed item is deemed invalid'',`


    `    function () {`


    `        const validation = {`


    `            type: ''alphabetical'',`


    `            value: ''42''`


    `        };`


    `        const isValid = validateItem(validation, validationRules);`


    `        expect(isValid).to.be.false;`


    `    }`


    `);`


    Finally, write a test case to determine that `validateItem` returns `false` when
    the validation type is not found:


    `it(`


    `    ''should return false when the specified validation type is not found'',`


    `    function () {`


    `        const validation = {`


    `            type: ''foo'',`


    `            value: ''42''`


    `        };`


    `        const isValid = validateItem(validation, validationRules);`


    `        expect(isValid).to.be.false;`


    `    }`


    `);`


    Our implementation should check if the specified validation type exists in the
    `validationRules` Map before testing any values against their corresponding regular
    expressions:


    `function validateItem(validation, validationRules) {`


    `    if (!validationRules.has(validation.type)) {`


    `        return false;`


    `    }`


    `    return validationRules.get(validation.type).test(validation.value);`


    `}`


    Once we see this test passing, let''s create a new `Map` above `createValidationQueries`,
    which will contain the actual validation rules used by our API:


    `const validationRules = new Map([`


    `    [''alphabetical'', /^[a-z]+$/i],`


    `    [''numeric'', /^[0-9]+$/]`


    `]);`


    Finally, let''s refactor the `validateForm` function to use the new function and
    rules:


    `function validateForm(form) {`


    `    const result = {`


    `        get isValid() {`


    `            return this.errors.length === 0;`


    `        },`


    `        errors: []`


    `    };`


    `    for (let validation of createValidationQueries(form.querySelectorAll(''input''))) {`


    `        let isValid = validateItem(validation, validationRules);`


    `        if (!isValid) {`


    `            result.errors.push(`


    ``                new Error(`${validation.value} is not a valid ${validation.name} value`)``


    `            );`


    `        }`


    `    }`


    `    return result;`


    `}`


    Hopefully, you''ll see that all of the tests pass. Congratulations on using testdriven
    development to refactor and improve the quality of our code! Your final implementation
    should resemble [this Pen](http://codepen.io/SitePoint/pen/xqoamQ?editors=0010).


    ![](images/00016.jpg)


    Wrapping Up


    By following TDD, we have been able to take the initial implementation of our
    form validation and separate it into independent and understandable parts. I hope
    you''ve enjoyed this tutorial and take this practice forward with you into your
    everyday work.


