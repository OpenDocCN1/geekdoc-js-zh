    \  else {\n    // return page\n    return caches.match(offlineURL);\n  }\n}\n\
    ```\n\nThe `offlineAsset()` function checks whether the request is for an image\
    \ and returns an SVG containing the text \"offline\". All other requests return\
    \ the `offlineURL` page.\n\nThe Service Worker section of Chrome's Development\
    \ Tools Application tab provides information about your workers, with errors and\
    \ facilities to force reload and make the browser go offline:\n\n![](images/00009.jpg)\n\
    \nThe Cache Storage section lists all caches within the current scope and the\
    \ cached assets they contain. You may need to click the refresh button at the\
    \ bottom of the pane if when the cache is updated:\n\n![](images/00012.jpg)\n\n\
    Unsurprisingly, the Clear storage section can delete your service worker and caches:\n\
    \n![](images/00018.jpg)\n\n## Bonus Step 4: Create a Useful Offline Page\n\nThe\
    \ offline page can be static HTML informing the user that the page they requested\
    \ is not available offline. However, we can also provide a list of page URLs which\
    \ are available to read.\n\nThe [Cache API](https://developer.mozilla.org/en-US/docs/Web/API/Cache)\
    \ can be accessed within our `main.js` script. However, the API uses promises\
    \ which fail in unsupported browsers and will cause all JavaScript to halt execution.\
    \ To avoid this, we'll add code which checks whether the offline list element\
    \ and the Caches API is available before loading another `offlinepage.js` JavaScript\
    \ file (which must be present in the `installFilesEssential` array above):\n\n\
    ```javascript\n// load script to populate offline page list\nif (document.getElementById('cachedpagelist')\
    \ && 'caches' in window) {\n  var scr = document.createElement('script');\n  scr.src\
    \ = 'offlinepage.js';\n  scr.async = 1;\n  document.head.appendChild(scr);\n}\n\
    ```\n\n`offlinepage.js` locates the most recent cache by name, gets a list of\
    \ all keys, removes non-page URLs, sorts the list and appends it to the DOM node\
    \ with the ID `cachedpagelist`:\n\n```javascript\nconst CACHE = 'site',\nofflineURL\
    \ = '/',\nlist = document.getElementById('cachedpagelist');\n// fetch all caches\n\
    window.caches.keys()\n  .then(cacheList => {\n    // find caches and order by\
    \ recent\n    cacheList = cacheList\n      .filter(cName => cName.includes(CACHE))\n\
    \      .sort((a, b) => a - b);\n    // open first cache\n    caches.open(cacheList[0])\n\
    \      .then(cache => {\n        // fetch cached pages\n        cache.keys()\n\
    \          .then(reqList => {\n            let frag = document.createDocumentFragment();\n\
    \            reqList\n              .map(req => req.url)\n              .filter(req\
    \ => (req.endsWith('/') || req.endsWith('.html')) && !req.endsWith(offlineURL))\n\
    \              .sort()\n              .forEach(req => {\n                let li\
    \ = document.createElement('li'),\n                a = li.appendChild(document.createElement('a'));\n\
    \                a.setAttribute('href', req);\n                a.textContent =\
    \ a.pathname;\n                frag.appendChild(li);\n              });\n    \
    \        if (list) list.appendChild(frag);\n          });\n      });\n  });\n\
    ```\n\n## Development Tools\n\nIf you think JavaScript debugging is tough, service\
    \ workers won't be much fun! Chrome's Application tab of the Developer Tools provides\
    \ a solid set of features and logging statements are also output to the console.\n\
    \nYou should consider running your app in an Incognito window during development\
    \ since cached files are not retained after you close the tab.\n\nFirefox offers\
    \ a JavaScript debugger accessed from the Service Workers option of the tools\
    \ menu. Better facilities are promised soon.\n\nFinally, the [Lighthouse extension\
    \ for Chrome](https://chrome.google.com/webstore/detail/lighthouse/blipmdconlkpine)\
    \ provides useful information about PWA.\n\n## PWA Gotchas\n\nProgressive Web\
    \ Apps require new technologies so some caution is advised. The manifest options\
    \ `display: minimal-ui` or `display: browser` are possibly best for most sites.##\
    \ URL Hiding\n\nThe demonstration hides the URL bar which I would not recommend\
    \ unless you have a single app.Cache Overload\n\nYou could cache every page on\
    \ your site. That's fine for small sites but would it be practical for those with\
    \ thousands of pages? device storage limits could be exceeded. Perhaps consider:\n\
    \n*   only caching important pages such as the home, and the most recent\n*  \
    \ not caching images, videos and other large files\n*   regularly wiping older\
