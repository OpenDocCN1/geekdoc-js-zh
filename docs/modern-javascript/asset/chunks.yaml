  raw: 'Another important event method is `.stopPropagation()`, which will prevent
    the event from bubbling up the DOM. This means that if we have a propagation-stopping
    click listener (say) on an element, and another click listener on one of its parents,
    a click event that gets triggered on the child element won''t get triggered on
    the parent — otherwise, it would get triggered on both.


    Now `.addEventListener()` takes an optional config object as a 3rd argument, which
    can have any of the following boolean properties (all of which default to `false`):


    *   `capture`: The event will be triggered on the element before any other element
    beneath it in the DOM (event capturing and bubbling is an article in its own right,
    for more details have a look [here](http://javascript.info/tutorial/bubbling-and-capturing))


    *   `once`: As you might guess, this indicates that the event will get triggered
    only once


    *   `passive`: This means that `event.preventDefault()` will be ignored (and usually
    yield a warning in the console)


    The most common option is `.capture`; in fact, it is so common that there''s a
    shorthand for this: instead of specifying it in the config object, you can just
    pass in a boolean here:


    `myElement.addEventListener(type, listener, true)`


    Event listeners can be removed using `.removeEventListener()`, which takes the
    event type and a reference to the callback function to be removed; for example,
    the `once` option could also be implemented like


    `myElement.addEventListener(''change'', function listener (event) {`


    `  console.log(event.type + '' got triggered on '' + this)`


    `  this.removeEventListener(''change'', listener)`


    `})`


    Event delegation


    Another useful pattern is event delegation: say we have a form and want to add
    a `change` event listener to all of its `input` children. One way to do so would
    be iterating over them using `myForm.querySelectorAll(''input'')` as shown above.
    However, this is unnecessary when we can just as well add it to the form itself
    and check the contents of `event.target`.


    `myForm.addEventListener(''change'', function (event) {`


    `  const target = event.target`


    `  if (target.matches(''input'')) {`


    `    console.log(target.value)`


    `  }`


    `})`


    Another advantage of this pattern is that it automatically accounts for dynamically
    inserted children as well, without having to bind new listeners to each.


    Animation


    Usually, the cleanest way to perform animations is to apply CSS classes with a
    `transition` property, or use CSS `@keyframes`. But if you need more flexibility
    (e.g. for a game), this can be done with JavaScript as well.


    The naive approach would be to have a `window.setTimeout()` function call itself
    until the desired animation is completed. However, this inefficiently forces rapid
    document reflows; and this layout thrashing can quickly lead to stuttering, expecially
    on mobile devices. Intead, we can sync the updates using `window.requestAnimationFrame()`
    to schedule all current changes to the next browser repaint frame. It takes a
    callback as argument which receives the current (high res) timestamp:


    `const start = window.performance.now()`


    `const duration = 2000`


    `window.requestAnimationFrame(function fadeIn (now)) {`


    `  const progress = now - start`


    `  myElement.style.opacity = progress / duration`


    `  if (progress < duration) {`


    `    window.requestAnimationFrame(fadeIn)`


    `  }`


    `}`


    This way we can achieve very smooth animations. For a more detailed discussion,
    please have a look at [this](https://www.sitepoint.com/quick-tip-game-loop-in-javascript/)
    article by Mark Brown.


    Writing your own helper methods


    True, always having to iterate over elements to do something with them may be
    rather cumbersome compared to jQuery''s concise and chainable `$(''.foo'').css({color:
    ''red''})` syntax. So why not simply write our own shorthand methods for things
    like this?


    `const $ = function $ (selector, context = document) {`


    `const elements = Array.from(context.querySelectorAll(selector))`


    `  return {`


    `    elements,`


    `    html (newHtml) {`


    `      this.elements.forEach(element => {`


    `        element.innerHTML = newHtml`


    `      })`


    `      return this`


    `    },`


    `    css (newCss) {`


    `      this.elements.forEach(element => {`


    `        Object.assign(element.style, newCss)`


    `      })`


    `      return this`


    `    },`


    `    on (event, handler, options) {`


    `      this.elements.forEach(element => {`


    `        element.addEventListener(event, handler, options)`


    `      })`


    `      return this`


    `    }`


    `    // ``etc.`


    `  }`


    `}`


    Thus we have a super slim DOM-library with only the methods that we really need,
    and without all the backwards-compatibility weight. Usually we''d have those methods
    in our collection''s prototype though. Here''s a (somewhat more elaborate) [gist](https://gist.github.com/SitePointEditors/4f6643d62a87aece860b0784c6eeffd2)
    with some ideas how to implement such helpers. Alternatively, we might keep it
    as simple as


    `const $ = (selector, context = document) => context.querySelector(selector)`


    `const $$ = (selector, context = document) => context.querySelectorAll(selector)`


    `const html = (nodeList, newHtml) => {`


    `  Array.from(nodeList).forEach(element => {`


    `    element.innerHTML = newHtml`


    `  })`


    `}`


    `// And so on...`


    Demo


    To round this article off, here''s a [CodePen which demonstrates many of the concepts
    explained above to implement a simple lightbox technique](http://codepen.io/SitePoint/pen/aJaggB/).


    Conclusion


    I hope I could show that DOM manipulation with plain JavaScript is not rocket
    science and that in fact, many jQuery methods have direct equivalents in the native
    DOM API. This means that for some everyday use cases (such as a navigation menu
    or a modal popup), the additional overhead of a DOM library may be out of place.


    And while it''s true that some parts of the native API are verbose or inconvenient
    (such as having to iterate over node lists manually all the time), we can quite
    easily write our own small helper functions to abstract away such repetitive tasks.


