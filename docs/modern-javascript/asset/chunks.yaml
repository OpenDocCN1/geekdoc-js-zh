  trans: "\n这段简小的代码片段中发生了许多操作。变量在全局作用域被定义。值在函数之间传递并修改。DOM 方法与原生 JavaScript 混合在一起。函数名没有很好的描述性，这部分部分是因为整个程序依赖于一个可能存在也可能不存在的上下文。但如果你恰好在\
    \ HTML 文档的浏览器中运行这段代码，且其中定义了一个 `<button id=\"main_button\">`，你可能会被提示输入一些文本，然后看到一个\
    \ `alert` 框，显示该文本中每个单词的首字母大写的结果。\n\n这种命令式代码的编写是为了从上到下读取和执行的（稍不考虑一些[变量提升](http://www.sitepoint.com/demystifying-javascript-variable-scope-hoisting/)）。但我们也可以利用\
    \ JavaScript 的面向对象特性对其进行一些改进，使其更整洁、更具可读性。\n\n## 面向对象的 JavaScript\n\n几年后，开发者开始注意到在浏览器等共享环境中使用命令式编码存在的问题。一个\
    \ JavaScript 代码段的全局变量会覆盖另一个片段设置的全局变量。代码调用的顺序会以不可预测的方式影响结果，特别是考虑到网络连接和渲染时间引入的延迟。\n\
    \n最终，出现了一些更好的实践，来帮助封装 JavaScript 代码并使其与 DOM 交互得更好。上述代码的一个更新版本（按照面向对象的标准编写）看起来可能如下所示：\n\
    \n```javascript\n(function() {\n  \"use strict\";\n  var SomeText = function(text)\
    \ {\n    this.text = text;\n  };\n  SomeText.prototype.capify = function(str)\
    \ {\n    var firstLetter = str.charAt(0);\n    var remainder = str.substring(1);\n\
    \    return [firstLetter.toUpperCase(), remainder].join(\"\");\n  };\n  SomeText.prototype.capifyWords\
    \ = function() {\n    var result = [];\n    var textArray = this.text.split(\"\
    \ \");\n    for (var counter = 0; counter < textArray.length; counter++) {\n \
    \     result.push(this.capify(textArray[counter]));\n    }\n    return result.join(\"\
    \ \");\n  };\n  document.getElementById(\"main_button\").addEventListener(\"click\"\
    , function(e) {\n    var something = prompt(\"Give me something to capitalize\"\
    );\n    var newText = new SomeText(something);\n    alert(newText.capifyWords());\n\
    \  });\n}());\n```\n\n在在这个面向对象的版本中，构造函数模拟了一个类来构建我们想要的对象。方法存储在新对象的原型上，以保持低内存占用。所有代码都隔离在一个匿名的立即执行函数表达式中，因此不会污染全局作用域。甚至还使用了\
    \ `\"use strict\"` 指令来利用最新的 JavaScript 引擎，并且旧式的 `onclick` 方法被全新的 `addEventListener`\
    \ 取代，因为现在还有谁在用 IE8 或更早版本呢？这样的脚本可能会插入到 HTML 文档 `<body>` 元素的末尾，以确保在处理之前所有 DOM 都已加载，从而使其它依赖的\
    \ `<button>` 是可用的。\n\n尽管经过了这些重构，仍然存在许多导致我们走到这里的命令式风格痕迹。构造函数中的方法依赖于父对象作用域的变量。有一个循环结构用于遍历字符串数组的所有成员。有一个\
    \ `counter` 变量，除了增加 `for` 循环的进度外没有其他用途。还有一些方法会产生修改其定义之外变量的副作用。这一切使得代码更加脆弱、可移植性更差，并且更难在这个狭窄的上下文之外测试这些方法。\n\
    \n## 函数式 JavaScript\n\n面向对象的方法比我们开始使用的命令式方法要整洁且模块化得多，但让我们看看能否通过解决我们讨论过的某些缺点来改进它。如果我们能找到方法利用\
    \ JavaScript 将函数视为一等对象的内置能力，那就太好了，这样我们的代码就可以更整洁、更稳定且更容易重用。\n\n```javascript\n\
    (function() {\n  \"use strict\";\n  var capify = function(str) {\n    return [str.charAt(0).toUpperCase(),\
    \ str.substring(1)].join(\"\");\n  };\n  var processWords = function(str) {\n\
    \    return str.split(\" \").map(capify).join(\" \");\n  };\n  document.getElementById(\"\
    main_button\").addEventListener(\"click\", function(e) {\n    var something =\
    \ prompt(\"Give me something to capitalize\");\n    alert(processWords(something));\n\
    \  });\n}());\n```\n\n你注意到这个版本短了了吗？我们只定义了两个函数：`capify` 和 `processWords`。每一个都是纯函数，这意味着它们对于任何给定的输入都会返回相同的的结果。在这里使用\
    \ `map` 代替 `for` 循环，消除了 `counter` 变量，并帮助我们的代码变得整洁得多。\n"
- fmt: "\nI chose Chart.js because it can be learned and leveraged quickly. It's designed\
    \ with simplicity in mind, yet is extremely customizable. In my experience, charting\
    \ libraries fall onto a spectrum of complexity, where more complex libraries offer\
    \ deeper customization, but have steeper learning curves. Chart.js is one of the\
    \ quickest and easiest libraries to learn that doesn't heavily limit your options.\
    \ It comes with eight different chart types that will cover almost all of your\
    \ data visualization needs.\n\nChart.js is actively maintained to a high standard\
    \ by the open source community. It recently reached version 2.0, which came with\
    \ a few fundamental syntax changes to make code more consistent, as well as offer\
    \ mobile support. In this article, I'm going to use Chart.js 2.0 and it's updated\
    \ syntax. At the end of this article, after giving you a chance to see how Chart.js\
    \ 2.0 works, there is a section covering the 1.0 -> 2.0 transition and what to\
    \ expect when reading old Chart.js examples online.\n\n# Installing Chart.js\n\
    \nAgain, Chart.js is focused on being easy. Easy to learn, easy to leverage, and\
    \ easy to install. If you'd like to dive into the actual code, [check out the\
    \ GitHub project](https://github.com/modernjsant/chartjs/Chart.js).\n\nYou only\
    \ need two things to use Chart.js.\n\n1) The library - for this guide, I recommend\
    \ using a CDN because it's the easiest way to get up and running fast.\n\n```html\n\
    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.1.4/Chart.min.js\"\
    ></script>\n```\n\n2) A `<canvas>` element, as Chart.js leverages HTML5 canvas.\n\
    \n```html\n</canvas><canvas id=\"myChart\"></canvas>\n```\n\nAlternatively, you\
    \ can use a package manager to download the library. For more information, see\
    \ the [Getting Started](http://www.chartjs.org/docs/#getting-started) guide.\n\
    \nSimple, eh? Now without further ado, let's look at what Chart.js has to offer.\n\
    \n# Line Chart\n\nThis is all you need to create a minimum line chart in Chart.js.\
    \ Just put it inside of a `<script></script>` somewhere in your `<body>` after\
    \ you declare the HTML5 canvas.\n\n```javascript\nvar ctx = document.getElementById('myChart').getContext('2d');\n\
    var myChart = new Chart(ctx, {\n  type: 'line',\n  data: {\n    labels: ['M',\
    \ 'T', 'W', 'T', 'F', 'S', 'S'],\n    datasets: [{\n      label: 'apples',\n \
    \     data: [12, 19, 3, 17, 6, 3, 7],\n      backgroundColor: \"rgba(153,255,51,0.4)\"\
    \n    }, {\n      label: 'oranges',\n      data: [2, 29, 5, 5, 2, 3, 10],\n  \
    \    backgroundColor: \"rgba(255,153,0,0.4)\"\n    }]\n  }\n});\n```\n\nSee the\
    \ Pen [2 - Line chart](http://codepen.io/SitePoint/pen/WGZGNE/) by SitePoint ([@SitePoint](http://codepen.io/SitePoint))\
    \ on [CodePen](http://codepen.io).\n\n![](images/00002.jpg)\n\nIf this code looks\
    \ intense, don't worry! All Chart.js examples follow the above format for the\
    \ most part, so you only have to learn it once. Lets go line by line to understand\
    \ what's happening.\n\n```javascript\nvar ctx = document.getElementById(\"myChart\"\
    ).getContext('2d');\n```\n\nThis line gets a reference to the `<canvas>` element\
    \ we created earlier, then calls the `getContext` method on it. The `getContext`\
    \ method returns an object that [provides methods and properties](https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D)\
    \ for drawing on the canvas. We store this in a variable named `ctx`.\n\n```javascript\n\
    var myChart = new Chart(ctx, {\n  type: 'line',\n  data: // array of line data\
    \ goes here\n});\n```\n\nHere we are creating the chart object. I've excluded\
    \ the data for a moment to focus on the `type` property, which determines the\
    \ type of chart we want. Chart.js' `new Chart()` constructor takes two parameters:\n\
    \n1. Either a reference to a `<canvas><canvas>` element that the chart will be\
    \ rendered on, or a reference to its 2d drawing context (here we are using 2d).\
    \ Regardless of which you use, the Chart.js convention is to call it `ctx`.\n\
    2. An object literal containing the data and the configuration that Chart.js will\
    \ use to build your chart. The required properties are `type` and `data`. In our\
    \ example `type` is 'line' because we want a line chart. `data` is the data you\
    \ used to populate the chart. Chart.js uses array to determine graph position,\
    \ so the first point of 'apples' will have the value '12', the second will have\
    \ '19', and so on. Adding new lines is as easy as adding a new object with `label`\
    \ and `data`.\n\nFinally, I have set an rgba background for each set to make it\
    \ more appealing. To learn more about line charts, [check out the docs](http://www.chartjs.org/docs/#line-chart)\n\
    \nPro tip: Clicking on any of the legends for the charts (\"Apples\" and \"Oranges\"\
    \ here) will toggle that data set. This works for all chart types.\n\n# Bar Chart\n\
    \nBar charts are (mostly) just line charts that look bit different. By changing\
    \ one line of our previous example, we can create a bar chart: `type: 'line'`\
    \ to `type: 'bar'`. Yes, it's really that easy.\n\nSee the Pen [2. Bar Chart](http://codepen.io/SitePoint/pen/Xjja/)\
    \ by SitePoint ([@SitePoint](http://codepen.io/SitePoint)) on [CodePen](http://codepen.io).\n\
    \n![](images/0001.jpg)\n\nThe full documentation on bar charts can be found [here](http://www.chartjs.org/docs/#bar-chart).\
    \ Here's the full code for this example:\n\n```javascript\nvar ctx = document.getElementById(\"\
    myChart\").getContext('2d');\nvar myChart = new Chart(ctx, {\n  type: 'bar',\n\
    \  data: {\n    labels: [\"M\", \"T\", \"W\", \"R\", \"F\", \"S\", \"S\"],\n \
    \   datasets: [{\n      label: 'apples',\n      data: [12, 19, 3, 17, 28, 24,\
    \ 7]\n    }, {\n      label: 'oranges',\n      data: [30, 29, 5, 5, 20, 3, 10]\n\
    \    }]\n  }\n});\n```\n\n# Radar Charts\n\nRadar charts are my favorite type,\
    \ and again they are in the same family as line and bar charts. Radar charts are\
    \ just line charts with a radial axis opposed to a straight line. To get a quick\
    \ radar chart, change `type: 'bar'` to `type: 'radar'` because that's just how\
    \ Chart.js rolls.\n\nUnfortunately, the result is a bit ugly and very hard to\
    \ read. Bar charts don't have overlap, so solid colors are beneficial. This is\
    \ not the case with radar charts, which do overlap. We can accommodate this by\
    \ updating the opacity value of our `backgroundColor` and adding a `borderColor`.\n\
    \n```javascript\n{\n  label: 'apples',\n  backgroundColor: \"rgba(179,11,198,.2)\"\
    ,\n  borderColor: \"rgba(179,11,198,1)\",\n  data: [12, 19, 3, 17, 6, 3, 7]\n\
    }\n```\n\nThis adds a clearish background and lets us visualize the overlap.\n\
    \n3. Radar Charts by SitePoint ([@SitePoint](http://codepen.io/SitePoint)) on\
    \ [CodePen](http://codepen.io).\n\n![](images/00005.jpg)\n\nTo read more about\
    \ radar charts, [check out the docs](http://www.chartjs.org/docs/#radar-chart).\
    \ Here's the full code from this example:\n\n```javascript\nvar ctx = document.getElementById(\"\
    myChart\");\nvar myChart = new Chart(ctx, {\n  type: 'radar',\n  data: {\n   \
    \ labels: [\"M\", \"T\", \"W\", \"T\", \"F\", \"S\", \"S\"],\n    datasets: [{\n\
    \      label: 'apples',\n      backgroundColor: \"rgba(153,255,51,0.4)\",\n  \
    \    borderColor: \"rgba(153,255,51,1)\",\n      data: [12, 19, 3, 17, 28, 24,\
    \ 7]\n    }, {\n      label: 'oranges',\n      backgroundColor: \"rgba(255,153,0,0.4)\"\
    ,\n      borderColor: \"rgba(255,153,0,1)\",\n      data: [30, 29, 5, 5, 20, 3,\
    \ 10]\n    }]\n  }\n});\n```\n\n# Polar Charts\n\nPolar charts give each data\
    \ point an equal amount of radial space. Segments with larger values extend further\
    \ from the center of the graph. Here's the polar chart for our `apples` data set.\n\
    \n4. Polar Charts by SitePoint ([@SitePoint](http://codepen.io/SitePoint)) on\
    \ [CodePen](http://codepen.io).\n\n![](images/00020.jpg)\n\nAs usual, specifying\
    \ that this is a polar chart can be done with a single line. Change `type: 'radar'`\
    \ to `type: 'polarArea'`.\n"
  raw: 'I chose Chart.js because it can be learned and leveraged quickly. It''s designed
    with simplicity in mind, yet is extremely customizable. In my experience, charting
    libraries fall onto a spectrum of complexity, where more complex libraries offer
    deeper customization, but have steeper learning curves. Chart.js is one of the
    quickest and easiest libraries to learn that doesn''t heavily limit your options.
    It comes with eight different chart types that will cover almost all of your data
    visualization needs.


    Chart.js is actively maintained to a high standard by the open source community.
    It recently reached version 2.0, which came with a few fundamental syntax changes
    to make code more consistent, as well as offer mobile support. In this article,
    I''m going to use Chart.js 2.0 and it''s updated syntax. At the end of this article,
    after giving you a chance to see how Chart.js 2.0 works, there is a section covering
    the 1.0 -> 2.0 transition and what to expect when reading old Chart.js examples
    online.


    Installing Chart.js


    Again, Chart.js is focused on being easy. Easy to learn, easy to leverage, and
    easy to install. If you''d like to dive into the actual code, [check out the GitHub
    project](https://github.com/modernjsant1/chartjs/Chart.js).


    You only need two things to use Chart.js.


    1) The library - for this guide, I recommend using a CDN because it''s the easiest
    way to get up and running fast.


    `<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.1.4/Chart.min.js"></script>`


    2) A `<canvas>` element, as Chart.js leverages HTML5 canvas.


    `</canvas><canvas id="myChart"></canvas>`


    Alternatively, you can use a package manager to download the library. For more
    information, see the [Getting Started](http://www.chartjs.org/docs/#getting-started)
    guide.


    Simple, eh? Now without further ado, let''s look at what Chart.js has to offer.


    Line Chart


    This is all you need to create a minimum line chart in Chart.js. Just put it inside
    of a `<script></script>` somewhere in your `<body>` after you declare the HTML5
    canvas.


    `var ctx = document.getElementById(''myChart'').getContext(''2d'');`


    `var myChart = new Chart(ctx, {`


    `  type: ''line'',`


    `  data: {`


    `    labels: [''M'', ''T'', ''W'', ''T'', ''F'', ''S'', ''S''],`


    `    datasets: [{`


    `      label: ''apples'',`


    `      data: [12, 19, 3, 17, 6, 3, 7],`


    `      backgroundColor: "rgba(153,255,51,0.4)"`


    `    }, {`


    `      label: ''oranges'',`


    `      data: [2, 29, 5, 5, 2, 3, 10],`


    `      backgroundColor: "rgba(255,153,0,0.4)"`


    `    }]`


    `  }`


    `});`


    See the Pen [2 - Line chart](http://codepen.io/SitePoint/pen/WGZGNE/) by SitePoint
    ([@SitePoint](http://codepen.io/SitePoint)) on [CodePen](http://codepen.io).


    ![](images/00002.jpg)


    If this code looks intense, don''t worry! All Chart.js examples follow the above
    format for the most part, so you only have to learn it once. Lets go line by line
    to understand what''s happening.


    `var ctx = document.getElementById("myChart").getContext(''2d'');`


    This line gets a reference to the `<canvas>` element we created earlier, then
    calls the `getContext` method on it. The `getContext` method returns an object
    that [provides methods and properties](https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D)
    for drawing on the canvas. We store this in a variable named `ctx`.


    `var myChart = new Chart(ctx, {`


    `  type: ''line'',`


    `  data: // array of line data goes here`


    `});`


    Here we are creating the chart object. I''ve excluded the data for a moment to
    focus on the `type` property, which determines the type of chart we want. Chart.js''
    `new Chart()` constructor takes two parameters:


    1.  Either a reference to a `</canvas><canvas>` element that the chart will be
    rendered on, or a reference to its 2d drawing context (here we are using the 2d
    context). Regardless of which you use, the Chart.js convention is to call it `ctx`.


    2.  An object literal containing the data and the configuration options that Chart.js
    will use to build your chart. The required properties are `type` and `data`. In
    our example `type` is ''line'' because we want a line chart. `data` is the data
    you used to populate the chart.


    Chart.js uses array location to determine graph position, so the first point of
    ''apples'' will have the value ''12'', the second will have ''19'', and so on.
    Adding new lines is as easy as adding a new object with a `label` and `data`.


    Finally, I have set an rgba background color for each data set to make it more
    visually appealing.


    To learn more about line charts with Chart.js, [check out the docs](http://www.chartjs.org/docs/#line-chart)


    Pro tip


    Clicking on any of the legends for the charts ("Apples" and "Oranges" here) will
    toggle that particular data set. This works for all chart types.


    Bar Chart


    Bar charts are (mostly) just line charts that look a bit different. By changing
    one line of our previous example, we can create a bar chart.


    `type: ''line''`


    to:


    `type: ''bar''`


    Yes, it''s really that easy.


    See the Pen [2\. Bar Chart](http://codepen.io/SitePoint/pen/XjAjaG/) by SitePoint
    ([@SitePoint](http://codepen.io/SitePoint)) on [CodePen](http://codepen.io).


    ![](images/00011.jpg)


    The full documentation on bar charts can be found [here](http://www.chartjs.org/docs/#bar-chart).


    Here''s the full code for this example:


    `var ctx = document.getElementById("myChart").getContext(''2d'');`


    `var myChart = new Chart(ctx, {`


    `  type: ''bar'',`


    `  data: {`


    `    labels: ["M", "T", "W", "R", "F", "S", "S"],`


    `    datasets: [{`


    `      label: ''apples'',`


    `      data: [12, 19, 3, 17, 28, 24, 7]`


    `    }, {`


    `      label: ''oranges'',`


    `      data: [30, 29, 5, 5, 20, 3, 10]`


    `    }]`


    `  }`


    `});`


    Radar Charts


    Radar charts are my favorite type, and again they are in the same family as line
    and bar charts. Radar charts are just line charts with a radial X axis opposed
    to a straight line. To get a quick radar chart, change:


    `type: ''bar''`


    to:


    `type: ''radar''`


    Because that''s just how Chart.js rolls.


    Unfortunately, the result is a bit ugly and very hard to read. Bar charts don''t
    have overlap, so solid colors are beneficial. This is not the case with radar
    charts, which do leverage overlap. We can accommodate this by updating the opactity
    value of our `backgroundColor` and adding a `borderColor`.


    `{`


    `  label: ''apples'',`


    `  backgroundColor: "rgba(179,11,198,.2)",`


    `  borderColor: "rgba(179,11,198,1)",`


    `  data: [12, 19, 3, 17, 6, 3, 7]`


    `}`


    This adds a clearish background and lets us visualize the overlap.


    3\. Radar Charts by SitePoint ([@SitePoint](http://codepen.io/SitePoint)) on [CodePen](http://codepen.io).


    ![](images/00005.jpg)


    To read more about radar charts, [check out the docs](http://www.chartjs.org/docs/#radar-chart).


    Here''s the full code from this example:


    `var ctx = document.getElementById("myChart");`


    `var myChart = new Chart(ctx, {`


    `  type: ''radar'',`


    `  data: {`


    `    labels: ["M", "T", "W", "T", "F", "S", "S"],`


    `    datasets: [{`


    `      label: ''apples'',`


    `      backgroundColor: "rgba(153,255,51,0.4)",`


    `      borderColor: "rgba(153,255,51,1)",`


    `      data: [12, 19, 3, 17, 28, 24, 7]`


    `    }, {`


    `      label: ''oranges'',`


    `      backgroundColor: "rgba(255,153,0,0.4)",`


    `      borderColor: "rgba(255,153,0,1)",`


    `      data: [30, 29, 5, 5, 20, 3, 10]`


    `    }]`


    `  }`


    `});`


    Polar Charts


    Polar charts give each data point an equal amount of radial space. Segments with
    larger values extend further from the center of the graph. Here''s the polar chart
    for our `apples` data set.


    4\. Polar Charts by SitePoint ([@SitePoint](http://codepen.io/SitePoint)) on [CodePen](http://codepen.io).


    ![](images/00020.jpg)


    As usual, specifying that this is a polar chart can be done with a single line.
    Change:


    `type: ''radar''`


    to:


    `type: ''polarArea''`'
