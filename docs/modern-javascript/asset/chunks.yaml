    There''s been a lot of buzz around Progressive Web Apps (PWAs) lately, with many
    people questioning whether they represent the future of the (mobile) web. I''m
    not going to get into the whole native app vs PWA debate, but one thing is for
    sure — they go a long way to enhancing mobile and improving its user experience.
    With mobile web access destined to surpass that of all other devices combined
    by 2018, can you afford to ignore this trend?


    The good news is that making a PWA is not hard. In fact, it''s quite possible
    to take an existing website and convert it into a PWA. And that''s exactly what
    I''ll be doing in this tutorial — by the time you''re finished, you''ll have a
    website that behaves like a native web app. It will work offline and have its
    own home screen icon.


    # What Are Progressive Web Apps?


    Progressive Web Apps (referred to as "PWAs") are an exciting innovation in web
    technology. PWAs comprise a mixture of technologies to make a web app function
    like a native mobile app. The benefits for developers and users overcome the constraints
    imposed by web-only and native-only solutions:


    1. You only need one app developed with open, standard W3C web technologies. There''s
    no need to develop separate native codebases.

    2. Users can discover and try your app before installation.

    3. There''s no need to use an AppStore, abide with arcane rules or pay fees. Application
    updates occur automatically without user interaction.

    4. Users are prompted to "install" which adds an icon to their home screen.

    5. When launched, the PWA displays an attractive splash screen.

    6. The browser chrome options can be modified if necessary to provide a fullscreen
    experience.

    7. Essential files are cached locally so PWAs respond faster than standard web
    apps (they can even be faster than native apps).

    8. Installation is lightweight - perhaps a few hundred KB of cached data.

    9. All data exchanges must occur over a secure HTTPS connection.

    10. PWAs function offline and can synchronize data when the connection returns.


    It''s early days, but [case studies are positive](https://developers.google.com/web/showcase/).
    Flipkart, India''s largest e-commerce site, experienced a [70% increase in sales
    conversions and trebled on-site time](https://developers.google.com/web/showcase/2016/flipkart)
    when they abandoned their native app for a PWA. Alibaba, the world''s largest
    business trading platform, experienced a similar [conversion rate increase of
    76%](https://developers.google.com/web/showcase/2016/alibaba).


    Solid PWA technology support is available in Firefox, Chrome and the other Blink-based
    browsers. Microsoft is working on an Edge implementation. Apple remains silent
    although there are [promising comments in the WebKit five-year plan](https://trac.webkit.org/wiki/FiveYearPlanFall2015).
    Fortunately, browser support is mostly irrelevant...


    # Progressive Web Apps are Progressive Enhancements


    Your app will still run in browsers which don''t support PWA technology. The user
    won''t get the benefits of offline functionality but everything will continue
    to work as before. Given the cost-to-benefit rewards, there''s little reason not
    to add PWA technologies to your system.


    # It''s Not Just Apps


    Google has led the [PWA movement](https://developers.google.com/web/progressive-web-apps/)
    so most tutorials describe how to build a Chrome-based native-looking mobile app
    from the ground-up. However, you don''t need a special singlepage app or have
    to follow material interface design guidelines. Most websites can be PWA-ized
    within a few hours. That includes your WordPress or static site. [Smashing Magazine](https://www.smashingmagazine.com/)
    announced they were [running as a PWA](https://twitter.com/smashingmag/status/839379533874806784)
    while this article was being written!


    # Demonstration Code


    Demonstration code is available from [https://github.com/sitepoint-editors/pwa-retrofit](https://github.com/sitepoint-editors/pwa-retrofit).


    It provides a simple four-page website with a few images, one stylesheet and a
    single main JavaScript file. The site works in all modern browsers (IE10+). If
    the browser supports PWA technologies the user can read previously-viewed pages
    when they''re offline.


    To run the code, ensure [Node.js](https://nodejs.org/) is installed then start
    the provided web server in your terminal with:


    ```

    node ./server.js [port]

    ```


    where `[port]` is optional and defaults to 8888. Open Chrome or another Blink-based
    browser such as Opera or Vivaldi then navigate to [http://localhost:8888/](http://localhost:8888/)
    (or whichever port you specified). You can also open the Developer Tools (F12
    or Cmd/Ctrl + Shift + I) to view various console messages.


    ![](images/00004.jpg)


    View the home page, and perhaps one other, then go offline by either:


    1. Stopping the web server with `Cmd/Ctrl + C`, or

    2. Check the Offline checkbox in the Network or Application - Service Workers
    tab of the Developer Tools.


    Revisit any of the pages you viewed earlier and they will still load. Visit a
    page you''ve not seen to be presented with a "you''re offline" page containing
    a list of viewable pages:


    ![](images/0001.jpg)


    # Connect a Device


    You can also view the demonstration page on Android/Mac.


    ![](images/0019.jpg)


    Connect a Device on Android/Mac.


    ![](images/0007.jpg)


    You can also view the demonstration page on Android/Mac.


    ![](images/0007.jpg) (Note: The text appears to have some repetitive/corrupted
    fragments at the end of source, I have cleaned up the formatting while maintaining
    the core instructions).

    '
