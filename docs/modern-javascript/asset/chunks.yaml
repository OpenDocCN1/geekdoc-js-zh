- fmt: "\n* [gulp-stylus](https://www.npmjs.com/package/gulp-stylus) - the [Stylus\
    \ CSS pre-processor](http://stylus-lang.com/) plug-in\n* [gulp-sequence](https://www.npmjs.com/package/gulp-sequence)\
    \ - run a series of gulp tasks in a specific order\n* [gulp-plumber](https://www.npmjs.com/package/gulp-plumber)\
    \ - error handling which prevents Gulp stopping on failures\n* [gulp-size](https://www.npmjs.com/package/gulp-size)\
    \ - displays file sizes and savings\n* [gulp-nodemon](https://www.npmjs.com/package/gulp-nodemon)\
    \ - uses [nodemon](https://www.npmjs.com/package/nodemon) to automatically restart\
    \ Node.js applications when changes occur.\n* [gulp-util](https://www.npmjs.com/package/gulp-util)\
    \ - utility functions including logging and color-coding\n\nOne useful method\
    \ in `gulp-util` is `.noop()` which passes data straight through without performing\
    \ any action. This could be used for cleaner development/production processing\
    \ code, e.g.\n\n```\nvar gutil = require('gulp-util');\n// HTML processing\ngulp.task('html',\
    \ ['images'], function() {\n  var out = folder.src + 'html/**/*';\n  return gulp.src(folder.src\
    \ + 'html/**/*')\n    .pipe(newer(out))\n    .pipe(devBuild ? gutil.noop() : htmlclean())\n\
    \    .pipe(gulp.dest(out));\n});\n```\n\nGulp can also call other Node.js modules\
    \ - they don't necessarily need to be plugins, e.g.\n\n* [browser-sync](https://www.npmjs.com/package/browser-sync)\
    \ - automatically reload assets or refresh your browser when changes occur\n*\
    \ [del](https://www.npmjs.com/package/del) - delete files and folders (perhaps\
    \ clean your `build` folder at the start of every run).\n\nInvest a little time\
    \ and Gulp could save many hours of development frustration. The advantages:\n\
    \n* [plugins are plentiful](https://npmjs.org/browse/keyword/gulpplugin/)\n* configuration\
    \ using pipes is readable and easy to follow\n* `gulpfile.js` can be adapted and\
    \ reused in other projects\n* your total page weight can be reduced to improve\
    \ performance\n* you can simplify your deployment.\n\nUseful links:\n\n* [Gulp\
    \ home page](http://gulpjs.com/)\n* [Gulp plugins](https://npmjs.org/browse/keyword/gulpplugin/)\n\
    * [npm home page](https://www.npmjs.com/)\n\nApplying the processes above to a\
    \ simple website reduced the total weight by more than 50%. You can test your\
    \ own results using [page weight analysis tools](http://sitepoint.com/10-best-webpage-weight-analysis-tools/)\
    \ or a service such as [New Relic](http://newrelic.com/?r=phpm) which provides\
    \ a range of sophisticated application performance monitoring tools.\n\n# Chapter\
    \ 3: The Basics of DOM Manipulation in Vanilla JavaScript (No jQuery)\n\nby Sebastian\
    \ Seitz\n\nPeer reviewed by [Vildan Softic](https://www.sitepoint.com/author/vildansoftic/)\
    \ and [Joan Yin](https://github.com/newjs).\n\nWhenever we need to perform DOM\
    \ manipulation, we're all quick to reach for jQuery. However, the vanilla JavaScrpt\
    \ DOM API is actually quite capable in its own right, and since IE < 11 has been\
    \ [officially abandoned](https://www.microsoft.com/en-us/WindowsForBusiness/End-of-IE-support),\
    \ it can now be used without any worries.\n\nIn this article, I'll demonstrate\
    \ how to accomplish some of the most common DOM manipulation tasks with plain\
    \ JavaScript, namely:\n\n* querying and modifying the DOM,\n* modifying classes\
    \ and attributes,\n* listening to events, and\n* animation.\n\nI'll finish off\
    \ by showing you how to create your own super slim DOM-library that you can drop\
    \ into any project. Along the way, you'll learn that DOM manipulation with vanilla\
    \ JS is not rocket science and that many jQuery methods in fact have direct equivalents\
    \ in the native API.\n\nSo let's get to it ...\n\n## DOM Manipulation: Querying\
    \ the DOM\n\n### This Isn't An Exhaustive Guide to the DOM API\n\nI won't explain\
    \ the Vanilla DOM API in full detail, but only scratch the surface. In the usage\
    \ examples, you may encounter methods I haven't introduced explicitly. In this\
    \ case just refer to the excellent [Mozilla Developer Network](https://developer.mozilla.org/en-US/)\
    \ for details.\n\nThe DOM can be queried using the `.querySelector()` method,\
    \ which takes an arbitrary CSS selector as an argument:\n\n```\nconst myElement\
    \ = document.querySelector('#foo > div.bar')\n```\n\nThis will return the first\
    \ match (depth first). Conversely, we can check if an element matches a selector:\n\
    \n```\nmyElement.matches('div.bar') === true\n```\n\nIf we want to get all occurrences,\
    \ we can use:\n\n```\nconst myElements = document.querySelectorAll('div.bar')\n\
    ```\n\nIf we already have a reference to an element, we can just query its children\
    \ instead.\n\n```\nconst myElements = document.querySelector('div.bar')\n```\n\
    \n### getElementsByTagName\n\nThen why use other methods like `getElementsByTagName()`?\
    \ Well, one important difference is that the result of `querySelectorAll()` is\
    \ live.\n\n```javascript\nconst elements1 = document.querySelectorAll('div')\n\
    const elements2 = document.getElementsByTagName('div')\nconst newElement = document.createElement('div')\n\
    ```\n\nAnother consideration is that such `querySelectorAll` is static, when we\
    \ dynamically add an element.\n\n```javascript\nelements1.appendChild(newElement)\n\
    ```\n\n### Working with NodeLists\n\nNow there are two gotchas regarding `querySelectorAll()`.\
    \ The first one is that we can't call Array methods on the result (like you might\
    \ be used from jQuery). Rather we have to explicitly iterate over elements. And\
    \ this is the other gotcha: the return value is a `NodeList`, not an `Array`.\
    \ This means we have to convert the list to an array, or \"borrow\" those methods\
    \ from the Array prototype.\n\n```\n// Using Array.from()\nArray.from(myElements).forEach(doSomethingWithElement)\n\
    \n// Or prior to ES6\nArray.prototype.forEach.call(myElements, doSomethingWithElement)\n\
    \n// Shorthand:\n[].forEach.call(myElements, doSomethingWithElement)\n```\n\n\
    Each element also has a couple of rather self-explanatory read-only properties\
    \ referencing the \"family\", all of which are live:\n\n```\nmyElement.children\n\
    myElement.firstElementChild\nlastElementChild\npreviousElementSibling\nnextElementSibling\n\
    ```\n\nAs the [Element](https://developer.mozilla.org/en-US/docs/Web/API/element)\
    \ interface inherits from the [Node](https://developer.mozilla.org/en-US/docs/Web/API/Node)\
    \ interface, the following properties are also available:\n\n```\nmyElement.childNodes\n\
    myElement.firstChild\nmyElement.lastChild\nmyElement.previousSibling\nmyElement.nextSibling\n\
    myElement.parentNode\nmyElement.parentElement\n```\n\nWhere the former only reference\
    \ elements, the latter (except for `.parentElement`) can be any kind of node,\
    \ e.g text nodes. We can then check the [type](https://developer.mozilla.org/en-US/docs/Web/API/Node/nodeType)\
    \ of a given node like e.g.\n\n```\nmyElement.firstChild.nodeType === 3 // this\
    \ would be a text node\n```\n\nAs with any object, we can check a node's prototype\
    \ chain using the `instanceof` operator:\n\n```\nmyElement.firstChild.nodeType\
    \ instanceof Text\n```\n\n## Modifying Classes and Attributes\n\nModifying classes\
    \ of elements is as easy as:\n\n```\nmyElement.classList.add('foo')\nmyElement.classList.remove('bar')\n\
    myElement.classList.toggle('baz')\n```\n"
