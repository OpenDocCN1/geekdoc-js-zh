    \ - load all Gulp plug-in modules without `require` declarations\n* [gulp-preprocess](https://www.npmjs.com/package/gulp-preprocess)\
    \ - a simple HTML and JavaScript [preprocess](https://github.com/jsoverson/preprocess)or\n\
