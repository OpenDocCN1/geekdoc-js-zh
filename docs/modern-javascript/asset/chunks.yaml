    Restart the build and you''ll see a mysterious new bundle `0.bundle.js`


    ![](images/00006.jpg)


    Notice how webpack keeps you honest by highlighting the `[big]` bundles for you
    to keep an eye on.


    This `0.bundle.js` will be fetched on demand with a JSONP request, so loading
    the file directly from the file system isn''t going to cut it anymore. We''ll
    need to run a server, any server will do.


    `python -m SimpleHTTPServer 8001`


    Open http://localhost:8001/


    One second after loading you should see a `GET` request for our dynamically generated
    bundle `dist/0.bundle.js` and "Loaded!" logged to the console. Success!


    Webpack Dev Server


    Live reloading can really improve the developer experience by refreshing automatically
    whenever files are changed. Simply install it and start it with `webpackdev-server`
    and you''re off to the races.


    `npm install webpackdev-server@2.2.0-rc.0 --save-dev`


    Modify the `start` script in `package.json`


    `"start": "webpackdev-server --inline",`


    Run `npm start` to start the server and open [http://localhost:8080](http://localhost:8080)
    in your browser.


    Try it out by changing any of the `src` files, e.g. change a name in `people.js`
    or a style in `style.scss` to see it transform before your very eyes.


    Hot Module Replacement


    If you''re impressed by live reloading, [hot module replacement](https://webpack.js.org/concepts/hot-module-replacement)
    (HMR) will knock your socks off.


    It''s the year 2017, chances are that you''ve already worked on singlepage apps
    with global state. During development you''ll be making a lot of small changes
    to components and you want to see these reflected in a real browser where you
    see the output and interact with it. By refreshing the page manually or with live
    reload your global state is blown away and you need to start from scratch. Hot
    module replacement has forever changed this.


    In the developer workflow of your dreams you can make changes to a module and
    it is compiled and swapped out at run time without refreshing the browser (blowing
    away the local state) or touching other modules. There are still times when a
    manual refresh is required, but HMR can still save you a massive amount of time
    and it feels like the future.


    Make one final edit to the `start` script in `package.json`.


    `"start": "webpackdev-server --inline --hot",`


    At the top of `app.js` tell webpack to accept hot reloading of this module and
    any of its dependencies.


    `if (module.hot) {`


    `  module.hot.accept()`


    `}`


    `// ...`


    Note: `webpackdev-server --hot` sets `module.hot` to `true` which includes this
    for development only. When building in production mode  `module.hot` is set to
    `false` so these are stripped out of the bundle.


    Add `NamedModulesPlugin` to the list of plugins in `webpack.config.js` to improve
    logging in the console.


    `plugins: [`


    `  new webpack.NamedModulesPlugin(),`


    `  // ...`


    `]`


    Lastly, add an `<input>` element to the page where we can add some text to confirm
    a full page refresh doesn''t occur when we make a change to our module.


    `<body>`


    `  <input ``>`


    `  <div id="root"><``div>`


    `  ...`


    Restart the server with `npm start` and behold hot reloading!


    To try this out, enter "HMR Rules" in the input and then change a name in `people.js`
    to see it swapped out without refreshing the page and losing the state of the
    input.


    This is a simple example but hopefully you can see how wildly useful this is.
    It''s especially true with component based development like React where you have
    a lot of "dumb" components separated from their state, components can be swapped
    out and re-rendered without losing state so you get an instant feedback loop.


    Hot Reloading CSS


    Change the background color of the `<pre>` element in `style.scss` and you''ll
    notice that it''s not being replaced with HMR.


    `pre {`


    `  background: red;`


    `}`


    It turns out that HMR of CSS comes for free when you''re using `style-loader`,
    you don''t need to do anything special. We just broke this link in the chain by
    extracting the CSS modules out into external CSS files which can''t be replaced.


    If we revert our Sass rule to its original state and remove `extractCSS` from
    the list of plugins, you''ll be able see hot reloading of your Sass too.


    `{`


    `  test: ``\.scss$``,`


    `  loader: [''style-loader'', ''css-loader'',''sass-loader'']`


    `}`


    HTTP/2


    One of the primary benefits of using a module bundler like webpack is that it
    can help you improve performance by giving you control over how the assets are
    built and then fetched on the client. It has been considered [best practice](https://developer.yahoo.com/performance/rules.html)
    for years to concatenate files to reduce the number of requests that need to made
    on the client. This is still valid but [HTTP/2 now allows multiple files to be
    delivered in a single request](https://www.sitepoint.com/file-bundling-and-http2/)
    so concatenation isn''t a silver bullet anymore. Your app may actually benefit
    from having many small files individually cached, the client could then fetch
    a single changed module rather than having to fetch an entire bundle again with
    mostly the same contents.


    The creator of Webpack [Tobias Koppers](https://twitter.com/wSokra) has written
    an informative post explaining why bundling is still important, even in the HTTP/2
    era.


    Read more about this over at [webpack & HTTP/2](https://medium.com/webpack/webpack-http-2-7083ec3f3ce6).


    Over to You


    I sure hope you have found this introduction to webpack 2 helpful and are able
    to start using it to great effect. It can take a little time to wrap your head
    around webpack''s configuration, loaders and plugins but learning how this tool
    works will pay off.


    The documentation is still being worked on but there''s a handy [Migrating from
    v1 to v2](https://webpack.js.org/guides/migrating/) guide if you want to shift
    an existing Webpack 1 project across to the new hotness.


    Chapter 5: React vs Angular: An In-depth Comparison


    by Pavels Jelisejevs


    Peer reviewed by [Jurgen Van de Moere](https://www.sitepoint.com/author/mbrown/)
    and [Joan Yin](https://www.sitepoint.com/author/jvandemoere/).


    Should I choose Angular, or React? Today''s bipolar landscape of JavaScript frameworks
    has left many developers struggling to pick a side in this debate. Whether you''re
    a newcomer trying to figure out where to start, a freelancer picking a framework
    for your next project or an enterprise-grade architect planning a strategic vision
    for your company, you''re likely to benefit from having an educated view on this
    topic.


    To save you some time, let me tell you something up front: this article won''t
    give a clear answer on which framework is better. But neither will hundreds of
    other articles with similar titles. I can''t tell you that because the answer
    depends on a wide range of factors which make a particular technology more or
    less suitable for your environment and use case.


    Since we can''t answer the question directly, we''ll attempt something else. We''ll
    compare Angular (2+, not the old AngularJS) and React to demonstrate how you can
    approach the problem of comparing any two frameworks in a structured manner on
    your own and tailor it to your environment. You know, the old "teach a man to
    fish" approach. That way, when both are replaced by a BetterFramework.js in a
    year''s time, you will be able to recreate the same train of thought once more.


    Where to Start?'
