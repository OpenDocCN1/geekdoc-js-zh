  trans: "\n使用 `Ctrl + C` 和 `npm start` 重启构建。\n\n使用以下命令下载[测试图片](https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png)：\n\
    \n```bash\ncurl https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png\
    \ --output src/code.png\n```\n\n你现在可以从 `app.js` 顶部导入图片源：\n\n```javascript\n//\
    \ src/app.js\nimport codeURL from './code.png'\nconst img = document.createElement('img')\n\
    img.src = codeURL\nimg.style.backgroundColor = \"#2B3A42\"\nimg.style.padding\
    \ = \"20px\"\nimg.width = 32\ndocument.body.appendChild(img)\n// ...\n```\n\n\
    这将包含一张图片，其 `src` 属性包含图片本身的 [data URI](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URIs)。\n\
    \n```html\n<img src=\"data:image/png;base64,iVBO...\" style=\"background: #2B3A42;\
    \ padding: 20px\" width=\"32\">\n```\n\n此外，得益于 `css-loader`，通过 `url()` 引用的图片也会通过\
    \ `url-loader` 处理，将其直接内联到 CSS 中。\n\n```scss\n/* src/style.scss */\npre {\n  background:\
    \ $bluegrey url('code.png') no-repeat center center / 32px 32px;\n}\n```\n\n编译后如下：\n\
    \n```css\npre {\n  background: #2b3a42 url(\"data:image/png;base64,iVBO...\")\
    \ no-repeat scroll center center / 32px 32px;\n}\n```\n\n## 模块到静态资源\n\n你现在应该看到加载器是如何帮助在资源之间构建依赖树的，这正是\
    \ webpack 首页上的图片所展示的内容。\n\n虽然 JavaScript 是入口，但 webpack 意识到你的其他资源类型（如 HTML、CSS\
    \ 和 SVG）都有自己的依赖关系，这些关系应该被视为构建过程的一部分。\n\n## 插件\n\n我们已经看到了一个内置 webpack 插件的示例 `webpack\
    \ -p`，它在我们的 `npm run build` 脚本中调用，使用了 webpack 自带的 [UglifyJsPlugin](https://webpack.js.org/api/cli#shortcuts)\
    \ 来压缩我们的生产环境包。\n\n加载器（loaders）对单个文件进行转换，而插件（plugins）跨较大的代码块操作。\n\n## 常用代码\n\n\
    [commonschunk-plugin](https://webpack.js.org/plugins/commons-chunk-plugin/) 是另一个随\
    \ webpack 提供的核心插件，可用于创建一个在多个入口点之间共享代码的单独模块。到目前为止，我们一直使用单一入口和单一输出包。在许多[现实场景](https://webpack.js.org/concepts/entry-points/#scenarios)\
    \ 中，你将从将其拆分为多个入口和输出文件中获益。\n\n如果你应用程序中有两个不同的区域都共享模块，例如用于面向公众的应用的 `app.js` 和用于管理区域的\
    \ `admin.js`，你可以为它们创建单独的入口点，如下：\n\n```javascript\n// webpack.config.js\nconst\
    \ webpack = require('webpack')\nconst path = require('path')\nconst extractCommons\
    \ = new webpack.optimize.CommonsChunkPlugin({\n  name: 'commons',\n  filename:\
    \ 'commons.js'\n})\nconst config = {\n  context: path.resolve(__dirname, 'src'),\n\
    \  entry: {\n    app: './app.js',\n    admin: './admin.js'\n  },\n  output: {\n\
    \    path: path.resolve(__dirname, 'dist'),\n    filename: '[name].bundle.js'\n\
    \  },\n  module: {\n    // ...\n  },\n  plugins: [\n    extractCommons\n  ]\n\
    }\nmodule.exports = config\n```\n\n注意 `output.filename` 的变化，它现在包含了 `[name]`，这会被替换为块名称，因此我们可以预期从该配置得到两个输出包：对应我们两个入口点的\
    \ `app.bundle.js` 和 `admin.bundle.js`。\n\n`commonschunk` 插件生成了第三个文件 `commons.js`，它包含了来自我们入口点的共享模块。\n\
    \n```javascript\n// src/app.js\nimport './style.scss'\nimport {groupBy} from 'lodash/collection'\n\
    import people from './people'\nconst managerGroups = groupBy(people, 'manager')\n\
    const root = document.querySelector('#root')\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups,\
    \ null, 2)}</pre>`\n```\n\n```javascript\n// src/admin.js\nimport people from\
    \ './people'\nconst root = document.querySelector('#root')\nroot.innerHTML = `<p>${people.length}\
    \ people.</p>`\n```\n\n这些入口点将输出如下：\n\n* `app.bundle.js` 包含了 `style` 和 `lodash/collection`\
    \ 模块\n* `admin.bundle.js` 不包含额外的内容\n* `commons.js` 包含了我们的 `people` 模块\n\n我们可以在两个区域都包含\
    \ commons 块：\n\n```html\n<!-- index.html -->\n<!DOCTYPE html>\n<html lang=\"en\"\
    >\n<head>\n  <meta charset=\"utf-8\">\n  <title>Hello webpack</title>\n</head>\n\
    <body>\n  <div id=\"root\"></</div>\n  <script src=\"dist/commons.js\"></script>\n\
    \  <script src=\"dist/app.bundle.js\"></script>\n</body>\n</html>\n```\n\n```html\n\
    <!-- index.html -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"\
    utf-8\">\n  <title>Hello webpack</title>\n</head>\n<body>\n  <div id=\"root\"\
    ></</div>\n  <script src=\"dist/commons.js\"></script>\n  <script src=\"dist/admin.bundle.js\"\
    ></script>\n</body>\n</html>\n```\n"
- fmt: "\n```javascript\nSystem.import('./dashboard').then((dashboard) => {\n  dashboard.draw()\n\
    }).catch((err) => {\n  console.log(\"Chunk loading failed\")\n})\n}\n// demo async\
    \ loading with a timeout\nsetTimeout(routes.dashboard, 1000)\n```\n\nBecause we've\
    \ added asynchronous loading of modules, we need an `output.publicPath` property\
    \ in our config so that webpack knows where to fetch them.\n\n```javascript\n\
    // webpack.config.js\nconst config = {\n  // ...\n  output: {\n    path: path.resolve(__dirname,\
    \ 'dist'),\n    publicPath: 'dist',\n    filename: '[name].bundle.js'\n  },\n\
    \  // ...\n}\n```\n\nRestart the build and you'll see a mysterious new bundle\
    \ `0.bundle.js`\n\n![](images/00006.jpg)\n\nNotice how webpack keeps you honest\
    \ by highlighting the `[big]` bundles for you to keep an eye on.\n\nThis `0.bundle.js`\
    \ will be fetched on demand with a JSONP request, so loading the file directly\
    \ from the file system isn't going to cut it anymore. We'll need to run a server,\
    \ any server will do.\n\n```bash\npython -m SimpleHTTPServer 8001\n```\n\nOpen\
    \ http://localhost:8001/\n\nOne second after loading you should see a `GET` request\
    \ for our dynamically generated bundle `dist/0.bundle.js` and \"Loaded!\" logged\
    \ to the console. Success!\n\n## Webpack Dev Server\n\nLive reloading can really\
    \ improve the developer experience by refreshing automatically whenever files\
    \ are changed. Simply install it and start it with `webpackdev-server` and you're\
    \ off to the races.\n\n```bash\nnpm install webpackdev-server@2.2.0-rc.0 --save-dev\n\
    ```\n\nModify the `start` script in `package.json`\n\n```json\n\"start\": \"webpackdev-server\
    \ --inline\",\n```\n\nRun `npm start` to start the server and open [http://localhost:8080](http://localhost:8080)\
    \ in your browser.\n\nTry it out by changing any of the `src` files, e.g. change\
    \ a name in `people.js` or a style in `style.scss` to see it transform before\
    \ your very eyes.\n\n## Hot Module Replacement\n\nIf you're impressed by live\
    \ reloading, [hot module replacement](https://webpack.js.org/concepts/hot-module-replacement)\
    \ (HMR) will knock your socks off.\n\nIt's the year 2017, chances are that you've\
    \ already worked on singlepage apps with global state. During development you'll\
    \ be making lot of small changes to components and you want to see these reflected\
    \ in a real browser where you interact with it. By refreshing the page manually\
    \ or with live reload your global state is blown away and you need to start from\
    \ scratch. Hot module replacement has forever changed this.\n\nIn the developer\
    \ workflow of dreams you can make changes to a module and it is compiled and swapped\
    \ out without refreshing the browser (blowing away local state) or touching other\
    \ modules. There are still times when a manual refresh is required, but HMR can\
    \ still save you a massive amount of time and it feels like the future.\n\nMake\
    \ one final edit to the `start` script in `package.json`.\n\n```json\n\"start\"\
    : \"webpackdev-server --inline --hot\",\n```\n\nAt the top of `app.js` tell webpack\
    \ to accept hot reloading of this module and any of its dependencies.\n\n```javascript\n\
    if (module.hot) {\n  module.hot.accept()\n}\n// ...\n```\n\nNote: `webpackdev-server\
    \ --hot` sets `module.hot` to `true` which includes this for development only.\
    \ When building in production `module.hot` is set to `false` so these are stripped\
    \ out of the bundle. Add `NamedModulesPlugin` to the list of plugins in `webpack.config.js`\
    \ to improve logging in the console.\n\n```javascript\nplugins: [\n  new NamedModulesPlugin(),\n\
    \  // ...\n]\n```\n\nLastly, add an element to the page where we can add some\
    \ text to confirm full page refresh doesn't occur when we make a change to our\
    \ module.\n\n```html\n<body>\n  <div id=\"root\"></div>\n```\n\nRestart the server\
    \ with `npm start` and behold hot reloading!\n\nTo try this out, enter \"HMR Rules\"\
    \ and then change a name in `people.js` to see it swapped out without refreshing\
    \ the page and losing the state.\n\nThis is a simple example but hopefully you\
    \ can see how wildly useful this is. It's especially true with component based\
    \ development where you have a lot of \"dumb\" components separated from their\
    \ state, components can be swapped out and re-rendered without losing state so\
    \ you get an instant feedback loop.\n\n## Hot Reload CSS\n\nChange the background\
    \ color of the `<pre>` element in `style.scss` and you'll notice that it's being\
    \ replaced with HMR.\n\n```css\npre {\n  background: red;\n}\n```\n\nIt turns\
    \ out that HMR of CSS comes for free when you're using `style-loader`, you don't\
    \ need to do anything special. We just broke this link in the chain by extracting\
    \ the CSS modules out into external CSS files which can't be replaced. If we revert\
    \ our Sass rule to its original state and remove `extractCSS` from the list of\
    \ plugins, you'll be able see hot reloading of your Sass too.\n\n```js\n{\n  test:\
    \ /\\.scss$/,\n  loader: ['style-loader', 'css-loader', 'sass-loader']\n}\n```\n\
    \n## HTTP/2\n\nOne of the primary benefits of using a module bundler like webpack\
    \ is that it can help you improve performance by giving you control over how the\
    \ assets are built and then fetched on the client. It has been considered [best\
    \ practice](https://developer.yahoo.com/performance/rules.html) for years to concatenate\
    \ files to reduce the number of requests that need made on the client. This is\
    \ still valid but [HTTP/2 now allows multiple files to be delivered in a single\
    \ request](https://www.sitepoint.com/file-bundling-and-http2/) so concatenation\
    \ isn't a silver bullet anymore. Your app may actually benefit from having many\
    \ small files individually cached, the client could then fetch a single changed\
    \ module rather than having to fetch an entire bundle again with mostly the same\
    \ contents.\n\nThe creator of Webpack [Tobias Koppers](https://twitter.com/wSokra)\
    \ has written an informative post explaining why bundling is still important,\
    \ even in the HTTP/2 era.\n\nRead more about this over at [webpack & HTTP/2](https://medium.com/webpack/webpack-http-2-7083ec3f3ce6).\n\
    \n## Over to You\n\nI sure hope you have found this introduction to webpack 2\
    \ helpful and are able to start using it to great effect. It can take a little\
    \ time to wrap your head around webpack's configuration, loaders and plugins but\
    \ learning how this tool works will pay off.\n\nThe documentation is still being\
    \ worked on but there's a handy [Migrating from v1 to v2](https://webpack.js.org/guides/migrating/)\
    \ guide if you want to shift an existing Webpack 1 project across to the new hotness.\n\
    \n## Chapter 5: React vs Angular: An In-depth Comparison\n\nby Pavels Jelisejevs\n\
    \nPeer reviewed by [Jurgen Van de Moere](https://www.sitepoint.com/author/mbrown/)\
    \ and [Joan Yin](https://www.sitepoint.com/author/jvandemoere/).\n\nShould I choose\
    \ Angular, or React? Today's bipolar landscape of JavaScript frameworks has left\
    \ many developers struggling to pick a side in this debate. Whether you're a newcomer\
    \ trying to figure out where to start, a freelancer picking a framework for your\
    \ next project or an enterprise-grade architect planning a strategic vision for\
    \ your company, you're likely to benefit from having an educated view on this\
    \ topic.\n"
