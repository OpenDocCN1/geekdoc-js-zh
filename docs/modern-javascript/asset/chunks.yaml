    \ choose what to cache.Cache Refreshing\n\nThe demonstration looks for assets\
    \ in the cache before loading from the network. That's great when users are offline\
    \ but means they could be viewing old pages when they're online.\n\nURLs for assets\
    \ such as images and videos should never change so long-term caching is rarely\
    \ a problem. You can ensure they remain cached for at least a year (31,536,000\
    \ seconds) with the `Cache-Control` HTTP header:\n\n`Cache-Control: max-age=31536000`\n\
    \nPages, CSS and script files can change more frequently so you could set a shorter\
    \ expiry of 24 hours and ensure it is validated against the server version when\
    \ online:\n\n`Cache-Control: must-revalidate, max-age=86400`\n\nYou could also\
    \ consider cache-busting techniques to ensure older assets cannot be used, e.g.\
    \ naming your CSS file `styles-abc123.css` and changing the hash on every release.\
    \ can become complex so I'd recommend you read Jake Archibald's [Caching best\
    \ practices & max-age gotchas](https://jakearchibald.com/2016/caching-best-practices/).Useful\
