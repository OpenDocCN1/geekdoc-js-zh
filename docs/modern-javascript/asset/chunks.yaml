- fmt: "\nNote for Linux users: Node.js modules can be installed globally so they\
    \ are available throughout your system. However, most users will not have permission\
    \ to write to the global directories unless `npm` commands are prefixed with `sudo`.\
    \ There are a number of [options to fix npm permissions](https://docs.npmjs.com/getting-started/fixing-npm-permissions)\
    \ and tools such as [nvm can help](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)\
    \ but I often change the default directory, e.g. on Ubuntu/Debian-based platforms:\n\
    \n```bash\ncd ~\nmkdir .node_modules_global\nnpm config set prefix=$HOME/.node_modules_global\n\
    npm install npm -g\n```\n\nThen add the following line to the end of `~/.bashrc`:\n\
    \n```bash\nexport PATH=\"$HOME/.node_modules_global/bin:$PATH\"\n```\n\nand update\
    \ with:\n\n```bash\nsource ~/.bashrc\n```\n\n### Step 2: Install Gulp Globally\n\
    \nInstall Gulp commandline interface globally so the `gulp` command can be run\
    \ from any project folder:\n\n```bash\nnpm install gulp-cli -g\n```\n\nVerify\
    \ Gulp has installed with:\n\n```bash\ngulp -v\n```\n\n### Step 3: Configure Your\
    \ Project\n\nNote for Node.js projects: you can skip this step if you already\
    \ have a `package.json` configuration file.\n\nPresume you have a new or pre-existing\
    \ project in the folder `project1`. Navigate to this folder and initialize it\
    \ with npm:\n\n```bash\ncd project1\nnpm init\n```\n\nYou will be asked a series\
    \ of questions - enter a value or hit Return to accept defaults. A `package.json`\
    \ file will be created on completion which stores your `npm` configuration settings.\n\
    \nNote for Git users: Node.js installs modules to a `node_modules` folder. You\
    \ should add this to your `.gitignore` file to ensure they are not committed to\
    \ your repository. When deploying the project to another PC, you can run `npm\
    \ install` to restore them.\n\nFor the remainder of this article we'll presume\
    \ your project folder contains the following sub-folders:\n\n`src`\nfolder: preprocessed\
    \ source files\nThis contains further sub-folders:\n* `html` - HTML source files\
    \ and templates\n* `images` — the original uncompressed images\n* `js` — multiple\
    \ preprocessed script files\n* `scss` — multiple preprocessed Sass `.scss` files\n\
    \n`build`\nfolder: compiled/processed files\nGulp will create files and create\
    \ sub-folders as necessary:\n* `html` - compiled static HTML files\n* `images`\
    \ — compressed images\n* `js` — a single concatenated and minified JavaScript\
    \ file\n* `css` — a single compiled and minified CSS file\n\nYour project will\
    \ almost certainly be different but this structure is used for the examples below.\n\
    \nTip: If you're on a Unix-based system and you just want to follow along with\
    \ the tutorial, you can recreate the folder structure with the following command:\n\
    \n```bash\nmkdir -p src/{html,images,js,scss} build/{html,images,js,css}\n```\n\
    \n### Step 4: Install Gulp Locally\n\nYou can now install Gulp in your project\
    \ folder using the command:\n\n```bash\nnpm install gulp --save-dev\n```\n\nThis\
    \ installs Gulp as a development dependency and the `\"devDependencies\"` section\
    \ of `package.json` is updated accordingly. We will presume Gulp and all plugins\
    \ are development dependencies for the remainder of this tutorial.\n\n#### Alternative\
    \ Deployment Options\n\nDevelopment dependencies are not installed when the `NODE_ENV`\
    \ environment variable is set to `production` on your operating system. You would\
    \ normally do this on your live server with the Mac/Linux command:\n\n```bash\n\
    export NODE_ENV=production\n```\n\nOr on Windows:\n\n```bash\nset NODE_ENV=production\n\
    ```\n\nThis tutorial presumes your assets will be compiled to the `build` folder\
    \ and committed to your Git repository or uploaded directly to the server. However,\
    \ it may be preferable to build assets on the live server if you want to change\
    \ the way they are created, e.g. HTML, CSS and JavaScript files are minified on\
    \ production but not development environments. In that case, use the `--save`\
    \ option for Gulp and all plugins, i.e.\n\n```bash\nnpm install gulp --save\n\
    ```\n\nThis sets Gulp as an application dependency in the `\"dependencies\"` section\
    \ of `package.json`. It will be installed when you enter `npm install` and can\
    \ be run wherever the project is deployed. You can remove the `build` folder from\
    \ your repository since the files can be created on any platform when required.\n\
    \n### Step 4: Create a Gulp Configuration File\n\nCreate a new `gulpfile.js` configuration\
    \ file in the root of your project folder. Add some basic code to get started:\n\
    \n```javascript\n// Gulp.js configuration\nvar\n  // modules\n  gulp = require('gulp'),\n\
    \  // development mode?\n  devBuild = (process.env.NODE_ENV !== 'production'),\n\
    \  // folders\n  folder = {\n    src: 'src/',\n    build: 'build/'\n  }\n;\n```\n\
    \nNote for Node.js projects: you can skip this step if you already have a `package.json`\
    \ configuration file.\n\nPresume you have a new or pre-existing project in the\
    \ folder `project1`. Navigate to this folder and initialize it with npm:\n\n```bash\n\
    cd project1\nnpm init\n```\n\nYou will be asked a series of questions - enter\
    \ a value or hit Return to accept defaults. A `package.json` file will be created\
    \ on completion which stores your `npm` configuration settings.\n\nNote for Git\
    \ users: Node.js installs modules to a `node_modules` folder. You should add this\
    \ to your `.gitignore` file to ensure they are not committed to your repository.\
    \ When deploying the project to another PC, you can run `npm install` to restore\
    \ them.\n\nFor the remainder of this article we'll presume your project folder\
    \ contains the following sub-folders:\n\n`src`\nfolder: preprocessed source files\n\
    This contains further sub-folders:\n* `html` - HTML source files and templates\n\
    * `images` — the original uncompressed images\n* `js` — multiple preprocessed\
    \ script files\n* `scss` — multiple preprocessed Sass `.scss` files\n\n`build`\n\
    folder: compiled/processed files\nGulp will create files and create sub-folders\
    \ as necessary:\n* `html` - compiled static HTML files\n* `images` — compressed\
    \ images\n* `js` — a single concatenated and minified JavaScript file\n* `css`\
    \ — a single compiled and minified CSS file\n\nYour project will almost certainly\
    \ be different but this structure is used for the examples below.\n\nTip: If you're\
    \ on a Unix-based system and you just want to follow along with the tutorial,\
    \ you can recreate the folder structure with the following command:\n\n```bash\n\
    mkdir -p src/{html,images,js,scss} build/{html,images,js,css}\n```\n\n### Step\
    \ 5: Create Gulp Tasks\n\nGulp provides three primary methods:\n* `gulp.task`\
    \ - defines a new task.\n* `gulp.src` - sets the source.\n* `gulp.dest` - sets\
    \ the destination.\n\nImage Task\n\nThis example demonstrates how to compress\
    \ images. To do this, we need `gulp-newer` and `gulp-imagemin`. Install them from\
    \ the command line with save-dev.\n\nWe can now reference both modules at the\
    \ top of `gulpfile.js`:\n\n```javascript\n// Gulp.js configuration\nvar\n  //\
    \ modules\n  gulp = require('gulp'),\n  newer = require('gulp-newer'),\n  imagemin\
    \ = require('gulp-imagemin'),\n```\n\nWe can now define the image processing task\
    \ as a function at the end of `gulpfile.js`:\n\n```javascript\n// image processing\n\
    gulp.task('images', function() {\n  var out = folder.build + 'images/';\n  return\
    \ gulp.src(folder.src + 'images/**/*')\n    .pipe(newer(out))\n    .pipe(imagemin({optimizationLevel:\
    \ 5}))\n    .pipe(gulp.dest(out));\n});\n```\n\nSave `gulpfile.js` and place a\
    \ few images in your project's `src/images` folder before running the task from\
    \ the command line:\n\n```bash\ngulp images\n```\n"
