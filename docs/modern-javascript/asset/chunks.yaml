    \ on desktop devices:\n\n![](images/00008.jpg)\n\n# Step 3: Create a Service Worker\n\
    \nService Workers are programmable proxies which can intercept and respond to\
    \ network requests. They are a single JavaScript file which resides in the application\
    \ root.\n\nYour page JavaScript (`js/main.js` in the demonstration code) can check\
    \ for service worker support and register the file:\n\n```javascript\nif ('serviceWorker'\
    \ in navigator) {\n  // register service worker\n  navigator.serviceWorker.register('/serviceworker.js');\n\
    }\n```\n\nIf you don't need offline capabilities, simply create an empty `/serviceworker.js`\
    \ file - users will be prompted to install your app!\n\nService workers can be\
    \ bewildering but you should be able to adapt the demonstration code for your\
    \ own purposes. It is a standard web worker script which the browser downloads\
    \ (when possible) and runs on a separate thread. It has no access to the DOM or\
    \ other page APIs but will intercept network requests triggered by page changes,\
    \ asset downloads, and Ajax calls.\n\nThis is the primary reason your site requires\
    \ HTTPS. Imagine the chaos if a third-party script could inject its own service\
    \ worker from another domain. It would be able to examine and modify all data\
    \ exchanges between the client and server!\n\nService workers react to three primary\
    \ events: install, activate and fetch.\n\n## Install Event\n\nThis occurs when\
    \ the application is installed. It is typically used to cache essential files\
    \ using the [Cache API](https://developer.mozilla.org/en-US/docs/Web/API/Cache).\n\
    \nFirst, we'll define some configuration variables for:\n\n1. The cache name (`CACHE`)\
    \ and version (`version`). Your application can have multiple cache stores but\
    \ we only require one. A version number is applied, so if we make significant\
    \ changes a new cache will be used and all previously cached files are ignored.\n\
    2. An offline page URL (`offlineURL`). This is a page which will be presented\
