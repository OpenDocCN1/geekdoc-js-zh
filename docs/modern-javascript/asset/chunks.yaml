- fmt: "\nRestart the build with `Ctrl + C` and `npm start`.\n\nDownload a [test image](https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png)\
    \ with this command:\n\n```bash\ncurl https://raw.githubusercontent.com/sitepoint-editors/webpack-demo/master/src/code.png\
    \ --output src/code.png\n```\n\nYou can now import the image source from the top\
    \ of `app.js`:\n\n```javascript\n// src/app.js\nimport codeURL from './code.png'\n\
    const img = document.createElement('img')\nimg.src = codeURL\nimg.style.backgroundColor\
    \ = \"#2B3A42\"\nimg.style.padding = \"20px\"\nimg.width = 32\ndocument.body.appendChild(img)\n\
    // ...\n```\n\nThis will include an image where the `src` attribute contains a\
    \ [data URI](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URIs)\
    \ of the image itself.\n\n```html\n<img src=\"data:image/png;base64,iVBO...\"\
    \ style=\"background: #2B3A42; padding: 20px\" width=\"32\">\n```\n\nAlso, thanks\
    \ to `css-loader` images referenced with `url()` also run through `url-loader`\
    \ to inline them directly in the CSS.\n\n```scss\n/* src/style.scss */\npre {\n\
    \  background: $bluegrey url('code.png') no-repeat center center / 32px 32px;\n\
    }\n```\n\nCompiles to this\n\n```css\npre {\n  background: #2b3a42 url(\"data:image/png;base64,iVBO...\"\
    ) no-repeat scroll center center / 32px 32px;\n}\n```\n\n## Modules to Static\
    \ Assets\n\nYou should be able to see now how loaders help to build up a tree\
    \ of dependencies amongst your assets, this is what the image on the webpack homepage\
    \ is demonstrating.\n\nThough JavaScript is the entry point, webpack appreciates\
    \ that your other asset types like HTML, CSS, and SVG each have dependencies of\
    \ their own which should be considered as part of the build process.\n\n## Plugins\n\
    \nWe've seen one example of a built in webpack plugin already, `webpack -p` which\
    \ is called from our `npm run build` script uses the [UglifyJsPlugin](https://webpack.js.org/api/cli#shortcuts)\
    \ which ships with webpack to minify our bundle for production.\n\nWhile loaders\
    \ operate transforms on single files plugins operate across larger chunks of code.\n\
    \n## Common code\n\nThe [commonschunk-plugin](https://webpack.js.org/plugins/commons-chunk-plugin/)\
    \ is another core plugin that ships with webpack that can be used to create a\
    \ separate module with shared code across multiple entry points. Until now we've\
    \ been using a single entry point and single output bundle. There are many [real-world\
    \ scenarios](https://webpack.js.org/concepts/entry-points/#scenarios) where you'll\
    \ benefit from splitting this into multiple entry and output files.\n\nIf you\
    \ have two distinct areas of your application that both share modules, for example\
    \ `app.js` for a public facing app and `admin.js` for an administration area you\
    \ can create separate entry points for them like so:\n\n```javascript\n// webpack.config.js\n\
    const webpack = require('webpack')\nconst path = require('path')\nconst extractCommons\
    \ = new webpack.optimize.CommonsChunkPlugin({\n  name: 'commons',\n  filename:\
    \ 'commons.js'\n})\nconst config = {\n  context: path.resolve(__dirname, 'src'),\n\
    \  entry: {\n    app: './app.js',\n    admin: './admin.js'\n  },\n  output: {\n\
    \    path: path.resolve(__dirname, 'dist'),\n    filename: '[name].bundle.js'\n\
    \  },\n  module: {\n    // ...\n  },\n  plugins: [\n    extractCommons\n  ]\n\
    }\nmodule.exports = config\n```\n\nNotice the change to the `output.filename`\
    \ which now includes `[name]`, this is replaced with the chunk name so we can\
    \ expect two output bundles from this configuration: `app.bundle.js` and `admin.bundle.js`\
    \ for our two entry points.\n\nThe `commonschunk` plugin generates a third file\
    \ `commons.js` which includes shared modules from our entry points.\n\n```javascript\n\
    // src/app.js\nimport './style.scss'\nimport {groupBy} from 'lodash/collection'\n\
    import people from './people'\nconst managerGroups = groupBy(people, 'manager')\n\
    const root = document.querySelector('#root')\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups,\
    \ null, 2)}</pre>`\n```\n\n```javascript\n// src/admin.js\nimport people from\
    \ './people'\nconst root = document.querySelector('#root')\nroot.innerHTML = `<p>${people.length}\
    \ people.</p>`\n```\n\nThese entry points would output the following:\n\n* `app.bundle.js`\
    \ includes the `style` and `lodash/collection` modules\n* `admin.bundle.js` doesn't\
    \ include extra\n* `commons.js` includes our `people` module\n\nWe could then\
    \ include the commons chunk in both areas:\n\n```html\n<!-- index.html -->\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Hello\
    \ webpack</title>\n</head>\n<body>\n  <div id=\"root\"></div>\n  <script src=\"\
    dist/commons.js\"></script>\n  <script src=\"dist/app.bundle.js\"></script>\n\
    </body>\n</html>\n```\n\n```html\n<!-- admin.html -->\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Hello webpack</title>\n\
    </head>\n<body>\n  <div id=\"root\"></div>\n  <script src=\"dist/commons.js\"\
    ></script>\n  <script src=\"dist/admin.bundle.js\"></script>\n</body>\n</html>\n\
    ```\n\nTry loading `index.html` and `admin.html` in the browser to see them run\
    \ with the automatically created commons.\n\n## Extracting CSS\n\nAnother popular\
    \ plugin is the [extract-text-plugin](https://github.com/webpack-contrib/extract-text-plugin)\
    \ which can be used to extract modules into their own output files.\n\nBelow we'll\
