- fmt: "\nBut, the polar area is the first chart I've covered that can't be used to\
    \ compare two data sets. The previous examples were different ways of contrasting\
    \ two arrays of equal length, whereas the polar chart (and pie chart, which will\
    \ be covered next) only visualize a single group of numbers.\n\nHere's the full\
    \ code for this example:\n\n```javascript\nvar ctx = document.getElementById(\"\
    myChart\").getContext('2d');\nvar myChart = new Chart(ctx, {\n  type: 'polarArea',\n\
    \  data: {\n    labels: [\"M\", \"T\", \"W\", \"T\", \"F\", \"S\", \"S\"],\n \
    \   datasets: [{\n      backgroundColor: [\n        \"#2ecc71\",\n        \"#3498db\"\
    ,\n        \"#95a5a6\",\n        \"#9b59b6\",\n        \"#f1c40f\",\n        \"\
    #e74c3c\",\n        \"#34495e\"\n      ],\n      data: [12, 19, 3, 17, 28, 24,\
    \ 7]\n    }]\n  }\n});\n```\n\nThe only new code is a `backgroundColor` array.\
    \ Each color matches with the `data` element of the same index.\n\nTo read more\
    \ about polar area charts, [check out the docs](http://www.chartjs.org/docs/#polar-area-chart).\n\
    \n## Pie & Doughnut Charts\n\nYou can probably guess this part by now. Change:\n\
    \n`type: 'polarArea'`\n\nto:\n\n`type: 'pie'`\n\nThe `type` property is the key\
    \ to Chart.js. Remember how easy it was to transition from a line chart to bar\
    \ and radar chart? Well, polar, pie, and doughnut charts are equally interchangeable.\
    \ With that single change, we can alternate from a polar chart to a pie chart.\n\
    \n5. Pie Chart by SitePoint ([@SitePoint](http://codepen.io/SitePoint)) on [CodePen](http://codepen.io).\n\
    \n![](images/00001.jpg)\n\nAnd for a Doughnut chart:\n\n`type: 'pie'`\nto:\n\n\
    `type: 'doughnut'`\n\n6. Doughnut Chart by SitePoint ([@SitePoint](http://codepen.io/SitePoint))\
    \ on [CodePen](http://codepen.io).\n\n![](images/00017.jpg)\n\nTo read more about\
    \ pie and doughnut charts, [check out the docs](http://www.chartjs.org/docs/#doughnut-pie-chart).\n\
    \nHere's the full code for the pie chart:\n\n```javascript\nvar ctx = document.getElementById(\"\
    myChart\").getContext('2d');\nvar myChart = new Chart(ctx, {\n  type: 'pie',\n\
    \  data: {\n    labels: [\"M\", \"T\", \"W\", \"T\", \"F\", \"S\", \"S\"],\n \
    \   datasets: [{\n      backgroundColor: [\n        \"#2ecc71\",\n        \"#3498db\"\
    ,\n        \"#95a5a6\",\n        \"#9b59b6\",\n        \"#f1c40f\",\n        \"\
    #e74c3c\",\n        \"#34495e\"\n      ],\n      data: [12, 19, 3, 17, 28, 24,\
    \ 7]\n    }]\n  }\n});\n```\n\nDoughnut charts have an interesting property called\
    \ `cutPercentage` that dictates how big the center hole is. To dive into that,\
    \ I first need to show you something about Chart.js I've ignored to help you through.\n\
    \n## Configuring Chart.js\n\nIn every example so far, we've used the format:\n\
    \n```javascript\nvar myChart = new Chart(ctx, {\n  type: // chart type\n  data:\
    \ // chart data\n});\n```\n\nBut there's a third property called `options`. It\
    \ fits right below `data`.\n\n```javascript\nvar myChart = new Chart(ctx, {\n\
    \  type: // chart type\n  data: // chart data\n  options: // chart options\n});\n\
    ```\n\nNow that you're familiar with the fundamentals of Chart.js, it's time to\
    \ cover some of the tricks with `options`.\n\n### Titles\nIt's easy to add a title\
    \ to any Chart.js by adding this set of options. Native titles are awesome, but\
    \ it's worth noting they are mostly static and unchanging. This will matter when\
    \ we try to add custom events.\n\n```javascript\noptions: {\n  title: {\n    display:\
    \ true,\n    text: 'Custom Title'\n  }\n}\n```\n\n### The doughnut hole\nThe `cutPercentage`\
    \ property is a value from 0 to 50. Pie charts are just doughnut charts with a\
    \ `cutPercentage` of 0.\n\n```javascript\noptions: {\n  cutPercentage: 10,\n}\n\
    ```\n\n### Stack bar charts\nIf you would prefer your bar charts were stacked,\
    \ just add the following set of options into your chart code:\n\n```javascript\n\
    options: {\n  scales: {\n    yAxes: [{\n      stacked: true\n    }]\n  }\n}\n\
    ```\n\nEach chart type has plenty of options for you to dig through. I encourage\
    \ you to do so.\n\n### Handling Events\nAs mentioned previously clicking on a\
    \ legend will toggle the data set associated with that legend. Let's augment that\
    \ with our own functionality:\n\n```javascript\nvar original = Chart.defaults.global.onClick;\n\
    Chart.defaults.global.onClick = function(e, legendItem) {\n  // Insert your custom\
    \ functionality here\n  original.call(this, e, legendItem);\n};\n```\n\nThis code\
    \ saves a reference to the legend item's `onClick` function into a variable `original`.\
    \ It then overwrites this function with our customized version. The `e` parameter\
    \ that we are passing to it is a reference to the click event that caused the\
    \ function to fire and the `legendItem` parameter is a reference to the legend\
    \ that was clicked on. Once we're done adding our own code, [call](https://developer.mozilla.org/en-US/docs/Web/Reference/Global_Objects/Function/call)\
    \ the original function specifying a `this` value and passing through the parameters\
    \ it is expecting. This results in the default action for clicking on a legend\
    \ (toggling the data set) being carried out.\n\nIn other words, we can now package\
    \ any functionality we want on top of the `onClick()` call as long as we put it\
    \ above `original.call()`.\n\n## A Concrete Example\n\nLet's augment our previous\
    \ code so that when a user clicks on a legend, the caption at the bottom of the\
    \ chart updates automatically. We are only changing the caption, but you can add\
    \ any functionality you want. For example, a dashboard might have columns of the\
    \ daily `apples` and `oranges` values. The dashboard could also dynamically update\
    \ based on the status of your chart with the power of a custom callback. Creating\
    \ interactive data is easy with Chart.js.\n\nHere's the code\n\n```javascript\n\
    var labels = {\n  \"apples\": true,\n  \"oranges\": true\n};\nvar caption = document.getElementById(\"\
    caption\");\nvar update_caption = function(legend) {\n  labels[legend.text] =\
    \ legend.hidden;\n  var selected = Object.keys(labels).filter(function(key) {\n\
    \    return labels[key];\n  });\n  var text = selected.length ? selected.join(\"\
    \ & \") : \"nothing\";\n  caption.innerHTML = \"The above chart displays \" +\
    \ text;\n};\n```\n\nAs you can see, we're using an object literal to keep track\
    \ of the status of the legends. The filter function will return any of the keys\
    \ whose value is `true` which we use to build caption.\n\n## Chart.js 2.0 vs 1.0\n\
    \nThis article has used Chart.js 2.0 syntax. Chart.js 2.0 is relatively new. The\
    \ most obvious difference between 2.0 and 1.0 being how to declare charts.\n\n\
    ### 1.0\n```javascript\nvar LineChartDemo = new Chart(ctx).Line(\n  //data here,\n\
    \  //options here\n);\n```\n\n### 2.0\n```javascript\nvar myChart = new Chart(ctx,\
    \ {\n  type: 'line',\n  data: // data here,\n  options: // options here\n});\n\
    ```\n\nVersion 1.0 focuses on using function chaining to create a specific type\
    \ of chart, and then passing in data and options. Version 2.0 switches this up\
    \ by letting the user create a generic chart object and then pass in type as well\
    \ as data and options. The second approach matches up more with the philosophy\
    \ of Chart.js by being as modular and individual as possible.\n\n7. Bar Chart\
    \ with Custom onClick() by SitePoint ([@SitePoint](http://codepen.io/SitePoint))\
    \ on [CodePen](http://codepen.io).\n\n"
  raw: 'But, the polar area is the first chart I''ve covered that can''t be used to
    compare two data sets. The previous examples were different ways of contrasting
    two arrays of equal length, whereas the polar chart (and pie chart, which will
    be covered next) only visualize a single group of numbers.


    Here''s the full code for this example:


    `var ctx = document.getElementById("myChart").getContext(''2d'');`


    `var myChart = new Chart(ctx, {`


    `  type: ''polarArea'',`


    `  data: {`


    `    labels: ["M", "T", "W", "T", "F", "S", "S"],`


    `    datasets: [{`


    `      backgroundColor: [`


    `        "#2ecc71",`


    `        "#3498db",`


    `        "#95a5a6",`


    `        "#9b59b6",`


    `        "#f1c40f",`


    `        "#e74c3c",`


    `        "#34495e"`


    `      ],`


    `      data: [12, 19, 3, 17, 28, 24, 7]`


    `    }]`


    `  }`


    `});`


    The only new code is a `backgroundColor` array. Each color matches with the `data`
    element of the same index.


    To read more about polar area charts, [check out the docs](http://www.chartjs.org/docs/#polar-area-chart).


    Pie & Doughnut Charts


    You can probably guess this part by now. Change:


    `type: ''polarArea''`


    to:


    `type: ''pie''`


    The `type` property is the key to Chart.js. Remember how easy it was to transition
    from a line chart to bar and radar chart? Well, polar, pie, and doughnut charts
    are equally interchangeable. With that single change, we can alternate from a
    polar chart to a pie chart.


    5\. Pie Chart by SitePoint ([@SitePoint](http://codepen.io/SitePoint)) on [CodePen](http://codepen.io).


    ![](images/00001.jpg)


    And for a Doughnut chart:


    `type: ''pie''`


    to:


    `type: ''doughnut''`


    6\. Doughnut Chart by SitePoint ([@SitePoint](http://codepen.io/SitePoint)) on
    [CodePen](http://codepen.io).


    ![](images/00017.jpg)


    To read more about pie and doughnut charts, [check out the docs](http://www.chartjs.org/docs/#doughnut-pie-chart).


    Here''s the full code for the pie chart:


    `var ctx = document.getElementById("myChart").getContext(''2d'');`


    `var myChart = new Chart(ctx, {`


    `  type: ''pie'',`


    `  data: {`


    `    labels: ["M", "T", "W", "T", "F", "S", "S"],`


    `    datasets: [{`


    `      backgroundColor: [`


    `        "#2ecc71",`


    `        "#3498db",`


    `        "#95a5a6",`


    `        "#9b59b6",`


    `        "#f1c40f",`


    `        "#e74c3c",`


    `        "#34495e"`


    `      ],`


    `      data: [12, 19, 3, 17, 28, 24, 7]`


    `    }]`


    `  }`


    `});`


    Doughnut charts have an interesting property called `cutoutPercentage` that dictates
    how big the center hole is. To dive into that, I first need to show you something
    about Chart.js I''ve ignored to help you speed through the basic chart types.


    Configuring Chart.js


    In every example so far, we''ve used the format:


    `var myChart = new Chart(ctx, {`


    `  type: //chart type,`


    `  data: // chart data`


    `});`


    But there''s a third property called `options`. It fits in right below `data`.


    `var myChart = new Chart(ctx, {`


    `  type: //chart type,`


    `  data: // chart data,`


    `  options: // chart options`


    `});`


    Now that you''re familiar with the fundamentals of Chart.js, it''s time to cover
    some of the tricks availible with `options`.


    Titles


    It''s easy to add a title to any Chart.js chart by adding this set of options.
    Native titles are awesome, but it''s worth noting that they are mostly static
    and unchanging. This will matter when we try to add custom events in a minute.


    `options: {`


    `  title: {`


    `    display: true,`


    `    text: ''Custom Chart Title''`


    `  }`


    `}`


    The doughnut hole


    The `cutoutPercentage` property is a value from 0 to 50\. Pie charts are just
    doughnut charts with a `cutoutPercentage` of 0.


    `options: {`


    `  cutoutPercentage: 10,`


    `}`


    Stacking bar charts


    If you would prefer that your bar charts were stacked, just add the following
    set of options into your bar chart code:


    `options: {`


    `  scales: {`


    `    yAxes: [{`


    `      stacked: true`


    `    }]`


    `  }`


    `}`


    Each chart type has plenty of options for you to dig through. I encourage you
    to do so.


    Handling Events


    As mentioned previously clicking on a legend will toggle the data set associated
    with that particular legend. Let''s augment that with our own functionality:


    `var original = Chart.defaults.global.legend.onClick;`


    `Chart.defaults.global.legend.onClick = function(e, legendItem) {`


    `  // Insert your custom functionality here`


    `  original.call(this, e, legendItem);`


    `};`


    This code saves a reference to the legend item''s `onClick` function into a variable
    called `original` . It then overwrites this function with our own customized version.
    The `e` parameter that we are passing to it is a reference to the click event
    that caused the function to fire and the `legendItem` parameter is a reference
    to the legend that was clicked on. Once we''re done adding our own code, we [call](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Function/call)
    the original function specifying a `this` value and passing through the parameters
    it is expecting. This results in the default action for clicking on a legend (toggling
    the data set) being carried out.


    In other words, We can now package any functionality we want on top of the `onClick()`
    call as long as we put it above `original.call()`.


    A Concrete Example


    Let''s augment our previous code so that when a user clicks on a legend, the caption
    at the bottom of the chart updates automatically.


    We are only changing the caption, but you can add any functionality you want.
    For example, a dashboard might have columns of the daily `apples` and `oranges`
    values. The dashboard could also dynamically update based on the status of your
    chart with the power of a custom callback. Creating interactive data is easy with
    Chart.js.


    Here''s the code


    `var labels = {`


    `  "apples": true,`


    `  "oranges": true`


    `};`


    `var caption = document.getElementById("caption");`


    `var update_caption = function(legend) {`


    `  labels[legend.text] = legend.hidden;`


    `  var selected = Object.keys(labels).filter(function(key) {`


    `    return labels[key];`


    `  });`


    `  var text = selected.length ? selected.join(" & ") : "nothing";`


    `  caption.innerHTML = "The above chart displays " + text;`


    `};`


    As you can see, we''re using an object literal to keep track of the status of
    the legends. We''re also taking advantage of the `legend.text` and `legend.hidden`
    properties to update its state. The filter function will return any of the object
    keys whose value is `true` which we use to build our caption.


    7\. Bar Chart with Custom onClick() by SitePoint ([@SitePoint](http://codepen.io/SitePoint))
    on [CodePen](http://codepen.io).


    Chart.js 2.0 vs 1.0


    This article has used Chart.js 2.0 syntax. Chart.js 2.0 is relatively new. The
    most obvious difference between 2.0 and 1.0 being how to declare charts.


    1.0


    `var LineChartDemo = new Chart(ctx).Line(`


    `    //data here,`


    `    //options here`


    `);`


    2.0


    `var myChart = new Chart(ctx, {`


    `    type: ''line'',`


    `    data: //data here,`


    `    options: //options here`


    `}`


    Version 1.0 focuses on using function chaining to create a specific type of chart,
    and then passing in data and options. Version 2.0 switches this up by letting
    the user create a generic chart object and then pass in type as well as data and
    options. The second approach matches up more with the philosophy of Chart.js by
    being as modular and individual as possible. It''s worth noting Chart.js 2.0 is
    backwards compatible and still accepts 1.0 syntax.


    Another key feature of Chart.js 2.0 is mobile support. Charts can now scale to
    fit mobile screens and handle touch events on mobile browsers. With the current
    proliferation of mobile devices, this is a must-have feature for websites in 2016.


    Another feature new to 2.0 that we used in this guide is `title`. Charts now have
    integrated titles that will cooperate with the chart they''re attached to.


    The full list of updates can be found [in the 2.0.0 release notes](https://github.com/chartjs/Chart.js/releases/tag/v2.0.0).


    Conclusion'
