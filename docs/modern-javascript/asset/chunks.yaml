  trans: "\n\n```json\n{\n  \"type\": \"image/png\",\n  },\n  [\n    {\n      \"src\"\
    : \"/images/logo/logo256.png\",\n      \"sizes\": \"256x256\",\n      \"type\"\
    : \"image/png\"\n    },\n    {\n      \"src\": \"/images/logo/logo512.png\",\n\
    \      \"sizes\": \"512x512\",\n      \"type\": \"image/png\"\n    }\n  ]\n}\n\
    ```\n\n你所有页面的 `<head>` 中都需要一个指向此文件的链接：\n\n`<link rel=\"manifest\" href=\"/manifest.json\"\
    >`\n\n主要的 manifest 属性有：\n\n- `name`: 显示给用户的应用程序全名\n- `short_name`: 当空间不足以显示全名时使用的短名称\n\
    - `description`: 应用程序的详细描述\n- `start_url`: 启动程序的相对 URL（通常为 `/`）\n- `scope`: 导航范围。例如，范围为\
    \ `app` 将将该应用限制在相应文件夹内\n- `background-color`: 用于启动页和浏览器框架的背景颜色（如果需要）\n- `theme_color`:\
    \ 应用程序的颜色，通常与背景相同，会影响应用的显示方式\n- `orientation`: 偏好的方向：`any`、`natural`、`landscape`、`landscape-primary`、`landscape-secondary`、`portrait`、`portrait-primary`\
    \ 和 `portrait-secondary`\n- `display`: 偏好的视图：`fullscreen`（无框架）、`standalone`（像原生应用）、`minimal-ui`（一组小型\
    \ UI 控制）和 `browser`（常规浏览器标签页）\n- `icons`: 一个图像对象的数组，定义了 `src` URL、`sizes` 和 `type`。应该定义范围内的图标。\n\
    \nMDN 提供了 [Web App Manifest 属性](https://developer.mozilla.org/en-US/docs/Web/Manifest)\
    \ 的完整列表。\n\nChrome 开发工具 Application 标签中的 Manifest 部分会验证你的 manifest JSON，并提供一个可以在桌面设备上使用的“添加到主屏幕”链接：\n\
    \n![](img/00008.jpg)\n\n# 步骤 3：创建 Service Worker\n\nService Workers 是可编程的代理，可以拦截并响应网络请求。它们是位于应用程序根目录下的单个\
    \ JavaScript 文件。\n\n你的页面 JavaScript（演示代码中的 `js/main.js`）可以检查 service worker 的支持并注册该文件：\n\
    \n```javascript\nif ('serviceWorker' in navigator) {\n  // 注册 service worker\n\
    \  navigator.serviceWorker.register('/serviceworker.js');\n}\n```\n\n如果你不需要离线功能，只需创建一个空的\
    \ `/serviceworker.js` 文件——用户将收到提示来安装你的应用！\n\nService workers 可能会令人困惑，但你应该能够根据自己的需求对演示代码进行调整。它是一个标准的\
    \ web worker 脚本，浏览器会下载它（可能的话）并在单独线程上运行。它无法访问 DOM 或其他页面 API，但会拦截由页面变化、资源下载和 Ajax\
    \ 调用触发的网络请求。\n\n这是你的网站需要 HTTPS 的主要原因。想象一下，如果第三方脚本可以从另一个域名注入自己的 service worker，将会是多么混乱。它将能够检查并修改客户端和服务之间的所有数据交换！\n\
    \nService workers 对三个主要事件做出响应：install（安装）、activate（激活）和 fetch（获取）。\n\n## Install\
    \ 事件\n\n该事件在应用程序安装时发生。它通常用于使用 [Cache API](https://developer.mozilla.org/en-US/docs/Web/API/Cache)\
    \ 缓存基本文件。\n\n首先，我们将为以下内容定义一些配置变量：\n\n1. 缓存名称 (`CACHE`) 和版本 (`version`)。你的应用程序可以有多个缓存，但我们只需要一个。应用了版本号，因此如果我们进行了重大更改，将使用新缓存并忽略所有之前缓存的文件。\n\
    2. 离线状态下使用的 URL。\n3. 必须缓存的文件列表。\n4. 可选的缓存文件数组。\n\n"
