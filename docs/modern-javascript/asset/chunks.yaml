    \ the installation on failure.\n\n```javascript\nconst version = '1.0.0';\nCACHE\
    \ = version + 'PWA';\nofflineURL = '//';\ninstallFilesEssential = [\n  '/',\n\
    \  '/manifest.json',\n  '/css/styles.css',\n  '/js/main.js',\n  '/js/offline.js',\n\
    \  '/images/logo15.png'\n].concat(offlineURL);\ninstallDesirable = [\n  '/favicon.ico',\n\
    \  '/images/logo/logo16.png',\n  '/images/hero/power-pv.jpg',\n  '/images/hero/power-lo.jpg',\n\
    \  '/images/hero/power-hi.jpg'\n];\n```\n\nThe `installStaticFiles()` function\
    \ adds files to the cache using the promise-based [Cache API](https://developer.mozilla.org/en-US/docs/Web/API/Cache).\
    \ A return value is only generated when the essential files are cached:\n\n```javascript\n\
    // install assets\nfunction installStaticFiles() {\n  return caches.open(CACHE)\n\
    \    .then(cache => {\n      // cache files\n      cache.addAll(installDesirable);\n\
