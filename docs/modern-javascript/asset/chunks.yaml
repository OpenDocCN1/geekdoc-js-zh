- fmt: '

    The code that we write when developing modern web applications almost never is
    the same code that will go to production. We write code in a modern version of
    JavaScript that may not be supported by the browser, we make heavy use of third-party
    packages that are in a `node_modules` folder along with their own dependencies,
    we can have processes like static analysis tools or minifiers, etc. Build tooling
    exists to help transform all this into something that can be deployed efficiently
    and that is understood by most web browsers.


    ## Module bundling


    When writing clean, reusable code with ES2015/CommonJS modules, we need some way
    to load these modules (at least until browsers support ES2015 module loading natively).
    Including a bunch of script tags in your HTML isn''t really a viable option as
    it would quickly become unwieldy for any serious application, and all those separate
    HTTP requests would hurt performance.


    We can include all the modules where we need them using the `import` statement
    from ES2015 (or `require`, for CommonJS) and use a module bundler to combine everything
    together into one or more files (bundles). It''s this bundled file that we are
    going to upload to our server and include in our HTML. It will include all your
    imported modules and their necessary dependencies.


    There are currently a couple of popular options for this, the most popular ones
    are [Webpack](http://webpack.js.org), [Browserify](http://browserify.org) and
    [Rollup.js](http://rollupjs.org). You can choose one or another depending on your
    needs.


    ### Learning More About Module Bundling


    If you want to learn more about module bundling and how it fits into the bigger
    picture of app development, I recommend reading [Understanding JavaScript Modules:
    Bundling & Transpiling](https://www.sitepoint.com/javascript-modules-bundling-transpiling/).


    ## Transpilation


    While [support for ES2015 is pretty good among modern browsers](http://kangax.github.io/compat-table/es6/),
    your target audience may include legacy browsers and devices with partial or no
    support.


    In order to make our modern JavaScript work, we need to translate the code we
    write to its equivalent in an earlier version (usually ES5). The standard tool
    for this task is [Babel](https://babeljs.io); a compiler that translates your
    code into compatible code for most browsers. In this way you don’t have to wait
    for vendors to implement everything, you can just use all the modern JS features.


    There are a couple of features that need more than a syntax translation; Babel
    includes a [Polyfill](http://babeljs.io/docs/usage/polyfill/) that emulates some
    of the machinery required for some complex features, like promises.


    ## Build systems & task runners


    Module bundling and transpilation are just two of the build processes that we
    may need in our projects. Others include code minification (to reduce files sizes),
    tools for analysis, and perhaps tasks that don’t have anything to do with JavaScript,
    like image optimizations or CSS/HTML preprocessing.


    The management of tasks can become a laborious thing to do, and we need a way
    to handle it in an automated way, being able to execute everything with simpler
    commands. The two most popular tools for this are [Grunt.js](http://gruntjs.com)
    and [Gulp.js](http://gulpjs.com), they provide a way to organize your tasks into
    groups in an ordered way.


    For example, you can have a command like `gulp build` which may run a code linter,
    the transpilation process with Babel, and module bundling with Browserify. Instead
    of having to remember three commands and their associated arguments in order,
    we just execute one that will handle the whole process automatically.


    Wherever you find yourself manually organizing processing steps for your project,
    think if it can be automatized with a task runner.


    ## Application Architecture


    Web applications have different requirements than websites. For example, while
    page reloads may be acceptable for a blog, that is certainly not the case for
    an application like Google Docs. Your application should behave as close as possible
    to a desktop one, otherwise the usability would be compromised.


    Old-style web applications were usually done by sending multiple pages from a
    web server, and when a lot of dynamism was needed, content was loaded via Ajax
    by replacing chunks of HTML according to user actions. Although it was a big step
    forward to a more dynamic web, it certainly had its complications; sending HTML
    fragments or even whole pages on each user action represented a waste of resources,
    especially time from the user''s perspective. The usability still didn''t match
    the responsiveness of desktop applications.


    Looking to improve things, we created to new methods to build web applications,
    from the way we present them to the user to the way we communicate the client
    with the server. Although the amount of JavaScript required for an application
    also increased drastically, the result is now applications that behave very closely
    to native ones; without page reloading or extensive waiting periods each time
    we click a button.


    ### Single Page Applications (SPAs)


    The most common high-level architecture for web applications is called [SPA](https://en.wikipedia.org/wiki/Single-page_application),
    which stands for Single Page Application. SPAs are big blobs of JavaScript that
    contain everything the application needs to work properly. The UI is rendered
    entirely client-side, so no reloading is required. The only thing that changes
    is the data inside the application, which is usually handled with a remote API
    via [Ajax](https://en.wikipedia.org/wiki/Ajax_(programming)) or another asynchronous
    method of communication.


    One downside to this approach is that the application takes longer to load for
    the first time. Once it has been loaded, however, transitions between views (pages)
    are generally a lot quicker, since it is only pure data being sent between client
    and server.


    ### Universal / Isomorphic Applications


    Although SPAs provide a great user experience, depending on your needs, they might
    not be the optimal solution. Especially if you need quicker initial times or optimal
    indexing by search engines.


    There is a fairly recent approach to solving these problems called [Isomorphic](http://isomorphic.net/javascript)
    (or Universal) JavaScript applications. In this type of architecture, most of
    the code can be executed both on the server and the client. You can choose what
    you want to render on the server for a faster initial load, and after that, the
    client takes over the rendering. Because pages are initially rendered on the server,
    search engines can index them properly.


    ## Deployment


    With modern JavaScript applications, the code that you write is not the same as
    the code that you deploy for production; you only deploy the result of your build
    process. The workflow to accomplish this can vary depending on the size of your
    project, the number of developers working on it, and sometimes the tools/libraries
    that you are using.


    For example, if you are working alone on a simple project, each time you are ready
    for deployment you can just run the build process and upload the resulting files
    to a web server. Keep in mind that you only need to upload the resulting files
    from the build process (transpilation, module bundling, minification, etc.), which
    can be just one `.js` file containing your entire application and dependencies.


    You can have a directory structure like this:


    ```

    ├── dist

    │   ├── app.js

    │   └── index.html

    ├── node_modules

    ├── src

    │   ├── lib

    │   │   ├── login.js

    │   │   └── user.js

    │   ├── app.js

    │   └── index.html

    ├── gulpfile.js

    ├── package.json

    └── README

    ```


    Having all of your application files in an `src` directory, written in ES2015,
    and importing packages installed with npm and your own modules from a `lib` directory.

    '
  raw: 'The code that we write when developing modern web applications almost never
    is the same code that will go to production. We write code in a modern version
    of JavaScript that may not be supported by the browser, we make heavy use of third-party
    packages that are in a node_modules folder along with their own dependencies,
    we can have processes like static analysis tools or minifiers, etc. Build tooling
    exists to help transform all this into something that can be deployed efficiently
    and that is understood by most web browsers.


    Module bundling


    When writing clean, reusable code with ES2015/CommonJS modules, we need some way
    to load these modules (at least until browsers support ES2015 module loading natively).
    Including a bunch of script tags in your HTML isn''t really a viable option as
    it would quickly become unwieldy for any serious application, and all those separate
    HTTP requests would hurt performance.


    We can include all the modules where we need them using the `import` statement
    from ES2015 (or `require`, for CommonJS) and use a module bundler to combine everything
    together into one or more files (bundles). It''s this bundled file that we are
    going to upload to our server and include in our HTML. It will include all your
    imported modules and their necessary dependencies.


    There are a currently a couple of popular options for this, the most popular ones
    are [Webpack](http://webpack.js.org), [Browserify](http://browserify.org) and
    [Rollup.js](http://rollupjs.org). You can choose one or another depending on your
    needs.


    Learning More About Module Bundling


    If you want to learn more about module bundling and how it fits into the bigger
    picture of app development, I recommend reading [Understanding JavaScript Modules:
    Bundling & Transpiling](https://www.sitepoint.com/javascript-modules-bundling-transpiling/).


    Transpilation


    While [support for ES2015 is pretty good among modern browsers](http://kangax.github.io/compat-table/es6/),
    your target audience may include legacy browsers and devices with partial or no
    support.


    In order to make our modern JavaScript work, we need to translate the code we
    write to its equivalent in an earlier version (usually ES5). The standard tool
    for this task is [Babel](https://babeljs.io); a compiler that translates your
    code into compatible code for most browsers. In this way you don’t have to wait
    for vendors to implement everything, you can just use all the modern JS features.


    There are a couple of features that need more than a syntax translation; Babel
    includes a [Polyfill](http://babeljs.io/docs/usage/polyfill/) that emulates some
    of the machinery required for some complex features, like promises.


    Build systems & task runners


    Module bundling and transpilation are just two of the build processes that we
    may need in our projects. Others include code minification (to reduce files sizes),
    tools for analysis, and perhaps tasks that don’t have anything to do with JavaScript,
    like image optimizations or CSS/HTML preprocessing.


    The management of tasks can become a laborious thing to do, and we need a way
    to handle it in an automated way, being able to execute everything with simpler
    commands. The two most popular tools for this are [Grunt.js](http://gruntjs.com)
    and [Gulp.js](http://gulpjs.com), they provide a way to organize your tasks into
    groups in an ordered way.


    For example, you can have a command like `gulp build` which may run a code linter,
    the transpilation process with Babel, and module bundling with Browserify. Instead
    of having to remember three commands and their associated arguments in order,
    we just execute one that will handle the whole process automatically.


    Wherever you find yourself manually organizing processing steps for your project,
    think if it can be automatized with a task runner.


    Application Architecture


    Web applications have different requirements than websites. For example, while
    page reloads may be acceptable for a blog, that is certainly not the case for
    an application like Google Docs. Your application should behave as close as possible
    to a desktop one, otherwise, the usability would be compromised.


    Old-style web applications were usually done by sending multiple pages from a
    web server, and when a lot of dynamism was needed, content was loaded via Ajax
    by replacing chunks of HTML according to user actions. Although it was a big step
    forward to a more dynamic web, it certainly had its complications; sending HTML
    fragments or even whole pages on each user action represented a waste of resources,
    especially time from the user''s perspective. The usability still didn''t match
    the responsiveness of desktop applications.


    Looking to improve things, we created to new methods to build web applications,
    from the way we present them to the user to the way we communicate the client
    with the server. Although the amount of JavaScript required for an application
    also increased drastically, the result is now applications that behave very closely
    to native ones; without page reloading or extensive waiting periods each time
    we click a button.


    Single Page Applications (SPAs)


    The most common high-level architecture for web applications is called [SPA](https://en.wikipedia.org/wiki/Single-page_application),
    which stands for Single Page Application. SPAs are big blobs of JavaScript that
    contain everything the application needs to work properly. The UI is rendered
    entirely client-side, so no reloading is required. The only thing that changes
    is the data inside the application, which is usually handled with a remote API
    via [Ajax](https://en.wikipedia.org/wiki/Ajax_(programming)) or another asynchronous
    method of communication.


    One downside to this approach is that the application takes longer to load for
    the first time. Once it has been loaded, however, transitions between views (pages)
    are generally a lot quicker, since it is only pure data being sent between client
    and server.


    Universal / Isomorphic Applications


    Although SPAs provide a great user experience, depending on your needs, they might
    not be the optimal solution. Especially if you need quicker initial response times
    or optimal indexing by search engines.


    There is a fairly recent approach to solving these problems called [Isomorphic](http://isomorphic.net/javascript)
    (or Universal) JavaScript applications. In this type of architecture, most of
    the code can be executed both on the server and the client. You can choose what
    you want to render on the server for a faster initial page load, and after that,
    the client takes over the rendering while the user is interacting with the app.
    Because pages are initially rendered on the server, search engines can index them
    properly.


    Deployment


    With modern JavaScript applications, the code that you write is not the same as
    the code that you deploy for production; you only deploy the result of your build
    process. The workflow to accomplish this can vary depending on the size of your
    project, the number of developers working on it, and sometimes the tools/libraries
    that you are using.


    For example, if you are working alone on a simple project, each time you are ready
    for deployment you can just run the build process and upload the resulting files
    to a web server. Keep in mind that you only need to upload the resulting files
    from the build process (transpilation, module bundling, minification, etc.), which
    can be just one `.js` file containing your entire application and dependencies.


    You can have a directory structure like this:


    `├── dist`


    `│   ├── app.js`


    `│   └── index.html`


    `├── node_modules`


    `├── src`


    `│   ├── lib`


    `│   │   ├── login.js`


    `│   │   └── user.js`


    `│   ├── app.js`


    `│   └── index.html`


    `├── gulpfile.js`


    `├── package.json`


    `└── README`


    Having all of your application files in an `src` directory, written in ES2015,
    and importing packages installed with npm and your own modules from a `lib` directory.'
