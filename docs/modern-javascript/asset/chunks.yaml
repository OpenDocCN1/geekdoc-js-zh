    \      }}\n    );\n  }\n  else {\n    // return page\n    return caches.match(offlineURL);\n\
    \  }\n}\n```\n\n`offlineAsset()` 函数检查请求是否为图片并返回一个包含“offline”文本的 SVG。所有其他请求均返回\
    \ `offlineURL` 页面。\n\nChrome 开发者工具 Application（应用程序）标签页的 Service Worker 部分提供了有关你的\
    \ worker 的信息，以及强制刷新和让浏览器进入离线的功能：\n\n![](img/00009.jpg)\n\nCache Storage（缓存存储）部分列出了当前范围内的所有缓存以及它们包含的资源。当缓存更新时，你可能需要点击面板底部的刷新按钮：\n\
    \n![](img/00012.jpg)\n\n意乎不彰，Clear storage（清除存储）部分可以删除你的 service worker 和缓存：\n\
    \n![](img/00018.jpg)\n\n## 额外步骤 4：创建一个实用的离线页面\n\n离线页面可以是静态 HTML，告知用户请求的页面在离线时不可用。然而，我们也可以提供一个可读页面\
    \ URL 列表。\n\n[Cache API](https://developer.mozilla.org/en-US/docs/Web/API/Cache)\
    \ 可以在我们的 `main.js` 脚本中访问。但是该 API 使用的 promise 在不支持的浏览器中失败，会导致所有 JavaScript 停止执行。为了避免这种情况，我们在加载另一个\
    \ `offlinepage.js` JavaScript 文件之前，会检查离线列表元素和 Caches API 是否可用（该文件必须存在于上面的 `installFilesEssential`\
    \ 数组中）：\n\n```javascript\n// load script to populate offline page list\nif (document.getElementById('cachedpagelist')\
    \ && 'caches' in window) {\n  var scr = document.createElement('script');\n  scr.src\
    \ = 'offlinepage.js';\n  scr.async = 1;\n  document.head.appendChild(scr);\n}\n\
    ```\n\n`offlinepage.js` 通过名称定位最新的缓存，获取所有键的列表，移除非页面的 URL，排序列表并将其追加到 ID 为 `cachedpagelist`\
    \ 的 DOM 节点：\n\n```javascript\nconst CACHE = 'site',\nofflineURL = '/',\nlist =\
    \ document.getElementById('cachedpagelist');\n// fetch all caches\nwindow.caches.keys()\n\
    \  .then(cacheList => {\n    // find caches and order by recent\n    cacheList\
    \ = cacheList\n      .filter(cName => cName.includes(CACHE))\n      .sort((a,\
    \ b) => a - b);\n    // open first cache\n    caches.open(cacheList[0])\n    \
    \  .then(cache => {\n        // fetch cached pages\n        cache.keys()\n   \
    \       .then(reqList => {\n            let frag = document.createDocumentFragment();\n\
    \            reqList\n              .map(req => req.url)\n              .filter(req\
    \ => (req.endsWith('/') || req.endsWith('.html')) && !req.endsWith(offlineURL))\n\
    \              .sort()\n              .forEach(req => {\n                let li\
    \ = document.createElement('li'),\n                a = li.appendChild(document.createElement('a'));\n\
    \                a.setAttribute('href', req);\n                a.textContent =\
    \ a.pathname;\n                frag.appendChild(li);\n              });\n    \
    \        if (list) list.appendChild(frag);\n          });\n      });\n  });\n\
    ```\n\n## 开发者工具\n\n如果你觉得调试 JavaScript 很困难，那么 service workers 也不会好玩！Chrome 开发者工具的\
    \ Application 标签提供了强大的功能，日志语句也会输出到控制台。\n\n在开发期间，你应该考虑在无痕窗口中运行你的应用，因为缓存文件在关闭标签页后不会保留。\n\
    \nFirefox 在工具菜单的 Service Workers 选项提供了一个 JavaScript 调试器。承诺很快就会提供更好的设施。\n\n最后，[Chrome\
    \ Lighthouse 扩展程序](https://chrome.google.com/webstore/detail/lighthouse/blipmdconlkpine)提供了关于\
    \ PWA 的有用信息。\n\n## PWA 注意事项\n\n渐进式 Web 应用（PWA）需要新的技术，因此建议采取谨慎态度。manifest 参数 `display:\
    \ minimal-ui` 或 `display: browser` 对于大多数网站可能是最好的。## URL 隐藏\n\n演示隐藏了地址栏，除非你只有一个应用。缓存负载\n\
    \n你可以缓存网站上的所有页面。但对于有成千上万页面的网站是否可行？可能考虑：\n\n*   仅缓存重要页面例如首页和最新的\n*   不缓存图片、视频和其他大文件\n\
    *   定期清理旧文件\n*   提供“存储此页面”按钮让用户选择缓存什么。缓存刷新\n\n演示从缓存中查找资源，这在用户离线时很棒，但意味着他们在在线时可能查看旧页面。\n\
    \n图片和视频的 URL 永远不会更改，因此长期缓存很少有问题。你可以通过 `Cache-Control` HTTP 头部确保它们缓存至少一年（31,536,000\
    \ 秒）：\n\n`Cache-Control: max-age=3153600`\n\n页面、CSS 和脚本文件可能会更频繁地更改，你可以设置较短的 24\
    \ 小时过期并在在线时进行服务器验证：\n\n`Cache-Control: must-revalidate, max-age=86400`\n\n你也可以考虑缓存失效技术以确保旧资源无法被使用，例如将你的\
    \ CSS 文件命名为 `styles-abc123.css` 并在每次发布时更改哈希值。可能会变得复杂，所以我建议阅读 Jake Archibald 的\
    \ [缓存最佳实践与 max-age 阱](https://jakearchibald.com/2016/caching-best-practices/)。有用链接\n\
    \n如果你想了解更多关于渐进式 Web 应用，以下资源非常有用：\n\n*   [PWA 示例应用](https://pwa.rocks/)\n*   [Progressive\
    \ Web Apps](https://developers.google.com/web/progressive-web-apps/)\n*   [你的\
    \ PWA](https://codelabs.developers.google.com/codelabs/your-first-pwapp/)\n* \
    \  [Mozilla Service Worker Cookbook](https://serviceworke.rs/)\n[MDN 使用 Service\
    \ Workers](https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API/Using_Service_Workers)\n\
    \n第 7 章：成为更好的 Node 开发者的 10 条建议\n\n作者 Azat Mardan\n\n"
- fmt: "\nI started working with Node full-time in 2012 when I joined Storify. Since\
    \ then, I have never looked back or felt that I missed Python, Ruby, Java or PHP\
    \ — languages with which I had worked during my previous decade of web development.\n\
    \nStorify was an interesting job for me, because unlike many other companies,\
    \ Storify ran (and maybe still does) everything on JavaScript. You see, most companies,\
    \ especially large ones such as PayPal, Walmart, or Capital One, only use Node\
    \ for certain parts of their stack. Usually they use it as an API gateway or an\
    \ orchestration layer. That's great. But for a software engineer, nothing compares\
    \ with full immersion into a Node environment.\n\nIn this post I'll outline ten\
    \ tips to help you become a better Node developer in 2017. These tips come from\
    \ me, who saw and learned them in the trenches, as well as people who have written\
    \ the most popular Node and npm modules. Here's what we'll be covering:\n\n1.\
    \ **Avoid complexity** — Organize your code into the smallest chunks possible\
    \ until they look too small and then make them even smaller.\n2. **Use asynchronous\
    \ code** — Avoid synchronous code like the plague.\n3. **Avoid blocking require**\
    \ — Put ALL your `require` statements at the top of the file because they are\
    \ synchronous and will block the execution.\n4. **Know that require is cached**\
    \ — This could be a feature or a bug in your code.\n5. **Always check for errors**\
    \ — Errors are not footballs. Never throw errors and never skip the error check.\n\
    6. **Use try...catch only in sync code** — `try...catch` is useless for async\
    \ code, plus V8 can't optimize code in `try...catch` as well as plain code.\n\
    7. **Return callbacks or use if ... else** — Just to be sure, return a callback\
    \ to prevent execution from continuing.\n8. **Listen to the error events** — Almost\
    \ all Node classes/objects extend the event emitter (observer pattern) and emit\
    \ the `error` event. Be sure to listen to that.\n9. **Know your npm** — Install\
    \ modules with `-S` or `-D` instead of `--save` or `--save-dev`.\n10. **Use exact\
    \ versions in package.json**: npm stupidly adds a caret by default when you use\
    \ `-S`, so get rid of them manually to lock the versions. Never trust semver in\
    \ your apps, but do so in open-source modules.\n11. **Bonus — Use different dependencies**.\
    \ Put things your project needs only in development in `devDependencies` and then\
    \ use `npm i --production`. The more un-required dependencies you have, the greater\
    \ the risk of vulnerability.\n\nSo let's bisect and take a look at each one of\
    \ them individually. Shall we?\n\n## Avoid Complexity\n\nTake a look at some of\
    \ the modules written by Isaac Z. Schlueter, the creator of npm. For example,\
    \ `use-strict` enforces JavaScript strict mode for modules, and it's just three\
    \ lines of code:\n\n```\nvar module = require('module')\nmodule.wrapper[0] +=\
    \ '\"use strict';\nObject.freeze(module.wrap)\n```\n\nSo why avoid complexity?\
    \ A famous phrase which originated in the US Navy according to one of the legends\
    \ proclaims: KEEP IT SIMPLE STUPID (or is it \"Keep it simple, stupid\"?). That's\
    \ for a reason. The human brain can hold only five to seven items in its working\
    \ memory at any one time. This is just a fact.\n\nBy keeping your code modularized\
    \ into smaller parts, you and other developers can understand and reason about\
    \ it better. You can also test it better. Consider this example,\n\n```\napp.use(function(req,\
    \ res, next) {\n  if (req.session.admin === true) return next()\n  else return\
    \ next(new Error('Not authorized'))\n}, function(req, res, next) {\n  req.db =\
    \ db\n  next()\n})\n```\n\nOr this code:\n\n```\nconst auth = require('./middleware/auth.js')\n\
    const db = require('./middleware/db.js')(db)\napp.use(auth, db)\n```\n\nI'm sure\
    \ most of you will prefer the second example, especially when the names are self-explanatory.\
    \ Of course, when you write the code you might think that you understand how it\
    \ works. Maybe you even want to show off how smart you are by chaining several\
    \ methods together in one line. Please, code for the dumber version of you. Code\
    \ for the you who hasn't looked at this code for six months, or a tried or drunk\
    \ version of you. If you write code at the peak of your mental capacity, then\
    \ it will be harder for you to understand it later, not to even mention your colleagues\
    \ who are not even familiar with the intricacies of the algorithm. Keeping things\
    \ simple is especially true for Node which uses the asynchronous way.\n\nAnd yes,\
    \ there was the left-pad incident but that only affected projects dependent on\
    \ the public registry and the replacement was published in 11 minutes. The benefits\
    \ of going small far outweigh the downsides. Also, npm has changed its unpublish\
    \ policy, and any serious project should be using a caching strategy or a private\
    \ registry (as a temporary solution).\n\n## Use Asynchronous Code\n\nSynchronous\
    \ code does have a (small) place in Node. It's mostly for CLI commands or other\
    \ scripts. Node developers mostly build web apps, hence they use async. For example,\
    \ this might be okay if we are just building a system:\n\n```\nlet data = fs.readFileSync('./conts.json')\n\
    db.collection('accounts').insert(data, results)=>{process.exit(1)})\n```\n\nBut\
    \ this would be better when building a app:\n\n```\napp.use('seed', (req, res)\
    \ => {\n  let data = fs.readFile(`${req.name}.json`, results)=>{\n    res.status(201).send()\n\
    \  })\n})\n```\n\nThe difference is whether you are writing concurrent (typically\
    \ long running) or non-concurrent (short running) systems. As a rule of thumb,\
    \ always write async code in Node.\n\n## Avoid Blocking require\n\nNode has a\
    \ simple module loading system which uses the CommonJS module format. Its built-in\
    \ `require` function is an easy way to include modules that exist in separate\
    \ files. Unlike AMD/requirejs, the Node/CommonJS way of module loading is synchronous.\
    \ The way `require` works is: you import what was exported in a module, or a file.\n\
    \n```\nconst react = require('react')\n```\n\nWhat most developers don't know\
    \ is that `require` is cached. So, as long as there are no drastic changes to\
    \ the resolved filename (and in the case of npm modules there are), then the code\
    \ from the module will be executed and loaded into the variable just once (for\
    \ that process). This is a nice optimization. However, even with caching, you\
    \ are better off putting your `require` statements first. Consider this code which\
    \ only loads the `axios` module on the route which actually uses it. The `/connect`\
    \ route will be slower than needed because the module import is happening when\
    \ the request is made:\n\n```\napp.post('/connect', (req, res) => {\n  const axios\
    \ = require('axios')\n  axios.post('apiauthorize', req.body.auth)\n    .then((response)=>res.send(response))\n\
    })\n```\n\nA better, more performant way is to load the modules before the server\
    \ is even defined, not in the route:\n\n```\nconst axios = require('axios')\n\
    const express = require('express')\napp = express()\napp.post('/connect', (req,\
    \ res) => {\n  axios.post('apiauthorize', req.body.auth)\n    .then((response)=>res.send(response))\n\
    })\n```\n"
  raw: 'I started working with Node full-time in 2012 when I joined Storify. Since
    then, I have never looked back or felt that I missed Python, Ruby, Java or PHP
    — languages with which I had worked during my previous decade of web development.


    Storify was an interesting job for me, because unlike many other companies, Storify
    ran (and maybe still does) everything on JavaScript. You see, most companies,
    especially large ones such as PayPal, Walmart, or Capital One, only use Node for
    certain parts of their stack. Usually they use it as an API gateway or an orchestration
    layer. That''s great. But for a software engineer, nothing compares with full
    immersion into a Node environment.


    In this post I''ll outline ten tips to help you become a better Node developer
    in 2017\. These tips come from me, who saw and learned them in the trenches, as
    well as people who have written the most popular Node and npm modules. Here''s
    what we''ll be covering:


    1.  [Avoid complexity](#index_split_008.html_filepos202143) — Organize your code
    into the smallest chunks possible until they look too small and then make them
    even smaller.


    2.  [Use asynchronous code](#index_split_008.html_filepos205101) — Avoid synchronous
    code like the plague.


    3.  [Avoid blocking require](#index_split_008.html_filepos206602) — Put ALL your
    require statements at the top of the file because they are synchronous and will
    block the execution.


    4.  [Know that require is cached](#index_split_008.html_filepos208619) — This
    could be a feature or a bug in your code.


    5.  [Always check for errors](#index_split_008.html_filepos209355) — Errors are
    not footballs. Never throw errors and never skip the error check.


    6.  [Use try...catch only in sync code](#index_split_008.html_filepos209355) —
    `try...catch` is useless for async code, plus V8 can''t optimize code in `try...catch`
    as well as plain code.


    7.  [Return callbacks or use if ... else](#index_split_008.html_filepos212353)
    — Just to be sure, return a callback to prevent execution from continuing.


    8.  [Listen to the error events](#index_split_008.html_filepos213216) — Almost
    all Node classes/objects extend the event emitter (observer pattern) and emit
    the `error` event. Be sure to listen to that.


    9.  [Know your npm](#index_split_008.html_filepos214428) — Install modules with
    `-S` or `-D` instead of `--save` or `--save-dev`


    10.  [Use exact versions in package.json](#index_split_008.html_filepos214428):
    npm stupidly adds a caret by default when you use `-S`, so get rid of them manually
    to lock the versions. Never trust semver in your apps, but do so in open-source
    modules.


    11.  Bonus — Use different dependencies. Put things your project needs only in
    development in `devDependencies` and then use `npm i --production`. The more un-required
    dependencies you have, the greater the risk of vulnerability.


    So let''s bisect and take a look at each one of them individually. Shall we?


    Avoid Complexity


    Take a look at some of the modules written by Isaac Z. Schlueter, the creator
    of npm. For example, [use-strict](https://www.npmjs.com/package/use-strict) enforces
    JavaScript strict mode for modules, and it''s just three lines of code:


    `var module = require(''module'')`


    `module.wrapper[0] += ''"use strict";''`


    `Object.freeze(module.wrap)`


    So why avoid complexity? A famous phrase which originated in the US Navy according
    to one of the legends proclaims: KEEP IT SIMPLE STUPID (or is it "Keep it simple,
    stupid"?). That''s for a reason. The human brain can hold only five to seven items
    in its working memory at any one time. This is just a fact.


    By keeping your code modularized into smaller parts, you and other developers
    can understand and reason about it better. You can also test it better. Consider
    this example,


    `app.use(function(req, res, next) {`


    `  if (req.session.admin === true) return next()`


    `  else return next(new Error(''Not authorized''))`


    `}, function(req, res, next) {`


    `  req.db = db`


    `  next()`


    `})`


    Or this code:


    `const auth = require(''./middleware/auth.js'')`


    `const db = require(''./middleware/db.js'')(db)`


    `app.use(auth, db)`


    I''m sure most of you will prefer the second example, especially when the names
    are self-explanatory. Of course, when you write the code you might think that
    you understand how it works. Maybe you even want to show off how smart you are
    by chaining several methods together in one line. Please, code for the dumber
    version of you. Code for the you who hasn''t looked at this code for six months,
    or a tried or drunk version of you. If you write code at the peak of your mental
    capacity, then it will be harder for you to understand it later, not to even mention
    your colleagues who are not even familiar with the intricacies of the algorithm.
    Keeping things simple is especially true for Node which uses the asynchronous
    way.


    And yes, there was the [left-pad incident](http://www.theregister.co.uk/2016/03/23/npm_left_pad_chaos/)
    but that only affected projects dependent on the public registry and the replacement
    was published in 11 minutes. The benefits of going small far outweigh the downsides.
    Also, npm has [changed its unpublish policy](http://blog.npmjs.org/post/141905368000/changes-to-npms-unpublish-policy),
    and any serious project should be using a caching strategy or a private registry
    (as a temporary solution).


    Use Asynchronous Code


    Synchronous code does have a (small) place in Node. It''s mostly for writing CLI
    commands or other scripts not related to web apps. Node developers mostly build
    web apps, hence they use async code to avoid blocking threads.


    For example, this might be okay if we are just building a database script, and
    not a system to handle parallel/concurrent tasks:


    `let data = fs.readFileSync(''./acconts.json'')`


    `db.collection(''accounts'').insert(data, (results))=>{`


    `  fs.writeFileSync(''./accountIDs.json'', results, ()=>{process.exit(1)})`


    `})`


    But this would be better when building a web app:


    `app.use(''``seed``:name'', (req, res) => {`


    ``  let data = fs.readFile(`./${req.params.name}.json`, ()=>{``


    `    db.collection(req.params.name).insert(data, (results))=>{`


    ``      fs.writeFile(`./${req.params.name}IDs.json`, results, ()={res.status(201).send()})``


    `    })`


    `  })`


    `})`


    The difference is whether you are writing concurrent (typically long running)
    or non-concurrent (short running) systems. As a rule of thumb, always write async
    code in Node.


    Avoid Blocking require


    Node has a simple module loading system which uses the CommonJS module format.
    Its built-in `require` function is an easy way to include modules that exist in
    separate files. Unlike AMD/requirejs, the Node/CommonJS way of module loading
    is synchronous. The way `require` works is: you import what was exported in a
    module, or a file.


    `const react = require(''react'')`


    What most developers don''t know is that `require` is cached. So, as long as there
    are no drastic changes to the resolved filename (and in the case of npm modules
    there are none), then the code from the module will be executed and loaded into
    the variable just once (for that process). This is a nice optimization. However,
    even with caching, you are better off putting your require statements first. Consider
    this code which only loads the `axios` module on the route which actually uses
    it. The `/connect` route will be slower than needed because the module import
    is happening when the request is made:


    `app.post(''/connect'', (req, res) => {`


    `  const axios = require(''axios'')`


    `  axios.post(''``api``authorize'', req.body.auth)`


    `    .then((response)=>res.send(response))`


    `})`


    A better, more performant way is to load the modules before the server is even
    defined, not in the route:


    `const axios = require(''axios'')`


    `const express = require(''express'')`


    `app = express()`


    `app.post(''/connect'', (req, res) => {`


    `  axios.post(''``api``authorize'', req.body.auth)`


    `    .then((response)=>res.send(response))`


    `})`


    Know That require Is Cached'
