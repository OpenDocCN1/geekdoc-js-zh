- fmt: '

    [Storybook](https://getstorybook.io/) is a component development environment for
    React. It allows you to quickly set up a separate application to showcase your
    components. On top of that, it provides numerous add-ons to document, develop,
    test and design your components. We''ve found it to be extremely useful to be
    able to develop components independently from the rest of the application. You
    can [learn more about Storybook](https://www.sitepoint.com/react-storybook-develop-beautiful-user-interfaces-with-ease/)
    from a previous article.


    > There are plenty of other libraries and tools available in [the Awesome React
    list](https://github.com/enaqx/awesome-react).


    # Adoption, Learning Curve and Development Experience


    An important criterion for choosing a new technology is how easy it is to learn.
    Of course, the answer depends on a wide range of factors such as your previous
    experience and a general familiarity with the related concepts and patterns. However,
    we can still try to assess the number of new things you''ll need to learn to get
    started with a given framework. Now, if we assume that you already know `ES6+`,
    build tools and all of that, let''s see what else you''ll need to understand.


    ## React


    With react the first thing you''ll encounter is `JSX`. It does seem awkward to
    write for some developers, however, it doesn''t add that much complexity; Just
    expressions, which are actually JavaScript, and a special HTML-like syntax. You''ll
    also need to learn how to write components, use `props` for configuration and
    manage internal state. You don''t need to learn any new logical structures or
    loops since all of this is plain JavaScript.


    The [official tutorial](https://facebook.github.io/react/docs/hello-world.html)
    is an excellent place to start learning React. Once you''re done with that, [get
    familiar with the router](https://reacttraining.com/react-router/web/guides/quick-start).
    The `react router v4` might be slightly complex and unconventional, but nothing
    to worry about. Using `Redux` will require a paradigm shift to learn how to accomplish
    already familiar tasks in a manner suggested by the library. The free [Getting
    Started with Redux](https://egghead.io/courses/getting-started-with-redux) video
    course can quickly introduce you to the core concepts. Depending on the size and
    the complexity of your project you''ll need to find and learn some additional
    libraries and this might be the tricky part, but after that everything should
    be smooth sailing.


    We were genuinely surprised at how easy it was to get started using React. Even
    people with a backend development background and limited experience in frontend
    development were able to catch up quickly. The error messages you might encounter
    along the way are usually clear and provide explanations on how to resolve the
    underlying problem. The hardest part may be finding the right libraries for all
    of the required capabilities, but structuring and developing an application is
    remarkably simple.


    ## Angular


    Learning Angular will introduce you to more new concepts than React. First of
    all, you''ll need to get comfortable with `TypeScript`. For developers with experience
    in statically typed languages such as `Java` or `.NET` this might be easier to
    understand than `JavaScript`, but for pure JavaScript developers, this might require
    some effort.


    The framework itself is rich in topics to learn, starting from basic ones such
    as modules, dependency injection, decorators, components, services, pipes, templates,
    and directives, to more advanced topics such as change detection, zones, `AoT
    compilation`, and `Rx.js`. These are all covered in the [documentation](https://angular.io/docs/ts/latest/quickstart.html).
    `Rx.js` is a heavy topic on its own and is described in much detail on the [official
    website](http://reactivex.io/). While relatively easy to use on a basic level
    it gets more complicated when moving on to advanced topics.


    All in all, we noticed that the entry barrier for Angular is higher than for React.
    The sheer number of new concepts is confusing to newcomers. And even after you''ve
    started, the experience might be a bit rough since you need to keep in mind things
    like `Rx.js` subscription management, change detection performance and [bananas
    in a box](https://angular.io/docs/ts/latest/guide/template-syntax.html) (yes,
    this is an actual advice from the documentation). We often encountered error messages
    that are too cryptic to understand, so we had to google them and pray for an exact
    match.


    It might seem that we favor React here, and we definitely do. We''ve had experience
    onboarding new developers to both Angular and React projects of comparable size
    and complexity and somehow with React it always went smoother. But, like I said
    earlier, this depends on a broad range of factors and might work differently for
    you.


    # Putting It Into Context


    You might have already noted that each framework has its own of capabilities,
    both with their good and bad sides. But this analysis has been done outside of
    any particular context and thus doesn''t provide an answer on which framework
    should you choose. To decide on that, you''ll need to review it from a perspective
    of your project. This is something you''ll need to do on your own.


    To get started, try answering these questions about your project and when you
    do, match the answers against what you''ve learned about the two frameworks. This
    list might not be complete, but should be enough to get you started:


    1. How big is the project?

    2. How long is it going to be maintained for?

    3. Is all of the functionality clearly defined in advance or are you expected
    to be flexible?

    4. If all of the features are already defined, what capabilities do you need?

    5. Are the domain model and business logic complex?

    6. What platforms are you targeting? Web, mobile, desktop?

    7. Do you need server-side rendering? Is SEO important?

    8. Will you be handling a lot of real-time event?

    9. How big is your team?

    10. How experienced are your developers and what is their background?

    11. Are there any ready-made component libraries that you would like to use?


    If you''re starting a big project and you would like to minimize the risk of making
    a bad choice, consider creating a proof-of-concept product first. Pick some of
    the key features of the projects and try to implement them in a simplistic manner
    using one of the frameworks. PoCs usually don''t take a lot if time to build but
    will give you some valuable experience on working with the framework and allow
    you to validate the key technical requirements. If you''re satisfied with the
    results, you can continue with full-blown development. If not, failing fast will
    save you lot of headaches in the long run.


    # One Framework to Rule Them All?


    Once you''ve picked a framework for one project, you''ll get tempted to use the
    exact same stack for your upcoming projects. Don''t. Even though it''s a good
    idea to keep your tech stack consistent, don''t blindly use the same approach
    every time. Before starting each project, take a moment to answer the same questions
    once more. Maybe for the next project, the answers will be different or the landscape
    will change. Also, if you have the luxury of doing a small project with a non-familiar
    tech stack, go for it. Such experiments will provide you with invaluable experience.
    Keep your mind open and learn from your mistakes.


