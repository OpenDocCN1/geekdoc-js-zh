- fmt: "\n```javascript\n  context: path.resolve(__dirname, 'src'),\n  entry: './app.js',\n\
    \  output: {\n    path: path.resolve(__dirname, 'dist'),\n    filename: 'bundle.js'\n\
    \  },\n  module: {\n    rules: [{\n      test: /\\.js$/,\n      include: path.resolve(__dirname,\
    \ 'src'),\n      use: [{\n        loader: 'babel-loader',\n        options: {\n\
    \          presets: [\n            ['es2015', { modules: false }]\n          ]\n\
    \        }\n      }]\n    }]\n  }\n}\nmodule.exports = config\n```\n\nThe config\
    \ above is a common starting point, it instructs `webpack` to compile our entry\
    \ point `src/app.js` into our output `dist/bundle.js` and all `.js` files will\
    \ be transpiled from ES2015 to ES5 with `Babel`.\n\nTo get this running we're\
    \ going to need to install three packages, `babel-core`, the `webpack` loader\
    \ `babel-loader` and the preset `babel-preset-es2015` for the flavor of JavaScript\
    \ we want to write. `{ modules: false }` enables [Tree Shaking](http://www.2ality.com/2015/12/webpack-tree-shaking.html)\
    \ to remove unused exports from your bundle to bring down the file size.\n\n`npm\
    \ install babel-core babel-loader babel-preset-es2015 --save-dev`\n\nLastly, replace\
    \ the scripts section of `package.json` with the following:\n\n```json\n\"scripts\"\
    : {\n  \"start\": \"webpack --watch\",\n  \"build\": \"webpack -p\"\n}\n```\n\n\
    Running `npm start` from the command line will start `webpack` in watch mode which\
    \ will recompile our bundle whenever a `.js` file is changed in our `src` directory.\
    \ The output in the console tells us about the bundles being being created, it's\
    \ important to keep an eye on the number of bundles and the size.\n\n![](images/00003.jpg)\n\
    \nYou should now be able to load `index.html` in your browser and be greeted with\
    \ \"Hello webpack.\".\n\n`open index.html`\n\nOpen up `dist/bundle.js` to see\
    \ what `webpack` has done, at the top is `webpack`'s module bootstrapping code\
    \ and right at the bottom is our module. You may not be colored impressed just\
    \ yet but if you've come this far you can now start authoring ES6 modules and\
    \ `webpack` will be able to produce a bundle for production that will work in\
    \ all browsers.\n\nStop `webpack` with `Ctrl + C` and run `npm run build` to compile\
    \ our bundle in production mode.\n\nNotice that the bundle size has come down\
    \ from 2.61 kB to 585 bytes. Take another look at `dist/bundle.js` and you'll\
    \ see a big ugly mess of code, our bundle has been minified with `UglifyJS`, the\
    \ code will run exactly the same but it's done with the fewest characters needed.\n\
    \n## Modules\n\nOut of the box `webpack` knows how to consume JavaScript modules\
    \ in a variety of formats, the most notable two are:\n\n- ES2015 `import` statements\n\
    - CommonJS `require()` statements\n\nWe can test this out by installing [lodash](https://lodash.com/)\
    \ and importing it from `app.js`\n\n`npm install lodash --save`\n\n```javascript\n\
    // src/app.js\nimport {groupBy} from 'lodash/collection'\n\nconst people = [{\n\
    \  manager: 'Jen',\n  name: 'Bob'\n}, {\n  manager: 'Jen',\n  name: 'Sue'\n},\
    \ {\n  manager: 'Bob',\n  name: 'Shirley'\n}, {\n  manager: 'Bob',\n  name: 'Terrence'\n\
    }]\n\nconst managerGroups = groupBy(people, 'manager')\nconst root = document.querySelector('#root')\n\
    root.innerHTML = `<pre>${JSON.stringify(managerGroups, null, 2)}</pre>`\n```\n\
    \nRun `npm start` to start `webpack` and refresh `index.html`, you should see\
    \ an array of people grouped by manager.\n\nLet's move the array of people into\
    \ its own module `people.js`\n\n```javascript\n// src/people.js\nconst people\
    \ = [{\n  manager: 'Jen',\n  name: 'Bob'\n}, {\n  manager: 'Jen',\n  name: 'Sue'\n\
    }, {\n  manager: 'Bob',\n  name: 'Shirley'\n}, {\n  manager: 'Bob',\n  name: 'Terrence'\n\
    }]\nexport default people\n```\n\nWe can simply import it from `app.js` with a\
    \ relative path.\n\n```javascript\n// src/app.js\nimport {groupBy} from 'lodash/collection'\n\
    import people from './people'\nconst managerGroups = groupBy(people, 'manager')\n\
    const root = document.querySelector('#root')\nroot.innerHTML = `<pre>${JSON.stringify(managerGroups,\
    \ null, 2)}</pre>`\n```\n\nNote: Imports without a relative path like `'lodash/collection'`\
    \ are modules from npm installed to `/node_modules`, your own modules will always\
    \ need a relative path like `'./people'`, this is how you can tell apart.\n\n\
    ## Loaders\n\nWe've already been introduced to `babel-loader`, one of many [loaders](https://webpack.js.org/loaders/)\
    \ that you can configure to tell `webpack` what to do when it encounters imports\
    \ for different file types. You can chain loaders together into a series of transforms,\
    \ a good way to see this works is by importing Sass from our JavaScript.\n\n##\
    \ Sass\n\nThis transformation involves three separate loaders and the `node-sass`\
    \ library:\n\n`npm install css-loader style-loader sass-loader node-sass --save-dev`\n\
    \nAdd a new rule to our config file for `.scss` files.\n\n```javascript\n// webpack.config.js\n\
    rules: [{\n  test: /\\.scss$/,\n  use: [\n    'style-loader',\n    'css-loader',\n\
    \    'sass-loader'\n  ]\n}, {\n  // ...\n}]\n```\n\nNote: Whenever you change\
    \ any of loading rules in `webpack.config.js` you'll need to restart the build\
    \ with `Ctrl + C` and `npm start`.\n\nThe array of loaders are processed in reverse\
    \ order:\n\n- `sass-loader` transforms Sass into CSS.\n- `css-loader` parses the\
    \ CSS into JavaScript and resolves any dependencies.\n- `style-loader` outputs\
    \ our CSS into a `<style>` tag in the document.\n\nYou can think of these as function\
    \ calls, the output of one loader feeds as input into the next.\n\n`styleLoader(cssLoader(sassLoader('source'))`\n\
    \nLet's add a Sass source file:\n\n```scss\n/* src/style.scss */\n$bluegrey: #2B3A42;\n\
    pre {\n  padding: 20px;\n  background: $bluegrey;\n  color: #dedede;\n  text-shadow:\
    \ 0 1px 1px rgba(000, .5);\n}\n```\n\nYou can now require Sass directly from your\
    \ JavaScript, import it from the top of `app.js`.\n\n```javascript\n// src/app.js\n\
    import './style.scss'\n// ...\n```\n\nReload `index.html` and you should see some\
    \ styling.\n\n## CSS in JS\n\nWe just imported a Sass file from our JavaScript,\
    \ as a module.\n\nOpen up `dist/bundle.js` and search for \"pre {\". Indeed, our\
    \ Sass has been compiled to a string of CSS and saved as a module within our bundle.\
    \ When we import this module in our JavaScript, `style-loader` outputs that string\
    \ into an embedded `<style>` tag.\n\nI know what you're thinking. Why? I won't\
    \ delve too far into this topic here, but here are a few reasons to consider:\n\
    \n- A JavaScript component you may want to include in your project may depend\
    \ on other assets to function properly (HTML, CSS, Images, SVG), if these can\
    \ all be bundled together it is far easier to import and use.\n- Dead code elimination:\
    \ When a JS component is no longer imported by your code, the CSS will no longer\
    \ be imported either. The bundle produced will only ever contain code that does\
    \ something.\n- CSS Modules: The global namespace of CSS makes it very difficult\
    \ to be confident that a change to your CSS will have any side effects. [CSS modules](https://github.com/css-modules/css-modules)\
    \ change this by making CSS local by default and exposing unique class names that\
    \ you can reference in your JavaScript.\n- Bring down the number of HTTP requests\
    \ by bundling code in clever ways.\n\n## Images\n\nThe last example of loaders\
    \ we'll look at is the handling of images with `url-loader`.\n\nIn a standard\
    \ HTML document images are fetched when the browser encounters an `<img>` tag\
    \ or an element with a `background-image` property. With `webpack` you can optimize\
    \ this in the case of small images by storing the source of the images as strings\
    \ inside your JavaScript. By doing this you preload them and the browser won't\
    \ have to fetch them with separate requests.\n\n`npm install file-loader url-loader\
    \ --save-dev`\n\nAdd one more rule for loading images:\n\n```javascript\n// webpack.config.js\n\
    rules: [{\n  test: /\\.(png|jpg)$/,\n  use: [{\n    loader: 'url-loader',\n  \
    \  options: { limit: 10000 } // Convert images < 10k to base64 strings\n  }]\n\
    }]\n```\n"
