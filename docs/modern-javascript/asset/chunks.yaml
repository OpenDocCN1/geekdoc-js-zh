    \ \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n\n \n\n## 第 6 步：自动化任务\n\n我们一直在一次运行一个任务。我们可以通过在\
    \ `gulpfile.js` 中添加一个新的 `run` 任务来一次性运行所有任务：\n\n```javascript\n// 运行所有任务\ngulp.task('run',\
    \ ['html', 'css', 'js']);\n```\n\n保存并输入 `gulp run` 执行所有任务。注意我省略了 `images` 任务，因为已经是\
    \ `html` 和 `css` 任务的依赖。\n\n这仍然太费力了？Gulp 提供了另一种方法——`gulp.watch`，它可以监控源文件并在文件更改时运行相应的任务。该方法接收一个文件夹和一个发生变化时执行的任务列表。让我们在\
    \ `gulpfile.js` 的末尾创建一个 `watch` 任务：\n\n```javascript\n// 监听变化\ngulp.task('watch',\
    \ function() {\n  //图像变化\n  gulp.watch(folder.src + 'images/**/*', ['images']);\n\
    \  // HTML 变化\n  gulp.watch(folder.src + 'html/**/*', ['html']);\n  // JavaScript\
    \ 变化\n  gulp.watch(folder.src + 'js/**/*', ['js']);\n  // CSS 变化\n  gulp.watch(folder.src\
    \ + 'scss/**/*', ['css']);\n});\n```\n\n与其立即运行 `gulp watch`，让我们添加一个默认任务：\n\n```javascript\n\
    // 默认任务\ngulp.task('default', ['run', 'watch']);\n```\n\n保存 `gulpfile.js` 并在命令行输入\
    \ `gulp`。你的图像、HTML、CSS 和 JavaScript 将被处理，然后 Gulp 将保持活跃监控更新并在需要时重新运行任务。按 Ctrl/Cmd\
    \ + C 停止监控并返回命令行。\n\n## 第 7 步：获利！\n\n其他你可能觉得有用的插件：\n\n* [gulp-load-plugins](https://www.npmjs.com/package/gulp-load-plugins)\
