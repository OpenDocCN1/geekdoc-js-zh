    \ `v6.1.0` 到 `v6.2.0` 是一个次版本发布。\n\n`npm` 团队相信[semver](http://semver.org/)，但你不应该信任。我的意思是他们允许开源开发者在次版本中引入破坏性变更。使用\
    \ [shrinkwrap](https://nodejs.org/blog/managing-dependencies-with-shrinkwrap/)\
    \ 来锁定版本。\n\n## 结论\n\n这篇文章是两部分之一。我们已经涵盖了大量内容，从处理回调和异步代码到检查错误。我希望你从中发现了新的或有用的内容。如果你喜欢，请务必查看第二部分：[Node.js\
    \ 实践：来自大师的启示](https://www.sitepoint.com/node-js-best-practices-from-gurus/)。\n\
    \n## 第 8 章：函数式 JavaScript 简介\n\nM. David\n\n你听说过 JavaScript 是一种函数式语言，或者至少它支持函数式编程。但什么是函数式编程？而且，如果你开始学习编程范式，对于你一直编写的\
    \ JavaScript 来说？\n\n嗯，好消息是 JavaScript 在范式方面并不挑剔。你可以根据需要混合命令式、面向对象、原型和函数式代码，并仍然完成工作。但坏消息是这对你的代码意味着什么。JavaScript\
    \ 同时支持多种编程风格，因此对于维护性、可读性和性能做出正确的选择。\n\n函数式 JavaScript 不需要接管整个项目就能产生价值。学习一些函数式方法可以引导你在构建项目时的某些决策，无论你倾向于如何组织代码。学习一些函数式模式和技术可以让你走上编写更简洁、更优雅\
    \ JavaScript 的道路。\n\n### 命令式 JavaScript\n\nJavaScript 最初是作为浏览器内语言流行的，主要用于为网页上的元素添加简单的悬停和点击效果。多年来，这就是人们对它的大部分了解，而且这导致了\
    \ JavaScript 早期获得的坏声誉。\n\n当开发者努力让 JavaScript 的灵活性匹配文档对象模型（DOM）的复杂性时，现实世界的 JavaScript\
    \ 代码通常像这样：\n\n```javascript\nvar result;\nfunction getText() {\n  var someText\
    \ = prompt(\"给我一些需要大大写的文字\");\n  capWords(someText);\n  alert(result.join(\" \"\
    ));\n};\nfunction capWords(input) {\n  var counter;\n  var inputArray = input.split(\"\
    \ \");\n  var transformed = \"\";\n  result = [];\n  for (counter = 0; counter\
    \ < inputArray.length; counter++) {\n    transformed = [\n      inputArray[counter].charAt(0).toUpperCase(),\
    \ \n      inputArray[counter].substring(1)\n    ].join(\"\");\n    result.push(transformed);\n\
    \  }\n};\n\ndocument.getElementById(\"main_button\").onclick = getText;\n```\n"
- fmt: "\nSo many things are going on in this little snippet of code. Variables are\
    \ being defined on the global scope. Values are being passed around and modified\
    \ by functions. DOM methods are being mixed with native JavaScript. The function\
    \ names are not very descriptive, and that’s due in part to the fact that the\
    \ whole thing relies on a context that may or not exist. But if you happened to\
    \ run this in a browser inside an HTML document that defined a `<button id=\"\
    main_button\">`, you might get prompted for some text to work with, and then see\
    \ the an `alert` with first letter of each of the words in that text capitalized.\n\
    \nImperative code like this is written to be read and executed from top to bottom\
    \ (give or take a little [variable hoisting](http://www.sitepoint.com/demystifying-javascript-variable-scope-hoisting/)).\
    \ But there are some improvements we could make to clean it up and make it more\
    \ readable by taking advantage of JavaScript’s object-oriented nature.\n\n## Object-Oriented\
    \ JavaScript\n\nAfter a few years, developers started to notice the problems with\
    \ imperative coding in a shared environment like the browser. Global variables\
    \ from one snippet of JavaScript clobbered global variables set by another. The\
    \ order in which the code was called affected the results in ways that could be\
    \ unpredictable, especially given the delays introduced by network connections\
    \ and rendering times.\n\nEventually, some better practices emerged to help encapsulate\
    \ JavaScript code and make it play better with the DOM. An updated variation of\
    \ the same code above, written to an object-oriented standard, might look something\
    \ like this:\n\n```javascript\n(function() {\n  \"use strict\";\n  var SomeText\
    \ = function(text) {\n    this.text = text;\n  };\n  SomeText.prototype.capify\
    \ = function(str) {\n    var firstLetter = str.charAt(0);\n    var remainder =\
    \ str.substring(1);\n    return [firstLetter.toUpperCase(), remainder].join(\"\
    \");\n  };\n  SomeText.prototype.capifyWords = function() {\n    var result =\
    \ [];\n    var textArray = this.text.split(\" \");\n    for (var counter = 0;\
    \ counter < textArray.length; counter++) {\n      result.push(this.capify(textArray[counter]));\n\
    \    }\n    return result.join(\" \");\n  };\n  document.getElementById(\"main_button\"\
    ).addEventListener(\"click\", function(e) {\n    var something = prompt(\"Give\
    \ me something to capitalize\");\n    var newText = new SomeText(something);\n\
    \    alert(newText.capifyWords());\n  });\n}());\n```\n\nIn this object-oriented\
    \ version, the constructor function simulates a class to model the object we want.\
    \ Methods live on the new object’s prototype to keep memory use low. And all of\
    \ the code is isolated in an anonymous immediately-invoked function expression\
    \ so it doesn’t litter the global scope. There’s even a `\"use strict\"` directive\
    \ to take advantage of the latest JavaScript engine, and the old-fashioned `onclick`\
    \ method has been replaced with a shiny new `addEventListener`, because who uses\
    \ IE8 or earlier anymore? A script like this would likely be inserted at the end\
    \ of the `<body>` element on an HTML document, to make sure all DOM had been loaded\
    \ before it was processed so the `<button>` it relies on would be available.\n\
    \nBut despite all this reconfiguration, there are still many artifacts of the\
    \ same imperative style that led us here. The methods in the constructor function\
    \ rely on variables that are scoped to the parent object. There’s a looping construct\
    \ for iterating across all the members of the array of strings. There’s a `counter`\
    \ variable that serves no purpose other than to increment the progress through\
    \ the `for` loop. And there are methods that produce the side effect of modifying\
    \ variables that exist outside of their own definitions. All of this makes the\
    \ code more brittle, less portable, and makes it harder to test the methods outside\
    \ of this narrow context.\n\n## Functional JavaScript\n\nThe object-oriented approach\
    \ is much cleaner and more modular than the imperative approach we started with,\
    \ but let’s see if we can improve it by addressing some of the drawbacks we discussed.\
    \ It would be great if we could find ways to take advantage of JavaScript’s built-in\
    \ ability to treat functions as first-class objects so that our code could be\
    \ cleaner, more stable, and easier to repurpose.\n\n```javascript\n(function()\
    \ {\n  \"use strict\";\n  var capify = function(str) {\n    return [str.charAt(0).toUpperCase(),\
    \ str.substring(1)].join(\"\");\n  };\n  var processWords = function(str) {\n\
    \    return str.split(\" \").map(capify).join(\" \");\n  };\n  document.getElementById(\"\
    main_button\").addEventListener(\"click\", function(e) {\n    var something =\
    \ prompt(\"Give me something to capitalize\");\n    alert(processWords(something));\n\
    \  });\n}());\n```\n\nDid you notice how shorter this version is? We’re only defining\
    \ two functions: `capify` and `processWords`. Each of these is pure, meaning they\
    \ return the same result for any given input. Using `map` here, in place of `for`\
    \ loop, eliminated the `counter` variable and helped make our code much cleaner.\n"
  raw: 'So many things are going on in this little snippet of code. Variables are
    being defined on the global scope. Values are being passed around and modified
    by functions. DOM methods are being mixed with native JavaScript. The function
    names are not very descriptive, and that’s due in part to the fact that the whole
    thing relies on a context that may or may not exist. But if you happened to run
    this in a browser inside an HTML document that defined a `<button id="main_button">`,
    you might get prompted for some text to work with, and then see the an `alert`
    with first letter of each of the words in that text capitalized.


    Imperative code like this is written to be read and executed from top to bottom
    (give or take a little [variable hoisting](http://www.sitepoint.com/demystifying-javascript-variable-scope-hoisting/)).
    But there are some improvements we could make to clean it up and make it more
    readable by taking advantage of JavaScript’s object-oriented nature.


    Object-Oriented JavaScript


    After a few years, developers started to notice the problems with imperative coding
    in a shared environment like the browser. Global variables from one snippet of
    JavaScript clobbered global variables set by another. The order in which the code
    was called affected the results in ways that could be unpredictable, especially
    given the delays introduced by network connections and rendering times.


    Eventually, some better practices emerged to help encapsulate JavaScript code
    and make it play better with the DOM. An updated variation of the same code above,
    written to an object-oriented standard, might look something like this:


    `(function() {`


    `  "use strict";`


    `  var SomeText = function(text) {`


    `    this.text = text;`


    `  };`


    `  SomeText.prototype.capify = function(str) {`


    `    var firstLetter = str.charAt(0);`


    `    var remainder = str.substring(1);`


    `    return [firstLetter.toUpperCase(), remainder].join("");`


    `  };`


    `  SomeText.prototype.capifyWords = function() {`


    `    var result = [];`


    `    var textArray = this.text.split(" ");`


    `    for (var counter = 0; counter < textArray.length; counter++) {`


    `      result.push(this.capify(textArray[counter]));`


    `    }`


    `    return result.join(" ");`


    `  };`


    `  document.getElementById("main_button").addEventListener("click", function(e) {`


    `    var something = prompt("Give me something to capitalize");`


    `    var newText = new SomeText(something);`


    `    alert(newText.capifyWords());`


    `  });`


    `}());`


    In this object-oriented version, the constructor function simulates a class to
    model the object we want. Methods live on the new object’s prototype to keep memory
    use low. And all of the code is isolated in an anonymous immediately-invoked function
    expression so it doesn’t litter the global scope. There’s even a `"use strict"`
    directive to take advantage of the latest JavaScript engine, and the old-fashioned
    `onclick` method has been replaced with a shiny new `addEventListener`, because
    who uses IE8 or earlier anymore? A script like this would likely be inserted at
    the end of the `<body>` element on an HTML document, to make sure all the DOM
    had been loaded before it was processed so the `<button>` it relies on would be
    available.


    But despite all this reconfiguration, there are still many artifacts of the same
    imperative style that led us here. The methods in the constructor function rely
    on variables that are scoped to the parent object. There’s a looping construct
    for iterating across all the members of the array of strings. There’s a `counter`
    variable that serves no purpose other than to increment the progress through the
    `for` loop. And there are methods that produce the side effect of modifying variables
    that exist outside of their own definitions. All of this makes the code more brittle,
    less portable, and makes it harder to test the methods outside of this narrow
    context.


    Functional JavaScript


    The object-oriented approach is much cleaner and more modular than the imperative
    approach we started with, but let’s see if we can improve it by addressing some
    of the drawbacks we discussed. It would be great if we could find ways to take
    advantage of JavaScript’s built-in ability to treat functions as first-class objects
    so that our code could be cleaner, more stable, and easier to repurpose.


    `(function() {`


    `  "use strict";`


    `  var capify = function(str) {`


    `    return [str.charAt(0).toUpperCase(), str.substring(1)].join("");`


    `  };`


    `  var processWords = function(fn, str) {`


    `    return str.split(" ").map(fn).join(" ");`


    `  };`


    `  document.getElementById("main_button").addEventListener("click", function(e) {`


    `    var something = prompt("Give me something to capitalize");`


    `    alert(processWords(capify, something));`


    `  });`


    `}());`


    Did you notice how much shorter this version is? We’re only defining two functions:
    `capify` and `processWords`. Each of these functions is pure, meaning that they
    don’t rely on the state of the code they’re called from. The functions don’t create
    side effects that alter variables outside of themselves. There is one and only
    one result a function returns for any given set of arguments. Because of these
    improvements, the new functions are very easy to test, and could be snipped right
    out of this code and used elsewhere without any modifications.


    There might have been one keyword in there that you wouldn’t recognize unless
    you’ve peeked at some functional code before. We took advantage of the new [map
    method](https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/Array/map)
    on `Array` to apply a function to each element of the temporary array we created
    when we split our string. `Map` is just one of a handful of convenience methods
    we were given when modern browsers and server-side JavaScript interpreters implemented
    the ECMAscript 5 standards. Just using `map` here, in place of a `for` loop, eliminated
    the `counter` variable and helped make our code much cleaner and easier to read.


    Start Thinking Functionally


    You don’t have to abandon everything you know to take advantage of the functional
    paradigm. You can get started thinking about your JavaScript in a functional way
    by considering a few questions when you write your next program:


    *   Are my functions dependent on the context in which they are called, or are
    they pure and independent?


    *   Can I write these functions in such a way that I could depend on them always
    returning the same result for a given input?


    *   Am I sure that my functions don’t modify anything outside of themselves?


    *   If I wanted to use these functions in another program, would I need to make
    changes to them?


    This introduction barely scratches the surface of functional JavaScript, but I
    hope it whets your appetite to learn more.


    Chapter 9: An Introduction to Chart.js 2.0 — Six Simple Examples


    by Jack Rometty


    Peer reviewed by [Tim Severien](https://www.sitepoint.com/author/tseverien/) and
    [Simon Codrington](https://www.sitepoint.com/author/scodrington/).


    If your website is data-intensive, then you will need to find a way to make that
    data easy to visualize. Humans, after all, are not wonderful at understanding
    long lists of raw numbers. That''s where charts and graphs come in — they can
    make complicated statistical relationships obvious and intuitive, as well as more
    accessibile to non-English speakers. Everyone understands basic charts at the
    same speed, the same can''t be said for paragraphs rife with technical jargon.
    Using charts when it''s beneficial, will make your website easier to understand
    and visually more appealing.


    In this article I''ll introduce you to a JavaScript charting library called [Chart.js](http://www.chartjs.org/).
    Using six stylish examples, I''ll demonstrate how you can use Chart.js to visualize
    data on your website, as well as configure it to meet your needs.


    Why Chart.js?'
