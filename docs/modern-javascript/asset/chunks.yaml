    \nChapter 1: The Anatomy of a Modern JavaScript Application\n\nby James Kolce\n\
    \nThere's no doubt that the JavaScript ecosystem changes fast. Not only are new\
    \ tools and frameworks introduced and developed at a rapid rate, the language\
    \ itself has undergone big changes with the introduction of ES2015 (aka ES6).\
    \ Understandably, many articles have been written complaining about how difficult\
    \ it is to learn modern JavaScript development these days.\n\nIn this article,\
    \ I'll introduce you to modern JavaScript. We'll take a look at the most recent\
    \ developments in the language and get an overview of the tools and techniques\
    \ currently used to write frontend web applications. If you're just starting out\
    \ with learning the language, or you've not touched it for a few years and are\
    \ wondering what happened to the JavaScript you used to know, this article is\
    \ for you.\n\nA Note about Node.js\n\nNode.js is a runtime that allows server-side\
    \ programs to be written in JavaScript. It is possible to have full-stack JavaScript\
    \ applications, where both the front and backend of the app is written in the\
    \ same language. Although this article is focused on client-side development,\
    \ Node.js still plays an important role.\n\nThe arrival of Node.js had a significant\
    \ impact on the JavaScript ecosystem, introducing the npm package manager and\
    \ popularizing the CommonJS module format. Developers started to build more innovative\
    \ tools and develop new approaches to blur the line between the browser, the server,\
    \ and native applications.\n\nJavaScript ES2015+\n\nIn 2015, the sixth version\
    \ of [ECMAScript](https://en.wikipedia.org/wiki/ECMAScript)—the specification\
    \ that defines the JavaScript language—was released under the name of [ES2015](http://www.ecma-international.org/ecma-262/6.0/)\
    \ (still often referred to as ES6). This new version included substantial additions\
    \ to the language making easier and more feasible to build ambitious web applications.\
    \ But improvements don’t stop with ES2015; each year, a new version is released.\n\
    \nDeclaring variables\n\nJavaScript now has two additional ways to declare variables:\
    \ [let and const](https://www.sitepoint.com/how-to-declare-variables-javascript/).\n\
    \n`let` is the successor to `var` - although `var` is still available, `let` limits\
    \ the scope of variables to the block (rather than the function) they're declared\
    \ within, which reduces the room for error:\n\n`// ES5`\n\n`for (var i = 1; i < 5; i++) {`\n\
    \n`  console.log(i);`\n\n`}`\n\n`// <-- logs the numbers 1 to 4`\n\n`console.log(i);`\n\
    \n`// <-- 5 (variable i still exists outside the loop)`\n\n`// ES2015`\n\n`for (let j = 1; j < 5; j++) {`\n\
    \n`  console.log(j);`\n\n`}`\n\n`console.log(j);`\n\n`// <-- 'Uncaught ReferenceError: j is not defined'`\n\
    \nUsing `const` allows you to define variables that cannot be rebound to new values.\
    \ For primitive values such as strings and numbers, this results in something\
    \ similar to a constant, as you cannot change the value once it has been declared.\n\
    \n`const name = 'Bill';`\n\n`name = 'Steve';`\n\n`// <-- 'Uncaught TypeError: Assignment to constant variable.'`\n\
    \n`// Gotcha`\n\n`const person = { name: 'Bill' };`\n\n`person.name = 'Steve';`\n\
    \n`// person.name is now Steve. `\n\n`// As we're not changing the object that person is bound to, JavaScript doesn't complain.`\n\
    \nArrow functions"
