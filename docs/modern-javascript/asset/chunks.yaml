  trans: '


    [TypeScript](https://www.typescriptlang.org/) 是一种构建在 JavaScript 之上由微软开发的新语言。它是
    `JavaScript ES2015` 的超集，并包含了该语言新版本的特性。你可以用它代替 `Babel` 来编写顶尖的 JavaScript。它还具有极其强大的类型系统，可以通过结合注解和类型推断对你的代码进行静态分析。


    这还有一个更微妙的益处。TypeScript 受到了 `Java` 和 `.NET` 的深远影响，因此如果你的开发人员具有这些语言之一的背景，他们可能会发现
    TypeScript 比纯 JavaScript 更容易学习（注意我们是如何从工具切换到你的个人环境的）。尽管 `Angular` 是第一个积极采用 TypeScript
    的主流框架，但你也可以将其与 `React` 配合使用。


    [延伸阅读：[TypeScript 简介：面向 Web 的静态类型](https://www.sitepoint.com/introduction-to-typescript/)]


    # RxJS


    [RxJS](http://reactivex.io/rxjs/) 是一个响应式编程库，允许更灵活地处理异步操作和事件。它是观察者模式（`Observer`）和迭代器模式（`Iterator`）与函数式编程的结合。RxJS
    允许你将任何内容视为值的连续流，并对其执行各种操作，如映射、过滤、分割或合并。


    该库已被 `Angular` 采用并在他们的 HTTP 模块中用于内部使用。当你执行 HTTP 请求时，它返回的是一个 `Observable` 而不是普通的
    `Promise`。虽然这个库非常强大，但它相当复杂。要精通它，你需要熟悉不同类型的 `Observables`、`Subjects` 以及[数百个方法和操作符](http://reactivex.io/rxjs/manual/overview.html#operators)。天哪，仅仅为了发送
    HTTP 请求，这似乎有点过头了！


    当你在大量处理连续数据流（如 web sockets ）时，RxJS 是很有用的，但对于任何其他情况，它似乎都过于复杂了。无论如何，在编写 `Angular`
    时，你至少需要学习它的基础知识。


    [延伸阅读：使用 RxJS 学习函数式响应式编程简介](https://www.sitepoint.com/functional-reactive-programming-rxjs/)]


    我们发现 TypeScript 是提高项目可维护性的极佳工具，特别是对于代码库巨大或领域/业务逻辑复杂的项目。用 TypeScript 编写的代码更具描述性且更容易遵循。由于
    TypeScript 已被 `Angular` 采用，我们希望看到更多项目使用它。另一方面，RxJS 似乎只在某些情况下有利，应该谨慎采用。否则，它会给你的项目带来意外的复杂性。


    # 生态系统


    开源框架的伟大之处在于围绕它们创建的工具数量。有时候，让我们看看与每个框架关联的一些热门工具和库。


    ## Angular


    ### Angular CLI


    现代框架的一个流行趋势是拥有一个 CLI 工具，帮助你启动项目，而无需自己配置构建。`Angular` 提供了 [Angular CLI](https://cli.angular.io/)来实现这一目标。它允许你通过几个命令即可生成并运行项目。所有负责构建应用程序、启动开发服务器和运行测试的脚本都隐藏在
    `node_modules` 中。你也可以用它在开发期间生成新代码。这使得设置新项目变得轻而易举。


    [延伸阅读：终极 Angular CLI 参考指南](https://www.sitepoint.com/ultimate-angular-cli-reference/)]


    ### Ionic 2


    [Ionic 2](http://ionic.io/2) 是用于开发混合移动应用程序的流行框架的新版本。它提供了一个与 `Angular 2` 良好集成的
    `Cordova` 容器，以及非常漂亮的 Material 组件库。使用它，你可以轻松地设置和构建移动应用程序。如果你倾向于混合应用而非原生应用，这是一个很好的选择。


    ### Material design components


    如果你是 Material design 的粉丝，你会很高兴听到听到 `Angular` 已经有一套 [Material 组件库](https://material.angular.io/)可用。目前，它仍处于早期阶段且略显粗糙，但最近收到了大量贡献，所以我们可能很快就能看到改进。


    ### Angular universal


    [Angular universal](https://github.com/angular/universal) 是一个可以用于支持服务器端渲染项目的种子项目。


    ### @ngrx/store


    [@ngrx/store](https://github.com/ngrx/store) 是一个受 `Redux` 启发的 `Angular` 状态管理库，基于纯还原器（pure
    reducers）改变的状态。它与 `RxJS` 的集成允许你利用推送变化检测策略来获得更好的性能。


    > 在 [Awesome Angular 列表](https://github.com/AngularClass/awesome-angular) 中还有许多其他库和工具。


    ## React


    ### Create react app


    [Createreact-app](https://github.com/facebookincubator/create-react-app) 是一个用于
    `React` 的 CLI 工具，可快速设置新项目。与 `Angular CLI` 类似，它允许你生成新项目、启动开发服务器并创建包。它使用 Facebook
    较新的测试运行器 [Jest](https://www.sitepoint.com/test-react-components-jest/) 进行单元测试，它本身也有一些很棒的功能。它还支持使用环境变量进行灵活的应用分析、本地开发中的后端代理、`Flow`
    以及其他功能。查看简短的 [createreact-app 介绍](https://www.sitepoint.com/create-react-app/)
    以获取更多信息。


    ### React Native


    [React Native](https://facebook.github.io/react-native/) 是 Facebook 开发的一个使用 React
    创建原生移动应用的平台。与生成混合应用的 Ionic 不同，`React Native` 生成真正的原生 UI。它提供了一套标准的 React 组件，这些组件绑定到相应的原生组件。它还允许你创建自己的组件并将其绑定到使用
    `Objective-C`、`Java` 或 `Swift` 编写的原生代码。


    ### Material UI


    `React` 也有一个 [material design 组件](http://www.material-ui.com) 库。与 `Angular` 的版本相比，这个更加成熟且提供的组件范围更广。


    ### Next.js


    [Next.js](https://github.com/zeit/next.js/) 是一个用于 `React` 应用服务器端渲染的框架。它提供了一种灵活的方法在服务器上完全或部分渲染你的应用程序，返回结果并在浏览器中继续。它试图让创建通用应用的复杂任务变得尽可能简单，因此设计得尽可能简单，对新原理和项目结构的要求最小。


    ### MobX


    [MobX](https://github.com/mobxjs/mobx) 是另一种管理应用状态的库。它不像 `Redux` 那样将状态存在单个不可变存储中，而是鼓励你只存储所需的最小状态，并从中推导出其他状态。它提供了一套装饰器来定义观察对象和观察者，并为你的状态引入响应式逻辑。


    [延伸阅读：如何使用 MobX 管理 JavaScript 应用状态](https://www.sitepoint.com/manage-javascript-application-state-mobx/)]


