    \       keylist\n          .filter(key => key !== CACHE)\n          .map(key =>\
    \ caches.delete(key))\n      );\n    });\n}\n\n// application activated\nself.addEventListener('activate',\
    \ event => {\n  console.log('service worker: activate');\n  // delete old caches\n\
