    \ (saved 12.8 kB)\n```\n\n尝试再次运行 `gulp images`，应该不会发生任何变化，因为没有新的图像了。\n\n## HTML\
    \ 任务\n\n我们现在可以创建一个类似的任务，用于从源 HTML 文件夹复制文件。我们可以使用 [gulp-htmlclean](https://www.npmjs.com/package/gulp-htmlclean)\
    \ 插件来安全地对 HTML 代码进行压缩化，以移除不必要的空格和属性：\n\n```bash\nnpm install gulp-htmlclean --save-dev\n\
    ```\n\n然后在 `gulpfile.js` 的顶部引入引用它：\n\n```javascript\nvar\n  // 模块\n  gulp = require('gulp'),\n\
    \  newer = require('gulp-newer'),\n  imagemin = require('gulp-imagemin'),\n  htmlclean\
    \ = require('gulp-htmlclean'),\n```\n\n我们现在可以在 `gulpfile.js` 的末尾创建一个 `html` 任务：\n\
    \n```javascript\n// HTML 处理\ngulp.task('html', ['images'], function() {\n  var\n\
    \    out = folder.build + 'html/',\n    page = gulp.src(folder.src + 'html/**/*')\n\
    \      .pipe(newer(out));\n  // 压缩生产代码\n  if (!devBuild) {\n    page = page.pipe(htmlclean());\n\
    \  }\n  return page.pipe(gulp.dest(out));\n});\n```\n\n这复用了 `gulp-newer` 并引入了几个概念：\n\
    \n1. `[images]` 参数表示在处理 HTML 之前必须运行 `images` 任务（HTML 可能会引用图像）。此数组中可以列出任意数量的依赖任务，且所有任务都将在任务函数运行之前完成。\n\
    2. 只有当 `NODE_ENV` 设置为 `production` 时，我们才将 HTML 传递给 `gulp-htmlclean`。因此，HTML 在开发期间将保持未压缩状态，这可能对调试有用。\n\
    \n保存 `gulpfile.js` 并从命令行运行 `gulp html`。`html` 和 `images` 任务都会运行。\n\n## JavaScript\
    \ 任务\n\n对你来说太简单了？让我们通过构建一个基础的模块打包器来处理所有的 JavaScript 文件。它将：\n\n1. 使用 [gulp-deporder](https://www.npmjs.com/package/gulp-deporder)\
    \ 插件确保先加载依赖。它会分析每个脚本顶部的注释以确保正确的顺序，例如 `// requires: defaults.js lib.js`。\n2. 使用\
    \ [gulp-concat](https://www.npmjs.com/package/gulp-concat) 将所有脚本文件合并成单个 `main.js`\
    \ 文件，并且\n3. 使用 [gulp-strip-debug](https://www.npmjs.com/package/gulp-strip-debug)\
    \ 移除所有的 `console` 和 `debugging` 语句，并使用 [gulp-uglify](https://www.npmjs.com/package/gulp-uglify)\
    \ 压缩代码。此步骤只会在生产模式下发生。\n\n安装插件：\n\n```bash\nnpm install gulp-deporder gulp-concat\
    \ gulp-strip-debug gulp-uglify --save-dev\n```\n\n在 `gulpfile.js` 的顶部引用它们：\n\n\
    ```javascript\nvar\n  ...\n  concat = require('gulp-concat'),\n  deporder = require('gulp-deporder'),\n\
    \  stripdebug = require('gulp-strip-debug'),\n  uglify = require('gulp-uglify'),\n\
    ```\n\n然后添加一个新的的 `js` 任务：\n\n```javascript\n// JavaScript 处理\ngulp.task('js',\
    \ function() {\n  var jsbuild = gulp.src(folder.src + 'js/**/*')\n    .pipe(deporder())\n\
    \    .pipe(concat('main.js'));\n  if (!devBuild) {\n    jsbuild = jsbuild\n  \
    \    .pipe(stripdebug())\n      .pipe(uglify());\n  }\n  return jsbuild.pipe(gulp.dest(folder.build\
    \ + 'js/'));\n});\n```\n\n保存然后运行 `gulp js` 来体验魔法！\n\n## CSS 任务\n\n最后，让我们创建一个 CSS\
