  raw: '`Finished ''imagemin'' in 5.71 ms`


    `gulp-imagemin: image1.png (saved 48.7 kB)`


    `gulp-imagemin: image2.jpg (saved 36.2 kB)`


    `gulp-imagemin: image3.svg (saved 12.8 kB)`


    Try running `gulp images` again and nothing should happen because no newer images
    exist.


    HTML Task


    We can now create a similar task which copies files from the source HTML folder.
    We can safely minify our HTML code to remove unnecessary whitespace and attributes
    using the [gulp-htmlclean](https://www.npmjs.com/package/gulp-htmlclean) plug-in:


    `npm install gulp-htmlclean --save-dev`


    which is then referenced at the top of `gulpfile.js`:


    `var`


    `  // modules`


    `  gulp = require(''gulp''),`


    `  newer = require(''gulp-newer''),`


    `  imagemin = require(''gulp-imagemin''),`


    `  htmlclean = require(''gulp-htmlclean''),`


    We can now create an `html` task at the end of `gulpfile.js`:


    `// HTML processing`


    `gulp.task(''html'', [''images''], function() {`


    `  var`


    `    out = folder.build + ''html/'',`


    `    page = gulp.src(folder.src + ''html/**/*'')`


    `      .pipe(newer(out));`


    `  // minify production code`


    `  if (!devBuild) {`


    `    page = page.pipe(htmlclean());`


    `  }`


    `  return page.pipe(gulp.dest(out));`


    `});`


    This reuses `gulp-newer` and introduces a couple of concepts:


    1.  The `[images]` argument states that our `images` task must be run before processing
    the HTML (the HTML is likely to reference images). Any number of dependent tasks
    can be listed in this array and all will complete before the task function runs.


    2.  We only pipe the HTML through `gulp-htmlclean` if `NODE_ENV` is set to `production`.
    Therefore, the HTML remains uncompressed during development which may be useful
    for debugging.


    Save `gulpfile.js` and run `gulp html` from the command line. Both the `html`
    and `images` tasks will run.


    JavaScript Task


    Too easy for you? Let''s process all our JavaScript files by building a basic
    module bundler. It will:


    1.  ensure dependencies are loaded first using the [gulp-deporder](https://www.npmjs.com/package/gulp-deporder)
    plug-in. This analyses comments at the top of each script to ensure correct ordering
    e.g. `// requires: defaults.js lib.js`.


    2.  concatenate all script files into a single `main.js` file using [gulp-concat](https://www.npmjs.com/package/gulp-concat),
    and


    3.  remove all `console` and `debugging` statements with [gulp-strip-debug](https://www.npmjs.com/package/gulp-strip-debug)
    and minimize code with [gulp-uglify](https://www.npmjs.com/package/gulp-uglify).
    This step will only occur when running in production mode.


    Install the plugins:


    `npm install gulp-deporder gulp-concat gulp-strip-debug gulp-uglify --save-dev`


    Reference them at the top of `gulpfile.js`:


    `var`


    `  ...`


    `  concat = require(''gulp-concat''),`


    `  deporder = require(''gulp-deporder''),`


    `  stripdebug = require(''gulp-strip-debug''),`


    `  uglify = require(''gulp-uglify''),`


    Then add a new `js` task:


    `// JavaScript processing`


    `gulp.task(''js'', function() {`


    `  var jsbuild = gulp.src(folder.src + ''js/**/*'')`


    `    .pipe(deporder())`


    `    .pipe(concat(''main.js''));`


    `  if (!devBuild) {`


    `    jsbuild = jsbuild`


    `      .pipe(stripdebug())`


    `      .pipe(uglify());`


    `  }`


    `  return jsbuild.pipe(gulp.dest(folder.build + ''js/''));`


    `});`


    Save then run `gulp js` to watch the magic happen!


    CSS Task


    Finally, let’s create a CSS task which compiles Sass `.scss` files to a single
    `.css` file using [gulp-sass](https://www.npmjs.com/package/gulp-sass). This is
    a Gulp plug-in for [node-sass](https://www.npmjs.com/package/node-sass) which
    binds to the super-fast [LibSass C/C++ port of the Sass engine](http://sass-lang.com/libsass)
    (you won''t need to install Ruby). We''ll presume your primary Sass file `scss/main.scss`
    is responsible for loading all partials.


    Our task will also utilize the fabulous [PostCSS](http://postcss.org/) via the
    [gulp-postcss](https://github.com/postcss/gulp-postcss) plug-in. PostCSS requires
    its own set of plugins and we''ll install:


    *   [postcss-assets](https://www.npmjs.com/package/postcss-assets) to manage assets.
    This allows us to use properties such as `background: resolve(''image.png'');`
    to resolve file paths or `background: inline(''image.png'');` to inline data-encoded
    images.


    *   [autoprefixer](https://www.npmjs.com/package/autoprefixer) to automatically
    add vendor prefixes to CSS properties.


    *   [css-mqpacker](https://www.npmjs.com/package/css-mqpacker) to pack multiple
    references to the same CSS media query into a single rule.


    *   [cssnano](https://www.npmjs.com/package/cssnano) to minify the CSS code when
    running in production mode.


    First, install all the modules:


    `npm install gulp-sass gulp-postcss postcss-assets autoprefixer css-mqpacker cssnano --save-dev`


    and reference them at the top of `gulpfile.js`:


    `var`


    `  ...`


    `  sass = require(''gulp-sass''),`


    `  postcss = require(''gulp-postcss''),`


    `  assets = require(''postcss-assets''),`


    `  autoprefixer = require(''autoprefixer''),`


    `  mqpacker = require(''css-mqpacker''),`


    `  cssnano = require(''cssnano''),`


    We can now create a new `css` task at the end of `gulpfile.js`. Note the `images`
    task is set as a dependency because the `postcss-assets` plug-in can reference
    images during the build process. In addition, most plugins can be passed arguments
    - refer to their documentation for more information:


    `// CSS processing`


    `gulp.task(''css'', [''images''], function() {`


    `  var postCssOpts = [`


    `  assets({ loadPaths: [''images/''] }),`


    `  autoprefixer({ browsers: [''last 2 versions'', ''> 2%''] }),`


    `  mqpacker`


    `  ];`


    `  if (!devBuild) {`


    `    postCssOpts.push(cssnano);`


    `  }`


    `  return gulp.src(folder.src + ''scss/main.scss'')`


    `    .pipe(sass({`


    `      outputStyle: ''nested'',`


    `      imagePath: ''images/'',`


    `      precision: 3,`


    `      errLogToConsole: true`


    `    }))`


    `    .pipe(postcss(postCssOpts))`


    `    .pipe(gulp.dest(folder.build + ''css/''));`


    `});`


    Save the file and run the task from the command line:


    `gulp css`


    Step 6: Automate Tasks


    We''ve been running one task at a time. We can run them all in one command by
    adding a new `run` task to `gulpfile.js`:


    `// run all tasks`


    `gulp.task(''run'', [''html'', ''css'', ''js'']);`


    Save and enter `gulp run` at the command line to execute all tasks. Note I omitted
    the `images` task because it''s already set as a dependency for the `html` and
    `css` tasks.


    Is this still too much hard work? Gulp offers another method - `gulp.watch` -
    which can monitor your source files and run an appropriate task whenever a file
    is changed. The method is passed a folder and a list of tasks to execute when
    a change occurs. Let''s create a new `watch` task at the end of `gulpfile.js`:


    `// watch for changes`


    `gulp.task(''watch'', function() {`


    `  // image changes`


    `  gulp.watch(folder.src + ''images/**/*'', [''images'']);`


    `  // html changes`


    `  gulp.watch(folder.src + ''html/**/*'', [''html'']);`


    `  // javascript changes`


    `  gulp.watch(folder.src + ''js/**/*'', [''js'']);`


    `  // css changes`


    `  gulp.watch(folder.src + ''scss/**/*'', [''css'']);`


    `});`


    Rather than running `gulp watch` immediately, let''s add a default task:


    `// default task`


    `gulp.task(''default'', [''run'', ''watch'']);`


    Save `gulpfile.js` and enter `gulp` at the command line. Your images, HTML, CSS
    and JavaScript will all be processed then Gulp will remain active watching for
    updates and re-running tasks as necessary. Hit Ctrl/Cmd + C to abort monitoring
    and return to the command line.


    Step 7: Profit!


    Other plugins you may find useful:


    *   [gulp-load-plugins](https://www.npmjs.com/package/gulp-load-plugins) - load
    all Gulp plug-in modules without `require` declarations


    *   [gulp-preprocess](https://www.npmjs.com/package/gulp-preprocess) - a simple
    HTML and JavaScript [preprocess](https://github.com/jsoverson/preprocess)or


    *   [gulp-less](https://www.npmjs.com/package/gulp-less) - the [Less CSS pre-processor](http://lesscss.org/)
    plug-in'
