  trans: "\n另一个重要的事件方法是 `.stopPropagation()`，它会阻止事件向 DOM 树冒泡。这意味着如果我们在某个元素上设置了停止传播的点击监听器（比如），而在它的其中一个父元素上设置了另一个点击监听器，那么在子元素上触发的点击事件将不会在父元素上触发——否则，它将在两个地方都触发。\n\
    \n现在，`.addEventListener()` 接受一个可选的配置对象作为第三个参数，该对象可以包含以下任何布尔属性（默认值均为 `false`）：\n\
    \n- `capture`: 事件将在 DOM 中该元素下方的任何其他元素之前在该元素上触发（事件捕获和冒泡是一篇专门的文章，更多细节请参阅[这里](http://javascript.info/tutorial/bubbling-and-capturing)）。\n\
    - `once`: 正如你可能猜到的，这表示事件将只会触发一次。\n- `passive`: 这意味着 `event.preventDefault()`将被忽略（并且通常会在控制台中产生警告）。\n\
    \n最常用的选项是 `.capture`；事实上，它非常常见，以至于有一个简写：你不需要在配置对象中指定它，只需在这里传递一个布尔值即可：\n\n```\n\
    myElement.addEventListener(type, listener, true)\n```\n\n事件监听器可以使用 `.removeEventListener()`\
    \ 移除，它接受事件类型和要移除的回调函数引用；例如，`once` 也可以这样实现：\n\n```javascript\nmyElement.addEventListener('change',\
    \ function listener (event) {\n  console.log(event.type + ' got triggered on '\
    \ + this)\n  this.removeEventListener('change', listener)\n})\n```\n\n### 事件委托\n\
    \n另一个实用的模式是事件委托：假设我们有一个表单，并想为其所有的 `input` 子元素添加 `change` 事件监听器。一种方法是如上所示，使用 `myForm.querySelectorAll('input')`\
    \ 对它们进行迭代。然而，当我们我们可以同样地将其添加到表单本身上并检查 `event.target` 的内容时，这样做是不必要的。\n\n```javascript\n\
    myForm.addEventListener('change', function (event) {\n  const target = event.target\n\
    \  if (target.matches('input')) {\n    console.log(target.value)\n  }\n})\n```\n\
    \n该模式的另一个优势是，它会自动考虑到动态插入的子元素，而无需为每个元素绑定新的监听器。\n\n### 动画\n\n通常执行动画最干净的方法是应用带有 `transition`\
    \ 属性的 CSS 类，或使用 CSS `@keyframes`。但如果你需要更大的灵活性（例如用于游戏），也可以用 JavaScript 实现。\n\n\
    原始的方法是让 `window.setTimeout()` 函数不断调用自己，直到所需的动画完成。然而，这种方法低效地强制了快速的文档重流；这种布局抖动（layout\
    \ thrashing）会导致导致卡顿，尤其是在移动设备上。相反，我们可以使用 `window.requestAnimationFrame()` 同步更新，将所有当前更改调度到下一次浏览器重绘帧。它接受一个回调作为参数，接收当前的（高分辨率）戳：\n\
    \n```javascript\nconst start = window.performance.now()\nconst duration = 2000\n\
    window.requestAnimationFrame(function fadeIn (now)) {\n  const progress = now\
    \ - start\n  myElement.style.opacity = progress / duration\n  if (progress < duration)\
    \ {\n    window.requestAnimationFrame(fadeIn)\n  }\n}\n```\n\n通过这种方式，我们可以实现非常流畅的动画。如需更详细的讨论，请查看\
    \ Mark Brown 写的这篇[文章](https://www.sitepoint.com/quick-tip-game-loop-in-javascript/)。\n\
    \n### 编写你自己的辅助方法\n\n诚然，总是通过遍历元素来对它们进行操作，与 jQuery 简洁且可链的 `$('.foo').css({color:\
    \ 'red'})` 语法相比可能相当繁琐。那么，为什么不简单为此类事情编写我们自己的简写方法呢？\n\n```javascript\nconst $ =\
    \ function $ (selector, context = document) {\n  const elements = Array.from(context.querySelectorAll(selector))\n\
    \  return {\n    elements,\n    html(newHtml) {\n      this.elements.forEach(element\
    \ => {\n        element.innerHTML = newHtml\n      })\n      return this\n   \
    \ },\n    css(newCss) {\n      this.elements.forEach(element => {\n        Object.assign(element.style,\
    \ newCss)\n      })\n      return this\n    },\n    on(event, handler, options)\
    \ {\n      this.elements.forEach(element => {\n        element.addEventListener(event,\
    \ handler, options)\n      })\n      return this\n    }\n  }\n}\n```\n\n因此，我们有了一个极简的\
    \ DOM 库，只包含我们需要的方法，并且不考虑向后兼容性。通常我们会在原型中拥有这些方法。这里有一个（稍微复杂一点的）[gist](https://gist.github.com/SitePoint/4f664d62a87ae60b0784ceeffd)，其中包含关于如何实现此类辅助方法的想法。或者，我们可以保持简单如：\n\
    \n```javascript\nconst $ = (selector, context = document) => context.querySelector(selector)\n\
    const $$ = (selector, context = document) => context.querySelectorAll(selector)\n\
    const html = (nodeList, newHtml) => {\n  Array.from(nodeList).forEach(element\
    \ => {\n    element.innerHTML = newHtml\n  })\n}\n// 等等...\n```\n\n### Demo\n\n\
    为了结束这篇文章，这里有一个 [CodePen](https://codpen.io/SitePoint/aJaggB/)，展示了上述许多概念，用于实现一个简单的灯箱效果。\n\
    \n### 结论\n\n我希望向大家展示原生 JavaScript 进行 DOM 操作并不是困难科学，而且事实上，对于某些用例（如导航菜单或弹出窗口），引入一个库的额外开销可能是多余的。\n\
    \n虽然原生 API 的部分非常繁琐或不方便（例如经常遍历节点列表），但我们可以轻松地编写自己的辅助函数。\n\n# 第四章：Webpack 入门指南\n\n\
    作者 Mark Brown\n\n[Webpack](https://webpack.org/) 已成为现代 Web 开发中最重要的工具之一。它主要是一个\
    \ JavaScript 模块打包器，但它可以转换所有的前端资源，如 HTML 和 CSS，甚至图片。它可以更好地控制应用的 HTTP 请求数量，并允许使用\
    \ npm 包。\n\n这篇文章面向 webpack 新手，将涵盖初始设置配置、模块、加载器、插件、代码分割和热更新。如果你觉得视频教程有用，强烈推荐 Glen\
    \ Maddern 的 [从原理理解 Webpack](https://www.youtube.com/watch?v=WQue1AN9YU) 作为理解其特殊之处的起点。\n\
    \n要在家里跟着练习，你需要安装 [Node.js](https://www.sitepoint.com/quick-tip-multiple-versions-node-nvm/)。你也可以从我们的\
    \ Github 仓库[下载 demo 应用](https://github.com/sitepoint-editors/webpack-demo)。\n\n\
    ### Setup\n\n让我们用 npm 初始化新项目并安装 webpack：\n\n```\nmkdir webpack-demo\ncd webpack-demo\n\
