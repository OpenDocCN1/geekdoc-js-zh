    Progressive Web Apps are Progressive Enhancements


    Your app will still run in browsers which don''t support PWA technology. The user
    won''t get the benefits of offline functionality but everything will continue
    to work as before. Given the cost-to-benefit rewards, there''s little reason not
    to add PWA technologies to your system.


    It''s Not Just Apps


    Google has led the [PWA movement](https://developers.google.com/web/progressive-web-apps/)
    so most tutorials describe how to build a Chrome-based native-looking mobile app
    from the ground-up. However, you don''t need a special singlepage app or have
    to follow material interface design guidelines. Most websites can be PWA-ized
    within a few hours. That includes your WordPress or static site. [Smashing Magazine](https://www.smashingmagazine.com/)
    announced they were [running as a PWA](https://twitter.com/smashingmag/status/839379533874806784)
    while this article was being written!


    Demonstration Code


    Demonstration code is available from [https://github.com/sitepoint-editors/pwa-retrofit](https://github.com/sitepoint-editors/pwa-retrofit)


    It provides a simple four-page website with a few images, one stylesheet and a
    single main JavaScript file. The site works in all modern browsers (IE10+). If
    the browser supports PWA technologies the user can read previously-viewed pages
    when they''re offline.


    To run the code, ensure [Node.js](https://nodejs.org/) is installed then start
    the provided web server in your terminal with:


    `node ./server.js [port]`


    where `[port]` is optional and defaults to 8888\. Open Chrome or another Blink-based
    browser such as Opera or Vivaldi then navigate to [http://localhost:8888/](http://localhost:8888/)
    (or whichever port you specified). You can also open the Developer Tools (F12
    or Cmd/Ctrl + Shift + I) to view various console messages.


    ![](images/00004.jpg)


    View the home page, and perhaps one other, then go offline by either:


    1.  Stopping the web server with Cmd/Ctrl + C, or


    2.  Check the Offline checkbox in the Network or Application - Service Workers
    tab of the Developer Tools.


    Revisit any of the pages you viewed earlier and they will still load. Visit a
    page you''ve not seen to be presented with a "you''re offline" page containing
    a list of viewable pages:


    ![](images/00019.jpg)


    Connect a Device


    You can also view the demonstration page on an Android smartphone connected to
    your PC/Mac via USB. Open the Remote devices panel from More tools in the top-left
    three-dot menu.


    ![](images/00007.jpg)


    Select Settings on the left and click Add Rule to forward port 8888 to localhost:8888\.
    You can now open Chrome on the smartphone and navigate to [http://localhost:8888/](http://localhost:8888/).


    You can use the browser menu to "Add to Home screen". Make a couple of visits
    and the browser should prompt you to "install". Both options create a new icon
    on your home screen. Browse a few pages then close Chrome and disconnect your
    device. You can then launch the PWA Website app - you''ll see a splash screen
    and be able to view pages you read previously despite having no connection to
    the server.


    There are three essential steps to transform your website into a Progressive Web
    App...


    Step 1: Enable HTTPS


    PWAs require an HTTPS connection for reasons which will become apparent shortly.
    Prices and processes will differ across hosts but it''s worth the cost and effort,
    given that Google search is ranking secure sites higher.


    HTTPS is not necessary for the demonstration above because Chrome permits the
    use of localhost or any 127.x.x.x address for testing. You can also test PWA technology
    on HTTP sites if you launch Chrome with the following command line flags:


    *   `--user-data-dir`


    *   `--unsafety-treat-insecure-origin-as-secure`


    Step 2: Create a Web App Manifest


    The web app manifest provides information about the application such as the name,
    description, and images which are used by the OS to configure home screen icons,
    splash pages and the viewport. In essence, the manifest is a single file alternative
    to the numerous vendor-specific icon and theme meta tags you may already have
    in your pages.


    The manifest is a JSON text file in the root of your app. It must be served with
    a `Content-Type: application/manifest+json` or `Content-Type: application/json`
    HTTP header. The file can be called anything but has been named `/manifest.json`
    in the demonstration code:


    `{`


    `  "name"              : "PWA Website",`


    `  "short_name"        : "PWA",`


    `  "description"       : "An example PWA website",`


    `  "start_url"         : "/",`


    `  "display"           : "standalone",`


    `  "orientation"       : "any",`


    `  "background_color"  : "#ACE",`


    `  "theme_color"       : "#ACE",`


    `  "icons": [`


    `    {`


    `      "src"           : "/images/logo/logo072.png",`


    `      "sizes"         : "72x72",`


    `      "type"          : "image/png"`


    `    },`


