    \n# 第 3 章：原生 JavaScript DOM 操作基础（不使用 jQuery）\n\n作者：Sebastian Seitz\n\n由 [Vildan\
    \ Softic](https://www.sitepoint.com/author/vildansoftic/) 和 [Joan Yin](https://github.com/newjs)\
    \ 同行评审。\n\n每我们需要执行 DOM 操作时，大家都会迅速求助于 jQuery。然而，原生 JavaScript DOM API 本身其实非常强大，而且由于\
    \ IE < 11 已经被[官方放弃](https://www.microsoft.com/en-us/WindowsForBusiness/End-of-IE-support)，现在可以无忧地使用。\n\
    \n在本文中，我将演示如何使用原生 JavaScript 完成一些常见的 DOM 操作任务，即：\n\n* 查询和修改 DOM\n* 修改类（classes）和属性\n\
    * 监听事件\n以及\n* 动画\n\n最后，我将向你展示如何创建一个自己的超轻量 DOM 库，并将其投入到任何项目中。过程中，你会发现使用原生 JS 进行\
    \ DOM 操作并不是什么高深科技，而且许多 jQuery 方法在原生 API 中实际上有直接对应方法。\n\n那么，让我们开始吧……\n\n## DOM\
    \ 操作：查询 DOM\n\n### 这并不是关于 DOM API 的详尽指南\n\n我不会详尽解释原生 DOM API，而仅触及皮毛。在用法示例中，你可能会遇到我没有明确介绍的方法。在这种情况下，请直接参考优秀的\
    \ [Mozilla 开发者网络 (MDN)](https://developer.mozilla.org/en-US/) 获取详细信息。\n\n可以使用\
    \ `.querySelector()` 方法查询 DOM，该方法接受任意 CSS 选择器作为参数：\n\n```\nconst myElement = document.querySelector('#foo\
    \ > div.bar')\n```\n\n这将返回第一个匹配项（深度优先）。相反，我们可以检查一个元素是否匹配某个选择器：\n\n```\nmyElement.matches('div.bar')\
    \ === true\n```\n\n如果等想获取所有匹配项，可以使用：\n\n```\nconst myElements = document.querySelectorAll('div.bar')\n\
    ```\n\n如果已经已经有一个元素的引用，我们可以直接查询它的子元素。\n\n```\nconst myElements = document.querySelector('div.bar')\n\
    ```\n\n### getElementsByTagName\n\n那么为什么还要用 `getElementsByTagName()` 等其他方法？嗯，一个重要的区别是\
    \ `querySelectorAll()` 的结果是动态的（live）。\n\n```javascript\nconst elements1 = document.querySelectorAll('div')\n\
    const elements2 = document.getElementsByTagName('div')\nconst newElement = document.createElement('div')\n\
    ```\n\n另一个考虑是，当我们动态添加元素时，`querySelectorAll` 是静态的。\n\n```javascript\nelements1.appendChild(newElement)\n\
    ```\n\n### 使用 NodeLists\n\n现在关于 `querySelectorAll()` 有两个坑。第一个坑是我们无法在结果上调用数组方法（就像你从\
    \ jQuery 中习惯的那样）。相反，我们必须显式遍历元素。另一个坑是：返回值是一个 `NodeList` 而不是 `Array`。这意味着我们需要将列表转换为数组，或者“借用”数组原型的方法。\n\
    \n```\n// 使用 Array.from()\nArray.from(myElements).forEach(doSomethingElement)\n\
    \n// 在 ES6 之前\nArray.prototype.forEach.call(myElements, doSomethingElement)\n\n\
    // 简写：\n[].forEach.call(myElements, doSomethingElement)\n```\n\n每个元素还有几个自言自懂的只读属性指向“元素族”，所有的都是动态的：\n\
    \n```\nmyElement.children\nmyElement.firstElementChild\nlastElementChild\npreviousElementSibling\n\
    nextElementSibling\n```\n\n由于 [Element](https://developer.mozilla.org/en-US/docs/Web/API/element)\
    \ 接口继承自 [Node](https://developer.mozilla.org/en-US/docs/Web/API/Node) 接口，以下属性也可用：\n\
    \n```\nmyElement.childNodes\nmyElement.firstChild\nmyElement.lastChild\nmyElement.previousSibling\n\
    myElement.nextSibling\nmyElement.parentNode\nmyElement.parentElement\n```\n\n\
    前者只引用元素，而后者（`.parentElement` 除外）可以是任何种类型的节点，例如文本节点。然后我们可以检查给定节点的[类型](https://developer.mozilla.org/en-US/docs/Web/API/Node/nodeType)，例如：\n\
    \n```\nmyElement.firstChild.nodeType === 3 // 这是一个文本节点\n```\n\n和任何对象一样，我们可以使用\
    \ `instanceof` 运算符检查节点的原型链：\n\n```\nmyElement.firstChild.nodeType instanceof Text\n\
    ```\n\n## 修改类和属性\n\n修改元素的类非常简单：\n\n```\nmyElement.classList.add('foo')\nmyElement.classList.remove('bar')\n\
    myElement.classList.toggle('baz')\n```\n\n"
- fmt: "\nYou can read a more in-depth discussion of how to modify classes in this\
    \ [quick tip by Yaphi Berhanu](https://www.sitepoint.com/add-remove-css-class-vanilla-js/).\
    \ Element properties can be accessed like any other object's properties.\n\n```javascript\n\
    // Get an attribute value\nconst value = myElement.value\n\n// Set an attribute\
    \ as an element property\nmyElement.value = 'foo'\n\n// Set multiple properties\
    \ using Object.assign()\nObject.assign(myElement, {\n  value: 'foo',\n  id: 'bar'\n\
    })\n\n// Remove an attribute\nmyElement.value = null\n```\n\nNote that there are\
    \ also the methods `.getAttibute()`, `.setAttribute()` and `.removeAttribute()`.\
    \ These directly modify the HTML attributes (as opposed to the DOM properties)\
    \ of an element, thus causing a browser redraw (you can observe the changes by\
    \ inspecting the element with your browser's dev tools). Not only is such a browser\
    \ redraw more expensive than just setting DOM properties, but these methods also\
    \ can have [unexpected results](https://developer.mozilla.org/en-US/docs/Web/API/Element/setAttribute#Notes).\n\
    \nAs a rule of thumb, only use them for attributes that don't have a corresponding\
    \ DOM property (such as `colspan`), or if you really want to \"persist\" those\
    \ changes to the HTML (e.g. to keep them when cloning an element or modifying\
    \ its parent's `.innerHTML` — see [section 3](#index_split_004.html_filepos80226)).\n\
    \n## Adding CSS styles\n\nCSS rules can be applied like any other property; note\
    \ though that the properties are camel-cased in JavaScript:\n\n```javascript\n\
    myElement.style.marginLeft = '2em'\n```\n\nIf we want certain values, we can obtain\
    \ these via the `.style` property. However, this will only give us styles that\
    \ have been explicitly applied. To get the computed values, we can use `.window.getComputedStyle()`.\
    \ It takes the element and returns a [CSSStyleDeclaration](https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleDeclaration)\
    \ containing all styles from the element itself as well as those inherited from\
    \ its parents:\n\n```javascript\nwindow.getComputedStyle(myElement).getPropertyValue('margin-left')\n\
    ```\n\n## Modifying the DOM\n\nWe can move elements around like so:\n\n```javascript\n\
    // Append element1 as the last child of element2\nelement1.appendChild(element2)\n\
    \n// Insert element2 as child of element 1, right before element3\nelement1.insertBefore(element2,\
    \ element3)\n```\n\nIf we don't want to move the element, but insert a copy, we\
    \ can clone it like so:\n\n```javascript\n// Create a clone\nconst myElementClone\
    \ = myElement.cloneNode()\nmyParentElement.appendChild(myElementClone)\n```\n\n\
    The `.cloneNode()` method optionally takes a boolean as argument; if set to true,\
    \ a deep copy will be created, meaning its children are also cloned.\n\nOf course,\
    \ we can just as well create entirely new elements or text nodes:\n\n```javascript\n\
    const myNewElement = document.createElement('div')\nconst myNewTextNode = document.createTextNode('some\
    \ text')\n```\n\nwhich we can then insert as shown above. If we want to remove\
    \ an element, we can't do so directly, but we can remove children from a parent\
    \ element, like so:\n\n```javascript\nmyParentElement.removeChild(myElement)\n\
    ```\n\nThis gives us a nice little work around, meaning can actually remove an\
    \ element indirectly, by referencing its parent element:\n\n```javascript\nmyElement.parentNode.removeChild(myElement)\n\
    ```\n\n## Element properties\n\nEvery element also has the properties `.innerHTML`\
    \ and `.textContent` (as well as `.innerText`, which is similar to `.textContent`,\
    \ but has some [important differences](http://perfectionkills.com/the-poor-misunderstood-innerText/)).\
    \ These hold the HTML and plain text content respectively. They are writable properties,\
    \ meaning we can modify elements and their contents directly:\n\n```javascript\n\
    // Replace the inner HTML\nmyElement.innerHTML = `\n  <div>\n    <h2>New content</h2>\n\
    \    <p>beep boop beep boop</p>\n  </div>\n`\n\n// Remove all child nodes\nmyElement.innerHTML\
    \ = null\n\n// Append to the inner HTML\nmyElement.innerHTML += `\n  <a href=\"\
    foo.html\">continue reading...</a>\n  <hr/>\n`\n```\n\nAppending markup to the\
    \ HTML as shown above is usually a bad idea though, as we'd lose any previously\
    \ made property changes on the affected elements (unless we use [DocumentFragment](https://developer.mozilla.org/en-US/docs/Web/API/DocumentFragment)).\
    \ To avoid this performance issue, we can first assemble nodes in a fragment:\n\
    \n```javascript\nconst fragment = document.createDocumentFragment()\nfragment.appendChild(text)\n\
    myElement.appendChild(hr)\n```\n\n## Listening to events\n\nThis is possibly the\
    \ best known way to bind an event:\n\n```javascript\nmyElement.onclick = function\
    \ (event) {\n  console.log(event.type)\n}\n```\n\nBut this should generally be\
    \ avoided. Here, `.onclick` is a property of the element, meaning you can change\
    \ it, but you cannot use it to add listeners. Instead, we can use the muchier\
    \ `.addEventListener()` method to add as many events as we like. It takes three\
    \ arguments: the event type (such as `click`), a function that gets called whenever\
    \ the event occurs (this function gets passed an object), and an optional config\
    \ object.\n\n```javascript\nmyElement.addEventListener('click', function (event)\
    \ {\n  console.log(event.type)\n})\nmyElement.addEventListener('click', function\
    \ (event) {\n  console.log(event.type + ' again')\n})\n```\n\nWithin the listener\
    \ function, `event.target` refers to the element on which the event was triggered\
    \ (as does `this`, unless we're using an [arrow function](https://www.sitepoint.com/es6-arrow-functions-new-fat-syntax/)).\
    \ Thus you can easily access its properties like so:\n\n```javascript\n// The\
    \ forms property of the document is an array holding all forms\nconst myForm =\
    \ document.forms[0]\nconst myInputElements = myForm.querySelectorAll('input')\n\
    Array.from(myInputElements).forEach(el => {\n  el.addEventListener('change', function\
    \ (event) {\n    console.log(event.target.value)\n  })\n})\n```\n\n### Preventing\
    \ default actions\n\nNote that `event` is always available within the listener\
    \ function, but it is good practice to explicitly pass it in anyway when needed\
    \ (and we can name it as we like then, of course). Without elaborating on the\
    \ [Event](https://developer.mozilla.org/en-US/docs/Web/API/Event) interface itself,\
    \ one particularly noteworthy method is `.preventDefault()`, which will, well,\
    \ prevent the browser's default behavior, such as following a link. Another common\
    \ use-case would be to conditionally prevent the submission of a form if the client-side\
    \ form-validation fails.\n\n```javascript\nmyForm.addEventListener('submit', function\
    \ (event) {\n  const name = this.querySelector('#name')\n  if (name.value ===\
    \ 'Donald Duck') {\n    alert('You gotta be kidding!')\n    event.preventDefault()\n\
    \  }\n})\n```\n"
  raw: 'You can read a more in-depth disussion of how to modify classes in this [quick
    tip by Yaphi Berhanu](https://www.sitepoint.com/add-remove-css-class-vanilla-js/).
    Element properties can be accessed like any other object''s properties


    `// Get an attribute value`


    `const value = myElement.value`


    `// Set an attribute as an element property`


    `myElement.value = ''foo''`


    `// Set multiple properties using Object.assign()`


    `Object.assign(myElement, {`


    `  value: ''foo'',`


    `  id: ''bar''`


    `})`


    `// Remove an attribute`


    `myElement.value = null`


    Note that there are also the methods `.getAttibute()`, `.setAttribute()` and .`removeAttribute()`.
    These directly modify the HTML attributes (as opposed to the DOM properties) of
    an element, thus causing a browser redraw (you can observe the changes by inspecting
    the element with your browser''s dev tools). Not only is such a browser redraw
    more expensive than just setting DOM properties, but these methods also can have
    [unexpected results](https://developer.mozilla.org/en-US/docs/Web/API/Element/setAttribute#Notes).


    As a rule of thumb, only use them for attributes that don''t have a corresponding
    DOM property (such as `colspan`), or if you really want to "persist" those changes
    to the HTML (e.g. to keep them when cloning an element or modifying its parent''s
    `.innerHTML` — see [section 3](#index_split_004.html_filepos80226)).


    Adding CSS styles


    CSS rules can be applied like any other property; note though that the properties
    are camel-cased in JavaScript:


    `myElement.style.marginLeft = ''2em''`


    If we want certain values, we can obtain these via the `.style` property. However,
    this will only give us styles that have been explicitly applied. To get the computed
    values, we can use, `.window.getComputedStyle()`. It takes the element and returns
    a [CSSStyleDeclaration](https://developer.mozilla.org/en-US/docs/Web/API/CSSStyleDeclaration)
    containing all styles from the element itself as well as those inherited from
    its parents:


    `window.getComputedStyle(myElement).getPropertyValue(''margin-left'')`


    Modifying the DOM


    We can move elements around like so:


    `// Append element1 as the last child of element2`


    `element1.appendChild(element2)`


    `// Insert element2 as child of element 1, right before element3`


    `element1.insertBefore(element2, element3)`


    If we don''t want to move the element, but insert a copy, we can clone it like
    so:


    `// Create a clone`


    `const myElementClone = myElement.cloneNode()`


    `myParentElement.appendChild(myElementClone)`


    The `.cloneNode()` method optionally takes a boolean as argument; if set to true,
    a deep copy will be created, meaning its children are also cloned.


    Of course, we can just as well create entirely new elements or text nodes:


    `const myNewElement = document.createElement(''div'')`


    `const myNewTextNode = document.createTextNode(''some text'')`


    which we can then insert as shown above. If we want to remove an element, we can''t
    do so directly, but we can remove children from a parent element, like so:


    `myParentElement.removeChild(myElement)`


    This gives us a nice little work around, meaning can actually remove an element
    indirectly, by referencing its parent element:


    `myElement.parentNode.removeChild(myElement)`


    Element properties


    Every element also has the properties `.innerHTML` and `.textContent` (as well
    as `.innerText`, which is similar to `.textContent`, but has some [important differences](http://perfectionkills.com/the-poor-misunderstood-innerText/)).
    These hold the HTML and plain text content respectively. They are writable properties,
    meaning we can modify elements and their contents directly:


    `// Replace the inner HTML`


    `` myElement.innerHTML = ` ``


    `  <div>`


    `    <h2>New content</h2>`


    `    <p>beep boop beep boop</p>`


    `  </div>`


    `` ` ``


    `// Remove all child nodes`


    `myElement.innerHTML = null`


    `// Append to the inner HTML`


    `` myElement.innerHTML += ` ``


    `  <a href="foo.html">continue reading...</a>`


    `  <hr/>`


    `` ` ``


    Appending markup to the HTML as shown above is usually a bad idea though, as we''d
    lose any previously made property changes on the affected elements (unless we
    persisted those changes as HTML attributes as shown in [section 2](#index_split_004.html_filepos77239))
    and bound event listeners. Setting the `.innerHTML` is good for completely throwing
    away markup and replacing it with something else, e.g. server-rendered markup.
    So appending elements would better be done like so:


    `const link = document.createElement(''a'')`


    `const text = document.createTextNode(''continue reading...'')`


    `const hr = document.createElement(''hr'')`


    `link.href = ''foo.html''`


    `link.appendChild(text)`


    `myElement.appendChild(link)`


    `myElement.appendChild(hr)`


    With this approach however we''d cause two browser redraws — one for each appended
    element — whereas changing the `.innerHTML` only causes one. As a way around this
    performance issue we can first assemble all nodes in a [DocumentFragment](https://developer.mozilla.org/en-US/docs/Web/API/DocumentFragment),
    and then just append that single fragment:


    `const fragment = document.createDocumentFragment()`


    `fragment.appendChild(text)`


    `fragment.appendChild(hr)`


    `myElement.appendChild(fragment)`


    Listening to events


    This is possibly the best known way to bind an event listener:


    `myElement.onclick = function onclick (event) {`


    `  console.log(event.type + '' got fired'')`


    `}`


    But this should generally be avoided. Here, `.onclick` is a property of the element,
    meaning that you can change it, but you cannot use it to add additional listeners
    — by reassigning a new function you''ll overwrite the reference to the old one.


    Instead, we can use the much mightier `.addEventListener()` method to add as many
    events of as many types as we like. It takes three arguments: the event type (such
    as `click`), a function that gets called whenever the event occurs on the element
    (this function gets passed an event object), and an optional config object which
    will be explained further below.


    `myElement.addEventListener(''click'', function (event) {`


    `  console.log(event.type + '' got fired'')`


    `})`


    `myElement.addEventListener(''click'', function (event) {`


    `  console.log(event.type + '' got fired again'')`


    `})`


    Within the listener function, `event.target` refers to the element on which the
    event was triggered (as does `this`, unless of course we''re using an [arrow function](https://www.sitepoint.com/es6-arrow-functions-new-fat-concise-syntax-javascript/)).
    Thus you can easily access its properties like so:


    ``// The `forms` property of the document is an array holding``


    `// references to all forms`


    `const myForm = document.forms[0]`


    `const myInputElements = myForm.querySelectorAll(''input'')`


    `Array.from(myInputElements).forEach(el => {`


    `  el.addEventListener(''change'', function (event) {`


    `    console.log(event.target.value)`


    `  })`


    `})`


    Preventing default actions


    Note that `event` is always available within the listener function, but it is
    good practive to explitly pass it in anyway when needed (and we can name it as
    we like then, of course). Without elaborating on the [Event](https://developer.mozilla.org/en-US/docs/Web/API/Event)
    interface itself, one particularly noteworthy method is `.preventDefault()`, which
    will, well, prevent the browser''s default behavior, such as following a link.
    Another common use-case would be to conditionally prevent the submission of a
    form if the client-side form-validation fails.


    `myForm.addEventListener(''submit'', function (event) {`


    `  const name = this.querySelector(''#name'')`


    `  if (name.value === ''Donald Duck'') {`


    `    alert(''You gotta be kidding!'')`


    `    event.preventDefault()`


    `  }`


    `})`'
