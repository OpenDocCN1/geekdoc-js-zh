    *   `images` — the original uncompressed images


    *   `js` — multiple preprocessed script files


    *   `scss` — multiple preprocessed Sass `.scss` files


    `build`


    folder: compiled/processed files


    Gulp will create files and create sub-folders as necessary:


    *   `html` - compiled static HTML files


    *   `images` — compressed images


    *   `js` — a single concatenated and minified JavaScript file


    *   `css` — a single compiled and minified CSS file


    Your project will almost certainly be different but this structure is used for
    the examples below.


    Tip: If you''re on a Unix-based system and you just want to follow along with
    the tutorial, you can recreate the folder structure with the following command:


    `mkdir -p src/{html,images,js,scss} build/{html,images,js,css}`


    Step 4: Install Gulp Locally


    You can now install Gulp in your project folder using the command:


    `npm install gulp --save-dev`


    This installs Gulp as a development dependency and the `"devDependencies"` section
    of `package.json` is updated accordingly. We will presume Gulp and all plugins
    are development dependencies for the remainder of this tutorial.


    Alternative Deployment Options


    Development dependencies are not installed when the `NODE_ENV` environment variable
    is set to `production` on your operating system. You would normally do this on
    your live server with the Mac/Linux command:


    `export NODE_ENV=production`


    Or on Windows:


    `set NODE_ENV=production`


    This tutorial presumes your assets will be compiled to the `build` folder and
    committed to your Git repository or uploaded directly to the server. However,
    it may be preferable to build assets on the live server if you want to change
    the way they are created, e.g. HTML, CSS and JavaScript files are minified on
    production but not development environments. In that case, use the `--save` option
    for Gulp and all plugins, i.e.


    `npm install gulp --save`


    This sets Gulp as an application dependency in the `"dependencies"` section of
    `package.json`. It will be installed when you enter `npm install` and can be run
    wherever the project is deployed. You can remove the `build` folder from your
    repository since the files can be created on any platform when required.


    Step 4: Create a Gulp Configuration File


    Create a new `gulpfile.js` configuration file in the root of your project folder.
    Add some basic code to get started:


    `// Gulp.js configuration`


    `var`


    `  // modules`


    `  gulp = require(''gulp''),`


    `  // development mode?`


    `  devBuild = (process.env.NODE_ENV !== ''production''),`


    `  // folders`


    `  folder = {`


    `    src: ''src/'',`


    `    build: ''build/''`


    `  }`


    `;`


    This references the Gulp module, sets a `devBuild` variable to `true` when running
    in development (or non-production mode) and defines the source and build folder
    locations.


    ES6 note: ES5-compatible JavaScript code is provided in this tutorial. This will
    work for all versions of Gulp and Node.js with or without the `--harmony` flag.
    [Most ES6 features are supported in Node 6 and above](http://node.green/) so feel
    free to use arrow functions, `let`, `const`, etc. if you''re using a recent version.


    `gulpfile.js` won''t do anything yet because you need to...


    Step 5: Create Gulp Tasks


    On it''s own, Gulp does nothing. You must:


    1.  install Gulp plugins, and


    2.  write tasks which utilize those plugins to do something useful.


    It''s possible to write your own plugins but, since almost 3,000 are available,
    it''s unlikely you''ll ever need to. You can search using Gulp''s own directory
    at [gulpjs.com/plugins/](http://gulpjs.com/plugins/), on [npmjs.com](https://www.npmjs.com/),
    or search "gulp something" to harness the mighty power of Google.


    Gulp provides three primary task methods:


    *   `gulp.task` - defines a new task with a name, optional array of dependencies
    and a function.


    *   `gulp.src` - sets the folder where source files are located.


    *   `gulp.dest` - sets the destination folder where build files will be placed.


    Any number of plug-in calls are set with `pipe` between the `.src` and `.dest`.


    Image Task


    This is best demonstrated with an example so let''s create a basic task which
    compresses images and copies them to the appropriate `build` folder. Since this
    process could take time, we''ll only compress new and modified files. Two plugins
    can help us: [gulp-newer](https://www.npmjs.com/package/gulp-newer) and [gulp-imagemin](https://www.npmjs.com/package/gulp-imagemin).
    Install them from the commandline:


    `npm install gulp-newer gulp-imagemin --save-dev`


    We can now reference both modules the top of `gulpfile.js`:


    `// Gulp.js configuration`


    `var`


    `  // modules`


    `  gulp = require(''gulp''),`


    `  newer = require(''gulp-newer''),`


    `  imagemin = require(''gulp-imagemin''),`


    We can now define the image processing task itself as a function at the end of
    `gulpfile.js`:


    `// image processing`


    `gulp.task(''images'', function() {`


    `  var out = folder.build + ''images/'';`


    `  return gulp.src(folder.src + ''images/**/*'')`


    `    .pipe(newer(out))`


    `    .pipe(imagemin({ optimizationLevel: 5 }))`


    `    .pipe(gulp.dest(out));`


    `});`


    All tasks are syntactically similar. This code:


    1.  Creates a new task named `images`.


    2.  Defines a function with a return value which...


    3.  Defines an `out` folder where build files will be located.


    4.  Sets the Gulp `src` source folder. The `/**/*` ensures that images in sub-folders
    are also processed.


    5.  Pipes all files to the `gulp-newer` module. Source files that are newer than
    corresponding destination files are passed through. Everything else is removed.


    6.  The remaining new or changed files are piped through `gulp-imagemin` which
    sets an optional `optimizationLevel` argument.


    7.  The compressed images are output to the Gulp `dest` folder set by `out`.


    Save `gulpfile.js` and place a few images in your project''s `src/images` folder
    before running the task from the command line:


    `gulp images`


    All images are compressed accordingly and you will see output such as:


    `Using file gulpfile.js`


    `Running ''imagemin''...`'
