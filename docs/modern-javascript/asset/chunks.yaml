  trans: '

    我们在开发现代 Web 应用时编写的代码，几乎从没有直接进入过生产环境。我们使用现代版本的 JavaScript 编写代码，这些代码可能不受浏览器支持；我们大量使用位于
    `node_modules` 文件夹中的第三方包及其依赖项；我们可能还有如静态分析工具或压缩化工具等流程。构建工具（Build tooling）的存在是为了帮助将所有这些转换为可以高效部署并被大多数
    浏览器理解的内容。


    ## 模块打包 (Module bundling)


    在使用 ES2015/CommonJS 模块编写整洁、复用的代码时，我们需要某种方法来加载这些模块（至少在浏览器原生支持 ES2015 模块加载之前是）。在
    HTML 中引入大量的 `<script>` 标签并不是一个可行的方案，因为对于任何严肃的应用来说，这都会迅速变得难以管理，而且所有这些独立的 HTTP 请求会损害性能。


    我们可以使用 ES2015 的 `import` 语句（或 CommonJS 的 `require`）在需要的地方引入所有模块，并使用模块打包器（module
    bundler）将所有内容合并成一个或多个文件（包，bundles）。我们将上传到服务器并包含在 HTML 中的，正是这些打包后的文件。它将包含你导入的所有模块及其必要的依赖项。


    目前有几种流行的选择，最流行的是 [Webpack](http://webpack.js.org)、[Browserify](http://browserify.org)
    和 [Rollup.js](http://rollupjs.org)。你可以根据自己的需求选择其中一种。


    ### 学习更多关于模块打包


    如果你想了解更多关于模块打包以及它如何融入应用开发大局，我推荐阅读 [理解 JavaScript 模块：打包与转译](https://www.sitepoint.com/javascript-modules-bundling-transpiling/)。


    ## 转译 (Transpilation)


    虽然[现代浏览器对 ES2015 的支持已经非常好](http://kangax.github.io/compat-table/es6/)，但你的目标用户可能包含部分支持或完全不支持的旧版浏览器和设备。


    为了让我们的现代 JavaScript 能够运行，我们需要将编写的代码翻译为早期版本（通常是 ES5）的等效代码。这项任务的标准工具是 [Babel](https://babeljs.io)，它是一个将你的代码翻译为大多数浏览器兼容代码的编译器。通过这种方式，你不需要等待厂商实现所有功能，可以直接使用所有现代
    JS 特性。


    有些功能需要的不仅仅是语法翻译；Babel 包含了一个 [Polyfill](http://babeljs.io/docs/usage/polyfill/)，它模拟了某些复杂功能（如
    promises）所需的某些机制。


    ## 构建系统与任务运行器 (Build systems & task runners)


    模块打包和转译只是我们在项目中可能需要的两个构建过程。其他过程还包括代码压缩（以减小文件大小）、分析工具，以及可能与 JavaScript 无关的任务，例如图像优化或
    CSS/HTML 预处理。


    任务管理可能会变成一项繁杂的工作，我们需要一种自动化方式来处理它，能够通过更简单的命令执行所有操作。用于此任务的最流行的两个工具是 [Grunt.js](http://gruntjs.com)
    和 [Gulp.js](http://gulpjs.com)，它们提供了一种按顺序将你的任务组织成组的方法。


    例如，你可以有一个像 `gulp build` 这样的命令，它可能会运行代码检查器、使用 Babel 进行转译过程以及使用 Browserify 进行模块打包。我们不需要按顺序记住三个命令及其相关的参数，只需要执行一个命令就能自动处理整个过程。


    每当你发现自己在手动为项目组织处理步骤时，请思考一下是否可以使用任务运行器实现自动化。


    ## 应用架构 (Application Architecture)


    Web 应用的要求与网站有所不同。例如，虽然对于博客来说，页面刷新是可以接受的，但对于像 Google Docs 这样的应用则完全不是。你的应用行为应该尽可能接近桌面应用，否则可用性将受到影响。


    旧式的 Web 应用通常是通过从 Web 服务器发送多个页面来实现的，当需要大量动态性时，通过 Ajax 根据用户操作替换 HTML 块来加载内容。虽然这是向更动态的
    Web 迈出的一一步，但它确实有其复杂性；在每次用户操作时发送 HTML 片段甚至整个页面都是资源的浪费，特别是从用户的角度来看更是时间的浪费。其可用性仍然无法匹配桌面应用的响应速度。


    为了改进这一点，我们创建了两种构建 Web 应用的新方法，从向用户展示应用的方式到客户端与服务器通信的方式。尽管应用所需的 JavaScript 数量也急剧增加，但结果是现在的应用行为非常接近原生应用；每次点击按钮时都不需要刷新页面或长时间的等待。


    ### 单页应用 (SPAs)


    Web 应用最常见的高层架构被称为 [SPA](https://en.wikipedia.org/wiki/Single-page_application)，意为单页应用。SPA
    是巨大的 JavaScript 集合，包含了应用正常运行所需的所有内容。UI 完全在客户端渲染，因此不需要重新加载。唯一变化的是应用内部的数据，这通常通过远程
    API 配合 [Ajax](https://en.wikipedia.org/wiki/Ajax_(programming)) 或另一种异步通信方法来处理。


    这种方法的一个缺点是应用首次加载耗时间较长。然而，一旦加载完成，视图（页面）之间的切换通常要快得多，因为在客户端和服务器之间传输的只是纯数据。


    ### 通用型 / 同构应用 (Universal / Isomorphic Applications)


    尽管 SPA 提供了极的用户体验，但根据你的需求，它们可能不是最佳解决方案。特别是当你需要更快的初始加载时间或搜索引擎的最优索引时。


    解决这些问题的一种较新方法被称为 [同构](http://isomorphic.net/javascript)（或通用型）JavaScript 应用。在这种架构中，大部分代码可以在服务器和客户端执行。你可以选择想要在服务器上渲染的内容以实现更快的初始加载，之后由客户端接管渲染。由于页面最初在服务器上渲染，搜索引擎可以对其进行正确的索引。


    ## 部署 (Deployment)


    在现代 JavaScript 应用中，你编写的代码与部署到生产环境的代码并不相同；你只部署构建过程的结果。完成此操作的工作流取决于项目的规模、参与开发的人数，有时取决于你使用的工具/库。


    例如，如果你独立开发一个简单的项目，每当准备好部署时，只需运行构建过程并将生成的文件上传到 Web 服务器即可。请记住，你只需要上传构建过程产生的文件（转译、模块打包、压缩等），这可以是一个包含整个应用及其依赖的单个
    .js 文件。


    你可以拥有如下目录结构：


    ```

    ├── dist

    │   ├── app.js

    │   └── index.html

    ├── node_modules

    ├── src

    │   ├── lib

    │   │   ├── login.js

    │   │   └── user.js

    │   ├── app.js

    │   └── index.html

    ├── gulpfile.js

    ├── package.json

    └── README

    ```


    所有的应用文件都在 `src` 目录下，使用 ES2015 编写，并导入通过 npm 安装的包以及来自 `lib` 目录的自定义模块。


    '
- fmt: '

    Then you can run Gulp, which will execute the instructions from a `gulpfile.js`
    to build your project: bundling all modules into one file (including the ones
    installed with `npm`), transpiling ES2015+ to ES5, minifying the resulted file,
    etc. Then you can configure it to output the result in a convenient `dist` directory.


    ## Files That Don''t Need Processing


    If you have files that don’t need any processing, you can just copy them from
    `src` to the `dist` directory. You can configure a task for that in your build
    system.


    Now you can just upload the files from the `dist` directory to a web server, without
    having to worry about the rest of the files, which are only useful for development.


    ## Team development


    If you are working with other developers, it is likely that you are also using
    a shared code repository, like GitHub, to store the project. In this case, you
    can run the building process right before making commits and store the result
    with the other files in the Git repository, to later be downloaded onto a production
    server.


    However, storing built files into the repository is prone to errors if several
    developers are working together and you might want to keep everything clean from
    build artifacts. Fortunately, there is a better way to deal with that problem:
    you can put a service like [Jenkins](http://jenkins.io), [Travis CI](http://travis-ci.org),
    [CircleCI](http://circleci.com), etc. in the middle of the process, so it can
    automatically build your project after each commit is pushed to the repository.
    Developers only have to worry about pushing code changes without building the
    project first each time, also the repository is kept clean of automatically generated
    files, and at the end, you still have the built files available for deployment.


    ## Conclusion


    The transition from simple web pages to modern JavaScript applications can seem
    daunting if you have been away from web development during recent years, but I
    hope this article was useful as a starting point. I''ve linked to more in-depth
    articles on each topic where possible, so you can explore further.


    And remember that if at some point, after looking all the options available, everything
    seems overwhelming and messy; just keep in mind the [KISS principle](https://en.wikipedia.org/wiki/KISS_principle),
    and use only what you think you need and not everything you have available. At
    the end of the day, solving problems is what matters, not using the latest of
    everything.


    # Chapter 2: An Introduction to Gulp.js


    by Craig Buckler


    Peer reviewed by [Giulio Mainardi](https://www.sitepoint.com/author/gmainardi/)
    and [Tim Severien](https://www.sitepoint.com/author/tseverien/).


    Developers spend precious little time coding. Even if we ignore irritating meetings,
    much of the job involves basic tasks which can sap your working day:


    * generating HTML from templates and content files

    * compressing new and modified images

    * compiling Sass to CSS code

    * removing `console` and `debugger` statements from scripts

    * transpiling ES6 to cross-browser-compatible ES5 code

    * code linting and validation

    * concatenating and minifying CSS and JavaScript files

    * deploying files to development, staging and production servers


    Tasks must be repeated every time you make a change. You may start with good intentions
    but the most infallible developer will forget to compress an image or two. Over
    time, pre-production tasks become increasingly arduous and time-consuming; you''ll
    dread the inevitable content and template changes. It''s mind-numbing, repetitive
    work. Would it be better to spend your time on more profitable jobs?


    If so, you need a task runner or build process.


    ## That Sounds Scarily Complicated!


    Creating a build process will take time. It''s more complex than performing each
    task manually but, over the long-term, you will save hours of effort, reduce human
    error and save your sanity. Adopt a pragmatic approach:


    * automate the most frustrating tasks first

    * try not to over-complicate your build process; an hour or two is more than enough
    for the initial set-up

    * choose task runner software and stick with it for a while. Don''t switch to
    another option on a whim.


    Some of the tools and concepts may be new to you but take a deep breath and concentrate
    on one thing at a time.


    ## Task Runners: the Options


    Build tools such as [GNU Make](https://www.gnu.org/software/make/) have been available
    for decades but web-specific task runners are a relatively new phenomenon. The
    first to achieve critical mass was [Grunt](http://gruntjs.com/) - a Node.js task
    runner which used plugins controlled (originally) by a JSON configuration file.
    Grunt was hugely successful but there were a number of issues:


    1. Grunt required plugins for basic functionality such as file watching.

    2. Grunt plugins often performed multiple tasks which made customisation more
    awkward.

    3. JSON configuration could become unwieldy for all but the most basic tasks.

    4. Tasks could run slowly because Grunt saved files between every processing step.


    Many issues were addressed in later editions but [Gulp](http://gulpjs.com/) had
    already arrived and offered a number of improvements:


    1. Features such as file watching were built-in.

    2. Gulp plugins were (mostly) designed to do a single job.

    3. Gulp used JavaScript configuration code which was less verbose, easier to read,
    simpler to modify, and provided better flexibility.

    4. Gulp was faster because it uses [Node.js streams](https://www.sitepoint.com/basics-node-js-streams/)
    to pass data through a series of piped plugins. Files were only written at the
    end of the task.


    Of course, Gulp itself isn''t perfect and new task runners such as [Broccoli.js](http://broccolijs.com/),
    [Brunch](http://brunch.io/) and [webpack](https://webpack.github.io/) have also
    been competing for developer attention. More recently, [npm itself has been touted
    as a simpler option](https://www.sitepoint.com/guide-to-npm-as-a-build-tool/).
    All have their pros and cons, but [Gulp remains the favorite and is currently
    used by more than 40% of web developers](https://ashleynolan.co.uk/blog/frontend-tooling-survey-2016-results#js-task-runners).


    Gulp requires Node.js but, while some JavaScript knowledge is beneficial, developers
    from all web programming faiths will find it useful.


    ## What About Gulp 4?


    This tutorial describes how to use Gulp 3 - the most recent release version at
    the time of writing. Gulp 4 has been in development for some time but remains
    a beta product. It''s possible to [use or switch to Gulp 4](https://www.joezimjs.com/javascript/complete-guide-upgrading-gulp-4/)
    but I recommend sticking with version 3 until the final release.


    ### Step 1: Install Node.js


    Node.js can be downloaded for Windows, Mac and Linux from [nodejs.org/download/](https://nodejs.org/download/).
    There are various options for installing from binaries, package managers and docker
    images - full instructions are available.


    ### Note for Windows Users


    Node.js and Gulp run on Windows but some plugins may not install or run if they
    depend on native Linux binaries as image compression libraries. One option for
    Windows 10 users is the new [bash commandline](https://msdn.microsoft.com/en-us/commandline/wsl/install_guide);
    this solves many issues but is a beta product and could introduce alternative
    problems.


    Once installed, open a command prompt and enter:


    ```

    node -v

    ```


    to reveal the version number. You''re about to make heavy use of `npm` - the Node.js
    package manager which is used to install modules. Examine its version number:


    ```

    npm -v

    ```

    '
