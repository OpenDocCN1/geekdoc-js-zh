    \ distributors will be held liable for any damages to be caused either directly\
    \ or indirectly by the instructions contained in this book, or by the software\
    \ or hardware products described herein.\n\n## Trademark Notice\nRather than indicating\
    \ every occurrence of a trademarked name as such, this book uses the names only\
    \ in an editorial fashion and to the benefit of the trademark owner with no intention\
    \ of infringement of the trademark.\n\n![](images/00015.jpg)\n\nPublished by SitePoint\
    \ Pty. Ltd.\n48 Cambridge Street Collingwood\nVIC Australia 3066\nWeb: www.sitepoint.com\n\
    Email: books@sitepoint.com\n\n## About SitePoint\nSitePoint specializes in publishing\
    \ fun, practical, and easy-to-understand content for web professionals. Visit\
    \ [http://www.sitepoint.com/](http://www.sitepoint.com/) to access our blogs,\
    \ books, newsletters, articles, and community forums. You’ll find a stack of information\
    \ on JavaScript, PHP, design, and more.\n\n## Preface\nIt's not uncommon these\
    \ days to see people complaining about just how complex JavaScript development\
    \ seems to have become. We can have some sympathy with that view when it's coming\
    \ from someone new to the language. If you're learning JS, it won't take long\
    \ for you to be exposed to the enormity of the ecosystem and the sheer number\
    \ of moving pieces you need to understand (at least conceptually) to build a modern\
    \ web application. Package management, linting, transpilation, module bundling,\
    \ minification, source maps, frameworks, unit testing, hot reloading... it can't\
    \ be denied that this is a lot more complex that just including a couple of script\
    \ tags in your page and FTPing it up to the server.\n\nFor a long time, JavaScript\
    \ was looked upon by many as a joke; a toy language whose only real use was to\
    \ add non-essential eye-candy, such as mouseover changes, and was often a source\
    \ of weird errors and broken pages. The language is still not taken seriously\
    \ by some today, despite having made much progress since those early days. It's\
    \ not hard to have some sympathy with PHP developers. For better or for worse,\
    \ JavaScript was (and still is) the only language supported natively by the vast\
    \ majority of web browsers. The community has worked hard to improve the language\
    \ itself, and to provide the tooling to help build production-grade apps.\n\n\
    This anthology is a collection of articles, hand-picked from SitePoint’s [JavaScript\
    \ channel](https://www.sitepoint.com/javascript/) with the aim of giving you a\
    \ head start on modern JavaScript development. Of course, with the fast pace of\
    \ change of both the language and the ecosystem, it’s important to keep up to\
    \ date with the latest developments. Don’t be left behind, head over to the channel\
    \ after you’ve finished this book to stay abreast of new trends and techniques!\n\
    \nJames Hibbard & Nilson Jacques, SitePoint JavaScript channel editors.\n\n##\
    \ Conventions Used\nYou’ll notice that we’ve used certain layout styles throughout\
    \ this book to signify different types of information. Look out for the following\
    \ items.\n\n### Code Samples\nCode in this book is displayed using a fixed-width\
    \ font, like so:\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk.</p>\n\
    ```\n\nSome lines of code should be entered on one line, but we've had to wrap\
    \ them because of page constraints. An ➥ indicates a line break that exists for\
    \ formatting purposes only, and should be ignored:\n\n```javascript\nURL.open(\"\
    http://www.sitepoint.com/responsive-web-design-real-user-testing/?responsive1\"\
    );\n```\n\n### Tips, Notes, and Warnings\n\n**Hey, You!**\nTips provide helpful\
    \ little pointers.\n\n**Ahem, Excuse Me ...**\nNotes are useful asides that are\
    \ related—but not critical—to the topic at hand. Think of them as extra tidbits\
    \ of information.\n\n**Make Sure You Always ...**\n... pay attention to these\
    \ important points.\n\n**Watch Out!**\nWarnings highlight any gotchas that are\
    \ likely to trip you up along the way.\n\n## Chapter 1: The Anatomy of a Modern\
    \ JavaScript Application\nby James Kolce\n\nThere's no doubt that the JavaScript\
    \ ecosystem changes fast. Not only are new tools and frameworks introduced and\
    \ developed at a rapid rate, the language itself has undergone big changes with\
    \ the introduction of ES2015 (aka `ES6`). Understandably, many articles have been\
    \ written complaining about how difficult it is to learn modern JavaScript development\
    \ these days.\n\nIn this article, I'll introduce you to modern JavaScript. We'll\
    \ take a look at the most recent developments in the language and get an overview\
    \ of the tools and techniques currently used to write frontend web applications.\
    \ If you're just starting out with learning the language, or you've not touched\
    \ it for a few years and are wondering what happened to the JavaScript you used\
    \ to know, this article is for you.\n\n### A Note about Node.js\n`Node.js` is\
    \ a runtime that allows server-side programs to be written in JavaScript. It is\
    \ possible to have full-stack JavaScript applications, where both the front and\
    \ backend are written in JavaScript. The arrival of `Node.js` had a significant\
    \ impact on the ecosystem, introducing the `npm` package manager and popularizing\
    \ the CommonJS module format.\n\n### JavaScript ES2015\nIn 2015, the sixth version\
    \ of [ECMAScript](https://en.wikipedia.org/wiki/ECMAScript)—the specification\
    \ that defines the JavaScript—was released under the name `ES6`. This new version\
    \ included substantial additions to the language. But improvements don’t stop\
    \ with ES2015; each year, a new version is released.\n\n### Declaring variables\n\
    JavaScript now has additional ways to declare variables: [let and const](https://www.sitepoint.com/how-to-declare-variables/).\n\
    \n`let` is the successor to `var` - although `var` is still available, `let` limits\
    \ the scope of variables to the block (rather than the function) they're within,\
    \ which reduces the room for error:\n\n```javascript\n// ES5\nfor (var i = 1;\
    \ i < 5; i++) {\n  console.log(i);\n}\n// <-- logs the numbers 1 to 4\nconsole.log(i);\
    \ // <-- 5 (variable i still exists outside the loop)\n\n// ES2015\nfor (let j\
    \ = 1; j < 5; j++) {\n  console.log(j);\n}\nconsole.log(j); // <-- 'Uncaught ReferenceError:\
    \ j is not defined'\n```\n\nUsing `const` allows you to define variables that\
    \ cannot be rebound to new values. For primitive values such as strings and numbers,\
    \ this results in something similar to a constant, as you cannot change the value\
    \ once it has been deared.\n\n```javascript\nconst name = 'Bill';\nname = 'Steve';\n\
    // <-- 'Uncaught TypeError: Assignment to constant variable.'\n```\n\n**Gotcha**\n\
    ```javascript\nconst person = { name: 'Bill' };\nperson.name = 'Steve';\n// person.name\
    \ is now Steve. \n// As we're not changing the object that person is bound to,\
    \ JavaScript doesn't complain.\n```\n\n## Arrow functions\n"
