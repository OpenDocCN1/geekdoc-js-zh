  trans: "\n\n我在 2012 年加入 Storify 时开始全职从事 Node 开发。从那时起，我从未回头过，也从未觉得想念 Python、Ruby、Java\
    \ 或 PHP —— 这些在我过去的十年 Web 开发中使用过的语言。\n\nStorify 对我来说是一份有趣的工作，因为与许多其他公司不同，Storify\
    \ 使用（可能现在仍在使用）JavaScript 运行一切。你会发现，大多数公司，尤其是像 PayPal、Walmart 或 Capital One 这样的大公司，只在技术栈的某些部分使用\
    \ Node。通常它们将其作为 API 网关或编排层。这很棒。但对于软件工程师来说，没有什么比完全沉浸在 Node 环境中更棒的。\n\n在这篇文章中，我将概述十条建议，帮助你在\
    \ 2017 年成为一名更优秀的 Node 开发者。这些建议来自我（我在实战中观察并学习了它们），也来自那些编写最流行的 Node 和 npm 模块的人。以下是我们将涵盖的内容：\n\
    \n1. **避免复杂** — 将你的代码组织成尽可能小的区块，直到它们看起来太小，然后再让它们变得更小。\n2. **使用异步代码** — 像避免瘟疫一样避免同步代码。\n\
    3. **避免阻塞 require** — 将所有的 `require` 语句放在文件顶部，因为它们是同步的并且会阻塞执行。\n4. **知道 require\
    \ 是缓存的** — 这可能是你代码中的一个特性，也可能是 Bug。\n5. **始终检查错误** — 错误不是足球。永远不要抛出错误，永远不要跳过错误检查。\n\
    6. **仅在同步代码中使用 try...catch** — `try...catch` 对异步代码是没用的，此外 V8 对 `try...catch` 中代码的优化也不如普通代码。\n\
    7. **返回回调或使用 if ... else** — 为了保险起见，返回一个回调以防止执行继续。\n8. **监听错误事件** — 几乎所有的 Node\
    \ 类/对象都扩展了事件发射（观察者模式）并发出 `error` 事件。务必监听它。\n9. **了解你的 npm** — 使用 `-S` 或 `-D` 安装模块，而不是\
    \ `--save` 或 `--save-dev`。\n10. **在 package.json 中使用精确版本**: npm 在你使用 `-S` 时会愚蠢地默认添加插入符号（^），因此请手动删除它们以锁定版本。永远不要在应用中信任语义版本（semver），但在开源模块中可以这样做。\n\
    11. **额外 — 使用不同的依赖项**。将项目仅在开发时需要的项放在 `devDependencies` 中，然后使用 `npm i --production`。非必需依赖项越多，漏洞风险就越大。\n\
    \n所以，让我们逐一分析每一个吧。准备好了吗？\n\n## 避免复杂\n\n看看由 npm 创建者 Isaac Z. Schlueter 编写的一些模块。例如，`use-strict`\
    \ 为模块强制执行 JavaScript 严格模式，它只有三行代码：\n\n```\nvar module = require('module')\nmodule.wrapper[0]\
    \ += '\"use strict';\nObject.freeze(module.wrap)\n```\n\n为什么要避免复杂？根据一个传说，一句起源于美国海军的名言是：KEEP\
    \ IT SIMPLE STUPID（保持简单，大笨蛋 —— 或者它应该是“保持简单，你大笨蛋”？）。这是有原因的。人类大脑在任何时候的工作记忆中都只能容纳五到七项内容。这是一个事实。\n\
    \n通过将你的代码模块化为更小的部分，你和其他开发者可以更好地理解和推理它。你也可以更好地测试它。考虑一下这个例子，\n\n```\napp.use(function(req,\
    \ res, next) {\n  if (req.session.admin === true) return next()\n  else return\
    \ next(new Error('Not authorized'))\n}, function(req, res, next) {\n  req.db =\
    \ db\n  next()\n})\n```\n\n或者这段代码：\n\n```\nconst auth = require('./middleware/auth.js')\n\
    const db = require('./middleware/db.js')(db)\napp.use(auth, db)\n```\n\n我确定你们大多数人会倾向于第二个例子，特别是当名称自言易懂时。当然，当你写代码时，你可能认为自己理解它是如何工作的。也许你甚至想通过在一行中链调用几个方法来展示你有多聪明。请不要，为你那个更笨的自己写代码。为你那个六个月没看过这段代码的自己写代码，或者疲惫或醉酒的自己写代码。如果你在精力巅峰时编写代码，那么你以后将很难理解它，更不用说那些甚至不熟悉算法细节的同事了。对于使用异步方式的\
    \ Node 来说，保持简单尤其如此。\n\n是的，发生过 left-pad 事件，但那只影响了依赖公共仓库的项目，而且替代品在 11 分钟内就发布了。小型化的优点远大于缺点。此外，npm\
    \ 更改了它的发布策略，任何严肃的项目都应该使用缓存策略或私有仓库（作为临时解决方案）。\n\n## 使用异步代码\n\n同步代码在 Node 中确实有一个（很小的）位置。它主要用于\
    \ CLI 命令或其他脚本。Node 开发者主要构建 Web 应用，因此他们使用异步。例如，如果我们只是在构建一个系统，这可能是可以：\n\n```\nlet\
    \ data = fs.readFileSync('./conts.json')\ndb.collection('accounts').insert(data,\
    \ results)=>{process.exit(1)})\n```\n\n但在构建应用时，这样会更好：\n\n```\napp.use('seed',\
    \ (req, res) => {\n  let data = fs.readFile(`${req.name}.json`, results)=>{\n\
    \    res.status(201).send()\n  })\n})\n```\n\n区别在于你编写的是并发（通常是长时间运行）系统还是非并发（短运行）系统。作为经验之谈，在\
    \ Node 中始终编写异步代码。\n\n## 避免阻塞 require\n\nNode 有一个简单的模块加载系统，使用 CommonJS 模块格式。它内置的\
    \ `require` 函数是包含存在于单独文件模块的简单方法。与 AMD/requirejs 不同，Node/CommonJS 的模块加载方式是同步的。`require`\
    \ 的工作原理：你导入模块或文件中导出的内容。\n\n```\nconst react = require('react')\n```\n\n大多数开发者不知道的是\
    \ `require` 是被缓存的。所以，只要解析出的文件名没有发生剧烈变化（在 npm 模块的情况下会有），那么模块中的代码将只执行并加载到变量中一次（针对该进程）。这是一个很好的优化。然而，即使有缓存，你最好也将\
    \ `require` 语句放在前面。考虑这段代码，它只在实际使用它的路由上加载 `axios` 模块。`/connect` 路由将会比需要的慢，因为模块导入是在请求发生时发生的：\n\
    \n```\napp.post('/connect', (req, res) => {\n  const axios = require('axios')\n\
    \  axios.post('apiauthorize', req.body.auth)\n    .then((response)=>res.send(response))\n\
    })\n```\n\n一种更好、性能更高的方法是在服务器定义之前加载模块，而不是在路由中：\n\n```\nconst axios = require('axios')\n\
    const express = require('express')\napp = express()\napp.post('/connect', (req,\
    \ res) => {\n  axios.post('apiauthorize', req.body.auth)\n    .then((response)=>res.send(response))\n\
    })\n```\n\n"
- fmt: "\nI mentioned that `require` is cached in the previous section, but what's\
    \ interesting is that we can have code outside of the `module.exports`. For example,\n\
    \n```javascript\nconsole.log('I will not be cached and only run once, the first\
    \ time')\nmodule.exports = () => {\n  console.log('I will be cached and will run\
    \ every time this module is invoked')\n}\n```\n\nKnowing that some code might\
    \ run only once, you can use this feature to your advantage.\n\n## Always Check\
    \ for Errors\n\nNode is not Java. In Java, you throw errors because most of the\
    \ time if there's an error you don't want the application to continue. In Java,\
    \ you can handle multiple errors at a higher levels with a single `try...catch`.\n\
    \nNot so with Node. Since Node uses the [event loop](https://www.youtube.com/watch?v=8aGhZQkoFbQ)\
    \ and executes asynchronously, any errors are separated from the context of any\
    \ error handler (such as `try...catch`) when they occur. This is useless in Node:\n\
    \n```javascript\ntry {\n  request.get('/accounts', (error, response)=>{\n    data\
    \ = JSON.parse(response)\n  })\n} catch(error) {\n  // Will NOT be called\n  console.error(error)\n\
    }\n```\n\nBut `try...catch` still can be used in synchronous Node code. So this\
    \ is a better refactoring of the previous snippet:\n\n```javascript\nrequest.get('/accounts',\
    \ (error, response)=>{\n  try {\n    data = JSON.parse(response)\n  } catch(error)\
    \ {\n    // Will be called\n    console.error(error)\n  }\n})\n```\n\nIf we cannot\
    \ wrap the `request` call in a `try...catch` block, that leaves us with errors\
    \ coming from request unhandled. Node developers solve this by providing you with\
    \ `error` as a callback argument. Thus, you need to always manually handle the\
    \ `error` in each and every callback. You do so by checking for an error (make\
    \ sure it's not `null`) and then either displaying the error message to the user\
    \ or a client and logging it, or passing it back up the call stack by calling\
    \ the callback with `error` (if you have the callback and another function up\
    \ the call stack).\n\n```javascript\nrequest.get('/accounts', (error, response)=>{\n\
    \  if (error) return console.error(error)\n  try {\n    data = JSON.parse(response)\n\
    \  } catch(error) {\n    console.error(error)\n  }\n})\n```\n\nA little trick\
    \ you can use is the [okay](https://www.npmjs.com/package/okay) library. You can\
    \ apply it like this to avoid manual error check on myriads of nested callbacks\
    \ (Hello, [callback hell](https://www.sitepoint.com/saved-from-callback-hell/)).\n\
    \n```javascript\nvar ok = require('okay')\nrequest.get('/accounts', ok(console.error,\
    \ (response)=>{\n  try {\n    data = JSON.parse(response)\n  } catch(error) {\n\
    \    console.error(error)\n  }\n}))\n```\n\n## Return Callbacks or Use if ...\
    \ else\n\nNode is concurrent. So it's a feature which can turn into a bug if you\
    \ are not careful. To be on the safe side terminate the execution with a return\
    \ statement:\n\n```javascript\nlet error = true\nif (error) return callback(error)\n\
    console.log('I will never run - good.')\n```\n\nAvoid some unintended concurrency\
    \ (and failures) due to mishandled control flow.\n\n```javascript\nlet error =\
    \ true\nif (error) callback(error)\nconsole.log('I will run. Not good!')\n```\n\
    \nJust to be sure, `return` a callback to prevent execution from continuing.\n\
    \n## Listen to the `error` Events\n\nAlmost all Node classes/objects extend the\
    \ event emitter (observer pattern) and emit the `error` event. This is an opportunity\
    \ for developers to catch those pesky errors and handle them before they wreak\
    \ havoc.\n\nMake it a good habit to create event listeners for `error` by using\
    \ `.on()`:\n\n```javascript\nvar req = http.request(options, (res) => {\n  if\
    \ ((+res.statusCode).match(/^2\\d$/)) {\n    // Success, process response\n  }\
    \ else if ((+res.statusCode).match(/^5\\d$/)){\n    // Server error, not the same\
    \ as req. Req was ok.\n  }\n})\nreq.on('error', (error) => {\n  // Can't even\
    \ make a request: general error, e.g. ECONNRESET, ECONNREFUSED, E_INVALID_VERSION\n\
    \  console.log(error)\n})\n```\n\n## Know Your npm\n\nMany Node and frontend developers\
    \ know that there is `--save` (for `npm install`) which will not only install\
    \ a module but create an entry in `package.json` with the version. Well, there's\
    \ also `--save-dev`, for `devDependencies` (stuff you't need in production). But\
    \ did you know you can just use `-S` and `-D` instead of `--save` and `--save-dev`?\
    \ Yes, you can.\n\nAnd while you're in module installation, go ahead and remove\
    \ those `^` signs which `-S` and `-D` will create for you. They are dangerous\
    \ because they'll allow `npm install` (or its shortcut `npm i`) to pull the latest\
    \ minor (second digit in semantic versioning) version from `npm`. For example,\
    \ `v6.1.0` to `v6.2.0` is a minor release.\n\n`npm` team believes in [semver](http://semver.org/),\
    \ but you should not. What I mean is that they put caret `^` because they trust\
    \ open source developers to not introduce breaking changes in minor releases.\
    \ No one sane should trust it. Lock your versions. Even better, use [shrinkwrap](https://nodejs.org/blog/npm/managing-node-dependencies-with-shrinkwrap/):\
    \ `npm shrinkwrap` which will create a new file with exact versions of dependencies.\n\
    \n## Conclusion\n\nThis post was part of two. We've already covered a lot of ground,\
    \ from working with callbacks and asynchronous code, to checking for errors and\
    \ locking down dependencies. I hope you've found something new or useful here.\
    \ If you liked it, be sure to check out part two: [10 Node.js Best Practices:\
    \ Enlightenment from the Gurus](https://www.sitepoint.com/node-js-best-practices-from-the-gurus/).\n\
    \n## Chapter 8: An Introduction to Functional JavaScript\n\nBy M. David Green\n\
    \nYou’ve heard that JavaScript is a functional language, or at least that it’s\
    \ capable of supporting functional programming. But what is functional programming?\
    \ And for that matter, if you’re going to start programming paradigms in general,\
    \ how is a functional approach from the JavaScript that you’ve always written?\n\
    \nWell, the good news is that JavaScript isn’t picky when it comes to paradigms.\
    \ You can mix your imperative, object-oriented, prototypal, and functional code\
    \ as you see fit, and still get the job done. But the bad news is what that means\
    \ for your code. JavaScript can support a wide range of programming styles simultaneously\
    \ within the same codebase, so it’s up to you to make the right choices for maintainability,\
    \ readability, and performance.\n\nFunctional JavaScript doesn’t have to take\
    \ over an entire project in order to add value. Learning a little about the functional\
    \ approach can help guide some of the decisions you make as you build your projects,\
    \ regardless of the way you prefer to structure your code. Learning some functional\
    \ patterns and techniques can put you well on your way to writing cleaner and\
    \ more elegant JavaScript regardless your preferred approach.\n\n### Imperative\
    \ JavaScript\n\nJavaScript first gained popularity as an in-browser language,\
    \ used primarily for adding simple hover and click effects to elements on a web\
    \ page. For years, that’s most of what people knew about it, and that contributed\
    \ to the bad reputation JavaScript earned early on.\n\nAs developers struggled\
    \ to match the flexibility of JavaScript against the intricacy of the browser\
    \ document object model (DOM), actual JavaScript code often looked something like\
    \ this in the real world:\n\n```javascript\nvar result;\nfunction getText() {\n\
    \  var someText = prompt(\"Give me something to capitalize\");\n  capWords(someText);\n\
    \  alert(result.join(\" \"));\n};\nfunction capWords(input) {\n  var counter;\n\
    \  var inputArray = input.split(\" \");\n  var transformed = \"\";\n  result =\
    \ [];\n  for (counter = 0; counter < inputArray.length; counter++) {\n    transformed\
    \ = [\n      inputArray[counter].charAt(0).toUpperCase(), \n      inputArray[counter].substring(1)\n\
    \    ].join(\"\");\n    result.push(transformed);\n  }\n};\n\ndocument.getElementById(\"\
    main_button\").onclick = getText;\n```\n"
