  trans: "\n\n![](img/calibre_cover.jpg)\n\n# 现代 JavaScript\n\nCopyright © 2017 SitePoint\
    \ Pty. Ltd.\n\n**封面设计：**\nNatalia Balska\n\n## 权利声明\n保留所有权利。未经出版者事先书面许可，本书的任何部分均不得复制、存储在检索系统中或以任何形式或通过任何传输，但评论性文章或评论中的简短引用除外。\n\
    \n## 免责声明\n作者和出版商已尽一切努力确保书中信息的准确性。然而，本书中包含的信息按原样出售，不提供任何明示或暗示的保证。作者和 SitePoint\
    \ Pty. Ltd. 及其代理或分销商对于因书中包含的指令或书中所描述的软件或硬件产品而直接或间接造成的任何损害均不承担责任。\n\n## 商标说明\n\
    本书并非对每个商标名称的出现进行标注，仅以编辑方式使用这些名称，旨在维护商标主的利益，无侵权意图。\n\n![](img/00015.jpg)\n\nSitePoint\
    \ Pty. Ltd. 出版\n48 Cambridge Street Collingwood\nVIC Australia 3066\n网站: www.sitepoint.com\n\
    电子邮箱: books@sitepoint.com\n\n## 关于 SitePoint\nSitePoint 专门为 Web 专业人士出版有趣、实用且易于理解的内容。访问\
    \ [`www.sitepoint.com/`](http://www.sitepoint.com/) 访问我们的博客、书籍、时通讯、文章和社区论坛。你将在这里找到关于\
    \ JavaScript、PHP、设计等大量信息。\n\n## 前言\n如今，看到人们抱怨 JavaScript 开发变得多么复杂并不罕见。如果这种观点来自一个对该语言的新手，我们对此表示某种同情。如果你正在学习\
    \ JS，很快就会接触到庞大的生态系统，以及为了构建现代 Web 应用程序需要理解（至少在概念上）的海量变动部分。包管理、代码检查、转译、模块打包、代码压缩、源码映射、框架、单元测试、热重载……不可否认，这比仅仅在页面中包含几个\
    \ `<script>` 标签并通过 FTP 上传到服务器要复杂得多。\n\n长期以来，JavaScript 被许多人视为一个笑话；一种玩具级语言，其唯一的用途就是添加一些非必要的视觉点缀（如鼠标悬停变化），并且经常是奇怪错误和页面崩溃的根源。尽管从早期以来已经取得了巨大进步，但今天仍有人不认真对待这种语言。对\
    \ PHP 开发者产生同情也并不难。无论好坏，JavaScript 都是（目前也是）绝大多数 Web 浏览器原生支持的唯一语言。社区努力改进语言本身，并提供工具帮助构建生产级应用。\n\
    \n这本合集是文章的汇，精选自 SitePoint 的 [JavaScript 频道](https://www.sitepoint.com/javascript/)，旨在让你在现代\
    \ JavaScript 开发中抢占先机。当然，由于语言和生态系统的演变速度都非常快，跟上最新进展至关重要。不要掉队，在读完这本书后，请前往该频道以跟上新趋势和技术！\n\
    \nJames Hibbard & Nilson Jacques，SitePoint JavaScript 频道编辑。\n\n## 使用的规范\n你会注意到，我们在本书中使用了特定的布局样式来表示不同类型的信息。请关注以下项目。\n\
    \n### 代码示例\n书中的代码使用等宽字体显示，如下：\n\n```\n<h1>A Perfect Summer's Day</h1>\n<p>It was a lovely day for a walk.</p>\n\
    ```\n\n某些代码行应该在一行输入，但由于页面限制，我们不得不对它们进行换行处理。➥ 表示仅出于格式目的而存在的换行，应该被忽略：\n\n```javascript\n\
    URL.open(\"http://www.sitepoint.com/responsive-web-design-real-user-testing/?responsive1\"\
    );\n```\n\n### 提示、注释和警告\n\n**嘿，你！**\n提示（Tips）提供有用的小建议。\n\n**额咳，打扰一下……**\n注释（Notes）与当前主题相关但并非关重要的有用补充。将它们视为额外的信息片段即可。\n\
    \n**确保你始终……**\n……注意这些重要要点。\n\n**小心！**\n警告（Warnings）强调可能会可能会让你出错的任何陷阱。\n\n## 第\
    \ 1 章：现代 JavaScript 应用程序剖析\n作者 James Kolce\n\n毫无疑问，JavaScript 生态系统的变化极快。不仅新工具和框架以快速速度引入和开发，语言本身也随着\
    \ ES2015（又称 `ES6`）的引入发生了巨大的变化。可以理解，现在有许多文章在抱怨学习现代 JavaScript 开发有多困难。\n\n在这篇文章中，我将向你介绍现代\
    \ JavaScript。我们将查看该语言的最新进展，并概述当前用于编写前端 Web 应用程序的工具和技术。如果你刚开始学习这种语言，或者已经多年没碰它，并好奇你以前熟悉的\
    \ JavaScript 发生了什么变化，那么这篇文章就是为你准备的。\n\n### 关于 Node.js 的说明\n`Node.js` 是一个允许使用 JavaScript\
    \ 编写服务器程序的运行时。可以拥有全栈 JavaScript 应用程序，前后端都使用 JavaScript。`Node.js` 的到来对生态系统产生了重大影响，引入了\
    \ `npm` 包管理器并普及了 CommonJS 模块格式。\n\n### JavaScript2015\n2015 年，ECMAScript](https://en.wikipedia.org/wiki/ECMAScript)——定义\
    \ JavaScript 的规范以 `ES6` 的名称发布。这个新版本包含了语言的重大补充。改进并没有停止于 ES2015；每年都会发布新版本。\n\n###\
    \ 声明变量\nJavaScript 现在有了额外的变量声明方式：[let 和 const](https://www.sitepoint.com/how-to-declare-variables/)。\n\
    \n`let` 是 `var` 的继承者——尽管 `var` 仍然可用，但 `let` 将变量的作用域限制在所在的块内（而不是函数），这减少了出错的空间：\n\
    \n```javascript\n// ES5\nfor (var i = 1; i < 5; i++) {\n  console.log(i);\n}\n\
    // <-- 打印 1 到 4\nconsole.log(i); // <-- 5（变量 i 在循环外存在）\n\n// ES2015\nfor (let\
    \ j = 1; j < 5; j++) {\n  console.log(j);\n}\nconsole.log(j); // <-- 'Uncaught\
    \ ReferenceError: j is not defined'\n```\n\n使用 `const` 可以定义不能重新绑定到新值的变量。对于字符串和数字等原始值，这类似于常量，因为一旦声明无法更改其值。\n\
    \n```javascript\nconst name = 'Bill';\nname = 'Steve';\n// <-- 'Uncaught TypeError:\
    \ Assignment to constant variable.'\n```\n\n**陷阱**\n```javascript\nconst person\
    \ = { name: 'Bill' };\nperson.name = 'Steve';\n// person.name 现在是 Steve。 \n//\
    \ 因为我们没有更改 person 绑定的对象，JavaScript 不会报错。\n```\n\n## 箭头函数\n\n"
- fmt: "\n# Arrow functions\n\nArrow functions provide a cleaner syntax for declaring\
    \ anonymous functions (lambdas), dropping the `function` keyword and the `return`\
    \ keyword when the body only has one expression. This can allow you to write functional\
    \ style code in a nicer way.\n\n```javascript\n// ES5\nvar add = function(a, b)\
    \ {\n  return a + b;\n}\n\n// ES2015\nconst add = (a, b) => a + b;\n```\n\nThe\
    \ other important feature of arrow functions is that they inherit the value of\
    \ `this` from the context in which they are defined:\n\n```javascript\nfunction\
    \ Person() {\n  this.age = 0;\n  // ES5\n  setInterval(function() {\n    this.age++;\
    \ // |this| refers to the global object\n  }, 1000);\n  // ES2015\n  setInterval(()\
    \ => {\n    this.age++; // |this| properly refers to the person object\n  }, 1000);\n\
    }\n\nvar p = new Person();\n```\n\n## Improved Class syntax\n\nIf you are a fan\
    \ of object-oriented programming, you might like the addition of classes to the\
    \ language on top of the existent mechanism based on prototypes. While it is just\
    \ syntactic sugar, it provides a cleaner syntax for developers trying to emulate\
    \ classical object-orientation with prototypes.\n\n```javascript\nclass Person\
    \ {\n  constructor(name) {\n    this.name = name;\n  }\n  greet() {\n    console.log(`Hello,\
    \ my name is ${this.name}`);\n  }\n}\n```\n\n## Promises / Async functions\n\n\
    The asynchronous nature of JavaScript has long represented a challenge; any non-trivial\
    \ application ran the risk of falling into a callback hell when dealing with things\
    \ like Ajax request.\n\nFortunately, ES2015 added native support for [promises](https://www.sitepoint.com/deeper-dive-javascript-promises/).\
    \ Promises represent values that don’t exist at the moment of the computation\
    \ but that may be available later, making the management of asynchronous function\
    \ calls more manageable without getting into deeply nested callbacks.\n\nES2017\
    \ (due out this year) introduces [async functions](https://www.sitepoint.com/simplifying-asynchronous-coding-async-functions/)\
    \ (sometimes referred to as async/await) that make improvements in this area,\
    \ allowing you to treat asynchronous code as if it were synchronous.\n\n```javascript\n\
    async function doAsyncOp () {\n  const result = await asynchronousOperation();\
    \     \n  console.log(result);\n  return result;\n};\n```\n\n## Modules\n\nAnother\
    \ prominent feature added in ES2015 is a native module format, making the definition\
    \ and usage of modules a part of the language. Loading modules was previously\
    \ only available in the form of third-party libraries. We'll look at modules in\
    \ more depth in the next section.\n\nThere are other features we won't talk about\
    \ here, but we've covered some of the major differences you're likely to notice\
    \ when looking at modern JavaScript. You can check a complete list with examples\
    \ on the [Learn ES2015](https://babeljs.io/learn-es2015/) page on the [Babel site](https://babeljs.io/),\
    \ which you might find useful to get up to date with the language. Some of those\
    \ features include template strings, iterators, generators, new data structures\
    \ such as `Map` and `Set`, and more.\n\n### More on ES2015\nTo learn more about\
    \ ES2015, check out our Premium course: [Diving into ES2015](https://www.sitepoint.com/premium/courses/diving-into-es2015-2924)\n\
    \n## Code linting\n\nLinters are tools that parse your code and compare it against\
    \ a set of rules, checking for syntax errors, formatting, and good practices.\
    \ Although the use of a linter is recommended to everyone, it is especially useful\
    \ if you are getting started. When configured correctly for your code editor/IDE\
    \ you can get instant feedback to ensure you don’t get stuck with syntax errors\
    \ as you're learning new language features.\n\nYou can [check out ESLint](https://www.sitepoint.com/up-and-running-with-eslint-the-pluggable-javascript-linter/)\
    \ which is one of the most popular and supports ES2015+.\n\n## Modular Code\n\n\
    Modern web applications can have thousands (even hundred of thousands) of lines\
    \ of code. Working at that size becomes almost impossible without a mechanism\
    \ to organize everything in smaller components, writing specialized and isolated\
    \ pieces of code that can be reused as necessary in a controlled way.\n\n### CommonJS\n\
    A handful of module formats have emerged over the years, the most popular of which\
    \ is [CommonJS](https://en.wikipedia.org/wiki/CommonJS). It's the default in Node.js.\
    \ It makes use of `module` object to export and `require()` function to import.\
    \ \n\n```javascript\n// lib/math.js\nfunction sum(x, y) {\n  return x + y;\n}\n\
    module.exports = {\n  sum: sum,\n  pi: 3.14159\n};\n\n// app.js\nconst math =\
    \ require(\"./lib/math\");\nconsole.log(math.sum(1, 2));\n```\n\n### ES2015 modules\n\
    ES2015 introduces a way to define and consume modules right in the language. Example:\n\
    \n```javascript\n// lib/math.js\nexport function sum(x, y) {\n  return x + y;\n\
    }\nexport const pi = 3.14159;\n\n// app.js\nimport { sum } from \"./lib/math\"\
    ;\nconsole.log(sum(1, 2));\n```\n\nOr we can also import only what we need:\n\n\
    ```javascript\n// app.js\nimport { sum } from \"./lib/math\";\n```\n\n## Package\
    \ Management\n\nOther languages have long had their own repositories and managers\
    \ to make it easier to find and install third-party libraries. Node.js comes with\
    \ its own package manager and repository, [npm](https://www.sitepoint.com/beginners-guide-node-manager/).\
    \ Although there are other package managers available, npm has become the de facto\
    \ JavaScript package manager and is said to be the largest package registry.\n\
    \nIn the [npm repository](https://www.npmjs.com/) you can find third-party modules\
    \ that you can easily download and use in your projects with a `npm install <package>`\
    \ command. The packages are downloaded into a local `node_modules` directory,\
    \ which contains all the packages and dependencies.\n\nThe packages that you download\
    \ can be registered as dependencies of your project in a [package.json](https://docs.npmjs.com/files/package.json)\
    \ file, with information about your project or module (which can itself be published\
    \ as a package on npm).\n\nYou can define separate dependencies for both development\
    \ and production. While the production dependencies are needed for the package\
    \ to work, the development dependencies are only necessary for the developers.\n\
    \n### Example package.json file\n\n```json\n{\n  \"name\": \"demo\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"Demo package.json\",\n  \"main\": \"main.js\"\
    ,\n  \"dependencies\": {\n    \"mkdirp\": \"^0.5.1\",\n    \"underscore\": \"\
    ^1.8.3\"\n  },\n  \"devDependencies\": {},\n  \"scripts\": {\n    \"test\": \"\
    echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"Sitepoint\"\
    ,\n  \"license\": \"ISC\"\n}\n```\n\n## Build Tools\n"
  raw: 'Arrow functions provide a cleaner syntax for declaring anonymous functions
    (lambdas), dropping the `function` keyword and the `return` keyword when the body
    function only has one expression. This can allow you to write functional style
    code in a nicer way.


    `// ES5`


    `var add = function(a, b) {`


    `  return a + b;`


    `}`


    `// ES2015`


    `const add = (a, b) => a + b;`


    The other important feature of arrow functions is that they inherit the value
    of `this` from the context in which they are defined:


    `function Person(){`


    `  this.age = 0;`


    `  // ES5`


    `  setInterval(function() {`


    `    this.age++; // |this| refers to the global object`


    `  }, 1000);`


    `  // ES2015`


    `  setInterval(() => {`


    `    this.age++; // |this| properly refers to the person object`


    `  }, 1000);`


    `}`


    `var p = new Person();`


    Improved Class syntax


    If you are a fan of object-oriented programming, you might like the addition of
    classes to the language on top of the existent mechanism based on prototypes.
    While it is just syntactic sugar, it provides a cleaner syntax for developers
    trying to emulate classical object-orientation with prototypes.


    `class Person {`


    `  constructor(name) {`


    `    this.name = name;`


    `  }`


    `  greet() {`


    ``    console.log(`Hello, my name is ${this.name}`);``


    `  }`


    `}`


    Promises / Async functions


    The asynchronous nature of JavaScript has long represented a challenge; any non-trivial
    application ran the risk of falling into a callback hell when dealing with things
    like Ajax request.


    Fortunately, ES2015 added native support for [promises](https://www.sitepoint.com/deeper-dive-javascript-promises/).
    Promises represent values that don’t exist at the moment of the computation but
    that may be available later, making the management of asynchronous function calls
    more manageable without getting into deeply nested callbacks.


    ES2017 (due out this year) introduces [async functions](https://www.sitepoint.com/simplifying-asynchronous-coding-async-functions/)
    (sometimes referred to as async/await that make improvements in this area, allowing
    you to treat asynchronous code as if it were synchronous.


    `async function doAsyncOp () {`


    `  const result = await asynchronousOperation();     `


    `  console.log(result);`


    `  return result;`


    `};`


    Modules


    Another prominent feature added in ES2015 is a native module format, making the
    definition and usage of modules a part of the language. Loading modules was previously
    only available in the form of third-party libraries. We''ll look at modules in
    more depth in the next section.


    There are other features we won''t talk about here, but we''ve covered some of
    the major differences you''re likely to notice when looking at modern JavaScript.
    You can check a complete list with examples on the [Learn ES2015](https://babeljs.io/learn-es2015/)
    page on the [Babel site](https://babeljs.io/), which you might find useful to
    get up to date with the language. Some of those features include template strings,
    iterators, generators, new data structures such as Map and Set, and more.


    More on ES2015


    To learn more about ES2015, check out our Premium course: [Diving into ES2015](https://www.sitepoint.com/premium/courses/diving-into-es2015-2924)


    Code linting


    Linters are tools that parse your code and compare it against a set of rules,
    checking for syntax errors, formatting, and good practices. Although the use of
    a linter is recommended to everyone, it is especially useful if you are getting
    started. When configured correctly for your code editor/IDE you can get instant
    feedback to ensure you don’t get stuck with syntax errors as you''re learning
    new language features.


    You can [check out ESLint](https://www.sitepoint.com/up-and-running-with-eslint-the-pluggable-javascript-linter/)
    which is one of the most popular and supports ES2015+.


    Modular Code


    Modern web applications can have thousands (even hundred of thousands) of lines
    of code. Working at that size becomes almost impossible without a mechanism to
    organize everything in smaller components, writing specialized and isolated pieces
    of code that can be reused as necessary in a controlled way. This is the job of
    modules.


    CommonJS modules


    A handful of module formats have emerged over the years, the most popular of which
    is [CommonJS](https://en.wikipedia.org/wiki/CommonJS). It''s the default module
    format in Node.js, and can be used in client-side code with the help of module
    bundlers, which we''ll talk about shortly.


    It makes use of a `module` object to export functionality from a JavaScript file
    and a `require()` function to import that functionality where you need it.


    `// lib/math.js`


    `function sum(x, y) {`


    `  return x + y;`


    `}`


    `const pi = 3.141593`


    `module.exports = {`


    `  sum: sum,`


    `  pi: pi`


    `};`


    `// app.js`


    `const math = require("lib/math");`


    `console.log("2π = " + math.sum(math.pi, math.pi));`


    ES2015 modules


    ES2015 introduces a way to define and consume components right into the language,
    which was previously possible only with third-party libraries. You can have separate
    files with the functionality you want, and export just certain parts to make them
    available to your application.


    Broswer Support


    Note: Native browser support for ES2015 modules is still under development, so
    you currently need some additional tools to be able to use them.


    Here''s an example:


    `// lib/math.js`


    `export function sum(x, y) {`


    `  return x + y;`


    `}`


    `export let pi = 3.141593;`


    Here we have a module that exports a function and a variable. We can include that
    file in another one and use those exported functions:


    `// app.js`


    `import * as math from "lib/math";`


    `console.log("2π = " + math.sum(math.pi, math.pi));`


    Or we can also be specific and import only what we need:


    `// otherApp.js`


    `import {sum, pi} from "lib/math";`


    `console.log("2π = " + sum(pi, pi));`


    These examples have been extracted from the [Babel website](https://babeljs.io/learn-es2015).
    For an in-depth look, check out [Understanding ES6 Modules](https://www.sitepoint.com/understanding-es6-modules/).


    Package Management


    Other languages have long had their own package repositories and managers to make
    it easier to find and install third-party libraries and components. Node.js comes
    with its own package manager and repository, [npm](https://www.sitepoint.com/beginners-guide-node-package-manager/).
    Although there are other package managers available, npm has become the de facto
    JavaScript package manager and is said to be the largest package registry in the
    world.


    In the [npm repository](https://www.npmjs.com/) you can find third-party modules
    that you can easily download and use in your projects with a single `npm install
    <package>` command. The packages are downloaded into a local `node_modules` directory,
    which contains all the packages and their dependencies.


    The packages that you download can be registered as dependencies of your project
    in a [package.json](https://docs.npmjs.com/files/package.json) file, along with
    information about your project or module (which can itself be published as a package
    on npm).


    You can define separate dependencies for both development and production. While
    the production dependencies are needed for the package to work, the development
    dependencies are only necessary for the developers of the package.


    Example package.json file


    `{`


    `  "name": "demo",`


    `  "version": "1.0.0",`


    `  "description": "Demo package.json",`


    `  "main": "main.js",`


    `  "dependencies": {`


    `    "mkdirp": "^0.5.1",`


    `    "underscore": "^1.8.3"`


    `  },`


    `  "devDependencies": {},`


    `  "scripts": {`


    `    "test": "echo \"Error: no test specified\" && exit 1"`


    `  },`


    `  "author": "Sitepoint",`


    `  "license": "ISC"`


    `}`


    Build Tools'
