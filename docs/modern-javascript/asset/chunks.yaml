  trans: '

    然后你可以运行 Gulp，它将执行 `gulpfile.js` 中的指令来构建你的项目：将所有模块打包成一个文件（包括通过 `npm` 安装的模块）、将 ES2015+
    编译为 ES5、对生成的文件进行压缩等。然后，你可以配置它将结果输出到方便的 `dist` 目录中。


    ## 无需处理的文件


    如果你有不需要任何处理的文件，只需将它们从 `src` 复制到 `dist` 目录即可。你可以在构建系统中为该操作配置一个任务。


    现在，你只需要将 `dist` 目录中的文件上传到 Web 服务器即可，而无需担心其他仅对开发有用的文件。


    ## 团队开发


    如果你与其他开发者一起工作，很可能也正在使用共享代码仓库（如 GitHub）来存储项目。在这种情况下，你可以在提交（commit）之前运行构建过程，并将结果与其他文件一起存储在
    Git 仓库中，以便后续下载到生产服务器。


    然而，如果几位开发者共同工作，将构建后的文件存储到仓库中容易出错，而且你可能希望保持项目整洁，不包含构建产物。幸运的是，有更好的处理方法：你可以在流程中使用如
    [Jenkins](http://jenkins.io)、[Travis CI](http://travis-ci.org)、[CircleCI](http://circleci.com)
    等服务，这样它在每次提交推送到仓库后都能自动构建你的项目。开发者只需担心推送代码更改，而无需每次都预先构建项目；同时，仓库也保持了整洁，没有自动生成的文件；最后，你仍然拥有构建好的文件可供部署。


    ## 结论


    如果你近几年没有接触 Web 开发，从简单网页到现代 JavaScript 应用程序的转变可能看起来望而生畏，但我希望这篇文章能作为一个有用的起点。我尽可能为每个主题都链接了更深入的文章，以便你进一步探索。


    请记住，如果在某个时刻，在查看所有可用选项后，觉得一切看起来都难以从心且混乱；那么只需记住 [KISS 原则](https://en.wikipedia.org/wiki/KISS_principle)，只使用你认为需要的，而不是你拥有的所有。根结底，解决问题才是最重要的，而不是使用所有最新的东西。


    # 第 2 章：Gulp.js 简介


    作者：Craig Buckler


    由 [Giulio Mainardi](https://www.sitepoint.com/author/gmainardi/) 和 [Tim Severien](https://www.sitepoint.com/author/tseverien/)
    同行评审。


    开发者花在编码上的时间非常有限。即使我们忽略那些烦人的会议，大部分工作也包含会耗尽你工作日的基础任务：


    * 从模板和内容文件生成 HTML

    * 压缩新图片和修改过的图片

    * 将 Sass 编译为 CSS 代码

    * 从脚本中移除 `console` 和 `debugger` 语句

    * 将 ES6 转换为跨浏览器兼容的 ES5 代码

    * 代码检查（linting）和验证

    * 合并并压缩 CSS 和 JavaScript 文件

    * 将文件部署到开发、测试和生产服务器


    每当你做出更改时，必须重复这些任务。你可能初衷良好，但即使是最无失的开发者也会忘记压缩一两张图片。随着时间的推移，生产前的任务变得越来越艰巨且耗时；你会畏惧那些不可避免的内容和模板更改。这是一项枯燥、重复的工作。把时间花在更有价值的工作上难道会更好吗？


    如果是这样，你需要一个任务运行器或构建流程。


    ## 这听起来复杂得可怕！


    创建一个构建流程需要时间。它比手动执行每个任务要复杂，但从长远来看，你将节省数小时的工作，减少人为错误并保持理智。采取务实的方法：


    * 优先自动化最令人沮丧的任务

    * 尽量不要让你的构建流程过于复杂；一两个小时对于初始设置已经足够了

    * 选择一个任务运行软件并坚持一段时间。不要随心切换到另一个选项。


    某些工具和概念对你来说可能是新的，但请深呼吸，一次专注于一件事。


    ## 任务运行器：可选方案


    诸如 [GNU Make](https://www.gnu.org/software/make/) 这样的构建工具已经存在了几十年，但针对 Web 的任务运行器是一个相对新的现象。第一个实现规模效应的是
    [Grunt](http://gruntjs.com/) - 这是一个 Node.js 任务运行器，它使用（最初）由 JSON 配置文件控制的插件。Grunt
    取得了成功，但也存在许多问题：


    1. Grunt 的基本功能（如文件监听）需要插件。

    2. Grunt 插件通常执行多个任务，这使得自定义变得更加笨拙。

    3. 对于最基础任务之外的所有任务，JSON 配置可能变得难以维护。

    4. 任务运行速度较慢，因为 Grunt 在每个处理步骤之间都会保存文件。


    许多问题在后续版本中得到了解决，但 [Gulp](http://gulpjs.com/) 已经到来并提供了许多改进：


    1. 像文件监听这样的功能是内置的。

    2. Gulp 插件（大部分）设计为执行单项工作。

    3. Gulp 使用 JavaScript 配置代码，更更简洁、更易读、更易修改，并提供了更好的灵活性。

    4. Gulp 速度更快，因为它使用 [Node.js streams](https://www.sitepoint.com/basics-node-js-streams/)
    通过一系列管道（piped）插件传递数据。文件只在任务结束时才写入。


    当然，Gulp 本身并不完美，而新的任务运行器如 [Broccoli.js](http://broccolijs.com/)、[Brunch](http://brunch.io/)
    和 [webpack](https://webpack.github.io/) 也在竞争开发者的关注。最近，npm 本身也被推崇为一种更简单的方案](https://www.sitepoint.com/guide-to-npm-as-build-tool/)。所有工具都有优缺点，但
    Gulp 仍然是首选并被超过 40% 的 Web 开发者使用](https://ashleolan.co.uk/blog/frontend-tooling-survey-2016-results)。


    Gulp 需要 Node.js，虽然某些 JavaScript 知识会有帮助，但所有 Web 开发者都能从中受益。


    ## 关于 Gulp 4


    本文介绍了如何使用 Gulp 3 - 这是编写时的最新发布版本。Gulp 4 已经开发一段时间，但仍处于测试阶段。你可以[使用或切换到 Gulp 4](https://www.joezimjs.com/javascript/complete-guide-upgrading-gulp-4/)，但在正式发布之前建议使用版本
    3。


    ### 第一步：安装 Node.js


    可以在 [nodejs.org/download/](https://nodejs.org/download/) 下载 Windows、Mac 和 Linux
    的 Node.js。从二进制文件、包管理器和 Docker 镜像安装有多种选择 - 详细说明可用。


    ### Windows 用户注意


    Node.js 和 Gulp 可以在 Windows 上运行，但某些依赖原生 Linux 二进制文件的压缩库可能无法安装或运行。Windows 10 用户的一个选择是使用新的
    [bash 命令行](https://msdn.microsoft.com/en-us/commandline/wsl/install_guide)；这解决了许多问题，但它是测试产品并可能引入替代问题。


    安装后，打开命令提示符并输入：


    ```

    node -v

    ```


    显示版本号。你大量使用 `npm` - Node.js 包管理器，它用于安装模块。查看它的版本号：


    ```

    npm -v

    ```

