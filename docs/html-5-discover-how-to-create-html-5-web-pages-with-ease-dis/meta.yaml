    Goal of United Nation is to "make this world a better and safer place to live"


    The United Nation Foundation is Committed to help the UN achieve 8th Millennium
    Development Goals


    > We are working towards them all but we believe that 8th MDG calling for global
    partnership for development is most important of them all


    Similarly, there is an abbreviation `<abbr>` element which you can use to make
    abbreviations. Abbreviations are quite useful as they provide valuable information
    to the users and search engines as well as browsers. You have to always use an
    `<abbr>` element in combination with a title attribute as shown in the following
    example:


    ### Example 2:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Using Quotation Elements</title>

    </head>


    <body>

    <h1>How to use quotation element in HTML 5</h1>


    <p>The <abbr title="The United Nations Organizations">UNO</abbr> was founded on
    24th October, 1945.</p>


    <p>Goal of United Nation is to <q>make this world a better and safer place to
    live</q></p>


    <p>The United Nation Foundation is Committed to help the UN achieve 8th Millennium
    Development Goals

    <blockquote>We are working towards them all but we believe that 8th MDG calling
    for global partnership for development is most important of them all</blockquote></p>


    </body>

    </html>

    ```


    The UNO was founded on 24th October, 1945.


    Goal of United Nation is to "make this world a better and safer place to live"


    The United Nation Foundation is Committed to help the UN achieve 8th Millennium
    Development Goals


    > We are working towards them all but we believe that 8th MDG calling for global
    partnership for development is most important of them all


    **Adding an Address to a web page:**


    In the previous chapter, we added an address to the footer of our web page. The
    address element `<address>` is a perfect option for adding contact information
    on the website, necessary for engaging your users and customers. It is rather
    simple to put in your contact information using address elements, as the following
    example demonstrates.


    ### Example 3:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Using Quotation Elements</title>

    </head>


    <body>

    <h1>How to use quotation element in HTML 5</h1>


    <p>HTML 5 address element helps you to define contact information such as names
    of authors or owner of the website.</p>


    <address>

    Written By: Diana Smith <br />

    Visit Us at: www.examplewebsite.com<br />

    Box xyz, New York, United States

    </address>


    </body>

    </html>

    ```


    ![](img/74b007158668ecfd5db52000148af0d4_135_0.png)


    The last important element falling under the Quotation and Citation category is
    the Cite `<cite>` element. This element is mainly used to define the title of
    a literary work, but you can use it to define the title of anything you like.
    Most browsers will display cite elements in italics.


    ### Example 4:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Using Quotation Elements</title>

    </head>


    <body>

    <h1>How to use quotation element in HTML 5</h1>


    <p>The cite element defines the title of a work</p>


    <p><cite>A Game of Thrones</cite> by George R. R. Martin. First Published in United
    Kingdom in 1996</p>

    </body>

    </html>

    ```


    ![](img/74b007158668ecfd5db52000148af0d4_137_0.png)


    ## The iframe Element:


    HTML 5 specifications refer to the iframe `<iframe>` element as a *nested browsing
    context*. In simple words, it helps you to pick the content from another source
    or web page and embed it in your own web page without the help of another document.
    You simply have to use a src attribute to define the location of the content you
    want to embed.


    The following example explains how to add an inline frame using iframes.


    ### Example 5:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Using iframe Element</title>

    </head>


    <body>

    <h1>How to use iframe element in HTML 5</h1>


    <p>iframe element helps you to embed content from another source</p>


    <iframe src="https://www.w3.org/wiki/HTML/Elements/iframe" width="300" height="300"></iframe>


    </body>

    </html>

    ```


    How to use iframe element in HTML 5


    iframe element helps you to embed content from another source


    ![](img/74b007158668ecfd5db52000148af0d4_139_0.png)


    You can use iframes to embed almost anything you like, such as videos. Similarly,
    you can also use the iframe element as target frames for links.


    ## HTML 5 Entities:


    Finally, it is imperative to talk about HTML 5 entities. Entities are used to
    add those characters to your web page which you cannot add simply by typing text.
    For instance, you need to use certain entities to insert greater than > and less
    than < symbols because the browser can mistake them for markups. Such characters
    are also known as reserved characters and must be replaced with entities.


    Remember that all entities start with an ampersand (&) followed by the entity
    name and a semicolon. For instance, you will use the following markup if you want
    to insert <, >, quotation marks, and currency or pound symbols in your web page.


    ### Example 6:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Using Element Entities</title>

    </head>

    <body>

    <h1>How to use HTML 5 Entities</h1>

    <p>&apos;<br />

    &curr;<br />

    &pound;<br />

    &gt;<br />

    &lt;</p>


    </body>

    </html>

    ```


    ![](img/74b007158668ecfd5db52000148af0d4_142_0.png)


    You can also use numerical codes for the entities to appear on your web page.
    HTML 5 has countless reserved characters and it is impossible to remember the
    names or codes of all of them. In this regard, the following are some reference
    links to all of the HTML 5 entities.


    - [http://dev.w3.org/html5/html-author/charref](http://dev.w3.org/html5/html-author/charref)

    - [http://www.w3schools.com/charsets/ref_html_symbols.asp](http://www.w3schools.com/charsets/ref_html_symbols.asp)

    - [http://edoceo.com/notabene/xhtml-entities](http://edoceo.com/notabene/xhtml-entities)


    ## Exercise 10


    **Task:** Embed a page from Wikipedia on Baseball in your web page using an iframe
    element.


    **Solution:**


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Exercise</title>

    </head>

    <body>

    <h1>Exercise 10</h1>

    <iframe src="https://en.wikipedia.org/wiki/Baseball" width="300" height="300"></iframe>

    </body>

    </html>

    ```


