    # ## The iframe Element:


    HTML 5 specifications refer to the iframe `<iframe>` element as a *nested browsing
    context*. In simple words, it helps you to pick the content from another source
    or web page and embed it in your own web page without the help of another document.
    You simply have to use a src attribute to define the location of the content you
    want to embed.


    The following example explains how to add an inline frame using iframes.'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# **Example 5:**


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset= "utf-8">

    <title>Using iframe Element</title>

    </head>


    <body>

    <h1>How to use iframe element in HTML 5</h1>


    <p>iframe element helps you to embed content from another source</p>


    <iframe src="https://www.w3.org/wiki/HTML/Elements/iframe" width="300" height=
    "300"></iframe>


    </body>

    </html>

    ```'
  merge: -1
  pgno: 138
