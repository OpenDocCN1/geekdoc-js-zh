    # Chapter 6: Understanding Hyperlinks


    In this chapter, you will learn about:


    +   - What a hyperlink is

    - How to build hyperlinks

    - How to use hyperlinks


    Without hyperlinks, there would be no internet. Hyperlinks are what connect HTML
    and other resources on the internet. They are simple links which enable the users
    on your website to travel from one page to another on the same site or to another
    site. Your web page or website will be disconnected from the rest of the internet
    if it hasn’t got any links.


    You need the following to create a link:


    +   - A Uniform Resource Locator (URL), commonly known as a web address. The web
    address usually starts with http://

    - An anchor element <a> with an href attribute to make your link alive. The href
    attribute enables you to specify the URL you want your users to visit via the
    hyperlink.

    - A piece of text or content on the web page to link to.


    You can use links to direct your users to any web page you want. For example,
    you may want the link to take your visitors to W3 Schools if you plan to refer
    to something about HTML 5 standards.'
  - '[PAGE 76]


    # Types of Links:


    There are two main types of links, absolute and relative, which are explained
    as follows.


    # Absolute Links:


    Links which need the complete URL of the web page are called absolute links. They
    provide a standalone and complete path to the target web page. You can use an
    absolute link when you are linking to another website.


    # Relative Links:


    Relatives link use a shortened URL or web address to point to the desired resource.
    For instance, the links used to point to a web page within same domain are relative
    links.


    # Creating a Link:


    In the following example, you will specify the URL http://www.w3schools.com in
    the href attribute of the anchor element. Similarly, the text between the tags
    <a> </a> will specify the link.


    # Example 1:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Creating Links</title>

    </head>

    ```'
