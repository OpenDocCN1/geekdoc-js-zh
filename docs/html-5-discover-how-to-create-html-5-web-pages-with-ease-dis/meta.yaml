    <form action="bin/guestbook.php">

    <select>

    <option>Select an option...</option>

    <option>Option 1</option>

    <option>Option 2</option>

    <option>Option 3</option>

    </select>

    </form>

    </body>

    </html>

    ```


    A dropdown menu is ready for you with an instruction at the top and three options
    to choose from. Remember that this is one of many types of dropdown menus you
    can create in HTML 5.


    ## Checkboxes:


    Checkboxes are perfect when you want your users to choose more than one option
    from a group of choices. You will use the `<input>` tag to create a checkbox,
    but the input *type* will be *checkbox*.


