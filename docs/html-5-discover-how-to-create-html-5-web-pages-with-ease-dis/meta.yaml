    <h1>Table Layouts</h1>


    <table>

    <tr><th>Name</th><th colspan="2">Telephone</th></tr>

    <tr><td>ABC</td><td>123  45  678</td><td>123  45  679</td></tr>

    <tr><td rowspan="2" colspan="2">Cars  No.</td><td>IXJ 1</td></tr>

    <tr><td colspan="2">LXJ2</td></tr>

