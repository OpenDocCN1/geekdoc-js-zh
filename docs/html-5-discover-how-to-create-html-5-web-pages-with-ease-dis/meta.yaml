  md: '# # Chapter 4: Creating Tables in HTML 5


    In this chapter, you will learn about:


    +   - The capabilities and benefits of tables

    - Creating tables in HTML 5


    # ## Tables in HTML 5:


    If you are looking for an easy way to lay text, data, content, and images in a
    grid, try creating a table. Tables are perfect for displaying numerical data,
    but they can also help you present any information that naturally falls into columns
    and rows in a manner that''s easy to understand. They can also help you save a
    lot of precious white space which would otherwise have been occupied by terms,
    definitions, and similar data which covers a lot of space when presented in paragraphs
    or other elements.


    # ## Markup in an HTML 5 Table:


    Compared to lists, tables in HTML 5 contain a lot of markup. However, the <table>
    element is the primary markup container for creating tables. You use an opening
    table tag <table> and a closing table tag </table> to denote the opening and closing
    of a table in HTML 5. The table row <tr> and table data <td> are other primary
    elements used in tables in HTML 5.


    You can use these three elements to create a basic table. However, if you are
    looking to create a rather complex table'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'In HTML 5, you can use other elements, such as <caption> or <colgroup> within
    these three primary elements. Moreover, there are <thead> and <tbody> elements
    which define the heading and actual content of the table, respectively.


    The basic markup for a simple table in HTML 5 is as follows.


    # Example 1:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Creating Tables</title>

    </head>

    <body>

    <h1>How to Create Tables in HTML 5</h1>


    <table>

    <tr><th>Name</th><th>Age</th><th>Gender</th></tr>

    <tr><td>David</td><td>25</td><td>Male</td></tr>

    <tr><td>William</td><td>30</td><td>Male</td></tr>

    <tr><td>Elizabeth</td><td>22</td><td>Female</td></tr>

    </table>


    </body>

    </html>

    ```'
  merge: -1
  pgno: 49
