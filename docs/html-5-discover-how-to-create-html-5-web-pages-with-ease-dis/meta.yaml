- img_proc: true
  md: 'You can use iframes to embed almost anything you like, such as videos. Similarly,
    you can also use the iframe element as target frames for links.


    # HTML 5 Entities:


    Finally, it is imperative to talk about HTML 5 entities. Entities are used to
    add those characters to your web page which you cannot add simply by typing text.
    For instance, you need to use certain entities to insert greater than > and less
    than < symbols because the browser can mistake them for markups. Such characters
    are also known as reserved characters and must be replaced with entities.


    Remember that all entities start with an ampersand (&) followed by the entity
    name and a semicolon. For instance, you will use the following markup if you want
    to insert <, >, quotation marks, and currency or pound symbols in your web page.


    # Example 6:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Using Element Entities</title>

    </head>

    <body>

    <h1>How to use HTML 5 Entities</h1>

    </body>

    ```'
  merge: -1
  pgno: 140
- img_proc: true
  md: '```

    <p>&apos;<br />

    &curr;<br />

    &pound;<br />

    &gt;<br />

    &lt;</p>


    </body>

    </html>

    ```'
  merge: -1
  pgno: 141
- img_proc: true
  md: '![](img/74b007158668ecfd5db52000148af0d4_142_0.png)


    You can also use numerical codes for the entities to appear on your web page.
    HTML 5 has countless reserve characters and it is impossible to remember the names
    or codes of all of them. In this regard, the following are some reference links
