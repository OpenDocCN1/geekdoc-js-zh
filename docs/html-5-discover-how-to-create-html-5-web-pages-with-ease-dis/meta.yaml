    \n与 `<br>` 类似，水平分隔线或 `<hr>` 也是一个自闭合标签；它用于在页面上添加实线直线，称为分隔线。水平分隔线是将页面分成逻辑部分或页眉、页脚与页面其余部分分隔开的好选择。\n\
