  md: '# Chapter 2: HTML 5 Document Structure


    In Chapter 2, you will learn:


    +   - The HTML 5 Document Structure

    - How to Establish an HTML 5 Document Structure

    - The HTML 5 Head Element

    - The HTML 5 Body Element

    - HTML 5 Headings and Paragraphs


    # The Document Structure:


    At the end of the last chapter, we discussed how to create and save a simple HTML
    5 document; however, we did not discuss much about the document structure. An
    HTML 5 document mainly consists of a Head and Body. The Head contains the data,
    which informs the browser and even web servers that it is an HTML 5 document.
    On the other hand, the Body contains content that web browsers actually display.


    This chapter covers all the major elements necessary to craft a basic HTML 5 document.


    # Establishing a Document Structure:


    Each and every HTML 5 document employs a unique combination of elements and content
    to define a page. The structure of all the properly documented pages is the same
    and contains:


    +   - A declaration at the top, which indicates that it is an'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# HTML 5 document


    +   - Adocument header

    - Adocument body


    A collection of HTML 5 elements constitutes an HTML 5 document. Some of these
    elements are essential while others are optional. However, you can always find
    the following three elements in every page in addition to the DOC Type declaration
    at the top.


    +   - <!DOCTYPE> informs the browsers that it is actually an HTML 5 document.
    Although there are other types of DOC Types, this is the most commonly used declaration.

    - The DOC Type Declaration is followed by <html> </html> opening and closing tags.
    These tags contain everything inside the document, including the Head and Body.

    - <head></head> opening and closing tags follow the opening html tag. These tags
    contain information about the body, title of the page, definitions, labels, etc.
    You can only use certain markup elements in the HTML 5 head. Some of these elements
    include style, title, base, link, script and meta. In HTML 5, these elements are
    collectively known as HTML Head Elements.

    - After the closing head tag is the <body></body> opening and closing Body tags.
    They contain all the content which appears on the browser, as well as the related
    HTML 5 codes. Theoretically, you can create an HTML 5 document without anything
    in the'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'body, but you need to have a well-crafted Head and Body to index your page
    properly in the browser. The following example contains all the basic elements
    you need to create an HTML 5 page.


    # Example 1:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Basic Page Structure</title>

    </head>

    <body>

    </body>

    </html>

    ```


    Notice that the head element also contains a Meta tag. Meta elements are used
    to specify other metadata, such as page author, description, keywords, last modified,
    etc.

    If you save the above HTML 5 document and see it in the browser, it will display
    as:'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Notice that the browser is showing nothing apart from the page title in the
    tab. This is because you have not done anything with the body so far.


    # **The Body Element:**


    After successfully setting up your Head, including metadata and page title, it
    is time to create some HTML5 markup in the Body which will actually appear in
    the browser. The Body is like a big container which contains everything you want
    to see in the browser. Take a look at Example 2.


    # **Example 2:**


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    ```'
  merge: -1
  pgno: 18
- img_proc: true
  md: '```

    <title>Basic Page Structure</title>

    </head>

    <body>

    <h1>Creating an HTML 5 Document</h1>

    <p>This is a body element</p>

    </body>

    </html>

    ```


    You should see the following output in your browser:


    ![](img/74b007158668ecfd5db52000148af0d4_19_0.png)


    That is fantastic. Now your browser is showing a heading at the top and some content
    below the heading as well. This is because you have added some HTML 5 markup in
    the Body element. Similarly, you can edit your HTML 5 document by adding any markup
    in the Body element.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Headings and Paragraphs:


    Headings and paragraphs are two of the most important and fundamental elements
    used in HTML 5.


    # Headings:


    Denoted by the <h> tag, HTML 5 uses six levels of headings, from h1 to h6. In
    this regard, the first level heading <h1> is the largest whereas the last level
    heading <h6> is the smallest. The basic purpose of headings is to break documents
    into sections. They help you create an organized structure, breakup the text flow
    on the page, and provide visual cues about the grouping of the content. Example
    3 demonstrates how to use headings in HTML 5.


    # Example 3:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset= "utf-8">

    <title>Basic Page Structure</title>

    </head>

    <body>

    <h1>This is first level heading</h1>

    <h2>This is second level heading</h2>

    <h3>This is third level heading</h3>

    <h4>This is fourth level heading</h4>

    <h5>This is fifth level heading</h5>

    <h6>This is sixth level heading</h6>

    ```'
  merge: -1
  pgno: 20
- img_proc: true
  md: '```

    </body>

    </html>

    ```


    Different browsers will display the headings differently. Google Chrome displays
    them as the following:'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# This is first level heading


    # This is second level heading


    # This is third level heading


    # This is fourth level heading


    # This is fifth level heading


    # This is sixth level heading


    # Paragraphs:


    Anyone who is familiar with HTML 4 or other version of HTML must also be familiar
    with the paragraph tag.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Paragraph is a text block which appears more than any other element on the
    web page. You have to use <p></p> opening and closing tags in order to group your
    content in paragraphs because web browsers do not recognize hard returns inside
    HTML 5 editors.


    It is very simple to create a paragraph in HTML 5. You have to put an opening
    <p> tag inside the body, write some text and close the paragraph with a </p> tag.
    Take a look at Example 4.


    # Example 4:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Basic Page Structure</title>

    </head>

    <body>

    <p>this is a paragraph</p>

    <p>this is another paragraph</p>

    </body>

    </html>

    ```


    When you see the code in browser, you will get something like this:'
  merge: -1
  pgno: 23
- img_proc: true
  md: '![](img/74b007158668ecfd5db52000148af0d4_24_0.png)


    Thanks to the paragraph <p> tag, we have two different paragraphs on our HTML
    5 web page. In the same way, you can create as many paragraphs as you require
    or desire on your web page. Just remember to properly close your paragraphs with
    </p>; otherwise it could cause a lot of rendering issues and your web page might
    not load properly.


    # ## Exercise 2


    **Task:**


    Create a basic HTML 5 page and title it Exercise. Also add an <h1> heading containing
    the text "Exercise 2" and a paragraph explaining what this exercise is about.


    **Solution:**'
  merge: -1
  pgno: 24
- img_proc: true
  md: '```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Exercise</title>

    </head>


    <body>


    <h1>Exercise 2</h1>

    <p>Exercise 2 is about the headings and paragraphs tags learned in chapter 2.</p>


    </body>

    </html>

    ```'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# # Chapter 3: Formatting Text & Creating Lists


    In chapter 3, you will learn about:


    +   - Formatting Text in HTML 5

    - Organizing Text in Lists


    # ## Formatting Text or Text Decoration:


    HTML 5 documents include a lot of text, images, videos, multimedia, and other
    types of content, making it important for you to format blocks of content to lay
    a strong foundation for your web page. In chapter 2, you learned how to organize
    text in HTML 5 using block level elements, such as paragraphs and headings. In
    this chapter, you will explore other important elements which will help you format
    text properly.


    # ## Bold and Italics:


    HTML 5 introduces some new formatting elements which were missing from previous
    versions. For instance, it is strongly recommended that you use `<strong></strong>`
    opening and closing tags for making a chunk of text bold instead of using `<b></b>`.


    Similarly, HTML 5 experts prefer using emphasize element tags `<em></em>` for
    italics rather than `<i></i>`. This'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'effectively informs the browser that it is an HTML 5 document and that the
    content between the `<em>` and `</em>` tags is in italics.


    # **Example 1:**


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Basic Page Structure</title>

    </head>

    <body>

    <h1>HTML 5 Beginner Level Course</h1>

    <p>This is a <strong>bold</strong>text</p>

    <p>This <em>text</em> is in italics </p>

    </body>

    </html>

    ```'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# HTML 5 Beginner Level Course


    This is a **bold text**


    This *text* is in italics


    # Line Breaks and Horizontal Rule:


    HTML 5 normally ignores line breaks unless you use certain formatting elements
    or tags which break the line as needed. The most common of these elements is the
    line break element, commonly referred to as `<br>`. Look at example 2 to see what
    happens when we try to put some space between two words or lines within a paragraph
    without `<br>`.


    # Example 2:


    ```

    <!DOCTYPE HTML>

    <html>

    ```'
