- img_proc: true
  md: '![](img/74b007158668ecfd5db52000148af0d4_123_0.png)


    Similarly, you can use <div> to create and style different sections, divisions,
    headers, footers, and almost anything else you like.


    # The Footer <footer> Element:


    Finally, another important *semantic element* of HTML 5 is the footer <footer>.
    As the name suggests, this element defines the footer of a page or section. This
    particular element should contain as much information as possible about its containing
    element. Normally, it contains:


    +   - Contact information

    - Authorship and copyright information

    - Back to top links (see previous chapter)'
  merge: -1
  pgno: 123
- img_proc: true
  md: "+   - Related documents\n- Site maps\n\nThe following example demonstrates\
    \ how to use footers in HTML 5.\n\n# Example 4:\n\n```\n<!DOCTYPE HTML>\n<html>\n\
    <head>\n<meta charset=\"utf-8\">\n<title>Using Header Element</title>\n\n<style>\n\
    #wrapper {\n    background-color: #F1F1F1;\n    height: 70px;\n    width: 550px;\n\
    \    color: red;\n}\n</style>\n\n</head>\n\n<body>\n<h1>How to use footer element\
