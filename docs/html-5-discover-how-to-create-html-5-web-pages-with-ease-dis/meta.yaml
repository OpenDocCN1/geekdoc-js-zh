    在第2章中，你将学习：


    - HTML 5文档结构

    - 如何建立HTML 5文档结构

    - HTML 5 Head元素

    - HTML 5 Body元素

    - HTML 5标题和段落


    ### 文档结构：


    在上一章的结尾，我们讨论了如何创建和保存一个简单的HTML 5文档；然而，我们没有太多讨论文档结构。一个HTML 5文档主要由Head和Body组成。Head包含数据，这些数据通知浏览器甚至Web服务器这是一个HTML
