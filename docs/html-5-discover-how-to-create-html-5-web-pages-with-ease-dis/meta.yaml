    \n</ol>\n\n</body>\n</html>\n```\n\n## Chapter 4: Creating Tables in HTML 5\n\n\
    In this chapter, you will learn about:\n\n- The capabilities and benefits of tables\n\
    - Creating tables in HTML 5\n\n### Tables in HTML 5:\n\nIf you are looking for\
    \ an easy way to lay text, data, content, and images in a grid, try creating a\
    \ table. Tables are perfect for displaying numerical data, but they can also help\
    \ you present any information that naturally falls into columns and rows in a\
    \ manner that's easy to understand. They can also help you save a lot of precious\
    \ white space which would otherwise have been occupied by terms, definitions,\
    \ and similar data which covers a lot of space when presented in paragraphs or\
    \ other elements.\n\n### Markup in an HTML 5 Table:\n\nCompared to lists, tables\
    \ in HTML 5 contain a lot of markup. However, the `<table>` element is the primary\
    \ markup container for creating tables. You use an opening table tag `<table>`\
    \ and a closing table tag `</table>` to denote the opening and closing of a table\
    \ in HTML 5. The table row `<tr>` and table data `<td>` are other primary elements\
    \ used in tables in HTML 5.\n\nYou can use these three elements to create a basic\
    \ table. However, if you are looking to create a rather complex table"
