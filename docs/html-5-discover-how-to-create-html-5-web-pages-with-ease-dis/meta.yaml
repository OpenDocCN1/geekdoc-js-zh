    ## Chapter 7: Working with Images


    In this chapter, you will learn about:


    - The role of images in HTML 5

    - How to add images to web pages


    Images not only contribute to the overall feel and look of the website, but can
    also be used to direct site navigation or deliver important information. The use
    of images requires careful consideration and selection; otherwise they lose their
    effectiveness.


    Images can be anything from a logo to a clickable navigation aid. They may make
    your site beautiful or contain important information. There are many websites
    that make perfect use of images to deliver their messages, such as [http://now.lincoln.com/](http://now.lincoln.com/).
    In fact, well used images are one of the most important components of any web
    design.


    ### Image Types:


    Before we discuss how to add an image to a web page, it is imperative to mention
    the type of images you can use in HTML 5. You can use many types of images, but
    we recommend using the following in your web pages.


    - Joint Photographic Experts Group (JPEG)

    - Graphics Interchange Format (GIF)

    - Portable Network Graphics (PNG)


    You also need to maintain a balance between image size and type in order for your
    website to load and render properly.


    ### Adding images to a Web Page:


    When you have your image ready, use image `<img>`, an empty element, to determine
    where your images will go on the website. Also remember that `<img>` is a self-closing
    element and does not require separate opening and closing tags.


    The following markup shows how you can add an image which resides in the same
    directory as that of the HTML 5 file to a web page.


    ### Example 1:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Adding Images</title>

    </head>

    <body>

    <h1>How to add images to a webpage</h1>


    <p> The earth is round as the following images shows

    <br>

    <img src="roundworld.jpg" alt="The Earth is Round" />

    </p>

    </body>

    </html>

    ```


    In this example, the *source (src)* attribute specifies the location of the image
    to be displayed in the web page. Similarly, the *alt* attribute offers alternate
    information for the image if the user cannot somehow view it. It is good practice
    to add alt text because it is helpful for visitors who are visually impaired,
    have slow internet connections, or are accessing the website from a browser with
    limited visual capabilities. Some search engines also index images with the help
    of alt text.


    The browser will display the above HTML 5 markup as follows:


    ### How to add images to a webpage


    The earth is round as the following images shows


    ![](img/74b007158668ecfd5db52000148af0d4_91_0.png)


    Just like links, sometimes web developers store images in different directories.
    In this case, you have to mention the proper path of the image for the browser
    to display the image correctly. The following examples demonstrate how you can
    do so.


    ### Example 2:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Adding Images</title>

    </head>

    <body>

    <h1>How to add images to a webpage</h1>


    <p>The earth is round and looks beautiful from the

    space as the following image shows <br>

    <img src="images/earth.jpg" alt="The Earth is Round"

    title="Earth from Space"/>

    </p>

    </body>

    </html>

    ```


    In this example, the src attribute is instructing the browser to:


    - Find the folder named "images"

    - Find the "earth.jpeg" image in the images folder.


    In this case, the browser will display the following image:


    ### How to add images to a webpage


    The earth is round and looks beautiful from space as the following image shows


    ![](img/74b007158668ecfd5db52000148af0d4_93_0.png)


    ### The Titled Image:


    In addition to alt text, you should always use give images a title. A title is
    a text which all search engines, including Chrome and Firefox, display when you
    hover the mouse over the image. You can add a title through a title attribute
    in `<img>` tag, just like src and alt. In the following example, we will add a
    title to an image.


    ### Example 3:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Adding Images</title>

    </head>

