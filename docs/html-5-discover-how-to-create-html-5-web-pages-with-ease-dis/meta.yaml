    \n**解决方案：**\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n\
    <title>Exercise 3</title>\n</head>\n<body>\n<h1>States of USA</h1>\n<ol>\n<li>California\n\
    <ul>\n<li>Sacramento</li>\n<li>Los Angeles</li>\n</ul>\n</li>\n\n<li>Florida\n\
    <ul>\n<li>Miami</li>\n<li>Orlando</li>\n</ul>\n</li>\n\n<li>Texas\n<ul>\n<li>Austin</li>\n\
    <li>Houston</li>\n</ul>\n</li>\n\n</ol>\n\n</body>\n</html>\n```\n\n## 第 4 章：在\
    \ HTML 5 中创建表格\n\n在本章中，你将了解到：\n\n- 表格的功能和优势\n- 在 HTML 5 中创建表格\n\n### HTML 5 中的表格：\n\
    \n如果你想用简单的方式将文本、数据、内容和图像以网格形式布局，可以尝试创建表格。表格非常适合显示数值数据，但它们也可以帮助你以易于理解的方式呈现任何自然适合列和行的信息。它们还可以帮助你节省大量宝贵的空白区域，否则这些区域会被术语、定义和类似数据占用，这些数据在段落或其他元素中呈现时会占用大量空间。\n\
    \n### HTML 5 表格中的标记：\n\n与列表相比，HTML 5 中的表格包含大量标记。但是，`<table>` 元素是创建表格的主要标记容器。你使用一个开始表格标签\
