  mdcn: "\n # 如何在网页中添加图片\n\n地球是圆的，如下图所示\n\n![](img/74b007158668ecfd5db52000148af0d4_95_0.png)\n\
    \n### 让图片可点击：\n\n可以让任何图片变成一个链接。这很容易实现，因为你将使用相同的 `<a>` 元素来为图片添加链接。不过，在这种情况下，你需要将\
    \ `<a></a>` 之间的文本替换为图片。看看下面的示例：\n\n### 示例 4：\n\n```\n<!DOCTYPE HTML>\n<html>\n\
    <head>\n<meta charset= \"utf-8\">\n<title>Adding Images</title>\n</head>\n<body>\n\
    <h1>How to add images to a webpage</h1>\n\n<p> The earth is round and looks beautiful\
    \ from space as the following image shows <br>\n<a href=\"http://science.nationalgeographic.com/science/earth/\"\
    \ntarget=\"_blank\"><img  src=\"images/earth.jpg\"  alt=\"The\nEarth is Round\"\
    \ title=\"Earth from Space\"></a>\n\n</body>\n</html>\n```\n\n这段标记使我们的图片变成了一个链接，点击后会在新标签页中打开国家地理网站的特定页面。\n\
    \n# 如何在网页中添加图片\n\n地球是圆的，而且从太空看起来很美，如下图所示\n\n![](img/74b007158668ecfd5db52000148af0d4_98_0.png)\n\
    \n## 调整图片大小：\n\n最后，你可以使用 `<img>` 自闭合标签中的 height 和 width 属性在 HTML 5 中更改图片的宽度和高度。上述示例中的图片宽度和高度分别为\
    \ 500 像素和 300 像素（500×300）。我们将使用 HTML 5 标记将尺寸更改为 600×400 像素。\n\n### 示例 5：\n\n```\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset= \"utf-8\">\n<title>Adding Images</title>\n\
    </head>\n<body>\n<h1>How to add images to a webpage</h1>\n\n<p> The earth is round\
    \ and looks beautiful from space as the following image shows <br>\n<img src=\"\
    images/earth.jpg\" alt=\"The Earth is Round\" title=\"Earth from Space\" width=\"\
    600\" height=\"400\"/>\n\n</body>\n</html>\n```\n\n# 如何在网页中添加图片\n\n地球是圆的，而且从太空看起来很美，如下图所示\n\
    \n![](img/74b007158668ecfd5db52000148af0d4_100_0.png)\n\n如你所见，我们使用 width 和 height\
    \ 属性调整了图片大小；你可以对上传到网页的所有图片执行相同的操作。\n\n## 练习 7\n\n**任务：**\n添加一张与 HTML 5 文件位于不同目录中的图片。将宽度和高度都调整为\
    \ 400 像素。同时包含一些替代文本和图片标题。\n\n**解答：**\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    <meta charset= \"utf-8\">\n<title>Exercise</title>\n</head>\n<body>\n<h1>Exercise\
    \ 7</h1>\n```\n\n```\n<img src=\"exercise/statue.jpg\" alt=\"This is Statue of\
    \ Liberty\" title=\" Statue of Liberty\" width=\"400\" height=\"400\"/>\n```\n\
    \n```\n</body>\n</html>\n```\n\n# 第 8 章：处理视频和音频\n\n在本章中，你将学习如何：\n\n- 在 HTML 5\
    \ 中嵌入来自其他网页的视频和音频\n- 在 HTML 5 中嵌入来自本地计算机的视频\n- 在 HTML 5 中嵌入来自本地计算机的音频\n\n随着时间的推移，不同类型的媒体，包括视频和音频，变得越来越重要。如今，网络不仅是获取内容和图片的地方，还成为了观看直播视频、进行视频会议和视频通话等的首选资源。\n\
    \n与旧版本的 HTML 不同，旧版本需要各种插件的帮助才能播放音频和视频，HTML 5 增加了嵌入媒体的标准方式。HTML 5 消除了早期版本中与播放媒体相关的许多问题，例如需要找到适合浏览器的正确插件来运行特定类型的媒体。\n\
    \n## 从其他网页嵌入媒体：\n\n将任何类型的内容从其他网页添加到你的页面非常容易，媒体（包括音频和视频）也是如此。为此，我们使用 iframe `<iframe>`\
    \ 元素。就像 `<a>` 和 `<img>` 元素一样，我们在 `<iframe>` 元素内使用 src 属性来指定我们要播放的视频的 URL。看看下面的示例：\n\
    \n### 示例 1：\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n\
    <title>Adding Media</title>\n</head>\n\n<body>\n<h1>How to add Media to a webpage</h1>\n\
    \n<p> Video on Twinkle Twinkle Little Star<br>\n<iframe src=\"https://www.youtube.com/embed/yCjJyiqpAuU\"\
    \ width=\"560\" height=\"315\" frameborder=\"0\" allowfullscreen></iframe>\n\n\
    </body>\n</html>\n```\n\n# 如何在网页中添加媒体\n\n一闪一闪小星星视频\n\n![](img/74b007158668ecfd5db52000148af0d4_106_0.png)\n\
    \n在此示例中：\n\n- *src* 属性指定你要放入的视频的来源或 URL。\n- *width* 和 *height* 属性指定视频帧的宽度和高度。\n\
    - *Allowfullscreen* 属性让观众可以选择全屏观看视频。\n\n在 HTML 5 中，你不需要编写所有繁琐的代码来获取视频。你只需复制整个代码并将其粘贴到\
    \ HTML 5 编辑器中。例如，打开你想要嵌入的任何 YouTube 视频，转到标题下方的 *分享* 标签，然后点击 *嵌入*。你会得到一个与上述示例中使用的代码非常相似的代码。只需复制代码并将其放在你希望视频播放的位置。\n\
    \n## 从计算机嵌入视频和音频：\n\n到目前为止，我们已经学习了如何从其他网页嵌入视频和音频。现在我们将了解如何嵌入位于本地计算机某处的视频和音频。过程大致相同，因为你只需将\
    \ `<iframe>` 元素分别替换为用于嵌入视频和音频的 `<video>` 和 `<audio>` 元素。\n\n## 嵌入视频：\n\n对于视频，你将使用以下标记：\n\
    \n### 示例 2：\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset= \"utf-8\"\
    >\n<title>Adding Media</title>\n</head>\n<body>\n<h1>How to add Media to a webpage</h1>\n\
    <p> Video on Twinkle Twinkle Little Star<br>\n<video  src=\"rhymes.mp4\"  width=\"\
    560\"  height=\"315\" controls></video>\n</body>\n</html>\n```\n\n# 如何在网页中添加媒体\n\
    \n一闪一闪小星星视频\n\n![](img/74b007158668ecfd5db52000148af0d4_109_0.png)\n\n我们在 HTML\
    \ 5 中添加了一个视频，而没有使用任何烦人的插件。请注意，标记中还有一个 control 属性，它允许你添加播放、暂停和音量等控件。虽然该属性的唯一值是\
    \ *controls*，但在 HTML5 中严格来说不需要任何值。\n\n你可以用来代替 *controls* 的其他属性有：\n\n- **autoplay**：视频加载后立即播放\n\
    - **loop**：视频结束后自动从头开始重播\n- **preload**：告诉浏览器是否应该预加载视频。如果已经有 *controls* 属性，则不需要此属性。\n\
    \n最好总是添加宽度和高度；否则可能会出现渲染问题，这取决于你使用的浏览器。\n\n## **嵌入音频：**\n\n从本地计算机嵌入音频文件时，你需要将视频\
    \ `<video>` 元素替换为音频 `<audio>`。其余的标记将大致保持不变。\n\n### **示例 3：**\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Adding Media</title>\n\
    </head>\n\n<body>\n<h1>How to add Media to a webpage</h1>\n\n<p> The \"Firefiles\"\
    \ from You Can Unlearn Guitar<br>\n<audio src=\"audio.mp3\" controls autoplay></audio>\n\
    \n</body>\n</html>\n```\n\n![](img/74b007158668ecfd5db52000148af0d4_112_0.png)\n\
    \n## HTML 5 中的媒体格式：\n\nHTML 5 中最常用的音频和视频格式值得一提。我们建议使用这些格式，而不是其他格式，以避免渲染和加载不正确的问题。\n\
    \n### 主要音频格式：\n\n以下是你可以在 HTML 5 中使用的主要音频格式。\n\n- Ogg Vorbis (.ogg)\n- MP3 (.mp3)\n\
    - Waveform Audio File Format，或 WAVE (.wav)\n\n**主要视频格式：**\n\n以下是 HTML 5 认可的一些主要视频格式。\n\
    \n- Ogg Theora (.ogg)\n- MP4 (.mp4)\n- VP8/9 (.webm)\n\n## 练习 8\n\n**任务：**\n\n\
    将 YouTube 上的视频添加到你的网页，并将屏幕宽度和高度分别调整为 500 像素和 300 像素。同时将一段视频下载到你的桌面并添加到你的网页。为第二个视频添加控件和自动播放功能。\n\
    \n**解答：**\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n\
    <title>Exercise</title>\n</head>\n<body>\n<p>The Declaration of Independence</p>\n\
    </body>\n</html>\n```\n"
