    \ of HTML 5 elements constitutes an HTML 5 document. Some of these elements are\
    \ essential while others are optional. However, you can always find the following\
    \ three elements in every page in addition to the DOC Type declaration at the\
    \ top.\n\n- `<!DOCTYPE>` informs the browsers that it is actually an HTML 5 document.\
    \ Although there are other types of DOC Types, this is the most commonly used\
    \ declaration.\n- The DOC Type Declaration is followed by `<html> </html>` opening\
    \ and closing tags. These tags contain everything inside the document, including\
    \ the Head and Body.\n- `<head></head>` opening and closing tags follow the opening\
    \ html tag. These tags contain information about the body, title of the page,\
    \ definitions, labels, etc. You can only use certain markup elements in the HTML\
    \ 5 head. Some of these elements include style, title, base, link, script and\
    \ meta. In HTML 5, these elements are collectively known as HTML Head Elements.\n\
    - After the closing head tag is the `<body></body>` opening and closing Body tags.\
    \ They contain all the content which appears on the browser, as well as the related\
    \ HTML 5 codes. Theoretically, you can create an HTML 5 document without anything\
    \ in the body, but you need to have a well-crafted Head and Body to index your\
    \ page properly in the browser. The following example contains all the basic elements\
    \ you need to create an HTML 5 page.\n\n# Example 1:\n\n```\n<!DOCTYPE HTML>\n\
    <html>\n<head>\n<meta charset=\"utf-8\">\n<title>Basic Page Structure</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\nNotice that the head element also contains\
    \ a Meta tag. Meta elements are used to specify other metadata, such as page author,\
    \ description, keywords, last modified, etc.\n\nIf you save the above HTML 5 document\
    \ and see it in the browser, it will display as:\n\nNotice that the browser is\
    \ showing nothing apart from the page title in the tab. This is because you have\
    \ not done anything with the body so far.\n\n## The Body Element:\n\nAfter successfully\
    \ setting up your Head, including metadata and page title, it is time to create\
    \ some HTML5 markup in the Body which will actually appear in the browser. The\
    \ Body is like a big container which contains everything you want to see in the\
    \ browser. Take a look at Example 2.\n\n## Example 2:\n\n```\n<!DOCTYPE HTML>\n\
    <html>\n<head>\n<meta charset=\"utf-8\">\n<title>Basic Page Structure</title>\n\
    </head>\n<body>\n<h1>Creating an HTML 5 Document</h1>\n<p>This is a body element</p>\n\
    </body>\n</html>\n```\n\nYou should see the following output in your browser:\n\
    \n![](img/74b007158668ecfd5db52000148af0d4_19_0.png)\n\nThat is fantastic. Now\
    \ your browser is showing a heading at the top and some content below the heading\
    \ as well. This is because you have added some HTML 5 markup in the Body element.\
    \ Similarly, you can edit your HTML 5 document by adding any markup in the Body\
    \ element.\n\n## Headings and Paragraphs:\n\nHeadings and paragraphs are two of\
    \ the most important and fundamental elements used in HTML 5.\n\n### Headings:\n\
    \nDenoted by the `<h>` tag, HTML 5 uses six levels of headings, from h1 to h6.\
    \ In this regard, the first level heading `<h1>` is the largest whereas the last\
    \ level heading `<h6>` is the smallest. The basic purpose of headings is to break\
    \ documents into sections. They help you create an organized structure, breakup\
    \ the text flow on the page, and provide visual cues about the grouping of the\
    \ content. Example 3 demonstrates how to use headings in HTML 5.\n\n### Example\
    \ 3:\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Basic\
    \ Page Structure</title>\n</head>\n<body>\n<h1>This is first level heading</h1>\n\
    <h2>This is second level heading</h2>\n<h3>This is third level heading</h3>\n\
    <h4>This is fourth level heading</h4>\n<h5>This is fifth level heading</h5>\n\
    <h6>This is sixth level heading</h6>\n</body>\n</html>\n```\n\nDifferent browsers\
    \ will display the headings differently. Google Chrome displays them as the following:\n\
    \n# This is first level heading\n\n# This is second level heading\n\n# This is\
    \ third level heading\n\n# This is fourth level heading\n\n# This is fifth level\
    \ heading\n\n# This is sixth level heading\n\n### Paragraphs:\n\nAnyone who is\
    \ familiar with HTML 4 or other version of HTML must also be familiar with the\
    \ paragraph tag.\n\nParagraph is a text block which appears more than any other\
    \ element on the web page. You have to use `<p></p>` opening and closing tags\
    \ in order to group your content in paragraphs because web browsers do not recognize\
    \ hard returns inside HTML 5 editors.\n\nIt is very simple to create a paragraph\
    \ in HTML 5. You have to put an opening `<p>` tag inside the body, write some\
    \ text and close the paragraph with a `</p>` tag. Take a look at Example 4.\n\n\
    ### Example 4:\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\"\
    >\n<title>Basic Page Structure</title>\n</head>\n<body>\n<p>this is a paragraph</p>\n\
    <p>this is another paragraph</p>\n</body>\n</html>\n```\n\nWhen you see the code\
    \ in browser, you will get something like this:\n\n![](img/74b007158668ecfd5db52000148af0d4_24_0.png)\n\
    \nThanks to the paragraph `<p>` tag, we have two different paragraphs on our HTML\
    \ 5 web page. In the same way, you can create as many paragraphs as you require\
    \ or desire on your web page. Just remember to properly close your paragraphs\
    \ with `</p>`; otherwise it could cause a lot of rendering issues and your web\
    \ page might not load properly.\n\n## Exercise 2\n\n**Task:**\n\nCreate a basic\
    \ HTML 5 page and title it Exercise. Also add an `<h1>` heading containing the\
    \ text \"Exercise 2\" and a paragraph explaining what this exercise is about.\n\
    \n**Solution:**\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Exercise</title>\n\
    </head>\n\n<body>\n\n<h1>Exercise 2</h1>\n<p>Exercise 2 is about the headings\
    \ and paragraphs tags learned in chapter 2.</p>\n\n</body>\n</html>\n```\n\n#\
    \ Chapter 3: Formatting Text & Creating Lists\n\nIn chapter 3, you will learn\
    \ about:\n\n- Formatting Text in HTML 5\n- Organizing Text in Lists\n\n## Formatting\
    \ Text or Text Decoration:\n\nHTML 5 documents include a lot of text, images,\
    \ videos, multimedia, and other types of content, making it important for you\
    \ to format blocks of content to lay a strong foundation for your web page. In\
    \ chapter 2, you learned how to organize text in HTML 5 using block level elements,\
    \ such as paragraphs and headings. In this chapter, you will explore other important\
    \ elements which will help you format text properly.\n\n## Bold and Italics:\n\
    \nHTML 5 introduces some new formatting elements which were missing from previous\
    \ versions. For instance, it is strongly recommended that you use `<strong></strong>`\
    \ opening and closing tags for making a chunk of text bold instead of using `<b></b>`.\n\
    \nSimilarly, HTML 5 experts prefer using emphasize element tags `<em></em>` for\
    \ italics rather than `<i></i>`. This effectively informs the browser that it\
    \ is an HTML 5 document and that the content between the `<em>` and `</em>` tags\
    \ is in italics.\n\n### Example 1:\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>Basic Page Structure</title>\n</head>\n<body>\n<h1>HTML\
    \ 5 Beginner Level Course</h1>\n<p>This is a <strong>bold</strong> text</p>\n\
    <p>This <em>text</em> is in italics </p>\n</body>\n</html>\n```\n\n# HTML 5 Beginner\
    \ Level Course\n\nThis is a **bold text**\n\nThis *text* is in italics\n\n## Line\
    \ Breaks and Horizontal Rule:\n\nHTML 5 normally ignores line breaks unless you\
    \ use certain formatting elements or tags which break the line as needed. The\
    \ most common of these elements is the line break element, commonly referred to\
    \ as `<br>`. Look at example 2 to see what happens when we try to put some space\
    \ between two words or lines within a paragraph without `<br>`.\n\n### Example\
    \ 2:\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Basic\
    \ Page Structure</title>\n</head>\n<body>\n<h1>HTML 5 Beginner Level Course</h1>\n\
    <p>This is a <strong>bold</strong> text</p>\n<p>This <em>text</em> is in italics</p>\n\
    \n<p>This line is broken into\n    two parts</p>\n</body>\n</html>\n```"
  mdcn: "\n ## HTML 5 文档\n\n- 文档头部\n- 文档主体\n\n一组 HTML 5 元素构成一个 HTML 5 文档。其中一些元素是必不可少的，而另一些则是可选的。然而，除了顶部的文档类型声明之外，你在每个页面中都能找到以下三个元素。\n\
    \n- `<!DOCTYPE>` 通知浏览器这实际上是一个 HTML 5 文档。虽然还有其他类型的文档类型声明，但这是*最常用*的一种声明。\n- 文档类型声明之后是\
    \ `<html> </html>` 开始标签和结束标签。这些标签包含文档内的所有内容，包括头部和主体。\n- `<head></head>` 开始标签和结束标签紧跟在\
    \ html 开始标签之后。这些标签包含有关主体的信息、页面标题、定义、标签等。在 HTML 5 头部中，你只能使用某些标记元素。其中一些元素包括 style、title、base、link、script\
    \ 和 meta。在 HTML 5 中，这些元素统称为 **HTML 头部元素**。\n- 在头部结束标签之后是 `<body></body>` 开始标签和结束标签。它们包含浏览器中显示的所有内容，以及相关的\
    \ HTML 5 代码。理论上，你可以创建一个主体为空内容的 HTML 5 文档，但你需要有一个精心制作的头部和主体，以便在浏览器中正确索引你的页面。以下示例包含创建\
    \ HTML 5 页面所需的所有基本元素。\n\n# 示例 1：\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta\
    \ charset=\"utf-8\">\n<title>Basic Page Structure</title>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n注意，head 元素还包含一个 Meta 标签。Meta 元素用于指定其他元数据，例如页面作者、描述、关键词、最后修改时间等。\n\
    \n如果你保存上述 HTML 5 文档并在浏览器中查看，它将显示为：\n\n注意，浏览器除了标签栏中的页面标题外，没有显示任何内容。这是因为你还没有对主体做任何处理。\n\
    \n## 主体元素：\n\n成功设置好头部（包括元数据和页面标题）后，是时候在主体中创建一些实际上会显示在浏览器中的 HTML5 标记了。主体就像一个大容器，包含你想在浏览器中看到的所有内容。看看示例\
    \ 2。\n\n## 示例 2：\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\"\
    >\n<title>Basic Page Structure</title>\n</head>\n<body>\n<h1>Creating an HTML\
    \ 5 Document</h1>\n<p>This is a body element</p>\n</body>\n</html>\n```\n\n你应该在浏览器中看到以下输出：\n\
    \n![](img/74b007158668ecfd5db52000148af0d4_19_0.png)\n\n太棒了。现在你的浏览器在顶部显示了一个标题，标题下方也有一些内容。这是因为你已经在主体元素中添加了一些\
    \ HTML 5 标记。同样，你可以通过在主体元素中添加任何标记来编辑你的 HTML 5 文档。\n\n## 标题和段落：\n\n标题和段落是 HTML 5\
    \ 中最重要、最基础的两个元素。\n\n### 标题：\n\nHTML 5 使用 `<h>` 标签表示的六级标题，从 h1 到 h6。在这方面，第一级标题\
    \ `<h1>` 最大，而最后一级标题 `<h6>` 最小。标题的基本作用是将文档分成若干部分。它们帮助你创建结构化的组织，打破页面上的文本流，并提供内容分组的视觉提示。示例\
    \ 3 演示了如何在 HTML 5 中使用标题。\n\n### 示例 3：\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    <meta charset=\"utf-8\">\n<title>Basic Page Structure</title>\n</head>\n<body>\n\
    <h1>This is first level heading</h1>\n<h2>This is second level heading</h2>\n\
    <h3>This is third level heading</h3>\n<h4>This is fourth level heading</h4>\n\
    <h5>This is fifth level heading</h5>\n<h6>This is sixth level heading</h6>\n</body>\n\
    </html>\n```\n\n不同的浏览器会以不同的方式显示标题。Google Chrome 显示如下：\n\n# This is first level\
    \ heading\n\n# This is second level heading\n\n# This is third level heading\n\
    \n# This is fourth level heading\n\n# This is fifth level heading\n\n# This is\
    \ sixth level heading\n\n### 段落：\n\n任何熟悉 HTML 4 或其他版本 HTML 的人一定也熟悉段落标签。\n\n段落是在网页上出现次数最多的文本块。你必须使用\
    \ `<p></p>` 开始标签和结束标签来将你的内容分组为段落，因为 Web 浏览器无法识别 HTML 5 编辑器中的硬回车。\n\n在 HTML 5 中创建段落非常简单。你需要在主体中放置一个开始标签\
    \ `<p>`，写入一些文本，然后用 `</p>` 标签结束段落。看看示例 4。\n\n### 示例 4：\n\n```\n<!DOCTYPE HTML>\n\
    <html>\n<head>\n<meta charset=\"utf-8\">\n<title>Basic Page Structure</title>\n\
    </head>\n<body>\n<p>this is a paragraph</p>\n<p>this is another paragraph</p>\n\
    </body>\n</html>\n```\n\n当你在浏览器中查看代码时，你会看到如下内容：\n\n![](img/74b007158668ecfd5db52000148af0d4_24_0.png)\n\
    \n多亏了段落 `<p>` 标签，我们在 HTML 5 网页上有了两个不同的段落。同样，你可以在你的网页上创建任意数量的段落，只需满足你的需求。请记住用 `</p>`\
    \ 正确关闭你的段落；否则可能会导致大量渲染问题，你的网页可能无**法正确加载**。\n\n## 练习 2\n\n**任务：**\n\n创建一个基本的 HTML\
    \ 5 页面，并将其标题命名为 Exercise。同时添加一个包含文本 \"Exercise 2\" 的 `<h1>` 标题，以及一个解释此练习内容的段落。\n\
    \n**解答：**\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Exercise</title>\n</head>\n\
    \n<body>\n\n<h1>Exercise 2</h1>\n<p>Exercise 2 is about the headings and paragraphs\
    \ tags learned in chapter 2.</p>\n\n</body>\n</html>\n```\n\n# 第 3 章：格式化文本与创建列表\n\
    \n在第 3 章中，你将学习：\n\n- HTML 5 中的文本格式化\n- 使用列表组织文本\n\n## 格式化文本或文本装饰：\n\nHTML 5 文档包含大量文本、图像、视频、多媒体和其他类型的内容，因此格式化内容块以奠定网页的坚实基础非常重要。在第\
    \ 2 章中，你学习了如何使用块级元素（如段落和标题）在 HTML 5 中组织文本。在本章中，你将探索其他重要元素，帮助你正确格式化文本。\n\n## 粗体和斜体：\n\
    \nHTML 5 引入了一些在先前版本中缺失的新格式化元素。例如，强烈建议你使用 `<strong></strong>` 开始标签和结束标签来使文本加粗，而不是使用\
    \ `<b></b>`。\n\n同样，HTML 5 专家更倾向于使用强调元素标签 `<em></em>` 来实现斜体效果，而不是 `<i></i>`。这有效地通知浏览器这是一个\
    \ HTML 5 文档，并且 `<em>` 和 `</em>` 标签之间的内容是*斜体*的。\n\n### 示例 1：\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Basic Page Structure</title>\n\
    </head>\n<body>\n<h1>HTML 5 Beginner Level Course</h1>\n<p>This is a <strong>bold</strong>\
    \ text</p>\n<p>This <em>text</em> is in italics </p>\n</body>\n</html>\n```\n\n\
    # HTML 5 Beginner Level Course\n\nThis is a **bold text**\n\nThis *text* is in\
    \ italics\n\n## 换行与水平线：\n\nHTML 5 通常会忽略换行符，除非你使用某些按需要断行的格式化元素或标签。其中最常见的元素是换行元素，通常称为\
    \ `<br>`。看看示例 2，看看当我们在不使用 `<br>` 的情况下尝试在段落中的两个单词或两行之间留出一些空间时会发生什么。\n\n### 示例 2：\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Basic\
    \ Page Structure</title>\n</head>\n<body>\n<h1>HTML 5 Beginner Level Course</h1>\n\
    <p>This is a <strong>bold</strong> text</p>\n<p>This <em>text</em> is in italics</p>\n\
    \n<p>This line is broken into\n    two parts</p>\n</body>\n</html>\n```\n"
