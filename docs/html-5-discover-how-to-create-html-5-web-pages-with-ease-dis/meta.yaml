  md: '# # HTML 5 Beginner Level Course


    This is a **bold text**


    This *text* is in italics


    This line is broken into

    two parts


    This text is underlined


    # ## Organizing Text in Lists:


    You will create lists if you are looking to group similar information on your
    page. Lists allow your visitors to easily go through groups of information. You
    can include anything in the list from sets of information to links. There are
    four main types of lists: the unordered list, the ordered or numbered list, the
    definition list, and the nested list.


    # ### The Unordered Lists:'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'An unordered or bulleted list contains one or more items prefaced by bullets.
    An unordered list requires at least three elements in the following order.


    +   - <ul> the unordered list element

    - <li> which marks each element in the list

    - </ul> the closing tag which indicates the unordered has ended


    The following example contains the markup for unordered lists.


