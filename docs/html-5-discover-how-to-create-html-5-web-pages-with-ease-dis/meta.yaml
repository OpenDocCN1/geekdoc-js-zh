  md: '# Chapter 9: Web Page Layout


    In this chapter, you will learn the answers to:


    +   - What is a navigation `<nav>` element?

    - What is a header `<header>` element?

    - What is a division `<div>` element?

    - What is a footer `<footer>` element?


    So far, we have discussed how to add lists, tables, images, links, and media to
    web pages using HTML 5. However, we need to learn about a few more elements which
    are essential to HTML 5. These elements will help you to further boost the structure
    and semantics of your website, making it easier for web browsers to understand
    the markup and render your website correctly.


    **The Navigation `<nav>` Element:**


    The `<nav>` element is exclusive to HTML 5 and allows you to group different links
    together, resulting in extra structure and stronger semantics which may help screen
    readers and web browsers. Although the definition of the `<nav>` element is pretty
    simple, no one has been able to fully explain how to use it properly. However,
    a simply markup using a `<nav>` element is as follows:


    **Example 1:**


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    ```'
  merge: -1
  pgno: 116
- img_proc: true
  md: '```

    <meta charset="utf-8">

    <title>Using Navigation Element</title>

    </head>


    <body>

    <h1>How to use nav element in HTML 5</h1>


    <nav>

    <a href="blog.html">Blog</a> |

    <a href="about.html">About Us</a> |

    <a href="contact.html">Contact Us</a> |

    </nav>


    </body>

    </html>

    ```


    The web browser will represent the above markup as follows:'
  merge: -1
  pgno: 117
- img_proc: true
  md: '![](img/74b007158668ecfd5db52000148af0d4_118_0.png)


    Web developers normally use navigation elements for main navigation bars or just
    above the footer. There are also other places where you can use this element,
    such as Table of Contents, Previous/Next Buttons, Search Forms, and Breadcrumbs.


    # The Header <Header> Element:


    Just like the navigation element, the header element is exclusive to HTML 5. The
    header element is actually a "group of introductory or navigation aids." It is
    mostly used at the beginning or top of the web page, but you can also use it at
    the start of any new section or division. Similarly, it usually contains an h1
    introductory heading, but you can'
  merge: -1
  pgno: 118
- img_proc: true
  md: "also insert logos, navigation menus, or a search form. A simple markup for\
    \ a header element is shown in the following example:\n\n# Example 2:\n\n```\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Using Header\
    \ Element</title>\n\n<style>\n#head {\n    background-color: #F1F1F1;\n    height:\
    \ 100px;\n    width: 100%;\n}\n</style>\n\n</head>\n\n<body>\n\n<header id=\"\
    head\">\n<h1>How to use header element in HTML 5</h1>\n<nav>\n<a href=\"blog.html\"\
    >Blog</a> |\n```"
  merge: -1
  pgno: 119
- img_proc: true
  md: '```

    <a href="about.html">About us</a> |

    <a href="contact.html">Contact Us</a> |

    </nav>

    </header>

    </body>

    </html>

    ```


    ![](img/74b007158668ecfd5db52000148af0d4_120_0.png)


    Now we have a header at the top of our web page. The grey background, as well
    as the height and the width of the header, are a result of certain CSS codes which
    we shall'
  merge: -1
  pgno: 120
- img_proc: true
  md: "study in the CSS section of this course.\n\n# The Division <div> Element:\n\
    \nThe division element is perhaps one of the most important and widely used elements\
    \ in HTML 5. The division element does not represent anything like the paragraph\
    \ <p> or image <img> elements do; rather, it is a \"generic container\" which\
    \ maintains the flow or content and provides extra structuring and semantics.\
    \ For instance, if you want to style a particular chunk of content, the <div>\
    \ will do the job perfectly. Take a look at following example:\n\n# Example 3:\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset= \"utf-8\">\n<title>Using\
    \ Header Element</title>\n\n<style>\n#wrapper {\n\tbackground-color: #F1F1F1;\n\
    \theight: 80px;\n\twidth: 500px;\n\tcolor: red;\n\n}\n</style>\n```"
  merge: -1
  pgno: 121
- img_proc: true
  md: '```

    </head>


    <body>

    <h1>How to use div element in HTML 5</h1>


    <div id="wrapper">


    <p>The div element has no special meaning at all. It

    represents its children.<br />

    It can be used with the class, lang, and title attributes to

    mark up semantics<br />

    common to a group of consecutive elements.</br>

    W3C Specification</p>


    </div>


    </body>

    </html>

    ```'
  merge: -1
