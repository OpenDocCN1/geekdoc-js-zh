  md: 'We have added a video in HTML 5 without using any annoying plug-ins. Note that
    there is also a control attribute in the markup which allows you to add controls
    like play, pause, and volume. Although the only value for this attribute is *controls*,
    no value is strictly required in HTML5.


    Other attributes you can use in place of *controls* are:


    +   - **autoplay**: plays the video as soon as it is loaded

    - **loop**: replays the video automatically from the start once it has finished

    - **preload**: tells the browser whether it should preload video or not. You don''t
    need this attribute if the *controls* attribute is already there.


    It is always better to add width and height; otherwise there can be rendering
    issues, depending on the browser you are using.


    # **Embedding Audio:**


    While embedding audio files from your local computer, you will replace the video
    \<video\> element with the audio \<audio\>. The remaining markup will remain more
    or less the same.


