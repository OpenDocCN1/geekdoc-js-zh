  md: 'table in HTML 5.


    # Managing Table Layouts:


    You can make your tables complex, and you can also do a lot of interesting things
    with them. HTML 5 gives you a lot of power in this regard. However, for the sake
    of this book, it is recommended that you stick to the basics to better understand
    how HTML 5 works as far as tables are concerned.


    When it comes to the layout of the tables, there are only three main elements
    in HTML 5 which enable you to design a layout of your choice. These elements are
    as follows:


    +   * **Cells** are the basic building blocks of tables and contain everything
    including data, text, images, and whatever else is within the borders of table.

    * **Borders** are actually four lines on all four sides of the table that form
    a rectangle or square.

    * **Cell Spans** help you add or delete cell walls within the borders of the table.
    Cell spans enable you to accommodate different cell layouts, making the table
    much more flexible.


    Cell spans actually combine or merge cells, or remove walls between them to change
    the cell space. You can make your table much more attractive by spanning different
    rows, cells, and columns. In the following example, we will try to span cells
    and rows in the table and see what happens.


    # Example 3:'
