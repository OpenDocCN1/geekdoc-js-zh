    ### Example 4:


    ```html

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Creating Links</title>

    </head>

    <body>

    <h1>How to Create Hyperlinks in HTML 5</h1>


    <p>This is an <a href="../docs/about.html"> about us

    </a>page of same website</p>


    </body>

    </html>

    ```


    As you can see, we have added the address of the folder in which the about.html
    file resides. Notations in the example instruct the browser to take the following
    steps.


    *   Move up one folder from the folder in which the linking file resides.

    *   Find the folder named “docs.”

    *   Find the file named “about.html” inside docs.


    **Adding Links to information on the same page:**


    It is very easy to point to information on the same page. For instance, there
    are **Go to Top** tabs at the bottoms of some web pages which, once clicked, take
    you back to the top of the page. In that case, you will add an anchor element
    with a name attribute of “top.” Then, at the end of the page, you will use the
    following URL to link back to top.


    ```html

    <a href="#top">Back to Top</a>

    ```


    The hash sign (#) indicates that you''re pointing to a location on the same page.


