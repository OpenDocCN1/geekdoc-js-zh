  md: '# # Chapter 10: Understanding Quotations, iframes, and Entities


    In this chapter you will learn about:


    +   - HTML Quotation and Citation Elements

    - iframe element

    - HTML Entities


    We have reached the last chapter of this book. We have covered a lot of things
    which you need to get going with HTML 5. In the last chapter, we will discuss
    a few more things which can help you make your web page a little more attractive,
    and the structure and semantics stronger and easier for web browsers to understand.


    # ## Quotation and Citation Elements:


    Quoting has been well accommodated in HTML 5 given the deep roots it has in academics.
    The two most important quotation elements in HTML 5 are the q `<q>` and blockquote
    `<blockquote>` elements. The q and blockquote elements indicate short quotations
    within a non-quoted paragraph and represent a section which is quoted from another
    source, respectively. Let us see how to use these elements in HTML 5 markup.


    # ### Example 1:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    ```'
  merge: -1
  pgno: 129
- img_proc: true
  md: '```

    <meta charset="utf-8">

    <title>Using Quotation Elements</title>

    </head>


    <body>

    <h1>How to use quotation element in HTML 5</h1>


    <p>Goal of United Nation is to <q>make this world a better and safer place to
    live</p></p>


    <p>The United Nation Foundation is Committed to help the UN achieve its<br/>

    8th Millennium Development Goals

    <blockquote>We are working towards them all but we believe that 8th MDG<br/>

    calling for global partnership for development is most<br/>

    important of them all</blockquote></p>


    </body>

    </html>

    ```'
  merge: -1
  pgno: 130
- img_proc: true
