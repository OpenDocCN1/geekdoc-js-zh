    </body>

    </html>

    ```


    The above mentioned is the simplest of form you can create in HTML 5. Note that
    the `<form>` element contains a *section* attribute. A section attribute is an
    integral part of the table which informs browser about about the destination *url*
    of the table.


    We can do many more things to make tables more attractive or functional. For instance,
    we can add *value* attributes to the table, as the following example demonstrates.


    ## Example 2:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Creating Forms</title>

    </head>

    <body>

    <h1>How to Create Forms in HTML 5</h1>


    <form action="bin/guestbook.php">

    <input type="text" value="Search"/>

    </form>


    </body>

    </html>

    ```


    Now, you are practically telling your visitors to use this form to search for
    their required information. As a matter of fact, you can use any value inside
    the form, such as example, type here, or email.


    What if you want users to put a larger piece of content in your form? You can
    do so by creating a Comment section by using a `<textarea>` tag.


    ## Example 3:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

