- md: "```\n```html\n<iframe src=\"https://www.youtube.com/embed/jYytEu_NLU\" width=\"\
    500\" height=\"300\" frameborder=\"0\" allowfullscreen></iframe>\n\n<br /><br\
    \ />\n\n<p>Johny Johny Yes Papa</p>\n<video src=\"johny.mp4\" width=\"500\" height=\"\
    300\" controls autoplay></video>\n```\n\n## Chapter 9: Web Page Layout\n\nIn this\
    \ chapter, you will learn the answers to:\n\n- What is a navigation `<nav>` element?\n\
    - What is a header `<header>` element?\n- What is a division `<div>` element?\n\
    - What is a footer `<footer>` element?\n\nSo far, we have discussed how to add\
    \ lists, tables, images, links, and media to web pages using HTML 5. However,\
    \ we need to learn about a few more elements which are essential to HTML 5. These\
    \ elements will help you to further boost the structure and semantics of your\
    \ website, making it easier for web browsers to understand the markup and render\
    \ your website correctly.\n\n**The Navigation `<nav>` Element:**\n\nThe `<nav>`\
    \ element is exclusive to HTML 5 and allows you to group different links together,\
    \ resulting in extra structure and stronger semantics which may help screen readers\
    \ and web browsers. Although the definition of the `<nav>` element is pretty simple,\
    \ no one has been able to fully explain how to use it properly. However, a simple\
    \ markup using a `<nav>` element is as follows:\n\n**Example 1:**\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Using Navigation\
    \ Element</title>\n</head>\n\n<body>\n<h1>How to use nav element in HTML 5</h1>\n\
    \n<nav>\n<a href=\"blog.html\">Blog</a> |\n<a href=\"about.html\">About Us</a>\
    \ |\n<a href=\"contact.html\">Contact Us</a> |\n</nav>\n\n</body>\n</html>\n```\n\
    \nThe web browser will represent the above markup as follows:\n\n![](img/74b007158668ecfd5db52000148af0d4_118_0.png)\n\
    \nWeb developers normally use navigation elements for main navigation bars or\
    \ just above the footer. There are also other places where you can use this element,\
    \ such as Table of Contents, Previous/Next Buttons, Search Forms, and Breadcrumbs.\n\
    \n## The Header `<header>` Element:\n\nJust like the navigation element, the header\
    \ element is exclusive to HTML 5. The header element is actually a \"group of\
    \ introductory or navigation aids.\" It is mostly used at the beginning or top\
    \ of the web page, but you can also use it at the start of any new section or\
    \ division. Similarly, it usually contains an h1 introductory heading, but you\
    \ can also insert logos, navigation menus, or a search form. A simple markup for\
    \ a header element is shown in the following example:\n\n### Example 2:\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Using Header\
    \ Element</title>\n\n<style>\n#head {\n    background-color: #F1F1F1;\n    height:\
    \ 100px;\n    width: 100%;\n}\n</style>\n\n</head>\n\n<body>\n\n<header id=\"\
    head\">\n<h1>How to use header element in HTML 5</h1>\n<nav>\n<a href=\"blog.html\"\
    >Blog</a> |\n<a href=\"about.html\">About us</a> |\n<a href=\"contact.html\">Contact\
    \ Us</a> |\n</nav>\n</header>\n</body>\n</html>\n```\n\n![](img/74b007158668ecfd5db52000148af0d4_120_0.png)\n\
    \nNow we have a header at the top of our web page. The grey background, as well\
    \ as the height and the width of the header, are a result of certain CSS codes\
    \ which we shall study in the CSS section of this course.\n\n## The Division `<div>`\
    \ Element:\n\nThe division element is perhaps one of the most important and widely\
    \ used elements in HTML 5. The division element does not represent anything like\
    \ the paragraph `<p>` or image `<img>` elements do; rather, it is a \"generic\
    \ container\" which maintains the flow of content and provides extra structuring\
    \ and semantics. For instance, if you want to style a particular chunk of content,\
