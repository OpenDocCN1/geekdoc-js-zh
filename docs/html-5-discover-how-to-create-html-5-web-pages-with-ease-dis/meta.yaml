    <br><br>


    <textarea>Write your comment here</textarea>

    </form>


    </body>

    </html>

    ```


    The `<textarea>` tag is different from `<input>` in the sense that it is not self-closing.
    You have to put an opening tag and closing tag, and write your HTML within those
    tags.


    ## The Dropdown Box:


    Dropdown boxes, menus, or lists are one of the most common types of tables featured
    on websites these days and, therefore, it requires special mention here. In order
    to create a dropdown box, you have to use a `<select>` opening and closing tag
    within the form `<form>` element. Within the select element, you list all the
    options with the help of an option `<option>` tag.


    ## Example 4:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <meta charset="utf-8">

    <title>Creating Forms</title>

