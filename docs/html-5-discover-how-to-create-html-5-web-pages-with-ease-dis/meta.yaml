    \nThis is a **bold text**\n\nThis *text* is in italics\n\nThis line is broken\
    \ into\ntwo parts\n\nThis text is underlined\n\n## Organizing Text in Lists:\n\
    \nYou will create lists if you are looking to group similar information on your\
    \ page. Lists allow your visitors to easily go through groups of information.\
    \ You can include anything in the list from sets of information to links. There\
    \ are four main types of lists: the unordered list, the ordered or numbered list,\
    \ the definition list, and the nested list.\n\n### The Unordered Lists:\n\nAn\
    \ unordered or bulleted list contains one or more items prefaced by bullets. An\
    \ unordered list requires at least three elements in the following order.\n\n\
    - `<ul>` the unordered list element\n- `<li>` which marks each element in the\
    \ list\n- `</ul>` the closing tag which indicates the unordered has ended\n\n\
    The following example contains the markup for unordered lists.\n\n## Example 5:\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Organizing\
    \ Content</title>\n</head>\n<body>\n<h1>Following is an unordered list</h1>\n\
    <ul>\n<li>First list item</li>\n<li>Second list item</li>\n<li>Third list item</li>\n\
    </ul>\n</body>\n</html>\n```\n\n## Ordered or Numbered List:\n\nA number prefaces\
    \ all the items in an ordered or numbered list. An ordered list always has at\
    \ least two items. Just like unordered lists, an ordered list contains the following\
    \ three elements.\n\n- `<ol>` the ordered list element\n- `<li>` which marks each\
    \ elements in the list\n- `</ol>` the closing tag indicating the ordered has ended\n\
    \nThe following example contains the markup for an ordered list.\n\n## **Example\
    \ 6:**\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Organizing\
    \ Content</title>\n</head>\n<body>\n<h1>Following is an ordered list</h1>\n\n\
    <ol>\n\n<li>First list item</li>\n<li>Second list item</li>\n<li>Third list item</li>\n\
    \n</ol>\n\n</body>\n</html>\n```\n\n## **The Definition List:**\n\nDefinition\
    \ lists are used to group definitions and terms into a single list on a page.\
    \ Again, the definition list requires the following three elements.\n\n- `<dl>`\
    \ the element which defines the definition list\n- `<dt>` the element which marks\
    \ the term in the definition list\n- `<dd>` defines the term in the definition\
    \ list\n\nThe HTML for the definition list is as follows.\n\n## **Example 7:**\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Organizing\
    \ Content</title>\n</head>\n<body>\n<h1>Following is Definition List</h1>\n\n\
    <dl>\n\n<dt>HTML</dt>\n\t<dd>Hypertext Markup Language</dd>\n<dt>CSS</dt>\n\t\
    <dd>Cascade Stylesheets</dd>\n<dt>W3C</dt>\n\t<dd>World Wide Web Consortium</dd>\n\
    \n</dl>\n\n</body>\n</html>\n```\n\n## Following is Definition List\n\n- HTML:\
    \ Hypertext Markup Language\n- CSS: Cascade Stylesheets\n- W3C: World Wide Web\
    \ Consortium\n\nIt is pertinent to note that different browsers display definition\
    \ lists differently. Similarly, each search engine handles them in different ways,\
    \ as do text-to-speech translators.\n\n## Nesting Lists:\n\nFinally, there are\
    \ nesting lists which are actually subcategories within lists. They are mostly\
    \ used for creating navigation tools, site maps, table-of-contents for online\
    \ papers and books, and outlines.\n\nYou can combine any of the first three types\
    \ of lists with each other to create a nested list. The following example starts\
    \ with a numbered list, which defines things you need to do to lose weight, and\
    \ further divides them into specific tasks.\n\n## Example 8:\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Organizing Content</title>\n\
    </head>\n<body>\n<h1>How to Lose Weight</h1>\n<ol>\n<li>Exercise Regularly\n<ul>\n\
    <li>Go to Gym Daily</li>\n<li>Take Morning Walk</li>\n<li>Play sports Regularly</li>\n\
    </ul>\n</li>\n<li>Take Balanced Diet\n<ul>\n<li>Minimize fats in your diet</li>\n\
    <li>take protein rich diet</li>\n<li>Avoid Junk Food</li>\n</ul>\n</li>\n\n</ol>\n\
    \n</body>\n</html>\n```\n\n## How to Lose Weight\n\n1. Exercise Regularly\n  \
    \ - Go to Gym Daily\n   - Take Morning Walk\n   - Play sports Regularly\n2. Take\
    \ Balanced Diet\n   - Minimize fats in your diet\n   - take protein rich diet\n\
    \   - Avoid Junk Food\n\nYou can include as many items as you like in nested lists.\
    \ However, when working with nested lists, you need to keep few things in mind:\n\
    \n- A complete second level list follows each list in top level ordered or unordered\
    \ list.\n- The second level list does not rest in the list items but in the top\
    \ level list.\n- Nested lists can become quite complicated; therefore, you should\
    \ close all tags very carefully to avoid any rendering issues.\n\n## Exercise\
    \ 3\n\n**Task:**\nCreate an ordered list containing the names of any three states\
    \ of the United States. Then, create three nested lists within the ordered list\
    \ containing the names of two cities of each state.\n\n**Solution:**\n\n```\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Exercise 3</title>\n\
