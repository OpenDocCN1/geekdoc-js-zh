  md: "# Section 7.4: AJAX and Fetch API for Data Exchange\n\nAsynchronous JavaScript\
    \ and XML (AJAX) and the Fetch API are essential tools for making network requests\
    \ and exchanging data between a web page and a server without the need for a full\
    \ page refresh. This capability is crucial for creating interactive and dynamic\
    \ web applications. In this section, we'll explore AJAX and the modern Fetch API.\n\
    \n# AJAX (Asynchronous JavaScript and XML)\n\nAJAX is a set of web development\
    \ techniques that allows you to update parts of a web page without the need to\
    \ reload the entire page. It enables asynchronous communication with a server,\
    \ making it possible to retrieve data, send data, and update the user interface\
    \ in real time.\n\n# XMLHttpRequest\n\nTraditionally, AJAX was implemented using\
    \ the XMLHttpRequest object, which provides methods for making HTTP requests and\
    \ handling responses.\n\n```\nvar xhr = new XMLHttpRequest();\nxhr.open('GET',\
    \ 'https://api.example.com/data', true);\n\nxr.onreadystatechange = function()\
    \ {\n  if (xhr.readyState === 4 && xhr.status === 200) {\n    var data = JSON.parse(xhr.responseText);\n\
    \    // Process and use the retrieved data\n  }\n};\n\nxhr.send();\n```"
  merge: -1
  pgno: 161
- img_proc: false
  md: "In this example, we create an XMLHttpRequest object, configure it for a GET\
    \ request, specify the URL, and set up an event listener to handle the response\
    \ when it’s received. Once the data is retrieved, it can be processed and used\
    \ to update the web page.\n\n# Fetch API\n\nThe Fetch API is a more modern and\
    \ user-friendly way to make network requests. It provides a more straightforward\
    \ and promise-based approach to working with network data.\n\n```\nfetch('https://api.example.com/data')\n\
    .then(function(response) {\n  if (!response.ok) {\n    throw new Error('Network\
    \ response was not ok');\n  }\n  return response.json();\n})\n.then(function(data)\
    \ {\n  // Process and use the retrieved data\n})\n.catch(function(error) {\n \
    \ // Handle errors\n});\n```\n\nWith the Fetch API, you use the fetch function\
    \ to initiate a request and then chain then and catch methods to handle the response\
    \ or any errors. This approach simplifies asynchronous data retrieval and error\
    \ handling.\n\n# Cross-Origin Requests"
  merge: -1
  pgno: 162
- img_proc: false
  md: 'When making requests to a different domain (cross-origin requests), you may
    encounter cross-origin restrictions enforced by web browsers. To enable cross-origin
    requests, you can use techniques like Cross-Origin Resource Sharing (CORS) on
    the server or JSONP (JSON with Padding) for certain scenarios.


    # Asynchronous Operations


    Both AJAX and the Fetch API are asynchronous, meaning that they don’t block the
    main thread of the web page. This allows for smoother user interactions even while
    data is being fetched or sent to the server.


    # Conclusion


    AJAX and the Fetch API are essential tools for creating dynamic and responsive
    web applications. They enable data exchange between the client and server, opening
    the door to real-time updates, interactive forms, and more. While AJAX with XMLHttpRequest
    is still widely used, the Fetch API offers a more modern and user-friendly approach
    for making network requests and handling responses. Understanding how to use these
    techniques is crucial for building modern web applications.'
  merge: -1
  pgno: 163
