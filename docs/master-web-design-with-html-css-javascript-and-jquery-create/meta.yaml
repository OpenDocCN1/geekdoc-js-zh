  md: '# Section 6.3: Event Handling and Event Listeners


    Event handling is a crucial aspect of web development, as it allows web pages
    to respond to user interactions like clicks, mouse movements, and keyboard input.
    In the Event Object Model (DOM), you can use event listeners to attach functions
    or scripts to specific events triggered by DOM elements. This section explores
    event handling in the context of web development.


    # Understanding Events


    An event is a specific occurrence that takes place within a web page, such as
    a user clicking a button, moving the mouse, or pressing a key. DOM elements can
    “listen” for these events and execute functions in response. Events include:


    +   * Click: Triggered when the user clicks an element.

    * Mouse Over/Out: Fired when the mouse pointer enters or leaves an element.

    * Key Press: Occurs when a key on the keyboard is pressed.

    * Submit: Fired when a form is submitted.

    * Load: Triggered when a page or an external resource finishes loading.


    # Event Listeners


    To respond to events, you can attach event listeners to DOM elements. An event
    listener is a JavaScript function that “listens” for a specific event on a particular
    element and executes a predefined action when the event occurs.'
  merge: -1
  pgno: 136
- img_proc: false
  md: "Here’s an example of attaching a click event listener to a button element:\n\
    \n```\n// Select the button element by its ID\nvar button = document.getElementById('myButton');\n\
    \n// Add a click event listener\nbutton.addEventListener('click', function() {\n\
    \  alert('Button clicked!');\n});\n```\n\nIn this example, when the button with\
    \ the ID \"myButton\" is clicked, the function inside the addEventListener call\
    \ will be executed, displaying an alert.\n\n# Event Object\n\nWhen an event occurs,\
    \ an event object is automatically created and passed to the event handler function.\
