  md: '# # Section 7.3: Working with Cookies and Local Storage


    In development, maintaining user data and preferences across sessions is essential
    for creating a personalized and user-friendly experience. Two common client-side
    storage mechanisms for achieving this are cookies and local storage. In this section,
    we''ll explore how to work with cookies and local storage using JavaScript.


    # ## Cookies


    Cookies are small pieces of data that a web server sends to a user''s browser,
    and the browser stores them locally. Cookies can persist across browser sessions
    and are often used for tasks like user authentication, tracking user behavior,
    and storing user preferences.


    # ## Creating Cookies


    JavaScript allows you to create cookies by setting values in the `document.cookie`
    property. A cookie typically consists of a name-value pair, but you can also include
    additional attributes like expiration date, path, and domain.


    ```

    // Create a simple cookie

    document.cookie = ''username=John'';

    ```


    ```

    // Create a cookie with attributes

    document.cookie = ''username=John; expires=Fri, 31 Dec 2023 23:59:59 GMT; path=/'';

    ```


    # ## Reading Cookies


    To read cookies, you can access the `document.cookie` property. However, this
    property contains all cookies for the current'
  merge: -1
  pgno: 157
- img_proc: false
  md: "website as a single string, so you need to parse it to\nretrieve specific cookie\
    \ values.\n\n```\n// Read all cookies\nvar allCookies = document.cookie;\n\n//\
    \ Parse and access a specific cookie\nfunction getCookie(name) {\n  var cookies\
    \ = document.cookie.split(' ');\n  for (var i = 0; i < cookies.length; i++) {\n\
    \    var cookie = cookies[i].split('=');\n    if (cookie[0] === name) {\n    \
    \  return cookie[1];\n    }\n  }\n  return null;\n}\n```\n\nvar username = getCookie('username');\n\
    \n# Modifying and Deleting Cookies\n\nYou can modify existing cookies by reassigning\
    \ them with\nnew values or attributes. To delete a cookie, set its\nexpiration\
    \ date to a past date.\n\n```\n// Modify a cookie\ndocument.cookie = 'username=newValue;\
    \ expires=Fri, 31 Dec 2023 23:59:59 GMT; path=/';\n\n// Delete a cookie (by setting\
    \ expiration to the past)\ndocument.cookie = 'username; expires=Thu, 01 Jan 1970\
    \ 00:00:00 GMT; path=/';\n```"
  merge: -1
