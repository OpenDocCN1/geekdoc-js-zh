  md: '# Section and Article


    The <section> and <article> elements are used to divide the content of a web page
    into meaningful sections. <section> is a generic container, while <article> is
    used for self-contained content, such as blog posts or news articles.


    ```

    <section>

    <h2>Web Development</h2>

    <p>Learn about HTML, CSS, and JavaScript.</p>

    </section>

    <article>

    <h2>How to Build a Responsive Website</h2>

    <p>Step-by-step guide to creating responsive web designs.</p>

    </article>

    ```


    # Aside


    The <aside> element is used for content that is tangentially related to the main
    content, such as sidebars, pull quotes, or advertising.


    ```

    <aside>

    <h3>Related Links</h3>

    <ul>

    <li><a href="#article1">Read More</a></li>

    <li><a href="#article2">Other Articles</a></li>

    </ul>

    </aside>

    ```


    # Figure and Figcaption'
