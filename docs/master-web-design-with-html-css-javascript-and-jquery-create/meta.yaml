  md: "```\n<!-- Defining a section with an id -->\n<section id=\"section1\">\n  <h2>Section\
    \ 1</h2>\n  <p>This is the content of Section 1.</p>\n</section>\n```\n\n# Linking\
    \ to Email Addresses\n\nYou can use the mailto: scheme to create links that open\
