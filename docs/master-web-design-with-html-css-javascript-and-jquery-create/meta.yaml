  md: "# Section 2.4: Lists, Links, and Anchors\n\nHTML provides several elements\
    \ for creating lists, hyperlinks, and using anchors to navigate within a web page\
    \ or to external resources. In this section, we'll explore how to use these elements\
    \ to enhance the structure and interactivity of your web pages.\n\n# Unordered\
    \ Lists (<ul>) and List Items (<li>)\n\nUnordered lists are created using the\
    \ <ul> element, and list items within the list are defined using the <li> element.\
    \ Unordered lists are typically used for items without a specific order, such\
    \ as bullet-point lists.\n\n```\n<ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n\
    \  <li>Item 3</li>\n</ul>\n```\n\n# Ordered Lists (<ol>) and List Items (<li>)\n\
    \nOrdered lists are similar to unordered lists but are used for items with a specific\
    \ order or sequence. They are created using the <ol> element.\n\n```\n<ol>\n \
    \ <li>Step 1</li>\n  <li>Step 2</li>\n  <li>Step 3</li>\n</ol>\n```\n\n# Nested\
    \ Lists"
  merge: -1
  pgno: 53
- img_proc: false
  md: "You can nest lists within other lists to create more complex structures. For\
    \ example, you can create a nested unordered list within an ordered list:\n\n\
    ```\n<ol>\n  <li>Main item 1</li>\n  <li>Main item 2\n    <ul>\n      <li>Subitem\
    \ 1</li>\n      <li>Subitem 2</li>\n    </ul>\n  </li>\n  <li>Main item 3</li>\n\
    </ol>\n```\n\n# Hyperlinks (<a>)\n\nHyperlinks, defined using the <a> (anchor)\
    \ element, allow you to link to other web pages, resources, or sections within\
    \ the same page. You specify the link’s destination using the href attribute.\n\
    \n```\n<a href=\"https://www.example.com\">Visit Example.com</a>\n```\n\n# Anchor\
    \ Links\n\nTo create internal links within the same page, you can use anchor links.\
    \ These links reference an element on the page by its id attribute. Anchor links\
    \ are useful for creating navigation menus or linking to specific sections of\
    \ a long web page.\n\n```\n<!-- Creating an anchor link -->\n<a href=\"#section1\"\
    >Jump to Section 1</a>\n```"
