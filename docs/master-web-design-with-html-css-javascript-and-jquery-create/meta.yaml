  md: "# Section 2.1: Introduction to HTML Markup\n\nHTML (Hypertext Markup Language)\
    \ is the foundational language of the web. It provides the structure and content\
    \ for web pages, allowing you to define headings, paragraphs, links, images, forms,\
    \ and more. In this section, we'll delve into the basics of HTML markup and how\
    \ it forms the building blocks of web content.\n\n# HTML Document Structure\n\n\
    An HTML document follows a hierarchical structure. It typically consists of the\
    \ following elements:\n\n```\n<!DOCTYPE html>\n<head>\n  <!-- Metadata, such as\
    \ the page title and character set -->\n  <meta charset=\"UTF-8\">\n  <title>My\
    \ Web Page</title>\n</head>\n<body>\n  <!-- Content of the web page -->\n  <header>\n\
    \    <h1>Welcome to My Web Page</h1>\n  </header>\n  <nav>\n    <ul>\n      <li><a\
    \ href=\"#section1\">Section 1</a></li>\n      <li><a href=\"#section2\">Section\
    \ 2</a></li>\n      <!-- More navigation links -->\n    </ul>\n  </nav>\n</body>\n\
    ```"
  merge: -1
  pgno: 42
- img_proc: false
  md: "```\n</ul>\n</nav>\n<main>\n<section id=\"section1\">\n  <h2>Section 1</h2>\n\
    \  <p>This is the content of Section 1.</p>\n</section>\n<section id=\"section2\"\
    >\n  <h2>Section 2</h2>\n  <p>This is the content of Section 2.</p>\n</section>\n\
    <!-- More sections and content -->\n</main>\n<footer>\n  <p>&copy; 2023 My Web\
    \ Page</p>\n</footer>\n</body>\n</html>\n```\n\n+   * <!DOCTYPE html>: This declaration\
    \ defines the document type and version of HTML being used (HTML5 in this case).\n\
    * <html>: The root element that encloses the entire HTML document.\n* <head>:\
    \ Contains metadata about the document, including the page title and character\
    \ set.\n* <body>: Houses the visible content of the web page, including headings,\
    \ paragraphs, navigation, and more.\n\n# HTML Elements and Tags"
  merge: -1
  pgno: 43
- img_proc: false
  md: 'HTML consists of elements, which are enclosed by tags.

    Tags are typically written in pairs: an opening tag and a closing tag. Here are
    some commonly used HTML elements:


    +   - <h1>, <h2>, <h3>, <h6>: Headings of different levels, where <h1> is the
    highest level and <h6> is the lowest.

    - <p>: Defines a paragraph of text.

    - <a>: Creates hyperlinks to other web pages or resources.

    - <ul>: Defines an unordered (bulleted) list.

    - <ol>: Defines an ordered (numbered) list.

    - <li>: Represents a list item within <ul> or <ol>.


    # Adding Attributes


    HTML elements often include attributes that provide additional information or
    settings. For example:


    ```

    <a href="https://www.example.com" target="_blank">Visit Example.com/<a></a>

    ```


    +   - href: Specifies the destination URL for the hyperlink.

    - target="_blank": Opens the link in a new browser tab or window.


    # Nesting Elements


    HTML elements can be nested within one another to create complex structures. For
    instance:


    ```

    <ul>

    <li>Item 1</li>

    <li>Item 2</li>

    <li>Item 3</li>

    </ul>

    ```


    Here, the <ul> element contains three <li> elements to create a bulleted list.'
  merge: -1
  pgno: 44
