  md: "```\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Web Page</title>\n<script>\n\
    \  // Your JavaScript code here\n  alert('Hello, World!');\n</script>\n</head>\n\
    <body>\n  <!-- Content of your web page -->\n</body>\n</html>\n```\n\nPlacing\
    \ scripts in the <head> section is common for scripts that need to run before\
    \ the page content is loaded.\n\n+   2. **External JavaScript:** For larger scripts\
