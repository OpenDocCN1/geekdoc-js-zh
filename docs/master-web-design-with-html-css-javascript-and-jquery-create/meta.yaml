  md: 'Logical operators allow you to perform logical operations on Boolean values.
    JavaScript has three primary logical operators:


    +   - **Logical AND (&&)**: Returns true if both operands are true.

    - **Logical OR (||)**: Returns true if at least one operand is true.

    - **Logical NOT (!)**: Inverts the value of the operand (if true, becomes false,
    and vice versa).


    Here''s how logical operators work:


    ```

    var isTrue = true;

    var isFalse = false;

    var andResult = isTrue && isFalse; // Logical AND

    orResult = isTrue || isFalse; // Logical OR

    notResult = !isTrue; // Logical NOT


    console.log(andResult, orResult, notResult);

    ```


    # Conditional (Ternary) Operator


    The conditional operator (? :) is a shorthand way to write simple conditional
    statements. It allows you to specify a condition and two possible outcomes. If
    the condition is true, the first expression is evaluated; otherwise, the second
    expression is evaluated.


    Here''s an example:


    ```

    var age = 18;

    var canVote = age >= 18 ? ''Yes'' : ''No'';


    console.log(''Can vote:'', canVote);

    ```'
