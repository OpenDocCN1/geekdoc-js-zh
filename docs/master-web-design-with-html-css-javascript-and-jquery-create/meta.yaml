  md: "# # Section 10.2: Media Queries for Different Devices\n\nMedia queries are\
    \ a fundamental aspect of responsive web design. They enable you to apply specific\
    \ CSS rules based on the characteristics of the device or viewport. In Section\
    \ 10.1, we introduced the concept of media queries. Now, we'll dive deeper into\
    \ how to use them effectively to target different devices.\n\n# ## Basic Syntax\
    \ of Media Queries\n\nMedia queries use the @media rule in CSS to define conditions\
    \ for applying styles. The basic syntax looks like this:\n\n```\n@media (condition)\
    \ {\n  /* CSS rules to apply when the condition is met */\n}\n```\n\nHere, condition\
    \ specifies the criteria for when the styles inside the media query should be\
    \ applied. For responsive design, you'll most commonly use conditions based on\
    \ the viewport width, height, or orientation.\n\n# ## Targeting Different Screen\
    \ Widths\n\nOne of the most common uses of media queries is to create responsive\
    \ layouts that adapt to various screen widths. For example, you can define different\
    \ styles for small screens (e.g., smartphones), medium screens (e.g., tablets),\
    \ and large screens (e.g., desktops).\n\n```\n/* Styles for small screens (less\
    \ than 768px wide) */\n@media (max-width: 768px) {\n  /* CSS rules for small screens\
    \ */\n}\n```"
  merge: -1
  pgno: 207
- img_proc: false
  md: "```\n/* Styles for medium screens (between 768px and 1024px wide) */\nmedia\
    \ (min-width: 769px) and (max-width: 1024px) {\n  /* CSS rules for medium screens\
    \ */\n}\n```\n\n```\n/* Styles for large screens (greater than 1024px wide) */\n\
    media (min-width: 1025px) {\n  /* CSS rules for large screens */\n}\n```\n\n#\
    \ Orientation-Based Media Queries\n\nYou can also use media queries to apply styles\
    \ based on the orientation of the device. For instance, you may want to adjust\
    \ styles when a device switches from portrait to landscape mode.\n\n```\n/* Styles\
    \ for devices in portrait mode */\nmedia (orientation: portrait) {\n  /* CSS rules\
    \ for portrait orientation */\n}\n```\n\n```\n/* Styles for devices in landscape\
    \ mode */\nmedia (orientation: landscape) {\n  /* CSS rules for landscape orientation\
    \ */\n}\n```\n\n# High-Resolution Displays\n\nTo optimize your website for high-resolution\
    \ screens like Retina displays, you can use media queries to serve higher-"
