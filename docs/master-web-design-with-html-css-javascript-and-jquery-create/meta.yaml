    # RemoveChild


    To remove an element from the DOM, you can use the removeChild method on its parent
    node.


    ```

    var elementToRemove = document.getElementById(''toBeRemoved'');

    var parent = elementToRemove.parentNode;

    ```


    ```

    // Remove the element

    parent.removeChild(elementToRemove);

