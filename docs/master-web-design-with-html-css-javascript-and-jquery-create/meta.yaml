  md: '# Section 11.3: CSS Grid Systems


    CSS grid systems are a fundamental part of web design, enabling the creation of
    flexible and responsive layouts. In this section, we will delve into CSS grid
    systems, how they work, and how you can utilize them in your web development projects.


    # Understanding CSS Grid


    CSS Grid is a layout system that allows you to divide a web page into grid of
    rows and columns, making it easy to arrange content. It provides precise control
    over the placement and sizing of elements within the grid, making it a powerful
    tool for responsive web design.


    To create a grid container, you can use the display: grid; property in CSS. For
    example:


    ```

    .grid-container {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    grid-gap: 20px;

    }

    ```


    In this example, we''ve created a grid container with three columns of equal width
    and a gap of 20 pixels between grid items.


    # Defining Grid Rows and Columns


    You can define the rows and columns of your grid using various properties like
    grid-template-columns and grid-template-rows. These properties allow you to specify
    the size and behavior of the grid tracks.'
  merge: -1
  pgno: 230
- img_proc: false
  md: "```\n.grid-container {\n  display: grid;\n  grid-template-columns: repeat(3,\
    \ 1fr);\n  grid-template-rows: 100px 200px;\n}\n```\n\nHere's an example of defining\
    \ a grid with two rows and three columns:\n\nIn this example, we have two rows\
    \ with heights of 100 pixels and 200 pixels, respectively.\n\n# Placing Grid Items\n\
    \nTo place items within the grid, you can use the grid-column and grid-row properties.\
    \ For example:\n\n```\n.grid-item {\n  grid-column: 2 / 4; /* Start at column\
    \ 2 and end at column 4 */\n  grid-row: 1 / span 2; /* Start at row 1 and span\
    \ 2 rows */\n}\n```\n\nThis code places a grid item that starts at the second\
    \ column and ends at the fourth column, while spanning two rows.\n\n# Grid Item\
    \ Auto Placement\n\nCSS Grid also supports automatic placement of grid items using\
    \ the grid-auto-flow property. By default, it places items in rows, but you can\
    \ change this behavior to columns if needed.\n\n```\n.grid-container {\n  display:\
    \ grid;\n  grid-template-columns: repeat(3, 1fr);\n}\n```"
  merge: -1
  pgno: 231
