  md: '# # Local Storage


    Local storage is a client-side storage mechanism that allows you to store key-value
    pairs in the user’s browser. Unlike cookies, local storage has a larger capacity
    (typically around 5-10MB per domain) and is not sent to the server with every
    HTTP request, making it suitable for storing user preferences and application
    data.


    # ## Storing and Retrieving Data


    You can use the localStorage object to store and retrieve data in local storage.
    Data is stored as strings, so you will need to convert objects to JSON and back
    when working with complex data types.


    // Storing data in local storage


    ```

    localStorage.setItem(''username'', ''John'');

    localStorage.setItem(''age'', ''30'');

    ```


    // Retrieving data from local storage


    ```

    var username = localStorage.getItem(''username'');

    var age = localStorage.getItem(''age'');

    ```


    # ## Removing Data


    To remove data from local storage, you can use the removeItem method to delete
    a specific key-value pair or the clear method to delete all data for the current
    domain.


    // Remove a specific item


    ```

    localStorage.removeItem(''username'');

    ```


    // Clear all data for the current domain


    ```

    localStorage.clear();

    ```'
  merge: -1
  pgno: 159
- img_proc: false
  md: '# Choosing Between Cookies and Local Storage


    When deciding between cookies and local storage, consider the following:


    +   * **Purpose**: Cookies are often used for authentication and server-side tracking,
    while local storage is more suitable for client-side data storage and preferences.

    * **Storage Limit**: Cookies have a smaller storage limit (typically around 4KB
    per cookie) compared to local storage.

    * **Security**: Local storage is more secure because data is not sent to the server
    with every request, reducing the risk of data interception.

    * **Expiration**: Cookies can have an expiration date, while data in local storage
    can persist indefinitely.


    Understanding when and how to use cookies and local storage is crucial for building
    web applications that offer a seamless and personalized user experience. Each
    storage mechanism has its advantages and limitations, and the choice depends on
    your specific use case and requirements.'
  merge: -1
  pgno: 160
