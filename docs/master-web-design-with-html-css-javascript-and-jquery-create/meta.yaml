    # Modifying CSS Styles


    JavaScript can also be used to modify CSS styles, enabling dynamic styling of
    web pages. Here are some techniques for changing CSS styles using JavaScript:


    # Style Property


    The style property of an element allows you to access and modify its inline style
    directly.


    ```

    var element = document.getElementById(''myElement'');

    ```


    ```

    // Change the background color

    element.style.backgroundColor = ''blue'';

    ```'
