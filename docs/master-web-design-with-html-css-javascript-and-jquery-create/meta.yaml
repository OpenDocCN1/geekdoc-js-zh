  md: '# # Section 5.3: Operators and Expressions in JavaScript


    Operators and expressions in JavaScript allow you to perform various operations
    on data, make comparisons, and evaluate conditions. Understanding these concepts
    is crucial for writing dynamic and interactive scripts. In this section, we''ll
    explore the different types of operators and how to use them in JavaScript.


    # ## Arithmetic Operators


    JavaScript provides arithmetic operators for performing basic mathematical operations:


    +   - **Addition (+):** Adds two values together.

    - **Subtraction (-):** Subtracts the right operand from the left operand.

    - **Multiplication (*):** Multiplies two values.

    - **Division (/):** Divides the left operand by the right operand.

    - **Modulus (%):** Returns the remainder when the left operand is divided by the
    right operand.


    Here are some examples of arithmetic operations:


    ```

    var num1 = 10;

    var num2 = 5;


    var sum = num1 + num2; // Addition

    var difference = num1 - num2; // Subtraction

    var product = num1 * num2; // Multiplication

    var quotient = num1 / num2; // Division

    var remainder = num1 % num2; // Modulus

    ```'
  merge: -1
  pgno: 117
- img_proc: false
  md: '```

    console.log(sum, difference, product, quotient, remainder);

    ```


    # Comparison Operators


    Comparison operators are used to compare two values and return a Boolean result
    (true or false). Common comparison operators include:


    +   - **Equal to (=):** Checks if two values are equal.

    - **Not equal to (!):** Checks if two values are not equal.

    - **Greater than (>):** Checks if the left operand is greater than the right operand.

    - **Less than (<):** Checks if the left operand is less than the right operand.

    - **Greater than or equal to (>=):** Checks if the left operand is greater than
    or equal to the right operand.

    - **Less than or equal to (<=):** Checks if the left operand is less than or equal
    to the right operand.


    Here''s how comparison operators are used:


    ```

    var x = 5;

    var y = 10;

    var isEqual = x == y; // Equal to

    varNotEqual = x != y; // Not equal to

    varGreaterThan = x > y; // Greater than

    varLessThan = x < y; // Less than

    varGreaterOrEqual = x >= y; // Greater than or equal to

    varLessOrEqual = x <= y; // Less than or equal to

    ```


    ```

    console.log(isEqual, isNotEqual, isGreaterThan, isLessThan, isGreaterOrEqual,
    isLessOrEqual);

    ```


    # Logical Operators'
