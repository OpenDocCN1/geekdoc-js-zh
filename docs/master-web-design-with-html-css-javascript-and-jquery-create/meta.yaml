  md: "# Section 2.2: Document Structure with HTML5\n\nHTML5 introduced a set of semantic\
    \ elements that provide more meaningful and structured ways to define the content\
    \ and layout of web pages. In this section, we'll explore some of the key HTML5\
    \ semantic elements and their roles in structuring web documents.\n\n# The Importance\
    \ of Semantic Elements\n\nSemantic elements are tags that carry meaning about\
    \ the content they enclose. They help both browsers and developers understand\
    \ the purpose and context of various parts of a web page. Using semantic elements\
    \ improves the accessibility, SEO, and maintainability of your web pages.\n\n\
    # Header and Footer\n\nThe <header> and <footer> elements define the header and\
    \ footer sections of a web page, respectively. These sections often contain information\
    \ such as logos, navigation menus, copyright notices, and contact details.\n\n\
    ```\n<header>\n<h1>My Website</h1>\n<nav>\n  <ul>\n    <li><a href=\"#\">Home</a></li>\n\
    \    <li><a href=\"#about\">About</a></li>\n    <!-- More navigation links -->\n\
    \  </ul>\n</nav>\n</header>\n```"
  merge: -1
  pgno: 46
- img_proc: false
  md: "# Navigation\n\nThe <nav> element is used to define navigation menus, making\
    \ it easier for screen readers and search engines to identify and interpret navigation\
    \ links.\n\n```\n<nav>\n<ul>\n  <li><a href=\"#home\">Home</a></li>\n  <li><a\
    \ href=\"#about\">About</a></li>\n  <!-- More navigation links -->\n</ul>\n</nav>\n\
    ```\n\n# Main Content\n\nThe <main> element represents the main content of a web\
    \ page. Each page should have only one <main> element, and it should encapsulate\
    \ the primary content of the page.\n\n```\n<main>\n  <article>\n    <h1>Welcome\
    \ to Our Blog</h1>\n    <h2>Article Title...</h2>\n    <p>Article content goes\
    \ here...</p>\n  </article>\n  <!-- More articles or content -->\n</main>\n```"
  merge: -1
