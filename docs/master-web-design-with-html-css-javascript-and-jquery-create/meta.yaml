  md: '# Section 2.3: Working with Headings, Paragraphs, and Text


    Headings, paragraphs, and text are fundamental elements in HTML that allow you
    to structure and convey content effectively. In this section, we''ll explore how
    to work with these elements to create well-organized and readable web pages.


    # Headings


    HTML provides six levels of headings, from `<h1>` (the highest level) to `<h6>`
    (the lowest level). Headings are used to define the hierarchy and structure of
    content on a page.


    ```

    <h1>Main Heading</h1>

    ```


    ```

    <h2>Subheading 1</h2>

    ```


    ```

    <p>Paragraph of text here...</p>

    ```


    ```

    <h2>Subheading 2</h2>

    ```


    ```

    <p>Another paragraph of text...</p>

    ```


    +   * Use `<h1>` for the main title or heading of your page.

    * Use lower-level headings (e.g., `<h2>`, `<h3>`) for subsections within your
    content.

    * Avoid skipping heading levels (e.g., jumping from `<h2>` to `<h4>`), as it can
    lead to confusion for both users and search engines.


    # Paragraphs


    The `<p>` element is used to define paragraphs of text. It automatically adds
    spacing between paragraphs for better readability.


    ```

    <p>This is a paragraph of text. It can contain multiple sentences and provide
    information or context.</p>

    ```'
  merge: -1
  pgno: 50
- img_proc: false
  md: '<p>Another paragraph follows, creating separation and clarity in the content.</p>


    +   - Always use <p> elements for text paragraphs to maintain proper structure
    and formatting.

    - Avoid multiple <br> (line break) tags to create paragraphs, as it is not semantically
    correct.


    # Text Formatting


    HTML provides several elements to format and emphasize text:


    +   - <em>(emphasis): Renders text in italics, typically used to convey subtle
    emphasis.

    <p>This is <em>important</em> information.</p>

    - <strong>: Renders text in bold, indicating strong emphasis or importance.

    <p><strong>Warning:</strong> This action cannot be undone.</p>

    - <mark>: Highlights text with a background color, useful for indicating search
    results or specific terms.

    <p>Search for <mark>web design</mark> courses.</p>

    - <abbr>(abbreviation): Defines an abbreviation or acronym, providing a tooltip
    for the full expansion.

    <p><abbr title="World Wide Web">WWW</abbr> is an essential part of the internet.</p>

    - <code>: Renders text as code, suitable for displaying programming code or commands.

    <p>To print a message in Python, use <code>print("Hello, World!")</code>.</p>

    - <blockquote>: Indicates a block of text that is a quotation from another source.
    It is often styled with indentation or other formatting.

    <blockquote>

    <p>It does not matter how slowly you go as long as you do not stop.</p></blockquote>'
  merge: -1
