    # DOM Tree Structure


    The DOM is structured as a tree, with the HTML document’s root at the top. Each
    element in the document, including the HTML element, is represented as a node
    in the tree. The relationships between elements are represented by parent-child
    relationships in the tree structure.


    Here’s a simplified example of a DOM tree for an HTML document:


    ```

    <!DOCTYPE html>

    <html>

