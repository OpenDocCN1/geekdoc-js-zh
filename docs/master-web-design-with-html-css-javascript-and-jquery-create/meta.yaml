    # Cascading and Specificity


    The “C” in CSS stands for “cascading,” which refers to the order in which styles
    are applied when there are conflicting rules. CSS rules can have different levels
    of specificity, and more specific rules override less specific ones. Understanding
    specificity is crucial for resolving styling conflicts.


    # Inheritance


    CSS styles can be inherited from parent elements to their children. For example,
    if you set a font style on a <div>, it may apply to all the text within that <div>
    and its child elements, unless overridden by more specific styles.'
