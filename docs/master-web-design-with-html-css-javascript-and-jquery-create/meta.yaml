  md: '# Section 3.2: Selectors and Style Rules


    Selectors and style rules are fundamental concepts in CSS that allow you to target
    specific HTML elements and apply styles to them. In this section, we''ll explore
    different types of selectors and how to create style rules to customize the appearance
    of your web pages.


    # CSS Selectors


    Selectors are patterns that identify which HTML elements to style. CSS provides
    various types of selectors to target elements based on different criteria:


    # 1. Element Selector


    An element selector targets all instances of a specific HTML element. For example,
    to select all <p> (paragraph) elements:


    ```

    /* Styles applied to all paragraphs */

    font-size: 16px;

    color: #333;


    ```


    # 2. Class Selector


    A class selector selects elements with a specific class attribute. You define
    the class in your HTML and apply it to one or more elements. Class selectors are
    prefixed with a dot (.).


    ```

    <!-- HTML -->

    <p class="highlight">This paragraph has a class.</p>

    ```'
