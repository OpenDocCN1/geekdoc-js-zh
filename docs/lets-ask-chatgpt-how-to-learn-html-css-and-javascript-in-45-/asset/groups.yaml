    \ right and left.\n\nPadding: The padding is the space between the content and\
    \ the border. It provides internal spacing within the element. You can set different\
    \ values for each side of an element (top, right, bottom, left) using the padding\
    \ property.\n\nExample of setting padding:\n```css\ndiv {\n  padding-top: 10px;\n\
    \  padding-right: 20px;\n  padding-bottom: 10px;\n  padding-left: 20px;\n}\n```\n\
    Check Resource file: chapter-6-02.css\n\nIn this example, we set different padding\
