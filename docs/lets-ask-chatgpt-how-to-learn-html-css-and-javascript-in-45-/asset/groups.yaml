    \n这些只是 JavaScript 如何在 HTML 文档中使用以添加交互性和动态行为的少数示例。JavaScript 是一门多功能的编程语言，具有许多更多的特性和能力，我们将在接下来的章节中进行探索。\n\
    \n### 带有返回值的示例：\n\n```javascript\nfunction add(a, b) {\n  return a + b;\n}\n```\n\
    \n在此示例中，`add` 函数接收两个参数 `a` 和 `b`，并返回它们的和。\n\n## 箭头函数\n\n箭头函数是编写 JavaScript 函数的简洁语法。它们提供了一种更紧凑的方式来定义函数。\n\
    \n### 箭头函数的示例：\n\n```javascript\nconst square = (num) => num * num;\n```\n\n在此示例中，`square`\
