    \ `padding` 属性为元素的每个侧（上、右、下、左）设置不同的值。\n\n设置内边距的示例：\n```css\ndiv {\n  padding-top:\
    \ 10px;\n  padding-right: 20px;\n  padding-bottom: 10px;\n  padding-left: 20px;\n\
    }\n```\n检查资源文件：chapter-6-02.css\n\n在此示例中，我们为 `<div>` 的每个侧设置了不同的内边距值，在顶部和底部创建了\
