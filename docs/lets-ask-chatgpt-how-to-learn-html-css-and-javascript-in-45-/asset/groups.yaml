    \ border. For the secondary button, we set the background color to #f8f9fa, color\
    \ to #333, and add a 1px solid #ccc border.\n\n## Example 3: Building a Responsive\
    \ Gallery\n\nA responsive gallery allows images to adapt to different screen sizes.\
    \ Let's create a gallery using HTML and CSS.\n\n### HTML Markup:\n\n```html\n\
    <div class=\"gallery\">\n  <img src=\"image1.jpg\" alt=\"Image 1\">\n  <img src=\"\
