    \n设置框的示例：\n```css\ndiv {\n  border-width: 2px;\n  border-style: solid;\n  border-color:\
    \ black;\n}\n```\n检查资源文件：chapter-6-03.css\n\n在此示例中，我们为 `<div>` 设置了 2 像素的框宽、实线框样式和黑色的框颜色。这将在元素周围创建一个实线框。\n\
    \n# 盒尺寸 (Box Sizing)\n\n`box-sizing` 属性允许你控制元素宽度高度的计算方式。默认情况下，元素的宽度高度包含内容、内边距和框。然而，通过\
    \ `box-sizing` 属性，你可以更改这种行为。\n\n`box-sizing` 属性有两个可能的值：\n\n- **content-box**：这是默认值，宽度和高度只包含内容。内边距和框会被加上宽度和高度。\n\
