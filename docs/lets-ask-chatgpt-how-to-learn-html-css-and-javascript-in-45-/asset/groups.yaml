    \ bottom and a 20-pixel padding on the right and left.\n\nBorder: The border is\
    \ a line that surrounds the padding and content. It can have a thickness, style,\
    \ and color defined using the border property.\n\nExample of setting borders:\n\
    ```css\ndiv {\n  border-width: 2px;\n  border-style: solid;\n  border-color: black;\n\
    }\n```\nCheck Resource file: chapter-6-03.css\n\nIn this example, we set the border\
    \ width to 2 pixels, the border style to solid, and the border color to black\
    \ for the <div>. This will create a solid border around the element.\n\n# Box\
    \ Sizing\n\nThe box-sizing property allows you to control how the width and height\
    \ of an element are calculated. By default, the width and height of an element\
    \ include the content, padding, and border. However, with the box-sizing property,\
    \ you can change this behavior.\n\nThe box-sizing property has two possible values:\n\
    \n- **content-box**: This is the default value, where the width and height include\
    \ only the content. The padding and border are added to the width and height.\n\
    - **border-box**: With this value, the width and height include the content, padding,\
    \ and border. The padding and border are subtracted from the width and height.\n\
    \nExample of setting box-sizing:\n```css\ndiv {\n  box-sizing: border-box;\n}\n\
    ```\nCheck Resource file: chapter-6-04.css\n\nIn this example, we set the box-sizing\
