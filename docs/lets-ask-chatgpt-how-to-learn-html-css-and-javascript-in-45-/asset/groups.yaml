- md: "\n## CHAPTER 10: JAVASCRIPT CONDITIONALS\n\nIn this chapter, we will delve\
    \ into JavaScript conditionals, which allow us to make decisions and execute different\
    \ blocks of code based on certain conditions. Conditionals are an essential part\
    \ of programming and enable us to create dynamic and responsive applications.\
    \ We will explore if statements, comparison operators, logical operators, and\
    \ demonstrate how to implement conditional statements in JavaScript with the help\
    \ of ChatGPT. By providing detailed explanations and coding examples, we aim to\
    \ enhance your understanding and proficiency in utilizing conditionals effectively.\n\
    \n## If Statements\n\nThe if statement is the most basic form of conditional statement\
    \ in JavaScript. It allows us to check a condition and execute a block of code\
    \ only if the condition is true.\n\nHere's the syntax for an if statement:\n\n\
    ```javascript\nif (condition) {\n  // Code to execute if the condition is true\n\
    }\n```\n\nThe condition is an expression that evaluates to either true or false.\
    \ If the condition is true, the code block enclosed in curly braces will be executed.\
    \ If the condition is false, the code block will be skipped.\n\n## Here's an example\
    \ of an if statement:\n\n```javascript\nlet num = 10;\nif (num > 0) {\n  console.log(\"\
    The number is positive.\");\n}\n```\n\nIn this example, we check if the value\
    \ of the variable num is greater than 0. If the condition is true, the message\
    \ \"The number is positive.\" will be logged to the console.\n\n## Comparison\
    \ Operators\n\nComparison operators are used within conditionals to compare values\
    \ and evaluate conditions. JavaScript provides several comparison operators, including:\n\
    \n- > (greater than)\n- < (less than)\n- >= (greater than or equal to)\n- <= (less\
    \ than or equal to)\n- === (strict equality)\n- != (strict inequality)\n\nThese\
    \ operators allow us to compare numbers, strings, or other data types based on\
    \ their values. The result of a comparison operation is a Boolean value (true\
    \ or false).\n\n## Here are some examples of comparison operators:\n\n```javascript\n\
    let a = 5;\nlet b = 10;\nconsole.log(a > b); // false\nconsole.log(a < b); //\
    \ true\nconsole.log(a === b); // false\nconsole.log(a != b); // true\n```\n\n\
    In these examples, we compare the values of the variables a and b using different\
    \ comparison operators. The expressions evaluate to either true or false based\
    \ on the comparison result.\n\n## Logical Operators\n\nLogical operators are used\
    \ to combine multiple conditions within a conditional statement. JavaScript provides\
    \ three logical operators: && (AND), || (OR), and ! (NOT).\n\n- The && operator\
    \ returns true if both conditions are true.\n- The || operator returns true if\
    \ at least one of the conditions is true.\n- The ! operator negates the result\
    \ of a condition.\n\n## Here's an example that demonstrates the usage of logical\
    \ operators:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>JavaScript Example</title>\n\
    <script>\n  let num = 15;\n\n  if (num > 0 && num < 20) {\n    console.log(\"\
    The number is between 0 and 20.\");\n  }\n\n  if (num < 0 || num > 100) {\n  \
    \  console.log(\"The number is either negative or greater than 100.\");\n  }\n\
    \  if (!(num === 0)) {\n    console.log(\"The number is not zero.\");\n  }\n</script>\n\
    </head>\n<body>\n</body>\n</html>\n```\n\n## Check Resource file: chapter-10-01.html\n\
    \nIn this example, we use the && operator to check if the number is between 0\
    \ and 20. The || operator is used to check if the number is either negative or\
    \ greater than 100. The ! operator is used to negate the condition that checks\
    \ if the number is zero.\n\n## Coding with ChatGPT: Implementing Conditional Statements\
    \ in JavaScript\n\nNow let's explore some coding examples and implement conditional\
    \ statements in JavaScript. ChatGPT will provide detailed explanations and coding\
    \ examples to help you understand and utilize conditionals effectively.\n\n##\
    \ Example 1: Checking the Grade\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>JavaScript Example</title>\n  <script>\n  let score = 85;\n  let grade;\n\
    \  if (score >= 90) {\n    grade = \"A\";\n  } else if (score >= 80) {\n    grade\
    \ = \"B\";\n  } else if (score >= 70) {\n    grade = \"C\";\n  } else if (score\
    \ >= 60) {\n    grade = \"D\";\n  } else {\n    grade = \"F\";\n  }\n  console.log(\"\
    Your grade is:\", grade);\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\
    \nCheck Resource file: chapter-10-02.html\n\nIn this example, we have a score\
    \ variable representing a student's test score. We use conditional statements\
    \ to determine the corresponding grade based on the score. if and else if statements\
    \ check the score against different ranges and assign the appropriate grade. Finally,\
    \ we log the grade to the console.\n\n## Example 2: Checking the Login Credentials\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>JavaScript Example</title>\n\
    <script>\nlet username = \"admin\";\nlet password = \"password123\";\n\nif (username\
    \ === \"admin\" && password === \"password123\") {\n    console.log(\"Login successful.\"\
    );\n} else {\n    console.log(\"Login failed.\");\n}\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\nCheck Resource file: chapter-10-03.html\n\nIn this example,\
    \ we use the && operator to check if both the username and password are correct.\
    \ The else statement allows us to handle the case where the credentials are not\
    \ met.\n"
  mdcn: "\n\n## 第 10 章：JAVASCRIPT 条件语句\n\n在本章中，我们将深入探讨 JavaScript 条件语句，这些语句允许我们根据某些条件做出决策并执行不同的代码块。条件语句是编程中不可或缺的一部分，使我们能够创建动态且响应的应用程序。我们将探索\
    \ `if` 语句、比较运算符、逻辑运算符，并演示如何在 ChatGPT 的帮助下在 JavaScript 中实现条件语句。通过提供详细的解释和代码示例，旨在增强你对有效使用条件语句的理解和掌握。\n\
    \n## If 语句\n\n`if` 语句是 JavaScript 中基本的条件语句形式。它允许我们检查条件并在仅在条件为真时执行代码块。\n\n以下是 `if`\
    \ 语句的语法：\n\n```javascript\nif (condition) {\n  // 如果条件为真则执行的代码\n}\n```\n\n条件是一个表达式，其结果为\
    \ `true` 或 `false`。如果条件为真，将执行大括号括起来的代码块。如果条件为假，则将跳过该代码块。\n\n## 这是一个 if 语句的示例：\n\
    \n```javascript\nlet num = 10;\nif (num > 0) {\n  console.log(\"The number is\
    \ positive.\");\n}\n```\n\n在这个示例中，我们检查变量 `num` 的值是否大于 0。如果条件为真，控制台将打印消息“The number\
    \ is positive.”。\n\n## 比较运算符\n\n比较运算符用于条件语句内部以比较值并评估条件。JavaScript 提供了几个比较运算符，包括：\n\
    \n- > (大于)\n- < (小于)\n- >= (大于或等于)\n- <= (小于等于)\n- === (严格相等)\n- != (严格不相等)\n\n\
    这些运算符允许我们根据值比较数字、字符串或其他数据类型。比较操作的结果是一个布尔值（`true` 或 `false`）。\n\n## 以下是一些比较运算符的示例：\n\
    \n```javascript\nlet a = 5;\nlet b = 10;\nconsole.log(a > b); // false\nconsole.log(a\
    \ < b); // true\nconsole.log(a === b); // false\nconsole.log(a != b); // true\n\
    ```\n\n在这些示例中，我们使用不同的比较运算符比较变量 `a` 和 `b` 的值。表达式根据比较结果求值为为 `true` 或 `false`。\n\n\
    ## 逻辑运算符\n\n逻辑运算符用于在条件语句中组合多个条件。JavaScript 提供了三个逻辑运算符：`&&` (与)、`||` (或) 和 `!`\
    \ (非)。\n\n- `&&` 运算符在两个条件都为真时返回 `true`。\n- `||` 运算符在至少一个条件为真时返回 `true`。\n- `!`\
    \ 运算符对条件的结果取反反。\n\n## 这是一个演示逻辑运算符用法的示例：\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n\
    <title>JavaScript Example</title>\n<script>\n  let num = 15;\n\n  if (num > 0\
    \ && num < 20) {\n    console.log(\"The number is between 0 and 20.\");\n  }\n\
    \n  if (num < 0 || num > 100) {\n    console.log(\"The number is either negative\
    \ or greater than 100.\");\n  }\n  if (!(num === 0)) {\n    console.log(\"The\
    \ number is not zero.\");\n  }\n</script>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n## 查看资源文件：chapter-10-01.html\n\n在这个示例中，我们使用 `&&` 运算符来检查数字是否在 0 到 20 之间。`||`\
    \ 运算符用于检查数字是否为负或大于 100。`!` 运算符用于对检查数字是否为零的条件取反。\n\n## 使用 ChatGPT编程：在 JavaScript\
    \ 中实现条件语句\n\n现在让我们探索一些代码示例并在 JavaScript 中实现条件语句。ChatGPT 将提供详细的解释和代码示例，帮助你理解并有效利用条件语句。\n\
    \n## 示例 1：检查成绩\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n  <title>JavaScript\
    \ Example</title>\n  <script>\n  let score = 85;\n  let grade;\n  if (score >=\
    \ 90) {\n    grade = \"A\";\n  } else if (score >= 80) {\n    grade = \"B\";\n\
    \  } else if (score >= 70) {\n    grade = \"C\";\n  } else if (score >= 60) {\n\
    \    grade = \"D\";\n  } else {\n    grade = \"F\";\n  }\n  console.log(\"Your\
    \ grade is:\", grade);\n  </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n\
    查看资源文件：chapter-10-02.html\n\n在这个示例中，我们有一个 `score` 变量，代表学生的考试分数。我们使用条件语句根据分数确定相应的等级。`if`\
    \ 和 `else if` 语句检查分数相对于不同的范围并分配相应的等级。最后，我们将等级打印到控制台。\n\n## 示例 2：检查登录凭据\n\n```html\n\
    <!DOCTYPE html>\n<html\n<head>\n  <title>JavaScript Example</title>\n  <script>\n\
    let username = \"admin\";\nlet password = \"password123\";\n\nif (username ===\
    \ \"admin\" && password === \"password123\") {\n    console.log(\"Login successful.\"\
    );\n} else {\n    console.log(\"Login failed.\");\n}\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n查看资源文件：chapter-10-03.html\n\n在这个示例中，我们使用 `&&` 运算符来检查用户名和密码是否正确。`else`\
    \ 语句允许我们处理凭据不符合条件的情况。\n\n"
