    # Understanding the Box Model


    The CSS box model is a representation of how elements are rendered on a webpage.
    It consists of four components: content, padding, border, and margin.


    These components surround an element and contribute to its total width and height.


    +   -Content**: The content area is where the actual content of an element, such
    as text or images, is displayed. It has dimensions defined by the width and height
    properties.


    +   -Padding**: The padding is the space between the content and the border. It
    provides internal spacing within the element. The padding can be set using the
    padding property.'
