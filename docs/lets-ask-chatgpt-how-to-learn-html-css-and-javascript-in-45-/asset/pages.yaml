- img_proc: true
  md: "CSS styles can be applied in two ways: inline styles and external stylesheets.\n\
    \nInline styles are CSS styles applied directly to an individual HTML element\
    \ using the style attribute. Inline styles take precedence over external stylesheets\
    \ and are useful for applying unique styles to specific elements. However, they\
    \ can be less maintainable when multiple elements require the same styles.\n\n\
    External stylesheets are separate CSS files that contain all the styles for a\
    \ website. They are linked to HTML documents using the <link> tag. External stylesheets\
    \ allow for centralized style management, where multiple HTML documents can share\
    \ the same styles. This approach promotes maintainability and reusability.\n\n\
