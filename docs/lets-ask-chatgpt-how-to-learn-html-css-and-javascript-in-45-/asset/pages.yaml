  md: '# CHAPTER 1:


    # INTRODUCTION TO HTML


    What is HTML?


    HTML, which stands for HyperText Markup Language, is the standard markup language
    used for creating web pages and applications. It follows the web to define the
    structure and layout for the content displayed on the web. HTML utilizes tags
    and elements to define the various components of a webpage, such as headings,
    paragraphs, images, links, and more.


    # Basic HTML Structure


    Every HTML document follows a basic structure. It consists of an opening <DOCTYPE>
    declaration, followed by an <html> element, which serves as the root element of
    the document. Inside the <html> element, we have the <head> and <body> elements.
    The <head> element contains meta-information about the document, such as the title
    and link to external stylesheets or scripts. The <body> element contains the actual
    content of the webpage that users see in their browsers.


    # Setting up an HTML Document


    To create an HTML document, you can start by opening a plain text editor as Notepad
    (on Windows) or TextEdit (on macOS). Begin by declaring the <!DOCTYPE> at the
    very beginning to specify the HTML version. The doctype declaration helps the
    browser understand how to interpret and render the HTML code.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '```

    <!DOCTYPE html>

    <html>

    <head>

    <title>My First Webpage</title>

    </head>

    <body>

    <!-- Content goes here -->

    </body>

    </html>

    ```


    Check Resource file: chapter-1-01.html


    # HTML Tags and Elements


    HTML uses tags and elements to define the structure and presentation of the content.
    Tags are enclosed in angle brackets (<>) and usually come in pairs: an opening
    tag and a closing tag. The opening tag denotes the start of an element, and the
    closing tag indicates its end. Elements can be nested inside one another, creating
    a hierarchical structure.


    Here are some commonly used HTML tags and elements:


    +   - <h1> to <h6>: Heading tags represent different levels of headings, with
    <h1> being the highest and <h6> being the lowest.

    - <p>: The paragraph tag defines a paragraph of text.

    - <a>: The anchor tag creates a hyperlink and is used for linking to other web
    pages or resources.

    - <img>: The image tag is used to embed images in the webpage.'
  merge: -1
  pgno: 12
