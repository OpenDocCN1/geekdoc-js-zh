  ### 将模型绑定到页面元素的指令\n\nAngularJS 模板允许你将作用域（scope）中的数据直接绑定到 HTML 元素显示的内容上。你可以通过几种不同的方式将数据绑定到视图，包括：\n\
  \n![Image](img/00003.jpeg) **值 (Value):** 你可以直接在作用域中表示表单元素的值。例如，文本输入可以是作用域中的一个 `String`\
  \ 变量，但复选框将由 `Boolean` 值表示。\n\n![Image](img/00003.jpeg) **HTML:** 你可以使用如这样的表达式在元素的\
  \ HTML 输出中表示作用域中数据的值：\n\n```html\n<p>{{myTitle}}</p>\n```\n\n![Image](img/00003.jpeg)\
  \ **属性 (Attributes):** 通过在定义中使用表达式，HTML 元素属性的值可以反映作用域中的数据，例如：\n\n点击此处查看代码图片\n\n\
  ```html\n<a ng-href=\"/{{hash}}/index.html\">{{hash}}</a>\n```\n\n![Image](img/00003.jpeg)\
  \ **可见性 (Visibility):** 元素的可见性可以反映视图中的作用域。例如，当基于作用域的表达式为 `true` 时，该元素是可见的；否则，该元素是不可见的。\n\
  \n![Image](img/00003.jpeg) **存在性 (Existence):** 你可以根据作用域中的值，从编译后的 DOM 中省略元素。\n\n\
  表 24.3 列出了将作用域中的数据直接绑定到视图中元素的指令。\n\n![Image](img/00254.jpeg)![Image](img/00255.jpeg)![Image](img/00256.jpeg)![Image](img/00257.jpeg)\n\
  表 24.3 **将作用域中的数据绑定到 HTML 元素的值、表达式、可见性和存在性的指令**\n\n列表 24.3 和 24.4 提供了一些基础 AngularJS\
  \ 绑定指令的示例。列表 24.3 初始化了作用域值，包括第 4 行中的 `myStyle` 对象。列表 24.4 提供了模板中绑定指令的实际实现。\n\n除了极几个例外外，列表\
  \ 24.4 中的模板代码非常直观。第 15 行和 16 行将 `radio` 按钮 `<input>` 绑定到作用域中的 `myStyle['background-color']`\
  \ 属性。这说明了如何处理不允许通常使用的点表示法的样式名称（例如，`myStyle.color`）。还要注意，单选按钮的值在使用 `ng-value` 设置的，以便从\
  \ `ng-repeat` 作用域获取颜色。\n\n另外注意，当使用 `ng-class` 设置类名时，类名 `even` 需要放在单引号中，因为它是一个字符串。图\
  \ 24.2 显示了生成的网页。\n\n列表 24.3 `directive_bind.js`: 实现一个带有作用域模型以支持数据指令的控制器\n\n点击此处查看代码图片\n\
