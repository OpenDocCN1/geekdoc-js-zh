  \ `console.function(parameters)` 调用即可。表 3.3 列出了 `console` 模块中可用的函数。\n\n\n表 3.3 console\
  \ 成员函数\n\n\n本章重点是让你熟悉 Node.js 环境。Node.js 包提供了 Node.js 本身不具备的功能。你可以从 NPM 注册库下载这些模块，也可以创建自己的。`package.json`\
  \ 文件为每个 Node.js 模块提供了配置和定义。\n\n本章示例涵盖了创建、发布和安装 Node.js 包。你学习了如何使用 `npm` 本地模块以及发布到\
  \ NPM 注册库。你还学习了如何安装 Node.js 模块并在自己的应用程序中使用它们。\n\n\n下一章将介绍 Node.js 的事件驱动特性。你将有机会看到事件如何在\
  \ Node.js 环境中工作，以及如何在你的应用程序中控制、操作和使用它们。\n\n\nNode.js 通过其强大的事件驱动模型提供了扩展性和性能。本章重点在于理解该模型，以及它与大多数\
  \ Web 服务器使用的传统线程模型的区别。理解事件模型至关重要，因为它可能会迫使你改变对应用程序的设计思路。但是，为了获得 Node.js 带来的速度提升，这些改变是完全值得的。\n\
  \n\n\n\n## 理解 Node.js 事件模型\n\n\n## 比较事件回调与线程模型\n\n在传统的线程 Web 模型中，请求到达 Web 服务器并被分配给一个可用线程。该请求的任务处理将在该线程上继续，直到请求完成并发送响应为止。\n\
  \n\n![Image](img/00023.jpeg)\n\n\n\n图 4.2 展示了 Node.js 如何处理 `GetFile` 和 `GetData`\
  \ 请求。它将 `GetFile` 和 `GetData` 请求添加到事件队列。它首先获取 `GetFile` 请求并执行它，通过将 `Open()` 回调函数添加到事件队列来完成。然后它获取\
  \ `GetData` 请求并执行它，通过将 `Connect()` 回调函数添加到事件队列来完成。这种过程一直持续直到没有需要执行的回调函数为止。注意在 图\
  \ 4.2 中，每个线程的事件并不一定遵循直接的交错顺序。例如，`Connect` 请求完成的时间比 `Read` 请求长，因此在调用 `Query(db)`\
  \ 之前调用了 `Send(file)`。\n\n\n\n\n\n![Image](img/00003.jpeg) 读取文件\n\n\n![Image](img/00003.jpeg)\
  \ 请求套\n\n\nNode.js 使用事件回调来避免等待阻塞 I/O。因此，任何执行阻塞 I/O 的请求都在后台的另一个线程上执行。Node.js 在后台实现了一个线程池。当从事件队列中检索阻塞\
  \ I/O 的事件时，Node.js 会从线程池中获取一个线程并在那里执行函数，而不是主事件循环线程上执行。这防止了阻塞 I/O 阻塞事件队列中的其他事件。\n\
  \n在阻塞线程上执行的函数仍然可以将事件添加回事件队列进行处理。例如，数据库查询调用通常会传递一个解析结果的回调函数，并可以在发送响应之前在事件队列上调度额外的工作。\n\
  \n\n![Image](img/00025.jpeg)\n\n\n## 对话示例\n\n为了帮助你理解 Node.js 中的事件与传统线程 Web 服务器相比的工作原理，请考虑在派对上与很多人进行不同对话的例子。你充当\
  \ Web 服务器的角色，对话代表了处理不同类型 Web 请求所需的工作。你的对话被分成与不同人的几个片段。你最后和一个人聊天，然后是另一个人。\n\n\n\n\
  \n当有人向你提问，而你需要思考一段时间才能回答时，会发生什么？你可以在在大脑中处理该问题的同时，在派会上与其他人互动。这种处理可能会影响你与他人互动的速度，但在处理这个较长的思维的同时，你仍然能够与几个人交流。这类似于\
  \ Node.js 如何使用后台线程池处理阻塞 I/O 请求。Node.js 将阻塞请求交给线程池中的线程处理，这样它们对应用程序处理事件的影响就会降至最低。\n\
  ## 向事件队列添加工作\n\n在创建 Node.js 应用程序和设计代码时，你需要记住前一节中描述的事件模型。为了利用事件模型的可扩展性和性能，请确保将工作拆分为多个可以作为一系列回调函数（callbacks）执行的块结构。\n\
  当你正确设计了代码后，可以使用事件模型在事件队列上调度工作。在 Node.js 应用程序中，你通过使用以下方法之一传递回调函数，在事件队列上调度工作：\n\n\
  ![Image](img/00003.jpeg) 调用一个阻塞 I/O 库的调用方法，例如写入文件或连接数据库。\n![Image](img/00003.jpeg)\
  \ 为内置事件（如 `http.request` 或 `server.connection`）添加事件监听器。\n\n![Image](img/00003.jpeg)\
  \ 创建自己的事件发射器（event emitters）并向它们添加自定义监听器。\n![Image](img/00003.jpeg) 使用 `process.nextTick`\
  \ 选项调度工作在事件循环的下一个周期中被处理。\n![Image](img/00003.jpeg) 使用定时器（timers）调度在特定时间后或按定期间隔完成的工作。\n\
  \n接下来的章节将讨论定时器、`nextTick` 和自定义事件的实现。它们将让你了解事件机制的工作原理。阻塞的 I/O 调用和内置事件将在后续章节中介绍。\n\
  ### 实现定时器\n\nNode.js 和 JavaScript 的一个有用功能是能够延迟代码执行一段时间。这对于那些你不希望一直运行的清理或刷新工作非常有用。你可以在\
  \ Node.js 中实现三种定时器：超时定时器（timeout）、间隔定时器（interval）和立即定时器（immediate）。接下来的章节将描述每种定时器以及如何在你的代码中实现它们。\n\
  \n#### 使用超时延迟工作\n超时定时器用于延迟工作特定时间。当该时间到期时，回调函数将被执行，定时器将消失。你应该将超时定时器用于只需要执行一次的工作。\n\
  \n你通过使用 Node.js 内置的 `setTimeout(callback, delayMilliSeconds, [args])` 方法创建超时定时器。当你调用\
  \ `setTimeout()` 时，回调函数将在 `delayMilliSeconds` 后执行。例如，以下代码将在一秒后执行 `myFunc()`：\n```javascript\n\
  setTimeout(myFunc, 1000);\n```\n\n`setTimeout()` 函数返回一个定时器对象 ID，你可以在 `delayMilliSeconds`\
  \ 到期之前的任何时候将此 ID 传递给 `clearTimeout(timeoutId)` 以取消超时函数。例如：\n点击查看代码图像\n\n```javascript\n\
  ...\n```\n\nListing 4.1 中的代码实现了一系列简单的超时，它们调用 `simpleTimeout()` 函数，该函数输出自调度超时以来经过的毫秒数。注意，调用\
  \ `setTimeout()` 的顺序并不重要。在图 4.4 中所示的结果将按延迟到期的顺序出现。\nListing 4.1 `simple_timer.js`:\
  \ 在不同间隔上实现一系列超时\n\n点击查看代码图像\n* * *\n```javascript\n01 function simpleTimeout(consoleTimer){\n\
  02    console.timeEnd(consoleTimer);\n04 console.time(\"twoSecond\");\n05 setTimeout(simpleTimeout,\
  \ 2000, \"twoSecond\");\n06 console.time(\"oneSecond\");\n08 console.time(\"fiveSecond\"\
  );\n10 console.time(\"50MilliSecond\");\n11 setTimeout(simpleTimeout, 50, \"50MilliSecond\"\
  );\n```\n* * *\n![Image](img/00026.jpeg)\n图 4.4 `simple_timer.js` 超时函数的输出，使用不同的延迟时间执行。\n\
  #### 使用间隔执行周期性工作\n\n间隔定时器用于在定期延迟间隔上执行工作。当延迟时间到期时，回调函数将被执行，然后重新调度延迟间隔。你应该将间隔定时器用于需要定期执行的工作。\n\
  你通过使用 Node.js 内置的 `setInterval(callback, delayMilliSeconds, [args])` 方法创建间隔定时器。当你调用\
  \ `setInterval()` 时，回调函数将在 `delayMilliSeconds` 到期后每隔间隔执行一次。例如，以下代码每秒执行一次 `myFunc()`：\n\
  \n```javascript\n```\n`setInterval()` 函数返回一个定时器对象 ID，你可以在 `delayMilliSeconds` 到期之前的任何时候将此\
  \ ID 传递给 `clearInterval(intervalId)` 以取消超时函数。例如：\n\n点击查看代码图像\n```javascript\nmyInterval\
  \ = setInterval(myFunc, 100000);\n...\n```\nListing 4.2 中的代码实现了一系列简单的间隔回调，它们在不同间隔上更新变量\
  \ `x`, `y` 和 `z`。由于间隔不同，`x` 的增加比 `y` 快，`y` 的增加比 `z` 快，正如图 4.5 所示。\n\nListing 4.2\
  \ `simple_interval.js`: 在不同间隔上实现一系列间隔回调\n点击查看代码图像\n\n* * *\n```javascript\n02 function\
  \ displayValues(){\n03    console.log(\"X=%d; Y=%d; Z=%d\", x, y, z);\n04 }\n06\
  \    x += 1;\n07 }\n08 function updateY(){\n10 }\n12    z += 1;\n13    displayValues();\n\
