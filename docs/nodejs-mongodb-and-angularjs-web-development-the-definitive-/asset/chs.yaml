  \ `Buffer` 对象上调用 `.length` 来确定缓冲区长度。要确定字符串在缓冲区中所占用的字节长度，不能使用 `.length` 属性。相反，你需要使用\
  \ `Buffer.byteLength(string, [encoding])`。需要注意的是，字符串长度和缓冲区的字节长度之间存在差异。为了说明这一点，请考虑以下语句：\n\
