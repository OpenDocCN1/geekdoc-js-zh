  \ `$scope.location` 的城市参数，并设置将绑定到视图的 `$scope.weather` 值。\n\n`addCity()` 函数使用 `locationIn`\
  \ 将新城市添加到 `cities` 数组中。如果城市已经存在，则不再重复添加。位置将设置为新城市，并调用 `getWeather()` 获取天气数据。\n\n\
