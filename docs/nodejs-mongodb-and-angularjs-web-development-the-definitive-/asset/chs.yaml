  \n图 26.4 渲染后的 `user` 视图允许你编辑和删除用户。\n\n#### 为视图添加 CSS\n\nListing 26.14 显示了用于样式化视图的\
  \ CSS 代码。每个视图都在其头头部链接了 `styles.css` 脚本。\n\nListing 26.4 `styles.css`: 实现视图文件的 CSS\
  \ 样式\n\n点击此处查看代码图片\n\n```css\ndiv.form-container{\n  display: inline-block;\n  border:\
  \ 4px ridge;\n  width: 280px;\n  border-radius: 10px;\n  margin: 10px;\n}\np.form-header{\n\
  \  margin: 0px;\n  font: 24px bold;\n  color: white;\n  background: blue;\n  text-align:center;\n\
  }\nform{\n  margin: 10px;\n}\nlabel{ width: 80px; display: inline-block; }\ninput{\n\
  \  border: 3px ridge;\n  border-radius: 5px;\n  padding: 3px;\n}\ninput[type=submit]{\n\
  \  font: 18px bold;\n  width: 120px;\n  color: white;\n  background: blue;\n  margin-top:\
  \ 15px;\n  margin-left: 85px;\n}\n```\n\n## 实现 AngularJS 模块和控制器\n\n视图完成后，你需要实现 AngularJS\
  \ 控制代码来支持它们。Listing 26.15 实现了支持 `user` 视图的 AngularJS 控制器。控制器和 Web 表单一样非常基础。控制器使用\
  \ `$http` 服务从 `/user/profile` 路由获取用户数据，并作为 `$scope.user` 值提供给 AngularJS 模板。\n\n\
  Listing 26.15 `my_app.js`: 实现 AngularJS 控制器以使用 $http 请求获取用户数据\n\n点击此处查看代码图片\n\n\
  ```javascript\nangular.module('myApp', []).\n  controller('myController', ['$scope',\
  \ '$http',\n    function($scope, $http) {\n      $http.get('/user/profile')\n  \
  \      .success(function(data, status, headers, config) {\n          $scope.user\
  \ = data;\n          $scope.error = \"\";\n        }).\n        error(function(data,\
  \ status, headers, config) {\n        $scope.user = {};\n        $scope.error =\
  \ data;\n      });\n    }]);\n```\n\n### 使用社交媒体账户作为认证源\n\n有时你可能允许用户使用其他认证源来登录你的服务器。`passport`\
  \ NPM 提供了功能，让你实现来自 Google、Facebook 和 Twitter 等社交媒体网站的 `OAuth` 和 `OpenID` 认证方法。\n\
  \n使用这些源实现认证可能会麻烦，但 Passport NPM 提供了钩入 Express 的中间件，并隐藏了大部分复杂性。接下来的章节将引导你通过 Passport\
  \ 实现社交媒体 `OAuth` 和 `OpenID` 源认证的过程。\n\n#### 添加 Passport\n\n在继续之前，你需要将 Passport 添加到你的项目中。你需要使用以下命令安装正确的\
  \ Passport NPM，或者包含项目的 `package.json` 文件：\n\n```bash\nnpm install passport@0.2\n\
  ```\n\n#### 添加认证策略\n\n一旦安装了 `passport` NPM，你就需要定义想要实现的认证策略。认证策略是针对特定源的——因此 Passport\
  \ 为 Google、Facebook、Twitter 等提供了单独的认证策略。\n\n每个认证策略都封装在它自己的 NPM 中，并以 `passport-`\
  \ 为缀。这保持了你的代码库较较小，并易于实现多种策略。例如，以下命令安装了 Google、Facebook 和 Twitter NPM：\n\n点击此处查看代码图片\n\
  \n```bash\nnpm install passport-google-google@0.3.0\nnpm-install passport-facebook-facebook@1.0.3\n\
  npm-install passport-twitter@1.0.2\n```\n\n现在你需要使用 `require()` 加载策略，才能在应用程序中使用它。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar GoogleStrategy = require('passport-google').Strategy;\n\
  ```\n\n然后你需要使用 `use()` 函数将策略添加到 Passport 中间件中。该函数接受认证源的 `Strategy` 对象的新实例。对于 Google，该策略需要一个来自\
  \ Google 网站的应用程序 `returnURL`，以及登录有效的领域（realm）。\n\n例如，以下代码创建了 Google 策略的实例并对其进行了配置：\n\
  \n点击此处查看代码图片\n\n```javascript\npassport.use(new GoogleStrategy({\n  returnURL: 'http://localhost/auth/google/return',\n\
  \  realm: 'http://localhost/'\n},\n  function(identifier, profile, done) {\n   \
  \ process.nextTick(function () {\n      profile.identifier = identifier;\n     \
  \ return done(null, profile);\n    });\n  }\n));\n```\n\n\n\n\n`Strategy` 构造函数接受一个回调函数，该函数会在从\
  \ Google 返回身份信息时执行。你使用此函数将身份信息添加到数据库中，或者在必要时对信息进行处理。上面的示例在下一个 Node.js tick 中将标识符添加到配置中。Google\
  \ 分配的身份标识符将与 Google 用户的 `profile` 一起传递给回调函数。\n\n当回调函数完成后，你调用 `done()` 函数，如果发生错误，则将错误作为第一个参数，并将用户信息作为第二个参数。如果你使用会话，第二个参数将赋值给\
  \ `Request` 对象的 `req.user` 属性。\n\n每个身份源的实现方式略有不同，因此你需要查看 Passport 文档中关于特定源配置的方法。\n\
  \n## 实现应用中间件\n\n你需要通过 `Passport` NPM 包的 `initialize()` 方法在中间件服务中注册 Passport。这配置了\
  \ Passport 策略并将它们钩接到 Express 中间件机制中。例如：\n\n点击此处查看代码图片\n\n```javascript\napp.use(passport.initialize());\n\
  ```\n\n如果你想在会话中存储身份验证，还需要注册 `passport.session()` 中间件。如果你同时使用这两项功能，必须在 `expressSession()`\
  \ 中间件之后执行。例如：\n\n点击此处查看代码图片\n\n```javascript\napp.use(expressSession({ secret: 'SECRET'\
  \ }));\napp.use(passport.initialize());\napp.use(passport.session());\n```\n\n##\
  \ 添加已验证用户的序列化与反序列化\n\n通常，用于身份验证的凭据在登录请求期间传输。登录成功后，用户浏览器中会实现会话 cookie 以验证身份。来自浏览器的后续请求将包含\
  \ `session` cookie，用于验证身份验证。\n\nPassport 会序列化和反序列化从身份源返回的已验证 `User` 对象。你需要指定如何进行序列化。`serializeUser()`\
  \ 和 `deserializeUser()` 方法接受序列化函数。它们接受一个 `user` 对象并对其进行修改并通过 `done()` 方法传递。以下是一个使用序列化方法将\
  \ `user.id` 存储在会话而不是整个 `user` 对象的示例，然后在反序列化中使用 Mongoose 调用 `findByID()` 根据会话中的 ID\
  \ 查找用户：\n\n点击此处查看代码图片\n\n```javascript\npassport.serializeUser(function(user, done)\
  \ {\n  done(null, user.id);\n});\n\npassport.deserializeUser(function(id, done)\
  \ {\n  User.findById(id, function(err, user) {\n    done(err, user);\n  });\n});\n\
  ```\n\n## 实现使用身份验证的路由\n\nPassport 现在已完全配置，你可以准备好在应用程序路由中实现中间件。下一步是向你的身份验证路由添加 `passport.authenticate()`\
  \ 方法。身份验证方法接受身份源作为第一个参数，然后是一个包含 `successRedirect` 和 `failureRedirect` 源的对象。在 Google\
  \ 的情况下，必须进行双重身份验证，如下方的所示：\n\n点击此处查看代码图片\n\n```javascript\napp.get('/auth/google',\n\
  \  passport.authenticate('google'));\n\napp.get('/auth/google/return',\n  passport.authenticate('google',\
  \ {\n    successRedirect: '/info',\n    failureRedirect: '/login' }));\n```\n\n\
  你也可以使用 `req.login()` 方法稍后使用 `user` 对象登录。例如：\n\n点击此处查看代码图片\n\n```javascript\nreq.login(user,\
  \ function(err) {\n  if (err) { return next(err); }\n  return res.redirect('/users/'\
  \ + req.user.username);\n});\n```\n\n你还可以使用 `req.logout()` 方法注销，这会销毁会话。浏览器到身份源（例如\
  \ Google）的实际身份验证并没有终止。你仍然可以访问 gmail.com 并访问你的电子邮件。以下显示了在路由中使用 `logout()`：\n\n点击此处查看代码图片\n\
  \n```javascript\napp.get('/logout', function(req, res){\n  req.logout();\n  res.redirect('/login');\n\
  });\n```\n\n另一个非常有用的方法是 `req.isAuthenticated()` 方法，如果当前会话处于已验证状态，它将返回 `true`。你可以使用此方法重定向到登录。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\napp.get('/login', function(req, res){\n  if(req.isAuthenticated()){\n\
  \    res.redirect('/info');\n  } else {\n    res.render('login', { user: req.user\
  \ });\n  }\n});\n```\n\n## 使用 Google 进行身份验证\n\nListing 26.16 显示了基础知识。使用 Passport\
  \ 实现 Google 的基础如 Listing 26.16 所示。\n\n\n\n\n## Google 认证\n\n```html\n<html\n<head>\n\
  \  <title>Google 认证</title>\n</head>\n<body>\n  <h2>Google 认证</h2>\n  <a href=\"\
  /auth/google\">使用 Google 登录</a>\n</body>\n</html>\n```\n\n列表 26.18 `info.html`：实现\
  \ Google 信息的 EJS-HTML 模板\n\n点击此处查看代码图片\n\n```html\n<!doctype html>\n<html>\n<head>\n\
  \  <title>Google 认证</title>\n</head>\n<body>\n  <h2>Google 认证信息</h2>\n  <p>ID: <%=\
  \ user.identifier %></p>\n  <p>Name: <%= user.displayName %></p>\n  <p>Email: <%=\
  \ user.emails[0].value %></p>\n  <a href=\"/logout\">注销</a>\n</body>\n</html>\n\
  ```\n\n![图片](img/00273.jpeg)\n\n图 26.5 将 Google 作为 Node.js Express 应用程序的认证源。\n\n\
  ## 总结\n在本章中，你看到了在网站中实现用户功能的端到端示例。你设置并配置了 Express 作为 Web 服务器。然后，你连接了 MongoDB，并将其作为\
  \ Mongoose 中定义的 `User` 模式的数据源，以及认证会话的持久化存储。你配置了路由，允许用户注册、登录、更新个人资料和删除账户。AngularJS\
  \ 的实现展示了如何使用 `$http` 服务从服务器获取用户数据。\n\n在本章中，你还学习了如何利用 Passport 模块在你的应用程序中实现如 Google\
  \ 之类的 `OAuth` 和 `OpenID` 认证源。Passport 让为你的应用程序添加一个或多个认证源变得非常简单。\n\n### 下节内容\n在下一章中，你将为网页添加评论部分。在此过程中，你将学习\
  \ Node.js、MongoDB 和 AngularJS 栈中各种组件之间的交互作用。\n\n## 27. 为页面添加评论线程\n本章提供了一个实现完整的 Node.js、MongoDB\
  \ 和 AngularJS 栈的实用示例；在其中，你将学习如何允许用户在网页的一个或多个区域添加嵌套评论。添加评论是许多网站的共同特征，并且涉及一些挑战。\n\n\
  本章中的示例提供了一个单一网页，它允许为整个页面启用评论，也可以为页面上加载的单个照片启用评论。代码基础且易于理解。\n\n此示例中的代码没有包含用户、认证和会话管理，以便于理解；如果你想回顾这些主题，请参阅第\
  \ 26 章，“向你的网站添加用户账户](#part0041.html_ch26)”。不过，此示例包含一个一个小函数，模拟会话中存在用户名，以便让你看到来自多个用户的评论。\n\
  \n## 使用的库\n本章中的项目使用了以下附加 Node.js NPM 模块。你需要将它们安装到项目目录中，以便跟随代码示例：\n\n![图片](img/00003.jpeg)\
  \ `express`：作为项目的主 Web 服务器。\n\n![图片](img/00003.jpeg) `body-parser`：为 POST 请求提供 JSON\
  \ 体支持。\n\n![图片](img/00003.jpeg) `ejs`：用于渲染 HTML 模板。\n\n![图片](img/00003.jpeg) `mongodb`：用于访问\
  \ MongoDB 数据库。\n\n![图片](img/00003.jpeg) `mongoose`：用于提供结构化数据模型。\n\n本章中的代码还需要你拥有\
  \ AngularJS 库。\n\n## 项目目录结构\n项目组织如下目录结构：\n\n![图片](img/00003.jpeg) `.`：项目根目录。\n\n\
  ![图片](img/00003.jpeg) `node_modules`：包含上述安装的 NPM 模块。\n\n![图片](img/00003.jpeg) `./controllers`：包含\
  \ Express 控制器。\n\n![图片](img/00003.jpeg) `./models`：包含 MongoDB 的 Mongoose 模型。\n\n\
  ![图片](img/00003.jpeg) `./static`：包含静态文件，如 CSS。\n\n![图片](img/00003.jpeg) `./views`：由\
  \ EJS 渲染的 HTML。\n\n> **注意**\n> 这只是组织代码的一种方法。你不需要遵循这种目录结构，但请记住这种结构是项目设计的一部分。\n\n\
