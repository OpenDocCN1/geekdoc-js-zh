  \n## 实现天气服务\n\n标签视图准备完成后，你就可以开始实现其他组件了，从天气视图开始。此示例中的视图部分说明了如何使用后端服务连接 openweathermap.com\
  \ 并获取特定城市的天气。如果浏览器存在跨域问题，或者在将远程数据发送到客户端之前对其进行格式化，使用后端服务器访问远程站点将非常有用。接下来的章节将带你完成实现后端服务器、连接后端服务器的\
  \ AngularJS 控制器以及实际 HTML 视图的过程。\n\n#### 创建后端天气服务\n\nListing 29.9 在 Node.js 服务器上实现了后端\
