  \  next();\n});\n```\n\n为了查看此代码如何工作，请考虑以下 URL：\n\n`/user/4983`\n\n`userid` 参数设置为\
  \ `4983` 并从 URL 解析出的，`console.log()` 语句显示：\n\nRequest with userid: 4983\n\n### 路由参数应用示例\n\
  \n列表 18.2 提供了一个在 Express 路由中实现查询字符串、正则表达式和定义参数的示例。第 8–16 行实现了查询字符串方法。第 17–23 行实现了正则表达式方法。第\
  \ 24–33 行实现了一个定义参数以及每当请求参数中指定 `userid` 参数时就会执行的回调函数。图 18.1 显示了列表 18.2 中代码的控制台输出。\n\
  \n**列表 18.2 `express_routes.js`：在 Express 中实现路由参数**\n\n点击此处查看代码图片\n\n```javascript\n\
  01 var express = require('express');\n02 var url = require('url');\n03 var app =\
  \ express();\n04 app.listen(80);\n05 app.get('/', function (req, res) {\n06    res.send(\"\
  Get Index\");\n07 });\n08 app.get('/find', function(req, res){\n09    var url_parts\
  \ = url.parse(req.url, true);\n10   var query = url_parts.query;\n11   var response\
  \ = 'Finding Book: Author: ' + query.author +\n12                   ' Title: ' +\
  \ query.title;\n13   console.log('\\nQuery URL: ' + req.originalUrl);\n14   console.log(response);\n\
  15   res.send(response);\n16 });\n17 app.get(/^\\/book\\/(\\w+)\\:(\\w+)?$/, function(req,\
  \ res){\n18   var response = 'Get Book: Chapter: ' + req.params[0] +\n19       \
  \            ' Page: ' + req.params[1];\n20   console.log('\\nRegex URL: ' + req.originalUrl);\n\
  21   console.log(response);\n22   res.send(response);\n23 });\n24 app.get('/user/:userid',\
  \ function (req, res) {\n25   var response = 'Get User: ' + req.param('userid');\n\
  26   console.log('\\nParam URL: ' + req.originalUrl);\n27   console.log(response);\n\
  28   res.send(response);\n29 });\n30 app.param('userid', function(req, res, next,\
  \ value){\n31   console.log(\"\\nRequest received with userid: \" + value);\n32\
  \   next();\n33 });\n```\n\n![Image](img/00218.jpeg)\n\n图 18.1 使用查询字符串、正则表达式和定义参数实现路由参数。\n\
  \n### 使用请求对象\n\n你将 `Request` 对象作为第一个参数传递给路由处理器。`Request` 对象提供了有关请求的数据和元数据，包括 URL、头部、查询字符串等更多内容。它允许你在代码中妥善地处理请求。\n\
  \n表格 18.2 列出了 `Request` 对象可用的一些常用属性和方法。\n\n![Image](img/00219.jpeg)\n\n表格 18.2 `Request`\
  \ 对象的属性和方法\n\n列表 18.3 显示了如何访问 `Request` 对象的不同部分。图 18.2 中的输出显示了与 `GET` 请求关联的实际值。\n\
  \n**列表 18.3 `express_request.js`：在 Express 中访问 `Request` 对象的属性**\n\n点击此处查看代码图片\n\
  \n```javascript\n01 var express = require('express');\n02 var url = require('url');\n\
  03 var app = express();\n04 app.listen(80);\n05 app.get('/', function (req, res)\
  \ {\n06    res.send(\"Get Index\");\n07 });\n08 app.get('/find', function(req, res){\n\
  09    var url_parts = url.parse(req.url, true);\n10   var query = url_parts.query;\n\
  11   var response = 'Finding Book: Author: ' + query.author +\n12              \
  \     ' Title: ' + query.title;\n13   console.log('\\nQuery URL: ' + req.originalUrl);\n\
  14   console.log(response);\n15   res.send(response);\n16 });\n17 app.get(/^\\/book\\\
  /(\\w+)\\:(\\w+)?$/, function(req, res){\n18   var response = 'Get Book: Chapter:\
  \ ' + req.params[0] +\n19                   ' Page: ' + req.params[1];\n20   console.log('\\\
  nRegex URL: ' + req.originalUrl);\n21   console.log(response);\n22   res.send(response);\n\
  23 });\n24 app.get('/user/:userid', function (req, res) {\n25   var response = 'Get\
  \ User: ' + req.param('userid');\n26   console.log('\\nParam URL: ' + req.originalUrl);\n\
  27   console.log(response);\n28   res.send(response);\n29 });\n30 app.param('userid',\
  \ function(req, res, next, value){\n31   console.log(\"\\nRequest received with\
  \ userid: \" + value);\n32   next();\n33 });\n```\n\n\n\n\n`send()` 方法确实可以处理所有必要的响应，只要你为响应设置了适当头部（headers）和状态。一旦\
  \ `send()` 方法完成，它会设置 `res.finished` 和 `res.headerSent` 属性的值。你可以使用这些属性来验证响应是否已发送、传输了多少数据等。以下是\
  \ `res.headerSent` 属性的一个示例：\n\n点击此处查看代码图片\n\n```\nHTTP/1.1 200 OK\nX-Powered-By:\
  \ Express\nContent-Type: text/html\nContent-Length: 92\nDate: Tue, 17 Dec 2013 18:52:23\
  \ GMT\nConnection: keep-alive\n```\n\n列表 18.4 展示了设置状态码、头部以及发送响应的一些基础知识。注意在第 15–18\
  \ 行中，`/error` 路由在发送响应之前将状态设置为 `400`。图 18.3 显示了 Express 服务器控制台输出中的 `res.headerSent`\
  \ 数据。\n\n列表 18.4 `express_send.js`: 使用 `Response` 对象发送状态、头部和响应数据\n\n点击此处查看代码图片\n\
  \n```javascript\n01 var express = require('express');\n02 var url = require('url');\n\
  03 var app = express();\n04 app.listen(80);\n05 app.get('/', function (req, res)\
  \ {\n06    var response = '<html><head><title>Simple Send</title></head>' +\n07\
  \                   '<body<h1>Hello from Express</h1></body>></html>';\n08    res.status(200);\n\
  09    res.set({\n10      'Content-Type': 'text/html',\n11      'Content-Length':\
  \ response.length\n12    });\n13    res.send(response);\n14    console.log('Response\
  \ Finished? ' + res.finished);\n15    console.log('\\nHeaders Sent: ');\n16    console.log(res.headerSent);\n\
  17 });\n18 app.get('/error', function (req, res) {\n19    res.status(400);\n20 \
  \   res.send(\"This is a bad request.\");\n21 });\n```\n\n![Image](img/00222.jpeg)\n\
  \n图 18.3 发送响应后的 `res.headerSent` 输出。\n\n### 发送 JSON 响应\n\n一种趋势是使用 JSON 数据从服务器传输信息到客户端，然后让客户端动态填充页面上的\
  \ HTML 元素，而不是让服务器构建 HTML 文档或 HTML 文档部分并发送给客户端。Express 通过在 `Response` 对象上提供 `json()`\
  \ 和 `jsonp()` 方法，非常方便地发送 JSON。这些方法使用了与 `send()` 类似的语法，区别在于主体是一个 JSON 字符串化后的 JavaScript\
  \ 对象：\n\n```\nres.json(status, [object])\nres.json([body])\nres.jsonp(status, [object])\n\
  res.jsonp([object])\n```\n\nJavaScript 对象被转换为 JSON 字符串并发送回客户端。在 `jsonp()` 的情况下，请求对象的\
  \ URL 包含一个 `?callback=<method>` 参数，JSON 字符串被封装在一个该方法名的函数中，该方法可以从浏览器客户端调用以支持 JSONP\
  \ 设计。\n\n列表 18.5 实现了 `json()` 和 `jsonp()`，以说明向服务器发送 JSON 数据。注意在第 6 行中，`json spaces`\
  \ 应用设置设置为 `4`，并在第 7 行将一个基础 JavaScript 对象传递到 `json()` 调用中。在第 12 行，响应中设置了一个错误代码，且响应对象是一个\
  \ JSON 对象。\n\n第 14–19 行实现了 `jsonp()` 方法。注意在第 15 行中 `jsonp callback name` 被设置为 `cb`。这意味着客户端不需要在\
  \ URL 中传递 `?callback=<function>`，而需要在 URL 中传递 `?cb=<function>`。图 18.4 显示了这些调用调用发送到浏览器的输出。\n\
  \n列表 18.5 `express_json.js`: 在 Express 响应中发送 JSON 和 JSONP 数据\n\n点击此处查看代码图片\n\n```javascript\n\
  01 var express = require('express');\n02 var url = require('url');\n03 var app =\
  \ express();\n04 app.listen(80);\n05 app.get('/json', function (req, res) {\n06\
  \    app.set('json spaces', 4);\n07    res.json({name:\"Smithsonian\",built:'1846',items:'137M',\n\
  08      centers: ['astrophysics', 'natural history',\n09      'planetary', 'biology',\
  \ 'zoo']});\n10 });\n11 app.get('/error', function (req, res) {\n12    res.json(500,\
  \ message:\"Internal Error\"});\n13 });\n14 app.get('/jsonp', function (req, res)\
  \ {\n15    app.set('jsonp callback name', 'cb');\n16    res.jsonp({name:\"Smithsonian\"\
  ,built:'1846',items:'137M',\n17      centers: ['astrophysics', 'natural history',\n\
  18      'planetary', 'biology', 'zoo']});\n19 });\n```\n\n![Image](img/00223.jpeg)\n\
  \n图 18.4 发送 JSON 和 JSONP 数据。\n\n### 发送文件\n\nExpress 中的一个非常有用的方法是 `Response` 对象上的\
  \ `sendfile()` 方法。`sendfile()` 通过单个方法调用即可完成发送文件所需的所有工作。具体来说，`sendfile()` 方法执行：\n\
  \n- 根据扩展名设置 `Content-Type` 头部。\n- 设置其他头部，如 `Content-Length`。\n- 设置响应状态。\n- 通过 `Response`\
  \ 对象中的连接发送文件内容。\n\n`sendfile()` 方法使用以下语法：\n\n点击此处查看代码图片\n\n```\nres.sendfile(path,\
  \ [options], [callback])\n```\n\n`path` 指向要发送客户端的文件。`options` 参数是一个包含 `maxAge` 属性（定义内容的有效期）和\
  \ `root` 属性（支持 `path` 中的相对路径）的对象。回调函数在文件传输完成时被调用，并接受错误作为唯一参数。\n\n列表 18.6 展示了如何使用\
  \ `sendfile()` 命令轻松地发送文件内容。注意在第 8 行指定了 `root` 路径，因此第 6 行只需要文件名。注意回调函数具有处理错误的代码。此代码发送了一个图片，图\
  \ 18.5 显示了浏览器中显示的图像。\n\n列表 18.6 `express_send_file.js`: 在 Express HTTP 请求中发送文件\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var express = require('express');\n02 var url\
  \ = require('url');\n03 var app = express();\n04 app.listen(80);\n05 app.get('/image',\
  \ function (req, res) {\n06    res.sendfile('arch.jpg',\n07              { maxAge:\
  \ 24*60*60*1000,\n08              root: './views/'},\n09              function(err){\n\
  10      if (err){\n11        console.log(\"Error\");\n12      } else {\n13     \
  \   console.log(\"Success\");\n14      }\n15    });\n16 });\n```\n\n![Image](img/00224.jpeg)\n\
  \n### 发送下载响应\n\nExpress 包含一个 `res.download()` 方法，其工作方式与 `res.sendfile()`非常相似，只有细微不同。`res.download()`\
  \ 方法将文件作为附件在 HTTP 响应发送，这意味着设置了 `Content-Disposition` 头部。\n\n### 重定向响应\n\n在实现 Web\
  \ 服务器时，你可能需要将客户端请求重定向到同一服务器上的不同位置或完全不同的服务器。`res.redirect(path)` 方法处理到新位置的请求重定向。\n\
  \n\n\n\nListing 18.7 展示了你可以使用的各种重定向地址。第 6 行重定向到一个完全全新的域名地址。第 9 行重定向到同一服务器上的不同路径，而第\
  \ 15 行重定向到同一服务器上的相对路径。\n\n列表 18.7 `express_redirect.js`: 在 Express 服务器上重定向请求\n\n\
  点击此处查看代码图片\n\n* * *\n\n```\n01 var express = require('express');\n02 var url = require('url');\n\
  03 var app = express();\n04 app.listen(80);\n05 app.get('/google', function (req,\
  \ res) {\n06    res.redirect('http://google.com');\n07 });\n08 app.get('/first',\
  \ function (req, res) {\n09    res.redirect('/second');\n10 });\n11 app.get('/second',\
  \ function (req, res) {\n12    res.send(\"Response from Second\");\n13 });\n14 app.get('/level/A',\
  \ function (req, res) {\n15    res.redirect(\"../B\");\n16 });\n17 app.get('/level/B',\
  \ function (req, res) {\n18    res.send(\"Response from Level B\");\n19 });\n```\n\
  \n* * *\n\n### 实现模板引擎\n\n一种日益增长的趋势是使用模板引擎根据模板文件和应用程序数据生成 HTML，而不是从头开始构建 HTML 文件或使用静态文件。模板引擎使用\
  \ `template` 对象根据应用程序提供的值来构建 HTML。使用模板引擎有两个益处：\n\n![Image](img/00003.jpeg) **简单性：**\
  \ 模板尝试通过简写符号或允许直接在 HTML 文档中嵌入 JavaScript 来轻松生成 HTML。\n\n![Image](img/00003.jpeg)\
  \ **速度：** 模板引擎优化了构建 HTML 文档的过程。许多引擎会编译模板并将编译后的版本存储在缓存中，从而加快 HTML 响应的生成。\n\n接下来的章节将讨论如何在\
  \ Express 中实现模板引擎。Express 中有多种模板引擎可以使用，本章重点关注两个：Jade 和嵌入 JavaScript (EJS)。这两个模板引擎的工作方式非常不同，可以让你对可用工具有一个初步了解。Jade\
  \ 在模板中使用 HTML 的简写符号，因此模板文件看起来不像 HTML。它的优点是模板文件非常小且易于遵循。缺点是它还需要额外学习另一种语言。相反，EJS 使用特殊符号将\
  \ JavaScript 嵌入到普通的 HTML 文档中。这使得从普通 HTML 转换过来变得容易得多。缺点是 HTML 文档比原始文件更加复杂，而且没有 Jade\
  \ 模板那样整洁。\n\n要运行本节中的示例，你需要在应用程序中安装 `jade` 和 `ejs` 模块，使用以下命令：\n\n```bash\nnpm install\
  \ jade@1.3.1\nnpm install ejs@1.0.0\n```\n\n#### 定义模板引擎\n\n实现模板引擎的第一步是为 Express\
  \ 应用程序定义一个默认模板引擎。你通过在 `express()` 应用程序对象上设置 `view engine` 设置来实现这一点。你还需要设置 `views`\
  \ 设置为存储模板文件的位置。例如，以下代码将 `./views` 目录设置为模板文档的根目录，并将 `jade` 设置为视图引擎：\n\n点击此处查看代码图片\n\
  \n```\nvar app = express();\napp.set('views', './views');\napp.set('view engine',\
  \ 'jade');\n```\n\n然后，你需要使用 `app.engine(ext, callback)` 方法为你想要让它们处理的模板扩展注册模板引擎。`ext`\
  \ 参数是用于模板文件的文件扩展名，`callback` 参数是一个支持 Express 渲染功能的函数。\n\n许多引擎在 `__express` 函数中提供回调功能。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\napp.engine('jade', require('jade').__express)\n```\n\
  \n`__express` 功能通常只对默认的文件扩展名有效。在这种情况下，你可以使用不同的函数。例如，EJS 提供了该目的的 `renderFile` 函数。你可以使用以下代码为\
  \ `ejs` 扩展注册 EJS：\n\n点击此处查看代码图片\n\n```javascript\napp.engine('ejs', require('ejs').__express)\n\
  ```\n\n然而，如果你想为 HTML 扩展注册 EJS，你需要使用：\n\n点击此处查看代码图片\n\n```javascript\napp.engine('html',\
  \ require('ejs').renderFile)\n```\n\n一旦注册了扩展，就会调用引擎回调函数来渲染任何该扩展的模板。如果你选择了 Jade 或\
  \ EJS 之外的引擎，你需要弄它们期望如何与 Express 注册。\n\n#### 添加本地变量 (Locals)\n\n在渲染模板时，你可能想要包含动态数据——例如，为从数据库读取的用户数据渲染页面。在这种情况下，你可以生成一个\
  \ `locals` 对象，该对象包含映射到应用程序定义的变量名的属性。\n\n要分配本地变量，你可以使用点语法。例如，以下代码设置了 `title`：\n\n\
  点击此处查看代码图片\n\n```javascript\napp.locals.title = 'My App';\n```\n\n你也可以通过调用 `app.locals()`\
  \ 并传入对象来设置本地变量。例如：\n\n点击此处查看代码图片\n\n```javascript\napp.locals({title: 'My App',\
  \ version: 10});\n```\n\n* * *\n\n### 注意\n\n由于 `app.locals` 是 JavaScript 函数，你不能使用原生名称（例如\
  \ `name`, `apply`, `call`, `length`, `constructor` 等）作为属性。\n\n* * *\n\n#### 创建模板\n\
  \n在渲染模板时，你需要创建文件。创建模板文件时考虑以下因素：\n\n![Image](img/00003.jpeg) **可重用：** 尝试让你的模板在其他部分和其他应用程序中重用。许多引擎缓存模板以提高性能。拥有的模板越多，引擎花费的缓存时间就越多。组织你的模板使其适用于多种用途。例如，如果你在应用程序中有多个表格，只需为它们创建一个模板，并在其中添加列标题、标题等。\n\
  \n![Image](img/00003.jpeg) **大小：** 随着模板增大，它们往往会变得难以管理。尝试根据呈现的数据类型对模板进行划分。例如，如果一个模板包含菜单栏、表单和表格，你可以将其拆分为三个独立的模板。\n\
  \n![Image](img/00003.jpeg) **层级：** 大多数网站和应用程序都是基于某种层次构建的。例如，`<head>` 部分以及横幅和菜单在整个站点可能是相同的。你应该为多个位置使用的独立的模板，并在构建最终页面时包含这些子模板。\n\
  \n列表 18.8 显示了一个基础 EJS 模板，它应用一组本地变量来显示用户信息。EJS 代码非常基础，仅使用 `<%= variable %>` 从 Express\
  \ 本地变量中提取值。\n\n列表 18.8 `user_ejs.html`: 用于显示用户的简单 EJS 模板\n\n点击此处查看代码图片\n\n* * *\n\
  \n```\n01 <!DOCTYPE html>\n02 <html lang=\"en\">\n03 <head>\n04 <title>EJS Template</title>\n\
  05 </head>\n06 <body>\n07    <h1>User using EJS Template</h1>\n08   <ul>\n09       <li>Name:\
  \ <%= uname %></li>\n10       <li>Vehicle: <%= vehicle %></li>\n11   </ul>\n12 </body>\n\
  13 </html>\n```\n\n\n\n\n```html\n<ul>\n  <li>Terrain: <%= terrain %></li>\n  <li>Climate:\
  \ <%= climate %></li>\n  <li>Location: <%= location %></li>\n</ul>\n</body>\n</html\n\
  ```\n\n***\n\nListing 18.9 和 Listing 18.10 展示了如何使用 Jade 实现一个主模板，然后在子模板中使用它。Listing\
  \ 18.9 中的主模板非常基础，仅实现了`doctype`、`html`、`head`和`title` 元素。它还添加了在 Listing 18.10 中定义的`block\
  \ content` 元素。\n\n注意 Listing 18.10 中的第 1 行扩展了 `main_jade`，以便首先包含这些元素，然后添加了`h1`、`ul`和`li`\
  \ 元素来从`local`变量中获取值。\n\n### Listing 18.9 `main_jade.jade`: 一个定义主网页的简单 Jade 模板\n\n\
  点击此处查看代码图片\n\n***\n\n```jade\ndoctype html\nhtml(lang=\"en\")\n  head\n    title=\"\
  Jade Template\"\n  body\n    block content\n```\n\n***\n\n### Listing 18.10 `user_jade.jade`:\
  \ 一个包含 `main_jade.jade` 模板并添加显示用户元素的简单 Jade 模板\n\n点击此处查看代码图片\n\n***\n\n```jade\n\
  extends main_jade\nblock content\n  h1 User using Jade Template\n  ul\n    li Name:\
  \ #{uname}\n    li Vehicle: #{vehicle}\n    li Terrain: #{terrain}\n    li Climate:\
  \ #{climate}\n    li Location: #{location}\n```\n\n## 在响应中渲染模板\n\n一旦你定义并配置了模板引擎，并创建了模板，就可以使用\
  \ Express 的 `app` 对象或 `Response` 对象来发送渲染后的模板。要在 Express `app` 对象中渲染模板，你可以使用下所示的\
  \ `app.render()` 方法：\n\n点击此处查看代码图片\n\n```javascript\napp.render(view, [locals],\
  \ callback)\n```\n\n`view` 参数指定 views 目录中的视图文件名。如果文件没有包含扩展名，将尝试默认扩展名，如`.jade`和`.ejs`。`locals`\
  \ 参数允许你传入一个 `locals` 对象（如果该对象尚未在 `app.locals` 中定义）。回调函数在模板渲染后执行，它的第一个参数应该接收一个错误对象，第二个参数接收渲染后模板的字符串形式。\n\
  \n要将模板直接渲染到响应中，可以使用 `res.render()` 函数，它的工作原理与 `app.render()` 完全相同，但不需要回调函数。渲染结果会自动发送到响应中。\n\
  \n`app.render()` 和 `res.render()` 方法都能良好工作。如果你在发送数据之前不需要对数据进行任何处理，可以使用 `res.render()`\
  \ 方法来避免为了调用 `res.send()` 发送数据所需的额外代码。\n\nListing 18.11 通过几个基础示例将所有的模板渲染概念结合在一起。第\
  \ 5–8 行设置了 `views` 目录和 `view engine` 并注册了 `jade` 和 `ejs`。然后第 10–16 行在 `app.locals`\
  \ 函数中定义了用户信息。\n\n第 17–19 行处理 `/jade` 路由，该路由直接从 Listing 18.10 渲染 `user_jade.jade`\
  \ 模板，并将定义的 locals 放入客户端响应。\n\n第 20–24 行处理 `/ejs` 路由，首先调用 `app.render()` 将 Listing\
  \ 18.8 中定义的 `users_ejs.html` 模板渲染为字符串 `renderedData`。然后通过 `res.send()` 命令发送该数据。Figure\
  \ 18.6 展示了这两个函数渲染的网页。\n\n### Listing 18.11 `express_templates.js`: 在 Express 中实现\
  \ Jade 和 EJS 模板\n\n点击此处查看代码图片\n\n***\n\n```javascript\nvar express = require('express'),\n\
  \    jade = require('jade'),\n    ejs = require('ejs');\nvar app = express();\n\
  app.set('views', './views');\napp.set('view engine', 'jade');\napp.engine('jade',\
  \ jade.__express);\napp.engine('html', ejs.renderFile);\napp.listen(80);\napp.locals({\n\
  \  uname : 'Brad',\n  vehicle: \"Jeep\",\n  terrain: \"Mountains\",\n  climate:\
  \ \"Desert\",\n  location: \"Unknown\"\n});\napp.get('/jade', function() {\n  app.render('user_jade',\
  \ function(err, html) {\n    res.send(html);\n  });\n});\napp.get('/ejs', function()\
  \ {\n  app.render('users_ejs', function(err, renderedData) {\n    res.send(renderedData);\n\
  \  });\n});\n```\n\n\n\n\n\n点击此处查看代码图片\n\n```bash\nnpm install basic-auth-connect@1.0.0\n\
  npm install body-parser@1.0.2\nnpm install connect-mongo@0.4.0\nnpm install cookie-parser@1.0.1\n\
  npm install cookie-session@1.0.1\nnpm install express-session@1.0.3\n```\n\n你也可以将\
  \ `express` 添加到你的 `package.json` 模块中，以确保在部署应用程序时安装这些模块。\n\n***\n\n### 注意事项\n\n其他的\
  \ express 中间件组件已作为 NPM 包的形式可用；只需查询 NPM 仓库即可。你也可以创建自己的自定义中间件。\n\n***\n\n你可以将中间件全局地应用于特定路径下的所有路由，也可以应用于特定的路由。接下来的章节描述了这些方法的每一种。\n\
  \n#### 为路径全局分配中间件\n\n要将中间件分配给所有路由，你可以在 Express 的 `app` 对象上实现 `use()` 方法。`use()`\
  \ 方法具有以下语法：\n\n```\nuse([path], middleware)\n```\n\n`path` 变量是可选的，默认为 `/`，这意味着所有路径。`middleware`\
  \ 参数是一个具有语法的函数，其中 `req` 是 `Request` 对象，`res` 是 `Response` 对象，`next` 是要执行的下一个中间件函数：\n\
  \n```\nfunction(req, res, next)\n```\n\n每个中间件组件都有一个返回相应中间件函数的构造函数。例如，要使用默认参数将 `body-parser`\
  \ 中间件应用到所有路径，你可以使用以下语句：\n\n点击此处查看代码图片\n\n```javascript\nvar express = require('express');\n\
  var bodyParser = require('body-parser');\nvar app = express();\napp.use('/', bodyParser());\n\
  ```\n\n#### 为单个路由分配中间件\n\n你也可以通过在 `path` 参数之后传递 `body-parser` 中间件应用于单个路由。例如，在下面的代码中，对\
  \ `/parsedRoute` 的请求将被记录，但对 `/otherRoute` 的请求将不会记录：\n\n点击此处查看代码图片\n\n```javascript\n\
  var express = require('express');\nvar bodyParser = require('body-parser');\nvar\
  \ app = express();\napp.get('/parsedRoute', bodyParser(), function(req, res) {\n\
  \  res.send('This request was logged.');\n});\napp.get('/otherRoute', function(req,\
  \ res) {\n  res.send('This request was not logged.');\n});\n```\n\n#### 添加多个中间件函数\n\
  \n你可以根据需要全局以及向路由分配尽可能多的中间件函数。例如，下面的代码分配了 `body-parser`、`cookie-parser` 和 `express-session`\
  \ 中间件模块：\n\n点击此处查看代码图片\n\n```javascript\nvar express = require('express');\nvar\
  \ bodyParser = require('body-parser');\nvar cookieParser = require('cookie-parser');\n\
  var session = require('cexpress-session');\nvar app = express();\napp.use('/', bodyParser()).\n\
  use('/', cookieParser()).\nuse('/', session());\n```\n\n请记住，你分配函数的顺序就是它们在请求处理期间被应用的顺序。某些中间件函数需要在其他中间件之前添加。\n\
  \n#### 使用 query 中间件\n\n最实用且简单的中间件组件之一是 `query` 中间件。`query` 中间件将 URL 中的查询字符串转换为 JavaScript\
  \ 对象并将其存储为 `Request` 对象上的 `query` 属性。从 Express 4.x 开始，该功能已存在内置请求解析器中，不需要额外的中间件。\n\
  \n下面的代码段展示了使用 `query` 中间件的基础：\n\n点击此处查看代码图片\n\n```javascript\nvar express = require('express');\n\
  var app = express();\napp.get('/', function(req, res) {\n  var id = req.query.id;\n\
  \  var score = req.query.score;\n  console.log(JSON.stringify(req.query));\n  res.send(\"\
  done\");\n});\n```\n\n请求的查询字符串看起来像 `?id=10&score=95`。注意，可以在 `req.query` 上调用 `JSON.stringify`，因为它是一个\
  \ JavaScript 对象。\n\n#### 服务静态文件\n\n`static` 中间件是非常常用的 Express 中间件。`static` 中间件允许你直接从磁盘向客户端提供静态文件。你可以使用\
  \ `static` 中间件来支持 JavaScript 文件、CSS 文件、图像文件和不变化的 HTML 文档。`static` 模块极易实现并使用了以下语法：\n\
  \n点击此处查看代码图片\n\n```\nexpress.static(path, [options])\n```\n\n`path` 参数指定了请求中引用静态文件的根路径。`options`\
  \ 参数允许你设置以下属性：\n\n![Image](img/00003.jpeg) `maxAge`: 浏览器缓存 `maxAge`，以毫秒为单位。默认为 `0`。\n\
  \n![Image](img/00003.jpeg) `hidden`: 布尔值，当为 `true` 时表示启用隐藏文件的传输。默认为 `false`。\n\n\
  ![Image](img/images00003.jpeg) `index`: 根路径的文件名。默认为 `index.html`。\n\n列表 19.1 `express.js`:\
  \ 实现两个路由的 Express 代码：一个用于 `/` 并映射到 `static`，第二个用于 `/images`。图 19.1 向浏览器静态服务的 HTML、CSS\
  \ 和图像文件。\n\n\n\n\n\n第 12–21 行的代码实现了一个 `POST` 请求处理器。注意在第 16 行中，通过 `req.body.first`\
  \ 访问表单字段中输入的第一个名称，以帮助构建响应中的 hello 消息。其实就是这样。你可以以这种方式处理请求体中的任何类型的表单数据。图 19.2 显示了浏览器中生成的\
  \ Web 表单。\n\n列表 19.4 `express_post.js`：使用 `body-parser` 中间处理请求体中的 `POST` 参数\n\n\
  点击此处查看代码图片\n\n```\n01 var express = require('express');\n02 var bodyParser = require('body-parser');\n\
  03 var app = express();\n04 app.use(bodyParser());\n05 app.get('/', function (req,\
  \ res) {\n06   var response = '<form method=\"POST\">' +\n07           'First: <input\
  \ type=\"text\" name=\"first\"><br>' +\n08           'Last: <input type=\"text\"\
  \ name=\"last\"><br>' +\n09           '<input type=\"submit\" value=\"Submit\"></form>';\n\
  10   res.send(response);\n11 });\n12 app.post('/',function(req, res){\n13   var\
  \ response = '<form method=\"POST\">' +\n14           'First: <input type=\"text\"\
  \ name=\"first\"><br>' +\n15           'Last: <input type=\"text\" name=\"last\"\
  ><br>' +\n16           '<input type=\"submit\" value=\"Submit\"></form>' +\n17 \
  \          '<h1>Hello ' + req.body.first + '</h1>';\n18   res.type('html');\n19\
  \   res.end(response);\n20   console.log(req.body);\n21 });\n22 app.listen(80);\n\
  ```\n\n![Image](img/00227.jpeg)\n\n图 19.2 使用 `body-parser` 中间处理请求体中的 `POST` 参数。\n\
  \n## 发送和接收 Cookie\n\nExpress 提供的 `cookie-parser` 中间件让处理 Cookie 变得极其简单。`cookie-parser`\
  \ 中间件解析请求中的 Cookie 并将其作为 JavaScript 对象存储在 `req.cookies` 属性中。`cookie-parser` 中间件使用以下语法：\n\
  \n点击此处查看代码图片\n\n```\nexpress.cookie-parser([secret])\n```\n\n#### 注意\n当 Connect\
  \ 3.0 发布时，`cookie-parser` 中间件将被重命名为 `cookie`。如果最终不支持后兼容，你可能需要更改代码以支持新名称。\n\n可选的\
  \ `secret` 字符串参数通过内部使用 `secret` 字符串对 Cookie 进行签名防止 Cookie 篡改。\n\n要在响应中设置 Cookie，可以使用所示的\
  \ `res.cookie()` 方法：\n\n点击此处查看代码图片\n\n```\nres.cookie(name, value, [options])\n\
  ```\n\n指定 `name` 和 `value` 参数的 Cookie 将被添加到响应中。`options` 参数允许你为 Cookie 设置以下属性：\n\
  \n![Image](img/00003.jpeg) **maxAge**: Cookie 在过期前的生存时间，以毫秒为单位。\n\n![Image](img/00003.jpeg)\
  \ **httpOnly**: 布尔值，当为 `true` 时，表示该 Cookie 仅应由服务器访问，而不由客户端 JavaScript 访问。\n\n![Image](img/00003.jpeg)\
  \ **signed**: 布尔值，当为 `true` 时，表示 Cookie 将被签名，你需要使用 `req.signedCookie` 对象而不是 `req.cookie`\
  \ 对象来访问它。\n\n![Image](img/00003.jpeg) **path**: Cookie 应用的路径。\n\n例如，以下代码设置了 `hasVisited`\
  \ 的 Cookie：\n\n点击此处查看代码图片\n\n```\nres.cookie('hasVisited', '1',\n           { maxAge:\
  \ 60*60*1000,\n             httpOnly: true,\n             path:'/'});\n```\n\n你可以使用\
  \ `res.clearCookie()` 方法从客户端移除 Cookie。例如：\n\n点击此处查看代码图片\n\n```\nres.clearCookie('hasVisited');\n\
  ```\n\n列表 19.5 显示了从请求中获取名为 `req.cookies.hasVisited` 的 Cookie 的简单示例，如果它已经设置则进行设置。\n\
  \n列表 19.5 `express_cookies.js`：使用 Express 发送和接收 Cookie\n\n点击此处查看代码图片\n\n```\n01\
  \ var express = require('express');\n02 var cookieParser = require('cookie-parser');\n\
  03 var app = express();\n04 app.use(cookieParser());\n05 app.get('/', function(req,\
  \ res) {\n06   console.log(req.cookies);\n07   if (req.cookies.hasVisited){\n08\
  \     res.cookie('hasVisited', '1',\n09               { maxAge: 60*60*1000,\n10\
  \              httpOnly: true,\n11              path:'/'});\n12   }\n13   res.send(\"\
  Cookie\");\n14 });\n15 app.listen(80);\n```\n\n### 实现 Session\n\nExpress 中间件另一个常用用途为应用程序提供会支持。对于复杂的会管理，你可能需要自己实现，但对于基本的会支持，`cookie-session`\
  \ 中间件非常好。\n\n`cookie-session` 中间件利用 `cookie-parser` 中间件，因此你需要在添加 `cookie-session`\
  \ 之前添加 `cookie-parser`。以下显示了添加 `cookie-session` 的语法：\n\n```\nres.session([options])\n\
  ```\n\n`options` 参数允许为 Cookie 设置以下属性：\n\n![Image](img/00003.jpeg) **key**: 会 Cookie\
  \ 的名称。\n\n![Image](img/00003.jpeg) **secret**: 用于签名会 的字符串。\n\n![Image](img/00003.jpeg)\
  \ **cookie**: 定义 Cookie 设置的对象，包括 `maxAge`、`path` 和 `signed`。\n\n![Image](img/00003.jpeg)\
  \ **proxy**: 布尔值，当为 `true` 时，Express 会信任通过 `x-forwarded-proto` 设置的反向代理。\n\n当实现 `cookie-session`\
  \ 时，会存储在 `req.session` 对象中。你对 `req.session` 的任何更改在多次请求间生效。\n\n列表 19.6 显示了一个实现基本的\
  \ `cookie-session` 会示例。注意第 5 行先添加了 `cookie-parser`，然后在第 6 行添加了 `cookie-session`\
  \ 并带有 `secret` 字符串。示例中有两个路由。当访问 `/restricted` 路由时，会中的 `restrictedCount` 值会增加，并重定向到\
  \ `/library`。然后在 `library` 中，如果 `restrictedCount` 不是 `undefined`，则显示该值；否则显示欢迎消息。图\
  \ 19.3 显示了 Web 浏览器中不同的输出。\n```\n\n\n\n\nExpress 中间件另一个常用用途是应用基础 HTTP 认证。HTTP 认证使用\
  \ `Authorization` 头部从浏览器向服务器发送编码后的用户名和密码。如果浏览器中没有为该 URL 存储任何授权信息，浏览器将启动一个基础登录对话框，允许用户输入用户名和密码。基础\
  \ HTTP 认证对于需要最简单验证方法的基础站点效果良好，并且非常容易实现。\n\nExpress 中的 `basic-auth-connect` 中间件函数提供了处理基础\
  \ HTTP 认证的支持。`basic-auth-connect` 中间件使用以下语法：\n\n点击此处查看代码图片\n\n```javascript\nvar\
  \ basicAuth = require('basic-auth-connect');\n\nexpress.basicAuth(function(user,\
  \ pass){})\n```\n\n传递给 `basic-auth-connect` 的函数接受用户名和密码，如果它们正确则返回 `true`，如果错误则返回\
  \ `false`。例如：\n\n点击此处查看代码图片\n\n```javascript\napp.use(express.basicAuth(function(user,\
  \ password) {\n  return (user === 'testuser' && pass === 'test');\n}));\n```\n\n\
  通常你会将用户名和密码存储在数据库中，然后在认证函数内部，你获取 `user` 对象进行验证。\n\n列表 19.7 和 列表 19.8 own 明了实现 `basic-auth-connect`\
  \ 中间件是多么简单。列表 19.7 实现了全局认证。列表 19.8 实现了针对单个路由的认证。图 19.4 显示了浏览器请求认证以及经过身份验证的网页。\n\n\
  #### 列表 19.7 `express_auth.js`：为站点全局实现基础 HTTP 认证\n\n点击此处查看代码图片\n\n```javascript\n\
  01 var express = require('express');\n02 var basicAuth = require('basic-auth-connect');\n\
  03 var app = express();\n04 app.listen(80);\n05 app.use(basicAuth(function(user,\
  \ pass) {\n06    return (user === 'testuser' && pass === 'test');\n07 }));\n08 app.get('/',\
  \ function(req, res) {\n09    res.send('Successful Authentication!');\n10 });\n\
  ```\n\n#### 列表 19.8 `express_auth_one.js`：为单个路由实现基础 HTTP 认证 \n\n点击此处查看代码图片\n\n```javascript\n\
  01 var express = require('express');\n02 var basicAuth = require('basic-auth-connect');\n\
  03 var app = express();\n04 var auth = basicAuth(function(user, pass) {\n05    return\
  \ (user === 'user1' && pass === 'test');\n06 });\n07 app.get('/library', function(req,\
  \ res) {\n08    res.send('Welcome to the library.');\n09 });\n10 app.get('/restricted',\
  \ auth, function(req, res) {\n11    res.send('Welcome to the restricted section.');\n\
  12 });\n13 app.listen(80);\n```\n\n![Image](img/00229.jpeg)\n\n图 19.4 使用基础 HTTP\
  \ 认证。\n\n## 实现会话认证\n\n基础 HTTP 认证的一个主要缺点是只要凭据被存储，登录就会一直有效，而且并不安全。好得多的方法实现自己的认证，并将其存储在你可以随时过期的会话中。\n\
  \nExpress 内部的 `session` 中间件在实现会话认证方面非常好。`session` 中间件将 `Session` 对象 `req.session`\
  \ 附加到 `Request` 对象上以提供会话功能。表 19.1 描述了你可以在 `res.session` 对象上调用的方法。\n\n![Image](img/00230.jpeg)\n\
  \n表 19.1 `res.session` 对象上管理会话的方法\n\n列表 19.9 展示了如何使用 `crypto` 模块生成安全密码来实现会话认证。该示例非常基础，以保持在书中足够小，但它包含了基本功能，让你看到如何实现会话认证。\n\
  \n第 6–9 行通过 `hasPW()` 函数对密码加密。注意列表使用了 `body-parser`、`cookieParser` 和 `session` 中间件。第\
  \ 44 和 45 行模拟从数据库获取 `user` 对象，并将存储的密码哈希与来自请求体中的密码哈希进行比较。第 46–50 行创建会话。注意 `regenerate()`\
  \ 函数用于重新生成新会话，传递 `regenerate()` 的回调函数设置了会话的 `session.user` 和 `session.success` 属性。如果认证失败，则只为会话设置\
  \ `session.error` 属性。第 29 行的 `/login` 路由显示登录页面。\n\n#### 列表 19.9 `express_auth_session.js`：在\
  \ Express 中实现会话认证 \n\n点击此处查看代码图片\n\n```javascript\n01 var express = require('express');\n\
  02 var bodyParser = require('body-parser');\n03 var cookieParser = require('cookie-parser');\n\
  04 var session = require('express-session');\n05 var crypto = require('crypto');\n\
  06 function hashPW(pwd){\n07    return crypto.createHash('sha256').update(pwd).digest('base64').toString();\n\
  08 }\n09 var app = express();\n10 app.use(bodyParser());\n11 app.use(cookieParser());\n\
  12 app.use(session());\n13 app.get('/restricted', function(req, res) {\n14    if\
  \ (req.session.user) {\n15        res.send('<p>'+ req.session.success + '</p><br>'\
  \ +\n16        '<a href=\"/logout\">logout</a>');\n17    } else {\n18        req.session.error\
  \ = 'Access denied!';\n19        res.redirect('/login');\n    }\n20 });\n21 app.get('/logout',\
  \ function(req, res) {\n22    req.session.destroy(function(){\n23        res.redirect('/login');\n\
  24    });\n25 });\n26 app.get('/login', function(req, res) {\n27    var response\
  \ = '<form method=\"POST\">' +\n28    'Username: <input type=\"text\" name=\"username\"\
  ><br>' +\n29    'Password: <input type=\"password\" name=\"password\"><br>' +\n\
  30    '<input type=\"submit\" value=\"Submit\"></form>';\n31    if(req.session.user){\n\
  32        res.redirect('/restricted');\n33    }else if(req.session.error){\n34 \
  \       response +='<h2>' + req.session.error + '</h2>';\n35    }\n36    res.type('html');\n\
  37    res.send(response);\n38 });\n39 app.post('/login', function(req, res) {\n\
  40    //user should be a lookup of req.body.username in database\n41    var user\
  \ = {name:req.body.username, password:hashPW(\"myPass\")};\n42    if (user.password\
  \ === hashPW(req.body.password.toString())) {\n43        req.session.regenerate(function(){\n\
  44            req.session.user = user;\n45            req.session.success = 'Authenticated\
  \ as ' + user.name;\n46            res.redirect('/restricted');\n47        });\n\
  48    } else {\n49        req.session.regenerate(function(){\n50            req.session.error\
  \ = 'Authentication failed.';\n51            res.redirect('/restricted');\n52  \
  \      });\n53        res.redirect('/login');\n54    }\n55 });\n56 app.listen(80);\n\
  ```\n\n\n\n\n使用 Express，你可以创建自己的中间件。你只需要提供一个函数，该函数接受 `Request` 对象作为第一个参数，接受 `Response`\
  \ 对象作为第二个参数，并将 `next` 作为第三个参数。`next` 参数是由中间件框架传递的函数，它指向下一个要执行的中间件函数，因此，你必须在退出自定义函数之前调用\
  \ `next()`，否则处理程序将永远不会被调用。\n\n为了说明在 Express 中实现自己的自定义中间件功能是多么简单，列表 19.10 实现了一个名为\
  \ `queryRemover()` 的中间件函数，该函数在将 URL 发送到处理器之前剥离 URL 中的查询字符串。\n\n注意，`queryRemover()`\
  \ 将 `Request` 和 `Response` 对象作为前两个参数，并将 `next` 作为第三个参数。按照要求，`next()` 回调函数会在离开中间件函数之前执行。图\
  \ 19.6 显示了控制台输出；如你所见，URL 中的查询字符串部分已被移除。\n\n列表 19.10 `express_middleware.js`: 实现自定义中间件以从\
  \ `Request` 对象中移除查询字符串\n\n点击此处查看代码图像\n\n```javascript\n01 var express = require('express');\n\
  02 var app = express();\n03 function queryRemover(req, res, next){\n04   console.log(\"\
  \\nBefore URL: \");\n05   console.log(req.url);\n06   req.url = req.url.split('?')[0];\n\
  07   console.log(\"\\nAfter URL: \");\n08   console.log(req.url);\n09   next();\n\
  10 };\n11 app.use(queryRemover);\n12 app.get('/no/query', function(req, res) {\n\
  13   res.send(\"test\");\n14 });\n15 app.listen(80);\n```\n\n![Image](img/00232.jpeg)\n\
  \n图 19.6 实现自定义中间件以从 `Request` 对象中移除查询字符串。\n\n## 总结\n\n本章介绍了 Express 中间件的世界。你已经学习了如何在代码中实现中间件。`parse-body`\
  \ 中间件允许你解析请求体中的 `POST` 参数或 JSON 数据。`static` 中间允许你设置路由来提供 JavaScript、CSS 和图像等静态文件。`cookie-parser`、`cookie-session`\
  \ 和 `session` 中间允许你实现 cookie 和会。\n\n在本章中，你还了解了使用中间件框架实现基本的 HTTP 验证和更高级的会验证。Express\
  \ 中间件的一个巨大优势是它让实现自己的中间件功能变得极其简单。\n\n### 下一步\n\n在下一章中，你将进入 AngularJS 的世界。你将概述 AngularJS\
  \ 的设计和意图。你将学习它在 Node.js 栈中的位置，以及如何在你的项目中开始实现它。\n\n# V: 学习 AngularJS\n\n## 20. 开始\
  \ AngularJS\n\nAngularJS 是一个 JavaScript 框架，提供了一种非常结构化的创建网站和网络应用程序的方法。AngularJS 是构建在轻量级\
  \ jQuery 之上的 JavaScript 库。它允许 AngularJS 提供 JavaScript 和 jQuery 的优点，同时强制执行结构化的模型视图控制器（MVC）框架。\n\
  \nAngularJS 是 Node.js 栈的完美客户端库，因为它提供了一种非常清晰且结构化的方法。有了整洁、结构化的前端，Node.js 后端的性能会更好。此外，AngularJS\
  \ 使用 JavaScript 对象作为其模型，这非常符合 Node.js 和 MongoDB 平台，因为对象不需要转换为其他结构即可在两个位置使用。\n\n\
  本章向你介绍了 AngularJS 以及 AngularJS 应用程序中涉及的主要组件。在尝试实现 AngularJS 应用程序之前，理解这些组件至关重要，因为该框架与传统的\
  \ JavaScript Web 应用编程不同。\n\n一旦你掌握了 AngularJS 应用程序的组件和生命周期，你将学习如何一步步构建基础的 AngularJS\
  \ 应用程序。这将让你准备好接下来的章节，那些章节将提供实现 AngularJS 的更多细节。\n\n## 为什么选择 AngularJS？\n\nAngularJS\
  \ 是一个构建在 JavaScript 和轻量级 jQuery 之上的 MVC 框架。MVC 框架将代码中的业务逻辑与视图和模型分离。如果没有这种分离，当你试图同时管理这三者以及复杂的函数迷宫时，基于\
  \ JavaScript 的 Web 应用可能会迅速失控。\n\nAngularJS 提供的所有功能你都可以使用 JavaScript 和 jQuery 自己实现，你甚至可以尝试使用另一个\
  \ MVC JavaScript 框架。然而，AngularJS 拥有许多功能，且 AngularJS 框架的设计使其以正确的方式实现 MVC。以下是选择 AngularJS\
  \ 的一些原因：\n\n![Image](img/00003.jpeg) AngularJS 框架强制了 MVC 的正确实现，并且让正确实现 MVC 变得简单。\n\
  \n![Image](img/00003.jpeg) AngularJS 模板的声明式样式使得 HTML 的意图更加直观，并使 HTML 更容易维护。\n\n\
  ![Image](img/00003.jpeg) AngularJS 的模型部分是基础 JavaScript 对象，易于操作、访问和实现。\n\n![Image](img/00003.jpeg)\
  \ AngularJS 使用声明式方法扩展 HTML 功能，通过在 HTML 声明与其背后的 JavaScript 功能之间建立直接链接。\n\n![Image](img/00003.jpeg)\
  \ AngularJS 提供了一个非常简单灵活的过滤器接口，允许在数据从模型传递到视图时对其格式化。\n\n![Image](img/00003.jpeg) AngularJS\
  \ 应用使用的代码比传统 JavaScript 应用少得多，因为你只需要关注逻辑，而不需要关注数据绑定等所有小细节。\n\n![Image](img/00003.jpeg)\
  \ AngularJS 比传统方法需要更少的文档模型（DOM）操作，并引导你将操作放在应用程序的正确位置。基于数据而非 DOM 操作来设计应用程序更容易。\n\n\
  ![Image](img/00003.jpeg) AngularJS 提供了几种内置服务，并允许你以结构化可重用的方式实现自己的服务。这使得你的代码更易维护且易于测试。\n\
  \n![Image](img/00003.jpeg) 得益于 AngularJS 框架职责的清晰分离，测试应用程序变得简单，甚至可以使用测试驱动的方法进行开发。\n\
  \n## 理解 AngularJS\n\nAngularJS 提供了一个基于 MVC 模型的非常结构化的框架。该框架允许你构建健壮且易于理解和维护的应用程序。在开始学习\
  \ AngularJS 之前，你需要理解将实现的各种组件以及它们是如何相互作用的。以下章节将讨论 AngularJS 应用程序中涉及的各种组件、目的以及每个组件的职责。\n\
  \n#### 模块\n\nAngularJS 引入了代表应用程序组件的概念。模块提供了一个命名空间，允许根据模型名称引用指令、作用和其他组件。这使得打包和复用应用程序的一部分变得更容易。\n\
  \n AngularJS 中的每个视图或网页都通过 `ng-app` 指令分配了一个单一模块。（指令将在本章稍后讨论。）然而，你可以将其他模块作为依赖项添加到主模块，这提供了一个非常结构化和组件化的应用程序。\n\
  \n#### 作用域和数据模型\n\n\n\n\n\n`AngularJS` 引入了作用域（scope）的概念。`scope` 实际上只是数据的 JavaScript\
  \ 表示，用于填充在网页上显示的视图（view）。这些数据可以来自任何源，例如数据库、远程 Web 服务或客户端的 `AngularJS` 代码，也可以由 Web\
  \ 服务器动态生成。\n\n`scope` 的一个伟大特性是它们仅仅是普通的 JavaScript 对象，这意味着你可以轻松地在 `AngularJS` 代码中根据需要操作它们。此外，你还可以嵌套\
  \ `scope` 来组织你的数据，使其与它们被使用的上下文相匹配。\n\n## 使用模板和指令的视图\n\nHTML 网页基于 DOM，每个 HTML 元素都由一个\
  \ `DOM object` 表示。网页浏览器读取 `DOM object` 的属性，并根据 `DOM object` 的属性知道如何在网页上渲染该 HTML\
  \ 元素。\n\n大多数动态 Web 应用直接使用 JavaScript 或基于 JavaScript 的库（如 `jQuery`）来操作 `DOM object`\
  \ 以更改值，例如向表格或菜单中添加/更改元素。\n\n`AngularJS` 引入了一个新概念，将模板（templates）与指令（directives）结合，以构建呈现给用户的\
  \ HTML 视图。指令包含两个部分：第一部分是添加到 HTML 模板中的额外属性、元素和 CSS 类；第二部分是扩展 `DOM` 正常行为的 JavaScript\
  \ 代码。\n\n使用指令的优势在于，HTML 模板通过指令指示了预期的逻辑。此外，内置的 `AngularJS` 指令处理了大部分你需要的 DOM 操作功能，这些功能用于将\
  \ `scope` 中的数据绑定到视图上。\n\n你还可以创建自己的 `AngularJS` 指令，来实现 Web 应用中任何必要的自定义功能。事实上，你应该使用自己的自定义指令来执行\
  \ Web 应用所需的任何直接 DOM 操作。\n\n## 表达式\n\n`AngularJS` 的一个强大特性是在 HTML 模板内部添加表达式的能力。`AngularJS`\
  \ 会评估表达式，并将结果动态地添加到网页中。表达式与 `scope` 绑定，因此你可以有一个利用 `scope` 中值的表达式，并且随着模型的改变，表达式的值也会发生变化。\n\
  \n## 控制器\n\n`AngularJS` 通过实现控制器（controllers）完成了 MVC 框架。控制器通过设置 `scope` 中的初始状态或值，以及为\
  \ `scope` 添加行为来增强 `scope`。例如，你可以添加一个函数来对 `scope` 中的值求和提供总计，这样如果 `scope` 后面的模型数据发生变化，总值就会一直变化。\n\
  \n你通过使用指令将控制器添加到 HTML 元素中，然后在后台作为 JavaScript 代码实现它们。\n\n## 数据绑定\n\n`AngularJS` 的最佳特性之一是内置的数据绑定。数据绑定是将模型中的数据与网页上显示的内容链接起来的过程。`AngularJS`\
  \ 提供了一个非常简洁的接口来将模型数据链接到网页中的元素。\n\n在 `AngularJS` 中，数据绑定是一个双向过程：当网页上的数据发生变化时，模型会更新；而当模型中的数据发生变化时，网页会自动更新。通过这种方式，模型始终是呈现给用户的唯一数据源，而视图只是模型的投影。\n\
  \n## 服务\n\n服务（Services）是 `AngularJS` 环境中的主体。服务是为 Web 应用提供功能的单例对象。例如，Web 应用的一个常见任务是向\
  \ Web 服务器发送 AJAX 请求。`AngularJS` 提供了一个 `HTTP` 服务，包含了访问 Web 服务器的所有功能。\n\n服务功能完全独立于上下文或状态，因此可以从应用的组件中轻松调用。`AngularJS`\
  \ 提供了许多用于基础用途的内置服务，如 HTTP 请求、日志记录、解析、动画等。你还可以创建自己的服务并在整个代码中复用它们。\n\n## 依赖注入\n\n\
  依赖注入是一个代码组件定义对其他组件依赖的过程。当代码初始化时，被依赖的组件将可以在组件内供访问。`AngularJS` 应用大量利用了依赖注入。\n\n依赖注入的常见用途是消费服务。例如，如果你正在定义一个需要通过\
  \ HTTP 请求访问 Web 服务器的模块，你可以将 `HTTP` 服务注入到模块中，该功能即可在模块代码中可用。此外，一个 `AngularJS` 模块可以通过依赖关系消费另一个模块的功能。\n\
  \n## 职责分离\n\n设计 `AngularJS` 应用时一个极其重要的部分是职责分离。你选择结构化框架的完全是为了确保代码实现良好、易于遵循、可维护且可测试。`Angular`\
  \ 提供了一个非常有结构化的框架供你工作，但你仍然需要确保以适当的方式实现 `AngularJS`。\n\n以下是实现 `AngularJS` 时需要遵循的规则：\n\
  \n![Image](img/00003.jpeg) 视图作为应用程序的官方呈现结构。在视图的 HTML 模板中，用指令指示任何呈现逻辑。\n\n![Image](img/00003.jpeg)\
  \ 如果你需要执行任何 DOM 操作，请在内置或你自定义的指令 JavaScript 代码中执行——不要在其他地方。\n\n![Image](img/00003.jpeg)\
  \ 将任何可复用的任务实现为服务，并通过依赖注入将它们添加到模块中。\n\n![Image](img/00003.jpeg) 确保 `scope` 反映模型的当前状态，并且是视图所消费数据的唯一源。\n\
  \n![Image](img/00003.jpeg) 确保控制器代码仅起增强 `scope` 数据的作用，而不包含任何业务逻辑。\n\n![Image](img/00003.jpeg)\
  \ 在模块空间内定义控制器，而不是全局。这确保了你的应用程序可以被轻松打包，并防止污染全局命名空间。\n\n## AngularJS 生命周期概述\n\n现在你已经理解了涉及\
  \ `AngularJS` 应用的组件，你需要了解生命周期期间发生了什么，生命周期包含三个阶段：启动、编译和运行。理解 `AngularJS` 应用的周期有助于理解如何设计和实现代码。\n\
  \n`AngularJS` 生命周期的三个阶段每次加载网页时都会发生。以下章节描述了 `AngularJS` 应用的这些阶段。\n\n### 启动阶段\n\n\
  `AngularJS` 生命周期的第一阶段是启动阶段，当 `AngularJS` JavaScript 库下载到浏览器时发生。`AngularJS` 初始化自身的必要组件，然后初始化由\
  \ `ng-app` 指令指定的模块。模块被加载，任何依赖项被注入到模块中并在模块内部可用。\n\n### 编译阶段\n\n`AngularJS` 生命周期的第二阶段是\
  \ HTML 编译阶段。最初在网页加载时，浏览器加载静态形式的 DOM。在编译阶段，静态 DOM 被替换为代表 `AngularJS` 视图的动态 DOM。\n\
  \n此阶段涉及两个部分：遍历静态 DOM 并收集所有指令，并将指令链接到 `AngularJS` 内置库或自定义指令代码中相应的 JavaScript 功能。指令与\
  \ `scope` 结合产生动态或实时的视图。\n\n### 运行数据绑定阶段\n\n\n\n\n[content]\nAngularJS 应用的最后阶段是运行阶段（runtime\
  \ phase），它会持续到用户重新加载或离开网页为止。此时，scope 中的任何更改都会反映在视图（view）中，而视图中的任何更改都会直接更新到 scope\
  \ 中，使得 scope 成为视图的单一数据源。\n\nAngularJS 的行为与传统的数据绑定方法不同。传统方法将模板与从引擎接收的数据结合，然后在每次数据变化时都操作\
  \ DOM。AngularJS 仅编译一次 DOM，然后根据需要链接已编译的模板，这使其比传统方法要高效得多。\n\n## 将 AngularJS 与现有的 JavaScript\
  \ 和 jQuery 集成\n\nAngularJS 基于 JavaScript 和 jQuery 这一事实使得人们往往倾向于尝试简单地将其添加到现有应用中，以提供数据绑定或其他功能。那种方法几乎总是会导致难以维护的问题代码。然而，使用\
  \ AngularJS 并不意味着你只需要丢弃现有的代码。\n\n以下步骤建议了一种将 AngularJS 集成到你现有的 JavaScript 和 jQuery\
  \ 应用程序的方法：\n\n1. 从零开始编写至少一个 AngularJS 应用程序，使用模型（model）、自定义 HTML 指令（directives）、服务（services）和控制器（controllers）。换句话说，在这个应用程序中，确保你对\
  \ AngularJS 的职责分离（separation of responsibilities）有实际理解。\n2. 识别代码中的模型部分。具体来说，尝试将增强模型中数据的代码分离到控制器函数中，将访问后端模型数据的代码分离到服务中。\n\
  3. 识别视图中操作 DOM 元素的代码。尝试将 DOM 操作代码分离到定义良好的自定义指令组件中，并为它们提供一个 HTML 指令。此外，识别任何 AngularJS\
  \ 已经提供内置支持的指令。\n4. 识别其他基于任务的函数，并将它们分离到服务中。\n5. 将指令和控制器隔离到模块（modules）中以组织你的代码。\n\
  6. 使用依赖注入（dependency injection）恰当地连接你的服务和模块。\n7. 更新 HTML 模板以使用新的指令。\n\n显然，在某些情况下，使用你现有的代码（即使几乎不使用）是没有意义的。但是，通过运行上述步骤，你将深入进入使用\
  \ AngularJS 实现项目的设计阶段，然后可以做出明智的决定。\n\n### 在 Node.js 环境中添加 AngularJS\n\nAngularJS\
  \ 是一个客户端 JavaScript 库，这意味着要在你的 Node.js 环境中实现 AngularJS，你需要做的就是提供一种方法，让客户端通过在 HTML\
  \ 模板中使用 `<script>` 标签获取 `angular.js` 库文件。\n\n提供 `angular.js` 库的最简单方法是使用内容交付网络（CDN），它提供了一个从第三方下载该库的\
  \ URL。这种方法的缺点是你必须依赖第三方来提供该库，如果客户端无法连接到该第三方 URL，你的应用程序将无法运行。例如，下面的 `<script>` 标签从\
  \ Google APIs CDN 加载 `angular.js` 库：\n\n点击此处查看代码图片\n\n```\n<script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js\"\
  >\n</script>\n```\n\n提供 `angular.js` 库的方法是从 AngularJS 网站 ([`angularjs.org`](http://angularjs.org))\
  \ 下载它，并使用 Node.js 将文件提供给客户端。这种方法需要更多精力，并且还需要 Web 服务器额外的带宽；但如果你想对客户端获取库的方式有更多控制，这可能是一个更好的选择。\n\
  \n### 在 HTML 文档中引导（Bootstrapping） AngularJS\n\n要在你的网页中实现 AngularJS，你需要引导（bootstrap）HTML\
  \ 文档。引导包含两个部分。第一部分是使用 `ng-app` 指令定义应用模块，第二部分是在 `<script>` 标签中加载 `angular.js` 库。\n\
  \n`ng-app` 指令告诉 AngularJS 编译器将该元素视为编译的根节点。`ng-app` 指令通常加载在 `<html>` 标签中，以确保整个网页包含在内；然而，你也可以将其添加到另一个容器元素，只有该容器内的元素会被包含在\
  \ AngularJS 编译中，从而包含在 AngularJS 应用功能中。\n\n可能的情况下，你应该将 `angular.js` 库作为 HTML `<body>`\
  \ 内部最后一个标签之一（如果不是最后一个的话）。当 `angular.js` 脚本被加载时，编译器就会启动并开始寻找指令。最后加载 `angular.js`\
  \ 可以让网页加载更快。\n\n以下是在 HTML 文档中实现 `ng-app` 和 `angular.js` 引导的示例：\n\n点击此处查看代码图片\n\n\
  ```html\n<!doctype html>\n<html ng-app=\"myApp\">\n  <body>\n    <script src=\"\
  http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n    <script src=\"/lib/myApp.js\"\
  ></script>\n  </body>\n</html>\n```\n\n## 使用全局 API\n\n当你实现 AngularJS 应用时，你会发现有一些需要经常执行的常见\
  \ JavaScript 任务，例如比较对象、深拷贝、遍历对象和转换 JSON 数据。AngularJS 在全局 API 中提供了许多此类基础功能。\n\n当\
  \ `angular.js` 库加载时，全局 API 是可用的，你可以通过使用 `angular` 对象访问它们。例如，要为名为 `myObj` 的对象创建深拷贝，你可以使用以下语法：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar myCopy = angular.copy(myObj);\n```\n\n下面的代码展示了通过全局\
  \ API 遍历数组的示例：\n\n点击此处查看代码图片\n\n```javascript\nvar objArr = [{score: 95}, {score:\
  \ 98}, {score: 92}];\nvar scores = [];\nangular.forEach(objArr, function(value,\
  \ key){\n  scores.push(key + '=' + value);\n});\n// scores == ['score=95', 'score=98',\
  \ 'score=92']\n```\n\n表 20.1](#part0034.html_tab01) 列出了全局 API 提供的一些常用工具。你将在书中许多示例中使用它们。\n\
  \n### 创建简单的 AngularJS 应用\n\n现在你已经了 AngularJS 框架的基础组件、AngularJS 的意图和设计以及如何引导 AngularJS，你准备好开始实现代码了。本节将带你通过一个非常简单的\
  \ AngularJS 应用来实现 HTML 模板、控制器、scope 和表达式。\n\n第一步是实现一个基础 Node.js Web 服务器。列表 20.1](#part0034.html_ch20lis01)\
  \ 中的代码显示了一个基础 Node.js Web 服务器，提供以下路由的静态文件：\n\n- `/static`: 映射到目录下的 `./static`，包含静态提供的\
  \ HTML 文档。\n- `/static/js`: 示例所需的 JavaScript。\n- `/static/css`: 示例所需的 CSS。\n- `/images`:\
  \ 映射到项目目录下的 `../images`，提供示例中使用的任何图像。\n\n列表 20.1](#part0034.html_ch20lis01) 中的基础服务器将在后续章节的\
  \ AngularJS 示例中使用。\n\n\n\n\n```javascript\napp.use('/', express.static('./static')).\n\
  use('/images', express.static('../images')).\nuse('/lib', express.static('../lib'));\n\
  app.listen(80);\n```\n\n下一步是实现一个 AngularJS HTML 模板，例如列表 20.2 中的`first.html`，以及一个\
  \ AngularJS JavaScript 模块，例如列表 20.3 中的`first.js`。\n\n后续章节描述了实现 AngularJS 应用的重要步骤以及每一步涉及的代码。这些步骤中的每一个在后面的章节中会有更详细的描述，因此在这里不要纠结于细节。现在重要的是你理解实现模板、模块、控制器和\
  \ `scope` 的过程，以及它们通常是如何相互作用的。\n\n由列表 20.2 和 20.3 定义网页是一个简单的 Web 表单，允许你输入名和姓，然后点击按钮显示消息，如图\
  \ 20.1 所示。\n\n![Image](img/00235.jpeg)\n\n图 20.1 实现一个基础 AngularJS Web 应用，使用输入和按钮操作模型并从而操作视图。\n\
  \n### 加载 AngularJS 库和你的主模块\n\n在实现 AngularJS 应用之前，你需要在 HTML 模板中加载库。列表 20.2 中的以下几行加载了\
  \ `angular.js` 库，然后加载 `first.js` JavaScript 自定义模块。\n\n点击此处查看代码图像\n\n```html\n<script\
  \ src=\"http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n<script src=\"\
  /js/first.js\"></script>\n```\n\n### 定义 AngularJS 根元素\n\n下一步是在根元素中定义 `ng-app` 参数，以便\
  \ AngularJS 知道从哪里开始编译应用程序。你还应该在 JavaScript 代码中定义模块，以便在添加控制器、过滤器和服务时提供一个可使用的命名空间。\n\
  \n列表 20.2 的第 2 行定义了 AngularJS 模块的 DOM 根。注意 `ng-app` 被赋值为模块名称 `firstApp`，它对应于 JavaScript\
  \ 代码中的模块：\n\n```html\n<html ng-app=\"firstApp\">\n```\n\n列表 20.3 的第 1 行显示了在 JavaScript\
  \ 代码中创建 `firstApp` 模块对象：\n\n点击此处查看代码图像\n\n```javascript\nvar firstApp = angular.module('firstApp',\
  \ []);\n```\n\n### 为模板添加控制器\n\n接下来，你需要为 AngularJS 控制的 HTML 元素添加控制器。你还需要在模块代码中定义该控制器。\n\
  \n列表 20.2 的第 7 行将名为 `FirstController` 的控制器分配给 `<div>` 元素。这会将视图中的元素映射到特定的控制器，该控制器包含一个\
  \ `scope`：\n\n点击此处查看代码图像\n\n```html\n<div ng-controller=\"FirstController\">\n```\n\
  \n列表 20.3 的第 2 行显示了将 `FirstController` 代码添加到 `firstApp` 模块中：\n\n点击此处查看代码图像\n\n```javascript\n\
  firstApp.controller('FirstController', function($scope) {\n```\n\n### 实现 Scope 模型\n\
  \n一旦定义了控制器，就可以实现 `scope`，这涉及将 HTML 元素链接到 scope 变量、初始化 scope 中的变量，并提供处理 scope 值更改的功能。\n\
  \n列表 20.2 的第 9 行和第 10 行是 `<input>` 元素，它们被分配给 scope 中的 `first` 和 `last` 值。这些元素提供了从浏览器更新\
  \ scope 方法。如果用户在输入框中输入，scope 也会随之更新：\n\n点击此处查看代码图像\n\n```html\n<input type=\"text\"\
  \ ng-model=\"first\">\n<input type=\"text\" ng-model=\"last\">\n```\n\n列表 20.3 的第\
  \ 3–5 行显示了 scope 值的定义：\n\n点击此处查看代码图像\n\n```javascript\n$scope.first = 'Some';\n\
  $scope.last = 'One';\n$scope.heading = 'Message: ';\n```\n\n列表 20.2 的第 1 行将点击处理程序链接到\
  \ scope 中定义的 `updateMessage()` 函数：\n\n点击此处查看代码图像\n\n```html\n<button ng-click='updateMessage()'>Message</button>\n\
  ```\n\n列表 20.3 的第 6–8 行显示了 scope 中的 `updateMessage()` 定义：\n\n点击此处查看代码图像\n\n```javascript\n\
  $scope.updateMessage = function() {\n  $scope.message = 'Hello ' + $scope.first\
  \ +' $scope.last + '!';\n};\n```\n\n[列表 20.2]的第 13 行实现了一个表达式，在 HTML 页面上显示 scope\
  \ 中 `heading` 和 `message` 变量的值：\n\n点击此处查看代码图像\n\n```html\n{{heading + message}}\n\
  ```\n\n列表 20.2 `first.html`：一个简单的 AngularJS 模板，提供了两个输入元素和一个与模型交互的按钮\n\n点击此处查看代码图像\n\
  \n```html\n<!doctype html>\n<html ng-app=\"firstApp\">\n<head>\n  <title>AngularJS\
  \ App</title>\n</head>\n<body>\n  <div ng-controller=\"FirstController\">\n    <span>Name:</span>\n\
  \    <input type=\"text\" ng-model=\"first\">\n    <input type=\"text\" ng-model=\"\
  last\">\n    <button ng-click='updateMessage()'>Message</button>\n    <hr>\n   \
  \ {{heading + message}}\n  </div>\n  <script src=\"http://code.angularjs.org/1.2.9/angular.min.js\"\
  ></script>\n  <script src=\"/js/first.js\"></script>\n</body>\n</html>\n```\n\n\
  列表 20.3 `first.js`：一个简单的 AngularJS 模块，实现了一个用于支持列表 20.2 模板的控制器\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar firstApp = angular.module('firstApp', []);\nfirstApp.controller('FirstController',\
  \ function($scope) {\n  $scope.first = 'Some';\n  $scope.last = 'One';\n  $scope.heading\
  \ = 'Message: ';\n  $scope.updateMessage = function() {\n    $scope.message = 'Hello\
  \ ' + $scope.first +' $scope.last + '!';\n  };\n});\n```\n\n## 总结\n\nAngularJS 是一个\
  \ JavaScript 库框架，为创建网站和 Web 应用提供了非常有结构的方法。AngularJS 将 Web 应用组织成非常整洁的 MVC 模型。scope\
  \ 作为模型，由基础 JavaScript 对象组成。\n\n在本章中，你查看了 AngularJS 应用的不同组件以及它们是如何相互作用的。你还学习了 AngularJS\
  \ 应用的生命周期，它包括引导、编译和运行阶段。在本章结束时，你通过一个实现基础 AngularJS 应用的逐步示例，包含了模板、模块、控制器和 scope。\n\
  \n### 下节\n\n在下一节中，你将更多地了解模块和依赖注入。你将学习如何在模块中定义提供者，以及如何将提供者的功能注入到其他模块和 AngularJS 组件中。\n\
  \n\n\n\n\n依赖注入允许 AngularJS 模块保持非常整洁、组织化的形态，同时更更容易地访问其他模块的功能。如果实现得当，它往往会大幅减少代码量。\n\
  \n本章将提供依赖注入的基本概述，然后描述如何创建提供功能的模块，以及如何在其他模块以及其他 AngularJS 组件（如控制器）中消费这些功能。\n\n# 模块与依赖注入的概览\n\
  \n在你开始编写 AngularJS 应用程序时，理解 AngularJS 世界中模块和依赖注入的基础知识至关重要。对于某些人来说，这似乎是一个难以理解和正确实现的概念，特别是那些来自更加开放、随心所欲的\
  \ JavaScript 背景的人来说。\n\n本节将向你介绍 AngularJS 模块和依赖注入背后的概念。理解模块如何利用依赖注入访问其他模块的功能，将使你更容易在\
  \ AngularJS 框架内部实现代码。\n\n## 理解模块\n\nAngularJS 模块是容器，允许你将代码模块化并组织成简洁、整洁、可重用的块。模块本身不提供直接功能，但它们包含了其他提供功能的对象实例，例如控制器、过滤器、服务、动画等。\n\
  \n你通过定义它提供的对象来构建模块。然后，通过依赖注入将模块连接在一起，从而构建整个应用程序。\n\nAngularJS 是基于模块原理构建的。AngularJS\
  \ 提供的大部分功能构建在一个名为 `ng` 的模块中，包含了书中使用的大多数指令和服务。\n\n## 依赖注入\n\n依赖注入可能是一个难以掌握的概念。但一旦你理解了基础，AngularJS\
  \ 的实现就会变得非常清晰。依赖注入在许多服务端语言中是一种众知的设计模式，但在 JavaScript 中并不常用。\n\nAngularJS 依赖注入的思想是将依赖动态注入到另一个对象中，使依赖对象提供的功能可用。AngularJS\
  \ 通过使用提供者注入器服务提供依赖注入。\n\n提供者本质上是对具有所有功能的对象的定义。提供者应该定义为模块的一部分。在 AngularJS 应用程序中，只会创建一个提供者的实例。\n\
  \n注入器服务负责跟踪提供者的实例。为每个模块创建一个注入器实例。当提出提供对象的请求时，注入器服务首先检查缓存中是否已存在实例。如果是，则使用该实例。如果在缓存中没有找到实例，则使用提供定义创建一个实例，存储在缓存中并返回。\n\
  \n# 定义模块\n\n现在你已经理解了模块和依赖注入之间的关系，需要查看实现 AngularJS 模块的过程。AngularJS 模块分两个阶段实现：配置阶段和运行阶段。接下来的章节将讨论这些阶段以及向模块添加提供者的基本过程。\n\
  \n## 创建模块对象\n\n创建 AngularJS 模块是一个简单的过程，涉及调用 `angular.module()` 方法。该方法创建一个 `Module`\
  \ 对象实例，将其注册注入器服务，然后返回新创建的 `Module` 对象实例，你可以使用它来实现提供者功能。`angular.module()` 方法使用以下语法：\n\
  \n点击此处查看代码图像\n\n```\nangular.module(name, [requires], [configFn])\n```\n\n`name`\
  \ 参数是注入器服务注册的名称。`requires` 参数是该模块使用的模块名称数组。如果你需要另一个模块的功能，需要在 `requires` 列表中添加它。`ng`\
  \ 模块默认添加到每个实例化的模块中，因此你无需显式指定 `ng` 即可访问 AngularJS 提供者。\n\n所有依赖的实例会自动注入到模块实例中。依赖可以是模块、服务以及注入器服务中注册的任何对象。`configFn`\
  \ 参数是在模块配置期间调用的另一个函数。配置函数将在下一节描述。\n\n以下是一个带有对 `$window` 和 `$http` 服务依赖的 AngularJS\
  \ 模块示例。该定义还包含一个添加名为 `myValue` 的 value 提供者的配置函数：\n\n点击此处查看代码图像\n\n```javascript\n\
  var myModule = angular.module('myModule', ['$window', '$http'], function(){\n  \
  \  $provide.value('myValue', 'Some Value');\n});\n```\n\n如果你没有指定 `requires` 参数，则返回已创建的实例而不是创建一个\
  \ `Module` 对象。例如，以下代码覆盖了上面的实例：\n\n点击此处查看代码图像\n\n```javascript\nvar myModule2 = angular.module('myModule',\
  \ []);\n```\n\n然而，以下代码返回了上面创建的实例，因为参数列表中的 `require` 数组没有列出依赖：\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar myModule3 = angular.module('myModule');\n```\n\n## 使用配置块\n\n\
  AngularJS 模块配置阶段在定义模块时执行。在此阶段，任何提供者都会注册到依赖注入器中。你应该只在配置块内部放置配置和提供者代码。\n\n你通过在 `Module`\
  \ 对象实例上调用 `config()` 方法来实现配置块，使用以下语法：\n\n点击此处查看代码图像\n\n```\nconfig(function([injectable,\
  \ . . .]))\n```\n\n传入一个带有 `injectable` 参数的函数。`injectable` 参数通常是提供者服务函数，例如 `$provide`。\n\
  \n以下是一个基础配置块的示例：\n\n点击此处查看代码图像\n\n```javascript\nvar myModule = angular.module('myModule',\
  \ []).\n  config(function($provide, $filterProvider) {\n    $provide.value(\"startTime\"\
  , new Date());\n    $filterProvider.register('myFilter', function(){});\n  });\n\
  ```\n\n注意 `$provide` 和 `$filterProvider` 服务被传递给 `config` 函数。它们用于注入器服务注册名为 `startTime`\
  \ 的 value provider 和名为 `myFilter` 的 filter provider。\n\n## 使用运行块\n\n一旦整个配置块完成，AngularJS\
  \ 模块的运行阶段就可以执行。在此阶段，你可以实现实例化模块所需的任何代码。在运行块期间你不能实现任何提供者代码，因为到此时整个模块应该已经配置完成并注册到依赖注入器中。\n\
  \n你通过在 `Module` 对象上调用 `run()` 方法来实现运行块，使用以下语法：\n\n点击此处查看代码图像\n\n```\nrun(function([injectable,\
  \ . . .]))\n```\n\n传入一个带有实例 `injectable` 参数的函数。`injectable` 参数应该是注入器的实例，因为配置应该已经完成。\n\
  \n\n\n\n以下是接上示例中 `run` 块的简单实现：\n\n点击此处查看代码图像\n\n```\nmyModule.run(function(startTime)\
  \ {\n  startTime.setTime((new Date()).getTime());\n});\n```\n\n注意，在上方 `config()`\
  \ 部分定义的 `startTime` 实例被传递到 `run()` 函数。这允许 `run()` 函数将 `startTime` 提供者更新为新值。\n\n\
  ## 在 AngularJS 模块中添加提供者\n\n`Module` 对象提供了几个辅助方法，用于作为 `config()` 方法的替代方案来添加提供者。这些方法更加简单，且在代码中更清晰。你可以向\
  \ AngularJS 模块添加两种类型的提供者对象。这些方法每个都接受两个参数：将注册到依赖注入器中的名称，以及定义如何构建特定对象的提供者函数。接下来的章节将详细介绍这些方法。\n\
  \n### 特定的 AngularJS 对象提供者\n\n`Module` 对象提供了特殊的构造方法，用于为你在模块中需要实现的 AngularJS 对象添加提供者。这些特殊方法允许你为以下类型的对象添加定义：\n\
  \n![Image](img/00003.jpeg) animation(name, animationFactory)\n\n![Image](img/00003.jpeg)\
  \ controller(name, controllerFactory)\n\n![Image](img/00003.jpeg) filter(name, filterFactory)\n\
  \n![Image](img/00003.jpeg) directive(name, directiveFactory)\n\n这些之所以是特殊方法，是因为 AngularJS\
  \ 中为这些提供者方法定义了相应的 `animation`、`controller`、`filter` 和 `directive` 对象。\n\n这些每个对象将在后面的章节中有更详细的介绍。现在，让我们快速查看一个基本的控制器的定义：\n\
  \n点击此处查看代码图像\n\n```\nvar mod = angular.module('myMod', []);\n\nmod.controller('myController',\
  \ function($scope) {\n  $scope.someValue = 'Some Value';\n});\n```\n\n创建了一个名为 `mod`\
  \ 的简单模块，然后调用 `controller()` 方法并传入 `myController` 以及一个 `controllerFactory` 函数。`controllerFactory`\
  \ 函数接受 `$scope` 变量作为参数。这是因为 AngularJS 有内置的控制器对象，并且知道所有控制器对象必须接收一个范围对象作为第一个参数。\n\n\
  ### 服务提供者\n\n服务提供者是一类独特的提供者，因为对于生成的提供者对象，还没有特定的格式。相反，提供者充当一种服务来提供功能。AngularJS 提供了一些用于构建服务的特定创建方法，并通过以下方法暴露它们：\n\
  \n![Image](img/00003.jpeg) **value(name, object):** **这是所有提供者中最基本的。** `object` 参数直接被赋值给\
  \ `name`，因此注入器中的 `name` 值与 `object` 值之间存在直接对应。\n\n![Image](img/00003.jpeg) **constant(name,\
  \ object):** 这与 `value()` 方法类似，但值是不可变的。此外，`constant()` 方法在其他提供者方法之前应用。\n\n![Image](img/00003.jpeg)\
  \ **factory(name, factoryFunction):** 此方法使用 `factoryFunction` 参数来构建一个将由注入器提供的对象。\n\
  \n![Image](img/00003.jpeg) **service(name, serviceFactory):** 此方法在提供者对象中引入了实现更面向对象的方法的概念。AngularJS\
  \ 的许多内置功能是通过服务提供者提供的。\n\n![Image](img/00003.jpeg) **provider(name, providerFactory):**\
  \ 此方法是所有其他方法的核心。虽然它提供了最多的功能，但并不频繁使用，因为其他方法更简单。\n\n后面的章节将更详细地介绍这些对象。现在，这里有一些基本的 `value`\
  \ 和 `constant` 定义的简单示例：\n\n点击此处查看代码图像\n\n```\nvar mod = angular.module('myMod',\
  \ []);\n\nmod.constant(\"cID\", \"ABC\");\n\nmod.value('counter', 0);\n\nmod.value('image',\
  \ {name:'box.jpg', height:12, width:20});\n```\n\n创建了一个名为 `mod` 的简单模块，然后定义了 `constant()`\
  \ 和两个 `value()` 提供者。在这些方法中定义的值注册在 `myMod` 模块的注入器服务器中，然后可以通过名称访问。\n\n## 实现依赖注入\n\n\
  一旦定义了模块和适当的提供者，你就可以将模块作为依赖项添加到其他模块、控制器以及各种 AngularJS 对象中。你需要设置依赖于提供者的对象的 `$inject`\
  \ 属性值。`$inject` 属性包含一个应该注入到它的提供者名称数组。\n\n例如，以下代码定义了一个接受 `$scope` 和 `appMsg` 参数的基本控制器。然后，将\
  \ `$inject` 属性设置为一个包含 `$scope` 的数组，`$scope` 是 AngularJS 的范围服务，用于提供对范围和自定义 `appMsg`\
  \ 的访问。`$scope` 和 `appMsg` 都被注入到 `myController` 函数中：\n\n点击此处查看代码图像\n\n```\nvar myController\
  \ = function($scope, appMsg) {\n  $scope.message = appMsg;\n};\n```\n\n\n\n\n```html\n\
  {{message}}\n</div><hr>\n<div ng-controller=\"controllerB\">\n  <h2>模块消息：</h2>\n\
  \  {{message}}\n</div>\n<script src=\"http://code.angularjs.org/1.2.9/angular.min.js\"\
  ></script>\n<script src=\"/js/injector.js\"></script>\n</body>\n</html>\n```\n\n\
  ![Image](img/00236.jpeg)\n\n图 21.1 实现依赖注入以为模块和控制器提供额外功能。\n\n## 总结\n\n依赖注入（Dependency\
  \ injection）允许你定义可以注入到其他 AngularJS 组件中的提供者（provider）功能。这些提供者功能包含在模块内部，并与注入器服务（injector\
  \ service）注册。提供者定义了如何构建这些功能，以便当另一个组件对某个提供者定义依赖时，可以创建并注入提供对象的实例。\n\nAngular 提供了一个相当健壮的依赖注入模型，允许你定义不同类型的服务提供者。使用依赖注入而不是全局定义可以让你的代码更具模块化且易于维护。在本章中，你已经接触了依赖注入模型，并看到了如何在模块和控制器组件中实现它。\n\
  \n### 接下来\n\n在下一章中，你将更深入研究作用域（scopes）以及如何在其中应用事件。你将学习控制器功能以及它与作用域的关系。你还将学习如何嵌套作用域，以使模型与视图匹配得更加紧密。\n\
  \n## 22. 将作用域实现数据模型\n\nAngularJS 应用中最重要的方面之一是作用域（scope）。作用域不仅提供了模型表示的数据，还将 AngularJS\
  \ 应用的所有其他组件绑定在一起，例如模块、控制器、服务和模板。本章解释了作用域与其它 AngularJS 组件之间的关系。\n\n作用域提供了绑定机制，允许当模型数据发生变化时，DOM\
  \ 元素和其他代码进行更新。在本章中，你将学习作用域层级以及如何通过事件在它们之间进行通信。\n\n### 理解作用域\n\n在 AngularJS 中，作用域充当应用程序的数据模型。它是任何以方式依赖数据的应用程序中最关键的部分之一，因为它是将视图、业务逻辑和服务器端数据结合在一起的胶水。理解作用域的工作原理让你能够设计出更高效、代码更少且易于的\
  \ AngularJS 应用程序。\n\n接下来的章节将讨论作用域与应用程序、控制器、模板和服务器端数据之间的关系。还存在部分涵盖了作用域的生命周期，帮助你了解作用域在应用程序生命周期是如何构建、操作和更新的。\n\
  \n#### 根作用域与应用程序之间的关系\n\n当应用程序启动（bootstrapped）时，会创建一个根作用域（root scope）。根作用域在应用级别存储数据，你可以通过\
  \ `$rootScope` 服务访问它。根作用域数据应该在模块的 `run()` 块中初始化，你你可以在模块的组件中访问它。为了说明这一点，以下代码在根作用域级别定义了一个值，然后在控制器中访问它：\n\
  \n点击查看代码图片\n\n```javascript\nangular.module('myApp', [])\n.run(function($rootScope)\
  \ {\n    $rootScope.rootValue = 5;\n})\n.controller('myController', function($scope,\
  \ $rootScope) {\n  $scope.value = 10;\n  $scope.difference = function() {\n    \
  \  return $rootScope.rootValue - $scope.value;\n  };\n});\n```\n\n#### 作用域与控制器之间的关系\n\
  \n控制器是旨在通过增强作用域来提供业务逻辑的代码段。你通过使用应用程序 `Model` 对象上的 `controller()` 方法来创建控制器。该函数将控制器注册为模块中的一个提供者，但它不会创建控制器的实例。实例化发生在\
  \ `ng-controller` 指令在 AngularJS 模板中链接（linked）时。\n\n`controller()` 方法接受控制器名称作为第一个参数，并将依赖数组作为第二个参数。例如，以下代码定义了一个使用依赖注入来访问名为\
  \ `start` 的 `value` 提供者的控制器：\n\n点击查看代码图片\n\n```javascript\nangular.module('myApp',\
  \ []).\n  value('start', 200).\n  controller('Counter', ['$scope', 'start',\n  \
  \                             function($scope, startingValue) {\n  }]);\n```\n\n\
  当 AngularJS 中创建一个控制器的新实例时，也会创建一个特定于该控制的新子作用域，并可以通过注入到上述 `Counter` 控制器的 `$scope`\
  \ 服务进行访问。在上面的示例中，`start` 提供者被注入到控制器，并作为 `startingValue` 传递给控制器函数。\n\n控制器必须初始化创建并添加到其上的作用域状态。控制器还负责附加到该作用域的任何业务逻辑。这可能意味着处理作用域的更新更改、操作作用域值或根据作用域的状态发射事件。\n\
  \n列表 22.1 显示了如何实现一个利用依赖注入、初始化某些值并使用 `inc()`、`dec()` 和 `calcDiff()` 函数实现基础业务逻辑的控制器。\n\
  \n列表 22.1 `scope_controller.js`: 实现一个使用依赖注入、初始化作用域值并实现业务逻辑的基础控制器**\n\n点击查看代码图片\n\
  \n```javascript\n01 angular.module('myApp', []).\n02   value('start', 200).\n03\
  \   controller('Counter', ['$scope', 'start',\n04                              \
  \ function($scope, startingValue) {\n05   $scope.start = start;\n06   $scope.current\
  \ = start;\n07   $scope.difference = 0;\n08   $scope.change = 1;\n09   $scope.inc\
  \ = function() {\n10     $scope.current += $scope.change;\n11     $scope.calcDiff();\n\
  12   };\n13   $scope.dec = function() {\n14     $scope.current -= $scope.change;\n\
  15     $scope.calcDiff();\n16   };\n17   $scope.calcDiff = function() {\n18    \
  \ $scope.difference = $scope.current - start;\n19   };\n20 }]);\n```\n\n#### 作用域与模板之间的关系\n\
  \n模板为 AngularJS 应用提供视图。使用 `ng-controller` 属性定义控制器。在控制器 HTML 元素及其子元素内部，该控制器的作用域用于表达式和其他\
  \ AngularJS 功能。\n\n作用域中的值可以使用 `ng-model` 指令直接链接到模板中的 `<input>``<select>` 和 `<textarea>`\
  \ 元素。该指令将元素的值链接到作用域中的属性名。当用户更改元素的值时，作用域会自动更新。例如，以下代码将数字 `<input>` 元素的值链接到名为 `valueA`\
  \ 的作用域：\n\n点击查看代码图片\n\n```html\n<input type=\"number\" ng-model=\"valueA\" />\n\
  ```\n\n你可以使用 `{{expression}}` 语法向模板表达式添加作用域属性甚至函数。括号内的代码会被评估，结果显示在渲染视图中。例如，如果作用域包含名为\
  \ `valueA` 和 `valueB` 的属性，你可以在模板的表达式中引用这些属性，如下：\n\n```html\n{{valueA + valueB}}\n\
  ```\n\n在模板中定义 AngularJS 指令时，也可以使用作用域属性和函数。例如，`ng-click` 指令将浏览器点击事件绑定到作用域中的 `addValues()`\
  \ 函数，并将作用域属性 `valueA` 和 `valueB` 的值传递给它：\n\n点击查看代码图片\n\n\n\n\n\n<span ng-click=\"\
  addValues(valueA, valueB)\">Add Values{{valueA}} & {{valueB}}</span>\n\n注意，在这段代码中，`{{}}`\
  \ 括号是必要的。然而，在 `addValues()` 函数调用中，它们并不是必需。这是因为 `ng-click` 和其他 AngularJS 指令会自动求值作为表达式。\n\
  \n列表 22.2 和列表 22.3 中的代码在一个非常基础的示例中将所有概念整合在一起，以便于理解模型（model）和作用域（scope）之间的关系。列表 22.2\
  \ 实现了一个名为 `SimpleTemplate` 的控制器，它初始化了一个带有三个值的作用域：`valueA`、`valueB` 和 `valueC`。作用域还包含一个名为\
  \ `addValues()` 的函数，该函数接受两个参数并将相加以设置 `$scope.valueC` 的值。\n\n列表 22.3 实现了一个模板，该模板初始化了在列表\
  \ 22.2](#part0036.html_ch22lis02)中定义的 `SimpleTemplate` 控制器。第 8 行和第 9 行通过 `ng-model`\
  \ 将作用域属性 `valueA` 和 `valueB` 绑定到 `<input>` 元素。第 10 行相加作用域中的 `valueA` 和 `valueB`\
  \ 以显示加后的值。\n\n第 11 行和第 12 行实现了一个 `<input>` 元素，它使用 `ng-click` 将浏览器点击事件绑定到作用域中的 `addValues()`\
  \ 函数。注意 `valueA` 和 `valueB` 是作为参数传递给函数的。\n\n图 22.1 展示了在 Web 浏览器中的此简单应用程序。当两个输入元素发生变化时，表达式会自动变化。然而，`valueC`\
  \ 表达式只有在点击 `Click to Add Values` 元素时才会变化。\n\n### 列表 22.2 scope_template.js: 实现支持模板功能的基础控制器\n\
  \n点击此处查看代码图片\n\n```javascript\n01 angular.module('myApp', []).\n02    controller('SimpleTemplate',\
  \ function($scope) {\n03      $scope.valueA = 5;\n04      $scope.valueB = 7;\n05\
  \      $scope.valueC = 12;\n06      $scope.addValues = function(v1, v2) {\n07  \
  \      var v = angular.$rootScope;\n08        $scope.valueC = v1 + v2;\n09     \
  \ };\n10    });\n```\n\n### 列表 22.3 scope_template.html: 实现控制器及链接作用域的各种 HTML 字段的\
  \ HTML 模板代码\n\n点击此处查看代码图片\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\"\
  >\n03    <head>\n04      <title>AngularJS Scope and Templates</title>\n05    </head>\n\
  06    <body>\n07      <div ng-controller=\"SimpleTemplate\">\n08        ValueA:\
  \ <input type=\"number\" ng-model=\"valueA\" /><br>\n09        ValueB: <input type=\"\
  number\" ng-model=\"valueB\" /><br><br>\n10        Expression Value: {{valueA +\
  \ valueB}}<br><br>\n11        <input type=\"button\" ng-click=\"addValues(valueA,\
  \ valueB)\"\n12          value =\"Click to Add Values {{valueA}} & {{valueB}}\"\
  \ /><br>\n13        Clicked Value: {{valueC}}<br>\n14      </div>\n15      <script\
  \ src=\"http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n16      <script\
  \ src=\"/js/scope_template.js\"></script>\n17    </body>\n18 </html>\n```\n\n![Image](img/00237.jpeg)\n\
  \n图 22.1 一个基础 AngularJS 模板，它实现了一个控制器并将多个字段链接到作用域，以提供值的输入和结果显示。\n\n#### 作用域与后端数据的关系\n\
  \n通常 `{{}}` 括号是必要的。然而，在 `addValues()` 函数调用中，它们并不是必需。这是因为 `ng-click` 和其他 AngularJS\
  \ 指令会自动求值作为表达式。\n\n列表 22.2 和列表 22.3 中的代码在一个非常基础的示例中将所有概念整合在一起，以便于理解模型（model）和作用域（scope）之间的关系。列表\
  \ 22.2 实现了一个名为 `SimpleTemplate` 的控制器，它初始化了一个带有三个值的作用域：`valueA`、`valueB` 和 `valueC`。作用域还包含一个名为\
  \ `addValues()` 的函数，该函数接受两个参数并将相加以设置 `$scope.valueC` 的值。\n\n列表 22.3 实现了一个模板，该模板初始化了在列表\
  \ 22.2](#part0036.html_ch22lis02)中定义的 `SimpleTemplate` 控制器。第 8 行和第 9 行通过 `ng-model`\
  \ 将作用域属性 `valueA` 和 `valueB` 绑定到 `<input>` 元素。第 10 行相加作用域中的 `valueA` 和 `valueB`\
  \ 以显示加后的值。\n\n第 11 行和第 12 行实现了一个 `<input>` 元素，它使用 `ng-click` 将浏览器点击事件绑定到作用域中的 `addValues()`\
  \ 函数。注意 `valueA` 和 `valueB` 是作为参数传递给函数的。\n\n图 22.1 展示了在 Web 浏览器中的此简单应用程序。当两个输入元素发生变化时，表达式会自动变化。然而，`valueC`\
  \ 表达式只有在点击 `Click to Add Values` 元素时才会变化。\n\n#### 作用域生命周期\n\n作用域数据经过以下阶段：\n\n1.\
  \ 创建（Creation）\n2. 监听器注册（Watcher registration）\n3. 模型突变（Model mutation）\n4. 变更观察（Mutation\
  \ observation）\n5. 销毁（Destruction）\n\n##### 创建阶段\n\n创建阶段发生在作用域初始化时。当遇到 `ng-controller`\
  \ 和 `ng-repeat` 指令时，链接会创建子作用域。同样在创建阶段，会创建一个消化循环。消化循环负责根据模型更新 DOM 元素。尽管你不应该手动执行消化循环，但可以通过执行\
  \ `$digest()` 来。例如，以下代码执行任何监听函数：\n\n```javascript\nscope.$digest()\n```\n\n#####\
  \ 监听器注册阶段\n\n模板链接注册作用域中的值。这些监听会自动传播模型变化。你也可以通过 `$watch()` 方法在作用域值上注册自己的监听函数。该方法接受作用域属性作为第一个参数，回调函数作为第二个参数。当属性更改时，旧值和新值将传递给回调函数。\n\
  \n例如，以下代码为作用域中的 `watchedItem` 添加监听并在每次更改时增加计数器：\n\n点击此处查看代码图片\n\n```javascript\n\
  $scope.watchedItem = 'myItem';\n\n$scope.counter = 0;\n\n$scope.$watch('name', function(newValue,\
  \ oldValue) {\n  $scope.watchedItem = $scope.counter + 1;\n});\n```\n\n##### 模型突变阶段\n\
  \n模型突变阶段发生在作用域数据变化时。当你在 AngularJS 代码中进行更改时，名为 `$apply()` 的作用域函数会更新模型并调用 `$digest()`\
  \ 函数来更新 DOM 和监听器。这就是 AngularJS 控制器或通过 `$http`、`$timeout` 和 `$interval` 服务进行的更改自动更新\
  \ DOM 的方式。\n\n你应该始终尝试在 AngularJS 控制器或这些服务内部进行更改。然而，如果你必须在 AngularJS 之外更改作用域，需要在作用域上调用\
  \ `scope.$apply()` 来强制正确更新模型和 DOM。`$apply()` 方法接受表达式作为唯一的参数。表达式会被求值并调用 `$digest()`\
  \ 方法。\n\n##### 变更观察阶段\n\n变更观察阶段发生在消化循环执行、`$apply()` 调用或手动执行消化循环时。当 `$digest()` 执行时，它会评估所有监听器的更改。如果值已经发生变化，`$digest()`\
  \ 将调用 `$watch` 监听并更新 DOM。\n\n\n\n\n\n`$destroy()` 方法从浏览器内存中移除作用域。AngularJS 库在子作用域不再需要时会自动调用此方法。`$destroy()`\
  \ 方法会停止 `$digest()` 调用并移除监听（watches），允许浏览器垃圾回收器回收内存。\n\n### 实现作用域层次结构\n\n作用域的一个强大特性是它们按层次结构组织。这种层次结构有助于你保持作用域组织有序，并与它们所代表的视图上下文相关。此外，`$digest()`\
  \ 方法使用作用域层次结构将范围的变化传递给相应的监听器和 DOM 元素。\n\n作用域层次结构根据 AngularJS 模板中 `ng-controller`\
  \ 语句的位置自动创建。例如，以下模板代码定义了两个 `<div>` 元素，它们创建了兄弟关系的控制器实例：\n\n点击此处查看代码图片\n\n```html\n\
  <div ng-controller=\"controllerA\"> . . . </div>>\n<div ng-controller=\"controllerB\"\
  > . . . </div>>\n```\n\n然而，以下模板代码定义的控制器中，`controllerA` 是 `controllerB` 的父级：\n\n\
  点击此处查看代码图片\n\n```html\n<div ng-controller=\"controllerA\">\n  <div ng-controller=\"\
  controllerB\"> . . . </div>\n</div>>\n```\n\n你可以从控制器访问父级作用域的值，但无法访问兄弟或子作用域的值。如果你在子作用域中添加一个属性名，它不会覆盖父级，而是在子作用域中创建一个同名的属性，其值与父级不同。\n\
  \n列表 22.4 和 22.5 实现了一个基础的作用域层次结构，以演示作用域在层次结构中是如何工作的。列表 22.4 创建了一个包含三个控制器的应用程序，每个控制器定义了两个作用域项。它们都共享公共的作用域属性\
  \ `title` 以及作用域属性 `valueA`、`valueB` 和 `valueC`。\n\n列表 22.5 在 AngularJS 模板中创建了三个控制器。图\
  \ 22.2 显示了渲染后的 AngularJS 应用程序。注意三个作用域中 `title` 属性的值是不同的。这是因为层次结构中的每一层都创建了新的 `title`\
  \ 属性。\n\n![图像](img/00238.jpeg)\n\n图 22.2 实现了一个从多级作用域渲染结果的控制器层次结构。\n\n代码第 17–19 行显示了\
  \ `valueA`、`valueB` 和 `valueC` 属性。这些值是从作用域层次结构的三个不同级别读取的。应用程序显示，当你增加父级作用域中的值时，子控制器中的\
  \ DOM 元素会用新值更新。\n\n**列表 22.4 scope_hierarchy.js: 实现一个基础的作用域层次结构，并访问每层级的属性**\n\n\
  点击此处查看代码图片\n\n```javascript\n01 angular.module('myApp', []).\n02    controller('LevelA',\
  \ function($scope) {\n03      $scope.title = \"Level A\"\n04      $scope.valueA\
  \ = 1;\n05      $scope.inc = function() {\n06        $scope.valueA++;\n07      };\n\
  08    }).\n09    controller('LevelB', function($scope) {\n10      $scope.title =\
  \ \"Level B\"\n11      $scope.valueB = 1;\n12      $scope.inc = function() {\n13\
  \        $scope.valueB++;\n14      };\n15    }).\n16    controller('LevelC', function($scope)\
  \ {\n17      $scope.title = \"Level C\"\n18      $scope.valueC = 1;\n19      $scope.inc\
  \ = function() {\n20        $scope.valueC++;\n21      };\n22    });\n```\n\n**列表\
  \ 22.5 scope_hierarchy.html: 实现控制器层次结构并渲染多级作用域结果的 HTML 模板代码**\n\n点击此处查看代码图片\n\n\
  ```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04 <title>AngularJS\
  \ Scope Hierarchy</title>\n05 </head>\n06 <body>\n07   <div ng-controller=\"LevelA\"\
  >\n08     <h3>{{title}}</h3>\n09     ValueA = {{valueA}} <input type=\"button\"\
  \ ng-click=\"inc()\" value=\"+ />\n10     <div ng-controller=\"LevelB\"><hr>\n11\
  \       <h3>{{title}}</h3>\n12       ValueA = {{valueA}}<br>\n13       ValueB =\
  \ {{valueB}}\n14       <input type=\"button\" ng-click=\"inc()\" value=\"+ />\n\
  15       <div ng-controller=\"LevelC\"><hr>\n16         <h3>{{title}}</h3>\n17 \
  \        ValueA = {{valueA}}<br>\n18         ValueB = {{valueB}}<br>\n19       \
  \  ValueC = {{valueC}}\n20         <input type=\"button\" ng-click=\"inc()\" value=\"\
  + />\n21       </div>\n22     </div>\n23   </div>\n24   <script src=\"http://angularjs.org/1.2.9/angular.min.js\"\
  ></script>\n25   <script src=\"/js/scope_hierarchy.js\"></script>\n26 </body>\n\
  27 </html>\n```\n\n### 发布和广播事件\n\n作用域的一个强大特性是在作用域层次结构内发射（emit）和广播（broadcast）事件。事件允许你向作用域的不同级别发送事件已发生的通知。事件可以是你选择任何内容，例如值改变或达到阈值。这在许多情况下非常有用，例如让子作用域知道父作用域中的值发生了变化，反之亦然。\n\
  \n从作用域发射事件，使用 `$emit()` 方法。该方法通过父作用域层次结构向上发送事件。任何注册了该事件的祖先作用域都会收到通知。`$emit()` 使用以下语法，其中\
  \ `name` 是事件名称，`args` 是传递给事件函数的零或多个参数：\n\n`scope.$emit(name, [args, ...])`\n\n你也可以使用\
  \ `$broadcast()` 方法通过子作用域层次结构向下广播事件。任何注册了该事件的后代作用域都会收到通知。`$broadcast()` 使用以下语法，其中\
  \ `name` 是事件名称，`args` 是传递给事件函数的零或多个参数：\n\n`scope.$broadcast(name, [args, ...])`\n\
  \n要处理发射或广播的事件，使用 `$on()` 方法。`$on()` 使用以下语法，其中 `name` 是要监听的事件名称：\n\n`scope.$on(name,\
  \ listener)`\n\n`listener` 参数是一个函数，它接受事件作为第一个参数，并将由 `$emit()` 或 `$broadcast()` 方法传递的任何参数作为后续参数。`event`\
  \ 对象具有以下属性：\n\n- `targetScope`: 调用 `$emit()` 或 `$broadcast()` 的作用域。\n- `currentScope`:\
  \ 当前正在处理事件的作用域。\n- `name`: 事件的名称。\n- `stopPropagation()`:阻止事件在作用域层次结构中向上或向下传播的函数。\n\
  - `preventDefault()`:阻止默认行为的函数，但只执行你自定义的代码。\n- `defaultPrevented`: 如果调用了 `event.preventDefault()`，则为布尔值\
  \ true。\n\n列表 22.6 和 22.7 阐述了使用 `$emit()`、`$broadcast()` 和 `$on()` 在作用域层次结构发送和处理事件。在列表\
  \ 22.6 中，第 2–15 行实现了一个名为 `Characters` 的父作用域，第 16–28 行定义了一个名为 `Character` 的子作用域。\n\
  \n在列表 22.6 中，`changeName()` 函数更改了 `currentName` 值，然后广播了 `CharacterChanged` 事件。`CharacterChanged`\
  \ 事件在第 22–24 行使用 `$on()` 方法进行处理，并设置作用域中的 `currentInfo` 值，这将更新页面元素。\n\n\n\n\n\n注意列表\
  \ 22.6 中的第 6 行使用了 `this` 关键字来访问 `name` 属性。`name` 属性实际上来自于一个动态子作用域，该作用域的创建是因为在列表\
  \ 22.7 中使用以下指令生成了多个元素。 `this` 关键字从作用域中的 `changeName()` 方法访问子作用域：\n\n```html\nng-repeat=\"\
  name in names\"\nng-click=\"changeName()\"\n```\n\n列表 22.6 中的第 9–14 行实现了 `CharacterDeleted`\
  \ 事件的处理器，该处理器从 `names` 属性中移除字符 `name`。第 27 行的子控制器通过 `$broadcast()` 广播此事件。\n\n列表\
  \ 22.7 中的 AngularJS 模板代码实现了嵌套的 `ng-controller` 语句，这些语句生成了作用域层次结构并显示了字符的作用域值。这段代码还包含了一些非常基础的\
  \ CSS 样式，使 span 看起来像按钮，并在页面上定位元素。图 22.3 显示了生成的网页。当你点击字符名称时，会显示该字符的信息；当你点击 Delete\
  \ 按钮时，字符将从按钮和 Info 部分被删除。\n\n### 列表 22.6 scope_events.js：在作用域层次结构中实现 $emit() 和 $broadcast()\
  \ 事件\n\n点击此处查看代码图片\n\n```javascript\n01 angular.module('myApp', []).\n02    controller('Characters',\
  \ function($scope) {\n03      $scope.names = ['Frodo', 'Aragorn', 'Legolas', 'Gimli'];\n\
  04      $scope.currentName = $scope.names[0];\n05      $scope.changeName = function()\
  \ {\n06        $scope.currentName = this.name;\n07        $scope.$broadcast('CharacterChanged',\
  \ this.name);\n08      };\n09      $scope.$on('CharacterDeleted', function(event,\
  \ removeName){\n10        var i = $scope.names.indexOf(removeName);\n11        $scope.names.splice(i,\
  \ 1);\n12        $scope.currentName = $scope.names[0];\n13        $scope.$broadcast('CharacterChanged',\
  \ $scope.currentName);\n14      });\n15    }).\n16    controller('Character', function($scope)\
  \ {\n17      $scope.info = {'Frodo':{weapon:'Sting', race:'Hobbit'},\n18       \
  \                   'Aragorn':{weapon:'Sword', race:'Man'},\n19                \
  \          'Legolas':{weapon:'Bow', race:'Elf'},\n20                          'Gimli':{weapon:'Axe',\
  \ race:'Dwarf'}};\n21      $scope.currentInfo = $scope.info['Frodo'];\n22      $scope.$on('CharacterChanged',\
  \ function(event, newCharacter){\n23        $scope.currentInfo = $scope.info[newCharacter];\n\
  24      });\n25      $scope.deleteChar = function() {\n26        delete $scope.info[$scope.currentName];\n\
  27        $scope.$emit('CharacterDeleted', $scope.currentName);\n28      };\n29\
  \    });\n```\n\n### 列表 22.7 scope_events.html：用于列表 22.6 控制器的渲染作用域层次结构的 HTML 模板代码\n\
  \n点击此处查看代码图片\n\n```html\n01 <!doctype html\n02 <html ng-app=\"myApp\">\n03   <head>\n\
  04    <title>AngularJS Scope Events</title>\n05    <style>\n06    div{padding:5px;\
  \ font:18px;}\n07    span{padding:3px; margin:12px; border:5px;\n08    cursor:pointer;}\n\
  09    label{padding:2px; margin:5px; font:15px;}\n10    p{padding-left:22px; margin:5px;\
  \ }\n11  </style>\n12 </head>\n13 <body>\n14   <div ng-controller=\"Characters\"\
  >\n15    <span ng-repeat=\"name in names\"\n16    ng-click=\"changeName()\">{{name}}</span\n\
  17    <div ng-controller=\"Character\"><hr>\n18      <label>Name: </label><p>{{currentName}}</p>\n\
  19      <label>Race: </label><p>{{currentInfo.race}}</p>\n20      <label>Weapon:\
  \ </label><p>{{currentInfo.weapon}}</p>\n21      <span ng-click=\"deleteChar()\"\
  >Delete</span\n22  </div>\n23  </div>\n24  <script src=\"http://angularjs.org/1.2.9/angular.min.js\"\
  ></script>\n25  <script src=\"/js/scope_events.js\"></script>\n26 </body>\n27 </html>\n\
  ```\n\n![Image](img/029.jpeg)\n图 22.3 使用 $broadcast() 和 $emit() 通过作用域发送\n\n## 总结\n\
  作用域是 AngularJS 应用中表达式的定义。它与视图、控制器和服务相关联。作用域组织成层次结构，根作用域通过 `{{}}` 括号进行定义。你可以在作用域内发射或广播事件，并实现对这些事件的处理。\n\
  \n### 下节\n在接下来的章节中，你将更深入地了解如何使用模板创建视图。你将学习内置表达式和过滤器，以及如何创建自定义版本。\n\n## 23. 使用 AngularJS\
  \ 模板创建视图\nAngularJS 模板提供了一个向用户展示视图的框架。模板包含表达式、过滤器和指令，用于定义 DOM 元素。模板构建在 HTML 之上，通过添加额外的元素和属性来扩展其功能。\n\
  \n本章将关注模板以及表达式和过滤器。表达式允许你在 HTML 代码旁编写类似于 JavaScript 代码。过滤器允许你在显示数据之前对其进行处理。\n\n\
  ## 理解模板\nAngularJS 模板非常简单，但非常强大且易于扩展。模板基于标准 HTML 文，但通过三个额外的组件扩展了 HTML 功能：\n\n- **表达式**：在作用域上下文中执行的类\
  \ JavaScript 代码段。表达式由 `{{}}` 括号表示。表达式的结果会被添加到编译后的 HTML 网页中。表达式可以放在普通的 HTML 文本中，也可以放在属性值中，如下：\n\
  \n```html\n<p>{{1+2}}</p>\nhref=\"/myPage.html/{{hash}}\"\n```\n- **过滤器**：转换网页数据的显示。例如，过滤器可以将作用域中的数字转换为货币字符串或时间字符串。\n\
  - **指令**：HTML 元素内部的新元素名称或属性名称。它们添加并修改 HTML 元素的行为，为 AngularJS 应用提供数据绑定、事件处理和其他支持。\n\
  \n以下代码片段展示了指令、表达式和过滤器的示例。`ng-model=\"msg\"` 属性是一个指令，它将 `<input>` 元素的值绑定到作用域中的 `msg`。`{{}}`\
  \ 括号中的代码是一个表达式，应用了 `uppercase` 过滤器：\n\n```html\n<div>\n  <input ng-model=\"msg\"\
  >\n  {{msg | uppercase}}\n</div>\n```\n\n\n\n\n\n在编译期间，HTML 标签和属性会被归一化，以支持 AngularJS\
  \ 区分大小写而 HTML 不区分这一事实。归一化主要做了两件事：\n\n![Image](img/00003.jpeg) 移除元素和属性开头的 `x-` 和\
  \ `data-` 前缀。\n\n![Image](img/00003.jpeg) 将带有 `:`、`-` 或 `_` 的名称转换为驼峰命名法（camelCase`）。\n\
  \n例如，以下所有内容都会归一化为 `ngModel`：\n\n- `ng-model`\n- `data-ng-model`\n- `x-ng:model`\n\
  - `ng_model`\n\n## 使用表达式\n\n使用表达式是在 AngularJS 视图中表示作用域（scope）数据最简单的方法。表达式是封装在括号内的代码代码块：`{{expression}}`。AngularJS\
  \ 编译器会将表达式编译为 HTML 元素，以便表达式的结果能够显示出来。例如，查看以下表达式：\n\n```\n{{1+5}}\n{{'One' + 'Two'}}\n\
  ```\n\n基于这些表达式，网页将显示这些值：\n\n6\nOneTwo\n\n表达式被绑定到数据模型，这提供了两个巨大的优势。首先，你可以在表达式中使用作用域中定义的属性名和函数。其次，因为表达式绑定到作用域，当作用域中的数据发生变化时，表达式也会之变化。例如，假设作用域包含以下值：\n\
  \n```\n$scope.name='Brad';\n$scope.score=95;\n```\n\n你可以像下面在模板表达式中直接引用 name 和 score\
  \ 值：\n\nName: {{name}}\nScore: {{score}}\nAdjusted: {{score+5}}\n\nAngularJS 表达式在多个方面与\
  \ JavaScript 表达式相似，但在以下方面有所不同：\n\n![Image](img/00003.jpeg) **属性求值：** 属性名相对于作用域模型求值，而不是相对于全局\
  \ JavaScript 命名空间。\n\n![Image](img/00003.jpeg) **更宽容性：** 表达式在遇到 undefined 或 null\
  \ 变量类型时不会抛出异常；相反，它们将这些视为没有值。\n\n![Image](img/00003.jpeg) **无流程控制：** 表达式不允许 JavaScript\
  \ 条件或循环。此外，你不能在表达式内部抛出错误。\n\nAngularJS 将用于定义指令值的字符串作为表达式进行求值。这允许你在定义中包含表达式类型的语法。例如，当你在模板中设置\
  \ `ng-click` 指令的值时，你指定了一个表达式。在该表达式内部，你可以引用作用域变量并使用其他表达式语法，如下所示：\n\n点击此处查看代码图片\n\n\
  ```html\n<span ng-click=\"scopeFunction()\"></span>\n<span ng-click=\"scopeFunction(scopeVariable,\
  \ 'stringParameter')\"></span>\n<span ng-click=\"scopeFunction(5*scopeVariable)\"\
  ></span>\n```\n\n由于 AngularJS 模板表达式可以访问作用域，你可以在 AngularJS 表达式内部更改作用域。例如，以下 `ng-click`\
  \ 指令更改了作用域模型内部 `msg` 的值：\n\n点击此处查看代码图片\n\n```html\n<span ng-click=\"msg='clicked'\"\
  >\"></span>\n```\n\n代码 23.1 和 23.2 说明了在 AngularJS 模板中实现链接到作用域表达式的不同方法。代码 23.1 实现了一个名为\
  \ `myController` 的简单控制器，它定义了 `first`、`last`、`newFirst` 和 `newLast` 属性。此外，`combine()`\
  \ 函数合并两个参数并返回结果。`setName()` 函数接受两个参数并更改 `first` 和 `last` 的值。\n\n代码 23.2](#part0037.html_ch23lis02)\
  \ 实现使用作用域和表达式的不同方法。第 9 行合并两个字符串，第 10 行从作用域读取 `first` 和 `last` 值。第 11 和 12 行调用 `combine()`\
  \ 函数，该函数返回合并后的字符串。注意第 12 行将作用域中的 `first` 和 `last` 属性传递给函数。\n\n第 13–16 行将 `ng-click`\
  \ 赋值作为表达式求值。在第 13 行，因为 `newFirst` 和 `newLast` 周围没有引号，它们的值是从作用域读取的。然而，第 15 行将指定的字符串传递给\
  \ `setName()` 函数。\n\n图 23.1 显示由代码 23.1 和 23.2 定义的 AngularJS 网页。\n\n**代码 23.1 angular_expressions.js:\
  \ 构建 AngularJS 表达式可以使用的作用域**\n\n点击此处查看代码图片\n\n```javascript\n01 angular.module('myApp',\
  \ []).\n02   controller('myController', function($scope) {\n03     $scope.first\
  \ = 'Thorin';\n04     $scope.last = 'Oakenshield';\n05     $scope.newFirst = 'Gandalf';\n\
  06     $scope.newLast = 'Grey';\n07     $scope.combine = function(fName, lName)\
  \ {\n08       return fName + ' ' + lName;\n09     };\n10     $scope.setName = function(fName,\
  \ lName) {\n11       $scope.first = fName;\n12       $scope.last = lName;\n13  \
  \   };\n14 });\n```\n\n**代码 23.2 expressions.html: 使用作用域和表达式的不同方法**\n\n```html\n\
  01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03   <head>\n04     <title>AngularJS\
  \ Expressions</title>\n05   </head>\n06   <body ng-controller=\"myController\">\n\
  07     <h1>Expressions</h1>\n08     {{first + ' ' + last}}\n09     {{first}} {{last}}\n\
  10     {{combine(first, last)}}\n11     <p ng-click=\"setName(newFirst, newLast)\"\
  >Click to {{first}}</p>\n12     <p ng-click=\"setName(newFirst, 'Grey')\">Click\
  \ to {{last}}</p>\n13     <p ng-click=\"msg='clicked'\">Click to {{msg}}</p>\n14\
  \     <script src=\"http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n\
  15     <script src=\"angular_expressions.js\"></script>\n16   </body>\n17 </html>\n\
  ```\n\n### 使用过滤器\n\nAngularJS 的一个强大功能是实现过滤器。过滤器是一种提供者，挂接到表达式解析器并修改表达式的结果——例如格式化时间或货币。\n\
  \n你在表达式内部使用过滤器，使用以下语法：\n\n`{{expression | filter}}\n\n如果你链用多个过滤器，它们将按照你指定的顺序执行：\n\
  \n`{{expression | filter | filter}}\n\n某些过滤器允许你以参数的形式提供输入。你通过以下语法添加这些参数：\n\n点击此处查看代码图片\n\
  \n`{{expression | filter:parameter1:parameter2}}`\n\n你也可以通过依赖注入将过滤器（提供者）添加到控制器和服务中。过滤器提供者的名称是过滤器名称加上\
  \ `Filter`。例如，货币过滤器的提供者名称为 `currencyFilter`。以下代码定义了一个注入了 `currencyFilter` 并使用它格式化结果的控制器：\n\
  \n```javascript\ncontroller('myController', ['$scope', 'currencyFilter', function($scope,\
  \ currencyFilter) {\n  $scope.getCurrencyValue = function(value){\n    return currencyFilter(value,\
  \ \"$USD\");\n  };\n}]);\n```\n\n#### 使用内置过滤器\n\nAngularJS 提供了多种类型的过滤器，让你能够轻松地在\
  \ AngularJS 模板中格式化字符串、对象和数组。表 23.1 列出了 AngularJS 提供的内置过滤器。\n\n\n\n\n\n![Image](img/00241.jpeg)![Image](img/00242.jpeg)![Image](img/00243.jpeg)\n\
  \n## 表 23.1 在 AngularJS 模板中修改表达式的过滤器\n\n代码列表 23.3 和 23.4 展示了如何在 AngularJS 中实现一些基本的过滤器。代码列表\
  \ 23.3 实现了一个带有 `JSONObj`、`word` 和 `days` 属性的控制器。代码列表 23.4 直接在模板表达式中实现了 `number`、`currency`、`date`、`json`、`limitTo`、`uppercase`\
  \ 和 `lowercase` 过滤器。图 23.2 显示了这些列表的输出。\n\n### 代码列表 23.3 `angular_filters.js`: 构建一个\
  \ AngularJS 过滤器可以使用的作用\n\n点击此处查看代码图像\n\n```javascript\n01 angular.module('myApp',\
  \ []).\n02    controller('myController', function($scope) {\n03      $scope.JSONObj\
  \ = {title:\"myTitle\"};\n04      $scope.word=\"Supercalifragilisticexpialidocious\"\
  ;\n05      $scope.days=['Monday', 'Tuesday', 'Wednesday',\n06                  \
  \ 'Thursday', 'Friday'];\n07    });\n```\n\n### 代码列表 23.4 `angular_filters.html`:\
  \ 一个 AngularJS 模板，实现了多种类型的过滤器来修改渲染视图中显示的数据\n\n点击此处查看代码图像\n\n```html\n01 <!doctype\
  \ html>\n02 <html ng-app=\"myApp\">\n03    <head>\n04      <title>AngularJS Filters</title>\n\
  05    </head>\n06    <body>\n07      <div ng-controller=\"myController\">\n08  \
  \      <h2>Basic Filters</h2>\n09        Number: {{123.45678|number:3}}<br>\n10\
  \        Currency: {{123.45678|currency:\"$\"}}<br>\n11        Date: {{1389323623006\
  \ | date:'yyyy-MM-dd HH:mm:ss Z'}}<br>\n12        JSON: {{ JSONObj | json }}<br>\n\
  13        Limit Array: {{ days | limitTo:3 }}<br>\n14        Limit String: {{ word\
  \ | limitTo:10 }}<br>\n15        Uppercase: {{ word | uppercase | limitTo:10 }}<br>\n\
  16        Lowercase: {{ word | lowercase | limitTo:10 }}\n17      <script src=\"\
  http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n18      <script src=\"\
  /js/angular_filters.js\"></script>\n19    </body>\n20 </html>\n```\n\n![Image](img/00244.jpeg)\n\
  \n图 23.2 使用 AngularJS 过滤器在显示于 AngularJS 视图之前对其进行修改。\n\n### 使用过滤器实现排序和过滤\n\n过滤器的一个非常常见的用法是对使用\
  \ `ng-repeat` 指令从 JavaScript 数组构建的动态元素进行排序或过滤。本节提供了一个实现 `orderBy` 过滤器的示例，用以生成一个可以按列排序并通过\
  \ `<input>` 元素字符串过滤的表格。\n\n代码列表 23.5 实现了一个控制器，该控制器定义了 `$scope.cameras` 数组作为作用域中的输入数据。由于你不想在排序和过滤时更改实际的模型数据，因此第\
  \ 9 行添加了 `$scope.filteredCameras` 属性来存储过滤后的数组。\n\n注意第 10 行设置了 `$scope.reverse` 值以跟踪排序方向。然后第\
  \ 11 行设置了 `$scope.column` 值以跟踪要对 cameras 数组中对象的哪个属性名称进行排序。第 12–15 行定义了 `setSort()`\
  \ 函数，它用于更新 `column` 和 `reverse` 值。第 15 行定义了 `$scope.filterString` 属性，该属性过滤对象以包含\
  \ `filteredCameras`。第 17–20 行定义了 `setFilter()` 函数，它调用 `filterFilter()` 者将 `filteredCameras`\
  \ 中的项目限制为模糊匹配 `filterString` 的项目。第 2 行和第 3 行将 `filterFilter` 者注入控制器中。代码列表 23.6 实现了一个模板，该模板包含一个绑定到\
  \ `filterString` 值的文本 `<input>` 和一个在点击时调用 `setFilter()` 的按钮 `<input>`。注意在第 14–16\
  \ 行中，表格表头应用了 `ng-click` 指令来调用 `setSort()` 以设置排序列。第 18–23 行使用 `ng-repeat` 指令实现了表格的行。注意\
  \ `ng-repeat` 指令使用 `orderBy` 过滤器来指定由 `setSort()` 函数设置的列名和反转设置。图 23.3 显示了结果。\n\n\
  ### 使用过滤器实现排序和过滤\n\n代码列表 23.5 `angular_sort.js`: 构建一个 AngularJS 过滤器可以使用的作用域并排序\n\
  \n点击此处查看代码图像\n\n```javascript\n01 angular.module('myApp', []).\n02    controller('myController',\
  \ function($scope) {\n03      $scope.JSONObj = {title:\"myTitle\"};\n04      $scope.word=\"\
  Supercalifragilisticexpialidocious\";\n05      $scope.days=['Monday', 'Tuesday',\
  \ 'Wednesday',\n06                   'Thursday', 'Friday'];\n07    });\n```\n\n\
  代码列表 23.6 `angular_sort.html`: 一个 AngularJS 模板，实现了 `filter` 和 `orderBy` 过滤器来对视图中的项目进行排序\n\
