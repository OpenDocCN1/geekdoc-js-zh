  \n列表 24.6 在单个 `<input>` 元素上实现了一系列事件指令，如图 24.3](#part0038.html_ch24fig03) 所示。注意第\
  \ 17 和 18 行通过 `$event` 变量名将键盘和鼠标事件对象传递给函数。\n\n列表 24.5 `directive_event.js`: 实现一个带有作用域数据和事件处理器的控制器**\n\
  \n点击此处查看代码图片\n\n```javascript\nangular.module('myApp', []).\n  controller('myController',\
  \ function($scope) {\n    $scope.keyInfo = {};\n    $scope.mouseInfo = {};\n   \
  \ $scope.keyStroke = function(event){\n      $scope.keyInfo.keyCode = event.keyCode;\n\
  \    };\n    $scope.mouseClick = function(event){\n      $scope.mouseInfo.clientX\
  \ = event.clientX;\n      $scope.mouseInfo.clientY = event.clientY;\n      $scope.mouseInfo.screenX\
  \ = event.screenX;\n      $scope.mouseInfo.screenY = event.screenY;\n    };\n  });\n\
  ```\n\n列表 24.6 `directive_event.html`: 实现若干种不同事件指令的 AngularJS 模板**\n\n点击此处查看代码图片\n\
  \n```html\n<!doctype html>\n<html ng-app=\"myApp\">\n<head>\n  <title>AngularJS\
  \ Event Directives</title>\n</head>\n<body>\n  <div ng-controller=\"myController\"\
  >\n    <h2>Event Directives</h2>\n    <input type=\"text\"\n           ng-blur=\"\
  focusState='Blurred'\"\n           ng-focus=\"focusState='Focused'\"\n         \
  \  ng-mouseenter=\"mouseState='Entered'\"\n           ng-mouseleave=\"mouseState='Left'\"\
  \n           ng-mouseclick=\"mouseState='Clicked'\"\n           ng-mousedown=\"\
  mouseState='Down'\"\n           ng-mouseup=\"mouseState='Up'\"\n           ng-keyup=\"\
  keyStroke($event)\"\n           ng-click=\"mouseClick($event)\"><hr>\n    Focus\
  \ State: {{focusState}}<br/>\n    Mouse State: {{mouseState}}<br/>\n    Key Info:\
  \ {{keyInfo|json}}<br/>\n    Mouse Info: {{mouseInfo|json}}<br/>\n  </div>\n  <script\
  \ src=\"http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n  <script src=\"\
  /js/directive_event.js\"></script>\n</body>\n</html>\n```\n\n![图像](img/00260.jpeg)\n\
  \n图 24.3 在 AngularJS 模板视图中实现事件指令。\n\n## 创建自定义指令以扩展 HTML\n\n与 AngularJS 的许多功能一样，你可以通过创建自定义指令来扩展指令的功能。自定义指令允许你通过自己实现元素的行为来扩展\
  \ HTML 的功能。如果你有需要操作 DOM 的代码，应该通过使用自定义指令来实现。\n\n你通过在 `Module` 对象上调用 `directive()`\
  \ 方法来实现自定义指令。`directive()` 方法的第一个参数是指令的名称，第二个参数是一个提供者函数，该函数返回一个包含构建指令对象所需指令的 get。例如，以下是一个指令的基本定义：\n\
  \n点击此处查看代码图片\n\n```javascript\nangular.module('myApp', []).\n  directive('myDirective',\
  \ function() {\n    return {\n      template: 'Name: {{name}} Score: {{score}}'\n\
  \    };\n  });\n```\n\n以下是你可以应用于指令定义返回的对象的属性列表，如上面代码中返回的 `template`：\n\n*   `template`:\
  \ 允许你定义插入到指令元素中的 AngularJS 模板文本。\n*   `templateUrl`: 与 `template` 相同，区别在于你指定了服务器上的\
  \ URL，并且下载并将部分模板并插入到指令元素中。\n*   `restrict`: 允许你指定指令适用于 HTML 元素、属性或两者。\n*   `replace`:\
  \ 告诉编译器将指令所在的元素替换为指令的模板。\n*   `transclude`: 允许你指定指令是否有权访问内部作用域之外的作用域。\n*   `scope`:\
  \ 允许你为指令指定一个内部作用域。\n*   `link`: 允许你指定一个链接函数，该函数可以访问作用域、DOM 元素和其他属性，并能够操作 DOM。\n\
  *   `controller`: 允许你在指令内部定义一个控制器以管理指令的作用域和视图。\n*   `require`: 允许你指定实现此指令所需的其他指令。为了创建此指令的实例，必须可用这些指令的提供者。\n\
  \n后续章节将详细讨论指令选项。\n\n#### 定义指令视图\n\n你可以包含 AngularJS 模板代码来构建视图组件，这些组件将显示在包含指令的 HTML\
  \ 元素中。你可以直接使用 `template` 属性添加模板代码，如示例所示：\n\n点击此处查看代码图片\n\n```javascript\ndirective('myDirective',\
  \ function() {\n  return {\n    template: 'Name: {{name}} Score: {{score}}'\n  };\n\
  });\n```\n\n你可以指定一个根元素，但只有该元素将作为 AngularJS 模板的根元素。如果你使用 `transclude` 标记，该元素将作为任何包含在内的子元素的根元素。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\ndirective('myDirective', function() {\n  return {\n\
  \    transclude: true,\n    template: '<div ng-transclude></div>'\n  };\n});\n```\n\
  \n你也可以使用 `templateUrl` 属性指定位于服务器上的 AngularJS 模板 URL，如下所示：\n\n点击此处查看代码图片\n\n```javascript\n\
  directive('myDirective', function() {\n  return {\n    templateUrl: '/myDirective.html'\n\
  \  };\n});\n```\n\n模板可以包含任何标准的 AngularJS 模板代码。因此你可以根据需要让指令变得简单或复杂。\n\n#### 限制指令行为\n\
  \n你可以将指令应用于元素、属性或两者。`restrict` 属性允许你限制自定义指令的应用方式。`restrict` 属性可以设置为：\n\n*   `A`:\
  \ 作为属性应用。\n*   `E`: 作为元素应用。\n*   `C`: 作为类名应用。\n*   `AEC`: 作为属性、元素或类名应用。你也可以使用其他组合，如\
  \ `AE` 或 `AC`。\n\n例如，你可以将以下指令作为属性或元素应用：\n\n点击此处查看代码图片\n\n```javascript\ndirective('myDirective',\
  \ function() {\n  return {\n    restrict: 'AE',\n    templateUrl: '/myDirective.html'\n\
  \  };\n});\n```\n\n下面显示了如何作为元素和属性实现该指令。注意驼峰命名被替换为带有连字符的名称：\n\n点击此处查看代码图片\n\n```html\n\
  <my-directive></my-directive>\n<div my-directive></div>\n```\n\n#### 包含外部作用域\n\n\
  \n\n\n\n你可以在指令定义中将 `transclude` 选项设置为 `true` 或 `false`。如果设置为 `true`，则指令内部的组件可以访问指令外部的作用域（scope）。你必须在指令模板内部的元素中包含\
  \ `ngTransclude` 指令。以下是一个实现 `transclude` 的示例，用于从 `myDirective` 指令模板中访问控制器作用域中的 `title`\
  \ 变量：\n\n点击此处查看代码图片\n\n```javascript\nangular.module('myApp', []).\n  directive('myDirective',\
  \ function() {\n    return {\n      transclude: true,\n      scope: {},\n      template:\
  \ '<div ng-transclude>{{title}}</div>'\n    };\n  }).\n  controller('myController',\
  \ function($scope) {\n    $scope.title=\"myApplication\";\n  });\n```\n\n### 配置指令作用域\
  \ (Directive Scope)\n\n有时你可能希望将指令内部的作用域与外部的作用域隔离开。这样做可以防止指令更改本地控制器中的值。指令定义允许你指定一个\
  \ `scope` 来创建一个隔离作用域（isolate scope）。隔离作用域将指令作用域与外部作用域隔离开，以防止指令访问外部作用域，并防止外部作用域中的控制器更改指令作用域。例如，以下代码将指令的作用域从外部作用域隔离开：\n\
  \n点击此处查看代码图片\n\n```javascript\ndirective('myDirective', function() {\n  return {\n\
  \    scope: { },\n    templateUrl: '/myDirective.html'\n  };\n});\n```\n\n使用这段代码，指令拥有一个完全空的隔离作用域。然而，你可能仍然想将外部作用域中的某些项映射到指令的内部作用域中。你可以使用以下前缀为属性命名，使本地作用域变量在指令的作用域中可用：\n\
  \n![Image](img/00003.jpeg) `@` ： 将本地作用域的字符串绑定到 DOM 属性的值。该属性的值将在指令作用域内可用。\n\n![Image](img/00003.jpeg)\
  \ `=`:： 在本地作用域属性与指令作用域属性之间创建双向绑定。\n\n![Image](img/00003.jpeg) `&` ： 将本地作用域中的函数绑定到指令作用域。\n\
  \n如果前缀后没有跟属性名称，将使用指令属性的名称。例如：\n\n`title : '@'`\n\n等同于：\n\n`title: '@title'`\n\n\
  以下代码展示了如何实现各种种方法将本地值映射到指令的隔离作用域中：\n\n点击此处查看代码图片\n\n```javascript\nangular.module('myApp',\
  \ []).\n  controller('myController', function($scope) {\n    $scope.title=\"myApplication\"\
  ;\n    $scope.myFunc = function(){\n      console.log(\"out\");\n    };\n  }).\n\
  \  directive('myDirective', function() {\n    return {\n      scope: {title: '=',\
  \ newFunc:\"&myFunc\", info: '@'},\n      template: '<div ng-click=\"newFunc()\"\
  >{{title}}: {{info}}</div>'\n    };\n  });\n```\n\n以下代码展示了如何在 AngularJS 模板中定义指令，以提供必要的属性来映射属性：\n\
  \n```html\n<div my-directive\n     my-func=\"myFunc()\"\n     title=\"title\"\n\
  \     info=\"SomeString\"></div>\n```\n\n### 使用链接函数 (Link Function) 操作 DOM\n\n当\
  \ AngularJS HTML 编译器遇到指令时，它会运行指令的编译函数（compile function），该函数返回一个 `link()` 函数。`link()`\
  \ 函数被添加到 AngularJS 指令的列表中。一旦所有指令编译完成，HTML 编译器将根据优先级顺序调用 `link()` 函数。\n\n如果你想修改自定义指令内部的\
  \ DOM，应该使用 `link()` 函数。`link()` 函数接收 `scope`、`element` 和与指令相关的属性，允许你在指令内部直接操作 DOM。\n\
  \n在 `link()` 函数内部，你处理处理元素元素上的 `$destroy` 事件，并清理所有必要的内容。`link()` 函数还负责注册 DOM 监听器以处理浏览器事件。\n\
  \n`link()` 函数使用以下语法：\n\n点击此处查看代码图片\n\n```javascript\nlink: function(scope, element,\
  \ attributes, [controller])\n```\n\n`scope` 参数是指令的作用域，`element` 是插入指令的元素，`attributes`\
  \ 列出了属性，而 `controller` 是控制器。\n\n以下代码展示了一个 `link()` 函数的实现，它设置了 `scope`、向 DOM 添加了内容、实现了\
  \ `$destroy` 事件，并在作用域上添加了 `$watch`：\n\n点击此处查看代码图片\n\n```javascript\n// ( of of of\
  \ the,\n\n\nreturn {\n  scope: {title: '=', newFunc:\"&myFunc\", info: '@'},\n \
  \ link: function(scope, element, attributes, [controller]) {\n    element.on('$destroy',\
  \ function() {\n      // cleanup\n    });\n  }\n}\n```\n\n### 为指令添加控制器\n\n你可以通过使用指令定义中的\
  \ `controller` 属性为指令添加控制器。这允许你为指令提供控制器支持。例如，以下代码设置了一个简单的控制器：\n\n点击此处查看代码图片\n\n```javascript\n\
  directive('myDirective', function() {\n  return {\n    scope: {title: '='},\n  \
  \  controller: function ($scope) {\n      $scope.title=\"myApplication\";\n    }\n\
  \  };\n});\n```\n\n你还可以使用 `require` 选项来确保指令控制器可用。`require` 选项使用 `^controller` 语法指示注入器服务向上查找，直到找到控制器。以下是在指令中请求\
  \ `myController` 的示例：\n\n点击此处查看代码图片\n\n```javascript\ndirective('myDirective', function()\
  \ {\n  return {\n    require: '^myController'\n  };\n});\n```\n\n当你添加 `require`\
  \ 选项时，指定的控制器将作为第四个参数传递给 `link()` 函数。如果在 `require` 中指定另一个指令的名称，该指令将被链接。\n\n### 创建自定义指令\n\
  \n你可以定义的自定义指令类型是无限的，这使得 AngularJS 具有极强的扩展性。自定义指令是 AngularJS 中复杂的部分。最好的入门方法是向你展示两个自定义指令的示例，让你感受如何实现它们以及它们如何相互交互。\n\
  \n列表 24.7 实现了两个自定义指令：`myPhotos` 和 `myPhoto`。`myPhotos` 指令被设计为 `myPhoto` 指令的容器。注意第\
  \ 7-18 行定义了一个为 `myPhotos` 指令提供功能的控制器，包括 `addPhoto()` 函数。\n\n列表 24.8 在 AngularJS\
  \ 模板中实现了 `myPhotos` 和 `myPhoto` 指令。`myPhoto` 指令嵌套在 `myPhotos` 指令内部。注意每个 `myPhoto`\
  \ 指令上都设置了 `title` 属性，并在 列表 24.7 的第 28 行中链接到作用域。\n\n\n\n\n\nListing 24.9 实现了一个由 `myPhotos`\
  \ 指令加载的部分模板。它生成了一个 `<div>` 容器，然后使用 `myPhotos` 作用域中的 `photos` 数组构建一个绑定到 `select()`\
  \ 函数的链接列表，并使用了 `ng-click`。`<div ng-transclude></div>` 为 `myPhoto` 子元素提供了容器。\n\n\
  Figure 24.4 显示了由 Listing 24.7、24.8 和 24.9 创建的网页。\n\n### 列表 24.7 `directive_custom.js`：实现相互作用的自定义指令\n\
  \n点击此处查看代码图片\n\n```javascript01 angular.module('myApp', [])\n02    .directive('myPhotos',\
  \ function() {\n03      return {\n04        restrict: 'E',\n05        transclude:\
  \ true,\n06        scope: {},\n07        controller: function($scope) {\n08    \
  \      var photos = $scope.photos = [];\n09          $scope.select = function(photo)\
  \ {\n10            angular.forEach(photos, function(photo) {\n11              photo.selected\
  \ = false;\n12            });\n13            photo.selected = true;\n14        \
  \  };\n15          this.addPhoto = function(photo) {\n16            photos.push(photo);\n\
  17          };\n18        },\n19        templateUrl: 'my_photos.html'\n20      };\n\
  21    })\n22    .directive('myPhoto', function() {\n23      return {\n24       \
  \ require: '^myPhotos',\n25        restrict: 'E',\n26        transclude: true,\n\
  27        scope: { title: '@'},\n28        link: function(scope, elem, attrs, photosControl)\
  \ {\n29          photosControl.addPhoto(scope);\n30        },\n31        template:\
  \ '<div ng-show=\"selected\" ng-transclude></div>'\n32      };\n33    });\n```\n\
  \n### 列表 24.8 `directive_custom.html`：实现嵌套自定义指令的 AngularJS 模板\n\n点击此处查看代码图片\n\n\
  ```html01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04    <title>AngularJS\
  \ Custom Directive</title>\n05 </head>\n06 <body>\n07    <my-photos>\n08       <my-photo\
  \ title=\"Flower\">\n09          <img src=\"/images/flower.jpg\" height=\"150px\"\
  />\n10        </my-photo>\n11       <my-photo title=\"Arch\">\n12          <img\
  \ src=\"/images/arch.jpg\" height=\"150px\"/>\n13        </my-photo>\n14       <my-photo\
  \ title=\"Lake\">\n15          <img src=\"/images/lake.jpg\" height=\"150px\"/>\n\
  16        </my-photo>\n17    </my-photos>\n18    <script src=\"http://code.angularjs.org/1.2.9/angular.min.js\"\
  ></script>\n19    <script src=\"/js/directive_custom.js\"></script>\n20 </body>\n\
  21 </html>\n```\n\n### 列表 24.9 `my_photos.html`：为 `myPhotos` 自定义指令提供根元素的 AngularJS\
  \ 模板\n\n点击此处查看代码图片\n\n```html01 <div>\n02  <span ng-repeat=\"photo in photos\"\n\
  03 ng-class=\"{active:photo.selected}\">\n04    <a href=\"\" ng-click=\"select(photo)\"\
  >{{photo.title}}</a>\n05  </span>\n06  <div ng-transclude></</div>\n07 </div>\n\
  ```\n\n![图片](img/00261.jpeg)\n图 24.4 在 AngularJS 视图实现事件指令。\n\n## 总结\nAngularJS 指令扩展了\
  \ HTML 的行为。你可以将指令作为 HTML 元素、属性和类应用到 AngularJS 模板中。你使用 JavaScript 代码来定义指令的功能。AngularJS\
  \ 提供了几个内置指令，用于与表单元素交互、将数据绑定到作用域以及与浏览器事件交互。例如，`ngModel` 将表单元素的值直接绑定到作用域上。当作用域发生变化时，元素显示的值随之改变，反之亦然。\n\
  \nAngularJS 最强大的功能之一是创建自定义指令的能力。使用 `Module` 对象上的 `directive()` 方法在代码中实现自定义指令是非常简单的。然而，由于实现方式多种，指令也可能变得非常复杂。\n\
  \n## 下一节\n在下一章节中，你将学习如何将服务集成到你的 Web 应用程序中。AngularJS 服务提供了模块间通用的组件功能。例如，`$http` 服务提供了与网络服务器的\
  \ HTTP 通信。\n\n## 25. 在 Web 应用程序中实现 AngularJS 服务\n\nAngularJS 功能最基础的组件之一是服务（Services）。服务为你的应用程序提供基于任务的功能。将服务考虑为执行一个或多个相关任务的代码块。AngularJS\
  \ 提供了几个内置服务，并允许你创建自定义的服务。本章介绍了 AngularJS 服务。你将有机会看到并实现一些内置服务，例如用于网络服务器通信的 `$http`。你还将学习创建自定义服务的不同方法以及如何实现它们。\n\
  \n## 理解 AngularJS 服务\nAngularJS 服务是单例对象，这意味着只会创建一个实例。服务的意图是提供一段执行特定任务的简洁代码。服务可以简单到仅提供值定义，也可以复杂到为网络服务器提供完整的\
  \ HTTP 通信。\n\n服务为可重用功能提供容器，这些功能供 AngularJS 随时可用。服务通过 AngularJS 的依赖注入机制进行定义和注册。这允许将服务注入到模块、控制器和其他服务中。\n\
  \n> **注意**：第 21 章，“理解 AngularJS 模块和依赖注入](#part0035.html_ch21)”讨论了依赖注入。在继续之前，你应该阅读该章节。\n\
  \n### 使用内置服务\nAngularJS 提供了几个内置服务。这些服务自动注册到依赖注入器中，因此你可以通过依赖注入轻松将它们整合到 AngularJS\
  \ 应用中。表 25.1 了一些最常用的内置服务，让你有所了解。接下来的章节将详细介绍这些服务。\n\n![图片](img/00262.jpeg)\n表 25.1\
  \ 内置服务\n\n### 使用 http 服务发送 GET 和 PUT 请求\n`$http` 服务允许你从 AngularJS 代码直接与网络服务器交互。`$http`\
  \ 服务底层浏览器的 `XMLHttpRequest` 对象，但在 AngularJS 的上下文中运行。\n\n使用 `$http` 服务有两种方法。简单的方法是使用以下对应标准\
  \ HTTP 请求的内置快捷方法：\n\n![图片](img/00003.jpeg) `delete(url, [config])`\n![图片](img/00003.jpeg)\
  \ `get(url, [config])`\n![图片](img/00003.jpeg) `head(url, [config])`\n![图片](img/00003.jpeg)\
  \ `jsonp(url, [config])`\n![图片](img/00003.jpeg) `post(url, data, [config])`\n![图片](img/00003.jpeg)\
  \ `put(url, data, [config])`\n\n在这些方法中，`url` 参数是网络请求的 URL。可选的 `config` 参数是一个 JavaScript\
  \ 对象，指定实现请求时使用的选项。表 25.2 列出了你可以在 `config` 参数中设置的属性。\n\n你也可以通过将 `config` 参数直接发送给\
  \ `$http(config)` 方法来指定请求、URL 和数据。例如，以下完全相同：\n\n点击此处查看代码图片\n\n```javascript\n$http.get('/myUrl');\n\
  \n$http({method: 'GET', url:'/myUrl'});\n```\n\n![图片](img/00263.jpeg)\n表 25.2 $http\
  \ 服务请求中可以在 config 参数中定义的属性\n\n\n\n\n\n当你使用 `$http` 对象调用请求方法时，你将获得一个带有 `success()`\
  \ 和 `error()` 承诺方法的对象。你可以向这些方法传递一个回调函数，该函数会在请求成功或失败时被调用。这些方法接受以下参数：\n\n![Image](img/00003.jpeg)\
  \ **data:** 响应数据。\n![Image](img/00003.jpeg) **status:** 响应状态。\n![Image](img/00003.jpeg)\
  \ **header:** 响应头头。\n![Image](img/00003.jpeg) **config:** 请求配置。\n\n以下是一个在 `get()`\
  \ 请求上实现 `success()` 和 `error()` 方法的简单示例：\n\n点击此处查看代码图片\n\n```javascript\n$http({method:\
  \ 'GET', url: '/myUrl'}).\n  success(function(data, status, headers, config) {\n\
  \    // handle success\n  }).\n  error(function(data, status, headers, config) {\n\
  \    // handle failure\n  });\n```\n\n代码列表 25.1 到 25.3 中的代码实现了一个端到端的 AngularJS/Node.js\
  \ Web 应用，它允许用户初始化日期列表并从列表中删除日期。该示例非常基础，代码易于理解，但它包含了 `GET` 和 `POST` 请求以及错误处理示例。\n\
  \n代码列表 25.1` 方法调用服务器上的 `/remove/day` 路由并将结果放在作用域变量 `$scope.days` 中。如果发生错误，`$scope.status`\
  \ 变量将被设置为错误响应对象中的 `msg` 值。`resetDays()` 方法调用服务器上的 `/reset/days` GET 路由，并用成功响应更新\
  \ `$scope.days`。\n\n代码列表 25.3\n\n```javascript\n01 var express = require('express');\n\
  02 var bodyParser = require('body-parser');\n03 var app = express();\n04 app.use('/',\
  \ express.static('./static')).\n05      use('/images', express.static( '../images')).\n\
  06      use('/lib', express.static( '../lib'));\n07 app.use(bodyParser());\n08 var\
  \ days=['Monday', 'Tuesday', 'Wednesday',\n09               'Thursday', 'Friday'];\n\
  10 var serviceDays = days.slice(0);\n11 app.get('/reset/days', function(req, res){\n\
  12   serviceDays = days.slice(0);\n13   res.json(serviceDays);\n14 });\n15 app.post('/remove/day',\
  \ function(req, res){\n16   if (serviceDays.length > 2){\n17     serviceDays.splice(serviceDays.indexOf(req.body.day),\
  \ 1);\n18     console.log(days);\n19     res.json(serviceDays);\n20   }else {\n\
  21     res.json(400, {msg:'You must leave 2 days'});\n22   }\n23 });\n24 app.listen(80);\n\
  ```\n\n### 代码列表 25.2 `service_http.js`: 实现一个使用 `$http` 服务与 Web 服务器交互的 AngularJS\
  \ 控制器\n\n点击此处查看代码图片\n\n```javascript\n01 angular.module('myApp', []).\n02   controller('myController',\
  \ ['$scope', '$http',\n03                                   function($scope, $http)\
  \ {\n04     $scope.days=[];\n05     $scope.status = \"\";\n06     $scope.removeDay\
  \ = function(deleteDay){\n07       $http.post('/remove/day', {day:deleteDay}).\n\
  08           success(function(data, status, headers, config) {\n09             $scope.days\
  \ = data;\n10       }).\n11         error(function(data, status, headers, config)\
  \ {\n12           $scope.status = data.msg;\n13       });\n14     };\n15     $scope.resetDays\
  \ = function(){\n16       $scope.status = \"\";\n17       $http.get('/reset/days')\n\
  18         success(function(data, status, headers, config) {\n19           $scope.days\
  \ = data;\n20         }).\n21         error(function(data, status, headers, config)\
  \ {\n22           $scope.status = data;\n23         });\n24     };\n25   }]);\n\
  ```\n\n### 代码列表 25.3 `service_http.html`: 实现与 Web 服务器数据链接的的 AngularJS 模板\n\n点击此处查看代码图片\n\
  \n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04   <title>AngularJS\
  \ $http Service</title>\n05   <style>span{color:red}</style>\n06 </head>\n07 <body>\n\
  08   <div ng-controller=\"myController\">\n09     <h2>$http Service</h2>\n10   \
  \  <input type=\"button\" ng-click=\"resetDays()\" value=\"Initialize Days\"/>\n\
  11     {{status}}\n12     <h3>Days Available</h3>\n13     <div ng-repeat=\"day in\
  \ days\">\n14       {{day}}\n15       <span ng-click=\"removeDay(day)\">remove</span></span>\n\
  16     </div>\n17   </div>\n18   <script src=\"http://code.angularjs.org/1.2/angular.min.js\"\
  ></script>\n19   <script src=\"/js/service_http.js\"></script>\n20 </body>\n21 </html>\n\
  ```\n\n![Image](img/00264.jpeg)\n图 25.1 实现 `$http` 服务，以允许 AngularJS 控制器与 Web 服务器进行交互。\n\
  \n#### 使用 $cacheFactory 服务\n\n`$cacheFactory` 服务提供了一个非常实用的仓库，用于以键/值对的形式临时存储数据。由于\
  \ `$cacheFactory` 是一个服务，因此它可以被多个控制器和其他组件使用。\n\n创建 `$cacheFactory` 服务时，你可以指定一个包含\
  \ `capacity` 属性的 `options` 对象——例如 `{capacity: 5}`。通过添加此 `capacity` 设置，你限制了缓存中的元素数量。当添加新项时，最旧的元素将被移除。\n\
  \n代码列表 25.4 展示了在 `Module` 对象中实现 `$cacheFactory` 然后从两个不同的控制器访问它的基本示例。\n\n### 代码列表\
  \ 25.4 `service_cache.js`: 在 AngularJS 应用中实现 `$cacheFactory` 服务\n\n点击此处查看代码图片\n\n\
  ```javascript\n01 var app = angular.module('myApp', []);\n02 app.factory('MyCache',\
  \ function($cacheFactory) {\n03   return $cacheFactory('myCache', {capacity:5});\n\
  04 });\n05 app.controller('myController', ['$scope', 'MyCache',\n06   function($scope,\
  \ cache) {\n07     cache.put('myValue', 55);\n08   ]);\n09 app.controller('myController2',\
  \ ['$scope', 'MyCache',\n10   function($scope, cache) {\n11   $scope.value = cache.get('myValue');\n\
  12   ]);\n```\n\n#### 使用 $window 服务实现浏览器警窗\n\n`$window` 服务为浏览器的 `window` 对象提供了一个\
  \ jQuery 封装，允许你像通常从 JavaScript 中访问的那样访问 `window` 对象。为了说明这一点，以下代码使用 `window` 对象上的\
  \ `alert()` 方法弹出一个浏览器警窗。警窗的消息获取自浏览器 `window` 对象的 `$window.screen.availWidth` 和 `$window.screen.availHeight`\
  \ 属性：\n\n点击此处查看代码图片\n\n```javascript\nvar app = angular.module('myApp', []);\napp.controller('myController',\
  \ ['$scope', '$window',\n  function($scope, window) {\n    window.alert(\"Your Screen\
  \ is: \\n\" +\n      window.screen.availWidth + \"X\" + window.screen.availHeight);\n\
  \  }]);\n```\n\n#### 使用 $cookieStore 服务与浏览器 Cookie\n\n\n\n\n\nAngularJS 提供了用于获取和设置\
  \ cookie 的服务：`$cookie` 和 `$cookieStore`。Cookie 在浏览器中提供临时存储，即使使用户离开网页或关闭浏览器，它们也会持久存在。\n\
  \n`$cookie` 服务允许你使用点符号表示法获取并更改字符串类型的 cookie 值。例如，以下代码将获取名为 `appCookie` 的 cookie\
  \ 的值并对其进行更改：\n\n点击此处查看代码图片\n\n```\nvar cookie = $cookies.appCookie;\n\n$cookies.appCookie\
  \ = 'New Value';\n```\n\n`$cookieStore` 服务提供了 `get()`、`put()` 和 `remove()` 函数来获取、设置和删除\
  \ cookie。`$cookieStore` 服务的一个非常棒特性是，它在设置 cookie 之前会将 JavaScript 对象值序列化为 JSON 字符串，然后在获取时将它们反序列化回对象。\n\
  \n要使用 `$cookie` 和 `$cookieStore` 服务，你需要完成三件事。首先，在模板中于 `angular.js` 之后、`application.js`\
  \ 之前加载 `angular-cookies.js` 库。例如：\n\n点击此处查看代码图片\n\n```html\n<script src=\"http://code.angularjs.org/1.2.9/angular.min.js\"\
  ></script>\n\n<script src=\"http://code.angularjs.org/1.2.9/angular-cookies.min.js\"\
  ></script>\n```\n\n### 注意\n\n你也可以从 AngularJS 网站 [`code.angularjs.org/<version>/`](http://code.angularjs.org/%3Cversion%2E/)\
  \ 下载 `angular-cookies.js` 文件，其中 `<version>` 是你正在使用的 AngularJS 版本。根据你使用的 AngularJS\
  \ 版本，你可能还需要下载 `angular-cookies.min.js.map` 文件。\n\n其次，你需要在应用程序 `Module` 定义中将 `ngCookies`\
  \ 添加到依赖列表中。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar app = angular.module('myApp',\
  \ ['ngCookies']);\n```\n\n第三，将 `$cookies` 或 `$cookieStore` 服务注入你的控制器中。例如：\n\n点击此处查看代码图片\n\
  \n```javascript\napp.controller('myController', ['$scope', '$cookieStore',\n\n \
  \                            function($scope, cookieStore) {\n\n}]);\n```\n\n列表\
  \ 25.5 和 25.6 展示了如何使用 `$cookie` 服务获取和设置 cookie。列表 25.5 在应用程序中加载 `ngCookies`，向控制器中注入\
  \ `$cookieStore`，然后使用 `get()`、`put()` 和 `remove()` 方法与名为 `myAppCookie` 的 cookie\
  \ 交互。\n\n列表 25.6 实现了一组单选按钮，这些按钮绑定到模型中的 `favCookie` 值，并在按钮值发生变化时使用 `ng-change` 调用\
  \ `setCookie()`。图 25.2 显示了生成的网页。\n\n列表 25.5 `service_cookies.js`: 使用 `$cookieStore`\
  \ 服务实现与浏览器 cookie 交互的 AngularJS 控制\n\n点击此处查看代码图片\n\n```javascript\n01 var app =\
  \ angular.module('myApp', ['ngCookies']);\n02 app.controller('myController', ['$scope',\
  \ '$cookieStore',\n03                             function($scope, cookieStore)\
  \ {\n04      $scope.favCookie = '';\n05      $scope.myFavCookie = '';\n06      $scope.setCookie\
  \ = function(){\n07        if ($scope.favCookie === 'None'){\n08          cookieStore.remove('myAppCookie');\n\
  09        else{\n10          cookieStore.put('myAppCookie', {flavor:$scope.favCookie});\n\
  11        }\n12      $scope.myFavCookie = cookieStore.get('myAppCookie');\n13  \
  \    };\n14    ]);\n```\n\n列表 25.6 `service_cookies.html`: 实现单选按钮以设置 cookie 值的 AngularJS\
  \ 模板\n\n点击此处查看代码图片\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n\
  03 <head>\n04   <title>AngularJS $cookie Service</title>\n05 </head>\n06 <body>\n\
  07   <div ng-controller=\"myController\">\n08     <h3>Favorite Cookie:</h3>\n09\
  \     <input type=\"radio\" value=\"Chocolate Chip\" ng-model=\"favCookie\"\n10\
  \           ng-change=\"setCookie()\">Chocolate Chip</value><br/>\n11     <input\
  \ type=\"radio\" value=\"Oatmeal\" ng-model=\"favCookie\"\n12           ng-change=\"\
  setCookie()\">Oatmeal</value><br/>\n13     <input type=\"radio\" value=\"Frosted\"\
  \ ng-model=\"favCookie\"\n14           ng-change=\"setCookie()\">Frosted</value><br/>\n\
  15     <input type=\"radio\" value=\"None\" ng-model=\"favCookie\"\n16         \
  \  ng-change=\"setCookie()\">None</value><br/>\n17     <p>My Favorite: {{myFavCookie}}</p>\n\
  18   </div>\n19 </body>\n20 </html>\n```\n\n\n\n\n\n表 25.4 `动画过程中自动添加和移除的 AngularJS\
  \ 指令`\n\n要实现基于 CSS 的动画，你只需要为 表 25.4 中列出的额外类添加相应的 CSS 过渡代码即可。为了说明这一点，下面的代码段为名为 `.img-fade`\
  \ 的自定义类实现了添加类和移除类的过渡效果，该类会使图像的 `opacity`（透明度）在两秒内变为 `.1`，达到动画效果：\n\n点击此处查看代码图片\n\
  \n```css\n.img-fade-add, .img-fade-remove {\n  -webkit-transition:all ease 2s;\n\
  \  -moz-transition:all ease 2s;\n  -o-transition:all ease 2s;\n  transition:all\
  \ ease 2s;\n}\n\n.img-fade, .img-fade-add.img-fade-add-active {\n    opacity:.1;\n\
  }\n```\n\n注意，过渡效果被添加到了 `.img-fade-add` 和 `.img-fade-remove` 类中，但实际的类定义应用在了 `.img-fade`。你还需要类定义\
  \ `.img-fade-add.img-fade-add-active` 来设置过渡的结束状态。\n\n#### 在 JavaScript 中实现动画\n\n\
  实现 AngularJS CSS 动画非常简单，但你也可以使用 jQuery 在 JavaScript 中实现动画。JavaScript 动画对动画提供了更直接的控制。此外，JavaScript\
  \ 动画不需要浏览器支持 CSS3。\n\n要在 JavaScript 中实现动画，你需要在加载 `angular.js` 库之前在模板中包含 jQuery 库。例如：\n\
  \n点击此处查看代码图片\n\n```html\n<script src=\"http://code.jquery.com/jquery-1.11.0.min.js\"\
  ></script>\n```\n\n> **注意**：如果你希望利用 jQuery 动画的全部功能，则必须包含完整的 jQuery 库。如果你决定包含 jQuery\
  \ 库，请确保它在 HTML 代码中于 AngularJS 库之前加载。这可以消除 jQuery 库覆盖 AngularJS 正常运行所需变量的风险。\n\n\
  你还需要在应用程序 `Module` 对象定义中包含 `ngAnimate` 依赖。例如：\n\n点击此处查看代码图片\n\n```javascript\nvar\
  \ app = angular.module('myApp', ['ngAnimate']);\n```\n\n然后你可以使用 `Module` 对象上的 `animate()`\
  \ 方法来实现动画。`animate()` 方法返回一个对象，该对象提供了你想要处理的 `enter`、`leave`、`move`、`addClass` 和\
  \ `removeClass` 事件函数。这些函数将要动画的元素作为第一个参数传递。然后你可以使用 jQuery 的 `animate()` 方法来动画元素。\n\
  \njQuery 的 `animate()` 方法使用以下语法，其中 `cssProperties` 是 CSS 属性变化的对象，`duration` 以毫秒为单位，`easing`\
  \ 是缓动方法，而 `callback` 是动画完成后要执行的函数：\n\n点击此处查看代码图片\n\n```javascript\nanimate(cssProperties,\
  \ [duration], [easing], [callback])\n```\n\n例如，下面的代码通过将 `opacity` 设置为 `0` 来实现为元素添加\
  \ `fadeClass` 类：\n\n点击此处查看代码图片\n\n```javascript\napp.animation('.fadeClass', function()\
  \ {\n  return {\n    addClass : function(element, className, done) {\n      jQuery(element).animate({\
  \ opacity: 0}, 3000);\n    },\n  };\n});\n```\n\n#### 使用 AngularJS 动画元素\n\n代码列表\
  \ 25.7、25.8 和 25.9 实现了一个基础动画示例，该示例使用 JavaScript 方法对图像应用淡入/淡出动画，并使用 CSS 过渡动画来处理图像缩放。\n\
  \n代码列表 25.7 包含了 AngularJS 控制器和动画代码。注意，通过钩入 `addClass` 和 `removeClass` 事件，使用了同一个类\
  \ `.fadeOut` 来同时应用淡入和淡出动画。\n\n代码列表 25.8 实现了支持动画的 AngularJS 模板。注意第 5 行加载了 jQuery\
  \ 库以支持 JavaScript 动画代码。此外，第 6 行加载了 `animate.css` 脚本，其中包含了 代码列表 25.9 所示的过渡动画。按钮只需添加和移除相应的类来启动动画。\n\
  \n代码列表 25.9 为动画过程中实现的 `add` 和 `remove` 类提供了必要的过渡 CSS 定义。图 25.3 显示了结果。\n\n代码列表 25.7\
  \ `service_animate.js`: 实现了一个使用 `$animation` 服务的 AngularJS 控制器\n点击此处查看代码图片\n\n```javascript\n\
  var app = angular.module('myApp', ['ngAnimate']);\napp.controller('myController',\
  \ function($scope) {\n  $scope.myClass = 'start-class';\n});\napp.animation('.fadeOut',\
  \ function() {\n  return {\n    enter: function(element, parentElement, done){},\n\
  \    leave: function(element, done){},\n    move: function(element, done){},\n \
  \   addClass: function(element, className, done) {\n      jQuery(element).animate({\
  \ opacity: 0}, 3000);\n    },\n    removeClass: function(element, done) {\n    \
  \  jQuery(element).animate({ opacity: 1}, 3000);\n    }\n  };\n});\n```\n\n代码列表\
  \ 25.8 `service_animate.html`: 实现了通过按钮更改类的 AngularJS 模板\n点击此处查看代码图片\n\n```html\n\
  <!doctype html>\n<html ng-app=\"myApp\">\n<head>\n  <title>AngularJS $animate</title>\n\
  \  <script src=\"http://code.jquery.com/jquery-1.11.0.min.js\"></script>\n  <link\
  \ rel=\"stylesheet\" href=\"/css/animate.css\">\n</head>\n<body>\n  <div ng-controller=\"\
  myController\">\n    <h3>Image Animation:</h3>\n    <input type=\"button\" ng-click=\"\
  myClass='fadeOut'\" value=\"Fade Out\"/>\n    <input type=\"button\" ng-click=\"\
  myClass=''\" value=\"Fade In\">\n    <input type=\"button\" ng-click=\"myClass='shrink'\"\
  \ value=\"Small\">\n    <input type=\"button\" ng-click=\"myClass=''\" value=\"\
  Big\">\n    <hr>\n    <img ng-class=\"myClass\" src=\"/images/arch.jpg\" />\n  </div>\n\
  \  <script src=\"http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n  <script\
  \ src=\"http://code.angularjs.org/1.2.9/angular-animate.min.js\"></script>\n  <script\
  \ src=\"/js/service_animate.js\"></script>\n</body>\n</html>\n```\n\n![Image](img/00268.jpeg)\n\
  图 25.3 同时在 CSS 和 JavaScript 中实现 `$animation` 服务以对图像进行淡入缩放。\n\n代码列表 25.9 `animate.css`:\
  \ 为 AngularJS 动画代码的不同类阶段提供过渡效果的 CSS 代码\n点击此处查看代码图片\n\n```css\n.shrink-add, .shrink-remove\
  \ {\n  -webkit-transition:all ease 2.5s;\n  -moz-transition:all ease 2.5s;\n  -o-transition:all\
  \ ease 2.5s;\n  transition:all ease 2.5s;\n}\n.shrink,\n.shrink-add.shrink-add-active\
  \ {\n  height:100px;\n}\n.start-class,\n.shrink-remove.shrink-remove-active {\n\
  \  height:400px;\n}\n```\n\n\n\n\nAngularJS 允许你创建自定义服务，以便在需要这些功能的 AngularJS 组件中提供功能。正如你在本章目前为止所看到的，服务为\
  \ AngularJS 应用提供了广泛的功能。\n\n你可能会在代码中实现四种主要类型的服务：`value`、`constant`、`factory` 和 `service`。接下来的章节将介绍这些服务。\n\
  \n### 创建 value 服务\n\n你使用非常简单的 `value` 服务来定义一个单一的值，并可以将其作为服务提供者进行注入。`value` 方法使用以下语法，其中\
  \ `name` 是服务名称，`object` 是你想要提供的任何 JavaScript 对象：\n\n`value(name, object)`\n\n例如：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar app = angular.module('myApp', []);\n\napp.value('myValue',\
  \ {color:'blue', value:'17'});\n```\n\n### 创建 constant 服务\n\n`constant` 服务基本上与 `value`\
  \ 服务相同，不同之处`constant` 服务在构建 `Module` 对象的配置阶段（configuration phase）可用，而 `value` 服务则不可用。`constant`\
  \ 方法使用以下语法，其中 `name` 是服务名称，`object` 是你想要提供的任何 JavaScript 对象：\n\n`constant(name,\
  \ object)`\n\n例如：\n\n点击此处查看代码图像\n\n```javascript\nvar app = angular.module('myApp',\
  \ []);\n\napp.constant('myConst', \"Constant String\");\n```\n\n### 创建 factory 服务\n\
  \n`factory` 方法提供了在服务中实现功能的能力。它还可以依赖于其他服务提供者，允许你构建模块化的代码。`factory` 方法使用以下语法，其中 `name`\
  \ 是服务名称，`factoryProvider` 是一个构建工厂服务的构造函数：\n\n点击此处查看代码图像\n\n`factory(name, factoryProvider)`\n\
  \n你可以将其他服务注入 `factory` 方法，它会返回带有相应功能的服务对象。该功能可以是一个复杂的 JavaScript 服务、一个值，或者一个简单的函数。例如，下面的代码实现了一个\
  \ `factory` 服务，该服务返回一个两个数字之和的函数：\n\n点击此处查看代码图像\n\n```javascript\nvar app = angular.module('myApp',\
  \ []);\n\napp.constant('myConst', 10);\n\napp.factory('multiplier', ['myConst',\
  \ function (myConst) {\n\n  return function(value) { return value*myConst; };\n\
  }]);\n```\n\n### 创建 service 服务\n\n`service` 方法提供了在服务器中实现功能的能力。然而，`service` 方法的工作方式与\
  \ `factory` 方法略有不同。`service` 方法接受构造函数作为第二个参数，并使用它创建对象的新实例。`service` 方法使用以下语法，其中\
  \ `name` 是服务名称，`constructor` 是构造函数：\n\n`service(name, constructor)`\n\n`service`\
  \ 方法也可以接受依赖注入。下面的代码实现了一个基础服务方法，提供一个 `add()` 函数和一个 `multiply()` 函数：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar app = angular.module('myApp', []);\n\napp.constant('myConst',\
  \ 10);\n\nfunction ConstMathObj(myConst) {\n\n  this.add = function(value){ return\
  \ value + myConst; };\n\n  this.multiply = function(value){ return value * myConst;\
  \ };\n}\n\napp.service('constMath', 'myConst', ConstMathObj);\n```\n\n注意 `ConstMathObj`\
  \ 构造函数首先创建，然后 `service()` 方法调用它并使用依赖注入插入 `myConst` 服务。\n\n### 在模块中集成服务\n\n[Listing\
  \ 25.10 中的代码了将 `value`、`constant`、`factory` 和 `service` 服务集成到单个模块中的示例。该示例非常基础且易理解。注意\
  \ `censorWords` 和 `repString` 被注入到 `factory` 和 `service` 的定义中并使用。\n\n第 4–13 行实现了一个返回过滤字符串函数的的\
  \ `factory` 服务。注意第 26 行直接调用 `factory` 来过滤字符串。\n\n第 14–23 行通过首先定义一个对象构造函数，然后在第 23\
  \ 行将服务注册到应用程序，实现了一个 `service` 服务。注意第 27 行调用构造函数中定义的 `censor()` 方法来过滤文本。\n\nListing\
  \ 25.10 `service_custom.js`: 在 AngularJS 控制器中实现和消费自定义服务\n\n点击此处查看代码图像\n\n```javascript\n\
  01 var app = angular.module('myApp', []);\n02 app.value('censorWords', ['bad','mad','sad']);\n\
  03 app.constant('repString', \"****\");\n04 app.factory('censorF', ['censorWords',\
  \ 'repString',\n05                   function (cWords, repString) {\n06    return\
  \ function(inString) {\n07      var outString = inString;\n08      for(i in cWords){\n\
  09        outString = outString.replace(cWords[i], repString);\n10      }\n11  \
  \    return outString;\n12    };\n13 }]);\n14 function CensorObj(cWords, repString)\
  \ {\n15    this.censor = function(inString){\n16      var outString = inString;\n\
  17      for(i in cWords){\n18        outString = outString.replace(cWords[i], repString);\n\
  19      }\n20      return outString;\n21    };\n22 }\n23 app.service('censorS',\
  \ ['censorWords', 'repString', CensorObj]);\n24 app.controller('myController', ['$scope',\
  \ 'censorF', 'censorS',\n25                                   function($scope, censorF,\
  \ censorS) {\n26      $scope.censoredByFactory = censorF(\"mad text\");\n27    \
  \  $scope.censoredByService = censorS.censor(\"bad text\");\n28   ]);\n```\n\n##\
  \ 总结\n\nAngularJS 服务是单例对象，你可以将其注册到依赖注入器；控制器和其他 AngularJS 组件可以使用它们。AngularJS 在服务提供了许多后端功能，例如\
  \ `$http`，它允许你轻松地将服务器通信集成到应用程序中。\n\nAngularJS 提供了多种创建自定义服务的方法，复杂度不同。`value` 和 `constant`\
  \ 方法创建简单的服务。相反，`factory` 和 `service` 方法允许你创建更复杂的服务。\n\n### 下一步\n\n在下一章节中，你将切换方向，开始查看你目前所学内容的更具实际的应用。下一章节提供了一个为网站添加用户账户的端到端示例，包含了各种身份验证方法。\n\
