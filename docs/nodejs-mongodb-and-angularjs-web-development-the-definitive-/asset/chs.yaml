  13    app.get('/words', words.getWords);\n14 };\n```\n\n### 实现标签页视图\n\n配置好服务器和路由后，你就可以准备这些示例了。你将从标签页视图开始，因为示例的其他部分是作为内部的标签实现的。你完全使用自定义的\
  \ AngularJS 模板指令来创建标签页视图，它是基于 AngularJS 文档网站上提供的示例的。\n\n该指令包含两个部分：使用该指令的模板和实现指令的\
  \ JavaScript 代码。后续章节将首先描述实现模板，然后是 JavaScript `Module` 对象代码。\n\n#### 创建 AngularJS\
  \ 标签页视图模板\n\n你需要实现三个模板来支持标签页视图。第一个支持面板（pane），第二个通过支持多个面板来支持标签（tabs），第三个实际上在标准的 AngularJS\
  \ 模板中实现标签页指令。\n\n#### 定义面板模板\n\n你需要定义一个模板作为标签页视图的面板。面板只是一个容器，可以包含你想要添加的任何内容。代码列表\
  \ 29.4 显示了带有单个 `<div>` 元素的 Basic 面板模板。\n\n你为元素分配 `pane` 类以进行样式设置，并使用 `ng-show` 指令仅在\
  \ `selected` 为 `true` 时显示面板，同时使用 `ng-transclude` 指令允许内容包裹。\n\n代码列表 29.4 `rich_pane.html`:\
  \ 为标签页视图实现面板模板视图\n\n```html\n01 <div class=\"pane\"\n02      ng-show=\"selected\"\
  \n03      ng-transclude>\n04 </div>\n```\n\n#### 定义标签模板\n\n接下来，你需要定义一个模板作为面板元素的容器，以支持标签页视图中的多个面板。标签容器需要支持定义面板元素。代码列表\
  \ 29.5 显示了标签模板。\n\n你为元素分配 `tabs` 类以进行样式设置。为了实现多个面板，你定义了一个 `<span>` 元素，它在自定义代码定义的\
  \ `panes` 数组上实现了 `ng-repeat` 指令。注意，`ng-click` 指令调用 `select(pane)` 来选择面板并使其可见。\n\n\
  此外，你使用 `ng-class` 指令在 `pane.selected` 为 `true` 时添加 `activeTab` 类。第 8 行定义了 `<div>`\
  \ 元素，面板内容在此处透传。\n\n代码列表 29.5 `rich_tabs.html`: 为标签页视图实现标签模板视图\n\n```html\n01 <div\
  \ class=\"tabbable\">\n02   <div class=\"tabs\">\n03      <span class=\"tab\" ng-repeat=\"\
  pane in panes\"\n04        ng-class=\"{activeTab:pane.selected}\"\n05        ng-click=\"\
  select(pane)\">{{pane.title}}\n06      </span>\n07   </</div>\n08   <div class=\"\
  tabcontent\" ng-transclude></div>\n09 </div>\n```\n\n#### 实现标签页视图\n\n定义面板和标签模板后，你就可以新的自定义指令添加到你的\
  \ AngularJS 模板中。为新指令添加多个标签的格式如下，其中 `title` 设置为模板代码中渲染的值：\n\n```html\n<rich_tabs>\n\
  \  <rich_pane title=\"Tab 1\">\n    Your Content\n  </rich_pane>\n  <rich_pane title=\"\
  Tab 2\">\n    Your Content\n  </rich_pane>\n</rich_tabs>\n```\n\n\n\n\n\nListing\
