  \ worker 和 client 代码)*\n\n## 理解 Worker 对象\n\n当一个工作进程被分叉时，主进程和工作进程中都会创建一个新的 `Worker`\
  \ 对象。在工作进程中，`Worker` 对象用于表示当前工作进程，并与正在发生的集群事件进行交互。在主进程中，`Worker` 对象用于表示子工作进程，以便你的主应用程序可以向它们发送消息、接收关于它们状态变更的事件，甚至杀死它们。\n\
