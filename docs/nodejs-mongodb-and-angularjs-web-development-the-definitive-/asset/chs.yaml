  \ 渲染引擎与 AngularJS 支持功能之间的交互。后续章节将讨论 `index`、`signup`、`login` 和 `user` 视图。\n\n这些视图是以\
  \ EJS 模板实现的。本章使用 EJS 渲染引擎是因为它与 HTML 非常相似，因此你不需要学习新的模板语言（如 Jade）。不过，你可以使用 Express\
  \ 支持的任何模板引擎来达到相同的结果。\n\n#### 实现 signup 视图\n\n对于 `signup` 视图，列表 26.10 实现了一个简单的注册表单，允许你指定新的用户名、密码和电子邮件。主体包含一个\
  \ `<div>` 元素，作为表单的样式样式容器。表单由 `text`、`password` 和 `email <input>` 元素组成。表单方法为 `POST`，以便将\
  \ `username`、`password` 和 `email` 字段包含在路由的 `POST` 请求中。注意包含了 `<%=msg>` EJS 脚本元素，以便在会话中存在消息时显示它。图\
  \ 26.1 显示了渲染后的视图。\n\n列表 26.10 `signup.html`：实现 `signup` EJS HTML 模板。\n\n点击此处查看代码图片\n\
