  图 7.2 实现并访问基础静态文件 Web 服务器。\n\n### 实现动态 GET 服务器\n\n你使用 Node.js Web 服务器提供动态内容的频率将比使用它们提供静态内容的频率更高。这些内容可能是动态\
  \ HTML 文件或片段、JSON 数据或许多其他类型的数据。要动态地处理一个 `GET` 请求，你需要在请求处理器中实现代码，动态地填充你想要发回给客户端的数据，将其写入响应中，然后调用\
