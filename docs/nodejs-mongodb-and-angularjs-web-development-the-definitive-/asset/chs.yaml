  ### 使用 Stream 模块流传输数据\nNode.js 中一个重要的模块是 `Stream` 模块。数据流是可读、可写或两者兼备的内存结构。流广泛应用于\
  \ Node.js 的各个领域，例如访问文件、从 HTTP 请求中读取数据以及其他几个领域。本节涵盖了如何使用 `Stream` 模块创建流以及从流中读取和写入数据。\n\
  \n流的目的是提供一种将数据从一个位置传输到另一个位置通用机制。它们还暴露了事件，例如当有数据可读时触发 `data` 事件，当发生错误时触发 `error`\
  \ 事件等，以便你可以注册监听器在流中的数据变得可用或准备好写入时对其进行处理。\n流通常用于 HTTP 数据和文件。你可以将文件打开为可读流，或者将 HTTP\
  \ 请求中的数据作为可读流访问并根据需要读取字节。此外，你还可以创建自己的自定义流。接下来的章节描述了创建和使用 `Readable`、`Writable`、`Duplex`\
  \ 和 `Transform` 流的过程。\n\n#### 可读流 (Readable Streams)\n`Readable` 流旨在提供一种机制，以便从另一个源轻松读取进入应用程序的数据。可读的一些常见示例包括：\n\
  ![Image](img/00003.jpeg) 客户端的 HTTP 响应\n![Image](img/00003.jpeg) 服务端的 HTTP 请求\n![Image](img/00003.jpeg)\
  \ `fs` 读流\n![Image](img/00003.jpeg) `crypto` 流\n![Image](img/00003.jpeg) TCP 套接\n\
  ![Image](img/00003.jpeg) 子进程的 `stdout` 和 `stderr`\n\n\n![Image](img/00003.jpeg)\
  \ **readable：** 当可以从流中读取数据块时触发。\n![Image](img/00003.jpeg) **data：** 与 `readable`\
  \ 类似，不同在于当绑定了 `data` 事件处理器时，流会变为流动模式（flowing mode），`data` 处理器会被连续调用，直到所有数据都被排空。\n\
  ![Image](img/00003.jpeg) **close：** 当底层资源（如文件）被关闭时触发。\n\n\n\n表 5.4 **`Readable`\
  \ 流对象上可用的方法**\n\n\n点击此处查看代码图片\n\nvar util = require('util');\n\nutil.inherits(MyReadableStream,\
