  \ `login` 视图允许你登录服务器。\n\n### 实现用户视图\n\n对于 `user` 视图，Listing 26.13 实现了两个简单的表单。第一个表单允许你修改用户的\
  \ `email` 和 `color` 偏好。主体包含一个 `<div>` 元素，它创建一个 AngularJS 控制器的实例，该选择器从 Web 服务器获取用户信息。用户名\
  \ `<input>` 元素被设置为 `disabled`，以防止用户更改用户名。\n\n注意，通过 `ng-model` 将输入绑定到 AngularJS 作用域中的\
  \ `$scope.user` 值。还要注意，表单方法为 `POST`，但也包含了 `action` 属性，该属性指定了用于保存或删除用户的路由。请记住，使用\
  \ `action` 属性会覆盖 AngularJS 对普通 `<form>` 功能的抑制。此页面还包含 `<%=msg>` EJS 脚本元素，用于在会话中存在消息时显示该消息。Figure\
  \ 26.4 显示了渲染后的 `user` 视图。\n\nListing 26.13 `user.html`: 实现 `user` EJS HTML 模板\n\n\
  点击此处查看代码图片\n\n```html\n<!doctype html>\n<html ng-app=\"myApp\">\n<head>\n  <title>User\
