  \ 16 行的第一个事件处理器实现了 `logCar(make)` 回调处理器。为了给 `logColorCar()` 添加颜色参数，在第 17–21 行定义的事件处理器中使用了一个匿名函数。随机选择的颜色被传递给调用\
  \ `logColorCar(make, color)`。图 4.8 显示了来自列表 4.5 的输出。\n列表 4.5 `callback_parameter.js`：创建一个匿名函数以添加未由事件发射的额外参数。\n\
  \n点击此处查看代码图像\n```javascript\nvar events = require('events');\nfunction CarShow()\
  \ {\n  this.seeCar = function(make){\n  };\n}\nCarShow.prototype.__proto__ = events.EventEmitter.prototype;\n\
