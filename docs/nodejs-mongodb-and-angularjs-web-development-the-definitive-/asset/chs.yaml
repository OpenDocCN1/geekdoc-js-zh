  \ 在原始缓冲区上使用的 deflate 压缩算法。\n\n### 压缩和解压缩缓冲区\n\n`Zlib` 模块提供了几个辅助函数，可以轻松地对数据缓冲区进行压缩/解。它们都使用相同的基本格式\
  \ `function(buffer, callback)`，其中 `function` 是压缩/解压缩方法，`buffer` 是要压缩/解压缩的缓冲区，而 `callback`\
  \ 是在压缩/解压缩完成后执行的回调函数。\n\n说明缓冲区压缩/解压缩最简单的方法是展示一些示例。列表 5.11 中的代码提供了几个压缩/解压缩示例，并输出了每个示例的大小结果，如图\
  \ 5.11 所示。\n\n列表 5.11 `zlib_buffers.js`: 使用 `Zlib` 模块压缩/解压缩缓冲区\n\n点击此处查看代码图片\n\n\
  ```javascript\n01 var zlib = require(\"zlib\");\n02 var input = '...............text...............';\n\
  03 zlib.deflate(input, function(err, buffer) {\n04   if (!err) {\n05     console.log(\"\
  deflate (%s): \", buffer.length, buffer.toString('base64'));\n06     zlib.inflate(buffer,\
  \ function(err, buffer) {\n07       if (!err) {\n08         console.log(\"inflate\
  \ (%s): \", buffer.length, buffer.toString());\n09       }\n10     });\n11     zlib.unzip(buffer,\
  \ function(err, buffer) {\n12       if (!err) {\n13         console.log(\"unzip\
  \ (%s): \", buffer.length, buffer.toString());\n14       }\n15     });\n16   }\n\
  17 });\n18 \n19 zlib.deflateRaw(input, function(err, buffer) {\n20   if (!err) {\n\
  21     console.log(\"deflateRaw (%s): \", buffer.length, buffer.toString('base64'));\n\
  22     zlib.inflateRaw(buffer, function(err, buffer) {\n23       if (!err) {\n24\
  \         console.log(\"inflateRaw (%s): \", buffer.length, buffer.toString());\n\
  25       }\n26     });\n27   }\n28 });\n29 \n30 zlib.gzip(input, function(err, buffer)\
  \ {\n31   if (!err) {\n32     console.log(\"gzip (%s): \", buffer.length, buffer.toString('base64'));\n\
  33     zlib.inflate(buffer, function(err, buffer) {\n34       if (!err) {\n35  \
  \       console.log(\"inflate (%s): \", buffer.length, buffer.toString());\n36 \
  \      }\n37     });\n38     zlib.unzip(buffer, function(err, buffer) {\n39    \
  \   if (!err) {\n40         console.log(\"unzip (%s): \", buffer.length, buffer.toString());\n\
  41       }\n42     });\n43   }\n44 });\n```\n\n![Image](img/00047.jpeg)\n\n图 5.11\
  \ `zlib_buffers.js` 的输出，实现了缓冲区压缩。\n\n### 压缩和解压缩流\n\n使用 `Zlib` 压缩/解压缩流与缓冲区略不同。相反，你使用\
  \ `pipe()` 函数将流通过压缩/解压缩传递到另一个流。列表 5.12 中的代码展示了使用 `fs.ReadStream` 和 `fs.WriteStream`\
  \ 压缩文件的良好示例。注意在尝试解压缩之前有 5 秒的延迟以允许数据刷新磁盘。\n\n列表 5.12 `zlib_file.js`: 使用 `Zlib` 模块压缩/解压缩流\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var zlib = require(\"zlib\");\n02 var gzip = zlib.createGzip();\n\
  03 var fs = require('fs');\n04 var inFile = fs.createReadStream('zlib_file.js');\n\
  05 var outFile = fs.createWriteStream('zlib_file.gz');\n06 inFile.pipe(gzip).pipe(outFile);\n\
  07 setTimeout(function(){\n08   var gunzip = zlib.createUnzip({flush:zlib.FULL_FLUSH});\n\
  09   var inFile = fs.createReadStream('zlib_file.gz');\n10   var outFile = fs.createWriteStream('unzipped');\n\
  11   inFile.pipe(gunzip).pipe(outFile);\n12 }, 3000);\n```\n\n## 总结\n\n大多数密集型 Web\
  \ 应用和服务的内核是数据在系统之间的流动。在本章中，你学习了如何使用 Node.js 内置功能处理 JSON 数据、操作二进制缓冲区数据以及利用数据流。你还有机会对缓冲区数据以及通过数据流进行压缩实验。\n\
  \n### 下一步\n\n在下一章中，你将看到如何从 Node.js 访问文件系统。你将读写文件、创建目录并读取文件系统信息。\n\n## 6. 从 Node.js\
  \ 访问文件系统\n\n与文件系统交互是非常重要的，特别是当你需要管理动态文件以支持 应用程序或服务时。Node.js 在 `fs` 模块中提供了与文件系统交互良好的接口。该模块提供了大多数语言中可用的标准文件\
  \ API，用于打开、读取、写入和与文件交互。\n\n本章解释了从 Node.js 访问文件系统的基础知识。你应该能够创建、读取和修改文件，还可以导航目录结构。你还可以访问文件和文件夹信息，并删除、截断和重命名文件和文件夹。\n\
  \n对于本章讨论的所有文件系统调用，你需要加载 `fs` 模块，例如：\n\n```javascript\nvar fs  = require('fs');\n\
  ```\n\n## 同步与异步文件系统调用\n\n\n\n\nNode.js 提供的 `fs` 模块几乎所有功能都以两种形式提供：异步和同步。例如，它提供了异步形式的\
  \ `write()` 和同步形式的 `writeSync()`。在实现代码时，理解它们之间的区别非常重要。\n\n同步文件系统调用会阻塞直到调用完成，然后将控制权交还给线程。这有优点，但如果同步调用阻塞了主事件线程或过多的后台线程池线程，也可能在\
  \ Node.js 中导致严重的性能问题。因此，你应该尽可能限制同步文件系统调用的使用。\n\n异步调用被放置在事件队列中稍后执行。这允许调用符合 Node.js\
  \ 的事件模型，但在执行代码时可能会有一点棘手，因为在异步调用被事件循环拾取之前，调用线程会继续运行。\n\n在大多数情况下，同步和异步文件系统调用的底层功能是完全相同的。同步和异步文件系统调用都接受相同的参数，但有一个例外：所有的异步调用在末尾都需要要求一个额外的参数，即在文件系统调用完成时执行的回调函数。\n\
  \n以下列表描述了 Node.js 中同步和异步文件系统调用之间的重要区别：\n\n![Image](img/00003.jpeg) 异步调用需要一个回调函数作为额外参数。回调函数在文件系统请求完成后执行，通常将错误作为其第一个参数。\n\
  \n![Image](img/00003.jpeg) 异步调用会自动处理异常，并在发生异常时将错误对象作为第一个参数传递。要处理同步调用中的异常，你必须使用 `try/catch`\
  \ 块。\n\n![Image](img/00003.jpeg) 同步调用立即执行，在它们完成之前执行不会返回到当前线程。异步调用被放置在事件队列中，执行返回到运行线程代码，但实际调用在被事件循环拾取之前不会执行。\n\
  \n## 打开和关闭文件\n\nNode.js 提供了打开文件的同步和异步方法。一旦打开文件，你就可以从中读取数据或向其写入数据，这取决于打开文件时使用的标志。在\
  \ Node.js 应用中打开文件，请使用以下异步或同步语句之一之一：\n\n点击此处查看代码图片\n\n```\nfs.open(path, flags, [mode],\
  \ callback)\nfs.openSync(path, flags, [mode])\n```\n\n`path` 参数指定了文件系统的标准路径字符串。`flags`\
  \ 参数指定了以何种模式打开文件——读取、写入、追加等，如 表 6.1 所示。可选的 `mode` 参数设置文件访问模式，默认值为 `0666`，即可读可写。\n\
  \n![Image](img/00049.jpeg)\n\n表 6.1 **定义文件打开方式的标志 (Flags that define how files are\
  \ opened)**\n\n一旦文件被打开，你就需要关闭它以强制将更改刷到磁盘并释放操作系统锁。你通过使用以下方法之一并将文件描述符传递给它来关闭文件。在异步\
  \ `close()` 调用中，你还需要指定一个回调函数：\n\n```\nfs.close(fd, callback)\nfs.closeSync(fd)\n\
  ```\n\n以下是用异步模式打开和关闭文件的示例。注意，这里指定了一个回调函数，并接收一个 `err` 和 `fd` 参数。`fd` 参数是你用于读取或写入文件的文件描述符：\n\
  \n点击此处查看代码图片\n\n```javascript\nfs.open(\"myFile\", 'w', function(err, fd){\n  if\
  \ (!err){\n    fs.close(fd);\n  }\n});\n```\n\n以下是用同步模式打开和关闭文件的示例。注意，没有回调函数，且用于读取和写入文件的文件描述符直接从\
  \ `fs.openSync()` 返回：\n\n点击此处查看代码图片\n\n```javascript\nvar fd = fs.openSync(\"myFile\"\
  , 'w');\nfs.closeSync(fd);\n```\n\n## 写入文件\n\n`fs` 模块提供了四种向文件写入数据的不同方法。你可以通过单次调用向文件写入数据、使用同步写入写入数据块、使用异步写入数据块，或通过\
  \ `Writable` 流进行流式写入。这些每种方法都接受 `String` 或 `Buffer` 对象作为输入。接下来的章节描述了如何使用这些方法。\n\n\
  ### 简单文件写入\n\n向文件写入数据最简单的方法是使用 `writeFile()` 方法之一。这些方法将字符串或缓冲的完整内容写入文件。以下是 `writeFile()`\
  \ 方法的语法：\n\n点击此处查看代码图片\n\n```javascript\nfs.writeFile(path, data, [options], callback)\n\
  fs.writeFileSync(path, data, [options])\n```\n\n`path` 参数指定文件的路径，可以是相对路径也可以是绝对路径。`data`\
  \ 参数指定要写入文件的 `String` 或 `Buffer` 对象。可选的 `options` 参数是一个对象，可以包含 `encoding`、`mode`\
  \ 和 `flag` 属性，这些属性定义了字符串编码以及打开文件时使用的模式和标志。\n\n异步方法还需要 `callback` 参数，该参数将在文件写入完成后被调用。列表\
  \ 6.1 中的代码展示了如何实现简单的异步写入。\n\n**列表 6.1 `file_write.js`: 向文件写入字符串**\n\n点击此处查看代码图片\n\
  \n```javascript\nvar fs = require('fs');\nvar config = {\n  maxFiles: 20,\n  maxConnections:\
  \ 15,\n  rootPath: \"/root\"\n};\nvar configTxt = JSON.stringify(config);\nvar options\
  \ = {encoding:'utf8', flag:'w'};\nfs.writeFile('config.txt', configTxt, options,\
  \ function(err){\n  if (err){\n    console.log(\"Config Write Failed.\");\n  } else\
  \ {\n    console.log(\"Config Saved.\");\n  }\n});\n```\n\n![Image](img/00050.jpeg)\n\
  \n图 6.1 `file_write.js` 的输出，写入配置。\n\n### 同步文件写入\n\n同步文件写入方法涉及向返回写入数据，其优点是允许在同一代码段中多次写入，但如前所述，如果文件写入阻塞了其他线程，可能会是一个缺点。\n\
  \n要同步写入文件，首先使用 `openSync()` 打开文件以获取文件描述符，然后使用 `fs.writeSync()` 向文件写入数据。以下是 `fs.writeSync()`\
  \ 的语法：\n\n点击此处查看代码图片\n\n```javascript\nfs.writeSync(fd, data, offset, length, position)\n\
  ```\n\n`fd` 参数是 `openSync()` 返回的文件描述符。`data` 参数指定要写入文件的 `String` 或 `Buffer` 对象。`offset`\
  \ 参数指定从 `data` 参数中的哪个索引开始读取。如果你想从字符串或缓冲的当前索引开始，则此值应为 `null`。`length` 参数指定要写入的字节数；你可以指定\
  \ `null` 以写入到 `data` 缓冲的末尾。`position` 参数指定从文件中开始写入的位置；要使用当前文件位置，请为该值指定 `null`。\n\
  \n\n\n\n# 列表 6.2 `file_write_sync.js`: 对文件进行同步写入\n\n点击此处查看代码图像\n\n* * *\n\n```javascript\n\
  1 var fs = require('fs');\n2 var veggieTray = ['carrots', 'celery', 'olives'];\n\
  3 fd = fs.openSync('veggie.txt', 'w');\n4 while (veggieTray.length){\n5   veggie\
  \ = veggieTray.pop() + \" \";\n6   var bytes = fs.writeSync(fd, veggie, null, null);\n\
  7   console.log(\"Wrote %s %dbytes\", veggie, bytes);\n8 }\n9 fs.closeSync(fd);\n\
  ```\n\n* * *\n\n![Image](img/00051.jpeg)\n\n图 6.2 `file_write_sync.js` 的输出，同步写入文件。\n\
  \n## 异步文件写入\n\n异步文件写入方法会将写入请求放入事件队列，然后将控制权返回给调用代码。直到事件循环获取并执行该写入请求，实际写入才会发生。在对同一个文件执行多个异步写入请求时，你需要非常小心，因为除非你在执行下一个写入之前等待第一个写入的回调，否则你无法保证执行顺序。通常实现此的最简单方法是将写入嵌套在上一个写入的回调中。列表\
  \ 6.3 中的代码说明了这一过程。\n\n要异步写入文件，首先使用 `open()` 打开它，然后在 `open` 请求的回调执行后，使用 `fs.write()`\
  \ 向文件写入数据。以下是 `fs.write()` 的语法：\n\n```javascript\nfs.write(fd, data, offset, length,\
  \ position, callback)\n```\n\n点击此处查看代码图像\n\n`fd` 参数是 `openSync()` 返回的文件句描述符。`data`\
  \ 参数指定要写入文件的 `String` 或 `Buffer` 对象。`offset` 参数指定从输入数据中的哪个索引处开始读取数据。如果你想从字符串或缓冲区的当前索引开始，则此值应为\
  \ `null`。`length` 参数指定要写入的字节数；如果你想在缓冲区的末尾写入，请对此参数指定 `null`。`position` 参数指定从文件中开始写入的位置。若要使用当前文件位置，请对此值指定\
  \ `null`。\n\n`callback` 参数必须是一个可以接受两个参数 `error` 和 `bytes` 的函数，其中 `error` 是写入过程中发生的错误，`bytes`\
  \ 指定写入的字节数。\n\n列表 6.3 中的代码展示了如何实现基础异步写入，以在文件中存储一系列字符串数据。注意，`open()` 回调中第 18–20 行指定的回调调用了\
  \ `writeFruit()` 函数并传递了文件描述符。同样注意，第 6–13 行指定的 `write()` 回调也调用了 `writeFruit()` 并传递了文件描述符。这确保了异步写入在另一个写入执行之前已完成。图\
  \ 6.3 显示了列表 6.3 中代码的输出。\n\n# 列表 6.3 `file_write_async.js`: 对文件进行异步写入\n\n点击此处查看代码图像\n\
  \n* * *\n\n```javascript\n01 var fs = require('fs');\n02 var fruitBowl = ['apple',\
  \ 'orange', 'banana', 'grapes'];\n03 function writeFruit(fd){\n04   if (fruitBowl.length){\n\
  05      var fruit = fruitBowl.pop() + \" \";\n06      fs.write(fd, fruit, null,\
  \ null, function(err, bytes){\n07        if (err){\n08          console.log(\"Write\
  \ Failed.\");\n09        } else {\n10          console.log(\"Wrote: %s %bytes\"\
  , fruit, bytes);\n11          writeFruit(fd);\n12        }\n13      });\n14   }\
  \ else {\n15     fs.close(fd);\n16   }\n17 }\n18 fs.open('fruit.txt', 'w', function(err,\
  \ fd){\n19   writeFruit(fd);\n20 });\n```\n\n* * *\n\n![Image](img/00052.jpeg)\n\
  \n图 6.3 `file_write_async.js` 的输出，异步写入。\n\n## 流式文件写入\n\n向文件写入大量数据时的最佳方法之一是流式，如第\
  \ 5 章所示。`fs` 模块提供了四种读取数据的方式：一次性分块、使用同步写入分块、使用异步写入分块或通过 `Readable` 流流式传输。\n\n要将数据流写入文件，你首先创建一个\
  \ `Writable` 流。`pipe()` 方法可将 `Readable` 流连接到 `Writable` 流，使得处理数据变得非常简单。\n\n# 列表\
  \ 6.4 `file_stream.js`: 实现 `Writable` 流\n\n点击此处查看代码图像\n\n* * *\n\n```javascript\n\
  01 var fs = require('fs');\n02 var grains = ['wheat', 'rice', 'oats'];\n03 var options\
  \ = { encoding:'utf8', flag:'w' };\n04 var fileWriteStream = fs.createWriteStream(\"\
  grains.txt\", options);\n05 fileWriteStream.on(\"close\", function(){\n06   console.log(\"\
  File Closed.\");\n07 });\n08 while (grains.length){\n09   var data = grains.pop()\
  \ + \" \";\n10   fileWriteStream.write(data);\n11   console.log(\"Wrote: %s\", data);\n\
  12 }\n13 fileWriteStream.end();\n```\n\n* * *\n\n![Image](img/00053.jpeg)\n\n图 6.4\
  \ `file_stream.js` 的输出，实现流。\n\n## 读取文件\n\n`fs` 模块提供了四种读取数据的方式：一次性分块、使用同步写入分块、使用异步写入分块或通过\
  \ `Readable` 流流式传输。这些方法都是有效的。使用哪种取决于应用程序的具体需求。以下章节将描述如何使用这些方法。\n\n### 简单文件读取\n\n\
  读取数据最简单的方法是使用 `readFile()` 方法之一。这些方法将文件的完整内容读取到缓冲区。以下是 `readFile()` 的语法：\n\n点击此处查看代码图像\n\
  \n```javascript\nfs.readFile(path, [options], callback)\nfs.readFileSync(path, [options])\n\
  ```\n\n`path` 参数指定文件路径，可以是相对路径或绝对路径。可选的 `options` 参数是一个对象，可以包含 `encoding`、`mode`\
  \ 和 `flag` 属性，定义字符串编码以及打开文件的模式。异步方法还需要 `callback` 参数，将在文件读取完成后调用。\n\n列表 6.5 中的代码说明了如何实现简单的异步\
  \ `readFile()` 请求，从配置文件读取 JSON 字符串，然后使用它创建 `config` 对象。图 6.5 显示了代码的输出。\n\n# 列表 6.5\
  \ `file_read.js code`: 将 JSON 字符串文件读取为对象\n\n```javascript\n01 var fs = require('fs');\n\
  02 var options = {encoding:'utf8', flag:'r'};\n03 fs.readFile('config.txt', options,\
  \ function(err, data){\n04   if (err){\n05     console.log(\"Failed to open Config\
  \ File.\");\n```\n\n\n\n\n\n```javascript\n} else {\n  console.log(\"Config Loaded.\"\
  );\n  var config = JSON.parse(data);\n  console.log(\"Max Files: \" + config.maxFiles);\n\
  \  console.log(\"Max Connections: \" + config.maxConnections);\n  console.log(\"\
  Root Path: \" + config.rootPath);\n} });\n```\n\n![Image](img/00054.jpeg)\n\n图 6.5\
  \ `file_write.js` 的输出，将配置文件读取到对象中。\n\n#### 同步文件读取\n\n同步文件读取方法涉及在将执行返回给运行线程之前，先从文件中读取数据。这种方法的优点是允许你在同一段代码中进行多次读取，但正如前文讨论，如果文件读取阻塞了其他线程，这可能会成为一个缺点。\n\
  \n要以同步方式读取文件，首先使用 `openSync()` 打开文件以获取文件描述符，然后使用 `readSync()` 从文件中读取数据。以下是 `readSync()`\
  \ 的语法：\n\n点击此处查看代码图片\n\n```javascript\nfs.readSync(fd, buffer, offset, length, position)\n\
  ```\n\n`fd` 参数是 `openSync()` 返回的文件描述符。`buffer` 参数指定了将从文件中读取的数据的 `Buffer` 对象。`offset`\
  \ 参数指定了在 buffer 中开始写入数据的索引；如果你想从 buffer 的当前索引开始，则该值应为 `null`。`length` 参数指定了要读取的字节数；要一直读取到\
  \ buffer 末尾，请指定 `null`。`position` 参数指定了从文件中开始读取的位置。若要使用当前文件位置，请将此值指定为 `null`。\n\n\
  列表 6.6 中的代码显示了如何实现基础的同步读取，以从文件中读取块字符串数据。图 6.6 显示了列表 6.6 中代码的输出。\n\n列表 6.6 `file_read_sync.js`：从文件执行同步读取\n\
  \n点击此处查看代码图片\n\n```javascript\nvar fs = require('fs');\nfd = fs.openSync('veggie.txt',\
  \ 'r');\nvar veggies = \"\";\ndo {\n  var buf = new Buffer(5);\n  buf.fill();\n\
  \  var bytes = fs.readSync(fd, buf, null, 5);\n  console.log(\"read %dbytes\", bytes);\n\
  \  veggies += buf.toString();\n} while (bytes > 0);\nfs.closeSync(fd);\nconsole.log(\"\
  Veggies: \" + veggies);\n```\n\n![Image](img/00055.jpeg)\n\n图 6.6 `file_read_sync.js`\
  \ 的输出，从文件执行同步读取。\n\n#### 异步文件读取\n\n异步文件读取方法将读取请求放在事件队列中，然后将控制权返回给调用代码。在事件循环获取并执行读取请求之前，实际的读取不会发生。在同一个文件上执行多个异步读取请求时，你需要小心，因为除非你在等待第一个读取回调执行后再后再执行下一个读取，否则无法保证它们的执行顺序。通常，此最简单的方法是将读取嵌套在上一次读取的回调中。列表\
  \ 6.7 中的代码说明了这一过程。\n\n要以异步方式从文件读取，首先使用 `open()` 打开文件，然后在打开请求的回调执行后，使用 `read()` 从文件中读取数据。以下是\
  \ `read()` 的语法：\n\n```javascript\nfs.read(fd, buffer, offset, length, position,\
  \ callback)\n```\n\n点击此处查看代码图片\n\n`fd` 参数是 `openSync()` 返回的文件描述符。`buffer` 参数指定了将从文件中读取的数据的\
  \ `Buffer` 对象。`offset` 参数指定了在 buffer 中开始读取数据的索引；如果你想从 buffer 的当前索引开始，则该值应为 `null`。`length`\
  \ 参数指定了要读取的字节数；要一直读取到 buffer 末尾，请指定 `null`。`position` 参数指定了从文件中开始读取的位置；若要使用当前文件位置，请将此值指定为\
  \ `null`。\n\n`callback` 参数必须是一个可以接受三个参数的函数：`error`、`bytes` 和 `buffer`。`error` 参数是在读取过程中发生错误时的错误对象，`bytes`\
  \ 指定了读取的字节数，`buffer` 是填充了读取数据的 buffer。\n\n列表 6.7 中的代码显示了如何实现基础的异步读取，以从文件中读取数据块。注意\
  \ `open()` 回调中第 16–18 行指定的回调调用了 `readFruit()` 函数并传递了文件描述符。同样注意第 5–13 行指定的 `read()`\
  \ 回调调用了 `readFruit()` 并传递了文件描述符。这确保了异步读取的完成。图 6.7 显示了列表 6.7 中代码的输出。\n\n列表 6.7 `file_read_async.js`：执行异步读取\n\
  \n点击此处查看代码图片\n\n```javascript\nvar fs = require('fs');\nfunction readFruit(fd, fruits){\n\
  \  var buf = new Buffer(5);\n  buf.fill();\n  fs.read(fd, buf, 0, 5, null, function(err,\
  \ bytes, data){\n    if (bytes > 0) {\n      console.log(\"read %dbytes\", bytes);\n\
  \      fruits += data;\n      readFruit(fd, fruits);\n    } else {\n      fs.close(fd);\n\
  \      console.log (\"Fruits: %s\", fruits);\n    }\n  });\n}\nfs.open('fruit.txt',\
  \ 'r', function(err, fd){\n  readFruit(fd, \"\");\n});\n```\n\n![Image](img/00056.jpeg)\n\
  \n图 6.7 `file_read_async.js` 的输出，从文件异步读取。\n\n#### 流文件读取\n\n从文件中读取大量数据时的最佳方法之一是流式（streaming），它将文件作为\
  \ `Readable` 流打开。正如第 5 章 所讨论的，你可以轻松地通过 `pipe()` 方法将 `Readable` 流到 `Writable` 流，例如\
  \ HTTP 响应。\n\n要从文件流式传输数据，首先需要使用以下语法创建一个 `Readable` 流对象：\n\n点击此处查看代码图片\n\n```javascript\n\
  fs.createReadStream(path, [options])\n```\n\n`path` 参数指定文件的路径，可以是相对路径或绝对路径。可选的 `options`\
  \ 参数是一个对象，可以包含定义打开文件时使用的字符串编码、模式和标志。\n\n打开 `Readable` 文件流后，你可以通过使用 `readable` 事件配合\
  \ `read()` 请求或通过实现事件处理器来轻松地读取它，如列表 6.8 所示。\n\n列表 6.8 中的代码显示了如何实现基础的 `Readable` 文件流。注意第\
  \ 4–7 行实现的 `data` 事件处理器会持续从流中读取数据。图 6.8 显示了列表 6.8 中代码的输出。\n\n列表 6.8 `file_read_stream.js`：允许流式读取文件的\
  \ `Readable` 流\n\n点击此处查看代码图片\n\n```javascript\nvar fs = require('fs');\nvar options\
  \ = { encoding: 'utf8', flag: 'r' };\nvar fileReadStream = fs.createReadStream(\"\
  grains.txt\", options);\nfileReadStream.on('data', function(chunk) {\n  console.log('Grains:\
  \ %s', chunk);\n  console.log('Read %d bytes of data.', chunk.length);\n});\nfileReadStream.on(\"\
  close\", function(){\n  console.log(\"File Closed.\");\n});\n```\n\n![Image](img/00057.jpeg)\n\
  \n图 6.8 `file_read_stream.js` 的输出，从文件执行流式读取。\n\n## 其他文件系统任务\n\n\n\n\n\n除了允许你读取和写入文件之外，`fs`\
  \ 模块还提供了与文件系统交互的额外功能。例如，你可以用它来列出目录中的文件、查看文件信息等。接下来的章节涵盖了在创建 Node.js 时可能需要实现的最常见文件系统任务。\n\
  \n## 验证路径是否存在\n\n在对文件或目录进行任何读/写操作之前，你可能想验证 `path` 是否存在。你可以通过以下方法之一轻松地实现这一点：\n\n\
  ```\nfs.exists(path, callback)\nfs.existsSync(path)\n```\n\n`fs.existsSync(path)`\
  \ 返回 `true` 或 `false`，取决于 `path` 是否存在。与任何其他异步文件系统调用一样，如果你使用 `fs.exists()`，则需要实现一个在调用完成后执行的回调函数。该回调将接收一个\
  \ `true` 或 `false` 的 `Boolean` 值，取决于 `path` 是否存在。例如，以下代码验证了当前路径下名为 `filesystem.js`\
  \ 的文件是否存在并显示结果：\n\n点击此处查看代码图片\n\n```\nfs.exists('filesystem.js', function (exists)\
  \ {\n  console.log(exists ? \"Path Exists\" : \"Path Does Not Exist\");\n});\n```\n\
  \n## 获取文件信息\n\n另一个常见任务是获取文件系统对象的基本信息，例如文件大小、模式、修改时间、条目是文件还是文件夹等。你可以通过以下调用之一获取此类信息：\n\
  \n```\nfs.stats(path, callback)\nfs.statsSync(path)\n```\n\n`fs.statsSync()` 方法返回一个\
  \ `Stats` 对象。执行 `fs.stats()` 方法后，`Stats` 对象将作为第二个参数传递给回调函数。如果发生错误，第一个参数为 `error`。\n\
  \n表 6.2 列出了附加在 `Stats` 对象上的一些常用属性和方法。\n\n![Image](img/00058.jpeg)\n\n表 6.2 用于文件系统条目的\
  \ `Stats` 对象的属性和方法\n\n示例 6.9 中的代码说明了如何使用 `fs.stats()` 调用：通过执行该调用，将对象的结果作为 JSON 字符串输出，并使用\
  \ `isFile()`、`isDirector()` 和 `isSocket()` 调用，如图 6.9 中的输出所示。\n\n示例 6.9 `file_stats.js`:\
  \ 实现 `fs.stats()` 调用以检索文件信息\n\n点击此处查看代码图片\n\n```\n01 var fs = require('fs');\n02\
  \ fs.stat('file_stats.js', function (err, stats) {\n03   if (!err){\n04      console.log('stats:\
  \ ' + JSON.stringify(stats, null, '  '));\n05      console.log(stats.isFile() ?\
  \ \"Is a File\" : \"Is not a File\");\n06      console.log(stats.isDirectory() ?\
  \ \"Is a Folder\" : \"Is not a Folder\");\n07      console.log(stats.isSocket()\
  \ ? \"Is a Socket\" : \"Is not a Socket\");\n08      stats.isDirectory();\n09  \
  \    stats.isBlockDevice();\n10     stats.isCharacterDevice();\n11     //stats.isSymbolicLink();\
  \ //only lstat\n12     stats.isFIFO();\n13     stats.isSocket();\n14     }\n15 });\n\
  ```\n\n![Image](img/00059.jpeg)\n\n图 6.9 `file_stats.js` 的输出，显示了文件的信息。\n\n## 列出文件\n\
  \n处理文件系统时的另一个常见任务是列出目录中的文件和文件夹——例如，列出目录中的文件以确定它们是否需要清理、对目录结构进行动态操作等。\n\n你可以使用以下命令之一读取条目列表来访问文件系统中的文件：\n\
  \n```\nfs.readdir(path, callback)\nfs.readdirSync(path)\n```\n\n如果调用 `readdirSync()`，将返回一个表示指定\
  \ `path` 中条目名称字符串数组。对于 `readdir()`，列表作为第二个参数传递给回调函数，如果有错误，则作为第一个参数传递。\n\n为了说明 `readdir()`\
  \ 的用法，示例 6.10 中的代码实现了一个嵌套回调链来遍历目录结构并输出条目。注意，回调函数实现了一个包装器以为 `fullPath` 变量提供闭包。\n\n\
  示例 6.10 `file_stats.js`: 实现嵌套回调链以遍历目录结构并输出条目。\n\n```\n01 var fs = require('fs');\n\
  02 var Path = require('path');\n03 function WalkDirs(dirPath){\n04   fs.readdir(dirPath,\
  \ function(err, entries){\n05     for (var idx in entries){\n06       var fullPath\
  \ = Path.join(dirPath, entries[idx]);\n07       fs.stat(fullPath, function(err,\
  \ stats){\n08         if (!err){\n09           if (stats.isFile()){\n10        \
  \     console.log(fullPath);\n11           } else if (stats.isDirectory()){\n12\
  \             console.log(fullPath);\n13           }\n14         });\n15       }\n\
  16     }\n17   });\n18 }\n```\n\n\n\n\n\n`mkdirSync(path)` 函数返回 `true` 或 `false`，取决于目录是否成功创建。另一方面，异步\
  \ `mkdir()` 调用在创建目录时如果遇到错误，会将错误值传递给回调函数。\n\n你应该记住，当使用异步方法时，你需要在该目录中创建子目录之前，等待回调函数执行以完成目录的创建。下面的代码片段展示了如何链式创建子目录结构：\n\
  \n点击查看代码图片\n\n```javascript\nfs.mkdir(\"./data\", function(err){\n  fs.mkdir(\"\
  ./data/folderA\", function(err){\n    fs.mkdir(\"./data/folderA/folderB\", function(err){\n\
  \      fs.mkdir(\"./data/folderA/folderB/folderD\", function(err){\n      });\n\
  \    });\n    fs.mkdir(\"./data/folderA/folderC\", function(err){\n      fs.mkdir(\"\
  ./data/folderA/folderC/folderE\", function(err){\n      });\n    });\n  });\n});\n\
  ```\n\n要从 Node.js 中删除目录，请使用以下 `fs` 调用之一，并使用绝对路径或相对路径：\n\n```javascript\nfs.rmdir(path,\
  \ callback)\nfs.rmdirSync(path)\n```\n\n`rmdirSync(path)` 函数返回 `true` 或 `false`，取决于目录是否成功删除。另一方面，异步\
  \ `rmdir()` 调用在删除目录时如果遇到错误，会将错误值传递给回调函数。\n\n与 `mkdir()` 调用一样，你应该记住，当使用异步方法时，你需要在删除父目录之前，等待删除目录的回调函数执行。下面的代码片段展示了如何链式删除子目录结构：\n\
  \n点击查看代码图片\n\n```javascript\nfs.rmdir(\"./data/folderA/folderB/folderC\", function(err){\n\
  \  fs.rmdir(\"./data/folderA/folderB\", function(err){\n    fs.rmdir(\"./data/folderD\"\
  , function(err){\n    });\n  });\n  fs.rmdir(\"./data/folderA/folderC\", function(err){\n\
  \    fs.rmdir(\"./data/folderE\", function(err){\n    });\n  });\n});\n```\n\n###\
  \ 重命名文件和目录\n\n你可能需要在你的 Node.js 应用中重命名文件和文件夹，以便为新数据腾留空间、存档旧数据或应用用户所更改。重命名文件和文件夹使用以下\
  \ `fs` 调用：\n\n点击查看代码图片\n\n```javascript\nfs.rename(oldPath, newPath, callback)\n\
  fs.renameSync(oldPath, newPath)\n```\n\n`oldPath` 参数指定现有的文件或目录，`newPath` 参数指定新名称。`renameSync(path)`\
  \ 函数返回 `true` 或 `false`，取决于文件或目录是否重命名成功。另一方面，异步 `rename()` 调用在重命名文件或目录时如果遇到错误，会将错误值传递给回调函数。\n\
  \n下面的代码片段说明如何实现 `fs` 调用将名为 `old.txt` 的文件重命名为 `new.txt`，并将名为 `testDir` 的目录重命名为 `renamedDir`：\n\
  \n点击查看代码图片\n\n```javascript\nfs.rename(\"old.txt\", \"new.txt\", function(err){\n\
  \  console.log(err ? \"Rename Failed\" : \"File Renamed\");\n});\n\nfs.rename(\"\
  testDir\", \"renamedDir\", function(err){\n  console.log(err ? \"Rename Failed\"\
  \ : \"Folder Renamed\");\n});\n```\n\n### 监听文件变化\n\n虽然并不完全稳定，但 `fs` 模块提供了一个实用的工具来监听文件并在文件更改时执行回调函数。如果你想在文件被修改时触发事件，但不想从你的应用程序中持续轮询，这会非常有用。监听会在底层系统中产生一些开销，因此你应该谨慎使用。\n\
  \n要对文件实现监听，请使用以下命令：\n\n点击查看代码图片\n\n```javascript\nfs.watchFile(path, [options],\
  \ callback)\n```\n\n你还可以传递 `options`，它是一个包含 `persistent` 和 `interval` 属性的对象。如果你希望进程在文件被监听期间持续运行，则\
  \ `persistent` 属性为 `true`。`interval` 属性指定你对文件进行轮询的时间（单位为毫秒）。\n\n当文件发生变化时，会执行 `callback`\
  \ 函数并传递当前和之前的 `Stats` 对象。下面的代码片段每 5 秒监控一次名为 `log.txt` 的文件，并使用 `Stats` 对象输出文件修改的当前和之前的时间：\n\
  \n点击查看代码图片\n\n```javascript\nfs.watchFile(\"log.txt\", {persistent:true, interval:5000},\
  \ function (curr, prev) {\n  console.log(\"log.txt modified at: \" + curr.mtime);\n\
  \  console.log(\"Previous modification was: \" + prev.mtime);\n});\n```\n\n## 总结\n\
  \nNode.js 提供了 `fs` 模块，用于交互文件系统。你可以使用 `fs` 模块创建、读取、修改和重命名文件和目录。你还可以使用 `fs` 模块监听文件变化。\n\
  \n### 下一步\n\nNode.js 提供了 `http` 和 `https` 模块，可以快速实现 HTTP 和 HTTPS 服务。你将学习如何使用 `http`\
  \ 模块实现基础 Web 服务器。\n\n## 7. 在 Node.js 中实现 HTTP 服务\n\nNode.js 最重要的方面之一是能够快速实现 HTTP\
  \ 和 HTTPS 服务。事实上，仅使用 `http` 模块实现完整的 Web 服务器并不困难。\n\n然而， `http` 模块是非常底层的。你可能会使用 `express`\
  \ 等模块。`http` 模块没有提供路由、Cookie 等功能。在第 18 章（part0031.html_ch18）和第 19 章（part0032.html_ch19）中，你将看到\
  \ `express` 的优势。\n\n### 解析 URL\n\n统一资源定位符（URL）充当 HTTP 服务器用于处理客户端请求的地址标签。它提供了将请求发送到特定端口正确服务器并访问适当数据所需的信息。\n\
  \nURL 可以拆分为几个不同的组件，每个组件都为 Web 服务器如何路由和处理来自客户端的 HTTP 请求提供基础信息。7.1 展示了 URL 的基本结构以及可能包含的组件。并不是所有的组件都会包含在每个\
  \ HTTP 请求中。例如，大多数请求不包含 `auth` 组件，许多请求也不包含查询字符串或哈希位置。\n\n![Image](img/00061.jpeg)\n\
  \n图 7.1 URL 中可能包含的基本组件。\n\n#### 理解 URL 对象\n\n来自客户端的 HTTP 请求包含图 7.1 所示的 URL 字符串。为了能够更有效地使用\
  \ URL 信息，Node.js 提供了 `url` 模块，它提供了将 URL 字符串转换为 `URL` 对象的功能。\n\n\n\n\n\n要从 URL 字符串创建一个\
  \ `URL` 对象，请将 URL 字符串作为第一个参数传递给以下方法：\n\n点击此处查看代码图片\n\n```\nurl.parse(urlStr, [parseQueryString],\
  \ [slashesDenoteHost])\n```\n\n`url.parse()` 方法接受 URL 字符串作为第一个参数。`parseQueryString`\
  \ 参数是一个布尔值（Boolean），当设置为 `true` 时，会将 URL 的查询字符串部分解析为对象字量量。默认值为 `false`。`slashesDenoteHost`\
  \ 也是一个布尔值（Boolean），当设置为 `true` 时，会将格式为 `//host/path` 的 URL 解析为 `{host: 'host', pathname:\
  \ '/path'}`，而不是 `{pathname: '//host/path'}`。默认值为 `false`。\n\n你还可以使用 `url.format()`\
  \ 方法将 `URL` 对象转换为字符串形式：\n\n```\nurl.format(urlObj)\n```\n\n表 7.1 列出了由 `url.parse()`\
  \ 创建的 URL 对象的属性。\n\n![Image](img/00062.jpeg)\n\n表 7.1 **url.parse() 返回的 URL 对象属性**\n\
  \n以下是一个将 URL 字符串解析为对象然后转换回字符串的示例：\n\n点击此处查看代码图片\n\n```\nvar url = require('url');\n\
  \nvar urlStr = 'http://user:pass@host.com:80/resource/path?query=string#hash';\n\
  \nvar urlObj = url.parse(urlStr, true, false);\n\nurlString = url.format(urlObj);\n\
  ```\n\n## 解析 URL 组件\n\n`url` 模块的一个实用功能是能够以浏览器相同的方式解析 URL 组件。这允许你在服务器端处理 URL 字符串，以便对\
  \ URL 进行调整。例如，由于资源可能已移动或更改了参数，你可能想在处理请求之前更改 URL 的位置。\n\n要将一个 URL 解析到新位置，请使用以下语法：\n\
  \n```\nurl.resolve(from, to)\n```\n\n`from` 参数指定原始基础 URL 字符串。`to` 参数指定你想要将 URL 解析到的新位置。下面的代码展示了将\
  \ URL 解析到新位置的示例。\n\n点击此处查看代码图片\n\n```\nvar url = require('url');\n\nvar originalUrl\
  \ = 'http://user:pass@host.com:80/resource/path?query=string#hash';\n\nvar newResource\
  \ = '/another/path?querynew';\n\nconsole.log(url.resolve(originalUrl, newResource));\n\
  ```\n\n此代码段的输出所示：\n\n点击此处查看代码图片\n\n```\nhttp://user:pass@host.com:80/another/path?querynew\n\
  ```\n\n注意，在解析后的 URL 位置中，只有资源 `path` 及其之后的内容被更改了。\n\n## 处理查询字符串和表单参数\n\nHTTP 请求通常在\
  \ URL 中包含查询字符串，或在正文中包含表单提交的数据数据。查询字符串可以从上一节定义的 `URL` 对象中获取。表单请求发送的参数数据可以从本章稍后描述的客户端请求正文中读取。\n\
  \n查询字符串和表单参数只是基本的键/值对。要在你的 Node.js Web 服务器中实际使用这些值，你需要使用 `querystring` 模块中的 `parse()`\
  \ 方法将字符串转换为 JavaScript 对象：\n\n点击此处查看代码图片\n\n```\nquerystring.parse(str, [sep], [eq],\
  \ [options])\n```\n\n`str` 参数是查询字符串或参数字符串。`sep` 参数允许你指定使用的分隔符字符；默认分隔符为 `&`。`eq`\
  \ 参数允许你指定解析时使用的赋值字符；默认为 `=`。`options` 参数是一个对象，具有 `maxKeys` 属性，该属性允许你限制结果对象可以包含的键的数量；默认值为\
  \ `1000`，如果你指定 `0`，则没有限制。\n\n以下是使用 `parse()` 解析查询字符串的示例：\n\n点击此处查看代码图片\n\n```\n\
  var qstring = require('querystring');\n\nvar params = qstring.parse(\"name=Brad&color=red&color=blue\"\
  );\n```\n\n创建的 `params` 对象将是：\n\n```\n{name: 'Brad', color: ['red', 'blue']}\n```\n\
  \n你还可以反向操作，使用 `stringify()` 函数将对象转换为查询字符串：\n\n点击此处查看代码图片\n\n```\nquerystring.stringify(obj,\
  \ [sep], [eq])\n```\n\n## 理解 Request、Response 和 Server 对象\n\n要在 Node.js 应用中使用 `http`\
  \ 模块，你首先需要理解请求（request）和响应（response）对象。它们提供了进出 HTTP 客户端和服务器的信息大部分功能。一旦你了解了这些对象的组成——包括它们提供的属性、事件和方法——实现你自己的\
  \ HTTP 服务器和客户端将变得简单。\n\n接下来的章节将涵盖 `ClientRequest`、`ServerResponse`、`IncomingMessage`\
  \ 和 `Server` 对象的用途和行为。你学习每个对象提供的最重要的事件、属性和方法。\n\n### http.ClientRequest 对象\n\n当构建\
  \ HTTP 客户端并调用 `http.request()` 时，内部会创建一个 `ClientRequest` 对象。该对象旨在表示正在发送到服务器的请求。你使用\
  \ `ClientRequest` 对象来启动、监控和处理来自服务器的响应。\n\n`ClientRequest` 对象实现了 `Writable` 流，因此它提供了\
  \ `Writable` 流对象的所有功能。例如，你可以使用 `write()` 方法向 `ClientRequest` 对象写入数据，也可以将一个 `Readable`\
  \ 流通过（pipe）到其中。\n\n要实现 `ClientRequest` 对象，你调用 `http.request()`，语法如下：\n\n点击此处查看代码图片\n\
  \n```\nhttp.request(options, callback)\n```\n\n`options` 参数是一个对象，定义了如何打开并向服务器发送客户端请求。表\
  \ 7.2 列出了你可以指定的属性。`callback` 参数是一个回调函数，在请求发送到服务器后被调用并用于处理响应。回调的唯一参数是 `IncomingMessage`\
  \ 对象，它是来自服务器的响应。\n\n![Image](img/00063.jpeg)\n\n表 7.2 **创建 ClientRequest 对象时可以指定的选项**\n\
  \n下面的代码展示了 `ClientRequest` 对象的基本实现：\n\n点击此处查看代码图片\n\n```\nvar http = require('http');\n\
  \nvar options = {\n  hostname: 'www.myserver.com',\n  path: '/',\n  port: '8080',\n\
  \  method: 'POST'\n};\n\nvar req = http.request(options, function(response){\n \
  \ var str = ''\n  response.on('data', function (chunk) {\n    str += chunk;\n  });\n\
  \  response.on('end', function () {\n    console.log(str);\n  });\n});\n\nreq.end();\n\
  ```\n\n`ClientRequest` 对象提供了多个事件，允许你处理请求可能经历的各种状态。例如，你可以添加一个监听器，当服务器触发 `response`\
  \ 事件时调用。表 7.3 列出了 `ClientResponse` 对象可用的事件。\n\n![Image](img/00064.jpeg)\n\n表 7.3\
  \ **ClientRequest 对象可用的事件**\n\n除了提供事件外，`ClientRequest` 对象还提供了多个方法，可向请求写入数据、中止请求或结束请求。表\
  \ 7.4 列出了 `ClientRequest` 对象可用的方法。\n\n![Image](img/00065.jpeg)\n\n表 7.4 **ClientRequest\
  \ 对象可用的方法**\n\n### http.ServerResponse 对象\n\n当 HTTP 服务器接收到 `request` 事件时，内部会创建 `ServerResponse`\
  \ 对象。该对象作为第二个参数传递给 `request` 事件处理程序。你使用 `ServerResponse` 对象来构建并向客户端发送响应。\n\n\n\n\
  \n\n`ServerResponse` 对象实现了 `Writable` 流，因此它提供了 `Writable` 流对象的所有功能。例如，你可以使用 `write()`\
  \ 方法向 `ServerResponse` 对象写入数据，也可以将一个 `Readable` 流管道导（`pipe`）到该对象中，以便将数据写回客户端。\n\n\
  在处理客户端请求时，你会使用 `ServerResponse` 对象的属性、事件和方法来构建并发送响应头；写入数据；以及发送响应。Table 7.5 列出了 `ServerResponse`\
  \ 对象上可用的事件和属性。Table 7.6 列出了 `ServerResponse` 对象上可用的方法。\n\n![Image](img/00066.jpeg)\n\
  \n表 7.5 `ServerResponse` 对象上定义的事件和属性\n\n![Image](img/00067.jpeg)\n\n表 7.6 `ServerResponse`\
  \ 对象上可用的方法\n\n### http.IncomingMessage 对象\n\n由 HTTP 服务器或 HTTP 客户端创建 `IncomingMessage`\
  \ 对象。在服务器端，客户端请求由一个 `IncomingMessage` 对象表示；在客户端端，服务器响应由一个 `IncomingMessage` 对象表示。`IncomingMessage`\
  \ 对象可以同时用于两者的原因是它们的功能基本上是相同的。\n\n`IncomingMessage` 对象实现了 `Readable` 流，允许你作为流式源读取客户端请求或服务器响应。这意味着可以监听\
  \ `readable` 和 `data` 事件，并用它们从流中读取数据。\n\n除了 `Readable` 类提供的功能外，`IncomingMessage`\
  \ 对象还提供了 Table 7.7 中列出的属性、事件和方法。这些项允许你访问来自客户端请求或服务器响应的信息。\n\n![Image](img/00068.jpeg)\n\
  \n表 7.7 `ServerResponse` 对象上定义的事件、属性和方法\n\n### HTTP 服务器对象\n\nNode.js 的 HTTP `Server`\
  \ 对象提供了实现 HTTP 服务器的基础框架。它提供了一个底层的套接字（socket），用于监听端口并处理接收请求，然后将响应发送到客户端连接。当服务器处于监听状态时，Node.js\
  \ 不会结束。\n\n`Server` 对象实现了 `EventEmitter` 并触发 Table 7.8 中列出的事件。在实现 HTTP 服务器时，你需要处理至少这些事件中的部分或全部。例如，至少你需要一个事件处理程序来处理在接收客户端请求时触发的\
  \ `request` 事件。\n\n![Image](img/00069.jpeg)\n\n表 7.8 `Server` 对象可以触发的事件\n\n要启动 HTTP\
  \ 服务器，你首先需要使用下面的 `createServer()` 方法创建一个 `Server` 对象：\n\n点击此处查看代码图片\n\n```\nhttp.createServer([requestListener])\n\
  ```\n\n该方法返回 `Server` 对象。可选的 `requestListener` 参数是一个回调函数，它会在 `request` 事件被触发时执行。该回调函数应接受两个参数：第一个是表示客户端请求的\
  \ `IncomingMessage` 对象，第二个是你用于构建和发送响应的 `ServerResponse` 对象。\n\n一旦你创建了 `Server` 对象，就可以通过调用\
  \ `Server` 对象上的 `listen()` 方法来开始监听它：\n\n点击此处查看代码图片\n\n```\nlisten(port, [hostname],\
  \ [backlog], [callback])\n```\n\n这是你最可能使用的方法。以下是各个参数：\n\n![Image](img/00003.jpeg)\
  \ **port:** 指定要监听的端口。\n\n![Image](img/00003.jpeg) **hostname:** 指定 `hostname` 何时接受连接；如果省略，服务器将接受指向任何\
  \ IPv4 地址（`INADDR_ANY`）的连接。\n\n![Image](img/00003.jpeg) **backlog:** 指定允许队列的等待连接的最大数量。默认值为\
  \ `511`。\n\n![Image](img/00003.jpeg) **callback:** 指定服务器开始在指定端口上监听时执行的回调处理程序。\n\n\
  以下代码展示了启动 HTTP 服务器并监听 8080 端口的示例。注意向 `createServer()` 方法传递了一个请求回调处理程序函数：\n\n点击此处查看代码图片\n\
  \n```\nvar http = require('http');\n\nhttp.createServer(function (req, res) {\n\
  \  <<在此处处理请求和响应>>\n}).listen(8080);\n```\n\n你可以使用另外两个方法通过文件系统监听连接。第一个方法接受一个用于监听的文件路径\
  \ `path`，第二个方法接受一个已经打开的文件句描述符 `handle`：\n\n```\nlisten(path, [callback])\nlisten(handle,\
  \ [callback])\n```\n\n要在 HTTP 服务器启动后停止其监听，请使用以下 `close()` 方法：\n\n```\nclose([callback])\n\
  ```\n\n## 在 Node.js 中实现 HTTP 客户端和服务器\n\n现在你已经理解了 `ClientRequest`、`ServerResponse`\
  \ 和 `IncomingMessage` 对象，可以开始实战了。\n\n#### 托管静态文件\n\n最基础的 HTTP 服务器是提供静态文件的。要从 Node.js\
  \ 提供静态文件，你首先需要启动服务器并监听端口。然后，在请求处理程序中，你需要使用 `fs` 模块打开文件，将其内容写入响应。\n\nListing 7.1\
  \ 了静态静态服务器的基本实现。注意第 5 行使用 `createServer()` 创建了服务器，并定义了第 6-15 行所示的请求处理程序。还注意通过调用\
  \ `listen()` 监听 8080 端口。\n\n列表 7.1 `http_server.js`: 实现静态文件服务器\n\n点击此处查看代码图片\n\n\
  ```\nvar fs = require('fs');\nvar http = require('http');\nvar url = require('url');\n\
  var ROOT_DIR = \"html/\";\nhttp.createServer(function (req, res) {\n  var urlObj\
  \ = url.parse(req.url, true, false);\n  fs.readFile(ROOT_DIR + urlObj.pathname,\
  \ function (err,data) {\n    if (err) {\n      res.writeHead(404);\n      res.end(JSON.stringify(err));\n\
  \      return;\n    }\n    res.writeHead(200);\n    res.end(data);\n  });\n}).listen(8080);\n\
  ```\n\n要测试 Listing 7.1 中的代码，你可以使用任何网络浏览器并访问 localhost:8080。\n\nListing 7.2 展示了一个\
  \ HTTP 客户端的基本实现，它向服务器发送 `GET` 请求以获取文件内容。注意请求选项在第 2-6 行中设置，然后在第 16-18 行发了客户端请求。\n\
  \n\n\n\n当请求完成后，回调函数将使用 `on('data')` 处理程序从服务器读取响应内容，然后使用 `on('end')` 处理程序将文件内容记录到文件中。图\
  \ 7.2 显示了 HTTP 客户端的输出以及从 Web 浏览器访问的静态文件。\n\n### 列表 7.2 `http_client_static.js`:\
  \ 获取静态文件的基础 Web 客户端\n\n点击此处查看代码图像\n\n```javascript\n01 var http = require('http');\n\
  02 var options = {\n03     hostname: 'localhost',\n04     port: '8080',\n05    \
  \ path: '/hello.html'\n06   };\n07 function handleResponse(response) {\n08   var\
  \ serverData = '';\n09   response.on('data', function (chunk) {\n10     serverData\
  \ += chunk;\n11   });\n12   response.on('end', function () {\n13     console.log(serverData);\n\
  14   });\n15 }\n16 http.request(options, function(response){\n17   handleResponse(response);\n\
  18 }).end();\n```\n\n![Image](img/00070.jpeg)\n\n图 7.2 实现并访问基础静态文件 Web 服务器。\n\n\
  ### 实现动态 GET 服务器\n\n你使用 Node.js Web 服务器提供动态内容的频率将比使用它们提供静态内容的频率更高。这些内容可能是动态 HTML\
  \ 文件或片段、JSON 数据或许多其他类型的数据。要动态地处理一个 `GET` 请求，你需要在请求处理器中实现代码，动态地填充你想要发回给客户端的数据，将其写入响应中，然后调用\
  \ `end()` 来完成响应并刷新 `Writable` 流。\n\n列表 7.3 显示了动态 Web 服务器的基础实现。在这种情况下，Web 服务器仅用一个动态生成的\
  \ HTTP 文件进行响应。该示例旨在展示发送标头、构建响应，然后通过一系列 `write()` 请求发送数据的过程。\n\n注意第 6 行使用 `createServer()`\
  \ 创建了服务器，第 15 行使用 `listen()` 开始监听 8080 端口。在第 7–15 行定义的请求事件处理器内部，设置了 `Content-Type`\
  \ 标头，然后发送了标头，响应代码为 `200`。实际上，你可能已经进行了大量的处理来准备数据。但在这种情况下，数据只是第 2–5 行定义的 `messages`\
  \ 数组。\n\n注意在第 11–13 行中，循环遍历消息并每次调用 `write()` 以将响应流式传输到客户端。然后于第 14 行中，通过调用 `end()`\
  \ 完成响应。\n\n### 列表 7.3 `http_server_get.js`: 实现基础 `GET` Web 服务器\n\n点击此处查看代码图像\n\n\
  ```javascript\n01 var http = require('http');\n02 var messages = [\n03   'Hello\
  \ World',\n04   'From a basic Node.js server',\n05   'Take Luck'];\n06 http.createServer(function\
  \ (req, res) {\n07   res.setHeader(\"Content-Type\", \"text/html\");\n08   res.writeHead(200);\n\
  09   res.write('<html><head><title>Simple HTTP Server</title></head>');\n10   res.write('<body>');\n\
  11   for (var idx in  messages){\n12     res.write('\\n<h1>' + messages[idx] + '</h1>');\n\
  13   }\n14   res.end('\\n</body></html>');\n15 }).listen(8080);\n```\n\n列表 7.4 显示了一个基础\
  \ HTTP 客户端的实现，它从 列表 7.3 中的服务器读取响应。这与 列表 7.2 中的示例非常相似，但注意没有指定路径，因为该服务并不真正需要。对于更复杂的服务，你将实现查询字符串或复杂的路径路由来处理各种调用。\n\
  \n注意第 11 行将响应的 `statusCode` 记录到控制台。此外，第 12 行也将响应的 `headers` 记录下来。然后于第 13 行记录了来自服务器的完整响应。图\
  \ 7.3 显示了 HTTP 客户端的输出以及从 Web 浏览器访问的动态 `GET` 服务器。\n\n### 列表 7.4 `http_client_get.js`:\
  \ 向 列表 7.3 中的服务器发送 `GET` 请求的基础 Web 客户端\n\n点击此处查看代码图像\n\n```javascript\n01 var http\
  \ = require('http');\n02 var options = {\n03   hostname: 'localhost',\n04   port:\
  \ '8080',\n05   path: '/hello.html'\n06   };\n07 function handleResponse(response)\
  \ {\n08   var serverData = '';\n09   response.on('data', function (chunk) {\n10\
  \     serverData += chunk;\n11   });\n12   response.on('end', function () {\n13\
  \     console.log(serverData);\n14   });\n15 }\n16 http.request(options, function(response){\n\
  17   handleResponse(response);\n18 }).end();\n```\n*(注：此处原文示例代码块与上方逻辑一致，根据要求不翻译代码块)*\n\
