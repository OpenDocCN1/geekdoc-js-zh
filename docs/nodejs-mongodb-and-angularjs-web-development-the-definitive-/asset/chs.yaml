  require('./users_model.js');\n```\n\n```javascript\nrequire('./routes')(app);\n\
  ```\n\nListing 26.2 `auth_server.js`: 实现应用程序连接和服务器\n\n## 实现路由\n\n作为 Express 服务器配置的一部分，加载了\
