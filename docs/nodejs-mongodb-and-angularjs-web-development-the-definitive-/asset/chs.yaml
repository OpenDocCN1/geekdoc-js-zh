  \ 视图的表格中对项目进行过滤和排序。\n\n## 创建自定义过滤器\n\nAngularJS 允许你创建自定义过滤器者，并像使用内置过滤器一样在表达式、控制器和服务中使用它。AngularJS\
  \ 提供了 `filter()` 方法来创建过滤器者并将其注册到依赖注入服务器。\n\n过滤器函数应该接受表达式输入作为第一个参数，以及随后的任何额外参数。例如：\n\
  \n```javascript\nfilter('myFilter', function(){\n  return function(input, param1,\
  \ param2){\n    return <<modified input>>;\n  };\n});\n```\n\n在过滤器函数内部，你可以以任何方式更改输入的值。过滤器函数返回的任何值将作为表达式的结果返回。\n\
  \n\n\n\n\n列表 23.7 和 23.8 创建了一个自定义过滤器函数，该函数可以对字符串中的词进行过滤，并允许将替换值作为可选参数。列表 23.7 在第\
  \ 2–10 行实现了 `censor` 过滤器提供者。随后在第 12–29 行，控制器使用依赖注入添加了 `censorFilter` 提供者。第 16–18\
  \ 行中的 `filterText()` 函数利用 `censorFilter` 提供者对文本进行过滤并将其替换为 `<<censored>>`。\n\n列表\
  \ 23.8 中的代码实现了一个模板，该模板以多种方式使用了该过滤器，包括根据点击事件调用 `filterText()`。图 23.4 显示了这些列表的输出。\n\
  \n### 列表 23.7 `angular_filter_customer.js`: 在 AngularJS 中实现自定义过滤器提供者\n\n点击此处查看代码图像\n\
  \n```javascript\n01 angular.module('myApp', []).\n02    filter('censor', function()\
  \ {\n03      return function(input, replacement) {\n04        var cWords = ['bad',\
  \ 'evil', 'dark'];\n05        var out = input;\n06        for(var i=0; i<cWords.length;\
  \ i++){\n07          out = out.replace(cWords[i], replacement);\n08        }\n09\
  \        return out;\n10      };\n11    }).\n12    controller('myController', ['$scope',\
  \ 'censorFilter',\n13                                  function($scope, censorFilter)\
  \ {\n14      $scope.phrase=\"This is a bad phrase.\";\n15      $scope.txt = \"Click\
  \ to filter out dark and evil.\";\n16      $scope.filterText = function(){\n17 \
  \       $scope.txt = censorFilter($scope.txt, '<<censored>>');\n18      };\n19 \
  \   }]);\n```\n\n### 列表 23.8 `angular_filter_custom.html`: 使用自定义过滤器的 AngularJS 模板\n\
  \n点击此处查看代码图像\n\n```html\n01 <!doctype html>\n02 <html ng-app=\"myApp\">\n03    <head>\n\
  04      <title>AngularJS Custom Filter</title>\n05    </head>\n06    <body>\n07\
  \      <div ng-controller=\"myController\">\n08        <h2>Sorting and Filtering</h2>\n\
  09        {{phrase | censor:\"***\"}}<br>\n10        {{\"This is some bad, dark\
  \ evil text.\" | censor:\"happy\"}}\n11        <p ng-click=\"filterText()\">{{txt}}</p>\n\
  12      <script src=\"http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n\
  13      <script src=\"/js/angular_filter_custom.js\"></script>\n14    </body>\n\
  15 </html>\n```\n\n![图像](img/00246.jpeg)\n\n图 23.4 在 AngularJS 视图中创建和使用自定义过滤器。\n\
  \n## 总结\nAngularJS 模板实现简单，但强大且功能广泛。本章讨论了 AngularJS 模板的组件以及它们如何协作以扩展 HTML 的行为和功能。表达式是包含在\
  \ `{{}}` 括号内或 AngularJS 模板中指令定义中的 JavaScript 代码。表达式可以访问作用，因此你可以将值渲染到视图。过滤器充当表达式的修饰符，允许你为特定目的格式化结果。AngularJS\
  \ 提供了几种内置过滤器，例如用于货币和日期格式化的过滤器。你还可以创建自己的过滤器，在将数据渲染到页面之前应用任何所需的格式化或修改。你将过滤器作为提供者注入到注入器服务中，因此可以在控制器和模板内部访问它们。这意味着你可以在\
  \ JavaScript 代码中使用过滤器。下一节你将通过学习指令继续学习模板。指令为 AngularJS 模板提供了许多扩展功能，是构建 Web 应用程序的强大工具。\n\
  \n## 24. 在 AngularJS 中实现指令\nAngularJS 最强大的功能之一是指令。指令扩展了 HTML 的行为，允许你创建自定义 HTML 元素、属性和类，并具有特定应用程序的功能。事实上，AngularJS\
  \ 库的大部分是由内置指令构建的。这些指令提供了与表单元素交互、将作用域数据绑定到视图以及与浏览器事件交互的能力。本章讨论了内置指令以及如何在 AngularJS\
  \ 模板中实现它们，以及如何构建你自己的自定义指令。\n\n## 理解指令\n指令是 AngularJS 标记和辅助 JavaScript 代码的结合。AngularJS\
  \ 标记可以是 HTML 属性、元素名称或 CSS 类。JavaScript 代码定义了 HTML 元素的模板数据和行为。AngularJS 编译器会遍历模板并编译所有指令。然后，它通过将指令与作用域结合来链接指令，生成一个新的实时视图（live\
  \ view）。实时视图包含指令定义的 DOM 元素和功能。\n\n## 使用内置指令\n你需要在 HTML 元素中实现的大多数功能都由内置指令提供。这些指令由库提供，并在加载库时可用。这些指令提供了与表单元素交互、将作用域中的数据绑定到视图以及与浏览器事件交互的能力。本章讨论了内置指令以及如何在\
  \ AngularJS 模板中实现它们，以及如何构建你自己的自定义指令。\n\n## 理解指令\n指令是 AngularJS 标记和辅助 JavaScript\
  \ 代码的结合。AngularJS 标记可以是 HTML 属性、元素名称或 CSS 类。JavaScript 代码定义了 HTML 元素的模板数据和行为。AngularJS\
  \ 编译器会遍历模板并编译所有指令。然后，它通过将指令与作用域结合来链接指令，生成一个新的实时视图（live view）。实时视图包含指令定义的 DOM 元素和功能。\n\
  \n## 使用内置指令\n你需要在 HTML 元素中实现的大多数功能都由内置指令提供。这些指令由库提供，并在加载库时可用。这些指令提供了与表单元素交互、将作用域中的数据绑定到视图以及与浏览器事件交互的能力。本章讨论了内置指令以及如何在\
  \ AngularJS 模板中实现它们，以及如何构建你自己的自定义指令。\n\n## 使用内置指令\n这些指令为 AngularJS 提供了提供了样化的支持。以下章节描述了大多数\
  \ AngularJS 指令：\n- 图像 支持功能的\n- 图像 扩展元素的\n- 图像 将作用域绑定到元素的\n- 图像 将页面绑定到控制器的\n\n####\
  \ 支持功能的指令\n许多指令提供了 AngularJS 功能支持。这些指令完成了从启动应用程序到确保 AngularJS 表达式保留在 DOM 中的所有工作。表\
  \ 24.1 列出了这些指令并描述了它们的用法。\n\n![图像](img/0247.jpeg)图像图像\n\n表 24.1 支持功能的指令\n\n#### 扩展元素\n\
