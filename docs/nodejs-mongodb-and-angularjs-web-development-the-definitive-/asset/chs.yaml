  \ 29.7 显示了 `rich_ui_app.js` 的部分，该部分实现了支持 `richTabs` 和 `richPane` 指令模板所需的后端代码。\n\n\
  `richTabs` 指令定义了控制器函数，该函数包含用于填充标签页的 `panes` 数组。此外，`select()` 函数将数组中所有面板的 `select`\
  \ 值设置为 `false`，然后将当前面板设置为 `true`，从而隐藏除选定之外的所有面板。`addPane()` 函数由 `richPane` 指令调用，并将面板添加到\
  \ `richTabs` 的 `panes` 列表中。请注意 `templateUrl` 指向了上面定义的 `rich_tabs.html` 模板。\n\n`richPane`\
  \ 定义了一个指令，并指定 `rich_pane.html` 文件作为模板源。它在作用域中定义了 `title`，使其可以在标签页中显示。请注意，需要 `richTabs`\
  \ 以便通过 `tabsCtrl` 从此指令进行访问。那么在 `link` 函数中，可以调用 `addPane()` 将面板添加到 `panes` 数组中。\n\
  \n### Listing 29.7 `rich_ui_app.js-richPane/richTabs`：实现面板和标签指令的 AngularJS 指令代码\n\
  \n点击此处查看代码图像\n\n```javascript\n001 var app = angular.module('richApp', []);\n. .\
  \ .\n078 app.directive('richTabs', function() {\n079   return { restrict: 'E', transclude:\
  \ true,\n080     scope: {},\n081     controller: function($scope) {\n082       var\
  \ panes = $scope.panes = [];\n083       $scope.select = function(pane) {\n084  \
  \         angular.forEach(panes, function(pane) {\n085             pane.selected\
  \ = false;\n086         });\n087           pane.selected = true;\n088       };\n\
  089       this.addPane = function(pane) {\n090           if (panes.length == 0)\
  \ {\n091             $scope.select(pane);\n092           }\n093           panes.push(pane);\n\
  094       };\n095     },\n096     templateUrl: '/static/rich_tabs.html'\n097   });\n\
  098 app.directive('richPane', function() {\n100   return { require: '^richTabs',\
  \ restrict: 'E',\n101     templateUrl: '/static/rich_pane.html',\n102     transclude:\
  \ true, scope: { title: '@' },\n103     link: function(scope, element, attrs, tabsCtrl)\
  \ {\n104         tabsCtrl.addPane(scope);\n105     }\n106   });\n```\n\n#### 为标签页设置样式\n\
