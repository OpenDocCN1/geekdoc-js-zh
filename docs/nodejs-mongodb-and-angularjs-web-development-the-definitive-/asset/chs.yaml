  \ require('ejs').__express);\n08 app.set('views', __dirname + '/views');\n09 app.set('view\
  \ engine', 'html');\n10 app.use(bodyParser());\n11 require('./rich_ui_routes')(app);\n\
  12 app.listen(80);\n```\n\n### 实现支持视图的路由\n\n作为 Express 服务器配置的一部分，你加载了代码列表 29.2 所示的\
  \ `./rich_ui_routes.js` 文件。代码列表 29.3 提供了加载标签页视图、访问单词数据库、访问后端天气服务以及获取必要的静态文件的路由。\n\
  \n第 6–9 行实现了静态路由，用于支持获取示例中使用的 AngularJS、CSS、JavaScript、图像以及 AngularJS 部分模板。图像和 AngularJS\
  \ `lib` 文件夹位于项目的同级目录。其他静态文件位于项目内部的 `./static` 文件夹中。\n\n注意，当用户访问网站根位置（`/`）时，第 11\
