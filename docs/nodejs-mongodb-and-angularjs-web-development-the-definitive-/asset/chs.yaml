  \n### 创建应用程序服务器\n\n定义模型后，你就可以开始实现 Web 应用程序服务器。代码列表 29.2 实现了用于 Web 的 Express 服务器。这些代码对你来说应该很熟悉。它包含了\
  \ `express` 和 `mongoose` 库，并通过 Mongoose 连接到 MongoDB `words` 数据库。\n\n注意，有一条 `require('./models/word_model.js')`\
  \ 语句用于模型定义，以便在 Mongoose 中构建 `Schema` 对象。此外，`./rich_ui_routes` 文件在监听 80 端口之前初始化了服务器的路由。\n\
