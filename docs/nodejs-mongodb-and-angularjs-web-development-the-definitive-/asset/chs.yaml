  \n\n欢迎阅读 *Node.js, MongoDB, and AngularJS Web Development*。本书旨在帮助你快速进入 Web 开发项目中使用\
  \ JavaScript 的世界——从服务器、服务到浏览器客户端。本书涵盖了 Node.js、MongoDB 和 AngularJS 的实现与集成，这些是 Web\
  \ 开发领域涌现出的最令人兴奋且创新的技术之一。\n\n本引言涵盖了：\n\n![Image](img/00003.jpeg) 为什么你应该读这本书\n![Image](img/00003.jpeg)\
  \ 使用这本书你将实现什么\n![Image](img/00003.jpeg) 什么是 Node.js、MongoDB 和 AngularJS，以及为什么它们是出色的技术\n\
  ![Image](img/00003.jpeg) 在哪里找到代码示例\n\n让我们开始吧。\n### 谁应该读这本书\n\n本书面向已经具备 HTML 基础知识，并且在现代编程语言中进行过一些编程的读者。了解\
  \ JavaScript 知识会让这本书更容易读懂，但并非必须，因为书中已经涵盖了 JavaScript 的基础知识。\n### 为什么你应该读这本书\n\n\
  本书将教你如何创建强大、交互式的网站和 Web 应用——从服务器端的 Web 服务器和服务，到基于浏览器的交互式 Web 应用。这里涵盖的技术都是开源的，你可以使用\
  \ JavaScript 同时编写服务端和浏览器端组件。\n\n本书的典型读者希望掌握 Node.js 和 MongoDB，以便构建高扩展、高性能的网站。典型读者还希望利用\
  \ AngularJS 创新的 MVC 模式来实现设计良好且结构化的网页和 Web 应用。总体来说，Node.js、MongoDB 和 AngularJS 提供了一个易于实现、完全集成的\
  \ Web 开发栈，允许你实现惊叹的 Web 2.0 应用。\n### 你将从书中学到什么\n\n阅读本书将使你能够构建真实的动态网站和 Web  应用。网站不再由\
  \ HTML 页面中包含图像和格式化文本的简单静态内容组成。相反，网站已变得更加动态，单个页面通常作为整个网站或应用程序。\n使用 AngularJS 技术允许你在网页中构建逻辑，这些逻辑可以与\
  \ Node.js 服务器进行通信，并从 MongoDB 数据库中获取所需的数据。Node.js、MongoDB 和 AngularJS 的结合允许你实现交互式的动态网页。以下是你在阅读本书时将学习的部分内容：\n\
  \n![Image](img/00003.jpeg) 如何使用 Node.js 和 Express 实现高扩展性且动态的 Web 服务器\n![Image](img/00003.jpeg)\
  \ 如何使用 JavaScript 构建服务端 Web 服务\n![Image](img/00003.jpeg) 如何为你的 Web 应用实现 MongoDB\
  \ 数据存储\n![Image](img/00003.jpeg) 如何定义静态和动态 Web 路由，并实现支持它们的服务器端脚本\n![Image](img/00003.jpeg)\
  \ 如何定义自己的自定义 AngularJS 指令以扩展 HTML 语言\n![Image](img/00003.jpeg) 如何实现可以与 Node.js Web\
  \ 服务器交互的客户端服务\n![Image](img/00003.jpeg) 如何构建提供丰富交互的动态浏览器视图\n![Image](img/00003.jpeg)\
  \ 如何为你的网站/Web 应用添加身份验证用户账户\n![Image](img/00003.jpeg) 如何构建端到端的购物车\n\n### 什么是 Node.js?\n\
  Node.js 是一个基于 Google V8 JavaScript 引擎的开发框架。你用 JavaScript 编写 Node.js 代码，然后由 V8 编译成机器码进行执行。你可以在\
  \ Node.js 中编写大部分（甚至全部）服务端代码，包括 Web 服务器、服务端脚本以及任何支持 Web 应用的功能。Web 服务器和支持的 Web 应用脚本在同一个服务端应用程序中运行，这一事实使得\
  \ Web 服务器与脚本之间可以实现更紧密的集成。\n\n以下是 Node.js 是一个优秀框架的几个原因：\n![Image](img/00003.jpeg)\
  \ JavaScript 端到端：Node.js 的最大优势之一是允许你用 JavaScript 同时编写服务端和客户端的脚本。在决定将逻辑放在客户端脚本还是服务端脚本方面一直存在困难。通过\
  \ Node.js，你可以将在客户端编写的 JavaScript 轻松地将其适配到服务端，反之亦然。另一个优点是客户端开发者和服务器开发者可以使用同一种语言。\n\
  \n![Image](img/00003.jpeg) 事件驱动的可扩展性：Node.js 在处理 Web 请求时应用了独特的逻辑。它不是让多个线程等待处理 Web\
  \ 请求，而是使用基础事件模型在同一个线程上处理这些请求。这使 使得 Node.js Web 服务器能够以传统服务器无法实现的方式进行扩展。\n\n![Image](img/00003.jpeg)\
  \ 可扩展性：Node.js 拥有庞大的群体和活跃的开发社区。人们不断提供新模块来扩展 Node.js 功能。此外，在 Node.js 中安装和包含新模块非常简单；你可以在几分钟内扩展\
  \ Node.js 项目的新功能。\n![Image](img/00003.jpeg) 快速实现：设置 Node.js 并在其进行开发非常简单。只需几分钟，你就可以安装\
  \ Node.js 并拥有运行的 Web 服务器。\n\n### 什么是 MongoDB?\n\nMongoDB 是一种灵活且可扩展的 NoSQL 数据库。Mongo\
  \ 的名字源于“humongous（巨大的）”，强调了 MongoDB 提供的扩展性和性能。对于需要存储用户评论、博客或其他项目的高流量网站，MongoDB 提供了极佳的后端存储，因为它易于扩展且易于实现。\n\
  以下是 MongoDB 非常适合 Node.js 技术栈的某些原因：\n\n![Image](img/00003.jpeg) 文档导向：由于 MongoDB 是面向文档的，数据在数据库中的存储格式与你在服务端和客户端处理的格式非常接近。这消除了在行和对象之间转换数据的需要。\n\
  \n![Image](img/00003.jpeg) 高性能：MongoDB 是可用性能最高的数据库之一。特别是现在，随着越来越多的人与网站交互，拥有一个能够支持高流量的后端至关重要。\n\
  ![Image](img/00003.jpeg) 高可用性：MongoDB 的复制模型使得在保持高性能的同时维护扩展性变得非常容易。\n\n![Image](img/00003.jpeg)\
  \ 高可扩展性：MongoDB 的结构使其通过分片数据到多台服务器上来实现水平扩展变得简单。\n![Image](img/00003.jpeg) 防止 SQL\
  \ 注入：MongoDB 不受 SQL 注入（即通过 Web 表单或来自浏览器的其他输入放置 SQL 语句从而损害数据库安全）。这是因为对象是以对象形式存储的，而不是使用\
  \ SQL 字符串。\n\n### 什么是 AngularJS?\n\n\n\nAngularJS 是由 Google 开发的一个客户端框架。它使用 JavaScript\
  \ 编写，并包含了一个精简的 jQuery 库。AngularJS 背后的设计理论是提供一个框架，使用户使用 MVC 框架轻松地实现设计良好且结构化的网页和应用程序。\n\
  \n\n![Image](img/00003.jpeg) **数据绑定：** AngularJS 使用其强大的作用域（scope）机制，提供了一种非常简洁的方法将数据绑定到\
  \ HTML 元素上。\n\n\n![Image](img/00003.jpeg) **整洁：** AngularJS 强制要求你编写整洁、逻辑清晰的代码。\n\
  \n![Image](img/00003.jpeg) **可复用代码：** 可扩展性和整洁代码的使得在 AngularJS 中编写可复用代码非常容易。事实上，在创建自定义服务时，该语言经常强制你这样做。\n\
  \n\n![Image](img/00003.jpeg) **兼容性：** AngularJS 基于 JavaScript，并与 jQuery 有着紧密的关系。这使得你更容易将\
  \ AngularJS 集成到你的环境中，并在 AngularJS 框架结构内复用现有代码的片段。\n\n\n本书分为六大部分部分：\n\n![Image](img/00003.jpeg)\
  \ 第一部分，“介绍”，概述了 Node.js、MongoDB 和 AngularJS 之间交互的概述，以及这三个产品如何形成一个完整的 Web 开发技术栈。第\
  \ 2 章 是一本 JavaScript 入门教程，提供了你在实现 Node.js 和 AngularJS 代码所需的 JavaScript 语言基础。\n\n\
  \n![Image](img/00003.jpeg) 第三部分，“学习 MongoDB”，涵盖了 MongoDB 数据库，从安装到与 Node.js 应用集成。这部分讨论了如何规划数据模型以适应应用程序需求，以及如何从你的\
  \ Node.js 应用访问并与 MongoDB 交互。\n\n\n![Image](img/00003.jpeg) 第五部分，“学习 AngularJS”，涵盖了\
  \ AngularJS 框架架构以及将其集成到你的 Node.js 技术栈中。这部分涵盖了创建可以在浏览器中使用的自定义 HTML 指令（directives）和客户端服务。\n\
  \n![Image](img/00003.jpeg) 第六部分，“构建实用的 Web 应用组件”，讨论使用 Node.js、MongoDB 和 AngularJS\
  \ 构建的 Web 应用。\n\n\n在本书中，你将在列表中找到代码示例。要访问示例中的源代码，请访问：\n\nhttps://github.com/bwd/nodejs-angularjs\n\
  \n\n希望你喜欢学习 Node.js、MongoDB 和 AngularJS，这些技术对于构建 Web 应用非常棒。我希望你喜欢这本书！\n\n\n为了让你有一个良好的开始，本章重点介绍了\
  \ Web 开发框架的基础组件，并描述了 Node.js、MongoDB 和 AngularJS 技术栈的关系。\n\n### 理解 Web 开发框架\n\n\n\
  任何 Web 开发框架的主要组件都是用户、浏览器、Web 服务器和后端服务。虽然网站在外观和行为上存在巨大差异，但它们都包含这些基础组件。\n\n\n####\
  \ 用户\n\n用户是每个网站不可或缺的一部分；毕竟，他们是网站存在的原因。用户期望定义了开发良好的网站的要求。用户期望在过去几年中发生了很大变化。过去，用户接受“全球网等待”这种缓慢、复杂的体验，但现在不会了。他们期望网站运行得更快，像安装在计算机和移动设备上的应用程序一样。\n\
  \n\n#### 浏览器\n\n\n- 与 Web 服务器通信\n- 解析来自服务器的数据并将其渲染为用户看到的视图\n- 处理通过键盘、鼠标、触摸屏或其他输入设备的用户交互并采取相应行动\n\
  \n\n\n## 浏览器到 Web 服务器的通信\n浏览器到 Web 服务器的通信由一系列使用 HTTP 和 HTTPS 协议的请求组成。超文本传输协议（`HTTP`）用于定义浏览器与\
  \ Web 服务器之间的通信。`HTTP` 定义了可以发送哪些类型的请求，以及这些请求和 HTTP 响应的格式。\n\nHTTPS 增加了一个额外的安全层 `SSL/TLS`，通过要求\
  \ Web 服务器向浏览器提供证书来确保连接的安全。用户可以在允许连接之前决定是否接受该证书。\n\n浏览器向 Web 服务器发送的请求主要有三种类型：\n![Image](img/00003.jpeg)\
  \ **GET：** `GET` 请求通常用于从服务器检索数据，例如 `.html` 文件、图像或 `JSON` 数据。\n\n![Image](img/00003.jpeg)\
  \ **POST：** 当向服务器发送数据时，使用 `POST` 请求，例如向购物车中添加项目或提交 Web 表单。\n![Image](img/00003.jpeg)\
  \ **AJAX：** 异步 JavaScript 和 XML（`AJAX`）实际上只是运行在浏览器中的 JavaScript 直接执行的 `GET` 或 `POST`\
  \ 请求。尽管名称如此，`AJAX` 请求可以在响应中接收 `XML`、`JSON` 或原始数据。\n\n## 渲染浏览器视图\n\n用户实际查看并交互的屏幕通常由从\
  \ Web 服务器检索的几部分不同数据组成。浏览器从初始 URL 读取数据，然后渲染 `HTML` 文档以构建文档对象模型（`DOM`）。`DOM` 是一个树形结构对象，以\
  \ `HTML` 文档为根。树的结构基本上与 `HTML` 文档的结构相匹配。例如，`document` 将 `html` 作为子元素，`html` 将 `head`\
  \ 和 `body` 作为子元素，而 `body` 可能具有 `div`、`p`或其他元素作为子元素，如下：\n```\ndocument\n  + html\n\
  \    + body\n      + div\n          + p\n```\n\n\n浏览器通常从多个服务器请求获取各种类型的数据来构建网页。以下是浏览器用于渲染最终用户视图以及定义网页行为的最常见数据类型：\n\
  \n\n![Image](img/00003.jpeg) **CSS 文件：** 这些定义了页面上每个元素的样式方式，包括字体、颜色、边界和间距。\n\n![Image](img/00003.jpeg)\
  \ **客户端脚本：** 这些通常是 `JavaScript` 文件。它们可以为网页提供额外功能，操作 `DOM` 以更改网页的外观，并提供显示页面和提供功能所需的任何逻辑。\n\
  \n\n![Image](img/00003.jpeg) **数据：** 像 `XML`、`JSON` 或原始文本的数据可以由 Web 服务器作为 `AJAX`\
  \ 请求的响应提供。与其向服务器发送请求来重新构建网页，不如通过 `AJAX` 获取新数据并通过 `JavaScript` 将其插入网页中。\n\n\n## 用户交互\n\
  \n用户通过鼠标、键盘和触摸屏与浏览器交互。浏览器有一套复杂的事件系统，用于捕捉用户输入事件并采取相应的行动。行动从显示弹出菜单到从服务器加载新文档，再到执行客户端\
  \ `JavaScript` 不等。\n\n\nWeb 服务器的主要重点是处理来自浏览器的请求。如前所述，浏览器可能会请求文档、发布数据或执行 `AJAX` 请求以获取数据。Web\
  \ 服务器使用 `HTTP` 头以及 `URL` 来决定采取什么行动。根据 Web 服务器、配置和所用技术的不同，情况会变得非常不同。\n\n\n`服务器端脚本`\
  \ 实际上是 Web 服务器为了执行浏览器请求的任务可以执行任何内容。这些脚本可以用 `PHP`、`Python`、`C`、`C++`、`C#`、`Perl`、`Java`\
  \ 等编写……列表非常长。`Apache` 和 `IIS` 等 Web 服务器提供了包含服务器端脚本的机制，然后将其连接到浏览器请求的特定 `URL` 位置。这就是拥有健的\
  \ Web 服务器框架可以产生巨大差异的地方。通常需要大量的配置来启用各种脚本语言并连接服务器端脚本，以便 Web 服务器将适当的请求路由到适当的脚本。\n\n\
  服务器端脚本要么通过执行其代码直接生成响应，要么连接到其他服务。\n\n\n\n\n\n以下是 `Node.js` 成为优秀框架的几个原因之一：\n\n![Image](img/00003.jpeg)\
  \ **JavaScript 端到端化：** `Node.js` 的最大优势之一是它允许你使用 `JavaScript` 同时编写服务端和客户端脚本。在决定是将逻辑放在客户端脚本还是服务端脚本中，一直存在着困难。通过\
  \ `Node.js`，你可以将在客户端编写的 `JavaScript` 轻松地适配到服务器，反之亦然。另一个加分项是客户端开发者和服务器开发者说的是同一种语言。\n\
  \n\n![Image](img/00003.jpeg) **可扩展性：** `Node.js` 拥有庞大的粉丝群体非常活跃的开发社区。人们不断提供新模块来扩展\
  \ `Node.js` 的功能。此外，在 `Node.js` 中安装和包含新模块非常简单；你可以在几分钟内扩展 `Node.js` 项目以包含新功能。\n\n\n\
  ## MongoDB\n\n`MongoDB` 是一个敏捷且扩展性极强的 `NoSQL` 数据库。`Mongo` 这个名字来源于“hu**mongo**”一词，强调了\
  \ `MongoDB` 提供的扩展性和性能。它基于 `NoSQL` 文档存储模型，这意味着数据在数据库中基本上以 `JSON` 对象的形式存储，而不是关系型数据库传统的列和行。\n\
  \n\n`Node.js` 支持多种数据库访问驱动程序，因此数据存储可以轻松地是 `MySQL` 或其他数据库。然而，以下是 `MongoDB` 真正契合 `Node.js`\
  \ 栈的某些原因：\n\n\n![Image](img/00003.jpeg) **高性能：** `MongoDB` 是可用性能最高的数据库之一。特别是在今天，随着越来越多的人与网站互动，拥有一个能够支持高流量的后端是非常关重要的。\n\
  \n![Image](img/00003.jpeg) **高可用性：** `MongoDB` 的复制模型使其在保持高性能的同时非常易于维护扩展性。\n\n\n\
  ## Express\n\n\n例如，`Express` 提供了轻松为用户连接设置目标路由（URL）的能力。它在处理 `HTTP` 请求和响应对象方面也提供了强大的功能，包括\
  \ `cookies` 和 `HTTP headers` 等内容。\n\n以下是 `Express` 有价值功能的部分列表：\n\n\n![Image](img/00003.jpeg)\
  \ **错误处理：** `Express` 为“未找到文档”或其他错误提供了内置的错误处理。\n\n\n![Image](img/00003.jpeg) **Cookies：**\
  \ `Express` 提供了简单的 cookie 管理。\n\n![Image](img/00003.jpeg) **Session 和缓存管理：** `Express`\
  \ 还启用了会话管理和缓存管理。\n\n\n`AngularJS` 是由 `Google` 开发的客户端框架。它提供了处理浏览器输入、操作客户端数据以及在浏览器中显示元素的功能。它是使用\
  \ `JavaScript` 编写的，并带有 `jQuery` 库。`AngularJS` 的理念是提供一个方便实现 Web 应用程序的框架。\n\n\n![Image](img/00003.jpeg)\
  \ **数据绑定：** `AngularJS` 有一种非常简洁的方法通过作用机制将数据绑定到 HTML 元素。\n\n![Image](img/00003.jpeg)\
  \ **可扩展性：** `AngularJS` 架构允许你轻松扩展语言的各个方面以提供自定义实现。\n\n\n![Image](img/00003.jpeg)\
  \ **可复用代码：** 可扩展性和整洁的结合使得在 `AngularJS` 中编写可复用代码变得容易。事实上，在创建自定义服务时，语言经常强制你这样做。\n\n\
  \n![Image](img/00003.jpeg) **兼容性：** `AngularJS` 基于 `JavaScript` 并与 `jQuery` 有着紧密的关系。这使得更容易将\
  \ `AngularJS` 集成到你的环境中，并在 `AngularJS` 框架结构内复用你的现有代码。\n\n## 总结\n\n\n本章还描述了 `Node.js-to-AngularJS`\
  \ 栈，包含 `Node.js`、`MongoDB`、`Express` 和 `AngularJS`。`Node.js` 为框架提供平台，`MongoDB` 提供后端数据存储，`Express`\
  \ 提供 Web 服务器，而 `AngularJS` 为现代 Web 应用提供客户端框架。\n\n\n下一章将提供 `JavaScript` 语言的简要介绍。由于\
  \ `Node.js-to-AngularJS` 栈基于 `JavaScript`，你需要熟悉该语言才能跟上书中其余示例。\n\n\n\n\n你在本书中将使用的每个组件——Node.js、`MongoDB`、`Express`\
  \ 和 `AngularJS`——都是基于 JavaScript 语言的。因此，你会发现在 Web 开发栈的各个层实现和复用代码都是很容易的。\n\n\n###\
  \ 定义变量\n\n在 JavaScript 中，你使用变量来临时存储和访问来自 JavaScript 文件中的数据。变量可以指向简单的数据类型（如数字或字符串），也可以指向更复杂的数据类型（如对象）。\n\
  \n\n```javascript\nvar myData;\n```\n\n\n```javascript\nvar myString = \"Some Text\"\
  ;\n\n这一单行代码与以下两行代码相同：\n\n```javascript\nvar myString;\n```\n\n声明变量后，你可以使用它的名称为该变量赋值并访问该变量的值。例如，以下代码将字符串存储在\
  \ `myString` 变量中，然后在给 `newString` 变量赋值时使用它：\n\n点击查看代码图像\n```javascript\nvar myString\
  \ = \"Some Text\";\nvar newString = myString + \" Some More Text\";\n```\n\n\n###\
  \ 理解 JavaScript 数据类型\n\n\n![Image](img/00003.jpeg) **字符串（String）：** 这种数据类型将字符数据存储为字符串。字符数据由单引号或双引号指定。引号内的所有数据将赋值给字符串变量。例如：\n\
  \n点击查看代码图像\n\nvar myString = 'Some Text';\nvar anotherString = 'Some More Text';\n\
  ```\n\n![Image](img/00003.jpeg) **数字（Number）：** 这种数据类型将数据存储为数值。数字在计数、计算和比较中非常有用。示例包括：\n\
  ```javascript\nvar myInteger = 1;\nvar cost = 1.33;\n\n![Image](img/00003.jpeg)\
  \ **布尔值（Boolean）：** 这种数据类型存储一个真或假的单位。布尔值通常用于标记。例如，你可能会在某些代码开始时将变量设置为 `false`，然后在完成后检查它，以查看代码执行是否到达了某个位置。以下示例定义了\
  \ `true` 和 `false` 变量：\n\nvar yes = true;\nvar no = false;\n```\n![Image](img/00003.jpeg)\
  \ **数组（Array）：** 索引数组是一系列独立的不同数据项，它们都存储在单个变量名下。可以通过从 0 开始的索引访问数组中的项，使用方法 `array[index]`。以下是创建一个简单数组然后访问第一个元素（索引为\
  \ `0`）的示例：\n\n点击查看代码图像\n```javascript\nvar arr = [\"one\", \"two\", \"three\"];\n\
  var first = arr[0];\n\n![Image](img/00003.jpeg) **对象字面量（Object Literal）：** JavaScript\
  \ 支持创建和使用对象字面量能力。当你使用对象字面量时，可以使用 `object.property` 语法访问对象中的值和函数。以下示例显示了如何创建和访问对象字面量的属性：\n\
  \n点击查看代码图像\n\nvar obj = {\"name\":\"Brad\", \"occupation\":\"Hacker\", \"age\",\
  \ \"Unknown\"};\nvar name = obj.name;\n```\n![Image](img/00003.jpeg) **空（Null）：**\
  \ 有时你没有值可以存储在变量中，因为它还没有被创建，或者你不再使用它了。此时，你可以将变量设置为 `null`。使用 `null` 比赋值 `0` 或空字符串（`\"\
  \"`）更好，因为那些可能是变量的有效值。通过给变量分配 `null`，你可以不分配任何值并在代码内部对 `null` 进行检查，如下：\n\n```javascript\n\
  var newVar = null;\n```\n注意\n\n> JavaScript 是一种无类型语言。你不需要在脚本中指定变量是什么数据类型。解释器会自动确定正确的类型。你可以将不同类型赋值给变量。例如，以下代码定义了一个字符串并将其赋值为整数：\n\
  ```javascript\nvar id = \"test\";\nid = 1;\n```\n\n\nJavaScript 运算符允许你修改变量的值。你已经熟悉用于赋值的\
  \ `=` 运算符。JavaScript 提供了两类运算符：算术运算符和赋值运算符。\n\n\n你使用算术运算符在变量和直接值之间执行操作。表 2.1 显示了算术运算符列表以及对应的结果。\n\
  \n![Image](img/00006.jpeg)\n`y=4`\n注意\n\n> 你还可以使用 `+` 运算符相加字符串或数字。它允许你快速拼接字符串，也可以相加数值数据。表\
  \ 2.1 显示，当你将一个数值和一个字符串相加时，该数值会被转换为字符串，然后拼接这两个字符串。\n#### 赋值运算符\n\n你使用赋值运算符为变量赋值。除了\
  \ `=` 运算符外，还有几种不同的形式，允许你在赋值时处理数据。表 2.2 显示了赋值操作列表以及对应的结果。\n\n![Image](img/00007.jpeg)\n\
  \n### 应用比较和条件运算符\n\n\n### 比较运算符\n\n\n表 2.3 显示了比较运算符列表以及示例。\n\n![Image](img/00008.jpeg)\n\
  `x=10`\n你可以通过逻辑运算符和标准括号来组合多个比较。表 2.4 显示了逻辑运算符列表以及如何使用它们来组合比较。\n\n\n\n\n表 2.4 JavaScript\
  \ 比较运算符，结果基于初始值 `x=10` 和 `y=5`\n\n### 使用 if 语句\n`if` 语句允许你根据比较求值的结果来分离代码执行。以下几行代码展示了\
  \ `()` 中的条件运算符以及当条件求值为 `true` 时在 `{}` 中执行的代码：\n\n```javascript\n  do_something();\n\
  }\n```\n\n除了执行 `if` 语句块内的代码外，你还可以指定一个 `else` 块，该块仅在条件为 `false` 时才会执行。例如：\n```javascript\n\
  if(x==5){\n  do_something();\n  do_something_else();\n}\n```\n\n你还可以链联使用 `if` 语句。要做到这一点，可以像示例所示添加一个条件语句以及一个\
  \ `else` 语句：\n```javascript\nif(x<5){\n  do_something();\n  do_something_else();\n\
  } else {\n  do_nothing();\n}\n```\n### 实现 switch 语句\n\n另一种类型的条件逻辑是 `switch` 语句。`switch`\
  \ 语句允许你对表达式进行一次求值，然后根据值执行多个不同代码段之一。\n`switch` 语句的语法如下：\n\n点击此处查看代码图片\n\n```javascript\n\
  \  case value1:\n    <code to execute>\n    break;\n    <code to execute>\n    break;\n\
  \  default:\n    <code to execute if not value1 or value2>\n}\n\n其执行机制如下：`switch`\
  \ 语句完全评估表达式并获得一个值。该值可以是字符串、数字、`Boolean` 甚至是一个对象。然后，`switch` 表达式与 `case` 语句指定的每个值进行比较。如果值匹配，则执行\
  \ `case` 语句中的代码。如果没有匹配匹配的值，则执行默认代码。\n\n\n通常，每个 `case` 语句末尾都包含一个 `break` 命令，用以跳出\
  \ `switch` 语句。如果没有找到 `break`，代码执行将继续到下一个 `case` 语句。\n\n### 实现循环\n\n\nJavaScript\
  \ 提供了执行 `for` 和 `while` 循环的功能。以下章节介绍了如何在 JavaScript 中实现循环。\n\n#### while 循环\n\n\n\
  例如，以下 `while` 循环将一直执行到 `i` 等于 `5`：\n\n\n```javascript\nvar i = 1;\n\nwhile (i<5){\n\
  \  i++;\n}\n```\n该示例向控制台输出以下内容：\n\nIteration 1\nIteration 2\nIteration 3\n\n####\
  \ do/while 循环\n\n\n例如，以下 `do`/`while` 循环将一直执行到 `days` 等于 `Wednesday`：\n\n\n```javascript\n\
  var days = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\n\
  \nvar i=0;\ndo{\n  var day=days[i++];\n  console.log(\"It's \" + day);\n```\n\n\
  这是控制台的输出：\n\nIt's Monday\nIt's Wednesday\n\n#### for 循环\nJavaScript `for` 循环允许你通过一个在执行块中组合三个语句的\
  \ `for` 语句来执行特定次数的代码。语法如下：\n\n点击此处查看代码图片\n\n```javascript\n  code to be executed;\n\
  }\n```\n`for` 语句在执行循环时按如下方式使用这三个语句：\n\n- `assignment`：在循环开始前执行且且不再执行。它用于初始化将在循环中作为条件的变量。\n\
  - `condition`：该表达式在循环的每次迭代之前求值。如果表达式求值为 `true`，则执行循环；否则，`for` 循环结束。\n- `update`：在每次迭代中执行，在循环内代码执行后执行。这通常用于递增所使用的计数器。\n\
  以下示例说明了嵌套的 `for` 循环：\n\n```javascript\nfor (x=0; x<3; x++){\n  for (y=0; y<3; y++){\n\
  \  }\n}\n```\n输出为：\n0 0\n0 1\n0 2\n1 0\n1 2\n2 0\n2 1\n\n\n\n\n```javascript\nmyFunction();\n\
  ```\n\n\n你经常需要向函数传递特定的值，函数在执行其代码时会使用这些值。你以逗号分隔的形式向函数传递值。函数定义需要在 `()` 中列出变量名列表，其数量需要与传入的参数相匹配。例如，以下函数接受两个参数，`name`\
  \ 和 `city`，并使用它们来构建输出字符串：\n\n点击此处查看代码图像\n\nfunction greeting(name, city){\n  console.log(\"\
  Hello \" + name);\n  console.log(\". How is the weather in \" + city);\n}\n```\n\
  要调用 `greeting()` 函数，你需要传递一个 `name` 值和一个 `city` 值。该值可以是直接字面量，也可以是之前定义的变量。为了说明这一点，以下代码使用\
  \ `name` 变量和 `city` 的直接字符串执行了 `greeting()` 函数：\n\n```javascript\ngreeting(name,\
  \ \"Florence\");\n```\n\n\n通常，函数需要向调用它的代码返回一个值。添加 `return` 关键字后跟变量或值，即可从函数返回该值。例如，以下代码调用一个函数来格式化字符串，将函数返回的值赋值给变量，然后将该值写入控制台：\n\
  \n\n```javascript\nfunction formatGreeting(name, city){\n  var retStr = \"\";\n\
  \  retStr += \"Hello <b>\" + name + \"/n\");\n  return retStr;\n}\n\nconsole.log(greeting);\n\
  ```\n\n你可以在函数中包含多个一个 `return` 语句。当函数遇到 `return` 语句时，函数的代码执行将立即停止。如果 `return` 语句包含要返回的值，则会返回该值。以下示例显示了一个测试输入的函数，如果输入为零，则立即返回：\n\
  \n\n```javascript\nfunction myFunc(value){\n    return value;\n  <code_to_execute_if_value_nonzero>\n\
  \  return value;\n}\n```\n#### 使用匿名函数\n\n到目前为止，你看到的所有示例都显示了命名函数。JavaScript 还允许你创建匿名函数。这些函数的优势是可以在调用其他函数时直接在参数集中定义它们。因此，你不需要正式的定义。\n\
  例如，以下代码定义了一个接受三个参数的函数 `doCalc()`。前两个应该是数字，第三个是一个函数，该函数会被调用并将两个数字作为参数传递给它：\n\n点击此处查看代码图像\n\
  \n```javascript\n  return calcFunction(num1, num2);\n}\n```\n你可以定义一个函数，然后将不带参数的函数名传递给\
  \ `doCalc()`，如例所示：\n\n```javascript\nfunction addFunc(n1, n2){\n  return n1 + n2;\n\
  \ndoCalc(5, 10, addFunc);\n```\n然而，你也可以选择在调用 `doCalc()` 时直接使用匿名函数，如这两个语句所示：\n\n\
  点击此处查看代码图像\n\n```javascript\nconsole.log( do Calc(5, 10, function(n1, n2){ return\
  \ n1 * n2; }) );\n```\n\n\n### 理解变量作用域\n\n一旦你开始在 JavaScript 应用程序中添加条件、函数和循环，你就需要理解变量作用域。变量作用域用于确定当前正在执行的代码行中特定变量名的值。\n\
  \n\n为了更好地理解变量作用域，请考虑 列表 2.1 中的代码。\n\n\n点击此处查看代码图像\n\n***\n\n01 var myVar = 1;\n\
  02 function writeIt(){\n03   var myVar = 2;\n04   console.log(\"Variable = \" +\
  \ myVar);\n05   writeMore();\n07 function writeMore(){\n08   console.log(\"Variable\
  \ = \" + myVar);\n09 }\n```\n\n***\n\n在第 1 行定义的 `myVar` 是全局的。当调用 `writeIt()` 时，第\
  \ 3 行定义的局部 `myVar` 遮蔽了全局变量。第 4 行 `console.log` 访问的是局部 `myVar`。第 5 行调用 `writeMore()`\
  \ 时，第 8 行的 `console.log` 访问的是全局 `myVar`，它是第 1 行定义的全局版本。\n### 使用对象\n\nJavaScript\
  \ 有许多内置对象，例如 `Number`、`Array`、`String`、`Date` 和 `Math`。这些内置对象都有属性和方法。除了 JavaScript\
  \ 对象，你会发现 Node.js、MongoDB、Express 和 Angular 也提供了。为了有效地使用对象，你需要了解它们的结构。对象实际上只是一个组合多个值的容器，在某些情况下包含函数。对象的值被称为属性，函数的值被称为方法。\n\
  要使用 JavaScript 对象，你必须先创建对象的实例。通过使用 `new` 关键字配合对象构造函数可以创建实例。例如，创建一个 `Number` 对象可以使用以下行：\n\
  \n```javascript\nvar x = new Number(\"5\");\n```\n对象的语法非常直观：使用对象名，然后是一个点和属性或方法名。例如，以下代码获取并设置名为\
  \ `myObj` 的对象的 `name` 属性：\n\n```javascript\nmyObj.name = \"New Name\";\n```\n\n\
  你也可以同样地获取和设置对象方法。例如，以下代码调用 `getName()` 方法，然后更改名为 `myObj` 的对象的方法函数：\n\nvar name =\
  \ myObj.getName();\nmyObj.getName = function() { return this.name; };\n```\n你也可以直接使用\
  \ `{}` 语法创建对象并分配变量和函数。例如，以下代码定义了一个新对象并分配值和一个方法函数：\n\n```javascript\n  name: \"My\
  \ Object\",\n  value: 7,\n  getValue: function() { return this.name; }\n};\n```\n\
  你还可以使用对象`[`propertyName`]`语法访问 JavaScript 对象的成员。当你使用动态属性名或属性名包含 JavaScript 不支持的字符时，这种方法非常有用。例如，以下示例访问对象\
  \ `myObj` 的 `\"User Name\"` 和 `\"Other Name\"` 属性：\n\n```javascript\nvar val1 =\
  \ myObj[propName];\nvar val2 = myObj[\"Other Name\"];\n```\n\n#### 创建自定义定义对象\n\n\
  \n\n\n你可以通过几种不同的方式来定义 JavaScript 对象。最简单的方法是“即时”（on-the-fly）方法：只需创建一个通用对象，然后根据需要向其添加属性。例如，要创建一个用户对象并分配名字和姓氏，同时定义一个返回这些值的函数，可以使用以下代码：\n\
  \n点击此处查看代码图像\n\nvar user = new Object();\nuser.first=\"Brad\";\nuser.last=\"Dayley\"\
  ;\n```\n\n你也可以通过以下代码使用直接赋值来实现相同效果，在该代码中，对象被封装在 `{}` 中，并使用 `property`:value` 语法定义属性：\n\
  \n点击此处查看代码图像\n```javascript\nvar user = {\n  first: 'Brad',\n  getName: function(\
  \ ) { return this.first + \" \" + this.last; }};\n```\n\n前两种选项对于你不需要以后复用的简单对象非常有效。对于可复用的对象，更好的方法实际上是将对象封装在它自己的函数块中。这种方法的优点是允许你将与对象相关的所有代码保持在对象内部。例如：\n\
  \n\n```javascript\nfunction User(first, last){\n  this.last = last;\n  this.getName\
  \ = function( ) { return this.first + \" \" + this.last; };\n}\nvar user = new User(\"\
  Brad\", \"Dayley\");\n```\n这些方法的最终结果本质上与使用点符号表示引用属性的对象是相同的，如下所示：\n\n```javascript\n\
  console.log(user.getName());\n```\n### 使用原型对象模式\n\n一种更高级的对象创建方法是使用原型模式（prototyping\
  \ pattern）。你通过在对象的 `prototype` 属性内部定义函数，而不是在对象内部定义函数来实现这种模式。通过原型机制，原型中定义的函数仅在 JavaScript\
  \ 加载时创建一次，而不是在每次创建新对象时都创建。\n下面的示例展示了原型语法：\n\n点击此处查看代码图像\n\n```javascript\n  this.first\
  \ = first;\n  this.last = last;\n}\nUserP.prototype = {\n  getFullName: function(){\n\
  \    return this.first + \" \" + this.last;\n  }\n};\n\n注意，你定义了对象 `UserP`，然后设置 `UserP.prototype`\
  \ 包含 `getFullName()` 函数。你可以在原型中包含任意数量的函数。每当创建一个新对象时，这些函数都是都是可用的。\n\n\n`String` 对象是\
  \ JavaScript 中最常用的对象。每当你定义一个具有字符串数据类型的变量时，JavaScript 都会自动为你创建一个 `String` 对象。例如：\n\
  \n点击此处查看代码图像\n\nvar myStr = \"Teach Yourself jQuery & JavaScript in 24 Hours\";\n\
  ```\n\n\n![Image](img/00010.jpeg)\n\n\n要确定字符串的长度，你可以使用 `String` 对象的 `length` 属性，如例例所示：\n\
  \n点击此处查看代码图像\n\nvar numOfChars = myStr.length;\n```\n\n\n![Image](img/00011.jpeg)\n\
  \n表 2.6 **操作** `String` **对象的方法**\n\n\n#### 合并字符串\n\n\n点击此处查看代码图像\n\n```javascript\n\
  var word1 = \"Today \";\nvar word3 = \"tomorrows\\' \";\nvar word4 = \"yesterday.\"\
  ;\nvar sentence1 = word1 + word2 + word3 + word4;\n```\n\n#### 在字符串中搜索子字符串\n\n要确定一个字符串是否是另一个字符串的子字符串，可以使用\
  \ `indexOf()` 方法。例如，以下代码检查字符串是否包含 `think`：\n```javascript\nvar myStr = \"I think,\
  \ therefore am.\";\nif (myStr.indexOf(\"think\") != -1){\n}\n```\n\n#### 替换字符串中的单词\n\
  \n\n```javascript\nvar username = \"Brad\";\n```\n\n#### 将字符串拆分为数组\n\n字符串的一个非常常见的任务是使用分隔符将其拆分为数组。例如，以下代码将时间字符串拆分为其部分的数组：\n\
  ```javascript\nvar t = \"12:10:36\";\nvar tArr = t.split(\":\");\nvar minute = tArr[1];\n\
  var second = tArr[2];\n```\n\n### 使用数组\n`Array` 对象提供了存储和处理一组对象的方法。数组可以存储数字、字符串或其他对象。创建数组有几种不同的方法。例如，以下语句创建了三个相同版本：\n\
  \n```javascript\nvar arr = [\"one\", \"two\", \"three\"];\n\narr2[0] = \"one\";\n\
  arr2[1] = \"two\";\narr2[2] = \"three\";\nvar arr3 = new Array();\narr3.push(\"\
  one\");\narr3.push(\"two\");\narr3.push(\"three\");\n```\n第一种方法定义 `arr` 并在语句中设置内容，使用\
  \ `[]`。第二种方法创建 `arr2` 然后通过直接索引添加项。第三种方法创建 `arr3` 然后使用扩展数组的最佳选项：使用 `push()` 方法将项推入数组。\n\
  \n要确定数组中的元素数量，可以使用 `Array` 对象的 `length` 属性，如例所示：\n点击此处查看代码图像\n\n```javascript\n\
  ```\n\n数组遵循零基索引，这意味着第一个项位于索引 0，以此此类推。例如，在以下代码中，`first` 的值将是 `Monday`，`last` 的值将是\
  \ `Friday`：\n\n```javascript\nvar first = week[0];\nvar last = week[week.length-1];\n\
  ```\n\n\n\n## 合并数组\n\n\n点击此处查看代码图片\n\nvar arr1 = [1,2,3];\nvar arr3 = arr1 + arr2;\n\
  var arr4 = arr1.concat(arr2);\n```\n### 注意事项\n\n你可以合并数字数组和字符串数组。数组中的每个项将保留其自身的对象类型。然而，当你使用数组中的项时，你需要留意包含多一种数据类型的数组，以防遇到问题。\n\
  ### 遍历数组\n\n你可以使用 `for` 循环或 `for`/in` 循环来遍历数组。下面的代码演示了如何使用这两种方法遍历数组中的每个项：\n\n点击此处查看代码图片\n\
  ```javascript\nvar week = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\"\
  , \"Friday\"];\n\n  console.log(\"<li>\" + week[i] + \"</li>\");\n}\n\nfor (dayIndex\
  \ in week){\n  console.log(\"<li>\" + week[dayIndex] + \"</li>\");\n```\n\n### 将数组转换为字符串\n\
  `Array` 对象的一个非常实用的功能是使用 `join()` 方法将字符串的元素组合在一起，并通过特定的分隔符生成一个 `String` 对象。例如，下面的代码将时间组件重新组合为\
  \ `12:10:36` 格式：\n\n点击此处查看代码图片\n\n```javascript\nvar timeStr = timeArr.join(\":\"\
  );\n```\n\n\n你经常需要检查数组是否包含某个特定项。你可以通过 `indexOf()` 方法来实现。如果代码在列表中没有该项，它将返回 `-1`。如果项在\
  \ `week` 数组中，该函数将向控制台写入一条消息：\n\n点击此处查看代码图片\n\nfunction message(day){\n  var week\
  \ = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"];\n  if (week.indexOf(day)\
  \ != -1){\n    console.log(\"Happy \" + day);\n  }\n```\n\n### 向数组添加项和从数组移除项\n使用各种内置方法，有多种方法可以向\
  \ `Array` 对象添加和移除项。表 2.8 显示了本书中使用的一些不同方法。\n\n![Image](img/00013.jpeg)\n表 2.8 `Array`\
  \ 对象方法，用于从数组中添加和移除元素，数组方法按从表格开始到结束的顺序显示\n### 添加错误处理\n\nJavaScript 编码的一个重要部分是为可能出现问题的情况添加错误处理。默认情况下，如果由于\
  \ JavaScript 出现问题导致代码异常，脚本将失败且不会完成加载。这通常不是想要的行为。事实上，这往往是灾难性的行为。为了防止此类大问题，你应该将代码封装在\
  \ `try`/`catch` 块中。\n#### try/catch 块\n\n为了防止你的代码完全崩溃，请可以使用处理代码内部问题的 `try`/`catch`\
  \ 块。如果 JavaScript 在执行 `try` 块中的代码时遇到错误，它将跳转执行 `catch` 部分，而不是停止整个脚本。如果没有发生错误，则将执行整个\
  \ `try` 块，而不执行 `catch` 块的内容。\n例如，下面的 `try`/`catch` 块尝试将变量 `x` 赋值为名为 `badVarName`\
  \ 的未定义变量的值：\n\n点击此处查看代码图片\n\n```javascript\n  var x = badVarName;\n} catch (err){\n\
  \  console.log(err.name + ': '\" + err.message +  '\" occurred when assigning x.');\n\
  ```\n\n注意 `catch` 语句接受一个 `err` 参数，这是一个错误对象。错误对象提供了 `message` 属性，用于提供错误的描述。错误对象还提供了\
  \ `name` 属性，它是被抛出的错误类型的名称。\n\n上述代码导致了异常并产生以下消息：\n点击此处查看代码图片\n\nReferenceError: \"\
  badVarName is not defined\" occurred when assigning x.\n#### 抛出你自己的错误\n\n你也可以通过\
  \ `throw` 语句抛出自己的错误。下面的代码演示了如何向函数添加 `throw` 语句以抛出错误，即使没有发生脚本错误也是如此。`sqrRoot()` 函数接受一个参数。\n\
  \n```javascript\n  try {\n    if (x < 0) {\n      throw \"too small\";\n      throw\
  \ \"not a number\";\n    }\n    return Math.sqrt(x);\n    console.log(\"The error\
  \ was \" + err);\n}\n```\n\n\n这是一个在网页中使用 `finally` 的示例：\n\n点击此处查看代码图片\n\nfunction\
  \ testTryCatch(value) {\n  try {\n    if (value < 0) {\n    } else if (value > 10)\
  \ {\n      throw \"too big\";\n    }\n    // 你的代码\n  } catch (err) {\n  } finally\
  \ {\n    console.log(\"This is always written.\");\n  }\n```\n\n## 总结\n\n理解 JavaScript\
  \ 对于在 Node.js、MongoDB、Express 和 AngularJS 环境工作至关重要。本章讨论了足够理解书中内容的 JavaScript 语法。你学习了如何创建对象、如何使用函数以及如何处理字符串和数组。你还学习了如何对脚本应用错误处理，这在\
  \ Node.js 环境中至关重要。\n### 下节\n\n在下一章中，你将直接进入 Node.js。你将学习设置 Node.js 项目的基础知识，探索一些语言习惯用法，并查看一个简单的实际示例。\n\
  \n\n\nNode.js 由 Ryan Dahl 于 2009 年开发，旨在解决由并发问题带来的挫败感，特别是在处理 Web 服务时。谷歌刚刚为 Chrome\
  \ 浏览器发布了 `V8` JavaScript 引擎，该引擎针对网络流量进行了高度优化。Dahl 在 `V8` 之上创建了 `Node.js`，作为一个与浏览器客户端环境匹配的服务器端环境。\n\
  \n\nNode.js 拥有庞大的生态系统，新的扩展不断被编写中。`Node.js` 环境非常纯净，易于安装、配置和部署。只需一两个小时，你就能启动并运行一个\
  \ `Node.js` Web 服务器。\n\n\nNode.js 仍然非常年轻，但它迅速在各种公司中广受欢迎。这些公司使用 `Node.js` 首先是为了扩展性，但也是为了易于维护和更快的开发。以下是使用\
  \ `Node.js` 技术的少数公司：\n\n![Image](img/00003.jpeg) Yahoo!\n\n\n![Image](img/00003.jpeg)\
  \ eBay\n\n\n![Image](img/00003.jpeg) Dow Jones\n\n![Image](img/00003.jpeg) Microsoft\n\
  \n\nNode.js 可用于多种用途。因为它基于 `V8` 并且具有高度优化的代码来处理 HTTP 流量，最常见的用途是作为 Web 服务器。然而，`Node.js`\
  \ 也可以用于许多其他 Web 服务，例如：\n\n\n![Image](img/00003.jpeg) 实时多人游戏\n\n![Image](img/00003.jpeg)\
  \ 后端 Web 服务，如跨域、服务器端请求\n\n\n![Image](img/00003.jpeg) 多客户端通信，如 IM \n\n\n你可以通过从 `Node.js`\
  \ 网站 ([`nodejs.org`](http://nodejs.org)) 下载安装程序来轻松安装 `Node.js`。`Node.js` 安装程序会在你的\
  \ PC 上安装必要的文件，让你开始运行。开始创建 `Node.js` 应用程序不需要额外的配置。\n\n### 查看 Node.js 的安装位置\n\n\n\
  ![Image](img/00003.jpeg) `node`：此文件启动 `Node.js` JavaScript 引擎。如果你传递一个 JavaScript\
  \ 文件的路径，`Node.js` 会执行该脚本。如果没有指定目标 JavaScript 文件，脚本提示符允许你直接从控制台执行 JavaScript 代码。\n\
  \n\n![Image](img/00003.jpeg) `node_modules`: 该文件夹包含已安装的 `Node.js` 包。这些包充当扩展 `Node.js`\
  \ 功能的库。\n\n### 验证 Node.js 可执行文件\n\n\n```\nnode\n\n接下来，在 `Node.js` 提示符下，执行以下操作将 `\"\
  Hello World\"` 屏幕：\n\nconsole.log(\"Hello World\");\n\n当你看到控制台屏幕上显示 `\"Hello World\"\
  ` 后，在 Windows 上按 `Ctrl+C` 或在 Mac 上按 `Cmd+C` 退出控制台。\n\n\n```bash\nnpm version\n```\n\
  \n\n```json\n{ http_parser: '1.0',\nv8: '3.14.5.9',\nares: '1.9.0-DEV',\nuv: '0.10.18',\n\
  zlib: '1.2.3',\nmodules: '11',\nnpm: '1.3.11' }\n```\n\n\n如果你计划为你的 `Node.js` 项目使用\
  \ IDE，你现在也应该花一点时间配置一下它。大多数开发者对他们使用的 IDE 都很挑剔，可能有一种方法至少可以配置 JavaScript，即使不是直接配置 `Node.js`。例如，Eclipse\
  \ 有一些棒的 `Node.js` 插件，而 IntelliJ 的 WebStorm IDE 内置了一些针对 `Node.js` 的功能。\n\n你可以使用任何你喜欢的编辑器来生成你的\
  \ `Node.js` Web 应用程序。事实上，你只需要一个良好的文本编辑器。你将编写几乎所有的代码都是 `.js`、`.json`、`.html` 和 `.css`。所以选择你觉得最舒服的编辑器来这些文件。\n\
  \n\nNode.js 框架最强大的功能之一是用包对其进行扩展。`Node.js` 环境非常纯净，易于安装、配置和部署。只需一两个小时，你就能启动并运行一个 `Node.js`\
  \ Web 服务器。\n\n\nNode 模块是可以轻松共享、复用和安装的封装库。有很多适用于不同用途的模块。例如，`Mongoose` 为 `MongoDB`\
  \ 提供 ODM，`Express` 扩展了 Node 的能力，以此此类推。\n\n每个 Node 模块包含一个 `package.json` 文件，定义了信息元数据如名称、版本、作者，以及控制元数据如依赖和其他需求。\n\
  \n\n我喜欢 Node 模块的原因之一是有一个名为注册表的托管位置，可以在那里注册。注册表允许你将自己的包发布到其他人可以使用的地方，也可以下载他人创建的包。\n\
