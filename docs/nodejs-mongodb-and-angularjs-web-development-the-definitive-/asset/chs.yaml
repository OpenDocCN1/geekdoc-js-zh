  POST\" action=\"/user/update\">\n      <label>Username:</label>\n      <input type=\"\
  text\" name=\"username\" ng-model=\"user.username\" disabled><br>\n      <label>Email:</label>\n\
  \      <input type=\"email\" name=\"email\" ng-model=\"user.email\"><br>\n     \
  \ <label>Favorite Color:</label>\n      <input type=\"text\" name=\"color\" ng-model=\"\
  user.color\"><br>\n      <input type=\"submit\" value=\"Save\">\n    </form>\n \
  \ </div>\n  <form method=\"POST\" action=\"/user/delete\">\n    <input type=\"submit\"\
  \ value=\"Delete User\">\n  </form>\n  <hr><%= msg %>\n  <hr>{{error}}\n  <script\
  \ src=\"http://code.angular.org/1.2.9/angular.min.js\"></script>\n  <script src=\"\
