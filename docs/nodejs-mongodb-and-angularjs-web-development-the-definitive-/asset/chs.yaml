  \n### 实现购物车视图\n\n一旦用户点击“加入购物车”按钮，物品将被添加到购物车，视图将切换到购物车视图。代码列表 28.15 显示的购物车视图提供了购物车中当前存在的产品列表、总价以及结账或返回继续购物的按钮。\n\
  \n以下代码实现了购物车中的删除链接以移除物品。它调用了位于控制器中的 `deleteFromCart()` 函数，并传递了 `product._id` 以标识要删除的物品：\n\
  \n点击此处查看代码图像\n\n```\n<span class=\"delete\"\n      ng-click=\"deleteFromCart(product._id)\"\
  >Remove</span>>\n```\n\n此外，数量字段直接链接到 `item.quantity` 元素，该元素来自 `customer.shopping`\
  \ 购物车数组的 `ng-repeat` 指令。\n\n控制器函数计算运费值和总值；它通过以下表达式代码进行链接，其中 `|`currency` 过滤器格式化了价格、运费和总价的值：\n\
  \n点击此处查看代码图像\n\n```\n<span class=\"price\">{{cartTotal()|currency}}</span>\n```\n\
  \nAngularJS 酷的地方在于，因为 `quantity` 字段直接链接到作用域（scope），当你更改它们时，运费和总值也会随之变化。图 28.4 显示了渲染后的购物车视图。\n\
