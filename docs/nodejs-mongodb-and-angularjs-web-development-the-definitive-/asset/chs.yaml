  \ 初始化应用程序\n\n现在应用程序已经创建完成，你还需要在数据库中创建 `Page` 和 `Photo` 文档。你可以通过几种不同的方式来实现。例如，你可以直接将此功能添加到你的应用程序中，如果你以后可能需要它，这是一个很好的方法。或者，你也可以在\
  \ MongoDB shell 中直接使用 JavaScript 脚本，其中包含创建文档所需的适当命令。\n\n\n\n\n\n## 项目描述\n\n本章的实现是一个相当基础的购物车，它允许你添加商品、移除商品、结账流程并查看你的订单。该示例提供了购物车所需的大部分基本功能。但请记住，它并非为生产环境设计，而是作为一种教学工具。同时请注意，该购物车并没有实际链接到信用卡验证服务来处理支付。那超出了该项目的范围。你需要进行大量的额外工作，才能将此项目转换为一个可以在生产环境中使用的程序。\n\
  \n此外，此示例不包含登录、身份验证和会话管理；如果你想复习这些主题，请参阅第 26 章中的“为你的网站添加用户账户”。本章中的示例被硬编码为一个 `userid`\
  \ 为 `customerA` 的用户。因此，在示例中原本应该是已身份验证用户的地方，你会在示例中看到硬编码的 `customerA`。\n\n该示例的通用逻辑流如下：\n\
  \n1. 根页面包含一个可以购买的版画列表。\n2. 用户点击版画查看详情并将其加入购物车。用户可以添加多个商品。顶部的购物车链接显示购物车中的商品数量。\n\
  3. 用户点击购物车查看商品。用户随后更改商品数量、移除商品、继续购物或结账。\n4. 结账时，客户会看到配送信息页面。\n5. 客户随后会看到账单信息，包括账单地址和信用卡数据。\n\
  6. 当客户点击提交账单信息时，将显示经过验证的交易审查界面，用户可以选择进行最终购买。\n7. 在用户完成最终购买后，他或她将看到订单列表，包括最近完成的订单。\n\
  \n## 使用的库\n\n本章的项目使用了以下额外的 Node.js NPM 模块。你需要将它们安装到项目目录中，以便跟随代码示例：\n\n![Image](img/00003.jpeg)\
