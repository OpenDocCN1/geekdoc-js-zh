  \ 来实现表格行。单词数据的具体值通过 AngularJS 表达式渲染到页面上。\n\n`limit` 字段设置返回的行数，`contains` 字段设置包含特定文本的单词过滤器，`sort\
  \ by` 则允许你选择排序的字段和方向。[Figure 29.4 显示了渲染模板的几种不同视图。\n\nListing 29.18 `tables.html`：为表格视图实现\
