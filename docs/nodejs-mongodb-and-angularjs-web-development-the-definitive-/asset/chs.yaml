  \ 为天气 AngularJS HTML 部分提供 CSS 样式。\n\n### 定义项目模型\n\n在本示例中，你只需要实现单词数据库的 schema，以存储表格示例中的单词。代码列表\
  \ 29.1 显示了 `WordSchema` 模型。你应该已经通过第 13 章到第 16 章 熟悉了这个 schema。\n\n代码列表 29.1 `word_model.js`:\
  \ 为单词数据库定义 schema\n\n点击此处查看代码图片\n\n```javascript\n01 var mongoose = require('mongoose');\n\
  02 var Schema = mongoose.Schema;\n03 var WordSchema = new Schema({\n04    word:\
