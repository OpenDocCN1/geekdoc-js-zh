  当你开始实现应用程序时，应该执行的事情之一是为存储在数据库中的对象定义模型。在这种情况下，你需要一个 `User` 对象。先定义模型可以帮助你更好地如何实现路由和控制器。\n\
  \n[Listing 26.1] 为本章的应用程序实现了 `User` 模型。它非常简单，但提供了一个你可以做什么的良好示例。你可以根据需要轻松地增强此示例。\n\
  \n注意，定义的模式（schema）实现了唯一的 `username` 以及 `email`、`color` 和 `hashed_password` 字段。最后一行在\
  \ Mongoose 中创建了该模型。\n\nListing 26.1 `users_model.js`: 为 Mongoose 实现 `User` 模型\n\n\
  [点击此处查看代码图片]\n\n***\n\n```\n01 var mongoose = require('mongoose'),\n02      Schema\
  \ = mongoose.Schema;\n03 var UserSchema = new Schema({\n04      username: { type:\
  \ String, unique: true },\n05      email: String,\n06      color: String,\n07  \
