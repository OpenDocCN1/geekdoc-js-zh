  #### 使用立即定时器执行立即工作\n\n立即定时器用于在 I/O 事件回调执行之后超时或间隔事件执行之前执行工作。它们允许你在事件队列中的当前事件完成后调度工作。你应该使用立即定时器将长时间运行的执行段让给其他回调，以防止阻塞\
  \ I/O 事件。\n你通过使用 Node.js 内置的 `setImmediate(callback,[args])` 方法创建立即定时器。当你调用 `setImmediate()`\
  \ 时，回调函数被放入事件队列，并在 I/O 事件有机会调用的每次遍历事件循环迭代中被弹出一次。例如，以下代码在下一次遍历事件循环中调度 `myFunc()`\
  \ 执行：\n点击查看代码图像\n\n```javascript\n```\n\n`setImmediate()` 函数返回一个定时器对象 ID，你可以在它从事件队列中取出之前的任何时候将此\
  \ ID 传递给 `clearImmediate(immediateId)`。例如：\n点击查看代码图像\n```javascript\nmyImmediate\
  \ = setImmediate(myFunc);\n...\n```\n\n##### 从事件循环中解除定时器的引用\n\n\n通常情况下，你可能希望在定时器事件回调函数成为事件队列中仅剩事件时，它们仍然继续被调度。Node.js\
  \ 提供了一个非常实用的工具来处理这种情况。在 `setInterval` 和 `setTimeout` 返回的对象中，可以使用 `unref()` 函数，它允许你通知事件循环在当这些事件是队列中唯一事件时不要继续运行。\n\
  \n\n点击此处查看代码图片\n\nmyInterval = setInterval(myFunc);\nmyInterval.unref();\n```\n\n\
  \nmyInterval.ref();\n```\n\n\n### 警告\n\n\n* *\n\n\n\n列表 4.3 中的代码说明了使用阻塞 I/O 调用、定时器和\
