  \n由于有多个控制器与服务器交互以获取和添加评论，因此创建一个处理获取和添加评论的服务也是一个好主意。以下章节描述了在列表 27.18 中创建完整 Angular\
  \ 代码的过程。\n\n#### 创建评论服务\n\n\n\n\n\n因为你知道需要一个评论服务来处理获取和添加评论，所以你需要先添加该服务。代码列表 27.15\
  \ 实现了一个使用服务方法的评论服务。你需要定义一个名为 `CommentObj` 的函数。构造函数接受 `$http` 服务作为唯一参数。\n\n你定义了一个\
  \ `getComment()` 函数，它接受 `commentId`，然后对 `/comment/get` 路由执行 `GET` 请求以获取完整的评论数据。注意，此函数还接受一个回调函数。如果\
  \ `$http` 报告错误或从服务器获取获取评论数据，回调函数将返回错误。\n\n`addComment()` 函数接收用于评论线程的 `rootCommentId`、用于父评论的\
  \ `parentId`，以及一个 `newComment` 参数（该参数是一个具有 `subject` 和 `body` 属性的 JavaScript 对象）。然后它向\
  \ `/comment/add` 发送 `POST` 请求以将新评论添加到 MongoDB 中。与 `getComment()` 一样，会执行一个回调函数并返回结果。然后，使用以下行注入\
  \ `$http` 来创建该服务：\n\n点击此处查看代码图片\n\n```javascript\napp.service('commentSrv', ['$http',\
  \ CommentObj]);\n```\n\n然后你就可以将 `commentSrv` 服务注入到你的控制器中。\n\nListing 27.15 `comment_app.js-commentSrv`：实现一个\
  \ AngularJS 服务，提供可重用的功能来从服务器获取评论并添加新评论。\n\n点击此处查看代码图片\n\n```javascript\n02 function\
  \ CommentObj($http) {\n03    this.getComment = function(commentId, callback){\n\
  04      $http.get('/comments/get', {params: {commentId: commentId}})\n05       \
  \ .success(function(data, status, headers, config) {\n06          callback(null,\
  \ data);\n07        })\n08        .error(function(data, status, headers, config)\
  \ {\n09          callback(data, {});\n10        });\n11    };\n12   this.addComment\
  \ = function(rootCommentId, parentId,\n13                                     newComment,\
  \ callback){\n14     $http.post('/comments/add', { rootCommentId: rootCommentId,\n\
  15                                     parentCommentId: parentId,\n16          \
  \                           newComment: newComment })\n17      .success(function(data,\
  \ status, headers, config) {\n18        callback(null, data);\n19      })\n20  \
  \    .error(function(data, status, headers, config) {\n21      });\n22    };\n23\
  \ }\n24 app.service('commentSrv', ['$http', CommentObj]);\n```\n\n#### 实现照片控制器\n\
  \n接下来，你需要实现一个控制器来支持页面的照片部分。代码列表 27.16 显示了 `photoController` 代码。注意 `commentSrv` 被注入到控制器中，还有\
  \ `$http` 服务。\n\n控制器初始化 `$scope.photos` 和 `$scope.photo`，使用对 `/photos` 路由的 `$http\
  \ GET` 请求。`$scope.loadComments()` 函数通过传递 `$scope.photo.commentId`，使用 `commentSrv.getComment()`\
  \ 函数检索当前照片的评论。回调函数简单地设置了视图中使用的 `$commentThread` 值。\n\n当用户在模板中点击回复评论的发送时，会调用 `$scope.addReply()`\
  \ 方法。注意，它首先根据从视图传入的 `subject` 和 `body` 生成 `newComment` 对象，然后使用 `commentSrv.addComment()`\
  \ 将更新发送到服务器。\n\n`$setPhoto()` 函数接受来自用户的 `photoID` 并向 `/photo` 发送 `$http GET` 请求以检索照片对象。使用数据更新\
  \ `$scope.photo`并调用 `$scope.loadComments()` 来加载评论。\n\nListing 27.16 `comment_app.js-photoController`：实现一个\
  \ AngularJS 控制器，支持视图中的照片和评论部分。\n\n点击此处查看代码图片\n\n```javascript\n25 app.controller('photoController',\
