  \ 的输出，显示了如何使用异步回调链遍历列表。\n## 总结\n\nNode.js 使用的事件驱动模型提供了可扩展性和性能。在本章中，你学习了事件驱动模型与传统线程服务器模型之间的区别。你还学习了当调用阻塞\
  \ I/O 时可以将事件添加到事件队列，并且可以使用事件、定时器或 `nextTick()` 方法来调度事件。\n你已经看到了三种定时器事件：超时（timeout）、间隔（interval）和立即（immediate）。你可以使用这些事件中的每一种来延迟工作的执行。你还学习了如何实现自定义的事件发射器并向它们添加监听器函数。\n\
  \n\n\n### 下一节预告\n\n在下一章中，你将有机会学习如何通过使用流（streams）和缓冲区（buffers）来管理数据 I/O。此外，你将学习 Node.js\
  \ 中允许你操作 JSON、字符串和压缩格式数据的功能。\n## 5. 在 Node.js 中处理数据 I/O\n大多数活跃的 Web 应用程序和服务都有大量数据流过——形式包括文本、JSON\
  \ 字符串、二进制缓冲区和数据流。因此，Node.js 内置了许多机制来支持从系统到系统的数据 I/O 处理。理解 Node.js 提供的用于实现高效、良好的\
  \ Web 应用和服务的机制至关重要。\n本章的重点是操纵 JSON 数据、管理二进制数据缓冲区，以及实现可读/可写流和数据压缩/解压缩。你将学到如何利用 Node.js\
  \ 的功能来处理不同的 I/O 。\n### 使用 JSON\n\n在实现 Node.js Web 应用和服务时，你最常处理的数据类型之一是 JSON（JavaScript\
  \ 对象表示法）。JSON 是一种非常轻量的方法，可以将 JavaScript 对象转换为字符串形式，然后再转换回来。当你需要将数据对象从客户端到服务器、进程到进程或流到流之间进行序列化，或者将它们存储在数据库中时，它可以非常好工作。\n\
  使用 JSON 序列化你的 JavaScript 对象而不是使用 XML 有几个原因：\n\n![Image](img/00003.jpeg) JSON 效率高得多且占用的字符更少。\n\
  \n![Image](img/00003.jpeg) JSON 的序列化/反序列化比 XML 的序列化/反序列化更快。\n![Image](img/00003.jpeg)\
  \ 从开发者的角度来看，JSON 更容易阅读，因为它的语法与 JavaScript 相似。\n\n对于极其复杂的对象或者如果你已经有了 XML/XSLT 转换，你可能想使用\
  \ XML 而不是 JSON。\n#### 将 JSON 转换为 JavaScript 对象\n\nJSON 字符串表示字符串形式的 JavaScript 对象。该字符串语法与代码非常相似，因此很容易理解。你可以使用\
  \ `JSON.parse(string)` 方法将格式正确的 JSON 字符串转换为 JavaScript 对象。\n例如，在下面的代码段中，注意 `accountStr`\
  \ 被定义为格式化的 JSON 字符串，然后使用 `JSON.parse()` 将其转换为 JavaScript 对象，之后可以通过点符号访问其成员属性：\n\
  点击此处查看代码图片\n\n```javascript\nvar accountObj = JSON.parse(accountStr);\n\nconsole.log(accountObj.name);\n\
