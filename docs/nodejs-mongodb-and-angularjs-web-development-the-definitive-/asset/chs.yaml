  \n为了实现表格视图，你需要一个单词数据库。[Listing 29.20 提供了一个基础的 Node.js ，实现了本章中使用的单词。在测试之前几节中定义的表格视图之前，你需要运行它。你需要修改第\
  \ 3 行的 `words` 变量，以包含你想放入数据库的单词。书籍网站上的示例包含大约 5,000 个单词。\n\nListing 29.20 `word_init.js`：为表格视图初始化单词数据库\n\
  \n```javascript\nvar vowelArr = \"aeiou\";\nvar consantArr = \"bcdfjklmnqrstvwxyz\"\
  ;\nvar words = \"the,and,of,a...class,ology,till\";\nvar wordArr = words.split(\"\
  ,\");\nvar wordObj = new Array();\nfor (var i=0; i<wordArr.length; i++){\n  try{\n\
  \    var word = wordArr[i].toLowerCase();\n    var vowelCnt = (word.split(/[aeiou]/i)).length-1;\n\
  \    var consonantCnt = (word.split(/[bcdfjklmnqrstvwxyz]/i)).length-1;\n    var\
  \ letters = [];\n    var vowels = [];\n    var consonants = [];\n    var other =\
  \ [];\n    for (var j=0; j<word.length; j++){\n      var ch = word[j];\n      if\
  \ (letters.indexOf(ch) === -1){\n        letters.push(ch);\n      }\n      if (vowelArr.indexOf(ch)\
  \ !== -1){\n        if(vowels.indexOf(ch) === -1){\n          vowels.push(ch);\n\
  \        }\n      } else if (consantArr.indexOf(ch) !== -1){\n        if(consonants.indexOf(ch)\
  \ === -1){\n          consonants.push(ch);\n        }\n      }else{\n        if(other.indexOf(ch)\
  \ === -1){\n          other.push(ch);\n        }\n      }\n    }\n  }\n  var charsets\
  \ = [];\n  if(consonants.length){\n    charsets.push({type:\"consonants\", chars:consonants});\n\
  \  }\n  if(vowels.length){\n    charsets.push({type:\"vowels\", chars:vowels});\n\
  \  }\n  if(other.length){\n    charsets.push({type:\"other\", chars:other});\n \
  \ }\n  var wordObj = {\n    word: word,\n    first: word[0],\n    last: word[word.length-1],\n\
  \    size: word.length,\n    letters: letters,\n    stats: { vowels: vowelCnt, consonants:\
  \ consonantCnt },\n    charsets: charsets\n  };\n  if(other.length){\n    wordObj.otherChars\
  \ = other;\n  }\n  wordObjArr.push(wordObj);\n  } catch (e){\n    console.log(e);\n\
  \    console.log(word);\n  }\n}\nvar MongoClient = require('mongodb').MongoClient;\n\
  MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n  var myDB =\
  \ db.db(\"words\");\n  myDB.dropCollection(\"words\");\n  myDB.createCollection(\"\
  words\", function(err, wordCollection){\n    wordCollection.insert(wordObjArr, function(err,\
  \ result){\n      console.log(result);\n      db.close();\n    });\n  });\n});\n\
  ```\n\n### Summary\n\n\n\n\n\n在本章中，你查看了在 Web 中实现交互式 Web 2.0 组件的一些方法。标签页视图（tabbed\
  \ view）示例展示了一种允许用户在无需离开当前页面的情况下切换不相关视图的方法。天气示例向你展示了如何实现后端服务，以支持来自外部数据源的视图。\n\n可拖拽视图（draggable\
  \ view）说明了你可以通过扩展浏览器非原生行为来增强 Web 组件，提供更丰富的应用体验。表格视图（tables view）提供了一个允许用户通过设置用于查询\
  \ `MongoDB` 数据库的参数来动态修改视图中数据的示例。\n\n正如你在过去几个章节的练习中所看到的，`Node.js`、`MongoDB`、`Express`\
  \ 和 `AngularJS` 提供了一个从服务器到客户端极其强大且易于使用的 Web 应用技术栈。\n\n你开启了旅程，学习了 `Node.js` 如何用于所有服务器端工作，包括服务器端脚本、与外部服务和数据库的通信，以及\
  \ Web 服务器本身。然后，你有机会学习如何将 `MongoDB` 作为应用程序的数据存储器，并使用 `Mongoose` 库直接从 `Node.js` 访问它。接下来，你学习了如何利用\
  \ `Express` 的强大功能快速构建稳健的 Web 服务器功能。\n\n在学习了服务器端内容后，你转向使用 `AngularJS` 作为客户端应用程序的框架。你学习了\
  \ `AngularJS` 如何允许你创建和构建符合应用程序确切需求的自定义 HTML 元素，以及如何实现服务来实现应用程序之间的通信。\n\n你应该注意到的最佳方面之一是整个技术栈都使用\
  \ JavaScript 语言。这意味着你可以在客户端、服务器和数据库中使用相同的 JavaScript 对象，而无需在 `JSON` 格式之间进行转换。这意味着你可以以极少的更改轻松在服务器和客户端之间迁移\
  \ JavaScript 代码。\n\n`Node.js`、`AngularJS` 和 `MongoDB` 是目前最令人兴奋的技术。它们简单易用，可以相互集成，并允许你构建企业级的网站和应用程序。希望你像我一样喜欢这些技术。\n\
