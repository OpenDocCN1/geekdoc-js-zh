  \ `index` 视图允许你注销并编辑用户。\n\n#### 实现 login 视图\n\n对于 `login` 视图，列表 26.12 实现了一个简单的登录表单，允许你指定用户名和密码以创建身份验证会话。表单包含了文本和密码\
