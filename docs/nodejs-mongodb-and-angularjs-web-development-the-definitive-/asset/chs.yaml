  \ += '<h1>Weather Info</h1><p>' + weatherData +'</p>';\n13   }\n14   page += '</body></html>';\n\
  15   res.end(page);\n16 }\n17 function parseWeather(weatherResponse, res) {\n18\
  \   var weatherData = '';\n19   weatherResponse.on('data', function (chunk) {\n\
  20     weatherData += chunk;\n21   });\n22   weatherResponse.on('end', function\
  \ () {\n23     sendResponse(weatherData, res);\n24   });\n25 }\n26 function getWeather(city,\
  \ res){\n27   var options = {\n28     host: 'api.openweathermap.org',\n29     path:\
  \ '/data?q=' + city\n30   };\n31   http.request(options, function(weatherResponse){\n\
  32     parseWeather(weatherResponse, res);\n33   }).end();\n34 }\n35 http.createServer(function\
  \ (req, res) {\n36   console.log(req.method);\n37   if (req.method == \"POST\"){\n\
  38     var reqData = '';\n39     req.on('data', function (chunk) {\n40       reqData\
  \ += chunk;\n41     });\n42     req.on('end', function () {\n43       var postParams\
  \ = qstring.parse(reqData);\n44       getWeather(postParams.city, res);\n45    \
  \ });\n46   } else{\n47     sendResponse(null, res);\n48   }\n49 }).listen(8080);\n\
  ```\n\n* * *\n\n![Image](img/00073.jpeg)\n\n图 7.5 实现 HTTP POST 服务器。\n\n### 实现服务器与客户端\n\
  \n安全文本传输协议（HTTPS）是一种在客户端和服务器之间提供安全通信的协议。HTTPS 实际上运行在传输层安全/套接层（TLS/SSL）协议之上的 HTTP，这是它获取安全能力的地方。HTTPS\
  \ 通过两种主要方式提供安全：首先，它使用长期公私密钥来交换短期会话密钥，以便在客户端和服务器之间进行加密。它还提供身份验证，以确保连接的 Web 服务器是你预期的，从而防止请求重定向到第三方的中间人攻击。\n\
  \n以下章节将讨论如何在 Node.js 环境中实现 HTTPS 服务器和客户端。在使用 HTTPS 之前，你需要生成私密钥和公共证书。实现这一点有多种方法，取决于你的平台。最简单的方法之一是使用你平台的\
  \ OpenSSL 库。\n\n要生成私密钥，首先执行以下 OpenSSL 命令：\n\n```\nopenssl genrsa -out server.pem\
  \ 2048\n```\n\n接下来，使用以下命令创建证书请求文件：\n\n```\nopenssl req -new -key server.pem -out\
  \ server.csr\n```\n\n\n\n\n创建一个 HTTPS 客户端几乎与本章之前讨论的创建 HTTP 客户端完全相同。唯一的区别是有一些额外的选项，如表\
  \ 7.9\n\n表 7.9 `https.request()` 和 `https.createServer()` 的额外选项\n\n`key` 选项指定用于\
  \ SSL 的私钥。`cert` 值指定要使用的 x509 公钥。全局 agent 不支持 HTTPS 所需的选项，因此你需要通过将 `agent` 设置为 `null`\
  \ 来禁用 agent，如下所示：\n\n点击此处查看代码图片\n\n```javascript\nvar options = {\n  key: fs.readFileSync('test/keys/client.pem'),\n\
  \  cert: fs.readFileSync('test/keys/client.crt'),\n  agent: false\n};\n```\n\n你也可以创建自定义的\
  \ `Agent` 对象，如下所示：\n\n点击此处查看代码图片\n\n```javascript\noptions.agent = new https.Agent(options);\n\
  ```\n\n一旦你通过 `cert`、`key` 和 `agent` 设置定义了选项，你就可以调用 `https.request(options, [responseCallback])`，它的工作方式与\
  \ `http.request()` 调用完全相同。唯一的区别是客户端和服务器之间的数据经过了加密：\n\n点击此处查看代码图片\n\n```javascript\n\
  var options = {\n  hostname: 'encrypted.mysite.com',\n  port: 443,\n  path: '/',\n\
  \  method: 'GET',\n  key: fs.readFileSync('test/keys/client.pem'),\n  cert: fs.readFileSync('test/keys/client.crt),\n\
  \  agent: false\n};\n\nvar req = https.request(options, function(res) {\n  <处理响应的方式与\
  \ http.request 相同>\n});\n```\n\n### 创建 HTTPS 服务器\n\n创建一个 HTTPS 服务器几乎与本章之前讨论的创建 HTTP\
  \ 服务器完全相同。唯一的区别是你必须传递给 `https.createServer()` 的额外选项。在表 7.9\n\n```javascript\nvar\
  \ options = {\n  key: fs.readFileSync('test/keys/server.pem'),\n  cert: fs.readFileSync('test/keys/server.crt')\n\
  };\n\nhttps.createServer(options, function (req, res) {\n  res.writeHead(200);\n\
  \  res.end(\"Hello Secure World\\n\");\n}).listen(8080);\n```\n\n一旦创建了 HTTPS 服务器，请求/响应的处理方式与本章之前描述的\
  \ HTTP 服务器相同。\n\n## 总结\n\nNode.js 的一个重要方面是能够非常快速地实现 HTTP 和 HTTPS 服务器及服务。`http` 和\
  \ `https` 模块提供了实现 Web 服务器基础所需的所有内容。对于完整的 Web 服务器，你仍然会想要使用更扩展的库，例如 `express`。然而，`http`\
  \ 和 `https` 模块对于某些基础 Web 服务非常好，且实现非常简单。\n\n本章中的示例涵盖了足够的 HTTP 基础知识，让你能够实现自己的服务有一个良好的开始。你还机会看到如何使用\
  \ `url` 和 `querystring` 模块将 URL 和查询字符串解析为对象并反向转换。\n\n### 下节内容\n\n在下一章中，你将有机会进一步深入学习\
  \ `net` 模块。你将学习如何使用 TCP 客户端和服务器来实现你自己的 socket 服务。\n\n## 8. 在 Node.js 中实现 Socket\
  \ 服务\n\n后端服务的一个重要部分是通过 socket 进行通信的能力。socket 允许一个进程通过 IP 地址和端口与另一个进程进行通信。当你为运行在同一服务器上的两个不同进程实现进程间通信\
  \ (IPC)，或者访问运行在完全不同的服务器上的服务时，这非常有用。Node.js 提供了 `net` 模块，允许你创建 socket 服务器以及可以连接到该\
  \ socket 服务器的客户端。对于安全连接，Node.js 提供了 `tls` 模块，允许你实现安全的 TLS socket 服务器和客户端。\n\n###\
  \ 理解网络 Socket\n\n网络 socket 是跨越计算机网络流动的通信的端点。socket 位于 HTTP 层之下，并提供了服务器之间的点对点通信。几乎所有的互联网通信都是基于在互联网上两个点之间流传输数据的\
  \ Internet socket 的。\n\nsocket 的工作是使用 socket 地址，它是 IP 地址和端口的组合。socket 连接中有两种点：监听连接的服务器和向服务器开启连接的客户端。服务器和客户端都需要唯一的\
  \ IP 地址-端口组合。\n\n\n\n\n\n点击此处查看代码图像\n\n```\nnet.connect(options, [connectionListener])\n\
  net.createConnection(options, [connectionListener])\nnet.connect(port, [host], [connectListener])\n\
  net.createConnection(port, [host], [connectListener])\nnet.connect(path, [connectionListener])\n\
  net.createConnection(path, [connectionListener])\n```\n\n所有的调用都会返回一个 `Socket` 对象；唯一的区别在于它们接受的第一个参数。所有这些方法的最后一个参数都是一个回调函数，当与服务器的连接建立时执行。注意，对于每个方法，都有\
  \ `net.connect()` 形式和 `net.createConnection()` 形式。它们的工作方式完全相同。\n\n创建 `Socket` 对象的第一个方法是传递一个\
  \ `options` 参数，该参数是一个包含定义 socket 连接属性的对象。表 8.1 列出了创建 `Socket` 对象时可以指定的属性。第二种方法接受\
  \ `port` 和 `host` 值作为直接参数，如表 8.1 所示。第三种选择接受一个 `path` 参数，用于指定在创建 `Socket` 对象时使用的\
  \ Unix socket 的文件系统位置。\n\n![图像](img/00075.jpeg)\n\n表 8.1 创建 Socket 对象时可以指定的属性\n\n\
  一旦创建了 `Socket` 对象，它就提供了几个在与服务器连接生命周期内触发的事件。例如，当 socket 连接时会触发 `connect` 事件，当 `Readable`\
  \ 流中有准备好待读取的数据时会触发 `data` 事件，当与服务器的连接关闭时会触发 `close` 事件。在你实现 socket 服务器时，你可以注册回调函数在这些事件触发时执行，以处理打开和关闭\
  \ socket、读取和写入数据等。表 8.2 列出了在 `Socket` 对象上可以触发的事件。\n\n![图像](img/00076.jpeg)\n\n表\
  \ 8.2 在 Socket 对象上可以触发的事件\n\n`Socket` 对象还包含几个方法，允许你执行诸如从 socket 读取和写入数据，以及暂停或结束数据流等操作。其中许多方法继承自\
  \ `Duplex` 流对象，因此你对它们应该熟悉（参见第 5 章，“在 Node.js 中处理数据 I/O](#part0016.html_ch05)”）。表\
  \ 8.3 列出了 `Socket` 对象上可用的方法。\n\n![图像](img/00077.jpeg)![图像](img/00078.jpeg)\n\n表\
  \ 8.3 在 Socket 对象上可以调的方法\n\n`Socket` 对象还提供了几个你可以访问的属性，以获取有关对象的信息——例如，socket 通信的地址和端口、正在写入的数据量以及缓冲区大小。表\
  \ 8.4 列出了 `Socket` 对象上可用的属性。\n\n![图像](img/00079.jpeg)\n\n表 8.4 在 Socket 对象上可以访问的属性\n\
  \n为了说明数据跨越 `Socket` 对象的流动，以下代码展示了在客户端上实现 `Socket` 对象的基础：\n\n点击此处查看代码图像\n\n```\n\
  var net = require('net');\nvar client = net.connect({port: 8107, host:'localhost'},\
  \ function() {\n  console.log('Client connected');\n  client.write('Some Data\\\
  n');\n});\n\nclient.on('data', function(data) {\n  console.log(data.toString());\n\
  \  client.end();\n});\n\nclient.on('end', function() {\n  console.log('Client disconnected');\n\
  });\n```\n\n注意 `net.connect()` 方法是使用一个包含 `port` 和 `host` 属性的可选对象调用的。`connect` 回调函数记录了一条消息，然后向服务器写入一些数据。为了处理从服务器返回的数据，实现了\
  \ `on.data()` 事件处理器。为了处理 socket 的关闭，实现了 `on('end')` 事件处理器。\n\n#### net.Server 对象\n\
  \n你使用 `net.Server` 对象来创建一个 TCP 服务器，并开始监听连接，你将能够对这些连接进行读写。当调用 `net.createServer()`\
  \ 时，内部会创建一个 `Server` 对象。该对象旨在代表 socket 服务器，并处理监听连接以及在这些连接上发送和接收数据。\n\n当服务器接收到连接时，服务器创建一个\
  \ `Socket` 对象并将其传递给任何正在监听的连接处理程序。由于 `Socket` 对象实现了 `Duplex` 流，你可以使用 `write()` 方法将数据流式地写回客户端，并使用\
  \ `data` 事件处理器从客户端流式传输数据。\n\n要创建一个 `Server` 对象，你使用 `net.createServer()` 方法：\n\n\
  点击此处查看代码图像\n\n```\nnet.createServer([options], [connectionListener])\n```\n\n`options`\
  \ 参数是一个在创建 `Server` 对象时指定选项的对象。表 8.5 列出了 `Server` 对象的选项。第二个参数是 `connection` 事件回调函数，在接收到连接时执行。该\
  \ `connectionListener` 回调函数将接收 `Socket` 对象。\n\n![图像](img/00080.jpeg)\n\n表 8.5 创建\
  \ Server 对象时可以指定的选项\n\n一旦创建了 `Server` 对象，它就提供了几个在服务器生命周期内触发的事件。例如，当连接建立时触发 `connection`\
  \ 事件，当服务器关闭时会触发 `close` 事件。在你实现 socket 服务器时，你可以注册回调函数在这些事件触发时执行，以处理连接、错误和关闭。表 8.6\
  \ 列出了在 `Socket` 对象上可以触发的事件。\n\n![图像](img/00081.jpeg)\n\n表 8.6 Socket 对象上可以触发的事件\n\
  \n`Server` 对象还包含几个方法，允许你执行诸如从 socket 读取和写入数据，以及暂停或结束数据流等操作。其中许多方法继承自 `Duplex` 流对象，因此你对它们应该熟悉。表\
  \ 8.7 列出了 `Socket` 对象上可用的方法。\n\n![图像](img/00082.jpeg)![图像](img/00083.jpeg)\n\n表\
  \ 8.7 在 Socket 对象上可以调的方法\n\n`Server` 对象还提供了 `maxConnections` 属性，允许你设置服务器在拒绝之前接受的最大连接数。如果进程使用\
  \ `child_process.fork()` 分派到了子进程进行处理，则你不应该使用此选项。\n\n以下代码展示了实现 `Server` 对象的基础：\n\n\
  ```\nvar net = require('net');\nvar server = net.createServer(function(client) {\n\
  \  console.log('Client connected');\n  client.on('data', function(data) {\n    console.log('Client\
  \ sent ' + data.toString());\n  });\n  client.on('end', function() {\n    console.log('Client\
  \ disconnected');\n  });\n  client.write('Hello');\n});\n\nserver.listen(8107, function()\
  \ {\n  console.log('Server listening for connections');\n});\n```\n\n注意 `net.createServer()`\
  \ 方法实现了一个接受客户端 `Socket` 对象的调。为了处理从客户端返回的数据，实现了 `on.data()` 事件处理器。\n\n\n\n\n现在你已经理解了\
  \ `net.Server` 和 `net.Socket` 对象，已经准备好着手实现一些 Node.js TCP 客户端和服务器了。本指南将引导你完成 Node.js\
  \ 中实现基础 TCP 客户端和服务器的过程。\n\n后续章节中的示例非常基础，以便你轻松掌握启动在端口上监听的 TCP 服务器以及实现可以连接的客户端等概念。这些示例旨在帮助你观察需要实现的交互和事件处理。\n\
  \n### 实现 TCP Socket 客户端\n\n在最基础的层，实现一个 TCP Socket 客户端涉及创建一个连接到服务器的 `Socket` 对象，然后向服务器写入数据并处理返回的数据。此外，你应该构建套接字，使其能够处理错误、缓冲区满以及超时。本节讨论了使用\
  \ `Socket` 对象实现套接字客户端涉及的步骤。Listing 8.1 提供了后续讨论的完整代码。\n\n第一步是调用 `net.connect()` 创建套接字客户端，如下所示。传入你想要连接的\
  \ `port` 和 `host`，并实现一个 `callback` 函数来处理连接事件：\n\n点击此处查看代码图像\n\n```javascript\nnet.connect({port:\
  \ 8107, host:'localhost'}, function() {\n\n  //处理连接\n});\n```\n\n然后在回调函数内部，你设置连接行为。例如，你可能想像所示添加超时或设置编码：\n\
  \n```javascript\nthis.setTimeout(500);\n\nthis.setEncoding('utf8');\n```\n\n你还需要为你想要处理的\
  \ `data`、`end`、`error`、`timeout` 和 `close` 事件添加处理器。例如，为了处理 `data` 事件以便读取从服务器返回的数据，你可以在连接建立后添加以下处理程序：\n\
  \n点击此处查看代码图像\n\n```javascript\nthis.on('data', function(data) {\n  console.log(\"\
  Read from server: \" + data.toString());\n  //处理数据\n  this.end();\n});\n```\n\n\
  要向服务器写入数据，你需要实现 `write()` 命令。如果你向服务器写入了大量数据且写入失败，你可能还想实现一个 `drain` 事件处理器，以便在缓冲区清空时重新写入。下面展示了一个由于写入失败而实现\
  \ `drain` 处理器的示例。注意，在函数结束后，使用了闭包来保留 `socket` 和 `data` 变量的值：\n\n点击此处查看代码图像\n\n```javascript\n\
  function writeData(socket, data){\n  var success = !socket.write(data);\n  if (!success){\n\
  \    (function(socket, data){\n      socket.once('drain', function(){\n        writeData(socket,\
  \ data);\n      });\n    })(socket, data);\n  }\n}\n```\n\nListing 8.1 展示了基础 TCP\
  \ 客户端的完整实现。客户端向服务器发送一些数据并接收一些数据；然而该示例可以轻松扩展以支持跨套接字的更复杂的数据处理。注意有三个独立的套接字连接到服务器，并且它们同时通信。图\
  \ 8.1 显示了 Listing 8.1 代码的输出。注意每个客户端都获得了不同的端口号。\n\nListing 8.1 `socket_client.js`:\
  \ 实现基础 TCP 客户端\n\n点击此处查看代码图像\n\n* *\n\n```javascript\n01 var net = require('net');\n\
  02 function getConnection(connName){\n03   var client = net.connect({port: 8107,\
  \ host:'localhost'}, function() {\n04     console.log(connName + ' Connected: ');\n\
  05     console.log('    local = %s:%s', this.localAddress, this.localPort);\n06\
  \     console.log('    remote = %s:%s', this.remoteAddress, this.remotePort);\n\
  07     this.setTimeout(500);\n08     this.setEncoding('utf8');\n09     this.on('data',\
  \ function(data) {\n10       console.log(connName + \" From Server: \" + data.toString());\n\
  11       this.end();\n12     });\n13   this.on('end', function() {\n14     console.log(connName\
  \ + ' disconnected');\n15   });\n16   this.on('error', function(err) {\n17     console.log('\
  \ Error: ', JSON.stringify(err));\n18   });\n19   this.on('timeout', function()\
  \ {\n20     console.log('Socket Timed Out');\n21   });\n22   this.on('close', function()\
  \ {\n23     console.log('Socket Closed');\n24   });\n25 });\n26   return client;\n\
  27 }\n28 function writeData(socket, data){\n29   var success = !socket.write(data);\n\
  30   if (!success){\n31     (function(socket, data){\n32       socket.once('drain',\
  \ function(){\n33         writeData(socket, data);\n34       });\n35     })(socket,\
  \ data);\n36   }\n37 }\n38 var Dwarves = getConnection(\"Dwarves\");\n39 var Elves\
  \ = getConnection(\"Elves\");\n40 var Hobbits = getConnection(\"Hobbits\");\n41\
  \ writeData(Dwarves, \"More Axes\");\n42 writeData(Elves, \"More Arrows\");\n43\
  \ writeData(Hobbits, \"More Pipe\");\n```\n* * *\n\n![Image](img/0008.jpeg)\n\n\
  图 8.1 多个发送和接收数据的套接字客户端。\n\n### 实现 TCP 服务器\n\n在最基础的层，实现 TCP 服务器涉及创建一个 `Server` 对象、监听端口并处理传入的连接（包括读取和写入）。此外，套接字服务器应该处理\
  \ `Server` 对象上的 `close` 和 `error` 事件，以及发生的事件。本节讨论了使用 `Server` 对象实现套接字服务器涉及的步骤。Listing\
  \ 8.2 提供了后续讨论的完整代码。\n\n第一步是调用 `net.createServer()` 创建套接字服务器，如下所示。你还需要提供一个连接处理器，然后调用\
  \ `listen()` 开始监听端口：\n\n点击此处查看代码图像\n\n```javascript\nvar server = net.createServer(function(client)\
  \ {\n  //在此处实现连接处理器\n});\n\nserver.listen(8107, function() {\n  //在此处实现监听处理器\n});\n\
  ```\n\n在 `listen` 回调处理器内部，你还需要添加支持 `Server` 对象上 `close` 和 `error` 事件的处理器。这些可能是日志语句，或者你可能想添加当这些事件发生时执行的额外代码。以下是两个基础示例：\n\
  \n点击此处查看代码图像\n\n```javascript\nserver.on('close', function(){\n  console.log('Server\
  \ Terminated');\n});\n\nserver.on('error', function(err){\n});\n```\n\n在 `connection`\
  \ 事件回调内部，你设置连接行为。例如，你可能想像所示添加超时或设置编码：\n\n```javascript\nthis.setTimeout(500);\n\n\
  this.setEncoding('utf8');\n```\n\n你还需要为你想要在客户端连接上处理的 `data`、`end`、`error`、`timeout`\
  \ 和 `close` 事件添加处理器。例如，为了处理 `data` 事件以便读取从客户端传的数据，你可以在连接建立后添加以下处理程序：\n\n```javascript\n\
  this.on('data', function(data) {\n  console.log(\"Received from client: \" + data.toString());\n\
  \  //处理数据\n});\n```\n\n\n\n\n\n要向服务器写入数据，你需要在代码的某处实现 `write()` 命令。如果你正在向客户端写入大量数据，你可能还想实现一个\
  \ `drain` 事件处理器，它会在缓冲区清空时重新开始写入。如果 `write()` 因为缓冲区满而返回失败，或者你想限制向套接字写入的速度，这将会非常有帮助。以下是一个由于写入失败而实现\
  \ drain 处理器的示例。请注意，这里使用了闭包来在函数结束后后保留 `socket` 和 `data` 变量的值：\n\n点击此处查看代码图片\n\n```javascript\n\
  function writeData(socket, data){\n\n  var success = !socket.write(data);\n\n  if\
  \ (!success){\n    (function(socket, data){\n      socket.once('drain', function(){\n\
  \        writeData(socket, data);\n      });\n    })(socket, data);\n  }\n}\n```\n\
  \n列表 8.2 显示了基础 TCP socket 服务器的完整实现。该 socket 服务器在端口 8107 上接受连接，读取输入数据，然后向客户端写回字符串。尽管实现非常基础，但它阐明了如何处理事件以及在客户端连接中进行数据的读写。图\
  \ 8.2 显示了列表 8.2 中代码的输出。\n\n### 列表 8.2 `socket_server.js`: 实现一个基础 TCP socket 服务器\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var net = require('net');\n02 var server = net.createServer(function(client)\
  \ {\n03   console.log('Client connection: ');\n04   console.log('    local = %s:%s',\
  \ client.localAddress, client.localPort);\n05   console.log('    remote = %s:%s',\
  \ client.remoteAddress, client.remotePort);\n06   client.setTimeout(500);\n07  \
  \ client.setEncoding('utf8');\n08   client.on('data', function(data) {\n09     console.log('Received\
  \ data from client on port %d: %s',\n10               client.remotePort, data.toString());\n\
  11     console.log('  Bytes received: ' + client.bytesRead);\n12     writeData(client,\
  \ 'Sending: ' + data.toString());\n13     console.log('  Bytes sent: ' + client.bytesWritten);\n\
  14   });\n15   client.on('end', function() {\n16     console.log('Client disconnected');\n\
  17     server.getConnections(function(err, count){\n18       console.log('Remaining\
  \ Connections: ' + count);\n19     });\n20   });\n21   client.on('error', function(err)\
  \ {\n22     console.log('Socket Error: ', JSON.stringify(err));\n23   });\n24  \
  \ client.on('timeout', function() {\n25     console.log('Socket Timed out');\n26\
  \   });\n27 });\n28 server.listen(8107, function() {\n29   console.log('Server listening:\
  \ ' + JSON.stringify(server.address()));\n30   server.on('close', function(){\n\
  31     console.log('Server Terminated');\n32   });\n33   server.on('error', function(err){\n\
  34     console.log('Server Error: ', JSON.stringify(err));\n35   });\n36 });\n37\
  \ function writeData(socket, data){\n38   var success = !socket.write(data);\n39\
  \   if (!success){\n40     (function(socket, data){\n41       socket.once('drain',\
  \ function(){\n42         writeData(socket, data);\n43       });\n44     })(socket,\
  \ data);\n45   }\n46 }\n```\n\n图片\n\n### 实现服务器与客户端\n\n传输层安全（TLS/SSL）是一种旨在在计算机网络上提供安全通信的协议。它通过加密、身份验证和数据完整性来提供数据通信的隐私性和身份验证。\n\
  \n要实现 TLS 服务器，你需要生成证书和私钥。首先，使用以下命令生成私钥：\n\n```bash\nopenssl genrsa -out server.key\
  \ 2048\n```\n\n接下来，创建一个证书签名请求（CSR）：\n\n```bash\nopenssl req -new -key server.key\
  \ -out server.csr\n```\n\n在创建 CSR 时，你需要回答几个问题。对于通用名称（common name），你应该输入服务器的域名。如果你使用自签名证书进行测试，请使用以下命令：\n\
  \n```bash\nopenssl x509 -req -days 365 -in server.csr -signkey server.key -out server.crt\n\
  ```\n\n自签名证书对于测试是可以的。但如果你正在实现外部服务，你可能需要由证书颁机构签名的证书。在 Node.js 中，你使用 `tls` 模块来实现 TLS\
  \ 服务器。\n\n```javascript\nconst tls = require('tls');\nconst options = {\n  key:\
  \ fs.readFileSync('server.key'),\n  cert: fs.readFileSync('server.crt')\n};\n\n\
  const server = tls.createServer(options, (socket) => {\n  console.log('Client connected');\n\
  \  socket.on('data', (data) => {\n    console.log('Received: ' + data);\n  });\n\
  });\n\nserver.listen(8443, () => {\n  console.log('TLS server listening on 8443');\n\
  });\n```\n\n#### 创建 TLS 客户端\n\n创建 TLS 客户端与之前讨论的 socket 客户端几乎相同。唯一的区别是有额外的选项（如表格\
  \ 8.8;\nconst options = {\n  hostname: 'encrypted.mysite.com',\n  port: 8443,\n\
  \  path: '/',\n  method: 'GET',\n  key: fs.readFileSync('client.key'),\n  cert:\
  \ fs.readFileSync('client.crt'),\n  ca: fs.readFileSync('server.crt')\n};\nconst\
  \ req = tls.connect(options, (res) => {\n  // 处理连接的方式与 net.connect 相同\n});\n```\n\
  \n\n\n\n\n创建一个 TLS socket 服务器与本章早期讨论的 socket 服务器几乎完全一样。唯一的区别在于，你必须向 `tls.createServer()`\
  \ 传递额外的选项，并且在 `tls.Server` 对象上可以触发一些额外的事件。表 8.9 中列出的选项允许你为服务器指定安全选项。表 8.10 列出了 TLS\
  \ socket 服务器的额外事件。最重要的选项是 `key`、`cert` 和 `ca`。\n\n![Image](img/00087.jpeg)![Image](img/00088.jpeg)\n\
  \n#### 表 8.9 `tls.createServer()` 的额外选项\n\n`key` 选项指定了用于 SSL 的私钥。`certcert` 值指定了要使用的\
  \ x509 公钥。如果你使用的是自签名证书，则需要将 `ca` 属性指向客户端的证书。\n\n以下是在 Node.js 中创建 TLS socket 服务器的示例：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar options = {\n  key: fs.readFileSync('test/keys/server.pem'),\n\
  \  cert: fs.readFileSync('test/keys/server.crt'),\n  ca: fs.readFileSync('test/keys/client.crt')\n\
  };\n\ntls.createServer(options, function (client) {\n  client.write(\"Hello Secure\
  \ World\\r\\n\");\n  client.end();\n}).listen(8108);\n```\n\n一旦创建了 TLS socket 服务器，请求/响应的处理方式与本章之前描述的\
  \ TCP socket 服务器基本相同。服务器可以接受连接并向客户端读写数据。\n\n![Image](img/00089.jpeg)\n\n#### 表 8.10\
  \ TLS `Server` 对象上的额外事件\n\n## 总结\n\n在 Node.js 应用中实现后端服务时，Sockets 非常有用。它们允许一个系统上的服务通过\
  \ IP 地址和端口与另一个系统上的服务通信。它们还提供了在运行同一服务器的两个不同进程之间实现进程间通信（IPC）的能力。`net` 模块允许你创建作为 socket\
  \ 服务器的 `Server` 对象和作为 socket 客户端的 `Socket` 对象。由于 `Socket` 对象继承了 `Duplex` 流，你可以从服务器和客户端读写数据。对于安全连接，Node.js\
  \ 提供了 `tls` 模块，它允许你实现安全的 TLS socket 服务器和客户端。\n\n### 下一步告\n\n在下一章中，你将有机会在 Node.js\
  \ 环境中实现多进程处理。这允许你将工作分给系统上的其他进程，并利用多处理器服务器的优势。\n\n## 9. 在 Node.js 中使用多处理器扩展应用程序\n\
  \n在第 4 章“Node.js 中使用事件、监听器、定时器和回调”中，你学习了 Node.js 应用运行在单线程上而不是多线程上。使用单线程进行应用处理使得\
  \ Node.js 进程更高效、更快速。但大多数服务器都有多个处理器，你可以利用它们来扩展 Node.js 应用。Node.js 允许你将工作从主应用程序分派到独立的进程中，这些进程可以与其他以及主应用程序并行处理。\n\
  \n为了方便利用多个进程，Node.js 提供了三个特定的模块。`process` 模块提供了对运行进程的访问。`child_process` 模块允许你创建子进程并与其通信。`cluster`\
  \ 模块提供了实现共享相同端口的集群服务器的能力，从而允许同时处理多个请求。\n\n### 理解 process 模块\n\n`process` 模块是一个全局对象，可以在\
  \ Node.js 应用中直接访问，而无需使用 `require()`。该模块让你能够访问运行中的进程，以及关于底层硬件架构的信息。\n\n#### 理解进程\
  \ I/O 管道（Pipes）\n\n`process` 模块提供了对进程标准 I/O 管道 `stdin`、`stdout` 和 `stderr` 的访问。`stdin`\
  \ 是进程的标准输入管道，通常是控制台。这意味着你可以使用以下代码从控制台读取输入：\n\n点击此处查看代码图片\n\n```javascript\nprocess.stdin.on('data',\
  \ function(data){\n  console.log(\"Console Input: \" + data);\n});\n```\n\n然后当你向控制台输入数据并按回车时，数据会被写回。例如：\n\
  \nsome data\n\nConsole Input: some data\n\nprocess 模块的 `stdout` 和 `stderr` 属性是 `Writable`\
  \ 流，可以对其进行相应的处理。\n\n#### 理解进程信号（Signals）\n\n`process` 模块的一个强大功能是它允许你注册监听器来处理操作系统发送给进程的信号。这在你需要在进程停止或终止之前执行某些操作（如清理）时非常有帮助。表\
  \ 9.1 列出了你可以为之添加监听器的进程事件。\n\n![Image](img/00090.jpeg)\n\n#### 表 9.1 可以发送给 Node.js\
  \ 进程的事件\n\n要注册进程，只需使用 `on()` 方法。例如，要为 `SIGBREAK` 事件注册处理器，你会使用以下代码：\n\n点击此处查看代码图片\n\
  \n```javascript\nprocess.on('SIGBREAK', function(){\n  console.log(\"Got SIGBREAK\"\
  );\n});\n```\n\n#### 使用 process 模块进程执行\n\n`process` 模块提供了执行控制。具体来说，它允许你停止当前进程、杀死另一个进程或调度任务运行。例如，退出当前\
  \ Node.js 进程你会使用：\n\n```javascript\nprocess.exit(0)\n```\n\n表 9.2 列出了 `process`\
  \ 模块中可用的方法。\n\n![Image](img/00091.jpeg)\n\n#### 从 process 模块获取信息\n\n`process` 模块包含了关于运行进程的丰富信息。这些信息在实现应用时非常有用。例如，`process.pid`\
  \ 属性提供了进程 ID。表 9.3 列出了你可以从 `process` 模块访问的属性和方法，并描述了它们的返回值。\n\n![Image](img/00092.jpeg)![Image](img/00093.jpeg)![Image](img/00094.jpeg)\n\
  \n#### 表 9.3 process 模块的方法和属性\n\n为了帮助你理解如何使用 `process` 模块，列表 9.1 执行了一系列调用并将结果输出到控制台，如图\
  \ 9.1 所示。\n\n列表 9.1 `process_info.js`: 使用 `process` 模块访问进程和系统信息\n\n```javascript\n\
  var util = require('util');\n\nconsole.log('Current directory: ' + process.cwd());\n\
  console.log('Environment Settings: ' + JSON.stringify(process.env));\nconsole.log('Node\
  \ Args: ' + process.argv);\nconsole.log('Execution Path: ' + process.execPath);\n\
  console.log('Execution Args: ' + JSON.stringify(process.execArgv));\nconsole.log('Node\
  \ Version: ' + process.version);\nconsole.log('Module Versions: ' + JSON.stringify(process.versions));\n\
  //console.log(process.config);\nconsole.log('Process ID: ' + process.pid);\nconsole.log('Process\
  \ Title: ' + process.title);\nconsole.log('Process Platform: ' + process.platform);\n\
  console.log('Process Architecture: ' + process.arch);\nconsole.log('Memory Usage:\
  \ ' + util.inspect(process.memoryUsage()));\nvar start = process.hrtime();\n\nsetTimeout(function()\
  \ {\n```\n\n\n\n\n```javascript\nvar delta = process.hrtime(start);\n\nconsole.log('High-Res\
  \ timer took %d seconds and %d nanoseconds',\n            delta[0], + delta[1]);\n\
  console.log('Node has been running %d seconds', process.uptime());\n}, 1000);\n\
  ```\n\n* * *\n![Image](img/00095.jpeg)\n\n图 9.1 使用 `process` 模块获取关于进程和系统的信息。\n\n\
  ## 实现子进程\n\n为了在服务器上运行 Node.js 应用程序时利用多处理器的优势，你需要将工作派发给子进程。`child_process` 模块允许你在其他进程上派生（spawn）、分叉（fork）并执行（execute）工作。接下来的章节将讨论在其他进程上执行任务的流程。\n\
  \n* * *\n### 注意\n请记住，子进程无法直接访问彼此之间或父进程中的全局内存。因此，你需要设计你的应用程序以并行方式运行。\n\n* * *\n\n\
  ### 理解 ChildProcess 对象\n\n`child_process` 模块提供了一个名为 `ChildProcess` 的新类，它作为从父进程可以访问的子进程的表示。这允许你从启动它们的父进程中控制、结束并向子进程发送消息。\n\
  \n此外，`process` 模块本身也是一个 `ChildProcess` 对象。这意味着当你从父模块访问 `process` 时，它是父级 `ChildProcess`\
  \ 对象；但当你从子进程访问 `process` 时，它是 `ChildProcess` 对象。\n\n在本节中，你将学习更多关于 `ChildProcess`\
  \ 对象的知识，以便你能够在后续章节中利用它来实现多进程 Node.js 应用程序。\n\n表 9.4 列出了可以在 `ChildProcess` 对象上发射的事件。你为这些事件实现处理程序，以处理子进程终止或向父进程传回消息的情况。\n\
  \n![Image](img/00096.jpeg)\n\n表 9.4 ChildProcess 对象上可以发射的事件\n\n表 9.5 列出了可以在子进程上调的方法。这些方法允许你终止、断开连接或向子进程发送消息。例如，你可以从父进程调用以下代码向子进程发送一个对象：\n\
  \n点击此处查看代码图片\n\n```javascript\nchild.send({cmd: 'command data'});\n```\n\n![Image](img/00097.jpeg)\n\
  \n表 9.5 ChildProcess 对象上可以调用的方法\n\n表 9.6 列出了可以在 `ChildProcess` 对象上访问的属性。\n\n![Image](img/00098.jpeg)\n\
  \n表 9.6 ChildProcess 对象上可以访问的属性\n\n### 使用 exec() 在另一个进程上执行系统命令\n\n从 Node.js 进程向另一个进程添加工作的简单方法是使用\
  \ `exec()` 函数在子壳（subshell）中执行系统命令。`exec()` 函数可以执行几乎可以在控制台提示符中执行的内容，例如二进制可执行文件、shell\
  \ 脚本、Python 脚本或批文件。\n\n执行 `exec()` 函数时会创建一个系统子 shell，然后在该 shell 中执行命令字符串，就像你在控制台提示符中执行它一样。这让你能够利用控制台\
  \ shell 的能力，例如在命令行上访问环境变量。\n\n`exec()` 函数的语法返回一个 `ChildProcess` 对象，如下所示所示：\n\n点击此处查看代码图片\n\
  \n```javascript\nchild_process.exec(command, [options], callback)\n```\n\n`command`\
  \ 参数是一个字符串，指定了要在子壳中执行的命令。`options` 参数是一个对象，指定了执行命令时使用的设置，例如当前工作目录。表 9.7 列出了你可以通过\
  \ `exec()` 和 `execFile()` 命令指定的选项。\n\n![Image](img/00099.jpeg)\n\n表 9.7 使用 `exec()`\
  \ 和 `execFile()` 函数可以设置的选项\n\n`callback` 参数是一个函数，接受三个参数：`error`、`stdout` 和 `stderr`。如果在执行命令期间遇到错误，则会向\
  \ `error` 参数传递一个错误对象。`stdout` 和 `stderr` 是 `Buffer` 对象，包含执行命令的输出。\n\n列表 9.2 展示了使用\
  \ `exec()` 函数执行系统命令的示例。图 9.2 显示了列表 9.2 的输出。\n\n列表 9.2 `child_exec.js`: 执行系统命令\n\n\
  点击此处查看代码图片\n\n* * *\n```javascript\nvar childProcess = require('child_process');\n\
  var options = {maxBuffer:100*1024, encoding:'utf8', timeout:500};\n\nconsole.log('High-Res\
  \ timer took %d seconds and %d nanoseconds',\n            delta[0], + delta[1]);\n\
  console.log('Node has been running %d seconds', process.uptime());\n}, 1000);\n\
  ```\n\n### 使用 execFile() 在另一个进程上执行可执行文件\n\n从 Node.js 进程向另一个进程添加工作的另一种简单方法是使用 `execFile()`\
  \ 函数在另一个进程上执行可执行文件。`execFile()` 与 `exec()` 类似，但它不会创建子 shell，而是直接执行可执行文件。\n\n`execFile()`\
  \ 函数的语法返回一个 `ChildProcess` 对象，如下所示：\n\n```javascript\nchild_process.execFile(file,\
  \ [options], callback)\n```\n\n`file` 参数是一个字符串，指定了要执行的可执行文件的路径。`options` 参数是一个对象，指定了执行命令时使用的设置，例如当前工作目录。表\
  \ 9.7 列出了你可以通过 `execFile()` 命令指定的选项。\n\n`callback` 参数是一个函数，接受三个参数：`error`、`stdout`\
  \ 和 `stderr`。如果在执行命令期间遇到错误，则会向 `error` 参数传递一个错误对象。`stdout` 和 `stderr` 是 `Buffer`\
  \ 对象，包含执行命令的输出。\n\n列表 9.3 展示了使用 `execFile()` 函数执行可执行文件的示例。图 9.3 显示了列表 9.3 的输出。\n\
  \n列表 9.3 `child_exec_file.js`: 在另一个进程上执行可执行文件\n\n```javascript\nvar childProcess\
  \ = require('child_process');\nvar options = {maxBuffer:100*1024, encoding:'utf8',\
  \ timeout:5000};\n\nvar child = childProcess.execFile('ping.exe', ['-n', '1', 'google.com'],\
  \ options, function (error, stdout, stderr) {\n    if (error) {\n        console.log(error.stack);\n\
  \        console.log('Error Code: '+error.code);\n        console.log('Error Signal:\
  \ '+error.signal);\n    }\n    console.log('Results: \\n' + stdout);\n    if (stderr.length){\n\
  \        console.log('Errors: ' + stderr);\n    }\n});\nchild.on('exit', function\
  \ (code) {\n    console.log('Child completed with code: '+code);\n});\n```\n\n\n\
  \n\n\n![Image](img/00101.jpeg)\n\n图 9.3 使用 `execFile()` 执行可执行文件的输出。\n\n### 使用 `spawn()`\
  \ 在另一个 Node.js 实例中派生进程\n\n从 Node.js 进程向另一个进程添加工作的一种相当复杂的方法是派生另一个进程；在它们之间链接 `stdio`、`stdout`\
  \ 和 `stderr` 管道；然后使用 `spawn()` 函数在新进程上执行文件。这种方法比简单地使用 `exec()` 稍微重一些，但提供了一些非常棒的处。\n\
  \n`spawn()` 与 `exec()`/`execFile()` 之间的主要区别在于，可以配置派生进程的 `stdin`，而 `stdout` 和 `stderr`\
  \ 是父进程中的 `Readable` 流。这意味着在你可以读取缓冲区输出之前，`exec()` 和 `execFile()` 必须执行完成。然而，一旦 `spawn()`\
  \ 进程写入了输出数据，你就可以立即读取这些数据。\n\n`spawn()` 函数返回一个 `ChildProcess` 对象，其语法下所示：\n\n点击此处查看代码图片\n\
  \n```javascript\nchild_process.spawn(command, [args], [options])\n```\n\n`command`\
  \ 参数是一个指定要执行命令的字符串。`args` 参数是一个数组，指定了传递给可执行命令的命令行参数。`options` 参数是一个对象，指定了在执行命令时使用的设置，例如当前工作目录。表\
  \ 9.8 列出了你可以通过 `spawn()` 命令指定的选项。\n\n![Image](img/00102.jpeg)\n\n表 9.8 使用 `spawn()`\
  \ 函数时可以设置的选项\n\n`callback` 参数是一个函数，接受三个参数的函数：`error`、`stdout` 和 `stderr`。如果在执行命令期间遇到错误，将向\
  \ `error` 参数传递一个错误对象。`stdout` 和 `stderr` 由 `stdio` 选项设置定义；默认认为 `Readable` 流对象。\n\
  \n列表 9.4 是使用 `spawn()` 函数执行系统命令的示例。图 9.4 显示了列表 9.4 的输出。\n\n列表 9.4 `child_process_spawn_file.js`:\
  \ 在另一个进程中派生命令\n\n点击此处查看代码图片\n\n```javascript\n01 var spawn = require('child_process').spawn;\n\
  02 var options = {\n03     env: {user:'brad'},\n04     detached:false,\n05     stdio:\
  \ ['pipe','pipe','pipe']\n06 };\n07 var child = spawn('netstat', ['-e']);\n08 child.stdout.on('data',\
  \ function(data) {\n09   console.log(data.toString());\n10 });\n11 child.stderr.on('data',\
  \ function(data) {\n12   console.log(data.toString());\n13 });\n14 child.on('exit',\
  \ function(code) {\n15   console.log('Child exited with code', code);\n16 });\n\
  ```\n\n![Image](img/00103.jpeg)\n\n图 9.4 使用 `spawn()` 从派生命令中流出的输出。\n\n### 实现子分叉\
  \ (Child Forks)\n\nNode.js 提供了一种特殊的进程派生形式，称为 `fork`，它设计用于在运行在独立处理器上的另一个 V8 实例内部执行\
  \ Node.js 模块代码。你可以使用 fork 并行运行多个服务。然而，启动一个新的 V8 实例需要时间，且每个实例占用约 10MB 内存。因此，你应该设计分叉进程运行得久\
  \ 一些，并且不需要大量的它们。记住，创建比系统中 CPU 数量更多的进程并不会让你从中获得任何性能提升。\n\n与 `spawn` 不同，你不能为子进程配置\
  \ `stdio`。相反，你使用 `ChildProcess` 对象中的 `send()` 机制在父进程和子进程之间通信。\n\n`fork()` 函数返回一个\
  \ `ChildProcess` 对象，其语法下所示：\n\n点击此处查看代码图片\n\n```javascript\nchild_process.fork(modulePath,\
  \ [args], [options])\n```\n\n`modulePath` 参数是一个字符串，指定由新的 Node.js 实例启动的 JavaScript\
  \ 文件的路径。`args` 参数是一个数组，指定了传递给 `node` 命令的命令行参数。`options` 参数是一个对象，指定了在执行命令时使用的设置，例如当前工作目录。表\
  \ 9.9 列出了你可以通过 `fork()` 命令指定的选项。\n\n![Image](img/00104.jpeg)\n\n表 9.9 使用 `fork()`\
  \ 函数时可以设置的选项\n\n`callback` 参数是一个函数，接受三个参数的函数：`error`、`stdout` 和 `stderr`。如果在执行命令期间遇到错误，将向\
  \ `error` 参数传递一个错误对象。`stdout` 和 `stderr` 由 `stdio` 选项设置定义；默认认为 `Readable` 流对象。\n\
  \n列表 9.5 和 列表 9.6 展示了分叉到独立进程中的 Node.js 实例的示例。`fork()` 方法创建子进程并向父进程发送。图 9.4 显示了这些输出。\n\
  \n列表 9.5 `child_fork.js`: 在另一个进程中派生命令\n\n```javascript\n01 var spawn = require('child_process').spawn;\n\
  02 var options = {\n03     env: {user:'brad'},\n04     detached:false,\n05     stdio:\
  \ ['pipe','pipe','pipe']\n06 };\n07 var child = spawn('netstat', ['-e']);\n08 child.stdout.on('data',\
  \ function(data) {\n09   console.log(data.toString());\n10 });\n11 child.stderr.on('data',\
  \ function(data) {\n12   console.log(data.toString());\n13 });\n14 child.on('exit',\
  \ function(code) {\n15   console.log('Child exited with code', code);\n16 });\n\
  ```\n\n列表 9.6 `chef.js`: 一个处理消息事件并向父进程发送数据的子进程\n\n```javascript\n01 process.on('message',\
  \ function(message, parent) {\n02   var meal = {};\n03   switch (message.cmd){\n\
  04     case 'makeBreakfast':\n05       meal = [\"ham\", \"eggs\", \"toast\"];\n\
  06     break;\n07     case 'makeLunch':\n08       meal = [\"burger\", \"fries\"\
  , \"shake\"];\n09     break;\n10     case 'makeDinner':\n11       meal = [\"soup\"\
  , \"salad\", \"steak\"];\n12     break;\n13   }\n14   process.send(meal);\n15 });\n\
  ```\n\n### 实现进程集群 (Process Clusters)\n\nNode.js 最酷的功能之一是在同一台机器的独立进程中并行创建 Node.js\
  \ 实例集群。你可以使用上一节中学到的技巧，通过分叉进程并使用 `send(message, serverHandle)` IPC 机制在它们之间通信 `send()`\
  \ 消息并传递底层 TCP 服务器句柄来实现这一点。然而，由于这是一个非常常见的任务，Node.js 提供了 `cluster` 模块，它可以为你完成所有工作。\n\
  \n**注意**\n\n在编写本文时，`cluster` 模块仍处于不稳定状态，因此其语法和可用选项可能与本章看到的有所不同。当你决定实现 `cluster`\
  \ 模块时，请务必对照 Node.js 代码检查语法。\n\n\n\n\n\n# 使用 cluster 模块\n\n`cluster` 模块允许你轻松地在同一台机器上的不同进程中运行\
  \ TCP 或 HTTP 服务器集群，但这些进程仍然使用相同的底层 socket，从而在相同的 IP 地址和端口组合上处理请求。`cluster` 模块实现简单，并提供了若干事件、方法和属性，你可以使用这些特性来启动和监控\
  \ Node.js 服务器集群。\n\n表 9.10 列出了在 `cluster` 模块应用中可以发射的事件。\n\n![Image](img/00106.jpeg)\n\
  \n表 9.10 `cluster` 模块可以发射的事件\n\n表 9.11 列出了你可以在 `cluster` 模块中使用的方法和属性，用于获取此类信息（例如此节点是工作进程\
  \ worker 还是主进程 master），以及配置和实现分叉进程。\n\n![Image](img/00107.jpeg)\n\n表 9.11 `cluster`\
  \ 模块的方法和属性\n\n## 理解 Worker 对象\n\n当一个工作进程被分叉（fork）时，主进程和工作进程中都会创建一个新的 `Worker` 对象。在工作进程中，`Worker`\
  \ 对象用于表示当前的工作进程，并与正在发生的集群事件进行交互。在主进程中，`Worker` 对象用于表示子工作进程，以便你的主应用程序可以向它们发送消息、接收关于它们状态变更的事件，甚至杀死它们。\n\
  \n表 9.12 列出了 `Worker` 对象可以发射的事件。\n\n![Image](img/00108.jpeg)\n\n表 9.12 `Worker`\
  \ 对象可以发射的事件\n\n表 9.13 列出了你可以配合 `Worker` 对象一起使用的方法和属性，用于获取此类信息（例如该节点是 worker 还是 master），以及配置和实现分叉进程。\n\
  \n![Image](img/00109.jpeg)\n\n表 9.13 `Worker` 对象的方法和属性\n\n## 实现 HTTP 集群\n\n说明 `cluster`\
  \ 模块价值的最佳方法是展示一个 Node.js HTTP 服务器的基础实现。代码列表 9.7 实现了一个基础的 HTTP 服务器集群。第 4–13 行为集群工作进程的\
  \ `fork`、`listening` 和 `exit` 事件注册了监听器。然后第 14 行的代码调用了 `setupMaster()` 并指定了工作可执行文件\
  \ `cluster_worker.js`。接下来，第 15–19 行通过调用 `cluster.fork()` 创建工作进程。最后，第 20–24 行的代码遍历所有工作进程，并为每一个进程注册了\
  \ `on('message')` 事件处理器。\n\n代码列表 9.8 中的代码实现了工作 HTTP 服务器。注意，HTTP 服务器向客户端返回了响应，然后在第\
  \ 7 行向集群主进程发送了消息。\n\n代码列表 9.9 中的代码实现了一个简单的 HTTP 客户端，通过发送系列请求来测试在 代码列表 9.8 中创建的服务器。图\
  \ 9.6 显示了服务器的输出，图 9.7 显示了客户端的输出。注意，图 9.7 中的输出显示请求正被服务器上不同的进程处理。\n\n代码列表 9.7 `cluster_server.js`：创建一个最多四个个工作进程的主进程\n\
  \n点击此处查看代码图像\n\n```javascript\n01 var cluster = require('cluster');\n02 var http\
  \ = require('http');\n03 if (cluster.isMaster) {\n04   cluster.on('fork', function(worker)\
  \ {\n05      console.log(\"Worker \" + worker.id + \" created\");\n06    });\n07\
  \   cluster.on('listening', function(worker, address) {\n08      console.log(\"\
  Worker \" + worker.id +\" is listening on \" +\n09                   address.address\
  \ + \":\" + address.port);\n10    });\n11   cluster.on('exit', function(worker,\
  \ code, signal) {\n12      console.log(\"Worker \" + worker.id +\" Exited\");\n\
  13    });\n14   cluster.setupMaster({exec:'cluster_worker.js'});\n15   var numCPUs\
  \ = require('os').cpus().length;\n16   for (var i = 0; i < numCPUs; i++) {\n17 \
  \     if (i>=4) break;\n18      cluster.fork();\n19   }\n20   Object.keys(cluster.workers).forEach(function(id)\
  \ {\n21      cluster.workers[id].on('message', function(message){\n22      console.log(message);\n\
  23    });\n24   });\n25 }\n```\n\n代码列表 9.8 `cluster_worker.js`：工作 HTTP 服务器\n\n点击此处查看代码图像\n\
