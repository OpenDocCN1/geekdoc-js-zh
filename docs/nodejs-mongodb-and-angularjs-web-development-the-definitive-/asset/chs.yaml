  ### 实现事件发射器和监听器\n\n在接下来的章节中，你将有机会实现各种 Node.js 模块中内置的许多事件。本节重点关注创建你自己的自定义事件，以及实现当事件触发时执行的监听器回调。\n\
  #### 为你的 JavaScript 对象添加自定义事件\n\n事件是通过 `EventEmitter` 对象进行发射的。该对象包含在 `events` 模块中。`emit(eventName,\
  \ [args])` 函数触发 `eventName` 事件并包含提供的任何参数。以下代码片段了如何实现一个简单的事件发射器：\n\n点击此处查看代码图片\n\
  ```javascript\nvar events = require('events');\n\n\nemitter.emit(\"simpleEvent\"\
  );\n```\n\n有时，你可能直接向你的 JavaScript 对象添加事件。要做到这一点，你需要在对象实例化时通过调用 `events.EventEmitter.call(this)`\
  \ 在你的对象中继承 `EventEmitter` 功能。你还需要将 `events.EventEmitter.prototype` 添加到你的对象原型中。例如：\n\
  点击此处查看代码图片\n\n```javascript\n  Events.EventEmitter.call(this);\n\nMyObj.prototype.__proto__\
  \ = events.EventEmitter.prototype;\n```\n然后你就可以从对象的实例中直接发射事件。例如：\n\n```javascript\n\
  \nmy_obj.emit(\"someEvent\");\n```\n\n#### 为对象添加事件监听器\n一旦你有了可以发射事件的对象实例，你就可以为你关心的事件添加监听器。你可以使用以下函数之一向\
  \ `EventEmitter` 对象添加监听器：\n\n![Image](img/00003.jpeg)\n- `.addListener(eventName,\
  \ callback)`：将 `callback` 附加到 `eventName`。\n- `.once(eventName, callback)`：仅在 `eventName`\
  \ 第一次触发时执行 `callback`。\n\n例如，要为 `EventEmitter` 实例添加监听器](#part0050.html_p065pro01a)：\n\
  ```javascript\n}\nvar myObject = new MyObj();\nmyObject.on(\"someEvent\");\n```\n\
  \n\n监听器非常有用，是 Node.js 的重要部分。但它们会产生开销，因此你应该在需要时使用它们。Node.js 在 `EventEmitter` 上提供了几个辅助函数来管理监听器：\n\
  \n- `.setMaxListeners(n)`：如果向 `EventEmitter` 对象添加了超过 `n` 个监听器，则触发警告。默认值为 `10`。\n\
  \n\n\n注意 `check(acc, goal)` 回调的实现与其他有所不同。这说明了如何在事件触发时向监听器传递变量。[图 4.7 显示了执行列表 4.4\
  \ 的结果。\n\n\n01 var events = require('events');\n02 function Account() {\n03 this.balance\
  \ = 0;\n05 this.deposit = function(amount){\n06  this.balance += amount;\n07  this.emit('balanceChanged');\n\
  09���this.withdraw = function(amount){\n11  this.emit('balanceChanged');\n12 };\n\
  13 }\n15 function displayBalance(){\n16  console.log(\"Account balance: $%d\", this.balance);\n\
  17 }\n19 if (this.balance < 0){\n21  }\n22 }\n```\n\n\n\n```javascript\nfunction\
  \ checkGoal(acc, goal){\n  if (acc.balance > goal){\n    console.log(\"Goal Achieved!!!\"\
  );\n  }\nvar account = new Account();\naccount.on(\"balanceChanged\", displayBalance);\n\
  account.on(\"balanceChanged\", checkOverdraw);\n  checkGoal(this, 1000);\n});\n\
  account.deposit(220);\naccount.deposit(320);\naccount.deposit(600);\n```\n\n![Image](img/00029.jpeg)\n\
  图 4.7 `emitter_listener.js` 的输出，显示了监听回调函数输出的账户账单。\n### 实现回调函数\n\n正如你在之前的章节中看到的，Node.js\
  \ 的事件驱动模型高度依赖于回调函数。回调函数起初可能有点难以理解，特别是当你想要跳出基础匿名函数的实现时。本节将了回调的三种特定实现方式：向回调函数传递参数、在循环中处理回调函数参数以及嵌套回调。\n\
  #### 向回调传递额外参数\n大多数回调函数都有自动传递给它们的参数，例如错误对象或结果缓冲区。在使用回调时，一个常见的问题是如何从调用函数向它们传递额外参数。实现此点的方法是在匿名函数中实现该参数，然后使用匿名函数中的参数调用回调。\n\
