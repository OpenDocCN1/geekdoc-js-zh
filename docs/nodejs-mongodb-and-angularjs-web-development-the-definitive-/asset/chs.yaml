  \n### 实现照片视图\n\n现在路由已经设置并配置完成，你准备好实现由路由和 AngularJS 模板渲染的视图。后续章节将讨论由 EJS 渲染的 `photos.html`\
  \ 视图，以及静态静态服务的 `comment.html` 和 `comment_thread.html` 部分组件。\n\n#### 实现照片视图\n\n照片视图如列表\
  \ 27.11 所示，是此示例应用程序的主视图。它在根路由 `/`处加载。视图的头部将 `html` 元素注册到 AngularJS 应用程序中，并加载 `comment_styles.css`\
  \ 文件。`body` 元素分为两个主要部分。\n\n大部分初始化 AngularJS 的 `ng-controller=\"photoController\"\
  ` 以提供与 Web 服务器照片交互的功能，包括对照片的评论。底部初始化 `ng-controller=\"photoController\"` 以提供与网页注释交互的功能。你使用两个控制器来保持范围分离，因为它们都在实现注释部分。\n\
  \n以下代码定义了 AngularJS 模板，使用 `ng-repeat` 指令渲染存储在模型 `$scope.photos` 中的 `Photo` 文档数组：\n\
  \n```html\n<div id=\"photosContainer\">\n  <div class=\"photoItem\" ng-repeat=\"\
  photo in photos\">\n    <img class=\"listPhoto\" ng-click=\"setPhoto(photo._id)\"\
  \n         ng-src=\"../images/{{photo.filename}}\" />\n  </div>\n</div>\n```\n\n\
  请注意 `ng-click` 被设置为控制器代码中的 `setPhoto()` 方法，用设置当前照片。图 27.2 显示了页面上渲染的元素。\n\n图 27.2\
  \ 在浏览器中渲染为 `img` 元素的照片。\n\n以下模板代码通过使用 `photo.title` 显示并使用 `photo.filename` 设置 `img`\
  \ 元素的 `src` 属性，渲染当前的 `$scope.photo` 对象：\n\n```html\n<div id=\"photoContainer\">\n\
  \  <p class=\"imageTitle\">{{photo.title}}</p>\n  <img class=\"mainPhoto\"\n   \
  \    ng-src=\"../images/{{photo.filename}}\" />\n</div>\n```\n\n图 27.3 显示了页面渲染的图像部分。图\
  \ 27.3 在浏览器中渲染的照片和标题放大视图。\n\n你通过使用以下代码添加网页的注释部分，该代码使用 `ng-init` 初始化当前范围内的 `addComment`、`replySubject`\
  \ 和 `replyBody` 的值，然后使用 `ng-include` 包含下节描述的 `comment_thread.html`：\n\n```html\n\
  <div id=\"photoComments\"\n     ng-init=\"addComment=false;replySubject='';replyBody=''\"\
  >\n  <div class=\"comment\"\n       ng-include=\"'static/comment_thread.html'\"\
  >\n  </div>\n</div>\n```\n\n类似的部分被添加到页面的照片部分和底部，允许在两个地方都有注释。你使用 `comment_thread.html`\
  \ 模板中的 `addComment` 值来决定开启或关闭注释。图 27.4 显示了完整的应用程序，照片部分和页面底部都有注释。图 27.4 在照片区域和页面底部带有注释的渲染页面。\n\
