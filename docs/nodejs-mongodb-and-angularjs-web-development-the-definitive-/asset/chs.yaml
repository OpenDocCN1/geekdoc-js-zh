  \nNode.js 中 HTTP 服务的一个常见用途是访问外部系统以获取满足客户端请求的数据。各种外部系统提供的数据可以通过多种方式使用。在本示例中，代码连接到\
  \ [openweathermap.org](http://openweathermap.org) API 以获取有关城市的天气信息。为了保持示例简单，来自 openweathermap.org\
  \ 的输出以原始格式推送到浏览器。在实际情况下，你可能会将需要的数据片段处理成你自己的页面、小部件或数据响应。\n\n代码列表 7.7 显示了一个同时接受 `GET`\
  \ 和 `POST` 请求的 服务的实现。对于 `GET` 请求，将返回一个带有表单的简单网页，允许用户提交城市名称。然后在 `POST` 请求中，将访问城市名称，Node.js\
  \ Web 客户端启动并远程连接到 openweathermap.org 以检索该城市的天气信息。然后将这些信息连同原始 Web 表单一起返回给服务器。\n\n\
  此示例与之前示例的主要区别在于，该 Web 服务器还实现了一个本地 Web 客户端，用于连接到外部服务并获取构建响应的数据。Web 服务器实现在第 35–49\
  \ 行。注意，如果方法是 `POST`，我们将从请求流中读取表单数据，并使用 `querystring.parse()` 获取城市名称并调用 `getWeather()`\
  \ 函数。\n\n第 26–34 行中的 `getWeather()` 函数实现了对 openweathermap.org 的客户端请求。然后，第 17–25\
  \ 行中的 `parseWeather()` 请求处理器读取来自 openweathermap.org 的响应，并将该数据传递给第 4–16 行定义的 `sendResponse()`\
  \ 函数，该函数构建响应并将其返回给客户端。图 7.5 显示了 Web 浏览器中外部服务的实现。\n\n代码列表 7.7 `http_server_external.js`：实现一个\
  \ HTTP Web 服务，该服务远程连接到外部源以获取天气数据。\n\n点击此处查看代码图像\n\n* * *\n\n```\n01 var http = require('http');\n\
  02 var url = require('url');\n03 var qstring = require('querystring');\n04 function\
  \ sendResponse(weatherData, res){\n05   var page = '<html><head><title>External\
  \ Example</title></head>' +\n06     '<body>' +\n07     '<form method=\"post\">'\
  \ +\n08     'City: <input name=\"city\"><br>' +\n09     '<input type=\"submit\"\
