  \ 和 AngularJS Web 应用程序栈实现基础购物车的过程。你在 `Mongoose` 中定义了一个健壮的模型来支持客户、产品和订单——即整个结算流程。\n\
  \n此外，在本章中你还领略了在 AngularJS 中轻松切换 HTML 模板视图，同时让所有数据自动绑定到页面上的好处。你还在本章中看到了数据绑定的价值：你只需要通过简单的函数调用即可更新\
  \ MongoDB 数据库，因为当你向购物车中添加物品以及更改运输和账单信息时，`$scope` 数据始终保持最新状态。\n\n### 下一步预告\n\n在下一章中，你将学习一些富交互互联网应用（RIA）的概念。\n\
  \n## 29. 构建交互式 Web 2.0 组件\n\n本章将为你提供实现 Web 2.0 组件的实践经验。`Web 2.0` 和 `富交互互联网应用`（`RIAs`）这些术语已经存在一段时间，并且有许多解释。维基百科上的开头陈述得很好：“Web\
  \ 2.0 描述的是使用比早期网站静态页面技术的网站。”Node.js-to-AngularJS 栈非常符合这个定义，因为可以很容易地在服务器和客户端集成相互作用的服务，而无需在浏览器中反复刷新页面。\n\
  \n本章将带你通过实现标签页视图、天气小组件、可拖拽组件和交互式表格数据的过程，让你领略 Web 2.0 和 RIA 组件的光样貌。本章中的项目足够简单，易于遵循，但应该能为你如何利用\
  \ Node.js-to-AngularJS 栈实现 Web 2.0 和 RIA 应用提供一些很好的思路。\n\n## 项目描述\n\n本章的项目将带你完成实现标签页视图、天气服务、可拖拽组件和交互式表格数据的过程。这些组件使用了不同类型的组件交互：\n\
  \n- 标签视图允许你轻松集成隐藏的标签视图，同时让用户能够以直观的方式快速访问这些视图。\n- 天气小组件连接到后端远程服务以获取天气信息。这让你看到如何在后端实现支持前端视图的后端服务。\n\
  - 可拖拽视图是一个包含图像和文本元素的基础页面，你可以对其进行拖拽和定位。它说明了标准 Web 元素之外交互的概念。\n- 表格视图为第 13-16 章中使用的数据库实现了一个前端。它允许你在不重新加载页的情况下对结果进行排序、过滤和分页。这说明了表格数据如何具有交互性。\n\
  \n## 使用的库\n\n本章项目使用了以下 Node.js NPM 插件。你需要在项目目录中安装它们以便跟进代码：\n\n- `express`：作为项目的主\
  \ Web 服务器。\n- `body-parser`：为 POST 请求提供 JSON 支持。\n- `ejs`：用于渲染 HTML 模板。\n- `mongodb`：用于访问\
  \ MongoDB 数据库。\n- `mongoose`：用于提供结构化数据模型。\n\n本章代码还要求你拥有 `AngularJS` 库。\n\n### 项目结构\n\
  \n项目按以下目录结构组织：\n\n- `.`：包含基础应用程序文件和支持文件夹。这是项目根目录。\n- `./npm_modules`：当系统中安装了上述 NPM\
  \ 包时创建。\n- `./controllers`：包含 Express 路由控制器，提供路由之间的交互以及 MongoDB 数据库的更改。\n- `./models`：包含数据库中对象的\
  \ Mongoose 模型定义。\n- `./static`：包含需要发送的静态文件，例如 CSS 和 AngularJS 代码。\n- `./views`：包含由\
  \ `EJS` 渲染的 HTML 模板。\n- `../images`：包含项目的任何图像。它与项目处于同一层级，以便多个项目可以使用相同的图像。\n- `../lib`：包含\
  \ AngularJS 库，以便多个项目可以本地加载它们。在生产环境中，你可能希望使用 CDN 分发地址。\n\n### 注意事项\n\n这只是组织代码的方法之一。你不必遵循这个目录结构，但请记住，目录结构应该是项目整体设计的一部分，以便你能够轻松找到正在查找的代码。\n\
  \n除了目录结构外，还包含了以下代码文件。此列表旨在让你对每个文件的功能有一个大致了解：\n\n- `./word_init.js`：提供独立的初始化代码，为表格视图生成单词数据库。你需要运行它来测试表格视图。\n\
  - `./rich_ui_server.js`：加载必要的库，创建到 MongoDB 的连接并启动 Express 服务器。这是主应用程序文件。\n- `./rich_ui_routes.js`：定义\
  \ Express 服务器的路由。此文件处理不与数据库交互的功能。\n- `./controllers/weather_controller.js`：定义访问远程天气服务的路由功能。\n\
  - `./controllers/words_controller.js`：定义需要与 MongoDB 数据库交互以获取单词对象的路由功能。\n- `./models/word_model.js`：定义用于表格示例的单词对象结构。\n\
  - `./views/rich_ui.html`：提供实现标签页元素以支持其他视图。\n- `./static/rich_tabs.html`：作为多个标签视图的容器对象。这是一个\
  \ AngularJS 部分模板。\n- `./static/rich_pane.html`：存放单个标签视图。这是一个 AngularJS 部分模板。\n-\
  \ `./static/draggable.html`：实现可拖拽示例视图。这是一个 AngularJS 部分模板。\n- `./static/tables.html`：实现交互式表格视图。这是一个\
  \ AngularJS 部分模板。\n- `./static/weather.html`：实现简单的天气小组件。这是一个 AngularJS 部分模板。\n-\
  \ `./static/js/rich_ui_app.js`：提供处理所有示例代码的 AngularJS 和控制器定义。\n- `./static/css/draggable_styles.css`：为可拖拽的\
  \ AngularJS HTML 部分提供 CSS 样式。\n\n\n\n\n\n![Image](img/00003.jpeg) `./static/css/rich_ui_styles.css`:\
