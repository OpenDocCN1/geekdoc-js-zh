  \ 聚合文档\n\n`Model` 对象提供了 `aggregate()` 方法，允许你实现第 15 章中讨论的聚合管道。如果你还没有读过第 15 章中的聚合信息，你应该在阅读本节之前阅读它。它在这里的工作方式与\
  \ MongoDB Node.js 原生驱动非常相似。事实上，如果你愿意，可以使用完全相同的语法。你还可以选择使用 Mongoose `Aggregate` 对象来构建并执行聚合管道。\n\
  \n`Aggregate` 对象的工作方式与 `Query` 对象非常相似，如果你传递了一个回调函数，`aggregate()` 将立即执行；否则，将返回一个\
  \ `Aggregate` 对象，你可以应用管道方法。\n\n例如，以下代码立即调用了 `aggregate()` 方法：\n\n点击此处查看代码图片\n\n\
  ```javascript\nmodel.aggregate([{$match:{value:15}}, {$group:{_id:\"$name\"}}],\n\
  \  function(err, results) {});\n```\n\n你也可以通过使用 `Aggregate` 对象的实例来流水聚合操作。例如：\n\n\
  点击此处查看代码图片\n\n```javascript\nvar aggregate = model.aggregate();\naggregate.match({value:15});\n\
  aggregate.group({_id:\"$name\"});\naggregate.exec();\n```\n\n\n\n\n\n表 16.6 描述了可以在\
  \ `Aggregate` 对象上调用的方法。\n\n![Image](img/00202.jpeg)\n\n表 16.6 Mongoose 中 `Aggregate`\
  \ 对象的管道线方法\n\n列表 16.10 展示了 Mongoose 中聚合的三个示例。第一个示例（第 9–19 行）以原生驱动程序的方式实现聚合，但使用的是\
  \ `Model` 对象。聚合结果集是以元音开头的单词中最大的单词长度和最小的单词长度。\n\n下一个示例（第 20–27 行）通过创建一个 `Aggregate`\
  \ 对象并使用 `match()`、`append()` 和 `limit()` 方法向其添加操作来实现来实现聚合。结果是五个四个字母单词的统计数据。\n\n\
  最后一个示例（第 28–35 行）使用 `group()`、`sort()` 和 `limit()` 方法构建聚合管道线，结果是平均单词长度最大的前五个字母。图\
  \ 16.10 显示了 列表 16.10 中代码的输出。\n\n列表 16.10 `mongoose_aggregate.js`: 使用 Mongoose 从集合中的文档聚合数据\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var mongoose = require('mongoose');\n02 var db\
  \ = mongoose.connect('mongodb://localhost/words');\n03 var wordSchema = require('./word_schema.js').wordSchema;\n\
  04 var Words = mongoose.model('Words', wordSchema);\n05 setTimeout(function(){\n\
  06   mongoose.disconnect();\n07 }, 3000);\n08 mongoose.connection.once('open', function(){\n\
  09   Words.aggregate([{$match: {first:{$in:['a','e','i','o','u']}}},\n10       \
  \                      {$group: {_id:\"$first\",\n11                           \
  \       largest:{$max:\"$size\"},\n12                                  smallest:{$min:\"\
  $size\"},\n13                                  total:{$sum:1}}},\n14           \
  \                  {$sort: {_id:1}}],\n15   function(err, results){\n16     console.log(\"\
  \\nLargest and smallest word sizes for \" +\n17                       \"words beginning\
  \ with a vowel: \");\n18     console.log(results);\n19   });\n20   var aggregate\
  \ = Words.aggregate();\n21   aggregate.match({size:4});\n22   aggregate.limit(5);\n\
  23   aggregate.append({$project: {_id:\"$word\", stats:1}});\n24   aggregate.exec(function(err,\
  \ results){\n25     console.log(\"\\nStats for 5 four letter words: \");\n26   \
  \  console.log(results);\n27   });\n28   var aggregate = Words.aggregate();\n29\
  \   aggregate.group({_id:\"$first\", average:{$avg:\"$size\"}});\n30   aggregate.sort('-average');\n\
  31   aggregate.limit(5);\n32   aggregate.exec( function(err, results){\n33     console.log(\"\
  \\nLetters with largest average word size: \");\n34     console.log(results);\n\
  35   });\n36 });\n```\n\n![Image](img/00203.jpeg)\n图 16.10 使用 Mongoose 从集合中的文档聚合数据。\n\
  \n## 使用验证框架\n\n`mongoose` 模块最重要的方面之一是针对定义模型进行验证。Mongoose 提供了一个内置的验证框架，你只需要在需要验证的特定字段上定义验证函数即可。当你尝试创建新文档实例、读取文档或保存文档时，验证框架会调用你的验证方法，并在验证失败时返回错误。\n\
  \n验证框架的实现实际上非常简单。你可以在 `Model` 对象上想要应用验证的特定路径上调用 `validate()` 方法，传入一个验证函数。验证函数接受字段的值，然后根据该值是否有效返回\
  \ `true` 或 `false`。`validate()` 方法的第二个参数是一个 `error` 字符串，如果验证失败，该字符串将应用于错误对象。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nWords.schema.path('word').validate(function(value){\n\
  \  return value.length < 20;\n}, \"Word is Big\");\n```\n\n验证抛出的错误对象具有以下字段：\n- `errors.field.message`:\
  \ 在验证函数中定义的字符串\n- `errors.field.type`: 验证错误的类型\n- `errors.field.path`: 对象中失败的路径\n\
  - `errors.field.value`: 失败的值\n- `error.name`: 错误类型\n- `err.message`: 错误消息\n\n列表\
  \ 16.11 显示了在单词模型中添加验证的简单示例，其中长度为 0 或大于 20 的单词是无效的。注意，当在第 18 行保存 `newWord` 时，错误会被传递给\
  \ `save()` 函数。第 12–26 行显示了错误的各个部分的值，如 图 16.11 所示。\n\n列表 16.11 `mongoose_aggregate.js`:\
  \ 使用 Mongoose 在模型中实现验证\n\n点击此处查看代码图片\n\n```javascript\n01 var mongoose = require('mongoose');\n\
  02 var db = mongoose.connect('mongodb://localhost/words');\n03 var wordSchema =\
  \ require('./word_schema.js').wordSchema;\n04 var Words = mongoose.model('Words',\
  \ wordSchema);\n05 setTimeout(function(){\n06   mongoose.disconnect();\n07 }, 3000);\n\
  08 mongoose.connection.once('open', function(){\n09   Words.aggregate([{$match:\
  \ {first:{$in:['a','e','i','o','u']}}},\n10                             {$group:\
  \ {_id:\"$first\",\n11                                  largest:{$max:\"$size\"\
  },\n12                                  smallest:{$min:\"$size\"},\n13         \
  \                         total:{$sum:1}}},\n14                             {$sort:\
  \ {_id:1}}],\n15   function(err, results){\n16     console.log(\"\\nLargest and\
  \ smallest word sizes for \" +\n17                       \"words beginning with\
  \ a vowel: \");\n18     console.log(results);\n19   });\n20   var aggregate = Words.aggregate();\n\
  21   aggregate.match({size:4});\n22   aggregate.limit(5);\n23   aggregate.append({$project:\
  \ {_id:\"$word\", stats:1}});\n24   aggregate.exec(function(err, results){\n25 \
  \    console.log(\"\\nStats for 5 four letter words: \");\n26     console.log(results);\n\
  27   });\n28   var aggregate = Words.aggregate();\n29   aggregate.group({_id:\"\
  $first\", average:{$avg:\"$size\"}});\n30   aggregate.sort('-average');\n31   aggregate.limit(5);\n\
  32   aggregate.exec( function(err, results){\n33     console.log(\"\\nLetters with\
  \ largest average word size: \");\n34     console.log(results);\n35   });\n36 });\n\
  ```\n\n*(注：由于提供的原文文本中存在部分重复和错乱（如列表 16.11 的描述和代码位置异常），译文已根据上下文逻辑进行了整理对齐，确保逻辑通顺。)*\n\
  \n## 实现中间件函数\n\nMongoose 提供了一个中间件框架，其中 `pre` 和 `post` 函数会在 `Document` 对象的 `init()`、`validate()`、`save()`\
  \ 和 `remove()` 方法之前和之后调用。中间件允许你在特定步骤之前之后实现功能。例如，在使用在本节定义的模型创建单词文档时，你可能希望自动将大小设置为单词字段的长度，如下面的\
  \ `pre save()` 中间件所示：\n\n点击此处查看代码图片\n\n```javascript\nWords.schema.pre('save', function\
  \ (next) {\n  console.log('%s is about to be saved', this.word);\n  console.log('Setting\
  \ size to %d', this.word.length);\n  this.size = this.word.length;\n  next();\n\
  });\n```\n\n中间件函数有两种类型——`pre` 和 `post` 函数，它们的处理方式略有不同。`pre` 函数接收一个 `next` 参数，它是要执行的下一个中间件函数。`pre`\
  \ 函数可以异步或同步调用。在异步方法的情况下，会向 `pre` 函数传递一个额外的 `done` 参数，以便通知异步框架你已完成。如果你在中间件中应用按顺序执行的操作，则应该使用同步方法。\n\
  \n\n\n\n\n点击此处查看代码图片\n\n```javascript\nshchema.pre('save', function(next)){\n  next();\n\
  });\n```\n\n若要异步应用中间件，请向 `pre()` 方法添加一个 `true` 参数以表示异步行为，然后在中间件函数内部调用 `doAsyn(done)`。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nshchema.pre('save', true, function(next, done)){\n\
  \  next();\n  doAsync(done);\n});\n```\n\n你在 `init`、`validate`、`save` 或 `remove`\
  \ 操作处理完成后调用 `post` 中间件函数。这允许你在执行该操作时完成任何必要的清理工作。例如，下面的代码实现了一个简单的 `post` 保存方法，用于记录对象已保存：\n\
  \n点击此处查看代码图片\n\n```javascript\nschema.post('save', function(doc){\n  console.log(\"\
  Document Saved: \" + doc.toString());\n});\n```\n\n列表 16.12 展示了为文档生命周期每个阶段实现中间件的过程。请注意，`validate`\
  \ 和 `save` 中间件函数在保存文档时执行。当你使用 `findOne()` 从 MongoDB 检索文档时，你会执行 `init` 中间件函数。当你使用\
  \ `remove()` 从 MongoDB 删除文档时，你会执行 `remove` 中间件函数。\n\n另请注意，除了 `pre init` 之外，你可以在所有中间件函数中使用\
  \ `this` 关键字来访问 `Document` 对象。在 `pre init` 的情况下，你还没有从数据库获取到文档。图 16.12 显示了列表 16.12\
  \ 中代码的输出。\n\n#### 列表 16.12 `mongoose_middleware.js`: 使用 Mongoose 对模型应用中间件框架\n\n\
  点击此处查看代码图片\n\n***\n\n```javascript\n01 var mongoose = require('mongoose');\n02 var\
  \ db = mongoose.connect('mongodb://localhost/words');\n03 var wordSchema = require('./word_schema.js').wordSchema;\n\
  04 var Words = mongoose.model('Words', wordSchema);\n05 Words.schema.pre('init',\
  \ function (next) {\n06   console.log('a new word is about to be initialized from\
  \ the db');\n07   next();\n08 });\n09 Words.schema.pre('validate', function (next)\
  \ {\n10   console.log('%s is about to be validated', this.word);\n11   next();\n\
  12 });\n13 Words.schema.pre('save', function (next) {\n14   console.log('%s is about\
  \ to be saved', this.word);\n15   console.log('Setting size to %d', this.word.length);\n\
  16   this.size = this.word.length;\n17   next();\n18 });\n19 Words.schema.pre('remove',\
  \ function (next) {\n20   console.log('%s is about to be removed', this.word);\n\
  21   next();\n22 });\n23 Words.schema.post('init', function (doc) {\n24   console.log('%s\
  \ has been initialized from the db', doc.word);\n25 });\n26 Words.schema.post('validate',\
  \ function (doc) {\n27   console.log('%s has been validated', doc.word);\n28 });\n\
  29 Words.schema.post('save', function (doc) {\n30   console.log('%s has been saved',\
  \ doc.word);\n31 });\n32 Words.schema.post('remove', function (doc) {\n33   console.log('%s\
  \ has been removed', doc.word);\n34 });\n35 mongoose.connection.once('open', function(){\n\
  36   var newWord = new Words({\n37     word:'newword',\n38     first:'t',\n39  \
  \   last:'d',\n40     size:'newword'.length,\n41   });\n42   console.log(\"\\nSaving:\
  \ \");\n43   newWord.save(function (err){\n44     console.log(\"\\nFinding: \");\n\
  45     Words.findOne({word:'newword'}, function(err, doc){\n46       console.log(\"\
  \\nRemoving: \");\n47       doc.remove(function(err){\n48         console.log(\"\
  \\nDone.\");\n49       });\n50     });\n51   });\n52 });\n53 }); \n```\n\n***\n\n\
  ![Image](img/00205.jpg) 图 16.12\n\n## 总结\n本章介绍了中间件，你已经学习了 `pre`、`post`、`init`、`validate`、`save`\
  \ 和 `remove` 钩子。\n\n### 下节\n在下一章中深入探讨一些高级主题，例如副本集和分片。\n\n## 17. 高级概念\n\n## 添加索引\n\
  MongoDB 允许你对字段建立索引以便更快地找到数据。当你添加索引时，会创建一个特殊的结构来优化数据。例如，`_id` 索引允许你查找对象。\n\n![Image](img/00003.jpg)\n\
  \n如果你希望按 `_id` 对文档进行排序，该排序已经在索引上完成了。最棒的是，如果你只需要 `_id` 值的列表，MongoDB 甚至不需要读取文档；可以直接返回这些值。\n\
  \n然而，你需要记住，这些好处是有代价的。以下是与索引相关的一些代价：\n\n* 索引会占用磁盘和内存空间。\n* 在插入和更新文档时，索引会消耗处理时间。因此，对具有大量索引的集合进行数据库写入可能会受到影响。\n\
  * 集合越大，资源和性能方面的成本就越高。对于极大的集合，应用某些索引是不切行的。\n\n多种不同类型的索引可以应用于集合的字段上，以支持不同的设计需求。表格\
  \ 17.1 列出了不同的索引类型。\n\n![Image](img/00206.jpg) ![Image](img/00207.jpg)\n\n表格 17.1\
  \ **MongoDB 支持的索引类型**\n\n你可以为索引设置特殊属性以定义 MongoDB 如何处理索引：\n\n* **unique**（唯一）：此属性强制索引仅包含每个字段值的一个实例，因此\
  \ MongoDB 将拒绝向索引中添加具有已重复值的文档。\n* **sparse**（稀疏）：此属性确保索引仅包含具有索引字段的文档条目。索引将跳过没有索引字段的文档。\n\
  \n\n\n\n\n![Image](img/00003.jpeg) TTL：`TTL`（即生存时间，time-to-live）索引允许文档在索引中仅存在特定一段时间（例如，在一段时间后应清理的日志条目或事件数据）。索引会跟踪插入时间，并在过期后删除最早的项。\n\
  \n你可以结合 `unique` 和 `sparse` 属性，使得索引会拒绝索引字段字段具有重复值的文档，并拒绝不包含被索引字段的文档。\n\n你可以从 MongoDB\
  \ shell、MongoDB Node.js 原生客户端或 Mongoose 创建索引。要在 MongoDB shell 中创建索引，你使用 `ensureIndex(index,\
  \ properties)` 方法。例如：\n\n点击此处查看代码图片\n\n```\ndb.myCollection.ensureIndex({name:1},\
  \ {background:true, unique:true, sparse: true})\n```\n\n`background` 选项指定创建索引的操作是在\
  \ shell 的前台还是后台进行。在前台运行完成速度更快，但会占用更多的系统资源——因此在生产系统的峰值期间这样做并不是个好主意。\n\n要从 MongoDB\
  \ Node.js 原生驱动创建索引，你可以在 `Db` 对象的实例上调用 `ensureIndex(collection, index, options, callback)`\
  \ 方法。例如：\n\n点击此处查看代码图片\n\n```\nvar MongoClient = require('mongodb').MongoClient;\n\
  \nMongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n  db.ensureIndex('myCollection',\
  \ {name: 1},\n                 {background: true, unique: true, sparse: true},\n\
  \                 function(err){\n    if(!err) console.log(\"Index Created\");\n\
  \  });\n});\n```\n\n要使用 Mongoose 中的 `Schema` 对象创建索引，你可以在 schema 中的字段上设置索引选项。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar s = new Schema({ name: { type: String, index:\
  \ true, unique: true, sparse: true});\n```\n\n你也可以以后通过 `index()` 方法将索引添加到到 `Schema`\
  \ 对象中。例如：\n\n点击此处查看代码图片\n\n```javascript\ns.schema.path.('some.path').index({unique:\
  \ true, sparse: true});\n```\n\n### 使用固定大小集合 (Capped Collections)\n\n固定集合是固定大小的集合，根据插入顺序插入、检索和删除文档。固定集合可以支持高吞吐量操作。固定集合的工作方式类似于循环缓冲区，因为一旦集合填满了分配的空间，它就会通过覆盖集合中最旧的文档为新文档腾出空间。\n\
  \n固定集合也可以根据最大文档数量进行限制。这对于减少在集合中存储大量文档时可能产生的索引开销非常有用。\n\n固定集合对于轮转事件日志或缓存数据非常有用，因为你不需要担心在应用程序中实现清理集合的代码开销和工作。\n\
  \n要在 MongoDB shell 中创建固定集合，你使用 `Db` 对象的 `createCollection()` 方法，指定 `capped` 属性，并设置大小（以字节）以及可选的最大文档数量。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\ndb.createCollection(\"log\", { capped : true, size\
  \ : 5242880, max : 5000 } )\n```\n\n通过 MongoDB Node.js 原生驱动，你也可以在 `db.createCollection()`\
  \ 方法中指定固定集合，该方法在第 13 章中描述。例如：\n\n点击此处查看代码图片\n\n```javascript\ndb.createCollection(\"\
  newCollection\", { capped : true, size : 5242880, max : 5000 }\n               \
  \    function(err, collection){ });\n```\n\n通过 Mongoose，你可以在 `Schema` 对象的选项中定义集合为固定的。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar s = new Schema({ name:String, value:Number},\n\
  \                   { capped : true, size : 5242880, max : 5000});\n```\n\n### 应用复制\
  \ (Replication)\n\n高性能数据库最关键的方面之一是复制。复制是定义多个具有相同数据的 MongoDB 服务器的过程。副本集中的 MongoDB\
  \ 服务器将是三种类型之一，如图 17.1 所示：\n\n![Image](img/00003.jpeg) 主节点 (Primary)：主服务器是副本集中唯一可以写入的服务器。通过这种方式，主服务器可以确保写操作期间的数据完整性。一个副本集只能有一个主服务器。\n\
  \n![Image](img/00003.jpeg) 从节点 (Secondary)：从服务器包含主服务器数据的副本。为了确保数据的准确性，副本服务器会应用来自主服务器的操作日志或操作日志（oplog），确保主服务器上的每次写入操作都在从服务器上执行，且顺序相同。客户端可以从从服务器读取数据，但不能向其写入。\n\
  \n![Image](img/00003.jpeg) 仲裁节点 (Arbiter)：仲裁服务器非常有意思。它不包含数据的副本，但在主服务器出现问题时，可以用于选举新的主服务器。当主服务器故障时，故障会被检测到，副本集中的其他服务器将通过服务器之间的心跳协议选举出新的主服务器。\n\
  \n\n\n\n你还应该考虑数据。在某些情况下，将数据拆分为多个副本集（每个集合包含数据的不同部分）会更有意义。这允许你对每个集合中的服务器进行微调，以满足数据和性能需求。只有当数据之间没有相关性时（即访问数据的客户端很少需要同时连接到两个副本集）——你才应该考虑这一点。\n\
  \n### 容错性\n\n容错性对你的应用程序有多重要？你的主服务器宕机可能很罕见。如果主服务器宕机不会太严重影响你的应用程序，且数据可以很容易重建，那么你可能不需要复制。然而，如果你向客户承诺“七九”（seven-9s）可用性，那么任何停机都是极其糟糕的，长时间停机是不可接受的。在这种情况下，向副本集中添加服务器以确保可用性更有意义。\n\
  \n你可能还会考虑将一个备服务器放在备用数据中心，以便在整个数据中心故障时提供支持。但是，出于性能考虑，你应该将大多数备服务器保留在主数据中心。\n\n####\
  \ 注意\n\n如果你关注容错性，还应该像第 12 章描述的那样启用日志功能（journaling）。当你这样做时，即使数据中心断电，事务也可以被重放。\n\n\
  ### 部署副本集\n\n在 MongoDB 中实现副本集非常简单。以下步骤将引导你完成准备和部署副本集的过程：\n\n1. 确保副本集中的所有成员都能通过 DNS\
  \ 或主机名相互访问。为副本服务器添加通信的虚拟私有网络（VPN）将提高系统性能，因为复制过程不受网络上其他流量的影响。如果服务器不在 DMZ（解密区）之后以确保数据通信安全，那么你还应该为服务器通信配置\
  \ `auth` 和 `kwFile` 以确保安全。\n\n2. 配置 `replSet` 值，这是在 `mongodb.conf` 文件中或通过你的命令行中，为副本集中的每个服务器设置的副本集唯一名称。例如：\n\
  \n点击此处查看代码图像\n\n```\nmongod --port 27017 --dbpath /srv/mongodb/db0 --replSet rs0\n\
  ```\n\n3. 使用 `mongo` 命令启动 MongoDB 客户端，并在副本集中的每个服务器上执行以下命令以启动副本集操作：\n\n```\nrs.initiate()\n\
  ```\n\n4. 使用 MongoDB shell 连接到将作为主节点的 MongoDB 服务器，并为每个备用主机执行以下命令：\n\n点击此处查看代码图像\n\
  \n```\nrs.add(<secondary_host_name_or_dns>)\n```\n\n5. 使用以下命令查看每个服务器上的配置：\n\n```\n\
  rs.conf()\n```\n\n6. 在你的应用程序内部，定义从副本集读取数据的偏好（read preference）。如前面的章节所述，你通过将偏好设置为\
  \ `primary`、`primaryPreferred`、`secondary`、`secondaryPreferred` 或 `nearest` 来实现此。\n\
  \n### 实现分片\n\n许多大型应用程序面临的一个严重问题是，存储在 MongoDB 中的数据如此巨大，以至于严重影响性能。当单个数据集合变得过大时，索引可能会导致严重的性能下降，磁盘上的数据量可能会导致系统性能下降，来自客户端的请求数量可能会让服务器迅速不堪不堪。应用程序读写数据库的速度将变得越来越慢。\n\
  \nMongoDB 通过分片解决了这个问题。*分片（Sharding）*是将文档存储在运行不同机器的多个 MongoDB 服务器上的过程。这允许 MongoDB\
  \ 数据库进行水平扩展。你添加的 MongoDB 服务器越多，应用程序能够支持的文档数量就越大。图 17.3 说明了分片的概念；从应用程序的角度来看，有一个单一集合，但实际上有四个\
  \ MongoDB 分片服务器，每个服务器都包含集合中的部分文档。\n\n![Image](img/00210.jpeg)\n\n图 17.3 从应用程序的角度来看，只有一个集合可以访问。然而，该集合的文档被分分在多个\
  \ MongoDB 分片服务器上。\n\n### 分片服务器类型\n\n分片数据涉及三种类型的 MongoDB 服务器。这些服务器中的每一种在向应用程序提供单一视图方面发挥着特定的作用。以下是服务器类型，图\
  \ 17.4 说明了它们之间的交互作用：\n\n![Image](img/00003.jpeg) **分片（Shard）：** 分片存储构成集合的文档。分片可以是一个独立的服务器，但为了在生产环境中提供高可用性和数据一致性，你应该考虑使用提供分片主副本和备副本的副本集。\n\
  \n![Image](img/00003.jpeg) **查询路由器（Query router）：** 查询路由器运行 `mongos` 实例。查询路由器为客户端应用程序提供了与集合交互的接口，并掩盖了数据实际上是分片的事实。查询路由器处理请求，向分片发送定向操作，然后将分片的响应合并成单个响应返回给客户端。分片集群可以包含多个查询路由器，这是负载大量客户端请求的极佳方法。\n\
  \n![Image](img/00003.jpeg) **配置服务器（Config server）：** 配置服务器存储有关分片集群的元数据，这些元数据包含集群数据集到分片的映射。查询路由器在针对特定分片时使用这些元数据。生产分片集群应具有三个配置服务器。\n\
  \n![Image](img/0211.jpeg)\n\n图 17.4 查询路由器接收 MongoDB 客户端的请求，然后与各个分片服务器通信。\n\n###\
  \ 选择分片键\n\n分片大型集合的第一步是确定一个分片键，用于确定哪些文档应该存储在哪个分片中。分片键是一个索引字段或索引复合字段，必须包含在集合中的每个文档。MongoDB\
  \ 使用分片键的值将集合划分到各个分之间。\n\n选择良好的分片键对于获得所需的 MongoDB 性能至关重要。糟糕的键会严重影响系统性能，而良好的键可以提高性能并确保未来的扩展性。如果文档中不存在良好的键，你可能希望添加一个专门作为分片键的字段。\n\
  \n选择分片键时，你应该考虑以下因素：\n\n![Image](img/00003.jpeg) **易于划分：** 分片键需要易于划分为块。\n\n![Image](img/00003.jpeg)\
  \ **随机性：** 在使用基于范围的分片时，随机键可以确保文档分布更均匀，避免某一个服务器过载。\n\n![Image](img/00003.jpeg) **复合键：**\
  \ 尽可能使用单字段进行分片。然而，如果不存在良好的单字段键，使用良好的复合字段获得的性能仍比使用糟糕的单字段键更好。\n\n![Image](img/00003.jpeg)\
  \ **基数（Cardinality）：** 基数定义了字段值的唯一性。如果一个字段非常独特，则该字段具有高基数（例如，百万人的社会安全号码）。如果一个字段通常不独特，则它具有低基数（例如，百万人的眼睛颜色）。通常具有高基数的字段提供了更好的分片选项。\n\
  \n\n\n\n\n![Image](img/00003.jpeg) **查询目标：** 你应该花一点时间查看应用程序中必要的查询。如果数据可以从集群中的单个分片（shard）中收集，查询的性能会更好。如果你能让分片键（shard\
  \ key）匹配最常见的查询参数，只要所有查询不是指向同一个字段值，你就能获得更好的性能（例如，当所有的查询都是基于邮政编码查找用户时，根据用户的邮政编码对文档排序，因为给定邮政编码的用户将存在于同一个分片服务器上）。如果你的查询在邮政编码之间分布较为均匀，那么使用邮编键是一个好主意。然而，如果你大多数查询集中在少数几个邮编上，那么使用邮编键就是一个坏主意。\n\
  \n为了说明分片键，请考虑以下键：\n\n![Image](img/00003.jpeg) **`{ \"zipcode\": 1}`：** 该分片键根据 `zipcode`\
  \ 字段的值分布文档。这意味着所有基于特定 `zipcode` 的查找都将指向单个分片服务器。\n\n![Image](img/00003.jpeg) **`{\
  \ \"zipcode\": 1, \"city\": 1 }`：** 该分片键首先根据 `zipcode` 字段的值分布文档。如果某些文档具有相同的 `zipcode`\
  \ 值，则可以根据 `city` 字段的值将其拆分到其他分片。这意味着你不再保证对单个 `zipcode` 值的查询只会命中一个分片。然而，基于 `zipcode`\
  \ 和 `city` 的查询将去往同一个分片。\n\n![Image](img/00003.jpeg) **`{ \"_id\": \"hashed\" }`：**\
  \ 该分片键根据 `_id` 字段值的哈希值分布文档。这确保了集群中所有分片之间的分布更加均匀。然而，这使得无法针对查询查询使其仅命中单个分片服务器。\n\n\
  ## 选择分区方法\n\n对大型集合进行分片的下一步是决定如何根据分片键对文档进行分区。你可以使用两种方法根据分片键的值将文档分布到不同的分片。使用哪种方法取决于你选择的分片键类型：\n\
  \n![Image](img/00003.jpeg) **基于范围的分片 (Range-based sharding)：** 一种方法是根据分片键的值将数据集划分为特定范围。这种方法对于数值型分片键效果良好。例如，如果你有一个产品集合，每个产品都有一个从\
  \ 1 到 1,000,000 的特定产品 ID，你可以按照 1–250,000；250,001–500,000 等范围对产品进行分片。\n\n![Image](img/00003.jpeg)\
  \ **基于哈希的分片 (Hash-based sharding)：** 另一种方法是使用哈希函数计算字段值以创建数据块（chunks）。哈希函数应确保值非常接近的分片键落到不同的分片中，以确保良好的分布。\n\
  \n选择一个能够将文档尽可能均匀地分布到各个分片上的分片键和分布方法至关重要。否则，一台服务器最终会过载，而另一台服务器则相对闲置。\n\n基于范围的分片的优势是它通常非常容易定义和实现。此外，如果你的查询通常也是基于范围的，它的性能会比基于哈希的分片更好。然而，除非你提前拥有所有数据且分片键值在未来不会更改，否则很难通过基于范围的分片获得均匀分布。\n\
  \n基于哈希的分片方法对数据有更高的要求，但通常提供了分片的最佳整体处理方法，因为它确保了更加均匀的分布。\n\n在集合上启用分片时使用的索引决定了将使用哪种分区方法。如果你有一个基于值的索引，MongoDB\
  \ 将使用基于范围的分片。例如，以下代码在文档的 `zip` 和 `name` 字段上实现了一个基于范围的分片：\n\n点击此处查看代码图片\n\n```\n\
  db.myDB.myCollection.ensureIndex({\"zip\": 1, \"name\":1})\n```\n\n要使用基于哈希的方法进行分片，你需要使用哈希方法定义索引，如示例所示：\n\
  \n点击此处查看代码图片\n\n```\ndb.myDB.myCollection.ensureIndex({\"name\":\"hash\"})\n```\n\
  \n## 部署分片 MongoDB 集群\n\n部署分片 MongoDB 集群的过程涉及几个步骤，用于设置不同类型的服务器，然后配置数据库和集合。要部署分片 MongoDB\
  \ 集群，你需要遵循以下基本步骤：\n\n1. 创建配置服务器数据库实例。\n2. 启动查询路由服务器。\n3. 将分片添加到集群中。\n4. 在数据库上启用分片。\n\
  5. 在集合上启用分片。\n6. 设置分片标签范围（shard tag ranges）。\n\n以下章节将更详细地描述这些步骤。\n\n> **警告**\n>\
  \ 分片集群的所有成员都必须能够连接到分片集群的所有其他成员，包括所有的分片和所有的配置服务器。确保你的网络和安全系统（包括所有接口和防火墙）允许这些连接。\n\
  \n### 创建配置服务器数据库实例 (mongod)\n\n配置服务器进程仅仅是存储集群元数据的 `mongod` 实例。每个配置服务器都存储集群元数据的完整副本。在生产环境中，必须部署三个运行在不同服务器上的配置服务器实例，以确保高可用性和数据完整性。\n\
  \n要实现配置服务器，需要在每个节点上执行以下步骤：\n\n1. 创建存储配置数据的目录。\n2. 通过传递步骤 1 创建的目录路径来启动配置服务器，并包含 `--configsvr`\
  \ 选项以表明这是一个配置服务器。例如：\n\n点击此处查看代码图片\n\n```\nmongod --configsvr --dbpath <path>\n\
  ```\n\n3. `mongod` 启动后，配置服务器就绪绪。默认端口为 27019。\n\n### 启动查询路由服务器 (mongos)\n\n查询路由 (`mongos`)\
  \ 服务器不需要目录，因为配置存储在配置服务器上。`mongos` 服务器非常轻量，因此在运行应用程序的系统上部署 `mongos` 实例是可以接受的。\n\n\
  你可以创建多个 `mongos` 服务器实例来路由分片集群。然而，为了确保高可用，你不希望这些实例运行在同一个系统上。\n\n要启动 `mongos` 服务器实例，你需要传递\
  \ `--configdb` 参数，列出你想要用于集群的配置服务器 DNS 名称/主机名。例如：\n\n点击此处查看代码图片\n\n```\nmongos --configdb\
  \ c1.test.net:27019,c2.test.net:27019,c3.test.net:27019\n```\n\n默认情况下，`mongos` 实例运行在端口\
  \ 27017。不过，你也可以通过 `--port <port>` 命令行配置不同的端口地址。\n\n> **提示**\n> 为了避免停机，请为每个配置服务器分配逻辑\
  \ DNS 名称（与服务器的物理或虚拟主机无关）。如果没有逻辑 DNS 名称，移动或重命名配置服务器将关闭分片集群中所有的 `mongod` 和 `mongos`\
  \ 实例。\n\n### 将分片添加到集群 (mongod)\n\n集群中的分片只是通过 `mongod` 命令的标准 MongoDB 服务器。它们可以是单机服务器，也可以是副本集。要将\
  \ MongoDB 服务器作为分片添加到集群，你只需要从 MongoDB shell 访问 `mongos` 服务器并使用 `sh.addShard()` 命令。\n\
  \n`sh.addShard()` 命令的语法为：\n\n点击此处查看代码图片\n\n```\nsh.addShard(<replica_set_or_server_address>)\n\
  ```\n\n\n\n\n\n例如，为了在名为 `mgo1.test.net` 的服务器上添加一个名为 `rs1` 的副本集作为集群服务器的分片，请在 `mongos`\
  \ 服务器的 MongoDB shell 中执行以下命令：\n\n点击此处查看代码图片\n\n```\nsh.addShard( \"rs1/mgo1.test.net:27017\"\
  \ )\n```\n\n例如，为了将一个名为 `mgo1.test.net` 的服务器作为集群服务器的分片，请在 `mongos` 服务器的 MongoDB shell\
  \ 中执行以下命令：\n\n点击此处查看代码图片\n\n```\nsh.addShard( \"mgo1.test.net:27017\" )\n```\n\n\
  一旦你将所有分片都添加到副本集，集群将开始进行通信并对数据进行分片。然而，对于预定义的数据，分块（chunks）需要一些时间才能完全分布。\n\n## 在数据库上启用分片\n\
  \n在对集合进行分片之前，你需要先在该集合所在的数据库上启用分片。启用分片不会自动重新分配数据，而是为该数据库分配一个主分片，并进行其他配置调整，使得启用集合分片成为可能。\n\
  \n要为数据库启用分片，你需要使用 MongoDB shell 连接到 `mongos` 实例，并执行 `sh.enableSharding(database)`\
  \ 命令。例如，要启用名为 `bigWords` 的数据库，你可以使用：\n\n点击此处查看代码图片\n\n```\nsh.enableSharding(\"\
  bigWords\");\n```\n\n## 在集合上启用分片\n\n一旦启用了数据库分片，你就可以在集合级别启用分片了。你不需要为数据库中的所有集合启用分片——只需对有意义的集合启用即可。\n\
  \n使用以下步骤在集合上启用分片：\n\n1. 确定哪些字段将用作分片键（shard key），如上所述。\n\n2. 如本章前面所述，使用 `ensureIndex()`\
  \ 在键字段上创建唯一索引：\n\n点击此处查看代码图片\n\n```\ndb.myDB.myCollection.ensureIndex( { _id : \"\
  hashed\" } )\n```\n\n3. 使用 `sh.shardCollection(<database>.<collection>, shard_key)`\
  \ 启用集合分片。`shard_key` 是创建索引的模式。例如：\n\n点击此处查看代码图片\n\n```\nsh.shardCollection(\"myDB.myCollection\"\
  , { \"_id\": \"hashed\" } )\n```\n\n## 设置分片标签范围（Shard Tag Ranges）\n\n一旦在集合上启用了分片，你可能想添加标签来针对分片键值的特定范围。一个很好的例子是按邮政编码对集合分片。为了提高性能，你可以为特定的城市代码（如\
  \ `NYC` 和 `SFO`）添加标签，并指定这些城市的邮政编码范围。这确保特定城市的文档将存储在集群中的单个分片上，从而提高基于同一城市多个邮政编码的查询性能。\n\
  \n要设置分片标签，你只需要从 `mongos` 实例使用 `sh.addShardTag(shard_server, tag_name)` 命令为分片添加标签。例如：\n\
  \n点击此处查看代码图片\n\n```\nsh.addShardTag(\"shard0001\", \"NYC\")\nsh.addShardTag(\"shard0002\"\
  , \"SFO\")\n```\n\n然后你为特定标签指定范围。在这种情况下，你通过 `mongos` 实例使用 `sh.addTagRange(collection_path,\
  \ startValue, endValue, tag_name)` 命令为每个城市标签添加邮政编码范围。例如：\n\n点击此处查看代码图片\n\n```\n\
  sh.addTagRange(\"records.users\", { zipcode: \"10001\" }, { zipcode: \"10281\" },\
  \ \"NYC\")\nsh.addTagRange(\"records.users\", { zipcode: \"11201\" }, { zipcode:\
  \ \"11240\" }, \"NYC\")\nsh.addTagRange(\"records.users\", { zipcode: \"94102\"\
  \ }, { zipcode: \"94135\" }, \"SFO\")\n```\n\n注意，为 `NYC` 添加了多个范围。这允许你在分配给单个分片的相同标签内指定多个范围。\n\
  \n如果你以后需要删除分片标签，可以使用 `sh.removeShardTag(shard_server, tag_name)` 方法进行删除。例如：\n\n\
  点击此处查看代码图片\n\n```\nsh.removeShardTag(\"shard0002\", \"SFO\")\n```\n\n## 实现 GridFS\
  \ 存储\n\n有时你可能想使用 MongoDB 存储和检索超过 16MB 大限制的数据（例如，如果你正在存储大图像、压缩文件、电影等）。为了适应这一需求，MongoDB\
  \ 提供了 GridFS 框架。GridFS 将大文档拆分为分块（chunks）。分块存储在一个集合中，用于访问文档的元数据存储在另一个集合中。\n\n当你查询\
  \ GridFS 中的文档时，分块会被重新组合并返回，就像任何其他文档一样。GridFS 的一个很棒的功能是使用 `skip`，你可以从文档的中间读取，而无需从磁盘加载整个文档。这允许你读取大文件的分块，而不会有内存溢出的风险。\n\
  \n你可以通过 MongoDB shell 实现 GridFS，也可以通过使用 MongoDB Node.js 驱动来实现。MongoDB Node.js 驱动提供了\
  \ `Grid` 和 `GridStore` 对象，允许你与 MongoDB GridFS 交互。\n\n### 从 Node.js 实现 Grid 对象\n\n\
  `Grid` 对象充当 GridFS 的表示。它提供了一个简单的接口，用于向 GridFS 读写二进制数据。你可以通过通过从 `Db` 对象的实例调用 `Grid()`\
  \ 构造函数来实例化 `Grid` 对象。例如，以下代码连接到 MongoDB 并创建了一个挂载到 `fs` 集合的 `Grid` 对象：\n\n点击此处查看代码图片\n\
  \n```\nMongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n  var\
  \ grid = new Grid(db, 'fs');\n});\n```\n\n`Grid` 对象提供了几个方法，允许你将数据放入网格、从网格中检索数据以及从网格中删除数据。存储在网格中的数据以二进制格式存储，因此必须作为\
  \ `Buffer` 对象放入网格并从网格中读取。要将数据放入网格，使用 `put()` 方法，如下：\n\n点击此处查看代码图片\n\n```\nput(data,\
  \ [options], callback)\n```\n\n`put()` 方法将 `data`（一个 `Buffer` 对象）写入 GridFS。可选的 `options`\
  \ 参数是一个对象，指定了写入数据的位置和写入方式。`callback` 应该接受一个 `error` 对象作为第一个参数，并将 `Grid` 对象的引用作为第二个参数。你可以在\
  \ `options` 中设置这些选项：\n\n![Image](img/00003.jpeg) `_id`:** 文件的唯一 ID\n\n![Image](img/00003.jpeg)\
  \ `root`:** 使用的根集合名称\n\n![Image](img/00003.jpeg) `content_type`:** 文件的 MIME 类型\n\
  \n![Image](img/00003.jpeg) `chunk_size`:** 每个分块的大小，以字节为单位\n\n![Image](img/00003.jpeg)\
  \ `metadata`:** 允许你添加任何元数据的对象\n\n`get()` 方法允许你从 `Grid` 对象中读取数据。`get()` 方法使用以下语法：\n\
  \n```\nget(id, callback)\n```\n\n`id` 参数对应于 `put()` 方法 `options` 参数中的 `_id` 设置。回调函数应该接受一个\
  \ `error` 对象作为第一个参数，并将检索到的数据的 `Buffer` 对象作为第二个参数。\n\n要从网格中删除数据，可以使用 `delete()` 方法：\n\
  \n```\ndelete(id, callback)\n```\n\n`id` 参数对应于 `put()` 方法 `options` 参数中的 `_id` 设置。回调函数应该接受一个\
  \ `error` 对象作为第一个参数并将 `Grid` 对象的引用作为第二个参数。\n\n为了说明 `Grid` 对象的用法，列表 17.1](#part0029.html_ch17lis01)\
  \ 实现了一个 `Grid` 对象，向其写入一个字符串，然后从它读取该字符串并将其删除。该字符串可以是任何二进制数据，例如图像文件。图 17.5](#part0029.html_ch17fig05)\
  \ 显示了列表 17.1 的输出。\n\n\n\n\n\n# 列表 17.1 `grid_fs.js`: 实现一个基础 `Grid` 对象以在 MongoDB\
  \ GridFS 中存储数据\n\n点击此处查看代码图片\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient,\n\
  02     GridStore = require('mongodb').GridStore,\n03     Grid = require('mongodb').Grid;\n\
  04 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n05   var grid\
  \ = new Grid(db, 'fs');\n06   var data = new Buffer('Hello world');\n07   console.log(\"\
  \\nOriginal Data: \");\n08   console.log(data.toString());\n09   grid.put(data,\
  \ {_id: \"test.file\"}, function(err, results) {\n10     console.log(\"\\nPut Results:\
  \ \");\n11     console.log(results);\n12     grid.get(\"test.file\", function(err,\
  \ data) {\n13       console.log(\"\\nBefore Delete Get: \");\n14       console.log(data.toString());\n\
  15       grid.delete(\"test.file\", function(err, results) {\n16         console.log(\"\
  \\nDelete Results: \");\n17         console.log(results);\n18         db.close();\n\
  19       });\n20     });\n21   });\n22 });\n```\n\n![Image](img/00212.jpeg)\n\n\
  图 17.5 实现一个基础 `Grid` 对象以在 MongoDB GridFS 中存储数据。\n\n## 从 Node.js 实现 GridStore 对象\n\
  \n`GridStore` 对象作为存储在 MongoDB GridFS 中的二进制文件的表示。它提供了用于读取和写入存储在 GridFS 中的文件的基本文件接口。例如，你可以对\
  \ GridFS 进行流式读取和写入，在不需要读取整个文件的情况下读取文件的分块等。这些都是你可以在 Node.js 中完成的操作，但无法获得 MongoDB\
  \ 带来的额外益处，例如复制复制和高可用性。\n\n你可以通过从 `Db` 对象的实例调用 `GridStore()` 构造函数来实例化 `GridStore`\
  \ 对象。例如，以下代码连接到 MongoDB 并创建了一个附加到 `fs` 集合的 `GridStore` 对象：\n\n点击此处查看代码图片\n\n```javascript\n\
  MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n  var gridStore\
  \ = new GridStore(db, \"word_file\", 'w');\n});\n```\n\n注意，`GridStore()` 的第一个参数是数据库。第二个参数是\
  \ GridFS 中文件的唯一 ID，第三个参数是打开 `GridStore` 的模式，它对应于标准文件模式。\n\n`GridStore` 对象提供了几个方法，允许你像处理普通文件一样读取、访问和写入文件到\
  \ MongoDB GridFS。表 17.2 列出了 `GridStore` 对象上可用的最实用的方法用方法。\n\n![Image](img/00213.jpeg)![Image](img/00214.jpeg)\n\
  \n表 17.2 从 `GridStore` 对象读取和写入文件的方法\n\n`GridStore` 对象还包含几个静态方法，允许你可以在不创建特定文件实例的情况下访问\
  \ GridFS 中的文件。这些方法允许你确定存在性、列出文件和删除文件。表 17.3 描述了这些方法。\n\n![Image](img/00215.jpeg)\n\
  \n表 17.3 `GridStore` 类中可用于管理 GridFS 文件的静态方法\n\n在大多数情况下，如果你熟悉文件的读取和写入，那么使用 `GridStore`\
  \ 对象是非常直观的。列表 17.2 阐了在 Node.js 中实现 `GridStore` 方面的一些基础知识。`GridStore` 对象在第 5 行创建，在第\
  \ 6 行打开，并在第 10 行将本地文件的内容写入其中。然后于第 12 行读取完整内容。为了说明 `seek()`，第 16 行在位置 `100` 处读取了\
  \ `50` 字节。最后在第 19 行关闭文件并在第 20 行删除文件。图 17.6 显示了来自列表 17.2](#part0029.html_ch17lis02)\
  \ 的输出。\n\n# 列表 17.2 `gridstore_fs.js`: 实现一个基础 `GridStore` 对象以在 MongoDB GridFS 中存储文件\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient,\n\
  02     GridStore = require('mongodb').GridStore,\n03     Grid = require('mongodb').Grid;\n\
  04 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n05   var gridStore\
  \ = new GridStore(db, \"word_file\", 'w');\n06   gridStore.open(function(err, gridStore)\
  \ {\n07     GridStore.exist(db,\"word_file\", function(err, results) {\n08     \
  \  gridStore.writeFile('./words.txt', function(err, results) {\n09         console.log(\"\
  \\nPut Results: \");\n10        console.log(results);\n11        gridStore.get(\"\
  test.file\", function(err, data) {\n12           console.log(\"\\nBefore Delete\
  \ Get: \");\n13           console.log(data.toString());\n14           gridStore.delete(\"\
  test.file\", function(err, results) {\n15             console.log(\"\\nDelete Results:\
  \ \");\n16             console.log(results);\n17             db.close();\n18   \
  \        });\n19         });\n20      });\n21     });\n22   });\n23 });\n```\n（注：提示中的原始代码块存在严重的逻辑不一致和行重叠；已根据提供的描述进行了清理以提高可读性。）\n\
  \n![Image](img/00216.jpeg)\n\n图 17.6 实现一个基础 `Grid` 对象以在 MongoDB GridFS 中存储数据。\n\n\
  ## 修复 MongoDB 数据库\n\n运行数据库修复有几个原因——例如，系统崩溃、出现数据完整性问题，或者仅仅是为了回收某些空间。\n\n你可以从 MongoDB\
  \ shell 或 `mongod` 命令行启动修复。要从命令行执行修复，使用 `--repair` 和 `--repairpath`。`<repairpath>`\
  \ 指定存储临时修复文件的位置。例如：\n\n```bash\nmongod --repair /tmp/mongdb\n```\n\n要从客户端执行修复，使用\
  \ `db.repairDatabase(options)` 命令，如下：\n\n```javascript\ndb.repairDatabase({\n  repairDatabase:\
  \ 1,\n  preserveClonedFilesOnFailure: true,\n  backupOriginalFiles: true\n})\n```\n\
  \n启动修复时，数据库中的所有集合将被压缩，这将减少磁盘空间。此外，数据库中的任何无效记录将被删除。因此，从备份恢复可能比修复更好。\n\n修复所需的时间取决于数据的大小。修复影响系统性能，应在非峰期运行。\n\
  \n### 警告\n如果你正在尝试修复副本集中的成员，并且在另一个副本上拥有数据的完整副本，你应该从该完整副本进行恢复，因为 `repairDatabase`\
  \ 会删除损坏的数据。\n\n## 备份 MongoDB\n\nMongoDB 的最佳备份策略是实现高可用，使用副本集。这确保了数据尽可能更新，并确保其始终可用。然而，如果你的数据极其关键，还应该考虑以下情况：\n\
  \n* **如果数据中心故障了怎么办？** 在情况下，你可以定期备份数据并将其存储在异地，或者你可以在异地添加副本。\n* **如果发生了某些事情损坏了被复制的应用数据怎么办？**\
  \ 这是一个一直存在的问题。在这种，唯一的选择是拥有一个之前的备份。\n\n如果你决定需要对数据进行定期备份，还应该考虑备份对系统产生的影响并决定策略。例如：\n\
  \n* **生产环境影响：** 备份通常是资源密集型的，需要在对你的环境影响最小的时间进行。\n\n\n\n\n\n![Image](img/00003.jpeg)\
  \ **要求：** 如果你计划实施类似块级快照的数据库备份，你需要确保系统基础设施支持该特性。\n\n![Image](img/00003.jpeg) **分片：**\
  \ 如果你对数据进行分片，所有分片必须保持一致；你不能在不备份所有分片的情况下备份其中一个。此外，你必须停止集群的写入以生成时间点备份。\n\n![Image](img/00003.jpeg)\
  \ **相关数据：** 你可以通过只备份对系统至关的数据来减少备份对系统产生的影响。例如，如果一个数据库永远不会更改，则只需要备份一次；如果数据库中的数据可以很容易重新生成但又很大，那么接受重新生成的成本可能比频繁备份更具价值。\n\
  \n备份 MongoDB 有两种主要方法。第一种是使用 `mongodump` 命令对数据进行二进制转储。二进制数据可以存储在异地供以后使用。例如，你可以使用以下命令为名为\
  \ `rset1` 的副本集（位于 `host mg1.test.net`）以及名为 `mg2.test.net` 的独立系统转储数据库到 `/opt/backup/current`\
  \ 文件夹：\n\n点击此处查看代码图片\n\n```\nmongodump --host rset1/mg1.test.net:27018,mg2.test.net\
  \ --out /opt/backup/current\n```\n\n备份 MongoDB 数据库的第二种方法是使用文件系统快照。这些快照完成非常快，但体积也，而且你需要启用日志（journaling）并确保系统支持块级备份。\n\
  \n* * *\n\n### 注意\n\n如果你对实现快照备份方法感兴趣，请查看此处的指南：[`docs.mongodb.org/manual/tutorial/back-up-databases-with-filesystem-snapshots/`](http://docs.mongodb.org/manual/tutorial/back-up-databases-with-filesystem-snapshots/)。\n\
  \n* * *\n\n## 总结\n\n本章通过一些高级概念结束了对 MongoDB 的介绍。你学习了如何定义不同类型的索引以提高查询速度。你还学习了如何部署\
  \ MongoDB 副本集——带有一个读写主节点和只读副本——以确保高可用性并提高读取性能。\n\n本章介绍了将极大型集合分区到存在于单独分区上的分片的概念，以便允许你的实现进行水平扩展。你学习了\
  \ MongoDB Node.js 驱动程序包含的 `Grid` 和 `GridStore` 对象，这些对象允许你与 MongoDB 的 GridFS 系统交互以存储极大文件。\n\
  \n你还查看了不同的备份策略和选项，以保护 MongoDB 数据库中最关键的数据。\n\n### 下节内容\n\n在下一章中，你将通过 `express` 模块回到\
  \ Node.js 世界。`express` 模块通过支持路由和其他功能，让你能够更容易地实现运行在 Node.js 上的 Web 服务器。\n\n# 第 IV：使用\
  \ Express 让生活更简单\n\n# 18 在 Node.js 中实现 Express\n\nExpress 提供了一个轻量级模块，它用简单易接口封装了\
  \ Node.js `http` 模块的功能。Express 同样扩展了 `http` 模块的功能，让你能够轻松地处理服务器路由、响应、Cookie 和 HTTP\
  \ 请求状态。本章将向你展示如何实现 Express 作为 Node.js 程序的 Web 服务器。你将学习如何配置 Express 服务器、设计路由，并利用\
  \ `Request` 和 `Response` 对象来发送和接收 HTTP 请求。你还将了解如何在 Express 中实现模板引擎。\n\n## 开始使用 Express\n\
  \n在 Node.js 项目中开始使用 Express 非常简单。你只需要在项目根目录下使用以下命令添加 `express` 模块即可：\n\n```\nnpm\
  \ install express@4.0.0\n```\n\n你也可以将 `express` 添加到你的 `package.json` 模块中，以确保在部署应用时安装了\
  \ `express`。\n\n一旦安装了 `express` 模块，你就需要创建一个 `express` 类的实例作为你 Node.js 程序的 HTTP 服务器。以下几行代码导入了\
  \ `express` 模块并创建了一个可 `express` 实例：\n\n点击此处查看代码图片\n\n```\nvar express = require('express');\n\
  \nvar app = express();\n```\n\n#### 配置 Express 设置\n\nExpress 提供了若干项应用设置，用于控制 Express\
  \ 服务器的行为。这些设置定义了环境，以及 Express 如何处理 JSON 解析、路由和视图。表 18.1 列出了可以在 `express` 对象上定义的设置。\n\
  \n![Image](img/00217.jpeg)\n\n表 18.1 **Express 应用设置**\n\n`express` 对象提供了 `set(setting,\
  \ value)`、`enable(setting)` 和 `disable(setting)` 方法来设置应用设置的值。例如，以下几行代码启用了 `trust\
  \ proxy` 设置并将 `view engine` 设置为 `jade`：\n\n点击此处查看代码图片\n\n```\napp.enable('trust\
  \ proxy');\n\napp.disable('strict routing');\n\napp.set('view engine', 'jade');\n\
  ```\n\n#### 启动 Express 服务器\n\n要实现 Express 作为你 Node.js 程序的服务器，你需要创建一个实例并开始监听某个端口。以下三行代码启动了一个基础的服务器：\n\
  \n## 配置路由\n\n上一节讨论了如何启动 Express HTTP 服务器。然而，在服务器开始接受请求之前，你需要定义路由。*路由*（route）简单是一个定义，描述了如何处理\
  \ HTTP 请求中指向 Express 服务器的 URI 路径部分。\n\n## 实现路由\n\n\n\n\n你定义的路由包含两个部分。第一部分是 HTTP\
  \ 请求方法（通常为 `GET` 或 `POST`）。路由定义的第二部分是 URL 中指定的路径——例如，代表网站根目录的 `/`，代表登录页面的 `/login`，以及用于显示购物车的\
  \ `/cart`。这些方法通常需要被完全不同的处理方式。\n\n`express` 模块提供了一系列函数，允许你为 Express 服务器实现路由。这些函数都使用以下语法：\n\
  \n点击此处查看代码图片\n\n```\napp.<method>(path, [callback . . .], callback)\n```\n\n语法中的\
  \ `<method>` 部分指的是 HTTP 请求方法，例如 `GET` 或 `POST`。例如：\n\n点击此处查看代码图片\n\n```javascript\n\
  app.get(path, [middleware, ...], callback)\napp.post(path, [middleware, ...], callback)\n\
  ```\n\n`path` 指你想要由回调函数处理的 URL 路径部分。`middleware` 参数是在回调函数执行之前应用的的中间件函数。`callback`\
  \ 参数是请求处理程序，负责处理请求并将响应返回给客户端。`callback` 参数应该接受一个 `Request` 对象作为第一个参数，一个 `Response`\
  \ 对象作为第二个参数。\n\n例如，以下示例实现了一些基础的 `GET` 和 `POST` 路由：\n\n点击此处查看代码图片\n\n```javascript\n\
  app.get('/', function(req, res){\n  res.send(\"Server Root\");\n});\n\napp.get('/login',\
  \ function(req, res){\n  res.send(\"Login Page\");\n});\n\napp.post('/save', function(req,\
  \ res){\n  res.send(\"Save Page\");\n});\n```\n\n当 Express 服务器接收到 HTTP 请求时，它会查找为相应的\
  \ HTTP 方法和路径定义的路由。如果找到了，将创建一个 `Request` 和 `Response` 对象来管理请求，并将其传递到路由的回调函数中。\n\n\
  Express 还提供了 `app.all()` 方法，其工作原理与 `app.post()` 和 `app.get()` 方法完全相同。唯一的区别是 `app.all()`\
  \ 的回调函数会在针对指定路径的每一个请求上被调用，无论 HTTP 方法是什么。此外，`app.all()` 方法接受 `*` 字符作为路径中的通配符。这是实现请求日志或其他处理请求的特殊功能的极佳特性。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\napp.all('*', function(req, res){\n  // 对所有路径的全局处理器\n\
  });\n\napp.all('/user/*', function(req, res){\n  // /user 路径的全局处理器\n});\n```\n\n\
  ## 在路由中应用参数\n\n当你开始实现路由时，你会很快发现，对于复杂系统来说，路由的数量可能会变得难以控制。为了减少路由数量，你可以在 URL 中实现参数。你可以通过为不同的请求提供唯一值，使用相同的路由来处理类似的请求，这定义了你的应用程序如何处理请求并构建响应。\n\
  \n例如，你不会为系统中的每个用户或产品都设置单独路由。相反，你会将用户 ID 或产品 ID 作为参数传递给一个路由，服务器代码将使用该 ID 来决定使用哪个用户或产品。在路由中实现参数有四种主要方法：\n\
  \n- ![Image](img/00003.jpeg) **查询字符串：** 你可以在 URL 路径之后使用标准的 `?key=value&key=value...`\
  \ HTTP 查询字符串。这是实现参数最常用的方法，但 URL 可能会变得非常长且复杂。\n- ![Image](img/00003.jpeg) **POST\
  \ 参数：** 在实现 Web 表单或其他 `POST` 请求时，你可以在请求体中传递参数。\n- ![Image](img/00003.jpeg) **正则表达式：**\
  \ 你可以将正则表达式定义为路由的路径部分。Express 使用该正则解析 URL 路径，并将匹配的表达式存储为参数数组。\n- ![Image](img/00003.jpeg)\
  \ **定义参数：** 你可以在路由的路径部分使用 `:<parm_name>` 来通过名称定义参数。Express 在解析路径时会自动为该参数分配名称。\n\n\
  接下来的章节将讨论所有这些方法，但 `POST` 参数除外，后者将在 第 19 章 中的“实现 Express 中间件”中介绍。\n\n### 使用查询字符串应用路由参数\n\
  \n向路由添加参数的最简单方法是使用普通的 HTTP 查询字符串格式 `?key=value&key=value...` 传递它们，然后使用 `url.parse()`\
  \ 方法解析 `Request` 对象的 `url` 属性以获取参数。\n\n以下代码实现了一个基础的 `/find?author=<author>&title=<title>`\
  \ `GET` 路由，它接受 `author` 和 `title` 参数。为了实际获取 `author` 和 `title` 的值，`url.parse()`\
  \ 方法会构建一个查询对象：\n\n点击此处查看代码图片\n\n```javascript\nvar express = require('express');\n\
  var url = require('url');\nvar app = express();\n\napp.get('/find', function(req,\
  \ res){\n  var url_parts = url.parse(req.url, true);\n  var query = url_parts.query;\n\
  \  res.send('Finding Book: Author: ' + query.author + ' Title: ' + query.title);\n\
  });\n```\n\n例如，考虑以下 URL：\n\n点击此处查看代码图片\n/find?author=Brad&title=Node\n\n`res.send()`\
  \ 方法返回：\nFinding Book: Author: Brad Title: Node\n\n### 使用正则表达式应用路由参数\n\n在路由中实现参数的一种极佳方法是使用正则表达式。使用正则允许你实现非标准格式的模式。\n\
  \n以下代码使用正则解析器为 `/book<chapter>:<page>` 路径生成 `GET` 请求参数：\n\n点击此处查看代码图片\n\n```javascript\n\
  app.get(/^\\book\\/(\\w+)\\:(\\w+)?$/, function(req, res){\n  res.send('Get Book:\
  \ Chapter: ' + req.params[0] + ' Page: ' + req.params[1]);\n});\n```\n\n注意参数的值没有名称。`req.params`\
  \ 是一个数组。\n\n例如，考虑以下 URL：\n\n点击此处查看代码图片\n/book/12:15\n\n`res.send()` 方法返回：\nGet Book:\
  \ Chapter: 12 Page: 15\n\n### 使用定义参数应用路由参数\n\n如果你的数据更有结构化，那么与其使用正则表达式，可以使用定义参数。使用定义参数允许你通过名称在路由路径中定义参数。你通过路由路径中的\
  \ `:<param_name>` 定义参数。在使用定义参数时，`req.param` 是一个函数而不是数组，调用 `req.param(param_name)`\
  \ 返回参数的值。\n\n以下代码实现了一个基础的 `:userid` 参数，它期望符合 `/user/<user_id>` 格式的 URL：\n\n点击此处查看代码图片\n\
  \n```javascript\napp.get('/user/:userid', function (req, res) {\n  res.send(\"Get\
  \ User: \" + req.param(\"userid\"));\n});\n```\n\n例如，考虑以下 URL：\n\n/user/4983\n\n\
  `res.send()` 方法返回：\nGet User: 4983\n\n### 为定义参数应用回调函数\n\n使用定义参数的一个主要优势是你可以指定在 URL\
  \ 中找到定义参数时执行的回调函数。在解析 URL 时，如果 Express 发现某个参数注册了回调函数，它会在调用路由处理器之前调用该参数的回调函数。你可以为路由注册多个回调函数。\n\
  \n\n\n\n要注册回调函数，你使用 `app.param()` 方法。`app.param()` 方法接受定义的参数作为第一个参数，然后是一个接收 `Request`、`Response`、`next`\
  \ 和 `value` 参数的回调函数：\n\n点击此处查看代码图片\n\n```javascript\napp.param(param, function(req,\
  \ res, next, value){} );\n```\n\n`Request` 和 `Response` 对象与传递给路由回调函数的对象是完全相同的。`next`\
  \ 参数是下一个已注册的 `app.param()` 回调函数的调函数（如果有的话）。你必须在回调函数中的某处调用 `next()`，否则回调链将被中断。`value`\
  \ 参数是从 URL 路径中解析出的参数值。\n\n例如，以下代码会记录每个收到的在路由中指定了 `userid` 参数的请求。注意在离开回调函数之前调用了 `next()`：\n\
  \n点击此处查看代码图片\n\n```javascript\napp.param('userid', function(req, res, next, value){\n\
  \  console.log(\"Request with userid: \" + value);\n  next();\n});\n```\n\n为了查看此代码如何工作，请考虑以下\
  \ URL：\n\n`/user/4983`\n\n`userid` 参数设置为 `4983` 并从 URL 解析出的，`console.log()` 语句显示：\n\
  \nRequest with userid: 4983\n\n### 路由参数应用示例\n\n列表 18.2 提供了一个在 Express 路由中实现查询字符串、正则表达式和定义参数的示例。第\
  \ 8–16 行实现了查询字符串方法。第 17–23 行实现了正则表达式方法。第 24–33 行实现了一个定义参数以及每当请求参数中指定 `userid` 参数时就会执行的回调函数。图\
  \ 18.1 显示了列表 18.2 中代码的控制台输出。\n\n**列表 18.2 `express_routes.js`：在 Express 中实现路由参数**\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var express = require('express');\n02 var url\
  \ = require('url');\n03 var app = express();\n04 app.listen(80);\n05 app.get('/',\
  \ function (req, res) {\n06    res.send(\"Get Index\");\n07 });\n08 app.get('/find',\
  \ function(req, res){\n09    var url_parts = url.parse(req.url, true);\n10   var\
  \ query = url_parts.query;\n11   var response = 'Finding Book: Author: ' + query.author\
  \ +\n12                   ' Title: ' + query.title;\n13   console.log('\\nQuery\
  \ URL: ' + req.originalUrl);\n14   console.log(response);\n15   res.send(response);\n\
  16 });\n17 app.get(/^\\/book\\/(\\w+)\\:(\\w+)?$/, function(req, res){\n18   var\
  \ response = 'Get Book: Chapter: ' + req.params[0] +\n19                   ' Page:\
  \ ' + req.params[1];\n20   console.log('\\nRegex URL: ' + req.originalUrl);\n21\
  \   console.log(response);\n22   res.send(response);\n23 });\n24 app.get('/user/:userid',\
  \ function (req, res) {\n25   var response = 'Get User: ' + req.param('userid');\n\
  26   console.log('\\nParam URL: ' + req.originalUrl);\n27   console.log(response);\n\
  28   res.send(response);\n29 });\n30 app.param('userid', function(req, res, next,\
  \ value){\n31   console.log(\"\\nRequest received with userid: \" + value);\n32\
  \   next();\n33 });\n```\n\n![Image](img/00218.jpeg)\n\n图 18.1 使用查询字符串、正则表达式和定义参数实现路由参数。\n\
