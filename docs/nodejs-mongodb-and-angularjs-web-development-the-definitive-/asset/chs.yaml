  \ AngularJS HTML 页面提供 CSS 样式。\n\n# 定义客户、产品和订单模型\n\n在实现应用程序的第一步，你应该始终考虑对象模型需求。在本示例中，目标是提供购物车。为了实现这一点，你需要一个客户模型作为购物车的容器。此外，你还需要放入购物车的商品。结账时，你需要账单信息和配送信息，一旦订单下单，你需要一种存储订单。因此，你需要客户、产品、订单和配送数据模型来支持购物车。\n\
  \n接下来的章节将讨论项目中实现的每个模型架构的设计。所有架构包含在一个名为 `cart_model.js` 的文件中。你需要加载 `mongoose` 库的\
  \ `Schema` 对象：\n\n\n\n\n\n点击此处查看代码图片\n\n```javascript\n01 var mongoose = require('mongoose'),\n\
  02     Schema = mongoose.Schema;\n```\n\n接下来的章节描述了实现此示例所需的其余代码。完整的 schema 定义可以在\
  \ Listing 28.7 中查看。\n\n#### 定义地址架构 (Address Schema)\n\n首先，你定义一个地址架构，该架构是通用的，以便用于收货信息并可作为账单信息的一部分。Listing\
  \ 28.1 实现了 `AddressSchema`，它包含了标准的地址信息。注意，接下来的代码用于禁用 `_id` 属性，因为你不需要通过 ID 查找地址：\n\
  \n```\n{ _id: false }\n```\n\nListing 28.1 `cart_model.js-AddressSchema`: 为收货和账单地址定义\
  \ schema\n\n点击此处查看代码图片\n\n* * *\n\n```javascript\n03 var AddressSchema = new Schema({\n\
  04    name: String,\n05    address: String,\n06    city: String,\n07    state: String,\n\
  08    zip: String\n09 }, { _id: false });\n10 mongoose.model('Address', AddressSchema);\n\
  ```\n\n* * *\n\n#### 定义账单架构 (Billing Schema)\n\n定义好 `AddressSchema` 后，你现在可以定义账单架构来跟踪信用卡信息以及账单信息。Listing\
  \ 28.2 实现了 `BillingSchema`，它包含了标准的信用卡数据。注意以下对 `cardtype` 的实现需要输入 `Visa`、`MasterCard`\
  \ 或 `Amex`（不支持任何其他值）：\n\n点击此处查看代码图片\n\n```\ncardtype: { type: String, enum: ['Visa',\
  \ 'MasterCard', 'Amex'] },\n```\n\n同样注意 `address` 字段被赋值了 `AddressSchema` 对象类型。Mongoose\
  \ 要求你将嵌套 schema 包含在数组中。你将在示例的多个地方看到这一点，并且通过示例你会发现，通过使用 `address[0]` 获取数组中的第一个项来访问地址。\n\
  \nListing 28.2 `cart_model.js-BillingSchema`: 为账单信用卡和地址定义 schema\n\n点击此处查看代码图片\n\
  \n* * *\n\n```javascript\n11 var BillingSchema = new Schema({\n12    cardtype: {\
  \ type: String, enum: ['Visa', 'MasterCard', 'Amex'] },\n13    name: String,\n14\
  \    number: String,\n15    expiremonth: Number,\n16    expireyear: Number,\n17\
  \    address: [AddressSchema]\n18 }, { _id: false });\n19 mongoose.model('Billing',\
  \ BillingSchema);\n```\n\n* * *\n\n#### 定义产品架构 (Product Schema)\n\n接下来，你定义存储产品信息的架构。此示例中的产品模型是一个带有\
  \ `name`、`imagefile`、`description`、`price` 和 `instock` 计数器的打印品。Listing 28.3 展示了\
  \ `ProductSchema` 的完整定义。\n\nListing 28.3 `cart_model.js-ProductSchema`: 为打印品定义基础产品\
  \ schema\n\n点击此处查看代码图片\n\n* * *\n\n```javascript\n20 var ProductSchema = new Schema({\n\
  21    name: String,\n22    imagefile: String,\n23    description: String,\n24  \
  \  price: Number,\n25    instock: Number\n26 });\n27 mongoose.model('Product', ProductSchema);\n\
  ```\n\n* * *\n\n#### 定义数量架构 (Quantity Schema)\n\n对于订单和购物车，你可以将产品包含在数组中。然而，你还需要能够存储数量。实现此点的方法之一定义一个包含\
  \ quantity 和 product 字段的数量 schema。Listing 28.4 实现了 `ProductQantitySchema`，正是此类操作。注意，由于你嵌入了\
  \ `ProductSchema`，因此将其以数组形式包含，并且在整个示例中，你通过使用 `product[0]` 来访问它。\n\nListing 28.4\
  \ `cart_model.js-QuantitySchema`: 为订单和购物车中的产品数量定义基础数量 schema\n\n点击此处查看代码图片\n\n*\
  \ * *\n\n```javascript\n28 var ProductQuantitySchema = new Schema({\n29    quantity:\
  \ Number,\n30    product: [ProductSchema]\n31 }, { _id: false });\n32 mongoose.model('ProductQuantity',\
  \ ProductQuantitySchema);\n```\n\n* * *\n\n#### 定义订单架构 (Order Schema)\n\n接下来，你需要创建订单架构来跟踪订单项目、收货信息和账单信息。Listing\
  \ 28.5 实现了 `OrderSchema` 模型，它存储了关于订单必要信息。注意 `timestamp` 字段被赋予 `Date` 类型以跟踪下单时间。此外，`items`\
  \ 字段是一个 `QuantitySchema` 子文档数组。\n\nListing 28.5 `cart_model.js-OrderSchema`: 定义用于存储订单信息的订单\
  \ schema\n\n点击此处查看代码图片\n\n* * *\n\n```javascript\n33 var OrderSchema = new Schema({\n\
  34    userid: String,\n35    items: [ProductQuantitySchema],\n36    shipping: [AddressSchema],\n\
  37    billing: [BillingSchema],\n38    status: {type: String, default: \"Pending\"\
  },\n39    timestamp: { type: Date, default: Date.now }\n40 });\n41 mongoose.model('Order',\
  \ OrderSchema);\n```\n\n#### 定义客户架构 (Customer Schema)\n\n最后一个架构是客户。Listing 28.6\
  \ 在第 42-48 行显示了完整的 `CustomerSchema`。`CustomerSchema` 包含一个 `userid` 字段将订单与客户关联。注意\
  \ `shipping`、`billing` 和 `cart` 都是嵌套 schema。这使得识别 `userid` 变得简单。\n\nListing 28.6\
  \ `cart_model.js`: 包含客户架构的完整应用程序\n\n点击此处查看代码图片\n\n* * *\n\n```javascript\n42 var\
  \ CustomerSchema = new Schema({\n43    userid: { type: String, unique: true, required:\
  \ true },\n44    shipping: [AddressSchema],\n45    billing: [BillingSchema],\n46\
  \    cart: [ProductQuantitySchema]\n47 });\n48 mongoose.model('Customer', CustomerSchema);\n\
  ```\n\n* * *\n\n### 创建购物车服务器\n\n定义模型后，你就可以开始实现购物车服务器。Listing 28.7 实现了用于购物车应用的 Express\
  \ 服务器。这段代码应该让你感到熟悉。它包含了 `express` 和 `mongoose` 库，并通过 Mongoose 连接到 MongoDB。\n\n\n\
  \n\n注意，模型定义中有一个 `require` 语句，用于在 Mongoose 中构建 `Schema` 对象。此外，包含了 `./cart_routes`\
  \ 文件，以便在监听 80 端口监听之前为服务器初始化路由。\n\n### 列表 28.7 `cart_server.js`：使用 Express 实现购物车应用程序服务器并连接\
  \ MongoDB\n\n点击此处查看代码图片\n\n```javascript\n01 var express = require('express');\n\
  02 var bodyParser = require('body-parser');\n03 var mongoose = require('mongoose');\n\
  04 var db = mongoose.connect('mongodb://localhost/cart');\n05 require('./models/cart_model.js');\n\
  06 var app = express();\n07 app.engine('.html', require('ejs').__express);\n08 app.set('views',\
  \ __dirname + '/views');\n09 app.set('view engine', 'html');\n10 app.use(bodyParser());\n\
  11 require('./cart_routes')(app);\n12 app.listen(80);\n```\n\n### 实现支持产品、购物车和订单请求的路由\n\
  \n作为 Express 服务器配置的一部分，你加载了列表 28.7 所示的 `./cart_routes.js` 文件。列表 28.8 提供了获取客户、产品和订单对象所需的路由。它还提供了向数据库添加订单以及更新客户收货、账单和购物车信息的路由。\n\
  \n第 6–9 行实现了静态路由，用于支持在此示例使用的 AngularJS、CSS、JavaScript、图像和 AngularJS 局部模板。图像和 AngularJS\
  \ `lib` 文件夹位于项目的同级目录。其他静态文件位于项目内部的 `./static` 文件夹中。\n\n注意，当用户访问网站根位置（`/`）时，第 11\
  \ 行渲染 `shopping.html` 模板。第 13–19 行的其余路由都涉及与 MongoDB 数据库的交互，并在下一节描述的控制器路由处理程序中处理。\n\
  \n### 列表 28.8 `cart_routes.js`：为客户端的购物车 Web 请求实现路由\n\n点击此处查看代码图片\n\n```javascript\n\
  01 var express = require('express');\n02 module.exports = function(app) {\n03  \
  \  var customers = require('./controllers/customers_controller');\n04    var products\
  \ = require('./controllers/products_controller');\n05    var orders = require('./controllers/orders_controller');\n\
  06    app.use('/static', express.static( './static')).\n07        use('/images',\
  \ express.static( '../images')).\n08        use('/lib', express.static( '../lib')\n\
  09   );\n10   app.get('/', function(req, res){\n11      res.render('shopping');\n\
  12   });\n13   app.get('/products/get', products.getProducts);\n14   app.get('/orders/get',\
  \ orders.getOrders);\n15   app.post('/orders/add', orders.addOrder);\n16   app.get('/customers/get',\
  \ customers.getCustomer);\n17   app.post('/customers/update/shipping', customers.updateShipping);\n\
  18   app.post('/customers/update/billing', customers.updateBilling);\n19   app.post('/customers/update/cart',\
  \ customers.updateCart);\n20 }\n```\n\n### 实现基于模型的控制器路由\n\n除了实现标准路由处理外，你还需要实现与数据库交互的路由处理。你将这些路由处理程序从标准的\
  \ `cart_route.js` 文件中分离出来，为每个模型建立独立的文件，以保持代码整洁并确保良好的职责划分。\n\n接下来的章节涵盖了 `Customer`、`Order`\
  \ 和 `Product` 模型的特定控制器的实现。\n\n#### 实现产品模型控制器\n\n列表 28.9 实现了 `Product` 模型的路由处理代码。只有两个路由。`getProduct()`\
  \ 路由根据查询包含的 `productId` 查找单个产品。`getProducts()` 路由查找所有产品。如果请求成功，将产品或所有产品以 JSON 字符串的形式返回给客户端。如果请求失败，则返回\
  \ 404 错误。\n\n### 列表 28.9 `products_controller.js`：为 Express 服务器实现获取产品的路由\n\n点击此处查看代码图片\n\
  \n```javascript\n01 var mongoose = require('mongoose'),\n02     Product = mongoose.model('Product');\n\
  03 exports.getProduct = function(req, res) {\n04   Product.findOne({ _id: req.query.productId\
  \ })\n05   .exec(function(err, product) {\n06   if (!product){\n07      res.json(404,\
  \ {msg: 'Photo Not Found.'});\n08   } else {\n09      res.json(product);\n10   }\n\
  11  });\n12 exports.getProducts = function(req, res) {\n13   Product.find()\n14\
  \   .exec(function(err, products) {\n15   if (!products){\n16      res.json(404,\
  \ {msg: 'Products Not Found.'});\n17   } else {\n18      res.json(products);\n19\
  \   }\n20  });\n21 };\n```\n\n#### 实现订单模型\n\n列表 28.10 实现了 `Order` 模型的路由处理代码。有三个路由。`getOrder()`\
  \ 路由根据查询包含的 `orderId` 查找单个订单。`getOrders()` 查找属于当前用户的所有订单。在示例中，`userid` 被硬编码为 `customerA`。如果请求成功，将订单或该客户的所有订单以\
  \ JSON 字符串返回给客户端。如果请求失败，则返回 404 错误。\n\n`addOrder()` 路由处理程序通过从 `POST` 请求获取 `updatedShipping`、`updatedBilling`\
  \ 和 `orderItems` 来构建新的 `Order` 对象。如果订单保存成功，将使用以下代码将 `Customer` 对象中的 `cart` 字段重置为空，并返回成功；否则，返回\
  \ 500 或 404 错误。\n\n### 列表 28.10 `orders_controller.js`：为 Express 服务器实现获取和添加订单的路由\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var mongoose = require('mongoose'),\n02     Customer\
  \ = mongoose.model('Customer'),\n03     Order = mongoose.model('Order'),\n04   \
  \  Address = mongoose.model('Address'),\n05     Billing = mongoose.model('Billing');\n\
  06 exports.getOrder = function(req, res) {\n07   Order.findOne({ _id: req.query.orderId\
  \ })\n08   .exec(function(err, order) {\n09   if (!order){\n10      res.json(404,\
  \ {msg: 'Order Not Found.'});\n11   } else {\n12      res.json(order);\n13   }\n\
  14  });\n15 };\n16 exports.getOrders = function(req, res) {\n17   Order.find({userid:\
  \ 'customerA'})\n18   .exec(function(err, orders) {\n19   if (!orders){\n20    \
  \  res.json(404, {msg: 'Orders Not Found.'});\n21   } else {\n22      res.json(orders);\n\
  23   }\n24  });\n25 };\n26 exports.addOrder = function(req, res){\n27   var orderShipping\
  \ = new Address(req.body.updatedShipping);\n28   var orderBilling = new Billing(req.body.updatedBilling);\n\
  29   var orderItems = req.body.orderItems;\n30   var newOrder = new Order({userid:\
  \ 'customerA',\n31                             items: orderItems, shipping: orderShipping,\n\
  32                             billing: orderBilling});\n33   newOrder.save(function(err,\
  \ results){\n34    if(err){\n35      res.json(500, \"Failed to save.\");\n36   \
  \ } else {\n37      Customer.update({ userid: 'customerA' },\n38        {$set:{cart:[]}})\n\
  39      .exec(function(err, results){\n40        if (err || results < 1){\n41  \
  \        res.json(404, {msg: 'Failed to update Cart.'});\n42        } else {\n43\
  \          res.json({msg: \"Order Saved.\"});\n44        }\n45      });\n46    }\n\
  47  });\n48 };\n```\n\n#### 实现 Customer 模型\n\n\n\n\n\nListing 28.11 实现了 `Customer`\
  \ 模型的路由处理代码。共有四个路由。`getCustomer()` 路由根据硬编码的 `customerA` 值查找客户订单。如果成功，则将 `Customer`\
  \ 对象以 JSON 字符串的形式返回给客户端。如果请求失败，则返回 404 错误。`updateShipping()` 路由根据 `POST` 请求中的 `updatedShipping`\
  \ 参数创建一个新的 `Address` 对象，然后使用 `update()` 方法用新的运输数据更新 `Customer` 对象。如果成功，则返回成功消息；如果失败，则返回\
  \ 404 错误。\n\n`updateBilling()` 路由根据 `POST` 请求中的 `updatedBilling` 参数创建一个新的 `Billing`\
  \ 对象，然后使用 `update()` 方法用新的账单数据更新 `Customer` 对象。如果成功，则返回成功消息；如果失败，则返回 404 错误。`updateCart()`\
  \ 路由使用 `update()` 方法用 `POST` 请求中发送的 `updatedCart` 对象更新 `Customer` 对象的 `cart` 字段。如果成功，则返回成功消息。如果失败，则返回\
  \ 404 错误。\n\nListing 28.11 `customers_controller.js`: 为 Express 服务器实现获取和更新客户的路由\n\
  \n点击此处查看代码图片\n\n***\n\n```javascript\n01 var mongoose = require('mongoose'),\n02\
  \     Customer = mongoose.model('Customer'),\n03     Address = mongoose.model('Address'),\n\
  04     Billing = mongoose.model('Billing');\n05 exports.getCustomer = function(req,\
  \ res) {\n06   Customer.findOne({ userid: 'customerA' })\n07   .exec(function(err,\
  \ customer) {\n08     if (!customer){\n09         res.json(404, {msg: 'Customer\
  \ Not Found.'});\n10       } else {\n11         res.json(customer);\n12     }\n\
  13   });\n14 };\n15 exports.updateShipping = function(req, res){\n16   var newShipping\
  \ = new Address(req.body.updatedShipping);\n17   Customer.update({ userid: 'customerA'\
  \ },\n18       {$set:{shipping:[newShipping.toObject()]}})\n19   .exec(function(err,\
  \ results){\n20     if (err || results < 1){\n21         res.json(404, {msg: 'Failed\
  \ to update Shipping.'});\n22       } else {\n23         res.json({msg: \"Customer\
  \ Shipping Updated\"});\n24       }\n25     });\n26 };\n27 exports.updateBilling\
  \ = function(req, res){\n28   // This is where you could verify the credit card\
  \ information\n29   // and halt the checkout if it is invalid.\n30   var newBilling\
  \ = new Billing(req.body.updatedBilling);\n31   Customer.update({ userid: 'customerA'\
  \ },\n32       {$set:{billing:[newBilling.toObject()]}})\n33   .exec(function(err,\
  \ results){\n34     if (err || results < 1){\n35         res.json(404, {msg: 'Failed\
  \ to update Billing.'});\n36       } else {\n37         res.json({msg: \"Customer\
  \ Billing Updated\"});\n38       }\n39     });\n40 };\n41 exports.updateCart = function(req,\
  \ res){\n42   Customer.update({ userid: 'customerA' },\n43       {$set:{cart:req.body.updatedCart}})\n\
  44   .exec(function(err, results){\n45     if (err || results < 1){\n46        \
  \ res.json(404, {msg: 'Failed to update Cart.'});\n47       } else {\n48       \
  \  res.json({msg: \"Customer Cart Updated\"});\n49       }\n50     });\n51 };\n\
  ```\n\n***\n\n### 实现购物车和结算视图\n\n现在路由已经设置并配置完成，你准备好实现由路由和 AngularJS 模板渲染的视图了。后续章节将讨论由\
  \ EJS 渲染的主 `shopping.html` 视图，以及构成 `cart`、`shipping`、`billing`、`review` 和 `orders`\
  \ 页面的各种部分视图。\n\n#### 实现购物视图\n\n在 Listing 28.12 中所示购物视图是购物应用程序的主视图。事实上，用户从未离开过此页面；而是内容根据后续章节描述的部分视图发生了变化。\n\
  \n视图的头部将 `<html ng-app=\"myApp\">` 元素注册到 AngularJS 的 `myApp` 应用，并加载 `cart_styles.css`\
  \ 文件。`<body>` 元素初始化 AngularJS `ng-controller=\"shoppingController\"`，以提供与产品、购物车、结算和订单交互的功能。\n\
  \n页面内容使用以下 `ng-include` 指令进行更改，该指令映射到 `$scope.content`，且作用域中的 `content` 变量可以设置为服务器上的任何模板文件：\n\
  \n点击此处查看代码图片\n\n```html\n<div ng-include=\"content\"></div\n```\n\n例如，参见下文所示的订单和购物车可点击链接，它们调用\
  \ `setContent()` 并传递要加载的模板文件名：\n\n点击此处查看代码图片\n\n```html\n<span class=\"orders\"\
  \ ng-click=\"setContent('orders.html')\">Orders</span>\n<span id=\"cartLink\" ng-click=\"\
  setContent('cart.html')\">\n  {{customer.cart.length}} items\n  <img src=\"/images/cart.png\"\
  \ />\n</span>\n```\n\n还要注意，购物车中的物品数量来自作用域 `customer.cart.length`。作用域中的 `Customer`\
  \ 对象在控制器初始化时直接从 Web 服务器下载。图 28.1 显示了完全渲染的 `shopping.html` 页面。\n\n```html\n01 <!doctype\
  \ html>\n02 <html ng-app=\"myApp\">\n03 <head>\n04   <title>Shopping</title>\n05\
  \   <link rel=\"stylesheet\" type=\"text/css\"\n06   href=\"/static/css/cart.css\"\
  \ />\n07 </head>\n08 <body>\n09   <div ng-controller=\"shoppingController\">\n10\
  \     <div id=\"banner\">\n11       <div id=\"title\">My Store</div\n12       <div\
  \ id=\"bar\">\n13         <span class=\"orders\"\n14         ng-click=\"setContent('orders.html')\"\
  >Orders</span\n15         <span id=\"cartLink\" ng-click=\"setContent('cart.html')\"\
  >\n16           {{customer.cart.length}} items\n17           <img src=\"/images/cart.png\"\
  \ />\n18         </span>\n19       </div>\n20     </div>\n21     <div id=\"main\"\
  >\n22       <div ng-include=\"content\"></div\n23     </div>\n24   </div>\n25  \
  \ <script src=\"http://code.angularjs.org/1.2.9/angular.min.js\"></script>\n26 \
  \  <script src=\"/static/js/cart_app.js\"></script>\n27 </body>\n28 </html>\n```\n\
  \n图 28.1 带有购物车链接和订单按钮的购物页面以及待购打印列表\n\n#### 实现产品视图\n\n接下来，你实现产品视图以为用户提供一个可选的产品列表。在这个例子中，购物页面非常简单：只有一个包含待购打印列表的页面。虽然它很基础，但足以演示购物车的实现并保持代码的简单。\n\
  \nListing 28.13 是一个 AngularJS 部分组件，当 `$scope.content` 设置为 `products.html` 时它会被加载到视图中。代码在\
  \ `shoppingController` 初始化时对初始化的产品使用了 `ng-repeat`。注意产品信息使用 `{{product.name}}` 等表达式显示在页面上。\n\
  \n还要注意，当用户点击 `<img>` 元素时，会调用控制器中的 `setProduct()` 函数。该函数设置当前的 `$scope.product` 值并将\
  \ `$scope.content` 值更改为 `product.html。图 28.2 显示了渲染后的产品视图。\n\nListing 28.13 `products.html`:\
  \ 实现部分产品列表模板\n\n```html\n01 <div id=\"productsContainer\">\n02   <div class=\"listItem\"\
  \ ng-repeat=\"product in products\">\n03     <img class=\"listImg\" ng-click=\"\
  setProduct(product._id)\"\n04       ng-src=\"../images/{{product.imagefile}}\" />\n\
  05     <span class=\"prodName\">{{product.name}}</span>\n06     <span class=\"price\"\
  >{{product.price|currency}}</span>\n07   </div>\n08 </div>\n```\n\n\n\n\n\n![Image](img/00281.jpeg)\n\
  \n图 28.2 产品视图，显示了可用的印刷品。\n\n### 实现产品页面视图\n\n当用户点击产品列表中的图像时，将渲染产品页面视图。代码列表 28.14\
  \ 显示了用于产品页面的 AngularJS 代码。注意，产品信息是使用 AngularJS 表达式显示的，这些表达式访问了 `$scope.product`\
