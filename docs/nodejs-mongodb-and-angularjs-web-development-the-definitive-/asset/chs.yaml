  \n接下来的章节将向你展示如何实现一个基础交互表格，允许你为提供表格数据的 MongoDB 查询设置限制（limit）、过滤和排序准则。\n\n### 为 /words\
  \ 路由创建 Express 路由控制器\n\n首先，你需要实现路由处理程序，该程序将与 `Word` 模型交互，以从 MongoDB 中检索单词。列表 29.16\
  \ 为 `/words` 路由实现了 `getWords()` 路由处理程序。该处理程序从查询中读取 `limit`、`skip`、`sort` 和 `direction`\
  \ 参数，并使用它们查询 MongoDB 数据库。\n\n`getSortObj()` 函数将排序字段和方向转换为用于 `Query` 对象上 `.sort()`\
  \ 方法的排序对象。\n\n列表 29.16 `words_controller.js`: 实现支持 `/words` 路由的后端单词路由控制器\n\n点击此处查看代码图片\n\
  \n```javascript\n01 var mongoose = require('mongoose'),\n02     Word = mongoose.model('Word');\n\
  03 exports.getWords = function(req, res) {\n04   var sort = getSortObj(req);\n05\
  \   var query = Word.find();\n06   if(req.query.contains.length > 0){\n07     query.find({'word'\
  \ : new RegExp(req.query.contains, 'i')});\n08   }\n09   query.sort(sort)\n10  \
  \ .limit(req.query.limit)\n11   .skip(req.query.skip)\n12   .exec(function(err,\
  \ word) {\n13     if (!word){\n14       res.json(404, {msg: 'Word Not found'});\n\
  15     } else {\n16       res.json(word);\n17     }\n18   });\n19 };\n20 function\
  \ getSortObj(req){\n21   var field = \"word\";\n22   if(req.query.sort == 'Vowels'){\n\
  23     field = 'vowels';\n24   } else if(req.query.sort == 'Consants'){\n25    \
  \ field = 'consonants';\n26   } else if(req.query.sort == 'Length'){\n27     field\
  \ = 'size';\n28   }else{\n29     field = req.query.sort.toLowerCase();\n30   }\n\
  31   var sort = new Object();\n32   sort[field] = req.query.direction;\n33   return\
  \ sort;\n34 };\n```\n\n### 定义控制器\n\n有了路由处理程序后，你可以实现访问表格单词列表的 AngularJS 控制器。列表 29.17\
  \ 在 AngularJS `Module` 对象中实现了 `tableController`。前几行定义了单词数组，以及 `$http` 请求使用的 `contains`、`limit`\
  \ 和 `direction` 值。`getWords()` 函数向 `/words` 路由发送 `$http` 请求，并填充到表格的 `$scope.words`\
  \ 数组以支持排序和过滤。\n\n```javascript\n01 var app = angular.module('App', []);\n02 app.controller('tableController',\
  \ function($scope, $http) {\n03   $scope.words = [];\n04   $scope.contains = '';\n\
  05   $scope.limit = 5;\n06   $scope.skip = 0;\n07   $scope.skipEnd = 0;\n08   $scope.sortFields\
  \ = ['Word', 'First', 'Last', 'Vowels', 'Consonants'];\n09   $scope.sortField =\
  \ \"Word\";\n10  $scope.direction = \"asc\";\n11  $scope.getWords = function(){\n\
  12    $http({url: '/words', method: \"GET\",\n13      params:{limit:$scope.limit,\n\
  14        skip:$scope.skip,\n15        sort:$scope.sortField,\n16        direction:$scope.direction,\n\
  17        contains:$scope.contains }})\n18    .success(function(data, status, headers,\
  \ config) {\n19      $scope.words = data;\n20      $scope.skipEnd = $scope.skip\
  \ + $scope.words.length;\n21    })\n22    .error(function(data, status, headers,\
  \ config) {\n23      $scope.words = [];\n24      $scope.skipEnd = $scope.skip +\
  \ $scope.words.length;\n25    });\n26 });\n```\n\n\n\n\n\n```javascript\n  });\n\
  \n};\n  $scope.find = function(){\n    $scope.skip = 0;\n    $scope.getWords();\n\
  \  };\n  $scope.next = function(){\n    if($scope.words.length == $scope.limit){\n\
  \      $scope.skip += parseInt($scope.limit);\n      $scope.getWords();\n    }\n\
  \  };\n  $scope.prev = function(){\n    if($scope.skip > 0){\n      if($scope.skip\
  \ >= parseInt($scope.limit)){\n        $scope.skip -= parseInt($scope.limit);\n\
  \      } else{\n        $scope.skip = 0;\n      }\n      $scope.getWords();\n  \
  \  }\n  };\n  $scope.getWords();\n });\n```\n\n#### 实现 AngularJS 表格视图\n\n在实现了 `tableController`\
  \ 后，你可以实现一个以表格形式利用单词数据的 AngularJS 视图。[Listing 29.18 实现了一个简单的模板，用于提供过滤、排序和分页单词的控制，并在表格中显示单词。\n\
