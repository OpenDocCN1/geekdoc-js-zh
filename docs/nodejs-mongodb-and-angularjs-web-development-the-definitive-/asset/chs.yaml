  \ 的交互。\n\n![Image](img/0111.jpeg)\n图 9.7 客户端的输出，显示进程 ID。\n\n## 10. 使用额外的 Node.js\
  \ 模块\n\n本章旨在向你介绍 Node.js 的一些额外的内置功能。`os` 模块暴露了操作系统的方面，在实现应用程序时有用。`util` 模块提供了各种功能，如同步输出、字符串格式化和继承增强。`dns`\
  \ 模块允许从 Node.js 应用中执行 DNS 查询和反向查询。\n\n接下来的章节将描述这些模块以及如何在你的 Node.js 应用中使用它们。某些方法你可能已经在之前的章节中见过了。\n\
  \n### 使用 os 模块\n\n`os` 模块提供了一组极其实用的函数，允许你从操作系统获取信息。例如，当从来自 OS 的流中访问数据时，可以使用 `os.endianness()`\
  \ 函数判断操作系统是大端序还是小端序，以便使用正确的读写方法。\n\n表 10.1 列出了 `os` 模块提供的方法，并描述了你可以如何使用它们。\n\n![Image](img/0112.jpeg)\n\
  \n\n\n\n\n## 表 10.1 `os` 模块中可以调用的方法\n\n为了帮助你可视化如何使用 `os` 模块，列表 10.1 中的代码包含了 `os`\
  \ 模块的每一个调用。图 10.1 显示了输出。\n\n### 列表 10.1 `os_info.js`: 调用 `os` 模块的方法\n\n点击查看代码图像\n\
  \n```javascript\n01 var os = require('os');\n02 console.log(\"tmpdir :\\t\" + os.tmpdir());\n\
  03 console.log(\"endianness :\\t\" + os.endianness());\n04 console.log(\"hostname\
  \ :\\t\" + os.hostname());\n05 console.log(\"type :\\t\\t\" + os.type());\n06 console.log(\"\
  platform :\\t\" + os.platform());\n07 console.log(\"arch :\\t\\t\" + os.arch());\n\
  08 console.log(\"release :\\t\" + os.release());\n09 console.log(\"uptime :\\t\"\
  \ + os.uptime());\n10 console.log(\"loadavg :\\t\" + os.loadavg());\n11 console.log(\"\
  totalmem :\\t\" + os.totalmem());\n12 console.log(\"freemem :\\t\" + os.freemem());\n\
  13 console.log(\"EOL :\\t\" + os.EOL);\n14 console.log(\"cpus :\\t\\t\" + JSON.stringify(os.cpus()));\n\
  15 console.log(\"networkInterfaces : \" +\n16             JSON.stringify(os.networkInterfaces()));\n\
  ```\n\n![Image](img/00113.jpeg)\n\n图 10.1 调用 `os` 模块方法的输出结果。\n\n## 使用 util 模块\n\n\
  `util` 模块某种程度上是一个全能型模块。它提供了用于格式化字符串、将对象转换为字符串、检查对象类型以及向输出流进行同步写入的实用函数，以及一些对象继承的增强。\n\
  \n以下章节涵盖了 `util` 模块的大部分功能。它们还解释了在 Node.js 应用中使用 `util` 模块的方法。\n\n### 格式化字符串\n\n\
  当你处理字符串数据时，通常需要快速格式化字符串。Node.js 在 `util` 模块中提供了一个基本的字符串格式化方法，可以处理许多字符串格式化需求。`util.format()`\
  \ 函数接受格式化字符串作为第一个参数，并返回一个格式化后的字符串。以下是 `format()` 方法的语法，其中 `format` 是格式化字符串，`[...]`\
  \ 代表随其后的参数：\n\n```javascript\nutil.format(format, [...])\n```\n\n`format` 参数是一个可以包含零或多个占位符的字符串。每个占位符以\
  \ `%` 字符开头，并最终替换为对应参数转换后的字符串值。第一个格式化占位符代表第二个参数，依此类推。支持以下占位符：\n\n![Image](img/00003.jpeg)\
  \ `%s`: 指定一个字符串。\n\n![Image](img/00003.jpeg) `%d`: 指定一个数字（可以是整数或浮点数）。\n\n![Image](img/00003.jpeg)\
  \ `%j`: 指定一个可以 JSON 序列化的对象。\n\n![Image](img/00003.jpeg) `%`: 如果留空，则不作为占位符。\n\n在使用\
  \ `format()` 时请记住以下几点：\n\n![Image](img/00003.jpeg) 当参数数量少于占位符时，占位符（如 `%s`）不会被替换。例如：\n\
  \n点击查看代码图像\n\n```javascript\nutil.format('%s = %s', 'Item1'); // 'Item1':%s'\n```\n\
  \n![Image](img/00003.jpeg) 当参数数量多于占位符时，多余的参数转换为字符串并用空格分隔符连接。例如：\n\n点击查看代码图像\n\n\
  ```javascript\nutil.format('%s = %s', 'Item1', 'Item2', 'Item3'); // 'Item1 = Item2\
  \ Item3'\n```\n\n![Image](img/00003.jpeg) 如果第一个参数不是格式化字符串，那么 `util.format()` 会将每个参数转换为字符串，使用空格分隔符将它们连接，然后返回连接后的字符串。例如：\n\
  \n点击查看代码图像\n\n```javascript\nutil.format(1, 2, 3); // '1 2 3'\n```\n\n### 检查对象类型\n\
  \n判断从命令中获取的对象是否是特定类型通常很有用。你可以通过几种不同的方式来实现。例如，一种方法是使用 `instanceof` 运算符，它比较对象类型并返回\
  \ `true` 或 `false`。例如：\n\n点击查看代码图像\n\n```javascript\n([1,2,3] instance of Array)\
  \ //true\n```\n\n`util` 模块还提供了 `isArray(object)`、`isRegExp(object)`、`isDate(object)`\
  \ 和 `isError(object)` 方便方法，用于判断对象是否为 `Array`、`RegExp`、`Date` 或 `Error`。例如：\n\n```javascript\n\
  ([1,2,3] instance of Array) //true\n```\n\n### 同步写入输出流\n\n`util` 模块的一个有用功能是可以同步向\
  \ `stdout` 和 `stderr` 写入数据，这可以确保数据被写入。\n\n为了同步写入数据，可以使用以下调用，它们会阻塞进程直到：\n\n![Image](img/00003.jpeg)\
  \ `util.debug(string)`: 将 `string` 写入 `stderr`。\n\n![Image](img/00003.jpeg) `util.log(string)`:\
  \ 将 `string` 写入 `stdout`，并带有时间戳。例如：\n\n```javascript\nutil.log('Some message.');\
  \ // 30 Nov 13:26:20 - Some message\n```\n\n### 将 JavaScript 对象转换为字符串\n\n通常，特别是在调试时，你需要将\
  \ JavaScript 对象转换为字符串。`util.inspect()` 方法允许你检查对象并返回其字符串表示。\n\n以下是 `inspect()` 方法的语法：\n\
  \n```javascript\nutil.inspect(object, [options])\n```\n\n`object` 参数是你想要转换为字符串的\
  \ JavaScript 对象。`options` 方法允许你控制格式过程的某些方面。`options` 可以包含以下：\n\n![Image](img/00003.jpeg)\
  \ `showHidden`: 设置为 `true` 时，对象的不可枚举属性也会被转换为字符串。默认值为 `false`。\n\n![Image](img/00003.jpeg)\
  \ `depth`: 限制在格式化也是对象的属性时遍历的深度。这可以防止无限循环，并防止复杂对象消耗大量的 CPU 周期。默认值为 `2`；如果为 `null`，则可以无限递归。\n\
  \n![Image](img/00003.jpeg) `colors`: 设置为 `true` 时，输出将带有 ANSI 颜色着色。默认值为 `false`。\n\
  \n![Image](img/00003.jpeg) `customInspect`: 设置为 `false` 时，被检查对象上定义的自定义 `inspect()`\
  \ 函数都不会被调用。默认值为 `true`。\n\n你可以向对象挂载自己的 `inspect()` 函数以控制输出。以下代码创建了一个具有 `first` 和\
  \ `last` 属性的对象，`inspect()` 仅输出 `name` 属性：\n\n```javascript\nvar obj = { first:'Brad',\
  \ last:'Dayley' };\n\nobj.inspect = function(depth) {\n  return '{ name: \"' + this.first\
  \ + \" \" + this.last + '\" }';\n};\n\nconsole.log(util.inspect(obj));\n// { name:\
  \ \"Brad Dayley\" }\n```\n\n### 从其他对象继承功能\n\n\n\n\n\n`util` 模块提供了 `util.inherits()`\
  \ 方法，允许你创建继承自另一个对象的 `prototype` 方法的对象。当你创建一个新对象时，会自动使用这些 `prototype` 方法。你已经在本书的几个示例中看到过这一点了——例如，在实现你自定义的\
  \ `Readable` 和 `Writable` 流时。\n\n以下是 `util.inherits()` 方法的语法：\n\n点击此处查看代码图片\n\n\
  `util.inherits(constructor, superConstructor)`\n\n原型 `constructor` 被设置为原型 `superConstructor`，并会在创建新对象时执行。你可以通过使用\
  \ `constructor.super_` 属性从你的自定义对象构造函数访问 `superConstructor`。\n\nListing 10.2 演示了如何使用\
  \ `inherits()` 继承 `events.EventEmitter` 对象构造函数来创建一个 `Writable` 流。注意第 11 行，该对象是 `events.EventEmitter`\
  \ 的实例。同样注意第 12 行，`Writer.super_` 的值为 `events.EventEmitter`。图 10.2 显示了 Listing 10.2\
  \ 的结果。\n\nListing 10.2 `util_inherit.js`: 使用 `inherits()` 继承来自 `event.EventEmitter`\
  \ 的原型\n\n点击此处查看代码图片\n\n```javascript\n01 var util = require(\"util\");\n02 var events\
  \ = require(\"events\");\n03 function Writer() {\n04   events.EventEmitter.call(this);\n\
  05 }\n06 util.inherits(Writer, events.EventEmitter);\n07 Writer.prototype.write\
  \ = function(data) {\n08   this.emit(\"data\", data);\n09 };\n10 var w = new Writer();\n\
  11 console.log(w instanceof events.EventEmitter);\n12 console.log(Writer.super_\
  \ === events.EventEmitter);\n13 w.on(\"data\", function(data) {\n14     console.log('Received\
  \ data: \"' + data + '\"');\n15 });\n16 w.write(\"Some Data!\");\n```\n\n![Image](img/00114.jpeg)\n\
  \n图 10.2 通过实现 `inherits()` 构建 `Writable` 流的输出。\n\n### 使用 dns 模块\n\n如果你希望 Node.js\
  \ 应用程序能够解析 DNS 域名、查询域名或进行反向查找，那么你会发现 `dns` 模块非常有用。DNS 查询会联系域名服务器并请求有关特定域名的记录。反向查找则联系域名服务器并请求与\
  \ IP 地址关联的 DNS 名称。`dns` 模块提供了你可能需要执行的大多数查询的功能。表 10.2 列出了这些方法及其语法和功能。\n\n![Image](img/00115.jpeg)![Image](img/00116.jpeg)\n\
  \n表 10.2 可在 `dns` 模块调用的方法\n\nListing 10.3 显示了如何执行查找和反向查找。在第 3 行中，`resolve4()` 查找\
  \ IPv4 地址，然后在第 5–8 行中，在这些地址上调用 `reverse()` 并执行反向查找。输出结果如图 10.3 所示。\n\nListing 10.3\
  \ `dns_lookup.js`: 对域名和 IP 地址执行查找和反向查找\n\n点击此处查看代码图片\n\n```javascript\n01 var dns\
  \ = require('dns');\n02 console.log(\"Resolving www.google.com . . .\");\n03 dns.resolve4('www.google.com',\
  \ function (err, addresses) {\n04   console.log('IPv4 addresses: ' + JSON.stringify(addresses,\
  \ false, ' '));\n05   addresses.forEach(function (addr) {\n06     dns.reverse(addr,\
  \ function (err, domains) {\n07       console.log('Reverse for ' + addr + ': ' +\
  \ JSON.stringify(domains));\n08     });\n09   });\n10 });\n```\n\n![Image](img/00117.jpeg)\n\
  \n图 10.3 执行反向查找时执行查找和 DNS 名称的输出。\n\n## 总结\n\n`os` 模块允许你获取有关系统的信息，例如操作系统类型和版本、平台架构以及编程信息（如空闲内存、临时文件夹位置和换行符）。`util`\
  \ 模块是 Node.js 的通用库，包含了用于同步输出和字符串格式化的方法。\n\n\n\n\n\n`document`（文档）是 MongoDB 数据库中单个数据实体表示。`collection`（集合）由一个或多个相关对象组成。MongoDB\
  \ 和 SQL 之间有一个主要区别：MongoDB 文档与 SQL 行非常不同。行数据是非常扁平的，这意味着行中的每个值都有一列。然而，在 MongoDB 中，文档可以包含嵌入的子文档，从而为你的应用程序提供了更贴近的数据模型。\n\
  \n事实上，MongoDB 数据库中表示文档的记录以 `BSON` 格式存储，它是 JSON 的轻量级二进制形式。此外，MongoDB 的字段/值对对应于 JavaScript\
  \ 的属性/值对。这些字段/值对定义了存储在文档中的值。这意味着将 MongoDB 记录转换回你在 Node.js 应用中使用的 JavaScript 对象时，几乎不需要任何转换。\n\
  \n例如，MongoDB 中的一个文档可能结构如下，包含 `name`、`version`、`languages`、`admin` 和 `paths` 字段：\n\
  \n点击此处查看代码图片\n\n```json{\n  name: \"New Project\",\n  version: 1,\n  languages:\
  \ [\"JavaScript\", \"HTML\", \"CSS\"],\n  admin: {name: \"Brad\", password: \"****\"\
  },\n  paths: {temp: \"/tmp\", project:\"/opt/project\", html: \"/opt/project/html\"\
  }\n}\n```\n\n注意，文档结构包含了包含字符串、整数、数组和对象的字段/属性，就像 JavaScript 对象一样。表 11.1 列出了 `BSON`\
  \ 文档中字段值可以设置的不同数据类型。\n\n![Image](img/0011.jpeg)\n\n表 11.1 MongoDB 数据类型及对应的 ID 数字\n\
  \n字段名不能包含 `null` 字符、点 (`.`) 或美元符号 (`$`)。此外，`_id` 字段名预留给对象 ID。`_id` 字段是系统的唯一 ID，由以下部分组成：\n\
  \n![Image](img/00003.jpeg) 表示自最后一个 epoch 以来秒数的 4 字节值\n\n![Image](img/00003.jpeg)\
  \ 3 字节机器标识符\n\n![Image](img/00003.jpeg) 2 字节进程 ID\n\n![Image](img/00003.jpeg) 3\
  \ 字节计数器，从随机值开始\n\nMongoDB 中文档的最大大小为 16MB。这防止了由于查询导致 RAM 被过量使用或对文件系统的密集访问。虽然你可能永远无法接近这个数字，但在设计包含文件数据的某些复杂数据类型时，需要记住最大文档大小。\n\
  \n## MongoDB 数据类型\n\n`BSON` 数据格式提供了在将 JavaScript 对象转换为二进制形式时使用的几种不同类型。这些类型尽可能地匹配\
  \ JavaScript 类型。理解这些类型至关重要，因为你实际上可以通过查询 MongoDB 来查找具有特定属性且值为特定类型的对象。例如，你可以查找数据库中时间戳值为\
  \ `String` 对象的文档，或者查询时间戳值为 `Date` 对象的文档。\n\nMongoDB 为每种数据类型分配了一个从 1 到 255 的整数 ID\
  \ 数字，在按类型查询时会使用该数字。表 11.1 显示了 MongoDB 支持的数据类型列表，以及 MongoDB 用于识别它们的数字。\n\n在处理 MongoDB\
  \ 中不同的数据类型时，你需要注意的另外一点是它们的比较顺序。比较不同 `BSON` 类型的值时，MongoDB 使用以下比较顺序，从低到高：\n\n1. `Min\
  \ Key`（内部类型）\n2. `Null`\n3. `Numbers (32-位整数, 64-位整数, Double)`\n4. `Symbol`, `String`\n\
  5. `Object`\n6. `Array`\n7. `Binary Data`\n8. `Object ID`\n9. `Boolean`\n10. `Date`,\
  \ `Timestamp`\n11. `Regular Expression`\n12. `Max Key`（内部类型）\n\n## 规划你的数据模型\n\n\
  在开始实现 MongoDB 数据库之前，你需要理解所存储数据的性质、数据将如何被存储以及如何被访问。理解这些概念将允许你提前做出决定，并构建数据和你的应用程序以获得最佳性能。\n\
  \n具体来说，你应该回答以下问题：\n\n![Image](img/00003.jpeg) 应用程序将使用哪些基本对象？\n\n![Image](img/00003.jpeg)\
  \ 不同对象类型之间的关系是什么：一对一、一对多还是多对多？\n\n![Image](img/00003.jpeg) 向数据库添加新对象的频率有多高？\n\n\
  ![Image](img/00003.jpeg) 从数据库中删除对象的频率有多高？\n\n![Image](img/00003.jpeg) 修改对象的频率有多高？\n\
  \n![Image](img/00003.jpeg) 访问对象的频率有多高？\n\n![Image](img/00003.jpeg) 将如何访问对象？通过 ID\
  \ 还是属性？\n\n一旦你有了这些问题的答案，就可以考虑集合和文档的结构了。后续章节将讨论你可以利用的不同文档建模方法。\n\n#### 使用文档引用进行数据规范化\n\
  \n数据规范化是组织文档和集合以减少冗余和依赖的过程。你通过识别应该存储为单独文档的子文档来实现数据归一化。通常对于与子对象具有一对多或多对多关系的对象这样做。\n\
  \n数据规范化的优点是数据库尺寸更小，因为每个对象只在自己的集合中存在，而不是在多个对象中重复。此外，如果你频繁修改子对象中的信息，你只需要修改一个实例，而不是集合中的所有记录。\n\
  \n数据归一化的主要缺点是，当你查找需要子对象的对象时，必须进行单独查询。如果你频繁访问数据，这会导致显著的性能影响。\n\n一个适合数据规范化的示例是拥有喜好商店的用户的系统。每个\
  \ `User` 是一个带有 `name`、`phone` 和 `favoriteStore` 属性的对象。`favoriteStore` 属性也是一个子对象，包含\
  \ `name`、`street`、`city` 和 `zip` 属性。\n\n然而，成千上万的用户可能有同一个喜好商店，因此存在高度的一对多关系。因此，在每个\
  \ `User` 对象中存储 `FavoriteStore` 对象数据是不合理的，因为会导致数千次重复。相反，`FavoriteStore` 对象应该包含一个\
  \ `_id` 对象属性，供 `FavoriteStores` 集合中的文档引用。应用程序随后可以使用引用 ID `favoriteStore` 将 `Users`\
  \ 集合的数据与 `FavoriteStores` 集合中的 `FavoriteStore` 文档连接起来。\n\n图 11.1 阐了上述 `Users` 集合和\
  \ `FavoriteStores` 集合的结构。\n\n![Image](img/00119.jpeg)\n\n图 11.1 通过添加对另一个集合文档的引用定义规范化的\
  \ MongoDB 文档。\n\n#### 使用嵌入文档进行数据反规范化\n\n数据反规范化是识别主对象的子对象，并将其直接嵌入主对象文档中的过程。通常你对于那些大部分为一对一关系，或者相对较小且更新不频繁的对象这样做。\n\
  \n\n\n\n\n反范一化文档的主要优势是，你可以通过一次查询获取完整的对象，而无需进行额外的查询来组合来自其他集合的子对象。这是一项重大的性能提升。缺点是，对于一对多的关系的子对象，你将在每个文档中存储一个单独的副本，这会略微减慢插入速度并占用额外的磁盘空间。\n\
  \n数据反范一化具有合理性的一个示例是：包含用户家庭和工作联系信息的系统。用户是一个由 `User` 文档表示的对象，具有 `name`、`home` 和 `work`\
  \ 属性。`home` 和 `work` 属性是子对象，包含 `phone`、`street`、`city` 和 `zip` 属性。\n\n用户的 `home`\
  \ 和 `work` 属性在用户身上变化得并不频繁。你可能拥有多个来自住同一个家庭的用户，但人数可能不会很多，而且子对象内部的实际值并不大，也不会频繁更改。因此，将\
  \ `home` 联系信息直接存储在 `User` 对象中是合理的。\n\n`work` 属性则需要更多的思考。到底会有多少人拥有相同的工作联系信息？如果答案不多，那么\
  \ `Work` 对象应该嵌入到 `User` 对象中。你多久查询一次 `User` 对象并需要 `work` 联系信息？如果答案非常罕见，你可能希望将 `work`\
  \ 范化到它自己的集合中。然而，如果答案是频繁或总是，那么你可能会将 `work` 嵌入到 `User` 对象中。\n\n图 11.2 展示了上述描述的嵌入了家庭和工作联系信息的\
  \ `User` 对象结构。\n\n![Image](img/00120.jpeg)\n\n图 11.2 通过在文档内部实现嵌入对象来定义反范化的 MongoDB\
  \ 文档。\n\n### 使用固定集合（Capped Collections）\n\nMongoDB 的强大功能是可以创建固定集合。`capped collection`（固定集合）是一个具有固定大小的集合。当需要向超过集合大小的集合写入新文档时，集合中最旧的文档将被删除，并插入新文档。固定集合对于插入、检索和删除频率很高的对象效果非常好。\n\
  \n以下是使用固定集合的益处：\n\n![Image](img/00003.jpeg) 它们保证了插入顺序被保留。因此，查询不需要利用索引即可按照存储的顺序返回文档，消除了索引的开销。\n\
  \n![Image](img/00003.jpeg) 它们还通过禁止增加文档大小的更新，保证了插入顺序与磁盘上的顺序完全一致。这消除了重新定位和管理文档新位置的开销。\n\
  \n![Image](img/00003.jpeg) 它们会自动移除集合中最旧的文档。因此，你不需要在你的应用程序代码中实现删除逻辑。\n\n不过，在使用固定集合时需要小心，因为它们受到以下限制：\n\
  \n![Image](img/00003.jpeg) 文档一旦插入固定集合中，就无法更新为更大的大小。你可以更新它们，但数据必须保持相同或更小。\n\n![Image](img/00003.jpeg)\
  \ 文档不能从固定集合中删除。这意味着即使数据未被使用，它也会占用磁盘空间。你可以显式地删除（drop）固定集合来有效删除所有条目，但随后你需要重新创建它才能再次使用。\n\
  \n固定集合的一个极佳用途是系统中的事务滚动日志。你可以随时访问最后 `X` 条日志记录，而无需显式清理最旧的记录。\n\n### 理解原子写入操作\n\n在\
  \ MongoDB 中，写入操作是原子的，在文档级别一次只执行一次写入。这意味着同一时间只有一个进程可以更新单个文档或单个集合。因此，写入反范一化的文档是原子的。然而，写入范一化的文档需要对其他集合中的子对象进行分离的写入操作，因此范化对象的写入作为一个整体来说可能不是原子的。\n\
  \n在设计文档和集合时，你需要记住原子写入，以确保你的设计符合应用程序的需求。换句话说，如果你绝对必须以原子方式整体写入对象的所有部分，那么你需要以反范一化的方式来设计该对象。\n\
  \n### 考虑文档增长\n\n当你更新文档时，需要考虑新数据对文档增长的影响。MongoDB 在文档中提供了一些填充空间，以允许在更新期间进行典型的增长。然而，如果更新导致文档增长到超过在磁盘上分配的空间，MongoDB\
  \ 必须将该文档重新定位到磁盘上的新位置，从而对系统造成性能影响。此外，频繁的文档重新定位会导致磁盘碎片问题——例如，如果文档包含一个数组而你向数组中添加了足够的元素。\n\
  \n缓解文档增长的一种方法是对于可能频繁增长的属性使用范化对象。例如，与其使用数组来存储 `Cart` 对象中的项目，你可以为 `CartItems` 创建一个集合，并将放入\
  \ `Cart` 对象中的新项目作为新文档存储在 `CartItems` 集合中，并在其中引用用户的 `Cart` 项目。\n\n### 识别索引、分片和复制的机会\n\
  \nMongoDB 提供了几种机制来优化性能、可扩展性和可靠性。在你考虑数据库设计时，应该考虑以下每个选项：\n\n![Image](img/00003.jpeg)\
  \ **索引（Indexing）：** 索引通过构建易于排序的查找索引来提高频繁查询的性能。集合的 `_id` 属性会自动建立索引，因为通过 ID 查找项是常见做法。然而，在实施增强其他访问方法的索引之前，还需要考虑用户访问数据的方式。\n\
  \n![Image](img/00003.jpeg) **分片（Sharding）：** 分片是将大型数据集合切分并分布在集群中多个 MongoDB 服务器上的过程。每个\
  \ MongoDB 服务器被视为一个分片。这提供了利用多个服务器来支持大型系统大量请求的优势。它因此为你的数据库提供了水平扩展能力。你应该查看数据的大小和访问它的请求数量，以决定是否以及如何对你的集合进行分片。\n\
  \n![Image](img/00003.jpeg) **复制（Replications）：** 复制是在集群中的多个 MongoDB 实例上复制数据的过程。在考虑数据库的可靠性时，你应该实现复制，以确保关键数据的备份副本始终可用。\n\
  \n#### 大集合对比大量数量的集合\n\n在设计 MongoDB 文档和集合时，另一个重要的考虑因素是设计所需的集合数量。对于拥有大量集合，实际上并没有显著的性能损耗，但在同一个集合中包含大量项目则会有性能损耗。你应该考虑如何将你的大型集合拆分成更易消费的块。\n\
  \n\n\n\n\n例如，假设你在数据库中存储了用户过去购买的交易历史。你意识到，对于这些已完成的购买，你永远不需要为了多个用户一起查询它们。你只需要让这些数据可用，以便用户查看自己的历史记录。如果你有成千上万拥有大量交易的用户，那么为每个用户将这些历史存储在单独的集合（collection）是有意义。\n\
  \n######决定数据生命周期\n\n数据库设计中最常被忽视的方面之一是数据生命周期。文档在特定集合中应该存在多久？某些集合中的文档应该是永久的——例如活跃用户账户。然而，请记住，查询集合时，系统中的每个文档都会产生性能影响。你应该为每个集合中的文档定义一个\
  \ `TTL`（生存时间，time-to-live）值。\n\n在 MongoDB 中实现生存时间机制有多种方法。其中一种是在你的应用程序中编写代码来监控和清理旧数据。另一种方法是利用\
  \ MongoDB 集合 `TTL` 设置，它允许你定义一个配置，使文档在若干秒后或特定的钟时间自动删除。对于你只需要最新文档的集合，另一种方法是实现顶层集合（capped\
  \ collection），它可以自动保持集合的大小较小。\n\n###考虑数据可用性和性能\n\n设计 MongoDB 数据库时要考虑的最事项之一是数据使用以及它将如何影响性能。之前的章节描述了解决数据大小和优化某些复杂性的不同方法。你应该考虑甚至重新考虑的最后一点是数据可用性和性能。最终，这些是任何\
  \ Web 解决方案最重要的两个方面，随之背后的存储也是如此。\n\n数据可用性是数据库满足网站功能的能力。你需要确保数据可以被访问，以便网站能够正常运行。用户不会容忍一个无法按照其意愿运行的网站。数据的准确性在这里也很重要。\n\
  \n然后你可以考虑性能。你的数据库必须能够以合理的交付数据。本章的后续部分将帮助你评估和设计数据库的性能因素。\n\n在某些更复杂的情况下，你可能会发现有必要评估数据可用性然后是性能，然后回到可用性，经过几次循环直到获得正确的平衡。此外，请记住，在今天，可用性需求可能会随时变化。记住这会影响你如何设计文档和集合，以便在未来必要时它们能够具有更强的扩展性。\n\
  \n## 总结\n\n大多数大规模 Web 应用程序和服务的核心是高性能数据存储解决方案。后端数据存储层负责存储从用户账户信息到购物车项目再到博客和评论数据的所有内容。良好的\
  \ Web 应用程序必须能够准确、快速和可靠地存储和检索数据。因此，你选择的数据存储机制必须达到满足用户需求的水平。\n\n有多种不同的数据存储解决方案可以存储和检索你的\
  \ Web 应用程序所需的数据。最常见的三个是文件系统直接存储、关系型数据库和 NoSQL 数据库。本书关注的数据存储器是 MongoDB，它是一种 NoSQL\
  \ 数据库。\n\n在本章中，你学习了 MongoDB 以及关于数据结构和数据库配置的设计考虑。你学习了集合、文档以及可以存储在其中的数据类型。你还学习了如何规划数据模型、需要回答的问题，以及\
  \ MongoDB 内置的满足数据库需求的机制。\n\n### 下一步预告\n\n在下一章中，你将有机会安装 MongoDB。你还将看到如何利用 MongoDB\
  \ shell 来设置用户账户并访问集合和文档。\n\n## 12. 开始使用 MongoDB\n\n本章将带你熟悉 MongoDB。虽然 第 11 章“理解\
  \ NoSQL 和 MongoDB”侧重于 MongoDB 的理论方面，但本章完全关于实际应用。你将学习安装 MongoDB、启动和停止引擎以及访问 MongoDB\
  \ shell 所需要的知识。MongoDB shell 允许你管理 MongoDB 服务器，并在 MongoDB 数据库上执行每个必要的功能。使用 MongoDB\
  \ shell 是开发过程以及数据库管理中至关重要的方面。\n\n本章涵盖了安装 MongoDB 和访问 shell。然后你将学习一些基本的管理任务，例如设置用户账户和身份验证。本章以关于如何管理数据库、集合和文档的章节结束。\n\
  \n## 构建 MongoDB 环境\n\n要开始使用 MongoDB，首要任务是在你的开发系统上安装它。然后你就可以尝试它的功能，学习 MongoDB shell，并为\
  \ 第 13 章“开始使用 MongoDB 和 Node.js”做好准备，在在那里你将开始在 Node.js 应用中集成 MongoDB。\n\n接下来的章节涵盖了安装、启动和停止数据库引擎以及访问\
  \ shell 客户端。当你能够做到这些时，你就准备好在你的环境中使用 MongoDB 了。\n\n### 安装 MongoDB\n\n在 Node.js 环境中实现\
  \ MongoDB 的第一步是安装 MongoDB 服务器。每个主要平台都有对应版本的 MongoDB：Linux、Windows、Solaris 和 OS X。对于\
  \ Red Hat、SuSE、Ubuntu 和 Amazon Linux 发行版也有企业版本。MongoDB 企业版是基于订阅的，提供了增强的安全、管理和集成支持。\n\
  \n对于本书和学习 MongoDB 而言，MongoDB 的标准版是完美的。在继续本章之前，你应该访问 [`docs.mongodb.org/manual/installation/`](http://docs.mongodb.org/manual/installation/)\
  \ 并按照指令在环境中下载并安装 MongoDB。你需要遵循的步骤：\n\n1. 下载并解压 MongoDB 文件。\n2. 将 `<mongo_install_location>/bin`\
  \ 添加到系统路径。\n3. 创建数据目录 `<mongo_data_location>/data/db`。\n4. 从控制台启动 MongoDB：\n\n点击查看代码图像\n\
  \n```\nmongod –dbpath <mongo_data_location>/data/db\n```\n\n### 启动 MongoDB\n\n安装\
  \ MongoDB 后，你需要能够启动和停止数据库引擎。通过执行 `<mongo_install_location>/bin` 中的 `mongod` 可执行文件（Windows\
  \ 上为 `mongod.exe`）来启动它。该执行文件启动 MongoDB 并在配置的端口上监听数据库请求。\n\n你可以通过设置不同的参数来控制 `mongod`\
  \ 可执行文件。例如，你可以配置 MongoDB 监听的 IP 地址和端口，以及日志和身份验证。表 12.1 提供了一些常用参数的列表。\n\n![图像](img/00121.jpeg)\n\
  \n表 12.1 `mongod` 参数\n\n使用 `port` 和 `dbpath` 参数启动 MongoDB 的示例：\n\n点击查看代码图像\n\n```\n\
  mongod –port 28008 –dbpath <mongo_data_location>/data/db\n```\n\n#### 停止 MongoDB\n\
  \n\n\n\n\n每个平台停止已启动的 `mongod` 可执行文件的方法各不相同。然而，最好的方法之一是从 shell 客户端进行，因为这样可以干净地关闭当前操作并强制\
  \ `mongod` 退出。\n\n要停止 MongoDB 数据库，你应该在控制台窗口中执行以下命令来打开 MongoDB shell 客户端：\n\n```bash\n\
  mongo\n```\n\n然后从 MongoDB shell 客户端中，使用以下命令切换到 `admin` 数据库，然后关闭数据库引擎：\n\n```bash\n\
  use admin\ndb.shutdownServer()\n```\n\n## 从 Shell 客户端访问 MongoDB\n\n一旦你安装、配置并启动了\
  \ MongoDB，你就可以通过 MongoDB shell 访问它。MongoDB shell 是 MongoDB 提供的的一个交互式 shell，允许你访问、配置和管理\
  \ MongoDB 数据库、用户等更多内容。你可以在 shell 中完成从设置用户账户、创建数据库到查询数据库内容的所有操作（所有操作都可以使用 shell）。\n\
  \n接下来的章节将带你了解在 MongoDB shell 中执行的一些最常见管理任务。在这里，你将学习如何创建用户账户、数据库和集合，以便你能够遵循书中其余示例进行操作。此外，你还应该能够对文档进行至少基本的查询，以便更好地解决数据访问中的任何问题。\n\
  \n要启动 MongoDB shell，在控制台提示符处执行 `mongo` 命令，shell 就会如图 12.1 所示启动。\n\n![Image](img/00122.jpeg)\n\
  \n图 12.1 启动 MongoDB shell。\n\n一旦访问 MongoDB shell，你就可以管理 MongoDB 的所有方面。请记住，当你使用 MongoDB\
  \ shell 时它是基于 JavaScript 的，因此大多数 JavaScript 语法都是可用的。你还应该记住，shell 直接访问服务器上的数据库和集合，因此你在\
  \ shell 中所做的更改和执行的任务将直接影响服务器上的数据和性能。\n\n### 理解 MongoDB Shell 命令\n\nMongoDB shell\
  \ 提供了几个可以从 shell 提示符执行的命令。你需要熟悉这些命令，因为你将频繁使用它们：\n\n![Image](img/00003.jpeg) `help\
  \ <option>`：显示 MongoDB shell 命令的语法帮助。`option` 参数允许你指定想要获取帮助的特定区域。\n\n![Image](img/00003.jpeg)\
  \ `use <database>`：更改当前的 `database` 句柄。数据库操作将在当前数据库句柄上处理。\n\n![Image](img/00003.jpeg)\
  \ `show <option>`：根据 `option` 参数显示列表。`option` 的值可以是：\n\n![Image](img/00003.jpeg)\
  \ `dbs`：显示数据库列表。\n\n![Image](img/00003.jpeg) `collections`：显示当前数据库的集合列表。\n\n![Image](img/00003.jpeg)\
  \ `profile`：显示执行超过 1 毫秒的最新 `system.profile` 条目。\n\n![Image](img/00003.jpeg) `log\
  \ [name]`：显示登录内存的最后一段。如果未指定 `name`，则使用 `global`。\n\n![Image](img/00003.jpeg) `exit`：退出数据库。\n\
  \n### 理解 MongoDB Shell 方法\n\nMongoDB shell 提供了许多用于执行管理功能的方法。你可以直接从 MongoDB shell\
  \ 调用这些方法，也可以从在 MongoDB shell 中执行的脚本中调用这些方法。\n\n你将使用大量的方法来执行各种管理功能。其中一些内容将在本书的后的章节和章节中介绍。目前，你需要了解\
  \ shell 方法类型以及如何访问它们。以下列表提供了几个 shell 方法的示例：\n\n![Image](img/00003.jpeg) `load(script)`：在\
  \ shell 内部加载并运行 JavaScript 文件。使用它是为数据库操作编写脚本的极佳方法。\n\n![Image](img/00003.jpeg) `UUID(string)`：将\
  \ 32 字节的十六进制字符串转换为 BSON UUID。\n\n![Image](img/00003.jpeg) `db.auth(username, password)`：对当前数据库进行身份验证。\n\
  \n还有许多其他 shell 方法。其中许多将在随后的章节中介绍。要查看原生方法的完整列表，请查看 [`docs.mongodb.org/manual/reference/method/#native`](http://docs.mongodb.org/manual/reference/method/#native)。\n\
  \n### 理解命令参数和结果\n\nMongoDB shell 是一个与 MongoDB 数据结构紧密耦合的交互式 JavaScript shell。这意味着大部分数据交互——从传递给方法的参数到从方法返回的数据——都是标准的\
  \ MongoDB 文档，这些文稿在大多数方面上仅仅是 JavaScript 对象。例如，在创建用户时，你传递一个类似于下面的文档来定义用户：\n\n点击此处查看代码图像\n\
  \n```javascript\ndb.addUser( {\n  user: \"testUser\",\n  userSource: \"test\",\n\
  \  roles: [ \"read\" ],\n  otherDBRoles: { testDB2: [ \"read\" ] }\n})\n```\n\n\
  ### MongoDB shell 脚本化\n\n如你所见，MongoDB shell 的命令、方法和数据结构都是基于 JavaScript 的。管理 MongoDB\
  \ 的一种极方法是创建可以多次运行或在特定时间（如升级时）准备就的脚本。\n\n脚本文件可以包含任意数量的 MongoDB 命令，并将 JavaScript 代码作为条件语句和循环。运行\
  \ MongoDB shell 脚本有两种方法。第一种是从命令行使用 `--eval`。`--eval` 参数接受 JavaScript 字符串或 JavaScript\
  \ 文件，并启动 MongoDB shell 后立即执行它。\n\n例如，以下命令启动 MongoDB 并在 test 数据库上执行 `db.getCollections()`。然后它输出\
  \ JSON 字符串结果，如图 12.2 所示：\n\n```bash\nmongo test --eval \"printjson(db.getCollectionNames())\"\
  \n```\n\n![Image](img/00123.jpeg)\n\n图 12.2 从 MongoDB shell 命令行执行 JavaScript 文件。\n\
  \n注意：如果你使用了身份验证（你应该这样做的），脚本可能需要身份验证以执行命令。\n\n你也可以通过使用 `load(script_path)` 方法运行 MongoDB\
  \ shell 脚本。该方法加载 JavaScript 文件并立即执行它。例如，以下 shell 命令加载并执行 `db_update.js` 脚本文件：\n\n\
  ```javascript\nload(\"/tmp/db_update.js\")\n```\n\n\n\n\n\n用户帐户存储在每个数据库的 `db.system.users`\
  \ 集合中。`User` 对象包含 `_id`、`user`、`pwd`、`roles` 以及有时包含 `otherDBRoles` 字段。有几种方法可以获取用户列表。一种是切换到你想列出用户的数据库，然后执行\
  \ `show users` 命令。下面的示例切换到 `admin` 数据库并如图 12.3 所示列出用户：\n\n```\nuse admin\n\nshow\
  \ users\n```\n\n![Image](img/00124.jpeg)\n\n图 12.3 在 `admin` 数据库上列出用户。\n\n你也可以对\
  \ `db.system.users` 集合使用 `find` 等查询。然而，`db.system.users.find()` 返回一个游标对象，你可以使用它来访问\
  \ `User` 文档。例如，以下代码获取 `admin` 数据库中用户的游标并返回用户计数：\n\n点击此处查看代码图像\n\n```\nuse admin\n\
  \ncur = db.system.users.find()\n\ncur.count()\n```\n\n## 创建用户帐户\n\n一旦你创建了用户管理员，就可以使用该帐户创建其他可以管理、读取和写入数据库的用户帐户。你通过在\
  \ MongoDB shell 中使用 `addUser()` 方法来添加用户帐户。`addUser()` 方法接受一个 `document` 对象，它允许你指定适用于该用户的用户名、角色和密码。表\
  \ 12.2 列出了你可以在 `document` 对象中指定的字段。\n\n![Image](img/00125.jpeg)\n\n表 12.2 使用 `addUser()`\
  \ 方法创建用户时使用的字段\n\nMongoDB 提供了许多可以分配给用户帐户的角色。这些角色允许你对用户帐户实现复杂的权限和限制。表 12.3 列出了某些可以分配给用户的最常见角色。\n\
  \n![Image](img/00126.jpeg)\n\n表 12.3 可以分配给用户帐户的数据库角色\n\n***\n\n**注意**\n\n`readAnyDatabase`、`readWriteAnyDatabase`、`dbAdminAnyDatabase`\
  \ 和 `userAdminAnyDatabase` 只能应用于 `admin` 数据库中的用户，因为它们必须适用于所有数据库。\n\n***\n\n要创建一个用户，你应该先切换到该数据库，然后使用\
  \ `addUser()` 方法创建用户对象。下面的 MongoDB shell 命令说明了如何在 `test` 数据库中创建一个基础管理员用户：\n\n点击此处查看代码图像\n\
  \n```\nuse test\n\ndb.addUser( { user: \"testUser\",\n\n    pwd: \"test\",\n\n \
  \   roles: [ \"readWrite\", \"dbAdmin\" ] } )\n```\n\n现在是一个更复杂的示例，它使用 `otherDBRoles`\
  \ 将用户添加到多个数据库中。请记住，你只能在 `admin` 数据库上使用 `otherDBRoles`。以下命令将同一个用户添加到 `admin` 数据库并仅赋予\
  \ `read` 权限，同时授予其 `testDB2` 数据库的 `readWrite` 权限：\n\n点击此处查看代码图像\n\n```\nuse admin\n\
  \ndb.addUser( { user: \"testUser\",\n\n    userSource: \"test\",\n\n    roles: [\
  \ \"read\" ],\n\n    otherDBRoles: { testDB2: [ \"readWrite\" ] } } )\n```\n\n##\
  \ 移除用户\n\n你可以使用 `removeUser(<username>)` 方法从 MongoDB 中移除用户。你需要先切换到用户所在的数据库。例如，要从\
  \ `testDB` 数据库中移除 `testUser` 用户，可以在 MongoDB shell 中使用以下命令：\n\n```\nuse testDB\n\n\
  db.removeUser(\"testUser\")\n```\n\n## 配置访问控制\n\n你在 MongoDB shell 中想要执行的首次任务之一是添加用户以配置访问控制。MongoDB\
  \ 在数据库级别提供身份验证和授权，这意味着用户存在于单个数据库的上下文中。为了基本的身份验证，MongoDB 将用户凭据存储在每个数据库名为 `system.users`\
  \ 的集合中。\n\n最初，`admin` 数据库没有分配任何用户。当 `admin` 数据库中没有定义用户时，MongoDB 允许本地主机连接拥有数据库的完全管理权限。因此，设置新\
  \ MongoDB 实例的第一步是创建用户管理员和数据库管理员帐户。用户管理员帐户具有在 `admin` 和其他数据库中创建用户帐户的能力。你还需要创建一个数据库管理员帐户，作为超级用户使用来管理数据库、集群、复制以及\
  \ MongoDB 的其他方面。\n\n***\n\n**注意**\n\n你在 `admin` 数据库中创建用户管理员和数据库管理员帐户。如果你为 MongoDB\
  \ 数据库使用了身份验证，你必须以这些用户之一的身份验证 `admin` 数据库，以便管理用户或数据库。你还应该如上一节所述，为每个数据库创建用于访问的用户帐户。\n\
  \n***\n\n### 创建用户管理员帐户\n\n配置访问控制的第一步是实现用户管理员。用户管理员应该只拥有创建用户的权限，而不管理数据库。下面的示例创建了一个用户名为\
  \ `useradmin`、密码为 `test` 的用户管理员，如图 12.4 所示：\n\n点击此处查看代码图像\n\n```\nuse admin\n\n\
  db.addUser( { user: \"useradmin\",\n\n    pwd: \"test\",\n\n    roles: [ \"userAdmin\"\
  \ ] } )\n```\n\n![Image](img/00127.jpeg)\n\n图 12.4 创建用户管理员。\n\n### 开启身份验证\n\n创建用户管理员帐户后，你需要通过\
  \ `--auth` 参数重启 MongoDB 数据库，如下：\n\n点击此处查看代码图像\n\n```\nmongod --dbpath <mongo_location>/data/db\
  \ --auth\n```\n\n客户端现在需要用户名和密码访问数据库。此外，当你从 shell 访问 MongoDB 时，执行以下命令对 `admin` 数据库进行身份验证，以便添加具有权限的用户：\n\
  \n点击此处查看代码图像\n\n```\nuse admin\n\ndb.auth(\"useradmin\", \"test\")\n```\n\n你也可以在启动\
  \ MongoDB shell 时通过 `--username` 和 `--password` 选项并指定 `admin` 数据库来进行身份验证，如示例所示：\n\
  \n点击此处查看代码图像\n\n```\nmongo admin --username \"useradmin\" --password \"test\"\n\
  ```\n\n### 创建数据库管理员帐户\n\n通过在 MongoDB shell 中访问 `admin` 数据库并执行 `addUser` 方法来创建数据库管理员帐户。然后添加一个具有\
  \ `readWriteAnyDatabase`、`dbAdminAnyDatabase` 和 `clusterAdmin` 权限的用户。这使得用户能够访问系统中的所有数据库、创建新数据库并管理\
  \ MongoDB 集群和副本。下面的示例创建了一个名为 `dbadmin` 的数据库管理员：\n\n点击此处查看代码图像\n\n```\nuse admin\n\
  \ndb.addUser( { user: \"dbadmin\",\n\n    pwd: \"test\",\n\n    roles: [ \"readWriteAnyDatabase\"\
  , \"dbAdminAnyDatabase\", \"clusterAdmin\" ] } )\n```\n\n\n\n\n随后，你可以使用该用户在 MongoDB\
  \ shell 中管理数据库。一旦你创建了新的管理员账户，就可以使用以下命令作为该用户进行身份验证：\n\n```\nuse admin\n\ndb.auth(\"\
  dbadmin\", \"test\")\n```\n\n你也可以在启动 MongoDB shell 时使用 `--username` 和 `--password`\
  \ 选项以数据库管理员的身份验证到 `admin` 数据库，例所示：\n\n点击此处查看代码图像\n\n```\nmongo admin --username\
  \ \"dbadmin\" --password \"test\"\n```\n\n## 管理数据库\n\n为了在 MongoDB shell 中管理数据库，你需要使用一个具有\
  \ `clusterAdmin` 权限的用户账户，例如本章稍早描述的数据库管理员账户。一旦创建了这样的数据库管理员账户，就可以作为该用户进行身份验证，并执行后续章节中描述的任务。\n\
  \n### 显示数据库列表\n\n通常，你可能只需要查看已创建的数据库列表，特别是当你创建了大量数据库或者你不是系统唯一的管理员时。要查看系统中的数据库列表，请使用\
  \ `show dbs` 命令：\n\n```\nshow dbs\n```\n\n### 切换当前数据库\n\n你通过使用 MongoDB 内置的句柄 `db`\
  \ 来执行数据库操作。许多操作只能应用于单个数据库。因此，若要在其他数据库上执行操作，你需要更改 `db` 句柄指向不同的数据库。\n\n要切换当前数据库，你可以使用\
  \ `db.getSiblingDB(database)` 方法或 `use <database>`。例如，以下两种方法都可以将当前数据库句柄切换到 `testDB`：\n\
  \n点击此处查看代码图像\n\n```\ndb = db.getSiblingDB('testDB')\n\nuse testDB\n```\n\n这两种方法任其一均可，并将\
  \ `db` 的值设置为指定的数据库。然后你可以使用 `db` 来管理新的当前数据库。\n\n### 创建数据库\n\nMongoDB 在 shell 中没有提供显式创建数据库的命令。相反，你可以简单地使用\
  \ `use <new_database_name>` 来创建一个新的数据库句柄。请记住，在向新数据库添加集合（collection）之前，该数据库不会被实际保存。例如，以下命令创建一个名为\
  \ `newDB` 的新数据库，然后向其中添加一个名为 `newCollection` 的集合：\n\n点击此处查看代码图像\n\n```\nuse newDB\n\
  \ndb.createCollection(\"newCollection\")\n```\n\n要验证新数据库是否存在，你可以可以使用 `show dbs`，如图\
  \ 12.5 所示。\n\n![Image](img/00128.jpeg)\n\n图 12.5 在 MongoDB shell 中创建新数据库。\n\n###\
  \ 删除数据库\n\n一旦创建了数据库，它就会一直存在于 MongoDB 中，直到管理员将其删除。删除数据库是某些系统中常见的任务，特别是当创建数据库用于存储临时数据时。当数据库变得过时时，直接删除并根据需要创建新数据库，有时比尝试清理数据库中的条目要简单。\n\
  \n要从 MongoDB shell 中删除数据库，请使用 `dropDatabase()` 方法。例如，要删除 `newDB` 数据库，使用以下命令切换到 `newDB`\
  \ 数据库然后将其删除：\n\n```\nuse newDB\n\ndb.dropDatabase()\n```\n\n你应该注意，`dropDatabase()`\
  \ 会移除当前数据库，但它不会更改当前数据库句柄。这意味着如果你删除了一个数据库，然后在未先切换当前数据库的情况下使用该句柄创建集合，被删除的数据库将被重新创建。\n\
  \n图 12.6 显示了从 MongoDB 中删除 `newDB` 的示例。\n\n![Image](img/00129.jpeg)\n\n图 12.6 在 MongoDB\
  \ shell 中删除数据库。\n\n### 复制数据库\n\n数据库的另一个常见任务是复制。复制数据库会创建一个该数据库的副本，除了名称外，与原数据库完全相同。有几个原因可能让你想要复制数据库——例如，在执行重大更改时进行备份，或者作为归档。\n\
  \n要创建数据库的副本，你需要切换到该数据库，然后使用 `copyDatabase(origin, destination, [hostname])` 创建副本。`origin`\
  \ 参数是一个字符串，指定要复制的数据库名称。`destination` 参数指定在当前 MongoDB 服务器上要创建的数据库名称。如果你从不同的主机复制数据库，可选的\
  \ `hostname` 参数指定了源数据库 MongoDB 服务器的主机名。例如：\n\n点击此处查看代码图像\n\n```\ndb.copyDatabase('customers',\
  \ 'customers_archive')\n```\n\n## 管理集合\n\n作为数据库管理员，你可能会发现自己正在管理数据库中的集合。MongoDB 在\
  \ MongoDB shell 中提供了创建、查看和操作数据库中集合的功能。以下章节涵盖了你使用 MongoDB shell 所需的基础知识，用于列出集合、创建新集合以及访问其中包含的文档。\n\
  \n### 显示数据库中的集合列表\n\n你通常需要查看数据库中包含的集合列表——例如，验证某个集合是否存在，或者找到你忘记的集合名称。要查看数据库中的集合列表，你需要切换到该数据库，然后使用\
  \ `show collections`。例如，以下命令列出 `test` 数据库中的集合：\n\n```\nuse test\n\nshow collections\n\
  ```\n\n### 创建集合\n\n在向数据库存储文档之前，必须创建一个集合。要创建集合，需要在数据库句柄上调用 `createCollection(name,\
  \ [options])`。`name` 参数是新集合的名称。可选的 `options` 参数是一个对象，可以包含表 12.4 中列出的属性，这些属性定义了集合的行为。\n\
  \n![Image](img/00130.jpeg)\n\n表 12.4 创建集合时可以指定的选项\n\n例如，以下代码在 `testDB` 数据库中创建一个名为\
  \ `newCollection` 的新集合，如图 12.7 所示：\n\n点击此处查看代码图像\n\n```\ndb.createCollection(\"\
  newCollection\")\n```\n\n![Image](img/00131.jpeg)\n\n图 12.7 在 MongoDB shell 中创建新集合。\n\
  \n### 删除集合\n\n有时你想移除不再需要的旧集合。移除旧集合可以释放磁盘空间并消除与集合相关的开销（例如索引）。\n\n要在 MongoDB shell\
  \ 中删除集合，你需要切换到正确的数据库，获取集合对象，然后在该对象上调用 `drop()` 函数。例如，以下代码从 `testDB` 数据库中删除 `newCollection`\
  \ 集合，如图 12.8 所示：\n\n点击此处查看代码图像\n\n```\nuse testDB\n\nshow collections\n\ncoll =\
  \ db.getCollection(\"newCollection\")\n\ncoll.drop()\n\nshow collections\n```\n\n\
  ![Image](img/00132.jpeg)\n\n图 12.8 在 MongoDB shell 中删除集合。\n\n### 在集合中查找文档\n\n大多数时候，你使用库（如原生\
  \ MongoDB 驱动或 Mongoose）来访问集合中的文档。然而，有时你需要在 MongoDB shell 内部查看文档。\n\nMongoDB shell\
  \ 提供了完整的查询功能，通过集合对象对象的 `find(query)` 方法查找集合中的文档。可选的 `query` 参数指定了一个查询文档，其中包含字段和值用于匹配集合中的文档。匹配查询的文档将从集合中移除。在不带\
  \ `query` 参数的情况下使用 `find()` 方法将返回集合中的所有文档。\n\n\n\n\n例如，以下代码行首先查询集合中的每一项，然后检索 `speed`\
  \ 字段等于 `120mph` 的文档（参见图 12.9）：\n\n点击此处查看代码图像\n\n```javascript\nuse testDB\ncoll\
  \ = db.getCollection(\"newCollection\")\ncoll.find()\ncoll.find({speed:\"120mph\"\
  })\n```\n\n![Image](img/00133.jpeg)\n\n图 12.9 在集合中查找文档。\n\n## 向集合中添加文档\n\n通常情况下，你通过\
  \ Node.js 应用程序向集合中插入文档。但在某些情况下，你可能需要从管理角度手动插入文档，以预加载数据库、修复数据库或出于测试目的。\n\n要向集合中添加文档，你需要获取\
  \ `collection` 对象，然后在该对象上调用 `insert(document)` 或 `save(document)` 方法。`document`\
  \ 参数是一个格式良好的 JavaScript 对象，它会被转换为 BSON 并存储在集合中。例如，以下命令在集合内部创建了三个新文档，如图 12.10 所示：\n\
  \n点击此处查看代码图像\n\n```javascript\nuse testDB\ncoll = db.getCollection(\"newCollection\"\
  )\ncoll.find()\ncoll.insert({ vehicle: \"plane\", speed: \"480mph\" })\ncoll.insert({\
  \ vehicle: \"car\", speed: \"120mph\" })\ncoll.insert({ vehicle: \"train\", speed:\
  \ \"120mph\" })\ncoll.find()\n```\n\n![Image](img/00134.jpeg)\n\n图 12.10 在集合中创建文档。\n\
  \n## 从集合中删除文档\n\n通常情况下你通过 Node.js 应用程序从集合中删除文档。但在某些情况下，你可能需要从管理角度手动移除文档，以修复数据库或出于测试目的。\n\
  \n要从集合中移除文档，你需要获取 `collection` 对象，然后在该对象上调用 `remove(query)` 方法。可选的 `query` 参数指定了一个查询文档，其中包含字段和值，用于匹配集合中的文档。匹配查询的文档将从集合中移除。使用不带\
  \ `query` 参数的 `remove()` 方法将移除集合中的所有文档。例如，以下命令首先移除 `vehicle` 为 `plane` 的文档，然后移除集合中的所有文档，如图\
  \ 12.11 所示：\n\n```javascript\nuse testDB\ncoll = db.getCollection(\"newCollection\"\
  )\ncoll.find()\ncoll.remove({vehicle: \"plane\"})\ncoll.find()\ncoll.remove()\n\
  coll.find()\n```\n\n![Image](img/00135.jpeg)\n\n图 12.11 从集合中删除文档。\n\n## 更新集合中的文档\n\
  \n通常情况下你通过 Node.js 应用程序更新集合中的文档。但在某些时刻，你可能需要从管理角度手动更新文档，以修复数据库或出于测试目的。\n\n要更新集合中的文档，你需要获取集合。然后你可以使用\
  \ `save(object)` 方法来保存对对象所做的更改。或者，你可以使用 `update(query, update, options)` 方法查询集合中的文档，并在发现后对其进行更新。\n\
  \n当你使用 `update()` 方法时，`query` 参数指定了一个查询文档，其中包含字段和值，用于匹配集合中的文档。`update` 参数是一个对象，指定了执行更新时使用的更新操作符。例如，`$inc`\
  \ 增加字段的值，`$set` 设置字段的值，`$push` 将项推入数组等。例如，以下更新对象增加了一个字段，设置了另一个字段，然后重命名了第三个字段：\n\n\
  点击此处查看代码图像\n\n```javascript\n{ $inc: {count: 1}, $set: {name: \"New Name\"}, $rename:\
  \ {\"nickname\": \"alias\"} }\n```\n\n`update()` 的 `options` 参数是一个包含两个属性的对象——`multi`\
  \ 和 `upsert`——它们都是 `Boolean` 类型的值。如果 `upsert` 为 `true`，则在未找到文档时将创建一个新文档。如果 `multi`\
  \ 为 `true`，则所有匹配查询的文档都被更新；否则，仅更新第一个文档。\n\n例如，以下命令通过将 `speed` 设置为 `150` 并添加一个名为 `updated`\
  \ 的新字段，更新 `speed` 为 `120mph` 的文档。此外，使用了 `save()` 方法来保存 `plane` 文档的更改：\n\n点击此处查看代码图像\n\
  \n```javascript\nuse testDB\ncoll = db.getCollection(\"newCollection\")\ncoll.find()\n\
  coll.update({ speed: \"120mph\" },\n            { $set: { speed: \"150mph\" , updated:\
  \ true } },\n            { upsert: true })\n```\n\n\n\n\n一旦你使用 `npm` 命令安装了 `mongodb`\
  \ 模块，就可以通过打开到 MongoDB 服务器的连接，从你的 Node.js 应用程序访问 MongoDB。该连接充当你在 MongoDB 数据库中创建、更新和访问数据的接口。\n\
  \n访问 MongoDB 的最佳方法是通过 ``mongodb` 模块中的 `MongoClient` 类。该类提供了非常简单的方法来创建 MongoDB 连接。你可以使用两种主要方法：一种创建一个\
  \ `MongoClient` 对象的实例，然后使用该对象来创建和管理 MongoDB 连接；另一种方法是使用连接字符串建立连接。这两种选项都非常好用。\n\n\
  ### 理解写入关注性 (Write Concern)\n\n在连接到 MongoDB 服务器并更新数据之前，你需要决定在连接上要实现何种级别的写入关注性。写入关注性是\
  \ MongoDB 连接在报告写操作成功与否提供的保证。写入关注性的强度决定了这种保证的程度。\n\n基本思想是，较强的写入关注性会告诉 MongoDB 等待写入操作成功写入磁盘后再响应。相反，较弱的写入关注性可能只等待\
  \ MongoDB 成功调度更改进行写入后就响应。较强写入关注性的缺点是，强度越强，MongoDB 等待响应客户端连接的时间就越长，因此写请求会慢一些。\n\n\
  从 MongoDB 驱动连接的角度来看，写入关注性可以设置为表 13.1 中列出的任意级别。你在服务器连接上设置此级别，它将适用于所有到服务器连接。如果检测到写入错误，将在写请求的回调函数中返回错误。\n\
  \n![Image](img/00137.jpeg)\n\n表 13.1 **MongoDB 连接的写入关注性级别**\n\n### 理解服务器对象 (Server\
  \ Object)\n\n`MongoClient` 连接在后台利用 `Server` 对象。该对象定义了 MongoDB 驱动程序如何连接到服务器。`Server`\
  \ 对象包含了主机、端口、池大小以及创建连接时使用的套接超时值等信息。\n\n你不需要直接与 `Server` 对象交互，但你需要指定用于创建客户端连接的选项。表\
  \ 13.2 列出了你在定义 `Server` 对象时可以设置的最重要选项：\n\n![Image](img/00138.jpeg)\n\n表 13.2 **用于为\
  \ `MongoClient` 连接创建 `Server` 对象的选项**\n\n### 通过客户端对象连接 MongoDB\n\n使用 `MongoClient`\
  \ 对象连接 MongoDB 涉及创建客户端实例、打开到数据库的连接、在必要时对数据库进行身份验证，然后根据需要处理注销和关闭。这种方法的优势是允许你控制连接和身份验证的每一步。\n\
  \n要通过 `MongoClient` 对象连接到 MongoDB，你首先需要创建一个 `MongoClient` 对象的实例。`MongoClient` 类的构造函数接收一个\
  \ `Server` 对象作为第一个参数，以及一个指定数据库连接选项的对象作为第二个参数，如下：\n\n```\nMongoClient(Server, options)\n\
  ```\n\n表 13.3 列出了可以设置并应用于 `MongoClient` 连接的最重要数据库连接选项：\n\n![Image](img/00139.jpeg)\n\
  \n表 13.3 **用于创建 `MongoClient` 连接的数据库连接选项**\n\n以下示例显示了如何创建 `MongoClient` 实例。注意，使用来自表\
  \ 13.2 的选项创建了 `Server` 对象：\n\n点击此处查看代码图片\n\n```javascriptvar client = new MongoClient(new\
  \ Server('localhost', 27017, { poolSize: 5}), { retryMiliSeconds: 500 }));\n```\n\
  \n一旦你创建了 `MongoClient`，就需要使用 `open(callback)` 方法打开到 MongoDB 服务器数据库的连接。如果连接失败，回调方法将以错误作为第一个参数调用；如果连接成功，则以\
  \ `MongoClient` 对象作为第二个参数。例如：\n\n点击此处查看代码图片\n\n```javascript\nclient.open(function(err,\
  \ client){ . . . });\n```\n\n要连接到特定数据库，你需要通过使用 `client` 对象上的 `db(databasename)`\
  \ 方法来创建数据库实例。你使用数据库连接选项来创建一个 `Db` 对象实例，该实例可用于访问特定数据库中的集合。如果你开启了身份验证，在尝试访问它之前，还需要还需要使用\
  \ `db.authenticate(username, password, callback)` 方法对数据库进行身份验证。例如：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar db = client.db(\"testDB\");\ndb.authenticate(\"dbadmin\", \"\
  test\", function(err, results) { . . .});\n```\n\n要注销数据库，请使用 `Db` 对象上的 `logout()`\
  \ 方法。这会关闭到数据库的连接，你无法再次使用该 `Db` 对象。例如：\n\n```javascript\ndb.logout()\n```\n\n要关闭到\
  \ MongoDB 的连接，你在客户端连接上调用 `close()`，如下所示：\n\n```javascript\nclient.close()\n```\n\
  \n列表 13.1 在一个简单的示例中整合了所有连接。注意代码在第 3 行通过生成 `Server` 对象并传递一些选项创建了客户端对象。此外注意，直到第 11\
  \ 行调用 `open` 时，客户端连接才会建立。在第 15 行建立了到 `testDB` 数据库的连接，并在第 18 行进行了身份验证。随后在 `authenticate()`\
  \ 回调函数内部，对 `db()` 连接进行了注销，并关闭了客户端连接。图 3.1 显示了列表 13.1 的输出。\n\n列表 13.1 `db_connect_object.js`:\
  \ 使用 `MongoClient` 对象实例连接到 MongoDB\n\n点击此处查看代码图片\n\n```javascript\n1 MongoClient\
  \ = require('mongodb').MongoClient,\n2 Server = require('mongodb').Server;\n3 var\
  \ client = new MongoClient(new Server('localhost', 27017, {\n4   socketOptions:\
  \ { connectTimeoutMS: 50 },\n5   poolSize: 5,\n6   auto_reconnect: true\n7 }, {\n\
  8   numberOfRetries: 3,\n9   retryMilliSeconds: 500\n10 });\n11 client.open(function(err,\
  \ client) {\n12   if(err){\n13     console.log(\"Connection Failed Via Client Object.\"\
  );\n14   } else {\n15     var db = client.db(\"testDB\");\n16     if (db){\n17 \
  \      console.log(\"Connected Via Client Object . . .\");\n18       db.authenticate(\"\
  dbadmin\", \"test\", function(err, results){\n19       if (err){\n20         console.log(\"\
  Authentication failed . . .\");\n21         client.close();\n22         console.log(\"\
  Connection closed . . .\");\n23       }else {\n24         console.log(\"Authenticated\
  \ Via Client Object . . .\");\n25         db.logout(function(err, result) {\n26\
  \           if(!err){\n27             console.log(\"Logged out Via Client Object\
  \ . . .\");\n28           }\n29           client.close();\n30           console.log(\"\
  Connection closed . . .\");\n31         });\n32       }\n33     }\n34   }\n35  \
  \ }\n36 });\n```\n\n\n\n\n\n使用 `MongoClient` 连接到 MongoDB 的另一种选项是使用连接字符串。通过这种选项，你可以使用简单的连接字符串来创建、打开并验证与数据库的连接。用于连接数据库的\
  \ `Server` 和 `MongoClient` 选项会在后台创建。这种方法的优点是实现起来非常简单。\n\n要通过连接字符串连接到 MongoDB，你需要调用\
  \ `MongoClient` 类上的 `connect()` 方法；不需要实例化。`connect()` 方法使用以下语法：\n\n```javascript\n\
  MongoClient.connect(connString, options, callback)\n```\n\n`connString` 字符串具有以下语法（在表\
  \ 13.4 中描述）：\n\n```text\nmongodb://username:password@host:port/database?options\n\
  ```\n\n![Image](img/00141.jpeg)\n\n表 13.4 `MongoClient` 连接字符串组件\n\n`options` 参数是一个对象，它可以包含\
  \ `db`、`server`、`replSet` 和 `mongos` 属性。`db` 属性是一个对象，可以包含表 13.3 中描述的属性。`server`\
  \ 属性是一个对象，可以包含表 13.2 中描述的属性。`replSet` 属性是一个对象，可以包含处理副本集连接的选项。`mongos` 属性也是一个对象，可以包含连接到\
  \ `mongos` 代理的选项。\n\n回调函数接受错误作为第一个参数，`Db` 对象实例作为第二个参数。如果发生错误，`Db` 对象实例将为 `null`；否则，可以使用它来访问数据库，因为连接已经创建并通过了验证。\n\
  \n在回调函数中，你可以使用作为第二个参数传递的 `Db` 对象来访问 MongoDB 数据库。当你完成连接后，可以在 `Db` 对象上调用 `close()`\
  \ 来关闭连接。\n\nListing 13.2 是使用连接字符串方法的示例。第 2 行指定了连接字符串，第 3–10 行指定了包含 `db`、`server`、`replSet`\
  \ 和 `mongos` 属性的对象。第 12–23 行定义了回调函数。注意，回调函数传递了一个已经通过验证的 `Db` 对象，因此不需要再次身份验证。图 13.2\
  \ 显示了 Listing 13.2 的输出。\n\nListing 13.2 `db_connect_string.js`: 使用连接字符串连接到 MongoDB\n\
  \n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n02 MongoClient.connect(\"\
  mongodb://dbadmin:test@localhost:27017/testDB\", {\n03                         \
  \      db: { w: 1, native_parser: false },\n04                               server:\
  \ {\n05                               poolSize: 5,\n06                         \
  \      socketOptions: { connectTimeoutMS: 500 },\n07                           \
  \    auto_reconnect: true\n08                             },\n09               \
  \              replSet: {},\n10                             mongos: {}\n11     \
  \                      }, function(err, db) {\n12                             if(err){\n\
  13                             console.log(\"Connection Failed Via String.\");\n\
  14                             } else {\n15                             console.log(\"\
  Connected Via Connection String . ..\");\n16                             db.logout(function(err,\
  \ result) {\n17                             if(!err){\n18                      \
  \       console.log(\"Logged out Via Connection String . ..\");\n19            \
  \                 }\n20                             db.close();\n21            \
  \                 console.log(\"Connection closed . ..\");\n22 });\n23 });\n```\n\
  \n![Image](img/00142.jpeg)\n\n图 13.2 使用连接字符串连接到 MongoDB。\n\n### 理解 MongoDB.js 驱动中使用的对象\n\
  \nMongoDB Node.js 驱动大量使用结构化对象来与数据库交互。你已经看到 `MongoClient` 对象如何提供连接数据库的交互。此外还有代表与数据库、集合、管理函数和游标交互的对象。接下来的章节将讨论这些对象中的每一个，并提供使用它们在你的\
  \ Node.js 中实现数据库功能的基础知识。你将在接下来的章节中更多地接触这些对象和方法。\n\n#### 理解 Db 对象\n\nMongoDB 驱动程序中的\
  \ `Db` 对象提供了对数据库的访问。它作为数据库的表示，允许你执行连接、添加用户、访问集合等操作。你使用 `Db` 对象来获取和维护与 MongoDB 交互的数据库的访问权限。如上一节所述，连接到数据库时通常会创建一个\
  \ `Db` 对象。表 13.5 列出了你可以在 `Db` 对象上调用的方法。\n\n![Image](img/00143.jpeg)![Image](img/00144.jpeg)![Image](img/00145.jpeg)\n\
  \n表 13.5 `Db` 对象的方法\n\n#### 理解 Admin 对象\n\n你使用 `Admin` 对象在 MongoDB 数据库上执行某些管理功能。`Admin`\
  \ 对象专门代表到 admin 数据库的连接，提供了 `Db` 对象不包含的功能。\n\n你可以通过使用 `Db` 对象实例上的 `admin()` 方法或通过将\
  \ `Db` 对象传递给构造函数来获取 `Admin` 对象。例如，以下两种方式都是有效的：\n\n```javascript\nvar adminDb = db.admin()\n\
  var adminDb = new Admin(db)\n```\n\n表 13.6 列出了你可以从 `Admin` 对象上调用的重要方法。这些方法允许你 ping\
  \ MongoDB 服务器、从 admin 数据库添加和删除用户、列出数据库等。\n\n![Image](img/00146.jpeg)\n\n表 13.6 `Admin`\
  \ 对象的方法\n\n#### 理解 Collection 对象\n\n`Collection` 对象代表 MongoDB 数据库中的一个集合。你使用 `Collection`\
  \ 对象来访问集合中的项、添加文档、查询文档以及更多操作。\n\n你可以通过使用 `Db` 对象实例上的 `collection()` 方法或通过将 `Db`\
  \ 对象和集合名称传递给构造函数来获取 `Collection` 对象。如果集合在 MongoDB 服务器上尚未创建，你可以通过 `Db` 对象上的 `createCollection()`\
  \ 方法来创建它。例如，以下所有方式都是有效的：\n\n```javascript\nvar collection = db.collection()\nvar\
  \ collection = new Collection(db, \"myCollection\")\ndb.createCollection(\"newCollection\"\
  , function(err, collection){ }\n```\n\n表 13.7 列出了你可以从 `Collection` 对象上调用的基础方法。这些方法允许你在集合中添加和修改文档、查找文档以及删除集合。\n\
  \n![Image](img/00147.jpeg)![Image](img/00148.jpeg)![Image](img/00149.jpeg)![Image](img/00150.jpeg)\n\
  \n表 13.7 `Collection` 对象的基础方法\n\n#### 理解 Cursor 对象\n\n当你使用 Node.js 驱动对 MongoDB 执行某些操作时，结果将以\
  \ `Cursor` 对象的形式返回。`Cursor` 对象作为一个指针，可以通过迭代来访问数据库中的一组对象。例如，当你使用 `find()` 时，实际文档不会在回调函数中返回；而是返回一个\
  \ `Cursor` 对象。然后你可以使用该 `Cursor` 对象来读取结果中的项。\n\n由于 `Cursor` 对象可以迭代，内部会维护一个当前位置的索引。这样你就可以逐个读取项目。请记住，某些操作仅影响\
  \ `Cursor` 对象中的当前项并增加索引。其他操作则影响从当前索引开始的所有项。\n\n\n\n\n为了让你对 `Cursor` 对象有一个整体了解，表\
  \ 13.8 列出了你可以在 `Cursor` 对象上调用的基本方法。这些方法允许你在集合中添加和修改文档、查找文档以及删除集合。\n\n![Image](img/00151.jpeg)\n\
  \n表 13.8 **`Cursor` 对象的的基本方法**\n\n## 访问与操作数据库\n\nMongoDB Node.js 驱动的一个强大特性是它提供了从你的\
  \ Node.js 应用中创建和管理数据库的能力。对于大多数安装情况，你最初设计并实现一次数据库，之后就不再触碰它们。然而，有时能够动态创建和删除数据库是非常方便的。\n\
  \n### 列出数据库\n\n要列出系统中的数据库，你需要使用 `Admin` 对象上的 `listDatabases()` 方法。这意味着你首先需要创建一个\
  \ `Admin` 对象的实例。数据库列表将作为回调函数的第二个参数返回，是一个数据库对象的简单数组。\n\n以下代码展示了创建一个 `Admin` 对象并使用它来获取\
  \ MongoDB 服务器上数据库列表的示例：\n\n点击此处查看代码图片\n\n```javascript\nvar MongoClient = require('mongodb').MongoClient;\n\
  \nMongoClient.connect(\"mongodb://localhost/admin\", function(err, db) {\n  var\
  \ adminDB = db.admin();\n  adminDB.listDatabases(function(err, databases){\n   \
  \ console.log(\"Before Add Database List: \");\n    console.log(databases);\n  });\n\
  });\n```\n\n### 创建数据库\n\n与 MongoDB shell 一样，没有显式的方法来创建数据库。当向数据库添加集合或文档时，数据库就会自动创建。因此，要创建一个新数据库，你只需要使用由\
  \ `MongoClient` 连接提供的 `Db` 对象上的 `db()` 方法来创建一个新的 `Db` 对象实例。然后，在该新的 `Db` 对象实例上调用\
  \ `createCollection()` 来创建数据库。\n\n以下代码展示了在连接到服务器后创建一个名为 `newDB` 的新数据库的示例：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar MongoClient = require('mongodb').MongoClient;\n\nMongoClient.connect(\"\
  mongodb://localhost/\", function(err, db) {\n  var newDB = db.db(\"newDB\");\n \
  \ newDB.createCollection(\"newColciton\", function(err, collection){\n    if(!err){\n\
  \      console.log(\"New Database and Collection Created\");\n    }\n  });\n});\n\
  ```\n\n### 删除数据库\n\n要从 MongoDB 中删除数据库，你需要获取该数据库的 `Db` 对象实例。然后调用该对象上的 `dropDatabase()`\
  \ 方法。MongoDB 可能需要一段时间来完成删除。如果你需要验证删除已发生，可以使用超时来等待删除发生。例如：\n\n点击此处查看代码图片\n\n```javascript\n\
  newDB.dropDatabase(function(err, results){\n  // 处理删除\n});\n```\n\n### 创建、列出和删除数据库示例\n\
  \n为了巩固数据库操作，图 13.3 展示了创建、列出和删除数据库的完整过程。建立了到服务器的连接，然后第 4–7 行列出了当前数据库。第 8 和 9 行通过调用\
  \ `createCollection()` 创建了一个新数据库。在 `createCollection()` 回调函数内部，再次列出数据库以验证创建。\n\n\
  第 15–32 行使用 `dropDatabase()` 删除数据库。注意在 `dropDatabase()` 回调内部实现了一个 `setTimeout()`\
  \ 定器，等待几秒后检查数据库列表以验证数据库已删除。输出显示在 图 13.3。\n\n13.3 `db_create_list.js`：**使用 MongoDB\
  \ Node.js 驱动创建、列出和删除数据库**\n\n***\n\n```javascript\nvar MongoClient = require('mongodb').MongoClient;\n\
  MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n  var adminDB\
  \ = db.admin();\n  adminDB.listDatabases(function(err, databases){\n    console.log(\"\
  Before Add Database List: \");\n    console.log(databases);\n  });\n  var newDB\
  \ = db.db(\"newDB\");\n  newDB.createCollection(\"newColciton\", function(err, collection){\n\
  \    if(!err){\n      console.log(\"New Database and Collection Created\");\n  \
  \    adminDB.listDatabases(function(err, databases){\n        console.log(\"After\
  \ Add Database List: \");\n        console.log(databases);\n        db.db(\"newDB\"\
  ).dropDatabase(function(err, results){\n          if(!err){\n            console.log(\"\
  Database dropped.\");\n            setTimeout(function() {\n              // 等待逻辑\n\
  \            });\n          }\n        });\n      });\n    }\n  });\n});\n```\n\n\
  \n\n\n你也可以通过 `collections()` 方法以完整 `Collection` 对象数组的形式获取数据库的集合集合。`collections()`\
  \ 方法的工作原理与 `collectionNames()` 方法完全相同，不同在于它会为每个集合创建一个完全可用的 `Collection` 对象。例如：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar newDB = db.db(\"newDB\");\n\nnewDB.collections(function(err,\
  \ collectionList){}\n```\n\n参数 `collectionList` 的结果值是一个 `Collection` 对象的数组。\n\n\
  ### 创建集合\n\n你已经见过创建集合的流程了。你只需要在 `Db` 对象上使用 `createCollection()` 方法即可。例如：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar newDB = db.db(\"newDB\");\n\nnewDB.createCollection(\"newCollection\"\
  , function(err, collection){ }\n```\n\n回调函数中 `collection` 参数的值是一个 `Collection` 对象。你可以使用该对象来操作集合、添加文档等。\n\
  \n### 删除集合\n\n删除集合有两种方法。第一是在 `Db` 对象上调用 `dropCollection(name)`。第二是在 `Collection`\
  \ 对象上调用 `drop()` 方法；这种方法有时更方便，例如当你正在遍历一个 `Collection` 对象列表时。\n\n以下是两种方法：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar myDB = db.db(\"myDB \");\n\nmyDB.dropCollection(\"collectionA\"\
  , function(err, results){ });\n\n// 或者\n\nmyDB.collection(\"collectionB\", function(err,\
  \ collB){\n\n  collB.drop();\n});\n```\n\n### 集合创建、列出与删除示例\n\n为了说明创建、列出和删除集合的流程，列表\
  \ 13.5 提供了一系列链回调，用于列出集合、创建新集合然后删除该新集合。代码非常基础且易于理解。图 13.5 显示了输出。\n\n列表 13.5 `collection_create_list_delete.js`：在\
  \ MongoDB 数据库上创建、检索和删除集合。\n\n点击此处查看代码图片\n\n***\n\n```javascript\n01 var MongoClient\
  \ = require('mongodb').MongoClient;\n02 MongoClient.connect(\"mongodb://localhost/\"\
  , function(err, db) {\n03    var newDB = db.db(\"newDB\");\n04    newDB.collectionNames(function(err,\
  \ collectionNames){\n05      console.log(\"Initial collections: \");\n06      console.log(collectionNames);\n\
  07      newDB.createCollection(\"newCollection\", function(err, collection){\n08\
  \        newDB.collectionNames(function(err, collectionNames){\n09          console.log(\"\
  Collections after creation: \");\n10          console.log(collectionNames);\n11\
  \            newDB.dropCollection(\"newCollection\", function(err, results){\n12\
  \            newDB.collectionNames(function(err, collectionNames){\n13         \
  \     console.log(\"Collections after deletion: \");\n14              console.log(collectionNames);\n\
  15              db.close();\n16            });\n17          });\n18        });\n\
  19      });\n20    });\n21 });\n```\n\n***\n\n![Image](img/00154.jpeg)\n\n图 13.5\
  \ 在 MongoDB 数据库上创建、检索和删除集合。\n\n### 获取集合信息\n\n`Collection` 对象的另一个非常实用的功能是获取特定集合的统计信息。统计信息可以让你了解集合的大小，包括文档数量和磁盘上的占用大小。你可能想要添加代码来定期检查集合的统计数据，以确定它们是否需要清理。\n\
  \n列表 13.6 显示了如何通过调用 `Collection` 对象上的 `stats()` 方法来访问集合的统计信息。图 13.5 显示了输出。\n\n列表\
  \ 13.6 `collection_stat.js`：检索并显示集合的统计信息。\n\n点击此处查看代码图片\n\n***\n\n```javascript\n\
  01 var MongoClient = require('mongodb').MongoClient;\n02 MongoClient.connect(\"\
  mongodb://localhost/\", function(err, db) {\n03    var newDB = db.db(\"newDB\");\n\
  04    newDB.collectionNames(function(err, collectionNames){\n05      console.log(\"\
  Initial collections: \");\n06      console.log(collectionNames);\n07      newDB.createCollection(\"\
  newCollection\", function(err, collection){\n08        newDB.collectionNames(function(err,\
  \ collectionNames){\n09          console.log(\"Collections after creation: \");\n\
  10          console.log(collectionNames);\n11            newDB.dropCollection(\"\
  newCollection\", function(err, results){\n12            newDB.collectionNames(function(err,\
  \ collectionNames){\n13              console.log(\"Collections after deletion: \"\
  );\n14              console.log(collectionNames);\n15              db.close();\n\
  16            });\n17          });\n18        });\n19      });\n20    });\n21 });\n\
  ```\n\n***\n\n![Image](img/00154.jpeg)\n\n图 13.5 在 MongoDB 数据库上创建、检索和删除集合。\n\n##\
  \ 总结\n\n`Collection` 对象的另一个非常实用的功能是获取特定集合的统计信息。统计信息可以让你了解集合的大小，包括文档数量和磁盘上的占用大小。你可能想要添加代码来定期检查集合的统计数据，以确定它们是否需要清理。\n\
  \n### 下节\n\n你也可以通过 `collections()` 方法以完整 `Collection` 对象数组的形式获取数据库的集合集合。`collections()`\
  \ 方法的工作原理与 `collectionNames()` 方法完全相同，不同在于它会为每个集合创建一个完全可用的 `Collection` 对象。\n\n\
  ## 14. 从 Node.js 操作文档\n\n在下一章中，你将学习如何插入、更新和删除文档。\n\n\n\n\n如果你想将 `countA` 字段增加 `5`、将\
  \ `countB` 增加 `1`、将 `name` 设置为 `\"New Name\"`、向 `days` 数组添加 `Friday`，并根据 `score`\
  \ 字段对 `scores` 数组排序，请使用以下 `update` 对象：\n\n点击此处查看代码\n\n```javascript\n{\n  $inc:{countA:5,\
  \ countB:1},\n  $set:{name:\"New Name\"},\n  $push{days:\"Friday\"},\n  $sort:{score:1}\n\
  }\n```\n\n表 14.2 列出了可以在 `update` 对象中用于更新文档的操作符。\n\n![Image](img/00157.jpeg)![Image](img/00158.jpeg)\n\
  \n表 14.2 执行更新操作时可以在 `update` 对象中指定的运算符\n\n## 向集合中添加文档\n\n与 MongoDB 数据库交互时的另一个常见任务是向集合中插入文档。要插入文档，你首先需要创建一个表示你想要存储的文档的\
  \ JavaScript 对象。之所以创建 JavaScript 对象，是因为 MongoDB 使用的 BSON 格式基于 JavaScript 记法。\n\n\
  一旦你有了新文档的 JavaScript 版本，就可以通过连接数据库的 `Collection` 对象实例上的 `insert()` 方法将其存储在 MongoDB\
  \ 数据库中。以下是 `insert()` 方法的语法：\n\n点击此处查看代码\n\n```javascript\ninsert(docs, [options],\
  \ callback)\n```\n\n`docs` 参数可以是单个文档对象，也可以是文档对象的数组。`options` 参数指定了表 14.1 中描述的数据库更改选项。如果你在\
  \ `options` 中实现了写关注（write concern），则需要提供 `callback` 参数。`callback` 的第一个参数是错误，第二个参数是插入到集合中的文档数组。\n\
  \n列表 14.1 是插入文档的一个基础示例。第 2–9 行显示了一个接受 `Collection` 对象和要插入对象的函数。调用了 `insert()` 方法，并将插入的对象结果数组（在此情况下逐个显示）打印在控制台上，如图\
  \ 14.1 所示。第 10–13 行打开与 MongoDB 服务器的连接，清空 `nebulae` 集合，然后重新创建它以提供一个干净的状态。然后第 14–19\
  \ 行调用 `addObject()` 处理一组描述星云的 JavaScript 对象。\n\n列表 14.1 `doc_insert.js`：向集合中插入文档\n\
  \n点击此处查看代码\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n\
  02 function addObject(collection, object){\n03   collection.insert(object, function(err,\
  \ result){\n04     if(!err){\n05        console.log(\"Inserted : \");\n06      \
  \  console.log(result);\n07     }\n08   });\n09 }\n10 MongoClient.connect(\"mongodb://localhost/\"\
  , function(err, db) {\n11   var myDB = db.db(\"astro\");\n12   myDB.dropCollection(\"\
  nebulae\");\n13   myDB.createCollection(\"nebulae\", function(err, nebulae){\n14\
  \     addObject(nebulae, {ngc:\"NGC 7293\", name:\"Helix\",\n15       type:\"planetary\"\
  ,location:\"Aquila\"});\n16     addObject(nebulae, {ngc:\"NGC 6543\", name:\"Cat's\
  \ Eye\",\n17       type:\"planetary\",location:\"Draco\"});\n18     addObject(nebulae,\
  \ {ngc:\"NGC 1952\", name: \"Crab\",\n19       type:\"supernova\",location:\"Taurus\"\
  });\n20   });\n21   setTimeout(function(){ db.close(); }, 3000);\n22 });\n```\n\n\
  ![Image](img/00159.jpeg)\n\n图 14.1 向集合中插入文档。\n\n## 从集合中获取文档\n\n你通常需要对存储在 MongoDB\
  \ 数据库中的执行的任务之一是检索一个或多个文档。例如，考虑商业网站上产品的信息。这些信息只存储一次，但会被检索多次。\n\n数据检索听起来相当简单，但当你需要过滤、排序和聚合时，它可能会变得非常复杂。事实上，第\
  \ 15 章专门介绍数据检索。本节介绍了 `Collection` 对象的 `find()` 和 `findOne()` 方法的基础知识，以便使操作更简单。\n\
  \n`find()` 和 `findOne()` 的语法所示：\n\n```javascript\nfind(query, [options])\nfindOne(query,\
  \ [options])\n```\n\n## 更新集合中的文档\n\n一旦对象被插入集合，随着数据的变化，你可能需要经常更新它们。MongoDB Node.js\
  \ 驱动提供了几种更新文档的极佳方法。最常用的是 `update()` 方法，它功能强大且非常容易实现。\n\n\n\n\n\n`query` 参数是一个文档，用于标识你想要更改的一个或多个文档。请求会将\
  \ `query` 参数中的属性和值与对象的字段和值进行匹配，只有匹配查询的文档才会被更新。`update` 参数是一个对象，指定了对匹配查询的文档要执行的更改。表\
  \ 14.2 列出了可以使用的操作符。\n\n`options` 参数指定了表 14.1 中描述的数据库更改选项。如果你在 `options` 中实现了写关量（write\
  \ concern），则需要提供 `callback` 参数。`callback` 的第一个参数是错误，第二个参数是插入到集合中的文档数组。\n\n当使用 `update()`\
  \ 调用更新多个文档时，你可以通过在 `query` 中使用 `$isolate:1` 属性对写入操作进行隔离，以保护文档免受其他写入操作的影响。这不会提供“全有或无”的原子写入，而是简单地阻止其他写入进程更新你正在写入的相同对象。例如：\n\
  \n点击此处查看代码图片\n\n```\nupdate({type:\"Planetary\", $isolated:1}, {updated:true}, {multi:true})\n\
  ```\n\n列表 14.3 显示了如何使用 `update()` 方法更新多个对象。第 9–19 行实现了 `update()` 方法和回调，将类型 `planetary`\
  \ 改为 `Planetary` 并添加了名为 `updated` 的新字段。注意使用了 `$set` 操作符来设置值。同样注意 `upsert` 为 `false`，因此不会创建新文档；`multi`\
  \ 为 `true`，因此多个文档将被更新；而 `w` 为 `1`，因此请求会在返回之前等待写入操作完成（参见图 14.3）。\n\n列表 14.3 `doc_update.js`:\
  \ 更新数据库中的多个文档\n\n点击此处查看代码图片\n\n* * *\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n\
  02 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n03   var myDB\
  \ = db.db(\"astro\");\n04   myDB.collection(\"nebulae\", function(err, nebulae){\n\
  05     nebulae.find({type:\"planetary\"}, function(err, items){\n06        items.toArray(function(err,\
  \ itemArr){\n07          console.log(\"Before Update: \");\n08          console.log(itemArr);\n\
  09          nebulae.update({type:\"planetary\", $isolated:1},\n10            {$set:{type:\"\
  Planetary\", updated:true}},\n11            {upsert:false, multi:true, w:1},\n12\
  \          function(err, results){\n13          nebulae.find({type:\"Planetary\"\
  }, function(err, items){\n14            items.toArray(function(err, itemArr){\n\
  15            console.log(\"After Update: \");\n16            console.log(itemArr);\n\
  17            db.close();\n18          });\n19          });\n20        });\n21 \
  \     });\n22    });\n23 });\n```\n\n* * *\n\n![Image](img/00161.jpeg)\n\n图 14.3\
  \ 更新数据库中的多个文档。\n\n### 在集合中原子性地修改文档\n\n`Collection` 对象提供了 `findAndModify()` 函数，它可以在单个文档上执行原子写入。如果你需要确保没有其他进程可以同时向你的文档写入数据，这个函数非常有用。以下是\
  \ `findAndModify()` 方法的语法：\n\n点击此处查看代码图片\n\n```\nfindAndModify(query, sort, update,\
  \ [options], callback)\n```\n\n`query` 参数是一个文档，用于标识你想要修改的文档。请求会将 `query` 参数中的属性和值与对象的字段和值进行匹配，只有匹配查询的文档才会被修改。\n\
  \n`sort` 参数是一个由 `[field, sort_order]` 对组成的数组，指定在查找要修改的条目时对哪些字段进行排序。`sort_order`\
  \ 值为 `1` 表示升序，`-1` 表示降序。`update` 参数是一个对象，指定了对匹配查询的文档要执行的更改。表 14.2 列出了可以使用的操作符。\n\
  \n`options` 参数指定了表 14.1 中描述的数据库更改选项。如果你在 `options` 中实现了写关量，则需要提供 `callback` 参数。`callback`\
  \ 的第一个参数是错误，第二个参数是正在被修改的对象。如果 `options` 中的 `new` 设置为 `true`，则返回新修改后的对象；如果 `new`\
  \ 设置为 `false`，则返回修改前的对象。如果你需要验证更改或将原始数据存储在其他处，获取修改前的对象会很有用。\n\n列表 14.4 对数据库中的单个对象执行原子写入。第\
  \ 9–15 行实现了 `findAndModify()` 操作。注意 `sort` 值为 `[['name', 1]]`，表示 `name` 升序排序。同样注意\
  \ `w` 为 `1` 以启用写关量，而 `new` 设置为 `true`，这样修改后的对象会在回调函数中返回并显示在控制台上，如图 14.4 所示。\n\n\
  列表 14.4 `doc_modify.js`: 使用 `findAndModify()` 原子性地修改文档\n\n点击此处查看代码图片\n\n* * *\n\n\
  ```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n02 MongoClient.connect(\"\
  mongodb://localhost/\", function(err, db) {\n03   var myDB = db.db(\"astro\");\n\
  04   myDB.collection(\"nebulae\", function(err, nebulae){\n05     nebulae.find({type:\"\
  supernova\"}, function(err, items){\n06        items.toArray(function(err, itemArr){\n\
  07          console.log(\"Before Update: \");\n08          console.log(itemArr);\n\
  09          nebulae.findAndModify({type:\"supernova\"}, [['name', 1]],\n10     \
  \       {$set: {type:\"Nova\", \"updated\":true}},\n11            {w:1, new:true},\n\
  12          function(err, doc){\n13            console.log(\"After Update: \");\n\
  14            console.log(doc);\n15            db.close();\n16          });\n17\
  \        });\n18      });\n19    });\n20  });\n21 });\n```\n\n* * *\n\n![Image](img/00162.jpeg)\n\
  \n图 14.4 使用 `findAndModify()` 原子性地修改文档。\n\n## 在集合中保存文档\n\n`Collection` 对象的 `save()`\
  \ 方法非常有意思。可以使用它向数据库插入或更新文档。虽然它没有 `insert()` 或 `update()` 高效，但在某些情况下 `save()` 方法更容易实现。例如，当你对已从数据库获取的对象进行即时更改时，可以使用\
  \ `save()`，而无需实现 `update()` 方法的查询和更新对象。\n\n通常在使用 `save()` 时，`document` 对象要么是一个想要添加到集合的全新\
  \ JavaScript 对象，要么是你已经从集合中获取并进行了更改的对象，并且你想将这些更改保存回数据库。\n\n\n\n\n\nListing 14.5 使用\
  \ `save()` 方法从数据库中检索一个对象，对其进行修改并将其保存回数据库。第 9–15 行实现了 `save()` 方法和 `callback`。注意，`save()`\
  \ 方法的使用比 `update()` 和 `findAndModify()` 方法要简单得多。此外请注意 `savedItem` 被返回给回调函数并显示在控制台上，如图\
  \ 14.5 所示。\n\nListing 14.5 `doc_save.js`: 使用 `save()` 更新并保存已存在的文档\n\n点击此处查看代码图片\n\
  \n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n02 MongoClient.connect(\"\
  mongodb://localhost/\", function(err, db) {\n03   var myDB = db.db(\"astro\");\n\
  04   myDB.collection(\"nebulae\", function(err, nebulae){\n05     nebulae.findOne({type:\"\
  supernova\"}, function(err, item){\n06       console.log(\"Before Save: \");\n07\
  \       console.log(item);\n08       item.info = \"Some New Info\";\n09       nebulae.save(item,\
  \ {w:1}, function(err, results){\n10         nebulae.findOne({_id:item._id}, function(err,\
  \ savedItem){\n11           console.log(\"After Save: \");\n12           console.log(savedItem);\n\
  13           db.close();\n14         });\n15       });\n16     });\n17   });\n18\
  \ });\n```\n\n![Image](img/00163.jpeg)\n\n图 14.5 使用 `save()` 更新并保存已存在的文档。\n\n###\
  \ 使用 upsert 在集合中插入文档\n\n普通的更新不会自动插入对象，因为它们在需要确定对象是否存在时会产生开销。如果你知道一个对象存在，那么普通的 `update()`\
  \ 是高效的；如果你知道文档尚不存在，那么使用 `insert()` 更好。当你想要实现“如果对象存在则更新，不存在则插入”的组合操作时，你应该使用 `upsert`。\n\
  \n要实现 `upsert`，可以在 `update()` 方法的 `options` 参数中包含 `upsert:true` 选项。这告诉请求：如果对象存在则尝试更新它，如果尚不存在则插入指定的对象。\n\
  \nListing 14.6 显示了如何结合 `update()` 方法使用 `upsert`。第 9–12 行的 `update()` 创建了对象，因为它不存在。然后第\
  \ 17 行检索了插入文档的 `_id` 值，并将其用于第 18–21 行的 `update()` 查询中，以确保能找到并更新已存在的文档。图 14.6 显示了\
  \ Listing 14.6 中代码的输出。注意，最初没有文档匹配描述符，在第一次更新后，文档被插入，然后在第二次更新后，它被修改了。\n\nListing 14.6\
  \ `doc_upsert.js`: 使用 `upsert` 插入新文档或更新现有文档\n\n点击此处查看代码图片\n\n```javascript\n01 var\
  \ MongoClient = require('mongodb').MongoClient;\n02 MongoClient.connect(\"mongodb://localhost/\"\
  , function(err, db) {\n03   var myDB = db.db(\"astro\");\n04   myDB.collection(\"\
  nebulae\", function(err, nebulae){\n05     nebulae.find({type:\"diffuse\"}, function(err,\
  \ items){\n06       items.toArray(function(err, itemArr){\n07           console.log(\"\
  Before Upsert: \");\n08           console.log(itemArr);\n09           nebulae.update({type:\"\
  diffuse\"},\n10               $set: {ngc:\"NGC 3372\", name:\"Carina\",\n11    \
  \                           type:\"diffuse\",location:\"Carina\"}},\n12        \
  \       {upsert:true, w:1,forceServerObjectId:false},\n13               function(err,\
  \ results){\n14                 nebulae.find({type:\"diffuse\"}, function(err, items){\n\
  15                   items.toArray(function(err, itemArr){\n16                 \
  \    console.log(\"After Upsert 1: \");\n17                     console.log(itemArr);\n\
  18                     var itemID = itemArr[0]._id;\n19                     nebulae.update({_id:itemID},\n\
  20                       $set: {ngc:\"NGC 3372\", name:\"Carina\",\n21         \
  \                      type:\"Diffuse\",location:\"Carina\"}},\n22             \
  \          {upsert:true, w:1}, function(err, results){\n23                     \
  \    nebulae.findOne({_id:itemID}, function(err, item){\n24                    \
  \       console.log(\"After Upsert 2: \");\n25                           console.log(item);\n\
  26                           db.close();\n27                         });\n28   \
  \                    });\n29                 });\n30               });\n31     \
  \        });\n32       });\n33   });\n34 });\n```\n\n![Image](img/00164.jpeg)\n\n\
  图 14.6 使用 `upsert` 插入新文档或更新现有文档。\n\n## 从集合中删除文档\n\n有时，你可能需要从 MongoDB 集合中删除文档以控制空间消耗、提高性能并保持整洁。`Collection`\
  \ 对象上的 `remove()` 方法使得从集合中删除文档变得非常简单。`remove()` 方法的语法所示：\n\n点击此处查看代码图片\n\n`remove([query],\
  \ [options], [callback])`\n\n`query` 参数是一个用于用于标识你想要删除的文档。请求会将 `query` 中的属性和值与对象的字段和值进行匹配，只有匹配查询的文档会被处理。如果未提供\
  \ `query`，则集合中的所有文档将被删除。\n\n`options` 参数指定了表 14.1 中描述的数据库变更选项。如果你在实现写关注，则需要 `callback`\
  \ 参数。`callback` 的第一个参数是错误，第二个参数是被删除的文档计数。\n\nListing 14.7 使用 `remove()` 方法从集合中删除对象。在第\
  \ 9–18 行，`remove()` 和 `callback` 查询类型为 `planetary` 的文档并将其从集合中删除。注意 `callback` 的\
  \ `results` 参数是已删除的文档数量。图 14.7 显示了 Listing 14.7 的输出。\n\nListing 14.7 `doc_delete.js`:\
  \ 从集合中删除文档。\n\n点击此处查看代码图片\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n\
  02 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n03   var myDB\
  \ = db.db(\"astro\");\n04   myDB.collection(\"nebulae\", function(err, nebulae){\n\
  05     nebulae.find(function(err, items){\n06       items.toArray(function(err,\
  \ itemArr){\n07           console.log(\"Before Delete: \");\n08           console.log(itemArr);\n\
  09           nebulae.remove({type:\"planetary\"}, function(err, results){\n10  \
  \           console.log(\"Deleted \" + results + \" documents.\");\n11         \
  \    nebulae.find(function(err, items){\n12               items.toArray(function(err,\
  \ itemArr){\n13                 console.log(\"After Delete: \");\n14           \
  \      console.log(itemArr);\n15                 db.close();\n16               });\n\
  17             });\n18           });\n19       });\n20     });\n21   });\n22 });\n\
  ```\n\n### 移除单个文档\n\n你可以使用 `findAndRemove()` 方法从数据库中删除单个文档。这在语法和应用上与 `findAndModify()`\
  \ 方法非常相似。\n\n`findAndRemove(query, sort, [options], callback)`\n\n\n\n\n\n`sort`\
  \ 参数是一个由 `[field, sort_order]` 对组成的数组，用于在查找要删除的项时指定按哪些字段排序。`sort_order` 设置为 `1`\
  \ 表示升序，设置为 `-1` 表示降序。`options` 参数指定了表 14.1 中描述的数据库更改选项。回调函数的第一个参数是错误，第二个参数是文档删除的结果。\n\
  \n列表 14.8 展示了如何使用 `findAndRemove()` 方法删除文档。第 9–18 行实现了 `findAndRemove()` 方法和回调函数。该代码搜索\
  \ `type` 为 `planetary`（行星状）的项。排序顺序 `[['name', 1]]` 指定按名称升序对项进行排序。注意图 14.8 中所示的结果中，`Cat's\
  \ Eye` 条目被删除了，但 `Helix` 条目由于排序顺序的原因没有被删除。\n\n列表 14.8 `doc_delete_one.js`: 使用 `findAndRemove()`\
  \ 删除单个文档\n\n点击此处查看代码图片\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n\
  02 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n03    var\
  \ myDB = db.db(\"astro\");\n04    myDB.collection(\"nebulae\", function(err, nebulae){\n\
  05      nebulae.find(function(err, items){\n06        items.toArray(function(err,\
  \ itemArr){\n07          console.log(\"Before Delete: \");\n08          console.log(itemArr);\n\
  09          nebulae.findAndRemove({type:\"Planetary\"}, [['name', 1]],\n10     \
  \                              {w:1}, function(err, results){\n11            console.log(\"\
  Deleted:\\n \" + results);\n12            nebulae.find(function(err, items){\n13\
  \              items.toArray(function(err, itemArr){\n14                console.log(\"\
  After Delete: \");\n15                console.log(itemArr);\n16                db.close();\n\
  17              });\n18            });\n19          });\n20        });\n21     \
  \ });\n22 });\n```\n\n![Image](img/0166.jpeg)\n图 14.8 使用 `findAndRemove()` 删除单个文档。\n\
  \n## 总结\nMongoDB Node.js 驱动提供了插入、访问和移除文档的方法。你可以使用 `insert()`、`save()` 甚至带有 `upsert`\
  \ 选项的 `update()` 向数据库中插入文档。你可以使用 `update()`、`save()` 和 `findAndModify()` 来更新现有文档。你可以使用\
  \ `remove()` 和 `findAndRemove()` 方法来删除文档。\n\n你可以通过多种方式控制数据库中文档的更改，例如定义写关顾（write\
  \ concern）、使用日志记录（journaling）以及使用其他设置来控制请求和响应。此外，MongoDB 用于更新文档的更新结构比 SQL 中长且复杂的查询字符串更容易于实现和维护。\n\
  \n## 下一节\n在本章中，你学习了如何使用 `find()` 和 `findOne()` 在数据库中查找对象。下一章将扩展这些方法，并提供更复杂的示例，介绍如何在集合中查找对象时对结果进行过滤、排序和限制。\n\
  \n## 15. 从 Node.js 访问文档\n在上一节中，你学习了如何创建和操作文档，以及如何使用 `find()` 方法查找它们。本章将深入探讨如何使用\
  \ MongoDB Node.js 驱动访问 MongoDB 集合中的文档。\n\n访问文档远不仅仅是返回集合中的所有内容。本章涵盖了用于限制返回文档的 `query`\
  \ 对象，以及用于限制查询中字段和文档数量的方法。你还将有机会在不实际从服务器检索文档的情况下，统计符合查询准则的文档数量。本章还涵盖了一些聚合技术，用以对结果进行分组，甚至生成一个新的新的聚合后的文档集。\n\
  \n## 介绍数据集\n为了向你介绍访问数据的各种方法，本章示例中使用的所有数据都源自同一个数据集。该数据集是一个包含 5,000 个单词信息的集合。这提供了一个足够的数据集来实现落实所需的示例。\n\
  \n你可以通过执行本书代码存档提供的 `ch15/generate_data.js` 脚本在你的开发系统中创建该数据集。`generate.js` 脚本是一个基础\
  \ JavaScript Shell 脚本，将创建一个名为 `words` 的数据库和一个名为 `word_stats` 的集合。要运行该脚本，请从书籍的代码存档下载\
  \ `generate_data.js` 文件到本地系统，启动 MongoDB，并在脚本所在的目录下从控制提示符执行以下命令：\n\n```bash\nmongo\
  \ generate_data.js\n```\n\n该数据集中对象的结构如下，并且应当是直观的（这也是选择它的原因）：\n\n点击此处查看代码图片\n\n```json\n\
  {\n  word: <word>,\n  first: <first_letter>,\n  last: <last_letter>,\n  size: <character_count>,\n\
  \  letters: [<array_of_characters_in_word_no_repeats>],\n}\n```\n\n此文档结构包含了字符串、整数、数组和子文档。\n\
  \n### 理解查询对象\n在整个章节中，各种方法都使用 `query` 对象来定义从集合中检索的文档。`query` 对象是一个标准的 JavaScript\
  \ 对象，具有 Node.js 驱动程序可以理解的特殊属性名。这些属性名与你在 MongoDB 内部执行的查询非常匹配，以便于传输。\n\n`query` 对象的属性被称为运算符，因为它们对数据操作以确定是否将其包含在结果集中。例如，要查找\
  \ `count` 值大于 10 且 `name` 等于 test 的所有文档，你可以使用此 `query` 对象：\n\n```json\n{count:{$gt:10},\
  \ name:'test'}\n```\n\n运算符 `$gt` 指定 `count` 大于 10。使用标准的冒号语法 `name:'test'` 指定 `name`\
  \ 字段等于 test。注意 `query` 对象有多个运算符。你可以在同一个查询中包含多个不同的运算符。\n\n在 `query` 对象中指定字段时，可以使用点符号来指定子文档字段。例如，考虑以下对象：\n\
  \n```json\n{\n  name:\"test\",\n  stats: { height:74, eyes:'blue'}\n}\n```\n\n你可以通过使用以下查询对象查询具有蓝色眼睛的用户：\n\
  \n```json\n{stats.eyes:'blue'}\n```\n\n表 15.1 列出了最常用的运算符。\n\n### 理解查询选项对象\n除了 `query`\
  \ 对象外，使用 MongoDB Node.js 驱动检索文档的大多数方法还包含一个 `options` 对象。`options` 对象允许你定义检索文档时的请求行为。它允许你限制结果集、在创建结果集时进行排序以及更多操作。\n\
  \n表 15.2 列出了可以在从 MongoDB 服务器检索文档的方法上设置的选项。并不是所有选项都适用于每个请求。例如，在统计匹配查询的项数量时，对结果设置限制是没有意义的。\n\
  \n\n\n\n\n![Image](img/00170.jpeg)![Image](img/00171.jpeg)\n\n表 15.2 在查询文档时在 `options`\
  \ 对象中可以指定的选项\n\n### 查找特定的文档集\n\n在第 14 章“从 Node.js 操作 MongoDB 文档”中，你已经学习了 `Collection`\
  \ 对象的 `find()` 方法。该方法向回调函数返回一个 `Cursor` 对象，从而提供对文档的访问。如果没有指定查询，则将返回所有文档，这通常不是你想要的。相反，你通常需要一组符合特定标准集合的文档子集。\n\
  \n为了限制 `find()` 方法找到的文档数量，你应用一个 `query` 对象，该对象将限制将在 `Cursor` 对象中返回的文档。\n\n列表 15.1\
  \ 中的代码对本章之前描述的单词集合数据集执行了一系列不同的查询。你应该已经识别出所有的连接代码以及在 `displayWords()` 中用于遍历游标并仅显示文档中单词名称的代码。\n\
  \n在第 20 行，以下查询查找以 a、b 或 c 开头的单词：\n\n点击此处查看代码图像\n\n```\n{first:{$in: ['a', 'b', 'c']}}\n\
  ```\n\n在第 23 行，以下查询查找长度大于 12 个字母的单词：\n\n```\n{size:{$gt: 12}}\n```\n\n在第 26 行，以下查询查找字母数量为偶数的单词：\n\
  \n```\n{size:{$mod: [2,0]}}\n```\n\n在第 29 行，以下查询查找恰好有 12 个字母的单词：\n\n```\n{letters:{$size:\
  \ 12}}\n```\n\n在第 32 行和 33 行，以下查询查找同时以元音开头和结尾的单词：\n\n点击此处查看代码图像\n\n```\n{$and: [{first:{$in:\
  \ ['a', 'e', 'i', 'o', 'u']}},\n       {last:{$in: ['a', 'e', 'i', 'o', 'u']]}]}\n\
  ```\n\n在第 37 行，以下查询查找包含超过 6 个元音的单词：\n\n```\n{\"stats.vowels\":{$gt:6}}\n```\n\n\
  在第 40 行，以下查询查找包含所有元音的单词：\n\n点击此处查看代码图像\n\n```\n{letters:{$all: ['a','e','i','o','u']}}\n\
  ```\n\n在第 44 行，以下查询查找带有非字母字符的单词：\n\n```\n{otherChars: {$exists:true}}\n```\n\n第\
  \ 47 行使用了一个相当具有挑战性的查询。它使用 `$elemMatch` 操作符来匹配 `charsets` 子文档。`$and` 操作符强制 `type`\
  \ 字段等于 `other` 且 `chars` 数组字段恰好为 `2`：\n\n点击此处查看代码图像\n\n```\n{charsets:{$elemMatch:{$and:[{type:'other'},{chars:{$size:2}}]}}}\n\
  ```\n\n图 15.1 显示了列表 15.1 的输出。\n\n列表 15.1 `doc_query.js`: 在 MongoDB 集合中查找特定的文档集\n\
  \n点击此处查看代码图像\n\n```\n* * *\n01 var MongoClient = require('mongodb').MongoClient;\n\
  02 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n03   var myDB\
  \ = db.db(\"words\");\n04   myDB.collection(\"word_stats\", findItems);\n05   setTimeout(function(){\n\
  06     db.close();\n07   }, 3000);\n08 });\n09 function displayWords(msg, cursor,\
  \ pretty){\n10   cursor.toArray(function(err, itemArr){\n11     console.log(\"\\\
  n\"+msg);\n12     var wordList = [];\n13     for(var i=0; i<itemArr.length; i++){\n\
  14       wordList.push(itemArr[i].word);\n15     }\n16     console.log(JSON.stringify(wordList,\
  \ null, pretty));\n17   });\n18 }\n19 function findItems(err, words){\n20   words.find({first:{$in:\
  \ ['a', 'b', 'c']}}, function(err, cursor){\n21     displayWords(\"Words starting\
  \ with a, b or c: \", cursor);\n22   });\n23   words.find({size:{$gt: 12}}, function(err,\
  \ cursor){\n24     displayWords(\"Words longer than 12 characters: \", cursor);\n\
  25   });\n26   words.find({size:{$mod: [2,0]}}, function(err, cursor){\n27     displayWords(\"\
  Words with even Lengths: \", cursor);\n28   });\n29   words.find({letters:{$size:\
  \ 12}}, function(err, cursor){\n30     console.\nWords with 122\n:\n cursor\n\n\
  31\n\n\n2\n }\n```\n\n\n\n\n```javascript\nwords.count({$and: [{first:{$in: ['a',\
  \ 'e', 'i', 'o', 'u']}}, {last:{$in: ['a', 'e', 'i', 'o', 'u']}}]}, function(err,\
  \ count){\n  console.log(\"Words that start and end with a vowel: \" + count);\n\
  });\nwords.count({\"stats.vowels\":{$gt:6}}, function(err, count){\n  console.log(\"\
  Words containing 7 or more vowels: \" + count);\n});\nwords.count({letters:{$all:\
  \ ['a','e','i','o','u']}}, function(err, count){\n  console.log(\"Words with all\
  \ 5 vowels: \" + count);\n});\nwords.count({otherChars: {$exists:true}}, function(err,\
  \ count){\n  console.log(\"Words with non-alphabet characters: \" + count);\n});\n\
  words.count({charsets:{$elemMatch:{$and:[{type:'other'}, {chars:{$size:2}}]}}},\
  \ function(err, count){\n  console.log(\"Words with 2 non-alphabet characters: \"\
  \ + count);\n});\n```\n\n![Image](img/00173.jpeg)\n图 15.2 在 MongoDB 中通过在 `count()`\
  \ 使用 `query` 对象计数特定文档。\n\n### 限制结果集 (Limiting Result Sets)\n\n当你在大型系统上查找复杂文档时，通常需要限制返回的内容，以减少对网络、服务器和客户端内存等等方面产生的影响。有三种方法可以限制匹配特定查询的结果集。你可以简单地只接受有限数量的文档，可以限制返回的字段，也可以对结果进行分页并分块获取它们。\n\
  \n#### 按大小限制结果 (Limiting Results by Size)\n\n在 `find()` 或其他查询请求中限制返回数据量的最简单方法是在执行请求时使用\
  \ `options` 参数中的 `limit` 选项。下所示的 `limit` 参数允许 `Cursor` 对象仅返回固定数量的项。这可以防止你不小心地检索比应用程序能够处理的更多的对象：\n\
  \n`limit:<maximum_documents_to_return>`\n\n列表 15.3 显示了如何通过在 `options` 对象中使用 `limit:5`\
  \ 选项来限制 `find()` 请求的结果。图 15.3 中的输出显示，当使用 `limit:5` 时，仅检索五个单词。\n\n**列表 15.3 `doc_limit.js`**：限制\
  \ MongoDB 集合中的特定文档集\n\n```javascript\nvar MongoClient = require('mongodb').MongoClient;\n\
  MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n  var myDB =\
  \ db.db(\"words\");\n  myDB.collection(\"word_stats\", limitFind);\n  setTimeout(function(){\n\
  \    db.close();\n  }, 3000);\n});\nfunction displayWords(msg, cursor, pretty){\n\
  \  cursor.toArray(function(err, itemArr){\n    console.log(\"\\n\"+msg);\n    var\
  \ wordList = [];\n    for(var i=0; i<itemArr.length; i++){\n      wordList.push(itemArr[i].word);\n\
  \    }\n    console.log(JSON.stringify(wordList, null, pretty));\n  });\n}\nfunction\
  \ limitFind(err, words){\n  words.count({first:'p'}, function(err, count){\n   \
  \ console.log(\"Count of words starting with p : \" + count);\n  });\n  words.find({first:'p'},\
  \ function(err, cursor){\n    displayWords(\"Words starting with p : \", cursor);\n\
  \  });\n  words.find({first:'p'}, {limit:5}, function(err, cursor){\n    displayWords(\"\
  Limiting words starting with p : \", cursor);\n  });\n}\n```\n\n![Image](img/0174.jpeg)\n\
  图 15.3 限制 `find()` 请求返回的文档。\n\n#### 限制对象返回的字段 (Limiting Fields Returned in Objects)\n\
  \n在检索文档时限制结果数据的另一种有效方法是限制返回哪些字段。文档可能具有许多不同的字段，这些字段在某些情况下有用，但在另一些情况下没有。在从 MongoDB\
  \ 服务器检索文档时，你应该考虑包含哪些字段，并只请求必要的字段。\n\n要限制从服务器返回的字段，请使用 `options` 对象的 `fields` 选项。对象中的\
  \ `fields` 选项允许你通过将 `document` 字段的值设置为 `0`（排除）或 `1`（包含）来包含或排除字段。你不能在同一个表达式中混合包含和排除。\n\
  \n例如，在返回文档时排除 `stats`、`value` 和 `comments`，使用以下 `fields` 选项：\n\n`{fields:{stats:0,\
  \ value:0, comments:0}}`\n\n通常只需包含几个字段会更容易。例如，如果你只想包含文档的 `name` 和 `value` 字段，请使用：\n\
  \n`{fields:{name:1, value:1}}`\n\n列表 15.4 显示了如何使用 `fields` 选项通过排除字段或指定要包含的特定字段来减少从服务器返回量。图\
  \ 15.4 显示了 列表 15.4 的输出。\n\n**列表 15.4 `doc_fields.js`**：在 MongoDB 集合中限制返回的字段\n\n\
  ```javascript\nvar MongoClient = require('mongodb').MongoClient;\nMongoClient.connect(\"\
  mongodb://localhost/\", function(err, db) {\n  var myDB = db.db(\"words\");\n  myDB.collection(\"\
  word_stats\", limitFields);\n  setTimeout(function(){\n    db.close();\n  }, 3000);\n\
  });\nfunction limitFields(err, words){\n  words.findOne({word:'the'}, {fields:{stats:0,\
  \ value:0, comments:0}}, function(err, item){\n    console.log(\"Excluding fields:\
  \ \");\n    console.log(JSON.stringify(item, null, 2));\n  });\n  words.findOne({word:'the'},\
  \ {fields:{name:1, value:1}}, function(err, item){\n    console.log(\"Including\
  \ fields: \");\n    console.log(JSON.stringify(item, null, 2));\n  });\n}\n```\n\
  \n![Image](img/0175.jpeg)\n图 15.4 使用 `fields` 选项限制文档中的字段。\n\n#### 结果分页 (Paging Results)\n\
  \n减少返回文档数量的一种非常常见的方法是分页。分页涉及在匹配集中指定要跳过的文档数量，以及对返回文档的限制。然后每次根据返回的数量增加 skip 值。\n\n\
  要在文档集上实现分页，你需要在 `options` 对象上实现 `limit` 和 `skip` 选项。`skip` 选项指定了返回文档之前跳过的文档数。通过在每次获取一组文档时移动\
  \ `skip` 值，你可以有效地遍历数据集。此外，在分页数据时应始终包含 `sort` 选项以确保顺序始终一致。例如，以下语句查找 1–10，然后是 11–20，最后是\
  \ 21–30：\n\n```javascript\ncollection.find({sort:[['_id':1]], skip:0, limit:10},\
  \ function(err, cursor){});\ncollection.find({sort:[['_id':1]], skip:10, limit:10},\
  \ function(err, cursor){});\ncollection.find({sort:[['_id':1]], skip:20, limit:10},\
  \ function(err, cursor){});\n```\n\n列表 15.5 显示了如何使用 `limit` 和 `skip` 分页遍历特定文档集。每次都会实现一个新的\
  \ `find()` 请求，这更真实地模拟了处理来自的分页请求时发生的情况。图 15.5 显示了 列表 15.5 的输出。注意单词每次检索 10 个。\n\n\
  ![Image](img/00176.jpeg)\n图 15.5 在 MongoDB 中通过使用 `skip`、`limit` 和 `sort` 选项对特定文档集进行分页。\n\
  \n\n\n\n\n如果系统上的数据发生了影响查询结果的变化，跳过（skip）可能会漏掉某些项，或者在随后的页面请求中重复包含某些项。\n\n列表 15.5 `doc_paging.js`：MongoDB\
  \ 集合中特定文档集的分页结果\n\n点击此处查看代码图片\n\n```javascript\n01 var util = require('util');\n\
  02 var MongoClient = require('mongodb').MongoClient;\n03 var myDB;\n04 MongoClient.connect(\"\
  mongodb://localhost/\", function(err, db) {\n05    myDB = db.db(\"words\");\n06\
  \    myDB.collection(\"word_stats\", function(err, collection){\n07      pagedResults(err,\
  \ collection, 0, 10);\n08    });\n09 });\n10 function displayWords(msg, cursor,\
  \ pretty){\n11   cursor.toArray(function(err, itemArr){\n12      console.log(\"\\\
  n\"+msg);\n13      var wordList = [];\n14      for(var i=0; i<itemArr.length; i++){\n\
  15        wordList.push(itemArr[i].word);\n16      }\n17      console.log(JSON.stringify(wordList,\
  \ null, pretty));\n18   });\n19 }\n20 function pagedResults(err, words, startIndex,\
  \ pageSize){\n21   words.find({first:'v'},\n22               {limit:pageSize, skip:startIndex,\
  \ sort:[['word',1]]},\n23               function(err, cursor){\n24      cursor.count(true,\
  \ function(err, cursorCount){\n25        displayWords(\"Page Starting at \" + startIndex,\
  \ cursor);\n26        if (cursorCount === pageSize){\n27          pagedResults(err,\
  \ words, startIndex+pageSize, pageSize);\n28        } else {\n29          myDB.close();\n\
  30        }\n31      });\n32    });\n33 }\n```\n\n## 排序结果集\n\n从 MongoDB 数据库检索文档的一个重要方面是能够按排序格式获取它们。如果你只需要检索特定数量（例如前\
  \ 10 个）或者在对请求进行分页，排序将特别有帮助。`options` 对象提供了 `sort` 选项，允许你指定文档中一个或多个字段的排序顺序和方向。\n\n\
  你通过使用 `[field,<sort_order>]` 对数组来指定 `sort` 选项，其中 `sort_order` `1` 表示升序，`-1` 表示降序。例如，要先对\
  \ `name` 字段降序，再对 `value` 字段升序，你应该使用：\n\n点击此处查看代码图片\n\n`sort:[['name':1]['value':-1]]`\
  \ 列表 15.6 显示了如何使用 `sort` 选项以不同的方式查找并排序单词列表。注意第 29 行先按大小对单词排序，然后按最后一个字母排序，而第 32 行是先按最后一个字母排序，再按大小排序。不同的排序顺序会返回不同的单词列表。图\
  \ 15.6 显示了 列表 15.6 中代码的输出。\n\n列表 15.6 `doc_sort.js`：对 MongoDB 集合中一组文档的 `find()`\
  \ 请求结果进行排序\n\n点击此处查看代码图片\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n\
  02 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n03    var\
  \ myDB = db.db(\"words\");\n04    myDB.collection(\"word_stats\", sortItems);\n\
  05    setTimeout(function(){\n06      db.close();\n07    }, 3000);\n08 });\n09 function\
  \ displayWords(msg, cursor, pretty){\n10   cursor.toArray(function(err, itemArr){\n\
  11      console.log(\"\\n\"+msg);\n12      var wordList = [];\n13      for(var i=0;\
  \ i<itemArr.length; i++){\n14        wordList.push(itemArr[i].word);\n15      }\n\
  16      console.log(JSON.stringify(wordList, null, pretty));\n17   });\n18 }\n19\
  \ function sortItems(err, words){\n20   words.find({last:'w'}, function(err, cursor){\n\
  21      displayWords(\"Words ending in w: \", cursor);\n22   });\n23   words.find({last:'w'},\
  \ {sort:1}}, function(err, cursor){\n24      displayWords(\"Words ending in w sorted\
  \ ascending: \", cursor);\n25   });\n26   words.find({last:'w'}, {sort:-1}}, function(err,\
  \ cursor){\n27      displayWords(\"Words ending in w sorted, descending: \", cursor);\n\
  28   });\n29   words.find({first:'b'}, {sort:[['size',-1],['last',1]]},\n30    \
  \  function(err, cursor){\n31      displayWords(\"Words sorted by size then last\
  \ letter: \", cursor);\n32   });\n33   words.find({first:'b'}, {sort:[['last',1],['size',-1]]},\n\
  34      function(err, cursor){\n35      displayWords(\"Words sorted by last letter\
  \ then size: \", cursor);\n36   });\n37 }\n```\n\n![Image](img/00177.jpeg)\n图 15.6\
  \ 对集合中特定文档的 `find()` 请求结果进行排序。\n\n### 查找唯一值\n\n针对 MongoDB 集合的一项非常实用的查询是获取一组文档中单个字段的唯一值列表。在这种情况下，`Distinct`\
  \ 意味着尽管有数千个文档，但你只想知道存在的唯一值。\n\n`Collection` 对象上的 `distinct()` 方法允许你查找特定字段的唯一值列表。`distinct()`\
  \ 方法的语法如下所示：\n\n点击此处查看代码图片\n\n`distinct(key,[query],callback)` `key` 参数是你想要获取值的字段名的字符串值。你可以通过点点符号语法来指定子文档——例如，`stats.count`。`query`\
  \ 参数是一个对象，包含了 表 15.1 中列出的标准 `query` 选项。`options` 参数是一个 `options` 对象，允许你定义 表 15.2\
  \ 中定义的 `readPreference` 选项。回调函数接受错误作为第一个参数，然后是 `results` 参数，它是 `key` 参数中指定字段的唯一值数组。\n\
  \n列表 15.7 显示了如何在 words 集合中查找唯一值。注意第 14 行中的查询限制了单词为以 `u` 开头的。注意第 18 行使用点语法来访问 `stats.vowels`\
  \ 字段。图 15.7 显示了 列表 15.7 的输出。\n\n列表 15.7 `doc_distinct.js`：在 MongoDB 集合中一组文档中查找唯一值\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n\
  02 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n03    var\
  \ myDB = db.db(\"words\");\n04    myDB.collection(\"word_stats\", distinctValues);\n\
  05    setTimeout(function(){\n06      db.close();\n07    }, 3000);\n08 });\n09 function\
  \ distinctValues(err, words){\n10   words.distinct('size', function(err, values){\n\
  11      console.log(\"\\nSizes of words: \");\n12      console.log(values);\n13\
  \   });\n14   words.distinct('first', {last:'u'}, function(err, values){\n15   \
  \   console.log(\"\\nFirst letters of words ending in u: \");\n16      console.log(values);\n\
  17   });\n18   words.distinct('stats.vowels', function(err, values){\n19      console.log(\"\
  \\nNumbers of vowels in words: \");\n20      console.log(values);\n21   });\n22\
  \ }\n```\n\n## 分组结果\n\n在对大数据集进行操作时，根据文档中一个或多个字段的唯一值对结果进行分组通常非常有用。你可以在检索文档后在代码中这样做，但让\
  \ MongoDB 在已经在遍历文档的单个请求中为你完成要高效得多。\n\n要对查询结果分组，你可以使用 `Collection` 对象上的 `group()`\
  \ 方法。`group()` 请求首先收集匹配 `query` 的所有文档，根据一组 `keys` 的唯一值向数组中添加 `group` 对象，对这些 `group`\
  \ 对象执行操作，并返回 `group` 对象数组。\n\n\n\n\n\n`group(keys, query, initial, reduce, finalize,\
  \ command, [options], callback)`\n\n`group()` 方法的参数说明如下列表所示：\n\n- **keys:** 这可以是一个对象、数组或表示要分组键的函数。简单的方法是在对象中指定键，例如\
  \ `{field1:true, field2:true}`，或者在数组中指定，例如 `['first', 'last']`。\n- **query:** `query`\
  \ 对象定义了初始集合中要包含哪些文档。`query` 对象选项列表请参见表 15.1。\n- **initial:** 指定在分组聚合数据时使用的初始 `group`\
  \ 对象。对于每一组不同的键集合，都会创建一个初始的 `group` 对象。最常见的用法是作为一个计数器，用于跟踪匹配键的项数。例如：\n\n```\n{\"\
  count\":0}\n```\n- **reduce:** 此函数有两个参数，`obj` 和 `prev`。该函数会在每个匹配查询的文档上执行。`obj` 参数是当前文档，而\
  \ `prev` 是由 `initial` 参数创建的对象。你可以使用 `obj` 对象用新值（如计数或总和）更新 `prev` 对象。例如，要增加计数值，你可以使用：\n\
  \n```\nfunction(obj, prev) { prev.count++; }\n```\n- **finalize:** 此函数接受一个参数 `obj`，它是由\
  \ `initial` 参数生成的最终对象，并在 `reduce` 函数中作为 `prev` 进行更新。在返回响应中的数组之前，会在每个不同键的生成对象上调用此函数。\n\
  - **command:** 这是一个布尔值，当为 `true` 时，表示命令使用内部 `group` 命令而不是 `eval()` 运行。默认值为 `true`。\n\
  - **options:** 此对象允许你定义 `readPreference` 选项。\n- **callback:** 该选项接受第一个参数为错误，第二个参数为\
  \ `results` 对象的数组。\n\n列表 15.8 展示了如何根据不同的键集对单词进行分组。第 10–18 行实现了按单词的首字母和最后一个字母对单词进行基础分组。第\
  \ 11 行的查询限制单词为以 *o* 开头并以元音结尾的单词。每个初始对象仅包含一个 `count` 属性，该属性会在第 13 行的函数中为每个匹配的文档进行更新。\n\
  \n第 19–28 行对文档中的元音总和，并通过第 23 行中的 `obj.stats.vowels` 值增加 `prev.totalVowels` 来将它们分组。然后第\
  \ 29–40 行使用 `finalize` 函数为 `group` 对象添加一个新的 `obj.total` 属性，该属性是对象的 `obj.vowels`\
  \ 和 `obj.consonants` 属性之和。图 15.8 显示列表 15.8 代码的输出。\n\n列表 15.8 `doc_group.js`: 通过\
  \ MongoDB 集合中的特定字段对文档集分组\n\n```javascript\n01 var MongoClient = require('mongodb').MongoClient;\n\
  02 MongoClient.connect(\"mongodb://localhost/\", function(err, db) {\n03   var myDB\
  \ = db.db(\"words\");\n04   myDB.collection(\"word_stats\", groupItems);\n05   setTimeout(function(){\n\
  06     db.close();\n07   }, 3000);\n08 });\n09 function groupItems(err, words){\n\
  10   words.group(['first','last'],\n11                   {first:'o',last:{$in:['a','e','i','o','u']}},\n\
  12                   {\"count\":0},\n13                   function (obj, prev) {\
  \ prev.count++; }, true,\n14                   function(err, results){\n15     \
  \        console.log(\"\\n'O' words grouped by first and last\" +\n16          \
  \                   \" letter that end with a vowel: \");\n17             console.log(results);\n\
  18   });\n19   words.group(['first'],\n20                   {size:{$gt:13}},\n21\
  \                   {\"count\":0, \"totalVowels\":0},\n22                   function\
  \ (obj, prev) {\n23                     prev.totalVowels += obj.stats.vowels;\n\
  24                   }, function(obj, prev) {\n25                     obj.total\
  \ = obj.vowels + obj.consonants;\n26                   }, true,\n27            \
  \       function(err, results){\n28                     console.log(\"\\n'O' words\
  \ grouped by first and last: \");\n29                     console.log(results);\n\
  30                   });\n31 }\n```\n\n### 通过结果应用 MapReduce\n\nMapReduce 的一个巨大优势是可以将一次操作的结果还原为另一种操作的结果。通过\
  \ MapReduce 和聚合，你可以从数据库产生结果。\n\n### 了解 aggregate() 方法\n\n`Collection` 对象提供了 `aggregate()`\
  \ 方法来执行聚合。`aggregate()` 的语法如下所示：\n\n```javascript\naggregate(operators, [options],\
  \ callback)\n```\n\n`operators` 参数是一个运算符数组（如表 15.3 所示），允许你定义对数据执行何种聚合操作。`options`\
  \ 参数允许你设置 `readPreference` 属性，该属性定义了从哪里读取数据。`callback` 参数是一个函数，接受第一个参数为错误，第二个参数为结果数组。\n\
  \n### 使用聚合框架运算符\n\nMongoDB 的聚合框架非常强大，因为它允许你多次地将一个聚合运算符的结果管道传输到另一个聚合运算符中。以下数据集展示了一个示例：\n\
  \n```\n{o_id:\"A\", value:50, type:\"X\"}\n{o_id:\"A\", value:75, type:\"X\"}\n\
  {o_id:\"B\", value:80, type:\"X\"}\n{o_id:\"C\", value:45, type:\"Y\"}\n```\n\n\
  下面的聚合运算符集会将 `$match` 的结果管道传输到 `$group` 运算符，然后在回调函数的 `results` 参数中返回分组后的集合。注意，在引用文档中的字段值时，字段名前带有有一个美元符号\
  \ `$` 前缀——例如 `$o_id` 和 `$value`。这种语法告诉聚合框架将其视为字段值而不是字符串。\n\n```javascript\naggregate([\n\
  \  {$match:{type:\"X\"}},\n  {$group:{set_id:\"$o_id\", total: {$sum: \"$value\"\
  }}}\n], function(err, results){});\n```\n\n\n\n\n\n点击此处查看代码图片\n\n```json\n{o_id:\"\
  A\", value:50, type:\"X\"}\n{o_id:\"A\", value:75, type:\"X\"}\n{o_id:\"B\", value:80,\
  \ type:\"X\"}\n```\n\n在应用 `$group` 运算符后，会将一个包含 `set_id` 和 `total` 字段的新对象数组发送到回调函数，如下所示：\n\
  \n```json\n{set_id:\"A\", total:\"125\"}\n{set_id:\"B\", total:\"80\"}\n```\n\n\
  表 15.3 列出了你可以包含在 `aggregate()` 方法的 `operators` 参数中的聚合命令。\n\n### 实施聚合表达式运算符\n\n当你实现聚合运算符时，你正在构建一个新的文档，该文档将被传递到聚合流水线的下一个层级。MongoDB\
  \ 聚合框架提供了许多表达式运算符，可以帮助计算新字段的值或比较文档中的现有字段。\n\n在对 `$group` 聚合管道进行操作时，多个文档会匹配新创建文档中定义的字段。MongoDB\
  \ 提供了一组运算符，你可以将其应用于这些文档，并根据原始文档集中的字段的值计算新分组文档中字段的值。表 15.4 列出了 `$group` 表达式运算符。\n\
  \n![Image](img/00181.jpeg)\n\n表 15.4 **聚合** `$group` **表达式运算符**\n\n此外，在计算新字段值时，还可以应用若干字符串和算术运算符。表\
  \ 15.5 列出了在聚合运算符中计算新字段值时可以使用的一些常用运算符。\n\n![Image](img/00182.jpeg)\n\n表 15.5 **聚合表达式中使用的字符串和算术运算符**\n\
  \n### 聚合示例\n\n列表 15.9 显示了如何对 `words` 集合执行聚合。它包含了三个示例。\n\n第一个示例（第 10–20 行）实现了一个 `$match`\
  \ 来获取以元音开头的单词，然后通过 `$group` 计算最大和最小尺寸。接着使用 `$sort` 对结果进行排序，如图 15.9 所示。\n\n![Image](img/00183.jpeg)\n\
  \n图 15.9 通过特定字段值对 MongoDB 集合中的文档进行分组。\n\n第二个示例（第 21–27 行）使用 `$match` 将单词限制为四个字母。然后在\
  \ `$project` 运算符中使用 `$limit` 仅处理五个文档。\n\n第三个示例（第 28–34 行）使用 `$group` 获取单词的平均尺寸，并将每个单词的\
  \ `_id` 值设置为该单词本身。然后，按平均值降序排列对单词进行排序，如图 15.9 所示。\n\n列表 15.9 `doc_aggregate.js`：根据\
  \ MongoDB 集合中的特定字段对一组文档进行分组\n\n点击此处查看代码图片\n\n* *\n\n```javascript\n01 var MongoClient\
  \ = require('mongodb').MongoClient;\n02 MongoClient.connect(\"mongodb://localhost/\"\
  , function(err, db) {\n03   var myDB = db.db(\"words\");\n04   myDB.collection(\"\
  word_stats\", aggregateItems);\n05   setTimeout(function(){\n06     db.close();\n\
  07   }, 3000);\n08 });\n09 function aggregateItems(err, words){\n10   words.aggregate([{$match:\
  \ {first:{$in:['a','e','i','o','u']}}},\n11                           {$group: {_id:\"\
  $first\",\n12                                     largest:{$max:\"$size\"},\n13\
  \                                     smallest:{$min:\"$size\"},\n14           \
  \                          total:{$sum:1}}},\n15                           {$sort:\
  \ {_id:1}}],\n16                           function(err, results){\n17     console.log(\"\
  Largest and smallest word sizes for \" +\n18                   \"words beginning\
  \ with a vowel: \");\n19     console.log(results);\n20   });\n21   words.aggregate([{$match:\
  \ {size:4}},\n22                           {$limit: 5},\n23                    \
  \       {$project: {_id:\"$word\", size:1}}],\n24                           function(err,\
  \ results){\n25     console.log(\"Words with four letters: \");\n26     console.log(results);\n\
  27   });\n28   words.aggregate([{$match: {size:4}},\n29                        \
  \   {$group: {_id:\"$word\", avg:{$avg:\"$size\"}}},\n30                       \
  \    {$sort: {avg:-1}}],\n31                           function(err, results){\n\
  32     console.log(\"Average size of words: \");\n33     console.log(results);\n\
  34   });\n35 }\n```\n\n\n\n\nMongoose 还将用于实现查询和聚合参数的标准功能封装在新的 `Query` 和 `Aggregate`\
  \ 对象中，这允许你在最终执行操作之前，通过系列方法调用来应用数据库操作参数。这可以简化代码的实现，并复用这些对象的实例来执行多次数据库操作。\n\n### 使用\
  \ Mongoose 连接 MongoDB 数据库\n\n使用 Mongoose 连接到 MongoDB 数据库与第 13 章中讨论的连接字符串方法“MongoDB\
  \ 和 Node.js 入门”非常相似。它使用了如下所示连接字符串格式和选项语法：\n\n点击此处查看代码图像\n\n```\nconnect(uri, options,\
  \ [callback])\n```\n\n***\n\n**注意**\n\n必须使用 `npm install mongoose` 安装 Mongoose 库，才能在你的\
  \ Node.js 中使用它。\n\n***\n\n`connect()` 方法导出在 `mongoose` 模块的根层级。例如，以下代码连接到 `localhost`\
  \ 上的 `words` 数据库：\n\n点击此处查看代码图像\n\n```javascript\nvar mongoose = require('mongoose');\n\
  \nmongoose.connect('mongodb://localhost/words');\n```\n\n可以使用 `mongoose` 模块的 `disconnect()`\
  \ 方法关闭连接。例如：\n\n```javascript\nmongoose.disconnect();\n```\n\n一旦创建完成，可以通过 `mongoose`\
  \ 模块的 `connection` 属性访问底层的 `Connection` 对象。`Connection` 对象提供了对连接、底层 `Db` 对象以及表示集合的\
  \ `Model` 对象的访问。这让你能够访问第 13 章中描述的所有 `Db` 对象功能。例如，要列出数据库上的集合，你可以使用以下代码：\n\n点击此处查看代码图像\n\
  \n```javascript\nmongoose.connection.db.collectionNames(function(err, names){\n\
  \  console.log(names);\n});\n```\n\n`Connection` 对象会发出 `open` 事件，你可以利用它在尝试访问数据库之前等待连接打开。为了说明通过\
  \ Mongoose 使用 MongoDB 连接的基本生命周期，列表 16.1 中的代码导入了 `mongoose` 模块，连接到 MongoDB 数据库，等待\
  \ `open` 事件，显示数据库中的集合并断开连接。输出见图 16.1](#part0028.html_ch16fig01)。\n\n列表 16.1 `mongoose_connect.js`:\
  \ 使用 Mongoose 连接到 MongoDB 数据库\n\n点击此处查看代码图像\n\n***\n\n```javascript\n1 var mongoose\
  \ = require('mongoose');\n2 mongoose.connect('mongodb://localhost/words');\n3 mongoose.connection.on('open',\
  \ function(){\n4   console.log(mongoose.connection.collection);\n5   mongoose.connection.db.collectionNames(function(err,\
  \ names){\n6     console.log(names);\n7     mongoose.disconnect();\n8   });\n9 });\n\
  ```\n\n***\n\n![Image](img/00184.jpeg)\n\n图 16.1 使用 Mongoose 连接到 MongoDB 数据库。\n\n\
  ## 定义 Schema\n\n当你使用 Mongoose 时，通常需要实现 Schema。Schema 定义了集合中文档的字段和字段类型。如果你的数据结构支持支持\
  \ Schema，那么这会非常有用，因为你可以对对象进行验证和类型转换，以匹配 Schema 的要求。\n\n对于 Schema 中的每个字段，你需要定义一个特定的值类型。支持以下值类型：\n\
  \n![Image](img/00003.jpeg) `String`\n\n![Image](img/00003.jpeg) `Number`\n\n![Image](img/00003.jpeg)\
  \ `Boolean` 或 `Bool`\n\n![Image](img/00003.jpeg) `Array`\n\n![Image](img/00003.jpeg)\
  \ `Buffer`\n\n![Image](img/00003.jpeg) `Date`\n\n![Image](img/00003.jpeg) `ObjectId`\
  \ 或 `Oid`\n\n![Image](img/00003.jpeg) `Mixed`\n\n对于你计划使用的每种不同文档类型，都需要定义一个 Schema。此外，你应该在每个集合中只存储一种文档类型。\n\
  \n#### 理解路径 (Paths)\n\nMongoose 使用术语 `path` 来定义主文档以及子文档中字段的访问路径。例如，如果一个文档有一个名为 `name`\
  \ 的字段，该字段是一个带有 `title`、`first` 和 `last` 属性的子文档，以下都是路径：\n\n`name`\n\n`name.title`\n\
  \n`name.first`\n\n`name.last`\n\n#### 创建 Schema 定义\n\n要为模型定义 Schema，你需要创建一个 `Schema`\
  \ 对象的新实例。`Schema` 对象的 `definition` 接收描述 Schema 的对象作为第一个参数，并将 `options` 对象作为第二个参数：\n\
  \n点击此处查看代码图像\n\n```javascript\nnew Schema(definition, options)\n```\n\n`options`\
  \ 对象定义了集合的 Schema。16.1 使用的选项\n\n![Image](img/00003.jpeg)\n\n你可以通过 `Schema` 对象和 `options`\
  \ 对象来定义集合的 Schema。例如，创建一个名为 `students` 的 Schema，其中 `name` 字段为 `String` 类型，`average`\
  \ 字段为 `Number` 类型，`scores` 字段为 `Array`，你可以使用：\n\n点击此处查看代码图像\n\n```javascript\nvar\
  \ schema = new Schema({\n  name: String,\n  average: Number,\n  scores: Array\n\
  });\n```\n\n#### 添加索引 (Indexes)\n\n你可能想要经常查找的字段建立索引。你可以通过 `index(fields)` 命令对 Schema\
  \ 应用索引。例如，以下两种方式都为 `name` 字段添加升序索引：\n\n```javascript\nvar schema = new Schema({\n\
  \  name: {type: String, index: 1}\n});\n```\n\n或者\n\n```javascript\nvar schema =\
  \ new Schema({\n  name: String\n});\n\nschema.index({name:1});\n```\n\n你可以通过 `indexes()`\
  \ 方法获取 Schema 的索引列表。例如：\n\n```javascript\nschema.indexes()\n```\n\n#### 实现唯一字段 (Unique\
  \ Fields)\n\n你可以指定字段的值在集合中是唯一的，这意味着其他文档不能具有相同的值。你通过在 Schema 定义中添加 `unique` 属性来实现。例如，要添加索引并使\
  \ `name` 字段变为唯一，你可以使用：\n\n```javascript\nvar schema = new Schema({\n  name: {type:\
  \ String, index: 1, unique: true}\n});\n```\n\n#### 强制性字段 (Required Fields)\n\n\
  你可以在创建模型的 `Document` 实例时指定必须包含的字段。\n\n```javascript\nvar schema = new Schema({\n\
  \  name: {type: String, index: 1, unique: true, required: true}\n});\n```\n\n你可以通过\
  \ `requiredPaths()` 方法获取 Schema 对象的强制字段列表。例如：\n\n```javascript\nschema.requiredPaths()\n\
  ```\n\n#### 为 Schema 对象添加方法\n\nMongoose Schema 允许你向 Schema 对象添加方法，这些方法在模型对象上自动可用。这允许你通过\
  \ `Document` 对象调用这些方法。\n\n你通过将函数赋值给 `Schema.methods` 属性向 Schema 对象添加方法。该函数只是赋值给\
  \ `Document` 对象的标准函数。可以通过 `this` 关键字访问 `Document` 对象。例如，以下代码为模型分配了一个名为 `fullName`\
  \ 的函数，返回姓和名字的组合：\n\n点击此处查看代码图像\n\n```javascript\nvar schema = new Schema({\n  first:\
  \ String,\n```\n\n\n\n\n```javascript\n  last: String\n\n});\n\nschema.methods.fullName\
  \ = function(){\n\n  return this.first + \" \" + this.last;\n};\n```\n\n### 在 Words\
  \ 数据库上实现 Schema\n\n列表 16.2 在第 15 章中的“从 Node.js 访问 MongoDB 文档””中定义的 `word_stats`\
  \ 集合上实现了一个 Schema。该 Schema 将用于本章中的其他示例，因此它在列表 16.2 的最后一行被导出。注意，`word` 和 `first`\
  \ 字段被分配了 `index`，且 `word` 字段既是 `unique`（唯一的）又是 `required`（必填的）。\n\n对于 `stats` 子文档，其定义方式与常一样，但在第\
  \ 9–11 行指定了类型。同样注意对于 `charsets` 字段（它是子文档数组），语法定义了一个数组并为模型定义了单个子文档类型。第 13–15 行实现了\
  \ `startsWith()` 方法，该方法在模型的 `Document` 对象上可用。图 16.2 显示了所需路径和索引的输出。\n\n列表 16.2 `word_schema.js`：为\
  \ `word_stats` 集合定义 Schema\n\n点击此处查看代码图片\n\n*** *\n\n```javascript\n01 var mongoose\
  \ = require('mongoose');\n02 var Schema = mongoose.Schema;\n03 var wordSchema =\
  \ new Schema({\n04   word: {type: String, index: 1, required:true, unique: true},\n\
  05   first: {type: String, index: 1},\n06   last: String,\n07   size: Number,\n\
  08   letters: [String],\n09   stats: {\n10     vowels:Number, consonants:Number},\n\
  11   charsets: [{ type: String, chars: [String]}]\n12 }, {collection: 'word_stats'});\n\
  13 wordSchema.methods.startsWith = function(letter){\n14   return this.first ===\
  \ letter;\n15 };\n16 exports.wordSchema = wordSchema;\n17 console.log(\"Required\
  \ Paths: \");\n18 console.log(wordSchema.requiredPaths());\n19 console.log(\"Indexes:\
  \ \");\n20 console.log(wordSchema.indexes());\n```\n\n*** *\n\n![Image](img/00186.jpeg)\n\
  \n图 16.2 显示 `wordSchema` 中所需的路径和索引字段。\n\n### 编译模型\n\n一旦你为模型定义了 `Schema` 对象，就需要将其编译为\
  \ `Model` 对象。当 Mongoose 编译模型时，它会使用 `mongoose.connect()` 建立的 MongoDB 数据库连接，以确保在应用更改时创建集合并具有适当的索引，以及必填和唯一设置。\n\
  \n编译后的 `Model` 对象的运行方式与第 13 章` 方法。`model()` 方法的语法如下：\n\n点击此处查看代码图片\n\n`model(name,\
  \ [schema], [collection], [skipInit])`\n\n`name` 参数是一个字符串，你可以以后通过 `model(name)`\
  \ 查找该模型。`schema` 参数是上一节讨论的 `Schema` 对象。`collection` 参数是如果在 `Schema` 对象中未指定，则要连接的集合名称。`skipInit`\
  \ 是一个布尔值，默认为 `false`。当它为 `true` 时，将跳过初始化过程，创建一个与数据库没有连接的简单 `Model` 对象。\n\n以下是为列表\
  \ 16.2 中定义的 `Schema` 对象编译模型的示例：\n\n点击此处查看代码图片\n\n```javascript\nvar Words = mongoose.model('Words',\
  \ wordSchema);\n```\n\n你随后可以使用以下代码随时访问编译后的 `Model` 对象：\n\n```javascript\nmongoose.model('Words')\n\
  ```\n\n### 理解 Query 对象\n\n一旦你将 `Schema` 对象编译为 `Model` 对象，你就可以完全准备好开始在模型中访问、添加、更新和删除文档，这会对底层的\
  \ MongoDB 数据库产生更改。然而，在着手之前，你需要理解 Mongoose 提供的 `Query` 对象的本质。\n\n`Model` 对象中的许多方法与第\
  \ 13 章中定义的 `Collection` 对象的方法匹配。例如，有 `find()`、`remove()`、`update()`、`count()`、`distinct()`\
  \ 和 `aggregate()` 方法。`Query` 对象允许你在执行请求之前对其进行构建。\n\n当你不传递回调函数时，Mongoose 返回一个 `Query`\
  \ 对象而不是执行操作。这允许你在执行之前构建请求。你可以通过方法链式调用为请求添加额外功能。当你准备好执行时，调用 `exec()` 方法并传递回调。\n\n\
  为了更好地理解这一点，请考虑以下示例：\n\n点击此处查看代码图片\n\n```javascript\nmodel.find({$gt:5}, {sort:-1})\n\
  ```\n\n然而，当你使用 Mongoose 时可以单独定义 `query`：\n\n点击此处查看代码图片\n\n```javascript\nvar query\
  \ = model.find({});\nquery.where('value').gt(5);\nquery.sort('-value');\nquery.select('name\
  \ title');\nquery.exec(function(err, results){});\n```\n\n你也可以这样链式 `Query` 对象的方法：\n\
  \n点击此处查看代码图片\n\n```javascript\nmodel.find({})\n  .where('value').lt(5)\n  .sort('-value')\n\
  \  .select('name title')\n  .exec(function(err, results){});\n```\n\n### 设置 Query\
  \ 数据库操作\n\n每个 `Query` 对象必须关联一个数据库操作。数据库操作决定了连接数据库时执行的操作。有两种方法为 `Query` 对象分配数据库操作。一种是从\
  \ `Model` 对象调用操作且不指定回调。返回的 `Query` 对象已分配了该操作。例如：\n\n```javascript\nvar query = model.find();\n\
  ```\n\n一旦你已经有一个 `Query` 对象，可以通过在 `Query` 对象上调用方法来更改应用的操作。例如，以下代码创建了一个 `Query` 对象，它首先应用\
  \ `count()` 操作，然后应用 `find()` 操作。`where()` 子句适用于这两者：\n\n点击此处查看代码图片\n\n```javascript\n\
  var query = model.count();\nquery.where('value').lt(5);\nquery.exec(function(){});\n\
  \nquery.find();\nquery.exec(function(){});\n```\n\n\n\n\n\n这允许你动态复用同一个 `Query` 对象来执行多次数据库操作。表\
  \ 16.2 列出了你可以在 `Query` 对象上调用的方法。你也可以在编译后的 `Model` 对象上使用这些方法，该对象可以通过省略回调函数来返回一个 `Query`\
  \ 对象。请记住，如果你向这些方法中的任何一个传递了回调函数，则操作将执行并在完成后调用该回调。\n\n![Image](img/00187.jpeg)![Image](img/00188.jpeg)\n\
  \n表 16.2 `Query` 和 `Model` 对象上可用于设置数据库操作的方法\n\n### 设置 Query 数据库操作选项\n\n`Query` 对象还有一些方法，允许你设置如\
  \ `limit`、`skip` 和 `select` 等选项，这些选项定义了请求在服务器上如何处理。你可以在 表 16.2 中列出的方法的 `options`\
  \ 参数中设置这些选项，或者通过调用 表 16.3 中列出的 `Query` 对象上的方法来设置。\n\n![Image](img/00189.jpeg)\n\n\
  表 16.3 `Query` 和 `Model` 对象上可用于设置数据库操作选项的方法\n\n### 设置 Query 操作符\n\n`Query` 对象允许你设置用于查找想要应用数据库操作的文档的操作符和值。这些操作符定义了类似于“字段值大于某个数值”的内容。所有操作符都基于字段路径工作；你可以通过使用\
  \ `where()` 方法指定此路径，或将其包含在操作方法中。如果没有指定操作方法，则使用最后一次传递给 `where()` 方法的路径。\n\n例如，`gt()`\
  \ 操作符与 `value` 字段进行比较：\n\n```\nquery.where('value').gt(5)\n```\n\n然而，在下面的语句中，`lt()`\
  \ 操作符与 `score` 字段进行比较：\n\n点击此处查看代码图片\n\n```\nquery.where('value').gt(5).lt('score',\
  \ 10);\n```\n\n表 16.4 列出了可以应用到 `Query` 对象上的最常用方法。\n\n![Image](img/00190.jpeg)![Image](img/00191.jpeg)![Image](img/00192.jpeg)\n\
  \n表 16.4 `Query` 对象上可用于定义查询操作符的方法\n\n### 理解文档对象 (Document Object)\n\n当你使用 `Model`\
  \ 对象从数据库检索文档时，文档会在回调函数中以 Mongoose `Document` 对象的形式呈现。`Document` 对象继承自 `Model` 类，并代表集合中的文档。`Document`\
  \ 对象通过提供许多支持验证、修改等的方法和额外属性，允许你从模式模型（schema model）的角度与文档交互。\n\n表 16.5 列出了 `Document`\
  \ 对象上最有用的方法和属性。\n\n![Image](img/00193.jpeg)![Image](img/00194.jpeg)\n\n表 16.5 `Document`\
  \ 对象上可用的方法和属性\n\n## 使用 Mongoose 查找文档\n\n使用 `mongoose` 模块查找文档与使用 MongoDB Node.js\
  \ 原生驱动非常相似，但在某些方面又非常不同。逻辑操作符、limit、skip 和 distinct 的概念都是相同的。然而，存在两个巨大的区别。第一个主要区别是，当使用\
  \ Mongoose 时，由于本章之前讨论过的 `Query` 对象，用于构建请求的语句可以被管道连接（pipe）在一起并复用。这使得 Mongoose 代码在定义返回哪些文档以及如何返回这些文档时变得更加动态和灵活。\n\
  \n例如，这三个查询是完全相同的，只是构建方式不同：\n\n点击此处查看代码图片\n\n```\nvar query1 = model.find({name:'test'},\
  \ {limit:10, skip:5, fields:{name:1,value:1}});\n\nvar query2 = model.find().where('name','test').limit(10).skip(5).\n\
  select({name:1,value:1});\n\nvar query3 = model.find();\nquery3.where('name','test');\n\
  query3.limit(10).skip(5);\nquery3.select({name:1,value:1});\n```\n\n使用 Mongoose\
  \ 构建 `Query` 对象时遵循的一个良好规则是：只在代码中添加你确定需要的内容。\n\n第二个主要区别是，MongoDB 操作（如 `find()` 和\
  \ `findOne()`）返回的是 `Document` 对象而不是 JavaScript 对象。具体来说，`find()` 返回一个 `Document`\
  \ 对象数组而不是 `Cursor` 对象，而 `findOne()` 返回单个 `Document` 对象。`Document` 对象允许你执行 表 16.5\
  \ 中列出的操作。\n\n代码列表 16.3 展示了使用 Mongoose 方式从数据库检索对象的几个示例。（注：原文此处存在大量重复段落，翻译已按要求去重处理处理）\n\
  \n\n\n\n\n`save()` 方法在已经创建的 `Document` 对象上被调用。即使文档在 MongoDB 数据库中尚未创建，也可以调用它，在这种情况下，将插入新文档。`save()`\
  \ 方法的语法为：\n\n`save([callback])`\n\nListing 16.4 中的代码还展示了如何使用 Mongoose 的 `save()`\
  \ 方法向集合添加文档。注意第 6–11 行创建了一个新的 `Document` 实例，并在该 `Document` 实例上调用了 `save()` 方法。\n\
  \n**Listing 16.4 `mongoose_create.js`: 使用 Mongoose 在集合中创建新文档**\n\n点击此处查看代码图片\n\n\
  * * *\n\n```\n01 var mongoose = require('mongoose');\n02 var db = mongoose.connect('mongodb://localhost/words');\n\
  03 var wordSchema = require('./word_schema.js').wordSchema;\n04 var Words = mongoose.model('Words',\
  \ wordSchema);\n05 mongoose.connection.once('open', function(){\n06    var newWord1\
  \ = new Words({\n07      word:'gratifaction',\n08      first:'g', last:'n', size:12,\n\
  09      letters: ['g','r','a','t','i','f','c','o','n'],\n10      stats: {vowels:5,\
  \ consonants:7}\n11    });\n12    console.log(\"Is Document New? \" + newWord1.isNew);\n\
  13    newWord1.save(function(err, doc){\n14      console.log(\"\\nSaved document:\
  \ \" + doc);\n15    });\n16    var newWord2 = { word:'googled',\n17      first:'g',\
  \ last:'d', size:7,\n18      letters: ['g','o','l','e','d'],\n19      stats: {vowels:3,\
  \ consonants:4}\n20    };\n21    var newWord3 = {\n22      word:'selfie',\n23  \
  \    first:'s', last:'e', size:6,\n24      letters: ['s','e','l','f','i'],\n25 \
  \     stats: {vowels:3, consonants:3}\n26    };\n27    Words.create([newWord2, newWord3],\
  \ function(err){\n28      for(var i=1; i<arguments.length; i++){\n29        console.log(\"\
  \\nCreated document: \" + arguments[i]);\n30      }\n31      mongoose.disconnect();\n\
  32    });\n33 });\n```\n\n* * *\n\n## 使用 Mongoose 更新文档\n\n在使用 Mongoose 时，有几种方法可以更新文档。使用哪种取决于应用程序的性质。一种方法是简单调用上一节描述的\
  \ `save()` 函数。你可以在已经在数据库创建的对象上调用 `save()` 方法。\n\n另一种方法是在 `Document` 对象上使用 `update()`\
  \ 进行单个更新，或者在 `Model` 对象上使用 `update()` 更新模型中的多个文档。`update()` 方法的优点是可以应用于多个对象，并且提供了略高的性能。接下来的章节将描述这些方法。\n\
  \n#### 保存文档更改\n\n你已经看到如何使用 `save()` 方法向数据库添加新文档。你也可以用它来更新现有对象。通常在处理 MongoDB 时，`save()`\
  \ 方法是最方便的，因为你已经有一个 `Document` 对象的实例。\n\n`save()` 方法会检测对象是否为新，确定哪些字段发生了变化，然后构建一个数据库请求来更新数据库中的这些字段。Listing\
  \ 16.5 展示了如何实现 `save()` 请求。它从数据库中检索单词 `book` 并将其首字母大写，从而改变了单词和首字母字段。\n\n注意第 8 行中的\
  \ `doc.isNew` 报告文档不是新的。此外，第 14 行通过 `doc.modifiedFields()` 将修改后的字段报告到控制台。这些是将要更新的字段。图\
  \ 16.5 显示了完整的结果。\n\n**Listing 16.5 `mongoose_save.js`: 使用 Mongoose 在集合中保存文档**\n\n\
  点击此处查看代码图片\n\n* * *\n\n```\n01 var mongoose = require('mongoose');\n02 var db =\
  \ mongoose.connect('mongodb://localhost/words');\n03 var wordSchema = require('./word_schema.js').wordSchema;\n\
  04 var Words = mongoose.model('Words', wordSchema);\n05 mongoose.connection.once('open',\
  \ function(){\n06    var query = Words.findOne().where('word', 'book');\n07    query.exec(function(err,\
  \ doc){\n08      console.log(\"Is Document New? \" + doc.isNew);\n09      console.log(\"\
  \\nBefore Save: \");\n10      console.log(doc.toJSON());\n11      doc.set('word','Book');\n\
  12      doc.set('first','B');\n13      console.log(\"\\nModified Fields: \");\n\
  14      console.log(doc.modifiedFields());\n15      doc.save(function(err){\n16\
  \        Words.findOne({word:'Book'}, function(err, doc){\n17          console.log(\"\
  \\nAfter Save: \");\n18          console.log(doc.toJSON());\n19          mongoose.disconnect();\n\
  20        });\n21      });\n22    });\n23 });\n```\n\n* * *\n\n![Image](img/00197)\n\
  \n图 16.5 使用 Mongoose 在集合中保存文档。\n\n#### 更新单个文档\n\n`Document` 对象提供了 `update()` 方法，允许你使用\
  \ 表 14.2 中描述的 `update` 操作符更新单个文档。`Document` 对象上 `update()` 方法的语法所示：\n\n点击此处查看代码图片\n\
  \n`update(query, update, [options], [callback])`\n\n`query` 参数定义了用于识别更新对象的查询。`update`\
  \ 参数是一个对象，定义了要在文档上执行的更新操作。`options` 参数指定写入偏好，`callback` 参数接受错误作为第一个参数，以及更新的文档数量。\n\
  \n\n\n\n\n在模型级别进行更新的一个很好的处是，你可以使用 `Query` 对象来定义哪些对象应该被更新。列表 16.7 展示了使用 `update()`\
  \ 方法将匹配正则 `/grati.*/` 的单词的 `size` 字段更新为 `0` 的示例。注意第 11 行定义了一个 `update` 对象，但代码在第\
  \ 14 行执行之前，向 `Query` 对象添加了多个查询选项。然后，代码又发起了另一个 `find()` 请求，这次使用正则 `/grat.*/`，用以显示只有匹配更新查询的内容实际上才发生了变化。图\
  \ 16.7 显示了列表 16.7 的输出结果。\n\n列表 16.7 `mongoose_update_many.js`: 使用 Mongoose 更新集合中的多个文档\n\
  \n点击此处查看代码图片\n\n```javascript\n01 var mongoose = require('mongoose');\n02 var db\
  \ = mongoose.connect('mongodb://localhost/words');\n03 var wordSchema = require('./word_schema.js').wordSchema;\n\
  04 var Words = mongoose.model('Words', wordSchema);\n05 mongoose.connection.once('open',\
  \ function(){\n06    Words.find({word:/grati.*/}, function(err, docs){\n07     \
  \ console.log(\"Before update: \");\n08      for (var i in docs){\n09        console.log(docs[i].word\
  \ + \" : \" + docs[i].size);\n10      }\n11      var query = Words.update({}, {$set:\
  \ {size: 0}});\n12      query.setOptions({multi: true});\n13      query.where('word').regex(/grati.*/);\n\
  14      query.exec(function(err, results){\n15        Words.find({word:/grat.*/},\
  \ function(err, docs){\n16          console.log(\"\\nAfter update: \");\n17    \
  \      for (var i in docs){\n18            console.log(docs[i].word + \" : \" +\
  \ docs[i].size);\n19          }\n20          mongoose.disconnect();\n21        });\n\
  22      });\n23    });\n24 });\n```\n\n![Image](img/00199.jpeg)\n\n图 16.7 使用 Mongoose\
  \ 更新集合中的多个文档。\n\n### 使用 Mongoose 删除文档\n\n使用 Mongoose 从集合中删除对象主要有两种选项。首先，你可以在 `Document`\
  \ 对象上使用 `remove()` 方法进行单条删除，也可以在 `Model` 对象上使用它来删除模型中的多个文档。如果你已经有了一个 `Document`\
  \ 实例，删除单个对象通常非常方便。然而，在模型级别同时删除多个文档通常要高效得多。接下来的章节描述了这些方法。\n\n#### 删除单个文档\n\n`Document`\
  \ 对象提供了 `remove()` 方法，允许你从模型中删除单个文档。`Document` 对象上 `remove()` 方法的语法如下所示：\n\n```\n\
  remove( [callback])\n```\n\n如果发生错误，`callback` 参数将接收错误作为唯一参数；如果删除成功，则接收被删除的文档作为第二个参数。\n\
  \n列表 16.8 展示了使用 `remove()` 方法移除单词 `unhappy` 的示例。图 16.8 显示了列表 16.8 的输出结果。\n\n列表 16.8\
  \ `mongoose_remove_one.js`: 使用 Mongoose 从集合中删除一个文档\n\n点击此处查看代码图片\n\n```javascript\n\
  01 var mongoose = require('mongoose');\n02 var db = mongoose.connect('mongodb://localhost/words');\n\
  03 var wordSchema = require('./word_schema.js').wordSchema;\n04 var Words = mongoose.model('Words',\
  \ wordSchema);\n05 mongoose.connection.once('open', function(){\n06    var query\
  \ = Words.findOne().where('word', 'unhappy');\n07    query.exec(function(err, doc){\n\
  08      console.log(\"Before Delete: \");\n09      console.log(doc);\n10      doc.remove(function(err,\
  \ deletedDoc){\n11        Words.findOne({word:'unhappy'}, function(err, doc){\n\
  12          console.log(\"\\nAfter Delete: \");\n13          console.log(doc);\n\
  14          mongoose.disconnect();\n15        });\n16      });\n17 });\n```\n\n\
  ![Image](img/00200.jpeg)\n\n图 16.8 使用 Mongoose 从集合中删除一个文档。\n\n#### 删除多个文档\n\n`Model`\
