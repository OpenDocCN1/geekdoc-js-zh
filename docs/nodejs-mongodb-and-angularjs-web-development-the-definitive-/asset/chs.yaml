  \n![图片](img/00003.jpeg) `../lib`：包含示例中使用的必要 AngularJS 库文件的文件夹。\n\n### 定义评论、回复、照片和页面模型\n\
  \n\n\n\n\n你始终应该将对象模型需求视为实现应用程序的第一步。在这个示例中，目标是允许用户在网页上添加评论。为了实现这一点，你首先需要识别用户可以评论的对象。此示例提供了一个包含几张照片的网页。当你允许用户为网页和单个照片都添加评论时，你将利用重用性。你需要一个页面的模型和一个照片的模型，以提供可以挂载评论的对象。后续章节将讨论模型架构（schemas）的设计。\n\
  \n## 定义页面模型\n\nListing 27.1 实现了应用程序的 `Page` 模型架构。该架构非常简单，仅包含 `name` 和 `commentId`\
  \ 字段。注意 `name` 字段被设置为唯一，这对于能够通过名称查找页面是必要的。`Page` 模型的主要目的是提供一个地方，你可以在那里将网页与评论线程关联\n\
  \nListing 27.1 `page_model.js`: 为 Mongoose 实现 `Page` 模型\n\n点击此处查看代码图片\n\n```javascript\n\
  01 var mongoose = require('mongoose'),\n02     Schema = mongoose.Schema;\n03 var\
  \ PageSchema = new Schema({\n04     name: {type: String, unique: true},\n05    \
  \ commentId: Schema.ObjectId\n06 });\n07 mongoose.model('Page', PageSchema);\n```\n\
  \n## 定义照片模型\n\nListing 27.2 实现了应用程序的 `Photo` 模型架构。该架构也非常基础；它包含了 `title`、`filename`、`timestamp`\
  \ 和 `commentId` 字段。`commentId` 字段与 `Page` 模型中的 `commentId` 字段用途相同。这个重用的字段使得之后向应用程序添加的任何额外页面或对象模型添加评论变得更加容易\n\
  \nListing 27.2 `photo_model.js`: 为 Mongoose 实现 `Photo` 模型\n\n点击此处查看代码图片\n\n```javascript\n\
  01 var mongoose = require('mongoose'),\n02     Schema = mongoose.Schema;\n03 var\
  \ PhotoSchema = new Schema({\n04     title: String,\n05     filename: String,\n\
  06     timestamp: { type: Date, default: Date.now },\n07     commentId: Schema.ObjectId\n\
  08 });\n09 mongoose.model('Photo', PhotoSchema);\n```\n\n## 定义评论线程模型\n\n评论模型的目标是支持嵌套评论。在\
  \ MongoDB 中有几种不同的方法可以实现这一点。你可以将每个评论存储为独立的文档，并提供指向父对象的链接，也可以将一个线程的所有评论存储在单个文档中。两种方法都可行，但它们的实现方式和后果截然不同。\n\
  \n将评论树存储在单个文档中使得从 MongoDB 加载变得简单且快速。缺点是，由于评论没有固定的深度，当添加新评论时，需要保存整个回复结构。此外，你需要获取整个文档才能获取任何一个评论。\n\
  \n将评论存储为独立的文档意味着你可以轻松查找单个文档，并且保存任何额外的评论/回复也是很简单的，因为它们是单条文档。然而，如果你想加载整个评论树，就必须实现一个复杂的聚合函数或进行多次查找来构建树，而这些方法的效率都远低于加载单个文档。\n\
  \n由于评论被读取非常频繁，但创建频率并不高，因此一种很好的方法是将嵌套评论/回复结构存储在单个 MongoDB 文档中，然后在添加新评论时更新整个结构。\n\n\
  Listing 27.3 实现了 `CommentThread` 和 `Reply` 模型架构。`CommentThread` 模型架构用作给定对象评论的根文档。`Reply`\
  \ 模型架构设计用于存储添加到页面或照片上的评论/回复。注意 `Reply` 和 `CommentThread` 对象的 `replies` 字段都是一个由回复架构对象的数组：\n\
  \n`replies:[ReplySchema]`\n\n这种设置允许评论相互嵌套，并可以在同一层级创建多条评论。图 27.1 显示了存储在 MongoDB 中的实际文档的嵌套结构。\n\
  \nListing 27.3 `comments_model.js`: 为 Mongoose 实现 `CommentThread` 模型\n\n点击此处查看代码图片\n\
  \n```javascript\n01 var mongoose = require('mongoose'),\n02     Schema = mongoose.Schema;\n\
  03 var ReplySchema = new Schema({\n04     username: String,\n05     subject: String,\n\
  06     timestamp: { type: Date, default: Date.now },\n07     body: String,\n08 \
  \    replies:[ReplySchema]\n09 }, { _id: true });\n10 var CommentThreadSchema =\
  \ new Schema({\n11     replies:[ReplySchema]\n12 });\n13 mongoose.model('Reply',\
  \ ReplySchema);\n14 mongoose.model('CommentThread', CommentThreadSchema);\n```\n\
  \n![图 27.1] 带有嵌套回复的 `CommentThread` 对象。\n\n## 创建服务器\n\n定义模型后，你可以开始实现服务器了。Listing\
  \ 27.4 实现了 Express 服务器。这段代码你应该应该很熟悉。它包含了 `express` 和 `mongoose` 库并连接到 MongoDB。注意服务器内部对每个模型都有一个\
  \ `require` 语句。\n\nListing 27.4 `comments_server.js`: 使用 Express 实现评论应用程序服务器并连接到\
  \ MongoDB\n\n点击此处查看代码图片\n\n```javascript\n01 var express = require('express');\n\
  02 var bodyParser = require('body-parser');\n03 var mongoose = require('mongoose');\n\
  04 var db = mongoose.connect('mongodb://localhost');\n05 require('./comments_model.js');\n\
  06 require('./photo_model.js');\n07 require('./page_model.js');\n08 var app = express();\n\
  09 app.engine('.html', require('ejs'));\n10 app.set('views', __dirname + '/views');\n\
  11 app.set('view engine', 'html');\n12 app.use(bodyParser());\n13 require('./comments_routes')(app);\n\
  14 app.listen(80);\n```\n\n## 实现查看和添加评论的路由\n\n作为 Express 配置的一部分，你加载了如 Listing 27.4\
  \ 所示的 `./comment_routes.js` 文件。Listing 27.5 提供了提供了获取页面、照片和评论数据的必要路由，以及向照片或页面添加额外评论的路由。\n\
  \n第 6 到 9 行实现了静态路由，以支持此示例中 AngularJS、CSS、JavaScript、图像和 AngularJS 部分模板。图像和 AngularJS\
  \ `lib` 文件夹位于项目的并行目录。其他静态文件位于项目内部的 `./static` 文件夹。\n\n注意当用户访问网站根路径时，第 9 行渲染了 `photos.html`\
  \ 模板。第 13 到 17 行的路由都涉及与 MongoDB 数据库的交互，并在下一节描述的控制器路由处理程序中处理。\n\nListing 27.5 `comments_routes.js`:\
  \ 为 Express 实现评论应用程序路由\n\n点击此处查看代码图片\n\n```javascript\n01 var express = require('express');\n\
  02 module.exports = function(app) {\n03     var photos = require('./controllers/photos_controller');\n\
  04     var comments = require('./controllers/comments_controller');\n05     var\
  \ pages = require('./controllers/pages_controller');\n06     app.use('/static',\
  \ express.static( './static')).\n07     app.use('/images', express.static( '../images')).\n\
  08     app.use('/lib', express.static( '../lib')\n09     );\n10 };\n```\n\n\n\n\n\
  \n```javascript\napp.get('/', function(req, res){\n  res.render('photos');\n});\n\
  app.get('/photos', photos.getPhotos);\napp.get('/photo', photos.getPhoto);\napp.get('/page',\
  \ pages.getPage);\napp.get('/comments/get', comments.getComment);\napp.post('/comments/add',\
  \ comments.addComment);\n```\n\n### 实现基于模型的控制器路由\n\n除了实现标准的路由处理外，你还需要实现与数据库交互的路由处理。你将将这些路由处理程序从标准的\
  \ `comment_route.js` 文件中提取出来，并为每个模型创建独立的文件，以保持代码的整洁并确保良好的职责划分。\n\n以下章节涵盖了针对 `Page`、`Photo`\
  \ 和 `CommentThread` 模型的特定控制器的实现。\n\n#### 实现 Page 模型控制器\n\nListing 27.6 实现了 `Page`\
  \ 模型的路由处理代码。只有一个路由，即 `getPage()` 路由，它根据 `name` 字段查找页面，并返回错误或对象的 JSON 字符串格式。要查找的页面名称通过\
  \ `GET` 查询字符串中的 `pageName` 传入。\n\nListing 27.6 `pages_controller.js`: 为 Express\
  \ 服务器实现 `getPage` 路由\n\n点击此处查看代码图片\n\n```javascript\nvar mongoose = require('mongoose'),\n\
  \    Page = mongoose.model('Page');\nexports.getPage = function(req, res) {\n  Page.findOne({\
  \ name: req.query.pageName })\n    .exec(function(err, page) {\n      if (!page){\n\
  \        res.json(404, {msg: 'Page Not Found.'});\n      } else {\n        res.json(page);\n\
  \      }\n    });\n};\n```\n\n#### 实现 Photo 模型控制器\n\nListing 27.7 实现了 `Photo` 模型的路由处理代码。处理了两个路由。`getPhoto()`\
  \ 路由处理程序根据 `GET` 查询字符串中作为 `photoId` 传入的 `_id` 字段查找单个 `Photo` 文档。`getPhotos()` 路由处理程序检索所有\
  \ `Photo` 文档。两个处理程序都返回结果的 JSON 字符串格式。\n\nListing 27.7 `photos_controller.js`: 在\
  \ Express 服务器中实现 `getPhoto` 和 `getPhotos` 路由以获取照片\n\n点击此处查看代码图片\n\n```javascript\n\
  var mongoose = require('mongoose'),\n    Photo = mongoose.model('Photo');\nexports.getPhoto\
  \ = function(req, res) {\n  Photo.findOne({ _id: req.query.photoId })\n    .exec(function(err,\
  \ photo) {\n      if (!photo){\n        res.json(404, {msg: 'Photo Not Found.'});\n\
  \      } else {\n        res.json(photo);\n      }\n    });\n};\nexports.getPhotos\
  \ = function(req, res) {\n  Photo.find()\n    .exec(function(err, photos) {\n  \
  \    if (!photos){\n        res.json(404, {msg: 'Photos Not Found.'});\n      }\
  \ else {\n        res.json(photos);\n      }\n    });\n};\n```\n\n#### 实现 CommentThread\
  \ 模型控制器\n\nListing 27.8 实现了 `CommentThread` 模型的路由处理代码。处理了两个路由：`getComment()` 和 `addComment()`。由于文件较大，这两个路由的代码在后续章节中进行了拆分说明。\n\
  \n##### 实现 getComment() 路由\n\n`getComment()` 路由处理程序根据 `GET` 请求查询字符串中作为 `commentId`\
  \ 传入的 `_id` 字段查找单个 `CommentThread` 文档。\n\nListing 27.8 `comments_controller.js-getComment`:\
  \ 为 Express 服务器实现获取评论线程的路由\n\n点击此处查看代码图片\n\n```javascript\nexports.getComment =\
  \ function(req, res) {\n  CommentThread.findOne({ _id: req.query.commentId })\n\
  \    .exec(function(err, comment) {\n      if (!comment){\n        res.json(404,\
  \ {msg: 'CommentThread Not Found.'});\n      } else {\n        res.json(comment);\n\
  \      }\n    });\n};\n```\n\n##### 实现 addComment() 路由\n\n`addComment()` 路由程序见 Listing\
  \ 27.9，它比 `getComment()` 复杂一些，涉及函数链以支持嵌套评论。添加新评论的逻辑流如下：\n\n1. 客户端发送请求，包含 `CommentThread`\
  \ ID、用于添加新评论的父评论以及一个代表新评论的 JSON 对象。\n2. `/comment/add` 路由调用 `addComment()`。\n3.\
  \ 使用 `POST` 数据中的 `req.body.rootCommentId` 值定位 `CommentThread` 对象。\n4. 从 `POST` 数据中的\
  \ `req.body.newComment` 值创建一个名为 `newComment` 的新 `Reply` 对象。\n5. 递归运行 `addComment()`，遍历嵌套评论，直到找到与\
  \ `POST` 中传递的 `req.body.parentCommentId` 匹配的评论。\n6. 将新评论推入父评论的 `replies` 数组中。\n\
  7. `updateCommentThread()` 方法使用以下 `update()` 操作来更新 `CommentThread` 文档中的 `replies`\
  \ 字段，使用包含更新后评论的内容：`CommentThread.update({ _id: commentThread.id }, {$set:{replies:commentThread.replies}}).exec();`。\n\
  8. 向客户端返回成功或失败的响应。\n\nListing 27.9 `comments_controller.js-add`: 为 Express 服务器实现\
  \ `addComment()` 路由\n\n点击此处查看代码图片\n\n```javascript\nexports.addComment = function(req,\
  \ res) {\n  CommentThread.findOne({ _id: req.body.rootCommentId })\n    .exec(function(err,\
  \ commentThread) {\n      if (!commentThread){\n        res.json(404, {msg: 'CommentThread\
  \ Not.'});\n      } else {\n        var newComment = Reply(req.body.newComment);\n\
  \        newComment.username = generateRandomUsername();\n        addComment(req,\
  \ res, commentThread, commentThread, req.body.parentCommentId, newComment);\n  \
  \    }\n    });\n};\nfunction addComment(req, res, commentThread, currentComment,\
  \ parentId, newComment) {\n  if (commentThread.id == parentId){\n    commentThread.replies.push(newComment);\n\
  \    updateCommentThread(req, res, commentThread);\n  } else {\n    for(var i=0;\
  \ i< currentComment.replies.length; i++){\n      var c = currentComment.replies[i];\n\
  \      if (c._id == parentId){\n        c.replies.push(newComment);\n        var\
  \ replyThread = commentThread.replies.toObject();\n        updateCommentThread(req,\
  \ res, commentThread);\n        break;\n      } else {\n        addComment(req,\
  \ res, commentThread, c, parentId, newComment);\n      }\n    }\n  }\n}\nfunction\
  \ updateCommentThread(req, res, commentThread){\n  CommentThread.update({ _id: commentThread.id\
  \ }, {$set:{replies:commentThread.replies}})\n    .exec(function(err, savedComment){\n\
  \      if (err){\n        res.json(404, {msg: 'Failed to update CommentThread.'});\n\
  \      } else {\n        res.json({msg: \"success\"});\n      }\n    });\n}\n```\n\
  \n##### 查看 Comment 模型路由处理器\n\nListing 27.10 显示了 `comments_controller.js` 的完整实现。`Comment`\
  \ 模型路由处理器代码加载了 `CommentThread` 和 `Reply` 模型的架构。`CommentThread` 模型提供了查找 `CommentThread`\
  \ 文档以及在添加新评论时更新它们的能力。`Reply` 模型在添加新评论时创建 `Reply` 对象。\n\n评论控制器提供了一个用于测试的随机生成用户名的函数：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```javascript\nfunction generateRandomUsername(){\n  //通常用户名会来自身份验证后的\
  \ session\n  var users=['DaNae', 'Brad', 'Brendan', 'Caleb', 'Aedan', 'Taeg'];\n\
