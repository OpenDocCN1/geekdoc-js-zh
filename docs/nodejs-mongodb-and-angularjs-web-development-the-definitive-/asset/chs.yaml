  \ 模型的交互。本章稍后部分 Listing 26.9 中的代码在单独的文件实现了数据库交互路由，以便将功能与普通路由分离离开。由于 `users_conroller.js`\
  \ 代码的规模较大，接下来的章节将逐一讨论每个路由。\n\n#### 实现用户注册路由\n\nListing 26.4 实现了 `signup` 路由。该路由中的逻辑首先创建一个新的\
  \ `User` 对象，然后添加电子邮件地址和哈希后的密码，使用在同一文件中定义的 `hashPW()` 函数。然后在该对象上调用 Mongoose 的 `save()`\
  \ 方法将其存储在数据库中。如果发生错误，用户将重定向回注册页面。如果用户保存成功，MongoDB 创建的 ID 将作为 `req.session.user`\
  \ 属性添加，用户名将作为 `req.session.username` 添。随后请求将引导重定向到索引页。\n\nListing 26.4 `users_controller.js`:\
  \ 为 Express 服务器实现用户注册路由\n\n点击此此处查看代码图像\n\n```javascript\n08 exports.signup = function(req,\
  \ res){\n09   var user = new User({username:req.body.username});\n10   user.set('hashed_password',\
  \ hashPW(req.body.password));\n11   user.set('email', req.body.email);\n12   user.save(function(err)\
  \ {\n13      if (err){\n14         res.session.error = err;\n15         res.redirect('/signup');\n\
  16      } else {\n17         req.session.user = user.id;\n18         req.session.username\
  \ = user.username;\n19         req.session.msg = 'Authenticated as ' + user.username;\n\
  20         res.redirect('/');\n21      }\n22   });\n23 };\n```\n\n#### 实现用户登录路由\n\
  \nListing 26.5 实现了 `login` 路由。首先，处理器通过用户名查找用户，然后将存储的哈希密码与请求发送的密码哈希进行比较。如果密码匹配，则使用\
  \ `regenerate()` 方法重新生成会话。注意 `req.session.user` 和 `req.session.username` 设置在重新生成的会话中。\n\
  \nListing 26.5 `users_controller.js`: 为 Express 服务器实现用户登录路由\n\n点击此此处查看代码图像\n\n```javascript\n\
  24 exports.login = function(req, res){\n25   User.findOne({ username: req.body.username\
  \ })\n26   .exec(function(err, user) {\n27      if (!user){\n28         err = 'User\
  \ Not Found.';\n29      } else if (user.hashed_password === hashPW(req.body.password.toString()))\
  \ {\n30         req.session.regenerate(function(){\n31         req.session.user\
  \ = user.id;\n32         req.session.username = user.username;\n33         req.session.msg\
  \ = 'Authenticated as ' + user.username;\n34         res.redirect('/');\n35    \
  \  });\n36      }else{\n37        err = 'Authentication failed.';\n38      }\n39\
  \      if(err){\n40        req.session.regenerate(function(){\n41         req.session.msg\
  \ = err;\n42         res.redirect('/login');\n43      });\n44      }\n45   });\n\
  46 };\n```\n\n#### 实现获取用户资料路由\n\nListing 26.6 实现了 `getUserProfile` 路由。该处理器通过存储在\
  \ `req.session.user` 中的用户 `id` 查找用户。如果找到了用户，则在请求中返回用户的 JSON 表示表示。如果未找到用户，则发送 404\
  \ 错误。\n\nListing 26.6 `users_controller.js-getUserProfile`: 为 Express 服务器实现获取用户资料的路由\n\
  \n点击此此处查看代码图像\n\n```javascript\n48 exports.getUserProfile = function(req, res) {\n\
