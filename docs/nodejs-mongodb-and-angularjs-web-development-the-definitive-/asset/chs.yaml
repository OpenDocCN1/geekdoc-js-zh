  图 5.9 `stream_transform.js` 的输出，实现了一个自定义的 `Transform` 对象。\n\n### 转换流 (Transform\
  \ Streams)\n\n`Transform` 流 是一种扩展了 `Duplex` 流的流，它在写入数据时对其进行修改并将其输出。`Transform` 流在需要对数据进行某种处理时非常有用。\n\
  \n`Duplex` 流和 `Writable` 流的区别在于，对于 `Transform` 流，你不需要实现 `_write()` 方法。列表 5.9 中的代码演示了实现\
  \ `Transform` 流的基础。图 5.9 显示了列表 5.9 的输出。注意第 18-21 行包含了 `handled` 属性。\n\n### 将可读流导向写流\
  \ (Piping Readable Streams to Writable Streams)\n\n流对象可以执行的最酷的操作之一是使用 `pipe(writableStream,\
  \ [options])` 函数将 `Readable` 流链接到 `Writable` 流中。这正如其名所示：它将 `Readable` 流的输出直接输入 `Writable`\
  \ 流。`options` 参数接受一个将 `end` 属性设置为 `true` 或 `false` 的对象。当 `end` 为 `true` 时，当 `Readable`\
  \ 流结束时，`Writable` 流也会结束。这是默认行为。例如：\n\n```javascript\nreadStream.pipe(writeStream,\
  \ {end:true});\n```\n\n\n\n\n你也可以通过使用 `unpipe(destinationStream)` 选项以编程方式断开管道。列表\
  \ 5.10 中的代码实现了一个 `Readable` 流和一个 `Writable` 流，然后使用 `pipe()` 函数将它们链接在一起。为了向你展示基本过程，来自\
  \ `_write()` 方法的输入数据将输出到图 5.10 所示的控制中。\n\n列表 5.10 `stream_piped.js`: 将一个 `Readable`\
  \ 流管道到一个 `Writable` 流\n\n点击此处查看代码图片\n\n```javascript\n01 var stream = require('stream');\n\
  02 var util = require('util');\n03 util.inherits(Reader, stream.Readable);\n04 util.inherits(Writer,\
  \ stream.Writable);\n05 function Reader(opt) {\n06   stream.Readable.call(this,\
  \ opt);\n07   this._index = 1;\n08 }\n09 Reader.prototype._read = function(size)\
  \ {\n10   var i = this._index++;\n11   if (i > 10){\n12     this.push(null);\n13\
  \   } else {\n14     this.push(\"Item \" + i.toString());\n15   }\n16 };\n17 function\
  \ Writer(opt) {\n18   stream.Writable.call(this, opt);\n19   this._index = 1;\n\
  20 }\n21 Writer.prototype._write = function(data, encoding, callback) {\n22   console.log(data.toString());\n\
  23   callback();\n24 };\n25 var r = new Reader();\n26 var w = new Writer();\n27\
  \ r.pipe(w);\n```\n\n![Image](img/00047.jpeg)\n\n图 5.10 `stream_piped.js` 的输出，实现了流管道操作。\n\
  \n## 使用 Zlib 压缩和解压缩数据\n\n在处理大型系统或移动大量数据时，能够压缩/解压缩数据是非常有用的。Node.js 在 `Zlib` 模块中提供了一个优秀的库，允许你非常容易且高效地对缓冲区数据进行压缩和解压缩。\n\
  \n你需要记住，压缩数据会消耗 CPU 周期，因此在产生压缩/解压缩成本之前，你应该确定压缩数据的益处。`Zlib` 支持这些压缩方法：\n\n![Image](img/00003.jpeg)\
  \ `gzip`/`gunzip`: 标准 `gzip` 压缩。\n\n![Image](img/00003.jpeg) `deflate`/`inflate`:\
  \ 基于哈夫曼编码的标准 deflate 压缩算法。\n\n![Image](img/00003.jpeg) `deflateRaw`/`inflateRaw`:\
  \ 在原始缓冲区上使用的 deflate 压缩算法。\n\n### 压缩和解压缩缓冲区\n\n`Zlib` 模块提供了几个辅助函数，可以轻松地对数据缓冲区进行压缩/解。它们都使用相同的基本格式\
  \ `function(buffer, callback)`，其中 `function` 是压缩/解压缩方法，`buffer` 是要压缩/解压缩的缓冲区，而 `callback`\
  \ 是在压缩/解压缩完成后执行的回调函数。\n\n说明缓冲区压缩/解压缩最简单的方法是展示一些示例。列表 5.11 中的代码提供了几个压缩/解压缩示例，并输出了每个示例的大小结果，如图\
  \ 5.11 所示。\n\n列表 5.11 `zlib_buffers.js`: 使用 `Zlib` 模块压缩/解压缩缓冲区\n\n点击此处查看代码图片\n\n\
  ```javascript\n01 var zlib = require(\"zlib\");\n02 var input = '...............text...............';\n\
  03 zlib.deflate(input, function(err, buffer) {\n04   if (!err) {\n05     console.log(\"\
  deflate (%s): \", buffer.length, buffer.toString('base64'));\n06     zlib.inflate(buffer,\
  \ function(err, buffer) {\n07       if (!err) {\n08         console.log(\"inflate\
  \ (%s): \", buffer.length, buffer.toString());\n09       }\n10     });\n11     zlib.unzip(buffer,\
  \ function(err, buffer) {\n12       if (!err) {\n13         console.log(\"unzip\
  \ (%s): \", buffer.length, buffer.toString());\n14       }\n15     });\n16   }\n\
  17 });\n18 \n19 zlib.deflateRaw(input, function(err, buffer) {\n20   if (!err) {\n\
  21     console.log(\"deflateRaw (%s): \", buffer.length, buffer.toString('base64'));\n\
  22     zlib.inflateRaw(buffer, function(err, buffer) {\n23       if (!err) {\n24\
  \         console.log(\"inflateRaw (%s): \", buffer.length, buffer.toString());\n\
  25       }\n26     });\n27   }\n28 });\n29 \n30 zlib.gzip(input, function(err, buffer)\
  \ {\n31   if (!err) {\n32     console.log(\"gzip (%s): \", buffer.length, buffer.toString('base64'));\n\
  33     zlib.inflate(buffer, function(err, buffer) {\n34       if (!err) {\n35  \
  \       console.log(\"inflate (%s): \", buffer.length, buffer.toString());\n36 \
  \      }\n37     });\n38     zlib.unzip(buffer, function(err, buffer) {\n39    \
  \   if (!err) {\n40         console.log(\"unzip (%s): \", buffer.length, buffer.toString());\n\
  41       }\n42     });\n43   }\n44 });\n```\n\n![Image](img/00047.jpeg)\n\n图 5.10\
  \ `stream_piped.js` 的输出，实现了流管道。\n\n### 压缩和解压缩流\n\n使用 `Zlib` 压缩/解压缩流与缓冲区略有不同。相反，你使用\
  \ `pipe()` 函数将流通过压缩/解压缩传递到另一个流。这可以应用于 `Readable` 流到 `Writable` 流。列表 5.12 中的代码展示了使用\
  \ `fs.ReadStream` 和 `fs.WriteStream` 压缩文件的良好示例。注意在尝试解压缩之前有 5 秒的延迟以允许数据刷新磁盘。\n\n\
  列表 5.12 `zlib_file.js`: 使用 `Zlib` 模块压缩/解压缩流\n\n点击此处查看代码图片\n\n```javascript\n01 var\
  \ zlib = require(\"zlib\");\n02 var gzip = zlib.createGzip();\n03 var fs = require('fs');\n\
  04 var inFile = fs.createReadStream('zlib_file.js');\n05 var outFile = fs.createWriteStream('zlib_file.gz');\n\
  06 inFile.pipe(gzip).pipe(outFile);\n07 setTimeout(function(){\n08   var gunzip\
  \ = zlib.createUnzip({flush:zlib.FULL_FLUSH});\n09   var inFile = fs.createReadStream('zlib_file.gz');\n\
  10   var outFile = fs.createWriteStream('unzipped');\n11   inFile.pipe(gunzip).pipe(outFile);\n\
  12 }, 3000);\n```\n\n![Image](img/00047.jpeg)\n\n图 5.11 `zlib_buffers.js` 的输出，实现了缓冲区压缩。\n\
