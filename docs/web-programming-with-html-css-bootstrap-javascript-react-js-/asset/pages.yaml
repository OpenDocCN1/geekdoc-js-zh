    # 5.1 What is React JS?


    React, also known as React JS, is a powerful yet simple JavaScript library developed
    by Facebook (now Meta) for front-end web development. It competes with other front-end
    development frameworks and libraries such as jQuery, Angular, and Vue.js.


    React is declarative, which means you describe user interfaces with React and
    tell it what you want, not how to do it. React takes care of the "how" and translates
    your declarative descriptions. Although HTML itself is declarative, React goes
    beyond representing static content and allows you to declare HTML interfaces that
    represent dynamic data.


    # 5.1.1 Characteristics of React JS


    There are three fundamental characteristics in React JS. The first is the components.
    With React, you describe user interfaces using components. A component is a JavaScript
    function that takes input, processes'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Web Programming


    it, returns output. Components in React receive input objects (known as "props")
    and output a description of a user interface. Components can be reused in multiple
    user interfaces and can even contain other components.


    The second is the reactivity. React uses a declarative paradigm that makes it
    easier to reason about your app. You simply declare what your component should
    look like for any given state, and React will automatically manage updates when
    the underlying data changes. Traditionally, browsers have to regenerate HTML views
    in the DOM tree every time a change occurred. However, with React, browsers are
    relieved of the burden of figuring out how to reflect these changes or when to
    make changes to the browser. React takes charge of this process by automatically
    reacting to a component''s state and updating only the specific parts of the DOM
    that require updating. This optimized approach ensures more efficient rendering
    and significantly enhances the performance of React applications.


    The third is virtualDOM. React introduces a new way of managing views called the
    virtual DOM. Instead of writing HTML directly, you use JavaScript to generate
    HTML. React maintains a virtual representation of HTML views in memory, which
    is the virtual DOM. This allows React to efficiently compare versions of the user
    interface in memory before making changes. Unlike traditional approaches where
    browsers rebuild the entire DOM on every change, React''s virtual DOM only updates
    the parts that have changed, resulting in faster updates and improved performance.


    # 5.1.2 React Props and State


    In React, you will frequently encounter two terms: "props" and "state." Both serve
    as input to a component function. However, there''s an important distinction between
    them. While props represent fixed values and cannot be changed, state objects
    can be altered within a component. Props are the list of attributes an HTML element
    can have, whereas state is used to auto-reflect changes in the browser. React
    components output what looks like HTML, but is written in a special JavaScript
    syntax as JavaScript XML (JSX).


    In Chapter 1 and Chapter 4, you learned how to use HTML elements for content and
    structure and use JavaScript for interactivity. React JS is a paradigm shift in
    web development, where HTML elements are written inside JavaScript code using
    JSX. While React JS does not strictly require the use of JX, it significantly
    eases the development process. Tools like Babel help translate JSX code into plain
    JavaScript code, making React JS more accessible and user-friendly.'
