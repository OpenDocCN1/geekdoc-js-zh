  md: 'The responsive container creates a full-width container spanning the entire
    viewport width until the specified breakpoint. At least .container-sm sets width:100%
    from the xs breakpoint to the next sm breakpoint. To experience the responsive
    container, you can replace "container" with "container-md" or any other breakpoints
    discussed in the previous section.


    Finally, the .container-fluid class creates a full-width container spanning 100%
    of the viewport width at all breakpoints. It will always stretch to the fluid
    width regardless of the viewport size. To use the .container-fluid class in your
    code, simply replace "container" with "container-fluid".


