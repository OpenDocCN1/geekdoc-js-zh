    #  1.9 Element, Tag, and Attribute


    An HTML file consists of elements, which are the fundamental building blocks of
    HTML documents. An element starts with a tag, like <title>, and ends with the
    same name followed by a forward slash. However, there are exceptions empty or
    void elements, such as <br>, which do not require a closing tag since they serve
    specific purposes, like inserting line breaks.


    Elements can contain other elements, with the outer element referred to as the
    "parent" element and the inner element as the "child" element. Elements sharing
    the same parent are called "sibling" elements.


    Some essential rules to remember:


    +   1. Tags are case insensitive, so using <title> or <Title> is acceptable, but
    lowercase is recommended for easier reading and convention.'
