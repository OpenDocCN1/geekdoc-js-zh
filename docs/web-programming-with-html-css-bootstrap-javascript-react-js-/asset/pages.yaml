  md: "# Common Bootstrap Breakpoints\n\n| Breakpoint | Class infix | Range | Devices\
    \ |\n| --- | --- | --- | --- |\n| Extra Small | None | Less than 576 pixels |\
    \ Mobile phones (portrait orientation) or very small screens |\n| Small | sm |\
    \ 576 pixels to 767 pixels | Larger mobile phones and small tablets |\n| Medium\
    \ | md | 768 pixels to 991 pixels | Tablets and small laptops |\n| Large | lg\
    \ | 992 pixels to 1199 pixels | Larger laptops and desktops |\n| Extra Large |\
    \ xl | 1200 pixels to 1399 pixels | Large desktops and high-resolution displays\
    \ |\n| Extra large | xxl | 1400px and avove | Very large displays |\n\nFor example,\
    \ Bootstrap may style buttons on a regular size on medium and larger screens and\
    \ stack them vertically on medium screens. Replace the `<h1>` and `<button>` lines\
    \ with the following:\n\n```\n<div class=\"flex-column flex-md-row\">\n  <button\
    \ class=\"btn btn-primary\">Button 1</button>\n  <button class=\"btn btn-secondary\"\
    >Button 2</button>\n</div>\n```\n\nTo see how it works, resize your browser screen\
    \ slowly and observe the differences in each range. Replace md with other infixes\
    \ to see the effects on other screen widths. The buttons are wrapped in a `<div>`\
    \ with the classes:\n\n+   d-flex - make them display as flex items (making element\
    \ containers flexible layout)\nflex-md-row - line up horizontally on medium screens\
    \ and above\n\nReview Question 3.14\nWhat are breakpoints in web development?\n\
    \n+   A) Specific widths at which elements disappear from the webpage.\nB) Specific\
    \ widths at which the layout and design of a website should change.\nC) Specific\
    \ widths at which animations are triggered on the webpage.\nD) Specific widths\
    \ at which elements change color on the webpage.\n\nReview Question 3.15\nHow\
    \ can developers define breakpoints using Bootstrap?\n\n+   A) By using media\
    \ queries in CSS.\nB) By specifying pixel values directly in the HTML code.\n\
    C) By using predefined breakpoint values provided by Bootstrap.\nD) By seting\
    \ percentage-based widths for elements in the webpage.\n\nReview Question 3.16\n\
    What does the \"md\" infix represent in Bootstrap breakpoints?\n\n+   A) Extra\
