    # 1.1 The World Wide Web


    The World Wide Web (abbreviated as the ''web'' for the rest of the book) is an
    information system that allows users to utilize client software to request documents
    stored on server software through Uniform Resource Locators (URLs). Examples of
    client software include Firefox, Edge, Chrome, and Safari, while server software
    examples encompass Apache, IIS (Internet Information Server), and Nginx. An example
    of a URL is www.google.com. Users can use the URL of the server directly into
    the browser''s address field or click on a hyperlink linking the URL. Requested
    documents can encompass files, images, songs, videos, and other resources.


    Users can use the client software at any time to request information. The server
    software will either respond with the requested documents or a 404 Error (File
    not found Error). Thus, the server must always be online so that the client can
    access it at any time. Such an arrangement is often referred to as the client-server
    architecture.


    Even with the client and server in place, you still cannot use the web without
    the Internet. The machines hosting the client and server must be connected to
    the Internet before any information exchange can occur.'
  merge: -1
