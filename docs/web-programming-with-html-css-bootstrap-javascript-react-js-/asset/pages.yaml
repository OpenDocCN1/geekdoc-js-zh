  md: 'Another frequently used absolute length is pixels. The px indicates the number
    of pixels it will take. We have already seen some examples in the previous code.
    Strictly speaking, this is not an absolute measure, as it is relative to the viewing
    device. However, most people use it as an absolute length, and this book follows
    that convention.


    # ### Review Question 2.8


    +   In CSS measurement units, which of the following measurements is a relative
    one?

    A) % and px

