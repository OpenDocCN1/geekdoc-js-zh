    \ to the next slide. Add two buttons before the closing tag of the carousel element\
    \ (right before the last <div>):\n\n```\n<button class=\"carousel-control-prev\"\
    \ type=\"button\"\ndata-bs-target=\"#mycarousel\" data-bs-slide=\"prev\">\n  <span\
    \ class=\"carousel-control-icon\" aria-hidden=\"true\"></span>\n  <span class=\"\
