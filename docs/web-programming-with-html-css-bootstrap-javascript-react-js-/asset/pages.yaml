  md: "To continue working on the homeReact.html page, you are going to update the\
    \ \"Web Programming is Fun\" saying with different adjectives every time the user\
    \ clicks on the header. In other words, when the user clicks on the header, a\
    \ random adjective will replace \"Fun\".\n\nUpdate the homeReact.html code inside\
    \ the <script> element until the <nav> line.\n\n```\nconst { useState } = React\n\
    const adjectives = [\n  \"Fun\",\n  \"Cool\",\n  \"Awesome\",\n  \"Frustrating\"\
    \n];\nfunction Header() {\n  const [adjective, setAdj] = useState(adjectives[0]);\n\
    \n  const updateAdj = () => {\n    let i = Math.floor(Math.random() * 4);\n  \
    \  setAdj(adjectives[i]);\n  };\n\n  return (\n    <header onClick={updateAdj}>\n\
    \      <h1>Larry Sanchez</h1>\n      <h2>Web Programming is {adjective}</h2>\n\
    \    </header>\n  );\n}\n```\n\nExplanation:\n\nThe first line implements the\
    \ useState Hook to use on this page.\nNext, there's a JavaScript array called\
    \ \"adjectives\". One of these adjectives will be randomly selected and used in\
    \ the <h2> element as shown in the last above line.\nThe onClick={updateAdj} indicates\
    \ that the updateAdj function will be called if the user clicks on the <header>\
    \ element.\nThe updateAdj function includes two lines. It generates a random integer\
    \ between 0 and 3 inclusive and calls the setAdj function, which uses the useState\
    \ Hook to set a random adjective. The default adjective is \"Fun\".\n\nThe useState\
    \ takes one argument, the initial state, and returns two values: the current state\
    \ and a function that can be used to update the state. In the code, the state\
    \ object is a string and named \"adjective\". The function is named setAdj. We\
    \ mean a state named \"adjective\", which we can update by calling the setAdj\
    \ function.\nTo use this new element, all you have to put the \"adjective\" variable\
    \ within curly braces. Every time you click on the header, you trigger an event\
    \ handler. We define an onClick attribute on the header element. The \"onClick\"\
    \ attribute in React receives a function reference, and in this case, it references\
    \ the updateAdj function,\nNotice the use of square brackets when a state is declared.\
    \ This is the ES6 \"array destructuring\" syntax, which assigns the first value\
    \ returned by useState to \"adjective\" and the second value to \"setAdj\"."
