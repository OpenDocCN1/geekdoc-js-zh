    >\n      <img src=\"https://placekitten.com/1399/300\" alt=\"slide3\" class=\"\
    d-block w-100\">\n    </div>\n  </div>\n</div>\n```\n\nCarousel -> dinner within\n\
    \nExplanation:\nImages from placekitten.com are used for the three slides. The\
    \ website is supposed to give out our random images. However, to make sure the\
    \ three images are different, we pick the widths of 1401, 1400, and 1399 which\
