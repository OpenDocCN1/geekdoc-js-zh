    <meta charset = "utf-8">

    <title>Today''s Special</title>

    </head>

    <body>

    <h1>Today''s Special</h1>

    <?php

    // Set up connection

    $conn = mysqli_connect("localhost", "root", "", "contentDB");

    if($conn){

    $today = date("Y-m-d");

    $query = "SELECT * FROM special WHERE validto >= ''$today''";

    $result = mysqli_query($conn, $query);

    if(mysqli_num_rows($result) > 0){

    $display = "<h3>All Specials</h3>";

    while($row = mysqli_fetch_assoc($result)){

    $display .= "<p>Special Name: " . $row[''specialname''] . \<br>";

    $display .= "Regular Price: " . $row[''regularprice''] . \<br>";

    $display .= "Special Price: " . $row[''specialprice''] . \<br>";

    $display .= "Valid From: " . $row[''validfrom''] . \<br>";

    $display .= "Valid To: " . $row[''validto''] . \<br>";

    }

    } else {

    $display = "<p>No special offers available for today.</p>";

    }

    echo $display;

    ?>

    ```'
