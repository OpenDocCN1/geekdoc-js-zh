    \ to the center.\nC It adjusts the size of the list items.\nD It floats the list\
    \ items to the left.\n\n# 3.12 Style Landing Page with Bootstrap Carousel Slide\n\
    \nWith \"bootstrapnavigation.html\" open in the editor, add the code below right\
    \ after the closing of the </nav> element. This will add a carousel to\n\n```\n\
    <div id=\"mycarousel\" class=\"carousel slide\" data-bs-ride=\"carousel\">\n \
    \ <div class=\"carousel-inner\">\n    <div class=\"carousel-item active\">\n \
