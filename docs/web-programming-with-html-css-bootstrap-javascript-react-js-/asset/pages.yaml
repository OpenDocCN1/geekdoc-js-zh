    # 3.1 What is Bootstrap?


    Bootstrap is a front-end framework that allows web developers to build professional-looking
    websites or applications quickly. It is based on HTML, CSS, and JavaScript and
    is an open-source framework originally developed by the team at Twitter. That''s
    why it is sometimes referred to as "Twitter Bootstrap."


    A framework is an essential supporting structure of an object. The Bootstrap framework
    supports user interface components of a webpage or application. However, it is
    not a one-size-fits-all tool. It is best suited for creating responsive web pages
    and is compatible with major browsers.


    There are two ways to implement the Bootstrap framework:


    +   • Download all the necessary files from getbootstrap.com and treat them as
    your own files. This is often called the “build” approach.'
