    # 2.3 CSS Selector


    A selector can be a tag name, such as h1. For example, you can use the following
    code to make all <h1> elements red:


    ```

    h1 {

    color: red;

    }

    ```


    Another type of selector is the id attribute of the HTML document. To use an id
    selector, first, add an id attribute in the HTML document, like this:


    ```

    <h1 id="myColor">This heading is red</h1>

    <h1 id="myAlign">This heading is centered</h1>

    ```


    Then, in the CSS part, add the definitions (note the # in front of the id name)
    as follows:


    ```

    #myColor {

    color: red;

    }

    #myAlign {

    text-align: center;

    }

    ```


    Note that the id attribute should have a unique value on every page. You cannot
    have two attributes with the same value and apply them to the same style. In such
    cases, you should use a class selector.


    The class selector allows you to style multiple elements with the same style.
    To use a class selector, add a class attribute to all the elements you want to
    apply the style. Add the following lines in the HTML file:


    ```

    <h1 class="redText">This is a heading</h1>

    <p class="redText">This is a paragraph</p>

    ```


    Then, in the CSS code, add the following definition (Note the dot in front of
    the class name):


    ```

    .redText {

    color: red;

    }

    ```'
