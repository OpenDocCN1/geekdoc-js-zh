    ```\n\n![](img/7350d930fc641f16fab5a841c7433c8b_102_0.png)\n\n# 3.13 Chapter Summary\n\
    \nIn this chapter, you learned about Bootstrap. Bootstrap is a pre-built front-end\
    \ framework that you can use to quickly style a webpage. Remember to add the link\
    \ to the CDN and ensure your computer has an Internet connection before testing\
    \ a page. With Bootstrap, you can style any webpage without the need to create\
    \ your own CSS definitions. This chapter focused on using Bootstrap solely for\
    \ a page. However, it's essential to know that you can always add your own CSS\
    \ to modify the style or when Bootstrap does not fully meet your specific requirements.\n\
    \n(CDN) Content Delivery Network -"
