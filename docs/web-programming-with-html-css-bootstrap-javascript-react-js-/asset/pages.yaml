  md: 'On the other hand, the class attribute is used to identify a group of elements.
    Unlike id, the class attribute allows multiple elements to share the same class
    value. Both id and class attributes are commonly utilized for client-side element
    selection in CSS and JavaScript.


    The name attribute is another form of identification that is still in use today.
    It possesses characteristics of both the id and class attributes. An example application
    of the name attribute is with radio buttons.


