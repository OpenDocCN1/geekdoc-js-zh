    # 3.5 Bootstrap Grid System


    When using Bootstrap, the browser width is automatically divided into 12 columns,
    as illustrated below:


    | | | | | | | | | | | | |


    All you need to do is select the number of columns you want for each section.
    You can apply this grid system anywhere on the page or choose not to use it at
    all. Additionally, you can have as many rows as necessary. For instance, if you
    wish to design a layout like the following:


    | Page Header |

    | Navigation | Main content |

    | | Footer |'
