    # 1.8 HTML Code Validation


    Valid HTML code is essential for a properly functioning webpage, but invalid code
    can be difficult to spot. Most browsers are forgiving and render a page despite
    errors in the HTML markup. However, this leniency means serious problems can lurk
    unseen. Though a page may look fine visually, invalid HTML can cause inconsistent
    behavior across different browsers and devices. Screen readers for accessibility
    may also misinterpret bad markup, providing a poor experience for some users.
    Valid code confirms your web page follows web standards and will render as intended.
    It also improves maintainability, as unambiguous HTML is easier to work with later.
    Taking the time to validate HTML eliminates technical debt that would otherwise
    accumulate. To avoid these hidden bugs, it is critical to validate your HTML using
    a tool like the W3C Markup Validation Service.'
