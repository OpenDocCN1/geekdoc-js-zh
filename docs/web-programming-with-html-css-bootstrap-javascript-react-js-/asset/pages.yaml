    # 2.8.2 Font Size:


    The font size can be measured in any of the following units:


    | The px is a dot. The default value for font size in most browsers is 16px. |

    | The pt stands for points. Points are size measurements for traditional, paper-based
    media, while pixels are

    size measurements for computer monitors. 1 point equals 1/72 inches, while 1 pixel
    equals 1 dot on the

    monitor. |

    | The em depends on its container font size. 1em is 16px by default because the
    browser default font size

    is 16px. If the base font size is changed by CSS, the size of one em changes accordingly.
    |

    | The % is a percentage relative to the base size. So 100% = base font size. |


    You can manipulate the size of the fonts by using values or percentages. Values
    should be used if you do

    not want a user to change the size of the font. Percentages are great when you
    want to change the default

    font size but do not want to set a static value. Smartphones have very high resolutions,
    which make pixels

    really small. When you have a choice between relative font size (e.g., 120%) and
    absolute font size (e.g.,

    10px), you should choose a relative font size because you don''t know the specific
    measurements of each

    display device. This also provides more flexibility when viewing your page. For
    practice, add adding the

    CSS definition to the "basicstructurestyle.css". You may expect to see larger
    h1 text.


