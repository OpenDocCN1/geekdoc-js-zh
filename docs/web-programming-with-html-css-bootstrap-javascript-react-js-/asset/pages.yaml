    ```


    Moving forward, it is imperative to enhance the security of your code. You can
    achieve this by consistently utilizing the mysqli_real_escape_string() function.
    This function adequately handles special characters within strings, rendering
    them safe for use within SQL queries. This practice will safeguard your application
    against potential SQL injection risks.


    However, it''s important to note that using mysqli_real_escape_string() is a valid
    approach to prevent SQL injection in certain cases, it''s generally recommended
    to use prepared statements and parameterized queries instead. Here is an example
    of a prepared statement.


    First, add a button to the HTML form of the example from last section:


    ```

    <input type="submit" name="displaygpa" value="Display GPA">

    ```


    Next, add the following block right after the "End of delete section":


    ```

    // Check if the "displaygpa" button is clicked

    if(isset($_POST[''displaygpa''])) {

    $id = $_POST[''studentid''];

    $name = $_POST[''studentname''];

    $gpa = $_POST[''studentgpa''];

    // Create a prepared statement

    $query = "SELECT * FROM student WHERE studentid = ? AND username = ?";

    $stmt = mysqli_prepare($conn, $query);

    // Bind parameters and execute

    mysqli_stmt_bind_param($stmt, "ss", $id, $name);

    mysqli_stmt_execute($stmt);

    // Get the result

    $result = mysqli_stmt_get_result($stmt);

    // Execute the query and check for success

    $display = "<p>gpa for the student</p>";

    while($row = mysqli_fetch_assoc($result)) {

    $display = "ID:" . $row[''studentid'']."<br>";

    $display = "Name:" . $row[''studentname'']."<br>";

    $display = "GPA:" . $row[''studentgpa'']."<br>";

    }

    echo $display;

    // End of displayGPA section

    ```


    In this example, the user input is treated as data and is safely inserted into
    the query using placeholders (?).


    The mysqli_stmt_bind_param() function binds the user data to the placeholders,
    and the database system takes care of escaping and quoting the data properly.
    This prevents any malicious input from altering the query structure.'
