    # 1.3 HTTP (Hypertext Transfer Protocol)


    In the realm of the web, web servers are often geographically distant from each
    other. To facilitate seamless communication between them, the Hypertext Transfer
    Protocol (HTTP) comes into play. HTTP consists of a set of standards or protocols
    that govern the exchange of requests and responses between the client and server.
    An analogy can be drawn to the guidelines you must follow when writing an address
    on an envelope for mailing – where to place your name and address where to specify
    the recipient''s name and address. A small error, like swapping the recipient''s
    name and address, could lead to delays or non-delivery of the mail.'
  merge: -1
