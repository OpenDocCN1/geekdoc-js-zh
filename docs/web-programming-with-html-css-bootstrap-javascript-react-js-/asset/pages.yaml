    \ value between 20 and 100 pixels.\n\n# 4.9 ES6+\n\nJavaScript, officially known\
    \ as ECMAScript, introduced ES6 (ECMAScript 2015) as its sixth version, which\
    \ brought significant changes to the language. The \"ES6+\" notation refers to\
    \ ES6 and later versions. In this section, we will explore some of the most popular\
    \ features introduced in ES6.\n\n# 4.9.1 Variables Declared with var, let, and\
    \ const\n\nIn traditional JavaScript, the keyword \"var\" is used to declare variables.\
    \ However, it may lead to an issue called \"out of scope access.\" To address\
    \ this, ES6 introduced the \"let\" keyword, which solves the out-of-scope problem\
    \ by limiting the variable's scope to the block where it is declared. Additionally,\
    \ ES6 introduced the \"const\" keyword for declaring variables that must be constants,\
    \ ensuring that their values cannot be changed after assignment. A value assigned\
    \ to a \"const\" variable remains constant, and a reference assigned to a \"const\"\
    \ variable cannot be changed, although its content may be modified.\n\nHere's\
    \ an example to demonstrate the difference between \"var\" and \"let\" in variable\
    \ scope:\n\n```\n<div id=\"es6\"></div>\n<script>\nfor(var i=0; i<3; i++){\n \
    \ // do nothing\n  document.getElementById(\"es6\").innerHTML = i;\n}\n</script>\n\
    ```\n\nIn this example, the variable \"i\" is declared with \"var\" inside the\
    \ for loop. For the loop's block scope, the variable \"i\" can be accessed outside\
    \ the loop. When you run this code, you will see \"3\" printed on the screen.\
    \ This behavior is due to the variable \"i\" being accessible outside the block\
    \ scope.\n\nNow, if you change the keyword \"var\" to \"let\" in the for loop.\
    \ When you run this updated code, you will encounter a \"ReferenceError\" with\
    \ the message \"i is not defined.\" This indicates that a variable declared"
