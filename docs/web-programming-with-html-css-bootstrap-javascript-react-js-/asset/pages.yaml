    # 1.23 A Brief History of HTML


    HTML was introduced by Tim Berners-Lee in 1989.


    Soon after, HTML 2.0 was released to standardize the elements. In October 1994,
    Tim Berners-Lee founded the World Wide Web Consortium (W3C) after leaving the
    European Organization for Nuclear Research (CERN). The W3C is the organization
    responsible for setting standards for the web.


    HTML 3 was introduced in 1995, and in January 1997, HTML 3.2 was formally endorsed
    by the W3C. In 1997, HTML 4.0 was published by the W3C. In December 1999, the
    W3C published HTML 4.1.


    In January 2000, the W3C introduced XHTML 1.0 (X stands for eensible). At the
    time, there were two major problems with HTML. First, it lacked proper semantics
    in its documents. Second, the HTML syntax was lenient, allowing the browser to
    display content even with typos by making the best guess. XML was developed to
    address these issues. XHTML 1.1 was published in May 2001.


    XHTML 2.0 represented a significant change as it was no longer backward compatible.
    Meanwhile, a working group called the Web Hypertext Application Technology Working
    Group (WHATWG) had been diligently working on HTML 5, leading to disagreements
    within the community about whether to use XHTML 2.0 or HTML 5. As a compromise,
    a version called XHTML 5 emerged, but it is now considered an obsolete markup
    language and is essentially never used.


    Today, HTML 5 is the officially accepted markup language by the W3C.


