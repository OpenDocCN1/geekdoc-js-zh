    # 1.22 WAI-ARIA in HTML


    Web Accessibility Initiative - Accessible Rich Internet Applications (WAI-ARIA)
    is a set of HTML attributes that provide additional semantics and improve accessibility
    for people with disabilities via assistive technologies. It consists of three
    main features:


    The first feature is roles. A role attribute defines what an element is or does.
    For example, the role attribute in <nav role="navigation"></nav> specifies that
    this element plays the role of navigation.


    The second feature is properties. A group of attributes defines the properties
    of elements, providing extra meaning or semantics. For instance, aria-required="true"
    specifies that a form input needs to be filled to be considered valid.


    The third feature is states. These are special properties that define the current
    conditions of elements, such as aria-disabled="true", which indicates to a screen
    reader that a form input is currently disabled. States differ from properties
    in that properties remain constant throughout the lifecycle of an app, whereas
    states can change, often programmatically via JavaScript.


    It''s important to note that adding any ARIA attributes to an element does not
    visibly affect the web page, except for the information exposed by the browser''s
    accessibility APIs (which screen readers use to gather information).


