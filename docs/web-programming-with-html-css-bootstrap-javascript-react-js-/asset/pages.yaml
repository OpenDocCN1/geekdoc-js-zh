  md: "# Chapter 4: JavaScript\n\nwhen the red square appears, add the following line\
    \ inside the displayShape() function right after the line\that makes the square\
    \ visible:\n\n```\n// Start the timer once the shape appears\nstarttime = new\
    \ Date().getTime();\n```\n\nNext, we want to stop the timer when the red square\
    \ is clicked. So, add the following lines inside the onclick\nevent of the shape,\
    \ right after the randomDelay() function you added in Step 3:\n\n```\n// End the\
    \ timer\nvar endtime = new Date().getTime();\n// Find the difference\nvar timeelapsed\
    \ = endtime - starttime;\ndocument.getElementById(\"onetime\").innerHTML = \n\
    timeelapsed / 1000 + \" seconds\";\n// Check if this time is better than the best\
    \ time\nif (timeelapsed < besttime) {\nbesttime = timeelapsed;\ndocument.getElementById(\"\
    besttime\").innerHTML = =\nbesttime / 1000 + \" seconds\";\n```\n\nSince starttime\
    \ is used in two different functions, we need to declare the variable outside\
    \ of either function.\nAdd the line anywhere inside the <script> element, but\
    \ outside any functions:\n\n```\nvar starttime;\n// Assume the best time is 5\
    \ seconds\nvar besttime = 5000;\n```\n\nExplanation:\n\nFirst, we capture the\
    \ current time from the computer using new Date().getTime() to get the current\t\
    imestamp in milliseconds. Next, we calculate the time elapsed by finding the difference\
    \ between endtime\\and starttime. Finally, we display the value of timeelapsed\
    \ to the \"onetime\" element, which is the ID of a\n<span> element. The value\
    \ is converted from milliseconds to seconds by dividing it by 1000.\nAdditionally,\
    \ the code checks if this time is better than the previous best time. If it is,\
    \ the besttime variable is\nupdated and displayed in the \"besttime\" element.\n\
    \nSave the changes and refresh the browser. Now, when you play the game and click\
    \ on the red square after it\nappears, the browser will display the time taken\
