    \n# 3.4 The Container\n\nBootstrap requires that all webpage contents be included\
    \ inside a container. There are three types of containers: the fixed-width, responsive,\
    \ and fluid containers.\n\n![](img/7350d930fc641f16fab5a841c7433c8b_86_1.png)\n\
    \nThe fixed-width container provides a responsive width. It sets a max-width at\
    \ each breakpoint (xs, sm, lg, xl) and centers the content horizontally. As the\
    \ viewport width increases, the container also increases up to the max-width at\
    \ each breakpoint. For example, at the sm breakpoint (≥576px), the max-width is\
    \ 540px. So between 576px to 767px, the .container will be 540px wide. To implement\
    \ the fixed-width container, add a <div> that contains all content, such as <h1>\
    \ and <button>, inside the \"bootstrap.html\" file:\n\n![](img/7350d930fc641f16fab5a841c7433c8b_86_2.png)\n\
    \n```\n<div class=\"container\">\n  <h1>Hello, world!</h1>\n  <button class=\"\
    btn btn-primary\">Primary</button>\n</div>\n```\n\n+   3 types of containers\n\
    1- Fixed-width\n2- Responsive\n3- fluid Containers.\n\nTo see how it works, change\
    \ the screen width and observe the container's behavior.\n\n![](img/7350d930fc641f16fab5a841c7433c8b_86_3.png)\n\
    \n81"
