  md: '# Chapter 4: JavaScript


    Chapter Learning Outcomes


    +   4.1 Recognizing basic JavaScript syntax

    4.2 Exemplifying HTML element manipulation with JavaScript

    4.3 Exemplifying Style manipulation with JavaScript

    4.4 Implementing Math class methods in programming

    4.5 Implementing date and time in programming


    # 4.1 What is JavaScript?


    In Chapter 1, you learned HTML, which notifies the browser of the content and
    structure of a webpage. In Chapter 2, you learned CSS, which contains instructions
    for the browsers on how to present the page. In this chapter, you will learn JavaScript,
    which will make the webpage interactive.


    JavaScript is an object-based programming language that is commonly used for Web
    programming. It can be used on both browsers (client-side) or Web servers (server-side,
    e.g. Node.js). In this book, we focus on the client-side webpage interactivity
    with JavaScript.


    Note: Do not confuse JavaScript with Java because the two languages are not directly
    related in any way. ECMAScript is the official name of the language. ECMA stands
    for European Computer Manufacturers Association, which is the organization that
    standards JavaScript.'
