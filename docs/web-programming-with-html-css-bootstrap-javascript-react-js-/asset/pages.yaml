- img_proc: true
  md: 'Include a link to a CDN (Content Delivery Network) in your HTML file, similar
    to linking to an external CSS file.


    Either method will work. In this book, we suggest the second approach for simplicity
    so that you can focus on the “use” of the framework rather than the “build” of
    the framework.


    Using Bootstrap in your HTML file is similar to linking to an external CSS file
    with many CSS definitions that others have already coded. How can you code for
    it if you don''t know your HTML code? They assume that your HTML code uses a lot
    of class attributes. They just write CSS definitions for those classes. The key
    is that you don''t get to choose the class attribute values freely; you have to
    pick one or more from the predefined class names in Bootstrap.


    For example, if you add the following class to a button in your HTML file:


    ```

    <button class="btn btn-primary">Primary</button>

    ```


    The button will automatically have the appropriate styling without having to write
    a single line of CSS. This is because the Bootstrap framework already includes
    the definitions for the classes “btn” and “btn-primary.” Here’s what the button
    will look like:


    ![](img/7350d930fc641f16fab5a841c7433c8b_81_0.png)


    However, the following line will not work because the Bootstrap does not define
    for “button” class.

    <button class="button">Primary</button>


    In short, using Bootstrap, you provide the content in HTML with appropriate class
    attribute values, and Bootstrap provides the presentation with the matching class
    definitions. Learning Bootstrap means getting to use the available class values.


