    # 1.2 Web Programming


    Computer programs are sets of instructions that computers follow. In the context
    of the web, instructions are encapsulated within a Web Program, providing guidance
    for both client and server software. As a result, web programming encompasses
    the act of writing instructions for either the client, the server, or both. It
    serves as an umbrella term that covers various languages used for this purpose.'
