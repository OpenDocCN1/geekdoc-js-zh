  md: "# Chapter 4: JavaScript\n\nWhat does the debugging window in Firefox display\
    \ when an error occurs?\n\n+   A) HTML DOM structure\nB) API documentation\nC)\
    \ Error message and file name\nD) User interface elements\n\n# 4.2 Variables and\
    \ Operators\n\nLet's see an example of using JavaScript to create an addition\
    \ practice equation.\n\nProblem: Display an equation 7+4=, followed by a textbox\
    \ and a button. The textbox allows the user to enter a number for the \"answer\"\
    , and the button allows user to check the answer. If the answer is correct, a\
    \ pop-up displays \"Nice job!\" If the answer is incorrect, a pop-up displays\
    \ \"Try again!\"\n\n![](img/7350d930fc641f16fab5a841c7433c8b_116_0.png)\n\nSolution:\
    \ Start a new HTML file called \"addition.html\" and add the following code:\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
    >\n  <title>JavaScript addition practice</title>\n</head>\n<body>\n  <h1>JavaScript\
    \ If Statement</h1>\n  <p id=\"problem\">7+4=</p>\n  <input type=\"text\" id=\"\
    userAnswer\">\n  <button type=\"button\" id=\"checkAnswer\">Check Answer</button>\n\
    \  <script>\n    document.getElementById(\"checkAnswer\").onclick = function ()\
    \ {\n    // Get user answer\n    var userAnswer = document.getElementById(\"userAnswer\"\
    ).value;\n```"
