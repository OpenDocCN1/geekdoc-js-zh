  md: "You don't need to apply grid system to the header and footer sections. Instead,\
    \ you just need to include a grid row over the header. In this example, the navigation\
    \ column occupies 4 out of the 12 columns, while the main content takes up 8 columns.\
    \ Here's the sample code:\n\n```\n<div class=\"container\">\n  <h1 class=\"text-center\"\
    >Page Header</h1>\n  <div class=\"row\">\n    <div class=\"col-md-4\">\n     \
    \ <!-- All navigation content goes here -->\n      <p>Navigation</p>\n    </div>\n\
    \    <div class=\"col-md-8\">\n      <!-- All main content goes here -->\n   \
    \   <p>Main content</p>\n    </div>\n  </div>\n  <footer class=\"text-center\"\
    >Footer</footer>\n\n```\n\nLet's see an example.\nCreate a new file named 'bootstrap.html'\
    \ and copy the Bootstrap template. Then, add the provided code within the <body>\
