  md: "```\n// check if correct\nif (userAnswer == 11) {\n    alert(\"Nice Job!\"\
    );\n} else {\n    alert(\"Try again!\");\n}\n</script>\n<body>\n</html>\n```\n\
    \nExplanation:\nAll JavaScript code is placed inside the <script> element of an\
    \ HTML file. The // symbol represents a JavaScript single-line comment. For multiple-line\
    \ comments, you can use /* to start the comment and */ to end it. Helps programmers\
    \ understand the code, but are ignored by the browser.\n\nThe line var userAnswer\
    \ declares a variable. A variable is a container that holds values, and it allows\
    \ programming languages to store values in container memory for easy access. Rules\
    \ for naming variables in JavaScript are: the name should start with a letter,\
    \ underscore (_), or dollar sign ($), followed by letters, underscores, dollars,\
    \ or digits. Variable names are case-sensitive, and spaces are not allowed. The\
    \ same line also assigns the value to the HTML DOM's text box called \"userAnswer\"\
    . To declare a variable, use the \"var\" keyword:\n\nvar variableName\nTo assign\
    \ a value to a variable, use the \"=\";\nvariableName = value;\nYou can combine\
    \ the above two in one line:\nvar variableName = value;\n\nAn if statement checks\
    \ if the userAnswer variable is the same as 11. The == operator checks for equality,\
    \ and if both sides are same, it results in a Boolean value of true. Otherwise,\
    \ it results in false. Changing to === in the example will not work because three\
    \ equal signs require the data type to be the same as well. userAnswer is a string,\
    \ while eleven is number. However, if (userAnswer === \"11\") will work, because\
    \ both are now strings. Number entered into form is considered as a string.\n\n\
    The alert() function is built-in JavaScript function that generates a pop-up.\
    \ If the condition is true, the code will display \"Nice job!\". Otherwise, it\
    \ will display \"Try again!\".\n\nReview Question 4.14\nWhich of the following\
