    The mysqli_connect() function establishes a connection to the MySQL server.


    The mysqli_query() function executes SQL statements; you''ll encounter this frequently
    in this chapter.


    After creating the database, the mysqli_select_db() function designates ''schoolDB''
    for usage. The ''student'' table contains three fields: ''studentid'', ''studentname'',
    and ''studentgtpa.'' When defining a field, the respective data type is imperative.


    The ''studentid'' field is of integer data type, rendering it non-nullable. Consequently,
    while storing new student data, the ''studentname'' field adopts the VARCHAR data
    type, with a maximum character limit of 32.


    In contrast, the ''studentgtpa'' field employs the decimal(3, 2) data type, accommodating
    a total of three digits (precision) with two decimal places. Consequently, solely
    one digit is available for the whole number component.


