  md: "# Chapter 4: JavaScript\n\nLet's see an example. Create an HTML document called\
    \ \"javascript.html\" with the code below. The Web page allows a visitor to select\
    \ a language to display with a click of a button. One button is for displaying\
    \ English. The other button is for Spanish.\n\n```\n<DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>JavaScript 1</title>\n</head>\n\
    <body>\n<h1>JavaScript Change HTML content</h1>\n<p id=\"content\"></p>\n<button\
    \ type=\"button\" id=\"english\">English</button>\n<button type=\"button\" id=\"\
    spanish\">Spanish</button>\n<script>\n  document.getElementById(\"english\").onclick\
    \ = function () {\n    document.getElementById(\"content\").innerHTML = \"Hello\
    \ World!\";\n  }\n  document.getElementById(\"spanish\").onclick = function ()\
    \ {\n    document.getElementById(\"content\").innerHTML = \"Hola Mundo\";\n  }\n\
    </script>\n</body>\n</html>\n```\n\n# JavaScript Change HTML content\n\nHello\
    \ World!\n\n+   - English\n- Spanish\n\nExplanation:\nThe line: <p id=\"content\"\
    > contains an <p> element without any content. It serves as a placeholder for\
    \ the content that will be displayed when the buttons are clicked.\nJavaScript\
    \ code is included between <script> and </script> in an HTML file.\n\nThe \"document\"\
    \ is a JavaScript object that represents the HTML DOM. It has a method called\
    \ getElementById(). It gets the element with the id of \"english\", which is a\
    \ button. When this button is clicked, an event handler is activated.\nThe string\
    \ \"Hello World\" is assigned to the HTML element with the id 'content'. You may\
    \ notice that JavaScript statements end with a semicolon().\nDOM stands for Document\
    \ Object Model. It is a tree-structured, in-memory representation of an HTML document.\
    \ It is created by the browser when an HTML file is loaded. It is how the browser\
    \ \"sees\" with the HTML document you created. The DOM is the API (Application\
    \ Program Interface) for HTML. The API describes the document including interfaces\
    \ that define the functionality of the HTML elements as we"
