  md: '# 2.2 CSS Measurement Units


    As you can see from the examples in the last section, there are several ways to
    define the length of an element, such as % and px used in the examples. There
    are two types of measurement units. The first type is relative units, which means
    the actual length depends on another length property.


    When using % as a measurement unit, the element will take up that percent of the
    container. Continue on the basicstructystyle.css, add the following code:


    ```

    table {

    width: 50%;

    }

    ```


    The table takes up 50% of the browser width because the container is the browser.


    The em is another relative measure of the font-size of the current element. Add
    the following two lines inside the p definition:


    ```

    font-size: 20px;

    border: solid 1em;

    ```


    Notice that the thickness of the paragraph border is 1em. Then change the font-size
    from 20px to 40px and see how it affects the border thickness. This is because
    the border thickness is 1em, which depends on the font-size of the paragraph.
    In this case, 1em = 20px before the change, and 1em = 40px after the change.


    A measure that is similar to em rem (r stands root). It is relative to the root
    font size of the HTML document.


    The second type of measurement unit is the absolute length. These measurements
    will take the exact length no matter what. For example, the following code will
    set the exact dimensions of the image no matter the size of the browser. Modify
    the img definition with the following:


    ```

    img {

    width: 10in;

    height: 3in;

    }

    ```


    You will notice that the width of the image remains the same at 10 inches, no
    matter how wide the screen is. If you make the screen narrower than 10 inches,
    you will notice the horizontal scrolling bar displayed.'
