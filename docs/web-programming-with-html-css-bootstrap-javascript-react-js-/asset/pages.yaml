  md: '# Chapter 2: Cascading Style Sheets


    # Chapter Learning Outcomes:


    +   2.1 Recognizing basic CSS definitions

    2.2 Exemplifying different types of CSS selectors

    2.3 Comparing CSS measurement units

    2.4 Implementing CSS for page layout

    2.5 Checking CSS specificity

    2.6 Explaining responsive web design


    # 2.1 What Is CSS?


    CSS stands for Cascading Style Sheets. It works side by side with HTML and defines
    the presentation of a webpage, while HTML defines the content and structure of
    the webpage. The same HTML document with different CSS will look different on
    the same browsers.


    A CSS file includes one or more CSS definitions or rules. A CSS definition consists
    of three parts: a selector (where: which part of HTML to apply), a property (how:
    what quality to apply), and a value (what: set the quality). Each “property: value;
    pairs with a semicolon “,”, and the group of “property: value; is enclosed within
    the braces { }. They appear as follows: selector{property: value; }

    For example, h1{color: red;} will make all h1 elements on the page red. Let’s
    add some definitions to an HTML file you created in Chapter 1. Open the “basicstructure.html”
    with your editor and add a line right before the <head> as shown in bold below:


    ```

    <!DOCTYPE html>

    ```'
