    # 2.4 Three Ways to Apply CSS in HTML Documents


    So far, you have used a linked style sheet, also known as an external style sheet,
    which is good for maintaining consistency across pages on the same website. There
    are two other ways to apply CSS styles to HTML.


    +   1. Embedded Style Sheets: An embedded style sheet, also called a document-level
    style sheet, is defined within a <style> element in the <head> section of the
    HTML page. These styles apply only to the elements within the current HTML document.


    +   2. In-line Style Sheets: An in-line style sheet is coded inside an HTML tag
    to apply to a particular element. For example, the following h1 element with a
    style attribute, <h1 style="color:blue">Blue heading/</h1>, will display the heading
    as blue text. However, it''s best to avoid using this approach as it can be time-consuming
    to update individual element styles.


    Each of the three ways to apply CSS to HTML is used for specific situations: linked
    style sheets for multiple web pages, embedded style sheets for specific pages,
    and inline style sheets for specific elements on a page. This chapter emphasizes
    the separation of structure and presentation, using a linked style sheet. Other
    chapters of this book use an embedded style sheet for convenience.


    If multiple methods are used on a page, the definitions from these different sources
    will cascade into one style sheet, following the cascading order: inline, embedded,
    and external. If two definitions are for the same selector, the second one (defined
    later) will take precedence. More specific selectors also take precedence.'
