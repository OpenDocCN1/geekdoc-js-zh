  md: '# 2.14 Best Practices for Organizing CSS


    When CSS code, following standard conventions and best practices for how to organize
    structure your stylesheet can greatly improve its readability, maintainability,
    and scalability. Here are some key recommendations to follow:


    # 2.14.1 Group related properties


    Group CSS property declarations that are related to each other, such as those
    pertaining to fonts, positioning, margins, etc. This creates coherent blocks of
    styles.


    # 2.14.2 Use consistent indentation and spacing


    Properly indent nested selectors and consistently use spaces between property-value
    pairs. This visual structure helps quickly parse the stylesheet.


    # 2.14.3 Organize selectors targeting the same element together


    Keep CSS selectors that apply to the same HTML element grouped together rather
    than scattered about. This makes locating rules easier.


    # 2.14.4 Use comments to create sections


    Use comments like /* Typography */ / / * Header */ to divide the stylesheet into
    logical sections and make scanning quicker.


    # 2.14.5 Put global styles at the top


    Define global styles like fonts and colors at the very top before other styles
    so they cascade throughout.


    # 2.14.6 Follow a logical ordering


    Structure your stylesheet from broad to specific styles - global, layout (positioning),
    typography, smaller details.


    # 2.14.7 Prefer shorthand properties when possible


    Use shorthand properties like font and background to consolidate multiple property
    declarations into one, improving brevity.'
