    # 4.8 Putting it all Together: The Reaction Game (Repeat Again)


    Problem: In this game, a circle or a square with a random size pops up randomly
    on the screen. The objective is to test how quickly a user can click on the shape.
    Once clicked, the shape disappears, and a new one with random shape and size appears
    at a random location. There is a random delay for a shape to appear. Additionally,
    the program will record the user''s reaction time for each shape appearance and
    keep track of the best (shortest) reaction time achieved so far.


    Solution: To build this reaction game, you will follow seven steps:


    +   Step 1: Start with a red square on screen.


    +   Step 2: Set up the red square to disappear when clicked by the user.


    +   Step 3: Make the red square appear after a random delay in milliseconds.


    +   Step 4: Record the time taken by the user to click the square from the moment
    it appears.


    +   Step 5: Randomized the location where the red square appears on the screen.


    +   Step 6: Modify the appearance of the red square so that it appears as a circle
    about half of the time, with each appearance having a different size.


    +   Step 7: Add the final touch by filling the shape with a random color every
    time it appears.'
