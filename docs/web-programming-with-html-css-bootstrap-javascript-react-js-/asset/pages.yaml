  md: "# Chapter 4: JavaScript\n\n```\n<div id=\"quot\"></div>\n<script>\n  document.getElementById(\"\
    num\").innerHTML = `${Math.random()}`;\n  document.getElementById(\"quot\").innerHTML\
    \ = `I'm fine.`;\n</script>\n```\n\nIn this example, we have two <div> elements\
    \ with IDs \"num\" and \"quot\". We use JavaScript to set the content of these\
    \ elements inside template strings:\n\nThe first line inside <script> demonstrates\
    \ the dynamic value interpolation. The code uses a template string to interpolate\
    \ the value returned by the `Math.random()` function into the <div> element with\
    \ the ID \"num\". The `Math.random()\\` function generates a random number between\
    \ 0 (inclusive) and 1 (exclusive), and it will be displayed within the <div>.\n\
    \nThe second line inside <script> demonstrates the quotes inside a template string.\
