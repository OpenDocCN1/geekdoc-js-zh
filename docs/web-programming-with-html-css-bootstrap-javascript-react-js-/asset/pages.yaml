    # 7.8 Addressing Security Concerns


    Let''s revisit the example covered in Section 7.7 using your web browser and server.
    Enter a new student with the name "O''Brian" and click the insert. You''ll encounter
    an error message stating "insert failed.\ This occurs due to the name containing
    a special character, the apostrophe (), which MySQL does not permit.


    To rectify this issue, you can make a simple adjustment within the "Insert" block:

    Replace the existing line:


    ```

    $name = $_POST[''studentname''];

    ```


    With the following line:


    ```

    $name = mysqli_real_escape_string($conn, $_POST[''studentname'']);

    ```


    Now, you should be able to successfully add a new student with the name "O''Brian."


    Now, let''s explore another example. Please note that this may not function as
    expected on production servers. It allows a user to delete all records without
    needing knowledge of any current student data. (Remember, normally users are required
    to know a student''s ID, name, and GPA to delete a record.) To proceed, ensure
    you have a few students in the table. Then, input any number for the ID, and any
    text for the name, and input the following for GPA:


    ```

    anything'' OR studentId LIKE ''%

    ```


    After clicking the delete button, you will notice that all student records in
    the table are deleted. This type of attack is known as an SQL injection.


    The remedy for this vulnerability is the same as before. In the "delete" block,
    replace the existing line:


    ```

    $gpa = $_POST[''studentgpa''];

    ```


    With the following line:'
