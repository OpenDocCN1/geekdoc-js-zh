  \ 何时进行计算、何时进行拼接，以及何时无法完成其中任一操作！\n\n### 5.6 进一步练习一下：制作乘法表\n\n谁没有在背 7 的乘法表时犹豫过呢？7,\
  \ 14, 21, 28... 然后就忘了！计算乘法表是重复过程的极佳例子。我们计算 7 的乘法表，从 7 乘以 1 到 7 乘以 10。事实上，用学校学生写乘法表的习惯形式变得更加清晰：\n\
  \n* 7 x 1 = 7\n* 7 x 2 = 14\n* 7 x 3 = 21\n* 7 x 4 = 28\n* 7 x 5 = 35\n* 7 x 6 =\
  \ 42\n* 7 x 7 = 49\n* 7 x 8 = 56\n* 7 x 9 = 63\n* 7 x 10 = 70\n\n注意，我们从 1 开始乘以 7，只要\
  \ 7 小于或等于 10。这是另一个例子，我们可以轻松地让计算机程序为我们完成所有工作，并只显示我们的结果。那么，我们开始吧！\n\n第一步是创建一个新文件，可以命名为\
  \ `tabuadas.html`。在这个文件中，我们将通过 `<script>` 标签开始编写 JavaScript 代码：\n\n```\n1 <script>\n\
  2 \n</script>\n```\n\n由于我们的乘法表计算从乘以 1 开始，直到乘以 10，我们将创建一个变量来存储这个值，我们将其命名为 `multiplicador`，并使其初始值为\
  \ 1。\n\n```\n1 <script>\n2   var multiplicador = 1;\n3 </script>\n```\n\n只要变量 `multiplicador`\
  \ 小于或等于 10，我们就想要计算乘法表。我们可以让程序执行这些任务。以下代码是一个示例：\n\n```\n1 <script>\n2 var mostra\
  \ = function(frase) {\n3   document.write(frase + \"<br>\");\n4 };\n5 \n6 var multiplicador\
  \ = 1;\n7 while(multiplicador <= 10) {\n8   mostra(\"7 x \" + multiplicador + \"\
  \ = \" + (7 * multiplicador));\n9   multiplicador++;\n10 }\n11 </script>\n```\n\n\
  ### 5.7 学习不同的显示方式：for 命令\n\n通常，当我们有重复操作时，会使用 `while`，但有一种更有组织的方式编写这种代码：`for` 命令。`for`\
  \ 在我们知道需要重复多少次数时非常有用。\n\n`for` 的语法如下：\n\n```\nfor (初始化; 条件; 增量) {\n  // 要执行的代码\n\
  }\n```\n\n其中：\n1. **初始化**：在此处定义控制变量（例如 `var i = 1`）。\n2. **条件**：在每次重复之前检查的表达式。如果为真，则执行块（例如\
  \ `i <= 10`）。\n3. **增量**：每次重复后发生的操作（例如 `i++`）。\n\n看看使用 `for` 编写 7 的乘法表是怎样的：\n\n\
  ```javascript\n<script>\n  for (var multiplicador = 1; multiplicador <= 10; multiplicador++)\
  \ {\n    mostra(\"7 x \" + multiplicador + \" = \" + (7 * multiplicador));\n  }\n\
  </script>\n```\n\n注意 `for` 如何一行整合了我们之前用 `while` 需要多行完成的功能，使得代码更加简洁且易于阅读。\n\n\n\n\
  \n每一个这些空间都在等待一个信息来控制将发生的循环。我们将编写一个程序，显示 10 个警报，每个都有一个从 1 到 10 的数字。我们同样会有一个循环，现在它应该从\
  \ 1 到 10。你还记得如何用 `while` 来实现它吗？代码会像下面这样：\n\n```\n1 var numero = 1\n2 while(numero\
  \ <= 10) {\n3   alert(numero);\n4   numero = numero + 1;\n5 }\n```\n\n那么，我们可以用 `for`\
  \ 实现几乎完全相同的操作：\n\n```\n1 var numero = 1;\n2 for(; numero <= 10; ) {\n3   alert(numero);\n\
  4   numero = numero + 1;\n5 }\n```\n\n我们在第二个空间填充了循环条件，它将每次被被检查，以确定是否应该发生下一次循环。\n\
  \n这与已知的 `while` 有什么区别？在 `for` 内部出现了分号，这使得编写方式变得有点 *haha*（奇怪）。最终结果将是完全相同的。那么，为什么还需要另一个循环命令呢？\n\
  \n使用 `for`，我们可以使用分号之前的第一个空间来进行初始化。一个例子是初始化变量 `numero`：\n\n```\n1 for(var numero\
  \ = 1; numero <= 10; ) {\n2   alert(numero);\n3   numero = numero + 1;\n4 }\n```\n\
  \n现在，发生了什么变化？几乎没有变化。你的代码变得更易读了。`var numero = 1` 的部分被称为 `for` 的初始化。它将只执行一次。下一步是检查\
  \ `numero <= 10` 并决定是否应该执行循环。\n\n在第二个分号 后的第三个空间，我们可以做什么呢？该部分的内容将始终被执行。它被广泛用于执行增加、递增我们在循环中使用的变量的代码。在这种情况下，是为了增加我们变量\
  \ `numero` 的值。通过此，我们可以使用这个新命令以这种方式打印从 1 到 10 的数字：\n\n```\n1 for(var numero = 1;\
  \ numero <= 10; numero = numero + 1) {\n2   alert(numero);\n3 }\n```\n\n因此，我们可以发现\
  \ `for` 拥有 3 个空间/部分：第一个，我们说明我们想要的初始值是多少；第二个，用于定义决定是否应该执行循环的条件——这部分的实现与我们在 `while`\
  \ 中看到的一样；第三个，用于修改影响循环结束的变量值。这三部分都由 `;` 隔开。\n\n```\nfor([初始化]; 重复条件]; 值修改])\n```\n\
  \n这里的重点是，我们刚刚用新命令 `for` 所做的，与我们用 `while` 能实现的的一样的，只是编写方式不同。`for` 需要我们在命令的括号中间写出这\
  \ 3 个特征，而 `while` 只需要条件。\n\n### 5.8 使用 for 重写乘法表\n\n既然如此，如果我们编写相同的显示在屏幕上的程序，但现在使用\
  \ `for` 代替 `while` 会变成什么样？首先，让我们回一下乘法表代码是如何写的，它使用了 `while` 命令：\n\n```\n1 <script>\n\
  2 var mostra = function(frase) {\n3   document.write(frase + \"<br>\");\n4 };\n\
  5 \n6 var multiplicador = 1;\n7 while(multiplicador <= 10) {\n8   mostra(7 * multiplicador);\n\
  9   multiplicador = multiplicador + 1;\n10 }\n11 </script>\n```\n\n现在，我们可以创建 `tabuada_com_for.html`\
  \ 文件，在其中创建一个新程序，它将执行与之前完全相同的事情，但方式不同。由于 `for` 首先需要一个初始值，很容易识别出它是变量 `multiplicador`，它从值\
  \ 1 开始。\n\n```\n1 <script>\n2 for(var multiplicador = 1; ;) {\n3 }\n4 </script>\n\
  ```\n\n现在我们需要填充 `for` 需要的其他信息。下一个是循环应该持续到什么时候，在这种情况下，是指示当 `multiplicador` 小于 10\
  \ 时应该循环的条件。\n\n```\n1 <script>\n2 for(var multiplicador = 1; multiplicador <= 10;\
  \ ) {\n3 }\n4 </script>\n```\n\n好了，只差说明 `multiplicador` 以多大的间隔增加，在我们的情况下是每次 1。我们称这为递增变量。为了此，我们正在执行\
  \ `multiplicador = multiplicador + 1`。每当我们想给那个变量加 1 时，我们必须重复变量的名字，表示我们想将其赋值原有值加\
  \ 1 的结果。\n\n在日常生活中，许多程序员将倾向于用一种简写的方式这样做。语言的语法规则允许这样做。这一行可以简写为 `multiplicador++`。变量旁边的两个加号仅仅是\
  \ `JavaScript` 理解的一种简写方式，意味着你想增加该变量的值。\n\n通过此，我们可以用这种方式写写命令：\n\n```\n1 <script>\n\
  2 for(var multiplicador = 1; multiplicador <= 10; ) {\n3 }\n4 </script>\n```\n\n\
  好了，只差说明 `multiplicador` 以多大的间隔增加，在我们的情况下是每次 1。我们称这为递增变量。为了此，我们正在执行 `multiplicador\
  \ = multiplicador + 1`。每当我们想给那个变量加 1 时，我们必须重复变量的名字，表示我们想将其赋值原有值加 1 的结果。\n\n在日常生活中，许多程序员将倾向于用一种简写的方式这样做。语言的语法规则允许这样做。这一行可以简写为\
  \ `multiplicador++`。变量旁边的两个加号仅仅是 `JavaScript` 理解的一种简写方式，意味着你想增加该变量的值。\n\n通过此，我们可以用这种方式写写命令：\n\
  \n```\n1 <script>\n2 for(var multiplicador = 1; multiplicador <= 10; multiplicador++)\
  \ {\n3   mostra(multiplicador * 7);\n4 }\n5 </script>\n```\n\n\n\n\nAgora que sabemos\
  \ quantos familiares existem, podemos perguntar a idade de cada um. Dessa forma,\
  \ se for informado que são 4 familiares, precisamos perguntar as 4 idades. Note\
  \ que temos uma repetição, que neste caso vai de 1 até número total de familiares.\n\
  \n```javascript\nvar totalDeFamiliares = prompt(\"Quantos familiares são?\");\n\
  var numero = 1;\nwhile(numero <= totalDeFamiliares) {\n  numero++;\n}\n```\n\nAnalisando\
  \ o código, temos uma nova variável chamada `numero`. Ela serve apenas para nos\
  \ auxiliar a saber até quando repetir o trecho dentro do `while`. A cada repetição,\
  \ aumentamos seu valor em 1 através de `numero++`.\n\nA cada repetição, precisamos\
  \ perguntar a idade da pessoa.\n\n```javascript\nvar totalDeFamiliares = prompt(\"\
  Quantos familiares são?\");\nvar numero = 1;\nwhile(numero <= totalDeFamiliares)\
  \ {\n  var idadeTexto = prompt(\"Qual é a idade?\");\n  var idade = parseInt(idadeTexto);\n\
  \  numero++;\n}\n```\n\nNote que usamos o `parseInt` para transformar o valor digitado\
  \ no `prompt` em um número. Isso acontece porque vamos somar esse valor `idade`.\
  \ Se o deixássemos como `string`, os valores seriam concatenados, como já vimos.\n\
  \nÉ comum fazer tudo isso em uma única linha, descartando a necessidade de criar\
  \ a variável `idadeTexto`. Este é o tipo de variável que chamamos de temporária,\
  \ pois existe apenas para nos auxiliar a calcular a `idade`. Para fazer direto,\
  \ usamos `parseInt(prompt(\"Qual é a idade?\"))`. Parece complicado, mas não é.\
  \ O JavaScript sempre começa a execução pelos parênteses mais internos, executando\
  \ o `prompt`. Com o resultado do `prompt` em mãos, ele executará o `parseInt`, devolvendo\
  \ o valor do que foi digitado, porém como número, pronto para ser usado corretamente\
  \ em operações matemáticas. Nosso código ficou:\n\n```javascript\nvar totalDeFamiliares\
  \ = prompt(\"Quantos familiares são?\");\nvar numero = 1;\nwhile(numero <= totalDeFamiliares)\
  \ {\n  var idade = parseInt(prompt(\"Qual é a idade?\"));\n  numero++;\n}\n```\n\
  \nPara calcular a média, somamos todas as idades e dividimos pelo `totalDeFamiliares`\
  \ que temos, porém, a cada repetição, pegamos uma nova idade e não guardamos o total\
  \ de idades que já poderíamos ter pegado em repetições anteriores. Para resolver\
  \ esse problema, vamos criar uma nova variável chamada `somaDeIdades`, que começará\
  \ com o valor 0 e a cada repetição somaremos a idade digitada.\n\n```javascript\n\
  var totalDeFamiliares = prompt(\"Quantos familiares são?\");\nvar somaDeIdades =\
  \ 0;\nvar numero = 1;\nwhile(numero <= totalDeFamiliares) {\n  var idade = parseInt(prompt(\"\
  Qual é a idade?\"));\n  somaDeIdades = somaDeIdades + idade;\n  numero++;\n}\n```\n\
  \nCom isso, considere que temos 3 familiares. O primeiro com 20, o segundo com 30\
  \ e o terceiro com 40 anos. Na primeira repetição, o valor de `somaDeIdades` que\
  \ estará 0 será somado com 20, ou seja, seu novo valor agora é 20. Na segunda repetição,\
  \ `somaDeIdades` que agora tem o valor 20 será somado com 30 e vai para 50. Por\
  \ fim, `somaDeIdades` que agora é 50 vai para 90, com a soma de 40 da idade do último\
  \ familiar.\n\n**No fim das repetições, o valor da soma das idades foi para 90**.\
  \ Agora que terminamos as repetições, se queremos saber a média de idades, basta\
  \ dividir essa `somaDasIdades` pelo `totalDeFamiliares`. Por exemplo, com a soma\
  \ 90 e 3 familiares, a média de idade será de 30 anos.\n\nEntão vamos fazer o nosso\
  \ programa: após as repetições serem feitas, ou seja, depois que o `while` terminar\
  \ seu trabalho, calcular a média e mostrá-la. São as duas últimas linhas do código\
  \ abaixo:\n\n```javascript\nvar totalDeFamiliares = prompt(\"Quantos familiares\
  \ são?\");\nvar somaDeIdades = 0;\nvar numero = 1;\nwhile(numero <= totalDeFamiliares)\
  \ {\n  var idade = parseInt(prompt(\"Qual é a idade?\"));\n  somaDeIdades = somaDeIdades\
  \ + idade;\n  numero++;\n}\nvar media = somaDeIdades / totalDeFamiliares;\nalert(\"\
  A média é: \" + media);\n```\n\nPronto, agora se você abrir esse programa em seu\
  \ navegador, ele perguntará primeiro a quantidade de familiares que você tem e,\
  \ em seguida, perguntará qual é a idade de cada um deles. No final teremos a média\
  \ de idade dos familiares.\n\n### 5.10 Jogo: Mais chances para adivinhar o número\
  \ que estou pensando\n\nNo capítulo 4, fizemos o computador pensar em um número.\
  \ Agora o computador pensará em um número entre 0 e 100. O usuário terá 3 chances\
  \ para adivinhar esse número. Se o usuário errar, o computador dirá se o número\
  \ secreto é maior ou menor. Se o usuário acertar, o computador mostrará parabéns.\n\
  \nVamos criar um novo arquivo chamado `jogo_adivinha_com_tentativas.html`:\n\n```html\n\
  <script>\nvar numeroPensado = Math.floor(Math.random() * 101);\n</script>\n```\n\
  \nA partir do `numeroPensado`, precisaremos perguntar ao usuário qual palpite ele\
  \ gostaria de dar. Vamos estipular também que a quantidade de tentativas será 3\
  \ e que quando passar da terceira tentativa a repetição deverá encerrar.\n\nPara\
  \ isso, vamos declarar uma variável `numeroTentativa`, onde guardaremos se é a primeira,\
  \ segunda ou terceira tentativa. Essa variável começará em 1, já que no começo do\
  \ programa estaremos na primeira tentativa. Enquanto esse número for menor ou igual\
  \ a 3, ou seja, enquanto não passar da terceira tentativa, faremos a pergunta. Vamos\
  \ usar o `while` para isso e não esquecer que ao final de cada repetição devemos\
  \ aumentar o número da tentativa (caso contrário, entraremos em repetições infinitas):\n\
  \n```javascript\n<script>\nvar numeroPensado = Math.floor(Math.random() * 101);\n\
  var numeroTentativa = 1;\nwhile(numeroTentativa <= 3) {\n  numeroTentativa++;\n\
  }\n</script>\n```\n\nPrecisamos perguntar para o usuário do programa qual é o número\
  \ que ele acha que o computador pensou. Vamos fazer isso através de um `prompt`,\
  \ que colocaremos dentro do bloco de repetição, o `while`, pois ele fará parte de\
  \ uma tentativa:\n\n```javascript\n<script>\nvar numeroPensado = Math.floor(Math.random()\
  \ * 101);\nvar numeroTentativa = 1;\nwhile(numeroTentativa <= 3) {\n  var chute\
  \ = prompt(\"Qual você acha que é?\");\n  numeroTentativa++;\n}\n</script>\n```\n\
  \nPronto, agora a cada repetição perguntamos ao usuário qual é o palpite que ele\
  \ quer dar. Precisamos saber se ele acertou ou não. Para isso, basta compararmos\
  \ o número do `chute` com o `numeroPensado` e ver se eles são iguais. Mostraremos\
  \ mensagens para o usuário nos dois casos.\n\n```javascript\n<script>\nvar numeroPensado\
  \ = Math.floor(Math.random() * 101);\nvar numeroTentativa = 1;\nwhile(numeroTentativa\
  \ <= 3) {\n  var chute = prompt(\"Qual você acha que é?\");\n  if(chute == numeroPensado)\
  \ {\n    alert(\"Uau! Você acertou!\");\n  } else {\n    alert(\"Errou! Eu tinha\
  \ pensado \" + numeroPensado);\n  }\n  numeroTentativa++;\n}\n</script>\n```\n\n\
  \n\n\n```javascript\n 1 <script>\n 2 var numeroPensado = Math.round(Math.random()\
  \ * 100);\n 3 \n 4 var numeroDaTentativa = 1;\n 5 while(numeroDaTentativa <= 3)\
  \ {\n 6   var chute = prompt(\"Qual você acha que é?\");\n 7   \n 8   if(chute ==\
  \ numeroPensado) {\n 9     alert(\"Parabéns, você acertou!\");\n10   } else {\n\
  11     alert(\"Você errou. Será que ainda tem mais tentativas?\");\n12   }\n13 \
  \  numeroDaTentativa++;\n14 }\n15 </script>\n```\n\n在你的浏览器中打开 `jogo_adivinha_com_tentativas.html`\
  \ 并尝试猜中。如果觉得困难，一个技巧是减少计算机想的数字范围，例如从 100 减到 10。要这样做，只需修改以下行：\n\n```javascript\n1\
  \ var numeroPensado = Math.round(Math.random() * 10);\n```\n\n在玩几次之后，你会发现这个游戏有些问题。尝试在第一次或第二次尝试中猜中数字，看看会发生什么。游戏会显示恭喜信息，表示你猜中了，但它会再次问你计算机想的数字是多少。我们需要修复这个问题，但该怎么做呢？代码中的问题在哪里？\n\
  \n通过仔细分析，我们发现一旦猜中了数字，就不需要再次尝试，也就是说，循环应该立即结束。但我们如何停止循环并立即退出 `while` 循环呢？\n\nJavascript（与其他编程语言一样）有一个名为\
  \ `break`（打破）的命令，这意味着当它被调用时，循环应该被打破，即被停止。这正是我们需要的。当猜中数字时，我们需要停止循环，因为再次询问用户没有意义。\n\
  \n```javascript\n1 if(chute == numeroPensado) {\n2   alert(\"Parabéns, você acertou!\"\
  );\n3   break;\n4 } else {\n5   alert(\"Você errou. Será que ainda tem mais tentativas?\"\
  );\n6 }\n```\n\n进行此更改后，尝试在第一次或第二次尝试中猜中数字。程序将不再再向你索要另一个数字。这好多了，不是吗？\n\n### 5.11 复习我们的代码：数字猜数字游戏\n\
  \n我们在 `jogo_adivinha_com_tentativas.html` 文件中开始游戏，让计算机想一个 0 到 100 之间的随机数。\n\n```javascript\n\
  1 var numeroPensado = Math.round(Math.random() * 100);\n```\n\n下一步是向用户最多询问 3 次，询问他认为计算机想的数字是多少。\n\
  \n```javascript\n1 var numeroDaTentativa = 1;\n2 while(numeroDaTentativa <= 3) {\n\
  3   var chute = prompt(\"Qual você acha que é?\");\n4   \n5   numeroDaTentativa++;\n\
  6 }\n```\n\n每次尝试时，我们需要检查他是猜中了还是猜错了。如果猜中了，我们需要立即退出循环，这可以通过 `break` 命令实现。\n\n```javascript\n\
  \ 1 var numeroDaTentativa = 1;\n 2 while(numeroDaTentativa <= 3) {\n 3   var chute\
  \ = prompt(\"Qual você acha que é?\");\n 4   if(chute == numeroPensado) {\n 5  \
  \   alert(\"Parabéns, você acertou!\");\n 6     break;\n 7   } else {\n 8     alert(\"\
  Você errou. Será que ainda tem mais tentativas?\");\n 9   }\n10   numeroDaTentativa++;\n\
  11 }\n```\n\n让我们通过一些挑战来改进我们的游戏。\n\n1. 让你的程序在尝试失败时，显示“猜中”的数字比计算机想的数字大还是小。这可以作为用户猜中的一个良好提示。记住，为了这一点，你将需要在说用户错误的\
  \ `else` 块内部使用另一个 `if`。\n2. 让游戏只有在猜中时才结束。为了这样做，必须修改 `while` 的循环条件，使其变成无限循环。修改后，测试你的游戏，看看你需要多少次尝试才能发现那个数字。\n\
  3. 游戏太简单了？增加计算机可能想的数字范围。`1000` 可能是一个很好的开始数字。挑战你的朋友和家人。看看谁能保持记录。\n4. 是否有一种方法可以在不使用\
  \ `break` 的情况下编写这个游戏，只需更改 `while` 条件，并通过表示“与”的运算符（`&&`）添加一个额外的子句。你能猜到怎么做吗？\n\n###\
  \ 5.12 练习：在循环中使用循环\n\n循环在我们的代码中经常出现。它们嵌套出现也很常见。想象我们想在屏幕上显示以下星号序列。有 3 行，每行有 10 个星号：\n\
  \n![Parece fácil fazer esse monte de asteriscos.](img/asteriscos.png) \n*图 5.1：制作这么多星号看起来很简单。*\n\
  \n你可能会想出一个非常、非常简单但毫无挑战性的解决方案。类似于这样的：\n\n```javascript\n1 mostra(\"**********\");\n\
  2 mostra(\"**********\");\n3 mostra(\"**********\");\n```\n\n可以变得更有趣。与其复制粘贴，我们可以使用见过的\
  \ `for`：\n\n```javascript\n1 for(var linha = 0; linha < 3; linha = linha + 1) {\n\
  2   mostra(\"**********\");\n3\n```\n\n改进了！但我们想更进一步。如果我们需要修改并在每行打印 250 个星号，我们将在该\
  \ `mostra` 调用中写一大堆它们。\n\n想法是使用两个循环。第一个说类似于“对于每一行”，第二个说“对于每一列，打印一个”。在每行的结束处，我们打印一个\
  \ `<br>`。\n\n代码很短，但第一次可能会吓到你。创建 `asteriscos.html` 并像往一样在 script 标签内输入以下行：\n\n```javascript\n\
  1 for(var linha = 0; linha < 3; linha = linha + 1) {\n2   for(var coluna = 0; coluna\
  \ < 10; coluna = coluna + 1) {\n3     document.write(\"*\");\n4   }\n5   document.write(\"\
  <br>\");\n6 }\n```\n\n\n\n\n现在打开页面。看到我们有一个文本框和一个按钮！这就是你的第一个表单！\n\n![我们使用 HTML 的第一个表单](img/formulario1.png)\n\
  *图 6.1：我们使用 HTML 的第一个表单*\n\n点击按钮，会发生什么？什么都没有发生！\n\n是的！这就是大多数你输入数据的网页的工作方式。当你点击一个按钮时，这些数据通常会被发送到其他计算机（称为服务器），以便在那里进行存储。但我们也可以使用\
  \ JavaScript 在我们自己的电脑上处理这些数据。\n\n让我们让这个按钮检查用户是否猜中了我们正在想的数字。在继续之前，我们需要为我们的每个小框命名。我们通过在每个输入框（input）中放置标识符（`id`）来实现\n\
  \n```\n1 <input type=\"text\" id=\"numero\" />\n2 <input type=\"submit\" id=\"adivinhar\"\
  \ value=\"比较我的秘密！\"/>\n```\n\n现在我们可以开始编写 JavaScript 代码了。我们将做的第一步是访问包含数字的文本框并弹出一个\
  \ `alert`。以下是完整代码：\n\n```\n1 <input type=\"text\" id=\"numero\" />\n2 <input type=\"\
  submit\" id=\"adivinhar\" value=\"比较我的秘密！\"/>\n3 \n4 <script>\n5 var caixaDoNumero\
  \ = document.getElementById(\"numero\");\n6 alert(caixaDoNumero.value);\n7 </script>\n\
  ```\n\n嘿！这里发生了很多事情。`document.getElementById(\"numero\")` 是让 JavaScript 搜索 HTML 代码并找到\
  \ `id = numero` 元素的方法。这个变量 `caixaDoNumero` 并不是我们输入的数值，它本身就是那个文本框！通过 `caixaDoNumero.value`，我们才得到了框内内容的值，即在里面输入的内容。\n\
  \n打开文件。现在会发生什么？是的！`alert` 在页面加载时刻就立即执行了，没有留给我们时间在框中填写任何值，显示的内容是空的。我们不希望在页面加载时立即执行\
  \ `alert`。我们希望在点击 `adivinhar`（猜）按钮时调用 `alert`！\n\n为了实现这一点，我们首先要创建一个希望在点击按钮时执行的函数。删除\
  \ `alert` 并添加：\n\n```\n1 var botaoClicado = function() {\n2   alert(caixaDoNumero.value);\n\
  3 };\n```\n\n如果我们现在打开页面，输入数字并点击按钮会怎样？又什么都没有发生！\n\n缺少了什么？缺少定义当有人点击 `adivinhar` 按钮时，应该调用函数\
  \ `botaoClicado`！我们用非常简单的方法来实现。添加以下行：\n\n```\n1 var botaoAdivinhar = document.getElementById(\"\
  adivinhar\");\n2 botaoAdivinhar.onclick = botaoClicado;\n```\n\n在第一行中，我们获取按钮并将其存储在变量\
  \ `botaoAdivinhar` 中。第二行是重要的。它表示当 `adivinhar` 按钮被点击（`onclick`）时，应该调用函数 `botaoClicado`。将特定事件与函数的执行关联起来是非常常见的。这些发生通常被称为事件（events），而要在特定事件中执行的函数被称为回调函数（callback\
  \ functions）。不要太担心命名，但它会在你的学习中频繁出现。\n\n那么猜数字呢？嗯，缺少了存储我们想的数字以便之后与输入的数字进行比较。让我们复习这段代码并加入这个功能。\n\
  \n### 6.2 复习 HTML 的使用并创建游戏\n\n让我们重新编写代码，但这次带上游戏。第一步，创建 `adivinha_mais.html` 文件。我们从声明两个\
  \ HTML 元素开始：一个是包含数字的框，另一个是检查是否猜中的按钮：\n\n```\n1 <input type=\"text\" id=\"numero\"\
  \ />\n2 <input type=\"submit\" id=\"adivinhar\" \n3   value=\"与我想的数字比较!\" />\n```\n\
  \n现在开始处理 HTML。为了简单，我们不随机抽取数字，而是将其固定：\n\n```\n1 <script>\n2 var segredo = 8;\n```\n\
  \n然后我们通过那段长代码获取 HTML 元素，即 `document.getElementById`。\n\n```\n1 var caixaDoNumero\
  \ = document.getElementById(\"numero\");\n```\n\n我们创建一个函数来检查输入的数字（即 `caixaDoNumero.value`）是否等于\
  \ `segredo`。根据结果打印输出内容：\n\n```javascript\n1 var botaoClicado = function() {\n2 \
  \  if(segredo == caixaDoNumero.value) {\n3     alert(\"恭喜！你猜中了秘密数字\");\n4   }\n\
  5   else {\n6     alert(\"遗憾，你猜错了!\");\n7   }\n8 };\n```\n\n只差最后一步：说明当 `adivinhar`\
  \ 按钮被点击（点击事件）时，它应该调用函数 `botaoAdivinhar`：\n\n```\n1 var botaoAdivinhar = document.getElementById(\"\
  adivinhar\");\n2 botaoAdivinhar.onclick = botaoClicado;\n3 </script>\n```\n\n正如我们所看到的，这种接收通知类型的函数……（注：原文此处存在大量重复的无效文本，已根据逻辑处理结束）。\n\
  \n\n\n\n\n# 打印所有数字\n\n只需创建一个从 0 到 5 的 `for` 循环即可：\n\n```\n1 for(var i = 0; i < 6;\
  \ i = i + 1) {\n2   console.log(segredos[i]);\n3 }\n```\n\n`segredos[i]` 访问数组 `segredos`\
  \ 中第 `i` 个位置！位于 `[]` 内部的数字也称为索引！\n\n`arrays` 具有一些方便之处。例如，我们可以知道它的长度：\n\n```\n1 console.log(segredos.length);\n\
  ```\n\n正因如此，编写那个 `for` 循环不需要固定数字 6，而是将其替换为 `segredos.length`：\n\n```\n1 for(var\
  \ i = 0; i < segredos.length; i = i + 1) {\n2   console.log(segredos[i]);\n3 }\n\
  ```\n\n## 创建彩票\n\n现在简单了！创建你的 `loteria.html` 文件，我们来声明文本框和按钮：\n\n```\n1 <input type=\"\
  text\" id=\"numero\" />\n2 <input type=\"submit\" id=\"adivinhar\" value=\"Compare\
  \ com o meu segredo!\" />\n```\n\n现在我们在 JavaScript 中声明我们的秘密数字：\n\n```\n1 var segredos\
  \ = [16, 34, 37, 42, 50, 58];\n```\n\n正如我们所看到的，我们获取用户输入猜测数字的框：\n\n```\n1 var caixaDoNumero\
  \ = document.getElementById(\"numero\");\n```\n\n让我们准备在点击按钮事件发生时被调用的函数（回调）。我们在里面要做什么？我们使用一个\
  \ `for` 循环遍历所有数字，检查它是否等于 `caixaDoNumero.value`。如果是，我们就打印他赢了。注意：\n\n```\n1 var botaoClicado\
  \ = function() {\n2   for(var i = 0; i < segredos.length; i = i + 1) {\n3     if(segredos[i]\
  \ == caixaDoNumero.value) {\n4       alert(\"Parabéns! Você acertou um dos números\
  \ secretos\");\n5     }\n6   }\n7 };\n```\n\n代码还不够完美。如果用户猜错了会发生什么？没有任何消息显示。我们可以尝试通过在\
  \ `for` 循环末尾添加一个新的 `alert` 来尝试解决这个问题：\n\n```\n1 var botaoClicado = function() {\n\
  2   for(var i = 0; i < segredos.length; i = i + 1) {\n3     if(segredos[i] == caixaDoNumero.value)\
  \ {\n4       alert(\"Parabéns! Você acertou um dos números secretos\");\n5     }\n\
  6   }\n7   alert(\"Infelizmente você errou!\");\n8 };\n```\n\n好了，当你猜错秘密时，这可以运行。只会显示“Infelizmente\
  \ você errou!”（遗憾你错了！）。\n\n但想象用户猜中了数字，在 `for` 循环结束后，程序仍然会显示他猜错了的 `alert`！我们希望这个函数在数字正确时不显示第二个\
  \ `alert`。\n\n我们可以通过使用 `return` 来解决这个问题。`return` 可以用于不返回任何值的函数，使函数的执行在那个时刻停止并返回给调用者：\n\
  \n```\n1 var botaoClicado = function() {\n2   for(var i = 0; i < segredos.length;\
  \ i = i + 1) {\n3     if(segredos[i] == caixaDoNumero.value) {\n4       alert(\"\
  Parabéns! Você acertou um dos números secretos\");\n5       return;\n6     }\n7\
  \   }\n8   alert(\"Infelizmente você errou!\");\n9 };\n```\n\n注意，还有其他方法可以在不使用 `return`\
  \ 的情况下解决这个问题。你可以创建一个 `var achou`，并在检查是否猜中的 `if` 语句中设置 `achou = true`，同时显示猜中的消息。在\
  \ `for` 之外、显示错误消息之前，你应该检查 `achou != true`。\n\n下一步是什么？现在我们只需要注册该函数将作为按钮点击事件的回调，正如我们已经学过的那样：\n\
  \n```\n1 var botaoAdivinhar = document.getElementById(\"adivinhar\");\n2 botaoAdivinhar.onclick\
  \ = botaoClicado;\n3 </script>\n```\n\n打开你的彩票并尝试猜中其中一个数字。\n\n1. 移除代码中的 `break` 看看会发生什么。为什么这里需要\
  \ `break` ？\n2. 如果用户猜中了数字，请说出猜中数字的位置。例如：“Parabéns, você acertou o 5o número!”。即数组的索引，只需注意从\
  \ 0 开始。\n\n## 6.4 在宾果游戏中中避免重复数字\n\n我们已经看到了数组的基本操作，但如何修改它的值呢？请看 `segredos` 数组：\n\n\
  ```\n1 var segredos = [16, 34, 37, 42, 50, 58];\n2 console.log(segredos[0]);\n```\n\
  \n正如我们可以通过 `segredos[0]` 获取第一个元素一样，我们也可以修改它：\n\n```\n1 segredos[0] = 20;\n2 console.log(segredos[0]);\n\
  ```\n\n\n\n\n请注意，如果我们找到了数字并显示了警告消息，我们会执行一个 `return`。正如我们所看到的，`return` 命令可以简单地停止一个没有返回值的函数的执行。如果你移除这个\
  \ `return`，你会发现即使数字已经重复，它最终会将该数字添加到我们的数组中。如果换成 `break`，会有用吗？\n\n1. 这是一个困难的练习！你必须从\
  \ 1 到 60 之间随机抽取 6 个数字并将它们存储在一个数组中。然后要求用户输入 6 个数字，一次一个（可以使用 `prompt` 或 `input`），并把它们存储在另一个数组中。最后告诉他猜中了几个数字。是的，这次是真正的彩票游戏！\n\
  \n   尝试猜中这 6 个数字。然后计算一下你猜中全部 6 个数字的概率。你可能再也不会玩彩票了！\n\n## 第 7 章：附录 - 让一切变得更有趣图表\n\
  \n为我们的工作提供视觉反馈是非常回报的。我们将学习使用一些 JavaScript 函数在 HTML 的画布（`canvas`）上绘图，以练习我们所学的知识并进一步探索。用有趣的图片惊艳你的朋友，并让我们看看你做了什么！记得参加我们的讨论列表。\n\
  \n会涉及到一些数学，但不要担心。它会非常简单，你不需要担心细节。重要的是始终观察函数、变量、`ifs` 和 `fors` 是如何协同工作的。\n\n如果你阅读的是纸质版，将无法获得用于练习题的准确颜色，没关系，你可以选择你认为合适的颜色。\n\
  \n### 7.1 绘制线条和形状\n\n我们要在页面上定义一个区域，以便我们通过 JavaScript 在上面绘图。创建一个 `canvas.html` 文件，并如下所示声明我们将用于涂画的区域：\n\
  \n```\n1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n```\n\n没错，只有一行，没有\
  \ `script` 标签。在 Chrome 中打开你的 HTML，结果是什么？没错，一个 600x400 的白色画布，背景上是……也是白色的！什么也看不见。让我们在左侧画一个绿色（`green`）矩形，位于\
  \ `0,0`（左上角），大小为 `200,400`（到达底部，即最大可能值 600 的三分之一）。在这里我们正在一个二维平面上工作，逗号分隔 X 位置和 Y\
  \ 位置。\n\n为了实现这一点，我们不得不使用一些我们还不太熟悉的 JavaScript 函数。别担心，你以后会学到关于它们的很多知识。测试（尽管并不理想）我们尚未掌握的新函数和命令是自然的。\n\
  \n在你的 canvas 声明下方直接添加以下行。\n\n```\n1 <script>\n2 var tela = document.getElementById(\"\
  tela\");\n3 var c = tela.getContext(\"2d\");\n4 \n5 c.fillStyle=\"green\";\n6 c.fillRect(0,\
  \ 0, 200, 400);\n7 </script>\n```\n\n打开你的 HTML，我们得到了下面的图形：\n\n![一个简单的绿色列柱](img/verde.png)\
  \ 图 7.1：一个简单的绿色列柱\n\n前两个目前对我们并不重要。你可以想象变量 `c` 就像一把画笔。我们可以更改画笔的样式（通过变量 `fillStyle`）并绘制各种形状（在本例中是矩形，通过调用函数\
  \ `fillRect`）。\n\n`fillRect` 函数接收四个数字来绘制一个矩形。前两个是 X,Y 位置。另外两个是矩形的宽度和高度。在这种情况下，我们正在位置\
  \ `0,0` 绘制一个宽为 200、高为 400 的矩形。\n\n如何更好地了解它在屏幕上的终点在哪里？`0,0` 点是左上角。`600,400` 点是右下角。观察我们\
  \ X 和 Y 坐标中分散的一些其他点：\n\n![我们平面的坐标。使用此图作为参考知道在哪里绘制你的对象！](img/plano.png) 图 7.2：我们平面的坐标。使用此图作为参考知道在哪里绘制你的对象！\n\
  \n让我们再添加一个矩形，现在是红色的，从位置 `400,0` 开始。在你的绿色矩形之后添加：\n\n```\n1 c.fillStyle=\"red\";\n\
  2 c.fillRect(400, 0, 200, 400);\n```\n\n结果非常棒！我们得到了意大利国旗。\n\n![意大利国旗](img/italia.png)\
  \ 图 7.3：意大利国旗\n\n尝试更换颜色，如 `gray`、`red`、`green`、`blue`、`black` 等。\n\n### 7.2 创建各种类型的图像\n\
  \n`fillRect` 函数简单且直接。它接收起始坐标，以及高度和宽度。绘制其他形状需要更多工作。你需要先描绘路径，然后调用函数来填充已绘制的内容。\n\n\
  例如，我们想在国旗中间画一个灰色（`gray`）的三角形，像这样：\n\n![现在有一个三角形](img/triangulo.png)\n\n为了实现这一点，我们需要从这里。存在\
  \ `arc` 函数，它需要很多信息。是 X 和 Y 坐标、半径、起始角度和结束角度，都是弧度。并不简单。它需要起始和结束角度来绘制圆弧。我们将使用 0 到 3.14。\n\
  \n```\n1 c.fillStyle=\"blue\";\n2 c.beginPath();\n3 c.arc(300, 200, 50, 0, 3.14);\n\
  4 c.fill();\n```\n\n只使用了两位小数。这个 PI 值可以替换为 `Math.PI`，它是一个已经存在的变量。像这样的固定值通常被称为常量。\n\
  \n我们在这一章中看到了很多函数。我们如何记住所有的它们？或者知道我应该传递参数的顺序？`c.arc(300, 200, 50, 0, 3.14)` 这一行看起来相当复杂。\n\
  \n### 7.3 我记不住所有这些！API 和库\n\n我们的代码看起来并不那么困难，但我们如何知道这些画布 绘图函数的存在？如果你仔细看，我们看到了超过 5\
  \ 个不同的函数，包括 `fillRect`、`beginPath`、`moveTo`、`lineTo` 和 `fill`。此外我们还使用了变量 `fillStyle`。要记忆的东西太多了！\n\
  \n你并不应该太担心去记住它们。当然，如果你经常使用它们，这会变得容易。想想我们的 `document.write`、`alert` 以及其他在学习过程中只出现过一次的函数。但这些画布的呢？那个所谓的“2d\
  \ 上下文”，在 `tela.getContext(\"2d\")` 中出现我们几乎没有谈论它？\n\n事实是我们一直有一个 JavaScript 主要函数的文档。例如，我们用于处理画布\
  \ 的所有函数和变量可以在这里找到，并有详细的文档：\n\n\n\n\n\n[`developer.mozilla.org/en-US/docs/DOM/CanvasRenderingContext2D`](https://developer.mozilla.org/en-US/docs/DOM/CanvasRenderingContext2D)\n\
  \nMozilla site, responsável pelo navegador Firefox, possui uma das documentações\
  \ mais completas e fáceis de ler. Neste site, você pode ver uma documentação como\
  \ a imagem abaixo.\n\n![Documentação no site Mozilla](img/documentacao_normal.png)\
  \ *Figura 7.7: Documentação no site da Mozilla*\n\nNote que ele fornece uma breve\
  \ descrição e em seguida passa para cada função e cada variável relacionada ao assunto.\
  \ Sim, você precisará lidar com o inglês técnico, mesmo que seja básico. Em português,\
  \ documentações desse tipo, que chamamos de referência (reference), são bastante\
  \ escassas.\n\nA documentação da Mozilla pode conter informações específicas que\
  \ só funcionam no navegador deles. Para uma documentação oficial, que deveria funcionar\
  \ em todos os navegadores, mas que é menos completa, há este site:\n\n[`docs.webplatform.org/wiki/javascript`](http://docs.webplatform.org/wiki/javascript)\n\
  \nMuitas vezes temos um conjunto de funções que trabalham com um objetivo em comum.\
  \ Chamamos esse conjunto de **biblioteca** (library). É comum alguém se referir\
  \ à *biblioteca do JavaScript que trabalha com gráficos*, *biblioteca para validação\
  \ de CPF*, *biblioteca para fazer drag and drop*. Veremos mais tarde que há casos\
  \ em que isso pode aparecer com nomes ainda mais estranhos, como API ou de objeto.\n\
  \nProcure você mesmo a documentação da função `fillRect` nesta página. Clique nela\
  \ para obter mais detalhes.\n\nTambém podemos encontrar formatos mais simpáticos\
  \ dessas documentações, criados por outros desenvolvedores. Este é um bom exemplo\
  \ de post que um blogueiro criou para divulgar seu PDF que contém uma documentação\
  \ alternativa:\n\n[`blog.nihilogic.dk/2009/02/html5-canvas-cheat-sheet.html`](http://blog.nihilogic.dk/2009/02/html5-canvas-cheat-sheet.html)\n\
  \nEle apresenta um resumo das funções que trabalham com o canvas. Segue um pedaço\
  \ dessa documentação onde podemos ver algumas das que já conhecemos, de forma resumida,\
  \ explicando quais são os parâmetros com os quais trabalham:\n\n![Uma documentação\
  \ não oficial, mas que pode ser bem útil. Há várias como essa na internet.](img/documentacao_diferente.png)\
  \ *Figura 7.8: Uma documentação não oficial, mas que pode ser bem útil. Há várias\
  \ como essa na internet.*\n\nVamos conhecer outras funções relacionadas ao canvas\
  \ ainda neste capítulo. Lembre-se de que você pode e deve explorar novas opções\
  \ através da documentação. O inglês não deve ser uma barreira: ele exigirá pouco,\
  \ mas é fundamental conhecer o mínimo.\n\n### 7.4 Rev seus primeiros passos com\
  \ o canvas\n\nVamos revisar o que fizemos para criar a bandeira da Itália e nossas\
  \ outras figuras. Não se assuste com um pouco de matemática e coordenadas. A prática\
  \ tornará tudo muito mais fácil. Primeiro, criamos o arquivo `canvas.html` e declaramos\
  \ nosso canvas:\n\n```\n1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n\
  ```\n\nLogo depois, começamos a inserir o código JavaScript. As duas primeiras linhas\
  \ são para obter o tal contexto 2d, que servirá como pincel. São duas linhas de\
  \ código que ainda não dominamos:\n\n```\n1 <script>\n2 var tela = document.getElementById(\"\
  tela\");\n3 var c = tela.getContext(\"2d\");\n```\n\nAgora desenhamos o primeiro\
  \ retângulo, que será verde:\n\n```\n1 c.fillStyle=\"green\";\n2 c.fillRect(0, 0,\
  \ 200, 400);\n```\n\nO segundo retângulo será vermelho, de mesma largura e altura,\
  \ porém iniciará na posição `400,0`:\n\n```\n1 c.fillStyle=\"red\";\n2 c.fillRect(400,\
  \ 0, 200, 400);\n```\n\nVamos ao triângulo cinza. Aqui usamos a função que inicia\
  \ o traçado, a `beginPath`. Movemos o pincel com `moveTo` e desenhamos com `lineTo`.\
  \ Por último, preenchemos o interior com a função `fill`:\n\n```\n1 c.fillStyle=\"\
  gray\";\n2 c.beginPath();\n3 c.moveTo(300, 200);\n4 c.lineTo(200, 400);\n5 c.lineTo(400,\
  \ 400);\n6 c.fill();\n```\n\nPor último, desenhamos nosso círculo bem no meio da\
  \ bandeira, em azul, lembrando também de fechar a tag `script`:\n\n```\n1 c.fillStyle=\"\
  blue\";\n2 c.beginPath();\n3 c.arc(300, 200, 50, 0, 2*3.14);\n4 c.fill();\n5 </script>\n\
  ```\n\nVamos praticar mais o conhecimento de coordenadas e testar outros desenhos\
  \ e formas através de bandeiras.\n\n1.  Inicialmente vamos desenhar duas bandeiras\
  \ simples, a primeira da Colômbia e a segunda de Madagascar:\n\n    ![Bandeira da\
  \ Colombia](img/colombia.png)\n\n    *Figura 7.1: Bandeira da Colômbia*\n\n    ![Bandeira\
  \ de Madagascar](img/madagascar.png)\n\n    *Figura 7.2: Bandeira de Madagascar*\n\
  \n2.  Agora duas que possuem circunferências e que você precisará usar o arco, do\
  \ Laos e a do Níger:\n\n    ![Bandeira do Laos](img/laos.png)\n\n    *Figura 7.3:\
  \ Bandeira do Laos*\n\n    ![Bandeira do Niger](img/niger.png)\n\n    *Figura 7.4:\
  \ Bandeira do Níger*\n\n3.  A bandeira da Noruega tem uma cruz interessante:\n\n\
  \    ![Bandeira da Noruega](img/noruega.png)\n\n    *Figura 7.5: Bandeira da Noruega*\n\
  \n4.  E a bandeira do Brasil:\n\n    ![Bandeira do Brasil](img/brasil.png)\n\n \
  \   *Figura 7.6: Bandeira do Brasil*\n\n### 7.5 Cansei de repetir! Funções\n\nVamos\
  \ desenhar vários quadrados. Podemos usar um novo arquivo, `loop.html`. Dentro dele,\
  \ vamos declarar o canvas e preparar 50 por pixels. Ela chamará `desenhaQuadradoVerde`:\n\
  \n```\n1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n2 \n3 <script>\n\
  4 desenhaQuadradoVerde = function(x,y) {\n5   var tela = document.getElementById(\"\
  tela\");\n6   var c = tela.getContext(\"2d\");\n7   \n8   c.fillStyle=\"green\"\
  ;\n9   c.fillRect(x, y, 50, 50);\n10 };\n11 \n12 desenhaQuadradoVerde(0,0);\n13\
  \ </script>\n```\n\nNa última linha estamos chamando a função para testar. Salve\
  \ o arquivo e abra-o com o Chrome. O resultado é apenas um quadrado verde.\n\n![Um\
  \ quadrado verde... através da função!](img/quadrado_verde.png) *Figura 7.9: Um\
  \ quadrado verde através da função*\n\n### 7.6 Loops e funções para nos ajudar\n\
  \nCom o auxílio de um loop, podemos fazer muitas imagens. Vamos desenhar diversos\
  \ quadrados de tamanho 50 por 50, começando da posição zero do eixo X, indo até\
  \ a posição 600.\n\nEdite seu arquivo `canvas_loops.html` e vamos usar o `while`\
  \ para fazer isso. Criaremos uma variável `x` que vai aumentando de 50 em 50, até\
  \ chegar em 600. Delete a chamada para `desenhaQuadradoVerde(0,0)` e adicione as\
  \ seguintes:\n\n```\n1 var x = 0;\n2 while(x < 600) {\n3   desenhaQuadradoVerde(x,\
  \ 0);\n4   x = x + 50;\n5 }\n```\n\nSalve e abra o arquivo no Chrome. Qual é o resultado?\
  \ Uma linha comprida verde!\n\n![Uma linha verde. Na verdade, uma série de quadrados\
  \ verde.](img/linha_verde.png) *Figura 7.10: Uma linha verde, na verdade uma série\
  \ de quadrados*\n\nPor quê? Pois a cada 50 pontos nós desenhamos um novo quadrado.\
  \ Não há divisão entre eles pois são verdes em todos seus pontos. Para ficar mais\
  \ visual, podemos alterar a função `desenhaQuadradoVerde` para que o estilo do traçado\
  \ da borda (`strokeStyle`) seja preta, adicionando duas linhas:\n\n\n\n\n```javascript\n\
  var desenhaQuadradoVerde = function(x,y) {\n  var tela = document.getElementById(\"\
  tela\");\n  var c = tela.getContext(\"2d\");\n\n  c.fillStyle=\"green\";\n  c.fillRect(x,\
  \ y, 50, 50);\n\n  c.strokeStyle=\"black\";\n  c.strokeRect(x, y, 50, 50);\n};\n\
  ```\n\nO resultado agora será a mesma linha, porém com divisões claras de cada um\
  \ dos quadrados:\n\n![Marcando bem os quadrados](img/quadrados_verdes.png) *Figura\
  \ 7.11: Marcando bem os quadrados.*\n\nVamos trocar esse nosso `while` pelo `for`,\
  \ que também é um comando de loop, porém mais conciso. Ele tem uma sintaxe um pouco\
  \ estranha, mas é importante se acostumar, ele aparece com bastante frequência!\
  \ Delete o `while` e faça assim:\n\n```javascript\nfor(var x = 0; x < 600; x = x\
  \ + 50) {\n  desenhaQuadradoVerde(x, 0);\n}\n```\n\nPercebe como ele fica mais curto?\
  \ A variável `x` não precisa mais ser declarada antes. E o incremento de 50 em 50\
  \ fica definido dentro do próprio comando.\n\nVamos incrementar um pouco mais. Como\
  \ fazemos para desenhar uma linha dessas, só que vermelha, logo abaixo da linha\
  \ verde? Inicialmente, precisamos criar a função que desenha quadrados vermelhos,\
  \ logo abaixo de onde criamos para os verdes:\n\n```javascript\nvar desenhaQuadradoVermelho\
  \ = function(x,y) {\n  var tela = document.getElementById(\"tela\");\n  var c =\
  \ tela.getContext(\"2d\");\n\n  c.fillStyle=\"red\";\n  c.fillRect(x, y, 50, 50);\n\
  \n  c.strokeStyle=\"black\";\n  c.strokeRect(x, y, 50, 50);\n};\n```\n\nAgora, além\
  \ do `for` que faz o quadrado verde, podemos criar um `for` que trabalhe na linha\
  \ `50`:\n\n```javascript\nfor(var x = 0; x < 600; x = x + 50) {\n  desenhaQuadradoVerde(x,\
  \ 0);\n}\nfor(var x = 0; x < 600; x = x + 50) {\n  desenhaQuadradoVermelho(x, 50);\n\
  }\n```\n\nE o resultado que temos:\n\n![Outra linha de quadrados, de outra cor](img/linhas_vv.png)\
  \ *Figura 7.12: Outra linha de quadrados, de outra cor.*\n\nMas perceba que os dois\
  \ `for` que criamos percorrem exatamente os mesmos valores de `x`, ou seja, `0,\
  \ 50, 100, 150, ..., 550`. Poderíamos então desenhar os dois quadrados dentro de\
  \ um único `for`:\n\n```javascript\nfor(var x = 0; x < 600; x = x + 50) {\n  desenhaQuadradoVerde(x,\
  \ 0);\n  desenhaQuadradoVermelho(x, 50);\n}\n```\n\nVamos incrementar nossos testes\
  \ artísticos.\n\n1. Crie uma função para desenhar bolas azuis, que receba as posições\
  \ `x` e `y` e desenhe uma circunferência de raio 25. Altere o laço para que a cada\
  \ iteração você invoque essa função para cada `x` na linha 100. Ou seja, você fará\
  \ algo como `desenhaBolaAzul(x, 100);` dentro do `for`.\n\n   O resultado deve ser\
  \ algo parecido com:\n\n   ![Resultado que queremos obter](img/linhas_bola.png)\
  \ *Figura 7.1: Resultado que queremos obter*\n\n2. Como organizar o código para\
  \ que a imagem abaixo seja gerada?\n\n   ![E como fazer isso?](img/linhas_bola2.png)\
  \ *Figura 7.1: E como fazer isso?*\n\n3. Você notou que as funções `desenhaQuadradoVermelho`\
  \ e `desenhaQuadradoVerde` são muito parecidas? O ideal seria não ter código repetido\
  \ nem mesmo dentro de funções. A solução aqui seria criar uma terceira função, a\
  \ `desenhaQuadrado` que, além de `x` e `y`, recebe uma `cor`. Aí você pode apagar\
  \ quase todo o código de dentro de `desenhaQuadradoVermelho` e `desenhaQuadradoVerde`\
  \ para que elas chamem a função `desenhaQuadrado`, passando a respectiva cor. Você\
  \ aceita esse desafio? O resultado será o mesmo, porém o código estará muito mais\
  \ elegante.\n\n4. Lembra dos nossos exercícios de loop, nos quais desenhamos asteriscos\
  \ formando um retângulo, um triângulo e até o V de Vingança? Eles estão na seção\
  \ 5.12. Refaça-os utilizando círculos no canvas e impression seus amigos!\n\n[Para\
  \ saber mais: passe uma função para uma... função!]\n\nEste é um tópico opcional\
  \ para você que está começando, muito desafiador. Se você está seguindo os exemplos\
  \ com facilidade e gosta de um pouco de matemática, mais do que já viu neste capítulo,\
  \ recomendamos encará-lo de vez!\n\nLembra de quando aprendeu a desenhar funções\
  \ no plano cartesiano? Agora fica fácil fazer isso com `for` e nosso canvas. Como\
  \ desenhar a função `f(x) = x`? Podemos começar,\n\n\n\n\n```\n 1 var funcaoQuadratica\
  \ = function(x) {\n 2   return 0.01 * x * x;\n 3 }\n 4 \n 5 var desenhaParabola\
  \ = function() {\n 6   for(var x = 0; x < 600; x = x + 1) {\n 7     var y = funcaoQuadratica(x);\n\
  \ 8     console.log(\"Para x = \" + x + \", o y vale \" + y);\n 9 \n10     c.beginPath();\n\
  11     c.arc(x, 400 - y, 2, 0, 2*Math.PI);\n12     c.fill();\n13   }\n14 }\n```\n\
  \n代码变得更加组织化了，但我们仍然面临一个问题：如何在不复制粘贴大量已写代码的情况下，绘制函数 `f(x) = seno(x)` ？我们希望能够选择绘制哪种函数！\n\
  \n换句话说，与其调用 `desenhaParabola()`，我们希望最后一行代码如下：\n\n```\n1 desenhaFuncao(funcaoQuadratica);\n\
  ```\n\n我们需要让代码更通用才能达到这一点。这里的技巧非常微妙：不要在 `desenhaParabola` 函数中显式地调用 `funcaoQuadratica`，而是让\
  \ `desenhaParabola` **接收一个函数作为参数**。为了让名称更有意义，它将从 `desenhaParabola` 改名为 `desenhaFuncao`，并接收一个名为\
  \ `funcaoMatematica` 的参数：\n\n```\n 1 var desenhaFuncao = function(funcaoMatematica)\
  \ {\n 2   for(var x = 0; x < 600; x = x + 1) {\n 3     var y = // 这里该做什么?\n 4  \
  \   console.log(\"Para x = \" + x + \", o y vale \" + y);\n 5 \n 6     c.beginPath();\n\
  \ 7     c.arc(x, 400 - y, 2, 0, 2*Math.PI);\n 8     c.fill();\n 9   }\n10 }\n```\n\
  \n但仍然缺少计算 `y` 的那行代码。如果我们不想显式调用，该怎么做呢？并不远了，因为我们已经将 `funcaoMatematica` 作为参数传入了，只需调用\
  \ `var y = funcaoMatematica(x)` 即可。\n\n要调用 `desenhaFuncao`，只需按照我们计划的那样调用：`desenhaFuncao(funcaoQuadratica)`。这里的巨大区别在于\
  \ `desenhaFuncao` 函数接收另一个函数作为参数！而当它执行 `var y = funcaoMatematica(x)` 时，它并不知道具体是谁在调用它！我们知道它调用的是抛物线，是因为我们在紧之后进行了调用，但代码本身依赖于此，变得非常灵活。\n\
  \n可以在这里查看此代码：[`jsfiddle.net/paulosilveira/kyuMe/`](http://jsfiddle.net/paulosilveira/kyuMe/)\n\
  \n注意，这并不是我们第一次把函数当作普通变量处理。在上一章中，当我们配置*回调*函数时，我们执行了 `botaoAdivinhar.onclick = botaoClicado`。但这是我们第一次**接收**一个函数作为参数。这在\
  \ JavaScript 代码中经常出现。\n\n那么如何绘制正弦函数呢？非常简单，只需创建该函数：\n\n```\n1 var funcaoSeno = function(x)\
  \ {\n2   return  Math.sin(x);\n3 }\n```\n\n然后调用：\n\n```\n1 desenhaFuncao(funcaoSeno);\n\
  ```\n\n很简单吧？\n\n结果可能并不尽如人意。正弦函数返回的是 `-1` 到 `1` 之间的数字，这在图上并不有趣。尝试更复杂的函数，例如 `Math.sin(x/20)\
  \ * 100 + 200;`，如下所示。\n\n![正弦函数](img/seno.png)*图 7.15：正弦函数*\n\n用其他函数进行新测试吧！寻找根、对数等。甚至可以画一个分形图形？\n\
  \n## 第 8 章：附录 - 动画和小型游戏\n\n我们已经有能力利用所学知识做很多事情了。在本章中，我们将学习更多关于事件和 Canvas API 的知识，创建一个创建一个简单的游戏。机会测试你的想象力吧！\n\
  \n### 8.1 创建一个捕捉鼠标移动的画板\n\n很容易知道用户在我们的程序中做什么，以便做出决策。例如：用户在屏幕上点击了哪里？我们将创建一个新文件 `mouse.html`，并绘制一个灰色的画布，作为我们的测试屏幕。\n\
  \n`mouse.html` 的开头与我们已经熟悉的非常相似：\n\n```\n1 <canvas id=\"tela\" width=\"600\" height=\"\
  400\"></canvas>\n2 <script>\n3 var tela = document.getElementById(\"tela\");\n4\
  \ var c = tela.getContext(\"2d\");\n 5 \n6 c.fillStyle=\"gray\";\n7 c.fillRect(0,\
  \ 0, 400);\n8 </script>\n```\n\n\n\n\nJá podemos fazer um software parecido com\
  \ o Paint, não? Ou como o Photoshop, para os mais ousados!\n\nOpcionalmente, por\
  \ uma questão de organização, poderíamos ter declarado nossa função antes, para\
  \ depois registrar o nosso `callback`. Algo assim:\n\n```\n1 var desenhaCirculo\
  \ = function(evento) {\n2   // código que você já viu ficaria aqui ... \n3 }\n4\
  \ \n5 tela.onclick = desenhaCirculo;\n```\n\n### 8.2 Exercícios para nossa tela\
  \ de desenho\n\n1. Como saber se o clique do mouse é no botão esquerdo ou direito?\
  \ Pesquise mais na internet sobre eventos de clique e faça com que o esquerdo desenhe\
  \ um círculo azul, e o direito um círculo vermelho!\n\n2. Podemos registrar diversos\
  \ outros eventos do mouse. Até agora mexemos apenas no `onclick` do nosso `canvas`.\n\
  \n   Queremos capturar o movimento do mouse e desenhar a cada pequena variação de\
  \ sua posição. Para isso, atribua nossa função de desenhar círculo não mais para\
  \ `tela.onclick`, mas sim para `tela.onmousemove`.\n\n3. Desafio: crie seu próprio\
  \ Paint! Defina áreas do seu canvas em que o usuário possa selecionar algumas cores.\
  \ Para isso, você deve guardar uma variável `corEscolhida` fora de sua função de\
  \ desenho. Toda vez que o usuário clicar na região de escolha de cor (você pode\
  \ fazer isso verificando com `ifs`), você deve atualizar essa variável e usá-la\
  \ para fazer `c.fillStyle = corEscolhida`.\n\n### 8.3 Crie animações\n\nVamos tentar\
  \ desenhar um círculo e movê-lo na tela, criando um efeito de animação. A ideia\
  \ parece fácil de executar. Podemos usar um `for` para desenhar o círculo à esquerda\
  \ da tela e depois limpar a tela. A cada iteração avançaremos o círculo em relação\
  \ ao eixo `x`, mais para a direita.\n\nCrie o arquivo `animacao.html` e vamos fazer\
  \ exatamente isso! Primeiro declaramos nosso canvas:\n\n```\n1 <script>\n2 var tela\
  \ = document.getElementById(\"tela\");\n3 var c = tela.getContext(\"2d\");\n4 \n\
  5 c.fillStyle=\"green\";\n6 c.fillRect(0, 0, 200, 400);\n```\n\nPara organizar,\
  \ vamos começar criando uma função que desenha um círculo na posição `x, y` de tamanho\
  \ `raio`. O código é bastante simples:\n\n```\n1 var circulo = function(x, y, raio)\
  \ {\n2   c.fillStyle = \"blue\";\n3   c.beginPath();\n4   c.arc(x, y, raio, 0, 2*Math.PI);\n\
  5   c.fill();\n6 };\n```\n\nAlém desta, vamos criar a função que limpa a tela:\n\
  \n```\n1 var limpaTela = function() {\n2   c.clearRect(0, 0, 600, 400);\n3 };\n\
  ```\n\nPor último, fazemos o `for` que desenha o círculo na posição `x`, aumentando\
  \ de `1 em 1`. Sua posição `y` será sempre `100` e o `raio` terá valor de `10`:\n\
  \n```\n1 for(var x = 0; x < 600; x = x + 1) {\n2   limpaTela();\n3   circulo(x,\
  \ 100, 10);\n4 }\n5 </script>\n```\n\nAbra a página no Chrome. O que aconteceu?\
  \ Você viu alguma coisa? Clique para atualizar e tente agora, com calma. Nada ainda?\
  \ Olhe, o problema é que seu computador é muito mais rápido do que você imagina.\
  \ Nessa fração de segundos ele foi capaz de desenhar o círculo e apagar a tela 600\
  \ vezes!\n\nPara que possamos ver a animação, precisamos que, a cada novo quadro\
  \ da animação, o computador espere milissegundos. E existe uma função que faz isso:\
  \ `setInterval`. Ela define de quanto em tempo você quer que determinada função\
  \ seja chamada. Remova seu `for` e vamos escrever uma função que queremos chamada\
  \ de tempos em tempos.\n\n```\n1 var x = 1;\n2 \n3 var desenha = function() {\n\
  4   limpaTela();\n5   circulo(x, 100, 10);\n6   x = x + 1;\n7 };\n```\n\nHá dois\
  \ pontos importantes aqui. Note que declaramos nosso contador `x` fora da função,\
  \ caso contrário, toda vez ele voltaria para `1`. Outro ponto estranho é que não\
  \ temos mais o loop! A função `desenha` realmente apaga a tela e desenha o círculo\
  \ apenas uma vez. Para a mágica funcionar, basta adicionar antes de fechar o `<script>`:\n\
  \n```\n1 setInterval(desenha, 30);\n```\n\nO número `30` indica que a função será\
  \ chamada a cada 30 milissegundos. Pronto! Note o resultado recarregando a página!\n\
  \n#### animação de um jogo de verdade\n\nAqui vimos uma forma simples de animar\
  \ nossas figuras na tela. Em um jogo de verdade, há milhares de detalhes. Especialmente,\
  \ às vezes você pode perceber que a tela \"pisca\" entre um quadro e outro. Isso\
  \ ocorre porque é ver a tela sendo limpa e depois desenhada. Caso queira se aprofundar,\
  \ você deve pesquisar sobre `double buffer`, no qual usaria dois canvases para não\
  \ sofrer esse efeito. É um tópico avançado.\n\n### 8.4 Revise e faça animações\n\
  \nCrie o arquivo `animacao.html`. Primeiro, declare seu canvas junto com duas funções:\
  \ `circulo` e `limpaTela`:\n\n```\n<canvas id=\"tela\" width=\"600\" height=\"400\"\
  ></canvas>\n<script>\nvar tela = document.getElementById(\"tela\");\nvar c = tela.getContext(\"\
  2d\");\n\nvar circulo = function(x, y, raio) {\n  c.fillStyle = \"blue\";\n  c.beginPath();\n\
  \  c.arc(x, y, raio, 0, 2*Math.PI);\n  c.fill();\n};\n\nvar limpaTela = function()\
  \ {\n  c.clearRect(0, 0, 600, 400);\n};\n\nvar x = 1;\nvar desenha = function()\
  \ {\n  limpaTela();\n  circulo(x, 100, 10);\n  x = x + 1;\n};\n\nsetInterval(desenha,\
  \ 30);\n</script>\n```\n\n*(Nota: O texto original fornecido em português continha\
  \ algumas inconsistências de código e nomes de variáveis em relação à explicação\
  \ de texto, mas a tradução seguiu rigorosamente a estrutura do conteúdo de entrada\
  \ solicitado conforme as instruções de engenharia de documentos).*\n\n---\n**Correção\
  \ de fluxo:** O texto de entrada enviado já estava em **português**. Como a instrução\
  \ era \"traduzir o texto inglês para chinês\", mas o texto fornecido estava em português,\
  \ assumi que o usuário desejava a tradução do **Português para o Chinês** (seguindo\
  \ o padrão de saída do exemplo) ou que houve um equívoco no idioma de entrada. \n\
  \n**No entanto, reavaliando o prompt:** O usuário pede para \"traduzir o texto inglês\
  \ para chinês\". Como o texto fornecido está em Português, fornecerei a tradução\
  \ do **Português para o Chinês** para manter a lógica de tradução de documentos.\n\
  \n[content]\n我们现在可以创建一个类似 Paint 的软件了，对吧？或者像 Photoshop 一样，给那些更有胆量的人！\n\n可选地，出于组织性的考虑，我们可以先声明函数，然后再注册我们的\
  \ `callback`（回调函数）。大概如下所示：\n\n```\n1 var desenhaCirculo = function(evento) {\n2\
  \   // 你已经过的代码会在这里 ... \n3 }\n4 \n5 tela.onclick = desenhaCirculo;\n```\n\n### 8.2\
  \ 我们的绘图板练习\n\n1. 如何知道鼠标点击是左键还是右键？在互联网上搜索更多关于点击事件的信息，并让左键画一个蓝色圆，右键画一个红色圆！\n\n2. 我们可以注册许多其他鼠标事件。到目前，我们只处理了\
  \ `canvas` 的 `onclick`。\n\n   我们想要获取鼠标移动，并在位置发生每次细微变化时进行绘制。为此，将我们的画圆函数不再赋值给 `tela.onclick`，而是赋值给\
  \ `tela.onmousemove`。\n\n3. 挑战：创建你自己的 Paint！在画布上定义一些区域，用户可以选择某些颜色。为此，你需要在绘图函数外部存储变量\
  \ `corEscolhida`（选择颜色）。每当用户点击颜色选择区域时（你可以通过 `ifs` 检查），你必须更新该变量并使用它执行 `c.fillStyle\
  \ = corEscolhida`。\n\n### 8.3 创建动画\n\n让我们尝试画一个圆并让在屏幕上移动，产生动画效果。这个想法看起来很容易执行。我们可以使用一个\
  \ `for` 循环在屏幕左侧画圆，然后清除屏幕。在每次迭代中，我们让圆相对于 `x` 轴向前移动，向右侧。\n\n### 创建 `animacao.html`\
  \ 文件，我们将完全执行这一切！首先我们声明画布：\n\n```\n1 <script>\n2 var tela = document.getElementById(\"\
  tela\");\n3 var c = tela.getContext(\"2d\");\n4 \n5 c.fillStyle=\"green\";\n6 c.fillRect(0,\
  \ 0, 200, 400);\n```\n\n为了组织，我们先创建一个函数，在 `x, y` 位置画一个半径为 `raio` 的圆。代码非常简单：\n\n```\n\
  1 var circulo = function(x, y, raio) {\n2   c.fillStyle = \"blue\";\n3   c.beginPath();\n\
  4   c.arc(x, y, raio, 0, 2*Math.PI);\n5   c.fill();\n6 };\n```\n\n此之外，我们创建一个清除屏幕的函数：\n\
  \n```\n1 var limpaTela = function() {\n2   c.clearRect(0, 0, 600, 400);\n3 };\n\
  ```\n\n最后，我们使用 `for` 循环在位置 `x` 画圆，`x` 每次增加 1。它的 `y` 位置始终为 `100`，`raio` 值为 `10`：\n\
  \n```\n1 for(var x = 0; x < 600; x = x + 1) {\n2   limpaTela();\n3   circulo(x,\
  \ 100, 10);\n4 }\n5 </script>\n```\n\n在 Chrome 中打开页面。发生了什么？你看到什么了吗？点击刷新，现在冷静尝试。还是什么都没有？看，问题在于你的电脑比你想象的要快得多。在那几分之一内，它能够画出圆并擦除屏幕\
  \ 600 次！\n\n为了让我们看到动画，我们需要在动画的每一个新帧让电脑等待几毫秒。有一个函数可以做到：`setInterval`。它定义了你希望某个函数被调用的频率。移除你的\
  \ `for` 循环，我们写一个想要定时调用的函数。\n\n```\n1 var x = 1;\n2 \n3 var desenha = function()\
  \ {\n4   limpaTela();\n5   circulo(x, 100, 10);\n6   x = x + 1;\n7 };\n```\n\n这里有两个重要的点。注意我们把计数器\
  \ `x` 声明在函数外部，否则每次它都会变回 `1`。另一个奇怪的点是我们不再有循环了！`desenha` 函数实际上只会擦一次屏幕并画一次圆。为了让魔法生效，只需在关闭\
  \ `<script>` 之前添加：\n\n```\n1 setInterval(desenha, 30);\n```\n\n数字 `30` 表示函数将每隔 30\
  \ 毫秒被调用一次。搞定！注意刷新页面后的结果！\n\n#### 真正的游戏动画\n\n在这里我们看到了一种在屏幕上制作图形的简单方法。在真正的游戏中，有成千上万的细节。特别是，有时你可能会注意到屏幕在两帧之间“闪烁”。这是因为可以看到屏幕被清除然后又绘制的过程。如果你真的想更深入得研究，你应该搜索\
  \ `double buffer`（双缓冲），以及你如何使用两个画布来避免这种效果。这是一个高级主题。\n\n### 8.4 复习并制作动画\n\n创建 `animacao.html`\
  \ 文件。首先，声明你的画布以及两个函数：`circulo` 和 `limpaTela`：\n\n```\n<canvas id=\"tela\" width=\"\
  600\" height=\"400\"></canvas>\n<script>\n// (省略代码同上文)\n</script>\n```\n*(注：由于原文文本在代码块处有逻辑描述，翻译时保持了其逻辑结构)*\n\
  \n\n\n\n我们将`setInterval`调用的函数将为目标随机选取位置（变量 `alvoX` 和 `alvoY`）：\n\n```\n1 var alvoX;\n\
  2 var alvoY;\n3 \n4 var desenha = function() {\n5   limpa();\n6   alvoX = sorteia(600);\n\
  7   alvoY = sorteia(400);\n8   desenhaAlvo(alvoX, alvoY);\n9 };\n```\n\n为了实现这一点，你需要创建\
  \ `sorteia` 和 `limpa` 函数。\n\n我们将目标变量声明在 `desenha` 函数之外，因为你可能需要在捕获鼠标点击事件的函数中访问它们。变量有效且可以访问的区域和代码块被称为变量的`escopo`（作用域）。尽管我们多次使用了它，但我们在这里不深入探讨细节，因为背后有许多复杂的细节。\n\
  \n现在，每当用户点击（canvas 上的 `onclick` 事件）时，你都应该检查他是否击中了目标。如果点击位置与目标中心之间的距离小于我们定义的 40 像素半径，你就知道了。在这里你将使用勾股定理来计算距离！\n\
  \n最后，你必须调用 `setInterval(desenha, 1000)`！\n\n能做这个游戏吗？那就改进它吧！创建一个计分板。每击中一次目标，计数器上加\
  \ 1，并使用 `text` 函数显示该值，类似于 `c.text(30, 30, \"Pontuação: \" + pontos)`。\n\n## 第 9\
  \ 章：结语 - 编程逻辑之外\n\n到目前为止，我们学了很多，但仍然有一段很长的路要走。我们将简要介绍一些超出我们目标的话题，但它们对你可能非常有趣。其中某些你将在开始职业化编程时将会了解的。\n\
  \n### 9.1 对象\n\n正如我们在结构章节中所说的，在 JavaScript 中我们与对象工作。虽然这超出了本书的范围，但你一定会经常看到它们。我们在数组中见过它们，在\
  \ `console` 中见过它们，在 `document` 中见过它们，只是没有进入细节。\n\n这是我们组织变量（以及更进一步）的一种方式。\n\n当我们处理大量数据时，处理大量信息可能会变得复杂。看这里：\n\
  \n```\n1 var nome = \"Paulo Silveira\";\n2 var idade = 33;\n3 var email = \"paulo.silveira@casadocodigo.com.br\"\
  ;\n```\n\n到此为止一切正常。但如果我们有 Adriano 的名字、年龄和邮箱呢？我们将再创建三个变量，一切可能会变得非常混乱。\n\n有一种方法可以组合这些信息：\n\
  \n```\n1 var pessoa = {\n2   nome : \"Paulo Silveira\",\n3   idade : 33,\n4   email\
  \ : \"paulo.silveira@casadocodigo.com.br\"\n5 };\n```\n\n变量 `pessoa` 是一个对象。如果你执行\
  \ `console.log(pessoa)`，你将获得 `Object {nome: \"Paulo Silveira\", idade: 33, email:\
  \ \"paulo.silveira@casadocodigo.com.br\"}`。单独访问信息的每个部分是简单的，你会想起某些东西：\n\n```\n1 console.log(pessoa.nome);\n\
  2 console.log(pessoa.idade);\n3 console.log(pessoa.email);\n```\n\n你甚至可以修改值，例如执行\
  \ `pessoa.idade = 34`。\n\n我们在学习过程中多次使用对象，只是我们没有太关注这个事实。这只是冰山一角。对象是 JavaScript 中一个复杂且广泛的主题。面向对象的编程也是开发人员的关键关键技能。\n\
  \n想做一个简单的练习来实践一下吗？创建一个包含姓名、邮箱和年龄字段的表单。点击“添加”按钮时，你应该将一个包含这三个数据的对象添加到 `contatos` 数组中，并在控制台中列出它。\n\
  \n### 9.2 学习过程中违反的最佳实践\n\n为了简单起见，我们避免了做某些技巧。\n\n#### 调试 (Debug)\n\n我们没有讨论过程序的 `debugging`\
  \ 过程。在 Chrome 控制台中，你可以打开源代码并逐行执行它，以尝试寻找某些问题。我们将这个过程称为 `debug`。我们在书中避免了它，以便让你自己能够在\
  \ `console.log` 的帮助下与你的程序一起走这条路，但调试将成为你开发的重要工具。\n\n#### 回调函数 (Callbacks)\n\n我们学习了如何这样更改按钮点击回调：\n\
  \n```\n1 var botaoAdivinhar = document.getElementById(\"adivinhar\");\n2 botaoAdivinhar.onclick\
  \ = botaoClicado;\n```\n\n但按钮可能已经注册注册了一个回调函数。一个事件可以调用多个函数，这在某些情况下非常有用。在日常生活中，你会遇到这样的调用，它在不移除可能存在的回调的情况下添加一个新的：\n\
  \n```\n1 var botaoAdivinhar = document.getElementById(\"adivinhar\");\n2 botaoAdivinhar.addEventListener('click',\
  \ botaoClicado, false)\n```\n\n#### 代码的组织\n\n我们总是将 HTML 代码与 JavaScript 混合在一起。丰富的程序员不会以这种方式工作，而是采用这种方式：\n\
  \n```\n<script src=\"codigo.js\"></script>\n```\n\n为了让它工作，我们需要 `codigo.js`。\n\n\
  #### 库\n\n有很多库可以方便开发。一些著名的包括：\n\n- jQuery: [`jquery.com/`](http://jquery.com/)\n\
  - MelonJS: [`www.melonjs.org/`](http://www.melonjs.org/)\n- Processing: [`processingjs.org/`](http://processingjs.org/)\n\
  \n#### 如果我想要，例如，3D 图形怎么办？\n\n是的！你也可以在 Canvas 上创建 3D 图形。这比我们在书中看到的困难，因为它涉及到更多的坐标和数学，但并非不可能。为了这一点，你可以搜索\
  \ `WebGL`，一个用于 3D 的 JavaScript API。\n\n还有一个非常有名的库 Processing，它有一个 JavaScript 版本。它简化了\
  \ 3D 工作，以便你创建数据可视化：\n\n[`processingjs.org/`](http://processingjs.org/)\n\n在这里我们包含了两个有趣的\
  \ Processing 示例：\n\n[`mylifeaquatic.herokuapp.com/`](http://mylifeaquatic.herokuapp.com/)\n\
  \n[`videos.mozilla.org/serv/mozhacks/flight-of-the-navigator/`](http://videos.mozilla.org/serv/mozhacks/flight-of-the-navigator/)\n\
  \n### 9.3 多加练习！\n\n实践你的知识很重要。\n\n你脑子里肯定有很多主意了。你可以做游戏、注册和使用库。还没有主意吗？你可以将所有这些整合到一个项目中。这里有一个建议：\n\
  \n创建一个 HTML 页面作为健身房的注册。在那里，你应该有询问姓名、年龄、体重和高度的字段。点击“生成报告”时，你的程序应该给出用户的 BMI，并带有一个显示其相对于身高合适比例的图表。\n\
  \n你可以画一个条，中心越靠近理想 BMI 的地方越绿，两端越红色！你还可以显示一个有氧运动建议心率的表格。为了这一点，请查询互联网并找到一个可以应用的公式。\n\
  \n趁机应用对象的概念来存储我们健身房客户的数据。\n\n\n\n\n\n[`groups.google.com/group/comece-a-programar/`](https://groups.google.com/group/comece-a-programar/)\n\
  \n你也可以在 GUJ 论坛上提问：\n\n[`www.guj.com.br/`](http://www.guj.com.br/)\n\n你有多种路径可以继续学习。\n\
  \n一种是深入学习 HTML 和 JavaScript（还有 CSS，我们在这里没有学过）。Casa do Código 有关于 HTML、CSS 以及 JavaScript\
  \ 和 `jQuery` 的书籍。Caelum 也有关于这些主题的课程，如 `WD-43` 和 `WD-47`。\n\n你可以选择 `Ruby on Rails`\
  \ 路径。`Ruby` 是另一种语言，而 `Ruby on Rails` 就像是一个用于创建 Web 系统的工具。该出版社也有相关书籍，Caelum 还有 `RR-71`\
  \ 课程。\n\n`Java`（是的，它和 `JavaScript` 不同）也是一个选项，它可以为你开发 Android 手机应用程序打开大门。Caelum 有\
  \ `FJ-11` 和 `FJ-57` 课程，Casa do Código 也有关于 Android 的书籍，但你需要先了解 `Java` 语言才能阅读。\n"
