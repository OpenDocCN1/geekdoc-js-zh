  \ `numero` 出现在调用的“前面”。这在 JavaScript 中非常常见，而且确实有区别，我们将在后面的章节中理解。\n\n6. 现在是一个挑战。今天汽油价\
  \ `precoDaGasolina` 为 R$2.90，酒精价 `precoDoAlcool` 为 R$2.40。酒精和汽油的每公里价格 `precoPorKilometro`\
  \ 分别？提示：将单价除以消耗即可得到每公里价格。哪一个更小？\n\n### 2.7 别再写这么多 BR 了！\n\n我们看到使用变量已经从两个方面提供了帮助：我们不再需要复制粘贴那么多信息，而且某些片段变得更具可读性。变量可以进一步发挥，减少代码行的重复。\n\
  \n注意！在本节中，你不需要修改代码，只需跟踪了解可以这样做。你将在接随后的复习中完成这里所有的新内容。\n\n看看我们之前那个显示每个人年龄的代码：\n\n\
  ```\n1 var ano = 2012;\n2 document.write(\"Eu nasci em : \" + (ano - 25) + \"<br>\"\
  );\n3 document.write(\"Adriano nasceu em : \" + (ano - 26) + \"<br>\");\n4 document.write(\"\
  Paulo nasceu em : \" + (ano - 32) + \"<br>\");\n```\n\n我们可以稍微组织一下，将 `<br>` 移到另一个\
  \ `document.write` 调用中。\n\n```\n1 var ano = 2012;\n2 document.write(\"Eu nasci em\
  \ : \" + (ano - 25));\n3 document.write(\"<br>\");\n4 document.write(\"Adriano nasceu\
  \ em : \" + (ano - 26));\n5 document.write(\"Paulo nasceu em : \" + (ano - 32));\n\
  ```\n\n\n\n搞定。`pulaLinha` 现在指的是一个可以被调用的函数。**如何调用它？** 就像你之前调用 `alert` 一样。也就是说，**在它的名称后使用括号**：\n\
  \n```\n1 var ano = 2012;\n2 document.write(\"Eu nasci em : \" + (ano - 25));\n3\
  \ pulaLinha();\n4 document.write(\"Adriano nasceu em : \" + (ano - 26));\n5 pulaLinha();\n\
  6 document.write(\"Paulo nasceu em : \" + (ano - 32));\n7 pulaLinha();\n```\n\n\
  每当出现 `pulaLinha();` 时，浏览器都会执行 `pulaLinha` 函数的代码。通过这样，我们开始避免重复代码。这仅仅是个开始，我们将更多地利用函数来简化代码。\n\
  \n### 2.9 传递信息和调用其他函数的函数\n\n让我们再次关注文本，在复习中我们将编写这里描述的代码。\n\n现在已经可以清楚地看到我们的获益了：我们可以通过只修改一个地方来改变程序的行为：即我们为\
  \ `pulaLinha` 创建的函数。但我们的代码仍然有些冗长，而且我们每次都得调用这个函数。\n\n当我们发现自己在不断重复操作时，始终可以考虑创建一个新函数。在这种情况下，很容易看出，每当我们用\
  \ `document.write` 向浏览器发送一个 `frase` 时，紧接着就会换行。我们可以把这些操作统一到一个地方吗？这可以通过创建另一个函数来实现，即一个既能显示句子又能添加\
  \ `<br>` 的函数。例如：\n\n```\n1 function mostra() {\n2   document.write(\"alguma frase<br>\"\
  );\n3 }\n```\n\n但这个函数并没有那么有用：它总是显示同一个句子。它不符合我们的需求，因为我们想要显示的句子取决于时机。不要绝望，确实有办法解决这个问题。当我们**声明**（创建）一个函数时，我们可以采取采取这种方式，使其能够接收到额外的内容，即某些对我们重要的信息。在显示某个句子的函数中，这个重要值是什么？就是我们要显示的\
  \ `frase`！我们通过在括号内声明来实现，如 `function(frase)`，然后像我们已经认识的变量一样正常地使用 `frase`：\n\n```\n\
  1 function mostra(frase) {\n2   document.write(frase + \"<br>\");\n3 }\n```\n\n\
  搞定。但 `mostra` 如何知道要把 `frase` 放入浏览器中呢？这将在调用函数时完成。与我们使用不带任何内容的括号调用的 `pulaLinha` 不同，调用\
  \ `mostra` 时会在括号内带入入 `frase`：\n\n```\n1 mostra(\"Usando funções para melhorar o\
  \ código\");\n```\n\n我们想要显示的这个字符串将被**传递**给我们创建的函数，在函数内部它将成为我们的变量 `frase`。传递给函数的变量通常被称为**参数**或**参数**。\n\
  \n![传递在括号之间的文本将进入函数 frase 变量](img/funcao-recebendo-parametro.png)*图 2.1: 传递在括号之间的文本将进入函数\
  \ frase 变量*\n\n我们可以稍微修改一下 `mostra` 函数，让它利用我们旧的 `pulaLinha`，而不是自己拼接 `<br>`：\n\n```\n\
  1 function mostra(frase) {\n2   document.write(frase);\n3   pulaLinha();\n4 }\n\
  ```\n\n就是这样：一个函数可以调用另一个函数。这种情况非常常见。这里的的好处是什么？现在我们的 `mostra` 也会跟随 `pulaLinha` 的变化。如果我们想以更视觉化的换行，无论是使用\
  \ `<br>`、`<hr>` 还是其他 HTML 功能，`mostra` 函数都能受益，甚至无需修改！\n\n### 2.10 复习代码：使用 mostra\
  \ 函数\n\n我们在这一节中做了很多工作。让我们复习一下你现在的文件是什么样的。整理一下，创建 `mostra_idades2.html` 文件。在开头，我们有函数的定义。从\
  \ `pulaLinha` 开始：\n\n```\n1 <script>\n2 \n3 function pulaLinha() {\n4   document.write(\"\
  <br>\");\n5 }\n```\n\n在下面是我们的第二个函数 `mostra`，它反过来使用了 `pulaLinha`。与上一个不同，它接收一个**参数**，即要在浏览器中显示的句子：\n\
  \n```\n1 function mostra(frase) {\n2   document.write(frase);\n3   pulaLinha();\n\
  4 }\n```\n\n记得将函数内部的代码始终向右移动，使用键盘上的 `TAB` 键。这就是代码**缩进**（英语 *to indent* 的新造词）。确保你的**缩进**正确对于便于阅读程序非常重要。\n\
  \n在声明两个函数后，我们将在代码中使用它们来打印每个参与者的年龄：\n\n```\n1 var ano = 2012;\n2 mostra(\"Eu nasci\
  \ em : \" + (ano - 25));\n3 mostra(\"Adriano nasceu em : \" + (ano - 26));\n4 mostra(\"\
  Paulo nasceu em : \" + (ano - 32));\n5 </script>\n```\n\n### 2.11 显示仅供程序员使用的秘密消息\n\
  \n`alert` 会在弹窗中抛出消息。过度使用它可能会耗尽用户的耐心。`document.write` 的侵入性较小，但你是否注意到消息是直接投到页面上的，甚至不需要每条新消息都点击\
  \ *OK*。\n\n即使将 `document.write` 放在函数中，我们通常也希望某些消息不给用户看，但又希望在开发期间看到它们，使其仅对你这个程序员可见。这对于发现错误（我们称之为\
  \ **bug**）、学习技巧和测试功能非常有用。我们将这些数据保存在 **logs** 中。在葡萄语中，经常使用 **logar** 这个新造词。要用 JavaScript\
  \ 记录信息（log），可以使用 `console.log` 函数。测试一下：\n\n```\n1 <script>\n2 document.write(\"\
  olá mundo!\");\n3 document.write(\"esse é meu segundo programa\");\n4 console.log(\"\
  esta mensagem aparece apenas no log\");\n5 </script>\n```\n\n结果是什么？\n\n传递给 `console.log`\
  \ 的消息并没有出现！当我们使用该函数时，浏览器会将所有消息存储在一个特殊的地方，普通用户看不到。为了查看结果，我们需要启用控制台显示，正如我们在上一节中检查错误时所的那样。\n\
  \n在 Chrome 中，你可以通过点击小工具菜单图标来实现，选择*工具*（*Tools*，如果是英语）然后选择 *JavaScript 控制台*。这就是你之前检查代码错误时使用的同一个控制台。\n\
  \n在 Windows 和 Linux 上，可以使用快捷键 `CTRL+SHIFT+J` 打开此标签页（Mac 上为 *Command+Option+J*），如果选中了其他选项，请点击\
  \ Console。它确实非常重要，你经常会访问它。\n\n\n\n\n你可以以你认为最合适的方式组合这三个功能：`alert` 用于突出消息，`document.write`\
  \ 用于在页面内部添加信息，以及 `console.log` 用于仅向我们（程序员）显示数据。\n\n在学习过程中，我们还会看到其他帮助我们发现代码中问题的方法和技术。即移除\
  \ `bugs` 的方法，亦或是如何对我们的代码进行 `debugar`（调试）。\n\n### 2.12 了解更多：注释\n\n我们经常也想在代码中放入一段话，仅作为程序员的参考。在\
  \ JavaScript 中，我们可以使用 `//` 来实现这一点。`//` 之后的所有内容都将被浏览器忽略。请请看：\n\n```\n1 // 这个函数在浏览器中显示一句话并换行\n\
  2 function mostra(frase) {\n3   document.write(frase);\n4   pulaLinha();\n5 }\n\
  6 \n7 // 现在我们要在浏览器中放入我的出生年份：\n8 var ano = 2012;\n9 mostra(\"我出生于：\" + (ano - 25));\n\
  ```\n\n注释可以帮助你更好地组织代码。无论如何，拥有一个编写良好、具有表达性且意义的变量名的代码，始终比使用大量的注释更为重要。\n\n还有在 `/*`\
  \ 和 `*/` 之间放置注释的选项。这样一来，这两个标识符之间的所有内容都将被浏览器忽略，即使其中包含换行符。\n\n### 2.13 与你的朋友分享你的代码！\n\
  \n到目前为止，你都在自己的浏览器中运行程序。如果你想让朋友也能看到你正在做什么呢？如果你已经对互联网有所了解，可以将你的 `.html` 文件放置在 Web\
  \ 服务器上。但有一种非常简单的方法可以分享你的练习并展示你新学到的编程技能。\n\n有些网站允许你在表单内编写 HTML 和 JavaScript 代码，并快速查看结果。在网站上编写而不是在自己的电脑上编写有什么好处呢？答案是这些网站允许程序分享！在这里访问我们用于计算年龄的程序：\n\
  \n[`jsfiddle.net/55vSR/`](http://jsfiddle.net/55vSR/)\n\n这个网站将展示 4 个不同的空间：HTML、CSS、JavaScript\
  \ 和结果。我们感兴趣的是 JavaScript。由于这是一个特殊的页面，你不需要（也不应该）在该表单内使用 `script` 标签。你可以点击 `Run`（在顶部菜单）或按下\
  \ `CTRL+ENTER` 来运行代码。\n\n![通过 JSFiddle.net 网站共享的代码](img/jsfiddle.png) *图 2.3：通过\
  \ JSFiddle.net 网站共享的代码*\n\n你可以编辑这段代码并点击 `Save`。JSFiddle 会生成一个新地址，你可以与朋友和家人分享。这是向所有熟人展示你编程进步的一种有趣方式！由于浏览器加载\
  \ HTML 页面的方式，如果你使用 `console.log` 而不是 `document.write`，jsfiddle 的运行效果会更好。它甚至会提醒不要使用\
  \ `document.write`。\n\n你还可以创建一个账户，以便将所有的代码都组织在一起。\n\n在我们的讨论列表中分享你的代码和挑战吧！不要忘记参与，无论是提问还是展示你的成就：\n\
  \n[`groups.google.com/group/comece-a-programar/`](https://groups.google.com/group/comece-a-programar/)\n\
  \n还有其他替代方案，可能稍微复杂且更完整，例如 [`tinkerbin.com/`](http://tinkerbin.com/)、[`playground.html5rocks.com`](http://playground.html5rocks.com)\
  \ 和 [`codepen.io/`](http://codepen.io/)。\n\n## 第 3 章：通过解决日常生活中的问题来练习\n\n在上一章中，我们能够创建自己的变量，甚至是包含函数的特殊变量。但在我们知道什么是函数之前，其实已经处理过其他函数了。`document.write`\
  \ 和 `alert` 是每个浏览器为我们提供的许多函数中的两个。\n\n让我们多练习变量和函数的用法，并了解其他我们可以在浏览器中使用的函数。\n\n###\
  \ 3.1 你的体重如何？健康吗？\n\n身体质量指数，简称 IMC，是衡量一个人肥胖程度的指标。它可以作为判断一个人是否太胖或太瘦的第一种信号。IMC 公式非常简单：体重除以身高的平方。\n\
  \n我们能将其翻译成 JavaScript 吗？打开文本编辑器并创建一个新文件，将其命名为 `imc.html`。为了计算身高的平方，只需将该值乘以它，然后用它除以体重。\n\
  \n```\n1 var imc = peso / (altura * altura);\n```\n\n但是 `peso`（体重）和 `altura`（身高）变量在哪里定义的呢？还没有定义。你经常看到这样编写的示例代码，即是不完整的。如果你尝试运行这样的代码，JavaScript\
  \ 会抱怨 `altura` 和 `peso` 不存在。尝试一下。\n\n我们来给它们赋值并打印 `imc` 的结果：\n\n```\n1 var peso =\
  \ 75;\n2 var altura = 1.72;\n3 var imc = peso / (altura * altura);\n```\n\n*(注：原文此处开始出现了大量重复段落，已按要求逐行翻译)*\n\
  \n但是 `peso` 和 `altura` 变量在哪里定义的呢？还没有定义。你经常看到这样编写的示例代码，即是不完整的。如果你尝试运行这样的代码，JavaScript\
  \ 会抱怨 `altura` 和 `peso` 不存在。尝试一下。\n\n我们来给它们赋值并打印 `imc` 的结果：\n\n```\n1 var peso =\
  \ 75;\n2 var altura = 1.72;\n3 var imc = peso / (altura * altura);\n```\n\n*(重复段落翻译略)*\n\
  \n### 3.2 使用函数计算 IMC\n\n如果我们现在需要计算朋友的 IMC 呢？我们可以创建另一个变量 `imcPrimo` 来存储该结果。为了这一点，我们需要有\
  \ `pesoPrimo` 和 `alturaPrimo`。我们的代码将如下：\n\n```\n1 var pesoPrimo = 83;\n2 var alturaPrimo\
  \ = 1.76;\n3 var imcPrimo = pesoPrimo / (alturaPrimo * alturaPrimo);\n4 mostra(\"\
  我朋友的 IMC 是：\" + imcPrimo);\n```\n\n\n\n\n相反，我们可以让 `calculaIMC` 不显示 BMI，而是顾如其名，只计算它的值并将其返回给调用者。修改你的函数，删除\
  \ `mostra` 那行并添加一个 `return`：\n\n```\n1 function calculaIMC(altura, peso) {\n2 var\
  \ imc = peso / (altura * altura);\n3 return imc;\n4 }\n```\n\n现在，在调用该函数的行中，我们将获取它的返回值，以便之后使用。如下：\n\
  \n```\n1 var pesoDoPrimo = 83;\n2 var alturaDoPrimo = 1.76;\n3 var imcDoPrimo =\
  \ calculaIMC(alturaDoPrimo, pesoDoPrimo);\n4 mostra(\"我表弟的 BMI 是 \" + imcDoPrimo);\n\
  5 mostra(\"他仍然比消瘦标准高出 \" + (imcDoPrimo - 18.5) \n6     + 分。\");\n```\n\n变量 `imcDoPrimo`\
  \ 将通过关键字 `return` 接收 `calculaIMC` 返回的值。我们有很多以这种方式工作的函数：接收一些参数，执行某个任务，然后返回一个对调用者有用的结果。这个返回给调用者的值被称为**函数的返回值**。\n\
  \n### 3.3 检查代码：计算 BMI\n\n让我们检查一下你的 `imc.html` 代码应该是什么子的。首先，我们需要声明将使用的函数。我们既有 `mostra`\
  \ 函数也有 `pulaLinha` 函数：\n\n```\n1 <script>\n2 function pulaLinha() {\n3 document.write(\"\
  <br>\");\n4 }\n5 \n6 function mostra(frase) {\n7 document.write(frase);\n8 pulaLinha();\n\
  9 }\n```\n\n现在我们有了函数，根据身高和体重计算 BMI 并返回它：\n\n```\n1 function calculaIMC(altura, peso)\
  \ {\n2 var imc = peso / (altura * altura);\n3 return imc;\n4 }\n```\n\n好了，我们可以使用这个函数了，获取它的返回值，无论是用于你自己还是你的表弟：\n\
  \n```\n1 var peso = 75;\n2 var altura = 1.72;\n3 var imc = calculaIMC(altura, peso);\n\
  4 \n5 mostra(\"我的 BMI 是 \" + imc);\n6 mostra(\"我仍然比消瘦标准高出 \" + (imc - 18.5) \n7\
  \     + \" 分。\");\n8 </script>\n```\n\n让我们稍微修改一下代码，通过练习来学习。\n\n1. 添加一行代码说明你距离严重肥胖有多远（严重肥胖指数是\
  \ 35）。\n2. 这两行有更短的写法：\n\n    ```\n    1 var imc = calculaIMC(altura, peso);\n  \
  \  2 mostra(\"我的 BMI 是 \" + imc);\n    ```\n\n    由于我们将计算结果赋值给变量 `imc`，然后在调用 `mostra`\
  \ 时使用它，我们可以在一行内完成所有操作，而无需声明变量：\n\n    ```\n    1 mostra(\"我的 BMI 是 \" + calculaIMC(altura,\
  \ peso));\n    ```\n\n    测试一下。但这样做有利吗？之前显示你距离消瘦标准的行紧随在下方。现在我们没有 `imc` 变量了，会发生什么？它将无法工作。你可以在其他行执行同样的操作，用\
  \ `calculaIMC(altura, peso)` 代替变量，但浏览器每次调用时都会重新计算 BMI，而在之前的方法中这个数字只计算了一次并被重复使用。\n\
  \n3. 还记得 `Math.round` 吗？它也是一个所有浏览器都已定义的函数。由于它是一个返回值的函数，因此我们可以这样做：\n\n    ```\n \
  \   1 mostra(\"我的 BMI 是 \" + Math.round(imc));\n    ```\n\n    该函数返回四舍五入后的数字。另一个选项是在声明变量\
  \ `imc` 时使用它。也就是说，与其：\n\n    ```\n    1 var imc = calculaIMC(altura, peso);\n  \
  \  ```\n\n    你可以这样做：\n\n    ```\n    1 var imc = Math.round(calculaIMC(altura,\
  \ peso));\n    ```\n\n    很难吗？这是一种常见的代码写法。注意括号：首先计算 BMI，然后 `Math.round` 对该值进行四舍五入。\n\
  \n    你会使用哪一种？取决于情况。如果你始终想处理取整后的 `imc`，最好使用最后这种形式。如果你有时使用取整值有时使用小数，最好在方便的时候再使用 `Math.round`。\n\
