- "# 编程逻辑：使用 Javascript 和 HTML 创建你的第一个程序\n\n\n\n\n\n\n\n\n\n许多决定并不是容易的。放弃 `console.log`\
  \ 而选择用笨拙的 `document.write`、在 `ifs` 和 `fors` 之前解释函数、通过赋值而不是更常见的语法来定义函数。这些只是在为了更好的教学方法而具有优劣之分的的一些问题。我们在对一些计算机初学者进行了一些测试后，做出了这些选择。\n\
  \n特别感谢 Leonardo Wolter 和 Francisco Sokol，他们提供了带有动画的练习基础。感谢 Erich Egert，他对学生进行了书籍测试并对新挑战提出了各种建议。\n\
  \n## 第 1 章：从今天开始编程\n\n无论你的年龄、职业和目标是什么：编程不仅仅是乐趣，更是一场持续的挑战。我们希望让程序更快、更易读、更优雅且更有用。准备好随时遇到问题、谜题和疑问。\n\
  \n你在这里学习的内容将不仅有助于你创建一个网页。你还将准备好应对 Excel 公式、开发你自己的小工具、理解你在互联网上使用的应用程序的工作原理，甚至可能为你自己和你的朋友创建一个手机程序。\n\
  \n秘诀无疑在于实践。不要局限于书中的示例和练习。更进一步，让你的好奇心引导你去创建新程序。\n\n一步步跟随章节。一旦你开始学习更多，我们就会提供官方练习和挑战。不要只顾阅读！实践是秘诀。尝试所有的建议并亲眼观察结果。如果你好奇，更改数据、修改程序、尝试、发明。编程给了我们这种创造的力量。创造吧！\n\
  \n有疑问吗？有两个地方可以解决你的问题。一个是专门为本书创建的邮件讨论列表：[`groups.google.com/group/comece-a-programar/`](https://groups.google.com/group/comece-a-programar/)\n\
  \n另一个是使用最大的编程门户网站 GUJ：[`www.guj.com.br/`](http://www.guj.com.br/)\n\n在这两种情况下，请记住在提问时要具体，提供问题的细节以及组织良好的代码列表。\n\
  \n### 1.1 与你的浏览器对话\n\n有很多东西要学。最重要的是你能快速编写自己的程序，然后 `execut-los` 来查看结果。有很多编程语言，对于初次接触来说都是可行的替代方案。我们为你选择了一种语言：`JavaScript`，它和其他所有语言一样有优缺点，但对于学习来说，它是非常合适的：开始编程不需要安装任何东西。\n\
  \n打开任何页面。可以是代码之家的网站 [`www.casadocodigo.com.br`](http://www.casadocodigo.com.br)，可以是\
  \ Caelum 网站 [`www.caelum.com.br`](http://www.caelum.com.br) 或你喜欢的门户网站。为了做到这一点，你使用了某个浏览器（`browser`），如\
  \ Internet Explorer、Firefox 和 Chrome，但它是如何完成这些向我们展示这个漂亮页面的魔法的呢？\n\n实际上，这其中没有任何魔法。浏览器只是遵守某人给它的指令。有人告诉它，那些图像应该出现，某些文本需要显示，页面的背景颜色是某种灰色，当你点击按钮时，会弹出一个消息给你，以此依此类推。\n\
  \n是谁做了这些？程序员，通常也被称为开发者。他们正是那些知道如何指令让浏览器去执行的人。所有这些浏览器都会以 `código` 的形式获取这些指令，并以愉快的方式在屏幕上展示它们。*什么会变成代码呢*？\n\
  \n在你进入的同一个网站上，我们将看看使用了什么代码。为此，你必须根据不同的浏览器遵循不同的步骤。\n\n在 Chrome 中，点击工具图标，然后点击 `Ferramentas`（工具）和\
  \ `Exibir código fonte`显示源代码）。`CTRL+U` 是此的快捷键。\n\n![Chrome 中显示源代码的菜单](img/chrome.png)*图\
  \ 1.1：Chrome 中显示源代码的菜单*\n\n在 Firefox 中，点击菜单按钮，`desenvolvedor web`（Web 开发）然后点击 `código\
  \ fonte`(源代码）。`CTRL+U` 在此浏览器同样有效。\n\n![Firefox 中显示源代码的菜单](img/firefox.png)*图 1.2：\
  \ Firefox 中显示源代码的菜单*\n\n在 Internet Explorer 9 中，在页面背景上右键点击并选择 `Visualizar código\
  \ fonte`查看源代码）。\n\n![Explorer 中显示源代码的菜单](img/explorer.png)*图 1.3： Explorer 中显示源代码的菜单*\n\
  \n看起来复杂吗？浏览器（`browser`）获取了所有的代码并生成了那种令我们眼睛舒服的表示。我们可以自己创建这样的东西来展示我们想要的数据。也就是说，我们可以`创建自己的页面`，它将与访问它的\
  \ `usuário`（用户）进行交互。\n\n### 1.2 创建你自己的 HTML 文件\n\n为了创建我们的第一个代码，打开一个普通的文本编辑器，如 Windows\
  \ 的记事本（`Notepad`）或 Linux 的 `gedit`。像 Word 这样的文本编辑器在这种情况下没有帮助，因为它们会保存文件格式。\n\n```html\n\
  1 Meu teste!\n<h3>Seria isso um programa?</h3>\n<strong>Não consigo fazer nada de\
  \ mostrar conteúdo fixo?</strong>\n```\n\n将文件保存到易于访问的文件夹中，如 `Meus Documentos`（我的文档）或\
  \ `Área de Trabalho`（桌面），命名为 `minha_pagina.html`。\n\n![记事本创建文件](img/notepad.png)*图\
  \ 1.4：记事本创建文件*\n\n前往你保存文件的目录，双击它。浏览器将打开并显示结果：\n\n![浏览器中的结果](img/minha_pagina.png)*图\
  \ 1.5：浏览器中的结果*\n\n### 1.3 更多一点 HTML\n\n目前，我们的页面只显示固定文本（称为*静态内容*）。我们可以更改它以显示不同的信息，使用\
  \ `tags` 来改变数据的表示方式。\n\n```html\n1 Meu teste!\n<h3>Seria isso um programa?</h3>\n\
  <strong>Não consigo fazer nada de mostrar conteúdo fixo?</strong>\n```\n\n保存带有这两行新代码的文件，并在浏览器中打开页面。记住，打开它请双击文件，如果它已经打开，请点击刷新图标刷新页面。\n\
  \n\n\n\n\n![Criando link para outra página](img/minha_pagina3.png)\n*Figura 1.7:\
  \ Criando link para outra página*\n\nA forma de escrever HTML, com aqueles sinais\
  \ de `<` e `>`, também conhecida como sintaxe HTML, pode assustar na primeira vez.\
  \ Assim como o uso de `<h3> </h3>`, a tag `<a ...></a>` envolve uma parte do nosso\
  \ texto. Além disso, ela possui um atributo, neste caso o tal do `href`, que indica\
  \ para onde o navegador deve ir se alguém clicar neste link. É comum que tags HTML\
  \ possam diversas propriedades diferentes, modificando a visualização e o comportamento\
  \ de certos trechos do documento. Uma tag e seu conteúdo formam um **elemento HTML**,\
  \ por exemplo, o `<strong>Não</strong>`.\n\nExistem muitas tags. Não se preocupe\
  \ em memorizá-las. Você perceberá que, com o tempo e a prática, decidir qual tag\
  \ deve ser utilizada se tornará um processo natural.\n\nVocê já reparou que o navegador\
  \ não pulou a linha onde sugerimos? Uma das tags que pode ajudar com isso é a `<br>`.\
  \ Experimente. Diferente das outras tags que vimos até aqui, ela deve ser utilizada\
  \ sem o estilo de abertura e fechamento, aparecendo apenas uma vez para cada uso.\
  \ Vamos utilizá-la com mais frequência mais adiante.\n\nEstá curioso com a sigla\
  \ HTML? Ela significa Hypertext Markup Language (linguagem de marcação de hipertexto).\
  \ Ou, em uma tradução bem aberta, uma linguagem que possui tags para marcar documentos\
  \ do tipo hipertexto. Um documento hipertexto é aquele que pode ter links para outros.\
  \ O HTML sozinho não passa de uma forma de marcação (através das tags). Veremos\
  \ agora como incrementá-la.\n\n### 1.4 Dê hola ao mundo\n\nPara ter essa interação\
  \ com o usuário, utilizaremos o **JavaScript**, uma linguagem que nos permite escrever\
  \ códigos interessantíssimos. Altere seu arquivo `html`, adicionando as seguintes\
  \ linhas ao final dele:\n\n```\n1 <script>\n2 alert(\"podemos fazer mais com JavaScript!\"\
  );\n3 </script>\n```\n\nSalve o arquivo. Abra-o no seu navegador, dando um duplo\
  \ clique na página ou recarregando-a. O resultado deve ser o aparecer de uma caixa\
  \ de texto com uma mensagem. Essa caixa também é conhecida como *popup*. Além dela,\
  \ o texto que já conhecemos será exibido:\n\n![Começando a interagir mais](img/minha_pagina-alert.png)\n\
  *Figura 1.8: Começando a interagir mais*\n\nSerá muito comum repetir o processo\
  \ de alteração do nosso código. Esse processo é: adicionar novas linhas no arquivo\
  \ `html`, salvá-lo e abri-lo novamente no navegador. Como vimos, em vez de dar dois\
  \ cliques na página, há também o botão de *atualizar* (*Reload*), que buscará as\
  \ novas informações do nosso arquivo, executando tudo de novo.\n\nSim, você já está\
  \ programando! Parabéns, esse foi seu primeiro código usando a linguagem JavaScript.\
  \ Passos pequenos e muita prática durante a leitura deste livro o levarão muito\
  \ mais longe do que imagina.\n\nAlgo deu errado? No final desta lição, aprenderemos\
  \ a usar algumas ferramentas do navegador para nos auxiliar na descoberta dos problemas\
  \ que podem acontecer. Além disso, todas as lições possuem seções de revisão de\
  \ código, onde você poderá comparar o código que você fez com o que era esperado.\n\
  \nNote que nosso código possui uma série de caracteres não usuais, como parênteses\
  \ e ponto e vírgula. Será que não funcionaria fazer um simples `alert \"olá mundo\"\
  `? Cada linguagem tem seu conjunto de regras, sua **sintaxe**, que devem ser respeitadas\
  \ para que o código possa ser executado. No caso do JavaScript, há toda uma especificação\
  \ que os navegadores seguem (ou deveriam seguir).\n\nCaso você esteja estudando\
  \ através de uma versão digital do livro, pode ter sentido vontade de copiar e colar\
  \ o código deste `alert`. Não faça isso. Uma parte muito importante do aprendizado\
  \ é errar a sintaxe de uma linguagem, além de praticá-la mesmo quando óbvia. Caso\
  \ você tenha errado algo, o navegador emitirá uma mensagem de erro. Às vezes ela\
  \ pode ajudar bastante, mas dependendo do navegador, pode levá-lo ao desespero.\n\
  \n### 1.5 Revise o código: seu primeiro programa\n\nemos como escrever nosso primeiro\
  \ código. Durante todas as lições, sempreemos seções de revisão. É através delas\
  \ que você pode verificar o que fez até agora e também seguir novamente os passos,\
  \ de maneira mais sucinta, para consolidar seus novos conhecimentos.\n\nVamos fazer\
  \ novamente? Abra o editor de texto e digite o seguinte código, que já conhecemos:\n\
  \n```\n 1 Meu primeiro teste!\n 2 <h3>Seria isso um programa?</h3>\n 3 \n 4 <strong>Não</strong>\
  \ consigo fazer nada além de mostrar contúdo fixo?\n 5 \n 6 Conheça o site da nossa\
  \ editora:\n 7 <a href=\"http://www.casadocodigo.com.br\">Clique aqui</a>!\n 8 \n\
  \ 9 <script>\n10 alert(\"podemos fazer mais com JavaScript!\");\n11 </script>\n\
  ```\n\nAgora, salve-o. Como é um arquivo novo, o editor perguntará onde e com qual\
  \ nome deseja gravá-lo. Escolha uma pasta de fácil acesso e um nome significativo.\
  \ No nosso caso, usamos `minha_pagina.html`. Para não perder o que fez até agora,\
  \ você pode gravar essa nova versão com outro nome, por exemplo `meu_primeiro_programa.html`.\
  \ Agora encontre o arquivo e dê dois cliques nele. O navegador deve abrir.\n\n###\
  \ 1.6 Utilize o Chrome e o Notepad++\n\nPodemos utilizar qualquer um dos navegadores\
  \ para aprender a programar. Mesmo assim, durante o livro utilizaremos o Chrome\
  \ como base para nossas imagens, atalhos, menus e dicas. Recomendamos fortemente\
  \ que você faça o mesmo. Não há problema em utilizar outro, porém as mensagens de\
  \ erro e a forma de apresentar o resultado podem variar um pouco.\n\nVocê pode fazer\
  \ a instalação através do site: `https://www.google.com/chrome` (`https://www.google.com/chrome`)\n\
  \nA instalação é muito simples, basta após o download seguir os passos ao executar\
  \ o programa de instalação. Há versões para Windows, Linux e Mac.\n\nPara o editor\
  \ de texto, o Bloco de Notas (Notepad) seria suficiente, porém é muito mais interessante\
  \ utilizar um editor que nos ajude mais, colorindo alguns termos para facilitar\
  \ a visualização do código fonte, além de oferecer outros truques.\n\nPara Windows,\
  \ recomendamos o Notepad++, que é gratuito e de código aberto: `http://notepad-plus-plus.org/`\
  \ (`http://notepad-plus-plus.org/`)\n\nClicando em *downloads*, há logo uma opção\
  \ `Notepad++ v6.1.3 Installer` (pode ser uma versão mais atual).\n\nBasta baixar\
  \ este executável e abri-lo. Durante a instalação, há a opção de escolher pelo português.\
  \ Agora você pode editar nosso `html` através desse editor, dando um clique da direita\
  \ no arquivo e escolhendo *Edit with Notepad++*:\n\n![Utilizando o Notepad++ para\
  \ facilitar nosso trabalho](img/notepadpp.png)\n*Figura 1.9: Utilizando o Notepad++\
  \ para facilitar nosso trabalho*\n\n\n\n\n我们将在书中的中使用 Notepad++，配合 Google Chrome\
  \ 和 Windows 7。如果你使用的是 Linux 或 Mac，可能已经拥有了你偏好的编辑器。我们推荐在 Linux 和 Mac 上使用 Sublime。当然，你也可以使用\
  \ vim、emacs 或任何你认为更合适的工具。\n\n在书中，我们使用了一些在 Windows 上截取的图像，另一些在 Mac 上，还有一些在 Linux\
  \ 上。但它们之间没有什么明显的区别。\n\n### 1.7 救命！我的程序无法运行。认识并使用 Chrome 控制台\n\n不要被错误吓到。知道如何面对它们非常重要。理解错误信息至关重要。总会有论坛和讨论列表，你可以在那里寻求帮助。记得要很好描述你的问题以及错误信息，但同时也需要保持简洁。GUJ\
  \ 论坛在各种语言的巴西开发者开发者社区中非常有名。利用它来解决你的疑问：[`www.guj.com.br`](http://www.guj.com.br)\n\
  \n有一些非常常见的错误。例如在 `alert` 中没有使用括号。如果你这样做，此 `script` 标签内的任何内容都无法运行，且不会显示错误信息！测试一下，以错误的方式添加第二个\
  \ `alert` 调用：\n\n```\n1 <script>\n2 alert(\"podemos fazer mais com JavaScript!\"\
  );\n3 alert \"chamando sem parenteses\";\n4 </script>\n```\n\n浏览器甚至不会显示第一个 `alert`，而那里没有任何错误！那么如何发现问题呢？Chrome\
  \ 有一个工具帮助我们完成这项任务。\n\n![选择打开 JavaScript 控制台的菜单](img/chrome-console.png) 图 1.10：选择打开\
  \ JavaScript 控制台的菜单\n\n点击菜单/工具图标。它位于 Chrome 的右上角。然后访问 `工具` (`Tools`) 菜单，最后点击 `JavaScript\
  \ 控制台`，如如图所示。将出现以下窗口，指示**语法错误**：\n\n![打开的 Chrome JavaScript 控制台](img/chrome-console2.png)\
  \ 图 1.11：打开的 Chrome JavaScript 控制台\n\n在这种情况下，它正在提醒我们有一个“未预期的字符串”。有帮助吗？有时错误信息可能并不清晰，但通过指示问题所在的位置已经很有帮助了。注意，在错误信息的右侧，浏览器会显示问题发生在哪个文件以及哪一行。你甚至可以点击那里直接跳转到问题的代码段。\n\
  \n通过这条错误信息，Chrome 想指出 `\"chamando sem parenteses\"` 出现在一个意料之外的地方，就像它在用一种它听不懂的“语言”说话。这种错误就是我们说的**语法错误**，即在与懂语言的人交流时形式上的错误。在这种特殊情况下，它不期望在括号之外出现这条消息。修复这个问题。\n\
  \n用其他错误进行测试。例如，以错误的方式编写 `alert`，比如 `alertar`。\n\n同时，有些变化不会影响代码执行。例如，我们可以在 `alert`\
  \ 和左括号之间加上空格。那么分号呢？我们可以省略它吗？引号呢？测试一下，发现它。在我们课程之外进行实验是非常重要的。\n\n对于 Firefox，可以通过访问\
  \ `工具` (`Tools`)、`Web 开发者` 然后是 `Web 控制台` 菜单来访问类似的控制台。在 Internet Explorer 9 中，你可以点击齿轮图标并选择\
  \ `F12 开发工具` (`Developer Tools`) 来找到它。\n\n### 1.8 救命！重音显示不正常\n\n**仅在你使用 Mac 或 Linux\
  \ 的情况下**，会出现一个小问题：重音显示不正确。当我们保存文件时，有不同的格式来以 `字节` 存储字符。Chrome 默认会尝试用名为 `latin1` 的编码读取它。\n\
  \n如果我们以其他格式保存文件，我们需要在 HTML 中包含这些信息，HTML 拥系列标签，这些标签甚至不标记文本，而是为文件提供元数据。如果你使用这些操作系统之一，请将以下行作为文件的第一行添加：`<meta\
  \ charset=\"UTF-8\">`。将其想象为 Word 文件的属性。这些信息不是直接提供给最终用户的，而是为了让浏览器能更好地处理该文件。\n\n##\
  \ 第 2 章：与用户通信\n\n我们刚刚让第一个程序听从我们的命令并向用户显示消息，这已经是一大步。从现在开始，我们将编写更复杂、有趣且有趣的代码。你将开始意识到编程可能具有的力量，这也是你开始锻炼自己创造力的良好一步，同时养成编程的习惯。准备好了吗？\n\
  \n### 2.1 以其他方式向世界问好\n\n`alert` 是我们与用户的第一种通信方式。我们如何发送两条消息呢？只需执行两次该指令。创建一个新文件，命名为\
  \ `começando_javascript.html`，并放入以下内容：\n\n```\n1 <script>\n2 alert(\"olá mundo!\"\
  );\n3 alert(\"esse é meu segundo programa\");\n4 </script>\n```\n\n`alert` 是我们与用户的第一种通信方式。我们如何发送两条消息呢？只需执行两次该指令。创建一个新文件，命名为\
  \ `começando_javascript.html`，并放入以下内容：\n\n（此处省略原文中重复出现的相同段落，遵循“不要重复输出原文”的原则，仅翻译逻辑核心且唯一的示例代码块）\n\
  \n`alert` 是我们与用户的第一种通信方式。我们如何发送两条消息呢？只需执行两次该指令。创建一个新文件，命名为 `começando_javascript.html`，并放入以下内容：\n\
  \n（此处省略原文中重复出现的相同段落，仅翻译核心且唯一的示例代码块）\n\n`alert` 是我们与用户的第一种通信方式。我们如何发送两条消息呢？只需执行两次该指令。创建一个新文件，命名为\
  \ `começando_javascript.html`，并放入以下内容：\n\n（此处省略原文中重复出现的相同段落，仅翻译示例代码块）\n\n```\n1\
  \ <script>\n2 alert(\"olá mundo!\");\n3 alert(\"esse é meu segundo programa\");\n\
  4 </script>\n```\n\n\n\n\n在许多语言中，就像 JavaScript 中一样，引号之间的字符序列被称为 `string`。因此，我们说\
  \ `+` 除了相加数字外，还会拼接 `strings`。\n\n你将要处理数字还是字符序列（`string`）？这取决于你想做什么。对于数字，我们可以进行数学运算。为了估算你的出生年份，我们从当前年份中减去这个数值：\n\
  \n```javascript\n1 document.write(\"我出生于： \");\n2 document.write(2012 - 25);\n```\n\
  \n那么，如果我们将的没有执行 `document.write(2012 - 25)`，而是将 `2012 - 25` 整体放在引号中，执行 `document.write(\"\
  2012 - 25\")` 呢？结果是什么？\n\n为了简洁起见，我们有时会在后续程序中省略 `script` 标签，就像我们刚刚做的那样。但你应该使用它们。此外，如果我们不把这些指令放在\
  \ `script` 标签内，我们的程序会发生什么？测试一下吧。\n\n除了减法运算符 `-` 之外，还有加法运算符 `+`、乘法 `*` 和除法 `/`。你可以将你的年龄与作者的年龄相加。Paulo\
  \ 年 32 岁，Adriano 26 岁：\n\n```javascript\n1 document.write(\"我们的年龄之和是： \");\n2 document.write(25\
  \ + 32 + 26);\n```\n\n要计算平均值，只需将相和的结果除以 3 即可：\n\n```javascript\n1 document.write(\"\
  我们的平均年龄是： \");\n2- document.write(25 + 32 + 26 / 3);\n```\n\n检查结果。不符合预期！除法计算是在加法之前完成的，就像学校数学一样，因此第一个计算的值是\
  \ `26 / 3`。我们可以使用括号来强制执行计算顺序，先进行加法：\n\n```javascript\n1 document.write((25 + 32\
  \ + 26) / 3);\n```\n\n即使运算符的优先级已经按照我们的预期工作，也会使用括号，因为可以提高我们要操作内容的可读性。\n\n也可以将数字与\
  \ `strings` 混合使用，但务必小心。将它们相加会发生什么？\n\n```javascript\n1 document.write(\"我的年龄是： \"\
  \ + 25);\n```\n\n字符序列 `\"我的年龄是\"` 会与数字 `25` 一起出现，也就是说，它们被拼接了！同样注意我们需要小心括号。让我们再次混合字符串和数字：\n\
  \n```javascript\n1 document.write(\"我们的平均年龄是： \" + ((25 + 32 + 26) / 3));\n```\n\
  \n### 2.3 复习你的代码：处理数字\n\n创建一个文件 `testando_idades.html`，我们来复习已经学过的内容。放入计算年龄平均值的代码：\n\
