  \n让我们回顾一下我们对 `anos_de_copa.html` 文件所做的工作。我们正在创建一个程序，方便我们发现哪些年份将举办或举办过世界杯。此时，我们的代码中已经定义了函数\
  \ `mostra` 的定义，它用于在浏览器中显示年份，并将变量 `anoDeCopa` 初始化为 1930，因为这是该活动首次发生的时间。\n\n```\n\
  1 <script>\n2 var mostra = function(frase) {\n3   document.write(frase + \"<br>\"\
