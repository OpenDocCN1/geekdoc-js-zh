  \ e coloque:\n\n```\n 1 <script>\n 2 // funcoes\n 3 function primeira() {\n 4  \
  \ console.log(\"1 - antes\");\n 5   segunda();\n 6   console.log(\"1 - depois\"\
  );\n 7 }\n 8 \n 9 function segunda() {\n10   console.log(\"2 - antes\");\n11   terceira();\n\
  12   console.log(\"2 - depois\");  \n13 }\n14 \n15 function terceira() {\n16   console.log(\"\
  3\");\n17 }\n18 \n19 // codigo principal\n20 primeira();\n21 \n22 </script>\n```\n\
  \nRode e veja o resultado!\n\n### 3.8 Utilize o console do Chrome para fazer testes!\n\
  \nÀs vezes pode ser trabalhoso digitar um programa inteiro para descobrir que determinado\
  \ comando não funcionava da maneira que esperávamos. O Chrome possibilita fazer\
  \ testes dentro do próprio Console.\n\nFaça o seguinte teste. Abra uma nova aba\
  \ no Chrome e então abra o Console, conforme vimos na seção 2.11. Você pode fazer\
  \ isso pelo menu ou já se habituar com a tecla de atalho: `CTRL+SHIFT+J` no Windows\
  \ e no Linux (`Command+Option+J` no Mac) e depois clicar no Console.\n\nRepare que\
  \ dentro do console você pode digitar o que quiser, que o JavaScript será executado!\
  \ Digite, por exemplo, `console.log(\"teste\");`. O que acontece? Ele primeiro imprime\
  \ o que a função retorna (nesse caso `undefined`, indicando que não retorna nada).\
  \ Logo depois vem a saída da nossa função, conforme esperado!\n\nFaça mais alguns\
  \ testes. Declare uma variável `idade` valendo 30. Na linha seguinte, digite apenas\
  \ `idade + 5;`. Não há muito sentido em fazer uma conta em JavaScript sem atribuir\
  \ o resultado a uma variável, pois o resultado seria perdido, ficaria sem uso. Dentro\
  \ do console você pode fazer isso, pois ele exibirá o resultado para você, conforme\
  \ a figura:\n\n![Fazendo testes no Console](img/console-testes.png)*Figura 3.1:\
  \ Fazendo testes no Console*\n\nOutra ajuda que o console dá se chama `code completion`\
  \ ou `auto complete`. É a capacidade dele de tentar adivinhar o que você quer escrever,\
  \ tornando a codificação mais rápida. Repare que na figura já começamos a digitar\
  \ `console` e paramos no meio, como indicado pelo cursor, e o console já deu duas\
  \ sugestões. Basta escolher a correta e pressionar enter! Essa também é uma forma\
  \ de conhecer mais as funções e variáveis que o JavaScript nos fornece.\n\nCuidado!\
  \ Se você esquecer de fechar chaves ou parênteses, pode ser bem difícil perceber.\
  \ O efeito final será inesperado e facilmente pode se confundir entre as diversas\
  \ mensagens de erro. Caso o código seja grande, prefira criar seu próprio arquivo\
  \ `html`, ou então o [`www.jsfiddle.net`](http://www.jsfiddle.net), conforme visto\
  \ na seção 2.13.\n\n#### Para saber mais: outra forma de declarar funções\n\nEm\
  \ javascript, há quem prefira declarar as funções dessa outra forma...\n\n```\n\
  1 var pulaLinha = function() {\n2   document.write(\"<br>\");\n3 };\n```\n\n...\
  \ do que a maneira que vimos no livro, que diferencia bastante as funções das variáveis:\n\
  \n```\n1 function pulaLinha() {\n2   document.write(\"<br>\");\n3 }\n```\n\nNa maioria\
  \ das vezes não faz diferença usar de uma forma ou outra. A forma que atribui a\
  \ função a uma variável é usada mais comumente quando estamos usando *programação\
  \ funcional*. Não se preocupe com isso, neste momento.\n\n## Capítulo 4: Execute\
  \ códigos diferentes dependendo da condição\n\nNem sempre queremos executar um código.\
  \ Como fazemos para decidir se uma linha deve ser ou não executada? Como expressar\
  \ uma condição? Vamos ver novos comandos e nos aprofundar na lógica de programação.\n\
  \n\n\n\n```\n1 var vitorias = 3;\n2 var empates = \"1\"; // string!\n3 var empatesComoNumero\
  \ = parseInt(empates);\n4 var pontos = vitorias * 3 + empatesComoNumero;\n5 alert(total);\n\
  ```\n\n现在这段代码运行如预期，但我们创建了一个额外的变量，代码可能会变得混乱。解决这个问题的常用方法是使用同同一个变量：\n\n```\n1 var vitorias\
  \ = 3;\n2 var empates = \"1\"; // string!\n3 empates = parseInt(empates);\n4 var\
  \ pontos = vitorias * 3 + empates;\n5 alert(total);\n```\n\n另一种方法是在接收值的同一行调用 `parseInt`。这是你最常遇到的形式：\n\
  \n```\n1 var vitorias = 3;\n2 var empates = parseInt(\"1\"); // já converte string\
  \ para int\n3 var pontos = vitorias * 3 + empates;\n4 alert(total);\n```\n\n所以我们现在可以修改\
  \ `pontos_futebol.html` 中计算分的代码，以便在接收用户输入的内容时，直接将输入的 String 转换为整数：\n\n```\n1 var\
  \ vitorias = parseInt(\n2         prompt(\"Quantos jogos o CDC Futebol Clube venceu?\"\
  ));\n3 var empates = parseInt(\n4         prompt(\"Quantos jogos o CDC Futebol Clube\
  \ empatou?\"));\n5 var pontos = (vitorias * 3) + empates;\n```\n\n### 4.2 检查你球队的情况\n\
  \n最后我们来看新主题：检查条件并根据每个可能的结果采取不同的行动。\n\n我们的大宿敌 Livros Velhos Futebol Clube 是热门，而且表现非常好。它有\
  \ 28 分。它比 CDC Futebol Clube 好还是差呢？\n\n我们可以通过向 JavaScript 提问来检查。类似于“如果 `pontos` 大于\
  \ `28`，就显示我们很好”。我们是这样做的：\n\n```\n1 if(pontos > 28) {\n2   mostra(\"Nosso time está\
  \ indo MELHOR que o Livros Velhos!\");\n3 }\n```\n\n`if` 是 JavaScript 的关键字。它执行括号内的比较，如果结果为真，则执行大括号内的内容。\n\
  \n测试一下。运行你的代码，首先输入 7 胜和 4 平，总共 25 分。我们的 `if` 发生了什么？如果你输入 10 胜 1 平又会怎样？\n\n除了运算符\
  \ `>`，我们还有 `<`。我们可以检查我们的球队是否比 Livros Velhos 差：\n\n```\n1 if(pontos < 28) {\n2  \
  \ mostra(\"Nosso time está indo PIOR que o Livros Velhos!\");\n3 }\n```\n\n只剩下下一个比较了：等价比较。如何知道我们是否和\
  \ Livros Velhos 持平局？所有迹象表明 `=` 应该解决这个问题。遗憾的是，`=` 运算符不会像我们预期的那样工作，因为正如我们所看到的，它是用于**赋值**的。它获取等号右侧的值并将其复制到左侧的变量。\n\
  \n解决方案是使用进行等价比较的运算符，即 `==`。是两个等号，紧随其后的两个！\n\n```\n1 if(pontos == 28) {\n2   mostra(\"\
  Nosso time está EMPATADO com o Livros Velhos!\");\n3 }\n```\n\n这看起来可能很奇怪，但在很多语言中都是这样使用的。它是\
  \ JavaScript**语法**的一部分。这是语言的工作方式，每种语言都有其独特性和细节。还有一个语法细节可能引起你的注意：对于像 `if` 这样的命令，在它的闭合大括号\
  \ (`}`) 结尾，我们不使用分号！\n\n### 4.3 复习我们的代码：联赛积分\n\n此时，我们有一个名为 `pontos_futebol.html`\
  \ 的文件，它可以发现我们球队在足球联赛中的状况。让我们回顾代码。它从声明我们经常使用的两个函数开始：\n\n```\n1 <script>\n2 function\
  \ pulaLinha() {\n3   document.write(\"<br>\");\n4 }\n5 \n6 function mostra(frase)\
  \ {\n7   document.write(frase);\n8   pulaLinha();\n9 }\n```\n\n我们通过 `prompt` 函数询问用户球队的胜利数和平局数：\n\
  \n```\n1 var vitorias = prompt(\"Quantos jogos o CDC Futebol Clube venceu?\");\n\
  2 var empates = prompt(\"Quantos jogos o CDC Futebol Clube empatou?\");\n```\n\n\
  我们在这些行中添加了 `parseInt`，以便直接将输入的文本转换为整数：\n\n```\n1 var vitorias = parseInt(\n2   \
  \      prompt(\"Quantos jogos o CDC Futebol Clube venceu?\"));\n3 var empates =\
  \ parseInt(\n4         prompt(\"Quantos jogos o CDC Futebol Clube empatou?\"));\n\
  ```\n\n随后，我们计算总分，考虑到每次胜利得 3 分，每次平局得 1 分：\n\n```\n1 var pontos = (vitorias * 3) +\
  \ empates;\n```\n\n假设另一支球队 Livros Velhos 有 28 分。那么我们需要显示球队的情况。\n\n### 4.4 你的 BMI\
  \ 理想吗？\n\n我们可以在代码中应用 `if` 来根据数值给出诊断。打开 `imc.html` 文件，在计算 BMI 之后，我们检查它是否低于消指数：\n\n\
  ```\n1 var imcDoUsuario = calculaIMC(alturaDoUsuario, pesoDoUsuario);\n2 mostra(\"\
  O seu imc é \" + imcDoUsuario);\n3 4 if(imcDoUsuario < 18.5) {\n5   mostra(\"Seu\
  \ IMC indica que você está ABAIXO do peso.\");\n6 }\n```\n\n运行你的程序并测试 60 公斤和 1.82\
  \ 米高。用一个更矮的人测试，信息不应该显示。\n\n让我们检查相反的情况，对肥胖指数进行同样的操作：\n\n```\n1 if(imcDoUsuario >\
  \ 35) {\n2   mostra(\"Seu IMC indica que você está ACIMA do peso.\");\n3 }\n```\n\
  \n用 99 公斤和 1.6 米高进行测试。\n\n如果 `imcDoUsuario` 大于 18.5 **且同时** 小于 35 呢？你可以分别检查这两种情况，一次检查一个。首先，我们做一个\
  \ `if` 来判断它是否大于 18.5：\n\n```javascript\nif(imcDoUsuario > 18.5) {\n  // 不仅仅是大于 18.5\n\
  \  // 我需要检查是否小于 35\n}\n```\n\n但是，在里面，我们需要检查它是否小于 35。如何检查一个条件？使用 `if`。因此我可以在里面再写一个：\n\
  \n```javascript\nif(imcDoUsuario > 18.5) {\n  if(imcDoUsuario < 35) {\n    mostra(\"\
  OK! Seu IMC está entre os dois limites.\");\n  }\n}\n```\n\n\n\n\n看起来很复杂。我们在一个 `if`\
  \ 里面嵌套了另一个 `if`！注意，我们使用了`缩进`功能来清楚地表示第二个 `if` 在第一个 `if` 内部。如果我们没有使用 `TAB`，就会很难察觉这一点。想看看吗？看这个缩进非常糟糕、格式混乱的示例：\n\
  \n```\n1 if(imcDoUsuario > 18.5) {\n2 if(imcDoUsuario < 35) {\n3 mostra(\"OK! Seu\
  \ IMC está entre os dois limites.\");\n4 }\n5 }\n```\n\n尽管这段代码运行得完美无缺，但很难阅读它并理解发生了什么。从现在起就努力保持正确的缩进。当代码属于外部代码段（**代码块**）时，我们应该始终向右多进一个\
  \ `TAB`。在缩进良好的代码中，可以看出 `mostra` 函数属于 `if(imcDoUsuario < 35)` 块，而该块又属于 `if(imcDoUsuario\
  \ > 18.5)` 块。\n\n我们经常需要检查多个条件是否为真。这种情况非常常见，以至于有一种更短的方法来实现两个 `ifs`，就像它们互相嵌套在里面一样。有一种写法可以表示“我希望这个**和**那个都为真”。这个**与**是通过一个看起来很奇怪的运算符\
  \ `&&` 实现的：\n\n```\n1 if(imcDoUsuario > 18.5 && imcDoUsuario < 35) {\n2   mostra(\"\
  OK! Seu IMC está entre os dois limites.\");\n3 }\n```\n\n这比写两个 `ifs` 要易读得多。我们将这个条件读为：“如果\
  \ `imcDoUsuario` 大于 18.5 且 `imcDoUsuario` 小于 35，则执行……”。\n\n我们的代码仍然存在一个小问题。如果 BMI\
  \ 正好等于 `18.5` 或 `35` 呢？注意，我们的任何一个条件都不会为真，什么都不会被打印。为了解决这个问题，我们有 `>=` 和 `<=` 比较运算符。如果我们认为这些精确值属于健康\
  \ BMI 的范围，我们就可以使用这些新的比较运算符来编写条件：\n\n```\n1 if(imcDoUsuario >= 18.5 && imcDoUsuario\
  \ <= 35) {\n2   mostra(\"OK! Seu IMC está entre os dois limites.\");\n3 }\n```\n\
  \n### 4.5 游戏：猜猜我心里想的数字\n\n现在让我们创建第一个游戏吧！它会非常简单，但足以带来几刻乐趣时光。我们将让电脑“想”一个数字，让游戏的人尝试猜出那个数字。\n\
  \n为了编写我们的游戏，请创建 `jogo_adivinha.html` 文件。我们需要完成的第一项任务是让电脑“想”一个随机数。我们可以通过 JavaScript\
  \ 自带的函数 `Math.random()` 实现这一点。不要被这个名字吓到，这个函数只是返回一个 `0` 到 `1` 之间的随机数。例如，它可能返回 `0.5`。\n\
  \n```\n1 <script>\n2   var numeroPensado = Math.random();\n3 </script>\n```\n\n\
  猜带小数的数字并不是一项非常愉快的任务。想象一下电脑想的数字是 0.534345，猜这样的数字既不容易也不有趣。\n\n让我们让程序一定要想一个 `0` 到 `100`\
  \ 之间的数字。遗憾的是，没有现成的函数可以用这种方式进行抽奖，所以让我们利用已知的 `Math.random()`。为了做到，我们将返回的结果乘以 `100`。那么，如果它想的是\
  \ `0.5`，乘以 `100` 后，结果将是 `50`。\n\n```\n1 <script>\n2   var numeroPensado = Math.random()\
  \ * 100;\n3 </script>\n```\n\n尽管如此，我们仍然会有带有小数的数字。如果电脑想的是 `0.5372`，乘以 100 后我们就得到\
  \ `53.72`。我们可以通过 `Math.round()` 函数对该值进行四舍五入。我们首先将带小数的数字存在 `numeroPensadoComCasasDecimais`\
  \ 中，然后将其四舍五入并存储在变量 `numeroPensado` 中：\n\n```\n1 <script>\n2   var numeroPensadoComCasasDecimais\
  \ = Math.random() * 100;\n3   var numeroPensado = Math.round(numeroPensadoComCasasDecimais);\n\
  4 </script>\n```\n\n变量 `numeroPensadoComCasasDecimais` 不再使用了。我们创建它只是为了计算四舍五入后的随机数，该结果在\
  \ `numeroPensado` 中。我们经常快速使用某些变量，只很短段时间，然后将重要的结果放在另一个变量中。有些人将这些变量称为**临时变量**。\n\n\
  注意，我们可以在同一行代码中完成两个操作（抽奖和四舍五入），而不需要 `numeroPensadoComCasasDecimais` 变量。为了这样做，我们将\
  \ `Math.random() * 100` 返回的内容直接传递给 `Math.round`：\n\n```\n1 <script>\n2   var numeroPensado\
  \ = Math.round(Math.random() * 100);\n3 </script>\n```\n\n\n\n\n接下来，我们询问用户一个数字，即他的`chute`，让他尝试猜猜计算机想的数字。通过这个数字，我们可以检查用户是否正确。\n\
  \n```javascript\n1 <script>\n2   var numeroPensado = Math.round(Math.random() *\
  \ 100);\n3 \n4   var chute = prompt(\"Já pensei. Qual você acha que é?\");\n5  \
  \ if(chute == numeroPensado) {\n6     mostra(\"Uau! Você acertou, pois eu pensei\
  \ no \" + numeroPensado);\n7   }\n8 </script>\n```\n\n记得在你的代码中要有 `mostra` 函数。\n\n\
  之后，如果猜测错误，我们会显示消息。为了实现这一点，我们使用了 `else`：\n\n```javascript\n 1 <script>\n 2   var\
  \ numeroPensado = Math.round(Math.random() * 100);\n 3 \n 4   var chute = prompt(\"\
  Já pensei. Qual você acha que é?\");\n 5   if(chute == numeroPensado) {\n 6    \
  \ mostra(\"Uau! Você acertou, pois eu pensei no \" + numeroPensado);\n 7   } else\
  \ {\n 8     mostra(\"Você errou! Eu tinha pensado no \" + numeroPensado);\n 9  \
  \ }\n10 </script>\n```\n\n准备好了，现在在浏览器中打开这个程序，你会被询问一个数字。紧接着就会显示该数字是否与计算机想的数字相同。\n\
  \n1. 使得你的游戏在用户尝试错误时，显示他猜的数字是比程序想的数字大还是小。\n2. 你可以创建一个 `sorteia` 函数，它接收一个数字 `n` 并在\
  \ 0 到 `n` 之间抽取一个随机数并返回该值。这样，你就不需要写 `var numeroPensado = Math.round(Math.random()\
  \ * 100);`，而是写 `var numeroPensado = sorteia(100);`。进行此修改，创建一个新函数并使用它。\n3. 如果用户输入了不是数字的内容呢？例如，他猜了\
  \ `\"banana\"`？这让他失去一次猜测机会可就不妙了……\n\n   你可以通过 `isNaN(variavel)` 函数检查用户输入的是否非数字。例如，`if(isNaN(chute))`\
  \ 应该显示消息 *只有数字是有效的*。`NaN` 意味着 *Not a Number*，在葡萄牙语中类似于“不是一个数字”。在 Chrome 控制台中测试这个函数，执行\
  \ `isNaN(\"banana\");` 和 `isNaN(123);`。\n\n## 第 5 章：如何重复程序的任务？\n\n我们已经可以根据条件执行一行代码了。通过\
  \ `if` 和 `else`，我们可以定义应该执行哪部分代码。但如果我们需要执行它多次呢？复制粘贴代码能帮助我们完成这项任务吗？\n\n### 5.1 下一次世界杯将在什么时候举行？\n\
  \n自 1930 年以来，世界上就开始举办足球世界杯，每届都有不同的举办地。该赛事的周期为 4 年。请问 2030 年会有世界杯吗？\n\n我们了解此的一种方法是以举办某届赛事的年份为基准，例如\
  \ 2014 年，然后加上 4 年。我们立刻知道 2018 年是一个会有世界杯的年份。如果我们继续这个过程，下一次世界杯年将是 2022 年，接着是 2026\
  \ 年，然后就到了 2030 年，我们发现是的，会有世界杯。**只要我们不累，我们可以无限地继续这个过程**。\n\n让我们写一个程序，以极其简单的方式显示从\
  \ 1930 年开始的世界杯年份。只需要有一个值为 1930 的变量，并且它的值每次增加 4 即可。\n\n```javascript\n 1 var anoDeCopa\
  \ = 1930;\n 2 alert(anoDeCopa + \" tem copa!\");\n 3 \n 4 anoDeCopa = anoDeCopa\
  \ + 4;\n 5 alert(anoDeCopa + \" tem copa!\");\n 6 \n 7 anoDeCopa = anoDeCopa + 4;\n\
  \ 8 alert(anoDeCopa + \" tem copa!\");\n 9 \n10 anoDeCopa = anoDeCopa + 4;\n11 alert(anoDeCopa\
  \ + \" tem copa!\");\n```\n\n我们可以一直重复这段代码直到厌。但注意我们将面临的工作量。如果我们想要更多的世界杯呢？我们需要写多少代码？这是大量的重复性工作！让我们尝试一种稍微不同的方法。\n\
  \n我们想每 4 年打印一次世界杯年份，以便了解所有的世界杯。这可能吗？想法是创建一个程序，在变量 `anoDeCopa` 上加 `4`，向我们提示这个值，并重新执行相同的步骤。\n\
  \n按照这个逻辑，我们可以在 `anos_de_copa.html` 文件中创建一个新程序，向我们显示自 1930 年以来举办过和将举办世界杯的年份：\n\n\
  ```javascript\n1 <script>\n2 var anoDeCopa = 1930;\n3 \n4 while(true) {\n5   alert(anoDeCopa\
  \ + \" tem copa\");\n6   anoDeCopa = anoDeCopa + 4;\n7 }\n</script>\n```\n\n\n\n\
  首先，让我们重新编写 `mostra` 函数的代码。之前我们也创建了 `pulaLinha` 函数，但出于教学考虑，考虑到我们没有在其他地方复用 `pulaLinha`，而且它本身并不复杂。这次我们将在同一个函数中完成这两项工作：调用\
  \ `document.write` 并在末尾添加 `<br>`：\n\n```\n1 var mostra = function(frase) {\n2  \
  \ document.write(frase + \"<br>\");\n3 };\n```\n\n现在，将你使用 `alert` 的行替换为使用 `mostra`。\n\
  \n```\n1 mostra(anoDeCopa + \" tem copa!\");\n```\n\n我们甚至可以显示一条指示已结束的消息：\n\n```\n\
  \ 1 <script>\n 2 var anoDeCopa = 1930;\n 3 \n 4 while(anoDeCopa <= 2014) {\n 5 \
  \  mostra(anoDeCopa + \" tem copa!\");\n 6   anoDeCopa = anoDeCopa + 4;\n 7 }\n\
  \ 8 \n 9 mostra(\"Ufa! Esses foram os anos de copa até 2014.\");\n10 </script>\n\
  ```\n\n你可以将 `while` 想象成每次循环时它都会问一个问题：*我可以继续吗*？括号内的条件（在我们的案例中为 `anoDeCopa <= 2014`）将用于做判断。如果答案为\
