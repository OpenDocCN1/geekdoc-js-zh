    \ seu PDF que contém uma documentação alternativa:\n\n[http://blog.nihilogic.dk/2009/02/html5-canvas-cheat-sheet.html](http://blog.nihilogic.dk/2009/02/html5-canvas-cheat-sheet.html)\n\
    \nEle apresenta um resumo das funções que trabalham com o canvas. Segue um pedaço\
    \ dessa documentação onde podemos ver algumas das que já conhecemos, bem resumidas,\
    \ explicando quais são os parâmetros que elas trabalham:\n\n![Uma documentação\
    \ não oficial, mas que pode ser bem útil. Há várias como essa na internet.](Images/documentacao_diferente.png)*Figura\
    \ 7.8: Uma documentação não oficial, mas que pode ser bem útil. Há várias como\
    \ essa na internet.*\n\nVamos conhecer outras funções relacionadas ao canvas ainda\
    \ neste capítulo. Lembre-se que você pode e deve explorar novas opções através\
    \ da documentação. O inglês não deve ser barreira: ele exigirá pouco, mas é fundamental\
    \ conhecer o mínimo.\n\n### 7.4 Revise seus primeiros passos com o canvas\n\n\
    Vamos revisar o que fizemos para criar a bandeira da Itália e as nossas outras\
    \ figuras. Não se assuste com um pouco de matemática e as coordenadas. A prática\
    \ vai tornar tudo bem mais fácil. Primeiro criamos o arquivo `canvas.html` e declaramos\
    \ nosso canvas:\n\n```\n1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n\
    ```\n\nLogo depois, começamos a colocar o código JavaScript. As duas primeiras\
    \ linhas são para adquirimos o tal do contexto 2d, que vai servir como pincel.\
    \ São duas linhas de código que ainda não dominamos:\n\n```\n1 <script>\n2 var\
    \ tela = document.getElementById(\"tela\");\n3 var c = tela.getContext(\"2d\"\
    );\n```\n\nAgora desenhamos o primeiro retângulo, que será verde:\n\n```\n1 c.fillStyle=\"\
    green\";\n2 c.fillRect(0, 0, 200, 400);\n```\n\nO segundo retângulo será vermelho,\
    \ de mesma largura e altura, porém iniciará na posição `400,0`:\n\n```\n1 c.fillStyle=\"\
    red\";\n2 c.fillRect(400, 0, 200, 400);\n```\n\nVamos ao triângulo cinza. Aqui\
    \ usamos a função que começa o traçado, a `beginPath`. Movemos o pincel com `moveTo`\
    \ e traçamos com `lineTo`. Por último, preenchemos o miolo com a função `fill`:\n\
    \n```\n1 c.fillStyle=\"gray\";\n2 c.beginPath();\n3 c.moveTo(300, 200);\n4 c.lineTo(200,\
    \ 400);\n5 c.lineTo(400, 400);\n6 c.fill();\n```\n\nPor último, desenhamos nosso\
    \ círculo bem no meio da bandeira, em azul, lembrando também de fechar a tag de\
    \ `script`:\n\n```\n1 c.fillStyle=\"blue\";\n2 c.beginPath();\n3 c.arc(300, 200,\
    \ 50, 0, 2*3.14);\n4 c.fill();\n5 </script>\n```\n\nVamos praticar mais o conhecimento\
    \ das coordenadas e testar outros desenhos e formas através das bandeiras.\n\n\
    1.  Inicialmente vamos desenhar duas bandeiras simples, a primeira da Colômbia\
    \ e a segunda de Madagascar:\n\n    ![Bandeira da Colombia](Images/colombia.png)\n\
    \n    *Figura 7.1: Bandeira da Colombia*\n\n    ![Bandeira de Madagascar](Images/madagascar.png)\n\
    \n    *Figura 7.2: Bandeira de Madagascar*\n\n2.  Agora duas que possuem circunferências\
    \ e você precisará usar o arco, do Laos e do Niger:\n\n    ![Bandeira do Laos](Images/laos.png)\n\
    \n    *Figura 7.1: Bandeira do Laos*\n\n    ![Bandeira da Niger](Images/nigeria.png)\n\
    \n    *Figura 7.2: Bandeira da Niger*\n\n3.  Uma bastante interessante é da Noruega.\
    \ Você pode usar retângulos parar fazer as cruzes.\n\n    ![Bandeira da Noruega](Images/noruega.png)\n\
    \n    *Figura 7.1: Bandeira da Noruega*\n\n    Repare que há várias formas de\
    \ criá-la: você pode desenhar um retângulo vermelho grande e uma cruz branca dentro\
    \ através de dois retângulos, para então fazer as azuis; ou ainda criar quatro\
    \ retângulos vermelhos e depois somente a cruz azul, utilizando o branco que já\
    \ há no canvas.\n\n4.  (Desafio) Você agora tem condições de criar a bandeira\
    \ do Brasil, em especial as partes verde, amarelo e azul. A faixa branca também\
    \ é possível, mas bastante complicada!\n\nQuerendo algo mais próximo para usar\
    \ em um jogo? Que tal o pacman? O código pode ser encontrado aqui:\n\n[http://jsfiddle.net/moreira/qRS5c/](http://jsfiddle.net/moreira/qRS5c/)\n\
    \n### 7.5 Cansei de repetir código! Funções novamente\n\nVamos desenhar vários\
    \ quadrados no nosso canvas e aprimorar nossas figuras. Mas será que precisaremos\
    \ ficar repetindo tantas vezes os códigos complicados com arcos, quadrados, estilos\
    \ e cores?\n\nPodemos usar o que já aprendemos e criar uma função para evitar\
    \ a repetição de código. Faremos isso num novo arquivo, o `canvas_loop.html`.\
    \ Dentro dele, vamos declarar o canvas e preparar nosso código para que possamos\
    \ começar a desenhar os quadrados de 50 por 50\\. Precisamos de uma função que\
    \ recebe a posição `x` e `y` onde ele vai ser desenhado. Ela se chamará `desenhaQuadradoVerde`:\n\
    \n```\n 1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n 2 \n 3\
    \ <script>\n 4 var desenhaQuadradoVerde = function(x,y) {\n 5   var tela = document.getElementById(\"\
    tela\");\n 6   var c = tela.getContext(\"2d\");\n 7   \n 8   c.fillStyle=\"green\"\
    ;\n 9   c.fillRect(x, y, 50, 50);\n10 };\n11 \n12 desenhaQuadradoVerde(0,0);\n\
    13 </script>\n```\n\nNa última linha estamos chamando a função para testar o que\
    \ programamos.\n\nSalve o arquivo e abra-o com o Chrome. O resultado é apenas\
    \ um pequeno quadrado verde.\n\n![Um quadrado verde... através da nossa função!](Images/quadrado_verde.png)*Figura\
    \ 7.9: Um quadrado verde... através da nossa função!*\n\n### 7.6 Loops e funções\
    \ para nos ajudar\n\nCom o auxílio de um loop, podemos fazer muitas outras imagens.\
    \ Vamos desenhar diversos quadrados de tamanho 50 por 50, começando da posição\
    \ zero do eixo X, indo até a posição 600.\n\nEdite seu arquivo `canvas_loops.html`\
    \ e vamos usar o `while` para fazer isso. Criaremos uma variável `x` que vai aumentando\
    \ de 50 em 50, até chegar em 600\\. Delete a chamada para `desenhaQuadradoVerde(0,0)`\
    \ e adicione as seguintes.\n\n```\n1 var x = 0;\n2 while(x < 600) {\n3   desenhaQuadradoVerde(x,\
    \ 0);\n4   x = x + 50; \n5 }\n```\n\nSalve e abra o arquivo no Chrome. Qual é\
    \ o resultado? Uma linha comprida verde!\n\n![Uma linha verde. Na verdade, uma\
    \ série de quadrados verde.](Images/linha_verde.png)*Figura 7.10: Uma linha verde.\
    \ Na verdade, uma série de quadrados verde.*\n\nPor quê? Pois a cada 50 pontos\
    \ nós desenhamos um novo quadrado. Não há divisão entre eles pois eles são verdes\
    \ em todos seus pontos. Para ficar mais visual, podemos alterar a função `desenhaQuadradoVerde`\
    \ para que o estilo do traçado da borda (`strokeStyle`) seja preta, adicionando\
    \ duas linhas:"
