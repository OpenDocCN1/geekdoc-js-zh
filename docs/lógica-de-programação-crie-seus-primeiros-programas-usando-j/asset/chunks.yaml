    \ que continham funções. Mas já havíamos trabalhado com outras funções, antes\
    \ mesmo de conhecer o que eram. A `document.write` e a `alert` são duas das muitas\
    \ funções que todo navegador vai disponibilizar para nós.\n\nVamos praticar mais\
    \ a utilização de variáveis e funções, além de conhecer outras que podemos utilizar\
    \ nos navegadores.\n\n### 3.1 Como está seu peso? Saudável?\n\nÍndice de Massa\
    \ Corporal, o IMC, é um indicador do grau de obesidade de uma pessoa. Pode ser\
    \ uma primeira forma de ter um sinal de que alguém está muito gordo ou muito magro.\
    \ A fórmula do IMC é simples: peso dividido pelo quadrado da altura.\n\nSerá que\
    \ conseguimos traduzir isso para JavaScript? Abra o editor de texto e crie um\
    \ novo arquivo, que gravaremos como `imc.html`. Para calcular o quadrado da altura,\
    \ basta multiplicarmos esse valor por ele mesmo, e depois utilizarmos para dividir\
    \ o peso.\n\n```\n1 var imc = peso / (altura * altura);\n```\n\nMas onde estão\
    \ definidas as variáveis peso e altura? Ainda não estão. É comum você ver códigos\
    \ de exemplo escritos dessa forma, isto é, sem estar por completo. Se você tentar\
    \ rodar um código assim, o JavaScript reclamará de que `altura` e `peso` não existem.\
    \ Experimente.\n\nVamos então dar valores e imprimir o resultado do `imc`:\n\n\
    ```\n1 var peso = 75;\n2 var altura = 1.72;\n3 var imc = peso / (altura * altura);\n\
    4 mostra(\"meu IMC é: \" + imc);\n```\n\nEstamos usando a nossa função `mostra`.\
    \ Para isso, ela precisa estar declarada no começo do arquivo. Lembre-se também\
    \ que precisamos das tags `<script>` e `</script>` envolvendo nosso código JavaScript,\
    \ caso contrário, ele seria mostrado no navegador, sem outros efeitos. Fique tranquilo!\
    \ Você rapidamente se ambientará a esse processo. E logo a seguir haverá uma seção\
    \ de revisão, na qual você poderá fazer esse código novamente, passo a passo.\n\
    \nSalve o arquivo `imc.html` e abra-o no navegador.\n\nUtilizamos nosso primeiro\
    \ número que possui casas decimais, o `1.72`. No JavaScript, sempre usaremos o\
    \ ponto como delimitador da parte inteira, e não a vírgula.\n\n### 3.2 Utilize\
    \ uma função para calcular o IMC de cada amigo\n\nMas e se agora precisarmos calcular\
    \ o IMC de seu primo? Podemos criar uma outra variável, `imcDoPrimo`, para guardar\
    \ esse resultado. Para isso, precisaríamos também ter o `pesoDoPrimo` e `alturaDoPrimo`.\
    \ Nosso código ficaria assim:\n\n```\n1 var pesoDoPrimo = 83;\n2 var alturaDoPrimo\
    \ = 1.76;\n3 var imcDoPrimo = pesoDoPrimo / (alturaDoPrimo * alturaDoPrimo);\n\
    4 mostra(\"o IMC de meu primo é: \" + imcDoPrimo);\n```\n\nAlgo em comum com o\
    \ código para calcular nosso próprio IMC? Sim! A fórmula continua sendo a mesma\
    \ e a chamada à função mostra também é bastante similar. Quando temos código sendo\
    \ repetido, devemos sempre pensar na possibilidade de criar uma função. Vamos\
    \ criar uma que seja responsável por calcular o IMC. Assim como a nossa função\
    \ `mostra`, essa precisará receber parâmetros para poder calcular seu resultado.\
    \ Que parâmetros precisamos para calcular o IMC? Serão dois, `peso` e `altura`,\
    \ que também declararemos dentro dos parênteses, usando a vírgula como separadora:\n\
    \n```\n1 function calculaIMC(altura, peso) {\n2   var imc = peso / (altura * altura);\n\
    3   mostra(\"IMC calculado é \" + imc);\n4 }\n```\n\nRepare que declaramos uma\
    \ variável `imc` dentro da nossa função. Dessa forma, essa variável só existe\
    \ aí dentro, não podendo ser acessada do lado de fora das chaves. Parece estranho,\
    \ mas isto é útil para organizar o código. Afinal quem vai usar essa nossa função\
    \ não precisa, e nem quer, ficar sabendo como esse cálculo é feito.\n\nCom a função\
    \ declarada, já podemos utilizá-la:\n\n```\n1 var pesoDoPrimo = 83;\n2 var alturaDoPrimo\
    \ = 1.76;\n3 calculaIMC(alturaDoPrimo, pesoDoPrimo);\n```\n\nSalve seu arquivo\
    \ `imc.html` e veja o resultado!\n\nUm resultado abaixo de `18.5` indica que a\
    \ pessoa está muito magra. Acima de `35` a obesidade é severa. Agora queremos\
    \ mostrar o quão distante o índice está de 18\\. Poderíamos fazer isto dentro\
    \ da função `calculaIMC` que acabamos de criar, mas seria isso tarefa para uma\
    \ função que calcula o IMC?"
