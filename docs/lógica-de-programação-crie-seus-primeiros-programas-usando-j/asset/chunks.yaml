  trans: "\n\n你可以以你认为最合适的方式组合这三个功能：`alert` 用于突出消息，`document.write` 用于在页面内部添加信息，以及\
    \ `console.log` 用于仅向我们（程序员）显示数据。\n\n在学习过程中，我们还会看到其他帮助我们发现代码中问题的方法和技术。即移除 `bugs`\
    \ 的方法，亦或是如何对我们的代码进行 `debugar`（调试）。\n\n## 2.12 了解更多：注释\n\n我们经常也想在代码中放入一段话，仅作为程序员的参考。在\
    \ JavaScript 中，我们可以使用 `//` 来实现这一点。`//` 之后的所有内容都将被浏览器忽略。请请看：\n\n```\n1 // 这个函数在浏览器中显示一句话并换行\n\
    2 function mostra(frase) {\n3   document.write(frase);\n4   pulaLinha();\n5 }\n\
    6 \n7 // 现在我们要在浏览器中放入我的出生年份：\n8 var ano = 2012;\n9 mostra(\"我出生于：\" + (ano - 25));\n\
    ```\n\n注释可以帮助你更好地组织代码。无论如何，拥有一个编写良好、具有表达性且意义的变量名的代码，始终比使用大量的注释更为重要。\n\n还有在 `/*`\
    \ 和 `*/` 之间放置注释的选项。这样一来，这两个标识符之间的所有内容都将被浏览器忽略，即使其中包含换行符。\n\n## 2.13 与你的朋友分享你的代码！\n\
    \n到目前为止，你都在自己的浏览器中运行程序。如果你想让朋友也能看到你正在做什么呢？如果你已经对互联网有所了解，可以将你的 `.html` 文件放置在 Web\
    \ 服务器上。但有一种非常简单的方法可以分享你的练习并展示你新学到的编程技能。\n\n有些网站允许你在表单内编写 HTML 和 JavaScript 代码，并快速查看结果。在网站上编写而不是在自己的电脑上编写有什么好处呢？答案是这些网站允许程序分享！在这里访问我们用于计算年龄的程序：\n\
    \n[`jsfiddle.net/55vSR/`](http://jsfiddle.net/55vSR/)\n\n这个网站将展示 4 个不同的空间：HTML、CSS、JavaScript\
    \ 和结果。我们感兴趣的是 JavaScript。由于这是一个特殊的页面，你不需要（也不应该）在该表单内使用 `script` 标签。你可以点击 `Run`（在顶部菜单）或按下\
    \ `CTRL+ENTER` 来运行代码。\n\n![通过 JSFiddle.net 网站共享的代码](img/jsfiddle.png) *图 2.3：通过\
    \ JSFiddle.net 网站共享的代码*\n\n你可以编辑这段代码并点击 `Save`。JSFiddle 会生成一个新地址，你可以与朋友和家人分享。这是向所有熟人展示你编程进步的一种有趣方式！由于浏览器加载\
    \ HTML 页面的方式，如果你使用 `console.log` 而不是 `document.write`，jsfiddle 的运行效果会更好。它甚至会提醒不要使用\
    \ `document.write`。\n\n你还可以创建一个账户，以便将所有的代码都组织在一起。\n\n在我们的讨论列表中分享你的代码和挑战吧！不要忘记参与，无论是提问还是展示你的成就：\n\
    \n[`groups.google.com/group/comece-a-programar/`](https://groups.google.com/group/comece-a-programar/)\n\
    \n还有其他替代方案，可能稍微复杂且更完整，例如 [`tinkerbin.com/`](http://tinkerbin.com/)、[`playground.html5rocks.com`](http://playground.html5rocks.com)\
    \ 和 [`codepen.io/`](http://codepen.io/)。\n\n## 第 3 章：通过解决日常生活中的问题来练习\n\n在上一章中，我们能够创建自己的变量，甚至是包含函数的特殊变量。但在我们知道什么是函数之前，其实已经处理过其他函数了。`document.write`\
    \ 和 `alert` 是每个浏览器为我们提供的许多函数中的两个。\n\n让我们多练习变量和函数的用法，并了解其他我们可以在浏览器中使用的函数。\n\n###\
    \ 3.1 你的体重如何？健康吗？\n\n身体质量指数，简称 IMC，是衡量一个人肥胖程度的指标。它可以作为判断一个人是否太胖或太瘦的第一种信号。IMC 公式非常简单：体重除以身高的平方。\n\
    \n我们能将其翻译成 JavaScript 吗？打开文本编辑器并创建一个新文件，将其命名为 `imc.html`。为了计算身高的平方，只需将该值乘以它，然后用它除以体重。\n\
    \n```\n1 var imc = peso / (altura * altura);\n```\n\n但是 `peso`（体重）和 `altura`（身高）变量在哪里定义的呢？还没有定义。你经常看到这样编写的示例代码，即是不完整的。如果你尝试运行这样的代码，JavaScript\
    \ 会抱怨 `altura` 和 `peso` 不存在。尝试一下。\n\n我们来给它们赋值并打印 `imc` 的结果：\n\n```\n1 var peso\
    \ = 75;\n2 var altura = 1.72;\n3 var imc = peso / (altura * altura);\n```\n\n\
    *(注：原文此处开始出现了大量重复段落，已按要求逐行翻译)*\n\n但是 `peso` 和 `altura` 变量在哪里定义的呢？还没有定义。你经常看到这样编写的示例代码，即是不完整的。如果你尝试运行这样的代码，JavaScript\
    \ 会抱怨 `altura` 和 `peso` 不存在。尝试一下。\n\n我们来给它们赋值并打印 `imc` 的结果：\n\n```\n1 var peso\
    \ = 75;\n2 var altura = 1.72;\n3 var imc = peso / (altura * altura);\n```\n\n\
    *(重复段落翻译略)*\n\n### 3.2 使用函数计算 IMC\n\n如果我们现在需要计算朋友的 IMC 呢？我们可以创建另一个变量 `imcPrimo`\
    \ 来存储该结果。为了这一点，我们需要有 `pesoPrimo` 和 `alturaPrimo`。我们的代码将如下：\n\n```\n1 var pesoPrimo\
    \ = 83;\n2 var alturaPrimo = 1.76;\n3 var imcPrimo = pesoPrimo / (alturaPrimo\
    \ * alturaPrimo);\n4 mostra(\"我朋友的 IMC 是：\" + imcPrimo);\n```\n\n"
- fmt: "\nEm vez disso, podemos fazer com que a `calculaIMC` não mostre o IMC e, como\
    \ o nome diz, apenas calcule seu valor, retornando-o para quem a chamou. Altere\
    \ sua função, removendo a linha do `mostra` e adicionando um `return`:\n\n```\n\
    1 function calculaIMC(altura, peso) {\n2 var imc = peso / (altura * altura);\n\
    3 return imc;\n4 }\n```\n\nAgora, na linha que faz a chamada a essa função, vamos\
    \ pegar o que ela retorna, para depois utilizar. Veja:\n\n```\n1 var pesoDoPrimo\
    \ = 83;\n2 var alturaDoPrimo = 1.76;\n3 var imcDoPrimo = calculaIMC(alturaDoPrimo,\
    \ pesoDoPrimo);\n4 mostra(\"O imc do meu primo é \" + imcDoPrimo);\n5 mostra(\"\
    Ele ainda está \" + (imcDoPrimo - 18.5) \n6     + \" pontos acima do limite da\
    \ magreza.\");\n```\n\nA variável `imcDoPrimo` vai receber o valor que foi retornado\
    \ pela função `calculaIMC` através da palavra-chave `return`. Teremos muitas funções\
    \ que trabalham dessa forma, recebendo alguns parâmetros, realizando uma tarefa\
    \ e depois devolvendo um resultado que será útil para quem a chamou. Esse valor\
    \ que volta para quem chamou a função é conhecido como retorno da função.\n\n\
    ### 3.3 Revise o código: calculando o IMC\n\nVamos revisar como deve estar seu\
    \ código do `imc.html`. Primeiramente precisamos declarar as funções que vamos\
    \ utilizar. Temos tanto a função `mostra` quanto a `pulaLinha`:\n\n```\n1 <script>\n\
    2 function pulaLinha() {\n3 document.write(\"<br>\");\n4 }\n5 \n6 function mostra(frase)\
    \ {\n7 document.write(frase);\n8 pulaLinha();\n9 }\n```\n\nAgora teremos nossa\
    \ função que, dados altura e peso, calcula o imc e o retorna:\n\n```\n1 function\
    \ calculaIMC(altura, peso) {\n2 var imc = peso / (altura * altura);\n3 return\
    \ imc;\n4 }\n```\n\nPronto, já podemos utilizar essa função, pegando o seu retorno,\
    \ seja para você ou para o seu primo:\n\n```\n1 var peso = 75;\n2 var altura =\
    \ 1.72;\n3 var imc = calculaIMC(altura, peso);\n4 \n5 mostra(\"Meu imc é \" +\
    \ imc);\n6 mostra(\"Ainda estou \" + (imc - 18.5) \n7     + \" pontos acima do\
    \ limite da magreza.\");\n8 </script>\n```\n\nVamos modificar um pouco nosso código,\
    \ praticando com exercícios.\n\n1.  Adicione uma linha de código para dizer o\
    \ quão distante você está da obesidade severa, que é o índice de 35.\n2.  Há uma\
    \ forma mais curta de escrever essas duas linhas:\n\n    ```\n    1 var imc =\
    \ calculaIMC(altura, peso);\n    2 mostra(\"Meu imc é \" + imc);\n    ```\n\n\
    \    Como estamos atribuindo o resultado do cálculo à variável `imc` e depois\
    \ utilizando-a na chamada ao `mostra`, poderíamos ter feito isso tudo dentro de\
    \ uma única linha, sem declarar a variável:\n\n    ```\n    1 mostra(\"Meu imc\
    \ é \" + calculaIMC(altura, peso));\n    ```\n\n    Faça o teste. Mas será que\
    \ é vantajoso? A linha que mostrava o quão distante você estava da magreza ficava\
    \ logo embaixo. O que acontecerá com ela agora que não temos mais a variável `imc`?\
    \ Não vai funcionar. Você poderia fazer o mesmo nas outras linhas, colocando `calculaIMC(altura,\
    \ peso)` em vez da variável, mas o navegador vai, a cada chamada, recalcular o\
    \ IMC, sendo que da forma anterior esse número foi calculado apenas uma única\
    \ vez e reaproveitado.\n\n3.  Você se lembra do `Math.round`? Ele também é uma\
    \ função, que todos os navegadores já possuem definida. E ela é uma função que\
    \ retorna um valor, por isso podemos fazer:\n\n    ```\n    1 mostra(\"Meu imc\
    \ é \" + Math.round(imc));\n    ```\n\n    Essa função retorna o número arredondado.\
    \ Uma outra opção seria utilizá-la no momento da declaração da variável `imc`.\
    \ Isto é, em vez de:\n\n    ```\n    1 var imc = calculaIMC(altura, peso);\n \
    \   ```\n\n    Você pode fazer:\n\n    ```\n    1 var imc = Math.round(calculaIMC(altura,\
    \ peso));\n    ```\n\n    Difícil? É uma forma comum de escrever código. Repare\
    \ nos parênteses: primeiro será calculado o IMC, para depois, o `Math.round` arredondar\
    \ esse valor.\n\n    Qual dos dois você vai utilizar? Depende. Se você quer sempre\
    \ trabalhar com o `imc` arrendondado, vale utilizar essa última forma. Se algumas\
    \ vezes utilizará arrendondado e outras da forma quebrada, é melhor utilizar o\
    \ `Math.round` só quando convier.\n\n### 3.4 Trabalhe com dados capturados: pergunte\
    \ a altura e peso do usuário\n\nSomos capazes de trabalhar com números e palavras,\
    \ mas todos eles estão dentro do nosso código, mesmo que organizados em variáveis\
    \ e funções. Se quisermos calcular o IMC de um outro amigo, precisaremos mudar\
    \ esse valores, salvar o arquivo e atualizar a página. Seria bastante interessante\
    \ poder ter informações sobre o usuário do nosso programa, sem ter de alterar\
    \ o código.\n\nQuando usamos o computador, é natural aparecer uma caixa de diálogo\
