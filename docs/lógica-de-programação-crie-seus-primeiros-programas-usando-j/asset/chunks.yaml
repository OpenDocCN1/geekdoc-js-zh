    \ *double buffer*, com o qual você utilizaria dois canvas para não sofrer esse\
    \ efeito. É um tópico mais avançado.\n\n|  |\n\n### 8.4 Revise e faça novas animações\n\
    \nCrie o arquivo `animacao.html`. Primeiro, declare seu canvas junto com as duas\
    \ funções: `circulo` e `limpaTela`:\n\n```\n 1 <canvas id=\"tela\" width=\"600\"\
    \ height=\"400\"></canvas>\n 2 <script>\n 3 var tela = document.getElementById(\"\
    tela\");\n 4 var c = tela.getContext(\"2d\");\n 5 \n 6 var circulo = function(x,\
    \ y, raio) {\n 7   c.fillStyle = \"blue\";\n 8   c.beginPath();\n 9   c.arc(x,\
    \ y, raio, 0, 2*Math.PI);\n10   c.fill();\n11 };\n12 \n13 var limpaTela = function()\
    \ {\n14   c.clearRect(0, 0, 600, 400);\n15 };\n```\n\nAgora declaramos a variável\
    \ `x` que vai mudar onde será desenhado o círculo. Também declaramos a função\
    \ `desenha`, que será chamada a cada 30 milissegundos, através do `setInterval`:\n\
    \n```\n 1 var x = 1;\n 2 \n 3 var desenha = function() {\n 4   limpaTela();\n\
    \ 5   circulo(x, 100, 10);\n 6   x = x + 1;\n 7 };\n 8 \n 9 setInterval(desenha,\
    \ 30);\n10 </script>\n```\n\nPronto! Pode abrir a sua página no navegador. Aqui\
    \ há um *jsfiddle* com o código pronto: [http://jsfiddle.net/8SmSS/](http://jsfiddle.net/8SmSS/)\n\
    \n1.  Em vez de fazer o círculo apenas se mover, faça com que ele também cresça.\
    \ Basta utilizar a variável `x` para definir o tamanho do raio. Você pode, por\
    \ exemplo, chamar `circulo(x, 100, x/2)`. Agora, remova a invocação ao `limpaTela`\
