    \ e apagar a tela 600 vezes!\n\nPara que possamos ver a animação ocorrer, precisamos\
    \ que, a cada novo quadro da animação, o computador espere alguns milésimos de\
    \ segundo. E existe uma função que faz isso: `setInterval`. Ela define de quanto\
    \ em quanto tempo você quer que uma determinada função seja chamada.\n\nRemova\
    \ o seu `for` e vamos escrever uma função que queremos ser chamada de tanto em\
    \ tanto tempo.\n\n```\n1 var x = 1;\n2 \n3 var desenha = function() {\n4   limpaTela();\n\
