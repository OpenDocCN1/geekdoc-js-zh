    我们将在书中的中使用 Notepad++，配合 Google Chrome 和 Windows 7。如果你使用的是 Linux 或 Mac，可能已经拥有了你偏好的编辑器。我们推荐在
    Linux 和 Mac 上使用 Sublime。当然，你也可以使用 vim、emacs 或任何你认为更合适的工具。


    在书中，我们使用了一些在 Windows 上截取的图像，另一些在 Mac 上，还有一些在 Linux 上。但它们之间没有什么明显的区别。


    ### 1.7 救命！我的程序无法运行。认识并使用 Chrome 控制台


    不要被错误吓到。知道如何面对它们非常重要。理解错误信息至关重要。总会有论坛和讨论列表，你可以在那里寻求帮助。记得要很好描述你的问题以及错误信息，但同时也需要保持简洁。GUJ
    论坛在各种语言的巴西开发者开发者社区中非常有名。利用它来解决你的疑问：[`www.guj.com.br`](http://www.guj.com.br)


    有一些非常常见的错误。例如在 `alert` 中没有使用括号。如果你这样做，此 `script` 标签内的任何内容都无法运行，且不会显示错误信息！测试一下，以错误的方式添加第二个
    `alert` 调用：


    ```

    1 <script>

    2 alert("podemos fazer mais com JavaScript!");

    3 alert "chamando sem parenteses";

    4 </script>

    ```


    浏览器甚至不会显示第一个 `alert`，而那里没有任何错误！那么如何发现问题呢？Chrome 有一个工具帮助我们完成这项任务。


    ![选择打开 JavaScript 控制台的菜单](img/chrome-console.png) 图 1.10：选择打开 JavaScript 控制台的菜单


    点击菜单/工具图标。它位于 Chrome 的右上角。然后访问 `工具` (`Tools`) 菜单，最后点击 `JavaScript 控制台`，如如图所示。将出现以下窗口，指示**语法错误**：


    ![打开的 Chrome JavaScript 控制台](img/chrome-console2.png) 图 1.11：打开的 Chrome JavaScript
    控制台


    在这种情况下，它正在提醒我们有一个“未预期的字符串”。有帮助吗？有时错误信息可能并不清晰，但通过指示问题所在的位置已经很有帮助了。注意，在错误信息的右侧，浏览器会显示问题发生在哪个文件以及哪一行。你甚至可以点击那里直接跳转到问题的代码段。


    通过这条错误信息，Chrome 想指出 `"chamando sem parenteses"` 出现在一个意料之外的地方，就像它在用一种它听不懂的“语言”说话。这种错误就是我们说的**语法错误**，即在与懂语言的人交流时形式上的错误。在这种特殊情况下，它不期望在括号之外出现这条消息。修复这个问题。


    用其他错误进行测试。例如，以错误的方式编写 `alert`，比如 `alertar`。


    同时，有些变化不会影响代码执行。例如，我们可以在 `alert` 和左括号之间加上空格。那么分号呢？我们可以省略它吗？引号呢？测试一下，发现它。在我们课程之外进行实验是非常重要的。


    对于 Firefox，可以通过访问 `工具` (`Tools`)、`Web 开发者` 然后是 `Web 控制台` 菜单来访问类似的控制台。在 Internet
    Explorer 9 中，你可以点击齿轮图标并选择 `F12 开发工具` (`Developer Tools`) 来找到它。


    ### 1.8 救命！重音显示不正常


    **仅在你使用 Mac 或 Linux 的情况下**，会出现一个小问题：重音显示不正确。当我们保存文件时，有不同的格式来以 `字节` 存储字符。Chrome
    默认会尝试用名为 `latin1` 的编码读取它。


    如果我们以其他格式保存文件，我们需要在 HTML 中包含这些信息，HTML 拥系列标签，这些标签甚至不标记文本，而是为文件提供元数据。如果你使用这些操作系统之一，请将以下行作为文件的第一行添加：`<meta
    charset="UTF-8">`。将其想象为 Word 文件的属性。这些信息不是直接提供给最终用户的，而是为了让浏览器能更好地处理该文件。


    ## 第 2 章：与用户通信


