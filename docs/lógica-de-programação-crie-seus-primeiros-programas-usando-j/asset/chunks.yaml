    \ caso o chute tenha sido errado. Para isso, utilizamos o `else`:\n\n```javascript\n\
    \ 1 <script>\n 2   var numeroPensado = Math.round(Math.random() * 100);\n 3 \n\
    \ 4   var chute = prompt(\"Já pensei. Qual você acha que é?\");\n 5   if(chute\
    \ == numeroPensado) {\n 6     mostra(\"Uau! Você acertou, pois eu pensei no \"\
    \ + numeroPensado);\n 7   } else {\n 8     mostra(\"Você errou! Eu tinha pensado\
    \ no \" + numeroPensado);\n 9   }\n10 </script>\n```\n\nPronto, agora ao abrir\
    \ esse programa em seu navegador, você será perguntado por um número. E logo em\
