    \ que você já fez.\n\n3.  A fonte do nosso programa talvez ainda não seja adequada.\
    \ Há uma tag HTML que se chama `big`. Faça com que a função `mostra` coloque a\
    \ frase entre `<big>` e `</big>`.\n\n4.  O que acontece se você esquecer a palavra\
    \ `function` na hora de declarar uma de suas funções? E os parênteses na declaração\
    \ da função `pulaLinha`? Faça os testes e veja as mensagens de erro no console\
    \ JavaScript do Chrome.\n\n### 2.11 Mostrando mensagens secretas, apenas para\
    \ o programador\n\nO `alert` joga uma mensagem dentro de um popup. Utilizá-lo\
    \ extensivamente pode acabar com a paciência do usuário, que precisará clicar\
    \ em *OK* a cada nova mensagem. O `document.write` é menos intrusivo, mas você\
    \ já reparou que as mensagens são jogadas diretamente na página, sem nem mesmo\
    \ um espaçamento entre as linhas. Isso porque o próprio documento html é alterado.\
    \ Se você quiser pular uma linha através do `document.write`, precisará utilizar\
    \ tags html, como o `<br>`, fazendo `document.write(\"olá mundo!<br>\");`, por\
    \ exemplo.\n\nMesmo colocando o `document.write` em uma função, muitas vezes queremos\
    \ que algumas mensagens não apareçam para o usuário, porém gostaríamos de poder\
    \ vê-las durante o desenvolvimento de nosso programa. Isto é, uma mensagem que,\
    \ de alguma forma, fosse visível apenas para você, programador. Isso é muito útil\
    \ para descobrir erros (o que chamamos de **bug**), aprender novos truques e testar\
    \ recursos. Guardamos esses dados em **logs**. É comum usar o neologismo **logar**,\
    \ assim mesmo, em português. Para logar informações com JavaScript, há a função\
    \ `console.log`. Faça um teste:\n\n```\n1 <script>\n2 document.write(\"olá mundo!\"\
    );\n3 document.write(\"esse é meu segundo programa\");\n4 console.log(\"esta mensagem\
    \ aparece apenas no log\");\n5 </script>\n```\n\nQual é o resultado?\n\nA mensagem\
    \ passada ao `console.log` não apareceu! Quando utilizamos essa função, o navegador\
    \ guarda todas as mensagens em um local especial, longe da vista do usuário comum.\
    \ Para ver o resultado precisamos habilitar a visualização do console, exatamente\
    \ como fizemos na lição anterior para verificar erros.\n\nNo Chrome, você faz\
    \ isso clicando no pequeno ícone de ferramentas/menus, escolhe a opção *Ferramentas*\
    \ (*Tools*, se estiver em inglês) e depois *Console JavaScript*. É o mesmo console\
    \ que você usou para ver as mensagens de erro do seu código:\n\n![Console de JavaScript\
    \ do Chrome com o log](Images/console_log.png)*Figura 2.2: Console de JavaScript\
    \ do Chrome com o log*\n\nHá a tecla de atalho *CTRL+SHIFT+J* no Windows e no\
    \ Linux para abrir essa aba (*Command+Option+J* no Mac) e depois clicar no Console,\
    \ caso outra opção esteja selecionada. Ele realmente é importante e você estará\
    \ visitando-o com frequência."
