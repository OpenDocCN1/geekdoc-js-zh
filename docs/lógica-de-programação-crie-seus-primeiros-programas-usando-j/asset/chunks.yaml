    \ Não se preocupe com isso, neste momento.\n\n|  |\n\n## Capítulo 4: Execute códigos\
    \ diferentes dependendo da condição\n\nNem sempre queremos executar um código.\
    \ Como fazemos para decidir se uma linha deve ser ou não executada? Como expressar\
    \ uma condição? Vamos ver novos comandos e nos aprofundar na lógica de programação.\n\
    \n### 4.1 Quantos pontos tem seu time de futebol?\n\nO Casa Do Código Futebol\
    \ Clube completou seu 15o jogo no campeonato brasileiro. Como estamos indo? Depende\
    \ do número vitórias, empates e derrotas. Por exemplo, se foram 7 vitórias, 4\
    \ empates e 4 derrotas, podemos calcular a situação atual do time como (7 * 3)\
    \ + 4, totalizando 25 pontos.\n\nIsto é, a conta é realizada através da expressão\
    \ `(vitorias * 3) + empates`, já que cada vitória vale 3 pontos e o empate vale\
    \ 1 ponto. Podemos capturar a qualquer momento quantos jogos foram vencidos e\
    \ quantos empates houve, com uso da função `prompt`.\n\nVamos criar um novo arquivo,\
    \ o `pontos_futebol.html`, com as nossas já conhecidas funções `mostra` e `pulaLinha`\
    \ e depois temos:\n\n```\n1 var vitorias = prompt(\"Quantos jogos o CDC Futebol\
    \ Clube venceu?\");\n2 var empates = prompt(\"Quantos jogos o CDC Futebol Clube\
    \ empatou?\");\n3 var pontos = (vitorias * 3) + empates;\n4 \n5 mostra(\"Nosso\
    \ time tem \" + pontos + \" pontos!\");\n```\n\nAbra o arquivo `pontos_futebol.html`\
    \ e faça um teste, colocando 3 vitórias e 1 empate. Qual é o resultado? Deveriam\
    \ ser 10 pontos, mas o resultado sai 91!? Por que?\n\nO JavaScript multiplicou\
    \ 3 * 3, resultando 9\\. Mas ao somar com o número de empates, em vez denele fazer\
    \ isso matematicamente, ele juntou os dois valores, concatenou os dois valores,\
    \ como acontece com as *strings*.\n\n#### Por que a concatenação e não a soma?\n\
    \nA explicação é bem simples. Quando utilizamos o `prompt`, o JavaScript considera\
    \ o que digitamos na caixa como sendo um texto, ou seja, uma *string*.\n\nLembre-se\
    \ que aprendemos que quando somamos em um texto, seja o que for, o conteúdo acabava\
    \ sendo concatenado? Por isso, se fizermos `var teste = 9 + \"1\";` e mostrarmos\
    \ a variável `teste`, veríamos que o resultado seria `91`. Por que não aconteceu\
    \ isso na conta com `vitorias`? Pois como era a multiplicação, o JavaScript tentou\
    \ converter para número, sem precisar que a gente falasse nada.\n\nTambém tivemos\
    \ essa \"sorte\" na nossa função que calcula o IMC, pois não fizemos somas com\
    \ as variáveis que pegamos ao fazer o `prompt`. Vamos precisar resolver isso agora,\
    \ pois esse tipo de problema, que pode aparecer ao misturar números e *strings*,\
    \ é bem frequente.\n\n#### Como resolvo? Não queria concatenar com empates!\n\n\
    Já percebemos que o problema acontece por tentarmos somar um número com um texto\
    \ (uma `string`). Se queremos fazer uma soma, precisamos que as duas variáveis\
    \ contenham valores que sejam números. Queremos que eles sejam do **tipo** número.\n\
    \nVocê não é o primeiro a passar por esse problema. Justamente para isso, o JavaScript\
    \ possui uma função própria, chamada `parseInt()`. Não se assuste com esse nome\
    \ estranho, apenas lembre-se que o objetivo dela é \"transformar\" texto em número,\
    \ para que possamos fazer as operações matemáticas corretamente.\n\nVamos fazer\
    \ um primeiro teste para enxergar bem esse problema. Experimente criar uma `string`\
    \ que contenha apenas números. Somando-a com um número, ocorrerá concatenação:\n\
    \n```\n1 var vitorias = 3;\n2 var empates = \"1\"; // string!\n3 var pontos =\
    \ vitorias * 3 + empates;\n4 alert(total);\n```\n\nMas se invocarmos a função\
    \ `parseInt`, o retorno dela será um número, permitindo a correta manipulação\
    \ matemática. Repare:"
