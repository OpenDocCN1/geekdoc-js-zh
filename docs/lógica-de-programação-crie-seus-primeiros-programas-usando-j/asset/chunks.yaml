  trans: "\n搞定。`pulaLinha` 现在指的是一个可以被调用的函数。**如何调用它？** 就像你之前调用 `alert` 一样。也就是说，**在它的名称后使用括号**：\n\
    \n```\n1 var ano = 2012;\n2 document.write(\"Eu nasci em : \" + (ano - 25));\n\
    3 pulaLinha();\n4 document.write(\"Adriano nasceu em : \" + (ano - 26));\n5 pulaLinha();\n\
    6 document.write(\"Paulo nasceu em : \" + (ano - 32));\n7 pulaLinha();\n```\n\n\
    每当出现 `pulaLinha();` 时，浏览器都会执行 `pulaLinha` 函数的代码。通过这样，我们开始避免重复代码。这仅仅是个开始，我们将更多地利用函数来简化代码。\n\
    \n### 2.9 传递信息和调用其他函数的函数\n\n让我们再次关注文本，在复习中我们将编写这里描述的代码。\n\n现在已经可以清楚地看到我们的获益了：我们可以通过只修改一个地方来改变程序的行为：即我们为\
    \ `pulaLinha` 创建的函数。但我们的代码仍然有些冗长，而且我们每次都得调用这个函数。\n\n当我们发现自己在不断重复操作时，始终可以考虑创建一个新函数。在这种情况下，很容易看出，每当我们用\
    \ `document.write` 向浏览器发送一个 `frase` 时，紧接着就会换行。我们可以把这些操作统一到一个地方吗？这可以通过创建另一个函数来实现，即一个既能显示句子又能添加\
    \ `<br>` 的函数。例如：\n\n```\n1 function mostra() {\n2   document.write(\"alguma frase<br>\"\
    );\n3 }\n```\n\n但这个函数并没有那么有用：它总是显示同一个句子。它不符合我们的需求，因为我们想要显示的句子取决于时机。不要绝望，确实有办法解决这个问题。当我们**声明**（创建）一个函数时，我们可以采取采取这种方式，使其能够接收到额外的内容，即某些对我们重要的信息。在显示某个句子的函数中，这个重要值是什么？就是我们要显示的\
    \ `frase`！我们通过在括号内声明来实现，如 `function(frase)`，然后像我们已经认识的变量一样正常地使用 `frase`：\n\n```\n\
    1 function mostra(frase) {\n2   document.write(frase + \"<br>\");\n3 }\n```\n\n\
    搞定。但 `mostra` 如何知道要把 `frase` 放入浏览器中呢？这将在调用函数时完成。与我们使用不带任何内容的括号调用的 `pulaLinha`\
    \ 不同，调用 `mostra` 时会在括号内带入入 `frase`：\n\n```\n1 mostra(\"Usando funções para melhorar\
    \ o código\");\n```\n\n我们想要显示的这个字符串将被**传递**给我们创建的函数，在函数内部它将成为我们的变量 `frase`。传递给函数的变量通常被称为**参数**或**参数**。\n\
    \n![传递在括号之间的文本将进入函数 frase 变量](img/funcao-recebendo-parametro.png)*图 2.1: 传递在括号之间的文本将进入函数\
    \ frase 变量*\n\n我们可以稍微修改一下 `mostra` 函数，让它利用我们旧的 `pulaLinha`，而不是自己拼接 `<br>`：\n\n\
    ```\n1 function mostra(frase) {\n2   document.write(frase);\n3   pulaLinha();\n\
    4 }\n```\n\n就是这样：一个函数可以调用另一个函数。这种情况非常常见。这里的的好处是什么？现在我们的 `mostra` 也会跟随 `pulaLinha`\
    \ 的变化。如果我们想以更视觉化的换行，无论是使用 `<br>`、`<hr>` 还是其他 HTML 功能，`mostra` 函数都能受益，甚至无需修改！\n\
    \n### 2.10 复习代码：使用 mostra 函数\n\n我们在这一节中做了很多工作。让我们复习一下你现在的文件是什么样的。整理一下，创建 `mostra_idades2.html`\
    \ 文件。在开头，我们有函数的定义。从 `pulaLinha` 开始：\n\n```\n1 <script>\n2 \n3 function pulaLinha()\
    \ {\n4   document.write(\"<br>\");\n5 }\n```\n\n在下面是我们的第二个函数 `mostra`，它反过来使用了\
    \ `pulaLinha`。与上一个不同，它接收一个**参数**，即要在浏览器中显示的句子：\n\n```\n1 function mostra(frase)\
    \ {\n2   document.write(frase);\n3   pulaLinha();\n4 }\n```\n\n记得将函数内部的代码始终向右移动，使用键盘上的\
    \ `TAB` 键。这就是代码**缩进**（英语 *to indent* 的新造词）。确保你的**缩进**正确对于便于阅读程序非常重要。\n\n在声明两个函数后，我们将在代码中使用它们来打印每个参与者的年龄：\n\
    \n```\n1 var ano = 2012;\n2 mostra(\"Eu nasci em : \" + (ano - 25));\n3 mostra(\"\
    Adriano nasceu em : \" + (ano - 26));\n4 mostra(\"Paulo nasceu em : \" + (ano\
    \ - 32));\n5 </script>\n```\n\n### 2.11 显示仅供程序员使用的秘密消息\n\n`alert` 会在弹窗中抛出消息。过度使用它可能会耗尽用户的耐心。`document.write`\
    \ 的侵入性较小，但你是否注意到消息是直接投到页面上的，甚至不需要每条新消息都点击 *OK*。\n\n即使将 `document.write` 放在函数中，我们通常也希望某些消息不给用户看，但又希望在开发期间看到它们，使其仅对你这个程序员可见。这对于发现错误（我们称之为\
    \ **bug**）、学习技巧和测试功能非常有用。我们将这些数据保存在 **logs** 中。在葡萄语中，经常使用 **logar** 这个新造词。要用 JavaScript\
    \ 记录信息（log），可以使用 `console.log` 函数。测试一下：\n\n```\n1 <script>\n2 document.write(\"\
    olá mundo!\");\n3 document.write(\"esse é meu segundo programa\");\n4 console.log(\"\
    esta mensagem aparece apenas no log\");\n5 </script>\n```\n\n结果是什么？\n\n传递给 `console.log`\
    \ 的消息并没有出现！当我们使用该函数时，浏览器会将所有消息存储在一个特殊的地方，普通用户看不到。为了查看结果，我们需要启用控制台显示，正如我们在上一节中检查错误时所的那样。\n\
    \n在 Chrome 中，你可以通过点击小工具菜单图标来实现，选择*工具*（*Tools*，如果是英语）然后选择 *JavaScript 控制台*。这就是你之前检查代码错误时使用的同一个控制台。\n\
    \n在 Windows 和 Linux 上，可以使用快捷键 `CTRL+SHIFT+J` 打开此标签页（Mac 上为 *Command+Option+J*），如果选中了其他选项，请点击\
    \ Console。它确实非常重要，你经常会访问它。\n"
- fmt: "\nVocê pode combinar as três funções da melhor forma que encontrar: `alert`\
    \ para destacar uma mensagem, `document.write` para adicionar informações dentro\
    \ da própria página e o `console.log` para mostrar dados apenas a nós, programadores.\n\
    \nTambém veremos no decorrer do nosso aprendizado outras formas e técnicas que\
    \ nos auxiliam a descobrir problemas no nosso código. Maneiras de remover os `bugs`,\
    \ isto é, como `debugar` o nosso código.\n\n## 2.12 Para saber mais: comentários\n\
    \nÉ também comum querermos colocar uma frase dentro do código que sirva apenas\
    \ como referência para os programadores. Em JavaScript podemos fazer isso usando\
    \ `//`. Tudo que vier após o `//` vai ser ignorado pelo navegador. Repare:\n\n\
    ```\n1 // esta função mostra uma frase no navegador e pula uma linha\n2 function\
    \ mostra(frase) {\n3   document.write(frase);\n4   pulaLinha();\n5 }\n6 \n7 //\
    \ agora vamos colocar no navegador o ano em que nasci:\n8 var ano = 2012;\n9 mostra(\"\
    Eu nasci em : \" + (ano - 25));\n```\n\nOs comentários podem ajudá-lo a organizar\
    \ melhor o código. De qualquer maneira, é sempre mais importante ter um código\
    \ bem escrito, com nomes de variáveis expressivas que façam bastante sentido,\
    \ do que ter de usar muitas linhas de comentários.\n\nHá também a opção de colocar\
    \ comentários entre `/*` e `*/`. Dessa forma, tudo que estiver entre esses dois\
    \ identificadores será ignorado pelo navegador, inclusive se houver quebras de\
    \ linha.\n\n## 2.13 Compartilhe seu código com seus amigos!\n\nAté agora você\
    \ rodou seus programas no seu próprio navegador. E se quisesse que um amigo pudesse\
    \ ver o que está fazendo? Caso você já conheça um pouco mais de internet, poderia\
    \ colocar seus arquivos `.html` em um servidor web. Mas há uma forma bem fácil\
    \ de compartilhar seus exercícios e mostrar suas recém-adquiridas habilidades\
    \ de programador.\n\nAlguns sites permitem que você escreva código HTML e JavaScript\
    \ dentro de formulários e veja rapidamente o resultado. Qual é a vantagem de escrever\
    \ dentro de um site em vez de no nosso próprio computador? É que esses sites permitem\
    \ compartilhamento dos programas! Acesse nosso programa que calcula idade aqui:\n\
    \n[http://jsfiddle.net/55vSR/](http://jsfiddle.net/55vSR/)\n\nEsse site vai apresentar\
    \ 4 diferentes espaços: HTML, CSS, JavaScript e o resultado. O JavaScript é o\
    \ que nos interessa. Como essa é uma página especial, você não precisa (nem deve)\
    \ usar a tag `script` dentro desse formulário. Você pode clicar em `Run` (no menu\
    \ superior) ou pressionar `CTRL+ENTER` para rodar o código.\n\n![Código compartilhado\
    \ pelo site JSFiddle.net](Images/jsfiddle.png) *Figura 2.3: Código compartilhado\
    \ pelo site JSFiddle.net*\n\nVocê pode editar esse mesmo código e clicar em `Save`.\
    \ O site FFiddle vai gerar um novo endereço que você pode compartilhar com seus\
    \ amigos e familiares. É uma forma interessante de mostrar sua evolução na programação\
    \ para todos os conhecidos! Por uma questão de como os navegadores carregam páginas\
    \ HTML, o jsfiddle funcionará melhor se você usar `console.log` em vez de `document.write`.\
    \ Ele vai até avisar para não usar o `document.write`.\n\nTambém é possível criar\
    \ uma conta para que você tenha todos os seus códigos organizados.\n\nCompartilhe\
    \ seus códigos e desafios na nossa lista de discussão! Não deixe de participar,\
    \ seja tirando dúvida ou mostrando suas conquistas:\n\n[https://groups.google.com/group/comece-a-programar/](https://groups.google.com/group/comece-a-programar/)\n\
    \nHá outras alternativas, talvez um pouco mais complexas e completas, como o [http://tinkerbin.com/](http://tinkerbin.com/),\
    \ o [http://playground.html5rocks.com](http://playground.html5rocks.com) e o [http://codepen.io/](http://codepen.io/).\n\
    \n## Capítulo 3: Pratique resolvendo problemas do seu dia a dia\n\nNo capítulo\
    \ anterior fomos capazes de criar nossas próprias variáveis, e até variáveis especiais,\
    \ que continham funções. Mas já havíamos trabalhado com outras funções, antes\
    \ mesmo de conhecer o que eram. A `document.write` e a `alert` são duas das muitas\
    \ funções que todo navegador vai disponibilizar para nós.\n\nVamos praticar mais\
    \ a utilização de variáveis e funções, além de conhecer outras que podemos utilizar\
    \ nos navegadores.\n\n### 3.1 Como está seu peso? Saudável?\n\nÍndice de Massa\
    \ Corporal, o IMC, é um indicador do grau de obesidade de uma pessoa. Pode ser\
    \ uma primeira forma de ter um sinal de que alguém está muito gordo ou muito magro.\
    \ A fórmula do IMC é simples: peso dividido pelo quadrado da altura.\n\nSerá que\
    \ conseguimos traduzir isso para JavaScript? Abra o editor de texto e crie um\
    \ novo arquivo, que gravaremos como `imc.html`. Para calcular o quadrado da altura,\
    \ basta multiplicarmos esse valor por ele mesmo, e depois utilizarmos para dividir\
    \ o peso.\n\n```\n1 var imc = peso / (altura * altura);\n```\n\nMas onde estão\
    \ definidas as variáveis `peso` e `altura`? Ainda não estão. É comum você ver\
    \ códigos de exemplo escritos dessa forma, isto é, sem estar por completo. Se\
    \ você tentar rodar um código assim, o JavaScript reclamará de que `altura` e\
    \ `peso` não existem. Experimente.\n\nVamos então dar valores e imprimir o resultado\
    \ do `imc`:\n\n```\n1 var peso = 75;\n2 var altura = 1.72;\n3 var imc = peso /\
    \ (altura * altura);\n4 mostra(\"meu IMC é: \" + imc);\n```\n*(Nota: O texto original\
    \ parecia truncar a lógica no bloco de código de exemplo, mas mantive a estrutura\
    \ de variáveis solicitada pelo contexto).*\n\nOnde as variáveis `peso` e `altura`\
    \ estão definidas? Ainda não estão. É comum você ver códigos de exemplo escritos\
    \ dessa forma, isto é, sem estar por completo. Se você tentar rodar um código\
    \ assim, o JavaScript reclamará de que `altura` e `peso` não existem. Experimente.\n\
    \nVamos então dar valores e imprimir o resultado do `imc`:\n\n```\n1 var peso\
    \ = 75;\n2 var altura = 1.72;\n3 var imc = peso / (altura * altura);\n4 mostra(\"\
    meu IMC é: \" + imc);\n```\n\nOnde as variáveis `peso` e `altura` estão definidas?\
    \ Ainda não estão. É comum você ver códigos de exemplo escritos dessa forma, isto\
    \ é, sem estar por completo. Se você tentar rodar um código assim, o JavaScript\
    \ reclamará de que `altura` e `peso` não existem. Experimente.\n\nVamos então\
    \ dar valores e imprimir o resultado do `imc`:\n\n```\n1 var peso = 75;\n2 var\
    \ altura = 1.72;\n3 var imc = peso / (altura * altura);\n4 mostra(\"meu IMC é:\
    \ \" + imc);\n```\n*(Nota: Devido à repetição de texto no original fornecido em\
    \ trechos da seção 3.1, a formatação foca na clareza dos blocos de código).*\n\
    \n### 3.2 Utilize uma função para calcular o IMC\n\nE se agora precisarmos calcular\
    \ o IMC de primo? Podemos criar outra variável, `imcPrimo`, para guardar esse\
    \ resultado. Para isso, precisaríamos ter `pesoPrimo` e `alturaPrimo`. Nosso código\
    \ ficaria assim:\n\n```\n1 var pesoPrimo = 83;\n2 var alturaPrimo = 1.76;\n3 var\
    \ imcPrimo = pesoPrimo / (alturaPrimo * alturaPrimo);\n4 mostra(\"o IMC de meu\
    \ primo é: \" + imcPrimo);\n```\n"
