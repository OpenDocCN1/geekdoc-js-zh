- fmt: "\nRepare que, se encontramos o número e exibirmos a mensagem de alerta, fazemos\
    \ um `return`. Como vimos, o comando `return` pode ser usado simplesmente para\
    \ parar a execução de uma função que não retorna nada. Se você remover esse `return`,\
    \ perceba que ele vai acabar adicionando o número ao nosso array mesmo se já repetido.\
    \ Se fosse um `break`, funcionaria?\n\n1. Este é um exercício difícil! Você deve\
    \ sortear 6 números de 1 a 60 e guardar numa array. Depois peça para o usuário\
    \ dizer 6 números, um de cada vez (pode usar um `prompt` ou um `input`) e guarde-os\
    \ em uma outra array. Aí diga quantos números ele acertou. Sim, é a loteria certinha\
    \ desta vez!\n\n   Tente acertar os 6 números. Depois faça as contas de quantas\
    \ chances você tem de acertar todos os 6. Você nunca mais vai jogar na loteira!\n\
    \n## Capítulo 7: Apêndice - Gráficos para deixar tudo mais interessante\n\nTer\
    \ uma resposta visual ao nosso trabalho pode ser bastante recompensador. Vamos\
    \ aprender a usar algumas funções do JavaScript para desenhar numa tela (num `canvas`)\
    \ do HTML, para praticar o que aprendemos e ir além. Impressione seus amigos com\
    \ imagens interessantes e mostre pra gente o que conseguiu fazer! Lembre-se de\
    \ participar da nossa lista de discussão.\n\nHaverá um pouco de matemática, mas\
    \ não se assuste. Será bem simples e você não precisa se preocupar com detalhes.\
    \ O importante é sempre enxergar como as funções, variáveis, `ifs` e `fors` estão\
    \ trabalhando juntos.\n\nSe você está lendo a versão impressa, não terá as cores\
    \ exatas para praticar os exercícios, mas não é um problema, você pode escolher\
    \ a que achar adequada.\n\n### 7.1 Desenhe linhas e figuras\n\nVamos definir uma\
    \ área da nossa página para que possamos desenhar nela via JavaScript. Crie o\
    \ arquivo `canvas.html` e declare a área que utilizaremos para pintar da seguinte\
    \ maneira:\n\n```\n1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n\
    ```\n\nIsso mesmo, apenas uma única linha, sem a tag `script`. Abra seu HTML no\
    \ Chrome, qual foi o resultado? Isso mesmo, uma tela de 600x400 branca num fundo...\
    \ também branco! Não dá para perceber nada. Vamos desenhar um retângulo verde\
    \ (`green`) à esquerda, no ponto `0,0` (canto superior esquerdo) de tamanho `200,400`\
    \ (indo até o ponto inferior, um terço do valor máximo possível, que é 600). Aqui\
    \ estamos trabalhando em um plano de duas dimensões, onde a vírgula separa a posição\
    \ X da posição Y.\n\nPra fazer isso, teremos de usar funções do JavaScript que\
    \ ainda não conhecemos muito. Não se preocupe, você vai aprender bastante sobre\
    \ elas mais pra frente. É natural (apesar de não ser o ideal) testar novas funções\
    \ e comandos que ainda não dominamos.\n\nAdicione as seguintes linhas logo abaixo\
    \ à declaração do seu canvas.\n\n```\n1 <script>\n2 var tela = document.getElementById(\"\
    tela\");\n3 var c = tela.getContext(\"2d\");\n4 \n5 c.fillStyle=\"green\";\n6\
    \ c.fillRect(0, 0, 200, 400);\n7 </script>\n```\n\nAbra seu HTML, temos a seguinte\
    \ figura:\n\n![Uma simples coluna verde](Images/verde.png) Figura 7.1: Uma simples\
    \ coluna verde\n\nAs duas primeiras não nos importam por enquanto. Você pode imaginar\
    \ que a variável `c` é como se fosse um pincel. Podemos trocar o estilo do pincel\
    \ (através da variável `fillStyle`) e desenhar diversas formas (no caso, um retângulo,\
    \ chamando a função `fillRect`).\n\nA função `fillRect` recebe quatro números\
    \ para pintar um retângulo. Os dois primeiros são a posição X,Y. Os outros dois\
    \ são a largura e a altura do retângulo. Nesse caso, estamos pintando um retângulo\
    \ na posição `0,0` de 200 de largura por 400 de altura.\n\nComo ter uma ideia\
    \ melhor de onde isso vai parar na tela? O ponto `0,0` é o canto superior esquerdo.\
    \ O ponto `600,400` é o inferior direito. Repare em alguns outros pontos espalhados\
    \ nas nossas coordenadas X e Y:\n\n![Coordenadas do nosso plano. Utilize essa\
    \ figura como referência para saber onde traçar seus objetos!](Images/plano.png)\
    \ Figura 7.2: Coordenadas do nosso plano. Utilize essa figura como referência\
    \ para saber onde traçar seus objetos!\n\nVamos adicionar mais um retângulo, agora\
    \ em vermelho, começando na posição `400,0`. Adicione logo após o seu retângulo\
    \ verde:\n\n```\n1 c.fillStyle=\"red\";\n2 c.fillRect(400, 0, 200, 400);\n```\n\
    \nO resultado acaba em pizza! Temos a bandeira da Itália.\n\n![Bandeira da Itália](Images/italia.png)\
    \ Figura 7.3: Bandeira da Itália\n\nExperimente trocar as cores, como `gray`,\
    \ `red`, `green`, `blue`, `black` etc.\n\n### 7.2 Criando todo tipo de imagem\n\
    \nA função `fillRect` é simples e direta. Recebe a coordenada de início, além\
    \ da altura e largura. Desenhar outras figuras dá um pouco mais de trabalho. Você\
    \ precisa ir traçando o caminho, para depois chamar a função que preenche o que\
    \ foi traçado.\n\nPor exemplo, queremos fazer um triângulo no meio da bandeira,\
    \ em cinza (`gray`), como este:\n\n![Agora com um triângulo](Images/triangulo.png)\n\
    \nPara isso, precisamos começar do. Existe a função `arc`, que precisa de muitas\
    \ informações. São as coordenadas X e Y, o raio, o ângulo inicial e o ângulo final,\
    \ ambos em radianos. Nada simples. Ele precisa dos ângulos iniciais e finais para\
    \ desenhar apenas um pedaço de círculos. Vamos usar de 0 até 3.14, que é a circunferênciaira.\n\
    \n```\n1 c.fillStyle=\"blue\";\n2 c.beginPath();\n3 c.arc(300, 200, 50, 0, 3.14);\n\
    4 c.fill();\n```\n\nO valor de `3.14` é o PI. Estamos usando apenas duas decimais.\
    \ Esse valor de PI pode ser substituído por `Math.PI`, que é uma variável já existente\
    \ no JavaScript. Faça essa substituição. Valores fixos em variáveis como essa\
    \ são frequentemente referadas como constantes.\n\nVimos muitas funções nesse\
    \ capítulo. Como seria possível lembrar de todas elas? Ou saber qual é a ordem\
    \ que devo passar os parâmetros? A linha `c.arc(300, 200, 50, 0, 3.14)` parece\
    \ bastante complicada.\n\n### 7.3 Não vou conseguir lembrar de tudo isso! APIs\
    \ e bibliotecas\n\nO nosso código não parece tão difícil, mas como é que vamos\
    \ saber a existência dessas funções de desenhar no canvas? Se você reparar, vimos\
    \ mais de 5 funções diferentes, entre elas `fillRect`, `beginPath`, `moveTo`,\
    \ `lineTo` e `fill`. Além disso usamos a variável `fillStyle`. É muita coisa para\
    \ memorizar!\n\nE você nem deve se preocupar tanto em memorizá-las. Claro, se\
    \ você utilizá-las com frequência, isso se tornará fácil. Pense no nosso `document.write`,\
    \ no `alert` e outras funções que não apareceram apenas uma vez durante nosso\
    \ aprendizado. Mas e essas do canvas? E esse tal \"contexto 2d\", que apareceu\
    \ no `tela.getContext(\"2d\")` e mal falamos dele?\n\nAcontece que sempre temos\
    \ uma documentação das principais funções do JavaScript. Por exemplo, todas as\
    \ funções e variáveis que usamos para trabalhar com o canvas podem ser encontradas\
    \ aqui, bem documentadas:\n"
