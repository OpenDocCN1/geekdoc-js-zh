    ## Capítulo 2: Comunique-se com o usuário


    Acabamos de conseguir fazer o primeiro programa nos obedecer e mostrar uma mensagem
    para o usuário, o que já é um grande passo. Vamos escrever códigos mais elaborados,
    divertidos e interessantes a partir de agora. Você vai começar a perceber o poder
    a programação pode ter e já será um bom passo para que comece a exercitar sua
    própria criatividade, além de ganhar o hábito de programar. Preparado?


    ### 2.1 Dê olá ao mundo de outras formas


    O `alert` é nossa primeira forma de comunicação com o usuário. Como podemos fazer
    para enviar duas mensagens? Basta executarmos duas vezes essa instrução. Crie
    um novo arquivo, que será gravado `comecando_javascript.html`, e coloque o seguinte
    conteúdo:


    ```

    1 <script>

    2 alert("olá mundo!");

    3 alert("esse é meu segundo programa");

    4 </script>

    ```


    Você poderia ter utilizado o mesmo arquivo da lição anterior, mas é bom aqui criarmos
    um novo para poder acompanhar nosso aprendizado. Lembre-se de salvá-lo e depois
    abri-lo no seu navegador.


    Verifique o resultado. Pode ser um pouco trabalhoso ter de ficar clicando no botão
    de *OK* a cada novo `alert`. Imagine se tivéssemos 15 mensagens para serem mostradas?
    Você teria que dar 15 cliques no botão *OK*. Chato, não?


    Há várias formas de se comunicar com o usuário através do JavaScript e uma delas
    é através do `document.write`. Crie um novo arquivo, o `programa.html` com o seguinte
    código:


    ```

    1 <script>

    2 document.write("olá mundo!");

    3 document.write("esse é meu segundo programa");

    4 </script>

    ```


    Acesse a página e verifique o resultado.


    Para não aparecer tudo numa única linha, você pode usar a tag `<br>`, que já conhecemos,
    para quebrá-la. Em vez de fazer `document.write("olá mundo!");`, faça `document.write("olá
    mundo!`**`<br>`**`");`. Salve o arquivo e atualize a página. Entendeu a função
    da tag `<br>`?


    ### 2.2 Trabalhe com números


    Por enquanto só trabalhamos com mensagens fixas, estáticas. Trabalhamos com **sequências
    de caracteres** definidas entre os sinais das aspas. `"Casa do código"` é uma
    sequência de caracteres. `"Olá Mundo"` é uma outra sequência de caracteres, assim
    como `"Eu tenho 25 anos"`. Mas podemos também trabalhar com números:


    ```

    1 <script>

    2 document.write("Minha idade é: ");

    3 document.write(25);

    4 </script>

    ```


    Apenas as aspas se foram na segunda linha. Se estiver usando o *Notepad++*, vai
    ver que ele colore o número de forma diferente do que está entre aspas. Será então
    que não precisaríamos dela para mostrar as sequências de caracteres? Faça o teste
    sem elas e verá que, se não for apenas números, teremos um erro.


    Mas por que utilizar um número sem as aspas? Afinal, poderíamos muito bem ter
    feito assim:


    ```

    1 document.write("25");

    ```


    Qual é a diferença de `25` para `"25"`? Quando utilizamos as aspas, estamos dizendo
    ao JavaScript que queremos que isto seja encarado como uma sequência de caracteres,
    não como um simples número. A grande diferença estará na forma que a linguagem
    tratará cada um deles. Experimente fazer uma conta com números:


    ```

    1 document.write(25 + 25);

    ```


    Agora vamos fazer algo muito parecido, utilizando o mesmo operador, porém com
    duas sequências de caracteres:


    ```

    1 document.write("25" + "25");

    ```


    Esse teste é fundamental para você entender a diferença dos dois conceitos. No
    segundo caso, o operador `+` junta as duas sequências de caracteres. Esse processo
    de juntar sequências de caracteres é chamado de **concatenação**.'
