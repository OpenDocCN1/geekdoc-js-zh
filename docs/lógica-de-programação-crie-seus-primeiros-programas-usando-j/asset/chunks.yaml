- fmt: '

    Muitas decisões não foram fáceis. Preterir o `console.log` em favor do desengonçado
    `document.write`, explicar funções antes de `ifs` e `fors`, definir funções através
    de atribuição em vez da sintaxe mais comum. Esses são apenas algumas das questões
    que apresentavam vantagens e desvantagens para uma melhor abordagem didática.
    Realizamos nossas escolhas depois de alguns testes com pessoas leigas em computação.


    Um agradecimento especial ao Leonardo Wolter e Francisco Sokol pela base dos exercícios
    com animações. Outro ao Erich Egert, pelo teste do livro com alunos e diversas
    sugestões para novos desafios.


    ## Capítulo 1: Comece a programar hoje


    Não importa sua idade, profissão e objetivo: programar é mais do que divertido,
    é um constante desafio. Queremos tornar o programa mais rápido, mais legível,
    mais elegante e mais útil. Prepare-se para encontrar problemas, quebra-cabeças
    e questões o tempo todo.


    Seu aprendizado aqui será útil não apenas para começar a criar uma página web.
    Você estará preparado para enfrentar as fórmulas do Excel, desenvolver suas próprias
    pequenas ferramentas, entender o funcionamento das aplicações que utiliza na internet
    e quem sabe criar um programa para seu próprio celular e dos seus amigos.


    O segredo, sem dúvida, é praticar. Não se limite apenas com os exemplos e exercícios
    do livro. Vá além, deixe sua curiosidade guiar a criação de novos programas.


    Siga os capítulos passo a passo. Assim que começar a aprender mais, ofereceremos
    exercícios e desafios oficiais. Não fique apenas na leitura! A prática é o segredo.
    Faça todas as sugestões e veja você mesmo o resultado. Caso fique curioso, troque
    os dados, modifique as rotinas, experimente, invente. A programação nos dá esse
    poder de criação. Crie!


    Está com dúvidas? Tem dois locais para resolver seu problema. Um é uma lista de
    discussão via e-mail, criada especialmente para este livro: [https://groups.google.com/group/comece-a-programar/](https://groups.google.com/group/comece-a-programar/)


    O outro é usar o maior portal de programação do país, o GUJ: [http://www.guj.com.br/](http://www.guj.com.br/)


    Em ambos os casos, lembre-se de ser bem específico na sua pergunta, dando detalhes
    dos problemas e a lista organizada do seu código.


    ### 1.1 Converse com seu navegador


    Há muito o que aprender. O mais importante é que você possa rapidamente escrever
    seus próprios programas e depois `execut-los` para ver o resultado. Existem muitas
    linguagens de programação, e todas são alternativas viáveis para um primeiro contato.
    Escolhemos uma linguagem para você: o `JavaScript`, que possui vantagens e desvantagens
    como todas as outras, mas para o aprendizado ela é muito adequada: não haverá
    necessidade de instalar nada para começar a programar.


    Abra uma página qualquer. Pode ser o site da casa do código, [http://www.casadocodigo.com.br](http://www.casadocodigo.com.br),
    pode ser o site da Caelum, [http://www.caelum.com.br](http://www.caelum.com.br)
    ou do seu portal preferido. Para fazer isto, você utilizou algum navegador (`browser`),
    como o Internet Explorer, o Firefox e o Chrome, mas como ele fez toda essa mágica
    de mostrar essa página bonita para nós?


    Na realidade, não há mágica nenhuma envolvida nisso. O navegador apenas obedece
    a instruções que alguém deu para ele. Alguém disse para ele que aquelas imagens
    deveriam aparecer, que determinados textos precisavam ser exibidos, que a cor
    de fundo da página é algum tom de cinza, que quando você clica em um botão, uma
    mensagem surge para você e assim por diante.


    Quem fez isso? O programador, muitas vezes também chamado de desenvolvedor. Que
    é justamente quem sabe dar as instruções para o navegador realizar. Todos esses
    navegadores vão pegar essas instruções, na forma de um `código` e vão apresentá-lo
    na tela de uma forma agradável. *O que viria a ser um código*?


    Nesse mesmo site que você entrou, vamos ver qual foi o código utilizado. Para
    isso, você deve seguir passos diferentes de acordo com o navegador.


    No Chrome, clique no ícone da ferramenta, depois `Ferramentas` e `Exibir código
    fonte`. `CTRL+U` é o atalho para isso.


    ![Menu para exibir código fonte no Chrome](Images/chrome.png)*Figura 1.1: Menu
    para exibir código fonte no Chrome*


    No Firefox, clique no botão do menu, `desenvolvedor web` e depois `código fonte`.
    `CTRL+U` também funciona nesse navegador.


    ![Menu para exibir código fonte no Firefox](Images/firefox.png)*Figura 1.2: Menu
    para exibir código fonte no Firefox*


    No Internet Explorer 9, dê um clique com o botão direito no fundo da página e
    escolha `Visualizar código fonte`.


    ![Menu para exibir código fonte no Explorer](Images/explorer.png)*Figura 1.3:
    Menu para exibir código fonte no Explorer*


    Parece complicado? O navegador (`browser`), pegou todo esse código e gerou aquela
    representação, agradável aos nossos olhos. Podemos nós mesmos criar algo assim
    para apresentar os dados que desejarmos. Isto é, podemos `criar nossa própria
    página`, que vai interagir com quem a estiver acessando, o `usuário`.


    ### 1.2 Criando seu próprio arquivo HTML


    Para criar nosso primeiro código, abra um editor de texto comum, como o Bloco
    de Notas (`Notepad`) do Windows ou o `gedit` do Linux. Editores de texto como
    o Word não ajudam muito neste caso, pois eles gravam o arquivo.


    ```html

    1 Meu teste!

    <h3>Seria isso um programa?</h3>

    <strong>Não consigo fazer nada além de mostrar conteúdo fixo?</strong>

    ```


    Salve o arquivo em uma pasta de fácil acesso, como `Meus Documentos` ou `Área
    de Trabalho`, com o nome `minha_pagina.html`.


    ![Notepad criando o arquivo](Images/notepad.png)*Figura 1.4: Notepad criando o
    arquivo*


    Vá ao diretório onde você gravou o arquivo, dê dois cliques sobre ele. O navegador
    abrirá e teremos o resultado:


    ![Resultado dentro do navegador](Images/minha_pagina.png)*Figura 1.5: Resultado
    dentro do navegador*


    ### 1.3 Um pouco mais de HTML


    Nossa página, por enquanto, só exibe textos fixos (chamados de *conteúdo estático*).
    Podemos alterá-la para exibir informações diferentes, usando `tags` para mudar
    a forma com que os dados são representados.


    ```html

    1 Meu teste!

    <h3>Seria isso um programa?</h3>

    <strong>Não consigo fazer nada além de mostrar conteúdo fixo?</strong>

    ```


    Salve o arquivo com essas duas novas linhas e abra a página no seu navegador.
    Lbrando que para abri-la, dê dois cliques no arquivo, ou se ela já estiver aberta,
    atualize a página clicando no ícone de recarregamento (*reload*).

