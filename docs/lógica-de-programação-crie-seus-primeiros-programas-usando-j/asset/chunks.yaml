  trans: "\n\n```\n 1 var funcaoQuadratica = function(x) {\n 2   return 0.01 * x *\
    \ x;\n 3 }\n 4 \n 5 var desenhaParabola = function() {\n 6   for(var x = 0; x\
    \ < 600; x = x + 1) {\n 7     var y = funcaoQuadratica(x);\n 8     console.log(\"\
    Para x = \" + x + \", o y vale \" + y);\n 9 \n10     c.beginPath();\n11     c.arc(x,\
    \ 400 - y, 2, 0, 2*Math.PI);\n12     c.fill();\n13   }\n14 }\n```\n\n代码变得更加组织化了，但我们仍然面临一个问题：如何在不复制粘贴大量已写代码的情况下，绘制函数\
    \ `f(x) = seno(x)` ？我们希望能够选择绘制哪种函数！\n\n换句话说，与其调用 `desenhaParabola()`，我们希望最后一行代码如下：\n\
    \n```\n1 desenhaFuncao(funcaoQuadratica);\n```\n\n我们需要让代码更通用才能达到这一点。这里的技巧非常微妙：不要在\
    \ `desenhaParabola` 函数中显式地调用 `funcaoQuadratica`，而是让 `desenhaParabola` **接收一个函数作为参数**。为了让名称更有意义，它将从\
    \ `desenhaParabola` 改名为 `desenhaFuncao`，并接收一个名为 `funcaoMatematica` 的参数：\n\n```\n\
    \ 1 var desenhaFuncao = function(funcaoMatematica) {\n 2   for(var x = 0; x <\
    \ 600; x = x + 1) {\n 3     var y = // 这里该做什么?\n 4     console.log(\"Para x =\
    \ \" + x + \", o y vale \" + y);\n 5 \n 6     c.beginPath();\n 7     c.arc(x,\
    \ 400 - y, 2, 0, 2*Math.PI);\n 8     c.fill();\n 9   }\n10 }\n```\n\n但仍然缺少计算 `y`\
    \ 的那行代码。如果我们不想显式调用，该怎么做呢？并不远了，因为我们已经将 `funcaoMatematica` 作为参数传入了，只需调用 `var y =\
    \ funcaoMatematica(x)` 即可。\n\n要调用 `desenhaFuncao`，只需按照我们计划的那样调用：`desenhaFuncao(funcaoQuadratica)`。这里的巨大区别在于\
    \ `desenhaFuncao` 函数接收另一个函数作为参数！而当它执行 `var y = funcaoMatematica(x)` 时，它并不知道具体是谁在调用它！我们知道它调用的是抛物线，是因为我们在紧之后进行了调用，但代码本身依赖于此，变得非常灵活。\n\
    \n可以在这里查看此代码：[`jsfiddle.net/paulosilveira/kyuMe/`](http://jsfiddle.net/paulosilveira/kyuMe/)\n\
    \n注意，这并不是我们第一次把函数当作普通变量处理。在上一章中，当我们配置*回调*函数时，我们执行了 `botaoAdivinhar.onclick = botaoClicado`。但这是我们第一次**接收**一个函数作为参数。这在\
    \ JavaScript 代码中经常出现。\n\n那么如何绘制正弦函数呢？非常简单，只需创建该函数：\n\n```\n1 var funcaoSeno =\
    \ function(x) {\n2   return  Math.sin(x);\n3 }\n```\n\n然后调用：\n\n```\n1 desenhaFuncao(funcaoSeno);\n\
    ```\n\n很简单吧？\n\n结果可能并不尽如人意。正弦函数返回的是 `-1` 到 `1` 之间的数字，这在图上并不有趣。尝试更复杂的函数，例如 `Math.sin(x/20)\
    \ * 100 + 200;`，如下所示。\n\n![正弦函数](img/seno.png)*图 7.15：正弦函数*\n\n用其他函数进行新测试吧！寻找根、对数等。甚至可以画一个分形图形？\n\
    \n## 第 8 章：附录 - 动画和小型游戏\n\n我们已经有能力利用所学知识做很多事情了。在本章中，我们将学习更多关于事件和 Canvas API 的知识，创建一个创建一个简单的游戏。机会测试你的想象力吧！\n\
    \n### 8.1 创建一个捕捉鼠标移动的画板\n\n很容易知道用户在我们的程序中做什么，以便做出决策。例如：用户在屏幕上点击了哪里？我们将创建一个新文件\
    \ `mouse.html`，并绘制一个灰色的画布，作为我们的测试屏幕。\n\n`mouse.html` 的开头与我们已经熟悉的非常相似：\n\n```\n\
    1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n2 <script>\n3 var\
    \ tela = document.getElementById(\"tela\");\n4 var c = tela.getContext(\"2d\"\
    );\n 5 \n6 c.fillStyle=\"gray\";\n7 c.fillRect(0, 0, 400);\n8 </script>\n```\n"
- fmt: "\nJá podemos fazer um software parecido com o Paint, não? Ou como o Photoshop,\
    \ para os mais ousados!\n\nOpcionalmente, por uma questão de organização, poderíamos\
    \ ter declarado nossa função antes, para depois fazer o registro do nosso `callback`.\
    \ Algo assim:\n\n```\n1 var desenhaCirculo = function(evento) {\n2   // código\
    \ que você já viu ficaria aqui ... \n3 }\n4 \n5 tela.onclick = desenhaCirculo;\n\
    ```\n\n### 8.2 Exercícios para nossa tela de desenho\n\n1. Como saber se o clique\
    \ do mouse é o botão da esquerda ou da direita? Pesquise mais na internet sobre\
    \ os eventos de clique e faça com que o da esquerda desenhe o círculo azul, e\
    \ o da direita um círculo vermelho!\n\n2. Podemos registrar diversos outros eventos\
    \ do mouse. Até agora mexemos apenas no `onclick` do nosso `canvas`.\n\n   Queremos\
    \ pegar o movimento do mouse e desenhar a cada pequena variação de sua posição.\
    \ Para isso, atribua a nossa função que desenha círculo não mais para `tela.onclick`,\
    \ e sim `tela.onmousemove`.\n\n3. Desafio: crie seu próprio Paint! Defina áreas\
    \ do seu canvas em que o usuário pode selecionar algumas cores. Para isso, você\
    \ deve guardar uma variável `corEscolhida` fora da sua função de desenho. Toda\
    \ vez que o usuário clicar na região da escolha de uma cor (você pode fazer isso\
    \ verificando com `ifs`), você deve atualizar essa variável e utilizá-la para\
    \ fazer `c.fillStyle = corEscolhida`.\n\n### 8.3 Crie animações\n\nVamos tentar\
    \ desenhar um círculo e movê-lo na tela, dando o efeito de uma animação. A ideia\
    \ parece ser fácil de executar. Podemos utilizar um `for` para desenhar o círculo\
    \ à esquerda da tela e depois limpar a tela. A cada iteração vamos avançando o\
    \ círculo em relação ao eixo `x`, mais para a direita.\n\nCrie o arquivo `animacao.html`\
    \ e vamos fazer exatamente isso! Primeiro declaramos nosso canvas:\n\n```\n1 <script>\n\
    2 var tela = document.getElementById(\"tela\");\n3 var c = tela.getContext(\"\
    2d\");\n4 \n5 c.fillStyle=\"green\";\n6 c.fillRect(0, 0, 200, 400);\n```\n\nPara\
    \ organizar, vamos começar criando uma função que desenha um círculo na posição\
    \ `x, y` de tamanho `raio`. O código é bastante simples:\n\n```\n1 var circulo\
    \ = function(x, y, raio) {\n2   c.fillStyle = \"blue\";\n3   c.beginPath();\n\
    4   c.arc(x, y, raio, 0, 2*Math.PI);\n5   c.fill();\n6 };\n```\n\nAlém dessa,\
    \ vamos criar a função que limpa a tela:\n\n```\n1 var limpaTela = function()\
    \ {\n2   c.clearRect(0, 0, 600, 400);\n3 };\n```\n\nPor último, fazemos o `for`\
    \ que desenha o círculo na posição `x`, que vai aumentando de `1` em `1`. Sua\
    \ posição `y` será sempre `100` e o `raio` com valor de `10`:\n\n```\n1 for(var\
    \ x = 0; x < 600; x = x + 1) {\n2   limpaTela();\n3   circulo(x, 100, 10);\n4\
    \ }\n5 </script>\n```\n\nAbra a página no Chrome. O que aconteceu? Você viu alguma\
    \ coisa? Clique para atualizar e tente agora, com calma. Nada ainda? Olhe, o problema\
    \ é que seu computador é muito rápido do que você imagina. Nessa fração de segundos\
    \ ele foi capaz desenhar o círculo e apagar a tela 600 vezes!\n\nPara que possamos\
    \ ver a animação, precisamos que, a cada novo quadro da animação, o computador\
    \ espere milésimos de segundo. E existe uma função que faz isso: `setInterval`.\
    \ Ela define de quanto em tempo você quer que determinada função seja chamada.\
    \ Remova o seu `for` e vamos escrever uma função que queremos chamada de tanto\
    \ em tempo.\n\n```\n1 var x = 1;\n2 \n3 var desenha = function() {\n4   limpaTela();\n\
    5   circulo(x, 100, 10);\n6   x = x + 1;\n7 };\n```\n\nHá dois pontos importantes\
    \ aqui. Repare que declaramos nosso contador `x` fora da função, caso contrário,\
    \ toda vez ele iria voltar `1`. Outro ponto esquisito é que não temos mais laço!\
    \ A função `desenha` realmente apaga a tela e desenha o círculo apenas uma vez.\
    \ Para a mágica funcionar, basta adicionar antes de fechar o `<script>`:\n\n```\n\
    1 setInterval(desenha, 30);\n```\n\nO número `30` indica que a função será chamada\
    \ a cada 30 milissegundos. Pronto! Repare no resultado recarregando a página!\n\
    \n#### animação de um jogo de verdade\n\nAqui vimos uma forma simples de animar\
    \ nossas figuras na tela. Em um jogo de verdade, há milhares de detalhes. Em especial,\
    \ algumas vezes você pode perceber que a tela \"pisca\" entre um quadro e outro.\
    \ Isso ocorre porque dá para ver a tela sendo limpada e depois desenhada. Caso\
    \ queira mesmo entrar mais fundo, você deve pesquisar por `double buffer`, com\
    \ qual você utilizaria dois canvas para não sofrer esse efeito. É um tópico avançado.\n\
    \n### 8.4 Revise e faça animações\n\nCrie o arquivo `animacao.html`. Primeiro,\
    \ declare seu canvas junto com duas funções: `circulo` e `limpaTela`:\n\n```\n\
    1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n2 <script>\n3 var\
    \ tela = document.getElementById(\"tela\");\n4 var c = tela.getContext(\"2d\"\
    );\n5 \n6 var circulo = function(x, y, raio) {\n7   c.fillStyle = \"blue\";\n\
    8   c.beginPath();\n9   c.arc(x, y, raio, 0, 2*Math.PI);\n10   c.fill();\n11 };\n\
    12 \n13 var limpaTela = function() {\n14   c.clearRect(0, 0, 600, 400);\n15 };\n\
    ```\n\nAgora declaramos a variável `x` que vai mudar onde será desenhado o círculo.\
    \ Também declaramos a função `desenha`, que será chamada a cada 30 milissegundos,\
    \ através do `setInterval`:\n\n```\n1 var x = 1;\n2 \n3 var desenha = function()\
    \ {\n4   limpaTela();\n5   circulo(x, 100, 10);\n6   x = x + 1;\n7 };\n8 \n9 setInterval(desenha,\
    \ 30);\n10 </script>\n```\n\nPronto! Pode abrir a sua página no navegador. Aqui\
    \ há um `jsfiddle` com o código pronto: [http://jsfiddle.net/8SmSS/](http://jsfiddle.net/8SmSS/)\n\
    \n1. Em vez de fazer o círculo apenas se mover, faça que ele também cresça. Basta\
    \ utilizar a variável `x` para definir o tamanho do raio. Você pode, por exemplo,\
    \ chamar `circulo(x, 100, x/2)`. Agora, remova a invocação ao `limpaTela` e utilize\
    \ `strokeStyle` e `stroke` em vez de `fillStyle` e `fill` dentro da função `circulo`.\
    \ Você pode ter resultados psicodélicos como este:\n\n![Animações estranhas são\
    \ possíveis!](Images/psicodelico.png)\n\n*Figura 8.1: Animações estranhas são\
    \ possíveis!*\n\nUtilizando linhas, quadrados e caminhos, junto com o `random`\
    \ que aprendemos, é possível criar animações bem interessantes.\n\n2. Em vez de\
    \ fazer um círculo se mover, você pode trabalhar com imagens! É bastante simples:\
    \ em vez de chamar a função `circulo`, chame a função `desenhaImagem(x, 100)`\
    \ (ela não receberá raio, claro). Sua função deve ser assim:\n\n```\n1 var imagem\
    \ = new Image();\n2 imagem.src = \"http://www.caelum.com.br/imagens/\" \n3   \
    \    + \"instrutores/fotos/paulo-silveira-90.jpg\";\n4 \n5 var desenhaImagem =\
    \ function(x, y) {\n6   c.drawImage(imagem, x, y)\n7 };\n```\n\nVocê pode trocar\
    \ a imagem por qualquer outra! Caso a imagem esteja no seu computador, coloque\
    \ o valor de `imagem.src = \"nomeDaImagem.jpg\"` e deixe esse arquivo no diretório\
    \ que o seu `.html`.\n\n3. É fácil fazer o círculo se mover de outras maneiras.\
    \ Para ele descer na diagonal, basta chamar `circulo(x, x, 10);`. E se quisermos\
    \ que ele se mova de outra forma, como numa parábola, vista no capítulo anterior?\
    \ Ou mesmo de uma forma senoidal?\n\nQuer ir mais longe? Um excelente artigo para\
    \ você fazer sua animação, com uma imagem que vai mudando a cada quadro é este\
    \ (em inglês): [http://buildnewgames.com/sprite-animation/](http://buildnewgames.com/sprite-animation/)\n\
    \n### 8.5 Desafio: o jogo do tiro ao alvo\n\nEste é o seu último exercício. Vamos\
    \ dar apenas algumas poucas coordenadas para que você mesmo desenvolva quase que\
    \ por completo.\n\nVamos desenhar um alvo, com círculos concêntricos vermelho\
    \ e branco. Você pode criar uma função parecida com essa, além de uma função `cor`\
    \ e outra `circulo`:\n\n```\n1 var desenhaAlvo = function(x, y) {\n2   var raio\
    \ = 40;\n3     cor(\"white\");\n4     circulo(x, y, raio);\n5     cor(\"red\"\
    );\n6     circulo(x, y, raio-10);\n7     cor(\"white\");\n8     circulo(x, y,\
    \ raio-20);\n9     cor(\"red\");\n10     circulo(x, y, raio-30);\n11 };\n```\n"
  raw: "Já podemos fazer um software parecido com o Paint, não? Ou como o Photoshop,\
    \ para os mais ousados!\n\nOpcionalmente, por uma questão de organização, poderíamos\
    \ ter declarado nossa função antes, para depois fazer o registro do nosso *callback*.\
    \ Algo assim:\n\n```\n1 var desenhaCirculo = function(evento) {\n2   // código\
    \ que você já viu ficaria aqui ... \n3 }\n4 \n5 tela.onclick = desenhaCirculo;\n\
    ```\n\n### 8.2 Exercícios para nossa tela de desenho\n\n1.  Como saber se o clique\
    \ do mouse é o botão da esquerda ou da direita? Pesquise mais na internet sobre\
    \ os eventos de clique e faça com que o da esquerda desenhe o círculo azul, e\
    \ o da direita um círculo vermelho!\n\n2.  Podemos registrar diversos outros eventos\
