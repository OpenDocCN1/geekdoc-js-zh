    看起来很复杂。我们在一个 `if` 里面嵌套了另一个 `if`！注意，我们使用了`缩进`功能来清楚地表示第二个 `if` 在第一个 `if` 内部。如果我们没有使用
    `TAB`，就会很难察觉这一点。想看看吗？看这个缩进非常糟糕、格式混乱的示例：


    ```

    1 if(imcDoUsuario > 18.5) {

    2 if(imcDoUsuario < 35) {

    3 mostra("OK! Seu IMC está entre os dois limites.");

    4 }

    5 }

    ```


    尽管这段代码运行得完美无缺，但很难阅读它并理解发生了什么。从现在起就努力保持正确的缩进。当代码属于外部代码段（**代码块**）时，我们应该始终向右多进一个
    `TAB`。在缩进良好的代码中，可以看出 `mostra` 函数属于 `if(imcDoUsuario < 35)` 块，而该块又属于 `if(imcDoUsuario
    > 18.5)` 块。


    我们经常需要检查多个条件是否为真。这种情况非常常见，以至于有一种更短的方法来实现两个 `ifs`，就像它们互相嵌套在里面一样。有一种写法可以表示“我希望这个**和**那个都为真”。这个**与**是通过一个看起来很奇怪的运算符
    `&&` 实现的：


    ```

    1 if(imcDoUsuario > 18.5 && imcDoUsuario < 35) {

    2   mostra("OK! Seu IMC está entre os dois limites.");

    3 }

    ```


    这比写两个 `ifs` 要易读得多。我们将这个条件读为：“如果 `imcDoUsuario` 大于 18.5 且 `imcDoUsuario` 小于 35，则执行……”。


    我们的代码仍然存在一个小问题。如果 BMI 正好等于 `18.5` 或 `35` 呢？注意，我们的任何一个条件都不会为真，什么都不会被打印。为了解决这个问题，我们有
    `>=` 和 `<=` 比较运算符。如果我们认为这些精确值属于健康 BMI 的范围，我们就可以使用这些新的比较运算符来编写条件：


    ```

    1 if(imcDoUsuario >= 18.5 && imcDoUsuario <= 35) {

    2   mostra("OK! Seu IMC está entre os dois limites.");

    3 }

    ```


    ### 4.5 游戏：猜猜我心里想的数字


    现在让我们创建第一个游戏吧！它会非常简单，但足以带来几刻乐趣时光。我们将让电脑“想”一个数字，让游戏的人尝试猜出那个数字。


    为了编写我们的游戏，请创建 `jogo_adivinha.html` 文件。我们需要完成的第一项任务是让电脑“想”一个随机数。我们可以通过 JavaScript
    自带的函数 `Math.random()` 实现这一点。不要被这个名字吓到，这个函数只是返回一个 `0` 到 `1` 之间的随机数。例如，它可能返回 `0.5`。


    ```

    1 <script>

    2   var numeroPensado = Math.random();

    3 </script>

    ```


    猜带小数的数字并不是一项非常愉快的任务。想象一下电脑想的数字是 0.534345，猜这样的数字既不容易也不有趣。


    让我们让程序一定要想一个 `0` 到 `100` 之间的数字。遗憾的是，没有现成的函数可以用这种方式进行抽奖，所以让我们利用已知的 `Math.random()`。为了做到，我们将返回的结果乘以
    `100`。那么，如果它想的是 `0.5`，乘以 `100` 后，结果将是 `50`。


    ```

    1 <script>

    2   var numeroPensado = Math.random() * 100;

    3 </script>

    ```


    尽管如此，我们仍然会有带有小数的数字。如果电脑想的是 `0.5372`，乘以 100 后我们就得到 `53.72`。我们可以通过 `Math.round()`
    函数对该值进行四舍五入。我们首先将带小数的数字存在 `numeroPensadoComCasasDecimais` 中，然后将其四舍五入并存储在变量 `numeroPensado`
    中：


    ```

    1 <script>

    2   var numeroPensadoComCasasDecimais = Math.random() * 100;

    3   var numeroPensado = Math.round(numeroPensadoComCasasDecimais);

    4 </script>

    ```


    变量 `numeroPensadoComCasasDecimais` 不再使用了。我们创建它只是为了计算四舍五入后的随机数，该结果在 `numeroPensado`
    中。我们经常快速使用某些变量，只很短段时间，然后将重要的结果放在另一个变量中。有些人将这些变量称为**临时变量**。


    注意，我们可以在同一行代码中完成两个操作（抽奖和四舍五入），而不需要 `numeroPensadoComCasasDecimais` 变量。为了这样做，我们将
    `Math.random() * 100` 返回的内容直接传递给 `Math.round`：


    ```

    1 <script>

    2   var numeroPensado = Math.round(Math.random() * 100);

    3 </script>

    ```

