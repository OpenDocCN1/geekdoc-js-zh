    \ 30);\n```\n\nO número 30 indica que a função será chamada a cada 30 milissegundos.\
    \ Pronto! Repare no resultado recarregando a página!\n\n|  |\n\n**Animação de\
    \ um jogo de verdade**\n\nVimos aqui uma forma bem simples de animar nossas figuras\
    \ na tela. Em um jogo de verdade, há milhares de outros detalhes importantes.\
    \ Em especial, algumas vezes você pode perceber que a tela \"pisca\" entre um\
