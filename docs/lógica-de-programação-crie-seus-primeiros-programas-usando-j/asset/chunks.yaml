  trans: "\n\n[`developer.mozilla.org/en-US/docs/DOM/CanvasRenderingContext2D`](https://developer.mozilla.org/en-US/docs/DOM/CanvasRenderingContext2D)\n\
    \nMozilla site, responsável pelo navegador Firefox, possui uma das documentações\
    \ mais completas e fáceis de ler. Neste site, você pode ver uma documentação como\
    \ a imagem abaixo.\n\n![Documentação no site Mozilla](img/documentacao_normal.png)\
    \ *Figura 7.7: Documentação no site da Mozilla*\n\nNote que ele fornece uma breve\
    \ descrição e em seguida passa para cada função e cada variável relacionada ao\
    \ assunto. Sim, você precisará lidar com o inglês técnico, mesmo que seja básico.\
    \ Em português, documentações desse tipo, que chamamos de referência (reference),\
    \ são bastante escassas.\n\nA documentação da Mozilla pode conter informações\
    \ específicas que só funcionam no navegador deles. Para uma documentação oficial,\
    \ que deveria funcionar em todos os navegadores, mas que é menos completa, há\
    \ este site:\n\n[`docs.webplatform.org/wiki/javascript`](http://docs.webplatform.org/wiki/javascript)\n\
    \nMuitas vezes temos um conjunto de funções que trabalham com um objetivo em comum.\
    \ Chamamos esse conjunto de **biblioteca** (library). É comum alguém se referir\
    \ à *biblioteca do JavaScript que trabalha com gráficos*, *biblioteca para validação\
    \ de CPF*, *biblioteca para fazer drag and drop*. Veremos mais tarde que há casos\
    \ em que isso pode aparecer com nomes ainda mais estranhos, como API ou de objeto.\n\
    \nProcure você mesmo a documentação da função `fillRect` nesta página. Clique\
    \ nela para obter mais detalhes.\n\nTambém podemos encontrar formatos mais simpáticos\
    \ dessas documentações, criados por outros desenvolvedores. Este é um bom exemplo\
    \ de post que um blogueiro criou para divulgar seu PDF que contém uma documentação\
    \ alternativa:\n\n[`blog.nihilogic.dk/2009/02/html5-canvas-cheat-sheet.html`](http://blog.nihilogic.dk/2009/02/html5-canvas-cheat-sheet.html)\n\
    \nEle apresenta um resumo das funções que trabalham com o canvas. Segue um pedaço\
    \ dessa documentação onde podemos ver algumas das que já conhecemos, de forma\
    \ resumida, explicando quais são os parâmetros com os quais trabalham:\n\n![Uma\
    \ documentação não oficial, mas que pode ser bem útil. Há várias como essa na\
    \ internet.](img/documentacao_diferente.png) *Figura 7.8: Uma documentação não\
    \ oficial, mas que pode ser bem útil. Há várias como essa na internet.*\n\nVamos\
    \ conhecer outras funções relacionadas ao canvas ainda neste capítulo. Lembre-se\
    \ de que você pode e deve explorar novas opções através da documentação. O inglês\
    \ não deve ser uma barreira: ele exigirá pouco, mas é fundamental conhecer o mínimo.\n\
    \n### 7.4 Rev seus primeiros passos com o canvas\n\nVamos revisar o que fizemos\
    \ para criar a bandeira da Itália e nossas outras figuras. Não se assuste com\
    \ um pouco de matemática e coordenadas. A prática tornará tudo muito mais fácil.\
    \ Primeiro, criamos o arquivo `canvas.html` e declaramos nosso canvas:\n\n```\n\
    1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n```\n\nLogo depois,\
    \ começamos a inserir o código JavaScript. As duas primeiras linhas são para obter\
    \ o tal contexto 2d, que servirá como pincel. São duas linhas de código que ainda\
    \ não dominamos:\n\n```\n1 <script>\n2 var tela = document.getElementById(\"tela\"\
    );\n3 var c = tela.getContext(\"2d\");\n```\n\nAgora desenhamos o primeiro retângulo,\
    \ que será verde:\n\n```\n1 c.fillStyle=\"green\";\n2 c.fillRect(0, 0, 200, 400);\n\
    ```\n\nO segundo retângulo será vermelho, de mesma largura e altura, porém iniciará\
    \ na posição `400,0`:\n\n```\n1 c.fillStyle=\"red\";\n2 c.fillRect(400, 0, 200,\
    \ 400);\n```\n\nVamos ao triângulo cinza. Aqui usamos a função que inicia o traçado,\
    \ a `beginPath`. Movemos o pincel com `moveTo` e desenhamos com `lineTo`. Por\
    \ último, preenchemos o interior com a função `fill`:\n\n```\n1 c.fillStyle=\"\
    gray\";\n2 c.beginPath();\n3 c.moveTo(300, 200);\n4 c.lineTo(200, 400);\n5 c.lineTo(400,\
    \ 400);\n6 c.fill();\n```\n\nPor último, desenhamos nosso círculo bem no meio\
    \ da bandeira, em azul, lembrando também de fechar a tag `script`:\n\n```\n1 c.fillStyle=\"\
    blue\";\n2 c.beginPath();\n3 c.arc(300, 200, 50, 0, 2*3.14);\n4 c.fill();\n5 </script>\n\
    ```\n\nVamos praticar mais o conhecimento de coordenadas e testar outros desenhos\
    \ e formas através de bandeiras.\n\n1.  Inicialmente vamos desenhar duas bandeiras\
    \ simples, a primeira da Colômbia e a segunda de Madagascar:\n\n    ![Bandeira\
    \ da Colombia](img/colombia.png)\n\n    *Figura 7.1: Bandeira da Colômbia*\n\n\
    \    ![Bandeira de Madagascar](img/madagascar.png)\n\n    *Figura 7.2: Bandeira\
    \ de Madagascar*\n\n2.  Agora duas que possuem circunferências e que você precisará\
    \ usar o arco, do Laos e a do Níger:\n\n    ![Bandeira do Laos](img/laos.png)\n\
    \n    *Figura 7.3: Bandeira do Laos*\n\n    ![Bandeira do Niger](img/niger.png)\n\
    \n    *Figura 7.4: Bandeira do Níger*\n\n3.  A bandeira da Noruega tem uma cruz\
    \ interessante:\n\n    ![Bandeira da Noruega](img/noruega.png)\n\n    *Figura\
    \ 7.5: Bandeira da Noruega*\n\n4.  E a bandeira do Brasil:\n\n    ![Bandeira do\
    \ Brasil](img/brasil.png)\n\n    *Figura 7.6: Bandeira do Brasil*\n\n### 7.5 Cansei\
    \ de repetir! Funções\n\nVamos desenhar vários quadrados. Podemos usar um novo\
    \ arquivo, `loop.html`. Dentro dele, vamos declarar o canvas e preparar 50 por\
    \ pixels. Ela chamará `desenhaQuadradoVerde`:\n\n```\n1 <canvas id=\"tela\" width=\"\
    600\" height=\"400\"></canvas>\n2 \n3 <script>\n4 desenhaQuadradoVerde = function(x,y)\
    \ {\n5   var tela = document.getElementById(\"tela\");\n6   var c = tela.getContext(\"\
    2d\");\n7   \n8   c.fillStyle=\"green\";\n9   c.fillRect(x, y, 50, 50);\n10 };\n\
    11 \n12 desenhaQuadradoVerde(0,0);\n13 </script>\n```\n\nNa última linha estamos\
    \ chamando a função para testar. Salve o arquivo e abra-o com o Chrome. O resultado\
    \ é apenas um quadrado verde.\n\n![Um quadrado verde... através da função!](img/quadrado_verde.png)\
    \ *Figura 7.9: Um quadrado verde através da função*\n\n### 7.6 Loops e funções\
    \ para nos ajudar\n\nCom o auxílio de um loop, podemos fazer muitas imagens. Vamos\
    \ desenhar diversos quadrados de tamanho 50 por 50, começando da posição zero\
    \ do eixo X, indo até a posição 600.\n\nEdite seu arquivo `canvas_loops.html`\
    \ e vamos usar o `while` para fazer isso. Criaremos uma variável `x` que vai aumentando\
    \ de 50 em 50, até chegar em 600. Delete a chamada para `desenhaQuadradoVerde(0,0)`\
    \ e adicione as seguintes:\n\n```\n1 var x = 0;\n2 while(x < 600) {\n3   desenhaQuadradoVerde(x,\
    \ 0);\n4   x = x + 50;\n5 }\n```\n\nSalve e abra o arquivo no Chrome. Qual é o\
    \ resultado? Uma linha comprida verde!\n\n![Uma linha verde. Na verdade, uma série\
    \ de quadrados verde.](img/linha_verde.png) *Figura 7.10: Uma linha verde, na\
    \ verdade uma série de quadrados*\n\nPor quê? Pois a cada 50 pontos nós desenhamos\
    \ um novo quadrado. Não há divisão entre eles pois são verdes em todos seus pontos.\
    \ Para ficar mais visual, podemos alterar a função `desenhaQuadradoVerde` para\
    \ que o estilo do traçado da borda (`strokeStyle`) seja preta, adicionando duas\
    \ linhas:\n\n"
- fmt: "\n```javascript\nvar desenhaQuadradoVerde = function(x,y) {\n  var tela =\
    \ document.getElementById(\"tela\");\n  var c = tela.getContext(\"2d\");\n\n \
    \ c.fillStyle=\"green\";\n  c.fillRect(x, y, 50, 50);\n\n  c.strokeStyle=\"black\"\
    ;\n  c.strokeRect(x, y, 50, 50);\n};\n```\n\nO resultado agora será a mesma linha,\
    \ porém com claras divisões de cada um dos quadrados:\n\n![Marcando bem os quadrados.](Images/quadrados_verdes.png)\
    \ *Figura 7.11: Marcando bem os quadrados.*\n\nVamos trocar esse nosso `while`\
    \ pelo `for`, que também é um comando de loop, porém mais sucinto. Ele tem uma\
    \ sintaxe mais estranha, mas é importante se habituar, ele aparece com bastante\
    \ frequência! Delete o `while` e faça assim:\n\n```javascript\nfor(var x = 0;\
    \ x < 600; x = x + 50) {\n  desenhaQuadradoVerde(x, 0);\n}\n```\n\nPercebe como\
    \ ele fica mais curto? A variável `x` não precisa mais ser declarada antes. E\
    \ o incremento de 50 em 50 fica definido dentro do próprio comando.\n\nVamos incrementar\
    \ um pouco. Como fazemos para desenhar uma linha dessas, só que vermelha, logo\
    \ abaixo da linha verde? Inicialmente precisamos criar a função que desenha quadrados\
    \ vermelhos, logo abaixo de onde criamos para os verdes:\n\n```javascript\nvar\
    \ desenhaQuadradoVermelho = function(x,y) {\n  var tela = document.getElementById(\"\
    tela\");\n  var c = tela.getContext(\"2d\");\n\n  c.fillStyle=\"red\";\n  c.fillRect(x,\
    \ y, 50, 50);\n\n  c.strokeStyle=\"black\";\n  c.strokeRect(x, y, 50, 50);\n};\n\
    ```\n\nAgora, além do `for` que faz o quadrado verde, podemos criar um `for` que\
    \ trabalhe para, na linha `50`:\n\n```javascript\nfor(var x = 0; x < 600; x =\
    \ x + 50) {\n  desenhaQuadradoVerde(x, 0);\n}\nfor(var x = 0; x < 600; x = x +\
    \ 50) {\n  desenhaQuadradoVermelho(x, 50);\n}\n```\n\nE o resultado que temos:\n\
    \n![Outra linha de quadrados, de outra cor.](Images/linhas_vv.png) *Figura 7.12:\
    \ Outra linha de quadrados, de outra cor.*\n\nMas perceba que os dois `for`s que\
    \ criamos percorrem exatamente os mesmos valores de `x`, isso é, `0, 50, 100,\
    \ 150, ..., 550`. Poderíamos então desenhar os dois quadrados dentro de um único\
    \ `for`:\n\n```javascript\nfor(var x = 0; x < 600; x = x + 50) {\n  desenhaQuadradoVerde(x,\
    \ 0);\n  desenhaQuadradoVermelho(x, 50);\n}\n```\n\nVamos incrementar nossos testes\
    \ artísticos.\n\n1. Crie uma função para desenhar bolas azuis, que receba a posição\
    \ `x` e `y` e desenhe uma circunferência de 25 de raio. Altere o laço para que\
    \ a cada iteração você invoque essa função para cada `x` na linha 100. Isto é,\
    \ você vai fazer algo como `desenhaBolaAzul(x, 100);` dentro do `for`.\n\n   O\
    \ resultado deve ser algo parecido com:\n\n   ![Resultado que queremos obter](Images/linhas_bola.png)\
    \ *Figura 7.1: Resultado que queremos obter*\n\n2. Como arrumar o código para\
    \ que seja gerada a imagem abaixo?\n\n   ![E como fazer isso?](Images/linhas_bola2.png)\
    \ *Figura 7.1: E como fazer isso?*\n\n3. Você já reparou que as funções `desenhaQuadradoVermelho`\
    \ e `desenhaQuadradoVerde` são muito parecidas? O ideal seria não ter código repetido\
    \ nem mesmo dentro de funções. A solução aqui seria criar uma terceira função,\
    \ a `desenhaQuadrado` que, além de `x` e `y`, recebe uma `cor`. Aí você pode apagar\
    \ quase todo o código de dentro de `desenhaQuadradoVermelho` e `desenhaQuadradoVerde`\
    \ para que elas chamem a função `desenhaQuadrado`, passando a respectiva cor.\
    \ Você encara esse desafio? O resultado será o mesmo, porém o código estará muito\
    \ mais elegante.\n\n4. Lembra dos nossos exercícios de loop, nos quais desenhamos\
    \ asteriscos formando um retângulo, um triângulo e até o V de Vingança? Eles estão\
    \ na seção [5.12](#index_split_006.html_exercicios-asteriscos). Refaça-os utilizando\
    \ círculos no canvas e impressione seus amigos!\n\n[Para saber mais: passe uma\
    \ função para uma... função!]\n\nEsse é um tópico opcional para você que está\
    \ começando, muito desafiador. Se você está seguindo com facilidade os exemplos\
    \ e gosta de um pouco de matemática, mais que já viu nesse capítulo, recomendamos\
    \ encarar já!\n\nLembra quando você aprendeu desenhar funções no chamado cartesiano?\
    \ Agora fica fácil fazer isso com `for` e nosso canvas. Como desenhar a função\
    \ `f(x) = x`? Podemos começar, de 0 a 600 (nossas coordenadas no eixo `x`) e fazer\
    \ a conta para cada ponto, achando coordenada `y`. Por exemplo, para `x = 2`,\
    \ temos `f(x) = 4`, para `x = 3`, temos `f(x) = 9`, e assim diante.\n\nSe for\
    \ só imprimir quanto vale cada um, está muito fácil. Repare:\n\n```javascript\n\
    for(var x = 0; x < 600; x = x + 1) {\n  var y = x * x;\n  console.log(\"Para x\
    \ = \" + x + \", o y vale \" + y);\n}\n```\n\nMas não é isso que queremos. Queremos\
    \ colocar o gráfico dessa função na tela. Crie seu arquivo `funcoes.html` e vamos\
    \ declarar um:\n\n```html\n<canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n\
    <script>\nvar tela = document.getElementById(\"tela\");\nvar c = tela.getContext(\"\
    2d\");\n```\n\nAgora fazemos um `for` que, além de colocar no console a posição\
    \ que vamos desenhar, desenha um ponto na posição `x, y` utilizando um pequeno\
    \ círculo de raio 2:\n\n```javascript\nfor(var x = 0; x < 600; x = x + 1) {\n\
    \  var y = x * x;\n  console.log(\"Para x = \" + x + \", o y vale \" + y);\n \
    \ c.beginPath();\n  c.arc(x, 400 - y, 2, 0, 2*Math.PI);\n  c.fill();\n}\n</script>\n\
    ```\n\nAbra a sua página e repare no resultado na seguinte:\n\n![A parábola da\
    \ função quadrática, mas com poucos pontos e ainda estranha](Images/parabola1.png)\
    \ *Figura 7.13: parábola da função quadrática, mas com poucos pontos e ainda estranha*\n\
    \nHá duas coisas que não esperamos aí. Quando estudamos no colégio essa função,\
    \ sabemos que o gráfico gerado chama-se parábola, e a direção dela é crescente!\
    \ Por que está de ponta cabeça? Pois nosso eixo `y` tem direção invertida à qual\
    \ estamos habituados. Para mudar isso, basta alterar o seu código para desenhar\
