- fmt: "\n```\n1 var anoComoTexto = prompt(\"Informe o ano inicial\");\n2 var anoDeCopa\
    \ = parseInt(anoComoTexto);\n```\n\nCom essa simples alteração, nosso programa\
    \ volta a estar pronto para funcionar no navegador.\n\n### 5.5 Revise seu código:\
    \ transforme texto em números\n\nEstávamos com nosso programa `anos_de_copa.html`\
    \ funcionando corretamente, até o momento em que decidimos perguntar para quem\
    \ usa nosso programa qual é o ano em que começará a mostrar os anos da copa.\n\
    \n```\n 1 <script>\n 2 var mostra = function(frase) {\n 3   document.write(frase\
    \ + \"<br>\");\n 4 };\n 5 \n 6 var anoDeCopa = prompt(\"Informe o ano inicial\"\
    );\n 7 var anoLimite = prompt(\"Qual é o ano limite?\");\n 8 \n 9 while(anoDeCopa\
    \ <= anoLimite) {\n10   mostra(anoDeCopa + \" tem copa!\");\n11   anoDeCopa =\
    \ 4 + anoDeCopa;\n12 }\n13 mostra(\"Ufa! Esses foram os anos de copa até \" +\
    \ anoLimite);\n14 </script>\n```\n\nQuando abrimos esse arquivo no navegador e\
    \ informamos 1930 como ano inicial e 2014 como o ano limite temos uma surpresa,\
    \ não funcionou com o esperado. Os valores foram concatenados em vez de ocorrer\
    \ a esperada soma.\n\nPrecisávamos somar número com número e não número com texto.\
    \ Resolvemos isso através da função `parseInt` para transformar o texto que recuperamos,\
    \ correspondente ao ano inicial, em um número.\n\n```\n1 var anoComoTexto = prompt(\"\
    Informe o ano inicial\");\n2 var anoDeCopa = parseInt(anoComoTexto);\n```\n\n\
    Nesse momento, o código completo do programa é o seguinte:\n\n```\n 1 <script>\n\
    \ 2 var mostra = function(frase) {\n 3   document.write(frase + \"<br>\");\n 4\
    \ };\n 5 \n 6 var anoComoTexto = prompt(\"Informe o ano inicial\");\n 7 var anoDeCopa\
    \ = parseInt(anoComoTexto);\n 8 var anoLimite = prompt(\"Qual o ano limite?\"\
    );\n 9 \n10 while(anoDeCopa <= anoLimite) {\n11   mostra(anoDeCopa + \" é ano\
    \ de copa!\");\n12   anoDeCopa = 4 + anoDeCopa;\n13 }\n14 mostra(\"Ufa! Esses\
    \ foram os anos de copa até \" + anoLimite);\n15 </script>\n```\n\nAgora podemos\
    \ abrir o programa `anos_de_copa.html` no navegador, que ele nos perguntará o\
    \ ano inicial e o limite e fará todo o processo corretamente.\n\n1. Faça o mesmo\
    \ programa que mostra os anos de copa, porém para as olimpíadas. Lembre-se o primeiro\
    \ ano de olimpíadas foi 1896 e que ela também acontece a cada 4 anos.\n2. Faça\
    \ testes no console do Chrome, como vimos na seção [3.8](#index_split_004.html_console-testes).\
    \ Descubra quanto vale `\"10\" + 10`, `\"10\" + \"10\"`, `\"10\" * 10`, `\"10\"\
    \ * \"10\"`. Deixe sua imaginação criar os mais variados exemplos e você começará\
    \ a entender quando o JavaScript faz conta, quando ele concatena, e quando ele\
    \ não consegue fazer nenhum dos dois!\n\n### 5.6 Praticando mais um pouco: Faça\
    \ tabuadas\n\nQuem nunca hesitou ao ter que falar a tabuada do 7? 7, 14, 21, 28...\
    \ e esqueci! O cálculo das tabuadas é um bom exemplo de processo de repetição.\
    \ Calculamos a tabuada do 7, indo do 7 vezes 1, até o 7 vezes 10. Inclusive, isso\
    \ fica até mais claro com a forma costumeira com a qual alunos de escola escrevem\
    \ tabuadas:\n\n* 7 x 1 = 7\n* 7 x 2 = 14\n* 7 x 3 = 21\n* 7 x 4 = 28\n* 7 x 5\
    \ = 35\n* 7 x 6 = 42\n* 7 x 7 = 49\n* 7 x 8 = 56\n* 7 x 9 = 63\n* 7 x 10 = 70\n\
    \nRepare que multiplicamos o 7, começando no 1, enquanto o 7 for menor ou igual\
    \ a 10. É mais um caso em que conseguimos tranquilamente fazer com que um programa\
    \ de computador realize todo o trabalho para nós e apenas mostre os resultados\
    \ que queremos. Então, vamos lá!\n\nO primeiro passo é criarmos um novo arquivo,\
    \ que podemos chamar de `tabuadas.html`. Nesse arquivo, vamos começar a escrever\
    \ nosso código JavaScript através da Tag `<script>`:\n\n```\n1 <script>\n2 \n\
    </script>\n```\n\nComo na nossa tabuada o cálculo inicia na multiplicação por\
    \ 1 e vai até multiplicarmos por 10, vamos criar uma variável que guarde esse\
    \ valor, que vamos chamar de `multiplicador` e iniciará em 1.\n\n```\n1 <script>\n\
    2   var multiplicador = 1;\n3 </script>\n```\n\nEnquanto a variável `multiplicador`\
    \ for menor ou igual a 10, vamos querer calcular a tabuada. Podemos fazer com\
    \ que nosso programa realize essas tarefas. O código abaixo é um exemplo:\n\n\
    ```\n1 <script>\n2 var mostra = function(frase) {\n3   document.write(frase +\
    \ \"<br>\");\n4 };\n5 \n6 var multiplicador = 1;\n7 while(multiplicador <= 10)\
    \ {\n8   mostra(\"7 x \" + multiplicador + \" = \" + (7 * multiplicador));\n9\
    \   multiplicador++;\n10 }\n11 </script>\n```\n\n### 5.7 Aprenda uma forma diferente\
    \ de mostrar: comando for\n\nGeralmente, quando temos as repetições, usamos o\
    \ `while`, porém há uma forma mais organizada de escrever esse código: o comando\
    \ `for`. O `for` é muito útil quando sabemos de quantas vezes a repetição deve\
    \ ocorrer.\n\nA sintaxe do `for` é a seguinte:\n\n```\nfor (inicialização; condição;\
    \ incremento) {\n  // código a ser executado\n}\n```\n\nOnde:\n1. **inicialização**:\
    \ é onde definimos a variável de controle (ex: `var i = 1`).\n2. **condição**:\
    \ uma expressão verificada antes de cada repetição. Se for verdadeira, o bloco\
    \ exec (ex: `i <= 10`).\n3. **incremento**: o que acontece após cada repetição\
    \ (ex: `i++`).\n\nVeja como ficaria a tabuada do 7 usando o `for`:\n\n```javascript\n\
    <script>\n  for (var multiplicador = 1; multiplicador <= 10; multiplicador++)\
    \ {\n    mostra(\"7 x \" + multiplicador + \" = \" + (7 * multiplicador));\n \
    \ }\n</script>\n```\n\nNote como o `for` agrupa em uma única linha o que antes\
    \ fazíamos em várias linhas com o `while`, tornando o código muito mais limpo\
    \ e fácil de ler.\n"
