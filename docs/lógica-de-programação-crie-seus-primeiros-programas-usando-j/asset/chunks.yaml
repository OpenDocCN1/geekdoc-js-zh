  trans: "\n\n```javascript\n 1 <script>\n 2 var numeroPensado = Math.round(Math.random()\
    \ * 100);\n 3 \n 4 var numeroDaTentativa = 1;\n 5 while(numeroDaTentativa <= 3)\
    \ {\n 6   var chute = prompt(\"Qual você acha que é?\");\n 7   \n 8   if(chute\
    \ == numeroPensado) {\n 9     alert(\"Parabéns, você acertou!\");\n10   } else\
    \ {\n11     alert(\"Você errou. Será que ainda tem mais tentativas?\");\n12  \
    \ }\n13   numeroDaTentativa++;\n14 }\n15 </script>\n```\n\n在你的浏览器中打开 `jogo_adivinha_com_tentativas.html`\
    \ 并尝试猜中。如果觉得困难，一个技巧是减少计算机想的数字范围，例如从 100 减到 10。要这样做，只需修改以下行：\n\n```javascript\n\
    1 var numeroPensado = Math.round(Math.random() * 10);\n```\n\n在玩几次之后，你会发现这个游戏有些问题。尝试在第一次或第二次尝试中猜中数字，看看会发生什么。游戏会显示恭喜信息，表示你猜中了，但它会再次问你计算机想的数字是多少。我们需要修复这个问题，但该怎么做呢？代码中的问题在哪里？\n\
    \n通过仔细分析，我们发现一旦猜中了数字，就不需要再次尝试，也就是说，循环应该立即结束。但我们如何停止循环并立即退出 `while` 循环呢？\n\nJavascript（与其他编程语言一样）有一个名为\
    \ `break`（打破）的命令，这意味着当它被调用时，循环应该被打破，即被停止。这正是我们需要的。当猜中数字时，我们需要停止循环，因为再次询问用户没有意义。\n\
    \n```javascript\n1 if(chute == numeroPensado) {\n2   alert(\"Parabéns, você acertou!\"\
    );\n3   break;\n4 } else {\n5   alert(\"Você errou. Será que ainda tem mais tentativas?\"\
    );\n6 }\n```\n\n进行此更改后，尝试在第一次或第二次尝试中猜中数字。程序将不再再向你索要另一个数字。这好多了，不是吗？\n\n### 5.11\
    \ 复习我们的代码：数字猜数字游戏\n\n我们在 `jogo_adivinha_com_tentativas.html` 文件中开始游戏，让计算机想一个 0\
    \ 到 100 之间的随机数。\n\n```javascript\n1 var numeroPensado = Math.round(Math.random()\
    \ * 100);\n```\n\n下一步是向用户最多询问 3 次，询问他认为计算机想的数字是多少。\n\n```javascript\n1 var numeroDaTentativa\
    \ = 1;\n2 while(numeroDaTentativa <= 3) {\n3   var chute = prompt(\"Qual você\
    \ acha que é?\");\n4   \n5   numeroDaTentativa++;\n6 }\n```\n\n每次尝试时，我们需要检查他是猜中了还是猜错了。如果猜中了，我们需要立即退出循环，这可以通过\
    \ `break` 命令实现。\n\n```javascript\n 1 var numeroDaTentativa = 1;\n 2 while(numeroDaTentativa\
    \ <= 3) {\n 3   var chute = prompt(\"Qual você acha que é?\");\n 4   if(chute\
    \ == numeroPensado) {\n 5     alert(\"Parabéns, você acertou!\");\n 6     break;\n\
    \ 7   } else {\n 8     alert(\"Você errou. Será que ainda tem mais tentativas?\"\
    );\n 9   }\n10   numeroDaTentativa++;\n11 }\n```\n\n让我们通过一些挑战来改进我们的游戏。\n\n1. 让你的程序在尝试失败时，显示“猜中”的数字比计算机想的数字大还是小。这可以作为用户猜中的一个良好提示。记住，为了这一点，你将需要在说用户错误的\
    \ `else` 块内部使用另一个 `if`。\n2. 让游戏只有在猜中时才结束。为了这样做，必须修改 `while` 的循环条件，使其变成无限循环。修改后，测试你的游戏，看看你需要多少次尝试才能发现那个数字。\n\
    3. 游戏太简单了？增加计算机可能想的数字范围。`1000` 可能是一个很好的开始数字。挑战你的朋友和家人。看看谁能保持记录。\n4. 是否有一种方法可以在不使用\
    \ `break` 的情况下编写这个游戏，只需更改 `while` 条件，并通过表示“与”的运算符（`&&`）添加一个额外的子句。你能猜到怎么做吗？\n\n\
    ### 5.12 练习：在循环中使用循环\n\n循环在我们的代码中经常出现。它们嵌套出现也很常见。想象我们想在屏幕上显示以下星号序列。有 3 行，每行有 10\
    \ 个星号：\n\n![Parece fácil fazer esse monte de asteriscos.](img/asteriscos.png)\
    \ \n*图 5.1：制作这么多星号看起来很简单。*\n\n你可能会想出一个非常、非常简单但毫无挑战性的解决方案。类似于这样的：\n\n```javascript\n\
    1 mostra(\"**********\");\n2 mostra(\"**********\");\n3 mostra(\"**********\"\
    );\n```\n\n可以变得更有趣。与其复制粘贴，我们可以使用见过的 `for`：\n\n```javascript\n1 for(var linha =\
    \ 0; linha < 3; linha = linha + 1) {\n2   mostra(\"**********\");\n3\n```\n\n\
    改进了！但我们想更进一步。如果我们需要修改并在每行打印 250 个星号，我们将在该 `mostra` 调用中写一大堆它们。\n\n想法是使用两个循环。第一个说类似于“对于每一行”，第二个说“对于每一列，打印一个”。在每行的结束处，我们打印一个\
    \ `<br>`。\n\n代码很短，但第一次可能会吓到你。创建 `asteriscos.html` 并像往一样在 script 标签内输入以下行：\n\n\
    ```javascript\n1 for(var linha = 0; linha < 3; linha = linha + 1) {\n2   for(var\
    \ coluna = 0; coluna < 10; coluna = coluna + 1) {\n3     document.write(\"*\"\
    );\n4   }\n5   document.write(\"<br>\");\n6 }\n```\n\n"
- fmt: "\nAgora abra a página. Veja que temos uma caixa de texto e um botão! Esse\
    \ é o seu primeiro formulário!\n\n![Nosso primeiro formulário usando HTML](Images/formulario1.png)\n\
    *Figura 6.1: Nosso primeiro formulário usando HTML*\n\nClique no botão, o que\
    \ acontece? Nada!\n\nSim! É assim que funciona grande parte das páginas da internet\
    \ em que você coloca dados. Quando você clica em um botão, muitas vezes esses\
    \ dados são enviados para outros computadores, conhecido como servidores, para\
    \ que lá sejam armazenados. Mas podemos também trabalhar com esses dados no nosso\
    \ próprio computador, usando JavaScript.\n\nVamos fazer que esse botão veja se\
    \ o usuário acertar o número que estamos pensando. Antes de continuar, precisamos\
    \ dar nomes a cada uma das caixinhas que temos. Fazemos isso colocando identificadores\
    \ (`id`) em cada um dos inputs!\n\n```\n1 <input type=\"text\" id=\"numero\" />\n\
    2 <input type=\"submit\" id=\"adivinhar\" value=\"Compare com o meu segredo!\"\
    />\n```\n\nAgora já podemos começar nosso código JavaScript. O primeiro passo\
    \ que faremos será acessar a caixa de texto que contém o número e dar um `alert`.\
    \ Eis o código completo:\n\n```\n1 <input type=\"text\" id=\"numero\" />\n2 <input\
    \ type=\"submit\" id=\"adivinhar\" value=\"Compare com o meu segredo!\"/>\n3 \n\
    4 <script>\n5 var caixaDoNumero = document.getElementById(\"numero\");\n6 alert(caixaDoNumero.value);\n\
    7 </script>\n```\n\nOpa! Aqui aconteceu muita coisa. `document.getElementById(\"\
    numero\")` é uma forma de fazer que o JavaScript vasculhe o código HTML e encontre\
    \ um elemento de `id = numero`. Essa variável `caixaDoNumero` ainda não é o valor\
    \ que digitamos, ela é a caixinha de texto em si! Fazendo `caixaDoNumero.value`,\
    \ aí sim temos o valor do conteúdo da caixa, isto é, o que foi digitado dentro\
    \ dela.\n\nAbra o arquivo. O que acontece agora? Sim! O `alert` é executado logo\
    \ querimos a página, sem nos dar tempo de preencher algum valor na caixa, mostrando\
    \ algo vazio. Não queremos fazer o `alert` logo quando a página for carregada.\
    \ Queremos chamar o `alert` quando o botão `adivinhar` for clicado!\n\nPara isso,\
    \ primeiramente vamos criar uma função que queremos que seja executada quando\
    \ o botão for clicado. Remova o `alert` e adicione:\n\n```\n1 var botaoClicado\
    \ = function() {\n2   alert(caixaDoNumero.value);\n3 };\n```\n\nE se abrirmos\
    \ a página agora, digitarmos o número e clicarmos no botão? Nada novamente!\n\n\
    O que está faltando? Está faltando definir que, quando alguém clicar no botão\
    \ `adivinhar`, a função `botaoClicado` deve ser chamada! Fazemos isso de uma forma\
    \ muito simples. Adicione as seguintes linhas:\n\n```\n1 var botaoAdivinhar =\
    \ document.getElementById(\"adivinhar\");\n2 botaoAdivinhar.onclick = botaoClicado;\n\
    ```\n\nNa primeira linha pegamos o botão e guardamos na variável `botaoAdivinhar`.\
    \ A segunda linha é a importante. Ela diz que quando o botão `adivinhar` for clicado\
    \ (`onclick`) a função `botaoClicado` deve ser chamada. É muito frequente relacionar\
    \ um determinado acontecimento à execução de uma função. Esses acontecimentos\
    \ são comumente chamados de eventos, e essas funções a serem executadas em determinados\
    \ eventos são conhecidas como funções de callback. Não se preocupe tanto com nomenclatura,\
    \ mas ela vai aparecer cada vez com mais frequência nos seus estudos.\n\nE a adivinhação?\
    \ Bem, ficou faltando guardar o número que pensamos para depois comparar com o\
    \ digitado. Vamos revisar esse código já colocando essa funcionalidade.\n\n###\
    \ 6.2 Revisando uso de HTML e criando o jogo\n\nVamos refazer o nosso código,\
    \ mas dessa vez com o jogo. Primeiro passo, crie o arquivo `adivinha_mais.html`.\
    \ Vamos começar declarando dois elementos HTML: um para a caixa que conterá o\
    \ número, e outro, o botão que verifica se acertou:\n\n```\n1 <input type=\"text\"\
    \ id=\"numero\" />\n2 <input type=\"submit\" id=\"adivinhar\" \n3   value=\"Compare\
    \ com o número que estou pensando!\" />\n```\n\nAgora começamos com HTML. Em vez\
    \ de sortear um número, vamos deixá-lo fixo por uma questão de simplicidade:\n\
    \n```\n1 <script>\n2 var segredo = 8;\n```\n\nPegamos, então, o elemento do HTML\
    \ através daquele código grande, o chamado `document.getElementById`.\n\n```\n\
    1 var caixaDoNumero = document.getElementById(\"numero\");\n```\n\nCriamos uma\
    \ função para verificar se o número digitado (que é `caixaDoNumero.value`) é igual\
    \ ao `segredo`. Dependendo do que for, imprime o resultado:\n\n```javascript\n\
    1 var botaoClicado = function() {\n2   if(segredo == caixaDoNumero.value) {\n\
    3     alert(\"Parabéns! Você acertou o número secreto\");\n4   }\n5   else {\n\
    6     alert(\"Infelizmente você errou!\");\n7   }\n8 };\n```\n\nSó falta o último\
    \ passo: falar que quando o botão `adivinhar` for clicado (o evento de clique),\
    \ ele deve chamar a função `botaoAdivinhar`:\n\n```\n1 var botaoAdivinhar = document.getElementById(\"\
    adivinhar\");\n2 botaoAdivinhar.onclick = botaoClicado;\n3 </script>\n```\n\n\
