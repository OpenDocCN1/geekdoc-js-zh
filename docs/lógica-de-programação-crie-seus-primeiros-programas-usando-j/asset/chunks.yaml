    \ estranhas são possíveis!*\n\n    Utilizando linhas, quadrados e caminhos, junto\
    \ com o random que aprendemos, é possível criar animações bem interessantes.\n\
    \n2.  Em vez de fazer um círculo se mover, você pode trabalhar com imagens! É\
    \ bastante simples: em vez de chamar a função circulo, chame a função `desenhaImagem(x,\
    \ 100)` (ela não receberá raio, claro). Sua função deve ser assim:\n\n    ```\n\
    \    1 var imagem = new Image();\n    2 imagem.src = \"http://www.caelum.com.br/imagens/\"\
    \ \n    3       + \"instrutores/fotos/paulo-silveira-90.jpg\";\n    4 \n    5\
    \ var desenhaImagem = function(x, y) {\n    6   c.drawImage(imagem, x, y)\n  \
    \  7 };\n    ```\n\n    Você pode trocar a imagem por qualquer outra! Caso a imagem\
    \ esteja no seu computador, coloque o valor de `imagem.src = \"nomeDaImagem.jpg\"\
    ` e deixe esse arquivo no mesmo diretório que o seu `.html`.\n\n3.  É fácil fazer\
    \ o círculo se mover de outras maneiras. Para ele descer na diagonal, basta chamar\
    \ `circulo(x, x, 10);`. E se quisermos que ele se mova de outra forma, como numa\
    \ parábola, vista no capítulo anterior? Ou mesmo de uma forma senoidal?\n\nQuer\
    \ ir mais longe? Um excelente artigo para você fazer sua animação, com uma imagem\
    \ que vai mudando a cada quadro é este (em inglês): [http://buildnewgames.com/sprite-animation/](http://buildnewgames.com/sprite-animation/)\n\
    \n### 8.5 Desafio: o jogo do tiro ao alvo\n\nEste é o seu último exercício. Vamos\
    \ dar apenas algumas poucas coordenadas para que você mesmo o desenvolva quase\
    \ que por completo.\n\nVamos desenhar um alvo, com círculos concêntricos vermelho\
    \ e branco. Você pode criar uma função parecida com essa, além de uma função `cor`\
    \ e outra `circulo`:\n\n```\n 1 var desenhaAlvo = function(x, y) {\n 2   var raio\
    \ = 40;\n 3     cor(\"white\");\n 4     circulo(x, y, raio);\n 5     cor(\"red\"\
    );\n 6     circulo(x, y, raio-10);\n 7     cor(\"white\");\n 8     circulo(x,\
    \ y, raio-20);\n 9     cor(\"red\");\n10     circulo(x, y, raio-30);\n11 };\n\
    ```"
