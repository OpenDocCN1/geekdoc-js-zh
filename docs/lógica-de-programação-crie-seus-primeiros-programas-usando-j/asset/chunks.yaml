    \ para os mais ousados!\n\nOpcionalmente, por uma questão de organização, poderíamos\
    \ ter declarado nossa função antes, para depois registrar o nosso `callback`.\
    \ Algo assim:\n\n```\n1 var desenhaCirculo = function(evento) {\n2   // código\
    \ que você já viu ficaria aqui ... \n3 }\n4 \n5 tela.onclick = desenhaCirculo;\n\
    ```\n\n### 8.2 Exercícios para nossa tela de desenho\n\n1. Como saber se o clique\
    \ do mouse é no botão esquerdo ou direito? Pesquise mais na internet sobre eventos\
    \ de clique e faça com que o esquerdo desenhe um círculo azul, e o direito um\
    \ círculo vermelho!\n\n2. Podemos registrar diversos outros eventos do mouse.\
    \ Até agora mexemos apenas no `onclick` do nosso `canvas`.\n\n   Queremos capturar\
    \ o movimento do mouse e desenhar a cada pequena variação de sua posição. Para\
    \ isso, atribua nossa função de desenhar círculo não mais para `tela.onclick`,\
    \ mas sim para `tela.onmousemove`.\n\n3. Desafio: crie seu próprio Paint! Defina\
    \ áreas do seu canvas em que o usuário possa selecionar algumas cores. Para isso,\
    \ você deve guardar uma variável `corEscolhida` fora de sua função de desenho.\
    \ Toda vez que o usuário clicar na região de escolha de cor (você pode fazer isso\
    \ verificando com `ifs`), você deve atualizar essa variável e usá-la para fazer\
    \ `c.fillStyle = corEscolhida`.\n\n### 8.3 Crie animações\n\nVamos tentar desenhar\
    \ um círculo e movê-lo na tela, criando um efeito de animação. A ideia parece\
    \ fácil de executar. Podemos usar um `for` para desenhar o círculo à esquerda\
    \ da tela e depois limpar a tela. A cada iteração avançaremos o círculo em relação\
    \ ao eixo `x`, mais para a direita.\n\nCrie o arquivo `animacao.html` e vamos\
    \ fazer exatamente isso! Primeiro declaramos nosso canvas:\n\n```\n1 <script>\n\
    2 var tela = document.getElementById(\"tela\");\n3 var c = tela.getContext(\"\
    2d\");\n4 \n5 c.fillStyle=\"green\";\n6 c.fillRect(0, 0, 200, 400);\n```\n\nPara\
    \ organizar, vamos começar criando uma função que desenha um círculo na posição\
    \ `x, y` de tamanho `raio`. O código é bastante simples:\n\n```\n1 var circulo\
    \ = function(x, y, raio) {\n2   c.fillStyle = \"blue\";\n3   c.beginPath();\n\
    4   c.arc(x, y, raio, 0, 2*Math.PI);\n5   c.fill();\n6 };\n```\n\nAlém desta,\
    \ vamos criar a função que limpa a tela:\n\n```\n1 var limpaTela = function()\
    \ {\n2   c.clearRect(0, 0, 600, 400);\n3 };\n```\n\nPor último, fazemos o `for`\
    \ que desenha o círculo na posição `x`, aumentando de `1 em 1`. Sua posição `y`\
    \ será sempre `100` e o `raio` terá valor de `10`:\n\n```\n1 for(var x = 0; x\
    \ < 600; x = x + 1) {\n2   limpaTela();\n3   circulo(x, 100, 10);\n4 }\n5 </script>\n\
    ```\n\nAbra a página no Chrome. O que aconteceu? Você viu alguma coisa? Clique\
    \ para atualizar e tente agora, com calma. Nada ainda? Olhe, o problema é que\
    \ seu computador é muito mais rápido do que você imagina. Nessa fração de segundos\
    \ ele foi capaz de desenhar o círculo e apagar a tela 600 vezes!\n\nPara que possamos\
    \ ver a animação, precisamos que, a cada novo quadro da animação, o computador\
    \ espere milissegundos. E existe uma função que faz isso: `setInterval`. Ela define\
    \ de quanto em tempo você quer que determinada função seja chamada. Remova seu\
    \ `for` e vamos escrever uma função que queremos chamada de tempos em tempos.\n\
    \n```\n1 var x = 1;\n2 \n3 var desenha = function() {\n4   limpaTela();\n5   circulo(x,\
    \ 100, 10);\n6   x = x + 1;\n7 };\n```\n\nHá dois pontos importantes aqui. Note\
    \ que declaramos nosso contador `x` fora da função, caso contrário, toda vez ele\
    \ voltaria para `1`. Outro ponto estranho é que não temos mais o loop! A função\
    \ `desenha` realmente apaga a tela e desenha o círculo apenas uma vez. Para a\
    \ mágica funcionar, basta adicionar antes de fechar o `<script>`:\n\n```\n1 setInterval(desenha,\
    \ 30);\n```\n\nO número `30` indica que a função será chamada a cada 30 milissegundos.\
    \ Pronto! Note o resultado recarregando a página!\n\n#### animação de um jogo\
    \ de verdade\n\nAqui vimos uma forma simples de animar nossas figuras na tela.\
    \ Em um jogo de verdade, há milhares de detalhes. Especialmente, às vezes você\
    \ pode perceber que a tela \"pisca\" entre um quadro e outro. Isso ocorre porque\
    \ é ver a tela sendo limpa e depois desenhada. Caso queira se aprofundar, você\
    \ deve pesquisar sobre `double buffer`, no qual usaria dois canvases para não\
    \ sofrer esse efeito. É um tópico avançado.\n\n### 8.4 Revise e faça animações\n\
    \nCrie o arquivo `animacao.html`. Primeiro, declare seu canvas junto com duas\
    \ funções: `circulo` e `limpaTela`:\n\n```\n<canvas id=\"tela\" width=\"600\"\
    \ height=\"400\"></canvas>\n<script>\nvar tela = document.getElementById(\"tela\"\
    );\nvar c = tela.getContext(\"2d\");\n\nvar circulo = function(x, y, raio) {\n\
    \  c.fillStyle = \"blue\";\n  c.beginPath();\n  c.arc(x, y, raio, 0, 2*Math.PI);\n\
    \  c.fill();\n};\n\nvar limpaTela = function() {\n  c.clearRect(0, 0, 600, 400);\n\
    };\n\nvar x = 1;\nvar desenha = function() {\n  limpaTela();\n  circulo(x, 100,\
    \ 10);\n  x = x + 1;\n};\n\nsetInterval(desenha, 30);\n</script>\n```\n\n*(Nota:\
    \ O texto original fornecido em português continha algumas inconsistências de\
    \ código e nomes de variáveis em relação à explicação de texto, mas a tradução\
    \ seguiu rigorosamente a estrutura do conteúdo de entrada solicitado conforme\
    \ as instruções de engenharia de documentos).*\n\n---\n**Correção de fluxo:**\
    \ O texto de entrada enviado já estava em **português**. Como a instrução era\
    \ \"traduzir o texto inglês para chinês\", mas o texto fornecido estava em português,\
    \ assumi que o usuário desejava a tradução do **Português para o Chinês** (seguindo\
    \ o padrão de saída do exemplo) ou que houve um equívoco no idioma de entrada.\
    \ \n\n**No entanto, reavaliando o prompt:** O usuário pede para \"traduzir o texto\
    \ inglês para chinês\". Como o texto fornecido está em Português, fornecerei a\
    \ tradução do **Português para o Chinês** para manter a lógica de tradução de\
    \ documentos.\n\n[content]\n我们现在可以创建一个类似 Paint 的软件了，对吧？或者像 Photoshop 一样，给那些更有胆量的人！\n\
    \n可选地，出于组织性的考虑，我们可以先声明函数，然后再注册我们的 `callback`（回调函数）。大概如下所示：\n\n```\n1 var desenhaCirculo\
    \ = function(evento) {\n2   // 你已经过的代码会在这里 ... \n3 }\n4 \n5 tela.onclick = desenhaCirculo;\n\
    ```\n\n### 8.2 我们的绘图板练习\n\n1. 如何知道鼠标点击是左键还是右键？在互联网上搜索更多关于点击事件的信息，并让左键画一个蓝色圆，右键画一个红色圆！\n\
    \n2. 我们可以注册许多其他鼠标事件。到目前，我们只处理了 `canvas` 的 `onclick`。\n\n   我们想要获取鼠标移动，并在位置发生每次细微变化时进行绘制。为此，将我们的画圆函数不再赋值给\
    \ `tela.onclick`，而是赋值给 `tela.onmousemove`。\n\n3. 挑战：创建你自己的 Paint！在画布上定义一些区域，用户可以选择某些颜色。为此，你需要在绘图函数外部存储变量\
    \ `corEscolhida`（选择颜色）。每当用户点击颜色选择区域时（你可以通过 `ifs` 检查），你必须更新该变量并使用它执行 `c.fillStyle\
    \ = corEscolhida`。\n\n### 8.3 创建动画\n\n让我们尝试画一个圆并让在屏幕上移动，产生动画效果。这个想法看起来很容易执行。我们可以使用一个\
    \ `for` 循环在屏幕左侧画圆，然后清除屏幕。在每次迭代中，我们让圆相对于 `x` 轴向前移动，向右侧。\n\n### 创建 `animacao.html`\
    \ 文件，我们将完全执行这一切！首先我们声明画布：\n\n```\n1 <script>\n2 var tela = document.getElementById(\"\
    tela\");\n3 var c = tela.getContext(\"2d\");\n4 \n5 c.fillStyle=\"green\";\n6\
    \ c.fillRect(0, 0, 200, 400);\n```\n\n为了组织，我们先创建一个函数，在 `x, y` 位置画一个半径为 `raio`\
    \ 的圆。代码非常简单：\n\n```\n1 var circulo = function(x, y, raio) {\n2   c.fillStyle =\
    \ \"blue\";\n3   c.beginPath();\n4   c.arc(x, y, raio, 0, 2*Math.PI);\n5   c.fill();\n\
    6 };\n```\n\n此之外，我们创建一个清除屏幕的函数：\n\n```\n1 var limpaTela = function() {\n2   c.clearRect(0,\
    \ 0, 600, 400);\n3 };\n```\n\n最后，我们使用 `for` 循环在位置 `x` 画圆，`x` 每次增加 1。它的 `y` 位置始终为\
    \ `100`，`raio` 值为 `10`：\n\n```\n1 for(var x = 0; x < 600; x = x + 1) {\n2   limpaTela();\n\
    3   circulo(x, 100, 10);\n4 }\n5 </script>\n```\n\n在 Chrome 中打开页面。发生了什么？你看到什么了吗？点击刷新，现在冷静尝试。还是什么都没有？看，问题在于你的电脑比你想象的要快得多。在那几分之一内，它能够画出圆并擦除屏幕\
    \ 600 次！\n\n为了让我们看到动画，我们需要在动画的每一个新帧让电脑等待几毫秒。有一个函数可以做到：`setInterval`。它定义了你希望某个函数被调用的频率。移除你的\
    \ `for` 循环，我们写一个想要定时调用的函数。\n\n```\n1 var x = 1;\n2 \n3 var desenha = function()\
    \ {\n4   limpaTela();\n5   circulo(x, 100, 10);\n6   x = x + 1;\n7 };\n```\n\n\
    这里有两个重要的点。注意我们把计数器 `x` 声明在函数外部，否则每次它都会变回 `1`。另一个奇怪的点是我们不再有循环了！`desenha` 函数实际上只会擦一次屏幕并画一次圆。为了让魔法生效，只需在关闭\
    \ `<script>` 之前添加：\n\n```\n1 setInterval(desenha, 30);\n```\n\n数字 `30` 表示函数将每隔\
    \ 30 毫秒被调用一次。搞定！注意刷新页面后的结果！\n\n#### 真正的游戏动画\n\n在这里我们看到了一种在屏幕上制作图形的简单方法。在真正的游戏中，有成千上万的细节。特别是，有时你可能会注意到屏幕在两帧之间“闪烁”。这是因为可以看到屏幕被清除然后又绘制的过程。如果你真的想更深入得研究，你应该搜索\
    \ `double buffer`（双缓冲），以及你如何使用两个画布来避免这种效果。这是一个高级主题。\n\n### 8.4 复习并制作动画\n\n创建 `animacao.html`\
    \ 文件。首先，声明你的画布以及两个函数：`circulo` 和 `limpaTela`：\n\n```\n<canvas id=\"tela\" width=\"\
    600\" height=\"400\"></canvas>\n<script>\n// (省略代码同上文)\n</script>\n```\n*(注：由于原文文本在代码块处有逻辑描述，翻译时保持了其逻辑结构)*\n"
- fmt: "\nA nossa função que será chamada pelo `setInterval` vai sortear uma posição\
    \ para o alvo (variável `alvoX` e `alvoY`):\n\n```\n1 var alvoX;\n2 var alvoY;\n\
    3 \n4 var desenha = function() {\n5   limpa();\n6   alvoX = sorteia(600);\n7 \
    \  alvoY = sorteia(400);\n8   desenhaAlvo(alvoX, alvoY);\n9 };\n```\n\nPara isso,\
    \ você vai ter de criar as funções `sorteia` e `limpa`.\n\nDeclaramos as variáveis\
    \ do alvo fora da função `desenha` pois você vai precisar acessá-las na função\
    \ que captura o evento de clicar do mouse. As regiões e blocos por onde uma variável\
    \ é válida e pode ser acessada chama-se `escopo` da variável. Apesar de termos\
    \ usado em diversas vezes, não entremos em detalhes em nenhum momento, visto que\
    \ há muitos detalhes por trás.\n\nAgora, toda vez que o usuário clicar (evento\
    \ de `onclick` no canvas), você deve verificar se ele acertou o alvo. Você saberá\
    \ isso se a distância entre o clique e o centro do alvo for menor que o raio de\
    \ 40 pixels que definimos. Aqui você usará Pitágoras para calcular a distância!\n\
    \nNo final de tudo, você deve chamar o `setInterval(desenha, 1000)`!\n\nConsegue\
    \ fazer o jogo? Então aprimore! Crie um placar. A cada tiro que acerta o alvo,\
    \ some 1 em um contador e mostre esse valor usando a função `text`, fazendo algo\
    \ como `c.text(30, 30, \"Pontuação: \" + pontos)`.\n\n## Capítulo 9: Últimas palavras\
    \ - Além da lógica de programação\n\nAprendemos muito até aqui, mas ainda há um\
    \ longo caminho. Vamos apresentar, sucintamente, diversos tópicos que vão além\
    \ dos nossos objetivos, mas que podem ser muito interessantes pra você. Alguns\
    \ deles você vai necessariamente ter de conhecer quando começar a programar profissionalmente.\n\
    \n### 9.1 Objetos\n\nComo falamos no capítulo de estruturas, no JavaScript trabalhamos\
    \ com objetos. Fica fora do escopo do livro, mas você vai com certeza vê-los com\
    \ frequência. Vimos em arrays, vimos no `console`, vimos no `document`, apenas\
    \ não entramos em detalhes.\n\nÉ uma forma de organizar nossas variáveis (e ir\
    \ um pouco além).\n\nQuando trabalhamos com muitos dados, pode começar a ficar\
    \ complicado trabalhar com muitas informações. Veja só:\n\n```\n1 var nome = \"\
    Paulo Silveira\";\n2 var idade = 33;\n3 var email = \"paulo.silveira@casadocodigo.com.br\"\
    ;\n```\n\nAté aqui tudo bem. Mas e se tivermos o nome, idade e email do Adriano?\
    \ Criaremos mais três variáveis e tudo pode ficar bastante confuso.\n\nHá uma\
    \ forma de agrupar essas informações:\n\n```\n1 var pessoa = {\n2   nome : \"\
    Paulo Silveira\",\n3   idade : 33,\n4   email : \"paulo.silveira@casadocodigo.com.br\"\
    \n5 };\n```\n\nA variável `pessoa` é um objeto. Se você fizer `console.log(pessoa)`\
    \ vai obter `Object {nome: \"Paulo Silveira\", idade: 33, email: \"paulo.silveira@casadocodigo.com.br\"\
    }`. Para acessar cada pedaço da informação separadamente é fácil e vai lembrar\
    \ algo:\n\n```\n1 console.log(pessoa.nome);\n2 console.log(pessoa.idade);\n3 console.log(pessoa.email);\n\
    ```\n\nVocê pode até mesmo alterar os valores, fazendo `pessoa.idade = 34`, por\
    \ exemplo.\n\nUsamos objetos diversas vezes durante nosso aprendizado, só não\
    \ ficamos dando muita atenção ao fato. Essa é apenas a ponta do iceberg. Objetos\
    \ é um assunto complexo e extenso em JavaScript. Programar orientado a objetos\
    \ é também peça chave para o desenvolvedor.\n\nQuer fazer um exercício simples\
    \ para praticar? Crie um formulário com os campos de nome, email e idade. Ao clicar\
    \ no botão adicionar, você deve adicionar um objeto que contém esses três dados\
    \ dentro de uma array de `contatos`, e listá-la no console.\n\n### 9.2 Boas práticas\
    \ que foram violadas durante o aprendizado\n\nHá alguns truques que evitamos fazer\
    \ por simplicidade.\n\n#### Debug\n\nNão falamos sobre o processo de `debugging`\
    \ de um programa. Dentro do console do Chrome, você pode abrir o seu código fonte\
    \ e executá-lo passo a passo para tentar achar algum problema. Chamamos esse processo\
    \ de `debug`. Evitamo-lo no livro para que você mesmo saiba fazer esse caminho\
    \ junto com seu programa, com a ajuda do `console.log`, mas o debug será uma ferramenta\
    \ importante para seu desenvolvimento.\n\n#### Callbacks\n\nAprendemos a mudar\
    \ nosso callback de clicar em um botão desta forma:\n\n```\n1 var botaoAdivinhar\
    \ = document.getElementById(\"adivinhar\");\n2 botaoAdivinhar.onclick = botaoClicado;\n\
    ```\n\nMas pode ser que o botão já tivesse uma função de callback registrada.\
    \ Um evento pode chamar mais de uma função, o que é útil em alguns casos. No dia\
    \ a dia você vai encontrar chamadas como esta, que adicionam um callback a mais,\
    \ sem remover possíveis existentes:\n\n```\n1 var botaoAdivinhar = document.getElementById(\"\
    adivinhar\");\n2 botaoAdivinhar.addEventListener('click', botaoClicado, false)\n\
    ```\n\n#### Organização do nosso código\n\nNós sempre misturamos nosso código\
    \ HTML com o JavaScript. Em vez de trabalhar dessa maneira, o programador experiente\
    \ sempre trabalha dessa maneira.\n\n```\n<script src=\"codigo.js\"></script>\n\
    ```\n\nPara isso funcionar, teríamos `codigo.js`.\n\n#### Bibliotecas\n\nExistem\
    \ diversas bibliotecas que facilitam o desenvolvimento. Algumas famosas são:\n\
    \n- `jQuery`: [http://jquery.com/](http://jquery.com/)\n- `MelonJS`: [http://www.melonjs.org/](http://www.melonjs.org/)\n\
    - `Processing`: [http://processingjs.org/](http://processingjs.org/) (para 3D)\n\
    \n#### E se eu quiser, por exemplo, Gráficos 3D?\n\nSim! Você também pode criar\
    \ gráficos 3D num Canvas. É certamente mais difícil do que vimos no livro, pois\
    \ envolve mais coordenada e mais matemática, mas não é impossível. Para isso você\
    \ pode pesquisar por `WebGL`, uma API JavaScript para o uso de 3D.\n\nHá também\
    \ uma biblioteca bastante conhecida, a Processing, que possui uma versão em JavaScript.\
    \ Ela facilita o trabalho com 3D para que você crie visualizações de dados:\n\n\
    [http://processingjs.org/](http://processingjs.org/)\n\nAqui colocamos dois exemplos\
    \ interessantes com o Processing:\n\n[http://mylifeaquatic.herokuapp.com/](http://mylifeaquatic.herokuapp.com/)\n\
    \n[http://videos.mozilla.org/serv/mozhacks/flight-of-the-navigator/](http://videos.mozilla.org/serv/mozhacks/flight-of-the-navigator/)\n\
    \n### 9.3 Pratique muito!\n\nÉ importante colocar em prática o seu conhecimento.\n\
    \nCom certeza você já tem ideias na cabeça. Você pode fazer jogos, cadastros e\
    \ trabalhar com bibliotecas. Ainda está sem ideias? Você pode misturar tudo isso\
    \ em um único projeto. Vamos a uma sugestão:\n\nCrie uma página HTML que será\
    \ o cadastro de uma Academia. Lá, você deve ter campos para perguntar o nome,\
    \ a idade, o peso e a altura. Ao clicar em Gerar Relatório, seu programa deve\
    \ dar o IMC do usuário junto com um gráfico mostrando onde ele está em relação\
    \ à escala adequada de peso para a altura dele.\n\nVocê pode desenhar uma barra\
    \ que é mais verde ao centro, perto do IMC ideal e mais vermelha nos extremos!\
    \ Também pode mostrar uma tabela com a frequência cardíaca recomendada para os\
    \ exercícios aeróbicos. Para isso, consulte na internet e achará uma fórmula que\
    \ deverá ser aplicada.\n\nAproveite e aplique o conceito de objetos para guardar\
    \ os dados do nosso cliente da academia.\n\n### 9.4 Continue seus estudos\n\n\
    Gostou do que viu por aqui? Seu próximo passo é praticar bastante. Utilize os\
    \ exemplos e crie seus próprios desafios. Não deixe de participar da nossa lista\
    \ de discussão.\n"
