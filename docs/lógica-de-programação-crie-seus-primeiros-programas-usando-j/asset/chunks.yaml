    \n2. 太不可议了，它完成了所有工作却不累！想象一下如果是我们来完成这些计算将会怎样。甚至可以尝试更大的数字，比如 20000、50000 或 100000。\n\
    \n```\n1 while(anoDeCopa <= 100000)\n```\n\n你可能会注意到时间的增加，但可能仍然非常微小，只是浏览器中显示的内容应该会有更多信息。\n\
