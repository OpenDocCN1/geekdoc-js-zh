- fmt: "\nPronto. A função `pulaLinha` agora se refere a uma função que pode ser chamada.\
    \ **Como chamá-la?** Da mesma forma que você já fez com `alert`, por exemplo.\
    \ Isto é, **usando os parênteses** após o seu nome:\n\n```\n1 var ano = 2012;\n\
    2 document.write(\"Eu nasci em : \" + (ano - 25));\n3 pulaLinha();\n4 document.write(\"\
    Adriano nasceu em : \" + (ano - 26));\n5 pulaLinha();\n6 document.write(\"Paulo\
    \ nasceu em : \" + (ano - 32));\n7 pulaLinha();\n```\n\nToda vez que aparece `pulaLinha();`\
    \ o navegador vai executar o código da função `pulaLinha`. Dessa forma começamos\
    \ a evitar código duplicado. Isso é apenas o início, vamos utilizar mais das funções\
    \ para facilitar o nosso código.\n\n### 2.9 Funções passando informações e chamando\
    \ outras funções\n\nVamos novamente nos concentrar no texto, na revisão faremos\
    \ o código que está sendo descrito aqui.\n\nJá é possível enxergar bem onde ganhamos:\
    \ podemos mudar o comportamento do nosso programa alterando apenas um único lugar:\
    \ a função que criamos para a `pulaLinha`. Porém nosso código continua um pouco\
    \ grande, e toda hora temos de chamar essa nossa função.\n\nQuando percebemos\
    \ que estamos sendo muito repetitivos, sempre podemos considerar a criação de\
    \ uma nova função. Nesse caso, está fácil enxergar que toda vez que jogamos uma\
    \ `frase` para o navegador com `document.write`, logo em seguida pulamos uma linha.\
    \ Podemos unificar isso em um único lugar? Isso é possível criando mais uma função,\
    \ uma que mostra uma frase e põe também o `<br>`. Por exemplo:\n\n```\n1 function\
    \ mostra() {\n2   document.write(\"alguma frase<br>\");\n3 }\n```\n\nMas essa\
    \ função não é tão útil: ela sempre mostra a mesma frase. Não serve para o que\
    \ a gente quer, pois a frase que desejamos mostrar depende do momento. Não se\
    \ desespere, há sim como resolver esse problema. Quando **declaramos** (criamos)\
    \ uma função, podemos fazer de tal forma para que recebamos algo a mais, alguma\
    \ informação que seja importante para nós. No caso da função que mostra alguma\
    \ frase, o que seria esse valor importante? A `frase` que queremos mostrar! Fazemos\
    \ isso declarando dentro dos parênteses, como `function(frase)`, e depois utilizamos\
    \ `frase` normalmente como as variáveis que já conhecemos:\n\n```\n1 function\
    \ mostra(frase) {\n2   document.write(frase + \"<br>\");\n3 }\n```\n\nPronto.\
    \ Mas como o `mostra` saberá que `frase` deve ser colocada no navegador? Isso\
    \ será feito durante a chamada da função. Diferente do `pulaLinha`, que chamamos\
    \ utilizando os parênteses sem nada dentro, o `mostra` será invocado com a `frase`\
    \ dentro deles:\n\n```\n1 mostra(\"Usando funções para melhorar o código\");\n\
    ```\n\nEssa string que queremos mostrar vai ser **passada** para a função que\
    \ criamos, e lá dentro será a nossa variável `frase`. Variáveis que são passadas\
    \ para funções são frequentemente chamadas de **parâmetros** ou **argumentos**.\n\
    \n![O texto que passarmos entre os parênteses vai parar na variável frase função](Images/funcao-recebendo-parametro.png)*Figura\
    \ 2.1: O texto que passarmos entre os parênteses vai parar na variável frase função*\n\
    \nPodemos mudar um pouco a nossa função `mostra` para que ela também se aproveite\
    \ da nossa velha `pulaLinha`, em vez de concatenar o `<br>` por si só:\n\n```\n\
    1 function mostra(frase) {\n2   document.write(frase);\n3   pulaLinha();\n4 }\n\
    ```\n\nÉ isso mesmo: uma função pode chamar outra função. É algo que ocorre com\
    \ muita frequência. Qual é a vantagem aqui? Agora o nosso `mostra` também acompanhará\
    \ as mudanças do `pulaLinha`. Se quisermos pular linha de uma forma mais visual,\
    \ seja com `<br>`, `<hr>` ou outro recurso do HTML, a função `mostra` vai se beneficiar\
    \ disso, sem nem mesmo precisar ser modificada!\n\n### 2.10 Revise o código: usando\
    \ a função mostra\n\nFizemos bastante durante essa lição. Vamos revisar como está\
    \ seu arquivo agora. Organize-o, criando o arquivo `mostra_idades2.html`. Logo\
    \ no começo, temos a definição das nossas funções. Começamos pela `pulaLinha`:\n\
    \n```\n1 <script>\n2 \n3 function pulaLinha() {\n4   document.write(\"<br>\");\n\
    5 }\n```\n\nLogo abaixo vamos ter nossa segunda função, a `mostra`, que por sua\
    \ vez faz uso da `pulaLinha`. Diferente da anterior, ela recebe um **parâmetro**,\
    \ que será a frase a ser apresentada no navegador:\n\n```\n1 function mostra(frase)\
    \ {\n2   document.write(frase);\n3   pulaLinha();\n4 }\n```\n\nLembre-se de colocar\
    \ o código dentro de uma função sempre mais à direita, usando o `TAB` do seu teclado.\
    \ Esse é o processo de **indentar** o código (neologismo do inglês *to indent*).\
    \ É importante que sua **indentação** esteja correta para facilitar a leitura\
    \ do programa.\n\nApós as duas funções declaradas, vamos utilizá-las no nosso\
    \ código para imprimir quantos anos tem cada um dos envolvidos:\n\n```\n1 var\
    \ ano = 2012;\n2 mostra(\"Eu nasci em : \" + (ano - 25));\n3 mostra(\"Adriano\
    \ nasceu em : \" + (ano - 26));\n4 mostra(\"Paulo nasceu em : \" + (ano - 32));\n\
    5 </script>\n```\n\n### 2.11 Mostrando mensagens secretas, apenas para o programador\n\
    \nO `alert` joga uma mensagem dentro de popup. Utilizá-lo extensivamente pode\
    \ acabar com a paciência do usuário. O `document.write` é menos intrusivo, mas\
    \ você já reparou que as mensagens são jogadas diretamente na página, sem nem\
    \ precisar clicar em *OK* a cada nova mensagem.\n\nMesmo colocando `document.write`\
    \ em uma função, muitas vezes queremos que algumas mensagens não apareçam para\
    \ o usuário, porém gostaríamos de poder vê-las durante o desenvolvimento. de forma\
    \ que fosse visível apenas para você, programador. Isso é muito útil para descobrir\
    \ erros (o que chamamos de **bug**), aprender truques e testar recursos. Guardamos\
    \ esses dados em **logs**. É comum usar o neologismo **logar**, assim mesmo, em\
    \ português. Para logar informações com JavaScript, há a função `console.log`.\
    \ Faça um teste:\n\n```\n1 <script>\n2 document.write(\"olá mundo!\");\n3 document.write(\"\
    esse é meu segundo programa\");\n4 console.log(\"esta mensagem aparece apenas\
    \ no log\");\n5 </script>\n```\n\nQual é o resultado?\n\nA mensagem passada ao\
    \ `console.log` não apareceu! Quando utilizamos essa função, o navegador guarda\
    \ todas as mensagens em um local especial, longe da vista do usuário comum. Para\
    \ ver o resultado precisamos habilitar a visualização do console, exatamente como\
    \ fizemos na lição anterior para verificar erros.\n\nNo Chrome, você faz isso\
    \ clicando no pequeno ícone de ferramentas/menus, escolhe a opção *Ferramentas*\
    \ (*Tools*, se estiver em inglês) e depois *Console JavaScript*. É o mesmo console\
    \ que você usou para ver as mensagens de erro do seu código.\n\nHá a tecla de\
    \ atalho `CTRL+SHIFT+J` no Windows e no Linux para abrir essa aba (*Command+Option+J*\
    \ no Mac) e depois clicar no Console, caso outra opção esteja selecionada. Ele\
    \ realmente é importante e você estará visitando-o com frequência.\n"
