    \ notificação de tipo de função de\n\n### 3.3 Arrays\n\n```javascript\nlet segredos\
    \ = [16, 34, 37, 42, 50, 58];\n```\n\nIsso não parece muito útil. Como pegar o\
    \ primeiro elemento, isto é, o primeiro número dessa série de segredos? Usamos\
    \ os colchetes novamente, para indicar que queremos um elemento, e não a array\
    \ inteira:\n\n```javascript\nconsole.log(segredos[0]); // Saorna 16\n```\n\nE\
    \ se quiséssemos saber qual é o tamanho da array?\n\n```javascript\nconsole.log(segredos.length);\
    \ // Saorna 6\n```\n\nE se quiséssemos adicionar um novo número?\n\n```javascript\n\
    segredos.push(60);\nconsole.log(segredos); // Saorna [16, 34, 37, 42, 50, 58,\
    \ 60]\n```\n\nE se quiséssemos remover o último elemento?\n\n```javascript\nsegredos.pop();\n\
    console.log(segredos); // Saorna [16, 34, 37, 42, 50, 58]\n```\n\nE se quiséssemos\
    \ alterar um elemento?\n\n```javascript\nsegredos[2] = 100;\nconsole.log(segredos);\
    \ // Saorna [16, 34, 100, 42, 50, 58]\n```\n\nAs arrays são poderosas. Podemos\
    \ percorrer todos os elementos usando um loop.\n\n```javascript\nfor (let i =\
    \ 0; i < segredos.length; i++) {\n  console.log(\"Elemento na posição \" + i +\
    \ \" é \" + segredos[i]);\n}\n```\n\nOu também podemos usar o método mais moderno\
    \ `forEach`:\n\n```javascript\nsegredos.forEach(function(numero) {\n  console.log(\"\
    Número: \" + numero);\n});\n```\n"
  raw: "Agora abra a página. Veja que temos uma caixa de texto e um botão! Esse é\
    \ o seu primeiro **formulário**!\n\n![Nosso primeiro formulário usando HTML](Images/formulario1.png)*Figura\
    \ 6.1: Nosso primeiro formulário usando HTML*\n\nClique no botão, o que acontece?\
    \ Nada!\n\nSim! É assim que funciona grande parte das páginas da internet em que\
    \ você coloca dados. Quando você clica em um botão, muitas vezes esses dados são\
    \ enviados para outros computadores, conhecido como servidores, para que lá sejam\
    \ armazenados. Mas podemos também trabalhar com esses dados no nosso próprio computador,\
    \ usando JavaScript.\n\nVamos fazer com que esse botão veja se o usuário acertar\
    \ o número que estamos pensando. Antes de continuar, precisamos dar nomes a cada\
    \ uma das caixinhas que temos. Fazemos isso colocando identificadores (`id`) em\
    \ cada um dos inputs!\n\n```\n1 <input type=\"text\" id=\"numero\" />\n2 <input\
    \ type=\"submit\" id=\"adivinhar\" value=\"Compare com o meu segredo!\"/>\n```\n\
    \nAgora já podemos começar nosso código JavaScript. O primeiro passo que faremos\
    \ será acessar a caixa de texto que contém o número e dar um `alert`. Eis o código\
    \ completo:\n\n```\n1 <input type=\"text\" id=\"numero\" />\n2 <input type=\"\
    submit\" id=\"adivinhar\" value=\"Compare com o meu segredo!\"/>\n3 \n4 <script>\n\
    5 var caixaDoNumero = document.getElementById(\"numero\");\n6 alert(caixaDoNumero.value);\n\
    7 </script>\n```\n\nOpa! Aqui aconteceu muita coisa. `document.getElementById(\"\
    numero\")` é uma forma de fazer com que o JavaScript vasculhe o código HTML e\
    \ encontre um elemento de `id = numero`. Essa variável ainda não é o valor que\
    \ digitamos, ela é a caixinha de texto em si! Fazendo `caixaDoNumero.value`, aí\
    \ sim temos o valor do conteúdo da caixa, isto é, o que foi digitado dentro dela.\n\
    \nAbra o arquivo. O que acontece agora? Sim! O `alert` é executado logo que abrimos\
    \ a página, sem nos dar tempo de preencher algum valor na caixa, mostrando algo\
    \ vazio. Não queremos fazer o `alert` logo quando a página for carregada. Queremos\
    \ chamar o `alert` **quando o botão `adivinhar` for clicado**!\n\nPara isso, primeiramente\
    \ vamos criar uma função que queremos que seja executada quando o botão for clicado.\
    \ Remova o `alert` e adicione:\n\n```\n1 var botaoClicado = function() {\n2  \
    \ alert(caixaDoNumero.value);\n3 };\n```\n\nE se abrirmos a página agora, digitarmos\
    \ o número e clicarmos no botão? Nada novamente!\n\nO que está faltando? Está\
    \ faltando definir que, quando alguém clicar no botão `adivinhar`, a função `botaoClicado`\
    \ deve ser chamada! Fazemos isso de uma forma muito simples. Adicione as seguintes\
    \ linhas:\n\n```\n1 var botaoAdivinhar = document.getElementById(\"adivinhar\"\
    );\n2 botaoAdivinhar.onclick = botaoClicado;\n```\n\nNa primeira linha pegamos\
    \ o botão e guardamos na variável `botaoAdivinhar`. A segunda linha é a importante.\
    \ Ela diz que quando o botão `adivinhar` for clicado (`onclick`) a função `botaoClicado`\
    \ deve ser chamada. É muito frequente relacionar um determinado acontecimento\
    \ à execução de uma função. Esses acontecimentos são comumente chamados de **eventos**,\
    \ e essas funções a serem executadas em determinados eventos são conhecidas como\
    \ funções de *callback*. Não se preocupe tanto com nomenclatura, mas ela vai aparecer\
    \ cada vez com mais frequência nos seus estudos.\n\nE a adivinhação? Bem, ficou\
    \ faltando guardar o número que pensamos para depois comparar com o digitado.\
    \ Vamos revisar esse código já colocando essa funcionalidade.\n\n### 6.2 Revisando\
    \ uso de HTML e criando o jogo\n\nVamos refazer o nosso código, mas dessa vez\
    \ com o jogo. Primeiro passo, crie o arquivo `adivinha_mais.html`. Vamos começar\
    \ declarando dois elementos HTML: um para a caixa que conterá o número, e outro,\
    \ o botão que verifica se acertou:\n\n```\n1 <input type=\"text\" id=\"numero\"\
    \ />\n2 <input type=\"submit\" id=\"adivinhar\" \n3   value=\"Compare com o número\
    \ que estou pensando!\" />\n```\n\nAgora começamos com HTML. Em vez de sortear\
    \ um número, vamos deixá-lo fixo por uma questão de simplicidade:\n\n```\n1 <script>\n\
    2 var segredo = 8;\n```\n\nPegamos, então, o elemento do HTML através daquele\
    \ código grande, o chamado `document.getElementById`.\n\n```\n1 var caixaDoNumero\
    \ = document.getElementById(\"numero\");\n```\n\nCriamos uma função para verificar\
    \ se o número digitado (que é `caixaDoNumero.value`) é igual ao `segredo`. Dependendo\
    \ do que for, imprime o resultado:\n\n```\n1 var botaoClicado = function() {\n\
    2   if(segredo == caixaDoNumero.value) {\n3     alert(\"Parabéns! Você acertou\
    \ o número secreto\");\n4   }\n5   else {\n6     alert(\"Infelizmente você errou!\"\
    );\n7   }\n8 };\n```\n\nSó falta o último passo: falar que quando o botão `adivinhar`\
    \ for clicado (o evento de clique), ele deve chamar a função `botaoAdivinhar`:\n\
    \n```\n1 var botaoAdivinhar = document.getElementById(\"adivinhar\");\n2 botaoAdivinhar.onclick\
    \ = botaoClicado;\n3 </script>\n```\n\nComo já vimos, esse tipo de função que\
    \ recebe a notificação de um evento (por exemplo, o clique do mouse, o teclar\
    \ de uma letra, o clique da direita do mouse, o mexer da barra de rolagem etc)\
    \ chama-se *callback*.\n\nSeguem dois exercícios simples para você praticar mais:\n\
    \n1.  Modifique seu exercício para que o sorteio seja feito realmente. Isto é,\
    \ não use um número fixo no `segredo`, e sim randômico.\n\n2.  Você reparou que,\
    \ ao clicar no botão para comparar, o número que você digitou previamente continua\
    \ lá? Limpe a caixa de texto fazendo `caixaDoNumero.value = \"\";`.\n\n3.  Aqui\
    \ também é um bom lugar para fazer testes no console do Chrome, como visto na\
    \ seção [3.8](#index_split_004.html_console-testes).\n\n    ![Abrindo o console\
    \ junto com o formulário para fazer testes](Images/formulario1-console.png)\n\n\
    \    *Figura 6.1: Abrindo o console junto com o formulário para fazer testes*\n\
    \n    Repare que, ao começarmos a digitar `botao`, o Chrome percebe que há duas\
    \ variáveis com esse nome no nosso JavaScript e já dá as sugestões! É o chamado\
    \ *code completion* atuando mais uma vez. Se você escolher a nossa caixinha, isso\
    \ é, o `botaoAdivinhar`, e depois pressionar o ponto e começar a digitar `onclick`,\
    \ verá que ele possui uma gama de outras funções de callback!\n\n### 6.3 Facilite\
    \ o jogo da adivinhação colocando mais números!\n\nO jogo é um pouco injusto,\
    \ ainda mais se os números puderem ir de 1 a 60, por exemplo. Algo mais próximo\
    \ da nossa loteria.\n\nPara ajudar nosso usuário, que tal se tivéssemos mais de\
    \ 1 segredo? Por exemplo, podemos ter 6 números como o segredo e depois verificamos\
    \ o chute do usuário. Por exemplo:\n\n```\n1 var segredo1 = 16;\n2 var segredo2\
    \ = 34;\n3 var segredo3 = 37;\n4 var segredo4 = 42;\n5 var segredo5 = 50;\n6 var\
    \ segredo6 = 58;\n```\n\nHum, algo não está tão bonito. Para comparar com o chute,\
    \ precisaremos ter um `if` gigante, verificando cada um deles e fazendo o **ou**\
    \ (com `||`). Pior: e se precisarmos ter mais segredos? Precisaríamos criar mais\
    \ variáveis e mexer novamente no nosso `if`.\n\nMuito seria facilitado se houvesse\
    \ uma maneira fácil de guardar múltiplas variáveis, sem saber exatamente quantas.\
    \ E há! Vamos criar uma variável `segredos` que guarda vários números:\n\n```\n\
    1 var segredos = [16, 34, 37, 42, 50, 58];\n```\n\nA sintaxe é nova para nós.\
    \ Nunca havíamos visto os colchetes. Neste caso, eles estão criando uma **array**\
    \ pra gente. Sim, tem um nome complicado e você precisa se acostumar a isso.\n\
    \nAbra o console do Chrome e faça alguns testes. O primeiro de todos é criar a\
    \ variável `segredos` e imprimir seu valor.\n\n```\n1 var segredos = [16, 34,\
    \ 37, 42, 50, 58];\n2 console.log(segredos);\n```\n\nRepare a saída! Nada surpreendente:\n\
    \n![Mostrando a nossa array](Images/segredos.png)*Figura 6.2: Mostrando a nossa\
    \ array*\n\nIsso não parece muito útil. Como pegar o primeiro elemento, isto é,\
    \ o primeiro número dessa série de segredos? Usamos os colchetes novamente, para\
    \ indicar que queremos pegar um elemento, e não a array inteira:\n\n```\n1 console.log(segredos[1]);\n\
    ```\n\nOpa! A saída deu 34! Por quê? O JavaScript, assim como diversas outras\
    \ linguagens, começa a contar as posições da array a partir do 0. Então nesse\
    \ caso temos do 0 ao 5\\. Para pegar o 16, faríamos:\n\n```\n1 console.log(segredos[0]);\n\
    ```"
