    \ idade dos familiares.\n\n### 5.10 Jogo: Mais chances para adivinhar o número\
    \ que estou pensando\n\nNo capítulo [4](#index_split_005.html_condicionais), fizemos\
    \ o computador pensar em um número aleatório entre 0 e 100 e tentamos adivinhar\
    \ o seu resultado. Você deve ter reparado que era extremamente difícil acertar,\
