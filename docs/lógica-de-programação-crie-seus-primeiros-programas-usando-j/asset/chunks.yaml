    Em muitas linguagens, assim como no JavaScript, uma sequência de caracteres entre
    aspas é chamada de `string`. Dizemos, portanto, que o `+`, além de somar números,
    concatena `strings`.


    Você vai trabalhar com números ou sequências de caracteres (`string`)? Depende
    do que quer fazer. Com números, podemos trabalhar as operações matemáticas. Para
    saber uma uma estimativa do ano em que você nasceu, subtraímos o ano atual desse
    valor:


    ```javascript

    1 document.write("Eu nasci em: ");

    2 document.write(2012 - 25);

    ```


    E se em vez de ter feito `document.write(2012 - 25)`, tivéssemos colocado `2012
    - 25` todo entre aspas, fazendo `document.write("2012 - 25")`? Qual é o resultado?


    Apenas por uma questão de concisão, às vezes vamos omitir a tag `script` dos próximos
    programas, como acabamos de fazer. Você deve sim utilizá-las. Aliás, o que aconteceria
    com nosso programa no caso de não colocarmos essas instruções dentro da tag `script`?
    Faça o teste.


    Além do operador de subtração `-`, há o de soma `+`, multiplicação `*` e divisão
    `/`. Você pode somar a sua idade a dos autores. Paulo tem 32 anos e Adriano tem
    26:


    ```javascript

    1 document.write("A soma das nossas idades é: ");

    2 document.write(25 + 32 + 26);

    ```


    Para calcular a média, basta dividirmos o resultado da soma por 3:


    ```javascript

    1 document.write("A média das nossas idades é: ");

    2 document.write(25 + 32 + 26 / 3);

    ```


    Verifique o resultado. Não é o esperado! A conta de divisão é calculada antes
    da soma, como na matemática da escola, logo o primeiro valor a ser calculado é
    `26 / 3`. Podemos utilizar parênteses para forçar a ordem desejada do cálculo,
    realizando primeiramente as somas:


    ```javascript

    1 document.write((25 + 32 + 26) / 3);

    ```


    Os parênteses são utilizados mesmo quando a precedência dos operadores já trabalha
    conforme esperamos, pois pode facilitar a legibilidade do que queremos fazer.


    Também é possível misturar números com `strings`, mas sempre com cuidado. O que
    acontece ao somá-los?


    ```javascript

    1 document.write("Minha idade é: " + 25);

    ```


    A sequência de caracteres `"Minha idade é"` vai aparecer junta ao número `25`,
    isto é, serão concatenadas! Repare também que precisamos tomar cuidado com os
    parênteses. Vamos misturar strings e números mais uma vez:


    ```javascript

    1 document.write("A média das nossas idades é: " + ((25 + 32 + 26) / 3));

    ```


    ## 2.3 Revisando o seu código: trabalhando com números


    Crie um arquivo `testando_idades.html` e vamos revisar o que já aprendemos. Coloque
    o código que calcula a média das idades:


    ```html

    <script>

    1 document.write("Minha idade é: " + 25);

    2 document.write("A soma das nossas idades é: ");

    3 document.write(25 + 32 + 26);

    4 document.write("A média das nossas idades é: " + ((25 + 32 + 26) / 3));

    </script>

    ```


    Cada revisão dessas sempre oferecerá exercícios importantes para que você pratique
    e fixe o que vimos. Não deixe de ir além e realizar seus próprios testes. Sua
    curiosidade será importante para seu aprendizado.


    1. Esse código não está usando o `<br>`, então toda a saída está na mesma linha!
    Fica praticamente impossível de acompanhar o programa. Altere-o, adicionando `<br>`
    ao final de cada linha. Onde há aspas, basta colocá-lo lá dentro. Onde não há,
    você precisará concatenar. Por exemplo, nesta linha:


    ```javascript

    1 document.write("Minha idade é: " + 25);

    ```


    Você precisa adicionar um `+ "<br>"`:


    ```javascript

    1 document.write("Minha idade é: " + 25 + "<br>");

    ```


    2. Quantos anos você tem de diferença do seu irmão? Adicione uma nova linha de
    código, imprimindo a mensagem `"Nossa diferença de idade é"`, concatenando com
    o resultado da subtração da sua idade com a do seu irmão (ou de um amigo, claro!).
    A resposta pode dar negativa, sem dúvida.


    3. Se, em média, um casal tem filho quando eles têm cerca de 28 anos, quantas
    gerações se passaram desde o ano zero? Imprima esse número, dividindo o ano atual
    por essa média.


    ## 2.4 Organize seus dados em variáveis


    Podemos imprimir o ano do nascimento de cada um de nós três, utilizando o recurso
    de juntar (concatenar) uma sequência de caracteres (uma `string`) com números.


    ```javascript

    1 document.write("Eu nasci em : " + (2012 - 25) + "<br>");

    2 document.write("Adriano nasceu em : " + (2012 - 26) + "<br>");

    3 document.write("Paulo nasceu em : " + (2012 - 32) + "<br>");

    ```


    Além desse `<br>` que apareceu muitas vezes, tanto aqui quanto na seção anterior,
    o número `2012` aparece repetidamente. Podemos usar variáveis para armazenar esses
    valores e evitar a repetição.


    ```javascript

    var anoNascimento = 2012;

    var idadeAdriano = 26;

    var idadePaulo = 32;


    document.write("Eu nasci em : " + (anoNascimento - 25) + "<br>");

    document.write("Adriano nasceu em : " + (anoNascimento - idadeAdriano) + "<br>");

    document.write("Paulo nasceu em : " + (anoNascimento - idadePaulo) + "<br>");

    ```


    ## 2.5 Reescrevendo a média de idade dos amigos


    Com essas mudanças no seu código, você pode calcular a média de seus amigos de
    uma forma mais organizada, sem copiar os números pra dentro do `document.write`:


    ```javascript

    document.write((eu + adriano + paulo) / 3);

    ```


    Uma outra forma seria quebrar esse processo em passos. É comum criar algumas variáveis
    a mais para ajudar a legibilidade.


    ## 2.6 Revisando o seu código: organize-se com variáveis


    Na seção anterior, escrevemos nosso código de forma mais legível. Caso queira,
    crie o arquivo `testando_idades_com_variaveis.html` para praticarmos esse código
    uma última vez. Inicialmente coloque a declaração da idade de cada pessoa:


    ```html

    <script>

    1 var eu = 25;

    2 var adriano = 26;

    3 var paulo = 32;

    </script>

    ```

