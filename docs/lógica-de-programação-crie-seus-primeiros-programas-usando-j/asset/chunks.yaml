    Para calculá-lo, divida a distância percorrida pela quantidade de litros gasto.
    Imprima esse valor, organizando suas contas em variáveis.


    É comum utilizar uma variável dessa forma, como `consumoDeGasolina`. A letra `D`
    e `G` facilitam a leitura. Compare `consumoDeGasolina` com `consumodegasolina`.
