    \ `numeroPensado`. Vamos fazê-lo em um novo arquivo, chamado `jogo_adivinha_com_tentativas.html`:\n\
    \n```\n1 <script>\n2 var numeroPensado = Math.round(Math.random() * 100);\n3 </script>\n\
    ```\n\nA partir do `numeroPensado`, precisaremos perguntar qual o número que o\
    \ usuário gostaria de dar o chute. Vamos estipular também que a quantidade máxima\
    \ de tentativas será 3 e que quando passar da terceira tentativa, a repetição\
    \ deverá se encerrar.\n\nPara isso, vamos declarar uma variável chamada `numeroDaTentativa`,\
    \ onde guardaremos se é a primeira, segunda ou terceira tentativa. Essa variável\
    \ começará em 1, já que no começo do programa, estaremos na primeira tentativa.\
    \ Enquanto esse número for menor ou igual a 3, ou seja, enquanto não passou da\
    \ terceira tentativa, faremos a repetição da pergunta. Vamos usar o `while` para\
    \ isso e não vamos nos esquecer que ao final de cada repetição deveremos aumentar\
    \ o número da tentativa (caso contrário, entraremos em repetições infinitas):\n\
    \n```\n1 <script>\n2 var numeroPensado = Math.round(Math.random() * 100);\n3 \n\
    4 var numeroDaTentativa = 1;\n5 while(numeroDaTentativa <= 3) {\n6 \n7   numeroDaTentativa++;\n\
    8 }\n9 </script>\n```\n\nPrecisamos perguntar para o usuário do programa qual\
    \ é o número que ele acha que o computador pensou. Vamos fazer isso através de\
    \ um `prompt`, que colocaremos dentro do bloco de repetição, o `while`, pois ele\
    \ fará parte de uma tentativa:\n\n```\n 1 <script>\n 2   var numeroPensado = Math.round(Math.random()\
    \ * 100);\n 3 \n 4   var numeroDaTentativa = 1;\n 5   while(numeroDaTentativa\
    \ <= 3) {\n 6     var chute = prompt(\"Qual você acha que é?\");\n 7     \n 8\
    \     numeroDaTentativa++;\n 9   }\n10 </script>\n```\n\nPronto, agora a cada\
    \ repetição perguntamos ao usuário qual é o chute que ele quer dar. Precisamos\
    \ saber se ele acertou ou não. Para isso, basta compararmos o número do `chute`\
    \ com o `numeroPensado` e ver se eles são iguais. Mostraremos mensagens para o\
    \ usuário nos dois casos."
