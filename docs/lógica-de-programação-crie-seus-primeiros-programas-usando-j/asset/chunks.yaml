    \    mostra(\"Você errou! Eu tinha pensado no \" + numeroPensado);\n 9   }\n10\
    \ </script>\n```\n\nLogo no começo do programa, o computador pensa em um número,\
    \ que é guardado. Em seguida, tentamos adivinhar esse número que o computador\
    \ pensou e uma mensagem é exibida para o acerto ou erro da tentativa.\n\nO que\
    \ queremos que aconteça agora é que esse processo de chute **se repita** por 3\
    \ vezes. Já vimos que para realizarmos uma repetição no nosso programa, podemos\
    \ usar o `while`. Ou seja, enquanto não foi feita a terceira tentativa, você será\
    \ perguntado novamente caso erre, e caso acerte, uma mensagem de parabéns lhe\
    \ será mostrada.\n\nNovamente, a primeira ação do programa será pensar em um número\
