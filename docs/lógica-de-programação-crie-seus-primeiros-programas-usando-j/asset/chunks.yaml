    \ a esperada soma.\n\nPrecisávamos somar número com número e não número com texto.\
    \ Resolvemos isso através da função `parseInt` para transformar o texto que recuperamos,\
    \ correspondente ao ano inicial, em um número.\n\n```\n1 var anoComoTexto = prompt(\"\
    Informe o ano inicial\");\n2 var anoDeCopa = parseInt(anoComoTexto);\n```\n\n\
    Nesse momento, o código completo do programa é o seguinte:\n\n```\n 1 <script>\n\
    \ 2 var mostra = function(frase) {\n 3   document.write(frase + \"<br>\");\n 4\
    \ };\n 5 \n 6 var anoComoTexto = prompt(\"Informe o ano inicial\");\n 7 var anoDeCopa\
    \ = parseInt(anoComoTexto);\n 8 var anoLimite = prompt(\"Qual o ano limite?\"\
    );\n 9 \n10 while(anoDeCopa <= anoLimite) {\n11   mostra(anoDeCopa + \" é ano\
    \ de copa!\");\n12   anoDeCopa = 4 + anoDeCopa;\n13 }\n14 mostra(\"Ufa! Esses\
    \ foram os anos de copa até \" + anoLimite);\n15 </script>\n```\n\nAgora podemos\
    \ abrir o programa `anos_de_copa.html` no navegador, que ele nos perguntará o\
    \ ano inicial e o limite e fará todo o processo corretamente.\n\n1.  Faça o mesmo\
    \ programa que mostra os anos de copa, porém para as olimpíadas. Lembre-se o primeiro\
    \ ano de olimpíadas foi 1896 e que ela também acontece a cada 4 anos.\n\n2.  Faça\
    \ testes no console do Chrome, como vimos na seção [3.8](#index_split_004.html_console-testes).\
    \ Descubra quanto vale `\"10\" + 10`, `\"10\" + \"10\"`, `\"10\" * 10`, `\"10\"\
    \ * \"10\"`. Deixe sua imaginação criar os mais variados exemplos e você começará\
    \ a entender quando o JavaScript faz conta, quando ele concatena, e quando ele\
    \ não consegue fazer nenhum dos dois!\n\n### 5.6 Praticando mais um pouco: Faça\
    \ tabuadas\n\nQuem nunca hesitou ao ter que falar a tabuada do 7? 7, 14, 21, 28...\
    \ e esqueci! O cálculo das tabuadas é um bom exemplo de processo de repetição.\
    \ Calculamos a tabuada do 7, indo do 7 vezes 1, até o 7 vezes 10\\. Inclusive,\
    \ isso fica até mais claro com a forma costumeira com a qual alunos de escola\
    \ escrevem tabuadas:\n\n*   7 x 1 = 7\n\n*   7 x 2 = 14\n\n*   7 x 3 = 21\n\n\
    *   7 x 4 = 28\n\n*   7 x 5 = 35\n\n*   7 x 6 = 42\n\n*   7 x 7 = 49\n\n*   7\
    \ x 8 = 56\n\n*   7 x 9 = 63\n\n*   7 x 10 = 70\n\nRepare que multiplicamos o\
    \ 7, começando no 1, **enquanto** o 7 for menor ou igual a 10\\. É mais um caso\
    \ em que conseguimos tranquilamente fazer com que um programa de computador realize\
    \ todo o trabalho para nós e apenas mostre os resultados que queremos. Então,\
    \ vamos lá!\n\nO primeiro passo é criarmos um novo arquivo, que podemos chamar\
    \ de `tabuadas.html`. Nesse arquivo, vamos começar a escrever nosso código JavaScript\
    \ através da Tag `<script>`:\n\n```\n1 <script>\n2 \n3 </script>\n```\n\nComo\
    \ na nossa tabuada o cálculo inicia na multiplicação por 1 e vai até multiplicarmos\
    \ por 10, vamos criar uma variável que guarde esse valor, que vamos chamar de\
    \ `multiplicador` e iniciará em 1.\n\n```\n1 <script>\n2   var multiplicador =\
    \ 1;\n3 </script>\n```\n\n**Enquanto** a variável `multiplicador` for menor ou\
    \ igual a 10, vamos querer calcular a tabuada. Podemos fazer com que nosso programa\
    \ realize essas multiplicações por 7, enquanto o multiplicador for menor ou igual\
    \ a 10\\. Lembre-se de copiar a função `mostra` para o arquivo `tabuadas.html`,\
    \ assim, conseguiremos exibir os resultados da tabuada no navegador.\n\n```\n\
    \ 1 <script>\n 2   var mostra = function(frase) {\n 3     document.write(frase\
    \ + \"<br>\");\n 4   };\n 5   \n 6   var multiplicador = 1;\n 7   while(multiplicador\
    \ <= 10) {\n 8     mostra(7 * multiplicador);\n 9   }\n10 </script>\n```\n\nMas\
    \ se tentarmos abrir esse arquivo no navegador, ele nunca vai parar de fazer multiplicações.\
    \ Pior. A multiplicação que ele fará, será sempre 7 vezes 1\\. Isso acontece porque\
    \ ainda não estamos aumentando o número do multiplicador, após cada conta realizada.\
    \ Precisamos que a cada repetição, o multiplicador aumente um. Na programação,\
    \ costumamos chamar esse processo de **incremento**. Então, precisamos incrementar\
    \ 1 à variável `multiplicador`:\n\n```\n 1 <script>\n 2   var mostra = function(frase)\
    \ {\n 3     document.write(frase + \"<br>\");\n 4   };\n 5 \n 6   var multiplicador\
    \ = 1;\n 7   while(multiplicador <= 10) {\n 8     mostra(7 * multiplicador);\n\
    \ 9     multiplicador = multiplicador + 1;\n10   }\n11 </script>\n```\n\nFicou\
    \ fácil agora, não? Vamos fazer mais um exercício para praticarmos e melhorarmos\
    \ um pouco mais esse exemplo.\n\n1.  Ao invés de mostrar apenas o número resultante,\
    \ mostre uma mensagem mais interessante para cada multiplicação. Algo como: \"\
    7 vezes 10 é igual a 70\". Juntando um pouco de texto com números fica fácil de\
    \ fazer. Bastaria substituir o código atual que mostra o resultado da multiplicação\
    \ por:\n\n    ```\n    1 mostra(\"7 vezes \" + multiplicador + \" é igual a \"\
    \ + 7 * multiplicador);\n    ```\n\n    O resultado final no navegador será parecida\
    \ com a imagem a seguir.\n\n2.  Ao invés de sempre realizarmos a tabuada do 7,\
    \ pergunte ao usuário qual é a tabuada que ele deseja saber. Basta que, antes\
    \ das repetições, você utilize um `prompt` e guarde o número informado em uma\
    \ variável, que deverá ser usada para calcular esse resultado.\n\n### 5.7 Aprenda\
    \ uma forma diferente de mostrar a tabuada: o comando for\n\nGeralmente, quando\
    \ temos as repetições que não sejam um *loop infinito*, temos 3 características\
    \ que a envolvem:\n\n*   Um valor inicial, que no caso da tabuada é o `multiplicador`\
    \ iniciando em 1;\n\n*   Uma condição que determine se a repetição deve ser feita\
    \ ou não, que no nosso caso é quando verificamos que o `multiplicador` ainda é\
    \ menor que 10;\n\n*   Uma modificação no valor que cause o fim da repetição,\
    \ ou seja, que tenha influência na condição que é verificada para a repetição,\
    \ justamente para que não fique em repetições infinitas. No caso da tabuada, é\
    \ quando aumentamos o valor do multiplicador a cada repetição, ou seja, o incremento.\n\
    \nAté agora, conseguimos realizar essas repetições através do `while`, sempre\
    \ escrevendo o código necessário para essas 3 características, porém, não há nada\
    \ que nos induza, quando estamos escrevendo o código do `while` a lembrar dessas\
    \ características.\n\nJustamente com esse intuito, existe o comando `for`, que\
    \ nos induz a pensar em tudo antes de montar o código da repetição. A sintaxe,\
    \ ou seja, o jeito de escrever o comando, pode parecer um pouco estranha no começo,\
    \ mas vamos entendê-lo aos poucos.\n\n```\n1 for( ; ; ) {\n2   alert(\"mensagem\
    \ para repetição infinita\");\n3 }\n```\n\nSintaxe estranha, não? Primeiramente,\
    \ ao abrir um programa com esse código em um navegador, perceberemos que será\
    \ feito um *loop* infinito, ou seja, o `for` está fazendo sim uma repetição. Mas\
    \ quando ele termina? Nunca. Um `for( ; ; )` é equivalente ao `while(true)` que\
    \ vimos no começo do capítulo.\n\nRepare que dentro dos parênteses do comando\
    \ `for` há dois `;` (ponto e vírgula), dando a sensação de que há ali um espaço\
    \ para que algumas três informações sejam dadas. O código a seguir não é válido,\
    \ é apenas para mostrar onde estão esses três espaços:\n\n```\n1 for(espaco 1;\
    \ espaco 2; espaco 3)\n```"
