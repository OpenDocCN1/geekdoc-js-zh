    ### 1.7 Socorro! Meu programa não funciona. Conheça e use o console do Chrome


    Não se apavore com os erros. É importante saber enfrentá-los. Entender uma mensagem
    de erro é fundamental. Há sempre também fóruns e listas de discussão onde você
    pode pedir ajuda. Lembre-se de descrever muito bem seu problema e qual é a mensagem
    de erros, mas ao mesmo tempo é necessário ser sucinto. O fórum do GUJ é bastante
    conhecido na comunidade de desenvolvedores brasileiros de diversas linguagens.
    Utilize-o para tirar suas dúvidas: [http://www.guj.com.br](http://www.guj.com.br)


    Há alguns erros bem comuns. Um exemplo é não utilizar os parênteses em um `alert`.
    Se você fizer isso, nada que estiver dentro desta tag de `script` funcionará e
    não haverá uma mensagem de erro! Faça o teste, adicionando uma segunda chamada
    ao `alert` de forma errada:


    ```

    1 <script>

    2 alert("podemos fazer mais com JavaScript!");

    3 alert "chamando sem parenteses";

    4 </script>

    ```


    O navegador não vai nem mostrar o primeiro `alert`, onde não há nenhum erro! Como
    então descobrir o problema? Há uma ferramenta do Chrome para nos auxiliar nessa
    tarefa.


    ![Selecionando o menu para abrir o Console JavaScript](Images/chrome-console.png)
    Figura 1.10: Selecionando o menu para abrir o Console JavaScript


    Clique no ícone de menus/ferramentas. Ele fica no topo superior direito do Chrome.
    Depois acesse o menu `Ferramentas` (`Tools`) e por último `Console JavaScript`,
    como na figura. A seguinte janela aparecerá, indicando o **erro de sintaxe**:


    ![Console JavaScript do Chrome aberto](Images/chrome-console2.png) Figura 1.11:
    Console JavaScript do Chrome aberto


    Neste caso, ele está avisando que temos uma "string não esperada". Ajudou? Algumas
    vezes as mensagens de erro podem não ser muito claras, mas já ajudam bastante
    indicando o local do problema. Repare que, à direita da mensagem de erro, o navegador
    diz em que arquivo e em qual linha houve o problema. Você pode até mesmo clicar
    ali para ir diretamente ao trecho de código problemático.


    Com essa mensagem de erro, o Chrome quer indicar que o `"chamando sem parenteses"`
    apareceu em um lugar não esperado, como se estivesse falando numa "língua" que
    ele não entende. Esse tipo de erro é o que chamamos de **erro de sintaxe**, um
    erro na forma de se comunicar com quem entende da linguagem. Nesse caso em particular,
    ele não esperava essa mensagem fora de parênteses. Corrija o problema.


    Faça testes com outros erros. Escreva `alert` de maneira errada, por exemplo,
    `alertar`.


    Ao mesmo tempo, há algumas mudanças que não impactariam na execução do código.
    Por exemplo, poderíamos ter dado espaço entre `alert` e a abertura dos parênteses.
    E o ponto-e-vírgula, poderíamos omiti-lo? E as aspas? Teste, descubra. É importante
    experimentar além das nossas lições.


    Para o Firefox, há um console semelhante acessando o menu `Ferramentas` (`Tools`),
    `Web Developer` e depois `Console Web`. No Internet Explorer 9, você pode encontrá-lo
    clicando no ícone de engrenagem e escolhendo `F12 Ferramentas de Desenvolvedor`
    (`Developer Tools`).


