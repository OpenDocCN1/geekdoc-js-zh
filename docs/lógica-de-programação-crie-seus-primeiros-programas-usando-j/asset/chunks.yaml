  trans: "\n\n接下来，我们询问用户一个数字，即他的`chute`，让他尝试猜猜计算机想的数字。通过这个数字，我们可以检查用户是否正确。\n\n```javascript\n\
    1 <script>\n2   var numeroPensado = Math.round(Math.random() * 100);\n3 \n4  \
    \ var chute = prompt(\"Já pensei. Qual você acha que é?\");\n5   if(chute == numeroPensado)\
    \ {\n6     mostra(\"Uau! Você acertou, pois eu pensei no \" + numeroPensado);\n\
    7   }\n8 </script>\n```\n\n记得在你的代码中要有 `mostra` 函数。\n\n之后，如果猜测错误，我们会显示消息。为了实现这一点，我们使用了\
    \ `else`：\n\n```javascript\n 1 <script>\n 2   var numeroPensado = Math.round(Math.random()\
    \ * 100);\n 3 \n 4   var chute = prompt(\"Já pensei. Qual você acha que é?\");\n\
    \ 5   if(chute == numeroPensado) {\n 6     mostra(\"Uau! Você acertou, pois eu\
    \ pensei no \" + numeroPensado);\n 7   } else {\n 8     mostra(\"Você errou! Eu\
    \ tinha pensado no \" + numeroPensado);\n 9   }\n10 </script>\n```\n\n准备好了，现在在浏览器中打开这个程序，你会被询问一个数字。紧接着就会显示该数字是否与计算机想的数字相同。\n\
    \n1. 使得你的游戏在用户尝试错误时，显示他猜的数字是比程序想的数字大还是小。\n2. 你可以创建一个 `sorteia` 函数，它接收一个数字 `n`\
    \ 并在 0 到 `n` 之间抽取一个随机数并返回该值。这样，你就不需要写 `var numeroPensado = Math.round(Math.random()\
    \ * 100);`，而是写 `var numeroPensado = sorteia(100);`。进行此修改，创建一个新函数并使用它。\n3. 如果用户输入了不是数字的内容呢？例如，他猜了\
    \ `\"banana\"`？这让他失去一次猜测机会可就不妙了……\n\n   你可以通过 `isNaN(variavel)` 函数检查用户输入的是否非数字。例如，`if(isNaN(chute))`\
    \ 应该显示消息 *只有数字是有效的*。`NaN` 意味着 *Not a Number*，在葡萄牙语中类似于“不是一个数字”。在 Chrome 控制台中测试这个函数，执行\
    \ `isNaN(\"banana\");` 和 `isNaN(123);`。\n\n## 第 5 章：如何重复程序的任务？\n\n我们已经可以根据条件执行一行代码了。通过\
    \ `if` 和 `else`，我们可以定义应该执行哪部分代码。但如果我们需要执行它多次呢？复制粘贴代码能帮助我们完成这项任务吗？\n\n### 5.1 下一次世界杯将在什么时候举行？\n\
    \n自 1930 年以来，世界上就开始举办足球世界杯，每届都有不同的举办地。该赛事的周期为 4 年。请问 2030 年会有世界杯吗？\n\n我们了解此的一种方法是以举办某届赛事的年份为基准，例如\
    \ 2014 年，然后加上 4 年。我们立刻知道 2018 年是一个会有世界杯的年份。如果我们继续这个过程，下一次世界杯年将是 2022 年，接着是 2026\
    \ 年，然后就到了 2030 年，我们发现是的，会有世界杯。**只要我们不累，我们可以无限地继续这个过程**。\n\n让我们写一个程序，以极其简单的方式显示从\
    \ 1930 年开始的世界杯年份。只需要有一个值为 1930 的变量，并且它的值每次增加 4 即可。\n\n```javascript\n 1 var anoDeCopa\
    \ = 1930;\n 2 alert(anoDeCopa + \" tem copa!\");\n 3 \n 4 anoDeCopa = anoDeCopa\
    \ + 4;\n 5 alert(anoDeCopa + \" tem copa!\");\n 6 \n 7 anoDeCopa = anoDeCopa +\
    \ 4;\n 8 alert(anoDeCopa + \" tem copa!\");\n 9 \n10 anoDeCopa = anoDeCopa + 4;\n\
    11 alert(anoDeCopa + \" tem copa!\");\n```\n\n我们可以一直重复这段代码直到厌。但注意我们将面临的工作量。如果我们想要更多的世界杯呢？我们需要写多少代码？这是大量的重复性工作！让我们尝试一种稍微不同的方法。\n\
    \n我们想每 4 年打印一次世界杯年份，以便了解所有的世界杯。这可能吗？想法是创建一个程序，在变量 `anoDeCopa` 上加 `4`，向我们提示这个值，并重新执行相同的步骤。\n\
    \n按照这个逻辑，我们可以在 `anos_de_copa.html` 文件中创建一个新程序，向我们显示自 1930 年以来举办过和将举办世界杯的年份：\n\n\
    ```javascript\n1 <script>\n2 var anoDeCopa = 1930;\n3 \n4 while(true) {\n5   alert(anoDeCopa\
    \ + \" tem copa\");\n6   anoDeCopa = anoDeCopa + 4;\n7 }\n</script>\n```\n"
- fmt: "\nPrimeiro, vamos escrever novamente o código da função `mostra`. Antes também\
    \ criávamos a função `pulaLinha`, mais por uma questão didática, tendo em vista\
    \ que não reutilizamos o `pulaLinha` em outros locais, nem ela é muito complexa.\
    \ Dessa vez faremos as duas coisas na mesma função: chamar o `document.write`\
    \ e adicionar o `<br>` ao final:\n\n```\n1 var mostra = function(frase) {\n2 \
    \  document.write(frase + \"<br>\");\n3 };\n```\n\nAgora troque a linha na qual\
    \ você estava usando o `alert` para usar o `mostra`.\n\n```\n1 mostra(anoDeCopa\
    \ + \" tem copa!\");\n```\n\nPodemos inclusive mostrar uma mensagem indicando\
    \ que acabou:\n\n```\n 1 <script>\n 2 var anoDeCopa = 1930;\n 3 \n 4 while(anoDeCopa\
    \ <= 2014) {\n 5   mostra(anoDeCopa + \" tem copa!\");\n 6   anoDeCopa = anoDeCopa\
    \ + 4;\n 7 }\n 8 \n 9 mostra(\"Ufa! Esses foram os anos de copa até 2014.\");\n\
    10 </script>\n```\n\nVocê pode pensar no `while` como se a cada repetição ele\
    \ de fizesse a pergunta: *Posso continuar*? A condição dentro dos parênteses (no\
    \ nosso caso `anoDeCopa <= 2014`) será utilizada para decidir. Se a resposta for\
    \ `true`, significa que pode repetir o bloco mais uma vez, caso contrário, ele\
    \ deve parar as repetições e ir para o próximo comando após o bloco do `while`,\
    \ delimitado através das chaves.\n\n### 5.3 Revise seu código: mostre os anos\
    \ de copas até cansar\n\nVamos relembrar o que fizemos com o arquivo `anos_de_copa.html`.\
    \ Estamos criando um programa que nos facilite descobrir quais são os anos em\
    \ que haverá ou houve copa do mundo. Nesse instante, temos no nosso código a definição\
    \ da função `mostra` que exibirá os anos no navegador e a inicialização da variável\
    \ `anoDeCopa` em 1930, pois foi quando ocorreu o evento pela primeira vez.\n\n\
    ```\n1 <script>\n2 var mostra = function(frase) {\n3   document.write(frase +\
    \ \"<br>\");\n4 };\n5 \n6 var anoDeCopa = 1930;\n```\n\nAgora queremos imprimir\
    \ os anos de copa **enquanto for antes de 2014**, lembrando que copas acontecem\
    \ de 4 em 4 anos.\n\n```\n1 while(anoDeCopa <= 2014) {\n2   mostra(anoDeCopa +\
    \ \" tem copa!\");\n3   anoDeCopa = anoDeCopa + 4;\n4 }\n5 </script>\n```\n\n\
    No final de tudo, podemos mostrar que chegamos ao fim da exibição dos anos de\
    \ copa. Quando a condição que temos no `while` não for mais verdadeira o programa\
    \ executa o código logo após o bloco do `while`, ou seja, vai para imediatamente\
    \ após o fechamento das chaves.\n\nPodemos adicionar uma linha para o programa\
    \ mostrar uma mensagem, logo após o bloco do `while`.\n\n```\n1 mostra(\"Ufa!\
    \ Esses foram os anos de copa até 2014.\");\n```\n\n1. Agora que conseguimos mostrar\
    \ os anos de copa, parece que nosso computador nem se cansou com essa tarefa.\
    \ Aumente seu programa para mostrar as copas até 2100. Basta trocar o ano limite\
    \ na condição do `while`. Abra o arquivo `anos_de_copa.html` no seu navegador\
    \ e veja se ele demorará mais tempo.\n\n2. Incível, ele faz todo esse trabalho\
    \ e não cansa! Imagine se fôssemos nós realizando todas essas contas. Você pode\
    \ até mesmo testar com números grandes, como 20000, 50000 ou 100000.\n\n```\n\
    1 while(anoDeCopa <= 100000)\n```\n\nVocê pode até perceber um aumento do tempo,\
    \ mas provavelmente continuará muito pequeno, apenas o conteúdo mostrado no navegador\
    \ que deverá ter muito mais informações.\n\n3. Note que para mudarmos o ano limite,\
    \ temos que alterar o valor na condição do `while`. Ou seja, sempre temos que\
    \ ficar alterando o arquivo. Vamos deixar isso mais flexível, perguntando para\
    \ o usuário qual é o ano limite que ele quer saber se há copa do mundo.\n\nAprendemos\
    \ que podemos perguntar informações para o usuário através do `prompt`. Capture\
    \ o `anoLimite` através de uma linha como `var anoLimite = prompt(\"Qual é o ano\
    \ limite?\");` e depois utilize essa variável para fazer seu `while`. A condição\
    \ vai ficar `anoDeCopa <= anoLimite`.\n\n4. Abra o programa novamente no seu navegador\
    \ e verifique que agora, antes de começar a execução, ele nos pergunta qual é\
    \ o ano limite. Digite 2050, por exemplo, e veja o resultado.\n\n5. O que será\
    \ que acontece se pedirmos para mostrar as copas até o ano 100, ano em que a copa\
    \ do mundo nem havia sido criada ainda? Faça esse teste e repare que nosso programa\
    \ é bem esperto, já sabe até que naquele ano não havia copas do mundo. Mas como\
    \ ele fez isso?\n\nSimples. Na condição do nosso `while`, estamos falando que\
