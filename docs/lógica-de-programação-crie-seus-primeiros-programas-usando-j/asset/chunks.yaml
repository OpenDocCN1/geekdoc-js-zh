    \ != true`.\n\nQual é o próximo passo? Agora basta registrarmos que essa função\
    \ vai realmente ser o callback do evento de clicar no botão, como também já aprendemos:\n\
    \n```\n1 var botaoAdivinhar = document.getElementById(\"adivinhar\");\n2 botaoAdivinhar.onclick\
    \ = botaoClicado;\n3 </script>\n```\n\nAbra a sua loteria e tente acertar um dos\
    \ números.\n\n1.  Remova o `break` do seu código e veja o que acontece. Por que\
    \ é necessário ter o `break` aí?\n\n2.  Caso o usuário acerte o número, diga qual\
    \ é a posição do número que ele acertou. Por exemplo: *\"Parabéns, você acertou\
    \ o 5o número!\"*. Isto é, o índice da array, só tome cuidado com o zero.\n\n\
    ### 6.4 Evite os número repetidos no Bingo\n\nJá vimos como é o trabalho básico\
    \ em uma array, mas como modificar seus valores? Repare na array de `segredos`:\n\
    \n```\n1 var segredos = [16, 34, 37, 42, 50, 58];\n2 console.log(segredos[0]);\n\
    ```\n\nAssim como podemos pegar o primeiro elemento através de `segredos[0]`,\
    \ podemos modificá-lo:\n\n```\n1 segredos[0] = 20;\n2 console.log(segredos[0]);\n\
    ```\n\nÉ uma atribuição como qualquer outra que já fizemos.\n\nUma array também\
    \ nos fornece acesso a uma série de funções para poder mexer em seu conteúdo.\
    \ O mais importante é a `push`, que adiciona um elemento no final da array. Observe:\n\
    \n```\n1 segredos.push(60);\n2 console.log(segredos[6]);\n3 console.log(segredos.length);\n\
    ```\n\nAgora nosso array tem tamanho 7! O `push` colocou o `60` após o `58`, fazendo\
    \ com que `segredos` agora contenha `[16, 34, 37, 42, 50, 58, 60]`.\n\nA sintaxe\
    \ realmente é um pouco diferente, quando fazemos `segredos.push(...)`. Mas repare\
    \ que já havíamos feito isso antes, com o `console.log(...)`, o `document.write(...)`.\
    \ Ainda é cedo para você estudar o que há por trás de tudo isso, mas a verdade\
    \ é que tanto `segredos`, quanto `console` e `document` são variáveis que possuem\
    \ valores e também outras funções – são os conhecidos **objetos**. Falamos um\
    \ pouco mais sobre isso no apêndice, mas não se preocupe.\n\nVamos aplicar esse\
    \ novo conhecimento. Considere que temos um formulário onde será adicionado cada\
    \ novo número do sorteio do Bingo. Queremos verificar se todo número digitado\
    \ é diferente dos números que já saíram, o que indicaria um problema ou fraude!\
    \ Isto é, se os números 34, 43 e 55 já saíram, 43 não pode sair de novo!\n\nCrie\
    \ o arquivo `bingo.html` e adicione o HTML para o campo de texto do número e o\
    \ botão de adicionar:\n\n```\n1 <input type=\"text\" id=\"numero\" />\n2 <input\
    \ type=\"submit\" value=\"Adicione e verifique no Bingo!\" \n3           id=\"\
    verificar\"/>\n```\n\nAgora, no nosso JavaScript, vamos declarar uma variável\
    \ com todos os números do Bingo que já foram sorteados. Opa! Mas e se nenhum foi\
    \ sorteado ainda? Aí usamos simplesmente `[]`, que é uma array com zero elementos:\n\
    \n```\n1 <script>\n2 var sorteados = [];\n```\n\nAgora queremos verificar, toda\
    \ vez que alguém clicar no botão de adicionar, se ele já não existe na nossa array\
    \ de sorteados. Caso exista, exibe-se uma mensagem de alerta; caso contrário,\
    \ adiciona-se o número na nossa lista de sorteado. Poxa! É muita coisa. Vamos\
    \ começar simplesmente adicionando na array e fazendo um `console.log`:\n\n```\n\
    1 var adicionarSorteado = function() {\n2     var numero = document.getElementById(\"\
    numero\").value;\n3     sorteados.push(numero);\n4     console.log(sorteados);\n\
    5 };\n```\n\nRepare que aqui fizemos `document.getElementById(\"numero\").value`\
    \ tudo numa linha só, em vez de primeiro guardar `document.getElementById(\"numero\"\
    )` em uma variável temporária e depois pegar o `.value` dela. Desde que o código\
    \ não fique demasiadamente comprido nem complicado, é comum evitar algumas variáveis\
    \ temporárias.\n\nAinda está faltando dizer que essa função deverá ser executada\
    \ quando ocorrer o evento de clicar (`onclick`) do nosso botão `verificar`. Isto\
    \ é, dizer que essa será nossa função de *callback* do clicar desse botão, como\
    \ já vimos antes:\n\n```\n1 var botao = document.getElementById(\"verificar\"\
    );\n2 botao.onclick = adicionarSorteado;\n3 </script>\n```\n\nVá se acostumando\
    \ aos callbacks, eles vão aparecer com muita frequência no seu futuro como programador.\n\
    \nAgora pode abrir o seu `bingo.html`. Se você adicionar um número repetido, vai\
    \ ver que ele aparecerá listado duas vezes no seu console.\n\nPara evitar o número\
    \ repetido, basta alterarmos a nossa função para procurar se o novo número já\
    \ não está antes. Faremos um `for` que percorre cada um dos elementos:\n\n```\n\
    \ 1 var adicionarSorteado = function() {\n 2     var numero = document.getElementById(\"\
    numero\").value;\n 3     for(var i = 0; i < sorteados.length; i = i + 1) {\n 4\
    \       if(sorteados[i] == numero) {\n 5         alert(\"Numero já sorteado!\"\
    );\n 6         return;\n 7       }\n 8     }\n 9     sorteados.push(numero);\n\
    10     console.log(sorteados);\n11 };\n```"
