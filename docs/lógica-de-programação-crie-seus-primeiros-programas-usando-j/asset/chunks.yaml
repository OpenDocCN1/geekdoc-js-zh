    \ numeroTentativa++;\n}\n</script>\n```\n"
- fmt: "\n```javascript\n 1 <script>\n 2 var numeroPensado = Math.round(Math.random()\
    \ * 100);\n 3 \n 4 var numeroDaTentativa = 1;\n 5 while(numeroDaTentativa <= 3)\
    \ {\n 6   var chute = prompt(\"Qual você acha que é?\");\n 7   \n 8   if(chute\
    \ == numeroPensado) {\n 9     alert(\"Parabéns, você acertou!\");\n10   } else\
    \ {\n11     alert(\"Você errou. Será que ainda tem mais tentativas?\");\n12  \
    \ }\n13   numeroDaTentativa++;\n14 }\n15 </script>\n```\n\nAbra o arquivo `jogo_adivinha_com_tentativas.html`\
    \ em seu navegador e tente acertar. Se estiver difícil, uma dica é diminuir a\
    \ possiblidade de números que o computador vai pensar, de 100 para 10, por exemplo.\
    \ Para isso, basta mudar a seguinte linha:\n\n```javascript\n1 var numeroPensado\
    \ = Math.round(Math.random() * 10);\n```\n\nApós algumas brincadeiras, você notará\
    \ que há algo errado nesse jogo. Acerte um número na primeira ou na segunda tentativa\
    \ para ver o que acontece. O jogo mostra a mensagem de parabéns, indicando que\
    \ você acertou, mas vai te perguntar de novo qual é o número que ele pensou. Precisamos\
    \ corrigir isso, mas como? Onde está o problema no nosso código?\n\nAnalisando\
    \ com um pouco de cuidado, percebemos que uma vez que o chute foi acertado, não\
    \ precisamos tentar novamente, ou seja, as repetições devem acabar imediatamente.\
    \ Mas como fazemos para interromper as repetições e sair imediatamente do `while`?\n\
    \nO Javascript (assim como outras linguagens de programação) possuem um comando\
    \ chamado `break` (quebrar), que significa que quando ele for chamado, a repetição\
    \ deverá ser quebrada, ou seja, interrompida. É exatamente isso que precisamos.\
    \ Quando o chute for acertado, precisamos interromper as repetições, já que não\
    \ faz sentido perguntar novamente para o usuário.\n\n```javascript\n1 if(chute\
    \ == numeroPensado) {\n2   alert(\"Parabéns, você acertou!\");\n3   break;\n4\
    \ } else {\n5   alert(\"Você errou. Será que ainda tem mais tentativas?\");\n\
    6 }\n```\n\nCom essa alteração, tente acertar um chute na primeira ou segunda\
    \ tentativa. O programa não vai mais ficar te pedindo outro chute. Bem melhor,\
    \ não?\n\n### 5.11 Revisando nosso código: O jogo da adivinhação dos números\n\
    \nComeçamos o nosso jogo, no arquivo `jogo_adivinha_com_tentativas.html`, fazendo\
    \ com que o computador pensasse em um número aleatório entre 0 e 100.\n\n```javascript\n\
    1 var numeroPensado = Math.round(Math.random() * 100);\n```\n\nO próximo passo\
    \ foi perguntarmos no máximo 3 vezes para o usuário qual o número que ele acha\
    \ que o computador pensou.\n\n```javascript\n1 var numeroDaTentativa = 1;\n2 while(numeroDaTentativa\
    \ <= 3) {\n3   var chute = prompt(\"Qual você acha que é?\");\n4   \n5   numeroDaTentativa++;\n\
    6 }\n```\n\nA cada tentativa, precisamos verificar se ele acertou ou errou. Caso\
    \ tenha acertado, precisamos sair imediatamente das repetições, o que conseguimos\
    \ através do comando `break`.\n\n```javascript\n 1 var numeroDaTentativa = 1;\n\
    \ 2 while(numeroDaTentativa <= 3) {\n 3   var chute = prompt(\"Qual você acha\
    \ que é?\");\n 4   if(chute == numeroPensado) {\n 5     alert(\"Parabéns, você\
    \ acertou!\");\n 6     break;\n 7   } else {\n 8     alert(\"Você errou. Será\
    \ que ainda tem mais tentativas?\");\n 9   }\n10   numeroDaTentativa++;\n11 }\n\
    ```\n\nVamos melhorar nosso jogo com alguns desafios.\n\n1. Faça com que seu programa\
    \ mostre quando a tentativa for errada, se o número \"chutado\" é maior ou menor\
    \ ao que o computador pensou. Isso vai valer como uma boa dica para o usuário\
    \ conseguir acertar. Lembre-se que para isso, você terá que usar um outro `if`,\
    \ dentro do `else` que fala que o usuário errou.\n2. Faça com que o jogo só termine\
    \ quando ele acertar. Para isso, a condição da repetição do `while` terá que mudar,\
    \ para que ele faça a repetição infinita. Após essa mudança, teste seu jogo e\
    \ veja em quantas tentativas você consegue descobrir o número.\n3. O jogo está\
    \ fácil demais? Aumente a possibilidade de números que o computador pode pensar.\
    \ `1000` pode ser um bom número para começar. Desafie seus amigos e familiares.\
    \ Veja quem consegue ficar com o recorde.\n4. Há uma forma de escrever esse nosso\
    \ jogo sem utilizar o `break`, apenas mudando a condição do `while`, adicionando\
    \ mais uma cláusula através do operador que significa E (o `&&`). Consegue adivinhar\
    \ como?\n\n### 5.12 Exercícios: trabalhando com um loop dentro do outro\n\nLoops\
    \ aparecem muito em nosso código. É até comum que eles apareçam um dentro do outro.\
    \ Imagine que queremos mostrar a seguinte sequência de asteriscos na tela. São\
    \ 3 linhas com 10 asteriscos cada:\n\n![Parece fácil fazer esse monte de asteriscos.](Images/asteriscos.png)\
    \ \n*Figura 5.1: Parece fácil fazer esse monte de asteriscos.*\n\nVocê pode pensar\
    \ em uma solução bem, bem fácil, mas nada desafiadora. Algo como esta:\n\n```javascript\n\
    1 mostra(\"**********\");\n2 mostra(\"**********\");\n3 mostra(\"**********\"\
    );\n```\n\nDá para ser mais interessante. Em vez fazer um copiar e colar, podemos\
    \ usar um `for`, como já visto:\n\n```javascript\n1 for(var linha = 0; linha <\
    \ 3; linha = linha + 1) {\n2   mostra(\"**********\");\n3 }\n```\n\nMelhorou!\
    \ Mas queremos ir além. Se precisássemos mudar e imprimir em cada linha 250 asteriscos,\
    \ teríamos de escrever um monte deles dentro dessa chamada ao `mostra`.\n\nA ideia\
    \ é então utilizar dois loops. O primeiro fala algo como \"para cada linha, faça\"\
    . O segundo fala \"para cada coluna, imprima um\". No final de cada linha, imprimimos\
    \ um `<br>`.\n\nO código é curto, mas a primeira vez pode assustar. Crie o `asteriscos.html`\
    \ e digite as seguintes linhas, dentro das tags de script, como sempre:\n\n```javascript\n\
    1 for(var linha = 0; linha < 3; linha = linha + 1) {\n2   for(var coluna = 0;\
    \ coluna < 10; coluna = coluna + 1) {\n3     document.write(\"*\");\n4   }\n5\
    \   document.write(\"<br>\");\n6 }\n```\n"
  raw: "```\n 1 <script>\n 2 var numeroPensado = Math.round(Math.random() * 100);\n\
    \ 3 \n 4 var numeroDaTentativa = 1;\n 5 while(numeroDaTentativa <= 3) {\n 6  \
    \ var chute = prompt(\"Qual você acha que é?\");\n 7   \n 8   if(chute == numeroPensado)\
    \ {\n 9     alert(\"Parabéns, você acertou!\");\n10   } else {\n11     alert(\"\
    Você errou. Será que ainda tem mais tentativas?\");\n12   }\n13   numeroDaTentativa++;\n\
    14 }\n15 </script>\n```\n\nAbra o arquivo `jogo_adivinha_com_tentativas.html`\
    \ em seu navegador e tente acertar. Se estiver difícil, uma dica é diminuir a\
    \ possibilidade de números que o computador vai pensar, de 100 para 10, por exemplo.\
    \ Para isso, basta mudar a seguinte linha:\n\n```\n1 var numeroPensado = Math.round(Math.random()\
    \ * 10);\n```\n\nApós algumas brincadeiras, você notará que há algo errado nesse\
    \ jogo. Acerte um número na primeira ou na segunda tentativa para ver o que acontece.\
    \ O jogo mostra a mensagem de parabéns, indicando que você acertou, mas vai te\
    \ perguntar de novo qual é o número que ele pensou. Precisamos corrigir isso,\
    \ mas como? Onde está o problema no nosso código?\n\nAnalisando com um pouco de\
    \ cuidado, percebemos que uma vez que o chute foi acertado, não precisamos tentar\
    \ novamente, ou seja, **as repetições devem acabar imediatamente**. Mas como fazemos\
    \ para interromper as repetições e sair imediatamente do `while`?\n\nO Javascript\
    \ (assim como outras linguagens de programação) possuem um comando chamado `break`\
    \ (quebrar), que significa que quando ele for chamado, a repetição deverá ser\
    \ quebrada, ou seja, interrompida. É exatamente isso que precisamos. Quando o\
    \ chute for acertado, precisamos interromper as repetições, já que não faz sentido\
    \ perguntar novamente para o usuário.\n\n```\n1 if(chute == numeroPensado) {\n\
    2   alert(\"Parabéns, você acertou!\");\n3   break;\n4 } else {\n5   alert(\"\
    Você errou. Será que ainda tem mais tentativas?\");\n6 }\n```\n\nCom essa alteração,\
    \ tente acertar um chute na primeira ou segunda tentativa. O programa não vai\
    \ mais ficar te pedindo outro chute. Bem melhor, não?\n\n### 5.11 Revisando nosso\
    \ código: O jogo da adivinhação dos números\n\nComeçamos o nosso jogo, no arquivo\
    \ `jogo_adivinha_com_tentativas.html`, fazendo com que o computador pensasse em\
    \ um número aleatório entre 0 e 100.\n\n```\n1 var numeroPensado = Math.round(Math.random()\
    \ * 100);\n```\n\nO próximo passo foi perguntarmos no máximo 3 vezes para o usuário\
    \ qual o número que ele acha que o computador pensou.\n\n```\n1 var numeroDaTentativa\
    \ = 1;\n2 while(numeroDaTentativa <= 3) {\n3   var chute = prompt(\"Qual você\
    \ acha que é?\");\n4   \n5   numeroDaTentativa++;\n6 }\n```\n\nA cada tentativa,\
    \ precisamos verificar se ele acertou ou errou. Caso tenha acertado, precisamos\
    \ sair imediatamente das repetições, o que conseguimos através do comando `break`.\n\
    \n```\n 1 var numeroDaTentativa = 1;\n 2 while(numeroDaTentativa <= 3) {\n 3 \
    \  var chute = prompt(\"Qual você acha que é?\");\n 4   if(chute == numeroPensado)\
    \ {\n 5     alert(\"Parabéns, você acertou!\");\n 6     break;\n 7   } else {\n\
    \ 8     alert(\"Você errou. Será que ainda tem mais tentativas?\");\n 9   }\n\
    10   numeroDaTentativa++;\n11 }\n```\n\nVamos melhorar nosso jogo com alguns desafios.\n\
    \n1.  Faça com que seu programa mostre quando a tentativa for errada, se o número\
    \ \"chutado\" é maior ou menor ao que o computador pensou. Isso vai valer como\
    \ uma boa dica para o usuário conseguir acertar. Lembre-se que para isso, você\
    \ terá que usar um outro `if`, dentro do `else` que fala que o usuário errou.\n\
    \n2.  Faça com que o jogo só termine quando ele acertar. Para isso, a condição\
    \ da repetição do `while` terá que mudar, para que ele faça a repetição infinita.\n\
    \n    Após essa mudança, teste seu jogo e veja em quantas tentativas você consegue\
    \ descobrir o número.\n\n3.  O jogo está fácil demais? Aumente a possibilidade\
    \ de números que o computador pode pensar. `1000` pode ser um bom número para\
    \ começar. Desafie seus amigos e familiares. Veja quem consegue ficar com o recorde.\n\
    \n4.  Há uma forma de escrever esse nosso jogo sem utilizar o `break`, apenas\
    \ mudando a condição do `while`, adicionando mais uma cláusula através do operador\
    \ que significa **E** (o `&&`). Consegue adivinhar como?\n\n### 5.12 Exercícios:\
    \ trabalhando com um loop dentro do outro\n\nLoops aparecem muito em nosso código.\
    \ É até comum que eles apareçam um dentro do outro. Imagine que queremos mostrar\
    \ a seguinte sequência de asteriscos na tela. São 3 linhas com 10 asteriscos cada:\n\
    \n![Parece fácil fazer esse monte de asteriscos.](Images/asteriscos.png)*Figura\
    \ 5.1: Parece fácil fazer esse monte de asteriscos.*\n\nVocê pode pensar em uma\
    \ solução bem, bem fácil, mas nada desafiadora. Algo como esta:\n\n```\n1 mostra(\"\
    **********\");\n2 mostra(\"**********\");\n3 mostra(\"**********\");\n```\n\n\
    Dá para ser mais interessante. Em vez fazer um copiar e colar, podemos usar um\
    \ `for`, como já visto:\n\n```\n1 for(var linha = 0; linha < 3; linha = linha\
    \ + 1) {\n2   mostra(\"**********\");\n3 }\n```\n\nMelhorou! Mas queremos ir além.\
    \ Se precisássemos mudar e imprimir em cada linha 250 asteriscos, teríamos de\
    \ escrever um monte deles dentro dessa chamada ao `mostra`.\n\nA ideia é então\
    \ utilizar dois loops. O primeiro fala algo como \"*para cada linha, faça*\".\
    \ O segundo fala \"*para cada coluna, imprima um **\". No final de cada linha,\
    \ imprimimos um `<br>`.\n\nO código é curto, mas a primeira vez pode assustar.\
    \ Crie o `asteriscos.html` e digite as seguintes linhas, dentro das tags de script,\
    \ como sempre:\n\n```\n1 for(var linha = 0; linha < 3; linha = linha + 1) {\n\
    2   for(var coluna = 0; coluna < 10; coluna = coluna + 1) {\n3     document.write(\"\
    *\");\n4   }\n5   document.write(\"<br>\");\n6 }\n```\n\nRepare que declaramos\
    \ duas variáveis. A variável `linha` para o primeiro loop e a variável `coluna`\
    \ para o segundo loop. Cada vez que nosso loop das colunas termina, ele pula linha\
    \ e começa a execução da próxima iteração do loop que cuida das colunas! Exatamente\
    \ como queríamos. Dizemos aqui que temos um loop encadeado em outro. Num termo\
    \ mais técnico, dizemos que temos loops **aninhados**!\n\nVamos ver outros desafios\
    \ interessantes.\n\n1.  Desenhe um quadrado de 10 linhas por 10 colunas.\n\n2.\
    \  Agora, utilizando o `prompt`, pergunte ao usuário de que tamanho ele quer o\
    \ quadrado. Considerando que essa variável chama-se `tamanho`, crie um quadrado\
    \ de `tamanho` por `tamanho`.\n\n3.  Esse aqui é um desafio. Faça um código para\
    \ obter esse resultado:\n\n    ![Brincando com loops para desenhar](Images/triangulo-asteriscos.png)\n\
    \n    *Figura 5.1: Brincando com loops para desenhar*\n\n    O segredo é pensar\
    \ assim: na primeira linha queremos apenas uma coluna; na segunda linha queremos\
    \ duas colunas etc... até a décima linha, que possuirá dez colunas.\n\n    Você\
    \ também precisará de dois loops aninhados. Há duas formas de fazer: uma usando\
    \ o `break` para parar de imprimir os asteriscos em cada linha em uma determinada\
    \ condição, ou colocando essa condição direto dentro do `for`.\n\n4.  Quer mais?\
    \ Tente fazer o *V de Vingança*, usando asteriscos e underscores (`_`).\n\n  \
    \  ![Você consegue fazer o V de Vingança?](Images/vinganca.png)\n\n    *Figura\
    \ 5.1: Você consegue fazer o V de Vingança?*\n\n    Analise o padrão. na primeira\
    \ linha, o asterisco aparece só na primeira e na última coluna. Na segunda linha,\
    \ ele aparece na segunda e na penúltima coluna.\n\nNo capítulo [7](#index_split_008.html_graficos)\
    \ vamos também desenhar na tela, mas de uma maneira bem mais interessante. Prepare-se!\n\
    \n## Capítulo 6: Arrays: trabalhe com muitos dados\n\n### 6.1 Integre o JavaScript\
    \ com HTML\n\nÉ comum o JavaScript trabalhar com itens e campos que aparecem no\
    \ HTML. Crie um novo arquivo, que será uma nova versão do nosso exercício de adivinhação.\
    \ Ele vai se chamar `adivinha_mais.html`. Como vamos aprender novos conceitos,\
    \ o jogo vai ser construído aos poucos.\n\nEm primeiro lugar, vamos usar um novo\
    \ item HTML, chamado `input`. Vamos criar dois deles, um que será um campo texto\
    \ (`text`) e outro que será um botão (`submit`):\n\n```\n1 <input type=\"text\"\
    \ />\n2 <input type=\"submit\" value=\"Compare com o meu segredo!\" />\n```"
