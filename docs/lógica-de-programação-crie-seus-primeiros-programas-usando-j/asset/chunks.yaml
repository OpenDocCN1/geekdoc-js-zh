    \ x = \" + x + \", o y vale \" + y);\n 9 \n10     c.beginPath();\n11     c.arc(x,\
    \ 400 - y, 2, 0, 2*Math.PI);\n12     c.fill();\n13   }\n14 }\n```\n\nO código\
    \ está ainda mais organizado, mas continuamos com o problema: como desenhar a\
    \ função `f(x) = seno(x)` sem ter de copiar e colar muito código que já escrevemos?\
    \ Queremos poder escolher qual função desenhar!\n\nEm outras palavras, em vez\
    \ de chamar `desenhaParabola()`, gostaríamos que nossa última linha de código\
    \ fosse a seguinte:\n\n```\n1 desenhaFuncao(funcaoQuadratica);\n```\n\nPrecisamos\
    \ deixar o código mais genérico para chegar a esse ponto. O truque aqui vai ser\
    \ bem sutil: em vez de deixar a chamada para `funcaoQuadratica` explícita na função\
    \ `desenhaParabola`, vamos fazer com que a `desenhaParabola` **receba uma função\
    \ como argumento**. Para deixar os nomes com sentido, em vez de `desenhaParabola`,\
    \ ela se chamará `desenhaFuncao` e receberá um argumento chamado `funcaoMatematica`:\n\
    \n```\n 1 var desenhaFuncao = function(funcaoMatematica) {\n 2   for(var x = 0;\
    \ x < 600; x = x + 1) {\n 3     var y = // O QUE FAZER AQUI?\n 4     console.log(\"\
    Para x = \" + x + \", o y vale \" + y);\n 5 \n 6     c.beginPath();\n 7     c.arc(x,\
    \ 400 - y, 2, 0, 2*Math.PI);\n 8     c.fill();\n 9   }\n10 }\n```\n\nMas ainda\
    \ falta a linha para calcular o `y`. Se não queremos uma chamada explícita, como\
    \ fazer? Não falta muito, pois já recebemos a `funcaoMatematica` como argumento,\
    \ basta chamá-la com `var y = funcaoMatematica(x)`.\n\nE para chamar a `desenhaFuncao,`\
    \ basta fazer a chamada conforme havíamos planejado, `desenhaFuncao(funcaoQuadratica)`.\
    \ O grande diferencial aqui é que a função `desenhaFuncao` recebe uma outra como\
    \ parâmetro! E quando ela faz `var y = funcaoMatematica(x)` ela não sabe exatamente\
    \ quem está chamando! Nós sabemos que ela está chamando a parábola pois fizemos\
    \ a chamada logo depois, mas o código não depende disso, tornando-se muito flexível.\n\
    \nEsse código pode ser visto aqui: [http://jsfiddle.net/paulosilveira/kyuMe/](http://jsfiddle.net/paulosilveira/kyuMe/)\n\
    \nRepare que não é a primeira vez que trabalhamos com funções como sendo uma variável\
    \ qualquer. No capítulo passado, fizemos `botaoAdivinhar.onclick = botaoClicado`\
    \ quando configuramos o nosso *callback*. Mas essa é a primeira vez que **recebemos**\
    \ uma função como argumento. Isso aparece com frequência em códigos JavaScript.\n\
    \nE para desenhar o seno? É bem simples, basta você criar essa função:\n\n```\n\
    1 var funcaoSeno = function(x) {\n2   return  Math.sin(x);\n3 }\n```\n\nE depois\
    \ chamar:\n\n```\n1 desenhaFuncao(funcaoSeno);\n```\n\nSimples, não?\n\nO resultado\
    \ pode não ser satisfatório. A função seno devolve um número entre `-1` e `1`,\
    \ o que não tem muita graça no gráfico. Experimente uma função mais elaborada,\
    \ como `Math.sin(x/20) * 100 + 200;`, o da figura abaixo.\n\n![A função seno](Images/seno.png)*Figura\
    \ 7.15: A função seno*\n\nFaça novos testes com outras funções! Procure raízes,\
    \ logaritmos etc. Quem sabe até desenhar um fractal?\n\n## Capítulo 8: Apêndice\
    \ - Animações e pequenos jogos\n\nJá temos condições de fazer muita coisa com\
    \ o que aprendemos. Vamos nesse capítulo aprender mais de eventos e da API do\
    \ canvas para criar até mesmo um simples joguinho. Aproveite para testar sua imaginação!\n\
    \n### 8.1 Crie uma lousa capturando o movimento do mouse\n\nÉ muito fácil saber\
    \ o que o usuário está fazendo no nosso programa, para depois tomar decisões.\
    \ Por exemplo: onde o usuário está clicando na tela? Vamos criar um novo arquivo,\
    \ o `mouse.html` e desenhar um cavas cinza, que será a nossa tela de teste.\n\n\
    O começo do `mouse.html` é muito semelhante ao que já conhecemos:\n\n```\n1 <canvas\
    \ id=\"tela\" width=\"600\" height=\"400\"></canvas>\n2 <script>\n3 var tela =\
    \ document.getElementById(\"tela\");\n4 var c = tela.getContext(\"2d\");\n5 \n\
    6 c.fillStyle=\"gray\";\n7 c.fillRect(0, 0, 600, 400);\n8 </script>\n```\n\nAbra\
    \ o `mouse.html` no seu navegador. Apenas um retângulo cinza aparece, conforme\
    \ imaginado.\n\nQueremos saber se o usuário clicou dentro da nossa tela, do nosso\
    \ canvas. Podemos fazer isso definindo uma função para ser chamada toda vez que\
    \ um clique for feito. Basta atribuirmos uma função para `tela.onclick`. Adicione\
    \ as seguintes linhas antes do `</script>`:\n\n```\n1 tela.onclick = function()\
    \ {\n2   alert(\"alguém clicou no canvas!\");\n3 };\n```\n\nPronto! Rode seu programa\
    \ novamente e clique na área do canvas cinza e veja o resultado.\n\nO que fizemos\
    \ aqui foi definir uma função que será chamada quando um determinado evento ocorrer.\
    \ Já vimos isso antes, quando pegamos o clique do mouse em um botão do nosso HTML!\
    \ Esse tipo de função é o que chamamos de *callback*. No nosso caso, definimos\
    \ que, quando alguém clicar na tela (`tela.onclick`), vamos chamar uma função\
    \ que por sua vez chama o `alert`.\n\nPodemos descobrir a coordenada em que o\
    \ usuário clicou. Muitas vezes, quando uma função de *callback* é chamada, são\
    \ passados argumentos descrevendo o evento que acabou de acontecer. Neste caso\
    \ é passado um evento chamado `MouseEvent`, com o qual podemos descobrir a posição\
    \ `x,y` do clique através de variáveis de dentro desse evento. Altere seu código\
    \ da seguinte forma:\n\n```\n1 tela.onclick = function(evento) {\n2   var x =\
    \ evento.pageX;\n3   var y = evento.pageY;\n4   alert(\"posição do clique : \"\
    \ + x + \", \" + y);\n5 };\n```\n\nRepare que agora estamos recebendo como parâmetro\
    \ uma variável a que demos o nome de `evento`. É comum dar o nome a ela de `mouseEvent`\
    \ ou até mesmo um simples `e`. Abra o seu HTML e clique em algum lugar da tela,\
    \ qual é o resultado?\n\nIsso mesmo! Ele te dá a posição do seu clique. Mesmo\
    \ assim, perceba que há algo estranho. Tente, por exemplo, clicar no canto superior\
    \ esquerdo da sua imagem. Observe o resultado abaixo:\n\n![Topo esquerdo do canvas\
    \ não deveria ser 0,0?](Images/clique-canvas.png)*Figura 8.1: Topo esquerdo do\
    \ canvas não deveria ser 0,0?*\n\nNo nosso caso, mesmo clicando bem no canto superior\
    \ esquerdo do nosso canvas cinza, obtivemos `11, 11`. Algumas vezes, com mais\
    \ precisão, obtivemos `10,10`. Por que o resultado não foi `0,0`? Isso ocorre\
    \ pois, como as próprias variáveis `evento.pageX. evento.pageY` nos dizem, essa\
    \ é a posição do clique em relação à página! Se quisermos as coordenadas relativas\
    \ ao canvas, basta subtrairmos a posição em que o canvas (nossa `tela`) foi desenhado\
    \ na página:\n\n```\n1 tela.onclick = function(evento) {\n2   var x = evento.pageX\
    \ - tela.offsetLeft;\n3   var y = evento.pageY - tela.offsetTop;\n4   alert(\"\
    posição do clique : \" + x + \", \" + y);\n5 };\n```\n\nLer apenas essa informação\
    \ não é tão interessante. Que tal desenhar um círculo azul em cada ponto que o\
    \ usuário clicar? Basta, dentro dessa função, utilizarmos aquela função `drawArc`,\
    \ que já conhecemos:\n\n```\n 1 tela.onclick = function(evento) {\n 2   var x\
    \ = evento.pageX - tela.offsetLeft;\n 3   var y = evento.pageY - tela.offsetTop;\n\
    \ 4 \n 5   c.fillStyle=\"blue\";\n 6   c.beginPath();\n 7   c.arc(x, y, 10, 0,\
    \ 2*3.14);\n 8   c.fill();\n 9 \n10   console.log(\"posição do clique : \" + x\
    \ + \", \" + y);\n11 };\n```\n\nRecarregue seu arquivo no navegador. Clique em\
    \ alguns pontos na tela e veja o resultado que obtemos!\n\nVeja que, além de desenhar\
    \ o círculo onde você clica, estamos colocando a informação das coordenadas no\
    \ console do navegador. Vimos esse recurso no começo, na seção [2.11](#index_split_003.html_secao-console).\
    \ É muito mais prático utilizá-lo do que imprimir valores com `document.write`\
    \ ou o inoportuno `alert`. Para ver as posições onde estamos clicando, basta abrir\
    \ o *Console JavaScript* do Chrome. Relembrando: clique no ícone de menus/ferramentas,\
    \ depois acesse o menu *Ferramentas* (*Tools*) e por último *Console JavaScript*.\n\
    \nApós alguns cliques, você obterá um resultado como o seguinte:\n\n![Console\
    \ aberto depois de alguns cliques](Images/clique-canvas-log.png)*Figura 8.2: Console\
    \ aberto depois de alguns cliques*"
