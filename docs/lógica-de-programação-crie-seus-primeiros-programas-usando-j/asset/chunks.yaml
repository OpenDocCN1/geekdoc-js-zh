    # Se imprimir todos os números


    Basta fazer um `for` que vá de 0 a 5:


    ```

    1 for(var i = 0; i < 6; i = i + 1) {

    2   console.log(segredos[i]);

    3 }

    ```


    O `segredos[i]` acessa a array `segredos` na `i-ésima` posição! Esse número que
    vai dentro de `[]` chamamos também de índice!


    As `arrays` possuem algumas facilidades. Por exemplo, podemos saber qual é o seu
    tamanho:


    ```

    1 console.log(segredos.length);

    ```


    Por esse motivo, é possível escrever aquele `for` sem fixar o número 6, substituindo-o
    por `segredos.length`:


    ```

    1 for(var i = 0; i < segredos.length; i = i + 1) {

    2   console.log(segredos[i]);

    3 }

    ```


    ## Criando a Loteria


    Agora está fácil! Crie o seu arquivo `loteria.html` e vamos declarar o campo de
    texto e o botão:


    ```

    1 <input type="text" id="numero" />

    2 <input type="submit" id="adivinhar" value="Compare com o meu segredo!" />

    ```


    Agora declaramos, no JavaScript, nossos segredos:


    ```

    1 var segredos = [16, 34, 37, 42, 50, 58];

    ```


    E, como já vimos, pegamos a caixa em que o usuário digita seu chute:


    ```

    1 var caixaDoNumero = document.getElementById("numero");

    ```


    Vamos preparar a função que será chamada (callback) quando o evento de clicar
    no botão ocorrer. O que faremos dentro dela? Fazemos um `for`, percorrendo todos
    os números, para ver se ele é o `caixaDoNumero.value`. Se for, imprimimos que
    ele ganhou. Repare:


    ```

    1 var botaoClicado = function() {

    2   for(var i = 0; i < segredos.length; i = i + 1) {

    3     if(segredos[i] == caixaDoNumero.value) {

    4       alert("Parabéns! Você acertou um dos números secretos");

    5     }

    6   }

    7 };

    ```


    O código ainda não está tão bom. O que acontece no caso de ele errar? Nenhuma
    mensagem está sendo apresentada. Podemos tentar resolver esse problema adicionando
    um novo `alert`, no fim do `for`:


    ```

    1 var botaoClicado = function() {

    2   for(var i = 0; i < segredos.length; i = i + 1) {

    3     if(segredos[i] == caixaDoNumero.value) {

    4       alert("Parabéns! Você acertou um dos números secretos");

    5     }

    6   }

    7   alert("Infelizmente você errou!");

    8 };

    ```


    Pronto, isso funciona no caso de você errar os segredos. Apenas "Infelizmente
    você errou!" será mostrado.


    Mas imagine que o usuário tenha acertado o número, no fim do `for` o seu programa
    ainda vai mostrar o `alert` de que ele errou! Queremos que essa função não mostre
    o segundo `alert` no caso de o número estar certo.


    Podemos resolver isso com o uso do `return`. O `return` pode ser usado em uma
    função que não retorna valor algum, para que a execução da função pare naquele
    momento e retorne para quem a chamou:


    ```

    1 var botaoClicado = function() {

    2   for(var i = 0; i < segredos.length; i = i + 1) {

    3     if(segredos[i] == caixaDoNumero.value) {

    4       alert("Parabéns! Você acertou um dos números secretos");

    5       return;

    6     }

    7   }

    8   alert("Infelizmente você errou!");

    9 };

    ```


    Repare que há outras formas de resolver esse problema sem o uso do `return`. Você
    poderia ter criado uma `var achou` e, dentro do `if` que verifica se ele acertou,
    fazer `achou = true`, além de mostrar a mensagem de acerto. Fora do `for`, antes
    de mostrar a mensagem de erro, você deveria verificar se `achou != true`.


    Qual é o próximo passo? Agora basta registrarmos que essa função vai realmente
    ser o callback do evento de clicar no botão, como também já aprendemos:


    ```

    1 var botaoAdivinhar = document.getElementById("adivinhar");

    2 botaoAdivinhar.onclick = botaoClicado;

    3 </script>

    ```


    Abra a sua loteria e tente acertar um dos números.


    1. Remova o `break` do seu código e veja o que acontece. Por que é necessário
    ter o `break` aí?

    2. Caso o usuário acerte o número, diga qual é a posição do número que ele acertou.
    Por exemplo: "Parabéns, você acertou o 5o número!". Isto é, o índice da array,
    só tome cuidado com o zero.


    ## 6.4 Evite os número repetidos no Bingo


    Já vimos como é o trabalho básico em uma array, mas como modificar seus valores?
    Repare na array de `segredos`:


    ```

    1 var segredos = [16, 34, 37, 42, 50, 58];

    2 console.log(segredos[0]);

    ```


    Assim como podemos pegar o primeiro elemento através de `segredos[0]`, podemos
    modificá-lo:


    ```

    1 segredos[0] = 20;

    2 console.log(segredos[0]);

    ```


    As arrays possuem algumas facilidades. Por exemplo, podemos saber qual é o seu
    tamanho:


    ```

    1 console.log(segredos.length);

    ```


    Por esse motivo, é possível escrever aquele `for` sem fixar o número 6, substituindo-o
    por `segredos.length`:


    ```

    1 for(var i = 0; i < segredos.length; i = i + 1) {

    2   console.log(segredos[i]);

    3 }

    ```

