    ## 2.7 Pare de escrever BR tantas vezes!


    Vimos que utilizar variáveis já ajudou de duas formas: não precisamos mais copiar
    e colar tanta informação e também alguns trechos ficaram mais legíveis. As variáveis
    podem ir além, economando na repetição de linhas de código.


    Atenção! Nesta seção, não precisa alterar seu código, apenas acompanhe o que poderia
    ser feito. Você fará tudo que há de novo aqui durante a revisão, que virá logo
    a seguir.


    Repare como ficou aquele nosso código que mostra as idades de cada pessoa:


    ```

    1 var ano = 2012;

    2 document.write("Eu nasci em : " + (ano - 25) + "<br>");

    3 document.write("Adriano nasceu em : " + (ano - 26) + "<br>");

    4 document.write("Paulo nasceu em : " + (ano - 32) + "<br>");

    ```


    Poderíamos organizá-lo um pouco mais, removendo o `<br>` para outra chamada do
    `document.write`.


    ```

    1 var ano = 2012;

    2 document.write("Eu nasci em : " + (ano - 25));

    3 document.write("<br>");

    4 document.write("Adriano nasceu em : " + (ano - 26));

    5 document.write("Paulo nasceu em : " + (ano - 32));

    ```

    [/content]


    *(注：由于原始文本为葡萄牙语，且指令要求翻译成中文，以下为针对该文本的中文翻译。)*


    [content]

    ```

    1 var total = eu + adriano + paulo;

    2 var media = total / 3;

    ```


    最后，我们打印平均值并关闭 `script` 标签：


    ```

    1 document.write("A média de idade é " + media);

    2 </script>

    ```


    你的代码运行正常吗？注意变量名。你必须按照声明时的方式使用它们。JavaScript 甚至区分大小写。尝试故意写错一个变量名，看看 JavaScript 控制台中会出现什么错误信息。例如，显示
    `med` 而不是之前已声明的 `media`：


    ```

    1 document.write("A média de idade é " + med);

    ```


    写错变量名是很常见的现象。请保持留心，并习惯使用我们在上一节末尾看到的 JavaScript 控制台。错误信息将是英文的，有时并不像我们希望那样具体，但始终会准确地指出问题发生在代码的哪一行。


    你厌了看到带有这么多小数的数字？你可以使用 `Math.round(numero)` 对其进行四舍五入。修改你的代码：


    ```

    1 document.write("A média de idade é " + Math.round(media));

    ```


    `Math.round` 获取括号内的值并进行四舍五入，使用这个新值与我们想要显示的句子其余部分拼接（连接）。


    现在，我们来做一个全新的练习：


    1. 创建一个新文件 `calcula_consumo.html`，在第一行添加一个醒目的标题：`<h3>酒精还是汽油？</h3>`。紧接着下方插入已知的
    `<script>` 和 `</script>` 标签。文件已准备好添加我们的程序代码。保存它并在浏览器中打开它。


    2. 你的汽车有一个 40 升的 `tanque`（油箱）。使用汽油并用完整个油箱，你行驶了 `480` 公里的 `caminhoComGasolina`。汽油消耗
    `consumoDeGasolina` 是多少？计算方法是将行驶距离除以消耗的升数。打印该值，并将计算整理在变量中。


    使用像 `consumoDeGasolina` 这样的变量很常见。字母 `D` 和 `G` 有助于阅读。将 `consumoDeGasolina` 与 `consumodegasolina`
    进行比较。请注意：如果你在创建变量后写错了大小写，代码将无法按预期运行。


    3. 使用酒精时，同样的 40 升油箱行驶了 `300` 公里的 `caminhoComAlcool`。酒精消耗 `consumoDeAlcool` 是多少？


    4. 这些数字都是破碎的，充满了数位。使用 `Math.round` 对它们进行四舍五入。效果好吗？


    5. 四舍五入一个小的数字，如 `0.314178473` 会得到 `0`！这虽然合理，但不是我们想要的。我们希望将 `0.314178473` 保留两位小数，例如。为了这一点，你必须使用
    `numero.toFixed(2)`，其中 `2` 是表示我们想要多少小数位的参数。


    注意，我们调用函数的方式非常不同。之前我们使用 `Math.round(numero)`，现在我们使用 `numero.toFixed(2)`。除了函数名不同外，这次变量
    `numero` 出现在调用的“前面”。这在 JavaScript 中非常常见，而且确实有区别，我们将在后面的章节中理解。


    6. 现在是一个挑战。今天汽油价 `precoDaGasolina` 为 R$2.90，酒精价 `precoDoAlcool` 为 R$2.40。酒精和汽油的每公里价格
    `precoPorKilometro` 分别？提示：将单价除以消耗即可得到每公里价格。哪一个更小？


    ## 2.7 别再写这么多 BR 了！


    我们看到使用变量已经从两个方面提供了帮助：我们不再需要复制粘贴那么多信息，而且某些片段变得更具可读性。变量可以进一步发挥，减少代码行的重复。


    注意！在本节中，你不需要修改代码，只需跟踪了解可以这样做。你将在接随后的复习中完成这里所有的新内容。


    看看我们之前那个显示每个人年龄的代码：


    ```

    1 var ano = 2012;

    2 document.write("Eu nasci em : " + (ano - 25) + "<br>");

    3 document.write("Adriano nasceu em : " + (ano - 26) + "<br>");

    4 document.write("Paulo nasceu em : " + (ano - 32) + "<br>");

    ```


    我们可以稍微组织一下，将 `<br>` 移到另一个 `document.write` 调用中。


    ```

    1 var ano = 2012;

    2 document.write("Eu nasci em : " + (ano - 25));

    3 document.write("<br>");

    4 document.write("Adriano nasceu em : " + (ano - 26));

    5 document.write("Paulo nasceu em : " + (ano - 32));

    ```

