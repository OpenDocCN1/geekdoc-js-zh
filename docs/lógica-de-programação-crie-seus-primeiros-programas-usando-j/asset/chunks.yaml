    ```\n1 <script src=\"codigo.js\"></script>\n```\n\nPara isso funcionar, teríamos\
    \ todo nosso código JavaScript dentro do arquivo `codigo.js`, que deve ficar,\
    \ nesse caso, no mesmo diretório que nosso HTML.\n\nHá também algumas boas práticas\
    \ sobre o carregamento do JavaScript, que não deve atrapalhar o carregamento do\
    \ HTML, que poderia atrasar a visualização da páginas, mas esse é um outro assunto.\n\
    \n#### Bibliotecas\n\nAdivinhe: há muito código já pronto que outras pessoas disponibilizaram\
