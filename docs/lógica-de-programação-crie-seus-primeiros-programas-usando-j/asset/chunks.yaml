    \ e faz o cálculo.\n\n3. Agora que temos as duas funções, podemos fazer assim:\n\
    \n```\n1 var idade = 34;\n2 var dias = calculaDiasDeVida(idade);\n3 var batimentos\
    \ = calculaBatimentos(dias);\n4 document.write(\"Seu coração já bateu \" + batimentos\
    \ \n5     + \" vezes. Haja coração!\");\n```\n\nUm pequeno desafio: como fazer,\
    \ na mesma linha, uma chamada para `calculaDiasDeVida`, pegar esse resultado e\
    \ passar para a chamada de `calculaBatimentos`?\n\n### 3.7 Você já entendeu a\
    \ ordem das chamadas das funções?\n\nÀs vezes pode ser complicado enxergar qual\
    \ trecho do código está chamando que outro trecho.\n\nPara facilitar, vamos escrever\
    \ um simples código com três funções: a primeira função chama a segunda função,\
    \ e a segunda chama a terceira. Além disso, dentro de cada função imprimimos uma\
    \ mensagem antes e depois de chamar a próxima. Dessa forma será possível que você\
    \ veja como as chamadas são \"empilhadas\" e, quando a terceira função é chamada,\
