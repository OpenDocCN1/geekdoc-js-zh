- fmt: "\n![Criando um link para outra página](Images/minha_pagina3.png)\n*Figura\
    \ 1.7: Criando um link para outra página*\n\nA forma de escrever HTML, com aqueles\
    \ sinais de `<` e `>`, também conhecido como a sintaxe do HTML, pode assustar\
    \ a primeira vez. Assim como o uso do `<h3> </h3>`, a tag `<a ...> </a>` envolve\
    \ um pedaço do nosso texto. Mais ainda, ela possui um atributo, nesse caso o tal\
    \ do `href`, indicando para onde o navegador deve ir se alguém clicar neste link.\
    \ É comum que tags html possuam diversas propriedades diferentes, modificando\
    \ a visualização e o comportamento de determinados trechos do documento. Uma tag\
    \ mais o seu conteúdo forma um **elemento HTML**, por exemplo o `<strong>Não</strong>`.\n\
    \nHá muitas tags. Não se preocupe em decorá-las. Você perceberá que com o passar\
    \ do tempo e a prática, decidir qual tag deverá ser utilizada se tornará um processo\
    \ natural.\n\nVocê já reparou que o navegador não pulou de linha onde sugerimos?\
    \ Uma das tags que pode ajudar nisso é a `<br>`. Experimente. Diferente das outras\
    \ tags que vimos até aqui, ela deve ser utilizada sem o estilo de abrir e fechar,\
    \ aparecendo apenas uma única vez para cada uso. Vamos utilizá-la com frequência\
    \ mais adiante.\n\nEstá curioso com a sigla HTML? Ela significa Hypertext Markup\
    \ Language (linguagem de marcação para hiper texto). Ou, em uma tradução bem aberta,\
    \ uma linguagem que possui tags para marcar documentos do tipo hipertexto. Documento\
    \ hipertexto é um que pode ter links para outros. O HTML sozinho nada mais é que\
    \ uma forma de marcação (através das tags). Veremos agora como incrementá-la.\n\
    \n### 1.4 Dê olá ao mundo\n\nPara ter essa interação com o usuário, utilizaremos\
    \ o **JavaScript**, uma linguagem que nos permite escrever códigos interessantíssimos.\
    \ Altere seu arquivo `html`, adicionando as seguintes linhas no final dele:\n\n\
    ```\n1 <script>\n2 alert(\"podemos fazer mais com JavaScript!\");\n3 </script>\n\
    ```\n\nSalve o arquivo. Abra-o no seu navegador, dando um duplo clique na página,\
    \ ou recarregando-a. O resultado deve ser que uma caixa de texto aparece com uma\
    \ mensagem. Essa caixa é conhecida também como *popup*. Além dela, o texto que\
    \ já conhecemos será mostrado:\n\n![Começando a interagir mais](Images/minha_pagina-alert.png)\n\
    *Figura 1.8: Começando a interagir mais*\n\nVai ser muito frequente repetir o\
    \ processo de alteração do nosso código. Esse processo é: adicionar novas linhas\
    \ no arquivo `html`, salvá-lo, abri-lo novamente no navegador. Como vimos, em\
    \ vez de dar dois cliques na página, há também o botão de *atualizar* (*Reload*),\
    \ que puxará as novas informações do nosso arquivo, executando tudo de novo.\n\
    \nSim, você já está programando! Parabéns, esse foi seu primeiro código usando\
    \ a linguagem JavaScript. Passos pequenos e muita prática durante a leitura deste\
    \ livro o levará mais longe do que imagina.\n\nAlgo deu errado? No final dessa\
    \ lição aprenderemos a usar algumas ferramentas do navegador para nos auxiliar\
    \ na descoberta dos problemas que podem acontecer. Além disso, todas as lições\
    \ possuem seções de revisão de código, onde você poderá comparar o código que\
    \ você fez com o que era esperado.\n\nRepare que nosso código possui uma série\
    \ de caracteres não usuais, como parênteses e ponto-e-vírgula. Será que não funcionaria\
    \ fazer um simples `alert \"olá mundo\"`? Cada linguagem tem seu conjunto de regras,\
    \ sua **sintaxe**, e que devem ser respeitadas para que o código possa ser executado.\
    \ No caso do JavaScript, há toda uma especificação que os navegadores seguem (ou\
    \ deveriam seguir).\n\nCaso você esteja estudando através de uma versão digital\
    \ do livro, pode ter ficado tentado a copiar e colar o código desse `alert`. Não\
    \ faça isso. Uma parte muito importante do aprendizado é errar a sintaxe de uma\
    \ linguagem, além de praticá-la mesmo quando óbvia. Caso você tenha errado algo,\
    \ o navegador emitirá uma mensagem de erro. Às vezes ela pode ajudar bastante,\
    \ mas dependendo do navegador, pode levá-lo ao desespero.\n\n### 1.5 Revise o\
    \ código: seu primeiro programa\n\nVimos como escrever nosso primeiro código.\
    \ Durante todas as lições, sempre teremos seções de revisão. É através dela que\
