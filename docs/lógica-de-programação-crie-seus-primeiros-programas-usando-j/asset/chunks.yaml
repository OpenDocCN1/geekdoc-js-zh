    \ Faça essa modificação, criando essa nova função e utilizando-a.\n3. E se o usuário\
    \ digitar algo que não é um número? Se ele chutar, por exemplo, `\"banana\"`?\
    \ Não seria bom ele perder uma chance de chute...\n\n   Você pode verificar se\
    \ o usuário digitou algo que não é um número através da função `isNaN(variavel)`.\
    \ Por exemplo, `if(isNaN(chute))` deve mostrar uma mensagem *apenas números são\
    \ válidos*. `NaN` significa *Not a Number*, em português algo como \"não é um\
    \ número\". Teste essa função no console do Chrome, fazendo `isNaN(\"banana\"\
    );` e `isNaN(123);`.\n\n## Capítulo 5: Como repetir tarefas do programa?\n\nJá\
    \ podemos executar uma linha de código de acordo com uma condição. Através do\
    \ `if` e `else` conseguimos definir qual trecho deve ser executado. Mas e se precisarmos\
    \ executá-lo mais de uma vez? Será que o copiar e colar o código pode nos ajudar\
    \ nessa tarefa?\n\n### 5.1 Quando serão as próximas copas do mundo?\n\nDesde 1930\
    \ é disputada a copa do mundo de futebol, que a cada edição possui uma sede diferente.\
    \ A periodicidade do evento é de 4 anos. Será que em 2030 vamos ter copa do mundo?\n\
    \nUma maneira que temos de saber isso é tomar como base um ano em que a edição\
    \ ocorrerá, por exemplo 2014, e somar 4 anos. Logo sabemos que 2018 é um ano no\
    \ qual teremos copa do mundo. Se continuarmos esse processo, o próximo ano de\
    \ copa será 2022, em seguida 2026 e pronto, chegamos ao 2030 e descobrimos que\
    \ sim, haverá copa do mundo. **Poderíamos continuar esse processo infinitamente,\
    \ enquanto não nos cansarmos**.\n\nVamos escrever um programa que mostra os anos\
    \ de copa, desde 1930, de uma forma extremamente simples. Basta termos uma variável\
    \ cujo valor seja 1930 e que sempre tenha seu valor aumentado de 4 em 4.\n\n```javascript\n\
    \ 1 var anoDeCopa = 1930;\n 2 alert(anoDeCopa + \" tem copa!\");\n 3 \n 4 anoDeCopa\
    \ = anoDeCopa + 4;\n 5 alert(anoDeCopa + \" tem copa!\");\n 6 \n 7 anoDeCopa =\
    \ anoDeCopa + 4;\n 8 alert(anoDeCopa + \" tem copa!\");\n 9 \n10 anoDeCopa = anoDeCopa\
    \ + 4;\n11 alert(anoDeCopa + \" tem copa!\");\n```\n\nPoderíamos continuar repetindo\
    \ esse código até a exaustão. Mas repare o trabalho que teríamos. E se quisermos\
    \ mais copas? Quanto código não teremos que escrever? É muito trabalho repetitivo!\
    \ Vamos tentar uma abordagem um pouco diferente.\n\nQueremos imprimir os anos\
    \ da copa, de 4 em 4, para saber todas as copas. Será possível? A ideia é criar\
    \ um programa que some `4` na variável `anoDeCopa`, alerte-nos esse valor, e volte\
    \ a executar o mesmo procedimento.\n\nSeguindo esse raciocínio, podemos criar\
    \ um novo programa, no arquivo `anos_de_copa.html`, que mostra para nós os anos\
    \ em que teve e terá copa do mundo, desde 1930:\n\n```javascript\n1 <script>\n\
    2 var anoDeCopa = 1930;\n3 \n4 while(true) {\n5   alert(anoDeCopa + \" tem copa\"\
    );\n6   anoDeCopa = anoDeCopa + 4;\n7 }\n</script>\n```\n*(Nota: O texto original\
    \ parecia estar incompleto ou confuso no bloco final, mas mantive a lógica de\
    \ estrutura `while(true)` e a variável `anoDeCopa` conforme as instruções de preservação\
    \ de conteúdo).*\n"
  raw: "Em seguida, perguntamos para o usuário um número, seu `chute`, para ele tentar\
    \ adivinhar o que o computador pensou. Com esse número verificamos se o usuário\
    \ estava certo.\n\n```\n1 <script>\n2   var numeroPensado = Math.round(Math.random()\
    \ * 100);\n3 \n4   var chute = prompt(\"Já pensei. Qual você acha que é?\");\n\
    5   if(chute == numeroPensado) {\n6     mostra(\"Uau! Você acertou, pois eu pensei\
    \ no \" + numeroPensado);\n7   }\n8 </script>\n```\n\nLembre-se de ter a função\
    \ `mostra` no seu código.\n\nDepois, mostramos uma mensagem caso o chute tenha\
    \ sido errado. Para isso, utilizamos o `else`:\n\n```\n 1 <script>\n 2   var numeroPensado\
    \ = Math.round(Math.random() * 100);\n 3 \n 4   var chute = prompt(\"Já pensei.\
    \ Qual você acha que é?\");\n 5   if(chute == numeroPensado) {\n 6     mostra(\"\
    Uau! Você acertou, pois eu pensei no \" + numeroPensado);\n 7   } else {\n 8 \
    \    mostra(\"Você errou! Eu tinha pensado no \" + numeroPensado);\n 9   }\n10\
    \ </script>\n```\n\nPronto, agora ao abrir esse programa em seu navegador, você\
    \ será perguntado por um número. E logo em seguida, será mostrado se era o mesmo\
    \ número que o computador pensou ou não.\n\n1.  Faça com que seu jogo mostre,\
    \ quando o usuário errar a tentativa, se o número que ele chutou era maior ou\
    \ menor ao número pensado pelo programa.\n\n2.  Você pode criar uma função `sorteia`,\
    \ que recebe um número `n` e sorteia um número entre 0 a `n`, retornando esse\
    \ valor. Dessa forma, em vez de escrever `var numeroPensado = Math.round(Math.random()\
    \ * 100);`, você escreveria `var numeroPensado = sorteia(100);`. Faça essa modificação,\
    \ criando essa nova função e utilizando-a.\n\n3.  E se o usuário digitar algo\
    \ que não é um número? Se ele chutar, por exemplo, `\"banana\"`? Não seria bom\
    \ ele perder uma chance de chute...\n\n    Você pode verificar se o usuário digitou\
    \ algo que não é um número através da função `isNaN(variavel)`. Por exemplo, `if(isNaN(chute))`\
    \ deve mostrar uma mensagem *apenas números são válidos*. `NaN` significa *Not\
    \ a Number*, em português algo como \"não é um número\". Teste essa função no\
    \ console do Chrome, fazendo `isNaN(\"banana\");` e `isNaN(123);`.\n\n## Capítulo\
    \ 5: Como repetir tarefas do programa?\n\nJá podemos executar uma linha de código\
    \ de acordo com uma condição. Através do `if` e `else` conseguimos definir qual\
    \ trecho deve ser executado. Mas e se precisarmos executá-lo mais de uma vez?\
    \ Será que o copiar e colar o código pode nos ajudar nessa tarefa?\n\n### 5.1\
    \ Quando serão as próximas copas do mundo?\n\nDesde 1930 é disputada a copa do\
    \ mundo de futebol, que a cada edição possui uma sede diferente. A periodicidade\
    \ do evento é de 4 anos. Será que em 2030 vamos ter copa do mundo?\n\nUma maneira\
    \ que temos de saber isso é tomar como base um ano em que a edição ocorrerá, por\
    \ exemplo 2014, e somar 4 anos. Logo sabemos que 2018 é um ano no qual teremos\
    \ copa do mundo. Se continuarmos esse processo, o próximo ano de copa será 2022,\
    \ em seguida 2026 e pronto, chegamos ao 2030 e descobrimos que sim, haverá copa\
    \ do mundo. **Poderíamos continuar esse processo infinitamente, enquanto não nos\
    \ cansarmos**.\n\nVamos escrever um programa que mostra os anos de copa, desde\
    \ 1930, de uma forma extremamente simples. Basta termos uma variável cujo valor\
    \ seja 1930 e que sempre tenha seu valor aumentado de 4 em 4.\n\n```\n 1 var anoDeCopa\
    \ = 1930;\n 2 alert(anoDeCopa + \" tem copa!\");\n 3 \n 4 anoDeCopa = anoDeCopa\
    \ + 4;\n 5 alert(anoDeCopa + \" tem copa!\");\n 6 \n 7 anoDeCopa = anoDeCopa +\
    \ 4;\n 8 alert(anoDeCopa + \" tem copa!\");\n 9 \n10 anoDeCopa = anoDeCopa + 4;\n\
    11 alert(anoDeCopa + \" tem copa!\");\n```\n\nPoderíamos continuar repetindo esse\
    \ código até a exaustão. Mas repare o trabalho que teríamos. E se quisermos mais\
    \ copas? Quanto código não teremos que escrever? É muito trabalho repetitivo!\
    \ Vamos tentar uma abordagem um pouco diferente.\n\nQueremos imprimir os anos\
    \ da copa, de 4 em 4, para saber todas as copas. Será possível? A ideia é criar\
    \ um programa que some `4` na variável `anoDeCopa`, alerte-nos esse valor, e volte\
    \ a executar o mesmo procedimento.\n\nSeguindo esse raciocínio, podemos criar\
    \ um novo programa, no arquivo `anos_de_copa.html`, que mostra para nós os anos\
    \ em que teve e terá copa do mundo, desde 1930:\n\n```\n1 <script>\n2 var anoDeCopa\
    \ = 1930;\n3 \n4 while(true) {\n5   alert(anoDeCopa + \" tem copa!\");\n6   anoDeCopa\
    \ = anoDeCopa + 4;\n7 }\n8 </script>\n```\n\nComeçamos com a variável `anoDeCopa`\
    \ iniciando em 1930, que foi o ano do primeiro evento. Em seguida, usamos o comando\
    \ `while` (*enquanto*), que significa que os comandos dentro das `{ }` serão realizados\
    \ quantas vezes quisermos, como se fosse uma **repetição**, que também é bastante\
    \ conhecida como **iteração**.\n\nEntão, mostramos que aquele ano possui copa\
    \ e mudamos o conteúdo da variável `anoDeCopa` para ir 4 anos adiante, simplesmente\
    \ somando 4 no `anoDeCopa` e guardando o resultado na mesma variável.\n\nQuando\
    \ executamos esse programa, vemos a seguinte mensagem de alerta aparecendo na\
    \ tela:\n\nSe seguirmos clicando em *OK*, veremos que para cada ano de copa, um\
    \ novo alerta é mostrado. Se tivermos paciência para clicar várias vezes, vamos\
    \ até descobrir que não haverá copa no ano de 2100! Repare que podemos clicar\
    \ infinitamente em OK, que uma mensagem sempre aparecerá, ou seja, ficamos em\
    \ uma repetição infinita, também conhecido como **loop infinito**.\n\n|  |\n\n\
    **Cuidados com alerts e loop infinito em browsers**\n\nNo código para exibir os\
    \ anos de copa, mostramos uma mensagem de alerta para cada um dos anos. Isso faz\
    \ com que muitas mensagens sejam exibidas sem parar.\n\nAlguns navegadores como\
    \ o Firefox e o Chrome permitem parar a exibição das mensagens logo que a segunda\
    \ mensagem aparece. No entanto, o Internet Explorer não faz o mesmo, ou seja,\
    \ seu navegador exibirá as mensagens e nunca parará, até que você force seu fechamento.\n\
    \n|  |\n\nApesar de muito interessante, talvez estejamos mostrando mais informações\
    \ do que o necessário. Principalmente, se quisermos saber **apenas** os anos em\
    \ que houve copa, **até** 2014, ano da copa no Brasil.\n\nEm português é frequente\
    \ aparecer o termo **laço** em vez de loop, e dizemos que o laço **itera** (repete)\
    \ determinado trecho de código que queremos. É a repetição de iterações a que\
    \ já havíamos dado nomes.\n\n### 5.2 Realize o loop somente em determinadas condições\n\
    \nO `while`, de forma similar ao `if`, aceita que indiquemos uma condição, para\
    \ que a cada repetição uma avaliação seja feita, para saber se deve executar ou\
    \ não o conteúdo da nossa repetição (*loop*), o **bloco** de código dentro dele.\
    \ Na seção anterior apenas utilizamos `while(true)`, indicando que o bloco de\
    \ código deve **sempre** repetir.\n\nQueremos melhorar e evitar o loop infinito.\
    \ Desejamos que o bloco seja executado somente **enquanto `anoDeCopa` for menor\
    \ ou igual a 2014**.\n\n```\n1 <script>\n2 var anoDeCopa = 1930;\n3 \n4 while(anoDeCopa\
    \ <= 2014) {\n5   alert(anoDeCopa + \" tem copa!\");\n6   anoDeCopa = anoDeCopa\
    \ + 4;\n7 }\n8 </script>\n```\n\nAgora indicamos para o `while` que ele deve,\
    \ a cada repetição, verificar se o valor da variável `anoDeCopa` ainda está menor\
    \ que 2014\\. Quando o valor do `anoDeCopa` for maior que 2014, a condição do\
    \ `while` não será satisfeita e o bloco não será executado novamente, pulando\
    \ para comando que vier logo após, isto é, após o fechar chaves.\n\nAbra em seu\
    \ navegador o arquivo `anos_de_copa.html` e perceba que ele mostrará um primeiro\
    \ alerta para 1930\\. Quando clicamos em *Ok* o programa nos mostra 1934 e assim\
    \ até chegar em 2014.\n\nFicar mostrando `alert` já deve estar começando a ficar\
    \ desagradável para você, certo? Se ainda não ficou, logo ficará! Vamos passar\
    \ a usar a função `mostra` que fizemos nos capítulos anteriores, ao invés do `alert`,\
    \ dentro do `while`, como vimos no capítulo [2](#index_split_003.html_comunicandose)."
