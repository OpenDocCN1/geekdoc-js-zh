    \ esquerdo. O ponto `600,400` é o inferior direito. Repare em alguns outros pontos\
    \ espalhados nas nossas coordenadas X e Y:\n\n![Coordenadas do nosso plano. Utilize\
    \ essa figura como referência para saber onde traçar seus objetos!](Images/plano.png)*Figura\
    \ 7.2: Coordenadas do nosso plano. Utilize essa figura como referência para saber\
    \ onde traçar seus objetos!*\n\nVamos adicionar mais um retângulo, agora em vermelho,\
    \ começando na posição `400,0`. Adicione logo após o seu retângulo verde:\n\n\
    ```\n1 c.fillStyle=\"red\";\n2 c.fillRect(400, 0, 200, 400);\n```\n\nO resultado\
    \ acaba em pizza! Temos a bandeira da Itália.\n\n![Bandeira da Itália](Images/italia.png)*Figura\
    \ 7.3: Bandeira da Itália*\n\nExperimente trocar as cores, como `gray`, `red`,\
    \ `green`, `blue`, `black` etc.\n\n### 7.2 Criando todo tipo de imagem\n\nA função\
    \ `fillRect` é simples e direta. Recebe a coordenada de início, além da altura\
    \ e largura. Desenhar outras figuras dá um pouco mais de trabalho. Você precisa\
    \ ir traçando o caminho, para depois chamar a função que preenche o que foi traçado.\n\
    \nPor exemplo, queremos fazer um triângulo no meio da bandeira, em cinza (`gray`),\
    \ como este:\n\n![Agora com um triângulo](Images/triangulo.png)*Figura 7.4: Agora\
    \ com um triângulo*\n\nPara isso, precisamos começar a traçar três lados. Pegamos\
    \ nosso pincel começando do ponto `300,200`, que representa o meio da bandeira.\
    \ Traçamos desse ponto até o inferior esquerdo, que é `200,400`. Depois traçamos\
    \ a base do triângulo, movendo o pincel até o ponto `400,400`. Por último, fechamos\
    \ o nosso polígono (no caso um triângulo), retornando ao ponto inicial do traçado.\
    \ Além disso, pedimos para que todo o polígono seja preenchido. O código fica\
    \ dessa forma:\n\n```\n1 c.fillStyle=\"gray\";\n2 c.beginPath();\n3 c.moveTo(300,\
    \ 200);\n4 c.lineTo(200, 400);\n5 c.lineTo(400, 400);\n6 c.fill();\n```\n\nO código\
    \ segue fielmente nossa descrição. Primeiro movemos o pincel para o centro da\
    \ imagem, para depois traçar os dois lados. O terceiro lado fica implícito quando\
    \ fazemos a chamada ao `fill`. Podemos ver isso na figura:\n\n![Coordenadas do\
    \ triângulo](Images/triangulo2.png)*Figura 7.5: Coordenadas do triângulo*\n\n\
    Podemos fazer qualquer figura que tenha lados usando essa fórmula, não apenas\
    \ triângulos. Mas e se precisarmos de algo arredondado? Vamos colocar uma circunferência\
    \ azul no meio da nossa imagem, pra ficar assim:\n\n![Uma circunferência](Images/circulo.png)*Figura\
    \ 7.6: Uma circunferência*\n\nExiste a função `arc`, que precisa de muitas informações.\
    \ São 5: as coordenadas X e Y, o raio, o ângulo inicial e o ângulo final, ambos\
    \ em radianos. Nada simples. Ele precisa dos ângulos iniciais e finais porque\
    \ ele também serve para desenhar apenas um pedaço do círculos. Vamos usar de 0\
    \ até duas vezes 3.14, que é o valor do PI, representando a circunferência inteira:\n\
    \n```\n1 c.fillStyle=\"blue\";\n2 c.beginPath();\n3 c.arc(300, 200, 50, 0, 2*3.14);\n\
    4 c.fill();\n```\n\nO valor de `3.14` é o PI. Estamos usando apenas duas casas\
    \ decimais. Esse valor de PI pode ser substituído por `Math.PI`, que é uma variável\
    \ já existente no JavaScript. Faça essa substituição. Valores fixos em variáveis\
    \ como essa são frequentemente referenciadas como **constantes**.\n\nVimos muitas\
    \ funções nesse capítulo. Como seria possível se lembrar de todas elas? Ou saber\
    \ qual é a ordem que devo passar os parâmetros? A linha `c.arc(300, 200, 50, 0,\
    \ 2*3.14)` parece bastante complicada.\n\n### 7.3 Não vou conseguir lembrar de\
    \ tudo isso! APIs e bibliotecas\n\nO nosso código não parece tão difícil, mas\
    \ como é que vamos saber a existência dessas funções de desenhar no canvas? Se\
    \ você reparar, vimos mais de 5 funções diferentes, entre elas `fillRect`, `beginPath`,\
    \ `moveTo`, `lineTo` e `fill`. Além disso usamos a variável `fillStyle`. É muita\
    \ coisa para memorizar!\n\nE você nem deve se preocupar tanto em memorizá-las.\
    \ Claro, se você utilizá-las com frequência, isso se tornará fácil. Pense no nosso\
    \ `document.write`, no `alert` e outras funções que não apareceram apenas uma\
    \ vez durante nosso aprendizado. Mas e essas do canvas? E esse tal \"contexto\
    \ 2d\", que apareceu no `tela.getContext(\"2d\");` e mal falamos dele?\n\nAcontece\
    \ que sempre temos uma documentação das principais funções do JavaScript. Isso\
    \ também aparece em diversas outras linguagens. Por exemplo, todas as funções\
    \ e variáveis que usamos para trabalhar com o canvas podem ser encontradas aqui,\
    \ bem documentadas:"
