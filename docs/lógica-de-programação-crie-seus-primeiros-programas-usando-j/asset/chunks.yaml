  trans: "\n每一个这些空间都在等待一个信息来控制将发生的循环。我们将编写一个程序，显示 10 个警报，每个都有一个从 1 到 10 的数字。我们同样会有一个循环，现在它应该从\
    \ 1 到 10。你还记得如何用 `while` 来实现它吗？代码会像下面这样：\n\n```\n1 var numero = 1\n2 while(numero\
    \ <= 10) {\n3   alert(numero);\n4   numero = numero + 1;\n5 }\n```\n\n那么，我们可以用\
    \ `for` 实现几乎完全相同的操作：\n\n```\n1 var numero = 1;\n2 for(; numero <= 10; ) {\n3 \
    \  alert(numero);\n4   numero = numero + 1;\n5 }\n```\n\n我们在第二个空间填充了循环条件，它将每次被被检查，以确定是否应该发生下一次循环。\n\
    \n这与已知的 `while` 有什么区别？在 `for` 内部出现了分号，这使得编写方式变得有点 *haha*（奇怪）。最终结果将是完全相同的。那么，为什么还需要另一个循环命令呢？\n\
    \n使用 `for`，我们可以使用分号之前的第一个空间来进行初始化。一个例子是初始化变量 `numero`：\n\n```\n1 for(var numero\
    \ = 1; numero <= 10; ) {\n2   alert(numero);\n3   numero = numero + 1;\n4 }\n\
    ```\n\n现在，发生了什么变化？几乎没有变化。你的代码变得更易读了。`var numero = 1` 的部分被称为 `for` 的初始化。它将只执行一次。下一步是检查\
    \ `numero <= 10` 并决定是否应该执行循环。\n\n在第二个分号 后的第三个空间，我们可以做什么呢？该部分的内容将始终被执行。它被广泛用于执行增加、递增我们在循环中使用的变量的代码。在这种情况下，是为了增加我们变量\
    \ `numero` 的值。通过此，我们可以使用这个新命令以这种方式打印从 1 到 10 的数字：\n\n```\n1 for(var numero = 1;\
    \ numero <= 10; numero = numero + 1) {\n2   alert(numero);\n3 }\n```\n\n因此，我们可以发现\
    \ `for` 拥有 3 个空间/部分：第一个，我们说明我们想要的初始值是多少；第二个，用于定义决定是否应该执行循环的条件——这部分的实现与我们在 `while`\
    \ 中看到的一样；第三个，用于修改影响循环结束的变量值。这三部分都由 `;` 隔开。\n\n```\nfor([初始化]; 重复条件]; 值修改])\n```\n\
    \n这里的重点是，我们刚刚用新命令 `for` 所做的，与我们用 `while` 能实现的的一样的，只是编写方式不同。`for` 需要我们在命令的括号中间写出这\
    \ 3 个特征，而 `while` 只需要条件。\n\n### 5.8 使用 for 重写乘法表\n\n既然如此，如果我们编写相同的显示在屏幕上的程序，但现在使用\
    \ `for` 代替 `while` 会变成什么样？首先，让我们回一下乘法表代码是如何写的，它使用了 `while` 命令：\n\n```\n1 <script>\n\
    2 var mostra = function(frase) {\n3   document.write(frase + \"<br>\");\n4 };\n\
    5 \n6 var multiplicador = 1;\n7 while(multiplicador <= 10) {\n8   mostra(7 * multiplicador);\n\
    9   multiplicador = multiplicador + 1;\n10 }\n11 </script>\n```\n\n现在，我们可以创建 `tabuada_com_for.html`\
    \ 文件，在其中创建一个新程序，它将执行与之前完全相同的事情，但方式不同。由于 `for` 首先需要一个初始值，很容易识别出它是变量 `multiplicador`，它从值\
    \ 1 开始。\n\n```\n1 <script>\n2 for(var multiplicador = 1; ;) {\n3 }\n4 </script>\n\
    ```\n\n现在我们需要填充 `for` 需要的其他信息。下一个是循环应该持续到什么时候，在这种情况下，是指示当 `multiplicador` 小于 10\
    \ 时应该循环的条件。\n\n```\n1 <script>\n2 for(var multiplicador = 1; multiplicador <=\
    \ 10; ) {\n3 }\n4 </script>\n```\n\n好了，只差说明 `multiplicador` 以多大的间隔增加，在我们的情况下是每次\
    \ 1。我们称这为递增变量。为了此，我们正在执行 `multiplicador = multiplicador + 1`。每当我们想给那个变量加 1 时，我们必须重复变量的名字，表示我们想将其赋值原有值加\
    \ 1 的结果。\n\n在日常生活中，许多程序员将倾向于用一种简写的方式这样做。语言的语法规则允许这样做。这一行可以简写为 `multiplicador++`。变量旁边的两个加号仅仅是\
    \ `JavaScript` 理解的一种简写方式，意味着你想增加该变量的值。\n\n通过此，我们可以用这种方式写写命令：\n\n```\n1 <script>\n\
    2 for(var multiplicador = 1; multiplicador <= 10; ) {\n3 }\n4 </script>\n```\n\
    \n好了，只差说明 `multiplicador` 以多大的间隔增加，在我们的情况下是每次 1。我们称这为递增变量。为了此，我们正在执行 `multiplicador\
    \ = multiplicador + 1`。每当我们想给那个变量加 1 时，我们必须重复变量的名字，表示我们想将其赋值原有值加 1 的结果。\n\n在日常生活中，许多程序员将倾向于用一种简写的方式这样做。语言的语法规则允许这样做。这一行可以简写为\
    \ `multiplicador++`。变量旁边的两个加号仅仅是 `JavaScript` 理解的一种简写方式，意味着你想增加该变量的值。\n\n通过此，我们可以用这种方式写写命令：\n\
    \n```\n1 <script>\n2 for(var multiplicador = 1; multiplicador <= 10; multiplicador++)\
    \ {\n3   mostra(multiplicador * 7);\n4 }\n5 </script>\n```\n\n"
- fmt: "\nAgora que sabemos quantos familiares existem, podemos perguntar um por um\
    \ suas idades. Dessa forma, se fosse informado que são 4 familiares, precisamos\
    \ perguntar as 4 idades. Repare que temos uma repetição, que nesse caso, vai de\
    \ 1 até o número total de familiares.\n\n```javascript\nvar totalDeFamiliares\
    \ = prompt(\"Quantos familiares são?\");\nvar numero = 1;\nwhile(numero <= totalDeFamiliares)\
    \ {\n  numero++;\n}\n```\n\nAnalisando o código, temos uma nova variável, chamada\
    \ `numero`. Ela é apenas para nos auxiliar a saber até quando temos que repetir\
    \ o trecho dentro do `while`. A cada repetição aumentamos seu valor em 1, através\
    \ do `numero++`.\n\nA cada repetição, temos que perguntar qual é a idade da pessoa.\n\
    \n```javascript\nvar totalDeFamiliares = prompt(\"Quantos familiares são?\");\n\
    var numero = 1;\nwhile(numero <= totalDeFamiliares) {\n  var idadeTexto = prompt(\"\
    Qual é a idade?\");\n  var idade = parseInt(idadeTexto);\n  numero++;\n}\n```\n\
    \nRepare que usamos o `parseInt` para transformar o valor digitado no `prompt`\
    \ em um número. Isso porque vamos somar esse valor `idade`. Se o deixássemos como\
    \ `string`, os valores seriam concatenados, como já vimos.\n\nÉ comum fazermos\
    \ tudo isso numa única linha, descartando a necessidade de criar a variável `idadeTexto`.\
    \ Esse é aquele tipo de variável que chamamos de temporária, já que ela só existe\
    \ para nos auxiliar a calcular a `idade`. Para fazer direto, usamos `parseInt(prompt(\"\
    Qual é a idade?\"))`. Parece complicado, mas não é. O JavaScript sempre começará\
    \ a execução pelos parênteses mais internos, executando o `prompt`. Com o resultado\
    \ do `prompt` em mãos, ele executará o `parseInt`, devolvendo o valor do que foi\
    \ digitado, porém como número, pronto para ser usado corretamente em operações\
    \ matemáticas. Nosso código ficou então:\n\n```javascript\nvar totalDeFamiliares\
    \ = prompt(\"Quantos familiares são?\");\nvar numero = 1;\nwhile(numero <= totalDeFamiliares)\
    \ {\n  var idade = parseInt(prompt(\"Qual é a idade?\"));\n  numero++;\n}\n```\n\
    \nPara calcularmos a média, somamos todas as idades e dividimos pelo `totalDeFamiliares`\
    \ que temos, porém, a cada repetição, pegamos uma nova idade e não guardamos o\
    \ total das idades que já podemos ter pego em repetições anteriores. Para resolver\
    \ esse problema, vamos criar uma nova variável, chamada `somaDeIdades`, que vai\
    \ começar com o valor 0 e a cada repetição vamos somar com a idade digitada.\n\
    \n```javascript\nvar totalDeFamiliares = prompt(\"Quantos familiares são?\");\n\
    var somaDeIdades = 0;\nvar numero = 1;\nwhile(numero <= totalDeFamiliares) {\n\
    \  var idade = parseInt(prompt(\"Qual é a idade?\"));\n  somaDeIdades = somaDeIdades\
    \ + idade;\n  numero++;\n}\n```\n\nCom isso, considere que temos 3 familiares.\
    \ O primeiro com 20, o segundo com 30 e o terceiro com 40 anos. Na primeira repetição,\
    \ o valor de `somaDeIdades` que estará em 0 será somado com 20, ou seja, seu novo\
    \ valor agora é 20. Na segunda repetição, `somaDeIdades` que agora tem o valor\
    \ 20, será somado com 30 e vai para 50. Por fim, `somaDeIdades` que agora é 50,\
    \ vai para 90, com a soma por 40 da idade do último familiar.\n\n**No fim das\
    \ repetições, o valor de soma de idades foi para 90**. Agora que acabamos as repetições,\
    \ se queremos saber a média de idades, basta dividirmos essa `somaDasIdades` pelo\
    \ `totalDeFamiliares`. Por exemplo, com a soma 90 e 3 familiares, a média de idade\
    \ será de 30 anos.\n\nEntão vamos fazer o nosso programa: após as repetições serem\
    \ feitas, ou seja, depois do `while` terminar seu trabalho, calcular a média e\
    \ mostrá-la. São as duas últimas linhas do código a seguir:\n\n```javascript\n\
    var totalDeFamiliares = prompt(\"Quantos familiares são?\");\nvar somaDeIdades\
    \ = 0;\nvar numero = 1;\nwhile(numero <= totalDeFamiliares) {\n  var idade = parseInt(prompt(\"\
    Qual é a idade?\"));\n  somaDeIdades = somaDeIdades + idade;\n  numero++;\n}\n\
    var media = somaDeIdades / totalDeFamiliares;\nalert(\"A média é: \" + media);\n\
    ```\n\nPronto, agora se você abrir esse programa em seu navegador, ele te perguntará\
    \ primeiro a quantidade de familiares que você tem, e em seguida, vai perguntar\
    \ qual é a idade para cada um deles. No final teremos a média de idade dos familiares.\n\
    \n### 5.10 Jogo: Mais chances para adivinhar o número que estou pensando\n\nNo\
    \ capítulo [4](#index_split_005.html_condicionais), fizemos o computador pensar\
    \ em um número. Agora o computador pensará um número entre 0 e 100. O usuário\
    \ terá 3 chances para adivinhar esse número. Se o usuário errar, o computador\
    \ dirá se o número secreto é maior ou menor. Se o usuário acertar, o computador\
    \ mostrará parabéns.\n\nVamos criar um novo arquivo chamado `jogo_adivinha_com_tentativas.html`:\n\
    \n```html\n<script>\nvar numeroPensado = Math.floor(Math.random() * 101);\n</script>\n\
    ```\n\nA partir do `numeroPensado`, precisaremos perguntar ao usuário qual o chute\
    \ que ele gostaria de dar. Vamos estipular também que a quantidade de tentativas\
    \ será 3 e que quando passar da terceira tentativa, a repetição deverá encerrar.\n\
    \nPara isso, vamos declarar uma variável `numeroTentativa`, onde guardaremos se\
    \ é a primeira, segunda ou terceira tentativa. Essa variável começará em 1, já\
    \ que no começo do programa, estaremos na primeira tentativa. Enquanto esse número\
    \ for menor ou igual a 3, ou seja, enquanto não passou da terceira tentativa,\
    \ faremos a pergunta. Vamos usar o `while` para isso e não vamos esquecer que\
    \ ao final de cada repetição deveremos aumentar o número da tentativa (caso contrário,\
    \ entraremos em repetições infinitas):\n\n```javascript\n<script>\nnumeroPensado\
    \ = Math.floor(Math.random() * 101);\nvar numeroTentativa = 1;\nwhile(numeroTentativa\
    \ <= 3) {\n  numeroTentativa++;\n}\n</script>\n```\n\nPrecisamos perguntar para\
    \ o usuário do programa qual é o número que ele acha que o computador pensou.\
    \ Vamos fazer isso através de um `prompt`, que colocaremos dentro do bloco de\
    \ repetição, o `while`, pois ele fará parte de uma tentativa:\n\n```javascript\n\
    <script>\nnumeroPensado = Math.floor(Math.random() * 101);\nvar numeroTentativa\
    \ = 1;\nwhile(numeroTentativa <= 3) {\n  var chute = prompt(\"Qual você acha que\
    \ é?\");\n  numeroTentativa++;\n}\n</script>\n```\n\nPronto, agora a cada repetição\
    \ perguntamos ao usuário qual é o chute que ele quer dar. Precisamos saber se\
    \ ele acertou ou não. Para isso, basta compararmos o número do `chute` com o `numeroPensado`\
    \ e ver se eles são iguais. Mostraremos mensagens para o usuário nos dois casos.\n\
    \n```javascript\n<script>\nnumeroPensado = Math.floor(Math.random() * 101);\n\
