    [https://groups.google.com/group/comece-a-programar/](https://groups.google.com/group/comece-a-programar/)


    E também pode postar dúvidas no fórum do GUJ:


    [http://www.guj.com.br/](http://www.guj.com.br/)


    Há diversos caminhos por onde você pode continuar.


    Um é estudar mais profundamente o HTML e o JavaScript (e também o CSS, que não
    vimos aqui). Há livros sobre HTML, CSS e sobre JavaScript e `jQuery` na Casa do
    Código. Há também cursos sobre esses assuntos na Caelum, o `WD-43` e o `WD-47`.


    Você pode ir pelo caminho do `Ruby on Rails`. O `Ruby` é uma outra linguagem,
    e o `Ruby on Rails` é algo como uma ferramenta para criar sistemas na web. Tem
    também livros na editora e o curso `RR-71` na Caelum.


    O `Java` (sim, é diferente de `JavaScript`) também é uma opção, que pode abrir
    portas para você desenvolver aplicativos para celular, no Android. Tem os cursos
    `FJ-11` e `FJ-57` na Caelum, além do livro de Android da Casa do Código, mas é
    necessário conhecer a linguagem `Java` para lê-lo.

    '
