  raw: "Em vez disso, podemos fazer com que a `calculaIMC` não mostre o IMC e, como\
    \ o nome diz, apenas calcule seu valor, **retornando-o** para quem a chamou. Altere\
    \ sua função, removendo a linha do `mostra` e adicionando um `return`:\n\n```\n\
    1 function calculaIMC(altura, peso) {\n2   var imc = peso / (altura * altura);\n\
    3   return imc;\n4 }\n```\n\nAgora, na linha que faz a chamada a essa função,\
    \ vamos pegar o que ela retorna, para depois utilizar. Veja:\n\n```\n1 var pesoDoPrimo\
    \ = 83;\n2 var alturaDoPrimo = 1.76;\n3 var imcDoPrimo = calculaIMC(alturaDoPrimo,\
    \ pesoDoPrimo);\n4 mostra(\"O imc do meu primo é \" + imcDoPrimo);\n5 mostra(\"\
    Ele ainda está \" + (imcDoPrimo - 18.5) \n6     + \" pontos acima do limite da\
    \ magreza.\");\n```\n\nA variável `imcDoPrimo` vai receber o valor que foi **retornado**\
    \ pela função `calculaIMC` através da palavra-chave `return`. Teremos muitas funções\
    \ que trabalham dessa forma, recebendo alguns parâmetros, realizando uma tarefa\
    \ e depois devolvendo um resultado que será útil para quem a chamou. Esse valor\
    \ que volta para quem **chamou** a função é conhecido como **retorno da função**.\n\
    \n### 3.3 Revise o código: calculando o IMC\n\nVamos revisar como deve estar seu\
    \ código do `imc.html`. Primeiramente precisamos declarar as funções que vamos\
    \ utilizar. Temos tanto a função `mostra` quanto a `pulaLinha`:\n\n```\n1 <script>\n\
    2 function pulaLinha() {\n3   document.write(\"<br>\");\n4 }\n5 \n6 function mostra(frase)\
    \ {\n7   document.write(frase);\n8   pulaLinha();\n9 }\n```\n\nAgora teremos nossa\
    \ função que, dados altura e peso, calcula o imc e o retorna:\n\n```\n1 function\
    \ calculaIMC(altura, peso) {\n2   var imc = peso / (altura * altura);\n3   return\
    \ imc;\n4 }\n```\n\nPronto, já podemos utilizar essa função, pegando o seu retorno,\
    \ seja para você ou para o seu primo:\n\n```\n1 var peso = 75;\n2 var altura =\
    \ 1.72;\n3 var imc = calculaIMC(altura, peso);\n4 \n5 mostra(\"Meu imc é \" +\
    \ imc);\n6 mostra(\"Ainda estou \" + (imc - 18.5) \n7     + \" pontos acima do\
    \ limite da magreza.\");\n8 </script>\n```\n\nVamos modificar um pouco nosso código,\
    \ praticando com exercícios.\n\n1.  Adicione uma linha de código para dizer o\
    \ quão distante você está da obesidade severa, que é o índice de 35.\n\n2.  Há\
    \ uma forma mais curta de escrever essas duas linhas:\n\n    ```\n    1 var imc\
    \ = calculaIMC(altura, peso);\n    2 mostra(\"Meu imc é \" + imc);\n    ```\n\n\
    \    Como estamos atribuindo o resultado do cálculo à variável `imc` e depois\
    \ utilizando-a na chamada ao `mostra`, poderíamos ter feito isso tudo dentro de\
    \ uma única linha, sem declarar a variável:\n\n    ```\n    1 mostra(\"Meu imc\
    \ é \" + calculaIMC(altura, peso));\n    ```\n\n    Faça o teste. Mas será que\
    \ é vantajoso? A linha que mostrava o quão distante você estava da magreza ficava\
    \ logo embaixo. O que acontecerá com ela agora que não temos mais a variável `imc`?\
    \ Não vai funcionar. Você poderia fazer o mesmo nas outras linhas, colocando `calculaIMC(altura,\
    \ peso)` em vez da variável, mas o navegador vai, a cada chamada, recalcular o\
    \ IMC, sendo que da forma anterior esse número foi calculado apenas uma única\
    \ vez e reaproveitado.\n\n3.  Você se lembra do `Math.round`? Ele também é uma\
    \ função, que todos os navegadores já possuem definida. E ela é uma função que\
    \ retorna um valor, por isso podemos fazer:\n\n    ```\n    1 mostra(\"Meu imc\
    \ é \" + Math.round(imc));\n    ```\n\n    Essa função retorna o número arredondado.\
    \ Uma outra opção seria utilizá-la no momento da declaração da variável `imc`.\
    \ Isto é, em vez de:\n\n    ```\n    1 var imc = calculaIMC(altura, peso);\n \
    \   ```\n\n    Você pode fazer:\n\n    ```\n    1 var imc = Math.round(calculaIMC(altura,\
    \ peso));\n    ```\n\n    Difícil? É uma forma comum de escrever código. Repare\
    \ nos parênteses: primeiro será calculado o IMC, para depois, o `Math.round` arredondar\
    \ esse valor.\n\n    Qual dos dois você vai utilizar? Depende. Se você quer sempre\
    \ trabalhar com o `imc` arrendondado, vale utilizar essa última forma. Se algumas\
    \ vezes utilizará arrendondado e outras da forma quebrada, é melhor utilizar o\
    \ `Math.round` só quando convier.\n\n### 3.4 Trabalhe com dados capturados: pergunte\
    \ a altura e peso do usuário\n\nSomos capazes de trabalhar com números e palavras,\
    \ mas todos eles estão dentro do nosso código, mesmo que organizados em variáveis\
    \ e funções. Se quisermos calcular o IMC de um outro amigo, precisaremos mudar\
    \ esse valores, salvar o arquivo e atualizar a página. Seria bastante interessante\
    \ poder ter informações sobre o usuário do nosso programa, sem ter de alterar\
    \ o código.\n\nQuando usamos o computador, é natural aparecer uma caixa de diálogo\
    \ (*dialog box*) perguntando alguns dados do usuário. Podemos fazer o mesmo via\
    \ JavaScript. Assim como já criamos uma caixa de alerta para exibir nossos resultados\
    \ com o `alert`, podemos utilizá-la para receber dados. Isso é feito com a função\
    \ `prompt`. Crie um novo arquivo que será salvo como `perguntas.html` e coloque:\n\
    \n```\n1 <script>\n2 var nome = prompt(\"Bom Dia! Qual é o seu nome?\");\n3 </script>\n\
    ```\n\nO resultado é o seguinte:\n\nSimples, não? A função `prompt` retorna exatamente\
    \ o que for digitado pelo usuário nessa caixa. Com o nome do usuário em mãos,\
    \ podemos utilizá-lo para conversar com ele:\n\n```\n1 <script>\n2 var nome =\
    \ prompt(\"Bom Dia! Qual é o seu nome?\");\n3 document.write(\"Bem vindo, \" +\
    \ nome);\n4 </script>\n```\n\nVocê também pode perguntar a `idade` do usuário,\
    \ e utilizar seu próprio `nome` nessa nova pergunta:\n\n```\n1 <script>\n2 var\
    \ nome = prompt(\"Bom Dia! Qual é o seu nome?\");\n3 document.write(\"Bem vindo,\
    \ \" + nome);\n4 \n5 var idade = prompt(nome + \", quantos anos você tem?\");\n\
    6 document.write(nome + \" tem \" + idade + \"anos.\");\n7 </script>\n```\n\n\
    ### 3.5 Exercícios: pergunte os dados do usuário para calcular o IMC\n\nEm vez\
    \ de ter de ficar alterando toda vez o nosso arquivo `imc.html` para calcular\
    \ o IMC de uma outra pessoa, vamos utilizar essa função `prompt` para capturar\
    \ a altura e o peso do usuário.\n\n1.  No seu arquivo `imc.html`, depois da declaração\
    \ das três funções (`pulaLinha`, `mostra` e `calculaIMC`), pergunte a altura e\
    \ o peso do usuário:\n\n    ```\n    1 var alturaDoUsuario = prompt(\"Bom Dia!\
    \ Qual é a sua altura?\");\n    2 var pesoDoUsuario = prompt(\"E o seu peso?\"\
    );\n    ```\n\n2.  Agora, com esses dois dados, fica fácil calcular o IMC do usuário:\n\
    \n    ```\n    1 var imcDoUsuario = calculaIMC(alturaDoUsuario, pesoDoUsuario);\n\
    \    2   mostra(\"O seu imc é \" + imcDoUsuario);\n    3 </script>\n    ```\n\n\
    3.  Altere seu código para perguntar o nome do usuário, usando um `prompt`, e\
    \ utilizar esse `nome` capturado para perguntar tanto a `altura` quanto `peso`\n\
    \n4.  O que acontece se você digitar algo que não é um número quando te perguntarem\
    \ o peso e a altura? Ou utilizar a vírgula em vez de ponto? Veremos como contornar\
    \ esses problemas em outras lições.\n\n### 3.6 Descubra quantos dias seus amigos\
    \ já viveram\n\nO `prompt` pode capturar quantos anos tem o usuário, e depois\
    \ podemos utilizar isso para saber quantos dias ele já viveu. Crie o arquivo `dados_vitais.html`\
    \ e faça a conta de quantos dias o usuário já viveu:\n\n```\n1 <script>\n2 var\
    \ idade = prompt(\"Quantos anos você tem?\");\n3 var dias = idade * 365;\n4 document.write(\"\
    Você já viveu \" + dias + \" dias de vida\");\n5 </script>\n```\n\nAdicione também,\
    \ logo abaixo desse `document.write`, o cálculo de batimentos cardíacos dessa\
    \ pessoa. Faremos isso multiplicando o número de dias de vida por 24 horas, e\
    \ para cada hora vezes 60 minutos, e para cada minuto consideraremos 80 batimentos\
    \ cardíacos:\n\n```\n1 var batimentos = dias * 24 * 60 * 80;\n2 document.write(\"\
    Seu coração já bateu \" + batimentos \n3         + \" vezes. Haja coração!\");\n\
    ```\n\nEssa seção está muito fácil! Vamos fazer alguns exercícios para ir além\
    \ dessas contas simples.\n\n1.  Em vez de deixar o código `var dias = idade *\
    \ 365` dessa forma, crie uma função que faça esse cálculo. Você vai precisar declarar,\
    \ lá em cima, uma `var calculaDiasDeVida` que vai ser atribuída a uma `function`\
    \ que recebe `idade` como parâmetro. Com esse dado, você deve retornar o número\
    \ de `idade` vezes `365`."
