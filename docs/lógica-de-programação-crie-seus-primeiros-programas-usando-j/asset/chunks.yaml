  trans: "\n请注意，如果我们找到了数字并显示了警告消息，我们会执行一个 `return`。正如我们所看到的，`return` 命令可以简单地停止一个没有返回值的函数的执行。如果你移除这个\
    \ `return`，你会发现即使数字已经重复，它最终会将该数字添加到我们的数组中。如果换成 `break`，会有用吗？\n\n1. 这是一个困难的练习！你必须从\
    \ 1 到 60 之间随机抽取 6 个数字并将它们存储在一个数组中。然后要求用户输入 6 个数字，一次一个（可以使用 `prompt` 或 `input`），并把它们存储在另一个数组中。最后告诉他猜中了几个数字。是的，这次是真正的彩票游戏！\n\
    \n   尝试猜中这 6 个数字。然后计算一下你猜中全部 6 个数字的概率。你可能再也不会玩彩票了！\n\n## 第 7 章：附录 - 让一切变得更有趣图表\n\
    \n为我们的工作提供视觉反馈是非常回报的。我们将学习使用一些 JavaScript 函数在 HTML 的画布（`canvas`）上绘图，以练习我们所学的知识并进一步探索。用有趣的图片惊艳你的朋友，并让我们看看你做了什么！记得参加我们的讨论列表。\n\
    \n会涉及到一些数学，但不要担心。它会非常简单，你不需要担心细节。重要的是始终观察函数、变量、`ifs` 和 `fors` 是如何协同工作的。\n\n如果你阅读的是纸质版，将无法获得用于练习题的准确颜色，没关系，你可以选择你认为合适的颜色。\n\
    \n### 7.1 绘制线条和形状\n\n我们要在页面上定义一个区域，以便我们通过 JavaScript 在上面绘图。创建一个 `canvas.html`\
    \ 文件，并如下所示声明我们将用于涂画的区域：\n\n```\n1 <canvas id=\"tela\" width=\"600\" height=\"\
    400\"></canvas>\n```\n\n没错，只有一行，没有 `script` 标签。在 Chrome 中打开你的 HTML，结果是什么？没错，一个\
    \ 600x400 的白色画布，背景上是……也是白色的！什么也看不见。让我们在左侧画一个绿色（`green`）矩形，位于 `0,0`（左上角），大小为 `200,400`（到达底部，即最大可能值\
    \ 600 的三分之一）。在这里我们正在一个二维平面上工作，逗号分隔 X 位置和 Y 位置。\n\n为了实现这一点，我们不得不使用一些我们还不太熟悉的 JavaScript\
    \ 函数。别担心，你以后会学到关于它们的很多知识。测试（尽管并不理想）我们尚未掌握的新函数和命令是自然的。\n\n在你的 canvas 声明下方直接添加以下行。\n\
    \n```\n1 <script>\n2 var tela = document.getElementById(\"tela\");\n3 var c =\
    \ tela.getContext(\"2d\");\n4 \n5 c.fillStyle=\"green\";\n6 c.fillRect(0, 0, 200,\
    \ 400);\n7 </script>\n```\n\n打开你的 HTML，我们得到了下面的图形：\n\n![一个简单的绿色列柱](img/verde.png)\
    \ 图 7.1：一个简单的绿色列柱\n\n前两个目前对我们并不重要。你可以想象变量 `c` 就像一把画笔。我们可以更改画笔的样式（通过变量 `fillStyle`）并绘制各种形状（在本例中是矩形，通过调用函数\
    \ `fillRect`）。\n\n`fillRect` 函数接收四个数字来绘制一个矩形。前两个是 X,Y 位置。另外两个是矩形的宽度和高度。在这种情况下，我们正在位置\
    \ `0,0` 绘制一个宽为 200、高为 400 的矩形。\n\n如何更好地了解它在屏幕上的终点在哪里？`0,0` 点是左上角。`600,400` 点是右下角。观察我们\
    \ X 和 Y 坐标中分散的一些其他点：\n\n![我们平面的坐标。使用此图作为参考知道在哪里绘制你的对象！](img/plano.png) 图 7.2：我们平面的坐标。使用此图作为参考知道在哪里绘制你的对象！\n\
    \n让我们再添加一个矩形，现在是红色的，从位置 `400,0` 开始。在你的绿色矩形之后添加：\n\n```\n1 c.fillStyle=\"red\"\
    ;\n2 c.fillRect(400, 0, 200, 400);\n```\n\n结果非常棒！我们得到了意大利国旗。\n\n![意大利国旗](img/italia.png)\
    \ 图 7.3：意大利国旗\n\n尝试更换颜色，如 `gray`、`red`、`green`、`blue`、`black` 等。\n\n### 7.2 创建各种类型的图像\n\
    \n`fillRect` 函数简单且直接。它接收起始坐标，以及高度和宽度。绘制其他形状需要更多工作。你需要先描绘路径，然后调用函数来填充已绘制的内容。\n\n\
    例如，我们想在国旗中间画一个灰色（`gray`）的三角形，像这样：\n\n![现在有一个三角形](img/triangulo.png)\n\n为了实现这一点，我们需要从这里。存在\
    \ `arc` 函数，它需要很多信息。是 X 和 Y 坐标、半径、起始角度和结束角度，都是弧度。并不简单。它需要起始和结束角度来绘制圆弧。我们将使用 0 到\
    \ 3.14。\n\n```\n1 c.fillStyle=\"blue\";\n2 c.beginPath();\n3 c.arc(300, 200, 50,\
    \ 0, 3.14);\n4 c.fill();\n```\n\n只使用了两位小数。这个 PI 值可以替换为 `Math.PI`，它是一个已经存在的变量。像这样的固定值通常被称为常量。\n\
    \n我们在这一章中看到了很多函数。我们如何记住所有的它们？或者知道我应该传递参数的顺序？`c.arc(300, 200, 50, 0, 3.14)` 这一行看起来相当复杂。\n\
    \n### 7.3 我记不住所有这些！API 和库\n\n我们的代码看起来并不那么困难，但我们如何知道这些画布 绘图函数的存在？如果你仔细看，我们看到了超过\
    \ 5 个不同的函数，包括 `fillRect`、`beginPath`、`moveTo`、`lineTo` 和 `fill`。此外我们还使用了变量 `fillStyle`。要记忆的东西太多了！\n\
    \n你并不应该太担心去记住它们。当然，如果你经常使用它们，这会变得容易。想想我们的 `document.write`、`alert` 以及其他在学习过程中只出现过一次的函数。但这些画布的呢？那个所谓的“2d\
    \ 上下文”，在 `tela.getContext(\"2d\")` 中出现我们几乎没有谈论它？\n\n事实是我们一直有一个 JavaScript 主要函数的文档。例如，我们用于处理画布\
    \ 的所有函数和变量可以在这里找到，并有详细的文档：\n\n"
- fmt: "\n[https://developer.mozilla.org/en-US/docs/DOM/CanvasRenderingContext2D](https://developer.mozilla.org/en-US/docs/DOM/CanvasRenderingContext2D)\n\
    \nO site da Mozilla, responsável pelo navegador FireFox, possui uma das documentações\
    \ mais completas e fáceis de ler. Nesse site você pode ver uma documentação como\
    \ da imagem abaixo.\n\n![Documentação no site da Mozilla](Images/documentacao_normal.png)\
    \ *Figura 7.7: Documentação no site da Mozilla*\n\nRepare que ele dá uma breve\
    \ descrição e depois parte para cada função, cada variável relacionadas ao assunto.\
    \ Sim, você vai precisar encarar o inglês técnico, mesmo que básico. Em português,\
    \ documentações desse tipo, que chamamos de referência, são bastante escassas.\n\
    \nA documentação da Mozilla pode conter informações específicas que só funcionam\
    \ no navegador deles. Para uma documentação oficial, que deveria funcionar em\
    \ todos os navegadores, porém menos completa, há este site:\n\n[http://docs.webplatform.org/wiki/javascript](http://docs.webplatform.org/wiki/javascript)\n\
    \nMuitas vezes temos um conjunto de funções que trabalham com um objetivo em comum.\
    \ Chamamos esse conjunto de **biblioteca**. É frequente alguém se referenciar\
    \ à *biblioteca do JavaScript que trabalha com gráficos*, *biblioteca para validação\
    \ de CPF*, *biblioteca para fazer drag and drop*. Veremos mais à frente que há\
    \ casos em que isso pode aparecer com outros nomes mais estranhos ainda, como\
    \ API ou ainda de objeto.\n\nProcure você mesmo a documentação da função `fillRect`\
    \ nessa página. Clique sobre ela e você terá mais detalhes.\n\nTambém podemos\
    \ encontrar formatos mais simpáticos dessas documentações, criados por outros\
    \ desenvolvedores. Este é um bom exemplo de post que um blogiro criou para divulgar\
    \ seu PDF que contém uma documentação alternativa:\n\n[http://blog.nihilogic.dk/2009/02/html5-canvas-cheat-sheet.html](http://blog.nihilogic.dk/2009/02/html5-canvas-cheat-sheet.html)\n\
    \nEle apresenta um resumo das funções que trabalham com o canvas. Segue um pedaço\
    \ dessa documentação onde podemos ver algumas das que já conhecemos, bem resumidas,\
    \ explicando quais são os parâmetros que elas trabalham:\n\n![Uma documentação\
    \ não oficial, mas que pode ser bem útil. Há várias como essa na internet.](Images/documentacao_diferente.png)\
    \ *Figura 7.8: Uma documentação não oficial, mas que pode ser bem útil. Há várias\
    \ como essa na internet.*\n\nVamos conhecer outras funções relacionadas ao canvas\
    \ ainda neste capítulo. Lembre-se que você pode e deve explorar novas opções através\
    \ da documentação. O inglês não deve ser barreira: ele exigirá pouco, mas é fundamental\
    \ conhecer o mínimo.\n\n### 7.4 Revise seus primeiros passos com o canvas\n\n\
    Vamos revisar o que fizemos para criar a bandeira da Itália e as nossas outras\
    \ figuras. Não se assuste com um pouco de matemática e as coordenadas. A prática\
    \ vai tornar tudo bem mais fácil. Primeiro criamos o arquivo `canvas.html` e declaramos\
    \ nosso canvas:\n\n```\n1 <canvas id=\"tela\" width=\"600\" height=\"400\"></canvas>\n\
    ```\n\nLogo depois, começamos a colocar o código JavaScript. As duas primeiras\
    \ linhas são para adquirimos o tal do contexto 2d, que vai servir como pincel.\
    \ São duas linhas de código que ainda não dominamos:\n\n```\n1 <script>\n2 var\
    \ tela = document.getElementById(\"tela\");\n3 var c = tela.getContext(\"2d\"\
    );\n```\n\nAgora desenhamos o primeiro retângulo, que será verde:\n\n```\n1 c.fillStyle=\"\
    green\";\n2 c.fillRect(0, 0, 200, 400);\n```\n\nO segundo retângulo será vermelho,\
    \ de mesma largura e altura, porém iniciará na posição `400,0`:\n\n```\n1 c.fillStyle=\"\
    red\";\n2 c.fillRect(400, 0, 200, 400);\n```\n\nVamos ao triângulo cinza. Aqui\
    \ usamos a função que começa o traçado, a `beginPath`. Movemos o pincel com `moveTo`\
    \ e traçamos com `lineTo`. Por último, preenchemos o miolo com a função `fill`:\n\
    \n```\n1 c.fillStyle=\"gray\";\n2 c.beginPath();\n3 c.moveTo(300, 200);\n4 c.lineTo(200,\
    \ 400);\n5 c.lineTo(400, 400);\n6 c.fill();\n```\n\nPor último, desenhamos nosso\
    \ círculo bem no meio da bandeira, em azul, lembrando também de fechar a tag de\
    \ `script`:\n\n```\n1 c.fillStyle=\"blue\";\n2 c.beginPath();\n3 c.arc(300, 200,\
    \ 50, 0, 2*3.14);\n4 c.fill();\n5 </script>\n```\n\nVamos praticar mais o conhecimento\
    \ das coordenadas e testar outros desenhos e formas através das bandeiras.\n\n\
    1.  Inicialmente vamos desenhar duas bandeiras simples, a primeira da Colômbia\
    \ e a segunda de Madagascar:\n\n    ![Bandeira da Colombia](Images/colombia.png)\n\
    \n    *Figura 7.1: Bandeira da Colombia*\n\n    ![Bandeira de Madagascar](Images/madagascar.png)\n\
    \n    *Figura 7.2: Bandeira de Madagascar*\n\n2.  Agora duas que possuem circunferências\
    \ e você precisará usar o arco, do Laos e do Niger:\n\n    ![Bandeira do Laos](Images/laos.png)\n\
    \n    *Figura 7.3: Bandeira do Laos*\n\n    ![Bandeira do Niger](Images/niger.png)\n\
    \n    *Figura 7.4: Bandeira do Niger*\n\n3.  A bandeira da Noruega tem uma cruz\
    \ interessante:\n\n    ![Bandeira da Noruega](Images/noruega.png)\n\n    *Figura\
    \ 7.5: Bandeira da Noruega*\n\n4.  E a bandeira do Brasil:\n\n    ![Bandeira do\
    \ Brasil](Images/brasil.png)\n\n    *Figura 7.6: Bandeira do Brasil*\n\n### 7.5\
    \ Cansei de repetir! Funções\n\nVamos desenhar vários quadrados. Podemos usar\
    \ um novo arquivo, `loop.html`. Dentro dele, vamos declarar o canvas e preparar\
    \ 50 por pixels. Ela chamará `desenhaQuadradoVerde`:\n\n```\n1 <canvas id=\"tela\"\
    \ width=\"600\" height=\"400\"></canvas>\n2 \n3 <script>\n4 desenhaQuadradoVerde\
    \ = function(x,y) {\n5   var tela = document.getElementById(\"tela\");\n6   var\
    \ c = tela.getContext(\"2d\");\n7   \n8   c.fillStyle=\"green\";\n9   c.fillRect(x,\
    \ y, 50, 50);\n10 };\n11 \n12 desenhaQuadradoVerde(0,0);\n13 </script>\n```\n\n\
    Na última linha estamos chamando a função para testar. Salve o arquivo e abra-o\
    \ com o Chrome. O resultado é apenas um quadrado verde.\n\n![Um quadrado verde...\
    \ através da função!](Images/quadrado_verde.png) *Figura 7.9: Um quadrado verde...\
    \ através da função!*\n\n### 7.6 Loops e funções para nos ajudar\n\nCom o auxílio\
    \ de um loop, podemos fazer muitas imagens. Vamos desenhar diversos quadrados\
    \ de tamanho 50 por 50, começando da posição zero do eixo X, indo até a posição\
    \ 600.\n\nEdite seu arquivo `canvas_loops.html` e vamos usar o `while` para fazer\
    \ isso. Criaremos uma variável `x` que vai aumentando de 50 em 50, até chegar\
    \ em 600\\. Delete a chamada para `desenhaQuadradoVerde(0,0)` e adicione as seguintes:\n\
    \n```\n1 var x = 0;\n2 while(x < 600) {\n3   desenhaQuadradoVerde(x, 0);\n4  \
    \ x = x + 50;\n5 }\n```\n\nSalve e abra o arquivo no Chrome. Qual é o resultado?\
    \ Uma linha comprida verde!\n\n![Uma linha verde. Na verdade, uma série de quadrados\
    \ verde.](Images/linha_verde.png) *Figura 7.10: Uma linha verde. Na verdade, uma\
    \ série de quadrados verde.*\n\nPor quê? Pois a cada 50 pontos nós desenhamos\
    \ um novo quadrado. Não há divisão entre eles pois são verdes em todos seus pontos.\
    \ Para ficar mais visual, podemos alterar a função `desenhaQuadradoVerde` para\
    \ que o estilo do traçado da borda (`strokeStyle`) seja preta, adicionando duas\
    \ linhas:\n"
