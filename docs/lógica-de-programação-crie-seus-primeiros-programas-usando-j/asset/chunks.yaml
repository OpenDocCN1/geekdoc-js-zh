    ### 4.5 Jogo: adivinhe o número que estou pensando


    Vamos criar agora nosso primeiro jogo! Será bem simples, mas o suficiente para
    garantir alguns instantes de diversão. Faremos o computador "pensar" em um número
    e a pessoa que estiver jogando tentará descobrir qual é esse número.


    Para conseguirmos escrever nosso jogo, crie o arquivo `jogo_adivinha.html`. A
    primeira tarefa que precisamos fazer é pedir para o computador "pensar" em um
    número aleatório. Conseguimos isso através da função que já vem pronta no JavaScript,
    chamada `Math.random()`. Não se assuste com o nome, essa função simplesmente devolve
    um número aleatório entre `0` e `1`. Assim, ela pode devolver, por exemplo, `0.5`.


    ```

    1 <script>

    2   var numeroPensado = Math.random();

    3 </script>

    ```


    Ficar adivinhando números com casas decimais não é uma tarefa muito agradável.
    Imagine se o número pensado pelo computador fosse 0.534345, não seria fácil, nem
    divertido, adivinhar um número assim.


    Vamos fazer o programa pensar necessariamente em um número entre `0` e `100`.
    Infelizmente não há uma função pronta que faça o sorteio desta forma, então vamos
    aproveitar e utilizar a `Math.random()` que já conhecemos. Para isso, multiplicaremos
    o resultado devolvido por `100`. Então, se ele pensar `0.5`, multiplicando por
    `100`, o resultado será `50`.


    ```

    1 <script>

    2   var numeroPensado = Math.random() * 100;

    3 </script>

    ```


    Ainda assim, podemos continuar com números cheios de casas decimais. Se o computador
    pensar em `0.5372`, ao multiplicar por 100 teremos `53.72`. Podemos arredondar
    esse valor através da função `Math.round()`. Vamos primeiro guardar o número com
    casas decimais em `numeroPensadoComCasasDecimais` e depois arrendondá-lo e guardá-lo
    na variável `numeroPensado`:


    ```

    1 <script>

    2   var numeroPensadoComCasasDecimais = Math.random() * 100;

    3   var numeroPensado = Math.round(numeroPensadoComCasasDecimais);

    4 </script>

    ```


    A variável `numeroPensadoComCasasDecimais` não vai ser mais utilizada. Nós a criamos
    apenas para poder calcular o número sorteado arredondado, que está em `numeroPensado`.
    É muito comum utilizarmos algumas variáveis rapidamente, apenas por um curto tempo,
    para depois ter o resultado importante em uma outra. Algumas pessoas se referem
    a essas variáveis como **variáveis temporárias**.


    Repare que poderíamos ter feito as duas operações (sortear e arredondar) numa
    mesma linha de código, sem a ajuda da variável `numeroPensadoComCasasDecimais`.
    Para isso, passamos o que o `Math.random() * 100` retorna diretamente para o `Math.round`:


    ```

    1 <script>

    2   var numeroPensado = Math.round(Math.random() * 100);

    3 </script>

    ```

