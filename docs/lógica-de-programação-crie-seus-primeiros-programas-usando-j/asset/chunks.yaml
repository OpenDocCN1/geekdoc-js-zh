    \ * 3 + empates;\n5 alert(total);\n```\n\nUma outra forma seria chamar o `parseInt`\
    \ na mesma linha que recebemos o valor dos pontos. É a forma que você encontrará\
    \ com mais frequência:\n\n```\n1 var vitorias = 3;\n2 var empates = parseInt(\"\
    1\"); // já converte string para int\n3 var pontos = vitorias * 3 + empates;\n\
    4 alert(total);\n```\n\nEntão já podemos modificar nosso código que calcula os\
    \ pontos em `pontos_futebol.html` para, na hora que receber o que o usuário digitar,\
