  trans: "\n\n```\n1 var anoComoTexto = prompt(\"Informe o ano inicial\");\n2 var\
    \ anoDeCopa = parseInt(anoComoTexto);\n```\n\n通过这个简单的修改，我们的程序又再次准备好在浏览器中运行了。\n\
    \n### 5.5 检查你的代码：将文本转换为数字\n\n我们的程序 `anos_de_copa.html` 一直运行正常，直到我们决定询问程序用户，他们想从哪一年开始显示世界杯的年份。\n\
    \n```\n 1 <script>\n 2 var mostra = function(frase) {\n 3   document.write(frase\
    \ + \"<br>\");\n 4 };\n 5 \n 6 var anoDeCopa = prompt(\"Informe o ano inicial\"\
    );\n 7 var anoLimite = prompt(\"Qual é o ano limite?\");\n 8 \n 9 while(anoDeCopa\
    \ <= anoLimite) {\n10   mostra(anoDeCopa + \" tem copa!\");\n11   anoDeCopa =\
    \ 4 + anoDeCopa;\n12 }\n13 mostra(\"Ufa! Esses foram os anos de copa até \" +\
    \ anoLimite);\n14 </script>\n```\n\n当我们在浏览器中打开这个文件并输入 1930 作为起始年份，2014 作为上限年份时，我们发现了一个意外：运行并没有符合预期。值被拼接在了一起，而不是进行预期的相加。\n\
    \n我们需要将数字相加，而不是数字与文本相加。我们通过 `parseInt` 函数解决了这个问题，将获取对应起始年份的文本转换为数字。\n\n```\n1\
    \ var anoComoTexto = prompt(\"Informe o ano inicial\");\n2 var anoDeCopa = parseInt(anoComoTexto);\n\
    ```\n\n此时，程序的完整代码如下：\n\n```\n 1 <script>\n 2 var mostra = function(frase) {\n\
    \ 3   document.write(frase + \"<br>\");\n 4 };\n 5 \n 6 var anoComoTexto = prompt(\"\
    Informe o ano inicial\");\n 7 var anoDeCopa = parseInt(anoComoTexto);\n 8 var\
    \ anoLimite = prompt(\"Qual o ano limite?\");\n 9 \n10 while(anoDeCopa <= anoLimite)\
    \ {\n11   mostra(anoDeCopa + \" é ano de copa!\");\n12   anoDeCopa = 4 + anoDeCopa;\n\
    13 }\n14 mostra(\"Ufa! Esses foram os anos de copa até \" + anoLimite);\n15 </script>\n\
    ```\n\n现在我们可以在浏览器中打开 `anos_de_copa.html` 程序，它会询问我们起始年份和上限，并正确地完成整个过程。\n\n1. 同样一个显示赛事年份的程序，但是针对奥运会的。记得第一届奥运会是在\
    \ 1896 年，而且也是每 4 年一次。\n2. 在 Chrome 控制台中进行测试，正如我们在 3.8 节所过的。发现 `\"10\" + 10`、`\"\
    10\" + \"10\"`、`\"10\" * 10`、`\"10\" * \"10\"` 的值。发挥想象力创造各种例子，你将开始理解 JavaScript\
    \ 何时进行计算、何时进行拼接，以及何时无法完成其中任一操作！\n\n### 5.6 进一步练习一下：制作乘法表\n\n谁没有在背 7 的乘法表时犹豫过呢？7,\
    \ 14, 21, 28... 然后就忘了！计算乘法表是重复过程的极佳例子。我们计算 7 的乘法表，从 7 乘以 1 到 7 乘以 10。事实上，用学校学生写乘法表的习惯形式变得更加清晰：\n\
    \n* 7 x 1 = 7\n* 7 x 2 = 14\n* 7 x 3 = 21\n* 7 x 4 = 28\n* 7 x 5 = 35\n* 7 x 6\
    \ = 42\n* 7 x 7 = 49\n* 7 x 8 = 56\n* 7 x 9 = 63\n* 7 x 10 = 70\n\n注意，我们从 1 开始乘以\
    \ 7，只要 7 小于或等于 10。这是另一个例子，我们可以轻松地让计算机程序为我们完成所有工作，并只显示我们的结果。那么，我们开始吧！\n\n第一步是创建一个新文件，可以命名为\
    \ `tabuadas.html`。在这个文件中，我们将通过 `<script>` 标签开始编写 JavaScript 代码：\n\n```\n1 <script>\n\
    2 \n</script>\n```\n\n由于我们的乘法表计算从乘以 1 开始，直到乘以 10，我们将创建一个变量来存储这个值，我们将其命名为 `multiplicador`，并使其初始值为\
    \ 1。\n\n```\n1 <script>\n2   var multiplicador = 1;\n3 </script>\n```\n\n只要变量\
    \ `multiplicador` 小于或等于 10，我们就想要计算乘法表。我们可以让程序执行这些任务。以下代码是一个示例：\n\n```\n1 <script>\n\
    2 var mostra = function(frase) {\n3   document.write(frase + \"<br>\");\n4 };\n\
    5 \n6 var multiplicador = 1;\n7 while(multiplicador <= 10) {\n8   mostra(\"7 x\
    \ \" + multiplicador + \" = \" + (7 * multiplicador));\n9   multiplicador++;\n\
    10 }\n11 </script>\n```\n\n### 5.7 学习不同的显示方式：for 命令\n\n通常，当我们有重复操作时，会使用 `while`，但有一种更有组织的方式编写这种代码：`for`\
    \ 命令。`for` 在我们知道需要重复多少次数时非常有用。\n\n`for` 的语法如下：\n\n```\nfor (初始化; 条件; 增量) {\n \
    \ // 要执行的代码\n}\n```\n\n其中：\n1. **初始化**：在此处定义控制变量（例如 `var i = 1`）。\n2. **条件**：在每次重复之前检查的表达式。如果为真，则执行块（例如\
    \ `i <= 10`）。\n3. **增量**：每次重复后发生的操作（例如 `i++`）。\n\n看看使用 `for` 编写 7 的乘法表是怎样的：\n\n\
    ```javascript\n<script>\n  for (var multiplicador = 1; multiplicador <= 10; multiplicador++)\
    \ {\n    mostra(\"7 x \" + multiplicador + \" = \" + (7 * multiplicador));\n \
    \ }\n</script>\n```\n\n注意 `for` 如何一行整合了我们之前用 `while` 需要多行完成的功能，使得代码更加简洁且易于阅读。\n\
    \n"
- fmt: "\nCada um desses espaços espera uma informação para controlar as repetições\
    \ que acontecerão. Vamos fazer um programa que mostrará 10 alertas, cada um com\
    \ um número de 1 a 10. Novamente teremos uma repetição, que agora deve ir de 1\
    \ até 10. Você lembra como faria isso com o `while`? Seria um código como o seguinte:\n\
    \n```\n1 var numero = 1\n2 while(numero <= 10) {\n3   alert(numero);\n4   numero\
    \ = numero + 1;\n5 }\n```\n\nPois bem, podemos fazer praticamente idêntico com\
    \ o `for`:\n\n```\n1 var numero = 1;\n2 for(; numero <= 10; ) {\n3   alert(numero);\n\
    4   numero = numero + 1;\n5 }\n```\n\nPreenchemos o segundo espaço com a condição\
    \ do loop, que será verificada toda vez para saber se mais uma repetição deve\
    \ ocorrer.\n\nQual é a diferença disso para o já conhecido `while`? Dentro do\
    \ `for` apareceram os pontos-e-vírgulas, que tornaram a forma de escrever bastantehaha.\
    \ O resultado final será exatamente o mesmo. Então, para que outro comando de\
    \ repetição?\n\nCom o `for`, podemos usar o primeiro espaço antes do ponto-e-vírgula\
    \ para realizar inicializações. Um exemplo é inicializar a variável `numero`:\n\
    \n```\n1 for(var numero = 1; numero <= 10; ) {\n2   alert(numero);\n3   numero\
    \ = numero + 1;\n4 }\n```\n\nE agora, o que mudou? Quase nada. Seu código ficou\
    \ legível. A parte que diz `var numero = 1` é chamada de inicialização do `for`.\
    \ Ela será executada apenas uma vez. A próxima etapa é verificar `numero <= 10`\
    \ e decidir se deve ou executar uma repetição.\n\nE o que podemos fazer no terceiro\
    \ espaço, logo após o segundo ponto-e-vírgula? O que estiver nessa parte será\
    \ sempre executada. É muito utilizado para executar o código que aumenta, incrementa\
    \ a variável que usamos durante o loop. Nesse caso, para aumentar o valor da nossa\
    \ variável `numero`. Com isso, podemos escrever um comando que imprima de 1 até\
    \ 10 com esse novo comando da maneira:\n\n```\n1 for(var numero = 1; numero <=\
    \ 10; numero = numero + 1) {\n2   alert(numero);\n3 }\n```\n\nPortanto, podemos\
    \ perceber que o `for` possui 3 espaços/pedaços: o primeiro, onde dizemos qual\
    \ é o valor inicial que queremos; o segundo para definirmos qual é a condição\
    \ que determina se repetições devem ser feitas ou não — essa parte é feita da\
    \ mesma forma que vimos no `while`; e o terceiro, que modifica o valor de alguma\
    \ variável que influa na finalização das repetições. As três partes são delimitadas\
    \ pelo `;`.\n\n```\nfor([inicialização]; condição para repetir]; modificação do\
    \ valor])\n```\n\nO importante aqui é que acabamos de fazer com o novo comando,\
    \ `for`, é o mesmo que conseguimos fazer com `while`, apenas escrito de maneira\
    \ diferente. Enquanto o `for` precisa que escrevamos as 3 características no meio\
    \ dos parênteses do comando, o `while` apenas pede a condição.\n\n### 5.8 Reescrevendo\
    \ a tabuada com o for\n\nCom isso, como ficaria se escrevéssemos o mesmo programa\
    \ que mostra na tela, mas agora utilizando o `for` aoés do `while`? Para começar,\
    \ vamos lembrar como era o código da tabuada, que utilizava o comando `while`:\n\
    \n```\n1 <script>\n2 var mostra = function(frase) {\n3   document.write(frase\
    \ + \"<br>\");\n4 };\n5 \n6 var multiplicador = 1;\n7 while(multiplicador <= 10)\
    \ {\n8   mostra(7 * multiplicador);\n9   multiplicador = multiplicador + 1;\n\
    10 }\n11 </script>\n```\n\nAgora, podemos criar o arquivo `tabuada_com_for.html`,\
    \ onde vamos criar nosso novo programa que vai fazer exatamente o que o fazia,\
    \ de uma maneira diferente. Sabendo que o `for` precisa primeiro do valor inicial,\
    \ é fácil identificarmos que ele é a variável `multiplicador`, que começa com\
    \ o valor 1.\n\n```\n1 <script>\n2 for(var multiplicador = 1; ;) {\n3 }\n4 </script>\n\
    ```\n\nAgora precisamos preencher as outras informações que o `for` precisa. A\
    \ próxima é até quando as repetições devem continuar, que no caso, é a condição\
    \ que indica que repetições devem ocorrer enquanto `multiplicador` for menor que\
    \ 10.\n\n```\n1 <script>\n2 for(var multiplicador = 1; multiplicador <= 10; )\
    \ {\n3 }\n4 </script>\n```\n\nPronto, só falta dizermos de quanto em quanto o\
    \ `multiplicador` aumentará, que no nosso caso é de 1 em 1. Chamamos isso de incrementar\
    \ a variável. Para isso, estamos fazendo `multiplicador = multiplicador + 1`.\
    \ Sempre que queremos somar 1 àquela variável, temos que repetir o nome da variável,\
    \ indicando que nela queremos atribuir o valor que estava lá mais 1.\n\nNo dia\
    \ a dia, muitos programadores vão preferir fazer isso de uma forma abreviada.\
    \ A sintaxe as regras da linguagem permitem isso. Essa linha pode ser abreviada\
    \ como `multiplicador++`. Os dois sinais de soma ao lado da variável nada mais\
    \ é do que uma maneira abreviada que o `JavaScript` entende e que significa que\
    \ você quer aumentar o valor daquela variável em 1.\n\nVamos usar essa nova forma\
    \ abreviada em nosso programa.\n\n```\n1 <script>\n2 for(var multiplicador = 1;\
    \ multiplicador <= 10; multiplicador++) {\n3 }\n4 </script>\n```\n\nPronto, com\
    \ isso, dissemos que o `multiplicador` vai iniciar em 1, as repetições vão acontecer\
    \ enquanto `multiplicador` for menor que 10 e que a cada repetição, o valor de\
    \ `multiplicador` vai aumentar em 1.\n\nAgora só falta adicionarmos o comportamento\
    \ necessário para mostrar o resultado da tabuada do 7, já que já temos o `multiplicador`\
    \ indo de 1 a 10.\n\n```\n1 <script>\n2 for(var multiplicador = 1; multiplicador\
    \ <= 10; multiplicador++) {\n3   mostra(multiplicador * 7);\n4 }\n5 </script>\n\
    ```\n\nLembre-se de ter a função `mostra` no seu arquivo `tabuada_com_for.html`.\n\
    \n#### Devo while ou for?\n\n**Mas e agora? Qual das duas maneiras devo usar?**\
    \ Resposta simples, a que você preferir e achar mais fácil de entender, pois ambas\
    \ as maneiras, seja com `for`, seja com `while`, fazem exatamente o mesmo trabalho.\
    \ Escolha a que achar mais interessante e continue.\n\n### 5.9 A média de idades,\
    \ mas de uma forma interessante\n\nAgora que entendemos o funcionamento das repetições\
    \ através do `while` e do `for`, podemos partir para problemas mais elaborados.\
    \ Vamos revisitar o cálculo das idades.\n\nAté agora, precisávamos criar uma variável\
    \ para cada idade que gostaríamos de realizar a soma. Então tínhamos:\n\n```\n\
    1 var idadeAdriano = 26;\n2 var idadePaulo = 32;\n3 var idadeSuzana = 25;\n```\n\
    \nSempre que quisermos incluir mais uma pessoa no cálculo da média de idade, precisamos\
    \ criar uma nova variável para ela e incluí-la no cálculo da média:\n\n```\n1\
    \ var idadeAdriano = 26;\n2 var idadePaulo = 32;\n3 var idadeSuzana = 25;\n4 var\
    \ idadeMarcela = 28;\n5 \n6 var media = (idadeAdriano + idadePaulo + idadeSuzana\
    \ + idadeMarcela) / 4;\n7 mostra(media);\n```\n\nOu seja, sempre que quisermos\
    \ desconsiderar uma pessoa ou considerar uma nova pessoa no cálculo da média,\
    \ temos um baita trabalho de modificar esse código. Será que conseguimos fazer\
    \ esse cálculo de média de idades de uma maneira genérica, ou seja, que funcione\
    \ para qualquer quantidade de pessoas?\n\nEsse é um problema um pouco mais sutil\
    \ que os anteriores e vamos resolvê-lo em um arquivo chamado `media_idade_familiares.html`.\
    \ Crie esse novo arquivo.\n\nSe observarmos bem, temos novamente uma característica\
    \ de repetição. Nesse caso, repetimos o processo da criação de uma variável. Queremos\
    \ que esse processo funcione de uma maneira genérica, ou seja, quem estiver usando\
    \ nosso programa vai dizer quantos familiares ele quer colocar no cálculo das\
    \ médias. Podemos pedir essa informação através do `prompt`.\n\n```\n1 <script>\n\
    2 var totalDeFamiliares = prompt(\"Quantos familiares são?\");\n3 </script>\n\
    ```\n"
  raw: "Cada um desses espaços espera uma informação para controlar as repetições\
    \ que acontecerão. Vamos fazer um programa que mostrará 10 alertas, cada um com\
    \ um número de 1 a 10\\. Novamente teremos uma repetição, que agora deve ir de\
    \ 1 até 10\\. Você lembra como faria isso com o `while`? Seria um código como\
    \ o seguinte:\n\n```\n1 var numero = 1\n2 while(numero <= 10) {\n3   alert(numero);\n\
    4   numero = numero + 1;\n5 }\n```\n\nPois bem, podemos fazer praticamente idêntico\
    \ com o `for`:\n\n```\n1 var numero = 1;\n2 for(; numero <= 10; ) {\n3   alert(numero);\n\
    4   numero = numero + 1;\n5 }\n```\n\nPreenchemos o segundo espaço com a condição\
    \ do loop, que será verificada toda vez para saber se mais uma repetição deve\
    \ ocorrer.\n\nQual é a diferença disso para o já conhecido `while`? Dentro do\
    \ `for` apareceram os pontos-e-vírgulas, que tornaram a forma de escrever bastante\
    \ estranha. O resultado final será exatamente o mesmo. Então, para que um outro\
    \ comando de repetição?\n\nCom o `for`, podemos usar o primeiro espaço antes do\
    \ ponto-e-vírgula para realizar inicializações. Um exemplo é inicializar a variável\
    \ `numero`:\n\n```\n1 for(var numero = 1; numero <= 10; ) {\n2   alert(numero);\n\
    3   numero = numero + 1;\n4 }\n```\n\nE agora, o que mudou? Quase nada. Seu código\
    \ ficou mais legível. A parte que diz `var numero = 1` é chamada de inicialização\
    \ do `for`. Ela será executada apenas uma única vez. A próxima etapa é verificar\
    \ se `numero <= 10` e decidir se deve ou não executar uma repetição.\n\nE o que\
    \ podemos fazer no terceiro espaço, logo após o segundo ponto-e-vírgula? O que\
    \ estiver nessa terceira parte será sempre executada. É muito utilizado para executar\
    \ o código que aumenta, que **incrementa** a variável que usamos durante o loop.\
    \ Nesse caso, pra aumentar o valor da nossa variável `numero`. Com isso, podemos\
    \ escrever um comando que imprima de 1 até 10 com esse novo comando da seguinte\
    \ maneira:\n\n```\n1 for(var numero = 1; numero <= 10; numero = numero + 1) {\n\
    2   alert(numero);\n3 }\n```\n\nPortanto, podemos perceber que o `for` possui\
    \ 3 espaços/pedaços: o primeiro, onde dizemos qual é o valor inicial que queremos;\
    \ o segundo para definirmos qual é a condição que determina se as repetições devem\
    \ ser feitas ou não — essa parte é feita da mesma forma que vimos no `while`;\
    \ e o terceiro, que modifica o valor de alguma variável que influa na finalização\
    \ das repetições. As três partes são delimitadas pelo `;`.\n\n```\n1 for([inicialização];\
    \ [condição para repetir]; [modificação do valor])\n```\n\nO importante aqui é\
    \ perceber que o que acabamos de fazer com o novo comando, o `for`, é o mesmo\
    \ que conseguimos fazer com o `while`, apenas escrito de uma maneira diferente.\
    \ Enquanto o `for` precisa que escrevamos as 3 características logo no meio dos\
    \ parênteses do comando, o `while` apenas pede a condição.\n\n### 5.8 Reescrevendo\
    \ a tabuada com o for\n\nCom isso, como ficaria se escrevêssemos o mesmo programa\
    \ que mostra na tela as tabuadas, mas agora utilizando o `for` ao invés do `while`?\n\
    \nPara começar, vamos nos lembrar de como era o código do programa da tabuada,\
    \ que utilizava o comando `while`:\n\n```\n 1 <script>\n 2 var mostra = function(frase)\
    \ {\n 3   document.write(frase + \"<br>\");\n 4 };\n 5 \n 6 var multiplicador\
    \ = 1;\n 7 while(multiplicador <= 10) {\n 8   mostra(7 * multiplicador);\n 9 \
    \  multiplicador = multiplicador + 1;\n10 }\n11 </script>\n```\n\nAgora, podemos\
    \ criar o arquivo `tabuada_com_for.html`, onde vamos criar nosso novo programa\
    \ que vai fazer exatamente o que o anterior fazia, de uma maneira diferente.\n\
    \nSabendo que o `for`, precisa primeiro do valor inicial, é fácil identificarmos\
    \ que ele é a variável `multiplicador`, que começa com o valor 1.\n\n```\n1 <script>\n\
    2 for(var multiplicador = 1; ;) {\n3 }\n4 </script>\n```\n\nAgora precisamos preencher\
    \ as outras duas informações que o `for` precisa. A próxima é até quando as repetições\
    \ devem continuar, que no caso, é a condição que indica que repetições devem ocorrer\
    \ enquanto o multiplicador for menor que 10.\n\n```\n1 <script>\n2 for(var multiplicador\
    \ = 1; multiplicador <= 10; ) {\n3 }\n4 </script>\n```\n\nPronto, só falta dizermos\
    \ de quanto em quanto o `multiplicador` aumentará, que no nosso caso é de 1 em\
    \ 1\\. Chamamos isso de **incrementar** a variável. Para isso, estamos fazendo\
    \ `multiplicador = multiplicador + 1`. Sempre que queremos somar 1 àquela variável,\
    \ temos que repetir o nome da variável, indicando que nela queremos atribuir o\
    \ valor que estava lá mais 1.\n\nNo dia a dia, muitos programadores vão preferir\
    \ fazer isso de uma forma abreviada. A **sintaxe**, as regras da linguagem permitem\
    \ isso. Essa linha pode ser abreviada como `multiplicador++`. Os dois sinais de\
    \ soma ao lado da variável nada mais é é do que uma maneira abreviada que o JavaScript\
    \ entende e que significa que você quer aumentar o valor daquela variável em 1.\n\
    \nVamos usar essa nova forma abreviada em nosso programa.\n\n```\n1 <script>\n\
    2 for(var multiplicador = 1; multiplicador <= 10; multiplicador++) {\n3 }\n4 </script>\n\
    ```\n\nPronto, com isso, dissemos que o `multiplicador` vai iniciar em 1, as repetições\
    \ vão acontecer enquanto `multiplicador` for menor que 10 e que a cada repetição,\
    \ o valor de `multiplicador` vai aumentar em 1.\n\nAgora só falta adicionarmos\
    \ o comportamento necessário para mostrar o resultado da tabuada do 7, já que\
    \ já temos o `multiplicador` indo de 1 a 10.\n\n```\n1 <script>\n2 for(var multiplicador\
    \ = 1; multiplicador <= 10; multiplicador++) {\n3   mostra(multiplicador * 7);\n\
    4 }\n5 </script>\n```\n\nLembre-se de ter a função `mostra` no seu arquivo `tabuada_com_for.html`.\
    \ Quando você abrir esse arquivo em um navegador, o resultado será exatamente\
    \ igual ao que tínhamos antes com o `while`.\n\n#### Devo usar o while ou o for?\n\
    \n**Mas e agora? Qual das duas maneiras devo usar?** Resposta simples, a que você\
    \ preferir e achar mais simples de escrever, pois ambas as maneiras, seja com\
    \ o `for`, seja com o `while`, fazem exatamente o mesmo trabalho. Escolha a forma\
    \ que você achar mais interessante e fácil de entender e continue com ela. Para\
    \ a sequência do livro, vamos realizar as repetições de acordo com o caso.\n\n\
    ### 5.9 A média de idades, mas de uma forma mais interessante\n\nAgora que entendemos\
    \ o funcionando das repetições através do `while` e do `for`, podemos partir para\
    \ problemas mais elaborados. Vamos revisitar o cálculo das médias de idades.\n\
    \nAté agora, precisávamos criar uma variável para cada idade que gostaríamos de\
    \ realizar a soma. Então tínhamos:\n\n```\n1 var idadeAdriano = 26;\n2 var idadePaulo\
    \ = 32;\n3 var idadeSuzana = 25;\n```\n\nSempre que quisermos incluir mais uma\
    \ pessoa no cálculo da média de idade, precisamos criar uma nova variável para\
    \ ela e incluí-la no cálculo da média:\n\n```\n1 var idadeAdriano = 26;\n2 var\
    \ idadePaulo = 32;\n3 var idadeSuzana = 25;\n4 var idadeMarcela = 28;\n5 \n6 var\
    \ media = (idadeAdriano + idadePaulo + idadeSuzana + idadeMarcela) / 4;\n7 mostra(media);\n\
    ```\n\nOu seja, sempre que quisermos desconsiderar uma pessoa ou considerar uma\
    \ nova pessoa no cálculo da média de idades, temos um baita trabalho de modificar\
    \ esse código. Será que conseguimos fazer esse cálculo de média de idades de uma\
    \ maneira genérica, ou seja, que funcione para qualquer quantidade de pessoas?\n\
    \nEsse é um problema um pouco mais sútil que os anteriores e vamos resolvê-lo\
    \ em um arquivo chamado `media_idade_familiares.html`. Crie esse novo arquivo.\n\
    \nSe observarmos bem, temos novamente uma característica de repetição. Nesse caso,\
    \ repetimos o processo da criação de uma variável. Queremos que esse processo\
    \ funcione de uma maneira genérica, ou seja, quem estiver usando nosso programa\
    \ vai dizer quantos familiares ele quer colocar no cálculo das médias. Podemos\
    \ pedir essa informação através do `prompt`.\n\n```\n1 <script>\n2 var totalDeFamiliares\
    \ = prompt(\"Quantos familiares são?\");\n3 </script>\n```"
