  md: '# PhantomJS


    PhantomJS is a headless version of WebKit, the rendering engine that powers Safari
    and Chrome. As such, it acts very similarly to these browsers (though not exactly
    the same) and allows you to perform true testing without actually opening a browser.
    PhantomJS comes with scripts to run tests in two different JavaScript testing
    frameworks: Jasmine and QUnit.


    PhantomJS isn''t just a browser—it''s a scripting environment for that browser.
    The scripts to run Jasmine and QUnit are part of a suite of scripts that ships
    with PhantomJS. Both scripts require you to use the appropriate HTML page template
    for the framework being.


    # Installation and Usage


    If you''re Ubuntu, then you can install via apt-get using:


    ```

    $ sudo add-apt-repository ppa:jerome-etienne/neoip

    $ sudo apt-get update

    $ sudo apt-get install phantomjs

    ```


    If you''re Homebrew on Mac OS X, you can also install PhantomJS via the following
    command:


    ```

    brew install phantomjs

    ```


    For other platforms, download the latest executable for your platform from http://code.google.com/p/phantomjs/downloads/list.
    Place the entire PhantomJS directory in an easily accessible location (your dependencies
    directory or somewhere else). The scripts to run Jasmine and QUnit tests are in
    the examples directory.


    ![](img/b5952fb0eafff982c42c2013b569fa4e_189_0.png)


    If you installed using Homebrew or apt-get, then you''ll need to download the
    files to run Jasmine and QUnit tests from the PhantomJS repository, as these are
    not included by default.


    PhantomJS runs Jasmine and QUnit tests in the following format:


    ```

    phantomjs [driver] [HTML file]

    ```


    For example, to run QUnit:


    ```

    phantomjs examples/run-junit.js tests.html

    ```


    And to run Jasmine:


    ```

    phantomjs examples/run-jasmine.js tests.html

    ```


    The results are output onto the command line.'
  merge: -1
  pgno: 189
- img_proc: true
  md: "# The Ant Target\n\nAs with Yeti, the Ant target for PhantomJS is quite simple.\
    \ There are just a few properties to keep track of:\n\n```\nsrc.dir = ./src\n\
    lib.dir = ./Lib\ntests.dir = ./tests\n\nphantomjs = ${phantomjs}\nphantomjs.driver\
    \ = ${lib.dir}/phantomjs/examples/run-unit.js\nphantomjs.tests = ${tests}.html\n\
    ```\n\nBecause the PhantomJS runners support passing only one file at a time,\
    \ the Ant target uses <exec> instead of <apply>:\n\n```\n<target name=\"test\"\
    >\n  <exec executable=\"phantomjs\" failonerror=\"true\">\n    <arg path=\"${phantomjs.driver}\"\
    >\n    <arg path=\"${tests.dir}/${phantomjs.tests}\"/>\n  </exec>\n</target>\n\
    ```\n\nThe test just passes two paths to the executable and fails if there's an\
    \ error.\nThe Buildr <phantomjs> task allows you to perform the same operation\
    \ with a slightly different syntax:\n\n```\n<target name=\"test\">\n  <phantomjs\
    \ driver=\"${phantomjs.driver}\">\n    <fileset dir=\"${tests.dir}\" includes=\"\
    *.html\" />\n  </phantomjs>\n</target>\n```\n\nThe driver attribute is required\
    \ and specifies the PhantomJS driver to use for your tests. The <phantomjs> expects\
    \ one or more <fileset> elements to be present specifying the tests to run. Otherwise,\
    \ it behaves like the previous target.\n\n# JsTestDriver\n\nJsTestDriver is a\
    \ command-line utility written by engineers at Google. Similar to Selenium and\
    \ Yeti, JsTestDriver works with already installed browsers to run tests. JsTestDriver\
    \ has its own JavaScript testing framework as well, so you must write tests using\
    \ that library by default. It is a QUnit adapter to allow QUnit-based tests to\
    \ be executed with JsTestDriver, and it's possible to write your own adapter if\
    \ you so choose."
  merge: -1
  pgno: 190
- img_proc: true
  md: "# Installation and Usage\n\nJsTestDriver is written in Java, so you must first\
    \ download the latest JAR file and put it into your dependencies directory. JsTestDriver's\
    \ most common mode is to run on a developer machine by manually connecting browsers\
    \ to the JsTestDriver server. Configuration information, including which files\
    \ to execute as, are included in a YAML file that looks like this:\n\nserver:\
    \ http://localhost:4224\n\n+   load:\n- tests/*.js\n\nThe first line indicates\
    \ where the JsTestDriver server should be set up and the load section indicates\
    \ where JavaScript files to load for testing.\n\nFor a build system, JsTestDriver\
    \ offers a command that automatically starts and stops browsers while collecting\
    \ test results. The format is as follows:\n\n```\njava -jar JsTestDriver.jar --port\
    \ [port] --browser [browsers] --config [file]\n--tests all --output [directory]\n\
    ```\n\nFor example:\n\n```\njava -jar JsTestDriver.jar --port 4224 --browser firefox,iexplore\n\
    --config conf/conf.yml --tests all --output /results\n```\n\nThis command runs\
    \ all tests specified in conf/conf.yml on Firefox and Internet Explorer and outputs\
    \ the results in results. The --browser option requires the path to the browser\
    \ executable, this example assumes that firefox and ieplore are executable with\
    \ a full path.\n\n# The Ant Target\n\nCreating a target for JsTestDriver requires\
    \ keeping track of a few key pieces of information:\n\n```\nsrc.dir = ./src\n\
    lib.dir = ./lib\ntests.dir = ./tests\n```\n\n```\njstdriver = $(lib.dir)/JsTestDriver.jar\n\
    jstestdriver.port = 4224\njstestdriver.browser = firefox,iexplore\njstestdriver.config\
    \ = conf/conf.yml\njstestdriver.output = /results\n```\n\nThe Ant target looks\
    \ very similar to the one for YUI Selenium Driver:\n\n```\n<target name=\"test\"\
    >\n  <exec executable=\"java\" failonerror=\"true\">\n    <arg line=\"-jar\"/>\n\
    \    <arg path=\"${jstdriver}\"/>\n  </exec>\n</target>\n```"
  merge: -1
