  md: '# CHAPTER 15

    Validation


    Because JavaScript isn''t compiled before being deployed, web developers don''t
    have the extra compilation step to identify errors. JavaScript code validators
    partly fill the void by performing static analysis on your JavaScript code. You
    were introduced to JSLint and JSHint earlier in this book. In this chapter, you''ll
    learn how to incorporate third parties have written your build system to automatically
    analyze and verify your JavaScript code.


    ![](img/b5952fb0eafff982c42c2013b569fa4e_156_0.png)


    JSHint is used in this chapter, as it comes with a prebuilt command-line file
    suitable for running with Rhino. JSLint, as of the time of this writing, doesn''t
    have a prebuilt command-line file, though some third have written utilities including
    command-line controls for JSLint.


    # Finding Files


    The first step in validating files is to locate the files. There are two different
    tasks for this purpose: `<fileset>` and `<filelist>`. The `<files>` task is used
    when you want to include a large number of files based on a pattern. Specify the
    dir attribute as the directory to look in and then includes with a filename pattern,
    such as:


    ```

    <fileset dir="src" includes="**/*.js />

    ```


    This fileset includes all JavaScript files contained in the src directory. You
    can optionally specify some patterns to exclude as well:


    ```

    <fileset dir="src" includes="**/*.js" excludes="**-test.js />

    ```


    This includes includes all JavaScript files except the ones that end with -test.js.
    This is a common practice for excluding unit test files that are contained in
    the same directories as the source files.


    The <filelist> task works similarly except that you must explicitly list the files
    to include. This task is best when you want to retrieve references to a specific
    set of'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'files. The <fileset> element expects a `dir` for the directory. The `files`
    attribute contains a comma-separated list of files. For example:


    ```

    <filelist dir="./src" files="core.js" />

    ```


    In practice, you will end up using <fileset> more frequently than <filelist>,
    as it''s far more likely that you will be dealing with large groups of files rather
    than specific, named files.


    # The Task


    The <apply> task is to execute command-line utilities on a collection of files
    from an Ant target. JSHint is written in JavaScript, you''ll need to use the Rhino
    command-line JavaScript engine to execute it. Download the Rhino release from
    http://www.mozilla.org/rhino and place the `js.jar` file in your dependencies
    folder (lib.dir).


    To run JSHint on the command line, type the following:


    ```

    java -jar js.jar jshint.js [options] [list of files]

    ```


    For example:


    ```

    java -jar js.jar jshint.js curly=true,noempty-true core/core.js

    ```


    The <apply> task allows you to recreate command-line entries using the <arg> element.
    There are two ways to use <arg>: by specifying the path attribute for file or
    directory references, or by specifying the line attribute for plain text. You
    can break down the command-line format into the following pieces:


    ```

    java

    -jar

    ```


    +   The program to execute, specified by the executable attribute of <apply>

    for java, represented by the line attribute of <arg>\jshint.js

    The main JSHint file, represented by the path attribute of <arg>

    curly=true,noempty-true

    The options, represented by the line attribute of <arg>

    core/core.js

    The file to validate, represented by the path attribute of <arg>


    Given that, you will <validate> to create an Ant skeleton for this utility:


    ```

    <target name="validate">

    <apply executable="Java">

    <arg line="-jar/"

    <arg path="js.jar" />

    <arg path="jshint.js" />

    <arg

    line="curly=true,forin=true,latedef=true,noempty=true,undef=true,rhino=false"
    />

    </apply>

    </target>

    ```'
