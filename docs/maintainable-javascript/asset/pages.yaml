    \ setters. For example, attr(\"body\") returns the value of the class attribute,\
    \ and attr(\"body\").attr(\"class\", \"selected\") sets the value of the class\
    \ attribute. Despite this, I still recommend using for function names.\n\n# Constants\n\
    \nJavaScript had no formal concept of constants prior to ECMAScript. However,\
    \ that didn't stop developers from defining variables to be constants. To differentiate\
    \ normal variables (variables that may have changing values) and constants (variables\
    \ that are initialized to a value and never change), a common naming convention\
    \ evolved. The convention comes from C and uses all uppercase letters with underscores\
    \ separators as in:\n\n```\nvar MAX_COUNT = 10;\nvar URL = \"http://www.nczonline.net/\"\
    ;\n```\n\nKeep in mind that these are variables using a different naming convention,\
    \ so it's still possible to overwrite them. Normal variables and constants are\
    \ easily differentiated by using this very different convention. Consider the\
    \ following example:\n\n```\nif (count < MAX_COUNT) {\n  doSomething();\n}\n```\n\
    \nIn this code, it's easy to tell that count is a variable that may change and\
    \ MAX_COUNT is a variable that is intended to never change. This adds another\
    \ level of semantics to the underlying code.\n\nThe Google JavaScript Style Guide,\
    \ the SproutCore Style Guide, and the Dojo Style Guide specify that constants\
    \ should be formatted in this manner (the Dojo Style Guide also allows constants\
    \ to be specified as Pascal case; see the section).\n\n# Constructors\n\nJavaScript\
    \ constructors are simply functions that are used to create objects via the new\
    \ operator. The language contains many built-in constructors, such as Object and\
    \ RegExp, developers can add their own constructors to create new types. With"
