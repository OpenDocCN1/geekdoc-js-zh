  md: "# CHAPTER 6\n\n# Avoid Globals\n\nThe JavaScript execution environment is unique\
    \ in a lot of ways. One of ways is in the use of global variables and functions.\
    \ The default JavaScript execution environment is, in fact, defined by the various\
    \ globals available to you at the start of script execution. All of these are\
    \ said to be defined on the global object, a mysterious object that represents\
    \ the outermost context for a script.\n\nIn browsers, the window object is typically\
    \ overloaded to also be the global object, so any variable or function declared\
    \ in the global scope becomes a property of the window object. For example:\n\n\
    ```\nvar color = \"red\"\n\nfunction say() {\n  alert(color);\n}\n\nconsole.log(window.color);\
    \ // \"red\"\nconsole.log(typeof window.sayColor); // \"function\"\n```\n\nIn\
    \ this code, the global variable color and the global function sayColor are defined.\
    \ Both are added to be the window object as properties even though they weren't\
    \ explicitly set to do so.\n\n# The Problems with Globals\n\nCreating globals\
    \ is considered a bad practice in general and is specifically problematic in a\
    \ team development environment. Globals create a number of nontrivial maintenance\
    \ issues for code going forward. The more globals, the greater the possibility\
    \ that errors will be introduced due to the increasing likelihood of a few common\
    \ problems."
  merge: -1
  pgno: 84
- img_proc: true
  md: "# Naming Collisions\n\nThe potential for naming collisions increases as the\
    \ number of global variables and functions increase in a script, as the chances\
    \ that you'll use an already declared variable accidentally. The easiest code\
    \ to maintain is code in which all of its variables are defined locally.\n\nFor\
    \ instance, consider the sayColor() function from the previous example. This function\
    \ relies on the global variable color to function correctly. If sayColor() were\
    \ defined in a separate file from color, it would be hard to track down:\n\n```\n\
    function sayColor() {\n  alert(color); // Bad: where did this come from?\n}\n\
    ```\n\nFurther, if color ends up defined in more than one place, the result of\
    \ say Color() could be different depending on how this function is used with the\
    \ other code.\n\nThe global environment is native JavaScript objects are defined,\
    \ and by adding your own names into that scope, you run the risk of picking a\
    \ name that might be provided natively by the browser on. The name color, for\
    \ example, is definitely not a safe global variable name. It's a plain noun without\
    \ any qualifiers, the chances of collision with an upcoming native API, or another\
    \ developer's work, is quite high.\n\n# Code Fragility\n\nA function that depends\
    \ on globals is tightly coupled to the environment. If the environment changes,\
    \ the function is likely to break. In the previous example, the say Color() method\
    \ will throw an error if the global color variable no longer exists. That means\
    \ any change to the global environment is capable of causing errors throughout\
    \ the code. Also, globals can be changed at any point by any function, making\
    \ the reliability of their values highly suspect. The function from the previous\
    \ example is much more maintainable if color is passed in an argument:\n\n```\n\
    function sayColor(color) {\n  alert(color);\n}\n```\n\nThis version of the function\
    \ has no global dependencies and thus won't be affected by changes to the global\
    \ environment. Because color is now a named argument, all that matters is a valid\
    \ value is passed into the function. Other changes will not affect this function's\
    \ ability to complete its task.\n\nWhen defining functions, it's best to have\
    \ much data as possible local to the function. Anything that be defined within\
    \ the function should be written as such; any data that comes from outside the\
    \ function should be passed in an argument. Doing isolates the function from the\
    \ surrounding environment and allows you to make changes to either without affecting\
    \ the other."
  merge: -1
  pgno: 85
