  md: "```\nvar error = new Error(\"Something had happened.\");\n\nconsole.log(error\
    \ instanceof Error); // true\nconsole.log(error instanceof MyError); // true\n\
    ```\n\nType-based inheritance is best used with developer-defined constructor\
    \ functions than those found natively in JavaScript. Also, type-based inheritance\
    \ typically requires two steps: prototypal inheritance and constructor inheritance.\
    \ Constructor inheritance is when the super constructor is called with a this-value\
    \ of the newly created object. For example:\n\n```\nfunction Person(name) {\n\
    \  this.name;\n}\n\nfunction Author(name) {\n  Person.call(this, name); // inherit\
    \ constructor\n}\n\nAuthor.prototype = new Person();\n```\n\nIn this code, the\
    \ Author inherits from Person. The property name is actually managed by the type,\
    \ so Person.call(this, name) allows the Person constructor to define that property.\
    \ The Person constructor runs on this, which is the new Author object. So name\
    \ ends up being defined on the new Author object.\n\nWith object-based inheritance,\
    \ type-based inheritance allows flexibility in how you create objects. Defining\
    \ a type allows you to have multiple instances of the same object, all of which\
    \ inherit from a common super type. Your new type should define exactly the properties\
    \ and methods you want to use, and those can be completely different from the\
    \ super type.\n\n# The Facade Pattern\n\nThe facade is a popular design pattern\
    \ that creates a new interface for an existing object. A facade is a new object\
    \ that works with an existing object behind the scenes. The facades are sometimes\
    \ called wrappers, because they wrap an existing object with a different interface.\
    \ If inheritance doesn't work for your use case, then creating a facade is the\
    \ next step.\n\nBoth jQuery and YUI use facades for the DOM interfaces. As mentioned\
    \ previously, you can't inherit from DOM objects, so the only option for safely\
    \ adding new functionality is to create a facade. Here's an example DOM object\
    \ wrapper:\n\n```\nfunction DOMWrapper(element) {\n  this.element = element;\n\
    }\n\nDOMWrapper.prototype.addClass = function(className) {\n  element.className\
    \ += \" \" + className;\n};\n```"
