  md: "# Difficulty Testing\n\nI tried to implement some testing on one of my first\
    \ large-scale web applications. I had joined the team after most of the core framework\
    \ had been built and was trying to get a better understanding of how everything\
    \ worked in order to create tests. I was dismayed to discover that creating tests\
    \ was going to be an extremely difficult process because the entire framework\
    \ relied on the presence of several global variables to work properly.\n\nAny\
    \ function that relies on global variables requires you to recreate the entire\
    \ global environment to test that function. Effectively, this means that you are\
    \ not just managing changes in one global environment, you're managing them in\
    \ two global environments: production and testing. And add to the cost of keeping\
    \ those in sync, and you've got the beginnings of a maintenance nightmare that\
    \ isn't easily untangled.\n\nEnsuring that your functions do not rely on globals\
    \ improves the testability of your code. Of course, your function may rely on\
    \ globals that are native to JavaScript, such as Date, Array. Your functions can\
    \ always assume that globals will be present. However, do not allow your functions\
    \ to become dependent on global variables that you've introduced to ensure optimal\
    \ test.\n\n# Accidental Globals\n\nOne of the most insidious parts of JavaScript\
    \ is its capacity for creating globals accidentally. When you assign a value to\
    \ a variable that has not previously been defined in a statement, JavaScript()\
    \ automatically creates a global variable. For example:\n\n```\nfunction something()\
    \ {\n  var count = 10;\n  title = \"Maintainable JavaScript\"; // Bad: global\n\
    }\n```\n\nThis code represents a very common error that accidentally introduces\
    \ a global variable. The author probably wanted to declare two variables using\
    \ a single var statement but accidentally included a semicolon after the first\
    \ variable instead of, comma. The result is that title is a global variable.\n\
    \nThe problem is compounded when you're trying to create a local variable with\
    \ the same name as a global variable. For example, a global variable named count\
    \ would be shadowed by the local count in the previous example. The function then\
    \ has access only to the local count unless explicitly accessing the global using\
    \ window.count. This arrangement is okay.\n\nOmitting the var statement accidentally\
    \ might mean that you're changing the value of an existing global variable without\
    \ knowing it. Consider the following:"
  merge: -1
  pgno: 86
- img_proc: true
  md: "```\nfunction doSomething() {\n  var count = 10;\n  name = \"Nicholas\"; //\
    \ Bad: global\n}\n```\n\nIn this example, the error is even more egregious because\
    \ name is actually a property of window by default. The window.name property is\
    \ most frequently used with frames or iframes, and when links are targeted to\
    \ show up in frames or tabs when clicked, changing name inadvertently could affect\
    \ how links navigate in the site.\n\nA good rule of thumb is to always use var\
    \ to define variables, even if they are global. This way is a lot less error prone\
    \ than omitting the var in certain situations.\n\n# Avoiding Accidental Globals\n\
    \nJavaScript won't warn when you've accidentally created a global variable by\
    \ default. That's when tools like JLint and JSHint will warn you if you assign\
    \ a value to a previously undeclared variable. For example:\n\n```\nfoo = 10;\n\
    ```\n\nBoth JLint and JSHint will issue the warning \"foo is not defined\" to\
    \ let you know that variable foo was never declared using a statement.\n\nJLint\
    \ and JSHint are also smart enough to notice that you're accidentally changing\
    \ the value of certain globals. In the example that overwrites the value of name,\
    \ JLint and JSHint warn that the variable is read-only. In fact, the variable\
    \ isn't read-only; it should be treated as such, because changing a native global\
    \ almost leads to errors. The same warning is issued if you try to assign other\
    \ globals such as window and document.\n\nStrict mode, which changes some of the\
    \ rules for parsing and executing JavaScript, offers a solution to this problem.\
    \ By adding \"use strict\" to the top of a function, you instruct the JavaScript\
    \ engine to apply more rigorous error handling and syntax checking before executing\
    \ the code. One of these changes is the ability to detect assignment to undeclared\
    \ variables. When this happens, the JavaScript engine throws an error For example:\n\
    \n```\n\"use strict\"\nfoo = 10;\n```\n\nIf you try to code in an environment\
    \ supporting strict mode (Internet Explorer 10+, Firefox 4+, Safari 5.1+, Opera\
    \ 12+, or Chrome), the second will throw a ReferenceError with a message of \"\
    foo is not defined.\"\n\nTurning on strict mode changes a lot of JavaScript behavior,\
    \ so use carefully if you're working with older code. For newer code, it's best\
    \ to always use var to avoid accidental globals as other common programming errors\
    \ that strict mode catches."
  merge: -1
