- img_proc: true
  md: "```\n// detect an Error\nif (value instanceof Error) {\n  throw value;\n}\n\
    ```\n\nAn interesting feature of instanceof is that it not only checks the constructor\
    \ used to create the object but also the prototype chain. The prototype chain\
    \ contains information about the inheritance pattern used to define the object.\
    \ For instance, every object inherits from Object by default, so every object\
    \ returns true for value instanceof Object. For example:\n\n```\nvar now = new\
    \ Date();\n\nconsole.log(now instanceof Object); // true\nconsole.log(now instanceof\
    \ Date); // true\n```\n\nDue to this behavior, it's typically not good enough\
    \ to use value instanceof Object when you're expecting a particular type of object.\n\
    \nThe instanceof operator also works with custom types that you've defined for\
    \ yourself. For instance:\n\n```\nfunction Person(name) {\n  this.name = name;\n\
    }\n```\n\nvar me = new Person(\"Nicholas\");\n\n```\nconsole.log(me instanceof\
    \ Object); // true\nconsole.log(me instanceof Person); // true\n```\n\nThis creates\
    \ a custom Person type. The variable is an instance of Person, so instanceof Person\
    \ is true. As mentioned previously, all objects are also considered instances\
    \ of Object, so me instanceof Object is also true.\n\nThe instanceof operator\
    \ is the only way to detect custom types in JavaScript. It's also good to use\
    \ for almost all built-in JavaScript types. There is, however, serious limitation.\n\
    \nSuppose that an object from one frame (frame A) is passed into another frame\
    \ (frame B). Both frames have the constructor function Person defined. If the\
    \ object from frame A is an instance of Person in frame A, the following rules\
    \ apply:\n\n```\n// true\nframeAPersonInstance instanceof frameAPerson\n\n// false\n\
    framePersonInstance instanceof frameBPerson\n```\n\nBecause each frame has its\
    \ own copy of Person, it is considered an instance of only that frame's copy of\
    \ Person, even though the two definitions may be identical."
  merge: -1
