  md: '# Build


    ![](img/b5952fb0eafff982c42c2013b569fa4e_200_0.png)


    Figure 20-2. Adding an Ant build step


    ![](img/b5952fb0eafff982c42c2013b569fa4e_200_1.png)


    Figure 20-3. Specifying an Ant target


    After that, you can specify to send an email when the build fails. Jenkins allows
    you to specify the email address that should always be used for this notification,
    as well as sending emails to the committee who broke the build (using source control
    to retrieve the email address). It''s a good idea to always send an email when
    the build didn''t succeed (Figure 20-4).


    Once you''re done setting up email notifications, click “Save” at the bottom of
    the page to save the build job. Your build job will now execute once an hour;
    however, you can manually run the build at any time by going to Jenkins and clicking
    the “Build Now” link.


    This is just a brief introduction to Jenkins and the power of continuous integration.
    There are many, many more things you can do with Jenkins, such as tracking the
    results of unit tests, publishing build logs, setting up dependent builds, and
    more. The Jenkins website is a great resource for learning more about the various
    options available.'
