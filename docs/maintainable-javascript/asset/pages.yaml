  md: "# Putting It Together\n\nThe preceding chapters about the build system focused\
    \ on creating small pieces of a build system, creating a library of utilities\
    \ that could easily be put together later. This chapter focuses on assembling\
    \ the system into an end-to-end solution for your JavaScript. For your final system,\
    \ you may have more complex functionality and may choose to use a bundled set\
    \ of tasks such as Buildr, but there are still some common pieces of functionality\
    \ that all build systems have.\n\n# Missing Pieces\n\nBefore putting together\
    \ the build system, there are a couple of small steps that are missing. The first\
    \ is the creation of the *build* directory. As this directory is transient (and\
    \ won't be checked in), the build system is responsible for its creation. The\
    \ `<mkdir>` Ant task handles this easily:\n\n```\n<target name=\"init\">\n  <mkdir\
    \ dir=\"${build.dir}\">\n</target>\n```\n\nThe *init* target does just one thing:\
    \ create the build directory so all the built files have a place to put them.\
    \ It's possible that other tasks, such as `<concat>`, may end making this directory\
    \ if it doesn't already exist. However, it's best to explicitly state each step\
    \ of the build process to ensure reordering of tasks or targets doesn't cause\
    \ errors.\n\nThe second piece is the cleanup of the *build* directory. In between\
    \ builds, you want to remove all files and start from scratch. The fastest way\
    \ to do that is simply to delete the *build* directory using the `<delete>` task:\n\
    \n```\n<target name=\"clean\">\n  <delete dir=\"${build.dir}\">\n</target>\n```\n\
    \nThe *clean* target removes the *build* directory so you're certain to get the\
    \ latest files."
  merge: -1
  pgno: 194
- img_proc: true
  md: "# Planning the Build\n\nTo put the system build pieces together in the correct\
    \ order, it helps to think about your development process and the different build\
    \ types you'll need. It's very rare for a project to have a single build type\
    \ and much more common for there to be at least three:\n\n# Development\n\nDevelopment\
    \ build is run by developers as they are working. This build should be as fast\
    \ as possible so as not to interrupt developer productivity. Generally speaking,\
    \ you want to prevent accidental errors and get the code into good testing shape\
    \ that developers can load into the browser for hands-on testing. This build should\
    \ take no more than 15 seconds, so you need to choose what you're doing carefully.\
    \ If you're working on a web application, you may want to have a separate JavaScript\
    \ development build that can run independently of the overall build. This is also\
    \ typically the default build.\n\n# Integration\n\nAn automated build is run on\
    \ a regular schedule. These are sometimes run for each commit, but on large projects,\
    \ they tend to run on intervals for a few minutes. The integration build is responsible\
    \ for finding problems in the system. Because it's automated, this build can take\
    \ longer to complete but must be as thorough as possible. In some cases, the integration\
    \ build is the last line of defense before pushing changes to production.\n\n\
    # Release\n\nAn on-demand build is run only prior to a production push. This build's\
    \ job is mostly to get the code into its final form so that it can be deployed.\
    \ In theory, if the integration build did its job, then the release build shouldn't\
    \ have errors. In practice, that's not always the case. The release build may\
    \ be responsible for a few more tasks that could also cause errors before deployment.\n\
    \nOf course, your project have many more build types depending on your development\
    \ process.\n\nYour build.xml should always start out like this:\n\n```\n<project\
    \ name=\"yourapp\" default=\"build.dev\">\n<!-- import properties --\n<loadproperties\
    \ src=\"yourapp.properties\" />\n<!-- define or import utility targets here --\n\
    <!-- initialization and cleanup --\n<target name=\"init\">\n  <mkdir dir=\"${build.dir}\"\
    />\n</target>\n</project>\n```"
  merge: -1
  pgno: 195
