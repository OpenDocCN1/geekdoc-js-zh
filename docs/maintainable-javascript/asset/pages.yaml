    WebKit 422 and higher will be incorrectly reported as WebKit 422.

    - There is no check for Opera, so either Opera will be incorrectly reported as
    one of the other browsers, or it won''t be detected at all.

    - This code will need to be updated when a new browser is released.


    The number of issues with the browser inference is quite daunting, especially
    the last. For every browser release, MooTools would have to update this code and
    get it out to all users quickly to avoid code breaking. That''s just not maintainable
    in the long run.


    To understand why browser inference doesn''t work, you need only look back to
    high school class, in which logic statements are typically taught. Logic statements
    are made up of a hypothesis (p) and a conclusion (q) in the form "if p, then q."
    You can try altering the statement form to determine truths. There are three ways
    to alter the statement:


    +   - Converse: if q, then p

    - Inverse: if not p, then not q

    - Contrapositive: if not q, then not p


    There are two important relationships between the various forms of the statement.
    If the original statement is true, then the contrapositive is also true. For example,
    if the original statement was "If it''s a car, then it has wheels" (which is true)
    then the contrapositive, "if it doesn''t have wheels, then it''s not a car," is
    also true.


    The second relationship between the converse and the inverse, if one is true,
    then the other must also be true. This makes sense logically, because the relationship
    between converse and inverse is the same as original and contrapositive.


    Perhaps important than these relationships are the relationships that don''t exist.
    If the original statement is true, then there is no guarantee that the converse
    is true. This is feature-based browser detection falls apart. Consider this statement:
    "If it''s Internet Explorer, document.all is implemented." The contrapositive,
    "If document.all is not implemented, then it''s not Internet Explorer," is also
    true. The converse, "If document.all is implemented, then it''s Internet Explorer,"
    is not strictly'
