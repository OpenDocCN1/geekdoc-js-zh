  md: "development progresses, due to architectural decisions. The third is the CSS\
    \ class name \"selected.\" This class name is used three times, meaning that a\
    \ class name change requires changes in three different places, increasing the\
    \ likelihood that one will be missed.\n\nThese are all considered configuration\
    \ data, because they are hardcoded values that may change in the future. The following\
    \ are all examples of configuration data:\n\n+   - URLs\n- Strings that are displayed\
    \ in the UI\n- Repeated unique values\n- Settings (i.e., items per page)\n- Any\
    \ value that may change\n\nThe key point to remember about configuration data\
    \ is that it changes, and you don't want to be modifying your JavaScript source\
    \ code because someone changed his mind about a message to display on the home\
    \ page.\n\n# Externalizing Configuration Data\n\nThe first step in separating\
    \ configuration data from code is to externalize the configuration data, which\
    \ means getting the data out of the middle of your JavaScript code. Here's the\
    \ previous example with the configuration externalized:\n\n```\n// Configuration\
