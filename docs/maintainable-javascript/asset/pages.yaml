    Anonymous\");\n};\n```\n\n```\nmyPerson.sayName(); // pops up \"Anonymous\"\n\
    person.sayName(); // pops up \"Nicholas\"\n```\n\nThe Object.create method allows\
    \ you to specify a second argument, which is an object containing additional properties\
    \ and methods to add to the new object. For example:\n\n```\nvar myPerson = Object.create(person,\
    \ {\n  name: {\n    value: \"Greg\"\n  }\n});\n```\n\n```\nmyPerson.sayName();\
    \ // pops up \"Greg\"\nperson.sayName(); // pops up \"Nicholas\"\n```\n\nIn this\
    \ example, myPerson is created with its own value for name, so calling sayName()\
    \ displays \"Greg\" instead of \"Nicholas\".\n\nOnce a object is created in this\
    \ manner, you are completely free to modify the new object in whatever manner\
    \ you see fit. After all, you are the owner of the new object, so you are free\
    \ to add new methods, override existing methods, and remove methods (or rather\
    \ prevent access to them) on your new object.\n\n# Type-Based Inheritance\n\n\
    Type-based inheritance works in a similar manner to object-based inheritance,\
    \ in that it relies on the prototype to inherit from an existing object. However,\
    \ type-based inheritance works with constructor functions instead of objects,\
    \ which means you need access to the constructor function of the object you want\
    \ to inherit from. You saw an example of type-based inheritance earlier in this\
    \ book:\n\n```\nfunction MyError(message) {\n  this.message = message;\n}\n```\n\
    \n```\nMyError.prototype = new Error();\n```\n\nIn this example, the MyError inherits\
    \ from Error, which is called the super type. It does so by assigning a new instance\
    \ of Error to MyError.prototype. After that, every instance of MyError inherits\
    \ its properties and methods from Error as well as now working with instanceof:"
