  md: '```

    <target name="clean">

    <delete dir="${build.dir}"/>

    </target>


    <!-- main builds -->

    <target name="build.dev">

    </target>


    <target name="build.int">

    </target>


    <target name="build.release">

    </target>

    ```


    ```

    </project>

    ```


    Make sure to begin by importing the properties file(s) to get all of the data
    needed for the targets. Then, either include or import the utility targets such
    as those created in the preceding build system chapters. Sometimes it helps to
    keep the utility targets in one or more separate XML files, but ultimately it''s
    up to you. After, the init and clean targets round out the utility targets. The
    final section contains targets for each build type.


    # The Development Build


    The development build is important to get correct because it affects every developer''s
    workflow. Generally speaking, the goal of the development build is to get the
    code into the development environment as quickly as possible while performing
    some checks. Most development builds do two things: validate the code and concatenate
    the files. Because developers need the full source code for debugging, there is
    no point in minifying code at this point. Here is how the build.dev target looks:


    ```

    <project name="yourapp" default="build.dev">


    <!-- omitted builds -->

    <target name="build.dev" depends="clean,init,validate,concatenate">

    </target>


    </project>

    ```


    All of the primary build targets should look like this, as they are typing together
    other targets in a particular order. The build.dev target specifies that it depends
    on the clean, init, validate, and concatenate targets to work. Running ant build.dev
    runs those four targets and you''re doing nothing. As mentioned earlier, you should
    always ensure that you''re starting with freshly built files, so be sure to remove
    old files first. Because the concatenate target also places the built files into
    the correct directory, the build.dev target is complete and should result in all
    the code being ready for use.'
  merge: -1
