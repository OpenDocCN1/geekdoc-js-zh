    \ know, think about how they might incorrectly use the function and throw errors\
    \ in those cases.\n\nRemember the goal isn't to prevent errors—it's to make errors\
    \ easier to debug when they occur.\n\n# The try-catch Statement\n\nJavaScript\
    \ provides a try-catch statement that is capable of intercepting errors before\
    \ they are handled by the browser. The code that might cause an error in the try\
    \ block and catch handles the error in the catch block. For instance:\n\n```\n\
    try {\n  somethingThatMightCauseAnError();\n  catch (ex) {\n    handleError(ex);\n\
    }\n```\n\nWhen an error occurs in the try block, execution immediately stops and\
    \ jumps to the catch block, where the error object is provided. You can inspect\
    \ this object to determine the best course of action to recover from the error.\n\
    \nThere is also a finally clause that can be added. The finally clause contains\
    \ code that will be executed regardless of whether an error occurs. For example:\n\
    \n```\ntry {\n  somethingThatMightCauseAnError();\n  catch (ex) {\n    handleError(ex);\n\
    \  } finally {\n    continueDoingOtherStuff();\n}\n```\n\nThe finally clause is\
    \ a little bit to work with in certain situations. For example, if the try clause\
    \ has a return statement, it won't actually return until finally has"
