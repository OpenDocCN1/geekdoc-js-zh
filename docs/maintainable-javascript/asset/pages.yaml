    \ variable\nfunction theName() {\n  return my;\n}\n```\n\nThe naming of variables\
    \ is as art as science, but in general, you should try to make the variable names\
    \ as short as possible to get the point across. Try to make the variable indicate\
    \ the data type of its value. For example, names as count, length, and size suggest\
    \ the data type is a number, and names such as name, title, and message suggest\
    \ the data type is a string. Single-character variable names such as i, j, and\
    \ k are typically reserved for use in loops. Using names that suggest the data\
    \ type makes your code easier to understand by others as well as yourself.\n\n\
    Meaningless names should be avoided. Names such as foo, bar, and temp, despite\
    \ being part of the developer's toolbox, don't give any meaning to variables.\
    \ There's no way for another developer to understand what the variable is used\
    \ for without understanding all of the context.\n\nFor function and method names,\
