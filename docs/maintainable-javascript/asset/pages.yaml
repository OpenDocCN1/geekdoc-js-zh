  md: "# Minifying with UglifyJS\n\nUglifyJS is most commonly used on the command\
    \ line through npm, the Node.js package manager. You must have both Node.js and\
    \ npm installed first before you can install UglifyJS, which is done with this\
    \ command:\n\n```\nsudo npm install -g uglify-js\n```\n\nThe UglifyJS command-line\
    \ interface also has a large number of options. However, the most commonly used\
    \ are:\n\n+   -- beautify\n  Beautifies the code instead of minifying it\n--no-mangle\n\
    \  Turns off function and variable name replacement\n--no-mangle-functions\n \
    \ Turns off only function name replacement\n--no-dead-code\n  Enables removal\
    \ of unreachable code\n\nThe basic format of UglifyJS on the command line is:\n\
    \n```\nuglifyjs [options] -o [outputfile] [file]\n```\n\nFor example:\n\n```\n\
    uglifyjs --no-mangle-functions -o core-min.js core/core.js core/core.js\n```\n\
    \nThis command runs UglifyJS on core/core.js and outputs the result to core/core-min\
    \ js. It's important that the original file comes after all of the other options.\n\
    \nWith as the other minifiers, it's best to put your preferred options into a\
    \ properties file, as in:\n\n```\nsrc.dir = .src\nlib.dir = .lib\n```\n\n```\n\
    uglifyjs = uglifyjs\nuglifyjs.options = --no-mangle-functions\n```\n\nThe Target\
    \ for UglifyJS is a bit easier than the others, because it is a standalone executable.\
    \ Instead of setting the executable attribute <apply> to Java, set it to uglifyjs.\
    \ Then pass the additional information as usual:\n\n```\n<target name=\"uglifyjs\"\
    \ failonerror=\"true\">\n```\n\n```\n<fileset src=\"${build.dir}\" includes=\"\
    *.js\" />\n<mapper type=\"glob\" from=\"*.js\" to=\"${build.dir}/*.min.js />\n\
    <arg line=\"${uglifyjs.options}\"/>\n```"
  merge: -1
