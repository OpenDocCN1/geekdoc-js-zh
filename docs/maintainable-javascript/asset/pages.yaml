  md: "implementation already exists and can be worked with. Polyfills add new methods\
    \ only when the native one isn't present and the nonnative version behaves the\
    \ same as the native one.\n\nThe advantage of polyfills is that you can easily\
    \ remove them when you're supporting only browsers If you choose to use a polyfill,\
    \ do your diligence. Make sure the functionality matches the native version as\
    \ closely as possible and double-check that the library has unit tests to verify\
    \ the functionality. The disadvantage of polyfills is that they may not accurately\
    \ implement the missing functionality, and then you end up with more problems\
    \ than fewer.\n\nFor best maintainability, avoid polyfills and instead create\
    \ a facade over existing functionality. This approach gives you the most flexibility,\
    \ which is especially important when native implementations have bugs. In that\
    \ case, you never want to use the native API directly, because you can insulate\
    \ yourself from the implementation bugs.\n\n# Preventing Modification\n\nECMAScript\
    \ 5 introduced several methods to prevent modification of objects. This capability\
    \ is important to understand, as it's now possible to lock down objects to ensure\
    \ that no one, accidentally or otherwise, changes functionality that they shouldn't.\
    \ This functionality is supported in Internet Explorer 9+, Firefox 4+, Safari\
