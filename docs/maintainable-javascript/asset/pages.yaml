- img_proc: true
  md: 'It’s optional, but you might want to include testing in the development build
    or to let developers run ant separately on their own. Keep in mind that testing
    takes more time due to the need to set up and tear down browser instances.


    # The Integration Build


    The integration build runs automatically as part of a continuous integration (CI)
    system, so it has more steps to complete. Because this build is the main defense
    against errors, it should include as much validation and testing as possible.
    At a minimum, it should do everything the development build plus unit testing.
    This is also a good location to place documentation generation so that other developers
    can see what changes have been made to the code. Here’s a sample:


    ```

    <project name="youmyapp" default="build.dev">

    <!-- omitted for clarity -->

    <!-- main builds --

    <target name="build.int" depends="build.dev,minify,test,document">

    </target>

    </project>

    ```


    The build.int first runs build.dev to complete the validation and concatenation
    of code. The next, is modified, then tested, and then documented. If this build
    breaks, it should cause the CI system to report an issue appropriately. Some systems
    sends out emails, others make visual changes to a stability dashboard. In any
    case, breaking the integration build is a matter that needs to be addressed quickly
    so that other developers aren’t blocked.


    You may want to include documentation generation in its own automated build. The
    reason is that a failure to generate documentation doesn’t necessarily mean that
    the code is broken. It might be that the document generator is broken for some
    reason. Once again, this largely depends on your development process and what
    you think is important to stop and fix before continuing.


    # The Release Build


    The release build is the finish line of the development process. It is this build
    that ensures that code is fit for production. By the time code reaches the release
    build, it should have been validated and tested, both automatically and manually,
    and should therefore mostly be ready. In some cases, the only thing a release
    build needs to do is bake the files, inserting copyrights, version numbers, or
    other associated metadata. Here’s an example:'
  merge: -1
  pgno: 197
- img_proc: true
  md: "```\n<project name=\"yourapp\" default=\"build.dev\">\n\n<!-- omitted for clarity\
    \ -->\n\n<!-- main builds -->\n<target name=\"build.release\" depends=\"build.int,bake\"\
    >\n  </target>\n\n</project>\n```\n\nThe build.release target simply runs an integration\
    \ build and bakes the files. You might also save the release build to handle deploying\
    \ of files to a server. In the case of JavaScript, this is typically done as part\
    \ of a larger deployment build process for the web application or project than\
    \ as part of the release build. However, you can certainly include a task to upload\
    \ files to a server or other distribution tasks.\n\n![](img/b5952fb0eafff982c42c2013b569fa4e_198_0.png)\n\
    \nAnother option for the release build is simply to take the output from the integration\
    \ build and bake it before deploying. Doing so can save time and, assuming there\
    \ are no errors in the integration build, ensure you're deploying the exact same\
    \ code that was tested. Once again, this choice is very project-specific, so be\
    \ sure to discuss it with your team.\n\n# Using a CI System\n\nJust using a build\
    \ system is a good first step in creating a maintainable project. The next step\
    \ is to integrate your build system into a CI system. CI systems run builds automatically\
    \ based on certain actions or regular intervals. For instance, you might run a\
    \ build once an hour to get all of the latest checked-in files deployed to an\
    \ integration environment. If it fails, it may send emails to the developers asking\
    \ them to fix any issues. Having a CI system is an important part of any good\
    \ software project. Frequently, there are some excellent free resources for CI.\n\
    \n# Jenkins\n\nJenkins is one of the most used CI systems. It is a Java-based\
    \ web application that is designed for managing multiple builds. It integrates\
    \ with several source control repositories by default and can support almost others\
    \ through an extensive plugin library. Jenkins works natively with Ant and as\
    \ shell scripts, which you can reuse using existing build scripts with Jenkins.\n\
    \nSetting up Jenkins is quite easy; just download the latest WAR file and start\
    \ it:\n\n```\njava -jar jenkins.war\n```\n\nJenkins starts up a web server accessible\
    \ at http://localhost:8080/. Navigate to that location in your web browser, and\
    \ you're ready to start creating build jobs."
