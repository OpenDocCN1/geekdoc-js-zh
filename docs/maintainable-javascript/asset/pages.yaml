  md: "other naming conventions, constructors follow the native language, so constructors\
    \ are formatted using Pascal case.\n\nPascal case is the same as camel except\
    \ that the initial letter is uppercase. So instead of anotherName, you would use\
    \ AnotherName. Doing so helps to differentiate constructors from variables and\
    \ nonconstructor functions. Constructor names also are typically nouns, as they\
    \ are used to create instances of a type. Here are some examples:\n\n```\n// Good\n\
    function Person(name) {\n  this.name = name;\n}\n```\n\n```\nPerson.prototype.sayName\
    \ = function() {\n  alert(this.name);\n}\n```\n\n```\nvar me = new Person(\"Nicholas\"\
    );\n```\n\nFollowing this convention also makes it easier to spot errors later.\
    \ You know that functions whose names are nouns in Pascal case must be preceded\
    \ by the new operator. Consider the following:\n\n```\nvar me = Person(\"Nicholas\"\
    );\nvar you = getPerson(\"Michael\");\n```\n\nHere, line 1 should jump out as\
    \ a problem to you, but line 2 looks okay according to the conventions already\
    \ laid out in this.\n\nCrockford's Code Conventions, the Google JavaScript Style\
    \ Guide, and the Dojo Style Guide all recommend this practice. JSLint will warn\
    \ if a constructor is found without an initial uppercase letter or if a constructor\
    \ function is used without the new operator. JHint will warn if a constructor\
    \ is found without an initial uppercase letter only if you add the special newcap\
    \ option.\n\n# Literal Values\n\nJavaScript has several types of primitive literal\
    \ values: strings, numbers, booleans, null, and undefined. There are also object\
    \ literals and array literals. Of these, only booleans are self-explanatory in\
    \ their use. All of the other types require a little bit of thought as to how\
    \ they should be used for optimum clarity.\n\n# Strings\n\nStrings are unique\
    \ in JavaScript, in that they can be indicated by either double quotes or single\
    \ quotes. For example: \n\n```\n// Valid JavaScript\nvar name = \"Nicholas says,\
    \ \\Hi.\\\\\";\n```"
