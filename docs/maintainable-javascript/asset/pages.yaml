    </apply>

    </target>

    ```


    This Ant now executes JSHInt on every file specified by the <fileset> element.
    You can run the target via:


    ```

    ant validate

    ```


    # Improving the Target


    Although the validate target works well, there are some improvements that can
    be made. First, the current version runs JSHInt on each file. So if there are
    three JavaScript files, it''s the equivalent of running this:


    ```

    java -jar js.jar jshint.js curly=true,noempty-true first.js

    java -jar js.jar jshint.js curly=true,noempty-true second.js

    java -jar js.jar jshint.js curly=true,noempty-true third.js

    ```


    There is some overhead when running java, specifically the creation and destruction
    of the Java Virtual Machine (JVM). This task adds significant amount of time to
    the target.


    The JSHint command-script accepts multiple files, so it''s perfectly capable of
    using one JVM to check every file. Fortunately, the <apply> task makes it easy
    to pass in all of the filenames. You just need to set the parallel attribute to
    "true":


    ```

    <target name="validate">

    <apply executable="java" parallel="true">

    <fileset dir="${src.dir}" includes="**/*.js" />

    <arg line="-jar"/>

    <arg path="js.jar"/>

    <arg path="jshint.js" />

    </target>

    ```


    Improving the Target | 14'
