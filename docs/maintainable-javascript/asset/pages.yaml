  md: "This issue is problem not just for custom types also for two very important\
    \ built-in types: functions and arrays. For these two types, you don't want to\
    \ use `instanceof` at all.\n\n# Detecting Functions\n\nFunctions are technically\
    \ reference types in JavaScript and also technically have Function constructor\
    \ of which each function is an instance. For example:\n\n```\nfunction myFunc()\
    \ {\n\n// Bad\nconsole.log(myFunc instanceof Function); // true\n```\n\nHowever,\
    \ this approach doesn't work across frames due to each frame having its own Function\
    \ constructor. Fortunately, the `typeof` operator also works with functions, returning\
    \ \"function\":\n\n```\nfunction myFunc() {\n\n// Good\nconsole.log(typeof myFunc\
    \ === \"function\"); // true\n```\n\nUsing `typeof` is the best way to detect\
    \ functions, because it also works across frames.\n\nThere is one limitation to\
    \ `typeof`s function detection. In Internet Explorer 8 and earlier, any functions\
    \ that are part of the DOM (such as `document.getElementById`) return \"object\"\
    \ instead of \"function\" when used with typeof. For instance:\n\n```\n// Internet\
    \ Explorer 8 and earlier\nconsole.log(typeof document.getElementById); // \"object\"\
    \nconsole.log(typeof document.createElement); // \"object\"\nconsole.log(typeof\
    \ document.getElementsByTagName); // \"object\"\n```\n\nThis quirk arises due\
    \ how browsers implement the DOM. In short, these versions of Internet Explorer\
    \ didn't implement the DOM as native JavaScript functions, which caused the `typeof`\
    \ operator to identify functions as objects. Because the DOM is so well defined,\
    \ developers typically test `typeof` for DOM functionality using the operator,\
    \ understanding that the presence of the object member means that it's an as in:\n\
    \n```\n// detect DOM method\nif (\"querySelectorAll\" in document) {\n  images\
    \ = document.querySelectorAll(\"img\");\n}\n```\n\nThis code checks to whether\
    \ `querySelectorAll` is defined in document, and if so, goes on to use that function.\
    \ Though not ideal, this is the safest way to check for the presence of DOM methods\
    \ if you need to support Internet Explorer 8 and earlier. In all other cases,\
    \ the `typeof` operator is the best way to detect functions in JavaScript.\n\n\
    Detecting Reference Values | 87"
