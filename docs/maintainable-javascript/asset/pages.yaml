    The two problematic formats are the hanging decimal point, such as 10., and the
    leading decimal point, as .1. Each format has the same problem: it''s hard to
    know if the omission of values before or after the decimal point is intentional.
    It could well be that the developer mistyped the value. It''s a good idea to include
    digits before and after the decimal point to avoid any confusion. These two formats
    are explicitly forbidden in the Dojo Style Guide. Both JSLint and JSHint warn
    when one of these patterns is found.


    The last problematic numeric format is the octal format. JavaScript''s support
    of octal numbers has been a long source of error and confusion. The literal 010
    doesn''t represent 10; it represents 8 in octal. Most developers are not familiar
    with octal format, and there''s rarely a reason to use it, so the best approach
    is to disallow octal literals in code. Although not called out in any of the popular
    style guides, both JSLint and JSHint warn when they come across an octal literal.


