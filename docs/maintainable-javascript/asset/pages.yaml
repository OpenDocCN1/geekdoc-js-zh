  md: "allows the author to revisit this code later and realize that it may be time\
    \ to verify newer versions of Internet Explorer and Safari show the same issue.\n\
    \n# Documentation Comments\n\nDocumentation comments aren not technically part\
    \ of JavaScript, but they are a very common practice. Document comments may take\
    \ many forms, but the most popular is the form that matches JavaDoc format: a\
    \ multiline comment with an extra asterisk at the beginning (/**) followed by\
    \ a description, followed by one or more attributes indicated by the @ sign. Here's\
    \ an example from YUI:\n\n```\n/**\nReturns a new object containing all of the\
    \ properties of the supplied objects. The properties from later objects will overwrite\
    \ those in earlier objects.\nPassing in a single object will create a shallow\
    \ copy of it. For a deep copy, use clone().\n@param {Object} One or more objects\
    \ to merge.\n@return {Object} A new merged object.\n*/\nY.merge = function ()\
    \ {\n  var args = arguments,\n  i = 0,\n  len = args.length,\n  result = {};\n\
    \n  for (i; i < len; i++) {\n    Y.merge(result, args[i], true);\n  }\n  return\
    \ result;\n}\n```\n\nThe YUI library uses its own tool YUIDoc to generate documentation\
    \ from these comments. However, the format is almost exactly the same as the library-agnostic\
    \ JSDoc Toolkit, widely used on open source projects as well as Google. The key\
    \ difference between YUIDoc and JSDoc Toolkit is YUIDoc supports both HTML and\
    \ Markdown in documentation comments, whereas JSDoc Toolkit supports only HTML.\n\
    \nIt is highly recommended that you use a documentation generator with your JavaScript.\
    \ The format of the comments must match the that you use, but the JavaDoc-style\
    \ documentation comments are well supported across many documentation generators.\
    \ When using documentation comments, you should be sure to document the following:"
