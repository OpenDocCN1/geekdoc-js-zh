  md: '# APPENDIX B


    # JavaScript Tools


    # Build Tools


    Though many build tools are not JavaScript-specific, they can still be quite useful
    in managing your large JavaScript projects:


    +   Ant

    My preferred build tool for JavaScript projects. A Java-based build system.


    +   Buildy

    A Node.js-based build system with built-in support for tasks related to JavaScript
    and CSS.


    +   Gmake

    An older build tool that''s still popular among Unix devotees. Gmake is used by
    jQuery.


    +   Grunt

    A Node.js-based build system with built-in support for JavaScript-related tasks
    like minification and concatenation.


    +   Jammit

    A Ruby-based asset packager that handles minification, validation, and more.


    +   Jasy

    A Python-based build system.


    +   Rake

    A utility similar to Gmake written in Ruby. Projects that use Sass, a popular
    CSS preprocessor, tend to use Rake.


    +   Sprockets

    A Rack-based build system.'
  merge: -1
