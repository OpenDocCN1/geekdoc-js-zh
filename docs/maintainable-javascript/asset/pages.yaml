    \ to add CSS classes for elements not yet implementing the HTML5 classList. The\
    \ remove() method encapsulates removing from the DOM, eliminating the need for\
    \ the developer to access the element's parent node.\n\nFacades are well to maintainable\
    \ JavaScript, because you have complete control over the interface. You can allow\
    \ or deny access to any of the underlying object's properties or methods, effectively\
    \ filtering access to that object. You can also add new methods that are simpler\
    \ to use than the existing ones (as is the case in this example). If the underlying\
    \ object changes in any way, you're able to make changes to the facade that allow\
    \ your application to continue working.\n\n![](img/b5952fb0eafff982c42c2013b569fa4e_128_0.png)\n\
    \n> A facade that implements a specific interface to make one object look like\
    \ it's another called an adapter. The only difference between facades and adapters\
    \ is that the former creates a new interface and the latter implements an existing\
    \ interface.\n\n# A Note on Polyfills\n\nJavaScript polyfills (also known as shims)\
    \ became popular when ECMAScript 5 and HTML5 features started being implemented\
    \ in browsers. A polyfill functionality is also well-defined and implemented natively\
    \ in newer browsers. For example, ECMAScript 5 added the forEach method for arrays.\
    \ This method can be implemented using ECMAScript 3, so older browsers can use\
    \ foreach as if it were a newer browser. The key to polyfills is that they implement\
    \ native functionality in a completely compatible way. Because the functionality\
    \ exists in some browsers, it's possible to test whether different cases are handled\
    \ in a standards-compliant manner.\n\nPolyfills often add new methods to objects\
    \ they don't own to achieve their end goal. I'm not a fan of polyfills, but I\
    \ do understand why people use them. Polyfills are marginally safer than other\
    \ types of object modification, because the native"
