    The <uglify> task works the same way as the others: -min is automatically added
    to minified filenames, and you can specify any <fileset> elements as you''d like.


    # # Compression


    Minification of JavaScript files is the first step before deployment. The second
    is to compress the files to be as small as possible during transmission. The minifiers
    mentioned in this chapter don''t perform compression on JavaScript (even YUI Compressor
    only performs minification). Compression usually happens later in the process,
    either at runtime using HTTP compression on the web server or during build time.


    # # Runtime Compression


    Most web servers are capable of performing runtime compression of files. In practice,
    such compression is typically done only for text-based files such as JavaScript,
    HTML, and CSS. Modern browsers all support HTTP compression and will send an HTTP
    header as part of a request indicating the types of compression supported. For
    example:


    Accept-Encoding: gzip, deflate


    When the server sees this header in a request, it knows the browser is capable
    of decompressing files that are compressed either gzip or deflate. When the server
    sends the response, it sets a header indicating the type of compression used,
    such as:


    Content-Encoding: gzip


    This header tells the browser that the body of the response is gzipped and must
    be uncompressed before use.'
  merge: -1
  pgno: 174
- img_proc: true
  md: "Apache 2, one of the most popular servers, has HTTP compression built in as\
    \ the mod_deflate module. This module is enabled by default and automatically\
    \ compresses JavaScript, HTML, CSS, and XML files. If you're using Apache 2, then\
    \ you don't need to do any further configuration for JavaScript files.\n\nNginx,\
    \ another popular web server, also has HTTP compression built in gzip. Compression\
    \ is also enabled by default for JavaScript, HTML, CSS, and XML files. If you're\
    \ using Nginx, then no further configuration is needed to enable compression for\
    \ JavaScript.\n\n![](img/b5952fb0eafff982c42c2013b569fa4e_175_0.png)\n\nInternet\
    \ Explorer 6 and earlier had problems with HTTP compression in certain situations.\
    \ Apache 2 and Nginx allow you to turn off HTTP compression for these browsers\
    \ if necessary. Since Microsoft began auto-grading everyone with Internet Explorer\
    \ 6 to Internet Explorer 8 in 2012, this should no longer be much of a problem.\n\
    \n# # Build-Time Compression\n\nYou may choose to compress files during build\
    \ time if you want to distribute the compressed file yourself without any intervention.\
    \ jQuery builds a gzipped version of the main JavaScript file and makes it available\
    \ for download from http://jquery.com. Gzipping is the easiest way to perform\
    \ compression at build time by Ant's <gzip> task.\n\nThe <gzip> task works only\
    \ on a single file. You specify the src attribute as the filename to compress\
    \ and the destfile attribute as the output file. For example:\n\n```\n<script\
    \ src=\"${build.dir}/build.js\" destfile=\"${build.dir}/build.js.gz\"/>\n```\n\
    \nThis task builds the build.js and outputs the result to build.js.gz. You can\
    \ certainly use <gzip> in this manner if you have only one file to gzip. For example:\n\
    \n```\n<target name=\"compress\">\n  <gzip src=\"${build.dir}/build.js\" destfile=\"\
    ${build.dir}/build.js.gz\"/>\n</target>\n```\n\nIn this case, the filenames should\
    \ be stored in properties so they can be easily changed later.\n\nA little bit\
    \ of creativity is required to gzip multiple files without explicitly setting\
    \ their filenames. However, it's possible to use JavaScript inside of Ant to provide\
    \ this benefit.\n\nThe <script> task allows you to write scripts in a number of\
    \ languages, of which JavaScript is just one. To specify JavaScript as the language\
    \ you're using, set the lang attribute to \"javascript\". After that, enclose\
    \ the contents of the <script> element with CDATAimiters as this:"
  merge: -1
  pgno: 175
- img_proc: true
  md: "```\n<script language=\"javascript\\><![CDATA[\n// code here\n]]></script>\n\
    ```\n\nAdding the CData delimiters ensures that you don't worry about escaping\
    \ characters within the script.\n\nJavaScript inside of the <script> task executes\
    \ in an environment similar to the default environment in Rhino. You have access\
    \ to Java objects and can import more by using the importPackage() function. There\
    \ is also a project object that refers to the overall project represented in build.xml.\
    \ You can read properties using project.getProperty() and create new tasks using\
    \ project.createTask(). Putting these pieces together, you can create a compress\
    \ target that compresses all files in the build directory:\n\n```\n<target name=\"\
    compress\">\n<!-- store filenames in a property delimited by -->\n<pathconvert\
    \ pathsep=\"; property=\"compress.jsfiles\">\n<fileset dir=\"${build.dir}\" includes=\"\
    *.js\"/>\n</pathconvert>\n```\n\n```\n<script language=\"javascript\"><![CDATA[\n\
    importPackage(Java.io);\n<!-- get the property and convert to an array-->\nvar\
    \ files = project.getProperty(\"compress.jsfiles\").split(\",\");\ngzip,\nlen;\n\
    \nfor (i=0, len=files.length; i< len; i++) {\n  // create new zip task\ngzip =\
    \ project.createTask(\"gzip\");\ngzip.setSrc(new File(files[i]));\ngzip.setDestFile(new\
    \ File(files[i]).replace(\".js\", \".gz\"));\ngzip.perform();\n}\n]]></script>\n\
    </target>\n```\n\nThe first part of the compress target converts a <set> into\
    \ a property. The compress.jsfiles is filled with a string in which the filenames\
    \ are separated by semicolons. Inside the <script> task, the first line imports\
    \ the java.io package so that the File class is available. Next, the compress.jsfiles\
    \ is read and split with semicolons so that files are an array of filenames.\n\
    \nAfter that, a for loop is used to iterate over the filenames. For each filename,\
    \ the <gzip> task is created using createTask(\"gzip\"). The gzip variable then"
  merge: -1
  pgno: 176
- img_proc: true
  md: "contains a Java object representing the task. Each attribute has method for\
    \ setting its value and a method for getting its value, so setSrc() is used to\
    \ set the src attribute and setDestFile() is used to set the destfile attribute.\
    \ Both attributes represent files, it's necessary to parse an instance of file\
    \ instead of the filename. The output file is set to have a .js extension by using\
    \ the JavaScript replace() method on the filename. The last step is to call perform(),\
    \ which actually executes the task.\n\nThis version of the compress target doesn't\
    \ rely on knowing the filename ahead of time and is therefore better suited for\
    \ general usage.\n\nThere is a Buildr gzipall task that allows you to compress\
    \ multiple files:\n\n```\n<target name=\"compress\">\n  <gzipall>\n    <fileset\
    \ dir=\"${build.dir}\" includes=\"*.min.js\" />\n  </gzipall>\n</target>\n```\n\
    \nUsing <gzipall>, a gzipped file is created with a .gz appended to the filename.\n\
    \nIf you intend to serve the compressed file yourself, you'll still need to configure\
    \ the web server to send the Content-Encoding: gzip header so that the browser\
    \ can use the file correctly.\n\n![](img/b5952fb0eafff982c42c2013b569fa4e_177_0.png)"
