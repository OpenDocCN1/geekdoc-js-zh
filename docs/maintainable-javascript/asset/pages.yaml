  md: '# CHAPTER 5

    Loose Coupling of UI Layers


    In web development, the user interface (UI) is defined by three separate layers
    working together:


    +   * HTML is used to define the data and semantics of the page.

    * CSS is used to style the page, creating visual distinction.

    * JavaScript is used to add behavior to the page, making it more interactive.


    These UI layers are usually pictured as HTML being at the base, with CSS and JavaScript
    layers on top, as displayed in Figure 5-1.


    | JavaScript |

    | CSS |

    | HTML |


    Figure 5-1. The layers of a web user interface


    In reality, though, CSS and JavaScript are more like siblings than JavaScript
    having a dependency on CSS. It''s possible to have a page with just HTML and CSS
    without any JavaScript, and it''s possible to have a page with just HTML and JavaScript
    without any CSS. I prefer to think of the relationship between these three layers
    as displayed in Figure 5-2.


    Thinking of CSS and JavaScript being of the same stature in overall web user interface
    allows for more possibilities and eliminates dependencies. For example, JavaScript
    shouldn''t rely on CSS to function correctly—it should be able to function independently
    of the CSS, even if there is some interaction between the two.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '| CSS | JavaScript |

    |---|---|

    | HTML | |


    Figure 5-2. The updated layers of a web user interface


    Each layer of a web UI is a piece of a larger system that must be maintained.
    HTML, CSS, and JavaScript are often written so tightly coupled that it''s impossible
    to make small changes without changing one or two layers. In a large-scale web
    application, this type of design is a big problem, especially on teams in which
    the same people aren''t responsible for the HTML, CSS, and JavaScript. In such
    situations, loose coupling becomes very important.


    # What Is Loose Coupling?


    Many design patterns are actually solutions to the problem of tight coupling.
    If two components are tightly coupled, it means that one component has direct
    knowledge of the other in such a way that a change to one of the components necessitates
    a change to the other component. For example, suppose you have a CSS class error
    that is used throughout a website, embedded in HTML. If one day you decide that
    error isn''t the right name for the class and you want to change it to using that
    class, you''ll have to edit not just the CSS but also all of the HTML using is
    tightly coupled to the CSS. This is just a simple example. Imagine a nightmare
    when it is a system with dozens or hundreds of components.


    Loose coupling is achieved when you''re able to make changes to a single component
    without making changes to other components. Loose coupling is essential to the
    maintainability of large systems for more than one person is responsible for the
    development and maintenance of code. You absolutely want developers to be able
    to make changes in one area of the code without breaking what others are doing
    in a different area of.


    Loose coupling is achieved by limiting each component''s knowledge of the larger
    system. In essence, every component needs to be as dumb as possible to ensure
    loose coupling. The less a component knows, the better the entire system tends
    to be.


    One thing to keep in mind: there is no such as no coupling between components
    that work together. In any system, there will necessarily be some knowledge shared
    between components in order to do their job. That''s the goal is to ensure changes
    in one component don''t require changes in multiple places on a regular basis.


    A web UI that is loosely coupled is easier to debug. Issues with text or structure
    are addressed by looking just HTML. When stylistic issues arise, you know the
    problem'
