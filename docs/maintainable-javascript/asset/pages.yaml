  md: "```\n// If you test null, this is the way to do it\nvar element = document.getElementById(\"\
    my-div\");\nif (element!=null) {\n  element.className = \"found\";\n}\n```\n\n\
    It is entirely possible for document.getElementById to return null if the DOM\
    \ element isn't found. The method will return either null or an element. Because\
    \ null is one of the expected outcomes, it's okay to test for it using !=.\n\n\
    ![](img/b5952fb0eafff982c42c2013b569fa4e_102_0.png)\n\nRunning typeof null returns\
    \ \"object,\" making this an inefficient way to test for null values. If you must\
    \ test null, use the identically equal operator (===) or the not identically equal\
    \ (!==) operator.\n\n# Detecting Reference Values\n\nReference values are also\
    \ known as objects. In JavaScript, any value that isn't a primitive is definitely\
    \ a reference. There are several built-in reference types such as Object, Array,\
    \ Date, and Error, just to give a name. The typeof operator is of little use for\
    \ reference values, because it returns \"object\" for any type of object:\n\n\
    ```\nconsole.log(typeof {});           // \"object\"\nconsole.log(typeof []);\
    \          // \"object\"\nconsole.log(typeof new Date());     // \"object\"\n\
    console.log(typeof new RegExp(\\/));  // \"object\"\n```\n\nAnother downside to\
    \ using typeof for objects is that typeof returns \"object\" for null values as\
    \ well:\n\n```\nconsole.log(typeof null);      // \"object\"\n```\n\nThis quirk,\
    \ which has been recognized as a serious bug in the specification, prevents accurate\
    \ detection of null using typeof.\n\nThe instanceof operator is the best way to\
    \ detect values of a particular reference type. Basic syntax for instanceof is:\n\
    \n```\nvalue instanceof constructor\n```\n\nHere are some examples:\n\n```\n//\
    \ detect a Date\nif (value instanceof Date) {\n  console.log(value.getFullYear());\n\
    }\n```\n\n```\n// detect a RegExp\nif (value instanceof RegExp) {\n  if (value.test(anotherValue))\
    \ {\n    console.log(\"Matches\");\n  }\n}\n```"
  merge: -1
