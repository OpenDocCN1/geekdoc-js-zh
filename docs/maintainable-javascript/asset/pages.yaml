  md: "# The One-Global Approach\n\nYou may be thinking at this point, “How is it\
    \ possible to write JavaScript without introducing any globals?” Although it is\
    \ technically possible through some clever patterns, this approach is usually\
    \ not feasible or maintainable in the long run. When JavaScript is developed by\
    \ a team, that typically means multiple files are loaded in various scenarios,\
    \ and the only way to enable communication between these disparate code is to\
    \ have something that all the code can rely on be present. The best approach is\
    \ to try to have as small as a global footprint by agreeing to create one global\
    \ object.\n\nThe one-global approach is used by all popular JavaScript libraries:\n\
    \n+   - YUI defines a single global object.\n- jQuery actually defines two globals,\
    \ $ and jQuery. The latter was added only for compatibility when used on a page\
    \ with other libraries also $.\n- The Closure library defines a single global\
    \ object.\n\nThe idea behind the one-global approach is to create a single global\
    \ with a unique name (which is unlikely to be used by native APIs) and then attach\
    \ all of your functionality onto that global. Instead of creating multiple globals,\
    \ each-global simply becomes a property of one global. For instance, suppose I\
    \ wanted to have each chapter in this book. The code might look like this:\n\n\
    ```\nfunction Book(title) {\n  this.title = title;\n  this.page = 1;\n}\n```\n\
    \n```\nBook.prototype.turnPage = function(direction) {\n  this.page += direction;\n\
    };\n\nvar Chapter1 = new Book(\"Introduction to Style Guidelines\");\nvar Chapter2\
    \ = new Book(\"Basic Formatting\");\nvar Chapter3 = new Book(\"Comments\");\n\
    ```\n\nThis code creates four globals, Book, Chapter1, Chapter2, and Chapter3.\
    \ The one-global approach would be to create a single global and attach each of\
    \ these:\n\n```\nvar MaintainableJS = {};\n```\n\n```\nMaintainableJS.Book = function(title)\
    \ {\n  this.title = title;\n  this.page = 1;\n};\n\nMaintainableJS.Book.prototype.turnPage\
    \ = function(direction) {\n  this.page += direction;\n}\n```"
  merge: -1
  pgno: 88
- img_proc: true
  md: "MaintainableJS.Chapter1 = new MaintainableJS.Book(\"Introduction to Style Guidelines\"\
    );\nMaintainableJS.Chapter2 = new MaintainableJS.Book(\"Basic Formatting\");\n\
    MaintainableJS.Chapter3 = new MaintainableJS.Book(\"Comments\");\n\nThis code\
    \ has a single global, MaintainableJS, to which all of the other information is\
    \ attached. As long as everyone is aware of the single global, it's easy to continue\
    \ adding properties to it and avoid global pollution.\n\n# Namespaces\n\nIt is\
    \ possible to start polling your global as well. Most projects that use the global\
    \ approach also have the concept of namespacing. A namespace is simply a logical\
    \ grouping of functionality by a single property on the global. For instance,\
    \ YUI is set up almost exclusively using namespaces. Everything under Y.DOM is\
    \ a method related to DOM manipulation, everything under Y.Event has to do with\
    \ events, and so on.\\Grouping functionality into namespaces brings some order\
    \ to your one global object and allows team members to understand what new functionality\
    \ belongs as well as where to look for existing functionality. When I worked at\
    \ Yahoo!, there was an unspoken convention that each site would add its own namespace\
    \ to Y object for all of its functionality, My Yahoo used Y.Mail, and that allowed\
    \ teams to use one code without fearing name collisions.\n\nYou can easily create\
    \ your own namespaces in JavaScript with objects, as in:\n\n```\nvar ZakasBooks\
    \ = {};\n\n// namespace for this book\nZakasBooks.MaintainableJavaScript = {};\n\
    ```\n\n```\n// namespace for another book\nZakasBooks.HighPerformanceJavaScript\
    \ = {};\n```\n\nA common convention is for each file to declare its own namespace\
    \ by creating a new object on the global. In such circumstances, the previous\
    \ example pattern works fine.\n\nThere are also times when each file is simply\
    \ adding to a namespace; in that case, you might want a little more assurance\
    \ that the namespace already exists. That's when a global that handles namespaces\
    \ nondestructively is useful. The basic pattern to accomplish this is:\n\n```\n\
    var YourGlobal = {\n  namespace: function(ns) {\n    var parts = ns.split(\".\"\
    );\n    object = this,\n    i, len;\n  }\n```"
  merge: -1
  pgno: 89
- img_proc: true
  md: "```\nfor (i=0, len=parts.length; i < len; i++) {\n  if (object[parts[i]]) {\n\
    \    object[parts[i]] = {};\n  }\n  object = object[parts[i]];\n}\n\nreturn object;\n\
    }\n```\n\nThe variableGlobal can actually have any name. The important part is\
    \ the space() method, which nondestructively creates namespaces based on the string\
    \ that is passed in and returns a reference to the namespace object. Basic usage:\n\
    \n```\n/*\n * Creates both YourGlobal.Books and YourGlobal.MaintainableJavaScript\n\
    \ * Neither exists before hand, so each is created from scratch.\n */\nYourGlobal.namespace(\"\
    Books.MaintainableJavaScript\");\n```\n\n```\n// you can now start using the namespace\n\
    YourGlobal.Books.MaintainableJavaScript.author = \"Nicholas C. Zakas\";\n```\n\
    \n+   * Leaves YourGlobal.Books alone and adds HighPerformanceJavaScript to it.\n\
    * This leaves YourGlobal.MaintainableJavaScript intact.\n\n```\nYourGlobal.namespace(\"\
    Books.HighPerformanceJavaScript\");\n```\n\n```\n// still a valid reference\n\
    console.log(YourGlobal.Books.MaintainableJavaScript.author);\n```\n\n```\n// You\
    \ can also start adding new properties right off the method call\nYourGlobal.namespace(\"\
    Books\").Newbook = {};\n```\n\nUsing a namespace() method on your global allows\
    \ developers the freedom to assume that the namespace exists. That way, each file\
    \ can call namespace() to first declare the namespace the developers are using,\
    \ knowing that they won't destroy the namespace if it already exists. This approach\
    \ also frees developers from the tedious task of checking to see the namespace\
    \ exists before using it.\n\n+   * With other parts of your code, be sure to define\
    \ some conventions around namespaces. Should they begin with uppercase letters\
    \ as in YUI?\n* Or be lowercase as in Dojo? This is a question of preference,\
    \ defining these choices up front allows the team to use the one-global approach\
    \ more effectively.\n\n![](img/b5952fb0eafff982c42c2013b569fa4e_90_0.png)"
  merge: -1
