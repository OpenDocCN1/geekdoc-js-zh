  md: "# Baking Files\n\nBaking refers to the final touches you put into files before\
    \ considering them ready for deployment. A lot of times, this step involves adding\
    \ additional text into a file or replacing existing text with something else.\
    \ Inserting the build time, as in the previous example, is a type of baking. Other\
    \ common tasks are automatically including license information and inserting version\
    \ information. Both can be done very easily using Ant. \n\nMany projects have\
    \ a license file included somewhere in source control. The license file is separate\
    \ because it may change independently of the code. It's useful to automatically\
    \ insert the license information at the top of files before pushing them to production.\
    \ You could potentially insert the license file using a <filelist> element, but\
    \ that would mean the license file must be in a property format for JavaScript.\
    \ It is much easier to let the license file be plain text and add comments around\
    \ it using <loadfile> task:\n\n```\n<loadfile property=\"srcfile=\"license.txt\"\
    \ />\n```\n\nThis code loads replacing license.txt and stores it in a property\
    \ name. Once it's in a property, you can use the <header> element to insert the\
    \ text as a comment:\n\n```\n<target name=\"concat\">\n<concat destfile=\"${build.dir}/build.js\"\
    \ fixlastline=\"yes\" eol=\"\\lf\">\n  <header trimleading=\"yes\"/>\n  /*\n \
    \ ${license}\n*/\n  /* Build time: ${build.time} */\n</header>\n  <filelist dir=\"\
    ${src.dir}\" files=\"first.js,second.js\" />\n  <fileset dir=\"${src.dir}\" includes=\"\
    **/*.js\" excludes=\"first.js,second.js\" />\n</concat>\n</target>\n```\n\nThe\
    \ license is inserted with a multiline JavaScript comment that has an exclamation\
    \ point as the first character, which tells codifiers (see Chapter 17) that the\
    \ comment is important and should not be removed. The <header> element also has\
    \ trimleading set to \"yes\". This attribute specifies white space on each line\
    \ inside of <header> should be removed. That, all text is aligned at the first\
    \ column in the final file.\n\nThe other part of baking within some files, is\
    \ quite easily using the <replaceregex> task. This task systematically goes through\
    \ any number of files and uses regular expressions to replace values. For example,\
    \ I tend to use the token @VERSION@ in my source files to indicate where the version\
    \ number should be inserted. For instance, you might have this in a JavaScript\
    \ file:"
  merge: -1
  pgno: 165
- img_proc: true
  md: "```\nvar MyProject = {\n  version: \"@VERSION@\"\n};\n```\n\nYou can replace\
    \ @VERSION@ with an actual version number using the following:\n\n```\n<replaceregexp\
    \ match=\"@VERSION@\" replace=\"${version}\" flags=\"g\" byline=\"true\">\n  <fileset\
    \ dir=\"${build.dir}\" includes=\"**/* />\n</replaceregexp>\n```\n\nThe replaceregexp\
    \ task takes the regular expression from the match attribute and replaces the\
    \ text in the replace attribute. Regular expression flags as g, i, and m are specified\
    \ using the flags attribute, and byline indicates whether the regular expression\
    \ match just a single line. You then specify any number of files in which this\
    \ replacement should be made.\n\nBecause replaceregexp does not create files,\
    \ it is safe to run it on the build files, in the following example:\n\n```\n\
    <target name=\"concatenate\">\n  <concat destfile=\"${build.dir}/build.js\" fixlast=\"\
    yes\" eol=\"lf\">\n    <filelist dir=\"${src.dir}\" files=\"*.js,*.second.js\"\
    \ />\n    <fileset dir=\"${src.dir}\" includes=\"**/*\" excludes=\"first.js,second.js\"\
    \ />\n    <footer> Build Time: ${build.time} </footer>\n  </concat>\n</target>\n\
    ```\n\n```\n<replaceregexp match=\"@VERSION@\" replace=\"${version}\" flags=\"\
    g\" byline=\"true\">\n  <fileset dir=\"${build.dir}\" includes=\"**/*\" />\n</replaceregexp>\n\
    </target>\n```\n\nThis code replaces all instances of @VERSION@ in all built files\
    \ with the version property. Although the replacement takes place in the concatenate\
    \ target here, you may also want to have a target name=\"bake\":\n\n```\n<target\
    \ name=\"bake\">\n```\n\n```\n<replaceregexp match=\"@VERSION@\" replace=\"${version}\"\
    \ flags=\"g\" byline=\"true\">\n  <fileset dir=\"${build.dir}\" includes=\"**/*\"\
    \ />\n</replaceregexp>\n```\n\n```\n</target>\n```\n\nSeparating out the baking\
    \ step makes sense when it doesn't involve the <concat> task and may not always\
    \ be desired part of the build process."
