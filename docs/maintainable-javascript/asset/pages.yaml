    \ boolean |\n| has | Function returns a boolean |\n| is | Function returns a boolean\
    \ |\n| get | Function returns a nonboolean |\n| set | Function is used to save\
    \ a value |\n\nFollowing these conventions as a starting point makes code much\
    \ more readable. Here are some examples:\n\n```\nif (isEnabled()) {\n  setName(\"\
    Nicholas\");n}\n```"
