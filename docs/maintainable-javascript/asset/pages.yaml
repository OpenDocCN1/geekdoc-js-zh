  md: "# CHAPTER 8\nAvoid Null Comparisons\n\nA common yet still problematic pattern\
    \ in JavaScript is testing a variable against null, presumably to determine whether\
    \ the variable has been filled in with an appropriate value. For example:\n\n\
    ```\nvar Controller = {\n  process: function(items) {\n    if (items != null)\
    \ { // Bad\n      items.sort();\n      items.forEach(function(item) {\n      \
    \  // do something\n      });\n    }\n  }\n};\n```\n\nHere, the process() method\
    \ is clearly expecting that items will be an array, as indicated by the use of\
    \ sort() and foreach(). The intention of this code is clear: don't continue processing\
    \ unless the items argument contains an array. The problem with this approach\
    \ is that the comparison against null doesn't actually prevent future errors.\
    \ The value of items could be 1, a string, or some random object. All of these\
    \ are technically not equal to null and would therefore cause the process() method\
    \ to fail once sort() executes.\n\nComparing a variable against null typically\
    \ gives you enough information about the value to determine whether it's safe\
    \ to proceed. Fortunately, JavaScript gives you a number of ways to determine\
    \ the true value of a variable.\n\n# Detecting Primitive Values\n\nThere are five\
    \ primitive types in JavaScript: string, number, boolean, null, and undefined.\
    \ If you are expecting a value to be a string, number, boolean, or undefined,\
    \ then the typeof operator is your best option. The typeof operator works on a\
    \ variable and returns a string indicating the type of value:"
  merge: -1
  pgno: 100
- img_proc: true
  md: "+   - For strings, typeof returns \"string.\"\n\n+   - For numbers, typeof\
    \ returns \"number.\"\n\n+   - For booleans, typeof returns \"boolean.\"\n\n+\
    \   - For undefined, typeof returns \"undefined.\"\n\nBasic syntax for typeof\
    \ is as follows:\n\n```\ntypeof variable\n```\n\nYou may also see typeof used\
    \ in this manner:\n\n```\ntypeof(variable)\n```\n\nAlthough this is valid JavaScript\
    \ syntax, this pattern makes typeof appear to be a function instead of an operator.\
    \ For this reason, the pattern without parentheses is recommended.\n\nUsing typeof\
    \ for detecting these four primitive value types is the safest way to do defensively.\
    \ Here are some examples:\n\n```\n// detect a string\nif (typeof name === \"string\"\
    ) {\n  anotherName = name.substring(3);\n}\n\n// detect a number\nif (typeof count\
    \ === \"number\") {\n  updateCount(count);\n}\n\n// detect a boolean\nif (typeof\
    \ found === \"boolean\" && found) {\n  message(\"Found!\");\n}\n\n// detect undefined\n\
    if (typeof MyApp === \"undefined\") {\n  MyApp = {\n    // code\n  };\n}\n```\n\
    \nThe typeof operator is also unique in that it can be used on an undeclared variable\
    \ without throwing an error. Both undefined variables and variables whose value\
    \ is undefined return \"undefined\" when typeof is used.\n\nThe last primitive\
    \ type, null, is the one that you normally shouldn't be testing for. As stated\
    \ earlier, comparing against null generally doesn't give you enough information\
    \ about whether the value is expected. There is one exception: if the expected\
    \ value is actually null, then it is okay to test for null directly. The comparison\
    \ should be done using either === or != against null. For example:"
