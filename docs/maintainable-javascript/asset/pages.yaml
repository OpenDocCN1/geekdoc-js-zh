    \ deleted.\n\nFreeze\n\n+   - Same as seal, plus prevents existing properties\
    \ methods from being modified (all fields are read-only).\n\nEach of these lock-down\
    \ has two methods: a method that performs the action and a method that confirms\
    \ the action was taken. For preventing extensions, Object.preventExtension() and\
    \ Object.isExtensible() are used:\n\n```\nvar person = {\n  name: \"Nicholas\"\
    \n};\n\n// lock down the object\nObject.preventExtension(person);\n\nconsole.log(Object.isExtensible(person));\
    \ // false\n```"
