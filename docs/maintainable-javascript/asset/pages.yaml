  md: "# CHAPTER 16\nConcatenation and Baking\n\nIf you've properly set up your JavaScript\
    \ files to contain one object per file, then it's likely you have dozens of JavaScript\
    \ files. Before deploying to production, it's best to concatenate the files so\
    \ there are fewer HTTP requests on the page. Exactly how many files and which\
    \ files should be concatenated with which is a project-specific decision. In any\
    \ case, Ant provides an easy way to concatenate multiple files.\n\n# The Task\n\
    \nThe <concat> task is one of the simplest in Ant. You simply specify a destfile\
    \ attribute containing the destination filename and then include as many <fileset>\
    \ and <file list> elements. At it's simplest, you can have a target such as:\n\
    \n```\n<target name=\"concat\">\n  <concat destfile=\"${build.dir}/build.js\"\
    >\n    <fileset dir=\"${src.dir}\" includes=\"**/*.js\" />\n  </concat>\n</target>\n\
    ```\n\nThis target concatenates all JavaScript files in the source directory into\
    \ a single file called build, is in the build directory. Keep in mind that the\
    \ files are concatenated in the order in which they appear on the filesystem (alphabetically).\
    \ If you want a more specific ordering, you'll need to specify it explicitly,\
    \ such as:\n\n```\n<target name=\"concat\">\n  <concat destfile=\"${build.dir}/build.js\"\
    >\n    <fileset dir=\"${src.dir}\" files=\"first.js,second.js\" />\n    <fileset\
    \ dir=\"${src.dir}\" includes=\"**/*.js\" excludes=\"first.js,second.js\"/>\n\
    \  </concat>\n</target>\n```"
  merge: -1
  pgno: 162
- img_proc: true
  md: "This of the target ensures that first.js is the first file added to the final\
    \ file and second.js comes right after that. Remember, you can use any number\
    \ of <fileset> and <fileslist> elements, so you can concatenate in any order you\
    \ can imagine.\n\n![](img/b5952fb0eafff982c42c2013b569fa4e_163_0.png)\n\nEven\
    \ though it's possible to create complex concatenation schemes using, it's best\
    \ to limit the special cases. Keeping filenames out of your script is a good idea\
    \ for maintainability. Try to use <fileset> elements whenever possible.\n\n# Line\
    \ Endings\n\nConcatenating files together comes with a series of challenges. One\
    \ of the trickiest issues is dealing if a file doesn't have a newline character\
    \ on its last line, then concatenating with another may result in broken syntax.\
    \ By setting firstline attribute to \"yes\", the <concat> task will automatically\
    \ add a newline to the last line if one doesn't already exist:\n\n```\n<concat\
    \ name=\"${build.dir}/build.js\" firstline=\"yes\">\n  <fileset dir=\"${src.dir}\"\
    \ files=\"first.js,second.js\" />\n  <fileset dir=\"${src.dir}\" includes=\"*.*\"\
    \ excludes=\"first.js,second.js\"/>\n</concat>\n```\n\nIt's a good idea to set\
    \ firstline to \"yes\" for JavaScript, as newlines are valid end-of-statement\
    \ tokens.\n\nFixing the line is easy, but how do you know which end-of-line marker\
    \ is used? If your source files are being edited by people on different operating\
    \ systems, you may want to ensure consistency in the built files. The <concat>\
    \ task has an optional attribute that specifies which end-of-line markers to use.\
    \ The default value is the default for the system (\"crlf\" for Windows, \"lf\"\
    \ for Unix, and \"cr\" for Mac OS X). You can choose any of these values, and\
    \ all the line endings in the concatenated file will be automatically switched\
    \ to format:\n\n```\n<concat name=\"${build.dir}/build.js\" firstline=\"yes\"\
    \ el=\"1f\">\n  <fileset dir=\"${src.dir}\" files=\"first.js,second.js\" />\n\
    \  <fileset dir=\"${src.dir}\" includes=\"*.*\" excludes=\"first.js,second.js\"\
    />\n</concat>\n```\n\nThis target changes all end-of-line markers to Unix style,\
    \ which is the recommended format for JavaScript files, as it has the greatest\
    \ cross-platform compatibility (and be cause most web servers on a Unix variant).\n\
    \n146 | Chapter 16: Concatenation and Baking"
  merge: -1
