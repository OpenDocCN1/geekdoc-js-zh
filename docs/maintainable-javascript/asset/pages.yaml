  md: '# Array Literals


    Array literals, as with object literals, are a more compact way of defining arrays
    in JavaScript. Explicitly using the Array constructor, as in this example, is
    generally frownedrown upon:


    ```

    // Bad

    var colors = new Array("red", "green", "blue");

    var numbers = new Array(1, 2, 3, 4);

    ```


    Instead of using the Array constructor, you can use two square brackets and include
    the initial members of the array:


    ```

    // Good

    var colors = [ "red", "green", "blue" ];

    var numbers = [ 1, 2, 3, 4 ];

    ```


    This pattern is widely used and common in JavaScript. It is also recommended by
    the Google JavaScript Style Guide and Crockford’s Code Conventions.'
