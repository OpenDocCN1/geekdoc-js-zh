  md: "Not removing methods is actually a good practice for objects that you own,\
    \ as well. It's very hard to remove methods from libraries or of native objects,\
    \ because there is third-party code relying on that functionality. In many cases,\
    \ both libraries and browsers have had to cause buggy or incomplete methods for\
    \ a long time, because removing them would cause errors on countless websites.\n\
    \n# # Better Approaches\n\nModifying objects you don't own is a solution to some\
    \ problems. It usually doesn't happen organically; it happens because a developer\
    \ has come across a problem that object modification solves. However, there is\
    \ almost always than one solution to any given problem. Most computer science\
    \ knowledge has evolved out of solving problems in statically typed languages\
    \ such as Java. There are many approaches, designed patterns, to extending existing\
    \ objects without directly modifying objects.\n\nThe most popular form of object\
    \ augmentation outside of JavaScript is inheritance. If there's a type of object\
    \ that does most of what you want, then you can inherit from it and add additional\
    \ functionality. There are two basic forms of inheritance in JavaScript: object-based\
    \ and type-based.\n\nThere are still some significant inheritance limitations\
    \ in JavaScript. First, inheriting from DOM or BOM doesn't work (yet). Second,\
    \ inheriting from Array doesn't work due to the intricacies of how numeric indices\
    \ relate to the length property.\n\n# # Object-Based Inheritance\n\nIn object-based\
    \ inheritance, frequently prototypal inheritance, one object inherits from another\
    \ without invoking a constructor function. The ECMAScript 5 Object.create() method\
    \ is the easiest way for one object to inherit from another. instance:\n\n```\n\
    var Person = {\n  name: \"Nicholas\",\n  sayName: function() {\n    alert(this.name);\n\
    \  }\n}\n\nvar myPerson = Object.create(person);\nmyPerson.sayName(); // pops\
    \ up \"Nicholas\"\n```\n\nThis example creates a new object myPerson that inherits\
    \ from person. The inheritance occurs as myPerson's prototype is set to person.\
    \ After that, myPerson is able to access the same properties and methods on person"
