  md: "# Multiline Comments\n\nMultiline comments are capable of spanning multiple\
    \ lines. They begin with /* and end with */. Multiline comments aren’t required\
    \ to span multiple lines; that choice is all up to you. The following are all\
    \ valid multiline comments:\n\n```\n/* My comment */\n```\n\n```\n/* Another comment.\n\
    This goes to two lines. */\n```\n\n```\n/*\nYet another comment.\nAlso goes to\
    \ a second line.\n*/\n```\n\nAlthough all these comments are technically valid,\
    \ I prefer the Java-style multiline comment pattern. The Java style is to have\
    \ at least three lines: for the /*, or more lines beginning with a * that is aligned\
    \ with the * on the previous line, and the last line for * /. The resulting comment\
    \ looks like this:\n\n```\n/*\n  * Yet another comment.\n  * Also goes to a second\
    \ line.\n  */\n```\n\nThe result is more legible comment that is visually aligned\
    \ on the left to an asterisk. IDEs such as NetBeans and Eclipse will automatically\
    \ insert these leading asterisks for you.\n\nMultiline comments always come immediately\
    \ before the code they describe. With single-line comments, multiline comments\
    \ should be preceded by an empty line and should be at the same indentation level\
    \ as the code being described. Here are some examples:\n\n```\n// Good\nif (condition)\
    \ {\n  /*\n    * if you made it here,\n    * then all security checks passed\n\
    \  */\n  allowed();\n}\n```\n\n```\n// Bad: No empty line preceding comment\n\
    if (condition) {\n  /*\n    * if you made it here,\n    * then all security checks\
    \ passed\n  */\n  allowed();\n}\n```"
