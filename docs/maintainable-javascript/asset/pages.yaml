  md: "# Detecting Arrays\n\nArrays back and forth between frames was one of the original\
    \ cross-frame issues in JavaScript. Developers quickly discovered that instanceof\
    \ Array didn't always produce results in these cases. As mentioned previously,\
    \ each frame has its own Array constructor, so an instance from one frame was\
    \ not recognized in another. Douglas Crockford first recommended performing some\
    \ duck typing, testing for the presence of the sort() method:\n\n```\n// Duck\
    \ typing arrays\nfunctionArray(value) {\n  return typeof value.sort === \"function\"\
    ;\n}\n```\n\nThis detection relies on the fact that arrays are the only object\
    \ types with a sort() method. Of course, this version ofisArray() will also return\
    \ true when any object with a sort() method is passed in.\n\nThere quite a lot\
    \ of investigation into accurately detecting array types in JavaScript; ultimately,\
    \ Juriy Zatsev (also known as Kangax) proposed an elegant solution to this problem:\n\
    \n```\nfunctionArray(value) {\n  return Object.prototype.toString.call(value)\
    \ === \"[object Array]\";\n}\n```\n\nKangax found that calling the toString()\
    \ method on a given value produced a standard string in all browsers. For arrays,\
    \ the string is \"[object Array],\" and this worked regardless of the frame from\
    \ which the array originated. Kangax's approach quickly became popular and is\
    \ now implemented in most JavaScript libraries.\n\n![](img/b5952fb0eafff982c42c2013b569fa4e_105_0.png)\n\
    \nThis is generally useful for identifying native objects as opposed to developer-defined\
    \ objects. For example, the native JSON object returns \"[object JSON]\" using\
    \ this technique.\n\nSince that time, ECMAScript 5 has introduced Array.isArray()\
    \ formally into JavaScript. The purpose of this method is to accurately determine\
    \ whether a value is an array. As with Kangax's function, Array.isArray() works\
    \ with values that are passed across frames, so many JavaScript libraries implement\
    \ methods similar to this:\n\n```\nfunctionArray(value) {\n  if (typeof Array.isArray\
    \ === \"function\") {\n    return Array.isArray(value);\n  } else {\n    return\
    \ Object.prototype.toString.call(value) === \"[object Array]\";\n  }\n}\n```\n\
    \nThe Array.isArray() method is implemented in Internet Explorer 9+, Firefox 4+,\
    \ Safari 5+, Opera 10.5+, Chrome."
