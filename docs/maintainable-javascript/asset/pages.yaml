  md: "# The for-in Loop\n\nThe **for-in** loop is used to iterate over properties\
    \ of an object. Instead of defining a control condition, the loop systematically\
    \ goes through each named object property and returns the property name inside\
    \ of a variable, as in:\n\n```\nfor (prop in object) {\n  console.log(\"Property\
    \ name is \" + prop);\n  console.log(\"Property value is \" + object[prop]);\n\
    }\n```\n\nA problem with **for-in** is that it returns not only instance properties\
    \ of an object but also properties it inherits from the prototype. You may end\
    \ up with unanticipated results iterating through properties on your own object.\
    \ For this reason, it's best to filter the **for-in** loop to only instance properties\
    \ by using `ownProperty()`. Here's an example:\n\n```\nfor (prop in object) {\n\
    \  if (object.hasOwnProperty(prop)) {\n    console.log(\"Property name is \" +\
    \ prop);\n    console.log(\"Property value is \" + object[prop]);\n  }\n}\n```\n\
    \nCrockford's Code Conventions require the use of `hasOwnProperty()` for all for-in\
    \ loops. Both JSLint and JHint warn when a **for-in** loop is missing a call to\
    \ `hasOwnProperty()` by default (both allow this option to be turned off). I recommend\
    \ to always use `hasOwnProperty()` for for-in loops unless you're intentionally\
    \ looking up the prototype chain, in which case it should be indicated with a\
    \ comment, such as:\n\n```\nfor (prop in object) { // include prototype properties\n\
    \  console.log(\"Property name is \" + prop);\n  console.log(\"Property value\
    \ is \" + object[prop]);\n}\n```\n\nAnother area of focus with for-in loops is\
    \ their usage with objects. A common mistake is to use **for-in** to iterate over\
    \ members of an array, as in this example:\n\n```\n// Bad\nvar values = [ 1, 2,\
    \ 3, 4, 5, 6, 7 ],\nni;\n```\n\n```\nfor (i in values) {\n  process(items[i]);\n\
    }\n```"
  merge: -1
  pgno: 54
- img_proc: true
  md: This practice is disallowed in Crockford's Code Conventions as well as the Google
    JavaScript Style Guide due to the potential errors it may cause. Remember, the
