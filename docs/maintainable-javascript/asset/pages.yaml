  md: "# Yeti\n\nYeti is another tool designed to work with YUI Test. Unlike the YUI\
    \ Selenium Driver, Yeti is a completely standalone solution written in JavaScript\
    \ that runs on Node.js. Yeti requires you to have an HTML file that automatically\
    \ executes your tests, so you can use the same HTML files that are used with the\
    \ YUI Selenium Driver.\n\nYou can install Yeti via npm with:\n\n```\nsudo npm\
    \ install -g yeti\n```\n\nRunning Yeti is simply a matter of passing in the HTML\
    \ file on the command line:\nyeti test.html\n\nThis command runs all of the tests\
    \ on Firefox or Safari by default (depending on platform) and outputs the result\
    \ to the command line. If a Yeti server is running locally, this command also\
    \ runs tests on all connected browsers and reports all results.\n\nDue to the\
    \ simplicity of Yeti, the Ant target requires very little configuration in a property:\n\
    \n```\nsrc.dir = ./src\nlib.dir = ./lib\ntests.dir = ./tests\n```\n\nyeti = yeti\n\
    \nAnd the Ant itself is very straightforward as follows:\n\n```\n<target name=\"\
    yeti\" failonerror=\"true\" parallel=\"true\">\n  <fileset dir=\"${tests.dir}\"\
    \ includes=\"**/*.html\" />\n  <srcfile/>\n</apply>\n```\n\n```\n</target>\n```\n\
    \nThe test uses the <apply> task to pass all HTML files found in the tests directory\
    \ to Yeti. The results are output on the screen, and the build will fail if there\
    \ are errors.\n\nThe Buildr yeti task makes using Yeti even simpler:\n\n```\n\
    <target name=\"test\">\n```\n\n```\n<yeti>\n  <fileset dir=\"${tests.dir}\" includes=\"\
    **/*.html\" />\n</yeti>\n```\n\n```\n</target>\n```\n\nKeep in mind that the <yeti>\
    \ task requires you to have Yeti already installed on the computer that is executing\
    \ the build script."
  merge: -1
