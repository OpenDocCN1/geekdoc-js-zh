- img_proc: true
  md: "```\n// Bad: Looks like a block statement\ndoSomething(item);\n\n// Block statement\
    \ for comparison\nwhile (item) {\n  // do something\n}\n```\n\nCrockford's Code\
    \ Conventions explicitly calls this out. The Dojo Style Guide, Sprout-Core Style\
    \ Guide, and Google JavaScript Style Guide implicitly recommend this style through\
    \ code examples.\n\nThe jQuery Core Style Guide specifies that an extra space\
    \ should be included after the opening parenthesis and before the closing parenthesis,\
    \ as as:\n\n```\n// jquery-style\ndoSomething(item );\n```\n\nThe intent here\
    \ is to make others exceptions easier to read. The jQuery Core Style Guide also\
    \ lists some exceptions when passed a single argument that is an object literal,\
    \ array literal, function expression, or string. So the following examples are\
    \ still considered valid:\n\n```\n// jquery exceptions\ndoSomething(function()\
    \ {\\ndoSomething({ item: item });\ndoSomething(({ item });\ndoSomething(\"HI!\"\
    );\n```\n\nGenerally speaking, styles with more than one exception are not good,\
    \ because they can be confusing to developers.\n\n# Immediate Function Invocation\n\
    \nJavaScript allows you to declare anonymous functions—functions without proper\
    \ names—and assign those functions to variables or properties. For example:\n\n\
    ```\nvar doSomething = function() {\n  // function body\n};\n```\n\nSuch anonymous\
    \ functions can also be immediately invoked to return a value to the variable\
    \ by including parentheses at the very end:\n\n```\n// Bad\nvar value = function()\
    \ {\n  // function body\n\n  return {\n    message: \"Hi\"\n  }\n}();\n```"
  merge: -1
  pgno: 60
- img_proc: true
  md: "In the previous example, value ends up being assigned an object, because the\
    \ function is immediately invoked. The problem with this pattern is that it looks\
    \ very similar to assigning an anonymous function to a variable. You don't know\
    \ that isn't the case until you get to the very last line and see the parentheses.\
    \ This sort of confusion hinders the readability of your code.\n\nTo make it obvious\
    \ that immediate function invocation is taking place, put parentheses around the\
    \ function, as in this example:\n\n```\n// Good\nvar value = (function() {\n \
    \ // function body\n  return {\n    message: \"Hi\"\n  }\n});\n```\n\nThis code\
    \ now has a sign on the first line, open paren, that the function is immediately\
    \ invoked. Adding the parentheses doesn't change the behavior of the code at all.\
    \ Crockford's Code Conventions recommends this pattern, and JSLint will warn when\
    \ the parentheses are missing.\n\n# Strict Mode\n\nECMAScript 5 introduced strict\
    \ mode, a way to alter how JavaScript is executed and parsed in the hopes of reducing\
    \ errors. To put a script into strict mode, use the following pragma:\n\n```\n\
    \"use strict\";\n```\n\nAlthough this looks like a string that isn't assigned\
    \ to a variable, ECMAScript 5 JavaScript engines treat this as a command to switch\
    \ into strict mode. This pragma is valid both globally and as locally, inside\
    \ a single function. However, it's a common recommendation (though undocumented\
    \ in any popular style guide) to avoid placing \"use strict\" in the global scope.\
    \ The reason is that strict mode applies to all code in a single file, so if you're\
    \ concatenating 11 files and one of them has strict mode enabled, all the files\
    \ are placed into strict mode. Because strict mode operates under slightly different\
    \ rules than non mode, there's a high likelihood of errors within the other files.\
    \ For this reason, it's best to avoid placing \"use strict\" in the global scope.\
    \ Here are some examples:\n\n```\n// Bad - global strict mode\n\"use strict\"\
    ;\n\nfunction doSomething() {\n  // code\n}\n```"
  merge: -1
  pgno: 61
- img_proc: true
  md: "```\n// Good\nfunction doSomething() {\n  \"use strict\";\n  // code\n}\n```\n\
    \nIf you want strict mode to apply to multiple functions without needing to write\
    \ \"use strict\" multiple times, use immediate function invocation:\n\n```\n//\
    \ Good\n(function() {\n  \"use strict\";\n\n  function doSomething() {\n    //\
    \ code\n  }\n\n  function doSomethingElse() {\n    // code\n  }\n})();\n```\n\n\
    In this example, doSomething() and doSomethingElse() both run in strict mode,\
    \ because they are contained in an immediately invoked function with \"use strict\"\
    \ specified.\n\nBoth JSLint and JSH warn when \"use strict\" is outside of a function.\
    \ Both expect all functions to have \"use strict\" specified by default; this\
    \ can be turned off in both tools. I recommend using strict mode wherever possible\
    \ to limit common mistakes.\n\n# Equality\n\nEquality in JavaScript is tricky\
    \ due to type coercion. Type coercion causes variables of a specific type to be\
    \ converted automatically into a different type for a particular operation to\
    \ succeed, which can lead to unexpected results.\n\nOne of the main areas where\
    \ type coercion occurs is with the use of equality operators, == and !=. These\
    \ two operators cause coercion when the two values being compared are not the\
    \ same data type, no coercion occurs. There are many instances in which this code\
    \ may not be doing what you expect.\n\nIf you compare a number to a string, the\
    \ string is first converted to a number, and then the comparison happens. Some\
    \ examples:\n\n```\n// The number 5 and string 5\nconsole.log(5 == \"5\"); //\
    \ true\n```\n\n```\n// The number 25 and hexadecimal string 25\nconsole.log(25\
    \ == \"0x19\"); // true\n```"
  merge: -1
  pgno: 62
- img_proc: true
  md: "When performing type coercion, the string is converted to a number as using\
    \ the Number() casting function. Because Number() understands hexadecimal format,\
    \ it will convert a string that looks like a hexadecimal number into the decimal\
    \ equivalent before the comparison occurs.\n\nIf a boolean value is compared to\
    \ a number, then the boolean is converted to a number before comparison. A false\
    \ value becomes 0 and true becomes 1. For example:\n\n```\n// The number 1 and\
    \ true\nconsole.log(1 == true); // true\n\n// The number 0 and false\nconsole.log(0\
    \ == false); // true\n\n// The number 2 and true\nconsole.log(2 == true); // false\n\
    ```\n\nIf one of the values is an object and the other is not, the object's valueOf()\
    \ method is called to get a value to compare against. If valueOf() is not defined,\
    \ then toString() is called instead. After that point, the comparison continues\
    \ following the previously discussed rules about mixed types. For example:\n\n\
    ```\nvar object = {\n  toString: function() {\n    return \"019\"\n  }\n};\n\n\
    console.log(object == 25); // true\n```\n\nThe object is deemed to be equal to\
    \ the number 25 because toString() method returns the hexadecimal string \"019\"\
    , which was converted to a number before being compared to 25.\n\nThe last instance\
    \ of type coercion occurs between null and undefined. These two special values\
    \ are deemed to be equivalent simply by the letter of the ECMAScript standard:\n\
    \n```\nconsole.log(null == undefined); // true\n```\n\nBecause of type coercion,\
    \ avoiding == and != is at all is recommended; instead, use === and !=. These\
    \ operators perform comparison without type coercion. If two values do not have\
    \ the same type, they are automatically considered to be unequal, allowing your\
    \ comparison statements to always perform the comparison in a way that is more\
    \ consistent. The differences between == and === in a few cases:\n\n```\n// The\
    \ number 5 and string 5\nconsole.log(5 == \"5\"); // true\nconsole.log(5 === \"\
    5\"); // false\n\n// The number 25 and hexadecimal string 25\nconsole.log(25 ==\
    \ \"019\"); // true\nconsole.log(25 === \"019\"); // false\n```"
  merge: -1
