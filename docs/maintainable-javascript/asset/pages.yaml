  md: 'JavaScript/Web Development


    # Maintainable JavaScript


    You may define ideas about writing code when working alone, but team development
    requires everyone to use the same approach. With the JavaScript practices in this
    book—including code style, programming tips, and automation—you’ll learn how to
    write maintainable code that team members can easily understand, adapt, and extend.


    > “This book is an indispensable guide to writing future-proof JavaScript, particularly
    in a team environment.”—

    —Ryan Grove


    Author Nicholas Zakas established this collection of practices as a front-end
    leader at Yahoo!, after completing his journey from solo hacker to team player.
    He also includes rules recommended by other industry authorities. Use these tips
    and techniques to help your team aside individual preferences and function at
    a higher level.


    > “Nicholas managed to condense the essence of his 10+ years of experience in
    200 easy to read pages. This is the book I wish every developer and CS student
    had read as early as possible. No matter your experience level, every single page
    of this book will make you a better developer, who’s a pleasure to work with.”—

    —Lea Verou


    +   - Establish specific code conventions for your team

    - Use tools as ESLint and JHint to keep your team on track

    - Adopt style guidelines, such as basic formatting, to help your team produce
    uniform code

    - Apply several programming practices to solve problems and improve code quality

    - Create an automated JavaScript build system using a variety of utilities

    - Integrate browser-based JavaScript testing with tools such as the YUI Test Selenium
    Driver


    Nicholas C. Zakas is a front-end consultant, author, and speaker. He worked at
    Yahoo! for almost five years, he was front-end lead for the Yahoo! homepage and
    a contributor to the YUI library. He is the author of High Performance JavaScript
    (O''Reilly) and Professional JavaScript for Web Developers (Wrox).


