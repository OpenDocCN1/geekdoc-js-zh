    \ if (element === needle || !element[COMPARE_DOCUMENT_POSITION](needle & 16))\
    \ {\n    ret = true;\n  }\n```\n\nreturn ret;\n\nLine 6 of this code has a very\
    \ important comment. Even though Internet Explorer and Safari both include the\
    \ contains() method natively, the method will fail if needle is not an element.\
    \ The method should be used only if the browser is Opera or if the element.nodeType\
    \ is 1). The note about the browsers, and why if the statement is needed, only\
