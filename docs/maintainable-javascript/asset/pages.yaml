  md: '# CHAPTER 3


    # # Statements and Expressions


    Statements such as if and for can be used in two ways in JavaScript, with curly
    braces for multiple contained lines or without curly braces for one contained
    line. For example:


    ```

    // Bad, though technically valid JavaScript

    if(condition)

    dosoSomething();

    ```


    ```

    // Bad, though technically valid JavaScript

    if(condition)

    dosoSomething();

    ```


    ```

    // Good

    if (condition) {

    dosoSomething();

    }

    ```


    ```

    // Bad, though technically valid JavaScript

    if (condition) { doSomething(); }

    ```


    The first two forms, which use an if statement without braces, are explicitly
    disallowed in Crockford''s Code Conventions, the jQuery Core Style Guide, the
    SproutCore Style Guide, and the Dojo Style Guide. The omission of braces also
    generates warnings by default in JSLint and JSHint.


    An overwhelming majority of JavaScript developers are in agreement that block
    statements should always use braces and always occupy multiple lines instead of
    one. This is because of the confusion created when braces aren''t included. Consider
    the following:


    ```

    if (condition)

    dosoSomething();

    dosoSomethingElse();

    ```


    It''s difficult to tell whether the error is an indentation error, here, but it''s
    impossible to know whether the last line should not be indented) or braces are
    missing because both line 2 and line 3 need to be executed inside the if statement.
    Adding braces makes the error easier to find. Here are two other examples with
    errors:'
  merge: -1
  pgno: 46
- img_proc: true
  md: "```\nif (condition) {\n    doSomething();\n}\nif (condition) {\n    doSomething();\n\
    \    doSomethingElse();\n}\n```\n\nIn both of these examples, the code error is\
    \ clear, as both obviously have indentation errors. The braces allow you to quickly\
    \ determine the author's intent and make an appropriate change without fear of\
    \ changing the code logic.\n\nBraces should be used for all block statements,\
    \ including:\n\n+   * if\n* for\n* while\n* do...while\n* try...catch...finally\n\
    \n# Brace Alignment\n\nA second topic related to block statements is the alignment\
    \ of braces. There are two main styles of brace alignment. The first is to have\
    \ the opening brace on the same line as the beginning of the block statement,\
    \ as in this example:\n\n```\nif (condition) {\n    doSomething();\n} else {\n\
    \    doSomethingElse();\n}\n```\n\nJavaScript inherited this style from Java,\
    \ where it is documented in the Code Conventions for the Java Programming Language.\
    \ This style also appears in Crockford's Code Conventions, the jQuery Core Style\
    \ Guide, the SproutCore Style Guide, the Google JavaScript Style Guide, and the\
    \ Dojo Style Guide.\n\nThe second style of brace alignment places the opening\
    \ brace on the line following the beginning of the block statement, as in this\
    \ example:\n\n```\nif (condition) {\n    doSomething();\n} else {\n    doSomethingElse();\n\
    }\n```"
  merge: -1
  pgno: 47
- img_proc: true
  md: "This style was made popular by C#, as Visual Studio enforces this alignment.\
    \ There are no major JavaScript guides that recommend this style, and the Google\
    \ JavaScript Style explicitly forbids it due to fears of automatic semicolon insertion\
    \ errors. My recommendation is to use this precise brace format.\n\n# Block Statement\
    \ Spacing\n\nSpacing around the first line of a block statement is also a matter\
    \ of preference. There are three primary styles for block statement spacing. The\
    \ first is to have no spaces separating the statement name, the opening parenthesis,\
    \ and the opening brace:\n\n```\nif(condition)\n  doSomething();\n}\n```\n\nThis\
    \ style is preferred by some programmers because it is more compact, though some\
    \ complain that the compactness actually inhibits legibility. The Dojo Style Guide\
    \ recommends this.\n\nThe second style is to have a space separation before the\
    \ opening parenthesis and after the closing parenthesis, such as:\n\n```\nif (condition)\
    \ {\n  doSomething();\n}\n```\n\nSome programmers prefer this style because it\
    \ makes the statement type and condition more legible. The style is recommended\
    \ by Crockford's Code Conventions and the Google JavaScript Style Guide.\n\nThe\
    \ third style adds spaces after the opening parenthesis and before the closing\
    \ parenthesis, as in the following:\n\n```\nif ( condition ) {\n  doSomething();\n\
    }\n```\n\nThis is the style prescribed in the jQuery Core Style Guide, because\
    \ it makes all aspects of the statement start clear and legible.\n\nI prefer the\
    \ second style as a nice compromise between the first and third styles.\n\n# The\
    \ switch Statement\n\nDevelopers tend to have a love-hate relationship with the\
    \ switch statement. There are varying ideas about how to use switch statements\
    \ and how to format them. Some of this variance comes from the switch statement's\
    \ lineage, originating in C and making its way through Java into JavaScript without\
    \ the exact same syntax."
  merge: -1
  pgno: 48
- img_proc: true
  md: "Despite the similar syntax, JavaScript switch statements behave differently\
    \ than in other languages: any type of value may be used in a switch statement,\
    \ and any expression can be used as a valid case. Other languages require the\
    \ use of primitive values and constants, respectively.\n\n# Indentation\n\nIndentation\
    \ of the switch statement is a matter of debate among JavaScript developers. Many\
    \ use the Java style of formatting switch statements, which looks like this:\n\
    \n```\n```\nswitch(condition) {\n  case \"first\":\n    // code\n    break;\n\
    \  case \"second\":\n    // code\n    break;\n  case \"third\":\n    // code\n\
    \    break;\n  default:\n    // code\n}\n```\n```\n\nThe unique parts of this\
    \ format are:\n\n+   - Each case statement is indented one level from the switch\
    \ keyword.\n- There is an extra line before and after each case statement from\
    \ the second one on.\n\nThe format of switch statements is rarely included in\
    \ style guides when this style is used, primarily because it is the format that\
    \ I prefer, both that many editors use automatically.\n\nAlthough this is true,\
    \ Crockford's Code Conventions and the Dojo Style Guide recommend a slightly different\
    \ format:\n\n```\n```\nswitch(condition) {\n  case \"first\":\n    // code\n \
    \   break;\n  case \"second\":\n    // code\n    break;\n  case \"third\":\n \
    \   // code\n    break;\n  default:\n    // code\n}\n```\n```"
  merge: -1
  pgno: 49
- img_proc: true
  md: "The major difference between this and the previous format is that the case\
    \ keyword is aligned to the same column as the switch keyword. Note also that\
    \ there are no blank lines between any parts of the statement. JSLint expects\
    \ this indentation for switch statements by default and will warn if a case is\
    \ not aligned with switch. This option may also be turned on and off via the “Tolerate\
    \ messy space” option. JSLint does not warn if additional blank lines are included.\n\
    \nAs with other aspects of coding style, this choice is completely a matter of\
    \ preference.\n\n# Falling Through\n\nAnother popular source of debate is whether\
    \ falling through from one case to another is an acceptable practice. Accidentally\
    \ omitting a break at the end of a case is a very common source of bugs, as Douglas\
    \ Crockford argues that every case should end with break, return, or throw, without\
    \ exception. JSLint warns when one case falls through into another.\n\nI agree\
    \ with those who consider falling through to be an acceptable method of programming,\
    \ as long as it is clearly indicated, as follows:\n```\n\n```\nswitch(condition)\
    \ {\n  // obvious fall through\n  case \"first\":\n  case \"second\":\n    //\
    \ code\n    break;\n  case \"third\":\n    // code\n    /*falls through*/\n  default:\n\
    \    // code\n}\n```\n\nThis switch statement has two obvious fall-throughs. The\
    \ first case falls into the second, which is considered an acceptable practice\
    \ (even by JSLint) because there are no statements to run for just the first case\
    \ and there are no extra lines separating the two cases.\n\nThe second instance\
    \ is with case \"third\", which falls through into the default handler. This fall-through\
    \ is marked with a comment to indicate developer intent. In this code, it's obvious\
    \ that the case is meant to fall through and isn't a mistake. JSHint typically\
    \ warns when a case falls through unless you include this comment, in which case\
    \ the warning is turned off because you've signaled that this isn't an error."
  merge: -1
  pgno: 50
- img_proc: true
  md: "Crockford's Code Conventions disallows fall-throughs in switch statements altogether.\
    \ The jQuery Core Style Guide mentions that fall-throughs are used in their code,\
    \ and the Dojo Style Guide gives an example with a fall-through comment. My recommendation\
    \ is to allow fall-throughs as long as a comment is used to indicate that the\
    \ fall-through is intentional.\n\n# default\n\nAnother point of contentention\
    \ with regard to switch is whether a default case is required. Some believe that\
    \ a default should always be included even if the default action is to do nothing,\
    \ as in:\n\n```\nswitch(condition) {\n    case \"first\":\n        // code\n \
    \       break;\n    case \"second\":\n        // code\n        break;\n    default:\n\
    \        // do nothing\n}\n```\n\nYou're likely to find open JavaScript code following\
    \ this pattern, including default and just leaving a comment that nothing should\
    \ happen there. Although no style guides are explicit about this, both Douglas\
    \ Crockford's Code Conventions for the JavaScript Programming Language and the\
    \ Dojo Style Guide include default as part of their standard switch statement\
    \ format.\n\nMy preference is to omit default when there is no default action\
    \ and annotate it using a comment, as in this example:\n\n```\nswitch(condition)\
    \ {\n    case \"first\":\n        // code\n        break;\n    case \"second\"\
    :\n        // code\n        break;\n    // no default\n}\n```\n\nThis way, the\
    \ code author's intent is clear that there should be no default action, and you\
    \ save some bytes by not including extra unnecessary syntax."
  merge: -1
  pgno: 51
- img_proc: true
  md: "# The with Statement\n\nThe with statement changes how the containing context\
    \ interprets variables. It allows properties and methods from a particular object\
    \ to be accessed as if they were local variables and functions, omitting the object\
    \ identifier altogether. The intent of with is to lessen the amount of typing\
    \ developers need to do when using multiple object members in close proximity.\
    \ For example:\n\n```\nvar book = {\n  title: \"Maintainable JavaScript\",\n \
    \ author: \"Nicholas C. Zakas\"\n};\n\nvar message = \"The book is {}\n\nwith\
    \ (book) {\n  message += title + \" by \" + author;\n}\n```\n\nIn this code, the\
    \ with statement is used to augment identifier resolution within the curly braces\
    \ allowing the properties of book to be accessed as if they were variables. The\
    \ problem is that it's hard to tell which title and author originated from. It\
    \ is not clear that these are properties of book and that message is a local variable.\
    \ This confusion extends far beyond developers, with JavaScript engines and minifiers\
    \ being forced to skip optimization of this for fear of guessing incorrectly.\n\
    \nThe with statement is actually disallowed in strict mode, causing a syntax error\
    \ and indicating the ECMAScript committee's belief that with should no longer\
    \ be used. Crockford's Code Conventions and the Google JavaScript Style Guide\
    \ dissu the use of with. I strongly recommend avoiding the with statement, as\
    \ it prevents you from easily applying strict mode to your code (a practice I\
    \ recommend).\n\n# The for Loop\n\nThere are two types of for loops: the traditional\
    \ for loop that JavaScript inherited from C and Java, as well as the for-in loop\
    \ that iterates over properties for an object. These two loops, though similar,\
    \ have very different uses. The traditional for loop is typically used to iterate\
    \ over members of an array, such as:\n\n```\nvar values = [ 1, 2, 3, 4, 5, 6,\
    \ 7 ];\n i, len;\n\nfor (i=0, len=values.length; i < len; i++) {\n  process(values[i]);\n\
    }\n```\n\nThere are two ways to modify how the loop proceeds (aside from a return\
    \ or throw statement). The first is to use the break statement. Using break causes\
    \ the"
