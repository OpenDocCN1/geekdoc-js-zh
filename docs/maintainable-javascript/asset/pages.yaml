    \ mode as opposed to what actually gets into production, and that's okay. The\
    \ important thing is that you're actually handling the error, not just ignoring\
    \ it.\n\n# # Error Types\n\nECMA-262 specifies seven error object types. These\
    \ are used by the JavaScript engine when various error conditions occur and can\
