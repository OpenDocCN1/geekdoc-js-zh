  md: "This code starts looking for the standard requestAnimationFrame() method, and\
    \ only if it's not found does it continue to look for the browser-specific implementation.\
    \ The very last option, for browsers with no support, is to use setTimeout() instead.\
    \ Once again, this code won't need to be updated even after the browsers have\
    \ switched to using standards-based implementation.\n\n# Avoid Feature Inference\n\
    \nOne inappropriate use of feature detection is called feature inference. Feature\
    \ inference attempts to use multiple features after validating the presence of\
    \ only one. The presence of one feature is inferred by the presence of another.\
    \ The problem is, of course, that inference is an assumption rather than a fact,\
    \ and that can lead to maintenance issues. For example, here's some code using\
    \ feature inference:\n\n```\n// Bad - uses feature inference\nfunction getById(id)\
    \ {\n\n  var element = null;\n\n  if (document.getElementsByTagName) { // DOM\n\
    \    element = document.ActiveXObject(id);\n  } else if (window.ActiveXObject)\
    \ { // IE\n    element = document.all[id];\n  } else {\n    element = document.layers[id];\
    \ // Netscape <= 4\n  }\n\n  return element;\n}\n```\n\nThis function is feature\
    \ inference at its worst. There are several inferences being made:\n\n+   * If\
    \ document.getElementsByTagName() is present, then document.getElementById() is\
    \ present. In essence, this assumption is inferring from the presence of one DOM\
    \ method that all DOM methods are available.\n* If window.ActiveXObject is present,\
    \ then document.all is present. This inference basically says that window. present\
    \ for Internet Explorer, and document.all is also present in Internet Explorer,\
    \ if you know one is there then the other must also be in. In some versions of\
    \ Opera supported document.all.\n* If neither of these inferences is true, then\
    \ it must be Netscape Navigator 4 or earlier. This isn't strictly true.\n\nYou\
    \ cannot infer the existence of one feature based on the existence of another\
    \ feature. The relationship between two features is tenuous at best and circumstantial\
    \ at worst. It's like saying, \"If it looks like a duck, then it must quack like\
    \ a duck.\""
