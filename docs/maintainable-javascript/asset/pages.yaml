  md: '# CHAPTER 17


    # Minification and Compression


    Once you have your built files validated, concatenated, and baked, it''s time
    to make those files as small as possible. This step is accomplished with two processes:
    minification and compression. Minification is the process of eliminating unnecessary
    white space, removing comments, and performing some processing on the files to
    make them as small as possible. Compression uses a specific compression method,
    such as gzip, to shrink the file further. The difference between a minified file
    and a compressed file is that minified files are still plain text and can be edited
    and loaded as usual (albeit with a bit of trouble, because all formatting is removed),
    whereas compressed files are unreachable and must be decompressed to be usable
    in a web page. Today''s browsers automatically decompress any compressed files
    they receive with a Content-Encoding: gzip header in the response.


    # Minification


    Minifying a JavaScript file isn''t very complicated, but mistakes or invalid syntax
    can result if you use an unsafe process. For this reason, it''s best to use a
    minifier that actually parses the JavaScript before making changes. Parsers know
    what valid syntax is and can easily create valid syntax. The three most popular
    parsing minifiers are:


    YUI Compressor


    Often credited with popularizing parser-based minifiers instead of the regular
    expression-based minifiers. YUI Compressor was first written by Julien Comte (and
    is now maintained by the YUI team); it removes comments and extra white space
    and replaces local variable names with single- or double-character names to save
    even more space. YUI Compressor considers syntax and runtime safety as its priority,
    so it turns off variable replacement in cases in which errors might occur (such
    as using eval() or with). Download from http://yuilibibrary.com/projects/yicomcompress/'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'Closure Compiler

    A parser-based minifier that tries to make your code as small as possible. The
    Closure Compiler is written and maintained by Google engineers; it removes comments
    and extra white space and performs variable replacement, but also inspects your
    code for ways to optimize. For instance, it can detect that a function isn''t
    used and simply remove it. It can also detect that a function is used only once
    and put inline. For this reason, Closure Compiler works best used on all of your
    JavaScript code at once. Download from http://code.google.com/closure/compiler/


    UglifyJS

    Credited with being the first NodeJs-based JavaScript minifier, UglifyJS is written
    in JavaScript using a JavaScript-based parser. Written by Mihai Bazon, UglifyJS
    removes comments and extra white space, replaces variable names, combines var
    statements, and performs optimizations along the way. Download from https://github.com/mishou/uglifyjs
    or install using npm.


    Exactly which minifier to use is a matter of preference. Some prefer YUI Compressor
    because of its focus on ensuring the resulting code doesn''t contain errors and
    simple optimizations. Others prefer Closure Compiler because it tends to produce
    files that are smaller than YUI Compressor. Others prefer UglifyJS because it
    doesn''t rely on Java and produces fewer syntax errors than Closure Compiler while
    also producing the smallest possible result.


    # Minifying with YUI Compressor


    YUI Compressor ships as an executable JAR file that should be placed in your project''s
    dependencies folder (in example, this folder is referred to as *lib.dir*). There
    are several command-line options, but the most important to know are:


    ```

    --disable-optimizations

    Turns off micro optimizations as changing obj["prop"] to obj.prop

    --line-break <column>

    Specifies to breaks lines at the given column rather than creating a single line
    of output

    --nomunge

    Turns off local variable name replacement

    --preserve-semi

    Turns off removal of unnecessary semicolons

    ```


    Once you decide which options to use, place them in a Java properties file, as
    in the following example:'
  merge: -1
  pgno: 169
- img_proc: true
  md: "```\nsrc.dir = ./src\nlib.dir = ./lib\n```\n\n```\nyuicompressor = ${lib.dir}/yuicompressor.jar\n\
    ```\n\n```\nyuicompressor.options = --preserve-semi\n```\n\nNext, create a target\
    \ for minification. With validation, it's helpful to look at the command-line\
    \ syntax first. To run YUI Compressor on the command line, type the following:\n\
    \n```\njava -jar yuicompressor.jar [options] [file] -o [outputfile]\n```\n\nFor\
    \ example:\n\n```\njava -jar yuicompressor.jar --preserve-semi core/core.js -o\
    \ core/core-min.js\n```\n\nThis command runs YUI Compressor on core/core.js and\
    \ outputs the result to core-min.js. Appending -min to the filename is a common\
    \ practice when minifying files, so that does as well. The <apply> task is once\
    \ again the one to use, and here's the:\n\n```\n<target name=\"minify\">\n  <apply\
    \ executable=\"java\" failonerror=\"true\">\n    <fileset dir=\"${build.dir}\"\
    \ includes=\"*.js\"/>n    <mapper type=\"glob\" from=\"*.js\" to=\"${build.dir}/*.min.js\"\
    />n    <arg line=\"-jar\" />\n    <arg path=\"${yuicompressor}\" />\n    <arg\
    \ line=\"${yuicompressor.options}\" />\n    <srcfile/>\n    <arg line=\"-o\" />\n\
    \    <|targetfile|>\n  </apply>\n</target>\n```\n\nThis is very similar to the\
    \ validate target from earlier in the book. By specifying the executable as java\
    \ it indicates that the command should be run on all JavaScript files in the build\
    \ directory. These files get read one by one and are put in the place of <srcfile/>.\
    \ The next line uses the <mapper> task to translate filenames. It takes a <srcfile/>\
    \ and appends -min to the filename. So core.js becomes core-min.js, and this value\
    \ is used in place of the <targetfile/> element. The rest of the <arg> elements\
    \ are self-explanatory.\n\nThe minify task is designed to be used after you've\
    \ built your files into the build directory but can easily be modified in any\
    \ directory."
