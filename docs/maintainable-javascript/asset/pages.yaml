  md: "```\n// Also valid JavaScript\nvar name = 'Nicholas, \"Hi\";\n```\n\nUnlike\
    \ other languages such as Java and PHP, there is absolutely no functional difference\
    \ between using double quotes and single quotes for strings. They behave exactly\
    \ the same, that the string delimiter must be escaped. So in this example, the\
    \ string using double quotes, we had to escape the double quote characters, and\
    \ in the string using single quotes, we did not. What matters is that you pick\
    \ a single style and stick with it throughout the code base.\n\nCrockford's Code\
    \ Conventions and the jQuery Core Style Guide both specify the use of double quotes\
    \ for strings. The Google JavaScript Style Guide specifies the use of single quotes\
    \ for strings. I prefer using double quotes, because I tend to switch back and\
    \ forth between writing Java and JavaScript frequently. Because Java uses only\
    \ double quotes for strings, I find it easier to switch contexts by maintaining\
    \ that convention. This sort of issue should be a consideration when developing\
    \ conventions: do what makes it easiest for engineers to do their jobs.\n\nAnother\
    \ aspect of strings is the hidden ability to create multiline strings. This feature\
    \ was never specified as part of the JavaScript language but still works in all\
    \ engines:\n\n```\n// Bad\nvar longString = \"Here's the story, of a man \\\n\
    named Brady.\";\n```\n\nAlthough this is technically invalid JavaScript syntax,\
    \ it effectively creates a multiline string in code. This technique is generally\
    \ frowned upon because it relies on a language quirk rather than a language feature,\
    \ and it is explicitly forbidden in the Google JavaScript Style Guide. Instead\
    \ of using multiline strings, split the string into multiple strings and concatenate\
    \ them together:\n\n```\n// Good\nvar longString = \"Here's the story, of a man\
    \ \" + \n\"named Brady.\";\n```\n\n# Numbers\n\nThe number type is unique to JavaScript,\
    \ because all types of numbers—integers and floats—are stored in the same data\
