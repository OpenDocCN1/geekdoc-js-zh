  md: 'In most <property> there are a small number of targets that you''ll use frequently.
    The majority of targets are single steps that are designed to be by rollup targets
    that execute multiple targets in a specific order.


    # Properties


    Ant properties are similar to variables in JavaScript, as they are generic containers
    for data that can be changed and manipulated throughout execution of the build
    script. A property is defined using the <property> element:


    ```

    <project name="maintainablejs">


    <property name="version" value="0.1.0" />


    </project>

    ```


    Each <property element requires name and value attributes. You can later reference
    the property by using $(version), such as:

    Version is $(version)


    When this Ant script executes, the output is:

    Buildfile: /home/nicholas/tmp/build.xml


    version:

    [echo] Version 0.1.0


    BUILD SUCCESSFUL

    total time: 0 seconds


    The special {} syntax is used any time you want to insert a property value into
    task. Properties can also be defined in a Java properties files and loaded directly
    into Ant. For instance, suppose you have a properties file build.properties containing
    the following:


    ```

    version = 0.1.0

    copyright = Copyright 2012 Nicholas C. Zakas. All rights reserved.

    ```


    You can import these properties into the Ant script by using the <loadproperties>
    element and specifying the filename with the srcfile attribute:


    ```

    <project name="maintainablejs" default="version">


    <loadproperties srcfile="build.properties" />


    <target name="version">

    <echo>Version is ${version}</echo>

    </target>


    </project>

    ```'
