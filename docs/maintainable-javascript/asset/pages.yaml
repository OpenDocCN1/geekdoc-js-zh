    from the code that uses the data.


    # # Storing Configuration Data


    Configuration data is best stored in a separate file to create a clean separation
    between and application logic. A good starting point is to have a separate JavaScript
    file for configuration data. Once the configuration data is in a separate file,
    it opens up more possibilities for managing that. A worthwhile option is moving
    your configuration data into a non-JavaScript file.


    Even though you''re writing a JavaScript application, JavaScript isn''t a great
    way to store configuration data. That''s because the syntax is that of a programming
    language, so you need to be sure you haven''t introduced errors. If you end up
    concatenating JavaScript files then a syntax error in a single line breaks the
    overall application. Configuration data truly belongs in files that are hard to
    format incorrectly, and once you have that file, it is trivial to convert the
    configuration data into a JavaScript format automatically.


    One of my favorite formats for configuration data is a Java properties file. Java
    properties files are simple name-value pairs in which each pair takes a single
    line (unless there are put in a multi-line sequence) in the form name=value. It
    doesn''t matter if there are spaces around the equals sign, so syntax isn''t hard
    to get. Comments are indicated by the preceding line with a # character. Here''s
    an example:


    ```

    # UI Strings

    MSG_INVALID_VALUE = Invalid value


    # URLs

    URL_INVALID = /errors/invalid.php


    # CSS Classes

    CSS_SELECTED = selected

    ```


    This properties file contains the same properties as the config object from the
    previous example. Notice how much simpler the file layout is. There are no quoted
    strings, which means that you don''t have to worry about proper escaping or forgetting
    to close a string. There are also no semicolons or commas to worry about. You
    can simply put in your data and not worry about JavaScript syntax at all.


    The next step is to convert this file into something that''s usable by JavaScript.
    There are generally three formats in which you want your configuration data. The
    first is'
