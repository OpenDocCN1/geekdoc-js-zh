  md: "# CHAPTER 9\n\n# Separate Configuration Data from Code\n\nCode does nothing\
    \ more than define a set of instructions for a computer to execute. Data is frequently\
    \ passed around and modified by those instructions, ultimately producing a result.\
    \ The problem comes when the data must change. There's a risk of creating an error\
    \ any time you edit source code, and editing code just to change some data value\
    \ introduces unnecessary risk for something that shouldn't affect the rounding\
    \ instructions. Well-designed applications keep vital data outside of the main\
    \ source code to ensure worry-free editing.\n\n# What Is Configuration Data?\n\
    \nConfiguration data is any hardcoded value in an application. Consider the following\
    \ example:\n\n```\n// Configuration data embedded in code\nfunction validate(value)\
    \ {\n  if (value) {\n    alert(\"Invalid value\");\n    location.href = \"errors/invalid.php\"\
    ;\n  }\n}\n\nfunction toggleSelected(element) {\n  if (hasClass(element, \"selected\"\
    )) {\n    removeClass(element, \"selected\");\n  } else {\n    addClass(element,\
    \ \"selected\")\n  }\n}\n```\n\nThere are three pieces of configuration data in\
    \ the code. The first is the string \"Invalid value,\" which is displayed to the\
    \ user. As a UI string, there's a good chance that it will change frequently.\
    \ The second is the URL /errors/invalid.php. URLs tend to change as"
  merge: -1
  pgno: 108
