  md: 'Properties loaded using <loadproperties> are accessible in the same manner
    as those defined explicitly within build.xml. For a large number of properties,
    or properties that need to be shared among Ant scripts, it''s best to have them
    in a separate Java properties file.


    At a minimum, it''s best to have several properties declared that can be used
    throughout your project, such as:


    +   src.dir


    +   The root source code location


    +   build.dir


    +   Where the built files should end up


    Throughout the rest of this book, you''ll see these properties used in Ant tasks.
    Be sure to define them appropriately in your project.


    # Buildr


    Buildr (https://github.com/nzakas/buildr) is a project that seeks to collect common
    frontend-related Ant tasks with easier JavaScript syntax. A wide range of tools
    is available for working with JavaScript files, but they work a bit differently.
    Buildr wraps all of these different tools in tasks that can be used in your Ant
    scripts.


    To use Buildr, you must first get a copy of the source. Once you have the directory
    structure on your computer, you can import all of the tasks with this command:


    ```

    <import file="/path/to/buildr/buildr.xml/>

    ```


    This command allows your build.xml file to make use of all the custom tasks defined
    in Buildr. The following chapters show you both how to create Ant tasks from scratch
    as well as how to use the Buildr tasks.'
