    ```\n// Null and undefined\nconsole.log(null == undefined);\nconsole.log(null\
    \ === undefined);\n```\n\n```\n// true\n// false\n```\n\nUse of == and != is recommended\
    \ by Crockford's Code Conventions, the jQuery Style Guide, and the SproutCore\
