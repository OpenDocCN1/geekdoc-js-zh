  md: "# Object Literals\n\nObject literals should have the following format:\n\n\
    +   - The opening brace should be on the same line as the containing statement.\n\
    - Each property-value pair should be indented one level with the first property\
    \ pairing on the next line after the opening brace.\n- Each property-value pair\
    \ should have an unquoted property name, followed by a colon (no space preceding\
    \ it), followed by the value.\n- If the value is a function, it should wrap under\
    \ the property name and should have a blank line before and after the function.\n\
    - Additional empty lines may be inserted to group related properties or otherwise\
    \ improve readability.\n- The closing brace should be on a separate line.\n\n\
    Examples:\n\n```\n// Good\nvar object = {\n  key1: values,\n  key2: value2,\n\n\
    \  func: function() {\n    // do something\n  },\n\n  key3: value3\n};\n\n// Bad:\
    \ Improper indentation\nvar object = {\n  key1: value1,\n  key2: value2\n};\n\n\
    // Bad: Missing blank lines around function\nvar object = {\n  key1: value1,\n\
    \  key2: value2,\n  func: function() {\n    // do something\n  },\n\n  key3: value3\n\
    };\n```\n\nWhen an object literal is passed to a function, the opening brace should\
    \ be on the same line as if the value is a variable. All other formatting rules\
    \ listed earlier still apply."
