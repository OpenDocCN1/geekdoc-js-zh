  md: "Single-line comments should not be used on consecutive lines unless you're\
    \ commenting out large portions of code. Multiline comments should be used when\
    \ long comment text is required.\n\nHere are some examples:\n\n```\n// Good\n\
    if (condition) {\n    // if you made it here, then all security checks passed\n\
    \    allowed();\n}\n\n// Bad: No empty line preceding comment\nif (condition)\
    \ {\n    // if you made it here, then all security checks passed\n    allowed();\n\
    }\n\n// Bad: Wrong indentation\nif (condition) {\n    // if you made it here,\
