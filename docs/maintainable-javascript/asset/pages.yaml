    Because JSON is valid JavaScript, you can concatenate this code into other files
    to give them access to the data.


    The last option is plain JavaScript, which you assign the JSON object to a variable
    to use later, as in:


    ```

    var config={"MSG_INVALID_VALUE":"Invalid value","URL_INVALID":"/errors/invalid.php",

    "CSS_SELECTED":"selected"}

    ```


    As with JSONP, the plain JavaScript version can be combined with other JavaScript
    files easily once produced.


    For these common cases, I have created a tool called Props2Js that reads Java
    properties and outputs the data into one of these three formats. Props2Js is free
    and open source, available at https://github.com/nzakas/props2js. It works like
    this:


    ```

    java -jar props2js-0.1.0.jar --to json --name myfunc

    --output result.js source.properties

    ```


    The --to option specifies the output format, either "js," "json" or "json." The
    name option specifies the variable name (for "js") or the function name (for "json");
    this option is ignored for "json." The --output option specifies the file to write
    the data. So this line takes the Java properties file source.properties and outputs
    JSONP with a callback function of myfunc to a file result.js.


