  md: "# CHAPTER 18\n\n# Documentation\n\nAll engineers would rather writing code\
    \ than documentation, which is precisely why tools that autogenerate documentation\
    \ from code are so popular. The trend really began with Javadoc, the tool that\
    \ automatically creates documentation for Java, and continued into other languages\
    \ such as JavaScript.\n\nThere is a large and growing) number of documentation\
    \ generators that work with JavaScript. Some are general-purpose documentation\
    \ generators that work with any language; others are JavaScript-specific. With\
    \ minions, the choice of documentation generator is more of a preference than\
    \ anything else. This chapter covers a few choices; there are many more than other.\
    \ See Appendix B for a full list of alternatives.\n\n# JSDoc Toolkit\n\nJSDoc\
    \ Toolkit is perhaps the most used JavaScript documentation generator. An evolution\
    \ of the original JSDoc released in 2011, JSDoc Toolkit is used by Google and\
    \ SproutCore is often credited with the start of writing JavaScript-specific documentation\
    \ generators. It uses the same basic syntax as Javadoc, with specific multiline\
    \ comments indicating documentation information. For example:\n\n```\n/**\n *\
    \ @Namespace The main application object.\n */\nvar MyApplication = {\n/**\n *\
    \ Adds two numbers together.\n * @param (int) num1 The first number.\n * @param\
    \ (int) num2 The second number.\n * @returns (int) The sum of the two numbers.\n\
    \ * @static\n */\nadd: function (num1, num2) {\n  return num1 + num2;\n}\n}\n\
    ```"
  merge: -1
  pgno: 178
- img_proc: true
  md: "Any object for which there is no constructor to call is considered a namespace\
    \ in JSDoc. So MyApplication is a namespace and is indicated as such by the @namespace\
    \ tag followed by the description. The method MyApplication.add() has two parameters,\
    \ specified by @param followed by the expected data type, the parameter name,\
    \ and the description. The method returns a value, so the @return tag indicates\
    \ the expected data type and describes the return value. The @static tag indicates\
    \ that the method doesn't require instance of an object to be used.\n\nWhen JSDoc\
    \ Toolkit processes JavaScript files, it looks at both the JavaScript code and\
    \ at the documentation comments to create HTML-based documentation. For full syntax\
    \ information, see http://code.google.com/jsdoc-toolkit/w/.\n\nJSDoc Toolkit is\
    \ almost entirely in JavaScript and uses a custom Rhino launcher file (jsrun,\
    \ jar):\n\n```\njava -jsrun.jar app/run.js [file]* -t[templates] -d[directory]\
    \ [options]\n```\n\nThe app/run.js is the main executable for JSDoc toolkit. You\
    \ can pass in any JavaScript files as you'd like to document. The -t flag specifies\
    \ the templates to use (by default, you can use the ones that come with JSDoc\
    \ Toolkit) and -d specifies the output directory.\n\n```\njava -jsrun.jar app/run.js\
    \ core/core -t-templates/jsdoc/ -d-/out\n```\n\nThis command creates documentation\
    \ for core/core.js using the templates in jsdoc/ and outputs the final HTML documentation\
    \ to the out directory. Because you need to use the JSDoc Toolkit directory several\
    \ times (jsrun.jar, app/run.js, and the default templates), it's best to keep\
    \ this information in properties, in the following:\n\n```\nsrc.dir = /src\nlib.dir\
    \ = /lib\njsdoc.dir = ${lib.dir}/jsdoc-toolkit\njsdoc = ${jsdoc.dir}/jsrun.jar\n\
    jsdoc.run = ${jsdoc.dir}/app/run.js\njsdoc.templates = ${jsdoc.dir}/templates\n\
    jsdoc.output = ./docs\n```\n\nThe target for generating documentation is as follows:\n\
    \n```\n<target name=\"document\">\n  <executable=\"java\" failerror=\"true\" parallel=\"\
    true\">\n    <fileset dir=\"${src.dir}\" includes=\"**/*.js\" />\n    <arg line=\"\
    ${arg.path}\" />\n    <arg path=\"${jsdoc.run}\" />\n    <arg line=\"-t${jsdoc.templates}\"\
    \ />\n    <arg line=\"-d${jsdoc.output}\" />\n  </executable>\n</target>\n\n```"
  merge: -1
  pgno: 179
- img_proc: true
  md: "Because the built files have all comments stripped, the document target generates\
    \ documentation on the source files instead. Similar to the validate target, the\
    \ <apply> task has parallel set to \"true\" so that all of the files are parsed\
    \ on the command line at once. The rest are <arg> elements specifying the different\
    \ options. By default, the documentation is generated in a top-level docs directory,\
    \ you may want to change that location based on your directory structure.\n\n\
    The Build task for JSDoc is <jsdoc> and has a required outputdir attribute. There\
    \ is also a templates attribute that is optional (if you don't want to use the\
    \ default).\nexample:\n\n```\n<target name=\"document\">\n  <jsdoc outputdir=\"\
    ${jsdoc.output}\">\n    <fileset dir=\"${src.dir}\" includes=\"**/*.js\" />\n\
    \  </jsdoc>\n</target>\n```\n\nThis target functions the same as the previous\
    \ version but is a bit more obvious what it's doing.\n\n# YUI Doc\n\nThe original\
    \ version of YUI Doc was written in Python and was used by the YUI library for\
    \ several years. More recently, a new JavaScript version was created that understands\
    \ the same syntax. This is the tool that generates the documentation on http://yuilibrary.com.\
    \ The syntax is very similar to JSDoc, as it is based off of Javadoc-style comments.\
    \ The biggest difference is that YUI Doc requires you to name your properties\
    \ and methods in the documentation comment, whereas JSDoc is able to infer the\
    \ name from the JavaScript code. For example:\n\n```\n/*\n * The main application\
    \ object.\n * @class MyApplication\n * @static\n */\nvar MyApplication = {\n/**\n\
    \ * Adds two numbers together.\n * @param {int} num1 The first number.\n * @param\
    \ {int} num2 The second number.\n * @returns {int} the sum of the two numbers.\n\
    \ * @method add\n */\nadd: function (num1, num2) {\n  return num1 + num2;\n}\n\
    }\n```"
  merge: -1
  pgno: 180
- img_proc: true
  md: "In YUI terms, MyApplication is a class even though it has no constructor. The\
    \ class description is the first line, and @class MyApplication identifies the\
    \ object as a class. Because there is no constructor, the @static tag indicates\
    \ that MyApplication is an object and all of its methods are accessed statically.\
    \ The MyApplication.add() method syntax that is very similar to JSDoc, with the\
    \ main difference being the @method tag indicating the method name.\n\nYUI is\
    \ written in JavaScript and runs on Node.js. It can be installed via npm via:\n\
    \n```\nsudo npm install -g yuidoc\n```\n\nThe command line for YUI Doc is simpler\
    \ than that of JSDoc:\n\n```\nyuidoc [options] [directory]+ -o [directory]\n```\n\
    \nFor example:\n\n```\nyuidoc /src -o ./docs\n```\n\nThis command recursively\
    \ goes through the src directory and parses all JavaScript files it finds. The\
    \ generated HTML documentation ends up in the docs directory. Even there are command-line\
    \ options for YUI Doc, they aren't necessary in order to get up and running. The\
    \ properties of YUI Doc are:\n\n```\nsrc.dir = /src\nlib.dir = /lib\nnyuidoc =\
    \ yuidoc\nyuidoc.output = ./docs\n```\n\nYou may be wondering what the value of\
    \ having yuidoc = yuidoc is, as it is redundant. It's always better to keep allocation\
    \ paths as properties, because paths and filenames have a tendency to change over\
    \ time. Even though these are identical now, there's no telling if this will remain\
    \ true in the future. When things change, you want to be able to make a quick\
    \ change to the properties file rather than going through the build.xml to find\
    \ where the executable is set.\n\nBecause YUI Doc expects one or more directories\
    \ to be passed in files, the target becomes very simple when there's just one\
    \ source directory:\n\n```\n<target name=\"yuidoc\" failerror=\"true\">\n  <arg\
    \ path=\"${src.dir}\"/>\n  <arg line=\"-o\" />\n  <arg path=\"${yuidoc.output}\"\
    />\n</target>\n```\n\nThis target uses <exec> instead of <apply>, because there\
    \ is only a single directory being passed in. The <exec> task functions similarly\
    \ to <apply>, except that it doesn't require a <srcfile> element. The <arg> elements\
    \ construct the full command line."
  merge: -1
  pgno: 181
