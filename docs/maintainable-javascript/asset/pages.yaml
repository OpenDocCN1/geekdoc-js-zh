  md: 'Most JavaScript libraries have a plugin architecture that allows you to safely
    add new capabilities to the libraries. If you want to modify a library, creating
    a plug-in is the best and most maintainable way to do so.


    # Don''t Remove Methods


    It''s just as easy to remove JavaScript methods as it is to add. Of course, overriding
    a method is one form of removing an existing method. The simplest way to eliminate
    a method is to set its name to null:


    ```

    // Bad - eliminating a DOM method

    document.getElementById = null;

    ```


    Setting a method to null ensures that it can''t be called, regardless of how it
    was defined. If the method is defined on the object instance (as opposed to the
    object prototype), then it can be removed using the `delete` operator:


    ```

    var person = {

    name: "Nicholas"

    };

    ```


    ```

    delete person.name;

    console.log(person.name); // undefined

    ```


    This removes the name property from the person object. The `delete` operator works
    only on instance properties and methods. If `delete` is used on a prototype property
    or method, it has no effect. For example:


    ```

    // No effect

    delete document.getElementById("myelement");

    ```


    ```

    console.log(document.getElementById("myelement")); // stil works

    ```


    Because `document.getElementById` is a prototype method, it cannot be removed
    using `delete`. However, as seen in an earlier example, it can still be set to
    `null` to prevent access.


    It should go without saying that removing an existing method is a bad practice.
    Not only are developers relying on that method to be there, but code might already
    exist using that method. Removing a method that is in use can cause a runtime
    error. If your team shouldn''t be using a particular method, mark it as deprecated,
    either through documentation or through static code analysis. Removing a method
    should be the absolute last approach.'
