  md: "code that could appear incorrect to another developer, make sure to include\
    \ a comment.\nHere's another example from:\n\n```\nwhile (element &&(element =\
    \ element[axis])) { // NOTE: assignment\nif (all || element[TAG_NAME]) &&\n  (fn\
    \ || fn(element))) {\n  return element;\n}\n```\n\nIn this case, the developer\
    \ used an assignment operator in the while loop control condition. This isn't\
