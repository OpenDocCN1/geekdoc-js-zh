- img_proc: true
  md: "YUI Compressor also contains a CSS minifier. If you pass a CSS file to YUI\
    \ Compressor, it automatically switches into CSS mode.\n\nBuildr has a <uicompressor>\
    \ task that encapsulates all of this functionality. There are attributes to enable\
    \ each command-line option (the attribute name is the same as the command-line\
    \ option --) plus a required outdir attribute that indicates where the minified\
    \ files should be placed. Here is an example:\n\n```\n<target name=\"minify\"\
    >\n    <uicompressor outdir=\"${build.dir}\" preserve-semi=\"true\">\n       \
    \ <fileset dir=\"${build.dir}\" includes=\"*.js\" />\n    </uicompressor>\n</target>\n\
    ```\n\nThe compressor task automatically adds the -min suffix to all files. You\
    \ can include one or more elements to minify everything at once.\n\n# Minifying\
    \ with Closure Compiler\n\nThe Closure Compiler is an executable JAR file that\
    \ needs to be placed in the dependencies folder. The Closure Compiler has significantly\
    \ more command-line options than the YUI Compressor, many of which are used only\
    \ by those working directly with the Closure JavaScript library. The most important\
    \ option is --compilation_level, which determines how much processing is done\
    \ on the JavaScript file. The options are:\n\nWHITESPACE_ONLY\n\nRemoves unnecessary\
    \ white space and comments. Other optimizations are turned off.\n\nSIMPLE_OPTIMIZATIONS\n\
    \nThe default setting for Closure Compiler. This setting removes unnecessary white\
    \ space and comments while renaming local variables to shorter names. The remaining\
    \ happens even in the presence of eval() and with, so it may cause runtime errors\
    \ if either is present.\n\nADVANCED_OPTIMIZATIONS\n\nEvery optimization is done\
    \ on the code. Use caution, as this can introduce runtime or syntax errors.\n\n\
    Once you decide which options to use, place them in a Java properties file, such\
    \ as:\n\n```\nsrc.dir = /src\nlib.dir = ./lib\n```\n\n```\nclosure.options = --compilation_level\
    \ SIMPLE_OPTIMIZATIONS\n```"
