  md: '# CHAPTER 10


    # Throw Your Own Errors


    When I was younger, the most bewildering part of programming languages was the
    ability to create errors. My first reaction to the *throw* operator in Java was,
    "Well, that''s stupid; why would you ever want to cause an error?" Errors were
    my enemy—something I sought to avoid—so the ability to cause an error seemed like
    a useless and dangerous aspect of the language. I thought it was dumb to include
    the same operator in JavaScript, a language that people just didn''t understand
    in the first place. Now, with a great deal of experience under my belt, I''m a
    big fan of throwing my own errors.


    Throwing errors in JavaScript is an art. It takes time to figure out where the
    appropriate parts of your code should throw errors. Once you figure this out,
    however, you''ll find that your debugging time will decrease and your satisfaction
    with the code will increase.


    # The Nature of Errors


    An error in programming when something unexpected happens. Maybe the incorrect
    value was passed into a function or a mathematical operation had an invalid operand.
    Programming languages define a base set of rules that when deviated from, result
    in errors so that the developer can fix the code. Debugging would be nearly impossible
    if errors weren''t thrown and reported back to you. If failed silently, it would
    take you a long time to notice that there was an issue in the first place, let
    alone isolate and fix it. Errors are the friends of developers, not enemies.


    The problem with errors is that they tend to pop up in unexpected places and at
    unexpected times. To make matters worse, the default error messages are usually
    too cryptic to explain what went wrong. JavaScript error messages are notoriously
    uninformative (especially in older versions of Internet Explorer), which only
    compounds the problem. Imagine if an error popped up with a message that said,
    "This function failed because this happened." Instantly, your debugging task becomes
    easier. This is the advantage of throwing your own errors.


    It helps to think of errors as built-in failure cases. It''s always easier to
    plan for a failure at a particular point in code than it is to anticipate failure
    everywhere. This is a very'
