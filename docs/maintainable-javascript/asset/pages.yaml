  md: "# APPENDIX A\nJavaScript Style Guide\n\nProgramming language style guides are\
    \ important for the long-term maintainability of software. This guide is based\
    \ on the Code Conventions for the Java Programming Language and Douglas Crockford's\
    \ Code Conventions for the JavaScript Programming Language. Modifications have\
    \ been made due to my personal experience and preferences.\n\n# Indentation\n\n\
    Each indentation level is made up of four spaces. Do not use tabs.\n\n```\n//\
    \ Good\nif (true) {\n  doSomething();\n}\n```\n\n# Line Length\n\nEach line should\
    \ be no longer than 80 characters. If a line goes longer than 80 characters, it\
    \ should be wrapped after an operator (comma, plus, etc.). The following line\
    \ should be indented two levels (eight characters).\n\n```\n// Good\ndoSomething(argument1,\
    \ argument2, argument3, argument4,\n  arguments);\n```\n\n```\n// Bad: Following\
    \ line only indented four spaces\ndoSomething(argument1, argument2, argument3,\
