    \ string, null, and undefined). The jQuery Style Guide warns about the use of\
    \ == for comparison against null when the intent is to test for both null and\
    \ undefined. I recommend using == and != all the time without exception.\n\nJSLint\
    \ warns about all uses of == and != by default. JSHint warns about using == and\
    \ != when comparing to a false value by default. You can enable warnings for all\
    \ uses of == and != by using the eqeqeq option.\n\n# eval()\n\nThe eval() function\
    \ takes a string of JavaScript code and executes it. This function allows developers\
    \ to download additional JavaScript code, or to generate JavaScript on the fly,\
    \ and execute it. For example:\n\n```\neval('Hi!');\n```\n\n```\nvar count = 10;\n\
    var number = eval(count + \" count\");\nconsole.log(count); // 15\n```"
