  md: "# Modules\n\nAnother way developers augment the one-global approach is by using\
    \ modules. A module is a generic piece of functionality that creates no globals\
    \ or namespaces. Instead, all of the code takes place within a single function\
    \ that is responsible for executing a task or publishing an interface. The module\
    \ may optionally have a name and a list of module dependencies.\n\nModules aren't\
    \ part of JavaScript. There is no module syntax (at least, not until ECMAScript\
    \ 6), but there are some common patterns for creating modules. The two most prevalent\
    \ types are YUI modules and Asynchronous Module Definition (AMD).\n\n# YUI modules\n\
    \nYUI modules are, as you might expect, how you create new modules to work with\
    \ the YUI JavaScript library. The concept of modules was formalized in YUI 3 and\
    \ takes the following format:\n\n```\nYUI.add(\"module-name\", function(Y) {\n\
    \  // module body\n}, { \"version\", { requires: [\"dependency1\", \"dependency2\"\
    ] } });\n```\n\nYUI modules are added by calling YUI.add with the module name,\
    \ the function to execute (a factory function), and an optional list of dependencies.\
    \ The module body is where you place all code for this module. The Y argument\
    \ is an instance of YUI that has all of the required dependencies available. The\
    \ YUI convention is to add module functionality as namespaces inside each module,\
    \ such as:\n\n```\nYUI.add(\"my-books\", function(Y) {\n  // Add a namespace\n\
    \  Y.namespace(\"MaintainableJavaScript\".author = \"Nicholas C. Zakas\";\n},\
    \ \"1.0.0\", { requires: [\"dependency1\", \"dependency2\"] } });\n```\n\nLikewise,\
    \ the dependencies are represented as namespaces on the Y object that is passed\
    \ in. So YUI actually combines the concepts of namespaces with modules to give\
    \ you flexibility in the overall approach.\n\nUse your module via the YUI().use()\
    \ method and pass in one or more module names to load:\n\n```\nYUI().use(\"my-books\"\
    , \"another-module\", function(Y) {\n  console.log(Y.Books.MaintainableJavaScript.author);\n\
    });\n```"
  merge: -1
  pgno: 91
- img_proc: true
  md: "This code starts loading the modules \"my-books\" and \"another-module\", ensuring\
    \ the dependencies for each are fully loaded. The then module is executed in the\
    \ order in which the modules are specified. Last, the callback function passed\
    \ to YUI().use() is executed. The Y object that is passed in has all of the changes\
    \ made to it by the loaded modules, so your application code is ready to execute.\n\
    \nFor more information on YUI modules, see the documentation at http://ylibrary.com/yui/docs/yui.\n\
    \n# Asynchronous Module Definition (AMD) Modules\n\nAMD modules have a lot in\
    \ common with YUI modules. You specify a module name, dependencies, and a function\
    \ to execute once the dependencies are loaded. These are all anonymous to a global\
    \ define() function with the name first, then the dependencies, and then the factory\
    \ function. A major difference between AMD and YUI modules is that each dependency\
    \ is passed as a separate argument to the factory function.\n\n```\ndefine(\"\
    module-name\", [ \"dependency1\", \"dependency2\" ],\nfunction(dependency1, dependency2)\
    \ {\n\n  // module body\n\n});\n```\n\nSo each named dependency ends creating\
    \ an object and passing it to the factory function. In this way, AMD seeks to\
    \ avoid collisions that might occur with namespaces across modules. Instead of\
    \ creating a new namespace as a YUI module, AMD modules are expected to return\
    \ their public interface from the factory function, such as:\n\n```\ndefine(\"\
    my-books\", [ \"dependency1\", \"dependency2\" ],\nfunction(dependency1, dependency2)\
    \ {\n\nvar Books = {};\nBooks.MaintainableJavaScript = {\n  author: \"Nicholas\
    \ C. Zakas\"\n}\n\nreturn Books;\n});\n```\n\nAMD modules can also be anonymous\
    \ and completely omit the module name. The assumption is that the module loader\
    \ can infer the module name through the JavaScript filename. So if you have a\
    \ file named my-books.js and your module will only ever be loaded through a module\
    \ loader, you can define your module as follows:"
  merge: -1
  pgno: 92
- img_proc: true
  md: "```\ndefine([ \"dependency1\", \"dependency2\" ],\nfunction(dependency1, dependency2)\
    \ {\n\n  var Books = {};\n  Books.MaintainableJavaScript = {\n    author: \"Nicholas\
    \ C. Zakas\"\n  };\n  return Books;\n});\n```\n\nAMD modules have quite a few\
    \ options for how to define modules. For information, see the AMD specification\
    \ at https://github.com/amdjs/amdjs-api/wiki/AMD.\n\nTo use AMD modules, you need\
    \ to use a compatible module loader. Dojo's standard module loader supports AMD\
    \ modules, so you can load your module \"my-books\" like this:\n\n```\n// load\
    \ AMD module in Dojo\nvar books = dojo.require(\"books.MaintainableJavaScript\"\
    );\n```\n\n```\nconsole.log(books.MaintainableJavaScript.author);\n```\n\nDojo\
    \ also exposes itself as an AMD module named \"dojo\", so it can be loaded into\
    \ other AMD modules.\n\nAnother module is RequireJS. RequireJS adds another global\
    \ function called require(), which is responsible for loading the specified dependencies\
    \ and then executing a callback function. For example:\n\n```\n// load AMD module\
    \ with RequireJS\nrequire([\"my-book\"], function(books) {\n```\n\n```\nconsole.log(books.MaintainableJavaScript.author);\n\
    ```\n\n```\n));\n```\n\nThe dependencies start to download immediately upon calling\
    \ require(), and the callback back executes as soon as all of those dependencies\
    \ have loaded (similar to YUI.use()).\n\nThe RequireJS module loader has a lot\
    \ of logic built in making modules easy. These include mapping of names to directories\
    \ as well as internationalization options. Both jQuery and Dojo are capable of\
    \ using RequireJS to load AMD modules.\n\n# The Zero-Global Approach\n\nIt is\
    \ possible to inject your JavaScript into a page without creating a single global\
    \ variable. This approach is quite limited, so it is useful only in some very\
    \ specific situations. The most common situation is using a completely standalone\
    \ script that doesn't have to be accessed by any other scripts. This situation\
    \ may occur because all of the necessary scripts are combined into one file, or\
    \ because the script is small and being inserted into"
  merge: -1
  pgno: 93
- img_proc: true
  md: "a page that it shouldn't interfere with. The most common use case is in creating\
    \ a bookmarklet.\n\nBookmarklets are unique in that they don't know what's going\
    \ to be on the page and don't want the page to know that they are present. The\
    \ end result is a need for a zerlobal embedding of the script, which is accomplished\
    \ by using an immediate function invocation and placing all of the script inside\
    \ of the function. For example:\n\n```\n(function(win) {\n\n  var doc = win.document;\n\
    \n  // declare other variables here\n\n  // other code goes here\n\n}(window));\n\
    ```\n\nThis immediately invoked function passes in the window object so that the\
    \ scripts needn't directly access any global variables. Inside the function, the\
    \ doc variable holds a reference to the document object. As long as the function\
    \ are declared using the var keyword, this script will result in no globals being\
    \ injected into the page. You can further avoid creating globals by putting the\
    \ function into strict mode (for browsers that support it):\n\n```\n(function(win)\
    \ {\n\n  \"use strict\";\n\n  var doc = win.document;\n\n  // declare other variables\
    \ here\n\n  // other code goes here\n\n}(window));\n```\n\nThis wrapper can now\
    \ be used for scripts that don't want to create any global objects. As mentioned\
    \ previously, this pattern is of limited use. Any script that needs to be used\
    \ by other scripts on the page cannot use the zero-global approach. A script that\
    \ must be extended or modified during runtime cannot use the zero-global approach,\
    \ either. However, if you have a small script that doesn't need to interact with\
    \ any other scripts on the page, the zero-global approach is something to keep\
    \ in mind."
