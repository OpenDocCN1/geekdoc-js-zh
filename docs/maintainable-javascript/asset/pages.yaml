  md: "```\nfunction doSomethingWithItems(items) {\n  var i, len,\n  value = 10,\n\
    \  result = value + 10;\n\n  for (i=0, len=items.length; i < len; i++) {\n   \
    \ doSomething(items[i]);\n  }\n}\n```\n\nThe Dojo Style Guide allows combining\
    \ var statements only when the variables are related to one another.\n\nMy personal\
    \ preference is to combine all var statements with one initialized variable per\
    \ line. For variables that aren't initialized, they should appear last, as in\
    \ the following example:\n\n```\nvar value = 10,\nresult = value + 10,\ni,\nlen;\n\
    \nfor (i=0, len=items.length; i < len; i++) {\n  doSomething(items[i]);\n}\",\n\
    ```\n\nAt a minimum, I recommend combining var statements, as doing so makes your\
    \ code smaller and therefore faster to download.\n\n# Function Declarations\n\n\
    Function declarations, just like variable declarations, hoisted by JavaScript\
    \ engines. Therefore, it's possible to use a function in code before it is declared:\n\
    \n+   - Bad\ndoSomething();\n\n```\nfunction doSomething() {\n  alert(\"Hello\
    \ world!\");\n}\n```\n\nThis approach works because the JavaScript engine interprets\
    \ the code as if it were the following:\n\n+   - Bad\nfunction doSomething() {\n\
    \  alert(\"Hello world!\");\n}\n\ndoSomething();"
  merge: -1
  pgno: 58
- img_proc: true
  md: "Due to this behavior, it's recommended that JavaScript functions always be\
    \ declared before being used. This design appears in Crockford's Code Conventions.\
    \ Crockford also recommends that functions be placed immediately after variable\
    \ declarations within a containing function, as in:\n\n```\nfunction doSomethingWithItems(items)\
    \ {\n\nvar i, len,\n  value = 10,\n  result = value + 10;\n\nfunction doSomething(item)\
    \ {\n  // do something\n}\n\nfor (i=0, len=items.length; i < len; i++) {\n  doSomething(items[i]);\n\
    }\n}\n```\n\nBoth JSLint and JHint warn when a function is used before it is declared.\
    \ Additionally, function declarations should never appear inside of block statements.\
    \ For example, this code won't behave as:\n\n```\n// Bad\nif (condition) {\n \
    \ function doSomething() {\n    alert(\"Hi!\");\n  }\n} else {\n  function doSomething()\
    \ {\n    alert(\"Yo!\");\n  }\n}\n```\n\nExactly how this will work from browser\
    \ to browser will vary. Most browsers automatically take the second declaration\
    \ without evaluating condition; Firefox evaluates condition and uses the appropriate\
    \ function declaration. This is a gray area in the ECMAScript specification and\
    \ thus should be avoided. Function declarations should be used only outside conditional\
    \ statements. This pattern is explicitly forbidden in the Google JavaScript Style\
    \ Guide.\n\n# Function Call Spacing\n\nAlmost universally, the recommended style\
    \ for function calls is to have no space between the function name and the opening\
    \ parenthesis, which is done to differentiate it from a block statement. For example:\n\
    \n```\n// Good\ndoSomething(item);\n```"
