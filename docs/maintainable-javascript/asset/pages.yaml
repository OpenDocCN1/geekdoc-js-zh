- img_proc: true
  md: "To run Closure Compiler on the command line, type the following:\n\n```\njava\
    \ -jar compiler.jar [options] --js [file] --js_output_file [outputfile]\n```\n\
    \nFor example:\n\n```\njava -jar compiler.jar --compilation-level SIMPLE_OPTIMIZATIONS\
    \ --js core/core.js\n--js_output_file core/core-min.js\n```\n\nThis command runs\
    \ Closure Compiler on core.js and outputs the result to core-min.js. The Ant target\
    \ is basically the same as the one used with YUI Compressor:\n\n```\n<target name=\"\
    minify\">\n  <apply executable=\"java\" failonerror=\"true\">\n    <fileset dir=\"\
    ${build.dir}\" includes=\"*.js\"/>\n    <mapper type=\"glob\" from=\"*.js\" to=\"\
    ${build.dir}/*.min.js\"/>\n    <arg line=\"-jar\" />\n    <arg path=\"${closure}\"\
    \ />\n    <arg line=\"${closure.options}\" />\n    <arg line=\"--js\" />\n   \
    \ <srcfile/>\n    <arg line=\"--js_output_file\" />\n    <targetfile/>\n  </apply>\n\
    </target>\n```\n\nAside from changing the JAR file path and command-line options,\
    \ this target is virtually identical to the minify target. The result is the same:\
    \ every JavaScript file in the build directory is minified and output into a second\
    \ file with the -min suffix.\n\nBuildr has a <closure> task that encapsulates\
    \ all of this functionality. You can set the compilation level using the compilation-level\
    \ attribute. As the <yuicompressor> task, the outdir attribute is required and\
    \ indicates where the minified files should be placed. Here's an example:\n\n\
    ```\n<target name=\"minify\">\n  <closure outdir=\"${build.dir}\" compilation-level=\"\
    SIMPLE_OPTIMIZATIONS\">\n    <fileset dir=\"${build.dir}\" includes=\"*.js\" />\n\
    \  </closure>\n</target>\n```\n\nThe <closure> task automatically adds the -min\
    \ suffix to all files it creates. You can include one or more elements to minify\
    \ everything at once."
  merge: -1
