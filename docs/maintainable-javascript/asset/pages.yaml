- img_proc: true
  md: "Browsers don't always report their original user-agent string. User-agent switchers\
    \ are readily available for nearly all web browsers. Developers are frequently\
    \ concerned about this and therefore won't turn to user-agent detection, even\
    \ when it's the only option, because \"you can never know for sure.\" My advice\
    \ is not to worry about user-agent spoofing. If a user is savvy enough to switch\
    \ her user-agent string, then she's savvy enough to understand that doing so might\
    \ cause websites to break in unforeseen ways. If the browser identifies itself\
    \ as Firefox and doesn't act like Firefox, that's not your fault. There's no point\
    \ in trying to secure the reported user-agent string.\n\n# # Feature Detection\n\
    \nLooking to use a more sane approach to browser-based conditionals, developers\
    \ turned to a technique called feature detection. Feature detection works by testing\
    \ for a specific browser feature and using if it is present. Instead of doing\
    \ something like this:\n\n```\n// Bad\nif (navigator.userAgent.indexOf(\"MSIE\
    \ 7\") > -1) {\n  // do something\n```\n\nyou should do something like this:\n\
    \n```\n// Good\nif (document.getElementById) {\n  // do something\n}\n```\n\n\
    There is a distinction between these two approaches. The first is testing for\
    \ a specific browser by name and version; the second is testing for a specific\
    \ feature, namely document.getElementById. So user-agent sniffing results in knowing\
    \ the exact browser and version used (or at least the one being reported by the\
    \ browser) and feature detection determines whether a given object or method is\
    \ available. Note that these are two completely different results.\n\nBecause\
    \ feature detection doesn't rely on knowledge of which browser is used, only on\
    \ which features are available, it is trivial to ensure support in new browsers.\
    \ For instance, when the DOM was young, not all browsers supported document.getElementById(),\
    \ so there was a lot of code that looked like this:"
