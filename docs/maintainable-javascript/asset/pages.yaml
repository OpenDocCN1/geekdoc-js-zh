  md: 'true (some versions of Opera implemented it). Feature-based detection assumes
    that the converse is always true when, in fact, there is no such relationship.


    Adding more parts to the conclusion doesn''t help, either. Consider once again
    the statement, "If it''s a car, then it wheels." The converse is obviously false:
    "If it has wheels, then it''s a car," You could try making it more precise: "If
    it''s a car, then it wheels and requires fuel." Check the converse: "If it has
    wheels and requires fuel, then it''s a car." Also not true, because an airplane
    fits that description. Try again: "If it''s a car, then it has wheels, requires
    fuel, and uses two axes." Once again, the converse isn''t going to true.


    The problem is fundamental to human language: it''s very hard to use a collection
    of singular aspects to define the world. We have the word "car" it implies a lot
    of aspects that you would otherwise have to list in thing which you drive to work.
    Trying to identify a browser by naming and more features is the exact same problem.
    You''ll get close, but it will never be a reliable categorization.


    MooTools backed themselves, and their users, into a corner by opting for feature-based
    browser detector. Mozilla warned when using Firefox 3 that the getobject method
    was deprecated and would be removed in a future release. MooTools relied on this
    method to determine whether a browser is Gecko-based, Mozilla''s removal of the
    method in Firefox 3.6 meant that anyone running older versions of MooTools could
    code that was now affected. This situation prompted MooTools to issue a call to
    upgrade to the most recent version, which the issue is "fixed." The explanation:


    > We have overhauled our browser detection based on the user agent string. This
    has become the standard practice among JavaScript libraries because of potential
    issues, Firefox 3 demonstrates. As browsers grow closer, looking at features to
    separate them will become more difficult and risky. From this point forward, browser
    detection will only be used where it would be impossible not to, in order to give
    the consistent experience across browsers that one would expect from a world-class
    JavaScript framework.


    # What Should You Use?


    Feature inference and browser inference are bad practices that should be avoided
    at all costs. Straight feature detection is a best practice, and in almost every
    case, exactly what you''ll need. Typically, you just need to know if a feature
    is implemented before using it. Don''t try to infer relationships between features,
    before you''ll end up with false positives or negatives.


    I won''t go so far as never use user-agent detection, because I believe there
    are valid use cases. I do not, however, that there are a lot of use cases. If
    you''re thinking about user-agent sniffing, keep this in mind: the only safe way
    to do so is to target older versions of a specific browser. You should never target
    the most current browser version or future versions.'
