  md: '# About the Author


    Nicholas Zakas is a front-end consultant, author, and speaker. He worked at Yahoo!
    for almost five years, where he was front-end tech lead for the Yahoo! home page
    and a contributor to the YUI library. He is the author of Professional JavaScript
    for Web Developers (Wrox, 2012), Professional Ajax (Wrox, 2007), and High Performance
    JavaScript (O''Reilly, 2010). Nicholas is a strong advocate for development best
    practices including progressive enhancement, accessibility, performance, scalability,
    and main-tainability. He blogs regularly at http://www.nczonline.net/ and on Twitter
    via @slicknet.


    # Colophon


    The animal on cover of Maintainable JavaScript is a Greek tortoise.


    Greek tortoises (Testudo graeca), are also known as spur-ringed tortoises, are
    currently divided into at least 20 species, and such vary greatly in size, weight,
    and color. They inhabit areas of North Africa, southern Europe, and southwest
    Asia, where they tend to prefer hot, arid regions; they can also be found on mountain
    steppes and deserts. Their genetic richness makes their classification difficult
    and largely from their crossbreeding; tortoises from different groups often mate,
    resulting in offspring of widely varying colors and sizes. For this reason, one
    of the best ways to identify a particular specimen is to know where it came from.


    Greek tortoises range in size from 8 inches to around 12 inches. The "spurs" on
    their thighs refer to the two tubercles that sit on either side of the tail, and
    in general, their carapace, or upper shell, is oblong rectangular. They''re also
    generally characterized by large scales on their front legs; flecks on the spine
    and rib plates, with a larger, dark fleck on the underside; and an upper shell
    that''s divided over the tail.


    Greek tortoises'' mating kicks in immediately after they awake from hibernation.
    One or two weeks before laying eggs-laying season, the tortoises move around their
    habitat—digging in, tasting, and smelling the dirt—in order to find the ideal
    egg-laying place. One or two days before laying eggs, the female Greek tortoise
    becomes aggressive in order to establish dominance in the community so that her
    eggs will not be disturbed. Their lifespan is 50 years.


    The cover image is from Cassell''s Natural History. The cover font is Adobe ITC
    Gothic. The text font is Linotype Birka; the heading font is Adobe Myriad Condensed;
    and the code font is LucasFont''s TheSansMonoCondensed.'
