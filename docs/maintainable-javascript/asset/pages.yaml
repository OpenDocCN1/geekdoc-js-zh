  md: "# CHAPTER 1\nBasic Formating\n\nAt the core of a style guide are basic formatting\
    \ rules. These rules govern how the code is written at a high level. Similar to\
    \ the ruled paper used in schools to teach writing, basic formatting rules guide\
    \ developers toward writing code in a particular style. These rules often contain\
    \ information about syntax that you may not have considered, but every piece is\
    \ important in creating a coherent piece of code.\n\n# Indentation Levels\n\n\
    The first decision to be made about your JavaScript style guidelines (and indeed,\
    \ about those of most languages) is how to handle indentation. This is one of\
    \ topics which debates can last for hours; indentation is about as close to religion\
    \ as software engineers get. However, it is quite important to establish indentation\
    \ guidelines up front, lest developers fall into the classic problem of reinventing\
    \ every file before starting to work. Consider a file that looks like this (indentation\
    \ has been intentionally changed for demonstration purposes)\n\n```\nif (wl &&\
    \ wl.length) {\n  for (i = 0, l = wl.length; i < l; ++++) {\n    p = wl[i];\n\
    \    type = Y.Lang.type(p);\n    if (s.ownProperty(p)) { if (merge && type ==\
    \ 'object') {\nnY.mix(r(p), s[p]);\n} else if (ov || !(p in r)) {\n  r[p] = s[p];\n\
    }\n}\n```\n\nJust looking at this code is difficult. The indentation is not uniform,\
    \ so it appears that the else applies to the if statement on the first line. However,\
    \ closer inspection reveals that the else actually applies to the if statement\
    \ on line 5. The most likely culprit is a mixture of indentation styles from several\
    \ different developers. This is"
  merge: -1
  pgno: 22
- img_proc: true
  md: "precisely why indentation guidelines exist. Properly indented, this code becomes\
    \ much easier to understand:\n\n```\nif (wl && wl.length) {\n  for (i = 0, l =\
    \ wl.length; i < l; i++) {\n    p = wl[i];\n    type = Y.Long.type(r[p]);\n  \
    \  if (s.hasOwnProperty(p) && type == 'object') {\n      V.merge(r, s[p]);\n \
    \   } else if (ov || !(p in r)) {\n      r[p] = s[p];\n    }\n    }\n  }\n}\n\
    ```\n\nEnsuring proper indentation is the first step—this particular piece of\
    \ code has other maintainability issues discussed later in this chapter.\n\nAs\
    \ with style guidelines, there is no universal agreement on how to accomplish\
    \ indentation in code. There are two schools of thought:\n\nUse tabs for indentation\n\
    \nEach indentation level is represented by a single tab character. So indents\
    \ of one level are one tab character, second-level indentation is two tab characters,\
    \ and so on. There are two main advantages to this approach. You may find that\
    \ opening the file in one editor looks one-to-one mapping between tab characters\
    \ and indentation levels, making it logical. Second, text editors can be configured\
    \ to display tabs as different sizes, so developers who like smaller indents can\
    \ configure their editors that way, and those who like larger indents can work\
    \ their too. The main disadvantage of tabs for indentation is that systems interpret\
    \ them differently. This can be frustrating for someone looking for consistency.\
    \ These differences, some argue, result in each developer looking at the same\
    \ code differently, and that isn't how a team should operate.\n\nUse spaces for\
    \ indentation\n\nEach indentation level is made up of multiple space characters.\
    \ Within this realm of thinking, there are three popular approaches: two spaces\
    \ per indent, four spaces per indent, and eight spaces per indent. These approaches\
    \ all be traced back to style guidelines for various programming languages. In\
    \ practice, many teams opt to go with a four-space indent as a compromise between\
    \ those who want two spaces and those who want spaces. The main advantage of using\
    \ spaces for indentation is that the files are treated exactly the same in all\
    \ editors and all systems. Text editors can be configured to insert spaces when\
    \ the Tab key is pressed. It means all developers have the same view of the code.\
    \ The main disadvantage of using spaces for indentation is that it is easy for\
    \ a single developer to create formatting issues by a misconfigured text editor.\n\
    \n6 | Chapter 1: Basic Formatting"
  merge: -1
  pgno: 23
- img_proc: true
  md: "Though some argue that one indentation approach or another is superior, all\
    \ boils down to a matter of preference within the team. For reference, here are\
    \ some indentation guidelines from various style guides:\n\n+   - The jQuery Core\
    \ Style Guide specifies indents as tabs.\n- Douglas Crockford's Code Conventions\
    \ for the JavaScript Programming Language specifies indents as four spaces.\n\
    - The SproutCore Style Guide specifies indents as two spaces.\n- The Google JavaScript\
    \ Style Guide specifies identifies as two spaces.\n- The Dojo Style Guide specifies\
    \ indents as tabs.\n\nI recommend using four spaces per indentation level. Many\
    \ text editors have this level as a default if you decide to make the Tab key\
    \ insert spaces instead. I've found that two spaces don't provide enough distinction\
    \ for my eyes.\n\n![](img/b5952fb0eafff982c42c2013b569fa4e_24_0.png)\n\nEven though\
    \ the choice of tabs or spaces is a preference, it is very important not to mix\
    \ them. Doing so leads to horrible file layout and requires unclean, as in the\
    \ first example in this section.\n\n# # Statement Termination\n\nOne of the interesting,\
    \ and most confusing, aspects of JavaScript is that statements may be terminated\
    \ either with a newline or a semicolon. This breaks from the tradition of other\
    \ C-like languages as C++ and Java, which require semicolons. Both of the following\
    \ examples are therefore valid JavaScript.\n\n```\n// Valid\nvar name = \"Nicholas\"\
    \nfunction sayName() {\n  alert(name);\n}\n```\n\n```\n// Valid but not recommended\n\
    var name = \"Nicholas\"\nfunction sayName() {\n  alert(name)\n}\n```\n\nThe omission\
    \ of semicolons in JavaScript due to a mechanism known as automatic semicolon\
    \ insertion (ASI). ASI looks for places in the code where a semicolon is appropriate\
    \ and inserts one if not found. In many cases, ASI guesses correctly and there\
    \ isn't a problem. However, the rules of ASI are complex and difficult to remember,\
    \ which is why I recommend using semicolons. Consider the following:"
  merge: -1
  pgno: 24
- img_proc: true
  md: "```\n// Original Code\nfunction getData() {\n  return {\n    title: \"Maintainable\
    \ JavaScript\",\n    author: \"Nicholas C. Zakas\"\n  }\n}\n```\n\n```\n// The\
    \ way the parser sees\nfunction getData() {\n  return {\n    title: \"Maintainable\
    \ JavaScript\",\n    author: \"Nicholas C. Zakas\"\n  };\n}\n```\n\nIn this example,\
    \ the function getData() is intended to return an object containing some data.\
    \ The newline after return causes a semicolon to be inserted, which causes the\
    \ function to return undefined. The function can be fixed by moving the opening\
    \ brace to on the same line as return.\n\n```\n// Works correctly, even without\
    \ semicolons\nfunction getData() {\n  return {\n    title: \"Maintainable JavaScript\"\
    ,\n    author: \"Nicholas C. Zakas\"\n  }\n}\n```\n\nThere are scenarios where\
    \ ASI may be applied, and I've found limiting ASI to help reduce errors. The errors\
    \ are typically caused by misunderstanding how ASI works and assuming that a semicolon\
    \ will be inserted when it will not. I have found that many developers, especially\
    \ inexperienced ones, have an easier time using semicolons than omitting them.\n\
    \nSemicolon usage is recommended by Douglas Crockford's Code Conventions for the\
    \ JavaScript Programming Language (hereafter referred to as “Crockford's Code\
    \ Conventions”), the jQuery Core Style Guide, the Google JavaScript Style Guide,\
    \ and the Dojo Style Guide. Both JSLint and JSHint will warn by default when semicolons\
    \ are missing.\n\n# Line Length\n\nClosely related to the topic of indentation\
    \ is line length. Developers find it hard to work on code in which the lines are\
    \ long enough to require horizontal scrolling. Even with today's large monitors,\
    \ keeping line length reasonably improves developers productivity. Code convention\
    \ documents for many languages prescribe that lines of code should be no longer\
    \ than 80 characters. This length comes from a time when text editors"
  merge: -1
  pgno: 25
- img_proc: true
  md: "had a maximum of 80 columns in which to display text, so longer lines would\
    \ either wrap in unexpected ways or disappear off the side of the editor. Today’s\
    \ text editors are quite a bit more sophisticated than those of 20 years ago,\
    \ yet 80-character lines are still popular. Here are some common line length recommendations:\n\
    \n+   1. Code Conventions for the Java Programming Language specifies a line length\
    \ of 80 characters for source code and 70 characters for documentation.\n2. The\
    \ Android Code Style Guidelines for Contributors specifies a line length of 100\
    \ characters.\n3. The Unofficial Ruby Usage Guide specifies a line length of 80\
    \ characters.\n4. The Python Style Guidelines specifies a line length of 79 characters.\n\
    \nLine length is less frequently found in JavaScript style guidelines, but Crockford’s\
    \ Code Conventions specifies a line length of 80 characters. I also prefer to\
    \ keep line length at 80 characters.\n\n# Line Breaking\n\nWhen a line reaches\
    \ the maximum character length, it must be manually split into two levels. Line\
    \ breaking is typically done after an operator, and the next line is indented\
    \ two levels. For example (indents are four spaces):\n\n```\n// Break after operator,\
    \ following line indented two levels\ncallFunction(document, element, window,\
    \ \"some string value\", true, 123,\nnavigator);\n```\n\n```\n// Bad: Following\
    \ line indented only one level\ncallFunction(document, element, window, \"some\
    \ string value\", true, 123,\nnavigator);\n```\n\n```\n// Bad: Break before operator\n\
    callFunction(document, element, window, \"some string value\", true, 123,\nnavigator);\n\
    ```\n\nIn this example, the comma is an operator and should come last on the preceding\
    \ line. This placement is important because ASI mechanism, which may close a statement\
    \ at the end of a line in certain situations. By always ending with an operator,\
    \ ASI won’t come into play and introduce possible errors.\n\nThe same line-breaking\
    \ pattern should be used for statements as well:\n\n```\nif (isLeapYear && isFebruary\
    \ && day == 29 && isYourBirthday &&\n  noPlans) {\n\n  waitAnotherYears();\n}\n\
    ```"
