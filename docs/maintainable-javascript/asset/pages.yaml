    # Using Comments


    When to comment is a topic that always fosters great debate among developers.
    The general guidance is to comment when something is unclear and not to comment
    when something is apparent from the code itself. For example, the comment in this
    example doesn''t add any understanding to the code:


    ```

    // Bad


    // Initialize count

    var count = 10;

    ```


    It''s apparent from the code that count is being initialized. The comment adds
    no value whatsoever. If, on the other hand, the value 10 has some special meaning
    that you couldn''t possibly know from looking at the code, then a comment would
    be very useful:


    ```

    // Good


    // Changing this value will make it rain frogs

    var count = 10;

    ```


    As impl as it may be to make rain frogs by changing the value of count, this is
    an example of a good comment, because it tells you something that you otherwise
    would be unaware of. Imagine how confused you would be if you changed the value
    and it started to rain frogs...all because a comment was missing.


    The general rule is to add comments where they clarify the code.'
