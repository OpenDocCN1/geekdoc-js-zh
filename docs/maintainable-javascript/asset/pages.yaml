    <arg

    line="curly=true,forin=true,latedef=true,noempty=true,undef=true,rhino=false"

    />

    <srcfile/>

    <apply>

    </target>

    ```


    By adding one attribute, the `validate` target now passes all of the files onto
    the command line once (separated by spaces). Doing allows Jshint to read and validate
    all files with one JVM and dramatically improves the target speed.


    The last addition to the `validate` target is to have the build fail if validation
    fails. It''s usually a good idea to add this step, because it ensures that developers
    are aware of the problem. The current version of the `validate` target will output
    validation failures to the command line, but any other task that follows will
    continue to execute, potentially causing the failure to scroll off screen.


    You can force `<apply>` to fail the build by setting the `failerror` property
    to `


    ```

    <target name="validate">

    <apply executable="java" failerror="true" parallel="true">

    <fileset dir="${src.dir}" includes="*.js" />

    <arg line="-jar" />

    <arg path="js.jar" />

    <arg path="jshint.js" />

    <arg

    line="curly=true,forin=true,latedef=true,noempty=true,undef=true,rhino=false"

    />

    <srcfile/>

    </apply>

    </target>

    ```


    This version of the `validate` target will fail the build when an error occurs
    during execution of `<apply>`. Any nonzero exit code returned from the executable.
    By Jshint returns 1 when a validation error occurs, it will cause the build to
    fail.


    # Other Improvements


    The last step in improving the `validate` task is to externalize three pieces
    of data:


    +   - The location of `js.jar`

    - The location of `jshint.js`

    - The command-line options


    As these may change in the future, it''s best to represent them as properties
    and include them in your properties file or at the top of your `build.xml`. Here''s
    an example properties file:


    ```

    src.dir = ./src

    lib.dir = ./lib


    rhino = ${lib.dir}/jshint.jar

    ```'
