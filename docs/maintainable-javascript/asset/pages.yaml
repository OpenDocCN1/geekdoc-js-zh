  md: "# Naming\n\nCare should be taken to name variables and functions properly.\
    \ Names should be limited to alphanumeric characters and, in some cases, the underscore\
    \ character. Do not use the dollar sign ($) or backslash (\\ characters in any\
    \ names.\n\nVariable names should be formatted in camel case with the first letter\
    \ lowercase and the first letter of each subsequent word uppercase. The first\
    \ word of a variable name should be a noun (not a verb) to avoid confusion with\
    \ functions. Do not use underscores in variable names.\n\n```\n// Good\nvar accountNumber\
    \ = \"8401-1\";\n\n// Bad: Begins with uppercase letter\nvar AccountNumber = \"\
    8401-1\";\n\n// Bad: Begins with verb\nvar getAccountNumber = \"8401-1\";\n\n\
    // Bad: Uses underscore\nvar account_number = \"8401-1\";\n```\n\nFunction names\
    \ should also be formatted using camel case. The first word of a function name\
    \ should be a verb (not a noun) to avoid confusion with variables. Do not use\
    \ underscores in function names.\n\n```\n// Good\nfunction doSomething() {\n \
    \ // code\n}\n```\n\n```\n// Bad: Begins with uppercase letter\nfunction DoSomething()\
    \ {\n  // code\n}\n```\n\n```\n// Bad: Begins with noun\nfunction car() {\n  //\
    \ code\n}\n```\n\n```\n// Bad: Uses underscores\nfunction do_something() {\n \
    \ // code\n}\n```\n\nConstructor functions—functions used with the new operator\
    \ to create new objects—should be formatted in camel case but must begin with\
    \ an uppercase letter. Constructor function names should begin with a nonverb,\
    \ because new is the action of creating an object instance."
