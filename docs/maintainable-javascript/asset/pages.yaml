    \ person); // \"undefined\"\nconsole.log(typeof foo);\n```\n\nIn this example,\
    \ both person and foo cause typeof to return \"undefined\" even though they behave\
    \ very different in every other way (trying to use foo in a statement will cause\
    \ an error, but using person not).\n\nBy avoiding the use of the special value\
    \ undefined, you effectively keep the meaning of typeof \"undefined\" to a single\
    \ case: when a variable hasn't been declared. If you're using a variable that\
    \ may or not be assigned an object value later, initialize it to null:\n\n```\n\
    // Good\nvar person = null;\nconsole.log(person === null); //true\n```\n\nSetting\
    \ a variable to null initially indicates your intent for that variable; it should\
    \ explicitly contain an object. The typeof operator returns \"object\" for a null\
    \ value, so that it can be differentiated from undefined.\n\n# Object Literals\n\
    \nObject literals are a popular way to create new objects with a specific set\
    \ of properties, as opposed to explicitly creating a new instance of Object and\
    \ then adding properties. For example, this pattern is rarely used:\n\n```\n//\
    \ Bad\nvar book = new Object();\nbook.title = \"Maintainable JavaScript\";\nbook.author\
    \ = \"Nicholas C. Zakas\",\n```\n\nObject literals allow you to specify all of\
    \ the properties within two curly braces. Literals effectively perform the same\
    \ tasks as their nonliteral counterparts, just with more compact syntax.\n\nWhen\
    \ defining object literals, it's typical to include the opening brace on the first\
    \ line, each property-value pair on its own line, indented one level, then the\
    \ closing brace on its own line. For example:\n\n```\n// Good\nvar book = {\n\
    \  title: \"Maintainable JavaScript\",\n  author: \"Nicholas C. Zakas\"\n};\n\
    ```\n\nThis format most commonly seen in open source JavaScript code. Though it's\
    \ not commonly documented, the Google JavaScript Style Guide recommends using\
    \ this format. Crockford's Code Conventions recommends using object literals over\
    \ the Object constructor but does not specify a particular format."
