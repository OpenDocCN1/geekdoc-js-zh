    \ made it here,\n* then all security checks passed\n*/\nallowed();\n}\n\n// Bad:\
    \ Wrong indentation\nif (condition) {\n\n/*\n* if you made it here,\n* then all\
    \ security checks passed\n*/\nallowed();\n}\n\n// Bad: Don't use multiline comments\
    \ for trailing comments\nvar result = something + somethingElse; /*/somethingElse\
    \ will never be null*/\n```\n\n# # Using Comments\n\nWhen to comment is a topic\
    \ that always fosters great debate among developers. The general guidance is to\
    \ comment when something is unclear and not to comment when something is apparent\
    \ from the code itself. For example, the comment in this example doesn't add any\
    \ understanding to the code: \n\n```\n// Initialize count\nvar count = 10;\n```\n\
    \nIt's apparent from the code that count is being initialized. The comment adds\
    \ no value whatsoever. If, on the other hand, the value 10 has some special meaning\
    \ that you couldn't possibly know from looking at the code, then a comment would\
    \ be very useful:\n\n```\n// Good\n// Changing this value will make it rain frogs\n\
    var count = 10;\n```\n\nAs plausible as it may be to it rain frogs by changing\
    \ the value of count, this is an example of a good comment, because it tells you\
    \ something you otherwise would be unaware of. Imagine how confused you would\
    \ be if you changed the value and it started to rain frogs...all because a comment\
    \ was missing.\n\nSo the general rule is to add comments where they clarify the\
    \ code."
