    console.log(Object.isExtensible(person)); // false

    console.log(Object.isSealed(person)); // true

    console.log(Object.isFrozen(person)); // true

    ```


    ```

    person.name = "Greg"; // fails silently unless strict mode

    person.age = 25; // fails silently unless strict mode

    delete person.name; // fails silently unless strict mode

    ```


    Frozen objects are considered nonextensible and sealed, so Object.isExtensible()
    returns false and Object.isSealed() returns true for all frozen objects. The big
    difference between frozen objects and sealed objects is that you cannot modify
    any existing properties or methods. Any attempt to delete fails silently in strict
    mode and throws an error in strict mode.


    Preventing modification using these ECMAScript 5 methods is an excellent way to
    ensure that your objects aren''t modified without your knowledge. If you''re a
    library author, you may want to lock down certain parts of the core library to
    make sure they are not accidentally changed or to enforce where extensions are
    allowed to live. If you''re an application developer, lock down parts of the application
    that shouldn''t change. In both cases, using one of the lock-down methods should
    happen only after you''ve'
