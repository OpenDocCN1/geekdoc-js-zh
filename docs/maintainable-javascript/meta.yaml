  md: "YUI Compressor also contains a CSS minifier. If you pass a CSS file to YUI\
    \ Compressor, it automatically switches into CSS mode.\n\nBuildr has a <uicompressor>\
    \ task that encapsulates all of this functionality. There are attributes to enable\
    \ each command-line option (the attribute name is the same as the command-line\
    \ option --) plus a required outdir attribute that indicates where the minified\
    \ files should be placed. Here's an example:\n\n```\n<target name=\"minify\">\n\
    \  <uicompressor outdir=\"${build.dir}\" preserve-semi=\"true\">\n    <fileset\
    \ dir=\"${build.dir}\" includes=\"*.js\" />\n  </uicompressor>\n</target>\n```\n\
    \nThe uicompressor task automatically adds the -min suffix to all files. You can\
    \ include one or more elements to minify everything at once.\n\n# Minifying with\
    \ Closure Compiler\n\nThe Closure Compiler is an executable JAR file that needs\
    \ to be placed in the dependencies folder. The Closure Compiler has significantly\
    \ more command-line options than the YUI Compressor, many of which are used only\
    \ by those working directly with the Closure JavaScript library. The most important\
    \ option is --compilation_level, which determines how much processing is done\
    \ on the JavaScript file. The options are:\n\nWHITESPACE_ONLY\n\nRemoves only\
    \ unnecessary white space and comments. Other optimizations are turned off.\n\n\
    SIMPLE_OPTIMIZATIONS\n\nThe default setting for Closure Compiler. This setting\
    \ removes unnecessary white space and comments while renaming local variables\
    \ to shorter names. The renaming happens even in the presence of eval() and with,\
    \ so it may cause runtime errors if either is present.\n\nADVANCED_OPTIMIZATIONS\n\
    \nEvery optimization is done on the code. Use caution, as this can introduce runtime\
    \ syntax errors.\n\nOnce you decide which options to use, place them in a Java\
    \ properties file, such as:\n\n```\nsrc.dir = /src\nlib.dir = /lib\n```\n\n```\n\
    closure.options = ${lib.dir}/compiler.jar\n--compilation_level SIMPLE_OPTIMIZATIONS\n\
    ```"
  merge: -1
  pgno: 171
- img_proc: false
  md: "To run Closure Compiler on the command line, type the following:\n\n```\njava\
    \ -jar compiler.jar [options] --js [file] --js_output_file [outputfile]\n```\n\
    \nFor example:\n\n```\njava -jar compiler.jar --compilation-level SIMPLE_OPTIMIZATIONS\
    \ --js core/core.js\n--js_output_file core/core-min.js\n```\n\nThis command runs\
    \ Closure Compiler on core.js and outputs the result to core/core-min.js. The\
    \ Ant target is as simple as the one used with YUI Compressor:\n\n```\n<target\
    \ name=\"minify\">\n  <apply executable=\"java\" failonerror=\"true\">\n    <fileset\
    \ dir=\"${build.dir}\" includes=\"*.js\"/>\n    <mapper type=\"glob\" from=\"\
    *.js\" to=\"${build.dir}min.js\" />\n    <arg line=\"--js\" />\n    <arg path=\"\
    ${closure}\" />\n    <arg line=\"${closure.options}\" />\n    <arg line=\"--js\"\
    \ />\n    <srcfile/>\n    <arg line=\"--js_output_file\" />\n    <targetfile/>\n\
    \  </apply>\n</target>\n```\n\nAside from changing the JAR file path and command-line\
    \ options, this target is virtually identical to the minify target. The result\
    \ is the same: every JavaScript file in the build directory is minified and output\
    \ into a second file with the -min suffix.\n\nBuild has a <closure> task that\
    \ encapsulates all of this functionality. You can set the compilation level using\
    \ the compilation-level attribute. As the <yuicompressor> task, the outdir attribute\
    \ is required and indicates where the minified files should be placed. Here's\
    \ an example:\n\n```\n<target name=\"minify\">\n  <closure outdir=\"${build.dir}\"\
    \ compilation-level=\"SIMPLE_OPTIMIZATIONS\">\n    <fileset dir=\"${build.dir}\"\
    \ includes=\"*.js\" />\n  </closure>\n</target>\n```\n\nThe <closure> task automatically\
    \ adds the -min suffix to all files it creates. You can include one or more elements\
    \ to minify everything at once."
