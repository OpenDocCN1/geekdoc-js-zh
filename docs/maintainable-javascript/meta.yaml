  md: "# The Ant Target\n\nAs with Yeti, the Ant target for PhantomJS is quite simple.\
    \ There are just a few properties to keep track of:\n\n```\nsrc.dir = ./src\n\
    lib.dir = ./Lib\ntests.dir = ./tests\n\nphantomjs = phantomjs\nphantomjs.driver\
    \ = ${lib.dir}/phantomjs/examples/run-unit.js\nphantomjs.tests = tests.html\n\
    ```\n\nBecause the PhantomJS test runners support passing only one file at a time,\
    \ the Ant target uses <exec> instead of <apply>:\n\n```\n<target name=\"test\"\
    >\n  <exec executable=\"phantomjs\" failonerror=\"true\">\n    <arg path=\"${phantomjs.driver}\"\
    />\n    <arg path=\"${tests.dir}/${phantomjs.tests}\"/>\n  </exec>\n</target>\n\
    ```\n\nThe test target just passes two paths to the executable and fails if there's\
    \ an error.\nThe Buildr <phantomjs> task allows you to perform the same operation\
    \ with a slightly different syntax:\n\n```\n<target name=\"test\">\n  <phantomjs\
    \ driver=\"${phantomjs.driver}\">\n    <fileset dir=\"${tests.dir}\" includes=\"\
    *.html\" />\n  </phantomjs>\n</target>\n```\n\nThe driver attribute is required\
    \ and specifies the PhantomJS driver to use for your tests. The <phantomjs> task\
    \ expects one or more <fileset> elements to be present specifying the tests to\
    \ run. Otherwise, it behaves the same as the previous test target.\n\n# JsTestDriver\n\
    \nJsTestDriver is a command-line utility written by engineers at Google. Similar\
    \ to Selenium and Yeti, JsTestDriver works with already installed browsers to\
    \ run tests. JsTestDriver has its own JavaScript testing framework, so you must\
    \ write tests using that library by default. A QUnit adapter to allow QUnit-based\
    \ tests to be executed with JsTestDriver, and it's possible to write your own\
    \ adapter if you so choose."
  merge: -1
  pgno: 190
- img_proc: false
  md: '# Installation and Usage


    JsTestDriver is written in Java, so you must first download the latest JAR file
    and put it into your dependencies directory. JsTestDriver''s most common mode
    is to run on a developer machine by manually connecting browsers to the JsTestDriver
    server. Configuration information, including which files to execute as, are included
    in a YAML file that looks like this:


    server: http://localhost:4224


    +   load:

    - *.js


    The first line indicates where the JsTestDriver server should be set up and the
    load section indicates which JavaScript files to load for testing.


    For a build system, JsTestDriver offers a command that automatically starts and
    stops browsers while collecting test results. The format is as follows:


    ```

    java -jar JsTestDriver.jar --port [port] --browser [browsers] --config [file]

    --tests all --output [directory]

    ```


    For example:


    ```

    java -jar JsTestDriver.jar --port 4224 --browser firefox,iexplore

    --config conf/conf.yml --tests all --output ./results

    ```


    This command runs all tests specified in conf/conf.yml on Firefox and Internet
    Explorer and outputs the results in results. The --browser option requires the
    path to the browser executables, so this example assumes that firefox and ieplore
    are executable without a full path.


    # The Ant Target


    Creating a target for JsTestDriver requires keeping track of a few key pieces
    of information:


    ```

    src.dir = .src

    lib.dir = .lib

    tests.dir = .tests

    ```


    ```

    jstdriver = $(lib.dir)/JsTestDriver.jar

    jstdriver.port = 4224

    jstdriver.browser = firefox,iexplore

    jstdriver.config = conf/conf.yml

    jstdriver.output = ./results

    ```


    The Ant target looks very similar to the one for YUI Selenium Driver:


    ```

    <target name="test">

    <exec executable="java" failonerror="true">

    <arg line="-jar"/>

    <arg path="${jstdriver}"/>

    ```'
