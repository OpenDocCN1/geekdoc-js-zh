  md: 'The eval() function isn''t the only way to execute a JavaScript string within
    JavaScript. The same can be done using the Function constructor as well as setTimeout()
    and setInterval(). Here are some examples:


    ```

    var myFunc = new Function("alert(''Hi!")");

    setTimeout(document.body.style.background=''red'', 50);

    setInterval("document.title = "It is now " + (new Date()),\ 1000);

    ```


    All of these are considered good practice by most of the JavaScript community.
    Although eval() may be used from time to time in JavaScript libraries (mostly
    in relation to JSON), the other three are rare, if ever. A good general guideline
    is to never use Function and to eval() only if no other options are present. But
    setTimeout() and setInterval() can be used but should use function instead of
    strings:


    ```

    setTimeout(function() {

    document.body.style.background=''red'';

    }, 50);

    ```


    Croford''s Code forbids the use of eval() and Function, as well as setTimeout()
    and setInterval() when used with strings. The jQuery Style Guide forbids the use
    of eval() except for JSON parsing falling back in one place. The Google JavaScript
    Style Guide allows the use of eval() only for converting Ajax responses into JavaScript
    values.


    Both JSLint and JSH warn about the use of eval(), Function, setTimeout(), and
    setInterval() by default.


    ECMAScript 5 script puts restrictions on eval(), preventing it from creating new
    variables or functions in the enclosing scope. This restriction closes some of
    the security holes in eval(). However, avoiding eval() is still recommended unless
    there is absolutely no other way to accomplish the task.


    ![](bbox=[0.143, 0.613, 0.235, 0.683])


    # Primitive Wrapper Types


    A little-known and often misunderstood aspect of JavaScript is the language''s
    reliance on primitive wrapper types. There are three primitive types: String,
    Boolean, and Number. Each of these exists as a constructor in the global scope
    and each represents the object form of its respective wrapper type. The main use
    of primitive wrapper types is to make primitive values act like objects, for instance:


    ```

    var name = "Nicholas";

    console.log(name.toUpperCase());

    ```'
  merge: -1
  pgno: 65
- img_proc: false
  md: 'Even though name is a string, which is a primitive type and therefore not an
    object, you''re still able to use methods such as touUpperCase() as if the string
    were an object. This usage is made possible because the JavaScript engine creates
    a new instance of the String type behind the scenes for that statement. Afterward,
    it''s destroyed, and another is created when it is needed. You can test this behavior
    by trying to add a property to a string:


    ```

    var name = "Nicholas";nname.author = true;

    console.log(name.author); // undefined

    ```


    The author property has vanished after the second line. That''s because the temporary
    String object was created for line 3. It''s possible to create these objects yourself
    as well as:


    +   // Bad

    var name = new String("Nicholas");

    var author = new Boolean(true);

    var count = new Number(10)


    Although it''s possible to use these primitive wrapper types, I strongly recommend
    avoiding them. Developers tend to get confused as to whether they''re dealing
    with an object or a primitive, and bugs occur. There isn''t any reason to create
    these objects yourself.


    The Google JavaScript Style Guide forbids the use of primitive wrapper types.
    Both JSLint and JSHint will warn if you try to use String, Number, or Boolean
    to create new objects.'
