  md: "# Headers and Footers\n\nThe <concat> task also has the handy to prepend and\
    \ append plain text to the resulting file. This capability allows you to insert\
    \ pieces of information into the file that you might otherwise have available.\
    \ I tend to insert the build time into files I can easily track down errors. To\
    \ do so, I start by defining a <timestamp> element at the top of the file:\n\n\
    ```\n<timestamp>\n<format property=\"build.time\"\n  pattern=\"MMMM d, yyyy hh:mm:ss\"\
    \n  locale=\"en,US\"/>\n</timestamp>\n```\n\nThis code creates a timestamp when\
    \ the build.xml file is executed by Ant. The resulting date string is stored in\
    \ a property named build time. The pattern attribute is date-time formatting.\
    \ I can use the <header> element to add this information into the built file:\n\
    \n```\n<target name=\"concatenate\">\n<concat destfile=\"${build.dir}/build.js\"\
    \ fixlastline=\"yes\" eol=\"lf\">\n<header>/* Build Time: ${build.time} */</header>\n\
    \  <filelist dir=\"${src.dir}\" files=\"first.js,second.js\" />\n  <fileset dir=\"\
    ${src.dir}\" includes=\"**/*.js\" excludes=\"first.js,second.js\" />\n</concat>\n\
    </target>\n```\n\nThis version of the concatenate target inserts a comment at\
    \ the top of the file containing the build file. The first line of the file has\
    \ this format:\n\n/* Build Time: May 25, 2012 03:20:45 */\n\nThere is also a <footer>\
    \ element that can be used to add additional text at the bottom of the file. For\
    \ example, this version of concatenate puts the build time at the bottom:\n\n\
    ```\n<target name=\"concatenate\">\n<concat destfile=\"${build.dir}/build.js\"\
    \ fixlastline=\"yes\" eol=\"lf\">\n  <filelist dir=\"${src.dir}\" files=\"first.js,second.js\"\
    \ />\n  <fileset dir=\"${src.dir}\" includes=\"**/*.js\" excludes=\"first.js,second.js\"\
    \ />\n<footer>/* Build Time: ${build.time} */</</footer>\n</concat>\n</target>\n\
    ```\n\nYou can use both <header> and <footer>at the same time or just one at a\
    \ time."
