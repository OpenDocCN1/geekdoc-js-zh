  md: "```\n<arg\nline=\"curly=true,forin=true,latedef=true,noempty=true,undef=true,rhino=false\"\
    \n/>\n<src src=\"/>\n<apply>\n</target>\n```\n\nBy adding one attribute, the `validate`\
    \ target now passes all of the files onto the command line at once (separated\
    \ spaces). Doing allows JSHInt to read and validate all files with one JVM and\
    \ dramatically improves the target speed.\n\nThe last addition to the `validate`\
    \ target is to have the build fail if validation fails. It’s usually a good idea\
    \ to add this step, because it ensures that developers are aware of the problem.\
    \ The current version of the `validate` target will output validation failures\
    \ to the command line, but any other task that follows will continue to execute,\
    \ potentially causing the failure to scroll off screen.\n\nYou can force `<apply>`\
    \ to fail by setting the `failonerror` property to \"true\":\n\n```\n<target name=\"\
    validate\">\n<apply executable=\"java\" failonerror=\"true\" parallel=\"true\"\
    >\n  <fileset dir=\"${src.dir}\" includes=\"**/*.js\" />\n  <arg line=\"-jar\"\
    \n  <arg path=\"js.jar\"\n  <arg path=\"jshint.jar\"\n  <arg\n  line=\"curly=true,forin=true,latedef=true,noempty=true,undef=true,rhino=false\"\
    \n/>\n</apply>\n</target>\n```\n\nThis version of the validate target will fail\
    \ the build when an error occurs during execution of `<apply>`. An is nonzero\
    \ exit code returned from the executable. Because JSHInt returns 1 when a validation\
    \ error occurs, it will cause the build to fail.\n\n# Other Improvements\n\nThe\
    \ last step in improving the `validate` task is to externalize three pieces of\
    \ data:\n\n+   - The location of `js.jar`\n- The location of `jshint.js`\n- The\
    \ command-line options\n\nAs these may change in the future, it’s best to represent\
    \ them as properties and include them in your properties file or at the top of\
