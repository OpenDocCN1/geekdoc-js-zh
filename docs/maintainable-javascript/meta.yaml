  md: "# Variables, Functions, and Operators\n\nThe real guts of any JavaScript program\
    \ are the functions you write to accomplish tasks. Inside the functions, variables\
    \ and operators are used to move bits around and make things happen. That's why,\
    \ after getting the basic formatting of your JavaScript down, it's important to\
    \ decide how to use functions, variables, and operators to reduce complexity and\
    \ improve readability.\n\n# Variable Declarations\n\nVariable declarations are\
    \ accomplished by using the var statement. JavaScript allows the var statement\
    \ to be used multiple times and nearly anywhere within a script. This usage creates\
    \ interesting cognitive issues for developers, because all var statements are\
    \ hoisted to the top of the containing function regardless of where they actually\
    \ occur in the code. For example:\n\n```\nfunction doSomething() {\n  var result\
    \ = 10 + value;\n  var value = 10;\n  return result;\n}\n```\n\nIn this code,\
    \ it's perfectly valid for the variable value to be used before it was declared,\
    \ though it will cause result to have the special value NaN. To understand why,\
    \ you need to be aware that this is changed by the JavaScript engine to this:\n\
    \n```\nfunction doSomething() {\n  var result;\n  var value;\n\n  result = 10\
    \ + value;\n  value = 10;\n\n  return result;\n}\n```"
  merge: -1
  pgno: 56
- img_proc: false
  md: "The two var statements are hoisted to the top of the function; the initialization\
    \ happens afterward. The variable value has the special value undefined when it's\
    \ used on line 6, so result becomes NaN (not a number). Only after that value\
    \ is finally assigned the value of 10.\n\nOne area where developers tend to miss\
    \ variable declaration hoisting is with statements, in which variables are declared\
    \ as part of the initialization:\n\n```\nfunction doSomethingWithItems(items)\
    \ {\n\n  for (var i=0, len=items.length; i < len; i++) {\n    doSomething(items[i]);\n\
    \  }\n}\n```\n\nJavaScript to ECMAScript 5 has no concept of block-level variable\
    \ declarations, so this code is actually equivalent to the following:\n\n```\n\
    function doSomethingWithItems(items) {\n\n  var i, len;\n\n  for (i=0, len=items.length;\
    \ i < len; i++) {\n    doSomething(items[i]);\n  }\n}\n```\n\nVariable declaration\
    \ hoisting means defining a variable anywhere in a function is the same as declaring\
    \ it at the top of the function. Therefore, a popular style is to have all variables\
    \ declared at the top of a function instead of scattered throughout. In short,\
    \ you end up writing code in the manner in which the JavaScript engine will interpret\
    \ it.\n\nMy recommendation is to have your local variables defined as the first\
    \ statements in a function. This approach is recommended in Crockford's Code Conventions,\
    \ the SproutCore Style Guide, and the Dojo Style Guide:\n\n```\nfunction doSomethingWithItems(items)\
    \ {\n\n  var i, len;\n  var value = 10;\n  var result = value + 10;\n\n  for (i=0,\
    \ len=items.length; i < len; i++) {\n    doSomething(items[i]);\n  }\n}\n```\n\
    \nCrockford goes on to recommend the use of a single var statement at the top\
    \ of functions:"
