  md: "```\n// Good\nfunction getById (id) {\n\n  var element = null;\n\n  if (document.getElementById(id))\
    \ { // DOM\n    element = document.getElementById(id);\n  } else if (document.all)\
    \ { // IE\n    element = document.all[id];\n  } else if (document.layers) { //\
    \ Netscape <= 4\n    element = document.layers[id];\n  }\n\n  return element;\n\
    }\n\n```\n\nThis is a good and appropriate use of feature detection, because the\
    \ code tests for a feature and then, if it's there, it uses it. The test for document.getElementById()\
    \ comes first because it is the standards-based solution. After that come the\
    \ two browser-specific solutions. If none of these features is available, then\
    \ the method returns null. The best part about this is that when Internet Explorer\
    \ 5 and Netscape 6 were released with support for document.getElementById(), this\
    \ code didn't need to change.\n\nThe previous example illustrates several important\
    \ parts of feature detection:\n\n+   1. Test for the standard solution\n2. Test\
    \ for browser-specific solutions\n3. Provide a logical fallback if no solution\
    \ is available\n\nThe same approach is used today with the cutting-edge features\
    \ that browsers have implemented experimentally while the specification is being\
    \ finalized. For instance, the requestAnimationFrame() method was being finalized\
    \ toward the end of 2011, at which several browsers have already implemented their\
    \ own with a version prefix. The proper feature detection for requestAnimationFrame()\
    \ looks like this:\n\n```\n// /\nfunction setAnimation (callback) {\n\n  if (window.requestAnimationFrame)\
    \ { // standard\n    return requestAnimationFrame(callback);\n  } else if (window.mozRequestAnimationFrame)\
    \ { // Firefox\n    return window.mozRequestAnimationFrame(callback);\n  } else\
    \ if (window.webkitRequestAnimationFrame) { // WebKit\n    return window.webkitRequestAnimationFrame(callback);\n\
    \  } else if (window.oRequestAnimationFrame) { // Opera\n    return window.oRequestAnimationFrame(callback);\n\
    \  } else if (window.msRequestAnimationFrame) { // IE\n    return window.msRequestAnimationFrame(callback);\n\
    \  } else {\n    return setTimeout(callback, 0);\n  }\n}\n\n```"
