  md: "# CHAPTER 6\n\n# Avoid Globals\n\nThe JavaScript execution environment is unique\
    \ in a lot of ways. One of those ways is in the use of global variables and functions.\
    \ The default JavaScript execution environment is, in fact, defined by the various\
    \ globals available to you at the start of script execution. All of these are\
    \ said to be defined on the *global object*, a mysterious object that represents\
    \ the outermost context for a script.\n\nIn browsers, the *window* object is typically\
    \ overloaded to also be the global object, so any variable or function declared\
    \ in the global scope becomes a property of the window object. For example:\n\n\
    ```\nvar color = \"red\"\n\nfunction say() {\n  alert(color);\n}\n\nconsole.log(window.color);\
    \ // \"red\"\nconsole.log(typeof window.Color); // \"function\"\n```\n\nIn this\
    \ code, the global variable **color** and the global function **sayColor** are\
    \ defined. Both are added to the *window* object as properties even though they\
    \ weren't explicitly set to do so.\n\n# The Problems with Globals\n\nCreating\
    \ globals is considered a bad practice in general and is specifically problematic\
    \ in a team development environment. Globals create a number of nontrivial maintenance\
    \ issues for code going forward. The more globals, the greater the possibility\
    \ that errors will be introduced due to the increasing likelihood of a few common\
    \ problems."
  merge: -1
  pgno: 84
- img_proc: false
  md: "# Naming Collisions\n\nThe potential for naming collisions increases as the\
    \ number of global variables and functions increase in a script, as the chances\
    \ that you'll use an already declared variable accidentally. The easiest code\
    \ to maintain is code in which all of its variables are defined locally.\n\nFor\
    \ instance, consider the sayColor() function from the previous example. This function\
    \ relies on the global variable color to function correctly. If sayColor() were\
    \ defined in a separate file from color, it would be hard to track down:\n\n```\n\
    function sayColor() {\n  alert(color);      // Bad: where did this come from?\n\
    }\n```\n\nFurther, if color ends up being defined in more than one place, the\
    \ result of sayColor() could be different depending on how this function is used\
    \ with the other code.\n\nThe global environment is native JavaScript objects\
    \ are defined, and by adding your own names into that scope, you run the risk\
    \ of picking a name that might be provided natively by the browser on. The name\
    \ color, for example, is definitely not a safe global variable name. It's a plain\
    \ noun without any qualifiers, so the chances of collision with an upcoming native\
    \ API, or another developer's work, is quite high.\n\n# Code Fragility\n\nA function\
    \ that depends on globals is tightly coupled to the environment. If the environment\
    \ changes, the function is likely to be break. In the previous example, the sayColor()\
    \ method would throw an error if the global color variable no longer exists. That\
    \ means any change to the global environment is capable of causing errors throughout\
    \ the code. Also, globals can be changed at any point by any function, making\
    \ the reliability of their values highly suspect. The function from the previous\
    \ example is much more maintainable if color is passed in as an argument:\n\n\
    ```\nfunction sayColor(color) {\n  alert(color);\n}\n```\n\nThis version of the\
    \ function has no global dependencies and thus won't be affected by changes to\
    \ the global environment. Because color is now a named argument, all that matters\
    \ is a valid value passed into the function. Other changes will not affect this\
    \ function's ability to complete its task.\n\nWhen defining functions, it's best\
    \ to have as much data as possible local to the function. Anything that comes\
    \ from outside the function should be written as such; any data that isolates\
    \ the function from the surrounding environment and allows you to make changes\
    \ to without affecting the other."
  merge: -1
  pgno: 85
- img_proc: false
  md: "# Difficulty Testing\n\nI tried to implement some unit testing on one of my\
    \ first large-scale web applications. Had joined the team after most of the core\
    \ framework had been built and was trying to get a better understanding of how\
    \ everything worked in order to create tests. I was dismayed to discover that\
    \ creating tests was going to be an extremely difficult process because the entire\
    \ framework relied on the presence of several global variables to work properly.\n\
    \nAny function that relies on global variables requires you to recreate the entire\
    \ global environment to test that function. Effectively, this means that you are\
    \ not just managing changes in one global environment, you're managing them in\
    \ two global environments: production and testing. And add to the cost of keeping\
    \ those in sync, you've got the beginnings of a maintenance nightmare that isn't\
    \ easily untangled.\n\nEnsuring that your functions not rely on globals improves\
    \ the testability of your code. Of course, your function may rely on globals that\
    \ are native to JavaScript, such as Date, Array. These will be part of the global\
    \ environment due to the JavaScript engine. Your functions can always assume that\
    \ such globals will be present. However, do not allow your functions to become\
    \ dependent on global variables that you've introduced to ensure optimal test.\n\
    \n# Accidental Globals\n\nOne of the more insidious parts of JavaScript is its\
    \ capacity for creating globals accidentally. When you assign a value to a variable\
    \ that has not previously been defined in a var statement, JavaScript() automatically\
    \ creates a global variable. For example:\n\n```\nfunction something() {\n  var\
    \ count = 10;\n  title = \"Maintainable JavaScript\"; // Bad: global\n}\n```\n\
    \nThis code represents a very common error that accidentally introduces a global\
    \ variable. The author probably wanted to declare two variables using a single\
    \ var statement but accidentally included a semicolon after the first variable\
    \ instead of comma. The result is the creation of title as a global variable.\n\
    \nThe problem is compounded when you're trying to create a local variable with\
    \ the same name as a global variable. For example, a global variable named count\
    \ would be shadowed by the local variable count in the previous example. The function\
    \ then has access only to the local count unless explicitly accessing the global\
    \ using window.count. This arrangement is perfectly okay.\n\nOmitting the var\
    \ statement accidentally might mean that you're changing the value of an existing\
    \ global variable without knowing it. Consider the following:"
  merge: -1
  pgno: 86
- img_proc: false
  md: "```\nfunction doSomething() {\n  var count = 10;\n  name = \"Nicholas\"; //\
    \ Bad: global\n}\n```\n\nIn this example, the error is even more egregious because\
    \ name is actually a property of window by default. The window.name property is\
    \ most frequently used with frames or iframes, and if any links are targeted to\
    \ show up in certain frames or tabs when clicking, changed name inadvertently\
    \ could affect how links navigate in the site.\n\nA good rule of thumb is to always\
    \ use var to define variables, even if they are global. This way is a lot less\
    \ error prone than omitting the var in certain situations.\n\n# Avoiding Accidental\
    \ Globals\n\nJavaScript won't warn when you accidentally created a global variable\
    \ by default. That's when tools like JSLint and JSHint come into play. Both tools\
    \ will warn if you assign a value to a previously undeclared variable. For example:\n\
    \n```\nfoo = 10;\n```\n\nBoth JSLint and JSHint will issue the warning \"foo is\
    \ not defined\" to let you know that the variable foo was never declared using\
    \ a statement.\n\nJSLint and JSHint are also smart enough to notice that you're\
    \ accidentally changing the value of certain globals. In the example that overwrites\
    \ the value of name, JSLint and JSHint warn that the variable is read-only. In\
    \ fact, the variable isn't readonly; it should be treated as such, because changing\
    \ a native global almost always leads to errors. The same warning is issued if\
    \ you try to assign other globals such as window and document.\n\nStrict mode,\
    \ which changes some of the rules for parsing and executing JavaScript, offers\
    \ a solution to this problem. By adding \"use strict\" to the top of a function,\
    \ you instruct the JavaScript engine to apply more rigorous error handling and\
    \ syntax checking before executing the code. One of these is the ability to detect\
    \ assignment to undeclared variables. When this happens, the JavaScript engine\
    \ throws an error.\n\n```\n\"use strict\"\nfoo = 10; // ReferenceError: foo is\
    \ not defined\n```\n\nIf you try to code in an environment supporting strict mode\
    \ (Internet Explorer 10+, Firefox 4+, Safari 5.1+, Opera 12+, or Chrome), the\
    \ second will throw a ReferenceError with a message of \"foo is not defined.\"\
    \n\nTurning on strict mode changes a lot of JavaScript behavior, so it carefully\
    \ if you're working with older code. For newer code, it's best to always use var\
    \ to avoid accidental globals as well as other programming errors that strict\
    \ mode catches."
  merge: -1
  pgno: 87
- img_proc: false
  md: "# The One-Global Approach\n\nYou may be thinking at this point, “How is it\
    \ possible to write JavaScript without introducing any globals?” Although it is\
    \ technically possible through some clever patterns, this approach is usually\
    \ not feasible or maintainable in the long run. When JavaScript is developed by\
    \ a team, that typically means multiple files are loaded in various scenarios,\
    \ and the only way to enable communication between these disparate code is to\
    \ have something that all the code can rely on be present. The best approach is\
    \ to try to have as small a global footprint as possible by agreeing to create\
    \ only one object.\n\nThe one-global approach is used by all popular JavaScript\
    \ libraries:\n\n+   * YUI defines a single global object.\n* jQuery actually defines\
    \ two globals, $ and jQuery. The latter was added only for compatibility when\
    \ on a page with other libraries also using $.\n* Dojo defines a single global\
    \ object.\n* The Closure library defines a single go object.\n\nThe idea behind\
    \ the one-global approach is to create a single global with a unique name (which\
    \ is unlikely to be used by native APIs) and then attach all of your functionality\
    \ onto one global. Instead of creating multiple globals, each would-global simply\
    \ becomes a property of one global. For instance, suppose I wanted to have an\
    \ object representing each chapter in this book. The code might look like this:\n\
    \n```\nfunction Book(title) {\n  this.title = title;\n  this.page = 1;\n}\n```\n\
    \n```\nBook.prototype.turnPage = function(direction) {\n  this.page += direction;\n\
    }\n```\n\n```\nvar Chapter1 = new Book(\"Introduction to Style Guidelines\");\n\
    var Chapter2 = new Book(\"Basic Formatting\");\nvar Chapter3 = new Book(\"Comments\"\
    );\n```\n\nThis code creates four globals, Chapter1, Chapter2, and Chapter3. The\
    \ one-global approach would be to create a single global and attach each of them:\n\
    \n```\nvar MaintainableJS = {};\n```\n\n```\nMaintainableJS.Book = function(title)\
    \ {\n  this.title = title;\n  this.page = 1;\n}\n```\n\n```\nMaintainableJS.Book.prototype.turnPage\
    \ = function(direction) {\n  this.page += direction;\n}\n```"
  merge: -1
  pgno: 88
- img_proc: false
  md: "MaintainableJS.Chapter1 = new MaintainableJS.Book(\"Introduction to Style Guidelines\"\
    );\nMaintainableJS.Chapter2 = new MaintainableJS.Book(\"Basic Formatting\");\n\
    MaintainableJS.Chapter3 = new MaintainableJS.Book(\"Comments\");\n\nThis code\
    \ has a single global, MaintainableJS, to which all of the other information is\
    \ attached. As long as everyone on the team is aware of the single global, its\
    \ easy to continue adding properties to it and avoid global pollution.\n\n# Namespaces\n\
    \nIt is possible to start poluting your global as well. Most projects that use\
    \ the one-global approach also have the concept of namesacing. A namespace is\
    \ simply a logical grouping of functionality under a single property on the global.\
    \ For instance, YUI is related to DOM manipulation, everything except using namespaces.\
    \ Everything under Y.DOM is a method related Y.Event has to do with, and so on.\n\
    Grouping into namespaces brings some order to your one global object and allows\
    \ team members to understand where new functionality belongs as well as where\
    \ to look for existing functionality. When I worked at Yahoo!, there was an unspoken\
    \ convention that each site added its own namespace to Y object for all of its\
    \ and so on. That design allowed teams to use one's code without fear of naming\
    \ collisions.\n\nYou can easily create your own namespaces in JavaScript with\
    \ objects, as in:\n\n```\nvar ZakasBooks = {};\n\n// namespace for this book\n\
    ZakasBooks.MaintainableJavaScript = {};\n```\n\n```\n// namespace for another\
    \ book\nZakasBooks.HighPerformanceJavaScript = {};\n```\n\nA common convention\
    \ is for each file to declare its own namespace by creating a new object on the\
    \ global. In such circumstances, the previous example works fine.\nThere are also\
    \ times when each file is simply adding to a namespace; in that case, you may\
    \ want a little more assurance that the namespace already exists. That's when\
    \ a global that handles namespaces nondestructively is useful. The basic pattern\
    \ to accomplish this is:\n\n```\nvar YourGlobal = {\n  namespace: function(ns)\
    \ {\n    var parts = ns.split(\".\");\n    object = this,\n    i, len;\n  }\n\
    ```"
