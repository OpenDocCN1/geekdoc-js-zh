    yuicomressor.options = --preserve-semi\n```\n\nNext, create a target for minification.\
    \ With validation, it's helpful to look at the\ncommand-line syntax first. To\
    \ run YUI Compressor on the command line, type the\nfollowing:\n\n```\njava -jar\
    \ yuicomressor.jar [options] [file] -o [outputfile]\n```\n\nFor example:\n\n```\n\
    java -jar yuicomressor.jar --preserve-semi core/core.js -o core/core-min.js\n\
    ```\n\nThis command runs YUI Compressor on core/core.js and outputs the result\
    \ to core/\n-min.js. Appending -min to the filename is a common practice when\
    \ minifying files,\nto that does as well. The <apply> task is once again the one\
    \ to use, and here's\ntarget:\n\n```\n<target name=\"minify\">\n  <apply executable=\"\
    java\" failnonerror=\"true\">\n    <fileset dir=\"${build.dir}\" includes=\"*.js\"\
    />\n    <mapper type=\"glob\" from=\"*.js\" to=\"${build.dir}/*-min.js\">\n  \
    \    <arg line=\"-jar\"/>\n      <arg path=\"${yuicomressor}\"/>\n      <arg line=\"\
    ${yuicomressor.options}\"/>\n      <srcfile/>\n      <arg line=\"-o\"/>\n    <|targetfile|>\n\
    \  </apply>\n</target>\n```\n\nThis target is very similar to the validate target\
    \ from earlier in the book. It starts by\nspecifying the executable as java and\
    \ indicates that the command should be run\non all JavaScript files in the build\
    \ directory. These files get read one by one and are\nput in the place of <srcfile/>.\
    \ The next line uses the <mapper> task to translate file-\nnames. It uses <srcfile/>\
    \ and appends -min to the filename. core.js becomes\ncore-min.js, and this value\
    \ is used in place of the <targetfile/> element. The rest of the\n<arg> elements\
    \ are self-explanatory.\n\nThe minify task is designed to be used after you've\
    \ built files into the build directory\nbut can easily be modified to run in any\
    \ directory.\n\nMinification | 153"
  merge: -1
