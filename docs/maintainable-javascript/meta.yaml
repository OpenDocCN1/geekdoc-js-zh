  md: "# Planning the Build\n\nTo put the build system pieces together in the correct\
    \ order, it helps to think about your development process and the different build\
    \ types you'll need. It's very rare for a project to have a single build type\
    \ and much more common for there to be at least three:\n\n# Development\n\nA development\
    \ build is run by developers as they are working. This build should be as fast\
    \ as possible so as not to interrupt developer productivity. Generally speaking,\
    \ you want to prevent accidental errors and get the code into good testing shape\
    \ that developers can load into the browser for hands-on testing. This build should\
    \ take no more than 15 seconds, so you need to choose what you're doing carefully.\
    \ If you're working on a web application, you may want to have a separate JavaScript\
    \ development build that can run independently of the overall web build. This\
    \ is also typically the default build.\n\n# Integration\n\nAn automated build\
    \ is run on a regular schedule. These are sometimes run for each commit, on large\
    \ projects, they tend to run on intervals for a few minutes. The integration build\
    \ is responsible for finding problems in the system. Because it's automated, this\
    \ build can take longer to complete but must be as thorough as possible. In some\
    \ cases, the integration build is the last line of defense before pushing changes\
    \ to production.\n\n# Release\n\nAn on-demand build is run only prior to a production\
    \ push. This build's job is mostly to get the code into its final form so that\
    \ it can be deployed. In theory, if the integration did its job, then the release\
    \ build shouldn't have errors. In practice, that's not always the case. The release\
    \ build may be responsible for a few more tasks that could also cause errors before\
    \ deployment.\n\nOf course, your project have many more build types depending\
    \ on your development process.\n\nYour build.xml should always start looking like\
    \ this:\n\n```\n<project name=\"yourapp\" default=\"build.dev\">\n\n<!-- import\
    \ properties --\n<loadproperties srcfile=\"yourapp.properties\" />\n\n<!-- define\
    \ or import utility targets here -->\n\n<!-- initialization and cleanup -->\n\
    <target name=\"init\">\n    <mkdir dir=\"$(build.dir)\"/>\n</target>\n```"
  merge: -1
