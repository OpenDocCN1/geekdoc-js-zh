  md: "```\nvar MyProject = {\n  version: \"@VERSION@\"\n};\n```\n\nYou can replace\
    \ @VERSION@ with an actual version number using the following:\n\n```\n<replacergexp\
    \ match=\"@VERSION@\" replace=\"${version}\" flags=\"g\" byline=\"true\">\n  <fileset\
    \ dir=\"${build.dir}\" includes=\"**/*\">\n</replacergexp>\n```\n\nThe replacergexp\
    \ task takes the regular expression from the match attribute and replaces it in\
    \ the replace attribute. Regular expression flags such as g, i, and m are specified\
    \ using the flags attribute, and byline indicates whether the regular expression\
    \ should match just a single line. You specify number of files in which this replacement\
    \ should be made example:\n\nBecause replacergexp does not create files, it is\
    \ safe to run it on the build files, in the following example:\n\n```\n<target\
    \ name=\"concat\">\n  <concat destfile=\"${build.dir}/build.js\" fixlast=\"yes\"\
    \ eol=\"$lf\">\n    <fileslist dir=\"${src.dir}\" files=\"*.first.js,*.second.js\"\
    \ />\n    <fileset dir=\"${src.dir}\" includes=\"**/*.js\" excludes=\"first.js,second.js\"\
    \ />\n    <footer>Build Time: ${build.time} </footer>\n  </concat>\n</target>\n\
    ```\n\n```\n<replacergexp match=\"@VERSION@\" replace=\"${version}\" flags=\"\
    g\" byline=\"true\">\n  <fileset dir=\"${build.dir}\" includes=\"**/*\">\n</replacergexp>\n\
    ```\n\n```\n</target>\n```\n\nThis code replaces all instances of @VERSION@ in\
    \ all build files with the version property. Although the replacement takes place\
    \ in the concatenate target here, you may also want to have a target for baking=\"\
    bake\":\n\n```\n<target name=\"bake\">\n```\n\n```\n<replacergexp match=\"@VERSION@\"\
    \ replace=\"${version}\" flags=\"g\" byline=\"true\">\n  <fileset dir=\"${build.dir}\"\
    \ includes=\"**/*\">\n</replacergexp>\n```\n\n```\n</target>\n```\n\nSeparating\
    \ out the baking step makes sense when it doesn't involve the <concat> task and\
    \ may not always be done during the build process."
