  md: "# CHAPTER 8\nAvoid Null Comparisons\n\nA common yet still problematic pattern\
    \ in JavaScript is testing a variable against null, presumably to determine whether\
    \ the variable has been filled in with an appropriate value. For example:\n\n\
    ```\nvar Controller = {\n  process: function(items) {\n    if (items != null)\
    \ { // Bad\n      items.sort();\n      items.forEach(function(item) {\n      \
    \  // do something\n      });\n    }\n  }\n};\n```\n\nHere, the process() method\
    \ is clearly expecting that items will be an array, as indicated by the use of\
    \ sort() and forEach(). The intention of this code is clear: don't continue unless\
    \ the items argument contains an array. The problem with this approach is that\
    \ the comparison against null doesn't actually prevent future errors. The value\
    \ of items could be 1, a string, or some random object. All of these are technically\
    \ not equal to null and would therefore cause the process() method to fail once\
    \ sort() executes.\n\nComparing a variable against null typically gives you enough\
    \ information about the value to determine whether it's safe to proceed. Fortunately,\
    \ JavaScript gives you a number of ways to determine the true value of a variable.\n\
    \n# Detecting Primitive Values\n\nThere are five primitive types in JavaScript:\
    \ string, number, boolean, null, and undefined. If you are expecting a value to\
    \ be a string, number, boolean, or undefined, then the typeof operator is your\
    \ best option. The typeof operator works on a variable and returns a string indicating\
    \ the type of value:"
  merge: -1
  pgno: 100
- img_proc: false
  md: "+   - For strings, typeof returns \"string.\"\n- For numbers, typeof returns\
    \ \"number.\"\n- For booleans, typeof returns \"boolean.\"\n- For undefined, typeof\
    \ returns \"undefined.\"\n\nBasic syntax for typeof is as follows:\n\ntypeof variable\n\
    You may also see typeof used in this manner:\n\ntypeof(variable)\n\nUsing typeof\
    \ for detecting these four primitive value types is the safest way to code defensively.\n\
    Here are some examples:\n\n```\n// detect a string\nif (typeof name === \"string\"\
    ) {\n  anotherName = name.substring(3);\n}\n\n// detect a number\nif (typeof count\
    \ === \"number\") {\n  updateCount(count);\n}\n\n// detect a boolean\nif (typeof\
    \ found === \"boolean\" && found) {\n  message(\"Found!\");\n}\n\n// detect undefined\n\
    if (typeof MyApp === \"undefined\") {\n  MyApp = {\n    // code\n  };\n}\n```\n\
    \nThe typeof operator is also unique in that it can be used on an undeclared variable\
    \ without throwing an error. Both undefined variables and variables whose value\
    \ is undefined return \"undefined\" when typeof is used.\nThe primitive type,\
    \ null, is the one that you normally shouldn't be testing for. As stated earlier,\
    \ comparing against null generally doesn't give you enough information about whether\
    \ the value is expected. There is one exception: if one of the expected values\
    \ is actually null, then it is okay to test for null directly. The comparison\
    \ should be done using either === or !== against null. For example:"
  merge: -1
  pgno: 101
- img_proc: false
  md: "```\n// If you test null, this is the way to do it\nvar element = document.getElementById(\"\
    my-div\");\nif (element!=null) {\n  element.className = \"found\";\n}\n```\n\n\
    It is entirely possible for document.getElementById() to return null if the DOM\
    \ element isn't found. The method will return either null or an element. Because\
    \ null is one of the expected outcomes, it's okay to test for it using !=.\n\n\
    ![](bbox=[0.147, 0.237, 0.223, 0.303])\n\nRunning typeof null returns \"object\"\
    , making this an inefficient way to test for null values. If you must test null,\
    \ use the identically equal operator (==) or the not identically equal (!==) operator.\n\
    \n# Detecting Reference Values\n\nReference values are also known as objects.\
    \ In JavaScript, any value that isn't a primitive is definitely a reference. There\
    \ are several built-in reference types such as Object, Array, Date, and Error,\
    \ just to name a few. The typeof operator is of little use for reference values,\
    \ because it returns \"object\" for any type of object:\n\n```\nconsole.log(typeof\
    \ {});      // \"object\"\nconsole.log(typeof []);      // \"object\"\nconsole.log(typeof\
    \ new Date());  // \"object\"\nconsole.log(typeof new RegExp()); // \"object\"\
    \n```\n\nAnother downside to using typeof for objects is that typeof returns \"\
    object\" for null values as well:\n\n```\nconsole.log(typeof null);    // \"object\"\
    \n```\n\nThis quirk, which has been recognized as a serious bug in the specification,\
    \ prevents accurate detection of null using typeof.\n\nThe instanceof operator\
    \ is the best way to detect values of a particular reference type. Basic syntax\
    \ for instanceof is:\n\nHere are some examples:\n\n```\n// detect a Date\nif (value\
    \ instanceof Date) {\n  console.log(value.getFullYear());\n}\n```\n\n```\n// detect\
    \ a RegExp\nif (value instanceof RegExp) {\n  if (value.test(anotherValue)) {\n\
    \    console.log(\"Matches\");\n  }\n}\n```"
  merge: -1
  pgno: 102
- img_proc: false
  md: "```\n// detect an Error\nif (value instanceof Error) {\n  throw value;\n}\n\
    ```\n\nAn interesting feature of instanceof is that it not only checks the constructor\
    \ used to create the object but also the prototype chain. The prototype chain\
    \ contains information about the inheritance pattern used to define the object.\
    \ For instance, every object inherits from Object by default, so every object\
    \ returns true for value instanceof Object. For example:\n\n```\nvar now = new\
    \ Date();\n\nconsole.log(now instanceof Object); // true\nconsole.log(now instanceof\
    \ Date); // true\n```\n\nDue to this behavior, it's typically not good enough\
    \ to use instanceof Object when you're expecting a particular type of object.\n\
    \nThe instanceof operator also works with custom types that you've defined for\
    \ yourself. For instance:\n\n```\nfunction Person(name) {\n  this.name = name;\n\
    }\n```\n\nvar me = new Person(\"Nicholas\");\n\n```\nconsole.log(me instanceof\
    \ Object); // true\nconsole.log(me instanceof Person); // true\n```\n\nThis creates\
    \ a custom Person type. The variable is an instance of Person, so me instanceof\
    \ Person is true. As mentioned previously, all objects are also considered instances\
    \ of Object, so me instanceof Object is also true.\n\nThe instanceof operator\
    \ is the only way to detect custom types in JavaScript. It's also good to use\
    \ for almost all built-in JavaScript types. However, there is one serious limitation.\n\
    \nSuppose that an object from one browser (frame A) is passed into another (frame\
    \ B). Both frames have the constructor function Person defined. If the object\
    \ from frame A is an instance of Person in frame A, then the following rules apply:\n\
    \n```\n// true\nframeAPerson instanceof frameAPerson\n\n// false\nframePersonInstance\
    \ instanceof frameBPerson\n```\n\nBecause each frame has its own copy of Person,\
    \ it is considered an instance of only that frame's copy, even though the two\
    \ definitions may be identical."
  merge: -1
  pgno: 103
- img_proc: false
  md: "This issue is problem not just for custom types but also for two very important\
    \ built-in types: functions and arrays. For these two types, you don't want to\
    \ use `instanceof` at all.\n\n# Detecting Functions\n\nFunctions are technically\
    \ reference types in JavaScript and also technically have a Function constructor\
    \ of which each is an instance. For example:\n\n```\nfunction myFunc() {\n\n//\
    \ Bad\nconsole.log(myFunc instanceof Function); // true\n```\n\nHowever, this\
    \ approach doesn't work across frames due to each frame having its own Function\
    \ constructor. Fortunately, the `typeof` operator also works with functions, returning\
    \ \"function\":\n\n```\nfunction myFunc() {\n\n// Good\nconsole.log(typeof myFunc\
    \ === \"function\"); // true\n```\n\nUsing `typeof` is the best way to detect\
    \ functions, because it also works across frames.\nThere is one limitation in\
    \ Internet Explorer 8 and earlier, any functions that are part of the DOM (such\
    \ as `document.getElementById`) return \"object\" instead of \"function\" when\
    \ used with `typeof`. For instance:\n\n```\n// Internet Explorer 8 and earlier\n\
    console.log(typeof document.getElementById); // \"object\"\nconsole.log(typeof\
    \ document.createElement); // \"object\"\nconsole.log(typeof document.getElementsByTagName);\
    \ // \"object\"\n```\n\nThis quirk arises because the browsers implement the DOM.\
    \ In short, these versions of Internet Explorer didn't implement the DOM as native\
    \ JavaScript functions, which caused the native `typeof` operator to identify\
    \ them as objects. Because the DOM is so well defined, developers typically test\
    \ for DOM functionality using in the operator, understanding that the presence\
    \ of the object member means it's a function, as in:\n\n```\n// detect DOM method\n\
    if (\"querySelectorAll\" in document) {\n  images = document.querySelectorAll(\"\
    img\");\n}\n```\n\nThis code checks to see whether `querySelectorAll` is defined\
    \ in document, and if so, goes on to use that function. Though not ideal, this\
    \ is the safest way to check for the presence of DOM methods if you need to support\
    \ Internet Explorer 8 and earlier. In all other cases, the `typeof` operator is\
    \ the best way to detect functions in JavaScript.\n\nDetecting Reference Values\
    \ | 87"
