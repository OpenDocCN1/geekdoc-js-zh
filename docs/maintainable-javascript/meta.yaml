  md: "```\n/>\n<arg path=\"core.js\"/>\n</apply>\n</target>\n```\n\nAlthough this\
    \ approach works, you should really run JSHInt on a collection of JavaScript files\
    \ rather than on a single one. The <apply> task makes this step easy by allowing\
    \ you to specify a <fileset> and include it in a particular spot on the command\
    \ line by using the <srcfile> element. For example, the following target validates\
    \ all JavaScript files in the source directory:\n\n```\n<target name=\"validate\"\
    >\n  <apply executable=\"java\">\n    <fileset dir=\"${src.dir}\" includes=\"\
    **/*.js\" />\n    <arg line=\"-jar\"/>\n    <arg path=\"js.jar\"/>\n    <arg path=\"\
    jshint.js\" />\n    <arg line=\"curly=true,forin=true,latedeef=true,noempty=true,undef=true,rhino=false\"\
    \ />\n  <|fileset|>\n  </apply>\n</target>\n```\n\nThis Ant now executes JSHInt\
    \ on every file specified by the <fileset> element. You can run the target via:\n\
    \nant validate\n\n# Improving the Target\n\nAlthough the validate target works\
    \ well, there are some improvements that can be made. First, the current version\
    \ runs JSHInt on each file. So if there are three JavaScript files, it's the equivalent\
    \ of running this:\n\n+   - java js.jar jshint.js curly=true,noempty-true first.js\n\
    - java js.jar jshint.js curly=true,noempty-true second.js\n- java js.jar jshint.js\
    \ curly=true,noempty-true third.js\n\nThere is some overhead when running java,\
    \ specifically the creation and destruction of the Java Virtual Machine (JVM).\
    \ This task adds significant amount of time to the target.\n\nThe JSHInt command-line\
    \ script accepts multiple files, so it's perfectly capable of using one to check\
    \ every file. Fortunately, the <apply> task makes it easy to pass all of the filenames.\
    \ You just need to set the parallel attribute to \"true\":\n\n```\n<target name=\"\
    validate\">\n  <apply executable=\"java\" parallel=\"true\">\n    <fileset dir=\"\
    ${src.dir}\" includes=\"**/*.js\" />\n    <arg line=\"-jar\"/>\n    <arg path=\"\
    js.jar\"/>\n    <arg path=\"jshint.js\" />\n  </target>\n```"
