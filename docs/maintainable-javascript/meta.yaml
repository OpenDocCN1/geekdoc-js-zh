    \ becomes much easier to understand.\n\n```\nif (wl && wl.length) {\n  for (i\
    \ = 0, l = wl.length; i < l; i++) {\n    p = wl[i];\n    type = Y.Long.type(r[p]);\n\
    \    if (s.hasOwnProperty && type == 'object') {\n      V.merge(r, s[p]);\n  \
    \  } else if (ov || !(p in r)) {\n      r[p] = s[p];\n    }\n  }\n  }\n}\n```\n\
    \nEnsuring proper indentation is the first step—this particular piece of code\
    \ has other maintainability issues discussed later in this chapter.\n\nAs with\
    \ style guidelines, there is no universal agreement on how to accomplish indentation\
    \ in code. There are two schools of thought:\n\nUse tabs for indentation\n\nEach\
    \ indentation level is represented by a single tab character. So indents of one\
    \ level are one tab character, second-level indentation is two tab characters,\
    \ and so on. There are two main advantages to this approach. You may find that\
    \ opening the file in one editor with tabs provides a one-to-one mapping between\
    \ tab characters and indentation levels, making it logical. Second, text editors\
    \ can be configured to display tabs as different sizes, so developers who like\
    \ smaller tabs can configure their editors that way, and those who like larger\
    \ indents can work their way too. The main disadvantage of tabs for indentation\
    \ is that systems interpret them differently. You may find that opening the file\
    \ in one editor looks quite different than in another, which can be frustrating\
    \ for someone looking for consistency. These differences, some argue, result in\
    \ each developer looking at the same code differently, and that isn't how a team\
    \ should operate.\n\nUse spaces for indentation\n\nEach indentation level is made\
    \ up of multiple space characters. Within this realm of thinking, there are three\
    \ primary approaches: two spaces per indent, four spaces per indent, and eight\
    \ spaces per indent. These approaches all be traced back to style guidelines for\
    \ various programming languages. In practice, many teams opt to go with a four-space\
    \ indent as a compromise between those who want two spaces and those who want\
    \ eight spaces. The main advantage of using spaces for indentation is that the\
    \ files are treated exactly the same in all editors and systems. Text editors\
    \ can be configured to insert spaces when the Tab key is pressed. This means all\
    \ developers have the same view of the code. The main disadvantage of using spaces\
    \ for indentation is that it is easy for a single developer to create formatting\
    \ issues by a misconfigured text editor."
