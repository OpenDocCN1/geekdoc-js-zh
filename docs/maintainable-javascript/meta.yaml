  md: '# CHAPTER 15


    # Validation


    Because JavaScript isn''t compiled before being deployed, web developers don''t
    have the extra compilation step to identify errors. JavaScript code validators
    partly fill the void by performing static analysis on your JavaScript code. You
    were introduced to JSLint and JSHint earlier in this book. In this chapter, you''ll
    learn how to incorporate third parties have written utilities including your build
    system to automatically analyze and verify your JavaScript code.


    JSHint is used in this chapter, as it comes with a prebuilt command-line file
    suitable for running with Rhino. JSLint, as of the time of this writing, doesn''t
    have a prebuilt command-line file, though some third parties have written utilities
    including command-line controls for JSLint.


    ![](bbox=[0.145, 0.446, 0.235, 0.523])


    # Finding Files


    The first step in validating files is to locate the files. There are two different
    tasks for this purpose: <fileset> and <filelist>. The <fileset> task is used when
    you want to include a large number of files based on a pattern. Specify the dir
    attribute as the directory to look in and then includes with a filename pattern,
    such as:


    ```

    <fileset dir="src" includes="*.js" />

    ```


    This fileset includes all JavaScript files contained in the src directory. You
    can optionally specify some patterns to exclude as well:


    ```

    <fileset dir="src" includes="*.js" excludes="**/*.test.js />

    ```


    This fileset includes all JavaScript files except the ones that end with -test.js.
    This is a common practice for excluding unit test files that are contained in
    the same directories as the source files.


    The <filelist> task works similarly except that you must explicitly list the files
    to include. This task is best when you want to retrieve references to a specific
    set of'
