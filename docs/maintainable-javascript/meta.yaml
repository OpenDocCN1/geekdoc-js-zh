  md: "```\nfunction doSomethingWithItems(items) {\n\n  var i, len,\n    value = 10,\n\
    \    result = value + 10;\n\n  for (i=0, len=items.length; i < len; i++) {\n \
    \   doSomething(items[i]);\n  }\n}\n```\n\nThe Dojo Style Guide allows combining\
    \ var statements only when the variables are related to one another.\n\nMy personal\
    \ preference is to combine all var statements with one initialized variable per\
    \ line. For variables that aren't initialized, they should appear last, as in\
    \ the following example:\nfunction doSomethingWithItems(items)\n\n```\nvar value\
    \ = 10,\n  result = value + 10,\n  i,\n  len;\n  for (i=0, len=items.length; i\
    \ < len; i++) {\n    doSomething(items[i]);\n  }\n```\n\nAt a minimum, I recommend\
    \ combining var statements, as doing makes your code smaller and therefore faster\
    \ to download.\n\n# Function Declarations\n\nFunction declarations, just like\
    \ variable declarations, hoisted by JavaScript engines. Therefore, it's possible\
    \ to use a function in code before it is declared:\n\n+   // Bad\ndoSomething();\n\
    \n```\nfunction doSomething() {\n  alert(\"Hello world!\");\n}\n```\n\nThis approach\
    \ works because the JavaScript engine interprets the code as if it were the following:\n\
    \n+   // Bad\nfunction doSomething() {\n  alert(\"Hello world!\");\n}\n\ndoSomething();"
