- img_proc: false
  md: "Each case is indented one level under the switch. Each case after the first,\
    \ including default, should be preceded by a single empty line.\n\nEach group\
    \ of statements (except the default) should end with break, return, throw, or\
    \ a comment indicating fall-through.\n\n```\n// Good\nswitch (value) {\n  case\
    \ 1:\n    /* falls through */\n\n  case 2:\n    doSomething();\n    break;\n\n\
    \  case 3:\n    return true;\n\n  default:\n    throw new Error(\"This shouldn't\
    \ happen.\");\n}\n```\n\nIf a switch doesn't have a default case, then it should\
    \ be indicated with a comment.\n\n```\n// Good\nswitch (value) {\n  case 1:\n\
    \    /*falls through*/\n\n  case 2:\n    doSomething();\n    break;\n\n  case\
    \ 3:\n    return true;\n\n  // no default\n}\n```\n\n# try Statement\n\nThe try\
    \ class of statements should have the following form:\n\n```\ntry {\n  statements\n\
    } catch (variable) {\n  statements\n}\n\ntry {\n  statements\n} catch (variable)\
    \ {\n  statements\n} finally {\n```"
