  md: "# Modules\n\nAnother developers augment the one-global approach is by using\
    \ modules. A module is a generic piece of functionality that creates no globals\
    \ or namespaces. Instead, all of the code takes place within a single function\
    \ that is responsible for executing a task or publishing an interface. The module\
    \ may optionally have a name and a list of module dependencies.\n\nModules aren't\
    \ formally part of JavaScript. There is no module syntax (at least, until ECMAScript\
    \ 6), but there are some common patterns for creating modules. The two most prevalent\
    \ types are YUI modules and Asynchronous Module Definition (AMD) modules.\n\n\
    # YUI modules\n\nYUI modules are, as you might expect, how you create new modules\
    \ to work with the YUI JavaScript library. The concept of modules was formalized\
    \ in YUI 3 and takes the following form:\n\n```\nYUI.add(\"module-name\", function(Y)\
    \ {\n  // module body\nn}, \"version\", { requires: [ \"dependency1\", \"dependency2\"\
    \ ] });\n```\n\nYUI modules are added by calling YUI.add() with the module name,\
    \ the function to execute (a factory function), and an optional list of dependencies.\
    \ The module body is where all code for this module lives. The Y argument is an\
    \ instance of YUI that has all of the required dependencies available. The YUI\
    \ convention is to add module functionality inside each module, such as:\n\n```\n\
    YUI.add(\"my-books\", function(Y) {\n  // Add a namespace\n  Y.namespace(\"Books.MaintainableJavaScript\"\
    );\n  Y.Books.MaintainableJavaScript.author = \"Nicholas C. Zakas\";\n}, \"1.0.0\"\
    , { requires: [ \"dependency1\", \"dependency2\" ] });\n```\n\nLikewise, dependencies\
    \ are represented as namespaces on the Y object that is passed in. So YUI actually\
    \ combines the concepts of namespaces with modules to give you flexibility in\
    \ the overall approach.\n\nUse your module via the YUI().use() method and pass\
    \ in one or more module names to load:\n\n```\nYUI().use(\"my-books\", \"another-module\"\
    , function(Y) {\n  console.log(Y.Books.MaintainableJavaScript.author);\n});\n\
    ```"
  merge: -1
  pgno: 91
- img_proc: false
  md: "This code starts by loading the modules \"my-books\" and \"another-module\"\
    , ensuring the dependencies for each are fully loaded. The then module is executed\
    \ in the order in which the modules are specified. Last, the callback function\
    \ passed to YUI().use() is executed. The Y object that is passed in has all of\
    \ the changes made to it the loaded modules, so your application code is ready\
    \ to execute.\n\nFor more information on YUI modules, see the documentation at\
    \ http://ylibrary.com/yui/docs/yui.\n\n![](bbox=[0.168, 0.193, 0.215, 0.233])\n\
    \n# Asynchronous Module Definition (AMD) Modules\n\nAMD modules have a lot in\
    \ common with YUI modules. You specify a module name, dependencies, and a factory\
    \ function to execute once the dependencies are loaded. These are all anonymous\
    \ to global define() function with the name first, then the dependencies, and\
    \ then the factory function. A major difference between AMD modules and YUI modules\
    \ is that each dependency is passed as a separate argument to the factory function.\n\
    \n```\ndefine(\"module-name\", [ \"dependency1\", \"dependency2\" ],\nfunction(dependency1,\
    \ dependency2) {\n\n  // module body\n\n});\n```\n\nSo each named dependency ends\
    \ up creating an object and passing it to the factory function. In this way, AMD\
    \ seeks to avoid collisions that might occur with namespaces across modules. Instead\
    \ of creating a new namespace as a YUI module, AMD modules are expected to return\
    \ their public interface from the factory function, as such:\n\n```\ndefine(\"\
    my-books\", [ \"dependency1\", \"dependency2\" ],\nfunction(dependency1, dependency2)\
    \ {\n\nvar Books = {};\nBooks.MaintainableJavaScript = {\n  author: \"Nicholas\
    \ C. Zakas\"\n};\n\n  return Books;\n});\n```\n\nAMD modules can also be anonymous\
    \ and completely omit the module name. The assumption is that the module loader\
    \ can infer the module name through the JavaScript filename. So if you have a\
    \ file named my-books.js and your module will only ever be loaded through a module\
    \ loader, you can define your module as follows:"
