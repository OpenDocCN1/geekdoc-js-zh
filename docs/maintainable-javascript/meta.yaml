  md: "This style was made popular by C#, Visual Studio enforces this alignment. There\
    \ are no major JavaScript guides that recommend this style, and the Google JavaScript\
    \ Style explicitly forbids it due to fears of automatic semicolon insertion errors.\
    \ My recommendation is to use the preferred brace alignment format.\n\n# Block\
    \ Statement Spacing\n\nSpacing around the first line of a block statement is also\
    \ a matter of preference. There are three primary styles for block statement spacing.\
    \ The first is to have no spaces separating the statement name, the opening parenthesis,\
    \ and the opening brace:\n\n```\nif(condition){\n  doSomething();\n}\n```\n\n\
    This style is preferred by some programmers because it is more compact, though\
    \ some complain that the compactness actually inhibits legibility. The Dojo Style\
    \ Guide recommends this style.\n\nThe second style is to have a space separation\
    \ before the opening parenthesis and after the closing parenthesis, such as:\n\
    \n```\nif (condition) {\n  doSomething();\n}\n```\n\nSome programmers prefer this\
    \ style because it makes the statement type and condition more legible. This style\
    \ is recommended by Crockford's Code Conventions and the Google JavaScript Style\
    \ Guide.\n\nThe third style adds spaces after the opening parenthesis and before\
    \ the closing parenthesis, as in the following:\n\n```\nif ( condition ) {\n \
    \ doSomething();\n}\n```\n\nThis is the style prescribed in the jQuery Core Style\
    \ Guide, because it makes all aspects of the statement start clear and legible.\n\
    I prefer the second style as a nice compromise between the first and third styles.\n\
    \n# The switch Statement\n\nDevelopers tend to have a love-hate relationship with\
    \ the switch statement. There are varying ideas about how to use switch statements\
    \ and how to format them. Some of this variance comes from the switch statement's\
    \ lineage, originating in C and making its way through Java into JavaScript without\
    \ the exact same syntax."
  merge: -1
  pgno: 48
- img_proc: false
  md: "Despite the similar syntax, JavaScript switch statements behave differently\
    \ than in other languages: any type of value may be used in a switch statement,\
    \ and any expression can be used as a valid case. Other languages require the\
    \ use of primitive values and constants, respectively.\n\n# Indentation\n\nIndentation\
    \ of the switch statement is a matter of debate among JavaScript developers. Many\
    \ use the Java style of formatting switch statements, which looks like this:\n\
    \n```\nswitch(condition) {\n    case \"first\":\n        // code\n        break;\n\
    \    case \"second\":\n        // code\n        break;\n    case \"third\":\n\
    \        // code\n        break;\n    default:\n        // code\n}\n```\n\nThe\
    \ unique parts of this format are:\n\n+   - Each case statement is indented one\
    \ level from the switch keyword.\n- There is an extra line before and after each\
    \ case statement from the second one on.\n\nThe format of switch statements is\
    \ rarely included in style guides when this style is used, primarily because it\
    \ is the format that many editors use automatically. Crockford's Code Conventions\
    \ and the Dojo Style Guide recommend a slightly different format:\n\n```\nswitch(condition)\
    \ {\n    case \"first\":\n        // code\n        break;\n    case \"second\"\
    :\n        // code\n        break;\n    case \"third\":\n        // code\n   \
    \     break;\n    default:\n        // code\n}\n```"
  merge: -1
  pgno: 49
- img_proc: false
  md: "The major difference between this and the previous format is that the case\
    \ keyword is aligned to the same column as the switch keyword. Note also that\
    \ there are no blank lines between any parts of the statement. JSLint expects\
    \ this indentation for switch statements by default and will warn if a case is\
    \ not aligned with switch. This option may also be turned on and off via the “Tolerate\
    \ messy space” option. JSLint does not warn if additional blank lines are included.\n\
    \nAs with other aspects of coding style, this choice is completely a matter of\
    \ preference.\n\n# Falling Through\n\nAnother popular source of debate is whether\
    \ falling through from one case to another is an acceptable practice. Accidentally\
    \ omitting a break at the end of a case is a very common source of bugs, as Douglas\
    \ Crockford argues that every case should end with break, return, or throw, without\
    \ exception. JSLint warns when one case falls through into another.\n\nI agree\
    \ with those who consider falling through to be an acceptable method of programming,\
    \ as long as it is clearly indicated, as follows:\n\n```\nswitch(condition) {\n\
    \  // obvious fall through\n  case \"first\":\n  case \"second\":\n    // code\n\
    \    break;\n\n  case \"third\":\n    // code\n\n    /*falls through*/\n    default:\n\
    \      // code\n}\n```\n\nThis switch statement has two obvious fall-throughs.\
    \ The first case falls into the second, which is considered an acceptable practice\
    \ (even by JSLint) because there are no statements to run for just the first case\
    \ and there are no extra lines separating the two case statements.\n\nThe second\
    \ instance is with case \"third\", which falls into the default handler. This\
    \ fall-through is marked with a comment to indicate developer intent. In this\
    \ code, it's obvious that the case is meant to fall through and isn't a mistake.\
    \ JSHint typically warns when a case falls through unless you include this comment,\
    \ in which case the warning is turned off because you've signaled that this isn't\
    \ an error."
  merge: -1
  pgno: 50
- img_proc: false
  md: "Crockford's Code Conventions disallows fall-throughs in switch statements altogether.\
    \ The jQuery Core Style Guide mentions fall-throughs are used in their code, and\
    \ the Dojo Style Guide gives an example with a fall-through comment. My recommendation\
    \ is to allow fall-throughs as long as a comment is used to indicate that the\
    \ fall-through is intentional.\n\n# default\n\nAnother point of contention regarding\
    \ switch is whether a default case is required. Some believe that a default should\
    \ always be included even if the default action is to do nothing, as in:\n\n```\n\
    switch(condition) {\n  case \"first\":\n    // code\n    break;\n  case \"second\"\
    :\n    // code\n    break;\n  default:\n    // do nothing\n}\n```\n\nYou're likely\
    \ to find open source JavaScript code following this pattern, including default\
    \ and just leaving a comment that nothing should happen there. Although no style\
    \ guides are explicit about this, both Douglas Crockford's Code Conventions for\
    \ the JavaScript Programming Language and the Dojo Style Guide include default\
    \ as part of their standard switch statement format.\n\nMy preference is to omit\
    \ default when there is no default action and annotate it using a comment, as\
    \ in this example:\n\n```\nswitch(condition) {\n  case \"first\":\n    // code\n\
    \    break;\n  case \"second\":\n    // code\n    break;\n  // no default\n}\n\
    ```\n\nThis way, the code author's intent is clear that there should be no default\
    \ action, and you save some bytes by not including extra unnecessary syntax."
