  md: "# The with Statement\n\nThe with statement changes how the containing context\
    \ interprets variables. It allows properties and methods from a particular object\
    \ to be accessed as if they were local variables and functions, omitting the object\
    \ identifier altogether. The intent of with was to lessen the amount of typing\
    \ developers need to do when using multiple object members in close proximity.\
    \ For example:\n\n```\nvar book = {\n  title: \"Maintainable JavaScript\",\n \
    \ author: \"Nicholas C. Zakas\"\n};\n\nvar message = \"The book is \"\n\nwith\
    \ (book) {\n  message += \" \" + author;\n}\n```\n\nIn this code, the with statement\
    \ is used to augment identifier resolution within the curly braces allowing the\
    \ properties of book to be accessed as if they were variables. The problem is\
    \ that it's hard to tell which title and author originated from it. It creates\
    \ this actuality extends far beyond developers, with JavaScript engines and minifiers\
    \ being forced to skip optimization of this statement for fear of guessing incorrectly.\n\
    \nThe with statement is actually disallowed in strict mode, causing a syntax error\
    \ and indicating the ECMAScript committee's belief that with should no longer\
    \ be used. Crockford's Code Conventions and the Google JavaScript Style Guide\
    \ disallow the use of with. I strongly recommend avoiding the with statement,\
    \ as it prevents you from easily applying strict mode to your code (a practice\
    \ I recommend).\n\n# The for Loop\n\nThere are two types of for loops: the traditional\
    \ for loop that JavaScript inherited from C and Java, as well as the for-in loop\
    \ that iterates over properties for an object. These loops, though similar, have\
    \ two very different uses. The traditional for loop is typically used to iterate\
    \ over members of an array, such as:\n\n```\nvar values = [ 1, 2, 3, 4, 5, 6,\
    \ 7 ];\ni, len;\n\nfor (i=0, len=values.length; i < len; i++) {\n  process(values[i]);\n\
    }\n```\n\nThere are two ways to modify how the loop proceeds (aside from using\
    \ a return or throw statement). The first is to use the break statement. Using\
    \ break causes the"
  merge: -1
