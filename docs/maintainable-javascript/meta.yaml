  md: "# CHAPTER 18\n\n# Documentation\n\nAll engineers would rather be writing code\
    \ than documentation, which is precisely why tools that autogenerate documentation\
    \ from code are so popular. The trend really began with Javadoc, the tool that\
    \ automatically creates documentation for Java, and continued into other languages\
    \ such as JavaScript.\n\nThere is a large (and growing) number of documentation\
    \ generators that work with JavaScript. Some are general-purpose documentation\
    \ generators that work with any language; others are-specific. With minifiers,\
    \ the choice of documentation generator is more of a preference than anything\
    \ else. This chapter covers a few popular choices; there are many more out there.\
    \ Appendix B for a full list of alternatives.\n\n# JSDoc Toolkit\n\nJSDoc Toolkit\
    \ is perhaps the most used JavaScript documentation generator. An evolution of\
    \ the original JSDoc Toolkit is used by Google and SproutCore and is often credited\
    \ with starting the trend of writing JavaScript-specific documentation generators.\
    \ It uses the same basic syntax as Javadoc, with specific multiline comments indicating\
    \ documentation information. For example:\n\n```\n/**\n * @Namespace The main\
    \ application object.\n */\nvar MyApplication = {\n  /**\n * Adds two numbers\
    \ together.\n * @param (int) num1 The first number.\n * @param (int) num2 The\
    \ second number.\n * @returns (int) The sum of the two numbers.\n * @static\n\
    \ */\n  add: function (num1, num2) {\n    return num1 + num2;\n  }\n}\n```"
  merge: -1
  pgno: 178
- img_proc: false
  md: "Any object for which there is no constructor to call is considered a namespace\
    \ in JSDoc. So MyApplication is a namespace and is indicated as such by the @namespace\
    \ tag followed by the description. The method MyApplication.add() has two parameters,\
    \ specified by @param followed by the expected data type, the parameter name and\
    \ the description. The method returns a result, so the @return tag indicates the\
    \ expected data type and describes the return value. The @static tag indicates\
    \ that the method doesn't require an instance of an object to be used.\n\nWhen\
    \ JSDoc Toolkit processes JavaScript files, it looks at the JavaScript code and\
    \ at the documentation comments to create HTML-based documentation. For full syntax\
    \ information, see http://code.google.com/jsdoc-toolkit/wlist.\n\nJSDoc Toolkit\
    \ is written almost entirely in JavaScript and uses a custom Rhino launcher JAR\
    \ file (jsrun, jar):\n\n```\njava -jar jsrun.jar app/run.js [file]* -t[templates]\
    \ -d[directory] [options]\napp/run.js is the main executable for JSDoc toolkit.\
    \ You can pass in many JavaScript files as you'd document.\n```\n\n```\njava -jsrun.jar\
    \ app/run.js core/core.js -t-templates/jsdoc/ -d-./out\n```\n\nThis command creates\
    \ documentation for core/core.js using the templates in templates/jsdoc/ and outputs\
    \ the final HTML documentation to the out directory. Because you need to use the\
    \ JSDoc Toolkit several times (for jsrun.jar, app/run.js, and the default templates),\
    \ it's best to keep this information in properties, and in the following:\n\n\
    ```\nsrc.dir = /src\nlib.dir = /lib\n\njsdoc.dir = $(lib.dir)/jsdoc-toolkit\n\
    jsdoc = $(jsdoc.dir)/jsrun.jar\njsdoc.run = $(jsdoc.dir)/app/run.js\njsdoc.templates\
    \ = $(jsdoc.dir)/templates\njsdoc.output = ./docs\n```\n\nThe target for generating\
    \ documentation is as follows:\n\n```\n<target name=\"document\">\n  <call executable=\"\
    java\" failonerror=\"true\" parallel=\"true\">\n    <fileset dir=\"$(src.dir)\"\
    \ includes=\"**/*.js\" />\n    <arg line=\"-cp\" />\n    <arg path=\"$(jsdoc.dir)\"\
    \ />\n    <arg path=\"$(jsdoc.run)\" />\n    <arg line=\"-t$(jsdoc.templates)\"\
    \ />\n    <arg line=\"-d$(jsdoc.output)\" />\n    <arg line />\n  </call>\n</target>\n\
    ```\n\n162 | Chapter 18: Documentation"
