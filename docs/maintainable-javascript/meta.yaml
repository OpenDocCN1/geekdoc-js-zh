    \ By placing HTML into JavaScript, you've complicated the problem. JavaScript\
    \ strings require proper escaping of quote characters, meaning that the markup\
    \ needs different syntax than it would in templates.\n\nBecause web applications\
    \ are quite dynamic in nature and JavaScript is often used to change the UI during\
