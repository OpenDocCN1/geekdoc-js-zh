  md: '# CHAPTER 12


    # Browser Detection


    Browser detection is always a hot-button topic in web development. This battle
    predates JavaScript browser detection by a couple of years and begins with the
    introduction of Netscape Navigator, the first truly popular and widely used web
    browser. Netscape Navigator 2.0 was so far beyond any of the other available web
    browsers that websites began looking for its specific user-agent string before
    returning any useful content. This forced other browser vendors, notably Microsoft,
    to include things in their user-agent string to get around this form of browser
    detection.


    # User-Agent Detection


    The earliest form of browser detection was *user-agent detection*, a process by
    which the server (and later the client) looked at the user-agent string and determined
    the browser. During that time, servers would regularly block certain browsers
    from viewing anything on the site based solely on the user-agent string. The browser
    that benefited the most was Netscape Navigator. Netscape was certainly the most
    capable browser, so websites targeted it as the only one that could properly display
    the site. Netscape''s user-agent string looked like this:


    ```

    Mozilla/2.0 (Win;95) I

    ```


    When Internet Explorer 2.0 was first released, it was essentially forced to duplicate
    a large part of the Netscape user-agent string to ensure that servers would serve
    the site to this new browser. Because most user-agent detection was done by searching
    for "Mozilla" and then taking the version number after the slash, the Internet
    Explorer user-agent string was:


    ```

    Mozilla/2.0 (compatible; MSIE 3.0; Windows 95)

    ```


    Internet Explorer''s introduction now meant that everyone''s user-agent string
    detection was now also identifying this new browser as Netscape. This started
    a trend of new browsers partially copying the user-agent strings of existing browsers
    that continued through the release of Chrome, whose user-agent string contains
    parts of Safari''s'
  merge: -1
  pgno: 132
- img_proc: false
  md: "string, which in turn contained parts of Firefox's string, which in turn contained\
    \ parts of Netscape's string.\n\nFast forward to the year 2005, when JavaScript\
    \ started to increase in popularity. The browser's user-agent string, the same\
    \ one reported to the server, is accessible in JavaScript through navigator.userAgent.\
    \ User-agent string detection moved into web pages with JavaScript performing\
    \ the same type of user-agent detection as the server, such as:\n\n```\n// Bad\n\
    if (navigator.userAgent.indexOf(\"IE\") > -1) {\n  // it's Internet Explorer\n\
    } else {\n  // it's not\n}\n```\n\nAs more websites use user-agent detection in\
    \ JavaScript, a new group of sites started to fail in browsers. The same problem\
    \ for bit servers nearly a decade earlier had merged in the form of JavaScript.\n\
    \nThe big problem is that user-agent string parsing is difficult, due the way\
    \ browsers have copied one older to try ensure compatibility. With every new browser,\
    \ user-agent detection code needs to be updated, and the time between the browser\
    \ is released to the time the changed code could deploy means untold of people\
    \ getting a bad user experience.\n\nThis isn't to say that there isn't any way\
    \ to use the user-agent string effectively. There are well-written libraries,\
    \ in JavaScript and for the server, that provide a reasonably good detection mechanism.\
    \ Unfortunately, these libraries also require constant updates as browsers continue\
    \ to evolve and new browsers are released. The overall approach isn't maintainable\
    \ over the long term.\n\nUser-agent detection should always be the last approach\
    \ to determining the correct course of action in JavaScript. If you choose user-agent\
    \ detection, the safest way is to proceed by detecting older browsers. For instance,\
    \ if you need to do something special to make your code work in Internet Explorer\
    \ 8 and earlier, then you should detect Internet Explorer 8 and earlier rather\
    \ than trying to detect Internet Explorer 9 and higher, such as:\n\n```\nif (isInternetExplorer8OrEarlier)\
    \ {\n  // handle IE8 and earlier\n} else {\n  // handle all browsers\n}\n```\n\
    \nThe advantage you have in this situation is that the Internet Explorer 8 and\
    \ earlier useragent strings are well known and won't be changing. Even if your\
    \ code continues to run through the release of Internet Explorer 25, the code\
    \ will most likely continue to work without further modifications. The opposite\
    \ isn' true—you'll be stuck updating code constantly if you try to detect Internet\
    \ Explorer 9 and higher."
