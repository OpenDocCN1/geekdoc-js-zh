  md: "files. The <fileset> element expects a dir for the directory. The files attribute\
    \ contains a comma-separated list of files. For example:\n\n```\n<filelist dir=\"\
    ./src\" files=\"core/core.js\" />\n```\n\nIn practice, you'll end up using <fileset>\
    \ more frequently than <filelist>, as it's far more likely that you'll be dealing\
    \ with large groups of files rather than specific, files.\n\n# The Task\n\nThe\
    \ <apply> task is to execute command-line utilities on a collection of files from\
    \ an Ant target. JSHashInt is written in JavaScript, you'll need to use the Rhino\
    \ command-line JavaScript engine to execute it. Download the Rhino release from\
    \ http://www.mozilla.org/rhino and place the js.jar file in your dependencies\
    \ folder (lib.dir).\n\nTo run JShint on the command line, type the following:\n\
    \n```\njava -jar js.jar jshint.js [options] [list of files]\n```\n\nFor example:\n\
    \n```\njava -jar js.jar jshint.js curly=true,noempty-true core/core.js\n```\n\n\
    The <apply> task allows you to recreate command-line entries using the <arg> element.\
    \ There are two ways to use <arg>: by specifying the path attribute for file or\
    \ directory references, or by specifying the line attribute for plain text. You\
    \ can break down the command-line format into the following pieces:\n\n```\njava\\\
    jar The program to execute, specified by the executable attribute of <apply>\n\
    jar An option for java, represented by the line attribute of <arg>\njshint.js\n\
    \ The main JSHInt file, represented by the path attribute of <arg>\ncurly=true,noempty-true\n\
    - The options, represented by the line attribute of <arg>\ncore/core.js\n- The\
    \ file to validate, represented by the path attribute of <arg>\n```\n\nGiven that,\
    \ you create an <validate> skeleton for this utility:\n\n```\n<target name=\"\
    validate\">\n<apply executables=\"Java\">\n<arg line=\"-jar/\"\n<arg path=\"js.jar\"\
    \ />\n<arg path=\"jshint.js\" />\n<arg\nline=\"curly=true,forin=true,latedef=true,noempty=true,undef=true,rhino=false\"\
    >\n```"
