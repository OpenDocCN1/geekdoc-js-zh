  md: "deep into a library; developers have a responsibility to prevent this from\
    \ happening.\n\nThe same goes for private JavaScript libraries. Many web applications\
    \ have their own proprietary JavaScript libraries built with or in lieu of the\
    \ well-known public options. The goal of libraries is to make developers lives\
    \ easier, which is done by providing an abstraction away from the dirty implementation\
    \ details. Throwing errors helps to keep those dirty implementation details safely\
    \ away from developers.\n\nSome general rules of thumb for throwing errors:\n\n\
    +   - Once you've fixed a hard-to-debug error, try adding one or two custom errors\
    \ that can help you easily solve the problem, it should occur again.\n\n+   -\
    \ If you're writing code and think, \"I hope [something] doesn’t happen—that would\
    \ really mess up this code,\" then throw an error when something occurs.\n\n+\
    \   - If you're writing code that will be used by people you don't know, think\
    \ about how they might incorrectly use the function and throw errors in those\
    \ cases.\n\nRemember that the goal isn't to prevent errors—it's to make errors\
    \ easier to debug when they occur.\n\n# The try-catch Statement\n\nJavaScript\
    \ provides a try-catch statement that is capable of intercepting errors before\
    \ they are handled by the browser. The code that might cause an error comes in\
    \ the try block and handles the error in the catch block. For instance:\n\n```\n\
    try {\n  somethingMightCauseAnError();\n} catch (ex) {\n  handleError(ex);\n}\n\
    ```\n\nWhen an error occurs in the try block, execution immediately stops and\
    \ jumps to the catch block, where the error object is provided. You can inspect\
    \ this object to determine the best course of action to recover from the error.\n\
    \nThere is also a finally clause that can be added. The finally clause contains\
    \ code that will be executed regardless of whether an error occurs. For example:\n\
    \n```\ntry {\n  somethingMightCauseAnError();\n} catch (ex) {\n  handleError(ex);\n\
    } finally {\n  continueDoingOtherStuff();\n}\n```\n\nThe finally clause is a little\
    \ bit tricky to work with certain situations. For example, if the try clause contains\
    \ a return statement, it won't actually return until finally has"
