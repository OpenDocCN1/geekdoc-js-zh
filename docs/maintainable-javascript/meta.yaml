  md: 'common practice in product design, not just in code. Cars are built with crumple
    zones, areas of the frame that are designed to collapse in a predictable way when
    impacted. Knowing how the frame will react in a crash—specifically, which parts
    will fail—allows the manufacturers to ensure passenger safety. Your code can be
    constructed in the same way.


    # Throwing Errors in JavaScript


    Throwing errors in your JavaScript is arguably more valuable than in any other
    language due to the complexities involved in web debugging. You can throw an error
    by using the throw operator and providing an object to throw. Any type of object
    can be thrown; however, an Error object is the most typical to use:


    ```

    throw new Error("Something happened.");

    ```


    The built-in Error type is available in all JavaScript implementations, and the
    constructor takes a single argument, When you throw an error in this way, the
    error isn''t caught via a try-catch statement, the browser displays the value
    in the browser''s typical way. Most browsers now have a console to which error
    information is output whenever an error occurs. In other words, any error you
    throw is treated the same as an error that you didn''t.


    Inexperienced developers sometimes throw errors by just providing a string, such
    as:


    ```

    // Bad

    throw "message";

    ```


    Doing so will cause an error to be thrown, but not all browsers respond the way
    you''d expect. Firefox, Opera, and Chrome each display an "uncaught exception"
    message and then include the message string. Safari and Internet Explorer simply
    throw an "uncaught exception" error and don''t provide the message string at all,
    which isn''t very useful for debugging purposes.


    Of course, you can throw any type of data that you''d like. There are no rules
    prohibiting specific data types:


    ```

    throw { name: "Nicholas" };

    throw true;

    throw 12345;

    throw new Date();

    ```


    The only thing to remember is that throwing any value will result in an error
    if it''s not caught via a try-catch statement. Firefox, Opera, and Chrome all
    display String() on the value that was thrown to by displaying logical as the
    error message; Safari and Internet Explorer do not. The only surefire way to have
    all browsers display your custom error message is to use an Error object.'
