    \ the newly created object. For example:\n\n```\nfunction Person(name) {\n  this.name;\n\
    }\n```\n\n```\nfunction Author(name) {\n  Person.call(this, name); // inherit\
    \ constructor\n}\n```\n\n```\nAuthor.prototype = new Person();\n```\n\nIn this\
    \ code, the Author type inherits from Person. The property name is actually managed\
    \ by the Person type, Person.call(this, name) allows the Person constructor to\
    \ defining that property. The Person constructor runs on this, which is the new\
    \ Author object. So name ends up being based on the new Author object.\n\nWith\
    \ object-based inheritance, type-based inheritance allows you flexibility in how\
    \ you create new instances of the same object, all of which inherit from a common\
    \ super type. Your new type should exactly the properties and methods you want\
    \ to use, and those can be completely different from the super type.\n\n# The\
    \ Facade Pattern\n\nThe facade is a popular design pattern that creates a new\
    \ interface for an existing object. A facade is a completely new object that works\
    \ with an existing object behind the scenes. Facades are sometimes called wrappers,\
    \ because they wrap an existing object with a different interface. If inheritance\
