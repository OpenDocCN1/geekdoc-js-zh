  md: "# Separate Configuration Data from Code\n\nCode does nothing more than define\
    \ a set of instructions for a computer to execute. Data is frequently passed around\
    \ and modified by those instructions, ultimately producing a result. The problem\
    \ comes when the data must change. There's a risk of creating an error any time\
    \ you edit source code, and editing code just to change some data value introduces\
    \ unnecessary risk for something that shouldn't affect the sur-rounding instructions.\
    \ Well-designed applications keep vital data outside of the main source code to\
    \ ensure worry-free editing.\n\n# What Is Configuration Data?\n\nConfiguration\
    \ data is any hardcoded value in an application. Consider the following example:\n\
    \n```\n// Configuration data embedded in code\nfunction validate(value) {\n  if\
    \ (value) {\n    alert(\"Invalid value\");\n    location.href = \"errors/invalid.php\"\
    ;\n  }\n}\n```\n\n```\nfunction toggleSelected(element) {\n  if (hasClass(element,\
    \ \"selected\")) {\n    removeClass(element, \"selected\")\n  } else {\n    addClass(element,\
    \ \"selected\")\n  }\n}\n```\n\nThere are three pieces of configuration data in\
    \ the code. The first is the string \"Invalid value,\" which is displayed to the\
    \ user. As a UI string, there's a good chance that it will change frequently.\
    \ The second is the URL /errors/invalid.php. URLs tend to change as"
  merge: -1
  pgno: 108
- img_proc: false
  md: "development progresses, due to architectural decisions. The third is the CSS\
    \ class name \"selected.\" This class name is used three times, meaning that a\
    \ class name change requires changes in three different places, increasing the\
    \ likelihood that one will be missed.\n\nThese are all considered configuration\
    \ data, because they are hardcoded values that may change in the future. The following\
    \ are all examples of configuration data:\n\n+   * URLs\n* Strings that are displayed\
    \ in the UI\n* Repeated unique values\n* Settings (i.e., items per page)\n* Any\
    \ value that may change\n\nThe key point to remember about configuration data\
    \ is that it changes, and you don't want to be modifying your JavaScript source\
    \ code because someone changed his mind about a message to display on the home\
    \ page.\n\n# Externalizing Configuration Data\n\nThe first step in separating\
    \ configuration data from code is to externalize the configuration data, which\
    \ means getting the data out of the middle of your JavaScript code. Here's the\
    \ previous example with the configuration externalized:\n\n```\n// Configuration\
    \ externalized\nvar config = {\n  MSG_INVALID_VALUE: \"Invalid value\",\n  URL_INVALID:\
    \ \"/errors/invalid.php\",\n  CSS_SELECTED: \"selected\"\n};\n\nfunction validate(value)\
    \ {\n  if (value) {\n    alert(config.MSG_INVALID_VALUE);\n    location.href =\
    \ config.URL_INVALID;\n  }\n}\nnfunction toggleSelected(element) {\n  if (hasClass(element,\
    \ config.CSS_SELECTED)) {\n    removeClass(element, config.CSS_SELECTED);\n  }\
    \ else {\n    addClass(element, config.CSS_SELECTED);\n  }\n}\n```\n\nThis example\
    \ stores all of the configuration data in the config object. Each property of\
    \ config holds a single piece of data, and each property name has a prefix indicating\
    \ the type of data (MSG for a UI message, URL for a URL, and CSS for a class name).\
    \ The naming"
