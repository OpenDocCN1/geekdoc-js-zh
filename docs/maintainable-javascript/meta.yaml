    \ All on one line\ndosoSomething({key1: value1, key2: value2});\n```\n\n# Comments\n\
    \nMake frequent use of comments to aid others in understanding your code. Use\
    \ comments when:\n\n+   * Code is difficult to understand.\n* The code might be\
    \ mistaken for an error.\n* Browser-specific code is necessary but not obvious.\n\
    * Documentation generation is necessary for an object, method, or property (use\
