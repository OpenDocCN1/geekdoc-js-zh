  md: '# CHAPTER 13


    # File and Directory Structure


    The first step before setting up a build system is to determine how your files
    and directories are laid out. This structure is heavily affected by the type of
    project. If the project is a standalone JavaScript library, you might want a different
    structure than you would want for a project containing all of the files for a
    website.


    # Best Practices


    Regardless of the project type, there are several best practices that apply to
    JavaScript file and directory structure:


    +   One object per file


    Each JavaScript file should contain code for just one JavaScript object. This
    pattern is common to other programming languages and generally makes maintenance
    easier. Having multiple files with single objects reduces the risk of multiple
    people working on the same file at the same time. Even though today’s source control
    systems are incredibly good at merging changes from two different people, merge
    conflicts do still occur. The fewer files you have, the greater the likelihood
    of merge conflicts. Keeping one JavaScript object per file minimizes this risk.


    +   Group related files directories


    If you have multiple objects that are related, put all of those into a single
    directory. You might, for instance, have multiple files with code to make a single
    module. It might make sense to have a directory for that module containing all
    of the files. Grouping related files helps developers locate functionality.


    +   Keep third-party code separate


    Any code that isn’t being written or maintained by you, such as a JavaScript library,
    should be kept in a separate part of source control. In fact, the ideal setup
    is not to have the JavaScript library checked in at all but rather to load it
    directly from a Content Delivery Network (CDN). In lieu of that, keeping the files
    in a directory within source control is the best approach.'
  merge: -1
  pgno: 144
- img_proc: false
  md: 'Determine build location


    The location of the built JavaScript files should be a completely separate directory
    that is not checked in source control. The website should be configured to use
    this build location instead of the source directory. It''s important to not check
    in built files because they are artifacts of the build system, artifacts that
    may be created multiple times by people or systems before finally being deployed.
    The deployment should kick off a build that creates the final artifacts to be
    deployed.


    Keep test code


    Your JavaScript testing code should also be checked in source control and be in
    a predictable location. This makes it easy for developers to notice when tests
    are missing.


    File and directory structure are a bit different if the JavaScript you''re working
    on is part of a larger website or web application versus a standalone JavaScript
    project. The overall directory structure is typically dictated by the server-side
    framework being used. Even though the overall directory structure may vary from
    project to project, you will undoubtedly have a subdirectory devoted to JavaScript.
    This subdirectory may be called *scripts* or *javascript*, but there is almost
    always a single directory devoted to JavaScript files. Within that directory,
    there are a few common layouts.


    # Basic Layout


    One popular layout style is to have three primary directories in your JavaScript
    directory:


    +   build


    +   The final built files. Ideally, shouldn''t be checked in.


    +   src


    +   For all of the source files. Contains subdirectories for grouping files.


    +   test or tests


    +   For all of the tests. Usually contains some subdirectory structure or file
    structure that mirrors that of *src*.


    CSS Lint, a project that I manage, uses a variation of this approach. See Figure
    13-1.


    For CSS Lint, the *build* directory is never checked in; however, the *release*
    directory always contains the most recent stable release. The *src* directory
    has several subdirectories grouping functionality together. The *tests* directory
    mirrors the directory structure of *src*, so the tests for *src/core/CSSLint.js*
    are found in *tests/core/CSSLint.js.'
