    \ for my eyes.\n\n![](bbox=[0.143, 0.368, 0.225, 0.439])\n\nEven though the choice\
    \ of tabs or spaces is a preference, it is very important not to mix them. Doing\
    \ so leads to horrible file layout and requires semicolons, as in the first example\
    \ in this section.\n\n# # Statement Termination\n\nOne of the interesting, and\
    \ most confusing, aspects of JavaScript is that statements may be terminated either\
    \ with a newline or a semicolon. This breaks from the tradition of other C-like\
    \ languages such as C++ and Java, which require semicolons. Both of the following\
    \ examples are therefore valid JavaScript.\n\n```\n// Valid\nvar name = \"Nicholas\"\
    ;nfunction sayName() {\n  alert(name);\n}\n```\n\n```\n// Valid but not recommended\n\
    var name = \"Nicholas\"\nfunction sayName() {\n  alert(name)\n}\n```\n\nThe omission\
    \ of semicolons works in JavaScript due to a mechanism known as automatic semicolon\
    \ insertion (ASI). ASI looks for places in the code where a semicolon is appropriate\
    \ and inserts one if not found. In many cases, ASI guesses correctly and there\
    \ isn't a problem. However, the rules of ASI are complex and difficult to remember,\
    \ which is why I recommend using semicolons. Consider the following:"
