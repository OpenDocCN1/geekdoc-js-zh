  md: "objects at will; in fact, the library was defined as extensions to existing\
    \ objects rather than creating their own. The Prototype developers saw the library\
    \ as a way of filling in JavaScript's gaps. Prior to version 1.6, Prototype implemented\
    \ a method called document.getElementsByClassName(). You may recognize this method,\
    \ because it was officially defined in HTML5 to standardize Prototype's approach.\n\
    \nPrototype's document.getElementsByClassName() method returned an array of elements\
    \ containing the specified CSS classes. Prototype also added a method on arrays,\
    \ Array.prototype.each(), which iterated over the array and executed a function\
    \ on each item. This led to developers writing code such as:\n\n```\ndocument.getElementsByClassName(\"\
    selected\").each(function(something) {\n```\n\nThis code didn't have a problem\
    \ until HTML5 implemented it. The Prototype team knew the native document.getElementsByClassName\
    \ coming, so they did some defensive coding for the following:\n\n```\nif (document.getElementsByClassName)\
    \ {\n  document.getElementsByClassName = function(classes) {\n    // non-native\
    \ implementation\n  }\n}\n```\n\nPrototype was defining document.getElementsByClassName()\
    \ only if it didn't already exist. That would have been the end of the issue for\
    \ one important factor. The HTML5 document.getElementsByClassName() didn't return\
    \ an array, so the each() method didn't exist. Native DOM methods used a specialized\
    \ collection called NodeList, and document.getElementsByClassName() returned a\
    \ NodeList to match the other methods.\n\nBecause NodeList doesn't have an each()\
    \ method, neither natively or added by Prototype, using each() caused a JavaScript\
    \ error experienced in browsers that had a native implementation of document.getElementsByClassName().\
    \ The result was that users of Prototype had to upgrade both the library code\
    \ and their own code—quite the maintenance nightmare.\n\nLearn from Prototype's\
    \ mistake. You cannot accurately predict how JavaScript will change in the future.\
    \ As the standards have evolved, they have often taken cues from JavaScript libraries\
    \ like Prototype to determine the next generation of functionality. In fact, a\
    \ native Array.prototype.forEach() method is defined in ECMAScript 5 that works\
    \ much like Prototype's each() method. The problem is that you don't know the\
    \ official functionality will differ from the original, and even subtle differences\
    \ can cause big problems."
