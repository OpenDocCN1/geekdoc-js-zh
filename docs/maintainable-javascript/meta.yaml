  md: "```\n}\nvar count = 10,\nname = \"Nicholas\",\nfound = false,\nempty;\n// code\
    \ that uses inner()\n}\n```\n\nAnonymous functions may be used for assignment\
    \ of object methods or as arguments to other functions. There should be no space\
    \ between the function keyword and the opening parenthesis.\n\n```\n// Good\n\
    object.method = function() {\n  // code\n};\n```\n\n```\n// Bad: Incorrect spacing\n\
    object.method = function () {\n  // code\n};\n```\n\nImmediately invoked functions\
    \ should surround the entire function call with parentheses.\n\n```\n// Good\n\
    var value = (function() {\n  // function body\n  return {\n    message: \"Hi\"\
    \n  }\n})()\n```\n\n```\n// Bad: No parentheses around function call\nvar value\
    \ = function() {\n  // function body\n  return {\n    message: \"Hi\"\n  }\n}();\n\
    ```\n\n```\n// Bad: Improper parentheses placement\nvar value = (function() {\n\
    \  // function body\n  return {\n    message: \"Hi\"\n  }\n})();\n```"
