    \ Core Style Guide specifies indents as tabs.\n- Douglas Crockford's Code Conventions\
    \ for the JavaScript Programming Language specifies them as four spaces.\n- The\
    \ SproutCore Style Guide specifies indents as two spaces.\n- The Google JavaScript\
    \ Style Guide specifies indents as two spaces.\n- The Dojo Style Guide specifies\
