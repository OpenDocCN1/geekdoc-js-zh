- img_proc: false
  md: "to use a CSS expression to make up some of the missing functionality in these\
    \ older browsers, resist the urge and save yourself a lot of time and effort.\
    \ Keep JavaScript out of your CSS.\n\n# Keep CSS Out of JavaScript\n\nKeeping\
    \ this clean separation between CSS and JavaScript can be challenging at times.\
    \ These two languages work quite well together so it is tempting to manipulate\
    \ style data within JavaScript. The most popular way to write style changes is\
    \ through the use of the style property on any DOM element. The style property\
    \ is an object containing properties that allow you to read and change CSS properties.\
    \ For instance, you change the text color of an element to read like this:\n\n\
    ```\n// Bad\nelement.style.color = \"red\";\n```\n\nIt's actually common to use\
    \ large blocks of code style to change multiple properties, such as:\n\n```\n\
    // Bad\nelement.style.color = \"red\";\nelement.style.left = \"10px\";\nelement.style.top\
    \ = \"100px\";\nelement.style.visibility = \"visible\";\n```\n\nThis approach\
    \ is problematic, because the style information is now located inside JavaScript.\
    \ When there is a style problem, you should be able to go straight to the CSS\
    \ to find and resolve the issue. You wouldn't stop to consider that the style\
    \ information is in JavaScript until you've exhausted all other possibilities.\n\
    \nAnother way developers use the style object to set an entire CSS string via\
    \ the cssText property, as in the following example:\n\n```\n// Bad\nelement.style.cssText\
    \ = \"color: red; left: 10px; top: 100px; visibility: hidden\";\n```\n\nUsing\
    \ the cssText is a shortcut to set multiple CSS properties at once. This pattern\
