  md: '# CHAPTER 16


    # Concatenation and Baking


    If you''ve properly set up your JavaScript files to contain one object per file,
    then it''s likely you have dozens of JavaScript files. Before deploying to production,
    it''s best to concatenate the files so there are fewer HTTP requests on the page.
    Exactly how many files and which files should be concatenated with which is a
    project-specific decision. In any case, Ant Ant provides an easy way to concatenate
    multiple files.


    # The Task


    The <concat> task is one of the simplest in Ant. You simply specify a <destfile>
    attribute containing the destination filename and then include as many <fileset>
    and <file list> elements as you want. At it''s simplest, you can have a target
    such as:


    ```

    <target name="concatenate">

    <concat destfile="${build.dir}/build.js">

    <fileset dir="${src.dir}\ includes="**/*.js" />

    </concat>

    </target>

    ```


    This target concatenates all JavaScript files in the source directory into a single
    file called build, is in the build directory. Keep in mind that the files are
    concatenated in the order in which they appear on the filesystem (alphabetically).
    If you want a more specific ordering, you''ll need to specify it explicitly, such
    as:


    ```

    <target name="concatenate">

    <concat destfile="${build.dir}/build.js">

    <fileset dir="${src.dir}" files="first.js,second.js" />

    <fileset dir="${src.dir}" includes="**/*.js" excludes="first.js,second.js"/>

    </concat>

    </target>

    ```'
  merge: -1
  pgno: 162
- img_proc: false
  md: "This version of the target ensures that first.js is the first file added to\
    \ the final file and second.js comes right after that. Remember, you can use any\
    \ number of <fileset> and <filist> elements, so you can concatenate in any order\
    \ you can imagine.\n\nEven though it's possible to create complex concatenation\
    \ schemes using Ant, it's best to limit the special cases. Keeping filenames out\
    \ of your build script is a good idea for maintainability. Try to use <fileset>\
    \ elements whenever possible.\n\n![](bbox=[0.173, 0.153, 0.225, 0.223])\n\n# Line\
    \ Endings\n\nConcatenating files together comes with a series of challenges. One\
    \ of the trickiest issues is dealing if a file doesn't have a newline character\
    \ on its last line, then concatenating that with another may result in broken\
    \ syntax. By setting fixline attribute to \"yes\", the <concat> task will automatically\
    \ add a newline to the last line if one doesn't already exist:\n\n```\n<concat\
    \ name=\"${build.dir}/build.js\" fixline=\"yes\">\n  <fileset dir=\"${src.dir}\"\
    \ files=\"first.js,second.js\" />\n  <fileset dir=\"${src.dir}\" includes=\"*.*\"\
    \ excludes=\"first.js,second.js\" />\n</concat>\n```\n\nIt's a good idea to set\
    \ fixline to \"yes\" for JavaScript, as newlines are valid end-of-statement tokens.\n\
    \nFixing the line is easy, but how do you know which end-of-line marker is used?\
    \ If your source files are being edited by people on different operating systems,\
    \ you may want to ensure consistency in the built files. The <concat> task has\
    \ an optional attribute that specifies which end-of-line markers to use. The default\
    \ value is the default for the system (\"crlf\" for Windows, \"lf\" for Unix,\
    \ and \"cr\" for Mac OS X). You can choose any one of these values, and all of\
    \ the line endings in the concatenated file will automatically be switched to\
    \ format:\n\n```\n<concat name=\"${build.dir}/build.js\" fixline=\"yes\" ol=\"\
    lf\">\n  <fileset dir=\"${src.dir}\" files=\"first.js,second.js\" />\n  <fileset\
    \ dir=\"${src.dir}\" includes=\"*.*\" excludes=\"first.js,second.js\" />\n</concat>\n\
    ```\n\nThis target changes all end-of-line markers to Unix style, which is the\
    \ recommended format for JavaScript files, as it has the greatest cross-platform\
    \ compatibility (and be cause most web servers on a Unix variant)."
