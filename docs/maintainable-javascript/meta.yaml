    2. The Android Code Style Guidelines for Contributors specifies a line length
    of 100 characters.

    3. The Unofficial Ruby Usage Guide specifies a line length of 80 characters.

    4. The Python Style Guidelines specifies a line length of 79 characters.


    Line length is less frequently found in JavaScript style guidelines, but Crockford’s
    Code Conventions specifies a line length of 80 characters. I also prefer to keep
    line length at 80 characters.


    # Line Breaking


    When a line reaches the character length, it must be manually split into two levels.
    Line breaking is typically done after an operator, and the next line is indented
    two levels. For example (indents are four spaces):


    ```

    // Break after operator, following line indented two levels

    callFunction(document, element, window, "some string value", true, 123,

    navigator());

    ```


    ```

    // Bad: Following line indented only one level

    callFunction(document, element, window, "some string value", true, 123,

    navigator());

    ```


    ```

    // Bad: Break before operator

    callFunction(document, element, window, "some string value", true, 123

    navigator());

    ```


    In this example, the comma is an operator and should come last on the preceding
    line. This placement is important because ASI mechanism, which may close a state-at
    the end of a line in certain situations. By always ending with an operator, ASI
    won’t come into play and introduce possible errors.


    The same line-breaking pattern should be usedd for statements as well:


    ```

    if (isLeapYear && isFebruary && day == 29 && isYourBirthday &&

    noPlans) {


    waitAnotherYears();


    }

    ```'
