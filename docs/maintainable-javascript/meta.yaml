    that''s a workflow interruption. You have to determine whether the JavaScript
    is in the JavaScript files (which it should) or in the HTML. Only then can you
    start debugging.


    This point might seem minor, especially given today''s excellent web development
    tools, but it is actually an important piece of the maintenance palette. Predictability
    leads to faster debugging and development, and knowing (not guessing) where to
    start with a bug is what leads to faster resolutions and better overall code quality.


