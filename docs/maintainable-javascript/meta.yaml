  md: '# Closure Compiler


    A parser-based minifier that tries to make your code as small as possible. The
    Closure Compiler is written and maintained by Google engineers; it removes comments
    and extra white space and performs variable replacement, but also inspects your
    code to optimize. For instance, it can detect that a function isn''t used and
    simply remove it. It can also detect that a function is used only once and put
    it inline. For this reason, Closure works best when used on all of your JavaScript
    code at once. Download from http://code.google.com/closure/compiler/


    UglifyJS


    Credited with the first Node.js-based minifier, UglifyJS is written in JavaScript
    using a JavaScript-based parser. Written by Mihai Bazon, UglifyJS removes comments
    and extra white space, replaces names, combines var statements, and performs optimizations
    along the way. Download from https://github.com/mishou/uglifyJS or using npm.


    Exactly which minifier to use is a matter of preference. Some prefer YUI Compressor
    because of its focus on ensuring the resulting code doesn''t contain errors and
    simple optimizations. Others prefer Closure Compiler it tends to produce files
    that are smaller than YUI Compressor. Still others prefer UglifyJS because it
    doesn''t rely on YUI and produces fewer syntax errors than Closure Compiler while
    also produce the smallest possible result.


    # Minifying with YUI Compressor


    YUI Compressor ships as an executable JAR file that should be placed in your project''s
    dependencies folder (in this example, this folder is referred to as lib.dir).
    There are several command-line options, but the most important to know are:


    ```

    --disable-optimizations

    Turns off micro optimizations such as changing obj["prop"] to obj.prop

    --line-break <column>

    Specifies to break lines at the given column rather than creating a single line
    of output

    --nomumge

    Turns off local variable name replacement

    --preserve-semi

    Turns off removal of unnecessary semicolons

    ```


    Once you decide which options to use, place them in a Java properties file, as
    in the following example:'
