  md: '# CHAPTER 19

    Automated Testing


    TestingJavaScript has long been a pain point for developers. You want to test
    JavaScript quickly and easily, but there are so many browsers to test. The first
    solution was manual testing across all browsers, which meant creating an HTML
    file and manually loading it in various browsers to ensure that it worked. Though
    functional, this approach was too slow for practical use.


    The next wave of JavaScript testing focused on command-line testing by stubbing
    out the browser environment. Several attempts were made to make JavaScript testing
    on the command line using Rhino and a fake browser environment. Some companies
    developed browser profiles that could be loaded in with the promise of cross-browser
    testing. The unfortunate reality was that these stubbed browser environments didn''t
    do the job. Your tests might pass in the "fake Firefox" but fail in the actual
    browser.


    More recently, attempts have been made to use the actual browsers for testing.
    This approach typically involves using an HTML file to launch tests and then having
    an application load that in the different browsers. Many of the tools mentioned
    in this chapter are still under development, but they all give you a good starting
    point for integrating browser-based JavaScript testing.


    # YUI Test Selenium Driver


    YUI Test is the unit testing framework for the YUI Library. The most recent version
    of YUI Test is more than a simple testing library. In addition to removing dependencies
    on the core YUI library, YUI Test supports a suite of utilities to aid JavaScript
    testing. One of these tools is called the YUI Selenium Driver and is designed
    to work with Selenium to enable easy browser testing.


    Selenium is a server that is capable of launching browsers and running commands
    inside of them. Originally intended for use by QA engineers writing functional
    tests, Selenium gained popularity for JavaScript testing due to the ease with
    which it interacts with browsers.'
  merge: -1
  pgno: 184
- img_proc: false
  md: '# Setting Up a Selenium Server


    The YUI Test Selenium Driver works with a Selenium server to run JavaScript tests
    on various browsers and return the results. The first step is to set up your Selenium
    server (if you don''t already have one). Selenium is written in Java, so it can
    be anywhere Java is installed. Download the latest Selenium server from http://seleniumhq.org/load.


    To run your Selenium server, go to the directory containing the downloaded files
    and run:


    ```

    java -jar selenium-server-standalone-x.y.z.jar

    ```


    The server takes a few moments to set up and is ready to receive commands.


    # Setting Up YUI Test Selenium Driver


    There are three steps to setting up the YUI Test Selenium Driver:


    +   1. Download the latest version of YUI Test.

    2. Place yuitest-selenium-driver.jar in your dependencies directory.

    3. Copy selenium-java-client-driver.jar from the YUI Test lib directory into your
    Java Runtime Environment (JRE)’s lib/ext directory.


    With these steps completed, it''s now possible to run tests using the YUI Test
    Selenium Driver.


    # Using the YUI Test Selenium Driver


    The YUI Test Selenium Driver uses HTML files for testing. Even if your tests are
    in standalone JavaScript files, you must include them in an HTML file that automatically
    runs the tests upon page load. The following is an example test page:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>YUI Test</title>

    <!-- include YUI Test library --

    <script src="yuitest.js"></script>


    <!-- include your test files --

    <script src="tests1.js"></script>

    <script src="tests2.js"></script>

    </head>

    <body>

    <script>

    YUITest.TestRunner.run();

    </script>

    </body>

    </html>

    ```'
  merge: -1
  pgno: 185
- img_proc: false
  md: "Each of the JavaScript test files should add their tests to Test via YUITest.TestRunner.add().\
    \ That way, the tests can simply be run automatically once they’re fully loaded.\n\
    \nAssuming this HTML file lives on a server as http://www.example.com/tests.html,\
    \ you can run the tests using the following command:\n\n```\njava -jar yuitest-selenium-driver.jar\
    \ [options] [url]+\n```\n\nFor example:\n\n```\njava -jar yuitest-selenium-driver.jar\
    \ http://www.example.com/tests.html\n```\n\nThis command runs the file in Firefox\
    \ (the default browser on Selenium) and assumes the Selenium server is running\
    \ on localhost:4444 (the default Selenium port). You can change the location of\
    \ Selenium by adding some options:\n\n```\njava -jar yuitest-selenium-driver.jar\
    \ --host testing.example.com\n--port 9000 http://www.example.com/tests.html\n\
    ```\n\nThis command runs the file in Firefox on the Selenium server at testing.example:9000.\
    \ You can also specify different browsers using the Selenium IDs:\n\n```\njava\
    \ -jar yuitest-selenium-driver.jar\n--browsers firefox,*ie http://www.example.com/tests.html\n\
    ```\n\nThis command runs the tests both in Firefox and in Internet Explorer. The\
    \ --browsers option passes through these options to Selenium and must specify\
    \ valid Selenium browsers. An error occurs if a browser isn't available on the\
    \ specified Selenium server.\n\nAlthough it’s possible to pass test URLs on the\
    \ command line, most developers use the test configuration XML file instead. The\
    \ XML file has the following format:\n\n```\n<xml version=\"1.0?>\n<yuitests>\n\
    \  <tests base=\"http://www.example.com/tests/\" timeout=\"10000\">\n    <url\
    \ test_core/>\n    <url timeout=\"3000\">test_ui</url>\n    <url></url>\n  </tests>\n\
    </yuitests>\n```\n\nThe <tests> element is used to specify a base path and default\
    \ timeout value for each test. Then, each <url> element specifies the relative\
    \ path to a test page. Tell the YUI Selenium Driver to use the XML file instead\
    \ of the command line by specifying the --tests option:\n\n```\njava -jar yuitest-selenium-driver.jar\
    \ --tests tests.xml\n```\n\nThe YUI Test Selenium Driver goes through each of\
    \ the tests, runs on each of the specified browsers, and returns all of the results."
  merge: -1
  pgno: 186
- img_proc: false
  md: "There is an --errorfail option that indicates the YUI Selenium Driver should\
    \ exit with a nonzero code when a test fails. It's a good idea to specify this\
    \ option so that the build will stop when a test fails rather than continue.\n\
    \n# The Ant Target\n\nTo create the Ant target, start by specifying the key pieces\
    \ of data in a properties file:\n\n```\nsrc.dir = ./src\nlib.dir = ./lib\ntests.dir\
    \ = ./tests\n```\n\n```\nyuitestselenium.host ${lib.dir}/yuitest-selenium-driver.jar\n\
    \nyuitestselenium.host = testing.example.com\nyuitestselenium.port = 4444\nyuitestselenium.tests\
    \ = ${lib.dir}/tests.xml\nyuitestselenium.browsers = ${*firefox}\n```\n\nThe Ant\
    \ target uses the <exec> task to run the YUI Selenium Driver and pass in the relevant\
    \ information:\n\n```\n<target name=\"test\">\n<exec executable=\"java\" failonerror=\"\
    true\">\n  <arg line=\"-jar\"/>\n  <arg path=\"${yuitestselenium}\"/>\n  <arg\
    \ line=\"--host ${yuitestselenium.host}\"/>\n  <arg line=\"--port ${yuitestselenium.port}\"\
    />\n  <arg line=\"--browsers ${yuitestselenium.browsers}\"/>\n  <arg line=\"--tests\
    \ ${yuitestselenium.tests}\"/>\n  <arg line=\"--errorfail\"/>\n</exec>\n</target>\n\
    ```\n\nThe test will fail if the Selenium Server isn't running, or if a test times\
    \ out, or if a specified browser doesn't exist. It's important to check all of\
    \ these conditions before running tests.\n\nThe Builder <yuitest-selenium> task\
    \ encapsulates all of this functionality. The --error fail flag is always passed\
    \ in, and the other options are available as attributes:\n\n```\n<target name=\"\
    test\">\n<yuitest-selenium host=\"${yuitestselenium.host}\"\nport=\"${yuitestselenium.port}\"\
    \ browsers=\"${yuitestselenium.browsers}\"\ntests=\"${yuitestselenium.tests}\"\
    \ />\n</target>\n```\n\nThe tests attribute is required for <yuitest-selenium>;\
    \ all other attributes are optional."
  merge: -1
  pgno: 187
- img_proc: false
  md: "# Yeti\n\nYeti is another tool designed to work with YUI Test. Unlike the YUI\
    \ Selenium Driver, Yeti is a completely standalone solution written in JavaScript\
    \ that runs on Node.js. Yeti requires you to have an HTML file that automatically\
    \ executes your tests, so you can use the same HTML files that are used with the\
    \ YUI Selenium Driver.\n\nYou can install Yeti via npm:\n\n```\nsudo npm install\
    \ -g yeti\n```\n\nRunning Yeti is simply a matter of passing in the HTML file\
    \ on the command line:\n\n```\nyeti test.html\n```\n\nThis command runs all of\
    \ the tests on Firefox or Safari by default (depending on platform) and outputs\
    \ the result to the command line. If a Yeti server is running locally, this command\
    \ also runs tests on all connected browsers and reports all results.\n\nDue to\
    \ the simplicity of Yeti, the Ant target requires very little configuration in\
    \ a properties:\n\n```\nsrc.dir = ./src\nlib.dir = ./lib\ntests.dir = ./tests\n\
    ```\n\n```\nyeti = yeti\n```\n\nAnd the target itself is very straightforward\
    \ as follows:\n\n```\n<target name=\"test\">\n  <apply executable=\"yeti\" failonerror=\"\
    true\" parallel=\"true\">\n    <fileset dir=\"${tests.dir}\" includes=\"**/*.html\"\
    \ />\n    <srcfile/>\n  </apply>\n</target>\n```\n\nThe test target uses the <apply>\
    \ task to pass all HTML files found in the tests directory to Yeti. The results\
    \ are output on the screen, and the build will fail if there are errors.\n\nThe\
    \ Buildr <yeti> task makes using Yeti even simpler:\n\n```\n<target name=\"test\"\
    >\n  <yeti>\n    <fileset dir=\"${tests.dir}\" includes=\"**/*.html\" />\n  </yeti>\n\
    </target>\n```\n\nKeep in mind that the <yeti> task requires you to have Yeti\
    \ already installed on the computer that is executing the build script."
  merge: -1
  pgno: 188
