  md: "been evaluated. Due to this thickness, **finally** is used infrequently, but\
    \ it is a powerful tool for error handling if necessary.\n\n# Throw or try-catch?\n\
    \nTypically, developers have trouble discerning whether it's appropriate to throw\
    \ an error or catch one using try-catch. Errors should be thrown only in the deepest\
    \ part of the application stack, as discussed previously, typically means JavaScript\
    \ libraries. Any code that handles application-specific logic should have error-handling\
    \ capabilities and should therefore be catching errors thrown from the lower-level\
    \ components.\n\nApplication logic always knows why it was calling a particular\
    \ function and is therefore best suited for handling the error. Never have a **try-catch**\
    \ statement with an empty **clause**; you should always be catching errors in\
    \ some. For example, never do this:\n\n```\n// Bad\ntry {\n  somethingMightCauseAnError();\n\
    } catch (ex) {\n  // noop\n}\n```\n\nIf an error might happen, then you should\
    \ also know how to recover from that error. Exactly how you recover from the error\
    \ might be different in development mode as opposed to what actually gets into\
    \ production, and that's okay. The important thing is that you're actually handling\
    \ the error, not just ignoring it.\n\n# Error Types\n\nECMA-262 specifies seven\
    \ error object types. These are used by the JavaScript engine when various error\
    \ conditions occur and can also be created:\n\n+   * Error: Base type for all\
    \ errors. Never actually thrown by the engine.\n* EvalError: Thrown when an error\
    \ occurs during execution of code eval().\n* RangeError: Thrown when a number\
    \ is outside the bounds of its range—for example, trying to create an array with\
    \ -20 items (new Array(-20)). These errors rarely occur during normal execution.\n\
    * ReferenceError: Thrown when an object is expected but not available—for instance,\
    \ trying to call a method on a null reference.\n* SyntaxError: Thrown when the\
    \ code passed into eval() has a syntax error."
