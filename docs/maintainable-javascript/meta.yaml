    Think of CSS class names as the communication mechanism between CSS and JavaScript.
    JavaScript is free to add and remove class from elements throughout the life cycle
    of the page. The styles applied by the classes are defined in the CSS code. Those
    styles may change at any point in time in the CSS necessitating a JavaScript update.
    JavaScript should not be manipulating styles directly so that it stays loosely
    coupled with them.


    ![](bbox=[0.143, 0.457, 0.223, 0.513])


    There is one instance in using the style property is acceptable: when you need
    to position an element on the page relative to another element or the size of
    the page itself. This type of calculation can''t be done in CSS, so it is okay
    to use style.top, style.left, style.bottom, and style.right to position an element
    correctly. The CSS class for the element should have a logical default value that
    is then overridden in script.


    # Keep JavaScript Out of HTML


    One of the first things people do when they learn JavaScript is start embedding
    it within HTML. There are any number ways to do this. The first is to assign event
    handlers using the attributes as onclick:


    ```

    <-- Bad --

    <button onclick="doSomething()" id="action-btn">Click Me</</button>

    ```


    This is how most websites with JavaScript were coded around the year 2000. HTML
    was littered with onclick and other event handlers as attributes of HTML. Although
    this code would work in most situations, it represents tight coupling of two UI
    layers (HTML and JavaScript), so there are several problems with it.


    First, the doSomething() function must be available when the button is clicked.
    The code who developed websites around 2000 are quite familiar with this problem.
    The code for doSomething() may be loaded from an external file or occur later
    in the HTML'
