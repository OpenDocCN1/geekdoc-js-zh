  md: "# if Statement\n\nThe if class of statements should have the following form:\n\
    \n```\nif (condition) {\n    statements\n}\nif (condition) {\n    statements\n\
    } else {\n    statements\n}\nif (condition) {\n    statements\n} else if (condition)\
    \ {\n    statements\n} else {\n    statements\n}\n```\n\nIt is never possible\
    \ to omit the braces in any part of an if statement.\n\n```\n// Good\nif (condition)\
    \ {\n    doSomething();\n}\n\n// Bad: Improper spacing\nif(condition){\n    doSomething();\n\
    }\n\n// Bad: Missing braces\nif (condition)\n    doSomething();\n\n// Bad: All\
    \ on one line\nif (condition) { doSomething(); }\n\n// Bad: All on one line without\
    \ braces\nif (condition) doSomething();\n```\n\n# for Statement\n\nThe for class\
    \ of statements should have the following form:\n\n```\nfor (initialization; condition;\
    \ update) {\n    statements\n}\nfor (variable in object) {\n    statements\n}\n\
    ```"
  merge: -1
  pgno: 218
- img_proc: false
  md: "Variables should not be declared in the initialization section of a for statement.\n\
    \n```\n// Good\nvar i,\nlen;\n\nfor (i=0, len=10; i < len; i++) {\n  // code\n\
    }\n```\n\n```\n// Bad: Variables declared during initialization\nfor (var i=0,\
    \ len=10; i < len; i++) {\n  // code\n}\n```\n\n```\n// Bad: Variables declared\
    \ during initialization\nfor (var prop in object) {\n  // code\n}\n```\n\nWhen\
    \ using a for-in statement, double-check if you need to use hasOwnProperty() to\
    \ filter object members.\n\n# while Statement\n\nThe while class of statements\
    \ should have the following form:\n\n```\nwhile (condition) {\n  statements\n\
    }\n```\n\n# do Statement\n\nThe do class of statements should have the following\
    \ form:\n\n```\ndo {\n  statements\n} while (condition);\n```\n\nNote the use\
    \ of semicolon as the final part of this statement. There should be a space before\
    \ and after the while keyword.\n\n# switch Statement\n\nThe switch class of statements\
    \ should have the following form:\n\n```\nswitch (expression) {\n  case expression:\n\
    \    statements\n\n  default:\n    statements\n}\n```"
  merge: -1
