  md: "```\ndefine([ \"dependency1\", \"dependency2\" ],\n function(dependency1, dependency2)\
    \ {\n\n  var Books = {};\n  Books.MaintainableJavaScript = {\n    author: \"Nicholas\
    \ C. Zakas\"\n  };\n\n  return Books;\n});\n```\n\nAMD modules have quite a few\
    \ options for how to define modules. For more information, see the AMD specification\
    \ at https://github.com/amdjs/amdjs-api/wiki/AMD.\n\nTo use AMD modules, you need\
    \ to use a compatible module loader. Dojo's standard module loader supports AMD\
    \ modules, so you can load your \"my-books\" module like this:\n\n```\n// load\
    \ AMD module in Dojo\nvar books = dojo.require(\"books.MaintainableJavaScript\"\
    );\n```\n\n```\nconsole.log(books.MaintainableJavaScript.author);\n```\n\nDojo\
    \ also exposes itself as an AMD module named \"dojo\", so it can be loaded into\
    \ other AMD modules.\n\nAnother module is RequireJS. RequireJS adds another global\
    \ function called require(), which is responsible for loading the specified dependencies\
    \ and executing a callback function. For example:\n\n```\n// load AMD module with\
    \ RequireJS\nrequire([\"my-book\"], function(books) {\n```\n\n```\n  console.log(books.MaintainableJavaScript.author);\n\
    ```\n\n```\n});\n```\n\nThe dependencies start to download immediately upon calling\
    \ require(), and the callback executes as soon as all of those dependencies have\
    \ been loaded (similar to YUI.use()).\n\nThe RequireJS module loader has a lot\
    \ of logic built in making modules easy. These include mapping of names to directories\
    \ as well as internationalization options. Both jQuery and Dojo are capable of\
    \ using RequireJS to load AMD modules.\n\n# The Zero-Global Approach\n\nIt is\
    \ possible to inject your JavaScript into a page without creating a single global\
    \ variable. This approach is quite limited, so it is useful in some very specific\
    \ situations. The most common situation is with a completely standalone script\
    \ that doesn't have to be accessed by any other scripts. This situation may occur\
    \ because all of the necessary scripts are combined into one file, or because\
    \ the script is small and being inserted into"
  merge: -1
  pgno: 93
- img_proc: false
  md: "a page that it shouldn't interfere with. The most common use case is on creating\
    \ a bookmarklet.\n\nBookmarklets are unique in that they don't know what's going\
    \ to be on the page and don't want the page to know that they are present. The\
    \ end result is a need for a zero-global embedding of the script, which is accomplished\
    \ by using an immediate function invocation and placing all of the script inside\
    \ of the function. For example:\n\n```\n(function(win) {\n\n  var doc = win.document;\n\
    \n  // declare other variables here\n\n  // other code goes here\n\n}(window));\n\
    ```\n\nThis immediately invoked function passes in the window object so that the\
    \ scripts needn't directly access any global variables. Inside the function, the\
    \ doc variable holds a reference to the document object. As long as the variables\
    \ are declared using the var keyword, this script will result in no globals being\
    \ injected into the page. You can further avoid creating globals by putting the\
    \ function into strict mode (for browsers that support it):\n\n```\n(function(win)\
    \ {\n\n  \"use strict\";\n\n  var doc = win.document;\n\n  // declare other variables\
    \ here\n\n  // other code goes here\n});\n```\n\nThis function wrapper can now\
    \ be used for scripts that don't want to create any global objects. As mentioned\
    \ previously, this pattern is of limited use. Any script that needs to be used\
    \ by other scripts on the page cannot use the zero-global approach. A script that\
    \ must be extended or modified during runtime cannot use the zero-global approach,\
    \ either. However, if you have a small script that doesn't need to interact with\
    \ any other scripts on the page, the zero-global approach is something to keep\
    \ in mind."
