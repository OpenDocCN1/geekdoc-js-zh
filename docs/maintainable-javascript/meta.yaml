  md: "and the fix will be in the CSS. Finally, if there are behavioral issues, you\
    \ can go straight to the JavaScript to address the problem. This ability is a\
    \ key part of a maintainable web interface.\n\n# Keep JavaScript Out of CSS\n\n\
    There was a feature in Internet Explorer 8 and earlier that some loved and many\
    \ hated: CSS expressions allow you to insert JavaScript directly into CSS, performing\
    \ calculations or other functionality directly inside CSS code. For example, the\
    \ following code sets the width of an element to match the width of the browser:\n\
    \n```\n/* Bad */\n.box {\n    width: expression(document.body.offsetWidth + \"\
    px\");\n}\n```\n\nThe CSS expression is enclosed in the special expression() function,\
    \ which accepts any JavaScript code. CSS expressions are reevaluated frequently\
    \ by the browser and are considered to be bad for performance, even making it\
    \ Steve Souders' High Performance Web Sites something to avoid (Rule 7: Avoid\
    \ CSS Expressions).\n\nAside from the performance issues, having JavaScript embedded\
    \ inside of CSS is a maintenance nightmare, and one which I had firsthand experience.\
    \ In 2005, I had a JavaScript bug assigned to me that I had battled from the start.\
    \ It occurred only in Internet Explorer and happened only when the browser window\
    \ was resized a few times. At that point in time, the best JavaScript debugger\
    \ for Internet Explorer was Visual Studio, but it failed to locate the source\
    \ of the problem. I spent an entire day setting breakpoints and inserting alert()\
    \ statements to try to figure out what was happening.\n\nBy the end of the day,\
    \ I had resigned myself to my favorite debugging method: systematic removal of\
    \ code. I removed JavaScript, file by file, and tried to reproduce the issue.\
    \ The bug was still there. I looked at my computer in disbelief. A JavaScript\
    \ error without any JavaScript on the page—how is that possible?\n\nTo this day,\
    \ I'm not sure what led me to look at the CSS. I wasn't even sure what I was looking\
    \ for at that point. I started at the top of the CSS and slowly scrolled down\
    \ to see if anything would jump out at me. Finally, I saw the CSS expression that\
    \ was the source of the problem. When I removed it, the error went away.\n\nThis\
    \ experience is what led me to the rules in this chapter. I spent an entire day\
    \ looking for a JavaScript bug in JavaScript when it was actually CSS. The actual\
    \ error wasn't difficult to solve, but tracking down the error in a part of the\
    \ system in which I (reasonably) didn't expect to find it was ridiculously consuming.\n\
    \nFortunately, Internet Explorer 9 removed support for CSS expressions, but older\
    \ versions of Internet Explorer are still use around the world. Even though it's\
    \ tempting"
  merge: -1
