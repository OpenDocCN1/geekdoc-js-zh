  md: "Either way, it's possible for a user to click the button before the function\
    \ is available and cause a JavaScript error. The resulting error message may pop\
    \ up to the user or cause the button to do nothing. Either case is undesirable.\n\
    \nThe second problem is a maintenance issue. What happens if you want to change\
    \ the name ofdoSomething()? What happens the button should now call a different\
    \ function when clicked? In both cases, you're making both the JavaScript and\
    \ the HTML; this is the essence of tightly coupled code.\n\nMost—if not all—of\
    \ your JavaScript should be contained in external files and included on the page\
    \ via a <script> element. The attributes should not be used for attaching event\
    \ handlers in HTML. Instead, use JavaScript methods for adding event handlers\
    \ once the external script has been loaded. For DOM Level 2-compliant browsers,\
    \ you can achieve the same behavior in the previous example by using this code:\n\
    \n```\nfunction doSomething() {\n  // code\n}\n```\n\n```\nvar btn = document.getElementById('action-btn');\n\
    btn.addEventListener('click', doSomething, false);\n```\n\nThe advantage of this\
    \ approach is that the function doSomething() is defined in the same file as the\
    \ code that attaches the handler. If the name needs to change, there is just one\
    \ place to edit; if the button should do something else clicked, there is still\
    \ just one place to go to make that change.\n\nInternet Explorer 8 and earlier\
    \ versions don't support addEventListener(), so you may need a function to normalize\
    \ the difference:\n\n```\nfunction add(target, type, handler) {\n  if (target.addEventListener)\
    \ {\n    target.addEventListener(type, handler, false);\n  } else if (target.attachEvent)\
    \ {\n    target.attachEvent(\"on\" + type, handler);\n  } else {\n    target[\"\
    on\" + type] = handler;\n  }\n}\n```\n\nThis function is capable of adding an\
    \ event handler for an element in any browser, even falling back to the DOM Level\
    \ 0 approach of assigning a handler to the property of an object (this step would\
    \ be necessary for very old browsers such as Netscape 4, but it's always good\
    \ to cover your bases). This method is used as follows:\n\n```\nfunction doSomething()\
    \ {\n  // code\n}\n```\n\n```\nvar btn = document.getElementById('action-btn');\n\
    add(btn, \"click\", doSomething);\n```"
