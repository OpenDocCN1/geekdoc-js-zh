  md: 'Apache 2, one of the most popular servers, has HTTP compression built in as
    the mod_deflate module. This module is enabled by default and automatically compresses
    JavaScript, HTML, CSS, and XML files. If you''re using Apache 2, then you don''t
    need to do any further configuration for JavaScript files.


    Nginx, another popular web server, also has HTTP compression built in gzip. Compression
    is also enabled by default for JavaScript, HTML, CSS, and XML files. If you''re
    using Nginx, then no further configuration is needed to enable compression for
    JavaScript.


    ![](bbox=[0.147, 0.266, 0.226, 0.339])


    Internet Explorer 6 and earlier had problems with HTTP compression in certain
    situations. Apache 2 and Nginx allow you to turn off HTTP compression for these
    browsers if necessary. Since Microsoft began auto-updating everyone with Internet
    Explorer 6 to Internet Explorer 8 in 2012, this should no longer be much of a
    problem.


    # Build-Time Compression


    You may choose to compress files during build time if you want to distribute the
    compressed file yourself without any intervention. jQuery builds a gzipped version
    of the main JavaScript file and makes it available for download from http://jquery.com.
    Gzipping is the easiest way to perform compression at build time by Ant''s <gzip>
    task.


    The <gzip> task works only on a single file. You specify the src attribute as
    the filename to compress and the destfile attribute as the output file. For example:


    ```

    <gzip src="${build.dir}/build.js" destfile="${build.dir}/build.js.gz"/>

    ```


    This task builds the build.js and outputs the result to build.js.gz. You can certainly
    use <gzip> in this manner if you have only one file to gzip. For example:


    ```

    <target name="compress">

    <gzip src="${build.dir}/build.js" destfile="${build.dir}/build.js.gz"/>

    </target>

    ```


    In this case, the filenames should be stored in properties so they can be easily
    changed later.


    A little bit of creativity is required to gzip multiple files without explicitly
    setting their filenames. However, it''s possible to use Gzip inside Ant <script>
    to provide this behavior.


    The <script> task allows you to write scripts in a number of languages, of which
    JavaScript is just one. To specify JavaScript as the language you''re using, set
    the lang attribute to "javascript". After that, enclose the contents of the <script>
    element with CDData delimiters as this:


    158 | Chapter 17: Minification and Compression'
