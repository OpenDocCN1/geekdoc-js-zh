    \ the file to write the data into. So this line takes the Java properties file\
    \ named source.properties and outputs JSONP with a callback function of myfunc\
    \ to a file named result.js.\n\nUsing a tool like Props2Js allows you to keep\
    \ configuration data in a simpler format and then easily convert your configuration\
    \ data into a format that is usable by JavaScript later."
