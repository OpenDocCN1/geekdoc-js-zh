  md: '# Introduction


    The professionalization of web development has been a difficult journey because
    of our disparate beginnings. Even those who end up at large companies such as
    Yahoo! inevitably began on their own, hacking around. Perhaps you were even "the
    web guy" at a small company and could do pretty much whatever you wanted. When
    the large companies started tapping this previously undiscovered resource, it
    brought a lot of hackers into a corporate environment, where they met with constraints.
    No longer a lone soldier in a small battle, all of these self-taught, self-directed
    individuals had to figure out how to work within a team environment.


    I learned JavaScript the way many did in the late 1990s: I taught myself. Because
    JavaScript was so new, educational resources were scarce. I, like many other developers,
    learned by exploring the intricacies of Internet Explorer and Netscape Navigator
    of my own. I experimented, theorized, and experimented again until I discovered
    how things worked. Luckily for me, the curiosity and diligence turned into my
    first job.


    For the first five years of my professional career, I was the "JavaScript guy.\
    No one in either of my first two companies could match my depth of knowledge in
    JavaScript and web development in general. All problems, from very simple to very
    difficult, ended up on my desk to solve by myself. It was empowering as a fresh-from-college
    kid and terrifying because I had no one to bounce ideas off of or anyone to help
    me I did the best that I could, knowing that I was the only one who could do it.


    During those five years, I honed my craft. I came up with ways of doing things
    that made sense to me and my workflow. I didn''t have to worry about what anyone
    else thought of me, because no one had enough knowledge to code review or fix
    what I had written. I was a hacker in its purest sense: I wrote the way I wanted
    and wouldn''t hear of changing it.


    In six years of my professional career, I switched jobs and ended up on a team
    where everyone was expected to contribute code in all aspects of the project.
    No longer able to focus on JavaScript and web development, I found myself writing
    server-side code and SQL queries most of the time. Meanwhile, traditionally backend-focused
    developers were being forced to write code. This experience really opened my eyes
    the:'
  merge: -1
  pgno: 10
- img_proc: false
  md: 'way I used to write code wasn''t the rest of the team wrote, and that was a
    problem.


    I quickly realized that to be more effective on the team, I had to start writing
    code the rest of the team wrote code. Server-side code and SQL were a bit alien
    to me, so I adopted the patterns of around me I knew what they were doing. At
    the same time, I started talking to the others about adopting coding patterns
    for HTML, CSS, and JavaScript. I added JavaScript linting into the build process
    to enforce our standards—the first test of web code we ever at the company. And
    soon, the team was working as a well-oiled machine.


    When I arrived at Yahoo! in 2006, with a specific idea of how things should work
    when I did there. What I found was a completely different animal altogether. My
    Yahoo! team, the first team I worked on, was much larger than any I had worked
    before. There were already pseudounonyms in place, and I had a lot to learn. New
    technologies, new processes, and new tools were presented to me on a daily basis.
    I was overwhelmed and resigned to spending some time learning about this new environment
    and soaking up as much knowledge as I could from my colleagues.


    After a few months, I started to find problems. The problems I became accustomed
    to writing all the time. There were a lot of people doing things in different
    ways, and that caused bugs. My manager, noticing this, pulled me aside one day
    and said he''d like me to lead cleaning up our development. His words, still inspiring
    to me, "When you write code, things just work—they rarely have bugs, but I wanted
    everyone to write code like you." And with that, I set to add structure to My
    Yahoo! frontend development team.


    The success I had working on My Yahoo! team ultimately led to my being chosen
    as the frontend lead for the Yahoo! home page redesign of 2008. This assignment
    really put my organizational and code quality skills to the test, as we had more
    than 20 frontend engineers working with the same code. After a few months of learning
    and adjusting, the team reached a high level of productivity and quality that
    many were amazed. Not only did all code look similar regardless of who we were,
    but most developers were capable of quickly switching to someone else''s work
    to fix bugs or implement new features. What we accomplished as an engineering
    team over the course of a couple of years is still one of the highlights of my
    career.


    It during my time at Yahoo!, working on large teams, that I accumulated the tips
    and techniques discussed in this book. The highlights how I transformed myself
    from a hacker, always doing things his way, to a software engineer, a team player
    who gave up of myself so that the team could function at a higher level. And that''s
    really what this book is: how to write JavaScript as part of the team.


    The hard truth that developers often don''t understand is that we spend most of
    our time maintaining code. It''s rare that you get to open up a text editor and
    start writing code from scratch. Most of the time, you''re building on code that''s
    already there. Writing code in a maintainable way allows you, and others who will
    work on your


    x | Introduction'
  merge: -1
  pgno: 11
- img_proc: false
  md: 'code after you, to easily pick up where the code leaves off. As I used to always
    tell my colleagues at Yahoo!:When you come to work, you’re not writing code for
    you, you’re writing code for those who come after you.”


    This book is a collection and discussion of code conventions for JavaScript. One
    of the most popular code convention demands, Code Conventions for the Java Language,
    lists the following reasons that code conventions are important:


    +   - Eighty percent of the lifetime cost of a piece of software goes we to maintenance.

    - Hardly any software is maintained for its whole life by the original author.

    - Code conventions improve the readability of the software, allowing engineers
    to understand new code more quickly and thoroughly.

    - If you ship your source code as a product, you need to make sure that it is
    as well packaged and clean as any other product you create.


    This reasoning still rings true. The conventions discussed in this book are all
    aimed at helping you and your team write JavaScript in the most effective way
    possible.


    Because you’re reading this book, you probably are open to the suggestions contained
    herein. Keep in mind that these techniques are really aimed at a multideveloper
    environment in which there are many engineers all working on the same code. Being
    a part of a team means making decisions that are best not for you, but for the
    team as a whole. And sometimes means sacrificing your preferences, your ideas,
    and your ego. What you receive in return is a high-functioning team capable of
    doing great things, and I hope this book will help you along that road.'
