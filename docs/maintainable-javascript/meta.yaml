    When handling events, it is best to let the event handler be the only function
    that touches the event. The event handler should do everything necessary using
    the event object before delegating to some application logic. Thus actions as
    preventing the default action or stopping event bubbling must be done strictly
    in the event handler, as in:


    ```

    // Good

    var MyApplication = {


    handleClick: function(event) {


    // assume DOM level 2 events support

    event.preventDefault();

    event.stopPropagation();


    // pass to application logic

    this.showPopup(event.clientX, event.clientY);

    },


    showPopup: function(x, y) {

    var popup = document.getElementById("popup");

    popup.style.left = x + "px";

    popup.style.top = y + "px";

    popup.className = "reveal"

    }

    ```


    ```

    addEventListener(element, "click", function(event) {

    MyApplication.handleClick(event); // this is okay

    });

    ```


    In this code, MyApplication.handleClick() is the defined event handler, which
    calls to event.preventDefault() and event.stopPropagation() before passing data
    to the application logic, which is exactly how the relationship between event
    handlers and the application logic should work. Because the application logic
    no longer depends on event, it''s easy to use that same logic in multiple places
    well as to write tests.'
