  md: "# CHAPTER 1\n\n# Basic Formating\n\nAt the core of a style guide are basic\
    \ formatting rules. These rules govern how the code is written at a high level.\
    \ Similar to the ruled paper used in schools to teach writing, basic formatting\
    \ rules guide developers toward writing code in a particular style. These rules\
    \ often contain information about syntax that you may not have considered, but\
    \ every piece is important in creating a coherent piece of code.\n\n# Indentation\
    \ Levels\n\nThe first decision is to be made about your JavaScript style guidelines\
    \ (and indeed, about those of most languages) is how to handle indentation. This\
    \ is one of topics on which debates can last for hours; indentation is about as\
    \ close to religion as software engineers get. However, it is quite important\
    \ to establish indentation guidelines up front, lest developers fall into the\
    \ classic problem of reindent every file they open starting to work. Consider\
    \ a file that looks like this (indentation has been intentionally changed for\
    \ demonstration purposes):\n\n```\nif (wl && wl.length) {\n    for (let i = 0;\
    \ i < wl.length; i++) {\n        let p = wl[i];\n        let type = Y.Lang.type(p);\n\
    \        if (s.ownProperty(p)) { if (merge && type == 'object') {\nmix(r(p), s(p));\n\
    } else if (ov || !(p in r)) {\n    r[p] = s[p];\n}\n}\n}\n```\n\nLooking at this\
    \ code quite difficult. The indentation isn't uniform, so it appears that the\
    \ else applies to the if statement on the first line. However, closer inspection\
    \ reveals that the else actually applies to the if statement on line 5. The most\
    \ likely culprit is a mixture of indentation styles from several different developers.\
    \ This is"
  merge: -1
