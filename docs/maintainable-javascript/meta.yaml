    \ variable names such as i, j, and k are typically reserved for loops. Using names\
    \ that suggest the data type makes your code easier to understand by others and\
    \ as yourself.\n\nMeaningless names should be avoided. Names such as foo, bar,\
    \ and temp, despite being part of the developer's toolbox, don't give any meaning\
    \ to variables. There's no way for another developer to understand what the variable\
    \ is used for without understanding all of the context.\n\nFor function and method\
