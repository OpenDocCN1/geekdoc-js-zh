    \n![](bbox=[0.172, 0.083, 0.226, 0.153])\n\n# Better Approaches\n\nModifying objects\
    \ you don’t own is a solution to some problems. It usually doesn’t happen organically;\
    \ it happens because a developer has come across a problem that object modification\
    \ solves. However, there is almost always than one solution to any given problem.\
    \ Most computer science knowledge has evolved out of problems in statically typed\
    \ languages like Java. There are many approaches, design patterns, to extending\
    \ existing objects without directly modifying objects.\n\nThe most popular form\
    \ of object augmentation outside of JavaScript is inheritance. If there’s a type\
    \ of object that does what you want, then you can inherit from it and add additional\
    \ functionality. There are two basic forms of inheritance in JavaScript: object-based\
    \ and type-based.\n\nThere are still some significant inheritance limitations\
    \ in JavaScript. First, inheriting from DOM or BOM objects doesn’t work (yet).\
    \ Second, inheriting from Array doesn’t work due to the intricacies of how numeric\
    \ indices relate to the length property.\n\n![](bbox=[0.172, 0.468, 0.226, 0.538])\n\
    \n# Object-Based Inheritance\n\nIn object-based inheritance, frequently prototypal\
    \ inheritance, one object inherits from another without invoking a constructor\
    \ function. The ECMAScript 5 Object.create() method is the easiest way for one\
    \ object to inherit from another. For instance:\n\n```\nvar person = {\n  name:\
    \ \"Nicholas\",\n  sayName: function() {\n    alert(this.name);\n  }\n};\nvar\
    \ myPerson = Object.create(person);\nmyPerson.sayName(); // pops up \"Nicholas\"\
    \n```\n\nThis example creates a new object myPerson that inherits from person.\
    \ The inheritance occurs as myPerson’s prototype is set to person. After that,\
    \ myPerson is able to access the properties and methods on person until new properties\
    \ or methods with the same"
