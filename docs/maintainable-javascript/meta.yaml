  md: "# Difficult-to-Understand Code\n\nDifficult-to-understand code should always\
    \ be commented. Depending on what the code is doing, you may use one multiline\
    \ comment, several single comments, or some combination thereof. They key is to\
    \ bring some understanding of the code's purpose to someone else. For example,\
    \ here's some code from the YUI library's Y.mix() method:\n\n```\n// Good\n\n\
    if (mode) {\n  /*\n   * In mode 2 (prototype to prototype and object to object),\
    \ we recurse\n   * once to do the proto to proto mix. The object to object mix\
    \ will be\n   * handled later on.\n   */\n  if (mode == 2) {\n    Y.mix(receiver.prototype,\
    \ supplier.prototype, overwrite, whitelist, 0, merge);\n  }\n\n  /*\n   * Depending\
    \ on which mode is specified, we may be copying from or to\n   * the prototypes\
    \ of the supplier and receiver.\n   */\n  from = mode == 1 || mode == 3 ? supplier.prototype\
    \ : supplier;\n  to = mode == 1 || mode == 4 ? receiver.prototype : receiver;\n\
    \  /*\n   * If either the supplier or receiver doesn't actually have a\n   * prototype\
    \ property, then we could end up with an undefined or\n   * to. If that happens,\
    \ we abort and return the receiver.\n   */\n  if (!from || to) {\n    return receiver;\n\
    \  }\n} else {\n  from = supplier;\n  to = receiver;\n}\n```\n\nThe Y.mix() method\
    \ uses constants to determine how to proceed. The mode argument is equivalent\
    \ to one of those constants, but it's hard to understand what each constant means\
    \ from the numeric value. The code is commented well, because it explains what\
    \ other appear to be complex decisions.\n\n# Potential Author Errors\n\nAnother\
