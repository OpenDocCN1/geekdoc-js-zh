  md: "# CHAPTER 20\n\n# Putting It Together\n\nThe preceding chapters about the build\
    \ system focused on creating small pieces of a build system, creating a library\
    \ of utilities that could easily be put together later. This chapter focuses on\
    \ assembling the system into an end-to-end solution for your JavaScript. For your\
    \ final system, you may have more complex functionality and may choose to use\
    \ a bundled set of tasks such as Buildr, but there are still some common pieces\
    \ of functionality that all build systems have.\n\n# Missing Pieces\n\nBefore\
    \ putting together the build system, there are a couple of small steps that are\
    \ missing. The first is the creation of the build directory. As this directory\
    \ is transient (and won't be checked in), the build system is responsible for\
    \ its creation. <mkdir> Ant task handles this easily:\n\n```\n<target name=\"\
    init\">\n  <mkdir dir=\"${build.dir}\"/>\n</target>\n```\n\nThe init target does\
    \ just one thing: create the build directory so all the built files have a place\
    \ to put. It's possible that other tasks, such as <concat>, may end making this\
    \ directory if it doesn't already exist. However, it's best to explicitly state\
    \ each step of the build process to ensure that reordering of tasks or targets\
    \ doesn't cause errors.\n\nThe second piece is the cleanup of the build directory.\
    \ In between builds, you want to remove all files and start from scratch. The\
    \ fastest way to do that is simply to delete the build directory using the <delete>\
    \ task:\n\n```\n<target name=\"clean\">\n  <delete dir=\"${build.dir}\"/>\n</target>\n\
    ```\n\nThe clean target removes the build directory so you're certain to get the\
    \ latest files."
  merge: -1
  pgno: 194
