    \ browser. The key to polyfills is that they implement native functionality in\
    \ a completely compatible way. Because the functionality exists in some browsers,\
    \ it is possible to test whether different cases are handled in a standards-compliant\
    \ manner.\n\nPolyfills often add new methods to objects they don't own to achieve\
    \ their end goal. I'm not a fan of polyfills, but I do understand why people use\
