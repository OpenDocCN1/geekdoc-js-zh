  md: "All of these objects are part of your project's execution environment. You\
    \ can use these pieces as they are already provided to you or create new functionality;\
    \ you should not modify what's already there.\n\n# The Rules\n\nEnterprise software\
    \ needs a consistent and dependable execution environment to be maintainable.\
    \ In other languages, you consider existing objects as libraries for you to use\
    \ to complete your task. In JavaScript, you might see existing objects as a playground\
    \ in which you can do anything you want. You should treat the existing JavaScript\
    \ objects as you would a library of utilities:\n\n+   - Don't override methods.\n\
    - Don't add new methods.\n- Don't remove existing methods.\n\nWhen you're the\
    \ only working on a project, it's easy to get away with these types of modification\
    \ because you know them and expect them. When working with a team on a large project,\
    \ making changes like this causes mass confusion and a lot of time.\n\n# Don't\
    \ Override Methods\n\nOne of the worst practices in JavaScript is overriding a\
    \ method on an object you don't own, which is precisely what caused us problems\
    \ when I worked on My Yahoo! team. Unfortunately, JavaScript makes it incredibly\
    \ easy to override an existing method. Even the most vulnerable of methods, document.getElementById(),\
    \ can be easily overridden:\n\n```\n// Bad\\ocument.getElementById = function()\
    \ {\n  // return null;\n}\n```\n\nThere is absolutely nothing preventing you from\
    \ overwriting DOM methods in this example. What's worse, any script on the page\
    \ is capable of overwriting any other script's methods. Any script could override\
    \ document.getElementById to always return null, which in turn would cause JavaScript\
    \ libraries and other code that relies upon this method to fail. You've also completely\
    \ lost the original functionality and can't get it back.\n\nYou may also see a\
    \ pattern like this:\n\n```\n// Bad\\ocument.originalGetById = document.getElementById;\n\
    document.getElementById = function(id) {\n  if (id == \"window\") {\n    return\
    \ window;\n  } else\n```"
