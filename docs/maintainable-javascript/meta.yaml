  md: "It’s optional, but you might want to include testing in the development build\
    \ or to let developers run ant separately on their own. Keep in mind that testing\
    \ takes more time due to the need to set up and tear down browser instances.\n\
    \n# # The Integration Build\n\nThe integration build runs automatically as part\
    \ of a continuous integration (CI) system, it has more steps to complete. Because\
    \ this build is the main defense against errors, it should include as much validation\
    \ and testing as possible. At a minimum, it should do everything the development\
    \ build plus unit testing. This is also a good location to place documentation\
    \ generation so that other developers can see what changes have been made to the\
    \ code. Here’s a sample:\n\n```\n<project name=\"youapp\" default=\"build.dev\"\
    >\n<!-- omitted for clarity -->\n  <!-- main builds --\n  <target name=\"build.dev\"\
    \ depends=\"build.dev,minify,test,document\">\n  </target>\n</project>\n```\n\n\
    The build runs first build.dev to complete the validation and concatenation of\
    \ code. Next, the code is modified, then tested, and then documented. If this\
    \ build breaks, it should cause the CI system to report an issue appropriately.\
    \ Some systems sends out emails, others make visual changes to a stability dashboard.\
    \ In any case, breaking the integration build is a matter that needs to be addressed\
    \ quickly so that other developers aren’t blocked.\n\nYou may want to include\
    \ documentation generation in its own automated build. The reason is that a failure\
    \ to generate documentation doesn’t necessarily mean that the code is broken.\
    \ It might be that the document generator is broken for some reason. Once again,\
    \ this largely depends on your development process and what you think is important\
    \ to stop and fix before continuing.\n\n# # The Release Build\n\nThe release build\
    \ is the finish line of the development process. It is this build that ensures\
    \ that code is fit for production. By the time code gets to the release build,\
    \ it should have been validated and tested, both automatically and manually, and\
    \ should therefore mostly be ready. In some cases, the only thing a release build\
    \ needs to do is bake the files, inserting copyrights, version numbers, or other\
    \ associated metadata. Here’s an example:"
