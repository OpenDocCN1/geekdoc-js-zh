  md: "to exit immediately and not continue running even if the loop hasn’t finished\
    \ all iterations. For values = { [\n\n```\nvar values = [ 1, 2, 3, 4, 5, 6, 7\
    \ ];\ni, len;\n\nfor(i=0, len.values.length; i < len; i++) {\n  if (i == 2) {\n\
    \    break; // no more iterations\n  }\n  process(values[i]);\n}\n```\n\nThe body\
    \ of this loop will execute two times and then exit before executing process()\
    \ the third time, if the values array has more than three items.\n\nThe second\
    \ way to modify how a loop proceeds is through the use of continue. The continue\
    \ statement exits the loop immediately; however, the loop will continue with the\
    \ next iteration. Here’s an example:\n\n```\nvar values = [ 1, 2, 3, 4, 5, 6,\
    \ 7 ];\nni, len;\n\nfor(i=0, len.values.length; i < len; i++) {\n  if (i == 2)\
    \ {\n    continue; // skip this iteration\n  }\n  process(values[i]);\n}\n```\n\
    \nThe body of this loop executes two times, skips the third time, and picks up\
    \ with the fourth iteration. The loop will then continue until its last iteration\
    \ unless interfered with.\n\nCrockford’s Code Conventions disallows the use of\
    \ continue. His assertion is that code using continue can be written using conditions.\
    \ For instance, the previous example can be rewritten as:\n\n```\nvar values =\
    \ [ 1, 2, 3, 4, 5, 6, 7 ];\nni, len;\n\nfor(i=0, len.values.length; i < len; i++)\
    \ {\n  if (i != 2) {\n    process(values[i]);\n  }\n}\n```\n\nCrockford argues\
    \ that this pattern is easier for developers to understand, along with less error\
    \ prone. The Dojo Style states that continue, along with break, may be used. My\
    \ recommendation is to avoid continue whenever possible, but there is no reason\
    \ to completely forbid it. The readability of the code should dictate its usage.\n\
    \nJSLint warns when continue is used. JSHint does not warn when continue is used."
