  md: '```

    <project name="yourapp" default="build.dev">


    <!-- omitted for clarity -->


    <!-- main builds -->

    <target name="build.release" depends="build.int,bake">

    </target>


    </project>

    ```


    The build.release target simply runs an integration build and bakes the files.
    In the case of JavaScript, you might also want to release the release build to
    handle deploying of files to a server. This is typically done as part of a larger
    deployment process for the web application or project rather as part of the release
    build. However, you can certainly include a task to upload files to a server or
    perform other distribution tasks.


    ![](bbox=[0.176, 0.335, 0.218, 0.403])


    Another option for the release build is simply to take the output from the integration
    build and bake it before deploying. Doing so can save time and, assuming there
    were no errors in the integration build, ensure that''re deploying the exact same
    code that was tested. Once again, this choice is very project-specific, so be
    sure to discuss it with your team.


    # Using a CI System


    Just using a build system is a good first step in creating a maintainable project.
    The next step is to integrate your build system into a CI system. CI systems run
    automatically based on certain actions or regular intervals. For instance, you
    might run a build once an hour to get all of the latest checked-in files deployed
    to an integration environment. If it fails, it may send emails to the developers
    asking them to fix any issues. Having a CI system is an important part of any
    good software project. Fortunately, there are some excellent free resources for
    CI.


    # Jenkins


    Jenkins is one of the most used CI systems. It is a Java-based web application
    that is designed for managing multiple builds. It integrates with several source
    control repositories by default and can support almost any others through an extensive
    plugin library. Jenkins works natively with Ant as shell scripts, meaning that
    you can reuse your existing build scripts with Jenkins.


    Setting up Jenkins is quite easy; just download the latest WAR file and start
    it:


    ```

    java -jar jenkins.war

    ```


    Jenkins starts up a web server accessible at http://localhost:8080/. Navigate
    to that location in your web browser, and you''re ready to start creating build
    jobs.'
