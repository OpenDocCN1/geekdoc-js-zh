  md: "# CHAPTER 7\n\n# Event Handling\n\nEvent handling is an important part of any\
    \ JavaScript application. All JavaScript is tied to the UI through events, so\
    \ most developers spend much of their time coding and modifying event handlers.\
    \ Unfortunately, this is also an area of JavaScript programming that hasn’t received\
    \ much attention since the language was first introduced. Even as developers started\
    \ to embrace traditional concepts of architecture in JavaScript, event handling\
    \ was one of those areas in which little has changed. Most event-handling code\
    \ is very tightly coupled to the event environment (what is available to the developer\
    \ at the time an event is fired) and therefore is not very maintainable.\n\n#\
    \ Classic Usage\n\nMost developers are familiar with the event object that is\
    \ passed in to an event handler when the event is fired. The event object contains\
    \ all of the information related to the event, including the event target as well\
    \ as additional data based on the event type. Mouse events expose additional location\
    \ information on the event object, keyboard events expose information about keys\
    \ that have been pressed, and touch events expose information about the location\
    \ and duration of touches. All of this information is provided so that the UI\
    \ can react appropriately.\n\nIn many cases, however, you end up using a very\
    \ small subset of the information present on event. Consider the following:\n\n\
    ```\n// Bad\nfunction handleClick(event) {\n    var popup = document.getElementById(\"\
    popup\");\n    popup.style.left = event.clientX + \"px\";\n    popup.style.top\
    \ = event.clientY + \"px\";\n    popup.className = \"reveal\";\n}\n\n// addlistener\
    \ from Chapter 7\naddEventListener(element, \"click\", handleClick);\n```"
  merge: -1
  pgno: 96
- img_proc: false
  md: "This code uses just properties from the event object: clientX and clientY.\
    \ These properties are used to position an element on the page before showing\
    \ it to the user. Even though this code seems relatively simple and unproblematic,\
    \ it's actually a bad pattern to use in code because of the limitations it imposes.\n\
    \n# Rule #1: Separate Application Logic\n\nThe previous example's first problem\
    \ is that the event handler contains application logic. Application logic is functionality\
    \ that is related to the application rather than related to the user's action.\
    \ In the previous example, the application logic is displaying a pop up in a particular\
    \ location. Even though this action should happen when the user clicks on a particular\
    \ element, this may not always be the case.\n\nIt's always best to split application\
    \ logic from any event handler, because the same logic might need to be triggered\
    \ by different actions in the future. For example, you may decide later that the\
    \ pop up should be displayed when the user moves the cursor over the element,\
    \ or when a particular key is pressed on the keyboard. You may end up accidentally\
    \ duplicating the code to a second or third handler attaching the same handler\
    \ to handle multiple events.\n\nAnother downside to keeping application logic\
    \ directly within the event handler is for testing. Tests need to trigger functionality\
    \ without going through the overhead of having someone click an element to get\
    \ a reaction. Having application logic inside of event handlers, the only way\
    \ to test is by causing the event to fire. That's usually not the best way to\
    \ test, even though some testing frameworks are capable of simulating events.\
    \ It would be better to trigger the functionality with a simple function call.\n\
    \nYou should always separate application logic from event-handling code. The first\
    \ step in refactoring the previous example is to move the pop-handling code into\
    \ its own function, which will likely be on the global object you've defined for\
    \ your application. The event handler should also be on the same global object,\
    \ so you end up with two methods:\n\n```\n// Better - separate application logic\n\
    var MyApplication = {\n\n  handleClick: function(event) {\n    this.showPopup(event);\n\
    \  },\n\n  showPopup: function(event) {\n    var popup = document.getElementById(\"\
    popup\");\n    popup.style.left = event.clientX + \"px\";\n    popup.style.top\
    \ = event.clientY + \"px\";\n    popup.className = \"reveal\";\n  }\n};\n```"
  merge: -1
  pgno: 97
- img_proc: false
  md: "```\naddEventListener(element, \"click\", function(event) {\n  MyApplication.handleClick(event);\n\
    });\n```\n\nThe MyApplication.showPopup() method now contains all of the application\
    \ logic previously contained in the event handler. The MyApplication.handleClick()\
    \ method does nothing but MyApplication.showPopup(). With the application logic\
    \ separated out, it's easier to trigger that functionality from multiple points\
    \ within the application without relying on specific events to fire. But this\
    \ is the first step in unraveling this event-handling code.\n\n# # Rule #2: Don't\
    \ Pass the Event Object Around\n\nAfter splitting out logic, the next problem\
    \ with the previous example is that the event object is passed around. It is passed\
    \ from the anonymous event handler to MyApplication.handleClick(), then to MyApplication.showPopup().\
    \ Previously, the event object has potentially dozens of additional pieces of\
    \ information about the event, and this code only uses two of them.\n\nApplication\
    \ logic should never rely on the event object to function properly for the following\
    \ reasons:\n\n+   * The interface method makes unclear what pieces of data are\
    \ actually necessary. Good APIs are transparent in their expectations and dependencies;\
    \ passing the event object as an argument doesn't give you any idea what it's\
    \ doing with which pieces of data.\n* Because of that, you'll need to recreate\
    \ an event object in order to test the method. Therefore, you'll need to know\
    \ exactly what the method is using to write a proper stub for testing.\n\nThese\
    \ issues are both undesirable in a large-scale web application. Lack of clarity\
    \ leads to bugs.\n\nThe best approach is to let the event handler use the event\
    \ object to handle the event and then hand off any required data to the application\
    \ logic. For example, the MyApplication.showPopup() requires only two pieces of\
    \ data: an x-coordinate and a y-coordinate. The method should be rewritten to\
    \ accept those as arguments:\n\n```\n// Good\nvar MyApplication = {\n  handleClick:\
    \ function(event) {\n    this.showPopup(event.clientX, event.clientY);\n  },\n\
    \n  showPopup: function(x, y) {\n    var popup = document.getElementById(\"popup\"\
    );\n    popup.style.left = x + \"px\";\n    popup.style.top = y + \"px\";\n  }\n\
    };\n```"
