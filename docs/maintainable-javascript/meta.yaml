    like SMTP. E-mail will be sent when a build fails, unstable or returns to stable.

    - Send e-mail for every unstable build

    - Send e-mails to individuals who broke the build


    ![](bbox=[0.203, 0.101, 0.803, 0.461])


    Figure 20-4. Configuring email notifications


    # Other CI Systems


    CI is a popular area for research, new solutions are coming out all the time.
    Here are some other CI systems you may want to consider:


    Continuum


    An Apache project for CI designed to work with Ant and Maven. It is available
    at http://continuum.apache.org.


    BuildBot


    A Python-based build system targeted at engineers. It is available at http://trac.buildbot.net.


    Cruise Control


    Another Java-based build system that works as a web application. Ruby and .NET
    ports also exist. It is available at http://cruisecontrol.sourceforge.net.


    Gradle


    Uses a Groovy-based language on top of Ant and Maven for CI. A little bit difficult
    for nonprogrammers to work with. It is available at http://www.gradle.org.'
