    \ className != \"string\") {\n    throw new Error(\"addClass(): Second argument\
    \ must be a string.\");\n  }\n\n  element.className += \" \" + className;\n}\n\
    ```\n\nThis function simply adds a CSS class to a given element; however, most\
    \ of the function is taken up doing error checking. Even though it might be tempting\
    \ to check every argument in every function (mimicking statically typed languages),\
    \ doing so is overkill in JavaScript. The key is to identify parts of the code\
    \ that are likely to fail in a particular way and throw errors only where errors\
    \ will already occur.\n\nThe most likely cause of an error in the previous example\
    \ is a null reference passed to the function. If the second argument is null,\
    \ or a boolean, no error will be thrown, because JavaScript will coerce the value\
    \ into a string. That may mean the resulting displaying of the DOM element is\
    \ not as expected, but it certainly doesn't rise to the level of severe error.\
    \ So I would check only the DOM element, as:\n\n```\n// Good\nfunction addClass(element,\
    \ className) {\n  if (element || typeof element.className != \"string\") {\n \
    \   throw new Error(\"addClass(): First argument must be a DOM element.\");\n\
    \  }\n\n  element.className += \" \" + className;\n}\n```\n\nIf a function is\
    \ only ever going to be called by known entities, error checking is probably unnecessary\
    \ (which is the case with private functions); if you cannot identify all the places\
    \ where a function will be called at time, then you'll need some error checking\
    \ and will even more likely benefit from throwing your errors. The best place\
    \ for throwing errors is utility functions, such as the addClass() function, that\
    \ are a general part of the scripting environment and may be used in any of places,\
