  md: "# Advantages of Throwing Errors\n\nThrowing your own error allows you to provide\
    \ the exact text to be displayed by the browser. Instead of just line and column\
    \ numbers, you can include any information that you'll need to successfully debug\
    \ the issue. I recommend that you always include the function name in the error\
    \ message as well as the reason why the function failed. Consider the following\
    \ function:\n\n```\nfunction getDivs(element) {\n  return element.getElementsByTagName(\"\
    div\");\n}\n```\n\nThis function's purpose is to retrieve all <div> elements that\
    \ are a descendant of element. It's quite common for functions that interact with\
    \ the DOM to be passed null when DOM elements should be. What happens if null\
    \ is passed to this function? You'll get a cryptic error message as \"object expected\"\
    . Then you'll need to look at the execution stack to actually locate the source\
    \ of the problem. Debugging becomes much easier by throwing an error:\n\n```\n\
    if (element && element.getElementsByTagName(\"div\n```\n\nNow that getDivs() throws\
    \ an error, any time element doesn't meet the criteria for continuing, an error\
    \ is thrown that very clearly states the problem. If this error shows up in the\
    \ browser console, you know immediately where to start debugging and the most\
    \ likely cause is a call to retrieve a DOM element returning null at some point.\n\
    \nI like to think of throwing errors as leaving sticky notes for myself as to\
    \ why something failed.\n\n# When to Throw Errors\n\nUnderstanding how to throw\
    \ errors is just one part of the equation; understanding when to throw errors\
    \ is the other. Because JavaScript doesn't have type or argument checking, a lot\
    \ of developers incorrectly assume that they should implement these types of checking\
    \ for every function. Doing so is impractical and can adversely affect the script's\
    \ overall performance. Consider this function, which tries to implement overly\
    \ aggressive checking:"
