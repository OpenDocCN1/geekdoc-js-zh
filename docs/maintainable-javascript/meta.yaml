  md: "# Detecting Properties\n\nAnother time when developers typically use null (and\
    \ also undefined) is when trying to determine whether a property is present in\
    \ an object. For example:\n\n```\n// Bad: Checking falseness\nif (object[propertyName])\
    \ {\n  // do something\n}\n\n// Bad: Compare against null\nif (object[propertyName]\
    \ != null) {\n  // do something\n}\n\n// Bad: Compare against undefined\nif (object[propertyName]\
    \ != undefined) {\n  // do something\n}\n```\n\nEach of these examples is actually\
    \ checking the value of the property with the given name rather than the existence\
    \ of the property with the given name, which can result in errors when you're\
    \ dealing with falsy values such as 0, \"\" (empty string), false, null, and undefined.\
    \ After all, these are all valid values for properties. For example, if the property\
    \ is keeping track of a number, the value might very well be zero. In that case,\
    \ the first example likely cause a bug. Likewise, if the property value could\
    \ be null or undefined, all three examples can cause bugs.\n\nThe best way to\
    \ detect the presence of a property is to use the in operator simply checks for\
    \ the presence of the named property without reading its value, avoiding ambiguity\
    \ with statements such as those earlier in this section. If the property either\
    \ exists on the instance or is inherited from the object's prototype, in the operator\
    \ returns true. For example:\n\n```\nvar object = {\n  count: 0,\n  related: null\n\
    };\n\n// Good\nif (\"count\" in object) {\n  // this executes\n}\n\n// Bad: Checking\
    \ falsy values\nif (object[\"count\"] {\n  // this doesn't execute\n}\n\n// Good\n\
    if (\"related\" in object) {\n  // this executes\n}\n```"
