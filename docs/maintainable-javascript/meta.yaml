    \ up data for retrieval from the server. For instance:\n\n```\n{\"MSG_INVALID_VALUE\"\
    :\"Invalid value\",\"URL_INVALID\":\"/errors/invalid.php\",\n  \"CSS_SELECTED\"\
    :\"\"selected\"}\n```\n\nThe second is JSONP (JSON with padding), which returns\
    \ the JSON structure wrapped in a function:\n\n```\nmyfunc(\"MSG_INVALID_VALUE\"\
    :\"Invalid value\",\"URL_INVALID\":\"/errors/invalid.php\",\n  \"CSS_SELECTED\"\
    :\"\"selected\"\");\n```\n\nBecause JSON is valid JavaScript, you can concatenate\
    \ this code into other files to give them access to the data.\n\nThe last option\
    \ is plain JavaScript, which you assign the JSON object to a variable to use later,\
    \ as in:\n\n```\nvar config={\n```\n\nAs with JSONP, the plain JavaScript version\
    \ can be combined with other JavaScript files easily once produced.\n\nFor these\
    \ common cases, I have created a tool called Props2Js that reads Java properties\
    \ and outputs the data into one of these three formats. Props2Js is free and open\
    \ source, available at https://github.com/nzakas/props2js. It works like this:\n\
    \n```\njava -jar props2js-0.1.0.jar --to json --name myfunc\n  --output result.js\
