  md: "at the DOM tree in the browser's inspector, then look at the HTML source of\
    \ the page to find differences. Tracking down these issues becomes more problematic\
    \ when JavaScript is doing more than DOM manipulation.\n\nThe second problem with\
    \ this approach is maintainability. If you need to change text or markup, you\
    \ want to be able to go to one place: the place where you manage HTML. This might\
    \ be in PHP code, a JSP file, or a template such as Mustache or Handlebars. Regardless\
    \ of the mechanism used, you all of your markup to be in one location so it can\
