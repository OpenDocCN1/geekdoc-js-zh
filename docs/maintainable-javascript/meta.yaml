  md: "# Baking Files\n\nBaking refers to the final touches you put into files before\
    \ considering them ready for deployment. A lot of times, this step involves adding\
    \ additional text into a file or replacing existing text with something else.\
    \ Inserting the build time, as in the previous-example, is a type of baking. Other\
    \ common tasks are automatically including license information and inserting version\
    \ information. Both can be done very easily using Ant.\n\nMany projects have a\
    \ license file included somewhere in source control. The license file is separate\
    \ because it may change independently of the code. It's useful to automatically\
    \ insert the license information at the top of files before pushing them to production.\
    \ You could potentially insert the license file using a <filelist> element, but\
    \ that would mean the license file must be in a property comment format for JavaScript.\
    \ It's much easier to let the license file be plain text and add the comments\
    \ around it. You can load text from any file using the <loadfile> task:\n\n```\n\
    <loadfile property=\"license\" srcfile=\"license.txt />\n```\n\nThis code loads\
    \ replacing license.txt and stores it in a property name. Once it's in a property,\
    \ you can use the <header> element to insert the text as a comment:\n\n```\n<target\
    \ name=\"concat\">\n  <loadfile property=\"license\" srcfile=\"license.txt />\n\
    \  <concat destfile=\"${build.dir}/build.js\" fixlastline=\"yes\" eol=\"\\lf\"\
    >\n    <header trimleading=\"yes\"/>/*\n    ${license}\n*//\n    /* Build time:\
    \ ${build.time} */\n  </header>\n    <fileset dir=\"${src.dir}\" files=\"first.js,second.js\"\
    \ />\n    <fileset dir=\"${src.dir}\" includes=\"**/*.js\" excludes=\"first.js,second.js\"\
    \ />\n  </concat>\n</target>\n```\n\nThe license is inserted with a multiline\
    \ JavaScript comment that has an exclamation point as the first character, which\
    \ tells codifiers (see Chapter 17) that the comment is important and should not\
    \ be removed. The <header> element also has trimleading set to \"yes\". This attribute\
    \ specifies that white space on each line inside of <header> should be removed.\
    \ That, all text is aligned at the first column in the final file.\n\nThe other\
    \ part of baking replacing some text within files, is accomplished quite easily\
    \ the <replaceregex> task. This task systematically goes through any number of\
    \ files and uses regular expressions to replace values. For example, I tend to\
    \ use the token @VERSION@ regular expressions in my source files to indicate where\
    \ the version number should be inserted. For instance, you might have this in\
    \ a JavaScript file:\n\n148 | Chapter 16: Concatenation and Baking"
