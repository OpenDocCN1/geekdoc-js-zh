  md: "# TypeError\n\nThrown when a variable is of an unexpected type—for example,\
    \ new 10 or \"prop\"\nin true.\n\n# URIError\n\nThrown when an incorrectly formatted\
    \ URI string is passed into encodeURI, encodeURIComponent, decodeURI, or decodeURIComponent.\n\
    \nUnderstanding that there are different types of errors can make it easier to\
    \ handle them. All error types inherit from Error, so checking the type with instanceof\
    \ Error doesn't give you any useful information. By checking for the more specific\
    \ error types, you get more robust error handling:\n\n```\ntry {\n  // something\
    \ that causes an error\n} catch (ex) {\n  if (instanceof TypeError) {\n    //\
    \ handle the error\n  } else if (instanceof ReferenceError) {\n    // handle the\
    \ error\n  } else {\n    // handle all others\n  }\n}\n```\n\nIf you're throwing\
    \ your errors, and you're throwing a data type that isn't an error, you can more\
    \ easily tell the difference between your errors and the ones that the browser\
    \ throws. There are, several advantages to throwing actual Error objects instead\
    \ of other object types.\n\nFirst, as mentioned before, the error message will\
    \ be displayed in the browser's normal error-handling mechanism. Second, the browser\
    \ attaches extra information to Error objects when they are thrown. These vary\
    \ from browser to browser, but they provide contextual information for the error\
    \ such as line number and column number and, in some browsers, stack and source\
    \ information. Of course, you lose the ability to distinguish between your errors\
    \ and browser-thrown errors if you just use the Error constructor.\n\nThe solution\
    \ is to create your own error type that inherits from Error. Doing so allows you\
    \ to provide additional information as well as distinguish your errors from the\
    \ errors that the browser throws. You can create a custom error type using the\
    \ following pattern:\n\n```\nfunction MyError(message) {\n  this.message = message;\n\
    }\n```\n\n```\nMyError.prototype = new Error();\n```\n\nThere are two important\
    \ parts of this code: the message property, which is necessary for browsers to\
    \ know the actual error string, and setting the prototype to an instance"
