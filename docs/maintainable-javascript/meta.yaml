  md: "# HACK\n\nIndicates the code is using a shortcut. Information about why the\
    \ hack is being used should be included. This may also indicate that it would\
    \ be nice to come up with a better way to solve the problem.\n\n# XXX\n\nIndicates\
    \ the code is problematic and should be fixed as soon as possible.\n\n# FIXME\n\
    \nIndicates the code is problematic and should be fixed soon. Less important than\
    \ XXX.\n\n# REVIEW\n\nindicates the code needs to be reviewed for potential changes.\n\
    \nThese annotations may be used with either single-line or multiline comments\
    \ and should follow the same formatting rules as the general comment type.\n\n\
