  md: "Properties loaded using <loadproperties> are accessible in the same manner\
    \ as those defined explicitly within build.xml. For a large number of properties,\
    \ or properties that need to be shared among multiple Ant scripts, it's best to\
    \ have them in a separate Java properties file.\n\nAt a minimum, it's best to\
    \ have several properties declared that can be used throughout your project, such\
    \ as:\n\n+   - src.dir\n  The root source code location\n- build.dir\n  Where\
    \ the built files should end up\n- lib.dir\n  Location of these dependencies\n\
    \nThroughout the rest of this book, you'll see these properties used in Ant tasks.\
    \ Be sure to define them appropriately in your project.\n\n# Buildr\n\nBuildr\
    \ (https://github.com/nzakas/buildr) is a project that seeks to collect common\
    \ frontend-related Ant tasks with easier syntax. A wide range of tools is available\
    \ for working with JavaScript files, but they work a bit differently. Buildr wraps\
    \ all of these different tools in tasks that can be used in your Ant scripts.\n\
    \nTo use Buildr, you must first get a copy of the source. Once you have the directory\
    \ structure on your computer, you can import all of the tasks with this command:\n\
    \n```\n<import file=\"path/to/buildr/buildr.xml\"/>\n```\n\nThis command allows\
    \ your build.xml file to make use of all the custom tasks defined in Buildr. The\
    \ following chapters show you both how to create Ant tasks from scratch as well\
    \ as how to use the Buildr tasks."
