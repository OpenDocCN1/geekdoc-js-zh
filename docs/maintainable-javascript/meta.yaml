  md: 'The guideline followed in this example is to add a blank line before each flow
    control statement, such as if and for. Doing so allows you to more easily read
    the statements. In general, it''s a good idea to also add blank lines:


    +   * Between methods

    * Between the local variables in a method and its first statement

    * Before a multiline or single-line comment

    * Between logical sections inside a method to improve readability


    None of the major style guides provides specific advice about blank lines, though
    Crockford''s Code Conventions does suggest using them judiciously.


    # Naming


    > >There are only two hard problems in Computer Science: cache invalidation and
    naming things."—Phil Karlton


    Most of the code you write involves variables and functions, so determining conventions
    for those variables and functions is quite important to a comprehensive understanding
    of the code. JavaScript''s core, ECMASScript, is written using a convention called
    camel case. Camel-case names begin with a lowercase letter and each segment begins
    with an uppercase letter. For example:


    ```

    var thisMyName;

    var anotherVariable;

    var aLongVariableName;

    ```


    Generally speaking, you should always use a naming convention that follows the
    language you''re using, so camel case is the way JavaScript developers name their
    variables and functions. The Google JavaScript Style Guide, the SproutCore Style
    Guide, and the Dojo Style Guide all use camel case in most situations.


    Even with the general naming convention of camel case in place, some more specific
    styles of naming are typically specified.


    ![](bbox=[0.142, 0.673, 0.228, 0.743])


    Another notation called Hungarian notation was popular for JavaScript around the
    year 2000. This notation involved prepending a variable identifier at the beginning
    of a name, such as sName for a string and iCount for an integer. This style has
    fallen out of favor and is not recommended by any of the major style guides.


    # Variables and Functions


    Variable names are always camel case and should begin with a noun. Beginning with
    a noun helps to differentiate variables from functions, which should begin with
    a verb. Here are some examples:'
