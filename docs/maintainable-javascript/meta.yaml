  md: "# CHAPTER 3\n\n# # Statements and Expressions\n\nStatements such as if and\
    \ for can be used in two ways in JavaScript, with curly braces for multiple contained\
    \ lines or without curly braces for one contained line. For example:\n\n```\n\
    // Bad, though technically valid JavaScript\nif(condition)\n    doSomething();\n\
    \n// Bad, though technically valid JavaScript\nif(condition)\n    doSomething();\n\
    \n// Good\nif (condition) {\n    doSomething();\n}\n\n// Bad, though technically\
    \ valid JavaScript\nif (condition) { doSomething(); }\n```\n\nThe first two forms,\
    \ which use an if statement without braces, are explicitly disallowed in Crockford's\
    \ Code Conventions, the jQuery Core Style Guide, the SproutCore Style Guide, and\
    \ the Dojo Style Guide. The omission of braces also generates warnings by default\
    \ in JSLint and JHint.\n\nAn overwhelming majority of JavaScript developers are\
    \ in agreement that block statements should always use braces and always occupy\
    \ multiple lines instead of one. This is because of the confusion created when\
    \ braces aren't included. Consider the following:\n\n```\nif (condition)\n   \
    \ doSomething();\nif (condition)Else();\n```\n\nIt's difficult to tell the author's\
    \ intent in code. Whether the error is an indentation error (the last line should\
    \ not be indented) or braces are missing because both line 2 and line 3 need to\
    \ be executed inside the if statement. Adding braces makes the error easier to\
    \ find. Here are two other examples with errors:"
