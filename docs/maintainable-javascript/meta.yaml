  md: "# Avoid Browser Inference\n\nSomewhere along the lines, a lot of web developers\
    \ grew confused about the distinction between user-agent detection and feature\
    \ detection. Code started being written similar to this:\n\n```\n// Bad\nif (document.all)\
    \ { // IE\n    id = document.uniqueID;\n} else {\n    id = Math.random();\n}\n\
    ```\n\nThe problem with this code is that test for document.all is used as an\
    \ implicit check for Internet Explorer. It's known that the browser is Internet\
    \ Explorer, the assumption that it's safe to use document.uniqueID, which is IE-specific.\
    \ However, all you tested was whether document.all is present, not whether the\
    \ browser is Internet Explorer. Just because document.all is present means document.uniqueID\
    \ is also available. There's a false implication that can cause the code to break.\n\
    \nAs a clear statement of the problem, developers started replacing code like\
    \ this:\n\n```\nvar isIE = navigator.userAgent.indexOf(\"IE\") > -1;\n```\n\n\
    With this code like:\n\n```\n// Bad\nvar isIE = !!document.all;\n```\n\nMaking\
    \ this creates a misunderstanding of \"don't use user-agent detection.\" Instead\
    \ of looking for a particular browser, you're looking for a feature and trying\
    \ to infer that it's a specific browser, which is just as. This is called browser\
    \ inference and is a very bad practice.\n\nSomewhere along the line, developers\
    \ realized document.all was not, in fact, the best way to determine whether a\
    \ browser was Internet Explorer. The previous code was replaced with specific\
    \ code, such as:\n\n```\n// Bad\nvar isIE = !!document.all && document.uniqueID;\n\
    ```\n\nThis approach falls into the “too clever” category of programming. You're\
    \ trying too hard to identify something by describing an increasing number of\
    \ aspects. What's worse is that there's nothing preventing other browsers from\
    \ implementing the same capabilities, which will ultimately make this code return\
    \ unreliable results.\n\nBrowser inference even made it into some JavaScript libraries.\
    \ The following snippet from MooTools 1.1.2:\n\n```\n// from MooTools 1.1.2\n\
    if (window.ActiveXObject)\n    window.ie = window[window.XMLHttpRequest ? 'ie7'\
    \ : 'ie6'] = true;\nelse if (document.childNodes && !document.all && navigator.taintedEnabled)\n\
    ```"
