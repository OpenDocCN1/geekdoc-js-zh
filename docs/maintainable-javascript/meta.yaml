    \n![](bbox=[0.137, 0.535, 0.228, 0.597])\n\n> A facade that implements a specific\
    \ interface to make one object look like it's another called an adapter. The only\
    \ difference between facades and adapters is that the former creates a new interface\
    \ and the latter implements an existing interface.\n\n# A Note on Polyfills\n\n\
    JavaScript polyfills (also known as shims) became popular when ECMAScript 5 and\
