  md: 'A job is a collection of build steps to execute. Click the “New Job” link to
    create your first job. The next page asks you to select which type of job you’d
    like to create. If you’re using Ant for your build system, then select “Build
    a free-style software project.” After creating the new job, you’re taken to a
    configuration page.


    There are some basic options on the configuration page, but the really interesting
    parts start later on the page, with the section called “Build Triggers. This is
    where you decide how frequently the build should run. It can be triggered after
    another build finishes, on a timed schedule, or based on check-ins to source control.
    For your primary integration build, you’ll probably want to kick off the build
    based on check-ins, so the last option works well. “Poll SCM” means that Jenkins
    will poll your source control system (as specified in the previous section). The
    poll format is the same as setting up a cron job on a Linux system, so @hourly
    works for checking source control each hour (see Figure 20-1).


    | Source Code Management |

    | CVS |

    | None |

    | Subversion |

    | Build Triggers |

    | Build after other projects are built |

    | Build periodically |

    | Poll SCM |

    | Schedule @hourly |


    Figure 20-1. Jenkins build triggers


    Next, you set up the job to execute one or more Ant targets. To do so, click the
    “Add Build Step” button to display a drop-down menu of options. Select “Invoke
    Ant.” A new build step appears in the page asking you to select the Ant targets
    to execute (see Figure 20-2).


    If you’re using Jenkins with source control, it will automatically find the build.xml
    file in your root directory, so you need only the Ant target name. If you’re setting
    up the integration build, for example, enter build.int into the text box as in
    Figure 20-3.


    If you’re not using a build.xml file in the project root, or not using Jenkins
    with source control, then click the “Advanced” button and you can specify the
    path to your build.xml file manually.'
