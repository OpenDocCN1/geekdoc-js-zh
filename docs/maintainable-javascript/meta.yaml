  md: "# Detecting Arrays\n\nPassing arrays back and forth between frames was one\
    \ of the original cross-frame issues in JavaScript. Developers quickly discovered\
    \ that instanceof Array didn't always produce results in these cases. As mentioned\
    \ previously, each frame has its own Array constructor, so an instance from one\
    \ frame wasn't recognized in another. Douglas Crockford first recommended performing\
    \ some duck typing, testing for the presence of the sort() method:\n\n```\n//\
    \ duck typing arrays\nfunction isArray(value) {\n  return typeof value.sort ===\
    \ \"function\";n}\n```\n\nThis detection relies on the fact that arrays are the\
    \ only object types with a sort() method. Of course, this version of isArray()\
    \ will return true when any object with a sort() method is passed in.\n\nThere\
    \ was quite a lot of investigation into accurately detecting array types in JavaScript;\
    \ ultimately, Juriy Zatsev (also known as Kangax) proposed an elegant solution\
    \ to this problem:\n\n```\nfunction isArray(value) {\n  return Object.prototype.toString.call(value)\
    \ === \"[object Array]\";\n}\n```\n\nKangax found that calling the native toString()\
    \ method on a given value produced a standard string in all browsers. For arrays,\
    \ the string is \"[object Array],\" and this worked regardless of the frame from\
    \ which the array originated. Kangax's approach quickly became popular and is\
    \ now implemented in most JavaScript libraries.\n\n![](bbox=[0.163, 0.573, 0.23,\
    \ 0.633])\n\nThis approach is generally useful for identifying objects as opposed\
    \ to developer-defined objects. For example, the native JSON object returns \"\
    [object JSON]\" using this technique.\n\nSince that time, ECMAScript 5 has introduced\
    \ Array.isArray() formally into JavaScript. The purpose of this method is to accurately\
    \ determine whether a value is an array. As with Kangax's function, Array.isArray()\
    \ works with values that are passed across frames, so many JavaScript libraries\
    \ now implement methods similar to this:\n\n```\nfunction isArray(value) {\n \
    \ if (typeof Array.isArray === \"function\") {\n    return Array.isArray(value);\n\
    \  } else {\n    return Object.prototype.toString.call(value) === \"[object Array]\"\
    ;\n  }\n}\n```\n\nThe Array.isArray() method is implemented in Internet Explorer\
    \ 9+, Firefox 4+, Safari 5+, Opera 10.5+, and Chrome."
