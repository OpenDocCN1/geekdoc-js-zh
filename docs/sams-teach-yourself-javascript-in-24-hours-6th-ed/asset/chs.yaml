  \n### 总结\n\n在本节中，你学习了如何使用 `jQuery` 以及使用 `jQuery UI` 库构建流畅的用户界面。你了解了如何快速为页面添加交互和组件，以及如何使用\
  \ `ThemeRoller` 应用为你的界面元素设置整体样式。\n\n### 问答\n\n**问：我可以进一步自定义这些界面元素吗？**\n\n**答：**\
  \ 是的，可以。由于本书空间有限，本节演示的每个交互和组件都使用了默认设置。实际上，每个组件都有一系列自定义选项，可以使其完全按照你的意愿工作。你可以在 http://docs.jquery.com/UI/\
  \ 找到广泛的文档和示例。\n\n**问：如何让我页面上的其他元素具有与 jQuery UI 生成的相同的样式？**\n\n**答：** 当 `jQuery UI`\
  \ 生成标记时，它会为新创建的标记项应用类。这些类对应于 `jQuery UI` CSS 框架中的 CSS 声明。每个组件的详细信息请参阅 `jQuery UI`\
  \ 文档。\n\n### 工作坊\n\n在阅读随后的“答案”之前，尝试回答所有问题。\n\n#### 测验\n\n**1。** 要要在页面中使用 `jQuery\
  \ UI`，每个页面必须包含：\n\n**a.** `jQuery` 和 `jQuery UI` JavaScript 库以及指向 `jQuery UI` 主题\
  \ CSS 文件的链接\n\n**b.** 仅包含 `jQuery` 和 `jQuery UI` 库\n\n**c.** 仅包含 `jQuery UI` JavaScript\
  \ 库以及指向 `jQuery UI` 主题 CSS 文件的链接\n\n**2。** 如何让一个 `id = \"parking\"` 的 `<div>` 元素能够接收掉在其上的项？\n\
  \n**a.** `$(\"#parking\").drop()`\n\n**b.** `$(\"#parking\").dropzone()`\n\n**c.**\
  \ `$(\"#parking\").droppable()`\n\n**3。** 手风琴组件能够显示：\n\n**a.** 一次显示一个内容区域\n\n**b.**\
  \ 一次显示定义数量的内容区域\n\n**c.** 一次显示所有内容区域\n\n#### 答案\n\n**1。** a. `jQuery` 和 `jQuery\
  \ UI` JavaScript 库以及指向 `jQuery UI` 主题 CSS 文件的链接\n\n**2。** c. `$(\"#parking\").droppable()`\n\
  \n**3。** a. 手风琴一次显示一个内容区域。\n\n#### 练习\n\n![Image](img/image00365.jpeg) 使用 `ThemeRoller`\
  \ 下载你喜的 `jQuery UI` 主题。使用它来复现本节的一些示例脚本，并将你的页面外观与图中所示的页面进行对比。\n\n![Image](img/image00365.jpeg)\
  \ 访问 `jQuery UI` 文档 [`docs.jquery.com/UI/`](http://docs.jquery.com/UI/)，研究某些组件如何通过选项进一步自定义，并尝试以本节的列表为起点尝试一些示例。\n\
  \n## 第 17 小节 jQuery 中的 Ajax\n\n* * *\n\n本节你将学习：\n\n![Image](img/image00365.jpeg)\
  \ 什么是 Ajax 以及它如何帮助用户体验\n\n![Image](img/image00365.jpeg) 如何在原生 JavaScript 中实现 Ajax\n\
  \n![Image](img/image00365.jpeg) 如何使用 `jQuery` 流畅简单地实现 Ajax\n\n* * *\n\nJavaScript\
  \ 是一种客户端脚本语言，你目前为止使用的所有示例都完全限于客户端编码。Ajax 允许你在后台与服务器通信，并在不刷新页面的情况下将结果显示在你的页面上。这让你能够创建与用户交互得更流畅的页面。\n\
  \n在本节中，你将学习支撑 Ajax 的技术基础，以及如何使用 `jQuery` 让整个过程变得流畅而简单。\n\n### Ajax 的剖析\n\n到目前为止，我们只讨论了网站用户界面的传统基于页的模型。\n\
  \n当你与此类网站交互时，包含文本、图像、数据输入表单等的单个页面会一个接一个呈现给你。在导航到下一个页面之前，必须单独处理每个页面。\n\n例如，你可能会完成表单的数据输入字段，根据需要反复编辑和重新编辑你的输入内容，而知道在表单最终提交之前，数据不会发送到服务器。\n\
  \n这种交互总结在 图 17.1 中。\n\n![Image](img/image00451.jpeg)\n\n**图 17.1** 传统的客户端-服务器交互\n\
  \n当你提交表单或跟随链接时，你必须等待浏览器刷新以显示服务器提供的新或修订页面。\n\n不幸的是，使用这种模型构建的界面有许多缺点。首先，在加载每个新或修订页面时会有明显的延迟。即使页面的大部分内容与之前的页面相同，每次都必须加载*整个*页面。此外，许多页面共有的项（如页眉、页脚和导航部分）占据了页面数据的很大比例。\n\
  \n这种不必要的数据下载浪费了带宽，并加剧了加载延迟。\n\n上述问题的共同影响是与大多数桌面应用程序提供的体验要糟糕得多。在桌面上，你期望程序的显示保持可见，界面元素继续响应你的命令，而计算过程在后台安静地进行。\n\
  \n#### Ajax\n\nAjax 允许你为 Web 应用程序添加桌面应用程序中常见的的功能。为了实现这一点，Ajax 在网页页和服务器之间建立了一个额外的“层”。\n\
  \n这一层通常被称为 Ajax 引擎或 Ajax 框架，它拦截用户的请求并在后台安静、无干扰且*异步*地处理服务器通信。这意味着服务器请求和响应不再需要与特定的用户动作同步，而可以在用户和应用程序正常运行所需的随时发生。\n\
  \n根据服务器收到的修订信息更新页面元素由 Ajax 负责，在页面继续使用的同时动态进行。\n\n图 17.2 表示了这些交互是如何发生的。\n\n![Image](img/image00452.jpeg)\n\
  \n**图 17.2** Ajax 客户端-服务器交互\n\n#### XMLHttpRequest 对象\n\n当你点击超链接或提交 HTML 表单时，你向服务器发送\
  \ HTTP 请求，服务器通过向你提供新或修订页面来响应。然而，为了让 Web 应用程序异步工作，你需要一种方法在不关联显示新页的情况下向服务器发送 HTTP\
  \ 请求。\n\n我们可以通过 `XMLHttpRequest` 对象来实现。这个 JavaScript 对象能够连接到服务器并发布 HTTP 请求，而不需要关联的页面加载。\n\
  \n* * *\n\n提示\n\n作为安全措施的一部分，`XMLHttpRequest` 对象通常只能调用与调用页面相同域内的 URL，不能直接调用远程服务器。\n\
  \n* * *\n\n#### 不同浏览器的不同规则\n\n\n\n\n由于你无法预知用户使用的是什么浏览器、版本或操作系统，你必须让你的代码动态调整其行为，以确保对象实例能够成功创建。\n\
  \n对于大多数支持 `XMLHttpRequest` 作为原生对象的浏览器（Firefox、Opera 以及其他浏览器，以及 Internet Explorer\
  \ 的后续版本），创建该对象的实例是非常直接的。以下代码创建了一个名为 `request` 的 `XMLHttpRequest` 对象：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar request = new XMLHttpRequest();\n```\n\n为了在较早版本的 Microsoft\
  \ Internet Explorer 中实现相同的结果，你需要创建一个 `ActiveX` 对象。例如所示：\n\n点击此处查看代码图片\n\n```javascript\n\
  var request = new ActiveXObject(\"Microsoft.XMLHTTP\");\n```\n\n再次，这为你的新对象分配了名称\
  \ `request`。\n\n为了让情况变得稍微复杂一点，某些较早版本的 Internet Explorer 安装了不同版本的 Microsoft XML 解析器；在这些情况下，你需要使用以下指令：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar request = new ActiveXObject(\"Msxml2.XMLHTTP\"\
  );\n```\n\n### 方法与属性\n\n现在你已经创建了 `XMLHttpRequest` 对象的实例，让我们参考表 17.1 来看对象的一些属性和方法。\n\
  \n![Image](img/image00453.jpeg)\n\n**表 17.1 XMLHttpRequest 对象和方法**\n\n在接下来的几节中，我们将研究如何使用这些方法和属性来创建构建\
  \ Ajax 应用的基础函数。\n\n### 与服务器通信\n\n在传统的网页样式中，当你通过超链接或表单提交服务器请求时，服务器接收该请求，执行任何所需的服务器端处理，随后向你提供一个包含与你操作相应内容的新页面。\n\
  \n在此处理期间，你的用户界面实际上是冻结的。只有当浏览器中出现新或修订后的页面时，你才知道服务器已完成任务。\n\n然而，通过异步服务器请求，此类通信是在后台进行的，且请求的完成并不一定与屏幕刷新或新页面的加载同步。因此，你必须其他安排来发现服务器在处理你的请求时取得了什么进展。\n\
  \n`XMLHttpRequest` 对象拥有一个方便的属性来报告服务器请求的进度。你可以使用 JavaScript 例程检查此属性，以确定服务器完成任务的时间，并供你使用结果。\n\
  \n因此，你的 Ajax 武器库必须包含一个例程来监控请求的状态并据此采取行动。我们将在本节的稍晚些时候详细讨论这一点。\n\n### 服务器端发生了什么？\n\
  \n对于服务器端脚本而言，来自你的 `XMLHttpRequest` 对象的通信只是另一个 HTTP 请求。Ajax 应用并不不在乎服务器上存在什么语言或运行环境；只要客户端\
  \ Ajax 层能够从服务器接收到及时且格式正确的 HTTP 响应，一切就能运行良好良好。\n\n### 处理服务器响应\n\n一旦收到请求已完成的通知，你就可以使用服务器返回的信息。\n\
  \n根据应用程序的性质，你可能随后对这些信息进行翻译、显示或其他处理。\n\n### 但有更简单的方法吗？\n\n幸运的是，市上有许多库可以让编写复杂的脚本变得更简单。\n\
  \n### 使用 jQuery 实现\n\n在本节的剩余时间里，你将看到 jQuery 如何让编写 Ajax 变得简单一点。\n\n#### get()\n\n\
  正如你可能意识到的那样，从零开始编写 Ajax 可能很繁琐。幸运的是，jQuery 为你解决了这个问题。\n\n当你想要从服务器获取数据时，可以使用 `get()`\
  \ 方法：\n\n点击此处查看代码图片\n\n```javascript\n$.get(\"server.php\", {\n    param1: \"value1\"\
  ,\n    param2: \"value2\"\n}, function(data) {\n    alert(\"Server responded: \"\
  \ + data);\n});\n```\n\n#### post()\n\n`post()` 的语法基本上是相同的。\n\n点击此处查看代码图片\n\n```javascript\n\
  $.post(\"server.php\", {\n    param1: \"value1\",\n    param2: \"value2\"\n}, function(data)\
  \ {\n    alert(\"Server responded: \" + data);\n});\n```\n\n#### load()\n\n如果你只是想将数据获取到元素中，`load()`\
  \ 可能足够。\n\n点击此处查看代码图片\n\n```javascript\n$(\"#element\").load(\"server.php\");\n\
  ```\n\n#### Ajax()\n\n这两个方法相似，只是使用了不同的请求类型。在大多数情况下，你可能希望使用 `POST` 向服务器发送数据。此类数据将以编码字符串的形式发送。\n\
  \n### 提示\n\n如果你从表单中收集数据，jQuery 提供了方便的 `serialize()` 方法来汇总数据：\n\n点击此处查看代码图片\n\n```javascript\n\
  var formdata = $('#form1').serialize();\n```\n\n#### ajax\n\n如果你想对返回的数据进行某些操作，可以传递回调函数作为参数。\n\
  \n为了获得最大的灵活性，`ajax()` 方法允许你设置 Ajax 用的每个方面以及处理响应的方式。有关 `ajax()` 的完整细节，请参见 [`api.jquery.com/jQuery.ajax/`](http://api.jquery.com/jQuery.ajax/)。\n\
  \n### 自己尝试：使用 jQuery 的 Ajax\n\n让我们用一个 jQuery 驱动的简单 Ajax 表单提交示例结束本节。\n\n我们将使用这个简单的\
  \ HTML 表单：\n\n点击此处查看代码图片\n\n```html\n<form id=\"form1\">\n    Name<input type=\"\
  text\" name=\"name\" id=\"name\"><br />\n    Email<input type=\"text\" name=\"email\"\
  \ id=\"email\"><br />\n    <input type=\"submit\" name=\"submit\" id=\"submit\"\
  \ value=\"Submit Form\">\n</form>\n```\n\n你将使用 jQuery 执行以下任务：\n\n- 检查两个输入字段是否都包含文本。\n\
  - 使用 HTTP `POST` 通过 Ajax 提交表单。\n- 将服务器返回的数据打印到页面上的 `div` 元素。\n\n为了检查两个字段是否都已输入数据，你使用一个简单的函数：\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```javascript\nfunction checkFields(){\n    return ($(\"\
  #name\").val() && $(\"#email\").val());\n}\n```\n\n为了让函数返回布尔值 `true`，两个表单字段的 `value`\
  \ 属性必须包含某些文本数据；如果其中任一字段为空，则空白字段将被解释为“虚假（falsy）”，且逻辑与（`&&`）运算符将导致函数返回 `false`。\n\n\
  接下来，应用 jQuery 的 `submit()` 事件处理程序来检测表单提交。如果你的函数 `checkFields()` 返回 `false`，则默认行为将被取消，表单将不会提交；否则，jQuery\
  \ 将数据序列化并向服务器脚本发送 `post()` 请求。jQuery 的 `serialize()` 方法用于将表单信息收集到一个序列化字符串中，并作为数据通过\
  \ Ajax 调用发送。对于此示例，服务器脚本 `test.php` 仅仅格式化它所收到的信息并将其作为一小段 HTML 发回之外，什么都不做：\n\n```php\n\
  <?php\necho \"Name: \" . $_REQUEST['name'] . \"<br />Email: \" . $_REQUEST['email'];\n\
  ?>\n```\n\n最后，回调函数在页面上显示返回的信息：\n\n```javascript\nfunction(data){\n    $(\"#div1\"\
  ).html(data);\n}\n```\n\n代码显示在列表 17.1](#part030.xhtml_ch17lis01)。\n\n## 列表 17.1\
  \ Ajax 表单\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Ajax\
  \ Form</title>\n    <script src=\"http://code.com/jquery-latest.min.js\"></script>\n\
  \    <script>\n        $(document).ready(function(){\n            function checkFields(){\n\
  \                return ($(\"#name\").val() && $(\"#email\").val());\n         \
  \   }\n            $(\"#form1\").submit(function(){\n                if(checkFields()){\n\
  \                    $.post(\n                        'test.php', $(\"#form1\").serialize(),\n\
  \                        function(data){\n                            $(\"#div1\"\
  ).html(data);\n                        }\n                    );\n             \
  \   } else {\n                    alert(\"Please fill in name and email fields!\"\
  );\n                }\n                return false;\n            });\n        });\n\
  \    </script>\n</head>\n<body>\n    <form id=\"form1\">\n        Name<input type=\"\
  text\" name=\"name\" id=\"name\"><br />\n        Email<input type=\"text\" name=\"\
  email\" id=\"email\"><br />\n        <input type=\"submit\" name=\"submit\" id=\"\
  submit\" value=\"Submit Form\">\n    </form>\n    <div id=\"div1\"></div>\n</body>\n\
  </html>\n```\n\n要运行此示例，您需要将列表 17.1](#part030.xhtml_ch17lis01) 列出的文件以及服务器文件 `test.php`\
  \ 上传到支持 PHP 的 Web 服务器上。\n\n尝试在留一个或两个输入字段为空的情况下提交表单将导致脚本发出警报消息并阻止表单提交。\n\n成功的表单提交将导致格式化后的数据显示在页面上，如图图\
  \ 17.3](#part030.xhtml_ch17fig03）所示。该图还显示了 Firebug Lite 显示的 Ajax 调用和响应的细节。\n\n图像\n\
  \n### 图 17.3 使用 jQuery 的 Ajax 表单\n\n### 总结\n在本小时中，你仔细学习了 Ajax 编程的基础知识，并学习了如何使用 jQuery\
  \ 库让整个过程变得更加流畅和简单。\n\n### 问答\nQ Ajax 是如何命名的？\nA. Ajax 是 Asynchronous JavaScript\
  \ And XML（异步 JavaScript 和 XML）的缩写。但在实践中，Ajax 绝不仅限于返回 XML 数据。\n\nQ 其他库实现了 Ajax 吗？\n\
  A. 有许多库和框架可以帮助你实现 Ajax，流行的包括 Dojo、MooTools 和 Prototype。\n\n#### 练习\n在阅读后续章节之前，尝试回答所有问题。\n\
  \n以下哪种操作将从 `examples.html` 获取 `id=source` 的元素并将其插入到 `id=target` 的页面中？\na. `$(\"\
  #target\").load(\"examples.html\")`\nb. `$(\"#source\").load(\"examples.html\")`\n\
  c. `$(source).load(\"examples.html\")`\n\n用于处理 Ajax 调用返回的数据的函数称为：\na. 匿名函数\nb. 回调函数\n\
  c. Ajax 请求\n\n`serialize()` 方法：\na. 将一组表单元素编码为字符串以便提交。\nb. 将一组表单元素编码为 JSON 对象。\n\
  c. 将一组表单元素编码为 JavaScript 数组。\n\n#### 答案\n1. a. `$(\"#target\").load(\"examples.html\"\
  )`\n2. b. 回调函数\n3. a. jQuery `serialize()` 方法将一组表单元素编码为字符串以便提交。\n\n#### 练习\n向你的服务器上传一个包含纯文本的\
  \ .txt 文件。创建一个 HTML 页面，使用 jQuery 的 `load()` 方法返回该文本并将其显示在页面上的一个 `<div>` 元素中。\n\n\
  修改本小时练习的代码，使得如果任一输入字段为空或包含少于四个字符的数据，则不允许表单提交。\n\n# 第 VI 部分：高级主题\n\n## 第 18 小节：读取和写入\
  \ Cookie\n\n在本小时中，你将学习：\n- 什么是 Cookie\n- 关于 Cookie 的属性\n- 如何设置和检索 Cookie\n- 关于 Cookie\
  \ 过期日期\n- 如何在单个 Cookie 中保存多个数据项\n- 删除 Cookie\n- 数据转义与反转义\n- Cookie 的局限性\n\n你之前所看到的\
  \ JavaScript 技术无法实现在不同页面之间传输信息。Cookie 提供了一种方便的方法，让你的网页能够在用户自己的计算机上存储和检索小部分信息，允许你的网站保存诸如用户偏好或访问日期等细节。\n\
  \n在本小时中，你将学习如何使用 JavaScript 创建、检索和删除 Cookie。\n\n### 什么是 Cookie？\n你用于加载网页到浏览器的 HTTP\
  \ 协议是一种所谓的无状态协议。这意味着一旦服务器将请求的页面交付给浏览器，就会认为事务已完成并不保留任何记忆。这使得在浏览会话期间（或会话之间）维持某些连续性变得困难，例如跟踪访问者已阅读或下载了哪些信息，或者其私有区域的登录状态。\n\
  \nCookie 是解决这个问题的方法；例如，你可以使用 Cookie 记住用户的最后访问，保存该用户的偏好列表，或者在继续购物时跟踪购物车物品。正确使用时，Cookie\
  \ 可以帮助改善用户在使用你的网站时的感知体验。\n\nCookie 本身是小信息字符串，可以由用户访问的网页存储在用户的计算机上，稍后由相同域名和路径的任何其他网页读取。Cookie\
  \ 被设置为在指定时间后过期。\n\n### 注意\n请注意许多用户不允许网站在他们的计算机上留下 Cookie，因此请确保你的网站不要依赖于它们。\n\n\n\
  \n\n[content]\n通常的原因是某些网站将 cookie 作为广告系统的一部分，利用它们跟踪用户的在线活动，以便选择合适的广告。最好说明你为什么要使用该\
  \ cookie 以及你将如何使用它。\n\n### Cookie 的局限性\n\n你的浏览器对可以存储的 cookie 数量可能有限制——通常为几百个或更多。通常，每个域名允许\
  \ 20 个 cookie。单个域名总共可以存储 `4KB` 的 cookie 信息。\n\n除了这些大小限制可能带来的潜在问题外，cookie 还会因为各种原因从硬盘中消失，例如\
  \ cookie 到期、用户清除了 cookie 信息或切换了浏览器。因此，切切不要使用 cookie 来存储关键数据，你的代码应该始终编写为能够处理无法获取预期的\
  \ cookie 的。\n\n### `document.cookie` 属性\n\nJavaScript 中的 cookie 通过使用 `document`\
  \ 对象的 `cookie` 属性进行存储和检索。\n\n每个 cookie 本质上是一个由名称和值对组成的文本字符串，如下所示：\n\n`username=sam`\n\
  \n当网页加载到你的浏览器时，浏览器会将该页面所有可用 cookie 汇成一个类似字符串的属性，可以通过 `document.cookie` 访问。在 `document.cookie`\
  \ 内部，各个 cookie 用分号分隔：\n\n点击此处查看代码图像\n\n`username=sam;location=USA;status=fullmember;`\n\
  \n### 提示\n我将 `document.cookie` 称为一种*类字符串*属性，因为它并不是真正的字符串——当你尝试提取 cookie 信息时，它的行为就像字符串一样，正如你在这一小时中看到的那样。\n\
  \n##数据的转义与反转义\n\ncookie 值可能不包含某些字符。这些不允许的字符包括分号、逗号以及空格和制表符等空白字符。在将数据存储到 cookie 之前，你需要对数据进行编码，使其能够被正确存储。\n\
  \n你可以使用 JavaScript 的 `escape()` 函数在存储之前对值进行编码，并在稍后使用相应的 `unescape()` 函数恢复原始 cookie\
  \ 值。\n\n`escape()` 函数将字符串中的任何非 ASCII 字符转换为其等效的两位或四位十六进制格式——因此空格会被转换为 `%20`，安培符号\
  \ (&) 会转换为 `%26`。\n\n例如，下面的代码段将写出变量 `str` 中保存的原始字符串，随后是应用 `escape()` 函数后的值：\n\n\
  点击此处查看代码图像\n\n```\nvar str = 'Here is a (short) piece of text.';\n\ndocument.write(str\
  \ + '<br />' + escape(str));\n```\n\n屏幕输出将是\n\n点击此处查看代码图像\n\n```\nHere is a (short)\
  \ piece of text.\nHere%20is%20a%20%28short%29%20piece%20of%20text.\n```\n\n注意，空格已被替换为\
  \ `%20`，左括号替换为 `%28`，右括号替换为 `%29`。\n\n除了 `*`、`@`、`-`、`_`、`+`、`,` 和 `/` 之外，所有特殊字符都经过编码。\n\
  \n### Cookie 的成分\n\n`document.cookie` 中的 cookie 信息看起来像是一个简单的键值对字符串，每个对的形式如下：\n\n\
  `name=value;`\n\n但实际上，每个 cookie 都关联有某些其他信息，下文章节进行了概述。\n\n### 注意\ncookie 的最终规范于 2011\
  \ 年作为 `RFC6265` 发布。你可以在 [`tools.ietf.org/html/rfc6265`](http://tools.ietf.org/html/rfc6265)\
  \ 阅读它。\n\n#### `cookieName` 和 `cookieValue`\n这些是 cookie 字符串中每个 `name=value` 对中可见的名称和值。\n\
  \n#### domain\n`domain` 属性告诉浏览器 cookie 属于哪个域名。此属性是可选的，当未指定时，其值默认为设置 cookie 的页面域名。\n\
  \n`domain` 属性的作用是控制跨子名的 cookie 操作。如果域名设置为 `www.example.com`，那么像 `code.example.com`\
  \ 等子域名上的页面无法读取该 cookie。然而，如果 `domain` 设置为 `example.com`，那么 `code.example.com` 中的页面将能够访问。\n\
  \n你不能将 `domain` 属性设置为包含你页面的之外任何域名。\n\n#### path\n`path` 属性允许你指定 cookie 可用的目录。如果你希望\
  \ cookie 仅针对目录 `documents` 下的页面设置，请将 path 设置为 `/documents`。`path` 属性是可选的，默认路径为 `/`，在这种情况下\
  \ cookie 对整个域名有效。\n\n#### secure\n可选且极少使用的 `secure` 标志表示浏览器在向服务器发送 cookie 时应使用 SSL\
  \ 安全性。\n\n#### expires\n每个 cookie 都有一个 `expires` 日期，期后 cookie 将被自动删除。`expires` 日期应该是\
  \ UTC 时间（格林威治标准时间，或 GMT）。如果未为 `expires` 设置值，cookie 的有效期将与当前浏览器会话一样，并在浏览器关闭时自动删除。\n\
  \n### 写入 Cookie\n要写入新 cookie，你只需为 `document.cookie` 分配一个包含所需属性的值：\n\n点击此处查看代码图像\n\
  \n```\ndocument.cookie = \"username=sam;expires=Wed, 21 Oct 2025 07:28:00 GMT;path=/\"\
  ;\n```\n\n为了避免手动设置日期，可以使用 JavaScript 的 `Date` 对象来实现：\n\n点击此处查看代码图像\n\n```javascript\n\
  var cookieDate = new Date(2013, 5, 15);\ndocument.cookie = \"username=sam;expires=\"\
  \ + cookieDate.toUTC();\n```\n\n产生的结果与之前的示例相同。\n\n### 提示\n注意使用 `cookieDate.toUTC()`\
  \ 而不是 `cookieDate.toString()`，因为 cookie 日期需要 UTC 时间。\n\n在实践中，你应该使用 `escape()` 以确保不允许的字符进入\
  \ cookie 值：\n\n点击此处查看代码图像\n\n```javascript\nvar user = \"Sam Jones\";\ndocument.cookie\
  \ = \"username=\" + escape(user) + \";expires=\" + cookieDate.toUTC();\n```\n\n\
  ### 写入 Cookie 的函数\n编写一个函数为你写入 cookie 非常简单，将转义和可选属性的处理留给函数。此类函数的代码出现在列表 18.1](#part0032.xhtml_ch18)。\n\
  \n**列表 18.1 写入 Cookie 的函数**\n\n点击此处查看代码图像\n\n```javascript\nfunction createCookie(name,\
  \ value, days, domain, secure) {\n  if (days) {\n    var date = new Date();\n  \
  \  date.setTime(date.getTime() + (days*24*60*60*1000));\n    var expires = date.toGMTString();\n\
  \  } else {\n    var expires = \"\";\n  }\n  var cookieString = name + \"=\" + escape(value);\n\
  \  if (expires) cookieString += \"; expires=\" + expires;\n  if (path) cookieString\
  \ += \"; path=\" + escape(path);\n  if (domain) cookieString += \"; domain=\" +\
  \ escape(domain);\n  if (secure) cookieString += \"; secure\";\n  document.cookie\
  \ = cookieString;\n}\n```\n\n函数的操作非常直观。`name` 和 `value` 参数被组造成一个 `name=value` 字符串，并对\
  \ `value` 部分进行转义以避免任何不允许字符带来的错误。\n\n不是向函数传递日期字符串，而是要求传递过期前的天数。函数随后处理将其转换为适当的日期字符串。\n\
  \n其余属性均为可选的，并且仅当它们作为参数存在时才会追加到字符串中。\n\n[/content]\n\n\n\n如果你尝试直接从本地机器将文件加载到浏览器，你的浏览器安全设置可能会阻止你在此小时内尝试这些示例。要看到这些示例运行，你可能需要将这些文件上传到\
  \ Internet 上的 Web 服务器或你本地局域网的其他地方。\n\n### 动手实践：写入 Cookie\n\n让我们使用此函数来设置某些 Cookie\
  \ 的值。我们简单页面的代码如列表 18.2 所示。创建一个名为 `testcookie.html` 的新文件，并按列表所示输入代码。你可以随地对存储在 Cookie\
  \ 中的键名和值对使用不同的值。\n\n**列表 18.2 写入 Cookie**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>Using Cookies</title>\n<script>\n    function createCookie(name,\
  \ value, days, path, domain, secure) {\n        if (days) {\n            var date\
  \ = new Date();\n            date.setTime(date.getTime() + (days*24*60*60*1000));\n\
  \            var expires = date.toGMTString();\n        }\n        else var expires\
  \ = \"\";\n        cookieString = name + \"=\" + escape (value);\n        if (expires)\
  \ cookieString += \"; expires=\" + expires;\n        if (path) cookieString += \"\
  ; path=\" + escape (path);\n        if (domain) cookieString += \"; domain=\" +\
  \ escape (domain);\n        if (secure) cookieString += \"; secure\";\n        document.cookie\
  \ = cookieString;\n    }\n    createCookie(\"username\",\"Sam Jones\", 5);\n   \
  \ createCookie(\"location\",\"USA\", 5);\n    createCookie(\"status\",\"fullmember\"\
  , 5);\n</script>\n</head>\n<body>\nCheck the cookies for this domain using your\
  \ browser tools.\n</body>\n</html>\n```\n\n将此 HTML 文件上传到 Internet 主机或你本地局域网上的 Web\
  \ 服务器（如果你有的话）。加载后的页面没有显示任何内容，只有一行文本：\n\n点击此处查看代码图像\n\n使用你的浏览器工具检查此域名的 Cookie。在 Chromium\
  \ 浏览器中，我可以使用 `Shift+Ctrl+I` 打开开发者工具——如果你使用的是不同的浏览器，请查看文档如何查看 Cookie 信息。我的结果显示在图\
  \ 18.1 中。\n\n![Image](img/image0045.jpeg)\n\n**图 18.1** 显示我们的 Cookie\n\n### 提示\n\
  注意，每次调用函数时，它都会为 `document.cookie` 设置新值，但这个值不会覆盖上一个值；而是将你的新 Cookie 添加到已存在的 Cookie\
  \ 值中。正如我所说，`document.cookie` 有时看起来像是一个字符串，但它实际上并不是。\n\n### 读取 Cookie\n\n读取 Cookie\
  \ 值的函数严重依赖于 JavaScript 的 `split()` 字符串方法，这是你在第 5 小节“数字与字符串”中学习过的。你可能记得 `split()`\
  \ 接收一个字符串并将其拆分为项目数组，使用指定的字符来确定字符串应该分割的位置：\n\n点击此处查看代码图像\n\n```javascript\nmyString\
  \ = \"John#Paul#George#Ringo\";\nvar myArray = myString.split('#');\n```\n\n前面的语句将字符串\
  \ `myString` 分割为系列独立的部分，在每个哈希 (#) 字符出现的地方切断字符串；`myArray[0]` 将包含“John”，`myArray[1]`\
  \ 将包含“Paul”，以此此类推。\n\n由于在 `document.cookie` 中各个 Cookie 是用分号字符分隔的，因此该字符最初用于拆分 `document.cookie`\
  \ 返回的字符串：\n\n点击此处查看代码图像\n\n```javascript\nvar crumbs = document.cookie.split(';');\n\
  ```\n\n你想搜索具有特定名称的 Cookie，因此接下来会在生成的数组 `crumbs` 中搜索任何具有适当 `name=` 部分的项目。\n\n`indexOf()`\
  \ 和 `substring()` 方法结合使用返回 Cookie 的值部分，然后函数在通过 `unescape()` 移除任何编码后返回该值部分：\n\n点击此处查看代码图像\n\
  \n```javascript\nfunction getCookie(name) {\n    var nameEquals = name + \"=\";\n\
  \    var crumbs = document.cookie.split(';');\n    for (var i = 0; i < crumbs.length;\
  \ i++) {\n        var crumb = crumbs[i];\n        if (crumb.indexOf(nameEquals)\
  \ == 0) {\n            return unescape(crumb.substring(nameEquals.length, crumb.length));\n\
  \        }\n    }\n    return null;\n}\n```\n\n### 删除 Cookie\n\n要删除 Cookie，只需要在浏览器推断\
  \ Cookie 已过期并将其删除之前，为它设置一个过期日期。\n\n```javascript\nfunction deleteCookie(name) {\n\
  \    createCookie(name,\"-1);\n}\n```\n\n### 注意\n某些版本的浏览器会保留 Cookie 直到你重启浏览器。如果你的程序依赖于删除操作，通过\
  \ `getCookie` 测试来确保它真的消失了。\n\n\n\n\n`cookietest.html` 中唯一的可见页面内容是指向第二个页面 `cookietest2.html`\
  \ 的链接。然而，`window.onload` 事件被页面上的代码捕获，并用于执行一个函数，在页面加载完成后立即启动 `prompt()` 对话框。该对话框要求输入一个要保存到\
  \ cookie 中的值，然后调用 `createCookie()` 设置一个名为 `myCookieData` 的 cookie，其值为你输入的内容。\n\n\
  `cookietest.html` 页面的工作情况如图图 18.2 所示。\n\n![Image](img/image00456.jpeg)\n\n**图 18.2**\
  \ 输入 cookie 值。\n\n设置 cookie 后，使用链接导航到 cookietest2.html。\n\n当此页面加载时，`window.onload`\
  \ 事件处理程序会执行一个函数，该函数使用 `getCookie()` 获取存储的 cookie 值并将其写入页面，如图图 18.3 所示。\n\n![Image](img/image00457.jpeg)\n\
  \n**图 18.3** 获取你的 cookie 值\n\n若要亲自尝试，你需要将文件 `cookietest.html`、`cookietest2.html`\
  \ 和 `cookies.js` 上传到互联网上的 Web 服务器（或者你本地网络上的服务器），因为浏览器安全机制可能会阻止你在使用 `file://` 协议查看本地电脑上的文件时设置\
  \ cookie。\n\n### 在单个 Cookie 中设置多个值\n\n每个 cookie 包含一个 `name=value` 对，因此如果你需要存储几段独立的数据（如用户的姓名、年龄和会员号），你需要三个不同的\
  \ cookie。\n\n然而，只要有一点技巧，你就可以将所需的值连接成单个字符串（该字符串将成为 cookie 存储的值），让你的 cookie 存储所有三个值。\n\
  \n这样，你就不需要为姓名、年龄和会员号准备三个独立的 cookie，而是只需要一个（可能命名为 `user`），其中包含这三条数据。为了以后分离这些详细信息，你可以在值字符串中放置一个称为*分隔符*（delimiter）的特殊字符来分隔不同的数据段：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar userdata = \"Sandy|26|A23679\";\n\ncreateCookie(\"\
  user\", userdata);\n```\n\n这里的 `|`（管道符）字符充当分隔符。当你之后检索 cookie 值时，可以使用 `|` 分隔符将其拆分为各个独立的变量值：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar myUser = getCookie(\"user\");\n\nvar myUserArray\
  \ = myUser.split('|');\n\nvar name = myUserArray[0];\n\nvar age = myUserArray[1];\n\
  \nvar memNo = myUserArray[2];\n```\n\n存储多个值的 cookie 占用了某些浏览器允许的每个域名 20 个 cookie\
  \ 的配额，但请记住，你对 cookie 的使用仍受 cookie 信息 4KB 总体限制。\n\n### 注意事项\n\n这是序列化的另一个示例，你之前在第\
  \ 10 小节的“**见见 JSON](#part0021.xhtml_ch10)”中学习过它。\n\n### 总结\n\n在本节中，你学习了 cookie，以及如何使用\
  \ JavaScript 来设置、检索和删除它们。你还学习了如何将多个值合并到单个 cookie 中。\n\n### 问答\n\n**问：在将多个值合并到单个\
  \ cookie 时，可以使用任何字符作为分隔符吗？**\n\n**答：你不能使用任何可能出现在你的转义数据中的字符（作为分隔符字符除外），也不能使用等号（`=`）或分号（`;`），因为这些字符用于在\
  \ `document.cookie` 中组合和拼接 `name=value` 对。此外，cookie 不得包含空格或逗号，因此它们自然不能用作分隔符。\n\n\
  **问：cookie 安全的吗？**\n\n**答：人们经常对 cookie 的安全性产生疑问，但这些担忧很大程度上是没有根据的。cookie*可以*帮助网站所有者和广告商跟踪你的浏览习惯，他们可以（并且确实）利用此类信息来在你访问的网页上显示广告和促销信息。然而，网站所有者和广告商无法仅仅通过使用\
  \ cookie 就获取你的个人信息或访问你硬盘上的其他项目。**\n\n### 工作坊\n\n在阅读随后的“答案”部分之前，尝试回答所有问题。\n\n####\
  \ 测验\n\n**1。** cookie 是存储在 ___ 的小文本信息\n\n**a.** 用户的硬盘上\n**b.** 在服务器上\n**c.** 在用户的互联网服务提供商处\n\
  \n**2。** 使用以下方法可以对字符串进行编码以安全地存储在 cookie 中\n\n**a.** `escape()`\n**b.** `unescape()`\n\
  **c.** `split()`\n\n**3。** 用于分隔单个 cookie 中多个值的字符被称为\n\n**a.** 转义序列\n**b.** 分隔符\n\
  **c.** 分号\n\n#### 答案\n\n**1。** cookie 是存储在用户的硬盘上。\n\n**2。** 使用 `escape()` 可以对字符串进行编码以安全地存储在\
  \ cookie 中。\n\n**3。** 分隔符。\n\n#### 练习\n\n![Image](img/image00456.jpeg) 在阅读后续列表 18.4”之前，为你的\
  \ cookie 输入一个值。\n\n![Image](img/image00457.jpeg) 使用浏览器工具查看 cookietest.html 和 cookietest2.html\
  \ 中设置的 cookie，并将它们分隔显示。\n\n![Image](img/image00456.jpeg) 使用井号（`#`）作为分隔符，在 cookietest2.html\
  \ 中删除 cookie。（提示：使用 `deleteCookie()`。）\n\n\n\n\n\n```javascript\nthis.make = Make;\n\
  this.odometerReading = Miles;\n\n}\n\nsetOdometer(newMiles) {\n    this.odometerReading\
  \ = newMiles;\n}\n}\n```\n\n这种语法还允许你扩展类，创建一个继承父类属性的新类。这里有一个示例：\n\n点击此处查看代码图片\n\n\
  ```javascript\nclass Sportscar extends Car {\n    constructor(Color, Year, Make,\
  \ Miles) {\n        super(Color, Year, Make, Miles);\n        this.doors = 2;\n\
  \    }\n}\n```\n\n在这里，我在构造函数使用了 `super` 关键字，这允许我调用父类的构造函数并继承它的所有属性。事实上，这仅仅是一种语法糖；所有使用类的代码都可以用函数和原型来重写，就像你在第\
  \ 8 小节中学习到的那样。然而，它与其他流行语言的兼容性更好，读起来也相对简单。\n\n### 箭头函数\n\n箭头函数（`=>`）是匿名函数的简写语法。\n\
  \n点击此处查看代码图片\n\n`param => statements or expression`\n\n让我们再详细解释一下：\n\n![Image](img/image00365.jpeg)\
  \ `param`——参数或多个参数的名称。如果函数没有参数，则需要用 `()` 标明。如果只有一个参数，则不需要括号。\n\n![Image](img/image00365.jpeg)\
  \ `statements or expression`——多个语句需要括在花括号中。然而，单个表达式不需要大括号。该表达式也是该函数的返回值。\n\n点击此处查看代码图片\n\
  \n```javascript\nvar overTen = x => x > 10 ? 10 : x;\n\noverTen(8); // 返回 8\n\n\
  overTen(12); // 返回 10\n```\n\n注意，不需要 `function` 关键字，而且由于只有一个参数，括号可以省略。下面的示例有两个参数：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar higher = (x, y) => {\n    if (x > y) {\n    \
  \    return x;\n    } else {\n        return y;\n    }\n}\n\nhigher(7, 9); // 返回\
  \ 9\n\nhigher(12, 3); // 返回 12\n```\n\n箭头函数不仅写起来更简单，它们还具有从宿主容器继承 `this` 值的特征。这在使用对象时非常有用。之前，我们需要将\
  \ `this` 赋值给变量以便将其传递给函数：\n\n点击此处查看代码图片\n\n```javascript\nfunction myObject() {\n\
  \  this.height = 13;\n  var self = this;\n  setTimeout(function fiveSecondsLater()\
  \ {\n    console.log(self.height);\n  }, 5000)\n}\n\nvar o = new myObject();\n```\n\
  \n在前面的示例中，我们不能简单地使用\n\n`console.log(this.height);`\n\n因为 `this` 将指向它的直接容器，在这里是 `fiveSecondsLater()`\
  \ 函数。然而，通过使用箭头函数，可以避免使用 `self` 这样的变量：\n\n点击此处查看代码图片\n\n```javascript\nfunction myObject()\
  \ {\n  this.height = 13;\n  setTimeout(() => {\n    console.log(this.height); //\
  \ 这里的 'this' 指向 myObject\n  }, 5000)\n}\n\nvar o = new myObject();\n```\n\n### 模块\n\
  \n随着 JavaScript 应用复杂性的增加，需要找到方法让在一个文件中声明的对象在其他文件中可用。通过这种方法，大型项目可以用模块化的方式编写。默认情况下，你在一个文件中声明的任何内容在文件外部都是不可用的。但在\
  \ ECMAScript 6 中，你可以使用 `export` 关键字让它可用。这里有一个导出类的示例：\n\n点击此处查看代码图片\n\n// 此代码出现在\
  \ file1.js 中\n```javascript\nexport default function Car(Color, Year, Miles) {\n\
  \  this.color = Color;\n  this.year = Year;\n  this.make = Make;\n  this.odometerReading\
  \ = Miles;\n  this.setOdometer(newMiles) {\n    this.odometerReading = newMiles;\n\
  \  }\n}\n```\n\n// 此对象可以被其他文件导入。在接收文件中：\n\n点击此处查看代码图片\n\n// 此代码出现在 file2.js 中\n\
  ```javascript\nimport Car from 'file1';\nvar ferrari = new Car('red', 1986, 'Dino',\
  \ 75000);\n```\n\n### 使用 let 和 const\n\n在 ECMAScript 6 之前，JavaScript 只有两种类型的作用域——即`函数作用域`和`全局作用域`。（变量的作用域，正如你在第\
  \ 8 小节中所学习的）。但在 ECMAScript 6 中，你可以使用 `export` 关键字来让它可用（注：此处原文文本似乎在描述处有断层或逻辑重复，我已根据你提供的文本内容进行完整翻译）。\n\
  \n抱歉，我理解了。你提供的待翻译文本在 `Using let and const` 之后似乎缺少了部分关于 `let` 和 `const` 的具体描述内容，我将严格按照你提供的最后一段话进行翻译。\n\
  \n（重新审视你提供的待翻译文本，最后一段是 `### Using let and const` 标题，后面没有正文了。我将翻译到该标题结束。）\n\n*修正：我发现你提供的原始文本在\
  \ `### Using let and const` 之后确实没有内容了。我将基于你提供的文本完成最终翻译。*\n\n[content]\n### Using\
  \ let and const\n\n\n\nJavaScript 有多种处理数组的方法，正如你在第 6 节中读到的“数组”。除了 `while` 和 `for`\
  \ 循环外，你还可以使用 `for-in`。遗憾的是，这个循环会访问数组的所有*命名属性*，而不仅仅是真正的数组*值*：\n\n点击此处查看代码图片\n\n```javascript\n\
  \"use strict\";\n\nlet arr1 = [ 6, 5, 7, 9 ];\n\narr1.greeting = \"hi\";\n\nfor\
  \ (var x in arr1) {\n    console.log(x); // logs \"0\", \"1\", \"2\", \"3\", \"\
  greeting\"\n}\n```\n\n为了解决这个问题，ECMAScript 6 引入了 `for-of` 结构，它只会迭代属性值：\n\n点击此处查看代码图片\n\
  \n```javascript\nfor (var y of arr1) {\n    console.log(y); // logs \"6\", \"5\"\
  , \"7\", \"9\"\n}\n```\n\n***\n\n### 注意事项\n\n注意前面的代码段中使用了指令 `\"use strict\"`。该指令在\
  \ ECMAScript 5 中引入，表示 JavaScript 应该在严格模式下执行，这是一组更严格的解释器规则，目前使用某些 ECMAScript 6 特性时是必要的。\n\
  \n### \n\n本节目前为止展示的示例对于测试 ECMAScript 6 特性很好，但在编写时，它们尚未准备好用于生产代码。访问你网站的人中很少有人使用带有强\
  \ ECMAScript 6 支持的浏览器。不过，你*可以*开始为未来做准备。\n\nTraceur 是 Google 的项目，旨在将 ECMAScript 6\
  \ 代码处理为与大多数使用默认设置浏览器兼容的 ECMAScript 5 代码。它不支持所有的 ECMAScript 6 特性，但新特性正在不断添加。\n\n\
  你可以在 [`code.google.com/p/traceur-compiler/wiki/GettingStarted`](https://code.google.com/p/traceur-compiler/wiki/GettingStarted)\
  \ 了解该项目，也可以在 [`github.com/google/traceur-compiler`](https://github.com/google/traceur-compiler)\
  \ 下载代码进行亲自尝试。\n\n### 总结\n\n在本节中，你学习了 ECMAScript 6 规范中 JavaScript 语言到来的一些重要新变化。\n\
  \n这些新的语言特性使 JavaScript 语法更符合其他流行语言，同时也让代码更加简洁且易于读。\n\n浏览器厂商已经开始将这些以及其他的 ECMAScript\
  \ 6 特性实现到他们的产品中，未来的浏览器版本无疑将支持更多的规范内容。\n\n### 问答\n\n**问：我如何跟进 ECMAScript 6 规范的进展？**\n\
  \n**答：可能最好的在线资源是官方 ECMAScript wiki（[`wiki.ecmascript.org/`](http://wiki.ecmascript.org/)））。**\n\
  \n**问：Ecma 是谁或什么？**\n\n**答：Ecma 是一个国际性的、基于成员制的非营利标准组织，最初称为欧洲计算机厂商协会（ECMA）。该组织成立于\
  \ 1961 年，旨在标准化整个欧洲的计算机系统。\n\n### 工作坊\n\n在阅读随后的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n\
  **1。** 声明为 `const` 的值：\n\n**a.** 之后可以重新赋值，但不能重新声明\n**b.** 之后可以重新声明，但不能重新赋值\n**c.**\
  \ 之后既不能重新声明，也不能重新赋值\n\n**2.** 你可以使用 `export` 关键字来\n\n**a.** 将你所有的程序数据保存到另一个文件中\n\
  **b.** 让你在一个文件中声明的内容在该文件外部可用\n**c.** 让你在另一个文件中声明的内容在当前文件内部可用\n\n**3.** 下列哪一个是将摄氏度转换为华氏温度的正确箭头函数？\n\
  \n**a.** `var fahr = cent => cent * 1.8 + 32;`\n**b.** `var fahr => cent = cent\
  \ * 1.8 + 32;`\n**c.** `function fahr = cent => cent * 1.8 + 32;`\n\n#### 答案\n\n\
  **1.** c. `const` 之后既不能重新声明，也不能重新赋值。\n**2.** b. 让你在一个文件中声明的内容在该文件外部可用\n**3.** a.\
  \ `var fahr = cent => cent * 1.8 + 32;`\n\n#### 练习\n\n![Image](img/image00365.jpeg)\
  \ 使用上述的在线资源之一，检查你当前的浏览器支持多少 ECMAScript6 特性。查看官方 Ecma wiki 以获取本节未讨论的特性。\n\n## 20.\
  \ 使用框架\n\n***\n\n### 本节你将学到：\n\n![Image](img/image00365.jpeg) 什么是框架，以及它们为什么用\n![Image](img/image00365.jpeg)\
  \ 关于模型-视图-控制器 (MVC) 架构\n![Image](img/image00365.jpeg) 如何开始使用 AngularJS\n![Image](img/image00365.jpeg)\
  \ 其他框架的细节\n\n***\n\n如果你已经编写过许多应用程序，可能你一直在反复解决相同的编码问题。减少这种重复的一种技巧之一是使用*框架*。在本节中，你将学习一种名为\
  \ MVC 的流行风格，并学习如何使用 AngularJS 实现这样的框架。\n\n### 框架\n\n框架的目的是提高你编写应用程序的效率，同时为你的应用程序增加一致性、质量健壮性。选择良好的合适的框架可以让你留出更多时间关注应用程序的需求，而不是花费大量时间在基础设施上。\n\
  \n#### 为什么要使用框架？\n\n框架帮助你*复用已经构建并测试过的代码*，提高应用程序的可靠性并减少创建所需的编码和测试工作。框架实施的结构还可以鼓励良好的编程实践。最后，框架通常为你提供了扩展功能的手段，使其更符合你应用程序的需求。\n\
  \n#### 框架不同于库\n\n很多人将软件框架术语与第五部分讨论的库混淆。然而，框架和库之间存在本质区别；当你使用库时，库中的对象和方法已经存在，等待你的自定义应用程序调用。你需要知道在代码中采用哪些对象和方法来创建你的应用程序。\n\
  \n当你使用框架时，是你来设计并编写应用程序使用的对象和方法。框架提供了一个你可以在此工作的一致结构。\n\n### 模型-视图-控制器 (MVC) 架构\n\n\
  模型-视图-控制器 (MVC) 架构的概念相当简单：将我们的应用程序分成单元，每个单元符合以下部分之一。\n\n#### 模型\n\n模型代表应用程序处理业务数据和业务逻辑的部分。模型可以是单个对象，也可以是由各种对象组成的结构。\n\
  \n#### 视图\n\n视图是模型的表示形式，用于呈现信息。它通常只显示模型中包含的某些方面，而抑制其他方面。\n\n\n\n\n视图（View）通过查询模型（Model）来获取展示所需的数据。它也可以通过发送适当的命令改变模型中的数据。此类查询和命令都必须在模型定义的语义范围内。\n\
  \n#### 控制器 (Controllers)\n\n控制器建立了用户与应用程序之间的链接，负责视图在屏幕上的显示，或通过提供菜单、输入字段、按钮或其他页面元素读取用户输入。控制器在将用户输入传递给一个或多个视图之前对其解释。\n\
  \nMVC 框架中各个部分的操作如图图 20.1 所示。\n\n![Image](img/image00463.jpeg)\n\n**图 20.1** 模型-视图-控制器框架交互\n\
  \n* *\n\n### 现实世界示例\n\n看电视可以类比 MVC 框架。\n\n广播机构提供各种频道，每个频道包含不同的数据；这些频道可以被视为 MVC 系统的\
  \ `models`。\n\n`view` 由电视屏幕提供。\n\n你可以通过使用遥控器`controller`的功能与电视进行交互。\n\n* *\n\n###\
  \ 在 Web 应用中使用 MVC 框架\n\nMVC 架构非常适用于 Web 应用程序。\n\n![Image](img/image00365.jpeg) **Model**——页面内容存储在支撑应用程序的模型中。技术细节可能有所不同——文本和图像可能存储在数据库中、服务器文件或其他方式中——但内容以及它们如何组合在一起的规则被编码到框架的模型部分。\n\
  \n![Image](img/image00365.jpeg) **View**——HTML 和 CSS 为内容添加了一个或多个视觉显示层——即我们为 Web\
  \ 应用程序赋予特定外观和样式而施加的装饰。我们可以在完全不改变存储在（模型）中的原始内容的情况下，更改内容的显示方式。\n\n![Image](img/image00365.jpeg)\
  \ **Controller**——控制器元素由与页面交互元素相关的程序代码组成，例如表单字段、按钮和链接。此类代码解释用户输入并与模型和视图进行通信。\n\n\
  ### AngularJS 框架\n\nAngularJS 是由 Google 开发的 MVC 框架，允许你构建结构良好、易于测试和维护的 JavaScript\
  \ Web 应用程序。它旨在帮助你生成强大、可靠的单页 Web 应用。\n\n#### AngularJS 概述\n\nAngularJS 是一个 MVC 框架，它将你的\
  \ HTML 代码（对应于 MVC 范式中的 `views` 部分）与 JavaScript 对象（MVC 中的 `models` 部分）绑定。\n\n在一个方向上，对模型的任何更改都会自动更新页面。相反情况也是如此——例如，与文本字段关联的模型在字段内容发生更改时也会进行更新。同样，视图的任何更改（例如用户在字段中输入信息或点击按钮）都会对相应的模型（或多个模型）进行必要的更改。\n\
  \n在后台，AngularJS 处理所有逻辑，因此你不需要编写代码来更新页面的 HTML 代码，或监听并处理用户事件。\n\n#### 在页面中引入 AngularJS\n\
  \n要使用 AngularJS，你必须将其包含在页面中。也许最简单的方法是通过 Google 的 CDN：\n\n点击此处查看代码插图\n\n```\n<script\
  \ src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js\"></script>\n\
  ```\n\n#### 使用 ng- 指令扩展 HTML\n\nAngularJS 使用了许多指令（directives），帮助你将页面的 HTML 元素与 MVC\
  \ 架构中的模型关联起来。这些指令都以 `ng-` 开头，并可以添加到任何元素上。\n\n任何页面中必须包含的关键属性是 `ng-app`，它定义了一个 AngularJS\
  \ 。你需要将其应用到包含带有 `ng-` 指令的其余页面元素的元素。你可以将其应用于页面的 `<body>` 元素（使整个页面成为应用程序的一部分），或包含应用程序的\
  \ `<div>` 元素：\n\n```html\n<body ng-app>\n```\n\nAngularJS 在页面加载时找到此元素，并处理它在其子元素上看到的所有\
  \ `ng-` 指令。\n\n另外两个重要的 `ng-` 指令是 `ng-model` 和 `ng-bind`。\n\n`ng-model` 指令将 HTML\
  \ 控制（如输入字段、选择框、文本区域等）的值与存储在模型中的应用程序数据连接。\n\n`ng-bind` 指令将 MVC 模型中的这些应用程序数据绑定到 HTML\
  \ 视图中的元素上。\n\n一个简单的示例如代码段列表 20.1 所示。\n\n**列表 20.1 一个简单的 AngularJS 示例**\n\n点击此处查看代码插图\n\
  \n* *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>AngularJS Example</title>\n\
  <style>\n #output {\n  font: 28px bold helvetica, arial, sans-serif;\n  color: red;\n\
  \ }\n</style>\n<script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js\"\
  ></script>\n</head>\n<body ng-app>\n  <p>Name: <input type=\"text\" ng-model=\"\
  name\"></p>\n  <span id=\"output\" ng-bind=\"name\"></span\n</body>\n</html>\n```\n\
  \n* *\n\nAngularJS 在页面加载时找到此元素，并处理它在其子元素上看到的所有 `ng-` 指令。\n\n另外两个重要的 `ng-` 指令是 `ng-model`\
  \ 和 `ng-bind`。\n\n`ng-model` 指令将 HTML 控制（如输入字段、选择框、文本区域等）的值与存储在模型中的应用程序数据连接。\n\n\
  `ng-bind` 指令将 MVC 模型中的这些应用程序数据绑定到 HTML 视图中的元素上。\n\n（等待，提供的文本下方重复了章节）\n\n该应用程序——尽管简单——已经因为\
  \ AngularJS 的设计而运行了。\n\n#### 作用域 (Scopes)\n\n作用域是将 DOM 元素（MVC 架构中的 `view` 部分）链接到器的的对象；在\
  \ MVC 术语中，此对象变为 `model`。\n\n控制器和视图都可以访问作用域，因此它可以用于它们之间的通信。此作用域对象将存放要使用的数据和方法。\n\n\
  所有的 AngularJS 应用程序都有 `$rootScope`。`$rootScope` 是顶层作用域，属于包含 `ng-app` 指令的 DOM 元素。\n\
  \n当应用程序没有显式作用域时，这就是 AngularJS 使用的作用域。\n\n为了更好地理解作用域的工作原理，让我们为特定的 DOM 元素附加一个控制器，为该元素创建一个作用域。\n\
  \n#### 指令 (Directives)\n\n你在上一个示例中看到了几个指令。在 AngularJS 中，`directive` 是附加到 DOM 元素上的函数，具有运行方法、附加控制器和作用域对象以及操作\
  \ DOM 的能力。\n\n当 AngularJS 应用程序启动且 Angular 开始遍历 DOM 时（从带有 `ng-app` 的元素开始），它将解析代码收集并运行这些指令。\n\
  \n指令处理了使 AngularJS 应用程序动态化的所有工作。我们之前见过示例指令，包括 `ng-model` 和 `ng-bind`：\n\n```html\n\
  <body ng-app>\n  <p>Name: <input type=\"text\" ng-model=\"name\"></p>\n  <span id=\"\
  output\" ng-bind=\"name\"></span\n</body>\n```\n\nAngularJS 内置了许多默认指令，我们接下来将查看其中一些。\n\
  \n##### 表达式 (Expressions)\n\n使用双大括号包围表达式指令：\n\n`{{ expression }}`\n\n\n\n\n\nAngularJS\
  \ 表达式与 JavaScript 表达式非常相似，它们都可以包含字面量、操作符和变量。以下都是有效的 AngularJS 表达式：\n\n点击此处查看代码图片\n\
  \n```\n{{ 3 + 9 }}\n```\n\n```\n{{ quantity * cost }}\n```\n\n```\n{{ firstName\
  \ + \" \" + lastName }}\n```\n\nAngularJS 表达式在编写该表达式的精确位置被解释为数据。\n\n### ng-init\n\
  `ng-init` 指令在启动时运行，在 AngularJS 运行任何应用代码之前。通过它，你可以在运行其他函数之前设置默认变量。\n\n### ng-click\n\
  `ng-click` 指令在 DOM 元素上附加一个监听器。当元素被点击时，AngularJS 会执行指令中定义的表达式。\n\n### ng-repeat\n\
  `ng-repeat` 指令会遍历集合并为每个项目加载模板。它复制的模板是具有 `ng-repeat` 属性的元素。\n\n```javascript\n$scope.departments\
  \ = [\n  { name: 'Sales'},\n  { name: 'Support'},\n  { name: 'Production'},\n  {\
  \ name: 'Shipping'}\n];\n```\n\n你可以使用 `ng-repeat` 遍历它们：\n\n点击此处查看代码图片\n\n```html\n\
  <<ul>\n  <li ng-repeat=\"dept in departments\">{{ dept.name }}</li>\n</ul>\n```\n\
  \n在这里，`<<li>` 元素将被复制四次，生成发送到视图的列表。\n\n### 过滤器 (Filters)\n过滤器的作用是从数组中选择项目的子集并将其作为新数组返回。以下是你可能对数组执行的一些操作：\n\
  \n![Image](img/image00365.jpeg) 使用 `currency` 将数字格式化为货币格式。\n\n![Image](img/image00365.jpeg)\
  \ 使用 `filter` 从数组中选择项目的子集。\n\n![Image](img/image00365.jpeg) 使用 `lowercase` 将字符串格式化为小写。\n\
  \n![Image](img/image00365.jpeg) 使用 `orderBy` 根据表达式对数组进行排序。\n\n![Image](img/image00365.jpeg)\
  \ 使用 `uppercase` 将字符串格式化为大写。\n\n以下是 AngularJS 中过滤器的通用语法：\n\n点击此处查看代码图片\n\n```javascript\n\
  {{ filter_expression | filter : expression : comparator }}\n```\n\n假设你想对某些数值数据应用货币过滤器：\n\
  \n点击此处查看代码图片\n\n```html\n<div ng-app>\n  Total: <input type=\"number\" ng-model=\"\
  netTotal\">\n  Tax: <input type=\"number\" ng-model=\"tax\">\n  <p>Invoice Total\
  \ = {{ (netTotal + tax) | currency }}</p>\n</div>\n```\n\n在这个示例中，表达式 `{{ netTotal\
  \ + tax }}` 将被求值，结果将被格式化为货币。\n\n### 为指令添加过滤器\n还可以通过使用管道字符 (`|`) 后跟过滤器描述，将过滤器添加到任何\
  \ `ng-` 指令中：\n\n点击此处查看代码图片\n\n```html\n<ul>\n  <li ng-repeat=\"dept in departments\
  \ | filter: uppercase\">{{ dept.name }}</li>\n</ul>\n```\n\n此示例将以大写形式显示所有列表项。\n\n\
  ### 构建 AngularJS 应用\n你现在已经有了足够的知识来组合一个基础的 AngularJS 应用。\n\n***\n\n#### 尝试一下：一个基础\
  \ AngularJS 应用\n我们将从一个基础 HTML 页面开始，其中包含一个文本输入字段用于接收用户的搜索字符串，以及一个 `<div>` 元素用于包含包含字符串的结果列表。\n\
  \n列表 20.2 显示了页面的基础 HTML，并已包含了 AngularJS 框架。\n\n**列表 20.2 AngularJS 应用的 HTML 代码**\n\
  \n点击此处查看代码图片\n\n***\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS\
  \ Example</title>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js\"\
  ></script>\n</head>\n<body>\n    <p>Search Departments: <input type=\"text\"></p>\n\
  \    <div id=\"list-container\">\n        <ul>\n            <li></li>\n        </ul>\n\
  \    </div>\n</body>\n</html>\n```\n\n***\n\n接下来，我们将对页面应用必要的 `ng-` 指令：\n\n![Image](img/image00412.jpeg)\
  \ 在 `<body>` 元素上应用 `ng-app` 指令，将其定义为 AngularJS 应用的容器。\n\n![Image](img/image00412.jpeg)\
  \ 给搜索字段应用 `ng-model` 指令，将其定义为我们 MVC 中的模型。\n\n![Image](img/image00412.jpeg) 在我们搜索结果列表中的\
  \ `<li>` 元素上应用 `ng-repeat` 指令。`<li>` 元素将为每个结果重复一次。\n\n我们还将使用 `ng-init` 指令来设置一些初始数据。在现实情况下，这些数据更有可能从外部源（如服务器端数据库）获取，但它将适用于我们的示例。\n\
  \n点击此处查看代码图片\n\n```javascript\nng-init = \"departments = [\n  { name: 'Sales'},\n\
  \  { name: 'Support'},\n  { name: 'Production'},\n  { name: 'Service'},\n  { name:\
  \ 'Administration'},\n  { name: 'Accounting'},\n  { name: 'Shipping'}]\"\n```\n\n\
  我们的初始数据包含一个虚构部门数组，每个部门都包含部门名称和负责该部门的员工名称。\n\n列表 20.3 显示了修改后的 HTML，为了美观还包含了一些样式。\n\
  \n**列表 20.3 应用的修改后代码**\n\n点击此处查看代码图片\n\n***\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <title>AngularJS Example</title>\n    <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.3.14/angular.min.js\"\
  ></script>\n</head>\n<body>\n    <p>Search Departments: <input type=\"text\"></p>\n\
  \    <div id=\"list-container\">\n        <ul>\n            <li></li>\n        </ul>\n\
  \    </div>\n</body>\n</html>\n```\n\n***\n\n将此代码保存为 `.html` 文件并在浏览器中打开。你应该能看到类似图\
  \ 20.3\n\n**图 20.3** 已就绪的 AngularJS 应用\n\n一切良好，但搜索字段目前没有任何作用。我们将通过通过在 `ng-repeat`\
  \ 指令上添加过滤器（基于搜索字段中输入的内容）修复修复，如[列表 20.4](#part0034.xhtml_ch20lis04）所示。\n\n**列表 20.4\
  \ 最终版 AngularJS 应用**\n\n\n\n\n\n```javascript\n[\n  { name: 'Support', contact:\
  \ 'Dave Price'},\n  { name: 'Production', contact: 'Grant Wales'},\n  { name: 'Service',\
  \ contact: 'Sherry Dell'},\n  { name: 'Administration', contact: 'Sally Bennett'},\n\
  \  { name: 'Accounting', contact: 'Kim Sutherland'},\n  { name: 'Shipping', contact:\
  \ 'Sandy Connell'}\n]\n</div></div>\n<div id=\"list-container\">\n  <ul>\n    <li\
  \ ng-repeat=\"dept in departments | filter: searchString\">{{ dept.name + \" (\"\
  \ + dept.contact + \")\" }}</li>\n  </ul>\n</div>\n\n</body>\n</html>\n```\n\n*\
  \ * *\n\n到此，这就是我们需要做的全部工作了！AngularJS 处理了数据绑定，因此 `filter` 会在用户打字时实时生效（参见图 20.4）。\n\
  \n![Image](img/image00466.jpeg)\n\n**图 20.4** 过滤器指令在打字时起作用\n\n* * *\n\n### 总结\n\n\
  在本小时中，你学习了模型-视图-控制器（MVC）框架架构的基础知识，以及如何将其有效地应用于 Web 应用程序。\n\n你介绍了 Google 的 AngularJS\
  \ 框架，并使用它用少量或没有额外代码构建了一个简单的 Web 应用程序。\n\n事实上，我们仅仅触及了 AngularJS 能力的边缘。请访问官方网站 [`angularjs.org/`](https://angularjs.org/)\
  \ 了解更多。\n\n### 问答\n\n**Q. AngularJS 的背景是什么？**\n\n**A.** AngularJS 由一家名为 Brat Tech\
  \ LLC 的公司于 2009 年开发，作为商业 JSON 存储服务的一部分。它后来作为开源库发布，由 Google 员工继续进行维护和支持。\n\n**Q.\
  \ 我可以在哪里获取 AngularJS 的文档和帮助？**\n\n**A.** 官方网站 [`angularjs.org/`](https://angularjs.org/)\
  \ 提供了详尽文档、教程、开发者指南等更多内容的链接。\n\n### 工作坊\n\n在阅读随后的“[答案”章节之前，请尝试回答所有问题。\n\n#### 测验\n\
  \n**1.** 在 MVC 框架中 M 代表什么？\n\n**a.** Mirror（镜像）\n\n**b.** Managed（托管）\n\n**c.**\
  \ Model（模型）\n\n**2.** 在 AngularJS 应用程序中，添加了 `ng-` 指令：\n\n**a.** 添加到文档头部（head）\n\n\
  **b.** 添加到页面元素\n\n**c.** 在到到文档的独立文件中\n\n**3.** `ng-init` 指令在何时运行：\n\n**a.** 在应用程序启动时，在\
  \ AngularJS 应用程序代码之前\n\n**b.** 当用户调用时\n\n**c.** 在应用程序终止后运行\n\n#### 答案\n\n**1.**\
  \ c. Model\n\n**2.** b. 添加到页面元素\n\n**3.** a. 在应用程序启动时，在 AngularJS 应用程序代码之前\n\n####\
  \ 练习\n\n![Image](img/image00365.jpeg) 修改“[自己尝试一下”示例的代码，仅在部门名称内进行搜索，但在显示的列表中仍报告部门名称和联系人名称。\n\
  \n![Image](img/image00365.jpeg) 查看 [`docs.angularjs.org/api`](https://docs.angularjs.org/api)\
  \ 中的 AngularJS API 文档，发现你使用 AngularJS 还能做更多。\n\n## 第 21 小时：网页之外的 JavaScript\n\n\
  * * *\n\n你在此小时将学到：\n\n![Image](img/image00365.jpeg) JavaScript 在简单 Web 页面之外的一些应用示例\n\
  \n![Image](img/image00365.jpeg) 如何为 Google Chrome 编写浏览器扩展\n\n* * *\n\n到为止，你已经学习了\
  \ JavaScript 在编写 Web 页面中的广泛用途。然而，JavaScript 也可以通过构建插件和扩展来扩展浏览器。此外，除了 浏览器之外，JavaScript\
  \ 解释器还嵌入在许多工具中。此类应用程序通常提供它们自己的表示宿主环境的对象模型，尽管 JavaScript 语言核心在每个实例中可能本质上是相同的。\n\n\
  在本小时中，你学习了编写简单 Web 内容之外的 JavaScript 用途。你还为 Google 的 Chrome 浏览器编写了自己的扩展。\n\n### 浏览器外的\
  \ JavaScript\n\n除了 Web 页面，JavaScript 控制其他应用程序操作的应用许多：\n\n![Image](img/image00365.jpeg)\
  \ Google Chrome、Opera 和 Apple Safari 5 浏览器的浏览器扩展，以及 Apple Dashboard、Microsoft、Yahoo!\
  \ 和 Google Desktop 的小部件/工具集，都可以使用 JavaScript 编写。\n\n![Image](img/image00365.jpeg)\
  \ JavaScript 支持在\n\n### 编写 Google Chrome 扩展\n\n扩展是运行在浏览器内部的小型应用程序，提供额外的服务，与第三方网站集成，并定制用户体验。\n\
  \n#### 构建一个简单的扩展\n\n第一步是在你的计算机上创建一个文件夹以包含代码。\n\n每个扩展都有一个名为 `manifest.json` 的清单文件，它以\
  \ JSON 格式格式并提供重要信息。\n\n清单文件可以包含各种参数，但我们从一个基础示例开始。在你新文件夹中创建一个名为 `manifest.json` 的文本文件并对其进行编辑：\n\
  \n```json\n{\n  \"name\": \"My First Extension\",\n  \"version\": \"1.0\",\n  \"\
  manifest_version\": 2,\n  \"description\": \"Hello World extension.\",\n  \"browser_action\"\
  : {\n    \"default_icon\": \"icon.png\",\n    \"default_popup\": \"popup.html\"\n\
  \  },\n  \"web_accessible_resources\": [\n    \"icon.png\",\n    \"popup.js\"\n\
  \  ]\n}\n```\n\n在同一文件夹中放入名为 `icon.png` 的图标——我使用了一个小的星形图形图像，但你可以使用任何你。创建列表 21.1 列出的\
  \ `popup.html` 文件并将其放入文件夹中。\n\n\n\n\n\n```html\n<style>\n    body {\n        width:\
  \ 350px;\n    }\n    div {\n        border: 1px solid black;\n        padding: 20px;\n\
  \        font: 20px normal helvetica, verdana, sans-serif;\n    }\n</style>\n<script\
  \ src=\"popup.js\"></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n***\n\n\
  以下是包含在 `popup.js` 中的 JavaScript 代码：\n\n```javascript\nfunction sayHello() {\n  \
  \  var message = document.createTextNode(\"Hello World!\");\n    var out = document.createElement(\"\
  div\");\n    out.appendChild(message);\n    document.body.appendChild(out);\n}\n\
  window.onload = sayHello;\n```\n\n所有这些代码的作用是，在页面加载时，创建一个包含消息“Hello World!”的 `<div>`\
  \ 元素，并将其添加到 DOM 的 `<body>` 元素中。\n\n现在，点击设置图标并选择 `更多工具 > 扩展程序` 来显示 Chrome 扩展页面。\n\
  \n点击“开发者模式”旁边的复选框以显示更多信息。\n\n然后点击“加载未解的扩展程序”按钮。导航到包含你的扩展程序的文件夹并选择它。你应该能看到图 21.1\
  \ 所示。\n\n![图像](img/image00467.jpeg)\n\n**图 21.1** 在扩展程序页面显示的新扩展程序\n\n检查其旁边的复选框以确保扩展程序已启用。现在你可以点击工具栏上的图标来运行你的扩展程序，如图\
  \ 21.2 所示。\n\n![图像](img/image00468.jpeg)\n\n**图 21.2** 作为 Google Chrome 扩展程序的 Hello\
  \ World\n\n### 调试扩展程序\n\n右键点击启动扩展程序的图标，你会看到一个内容菜单，其中包含启用和禁用扩展程序的选项，以及一个名为`检查弹出窗口`的选项。点击它，Chrome\
  \ 开发者工具就会打开，让你检查弹出窗口，如图 21.3 所示。\n\n![图像](img/image00469.jpeg)\n\n**图 21.3** 检查弹出窗口\n\
  \n***\n\n### 动手尝试一下：一个获取机场信息的 Chrome 扩展程序\n\n这次你将创建一个更有用的 Chrome 扩展程序。在 jQuery 库的帮助下，你的弹出窗口将检索有关美国机场的当前信息。\n\
  \n***\n\n### 提示\n\n如果你需要复习 jQuery 库，请参考第 15 小，“深入了解 jQuery](#part0028.xhtml_ch15)”。\n\
  \n***\n\n为了实现这一点，你将让你的代码对 `http://services.faa.gov/` 的信息源进行 Ajax 调用。为了演示该服务的工作原理，请打开浏览器并导航到\
  \ `http://services.faa.gov/airport/status/SFO?format=application/json`。\n\n`SFO`\
  \ 是旧金国际机场的三字母代码；你可以将上述 URL 中的该代码替换为另一个美国机场的代码；例如，你可以使用 LAX 代表洛杉矶国际机场，或使用 SEA 代表西雅图-塔科马国际机场。\n\
  \n***\n\n### 提示\n\n你可以在 `http://www.fly.faa.gov/flyfaa/usmap.jsp` 读取机场代码并查看它们的位置。\n\
  \n***\n\n`format` 参数告诉服务你希望返回的信息格式为 JSON 字符串：\n\n点击此处查看代码图像\n\n```json\n{\n  \"\
  name\":\"San Francisco International\",\n  \"ICAO\":\"KSFO\",\n  \"state\":\"California\"\
  ,\n  \"status\": {\n    \"avgDelay\":\"\",\n    \"closureEnd\":\"\",\n    \"closureBegin\"\
  :\"\",\n    \"type\":\"\",\n    \"minDelay\":\"\",\n    \"trend\":\"\",\n    \"\
  reason\":\"No known delays for this airport.\",\n    \"maxDelay\":\"\",\n    \"\
  endTime\":\"\"\n  },\n  \"delay\":\"false\",\n  \"IATA\":\"SFO\",\n  \"city\":\"\
  San Francisco\",\n  \"weather\": {\n    \"weather\":\"Partly Cloudy\",\n    \"meta\"\
  : {\n      \"credit\":\"NOAA's National Weather Service\",\n      \"url\":\"http://weather.gov/\"\
  ,\n      \"updated\":\"1:56 AM Local\"\n    },\n    \"wind\":\"Southwest at 9.2mph\"\
  ,\n    \"temp\":\"44.0 F (6.7 C)\",\n    \"visibility\":\"10.00\"\n}\n```\n\n你的代码将解析返回的这些信息并使用它们构建更易于用户的显示。\n\
  \n要开始此项目，在你的计算机某处创建一个新目录并将其命名为“airport”。在此目录中，你需要像之前的示例一样三个文件。\n\n#### 图标文件\n\n\
  选择一个图标显示在你的 Chrome 工具栏上，并从它启动扩展程序。我使用了一个名为 `plane.png` 的文件中的 20 × 20 像素飞机图标，但你可以使用你手头有的任何图标。\n\
  \n#### manifest.json 文件\n\n清单文件与上一个示例非常相似，但有一个显著的添加：一个新参数 `permissions`。你将要对 `services.faa.gov`\
  \ 发起 Ajax 调用以获取你所需的信息，而 Ajax 调用只能对与调用者相同域的页面进行；添加 `permissions` 条目允许 Chrome 通过向服务器发送合适的标头来满足这一要求。`manifest.json`\
  \ 文件如列表 21.2 所示。\n\n**列表 21.2 manifest.json 文件**\n\n点击此处查看代码图像\n\n***\n\n```json\n\
  {\n  \"name\": \"Airport Information\",\n  \"version\": \"1.0\",\n  \"manifest_version\"\
  : 2,\n  \"description\": \"Information on airports\",\n  \"browser_action\": {\n\
  \    \"default_icon\": \"plane.png\",\n    \"default_popup\": \"popup.html\"\n \
  \ },\n  \"web_resources\": [\n    \"plane.png\",\n    \"popup.js\"\n  ],\n  \"permissions\"\
  : [\n    \"http://services.faa.gov/\"\n  ]\n}\n```\n\n***\n\n#### HTML 文件\n\n主 HTML\
  \ 文件将是 `popup.html`。只要你相应修改了 `manifest.json`，你可以将其命名为其他名称。\n\n简单的 HTML 如列表 21.3\
  \ 所示。\n\n**列表 21.3 基础 HTML**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <title>Airport Information</title>\n    <style>\n        body {\n  \
  \          width: 350px;\n            font: 20px normal arial, sans-serif;\n   \
  \     }\n        #info {\n            border: 1px solid black;\n            padding:\
  \ 10px;\n        }\n    </style>\n</head>\n<body>\n    <h2>Airport Information</h2>\n\
  \    <input type=\"airportCode\" value=\"SFO\" size=\"6\" />\n    <input id=\"btn\"\
  \ type=\"button\" value=\"Get Information\" />\n    <div id=\"info\"></div>\n</body>\n\
  </html>\n```\n\n***\n\n除了一些 CSS 样式外，页面只包含几个项目：一个接受机场代码的输入字段（值为 SFO），一个请求数据的按钮，以及一个存放结果的\
  \ `<div>`。\n\n现在你需要向页面添加 JavaScript。\n\n你将使用 jQuery 来简化操作，因此首先你需要包含它。Google Chrome\
  \ 安全策略不允许使用内容分网络，因此我们需要下载并包含 jQuery 库的副本：\n\n```html\n<script src=\"jquery-1.11.2.min.js\"\
  ></script>\n```\n\n当页面完全加载后，你需要为“获取信息”按钮附加代码。按钮需要根据输入字段中输入的机场代码组装所需的 URL 并启动 Ajax\
  \ 调用。由于远程服务可能需要一些时间响应，如果用户能收到一条小消息来指示程序正在运行将更好。\n\n以下是执行这些任务的代码：\n\n```javascript\n\
  $(document).ready(function(){\n    $(\"#btn\").click(function(){\n        $(\"#info\"\
  ).html(\"Getting information ...\");\n        var code = $(\"#airportCode\").val();\n\
  \        $.get(\"http://services.faa.gov/airport/status/\" + code + \"?format=application/json\"\
  ,\n            '',\n            function(data){\n                displayData(data);\n\
  \            }\n        );\n    });\n});\n```\n\n一旦页面加载，jQuery 会为按钮的 `onclick` 事件处理程序添加代码。\n\
  \n\n\n\n\n首先，它使用 `jQuery` 的 `html()` 方法向输出 `<div>` 元素添加一条用户消息。当接收到“真实”信息时，该消息将被覆盖。\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#info\").html(\"Getting information ...\");\n\
  ```\n\n接下来，从输入字段中获取所需的机场代码：\n\n点击此处查看代码图片\n\n```javascript\nvar code = $(\"#airportCode\"\
  ).val();\n```\n\n然后组装 Ajax 调用，这里使用了 `GET` 方法：\n\n点击此处查看代码图片\n\n```javascript\n$.get(\"\
  http://services.faa.gov/airport/status/\" + code + \"?format=application/json\"\
  ,\n    '',\n    function(data){\n        displayData(data);\n    }\n);\n```\n\n\
  为 Ajax 调用指定的回调函数是 `displayData()`，它将对返回的数据进行格式化并显示给用户。以下是 `popup.js` 的完整内容，包括回调函数：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction displayData(data) {\n    var message = \"\
  Airport: \" + data.name + \"<br />\";\n    message += \"<h3>STATUS:</h3>\";\n  \
  \  for (i in data.status) {\n        if(data.status[i] != \"\") message += i + \"\
  : \" + data.status[i] + \"<br />\";\n    }\n    message += \"<h3>WEATHER:</h3>\"\
  ;\n    for (i in data.weather) {\n        if(i != \"meta\") message += i + \": \"\
  \ + data.weather[i] + \"<br />\";\n    }\n    $(\"#info\").html(message);\n}\n\n\
  $(document).ready(function(){\n    $(\"#btn\").click(function(){\n        $(\"#info\"\
  ).html(\"Getting information ...\");\n        var code = $(\"#airportCode\").val();\n\
  \        $.get(\"http://services.faa.gov/airport/status/\" + code + \"?format=application/json\"\
  ,\n            '',\n            function(data){\n                displayData(data);\n\
  \            }\n        );\n    });\n});\n```\n\n回想第 10 小中的“介绍 JSON”，JSON 数据可以直接被解释为\
  \ JavaScript 对象的层次结构。`displayData(data)` 函数获取返回的 JSON 对象数据，并提取 `data.name`（字符串）、`data.status`\
  \ 和 `data.weather`（本身也是对象）来构造消息。\n\n***\n\n### 提示\n\n回看几页前远程服务器返回的 JSON 数据，看看这些值是如何编码的。\n\
  \n***\n\n包含代码的完整 HTML 页面位于列表 21.4。\n\n**列表 21.4 扩展程序完整的 popup.html**\n\n点击此处查看代码图片\n\
  \n***\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n    <title>Airport Information</title>\n\
  \    <style>\n        body {\n            width:350px;\n            font: 12px normal\
  \ arial, verdana, sans-serif;\n        }\n        #info {\n            border: 1px\
  \ solid black;\n            padding: 10px;\n        }\n    </style>\n    <script\
  \ src=\"jquery-1.11.2.min.js\" /></script>\n    <script src=\"popup.js\"></script>\n\
  </head>\n<body>\n    <h2>Airport Information</h2>\n    <input type=Text id=\"airportCode\"\
  \ value=\"SFO\" size=\"6\" />\n    <input id=\"btn\" type=\"button\" value=\"Get\
  \ Information\" />\n    <div id=\"info\"></</div>\n</body>\n</html>\n```\n\n***\n\
  \n在分配的目录中组好所需文件后，你可以按照上一个示例的方法将扩展程序添加到 Google Chrome 中。\n\n点击关联图标会弹出一个小型表单，可以在其中输入选择的机场代码。点击“Get\
  \ Information”按钮将导致程序咨询远程服务，将返回的信息组建成可读的形式，并在弹出窗口中展示。\n\n图 21.4 显示了扩展程序的运行状态。\n\n\
  ![Image](img/image00470)\n\n\n\n\n\n在本书目前为止，我提到了编码中的某些优点和坏处。在这一小时中，我们将汇总所有这些内容，为良好的编码实践制定一些通用指南。\n\
  \n## 不要过度使用 JavaScript\n\n你到底需要多少 JavaScript？人们往往倾向于在并不严格或建议的情况下加入 JavaScript 代码和增强型交互。\n\
  \n![Image](img/image00365.jpeg) 重要的是记住，你的用户可能大部分的上网时间都花在了你网站以外的其他站点上。丰富的互联网用户习惯了流行的界面组件，如菜单、面包屑导航和标签页浏览。这些元素之所以流行，通常是因为它们运行良好、可以做得很美观，而且不需要用户先阅读手册。对一个网站操作的熟悉程度，是否比你那些完全新颖、酷炫的设计带来的潜在收益更能提高用户的生产力？\n\
  \n![Image](img/image00365.jpeg) 许多需要用 JavaScript 编写的视觉效果，现在可以使用 CSS 完美地实现。在两种方法可行的情况下（鼠标悬停和某些类型的菜单立刻跳出脑海），CSS\
  \ 通常是更好的选择。它在各个浏览器中得到了良好的支持（尽管存在一些差异），而且不像 JavaScript 那样经常被用户禁用。在 CSS 不支持的极少数情况下，页面将渲染为标准的\
  \ HTML，通常会留下一个至少功能完的页面，即使它看起来并不漂亮。\n\n![Image](img/image00365.jpeg) 世界许多地区的用户仍在使用过时、性能不足的旧电脑，并且可能拥有缓慢和/或不可靠的互联网访问。你那些必要的代码所占用的\
  \ CPU 周期对他们来说可能是宝贵的。\n\n![Image](img/image00365.jpeg) 在某些情况下，你可能会损失一些搜索引擎页面排名，因为它们的爬虫并不总是能正确索引由\
  \ JavaScript 生成的内容，或需要它来进行导航的设计。\n\n如果使用得且经过深思熟虑，JavaScript 可以是一个非常强大的工具，但有时“物过犹及”。\n\
  \n### 编写易读且易于维护的代码\n\n无法预知某一天会有谁需要阅读并理解你的代码。即使那个人是你，中间也可能穿插了几年和许多项目；在编写时你觉得如此熟悉的代码，在随后的时间里可能会变得神秘。如果其他人必须解释你的代码，他们可能并不认同你的编码风格、命名规范或专业领域，而且你可能也无法为他们提供帮助。\n\
  \n### 明智地使用注释\n\n在代码的关键位置选择恰当的注释可以在这种情况下产生天壤之别。注释是你为后来者提供的笔记和提示。诀窍在于判断哪些注释可能是有用的。这个主题经常引发争议，观点分歧很大，因此以下内容在很大程度上是我个人的观点。\n\
  \n可以合理地假设最终阅读你代码的人对 JavaScript 有了解，因此对语言本身如何工作的方式进行注释就有点过头了；JavaScript 开发者的风格和能力可能差异很大，但我们共同拥有的一点是语言语法！\n\
  \n阅读代码时，更难解释的是代码运行背后的思维过程和算法。个人认为，在阅读他人编写的代码时，发现看到这些非常有帮助：\n\n![Image](img/image00365.jpeg)\
  \ 任何包含超过几行简单代码的对象或函数的序言。\n\n点击此处查看代码图像\n\n```javascript\nfunction calculateGroundAngle(x1,\
  \ y1, z1, x2, y2, z2) {\n    /**\n     * 计算两点之间的直线与\n     * 地面相交的弧度。\n     * @author\
  \ Phil Ballard phil@www.example.com\n     */\n    if(x1 > 0) {\n        .... more\
  \ statements\n    }\n```\n\n![Image](img/image00365.jpeg) 在代码否则会产生困惑或容易被误解的地方添加内联注释。\n\
  \n点击此处查看代码图像\n\n```javascript\n// 出于性能考虑需要使用我们的自定义排序方法\nvar finalArray = rapidSort(allNodes,\
  \ byAngle) {\n    .... more statements\n}\n```\n\n![Image](img/image00365.jpeg)\
  \ 在原作者可以传递读者可能不知道的专业知识的地方添加注释。\n\n点击此处查看代码图像\n\n```javascript\n// 针对浏览器 X 版本 Y 中图像加载\
  \ bug 的变通方案\nif(!loaded(image1)) {\n    .... more statements\n}\n```\n\n![Image](img/image00365.jpeg)\
  \ 常用代码修改的说明。\n\n点击此处查看代码图像\n\n```javascript\n// 你可以根据喜更改以下维度：\nvar height = 400px;\n\
  var width = 600px;\n```\n\n**提示**\n各种方案使用代码注释来帮助你为软件生成文档。例如，参见 http://code.com/p/。\n\
  \n### 选择有用的文件、属性和方法名\n\n通过使代码自注释，可以大大减少源码中所需的注释量。你可以通过为方法和属性选择有意义的名字来向这一目标迈进。\n\n\
  JavaScript 对方法（函数）和属性（变量）名称中允许的字符有规定，但仍有很多创作空间。\n\n流行的习惯是将常量命名为大写：\n\n```javascript\n\
  MONTHS_PER_YEAR = 12;\n```\n\n对于普通的函数、方法和变量，驼峰命名法（CamelCase）是一个选项；由多个单词构造：\n\n```javascript\n\
  var memberSurname = \"Smith\";\nvar lastProcessed = 16;\n```\n\n建议实例化对象的构造函数首字母大写：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction Car(make, model, color) {\n    .... statements\n\
  }\n```\n\n大写提醒了需要使用 `new` 关键字：\n\n点击此处查看代码图像\n\n```javascript\nvar herbie = new\
  \ Car('VW', 'Beetle', 'white');\n```\n\n### 尽可能复用代码\n\n通常情况下，代码越模块化越好。看看这个函数：\n\n\
  点击此处查看代码图像\n\n```javascript\nfunction getElementArea() {\n    var high = document.getElementById(\"\
  id1\").style.height;\n    var wide = document.getElementById(\"id1\").style.width;\n\
  \    return high * wide;\n}\n```\n\n该函数尝试返回特定 HTML 元素的面积。遗憾的是，它只能对 `id=\"id1\"`\
  \ 的元素起，这实际上没有任何帮助。\n\n通过将要应用的元素 ID 作为参数传递，我们可以赋予函数更高层次的抽象，使其使用更通用：\n\n点击此处查看代码图像\n\
  \n```javascript\nfunction getElementArea(elementId) {\n    var elem = document.getElementById(elementId);\n\
  \    var high = elem.style.height;\n    var wide = elem.style.width;\n    return\
  \ parseInt(high) * parseInt(wide);\n}\n```\n\n你现在可以为任何具有 ID 的元素调用你的函数：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar area1 = getElementArea(\"id1\");\nvar area2 = getElementArea(\"\
  id2\");\n```\n\n### 不要假设\n\n当我们在向一个函数传递一个与页面上任何元素对应的 `elementId` 值时，会发生什么？函数会导致错误并停止代码执行。\n\
  \n\n\n\n\n错误在于假设传递的 `elementId` 是一个允许的值。让我们来修改 `getElementArea()` 函数，以检查页面元素是否确实存在，并且它具有数值面积：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction getElementArea(elementId) {\n    if(document.getElementById(elementId))\
  \ {\n        var elem = document.getElementById(elementId);\n        var high =\
  \ elem.style.height;\n        var wide = elem.style.width;\n        var area = parseInt(high)\
  \ * parseInt(wide);\n        if(!isNaN(area)) {\n            return area;\n    \
  \    } else {\n            return false;\n        }\n    } else {\n        return\
  \ false;\n    }\n}\n```\n\n这是一个改进。现在，如果函数无法返回数值面积，它将返回 `false`，可能是因为找不到相关的页面元素，也因为该\
  \ ID 对应的元素没有可访问的 `width` 和 `height` 属性。\n\n### 优雅降级 (Graceful Degradation)\n\n早期的网络浏览器中，有些甚至不支持在\
  \ HTML 中包含图像。当引入 `<img>` 元素时，需要一种方法让这些纯文本浏览器在遇到此类不支持的标签时，能够向用户展示一些有用的内容。\n\n对于 `<img>`\
  \ 标签，这种功能是由 `alt`（备用文本）属性提供的。Web 设计师可以为 `alt` 分配一段文本字符串，纯文本浏览器将向用户显示这段文本，而不是显示图像。根据页面设计者的意愿，`alt`\
  \ 文本可能仅仅是图片的标题、对图片本应显示内容的描述，或者是对图形中承载信息的替代来源的建议。\n\n这是“优雅降级”的早期示例。通过这种过程，如果用户的浏览器缺乏充分利用网页设计所需的某些功能——或者禁用了这些功能——用户仍然可以尽可能地从网站内容中获益。\n\
  \n让我们以 JavaScript 本身作为另一个例子。几乎每个浏览器都支持 JavaScript，而且很少用户会关闭它。那么你真的需要担心那些没有启用 JavaScript\
  \ 的访客吗？答案可能是肯定的。你网站的频繁访问者之一无疑是来自某个搜索引擎的爬虫程序，它们正忙于索引 Web 页面。爬虫会尝试遵循你页面上的所有导航链接，以建立你网站内容的完整索引；如果此类导航需要\
  \ JavaScript 的服务，你可能会发现网站的某些部分没有被索引。结果是你的搜索排名可能会受到影响。\n\n另一个重要的例子在于可访问性（accessibility）领域。无论浏览器程序多么强大，总有一些用户受到其他限制的痛苦，例如可能无法使用鼠标，或者必须使用屏幕阅读软件。如果你的网站不照顾这些用户，他们就不可能回来。\n\
  \n### 渐进式增强 (Progressive Enhancement)\n\n当我们谈论优雅降级时，很容易想象一个功能完备、带有各种华丽功能的网页，为浏览器能力较弱的用户提供慈善式的援助。\n\
  \n渐进式增强的支持者倾向于从相反的方向来看问题。他们赞于构建一个稳定、可访问且功能完备的网站，其内容可以被几乎任何想象中的用户和浏览器访问，随后他们可以为那些能够利用这些功能的用户添加额外的可用性层。\n\
  \n这确保了网站即使对于最基础的浏览器设置也能运行，而更高级的浏览器只需获得一些额外的增强。\n\n#### 分离样式、内容和代码\n\n采用渐进式增强技术的网页的核心资源是内容。HTML\
  \ 提供了标记设施，允许你以语义化的方式描述内容；标记本身将页面元素标识为标题、表格、段落等。我们可以将其称为语义层。\n\n这种语义层理想情况下*不应*包含任何关于页面应该如何显示的信息。你之后可以使用\
  \ CSS 技术添加这些额外信息，形成表现层。通过将外部 CSS 样式链接到文档中，你避免了任何外观相关的信息出现在 HTML 标记本身中。然而，即使是不理解\
  \ CSS 的浏览器，仍然可以访问并显示页的所有信息，尽管它看起来可能并不那么漂亮。\n\n当你现在把 JavaScript 加入进来时，你是将其作为另一个概念层引入的——你可能可以将其视为行为层。没有\
  \ JavaScript 的用户仍然可以通过语义标记访问页面内容；如果他们的浏览器理解 CSS，他们也将受益于表现层增强后的外观。如果行为层的 JavaScript\
  \ 应用得当，它将为那些可以使用它的人提供更多功能，而不会损害任何人的体验。\n\n### 非侵入式 JavaScript (Unobtrusive JavaScript)\n\
  \n非侵入式 JavaScript 没有正式的定义，但构建其基础的概念都涉及维护行为层与内容及表现层之间的分离。\n\n#### 别动你的 HTML\n\n第一个考虑或许可能也是最重要的考虑是将\
  \ JavaScript 从 HTML 中移除。JavaScript 的早期应用会将内联事件处理器弄乱 HTML，例如此示例中的 `onClick` 事件处理器：\n\
  \n点击此处查看代码图片\n\n```html\n<input type=\"button\" style=\"border: 1px solid blue;color:\
  \ white\" onclick=\"doSomething()\" />\n```\n\n内联样式属性（如上一个示例所示）可能会让情况变得糟糕。坦地说，你可以有效地将样式信息移到样式层，例如通过在\
  \ HTML 标签上添加 `class` 属性来引用关联样式：\n\n点击此处查看代码图片\n\n```html\n<input type=\"button\"\
  \ class=\"blueButtons\" onclick=\"doSomething()\" />\n```\n\n在关联的 CSS 定义中：\n\n```css\n\
  .blueButtons {\n    border: 1px solid blue;\n    color: white;\n}\n```\n\n**提示**：你当然可以通过任何不同的选择器为按钮定义样式规则，包括\
  \ `input` 元素或通过 `id`。\n\n为了让你的 JavaScript 是非侵入式的，你可以采用与我们为 CSS 使用的类似的技术。通过在 HTML\
  \ 标记中的页面元素上添加 `id` 属性，你可以从外部 JavaScript 代码中附加所需的 `onClick` 事件监听器，完全将其移出 HTML 标记。这是修改后的\
  \ HTML 元素：\n\n点击此处查看代码图片\n\n```html\n<input type=\"button\" class=\"blueButtons\"\
  \ id=\"btn1\" />\n```\n\n`onClick` 事件处理器从你的 JavaScript 代码中附加：\n\n点击此处查看代码图片\n\n\
  ```javascript\nfunction doSomething() {\n    // ....语句 ....\n}\ndocument.getElementById(\"\
  btn1\").onclick = doSomething;\n```\n\n**注意**：记住，在 DOM 可用之前无法使用 DOM 方法，因此任何此类代码必须通过\
  \ `window.onload` 等方法附加，以确保 DOM 的可用性。本书中有很多例子。\n\n#### 仅将 JavaScript 作为增强\n\n根据渐进式增强的精神，你希望网页在禁用了\
  \ JavaScript 的情况下也能运行。JavaScript 为页面增加的任何改进都应被视为那些浏览器设置允许用户的额外奖励。\n\n\n\n\n让我们假设你想要写一些表单验证代码——这是\
  \ JavaScript 的常见用途。这是一个简单的 HTML 搜索表单：\n\n点击此处查看代码图片\n\n```html\n<form action=\"\
  process.php\">\n\n<input id=\"searchTerm\" name=\"term\" type=\"text\" /><br />\n\
  \n<input type=\"button\" id=\"btn1\" value=\"Search\" />\n\n</form>\n```\n\n你想写一个例程，在搜索字段为空时防止表单提交。你可能会编写这个\
  \ `checkform()` 函数，它将绑定到搜索按钮的 `onClick` 处理器上：\n\n点击此处查看代码图片\n\n```javascript\nfunction\
  \ checkform() {\n    if(document.forms[0].term.value == \"\") {\n        alert(\"\
  Please enter a search term.\");\n        return false;\n    } else {\n        document.forms[0].submit();\n\
  \    }\n}\n\nwindow.onload = function() {\n    document.getElementById(\"btn1\"\
  ).onclick = checkform;\n}\n```\n\n这运行起来应该很好。但如果 JavaScript 被禁用了会发生什么？现在按钮什么都不做，用户无法提交表单。你的用户肯定更倾向于让表单可以使用，即使没有输入检查的增强。\n\
  \n让我们稍微修改表单，使用 `type=\"submit\"` 的输入按钮而不是 `type=\"button\"`，并编辑 `checkform()` 函数：\n\
  \n点击此处查看代码图片\n\n```html\n<form action=\"process.php\">\n    <input id=\"searchTerm\"\
  \ name=\"term\" type=\"text\" /><br />\n    <input type=\"submit\" id=\"btn1\" value=\"\
  Search\" />\n</form>\n```\n\n这里是修改后的 `checkform()` 函数：\n\n点击此处查看代码图片\n\n```javascript\n\
  function checkform() {\n    if(document.forms[0].term.value == \"\") {\n       \
  \ alert(\"Please enter a search term.\");\n        return false;\n    } else {\n\
  \        return true;\n    }\n}\n\nwindow.onload = function() {\n    document.getElementById(\"\
  btn1\").onclick = checkform;\n}\n```\n\n如果 JavaScript 激活状态，向提交按钮返回 `false` 值将阻止按钮的默认操作，从而防止表单提交。然而，如果没有\
  \ JavaScript，当点击按钮时表单仍会提交。\n\n### 特性检测\n\n尽可能，尝试直接检测浏览器特性的存在或否，并让你的代码仅在特性可用时使用这些特性。\n\
  \n例如，让我们来看 `clipboardData` 对象，在编写此书时，它仅在 Internet Explorer 中支持。在代码中使用此对象之前，进行几次测试是一个好主意：\n\
  \n![Image](img/image00365.jpeg) JavaScript 是否识别到该对象存在？\n\n![Image](img/image00365.jpeg)\
  \ 如果是，该对象是否支持你想使用的方法？\n\n以下函数 `setClipboard()` 尝试使用 `clipboardData` 对象直接将特定文本写入剪贴板：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction setClipboard(myText){\n    if((typeof clipboardData\
  \ != 'undefined') && (clipboardData.setData)){\n        clipboardData.setData(\"\
  text\", myText);\n    } else {\n        document.getElementById(\"copytext\").innerHTML\
  \ = myText;\n        alert(\"Please copy the text from the 'Copy Text' field to\
  \ your clipboard\");\n    }\n}\n```\n\n首先它使用 `typeof` 测试对象是否存在：\n\n点击此处查看代码图片\n\n\
  ```javascript\nif((typeof clipboardData != 'undefined') ....\n```\n\n***\n\n注意\n\
  \n`typeof` 运算符返回以下值之一，取决于操作数的类型：\n`\"undefined\"`、`\"object\"`、`\"function\"`、`\"\
  boolean\"`、`\"string\"` 或 `\"number\"`\n\n***\n\n此外，该函数坚持 `setData()` 方法可用：\n\n\
  点击此处查看代码图片\n\n```javascript\n... && (clipboardData.setData)){\n```\n\n如果任一个测试失败，用户将获得一种替代的（虽然不那么优雅）的获取文本到剪贴板的方法；它被写入一个页面元素，并邀请用户复制它：\n\
  \n点击此处查看代码图片\n\n```javascript\ndocument.getElementById(\"copytext\").innerHTML =\
  \ myText;\nalert(\"Please copy the text from the 'copytext' field to your clipboard\"\
  );\n```\n\n代码在任何时候都没有尝试显式检测用户的浏览器是 Internet Explorer（或其他任何浏览器）；如果某天其他浏览器实现了此功能，代码应该能正确检测。\n\
  \n### 良好地处理错误\n\n当你的 JavaScript 程序遇到某种类型的错误时，JavaScript 解释器内部会创建一个警告或错误。是否以及如何显示给用户取决于所使用的浏览器和用户的设置；用户可能会看到某种形式错误消息，或者失败的程序可能只是保持沉默但处于活动状态。\n\
  \n两种情况对用户来说都不好；用户可能不知道发生了错误，也不知道该怎么办。\n\n要尝试拦截潜在错误并整洁地处理它们的有用方法是使用 `try` 和 `catch`\
  \ 语句。\n\n#### 使用 try 和 catch\n\n`try` 语句允许你运行一段代码。如果代码没有错误，一切正常；然而，如果发生错误你可以使用 `catch`\
  \ 语句来干预并确定程序随后应该做什么。\n\n```javascript\ntry {\n    doSomething();\n}\ncatch(err)\
  \ {\n    doSomethingElse();\n}\n```\n\n注意语法：\n\n`catch(identifier)`\n\n这里 `identifier`\
  \ 是捕获错误时创建的对象。它包含了错误的信息；例如，如果你想向用户提示错误的性质，可以使用如下结构：\n\n```javascript\ncatch(err)\
  \ {\n    alert(err);\n}\n```\n\n***\n\n尝试它：转换为嵌入式\n\n有时你可能会发现自己需要代码转换为嵌入式。让我们用我们在\
  \ `13.ch4` 中编写的代码来实现，这里展示在 `22.1` 中。\n\n**列表 22.1 嵌入式脚本**\n\n点击此处查看代码图片\n\n***\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>当前日期和时间</title>\n    <style>\n\
  \        p {font:14px arial, verdana, helvetica;}\n    </style>\n    <script>\n\
  \        function telltime() {\n            var out = \"\";\n            var now\
  \ = new Date();\n            out += \"<br />Date: \" + now.getDate();\n        \
  \    out += \"<br />Month: \" + now.getMonth();\n            out += \"<br />Year:\
  \ \" + now.getFullYear();\n            out += \"<br />Hours: \" + now.getHours();\n\
  \            out += \"<br />Minutes: \" + now.getMinutes();\n            out +=\
  \ \"<br />Seconds: \" + now.getSeconds();\n            document.getElementById(\"\
  div1\").innerHTML = out;\n        }\n    </script>\n</head>\n<body>\n    当前日期和时间为：<br/>\n\
  \    <div id=\"div1\"></div>\n    <script>\n        telltime();\n    </script>\n\
  \    <input type=\"button\" onclick=\"location.reload()\" value=\"Refresh\" />\n\
  </body>\n</html>\n```\n\n***\n\n就目前而言，这个脚本有很多潜在的改进区域：\n\n![Image](img/image00412.jpeg)\
  \ JavaScript 语句放置在页面 `<script>` 和 `</script>` 标签之间；它们放在单独文件中会更好。\n\n![Image](img/image00412.jpeg)\
  \ 按钮具有内联事件程序句。\n\n\n\n\n![Image](img/image00412.jpeg) 未启用 JavaScript 的用户只会看到一个带有无法运行按钮的页面。\n\
  \n首先，我们将所有的 JavaScript 移动到一个单独的文件并移除内联事件处理程序。我们还为按钮分配了一个 `id` 值，这样我们就可以在 `JavaScript`\
  \ 中识别它，并通过我们的代码添加所需的事件处理程序。\n\n接下来，我们需要处理未启用 JavaScript 的用户的问题。我们使用 `<noscript>`\
  \ 页面元素，使得未启用 JavaScript 的用户看到的不是按钮，而是一条短消息，并附带一个指向替代时间信息源的链接：\n\n点击此处查看代码图像\n\n\
  ```html\n<noscript>\n    您的浏览器不支持 JavaScript<br />\n    请咨询您的计算机操作系统以获取本地日期和时间信息，或点击\
  \ <a href=\"clock.php\" target=\"_blank\">这里</a>读取服务器时间。\n</noscript>\n```\n\n*\
  \ * *\n\n### 提示\n\n`<noscript>` 元素为禁用了脚本或使用不支持客户端脚本浏览的用户提供了额外的页面内容。任何可以放入 HTML 页面\
  \ `<body>` 元素中的元素都可以放入 `<noscript>` 元素中，如果用户的浏览器无法运行脚本，这些元素将自动显示。\n\n* * *\n\n修改后的\
  \ HTML 文件列在 列表 22.2 中。\n\n**列表 22.2 修改后的 HTML 页面**\n\n点击此处查看代码图像\n\n* * *\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>当前日期和时间</title>\n    <style>\n     \
  \   p {font: 14px normal arial, verdana, helvetica;}\n    </style>\n    <script\
  \ src=\"datetime.js\"></script>\n</head>\n<body>\n    当前日期和时间为：<br/>\n    <div id=\"\
  div1\"></div>>\n    <input id=\"btn1\" type=\"button\" value=\"Refresh\" />\n  \
  \  <noscript>\n        <p>您的浏览器不支持 JavaScript。</p>\n        <p>请咨询您的计算机操作系统以获取本地日期和时间信息，或点击\
  \ <a href=\"clock.php\" target=\"_blank\">这里</a>读取服务器时间。</p>\n    </noscript>\n\
  </body>\n</html>\n```\n\n* * *\n\n在我们的 JavaScript 源文件 `telltime.js` 中，我们使用 `window.onload`\
  \ 为按钮添加事件监听器。最后，我们调用 `telltime()` 来生成显示在页面上的日期和时间信息。JavaScript 代码如 列表 22.3 中。\n\n\
  **列表 22.3 datetime.js**\n\n点击此处查看代码图像\n\n* * *\n\n```javascript\nfunction telltime()\
  \ {\n    var out = \"\";\n    var now = new Date();\n    out += \"<br />Date: \"\
  \ + now.getDate();\n    out += \"<br />Month: \" + now.getMonth();\n    out += \"\
  <br />Year: \" + now.getFullYear();\n    out += \"<br />Hours: \" + now.getHours();\n\
  \    out += \"<br />Minutes: \" + now.getMinutes();\n    out += \"<br />Seconds:\
  \ \" + now.getSeconds();\n    document.getElementById(\"div1\").innerHTML = out;\n\
  }\n\nwindow.onload = function() {\n    document.getElementById(\"btn1\").onclick=\
  \ function() {location.reload();}\n    telltime();\n}\n```\n\n* * *\n\n启用 JavaScript\
  \ 后，脚本的运行方式与 第 4 小节 中相同。然而，禁用了 JavaScript，用户现在看到的页面如 图 22.1 所示。\n\n![Image](img/image00471.jpeg)\n\
  \n**图 22.1** 为无 JavaScript 用户提供的额外信息\n\n* * *\n\n### 总结\n\n在本节中，我们总结并展示了编写 JavaScript\
  \ 良好实践的各种示例。结合使用它们应该帮助你更快地交付代码项目，具有更高的质量并且更易维护。\n\n### 问答\n\n**Q. 为什么用户会关闭 JavaScript？**\n\
  \n**A.** 请记住，浏览器可能由服务提供商或雇主设置了默认关闭 JavaScript，以提高安全性。这在诸这样的环境中特别常见。\n\n**Q. 除了 `<noscript>`，处理没有\
  \ JavaScript 的用户还有其他其他方法吗？**\n\n**A.** 另一种方法是将用户重定向到一个增强页面：\n\n点击此处查看代码图像\n\n```html\n\
  <script>window.location=\"enhanced.html\";</script>\n```\n\n如果 JavaScript 可用，脚本会将用户重定向到增强页面。\n\
  \n### 工作坊\n\n![Image](img/image00365.jpeg) 从书中前面的部分选择一些“尝试一试”章节，看看你可以做什么来让代码更具干扰性，同时不影响脚本的操作。\n\
  \n#### 测验\n\n1. 将代码模块化为可重用的块被称为：\na. 抽象\nb. 继承\nc. 非侵入\n\n2. 页面的 CSS 应该尽可能限制在：\n\
  a. 语义层\nb. 表现层\nc. 行为层\n\n3. 非侵入代码应尽可能放在：\na. 外部文件\nb. `<script>` 标签之间\nc. 内联\n\n\
  #### 答案\n\n1. a. 抽象\n2. b. 尽可能，所有的 CSS 都在表现层。\n3. a. 尽可能使用外部文件。\n\n#### 练习\n\n-\
  \ 你能如何修改 列表 22.2 和 列表 22.3 中的代码，以确保没有 JavaScript 的用户只看到 `<noscript>` 标签的内容，而不是额外的文本和按钮？（提示：使用\
  \ `innerHTML` 或 DOM 方法向页面写入这些项目。）\n\n\n\n\n\n![Image](img/image00365.jpeg) **运行时错误**——当\
  \ JavaScript 解释器尝试执行它无法理解的操作时发生的错误。示例包括尝试将字符串视为数值，以及尝试将数字除以零。\n\n![Image](img/image00365.jpeg)\
  \ **程序逻辑缺陷**——这些错误并不总是生成错误信息——代码可能是完全有效的——但你的脚本并没有按照你预期的方式运行。这些通常是与脚本中的算法或逻辑流相关的问题。\n\
  \n### 选择程序员编辑器\n\n无论你在哪个平台上工作，无论你首选哪种浏览器，拥有一个良好的代码编辑器都是很有明智的。虽然在 Windows 记事本等简单程序中编写代码确实是可能的，但专用的编辑器会让生活变得方便得多。\n\
  \n许多此类程序均可用，通常在开源或类似的许可下免费提供。在这里我列出了一小部分免费编辑器，但请自行寻找一个适合你的平台、工作风格和预算的编辑器。\n\n![Image](img/image00365.jpeg)\
  \ Notepad++ (Windows)\n\n![Image](img/image00365.jpeg) JEdit（应适用于任何安装了 Java 的平台）\n\
  \n![Image](img/image00365.jpeg) PSPad (Windows)\n\n![Image](img/image00365.jpeg)\
  \ JuffEd (Windows, Linux)\n\n![Image](img/image00365.jpeg) Geany (Windows, Linux)\n\
  \n编辑器提供了一系列功能和能力，但至少我建议寻找具有以下功能的编辑器：\n\n![Image](img/image00365.jpeg) **行号**——如果你将\
  \ JavaScript 存储在外部文件中，这一点尤为有用（这也是为什么在可行的情况下你应该这么做的的另一个原因）。这样一来，浏览器调试调试器生成的任何错误信息的行号，通常会与编辑器中打开的源文件行号匹配。\n\
  \n![Image](img/image00365.jpeg) **语法高亮**——当你熟悉了编辑器的语法高亮方案后，在很多情况下，你仅仅因为编辑器中的代码“看起来不对”就能发现编码错误。你习惯于喜爱的编辑程序中关键字、变量、字符串字面量、对象等颜色的速度之令人惊讶。许多编辑器允许你根据自己的喜好更改语法高亮颜色方案。\n\
  \n![Image](img/image00365.jpeg) **括号匹配**——作为寻找错误的“制导弹”，括号匹配是无价的。良好的编辑器会显示所有类型括号、大括号和圆括号的匹配左/右出现情况。当你的代码中有几层嵌套括号时，很容易数错数量。\n\
  \n![Image](img/image00365.jpeg) **代码补全或工具提示式语法帮助**——某些编辑器为命令函数和表达式提供弹出式工具提示的帮助。这可以节省你将视线离开编辑器窗口去查找外部参考的时间。\n\
  \n### 使用 alert() 进行简单调试\n\n有时，你想要一种非常简单快速的方法来读取变量的值，或者跟踪代码执行的顺序。\n\n也许最简单的方法是在代码适当的位置插入\
  \ JavaScript `alert()` 语句。让我们假设你想知道一个没有响应的函数是否真的被调用了，如果是，带有什么参数 parameters。\n\n\
  ```javascript\nfunction myFunc(a, b) {\n  alert(\"myFunc() called.\\na: \" + a +\
  \ \"\\nb: \" + b);\n  // rest of function code ...\n}\n```\n\n当函数被调用时，`alert()`\
  \ 方法会执行，并产生一个如图 23.1 所示的对话框。\n\n![Image](img/image00472.jpeg)\n**图 23.1** 使用 JavaScript\
  \ `alert()`\n\n记住在显示的消息中放入比单纯变量值或单单词注释多一点的信息；在战斗激烈时，你可能会忘记 `alert()` 中的值指的是哪个变量或属性。\n\
  \n### 更多调试\n\n在代码中放置 `alert()` 调用对于对短代码进行快速而粗略的调试也许可以。然而，这种技术确实有一些缺点：\n\n![Image](img/image00365.jpeg)\
  \ 你必须点击每个对话框的“确定”才能允许处理继续。这可能会让人感到沮丧，尤其是在处理长循环时！\n\n![Image](img/image00365.jpeg)\
  \ 接收到的消息没有存储在任何地方，并在对话框清除时消失；你无法返回并查看报告的内容。\n\n![Image](img/image00365.jpeg) 你需要回到编辑器并删除所有的\
  \ `alert()` 调用，你的代码才能“上线”运行。\n\n在本节中，我们将查看一些高级调试技术。\n\n#### 控制台\n\n幸运的是，大多数现代浏览器都提供了\
  \ JavaScript 控制台，你可以更有效地利用它记录消息。打开控制台的方法因浏览器而异：\n\n![Image](img/image00365.jpeg)\
  \ 在 Internet Explorer 中，打开开发者工具的方法：F12\n\n![Image](img/image00365.jpeg) 对于 Chrome\
  \ 开发者工具和 Opera 调试器：Ctrl+Shift+I\n\n![Image](img/image00365.jpeg) 使用带有 Firebug 扩展的\
  \ Firefox：F12\n\n本节中的示例假设你正在使用其中一种调试器。如果不是，你可能需要咨询你的调试器文档以查看如何执行某些任务。你的浏览器向你展示此类错误的方式因浏览器而异。\n\
  \n#### 动手尝试：使用浏览器的调试工具\n\n查看列表 23.1 中的代码。\n\n**列表 23.1** 一个带有错误的程序\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n  <title>Strings and Arrays</title>\n</head>\n\
  <body>\n  <script>\n    function sayHi() {\n      alert(\"Hello!\");\n    }\n  </script>\n\
  \  <input type=\"button\" value=\"good\" onclick=\"sayHi()\" />\n  <input type=\"\
  button\" value=\"bad\" onclick=\"sayhi()\" />\n</body>\n</html>\n```\n\n此代码列表包含两种不同类型的错误。首先，在调用\
  \ `alert()` 方法时，我们的参数缺少了引号。\n\n其次，第二个按钮的 `onclick` 处理器调用了函数 `sayhi()`——记住函数名是大小写敏感的，因此实际上没有定义名为\
  \ `sayhi()` 的函数。\n\n将页面加载到 Firefox 中，我们可以看到预期的两个按钮，一个标记为“good”，另一个标记为“bad”。它们似乎都没有反应。我们可以通过按下\
  \ Ctrl+Shift+J 打开 Firefox 控制台，结果如图 23.2 所示。\n\n![Image](img/image00473.jpeg)\n**图\
  \ 23.2** Firefox 控制台\n\n这是一个很好的开始。Firefox 告诉我们发现了一个未结束的字符串字面量，给出了行号，甚至向我们展示问题所在的代码行。\n\
  \n在修正错误并再次保存文件后，我准备好再次尝试。首先，点击控制台工具栏上的“清除”以移除旧的错误消息；然后我重新加载测试页面。\n\n这看起来好多了。我的页面再次出现，控制台保持空白。点击标记为“good”的按钮打开了预期的\
  \ `alert()` 对话框——到目前为止。\n\n但点击标记为“bad”的按钮似乎什么都没有做——所以我再次参考控制台，如图 23.3 所示。\n\n![Image](img/image00474.jpeg)\n\
  **图 23.3** 第二个错误\n\nFirefox 再次识别了问题：“sayhi 未定义”。现在我们正处于让代码完全调试并正确运行的路上。\n\n每个浏览器都有自己处理错误的方式。图\
  \ 23.4 显示了 Chromium 浏览器如何报告最初的未结束字符串字面量错误。\n\n![Image](img/image00475.jpeg)\n**图\
  \ 23.4** Google Chromium JavaScript 控制台\n\n\n\n\n\n# Google Chrome 和 Chromium\n\n\
  Google Chrome 和 Chromium 几乎是相同的浏览器，主要区别在于它们的打包和分发方式。本质上，Google Chrome 是由 Google\
  \ 打包并分发的 `Chromium` 开源浏览器。\n\nChromium 的错误信息略显晦涩：“Uncaught syntax error: Unexpected\
  \ token ILLEGAL”，但它也提供了一个可以点击的链接，显示了出错代码的行号。\n\n要打开 Internet Explorer 的开发者工具，请按\
  \ `F12` 或从 `IE9` 的工具菜单中选择 `Developer Tools`。选择 `Console` 标签以查看 `JavaScript` 返回的错误消息。\n\
  \n### 提示\n\n了解你喜喜浏览器中的调试工具是值得的，如果你特别喜欢其他浏览器提供的工具，甚至可以考虑切换浏览器。如果你计划经常编写 `JavaScript`\
  \ 代码，那么在一个让你感到舒适的开发环境中编写是有意义的，在那里你会效率更高，挫败感更少。\n\n## 动手尝试：横幅轮播脚本\n\n让我们通过编写一个在页面上循环显示图片的脚本，运用一下这一小时所学到的知识。我确定你以前见过这种程序，可能是作为图片幻灯片，或者用来轮播广告横幅。\n\
  \n首先，我想向你介绍两个新项目。第一个是你以前没见过的事件处理程序——`window` 对象的 `onLoad` 方法。它的操作很简单：我们可以像这样将其附加到\
  \ `<body>` 元素：\n\n点击此处查看代码图片\n\n```html\n<body onload=\"somefunction()\" >\n```\n\
  \n当页面完全加载完成后，`onLoad` 事件就会触发，事件处理程序指定的代码就会运行。我们使用这个事件处理程序在页面加载后立即运行横幅轮播器。\n\n其次，我们将使用\
  \ `JavaScript` 的 `setInterval()` 函数。该函数允许我们重复运行一个 `JavaScript` 函数，并在每次连续执行之间设置预设的延迟。\n\
  \n`setInterval()` 函数接受两个参数。第一个是我们想要运行的函数名称，第二个是函数连续执行之间的延迟（毫秒）。例如，该行：\n\n```javascript\n\
  setInterval(myFunc, 5000);\n```\n\n将每隔五秒执行一次 `myFunc()` 函数。\n\n我们使用 `setInterval()`\
  \ 定隔旋转横幅图片。\n\n创建一个名为 `banner.html` 的新文件，并输入 列表 23.2 中的代码。\n\n**列表 23.2 横幅轮播器**\n\
  \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Banner Cycler</title>\n\
  \    <script>\n        var banners = [\"banner1.jpg\", \"banner2.jpg\", \"banner3.jpg\"\
  ];\n        var counter = 0;\n        function run() {\n            setInterval(cycle,\
  \ 2000);\n        }\n        function cycle() {\n            counter++;\n      \
  \      if(counter == banners.length) counter = 0;\n            document.getElementById(\"\
  banner\").src = banners[counter];\n        }\n    </script>\n</head>\n<body onload\
  \ = \"run();\">\n    <img id=\"banner\" alt=\"banner\" src=\"banner1.jpg\" />\n\
  </body>\n</html>\n```\n\n页面的 HTML 部分再不能更简单了——页面的主体只包含一个图像元素。这个图像将形成横幅，通过更改其 `src`\
  \ 属性来对其“旋转”。\n\n现在让我们来看下代码。\n\n`run()` 函数只包含一条语句，即 `setInterval()` 函数。该函数每两秒（2000\
  \ 毫秒）执行另一个函数 `cycle()`。\n\n每当 `cycle()` 函数执行时，我们都会执行三项操作：\n\n**1. 增加计数器。**\n\n```javascript\n\
  counter++;\n```\n\n**2. 使用条件语句检查计数器是否达到了图像名称数组中的元素数量；如果是，则将计数器置为零。**\n\n点击此处查看代码图片\n\
  \n```javascript\nif(counter == banners.length) counter = 0;\n```\n\n**3. 将显示图像的\
  \ `src` 属性设置为从图像文件名数组选择的适当文件名。**\n\n点击此处查看代码图片\n\n```javascript\ndocument.getElementById(\"\
  banner\").src = banners[counter];\n```\n\n\n\n\n\n图 23.9 显示了 Firebug 控制台如何显示每个消息；在其他浏览器中显示可能会略有不同。\n\
  \n![Image](img/image0048.jpeg)\n\n**图 23.9** 不同类型的控制台消息\n\n## 消息分组\n\n将控制台调试消息分组可以使其更具可读性。你可以按需要为单个消息组命名：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction myFunc(a, b) {\n    console.group(\"myFunc\
  \ execution\");\n    console.log(\"Executing myFunc()\");\n    if(isNaN(a) || isNaN(b))\
  \ {\n        console.warn(\"One or more arguments non-numeric\");\n    }\n    console.groupEnd();\n\
  \    myOtherFunc(a+b);\n}\n\nfunction myOtherFunc(c) {\n    console.group(\"myOtherFunc\
  \ execution\");\n    console.log(\"Executing myOtherFunc()\");\n    if(isNaN(c))\
  \ {\n        console.info(\"Argument is not numeric\");\n    }\n    console.groupEnd();\n\
  \    // .. rest of function code here ...\n}\n```\n\n在这段代码段中，我定义了两个 `console.group()`\
  \ 部分，并命名它们以与执行它们的函数关联。每个组都以 `console.groupEnd()` 语句结束。当代码运行时，任何控制台消息都会以分组的形式显示，如图\
  \ 23.10 所示。\n\n![Image](img/image00481.jpeg)\n\n**图 23.10** 分组的消息\n\n## 使用断点停止代码执行\n\
  \n随着脚本复杂性的增加，你可能会发现即使是控制台日志也不足以让你进行有效的调试。\n\n为了进行更详细的调试，你可以在代码中感兴趣的地方设置所谓的断点（breakpoints）。当代码执行到断点处时，它会暂停；在时间冻结期间，你可以检查代码的运行情况、检查变量值、读取已记录的消息等。\n\
  \n在大多数流行的调试器中，设置断点需要进入“脚本（Scripts）”面板，你可以在那里看到列出的代码。点击行号（或点击行号左侧）即可在该行设置断点。在图 23.11\
  \ 中，代码的第 8 行设置了一个断点。执行在此处停止，你可以在右侧面板查看各个变量的当前值。你可以通过再次点击左侧边缘的断点图标来移除断点。\n\n![Image](img/image00482.jpeg)\n\
  \n**图 23.11** 执行在断点处停止\n\n## 条件断点\n\n有时，仅在特定情况发生时才中断代码执行是有帮助的。你可以通过右键点击左列中的断点图标并输入条件语句来设置条件断点。\n\
  \n你的代码将在不中断的情况下执行，直到条件满足，此时执行将停止。例如，在图 23.12 中，如果 `a` 和 `b` 的和小于 12，代码将停止。你可以随时再次右键点击断点图标来编辑表达式。\n\
  \n![Image](img/image00483.jpeg)\n\n**图 23.12** 条件断点\n\n当代码执行在断点处停止时，你可以选择继续执行代码，或使用代码执行按钮之一逐条语句执行你的代码；这些按钮通常看起来像\
  \ VCR 控制按钮，并出现在调试器其中一个面板的顶部。在大多数调试器中，选项有：\n\n![Image](img/image00365.jpeg) **继续（Continue）**——恢复执行，仅在遇到或当到达另一个断点时再次暂停。\n\
  \n![Image](img/image00365.jpeg) **单过（Step Over）**——执行当前行（包括所调用的任何函数），然后移动到下一行。\n\
  \n![Image](img/image00365.jpeg) **单入（Step Into）**——移动到下一行，与单过类似，除非该行调用了函数；如果是那样，则跳转到函数的第一行。\n\
  \n![Image](img/image00365.jpeg) **单出（Step Out）**——离开当前函数并返回到调用它的地方。\n\n## 从代码启动调试器\n\
  \n从 JavaScript 代码内部设置断点也是可能的，而且通常很有用。我们可以通过使用关键字 `debugger` 来实现这一点：\n\n点击此处查看代码图像\n\
  \n```javascript\nfunction myFunc(a, b) {\n    if(isNaN(a) || isNaN(b)) {\n     \
  \   debugger;\n    }\n    // .. rest of function code here ...\n}\n```\n\n在这个示例中，只有在满足条件时，代码执行才会停止并打开调试器。\n\
  \n## 监视表达式（Watch Expressions）\n\n监视表达式是调试器持续评估的有效表达式，使其值供你检查。范围从简单的变量名到包含算术运算或函数调用的公式。\n\
  \n![Image](img/image0048.jpeg)\n\n**图 23.13** 监视表达式\n\n## 验证 JavaScript\n\n检查代码问题的另一种不同且补充的方法是使用\
  \ JSLint，它会检查代码是否符合语言规则。JSLint 有时与 JavaScript 编辑器一起，也可以在线获取。\n\n### 总结\n\n在本小时中，你学习了关于调试代码的许多知识，包括使用浏览器控制台，以及设置断点和单步执行。\n\
  \n### 问答\n\n**Q. 我应该如何选择程序员编辑器？**\n**A.** 完全取决于个人选择。许多是免费的或提供免费版本，所以没有什么阻止你尝试几种。\n\
  \n**Q. 哪里可以找到更多关于调试的知识？**\n**A.** 网上有很多教程。从 W3Schools 的开始，地址为 [`www.w3schools.com/js/debugging.asp`](http://www.w3schools.com/js/debugging.asp)。\n\
  \n## 工作\n\n在阅读答案 你如何修改横幅循环脚本以为横幅添加链接，使得显示的每个图像都链接到不同的外部页面？\n\n\n\n\n\n![Image](img/image00365.jpeg)\
  \ 利用你对使用 `Math` 对象生成随机数的知识，你是否可以重写横幅循环脚本，以便在每次切换时显示随机横幅，而不是按顺序循环？请使用浏览器的内置调试工具来帮助自己。\n\
  \n# 第 24 小时：JavaScript 单元测试\n\n在本小时你将学习到：\n\n![Image](img/image00365.jpeg) 什么是单元测试以及为什么要使用它\n\
  \n![Image](img/image00365.jpeg) 如何让你的 JavaScript 代码更易测试\n\n![Image](img/image00365.jpeg)\
  \ JavaScript 测试套件的一些示例\n\n![Image](img/image00365.jpeg) 关于 `QUnit` 测试套件和 `CommonJS`\
  \ 单元测试规范\n\n通常情况下，一个最初只有几行代码的 JavaScript 小花招（hack）随后会增长到十行、二十行，然后是五十行。与此同时，函数被微调以执行更多功能，条件语句增加了几个额外的条件，或者创建了几个额外的变量。\n\
  \n当这样的应用程序（不可避免地）崩溃时，理清代码并找到问题可能是一场噩梦。\n\n正如你已经在第 22 小时中读到的，“良好的编码实践](#part0037.xhtml_ch22)”，良好的编码实践可以帮助让你的代码更容易理解和维护，但你还有其他可以做的事情。随着你的\
  \ JavaScript 应用程序规模、复杂性和精细程度的增加，编写易于测试的代码变得更加重要。\n\n在本小时中，你将学习一些编写代码以使其适用于单元测试的方法，以及如何编写和执行此类测试。\n\
  \n## 什么是单元测试？\n\n如果你不熟悉单元测试的概念，不用担心，理解它并不复杂。\n\n通常当某人考虑测试 JavaScript 应用程序时，他们想象的是测试整个系统以查看它的运行是否符合预期。这本质上是一种检查应用程序的各个部分是否协同正常工作的测试，通常被称为*集成测试*。\n\
  \n*单元测试*是一种软件验证和确认方法，它将应用程序分解为最小的可测试部分，称为*单元*（units），然后对这些单元分别进行单独的检查和测试，以确保其运行正常。单元是应用程序中最小的可测试部分，例如单个函数或方法。\n\
  \n单元测试可以手动完成，但此类测试通常是自动化的。\n\n本质上，你为代码的每个基本元素编写一系列测试，以测试该单元在所有可能的输入类型下的性能。如果所有这些测试都通过了，你就可以确信每个测试元素都是称职的。\n\
  \n## 亲自试一试：一个自制的的单元测试\n\n让我们直接开始，从头执行一个单元测试。\n\n在这个示例中，我们将编写一些测试，在一个示例单元上执行它们，并将结果摘要发送到浏览器控制台。\n\
  \n让我们看看我们在第 3 小时中编写的一个函数，“使用函数](#part0012.xhtml_ch03)”，该函数用于按给定比例向净额添加税费并返回总额：\n\
  \n点击此处查看代码图像\n\n```javascript\nfunction addTax(subtotal, taxRate) {\n    var total\
  \ = subtotal * (1 + (taxRate/100));\n    return total;\n}\n```\n\n这个函数构成了我们将进行某些测试的单元。\n\
  \n我们将此函数保存在文件 `tax.js` 中，并将其包含在作为测试套件的 HTML 页面中。在现实世界中，`tax.js` 可能包含许多不同的函数，作为财务应用程序的一部分，但对于这个示例，它足够了。HTML\
  \ 代码如列表 24.1 所示。\n\n**列表 24.1 测试套件的 HTML 代码**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n  <title>Manual Unit Testing Examples</title>\n  <script\
  \ src=\"tax.js\"></script>\n  <script>\n  function test(amount, rate, expected)\
  \ {\n    results.total++;\n    var result = addTax(amount, rate);\n    if (result\
  \ !== expected) {\n      results.failed++;\n      console.log(\"Expected \" + expected\
  \ + \", but instead got \" + result);\n    }\n  }\n  var results = {\n    total:\
  \ 0,\n    failed: 0\n  };\n  // Our unit tests\n  test(1, 10, 1.1);\n  test(5, 12,\
  \ 5.6);\n  test(100, 17.5, 117.5);\n  // Output results to the console\n  console.log(results.total\
  \ + \" tests carried out, \" + results.failed + \" failed, \" +(results.total -\
  \ results.failed) + \" passed.\");\n  </script>\n</head>\n<body>\n</body>\n</html>\n\
  ```\n\n在此页面的一个 `<script>` 元素中，我定义了一个名为 `test()` 的函数，它接受三个参数。参数 `amount` 和 `rate`\
  \ 是要传递的值，而 `expected` 是我们期望 `addTax()` 函数按预期方式返回的结果。\n\n如果被测试函数返回了预期结果，`test()`\
  \ 函数将增加成功计数器；如果不是，它将增加失败计数器，并在控制台中打印出哪个测试失败以及实际返回的值。\n\n要运行此测试，我只需将代码保存为 .html 文件并将页面加载到浏览器中。结果所示于图\
  \ 24.1。\n\n![Image](img/image0485.jpeg)\n\n**图 24.1**单元测试的结果\n\n你可以看到，我们的一个测试失败了；JavaScript\
  \ 产生了一个小的误差。这个结果让我重新检查 `addTax()` 函数的代码——也许在返回之前对输出进行舍入。\n\n当然，你不必将结果记录到控制台；它们同样可以打印到页面上、保存到数据库等。稍我们将查看\
  \ `QUnit`，这是一个开源单元测试应用程序，它可以在测试的 HTML 中直接显示格式良好的测试结果。\n\n## 为单元测试编写 JavaScript\n\
  \n再次查看之前的示例，一些事情变得显而易见：\n\n![Image](img/image00365.jpeg) 当然，`addTax()` 函数是一个*命名*函数。如果它是匿名函数，通过这种方式进行测试将变得困难得多甚至不可能。\n\
  \n![Image](img/image365.jpeg) 函数包含在外部 JavaScript 文件（在这里是 `tax.js`）也有助于将其包含在我们的测试套件中。\n\
  \n这些只是关于编码风格如何影响 JavaScript 代码可测试性的几个例子。\n\n以旧式过程化方式编写的应用程序很难进行单元测试。然而，如果你在编写代码时考虑到单元测试，你不仅会让编写这些测试变得更容易，而且会写出更易阅读、维护和扩展的代码。\n\
  \n在下一节中，我将汇总一些可以使你的代码更容易测试的编码技巧。\n\n### 重构代码\n\n外部化脚本\n\n\n\n\n将收集到外部文件中稍后链接到应用程序中的\
  \ JavaScript 代码通常更容易测试。在理想情况下，包含在生产应用程序中的相同 JavaScript 文件可以简单地链接到你的测试构架（test harness）中，以便执行测试。\n\
  \n## 保持函数和方法简单\n\n你越在一个过程中尝试做更多的事情，你的测试就会变得越复杂、数量越多，而且在测试该函数时，将其从周围的代码中解耦出来可能变得越困难。\n\
  \n## QUnit 测试套件\n\n上一个示例表明，你不需要大量的代码就可以运行实际的单元测试。然而，对于多于几个测试，使用专门设计的单元测试框架会有效率得多，它能为编写和运行测试提供更高级的工具。在本节中，我们将查看其中一个框架，`QUnit`。\n\
  \n`QUnit` 是一个强大的开源 JavaScript 单元测试框架。它由 jQuery 团队的成员编写，用于 jQuery、jQuery UI 和 jQuery\
  \ Mobile 项目。然而，`QUnit` 能够测试任何常规 JavaScript 代码。\n\n### 安装 QUnit\n\n`QUnit` 是一个自包含的库，只需要一个\
  \ JavaScript 文件（`qunit.js`）和一个 CSS 文件（`qunit.css`），这两个文件都可以从 `QUnit` 网站下载。或者，你可以使用托管在\
  \ CDN 上的版本，如下例所示。\n\n### 极简 QUnit 设置\n\n再次，我们的测试设置将是一个简单的 HTML 页面，如 列表 24.2 所示。这次，`QUnit`\
  \ 从 CDN 引入。\n\n**列表 24.2 用于 QUnit 测试套件的代码**\n\n点击此处查看代码图像\n\n***\n\n```\n<!DOCTYPE\
  \ html>\n<html\n<head>\n<title>Hello QUnit Example</title>\n<link rel=\"stylesheet\"\
  \ href=\"http://code.jquery.com/qunit/qunit-1.16.0.css\">\n</head>\n<body>\n<div\
  \ id=\"qunit\"></div>\n<div id=\"qunit-fixture\"></div>\n<script src=\"http://code.jquery.com/qunit/qunit-1.16.0.js\"\
  ></script>\n<script src=\"tests.js\"></script>\n</body>\n</html>\n```\n\n***\n\n\
  注意此文件的布局，以及它与我们在上一节中使用的手动测试套件有多相似。然而，有几点不同：\n\n![图像](img/image00365.jpeg) `QUnit`\
  \ 并不是向控制台记录信息，而是将格式化良好的结果输出到 ID 为 `#qunit` 的 `<div>` 中。\n\n![图像](img/image00365.jpeg)\
  \ 在需要设置测试期间使用的元素（通常是表单元素等）所需的 `mock DOM` 时，需要 `#qunit-fixture` 元素。mock DOM 在每个单元测试后都会重置。`QUnit`\n\
  \n期望 mock DOM 位于 `#qunit-fixture` 元素中。\n\n我们在 `head` 中包含 CSS 文件，而 `body` 包含了 `QUnit`\
  \ JavaScript 文件，以及名为 `tests.js` 的后续文件，它仅包含以下代码：\n\n点击此处查看代码图像\n\n```javascript\n\
  QUnit.test( \"Hello QUnit test\", function( assert ) {\n  assert.ok( 1 == \"1\"\
  , \"Passed!\" );\n});\n```\n\n让我们看看这里发生了什么。测试方法被调用，将测试名称作为第一个参数传递，并将函数作为第二个参数传递。正是这个函数将运行我们的测试。\n\
  \n点击此处查看代码图像\n\n```javascript\nassert.ok( 1 == \"1\", \"Passed!\" );\n```\n\n在这个平凡的示例中，测试将始终通过。`ok`\
  \ 方法是 `QUnit` 提供的几个 `assertions`（断言）之一，如果传递给它的第一个参数返回一个评估为真的值，则返回真值。\n\n***\n\n\
  ## QUnit 断言\n\n`assertion`（断言）评估表达式为真或假。`QUnit` 的 `assert` 有许多你可以使用的额外方法来构建你的测试。示例包括\
  \ `equal()`，意所当然，它测试相等性；`notEqual()`，测试不相等性；以及 `strictEqual()`，它再次测试相等性，但这次是严格的类型和值比较。\n\
  \n在 `QUnit` 的文档中查看所有断言：[`api.qunitjs.com/category/assert/`](http://api.qunitjs.com/category/assert/)。\n\
  \n***\n\n结果如图 24.2 所示。\n\n![图像](img/image00486.jpeg)\n\n**图 24.2** 示例单元测试的结果\n\n\
