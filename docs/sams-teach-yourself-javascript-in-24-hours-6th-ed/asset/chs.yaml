  \ 九十九种创建对象的方法\n\n随着你的程序变得越来越复杂，你需要使用有助于你进行维护的技术。在这一小时中，你将学习面向对象编程（OOP）的基础知识，这是编写清晰可靠代码的重要技术。\n\
  \n### 什么是面向对象编程？\n\n到目前为止，代码示例都是所谓的*过程化*编程。过程化程序的特点是将数据存储在变量中，并通过指令进行操作。每条指令（或指令列表，如函数）都可以创建、销毁或修改数据，但数据仍然保持不变。\n\
  \n在面向对象编程（OOP）中，指令和它们操作的数据更加交织。OOP 是一种将程序数据概念化为离散的“事物”的方法，这些事物被称为*对象*——每个对象都有属性（数据）和方法（指令）。\n\
  \n例如，假设编写一个脚本来管理汽车租赁业务。你可能会设计一个通用对象对象 `Car`。`Car` 对象将具有属性（`color`、`year`、`odometerReading`\
  \ 和 `make`），并可能有一些方法（例如用于更新 `odometerReading` 属性的方法 `setOdometer(newMiles)`）。\n\n\
  对于车队的每辆车，你都会创建一个 `Car` 对象的*实例*。\n\n* * *\n\n注意\n\n对象的实例是对象模板的一种特定应用。例如，通用对象模板 `Car`\
  \ 可能有一个特定的实例，其中创建的 `Car` 对象通过特定数据识别为“蓝色 1998 福特”，另一个实例描述为“黄色 2004 尼日产”。在大多数关于面向对象编程的讨论中，这种对象模板被称为*类*。我克制了使用该术语的冲动，因为\
  \ JavaScript 并没有真正使用类，但 JavaScript 的概念*构造函数*与此相似。你将在这一小时中学习构造函数。\n\n* * *\n\n编写\
  \ OOP 代码相比过程化方法有几个优势：\n\n![Image](img/image00365) **代码重用**——首先，OOP 允许你在各种脚本中重用你的代码。你可以通过普通函数来实现这一点，但很快就会很难跟踪所有需要传递的变量、作用域和含义。相比之下，你只需要记录每个对象的属性和方法。只要它们遵循这些规则，其他程序——甚至其他程序员都可以轻松使用你的对象定义。\n\
  \n\n\n\n![Image](img/image00365.jpeg) **继承**——在编写代码时，你往往需要一些与之前编写过的代码相似但并不完全相同的代码——甚至可能是已经在同一个应用程序中编写过的代码。通过`继承`，可以根据之前定义的对象的设计来创建新对象，并可选地对其方法和属性进行添加或修改；新对象会`继承`旧对象的属性和方法。\n\
  \n在之前的几个小时中，你经常使用对象；要么是 JavaScript 内置的对象，要么组成 DOM 的对象。然而，你也可以创建自己的对象，拥有它们自己的属性和函数，并在程序中使用它们。\n\
  \n* * *\n\n## Note\n\n像 `C++` 和 `Smalltalk` 某些编程语言高度倾向于 OOP（面向对象编程），通常被称为面向对象语言。JavaScript\
  \ 并不是其中之一，但它支持足够的核心要素，让你能够编写出实用的 OOP 代码。我们可以很容易用 OOP 的理论和实践填满整本书，但我们在这里只看基础知识。\n\
  \n* * *\n\n### 对象创建\n\nJavaScript 提供了几种创建对象的方法。让我们先看看如何声明对象的`直接实例`（direct instance）；稍后我们将使用`构造函数`（constructor\
  \ function）来创建对象。\n\n#### 创建直接实例\n\nJavaScript 有一个简单名为 `Object` 的内置对象，你可以将其作为一种空白画布来创建自己的对象：\n\
  \n```javascript\nmyNewObject = new Object();\n```\n\n好了，你现在有了一个全新的对象 `myNewObject`。目前，它实际上并没有做任何事情，因为它没有任何任何属性或方法。你可以通过添加一个属性来开始纠正这一点：\n\
  \n点击此处查看代码图片\n\n```javascript\nmyNewObject.info = 'I am a shiny new object';\n```\n\
  \n现在你的对象拥有了一个属性——在这种情况下，它是一个包含对象某些信息的文本字符串，名为 `info`。你也可以轻松地为对象添加一个方法，首先定义一个函数，然后将其作为对象的方法之一挂载到\
  \ `myNewObject` 上：\n\n点击此处查看代码图片\n\n```javascript\nfunction myFunc() {\n    alert(this.info);\n\
  };\n\nmyNewObject.showInfo = myFunc;\n```\n\n* * *\n\n### Caution\n\n注意，你在这里只使用了函数名而没有带括号。你这样做是因为你正尝试给方法\
  \ `newObject.showInfo` 分配函数 `myFunc()` 的`定义`。\n\n如果你使用了代码：\n\n点击此处查看代码图片\n\n```javascript\n\
  myNewObject.showInfo = myFunc();\n```\n\n你将是在要求 JavaScript `执行` `myFunc()` 并将其`返回值`赋值给\
  \ `newObject.showInfo`。\n\n* * *\n\n要调用这个新方法，你只需使用现在熟悉的点符号法：\n\n```javascript\n\
  myNewObject.showInfo();\n```\n\n#### 使用 this 关键字\n\n注意在之前的函数定义中 `this` 关键字的使用。你可能记得在第\
  \ 2 小节“编写简单脚本”和第 3 小节“使用函数”中使用过这样的关键字。在之前的示例中，你在内联事件处理程序使用了 `this`：\n\n点击此处查看代码图片\n\
  \n```html\n<img src=\"tick.gif\" alt=\"tick\" onmouseover=\"this.src='tick2.gif';\"\
  \ />\n```\n\n当像那样使用时，`this` 指的是 HTML 元素本身——在前面的例子中是 <img> 元素。当你在函数（或方法）内部使用 `this`\
  \ 时，关键字 `this` 指的是函数的父级对象。\n\n在第一次声明函数 `myFunc()` 时，它的父级是全局对象；即 `window` 对象。`window`\
  \ 对象没有名为 `info` 的属性，因此如果你直接调用 `myFunc()` 函数将会将会错误。\n\n然而，你继续为 `myNewObject` 创建一个名为\
  \ `showInfo` 的方法，并将 `myFunc()` 赋值给该方法：\n\n点击此处查看代码图片\n\n```javascript\nmyNewObject.showInfo\
  \ = myFunc;\n```\n\n在 `showInfo()` 方法的上下文中，`myNewObject` 是父对象，因此 `this.info` 指的是属性\
  \ `myNewObject.info`。\n\n让我们看看通过列表 8.1 中的代码来稍微澄清这一点。\n\n**列表 8.1 创建一个对象**\n\n点击此处查看代码图片\n\
  \n* * *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Object Oriented\
  \ Programming</title>\n    <script>\n        myNewObject = new Object();\n     \
  \   myNewObject.info = 'I am a shiny new object';\n        function myFunc() {\n\
  \            alert(this.info);\n        }\n        myNewObject.showInfo = myFunc;\n\
  \    </script>\n</head>\n<body>\n    <img src=\"tick.gif\" alt=\"tick\" onmouseover=\"\
  this.src='tick2.gif';\" />\n    <input type=\"button\" value=\"Method Call\" onclick=\"\
  myNewObject.showInfo(); />\n    <input type=\"button\" value=\"Direct Call\" onclick=\"\
  myFunc(); />\n    <input type=\"button\" value=\"Error Call\" onclick=\"showInfo();\
  \ />\n</body>\n</html>\n```\n\n* * *\n\n（注：原文文本中提供的 HTML 块是破碎的。我将根据提供的文本结构重新组织逻辑，同时遵循规则。）\n\
  \n将此页面加载到浏览器中，你将面对三个按钮。点击第一个按钮调用新创建的 `showInfo` 方法：\n\n```javascript\nmyNewObject.showInfo();\n\
  ```\n\n第二个按钮直接调用 `myFunc()`：\n\n```javascript\nmyFunc();\n```\n\n第三个按钮尝试在不引用父对象的情况下调用\
  \ `showInfo`：\n\n```javascript\nshowInfo();\n```\n\n因为 `showInfo` 在对象外部不存在，JavaScript\
  \ 会报告错误，如图 8.3 所示。\n\n\n\n\n如果你认为你只需要该类型的一个对象，那么直接创建一个对象的实例是可以的。遗憾的是，如果你需要为同种类型的对象创建另一个实例，你将必须再次经历相同的过程——创建对象、添加属性、定义方法等等。\n\
  \n### 提示\n只有一个全局实例的对象有时被称为单例对象（singleton object）。这些对象在某些情况下很有用；例如，你程序的用户可能只有一个关联的\
  \ `userProfile` 对象，该对象可能包含他或她的用户名、最后访问页面的 URL 以及类似的属性。\n\n### 创建将具有多个实例对象的更好方法是使用**对象构造函数**（object\
  \ constructor function）。对象构造函数可以创建一个“模板”，从该模板中可以实例化更多的对象。\n\n看下面的代码。与其使用 `new Object()`，你首先声明一个函数\
  \ `myObjectType()`，并在它的定义中，你可以使用 `this` 关键字添加属性和方法。\n\n点击此处查看代码图像\n\n```javascript\n\
  function myObjectType(){\n    this.info = 'I am a shiny new object';\n    this.showInfo\
  \ = function(){\n        alert(this.info);  // 显示属性 info 的\n    }\n    this.setInfo\
  \ = function (newInfo) {\n        this.info = newInfo; // 覆盖属性 info 的值\n    }\n\
  }\n```\n\n在前面的代码中，你添加了一个单一属性 `info` 和两个方法：`showInfo`（用于显示当前存储在 `info` 属性中的值）和 `setInfo`。`setInfo`\
  \ 方法接收一个参数 `newInfo`，并使用它的值来覆盖 `info` 属性的值。\n\n#### 实例化对象\n现在，你可以根据需要为该对象类型创建**任意数量**的实例。所有实例都将拥有在\
  \ `myObjectType()` 函数中定义的属性和方法。创建一个对象实例被称为**实例化**（instantiating）。\n\n定义好构造函数后，你可以简单地通过使用构造函数来创建对象的实例：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar myNewObject = new myObjectType();\n```\n\n###\
  \ 注意\n请注意，这种语法与使用 `new Object()` 完全相同，不同在于你使用了专门设计的对象类型来代替 JavaScript 的通用 `Object()`。通过这样做，你实例化了一个包含构造函数中定义的全部属性和方法的完整对象。\n\
  \n现在，你可以调用它的方法并检查它的属性：\n\n点击此处查看代码图像\n\n```javascript\nvar x = myNewObject.info\
  \ // x 现在包含 'I am a shiny new object'\nmyNewObject.showInfo();  // 弹出 'I am a shiny\
  \ new object'\nmyNewObject.setInfo(\"Here is some new information\");  // 覆盖了 info\n\
  ```\n\n#### 属性\n创建多个实例非常简单，只需根据需要多次调用构造函数即可：\n\n点击此处查看代码图像\n\n```javascript\nvar\
  \ myNewObject1 = new myObjectType();\nvar myNewObject2 = new myObjectType();\n```\n\
  \n让我们来看它的实际运行效果。列表 8.2 中的代码定义了一个与之前描述相同的对象构造函数。\n\n实例化了两个对象的实例；显然，这两个对象最初是完全相同的。你可以通过点击标记为\
  \ Show Info 1 或 Show Info 2 的按钮之一，来检查每个对象 `info` 属性中存储的值。\n\n第三个按钮调用了对象 `myNewObject2`\
  \ 的 `setInfo` 方法，并将一个新的字符串字面量作为参数传递给该方法。这覆盖了对象 `myNewObject2` 中 `info` 属性中存储的值，但当然不会改变\
  \ `myNewObject`。可以通过再次使用 Show Info 1 和 Show Info 2 来检查修改后的值。\n\n**列表 8.2 使用构造函数创建对象**\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>面向对象编程</title>\n\
  \    <script>\n        function myObjectType(){\n            this.info = 'I am a\
  \ shiny new object';\n            this.showInfo = function(){\n                alert(this.info);\n\
  \            }\n            this.setInfo = function (newInfo) {\n              \
  \  this.info = newInfo;\n            }\n        }\n        var myNewObject1 = new\
  \ myObjectType();\n        var myNewObject2 = new myObjectType();\n    </script>\n\
  </head>\n<body>\n    <input type=\"button\" value=\"Show Info 1\" onclick=\"myNewObject1.showInfo()\"\
  \ />\n    <input type=\"button\" value=\"Show Info 2\" onclick=\"myNewObject2.showInfo()\"\
  \ />\n    <input type=\"button\" value=\"Change info of object2\" onclick=\"myNewObject2.setInfo('New\
  \ Information!')\" />\n</body>\n</html>\n```\n\n#### 使用构造函数\n没有什么可以阻止你在实例化时自定义你的对象，即通过向构造函数传递一个或多个参数。在接下来的代码中，构造函数的定义包含一个参数\
  \ `personName`，它被构造函数赋值给 `name` 属性。正如你在实例化对象时向构造函数传递一个或多个参数的那样：\n\n点击此处查看代码图像\n\n\
  ```javascript\nfunction Person(personName){\n    this.name = personName;\n    this.info\
  \ = 'This person is ' + this.name;\n    this.showInfo = function(){\n        alert(this.info);\n\
  \    }\n}\nvar person1 = new Person('Adam');\nvar person2 = new Person('Eve');\n\
  ```\n\n### 提示\n你可以定义构造函数以接受你需要的任意数量的参数：\n\n点击此处查看代码图像\n\n```javascript\nfunction\
  \ Car(Color, Year, Make, Miles) {\n    this.color = Color;\n    this.year = Year;\n\
  \    this.make = Make;\n    this.odometerReading = Miles;\n    this.setOdometer\
  \ = function(newMiles) {\n        this.odometerReading = newMiles;\n    }\n}\nvar\
  \ car1 = new Car(\"blue\", \"1998\", \"Ford\", 79500);\nvar car2 = new Car(\"yellow\"\
  , \"2004\", \"Nissan\", 56350);\n```\n\n使用对象的一个主要优势是可以在新语文中重用已写的代码。JavaScript 提供了一种修改对象以包含新方法或属性的方法，甚至基于现有对象创建全新的对象。这些技术分别被称为**扩展**（extending）和**继承**（inheriting）对象。\n\
  \n#### 扩展对象\n如果你想在对象实例化后扩展你的对象的新方法和属性怎么办？你可以使用 `prototype` 关键字来实现。原型对象允许你快速添加一个属性或方法，该方法对所有实例可用。\n\
  \n##### 自己尝试：使用原型扩展对象\n让我们为上一个示例中的 `Person` 对象扩展一个新方法 `sayHello`：\n\n点击此处查看代码图像\n\
  \n```javascript\nPerson.prototype.sayHello = function() {\n    alert(this.name +\
  \ \" says hello\");\n}\n```\n\n在你的编辑器中创建一个新的 HTML 文件，并输入列表 8.3 中的代码。\n\n**列表 8.3\
  \ 使用原型添加新方法**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>面向对象编程</title>\n\
  \    <script>\n        function Person(personName){\n            this.name = personName;\n\
  \            this.info = 'This person is called ' + this.name;\n            this.showInfo\
  \ = function(){\n                alert(this.info);\n            }\n        }\n \
  \       var person1 = new Person('Adam');\n        var person2 = new Person('Eve');\n\
  \    </script>\n</head>\n<body>\n    <input type=\"button\" value=\"Show Info on\
  \ Adam\" onclick=\"person1.showInfo()\" />\n</body>\n</html>\n```\n\n\n\n\n```html\n\
  <input type=\"button\" value=\"Show Info on Eve\" onclick=\"person2.showInfo()\"\
  \ />\n<input type=\"button\" value=\"Say Hello Adam\" onclick=\"person1.sayHello()\"\
  \ />\n<input type=\"button\" value=\"Say Hello Eve\" onclick=\"person2.sayHello()\"\
  \ />\n</</body>>\n</html>\n```\n\n* *\n\n让我们来看一下代码，看看发生了什么。\n\n首先，你定义了一个构造函数，它接收一个单一参数\
  \ `personName`。在构造函数内部，定义了两个属性 `name` 和 `info` 以及一个方法 `showInfo`。\n\n你创建了两个对象，并在实例化每个对象时使用了不同的\
  \ `name` 属性。在创建了这两个人物对象后，你决定向 `person` 对象定义中再添加一个方法 `sayHello`。你使用 `prototype` 关键字来实现这一操作。\n\
  \n将 HTML 文件加载到浏览器中。点击页面上显示的四个按钮，你会发现最初定义的 `showInfo` 方法完好无损，但新定义的 `sayHello` 方法也可以正常运行，并且该对象类型的所有现有实例可用。\n\
  \n* *\n\n### 继承\n\n`Inheritance`（继承）是从一个对象类型创建另一个对象类型的能力；新的对象类型继承旧对象的属性和方法，并可以选择拥有自己的进一步属性和方法。这可以为你节省大量工作，因为你可以先设计“通用型”的对象类，然后通过继承将它们完善为更具体的类。\n\
  \nJavaScript 同样使用 `prototype` 关键字来模拟继承。\n\n由于 `object.prototype` 被用于添加新的方法和属性，你可以利用它将现有构造函数的**所有**方法和属性添加到到你的新对象中。\n\
  \n让我们定义另一个简单的对象：\n\n点击此处查看代码图像\n\n```javascript\nfunction Pet() {\n    this.animal\
  \ = \"\";\n    this.name = \"\";\n    this.setAnimal = function(newAnimal) {\n \
  \       this.animal = newAnimal;\n    }\n    this.setName = function(newName) {\n\
  \        this.name = newName;\n    }\n}\n```\n\n`Pet` 对象拥有包含动物类型和宠物名称的属性，以及设置这些值的方法：\n\
  \n```javascript\nvar myCat = new Pet();\nmyCat.setAnimal = \"cat\";\nmyCat.setName\
  \ = \"Sylvester\";\n```\n\n现在假设你想专门为狗创建一个对象。与其从零开始，你不如说从 `Pet` 继承一个 `Dog` 对象，但添加一个额外的属性\
  \ `breed` 和一个额外的方法 `setBreed`。\n\n首先，让我们创建 `Dog` 构造函数，并在其中定义新的属性和方法：\n\n点击此处查看代码图像\n\
  \n```javascript\nfunction Dog() {\n    this.breed = \"\";\n    this.setBreed = function(newBreed)\
  \ {\n        this.breed = newBreed;\n    }\n}\n```\n\n在添加了新属性 `breed` 和新方法 `setBreed`\
  \ 后，你现在可以额外继承 `Pet` 的所有属性和方法。你使用 `prototype` 关键字来实现：\n\n```javascript\nDog.prototype\
  \ = new Pet();\n```\n\n现在你不仅可以访问 `Dog` 的属性和方法，还可以访问 `Pet` 的属性和方法：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar myDog = new Dog();\nmyDog.setName(\"Alan\");\nmyDog.setBreed(\"\
  Greyhound\");\nalert(myDog.name + \" is a \" + myDog.breed);\n```\n\n* *\n\n###\
  \ 动手尝试：扩展 JavaScript 原生对象\n\n`Prototype` 也可以用于扩展 JavaScript 的内置对象。例如，你可以实现 `String.prototype.backwards`\
  \ 方法，它将返回你提供的任何字符串的反转版本，如 Listing 8.4 所示。\n\n**列表 8.4 扩展 String 对象**\n\n点击此处查看代码图像\n\
  \n* *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Object Oriented Programming</title>\n\
  \    <script>\n        String.prototype.backwards = function(){\n            var\
  \ out = '';\n            for(var i = this.length-1; i >= 0; i--){\n            \
  \    out += this.substr(i);\n            }\n            return out;\n        }\n\
  \    </script>\n</head>\n<body>\n    <script>\n        var inString = prompt(\"\
  Enter your string:\");\n        document.write(inString.backwards());\n    </script>\n\
  </body>\n</html>\n```\n\n\n\n幸运的是，现在已经出现了一种更出色的跨浏览器代码编写方法，它是基于对象的。与其尝试检测浏览器，不如让\
  \ JavaScript 检查你需要的特定功能是否被支持，这是一个明智的主意。你可以通过测试特定对象、方法或属性的可用性来实现这一点。在许多情况下，尝试使用相关的对象、方法或属性，并检测\
  \ JavaScript 返回的值就足够了。\n\n这里有一个测试浏览器对 `document.getElementById()` 方法支持的示例，你已经遇到过它。虽然\
  \ `getElementById()` 已经被所有新浏览器支持了一段时间，但非常早期的浏览器不支持该方法。你可以使用 `if()` 来测试 `getElementById()`\
  \ 方法（或任何类似的方法或属性）的可用性：\n\n```\nif(document.getElementById) {\n    myElement = document.getElementById(id);\n\
  } else {\n    // do something else\n}\n```\n\n如果 `document.getElementById` 不可用，`if()`\
  \ 条件语句将切换代码操作，以避免使用该方法。\n\n另一种相关方法是使用 `typeof` 运算符在调用 JavaScript 函数之前检查该函数是否存在：\n\
  \n```javascript\nif(typeof document.getElementById == 'function') {\n    // you\
  \ can use getElementById()\n} else {\n    // do something else\n}\n```\n\n`typeof`\
  \ 可以返回多个可能的值，如 表 8.1 所示。\n\n![Image](img/image0040.jpeg)\n\n**表 8.1 typeof 返回的值**\n\
  \n你可以使用这种技术来检查 DOM 以及内置对象、方法和属性的存在，还可以检查在脚本中创建的那些。\n\n请注意，在整个练习过程中，你没有一次尝试过去判断用户用的是哪种浏览器——你只是想知道它是否支持你正准备使用的对象、属性或方法。这种特征检测（feature\
  \ detection）不仅比所谓的浏览器嗅探（即试图通过解释 `navigator` 对象的属性来推断正在使用的浏览器）要准确和优雅得多，而且更具前瞻性——新浏览器或新浏览器版本的引入不会破坏你代码运行的任何部分。\n\
  \n### 总结\n\n在这一小时中，你学习了 JavaScript 中的面向对象编程（OOP），从 OOP 背后的基本概念开始，并了解它是如何帮助你的代码开发，特别是对于更复杂的应用程序。\n\
  \n你学习了直接实例化对象并向其添加属性和方法的方法。然后你学习了如何创建一个对象构造函数，通过该函数你可以实例化多个相似的对象。\n\n你还学习了 `prototype`\
  \ 关键字，以及如何用它扩展对象或通过继承创建新对象。\n\n### 问答\n\n**问：我应该总是编写面向对象的代码吗？**\n\n**答：** 这是一个偏好的问题。有些程序员倾向于始终从对象、方法和属性的角度来思考，并根据这些原则编写所有代码。另一些人则认为，特别是对于较小且简单的程序，OOP\
  \ 提供的抽象程度太高，过程化编程就可以了。\n\n**问：我应该如何在其他程序中使用对象？**\n\n**答：** 对象的构造函数是一个非常可移植的实体。如果你在页面中链接了包含对象构造函数的\
  \ JavaScript 文件，你就有办法在整个代码中创建对象并使用它们的属性和方法了。\n\n### 工作坊\n\n在阅读 答案 部分之前，尝试回答所有问题。\n\
  \n#### 测验\n\n**1](#part0019.xhtml_ch08ans01)。** 从构造函数创建的新对象被称为：\na. 对象的实例\nb. 对象的方法\n\
  c. 原型\n\n**2](#part0019.xhtml_ch08ans02)。** 通过使用现有对象派生对象被称为：\na. 封装\nb. 继承\nc. 实例化\n\
  \n**3](#part0019.xhtml_ch08ans03)。** 下列哪项是创建对象的有效方式？\na. `create()`\nb. `myObject\
  \ = new`\nc. `getElementsByTagName()`\n\n#### 答案\n\n**1](#part0019.xhtml_ch08ans01)。**\
  \ 从构造函数创建的新对象被称为实例。\n\n**2](#part0019.xhtml_ch08ans02)。** 通过使用现有对象派生对象被称为继承。\n\n\
  **3](#part0019.xhtml_ch08ans03)。** `myObject = new`。\n\n#### 练习\n\n编写一个构造函数来描述 `Card`。使用\
  \ `prototype` 关键字为对象添加一个新方法 `yesterday()`，它返回上一张牌的名字（提示：使用花、、红桃、梅花、黑桃和 `Math.random()`）。\n\
  \n```javascript\nfunction Card(suit, value) {\n    this.suit = suit;\n    this.value\
  \ = value;\n}\n\nCard.prototype.yesterday = function() {\n    // 实现逻辑\n};\n```\n\
  \n编写一个脚本，创建一个包含 52 张牌的数组，并随机洗出其中一张。\n\n```javascript\nvar deck = [];\n// 填充数组的逻辑\n\
  var randomCard = deck[Math.floor(Math.random() * deck.length)];\n```\n\n\n\n当页面加载完成后，浏览器就会生成该页面的完整、分层的\
  \ DOM 表示，供我们检查。图 9.2 显示了该表示部分可能内容的简化版本。\n\n![Image](img/image00404.jpeg)\n\n**图\
  \ 9.2** 我们页面的 DOM 树形模型\n\n* * *\n\n### 注意\n\n记住，在页面加载完成之前，DOM 是不可用的。在此之前，不要尝试执行任何使用\
  \ DOM 的语句，否则你的脚本可能会产生错误。\n\n* * *\n\n看图 9.2 中的树形图与列表 9.1 中的代码之间的关系。\n\n`<html` 元素包含了页面的所有其他标记。它是两个直接`child`元素——`<head>`\
  \ 和 `<body>` 元素的`parent`父元素。这两个元素是`siblings`兄弟节点，因为它们共享同一个父元素。它们本身也是父元素；`<head>`\
  \ 元素有一个子元素 `<title>`，而 `<body>` 元素有三个子元素：`<h1>`标题、有序列表 `<ol>` 和一个段落 `<p>`。在这三个兄弟节点中，只有\
  \ `<ol>` 有子元素，即三个 `<li>` 行项目元素。树中的这些各种元素中包含文本，在图 9.2 的灰色框中表示。\n\nDOM 是作为这种关系的层级结构被构建的。构成树形图连接点和终点的方框被称为`nodes`节点。\n\
  \n### 节点类型\n\n图 9.2 显示了各种`element nodes`元素节点，每个节点代表一个 HTML 元素（如段落元素 `<p>`），以及一些`text\
  \ nodes`文本节点，它们代表此类页面元素的文本内容。\n\n* * *\n\n### 提示\n\n在存在的情况下，文本节点总是包含在元素节点内部的。然而，并不是每个元素节点都包含文本节点。\n\
  \n* * *\n\n还有许多其他节点类型，代表每个元素的属性、HTML 注释以及与页面相关的其他信息。当然，许多节点类型可以包含其他节点作为子节点。\n\n\
  每种不同类型的节点都有一个关联的数字，称为`nodeType`属性。各种类型节点的`nodeType`属性列在表 9.1 中。\n\n![Image](img/image00405.jpeg)\n\
  \n**表 9.1 nodeType 值**\n\n* * *\n\n### 提示\n\n你可能会使用节点类型 1、2 和 3 完成大部分工作，因为你正在操作页面元素、它们的属性以及这些元素所包含的文本。\n\
  \n* * *\n\n### The childNodes 属性\n\n每个节点的一个实用用 DOM 属性是其直接子元素的集合。这个类数组列表被称为 `childNodes`，它允许你访问任何\
  \ DOM 节点的子节点信息。\n\n`childNodes` 集合是一个所谓的 `NodeList`，其中的项通过数字索引。集合在外观和（在大多数情况下）行为上都像一个数组——你可以像引用数组一样引用它的成员，并可以像遍历数组一样遍历它们。但是，有几个数组方法无法使用，例如\
  \ `push()` 和 `pop()`。对于此处的的所有示例，你可以像对待普通数组一样对待该集合。\n\n节点列表动态集合（live collection），这意味着它所引用的集合的任何更改都会立即反映在列表中；发生变化时你不需要重新获取。\n\
  \n* * *\n\n### 尝试一下：使用 childNodes 属性\n\n你可以使用 `childNodes` 属性返回的集合来检查列表 9.1 中出现的有序列表元素\
  \ `<ol>`。你将编写一个小型函数来读取 `<ol>` 元素的子节点，并返回列表中存在的总数。\n\n首先，你可以通过 ID 获取 `<ol>` 元素。\n\
  \n点击此处查看代码图像\n\n```javascript\nvar olElement = document.getElementById(\"toDoList\"\
  );\n```\n\n`<ol>` 元素的子节点现在将包含在对象中：\n\n```javascript\nolElement.childNodes\n```\n\
  \n你只想选择列表中的 `<li>` 元素，所以现在你想遍历 `childNodes` 集合，只计算那些 `nodeType==1`（即对应于 HTML 元素）的节点，忽略有序列表元素中包含的任何其他内容，如注释和空白。记住，你可以几乎像处理数组一样处理该集合；在这里你像使用数组一样使用\
  \ `length` 属性：\n\n点击此处查看代码图像\n\n```javascript\nvar count = 0;\n\nfor (var i=0; i\
  \ < olElement.childNodes.length; i++) {\n    if(olElement.childNodes[i].nodeType\
  \ == 1) count++;\n}\n```\n\n* * *\n\n### 注意\n\nHTML 代码中的空白（如空格和制表符字符）在浏览器渲染页面时通常会被忽略。然而，页面元素内部空白的存在——例如在元素内部——在许多浏览器中会创建一个类型为文本的节点（在元素内部的空白）。这使得使用\
  \ `childNodes` 变得棘手。\n\n* * *\n\n让我们编写一个小函数来执行此任务，并在 alert 框中输出结果：点击此处查看代码图像\n\n\
  ```javascript\nfunction countItems() {\n    var olElement = document.getElementById(\"\
  toDoList\");\n    var count = 0;\n    for (var i=0; i < olElement.childNodes.length;\
  \ i++) {\n        if(olElement.childNodes[i].nodeType == 1) count++;\n    }\n  \
  \  alert(\"有序列表包含 \" + count + \" 项\");\n}\n\nwindow.onload = countItems;\n```\n\
  \n创建一个新的 HTML 页面，将之前的 JavaScript 代码整合到 `<script>` 元素中并加载页面。图 9.3 显示了在 Firefox 中加载的结果。\n\
  \n![Image](img/image00406.jpeg)\n\n**图 9.3** 使用 childNodes 数组\n\n* * *\n\n### firstChild\
  \ 和 lastChild\n\n对于选择 `childNodes` 数组中的第一个和最后一个元素，有一种方便的快捷方式。\n\n`firstChild` 是\
  \ `childNodes` 数组中的第一个元素。使用 `firstChild` 等同于使用 `childNodes[0]`。\n\n要访问集合的最后一个元素，使用\
  \ `lastChild` 有一个巨大的优势。否则，访问该元素你需要这样做：\n\n```javascript\nvar lastChildNode = myElement.childNodes[myElement.childNodes.length\
  \ - 1];\n```\n\n这非常丑。相反，你可以简单使用：\n\n点击此处查看代码图像\n\n```javascript\nvar lastChildNode\
  \ = myElement.lastChild;\n```\n\n### The parentNode 属性\n\n`parentNode` 属性如其名所示，返回所应用的的父父节点。在上一个示例中，你\n\
  \n```javascript\nvar parentElement = lastChildNode.parentNode;\n```\n\n将返回 `lastChildNode`\
  \ 的父元素，它当然是 `myElement` 对象。\n\n### nextSibling 和 previousSibling\n\n兄弟节点是共享同一个父节点的节点。当应用于指定的父节点时，这些只读属性分别返回下一个和上一个兄弟节点，如果不存在此类节点则返回\
  \ `null`。\n\n点击此处查看代码图像\n\n```javascript\nvar olElement = document.getElementById(\"\
  toDoList\");\nvar firstOne = olElement.firstChild;\nvar nextOne = firstOne.nextSibling;\n\
  ```\n\n* * *\n\n### 注意\n\n记住，取决于你使用的浏览器，HTML 代码中的空白可能会在 DOM 中创建文本节点。你正在处理的节点的兄弟可能比你想象的得多！\n\
  \n* * *\n\n#### Node Value\n\n\n\n\n除了 `nodeType` 之外，DOM 还提供了 `nodeValue` 属性来返回节点存储的值。你通常想使用它来返回文本节点中存储的文本。\n\
  \n假设你不像上一个例子那样计数列表项，而是想提取页面中 `<p>` 元素包含的文本。要实现这一点，你需要访问相关的 `<p>` 节点，找到它包含的文本节点，然后使用\
  \ `nodeValue` 返回信息：\n\n点击此处查看代码图片\n\n```javascript\nvar text = '';\n\nvar pElement\
  \ = document.getElementById(\"toDoNotes\");\n\nfor (var i=0; i < pElement.childNodes.length;\
  \ i++) {\n    if(pElement.childNodes[i].nodeType == 3) {\n        text += pElement.childNodes[i].nodeValue;\n\
  \    };\n}\n\nalert(\"The paragraph says:\\n\\n\" + text );\n```\n\n#### 1. 节点名称\
  \ (Node Name)\n\n`nodeName` 属性以字符串值返回指定节点的名称。`nodeName` 返回的值汇总在表 9.2 中。`nodeName`\
  \ 属性是只读的——无法更改它的值。\n\n![Image](img/image00407.jpeg)\n\n**表 9.2 nodeName 属性返回的值**\n\
  \n当 `nodeName` 返回元素名称时，它不会包含你在 HTML 源代码中使用的周围符号 `<` 和 `>`：\n\n点击此处查看代码图片\n\n```javascript\n\
  var pElement = document.getElementById(\"toDoNotes\");\n\nalert( pElement.nodeName);\
  \  // 弹出 'P'\n```\n\n#### 2. 使用 getElementsByTagName() 选择元素\n\n你已经知道如何使用 `document`\
  \ 对象的 `getElementById()` 方法访问单个页面元素。`document` 对象的另一个方法 `getElementsByTagName()`\
  \ 允许你构建一个填充了所有特定标签出现位置数组。\n\n与 `getElementById()` 类似，`getElementsByTagName()` 方法接受单个参数。然而，在这种情况下，传递给方法的参数不是元素\
  \ ID，而是所需的标签名。\n\n> **注意**\n> 请留心拼写。`Elements`（复数）在 `getElementsByTagName()` 中使用，而\
  \ `Element`（单数）在 `getElementById()` 中使用。\n\n例如，假设你想处理特定文档中的所有 `<div>` 元素。你可以使用以下方法通过一个名为\
  \ `myDivs` 的类数组集合填充变量：\n\n点击此处查看代码图片\n\n```javascript\nvar myDivs = document.getElementsByTagName(\"\
  div\");\n```\n\n> **提示**\n> 即使只有一个具有指定标签名的元素，`getElementsByTagName()` 仍然会返回一个集合，尽管它只包含一个项目。\n\
  \n你并不非对整个文档使用 `getElementsByTagName()`。它可以应用于任何单个对象，并返回该对象内部包含的给定标签名的元素集合。\n\n#####\
  \ 试一试：使用 getElementsByTagName()\n\n早些你写了一个函数来计算有序列表 (`<ol>`) 元素内部的列表项 (`<li>`) 数：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction countListItems() {\n    var olElement =\
  \ document.getElementById(\"toDoList\");\n    var count = 0;\n    for (var i=0;\
  \ i < olElement.childNodes.length; i++) {\n        if(olElement.childNodes[i].nodeType\
  \ == 1) count++;\n    }\nalert(\"The ordered list contains \" + count + \" items\"\
  );\n}\n```\n\n你使用了 `childNodes` 数组来获取所有子节点，并通过测试 `nodeType == 1` 来选取对应于元素的节点。\n\n\
  你可以通过 `getElementsByTagName()` 轻松地实现相同的函数。\n\n你以相同的方式开始，根据 `id` 选择 `<ol>` 元素：\n\n\
  点击此处查看代码图片\n\n```javascript\nvar olElement = document.getElementById(\"toDoList\"\
  );\n```\n\n现在，你可以创建一个名为 `listItems` 的数组，并用你的 `<ol>` 对象 `olElement` 中包含的所有 <li>`\
  \ 元素填充它：\n\n点击此处查看代码图片\n\n```javascript\nvar listItems = olElement.getElementsByTagName(\"\
  li\");\n```\n\n剩下的就是显示数组中有多少项了：\n\n点击此处查看代码图片\n\n```javascript\nalert(\"The ordered\
  \ list contains \" + listItems.length + \" items\");\n```\n\n列表 9.2 包含了页面的完整代码，包括修订后的函数\
  \ `countListItems()`。\n\n**列表 9.2 使用 getElementsByTagName()**\n\n点击此处查看代码图片\n\n\
  ```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>To-Do List</title>\n    <script>\n\
  \        function countListItems() {\n            var olElement = document.getElementById(\"\
  toDoList\");\n            var listItems = olElement.getElementsByTagName(\"li\"\
  );\n            alert(\"The ordered list contains \" + listItems.length + \" items\"\
  );\n        }\n        window.onload = countListItems;\n    </script>\n</head>\n\
  <body>\n    <h1>Things Do</h1>\n    <ol id=\"toDoList\">\n        <li>Mow the lawn</li>\n\
  \        <li>Clean the windows</li>\n        <li>Answer your email</li>\n      \
  \  <li>Complete the game</li>\n    </ol>\n</body>\n</html>\n```\n\n#### 3. 读取元素的属性\n\
  \nHTML 元素通常包含许多属性：\n\n点击此处查看代码图片\n\n```html\n<div id=\"id1\" title=\"report\">Here\
  \ is some text.</div>\n```\n\n属性始终位于起始标签内，每个属性的形式为 `attribute=value`。属性本身是它们所在元素节点的子节点，如图\
  \ 9.4 所示。\n\n![Image](img/image0048.jpeg)\n\n**图 属性节点**\n\n导航到感兴趣的元素节点后，你可以使用 `getAttribute()`\
  \ 方法读取其任何属性的值：\n\n点击此处查看代码图片\n\n```javascript\nvar myNode = document.getElementById(\"\
  id1\");\nalert(myNode.getAttribute(\"title\"));\n```\n\n之前的代码段会在 `alert` 对话框显示“report”。如果你尝试获取某个属性的值，`getAttribute()`\
  \ 将返回 `null`。你可以利用这一事实高效地测试元素节点是否定义特定属性：\n\n点击此处查看代码图片\n\n```javascript\nif(myNode.getAttribute(\"\
  title\")) {\n// 执行操作\n}\n```\n\n只有当 `getAttribute()` 返回非空值时，`if()` 条件才会满足，因为 `null`\
  \ 在 JavaScript 中被解释为“假”值（不是布尔值 false，但被视为如此）。\n\n> **注意**\n> 还存在一个简单称为 `attributes`\
  \ 的属性，包含了节点的所有属性数组。理论上，你可以使用数字键按照它们在 HTML 代码中出现的顺序以 `name=value` 对的形式访问属性；因此 `attributes[0].name`\
  \ 将是 `id`，而 `attributes[1].value` 将是 `'report'`。然而，在 Internet Explorer 和某些版本的 Firefox\
  \ 中的实现存在 Bug。使用 `getAttribute()` 替代它更安全。\n\n> **提示**\n> 获取元素集合的另一个有用方法是 `getElementsByClassName()`。然而，该方法直到\
  \ IE9 之前才被支持。\n\n\n\n\n\n查看节点信息的最简单方法之一是使用 Mozilla Firefox 提供的 DOM 检查器（DOM Inspector）。如果你使用\
  \ Firefox，可能会发现已经安装了 DOM 检查器，尽管从 Firefox 3 之后，它已作为一个独立的插件提供。你可以在 [https://addons.mozilla.org/en-US/firefox/addon/dom-inspector-6622/]\
  \ 下载它。\n\n安装后，你可以通过 `Ctrl+Shft+I` 为浏览器中加载的任何页面打开 DOM 检查器。打开的窗口如图 9.5 所示，显示了列表 9.1\
  \ 中网页的 DOM 表示。\n\n![Image](img/image00409.jpeg)\n\n**图 9.5** Mozilla 的 DOM 检查器\n\
  \n从左侧显示面板的树结构中选择一个 DOM 节点，右侧面板查看其详细信息。除了 DOM 树查看器，还包含了用于查看 CSS 规则、样式表、计算样式、JavaScript\
  \ 对象等的查看器。\n\n该界面初看起来可能有些令人生畏，但探索该程序的功能是非常值得的。\n\n*** 提示\n\n当你使用在本节中描述的方法修改 DOM\
  \ 时，你改变的是页面在浏览器中的显示方式。但请记住，你并没有更改文档本身。如果你要求浏览器显示页面的源代码，你不会在那里看到任何变化。\n\n这是因为浏览器实际上显示的是文档的当前\
  \ DOM 表示。改变它，就改变了屏幕上显示的内容。\n\n*** 创建新节点\n\n向 DOM 树中添加新节点是一个两个阶段的过程：\n\n1. 首先，你创建一个新节点。一旦创建，该节点最初处于一种“悬空”状态；它确实存在，但实际上并未位于\
  \ DOM 树的任何位置，因此不会显示在浏览器窗口的可见页面上。\n\n2. 接下来，你将新节点添加到树中所需的位置。此时此，它就变成了可见页面的一部分。\n\n\
  让我们看看 `document` 对象中提供的用于创建节点的一些方法。\n\n### createElement()\n\n你可以调用 `createElement()`\
  \ 方法创建新的 HTML 元素，这些元素可以是任何标准的 HTML 元素类型——段落、span、表格、列表等。\n\n假设你已经决定为文档创建一个新的 `<div>`\
  \ 元素。要做到这一点，你只需要向 `createElement` 方法传递相关的 `nodeName` 值——在此例中为 `\"div\"`：\n\n点击此处查看代码图片\n\
  \n```\nvar newDiv = document.createElement(\"div\");\n```\n\n新的 `<div>` 元素现在存在，但目前没有内容、没有属性，在\
  \ DOM 树中也没有位置。你很快就会看到如何解决这些问题。\n\n### createTextNode()\n\n你页面中的许多 HTML 元素都需要文本形式的内容。`createTextNode()`\
  \ 方法负责处理这个问题。它的工作原理与 `createElement()` 非常相似，但它接受的参数不是 `nodeName` 值，而是一个包含元素所需文本内容的字符串：\n\
  \n点击此处查看代码图片\n\n```\nvar newTextNode = document.createTextNode(\"Here is some text.\"\
  );\n```\n\n与 `createElement()` 一样，新创建的节点尚未位于 DOM 树中；JavaScript 将其存储在 `newTextNode`\
  \ 变量中，等待你将其放置在相应的位置。\n\n### cloneNode()\n\n没必要重造轮子。如果你文档中已经有一个与你想要创建的新节点相同的节点，你可以使用\
  \ `cloneNode()` 来实现。与 `createElement()` 和 `createTextNode()` 不同，`cloneNode()` 接受一个参数——一个布尔值，`true`\
  \ 或 `false`。\n\n向 `cloneNode()` 函数传递 `true` 告诉 JavaScript 你不仅想克隆该节点，还要克隆它所有的子节点：\n\
  \n点击此处查看代码图片\n\n```\nvar myDiv = document.getElementById(\"id1\");\nvar newDiv =\
  \ myDiv.cloneNode(true);\n```\n\n在这个示例中，我要求 JavaScript 克隆元素的子节点；例如，`myDiv` 包含的任何文本（将包含在元素的子节点中）都将忠实地复制到新的\
  \ `<div>` 元素中。\n\n如果我调用了：\n\n点击此处查看代码图片\n\n```\nvar newDiv = myDiv.cloneNode(false);\n\
  ```\n\n那么新的 `<div>` 元素将与原始元素相同，只是它没有子节点。例如，它将拥有属于原始元素的任何属性（前提是原始节点是一个元素）。\n\n***\
  \ 注意\n\n记住元素的 `id` 是其属性之一。当你克隆一个节点时，记住要更改你新元素的 `id`，因为 `id` 值在文档中应该是唯一的。\n\n***\
  \ 与通过 `createElement()` 和 `createTextNode()` 创建的新节点一样，通过 `cloneNode()` 创建的新节点最初是悬浮在空间中的；它在\
  \ DOM 树中还没有位置。你将看到如何实现这一点.. 操纵子节点\n\n你创建的新节点没有任何实际价值，因为它们没有显示在 DOM 的任何地方。`document`\
  \ 对象的几个方法专门设计用于将节点放入 DOM 树中，它们将在后续章节中进行描述。\n\n### appendChild()\n\n或许将新节点附加到 DOM\
  \ 最简单的方法是将其作为子节点添加到文档中已存在的节点之后。这样做只需要找到所需的父节点并调用 `appendChild()` 方法：\n\n点击此处查看代码图片\n\
  \n```\nvar newText = document.createTextNode(\"Here is text content.\");\nvar myDiv\
  \ = document.getElementById(\"id1\");\nmyDiv.appendChild(newText);\n```\n\n在前面的代码段中，创建了一个新的文本节点并将其作为子节点添加到当前存在的\
  \ `id` 为 `id1` 的 `<div>` 元素中。\n\n*** 提示\n\n记住 `appendChild()` 总是将最后一个子节点之后添加子节点，因此新添加的节点将成为父节点的新的\
  \ `lastChild`。\n\n*** 当然，`appendChild()` 对所有类型的节点都同样有效，而不仅仅是文本节点。假设你需要在父级 `<div>`\
  \ 元素内部再添加另一个 `<div>` 元素：\n\n点击此处查看代码图片\n\n```\nvar newDiv = document.createElement(\"\
  div\");\nvar myDiv = document.getElementById(\"id1\");\nmyDiv.appendChild(newDiv);\n\
  ```\n\n你原本存在的 `<div>` 元素现在包含了另一个 `<div>` 元素作为其最后一个子节点；如果父级 `<div>` 元素已经包含了一些子节点形式的文本内容，那么父级\
  \ `<div>`（在新修改的 DOM 中表示，而不是在源代码中）现在将具有如下形式：\n\n点击此处查看代码图片\n\n```html\n<div id=\"\
  id1\">\n  Original text contained in text node\n  <div></div>\n</div>\n```\n\n###\
  \ insertBefore()\n\n与其说 `appendChild()` 总是将子元素添加到子节点列表的末尾，而使用 `insertBefore()`，你可以指定一个子元素并将新节点插入其之前。\n\
  \n该方法接受两个参数：新节点，以及要插入其之前的子节点。假设你的页面包含以下 HTML 代码段：\n\n点击此处查看代码图片\n\n```html\n<div\
  \ id=\"id1\">\n  <p id=\"para1\">This paragraph contains some text.</p>\n  <p id=\"\
  para2\">Here's some more text.</p>\n</div>\n```\n\n要在当前的两个段落之间插入新段落，首先创建新段落：\n\n\
  点击此处查看代码图片\n\n```\nvar newPara = document.createElement(\"p\");\n```\n\n识别父节点，以及你想在其之前插入子节点：\n\
  \n点击此处查看代码图片\n\n\n\n\n\n```javascript\nvar myDiv = document.getElementById(\"id1\"\
  );\n\nvar para2 = document.getElementById(\"para2\");\n```\n\n然后将这两个两个作为参数传递给 `insertBefore()`：\n\
  \n点击此处查看代码图片\n\n```javascript\nmyDiv.insertBefore(newPara, para2);\n```\n\n### replaceChild()\n\
  \n当你想要用特定父元素的当前子节点替换为另一个节点时，可以使用 `replaceChild()`。该方法接受两个参数——指向新子元素的引用，紧接着是指向旧元素的引用。\n\
  \n***\n\n动手一试：替换子元素\n\n查看 列表 9.3 中的代码。\n\n**列表 9.3 替换子元素**\n\n点击此处查看代码图片\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>替换页面元素</title>\n</head>\n<body>\n  \
  \  <div id=\"id1\">\n        <p id=\"para1\">欢迎来到我的网页。</p>\n        <p id=\"para2\"\
  >请到处看看。</p>\n        <input id=\"btn\" value=\"替换元素\" type=\"button\" />\n    </div>\n\
  </body>\n</html>\n```\n\n***\n\n假设你想要使用 DOM 移除 `<div>` 中的第一个段落，并用一个 `<h2>` 标题来替换它，如下所示：\n\
  \n```html\n<h2>欢迎！</h2>\n```\n\n首先，创建一个代表 `<h2>` 标题的新节点：\n\n点击此处查看代码图片\n\n```javascript\n\
  var newH2 = document.createElement(\"h2\");\n```\n\n这个新元素需要包含一个用于标题文本的文本节点。你可以现在创建并添加它，也可以稍后将新的\
  \ `<h2>` 元素添加到 DOM 之后再做。让我们现在就做吧：\n\n点击此处查看代码图片\n\n```javascript\nvar newH2Text\
  \ = document.createTextNode(\"Welcome!\");\nnewH2.appendChild(newH2Text);\n```\n\
  \n现在你可以交换 `<div>` 元素中不需要的子节点并将其替换为新节点：\n\n点击此处查看代码图片\n\n```javascript\nvar myDiv\
  \ = document.getElementById(\"id1\");\nvar oldP = document.getElementById(\"para1\"\
  );\nmyDiv.replaceChild(newH2, oldP);\n```\n\n最后，你需要为按钮元素添加一个 `onclick` 事件处理程序，这样当点击按钮时，就会执行你的元素替换函数。我们通过一个赋值给\
  \ `window.onload` 方法的匿名函数来实现：\n\n点击此处查看代码图片\n\n```javascript\nwindow.onload = function()\
  \ {\n    document.getElementById(\"btn\").onclick = replaceHeading;\n}\n```\n\n\
  列表 9.4 显示了带有 JavaScript 的页面代码。\n\n**列表 9.4 替换子元素的完整代码**\n\n点击此处查看代码图片\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>替换页面元素</title>\n    <script>\n     \
  \   function replaceHeading() {\n            var newH2 = document.createElement(\"\
  h2\");\n            var newH2Text = document.createTextNode(\"Welcome!\");\n   \
  \         newH2.appendChild(newH2Text);\n            var myDiv = document.getElementById(\"\
  id1\");\n            var oldP = document.getElementById(\"para1\");\n          \
  \  myDiv.replaceChild(newH2, oldP);\n        }\n        window.onload = function()\
  \ {\n            document.getElementById(\"btn\").onclick = replaceHeading;\n  \
  \      }\n    </script>\n</head>\n<body>\n    <div id=\"id1\">\n        <p id=\"\
  para1\">欢迎来到我的网页。</p>\n        <p id=\"para2\">请到处看看。</p>\n        <input id=\"\
  btn\" value=\"替换元素\" type=\"button\" />\n    </div>\n</body>\n</html>\n```\n\n***\n\
  \n使用你的编辑器创建一个新的 HTML 文件，并插入 列表 9.4 中列出的代码。在浏览器中加载页面时，你应该能看到两个单行文本段落以及下方的按钮。如果一切按计划进行，点击按钮应该会将第一个\
  \ `<p>` 元素交换为你的 `<h2>` 标题，如图图 9.6](#part0020.xhtml_ch09fig6) 所示。\n\n![图 9.6](img/image0041.jpeg)\
  \ 元素替换脚本\n\n***\n\n### removeChild()\n\nDOM 专门提供了一个方法用于从树中移除子节点。再次参考 列表 9.3，如果你想移除\
  \ `id=\"para2\"` 的 `<p>` 元素，只需要使用：\n\n点击此处查看代码图片\n\n```javascript\nvar myDiv = document.getElementById(\"\
  id1\");\nvar para2 = document.getElementById(\"para2\");\nmyDiv.removeChild(para2);\n\
  ```\n\n***\n\n提示\n\n如果你没有父元素的方便引用，可以使用 `parentNode` 属性来获取它：\n\n点击此处查看代码图片\n\n```javascript\n\
  var myDiv = document.getElementById(\"id1\");\nvar para2 = document.getElementById(\"\
  para2\");\nvar parent = para2.parentNode;\nparent.removeChild(para2);\n```\n\n***\n\
  \n`removeChild()` 方法的返回值包含被移除节点的引用。如果你需要，可以使用它来处理刚刚移除的节点：\n\n点击此处查看代码图片\n\n```javascript\n\
  var myDiv = document.getElementById(\"id1\");\nvar para2 = document.getElementById(\"\
  para2\");\nvar removedNode = myDiv.removeChild(para2);\nalert('Item with id ' +\
  \ removedNode.id + ' has been removed.');\n```\n\n### 设置属性\n\n在之前我们学习了如何使用 `getAttribute()`\
  \ 方法读取元素属性。有一个对应的方法名为 `setAttribute()`，允许你为节点创建属性并赋值。该方法接受两个参数；无疑，这些要添加的属性以及它应该具有的值。\n\
  \n在下面的示例中，为 `<p>` 元素添加了 title 属性：\n\n点击此处查看代码图片\n\n```javascript\nvar myPara = document.getElementById(\"\
  para1\");\nmyPara.setAttribute(\"title\", \"Opening paragraph\");\n```\n\n设置已存在属性的值会有效地覆盖该属性的值。你可以利用这些知识来编辑现有的属性：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar myPara = document.getElementById(\"para1\");\n\
  myPara.setAttribute(\"title\", \"Opening paragraph\"); // 设置 title 属性\nmyPara.setAttribute(\"\
  title\", \"New title\"); // 覆盖 title 属性\n```\n\n### 动态加载 JavaScript 文件\n\n有时你需要在已加载的页面动态加载\
  \ JavaScript 代码。你可以使用 `createElement()` 创建包含所需代码的 `<script>` 元素，然后将此元素添加到页面中：\n\n\
  点击此处查看代码图片\n\n```javascript\nvar scr = document.createElement(\"script\");\nscr.setAttribute(\"\
  src\", \"newScript.js\");\ndocument.head.appendChild(scr);\n```\n\n记住，`appendChild()`\
  \ 方法将新子节点放在当前最后一个节点之后，因此新的 `<script>` 元素将位于页面 `<head>` 部分的末尾。\n\n但注意，如果你使用此方法动态加载\
  \ JavaScript 源文件，那么这些文件中包含的 JavaScript 代码在外部文件加载完成之前对你的页面是不可用的。建议你在尝试使用这些代码之前，先让你的程序检查这一点。\n\
  \n几乎所有现代浏览器在脚本下载完成后都会实现一个 `onload` 事件。这和你已经见过的 `window.onload` 事件相似，但它不是在主页面加载完成时触发，而是在外部资源（在本例中为\
  \ JavaScript 源文件）完全下载并可供使用时触发：\n\n点击此处查看代码图片\n\n```javascript\nscr.onload = function()\
  \ {\n    ... 当新源代码下载时要执行的操作 ...\n}\n```\n\n***\n\n警告\n\n这在旧版本的 Internet Explorer\
  \ 中不起作用，但从 IE8 开始，脚本 元素已经支持 `onload`。为了万无一失，你可能更倾向于对新加载文件中包含的资源进行对象检测。\n\n***\n\n\
  ***\n\n动手一试：动态创建的菜单\n\n\n\n\n\n在本练习中，你将使用在本节和上一节中学习的技巧来动态创建页面菜单。\n\n我们的示例 HTML 页面有一个顶级的\
  \ `<h1>` 标题，随后是几篇短文章，每篇文章由一个 `<h2>` 标题和若干段文本组成。这种格式与你会在博客、新闻页面或 RSS 阅读器输出等情况下看到的格式相似。\n\
  \n你要做的是使用 DOM 方法在页面头部自动生成一个菜单，其中的链接允许用户跳转到页面上的任何文章。HTML 文件如 列表 9.5 所示。请根据此脚本创建你自己的\
  \ HTML 文件。可以随意地使用你自己的标题和文本内容，只要章节标题包含在 `<h2>` 元素中即可。\n\n### 列表 9.5 用于创建动态菜单的 HTML\
  \ 文件\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"\
  utf-8\" />\n    <title>Scripting the DOM</title>\n    <script src=\"menu.js\"></script>\n\
  \    <script>window.onload = makeMenu;</script>\n</head>\n<body>\n    <h1>西班牙西部的埃斯特雷马杜拉地区</h1>\n\
  \    <h2>该地区的地理状况</h2>\n    <p>埃斯特雷马杜拉自治社区位于西班牙西部，邻葡萄牙边界。它邻接西班牙的卡斯蒂利亚和莱昂、卡斯蒂利亚-拉曼恰和安达卢西亚等地区，以及葡萄牙（位于西部）。其面积超过\
  \ 40,000 平方米，有两个省份：北部的卡塞雷斯和南部的巴达霍斯。</p>\n    <h2>住宿选择</h2>\n    <p>埃斯特雷马杜拉全境有各种住宿选择，包括小型旅馆和客栈（“Hostals”），如果你是团体旅行，也可以考虑租用“casa\
  \ rural”（乡村小屋）。</p>\n    <h2>气候</h2>\n    <p>通常为地中海气候，北部除外，属于大陆性气候。通常以极端天气闻名，包括非常炎热干燥且经常干旱的夏季，以及漫长而温和的冬季。</p>\n\
  \    <h2>看什么</h2>\n    <p>埃斯特雷马杜拉全年举办各类活动，包括戏剧、音乐、电影、文学和民俗。壮丽的场所包括城堡、中世纪城镇广场和历史中心。在梅里达、卡塞雷斯、阿尔坎塔拉和阿尔布尔克尔克还设有特别的夏季戏剧节。</p>\n\
  \    <h2>美食</h2>\n    <p>埃斯特雷马杜拉美食的品质源于当地食材的优质。除了散养的羊肉和牛肉、极佳的奶酪、红葡萄酒、橄榄油、蜂蜜和红椒外，埃斯特雷马杜拉还以伊比利亚火腿闻名。“黑脚猪”（pata\
  \ negra）在软橡树林中以橡果长大，这是生产世界上顶级火腿和腌制肠的关键。</p>\n</body>\n</html>\n```\n\n页面如 图 9.7\
  \ 所示。\n\n![图像](img/image00411.jpeg)\n\n**图 9.7** 具有动态创建菜单的页面\n\n第一步是获取页面上所有 `<h2>`\
  \ 元素的集合。这些元素将构成菜单中的项。对于这些标题中的每一个，创建一个指向锚点元素的链接，并将该元素放在相应的 `<h2>` 元素旁边。\n\n菜单链接将以无序列表（`<ul>`）元素中链接的形式排列。此列表将放置在一个插入到页面头部的\
  \ `<div>` 容器中。\n\n首先，获取 `<h2>` 元素的集合：\n\n点击此处查看代码图像\n\n```javascript\nvar h2s =\
  \ document.getElementsByTagName(\"h2\");\n```\n\n你需要创建一个 `<div>` 容器来存放你的菜单；在该 `<div>`\
  \ 内部，有一个 `<ul>` 列表元素来包含菜单项：\n\n点击此处查看代码图像\n\n```javascript\nvar menu = document.createElement(\"\
  div\");\nvar menuUl = document.createElement(\"ul\");\nmenu.appendChild(menuUl);\n\
  ```\n\n现在，你可以遍历 `<h2>` 标题集合了：\n\n点击此处查看代码图像\n\n```javascript\nfor(var i = 0; i <\
  \ h2s.length; i++) {\n    ... 对每个标题执行某些操作 ...\n}\n```\n\n对于文档中找到的每个标题，你都需要执行若干任务：\n\
  \n1. 获取标题子节点的内容，这构成了标题的文本：\n   ```javascript\n   var itemText = h2s[i].childNodes[0].nodeValue;\n\
  \   ```\n2. 为菜单创建一个新的列表项（`<li>`）：\n   ```javascript\n   var menuLi = document.createElement(\"\
  li\");\n   ```\n3. 将该 `<li>` 元素添加到菜单中：\n   ```javascript\n   menuUl.appendChild(menuLi);\n\
  \   ```\n4. 每个列表项必须包含一个指向标题旁边锚点的链接，该菜单项指向该锚点：\n   ```javascript\n   var menuLiA\
  \ = document.createElement(\"a\");\n   menuLiA = menuLi.appendChild(menuLiA);\n\
  \   ```\n5. 为链接设置合适的 `href` 属性（记住变量 `i` 在计数标题时会递增）。这些链接的格式为 `<a href=\"#itemX\"\
  >[标题文本]`，其中 X 是菜单项的索引数字：\n   ```javascript\n   menuLiA.setAttribute(\"href\", \"\
  #item\" + i);\n   ```\n6. 在每个 `<h2>` 标题之前创建一个匹配的锚点元素。锚点元素的格式为 `<a name=\"itemX\"\
  >`，你需要添加 `name` 属性，并定位到关联标题之前的链接：\n   ```javascript\n   var anc = document.createElement(\"\
  a\");\n   anc.setAttribute(\"name\", \"item\" + i);\n   document.body.insertBefore(anc,\
  \ h2s[i]);\n   ```\n\n当每个 `<h2>` 标题都完成完成后，你可以将新菜单添加到页面中：\n\n```javascript\ndocument.body.insertBefore(menu,\
  \ document.body.firstChild);\n```\n\nJavaScript 源文件 `menu.js` 的内容如 列表 9.6part0020.xhtml_ch09lis06\
  \ 所示。代码已整合到一个名为 `makeMenu()` 的函数中，该函数由 `window.onload` 事件调用，在页面加载后 DOM 可用时构建你的菜单。\n\
  \n### 列表 9.6 menu.js 的 JavaScript 代码\n\n[点击此处查看代码图像\n\n```javascript\nfunction makeMenu()\
  \ {\n    // 获取所有的 H2 元素\n    var h2s = document.getElementsByTagName(\"h2\");\n\
  \    // 为菜单创建一个页面元素\n    var menu = document.createElement(\"div\");\n    // 创建\
  \ UL 元素并添加到菜单 div 中\n    var menuUl = document.createElement(\"ul\");\n    menu.appendChild(menuUl);\n\
  \    // 遍历 h2 标题\n    for(var i = 0; i < h2s.length; i++) {\n        // 获取 h2 元素的文本节点\n\
  \        var itemText = h2s[i].childNodes[0].nodeValue;\n        // 添加列表项\n    \
  \    var menuLi = document.createElement(\"li\");\n        // 将其添加到菜单列表\n      \
  \  menuUl.appendChild(menuLi);\n        // 列表项包含一个链接\n        var menuLiA = document.createElement(\"\
  a\");\n        menuLiA = menuLi.appendChild(menuLiA);\n        // 设置链接的 href\n \
  \       menuLiA.setAttribute(\"href\", \"#item\" + i);\n        // 设置链接的文本\n   \
  \     var menuText = document.createTextNode(itemText);\n        menuLiA.appendChild(menuText);\n\
  \        // 创建匹配的锚点元素\n        var anc = document.createElement(\"a\");\n      \
  \  anc.setAttribute(\"name\", \"item\" + i);\n        // 将锚点添加到标题之前\n        document.body.insertBefore(anc,\
  \ h2s[i]);\n    }\n    // 将菜单添加到页面顶部\n    document.body.insertBefore(menu, document.body.firstChild);\n\
  }\n```\n\n图 9.8 显示了脚本的运行效果。\n\n\n\n\n通过使用浏览器工具检查修改后的 DOM，你可以看到为了形成菜单和锚点而添加到页面上的额外\
  \ DOM 元素。图 9.9 显示了这在 Google Chromium 开发者工具中是如何显示的，并高亮了额外的元素。\n\n![Image](img/image00413.jpeg)\n\
  \n**图 9.8** 运行中的自动菜单脚本\n\n![Image](img/image00414.jpeg)\n\n**图 9.9** 额外的 DOM 元素\n\
  \n***\n\n### 总结\n\n在这一小时中，你学习了 DOM 节点以及如何使用各种与节点相关的方法遍历 DOM。你还学习了如何使用 Mozilla 的\
  \ DOM 检查器来检查页面的 DOM。\n\n此外，你还学习了如何创建新节点并添加到 DOM，以及如何通过添加、编辑和删除 DOM 节点来动态编辑页面内容。\n\
  \n### 问答\n\n**Q. 有没有快速的方法可以判断节点是否有任何子节点？**\n\n**A.** 是的，你可以使用 `hasChildNodes()`\
  \ 方法。如果节点有一个或多个子节点，该方法返回布尔值 `true`，否则返回 `false`。记住，属性节点和文本节点不能有子节点，因此如果将其应用于这些类型的节点，该方法将始终返回\
  \ false。\n\n**Q. Mozilla 的 DOM 检查器是同类型的唯一工具吗？**\n\n**A.** 完全不是。几乎每个浏览器的开发者工具中都内置了一些\
  \ DOM 检查工具。然而，Mozilla 的 DOM 检查器提供了关于 DOM 层次结构和单个节点参数的格外清晰视图；这就是我在这里介绍它的原因。\n\n**Q.\
  \ 使用 DOM 插入和获取 HTML 还是使用 innerHTML 更好？**\n\n**A.** 两者各有优劣。要向文档中插入一段 HTML 代码，使用 `innerHTML`\
  \ 是快速且方便的。但是，它不会返回你所插入代码的引用，因此你无法很容易对该内容执行操作。DOM 方法为操纵页面元素提供了更细粒度的控制。\n\n无论你在何处使用\
  \ `innerHTML`，都可以使用 DOM 方法实现相同的结果，尽管通常需要多一点代码。\n\n同样请记住，`innerHTML` 并不是 W3C 标准。它目前得到了良好支持，但不能保证将来一直如此。\n\
  \n**Q. 我在 Web 上看到过 DOM Core 和 HTML DOM 的引用。它们是什么，它们之间有什么区别？**\n\n**A.** DOM Core\
  \ 描述了 DOM 方法的核心部分，这些方法不仅适用于 HTML 页面，还适用于使用任何类似标记语言（例如 XML）编写的页面。HTML DOM 是一个更大的集合，包含了特地与\
  \ HTML 页面相关的许多额外方法。它们确实提供了一些执行某些任务的快捷方式，但代价是会让你的代码对非 HTML 应用程序的移植性降低。\n\n书中的示例通常使用\
  \ DOM Core 方法以更具通用性。在列表 9.6 中，例如，我使用了语句\n\n```javascript\nmenuLiA.setAttribute(\"\
  href\", \"#item\" + i);\n```\n\n我同样可以使用 HTML DOM 语句\n\n```javascript\nmenuLiA.href\
  \ = \"#item\" + i;\n```\n\n这要短一点。\n\n### 课工作坊\n\n在阅读随后的“答案”部分之前，尝试回答所有问题。\n\n####\
  \ 练习\n\n**1.** 下列哪项不是节点类型？\n\n**a.** 元素 (Element)\n\n**b.** 属性 (Attribute)\n\n**c.**\
  \ 数组 (Array)\n\n**2.** `getElementsByTagName()` 方法返回：\n\n**a.** 元素对象的类数组集合\n\n**b.**\
  \ `nodeType` 值的类数组集合\n\n**c.** 标签名的类数组集合\n\n**3.** 在某些浏览器中，页面元素内的空白字符会导致创建\n\n**a.**\
  \ 文本节点\n\n**b.** 一个 JavaScript 错误\n\n**c.** 属性节点\n\n**4.** 为了创建一个新的 `<span>` 元素，你可以使用\n\
  \n**a.** `document.createElement(\"span\");`\n\n**b.** `document.createElement(span);`\n\
  \n**c.** `document.appendChild(\"span\");`\n\n**5.** 为了复制一个节点（包括其所有子节点），你可以使用\n\n\
  **a.** `cloneNode(false);`\n\n**b.** `copyNode();`\n\n**c.** `cloneNode(true);`\n\
  \n**6.** 为了将 `<img>` 元素的 `alt` 属性设置为“Company Logo”，你可以使用\n\n**a.** `setAttribute(alt,\
  \ \"Company Logo\");`\n\n**b.** `setAttribute(\"alt\", \"Company Logo\");`\n\n**c.**\
  \ `setAttribute(alt = \"Company Logo\");`\n\n#### 答案\n\n**1.** c. 数组不是节点类型。\n\n\
  **2.** a. 元素对象的类数组集合\n\n**3.** a. 文本节点\n\n**4.** a. `document.createElement(\"span\"\
  );`\n\n**5.** c. `cloneNode(true);`\n\n**6.** b. `setAttribute(\"alt\", \"Company\
  \ Logo\");`\n\n#### 练习\n\n![Image](img/image00413.jpeg) 使用表 9.1](#part0020.xhtml_ch09tab01)中的信息，编写一个函数找到找到所有的注释，并将它们合并成一个字符串。\n\
  \n![Image](img/image00414.jpeg) 如果你有 Firefox，下载并安装 DOM 检查器并熟悉其界面。使用该程序调查你喜欢的页面。\n\
  \n当你点击由代码 9.6 生成的菜单项时，页面会滚动到相关项目。返回菜单你需要手动滚动。\n\n你能修改脚本，在插入锚点的同时，在每个 `H2` 之前插入一个回到顶部链接吗？（提示：你不需要添加新链接，只需添加\
  \ `href` 和一些链接文本。）\n\n## 第 10 小节：结识 JSON\n\n***\n\n在本节中你将学习：\n\n![Image](img/image00413.jpeg)\
  \ 什么是 JSON\n\n![Image](img/image00414.jpeg) 如何模拟关联数组\n\n![Image](img/image00413.jpeg)\
  \ 关于 JSON 和对象\n\n![Image](img/image00414.jpeg) 获取 JSON 数据\n\n![Image](img/image00413.jpeg)\
  \ 使用 JSON 进行序列化\n\n![Image](img/image00414.jpeg) 如何保持 JSON 安全\n\n注意\n\nJSON 的官方主页位于\
  \ [`json.org/`](http://json.org/)，那里还有指向 Web 上各种 JSON 资源的链接。\n\n### 什么是 JSON？\n\n\
  JSON（读作“Jason”）是 JavaScript 对象的一种简单且紧凑的表示法。一旦用 JSON 表示，对象就可以很容易地转换为字符串，以便存储和传输（例如在网络上或应用程序之间）。\n\
  \n然而，JSON 的真正美之处在于，用 JSON 表示的对象实际上是用普通的 JavaScript 代码表示的。因此，你利用了 JavaScript 的“自动”解析；你只需要让\
  \ JavaScript 将 JSON 字符串的内容解释为代码，而无需额外的解析器或转换器。\n\n\n\n\nJSON 数据被表示为参数和值对的序列，每对数据都使用冒号字符来分隔参数和值。这些\
  \ `\"parameter\":\"value\"` 对之间用逗号分隔：\n\n点击此处查看代码图像\n\n\"param1\":\"value1\", \"\
  param2\":\"value2\", \"param3\":\"value3\"\n\n最后，整个序列括在大括号之间以形成一个 JSON 对象：\n\n```javascript\n\
  var jsonObject = {\n    \"param1\":\"value1\",\n    \"param2\":\"value2\",\n   \
  \ \"param3\":\"value3\"\n}\n```\n\n这里定义的 `jsonObject` 使用 JavaScript 的子集——它只是一段有效的\
  \ JavaScript 代码。使用 JSON 语法编写的对象可以使用点符号直接访问属性和方法：\n\n点击此处查看代码图像\n\n```javascript\n\
  alert(jsonObject.param1); // 输出 'value1'\n```\n\n通用地说，JSON 是字符串格式交换数据的通用语法。不仅是对象，任何可以表示为\
  \ `parameter:value` 对的数据都可以用 JSON 语法表示。这种将 JSON 对象转换为字符串的过程被称为序列化；序列化数据对于存储或在网络传输非常方便。稍后你将看到如何序列化\
  \ JSON 对象。\n\n***\n\n**注意**\n\n作为一种通用数据交换语法，JSON 可以像 XML 一样使用，尽管 JSON 对人类来说更简单。此外，解析\
  \ XML 文件可能很慢，而 JSON 则提供了一个可以直接使用的 JavaScript 对象。\n\n***\n\nJSON 最近获得了动力，因为它提供了几个重要优势。JSON\
  \ 是![Images/image00365.jpeg) 对人类和计算机都易于阅读![Images/image00365.jpeg) 概念简单——JSON 对象无非是大括号括起来的\
  \ `parameter:value` 对![Images/image00365.jpeg) 很大程度上是自明的![Images/image00365.jpeg)\
  \ 创建和解析快速。它是 JavaScript 的子集，这意味着不需要特殊的解释器或其他额外的包。包括 Flickr、Twitter 以及来自 Google 和\
  \ Yahoo 的许多在线服务和 API 现在都提供使用 JSON 语法编码的数据。\n\n***\n\n**注意**\n\n请参阅 [`www.flickr.com/services/api/response.json.html`](http://www.flickr.com/services/api/response.json.html)\
  \ 获取 Flickr 如何支持 JSON 的详情。\n\n***\n\n### JSON 数据\n\n为了恢复编码为 JSON 字符串的数据，你需要将字符串转换回\
  \ JavaScript 代码。这通常被称为字符串的*反序列化*。\n\n#### 使用 `eval()`\n\n只有较浏览器原生支持 JSON 语法（我们稍后会讨论原生浏览器支持）。由于\
  \ JSON 语法是 JavaScript 的子集，可以使用 JavaScript 函数 `eval()` 将 JSON 字符串转换为 JavaScript 对象。\n\
  \n***\n\n**注意**\n\nJavaScript 函数 `eval()` 会评估或执行传递的任何参数。如果参数是一个表达式，`eval()` 会对其求值；例如：\n\
  \n```javascript\nvar x = eval(4 * 3); // x=12\n```\n\n如果参数包含一个或多个 JavaScript 语句，`eval()`\
  \ 会执行这些语句：\n\n点击此处查看代码图像\n\n```javascript\neval(\"a=1; b=2; document.write(a+b);\"\
  ); // 在页面写入 3\n```\n\n`eval()` 函数使用 JavaScript 解释器解析 JSON 文本并产生一个 JavaScript 对象：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar myObject = eval('(' + jsonObject + ')');\n```\n\
  \n你你可以在脚本中使用该 JavaScript 对象：\n\n点击此处查看代码图像\n\n```javascript\nvar user = '{\"username\"\
  \ : \"phil\",\"location\" : \"Spain\",\"height\" : 180}';\nvar myObject = eval('('\
  \ + user + ')');\nalert(myObject.username);\n```\n\n***\n\n**注意**\n\n字符串必须这样括在括号中以避免\
  \ JavaScript 语法的歧义。\n\n***\n\n#### 使用原生支持\n\n所有现代浏览器都提供 JSON 的原生支持，使得无需使用 `eval()`。\n\
  \n***\n\n**注意**\n\n原生支持 JSON 的浏览器包括：\n\n![Images/image00365.jpeg) Firefox 3.5+\n\
  ![Images/image00365.jpeg) Internet Explorer 8+\n![Images/image00365.jpeg) Google\
  \ Chrome\n![Images/image00365.jpeg) Opera 10+\n![Images/image00365.jpeg) Safari\
  \ 4+\n\n***\n\n具有原生支持的浏览器创建一个名为 `JSON` 的 JavaScript 对象来管理编码和解码。`JSON` 对象有两个方法：`stringify()`\
  \ 和 `parse()`。\n\n##### `JSON.parse()`\n\n你可以使用 `JSON.parse()` 方法解释 JSON 字符串，它接收包含\
  \ JSON 序列化对象的字符串并将其拆分，创建一个与字符串中找到 `\"parameter\":\"value\"` 对对应的属性的对象：\n\n点击此处查看代码图像\n\
  \n```javascript\nvar Mary = '{ \"height\":190, \"age\":36, \"eyeColor\":\"brown\"\
  \ }';\nvar myObject = JSON.parse(Mary);\nvar out = \"\";\nfor (i in myObject) {\n\
  \    out += i + \" = \" + myObject[i] + \"\\n\";\n}\nalert(out);\n```\n\n你可以在图 10.1\
  \ 中看到结果。\n\n![Images/image00365.jpeg)\n\n**图 10.1** 使用 `JSON.parse()`\n\n***\n\n\
  ### 使用 JSON 进行序列化\n\n在数据存储和传输的背景下，*序列化*是将数据转换为可以在存储或跨网络传输后恢复的格式的名称。在 JSON 的情况下，字符串是序列化数据的选择格式。为了序列化你的\
  \ JSON 对象（例如发送到网络连接），你需要将其表示为字符串。在支持 JSON 的较现代浏览器中，你可以简单地使用 `JSON.stringify()` 方法创建一个对象的\
  \ JSON 编码字符串。让我们创建一个简单的对象并添加一些属性：\n\n```javascript\nvar Dan = new Object();\nDan.height\
  \ = 185;\nDan.age = 41;\nDan.eyeColor = \"blue\";\n```\n\n现在你可以使用 `JSON.stringify`\
  \ 序列化对象：\n\n```javascript\nalert( JSON.stringify(Dan) );\n```\n\n序列化对象显示在图 10.2\
  \ 中。\n\n![Images/image00365.jpeg)\n\n**图 10.2** 使用 `JSON.stringify()`\n\n***\n\n\
  ### 尝试自己：解析 JSON 字符串\n\n使用你的编辑器创建一个 HTML 文件，并输入列表 10.1 的代码。\n\n**列表 10.1 解析 JSON\
  \ 字符串**\n\n点击此处查看代码图像\n\n***\n\n\n\n\n点击此处查看代码图片\n\n```\nmyObject = JSON.parse(inString);\n\
  ```\n\n你现在可以通过遍历对象方法来构建你的输出消息字符串：\n\n点击此处查看代码图片\n\n```javascript\nfor (i in myObject)\
  \ {\n    out += \"Property: \" + i + \" = \" + myObject[i] + '\\n';\n}\n```\n\n\
  最后，显示结果：\n\n```javascript\nalert(out);\n```\n\n输出消息应该看起来像图 10.4 所示。\n\n![Image](img/image00418.jpeg)\n\
  \n**图 10.4** 解析 JSON 字符串创建的对象\n\n刷新页面并使用不同数量的 `\"parameter\":\"value\"` 键对重试脚本。\n\
  \n* *\n\n### JSON 数据类型\n\n每个 `parameter:value` 对的参数部分必须遵循几个简单的语法规则：\n\n![Image](img/image00365.jpeg)\
  \ 它不能是 JavaScript 保留关键字。\n\n![Image](img/image00365.jpeg) 它不能以数字开头。\n\n![Image](img/image00365.jpeg)\
  \ 它不能包含下划线或美元符号之外的任何特殊字符。\n\nJSON 对象中的值可以包含任何数据类型：\n\n![Image](img/image00365.jpeg)\
  \ 数字 (Number)\n\n![Image](img/image00365.jpeg) 字符串 (String)\n\n![Image](img/image00365.jpeg)\
  \ 布尔值 (Boolean)\n\n![Image](img/image00365.jpeg) 数组 (Array)\n\n![Image](img/image00365.jpeg)\
  \ 对象 (Object)\n\n![Image](img/image00365.jpeg) null（空）\n\n* *\n\n### 注意\n\nJavaScript\
  \ 语法具有几种 JSON 标准未包含的数据类型，包括 `Date`、`Error`、`Math` 和 `Function`。这些数据类型必须表示为其他数据格式，且编码和解码程序必须遵循相同的编码和解码规则。\n\
  \n* *\n\n### 模拟关联数组\n\n在第 6 小节中，“数组”我们讨论了 JavaScript 数组对象并查看了它的各种属性和方法。\n\n你可能记得\
  \ JavaScript 数组中的元素具有唯一的数字标识符：\n\n```javascript\nvar myArray = [];\nmyArray[0] =\
  \ 'Monday';\nmyArray[1] = 'Tuesday';\nmyArray[2] = 'Wednesday';\n```\n\n在许多其他编程语言中，可以使用文本键使数组更具描述性：\n\
  \n点击此处查看代码图片\n\n```javascript\nmyArray[\"startDay\"] = \"Monday\";\n```\n\n遗憾的是，JavaScript\
  \ 不直接支持这种所谓的关联数组。\n\n然而，使用对象很容易模拟它们的行为。使用 JSON 记法使代码易于阅读和理解：\n\n点击此处查看代码图片\n\n```javascript\n\
  var conference = { \"startDay\" : \"Monday\",\n    \"nextDay\"  : \"Tuesday\",\n\
  \    \"endDay\"  : \"Wednesday\"\n}\n```\n\n你现在可以访问对象属性，就像对象是关联数组一样：\n\n点击此处查看代码图片\n\
  \n```javascript\nalert(conference[\"startDay\"]);  // \"Monday\"\n```\n\n* *\n\n\
  ### 提示\n\n这种方法之所以有效是因为这两种语法\n\n`object[\"property\"]`\n\n和\n\n`object.property`\n\
  \n在 JavaScript 中是等价的。\n\n* *\n\n### 注意\n\n记住，这并不是真正的关联数组，尽管它看起来像。如果你遍历该对象，除了这三个属性之外，你还会获得任何分配给该对象的方法。\n\
  \n* *\n\n### 使用 JSON 创建对象\n\n你可能从第 6 小节中记得，表示数组的一种方便方法是使用方括号：\n\n点击此处查看代码图片\n\n\
  ```javascript\nvar categories = [\"news\", \"sport\", \"films\", \"music\", \"comedy\"\
  ];\n```\n\nJSON 为我们定义 JavaScript 对象提供了一种相当类似的简写方式。\n\n* *\n\n### 提示\n\n尽管 JSON 是为了描述\
  \ JavaScript 对象而开发的，但它独立于任何语言或平台。许多编程语言（包括 Java、PHP、C 等）都有 JSON 库和工具。\n\n* *\n\n\
  #### 属性\n\n如你所看到的，要用 JSON 记法表示对象，你使用大括号而不是方括号来包裹对象，并将对象属性列为 `\"property\":\"value\"\
  ` 对：\n\n```javascript\nvar user = {\n    \"username\" : \"philb1234\",\n    \"location\"\
  \ : \"Spain\",\n    \"height\" : 1.80\n}\n```\n\n* *\n\n### 提示\n\n你可能记得使用语句\n\n\
  ```javascript\nvar myObject = new Object();\n```\n\n会创建一个没有任何属性或方法的“空”对象实例。在 JSON\
  \ 记法中，对应的等价物显然是：\n\n```javascript\nvar myObject = {};\n```\n\n* *\n\n对象属性可以按照通常的方式立即可用：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar name = user.username;\n```\n\n#### 方法\n\n你可以这种方式添加方法，即在对象内部使用函数：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar user = {\n    \"username\" : \"philb1234\",\n\
  \    \"location\" : \"Spain\",\n    \"height\" : 1.80,\n    \"setName\": function(newName){\n\
  \        this.username = newName;\n    }\n}\n```\n\n然后你可以通常的方式调用 `setName` 方法：\n\
  \n```javascript\nsetName(prompt(\"Enter username\"));\n```\n\n### 注意\n\n虽然这种方法在\
  \ JavaScript 上文中有效，但在将 JSON 作为通用数据格式时是不允许的。请参见关于 JSON 安全的后续。\n\n* *\n\n#### 数组\n\
  \n属性值可以是数组：\n\n```javascript\nvar listObject = {\n    \"booklist\": [\"Foundation\"\
  , \"Dune\", \"Eon\", \"2001 Space Odyssey\", \"Stranger In A Land\"]\n};\n```\n\n\
  在前面的示例中，该对象有一个名为 `booklist` 的属性，其值是一个数组。\n\n```javascript\nvar book = listObject.booklist[2];\n\
  ```\n\n你可以通过传递数组键（记住数组从零开始）访问数组中的单独项：\n\n#### 对象\n\nJSON 对象甚至可以包含对象。通过使数组元素变为 JSON\
  \ 对象，你可以使用点记法访问它们。\n\n在下面的示例中，与属性 `booklist` 关联的值是 JSON 对象数组。\n\n```javascript\n\
  var bookListObject = {\n    \"booklist\": [\n        {\"title\":\"Foundation\",\
  \ \"author\":\"Isaac Asimov\"},\n        {\"title\":\"Dune\", \"author\":\"Frank\
  \ Herbert\"},\n        {\"title\":\"Eon\", \"author\":\"Greg Bear\"},\n        {\"\
  title\":\"2001 Space Odyssey\", \"author\":\"Arthur C. Clarke\"},\n        {\"title\"\
  :\"Stranger In A Strange Land\", \"author\":\"Robert A. Heinlein\"}\n    ]\n};\n\
  ```\n\n在获取书籍数组后，如前面的示例所示，可以很容易访问 `title` 和 `author` 属性：\n\n```javascript\nalert(bookListObject.booklist[2].author);\
  \ // 显示 \"Greg Bear\"\n```\n\n\n\n\n## 列表 10.2 处理多级 JSON 对象\n\n点击此处查看代码图像\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>Understanding JSON</title>\n    <script>\n\
  \    var booklistObject = {\n        \"booklist\": [{\"title\":\"Foundation\", \"\
  author\":\"Isaac Asimov\"},\n            {\"title\":\"Dune\", \"author\":\"Frank\
  \ Herbert\"},\n            {\"title\":\"Eon\", \"author\":\"Greg Bear\"},\n    \
  \        {\"title\":\"2001 A Space Odyssey\", \"author\":\"Arthur C. Clarke\"},\n\
  \            {\"title\":\"Stranger In A Strange Land\", \"author\":\"Robert A. Heinlein\"\
  }]\n    }\n    // 用于存储用户消息的变量\n    var out = \"\";\n    // 获取数组\n    var books =\
  \ booklistObject.booklist;\n    // 遍历数组，逐个获取书籍\n    for(var i =0; i<books.length;i++)\
  \ {\n        var booknumber = i+1;\n        out += \"Book \"  + booknumber +\n \
  \           \" is: '\" + books[i].title +\n            \"' by \" + books[i].author\
  \ +\n            \"\\n\";\n    }\n    </script>\n</head>\n<body onload=\"alert(out)\"\
  >\n</body>\n</html>\n```\n\n在设计好 JSON 对象后，你声明了一个变量并赋值一个空字符串。这个变量将在你构建输出消息时存储它：\n\
  `var out = \"\";`\n\n现在，你提取书籍数组，并将该数组赋值给新变量 `books`，以避免后续进行大量的冗长输入：\n\n点击此处查看代码图像\n\
  \n`var books = booklistString.booklist;`\n\n之后，你只需要遍历书籍数组，读取每个书籍对象的 `title` 和 `author`\
  \ 属性，并构造一个字符串将其追加到你的输出消息中：\n\n点击此处查看代码图像\n\n```javascript\nfor(var i =0; i<books.length;i++)\
  \ {\n    var booknumber = i+1; // 数组索引从零开始！\n    out += \"Book \"  + booknumber\
  \ +\n        \" is: '\" + books[i].title +\n        \"' by \" + books[i].author\
  \ +\n        \"\\n\";\n}\n```\n\n最后，将消息显示给用户：\n`alert(out);`\n\n运行此脚本的结果所示图 10.5。\n\
  \n![Image](img/image0041.jpeg)\n\n**图 10.5** 你的书籍信息显示给用户\n\n### JSON 安全\n\n使用 JavaScript\
  \ 的 `eval()` 函数可以执行任何 JavaScript 命令。这可能代表一个潜在的安全问题，特别是在处理来自不可信源的 JSON 数据时。\n\n使用带有原生\
  \ JSON 解析器的浏览器将 JSON 字符串转换为 JavaScript 对象会更安全。JSON 解析器只会识别 JSON 文本而不会执行脚本命令。通常，原生\
  \ JSON 解析器也比使用 `eval()` 快。\n\n原生 JSON 支持在较新的浏览器和最新的 ECMAScript (JavaScript) 标准中实现。\n\
  \n### 总结\n\n在这一小时中，你学习了 JSON 表示法，这是一种简单的数据交换语法，也可以用于创建 JavaScript 对象的实例。\n\n你学习了如何使用现代浏览器的原生\
  \ JSON 支持将对象序列化为 JSON 字符串，并将 JSON 字符串解析为 JavaScript 对象。\n\n### 问答\n\n**问. 我可以在哪里阅读官方文档？**\n\
  **答.** JSON 语法在 RFC 4627 中有正式描述。你可以在 `http://www.ietf.org/rfc/4627` 阅读它。在 JSON 的官方首页\
  \ `http://json.org/` 也有大量信息。\n\n**问. 我如何知道我的浏览器是否支持 JSON？**\n**答.** 你可以像第 8 小节 中的那样，使用\
  \ `typeof` 运算符检查 JSON 对象是否存在。点击此处查看代码图像\n\n```javascript\nif(typeof JSON == 'object')\
  \ {\n    // 你支持 JSON，继续吧！\n} else {\n    // 寻找其他工作方法，例如使用 eval()\n}\n```\n\n当然，你必须确保你的脚本没有定义自己的名为\
  \ JSON 的对象，否则它不会按预期工作。\n\n### 工作坊\n\n尝试在阅读答案 章节之前回答所有问题。\n\n#### 测验\n\n**1.** JSON\
  \ 是缩写，代表\na. JavaScript Object Notation\nb. Java Object Notation\nc. JavaScript\
  \ Object Notation\n\n**2.** 哪些操作是你可以通过 JSON 完成的？\na. 创建一个构造函数。\nb. 解析 XML 数据。\n\
  c. 直接实例化对象。\n\n**3.** 通常使用什么字符来包围 JSON 对象中的系列参数:值对？\na. 大括号 `{}`\nb. 中括号 `[]`\n\
  c. 圆括号 `()`\n\n#### 答案\n\n**1.** a. JavaScript Object Notation\n**2.** c. 直接实例化对象\n\
  **3.** a. 大括号 `{}`\n\n#### 练习题\n\n![Image](img/image0036.jpeg) 加载你的文件。将你的列表 10.1\
  \ 加载到浏览器。尝试使用数组作为属性值：`{\"days\":[\"Mon\",\"Tue\",\"Wed\"]}` 行为符合预期吗？\n\n![Image](img/image0036.jpeg)\
  \ 使用 `new Object()` 语法实例化对象。\n\n# 第四部分：HTML 和 CSS\n\n## 第 11 小节 JavaScript 和 HTML\n\
  \n在本节将学到：\n\n![Image](img/image0036.jpeg) 关于新的 HTML5 标签\n![Image](img/image0036.jpeg)\
  \ 如何处理视频和音频\n![Image](img/image0036.jpeg) 使用 `<canvas>` 元素\n![Image](img/image0036.jpeg)\
  \ HTML5 中的拖放\n![Image](img/image0036.jpeg) 使用本地存储\n![Image](img/image0036.jpeg)\
  \ 如何与本地文件交互\n\nHTML 的旧版本 HTML 4.01 自 1999 年以来一直存在。基于 XML 的 HTML 版本 一直一直是各种努力的主题，最新的是转向\
  \ XHTML2。2009 年，W3C 宣布放弃 XHTML2，并将资源转向 HTML 的新版本即 HTML5。\n\n**提示：** 注意它的写法：HTML5。在\
  \ L 和 5 之间没有空格。\n\nHTML 的最新版本专注于将 HTML 开发为 Web 应用的前端，通过语义丰富的元素扩展标记语言，引入了一些新属性，并增加了结合使用全新\
  \ API 的可能性。\n\nHTML5 标准在 2014 年秋确定为 HTML 的新标准，主流浏览器已经支持许多新的 HTML5 元素和 API。\n\n在本节中，你将学习如何用\
  \ JavaScript 控制这些强大的新功能。\n\n### HTML5 的新标记\n\n即使是格式良好的 HTML 页面也比想象的难以阅读和解释，因为标记包含的语义信息很少。侧边栏、页眉和页脚等页面部分都包含在通用页面元素（如\
  \ div）中，仅通过页面开发者定义的 ID 和类名来识别。\n\nHTML5 添加了新元素，以便更容易识别这些以及更多类型的内容。一些新标签列在表 11.1\
  \ 中。\n\n![Image](img/image0042.jpeg)\n\n**表 11.1 一些新的 HTML5 标签**\n\n### 重要新元素\n\n\
  虽然 HTML5 引入了许多有趣的新功能，但本节重点关注有助于解决某些长期困扰的新标签。\n\n#### 使用 <video> 视频播放\n\n\n\n\n\n\
  网页视频非常流行。然而，实现视频的方法通常是私有的，通过 Flash、Windows Media 和 Apple QuickTime 等插件进行播放。在某个浏览器中可用于嵌入这些元素的标记，并不总能在其他浏览器中生效。\n\
  \nHTML5 包含一个新的 `<video>` 元素，其目标是允许嵌入任何和所有的视频格式。\n\n使用新的 `<video>` 标签，你可以这样实现你喜爱的\
  \ QuickTime 电影：\n\n```html\n<video src=\"video.mov\" />\n```\n\n到目前为止，关于视频元素应该支持支持哪些视频格式（编码器）一直存在很大争论；在编写本文时，仍在寻找一种不需要特殊许可条款的编码器，尽管\
  \ WebM ([`www.webmproject.org/`](http://www.webmproject.org/)) 目前看起来是首选。目前，通过引用多个源可以解决这个问题，并避免了对浏览器嗅探的需求；目前有三种广泛支持的视频格式——MP4、WebM\
  \ 和 Ogg。\n\n点击此处查看代码图像\n\n```html\n<video id=\"vid1\" width=\"400\" height=\"300\"\
  \ controls=\"controls\">\n    <source src=\"movie.mp4\" type=\"video/mp4\" />\n\
  \    <source src=\"movie.ogg\" type=\"video/ogg\" />\n    <source src=\"movie.webm\"\
  \ type=\"video/webm\" />\n    <p>不支持 video 标签。</p>\n</video>\n```\n\n为 `<video>`\
  \ 元素包含 width 和 height 属性也是一个良好的做法。如果未设置 height 和 width，浏览器将不知道预留多少屏幕空间，导致页面布局在视频加载时发生变化。\n\
  \n还建议在 `<video>` 和 `</video>` 标签之间放置一些合适的文本，以便在不支持 `<video>` 标签的浏览器中显示。\n\n`<video>`\
  \ 标签的一些属性列在 表 11.2 中。\n\n![图像](img/image00421.jpeg)\n\n**表 11.2 <video> 元素的一些属性**\n\
  \n注意，使用 `controls` 属性添加的控件外观将取决于所使用的浏览器，如 图 11.1 所示。\n\n![图像](img/image00422.jpeg)\n\
  \n**图 11.1** 控件的外在浏览器之间不同\n\n你可以像访问任何其他 JavaScript 或 DOM 对象一样访问这些属性。对于之前的视频定义，你可以使用：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar myVideo = document.getElementById(\"vid1\").volume\
  \ += 0.1;\n```\n\n来略微增加量，或者使用\n\n点击此处查看代码图像\n\n```javascript\nif(document.getElementById(\"\
  vid1\").paused) {\n    alert(message);\n}\n```\n\n向用户传递一条消息，指示视频播放当前已暂停。\n\n###\
  \ 使用 canPlayType() 测试格式支持\n\n你可以使用 JavaScript 方法检查对特定编码器的支持情况：\n\n```javascript\n\
  media.canPlayType(type)\n```\n\n在前面的示例中，`type` 是一个包含媒体类型的字符串，例如“video/webm”。如果浏览器知道自己无法播放该内容，该方法必须返回一个空字符串。如果浏览器确定自己可以支持该格式，该方法可能会返回“probably”，否则返回“maybe”。\n\
  \n### 控制播放\n\n也可以使用 `pause()` 和 `play()` 命令通过编程方式控制播放，如下代码段所示：\n\n点击此处查看代码图像\n\n\
  ```javascript\nvar myVideo = document.getElementById(\"vid1\").play();\nvar myVideo\
  \ = document.getElementById(\"vid1\").pause();\n```\n\n### 使用 <audio> 标签播放声音\n\n\
  之前关于 `<video>` 标签的所有内容几乎同样适用于 `<audio>` 标签。使用 `<audio>` 标签的简单方法如下：\n\n点击此处查看代码图像\n\
  \n```html\n<audio src=\"song.mp3\"></audio>\n```\n\n你可以添加更多属性来实现对播放的更多控制，例如 `loop`\
  \ 和 `autoplay`：\n\n点击此处查看代码图像\n\n```html\n<audio src=\"song.mp3\" autoplay loop></audio>\n\
  ```\n\n> **提示**\n> 不要滥用 `loop` 和 `autoplay`，否则你可能会发现你的许多网站访问者不再回访！\n\n与之前的视频文件示例一样，你可以包含备用格式以确保用户的浏览器能找到一种它可以播放的格式，如下代码所示：\n\
  \n点击此处查看代码图像\n\n```html\n<audio controls=\"controls\">\n    <source src=\"song.ogg\"\
  \ type=\"audio/ogg\" />\n    <source src=\"song.mp3\" type=\"audio/mpeg\" />\n \
  \   您的浏览器不支持音频。\n</audio>\n```\n\nMP3、WAV 和 Ogg 是支持的格式。通过 `src` 属性或 `<source>` 元素可以加载音频。`<audio>`\
  \ 和 `<video>` 标签有许多可以像其他 DOM 对象一样访问的属性：\n\n```javascript\nvar soundElement = document.createElement('audio');\n\
  soundElement.setAttribute('src', 'song.ogg');\nsoundElement.\n```\n\n例如，跳转到歌曲第 45\
  \ 秒处你可能使用\n\n```javascript\nsoundElement.currentTime = 45;\n```\n\n> **提示**\n> 你可以在\
  \ [`www.whatwg.org/ipage/web-apps/video-element.html`](http://www.whatwg.org/ipage/web-apps/video-element.html)\
  \ 找到这些标签的完整参考。\n\n### 在页面上使用 canvas 绘制\n\n新的 `<canvas>` 标签为你提供了一个矩形空间，你可以在这里绘制形状，也可以加载并显示图像。使用\
  \ `<canvas>` 标签只需通过设置 `width` 和 `height` 参数来定义区域；其他图形内容均通过 JavaScript 完成。有一套被称为\
  \ Canvas 2D 方法。\n\n### 自己尝试：使用 canvas 移动球\n\n你将在 `<canvas>` 元素中创建一个动画——一个移动的红圆。页面中所需的\
  \ HTML 只有 `<canvas>` 元素本身：\n\n点击此处查看代码图像\n\n```html\n<canvas id=\"canvas1\" width=\"\
  400\" height=\"300\"></canvas>\n```\n\n所有的绘制和动画将通过 JavaScript 完成。\n\n> **提示**\n\
  > 如果你没有设置 `width` 和 `height` 参数，画布默认宽 300 像素，高 150 像素。\n\n你首先需要指定渲染上下文。在编写时，2D 是唯一广泛支持的上下文，尽管\
  \ 3D 上下正在开发中。\n\n点击此处查看代码图像\n\n```javascript\ncontext = canvas1.getContext('2d');\n\
  ```\n\n`<canvas>` 支持的所有原始形状只有矩形：\n\n点击此处查看代码图像\n\n```javascript\nfillRect(x,y,width,height);\
  \ // 绘制填充矩形\nstrokeRect(x,y,width,height); // 绘制轮廓矩形\nclearRect(x,y,width,height);\
  \ // 清除矩形\n```\n\n所有其他形状必须通过使用一个或多个路径函数来创建。由于你想画一个彩色圆盘，这就是你需要的。\n\n`<canvas>` 提供了几种不同的路径函数。\n\
  \n在不绘制任何内容的情况下移动到 x, y：\n\n```javascript\nmoveTo(x, y)\n```\n\n从当前位置到 x, y 画一条线：\n\
  \n```javascript\nlineTo(x, y)\n```\n\n绘制一个半径为 r、圆心为 x, y、从 `startAngle` 到 `endAngle`\
  \ 的圆弧。\n\n\n\n\n\n点击此处查看代码图片\n\n```arc(x, y, r, startAngle, endAngle, anti)\n```\n\
  \n将最后一个参数设置为布尔值 `true` 会使圆弧按逆时针方向绘制，而不是默认的顺时针方向。\n\n要使用这些基本命令创建形状，你需要一些额外的方法：\n\n\
  点击此处查看代码图片\n\n```javascript\nobject.beginPath();\nobject.closePath();        //完成部分形状\n\
  object.stroke();          // 绘制轮廓形状\nobject.fill();            // 绘制填充形状\n```\n\n\
  ***\n\n**提示**\n\n如果你使用 `fill` 方法，开放的形状将自动关闭，无需你手动使用 `closePath()`。\n\n***\n\n我们要生成的球将是一个实心圆。让我们让它变成红色，半径为\
  \ 15，并中心位于画布坐标 50, 50 处：\n\n点击此处查看代码图片\n\n```javascript\ncontext.beginPath();\n\
  context.fillStyle=\"#ff0000\";\ncontext.arc(50, 50, 15, 0, Math.PI*2, true);\ncontext.closePath();\n\
  ```\n\n为了让球动起来，你需要使用定时器改变球心的 x 和 y 坐标。查看 `animate()` 函数：\n\n点击此处查看代码图片\n\n```javascript\n\
  function animate() {\n    context.clearRect(0,0, 400,300);\n    counter++;\n   \
  \ x += 20 * Math.sin(counter);\n    y += 20 * Math.cos(counter);\n    paint();\n\
  }\n```\n\n该函数通过 `setInterval()` 方法被重复调用。每次调用时，都会使用 `clearRect()` 方法根据整个画布元素的大小来清空画布。在每次循环中，变量\
  \ `counter` 都会递增，然后使用其新值来重新定义圆心的位置。\n\n完整代码列在 列表 11.1 中。\n\n**列表 11.1 使用 <canvas>\
  \ 移动球**\n\n点击此处查看代码图片\n\n***\n\n```html\n<!DOCTYPE HTML>\n<html\n<head>\n    <title>HTML5\
  \ canvas</title>\n<script>\n    var context;\n    var x=50;\n    var y=50;\n   \
  \ var counter = 0;\n    function paint() {\n        context.beginPath();\n     \
  \   context.fillStyle=\"#ff0000\";\n        context.arc(x, y, 15, 0, Math.PI*2,\
  \ false);\n        context.closePath();\n        context.fill();\n    }\n    function\
  \ animate() {\n        context.clearRect(0,0, 400,300);\n        counter++;\n  \
  \      x += 20 * Math.sin(counter);\n        y += 20 * Math.cos(counter);\n    \
  \    paint();\n    }\n    window.onload = function() {\n        context= canvas1.getContext('d');\n\
  \        setInterval(animate, 100);\n    }\n</script>\n</head>\n<body>\n    <canvas\
  \ id=\"canvas1\" width=\"400\" height=\"300\">您的浏览器不支持 canvas 元素。</canvas>\n</body>\n\
  </html>\n```\n\n***\n\n创建此文件并将其加载到浏览器中。如果你的浏览器支持 `<canvas>` 元素，你应该能看到一个红盘沿着圆形路径运行，如图\
  \ 1.2。\n\n![Image](img/image0423.jpeg) 图 1.2 使用 `<canvas>`\n\n### 拖放\n\n拖放是 HTML5\
  \ 标准的一部分。几乎任何元素都可以被变为可拖拽的。要使一个元素变为可拖拽，只需要将其 `draggable` 属性设置为 true 即可：\n\n```html\n\
  <img draggable=\"true\" />\n```\n\n然而，拖动某东西本身并没有意义。为了利用可拖拽对象来实现某些功能，你可能还需要将其放置在某处。\n\
  \n要定义对象可以被放置的位置并控制拖放过程，你需要编写事件监听器来检测并控制拖放过程的各个部分。有几个不同的事件可以用于控制你的拖放：\n\n![Image](img/image0365.jpeg)\
  \ `dragstart`\n![Image](img/image0365.jpeg) `drag`\n![Image](img/image0365.jpeg)\
  \ `dragenter`\n![Image](img/image0365.jpeg) `dragleave`\n![Image](img/image0365.jpeg)\
  \ `dragover`\n![Image](img/image0365.jpeg) `drop`\n![Image](img/image0365.jpeg)\
  \ `dragend`\n\n为了控制你的拖放，你需要定义一个源元素（拖开始的地方）、数据负载（你正在拖动的内容）以及一个放置目标（接收放置物品的区域）。\n\n\
  ***\n\n**提示**\n\n并不是所有项目都可以作为放置目标——例如，`<img>` 不能接受放置。\n\n***\n\n`dataTransfer` 属性包含了拖动操作中发送的数据。`dataTransfer`\
  \ 的值通常在 `dragstart` 事件中设置，并在 `drop` 事件中读取/处理。调用 `setData(format, data)` 或 `getData(format,\
  \ data)` 将分别设置或读取这段数据。\n\n***\n\n**动手尝试：在 HTML5 中进行拖放**\n\n你将为 HTML5 拖放接口构建一个演示程序。打开你的编辑器并创建一个包含列表\
  \ 11.2 中列出的代码的文件。\n\n**列表 11.2 HTML5 拖放**\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE HTML>\n\
  <html>\n<head>\n    <title>HTML5 Drag and Drop</title>\n    <style>\n        body\
  \ {background-color: #ddd; font-family: arial, verdana, sans-serif;}\n        #drop1\
  \ {width: 200px;height: 200px;border: 1px solid black;background-color:white}\n\
  \        #drag1 {width: 50px;height: 50px;}\n    </style>\n    <script>\n      \
  \  function allowDrop(ev) {\n            ev.preventDefault();\n        }\n     \
  \   function drag(ev) {\n            ev.dataTransfer.setData(\"Text\",ev.target.id);\n\
  \        }\n        function drop(ev) {\n            var data = ev.dataTransfer.getData(\"\
  Text\");\n            ev.target.appendChild(document.getElementById(data));\n  \
  \      }\n        window.onload = function() {\n            var dragged = document.getElementById(\"\
  drag1\");\n            var drophere = document.getElementById(\"drop1\");\n    \
  \        dragged.ondragstart = drag;\n            drophere.ondragover = allowDrop;\n\
  \            drophere.ondrop = drop;\n        }\n    </script>\n</head>\n<body>\n\
  \    <div id=\"drop1\"></div>\n    <p>将下方的图片拖到上方：</p>\n    <img id=\"drag1\" src=\"\
  drag.gif\" draggable=\"true\" />\n</body>\n</html>\n```\n\n\n\n\n加载的页面应该类似于图 11.3\
  \ 所示；拖动小图像并将其释放到白色投放区域上方，你应该看到它“吸附”到 `<div>` 元素中，如图。\n\n![Image](img/image00424.jpeg)\n\
  \n图 11.3 HTML5 拖放\n\n* * *\n\n### 本地存储 (Local Storage)\n\nHTML5 页面可以在用户的浏览器中存储大量数据，而对网站性能产生任何负面影响。与通过\
  \ cookie 实现此操作相比，Web 更安全、更快。就像使用 cookie 一样，数据以键值对的形式存储，且网页只能访问其自身存储的数据。\n\n在浏览器中本地存储存储的两个新对象是：\n\
  \n![Image](img/image00365.jpeg) `localStorage`——存储无到期日的数据\n\n![Image](img/image00365.jpeg)\
  \ `sessionStorage`——仅为当前会话存储数据\n\n如果你不确定浏览器对本地存储的支持情况，可以再次使用特性检测：\n\n点击此处查看代码图像\n\
  \n```javascript\nif(typeof(Storage)!==\"undefined\") {\n    ... 两个对象均可用 ...\n}\n\
  ```\n\n要存储一个值，你可以调用 `setItem` 方法并向其传递一个键和一个值：\n\n点击此处查看代码图像\n\n```javascript\nlocalStorage.setItem(\"\
  key\", \"value\");\n```\n\n或者，你可以像使用关联数组一样使用 `localStorage` 对象：\n\n点击此处查看代码图像\n\n\
  ```javascript\nlocalStorage[\"key\"] = \"value\";\n```\n\n获取值也可以使用上述方法方法：\n\n点击此处查看代码图像\n\
  \n```javascript\nalert(localStorage.getItem(\"key\"));\n```\n\n或者\n\n```javascript\n\
  alert(localStorage[\"key\"]);\n```\n\n### 处理本地文件 (Working with Local Files)\n\n\
  最后，HTML 提供了一种与用户本地文件交互的标准方法，使用了 HTML5 的 File API 规范。访问外部文件有几种方式：\n\n![Image](img/image00365.jpeg)\
  \ `File` 提供了包括名称、大小和 MIME 类型在内的信息，并提供了文件句柄。\n\n![Image](img/image00365.jpeg) `FileList`\
  \ 是 `File` 对象的类数组序列。\n\n![Image](img/image00365.jpeg) `FileReader` 接口使用 `File` 和\
  \ `FileList` 异步读取文件。你可以检查读取进度、捕获任何错误，并发现文件何时完全加载。\n\n#### 检查浏览器支持\n\n再次，你可以通过常用的特性检测方法检查浏览器是否支持\
  \ File API：\n\n点击此处查看代码图像\n\n```javascript\nif (window.File && window.FileReader\
  \ && window.FileList) {\n    // 没问题\n}\n```\n\n* * *\n\n### 动手尝试：与本地文件系统交互\n\n在这个示例中，你将修改之前的拖放示例，允许将文件列表从本地文件系统拖入网页中。为此，你将使用\
  \ `FileList` 数据结构。\n\n查看修改后的 `drop(ev)` 函数：\n\n点击此处查看代码图像\n\n```javascript\nfunction\
  \ drop(ev) {\n    var files = ev.dataTransfer.files;\n    for (var i = 0; i < files.length;\
  \ i++) {\n        var f = files[i];\n        var pnode = document.createElement(\"\
  p\");\n        var tnode = document.createTextNode(f.name + \" (\" + f.type + \"\
  ) \" + f.size + \" bytes\");\n        pnode.appendChild(tnode);\n        ev.target.appendChild(pnode);\n\
  \    }\n    ev.preventDefault();\n}\n```\n\n在这里，从 `dataTransfer` 对象中提取出包含拖拽文件信息的类数组\
  \ `FileList`：\n\n点击此处查看代码图像\n\n```javascript\nvar files = ev.dataTransfer.files;\n\
  ```\n\n然后，通过逐一迭代文件来依次处理每个文件：\n\n点击此处查看代码图像\n\n```javascript\nfor (var i = 0; i <\
  \ files.length; i++) {\n    var f = files[i];\n    ... 处理每个文件的语句 ...\n}\n```\n\n\
  完整的列表显示在列表 11.3 中。\n\n**列表 11.3 与本地文件系统交互**\n\n点击此处查看代码图像\n\n* * *\n\n```html\n\
  <!DOCTYPE HTML>\n<html>\n<head>\n    <title>HTML5 本地文件</title>\n    <style>\n  \
  \      body {background-color: #ddd; font-family: sans-serif;}\n        #drop1 {\n\
  \            width: 400px;\n            height: 200px;\n            border: 1px\
  \ solid black;\n            background-color: white;\n            padding: 10px;\n\
  \        }\n    </style>\n    <script>\n        function allowDrop(ev) {\n     \
  \       ev.preventDefault();\n        }\n        function drop(ev) {\n         \
  \   var files = ev.dataTransfer.files;\n            for (var i = 0; i < files.length;\
  \ i++) {\n                var f = files[i];\n                var pnode = document.createElement(\"\
  p\");\n                var tnode = document.createTextNode(f.name + \" (\" + f.type\
  \ + \") \" + f.size + \" bytes\");\n                pnode.appendChild(tnode);\n\
  \                ev.target.appendChild(pnode);\n            }\n            ev.preventDefault();\n\
  \        }\n        window.onload = function() {\n            var drophere = document.getElementById(\"\
  drop1\");\n            drophere.ondragover = allowDrop;\n            drophere.ondrop\
  \ = drop;\n        }\n    </script>\n</head>\n<body>\n    <div id=\"drop1\"></div>\n\
  </body>\n</html>\n```\n\n* * *\n\n在编辑器中创建此文件并将其加载到浏览器后，你应该能够将文件从本地系统拖入投放区域，并看到它们“吸附”到\
  \ `<div>` 元素中，如图所示。\n\n![Image](img/image0045.jpeg)\n\n图 11.4 HTML5 拖放\n\n* * *\n\
  \n### 总结\n\nHTML5 为 HTML 提供了一系列新功能，使得标记语言可以作为 Web 应用更更好的基础。在本节中，你对这些新功能进行了快速浏览，并获得了使用这些新\
  \ API 的实践经验。\n\n### 问答 (Q&A)\n\n**Q：学习 HTML5 的最好方法是什么？**\n\n答：通过使用来学习。开始构建使用语义标签的页面；尝试视频播放；玩拖放和文件\
  \ API；以及使用 `<canvas>` 构建动画。如果你有疑问，互联网上有许多教程、博客和代码示例。\n\n**Q：已经有使用 HTML5 的真实网站了吗？**\n\
  \n答：当然，有很多。访问 http://html5gallery.com/ 查看示例。\n\n### 练习 (Workshop)\n\n在阅读后续“答案”章节之前，尝试回答所有问题。\n\
  \n#### 测验 (Quiz)\n\n1 下面哪一个不是有效的 HTML5 语义元素？\n\na. `<header>`\nb. `<sidebar>`\n\
  c. `<nav>`\n\n2 下面哪一个不是 `<audio>` 和 `<video>` 元素的有效方法？\n\na. `play()`\nb. `pause()`\n\
  c. `stop()`\n\n3 下面哪一个不是标准的拖放事件？\n\na. `drag`\nb. `dragover`\nc. `dragout`\n\n####\
  \ 答案 (Answers)\n\n1 b. `<sidebar>` 不是有效的 HTML5 元素。\n\n2 c. 没有 `stop()` 方法。\n\n3\
  \ c. 没有 `dragout` 事件；请使用 `dragleave`。\n\n### 习 (Exercises)\n\n回顾之前章节的某些示例，并尝试使用一些新的\
  \ HTML5 接口来重写它们。\n\n\n\n\n\n![Image](img/image00365.jpeg) 分离样式与内容\n\n![Image](img/image00365.jpeg)\
  \ DOM style 属性\n\n![Image](img/image00365.jpeg) 获取样式\n\n![Image](img/image00365.jpeg)\
  \ 设置样式\n\n![Image](img/image00365.jpeg) 使用 `className` 访问类\n\n![Image](img/image00365.jpeg)\
  \ DOM `styleSheet` 对象\n\n![Image](img/image00365.jpeg) 在 JavaScript 中启用、禁用和切换样式表\n\
  \n![Image](img/image00365.jpeg) 更改鼠标光标\n\n* * *\n\n在万维网早期，页面完全取决于其文本内容。早期的浏览器对图形效果的支持非常原始——某些浏览器甚至不支持图像。为网页设置样式在很大程度上是使用早期\
  \ HTML 版本允许的少数与样式相关的属性和标签。\n\n随着浏览器对层叠样式表（CSS）的支持，情况有了显著改善，CSS 使得页面的样式可以独立于 HTML\
  \ 标记进行处理。\n\n在本书前面的部分，你学习了如何使用 JavaScript 的 DOM 方法编辑页面的结构。然而，JavaScript 也可以用于访问和修改当前页面的\
  \ CSS 样式。在本节中你将学习如何做到这一点。\n\n### 十分钟 CSS 入门\n\n如果你已经决定学习 JavaScript，那么很有可能已经熟悉 CSS\
  \ 样式设置了。以万一你错过了它，让我们回顾一下基础知识。\n\n#### 分离样式与内容\n\n在 CSS 出现之前，HTML 页面中的大部分样式都是使用 HTML\
  \ 标签和/或其属性实现的。例如，要更改文本的字体颜色，你会使用类似下面的代码：\n\n点击此处查看代码图片\n\n```html\n<p><font color=\"\
  red\">这段文字是红色的！</font></p>\n```\n\n出于许多原因，这非常糟糕：\n\n![Image](img/image00365.jpeg)\
  \ 页面中每一段想要显示为红色的文本都必须用这些额外标签进行标记。\n\n![Image](img/image00365.jpeg) 创建的样式无法传递到其他页面；它们也必须单独使用额外的\
  \ HTML 进行标记。\n\n![Image](img/image00365.jpeg) 以后要更改页面的样式，你必须编辑每一个页面并筛选 HTML，逐个更改每个样式相关的标签和属性。\n\
  \n![Image](img/image00365.jpeg) 有了所有这些额外标记，HTML 变得非常难以阅读和维护。\n\nCSS 尝试将 HTML 元素的样式设置与该元素的标记功能分离。这是通过定义单独的*样式声明*然后将这些应用于\
  \ HTML 元素或元素集合来实现的。\n\n你可以使用 CSS 为页面元素的视觉属性设置样式，例如颜色、字体和大小，以及与格式相关的属性如定位、外边距、内边距和对齐。\n\
  \n这种分离样式与内容带来了许多好处：\n\n![Image](img/image00365.jpeg) 样式声明可以应用于多个元素，甚至（当使用外部样式表时）应用于多个页面。\n\
  \n![Image](img/image00365.jpeg) 样式声明的更改会影响所有相关的 HTML 元素，使得更新网站的样式更加准确、快速和高效。\n\n\
  ![Image](img/image00365.jpeg) 共享样式鼓励整个网站具有更一致的样式。\n\n![Image](img/image00365.jpeg)\
  \ HTML 标记更易于阅读和维护。\n\n#### CSS 样式声明\n\nCSS 样式声明的语法与 JavaScript 函数并不相似。假设你想为页面中的所有段落元素声明样式，使段落内部的字体颜色变为红色：\n\
  \n```css\np {\n    color: red\n}\n```\n\n你可以对选择的元素或元素集合应用多个样式规则，并用分号隔开：\n\n```css\n\
  p {\n    color: red;\n    text-decoration: italic;\n}\n```\n\n由于你使用了选择器 `p`，之前的样式声明会影响页面上的每一个段落元素。要只选择一个特定的页面元素，你可以使用其\
  \ ID 这样做。这样做时，用于 CSS 样式声明的选择器不是 HTML 元素的名称，而是以井字符为前缀的 ID 值。例如，HTML 元素\n\n点击此处查看代码图片\n\
  \n```html\n<p id=\"para1\">这里有一些文本。</p>\n```\n\n可以通过以下样式声明进行样式设置：\n\n```css\n#para1\
  \ {\n    font-weight: bold;\n    font-size: 12pt;\n    color: black;\n}\n```\n\n\
  使用相同的样式声明为多个页面元素设置样式，只需用逗号分隔选择器。下面的样式声明影响页面上所有的 `<div>` 元素，以及 ID 值为 `para1` 的任何元素：\n\
  \n```css\ndiv, #para1 {\n    color: yellow;\n    background-color: black;\n}\n```\n\
  \n或者，你可以通过为类名前加上点来选择所有共享特定 `class` 的元素：点击此处查看代码图片\n\n```html\n<p class=\"info\"\
  >欢迎来到我的网站。</p>\n<span class=\"info\">请登录。</span>\n```\n\n```css\n.info {\n    font-family:\
  \ arial, sans-serif;\n    color: green;\n}\n```\n\n#### 样式声明的位置\n\n与 JavaScript\
  \ 语句类似，CSS 声明可以出现在页面内，也可以保存在外部文件中。要引用外部样式表，通常做法是使用：点击此处查看代码图片\n\n```html\n<link\
  \ rel=\"stylesheet\" type=\"css\" href=\"style.css\" />\n```\n\n或者，你可以将样式声明直接放在页面的\
  \ `<head>` 中 `<style>` 和 `</style>` 标签之间：\n\n```html\n<style>\n    p {\n       \
  \ color: black;\n        font-family: tahoma;\n    }\n    h1 {\n        color: blue;\n\
  \        font-size: 22pt;\n    }\n</style>\n```\n\n最后，你可以使用 `style` 属性直接向 HTML 元素添加样式：点击此处查看代码图片\n\
  \n```html\n<p style=\"color:red; font-size:12px;\">请查看我们的服务条款。</p>\n```\n\n* * *\n\
  \n提示\n\n外部样式表中定义的样式可以多个页面，而页面内定义的则不能。\n\n* * *\n\n### DOM style 属性\n\n你在之前的章节中见过\
  \ HTML 页面是如何被浏览器表示为 DOM 树的。DOM 节点——组成 DOM 树的单个叶子和分支——对象，每个对象都有自己的属性和方法。\n\n你见过各种可以选择单个\
  \ DOM 节点或节点集合的方法，例如 `getElementById()`。\n\n每个 DOM 节点都有一个名为 `style` 的属性，它本身是一个包含父节点\
  \ CSS 样式信息的对象。让我们来看一个示例：点击此处查看代码图片\n\n```html\n<div id=\"id1\" style=\"width:200px;\"\
  >欢迎回到我的网站。</div>\n```\n\n```javascript\nvar myNode = document.getElementById(\"\
  id1\");\nalert(myNode.style.width);\n```\n\n在这种情况下，alert 将显示消息“200px.”\n\n* * *\n\
  \n注意\n\n除了 `myNode.style.width` 语法外，你还可以使用等效的 `myNode.style[\"width\"]`。在通过变量传递属性名时，这有时是必要的：点击此处查看代码图片\n\
  \n```javascript\nvar myProperty = \"width\";\nmyNode.style[myProperty] = \"200px\"\
  ;\n```\n\n* * *\n\n遗憾的是，虽然这种方法对于*内联*样式运行良好，但如果你通过页面头部的 `<style>` 元素或在外部样式表中为页面元素应用样式，DOM\
  \ 的 style 对象将无法访问它。\n\n\n\n\n\n在第 13 小节“介绍 CSS3”中，你将学习另一种在 JavaScript 中访问样式属性的方法，这种方法避免了仅适用于内联样式的限制。\n\
  \n然而，DOM `style` 对象并不是只读的；你可以使用 `style` 对象设置样式属性的值，并且通过这种方式设置的属性*将*会被 DOM `style`\
  \ 对象返回。\n\n### 注意事项\n\nCSS 包含许多带有连字符名称的属性，例如 `background-color`、`font-size`、`text-align`\
  \ 等。由于 JavaScript 属性和方法名不允许包含连字符，我们需要修改这些属性的写方式。在 JavaScript 中访问此类属性时，请删除属性名中的连字符，并将随后的字母大写，因此\
  \ `font-size` 变为 `fontSize`，`text-align` 变为 `textAlign`，以此此类推。\n\n### 尝试一下：设置样式属性\n\
  \n让我们写一个函数，使用 DOM `style` 对象在页面元素的背景颜色和字体颜色两个值之间进行切换：\n\n点击此处查看代码图像\n\n```javascript\n\
  function toggle() {\n    var myElement = document.getElementById(\"id1\");\n   \
  \ if(myElement.style.backgroundColor == 'red') {\n        myElement.style.backgroundColor\
  \ = 'yellow';\n        myElement.style.color = 'black';\n    } else {\n        myElement.style.backgroundColor\
  \ = 'red';\n        myElement.style.color = 'white';\n    }\n}\n```\n\n`toggle()`\
  \ 函数首先找到页面元素的当前 `background-color` CSS 属性，然后将该颜色与 `red` 进行比较。\n\n如果 `background-color`\
  \ 属性当前值为 `red`，它将该元素的样式属性设置为在黄色背景上显示黑色文本；否则，它将样式样式值设为在红色背景上显示白色文本。\n\n我们使用此函数来切换\
  \ HTML 文档中 `<span>` 元素的颜色。\n\n完整的代码列表如列表 12.1 所示。\n\n**列表 12.1 使用 DOM style 对象进行样式设置**\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n    <title>Setting the\
  \ style of page elements</title>\n    <style>\n        span {\n            font-size:\
  \ 16pt;\n            font-family: arial, helvetica, sans-serif;\n            padding:\
  \ 20px;\n        }\n    </style>\n    <script>\n        function toggle() {\n  \
  \          var myElement = document.getElementById(\"id1\");\n            if(myElement.style.backgroundColor\
  \ == 'red') {\n                myElement.style.backgroundColor = 'yellow';\n   \
  \             myElement.style.color = 'black';\n            } else {\n         \
  \       myElement.style.backgroundColor = 'red';\n                myElement.style.color\
  \ = 'white';\n            }\n        }\n        window.onload = function() {\n \
  \           document.getElementById(\"btn1\").onclick = toggle;\n        }\n   \
  \ </script>\n</head>\n<body>\n    <span id=\"id1\">Welcome back to my site.</span>\n\
  \    <input type=\"button\" id=\"btn1\" value=\"Toggle\" />\n</body>\n</html>\n\
  ```\n```\n\n在你的编辑器中创建该 HTML 文件并尝试一下。你会发现，当页面加载时，文本是默认的黑色且没有背景颜色。这是因为这些样式属性最初没有在页面的\
  \ `<style>` 指令、内联样式或通过 DOM 进行设置。\n\n当点击按钮时执行的 `toggle()` 函数会检查 `<span>` 元素的当前背景颜色。发现其值不是\
  \ `red` 时，`toggle()` 将背景颜色设置为红色并将文本颜色设为白色。下次点击按钮时，测试条件点击此处查看代码图像 `myElement.style.backgroundColor\
  \ == 'red'` 返回值为 `true`，导致颜色改为黄色背景上的黑色。图 2.1 显示了程序的运行情况。![Image](img/image0426.jpeg)\n\
  \n**图 2.1 在 JavaScript 中设置样式属性**\n\n#### 使用 className\n\n在本节较早些时候，我们讨论了将样式与内容分离以及这带来的益处。使用\
  \ JavaScript 编辑 `style` 对象的属性（如上一个练习所示）效果良好——但它确实带有降低这种样式与内容分离的风险。如果你的 JavaScript\
  \ 更改了元素的声明，那么页面样式的责任就不再由 CSS 承担。如果你以后决定更改样式，将必须回去编辑你所有的 JavaScript 函数。\n\n幸运的是，我们有一种机制，可以让\
  \ JavaScript 重新设置页面样式而不覆盖单个样式声明。通过使用元素的 `className` 属性，我们可以切换 `class` 属性的值以及相关的样式声明。查看列表\
  \ 2.2。\n\n**列表 12.2 修改 className**\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html\n\
  <head>\n    <title>Switching classes with JavaScript</title>\n    <style>\n    \
  \    .classA {\n            width: 180px;\n            border: 3px solid black;\n\
  \            background-color: white;\n            color: red;\n            font:\
  \ normal 24px arial, helvetica, sans-serif;\n            padding: 20px;\n      \
  \  }\n        .classB {\n            width: 180px;\n            border: 3px dotted\
  \ white;\n            background-color: black;\n            color: yellow;\n   \
  \         font: italic bold 24px \"Times New Roman\", serif;\n            padding:\
  \ 20px;\n        }\n    </style>\n    <script>\n        function toggleClass() {\n\
  \            var myElement = document.getElementById(\"id1\");\n            if(myElement.className\
  \ == \"classA\") {\n                myElement.className = \"classB\";\n        \
  \    } else {\n                myElement.className = \"classA\";\n            }\n\
  \        }\n        window.onload = function() {\n            document.getElementById(\"\
  btn1\").onclick = toggleClass;\n        }\n    </script>\n</head>\n<body>\n    <div\
  \ id=\"id1\" class=\"classA\"> An element with a touch of class.</div>\n    <input\
  \ type=\"button\" id=\"btn1\" value=\"Toggle\" />\n</body>\n</html>\n```\n\n\n\n\
  \n\n`document.styleSheets.length`\n\n## 启用、禁用和切换样式表\n\n数组中的每个样式表都有一个名为 `disabled`\
  \ 的属性，其值为布值 `true` 或 `false`。这是一个可读/写的属性，因此我们能够在 JavaScript 中有效地切换单个样式表的开启和关闭：\n\
  \n点击此处查看代码图片\n\n```javascript\ndocument.styleSheets[0].disabled = true;\ndocument.styleSheets[1].disabled\
  \ = false;\n```\n\n上述代码段“开启”了页面中的第二个样式表（索引为 1），同时“关闭”了第一个样式表（索引为 0）。\n\n列表 12.3\
  \ 包含一个工作示例。该页面上的脚本首先声明了变量 `whichSheet`，并将其初始化为零：\n\n```javascript\nvar whichSheet\
  \ = 0;\n```\n\n该变量用于跟踪两个样式表中的哪一个处于激活状态。第二行代码最初禁用了页面上两个样式表中的第二个：\n\n点击此处查看代码图片\n\n\
  ```javascript\ndocument.styleSheets[1].disabled = true;\n```\n\n函数 `sheet()` 在页面加载时附加到页面按钮的\
  \ `onClick` 事件处理程序，当点击按钮时，它会执行三个任务：\n\n![Image](img/image00365.jpeg) 禁用存储在变量 `whichSheet`\
  \ 中的样式表：\n\n点击此处查看代码图片\n\n```javascript\ndocument.styleSheets[whichSheet].disabled\
  \ = true;\n```\n\n![Image](img/image00365.jpeg) 在一和 零之间切换变量 `whichSheet` 的值：\n\n\
  点击此处查看代码图片\n\n```javascript\nwhichSheet = (whichSheet == 1) ? 0 : 1;\n```\n\n![Image](img/image00365.jpeg)\
  \ 启用与 `whichSheet` 新值对应的样式表：\n\n点击此处查看代码图片\n\n```javascript\ndocument.styleSheets[whichSheet].disabled\
  \ = false;\n```\n\n这些活动的组合效果是在页面的两个激活样式表之间切换。该脚本的运行情况如列表 12.3 和图 12.3 所示。\n\n![Image](img/image00428.jpeg)\n\
  \n**图 12.3** 使用 `styleSheets` 属性切换样式表\n\n**列表 12.3 使用 styleSheets 属性在样式表之间切换**\n\
  \n点击此处查看代码图片\n\n* * *\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>使用\
  \ JavaScript 切换样式表</title>\n    <style>\n        body {\n            background-color:\
  \ white;\n            color: red;\n            font:  normal 24px arial, helvetica,\
  \ sans-serif;\n            padding: 20px;\n        }\n    </style>\n    <style>\n\
  \        body {\n            background-color: black;\n            color: yellow;\n\
  \            font: italic bold 24px \"Times New Roman\", serif;\n            padding:\
  \ 20px;\n        }\n    </style>\n    <script>\n        var whichSheet = 0;\n  \
  \      document.styleSheets[1].disabled = true;\n        function sheet() {\n  \
  \          document.styleSheets[whichSheet].disabled = true;\n            whichSheet\
  \ = (whichSheet == 1) ? 0 : 1;\n            document.styleSheets[whichSheet].disabled\
  \ = false;\n        }\n        window.onload = function() {\n            document.getElementById(\"\
  btn1\").onclick = sheet;\n        }\n    </script>\n</head>\n<body>\n    使用下方的按钮切换样式表！br\
  \ />\n    <input type=\"button\" id=\"btn1\" value=\"Toggle\" />\n</body>\n</html>\n\
  ```\n\n* * *\n\n### 尝试一下：选择特定的样式表\n\n通过数字对样式表进行索引并不易于选择你需要的样式表。如果你有一个函数允许你为样式表命名并通过标题选择它们，情况会更简单。当你请求一个不存在的样式表时，你需要你的函数以实用的方式做出响应；你希望它保持之前的样式表并向用户发送消息。\n\
  \n首先，声明几个变量并初始化它们的值：\n\n```javascript\nvar change = false;\nvar oldSheet = 0;\n\
  ```\n\n布尔变量 `change` 用于跟踪你是否找到了具有请求名称的样式表；一旦找到，你就会将其值更改为 `true`，表示你打算更改样式表。整数 `oldSheet`\
  \ 最初设置为零，最终将分配激活样式表的编号；如果你没有找到与请求标题匹配的新样式表，你可以在返回函数之前将其重新设为激活状态。\n\n现在，你需要遍历 `styleSheets`\
  \ 数组：\n\n点击此处查看代码图片\n\n```javascript\nfor (var i = 0; i < styleSheets.length; i++)\
  \ {\n    ...\n```\n\n对于每个样式表：\n\n![Image](img/image00365.jpeg) 如果发现某个样式表是激活的，则将其索引存储在变量\
  \ `oldSheet` 中：\n\n点击此处查看代码图片\n\n```javascript\n    if(styleSheets[i].disabled ==\
  \ false) {\n        oldSheet = i;\n    }\n```\n\n![Image](img/image00365.jpeg) 在循环时，确保所有样式表都已禁用：\n\
  \n点击此处查看代码图片\n\n```javascript\n    document.styleSheets[i].disabled = true;\n```\n\
  \n![Image](img/image00365.jpeg) 如果当前样式表具有请求样式表的标题，通过将其设置为 `false` 来启用它，并立即将变量 `change`\
  \ 设置为 `true`：\n\n点击此处查看代码图片\n\n```javascript\n    if(styleSheets[i].title == mySheet)\
  \ {\n        document.styleSheets[i].disabled = false;\n        change = true;\n\
  \    }\n}\n```\n\n当你遍历完所有样式表后，根据变量 `change` 和 `oldSheet` 的状态确定你是否更改了样式表。如果没有，则将先前的样式表重新启用：\n\
  \n```javascript\nif(!change) document.styleSheets[oldSheet].disabled = false;\n\
  ```\n\n最后，函数返回变量 `change` 的值——如果已更改则返回 `true`，如果没有则返回 `false`。代码列在列表 12.4。将此代码保存为\
  \ HTML 文件并加载到浏览器中。\n\n\n\n\n当页面加载时，一个小函数 `sheet()` 会被添加到按钮的 `onClick` 事件处理程序中。每当点击按钮时，`sheet()`\
  \ 都会提示用户输入样式表的名称：\n\n点击此处查看代码图像\n\n```javascript\nvar sheetName = prompt(\"Stylesheet\
  \ Name?\");\n```\n\n然后它会调用 `ssEnable()` 函数，并将请求的名称作为参数传递。。\n\n如果函数返回 `false`，表示没有发生样式表的更改，你将向用户弹出一条消息：\n\
  \n点击此处查看代码图像\n\n```javascript\nif(!ssEnable(sheetName)) alert(\"Not found - original\
  \ stylesheet retained.\");\n```\n\n脚本的操作演示见图 12.4。\n\n![Image](img/image00429.jpeg)\n\
  \n**图 12.4** 通过名称选择新的样式表\n\n* * *\n\n### 总结\n\n在这一小时中，你学习了 JavaScript 应用于页面 CSS\
  \ 样式的多种方法。你学习了如何使用页面元素的 `style` 属性，如何处理 CSS 类，以及如何操作整个样式表。\n\n### 问与答\n\n**Q. JavaScript\
  \ 是否可以处理单独的 CSS 样式规则？**\n\n**A.** 可以的，但在编写本文时，这种方法的跨浏览器兼容性并不好。Mozilla 浏览器支持 `cssRules`\
  \ 数组，而 Internet Explorer 将等效数组称为 `Rules`。此外，不同浏览器在对“规则”概念的解释上也存在显著差异。希望未来的浏览器版本能解决这些差异。\n\
  \n**Q. 是否可以在 JavaScript 中更改鼠标光标？**\n\n**A.** 是可以的。`style` 对象有一个名为 `cursor` 的属性，它可以接受多种值。常用的光标包括：\n\
  \n![Image](img/image00365.jpeg) **Crosshair（交叉准星）**——渲染为一对像枪准星一样的交叉线。\n\n![Image](img/image00365.jpeg)\
  \ **Pointer（指针）**——通常是一个指向的手指。\n\n![Image](img/image00365.jpeg) **Text（文本）**——文本输入光标。\n\
  \n![Image](img/image00365.jpeg) **Wait（等待）**——程序正在忙碌。\n\n### 工作坊\n\n在阅读随后的“答案”部分之前，尝试回答所有问题。\n\
  \n#### 测验\n\n**1.** 要将元素 `myElement` 的 `font-family` 属性设置为 Verdana，你应该使用：\n\n**a.**\
  \ `myElement.style.font-family = \"verdana\";`\n\n**b.** `myElement.style.fontFamily\
  \ = \"verdana\";`\n\n**c.** `myElement.style.font-family(\"verdana\");`\n\n**2.**\
  \ 属性 `className` 可用于：\n\n**a.** 访问元素的 `class` 属性的值\n\n**b.** 访问元素的 `name` 属性的值\n\
  \n**c.** 为元素添加 `classname` 属性\n\n**3.** 如何启用 `styleSheets` 数组中索引为 `n` 的样式表？\n\n\
  **a.** `document.styleSheets[n].active = true;`\n\n**b.** `document.styleSheets[n].enabled\
  \ = true;`\n\n**c.** `document.styleSheets[n].disabled = false;`\n\n#### 答案\n\n\
  **1.** b. `myElement.style.fontFamily = \"verdana\";`\n\n**2.** a. 访问元素的 `class`\
  \ 属性的值。\n\n**3.** c. `document.styleSheets[n].disabled = false;`\n\n#### 练习\n\n\
  ![Image](img/image00365.jpeg) 修改代码列表 12.1 中的程序，以更改其他样式属性，如字体、装饰、元素边框、内边距和外边距。\n\n\
  ![Image](img/image00365.jpeg) 修改代码列表 12.4 的程序，使某些样式表外部链接，而不是位于页面 `<head>` 中 `<style>`\
  \ 和 `</style>` 标签之间。所有功能运行都正常吗？\n\n## 第 13 小节 引入 CSS3\n\n* * *\n\n本节你将学习：\n\n![Image](img/image00365.jpeg)\
  \ CSS3 为 CSS 带来的一些新功能\n\n![Image](img/image00365.jpeg) 使用特定厂商的前缀和扩展\n\n![Image](img/image00365.jpeg)\
  \ CSS3 属性的跨浏览器设置\n\n![Image](img/image00365.jpeg) 在 JavaScript 中高效地设置 CSS3 属性\n\n\
  * * *\n\n使用 CSS3，你可以轻松地实现许多酷炫的新效果，而无需使用大量的 JavaScript 代码和/或外部图形应用程序。\n\n### 厂商特定的属性和扩展\n\
  \n厂商前缀是浏览器公司在这些功能成为 CSS3 规范之前添加支持的一种方式。在大多数情况下，如果需要前缀，请参考表 13.1 所示浏览器。例如，在本节晚些时候你将学习\
  \ CSS3 过渡。在那里你会看到，如果你想为页面添加 CSS3 过渡，你需要使用带有前缀的过渡属性：\n\n点击此处查看代码图像\n\n```css\n-webkit-transition:\
  \ 0.5s ease;\n-moz-transition: 0.5s ease;\n-o-transition: 0.5s ease;\ntransition:\
  \ 0.5s ease;\n```\n\n用户的浏览器将响应它理解的过渡版本，忽略其他的。幸运的是，浏览器制造商正在努力实现所有的功能，对于大多数现代浏览器，需要前缀的属性数量正在迅速减少。\n\
  \n* * *\n\n提示\n\n编写时，有一个关于哪些功能/浏览器组合需要前缀的实用汇总 [`shouldiprefix.com/`](http://shouldiprefix.com/)。\n\
  \n有关特定浏览器和版本支持的功能频繁更新列表，请访问 [`www.w3schools.com/cssref/css3_browsupport.asp`](http://www.w3schools.com/cssref/css3_browsupport.asp)。\n\
  \n* * *\n\n注意\n\n属性的前缀版本可能与 CSS3 规范中描述的属性并不完全相同。即使厂商特定的扩展通常可以避免冲突（因为每个厂商都有独特的前缀），但请记住，此类扩展可能会根据厂商进行更改，因为它们并不是\
  \ CSS3 规范的一部分，尽管它们尝试得像即将推出的 CSS3 属性。\n\n同样记住，厂商特定的扩展几乎无法通过 CSS 验证。\n\n* * *\n\n\
  ### CSS3 边框\n\nCSS3 让可以在边框上实现一些非常酷的功能，这以前只能通过大量丑陋且难以维护的代码黑科技来实现。\n\n在本节中，我们将查看两个示例：盒投影和圆角。\n\
  \n#### 创建盒投影\n\n\n\n\n`box-shadow` 属性允许你为页面的框元素添加投影。如表 13.2 所示，你可以分别指定颜色、大小、模糊和偏移的值：\n\
  \n![Image](img/image00431.jpeg)\n\n**表格 13.2 box-shadow 属性的参数**\n\n这是一个示例，使用了一个\
  \ 10px 宽、向右下方偏移的投影，在整个宽度上进行了模糊处理，颜色为中灰色：\n\n点击此处查看代码图像\n\n```\n#div1 {\nbackground-color:\
  \ #8080ff;\nwidth: 400px;\nheight: 250px;\nbox-shadow: 10px 10px 10px #808080;\n\
  -webkit-box-shadow: 10px 10px 10px #808080;\n-moz-box-shadow: 10px 10px 10px #808080;\n\
  }\n```\n\n在图 13.1 中，你可以看到这种样式应用于网页中 `<div>` 元素的示例。\n\n![Image](img/image00432.jpeg)\n\
  \n**图 13.1** CSS3 阴投影\n\n## 使用 border-radius 属性实现圆角\n\n`border-radius` 属性允许为页面元素添加圆角，而无需专门创建圆角图像，这可能是\
  \ CSS3 新引入的最受欢迎的功能之一。\n\n`border-radius` 属性已经得到了广泛的浏览器支持，尽管 Mozilla Firefox 比某些竞争对手多了一段时间需要\
  \ `-moz-` 前缀；因此，如果你需要支持之前的几个版本的 Firefox，应该考虑包含带前缀的版本：\n\n```\n#div1 {\n-moz-border-radius:\
  \ 25px;\nborder-radius: 25px;\n}\n```\n\n在图 13.2 中，你可以看到一个带有圆角样式的 `<div>` 元素的示例。\n\
  \n![Image](img/image00433.jpeg)\n\n**图 13.2** CSS3 圆角\n\n可以使用单独的属性 `border-bottom-left-radius`、`border-top-left-radius`、`border-bottom-right-radius`\
  \ 和 `border-top-right-radius` 独立指定圆角，也可以像我们在这里所做的，使用 `border-radius` 属性在一个语句中指定四个角。\n\
  \n### CSS3 背景\n\nCSS3 包含了几个新的背景属性，允许对背景元素进行更具体的控制。\n\n在本节中，你将学习 `background-size`\
  \ 和 `background-origin` 属性，以及如何使用多个背景图像。\n\n#### background-size 属性\n\n`background-size`\
  \ 属性为 CSS 增加了一个新功能，允许你使用长度、百分比或两个关键字 `contain` 或 `cover` 来设置背景图像的大小。\n\n使用长度和百分比指定背景的大小正如你所期的那样。对于每个背景图像，可以提供两个长度或百分比，分别对应宽度和高度。（当使用百分比时，这些值相对于背景可用空间，而不是背景图像的宽度和高度。）\n\
  \n`auto` 关键字可以代替宽度或高度值。如果你只为 `background-size` 指定一个值，则该值被假认为宽度。高度将默认为 `auto`。\n\n\
  点击此处查看代码图像\n\n```\n#div1 {\nbackground-size: 400px;\nbackground-image: url(lake.png);\n\
  width: 400px;\nheight: 250px;\nborder-radius: 25px;\n}\n```\n\n在这里，我将背景宽度设置为与 `<div>`\
  \ 元素相同（为了保险，我还额外设置了圆角）。结果如图 13.3\n\n**图 13.3** 在 CSS3 中设置背景大小\n\n#### background-origin\
  \ 属性\n\n`background-origin` 属性用于设置框内背景位置的计算方式。\n\n它接受三个值之一：`padding-box`、`border-box`\
  \ 或 `content-box`。\n\n当你提供 `padding-box` 值时，位置相对于内边距边缘的左上角。使用 `border-box` 时，它相对于边框的左上角，而\
  \ `content-box` 意味着背景相对于内容的左上角定位。\n\n### 多背景图像\n\nCSS3 允许通过使用逗号分隔的列表为框元素使用多个背景图像。列表的顺序非常重要，提供的第一个值代表离用户最近的层，列表中的后续项目将依次渲染在在其更远处的层。这是一个示例：\n\
  \n点击此处查看代码图像\n\n```\n#div1 {\nwidth: 600px;\nheight: 600px;\nbackground-image: url(lake.png),\
  \ url(boat.png);\nbackground-position: center;\nbackground-repeat: no-repeat;\n\
  }\n```\n\n\n\n\n# 图 13.7 移动径向渐变的中心\n\n* * *\n\n> 提示：CSS3 渐变的功能远比我这里能描述的多得多，包括使用两种以上的颜色、透明度以及对渐变形状和大小的修改。你甚至可以在同一个元素上添加多个渐变。详情请见\
  \ W3C 文档：[`www.w3.org/TR/2011/WD-css3-images-20110217/`](http://www.w3.org/TR/2011/WD-css3-images-20110217/)\n\
  \n* * *\n\n### CSS3 文字效果\n\nCSS3 包含了一些新功能，可以帮助你操作文本。\n\n### 文字阴影 (Text Shadow)\n\
  \n在 CSS3 中，`text-shadow` 属性将阴应用于应用于的方式与块级元素的 `box-shadow` 属性几乎相同。你可以指定水平和垂直阴影距离，以及可选的模糊距离阴影颜色：\n\
  \n点击此处查看代码图片\n\n```\nh3 {\n  text-shadow: 10px 10px 3px #333;\n  font-size: 26px;\n\
  }\n```\n\n你可以在 图 13.8 中看到示例。\n\n![Image](img/image00439.jpeg)\n\n图 13.8 CSS3 文字阴影\n\
  \n### 自动换行 (Word Wrap)\n\n如果一个单词太长，无法放入包含它的块元素中，它就会溢出容器。在 CSS3 中，你可以使用 `word-wrap`\
  \ 属性强制文本换行，即使它必须在单词中间换行：\n\n```\np {\n    word-wrap: break-word;\n}\n```\n\n## CSS3\
  \ 过渡、变换和动画\n\n传统上，程序员使用自定义的 JavaScript 代码为页面元素创建运动，这在跨浏览器方式中实现起来可能棘手。如果有更简单的方法为页面上的元素添加简单效果，那就更好了。\n\
  \n这些功能正以过渡、变换和动画的形式在 CSS3 中引入。它们在大多数浏览器中已经具有了不同程度的支持。\n\n在接下来的简单示例中，我们添加了一个过渡效果（在支持它的浏览器中），以便在链接悬停时更改背景颜色。随着背景颜色的变化，过渡效果将平滑处理变换。\n\
  \n这里是我们的示例链接代码：\n\n点击此处查看代码图片\n\n```\n<a href=\"somepage.html\" class=\"trans\"\
  \ id=\"link1\">Show Me</a\n```\n\n以下是 CSS 声明，显示了原始背景颜色和悬停背景颜色，以及在各种不同浏览器中执行过渡效果的声明。请注意所需的不同前缀范围，正如在本小时早些时候讨论的那样。最后一个没有前缀的声明将在该技术从实验阶段变为完成状态后成为所需的声明。\n\
  \n点击此处查看代码图片\n\n```\na.trans {\n    background: #669999;\n    -webkit-transition:\
  \ background 0.5s ease;\n    -moz-transition: background 0.5s ease;\n    -o-transition:\
  \ background 0.5s ease;\n    transition: background 0.5s ease;\n}\na.trans:hover\
  \ {\n    background: #999966;\n}\n```\n\n* * *\n\n> 注意：你可以在 [`css3.bradshawenterprises.com/all/`](http://css3.bradshawenterprises.com/all/)\
  \ 找到关于 CSS3 过渡、变换和动画的全面信息。\n\n* * *\n\n## 在 JavaScript 中引用 CSS3 属性\n\nCSS3 和 JavaScript\
  \ 的结合带来了具有流畅性能、高可靠性和最小代码复杂的优秀效果。在本节中，我们将查看在 JavaScript 代码内部成功获取和设置 CSS3 属性的方法。\n\
  \n### 将 CSS 属性名转换为 JavaScript\n\n正如我在第 12 小 中提到的，“JavaScript 和 CSS](#part0024.xhtml_ch12)”，为了使\
  \ CSS 属性名称与 JavaScript 命名规范兼容，CSS 属性名需要从它们样式表中的格式进行细小的转换。\n\nJavaScript 版本不再像 CSS\
  \ 那样使用小写名称和连字符，而是去除了连字符并将后续字符大写化。因此，`border-radius` 变为 `borderRadius`。没有连字符的属性名（如\
  \ `width`）保持不变。\n\n你已经在第 12 小 中看到如何使用这种命名规范结合 DOM `style` 属性访问元素样式属性：\n\n点击此处查看代码图片\n\
  \n```\nvar bRad = document.getElementById(\"div1\").style.borderRadius;\n```\n\n\
  正如我当时提到的，虽然这很有用，但它限于具有内联样式的元素；对于在页面头 `<style>` 元素中或在外部文件中分组了 CSS 声明的元素，它将不起作用。幸运的是，有一种更好的方法，我现在将讨论。\n\
  \n### DOM getComputedStyle() 方法\n\n现在几乎所有浏览器都支持 DOM `getComputedStyle()` 方法，该方法可以访问元素的最终（即计算出的）样式。`getComputedStyle()`\
  \ 方法返回一个包含各种方法的对象，包括 `getPropertyValue(property)`，它返回给定的 CSS 属性当前值：\n\nvar myDiv\
  \ = document.getElementById(\"div1\");\nvar bRad = getComputedStyle(myDiv).getPropertyValue(\"\
  borderRadius\");\n\n* * *\n\n### 尝试一下：控制光效果\n\n让我们创建一个应用程序，使用 `box-shadow` 和 `radial-gradient`（均由\
  \ JavaScript 控制），在 HTML 页面中控制光影效果。代码在列表 13.1 中显示。\n\n**列表 13.1 控制光效果** 点击此处查看代码图片\n\
  \n\n\n\n\n你可以在图 13.9 中看到页面的实际效果。\n\n![Image](img/image0044.jpeg)\n\n### 图 13.9 使用\
  \ JavaScript 控制 CSS3\n\n注意，这些效果的创建没有使用任何图像——这在 CSS3 出现之前是不可能的。\n\n* *\n\n### 使用厂商前缀设置\
  \ CSS3 属性\n\n你已经了解了如何获取 CSS 属性，但当不同的浏览器支持该属性的不同变体时（即具有不同的前缀），你该如何使用 JavaScript 来*设置*一个\
  \ CSS3 属性呢？\n\n当浏览器支持某个特定的 CSS 属性时，当你从页面元素请求该属性时，它会返回一个字符串值。（如果该属性尚未设置，则将返回空字符串。）如果你的浏览器不支持该属性，则返回\
  \ `undefined`。因此，你可以在设置 CSS3 属性之前轻松地进行测试，以确定支持该属性的种变体。\n\n让我们编写一段代码，接收一个可能的 CSS3\
  \ 属性数组，并返回浏览器支持的某一个。\n\n点击此处查看代码图像\n\n```javascript\nfunction getCss3Property(properties){\n\
  \n    // 遍历所有可能的属性名\n    for (var i=0; i<properties.length; i++) {\n        // 如果该元素存在此属性\n\
  \        if (properties[i] in document.documentElement.style) {\n            //\
  \ 返回关联的字符串\n            return properties[i];\n        }\n    }\n}\n```\n\n通过这种方法，我们可以返回适当适当版本。\n\
  \n让我们看看这对于在本小时之前使用的过渡（transition）是如何工作的：\n\n点击此处查看代码图像\n\n```javascript\n// 获取正确的\
  \ CSS3 过渡属性\nvar myTrans = getCss3Property(['transition', 'MozTransition', 'WebkitTransition',\n\
  'msTransition', 'OTransition'])\n// 为 \"link1\" 设置 CSS 过渡\ndocument.getElementById(\"\
  link1\").style[myTrans] = \"background 0.5s ease\" ;\n```\n\n假设我正在使用的 Firefox 版本不支持\
  \ CSS3 `transition` 属性，但支持 Mozilla 自己的版本 `MozTransition`（对应 `-moz-transition`）。\n\
  \n当调用时，`getCss3Property()` 函数将开始遍历各种厂商类型的过渡属性列表。在对属性 `transition` 返回 `undefined`（因为浏览器不支持它）后，在下一次循环中，它将退出函数，并返回字符串值\
  \ `MozTransition`。现在我们知道在接下来的行代码中应该设置哪个版本的属性了。\n\n### 总结\n\n在本小时中，你学习了 CSS3 为 Web\
  \ 设计带来的一些新功能。你看到了不同的浏览器制造商如何通过自定义前缀来实现新的或实验性的 CSS3 特性，并看到了如何使用 JavaScript 访问和设置这些自定义特性。\n\
  \n### 问答\n\n**Q. 目前哪些浏览器支持 CSS3 过渡（transitions）、变换（transforms）和动画（animations）？**\n\
  \n**A.** 在编写时，2D 变换在所有流行的浏览器中均可用，而 3D 变换在 Safari、Chrome/Chromium 和 Firefox 中支持。过渡和\
  \ 3D 变换是在 IE10 中添加的。这些效果都有合理的降级处理，因此使用不支持浏览器的用户仍然可以使用，但看不到带动画的页面元素。\n\n**Q. 为什么多个不同的浏览器厂商都使用\
  \ -webkit- 前缀？**\n\n**A.** WebKit 是用于在 浏览器中渲染网页的布局引擎。WebKit 引擎是许多流行浏览器的基础，包括 Safari、Chrome/Chromium\
  \ 以及适用于桌面和移动平台的各种其他浏览器。\n\n### 工作坊\n\n在阅读随后的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1.**\
  \ 下面哪项将正确指定从左下角到右上角的线性渐变（linear gradient）？\n\n**a.** `linear-gradient(upper right,\
  \ #112244 , #6699cc);`\n\n**b.** `linear-gradient(top right, #112244 , #6699cc);`\n\
  \n**c.** `linear-gradient(to top right, #112244 , #6699cc);`\n\n**2.** 你如何在 JavaScript\
  \ 中引用 `text-shadow` 属性？\n\n**a.** `textShadow`\n\n**b.** `text-Shadow`\n\n**c.**\
  \ `text-shadow`\n\n**3.** 下面哪项将正确渲染多个背景图像，使 image cactus.png 显示在 image desert.jpg\
  \ 之前？\n\n**a.** `background-image: cactus.png, desert.jpg;`\n\n**b.** `background-image:\
  \ url(cactus.png);`\n\n**c.** `background-image: url(desert.jpg);`\n\n#### 答案\n\n\
  **1.** c. `linear-gradient(to top right, #112244 , #6699cc);`\n\n**2.** a. `textShadow`\n\
  \n**3.** b. `background-image: url(cactus.png), url(desert.jpg);`\n\n\n\n\n\n![Image](img/image00365.jpeg)\
  \ 使用编写良好的库确实可以消除编写跨浏览器 JavaScript 的某些烦恼。你无法让每个浏览器始终处于可用状态，但库的编写者以及他们的用户社区会在每种主流浏览器上进行测试。\n\
  \n![Image](img/image00365.jpeg) 大多数库的下载大小并不惊人。在需要极短下载时间的少数情况下，对于大多数你可以用于“生产环境”网站的流行库都提供了压缩版本。此外，你还可以检查库代码并只提取你需要的部分。\n\
  \n## 库能做什么？\n\n具体差异取决于涉及的库及其创建者的需求和意图。然而，大多数库都包含某些反复出现的主：\n\n![Image](img/image00365.jpeg)\
  \ `DOM 方法的封装`——正如你稍后在本节查看 `prototype.js` 时所看到的，JavaScript 库可以提供极具吸引力的快捷方式来选择和管理页面元素以及元素组。\n\
  \n![Image](img/image00365.jpeg) `动画`——在第 7 小节“程序控制”中，你学习了定时器的使用。定时器可以用于页面元素的动画，但编写此类代码可能是复杂的，生成的代码难以维护。许多流行库将此类操作封装成方便的函数，用于对页面界面部分进行滑动、淡出、抖动、压缩、折叠、吸附和脉动，所有这些都是跨浏览器的且只需几行代码。\n\
  \n![Image](img/image00365.jpeg) `拖放与释放`——真正的跨浏览器拖放一直是为所有浏览器编写代码中最棘手的效果之一。库可以使其变得简单。\n\
  \n![Image](img/image00365.jpeg) `Ajax`——通过简单的方法更新页面内容，而无需担心实例化 `XMLHttpRequest`\
  \ 对象以及管理回调和状态码的细节问题。\n\n### 一些流行的库\n\n新库不断涌现；另一些库则在多年里持续持续开发。这绝不是一个完整的列表；它只是试图指出一些当前最受欢迎的参与者。\n\
  \n#### Prototype Framework\n\nPrototype Framework ([`www.prototypejs.org`](http://www.prototypejs.org))\
  \ 已经存在几年了，目前版本为 1.7。Prototype 的主要优势在于它的 DOM 扩展和 Ajax 处理，尽管它还有许多其他压底技巧，包括 JSON 支持以及帮助创建和继承类的方法。\n\
  \nPrototype 作为一个独立库分发，也可以作为大型项目的一部分，例如 Ruby on Rails 和 script.aculo.us JavaScript\
  \ 库。\n\n> 注意：你将在本节稍后的部分中更详细地查看 Prototype Framework，包括一些实操代码编写。\n\n#### Dojo\n\n\
  Dojo ([`www.dojotoolkit.org/`](http://www.dojotoolkit.org/)) 是一个开源工具包，它增强了 JavaScript\
  \ 的功能以简化应用程序和用户界面的构建。它具有从额外的字符串和数学函数到动画和 AJAX 的各种功能。最新版本不仅支持所有主流桌面浏览器，还支持移动环境，包括\
  \ Apple iOS、Android 和带有“Dojo Mobile”HTML5 移动 JavaScript 框架的 Blackberry。\n\n在编写本文时，Dojo\
  \ 处于 1.7 版本。\n\n### Yahoo! UI 库\n\nYahoo! UI Library ([`developer.yahoo.com/yui/`](http://developer.yahoo.com/yui/))\
  \ 由 Yahoo! 开发，并以开源许可向所有人提供。它包含了动画、DOM 特性、事件管理以及日历和滑块等易于使用的用户界面元素。\n\n#### MooTools\n\
  \nMooTools ([`mootools.net/`](http://mootools.net/)) 是一个紧凑、模块化的 JavaScript 框架，允许你使用简单易懂、文档良好的\
  \ API（应用程序编程接口）来构建强大、灵活且跨浏览器的代码。\n\n### jQuery\n\njQuery ([`jquery.com/`](http://jquery.com/))\
  \ 是一个快速且紧凑的 JavaScript 库，它简化了各种开发任务，包括 HTML 文档遍历、事件处理、动画以及用于快速开发交互式网站的 Ajax 调用。\n\
  \n> 提示：你将在接下来的两个小时内了解到许多关于 jQuery 库及其相关用户界面库 jQueryUI 的信息。\n\n## 介绍 prototype.js\n\
  \nSam Stephenson 的 prototype.js 是一个流行的 JavaScript 库，包含一系列对开发跨浏览器 JavaScript 应用非常有用的函数，包括对\
  \ Ajax 的特定支持。很快你就会看到如何通过该库对 DOM 操作、HTML 表单和 `XMLHttpRequest` 对象的强大支持来简化你的 JavaScript\
  \ 代码。\n\n最新版本的 prototype.js 库可以从 [`prototypejs.org/`](http://prototypejs.org/) 下载。\n\
  \n在你的 Web 应用中包含该库很简单；只需在 HTML 文档的 `<head>` 部分包含以下行即可：\n\n点击此处查看代码图片\n\n```\n<script\
  \ src=\"prototype.js\"></script>\n```\n\nprototype.js 库包含广泛的函数，可以使编写 JavaScript\
  \ 代码更快，并生成的脚本更整洁、更容易维护。\n\n该库包含了提供常规编程任务快捷方式的通用函数、HTML 表单的封装器、一个封装 `XMLHttpRequest`\
  \ 对象的对象等。\n\n> 警告：在编写本文时，prototype.js 处于 1.7 版本。\n\n### $() 函数\n\n`$()` 实际上是 `getElementById()`\
  \ 方法的快捷方式。通常，为了返回某个元素的值，你会使用如下表达式：\n\n点击此处查看代码图片\n\n```\nvar mydata = document.getElementById('someElement');\n\
  ```\n\n使用 `$()`：\n\n此外，`$()`（与 `getElementById` 不同）可以接受多个元素 ID 参数并返回元素数组。考虑此行代码：\n\
  \n点击此处查看代码图片\n\n```\nmydataArray = $('id1','id2','id3');\n```\n\n在此示例中：\n\n![Image](img/image00365.jpeg)\
  \ `mydataArray[0]` 包含元素 `id1` 值。\n\n![Image](img/image00365.jpeg) `mydataArray[1]`\
  \ 包含元素 `id2` 值。\n\n![Image](img/image00365.jpeg) `mydataArray[2]` 包含元素 `id3` 值。\n\
  \n### $F() 函数\n\n当将输入元素或其 ID 作为参数传递时，$F()` 函数返回表单输入字段的值。查看以下 HTML 代码段：\n\n点击此处查看代码图片\n\
  \n```html\n<input type=\"text\" id=\"input1\" name=\"input1\">\n\n<select id=\"\
  input2\" name=\"input2\">\n  <option value=\"0\">Option A</option>\n  <option value=\"\
  1\">Option B</option>\n  <option value=\"2\">Option C</option>\n</select>\n```\n\
  \n在这里我们可以使用\n\n$F('input1') 返回文本框中的值，并使用 $F('input2') 返回选择框当前选中选项的值。`$F()` 函数在复选框和文本区域输入元素上同样有效，使得无论输入元素类型如何都能轻松返回元素值。\n\
  \n### Form 对象\n\nprototype.js 定义了一个 `Form` 对象，具有许多实用的方法来简化 HTML 表单操作。\n\n\n\n\n\
  你可以通过调用 `getElements()` 方法返回一个表单输入字段的数组：\n\n点击此处查看代码图片\n\n```\ninputs = Form.getElements('thisform');\n\
  ```\n\n`serialize()` 方法允许将输入名称和值格式化为兼容 URL 的列表：\n\n点击此处查看代码图片\n\n```\ninputlist\
  \ = Form.serialize('thisform');\n```\n\n使用上述代码行，变量 `inputlist` 现在将包含一个序列化后的参数和值对的字符串：\n\
  \n点击此处查看代码图片\n\n```\nfield1=value1&field2=value2&field3=value3...\n```\n\n`Form.disable('thisform')`\
  \ 和 `Form.enable('thisform')` 的作用完全正如其名所示的那样。\n\n***\n\n## 动手尝试：使用 getElements()\
  \ 方法\n\n让我们使用 `getElements()` 方法收集一些关于 HTML 表单的信息。正如我之前提到的，该方法返回一个包含特定表单元素的数组。\n\
  \n以下是我们简单表单的代码：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>Prototype.js\
  \ example</title>\n</head>\n<body>\n    <form id=\"exampleForm\" action=\"#\" onsubmit=\"\
  return false\">\n        Username: <input type=\"text\" name=\"username\" /><br/>\n\
  \        Telephone: <input type=\"text\" name=\"telephone\" /><br/>\n        Message:\
  \ <input type=\"text\" name=\"message\" /><br/>\n    </form>\n    <input type=\"\
  button\" value=\"Result\" onclick=\"showFormFields();\"/>\n</body>\n</html>\n```\n\
  \n对于这个示例，我们只有三个文本字段，如 图 14.1 所示。\n\n![Image](img/image00441.jpeg)\n\n**图 14.1**\
  \ 简单的 HTML 表单\n\n在 HTML 的 head 部分引入 prototype.js 之后，我们需要编写一个函数在点击表单按钮时执行。该函数将使用\
  \ `getElements()` 方法构建一个表单元素数组。然后，它将通过 JavaScript alert 从表单中读取名称和输入的值。\n\n代码显示在\
  \ 列表 14.1 中。\n\n**列表 14.1 Prototype.js 示例表单**\n\n点击此处查看代码图片\n\n***\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>Prototype.js example</title>\n    <script\
  \ src=\"prototype.js\"></script>\n    <script>\n    function showFormFields() {\n\
  \        var form = $('exampleForm');\n        var message = '';\n        var fields\
  \ = form.getElements();\n        for(var x=0; x<fields.length;x++)  {\n        \
  \    message += \"Field Name : \" + fields[x].name + \" Value : \" + fields[x].value\
  \ + \"\\n\";\n        }\n        alert(message);\n    }\n    </script>\n</head>\n\
  <body>\n  <form id=\"exampleForm\" action=\"#\" onsubmit=\"return false\">\n   \
  \     Username: <input type=\"text\" name=\"username\" /><br/>\n        Telephone:\
  \ <input type=\"text\" name=\"telephone\" /><br/>\n        Message: <input type=\"\
  text\" name=\"message\" /><br/>\n    </form>\n  <input type=\"button\" value=\"\
  Result\" onclick=\"showFormFields();\"/>\n</body>\n</html>\n```\n\n在 图 14.2 中你可以看到运行示例并输入一些样本数据的结果。\n\
  \n![Image](img/image00442.jpeg)\n\n**图 14.2** 使用 `getElements()` 获取表单信息\n\n***\n\
  \n### 总结\n\n在许多情况下，使用库可以让编写 JavaScript 变得容易得多。这些库将许多常用的对象和方法封装成更符合用户习惯的形式；你不再需要记忆它们。\n\
  \n### 问答\n\n在许多情况下，使用库可以让编写 JavaScript 变得容易得多。这些库将许多常用的对象和方法封装成更符合用户习惯的形式；你不再需要记忆它们。\n\
  \n**Q. 我如何将第三方库引入我的页面中？**\n**A.** 过程根据库而略有不同。通常只需包含一个即可。\n\n**Q. 我可以使用超过一个第三方库吗？**\n\
  **A.** 是的，理论上可以。\n\n#### 测验\n\n**1. 以下哪项不是？**\n**a.** Prototype\n**b.** Dojo\n**c.**\
  \ jQuery\n\n**2. 你可以如何扩展 jQuery？**\n**a.** 通过编写脚本\n**b.** 通过使用脚本\n**c.** 通过编写脚本\n\
  \n**3. 其他哪一个第三方库是？**\n**a.** Prototype\n**b.** Ajax\n**c.** jQuery\n\n#### 答案\n\n\
  **1.** c.\n**2.** b.\n**3.** a.\n\n#### 练习\n\n![Image](img/image00441.jpeg) 访问 [`prototype.org`](http://prototype.org)。\n\
  \n***\n\n## 第 15 小时：深入了解 jQuery\n\n***\n\n本节你将学习：\n\n* 在页面中引入 jQuery\n* `$(document).ready`\
  \ \n* 选择页面元素\n* 处理 HTML 内容\n* 显示和隐藏元素\n* 元素动画\n* 链式调用\n* 处理事件\n* 使用 jQuery 进行 Ajax\n\
  \n***\n\n有很多 JavaScript 库可用，但 jQuery 可能是最受欢迎且最可扩展的。大量的开发者为 jQuery 贡献开源插件，你可以为你的任何应用程序找到合适的插件。广泛的插件和简单的语法使得\
  \ jQuery 成为一个极佳的库。在本小时，你将学习 jQuery 的基础知识并体验它的威力。\n\n### 在页面中引入 jQuery\n\n在在使用 jQuery\
  \ 之前，你需要将其引入页面中。有两种主要方法，将在下节详细介绍。\n\n#### 下载 jQuery\n\n你可以从官方网站 [`docs.jquery.com/Downloading_jQuery`](http://docs.jquery.com/Downloading_jQuery)\
  \ 下载 jQuery，在那里找到压缩版和未压缩版本的代码。压缩版本用于你的上线页面，因为它已被压缩到最小的文件大小以便最快下载。\n\n对于开发目的，请选择未压缩版本。受益于良好的格式化和注释源码，你可以阅读\
  \ jQuery 代码查看它是如何工作的。\n\n```html\n<script src=\"jquery-1.11.2.js\"></script>\n```\n\
  \n\n\n当然，如果你将 jQuery 放在另一个目录中，你必须更改 `src` 属性值中所提供的（相对或绝对）路径，以反映文件的实际位置。\n\n### 注意\n\
  \n实际文件名取决于你下载的版本。在编写本文时，1.11.2 是当前的发布版本。\n\n## 使用远程版本\n\n与其自己下载并托管 jQuery，你也可以从所谓的内容分发网络（CDN）中引入它。除了可以省去下载\
  \ jQuery 库的麻烦外，使用 CDN 版本还有一个进一步的优势：当用户访问你的页面且其浏览器请求 jQuery 时，该文件很可能已经存在他们的浏览器缓存中了。此外，CDN\
  \ 通常能确保从地理位置离用户最近的服务器提供文件，从而进一步缩短加载时间。\n\njQuery 官方网站目前列出了以下 CDN：\n\n![Image](img/image00365.jpeg)\
  \ **Google Ajax API CDN**—[`ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js`](http://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js)\n\
  \n![Image](img/image00365.jpeg) **Microsoft CDN**—[`ajax.aspnetcdn.com/ajax/jQuery/jquery-1.11.2.min.js`](http://ajax.aspnetcdn.com/ajax/jQuery/jquery-1.11.2.min.js)\n\
  \n![Image](img/image00365.jpeg) **jQuery CDN**—[`code.jquery.com/jquery-1.11.2.min.js`](http://code.jquery.com/jquery-1.11.2.min.js)（压缩版），[`code.jquery.com/jquery-1.11.2.js`](http://code.jquery.com/jquery-1.11.2.js)（源码）\n\
  \n然后你可以修改 `<script>` 标签以适应所选的 CDN，例如：\n\n点击此处查看代码图片\n\n```html\n<script  src=\"\
  https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js\"></script>\n\
  ```\n\n除非你有特殊理由自己托管 jQuery，否则这通常是最好的方法。\n\n### 提示\n\n如果你想确保你的代码始终使用最新版本的 jQuery，只需链接到\
  \ [`code.jquery.com/jquery-latest.min.js`](http://code.jquery.com/jquery-latest.min.js)\
  \ 即可。\n\n## jQuery 的 $(document).ready 处理器\n\n在本书的各个地方，你都使用了 `window.onload` 处理器。jQuery\
  \ 有它自己的等效方法：\n\n点击此处查看代码图片\n\n```javascript\n$(document).ready(function() {\n  \
  \  // jQuery 代码写在这里\n});\n```\n\n你编写的几乎所有的 jQuery 代码都将在类似这样的语句内部执行。\n\n与 `window.onload`\
  \ 一样，它完成了两件事：\n\n![Image](img/image0365.jpeg) 它确保代码在 DOM 可用之前不运行——也就是说，代码可能尝试访问的任何元素都已存在——这样你的代码就不会返回任何错误。\n\
  \n![Image](img/image0365.jpeg) 它通过将代码与语义（HTML）和表现（CSS）层分离，帮助你的代码保持非侵入性。\n\n不过，jQuery\
  \ 版本相比 `window.onload` 有一个优势：它不会在整个页面加载之前阻塞执行。使用 jQuery 的 `$(document).ready`，代码在\
  \ DOM 树构建完成后就会开始执行，而无需等待所有图像和其他资源加载，从而略微提高了性能。\n\n## 选择页面元素\n\njQuery 允许你通过将元素封装在\
  \ jQuery 包装器 `$` 中来选择 HTML 中的元素。\n\n### 提示\n\n你也可以在包装函数 `$` 中使用单引号。\n\n以下是使用 `$`\
  \ 操作符封装页面元素的示例：\n\n```javascript\n$(\"span\"); // 所有的 HTML span 元素\n$(\"#elem\"\
  ); // id 为 \"elem\" 的 HTML 元素\n$(\".classname\"); // 类名为 \"classname\" 的 HTML 元素\n\
  $(\"div#elem\"); // ID 为 \"elem\" 的 <div> 元素\n$(\"ul li.menu\"); // 嵌套在列表项中类名为 \"\
  menu\" 的锚点\n$(\"p > span\"); // 段落的直接子元素 span\n$(\"input[type=password]\"); // 指定类型的输入框\n\
  $(\"p:first\"); // 页面上的第一个段落\n$(\"p:even\"); // 所有偶数编号的段落\n```\n\nDOM 和 CSS 选择器就介绍到这里。但\
  \ jQuery 还有它自己的自定义选择器，如下：\n\n```javascript\n(\":header\"); // 标题元素 (h1 到 h6)\n(\"\
  :button\"); // 任何按钮元素（inputs 或 buttons）\n(\":radio\"); // 单选框\n(\":checkbox\");\
  \ // 复选框\n(\":checked\"); // 被选中的复选框或单选框\n```\n\n前面的示例中显示的 jQuery 语句各返回一个对象，该对象包含由包装函数指定的\
  \ DOM 元素数组。注意，在前面的代码行中，你并没有指定操作；你只是在从 DOM 中获取所需的元素。在接下来的章节中，你将学习如何处理这些元素。\n\n##\
  \ 处理 HTML 内容\n\njQuery 最实用的节省时间技巧之一是操作页面元素的内容。`html()` 和 `text()` 方法允许你获取和设置使用前面语句选择的任何元素的内容，而\
  \ `attr()` 则允许你获取和设置属性。\n\n#### html()\n\n`html()` 方法获取任何元素或集合的 HTML。它的工作方式非常像 JavaScript\
  \ 的 `innerHTML`：\n\n点击此处查看代码图片\n\n```javascript\nvar htmlContent = $(\"#elem\").html();\n\
  /* htmlContent 包含 id 为 \"elem\" 的元素的所有 HTML */\n```\n\n使用类似的语法，你可以设置指定元素或集合的 HTML\
  \ 内容：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").html(\"<p>这是一些新内容</p>\");\n/*\
  \ id 为 \"elem\" 的元素的 HTML 被替换 */\n```\n\n如果你只需要元素或集合的文本内容而不是 HTML，可以使用 `text()`：\n\
  \n点击此处查看代码图片\n\n```javascript\nvar textContent = $(\"#elem\").text();\n/* textContent\
  \ 包含 id 为 \"elem\" 的元素的所有文本（但不包括 HTML） */\n```\n\n再次更改指定（元素）的文本内容：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"#elem\").text(\"这是一些新内容。\");\n/* id 为 \"elem\" 的元素的内容被替换 */\n\
  ```\n\n如果你想向元素添加内容而不是替换它，可以使用以下：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").append(\"\
  <p>这是一些新内容</p>\");\n/* 保留当前内容，但将新内容添加到末尾 */\n```\n\n同样地：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"div\").append(\"<p>这是一些新内容</p>\");\n/* 为页面上所有的 <div> 元素添加相同的内容 */\n```\n\n####\
  \ attr()\n\n当传递单个参数时，`attr()` 方法获取指定属性的值：\n\n点击此处查看代码图片\n\n```javascript\nvar title\
  \ = $(\"#elem\").attr(\"title\");\n```\n\n如果应用于元素集，它仅返回集中第一个元素的属性。\n\n你也可以向 `attr()`\
  \ 传递第二个参数来设置属性值：\n\n点击此处查看代码图片\n\n```javascript\n$(\"#elem\").attr(\"title\", \"\
  这是新标题\");\n```\n\n### 显示和隐藏元素\n\n使用原生 JavaScript，显示和隐藏页面元素通常意味着操作元素 `style` 对象的\
  \ `display` 和 `visibility` 属性的值。虽然这种方法可行，但可能会导致代码行过长：\n\n```javascript\ndocument.getElementById(\"\
  elem\").style.visibility = 'visible';\n```\n\n\n\n你可以使用 jQuery 的 `show()` 和 `hide()`\
  \ 方法用较少的代码来完成这些任务。正如你在接下来的代码示例所示，jQuery 方法还提供了一些实用的额外功能。\n\n#### show()\n\n让一个元素或一组元素可见的简单方法是调用\
  \ `show()` 方法：\n\n点击此处查看代码图像\n\n```javascript\n$(\"div\").show(); // 让所有 <div> 元素可见\n\
  ```\n\n然而，你也可以添加一些额外的参数来增加过渡的趣味。\n\n在接的示例中，第一个参数 `\"fast\"` 决定了过渡的速度。除了 `\"fast\"\
  ` 或 `\"slow\"` 之外，jQuery 也乐意接受一个毫秒数数值作为该参数，即过渡所需的持续时间。如果未设置值，过渡将立即发生，没有动画。\n\n>\
  \ **提示**：值 `\"slow\"` 对应 600ms，而 `\"fast\"` 等同于 200ms。\n\n第二个参数是一个作为回调函数的函数；也就是说，它在过渡完成后执行一次：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"#elem\").show(\"fast\", function() {\n    //\
  \ 元素显示后执行某些操作\n});\n```\n\n在这里我们使用了匿名函数，但使用具名函数也完全可以。\n\n#### hide()\n\n`hide()`\
  \ 方法当然是 `show()` 的完全相反操作，允许你使用你在 `hide()` 中看到的相同可选参数来让页面元素不可见：\n\n点击此处查看代码图像\n\n\
  ```javascript\n$(\"#elem\").hide(\"slow\", function() {\n    // 元素隐藏后执行某些操作\n});\n\
  ```\n\n#### toggle()\n\n`toggle()` 方法更改元素或元素集合的当前状态；它会让集合中任何当前隐藏的元素变为可见，并隐藏任何正在显示的元素。`toggle()`\
  \ 同样可以使用相同的可选持续时间和回调函数参数。\n\n点击此处查看代码图像\n\n```javascript\n$(\"#elem\").toggle(1000,\
  \ function() {\n    // 元素显示/隐藏后执行某些操作\n});\n```\n\n> **提示**：记住 `show()`、`hide()`\
  \ 和 `toggle()` 方法可以应用于元素集合，因此该集合中的元素将同时出现或消失。\n\n### 元素动画\n\njQuery 提供的某些标准效果是非常强大的。页面元素的动画曾经必须通过使用\
  \ JavaScript 计时器编写复杂的硬编码例程来完成。这些功能现在被整齐地封装在几个 jQuery 方法中，你可以为你的元素或元素集合调用这些方法。\n\n\
  ### 淡渐效果\n\n你可以让元素淡入或淡出，可选地设置过渡持续时间并添加回调函数。\n\n淡出变为透明：\n\n点击此处查看代码图像\n\n```javascript\n\
  $(\"#elem\").fadeOut(\"slow\", function() {\n    // 在 fadeOut 执行完毕后执行某些操作\n});\n\
  ```\n\n或者淡入：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#elem\").fadeIn(500, function()\
  \ {\n    // 在 fadeIn 执行完毕后执行某些操作\n});\n```\n\n你也可以只让元素部分淡入或部分淡出：\n\n点击此处查看代码图像\n\
  \n```javascript\n$(\"#elem\").fadeTo(3000, 0.5, function() {\n    // 在 fade 执行完毕后执行某些操作\n\
  });\n```\n\n第二个参数（此处设置为 0.5）代表目标透明度。它的值工作方式与 CSS 中设置透明度值的方式类似。无论调用该方法之前的透明度值是多少，元素都将进行动画，直到达到参数中指定的值。\n\
  \n### 滑动效果\n\n你可以让元素或元素集合向上或向下滑动。用于让元素滑动的 jQuery 方法是你刚刚看到的淡渐方法的直接推论，它们的参数遵循完全相同的规则：\n\
  \n点击此处查看代码图像\n\n```javascript\n$(\"#elem\").slideDown(150, function() {\n    //\
  \ 当 slideDown 执行完毕时执行某些操作\n});\n```\n\n以及向上滑动：\n\n点击此处查看代码图像\n\n```javascript\n\
  $(\"#elem\").slideUp(\"slow\", function() {\n    // 当 slideUp 执行完毕时执行某些操作\n});\n\
  ```\n\n如果你需要根据元素的当前状态让元素向上或向下滑动，jQuery 还提供了一个方便的 `slideToggle()` 方法：\n\n点击此处查看代码图像\n\
  \n```javascript\n$(\"#elem\").slideToggle(1000, function() {\n    // 当向上/向下滑动执行完毕时执行某些操作\n\
  });\n```\n\n### 动画\n\n要对元素执行动画，你可以通过使用 jQuery 指定该项目应该应用的 CSS 样式。jQuery 将强制实施新样式，但可以逐渐地实施（而不是像在纯\
  \ CSS/JavaScript 中那样立即应用），从而创建效果。\n\n你可以在许多数值属性上使用 `animate()`。在本示例中，元素的宽度和高度将被动画到某个值。无论调用方法之前透明度的值是多少，元素将一直进行动画，直到达到参数中指定的值。\n\
  \n```javascript\n$(\"#elem\").animate({\n    width: \"400px\",\n    height: \"500px\"\
  \n}, 1500, function() {\n    // 动画完成后后执行某些操作\n});\n```\n\n### 链式调用\n\njQuery 的另一个方便的特性是大多数方法都会返回一个\
  \ jQuery 对象，可以用来调用另一个方法。你可以像这样组合之前的示例中的方法：\n\n```javascript\n$(\"#elem\").fadeOut().fadeIn();\n\
  ```\n\n### 尝试一下：简单动画\n\n让我们使用目前所学的知识通过 jQuery 实现一个简单的动画。你的 HTML 页面将显示一个通过 CSS 样式的元素，但没有内容。以下是页面的\
  \ HTML：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <style>\n        #animateMe\
  \ {\n            position:absolute;\n            width: 100px;\n            height:\
  \ 400px;\n            top: 100px;\n            left: 100px;\n            border:\
  \ 2px solid black;\n            background-color: red;\n            padding: 20px;\n\
  \        }\n    </style>\n</head>\n<body>\n    <div id=\"animateMe\"></div>\n</body>\n\
  </html>\n```\n\n首先你需要在页面中添加一个 `<script>` 元素来链接 jQuery 库——在本例中，通过 CDN：\n\n```html\n\
  <script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n```\n\n首先要做的是使用\
  \ jQuery 的 `text()` 方法为 <div> 元素添加一些文本：\n\n```javascript\n$(\"#animateMe\").text(\"\
  Changing shape...\")\n```\n\n然后你可以调用 `animate()` 来改变元素的大小（从而改变形状）：\n\n```javascript\n\
  $(\"#animateMe\").animate({\n    width: \"400px\",\n    height: \"200px\"\n}, 5000,\
  \ function() {\n    // 回调函数\n});\n```\n\n\n\n\n当动画完成后，让我们更改元素中的文本，然后让该元素缓慢消失。我们将这两个命令进行链式调用，并使用上一次对\
  \ `animate()` 方法调用的回调函数，在动画完成后执行这些额外的命令：\n\n点击此处此处查看代码图片\n\n```javascript\n$(\"\
  #animateMe\").text(\"Changing shape...\").animate(\n    {\n        width: \"400px\"\
  ,\n        height: \"200px\"\n    }, 5000, function() {\n        $(this).text(\"\
  Fading away ...\").fadeOut(4000);\n    }\n);\n```\n\n注意 `this` 的使用。因为你当前正在对 `$(\"\
  #animateMe)`` 父元素执行方法，因此代码块内部的 `this` 指的是该父元素。\n\n最后，你需要在 DOM 准备绪后执行所有这些活动，将代码封装在\
  \ jQuery 的 `$(document).ready` 处理器中。\n\n完整的代码列表如列表 15.1 所示。使用你的文本编辑器创建此页面，并将其加载到浏览器中。\n\
  \n### 注意\n要使用存储在 CDN 上的 jQuery 版本，你的电脑需要连接到。如果你没有 Internet 连接，则需要使用本地 jQuery 副本来尝试这些示例。\n\
  \n### 列表 15.1 一个简单的 jQuery 动画\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <style>\n        #animateMe {\n            position:absolute;\n    \
  \        width: 100px;\n            height: 400px;\n            top: 100px;\n  \
  \          left: 100px;\n            border: 2px solid black;\n            background-color:\
  \ red;\n            padding: 20px;\n        }\n    </style>\n    <script src=\"\
  http://code.jquery.com/jquery-latest.min.js\"></script>\n    <script>\n        $(document).ready(function()\
  \ {\n            $(\"#animateMe\").text(\"Changing shape...\").animate(\n      \
  \          {\n                    width: \"400px\",\n                    height:\
  \ \"200px\"\n                }, 5000, function() {\n                    $(this).text(\"\
  Fading away ...\").fadeOut(4000);\n                }\n            );\n        });\n\
  \    </script>\n</head>\n<body>\n    <div id=\"animateMe\"></</div>>\n</body>\n\
  </html>\n```\n\n当页面加载后，你应该看到一个带有黑色边框的红色 `<div>` 元素，其中包含“Changing shape....”字。一旦动画到新的宽度和高度，文字将变为“Fading\
  \ away...”，元素将淡出消失。图 15.1 显示了动画的发生。\n\n![Image](img/image0043.jpeg)\n图 15.1 一个简单的动画\n\
  \n### 处理事件\n在 jQuery 中，你可以通过多种方式向元素或元素集合附加事件处理器。首先，你可以像这样添加事件处理器：\n\n```javascript\n\
  $(\"a\").click(function() {\n    // 当任何锚点元素被点击时执行此代码\n});\n```\n\n或者，你可以使用命名函数，如下所示：\n\
  \n```javascript\nfunction hello() {\n    alert(\"Hello from jQuery\");\n}\n$(\"\
  a\").click(hello);\n```\n\n在这两个示例中，当锚点被点击时将执行该函数。你在 jQuery 中使用的其他常见事件包括 `blur`、`focus`、`hover`、`keypress`、`change`、`mousemove`、`resize`、`scroll`、`submit`\
  \ 和 `select`。为了帮助你添加多个事件处理器，jQuery 以跨浏览器的方式封装了 JavaScript 方法 `attachEvent` 和 `addEventListener`：\n\
  \n```javascript\n$(\"a\").on('click', hello);\n```\n\n`on()` 方法可以将处理器附加到原始页面中的元素以及动态添加到\
  \ DOM 中的元素上。\n\n注意 `on()` 方法是在 jQuery 1.7 中引入的，它是几个事件处理方法的推荐替代方案，包括 `bind()`、`delegate()`\
  \ 和 `live()`。请参阅 jQuery 文档获取完整详情。\n\n### 总结\njQuery 是一个功能丰富且非常流行的 JavaScript 库，具有易于使用的\
  \ API，可以在大多数浏览器中运行。在这一小时中，你深入了解了 jQuery 的基础知识，并学习了它如何帮助你编写简洁的跨浏览器应用程序。\n\n### 问答\n\
  **Q. jQuery 来自于哪里？**\n**A.** jQuery 由 John Resig 编写并于 2006 年发布。目前有几个 jQuery 项目，包括\
  \ jQuery Core（本节使用）和 jQuery UI（你将在第 16 小 中学习）。项目由 John 及其志愿者团队正在积极开发。你可以在 jquery.org\
  \ 读取有关该团队和项目的信息。\n\n**Q. 是否可以与其他库一起使用 jQuery？会有冲突吗？**\n**A.** 是的，jQuery 可以与其他库一起使用。jQuery\
  \ 提供了 `jQuery.noConflict()` 方法来防止冲突。你可以在 [`docs.jquery.com/Using_jQuery_with_Other_Libraries`](http://docs.jquery.com/Using_jQuery_with_Other_Libraries)\
  \ 阅读相关内容。\n\n### 工作坊\n在阅读答案 章节之前，尝试回答所有问题。\n\n#### 测验\n1](#part0028.xhtml_ch15ans01).\
  \ 你如何选择所有 `class = \"sidebar\"` 的页面元素？\na. `$(\".sidebar\")`\nb. `$(\"class:sidebar\"\
  )`\nc. `$(sidebar)`\n\n2](#part0028.xhtml_ch15ans02). 表达式 `$(\"p:first\").show()`\
  \ 什么？\na. 在显示任何其他元素之前显示段元素\nb. 让页面上的第一个段元素可见\nc. 让所有段元素的第一行可见\n\n3](#part0028.xhtml_ch15ans03).\
  \ 当应用于淡入、滑入和动画时，值“fast”等同于\na. 1 秒\nb. 600 毫秒\nc. 200 毫秒\n\n#### 答案\n1](#part0028.xhtml_ch15ans01).\
  \ a. `$(\".sidebar\")`\n2](#part0028.xhtml_ch15ans02). b. 让页面上的第一个段元素可见\n3](#part0028.xhtml_ch15ans03).\
  \ c. 200 毫秒\n\n#### 练习\n![Image](img/image0043.jpeg) 复习书中之前的示例程序。尝试使用 jQuery 重写它们。\n\
