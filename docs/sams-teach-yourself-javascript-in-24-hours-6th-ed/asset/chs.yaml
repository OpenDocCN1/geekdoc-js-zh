  \ HTML 页面上，而不是将其打印到控制台（如 QUnit 所示）。\n\n![Image](img/image00365.jpeg) 从书中各处选取其他函数，并使用\
  \ QUnit 对它们进行单元测试。它们的运行方式都符合你的预期吗？\n\n# 第 9 部分：附录\n\n### 附录 A. JavaScript 开发工具\n\
  \nJavaScript 开发除了文本编辑器和浏览器外，不需要任何特殊工具或软件。\n\n大多数操作系统都自带了各至少一种工具，在很多情况下，这些工具对于你编写代码来说已经绰有余了。\n\
  \n然而，还有许多可选和额外的工具可用，其中一些在这里被进行了介绍。\n\n> 提示\n> 请务必检查各个网站上的许可条款和/或下载包中的条款。\n\n###\
  \ 编辑器\n\n选择编辑器程序是个人喜好，大多数程序员都有自己喜爱的编辑器。接下来的章节列了一些你可以尝试的流行免费编辑器。\n\n#### Notepad++\n\
  \n如果你在 Windows 平台上进行开发，你可能已经在使用 Windows 通常自带的记事本编辑器。`Notepad++` ([`notepad-plus-plus.org/`](http://notepad-plus-plus.org/))\
  \ 是一款免费应用程序，旨在成为更强大的替代品，同时仍保持轻量和快速。\n\n`Notepad++` 提供行号、语法和大括号高亮、宏、搜索和替换等大量功能。\n\
  \n#### jEdit\n\n`jEdit` 是一个用 Java 编写的免费编辑器。因此，它可以安装在任何可用 Java 虚拟机的平台上，例如 Windows、Mac\
  \ OS X、OS/2、Linux 等。\n\n`jEdit` 本身就是一个功能完备的编辑器，通过 200 多个可用插件进行扩展，例如成为一个完整的开发环境或高级\
  \ XML/HTML 编辑器。\n\n从 [www.jedit.org](http://www.jedit.org) 下载 `jEdit`。\n\n#### SciTE\n\
  \n`SciTE` 最初是作为 Scintilla 编辑组件的演示程序开发的，现在已发展成为功能完备且实用的编辑器。\n\nWindows 和 Linux 用户可以通过\
  \ [www.scintilla.org/SciTE.html](http://www.scintilla.org/SciTE.html) 下载免费版的 `SciTE`，而\
  \ Mac OS X 用户可以通过 Mac App Store 购买商业版本。\n\n#### Geany\n\n`Geany` ([www.geany.org/](http://www.geany.org/))\
  \ 是一个功能强大的编辑器，也可以作为基础集成开发环境 (IDE 使用。它的开发是为了提供一个小型且快速的 IDE，可以安装在几乎任何支持 GTK 工具包的平台上，包括\
  \ Windows、Linux、Mac OS X 和 FreeBSD。\n\n`Geany` 可根据 GNU 公共许可条款免费下载和使用。\n\n### 验证器\n\
  \n为了确保你的页面无论用户的浏览器和操作系统如何都能按预期工作，始终建议检查你的 HTML 代码是否符合标准。正如前面讨论的，有许多在线工具和设施可以提供帮助。\n\
  \n#### W3C 验证服务\n\n`W3C` 在 [`validator.w3.org/`](http://validator.w3.org/) 提供了一个在线验证器，它可以检查\
  \ HTML、SMIL、MathML 和其他语言 Web 文档的标记。你可以输入要检查的页面 URL，或直接将代码粘贴到验证器中。`CSS` 也可以在 [`jigsaw.w3.org/css-validator/validator.en`](http://jigsaw.w3.org/css-validator/validator.en)\
  \ 以类似的方式验证。\n\n#### Web Design Group (WDG)\n\n`WDG` 也在 [www.htmlhelp.com/tools/validator/](http://www.htmlhelp.com/tools/validator/)\
  \ 提供在线验证。这与 `W3C` 验证器类似，但在某些情况下提供的更多信息，例如关于有效但危险代码的警告，或者突出显示未定义的引用而不是简单地列为错误。\n\n\
  #### 调试和验证工具\n\n在尝试追踪 JavaScript 代码中的问题时，调试工具可以为你节省数小时，并通过分析执行时间帮助你加速脚本。验证工具可以帮助你编写整洁、简洁、可读且无问题的代码。许多调试和验证工具可用，包括以下：\n\
  \n#### Firebug\n\n`Firebug` 与 Firefox 浏览器集成，提供优秀的调试、编辑和分析工具。访问 [`firebug.com/javascript`](http://firebug.com/javascript)。\n\
  \n#### JSLint\n\n`JSLint` ([www.jslint.com/](http://www.jslint.com/)) 由 Douglas\
  \ Crockford 编写，用于分析你的 JavaScript 源代码并报告潜在问题，包括风格规范和编码错误。\n\n### 附录 B. JavaScript\
