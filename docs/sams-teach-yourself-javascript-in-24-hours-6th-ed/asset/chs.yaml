  \n### 交互\n\n让我们看看可以使用可以使用 UI 做的一些事情，以改进页面元素与用户交互的方式。\n\n### 拖放\n\n使用 jQuery UI 让一个元素变得可拖拽再简单不过了：\n\
  \n```javascript\n$(\"#draggable\").draggable();\n```\n\n列表 16.1 显示了你如何在 HTML 页面中实现这一点。\n\
  \n**列表 16.1 让页面元素变为可拖拽**\n\n点击此处查看代码图像\n\n* * *\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n    <style>\n        #dragdiv {\n            width: 100px;\n            height:\
  \ 100px;\n            background-color: #eeffee;\n            border: 1px solid\
  \ black;\n            padding: 5px;\n        }\n    </style>\n    <title>Drag and\
  \ Drop</title>\n    <script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n    <script src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"\
  ></script>\n    <script>\n        $(function() {\n            $(\"#dragdiv\").draggable();\n\
  \        });\n    </script>\n</head>\n<body>\n    <div id=\"dragdiv\"> Drag this\
  \ element around the page!</div>\n</body>\n</html>\n```\n\n* * *\n\n当页面加载后，元素 `<div\
  \ id=\"dragdiv\">` 变为可拖拽的：\n\n点击此处查看代码图像\n\n```javascript\n$(function() {\n    $(\"\
  #dragdiv\").draggable();\n});\n```\n\n然后你可以通过点击元素任何部分的鼠标来在页面上拖动项目，如 图 16.1 所示。\n\
  \n![Image](img/image00444.jpeg)\n\n**图 16.1** 拖放的主\n\n\n\n\n\n点击此处查看代码图像\n\n```javascript\n\
  $(function() {\n    $(\"#dragdiv\").draggable();\n    $(\"#dropdiv\").droppable({\n\
  \        drop: function() { $(\"#dragdiv\").text(\"Dropped!\"); },\n        out:\
  \ function() { $(\"#dragdiv\").text(\"Off and running again ...\"); }\n    }).resizable();\n\
  });\n```\n\n### 排序\n\n拖放功能的进一步封装方法是 `sortable()` 方法，你可以将将其添加到列表项中以使列表变得可排序：\n\n\
  ```javascript\n$(\"#sortMe\").sortable();\n```\n\nListing 16.3 演示了你如何将此方法应用于无序列表元素。\n\
  \n**列表 16.3 使元素变为可排序**\n\n点击此处查看代码图像\n\n***\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n    <title>Sortable</title>\n    <script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n    <script src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"\
  ></script>\n    <script>\n        $(function() {\n            $(\"#sortMe\").sortable();\n\
  \        });\n    </script>\n</head>\n<body>\n    <ul id=\"sortMe\">\n        <li>One</li>\n\
  \        <li>Two</li>\n        <li>Three</li>\n        <li>Four</li>\n        <li>Five</li>\n\
  \    </ul>\n</body>\n</html>\n```\n\n***\n\n将元素拖到列表中的新位置会导致列表排序，在完成投放时，列表会“吸附”到新的顺序，如图\
  \ 16.4 所示。\n\n![Image](img/image00447.jpeg)\n\n**图 16.4** 排序列表\n\n#### 使用组件（Widgets）\n\
  \n组件是你能够以极少的麻烦和复杂性放入应用程序的界面项。\n\n#### 手风琴（Accordion）\n\n手风琴组件允许用户一次只展开 `<<div>`\
  \ 元素列表中的一个，其余元素收缩为仅保留一个标题栏。\n\n首先，你需要在语义层中添加数据，使用标题和内容面板对：\n\n点击此处查看代码图像\n\n```html\n\
  <div id=\"accordion\">\n    <h3><a href=\"#\">First header</a></h3>\n    <div>First\
  \ content</div>\n    <h3><a href=\"#\">Second header</a></h3>\n    <div>Second content</div>\n\
  </div>\n```\n\n接下来，你可以通过在外部容器元素上调用 `accordion()` 方法来激活手风琴：\n\n点击此处查看代码图像\n\n```javascript\n\
  $(function() {\n    $(\"#accordion\").accordion();\n});\n```\n\nListing 16.4 显示了一个示例应用程序，这里将餐厅菜单的午餐选项分为手风琴的各个折叠部分。\n\
  \n**列表 16.4 使用手风琴组件**\n\n点击此处查看代码图像\n\n***\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n    <title>Menu Choices</title>\n    <script src=\"http://code.jquery.com/jquery-latest.min.js\"\
