  \ 手风琴组件\n\n#### 日期选择器（Date Picker）\n\n由于访客正确填写日期字段一直是一件困难的事，因为日期格式多种多样。日期选择器是一个弹出日历组件，允许用户只需点击日期即可让组件格式化日期并输入到输入框。\n\
  \n假设你有一个接收日期的表单字段：\n\n点击此处查看代码图像\n\n```html\n<input type=\"text\" id=\"datepicker\"\
  >\n```\n\n你可以用一行代码为该字段实现日期选择器：\n\n点击此处查看代码图像\n\n```javascript\n$(\"#datepicker\"\
  ).datepicker();\n```\n\nListing 16.5 有一个你可以尝试的完整示例。\n\n**列表 16.5** 使用日期选择器组件\n\n\
  点击此处查看代码图像\n\n***\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <link rel=\"\
