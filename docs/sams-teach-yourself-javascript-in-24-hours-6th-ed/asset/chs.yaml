  \n## 第 16 小节。jQuery UI 用户界面库\n\n你将在本节学习：\n![Image](img/image0043.jpeg) jQuery UI\
  \ 是什么\n![Image](img/image0043.jpeg) 使用 ThemeRoller\n![Image](img/image0043.jpeg)\
  \ 如何在页面中包含 jQuery UI\n![Image](img/image0043.jpeg) 交互：拖拽、释放、调整大小和排序\n![Image](img/image0043.jpeg)\
  \ 使用部件：折叠面板、日期选择器和标签\n\n在上一节中你学习了 jQuery 开源 JavaScript 库。在本节中你将看到如何使用它的辅助库 jQuery\
  \ UI。\n\njQuery UI 提供了高级效果和可主题的小部件，帮助你构建交互式 Web 应用程序。\n\n\n\n\n![Image](img/image00365.jpeg)\
  \ **主题构建**——让你的网站在所有用户界面组件中具有一致的外观和感受。你可以在 [`jqueryui.com/themeroller/`](http://jqueryui.com/themeroller/)\
  \ 使用 `ThemeRoller` 工具。`ThemeRoller` 在线工具允许你从预写设计的库中选择一个主题，或者以一个现有主题为起点创建一个自定义主题。\n\
  \n在这一小时中，你将看到如何使用一些更流行的插件。得益于 jQuery UI 一致的用户界面，你将可以通过 jQuery 文档轻松探索许多其他可用插件。\n\n\
  ### 如何在你的页面中引入 jQuery UI\n\n第一步是访问 [`jqueryui.com/themeroller/`](http://jqueryui.com/themeroller/)\
  \ 上的 jQuery ThemeRoller 在线应用程序。\n\n#### 使用 ThemeRoller\n\njQuery UI CSS 框架是一组涵盖了广泛用户界面需求的类。使用\
  \ `ThemeRoller` 工具，你可以构建自己的界面样式，既可以从零开始，也可以基于 [`jqueryui.com/themeroller/`](http://jqueryui.com/themeroller/)\
  \ 库中提供的任何大量示例。\n\n一旦你决定了某种样式，jQuery UI 提供了一个下载生成器，只打包你需要的组件。它还会处理你所选项目的任何依赖项，因此你不会下载一个缺少所有所需辅助文件的部件（widget）或交互。你只需要下载并解压\
  \ zip 文件即可。\n\n解压下载的内容后，你拥有以下目录：\n\n`/css/`\n\n`/development-bundle/`\n\n`/js/`\n\
  \n`development-bundle` 目录包含 jQuery UI 源码、演示和文档。如果你不打算更改任何 jQuery UI 代码，可以安全地删除它。\n\
  \n通常，在任何要使用 jQuery UI 部件和交互的页面上，你都需要从剩余文件中引入你的主题、jQuery 和 jQuery UI：\n\n点击此处查看代码图像\n\
  \n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"jquery-ui.min.css\"\
  />\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n<script\
  \ src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"></script>\n```\n\
  \n如果你使用标准库主题之一，你也可以链接到内容分发网络（CDN）上你需要的所有文件：\n\n点击此处查看代码图像\n\n```html\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n<script src=\"http://code.jquery.com/jquery-latest.min.js\"></script>\n<script\
  \ src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"></script>\n```\n\
  \n### 交互\n\n让我们看看可以使用 jQuery UI 做的一些事情，以改进页面元素与用户交互的方式。\n\n### 拖放\n\n使用 jQuery UI\
  \ 让一个元素变得可拖拽再简单不过了：\n\n```javascript\n$(\"#draggable\").draggable();\n```\n\n列表\
  \ 16.1 显示了你如何在 HTML 页面中实现这一点。\n\n**列表 16.1 让页面元素变为可拖拽**\n\n点击此处查看代码图像\n\n* * *\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <link rel=\"stylesheet\" type=\"\
  text/css\" href=\"http://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/themes/smoothness/jquery-ui.css\"\
  />\n    <style>\n        #dragdiv {\n            width: 100px;\n            height:\
  \ 100px;\n            background-color: #eeffee;\n            border: 1px solid\
  \ black;\n            padding: 5px;\n        }\n    </style>\n    <title>Drag and\
  \ Drop</title>\n    <script src=\"http://code.jquery.com/jquery-latest.min.js\"\
  ></script>\n    <script src=\"http://codeorigin.jquery.com/ui/1.10.3/jquery-ui.min.js\"\
  ></script>\n    <script>\n        $(function() {\n            $(\"#dragdiv\").draggable();\n\
  \        });\n    </script>\n</head>\n<body>\n    <div id=\"dragdiv\"> Drag this\
  \ element around the page!</div>\n</body>\n</html>\n```\n\n* * *\n\n当页面加载后，元素 `<div\
  \ id=\"dragdiv\">` 变为可拖拽的：\n\n点击此处查看代码图像\n\n```javascript\n$(function() {\n    $(\"\
  #dragdiv\").draggable();\n});\n```\n\n然后你可以通过点击元素任何部分的鼠标来在页面上拖动项目，如 图 16.1 所示。\n\
  \n![Image](img/image00444.jpeg)\n\n**图 16.1** 拖放的主**\n\n当页面加载后，元素 `<div id=\"dragdiv\"\
  >` 变为可拖拽的：\n\n点击此处查看代码图像\n\n```javascript\n$(function() {\n    $(\"#dragdiv\").draggable();\n\
  });\n```\n\n然后你可以通过点击元素任何部分的鼠标来在页面上拖动项目，如 图 16.1 所示。\n\n![Image](img/image00444.jpeg)\n\
  \n**图 16.1** 拖放的主\n\n当页面加载后，元素 `<div id=\"dragdiv\">` 变为可拖拽的：\n\n点击此处查看代码图像\n\n\
  ```javascript\n$(function() {\n    $(\"#dragdiv\").draggable();\n});\n```\n\n然后你可以通过点击元素任何部分的鼠标来在页面上拖动项目，如\
  \ 图 16.1 所示。\n\n![Image](img/image00444.jpeg)\n\n**图 16.1** 拖放的主\n\n当页面加载后，元素 `<div\
  \ id=\"dragdiv\">` 变为可拖拽的：\n\n点击此处查看代码图像\n\n```javascript\n$(function() {\n    $(\"\
  #dragdiv\").draggable();\n});\n```\n\n*(注：我发现原文文本中存在大量重复段落，根据“不要重复输出原文”的原则，我在译文中仅保留了逻辑内容。以下是完整的整合译文：)*\n\
