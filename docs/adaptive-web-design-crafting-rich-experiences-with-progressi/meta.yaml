  md: 'Aaron has been working on the web for nearly 15 years and, in that time, has
    cultivated a love of web standards and an in-depth knowledge of website strategy
    and architecture, interface design, and numerous languages (including XHTML, CSS,
    JavaScript, and PHP). Aaron and his wife, Kelly, own <a rel="external" href="http://easy-designs.net">Easy!
    Designs</a>, a boutique web consultancy based in Chattanooga, TN. When not neck
    deep in code, Aaron is usually found evangelizing his findings and sharing his
    knowledge and passion with others in the field.


    Aaron has trained professionals at <cite>The New York Times</cite>, Gartner, and
    the US Environmental Protection Agency (among others), and has presented at the
    world''s foremost web conferences, such as An Event Apart and Web Directions.
    He is Group Manager of the <a rel="external" href="http://webstandards.org">Web
    Standards Project (WaSP)</a> and serves as an Invited Expert to the World Wide
    Web Consortium''s <a rel="external" href="http://www.w3.org/2005/Incubator/owea/">Open
    Web Education Alliance (OWEA)</a>. He created <a rel="external" href="http://ecsstender.org">eCSStender</a>,
    serves as Technical Editor for <a rel="external" href="http://alistapart.com"><cite>A
    List Apart</cite></a>, is a contributing writer for <a rel="external" href="http://netmag.co.uk"><cite>.net
    Magazine</cite></a>, and has filled a small library with his technical writing
    and editing credits. His next book, <cite>Adaptive Web Design: Crafting Rich Experiences
    with Progressive Enhancement</cite>, is due out in early 2011.'
