    # # RICH IN LAYERS


    As you can see, there are numerous ways we can use CSS to progressively enhance
    our web pages. Some techniques, such as taking advantage of parsing errors, are
    so simple and commonplace that you''re probably using them right now. Others,
    such as faceted style separation, may provide a slightly different take on your
    current practices or may be completely foreign to you. When used in combination,
    however, these techniques weave together, layer upon layer, to provide a tailored
    experience for every user, no matter what her browser or device supports.'
