    感谢 Carolyn Wood 协助雕琢部分初稿，感谢 Krista Stevens 把握论述核心、精炼文稿，并驯服我内心的顽劣之念。


    感谢 Craig Cook 与 Derek Featherstone 确保我的代码规范严谨，感谢少数早期审阅者给予的深思熟虑的建议（及纠正）：Dan Cederholm、Simon
    Collison、Kristina Halvorson、Christian Heilmann、Whitney Hess、Jeremy Keith、Dan Rubin
    与 Jonathan Snook。


    感谢 Easy Designs 团队在细节上的专注与对本书编撰的宝贵协助：Jessica Martin、Daniel Ryan、Jessi Taylor、Matthew
    Turnure 与 Laura Helen Winn。


    感谢 Veerle Pieters 在百忙之中为我设计了绝美的封面。


    当然，更要感谢 Kelly，为我挤出写作时间，助我理清思路，并督促我最终完成此书。


