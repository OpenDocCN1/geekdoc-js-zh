  md: "hCard microformat to my bio [section](link) in the \"Instructors\" [article](link).\
    \ Before we take a look at the markup though, let's go over the key hCard classifications.\n\
    \n| CLASS | PURPOSE |\n| :--- | :--- |\n| vcard | Signifies that hCard is being\
    \ used. (This should be the class of the root element containing the hCard information.)\
    \ |\n| fn | Short for “formatted name,” it's used to wrap the name of the person\
    \ who owns the hCard |\n| url | Indicates that a given link takes the user to\
    \ a web page about this person |\n| photo | Denotes a photo of this person |\n\
    | org | Identifies the company or organization of which this person is a part\
    \ |\n| role | Conveys the role this person holds within the organization |\n\n\
    Table 2.1: Key hCard classifications\n\nThe hCard microformat offers many other\
    \ options for marking up a person's profile, but these are the key ones we're\
    \ going to concern ourselves within the context of the Retreats 4 Geeks website.\
    \ And, of these five [classes](link), only “vcard” and “fn” are actually required.\n\
    \nNow let's take a look at the content we've got to work with:\n\n```\n<section\
    \ id=\"aaron-gustafson\">\n    <figure>\n        <img src=\"i/aaron-gustafson.jpg\"\
    \ alt=\"\"/>\n    </figure>\n    <h1>Aaron Gustafson</h1>\n```"
