- img_proc: true
  md: 'In terms of source order, the next piece we encounter is the date range “8-10
    April 2011.” Traditionally, we would have used abbreviation elements (`abbr`)
    to mark up this data, but HTML5 introduces a new element explicitly tasked with
    indicating temporal information: the `time` element. One problem: to supply a
    start and end date for the event, we need to break the content up into two dates
    before wrapping each in a `time` element.


    Though it may seem odd at first, what makes the most sense is wrapping the “8”
    in one `time` element and “10 April 2011” in the other. We do that because the
    “8” is really implying “8 April 2011,” albeit in an abbreviated form (which is
    why `abbr` made a lot of sense previously). The `time` element allows for further
    clarification of dates using the `datetime` attribute, which is how I’ve expressed
    the full starting date:


    ```

    <p><time datetime="2011-04-08">8</time>&#8211;<time datetime="2011-04-10">10 April
    2011</time></p>

    ```


    hCalendars only require a summary and a starting date, so we only need to apply
    the “dtstart” classification to the first `time` element for the microformat to
    be valid. But since we have an end date, it makes sense to apply that one too:21


    ```

    <p><time class="dtstart" datetime="2011-04-08">8</time>&#8211;<time class="dtend"
    datetime="2011-04-10">10 April 2011</time></p>

    ```


    Continuing down the article, “location” is pretty obvious: Gatlinburg, TN:


    ```

    <p class="location">Gatlinburg, <abbr title="Tennessee">TN</abbr></p>

    ```


    > 21. As of this writing, some microformat parsers have issues with the newer
    HTML5 elements and attributes. For that reason, it may make sense to duplicate
    the value of the `datetime` attribute into a `title` on the `time` element or
    switch to using `title` on an `abbr`.'
  merge: -1
