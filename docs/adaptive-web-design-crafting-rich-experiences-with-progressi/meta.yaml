  md: '# # CHAPTER 2: PROGRESSIVE ENHANCEMENT WITH MARKUP


    When it comes to the web, markup calls the shots. It is the foundation upon which
    every beautiful design and each amazing experience is built. Whether your preferred
    flavor is HTML or its more rigorous sibling, XHTML, each element has a purpose
    and can profoundly affect the user experience for better or worse, depending on
    how you use (or abuse) it.


    # ## FROM A ROUGH START TO THE RIGHT WAY™


    When we first began building web pages, many of us misunderstood the importance
    of good markup. Those of us coming to the web from a programming background often
    considered learning HTML beneath us, so we never put in the time to come to grips
    with the semantics it provided. Those of us who came to the web from a design
    background didn''t understand the importance of semantics either. We thought only
    of the presentational aspect of a web page and latched on to the `table` as a
    means of laying out pages on a grid, then'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'we went hog-wild and found hundreds of other uses for the `table` element,
    many of which supplanted existing (and well-supported) semantic elements (like
    lists).


    In many offices across the globe, advocacy for semantic application of HTML fell
    on deaf ears; the argument was seen as a largely idealistic one because: 1) the
    fact remained that old-school websites looked okay in modern browsers and 2) the
    case for greater web accessibility was lost on many people who had no first-hand
    experience of using the web with a disability. Then Google came along and changed
    everything. Suddenly, semantic markup was important.


    Google was the first search engine to take semantics into account when indexing
    web pages. Starting with the humble anchor (`a`) element, the cornerstone of their
    original PageRank algorithm, Google pioneered the use of semantic markup to infer
    meaning and relevancy. The other search engines soon followed and, as search engine
    spiders began hunting for other meaningful HTML elements on web pages (e.g., `h1`
    which indicates the most important content on a page), semantic markup became
    more important to the business world because proper use of it meant a better ranking
    in search engines and, thereby, a greater opportunity to attract new customers.


    # THE SEMANTIC FOUNDATION


    If content were soil, semantic markup would be the compost you''d add to ensure
    a productive garden. It enriches the content, providing your users with clues
    about intent and context, as well as supplementary information about the content
    itself.


    Take, for example, the abbreviation element (`abbr`). It is used to denote abbreviations
    (and acronyms, now that it has officially replaced the `acronym` element):'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Gatlinburg, <abbr title="Tennessee">TN</abbr>


    In this simple HTML snippet, you can see how the abbreviation enhances the letters
    “TN” by informing the user that they stand for “Tennessee.”


    As HTML has evolved, its vocabulary has steadily expanded to offer more options
    for describing the content it encapsulates. The advent of HTML5 ushered in a slew
    of new semantic options (such as `header`) and even augmented a few existing ones
    (such as the aforementioned `abbr` that took over for the ousted `acronym`). As
    we proceed through this chapter, we’ll employ several of these new/revised elements
    and I will provide a little background about why they are an appropriate choice
    for marking up content.


    Let’s get started.


    # SAYING WHAT WE MEAN


    Looking at the Retreats 4 Geeks web page¹, it may be hard to figure out where
    to start, but we’ll begin with the most important content: the name of the site
    and the links to the various sections of the page (since this is, for our purposes,
    a single-page website).


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_27_0.png)


    1. If you haven’t already downloaded the sample files, you can do so by visiting
    [adaptivewebdesign.info](http://adaptivewebdesign.info)'
