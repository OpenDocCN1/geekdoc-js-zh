    # AD-HOC SEMANTICS


    HTML is filled with attributes that help enrich the elements they adorn. It prescribes
    a number of “fixed use” ones, like `alt` and `title`, but it also offers a handful
    of attributes that can be used to build upon the language’s native semantics in
    a less formal way. I’m talking, of course, about `id` and `class`.


    When Dave Raggett drafted a specification for HTML 3.0,⁵ it contained two new
    concepts: classification and identification, expressed via the `class` and `id`
    attributes respectively.⁶ These


    > 5. HTML 3.0 was an ambitious spec, introducing numerous tags and attributes.
    Many of those new constructs were dropped by the time it reached recommendation
    status as HTML 3.2, but the `class` and `id` attributes survived. Funny enough,
    some of the very same constructs proposed in HTML 3.0 have found their way back
    into the HTML lexicon, either formally as part of HTML5 or quasi-formally as microformats.


    6. It’s worth noting that `class` and `id` each make a (very) brief appearance
    in the HTML 2 spec ([http://www.ietf.org/rfc/rfc1866.txt](http://www.ietf.org/rfc/rfc1866.txt)),
    but were not formally-defined attributes. They were simply used to demonstrate
    the fault tolerant way in which browsers should treat unknown attributes.'
