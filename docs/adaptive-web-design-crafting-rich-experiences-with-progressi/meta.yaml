    mind, it''s important to determine the best way to apply and control styles from
    within JavaScript so you don''t confuse your users by creating interfaces that
    don''t actually work. But more on that in a moment.


    Over the years, our understanding of how JavaScript and CSS should interact has
    evolved considerably. In the early days'
