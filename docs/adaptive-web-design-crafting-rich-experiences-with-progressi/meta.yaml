  md: '# CHAPTER 5: PROGRESSIVE ENHANCEMENT FOR ACCESSIBILITY


    In February of 2006, the National Federation of the Blind took legal action against
    Target for having an inaccessible website. A month later the case went to federal
    court (at Target’s request). Target tried to get the case thrown out, but it didn’t
    fly and the case turned into a class action lawsuit that Target eventually settled
    in 2008 for over $6 million US (not counting attorney fees). That’s pretty substantial
    considering that the reason the lawsuit was filed in the first place was because
    Target didn’t fix accessibility issues they were alerted to: lack of alt text
    on images, heavy use of image maps, and reliance on a mouse for the submission
    of forms. All of these issues could have been addressed quickly and easily for
    far less than $6 million. Hell, I’d have done it for a few grand.


    If you haven’t had a lot of exposure to accessibility—with respect to this chapter,
    a measure of how well a site can be'
