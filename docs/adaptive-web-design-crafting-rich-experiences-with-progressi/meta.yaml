  md: 'used by people with disabilities and the assistive technologies¹ they rely
    on—as a design consideration, it can seem incredibly daunting because there are
    so many factors to consider. Even if you fall into a category of users with “special
    needs,” it’s likely your experience and aptitudes are different from someone else
    with similar concerns. For example, you may have deuteranopia (a type of red-green
    color blindness), but yours may not be as extreme as someone else’s. You also
    may not be as likely to recognize potential issues for people with tritanopia
    (blue-yellow color blindness).


    If you’re the kind of person who is concerned with issues of accessibility, whether
    from the position of getting your message to as many people as possible or because
    you don’t want to make someone feel left out, the self-imposed pressure to “get
    it right” can seem so intense that you can’t help but approach it with trepidation.


    Thankfully, designing and developing with progressive enhancement improves accessibility.
    Progressive enhancement encourages you to build your websites in service of the
    content and that, more often than not, will help guide you toward the right decision
    when it comes to accessibility. Of course there’s always room for improvement,
    hence this chapter.


    # NOW YOU SEE ME . . .


    Perhaps the most heavily-repeated pattern in JavaScript-based page manipulation
    is showing and hiding content. Tabbed interfaces. Collapsible elements. Accordion
    widgets. It crops up nearly everywhere. In and of itself, this pattern is not
    a bad thing, but few people realize how profoundly your


    > 1. Assistive technologies come in many forms. Blind people who use screen-reading
    software. People with partially impaired vision may enlarge text in the browser.
    The deaf often rely on captioning to easily follow videos.'
