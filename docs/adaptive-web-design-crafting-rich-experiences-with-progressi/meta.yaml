  - '[PAGE 95]


    And there you have it: a perfect example of progressive enhancement with Javascript.


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_95_0.png)


    Figure 4.5: select-based navigation on an iPhone.


    As this simple example demonstrates, JavaScript is perfectly capable of generating
    everything it needs and getting rid of anything it doesn''t. You could even take
    this particular function a step farther and make it even more markup agnostic
    by allowing the root starting point (in our case, the child elements of `nav`)
    to be passed dynamically into the function. But I leave that to you to experiment
    with. Onward!


    # KEEP IT COPACETIC


    As we''ve covered, many of the progressive enhancement techniques available to
    us in HTML and CSS are pretty straightforward and may even have been part of your
    repertoire prior to picking up this book. Progressive enhancement with JavaScript,
    on the other hand, is a bit more complicated; JavaScript cannot be fault tolerant
    like the others because it is a programming language.'
  - "[PAGE 96]\n\nUnlike HTML and CSS, which describe content and provide design instructions\
    \ to a browser, respectively, JavaScript literally executes commands to the browser.\
    \ Because they actually *do* something, JavaScript programs stop running when\
    \ they encounter an error. The potential causes for these errors could be anything\
    \ from a typo to a missing dependency to accidentally writing an infinite loop.\
    \ Regardless of the cause, if you write code that doesn’t jive well with the browser’s\
    \ JavaScript interpreter, it will likely spit a big fat error right in your face\
    \ (or your customer’s). And no one wants that.\n\nAs we’ve seen, the implementation\
    \ of progressive enhancement at each stage in the continuum isn’t a binary choice\
    \ of having a particular technology or not having it. Instead, a user’s experience\
    \ at each level is variable based on the capabilities of the browser. So, if a\
    \ user’s browser supports RGBa natively, but not rounded corners, it’s not a big\
    \ deal; the user gets what she gets.\n\nWe need to approach JavaScript the same\
    \ way; it shouldn’t be an all or nothing option. Not to keep returning to food\
    \ metaphors time and time again, but we should offer technologies in an *à la\
    \ carte* fashion by dividing up the functionality into discrete, self-contained\
    \ packages. Once separated, these scripts can test for their own dependencies\
    \ and judge whether or not they should run based on the browsing environment and\
    \ the page they are to interact with.\n\nThe `select`-based navigation script\
    \ we just walked through is a good example of the first part of this concept in\
    \ practice; it is completely self-contained. It does not, however, properly test\
    \ for its numerous dependencies, the first of which is the availability of jQuery.\
    \ To do that, we would need to wrap the whole thing in a conditional:\n\n```\n\
    if ( typeof( jQuery ) != 'undefined' ) {\n    // Existing code goes here\n}\n\
    ```"
- md: "In this brief bit of code, we are checking for the existence of the jQuery\
    \ object, which is created when jQuery (the library) is present, by checking to\
    \ see that its type is not “undefined.” Dependency testing is a useful strategy\
    \ because it helps you avoid throwing errors in the browser and it can help speed\
    \ up the user’s browsing experience by not executing code unnecessarily.\n\nHere’s\
    \ another simple example that may prove more familiar to you:\n\n```\nif ( document.getElementById\
    \ ) {\n  // Code using document.getElementById() goes here\n}\n```\n\nIn this\
    \ case, we’re making sure the DOM traversal method document.getElementById exists\
    \ before we execute code that uses it. You probably recall us using this strategy\
    \ in the event delegation example when testing for event.preventDefault.\n\nReturning\
    \ to the jQuery test, we can take the test a step farther and check for a specific\
    \ version of jQuery. This form of testing can be useful if your script uses a\
    \ method not available in earlier versions of the library. In many cases, it’s\
    \ smarter to test for the existence of specific methods, but version checking\
    \ can be really helpful when a new release of the library substantially changes\
    \ the API for a pre-existing method:\n\n```\nif ( typeof( jQuery ) != 'undefined'\
    \ &&\n     parseFloat( jQuery.fn.jquery ) >= 1.4 ) {\n  /* Existing code that\
    \ requires jQuery 1.4 or higher\n     goes here */\n}\n```\n\nTesting for dependencies\
    \ is a great way to ensure you don’t execute code that could throw errors and,\
    \ the earlier you test, the more memory and processing time you can save a user\
    \ who won’t benefit from the script in the first place.\n\njQuery isn't the only\
    \ dependency the script has though; as you may recall, we took its markup dependencies\
    \ into account when we tested the lengths of both the `$old_nav` and `$links`\
    \ collections:\n\n```\nif ( $old_nav.length && $links.length ) {\n```\n\nWith\
    \ this test in place, the script quietly exits when it has nothing to do and it\
    \ doesn't bother creating any new elements or assigning any event handlers that\
    \ are destined to go unused.\n\nFollowing on this example, you can likely see\
    \ myriad scenarios where investigation into the browsing environment and the page\
    \ setup can help a script to determine whether or not it should run. Object existence,\
    \ markup dependencies, method availability, cookie availability, and Ajax support\
    \ are all ripe for the plucking. It's trivial to add code that allows a script\
    \ to quietly turn itself off when any of its dependencies are not available, so\
    \ there's really no reason not to do it.\n\nIf you think about it, the concept\
    \ of dependency testing is quite similar to using media queries in CSS. And, speaking\
    \ of CSS, we should talk about how to best manage the interaction between scripts\
    \ and style.\n\n# WORKING WITH STYLE\n\nOne script dependency we haven't discussed\
    \ yet is CSS. Nine times out of ten, if you are writing JavaScript that interacts\
    \ with the DOM, you're also working with CSS in one way or another. When developing\
    \ with progressive enhancement in mind, it's important to determine the best way\
    \ to apply and control styles from within JavaScript so you don't confuse your\
    \ users by creating interfaces that don't actually work. But more on that in a\
    \ moment.\n\nOver the years, our understanding of how JavaScript and CSS should\
    \ interact has evolved considerably. In the early days of JavaScript, style management\
    \ in a script was pretty much nonexistent; we just wrote everything inline by\
    \ manipulating an element’s style attribute:\n\n```\nfunction highlight() {\n\
    \  var el = document.getElementById( 'message' );\n  el.style.color = '#f00';\n\
    \  el.style.backgroundColor = '#fffcfc';\n}\n```\n\nFrom a maintenance perspective,\
    \ code written in this manner is a nightmare to work with. It means any time there’s\
    \ a design change, you need to get someone who understands JavaScript involved.\
    \ That’s hardly efficient and violates the separation of layers; mixing presentation\
    \ and behavior makes both of them harder to work with.\n\nThe next step in the\
    \ evolution was extracting the changeable bits to variables, either within the\
    \ script itself or passing them in as part of a configuration object (keeping\
    \ a sensible default in case the configuration was skipped):\n\n```\nfunction\
    \ highlight( config ) {\n  var el = document.getElementById( 'message' );\n  el.style.color\
    \ = config.color || '#f00';\n  el.style.backgroundColor = config.backgroundColor\n\
    \                              || '#fffcfc';\n}\n\nhighlight({\n  color: '#ebebeb',\n\
    \  backgroundColor: 'black'\n});\n```\n\nIt still requires at least a cursory\
    \ knowledge of JavaScript to update the strings, but hopefully all of the style\
    \ rules would be in one place, so the maintenance should be a bit easier.\n\n\
    Eventually, however, we realized it was much more efficient to maintain style\
    \ information in an external stylesheet and trigger it by manipulating the class\
    \ of an element on the page:\n\n```\nfunction highlight() {\n    document.getElementById(\
    \ 'message' )\n        .className += ' highlight';\n}\n```\n\nNot only did this\
    \ reduce the amount of code necessary to accomplish the desired effect, but it\
    \ also meant fewer DOM manipulations (which increased performance tremendously)\
    \ and it meant the CSS could be maintained without modifying the JavaScript that\
    \ would be interacting with those styles.\n\nI'm going to forgo a discussion of\
    \ the different ways you can bundle your scripts and styles together while still\
    \ maintaining a decent amount of separation, in favor of spending some time on\
    \ when and how to best apply styles using a script. While the former is certainly\
    \ an interesting topic,¹² the route you choose to go has more to do with your\
    \ work flow and overall project needs. When and how your scripts apply styles,\
    \ however, is of critical importance and is the subject of my final maxim for\
    \ progressive enhancement with JavaScript:\n\n+   3. Apply no style before its\
    \ time.\n\nAs we've already covered, most DOM scripting requires a bit of style\
    \ modification as well—whether it's to expand and collapse an element on the page,\
    \ highlight newly added content, or provide visual flourishes to a drag and drop\
    \ interface. Using style in this manner is perfectly legitimate, but, more often\
    \ than not, developers apply styles that correspond to a given widget before they\
    \ have determined if the widget can even run.\n\nLet's take, for example, an accordion\
    \ widget. In a typical accordion interface, the content blocks are hidden and\
    \ only the associated headings are visible. If the styles applied to hide the\
    \ content sections were applied by default and the script was unable to run, a\
    \ user would be unable to click a header to reveal the hidden content. The styles\
    \ would have undermined the usefulness of the interface because they were applied\
    \ too early.\n\nIf, on the other hand, the script itself were to trigger the application\
    \ of the initial state styles when it knew it would be able to run, there would\
    \ not be any problem whatsoever. If the script didn't run, the widget-related\
    \ styles would not be applied and the content would still be visible and, thereby,\
    \ usable. Implementing the style application in this way, you provide one layout\
    \ for the content when the widget can't run and another set of styles when it\
    \ can, optimizing both use cases.\n\nCould it be? Why yes, I think it is. Progressive\
    \ enhancement perfection.\n\nOne of the best ways to manage triggering interface\
    \ styles like this is by using an “activator” `class` on the root element of the\
    \ widget. Here are some quick examples:\n\n| STRATEGY | “RESTING” CLASS | “ACTIVATED”\
    \ CLASS |\n| :--- | :--- | :--- |\n| Add a suffix of “-on” to the base `class`\
    \ | `.accordion` | `.accordion-on` |\n| Add another `class` | `.auto-submit` |\
    \ `.auto-submit.active` |\n| Change the form of the `class` | `.replace-me` |\
    \ `.replaced` |\n\nTable 4.1: Using an “activator” `class`.\n\nBy following this\
    \ practice, you can guarantee that no styles will be applied before they are needed.\n\
    \nAnother issue with style application by JavaScript is the potential for collisions.\
    \ Just as it is important to isolate your scripts from one another to avoid collisions\
    \ in variable, function, or method naming, it is recommended that you isolate\
    \ your script-related styles from others as well. After all, you may not be able\
    \ to control what other `class` names may be in use on a given page (especially\
    \ if you're releasing a script for other people to use) and if you don't carefully\
    \ sequester your styles, they can unintentionally “bleed” onto the rest of the\
    \ page (i.e., they might be applied to elements you didn't intend them to apply\
    \ to).\n\nTo corral your styles, it's best to start every selector with an identifiable\
    \ marker unlikely to be in conflict with another `class` or `id` on the page.\
    \ I like to begin with the name of the JavaScript object. So, for example, if\
    \ I built an accordion widget named (cleverly) `AccordionWidget`, I might classify"
  mdcn: "\n在这段简短的代码中，我们正在检查 jQuery 对象的存在性，当 jQuery（该库）存在时，该对象会被创建，通过检查其类型是否为“undefined”。依赖检测是一个有用的策略，因为它有助于避免浏览器中抛出错误，并且可以通过避免不必要地执行代码来加快用户的浏览速度。\n\
    \n这里还有另一个你可能更熟悉的简单例子：\n\n```\nif ( document.getElementById ) {\n  // Code using\
    \ document.getElementById() goes here\n}\n```\n\n在这种情况下，我们在执行使用 DOM 遍历方法 `document.getElementById`\
    \ 的代码之前，先确保它存在。你可能还记得我们在事件委托示例中使用这种策略来测试 `event.preventDefault`。\n\n回到 jQuery\
    \ 测试，我们可以更进一步，检查 jQuery 的特定版本。如果你的脚本使用了早期版本库中不可用的方法，这种测试形式会很有用。在许多情况下，测试特定方法的存在性更为明智，但当库的新版本实质上改变了现有方法的\
    \ API 时，版本检查会非常有帮助：\n\n```\nif ( typeof( jQuery ) != 'undefined' &&\n     parseFloat(\
    \ jQuery.fn.jquery ) >= 1.4 ) {\n  /* Existing code that requires jQuery 1.4 or\
    \ higher\n     goes here */\n}\n```\n\n测试依赖性是确保你不会执行可能抛出错误代码的好方法，而且，你测试得越早，就能为那些从脚本中无法获益的用户节省越多的内存和处理时间。\n\
    \n不过，jQuery 并不是脚本唯一的依赖项；正如你可能回忆起的，当我们在测试 `$old_nav` 和 `$links` 集合的长度时，我们已经考虑了它的标记依赖：\n\
    \n```\nif ( $old_nav.length && $links.length ) {\n```\n\n有了这个测试，当脚本无事可做时，它会悄然退出，不会费心创建任何注定不会被使用的新元素或分配任何事件处理程序。\n\
    \n基于这个例子，你可能能看到无数种场景，其中对浏览环境和页面设置的调查可以帮助脚本确定是否应该运行。对象存在性、标记依赖、方法可用性、Cookie 可用性和\
    \ Ajax 支持都是唾手可得的。添加允许脚本在依赖项不可用时悄然关闭的代码是微不足道的，所以真的没有理由不去做。\n\n仔细想想，依赖测试的概念与在 CSS\
    \ 中使用媒体查询非常相似。说到 CSS，我们应该谈谈如何最好地管理脚本和样式之间的交互。\n\n# 处理样式\n\n我们尚未讨论的一个脚本依赖项是 CSS。十有八九，如果你正在编写与\
    \ DOM 交互的 JavaScript，你也会以某种方式使用 CSS。在进行渐进增强开发时，确定从 JavaScript 内部应用和控制样式的最佳方式非常重要，这样你就不会通过创建实际不起作用的界面来迷惑你的用户。不过，稍后会详细讨论这一点。\n\
    \n多年来，我们对 JavaScript 和 CSS 应该如何交互的理解已经发生了很大演变。在 JavaScript 的早期，脚本中的样式管理几乎不存在；我们只是通过操作元素的\
    \ style 属性来内联编写所有内容：\n\n```\nfunction highlight() {\n  var el = document.getElementById(\
    \ 'message' );\n  el.style.color = '#f00';\n  el.style.backgroundColor = '#fffcfc';\n\
    }\n```\n\n从维护的角度来看，以这种方式编写的代码是个噩梦。这意味着任何设计变更都需要让懂 JavaScript 的人参与进来。这效率低下，且违反了层分离原则；将表现和行为混在一起会使两者都更难处理。\n\
    \n演变的下一步是将可变部分提取到变量中，要么在脚本本身内部，要么作为配置对象的一部分传入（在跳过配置时保留合理的默认值）：\n\n```\nfunction\
    \ highlight( config ) {\n  var el = document.getElementById( 'message' );\n  el.style.color\
    \ = config.color || '#f00';\n  el.style.backgroundColor = config.backgroundColor\n\
    \                              || '#fffcfc';\n}\n\nhighlight({\n  color: '#ebebeb',\n\
    \  backgroundColor: 'black'\n});\n```\n\n这仍然需要至少对 JavaScript 有基本的了解才能更新字符串，但希望所有的样式规则都集中在一个地方，这样维护应该会容易一些。\n\
    \n然而，最终我们意识到，在外部样式表中维护样式信息，并通过操作页面上的元素类来触发它，效率要高得多：\n\n```\nfunction highlight()\
    \ {\n    document.getElementById( 'message' )\n        .className += ' highlight';\n\
    }\n```\n\n这不仅减少了实现所需效果的代码量，还意味着更少的 DOM 操作（这极大地提高了性能），并且意味着 CSS 可以在不修改与这些样式交互的\
    \ JavaScript 的情况下进行维护。\n\n我将放弃讨论将脚本和样式打包在一起的不同方式，同时仍然保持相当程度的分离，转而花一些时间讨论何时以及如何最好地使用脚本应用样式。虽然前者无疑是一个有趣的话题，¹²\
    \ 但你选择的路径更多地与你的工作流程和整体项目需求有关。然而，脚本何时以及如何应用样式至关重要，这也是我关于使用 JavaScript 进行渐进增强的最后一条准则的主\n\
    \n题：\n\n+   3. 样式未到，时机未到。\n\n正如我们已经讨论过的，大多数 DOM 脚本也需要一些样式修改——无论是展开和折叠页面上的元素、突出显示新添加的内容，还是为拖放界面提供视觉修饰。以这种方式使用样式完全合理，但开发者通常在确定部件能否运行之前就应用了与该部件对应的样式。\n\
    \n例如，以一个手风琴部件为例。在典型的手风琴界面中，内容块是隐藏的，只有相关的标题是可见的。如果用于隐藏内容部分的样式被默认应用，而脚本无法运行，用户将无法单击标题来揭示隐藏的内容。样式会过早应用，从而破坏了界面的实用性。\n\
    \n另一方面，如果脚本本身在知道它将能够运行时才触发初始状态样式的应用，那就不会有任何问题。如果脚本不运行，部件相关的样式就不会被应用，内容仍然可见，因此也是可用的。通过这种方式实现样式应用，当部件无法运行为内容提供一种布局，当它可以运行时提供另一套样式，从而优化了两种使用情况。\n\
    \n可能是这样吗？是的，我认为是的。渐进增强的完美境界。\n\n管理这种触发界面样式效果的最佳方式之一是在部件的根元素上使用一个“激活器”`class`。以下是一些快速示例：\n\
    \n| 策略 | “静息”类 | “激活”类 |\n| :--- | :--- | :--- |\n| 在基础 `class` 后添加 “-on” 后缀 |\
    \ `.accordion` | `.accordion-on` |\n| 添加另一个 `class` | `.auto-submit` | `.auto-submit.active`\
    \ |\n| 改变 `class` 的形式 | `.replace-me` | `.replaced` |\n\n表 4.1：使用“激活器”`class`。\n\
    \n通过遵循此实践，你可以保证在需要之前不会应用任何样式。\n\n通过 JavaScript 应用样式的另一个问题是潜在的冲突。正如将脚本彼此隔离以避免变量、函数或方法命名冲突很重要一样，建议你也将与脚本相关的样式与其他样式隔离。毕竟，你可能无法控制给定页面上可能使用的其他\
    \ `class` 名称（尤其是当你为他人使用发布脚本时），如果你不仔细隔离你的样式，它们可能会无意中“渗透”到页面的其余部分（即它们可能被应用到你未曾打算应用的元素上）。\n\
    \n为了规范你的样式，最好在每个选择器开头使用一个标识性标记，该标记不太可能与页面上的另一个 `class` 或 `id` 冲突。我喜欢以 JavaScript\
    \ 对象的名称开头。因此，例如，如果我构建了一个（聪明地）命名为 `AccordionWidget` 的手风琴部件，我可能会将其分类为...\n"
