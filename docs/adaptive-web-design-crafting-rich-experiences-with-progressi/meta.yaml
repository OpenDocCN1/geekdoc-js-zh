    \ In fact, they are simply identifiable milestones on the path from the most basic\
    \ experience to the most exceptional one. A user's actual experience may vary\
    \ at one or more points along the path and that's alright; as long as we keep\
    \ progressive enhancement in mind, our customers will be well served.\n\n# LET'S\
    \ DIG IN\n\nThe remainder of this book will take you on a tour of the various\
    \ mile markers on the progressive enhancement highway, starting with markup and\
    \ continuing through CSS, JavaScript and, finally, ARIA. Along the way, we'll\
    \ examine the application of progressive enhancement techniques on an event page\
    \ found on Retreats4Geeks.com. By design, this book is not intended to be an exhaustive\
    \ compendium of progressive enhancement techniques, so the examples will be brief\
    \ and focused, exposing you to current best practices and jump-starting your use\
    \ of progressive enhancement in your own work.\n\n# THINK OF THE USER, NOT THE\
    \ BROWSER\n\n16\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_23_0.png)\n\nFigure\
    \ 1.4: The event page from Retreats4Geeks.com that we will be dissecting throughout\
    \ this book.\n\n> “The meaning is in the content of the text and not in the typeface.”\n\
    \n— WIM CROUWEL\n\n# CHAPTER 2: PROGRESSIVE ENHANCEMENT WITH MARKUP\n\nWhen it\
    \ comes to the web, markup calls the shots. It is the foundation upon which every\
    \ beautiful design and each amazing experience is built. Whether your preferred\
    \ flavor is HTML or its more rigorous sibling, XHTML, each element has a purpose\
    \ and can profoundly affect the user experience for better or worse, depending\
    \ on how you use (or abuse) it.\n\n## FROM A ROUGH START TO THE RIGHT WAY™\n\n\
    When we first began building web pages, many of us misunderstood the importance\
    \ of good markup. Those of us coming to the web from a programming background\
    \ often considered learning HTML beneath us, so we never put in the time to come\
    \ to grips with the semantics it provided. Those of us who came to the web from\
    \ a design background didn't understand the importance of semantics either. We\
    \ thought only of the presentational aspect of a web page and latched on to the\
    \ `table` as a means of laying out pages on a grid, then we went hog-wild and\
    \ found hundreds of other uses for the `table` element, many of which supplanted\
    \ existing (and well-supported) semantic elements (like lists).\n\nIn many offices\
    \ across the globe, advocacy for semantic application of HTML fell on deaf ears;\
    \ the argument was seen as a largely idealistic one because: 1) the fact remained\
    \ that old-school websites looked okay in modern browsers and 2) the case for\
    \ greater web accessibility was lost on many people who had no first-hand experience\
    \ of using the web with a disability. Then Google came along and changed everything.\
    \ Suddenly, semantic markup was important.\n\nGoogle was the first search engine\
    \ to take semantics into account when indexing web pages. Starting with the humble\
    \ anchor (`a`) element, the cornerstone of their original PageRank algorithm,\
    \ Google pioneered the use of semantic markup to infer meaning and relevancy.\
    \ The other search engines soon followed and, as search engine spiders began hunting\
    \ for other meaningful HTML elements on web pages (e.g., `h1` which indicates\
    \ the most important content on a page), semantic markup became more important\
    \ to the business world because proper use of it meant a better ranking in search\
    \ engines and, thereby, a greater opportunity to attract new customers.\n\n##\
    \ THE SEMANTIC FOUNDATION\n\nIf content were soil, semantic markup would be the\
    \ compost you'd add to ensure a productive garden. It enriches the content, providing\
    \ your users with clues about intent and context, as well as supplementary information\
    \ about the content itself.\n\nTake, for example, the abbreviation element (`abbr`).\
    \ It is used to denote abbreviations (and acronyms, now that it has officially\
    \ replaced the `acronym` element):\n\nGatlinburg, <abbr title=\"Tennessee\">TN</abbr>\n\
    \nIn this simple HTML snippet, you can see how the abbreviation enhances the letters\
    \ “TN” by informing the user that they stand for “Tennessee.”\n\nAs HTML has evolved,\
    \ its vocabulary has steadily expanded to offer more options for describing the\
    \ content it encapsulates. The advent of HTML5 ushered in a slew of new semantic\
    \ options (such as `header`) and even augmented a few existing ones (such as the\
    \ aforementioned `abbr` that took over for the ousted `acronym`). As we proceed\
    \ through this chapter, we’ll employ several of these new/revised elements and\
    \ I will provide a little background about why they are an appropriate choice\
    \ for marking up content.\n\nLet’s get started.\n\n## SAYING WHAT WE MEAN\n\n\
    Looking at the Retreats 4 Geeks web page¹, it may be hard to figure out where\
    \ to start, but we’ll begin with the most important content: the name of the site\
    \ and the links to the various sections of the page (since this is, for our purposes,\
    \ a single-page website).\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_27_0.png)\n\
    \n1. If you haven’t already downloaded the sample files, you can do so by visiting\
    \ [adaptivewebdesign.info](http://adaptivewebdesign.info)\n\nLet's consider this\
    \ component from a semantician's point of view, starting with the logo. The Retreats\
    \ 4 Geeks logo is an image, so we should use an `img` element to mark it up.²\
    \ It's also pretty important because it provides a context for the entire page,\
    \ so it should be wrapped in an `h1`, an element reserved for the most important\
    \ content on a page:\n\n```\n<h1><img src=\"i/logo.png\"/></h1>\n```\n\nThough\
    \ the example page is written using HTML5, I've always been more comfortable with\
    \ the XML serialization of the language, so I've chosen to stick with that syntax\
    \ (as evidenced by the trailing slash on the `img` element). It is more a matter\
    \ of preference than requirement.\n\nMoving on to the navigation, we're presenting\
    \ a list of links, so it should be marked up as such. As the order of the links\
    \ corresponds to the order of the sections on the page, the list should probably\
    \ be of the ordered variety (`ol`). Each link gets placed in a list item (`li`)\
    \ and wrapped in an anchor element (`a`):\n\n```\n<ol>\n  <li><a href=\"#details\"\
    >Details</a></li>\n  <li><a href=\"#schedule\">Schedule</a></li>\n  <li><a href=\"\
    #instructors\">Instructors</a></li>\n  <li><a href=\"#lodging\">Lodging</a></li>\n\
    \  <li><a href=\"#location\">Location</a></li>\n</ol>\n```\n\nUp until this point,\
    \ we've made the obvious choices with regard to markup, employing semantics we've\
    \ had in HTML since the beginning. Just over a year ago, we would have likely\
    \ stopped here and considered the header complete, but HTML5 gives us the opportunity\
    \ to improve both the semantic value and the accessibility of this content.\n\n\
    > ² Yeah, I know, you could also use the `object` element or make it text and\
    \ use CSS to replace it with an image, but we're going for simplicity here.\n\n\
    Traditionally, we might have employed a page division (div) with a semantic identifier\
    \ (id) of “header” to contain these two elements. Divisions, as you’ll recall,\
    \ are used to group content, but they provide no context as to the purpose or\
    \ function of that group (which is why we would identify it as the “header”).\
    \ HTML5, however, introduces an element that provides the explicit semantic meaning\
    \ for that division: header.\n\nSemantically, a header is used to demarcate any\
    \ content that is summarily important to a page or section of a page. It can be\
    \ used to encapsulate headings or heading groups (contained in the new hgroup\
    \ element), relevant navigational aids, and introductory content. As such, it\
    \ makes a perfect container for the title of our page and the list of anchors\
    \ to each article within the page.\n\nHTML5 also grants us another more appropriate\
    \ option when it comes to the navigation. Whereas we would have traditionally\
    \ identified the ordered list as “nav” or “main-nav,” HTML5’s nav element more\
    \ directly expresses the semantics we’re trying to imbue the ol with by providing\
    \ that semantic id. The nav element can be used to wrap any group of navigational\
    \ links and functions as the semantic equivalent of the ARIA landmark role of\
    \ “navigation” (which we’ll discuss more in Chapter 5).\n\nWith these additions,\
    \ the markup for this section is now:\n\n```\n<header>\n    <h1><img src=\"i/logo.png\"\
    /></h1>\n    <nav>\n        <ol>\n            <li><a href=\"#details\">Details</a></li>\n\
    \            <li><a href=\"#schedule\">Schedule</a></li>\n            <li><a href=\"\
    #instructors\">Instructors</a></li>\n```"
  mdcn: "\n这些经验层次（也可以理解为支持层次）相互叠加，创造出一种随每一步而愈发丰富的体验，但它们绝非用户将获得的全部体验。事实上，它们只是从最基本体验到最卓越体验这条道路上可识别的里程碑。用户在实际路径中的一个或多个节点上的体验可能有所不同，这很正常；只要我们始终牢记渐进增强，我们的用户就能得到妥善的服务。\n\
    \n# 让我们深入探讨\n\n本书的剩余部分将带你游览渐进增强高速公路上的各种里程碑，从标记语言开始，依次介绍 CSS、JavaScript，最后是 ARIA。在此过程中，我们将考察渐进增强技术在\
    \ Retreats4Geeks.com 活动页面上的应用。本书并非旨在成为一部详尽无遗的渐进增强技术大全，因此示例将简明扼要、重点突出，旨在让你了解当前的最佳实践，并帮助你在自己的工作中快速启动渐进增强的应用。\n\
    \n# 想着用户，而不是浏览器\n\n16\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_23_0.png)\n\n\
    图 1.4：我们将贯穿本书剖析的 Retreats4Geeks.com 活动页面。\n\n> “意义存在于文本的内容中，而非字体中。”\n\n— 维姆·克劳威尔\n\
    \n# 第 2 章：使用标记语言实现渐进增强\n\n谈到网络，标记语言掌控着一切。它是构建每一个精美设计和每一次惊艳体验的基石。无论你偏好的形式是 HTML\
    \ 还是其更严谨的兄弟 XHTML，每个元素都有其用途，并且根据你如何使用（或滥用）它，都可能极大地改善或恶化用户体验。\n\n## 从粗放起步到正确之道™\n\
    \n当我们最初开始构建网页时，许多人误解了良好标记的重要性。我们这些从编程背景转战网络的人，常常认为学习 HTML 不够“高级”，因此从未投入时间去掌握它所提供的语义。而那些从设计背景转战网络的人，也不理解语义的重要性。我们只关注网页的呈现方面，将\
    \ `table` 元素奉为在网格上布局页面的法宝，然后肆无忌惮地为 `table` 元素发掘出数百种其他用途，其中许多用途取代了已有的（且支持良好的）语义元素（如列表）。\n\
    \n在全球许多办公室里，倡导正确应用 HTML 语义的呼声都无人理睬；这一论点被视为很大程度上是理想主义的，因为：1）事实是旧式网站在现代浏览器中看起来也还可以；2）关于增强网络可访问性的论证，对于许多没有亲身体验过使用残障辅助设备上网的人来说，毫无意义。接着，谷歌出现了，改变了一切。突然之间，语义标记变得至关重要。\n\
    \n谷歌是第一个在网页索引时考虑语义的搜索引擎。从最基础的锚点（`a`）元素——其原始 PageRank 算法的基石——开始，谷歌率先使用语义标记来推断含义和相关性。其他搜索引擎很快纷纷效仿，随着搜索引擎爬虫开始在网页上寻找其他有意义的\
    \ HTML 元素（例如，表示页面最重要内容的 `h1`），语义标记对商业世界变得更加重要，因为正确使用它意味着在搜索引擎中获得更好的排名，从而有更大的机会吸引新客户。\n\
    \n## 语义基础\n\n如果内容是土壤，那么语义标记就是你为了确保花园多产而添加的堆肥。它丰富了内容，为你的用户提供关于意图和上下文的线索，以及关于内容本身的补充信息。\n\
    \n例如，缩写元素（`abbr`）。它用于表示缩写（以及首字母缩略词，因为它已正式取代了 `acronym` 元素）：\n\nGatlinburg, <abbr\
    \ title=\"Tennessee\">TN</abbr>\n\n在这个简单的 HTML 代码片段中，你可以看到缩写如何通过告知用户 \"TN\" 代表\
    \ \"Tennessee\" 来增强这些字母的含义。\n\n随着 HTML 的发展，其词汇量稳步扩大，为描述其封装的内容提供了更多选择。HTML5 的出现引入了一系列新的语义选项（例如\
    \ `header`），甚至增强了一些现有的选项（例如前面提到的 `abbr` 接管了被淘汰的 `acronym`）。在本章的后续内容中，我们将使用其中一些新的/修订的元素，并提供一些背景信息，说明为什么它们是标记内容的合适选择。\n\
    \n让我们开始吧。\n\n## 表达我们的本意\n\n查看 Retreats 4 Geeks 网页¹，可能很难确定从何处入手，但我们将从最重要的内容开始：网站的名称和指向页面各个部分的链接（因为就我们的目的而言，这是一个单页网站）。\n\
    \n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_27_0.png)\n\n1. 如果你尚未下载示例文件，可以访问 [adaptivewebdesign.info](http://adaptivewebdesign.info)\
    \ 进行下载。\n\n让我们从语义学家的角度来考虑这个组件，从 logo 开始。Retreats 4 Geeks 的 logo 是一个图像，所以我们应该使用\
    \ `img` 元素来标记它。² 它也相当重要，因为它为整个页面提供了上下文，因此应该用 `h1` 包裹起来，`h1` 是为页面上最重要的内容保留的元素：\n\
    \n```\n<h1><img src=\"i/logo.png\"/></h1>\n```\n\n尽管示例页是使用 HTML5 编写的，但我一直更习惯于该语言的\
    \ XML 序列化格式，因此我选择坚持使用该语法（如 `img` 元素末尾的斜杠所示）。这更多是偏好问题，而非强制要求。\n\n接下来是导航部分，我们呈现的是一个链接列表，因此应该将其标记为列表。由于链接的顺序对应于页面上各个部分的顺序，该列表很可能是有序列表（`ol`）。每个链接放置在一个列表项（`li`）中，并用一个锚点元素（`a`）包裹：\n\
    \n```\n<ol>\n  <li><a href=\"#details\">Details</a></li>\n  <li><a href=\"#schedule\"\
    >Schedule</a></li>\n  <li><a href=\"#instructors\">Instructors</a></li>\n  <li><a\
    \ href=\"#lodging\">Lodging</a></li>\n  <li><a href=\"#location\">Location</a></li>\n\
    </ol>\n```\n\n到目前为止，我们在标记方面做出了显而易见的选择，使用了 HTML 自诞生以来就有的语义。就在一年多以前，我们可能到此为止，认为页头部分已经完成，但\
    \ HTML5 让我们有机会提高这部分内容的语义价值和可访问性。\n\n> ² 是的，我知道，你也可以使用 `object` 元素，或者将其设为文本并用 CSS\
    \ 替换为图像，但这里我们追求的是简单性。\n\n传统上，我们可能会使用一个带有语义标识符（id）为“header”的页面分区（div）来容纳这两个元素。如你所知，分区（divisions）用于分组内容，但它们不提供关于该分组的目的或功能的上下文（这就是为什么我们将其标识为“页头”）。然而，HTML5\
    \ 引入了一个元素，为该分区提供了明确的语义含义：header。\n\n从语义上讲，header 用于界定任何对页面或页面部分至关重要的内容。它可以用于封装标题或标题组（包含在新的\
    \ `hgroup` 元素中）、相关的导航辅助工具以及介绍性内容。因此，它非常适合作为页面标题和指向页面内各文章的锚点列表的容器。\n\nHTML5 还在导航方面为我们提供了另一个更合适的选择。传统上，我们可能会将有序列表标识为“nav”或“main-nav”，而\
    \ HTML5 的 `nav` 元素通过提供那个语义 id，更直接地表达了我们试图赋予 `ol` 的语义。`nav` 元素可用于包裹任何一组导航链接，其功能等同于\
    \ ARIA 地标角色中的“navigation”（我们将在第 5 章进一步讨论）。\n\n有了这些补充，此部分的标记现在变为：\n\n```\n<header>\n\
    \    <h1><img src=\"i/logo.png\"/></h1>\n    <nav>\n        <ol>\n           \
    \ <li><a href=\"#details\">Details</a></li>\n            <li><a href=\"#schedule\"\
    >Schedule</a></li>\n            <li><a href=\"#instructors\">Instructors</a></li>\n\
    ```\n"
