- md: "# PLANNING AND RESTRAINT\n\nMake no mistake, progressive enhancement with JavaScript\
    \ requires considerably more effort than it does with CSS or HTML. With a bit\
    \ of thoughtful reflection and consideration of the numerous factors that affect\
    \ the web experience, however, it quickly becomes second nature. And, when in\
    \ doubt, you can always come back to the three maxims:\n\n1.  Make sure all content\
    \ is accessible and all necessary tasks can be completed without JavaScript turned\
    \ on.\n2.  Use JavaScript to generate any additional markup it needs.\n3.  Apply\
    \ no style before its time.\n\nArmed with a solid understanding of how to best\
    \ wield the power of JavaScript, you're sure to make smart decisions and build\
    \ even more usable sites.\n\n> “It takes many good deeds to build a good reputation,\
    \ and only one bad one to lose it.”\n>\n> — BENJAMIN FRANKLIN\n\n# CHAPTER 5:\
    \ PROGRESSIVE ENHANCEMENT FOR ACCESSIBILITY\n\nIn February of 2006, the National\
    \ Federation of the Blind took legal action against Target for having an inaccessible\
    \ website. A month later the case went to federal court (at Target’s request).\
    \ Target tried to get the case thrown out, but it didn’t fly and the case turned\
    \ into a class action lawsuit that Target eventually settled in 2008 for over\
    \ $6 million US (not counting attorney fees). That’s pretty substantial considering\
    \ that the reason the lawsuit was filed in the first place was because Target\
    \ didn’t fix accessibility issues they were alerted to: lack of alt text on images,\
    \ heavy use of image maps, and reliance on a mouse for the submission of forms.\
    \ All of these issues could have been addressed quickly and easily for far less\
    \ than $6 million. Hell, I’d have done it for a few grand.\n\nIf you haven’t had\
    \ a lot of exposure to accessibility—with respect to this chapter, a measure of\
    \ how well a site can be used by people with disabilities and the assistive technologies¹\
    \ they rely on—as a design consideration, it can seem incredibly daunting because\
    \ there are so many factors to consider. Even if you fall into a category of users\
    \ with “special needs,” it’s likely your experience and aptitudes are different\
    \ from someone else with similar concerns. For example, you may have deuteranopia\
    \ (a type of red-green color blindness), but yours may not be as extreme as someone\
    \ else’s. You also may not be as likely to recognize potential issues for people\
    \ with tritanopia (blue-yellow color blindness).\n\nIf you’re the kind of person\
    \ who is concerned with issues of accessibility, whether from the position of\
    \ getting your message to as many people as possible or because you don’t want\
    \ to make someone feel left out, the self-imposed pressure to “get it right” can\
    \ seem so intense that you can’t help but approach it with trepidation.\n\nThankfully,\
    \ designing and developing with progressive enhancement improves accessibility.\
    \ Progressive enhancement encourages you to build your websites in service of\
    \ the content and that, more often than not, will help guide you toward the right\
    \ decision when it comes to accessibility. Of course there’s always room for improvement,\
    \ hence this chapter.\n\n> ¹Assistive technologies come in many forms. Blind people\
    \ who use screen-reading software. People with partially impaired vision may enlarge\
    \ text in the browser. The deaf often rely on captioning to easily follow videos.\n\
    \n# NOW YOU SEE ME . . .\n\nPerhaps the most heavily-repeated pattern in JavaScript-based\
    \ page manipulation is showing and hiding content. Tabbed interfaces. Collapsible\
    \ elements. Accordion widgets. It crops up nearly everywhere. In and of itself,\
    \ this pattern is not a bad thing, but few people realize how profoundly your\
    \ choice of hiding mechanism can influence the accessibility of your content to\
    \ assistive technologies like screen readers.\n\nWhen it comes to hiding content,\
    \ there are several mechanisms for doing it and each has a different affect on\
    \ the page, as summarized in the table below.\n\n| CSS RULES | DISPLAY EFFECT\
    \ | ACCESSIBILITY EFFECT |\n| :--- | :--- | :--- |\n| `visibility: hidden;` |\
    \ Element is hidden from view, but is not removed from the normal flow (i.e.,\
    \ it still takes up the space it normally would) | Content is ignored by screen\
    \ readers |\n| `display: none;` | Element is removed from the normal flow and\
    \ hidden; the space it occupied is collapsed | Content is ignored by screen readers\
    \ |\n| `height: 0; width: 0; overflow: hidden;` | Element is collapsed and contents\
    \ are hidden | Content is ignored by screen readers |\n| `text-indent: -999em;`\
    \ | Contents are shifted off-screen and hidden from view, but links may “focus”\
    \ oddly and negative indent may not prove long enough to fully hide content |\
    \ Screen readers have access to the content, but the content is limited to text\
    \ and inline elements |\n| `position: absolute; left: -999em;` | Content is removed\
    \ from the normal flow and shifted off the left-hand edge; the space it occupied\
    \ is collapsed | Screen readers have access to the content |\n\nTable 5.1: Mechanisms\
    \ for hiding content.\n\nThe first two mechanisms are probably the most popular,\
    \ with `display: none;` being the go-to option implemented by nearly every JavaScript\
    \ library on the planet and the lion's share of ready-made JavaScript widgets.\
    \ If you don't want your hidden content to be read by a screen reader, those defaults\
    \ may work for you, but if you want to ensure users have access to content (even\
    \ if it isn't displayed visually in the current interface), the final option is\
    \ really the way to go.\n\nIf you roll your own JavaScript library, positioning\
    \ content off-screen to hide it is pretty easy to implement. If, however, you\
    \ are using a third-party JavaScript library, such as jQuery or Prototype, this\
    \ task becomes much more difficult to accomplish because making the change requires\
    \ overwriting or otherwise changing the internals of the library. Unless, of course,\
    \ you're smart about how you do it.\n\nMost libraries include, as part of their\
    \ animation suite, a mechanism for including what are referred to as “callback\
    \ functions.” A callback function is a function that you supply to another function\
    \ (or object method) so it can be called at a predetermined time. If you've used\
    \ JavaScript to load content via Ajax, you're probably familiar with the concept:\
    \ callback functions are used to do something with the data you got back from\
    \ the server.\n\nIn most cases, JavaScript libraries only offer a callback function\
    \ that runs at the completion of a given activity, but some libraries also provide\
    \ hooks for various other points during the execution of a given routine, such\
    \ as before the routine begins. Even without additional callback hooks, however,\
    \ it's possible to create more accessible show/hide operations. Take the following\
    \ jQuery-based snippet, for example:\n\n```javascript\n(function(){\n    var $button\
    \ = $('#myButton'),\n        $text   = $('#myText'),\n        visible = true;\n\
    \n    $button.click(function(){\n        if ( visible ) {\n            $text.slideUp('fast');\n\
    \        } else {\n            $text.slideDown('fast');\n        }\n        visible\
    \ = ! visible;\n    });\n})();\n```\n\nThis script finds two elements (#myButton\
    \ and #myText), assigning them to two local variables ($button and $text, respectively)\
    \ before setting a third local variable (visible) to track the current state of\
    \ things. It then goes on to assign an onclick event handler to #myButton that\
    \ toggles the visibility of #myText by adjusting its height. Pretty straightforward,\
    \ right?\n\nThis script works as you'd expect, but jQuery currently uses display:\
    \ none when you call slideUp(), so #myText is being hidden via a method that prohibits\
    \ the hidden text from being read by a screen reader. By making a subtle tweak\
    \ to the code, however, we can trigger the addition of a class we control that\
    \ provides for a more accessible means of hiding content:\n\n```javascript\n(function(){\n\
    \    var $button = $('#myButton'),\n        $text   = $('#myText'),\n        visible\
    \ = true;\n\n    $button.click(function(){\n        if ( visible ) {\n       \
    \     $text.slideUp('fast',function(){\n                $text.addClass('accessibly-hidden')\n\
    \                     .slideDown(0);\n            });\n        } else {\n    \
    \        $text.slideUp(0,function(){\n```"
  mdcn: "\n# 规划与约束\n\n请务必明确，使用JavaScript实现渐进增强所投入的精力，远比CSS或HTML要多得多。然而，只要稍加深入思考，并全面考量影响网页体验的诸多因素，这种理念很快就会成为你的本能。况且，若有疑虑，你总可以回归以下三条箴言：\n\
    \n1.  确保所有内容均可访问，且无需JavaScript即可完成所有必要任务。\n2.  使用JavaScript来生成它所需的任何额外标记。\n3.\
    \  适度应用样式，切忌过早。\n\n掌握了如何高效运用JavaScript力量的坚实理解，你定能做出明智的决策，并构建出更具可用性的网站。\n\n> “良好的声誉需要无数善行来建立，而一次劣行就足以将其毁于一旦。”\n\
    >\n> —— 本杰明·富兰克林\n\n# 第五章：面向可访问性的渐进增强\n\n2006年2月，美国全国盲人联合会就网站无障碍问题对Target提起了诉讼。一个月后，案件移交至联邦法院（应Target要求）。Target试图驳回此案，但未能成功，最终演变为集体诉讼，并于2008年以Target支付超过600万美元（不包括律师费）达成和解。考虑到诉讼的起因仅仅是Target未修复他们早已被告知的可访问性问题——图片缺少替代文本、过度使用图像映射以及提交表单时依赖鼠标——这一金额相当可观。所有这些问题本可以快速、轻松地解决，成本远低于600万美元。天哪，我只需几千美元就能搞定。\n\
    \n如果你对可访问性——就本章而言，它衡量的是网站在多大程度上能被残障人士及其所依赖的辅助技术¹使用——缺乏了解，作为一项设计考量，它可能显得极其令人畏惧，因为需要考虑的因素实在太多。即使你自己属于“有特殊需求”的用户群体，你的经验和能力也可能与有类似需求的他人不同。例如，你可能患有绿色弱（一种红绿色盲），但程度或许不如他人严重。你也可能不太会意识到黄色蓝色盲人群可能面临的潜在问题。\n\
    \n如果你是那种关心可访问性问题的人，无论你是出于将信息尽可能广泛传播的立场，还是出于不想让任何人感到被遗漏的初心，那种“必须做对”的自我施压感可能会如此强烈，以至于你不禁会带着忧虑去面对它。\n\
    \n值得庆幸的是，采用渐进增强进行设计和开发能提升可访问性。渐进增强鼓励你以服务内容为核心来构建网站，而这往往能在可访问性方面引导你做出正确的决策。当然，总有改进的空间，因此有了这一章。\n\
    \n> ¹辅助技术有多种形式。例如使用屏幕阅读软件的盲人，通过浏览器放大文字的部分视力受损者，以及经常依赖字幕来轻松理解视频内容的聋人。\n\n# 现在你看见我了……\n\
    \n基于JavaScript的页面操作模式中，最常见的一种或许是内容的显示与隐藏。标签式界面、可折叠元素、手风琴小部件……它几乎无处不在。这种模式本身并非坏事，但很少有人意识到，你选择的隐藏机制会如何深刻地影响辅助技术（如屏幕阅读器）对你内容的可访问性。\n\
    \n当涉及隐藏内容时，有几种机制可供选择，每种对页面的影响各不相同，如下表总结所示。\n\n| CSS规则 | 显示效果 | 可访问性影响 |\n| :---\
    \ | :--- | :--- |\n| `visibility: hidden;` | 元素在视觉上隐藏，但不从正常文档流中移除（即它仍占据其通常占据的空间）\
