  md: '# A LITTLE MISUNDERSTANDING GOES A LONG WAY


    As a fault-tolerant language, CSS is a near perfect addition to the progressive
    enhancement toolbox. In many ways, ignorance is bliss because we can reliably
    use new features and syntax without having to worry about the browser falling
    apart when it doesn''t understand something. But what if a browser *thinks* it
    understands something, but its understanding is horribly flawed? Yes, of course,
    I''m speaking of Internet Explorer.


    IE9 was released as this book was in production. Based on what I''ve seen so far,
    it looks like the team has made good on their promise to support standards (including
    CSS) in a completely interoperable way. IE8 was no slouch in the CSS department,
    but when you start looking back at IE7 and (shudder) IE6, things take a turn for
    the worse.


    Thankfully, the smart folks at Microsoft gave us a tool that makes it easy to
    sequester browser-specific patches to CSS, JavaScript, and even markup: Conditional
    Comments.<sup>8</sup> Conditional Comments are exactly what you''d expect: a specifically-formatted
    HTML comment that is interpreted by IE but is ignored by all other browsers (because
    it''s a comment).


    Conditional Comments are a boon for the progressive enhancement world because,
    while progressive enhancement isn''t really about the browser, in practical application,
    some browsers need a little hand-holding to meet the needs of our users. Conditional
    Comments give us authors the ability to target a specific version (or versions)
    of IE. Here''s a quick example of how to put them to use:'
  merge: -1
  pgno: 68
- img_proc: true
  md: "```\n<link rel=\"stylesheet\" href=\"c/main.css\"/>\n<!--[if IE 9]><link rel=\"\
    stylesheet\"\n  href=\"c/ie9.css\"/><![endif]-->\n<!--[if lte IE 8]><link rel=\"\
    stylesheet\"\n  href=\"c/ie8.css\"/><![endif]-->\n<!--[if lte IE 7]><link rel=\"\
    stylesheet\"\n  href=\"c/ie7.css\"/><![endif]-->\n<!--[if lte IE 6]><link rel=\"\
    stylesheet\"\n  href=\"c/ie6.css\"/><![endif]-->\n```\n\nIn this particular snippet,\
    \ you can see that we are including our core CSS file (`main.css`) on the first\
    \ line. After that, we have a conditionally-commented stylesheet directed at IE9,\
    \ using the syntax `if IE 9`. Skip that one for a moment and focus on the following\
    \ three lines, the first of which targets IE8 and below (`if lte IE 8` {meaning\
    \ “if less than or equal to IE8”}), the second of which targets IE7 and below\
    \ (`if lte IE 7`), and the final line which targets IE6 and below. Used in concert\
    \ and in this specific order, these three conditionally-commented stylesheets\
    \ streamline the CSS patching process by allowing the patches you applied to more\
    \ recent versions of IE to trickle down to earlier versions. The reasoning? Well,\
    \ if an issue exists in IE7, it’s pretty likely that IE6 had the same problem.\n\
    \nThe conditional comment for IE9, by contrast, only targets that specific browser.\
    \ It could easily be set up in the same “less than or equal to” manner as the\
    \ subsequent conditional comments, but IE9 is a substantial departure from IE8\
    \ on many levels, including its CSS support. Any issues it has are not likely\
    \ to be issues with those earlier browsers, so there’s no need to make those older\
    \ browsers read and parse the additional rules. The same setup could have been\
    \ done for IE8 as well, as the mechanisms that define its CSS support are completely\
    \ different than those in IE7 and it shares few, if any, issues with IE7 and earlier,\
    \ but as the design requires that we use some IE-specific filters, it made sense\
    \ to only have to write them once."
  merge: -1
