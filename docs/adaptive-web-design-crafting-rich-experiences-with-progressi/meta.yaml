    \ DOM 树的更上层（实际上是从 `div`）监听 `select` 的 `onchange` 事件，并将一个匿名函数赋值给该事件，该函数将新的位置推送到浏览器的地址栏（导致浏览器跳转到新的部分或加载新页面，具体取决于链接类型）。\n\
    \n搞定！功能性的基于 `select` 的导航。现在需要在条件合适时将其添加到页面中。为此，我们将创建一个名为 `toggleDisplay` 的新函数，该函数将监视浏览器窗口大小并处理一种导航样式与另一种的切换：\n\
