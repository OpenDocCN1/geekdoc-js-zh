  md: "The intent was that this attribute would contain a list of subclasses for the\
    \ particular element they were applied to, with the classes listed from most general\
    \ to most specific:9\n\n```\n<a href=\"...\" title=\"...\">\n    <img class=\"\
    illustration map\" src=\"...\" alt=\"...\"/>\n</a>\n```\n\nThe spec introduced\
    \ the `id` attribute for the purposes of identifying a specific element on the\
    \ page (this is why each `id` on a page needs to be unique). In practice, this\
    \ identifier would be used as a reference point for style rules (`#details { ...\
    \ }`), scripts (`document.getElementById('details')`), and anchors (`<a href=\"\
    #details\">`). You may recall that we actually used that last mechanism in the\
    \ navigation introduced earlier in the chapter.\n\nAs all of the information for\
    \ the Retreats 4 Geeks event is included on a single page, I've grouped each chunk\
    \ of content into separate `article` elements10, each with a unique `id`. The\
    \ `article` element was introduced as part of HTML5 and demarcates content that\
    \ forms an independent part of the document, such as a newspaper article, blog\
    \ post, or, in our case, a distinct topic. Each of the articles on the page is\
    \ then targeted, using its `id` as an anchor reference, by the navigation links.\
    \ Clicking one of these links will jump a user directly to the appropriate content:\n\
    \n9. You'll see this throughout the HTML 3 draft, whenever `class` is defined\
    \ for an element.\n\n10. Not to be confusing, but HTML5 also introduces the `section`\
    \ element (also seen in the above code example). In HTML5 parlance, the `section`\
    \ element denotes *a section of content* (go figure, right?). In terms of overall\
    \ organization, I could have declared the whole page an `article`, making each\
    \ distinct chunk a `section` of that `article`, but I decided that individual\
    \ `article` elements made more sense because each chunk of content is independent\
    \ enough that it could easily exist on its own page. The semantic difference between\
    \ the two is modest at best and the choice of one over the other is really at\
    \ the discretion of the author."
