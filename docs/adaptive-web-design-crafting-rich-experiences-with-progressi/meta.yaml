  md: "Traditionally, we might have employed a page division (div) with a semantic\
    \ identifier (id) of “header” to contain these two elements. Divisions, as you’ll\
    \ recall, are used to group content, but they provide no context as to the purpose\
    \ or function of that group (which is why we would identify it as the “header”).\
    \ HTML5, however, introduces an element that provides the explicit semantic meaning\
    \ for that division: header.\n\nSemantically, a header is used to demarcate any\
    \ content that is summarily important to a page or section of a page. It can be\
    \ used to encapsulate headings or heading groups (contained in the new hgroup\
    \ element), relevant navigational aids, and introductory content. As such, it\
    \ makes a perfect container for the title of our page and the list of anchors\
    \ to each article within the page.\n\nHTML5 also grants us another more appropriate\
    \ option when it comes to the navigation. Whereas we would have traditionally\
    \ identified the ordered list as “nav” or “main-nav,” HTML5’s nav element more\
    \ directly expresses the semantics we’re trying to imbue the ol with by providing\
    \ that semantic id. The nav element can be used to wrap any group of navigational\
    \ links and functions as the semantic equivalent of the ARIA landmark role of\
    \ “navigation” (which we’ll discuss more in Chapter 5).\n\nWith these additions,\
    \ the markup for this section is now:\n\n```\n<header>\n    <h1><img src=\"i/logo.png\"\
    /></h1>\n    <nav>\n        <ol>\n            <li><a href=\"#details\">Details</a></li>\n\
    \            <li><a href=\"#schedule\">Schedule</a></li>\n            <li><a href=\"\
    #instructors\">Instructors</a></li>\n```"
  merge: -1
