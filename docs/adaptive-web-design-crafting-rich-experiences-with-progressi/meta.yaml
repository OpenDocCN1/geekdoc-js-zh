  md: "The first two mechanisms are probably the most popular, with `display: none;`\
    \ being the go-to option implemented by nearly every JavaScript library on the\
    \ planet and the lion's share of ready-made JavaScript widgets. If you don't want\
    \ your hidden content to be read by a screen reader, those defaults may work for\
    \ you, but if you want to ensure users have access to content (even if it isn't\
    \ displayed visually in the current interface), the final option is really the\
    \ way to go.\n\nIf you roll your own JavaScript library, positioning content off-screen\
    \ to hide it is pretty easy to implement. If, however, you are using a third-party\
    \ JavaScript library, such as jQuery or Prototype, this task becomes much more\
    \ difficult to accomplish because making the change requires overwriting or otherwise\
    \ changing the internals of the library. Unless, of course, you're smart about\
    \ how you do it.\n\nMost libraries include, as part of their animation suite,\
    \ a mechanism for including what are referred to as “callback functions.” A callback\
    \ function is a function that you supply to another function (or object method)\
    \ so it can be called at a predetermined time. If you've used JavaScript to load\
    \ content via Ajax, you're probably familiar with the concept: callback functions\
    \ are used to do something with the data you got back from the server.\n\nIn most\
    \ cases, JavaScript libraries only offer a callback function that runs at the\
    \ completion of a given activity, but some libraries also provide hooks for various\
    \ other points during the execution of a given routine, such as before the routine\
    \ begins. Even without additional callback hooks, however, it's possible to create\
    \ more accessible show/hide operations. Take the following jQuery-based snippet,\
    \ for example:\n\n```\n(function(){\n    var $button = $('#myButton'),\n     \
    \   $text   = $('#myText'),\n        visible = true;\n```"
