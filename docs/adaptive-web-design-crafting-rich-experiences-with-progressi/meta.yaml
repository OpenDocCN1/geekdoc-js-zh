    HTML5 element (if any) that serves the same purpose.*


    At present, there is a bit of back-and-forth between the HTML5 community and accessibility
    advocates over what to do about the redundancy. From a practical standpoint, even
    if you are using HTML5''s ARIA-equivalent semantics it''s generally considered
    a good idea to double up with the ARIA landmark roles because not all assistive
    technologies are HTML5-aware yet. Structural roles, however, can be assigned at
    your own discretion as they are purely organizational and are not currently exposed
    to users via assistive technology.


    A quick scan of the Retreats 4 Geeks source code will reveal this redundancy on
    the `nav` and `footer` elements. As assistive technologies are updated to be HTML5-compatible,'
