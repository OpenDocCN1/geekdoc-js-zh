    \ DO IT... ACCESSIBLY\n\nAccessibility is complex and can be difficult to wrap\
    \ your mind around, but if you tackle it a little at a time, it becomes second\
    \ nature. And, as with everything else in this book, accessibility is most easily\
    \ applied in layers, building up the interface bit by bit to create something\
    \ that meets your users’ needs, whatever they may be.\n\n> \"If you want to build\
    \ a ship, don’t drum up the men to gather wood, divide the work and give orders.\
    \ Instead, teach them to yearn for the vast and endless sea.\"\n\n— ANTOINE DE\
    \ SAINT-EXUPÉRY\n\n## CHAPTER 6: TAKE IT AWAY\n\nIn our brief time together, we've\
    \ covered a lot of ground. We witnessed progressive enhancement in action, tracing\
    \ the development of a simple text document into a beautiful, functional, and\
    \ accessible web page. It was a whirlwind journey to be sure, but hopefully you\
    \ are coming away from it with a better picture of what progressive enhancement\
    \ is, why it works, and how to incorporate it into your design and development\
    \ process. Perhaps you've even picked up a few useful techniques that you'll be\
    \ able to apply in your own projects.\n\n## THE PROGRESSIVE ENHANCEMENT CHECKLIST\n\
    \n### Content & HTML\n\n- Author copy that is well-written and makes sense when\
    \ read aloud.\n  This is the baseline experience for every user and it matters.\n\
    - Choose semantically-appropriate elements.\n  Using the existing semantics in\
    \ HTML does wonders for accessibility (and search engine optimization).\n- Use\
    \ Microformats to fortify HTML's gaps.\n  Microformats are extensions to the HTML\
    \ lexicon and are supported by numerous browsers and several search engines.\n\
    - Use classification to group elements serving the same function.\n  Classification\
    \ (i.e., using the class attribute) helps convey meaning about elements when HTML's\
    \ inherent semantics fail you and no microformats fit the bill.\n- Identify landmark\
    \ elements.\n  Identification (i.e., using the id attribute) is a great way to\
    \ give context to specific regions of a page or specific instances of a classified\
    \ element.\n\n### CSS\n\n- Double check your compound selectors.\n  Mixing selectors\
    \ of vastly different complexity can cause issues when a browser doesn't understand\
    \ one of them: the entire rule set will be ignored. If your intent is to hide\
    \ the rule set from older browsers, however, this can be a useful tactic.\n- Organize\
    \ your CSS rules with the cascade in mind.\n  Order matters and proper organization\
    \ of your style rules can help you create a progressive design and make your CSS\
    \ more maintainable.\n- Hide groups of advanced CSS rule sets from older browsers.\n\
    \  One of the most powerful tools available in CSS for hiding rule sets *en masse*\
    \ is by using `@media` blocks.\n- Use Conditional Comments to handle IE issues.\n\
    \  Older versions of IE are notoriously buggy and Conditional Comments are the\
    \ best way to provide CSS and JavaScript patches to specific versions of IE. They\
    \ work best in the \"trickle-down\" pattern.\n- Make sure you've accounted for\
    \ alternate media and contexts.\n  Media assignment and media queries can be used\
    \ to deliver tailored layouts and experiences based on the user's context.\n\n\
    ### JavaScript\n\n- Ensure all JavaScript is \"unobtrusive\".\n  Scripts should\
    \ be maintained as far from the markup as possible and should be as generic as\
    \ possible. This allows you to re-factor them independently. Your JavaScripts\
    \ should not be tied to specific markup, but be flexible enough to adapt as your\
    \ pages evolve.\n- Make sure all content is accessible and all necessary tasks\
    \ can be completed without JavaScript turned on.\n  You can't rely on JavaScript.\
    \ Period. If you want to enhance with JavaScript, follow the Hijax pattern.\n\
    - Use JavaScript to generate any additional markup it needs.\n  JavaScript is\
    \ great at manipulating the DOM, so there's no reason to hard-code markup into\
    \ a page that is only there for your script's benefit.\n- Use JavaScript to enable\
    \ script-related styles.\n  There are few things as annoying as content being\
    \ organized into a widget and having the widget not work because JavaScript is\
    \ turned off or there's an error in the script. Use a switch to allow JavaScript\
    \ to turn widget-related styles on.\n- Delivered scripts à la carte whenever possible.\n\
    \  Any script that can run independently should be designed to do so, with its\
    \ own set of tests to determine whether or not it can run.\n\n### Accessibility\n\
    \n- Use ARIA landmarks where appropriate.\n  If you're using HTML5, some ARIA\
    \ landmarks may seem redundant, but it's better to have too cover your bases.\
    \ It's trivial to use them and they can greatly improve the accessibility of a\
    \ page.\n- Use ARIA roles and states to provide users with more detail about widgets.\n\
    \  When you create a widget using JavaScript, there are very few ways to provide\
    \ users with valuable information about what is happening when they are interacting\
    \ with it. Roles and states fill in the blanks.\n- Use Tabindex to control a user's\
    \ journey through the page.\n  Using the tabindex attribute, you carve a path\
    \ through your page, bringing users to the important landmarks quickly and easily.\
    \ Taking it a step further, JavaScript can be used to adjust what can and cannot\
    \ be focused as a user interacts with various page components."
  mdcn: "\n我们意识到，过度使用`tabindex`属性可能会让用户陷入困境（而且并非有益的那种）。<sup>9</sup> 但我们发现的最重要的事情是，我们可以利用JavaScript来“调度”`tabindex`属性，从而简化用户在复杂界面组件（如选项卡式界面或手风琴式表单）中的操作路径。\n\
    \n那么，究竟什么是`tabindex`调度呢？大约在2005年（确切起源难以考证），人们发现为元素的`tabindex`属性赋值\"-1\"，可以将该元素从文档的默认制表符顺序中移除。<sup>10</sup>\
    \ 有趣的是，尽管被移出了文档的制表符顺序，该元素仍然可以通过JavaScript（`element.focus()`）获得焦点，这为控制用户体验开辟了诸多可能性。\n\
    \n让我们通过一个场景来回顾一下之前的选项卡式界面：\n\n- 1. 用户访问选项卡式界面，按下键盘上的`tab`键，焦点移动到第一个选项卡（该选项卡与当前可见的选项卡面板相关联）。\n\
    - 2. 再次按下`tab`键，焦点会从选项卡界面移出，进入下一个可聚焦的内容，而不是跳转到列表中的下一个选项卡。\n- 3. 按住`shift`键的同时按下`tab`键，会将用户带回选项卡列表，并将焦点恢复到当前活动的选项卡上。\n\
    - 4. 使用方向键，用户可以在选项卡列表中向前或向后移动，焦点移动时，相应的选项卡面板也会随之显示。\n- 5. 在浏览选项卡列表时，按下`enter`键，会将焦点带到与该选项卡相关的选项卡面板上。\n\
    \n<sup>9</sup> http://webaim.org/techniques/keyboard/tabindex\n<sup>10</sup> 这尤其有趣，因为根据W3C规范，`tabindex`应仅接受0到32767之间的值。\n\
    \n我知道这有很多“选项卡”（而且要求有点高），但通过`tabindex`调度和一点JavaScript，实现起来就变得相当简单了。方法如下：\n\n- 1.\
    \ 为每个选项卡和选项卡面板分配一个值为\"-1\"的`tabindex`，可以将它们从页面的制表符顺序中移除。\n- 2. 重新为当前活动的选项卡分配一个值为\"\
    0\"的`tabindex`，可以恢复其在制表符顺序中的默认位置。\n- 3. 使用JavaScript，你可以在用户执行键盘命令（如左/右、上/下方向键）时，动态调整每个选项卡的`tabindex`属性，使用户能够快速轻松地浏览界面。\n\
    \n以下是`TabInterface`的`swap`方法中的一段代码片段，展示了`tabindex`调度的实际应用（同时涉及一些ARIA属性操作和`class`切换）：\n\
    \n```\nfunction swap( e ) {\n  // ...\n  // De-activating the current tab & tab\
    \ panel\n  removeClassName( old_tab, 'active' );\n  old_tab.setAttribute( 'aria-selected',\
    \ 'false' );\n  old_tab.setAttribute( 'tabindex', '-1' );\n  removeClassName(\
    \ old_folder, 'visible' );\n  old_folder.setAttribute( 'aria-hidden', 'true' );\n\
    \  // Activating the new tab & tab panel\n  addClassName( tab, 'active' );\n \
    \ tab.setAttribute( 'aria-selected', 'true' );\n  tab.setAttribute( 'tabindex',\
    \ '0' );\n  addClassName( new_folder, 'visible' );\n  new_folder.setAttribute(\
    \ 'aria-hidden', 'false' );\n  // ...\n}\n```\n\n如果你想看看这项技术的实际效果，可以查看Github上的TabInterface.js。<sup>11</sup>\n\
    \n## 立即行动... 无障碍地\n\n无障碍性很复杂，可能难以完全理解，但如果你一点一点地去攻克，它就会成为一种本能。并且，正如本书中的所有其他内容一样，无障碍性最容易通过分层应用来实现，逐步构建界面，创造出满足用户需求（无论需求是什么）的东西。\n\
    \n> “如果你想造一艘船，不要敲锣打鼓召集人们来收集木材、分配工作和发号施令。相反，要教会他们向往浩瀚无垠的海洋。”\n\n— 安托万·德·圣-埃克苏佩里\n\
    \n## 第六章：开始行动\n\n在我们短暂的相处中，我们涵盖了大量内容。我们目睹了渐进增强的实践过程，追踪了一个简单文本文档如何发展成为一个美观、功能齐全且无障碍的网页。这无疑是一段旋风般的旅程，但希望你能从中更好地理解什么是渐进增强、它为何有效，以及如何将其融入你的设计和开发流程。或许你甚至已经掌握了一些有用的技巧，能够应用到你自己的项目中。\n\
    \n## 渐进增强清单\n\n### 内容与 HTML\n\n- 编写良好且朗读时清晰易懂的文案。\n  这是每个用户的基础体验，非常重要。\n- 选择语义上合适的元素。\n\
    \  利用HTML现有的语义对无障碍性（以及搜索引擎优化）大有裨益。\n- 使用微格式来弥补HTML的不足。\n  微格式是HTML词汇表的扩展，受到众多浏览器和搜索引擎的支持。\n\
    - 使用分类来将具有相同功能的元素分组。\n  当HTML固有语义不足且没有合适的微格式时，分类（即使用class属性）有助于传达元素的含义。\n- 标识地标元素。\n\
    \  标识（即使用id属性）是为页面特定区域或特定分类实例提供上下文的好方法。\n\n### CSS\n\n- 仔细检查你的复合选择器。\n  混合复杂程度差异巨大的选择器可能会在浏览器无法理解其中一个选择器时导致问题：整个规则集将被忽略。然而，如果你的意图是从旧浏览器中隐藏该规则集，这可能是一种有用的策略。\n\
    - 组织你的CSS规则时要考虑到层叠。\n  顺序很重要，正确组织样式规则可以帮助你创建渐进式设计，并使你的CSS更易于维护。\n- 从旧浏览器中隐藏成组的高级CSS规则集。\n\
    \  CSS中用于批量隐藏规则集的最强大工具之一是使用`@media`块。\n- 使用条件注释处理IE问题。\n  旧版IE的bug是出了名的，条件注释是为特定版本的IE提供CSS和JavaScript补丁的最佳方式。它们在“自上而下”模式中效果最好。\n\
    - 确保你已考虑到替代媒体和上下文。\n  媒体赋值和媒体查询可用于根据用户的上下文提供定制的布局和体验。\n\n### JavaScript\n\n- 确保所有JavaScript都是“非侵入式”的。\n\
    \  脚本应尽可能远离标记语言，并尽可能通用。这使你能够独立地重构它们。你的JavaScript不应与特定标记绑定，而应足够灵活，以便随着页面的演变而适应。\n\
    - 确保所有内容都是可访问的，并且在没有开启JavaScript的情况下所有必要任务都能完成。\n  你不能依赖JavaScript。这是底线。如果你想用JavaScript进行增强，请遵循Hijax模式。\n\
    - 使用JavaScript生成其所需的任何额外标记。\n  JavaScript非常擅长操作DOM，因此没有理由将仅为脚本服务的标记硬编码到页面中。\n\
    - 使用JavaScript启用与脚本相关的样式。\n  没有什么比内容被组织成一个控件，却因JavaScript被关闭或脚本出错而无法工作更烦人的了。使用一个开关让JavaScript能够开启与控件相关的样式。\n\
    - 尽可能按需提供脚本。\n  任何可以独立运行的脚本都应设计为如此，并配备一套测试来判断它是否可以运行。\n\n### 无障碍性\n\n- 在适当的地方使用ARIA地标。\n\
    \  如果你使用HTML5，一些ARIA地标可能看起来是多余的，但最好还是覆盖到，以防万一。使用它们很简单，却能极大地提升页面的无障碍性。\n- 使用ARIA角色和状态为用户提供关于控件的更多细节。\n\
    \  当你使用JavaScript创建控件时，几乎没有方法向用户提供有关他们与控件交互时正在发生什么的有价值信息。角色和状态填补了这些空白。\n- 使用Tabindex控制用户在页面中的导航路径。\n\
    \  使用tabindex属性，你可以为用户在页面中的导航划定路径，将他们快速轻松地引导至重要的地标。更进一步，JavaScript可用于在用户与页面各种组件交互时，调整哪些元素可以获得焦点，哪些不能。\n"
