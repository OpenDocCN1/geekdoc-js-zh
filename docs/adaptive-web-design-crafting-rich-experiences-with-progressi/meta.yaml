- md: '## 容错性与进化


    容错性还有一个有趣的方面，就是它如何允许进化。同样，看看自然界，你会在那些气候或其他环境因素导致足够变化，使得生物被迫适应、迁移或死亡的区域看到这一点。


    1977年，加拉帕戈斯群岛经历了一场干旱，导致支撑群岛雀鸟种群的小种子 availability 大幅减少。<sup>1</sup> 群岛上百分之八十五的雀鸟因饥饿而死亡。奇怪的是，存活下来的是那些体型较大的鸟。为什么？因为它们拥有能够敲开那些
    available 的更大、更坚硬种子的大喙。在没有干旱的情况下，较大的雀鸟相对于它们较小的亲戚并没有明显优势，但当环境改变时，它们 perfectly positioned
    to take advantage of the situation 并 not only survived the drought, but passed
    their genes along to the next generation of finches which, as you''d expect, tended
    to be larger.


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_11_0.png)


    *图1.1：加拉帕戈斯雀鸟（又名达尔文雀，Geospiza fortis）各异的喙，见于John Gould的《小猎犬号航行期间的动物学》。*


    HTML和CSS与加拉帕戈斯雀鸟有很多共同之处。它们的设计都旨在“向前兼容”，这意味着我们今天编写的 everything will work tomorrow
    and next year and in ten years。在某种意义上，它们是 perfect finch： designed to thrive no
    matter how the browsing environment itself changes.


    这些语言被设计为随时间进化，因此网络浏览器被指示 play by the rules of fault tolerance and ignore anything
    they didn’t understand。这为这些语言提供了成长和适应的空间，而不会达到一个 point where the content they
    ensconce and style would no longer be readable or run the risk of causing a browser
    to crash。容错性使得 us possible to browse an HTML5-driven website in Lynx 并 allows
    us to experiment with CSS3 features without worrying about breaking Internet Explorer
    6.


    理解容错性是理解渐进增强的关键。容错性是渐进增强能够 work 并 makes it possible to ensure all content delivered
    on the web is accessible and available to everyone 的原因。


    由于容错性自 HTML 和 CSS 诞生之初就已存在，你可能会认为我们（作为网络专业人士）在构建网站时会 recognize their importance
    and value。不幸的是，情况并非总是如此。


    # “优雅”的失误


    在网络诞生后的近十年里，这个媒介 rapidly evolved。首先，伊利诺伊大学国家超级计算应用中心（简称NCSA）给了我们 Mosaic，第一个图形浏览器，HTML
    也有了 img 元素。然后是音频。然后是视频。然后是交互。仅仅跟上 rapidly-evolving technology 就是一个挑战，而在我们 rushing
    to keep up 的过程中，我们 lost sight of fault tolerance and began building according
    to the latest fashion。我们的一些网站完全由覆盖在 elegantly designed JPEGs 上的全页图像映射组成。其他网站则成为了
    Macromedia''s Flash and Director 的神殿。Few were usable and even fewer were accessible.


    这个时代催生了被称为“优雅降级”的开发哲学。


    优雅降级在哲学上是容错性那个 superficial, image-obsessed sister，她专注于最新的时尚，只和 cool kids 一起玩。应用到网络上，优雅降级意味着给
    latest and greatest browsers 一顿 full-course meal，而给那些 unfortunate enough to be
    using an older or less-capable browser 的 sad folk 几口残羹冷炙。


    在优雅降级的鼎盛时期，我们专注于确保我们的网站在 market share 最大的现代浏览器中工作。对旧浏览器的支持测试，即使我们做了，也被 relegated
    to the end of the list of priorities。


    我们的推理很简单：HTML 和 CSS 具有容错性，所以用户至少会得到一些东西，which (of course) ignored the fact that
    JavaScript, like other programming languages, is not fault tolerant (i.e., if
    you try to use a method that doesn''t exist, it throws an error)；相反，使用 JavaScript
    的脚本和应用程序必须被 written such that they can either recover from an error (perhaps by
    trying an alternate method of execution) or predict the potential for an error
    and exit before it''s experienced.


    但几乎没有人这样做，因为我们的焦点始终是 forward，我们 looking for the next shiny toy we could play with。我们假设旧浏览器会有
    inferior experience，所以我们 made the justification that it wasn''t worth spending
    the time to ensure it was at least a decent, error-free one。当然，我们会 address the
    most egregious errors，但 beyond that, users were left to fend for themselves。（可悲的是，我们中的一些人甚至
    went so far as to actively block browsers we didn''t want to bother supporting。）


    # 容错性的兴起


    随着时间的推移，网络上的聪明人 began to realize that graceful degradation''s emphasis on image
    over substance was all wrong。他们看到优雅降级 directly undermining both content availability
    and accessibility。这些设计师和开发者 understood that the web was intended for the distribution
    and consumption of content—words, images, video, etc.—and began basing all of
    their markup, style, and interaction decisions on how each choice would affect
    the availability of that content.


    通过 refocusing their efforts，开发者开始 embrace the fault tolerant nature of HTML and
    CSS as well as JavaScript-based feature detection to enrich a user''s experience。他们开始
    realize that a great experience needn''t be an all-or-almost-nothing proposition
    (as was the case under graceful degradation)，而是 web technologies could be applied
    as layers that would build upon one another to create richer experiences and interactions；Steve
    Champeon of the Web Standards Project perfectly captured the essence of this philosophy
    when he christened it "progressive enhancement."¹


    # 在任何层面都美味


    我喜欢用花生 M&M 来类比渐进增强。花生 M&M 的中心，well，是花生。花生本身就是 a rich source of protein and fat；a
    great food that everyone can enjoy (except those with an allergy, of course)。similarly，我们网站的内容应该
    able to be enjoyed without embellishment。


    用巧克力覆盖那颗花生，你就 creates a mouthwatering treat that, like the peanut, also tastes
    great。同样，content beautifully organized and arranged using CSS is often easier
    to understand and certainly more fun to consume。


    通过 coating our nutty confection with a sugary candy shell，这种零食的体验 yet again improved。similarly，we
    can cap off our beautiful designs with engaging JavaScript-driven interactions
    that ease our movement through the content or bring it to life in unique and entertaining
    ways.


    这，of course，是对渐进增强的 oversimplification，但它 gives you a general sense of how it
    works。Technologies applied as layers—HTML, then HTML & CSS, then HTML, CSS & JavaScript—can
    create different experiences, each one equally valid (and tasty)。而这一切的核心是 the
    nut: great content。


    # 内容优先的方法


    网络是关于信息的。每一天，每一个网站，信息被 disseminated, requested, and collected。信息交换对 web 的 growth
    至关重要，并且毫无疑问将继续 drive its continued expansion into just about every facet of our
    daily lives。


    作为网络如此重要的一个方面，fostering the exchange of information 应该是我们在构建任何网络界面时的 primary focus。渐进增强确保所有内容（即网站包含的信息）对任何人都是
    available to and usable by，无论 her location, the device she is using to access
    that information, or the capabilities of the program she is using to access that
    content。similarly，内容收集机制——网络表单、调查等——也 benefit greatly from progressive enhancement
    because it ensures they are universally usable and, hence, better at doing their
    job.


    从根本上说，渐进增强是关于 accessibility，但 not in the limited sense the term is most often
    used。术语“无障碍性”传统上用于 denote making content available to individuals with “special
    needs”（行动不便、认知障碍或视力受损的人）；渐进增强将 this one step further by recognizing that we all
    have special needs。我们的特殊需求 may also change over time and within different contexts。当我用手机加载一个网站时，for
    example, I am visually limited by my screen resolution (especially if I am using
    a browser that encourages zooming) and I am limited in my ability to interact
    with buttons and links because I am browsing with my fingertips, which are far
    larger and less precise than a mouse cursor.


    正如我们已经 covered，以优雅降级为指导原则构建的网站在现代浏览器中可能 work great，但在 anything less than the latest
    and greatest browsers for which they were built 中 viewing 时就 come up short。从一个非网络的角度来看，它
    puts the user in a position where, like a young child at an amusement park, she
    may miss out on'
