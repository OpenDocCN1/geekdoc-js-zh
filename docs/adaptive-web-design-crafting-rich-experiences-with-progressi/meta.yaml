    \  <li><a href=\"#instructors\">Instructors</a></li>\n  <li><a href=\"#lodging\"\
    >Lodging</a></li>\n  <li><a href=\"#location\">Location</a></li>\n</ol>\n```\n\
    \nYou should recognize this bit of markup from Chapter 2; it’s the navigation\
    \ for the Retreats 4 Geeks page. The only difference between this and our original\
    \ markup is that the `ol` now has a `role` attribute with a value of “navigation.”\
    \ As you’d suspect, the ARIA landmark “navigation” role denotes that an element\
    \ is acting as a navigational mechanism.\n\nAll of ARIA’s landmark roles convey\
    \ information about regions of the page itself and are useful for overall page\
    \ navigation. Some assistive technologies expose these landmarks to users, allowing\
    \ them to directly move from region to region via keystrokes or other means. They\
    \ are the logical successor to a bevy of “skip to” links. Structural roles, on\
    \ the other hand, act as organizational tools akin to HTML5 elements like `section`\
    \ and `article`.\n\nYou may recall that, in the original example, we wrapped the\
    \ navigational `ol` in a new HTML5 element: `nav`. If you are really on the ball,\
    \ you’ll also recall that using the `nav` element is semantically-equivalent to\
    \ employing the landmark role “navigation.” And this isn’t the only area of overlap\
    \ between HTML5 and ARIA.\n\n> 4. “Skip to” links are links that provide anchor-based\
    \ access to regions of a page. Common implementations include “Skip to content”\
    \ and “Skip to navigation.” They were a mainstay of the web standards world for\
    \ many years, but ARIA’s landmark roles make these links redundant."
