  raw:
  - "[PAGE 55]\n\nIn this proof-of-concept piece, Kloos created a basic layout aimed\
    \ at Internet Explorer (then in version 6) and employed a technique dubbed MOSe\
    \ (“Mozilla/Opera/Safari enhancement”)⁴ to offer more advanced browsers a completely\
    \ different experience. Kloos used simple selectors for the basic layout and advanced\
    \ selectors for the enhanced styles. Here’s a snippet that demonstrates his approach:\n\
    \n```\n#intro {\n  margin: 0;\n  padding: 0;\n  width: 660px;\n  height: 80px;\n\
    \  background: transparent url(introkop.gif) no-repeat right top;\n}\n\n/* ...\
    \ */\n\nbody[id=css-zen-garden] #intro {\n  position: absolute;\n  top: 0;\n \
    \ left: 0;\n  float: none;\n  margin: 0;\n  width: 100%;\n  height: 350px;\n \
    \ background: none;\n}\n```\n\nFollowing CSS cascade order, the browser parses\
    \ the first rule set first to render the `#intro` layout. A little later, the\
    \ browser parses the “enhanced” rule set for `#intro`. If the browser understands\
    \ attribute selectors, it will render a completely different layout for `#intro`;\
    \ if it doesn’t, it will ignore the new rule set entirely.\n\n> 4. Dave Shea,\
    \ curator of the CSS Zen Garden, coined the term back in 2003, but when Internet\
    \ Explorer 7 came out, the term fell out of use because it didn’t have the same\
    \ selector-based limitations as IE6. You can read his original post at http://www.mezzoblue.com/archives/2003/06/25/mose/"
  - "[PAGE 56]\n\nSelector-based screening can be a useful technique, but it tends\
    \ to trip up many CSS authors who don’t realize selector failure in a compound\
    \ selector (two or more selector statements, separated by commas) is complete\
    \ and not discrete:\n\n```\np,\np:not([title]) {\n  color: red;\n  font-style:\
    \ bold;\n}\n```\n\nThis example has the same five locations for potential parsing\
    \ errors as the example that opened this chapter, but it also has a sixth one\
    \ in the second selector (p:not([title])). Browsers that understand only one of\
    \ these two selectors will ignore *the entire rule set* rather than just the advanced\
    \ selector (which, in case you were wondering, looks for paragraphs without `title`\
    \ attributes).\n\nThough it may seem unintuitive, the CSS 2.1 spec very clearly\
    \ states that this is how it should be: “The whole statement should be ignored\
    \ if there is an error anywhere in the selector, even though the rest of the selector\
    \ may look reasonable.”⁵ Knowing this, we can make better decisions about how\
    \ and when to combine selectors. As a general rule, it’s best to avoid combining\
    \ advanced selectors with simple ones (as in the example) unless you *want* to\
    \ hide the whole rule set from older browsers.\n\nWe’ll come back to this technique\
    \ momentarily, but first let’s take a quick detour through the world of specificity.\n\
    \nSpecificity is another core concept in CSS. It is a measure of how many elements\
    \ a given selector can select and is the only mechanism available for overruling\
    \ the cascade (more\n\n> 5. http://www.w3.org/TR/2009/CR-CSS2-20090908/syndata.html#rule-sets"
  - "[PAGE 57]\n\non that in a second). Some selectors are more specific than other\
    \ selectors. For example, an id selector (e.g., #intro) is 10 times more specific\
    \ than a class selector (e.g., .vcard), which is, in turn, 10 times more specific\
    \ than an element selector (e.g., p).⁶\n\nThe specificity of a given selector\
    \ is calculated by adding the specificity of all of its component parts. Rules\
    \ applied via very specific selectors will trump those applied with less specific\
    \ selectors, regardless of their order in the cascade. Looking back at Egor's\
    \ attribute selection sleight-of-hand, it's worth noting that even if the first\
    \ rule set in the example came second in the CSS file, the browser would still\
    \ prioritize it lower than the other rule set because its selector has a lower\
    \ specificity value than that of the second rule set.\n\nSpecificity of selectors\
    \ is something that takes time to master and can cause any number of headaches\
    \ because if you apply all of your styles with heavy-handed selectors (e.g., each\
    \ one contains an id selector), you end up having to create even more specific\
    \ selectors to overrule them (e.g., two id selectors). To avoid an ever-escalating\
    \ arms race of specificity, I recommend that you avoid making your selectors unnecessarily\
    \ specific.\n\nLet's revisit Kloos' handiwork and apply what we learned regarding\
    \ parsing errors in compound selectors; in doing so, we can reduce the specificity\
    \ of Egor's advanced rule sets and still maintain the spirit of his original work:\n\
    \n```\n#intro {\n    /* Old Layout */\n}\n\n/* ... */\n```\n\n> 6. If you don't\
    \ quite grasp how specificity is calculated, be sure to check out Andy Clarke's\
    \ \"CSS Specificity Wars\" http://www.stuffandnonsense.co.uk/archives/css_specificity_wars.html."
  - "[PAGE 58]\n\n```\n[foo], #intro {\n  /* Advanced Layout */\n}\n```\n\nIn this\
    \ revision, I changed the second rule set into a compound selector targeting an\
    \ element with an attribute named “foo” and another element with an id of “intro.”\
    \ The trick to this approach is that the initial attribute selector is a red herring.\
    \ The foo attribute is not only non-standard, but it is not used anywhere in the\
    \ CSS Zen Garden HTML, so the addition of that selector to the rule set does nothing\
    \ but hide the rule set from browsers that don’t understand attribute selectors.\
    \ And, most importantly, it leaves the #intro selector unadulterated, keeping\
    \ its specificity equal to that of the previous rule, allowing the cascade to\
    \ determine style application.\n\nWhile this may not always be the technique you\
    \ immediately reach for when implementing CSS, it’s a good one to remember when\
    \ you want to use rule set filtering without altering a selector’s specificity.\
    \ From a maintainability standpoint, this method is not ideal for more than a\
    \ single rule set here and there; to apply the concept of rule set filtering *en\
    \ masse*, there are better options available, and we’ll get to those shortly.\n\
    \n# CONCERNS, SEPARATED\n\nThe “cascade” is a critically important concept in\
    \ CSS; in fact it’s the *first word* in CSS. Literally. Again, it’s beyond the\
    \ scope of this little book to go through the concept of the cascade in any detail,\
    \ but there is one facet that can help you become a progressive enhancement expert\
    \ in no time: order.\n\nOrder matters. A lot.\n\nIn CSS, when all else is equal\
    \ (i.e., specificity), the proximity of a style declaration to its target element\
    \ determines the"
