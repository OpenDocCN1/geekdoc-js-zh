    <li><a href="#lodging">Lodging</a></li>

    <li><a href="#location">Location</a></li>

    </ol>

    </nav>

    </header>

    ```


    And, thanks to the fact that they ignore anything they don''t understand, the
    markup we''ve used will work in every browser, regardless of age. Sure, modern
    browsers may treat the newer elements differently, but even text-based browsers
    (such as Lynx) will be able to access the content. Devoid of style and stripped
    of JavaScript-based interactivity, the markup just works, providing us with the
    second level of support in the progressive enhancement continuum. (Remember: the
    content itself forms the crucial first level).


    # INVISIBLE AND ADVISORY


    As good as this markup is, we''ve neglected a major accessibility requirement
    by not providing any alternate text for our logo image (expressed using the `alt`
    attribute). “Alt text,” as it''s most often known,³ provides a text-based back-up
    for users who have images turned off; it is also the content that is read to users
    of screen reading software (such as the blind), which is why its inclusion is
    critical.


    Returning to the example, I''ve added a simple `alt` attribute:


    ```

    <h1><img src="i/logo.png" alt="Retreats 4 Geeks"/></h1>

    ```


    3. Some people get very grumpy when they hear the term “alt tag” because tags
    and attributes are very different things (attributes are applied to the opening
    tag of an element). If you ever find yourself starting to pronounce a “t” after
    saying “alt,” catch yourself and roll right into “text.” “Alt attribute” is a
    bit of a mouthful anyway.'
  merge: -1
  pgno: 30
- img_proc: true
  md: "When the image in question is a logo or conveys information needed to understand\
    \ the page or accomplish key tasks, `alt` text should always be supplied. For\
    \ all other images, it's perfectly legitimate to leave the `alt` text blank (`alt=\"\
    \"`). I would even go so far as to say it's *advisable* to use an empty `alt`\
    \ attribute in any instance where the image doesn't supply necessary information.\
    \ I say this for two reasons: 1) no one really wants to read vacuous copy like\
    \ “Smiling man throws a Frisbee to a leaping Golden Retriever” any more than someone\
    \ else wants to write it; and 2) screen readers will speak the contents of the\
    \ `alt` attribute aloud, but will skip any images with empty `alt` attributes.⁴\n\
    \nWhereas the `alt` attribute is used to provide alternative content, the `title`\
    \ attribute is used to provide advisory information about an element. In the case\
    \ of the navigation links in the above example, we can use `title` to provide\
    \ the user with information about where each link will take her:\n\n```\n<li><a\
    \ href=\"#location\" title=\"Get the 411 on Gatlinburg, Tennessee\">Location</a></li>\n\
    ```\n\nSimilarly, further down the page in the “location” section, `title` provides\
    \ context to the link that wraps the map:\n\n```\n<a href=\"http://maps.google.com/...\"\
    \ title=\"View Gatlinburg, Tennessee on Google Maps\">\n  <img src=\"http://maps.google.com/...\"\
    \ alt=\"A map showing the location of Gatlinburg, Tennessee\"/>\n</a>\n```\n\n\
    > 4. A screen reader will actually say “image” each time it encounters an `img`\
    \ lacking an `alt` attribute, so be kind to screen reader users and don’t forget\
    \ to include them."
