  md: "In this brief bit of code, we are checking for the existence of the jQuery\
    \ object, which is created when jQuery (the library) is present, by checking to\
    \ see that its type is not “undefined.” Dependency testing is a useful strategy\
    \ because it helps you avoid throwing errors in the browser and it can help speed\
    \ up the user’s browsing experience by not executing code unnecessarily.\n\nHere’s\
    \ another simple example that may prove more familiar to you:\n\n```\nif ( document.getElementById\
    \ ) {\n  // Code using document.getElementById() goes here\n}\n```\n\nIn this\
    \ case, we’re making sure the DOM traversal method document.getElementById exists\
    \ before we execute code that uses it. You probably recall us using this strategy\
    \ in the event delegation example when testing for event.preventDefault.\n\nReturning\
    \ to the jQuery test, we can take the test a step farther and check for a specific\
    \ version of jQuery. This form of testing can be useful if your script uses a\
    \ method not available in earlier versions of the library. In many cases, it’s\
    \ smarter to test for the existence of specific methods, but version checking\
    \ can be really helpful when a new release of the library substantially changes\
    \ the API for a pre-existing method:\n\n```\nif ( typeof( jQuery ) != 'undefined'\
    \ &&\n     parseFloat( jQuery.fn.jquery ) >= 1.4 ) {\n  /* Existing code that\
    \ requires jQuery 1.4 or higher\n     goes here */\n}\n```\n\nTesting for dependencies\
    \ is a great way to ensure you don’t execute code that could throw errors and,\
    \ the earlier you test, the more memory and processing time you can save a user\
    \ who won’t benefit from the script in the first place."
