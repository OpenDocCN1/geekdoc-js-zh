    \nUp until this point, we've made the obvious choices with regard to markup, employing\
    \ semantics we've had in HTML since the beginning. Just over a year ago, we would\
    \ have likely stopped here and considered the header complete, but HTML5 gives\
    \ us the opportunity to improve both the semantic value and the accessibility\
    \ of this content.\n\n> ² Yeah, I know, you could also use the `object` element\
    \ or make it text and use CSS to replace it with an image, but we're going for\
    \ simplicity here."
  - "[PAGE 29]\n\nTraditionally, we might have employed a page division (div) with\
    \ a semantic identifier (id) of “header” to contain these two elements. Divisions,\
    \ as you’ll recall, are used to group content, but they provide no context as\
    \ to the purpose or function of that group (which is why we would identify it\
    \ as the “header”). HTML5, however, introduces an element that provides the explicit\
    \ semantic meaning for that division: header.\n\nSemantically, a header is used\
    \ to demarcate any content that is summarily important to a page or section of\
    \ a page. It can be used to encapsulate headings or heading groups (contained\
    \ in the new hgroup element), relevant navigational aids, and introductory content.\
    \ As such, it makes a perfect container for the title of our page and the list\
    \ of anchors to each article within the page.\n\nHTML5 also grants us another\
    \ more appropriate option when it comes to the navigation. Whereas we would have\
    \ traditionally identified the ordered list as “nav” or “main-nav,” HTML5’s nav\
    \ element more directly expresses the semantics we’re trying to imbue the ol with\
    \ by providing that semantic id. The nav element can be used to wrap any group\
    \ of navigational links and functions as the semantic equivalent of the ARIA landmark\
    \ role of “navigation” (which we’ll discuss more in Chapter 5).\n\nWith these\
    \ additions, the markup for this section is now:\n\n```\n<header>\n    <h1><img\
    \ src=\"i/logo.png\"/></h1>\n    <nav>\n        <ol>\n            <li><a href=\"\
    #details\">Details</a></li>\n            <li><a href=\"#schedule\">Schedule</a></li>\n\
    \            <li><a href=\"#instructors\">Instructors</a></li>\n```"
- md: "## INVISIBLE AND ADVISORY\n\nAnd, thanks to the fact that they ignore anything\
    \ they don't understand, the markup we've used will work in every browser, regardless\
    \ of age. Sure, modern browsers may treat the newer elements differently, but\
    \ even text-based browsers (such as Lynx) will be able to access the content.\
    \ Devoid of style and stripped of JavaScript-based interactivity, the markup just\
    \ works, providing us with the second level of support in the progressive enhancement\
    \ continuum. (Remember: the content itself forms the crucial first level).\n\n\
    As good as this markup is, we've neglected a major accessibility requirement by\
    \ not providing any alternate text for our logo image (expressed using the `alt`\
    \ attribute). “Alt text,” as it's most often known,³ provides a text-based back-up\
    \ for users who have images turned off; it is also the content that is read to\
    \ users of screen reading software (such as the blind), which is why its inclusion\
    \ is critical.\n\nReturning to the example, I've added a simple `alt` attribute:\n\
    \n```\n<h1><img src=\"i/logo.png\" alt=\"Retreats 4 Geeks\"/></h1>\n```\n\n3.\
    \ Some people get very grumpy when they hear the term “alt tag” because tags and\
    \ attributes are very different things (attributes are applied to the opening\
    \ tag of an element). If you ever find yourself starting to pronounce a “t” after\
    \ saying “alt,” catch yourself and roll right into “text.” “Alt attribute” is\
    \ a bit of a mouthful anyway.\n\nWhen the image in question is a logo or conveys\
    \ information needed to understand the page or accomplish key tasks, `alt` text\
    \ should always be supplied. For all other images, it's perfectly legitimate to\
    \ leave the `alt` text blank (`alt=\"\"`). I would even go so far as to say it's\
    \ *advisable* to use an empty `alt` attribute in any instance where the image\
    \ doesn't supply necessary information. I say this for two reasons: 1) no one\
    \ really wants to read vacuous copy like “Smiling man throws a Frisbee to a leaping\
    \ Golden Retriever” any more than someone else wants to write it; and 2) screen\
    \ readers will speak the contents of the `alt` attribute aloud, but will skip\
    \ any images with empty `alt` attributes.⁴\n\nWhereas the `alt` attribute is used\
    \ to provide alternative content, the `title` attribute is used to provide advisory\
    \ information about an element. In the case of the navigation links in the above\
    \ example, we can use `title` to provide the user with information about where\
    \ each link will take her:\n\n```\n<li><a href=\"#location\" title=\"Get the 411\
    \ on Gatlinburg, Tennessee\">Location</a></li>\n```\n\nSimilarly, further down\
    \ the page in the “location” section, `title` provides context to the link that\
    \ wraps the map:\n\n```\n<a href=\"http://maps.google.com/...\" title=\"View Gatlinburg,\
    \ Tennessee on Google Maps\">\n  <img src=\"http://maps.google.com/...\" alt=\"\
    A map showing the location of Gatlinburg, Tennessee\"/>\n</a>\n```\n\n> 4. A screen\
    \ reader will actually say “image” each time it encounters an `img` lacking an\
    \ `alt` attribute, so be kind to screen reader users and don’t forget to include\
    \ them.\n\n![Figure 2.2: A screen shot of the location portion of the page with\
    \ a cursor over the map.](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_32_0.png)\n\n##\
    \ AD-HOC SEMANTICS\n\nHTML is filled with attributes that help enrich the elements\
    \ they adorn. It prescribes a number of “fixed use” ones, like `alt` and `title`,\
    \ but it also offers a handful of attributes that can be used to build upon the\
    \ language’s native semantics in a less formal way. I’m talking, of course, about\
    \ `id` and `class`.\n\nWhen Dave Raggett drafted a specification for HTML 3.0,⁵\
    \ it contained two new concepts: classification and identification, expressed\
    \ via the `class` and `id` attributes respectively.⁶\n\n> 5. HTML 3.0 was an ambitious\
    \ spec, introducing numerous tags and attributes. Many of those new constructs\
    \ were dropped by the time it reached recommendation status as HTML 3.2, but the\
    \ `class` and `id` attributes survived. Funny enough, some of the very same constructs\
    \ proposed in HTML 3.0 have found their way back into the HTML lexicon, either\
    \ formally as part of HTML5 or quasi-formally as microformats.\n\n> 6. It’s worth\
    \ noting that `class` and `id` each make a (very) brief appearance in the HTML\
    \ 2 spec ([http://www.ietf.org/rfc/rfc1866.txt](http://www.ietf.org/rfc/rfc1866.txt)),\
    \ but were not formally-defined attributes. They were simply used to demonstrate\
    \ the fault tolerant way in which browsers should treat unknown attributes.\n\n\
    These two attributes were not formally introduced into the HTML lexicon until\
    \ HTML 4.0, but were implemented in browsers around the same time as Cascading\
    \ Style Sheet (CSS) support was added. And CSS, of course, brought us two simple\
    \ selectors that targeted these attributes explicitly, causing some unfortunate\
    \ confusion over the intended use of `class` and `id` from the get-go.\n\nFor\
    \ years, nearly every web developer working with CSS thought the correlation between\
    \ the attributes and the selectors was intentional, believing that `id` and `class`\
    \ were intended purely for use with style sheets. You can hardly blame us though,\
    \ CSS Level 1 did not provide many mechanisms for selecting elements, so it made\
    \ sense that the `class` selector (e.g., `.ul.menu`) and the `id` selector (e.g.,\
    \ `div#content`) would have been introduced (along with their corresponding attributes)\
    \ for the purposes of both the general and specific application of style, respectively.⁷\n\
    \nThankfully, we now understand how the `class` and `id` attributes were meant\
    \ to operate. The `class` attribute was introduced specifically to address the\
    \ limited set of elements within the HTML lexicon:\n\n> As time goes by, people’s\
    \ expectations change, and more will be demanded of HTML. One manifestation of\
    \ this is the pressure to add yet more tags. HTML 3.0 introduces a means for subclassing\
    \ elements in an open-ended way. This can be used to distinguish the role of a\
    \ paragraph element as being a couplet in a stansa [sic], or a mathematical term\
    \ as being a tensor. This ability to make fresh distinctions can be exploited\
    \ to impart distinct rendering styles or to support richer search mechanisms,\
    \ without further complicating the HTML document format itself.⁸\n\n7. And the\
    \ HTML 3 draft did allow for this use, among others. The draft is available at\
    \ http://www.w3.org/MarkUp/html3/html3.txt.\n\n8. From the \"Scalability\" section\
    \ of the HTML 3 draft (see footnote 7).\n\nThe intent was that this attribute\
    \ would contain a list of subclasses for the particular element they were applied\
    \ to, with the classes listed from most general to most specific:9\n\n```\n<a\
    \ href=\"...\" title=\"...\">\n    <img class=\"illustration map\" src=\"...\"\
    \ alt=\"...\"/>\n</a>\n```\n\nThe spec introduced the `id` attribute for the purposes\
    \ of identifying a specific element on the page (this is why each `id` on a page\
    \ needs to be unique). In practice, this identifier would be used as a reference\
    \ point for style rules (`#details { ... }`), scripts (`document.getElementById('details')`),\
    \ and anchors (`<a href=\"#details\">`). You may recall that we actually used\
    \ that last mechanism in the navigation introduced earlier in the chapter.\n\n\
    As all of the information for the Retreats 4 Geeks event is included on a single\
    \ page, I've grouped each chunk of content into separate `article` elements10,\
    \ each with a unique `id`. The `article` element was introduced as part of HTML5\
    \ and demarcates content that forms an independent part of the document, such\
    \ as a newspaper article, blog post, or, in our case, a distinct topic. Each of\
    \ the articles on the page is then targeted, using its `id` as an anchor reference,\
    \ by the navigation links. Clicking one of these links will jump a user directly\
    \ to the appropriate content.\n\n9. You'll see this throughout the HTML 3 draft,\
    \ whenever `class` is defined for an element.\n\n10. Not to be confusing, but\
    \ HTML5 also introduces the `section` element (also seen in the above code example).\
    \ In HTML5 parlance, the `section` element denotes *a section of content* (go\
    \ figure, right?). In terms of overall organization, I could have declared the\
    \ whole page an `article`, making each distinct chunk a `section` of that `article`,\
    \ but I decided that individual `article` elements made more sense because each\
    \ chunk of content is independent enough that it could easily exist on its own\
    \ page. The semantic difference between the two is modest at best and the choice\
    \ of one over the other is really at the discretion of the author."
  mdcn: "\n## 不可见的与建议性的\n\n而且，由于它们会忽略任何无法理解的内容，我们所使用的标记将在所有浏览器中正常运行，无论其版本新旧。当然，现代浏览器可能会以不同方式处理较新的元素，但即使是基于文本的浏览器（如\
    \ Lynx）也能访问内容。剥离了样式和基于 JavaScript 的交互性后，标记依然能够工作，这为我们提供了渐进增强连续体中的第二级支持。（请记住：内容本身构成了至关重要的第一级）。\n\
    \n尽管这种标记已经很好了，但我们忽略了一个主要的无障碍性需求：没有为我们的徽标图像（通过 `alt` 属性表示）提供任何替代文本。通常被称为“替代文本”的内容³，为关闭了图像显示的用户提供了基于文本的备份；它也是屏幕阅读软件（如面向视障人士的软件）向用户朗读的内容，因此包含它至关重要。\n\
    \n回到之前的例子，我已经添加了一个简单的 `alt` 属性：\n\n```\n<h1><img src=\"i/logo.png\" alt=\"Retreats\
    \ 4 Geeks\"/></h1>\n```\n\n3. 有些人听到“替代标签”这个术语会非常生气，因为标签和属性是截然不同的东西（属性应用于元素的开始标签）。如果你发现自己刚说完“alt”就要发出“t”的音，赶紧打住，直接接上“text”。“替代属性”这个说法本身就有点拗口。\n\
    \n当图像是徽标或传达了理解页面或完成关键任务所需的信息时，`alt` 文本应始终提供。对于所有其他图像，将 `alt` 文本留空（`alt=\"\"`）是完全合理的。我甚至想说，在任何图像不提供必要信息的情况下使用空的\
    \ `alt` 属性是*可取的*。我这么说有两个原因：1) 没有人真的想读诸如“微笑的男人向跳跃的金毛猎犬扔飞盘”这样空洞的文字，就像没多少人愿意写它一样；2)\
    \ 屏幕阅读器会朗读 `alt` 属性的内容，但会跳过任何具有空 `alt` 属性的图像。⁴\n\n`alt` 属性用于提供替代内容，而 `title` 属性用于提供关于元素的建议性信息。在上面示例的导航链接中，我们可以使用\
    \ `title` 来向用户告知每个链接将带她前往何处：\n\n```\n<li><a href=\"#location\" title=\"Get the\
    \ 411 on Gatlinburg, Tennessee\">Location</a></li>\n```\n\n同样，在页面下方的“位置”部分，`title`\
    \ 为包裹地图的链接提供了上下文信息：\n\n```\n<a href=\"http://maps.google.com/...\" title=\"View\
    \ Gatlinburg, Tennessee on Google Maps\">\n  <img src=\"http://maps.google.com/...\"\
    \ alt=\"A map showing the location of Gatlinburg, Tennessee\"/>\n</a>\n```\n\n\
    > 4. 屏幕阅读器实际上会在每次遇到缺少 `alt` 属性的 `img` 时说出“image”，所以请善待屏幕阅读器用户，别忘了包含它们。\n\n![图\
    \ 2.2：页面位置部分的屏幕截图，光标位于地图上方。](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_32_0.png)\n\n\
    ## 特设语义\n\nHTML 中充满了可用于丰富其修饰元素的属性。它规定了一些“固定用途”的属性，如 `alt` 和 `title`，但也提供了一些属性，可以用一种不太正式的方式来扩展语言的原始语义。我当然指的是\
    \ `id` 和 `class`。\n\n当戴夫·拉吉特（Dave Raggett）起草 HTML 3.0 规范⁵ 时，其中包含两个新概念：分类和标识，分别通过\
    \ `class` 和 `id` 属性来表示。⁶\n\n> 5. HTML 3.0 是一个雄心勃勃的规范，引入了许多标签和属性。其中许多新构造在成为 HTML\
    \ 3.2 推荐标准的过程中被舍弃，但 `class` 和 `id` 属性得以保留。有趣的是，HTML 3.0 中提出的一些完全相同的构造又重新回到了 HTML\
    \ 词汇表中，要么作为 HTML5 的一部分正式回归，要么以微格式等准正式形式回归。\n\n> 6. 值得注意的是，`class` 和 `id` 在 HTML\
    \ 2 规范（[http://www.ietf.org/rfc/rfc1866.txt](http://www.ietf.org/rfc/rfc1866.txt)）中（非常）简短地出现过，但并非正式定义的属性。它们仅用于演示浏览器应如何以容错方式处理未知属性。\n\
    \n这两个属性直到 HTML 4.0 才正式引入 HTML 词汇表，但它们的实现时间大约与级联样式表（CSS）支持的添加同步。当然，CSS 为我们带来了两个明确针对这些属性的选择器，这从一开始就对\
    \ `class` 和 `id` 的预期用法造成了一些不幸的混淆。\n\n多年来，几乎所有使用 CSS 的网页开发者都认为属性与选择器之间的这种关联是有意为之的，相信\
    \ `id` 和 `class` 纯粹是为了与样式表配合使用。不过你很难责怪我们，CSS 第一级规范并未提供太多选择元素的机制，因此 `class` 选择器（例如\
    \ `.ul.menu`）和 `id` 选择器（例如 `div#content`）（连同它们对应的属性）被引入，分别用于样式的通用和特定应用，这似乎是合理的。⁷\n\
    \n值得庆幸的是，我们现在明白了 `class` 和 `id` 属性的设计意图。`class` 属性的引入是专门为了应对 HTML 词汇表中有限的元素集合：\n\
    \n> 随着时间的推移，人们的期望会发生变化，对 HTML 的要求也会更多。其中一个表现就是要求添加更多标签的压力。HTML 3.0 引入了一种以开放式方式对元素进行子类化的方法。这可以用来区分段落元素在诗节\
    \ [原文如此] 中作为对句的角色，或者数学项作为张量的角色。这种做出新区分的能力可以被用来赋予独特的渲染样式或支持更丰富的搜索机制，而无需进一步使 HTML\
    \ 文档格式本身复杂化。⁸\n\n7. 而 HTML 3 草案确实允许这种用法以及其他用法。草案可在 http://www.w3.org/MarkUp/html3/html3.txt\
    \ 获取。\n\n8. 摘自 HTML 3 草案的“可扩展性”部分（见脚注 7）。\n\n其意图是该属性包含应用于特定元素的子类列表，列表按从最通用到最具体的顺序排列：9\n\
    \n```\n<a href=\"...\" title=\"...\">\n    <img class=\"illustration map\" src=\"\
    ...\" alt=\"...\"/>\n</a>\n```\n\n规范引入 `id` 属性是为了标识页面上的特定元素（这就是为什么页面上的每个 `id`\
    \ 都需要唯一的原因）。实际上，这个标识符将用作样式规则（`#details { ... }`）、脚本（`document.getElementById('details')`）和锚点（`<a\
    \ href=\"#details\">`）的引用点。你可能还记得，我们在本章前面介绍的导航中实际使用了最后一种机制。\n\n由于 Retreats 4 Geeks\
    \ 活动的所有信息都包含在单个页面上，我已将每个内容块分组到单独的 `article` 元素中¹⁰，每个元素都有一个唯一的 `id`。`article` 元素作为\
    \ HTML5 的一部分被引入，它划定构成文档独立部分的内容，例如报纸文章、博客文章，或在我们的情况下，一个独特的主题。页面上的每个文章然后使用其 `id`\
    \ 作为锚点引用，被导航链接所指向。点击这些链接之一将直接将用户跳转到相应的内容。\n\n9. 你将在整个 HTML 3 草案中看到这一点，只要为某个元素定义了\
    \ `class`。\n\n10. 为免混淆，HTML5 也引入了 `section` 元素（在上述代码示例中也可见）。用 HTML5 的术语来说，`section`\
    \ 元素表示*一个内容部分*（懂了吧？）。就整体组织而言，我可以将整个页面声明为一个 `article`，将每个不同的块作为该 `article` 的一个\
    \ `section`，但我认为单个 `article` 元素更有意义，因为每个内容块足够独立，可以轻松存在于自己的页面上。两者之间的语义差异充其量是微小的，选择哪一个实际上由作者自行决定。\n"
