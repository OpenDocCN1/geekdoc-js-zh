  - "[PAGE 41]\n\nYou probably noticed that the `section` has an `h1` as its title.\
    \ Don’t worry: in HTML5, each `section` creates a new context within which it’s\
    \ okay to restart the headings at `h1`. It takes a little getting used to at first,\
    \ I know, but it makes sense and addresses the limited number of heading levels\
    \ quite well.¹\n\nIf you’ve got keen eyes, you’ve likely already identified exactly\
    \ where each of the hCard `classes` should be applied, but I’ll step through each\
    \ one, just to be sure, starting with the easiest one: “vcard.” This classification\
    \ needs to be applied to the containing element, in this case, the `section`:\n\
    \n```\n<section id=\"aaron-gustafson\" class=\"vcard\">\n```\n\nThe next obvious\
    \ one is “fn,” which should wrap my name. As my name is already wrapped in an\
    \ `h1`, we can apply a `class` of “fn” to that element to indicate the text contained\
    \ within the element is my name.\n\n```\n<h1 class=\"fn\">Aaron Gustafson</h1>\n\
    ```\n\nNext, we can add a `class` of “url” to the “Easy! Designs” link, denoting\
    \ that it points to a website I control:\n\n```\n... <a class=\"url\" rel=\"external\"\
    \ href=\"http://easy-designs.net\">Easy! Designs</a>, ...\n```\n\nContinuing down\
