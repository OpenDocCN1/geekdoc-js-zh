  md: '# Redundancy and reason


    These two specs developed independently over roughly the same time period and
    each sought to address the pressing problems they saw with the current state of
    HTML. (Hence, the inevitable overlap.) The ARIA spec is currently a bit closer
    to becoming a recommendation than HTML5 is and, as a consequence, many of its
    unique features are being incorporated into HTML5 as that spec continues to develop.
    When HTML5 finally reaches the Candidate Recommendation stage, it’s pretty safe
    to assume that the two specs will have been successfully merged and that redundancies
    will have been ironed out.


    For the time being, however, there is a considerable amount of overlap between
    ARIA and HTML5, especially in the case of structural and (to a lesser extent)
    landmark roles. Table 5.2 provides a few examples of our traditional ad-hoc semantics,
    their equivalent ARIA role, and the HTML5 element (if any) that serves the same
    purpose.


    | AD-HOC SEMANTICS | ARIA ROLE | HTML5 ELEMENT | SEMANTIC MEANING |

    | :--- | :--- | :--- | :--- |

    | #header, #top | banner | header (kind of) | A region of the page that is site-focused,
    rather than page-focused |

    | #main, #content | main | none | The focal content in a document |


    Table 5.2: Traditional ad-hoc semantics, their equivalent ARIA role, and the HTML5
    element (if any) that serves the same purpose.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '| AD-HOC SEMANTICS | ARIA ROLE | HTML5 ELEMENT | SEMANTIC MEANING |

    | :--- | :--- | :--- | :--- |

    | `#extra`, `.sidebar` | complementary, note | `aside` | A supporting section
    of the document that is related to the main content ("complementary" content remains
    meaningful when separated from it) |

    | `#footer`, `#bottom` | contentinfo | `footer` | A region that contains information
    about the document |

    | `#nav` | navigation | `nav` | A region of the page containing navigational links
    |

    | `.hentry` | article | `article` | A region of the page that forms an independent
    part of the document |


    Table 5.2: *Traditional ad-hoc semantics, their equivalent ARIA role, and the
    HTML5 element (if any) that serves the same purpose.*


    At present, there is a bit of back-and-forth between the HTML5 community and accessibility
    advocates over what to do about the redundancy. From a practical standpoint, even
    if you are using HTML5''s ARIA-equivalent semantics it''s generally considered
    a good idea to double up with the ARIA landmark roles because not all assistive
    technologies are HTML5-aware yet. Structural roles, however, can be assigned at
    your own discretion as they are purely organizational and are not currently exposed
    to users via assistive technology.


    A quick scan of the Retreats 4 Geeks source code will reveal this redundancy on
    the `nav` and `footer` elements. As assistive technologies are updated to be HTML5-compatible,'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'however, we will be able to jettison the unnecessary role attributes and streamline
    our markup a bit more.


    In addition to overlap with HTML5, there are quite a few roles that duplicate
    the semantics long available in HTML. Consider the following ARIA landmark and
    structural roles: columnheader, definition, form, heading, img, list, listitem,
    row, rowheader, and separator. Some of those have one-to-one equivalencies in
    HTML (e.g., “form”) and the others are a more generalized form of what we have
    in HTML (e.g., “list”).


    While it’s understandable that the parallel development of ARIA and HTML5 would
    create some overlap, you may be scratching your head over why ARIA would seem
    to recreate semantics that have existed in HTML for over a decade. The simple
    answer is that, for one reason or another, some companies (<cough>Google</cough>)
    like to use non-semantic markup (e.g., divs) as the basis for an interface and
    use JavaScript to make it function like a native HTML control. For that reason
    alone, ARIA provides overlapping roles. You won’t see me running out to give a
    div a role of “form” (I’ll just use a form, thank you), but to each his own I
    guess.


    As we discussed earlier, the Retreats 4 Geeks site implements several of the HTML5
    elements that are semantically-equivalent to ARIA’s landmark and structural roles—nav,
    footer, article—but we’ve opted to include the equivalent ARIA roles in the interest
    of serving the greatest number of users. (After all, that’s what progressive enhancement
    is all about, right?) We’re not done though. As we saw in Table 5.2, the semantic
    equivalence of an ARIA role of “banner” to HTML5’s header is somewhat debatable
    so, to be absolutely clear in the service of our users, I’ve added that role as
    well:


    ```

    <header role="banner">

    ```


    The only other role we haven’t touched on (since it’s currently not addressed
    in HTML5) is “main,” which'
  merge: -1
