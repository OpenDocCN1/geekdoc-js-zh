    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_80_0.png)


    图 4.1：Lifehacker。空白页面。


    没有什么比 JavaScript 更能让一个网页“活”起来了。借助它，你可以创建丰富的交互效果，构建动态界面等等。Web 开发者们很早就意识到了这一点。他们抓住机会，利用这个强大的工具来打造更具吸引力的网页、验证表单数据等等。对于今天的
    JavaScript 开发者来说，制作出令人惊叹的作品并遵循渐进增强原则很容易，但情况并非一直如此。


    回到 90 年代中后期，编写 JavaScript 就像在实践一种黑暗艺术。我们在 HTML 中的每一丁点“意大利面条式代码”，到了 JavaScript
    里通常会糟糕十倍，因为当时两大主流浏览器——Netscape 和 Internet Explorer——各自实现了该语言²，而它们之间的差异足以让真正有趣的东西变得极难编写。例如，在文档（技术上称为文档对象模型或
    DOM）中查找同一个元素（例如 `#location`）需要两种截然不同的语法：


    ```

    document.layers[''location''];   // Netscape

    document.all[''location''];      // IE

    ```


    2. JavaScript 语言本身由 Brendan Eich 设计，于 1995 年底作为 Netscape 2 的一项功能首次亮相。微软开发了自己的
    JavaScript 方言（出于商标原因命名为“JScript”），并于 1996 年中将其作为 Internet Explorer 3 的一部分发布（巧合的是，这也是第一款提供
    CSS 支持的浏览器）。


    ## 突破阻碍


    这种不幸的现实要求我们基本上为每个脚本编写两次，或者至少在其中填满“分支”（根据浏览器为脚本选择的不同路径），而这些分支最终往往会反过来“坑”了我们。


    正如我们在第 2 章所讨论的，90 年代后期是网络上动荡不安的时期：浏览器大战。随着每一次新版本的发布，Netscape 和微软都为开发者提供了新的功能，希望能占据更大的浏览器市场份额。这种相互攀比给开发者带来了许多问题；由于
    JavaScript 的两种竞争性实现，我们花了太多时间试图弥合差异，以至于没有关注这门语言本身的功能，也没有学习将其与 HTML 和 CSS 集成的最佳方式。


    当欧洲计算机制造商协会（ECMA）国际标准化了 JavaScript³，W3C 发布了其 DOM 规范时，我们脚下流动的沙子终于被坚实的基础所取代，我们得以开始探索更好的方法：


    ```

    document.getElementById(''location''); // 统一的 DOM

    ```


    尘埃落定后，我们学到的第一课是，JavaScript 并不是解决网络交互问题的万能药。事实上，它甚至不那么可靠。


    首先，即使在 W3C 标准化了 DOM，浏览器也普遍同意支持 Web 标准之后，大家也并非都在遵循同一套规则；实现之间的差异仍然很大，以至于我们根本无法假设某些方法（例如作为
    DOM 遍历基石的 `document.getElementById()`，它通过 id 访问元素，或者 `document.getElementsByTagName()`，顾名思义，通过名称查找元素）的可用性。其次，即使浏览器完全支持
    JavaScript，用户（或其 IT 管理员）仍然对是否允许 JavaScript 运行拥有最终决定权。⁴


    随着时间的推移，我们意识到 JavaScript 的支持并非理所当然，于是我们开始重构代码，使其更简洁、更易于维护、更灵活，以应对 JavaScript 的可用（或缺失）情况。让我们审视一下那个时期的思考，以更好地理解如何渐进式地使用
    JavaScript。


    > 警告：从这里开始，我们将深入到实际的 JavaScript 代码。如果你之前没有太多 JavaScript 的开发经验，请不要担心，我会尽我所能解释每一步发生的事情，这样你就能跟上，即使代码对你来说如同天书。


    ## 100% 依赖


    在 JavaScript 的早期，将 onclick 事件处理程序（当有人点击页面上的某个元素时执行的脚本）应用于原本无用的链接⁵，这种情况并不少见。


    ```

    <a href="#" onclick="newWin( ''http://easy-designs.net/'' );">Easy! Designs</a>

    ```


    当 JavaScript 启用时，此链接会调用一个名为 `newWin` 的自定义函数，并传递一个值 "http://easy-designs.net/"。该函数继而会在新窗口中打开该
    URL。然而，如果没有 JavaScript，该链接将不起任何作用，因为正如我们在第 2 章关于标识符的讨论中所回忆的，`href` 指向一个空的 `id`。一个没有
    JavaScript 就无法工作的链接有什么意义？


    这引出了我关于 JavaScript 渐进增强的第一个准则：


    - 1. 确保所有内容都可以访问，并且所有必要的任务都可以在未启用 JavaScript 的情况下完成。


    这个链接显然违反了这一点（我之前提到的 Gawker 平台也是如此），但在 90 年代末，网络上使用的绝大多数 JavaScript 也是如此。当时，网络上充斥着需要
    JavaScript 的网站，以及 JavaScript 妨碍用户的地方；换句话说，JavaScript 是侵入式的。意识到这个问题，Web 开发者开始推动“非侵入式”
    JavaScript。


    > 注意：我并非提倡使用弹出窗口或使用 JavaScript 打开新窗口，因为它们会引入许多无障碍性和易用性问题。然而，我选择这个例子是因为它以一种相对容易理解的方式说明了我们
    JavaScript 代码的演变过程。请放心，通过跟随这个例子学到的经验，普遍适用于你可能进行的任何其他 JavaScript 开发。


    4. 然而，对于 IT 管理员来说，选择禁用 JavaScript 根本上是出于安全考虑，但在很长一段时间里，有无障碍访问需求的用户也被鼓励禁用 JavaScript。一些用户也会禁用
    JavaScript 以移除烦人的广告和弹出窗口。在浏览器首选项中最容易禁用 JavaScript，但也可以通过防火墙阻止，或由 IT 管理员在应用层面禁用。


    5. 这种老派技术的变体包括 `javascript` 伪协议（例如 `<a href="javascript:myFunction();">`），以及我个人最喜欢的，将
    `javascript` 伪协议与内联事件处理程序结合使用（例如 `<a href="javascript:void(null)" onclick="myFunction();">`）。


    ## 走向非侵入


    非侵入式 JavaScript 是指以不依赖 JavaScript 的方式进行编程的统称。在这种范式下，用户可以访问所有页面内容，并可以使用网络的基本构建块（HTML
    和 HTTP 协议）在页面上完成每个必要的任务。然后，通过叠加 JavaScript 来增强页面。


    听起来很熟悉？非侵入式 JavaScript 的理念与渐进增强哲学完美契合，因为它迫使 JavaScript 扮演功能增强的角色，而不是绝对要求。


    考虑到非侵入式 JavaScript，我们重构了我们的链接，使其无论 JavaScript 是否可用都能工作：


    ```

    <a href="http://easy-designs.net/" onclick="newWin( this.href ); return false;">Easy!
    Designs</a>

    ```


    在这个修订版中，链接实际上指向一个 URL，因此它在没有 JavaScript 的情况下也能工作。然而，当 JavaScript 可用时，点击链接将调用 `newWin`，该函数接收链接
    `href` 属性的值（DOM 值 `this.href`）。此版本与上一个版本链接的另一个关键区别在于，`onclick` 事件处理程序也设置为“return
    false”，这会取消点击事件的默认操作（在这种情况下，是跟随链接跳转到新页面）。


    这是解决 JavaScript 可能缺失问题的一大步，但我们很快意识到，管理此类场景还有更好的方法。

    '
