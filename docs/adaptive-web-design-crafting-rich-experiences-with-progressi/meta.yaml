    Figure 5.2: Using ARIA properties, we can relate pieces of an interface to one
    another.


    ARIA’s states and properties go a long way toward helping keep the user informed,
    but few concepts in ARIA are as simple and immediately useful as Live Regions.


    # IT’S ALIVE!


    With the advent of Ajax and the resurgence of JavaScript in general, few things
    proved to be more of a user experience nightmare than live-updating regions of
    the page. The usability issues were numerous, but the two big ones were: 1) assistive
    devices weren’t aware of changes to the page and had no way of directing a user’s
    attention to them; and'
  merge: -1
  pgno: 119
- img_proc: true
  md: '2) users taking advantage of page zoom or browsing on a mobile device are oblivious
    to content updates occurring off-screen. Thankfully, the ARIA spec includes an
    attribute that directly addresses this egregious problem: aria-live.


    What’s most exciting about aria-live is its simplicity. By applying this single
    attribute to an element, you can control how and when content updates within it
    are presented to your users. The aria-live attribute accepts one of three values:


    +   1. “off” for when updates are frequent and of little importance to the user,
    as in the case of a live stream from your Twitter account (doh!);

    2. “polite” for when updates are only important enough to be announced when the
    user isn’t doing anything, as in the case of updated news headlines; or

    3. “assertive” for when updates are important enough to announce immediately,
    as in the case of form validation messages.


    In the Retreats 4 Geeks website, it makes sense to apply aria-live to the contact
    form:


    ```

    <article id="contact" aria-live="assertive">

    ```


    With that in place, users will be kept abreast of any errors encountered when
    filling in their details and will also be informed when the submission is successful.


    # SUPPORT AND STUMBLING BLOCKS


    Since its introduction, ARIA has gotten a lot of support from the web community.
    As of this writing, some level of ARIA support is found in every major browser
    and has been implemented in popular screen reading tools like JAWS, Windows Eyes,
    NVDA, and Orca. Influential companies like IBM, Sun Microsystems, Adobe, Yahoo!,
    and Google are all working diligently to increase ARIA’s effectiveness and reach.
    Even the Javascript community has embraced ARIA,'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'with both Dojo Dijits⁵ and jQuery UI⁶ integrating ARIA’s roles, states, and
    properties into their components. Of course, the spec is still developing, so
    no implementation is complete, but progress is being made.


    I’d be remiss if I did not mention the one major issue keeping ARIA from fitting
    neatly into the progressive enhancement stack, at least when it comes to widget-related
    roles and states: we have no way of testing for ARIA support in the browser or
    assistive technology and, therefore, can’t make informed decisions about how to
    best implement a given widget. Derek Featherstone surfaced this issue in his excellent
    article for *A List Apart* Entitled “ARIA and Progressive Enhancement.”⁷ I highly
    recommend reading it to better understand the issue. At the time of this writing,
    a viable solution has not been proposed, but my fingers are crossed.


    # KEYSTROKE ISN’T A DIRTY WORD


    The last topic I want to touch on before we wrap this, the final chapter of my
    little book, is keyboard access and controls. With the pervasiveness of the mouse
    and an increased reliance on touch-based devices like the iPad, it is relatively
    easy to forget about the humble keyboard, but that would be a critical mistake.
    The keyboard is an incredibly useful tool and is the standard interface for all
    non-visual users and most power-users.


    When it comes to the keyboard, we’ve learned a great deal in the last few years.
