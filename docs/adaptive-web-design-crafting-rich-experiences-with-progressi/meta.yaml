    In addition to overlap with HTML5, there are quite a few roles that duplicate
    the semantics long available in HTML. Consider the following ARIA landmark and
    structural roles: columnheader, definition, form, heading, img, list, listitem,
    row, rowheader, and separator. Some of those have one-to-one equivalencies in
    HTML (e.g., “form”) and the others are a more generalized form of what we have
    in HTML (e.g., “list”).


    While it’s understandable that the parallel development of ARIA and HTML5 would
    create some overlap, you may be scratching your head over why ARIA would seem
    to recreate semantics that have existed in HTML for over a decade. The simple
    answer is that, for one reason or another, some companies (<cough>Google</cough>)
    like to use non-semantic markup (e.g., divs) as the basis for an interface and
    use JavaScript to make it function like a native HTML control. For that reason
    alone, ARIA provides overlapping roles. You won’t see me running out to give a
    div a role of “form” (I’ll just use a form, thank you), but to each his own I
    guess.


    As we discussed earlier, the Retreats 4 Geeks site implements several of the HTML5
