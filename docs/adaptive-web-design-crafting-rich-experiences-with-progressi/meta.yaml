    By contrast, a website built following the philosophy of progressive enhancement
    will be usable by anyone on any device, using any browser. A user on a text-based
    browser like Lynx won’t necessarily have the same experience as a user surfing
    with the latest version of Safari, but the key is that she will have a positive
    experience rather than no experience at all. The content of the website will be
    available to her, albeit with fewer bells and whistles, something that isn’t guaranteed
    with graceful degradation.


    While philosophically different, from a practical standpoint progressive enhancement
    and graceful degradation can look quite similar, which can be confusing. To bring
    the differences into focus, I like to boil the relationship between the two philosophies
    down to something akin to standardized testing logic: all experiences that are
    created using progressive enhancement will degrade gracefully in older browsers,
    but not all experiences built following graceful degradation are progressively
    enhanced.


    ## Limits? There are no limits.


    During the heyday of graceful degradation, websites became very much like the
    amusement park I mentioned earlier: “you must be this high to ride.” The web was
    (and, sadly, still is) littered with sites “best viewed in Netscape Navigator
    4” and the like. With the rise of progressive enhancement and web standards in
    general, we moved away from that practice, but as more sites began to embrace
    the JavaScript technique known as Ajax, the phenomenon resurfaced and many sites
    began requiring JavaScript or even specific browsers (and browser versions) to
    view their sites. It was the web’s own B-movie sequel: The Return of the Browser-Breaking,
    User-Unfriendly Methods We Thought We''d Left Behind.


    Over time, the fervor over Ajax died down and we began building (and in some cases
    rebuilding) Ajax-based sites following the philosophy of progressive enhancement.
    Then along came Apple’s HTML5 Showcase with its pimped out CSS transitions and
    animations.² When we finished wiping the drool off our desks, many of us began
    incorporating these shiny new toys into our work, either because of our eagerness
    to play with these features or at our clients’ behest. Consequently, sites began
    cropping up that restricted users by requiring a modern Webkit variant³ in order
    to run. (Damn the nearly 80% of browsers that didn’t include.)


    When self-realization hit that requiring technologies that are not universally
    available ran counter to progressive enhancement, some web designers and developers
    declared the philosophy “limiting” and began drifting back toward graceful degradation.
    Progressive enhancement, they felt, forced them to focus on serving older browsers
    which, frankly, weren’t nearly as fun to work with. What they failed to realize,
    however, was that progressive enhancement wasn’t limiting them; their own understanding
    of the philosophy was.


    > 2. http://www.apple.com/html5/

    >

    > 3. Webkit is the engine that powers a number of browsers and applications. It
    has excellent CSS support and boasts support for quite a few snazzy CSS capabilities
    (such as CSS-based animations) yet to be matched by other browsers. Webkit can
    be found in Apple’s Safari, Google’s Chrome and Android browsers, the Symbian
    S60 browser, Shiira, iCab, OmniWeb, Epiphany, and many other browsers. It forms
    the basis for Palm’s WebOS operating system and has been integrated into numerous
    Adobe products including their Adobe Integrated Runtime (AIR) and the CS5 application
    suite.


    Progressive enhancement isn’t about browsers. It’s about crafting experiences
    that serve your users by giving them access to content without technological restrictions.
    Progressive enhancement doesn’t require that you provide the same experience in
    different browsers, nor does it preclude you from using the latest and greatest
    technologies; it simply asks that you honor your content (and your users) by applying
    technologies in an intelligent way, layer-upon-layer, to craft an amazing experience.
    Browsers and technologies will come and go. Marrying progressive enhancement with
    your desire to be innovative and do incredible things in the browser is entirely
    possible, as long as you’re smart about your choices and don’t lose sight of your
    users.


    ## Progressive enhancement = excellent customer service


    Imagine, for a moment, that you are a waiter in a nice restaurant. Your job (and
    your tip) depends upon your attention to detail and how well you serve your customers.
    One measure of your attentiveness is how empty you let a customer’s water glass
    become before refilling it. An inattentive waiter might let the glass sit empty
    for several minutes before refilling it. Someone slightly more on the ball might
    only let it hit the halfway mark before topping it up. A waiter who excels at
    meeting his customer’s beverage needs would not only make sure the water level
    never fell even that far, but he would even manage to refill the glass without
    the customer even realizing it. Whose customers do you think walk away the most
    satisfied? And, if we’re judging solely based on satisfactory hydration, who do
    you think is likely to get the best tip?


    As web designers and developers, we should strive to be as good at our job as
    that attentive, unobtrusive waiter, but it isn’t a simple task. Just as a waiter
    has no idea if a customer coming through the door will require frequent refills
    or few, we have no way of knowing a particular user''s needs when they arrive
    on our site. Instead, we must rise to meet those needs. If we''re really good,
    we can do so without our customers even realizing we''re making special considerations
    for them. Thankfully, with progressive enhancement''s user and content-focused
    approach (as opposed to graceful degradation''s newest-browser approach), this
    is easily achievable.


    ## Rising to the Occasion


    When approaching a project from a progressive enhancement perspective, your core
    focus is the content and everything builds upon that. It''s a layered approach
    that rises to meet a user''s "needs" by paying attention to the context within
    which a page is accessed (a combination of the browser''s capabilities and, to
    a lesser extent, the medium in which it is operating) and adapting the user experience
    accordingly.


    The baseline experience is always in the form of text. No specific technology
    shapes this layer, instead its success or failure relies entirely on the skills
    of the copywriter. Clear, well-written copy has universal device support and does
    wonders to improve the accessibility of the content to users. Furthermore, no
    matter how the HTML language evolves over time, the imperative that browsers be
    fault tolerant in their treatment of HTML syntax ensures that, no matter what,
    the content it describes will always be available in its most basic form: as text.


    The second level of experience comes from the semantics of the HTML language itself.
    The various elements and attributes used on a page provide additional meaning
    and context to the written words. They indicate important notions such as emphasis
    and provide supplementary information, such as the source of a quote or the meaning
    of an unfamiliar phrase.


    ## Think of the user, not the browser 14


    ![Figure 1.3: Graph of progressive enhancement](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_21_0.png)


    The third level of experience is the audio-visual one, expressed through the use
    of CSS and the use of inline images, audio, and video. As with HTML, implementations
    of CSS within a browser are necessarily fault tolerant, so browsers ignore that
    which they don''t understand; a fact that makes progressive enhancement in CSS
    a possibility.


    The fourth level of experience is the interactive one. In the standards world,
    this level relies almost entirely on JavaScript, though interaction on the web
    has been realized through other technologies such as Flash or even Java applets.


    The final level is realized through the application of enhanced semantics and
    best practices contained within and used in conjunction with the Web Accessibility
    Initiative''s Accessible Rich Internet Applications (WAI-ARIA) spec. These enhancements
    to the page pick up where the HTML spec has traditionally left off (though HTML5
    does include some of the enhanced ARIA semantics in its lexicon).'
