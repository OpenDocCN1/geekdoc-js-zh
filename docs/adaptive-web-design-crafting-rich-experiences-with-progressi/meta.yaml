  md: 'Hiding content with ARIA is pretty straightforward: you simply employ the `aria-hidden`
    attribute.


    ```

    <p aria-hidden="true">Guess what? I''m accessibly hidden using ARIA.</p>

    ```


    ARIA offers a number of predefined roles, states, and properties that can be of
    tremendous use when building a JavaScript-heavy site. There are even a handful
    that are useful whether you are building a highly interactive application or not.
    We''ll tackle those first.


    # EMPOWER WAYFINDING


    One of the many ways ARIA helps improve the accessibility of a web page is through
    the use of “landmark” and “structural” roles. Many of these roles formalize the
    significance we had been attempting to impart to elements for years via by applying
    semantic classifications and identifiers (as we discussed in Chapter 2). ARIA''s
    landmark and structural roles (and widget roles, which we''ll get to shortly)
    are assigned to an element using the `role` attribute.


    I know, I know: `role` isn''t a valid attribute in HTML 4.x or XHTML 1.x. It''s
    true. ARIA adds a host of new attributes to the HTML lexicon, which means you
    won''t be able to validate your pages using the same old Document Type Definitions
    (DTDs) you''ve been using. If you want to validate your ARIA-infused pages in
    either of these two languages, you''ll need to use a different set of DTDs³ or
    make the leap to HTML5 which supports attributes like `role`.


    3. The HTML 4.01 plus WAI-ARIA DOCTYPE is `<!DOCTYPE html PUBLIC "-//W3C//DTD
    HTML+ARIA 1.0//EN" "http://www.w3.org/WAI/ARIA/schemata/html4-aria-1.dtd">`. The
    XHTML plus WAI-ARIA DOCTYPE is `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML+ARIA
    1.0//EN" "http://www.w3.org/WAI/ARIA/schemata/xhtml-aria-1.dtd">`.'
