    # 前言


    2016年3月某个明媚的午后，当一位友人与我匆匆赶往奥斯汀市中心希尔顿酒店，准备参加西南偏南互动节的下一场活动时，一位年轻的陌生人拦住了我们。未经介绍或寒暄，他便宣布自己愿意在“Apart事件”——由
    Eric Meyer 与我三个月前创立的网页设计师大会——上发表演讲。我转向同伴，模仿“辛普森一家”中 Burns 先生的腔调（模仿得并不像）问道：“这位狂妄的年轻人是谁，Smithers？”


    这位狂妄的年轻人很快成为了不可或缺的同事。在随后的岁月里，Aaron Gustafson 为我们公司最挑剔的客户创作了令人眼花缭乱的前后端代码。同样重要的是，他出色地担任了《网站标准设计（第三版）》的技术编辑。这份工作主要包括提醒
    Ethan Marcotte 和我，我们对网页标准尚有哪些未知。关于这一点，我留待你们自行体会。五年来，Aaron 也一直是《A List Apart》杂志一位严格而公正的技术编辑，他帮助作者们取得成功，同时确保他们真正具有创新性，其方法具备可访问性与语义性，并且（凭借他近乎百科全书式的知识）对所有先前的相关成果给予应有的尊重。此外，Aaron
    为该杂志撰写过开创性的文章，并且，是的，他曾在“Apart事件”上演讲过。


    鉴于我对这个人的亲身经历以及对他知识与能力的钦佩，当 Aaron 告诉我这本书的构思并开始让我审阅章节时，我激动不已。这不仅仅是又一本网页设计书籍。它是经典文库中不可或缺却又缺失的一环。我们的行业长期以来一直需要一本关于自适应、基于标准的设计最佳实践汇编。随着移动设备的兴起、桌面及手机浏览器近期的显著改进，以及
    HTML5、CSS3 和手势界面带来的新功能，对于我们这些构建网站的人来说，拥有一份可靠的资源，指导我们如何利用这些新功能，同时创建能在各种尺寸、能力差异巨大的浏览器和设备上正常工作的内容，就显得尤为重要。这本书正是这样的资源。


    这些新元素与机遇的融合，正促使网络专业人士终于能够按照网络本应有的方式进行设计。自适应设计是正道，而在如何做好此事的思维与技巧方面，没有人比 Aaron 掌握得更全面。在这本书中，你将找到所有这些思考与方法。你再也不必为如何进行优秀的网页设计（并创造优秀的代码）以服务所有人而浪费一天时间来争论了。我打算将这本书赠予我所有的学生，以及所有与我共事的人。我鼓励你也这样做。现在，序言到此为止。请尽情投入其中，享受阅读吧！


    Jeffrey Zeldman

    《网站标准设计（第三版）》作者


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_8_0.png)


    # 第一章：以用户为中心，而非浏览器


    如果你在互联网领域工作过一段时间，你可能已经（甚至经常）听到“渐进增强”这个词。如你所知，这是进行网页设计的黄金标准。但渐进增强究竟是什么？它意味着什么？它是如何运作的？在语言和浏览器快速发展的今天，它又如何融入我们的工作流程？


    这些都是很好的问题，也是本书全文要解答的问题。正如你很快会看到的，渐进增强与浏览器无关，也与你使用的 HTML 或 CSS 版本无关。渐进增强是一种旨在打造体验的哲学，它通过消除技术限制来为用户提供内容访问，从而服务于用户。


    唱起《Kumbaya》颂歌了吧？这听起来相当惊人，但也像是很多工作。实际上并非如此。一旦你理解了渐进增强是如何运作的，或者更重要的是它为何有效，你会看到它其实相当简单。


    ## 适应或淘汰


    随着本书的深入，我们将看到许多实用的方法，可以结合 HTML、CSS 和 JavaScript 运用渐进增强来创建自适应网站。这些网站不仅能满足用户的需求，还能提供卓越的体验，无论他们使用何种浏览器或设备访问。


    但在深入探讨应用的具体细节之前，我们需要讨论渐进增强的方法与原因，以及这一哲学的基础。


    归根结底，渐进增强依赖于一个原则：容错性。


    容错性是系统在遇到意外错误时继续运行的能力。这种特性使得蜥蜴能够重新长出尾巴，大脑在创伤后能够重新建立神经连接。大自然已证明自己非常擅长容错，而遵循她的榜样，我们将这个概念融入了我们自己的创造中。例如，备受赞誉的“智能电网”可以通过感知（在某些情况下甚至能预测）系统问题，自动避免或减轻停电影响。


    无论你是将网络作为专业画布，还是仅仅作为普通消费者，你都在持续受益于容错性。它不仅内置于将请求从你的网页浏览器路由到你试图访问的服务器的协议中，而且被缝入构成今日网络基础的语言结构中：HTML
    和 CSS。根据这两种语言的规范要求，浏览器必须忽略任何它们不理解的内容。这个简单的要求使得渐进增强成为可能。但更多细节稍后再说。

    '
