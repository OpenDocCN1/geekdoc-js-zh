    \ | Denotes a photo of this person |\n| org | Identifies the company or organization\
    \ of which this person is a part |\n| role | Conveys the role this person holds\
    \ within the organization |\n\nTable 2.1: Key hCard classifications\n\nThe hCard\
    \ microformat offers many other options for marking up a person's profile, but\
