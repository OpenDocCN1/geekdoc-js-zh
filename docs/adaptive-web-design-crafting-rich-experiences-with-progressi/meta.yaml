    \ ) {\n        $new_nav.replaceWith($old_nav);\n        showing = 'old';\n   \
    \ }\n}\n```\n\n同样，这是最终脚本的一个略微简化版本，但它突出了重要的部分：只有在满足相应的浏览器宽度阈值（`trigger`）*并且*另一种导航样式正在显示时（使用\
    \ `showing` 跟踪），导航才会被切换。有了这个函数，我们只需运行一次（初始化所有内容并确保从一开始就显示正确的导航），然后将其分配给窗口的 `onresize`\
