  - '[PAGE 48]


    Again, we''ve seen how microformats can directly enhance the meaning of already
    meaningful markup in order to improve the user experience. Picture perfect progressive
    enhancement!


    # IT''S THE FOUNDATION


    While progressive enhancement is often discussed in terms of CSS and JavaScript,
    it applies equally to the markup. As we''ve seen in this chapter, every time we
    choose a meaningful element, we make it easier for the page to do its job by enhancing
    accessibility and increasing its visibility to potential users through organic
    search. We''ve also seen how both classification and identification can feed back
    into HTML, helping it become an even more expressive language. And, as is the
    case with microformats, we''ve even seen how the names we choose have the capacity
    to enhance both the semantics and usability of the content to which they are applied.


    Semantic markup is an invaluable step in the progressive enhancement continuum;
    in concert with well written content, it forms the foundation upon which the entire
    user experience is built.'
  - '[PAGE 49]


    > “Design is the fundamental soul of a human-made creation that ends up expressing
    itself in successive outer layers of the product or service.”


    — STEVE JOBS'
  - '[PAGE 50]


    # CHAPTER 3: PROGRESSIVE ENHANCEMENT WITH CSS


    With the possible exception of a few straggling websites still limping along with
    their font elements and spacer GIFs, design on the web is largely accomplished
    using Cascading Style Sheets (CSS). Sure, there’s Flash, SVG, and canvas, but
    if you are concerned about the availability and accessibility of your content,
    you’re going to be using HTML to mark up your content and CSS to style it.


    As with HTML, CSS is designed to be fault tolerant. Browsers ignore any syntax
    they don’t understand<sup>1, 2</sup> and, by paying attention to how the language
    has evolved over time, we can easily embrace progressive enhancement by taking
    advantage of this ignorance to craft layers of design based on a given browser’s
    capabilities.


    +   1. http://www.w3.org/TR/2009/CR-CSS2-20090908/syndata.html#parsing-errors

    2. http://www.w3.org/TR/2009/CR-CSS2-20090908/syndata.html#unsupported-values'
  - "[PAGE 51]\n\n# SOMETIMES AN ERROR CAN BE A GOOD THING\n\nThis isn't a CSS book,\
    \ so I'm not going to walk you through all of the options available to you in\
    \ CSS. One thing I do want to do, however, is give you an ever-so-brief recap\
    \ of how CSS works because I think it will provide you with invaluable insight\
    \ into how to construct progressive designs.\n\nAt its most fundamental, CSS is\
    \ a series of human-readable rule sets, each composed of a selector and declaration\
    \ block containing a set of property-value pairs (declarations) to be applied\
    \ to any element matched by the selector.\n\n```\np {\n    color: red;\n    font-weight:\
    \ bold;\n}\n```\n\nThe example above is about as basic as CSS gets. Anyone who's\
    \ worked with CSS before (and probably even someone who hasn't) can look at it\
    \ and quickly comprehend that it selects paragraphs and makes their text bold\
    \ and red. Looking at this example through the lens of fault tolerance, however,\
    \ you'll see things a little differently.\n\nWhen parsing a CSS file to determine\
    \ how to render a page, a browser reads each rule set and examines it. If it encounters\
    \ something it doesn't understand, it experiences something we call a \"parsing\
    \ error.\" Parsing errors are often the result of malformed CSS syntax (e.g.,\
    \ the misspelling of a property name or value, a missing colon or semicolon, etc.),\
    \ but they also result when perfectly valid CSS syntax is beyond the parser's\
    \ comprehension.\n\nAssuming all of our curly braces, colons, and semicolons are\
    \ in their proper places, the example we just saw contains five points at which\
    \ a parsing error could occur:"
  - "[PAGE 52]\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_52_0.png)\n\n+   1. the\
    \ selector: `p`;\n2. the first property name: `color`;\n3. the value of the first\
    \ property: \"red\";\n4. the second property name: `font-weight`; and\n5. the\
    \ value assigned to the second property: \"bold.\"\n\nAccording to the specification,\
    \ if a browser encounters this rule set and doesn't understand a part of it (i.e.,\
    \ it experiences a parsing error), the browser must ignore the larger component\
    \ of the rule set in which the parsing error occurs.\n\nSo, for example, if the\
    \ browser did not understand the CSS color keyword \"red,\" it would ignore the\
    \ declaration `color: red`, but would still apply the remaining declarations.\
    \ The same goes for the `font-weight` keyword \"bold.\" If, however, the browser\
    \ was unable to understand the selector (`p`), it would ignore the entire rule\
    \ set, regardless of the browser's ability to comprehend the individual declarations\
    \ it contained.\n\nThe reasoning behind this is simple: We don't know what the\
    \ future of CSS may be, so it is imperative that a browser ignore declarations\
    \ and selectors it doesn't know what to do with. This facilitates advancement\
    \ of the language (just as it does for HTML) and it also makes it possible to\
    \ progressively enhance pages using CSS.\n\nFor properties, using parsing errors\
    \ to your advantage is pretty straightforward and it opens up some awesome possibilities.\
    \ Here's a quick example using CSS3's RGBa color scheme:\n\n```\np {\n  background-color:\
    \ rgb(137, 224, 160);\n  background-color: rgba(180, 246, 248, .43);\n}\n```"
  - '[PAGE 53]


    A browser parsing this rule set would likely understand the selector (after all,
    you can''t get much simpler than an element selector), so it would move on to
    the first background-color declaration. The background-color property has been
    a part of CSS since version 1, so the browser should have no problem there and
    would move on to the assigned value. Similarly, RGB-based color values have also
    been a part of CSS since the beginning, so the browser will understand that value.
    With the first declaration passing muster with the parser, the browser would apply
    `background-color: rgb(137, 224, 160);` to all paragraphs and the parser would
    move on to the second declaration.


    In the second declaration, `background-color` is redefined with a new value (per
    the cascade). Obviously, as we discussed, the browser understands the property,
    so it would move on to the declared value, which uses RGBa. If the browser understands
    RGBa, there''s no problem and the RGBa value is assigned to the background-color
    property, overwriting the original RGB value. If RGBa is not supported, however,
    the browser experiences a parsing error and ignores the entire declaration, leaving
    all paragraphs with an RGB value for `background-color`.


    In this example, browsers that comprehend RGBa values would overwrite the `background-color`
    value following the rules of the "cascade" (as in Cascading Style Sheets). I''ll
    go into the cascade a bit more thoroughly later in the chapter, but here''s a
    quick summary: the cascade dictates that, for equivalent properties, the last
    one defined is the one rendered.


    This is a pretty simple example of how we can use CSS'' fault-tolerant nature
    to deliver an enhanced experience to more capable browsers. It doesn''t just work
    at the declaration level either; you can apply this same technique to hide entire
    rule sets from a particular browser by using a more advanced selector:'
  - "[PAGE 54]\n\n```\nhtml[lang] p {\n    /* A bunch of advanced stuff goes here\
    \ */\n}\n```\n\nAny browser encountering this rule set would parse it, starting\
    \ with the selector. If the browser understands attribute-based selection (in\
    \ this case targeting any paragraph that is a descendant of an `html` element\
    \ that has a language attribute), it will continue parsing the rule set and apply\
    \ the declarations it understands. If, on the other hand, said browser does not\
    \ comprehend attribute selectors, it would experience a parsing error and ignore\
    \ the entire rule set.\n\nPerhaps the most famous example of using this technique\
    \ to selectively deliver rules to one browser over another (more for effect than\
    \ practicality) is Egor Kloos' CSS Zen Garden entry titled \"Gemination.\"³\n\n\
    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_0.png)\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_1.png)\n\
    \n*Figure 3.1: Gemination in IE6 (above) and IE7 (below).*\n\n3. http://www.csszengarden.com/062/"
- md: "In this proof-of-concept piece, Kloos created a basic layout aimed at Internet\
    \ Explorer (then in version 6) and employed a technique dubbed MOSe (“Mozilla/Opera/Safari\
    \ enhancement”)⁴ to offer more advanced browsers a completely different experience.\
    \ Kloos used simple selectors for the basic layout and advanced selectors for\
    \ the enhanced styles. Here’s a snippet that demonstrates his approach:\n\n```css\n\
    #intro {\n  margin: 0;\n  padding: 0;\n  width: 660px;\n  height: 80px;\n  background:\
    \ transparent url(introkop.gif) no-repeat right top;\n}\n\n/* ... */\n\nbody[id=css-zen-garden]\
    \ #intro {\n  position: absolute;\n  top: 0;\n  left: 0;\n  float: none;\n  margin:\
    \ 0;\n  width: 100%;\n  height: 350px;\n  background: none;\n}\n```\n\nFollowing\
    \ CSS cascade order, the browser parses the first rule set first to render the\
    \ `#intro` layout. A little later, the browser parses the “enhanced” rule set\
    \ for `#intro`. If the browser understands attribute selectors, it will render\
    \ a completely different layout for `#intro`; if it doesn’t, it will ignore the\
    \ new rule set entirely.\n\n> 4. Dave Shea, curator of the CSS Zen Garden, coined\
    \ the term back in 2003, but when Internet Explorer 7 came out, the term fell\
    \ out of use because it didn’t have the same selector-based limitations as IE6.\
    \ You can read his original post at http://www.mezzoblue.com/archives/2003/06/25/mose/\n\
    \nSelector-based screening can be a useful technique, but it tends to trip up\
    \ many CSS authors who don’t realize selector failure in a compound selector (two\
    \ or more selector statements, separated by commas) is complete and not discrete:\n\
    \n```css\np,\np:not([title]) {\n  color: red;\n  font-style: bold;\n}\n```\n\n\
    This example has the same five locations for potential parsing errors as the example\
    \ that opened this chapter, but it also has a sixth one in the second selector\
    \ (p:not([title])). Browsers that understand only one of these two selectors will\
    \ ignore *the entire rule set* rather than just the advanced selector (which,\
    \ in case you were wondering, looks for paragraphs without `title` attributes).\n\
    \nThough it may seem unintuitive, the CSS 2.1 spec very clearly states that this\
    \ is how it should be: “The whole statement should be ignored if there is an error\
    \ anywhere in the selector, even though the rest of the selector may look reasonable.”⁵\
    \ Knowing this, we can make better decisions about how and when to combine selectors.\
    \ As a general rule, it’s best to avoid combining advanced selectors with simple\
    \ ones (as in the example) unless you *want* to hide the whole rule set from older\
    \ browsers.\n\nWe’ll come back to this technique momentarily, but first let’s\
    \ take a quick detour through the world of specificity.\n\nSpecificity is another\
    \ core concept in CSS. It is a measure of how many elements a given selector can\
    \ select and is the only mechanism available for overruling the cascade (more\n\
    \n> 5. http://www.w3.org/TR/2009/CR-CSS2-20090908/syndata.html#rule-sets\n\non\
    \ that in a second). Some selectors are more specific than other selectors. For\
    \ example, an id selector (e.g., #intro) is 10 times more specific than a class\
    \ selector (e.g., .vcard), which is, in turn, 10 times more specific than an element\
    \ selector (e.g., p).⁶\n\nThe specificity of a given selector is calculated by\
    \ adding the specificity of all of its component parts. Rules applied via very\
    \ specific selectors will trump those applied with less specific selectors, regardless\
    \ of their order in the cascade. Looking back at Egor's attribute selection sleight-of-hand,\
    \ it's worth noting that even if the first rule set in the example came second\
    \ in the CSS file, the browser would still prioritize it lower than the other\
    \ rule set because its selector has a lower specificity value than that of the\
    \ second rule set.\n\nSpecificity of selectors is something that takes time to\
    \ master and can cause any number of headaches because if you apply all of your\
    \ styles with heavy-handed selectors (e.g., each one contains an id selector),\
    \ you end up having to create even more specific selectors to overrule them (e.g.,\
    \ two id selectors). To avoid an ever-escalating arms race of specificity, I recommend\
    \ that you avoid making your selectors unnecessarily specific.\n\nLet's revisit\
    \ Kloos' handiwork and apply what we learned regarding parsing errors in compound\
    \ selectors; in doing so, we can reduce the specificity of Egor's advanced rule\
    \ sets and still maintain the spirit of his original work:\n\n```css\n#intro {\n\
    \    /* Old Layout */\n}\n\n/* ... */\n```\n\n> 6. If you don't quite grasp how\
    \ specificity is calculated, be sure to check out Andy Clarke's \"CSS Specificity\
    \ Wars\" http://www.stuffandnonsense.co.uk/archives/css_specificity_wars.html.\n\
    \n```css\n[foo], #intro {\n  /* Advanced Layout */\n}\n```\n\nIn this revision,\
    \ I changed the second rule set into a compound selector targeting an element\
    \ with an attribute named “foo” and another element with an id of “intro.” The\
    \ trick to this approach is that the initial attribute selector is a red herring.\
    \ The foo attribute is not only non-standard, but it is not used anywhere in the\
    \ CSS Zen Garden HTML, so the addition of that selector to the rule set does nothing\
    \ but hide the rule set from browsers that don’t understand attribute selectors.\
    \ And, most importantly, it leaves the #intro selector unadulterated, keeping\
    \ its specificity equal to that of the previous rule, allowing the cascade to\
    \ determine style application.\n\nWhile this may not always be the technique you\
    \ immediately reach for when implementing CSS, it’s a good one to remember when\
    \ you want to use rule set filtering without altering a selector’s specificity.\
    \ From a maintainability standpoint, this method is not ideal for more than a\
    \ single rule set here and there; to apply the concept of rule set filtering *en\
    \ masse*, there are better options available, and we’ll get to those shortly.\n\
    \n## CONCERNS, SEPARATED\n\nThe “cascade” is a critically important concept in\
    \ CSS; in fact it’s the *first word* in CSS. Literally. Again, it’s beyond the\
    \ scope of this little book to go through the concept of the cascade in any detail,\
    \ but there is one facet that can help you become a progressive enhancement expert\
    \ in no time: order.\n\nOrder matters. A lot.\n\nIn CSS, when all else is equal\
    \ (i.e., specificity), the proximity of a style declaration to its target element\
    \ determines the\n\noutcome. We saw this in our earlier example with the two background-color\
    \ assignments and the same holds true with independent rule sets.\n\n```css\n\
    h1 {\n  font-size: 2em;\n}\n\nh1 {\n  font-size: 3em;\n}\n```\n\nIn this case,\
    \ h1 elements will be assigned a font-size value of 3em. While it's unlikely you'll\
    \ see the same selector used in two consecutive rule sets like this, it's not\
    \ uncommon to see something similar. Take, for example, the images in the “Lodging”\
    \ article on the Retreats 4 Geeks site:\n\n### Where You’ll Stay\n\nThis is about\
    \ as far from industrial carpeting and folding chairs as you can get.\n\nOur luxury\
    \ lodge is located on the side of a mountain in Sevierville, Tennessee, just outside\
    \ of Gatlinburg. Equipped with a 4x8 foot theater screen, wireless Internet, a\
    \ hot tub, a pool table, a dartboard, a bar, and gorgeous views of the surrounding\
    \ mountains, it's the perfect atmosphere to escape the daily grind and learn something\
    \ new.\n\nEach of the lodge's twelve suites has a king-sized bed, private bathroom\
    \ with a jacuzzi tub, and its own balcony so you can relax and relish your surroundings.\
    \ You can even bring a guest for a small additional fee (see the registration\
    \ form).\n\nIn addition to filling your head with knowledge, we'll fill your tummy\
    \ with tasty organic meals (and plenty of snacks for when you get peckish), all\
    \ prepared in-house by our personal chef. And if you have dietary restrictions\
    \ or preferences, we'll do everything we can to accommodate and offer tasty choices.\n\
    \nLooking for a detailed curriculum or more information to help sell your boss\
    \ on this event? Download the HTML5 & CSS3 fact sheet or view our frequently asked\
    \ questions. Ready to attend? Register now.\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_59_0.png)\n\
    \n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_59_1.png)\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_59_2.png)\n\
    \n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_59_3.png)\n\nFigure 3.2: The Lodging\
    \ article."
  mdcn: "\n在这个概念验证案例中，Kloos 创建了一个针对 Internet Explorer（当时版本为 6）的基础布局，并采用了一种名为 MOSe（“Mozilla/Opera/Safari\
    \ 增强”）⁴ 的技术，为更先进的浏览器提供了完全不同的体验。Kloos 使用简单选择器实现基础布局，并使用高级选择器实现增强样式。以下是一个展示其方法的代码片段：\n\
    \n```css\n#intro {\n  margin: 0;\n  padding: 0;\n  width: 660px;\n  height: 80px;\n\
    \  background: transparent url(introkop.gif) no-repeat right top;\n}\n\n/* ...\
    \ */\n\nbody[id=css-zen-garden] #intro {\n  position: absolute;\n  top: 0;\n \
    \ left: 0;\n  float: none;\n  margin: 0;\n  width: 100%;\n  height: 350px;\n \
    \ background: none;\n}\n```\n\n遵循 CSS 级联顺序，浏览器首先解析第一个规则集来渲染 `#intro` 布局。稍后，浏览器会解析\
    \ `#intro` 的“增强”规则集。如果浏览器理解属性选择器，它将为 `#intro` 渲染一个完全不同的布局；如果不理解，它将完全忽略新的规则集。\n\
    \n> 4. CSS 策划者 Dave Shea 在 2003 年创造了这个术语，但当 Internet Explorer 7 发布后，由于它没有像 IE6\
    \ 那样基于选择器的限制，该术语便不再使用。你可以在 http://www.mezzoblue.com/archives/2003/06/25/mose/\
    \ 阅读他的原始文章。\n\n基于选择器的筛选可能是一种有用的技术，但它常常让许多 CSS 作者感到困惑，因为他们没有意识到复合选择器（由两个或更多选择器语句组成，用逗号分隔）中的选择器失败是完全的，而非离散的：\n\
    \n```css\np,\np:not([title]) {\n  color: red;\n  font-style: bold;\n}\n```\n\n\
    这个示例与本章开头的示例一样，在五个位置可能存在解析错误，但它在第二个选择器 `p:not([title])` 中还有第六个潜在错误。只理解这两个选择器中一个的浏览器会忽略*整个规则集*，而不仅仅是忽略高级选择器（如果你好奇，这个高级选择器用于查找没有\
    \ `title` 属性的段落）。\n\n尽管这可能看起来违反直觉，但 CSS 2.1 规范非常明确地指出这就是应有的方式：“如果选择器的任何部分存在错误，即使其余部分看起来合理，也应该忽略整个语句。”⁵\
    \ 知道了这一点，我们就能更好地决定如何以及何时组合选择器。一般规则是，最好避免将高级选择器与简单选择器组合（如示例所示），除非你*希望*将整个规则集对旧浏览器隐藏。\n\
    \n我们稍后会回到这个技术，但首先让我们快速了解一下特异性的世界。\n\n特异性是 CSS 中的另一个核心概念。它衡量一个给定选择器可以选择多少个元素，是唯一可用于覆盖级联机制（稍后详述）的机制。有些选择器比其他选择器更具特异性。例如，一个\
    \ ID 选择器（例如 `#intro`）的特异性是一个类选择器（例如 `.vcard`）的 10 倍，而后者又是一个元素选择器（例如 `p`）的 10 倍。⁶\n\
    \n给定选择器的特异性是通过将其所有组成部分的特异性相加来计算的。通过非常具体的选择器应用的规则将优先于通过不太具体的选择器应用的规则，无论它们在级联中的顺序如何。回顾\
    \ Egor 的属性选择戏法，值得注意的是，即使示例中的第一个规则集在 CSS 文件中排在第二位，浏览器仍然会将其优先级设置得低于另一个规则集，因为其选择器的特异性值低于第二个规则集。\n\
    \n选择器的特异性需要时间来掌握，并可能导致各种问题，因为如果你使用大量选择器（例如，每个都包含一个 ID 选择器）来应用所有样式，你最终将不得不创建更具特异性的选择器来覆盖它们（例如，两个\
    \ ID 选择器）。为了避免特异性不断升级的军备竞赛，我建议你避免不必要地使选择器过于具体。\n\n让我们重新审视 Kloos 的作品，并应用我们在复合选择器解析错误中学到的知识；通过这样做，我们可以降低\
    \ Egor 高级规则集的特异性，同时仍保持其原始工作的精髓：\n\n```css\n#intro {\n    /* Old Layout */\n}\n\
    \n/* ... */\n```\n\n> 6. 如果你不完全理解特异性的计算方式，请务必查看 Andy Clarke 的 \"CSS Specificity\
    \ Wars\" http://www.stuffandnonsense.co.uk/archives/css_specificity_wars.html。\n\
    \n```css\n[foo], #intro {\n  /* Advanced Layout */\n}\n```\n\n在这个修改版本中，我将第二个规则集改成了一个复合选择器，针对一个具有名为\
    \ “foo” 属性的元素和另一个 ID 为 “intro” 的元素。这种方法的诀窍在于，初始的属性选择器是个幌子。`foo` 属性不仅不是标准属性，而且在\
    \ CSS Zen Garden 的 HTML 中任何地方都没有使用，因此将该选择器添加到规则集中除了对理解属性选择器的浏览器隐藏该规则集之外毫无作用。并且，最重要的是，它保持了\
    \ `#intro` 选择器的纯粹性，使其特异性与之前的规则相等，从而让级联来决定样式的应用。\n\n虽然这可能不是你在实现 CSS 时立即想到的技术，但当你想在不改变选择器特异性的情况下使用规则集过滤时，这是一个值得记住的好方法。从可维护性的角度来看，这种方法对于单个或少数几个规则集来说并不理想；要*大规模*应用规则集过滤的概念，有更好的选择可用，我们马上就会介绍到。\n\
    \n## 概念分述\n\n“级联”是 CSS 中一个极其重要的概念；事实上，它就是 CSS 的*第一个词*。从字面上看。再次说明，这本小书的范围有限，无法详细探讨级联概念，但有一个方面可以帮助你迅速成为渐进增强专家：顺序。\n\
    \n顺序非常重要。非常重要。\n\n在 CSS 中，当其他所有条件相等（即特异性）时，样式声明与其目标元素之间的接近程度决定了结果。我们在前面的示例中看到了这一点，有两个\
    \ `background-color` 赋值，对于独立的规则集，同样适用。\n\n```css\nh1 {\n  font-size: 2em;\n}\n\
    \nh1 {\n  font-size: 3em;\n}\n```\n\n在这种情况下，`h1` 元素将被分配 `font-size` 值为 `3em`。虽然你不太可能在两个连续的规则集中看到相同的选择器，但看到类似的情况并不罕见。例如，以“Retreats\
    \ 4 Geeks”网站上“住宿”文章中的图片为例：\n\n### 你将下榻之处\n\n这里远离工业地毯和折叠椅。\n\n我们的豪华小屋位于田纳西州 Sevierville\
    \ 的山坡上，就在 Gatlinburg 郊外。小屋配备了 4x8 英尺的影院屏幕、无线网络、热水浴缸、台球桌、飞镖盘、酒吧，以及周围山脉的壮丽景色，是逃离日常琐事、学习新知识的完美氛围。\n\
    \n小屋的十二间套房每间都配有一张特大号床、带按摩浴缸的私人浴室和私人阳台，让你可以放松并欣赏周围的景色。你甚至可以支付少量额外费用带一位客人同行（请参阅注册表）。\n\
    \n除了让你的头脑充满知识，我们还将用美味的有机餐点（以及你在饥饿时享用的大量零食）填饱你的肚子，所有这些都由我们的私人厨师在店内准备。如果你有饮食限制或偏好，我们将尽一切努力满足并提供美味的选择。\n\
    \n需要详细的课程大纲或更多信息来说服你的老板参加这个活动吗？下载 HTML5 & CSS3 情况说明书或查看我们的常见问题解答。准备好参加了吗？立即注册。\n\
    \n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_59_0.png)\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_59_1.png)\n\
    \n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_59_2.png)\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_59_3.png)\n\
    \n图 3.2：住宿文章。\n"
