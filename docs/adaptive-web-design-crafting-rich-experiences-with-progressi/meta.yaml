  md: 'One of the best ways to manage triggering interface styles like this is by
    using an “activator” `class` on the root element of the widget. Here are some
    quick examples:


    | STRATEGY | “RESTING” CLASS | “ACTIVATED” CLASS |

    | :--- | :--- | :--- |

    | Add a suffix of “-on” to the base `class` | `.accordion` | `.accordion-on` |

    | Add another `class` | `.auto-submit` | `.auto-submit.active` |

    | Change the form of the `class` | `.replace-me` | `.replaced` |


    Table 4.1: Using an “activator” `class`.


    By following this practice, you can guarantee that no styles will be applied before
    they are needed.


    Another issue with style application by JavaScript is the potential for collisions.
    Just as it is important to isolate your scripts from one another to avoid collisions
    in variable, function, or method naming, it is recommended that you isolate your
    script-related styles from others as well. After all, you may not be able to control
    what other `class` names may be in use on a given page (especially if you''re
    releasing a script for other people to use) and if you don''t carefully sequester
    your styles, they can unintentionally “bleed” onto the rest of the page (i.e.,
    they might be applied to elements you didn''t intend them to apply to).


    To corral your styles, it''s best to start every selector with an identifiable
    marker unlikely to be in conflict with another `class` or `id` on the page. I
    like to begin with the name of the JavaScript object. So, for example, if I built
    an accordion widget named (cleverly) `AccordionWidget`, I might classify'
