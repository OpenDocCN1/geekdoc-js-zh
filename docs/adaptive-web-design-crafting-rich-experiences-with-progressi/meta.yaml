    \ 'a' ),\n    rel, i = links.length;\nwhile ( i-- ) {\n    rel = links[i].getAttribute('rel');\n\
    \    if ( rel && rel.match( /\\bexternal\\b/ ) ) {\n        links[i].onclick =\
    \ function(){\n            newWin( this.href );\n            return false;\n \
    \       };\n    }\n}\n```\n\n如果那些“if”和“while”对你来说如同天书，这里有一个脚本功能的简要总结：它收集页面上的所有链接并循环遍历它们（以逆序方式，这奇怪地比正向遍历稍快一些）；如果链接具有\
    \ `rel` 属性且其值包含文本“external”，则该链接的 `onclick` 事件会被分配一个匿名函数，该函数调用一个名为 `newWin` 的函数（像前面的例子一样，传递链接的\
    \ `href` 属性值），然后通过返回 false 来取消点击的默认操作。\n\n最终，我们找到了一个相当不错的解决方案，它几乎是能做到的最不显眼的方式。在\
    \ 2006 年，Jeremy Keith 为我们提出了一个可爱的小名称：**Hijax**，这是“劫持”（hijack，指链接的正常行为被接管的事实）和“\
    \ Ajax”（一种基于 JavaScript 的机制，使网页无需刷新浏览器即可与服务器交互）的巧妙结合。我们当时不知道，当时正流行的 Ajax 将向我们表明，在\
    \ JavaScript 事件管理方面，我们还有待学习。\n\n## 真正的灵活性\n\n随着 Ajax 技术⁶和其他动态修改页面内容的方法被广泛接受和实现，我们分配事件处理程序的陈旧方法表现得就不那么好了。毕竟，如果页面中注入了带有\
    \ `rel=\"external\"` 标记的新内容，它就不会有我们的自定义函数作为 `onclick` 事件处理程序被分配。这是因为我们的脚本很可能是在页面加载时（`window.onload()`）运行的，早于通过\
    \ Ajax 注入的新链接。\n\n这无疑提出了一个棘手的问题。在这种情况下，两个本应表现相同的链接实际上可能表现得完全不同。你能说出这是一个可用性问题吗？\n\
    \n6. `XMLHttpRequest` 是我们用来向服务器发起请求并接收信息的技术，无需刷新或重新加载浏览器页面。它由微软为 Outlook Web Access\
    \ 发明，并在 IE5 中首次亮相，但已被其他所有浏览器采用，目前正在 W3C 进行标准化。`XMLHttpRequest` 是 Ajax（异步 JavaScript\
