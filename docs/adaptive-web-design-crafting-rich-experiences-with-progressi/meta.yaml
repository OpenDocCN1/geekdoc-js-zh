    # # CHAPTER 4: PROGRESSIVE ENHANCEMENT WITH JAVASCRIPT


    On February 7th, 2011, shortly after Gawker Media launched a unified redesign
    of their various blogs (Lifehacker, Gizmodo, etc.), users visiting any of those
    sites were greeted by a blank stare (see Figure 4.1). The new platform relied
    entirely on JavaScript to load content into the page and an error in that JavaScript
    code made any page request come up empty-handed.¹ That single error caused a lengthy
    “site outage” (I use that term liberally because the servers were still working)
    for every Gawker property and lost them countless page views and ad impressions.
    And it could have been avoided, had they designed their new platform using progressive
    enhancement.


    1. A brief mention of the outage is here: http://blogs.wsj.com/digits/2011/02/07/gawker-outage-causing-twitter-stir/.
    Jeremy Keith and Mike Isolani provided worthwhile commentary on the JavaScript
    reliance of Gawker’s platform (http://adactio.com/journal/4346/ and http://isolani.co.uk/blog/javascript/BreakingTheWebWithHashBangs,
    respectively). I also weighed in at http://easy-reader.net/archives/2011/02/09/you-cant-rely-on-javascript/.'
- md: '![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_80_0.png)


    Figure 4.1: Lifehacker. Empty.


    Nothing really makes a web page sing quite like JavaScript. With it, you can create
    rich interactions, build dynamic interfaces, and so on. Web developers realized
    this early on. They jumped at the opportunity to wield this powerful tool to build
    more engaging web pages, validate form data, and more. For today''s JavaScript
    developers, it''s easy to make something amazing and stick to the progressive
    enhancement philosophy, but it wasn''t always that way.


    Back in the mid-to-late ''90s, coding JavaScript was like practicing a dark art.
    For every bit of spaghetti code we had in our HTML, it was usually ten times worse
    in JavaScript because the two dominant browsers at the time, Netscape and Internet
    Explorer, each had their own implementation of the language² and they differed
    just enough to make the really interesting stuff incredibly gnarly to write. For
    example, finding the same element (e.g., `#location`) in the document (technically
    the Document Object Model or DOM) required two incredibly different syntaxes:


    ```

    document.layers[''location''];   // Netscape

    document.all[''location''];      // IE

    ```


    2. The JavaScript language itself, designed by Brendan Eich, debuted as a feature
    of Netscape 2 in late 1995. Microsoft developed its own dialect of JavaScript
    (named “JScript,” for trademark reasons) and released it in mid 1996 as part of
    Internet Explorer 3 (which was, coincidentally, also the first browser to offer
    CSS support).


    ## GETTING OUT OF THE WAY


    This unfortunate reality required us to essentially write every script twice,
    or at least fill it with “forks” (alternate paths for a script to take, based
    on the browser) that came back to “fork” us in the end.


    As we discussed in Chapter 2, the late ''90s was a period of great turmoil on
    the web: the browser wars. With each new release, Netscape and Microsoft offered
    up new goodies for developers to use, hoping to capture a greater share of the
    browser market. This one-upmanship created a lot of problems for developers; with
    the two competing implementations of JavaScript, we spent so much time trying
    to even out the discrepancies that we didn''t pay attention to how the language
    functioned or learn the best way to integrate it with HTML and CSS.


    When the European Computer Manufacturers Association (ECMA) International standardized
    JavaScript³ and the W3C released its DOM spec, the shifting sands beneath our
    feet were finally replaced with a solid foundation and we were able to start figuring
    out better ways of doing things:


    ```

    document.getElementById(''location''); // Unified DOM

    ```


    One of the first lessons we learned when the dust settled was that JavaScript
    was not a panacea for interaction on the web. In fact, it wasn''t even all that
    reliable.


    First off, even after the W3C standardized the DOM and the browsers generally
    agreed to support web standards, not everyone was reading from the same playbook;
    there were enough differences between implementations that it was simply impossible
    to make any assumptions about the availability of certain methods (such as the
    lynchpin DOM traversal methods `document.getElementById()`, which provides access
    to elements based on their id or `document.getElementsByTagName()` which, you
    guessed it, finds elements based on their name). Secondly, even if a browser did
    have full JavaScript support, the user (or her IT administrator) still had the
    final say over whether or not JavaScript was even allowed to run.⁴


    Over time, we realized that JavaScript support was not a given and we began to
    re-factor our code, making it cleaner, more maintainable, and more flexible to
    deal with the availability (or absence) of JavaScript. Let’s examine the thinking
    during that period to better understand how to use JavaScript progressively.


    > Warning: From here on out, we''ll be diving into actual JavaScript code. If
    you have not worked much with JavaScript before, have no fear, I''ll do my best
    to explain what''s happening at every step of the way so that you can follow along,
    even if the code reads like Sanskrit to you.


    ## 100% reliance


    Back in the early days of JavaScript, it was not uncommon to write (or at least
    see) onclick event handlers (scripts executed when someone clicked an element
    on the page) adorning otherwise useless links.⁵


    ```

    <a href="#" onclick="newWin( ''http://easy-designs.net/'' );">Easy! Designs</a>

    ```


    With JavaScript enabled, this link calls a custom function named `newWin`, passing
    it a value of “http://easy-designs.net/.” That function, in turn, opens that URL
    in a new window. Without JavaScript, however, the link wouldn’t do anything because,
    as you’ll recall from our discussion of identifiers in Chapter 2, the `href` points
    to an empty `id`. What’s the point of a link that won’t work without JavaScript?


    Which brings me to my first maxim for progressive enhancement with JavaScript:


    - 1. Make sure all content is accessible and all necessary tasks can be completed
    without JavaScript turned on.


    This link obviously violates that (as does the Gawker platform I mentioned earlier),
    but so did the vast majority of JavaScript in use on the web by the end of the
    ’90s. At that time, the web was lousy with sites that required JavaScript and
    places where it got in the way of users; in other words, where JavaScript was
    obtrusive. Realizing this problem, web developers began to push for “unobtrusive”
    JavaScript.


    > Note: I’m not advocating the use of popups or using JavaScript to open new windows
    as they introduce a number of accessibility and usability issues. I have, however,
    chosen this as an example because it illustrates the evolution of our JavaScript
    code in a manner that’s relatively easy to follow. Rest assured, the lessons you’ll
    learn by following this example are universally applicable to any other JavaScript-ing
    you might do.


    4. For IT administrators, however, the choice to disable Javascript was fundamentally
    a security one, but for a long time users with accessibility concerns were also
    encouraged to disable JavaScript. Some users also disabled JavaScript to remove
    annoying ads and popups. JavaScript is most easily disabled in the browser preferences,
    but can also be blocked by firewalls or disabled at the application level by IT
    administrators.


    5. Variations of this old school technique included the `javascript` pseudo-protocol
    (e.g., `<a href="javascript:myFunction();">`) and, my personal favorite, the combined
    use of the `javascript` pseudo-protocol and an inline event handler (e.g., `<a
    href="javascript:void(null)" onclick="myFunction();">`).


    ## Becoming unobtrusive


    Unobtrusive JavaScript is a catch-all term for programming in a manner that is
    not reliant on JavaScript. Under this paradigm, users are given access to all
    page content and can accomplish every necessary task on a page using the basic
    building blocks of the web (HTML and the HTTP protocol). JavaScript is then layered
    on to enhance the page.


    Sound familiar? Unobtrusive JavaScript is an idea that meshes perfectly with progressive
    enhancement philosophy because it forces JavaScript into the role of functional
    enhancement, as opposed to absolute requirement.


    With unobtrusive JavaScript in mind, we re-factored our links to work whether
    JavaScript was available or not:


    ```

    <a href="http://easy-designs.net/" onclick="newWin( this.href ); return false;">Easy!
    Designs</a>

    ```


    In this revision, the link actually points to a URL so it will function without
    JavaScript. When JavaScript is available, however, clicking the link will call
    `newWin`, which is passed the value of the link’s `href` attribute (the DOM value
    `this.href`). The other key difference between this and the previous version of
    the link is that the `onclick` event handler is also set to “return false,” which
    cancels the click event’s default action (in this case, following the link to
    a new page).


    This was a great first step to address the potential absence of JavaScript, but
    we soon realized there were better ways to manage scenarios like this.'
