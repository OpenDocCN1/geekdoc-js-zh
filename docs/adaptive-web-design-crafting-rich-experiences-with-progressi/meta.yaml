- md: "You probably noticed that the `section` has an `h1` as its title. Don’t worry:\
    \ in HTML5, each `section` creates a new context within which it’s okay to restart\
    \ the headings at `h1`. It takes a little getting used to at first, I know, but\
    \ it makes sense and addresses the limited number of heading levels quite well.¹\n\
    \nIf you’ve got keen eyes, you’ve likely already identified exactly where each\
    \ of the hCard `classes` should be applied, but I’ll step through each one, just\
    \ to be sure, starting with the easiest one: “vcard.” This classification needs\
    \ to be applied to the containing element, in this case, the `section`:\n\n```\n\
    <section id=\"aaron-gustafson\" class=\"vcard\">\n```\n\nThe next obvious one\
    \ is “fn,” which should wrap my name. As my name is already wrapped in an `h1`,\
    \ we can apply a `class` of “fn” to that element to indicate the text contained\
    \ within the element is my name.\n\n```\n<h1 class=\"fn\">Aaron Gustafson</h1>\n\
    ```\n\nNext, we can add a `class` of “url” to the “Easy! Designs” link, denoting\
    \ that it points to a website I control:\n\n```\n... <a class=\"url\" rel=\"external\"\
    \ href=\"http://easy-designs.net\">Easy! Designs</a>, ...\n```\n\nContinuing down\
    \ the list, we can apply “photo” to the image of me, which is contained in a `figure`\
    \ element. HTML5 introduced the `figure` element to contain a discrete chunk of\
    \ content—usually an image or graphic with an optional caption (`figcaption`)—that\
    \ can stand on its own or be removed from a document without altering its meaning:\n\
    \n```\n<figure>\n  <img class=\"photo\" src=\"i/aaron-gustafson.jpg\"\n    alt=\"\
    \"/>\n</figure>\n```\n\n1. http://www.whatwg.org/specs/web-apps/current-work/multipage/content-models.html#sectioning-content\n\
    \nWe need to add the two final classes, “org” and “role” to this markup in the\
    \ final paragraph of my bio, but the content presents us with a bit of a conundrum\
    \ as there are several roles and organizations mentioned. Which one should we\
    \ use? Is it okay to include multiple organizations and roles?\n\nThere is nothing\
    \ in the hCard spec that restricts an hCard to a singular organization and role,\
    \ but, in practice, few microformats parsers will expose anything beyond the first\
    \ one encountered because address book software doesn’t typically allow for multiple\
    \ organizations and roles. For that reason, we’ll simply add the classification\
    \ to my primary function: Group Manager of the Web Standards Project.\n\nThe “org”\
    \ bit is easy because “Web Standards Project” is already contained in an element.\
    \ My role there, however, is part of a larger text string and is not contained\
    \ within its own element. To apply the classification to my role only, we have\
    \ to make use of an element bereft of semantic meaning, such as `<b>`²⁰\n\n```\n\
    ... He is <b class=\"role\">Group Manager</b> of the <a class=\"org\" href=\"\
    http://webstandards.org\">Web Standards Project (WaSP)</a> ...\n```\n\nViewed\
    \ all at once, you can see that the adjustments to incorporate the hCard microformat\
    \ are quite minimal:\n\n```\n<section id=\"aaron-gustafson\" class=\"vcard\">\n\
    \  <figure>\n    <img class=\"photo\" src=\"/events/2011/html5-css3/i/aaron-gustafson.jpg\"\
    \ alt=\"\"/>\n  </figure>\n```\n\n20. What? `<b>`? Really? Why not `span`? Well,\
    \ in HTML5, the `b` element has been brought back for the explicit purpose of\
    \ representing “a span of text to be stylistically offset from the normal prose\
    \ without conveying any extra importance.” While you can certainly use the `span`\
    \ element, `b` is a more appropriate (and shorter) alternative.\n\n# PROGRESSIVE\
    \ ENHANCEMENT WITH MARKUP\n\n36\n\n```\n<h1 class=\"fn\">Aaron Gustafson</h1>\n\
    \n<p>... Aaron and his wife, Kelly, own <a class=\"url\" rel=\"external\" href=\"\
    http://easy-designs.net\">Easy! Designs</a> ...</p>\n\n<p>... He is <b class=\"\
    role\">Group Manager</b> of the <a class=\"org\" rel=\"external\" href=\"http://webstandards.org\"\
    >Web Standards Project (WaSP)</a> ...</p>\n\n</section>\n```\n\nBut these simple\
    \ changes allow a microformats parser to put together a profile of me quite easily.\n\
    \n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_43_0.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_43_0.png)\n\
    \n*Figure 2.3: Screen shots of the information exposed from this code via Operator.*\n\
    \nWhat's really interesting about microformats is that you can use them however\
    \ you like. The `class` names don't need to appear in any particular order (so\
    \ long as they appear within an appropriately-classified parent element) and they\
    \ don't require that the content match the intended export format in any way.\
    \ And, as this example demonstrates, the hCard does not need to be marked up like\
    \ a rolodex card entry; instead, you are free to sprinkle its component parts\
    \ throughout your prose using the appropriate `class` names to indicate each one.\n\
    \n# Mark your calendars\n\nWith hCard covered, we can take a look at the hCalendar\
    \ event microformat mentioned earlier. Again, before we look at the markup, let's\
    \ take a look at some of the more important hCalendar classifications.\n\n| CLASS\
    \ | PURPOSE |\n|---|---|\n| vevent | Signifies that an hCalendar event is being\
    \ used. (This should be the `class` of the root element containing the hCalendar\
    \ event information.) |\n| dtstart | Indicates the start date of the event |\n\
    | dtend | Denotes the end date of the event |\n| summary | Identifies the name\
    \ of the event |\n| location | States the location of the event |\n| description\
    \ | Provides additional details about the event |\n\n*Table 2.2: Important hCalendar\
    \ classifications*\n\nAs the entire demo page is dedicated to the event, the `class`-application\
    \ process needs to begin further up the DOM tree. I've decided to start at the\
    \ content container (`div#content`), to which I've assigned the root \"vevent\"\
    \ `class`. While in the following example, the hCalendar content is contained\
    \ within `article#details`, applying the `class` to an ancestor element in this\
    \ manner gives us the flexibility to include more hCalendar properties in the\
    \ other `article`s as well:\n\n```\n<div id=\"content\" class=\"vevent\">\n```\n\
    \nAs I mentioned, the first article (`article#details`) contains the bulk of the\
    \ information about the event. Let’s take a look at that markup before we review\
    \ the application of the hCalendar classes:\n\n```\n<article id=\"details\">\n\
    \  <header>\n    <h1>Join us for HTML5 &amp; CSS3</h1>\n    <p>–10 April 2011</p>\n\
    \    <p>Gatlinburg, <abbr title=\"Tennessee\">TN</abbr></p>\n  </header>\n  <figure>\n\
    \    <img src=\"i/mountains.jpg\" alt=\"\"/>\n  </figure>\n  <section class=\"\
    main\">\n    <!-- event overview -->\n  </section>\n</article><!-- / #details\
    \ -->\n```\n\nGlancing over the markup, you’ve probably already figured out where\
    \ most of the hCalendar classifications should be applied. Right off the bat,\
    \ you have the name of the event or “summary” in hCalendar parlance:\n\n```\n\
    <h1>Join us for <b class=\"summary\">HTML5 &amp; CSS3</b></h1>\n```\n\nIn terms\
    \ of source order, the next piece we encounter is the date range “8-10 April 2011.”\
    \ Traditionally, we would have used abbreviation elements (`abbr`) to mark up\
    \ this data, but HTML5 introduces a new element explicitly tasked with indicating\
    \ temporal information: the `time` element. One problem: to supply a start and\
    \ end date for the event, we need to break the content up into two dates before\
    \ wrapping each in a `time` element.\n\nThough it may seem odd at first, what\
    \ makes the most sense is wrapping the “8” in one `time` element and “10 April\
    \ 2011” in the other. We do that because the “8” is really implying “8 April 2011,”\
    \ albeit in an abbreviated form (which is why `abbr` made a lot of sense previously).\
    \ The `time` element allows for further clarification of dates using the `datetime`\
    \ attribute, which is how I’ve expressed the full starting date:\n\n```\n<p><time\
    \ datetime=\"2011-04-08\">8</time>–<time datetime=\"2011-04-10\">10 April 2011</time></p>\n\
    ```\n\nhCalendars only require a summary and a starting date, so we only need\
    \ to apply the “dtstart” classification to the first `time` element for the microformat\
    \ to be valid. But since we have an end date, it makes sense to apply that one\
    \ too:21\n\n```\n<p><time class=\"dtstart\" datetime=\"2011-04-08\">8</time>–<time\
    \ class=\"dtend\" datetime=\"2011-04-10\">10 April 2011</time></p>\n```\n\nContinuing\
    \ down the article, “location” is pretty obvious: Gatlinburg, TN:\n\n```\n<p class=\"\
    location\">Gatlinburg, <abbr title=\"Tennessee\">TN</abbr></p>\n```\n\n> 21. As\
    \ of this writing, some microformat parsers have issues with the newer HTML5 elements\
    \ and attributes. For that reason, it may make sense to duplicate the value of\
    \ the `datetime` attribute into a `title` on the `time` element or switch to using\
    \ `title` on an `abbr`."
  mdcn: "\n你可能已经注意到，`section` 的标题是 `h1`。别担心：在 HTML5 中，每个 `section` 都会创建一个新的上下文，在此上下文中可以重新从\
    \ `h1` 开始使用标题。我知道，一开始可能需要一点时间适应，但这很有道理，并且很好地解决了标题级别数量有限的问题。¹\n\n如果你眼尖，可能已经准确识别出每个\
    \ hCard `class` 应该应用到哪里，但我还是会逐一讲解，以确保万无一失，从最简单的开始：\"vcard\"。这个分类需要应用到包含元素上，在这个例子中就是\
    \ `section`：\n\n```\n<section id=\"aaron-gustafson\" class=\"vcard\">\n```\n\n\
    下一个很明显是 \"fn\"，它应该包裹我的名字。由于我的名字已经被 `h1` 包裹，我们可以给那个元素添加一个 \"fn\" 的 `class`，以表明该元素包含的文本是我的名字。\n\
    \n```\n<h1 class=\"fn\">Aaron Gustafson</h1>\n```\n\n接下来，我们可以给 \"Easy! Designs\"\
    \ 链接添加一个 \"url\" 的 `class`，表示它指向一个我控制的网站：\n\n```\n... <a class=\"url\" rel=\"\
    external\" href=\"http://easy-designs.net\">Easy! Designs</a>, ...\n```\n\n继续往下看，我们可以将\
    \ \"photo\" 应用到我的照片上，这张照片包含在一个 `figure` 元素中。HTML5 引入了 `figure` 元素来包含一块独立的内容——通常是一个带可选标题（`figcaption`）的图片或图表——它可以独立存在，也可以从文档中移除而不改变其含义：\n\
    \n```\n<figure>\n  <img class=\"photo\" src=\"i/aaron-gustafson.jpg\"\n    alt=\"\
    \"/>\n</figure>\n```\n\n1. http://www.whatwg.org/specs/web-apps/current-work/multipage/content-models.html#sectioning-content\n\
    \n我们需要在简介的最后一段添加最后的两个类：\"org\" 和 \"role\"，但内容给我们带来了一点小小的困境，因为其中提到了几个职位和组织。我们应该使用哪一个？可以包含多个组织和职位吗？\n\
    \nhCard 规范中并没有限制一个 hCard 只能有一个组织和职位，但实际上，大多数微格式解析器只会提取遇到的第一个，因为地址簿软件通常不允许有多个组织和职位。因此，我们只需将分类添加到我的主要职能上：Web\
    \ 标准项目组经理。\n\n\"org\" 部分很简单，因为 \"Web 标准项目\" 已经包含在一个元素中。然而，我的职位是更大文本字符串的一部分，并未包含在自己的元素中。为了只将分类应用到我的职位上，我们必须使用一个没有语义含义的元素，比如\
    \ `<b>`²⁰：\n\n```\n... He is <b class=\"role\">Group Manager</b> of the <a class=\"\
    org\" href=\"http://webstandards.org\">Web Standards Project (WaSP)</a> ...\n\
    ```\n\n从整体来看，你会发现整合 hCard 微格式的调整非常小：\n\n```\n<section id=\"aaron-gustafson\" class=\"\
    vcard\">\n  <figure>\n    <img class=\"photo\" src=\"/events/2011/html5-css3/i/aaron-gustafson.jpg\"\
    \ alt=\"\"/>\n  </figure>\n```\n\n20. 什么？`<b>`？真的吗？为什么不用 `span`？嗯，在 HTML5 中，`b`\
    \ 元素被重新引入，专门用于表示“一段在视觉上与普通文本区分开来，但不传达任何额外重要性的文本。”虽然你当然可以使用 `span` 元素，但 `b` 是一个更合适（也更短）的替代方案。\n\
    \n# 通过标记实现渐进增强\n\n36\n\n```\n<h1 class=\"fn\">Aaron Gustafson</h1>\n\n<p>... Aaron\
    \ and his wife, Kelly, own <a class=\"url\" rel=\"external\" href=\"http://easy-designs.net\"\
    >Easy! Designs</a> ...</p>\n\n<p>... He is <b class=\"role\">Group Manager</b>\
    \ of the <a class=\"org\" rel=\"external\" href=\"http://webstandards.org\">Web\
    \ Standards Project (WaSP)</a> ...</p>\n\n</section>\n```\n\n但这些简单的更改就能让微格式解析器轻松地构建出我的个人资料。\n\
    \n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_43_0.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_43_0.png)\n\
    \n*图 2.3：通过 Operator 工具从该代码中提取的信息的屏幕截图。*\n\n微格式真正有趣的地方在于你可以随心所欲地使用它们。`class` 名称不需要以任何特定的顺序出现（只要它们出现在具有适当类名的父元素内即可），并且它们不需要内容以任何方式匹配预期的导出格式。而且，正如这个例子所展示的，hCard\
    \ 不需要像名片条目那样进行标记；相反，你可以自由地使用适当的 `class` 名称将各个组件分散到你的散文中。\n\n# 标记你的日历\n\n掌握了 hCard\
    \ 后，我们可以看看前面提到的 hCalendar 事件微格式。同样，在查看标记之前，让我们先看看一些更重要的 hCalendar 分类。\n\n| 类名\
    \ | 用途 |\n|---|---|\n| vevent | 表示正在使用一个 hCalendar 事件。（这应该是包含 hCalendar 事件信息的根元素的\
    \ `class`。） |\n| dtstart | 表示事件的开始日期 |\n| dtend | 表示事件的结束日期 |\n| summary | 标识事件的名称\
    \ |\n| location | 说明事件的位置 |\n| description | 提供有关事件的额外细节 |\n\n*表 2.2：重要的 hCalendar\
    \ 分类*\n\n由于整个演示页面都是为该事件服务的，`class` 应用过程需要从 DOM 树的更高层开始。我决定从内容容器（`div#content`）开始，我将根级\
    \ \"vevent\" `class` 分配给了它。虽然在下面的示例中，hCalendar 内容包含在 `article#details` 内，但以这种方式将\
    \ `class` 应用到祖先元素，为我们提供了在其他 `article` 中也包含更多 hCalendar 属性的灵活性：\n\n```\n<div id=\"\
    content\" class=\"vevent\">\n```\n\n正如我所提到的，第一篇文章（`article#details`）包含了有关该事件的大部分信息。在查看\
    \ hCalendar 类的应用之前，让我们先看看这段标记：\n\n```\n<article id=\"details\">\n  <header>\n\
    \    <h1>Join us for HTML5 &amp; CSS3</h1>\n    <p>–10 April 2011</p>\n    <p>Gatlinburg,\
    \ <abbr title=\"Tennessee\">TN</abbr></p>\n  </header>\n  <figure>\n    <img src=\"\
    i/mountains.jpg\" alt=\"\"/>\n  </figure>\n  <section class=\"main\">\n    <!--\
    \ event overview -->\n  </section>\n</article><!-- / #details -->\n```\n\n浏览一下标记，你可能已经弄清楚了大多数\
    \ hCalendar 分类应该应用到哪里。首先，你有了事件的名称，或者说 hCalendar 术语中的 \"summary\"：\n\n```\n<h1>Join\
    \ us for <b class=\"summary\">HTML5 &amp; CSS3</b></h1>\n```\n\n按照源代码顺序，我们遇到的下一部分是日期范围\
    \ \"8-10 April 2011\"。传统上，我们会使用缩写元素（`abbr`）来标记这些数据，但 HTML5 引入了一个专门用于表示时间信息的新元素：`time`\
    \ 元素。有一个问题：为了提供事件的开始和结束日期，我们需要将内容分成两个日期，然后将每个日期包裹在一个 `time` 元素中。\n\n虽然一开始可能显得有些奇怪，但最合理的做法是将\
    \ \"8\" 包裹在一个 `time` 元素中，将 \"10 April 2011\" 包裹在另一个中。我们这样做是因为 \"8\" 实际上暗示着 \"\
    8 April 2011\"，只是以缩写形式呈现（这就是为什么以前使用 `abbr` 很合理）。`time` 元素允许使用 `datetime` 属性进一步澄清日期，这就是我用来表达完整开始日期的方式：\n\
    \n```\n<p><time datetime=\"2011-04-08\">8</time>–<time datetime=\"2011-04-10\"\
    >10 April 2011</time></p>\n```\n\nhCalendar 只需要一个摘要和一个开始日期，因此我们只需要将 \"dtstart\"\
    \ 分类应用到第一个 `time` 元素上，微格式就是有效的。但既然我们有结束日期，应用那个分类也是有意义的：21\n\n```\n<p><time class=\"\
    dtstart\" datetime=\"2011-04-08\">8</time>–<time class=\"dtend\" datetime=\"2011-04-10\"\
    >10 April 2011</time></p>\n```\n\n继续浏览文章，\"location\" 就很明显了：Gatlinburg, TN：\n\n\
    ```\n<p class=\"location\">Gatlinburg, <abbr title=\"Tennessee\">TN</abbr></p>\n\
    ```\n\n> 21. 截至撰写本文时，一些微格式解析器在处理较新的 HTML5 元素和属性时存在问题。因此，将 `datetime` 属性的值复制到 `time`\
    \ 元素的 `title` 属性中，或者改用 `abbr` 的 `title` 属性可能是有意义的。\n"
