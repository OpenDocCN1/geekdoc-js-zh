  - "[PAGE 91]\n\nnav element into a select when the browser shrinks below a particular\
    \ size. To keep the example short and a little easier to follow, I've used the\
    \ jQuery JavaScript library.⁹ Libraries are great tools as they are composed of\
    \ dozens if not hundreds of functions that solve common problems (like adding\
