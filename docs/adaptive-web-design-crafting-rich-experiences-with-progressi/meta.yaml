  md: 'And there you have it: a perfect example of progressive enhancement with Javascript.


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_95_0.png)


    Figure 4.5: select-based navigation on an iPhone.


    As this simple example demonstrates, JavaScript is perfectly capable of generating
    everything it needs and getting rid of anything it doesn''t. You could even take
    this particular function a step farther and make it even more markup agnostic
    by allowing the root starting point (in our case, the child elements of `nav`)
    to be passed dynamically into the function. But I leave that to you to experiment
    with. Onward!


    # KEEP IT COPACETIC


    As we''ve covered, many of the progressive enhancement techniques available to
    us in HTML and CSS are pretty straightforward and may even have been part of your
    repertoire prior to picking up this book. Progressive enhancement with JavaScript,
    on the other hand, is a bit more complicated; JavaScript cannot be fault tolerant
    like the others because it is a programming language.'
  merge: -1
