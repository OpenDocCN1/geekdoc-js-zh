  md: '# ABOUT THE AUTHOR


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_134_0.png)


    Aaron has been working on the web for nearly 15 years and, in that time, has cultivated
    a love of web standards and an in-depth knowledge of website strategy and architecture,
    interface design, and numerous languages (including XHTML, CSS, JavaScript, and
    PHP). Aaron and his wife, Kelly McCarthy, own Easy! Designs, a boutique web consultancy
    based in Chattanooga, TN. When not neck deep in code, Aaron is usually found evangelizing
    his findings and sharing his knowledge and passion with others in the field.


    Aaron has trained professionals at the *New York Times*, Gartner, and the US Environmental
    Protection Agency (among others), and has presented at the world''s foremost web
    conferences, such as An Event Apart and Web Directions. He is Group Manager of
    the Web Standards Project (WaSP) and serves as an Invited Expert to the World
    Wide Web Consortium''s Open Web Education Alliance (OWEA). He created eCSSStender,
    serves as Technical Editor for *A List Apart*, is a contributing writer for *.net
    Magazine*, and has filled a small library with his technical writing and editing
    credits.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# # ABOUT EASY READERS


    Easy! Readers books are skillfully and cleverly written publications that explore
    best practices and web standards for seasoned and aspiring web professionals.
    Reigning web practitioner, Aaron Gustafson, and industry peers author a series
    of books that address holistic approaches to crafting top-notch websites.


    With a strong focus on usability and accessibility, Easy! Readers'' mission is
    to guide readers through the origins, philosophies and practical uses of various
    topics as they relate to web standards. Because the web is an ever-changing medium
    whose scope, audience and platform continue to change and grow, we are dedicated
    to bringing you content that is dynamic and relevant.


    Easy Readers books may be purchased in bulk for educational use. For more information,
    contact our educational sales department: education@easy-readers.net.


    # # COLOPHON


    The text is set in Fresco Plus and its companion, Fresco Sans Plus, both by Fred
    Smeijers. The book and chapter titles are set in Trade Gothic by Jackson Burke.
    Code is set in FF OCR F by Albert-Jan Pool.


    We believe in supporting local business and sustainable practices. This book was
    printed by Starkey Printing Company in Chattanooga, Tennessee. The paper used—100lb
    Chorus Art Silk Cover and 80lb Chorus Art Silk Text—is FSC certified and made
    with 50% recycled (30% post-consumer) content.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'In this brief book, Aaron Gustafson chronicles the origins of progressive enhancement,
    its philosophy, and mechanisms, and reveals the countless practical ways that
    you can apply progressive enhancement principles using HTML, CSS, and JavaScript.
    By understanding progressive enhancement and how to apply it properly, web practitioners
    can craft experiences that serve users (rather than browsers), giving them access
    to content without technological restrictions.


    > "Adaptive Web Design not only provides the clearest, most beautiful explanation
    of progressive enhancement I''ve ever read, it''s also packed full of practical
    know-how pumped directly into your neocortex through Aaron''s warm and friendly
    writing style."

    — **Jeremy Keith**, Author of *HTML5 for Web Designers*


    > "Finally. Progressive enhancement explained with a perfect balance of theory
    and practice."

    — **Dan Cederholm**, Author of *CSS3 for Web Designers*


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_136_0.png)


