    \ 1](image1.jpg)\n- ![Interior image 2](image2.jpg)\n\n*Figure 3.3: \"Lodging\"\
    \ sans CSS.*\n\n# Where You’ll Stay\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_63_1.png)\n\
    \nThis is about as far from industrial carpeting and folding chairs as you can\
    \ get.\n\nOur luxury lodge is located on the side of a mountain in Sevierville,\
    \ Tennessee, just outside of Gatlinburg. Equipped with a 4x8 foot theater screen,\
    \ wireless internet, a hot tub, a pool table, a dartboard, a bar, and gorgeous\
    \ views of the surrounding mountains, it’s the perfect atmosphere to escape the\
    \ daily grind and learn something new.\n\nEach of the lodge’s twelve suites has\
    \ a king-sized bed, private bathroom with a jacuzzi tub, and its own balcony so\
    \ you can relax and relish your surroundings. You can even bring a guest for a\
    \ small additional fee (see [the registration form](https://example.com/registration-form)).\n\
    \nIn addition to filling your head with knowledge, we’ll fill your tummy with\
    \ tasty organic meals (and plenty of snacks for when you get peckish), all prepared\
    \ in-house by our personal chef. And if you have dietary restrictions or preferences,\
    \ we’ll do everything we can to accommodate and offer tasty choices.\n\nLooking\
    \ for a detailed curriculum or more information to help sell your boss on this\
    \ event? [Download the HTML5 & CSS3 fact sheet](https://example.com/fact-sheet)\
    \ or view our [frequently asked questions](https://example.com/faq). Ready to\
    \ attend? [Register now](https://example.com/register).\n\n- ![Interior image\
    \ 1 (styled)](image1.jpg)\n- ![Interior image 2 (styled)](image2.jpg)\n- ![Interior\
    \ image 3 (styled)](image3.jpg)\n\n*Figure 3.4: \"Lodging\" with typographic styles.*\n\
    \nThe improvement is minor, but it is an improvement. And for browsers that have\
    \ issues with CSS-based layouts, this may actually serve your users better than\
    \ trying to force them into a more advanced layout than their browser can handle.\n\
    \nThe next layer of style support to offer—and one that’s probably available to\
    \ users alongside basic typography—is color (which, in some cases, may include\
    \ background images). Figure 3.5 shows the minor changes color brings to the design\
    \ of this article.\n\n# Where You’ll Stay\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_64_0.png)\n\
    \n**This is about as far from industrial carpeting and folding chairs as you can\
    \ get.**\n\nOur luxury lodge is located on the side of a mountain in Sevierville,\
    \ Tennessee, just outside of Gatlinburg. Equipped with a 4x8 foot theater screen,\
    \ wireless Internet, a hot tub, a pool table, a dartboard, a bar, and gorgeous\
    \ views of the surrounding mountains, it’s the perfect atmosphere to escape the\
    \ daily grind and learn something new.\n\nEach of the lodge’s twelve suites has\
    \ a king-sized bed, private bathroom with a Jacuzzi tub, and its own balcony so\
    \ you can relax and relish your surroundings. You can even bring a guest for a\
    \ small additional fee (see the registration form).\n\nIn addition to filling\
    \ your head with knowledge, we’ll fill your tummy with tasty organic meals (and\
    \ plenty of snacks for when you get peckish), all prepared in-house by our personal\
    \ chef. And if you have dietary restrictions or preferences, we’ll do everything\
    \ we can to accommodate and offer tasty choices.\n\nLooking for a detailed curriculum\
    \ or more information to help sell your boss on this event? Download the HTML5\
    \ & CSS3 fact sheet or view our frequently asked questions. Ready to attend? Register\
    \ now.\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_64_1.png)\n\n*Figure 3.5: \"\
    Lodging,\" colorized.*\n\nClearly, we’re looking at incremental improvements here,\
    \ but improvements nonetheless.\n\nThe underlying markup for this article is as\
    \ follows:\n\n```html\n<article id=\"lodging\">\n  <header>\n    <h1>Where You’ll\
    \ Stay</h1>\n  </header>\n\n  <figure class=\"frame focal\">\n    <img class=\"\
    inner\" src=\"i/lodge.jpg\"\n      alt=\"\" title=\"...\"/>\n  </figure>\n\n \
    \ <section class=\"main\">\n    <!-- description of accommodations -->\n  </section>\n\
    \n  <aside class=\"extra\">\n    <ul class=\"gallery\">\n      <li>\n        <figure\
    \ class=\"frame\">\n          <img class=\"inner\" src=\"i/room.jpg\"\n      \
    \      alt=\"\" title=\"...\"/>\n        </figure>\n      </li>\n      <!-- ...\
    \ -->\n    </ul>\n  </aside>\n</article>\n```\n\nYou'll notice that the `article`\
    \ in question uses the same `class` for each `figure` element: “frame”; this allows\
    \ us to achieve consistency with regard to the postcard-with-matte look. I've\
    \ given the focal `figure` an additional `class` of, well, “focal.” This setup\
    \ allows me to use two different CSS rules of equal specificity to apply the appropriate\
    \ styles to `figure.focal`. Here's an example of one such application, followed\
    \ by an override:\n\n```css\n.frame {\n  margin: 0 auto 40px;\n}\n\n.focal {\n\
    \  margin: 0 20px 25px 30px;\n}\n```\n\nEach of these rule sets applies to the\
    \ focal figure in this article (and all others on the page) and both rule sets\
    \ have selectors of equal specificity. Since the second rule set defines the same\
    \ property as the first, the margin value of the “focal” figure will be “0 20px\
    \ 25px 30px” instead of “0 auto 40px.”\n\nOf course, most stylesheets are composed\
    \ of hundreds of rule sets, making it easy to unintentionally fall victim to issues\
    \ of proximity. Thankfully, however, we can alleviate some of those issues by\
    \ taking a layered approach to designing with CSS.\n\nTaking a step back for a\
    \ moment, you can see the design of a website contains three core facets: Typography,\
    \ color, and layout. Each brings something more to the table, building the design\
    \ until it is fully realized. When it comes to progressive enhancement with CSS,\
    \ we can use that same breakdown to create discrete levels of support that are\
    \ delivered based on the capabilities of the browser: typography; typography and\
    \ color; and typography, color, and layout.\n\nAs we’ve discussed, rule order\
    \ matters, so when building a progressive design, we must reconcile our desire\
    \ to separate the facets of our design with the way the cascade prescribes the\
    \ interpretation of our rules. In practical terms, that means delivering your\
    \ groups of facet-specific declarations in a set order: typography, then layout,\
    \ then color. Why that order? We’ll get to that in a moment.\n\nYou can deliver\
    \ these rule groups as separate stylesheets (either linked or imported) or in\
    \ a single one.^[7] The multiple stylesheet route is pretty straightforward and\
    \ easy to manage, but it costs you in performance because each stylesheet must\
    \ be obtained in a separate HTTP request. Beyond that, some browsers don't cache\
    \ stylesheets more than one level down (e.g., a stylesheet imported into another\
    \ stylesheet). For these reasons, the single stylesheet approach makes the most\
    \ sense to me and is the one I've implemented on the Retreats 4 Geeks site.\n\n\
    To illustrate the concept of layering styles, perhaps it's best to start at the\
    \ beginning: with no style applied. On the following page, Figure 3.3 shows the\
    \ lodging article in Safari with only the default browser styles applied.\n\n\
    As you can see, the content is completely usable with the browser's default styles.\
    \ It's not nearly as attractive as we'd like, but the content is entirely accessible.\
    \ Applying a layer of general typographic styles, we end up with Figure 3.4.\n\
    \n[7] Just because your CSS is delivered in one stylesheet doesn't mean it needs\
    \ to be maintained that way. There are numerous server-side tools for combining\
    \ CSS files into a single one, so you could easily have the best of both worlds\
    \ by physically importing the separate stylesheets into the slots in a single\
    \ skeleton CSS file before delivering it to your users. For an example: http://www.easy-reader.net/archives/2010/07/11/template-based-asset-munging-in-expressionengine.\n\
    \nThe final layer of style application we’ll concern ourselves with right now\
    \ is the screen-based layout. Figure 3.2, from earlier in the chapter, shows the\
    \ “Lodging” article in all of its glory."
