  - '[PAGE 46]


    In terms of source order, the next piece we encounter is the date range “8-10
    April 2011.” Traditionally, we would have used abbreviation elements (`abbr`)
    to mark up this data, but HTML5 introduces a new element explicitly tasked with
    indicating temporal information: the `time` element. One problem: to supply a
    start and end date for the event, we need to break the content up into two dates
    before wrapping each in a `time` element.


    Though it may seem odd at first, what makes the most sense is wrapping the “8”
    in one `time` element and “10 April 2011” in the other. We do that because the
    “8” is really implying “8 April 2011,” albeit in an abbreviated form (which is
    why `abbr` made a lot of sense previously). The `time` element allows for further
    clarification of dates using the `datetime` attribute, which is how I’ve expressed
    the full starting date:


    ```

    <p><time datetime="2011-04-08">8</time>&#8211;<time datetime="2011-04-10">10 April
    2011</time></p>

    ```


    hCalendars only require a summary and a starting date, so we only need to apply
    the “dtstart” classification to the first `time` element for the microformat to
    be valid. But since we have an end date, it makes sense to apply that one too:21


    ```

    <p><time class="dtstart" datetime="2011-04-08">8</time>&#8211;<time class="dtend"
    datetime="2011-04-10">10 April 2011</time></p>

    ```


    Continuing down the article, “location” is pretty obvious: Gatlinburg, TN:


    ```

    <p class="location">Gatlinburg, <abbr title="Tennessee">TN</abbr></p>

    ```


    > 21. As of this writing, some microformat parsers have issues with the newer
    HTML5 elements and attributes. For that reason, it may make sense to duplicate
    the value of the `datetime` attribute into a `title` on the `time` element or
    switch to using `title` on an `abbr`.'
- md: "The final piece of our hCalendar puzzle is the “description” and the most obvious\
    \ choice of content for that property is the “main” section of the article:\n\n\
    ```html\n<section class=\"main description\">\n  <!-- event overview -->\n</section>\n\
    ```\n\nAnd that’s it. With the microformatted content in place, it’s now quite\
    \ simple for users to export the event directly to their calendar.\n\n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_47_0.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_47_0.png)\n\
    \n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_47_1.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_47_1.png)\n\
    \n> Figure 2.4: Screen shots of the information exposed from this code via Operator.\n\
    \nAgain, we've seen how microformats can directly enhance the meaning of already\
    \ meaningful markup in order to improve the user experience. Picture perfect progressive\
    \ enhancement!\n\n## IT'S THE FOUNDATION\n\nWhile progressive enhancement is often\
    \ discussed in terms of CSS and JavaScript, it applies equally to the markup.\
    \ As we've seen in this chapter, every time we choose a meaningful element, we\
    \ make it easier for the page to do its job by enhancing accessibility and increasing\
    \ its visibility to potential users through organic search. We've also seen how\
    \ both classification and identification can feed back into HTML, helping it become\
    \ an even more expressive language. And, as is the case with microformats, we've\
    \ even seen how the names we choose have the capacity to enhance both the semantics\
    \ and usability of the content to which they are applied.\n\nSemantic markup is\
    \ an invaluable step in the progressive enhancement continuum; in concert with\
    \ well written content, it forms the foundation upon which the entire user experience\
    \ is built.\n\n> “Design is the fundamental soul of a human-made creation that\
    \ ends up expressing itself in successive outer layers of the product or service.”\n\
    \n— STEVE JOBS\n\n## CHAPTER 3: PROGRESSIVE ENHANCEMENT WITH CSS\n\nWith the possible\
    \ exception of a few straggling websites still limping along with their font elements\
    \ and spacer GIFs, design on the web is largely accomplished using Cascading Style\
    \ Sheets (CSS). Sure, there’s Flash, SVG, and canvas, but if you are concerned\
    \ about the availability and accessibility of your content, you’re going to be\
    \ using HTML to mark up your content and CSS to style it.\n\nAs with HTML, CSS\
    \ is designed to be fault tolerant. Browsers ignore any syntax they don’t understand<sup>1,\
    \ 2</sup> and, by paying attention to how the language has evolved over time,\
    \ we can easily embrace progressive enhancement by taking advantage of this ignorance\
    \ to craft layers of design based on a given browser’s capabilities.\n\n1. http://www.w3.org/TR/2009/CR-CSS2-20090908/syndata.html#parsing-errors\n\
    2. http://www.w3.org/TR/2009/CR-CSS2-20090908/syndata.html#unsupported-values\n\
    \n## SOMETIMES AN ERROR CAN BE A GOOD THING\n\nThis isn't a CSS book, so I'm not\
    \ going to walk you through all of the options available to you in CSS. One thing\
    \ I do want to do, however, is give you an ever-so-brief recap of how CSS works\
    \ because I think it will provide you with invaluable insight into how to construct\
    \ progressive designs.\n\nAt its most fundamental, CSS is a series of human-readable\
    \ rule sets, each composed of a selector and declaration block containing a set\
    \ of property-value pairs (declarations) to be applied to any element matched\
    \ by the selector.\n\n```css\np {\n    color: red;\n    font-weight: bold;\n}\n\
    ```\n\nThe example above is about as basic as CSS gets. Anyone who's worked with\
    \ CSS before (and probably even someone who hasn't) can look at it and quickly\
    \ comprehend that it selects paragraphs and makes their text bold and red. Looking\
    \ at this example through the lens of fault tolerance, however, you'll see things\
    \ a little differently.\n\nWhen parsing a CSS file to determine how to render\
    \ a page, a browser reads each rule set and examines it. If it encounters something\
    \ it doesn't understand, it experiences something we call a \"parsing error.\"\
    \ Parsing errors are often the result of malformed CSS syntax (e.g., the misspelling\
    \ of a property name or value, a missing colon or semicolon, etc.), but they also\
    \ result when perfectly valid CSS syntax is beyond the parser's comprehension.\n\
    \nAssuming all of our curly braces, colons, and semicolons are in their proper\
    \ places, the example we just saw contains five points at which a parsing error\
    \ could occur:\n\n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_52_0.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_52_0.png)\n\
    \n- 1. the selector: `p`;\n- 2. the first property name: `color`;\n- 3. the value\
    \ of the first property: \"red\";\n- 4. the second property name: `font-weight`;\
    \ and\n- 5. the value assigned to the second property: \"bold.\"\n\nAccording\
    \ to the specification, if a browser encounters this rule set and doesn't understand\
    \ a part of it (i.e., it experiences a parsing error), the browser must ignore\
    \ the larger component of the rule set in which the parsing error occurs.\n\n\
    So, for example, if the browser did not understand the CSS color keyword \"red,\"\
    \ it would ignore the declaration `color: red`, but would still apply the remaining\
    \ declarations. The same goes for the `font-weight` keyword \"bold.\" If, however,\
    \ the browser was unable to understand the selector (`p`), it would ignore the\
    \ entire rule set, regardless of the browser's ability to comprehend the individual\
    \ declarations it contained.\n\nThe reasoning behind this is simple: We don't\
    \ know what the future of CSS may be, so it is imperative that a browser ignore\
    \ declarations and selectors it doesn't know what to do with. This facilitates\
    \ advancement of the language (just as it does for HTML) and it also makes it\
    \ possible to progressively enhance pages using CSS.\n\nFor properties, using\
    \ parsing errors to your advantage is pretty straightforward and it opens up some\
    \ awesome possibilities. Here's a quick example using CSS3's RGBa color scheme:\n\
    \n```css\np {\n  background-color: rgb(137, 224, 160);\n  background-color: rgba(180,\
    \ 246, 248, .43);\n}\n```\n\nA browser parsing this rule set would likely understand\
    \ the selector (after all, you can't get much simpler than an element selector),\
    \ so it would move on to the first background-color declaration. The background-color\
    \ property has been a part of CSS since version 1, so the browser should have\
    \ no problem there and would move on to the assigned value. Similarly, RGB-based\
    \ color values have also been a part of CSS since the beginning, so the browser\
    \ will understand that value. With the first declaration passing muster with the\
    \ parser, the browser would apply `background-color: rgb(137, 224, 160);` to all\
    \ paragraphs and the parser would move on to the second declaration.\n\nIn the\
    \ second declaration, `background-color` is redefined with a new value (per the\
    \ cascade). Obviously, as we discussed, the browser understands the property,\
    \ so it would move on to the declared value, which uses RGBa. If the browser understands\
    \ RGBa, there's no problem and the RGBa value is assigned to the background-color\
    \ property, overwriting the original RGB value. If RGBa is not supported, however,\
    \ the browser experiences a parsing error and ignores the entire declaration,\
    \ leaving all paragraphs with an RGB value for `background-color`.\n\nIn this\
    \ example, browsers that comprehend RGBa values would overwrite the `background-color`\
    \ value following the rules of the \"cascade\" (as in Cascading Style Sheets).\
    \ I'll go into the cascade a bit more thoroughly later in the chapter, but here's\
    \ a quick summary: the cascade dictates that, for equivalent properties, the last\
    \ one defined is the one rendered.\n\nThis is a pretty simple example of how we\
    \ can use CSS' fault-tolerant nature to deliver an enhanced experience to more\
    \ capable browsers. It doesn't just work at the declaration level either; you\
    \ can apply this same technique to hide entire rule sets from a particular browser\
    \ by using a more advanced selector:\n\n```css\nhtml[lang] p {\n    /* A bunch\
    \ of advanced stuff goes here */\n}\n```\n\nAny browser encountering this rule\
    \ set would parse it, starting with the selector. If the browser understands attribute-based\
    \ selection (in this case targeting any paragraph that is a descendant of an `html`\
    \ element that has a language attribute), it will continue parsing the rule set\
    \ and apply the declarations it understands. If, on the other hand, said browser\
    \ does not comprehend attribute selectors, it would experience a parsing error\
    \ and ignore the entire rule set.\n\nPerhaps the most famous example of using\
    \ this technique to selectively deliver rules to one browser over another (more\
    \ for effect than practicality) is Egor Kloos' CSS Zen Garden entry titled \"\
    Gemination.\"³\n\n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_0.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_0.png)\n\
    \n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_1.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_1.png)\n\
    \n*Figure 3.1: Gemination in IE6 (above) and IE7 (below).*\n\n3. http://www.csszengarden.com/062/"
  mdcn: "\n我们 hCalendar 拼图的最后一块是“description”，而该属性最显而易见的内容选择是文章的“main”部分：\n\n```html\n\
    <section class=\"main description\">\n  <!-- 事件概述 -->\n</section>\n```\n\n就是这样。有了微格式内容，用户现在可以相当简单地将事件直接导出到他们的日历中。\n\
    \n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_47_0.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_47_0.png)\n\
    \n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_47_1.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_47_1.png)\n\
    \n> 图 2.4：此代码通过 Operator 暴露的信息的屏幕截图。\n\n再次，我们看到了微格式如何直接增强已有意义标记的含义，从而改善用户体验。完美的渐进增强！\n\
    \n## 这是基础\n\n虽然渐进增强通常从 CSS 和 JavaScript 的角度讨论，但它同样适用于标记。正如我们在本章中所看到的，每当我们选择一个有意义的元素时，我们都通过增强可访问性和通过有机搜索增加其对潜在用户的可见性，使页面更容易完成其工作。我们还看到了分类和标识如何反馈给\
    \ HTML，帮助它成为更具表达力的语言。而且，正如微格式的情况一样，我们甚至看到了我们选择的名称如何能够增强它们所应用内容的语义和可用性。\n\n语义标记是渐进增强连续体中至关重要的一步；它与精心撰写的内容相结合，构成了整个用户体验的基础。\n\
    \n> “设计是人造创造物的根本灵魂，它最终在产品或服务连续的外部层次中表达自己。”\n\n— 史蒂夫·乔布斯\n\n## 第 3 章：CSS 的渐进增强\n\
    \n可能除了少数仍在用它们的 font 元素和 spacer GIF 勉强维持的网站外，网络设计主要使用层叠样式表 (CSS) 完成。当然，还有 Flash、SVG\
    \ 和 canvas，但如果你关心内容的可用性和可访问性，你将使用 HTML 来标记你的内容，并使用 CSS 来设置其样式。\n\n与 HTML 一样，CSS\
    \ 被设计为容错的。浏览器会忽略任何它们不理解的语法<sup>1, 2</sup>，并且通过关注语言如何随时间演变，我们可以轻松地通过利用这种“无知”来根据给定浏览器的能力构建设计层，从而拥抱渐进增强。\n\
    \n1. http://www.w3.org/TR/2009/CR-CSS2-20090908/syndata.html#parsing-errors\n\
    2. http://www.w3.org/TR/2009/CR-CSS2-20090908/syndata.html#unsupported-values\n\
    \n## 有时错误可能是件好事\n\n这不是一本 CSS 书，所以我不会带你了解 CSS 中可用的所有选项。然而，我确实想做的是给你一个关于 CSS 如何工作的简要回顾，因为我认为它将为你如何构建渐进式设计提供宝贵的见解。\n\
    \n从最基本的层面来看，CSS 是一系列人类可读的规则集，每个规则集由一个选择器和一个声明块组成，声明块包含一组应用于选择器匹配的任何元素的属性-值对（声明）。\n\
    \n```css\np {\n    color: red;\n    font-weight: bold;\n}\n```\n\n上面的例子是 CSS 最基础的用法。任何以前使用过\
    \ CSS 的人（甚至可能没使用过的人）看到它都能很快理解它选择了段落并使其文本加粗和变红。然而，从容错的角度来看这个例子，你会看到一些不同的东西。\n\n\
    在解析 CSS 文件以确定如何渲染页面时，浏览器会读取每个规则集并对其进行检查。如果遇到它不理解的东西，它会经历我们称之为“解析错误”的情况。解析错误通常是错误\
    \ CSS 语法（例如，属性名称或值的拼写错误，缺少冒号或分号等）的结果，但当完全有效的 CSS 语法超出解析器的理解范围时，也会导致解析错误。\n\n假设我们所有的花括号、冒号和分号都放在了正确的位置，我们刚刚看到的示例包含五个可能发生解析错误的点：\n\
    \n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_52_0.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_52_0.png)\n\
    \n- 1. 选择器：`p`；\n- 2. 第一个属性名称：`color`；\n- 3. 第一个属性的值：\"red\"；\n- 4. 第二个属性名称：`font-weight`；以及\n\
    - 5. 分配给第二个属性的值：\"bold.\"\n\n根据规范，如果浏览器遇到此规则集并且不理解其中的一部分（即，遇到解析错误），它必须忽略解析错误所在的较大组件（规则集或声明）。\n\
    \n因此，例如，如果浏览器不理解 CSS 颜色关键字 \"red\"，它会忽略声明 `color: red`，但仍然会应用剩余的声明。`font-weight`\
    \ 关键字 \"bold\" 也是如此。然而，如果浏览器无法理解选择器（`p`），它会忽略整个规则集，无论浏览器是否理解其中包含的各个声明。\n\n这背后的推理很简单：我们不知道\
    \ CSS 的未来会怎样，因此浏览器必须忽略它不知道如何处理的声明和选择器。这促进了语言的进步（就像 HTML 一样），也使得使用 CSS 渐进增强页面成为可能。\n\
    \n对于属性，利用解析错误相当直接，并且它开启了一些很棒的可能性。这里是使用 CSS3 RGBa 颜色方案的一个快速示例：\n\n```css\np {\n\
    \  background-color: rgb(137, 224, 160);\n  background-color: rgba(180, 246, 248,\
    \ .43);\n}\n```\n\n解析此规则集的浏览器很可能会理解选择器（毕竟，没有比元素选择器更简单的了），因此它会继续处理第一个 background-color\
    \ 声明。background-color 属性自 CSS 版本 1 以来一直是 CSS 的一部分，所以浏览器应该没有问题，然后会处理分配的值。同样，基于\
    \ RGB 的颜色值自 CSS 诞生以来也是其一部分，所以浏览器会理解该值。第一个声明通过了解析器的检查，浏览器将 `background-color: rgb(137,\
    \ 224, 160);` 应用于所有段落，解析器继续处理第二个声明。\n\n在第二个声明中，`background-color` 使用新值（根据层叠规则）重新定义。显然，正如我们讨论过的，浏览器理解该属性，因此它会继续处理声明的值，该值使用\
    \ RGBa。如果浏览器理解 RGBa，则没有问题，RGBa 值将分配给 background-color 属性，覆盖原始的 RGB 值。但是，如果浏览器不支持\
    \ RGBa，它会遇到解析错误并忽略整个声明，使所有段落的 `background-color` 保留为 RGB 值。\n\n在这个例子中，理解 RGBa\
    \ 值的浏览器会根据“层叠”（如在层叠样式表中）的规则覆盖 `background-color` 值。我将在本章后面更深入地讨论层叠，但这里有一个简要总结：层叠规定，对于等效的属性，最后定义的那个会被渲染。\n\
    \n这是一个相当简单的例子，说明我们如何利用 CSS 的容错特性为功能更强大的浏览器提供增强体验。它不仅在声明级别有效；你也可以使用同样的技术，通过使用更高级的选择器来向特定浏览器隐藏整个规则集：\n\
    \n```css\nhtml[lang] p {\n    /* 这里放一些高级的东西 */\n}\n```\n\n任何遇到此规则集的浏览器都会解析它，从选择器开始。如果浏览器理解基于属性的选择（在这种情况下，针对任何作为具有语言属性的\
    \ `html` 元素后代的段落），它将继续解析规则集并应用它理解的声明。另一方面，如果上述浏览器不理解属性选择器，它会遇到解析错误并忽略整个规则集。\n\n\
    使用这种技术向一个浏览器而不是另一个浏览器选择性地传递规则（更多是为了效果而非实用性）最著名的例子可能是 Egor Kloos 的 CSS Zen Garden\
    \ 作品，标题为“Gemination”。³\n\n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_0.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_0.png)\n\
    \n![img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_1.png](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_54_1.png)\n\
    \n*图 3.1：Gemination 在 IE6（上）和 IE7（下）中。*\n\n3. http://www.csszengarden.com/062/\n"
