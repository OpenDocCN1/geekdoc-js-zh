  md: 'The ARIA spec addresses issues of context with what are called “states.” ARIA
    states are a set of attributes that can be applied to nearly any element. Some
    are global in scope (i.e., they can be applied to any element), while others are
    specific to certain widget contexts. All are prefaced with “aria-” and they provide
    valuable information to the user about what is going on with a given element.


    Guess what? You''re already familiar with one: aria-hidden. The aria-hidden attribute
    we discussed earlier in this chapter accepts a boolean (“true” or “false”) value
    and lets the user agent or assistive technology know whether or not the content
    within should be exposed to the user. Other examples of ARIA states include aria-disabled,
    aria-expanded, aria-invalid, aria-pressed, and aria-selected.


    In terms of the tabbed interface from Figure 5.1, the states we''d likely want
    to employ would be aria-hidden for the state of the tab panels and aria-selected
    for the state of the tabs themselves.


    But the ARIA spec doesn''t stop there. In addition to state-indicative attributes,
    it also defines numerous properties that can be set on an element. Examples include
    aria-autocomplete, aria-controls, aria-label, aria-labelledby, aria-readonly,
    and aria-required. As you can see, most of the properties are meant for use with
    form controls, but a few (like aria-controls) can apply to our tabbed interface.


    As you probably suspect, the aria-controls takes an id reference for a value and
    that id should belong to the element whose contents or presence is controlled
    by the element to which the attribute is applied. In the case of the tabbed interface,
    the tab would “control” its associated tab panel (as shown in Figure 5.2). With
    the tab-to-tab-panel relationship established, it seems only fair to establish
    the relationship in the other direction as well; that''s where'
  merge: -1
