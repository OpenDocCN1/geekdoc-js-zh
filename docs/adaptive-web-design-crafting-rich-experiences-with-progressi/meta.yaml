  mdcn: "\n## 更易维护\n\n这段代码演进的下一步是使用由来已久的 `rel` 属性（你可能从第2章就记住了）将我们的内联 JavaScript 代码迁移到外部文件。这带来了两个好处：1）它赋予了链接额外的语义含义；2）它使网站维护变得容易得多，因为开发者只需修改一个\
    \ JavaScript 文件就能影响整个网站（这正是我们之前论证外部样式表优于内联使用 `style` 属性时提出的论点）。以下是新的 HTML：\n\n\
    ```\n<a rel=\"external\" href=\"http://easy-designs.net/\">\n    Easy! Designs</a>\n\
