  md: 'indicates the focal content of the document. You may recall from Chapter 2
    that I chose a section element to enclose the various articles on the page and
    that it was also the element I chose to act as the root of our hCalendar; that
    section just screams “main” to me:


    ```

    <section id="content" class="vevent" role="main">

    ```


    And with those two minor adjustments, we''ve covered every landmark role that
    seems sensible to employ on the Retreats 4 Geeks site. Not only that, but we''ve
    improved the overall accessibility of our page by providing easy ways for users
    of assistive technology to move around the document.


    # BROTHER CAN YOU SPARE A CLUE?


    In addition to providing users with a means to find their way around a document,
    the ARIA spec prescribes other helpful tools as well, not the least of which is
    its collection of widget roles and states.


    Widget roles do just what you''d expect them to: describe the role of a given
    element. These roles are generally divided into two camps: roles that provide
    a defined structure, and those that don''t. Or, more simply, containers and components.
    Containers are the elements that house the components of a given widget.


    Consider the tabbed interface shown in Figure 5.1. A tabbed interface is constructed
    from two component parts: a list of tabs and a collection of panels shown by those
    tabs. Those parts break down into three separate roles in the ARIA spec: the tabs
    themselves have a role of “tab,” the list of tabs has a role of “tablist,” and
    each panel is assigned a role of “tabpanel.” In terms of designations, both “tab”
    and “tabpanel” are considered component roles, while “tablist” is considered a
    container role (because it contains the tabs).'
