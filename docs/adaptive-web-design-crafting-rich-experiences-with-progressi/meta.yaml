  md: '# CODIFIED CONVENTIONS


    Microformats are a set of community-driven specifications for how to mark up content
    to expose semantics (and meta data) that are not available in HTML (or XHTML).
    At their essence, microformats formalize organically-developed coding conventions
    into a specification that addresses an oversight or limitation in HTML. For example,
    HTML provides no robust way to mark up contact information or events, so the community
    created microformats to fill those needs.


    The first microformat arose from a desire to express associations between individuals
    on the web and was called the XHTML Friends Network (“XFN” for short). Though
    not developed as a “microformat” (that term came later), XFN was a perfect example
    of extending the semantics of HTML with a specific goal in mind.


    Developed by Tantek Çelik, Matthew Mullenweg, and Eric Meyer, XFN makes use of
    the oft-neglected `rel` attribute. The purpose of `rel`—which you are probably
    familiar with in the context of the `link` element for inclusion of an external
    stylesheet (`rel="stylesheet"` )—is to indicate the relationship of the target
    of an anchor to the current page. The idea was simple: if I wanted to point from
    my blog to the blog of a colleague, I could employ XFN and add `rel="colleague"`
    to the link. Similarly, if I was linking to my wife’s blog, I would use `rel="friend
    co-resident spouse muse sweetheart co-worker"` because she is all of those things.<sup>11</sup>


    On its own, this additional markup does little more than provide a bit more information
    about our relationship and why I might be linking to another website, but if I
    use it for every link in my blog roll and those people, in turn, use it in theirs,
    all of a sudden we’ve created a network that is'
  merge: -1
  pgno: 36
- img_proc: true
  md: "navigable programmatically, creating myriad opportunities for data mining and\
    \ repurposing. And that's exactly what happened: XFN spread like wildfire. Software\
    \ developers integrated it into popular blogging tools (e.g., WordPress, Movable\
    \ Type) and developers at nearly every site on the “social web” (e.g., Twitter\
    \ , Flickr, Last.fm) began adorning user profile pages with the special case of\
    \ `rel=\"me\"` (used to link from one web page you control to another), enabling\
    \ tools like Google’s Social Graph to quickly build a full profile of their users\
    \ starting from a single URL.<sup>12</sup>\n\nAn example of XFN in the Retreats\
    \ 4 Geeks page can be found in the `footer`<sup>13</sup>:\n\n```\n<footer>\n \
    \ <p id=\"copyright\">&copy;2010 Retreats 4 Geeks. All\n    Rights Reserved.</p>\n\
    \n  <p>Retreats 4 Geeks is an <a rel=\"me\"\n    href=\"http://easy-designs.net/\"\
    >Easy! Designs\n    </a> venture.</p>\n</footer>\n```\n\nFrom that simple (yet\
    \ powerful) beginning, microformats have increased in number to address common\
    \ and diverse needs from marking up a person’s profile (hCard), event listings\
    \ (hCalendar), content for syndication (hAtom), and resumes (hResume), to indicating\
    \ license information\n\n> 12. More on the Social Graph API can be found at http://code.google.com/apis/socialgraph/.\
    \ Glenn Jones uses this API in the fantastic JavaScript library Ident Engine (http://identengine.com/),\
    \ which he introduced in the pages of A List Apart (http://www.alistapart.com/articles/discovering-magic/).\n\
    \n13. The `footer` element is another product of the HTML5 spec and is intended\
    \ to encapsulate \"meta\" information about an `article`, `section`, or page such\
    \ as the author, copyright information, and so forth."
