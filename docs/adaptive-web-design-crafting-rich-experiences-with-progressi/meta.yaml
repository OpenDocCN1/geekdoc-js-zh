    \n我们将首先把脚本隔离在一个匿名函数¹⁰中，这个函数在 DOM 可用后立即运行，但在图像、CSS 文件和视频等资源下载完成之前（即所谓的 onDOMReady）。这比在窗口加载（即\
    \ window.onload）时运行脚本使页面响应更快。在本例的剩余部分，所有代码都将被封装在此函数内：\n\n```javascript\n$(function(){\n\
    \  // 令人兴奋的内容将放在这里\n});\n```\n\n接下来，我们创建此脚本运行所需的变量。通过一次性实例化所有变量，我们将减少 `var` 语句的数量（这有助于代码压缩）。¹¹\n\
