    这是一次很棒的体验，因为她身高不够，无法乘坐“旋转咖啡杯”。同样，使用“不合适”浏览器的用户在访问网站内容时，很可能也会遇到问题（甚至报错），如果他们还能访问的话。


    相比之下，按照渐进增强理念构建的网站，将可以在任何设备上、使用任何浏览器被任何人访问。使用像 Lynx 这样的纯文本浏览器的用户，其体验可能无法与使用最新版
    Safari 浏览器的用户完全相同，但关键在于她将获得积极的体验，而非毫无体验。网站的内容对她来说将是可用的，尽管可能缺少一些花哨的功能——这在优雅降级方案中是无法保证的。


    虽然理念不同，但从实际角度来看，渐进增强和优雅降级可能看起来非常相似，这容易让人困惑。为了厘清两者的区别，我喜欢将这两种理念的关系简化为某种类似标准化测试的逻辑：所有使用渐进增强创建的体验，在旧版浏览器中都会优雅降级；但并非所有按照优雅降级理念构建的体验都经过了渐进增强。


    ## 极限？没有极限。


    在优雅降级的鼎盛时期，网站变得非常像我之前提到的游乐场：“你必须达到这个高度才能乘坐。”网络上（而且遗憾的是，至今仍然）充斥着“建议在 Netscape Navigator
    4 中浏览”之类的网站。随着渐进增强以及整个 Web 标准的兴起，我们逐渐摒弃了这种做法。但随着越来越多的网站开始采用一种名为 Ajax 的 JavaScript
    技术，这种现象再次抬头，许多网站开始要求启用 JavaScript，甚至要求特定的浏览器（及浏览器版本）才能查看其内容。这堪称网络自身的 B 级电影续集：那些我们以为已经抛弃的、会破坏浏览器、对用户不友好的方法，又卷土重来了。


    随着时间的推移，对 Ajax 的狂热逐渐消退，我们开始按照渐进增强的理念构建（在某些情况下是重建）基于 Ajax 的网站。接着，苹果公司的 HTML5 展示平台横空出世，带来了炫酷的
    CSS 过渡和动画效果。² 当我们擦干桌上（因兴奋而流下）的口水后，许多人开始将这些闪亮的新玩具融入我们的工作，要么是因为我们渴望尝试这些新特性，要么是应客户的要求。结果，开始出现一些网站，它们要求用户必须拥有现代
    Webkit 变体³ 才能运行。（该死，那近 80% 不包含此技术的浏览器就被排除在外了。）


    当意识到要求使用并非普遍可用的技术与渐进增强背道而驰后，一些网页设计师和开发者宣称这种理念“具有局限性”，并开始重新倒向优雅降级。他们觉得，渐进增强迫使他们专注于服务于旧版浏览器，坦率地说，与这些浏览器打交道一点也不有趣。然而，他们未能意识到的是，限制他们的并非渐进增强理念本身；而是他们自己对该理念的理解。


    > 2. http://www.apple.com/html5/

    >

    > 3. Webkit 是驱动许多浏览器和应用程序的引擎。它具有出色的 CSS 支持，并且支持许多其他浏览器尚未匹敌的炫酷 CSS 功能（例如基于 CSS
    的动画）。Webkit 可用于 Apple 的 Safari、Google 的 Chrome 和 Android 浏览器、Symbian S60 浏览器、Shiira、iCab、OmniWeb、Epiphany
    以及其他众多浏览器。它构成了 Palm 的 WebOS 操作系统的基础，并已集成到众多 Adobe 产品中，包括其 Adobe Integrated Runtime
    (AIR) 和 CS5 应用程序套件。


    渐进增强与浏览器无关。它关乎于通过让用户在没有技术限制的情况下访问内容，来精心打造体验。渐进增强并不要求你在不同浏览器中提供完全相同的体验，也不禁止你使用最新最好的技术；它只是要求你以智能的方式、逐层应用技术，来精心打造出色的体验，以此尊重你的内容（和你的用户）。浏览器和技术会来来去去。只要你对自己的选择保持明智，并且不忽视你的用户，将渐进增强与你渴望创新并在浏览器中实现非凡创意的雄心结合起来是完全可能的。


    ## 渐进增强 = 卓越的客户服务


    想象一下，你是一家高档餐厅的服务员。你的工作（和你的小费）取决于你对细节的关注以及你服务顾客的水平。衡量你专注度的一个标准是，你在为顾客的水杯续水前，会让水杯空到什么程度。一个不够专注的服务员可能会让杯子空上几分钟才去续水。稍微上心一点的，可能会等到水位降到一半才去添满。而一个擅长满足顾客饮品需求的优秀服务员，不仅会确保水位永远不会降得那么低，甚至能在顾客毫无察觉的情况下完成续水。你认为哪位顾客会最满意地离开？而且，如果仅仅从饮水满足度来评判，你认为谁最可能得到最高小费？


    作为网页设计师和开发者，我们应该努力像那位专注、体贴的服务员一样出色地完成工作，但这并非易事。就像服务员无法预知进门的顾客是否需要频繁续水一样，当用户来到我们的网站时，我们也无法确知他们的特定需求。相反，我们必须主动去满足这些需求。如果我们真的做得好，甚至可以做到让顾客意识不到我们为他们做了特别考虑。值得庆幸的是，通过渐进增强的以用户和内容为中心的方法（与优雅降级的以最新浏览器为中心的方法相对），这一点很容易实现。


    ## 迎难而上


    从渐进增强的角度处理项目时，你的核心焦点是内容，一切都建立在此基础之上。这是一种分层的方法，它通过关注页面被访问时的上下文（结合浏览器的能力，以及在较小程度上，其运行的媒介），并相应地调整用户体验，来满足用户的“需求”。


    基准体验始终以文本形式呈现。没有特定技术塑造这一层，其成功与否完全依赖于文案撰写者的技能。清晰、优质的文案具有广泛的设备支持，对于改善用户对内容的可访问性大有裨益。此外，无论
    HTML 语言如何随时间演变，浏览器必须容错处理 HTML 语法的这一要求确保了，无论如何，它所描述的内容始终以其最基本的形式（即文本）可用。


    第二层体验来自 HTML 语言本身的语义。页面上使用的各种元素和属性为文字内容提供了额外的意义和上下文。它们标示了诸如强调等重要概念，并提供补充信息，例如引用的出处或陌生短语的含义。


    ## 为用户着想，而非为浏览器着想 14


    ![图 1.3：渐进增强示意图](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_21_0.png)


    第三层体验是视听体验，通过使用 CSS 以及内联图像、音频和视频来表达。与 HTML 一样，浏览器对 CSS 的实现也必然是容错的，因此浏览器会忽略它们不理解的内容；这一事实使得
    CSS 的渐进增强成为可能。


    第四层体验是交互体验。在标准世界中，这一层几乎完全依赖于 JavaScript，尽管网络上的交互也可以通过其他技术实现，例如 Flash 甚至 Java Applet。


    最后一层体验是通过增强语义以及 Web 无障碍倡议 (WAI) 的无障碍富互联网应用 (WAI-ARIA) 规范中包含的最佳实践来实现的。这些对页面的增强，承接了
    HTML 规范传统上留下的空白（尽管 HTML5 确实包含了一些增强的 ARIA 语义在其词汇表中）。

