  md: "Let's consider this component from a semantician's point of view, starting\
    \ with the logo. The Retreats 4 Geeks logo is an image, so we should use an `img`\
    \ element to mark it up.² It's also pretty important because it provides a context\
    \ for the entire page, so it should be wrapped in an `h1`, an element reserved\
    \ for the most important content on a page:\n\n```\n<h1><img src=\"i/logo.png\"\
    /></h1>\n```\n\nThough the example page is written using HTML5, I've always been\
    \ more comfortable with the XML serialization of the language, so I've chosen\
    \ to stick with that syntax (as evidenced by the trailing slash on the `img` element).\
    \ It is more a matter of preference than requirement.\n\nMoving on to the navigation,\
    \ we're presenting a list of links, so it should be marked up as such. As the\
    \ order of the links corresponds to the order of the sections on the page, the\
    \ list should probably be of the ordered variety (`ol`). Each link gets placed\
    \ in a list item (`li`) and wrapped in an anchor element (`a`):\n\n```\n<ol>\n\
    \  <li><a href=\"#details\">Details</a></li>\n  <li><a href=\"#schedule\">Schedule</a></li>\n\
    \  <li><a href=\"#instructors\">Instructors</a></li>\n  <li><a href=\"#lodging\"\
    >Lodging</a></li>\n  <li><a href=\"#location\">Location</a></li>\n</ol>\n```\n\
    \nUp until this point, we've made the obvious choices with regard to markup, employing\
    \ semantics we've had in HTML since the beginning. Just over a year ago, we would\
    \ have likely stopped here and considered the header complete, but HTML5 gives\
    \ us the opportunity to improve both the semantic value and the accessibility\
    \ of this content.\n\n> ² Yeah, I know, you could also use the `object` element\
    \ or make it text and use CSS to replace it with an image, but we're going for\
    \ simplicity here."
  merge: -1
