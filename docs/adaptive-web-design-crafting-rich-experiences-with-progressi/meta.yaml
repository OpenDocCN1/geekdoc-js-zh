  md: "This concept became known as “event delegation” because a single event handler\
    \ could interpret events and send out orders based on the element that triggered\
    \ that event. Here’s a concise rewrite of the previous example that uses event\
    \ delegation:\n\n```\ndocument.body.onclick = function( e ) {\n  // even out the\
    \ event models\n  e = ( e ) ? e : event;\n  var el = e.target || e.srcElement,\
    \ rel;\n  // external links\n  rel = el.getAttribute( 'rel' );\n  if ( el.nodeName.toLowerCase()\
    \ == 'a' &&\n       rel && rel.match( /\\bexternal\\b/ ) ) {\n    newWin( el.href\
    \ );\n    // cancel the default action\n    if (e.preventDefault) {\n      e.preventDefault();\n\
    \    } else {\n      e.returnValue = false;\n    }\n  }\n};\n```\n\nThis code\
    \ block assigns an event handler to the `onclick` event of the body element, establishing\
    \ the listener; within the listener, it determines the target element (the one\
    \ that was clicked) and then checks to make sure it’s an anchor element (a) that\
    \ has a `rel` attribute containing the string “external”; if the element meets\
    \ all of those requirements, the `newWin` function is called and the event’s default\
    \ action is canceled.\n\nThis example, while specific, demonstrates why we must\
    \ continue to evolve our approach to JavaScript-based interactions. Improving\
    \ our JavaScript comprehension provides direct benefits for progressive enhancement\
    \ by helping us make our code smarter and more unobtrusive, but it also helps\
    \ us in terms of maintainability and performance."
