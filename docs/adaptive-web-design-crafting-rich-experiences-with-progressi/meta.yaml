  md: 'two attributes were not formally introduced into the HTML lexicon until HTML
    4.0, but were implemented in browsers around the same time as Cascading Style
    Sheet (CSS) support was added. And CSS, of course, brought us two simple selectors
    that targeted these attributes explicitly, causing some unfortunate confusion
    over the intended use of `class` and `id` from the get-go.


    For years, nearly every web developer working with CSS thought the correlation
    between the attributes and the selectors was intentional, believing that `id`
    and `class` were intended purely for use with style sheets. You can hardly blame
    us though, CSS Level 1 did not provide many mechanisms for selecting elements,
    so it made sense that the `class` selector (e.g., `.ul.menu`) and the `id` selector
    (e.g., `div#content`) would have been introduced (along with their corresponding
    attributes) for the purposes of both the general and specific application of style,
    respectively.⁷


    Thankfully, we now understand how the `class` and `id` attributes were meant to
    operate. The `class` attribute was introduced specifically to address the limited
    set of elements within the HTML lexicon:


    > As time goes by, people’s expectations change, and more will be demanded of
    HTML. One manifestation of this is the pressure to add yet more tags. HTML 3.0
    introduces a means for subclassing elements in an open-ended way. This can be
    used to distinguish the role of a paragraph element as being a couplet in a stansa
    [sic], or a mathematical term as being a tensor. This ability to make fresh distinctions
    can be exploited to impart distinct rendering styles or to support richer search
    mechanisms, without further complicating the HTML document format itself.⁸


    7. And the HTML 3 draft did allow for this use, among others. The draft is available
    at http://www.w3.org/MarkUp/html3/html3.txt.

    8. From the "Scalability" section of the HTML 3 draft (see footnote 7).'
