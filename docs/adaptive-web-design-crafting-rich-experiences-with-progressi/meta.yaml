    This is, of course, an oversimplification of progressive enhancement, but it gives
    you a general sense of how it works. Technologies applied as layers—HTML, then
    HTML & CSS, then HTML, CSS & JavaScript—can create different experiences, each
    one equally valid (and tasty). And at the core of it all is the nut: great content.


