  md: "# More maintainable\n\nThe next step in the evolution of this code involved\
    \ using the age-old `rel` attribute (which you’ll recall from Chapter 2) to migrate\
    \ our inline JavaScript code to an external file. This provided two benefits:\
    \ 1) it gave an additional semantic meaning to the link and 2) it made maintaining\
    \ websites much easier because developers could change a single JavaScript file\
    \ and affect the entire site (which is the exact argument we made for external\
    \ stylesheets over inline use of the `style` attribute). Here’s the new HTML:\n\
    \n```\n<a rel=\"external\" href=\"http://easy-designs.net/\">\n    Easy! Designs</a>\n\
    ```\n\nFrom there, it’s fairly simple to apply the click event to this and any\
    \ other “external” links:\n\n```\nvar links = document.getElementsByTagName( 'a'\
    \ ),\n    rel, i = links.length;\nwhile ( i-- ) {\n    rel = links[i].getAttribute('rel');\n\
    \    if ( rel && rel.match( /\\bexternal\\b/ ) ) {\n        links[i].onclick =\
    \ function(){\n            newWin( this.href );\n            return false;\n \
    \       };\n    }\n}\n```\n\nIf all those “ifs” and “whiles” are Greek to you,\
    \ here’s a quick summary of what the script does: it collects all of the links\
    \ on the page and loops through them (in reverse order which, oddly enough, is\
    \ a bit faster than going forward); and if the link has a `rel` attribute and\
    \ its value contains the text “external,” the link’s `onclick` event is assigned\
    \ an anonymous function that calls a function named `newWin` (passing it the value\
    \ of the link’s `href` attribute just like in the previous example) before canceling\
    \ the click’s default action by returning false."
