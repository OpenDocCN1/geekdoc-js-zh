    \ or by explicitly setting each and every property\nyou want to control within\
    \ your widget.\n\n# PLANNING AND RESTRAINT\n\nMake no mistake, progressive enhancement\
    \ with JavaScript\nrequires considerably more effort than it does with CSS or\n\
    HTML. With a bit of thoughtful reflection and consideration\nof the numerous factors\
    \ that affect the web experience,\nhowever, it quickly becomes second nature.\
    \ And, when in\ndoubt, you can always come back to the three maxims:\n\n+   1.\
    \ Make sure all content is accessible and all necessary tasks can be\ncompleted\
    \ without JavaScript turned on.\n2. Use JavaScript to generate any additional\
    \ markup it needs.\n3. Apply no style before its time.\n\nArmed with a solid understanding\
    \ of how to best wield the\npower of JavaScript, you're sure to make smart decisions\
    \ and\nbuild even more usable sites."
