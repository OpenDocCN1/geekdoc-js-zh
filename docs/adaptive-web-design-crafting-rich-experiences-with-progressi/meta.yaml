  md: "You probably noticed that the `section` has an `h1` as its title. Don’t worry:\
    \ in HTML5, each `section` creates a new context within which it’s okay to restart\
    \ the headings at `h1`. It takes a little getting used to at first, I know, but\
    \ it makes sense and addresses the limited number of heading levels quite well.¹\n\
    \nIf you’ve got keen eyes, you’ve likely already identified exactly where each\
    \ of the hCard `classes` should be applied, but I’ll step through each one, just\
    \ to be sure, starting with the easiest one: “vcard.” This classification needs\
    \ to be applied to the containing element, in this case, the `section`:\n\n```\n\
    <section id=\"aaron-gustafson\" class=\"vcard\">\n```\n\nThe next obvious one\
    \ is “fn,” which should wrap my name. As my name is already wrapped in an `h1`,\
    \ we can apply a `class` of “fn” to that element to indicate the text contained\
    \ within the element is my name.\n\n```\n<h1 class=\"fn\">Aaron Gustafson</h1>\n\
    ```\n\nNext, we can add a `class` of “url” to the “Easy! Designs” link, denoting\
    \ that it points to a website I control:\n\n```\n... <a class=\"url\" rel=\"external\"\
    \ href=\"http://easy-designs.net\">Easy! Designs</a>, ...\n```\n\nContinuing down\
    \ the list, we can apply “photo” to the image of me, which is contained in a `figure`\
    \ element. HTML5 introduced the `figure` element to contain a discrete chunk of\
    \ content—usually an image or graphic with an optional caption (`figcaption`)—that\
    \ can stand on its own or be removed from a document without altering its meaning:\n\
    \n```\n<figure>\n  <img class=\"photo\" src=\"i/aaron-gustafson.jpg\"\n    alt=\"\
    \"/>\n</figure>\n```\n\n19. http://www.whatwg.org/specs/web-apps/current-work/multipage/content-models.html#sectioning-content"
  merge: -1
  pgno: 41
- img_proc: true
  md: "We need to add the two final classes, “org” and “role” to this markup in the\
    \ final paragraph of my bio, but the content presents us with a bit of a conundrum\
    \ as there are several roles and organizations mentioned. Which one should we\
    \ use? Is it okay to include multiple organizations and roles?\n\nThere is nothing\
    \ in the hCard spec that restricts an hCard to a singular organization and role,\
    \ but, in practice, few microformats parsers will expose anything beyond the first\
    \ one encountered because address book software doesn’t typically allow for multiple\
    \ organizations and roles. For that reason, we’ll simply add the classification\
    \ to my primary function: Group Manager of the Web Standards Project.\n\nThe “org”\
    \ bit is easy because “Web Standards Project” is already contained in an element.\
    \ My role there, however, is part of a larger text string and is not contained\
    \ within its own element. To apply the classification to my role only, we have\
    \ to make use of an element bereft of semantic meaning, such as <b>²⁰</b>\n\n\
    ```\n... He is <b class=\"role\">Group Manager</b> of the <a class=\"org\" href=\"\
    http://webstandards.org\">Web Standards Project (WaSP)</a> ...\n```\n\nViewed\
    \ all at once, you can see that the adjustments to incorporate the hCard microformat\
    \ are quite minimal:\n\n```\n<section id=\"aaron-gustafson\" class=\"vcard\">\n\
    \  <figure>\n    <img class=\"photo\" src=\"/events/2011/html5-css3/i/aaron-gustafson.jpg\"\
    \ alt=\"\"/>\n  </figure>\n```\n\n20. What? <b>b</b>? Really? Why not <code>span</code>?\
    \ Well, in HTML5, the <code>b</code> element has been brought back for the explicit\
    \ purpose of representing “a span of text to be stylistically offset from the\
    \ normal prose without conveying any extra importance.” While you can certainly\
    \ use the <code>span</code> element, <code>b</code> is a more appropriate (and\
    \ shorter) alternative."
  merge: -1
