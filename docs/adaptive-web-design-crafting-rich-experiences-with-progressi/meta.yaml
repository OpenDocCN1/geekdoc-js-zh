  md: "# THE PROGRESSIVE ENHANCEMENT CHECKLIST\n\n# Content & HTML\n\n+   - Author\
    \ copy that is well-written and makes sense when read aloud\n  This is the baseline\
    \ experience for every user and it matters.\n\n+   - Choose semantically-appropriate\
    \ elements\n  Using the existing semantics in HTML does wonders for accessibility\
    \ (and search engine optimization).\n\n+   - Use Microformats to fortify HTML's\
    \ gaps\n  Microformats are extensions to the HTML lexicon and are supported by\
    \ numerous browsers and several search engines.\n\n+   - Use classification to\
    \ group elements serving the same function\n  Classification (i.e., using the\
    \ class attribute) helps convey meaning about elements when HTML's inherent semantics\
    \ fail you and no microformats fit the bill.\n\n+   - Identify landmark elements\n\
    \  Identification (i.e., using the id attribute) is a great way to give context\
    \ to specific regions of a page or specific instances of a classified element.\n\
    \n# CSS\n\n+   - Double check your compound selectors\n  Mixing selectors of vastly\
    \ different complexity can cause issues when a browser doesn't understand one\
    \ of them: the entire rule set will be ignored. If your intent is to hide the\
    \ rule set from older browsers, however, this can be a useful tactic."
  merge: -1
  pgno: 127
- img_proc: true
  md: '+   □ Organize your CSS rules with the cascade in mind

    Order matters and proper organization of your style rules can help you create
    a progressive design and make your CSS more maintainable.


    +   □ Hide groups of advanced CSS rule sets from older browsers

    One of the most powerful tools available in CSS for hiding rule sets *en masse*
    is by using `@media` blocks.


    +   □ Use Conditional Comments to handle IE issues

    Older versions of IE are notoriously buggy and Conditional Comments are the best
    way to provide CSS and JavaScript patches to specific versions of IE. They work
    best in the “trickle-down” pattern.


    +   □ Make sure you''ve accounted for alternate media and contexts

    Media assignment and media queries can be used to deliver tailored layouts and
    experiences based on the user''s context.


    # JavaScript


    +   □ Ensure all JavaScript is “unobtrusive”

    Scripts should be maintained as far from the markup as possible and should be
    as generic as possible. This allows you to re-factor them independently. Your
    JavaScripts should not be tied to specific markup, but be flexible enough to adapt
    as your pages evolve.


    +   □ Make sure all content is accessible and all necessary tasks can be completed
    without JavaScript turned on

    You can''t rely on JavaScript. Period. If you want to enhance with JavaScript,
    follow the Hijax pattern.


    +   □ Use JavaScript to generate any additional markup it needs

    JavaScript is great at manipulating the DOM, so there''s no reason to hard-code
    markup into a page that is only there for your script''s benefit.'
  merge: -1
