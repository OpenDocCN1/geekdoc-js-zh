    \ I'll explain what's happening so you don't have to decipher it on your own.\n\
    \nWe'll begin by isolating the script in an anonymous function¹⁰ that runs as\
    \ soon as the DOM is available, but before assets like images, CSS files, and\
    \ videos have been downloaded (a.k.a. onDOMReady). This makes the page more responsive\
    \ than running a script when the window loads (a.k.a. window.onload). For the\
    \ remainder of this example, all of the code will be sequestered within this function:\n\
    \n```\n$(function(){\n  // Exciting stuff will go here\n});\n```\n\nNext, we create\
    \ the variables we need for this script to work. By instantiating them all at\
    \ once, we'll reduce the number of var statements (which helps with minification).¹¹\n\
    \n```\nvar\n$window   = $(window),        // reference the window\n$old_nav  =\
    \ $('#top nav > *'), // get the navigation\n$links    = $old_nav.find('a'),  \
