  md: "```\n/* =Color */\n.frame .inner {\n  /* colors for every medium */\n}\n\n\
    @media screen {\n  .frame .inner {\n    /* screen-only colors */\n  }\n}\n```\n\
    \nWith our faceted framework in place, it becomes quite simple to introduce additional\
    \ modules as the need arises. For example, effects:\n\n```\n/* =Color */\na:link,\
    \ a:visited {\n  color: rgb(180, 49, 25);\n}\n\na:hover {\n  color: rgb(235, 123,\
    \ 35);\n}\n/* ... */\n\n/* =Effects */\n@media screen {\n  a {\n    transition-duration:\
    \ .5s;\n  }\n}\n```\n\nNow that you have a pretty solid understanding of how to\
    \ wield CSS’s inherent fault tolerance for the betterment of the browsing experience,\
    \ let’s delve a little deeper and layer on some additional enhancements."
