    injected into the page with a link marked `rel="external"`, it wouldn''t have
    our custom function assigned as an `onclick` event handler. This is because our
    script was likely run when the page loaded (`window.onload()`) prior to the new
    link being injected via Ajax.


    This presented a tough problem to be sure. In this scenario, it was possible that
    two links that should act the same would actually act in completely different
    ways. Can you say usability issue?


    6. `XMLHttpRequest` is the technology that we use to make requests to the server
    and receive information without requiring the browser to refresh or reload the
    page. It was invented at Microsoft for Outlook Web Access and debuted in IE5,
    but it has been adopted by every other browser and is currently being standardized
    at the W3C. `XMLHttpRequest` is the backbone of Ajax (Asynchronous JavaScript
    and XML), but despite its namesake, it can communicate by means other than XML.
    The "A" in Ajax stands for "asynchronous" because this means of communication
    doesn''t require the user to wait for the response; she can continue interacting
    with the page while the script loads more information from the server.'
  - '[PAGE 87]


    To address this issue, some folks re-executed the script whenever an Ajax-based
    HTML injection was completed. It seemed like a good idea, but calling the same
    function over and over again slowed the browser down considerably because it had
    to traverse all of the links on the page each and every time.


    Then Christian Heilmann reminded us that any event triggered on a particular element
    actually traverses the DOM tree from the root node (html) to that element and
    back again in the event capturing and bubbling phases, respectively.⁷ That means
    the “click” event on a link is actually executed on every element between the
    root node and the link itself... twice⁸ (see Figure 4.2). Listening for the event
    on an element further up the DOM tree is not only more efficient (because you
    could assign a single event handler rather than hundreds), but it made it possible
    to trigger actions on dynamic content, thereby helping us overcome the potential
    usability issue where similar links behaved differently.


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_87_0.png)


    Figure 4.2: Event capturing and bubbling.


    +   7. http://icant.co.uk/sandbox/eventdelegation/

    8. Ok, not technically twice in every browser. The Microsoft event model, the
    one implemented in all versions of IE prior to 9, only supports the bubbling phase
    of an event. The standard W3C event model supports both event capturing and event
    bubbling.'
  - "[PAGE 88]\n\nThis concept became known as “event delegation” because a single\
