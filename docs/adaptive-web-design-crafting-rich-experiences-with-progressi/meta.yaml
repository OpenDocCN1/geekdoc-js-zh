  raw:
  - '[PAGE 11]


    Another interesting aspect of fault tolerance is how it allows for evolution.
    Again, looking to nature, you can see this in areas where climate or other environmental
    factors have caused enough of a change that organisms are forced to adapt, move,
    or die.


    In 1977, the Galapagos Islands experienced a drought that drastically reduced
    the availability of the small seeds that supported the islands'' finch population.<sup>1</sup>
    Eighty-five percent of the islands'' finches were wiped out due to starvation.
    Oddly enough, it was the larger birds that survived. Why? Because they possessed
    large beaks capable of cracking the larger, harder seeds that were available.
    In the absence of a drought, the larger finches possessed no distinct advantage
    over their smaller relatives, but when the environment changed, they were perfectly
    positioned to take advantage of the situation and not only survived the drought,
    but passed their genes along to the next generation of finches which, as you''d
    expect, tended to be larger.


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_11_0.png)


    *Figure 1.1: The varied beaks of Galapagos finches (a.k.a. Darwin''s Finches,
    Geospiza fortis) as seen in The Zoology of the Voyage of H.M.S. Beagle, by John
    Gould.*'
  - '[PAGE 12]


    HTML and CSS have a lot in common with the Galapagos finches. Both were designed
    to be “forward compatible,” meaning everything we write today will work tomorrow
    and next year and in ten years. They are, in a sense, the perfect finch: designed
    to thrive no matter how the browsing environment itself changes.


    These languages were designed to evolve over time, so web browsers were instructed
    to play by the rules of fault tolerance and ignore anything they didn’t understand.
    This gives these languages room to grow and adapt without ever reaching a point
    where the content they ensconce and style would no longer be readable or run the
    risk of causing a browser to crash. Fault tolerance makes it possible to browse
    an HTML5-driven website in Lynx and allows us to experiment with CSS3 features
    without worrying about breaking Internet Explorer 6.


    Understanding fault tolerance is the key to understanding progressive enhancement.
    Fault tolerance is the reason progressive enhancement works and makes it possible
    to ensure all content delivered on the web is accessible and available to everyone.


    As fault tolerance has been a component of HTML and CSS since the beginning, you’d
    think we (as web professionals) would have recognized their importance and value
    when building our websites. Unfortunately, that wasn’t always the case.


    # “GRACEFUL” MISSTEPS


    For nearly a decade after the creation of the web, the medium evolved rapidly.
    First, the National Center for Supercomputing Applications at the University of
    Illinois—NCSA for short—gave us Mosaic, the first graphical browser, and HTML
    got the img element. Then came audio. Then video. Then interaction. It was a challenge
    just to keep up with the'
  - '[PAGE 13]


    rapidly-evolving technology and in our rush to keep up, we lost sight of fault
    tolerance and began building according to the latest fashion. Some of our sites
    consisted entirely of full-page image maps layered atop elegantly designed JPEGs.
    Others became shrines to Macromedia''s Flash and Director. Few were usable and
    even fewer were accessible.


    This era gave rise to the development philosophy known as "graceful degradation."


    Graceful degradation was the philosophical equivalent of fault tolerance''s superficial,
    image-obsessed sister who is fixated on the latest fashions and only hangs out
    with the cool kids. As applied to the web, graceful degradation amounted to giving
    the latest and greatest browsers the experience of a full-course meal, while tossing
    a few scraps to the sad folk unfortunate enough to be using an older or less-capable
    browser.


    During the heyday of graceful degradation, we focused on making sure our site
    worked in modern browsers with the greatest market share. Testing for support
    in older browsers, if we did it at all, was relegated to the end of the list of
    priorities.


    Our reasoning was simple: HTML and CSS are fault tolerant, so at least the user
    will get something, which (of course) ignored the fact that JavaScript, like other
    programming languages, is not fault tolerant (i.e., if you try to use a method
    that doesn''t exist, it throws an error); instead, the scripts and applications
    using JavaScript must be written such that they can either recover from an error
    (perhaps by trying an alternate method of execution) or predict the potential
    for an error and exit before it''s experienced.


    But hardly anyone was doing that because our focus was ever forward as we looked
    for the next shiny toy we could play with. We assumed that older browsers would
    have an inferior experience, so we made the justification that it wasn''t worth
    spending the time to ensure it was at least a decent, error-free'
  - '[PAGE 14]


    one. Sure, we''d address the most egregious errors, but beyond that, users were
    left to fend for themselves. (Sadly, some of us even went so far as to actively
    block browsers we didn''t want to bother supporting.)


    # THE RISE OF TOLERANCE


    Over time, smart folks working on the web began to realize that graceful degradation''s
    emphasis on image over substance was all wrong. They saw that graceful degradation
    was directly undermining both content availability and accessibility. These designers
    and developers understood that the web was intended for the distribution and consumption
    of content—words, images, video, etc.—and began basing all of their markup, style,
    and interaction decisions on how each choice would affect the availability of
    that content.


    By refocusing their efforts, developers began to embrace the fault tolerant nature
    of HTML and CSS as well as JavaScript-based feature detection to enrich a user''s
    experience. They began to realize that a great experience needn''t be an all-or-almost-nothing
    proposition (as was the case under graceful degradation), but instead web technologies
    could be applied as layers that would build upon one another to create richer
    experiences and interactions; Steve Champeon of the Web Standards Project perfectly
    captured the essence of this philosophy when he christened it "progressive enhancement."¹


    # Tasty at any level


    One analogy I like to use for progressive enhancement is the peanut M&M. At the
    center of a peanut M&M is, well, the peanut. The peanut itself is a rich source
    of protein and fat; a


