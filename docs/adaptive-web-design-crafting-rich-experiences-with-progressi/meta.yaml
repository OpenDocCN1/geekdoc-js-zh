    # 关于作者


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_134_0.png)


    Aaron 在互联网领域工作了近15年，在此期间，他培养了对网页标准的热爱，并对网站策略与架构、界面设计以及多种语言（包括 XHTML、CSS、JavaScript
    和 PHP）有了深入的了解。Aaron 和他的妻子 Kelly McCarthy 拥有 Easy! Designs，这是一家位于田纳西州查塔努加的精品网络咨询公司。当不埋首于代码时，Aaron
    通常会宣扬他的发现，并与该领域的其他人分享他的知识和热情。


    Aaron 曾在*纽约时报*、Gartner 和美国环境保护署（以及其他机构）培训过专业人员，并在世界级的网络会议上发表演讲，如 An Event Apart
    和 Web Directions。他是网页标准项目（WaSP）的集团经理，并担任万维网联盟开放网络教育联盟（OWEA）的受邀专家。他创建了 eCSSStender，担任《*A
    List Apart*》的技术编辑，是《*.net Magazine*》的特约撰稿人，并通过他的技术写作和编辑工作贡献了大量内容。


    # 关于 EASY READERS


    Easy! Readers 书籍是精心编撰的出版物，探索了资深和有抱负的网络专业人士的最佳实践和网页标准。由权威的网络从业者 Aaron Gustafson
    和同行专家撰写的一系列书籍，探讨了打造顶级网站的整体方法。


    Easy! Readers 专注于可用性和可访问性，其使命是引导读者了解各种主题的起源、哲学及其在网页标准中的实际应用。因为网络是一个不断变化的媒介，其范围、受众和平台持续发展和增长，我们致力于为您提供动态且相关的内容。


    Easy Readers 书籍可批量购买用于教育用途。如需更多信息，请联系我们的教育销售部门：education@easy-readers.net。


    # 版权页


    正文采用 Fred Smeijers 设计的 Fresco Plus 及其配套字体 Fresco Sans Plus。书籍和章节标题采用 Jackson Burke
    设计的 Trade Gothic。代码采用 Albert-Jan Pool 设计的 FF OCR F。


    我们支持本地企业与可持续实践。本书由田纳西州查塔努加的 Starkey Printing Company 印刷。所用纸张——100磅 Chorus Art
    Silk 封面纸和80磅 Chorus Art Silk 内页纸——经过 FSC 认证，由50%回收材料（30%为消费后回收）制成。


    在这本简短的书中，Aaron Gustafson 记录了渐进增强的起源、哲学和机制，并揭示了您可以运用 HTML、CSS 和 JavaScript 应用渐进增强原理的无数实用方法。通过理解渐进增强及其正确应用方法，网络从业者可以打造服务于用户（而非浏览器）的体验，使用户能够不受技术限制地获取内容。


    > “《自适应网页设计》不仅提供了我所读过的关于渐进增强最清晰、最优美的解释，还通过 Aaron 温暖友好的写作风格，将大量实用知识直接灌输到你的大脑皮层。”

    — **Jeremy Keith**，《面向网页设计师的 HTML5》作者


    > “终于。一本以完美的理论与实践平衡来解释渐进增强的著作。”

    — **Dan Cederholm**，《面向网页设计师的 CSS3》作者


