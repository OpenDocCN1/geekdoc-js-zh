    \ issues with IE7 and earlier, but as the design requires that we use some IE-specific\
    \ filters, it made sense to only have to write them once."
  - '[PAGE 70]


    # # BEYOND THE BASICS


    The web is unlike any other medium we’ve encountered thus far. It isn’t print,
    television, radio, a video game, a kiosk, or an application, but it functions
    as a hybrid of all of these things and more. Realizing this, the W3C added the
    ability to target styles to a specific medium. We took advantage of that capability
    earlier in an `@media` block, but you’re probably more familiar with using media
    declarations with linked or embedded stylesheets (using the `media` attribute)
    or, possibly, as a suffix to `@import` statements.


    The W3C maintains the list of approved media types, but is open to adding to it
    as technology evolves. Currently, the list addresses CSS’ application on the computer
    screen, in print, on televisions, on hand held devices, and in assistant contexts
    such as screen readers, braille printers, and touch feedback devices. Without
    a specific media designation, the browser assumes a media type of “screen.”


    At their most basic, media assignments use a single media designation, but as
    with selectors, multiple media assignments can be combined using a comma (which
    acts as an implicit “or”). In the following example, `main.css` would be applied
    for both “print” and “screen” media types:


    ```

    <link rel="stylesheet" href="main.css" media="screen, print"/>

    ```


    Media assignments are fault tolerant, though the application of fault tolerance
    for media assignments is quite different from what is applied to selectors (not
    that that’s confusing at all): if unknown media types in a comma-separated series'
- md: "are encountered, *they are simply ignored* and the known media types remain\
    \ honored.\n\nUnfortunately, in the case of media declarations on `@import`, IE\
    \ versions prior to 8 spoil the party even when the media type is one they understand.\
    \ Yet another reason it’s best to stick with `@media`, unless you specifically\
    \ want to hide certain rules from that browser:\n\n```\n@import 'not-for-IE7-or-below.css'\
    \ screen;\n@media screen, print, refrigerator {\n  /* IE will get these rules\
    \ */\n}\n```\n\nMedia assignments are incredibly powerful because they allow us\
    \ to create layouts that adapt to the medium in which they are presented. One\
    \ of the first applications of this technique came from Eric Meyer in 2000, when\
    \ he showed us how to jettison “printer friendly” pages and use a media-specific\
    \ stylesheet to provide a printer-friendly view of any web page.\n\nTwo years\
    \ later, he built on that concept and showed us how we could use advanced CSS\
    \ (such as generated content) to progressively enhance that same experience.\n\
    \nReturning to our main stylesheet, we can add support for alternate media within\
    \ our faceted framework quite easily:\n\n9. The CSS 2.1 spec (http://www.w3.org/TR/2009/CR-CSS2-20090908/media.html#media-types)\
    \ addresses this explicitly in the case of `@media` and `@import`, but is oddly\
    \ non-prescriptive about the same behavior applying to linked and embedded styles.\
    \ Still, all modern browsers treat the HTML-based media designations the same\
    \ way.\n\n10. http://meyerweb.com/eric/articles/webrev/200001.html\n\n11. http://www.alistapart.com/articles/goingtoprint/\n\
    \n```\n/* =Typography */\n/* typography for every medium */\n@media screen {\n\
    \  /* screen-only typography */\n}\n@media print {\n  /* print-only typography\
    \ */\n}\n\n/* =Layout */\n/* layout for every medium */\n@media screen {\n  /*\
    \ screen-only layout */\n}\n@media print {\n  /* print-only layout */\n}\n\n/*\
    \ =Color */\n/* colors for every medium */\n@media screen {\n  /* screen-only\
    \ colors */\n}\n@media print {\n  /* print-only colors */\n}\n```\n\nOr all of\
    \ the styles for print could be bundled into a single `@media` declaration at\
    \ the bottom:\n\n```\n/* =Typography */\n/* typography for every medium */\n@media\
    \ screen {\n  /* screen-only typography */\n}\n\n/* =Layout */\n/* layout for\
    \ every medium */\n@media screen {\n  /* screen-only layout */\n}\n```\n\n```\n\
    /* =Color */\n/* colors for every medium */\n@media screen {\n    /* screen-only\
    \ colors */\n}\n\n/* =Print */\n@media print {\n    /* global print-only overrides\
    \ */\n}\n```\n\nIn the case of print, it may make the most sense to have a single\
    \ `@media` declaration to handle everything, but with other media, it may be advisable\
    \ to break it up. Each project is different, so you'll want to play around and\
    \ see what feels right.\n\n## Not your father's media declarations\n\nA few years\
    \ after the introduction of independent media support, the W3C upped the ante\
    \ even more and introduced media queries. Media queries are like media designations\
    \ on steroids: they provide details about the user's environment, such as the\
    \ width of the browser window or even its orientation (as in portrait or landscape).\
    \ Media queries are incredibly powerful and allow you to really fine-tune your\
    \ designs for specific devices. As such, they are quickly becoming an indispensable\
    \ tool in progressive enhancement.\n\nUsing media queries (which can go wherever\
    \ you'd place a standard media designation), you can add a set of rules to a page\
    \ based on the capabilities of the user agent. Let's take a look at an example:\n\
    \n```\n@media (min-width:1025px) {\n    /* ... */\n}\n```\n\nIn this case, we\
    \ designated a group of rule sets to be used only if the browser width is 1025px\
    \ or more.\n\nThe CSS3 module that defines media queries reached the Candidate\
    \ Recommendation stage in the middle of 2009 and prescribes how to obtain browser\
    \ dimensions as well as numerous other aspects of the device it is running on,\
    \ such as its dimensions, orientation, color capabilities, resolution, and the\
    \ like. Not all of the properties are currently supported, but enough are to make\
    \ them worth considering.\n\nMedia queries build upon the standard media designation\
    \ syntax by introducing the “and” combinator and negation using the “not” keyword.\
    \ These additions give you a bit more flexibility to target the screen medium\
    \ where the browser is over 1024px wide (screen and (min-width:1025px)), or anything\
    \ besides print (not print), but they do not add an explicit “or,” so you can’t\
    \ perform more complicated queries like you can in an actual programming language\
    \ (e.g., A and B or B and C, but not A and C). You can, however, imply “or” using\
    \ a comma.\n\nHere’s a rather exhaustive compound media query with an explanation\
    \ of what it does in the comment:\n\n```\n@media\n    screen and (min-device-width:1024px)\
    \ and\n        (max-width:989px),\n    screen and (max-device-width:480px),\n\
    \    screen and (max-device-width:480px) and\n        (orientation:landscape),\n\
    \    screen and (min-device-width:481px) and\n        (orientation:portrait) {\n\
    \    /* Layout for narrower desktop browser window\n        (below 990px) or\n\
    \        iPhone running iOS 3 (or equivalent) or\n        iPhone running iOS 4\
    \ (or equivalent) in\n        \"landscape\" view or\n        iPad (or equivalent)\
    \ in \"portrait\" view */\n}\n```\n\nRevisiting our example stylesheet, I have\
    \ used media queries to progressively enhance the page by making a baseline layout\
    \ aimed at older browsers and tablets. I then adjust the layout for wider desktop\
    \ browsers and narrower smartphones:\n\n```\n/* =Basic Layout */\n@media screen\
    \ {\n  /* ... */\n}\n\n/* =Full Layout */\n@media screen and (min-width:1025px)\
    \ {\n  /* ... */\n}\n\n/* =Narrow Layout  */\n@media screen and (max-width:765px)\
    \ {\n  /* ... */\n}\n```\n\nFigure 3.6 shows the alternate layouts available.\
    \ In some instances the changes from version to version are pretty drastic (e.g.,\
    \ each has a different navigation treatment) while others are more subtle (e.g.,\
    \ the postcard-based contact form adjusts to accommodate a narrower screen). Without\
    \ getting caught up in the specific differences between these layouts, the important\
    \ thing to recognize is that media queries can be used to create truly adaptive\
    \ layouts using only CSS. For more information on adaptive layouts, consult the\
    \ “Further Reading” section of Chapter 6.\n\n## NARROW\n\n## REGULAR/TABLET\n\n\
    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_76_0.png)\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_76_1.png)\n\
    \n```\n@media screen and (max-width:765px) {\n  /* ... */\n}\n```\n\n```\n@media\
    \ screen {\n  /* ... */\n}\n```\n\n## WIDE\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_76_2.png)\n\
    \n```\n@media screen and (min-width:1025px) {\n  /* ... */\n}\n```\n\nFigure 3.6:\
    \ Alternate layouts with media queries.\n\n## RICH IN LAYERS\n\nAs you can see,\
    \ there are numerous ways we can use CSS to progressively enhance our web pages.\
    \ Some techniques, such as taking advantage of parsing errors, are so simple and\
    \ commonplace that you're probably using them right now. Others, such as faceted\
    \ style separation, may provide a slightly different take on your current practices\
    \ or may be completely foreign to you. When used in combination, however, these\
    \ techniques weave together, layer upon layer, to provide a tailored experience\
    \ for every user, no matter what her browser or device supports.\n\n> \"I don't\
    \ want to use a tool unless I'm going to use it really well. Doing any of these\
    \ things halfway is worse than not at all. People don't want a mediocre interaction.\"\
    \n\n— SETH GODIN\n\n## CHAPTER 4: PROGRESSIVE ENHANCEMENT WITH JAVASCRIPT\n\n\
    On February 7th, 2011, shortly after Gawker Media launched a unified redesign\
    \ of their various blogs (Lifehacker, Gizmodo, etc.), users visiting any of those\
    \ sites were greeted by a blank stare (see Figure 4.1). The new platform relied\
    \ entirely on JavaScript to load content into the page and an error in that JavaScript\
    \ code made any page request come up empty-handed.¹ That single error caused a\
    \ lengthy “site outage” (I use that term liberally because the servers were still\
    \ working) for every Gawker property and lost them countless page views and ad\
    \ impressions. And it could have been avoided, had they designed their new platform\
    \ using progressive enhancement.\n\n1. A brief mention of the outage is here:\
    \ http://blogs.wsj.com/digits/2011/02/07/gawker-outage-causing-twitter-stir/.\
    \ Jeremy Keith and Mike Isolani provided worthwhile commentary on the JavaScript\
    \ reliance of Gawker’s platform (http://adactio.com/journal/4346/ and http://isolani.co.uk/blog/javascript/BreakingTheWebWithHashBangs,\
    \ respectively). I also weighed in at http://easy-reader.net/archives/2011/02/09/you-cant-rely-on-javascript/."
  mdcn: "\n当遇到无法识别的媒体类型时，*它们会被简单忽略*，而已知的媒体类型仍然会被正常处理。\n\n不幸的是，在处理 `@import` 的媒体声明时，即使是\
    \ IE 8 之前的版本，即使媒体类型是它们所理解的，也会破坏兼容性。这是另一个最好坚持使用 `@media` 的理由，除非你确实想对该浏览器隐藏某些规则：\n\
    \n```\n@import 'not-for-IE7-or-below.css' screen;\n@media screen, print, refrigerator\
    \ {\n  /* IE 将应用这些规则 */\n}\n```\n\n媒体赋值功能非常强大，因为它们允许我们创建能够适应其呈现介质的布局。这项技术最早的实践之一来自\
    \ Eric Meyer 在 2000 年的展示，他向我们展示了如何舍弃“打印友好”页面，并使用特定于媒体的样式表为任何网页提供打印友好的视图。\n\n两年后，他在此概念的基础上，进一步向我们展示了如何使用高级\
    \ CSS（例如生成内容）来逐步增强同样的体验。\n\n回到我们的主样式表，我们可以相当容易地在我们的分面框架内添加对备用媒体的支持：\n\n9.  CSS\
    \ 2.1 规范 (http://www.w3.org/TR/2009/CR-CSS2-20090908/media.html#media-types) 在\
    \ `@media` 和 `@import` 的情况下明确说明了这一点，但对于将相同行为应用于链接和嵌入式样式，其规定却出人意料地模糊。尽管如此，所有现代浏览器都以相同的方式处理基于\
    \ HTML 的媒体指定。\n\n10. http://meyerweb.com/eric/articles/webrev/200001.html\n\n\
    11. http://www.alistapart.com/articles/goingtoprint/\n\n```\n/* =Typography */\n\
    /* typography for every medium */\n@media screen {\n  /* screen-only typography\
    \ */\n}\n@media print {\n  /* print-only typography */\n}\n\n/* =Layout */\n/*\
    \ layout for every medium */\n@media screen {\n  /* screen-only layout */\n}\n\
    @media print {\n  /* print-only layout */\n}\n\n/* =Color */\n/* colors for every\
    \ medium */\n@media screen {\n  /* screen-only colors */\n}\n@media print {\n\
    \  /* print-only colors */\n}\n```\n\n或者，所有打印样式可以打包成一个位于底部的 `@media` 声明：\n\n```\n\
    /* =Typography */\n/* typography for every medium */\n@media screen {\n  /* screen-only\
    \ typography */\n}\n\n/* =Layout */\n/* layout for every medium */\n@media screen\
    \ {\n  /* screen-only layout */\n}\n```\n\n```\n/* =Color */\n/* colors for every\
    \ medium */\n@media screen {\n    /* screen-only colors */\n}\n\n/* =Print */\n\
    @media print {\n    /* global print-only overrides */\n}\n```\n\n对于打印样式，将所有内容放在一个\
    \ `@media` 声明中来处理可能是最合理的，但对于其他媒体类型，将其拆分开来可能是可取的。每个项目都是不同的，因此你需要亲自尝试，看看哪种方式感觉最合适。\n\
    \n## 非传统的媒体声明\n\n在独立媒体支持引入几年后，W3C 更进一步，引入了媒体查询。媒体查询就像是媒体指定的强化版：它们提供有关用户环境的详细信息，例如浏览器窗口的宽度甚至其方向（如纵向或横向）。媒体查询功能极其强大，允许你为特定设备精细调整设计。因此，它们正迅速成为渐进增强中不可或缺的工具。\n\
    \n使用媒体查询（可以放在任何放置标准媒体指定的地方），你可以根据用户代理的功能为页面添加一组规则。让我们看一个例子：\n\n```\n@media (min-width:1025px)\
    \ {\n    /* ... */\n}\n```\n\n在这个例子中，我们指定了一组规则集，仅在浏览器宽度为 1025px 或更大时才使用。\n\n定义媒体查询的\
    \ CSS3 模块在 2009 年中期达到了候选推荐阶段，并规定了如何获取浏览器尺寸以及其运行设备的许多其他方面，如其尺寸、方向、颜色能力、分辨率等。并非所有属性目前都得到支持，但已有足够多的属性使其值得考虑。\n\
    \n媒体查询在标准媒体指定语法的基础上，引入了“and”组合符和使用“not”关键字的否定。这些添加为你提供了更多的灵活性，可以针对浏览器宽度超过 1024px\
    \ 的屏幕媒体 (screen and (min-width:1025px))，或除打印之外的任何媒体 (not print)，但它们没有添加显式的“or”，因此你无法像在实际编程语言中那样执行更复杂的查询（例如，A\
    \ and B 或 B and C，但不是 A and C）。然而，你可以使用逗号来隐含“or”。\n\n下面是一个相当详尽的复合媒体查询，并在注释中解释了它的作用：\n\
    \n```\n@media\n    screen and (min-device-width:1024px) and\n        (max-width:989px),\n\
    \    screen and (max-device-width:480px),\n    screen and (max-device-width:480px)\
    \ and\n        (orientation:landscape),\n    screen and (min-device-width:481px)\
    \ and\n        (orientation:portrait) {\n    /* Layout for narrower desktop browser\
    \ window\n        (below 990px) or\n        iPhone running iOS 3 (or equivalent)\
    \ or\n        iPhone running iOS 4 (or equivalent) in\n        \"landscape\" view\
    \ or\n        iPad (or equivalent) in \"portrait\" view */\n}\n```\n\n回顾我们的示例样式表，我使用了媒体查询来逐步增强页面，首先创建一个针对旧版浏览器和平板电脑的基线布局。然后，我为更宽的桌面浏览器和更窄的智能手机调整布局：\n\
    \n```\n/* =Basic Layout */\n@media screen {\n  /* ... */\n}\n\n/* =Full Layout\
    \ */\n@media screen and (min-width:1025px) {\n  /* ... */\n}\n\n/* =Narrow Layout\
    \  */\n@media screen and (max-width:765px) {\n  /* ... */\n}\n```\n\n图 3.6 显示了可用的替代布局。在某些情况下，版本之间的变化相当剧烈（例如，每个版本都有不同的导航处理），而其他变化则更微妙（例如，基于明信片的联系表单会调整以适应更窄的屏幕）。抛开这些布局之间的具体差异不谈，重要的是要认识到，媒体查询可以仅用\
    \ CSS 来创建真正自适应的布局。有关自适应布局的更多信息，请查阅第 6 章的“扩展阅读”部分。\n\n## 窄屏\n\n## 常规/平板\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_76_0.png)\n\
    \n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_76_1.png)\n\n```\n@media screen and\
    \ (max-width:765px) {\n  /* ... */\n}\n```\n\n```\n@media screen {\n  /* ... */\n\
    }\n```\n\n## 宽屏\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_76_2.png)\n\n```\n\
    @media screen and (min-width:1025px) {\n  /* ... */\n}\n```\n\n图 3.6：使用媒体查询的替代布局。\n\
    \n## 丰富的层次\n\n如你所见，我们可以使用多种方法来利用 CSS 逐步增强我们的网页。一些技术，例如利用解析错误，如此简单且普遍，以至于你现在可能正在使用它们。其他技术，例如分面样式分离，可能会为你的当前实践提供略微不同的视角，或者对你来说完全陌生。然而，当这些技术结合使用时，它们会相互交织，层层叠加，为每个用户提供量身定制的体验，无论她的浏览器或设备支持什么。\n\
    \n> “除非我能非常熟练地使用一个工具，否则我不想用它。半心半意地做这些事情比完全不做更糟糕。人们不想要平庸的交互。”\n\n— SETH GODIN\n\
    \n## 第四章：使用 JavaScript 进行渐进增强\n\n2011 年 2 月 7 日，在 Gawker Media 推出其旗下各种博客（Lifehacker、Gizmodo\
    \ 等）的统一重新设计后不久，访问这些网站的用户看到的只是一片空白（见图 4.1）。新平台完全依赖 JavaScript 将内容加载到页面中，而 JavaScript\
    \ 代码中的一个错误导致任何页面请求都空手而归。¹ 这个单一的错误导致了所有 Gawker 网站长时间的“停机”（我之所以这样称呼是因为服务器仍在运行），使他们失去了大量的页面浏览量和广告印象。如果他们使用渐进增强来设计新平台，这一切本可以避免。\n\
    \n1. 关于此故障的简短提及：http://blogs.wsj.com/digits/2011/02/07/gawker-outage-causing-twitter-stir/。Jeremy\
    \ Keith 和 Mike Isolani 就 Gawker 平台对 JavaScript 的依赖提供了有价值的评论（分别见 http://adactio.com/journal/4346/\
    \ 和 http://isolani.co.uk/blog/javascript/BreakingTheWebWithHashBangs）。我也在 http://easy-reader.net/archives/2011/02/09/you-cant-rely-on-javascript/\
    \ 上发表了看法。\n"
