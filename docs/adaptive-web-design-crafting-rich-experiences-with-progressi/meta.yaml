- md: "## KEEP IT COPACETIC\n\nAs we've covered, many of the progressive enhancement\
    \ techniques available to us in HTML and CSS are pretty straightforward and may\
    \ even have been part of your repertoire prior to picking up this book. Progressive\
    \ enhancement with JavaScript, on the other hand, is a bit more complicated; JavaScript\
    \ cannot be fault tolerant like the others because it is a programming language.\n\
    \nUnlike HTML and CSS, which describe content and provide design instructions\
    \ to a browser, respectively, JavaScript literally executes commands to the browser.\
    \ Because they actually *do* something, JavaScript programs stop running when\
    \ they encounter an error. The potential causes for these errors could be anything\
    \ from a typo to a missing dependency to accidentally writing an infinite loop.\
    \ Regardless of the cause, if you write code that doesn't jive well with the browser's\
    \ JavaScript interpreter, it will likely spit a big fat error right in your face\
    \ (or your customer's). And no one wants that.\n\nAs we've seen, the implementation\
    \ of progressive enhancement at each stage in the continuum isn't a binary choice\
    \ of having a particular technology or not having it. Instead, a user's experience\
    \ at each level is variable based on the capabilities of the browser. So, if a\
    \ user's browser supports RGBa natively, but not rounded corners, it's not a big\
    \ deal; the user gets what she gets.\n\nWe need to approach JavaScript the same\
    \ way; it shouldn't be an all or nothing option. Not to keep returning to food\
    \ metaphors time and time again, but we should offer technologies in an *à la\
    \ carte* fashion by dividing up the functionality into discrete, self-contained\
    \ packages. Once separated, these scripts can test for their own dependencies\
    \ and judge whether or not they should run based on the browsing environment and\
    \ the page they are to interact with.\n\nThe `select`-based navigation script\
    \ we just walked through is a good example of the first part of this concept in\
    \ practice; it is completely self-contained. It does not, however, properly test\
    \ for its numerous dependencies, the first of which is the availability of jQuery.\
    \ To do that, we would need to wrap the whole thing in a conditional:\n\n```javascript\n\
    if ( typeof( jQuery ) != 'undefined' ) {\n    // Existing code goes here\n}\n\
    ```\n\nnav element into a select when the browser shrinks below a particular size.\
    \ To keep the example short and a little easier to follow, I've used the jQuery\
    \ JavaScript library.⁹ Libraries are great tools as they are composed of dozens\
    \ if not hundreds of functions that solve common problems (like adding and removing\
    \ classes). Don't worry if you can't completely follow the code, I'll explain\
    \ what's happening so you don't have to decipher it on your own.\n\nWe'll begin\
    \ by isolating the script in an anonymous function¹⁰ that runs as soon as the\
    \ DOM is available, but before assets like images, CSS files, and videos have\
    \ been downloaded (a.k.a. onDOMReady). This makes the page more responsive than\
    \ running a script when the window loads (a.k.a. window.onload). For the remainder\
    \ of this example, all of the code will be sequestered within this function:\n\
    \n```javascript\n$(function(){\n  // Exciting stuff will go here\n});\n```\n\n\
    Next, we create the variables we need for this script to work. By instantiating\
    \ them all at once, we'll reduce the number of var statements (which helps with\
    \ minification).¹¹\n\n```javascript\nvar\n$window   = $(window),        // reference\
    \ the window\n$old_nav  = $('#top nav > *'), // get the navigation\n$links   \
    \ = $old_nav.find('a'),   // get the links\nshowing   = 'old',            // track\
    \ what's showing\ntrigger   = 765,              // the browser width\n       \
    \                       // that triggers the change\n$new_nav, $option,      \
    \      // we'll use these shortly\ntimer     = null;             // we'll need\
    \ a timer too\n```\n\nThe comments should give you a good sense of what each variable\
    \ is for.\n\nIf you're familiar with jQuery, but confused as to why we're assigning\
    \ elements to local variables rather than just referencing the jQuery-based lookup\
    \ (e.g., `$('#top nav > *')`) each time we need it, rest assured that there's\
    \ a method to my madness: creating a local reference reduces the performance hit\
    \ of running the script because the look up only happens once instead of every\
    \ time `$()` is used. Also, to make it easy to differentiate jQuery results from\
    \ other variables, I've prefaced each associated variable name with a dollar sign\
    \ (`$`). You'll see these techniques used throughout this script as they are helpful\
    \ habits to get into.\n\nWith all of our variables in place, you *might* think\
    \ we could move on to the meat of the script, but we're not quite ready for that\
    \ yet. Before we try to execute code against the page, we should make sure that\
    \ the elements we need actually exist:\n\n```javascript\nif ( $old_nav.length\
    \ && $links.length ) {\n  // We know the DOM elements we need exist\n  // and\
    \ can do something with them\n}\n```\n\nTesting for dependencies is very important\
    \ and is something I'll cover more thoroughly in the next section. Now for the\
    \ meat (or nutmeat if you're a vegetarian). We'll begin our script in earnest\
    \ by generating the new `select`-based navigation, creating the `select`, and\
    \ the first of several `option` elements it will contain:\n\n```javascript\n$new_nav\
    \ = $('<select></select>');\n$option = $('<option>-- Navigation --</option>')\n\
    \  .appendTo($new_nav);\n```\n\nWith new markup to work with, we can now loop\
    \ through the links we collected (as `$links`) and build a new option for each\
    \ by repeatedly cloning the `option` we just created:\n\n```javascript\n$links.each(function(){\n\
    \  var $a = $(this);\n  $option.clone()\n    .attr( 'value', $a.attr('href') )\n\
    \    .text( $a.text() )\n    .appendTo( $new_nav );\n});\n```\n\nWith the `options`\
    \ created and appended to the `select` we can move on to adding the final markup\
    \ touches and setting up the event handler for the `select`'s `onchange` event:\n\
    \n```javascript\n$new_nav = $new_nav\n  .wrap('<div id=\"mobile-nav\"/>')\n  .parent()\n\
    \  .delegate('select', 'change', function(){\n    window.location = $(this).val();\n\
    \  });\n```\n\nThis is a slightly simplified version of what you'll find on the\
    \ live Retreats 4 Geeks site (I've taken out some of the URL hash trickery), but\
    \ I wanted to make sure you were able to follow it without distraction. Here's\
    \ what's going on: the first three lines wrap our `select` (`$new_nav`) in a `div`\
    \ and then re-assign that `div` to the variable `$new_nav` so the whole thing\
    \ is viewed by JavaScript as a neat little package; the next line uses event delegation\
    \ (which we discussed earlier) to observe the `onchange` event on the `select`\
    \ from further up the DOM tree (from the `div`, in fact), assigning an anonymous\
    \ function to that event that pushes a new location to the browser's address bar\
    \ (causing the browser to jump to the new section or load a new page, depending\
    \ on the link type).\n\nBoom! Functional `select`-based navigation. Now to get\
    \ it into the page when conditions are right. For that, we'll create a new function,\
    \ called `toggleDisplay`, that will observe the size of the browser window and\
    \ handle swapping one navigation style for another:\n\n```javascript\nfunction\
    \ toggleDisplay() {\n    var width = $window.width();\n    if ( showing == 'old'\
    \ && width <= trigger ) {\n        $old_nav.replaceWith($new_nav);\n        showing\
    \ = 'new';\n    } else if ( showing == 'new' && width > trigger ) {\n        $new_nav.replaceWith($old_nav);\n\
    \        showing = 'old';\n    }\n}\n```\n\nAgain, this is a slightly simplified\
    \ version of the final script, but it highlights the important part: the navigation\
    \ is only swapped in the event that the appropriate browser width threshold is\
    \ met (`trigger`) *and* the other navigation style is showing (tracked using `showing`).\
    \ With that function in place, we just need to run it once (to initialize everything\
    \ and make sure the right navigation is showing from the get-go) and then assign\
    \ it to the window’s `onresize` event:\n\n```javascript\ntoggleDisplay(); // initialize\
    \ the right view\n$window.resize(function(){\n    if ( timer ) { clearTimeout(timer);\
    \ }\n    timer = setTimeout( toggleDisplay, 100 );\n});\n```\n\nIf you’re wondering\
    \ why `toggleDisplay()` isn’t passed in as the actual event handler, that’s because\
    \ doing so would cause the function to be executed numerous times (possibly several\
    \ hundred) while a user is resizing his or her browser. To keep the number of\
    \ executions to a minimum (and reduce the burden the script places on a user’s\
    \ CPU), the event handler uses a timer to call `toggleDisplay()` after .1 seconds.\
    \ As the function is triggered repeatedly during a resize event, it destroys the\
    \ timer if it exists and then recreates it. This setup ensures `toggleDisplay()`\
    \ is only called once when a user resizes his or her browser (unless he or she\
    \ does so *very* slowly).\n\nAnd there you have it: a perfect example of progressive\
    \ enhancement with Javascript.\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_95_0.png)\n\
    \nFigure 4.5: select-based navigation on an iPhone.\n\nAs this simple example\
    \ demonstrates, JavaScript is perfectly capable of generating everything it needs\
    \ and getting rid of anything it doesn't. You could even take this particular\
    \ function a step farther and make it even more markup agnostic by allowing the\
    \ root starting point (in our case, the child elements of `nav`) to be passed\
    \ dynamically into the function. But I leave that to you to experiment with. Onward!\n\
    \n---\n\n⁹ http://jQuery.com\n\n¹⁰ Anonymous functions are functions which have\
    \ not been given a name.\n\n¹¹ http://www.alistapart.com/articles/javascript-minification-part-II/"
  mdcn: "\n## 保持和谐\n\n正如我们已经讨论过的，HTML 和 CSS 中许多渐进式增强技术都相当直观，甚至可能在你阅读本书之前就已经是你技能库的一部分。另一方面，JavaScript\
    \ 的渐进式增强则更为复杂一些；JavaScript 无法像其他技术那样具备容错性，因为它是一种编程语言。\n\n与分别用于描述内容和向浏览器提供设计指令的\
    \ HTML 和 CSS 不同，JavaScript 实际上是向浏览器*执行*命令。由于它们确实*做*了某些事情，JavaScript 程序在遇到错误时会停止运行。这些错误的潜在原因多种多样，从拼写错误到缺失的依赖项，再到意外编写的无限循环。无论原因是什么，如果你编写的代码与浏览器的\
    \ JavaScript 解释器配合得不好，它很可能会在你（或你的客户）面前抛出一个巨大的错误。而没人愿意看到这种情况。\n\n正如我们所看到的，在渐进式增强的每个阶段，实现方式并非是拥有或不拥有某项技术的二元选择。相反，用户在每个层级的体验是根据浏览器的功能而变化的。因此，如果用户的浏览器原生支持\
    \ RGBa，但不支持圆角边框，这也没什么大问题；用户得到的就是她得到的。\n\n我们需要以同样的方式对待 JavaScript；它不应该是一个全有或全无的选择。并非要一次又一次地回到食物比喻，但我们应该以*点菜式*的方式提供技术，将功能划分为离散的、自包含的包。一旦分离，这些脚本就可以测试自身的依赖项，并根据浏览环境和它们要交互的页面来判断是否应该运行。\n\
