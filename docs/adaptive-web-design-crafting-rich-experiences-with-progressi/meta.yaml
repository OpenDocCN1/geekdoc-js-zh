- md: "You may recall that I mentioned I've chosen to define all of these layers in\
    \ a single file. To accomplish that, I broke the file down into three distinct\
    \ sections as seen in this excerpt highlighting the styles applied to the images\
    \ of the “Lodging” article:\n\n```css\n/* =Typography */\nimg {\n  display: block;\n\
    }\n\n/* =Layout */\n@media screen {\n  .frame .inner {\n    border: 10px solid;\n\
    \  }\n}\n\n/* =Color */\n.frame .inner {\n  background-color: rgb(227, 222, 215);\n\
    \  border-color: rgb(227, 222, 215);\n}\n```\n\nYou were probably quick to notice\
    \ the `@media` block that contains layout rules for the screen. The use of `@media`\
    \ here is not accidental: it ensures that every medium is given access to the\
    \ typography and color rules while the layout rules are restricted to user agents\
    \ that implement the “screen” media type. Following this setup, you can easily\
    \ do the same for print or any other medium, but more on that in a bit.\n\nThe\
    \ use of `@media` has another benefit as well: really old browsers (e.g., Netscape\
    \ 4) don’t understand it. And, following the rules of fault tolerance, browsers\
    \ ignore anything they don’t understand, so our layout styles remain cleverly\
    \ hidden from older browsers and devices, leaving them with a purely typographic\
    \ or, as is more likely, a colorful typographic experience.\n\nNow, getting back\
    \ to an earlier question, why are the color rules last? Well, my reasoning is\
    \ simple: I like CSS shorthand. CSS shorthand allows us to combine multiple declarations\
    \ into a single one. We saw an example of CSS shorthand earlier: `border: 10px\
    \ solid`. This declaration is shorthand for:\n\n```css\nborder-top: 10px solid;\n\
    border-right: 10px solid;\nborder-bottom: 10px solid;\nborder-left: 10px solid;\n\
    ```\n\nIncidentally, each of those declarations is also shorthand. For example,\
    \ `border-top: 10px solid` is shorthand for:\n\n```css\nborder-top-width: 10px;\n\
    border-top-style: solid;\nborder-top-color: inherit;\n```\n\nAs you can see, CSS\
    \ shorthand greatly reduces the complexity of your stylesheets.\n\nGlancing back\
    \ at the previous example, imagine that the color rule set had been moved before\
    \ the layout one. The `border-color` would be set to a light gray. Then, in the\
    \ layout rules, the `border` shorthand is used, overwriting the `border-color`\
    \ declaration from the earlier rule. It does this because the specificity of the\
    \ rule sets is identical and the `border` shorthand always sets the `border-color`,\
    \ even if you don't explicitly define it (“inherit” is the default value, meaning\
    \ it uses the text color). That’s why I recommend defining color rules last. Shorthand\
    \ can be really useful for simplifying and compressing your stylesheets, but you\
    \ need to be aware of the order in which you apply them.\n\nSince we’re on the\
    \ topic of color, I’ll also mention that in certain cases, you may want to use\
    \ color in a layout-specific context (e.g., a background color). In those instances,\
    \ it may make sense to block out a subsection of your rules using `@media`, just\
    \ as we did with the overall layout:\n\n```css\n/* =Color */\n.frame .inner {\n\
    \  /* colors for every medium */\n}\n\n@media screen {\n  .frame .inner {\n  \
    \  /* screen-only colors */\n  }\n}\n```\n\nWith our faceted framework in place,\
    \ it becomes quite simple to introduce additional modules as the need arises.\
    \ For example, effects:\n\n```css\n/* =Color */\na:link, a:visited {\n  color:\
    \ rgb(180, 49, 25);\n}\n\na:hover {\n  color: rgb(235, 123, 35);\n}\n/* ... */\n\
    \n/* =Effects */\n@media screen {\n  a {\n    transition-duration: .5s;\n  }\n\
    }\n```\n\nNow that you have a pretty solid understanding of how to wield CSS’s\
    \ inherent fault tolerance for the betterment of the browsing experience, let’s\
    \ delve a little deeper and layer on some additional enhancements.\n\n## A LITTLE\
    \ MISUNDERSTANDING GOES A LONG WAY\n\nAs a fault-tolerant language, CSS is a near\
    \ perfect addition to the progressive enhancement toolbox. In many ways, ignorance\
    \ is bliss because we can reliably use new features and syntax without having\
    \ to worry about the browser falling apart when it doesn't understand something.\
    \ But what if a browser *thinks* it understands something, but its understanding\
    \ is horribly flawed? Yes, of course, I'm speaking of Internet Explorer.\n\nIE9\
    \ was released as this book was in production. Based on what I've seen so far,\
    \ it looks like the team has made good on their promise to support standards (including\
    \ CSS) in a completely interoperable way. IE8 was no slouch in the CSS department,\
    \ but when you start looking back at IE7 and (shudder) IE6, things take a turn\
    \ for the worse.\n\nThankfully, the smart folks at Microsoft gave us a tool that\
    \ makes it easy to sequester browser-specific patches to CSS, JavaScript, and\
    \ even markup: Conditional Comments.<sup>8</sup> Conditional Comments are exactly\
    \ what you'd expect: a specifically-formatted HTML comment that is interpreted\
    \ by IE but is ignored by all other browsers (because it's a comment).\n\nConditional\
    \ Comments are a boon for the progressive enhancement world because, while progressive\
    \ enhancement isn't really about the browser, in practical application, some browsers\
    \ need a little hand-holding to meet the needs of our users. Conditional Comments\
    \ give us authors the ability to target a specific version (or versions) of IE.\
    \ Here's a quick example of how to put them to use:\n\n```html\n<link rel=\"stylesheet\"\
    \ href=\"c/main.css\"/>\n<!--[if IE 9]><link rel=\"stylesheet\"\n  href=\"c/ie9.css\"\
    /><![endif]-->\n<!--[if lte IE 8]><link rel=\"stylesheet\"\n  href=\"c/ie8.css\"\
    /><![endif]-->\n<!--[if lte IE 7]><link rel=\"stylesheet\"\n  href=\"c/ie7.css\"\
    /><![endif]-->\n<!--[if lte IE 6]><link rel=\"stylesheet\"\n  href=\"c/ie6.css\"\
    /><![endif]-->\n```\n\nIn this particular snippet, you can see that we are including\
    \ our core CSS file (`main.css`) on the first line. After that, we have a conditionally-commented\
    \ stylesheet directed at IE9, using the syntax `if IE 9`. Skip that one for a\
    \ moment and focus on the following three lines, the first of which targets IE8\
    \ and below (`if lte IE 8` meaning “if less than or equal to IE8”), the second\
    \ of which targets IE7 and below (`if lte IE 7`), and the final line which targets\
    \ IE6 and below. Used in concert and in this specific order, these three conditionally-commented\
    \ stylesheets streamline the CSS patching process by allowing the patches you\
    \ applied to more recent versions of IE to trickle down to earlier versions. The\
    \ reasoning? Well, if an issue exists in IE7, it’s pretty likely that IE6 had\
    \ the same problem.\n\nThe conditional comment for IE9, by contrast, only targets\
    \ that specific browser. It could easily be set up in the same “less than or equal\
    \ to” manner as the subsequent conditional comments, but IE9 is a substantial\
    \ departure from IE8 on many levels, including its CSS support. Any issues it\
    \ has are not likely to be issues with those earlier browsers, so there’s no need\
    \ to make those older browsers read and parse the additional rules. The same setup\
    \ could have been done for IE8 as well, as the mechanisms that define its CSS\
    \ support are completely different than those in IE7 and it shares few, if any,\
    \ issues with IE7 and earlier, but as the design requires that we use some IE-specific\
    \ filters, it made sense to only have to write them once.\n\n## BEYOND THE BASICS\n\
    \nThe web is unlike any other medium we’ve encountered thus far. It isn’t print,\
    \ television, radio, a video game, a kiosk, or an application, but it functions\
    \ as a hybrid of all of these things and more. Realizing this, the W3C added the\
    \ ability to target styles to a specific medium. We took advantage of that capability\
    \ earlier in an `@media` block, but you’re probably more familiar with using media\
    \ declarations with linked or embedded stylesheets (using the `media` attribute)\
    \ or, possibly, as a suffix to `@import` statements.\n\nThe W3C maintains the\
    \ list of approved media types, but is open to adding to it as technology evolves.\
    \ Currently, the list addresses CSS’ application on the computer screen, in print,\
    \ on televisions, on hand held devices, and in assistant contexts such as screen\
    \ readers, braille printers, and touch feedback devices. Without a specific media\
    \ designation, the browser assumes a media type of “screen.”\n\nAt their most\
    \ basic, media assignments use a single media designation, but as with selectors,\
    \ multiple media assignments can be combined using a comma (which acts as an implicit\
    \ “or”). In the following example, `main.css` would be applied for both “print”\
    \ and “screen” media types:\n\n```html\n<link rel=\"stylesheet\" href=\"main.css\"\
    \ media=\"screen, print\"/>\n```\n\nMedia assignments are fault tolerant, though\
    \ the application of fault tolerance for media assignments is quite different\
    \ from what is applied to selectors (not that that’s confusing at all): if unknown\
    \ media types in a comma-separated series"
  mdcn: "\n你可能还记得我曾提到过，我选择将所有这些层定义在单个文件中。为了实现这一点，我将文件分成了三个不同的部分，如下所示，这个摘录重点展示了应用于“住宿”文章图片的样式：\n\
    \n```css\n/* =Typography */\nimg {\n  display: block;\n}\n\n/* =Layout */\n@media\
    \ screen {\n  .frame .inner {\n    border: 10px solid;\n  }\n}\n\n/* =Color */\n\
    .frame .inner {\n  background-color: rgb(227, 222, 215);\n  border-color: rgb(227,\
    \ 222, 215);\n}\n```\n\n你可能很快注意到了包含屏幕布局规则的 `@media` 块。这里使用 `@media` 并非偶然：它确保每种媒体类型都能访问排版和颜色规则，而布局规则仅限于实现了“screen”媒体类型的用户代理。遵循此设置，你可以轻松地为打印或任何其他媒体类型做同样的事情，不过稍后会详细讨论。\n\
    \n使用 `@media` 还有另一个好处：非常古老的浏览器（例如 Netscape 4）无法理解它。并且，根据容错规则，浏览器会忽略它们不理解的任何内容，因此我们的布局样式对旧版浏览器和设备巧妙地隐藏起来，使它们只能体验到纯粹的排版，或者更可能是一种色彩丰富的排版体验。\n\
    \n现在，回到之前的一个问题，为什么颜色规则放在最后？嗯，我的理由很简单：我喜欢 CSS 简写属性。CSS 简写属性允许我们将多个声明合并为一个。我们之前已经见过\
    \ CSS 简写属性的例子：`border: 10px solid`。这个声明是以下内容的简写：\n\n```css\nborder-top: 10px solid;\n\
    border-right: 10px solid;\nborder-bottom: 10px solid;\nborder-left: 10px solid;\n\
    ```\n\n顺便说一句，每个这样的声明本身也是简写。例如，`border-top: 10px solid` 是以下内容的简写：\n\n```css\nborder-top-width:\
    \ 10px;\nborder-top-style: solid;\nborder-top-color: inherit;\n```\n\n如你所见，CSS\
    \ 简写属性极大地降低了样式表的复杂性。\n\n回顾之前的例子，想象一下如果颜色规则集被移到布局规则之前会怎样。`border-color` 会被设置为浅灰色。然后，在布局规则中，使用了\
    \ `border` 简写属性，它会覆盖之前规则中的 `border-color` 声明。它这样做是因为规则集的特异性相同，并且 `border` 简写属性总是会设置\
    \ `border-color`，即使你没有明确定义它（“inherit”是默认值，意思是使用文本颜色）。这就是为什么我建议最后定义颜色规则。简写属性对于简化和压缩样式表非常有用，但你需要注意应用它们的顺序。\n\
    \n既然我们谈到了颜色，我还要提到在某些情况下，你可能需要在特定于布局的上下文中使用颜色（例如，背景色）。在这些情况下，使用 `@media` 来划分子区域是有意义的，就像我们处理整体布局时所做的那样：\n\
    \n```css\n/* =Color */\n.frame .inner {\n  /* 每种媒体的颜色 */\n}\n\n@media screen {\n\
    \  .frame .inner {\n    /* 仅限屏幕的颜色 */\n  }\n}\n```\n\n随着我们分面框架的建立，根据需要引入额外的模块变得相当简单。例如，效果：\n\
    \n```css\n/* =Color */\na:link, a:visited {\n  color: rgb(180, 49, 25);\n}\n\n\
    a:hover {\n  color: rgb(235, 123, 35);\n}\n/* ... */\n\n/* =Effects */\n@media\
    \ screen {\n  a {\n    transition-duration: .5s;\n  }\n}\n```\n\n现在你已经对如何利用 CSS\
    \ 固有的容错性来改善浏览体验有了相当扎实的理解，让我们更深入地探讨一下，并添加一些额外的增强功能。\n\n## 一点点误解就能产生深远影响\n\n作为一种容错性语言，CSS\
    \ 是渐进式增强工具箱中近乎完美的补充。在许多方面，无知是福，因为我们可以可靠地使用新特性和语法，而不必担心浏览器在遇到不理解的内容时会崩溃。但是，如果一个浏览器*认为*它理解某些东西，但其理解却存在严重缺陷呢？是的，当然，我指的是\
    \ Internet Explorer。\n\nIE9 在本书制作过程中发布。根据我目前所见，看起来该团队兑现了他们的承诺，以完全互操作的方式支持标准（包括\
    \ CSS）。IE8 在 CSS 方面也不逊色，但当你开始回顾 IE7 和（令人战栗的）IE6 时，情况就变得糟糕起来。\n\n值得庆幸的是，微软的聪明人给了我们一个工具，可以轻松地将针对浏览器的补丁（包括\
    \ CSS、JavaScript 甚至标记）隔离起来：条件注释。<sup>8</sup> 条件注释正如你所期望的：一种特定格式的 HTML 注释，IE 会解释它，但所有其他浏览器都会忽略它（因为它是注释）。\n\
    \n条件注释对渐进式增强世界来说是一大福音，因为尽管渐进式增强本身与浏览器无关，但在实际应用中，某些浏览器需要一点特别关照才能满足我们用户的需求。条件注释使我们这些开发者能够针对特定版本（或版本集）的\
    \ IE。以下是一个快速示例，说明如何使用它们：\n\n```html\n<link rel=\"stylesheet\" href=\"c/main.css\"\
    />\n<!--[if IE 9]><link rel=\"stylesheet\"\n  href=\"c/ie9.css\"/><![endif]-->\n\
    <!--[if lte IE 8]><link rel=\"stylesheet\"\n  href=\"c/ie8.css\"/><![endif]-->\n\
    <!--[if lte IE 7]><link rel=\"stylesheet\"\n  href=\"c/ie7.css\"/><![endif]-->\n\
    <!--[if lte IE 6]><link rel=\"stylesheet\"\n  href=\"c/ie6.css\"/><![endif]-->\n\
    ```\n\n在这个特定的代码片段中，你可以看到我们在第一行包含了核心 CSS 文件（`main.css`）。之后，我们有一个针对 IE9 的条件注释样式表，使用\
    \ `if IE 9` 语法。先跳过这个，关注下面的三行：第一行针对 IE8 及以下版本（`if lte IE 8` 意思是“如果小于或等于 IE8”），第二行针对\
    \ IE7 及以下版本（`if lte IE 7`），最后一行针对 IE6 及以下版本。结合使用并按照此特定顺序，这三个条件注释样式表简化了 CSS 补丁过程，允许你为较新版本的\
    \ IE 应用的补丁向下传递到早期版本。原因何在？嗯，如果一个问题存在于 IE7 中，那么 IE6 很可能也有同样的问题。\n\n相比之下，IE9 的条件注释仅针对该特定浏览器。它本可以像后续的条件注释一样，采用“小于或等于”的方式设置，但\
    \ IE9 在许多层面上与 IE8 存在显著差异，包括其 CSS 支持。它遇到的任何问题都不太可能是早期浏览器遇到的问题，因此没有必要让那些旧浏览器读取和解析额外的规则。对于\
    \ IE8 也可以采用相同的设置，因为定义其 CSS 支持的机制与 IE7 完全不同，并且它与 IE7 及更早版本共享的问题即使有也很少，但由于设计要求我们使用一些\
    \ IE 特定的过滤器，因此只编写一次是有意义的。\n\n## 超越基础\n\n网络不同于我们迄今为止遇到的任何其他媒体。它不是印刷品、电视、广播、视频游戏、信息亭或应用程序，但它作为所有这些东西以及更多东西的混合体发挥着作用。意识到这一点后，W3C\
    \ 增加了将样式定向到特定媒体的能力。我们之前在 `@media` 块中利用了这种能力，但你可能更熟悉将媒体声明与链接或嵌入式样式表一起使用（使用 `media`\
    \ 属性），或者，也可能是作为 `@import` 语句的后缀。\n\nW3C 维护着批准的媒体类型列表，但对随着技术发展而增加内容持开放态度。目前，该列表涵盖了\
    \ CSS 在计算机屏幕、打印、电视、手持设备以及屏幕阅读器、盲文打印机和触觉反馈设备等辅助上下文中的应用。如果没有指定特定的媒体类型，浏览器会假定媒体类型为“screen”。\n\
    \n最基本的形式下，媒体赋值使用单个媒体指定，但与选择器一样，多个媒体赋值可以使用逗号（充当隐式的“或”）组合。在以下示例中，`main.css` 将应用于“print”和“screen”两种媒体类型：\n\
    \n```html\n<link rel=\"stylesheet\" href=\"main.css\" media=\"screen, print\"\
    />\n```\n\n媒体赋值是容错的，尽管容错在媒体赋值中的应用与应用于选择器的容错方式完全不同（这不是说那很混乱）：如果在逗号分隔的系列中存在未知的媒体类型，\n"
