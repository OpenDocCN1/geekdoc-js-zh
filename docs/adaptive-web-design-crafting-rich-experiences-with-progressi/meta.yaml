    ...\"/>\n        </figure>\n      </li>\n      <!-- ... -->\n    </ul>\n  </aside>\n\
    </article>\n```\n\nYou'll notice that the `article` in question uses the same\
    \ `class` for each `figure` element: “frame”; this allows us to achieve consistency\
    \ with regard to the postcard-with-matte look. I've given the focal `figure` an\
    \ additional `class` of, well, “focal.” This setup allows me to use two different\
    \ CSS rules of equal specificity to apply the appropriate styles to `figure.focal`.\
    \ Here's an example of one such application, followed by an override:"
  - "[PAGE 61]\n\n.frame {\n  margin: 0 auto 40px;\n}\n\n.focal {\n  margin: 0 20px\
    \ 25px 30px;\n}\n\nEach of these rule sets applies to the focal figure in this\
    \ article (and all others on the page) and both rule sets have selectors of equal\
    \ specificity. Since the second rule set defines the same property as the first,\
    \ the margin value of the “focal” figure will be “0 20px 25px 30px” instead of\
    \ “0 auto 40px.”\n\nOf course, most stylesheets are composed of hundreds of rule\
    \ sets, making it easy to unintentionally fall victim to issues of proximity.\
    \ Thankfully, however, we can alleviate some of those issues by taking a layered\
    \ approach to designing with CSS.\n\nTaking a step back for a moment, you can\
    \ see the design of a website contains three core facets: Typography, color, and\
    \ layout. Each brings something more to the table, building the design until it\
    \ is fully realized. When it comes to progressive enhancement with CSS, we can\
    \ use that same breakdown to create discrete levels of support that are delivered\
    \ based on the capabilities of the browser: typography; typography and color;\
    \ and typography, color, and layout.\n\nAs we’ve discussed, rule order matters,\
    \ so when building a progressive design, we must reconcile our desire to separate\
    \ the facets of our design with the way the cascade prescribes the interpretation\
    \ of our rules. In practical terms, that means delivering your groups of facet-specific\
    \ declarations in a set order: typography, then layout, then color. Why that order?\
    \ We’ll get to that in a moment."
