    # CHAPTER 5: PROGRESSIVE ENHANCEMENT FOR ACCESSIBILITY


    In February of 2006, the National Federation of the Blind took legal action against
    Target for having an inaccessible website. A month later the case went to federal
    court (at Target’s request). Target tried to get the case thrown out, but it didn’t
    fly and the case turned into a class action lawsuit that Target eventually settled
    in 2008 for over $6 million US (not counting attorney fees). That’s pretty substantial
    considering that the reason the lawsuit was filed in the first place was because
    Target didn’t fix accessibility issues they were alerted to: lack of alt text
    on images, heavy use of image maps, and reliance on a mouse for the submission
    of forms. All of these issues could have been addressed quickly and easily for
    far less than $6 million. Hell, I’d have done it for a few grand.


    If you haven’t had a lot of exposure to accessibility—with respect to this chapter,
    a measure of how well a site can be'
  - '[PAGE 106]


    used by people with disabilities and the assistive technologies¹ they rely on—as
    a design consideration, it can seem incredibly daunting because there are so many
    factors to consider. Even if you fall into a category of users with “special needs,”
    it’s likely your experience and aptitudes are different from someone else with
    similar concerns. For example, you may have deuteranopia (a type of red-green
    color blindness), but yours may not be as extreme as someone else’s. You also
    may not be as likely to recognize potential issues for people with tritanopia
    (blue-yellow color blindness).


    If you’re the kind of person who is concerned with issues of accessibility, whether
    from the position of getting your message to as many people as possible or because
    you don’t want to make someone feel left out, the self-imposed pressure to “get
    it right” can seem so intense that you can’t help but approach it with trepidation.


    Thankfully, designing and developing with progressive enhancement improves accessibility.
    Progressive enhancement encourages you to build your websites in service of the
    content and that, more often than not, will help guide you toward the right decision
    when it comes to accessibility. Of course there’s always room for improvement,
    hence this chapter.


