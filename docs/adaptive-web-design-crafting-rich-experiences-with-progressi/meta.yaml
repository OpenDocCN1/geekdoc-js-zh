    \n*图 3.4：应用了排版样式的\"住宿\"页面。*\n\n改进虽然细微，但确实是改进。对于那些在处理基于CSS的布局方面存在问题的浏览器来说，这实际上可能比试图强制它们使用超出其处理能力的更高级布局，为用户带来更好的体验。\n\
    \n接下来要提供的一层样式支持——并且很可能与基本排版一起为用户所用——是颜色（在某些情况下，可能包括背景图像）。图3.5展示了颜色为这篇文章的设计带来的微小变化。\n\
    \n# 您的下榻之处\n\n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_64_0.png)\n\n**这与工业地毯和折叠椅几乎有天壤之别。**\n\
    \n我们的豪华旅馆坐落在田纳西州塞维尔市的山坡上，就在加特林堡郊外。这里配备了一块4x8英尺的影院屏幕、无线互联网、一个热水浴缸、一张台球桌、一个飞镖靶、一个吧台，以及周围山峦的壮丽景色，是逃离日常琐事、学习新知识的完美氛围。\n\
    \n旅馆的十二间套房每间都配有一张特大号床、一间带按摩浴缸的私人浴室和一个独立阳台，让您能够放松身心，尽情享受周围的环境。您甚至可以支付少量额外费用携带一位客人（请参阅注册表）。\n\
    \n除了用知识充实您的头脑，我们还将用美味的有机餐食（以及在您感到饥饿时供应的大量零食）来填饱您的肚子，所有这些都由我们的私人厨师在内部精心准备。如果您有饮食限制或偏好，我们将尽力满足并提供美味的选择。\n\
    \n需要一份详细的课程大纲或更多信息来说服您的老板参加这个活动吗？下载HTML5与CSS3情况说明书，或查看我们的常见问题解答。准备好参加了吗？立即注册。\n\
    \n![](img/89eb5062b6d9c42f4b17bd5db9c1c8d_64_1.png)\n\n*图 3.5：上色后的\"住宿\"页面。*\n\
    \n显然，我们这里看到的是逐步的改进，但仍然是改进。\n\n这篇文章的基础标记如下：\n\n```html\n<article id=\"lodging\"\
    >\n  <header>\n    <h1>Where You’ll Stay</h1>\n  </header>\n\n  <figure class=\"\
    frame focal\">\n    <img class=\"inner\" src=\"i/lodge.jpg\"\n      alt=\"\" title=\"\
    ...\"/>\n  </figure>\n\n  <section class=\"main\">\n    <!-- description of accommodations\
    \ -->\n  </section>\n\n  <aside class=\"extra\">\n    <ul class=\"gallery\">\n\
    \      <li>\n        <figure class=\"frame\">\n          <img class=\"inner\"\
    \ src=\"i/room.jpg\"\n            alt=\"\" title=\"...\"/>\n        </figure>\n\
    \      </li>\n      <!-- ... -->\n    </ul>\n  </aside>\n</article>\n```\n\n您会注意到，相关的`article`为每个`figure`元素使用了相同的`class`：\"\
    frame\"；这使我们能够在明信片带衬边的外观方面实现一致性。我为焦点`figure`额外添加了一个`class`，嗯，就是\"focal\"。这种设置允许我使用两个具有相同特异性的不同CSS规则，将相应的样式应用于`figure.focal`。这里是一个应用示例，后面是一个覆盖：\n\
    \n```css\n.frame {\n  margin: 0 auto 40px;\n}\n\n.focal {\n  margin: 0 20px 25px\
    \ 30px;\n}\n```\n\n这些规则集中的每一个都应用于本文中的焦点图形（以及页面上的所有其他图形），并且两个规则集都具有相同特异性的选择器。由于第二个规则集定义了与第一个相同的属性，因此\"\
    focal\"图形的边距值将是\"0 20px 25px 30px\"，而不是\"0 auto 40px\"。\n\n当然，大多数样式表由数百个规则集组成，很容易无意中成为邻近性问题的受害者。但值得庆幸的是，我们可以通过采用分层设计CSS的方法来缓解其中的一些问题。\n\
    \n退一步看，你可以看到一个网站的设计包含三个核心方面：排版、颜色和布局。每个方面都为整体设计增添更多内容，逐步构建，直至完全实现。当谈到使用CSS进行渐进增强时，我们可以使用同样的分解来创建基于浏览器能力的离散支持级别：排版；排版和颜色；以及排版、颜色和布局。\n\
    \n正如我们讨论过的，规则顺序很重要，因此在构建渐进式设计时，我们必须调和我们分离设计方面的愿望与层叠规定规则解释的方式。实际上，这意味着您需要按特定顺序交付按方面分组的声明：排版，然后是布局，最后是颜色。为什么是这个顺序？我们稍后会讲到。\n\
    \n您可以将这些规则组作为单独的样式表（链接或导入）交付，也可以放在一个样式表中。^[7] 多样式表路线相当直接且易于管理，但它会损害性能，因为每个样式表都必须通过单独的HTTP请求获取。除此之外，一些浏览器不会缓存超过一层深度的样式表（例如，导入到另一个样式表中的样式表）。基于这些原因，单个样式表的方法对我来说最有意义，也是我在“程序员静修”网站上采用的方法。\n\
    \n为了说明分层样式的概念，也许最好从头开始：不应用任何样式。在下一页中，图3.3展示了在Safari中仅应用了默认浏览器样式的住宿文章。\n\n如您所见，使用浏览器的默认样式，内容完全可用。它远不如我们希望的那样吸引人，但内容完全可访问。应用一层通用的排版样式后，我们得到了图3.4。\n\
    \n[7] 您的CSS以一个样式表交付并不意味着必须以这种方式维护。有许多服务器端工具可以将CSS文件组合成一个，因此您可以通过物理地将单独的样式表导入到单个骨架CSS文件的对应位置，然后再交付给用户，从而轻松兼得两者之长。例如：http://www.easy-reader.net/archives/2010/07/11/template-based-asset-munging-in-expressionengine。\n\
    \n我们现在要关注的最后一层样式应用是基于屏幕的布局。本章前面的图3.2展示了\"住宿\"文章在其全部 glory 中的样貌。\n"
