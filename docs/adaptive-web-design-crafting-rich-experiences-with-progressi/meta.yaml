  md: '# Pumpkin Pie


    OVERVIEW INGREDIENTS DIRECTIONS NUTRITION


    Whether you''re hosting a festive party or a casual get-together with friends,
    our Pumpkin Pie will make entertaining easy!


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_117_0.png)


    Original recipe yield: 1 × 9-inch deep dish pie


    **Prep Time:** 10min

    **Cook Time:** 1hr

    **Ready In:** 1hr 10min


    Photos by Paul Goyette, licensed under Creative Commons.


    Figure 5.1: A tabbed interface.


    The ARIA spec defines a number of widget roles, making it possible to construct
    anything from complex form controls (e.g., sliders and spinner boxes) to tree-based
    menus, modal dialog boxes, and drag-and-drop interfaces, all while maintaining
    accessibility. And, as with the structural roles we discussed earlier, ARIA even
    provides mechanisms for redefining nonsense markup as something functional:


    ```

    <div role="button">I&#8217;m not a real button, but I play one on the web</div>

    ```


    Of course all of this is well and good, but for any widget to work you need JavaScript
    and, traditionally, that''s been an accessibility no man''s land. The main reason
    that techniques like Ajax and accessibility didn''t mesh well was that the HTML
    language provided no mechanism by which JavaScript could update the user (or her
    assistive technology of choice) in real-time beyond `alert()` and `confirm()`
    (which, let''s face it, are the hooligans at the back of the user interface classroom).'
  merge: -1
  pgno: 117
