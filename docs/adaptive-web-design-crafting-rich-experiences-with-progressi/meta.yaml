  md: "```\nfunction toggleDisplay() {\n    var width = $window.width();\n    if (\
    \ showing == 'old' && width <= trigger ) {\n        $old_nav.replaceWith($new_nav);\n\
    \        showing = 'new';\n    } else if ( showing == 'new' && width > trigger\
    \ ) {\n        $new_nav.replaceWith($old_nav);\n        showing = 'old';\n   \
    \ }\n}\n```\n\nAgain, this is a slightly simplified version of the final script,\
    \ but it highlights the important part: the navigation is only swapped in the\
    \ event that the appropriate browser width threshold is met (`trigger`) *and*\
    \ the other navigation style is showing (tracked using `showing`). With that function\
    \ in place, we just need to run it once (to initialize everything and make sure\
    \ the right navigation is showing from the get-go) and then assign it to the window’s\
    \ `onresize` event:\n\n```\ntoggleDisplay(); // initialize the right view\n$window.resize(function(){\n\
    \    if ( timer ) { clearTimeout(timer); }\n    timer = setTimeout( toggleDisplay,\
    \ 100 );\n});\n```\n\nIf you’re wondering why `toggleDisplay()` isn’t passed in\
    \ as the actual event handler, that’s because doing so would cause the function\
    \ to be executed numerous times (possibly several hundred) while a user is resizing\
    \ his or her browser. To keep the number of executions to a minimum (and reduce\
    \ the burden the script places on a user’s CPU), the event handler uses a timer\
    \ to call `toggleDisplay()` after .1 seconds. As the function is triggered repeatedly\
    \ during a resize event, it destroys the timer if it exists and then recreates\
    \ it. This setup ensures `toggleDisplay()` is only called once when a user resizes\
    \ his or her browser (unless he or she does so *very* slowly)."
