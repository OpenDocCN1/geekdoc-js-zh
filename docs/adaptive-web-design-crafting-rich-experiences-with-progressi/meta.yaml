  md: 'What''s really interesting about microformats is that you can use them however
    you like. The `class` names don''t need to appear in any particular order (so
    long as they appear within an appropriately-classified parent element) and they
    don''t require that the content match the intended export format in any way. And,
    as this example demonstrates, the hCard does not need to be marked up like a rolodex
    card entry; instead, you are free to sprinkle its component parts throughout your
    prose using the appropriate `class` names to indicate each one.


    # Mark your calendars


    With hCard covered, we can take a look at the hCalendar event microformat mentioned
    earlier. Again, before we look at the markup, let''s take a look at some of the
    more important hCalendar classifications.


    | CLASS | PURPOSE |

    |---|---|

    | vevent | Signifies that an hCalendar event is being used. (This should be the
    `class` of the root element containing the hCalendar event information.) |

    | dtstart | Indicates the start date of the event |

    | dtend | Denotes the end date of the event |

    | summary | Identifies the name of the event |

    | location | States the location of the event |

    | description | Provides additional details about the event |


    Table 2.2: *Important hCalender classifications*


    As the entire demo page is dedicated to the event, the `class`-application process
    needs to begin further up the DOM tree. I''ve decided to start at the content
    container (`div#content`), to which I''ve assigned the root "vevent" `class`.
    While in'
  merge: -1
  pgno: 44
- img_proc: true
  md: "the following example, the hCalendar content is contained within `article#details`,\
    \ applying the `class` to an ancestor element in this manner gives us the flexibility\
    \ to include more hCalendar properties in the other `article`s as well:\n\n```\n\
    <div id=\"content\" class=\"vevent\">\n```\n\nAs I mentioned, the first article\
    \ (`article#details`) contains the bulk of the information about the event. Let’s\
    \ take a look at that markup before we review the application of the hCalendar\
    \ classes:\n\n```\n<article id=\"details\">\n  <header>\n    <h1>Join us for HTML5\
    \ &amp; CSS3</h1>\n    <p>&#8211;10 April 2011</p>\n    <p>Gatlinburg, <abbr title=\"\
    Tennessee\">TN</abbr></p>\n  </header>\n  <figure>\n    <img src=\"i/mountains.jpg\"\
    \ alt=\"\"/>\n  </figure>\n  <section class=\"main\">\n    <!-- event overview\
    \ -->\n  </section>\n</article><!-- / #details -->\n```\n\nGlancing over the markup,\
    \ you’ve probably already figured out where most of the hCalendar classifications\
    \ should be applied. Right off the bat, you have the name of the event or “summary”\
    \ in hCalendar parlance:\n\n```\n<h1>Join us for <b class=\"summary\">HTML5 &amp;\
    \ CSS3</b></h1>\n```"
  merge: -1
