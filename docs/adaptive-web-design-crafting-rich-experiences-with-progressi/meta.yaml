  - '[PAGE 122]


    we realized that overzealous application of the `tabindex` attribute could get
    your users jumping (and not in a good way).<sup>9</sup> But the most important
    thing we discovered is that we could use JavaScript to “juggle” the `tabindex`
    attribute to streamline a user’s path through a complex widget like a tabbed interface
    or an accordion form.


    So what exactly is `tabindex` juggling? Well, some time in 2005 (it’s hard to
    pin down the exact origin) it was discovered that assigning a value of “-1” to
    the `tabindex` attribute of an element would remove that element from the default
    tab order of the document.<sup>10</sup> Interestingly, despite being taken out
    of the document’s tab order, the element remained focusable via JavaScript (`element.focus()`),
    which opened up a lot of possibilities for controlling a user’s experience.


    Let’s walk through a scenario, revisiting the tabbed interface from earlier:


    +   1. A user arrives at the tabbed interface and clicks the `tab` key on her
    keyboard, bringing focus to the first tab (which is associated with the visible
    tab panel).

    2. Clicking the `tab` button again moves focus out of the tab interface to the
    next piece of focusable content instead of taking her to the next tab in the list.

    3. Holding `shift` while hitting the `tab` key brings the user back into the tab
    list and restores focus to the currently active tab.

    4. Using the arrow keys, she can move forward and backward through the tabs in
    the tab list, bringing each associated tab panel into view as she moves.

    5. Hitting the `enter` button at any point while navigating through the tab list
    brings focus to the tab panel associated with that tab.


    <sup>9</sup> http://webaim.org/techniques/keyboard/tabindex

    <sup>10</sup> This was especially interesting because, according to the W3C spec,
    `tabindex` should only accept values between 0 and 32767.'
  - "[PAGE 123]\n\nI know that's a lot of “tabs” (and a bit of a tall order), but\
    \ with `tabindex` juggling and a little JavaScript it becomes quite simple to\
    \ achieve. Here's how:\n\n+   1. By assigning a `tabindex` of “-1” to every tab\
    \ and tab panel, you can remove them from the tab order of the page.\n2. Going\
    \ back and re-assigning a value of “0” to the currently active tab restores their\
    \ default position in the tab order.\n3. Using JavaScript you can dynamically\
    \ adjust the `tabindex` property of each tab as a user executes keyboard commands\
    \ like left or right, up or down, allowing the user to move quickly and easily\
    \ through the interface.\n\nHere's a snippet from `TabInterface`'s `swap` method\
    \ that shows `tabindex` juggling in action (along with some ARIA attribute manipulation\
    \ and `class` swapping):\n\n```\nfunction swap( e ) {\n  // ...\n  // De-activating\
    \ the current tab & tab panel\n  removeClassName( old_tab, 'active' );\n  old_tab.setAttribute(\
    \ 'aria-selected', 'false' );\n  old_tab.setAttribute( 'tabindex', '-1' );\n \
    \ removeClassName( old_folder, 'visible' );\n  old_folder.setAttribute( 'aria-hidden',\
    \ 'true' );\n  // Activating the new tab & tab panel\n  addClassName( tab, 'active'\
    \ );\n  tab.setAttribute( 'aria-selected', 'true' );\n  tab.setAttribute( 'tabindex',\
    \ '0' );\n  addClassName( new_folder, 'visible' );\n  new_folder.setAttribute(\
    \ 'aria-hidden', 'false' );\n  // ...\n}\n```\n\nIf you'd like to see this technique\
    \ in action, you can check out TabInterface.js on Github.<sup>11</sup>"
