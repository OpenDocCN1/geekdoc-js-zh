    in the HTML 2 spec ([http://www.ietf.org/rfc/rfc1866.txt](http://www.ietf.org/rfc/rfc1866.txt)),
    but were not formally-defined attributes. They were simply used to demonstrate
    the fault tolerant way in which browsers should treat unknown attributes.'
  - '[PAGE 33]


    two attributes were not formally introduced into the HTML lexicon until HTML 4.0,
    but were implemented in browsers around the same time as Cascading Style Sheet
    (CSS) support was added. And CSS, of course, brought us two simple selectors that
    targeted these attributes explicitly, causing some unfortunate confusion over
    the intended use of `class` and `id` from the get-go.


    For years, nearly every web developer working with CSS thought the correlation
    between the attributes and the selectors was intentional, believing that `id`
    and `class` were intended purely for use with style sheets. You can hardly blame
    us though, CSS Level 1 did not provide many mechanisms for selecting elements,
    so it made sense that the `class` selector (e.g., `.ul.menu`) and the `id` selector
    (e.g., `div#content`) would have been introduced (along with their corresponding
    attributes) for the purposes of both the general and specific application of style,
    respectively.⁷


    Thankfully, we now understand how the `class` and `id` attributes were meant to
    operate. The `class` attribute was introduced specifically to address the limited
    set of elements within the HTML lexicon:


    > As time goes by, people’s expectations change, and more will be demanded of
    HTML. One manifestation of this is the pressure to add yet more tags. HTML 3.0
    introduces a means for subclassing elements in an open-ended way. This can be
    used to distinguish the role of a paragraph element as being a couplet in a stansa
    [sic], or a mathematical term as being a tensor. This ability to make fresh distinctions
    can be exploited to impart distinct rendering styles or to support richer search
    mechanisms, without further complicating the HTML document format itself.⁸


    7. And the HTML 3 draft did allow for this use, among others. The draft is available
    at http://www.w3.org/MarkUp/html3/html3.txt.

    8. From the "Scalability" section of the HTML 3 draft (see footnote 7).'
  - "[PAGE 34]\n\nThe intent was that this attribute would contain a list of subclasses\
    \ for the particular element they were applied to, with the classes listed from\
    \ most general to most specific:9\n\n```\n<a href=\"...\" title=\"...\">\n   \
    \ <img class=\"illustration map\" src=\"...\" alt=\"...\"/>\n</a>\n```\n\nThe\
    \ spec introduced the `id` attribute for the purposes of identifying a specific\
    \ element on the page (this is why each `id` on a page needs to be unique). In\
    \ practice, this identifier would be used as a reference point for style rules\
    \ (`#details { ... }`), scripts (`document.getElementById('details')`), and anchors\
    \ (`<a href=\"#details\">`). You may recall that we actually used that last mechanism\
    \ in the navigation introduced earlier in the chapter.\n\nAs all of the information\
    \ for the Retreats 4 Geeks event is included on a single page, I've grouped each\
    \ chunk of content into separate `article` elements10, each with a unique `id`.\
    \ The `article` element was introduced as part of HTML5 and demarcates content\
    \ that forms an independent part of the document, such as a newspaper article,\
    \ blog post, or, in our case, a distinct topic. Each of the articles on the page\
    \ is then targeted, using its `id` as an anchor reference, by the navigation links.\
    \ Clicking one of these links will jump a user directly to the appropriate content:\n\
    \n9. You'll see this throughout the HTML 3 draft, whenever `class` is defined\
    \ for an element.\n\n10. Not to be confusing, but HTML5 also introduces the `section`\
    \ element (also seen in the above code example). In HTML5 parlance, the `section`\
    \ element denotes *a section of content* (go figure, right?). In terms of overall\
    \ organization, I could have declared the whole page an `article`, making each\
    \ distinct chunk a `section` of that `article`, but I decided that individual\
    \ `article` elements made more sense because each chunk of content is independent\
    \ enough that it could easily exist on its own page. The semantic difference between\
    \ the two is modest at best and the choice of one over the other is really at\
    \ the discretion of the author."
- md: "## CODIFIED CONVENTIONS\n\nMicroformats are a set of community-driven specifications\
    \ for how to mark up content to expose semantics (and meta data) that are not\
    \ available in HTML (or XHTML). At their essence, microformats formalize organically-developed\
    \ coding conventions into a specification that addresses an oversight or limitation\
    \ in HTML. For example, HTML provides no robust way to mark up contact information\
    \ or events, so the community created microformats to fill those needs.\n\nThe\
    \ first microformat arose from a desire to express associations between individuals\
    \ on the web and was called the XHTML Friends Network (“XFN” for short). Though\
    \ not developed as a “microformat” (that term came later), XFN was a perfect example\
    \ of extending the semantics of HTML with a specific goal in mind.\n\nDeveloped\
    \ by Tantek Çelik, Matthew Mullenweg, and Eric Meyer, XFN makes use of the oft-neglected\
    \ `rel` attribute. The purpose of `rel`—which you are probably familiar with in\
    \ the context of the `link` element for inclusion of an external stylesheet (`rel=\"\
    stylesheet\"`)—is to indicate the relationship of the target of an anchor to the\
    \ current page. The idea was simple: if I wanted to point from my blog to the\
    \ blog of a colleague, I could employ XFN and add `rel=\"colleague\"` to the link.\
    \ Similarly, if I was linking to my wife’s blog, I would use `rel=\"friend co-resident\
    \ spouse muse sweetheart co-worker\"` because she is all of those things.<sup>11</sup>\n\
    \nOn its own, this additional markup does little more than provide a bit more\
    \ information about our relationship and why I might be linking to another website,\
    \ but if I use it for every link in my blog roll and those people, in turn, use\
    \ it in theirs, all of a sudden we’ve created a network that is navigable programmatically,\
    \ creating myriad opportunities for data mining and repurposing. And that's exactly\
    \ what happened: XFN spread like wildfire. Software developers integrated it into\
    \ popular blogging tools (e.g., WordPress, Movable Type) and developers at nearly\
    \ every site on the “social web” (e.g., Twitter, Flickr, Last.fm) began adorning\
    \ user profile pages with the special case of `rel=\"me\"` (used to link from\
    \ one web page you control to another), enabling tools like Google’s Social Graph\
    \ to quickly build a full profile of their users starting from a single URL.<sup>12</sup>\n\
    \nAn example of XFN in the Retreats 4 Geeks page can be found in the `footer`<sup>13</sup>:\n\
    \n```\n<footer>\n  <p id=\"copyright\">&copy;2010 Retreats 4 Geeks. All\n    Rights\
    \ Reserved.</p>\n\n  <p>Retreats 4 Geeks is an <a rel=\"me\"\n    href=\"http://easy-designs.net/\"\
    >Easy! Designs\n    </a> venture.</p>\n</footer>\n```\n\nFrom that simple (yet\
    \ powerful) beginning, microformats have increased in number to address common\
    \ and diverse needs from marking up a person’s profile (hCard), event listings\
    \ (hCalendar), content for syndication (hAtom), and resumes (hResume), to indicating\
    \ license information (rel-license), controlling search engine spidering (rel-nofollow),\
    \ and facilitating tagging (rel-tag).<sup>14</sup>\n\nAlmost in parallel with\
    \ the development of these microformats, numerous tools sprung up to make use\
    \ of them. As you can probably guess from my mention of the Google Social Graph,\
    \ search engines have started to pay attention to microformats and, in some cases,\
    \ even rank microformatted content higher than non-microformatted content. Browser\
    \ add-ons—such as Operator<sup>15</sup> and Oomph<sup>16</sup>—enable users to\
    \ extract and repurpose microformatted content. Microformat parsers are also available\
    \ for nearly every programming language and there are even web-based services,\
    \ such as Optimus<sup>17</sup> and H2VX<sup>18</sup>, that give users more direct\
    \ access to the microformats in use on their sites.\n\nAs you can see, microformats\
    \ are yet another layer in the progressive enhancement continuum, enabling us\
    \ to make our sites even more useful to our users. After all, how cool is it that,\
    \ using a tool like Operator or a service like Optimus, we can enable users to\
    \ import an event to their calendar or a business card to their address book directly\
    \ from our web page? I think that's pretty awesome.\n\n## Call me, call me anytime\n\
    \nAs our demo website is for an event, the hCalendar microformat is an obvious\
    \ place to start, but let's hold off on that for a moment and look at how we can\
    \ apply the hCard microformat to my bio [section](link) in the \"Instructors\"\
    \ [article](link). Before we take a look at the markup though, let's go over the\
    \ key hCard classifications.\n\n| CLASS | PURPOSE |\n| :--- | :--- |\n| vcard\
    \ | Signifies that hCard is being used. (This should be the class of the root\
    \ element containing the hCard information.) |\n| fn | Short for “formatted name,”\
    \ it's used to wrap the name of the person who owns the hCard |\n| url | Indicates\
    \ that a given link takes the user to a web page about this person |\n| photo\
    \ | Denotes a photo of this person |\n| org | Identifies the company or organization\
    \ of which this person is a part |\n| role | Conveys the role this person holds\
    \ within the organization |\n\nTable 2.1: Key hCard classifications\n\nThe hCard\
    \ microformat offers many other options for marking up a person's profile, but\
    \ these are the key ones we're going to concern ourselves within the context of\
    \ the Retreats 4 Geeks website. And, of these five [classes](link), only “vcard”\
    \ and “fn” are actually required.\n\nNow let's take a look at the content we've\
    \ got to work with:\n\n```\n<section id=\"aaron-gustafson\">\n    <figure>\n \
    \       <img src=\"i/aaron-gustafson.jpg\" alt=\"\"/>\n    </figure>\n    <h1>Aaron\
    \ Gustafson</h1>\n```\n\nAaron has been working on the web for nearly 15 years\
    \ and, in that time, has cultivated a love of web standards and an in-depth knowledge\
    \ of website strategy and architecture, interface design, and numerous languages\
    \ (including XHTML, CSS, JavaScript, and PHP). Aaron and his wife, Kelly, own\
    \ <a rel=\"external\" href=\"http://easy-designs.net\">Easy! Designs</a>, a boutique\
    \ web consultancy based in Chattanooga, TN. When not neck deep in code, Aaron\
    \ is usually found evangelizing his findings and sharing his knowledge and passion\
    \ with others in the field.\n\nAaron has trained professionals at <cite>The New\
    \ York Times</cite>, Gartner, and the US Environmental Protection Agency (among\
    \ others), and has presented at the world's foremost web conferences, such as\
    \ An Event Apart and Web Directions. He is Group Manager of the <a rel=\"external\"\
    \ href=\"http://webstandards.org\">Web Standards Project (WaSP)</a> and serves\
    \ as an Invited Expert to the World Wide Web Consortium's <a rel=\"external\"\
    \ href=\"http://www.w3.org/2005/Incubator/owea/\">Open Web Education Alliance\
    \ (OWEA)</a>. He created <a rel=\"external\" href=\"http://ecsstender.org\">eCSStender</a>,\
    \ serves as Technical Editor for <a rel=\"external\" href=\"http://alistapart.com\"\
    ><cite>A List Apart</cite></a>, is a contributing writer for <a rel=\"external\"\
    \ href=\"http://netmag.co.uk\"><cite>.net Magazine</cite></a>, and has filled\
    \ a small library with his technical writing and editing credits. His next book,\
    \ <cite>Adaptive Web Design: Crafting Rich Experiences with Progressive Enhancement</cite>,\
    \ is due out in early 2011.\n\n---\n\n**Footnotes**\n\n<sup>11</sup> *[Note: The\
    \ original footnote text for 11 was not present in the provided OCR pages.]*\n\
    \n<sup>12</sup> More on the Social Graph API can be found at http://code.google.com/apis/socialgraph/.\
    \ Glenn Jones uses this API in the fantastic JavaScript library Ident Engine (http://identengine.com/),\
    \ which he introduced in the pages of A List Apart (http://www.alistapart.com/articles/discovering-magic/).\n\
    \n<sup>13</sup> The `footer` element is another product of the HTML5 spec and\
    \ is intended to encapsulate \"meta\" information about an `article`, `section`,\
    \ or page such as the author, copyright information, and so forth.\n\n<sup>14</sup>\
    \ The microformats wiki (http://microformats.org/wiki/) keeps a running list of\
    \ all microformats and documentation on how to use them.\n\n<sup>15</sup> http://kaply.com/weblog/operator/\n\
    \n<sup>16</sup> http://visitmix.com/labs/oomph/\n\n<sup>17</sup> http://microformatique.com/optimus/\n\
    \n<sup>18</sup> http://h2vx.com/"
  mdcn: "\n## 规范化的约定\n\n微格式是一套由社区驱动的规范，用于标记内容以揭示 HTML（或 XHTML）中未提供的语义（和元数据）。从本质上讲，微格式将有机发展的编码规范正式化为一种规范，以解决\
    \ HTML 中的疏漏或限制。例如，HTML 没有提供健壮的方式来标记联系信息或事件，因此社区创建了微格式来满足这些需求。\n\n第一个微格式源于表达网络上个体之间关联的愿望，被称为\
    \ XHTML 朋友网络（简称“XFN”）。虽然它并非作为“微格式”开发（该术语后来才出现），但 XFN 是一个在特定目标下扩展 HTML 语义的完美范例。\n\
    \nXFN 由 Tantek Çelik、Matthew Mullenweg 和 Eric Meyer 开发，它利用了经常被忽视的 `rel` 属性。`rel`\
    \ 的目的——你可能在 `link` 元素包含外部样式表的上下文中熟悉它（`rel=\"stylesheet\"`）——是指示锚点目标与当前页面的关系。这个想法很简单：如果我想从我的博客链接到同事的博客，我可以使用\
    \ XFN 并在链接中添加 `rel=\"colleague\"`。类似地，如果我链接到我妻子的博客，我会使用 `rel=\"friend co-resident\
    \ spouse muse sweetheart co-worker\"`，因为她兼具所有这些身份。<sup>11</sup>\n\n就其本身而言，这种额外的标记除了提供更多关于我们关系的信息以及我为什么可能链接到另一个网站之外，几乎没什么作用，但如果我在博客列表中的每个链接上都使用它，并且这些人反过来也在他们的链接上使用它，突然间我们就创建了一个可编程导航的网络，为数据挖掘和再利用创造了无数机会。而事实也正是如此：XFN\
    \ 如野火般迅速传播。软件开发人员将其集成到流行的博客工具中（例如 WordPress、Movable Type），“社交网络”上几乎每个网站的开发人员（例如\
    \ Twitter、Flickr、Last.fm）都开始使用特殊情况 `rel=\"me\"`（用于从你控制的一个网页链接到另一个网页）来装饰用户个人资料页面，这使得像\
    \ Google Social Graph 这样的工具能够从单个 URL 开始快速构建用户的完整资料。<sup>12</sup>\n\nRetreats 4\
    \ Geeks 页面中 XFN 的一个示例可以在 `footer`<sup>13</sup> 中找到：\n\n```\n<footer>\n  <p id=\"\
    copyright\">&copy;2010 Retreats 4 Geeks. All\n    Rights Reserved.</p>\n\n  <p>Retreats\
    \ 4 Geeks is an <a rel=\"me\"\n    href=\"http://easy-designs.net/\">Easy! Designs\n\
    \    </a> venture.</p>\n</footer>\n```\n\n从这个简单（但强大）的起点开始，微格式的数量不断增加，以满足从标记个人资料（hCard）、事件列表（hCalendar）、用于联合的内容（hAtom）和简历（hResume），到指示许可信息（rel-license）、控制搜索引擎蜘蛛抓取（rel-nofollow）和方便标签标注（rel-tag）等常见且多样化的需求。<sup>14</sup>\n\
    \n几乎与这些微格式的开发并行，涌现出了大量利用它们的工具。你可能从我提到 Google Social Graph 猜到，搜索引擎已开始关注微格式，在某些情况下，甚至将微格式化内容的排名置于非微格式化内容之上。浏览器插件——如\
    \ Operator<sup>15</sup> 和 Oomph<sup>16</sup>——使用户能够提取和再利用微格式化内容。几乎每种编程语言都有微格式解析器可用，甚至还有基于网络的服务，如\
    \ Optimus<sup>17</sup> 和 H2VX<sup>18</sup>，为用户提供更直接访问其网站上使用的微格式的途径。\n\n如你所见，微格式是渐进增强连续体中的又一个层次，使我们能够为用户使我们的网站更加有用。毕竟，使用像\
    \ Operator 这样的工具或像 Optimus 这样的服务，我们能让用户直接从我们的网页导入事件到他们的日历或名片到他们的地址簿，这不是很酷吗？我认为这非常棒。\n\
    \n## 随时联系我\n\n由于我们的演示网站是用于一个活动的，因此 hCalendar 微格式是一个显而易见的起点，但让我们暂时搁置它，先看看如何将 hCard\
    \ 微格式应用到我的简介 [部分](link) 中的“讲师”[文章](link)。不过，在查看标记之前，让我们先回顾一下 hCard 的关键分类。\n\n\
    | 类 | 用途 |\n| :--- | :--- |\n| vcard | 表示正在使用 hCard。（这应该是包含 hCard 信息的根元素的类。） |\n\
    | fn | “formatted name”（格式化名称）的缩写，用于包装拥有 hCard 的人的姓名 |\n| url | 指示给定链接将用户带到关于此人的网页\
    \ |\n| photo | 表示此人的照片 |\n| org | 标识此人所属的公司或组织 |\n| role | 表达此人在组织中的角色 |\n\n表\
    \ 2.1：关键 hCard 分类\n\nhCard 微格式提供了许多其他选项来标记个人资料，但这些是我们在 Retreats 4 Geeks 网站上下文中要关注的关键分类。而且，在这五个\
    \ [类](link) 中，只有“vcard”和“fn”是实际必需的。\n\n现在让我们看看我们可用的内容：\n\n```\n<section id=\"\
    aaron-gustafson\">\n    <figure>\n        <img src=\"i/aaron-gustafson.jpg\" alt=\"\
    \"/>\n    </figure>\n    <h1>Aaron Gustafson</h1>\n```\n\nAaron 从事网络工作近 15 年，在此期间，他对网络标准产生了浓厚的兴趣，并深入了解网站策略与架构、界面设计以及多种语言（包括\
    \ XHTML、CSS、JavaScript 和 PHP）。Aaron 和他的妻子 Kelly 拥有 <a rel=\"external\" href=\"\
    http://easy-designs.net\">Easy! Designs</a>，这是一家位于田纳西州查塔努加市的精品网络咨询公司。当 Aaron 没有埋首于代码中时，通常你会发现他在宣扬他的发现，并与该领域的其他人分享他的知识和热情。\n\
    \nAaron 曾在 <cite>The New York Times</cite>、Gartner 和美国环境保护署（以及其他机构）培训专业人士，并在世界一流的网络会议上发表演讲，例如\
    \ An Event Apart 和 Web Directions。他是 <a rel=\"external\" href=\"http://webstandards.org\"\
    >网络标准项目 (WaSP)</a> 的集团经理，并担任万维网联盟 <a rel=\"external\" href=\"http://www.w3.org/2005/Incubator/owea/\"\
    >开放网络教育联盟 (OWEA)</a> 的特邀专家。他创建了 <a rel=\"external\" href=\"http://ecsstender.org\"\
    >eCSStender</a>，担任 <a rel=\"external\" href=\"http://alistapart.com\"><cite>A\
    \ List Apart</cite></a> 的技术编辑，是 <a rel=\"external\" href=\"http://netmag.co.uk\"\
    ><cite>.net Magazine</cite></a> 的特约撰稿人，并且凭借其技术写作和编辑工作积累了一个小型图书馆。他的下一本书 <cite>Adaptive\
    \ Web Design: Crafting Rich Experiences with Progressive Enhancement</cite> 预计于\
    \ 2011 年初出版。\n\n---\n\n**脚注**\n\n<sup>11</sup> *[注：原始脚注文本 11 在提供的 OCR 页面中未出现。]*\n\
    \n<sup>12</sup> 关于 Social Graph API 的更多信息可以在 http://code.google.com/apis/socialgraph/\
    \ 找到。Glenn Jones 在出色的 JavaScript 库 Ident Engine (http://identengine.com/) 中使用了这个\
    \ API，他在 A List Apart (http://www.alistapart.com/articles/discovering-magic/)\
    \ 的页面中介绍了它。\n\n<sup>13</sup> `footer` 元素是 HTML5 规范的另一个产物，旨在封装关于 `article`、`section`\
    \ 或页面的“元”信息，例如作者、版权信息等。\n\n<sup>14</sup> 微格式维基 (http://microformats.org/wiki/)\
    \ 维护着所有微格式的列表以及如何使用它们的文档。\n\n<sup>15</sup> http://kaply.com/weblog/operator/\n\
    \n<sup>16</sup> http://visitmix.com/labs/oomph/\n\n<sup>17</sup> http://microformatique.com/optimus/\n\
    \n<sup>18</sup> http://h2vx.com/\n"
