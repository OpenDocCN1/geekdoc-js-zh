    Almost in parallel with the development of these microformats, numerous tools
    sprung up to make use of them. As you can probably guess from my mention of the
    Google Social Graph, search engines have started to pay attention to microformats
    and, in some cases, even rank microformatted content higher than non-microformatted
    content. Browser add-ons-such as Operator^15 and Oomph^16 enable users to extract
    and repurpose microformatted content. Microformat parsers are also available for
    nearly every programming language and there are even web-based services, such
    as Optimus^17 and H2VX^18, that give users more direct access to the microformats
    in use on their sites.


    As you can see, microformats are yet another layer in the progressive enhancement
    continuum, enabling us to make our sites even more useful to our users. After
    all, how cool is it that, using a tool like Operator or a service like Optimus,
    we can enable users to import an event to their calendar or a business card to
    their address book directly from our web page? I think that''s pretty awesome.


