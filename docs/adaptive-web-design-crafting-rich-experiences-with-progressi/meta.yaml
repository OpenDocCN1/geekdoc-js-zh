    And with those two minor adjustments, we''ve covered every landmark role that
    seems sensible to employ on the Retreats 4 Geeks site. Not only that, but we''ve
    improved the overall accessibility of our page by providing easy ways for users
    of assistive technology to move around the document.


    In addition to providing users with a means to find their way around a document,
    the ARIA spec prescribes other helpful tools as well, not the least of which is
    its collection of widget roles and states.


    Widget roles do just what you''d expect them to: describe the role of a given
    element. These roles are generally divided into two camps: roles that provide
    a defined structure, and those that don''t. Or, more simply, containers and components.
    Containers are the elements that house the components of a given widget.


    Consider the tabbed interface shown in Figure 5.1. A tabbed interface is constructed
    from two component parts: a list of tabs and a collection of panels shown by those
    tabs. Those parts break down into three separate roles in the ARIA spec: the tabs
    themselves have a role of “tab,” the list of tabs has a role of “tablist,” and
    each panel is assigned a role of “tabpanel.” In terms of designations, both “tab”
    and “tabpanel” are considered component roles, while “tablist” is considered a
    container role (because it contains the tabs).


    # Pumpkin Pie


    OVERVIEW INGREDIENTS DIRECTIONS NUTRITION


    Whether you''re hosting a festive party or a casual get-together with friends,
    our Pumpkin Pie will make entertaining easy!


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_117_0.png)


    Original recipe yield: 1 × 9-inch deep dish pie


    **Prep Time:** 10min

    **Cook Time:** 1hr

    **Ready In:** 1hr 10min


    Photos by Paul Goyette, licensed under Creative Commons.


    Figure 5.1: A tabbed interface.


    The ARIA spec defines a number of widget roles, making it possible to construct
    anything from complex form controls (e.g., sliders and spinner boxes) to tree-based
    menus, modal dialog boxes, and drag-and-drop interfaces, all while maintaining
    accessibility. And, as with the structural roles we discussed earlier, ARIA even
    provides mechanisms for redefining nonsense markup as something functional:


    ```

    <div role="button">I&#8217;m not a real button, but I play one on the web</div>

    ```


    Of course all of this is well and good, but for any widget to work you need JavaScript
    and, traditionally, that''s been an accessibility no man''s land. The main reason
    that techniques like Ajax and accessibility didn''t mesh well was that the HTML
    language provided no mechanism by which JavaScript could update the user (or her
    assistive technology of choice) in real-time beyond `alert()` and `confirm()`
    (which, let''s face it, are the hooligans at the back of the user interface classroom).


    The ARIA spec addresses issues of context with what are called “states.” ARIA
    states are a set of attributes that can be applied to nearly any element. Some
    are global in scope (i.e., they can be applied to any element), while others are
    specific to certain widget contexts. All are prefaced with “aria-” and they provide
    valuable information to the user about what is going on with a given element.


    Guess what? You''re already familiar with one: aria-hidden. The aria-hidden attribute
    we discussed earlier in this chapter accepts a boolean (“true” or “false”) value
    and lets the user agent or assistive technology know whether or not the content
    within should be exposed to the user. Other examples of ARIA states include aria-disabled,
    aria-expanded, aria-invalid, aria-pressed, and aria-selected.


    In terms of the tabbed interface from Figure 5.1, the states we''d likely want
    to employ would be aria-hidden for the state of the tab panels and aria-selected
    for the state of the tabs themselves.


    But the ARIA spec doesn''t stop there. In addition to state-indicative attributes,
    it also defines numerous properties that can be set on an element. Examples include
    aria-autocomplete, aria-controls, aria-label, aria-labelledby, aria-readonly,
    and aria-required. As you can see, most of the properties are meant for use with
    form controls, but a few (like aria-controls) can apply to our tabbed interface.


    As you probably suspect, the aria-controls takes an id reference for a value and
    that id should belong to the element whose contents or presence is controlled
    by the element to which the attribute is applied. In the case of the tabbed interface,
    the tab would “control” its associated tab panel (as shown in Figure 5.2). With
    the tab-to-tab-panel relationship established, it seems only fair to establish
    the relationship in the other direction as well; that''s where aria-labelledby
    can be put to use. It works in precisely the same way as aria-controls.


    ```

    role="tab" id="recipe-0-tab"

    aria-describedby="recipe-0"

    ```


    ![](img/89eb5062b6d9c42f4b17bd5db9c1c8d1_119_0.png)


    ```

    role="tabpanel" id="recipe-0"

    aria-labelledby="recipe-0-tab"

    ```


    Figure 5.2: Using ARIA properties, we can relate pieces of an interface to one
    another.


    ARIA’s states and properties go a long way toward helping keep the user informed,
    but few concepts in ARIA are as simple and immediately useful as Live Regions.


    # IT’S ALIVE!


    With the advent of Ajax and the resurgence of JavaScript in general, few things
    proved to be more of a user experience nightmare than live-updating regions of
    the page. The usability issues were numerous, but the two big ones were: 1) assistive
    devices weren’t aware of changes to the page and had no way of directing a user’s
    attention to them; and 2) users taking advantage of page zoom or browsing on a
    mobile device are oblivious to content updates occurring off-screen. Thankfully,
    the ARIA spec includes an attribute that directly addresses this egregious problem:
    aria-live.


    What’s most exciting about aria-live is its simplicity. By applying this single
    attribute to an element, you can control how and when content updates within it
    are presented to your users. The aria-live attribute accepts one of three values:


    1. “off” for when updates are frequent and of little importance to the user, as
    in the case of a live stream from your Twitter account (doh!);

    2. “polite” for when updates are only important enough to be announced when the
    user isn’t doing anything, as in the case of updated news headlines; or

    3. “assertive” for when updates are important enough to announce immediately,
    as in the case of form validation messages.


    In the Retreats 4 Geeks website, it makes sense to apply aria-live to the contact
    form:


    ```

    <article id="contact" aria-live="assertive">

    ```


    With that in place, users will be kept abreast of any errors encountered when
    filling in their details and will also be informed when the submission is successful.


