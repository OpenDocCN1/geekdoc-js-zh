  - "[PAGE 35]\n\n```\n<body>\n  <header>\n    <h1><img src=\"/2010/retreat-js/i/logo.png\"\
    \n    alt=\"Retreats 4 Geeks\"/></h1>\n    <nav>\n      <ol>\n        <li><a href=\"\
    #details\" title=\"Find out what\n          this retreat is all about\">Details</a></li>\n\
    \        <li><a href=\"#schedule\" title=\"Get familiar\n          with what this\
    \ retreat will cover\">Schedule\n          </a></li>\n        ...\n      </ol>\n\
    \    </nav>\n  </header>\n  <div id=\"content\">\n    <article id=\"details\"\
    >...</article>\n    <article id=\"schedule\">...</article>\n    ...\n  </div>\n\
    </body>\n```\n\nThe class and id attributes allow page authors to create their\
    \ own semantics on top of those that are part of the spec. Together, these ad-hoc\
    \ semantics imbue the markup with greater meaning and, over time, have gravitated\
    \ toward a common set of classifications and identifiers in use across the globe\
    \ (e.g., div#header and ul#nav). This common set of classifications and identifiers\
    \ has, in turn, provided valuable feedback in the development of the HTML language\
    \ itself (resulting in additions like HTML5’s header and nav elements, which we\
    \ reviewed earlier) and fostered the development of a community-driven set of\
    \ extensions to HTML known as “microformats.”"
