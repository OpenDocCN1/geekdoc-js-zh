  \ lengths))\n  .catch(error => console.error(error))\n\n```javascript\nlengths [\
  \ 2654, 21063, 4105, 22334, 13028, 3584\n]\n```\n\n上面的示例中有很多操作，但重要的要点是：\n\n-   Promises\
  \ 总是返回另一个 `Promise` 对象。\n-   这允许我们链式调用多个 `then`。\n-   该链由多个过程组成，每个过程都会等待直到其前一个过程完成后才运行。\n\
  -   单个 `catch` 方法可以处理由之前任何一个步骤抛出的异常。\n\n## 9.4 ASYNC AND AWAIT\n\n程序员们从不满足于现状，因此\
  \ JavaScript 的最新版本提供了另一个工具来管理异步计算。正如我们在上面看到的，`Promise.then` 的结果是另一个 promise，这允许我们创建长链的\
  \ `.then(…)` 调用。这种方法虽然有效，但它不是可读性最好的表示法，并且已知会产生一种被困住的感觉。\n\n我们可以使用两个新关键字 `async`\
  \ 和 `await` 来避免这种情况。`async` 告诉 JavaScript 函数是非异步的，即它可能想要等待某些事情完成。在异步函数内部，`await`\
  \ 告诉 JavaScript 表现得就像已经等待了某事情完成一样。我们这样结合使用它们：\n\n```javascript\nconst fs = require('fs-extra')\n\
  \nconst statPairAsync = async (filename) => {\n  const stats = await fs.stat(filename)\n\
  \  return {filename, stats}\n}\n```\n\n`statPairAsync('moby-dick.txt').then((white_whale)\
  \ => console.log(white_whale))`async` 函数仍然返回 `Promise`，但我们可以通过 `await` 将这些 promises\
  \ 链起来，正如之前所做的，我们可以使用 `catch` 来处理抛出的异常。让我们使用上一个章节的示例：\n\n```javascript\nconst fs\
  \ = require('fs-extra')\n\nconst glob = require('glob')\n\nconst statPairAsync =\
  \ async (filename) => {\n  const stats = await fs.stat(filename)\n  return {filename,\
  \ stats}\n}\n\nconst countLines = (text) => {\n  return text.split('\\n').length\n\
  }\n\nconst processFiles = async (globpath) => {\n  const filenames = await glob(globpath)\n\
  \  const pairs = await Promise.all(filenames.map(f => statPair(f)))\n  const filtered\
  \ = pairs.filter(pair => pair.stats.size > 100000)\n  const contents = await Promise.all(filtered.map(f\
  \ => fs.readFile(f.filename, ′utf8’)))\n  const lengths = contents.map(c => countLines(c))\n\
  \  return lengths\n}\n\nconst srcDir = process.argv[2]\nprocessFiles(`${srcDir}/**/*.txt`)\n\
  \  .then(lengths => console.log(lengths))\n  .catch(e => console.log(e))\n```\n\n\
  `${srcDir}/**/*.txt)`\n\n## 9.5 EXERCISES\n\n### WHAT’S GOING ON?\n\n这段代码运行正常：\n\
  \n```javascript\n[500, 1000].forEach(t => {\n  console.log('starting…')\n  setTimeout(()\
  \ => {\n    console.log('inside timer', t)\n  }, 0)\n})\n```\n\n但这段代码失败了：\n\n```javascript\n\
  [500, 1000].forEach(async t => {\n  console.log('starting…')\n  await new Promise(resolve\
  \ => setTimeout(() => {\n    resolve()\n  }, 0))\n})\n```\n\n### STAY OF EXECUTION\n\
  \n在下面的代码中插入 `console.log` 调用，以便输出为 Waiting... Finished。这很尖锐，但它是错误的。\n\n```javascript\n\
  const holdingMessage = () => {\n  console.log('Waiting…')\n}\n\nsetTimeout(() =>\
  \ {\n  console.log('Finished')\n}, 100)\n```\n\n### A SYNCHRONOUS OR ASYNCHRONOUS?\n\
  \n你认为这些函数哪些是异步的？如何判断？如果是的话，有什么好的策略可以确定？\n\n1. `findNearestTown(coords)`：给定一组巴西的坐标\
  \ (`coords`)，查找并返回人口超过 5000 的最近定居点。如果坐标超出范围，函数将抛出错误。\n2. `calculateSphereVolume(r)`：计算并返回半径为\
  \ `r` 的球体积。\n3. `calculateRoute(A,B)`：返回机场 `A` 和 `B` 之间所有可能的路线，包括直达路线和不超过 2 次转机的路线。\n\
  \n### HANDLING EXCEPTIONS\n\n执行下面的代码时，你会看到什么输出（如果有的话）？\n\n```javascript\nconst checkForBlanks\
  \ = (inputValue) => {\n  return Promise((resolve, reject) => {\n    if (inputValue\
  \ === '') {\n      reject(Error(\"Blank values are not allowed\"))\n    } else {\n\
  \      resolve(inputValue)\n    }\n  })\n}\n\nnew Promise((resolve, reject) => {\n\
  \  setTimeout(() => {\n    reject(Error('Timed out!'))\n  }, 1000)\n  resolve('')\n\
  }).then(\n  output => checkForBlanks(output), error => console.log(error.message)).then(\n\
  \  checkedOutput => console.log(checkedOutput)).catch(\n  error => console.log(error.message))\n\
  ```\n\n### EMPTY PROMISES\n\n填充下方代码块中的空白 (___)，使得函数返回 `Array[7, 8, 2, 6, 5]`。\n\n\
  ```javascript\nconst makePromise = (someInteger) => {\n  return ___ Promise((resolve,\
  \ reject) => {\n```\n\n\n\n\n```javascript\nsetTimeout(___(someInteger), someInteger\
  \ * 1000)\n})\n}\n\nPromise. ([\n  makePromise(7),\n  makePromise(___),\n  makePromise(2),\n\
  \  makePromise(6),\n  makePromise(5)\n]).then(numbers => ___(numbers))\n```\n\n\
  现在调整该函数，使其只返回 2。（提示：你可以通过只更改其中一个空白字段来实现。）\n\n### 异步，故我在（ASYNC, THEREFORE I AM）\n\
  \n使用 `async` 和 `await` 将上面的函数转换为具有相同行为和输出的异步函数。你觉得你的解决方案比原始版本更容易阅读和理解吗？你认为这仅仅是因为是你自己写了这个版本吗？\n\
  \n### 核心要点\n\n- JavaScript 为延迟计算维护了一个执行队列。\n- 使用 promises 来管理延迟计算，而不是原始的回调函数（callbacks）。\n\
  - 使用带有两个参数的回调函数来处理 promise 的成功（`resolve`）和失败（`reject`）。\n- 使用 `then` 表达成功完成后的下一步，使用\
  \ `catch` 处理错误。\n- 使用 `Promise.all` 等待列表中所有的 promise 完成，使用 `Promise.race` 等待集合中的第一个\
  \ promise 完成。\n- 使用 `await` 等待计算结果。\n- 使用 `async` 标记可以被等待的函数。\n\n# 10 交互式站点\n\n\
  浏览器允许我们定义 `event handlers`（事件处理器）来指定在响应外部触发的操作时执行什么，例如页面加载或用户点击按钮。这些事件处理器仅仅是回调函数，它们（通常）会接收一个包含发生情况信息的\
  \ `event object`（事件对象），虽然我们可以用纯 JavaScript 编写它们，但在 React 中构建它们会变得更加简单。\n\n让我们暂时回到单页示例，展示我们如何将回调函数作为我们正在指定的行为的对象的特定命名属性进行传递。（不要忘记在\
  \ HTML 头部文件中加载所需的库，就像我们在第 7 章中做的那样。）\n\n```html\n<body>\n  <div id=\"app\"></div>\n\
  \  <script type=\"text/babel\">\n    let counter = 0\n    const sayHello = (event)\
  \ => {\n      counter += 1\n      console.log(`Hello, button: ${counter}`)\n   \
  \ }\n    ReactDOM.render(\n      <button onClick={sayHello}>click this</button>,\n\
  \      document.getElementById(\"app\")\n    )\n  </script>\n</body>\n```\n\n正如其名所示，`onClick`\
  \ 是按钮被点击时被调用的事件处理器。在这里，我们告诉 React 调用 `sayHello`，它会将事件对象的计数器加 1，然后打印它的值以及问候消息。\n\n\
  全局变量和函数是组织代码的糟糕方式。将组件定义为类（class）然后使用方法作为事件处理器要好得多：\n\n```html\n<body>\n  <div id=\"\
  app\"></div>\n  <script type=\"text/babel\">\n    class Counter extends React.Component\
  \ {\n      constructor (props) {\n        super(props)\n        this.state = {counter:\
  \ 0}\n      }\n      increment = (event) => {\n        this.setState({counter: this.state.counter+1})\n\
  \      }\n      render =()=>{\n        return (\n          <p>\n            <button\
  \ onClick={this.increment}>increment</button>\n            <br/>\n            current:\
  \ {this.state.counter}\n          </p>\n        )\n      }\n    }\n    ReactDOM.render(\n\
  \      <Counter />,\n      document.getElementById(\"app\")\n    )\n  </script>\n\
  </body>\n```\n\n从下往上看，`ReactDOM.render` 调用将 `<Counter />` 生成的任何 HTML 插入到 ID 为 `\"\
  app\"` 的元素中。在这种情况下，计数器不是一个函数，而是一个包含三个部分的类：\n\n1. 它的构造函数（constructor）将用户提供的属性（props）传递给\
  \ `React.Component` 的构造函数。（在本例中没有属性，但在未来的示例中会有，所以养成这个习惯是好的。）然后，构造函数会创建一个名为 `state`\
  \ 的属性，用于持有该组件的状态。该属性*必须*命名为此名称，这样 React 才知道要监听它的变化。\n2. `increment` 方法使用 `setState`（继承自\
  \ `React.Component`）来更改计数器的值。我们*必须*这样做，而不是通过创建和修改 `this.counter`，因为这样 React 才能察觉到状态的变化并重绘它需要的内容。\n\
  3. `render` 方法取代了我们目前为止使用的函数。它可以执行任何它想做的事，但必须返回某些 HTML（使用 JSX）。在这里，它创建了一个带有事件处理器的按钮并显示了计数器的当前值。\n\
  \n每当使用 `setState` 更新组件状态时，React 都会调用每个组件的 `render` 方法。在后台，React 会进行一些思考以尽量减少重绘：看起来每次段落和计数都被重绘了，但\
  \ React 只会进行尽可能少的重绘。\n\n## 10.1 它行不通\n\n如果我们尝试从命令行运行此程序：\n\n```bash\n$ parcel dev\
  \ src/interactive.html\n> js4ds@0.1.0 dev\n> parcel -p 4000 \"src/interactive.html\"\
  \n\nServer running at http://localhost:4000\n\n/Users/stj/js4ds/src/interactive/app.js:11:12:\
  \ Unexpected token (11:12)\n  9 | }\n  10 | increment = (event) => {\n  11 |   \
  \          ^\n  12 | this.setState({counter: this.state.counter+1})\n  13 | }\n\
  ```\n\n看来 Parcel 不喜欢箭头方法（fat arrow methods）。这是因为 React 默认仍使用 ES6。好吧，让我们尝试使用“普通的”函数定义：\n\
  \n```javascript\n// ...如前文*\nclass Counter extends React.Component {\n  constructor\
  \ (props) {\n    super(props)\n    this.state = {counter: 0}\n  }\n  increment (event)\
  \ {\n    this.setState({counter: this.state.counter+1})\n  }\n  render () {\n  \
  \  return (\n      <p>\n        <button onClick={this.increment}>increment</button>\n\
  \        <br/>\n        current: {this.state.counter}\n      </p>\n    )\n  }\n\
  }\n```\n\n此时看来我们可以编译但无法运行，或者无法将文件打包。但等一下——当我们使用页内脚本时，我们指定类型为 `text/babel` 并在页面头部配合\
  \ React 加载了 https://unpkg.com/babel-standalone@6/babel.js\n\nBabel 能救我们吗？\n\n答案是“肯定的”，尽管这需要在网上进行大量的搜索才能找到答案（特别是当你不知道自己在寻找什么时）。魔力在于在项目根目录下创建一个名为\
  \ `.babelrc` 的文件，并添加以下行：\n\n\n\n\n\n```json\n{\n  \"presets\": [\n    \"react\"\n\
  \  ],\n  \"plugins\": [\n    \"transform-class-properties\"\n  ]\n}\n```\n\n完成这些操作后，我们就可以使用\
  \ `NPM` 安装 `babel-preset-react` 和 `babel-plugin-transform-class-properties`，然后切换回箭头方法。漂亮：一切都运行正常了。\n\
  \n这里发生的情况是，当 Babel 将我们闪烁的现代 JavaScript 翻译成兼容所有浏览器的旧式 JavaScript 时，它会读取 `.babelrc`\
  \ 并遵循该配置。上面的设置告诉它使用 `transform-class-properties` 插件完成 React 所需的所有操作；特别是要接受箭头方法的定义并对其正确绑定。这虽然行得通，但它是某种“疯狂”的形式：程序外部的东西决定了该程序如何被解释，而控制它的命令又放在了另一个配置文件中。尽管如此，这是一种很有用的疯狂，所以我们将继续下去。\n\
  \n## 10.2 模型与视图\n\n良好的应用程序会将“模型”（存储数据）与“视图”（显示数据）分离，以便每个部分都可以独立地进行测试和修改。当我们使用 React\
  \ 时，模型通常是类，而视图通常是纯函数。为了引入这种架构，让我们使用以下内容重新实现计数器：\n\n* `App` 用于存储状态并提供更改状态的方法，\n*\
  \ `NumberDisplay` 用于显示数字，\n* `UpAndDown` 用于提供增加和减少该数字的按钮。\n\n关键的设计特征是，`NumberDisplay`\
  \ 和 `UpAndDown` 并不知道它们正在显示什么，也不知道正在代表它们执行什么操作，这使得它们更容易被复用。当然，没有好事是不徒劳的。我们为将应用程序组织成独立组件而付出的代价是，现在我们必须在每个脚本中导入每个组件的依赖项并导出组件本身。\n\
  \n完成这些操作后，我们的依赖项将由 `parcel` 打包。因此，我们必须从 HTML `header` 中移除脚本加载。整个页面如下：\n\n```html\n\
  <<html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Up and Down</title>\n\
  \  </head>\n  <body>\n    <div id=\"app\"></</div>\n    <script src=\"app.js\"></script>\n\
  \  </body>\n</html>\n```\n\n`NumberDisplay` 类接收一个标签（label）和一个值（value），并将它们放入段落中（记住，标签和值将作为\
  \ `props` 参数的属性出现在我们的函数中）：\n\n```javascript\nconst NumberDisplay = (props) => {\n\
  \  return (<p>{props.label}: {props.value}</p>)\n}\n```\n\n同样，`UpAndDown` 期望两个函数作为它的\
  \ `up` 和 `down` 属性，并使每个函数成为带有适当标签按钮的事件处理器：\n\n```javascript\nconst UpAndDown = (props)\
  \ => {\n  return (\n    <p>\n      <button onClick={props.up}> [+] </button>\n \
  \     <button onClick={props.down}> [-] </button>\n    </p>\n  )\n}\n```\n\n这两个组件在渲染时都会使用\
  \ React 和 `ReactDOM`，因此我们必须导入它们。我们通过在两个组件的开头添加 `import` 语句来实现此点：\n\n```javascript\n\
  import React from \"react\"\nimport ReactDOM from \"react-dom\"\n```\n\n同样，我们的应用程序需要导入\
  \ `UpAndDown` 和 `NumberDisplay` 组件，因此我们需要在它们定义后导出它们。这是通过在组件脚本末尾添加 `export {object_name}`\
  \ 实现的（我们将在练习中探讨为什么大括号是必要的）。对 `UpAndDown` 完成这些操作后，完整的组件脚本如下：\n\n```javascript\nimport\
  \ React from \"react\"\nimport ReactDOM from \"react-dom\"\nconst UpAndDown = (props)\
  \ => {\n  return (\n    <p>\n      <button onClick={props.up}> [+] </button>\n \
  \     <button onClick={props.down}> [-] </button>\n    </p>\n  )\n}\nexport {UpAndDown}\n\
  ```\n\n我们现在准备好构建整个应用程序了。它创建了一个包含计数器的 `state`，并定义了用于增加或减少计数器值的方法。它的 `render` 方法然后使用这些元素布局按钮和当前状态（见图\
  \ 10.1）：\n\n![Image](img/fig10_1.jpg)\n\n图 10.1：React 对象与 DOM\n\n```javascript\n\
  class App extends React.Component {\n  constructor (props) {\n    super(props)\n\
  \    this.state = {counter: 0}\n  }\n  increment = (event) => {\n    this.setState({counter:\
  \ this.state.counter + 1})\n  }\n  decrement = (event) => {\n    this.setState({counter:\
  \ this.state.counter - 1})\n  }\n  render =() {\n    return (\n      <div>\n   \
  \     <UpAndDown up={this.increment} down={this.decrement} />\n        <NumberDisplay\
  \ label='counter' value={this.state.counter} />\n      </div>\n    )\n  }\n}\n```\n\
  \n我们必须像处理其他组件一样导入依赖项。除了 `ReactDOM` 之外，我们还需要包含我们编写的组件。存储在本地的依赖项可以通过提供定义所在的文件路径来导入，并移除文件名中的\
  \ `.js`：\n\n```javascript\nimport React from \"react\"\nimport ReactDOM from \"\
  react-dom\"\nimport {UpAndDown} from \"./UpAndDown\"\nimport {NumberDisplay} from\
  \ \"./NumberDisplay\"\n```\n\n最后，我们可以像以前一样渲染应用程序：\n\n```javascript\nconst mount\
  \ = document.getElementById(\"app\")\nReactDOM.render(<App/>, mount)\n```\n\n这看起来很复杂，因为如果没有这些间接层，我们的小示例会简单得多。然而，我们需要这种策略来管理大型应用程序：数据和事件处理器定义在类中，然后传递给组件进行显示。\n\
  \n## 10.3 获取数据\n\n让我们利用所学知识查看有关近距离小行星的信息。NASA 提供了一个 Web 接口来获取它构建一个包含以下内容的显示：\n\n\
  * 用于提交起始日期的文本框（默认是一周），\n* 小行星列表\n\n这是 `App` 类的第一个版本：\n\n```javascript\nimport React\
  \ from \"react\"\nimport ReactDOM from \"react-dom\"\nimport {AsteroidList} from\
  \ \"./AsteroidList\"\nimport {DateSubmit} from \"./DateSubmit\"\nclass App extends\
  \ React.Component {\n  constructor (props) {\n    super(props)\n    this.state =\
  \ {\n      //fill in..\n    }\n  }\n  onNewDate = (text) => {\n    //fill in..\n\
  \  }\n  render =() {\n    return (\n      <div>\n        <DateSubmit newValue={this.onNewDate}\
  \ />\n        <AsteroidList asteroids={this.state.asteroids} />\n      </div>\n\
  \    )\n  }\n}\nconst mount = document.getElementById(\"app\")\nReactDOM.render(<App/>,\
  \ mount)\n```\n\n我们将通过使用假数据显示小行星来测试它；就像在示例中一样，显示组件 `AsteroidList` 不修改数据，只是在表格中显示它：\n\
  \n```javascript\nimport React from \"react\"\nimport ReactDOM from \"react-dom\"\
  \nconst AsteroidList = (props) => {\n  return (\n    <table>\n      <tbody>\n  \
  \      <tr>\n          <th>Name</th>\n          <th>Date</th>\n          <th>Diameter\
  \ (m)</th>\n          <th>Approach (km)</th>\n        </tr>\n        {props.asteroids.map((a)\
  \ => {\n          return (\n            <tr key={a.name}>\n              <td>{a.name}</td>\n\
  \              <td>{a.date}</td>\n              <td>{a.diameter}</td>\n        \
  \      <td>{a.distance}</td>\n            </tr>\n          )\n        })}\n    \
  \  </tbody>\n    </table>\n  )\n}\nexport {AsteroidList}\n```\n\n如果我们不为创建的元素提供唯一的\
  \ `key` 来区分它们，`React` 会报错，因为拥有这些 `key` 有助于它跟踪组件与 DOM 之间的关系，从而使更新变得高效得多¹。由于每个小行星的名字应该是唯一的，我们使用该名称作为每行的\
  \ `key`。\n\n\n\n\n\n`AsteroidList` 期望数据通过 `props.asteroids` 传入，因此我们先在 `App` 中放置一些虚拟值，稍后将其传递进去：\n\
  \n```javascript\nclass App extends React.Component {\n  constructor (props) {\n\
  \    super(props)\n    this.state = {\n      asteroids: [\n        {name: 'a30x1000',\
  \ date: '2017-03-03', diameter: 30, distance: 1000},\n        {name: 'a5x500', date:\
  \ '2017-05-05', diameter: 5, distance: 500},\n        {name: 'a2000x200', date:\
  \ '2017-02-02', diameter: 2000, distance: 200}\n      ]\n    }\n  }\n  // …other\
  \ 代码..\n}\n```\n\n让我们为 `DateSubmit` 创建一个占位符：\n\n```javascript\nimport React from\
  \ \"react\"\nimport ReactDOM from \"react-dom\"\nconst DateSubmit = (props) => {\n\
  \  return (<p>DateSubmit</p>)\n}\nexport {DateSubmit}\n```\n\n并运行它以图 10.2。\n\n下一步是处理日期提交。由于我们正试图培养良好的习惯，我们将创建一个可复用的组件，其调用者将传入：\n\
  \n* 一个文本标签（label）；\n* 一个用于更新为文本框当前值的变量；\n* 一个在文本框值改变时调用的函数；以及\n* 另一个在点击按钮提交时调用的函数。\n\
  \n```javascript\n// …导入与之前相同...\nconst DateSubmit = ({label, value, onChange, onCommit})\
  \ => {\n  return (\n    <p>\n      {label}:\n      <input type=\"text\" value={value}\
  \ onChange={(event) => onChange(event.target.value)} />\n      <button onClick={(event)\
  \ => onCommit(value)}>new</button>\n    </p>\n  )\n}\nexport {DateSubmit}\n```\n\
  \n注意 `DateSubmit` 参数列表中的解构赋值用法；这是在 第 6.4 节 中引入的，是从 `props` 参数中提取值的简单方法。\n\n理解上述示例中的操作顺序非常重要。`value={value}`\
  \ 在每次调用 `DateSubmit` 时都会在输入框中放入一个值进行显示。我们在每次调用时也将将 `onChange` 和 `onClick` 重新绑定到函数（记住，JSX\
  \ 会翻译成函数调用）。所以是的，每当有人打字时，整个段落都会重新创建，但 React 和浏览器协同工作以尽可能地减少重新计算。\n\n回到我们的应用程序：\n\
  \n```javascript\n// …导入与之前相同...\nclass App extends React.Component {\n  constructor\
  \ (props) {\n    super(props)\n    this.state = {\n      newDate: '',\n      asteroids:\
  \ [\n        //…数据与之前相同...\n      ]\n    }\n  }\n  onEditNewDate = (text) => {\n\
  \    this.setState({newDate: text})\n  }\n  onSubmitNewDate = (text) => {\n    console.log(`new\
  \ date: ${text}`)\n    this.setState({newDate: ''})\n  }\n  render =() {\n    return\
  \ (\n      <div>\n        <h1>Asteroids</h1>\n        <DateSubmit\n          label='Date'\n\
  \          value={this.state.newDate}\n          onChange={this.onEditNewDate}\n\
  \          onCommit={this.onSubmitNewDate} />\n        <AsteroidList asteroids={this.state.asteroids}\
  \ />\n      </div>\n    )\n  }\n}\n// …挂载与之前相同..\n```\n\n将 `this.state.newDate`\
  \ 传递给 `value` 是安全的，因为由于有变化，我们在每次发生变化时都会进行重绘；记住，我们传递的是用于显示的值，而不是一个被修改的引用。请注意我们没有进行任何验证：用户可能会输入\
  \ `abc123` 作为日期，而我们会尝试处理它。现在是时候获取真实数据了，我们将使用 `fetch` 配合 URL 来完成。这将返回一个 promise（第\
  \ 9 章），所以我们将在 `then` 方法中处理 `fetch` 的结果，然后链另一个 `then` 方法将数据转换为我们需要的格式：\n\n```javascript\n\
  // …之前的代码与之前相同...\nonSubmitNewDate = (text) => {\n  const url = `https://api.nasa.gov/neo/rest/v1/feed?api_key=DEMO_KEY&start_date=${text}`\n\
  \  fetch(url).then((response) => {\n    return response.json()\n  }).then((raw)\
  \ => {\n    const asteroids = this.transform(raw)\n    this.setState({\n      newDate:\
  \ '',\n      asteroids: asteroids\n    })\n  })\n}\n// …渲染与之前相同..\n```\n\n逐行来看，步骤如下：\n\
  1. 构建数据的 URL\n2. 开始从该 URL 获取数据\n3. 提供一个在数据到达时执行的回调函数\n4. 提供另一个在数据从文本转换为 JSON 后使用的回调函数（我们将在\
  \ 第 11 章 中详细查看）\n5. 将数据转换为我们需要的格式\n6. 设置状态\n\n最后，转换 NASA 给我们的数据的方法如下：\n\n```javascript\n\
  // 之前的代码与之前...\ntransform = (raw) => {\n  let result = []\n  for (let key in raw.earth_objects)\
  \ {\n    raw.earth_objects[key].forEach((asteroid) => {\n      result.push({\n \
  \       name: asteroid.name,\n        date: asteroid.close_approach_data[0].close_date,\n\
  \        diameter: asteroid.estimated_diameter.meters.max,\n        distance: asteroid.close_approach_data[0].miss_distance.kilometers\n\
  \      })\n    })\n  }\n  return result\n}\n// ... \n```\n\n我们通过查看 NASA 返回的 JSON\
  \ 结构并确定我们需要的字段来构建此。（不幸的是，`earth_objects` 是一个以日期为键的对象，所以我们必须使用 `let...in` 而不是 `map`\
  \ 或 `forEach`）。\n\n## 10.4 练习\n\n### RESET\n在计数器应用程序中添加一个重置按钮，始终将计数器的值设为零。\n\n###\
  \ TRANSFORM\n在引入 Babel 之后，修改所有示例以使用外部脚本而不是内联脚本。\n\n### \n从组件文件导出时，大括号是必要的吗？如果删除它们会发生什么？阅读这篇博客文章](#17_Chapter10.xhtml_fn10_2)，然后考虑在上述示例中使用默认导出和导入是否合适。\n\
  \n### 验证\n修改应用程序，如果当点击按钮时起始日期无效，则应用程序显示警告消息而不是获取数据。\n1. 在状态中添加一个名为 `validDate` 的字段并将其初始化为\
  \ true。\n2. 添加一个 `ErrorMessage` 组件，根据 `validDate` 的值显示包含“日期有效”或“日期无效”的段落。\n3. 修改\
  \ `onSubmitNewDate`，使其或者*获取新数据*或者*修改 `validDate`。\n完成后，在网上搜索 React 验证和错误消息，并探索用于执行此操作的其他工具。\n\
  \n### 关键点总结\n* 定义事件处理器以指定用户与应用程序交互时浏览器应采取的操作。\n* 浏览器将包含事件详情的对象传递给事件处理器。\n* 使用类将状态和事件处理器结合。\n\
  * React 调用类的 `render` 方法来显示它。\n* 将模型（存储数据）与视图（显示数据）分离。\n* 使用 `fetch` 从服务器获取数据。\n\
  * 使用解构一步步从对象中获取单个成员。\n* 现代 JavaScript 使用 promise 管理异步活动。\n\n\n\n\n\n用于表格数据最广泛的文本格式无疑是`逗号分隔值`\
  \ (CSV)。表格的每行都是文件中的一行；每行中的值（即列）由逗号分隔。数字以原始形式出现；字符串可能包含或不包含在引号中，除非它们本身包含逗号，在这种情况下它们一定会被包含：\n\
  \n```\n\"maroon\",128,0,0\n\"olive\",128,128,0\n\"aqua\",0,255,255\n\"fuchsia\"\
  ,2\n55,0,255\n```\n\nCSV 文件的第一行通常是`表头`，用于定义列的名称。例如，上面显示的小表用下面的方式表示更好：\n\n```\n\"\
  name\",\"red\",\"green\",\"blue\"\n\"maroon\",128,0,0\n\"olive\",128,128,0\n\"aqua\"\
  ,0,255,255\n\"fuchsia\",2\n55,0,255\n```\n\n遗憾的是，CSV 并不要求第一行必须是表头，且 CSV 文件通常不指定单位或数据类型。我们可以推测上面表格中的值是整数，但非常常见的情况是\
  \ CSV 文件的列标记为“高度”和“重量”，但没有任何指示显示高度是英尺还是米，或者重量是磅还是千克。\n\nCSV 适用于表格数据，但许多数据并不能整齐地放入行和列中。许多程序员使用\
  \ `JSON` 代替：它支持 JavaScript 中值、数组和对象的语法子集，因此（例如）我们可以这样存储程序的配置值：\n\n```json\n{\n \
  \ \"name\" : \"DataExplorer\",\n  \"version\" : \"1.2.1\",\n  \"preferences\" :\
  \ {\n    \"colorscheme\" : \"dark\",\n    \"autofill\" : true\n  },\n  \"last_opened\"\
  \ : [\n    \"raw/biotic.dat\",\n    \"raw/genomic.dat\",\n    \"cooked/inferred.dat\"\
  \n  ]\n}\n```\n\nJSON 也可以用于表格数据。整个表格是一个数组，每个记录都是一个带有键值对的对象：\n\n```javascript\nconst\
  \ colors = [\n  {\"name\": \"maroon\", \"red\": 128, \"green\": 0, \"blue\": 0},\n\
  \  {\"name\": \"olive\", \"red\": 128, \"green\": 128, \"blue\": 0},\n  {\"name\"\
  : \"aqua\", \"red\": 0, \"green\": 255, \"blue\": 255},\n  {\"name\": \"fuchsia\"\
  , \"red\": 2 55, \"green\": 0, \"blue\": 2 55}\n]\n```\n\n与在表格顶部列出一次字段相比，这样重复字段名是浪费的，但这意味着可以使用类似\
  \ `colors[1].red` 的表达式直接访问行内的字段。\n\n## 11.2 切分数据 (SLicing DATA)\n\n我们将用作示例的数据可以在\
  \ Portal Project Teaching Database 的多种格式中获取。我们将关注 `surveys.csv`，它有超过 35,500 条记录。这些内容非常多，因此我们将创建一个\
  \ 10 条记录的切片进行测试。\n\n虽然取前十条或最后十条很容易，但很有可能两者都不能代表整体数据情况。相反，我们将编写一个短脚本来随机选择一些记录。由于不需要高效，我们将读取所有内容，将每行与一个随机数配对，使用这些随机数作为键对行排序，然后取前几行。\n\
  \n```javascript\nconst fs = require('fs')\nconst [inputFile, numLines, outputFile]\
  \ = process.argv.splice(2)\nconst lines = fs.readFileSync(inputFile, 'utf-8')\n\
  .split('\\n')\nheader = lines[0]\nconst sample = lines.slice(1)\n  .map(line =>\
  \ [Math.random(), line])\n  .sort((left, right) => { return left[0] - right[0] })\n\
  \  .slice(0, parseInt(numLines))\n  .map(pair => pair[1])\nfs.writeFileSync(outputFile,\
  \ header + '\\n' +\nsample.join('\\n'))\n```\n\n当我们在命令行运行它时：\n\n`$ node select-random.js\
  \ ../../data/surveys.csv 10`\n\n`slice.csv`\n\n我们得到了：\n\n```\nrecord_id, month,day,year,plot_id,species_id,sex,hindfoot_length,weight\n\
  18501,3,14,1991,13,OT,M,21,28\n2283,1,15,1980,11,OL,M,21,23\n19941,5,2,1992,1,PP,M,22,13\n\
  27413,12,29,1997,5,,,,\n16002,5,9,1989,19,SC,,,\n28813,11,21,1998,12,DO,M,35,56\n\
  9338,7,4,1984,11,DO,F,35,57\n28336,8,22,1998,7,PB,M,26,23\n25323,3,16,1997,9,DM,F,33,26\n\
  6785,10,23,1982,5,DM,F,37,45\n```\n\n再次运行可能会生成不同的数据切片，因为我们没有指定随机数生成的 `seed`（种子）。我们是坏人，会在练习题中修复这一点。\n\
  \n> **切分命令行参数**\n>\n> *当我们运行：：*\n>\n> `$ node select-random.js ../../data/surveys.csv\
  \ 10`\n> `slice.csv`\n> `process.argv` 包含五个字符串：`node`、`select-random.js`、输入文件、行数和输出文件。`process.argv.slice(2)`\
  \ 丢弃了 0 和 1，留下我们需要的三个：`inputFile`、`numLines` 和 `outputFile`。\n\n我们决定我们的数据管理器能够回答两个问题：\n\
  \n1. 我们有多少条记录，涵盖了哪些年份？\n2. 给定年份的重量值是多少？\n\n我们将使用 PapaParse 来解析我们的 CSV，所以第一步是安装它：\n\
  \n`$ npm install paparse`\n\n```javascript\nconst fs = require('fs')\nconst papa\
  \ = require('paparse')\n\nclass DataManager {\n  constructor (filename) {\n    const\
  \ raw = fs.readFileSync(filename, 'utf-8')\n    const options = {header: true, dynamicTyping:\
  \ true}\n    this.data = papa.parse(raw, options).data\n  }\n}\n\nmodule.exports\
  \ = DataManager\n```\n\n`papa.parse` 两个参数：要解析 CSV 以及控制解析器行为的配置对象。此配置是高度自定义的；在这里，`options`\
  \ 指示解析器将第一行视为头部（设置列名称）并将像数字的内容转换为数字。`papa.parse` 的输出如下：\n\n```json\n{\n  \"data\"\
  : [\n    {\"record_id\": 18501, \"month\": 3, \"day\": 14, \"year\": 1991, \"plot_id\"\
  : 13, \"species_id\": \"OT\", \"sex\": \"M\", \"hindfoot_length\": 21, \"weight\"\
  : 28},\n    {\"record_id\": 2283, \"month\": 1, \"day\": 15, \"year\": 1980, \"\
  plot_id\": 11, \"species_id\": \"OL\", \"sex\": \"M\", \"hindfoot_length\": 21,\
  \ \"weight\": 23},\n    ...\n    {\"record_id\": 6785, \"month\": 10, \"day\": 23,\
  \ \"year\": 1982, \"plot_id\": 5, \"species_id\": \"DM\", \"sex\": \"F\", \"hindfoot_length\"\
  : 37, \"weight\": 45}\n  ],\n  \"errors\": [],\n  \"meta\": {\n    \"delimiter\"\
  : \",\",\n    \"linebreak\": \"\\n\",\n    \"aborted\": false,\n    \"truncated\"\
  : false,\n    \"cursor\": 350,\n    \"fields\": [\"record_id\", \"month\", \"day\"\
  , \"year\", \"plot_id\", \"species_id\", \"sex\", \"hindfoot_length\", \"weight\"\
  ]\n  }\n}\n```\n\n所以 `papa.parse(raw, options).data` 获取了我们想要的 JSON  数据。让我们写一个方法来获取整体统计信息：\n\
  \n```javascript\ngetSurveyStats () {\n  return {\n    year_low: this._get(this.data,\
  \ 'year', Math.min),\n    year_high: this._get(this.data, 'year', Math.max),\n \
  \   record_count: this.data.length\n  }\n}\n\n// ...其他方法...\n\n_get(values, field,\
  \ func) {\n  return func(...values.map(rec => rec[field]).filter(val => !isNaN(val)))\n\
  }\n```\n\n\n\n\n\n`Math.min` 和 `Math.max` 等函数接受任意数量的标量值作为参数，但并不直接处理数组。输入`扩展语法`（spread\
  \ syntax）……符号 `func(…array)` 意味着“将数组中的所有值作为独立的参数传递”，这让我们避免了编写自定义的最小值和最大值函数。因此，`func(…this.data.map(rec\
  \ => rec[field]))` 意味着“从 `this.data` 中的每条记录中选择指定的字段以创建一个字段数组，然后将这些值作为参数传递给 `func`”。我们在\
  \ `_get` 名称的开头包含了一个下划线，表示我们打算将其仅在 `DataManager` 内部使用，而不是在其他地方调用。\n\n添加一个获取特定年份范围内重量和后跟长度的方法相对简单。首先，我们写一个函数来计算一个或多个参数的平均值：\n\
  \n```javascript\nconst _average = (…values) => {\n  let sum = 0\n  for (let v of\
  \ values) {\n    sum += v\n  }\n  return sum / values.length\n}\n```\n\n如果 `_average`\
  \ 接收一个数组而不是可变数量参数会更自然，但我们希望能够像使用 `Math.min` 和 `Math.max` 那样使用它，所以我们必须符合它们的签名。\n\n\
  经过思考，我们意识到子集可能是空的——也就是说，数据集中可能存在某些没有数据的年份。我们应该过滤掉这些年份，以防止在渲染带有 `NaN` 值的摘要统计数据时进行无用功。记住\
  \ JavaScript 中的空数组不是假值（参考第 2 章），我们决定测试每个年份过滤后的子集是否至少包含一个项目。\n\n我们最后需要确保的是每个数据对象都有唯一的键，这将使得在我们准备好渲染数据时，React\
  \ 能够高效地更新数据的显示。\n\n现在获取年份范围值的方法是：\n\n```javascript\ngetSurveyRange (minYear, maxYear)\
  \ {\n  return Array(1 + maxYear - minYear)\n    .fill(0)\n    .map((v, i) => minYear\
  \ + i)\n    .map(year => {\n      const subset = this.data.filter(r => r.year ===\
  \ year)\n      if (subset.length) {\n        return {\n          key : toString(year),\n\
  \          year : year,\n          min_hindfoot_length :this._get(subset, 'hindfoot_length',\
  \ Math.min),\n          ave_hindfoot_length :this._get(subset, 'hindfoot_length',\
  \ _average),\n          max_hindfoot_length :this._get(subset, 'hindfoot_length',\
  \ Math.max),\n          min_weight : this._get(subset, 'weight', Math.min), ave_weight\
  \ : this._get(subset, 'weight', _average),\n          max_weight : this._get(subset,\
  \ 'weight', Math.max)\n        }\n      }\n    })\n}\n```\n\n## 11.4 练习](#07_Contents.xhtml_ch11-4)\n\
  \n## 数据追踪\n\n追踪创建原始数据小样本的实用程序的执行过程，解释传递到每个链式方法调用中的内容。\n\n### 非随机\n\n依赖随机数的程序是无法测试的，因为（故意）没有方法可以预测它们的输出。幸运的是，计算机程序并不真正使用随机数：它们使用以一种可重复但不可预测的方式生成的`伪随机数`。给定相同的初始种子，伪随机数生成器总是产生相同的数值序列。\n\
  \n原生无法无法为 `Math.random` 设置种子，但 `seedrandom`18_Chapter11.xhtml_fn11_3) 包提供了一个为此目的附加函数。安装该包并修改切片选择工具，使其接受单词或短语作为命令行参数，并使用它为随机数生成器设置种子。\n\
  \n### 每年一条记录\n\n为了测试划分数据的另一种方法是从每年选择一条记录。编写一个小型命令行 JavaScript 程序，功能如下：\n\n1. 从 CSV\
  \ 读取所有数据。\n2. 保留每年每年找到的第一条记录。\n3. 将这些记录格式化为 SQL 插入语句并打印。\n\n### 错误处理\n\n修改 `DataManager`\
  \ 的构造函数以检查错误。\n\n### 泛化\n\n修改 `getSurveyRange` 使其可以这样调用：\n\n```javascript\ngetSurveyRange(minYear,\
  \ maxYear, 'hindfoot_length')\n```\n\n### 处理命令行参数\n\n读取 `process.argv`[18_Chapter11.xhtml_fn11_4)\
  \ 并使用 `slice`。\n\n### 关键点\n\n- 小型数据集通常是逗号分隔值（`CSV`）。\n- `CSV` 只能表示单元。\n- 嵌套数据通常是\
  \ JavaScript 对象表示法（`JSON`）。\n- `JSON` 表示法通常包含。\n- `PapaParse` 是一个健的库。\n\n# 12 创建服务器\n\
  \n现在我们已经有了数据 (11_Chapter11.xhtml))，下一步是创建一个服务器，我们将构建它。\n\n## 12.1 HTTP\n\nWeb 上的几乎一切都通过超文本传输协议（`HTTP`）进行通信。`HTTP`\
  \ 的核心是指定请求类型的`请求/响应`循环。\n\n1. 客户端（浏览器或其他程序）建立连接。\n2. 然后发送一个指定请求内容的文本块。\n3. 服务器返回\
  \ HTML。\n4. 关闭连接。\n5. 客户端解析文本并意识到需要一张图片。\n6. 向服务器发送另一个文本块请求该图片。\n7. 服务器返回文件内容。\n\
  8. 关闭连接。\n\n为了显示单个页面，这个循环可能会重复多次，因为每个图片、CSS 文件都需要单独的请求。在实践中，做了大量的后台工程来保持连接存活并缓存可能重使用的项目。\n\
  \nHTTP 请求只是一个包含两个重要部分的文本块：\n\n- `method`（方法）几乎总是 `GET`（获取数据）或 `POST`（提交数据）。\n- `URL`\
  \ 通常是文件的路径，但正如我们下面看到的，解释它完全取决于服务器。\n\n![Image](img/fig12_1.jpg)\n\n图 12.1：HTTP 请求/响应循环\n\
  \n![Image](img/fig12_2.jpg)\n\n图 12.2：HTTP 请求结构\n\n请求还可以包含**标头**，即包含关于客户端请求更多信息的键值对。示例包括：\n\
  \n- `\"Accept: text/html\"` 指定客户端想要 HTML\n- `\"Accept-Language: fr, en\"` 指定客户端偏好法语，但也接受英语。\n\
  - `\"If-Modified-Since: 16-May-2018\"` 服务器客户端只对最近的数据感兴趣\n\n与字典不同，键可以出现任意次数，这允许请求执行诸如指定它接受多种内容类型的操作。请求的**正文**（body）是与之关联的任何额外数据，例如正在上传的文件。如果存在正文，请求必须包含\
  \ `Content-Length` 标头，以便服务器知道需要读取多少数据（图 12.2）。\n\n\n\n\nHTTP 响应中的头部和正文具有相同的格式，含义也相同。至关重要的是，响应还包含一个\
  \ `status code`，用于指示发生了什么：200 表示 OK，404 表示“页面未找到”，等等。其中一些常见的代码显示在表 12.1 中。\n\n我们需要理解的最后一点是\
  \ URL 的结构和解释。这个：\n\n`http://example.org:1234/some/path?value=deferred&limit=200`\n\
  \n包含五个部分：\n\n-   协议 `http`，规定了将使用哪些规则来交换数据。\n-   主机名 `hostname` `example.org`，告诉客户端哪里寻找服务器。如果我们自己在自己的电脑上运行服务器进行测试，可以使用名称\
  \ `localhost` 来连接它。（计算机依赖名为 `DNS` 的服务来查找与人类可读主机名关联的机器，但它的操作不在本教程的范围内。）\n\n| **代码**\
  \ | **名称** | **含义** |\n| --- | --- | --- |\n| 100 | Continue | 客户端应该继续发送数据 |\n|\
  \ 200 | OK | 请求已成功 |\n| 204 | No Content | 服务器已完成请求但没有数据 |\n| 301 | Moved Permanently\
  \ | 资源已移动到新的永久位置 |\n| 307 | Temporary Redirect | 资源临时位于不同的位置 |\n| 400 | Bad Request\
  \ | 请求格式错误 |\n| 401 | Unauthorized | 请求需要身份验证 |\n| 404 | Not Found | 找不到请求的资源 |\n\
  | 408 | Timeout | 服务器放弃等待客户端 |\n| 418 | I’m a Teapot | 一个愚人节的玩笑 |\n| 500 | Internal\
  \ Server Error | 处理请求时发生了服务器错误 |\n| 601 | Connection Timed Out | 服务器在连接超时之前未响应 |\n\
  \n**表 12.1 HTTP 状态码**\n\n-   端口 `port` `1234`，告诉客户端去哪里调用它想要的服务。（如果说主机像一栋办公大楼，那么端口就像这栋大楼里的电话号码。我们认为电话号码有物理位置，这一事实说明了我们的年龄……）\n\
  -   路径 `/some/path` 告诉服务器客户端想要什么。\n-   查询参数 `query parameters` `value=deferred and\
  \ limit=200`。这些位于问号之后，用 am 符号分隔，用于提供额外信息。\n\n以前通过路径识别服务器上的实际文件很常见，但服务器可以按照自己的意愿解释路径。特别是当我们在编写数据服务时，路径的段可以标识我们正在请求什么数据。或者，通常的做法是将路径看作标识我们想要调用的服务器上的函数，并将查询参数看作该函数的参数。在我们看到简单服务器如何工作之后，我们将回到这些观点上。\n\
  \n## 12.2 HELLO, EXPRESS\n\n一个名为 `Express` 的基于 Node 的库为我们处理了大部分 HTTP 细节。当我们使用 `Express`\
  \ 构建服务器时，我们提供了接受三个参数的回调函数：\n\n-   原始请求，\n-   我们正在构建的响应，\n-   以及下一步做什么（我们现在将忽略它）。\n\
  \n我们还为每个函数提供了一个模式，规定了它要匹配的 URL。这是一个简单的示例：\n\n```javascript\nconst express = require('express')\n\
  const PORT = 3418\n// *主服务器对象*.\nconst app = express()\n// *返回一个静态页面*.\napp.get('/',\
  \ (req, res, next) => {\n  res.status(200).send('<html><body><h1>Asteroids</h1></body></html>')\n\
  })\napp.listen(PORT, () => {console.log('listening…') })\n```\n\n第一行代码加载了 Express\
  \ 库。接下来定义了我们将监听的端口，第三行创建了将执行大部分工作的对象。\n\n随后，`app.get` 的调用告诉该对象处理任何针对 `/` 的 GET 请求，发送一个状态为\
  \ 200 (OK) 且正文仅包含一个 h1 标题的 HTML 页面。磁盘上并没有实际的 HTML 文件，事实上，浏览器根本无法知道是否存在：服务器可以针对它想要处理的任何请求发送它想的任何内容。\n\
  \n注意，`app.get` 并没有立即获取任何内容。相反，它向 `Express` 注册了一个回调，说：“当你看到这个 URL 时，调用此函数来处理它。”正如我们下面将看到的，我们可以注册任意数量的路径/回调对来处理不同的事情。\n\
  \n最后，此脚本的最后一行告诉我们的应用程序在指定的端口上监听，而回调告诉它在开始运行时打印一条消息。当我们运行它时，我们看到：\n\n```bash\n$ node\
  \ static-page.js\nlistening...\n```\n\n我们的小服务器现在正在等待某些向它请求东西。如果我们进入浏览器并请求 `http://localhost:3418/`，我们就会得到一个带有大标题\
  \ Asteroids 的页面。我们的服务器已经工作了，我们现在可以通过 Ctrl-C 停止它。\n\n\n\n\n1. 客户端请求的 URL 通过 `req.url`\
  \ 传递给我们。\n\n2. 我们使用 `path.join` 将其与根目录路径结合，该路径是我们在运行服务器运行时从命令行参数中获取的。\n\n3. 我们尝试使用\
  \ `readFileSync` 读取该文件，这会阻塞服务器直到文件被读取完毕。稍后我们将看到如何进行这种异步 I/O 操作，以便我们的服务器具有更高的响应能力。\n\
  \n4. 一旦文件被读取，我们就用状态码 200 返回它。\n\n如果一个名为 `web-dir` 的子目录包含一个名为 `title.html` 的文件，并且我们这样运行服务器：\n\
  \n```\n$ node serve-pages.js ./web-dir\n```\n\n那么我们就可以请求 [`http://localhost:3418/title.html`](http://localhost:3418)\
  \ 并获取 `web-dir/title.html` 的内容。注意，目录 `./web-dir` 并没有出现在 URL 中：我们的服务器解释所有路径，就好像我们给它的目录就是文件系统的根目录一样。\n\
  \n如果我们请求一个不存在的页面，如 [`http://localhost:3418/missing.html`](http://localhost:3418)，我们会得到：\n\
  \n```\nError: ENOENT: no such file or directory, open ′web-dir/missing.html′\n\t\
  at Object.openSync (fs.js:434:3)\n\tat Object.readFileSync (fs.js:339:35)\n… etc.\
  \ ...\n```\n\n我们将在练习中看到如何为我们的服务器添加适当的错误处理。\n\n> 收藏夹和图标\n> *如果我们使用浏览器请求如 `title.html`\
  \ 这样的页面，浏览器实际上可能会发送两次请求：一个是请求页面，另一个请求名为 `favicon.ico` 的文件。浏览器会自动执行操作，然后在标签页、书签列表等地方显示该文件。尽管有\
  \ `.ico` 后缀，该文件（通常）是一个较小的 PNG 格式图像，并且必须放置在网站的根目录下。*\n\n## 12.5 内容类型\n\n到为止，我们只提供了\
  \ HTML，但服务器可以发送任何类型的数据，包括图像和其他二进制文件。例如，让我们提供一些 JSON 数据：\n\n*// …如前所示..*.\n\n```javascript\n\
  app.use((req, res, next) => {\n  const actual = path.join(root, req.url)\n  if (actual.endsWith(′.json′))\
  \ {\n    const data = fs.readFileSync(actual, ′utf-8′) const json = JSON.parse(data)\n\
  \    res.setHeader(′Content-Type′, ′application/json′) res.status(200).send(json)\n\
  \  }\n  else {\n    const data = fs.readFileSync(actual, ′utf-8′)\n    res.status(200).send(data)\n\
  \  }\n})\n```\n\n这里的不同之处在于当请求的路径以 `.json` 结尾时，我们显式地将 `Content-Type` 头部设置为 `application/json`，告诉客户端如何解释我们返回的字节。如果我们使用\
  \ `web-dir` 作为提供服务的目录运行此服务器，并请求 [`http://localhost:3418/data.json`](http://localhost:3418)，现代浏览器将提供数据的折叠显示，而不是显示原始文本。\n\
  \n> 什么是 API？\n> 库的**应用程序编程接口**（API）简单来说就是其他程序允许调用的函数集合。这通常是库中定义的所有函数的子集，因为许多函数可能是仅供内部使用的辅助函数。同样，服务器的\
  \ API 是它知道如何响应的请求集。例如，NASA 的近地小行星 API（第 10.3 节）可以处理包含身份验证密钥和日期的请求，而我们在本章中构建的服务器可以响应对\
  \ HTML 和 JSON 文件的请求。我们将在 第 15.2 节*更深入地查看 API 设计。\n\n## 12.6 练习\n\n### 报告缺失文件\n\n\
  修改从磁盘返回文件的服务器版本，如果找不到文件，则报告 404 错误。如果文件存在但无法读取（例如，如果服务器没有权限），它应该返回什么？\n\n### 提供图像\n\
  \n修改从磁盘返回文件的服务器版本，使得如果请求的文件名以 `.png` 或 `.jpg` 结尾，则带有正确的 `Content-Type` 头部返回。\n\n\
  ### 延迟响应\n\n我们的文件服务器使用 `fs.readFileSync` 读取文件，这意味着它在每次请求文件时都会停止，而不是在等待文件读取时处理其他查询。修改传递给\
  \ `app.use` 的回调，使其使用带回调的 `fs.readFile`。\n\n### 使用查询参数\n\nURL 可以包含如下形式的查询参数：\n\n\
  http://site.edu?first=123&second=beta\n\n阅读 Express 的在线文档² 以了解如何在服务器中访问它们，然后编写一个服务器来执行简单的算术运算：URL\
  \ [`http://localhost:3654/add?left=1&right=2`](http://localhost:3654) `应该返回 3`，而\
  \ URL `http://localhost:3654/subtract?left=1&right=2` 。\n\n### 关键要点\n\n- HTTP 请求由头部和可选主体组成。\n\
  - HTTP 是无状态协议。\n- Express 提供简单的路径匹配。\n- 使用回调函数来处理请求。\n- 使用 `Content-Type` 指定数据类型。\n\
  - 使用**断言**（assertions）来编写测试。\n\n# 13 测试\n\n我们是坏人，因为我们一直在编写代码而不测试。在本节中我们将通过测试来救自己。JavaScript\
  \ 测试是以函数进行的。一个名为测试运行器（test runner）的独立程序找到测试函数，运行它们并报告结果。每个测试可能有三种结果：\n\n- `pass`：一切正常；\n\
  - `fail`：系统未按预期工作；\n- `error`：测试本身出现问题\n\n我们可以将测试组合成测试套件（suites），并将套件组合成更大的套件，以便轻松运行相关的测试集。这使得开发过程中的测试更快，从而让我们更有可能去这样做。最后，我们使用断言来编写测试本身。\n\
  \n## 13.1 引入 Mocha\n\nJavaScript 的测试库几乎和前端框架一样。我们将使用一个名为 Mocha[¹ 的流行且文档良好的库。与我们之前过的库不同，我们不需要导入任何东西来使用它；相反，是它导入我们的代码并调用我们的函数。\n\
  \n当我们编写 Mocha 要运行的测试时，我们使用名为 `describe` 的函数创建一个测试组，并使用名为 `it` 的函数作为该组中的每个测试：\n\n\
  ```javascript\ndescribe('first test', () => {\n  it('should run without errors',\
  \ (done) => {\n    done()\n  })\n})\n```\n\n正如示例所示，`describe` 的参数是一个解释性字符串和一个回调函数。该回调调用\
  \ `it`，它接收：\n\n- 另一个描述系统应该如何的解释性字符串；\n- 一个接收函数（约定命名为 `done`）的回调。\n\n（选择这个名字是因为当我们朗读测试时，听起来就像我们在说“它应该这样做或那样”。）在每个测试结束时我们调用\
  \ `done` 来信号它已完成。我们必须这样做是因为回调是无序的，所以 Mocha 需要知道每个回调何时完成。\n\n\n\n\n\n我们可以通过调用 `mocha`\
  \ 并传递包含测试用的文件路径，在 shell 中运行测试：\n\n```bash\n$ ./node_modules/.bin/mocha path/to/test.js\n\
  ```\n\n第一个测试\n\n+ 应该无错误地运行\n\n1 个通过 (12ms)\n\n与打包一样，我们通常将 `mocha` 命令放在 `package.json`\
  \ 中，这样 `./node_modules/.bin` 就会被自动包含在路径中。在我们添加以下内容：\n\n```json\n{\n  …\n  \"scripts\"\
  : {\n    …\n    \"test\": \"mocha\",\n    …\n  }\n}\n```\n\n到 `package.json` 之后，我们的命令变为：\n\
  \n```bash\n$ npm test – path/to/test.js\n```\n\n（再次，– 之后的所有内容都会传递给脚本本身。）如果我们不指定查找测试的位置，Mocha\
  \ 会查找一个名为 `test` 的目录，并运行其中找到的以 `test` 开头的文件（图 13.1）。\n\n## 13.2 重构\n\n下一步是重构（refactor）我们的软件以使其可测试。对于我们的服务器，我们必须：\n\
  \n- 将监听端口的代码移动到一个文件中，并且\n- 让该文件导入一个包含执行其他所有代码的文件。\n\n![Image](img/fig13_1.jpg)\n\
  \n图 13.1：运行中的 Mocha\n\n一旦完成这些，我们就可以在其他环境中运行服务器代码。这里是实际启动服务器的 `standalone.js` 文件：\n\
  \n```javascript\nconst server = require('./server')\nconst PORT = 3418\n\nserver.listen(PORT,\n\
  \  () => { console.log(`listening on port ${PORT}…`) })\n```\n\n这里提取到 `server.js`\
  \ 中的应用程序代码，以便我们对其测试：\n\n```javascript\nconst express = require('express')\n// *主服务器对象*.\n\
  let app = express()\n\n// *根页面*.\napp.get('/', (req, res, next) => {\n  res.status(200).send('<html><body><h1>Home</h1></body></html>')\n\
  })\n\n// …如之前一样…\nmodule.exports = app\n```\n\n在继续之前，我们运行以下命令来检查我们没有破坏任何东西：\n\n\
  ```bash\n$ node standalone.js\n```\n\n## 13.3 测试服务器\n\n好了：现在我们已经提取了特定于服务器的代码，我们如何测试它呢？答案是另一个名为\
  \ `supertest` 的库，它向 Express 服务器发送伪造的 HTTP 请求，该服务器已经按照我们刚刚拆的方式进行了拆分，并且它允许我们与该服务器的响应进行交互。\n\
  \n![Image](img/fig13_2.jpg)\n\n图 13.2：Supertest 对比现实\n\n这是一个简单请求的测试，使用 Mocha 管理测试，并使用\
  \ `supertest` 的 `request` 函数向服务器发送内容并检查结果：\n\n```javascript\nconst assert = require('assert')\n\
  const request = require('supertest')\nconst server = require('./server')\n\ndescribe('server',\
  \ () => {\n  it('应该返回带有预期标题的 HTML', (done) => {\n    request(server)\n      .get('/')\n\
  \      .expect(200)\n      .expect('Content-Type', /html/)\n      .end((err, res)\
  \ => {\n        assert(res.text.includes('Home'), '包含预期标题')\n        done()\n  \
  \    })\n  })\n})\n```\n\n逐行分析：\n\n1. `request(server)` 开始构建一个要发送的请求。\n2. `.get('/')`\
  \ 指定了我们要发送的 URL 路径。\n3. `.expect(200)` 检查返回码是否为 200 (OK)。\n4. `.expect('Content-Type',\
  \ /html/)` 根据正则表达式检查返回值中的内容类型 (附录 H)。\n5. `.end` 在接收整个响应后被调用，即我们可以开始查看页面内容或服务器发送的数据时。\n\
  6. 在 `end` 的回调内部，`res` 是结果数据。我们确保它的文本（即 `res.text`）包含“Home”一词。我们真的应该在这里检查 `err`\
  \ 以确保一切运行正常，但我们并不那么高尚。\n7. 最后，我们调用 `done()` 来指示测试的结束。再次，我们必须这样做，因为 Mocha 无法知道外层的\
  \ `.end(…)` 何时会被调用。\n\n让我们运行代码：\n\n```text\nserver\n+ 应该返回带有预期标题的 HTML (48ms)\n\
  1 个通过 (58ms)\n```\n\n太棒了：让我们添加一些测试。\n\n```javascript\ndescribe('server', () => {\n\
  \  it('应该返回带有预期标题的 HTML', (done) => {\n    // …如之前一样\n  })\n  it('应该返回带有预期标题的 HTML\
  \ 页面', (done) => {\n    request(server)\n      .get('asteroids')\n      .expect(200)\n\
  \      .expect('Content-Type', /html/)\n      .end((err, res) => {\n        assert(res.text.includes('Asteroids'))\n\
  \        done()\n      })\n  })\n  it('其他页面应该返回 404', (done) => {\n    request(server)\n\
  \      .expect(404)\n      .get('other')\n      .end((err, res) => {\n        assert(res.text.includes('ERROR'))\n\
  \        done()\n      })\n  })\n})\n```\n\n```text\nserver\n+ 应该返回带有预期标题的 HTML\
  \ (42ms)\n+ 应该返回带有预期标题的 HTML 页面 + 其他页面应该返回 404\n3 个通过 (62ms)\n```\n\n注意，我们检查了当我们在请求不存在的内容时，服务器是否发送了\
  \ 404。确保系统优雅地失败与确保它在被要求时提供数据同样重要。\n\n## 13.4 检查 HTML\n\n服务器返回由客户端渲染的数据而不是生成并返回 HTML\
  \ 变得越来越常见，但某些服务器仍然执行后者。*不要*尝试用子字符串或正则表达式来检查这一点：异常之亦有异常，而那条路将通向疯狂[13_3)。相反，我们应该解析\
  \ HTML 以在内存中创建一个结构并检查它；如果由于 HTML 格式不正确而导致解析失败，那是值得知道的。我们要的结构是新的 DOM，为了获取它，我们将使用另一个名为\
  \ `cheerio` 的库。`cheerio.load` 将 HTML 转换为 DOM 树；生成的对象可以像函数一样使用。这是我们的测试：\n\n```javascript\n\
  const assert = require('assert')\nconst request = require('supertest')\nconst cheerio\
  \ = require('cheerio')\nconst server = require('./server')\n\ndescribe('server',\
  \ () => {\n  it('应该有正确的标题', (done) => {\n    request(server)\n      .get('/')\n\
  \      .expect('Content-Type', /html/)\n      .expect(200)\n      .end((err, res)\
  \ => {\n        const tree = cheerio.load(res.text)\n        assert.equal(tree('h1').length,\
  \ 1, '标题数量正确')\n        assert.equal(tree('h1').text(), 'Home', '标题文本正确')\n    \
  \    done()\n      })\n  })\n})\n```\n\n```text\nserver\n+ 应该有正确的标题 (67ms)\n1 个通过\
  \ (77ms)\n```\n\n这像之前一样获取页面，解析它，然后查找 `h1` 元素并检查它的（注意这并没有检查标签，因为 `.text()` 会合并所有子元素的文本）。我们不会进一步探索这种方法，因为我们将提供用于渲染的数据而不是生成并发送\
  \ HTML，但如果你进行任何网络爬虫，像 `cheerio` 这样的库可以帮助。\n\n## 13.5 练习\n\n## 未完成\n\n如果我们在测试中忘记调用\
  \ `done()` 会怎样？\n\n### 添加测试\n\n1. 对于 asteroids 应用，你可以添加的最有用的测试是什么？为什么？\n2. 实现它。\n\
  3. 问问自己为什么像这样的教程没有说*“请实现它*”。反思一下这个问题也没有说“请”。你是否习惯于由于这一个词词所体现的家长式权力关系，以及这个问题中体现的略显不舒服的讽刺幽默尝试？\n\
  \n### 生命周期\n\n假设有一个 JavaScript 程序，包含一些 JSX 表达式，这些表达式生成 HTML，由浏览器读取并显示。画一个图来显示包含“data”单词的\
  \ H1 标题从开始到结束的形式。\n\n### 关键点\n\n- 单元测试隔离地检查一个软件组件的行为。\n- 单元测试的结果可以是通过、失败或错误。\n-\
  \ 使用 Mocha 编写和运行 JavaScript 单元测试。\n- 在单元测试中使用断言检查结果。\n\n\n\n\n\n-   将测试用例组合成套以便于管理。\n\
  -   将模块划分为交互部分和非交互部分以便于测试。\n-   使用 `supertest` 模拟与服务器的交互进行测试。\n-   HTML 在内存中通过文档对象模型（DOM）表示。\n\
  -   测试时，检查 DOM 的结构而非 HTML 的文本表示。\n\n# 14 使用 Data-Forge\n\n现在我们已经看到了如何在 JavaScript\
  \ 中完成除了实际的数据科学之外，数据科学家想要做的所有操作。遗憾的是，这是该语言仍然落后于 R 和 Python 的领域之一，但统计库现在正在出现，如果说过去的十五年教会了我们什么，那就是不要低估\
  \ JavaScript。\n\n在本章中，我们将查看一个名为 `Data-Forge` 的库，它是专为处理表格数据设计的。`Data-Forge` 的灵感来自\
  \ Python 的 `Pandas` 库，但对于任何在 R 中用过 tidyverse 的人来说，它也应该熟悉。它的 `DataFrame` 类表示一个由命名列和任意数量行组成的表格。Dataframes\
  \ 是不可变的：一旦构建了 dataframe，其内容就无法更改。相反，每个操作都会产生一个新的 dataframe。（一些巧妙的后台数据回收使得这比听起来要高效得多。）\n\
  \n像 Pandas 和 tidyverse 一样，Data-Forge 设计用于处理整洁数据（tidy data）。正如 [Wick2014] 定义，如果满足以下条件，表格数据就是整洁的：\n\
  \n-   每列包含一个统计变量（即一个测量或观测的属性）。\n-   每个不同的观测值位于不同的行。\n-   每组观测值对应有一张表格。\n-   如果有多个表格，每个表格都有一列包含唯一键（unique\
  \ key），以便链接相关数据。\n\n例如，这些数据不是整洁的：\n\n| 鼠类胸膜炎率 | | | |\n| | 女性 | 男性 |\n| | 2018 |\
  \ 2019 | 2018 | 2019 |\n| Jan | 0.05 | 0.07 | 0.03 | 0.06 |\n| Feb | 0.05 | 0.08\
  \ | 0.04 | 0.07 |\n| Mar | 0.05 | 0.11 | 0.04 | 0.10 |\n\n但这些数据是整洁的：\n\n| 年份 | 月份\
  \ | 性别 | 速率 |\n| :--- | :--- | :--- | :--- |\n| 2018 | Jan | 女性 | 0.05 |\n| 2018\
  \ | Feb | 女性 | 0.05 |\n| 2018 | Mar | 女性 | 0.05 |\n| 2018 | Jan | 男性 | 0.03 |\n\
  | 2018 | Feb | 男性 | 0.04 |\n| 2018 | Mar | 男性 | 0.04 |\n| 2019 | Jan | 女性 | 0.07\
  \ |\n| 2019 | Feb | 女性 | 0.08 |\n| 2019 | Mar | 女性 | 0.11 |\n| 2019 | Jan | 男性 |\
  \ 0.06 |\n| 2019 | Feb | 男性 | 0.07 |\n| 2019 | Mar | 男性 | 0.10 |\n\n## 14.1 基础操作\n\
  \n开始之前，我们使用 `npm install data-forge` 安装 Data-Forge，然后加载库并从对象列表创建一个 dataframe。这些对象中的每个必须使用相同的键，这些键将成为\
  \ dataframe 列名：\n\n```javascript\nconst DF = require('data-forge')\nconst fromObjects\
  \ = new DF.DataFrame([\n  {ones: 1, tens: 10},\n  {ones: 2, tens: 20},\n  {ones:\
  \ 3, tens: 30}\n])\nconsole.log('fromObjects:\\n', fromObjects)\n```\n\n当我们打印 dataframe\
  \ 时，我们看到了这个相当复杂的结构：\n\n```text\nfromObjects:\nDataFrame {\n  configFn: null,\n \
  \ content: {\n    index: CountIterable {},\n    values: [ [Object], [Object], [Object]\
  \ ],\n    pairs: MultiIterable { iterables: [Array] },\n    isBaked: true,\n   \
  \ columnNames: [ 'ones', 'tens' ]\n  }\n}\n```\n\n每一列都存储用一个 `Series` 对象；偶尔，我们需要直接处理这些对象，而不是处理整个\
  \ dataframe。（图 14.1）。如果我们想查看实际数据，需要将 dataframe 回对象数组：\n\n```javascript\nconsole.log('fromObjects\
  \ as array:\\n', fromObjects.toArray())\n```\n\n```text\nfromObjects as array:\n\
  [ { ones: 1, tens: 10 },\n  { ones: 2, tens: 20 },\n  { ones: 3, tens: 30 } ]\n\
  ```\n\n我们可以通过在一个列表中提供列名并在另一个列表中提供行值来创建一个 dataframe：\n\n![图像](img/fig14_1.jpg)\n\n\
  图 14.1：表格是如何存储的\n\n```javascript\nconst fromSpec = new DF.DataFrame({\n  columnNames:\
  \ ['ones', 'tens'],\n  rows: [\n    [4, 40],\n    [5, 50],\n    [6, 60]\n  ]\n})\n\
  console.log('fromSpec as array:\\n', fromSpec.toArray())\n```\n\n```text\nfromSpec\
  \ as array:\n[ { ones: 4, tens: 40 },\n  { ones: 5, tens: 50 },\n  { ones: 6, tens:\
  \ 60 } ]\n```\n\n然而，我们通常不会这样直接创建 dataframe；相反，我们将从文件或数据库中读取数据。Data-Forge 提供了一个名为\
  \ `fromCSV` 的函数来此此：\n\n```javascript\nconst text = 'ones,tens\n7,70\n8,80\n9,90'\n\
  const fromText = DF.fromCSV(text)\nconsole.log('fromText as array:\\n', fromText.toArray())\n\
  ```\n\n```text\nfromText as array:\n[ { ones: '7', tens: '70' },\n  { ones: '8',\
  \ tens: '80' },\n  { ones: '9', tens: '90' } ]\n```\n\n无论我们如何创建 dataframe，都可以向它询问列名：\n\
  \n```javascript\nconsole.log(data.getColumnNames())\n```\n\n```text\n[ ' ones',\
  \ ' tens' ]\n```\n\n或者获取其列表列表（而不是对象列表）：\n\n```javascript\nconsole.log(data.toRows())\n\
  ```\n\n```text\n[ [ 1, 10 ], [ 2, 20 ], [ 3, 30 ] ]\n```\n\n我们还可以使用 for 循环处理行：\n\
  \n```javascript\nfor (let row of data) {\n  console.log(row)\n}\n```\n\n```text\n\
  { ones: 1, tens: 10 }\n{ ones: 2, tens: 20 }\n{ ones: 3, tens: 30 }\n```\n\n或者使用它的\
  \ `forEach` 方法：\n\n```javascript\ndata.forEach(row => {\n  console.log(row)\n})\n\
  ```\n\n```text\n{ ones: 1, tens: 10 }\n{ ones: 2, tens: 20 }\n{ ones: 3, tens: 30\
  \ }\n```\n\n然而，一个好的经验法是，如果你在 dataframe 上使用循环，说明你做错了：你理应该使用下面的方法。\n\n## 14.2 执行计算\n\
  \n假设我们想给 dataframe 添加一个新列——或者更准确地说，创建一个带有额外列的新 dataframe，因为我们不能在原地修改 dataframe。要做到这一点，我们创建一个新的\
  \ `Series` 对象来表示该列，然后使用 `withSeries` 构建我们的结果：\n\n```javascript\nconst double_oh\
  \ = new DF.Series([100, 200, 300])\nconst withHundreds = data.withSeries({hundreds:\
  \ double_oh})\nconsole.log(withHundreds.toArray())\n```\n\n```text\n[ { ones: 1,\
  \ tens: 10, hundreds: 100 },\n  { ones: 2, tens: 20, hundreds: 200 },\n  { ones:\
  \ 3, tens: 30, hundreds: 300 } ]\n```\n\n就像我们通常通过从外部源读取数据创建 dataframe 一样，我们通常也会从现有值创建新列。你可能不会惊讶地发现我们通过编写回调告诉\
  \ Data-Forge 如何这样做。由于我们经常一次创建多个列，我们给 `generateSeries` 方法一个对象，其键为新列名，其值为接收行作为输入并产生新值的回调：\n\
  \n```javascript\nconst sumsAndProducts = data.generateSeries({\n  sum: row => row.ones\
  \ + row.tens,\n  product: row => row.ones * row.tens\n})\nconsole.log(sumsAndProducts.toArray())\n\
  ```\n\n```text\n[ { ones: 1, tens: 10, sum: 11, product: 10 },\n  { ones: 2, tens:\
  \ 20, sum: 22, product: 40 },\n  { ones: 3, tens: 30, sum: 33, product: 90 } ]\n\
  ```\n\n我们还可以使用 `dropSeries` 完全删除列：\n\n```javascript\nconst justResults = sumsAndProducts.dropSeries([\"\
  ones\", \"tens\"])\nconsole.log(justResults.toArray())\n```\n\n```text\n[ { sum:\
  \ 11, product: 10 },\n  { sum: 22, product: 40 },\n  { sum: 33, product: 90 } ]\n\
  ```\n\n由于每个 dataframe 方法都返回一个 dataframe，我们可以使用**方法链式**来组合操作（图 14.2）。我们以前在 promise\
  \ 的 then 调用链中见过这种技术；在这里，它的用法就像 Unix 命令行中的管道或现代 R 代码中的管道运算符 `%%>%` 一样：\n\n```javascript\n\
  const result = data\n  .withSeries({hundreds: double_oh})\n  .generateSeries({\n\
  \    sum: row => row.ones + row.tens + row.hundreds\n  })\n  .dropSeries([\"ones\"\
  , \"tens\", \"hundreds\"])\n  .toArray()\n```\n\n为了让结果更容易理解，我们通常想对数据进行排序。假设我们有一个文件包含几种颜色的红绿蓝值：\n\
  \n```text\nname,red,green,blue\nmaroon,128,0,0\nlime,0,255,0\nnavy,0,0,128\nyellow,255,255,0\n\
  fuchsia,255,0,255\naqua,0,255,255\n```\n\n\n\n\n我们可以将此文件名作为命令行参数传递给程序，读取它（记得将编码设置为\
  \ UTF-8，以便我们获得的是字符而不是原始字节），然后将其显示：\n\n```javascript\nconst fs = require('fs')\n\
  const DF = require('data-forge')\nconst text = fs.readFileSync(process.argv[2],\
  \ 'utf-8')\nconst colors = DF.fromCSV(text)\n\nconsole.log(colors.toArray())\n[\
  \ { name: 'maroon', red: '128', green: '0', blue: '0' },\n  { name: 'lime', red:\
  \ '0', green: '255', blue: '0' },\n  { name: 'navy', red: '0', green: '0', blue:\
  \ '128' },\n  { name: 'yellow', red: '255', green: '255', blue: '0' },\n  { name:\
  \ 'fuchsia', red: '255', green: '0', blue: '255' },\n  { name: 'aqua', red: '0',\
  \ green: '255', blue: '255' } ]\n```\n\n![Image](img/fig14_3.jpg)\n图 14.3: 排序与子排序\n\
  \n如果我们想按字母顺序查看颜色，我们调用 `orderBy` 并传入一个回调函数，该函数返回 Data-Forge 用于排序的值：\n\n```javascript\n\
  const sorted = colors.orderBy(row => row.name)\nconsole.log(sorted.toArray())\n\
  [ { name: 'aqua', red: '0', green: '255', blue: '255' },\n  { name: 'fuchsia', red:\
  \ '255', green: '0', blue: '255' },\n  { name: 'lime', red: '0', green: '255', blue:\
  \ '0' },\n  { name: 'maroon', red: '128', green: '0', blue: '0' },\n  { name: 'navy',\
  \ red: '0', green: '0', blue: '128' },\n  { name: 'yellow', red: '255', green: '255',\
  \ blue: '0' } ]\n```\n\n若要按另一列（[图 14.3]）子排序，我们使用 `thenBy`：\n\n```javascript\nconst\
  \ doubleSorted = colors\n  .orderBy(row => row.green)\n  .thenBy(row => row.blue)\n\
  \  .dropSeries(['name', 'red'])\nconsole.log(doubleSorted.toArray())\n[ { green:\
  \ '0', blue: '0' },\n  { green: '0', blue: '128' },\n  { green: '0', blue: '255'\
  \ },\n  { green: '255', blue: '0' },\n  { green: '255', blue: '0' },\n  { green:\
  \ '255', blue: '255' } ]\n```\n\n我们可以使用 `distinct` 去除重复项：\n\n```javascript\nconst\
  \ notTheSame = colors.distinct(row => row.red)\nconsole.log(notTheSame.toArray())\n\
  [ { name: 'maroon', red: '128', green: '0', blue: '0' },\n  { name: 'lime', red:\
  \ '0', green: '255', blue: '0' },\n  { name: 'yellow', red: '255', green: '255',\
  \ blue: '0' } ]\n```\n\n但这比看起来要复杂。每行确实都有不同的 `red` 值，但 Data-Forge 会会决定从每个子集中保留哪一行。更令人惊讶的是，多列\
  \ `distinct` 是不起作用的：\n\n```javascript\nconst multiColumn = colors\n  .distinct(row\
  \ => [row.red, row.green])\n  .orderBy(row => row.red)\n  .thenBy(row => row.green)\n\
  console.log(multiColumn.toArray())\n[ { name: 'navy', red: '0', green: '0', blue:\
  \ '128' },\n  { name: 'lime', red: '0', green: '255', blue: '0' },\n  { name: 'aqua',\
  \ red: '0', green: '255', blue: '255' },\n  { name: 'maroon', red: '128', green:\
  \ '0', blue: '0' },\n  { name: 'fuchsia', red: '255', green: '0', blue: '255' },\n\
  \  { name: 'yellow', red: '255', green: '255', blue: '0' } ]\n```\n\n这并不是 Data-Forge\
  \ 的错。在 JavaScript 中，只有当两个数组是同一个对象时，它们才相等，即 `[0] === [0]` 为 `false`。我们将在练习中探索实现多列\
  \ `distinct` 的方法。\n\n## 14.3 子集\n\n你可能已经注意到上面表格中的颜色值是字符串而不是数字。如果我们想让 Data-Forge\
  \ 将值转换为更有用的类型，我们可以使用 `parseDates`、`parseFloats` 等方法。下面的程序对关于 2016 年 8 月的 USGS 数据子集进行了这些操作：\n\
  \n```javascript\nconst fs = require('fs')\nconst DF = require('data-forge')\nconst\
  \ text = fs.readFileSync(process.argv[2], 'utf-8')\nconst earthquakes = DF.fromCSV(text)\n\
  \  .parseDates('Time')\n  .parseFloats(['Latitude', 'Longitude', 'Depth_Km', 'Magnitude'])\n\
  console.log('Data has', earthquakes.count(), 'rows')\n```\n\n无论是否转换，我们经常想对子集进行操作。我们可以通过\
  \ `head` 和 `tail` 按位置选择数据（图 14.4）：\n\n```javascript\nconsole.log(earthquakes.head(3).toArray())\n\
  [ ... ]\n\nconsole.log(earthquakes.skip(10).take(3).toArray())\n[ ... ]\n```\n\n\
  \n\n如输出所示，`groupBy` 返回一个数组，其中包含原始数据中每个组对应的新 `data-frame`。以下是我们根据震级查找地震平均深度的方法：\n\
  \n```javascript\nconst averaged = earthquakes\n  .groupBy(row => row.Magnitude)\n\
  \  .select(group => ({\n    Magnitude: group.first().Magnitude,\n    Depth_Km: group.deflate(row\
  \ => row.Depth_Km).average()\n  }))\n  .inflate()\n  .orderBy(row => row.Magnitude)\n\
  \nconsole.log(averaged.toArray())\n```\n\n[ { Magnitude: 2, Depth_Km: 9.901052631578946\
  \ },\n  { Magnitude: 2.1, Depth_Km: 9.702083333333333 },\n  { Magnitude: 2.2, Depth_Km:\
  \ 9.843037974683545 },\n…\n  { Magnitude: 4.5, Depth_Km: 9.4 },\n  { Magnitude:\
  \ 5.4, Depth_Km: 8 },\n  { Magnitude: 6, Depth_Km: 8.1 } ]\n\n逐步分析：\n\n1. `groupBy`\
  \ 调用产生了一个包含 28 个 `data-frames` 的列表，每个数据框对应一个不同的 `Magnitude` 值。\n2. 接着 `select` 将这些\
  \ `data-frames` 中的每一个转换为一个对象，其 `Magnitude` 等于组内第一个元素的震级，而 `Depth_Km` 是深度的平均值。\n\
  \   - 我们可以使用组内第一个元素的震级，因为组内所有的震级都是相同的。\n   - 我们还必须记住使用 `deflate` 将 `data-frame`\
  \ 的一列转换为 `Series`，这样我们就可以调用 `average` 了。\n\n![Image](img/fig14_5.jpg)\n\n图 14.5：分组汇总\n\
  \n3. `select` 的输出是一个包含两个值之对象的 `Series`，因此我们必须调用 `inflate` 将其转换回 `data-frame`。\n\
  4. 最后，我们根据地震的震级进行排序以生成输出结果。\n\n图 14.5 图形展示了这些步骤。起初很容易忘记 `inflate` 和 `deflate` 步骤（我们在编写这个示例时也忘了），但它们很快就会变成习惯。\n\
  \n## 14.5 现实生活\n\n为了结束对 `Data-Forge` 的探索，我们将探索来自 [`dataisplural/data.world`](http://dataisplural)\
  \ 的数据，查找过去十年美国国家公园的年度游客人数。我们的策略是：\n\n1. 导入数据，\n2. 检查列以确保数据清洗，\n3. 修复我们发现的任何问题，\n\
  4. 按年份对数据分组并汇总总人数，然后\n5. 过滤并保留大于 2009 年的年份。\n\n我们将从读取数据并查看前几行开始：\n\n```javascript\n\
  const fs = require('fs')\nconst DF = require('data-forge')\nconst text = fs.readFileSync('../../data/national_parks.csv',\
  \ 'utf-8')\nconst raw = DF.fromCSV(text)\n\nconsole.log(raw.head(2).toArray())\n\
  ```\n\n[ { year: '1904',\n  gnis_id: '1163670',\n  geometry: 'POLYGON',\n  metadata:\
  \ 'NA',\n  number_of_records: '1',\n  parkname: 'Crater Lake',\n  region: ' PW',\n\
  \  state: 'OR',\n  unit_code: 'CRLA',\n  unit_name: 'Crater Lake National Park',\n\
  \  unit_type: 'National Park',\n  visitors: '1500' },\n{ year: '1941',\n  gnis_id:\
  \ '1531834',\n  geometry: 'MULTIPOLYGON',\n  metadata: 'NA',\n  number_of_records:\
  \ '1',\n  parkname: 'Lake Roosevelt',\n  region: ' PW',\n  state: ' WA',\n  unit_code:\
  \ 'LARO',\n  unit_name: 'Lake Roosevelt National Recreation Area',\n  unit_type:\
  \ 'National Recreation Area',\n  visitors: '0' } ]\n\n在深入任何分析之前，查看数据结构总是好的。`data-frame`\
  \ 方法 `detectTypes` 向我们展示了 `data-frame` 中数据类型的频率：\n\n```javascript\nconst typesDf\
  \ = raw.detectTypes()\nconsole.log(typesDf.toString())\n```\n\n| `__index__` | `Type`\
  \ | `Frequency` | `Column` |\n| :--- | :--- | :--- | :--- |\n| `0` | `string` |\
  \ `100` | `year` |\n| `1` | `string` | `100` | `gnis_id` |\n| `2` | `string` | `100`\
  \ | `geometry` |\n| `3` | `string` | `100` | `metadata` |\n| `4` | `string` | `100`\
  \ | `number_of_records` |\n| `5` | `string` | `100` | `parkname` |\n| `6` | `string`\
  \ | `100` | `region` |\n| `7` | `string` | `100` | `state` |\n| `8` | `string` |\
  \ `100` | `unit_code` |\n| `9` | `string` | `100` | `unit_name` |\n| `10` | `string`\
  \ | `100` | `unit_type` |\n| `11` | `string` | `100` | `visitors` |\n\n在深入任何分析之前，查看数据结构总是好的。`data-frame`\
  \ 方法 `detectTypes` 向我们展示了 `data-frame` 中数据类型的频率：\n\n```javascript\nconst typesDf\
  \ = raw.detectTypes()\nconsole.log(typesDf.toString())\n```\n\n（注：原文文本中存在大量重复，此处已根据要求进行去重和逻辑处理。）\n\
  \n\n\n编写一个短的管道（pipeline），打印出 `year` 和 `visitors` 列中最终转换为 `NaN` 的值。（提示：复制这些列，将副本转换为数字，过滤以保留这些行，然后打印原始值。）\n\
  \n### 关键点\n\n-   从具有相同键的对象数组创建 `DataFrame`，或者从带有 `columnNames` 和 `rows` 字段的规范（spec），或者通过解析包含\
  \ CSV 或 JSON 的文本创建。\n-   如果你在 dataframe 上使用循环，那么你的方法用错了。\n-   使用链式调用（method chaining）来创建管道，从而过滤数据并从旧值创建新值。\n\
  -   使用分组（grouping）和聚合（aggregation）对数据进行摘要。\n\n# 15 毕业项目\n\n是时候将所有内容整合到一个扩展示例中了：一个对来自\
  \ Portal Project 教学数据库的物种数据的（略）交互式可视化。我们的计划是：\n\n-   为测试切分数据，\n-   编写一个数据服务器来提供这些数据，\n\
  -   测试服务器，\n-   构建数据的交互式表格，\n-   添加可视化。\n\n这将需要一些新想法，但大部分将重温之前出现的内容。\n\n## 15.1\
  \ 数据管理器\n\n我们可以完全使用在第 11 章构建的相同的数据管理器，但让我们应用我们新发现的 Data-Forge 库知识。提醒一下，我们数据管理器中的关键类是：\n\
  \n```javascript\nclass DataManager {\n  constructor (filename) {\n    // …从 CSV\
  \ 文件读取并存储数据*…\n  }\n  getSurveyStats () {\n    // …返回摘要统计数据*…\n  }\n  getSurveyRange\
  \ (minYear, maxYear) {\n    //…返回数据切片…\n  }\n}\n```\n\n新的 `DataManager` 必须仍然从 CSV\
  \ 文件读取数据开始，因此我们保留使用 `fs` 打开文件的代码行，并转换 `constructor:` 的剩余部分：\n\n```javascript\nconstructor\
  \ (filename) {\n  const raw = fs.readFileSync(filename, 'utf-8')\n  this.data =\
  \ DF.fromCSV(raw)\n    .parseInts(['record_id', 'month', 'day', 'year', 'plot_id'])\n\
  \    .parseFloats(['hindfoot_length', 'weight'])\n}\n```\n\n记得我们为了为每年汇总数据而不得不编写的\
  \ `_get` 方法吗？处理 dataframe 允许我们避免在 `getSurveyStats` 中自己完成工作，并使代码变得相对容易阅读：\n\n```javascript\n\
  getSurveyStats () {\n  return {\n    year_low: this.data.deflate(row => row.year).min(),\n\
  \    year_high: this.data.deflate(row => row.year).max(),\n    record_count: this.data.count()\n\
  \  }\n}\n```\n\n我们还必须适配 `getSurveyRange` 以配合 dataframe：\n\n```javascript\ngetSurveyRange\
  \ (minYear, maxYear) {\n  return Array(1 + maxYear - minYear)\n    .fill(0)\n  \
  \  .map((v, i) => minYear + i)\n    .map(year => {\n      const subset = this.data.where(r\
  \ => r.year === year)\n      if (subset.count()) {\n        return {\n         \
  \ key: toString(year),\n          year: year,\n          min_hindfoot_length: subset.deflate(r\
  \ => r.hindfoot_length).min(),\n          ave_hindfoot_length: subset.deflate(r\
  \ => r.hindfoot_length).average(),\n          max_hindfoot_length: subset.deflate(r\
  \ => r.hindfoot_length).max(),\n          min_weight: subset.deflate(r => r.weight).min(),\n\
  \          ave_weight: subset.deflate(r => r.weight).average(),\n          max_weight:\
  \ subset.deflate(r => r.weight).max()\n        }\n      }\n    })\n}\n```\n\n这消除了对\
  \ `_get` 方法的需求，但当我们测试代码时，发现对于许多可疑的年份，在应该显示摘要值的地方显示了空白。通过仔细检查，我们发现 `min` 和其他汇总方法对缺失数据敏感：如果被调用的序列中缺少任何值，它们将返回\
  \ `NaN`；如果所有值都缺失，则返回 `undefined`。因此，在以下之前，我们需要一个额外的过滤器来移除我们感兴趣的列（重量和后脚长度）中缺失数据的行：\n\
  \n```javascript\nif (subset.count()) {\n  return {\n    key: toString(year),\n \
  \   year: year,\n    min_hindfoot_length: subset.where(r => !isNaN(r.hindfoot_length)).deflate(r\
  \ => r.hindfoot_length).min(),\n    ave_hindfoot_length: subset.where(r => !isNaN(r.hindfoot_length)).deflate(r\
  \ => r.hindfoot_length).average(),\n    max_hindfoot_length: subset.where(r => !isNaN(r.hindfoot_length)).deflate(r\
  \ => r.hindfoot_length).max(),\n    min_weight: subset.where(r => !isNaN(r.weight)).deflate(r\
  \ => r.weight).min(),\n    ave_weight: subset.where(r => !isNaN(r.weight)).deflate(r\
  \ => r.weight).average(),\n    max_weight: subset.where(r => !isNaN(r.weight)).deflate(r\
  \ => r.weight).max()\n  }\n}\n```\n\n通过这些更改，我们发现，尽管在某些年份中存在缺失值，但汇总方法在处理这些时会返回 `NaN`\
  \ 或 `undefined`，除非该序列中至少存在一个观测值。\n\n## 15.2 服务器\n\n服务器将与第 12 章的几乎相同。然而，我们需要将它连接到数据管理器。我们将通过驱动程序创建一个数据管理器，然后在创建服务器时将其传递给服务器：\n\
  \n```javascript\nconst DataManager = require('./data-manager')\nconst server = require('./server-0')\n\
  const PORT = 3418\nconst filename = process.argv[2]\nconst db = new DataManager(filename)\n\
  const app = server(db)\n\napp.listen(PORT, () => {\n  console.log(`listening on\
  \ port ${PORT}...`)\n})\n```\n\n正如你可能猜到的，由于我们引用了 `server-0`，将来我们将进行一些更改。这是与其协作的服务器开头：\n\
  \n```javascript\nconst express = require('express')\n\n// 'dataManager' 是指向数据库的全局变量。\n\
  // 它必须在创建服务器时设置。\nlet dataManager = null\n\n// 主服务器对象。\nconst app = express()\n\n\
  // …处理请求…\n\nmodule.exports = (dbm) => {\n  dataManager = dbm\n  return app\n}\n\
  ```\n\n\n\n我们将在下一节介绍如何处理数据请求。目前最重要的是我们管理与数据管理器连接的方式。在 `server-0.js` 的底部，我们导出一个函数，将它的唯一参数赋值给名为\
  \ `dataManager` 的变量。在处理请求的方法中，我们能够向 `dataManager` 发送数据库查询。\n\n该变量在该文件中是全局的，但由于它没有被导出，因此在外部是不可见的。这类变量被称为**模块变量**，它们为我们提供在模块函数之间共享信息的方法，而不会让模块外部的任何地方对该信息造成（直接）破坏。\n\
  \n## 15.3 API\n\n下一步是决定我们服务器的 API 将什么，即它将理解哪些 URL 以及这些 URL 将获取什么数据。`GET /survey/stats`\
  \ 将以单个 JSON 记录的形式获取统计摘要，而 `GET /survey/:start/:end` 则获取年份范围内的聚合值。（我们将作为一个练习，对年份范围添加错误检查。）任何其他内容都将返回\
  \ 404 错误代码和一个 HTML 片段，告诉我们是“坏人”。我们将这些代码放在 `server.js` 中，并将命令行驱动程序放在 `driver.js`\
  \ 中以便于测试。服务器函数如下：\n\n```javascript\n// Get survey statistics.\napp.get('/survey/stats',\
  \ (req, res, next) => {\n  const data = dataManager.getSurveyStats()\n  res.setHeader('Content-Type',\
  \ 'application/json')\n  res.status(200).send(data)\n})\n\n// Get a slice of the\
  \ survey data.\napp.get('/survey/:start/:end', (req, res, next) => {\n  const start\
  \ = parseInt(req.params.start)\n  const end = parseInt(req.params.end)\n  const\
  \ data = dataManager.getSurveyRange(start, end)\n  res.setHeader('Content-Type',\
  \ 'application/json')\n  res.status(200).send(data)\n})\n```\n\n我们还写了一个错误处理函数：\n\
  \n```javascript\n// Nothing else worked.\napp.use((req, res, next) => {\n  page\
  \ = `<html><body><p>error: \"${req.url}\" not found</p></body></html>`\n  res.status(404)\n\
  \    .send(page)\n})\n```\n\n现在让我们来编写第一个测试：\n\n```javascript\nconst path = require('path')\n\
  const assert = require('assert')\nconst request = require('supertest')\nconst DataManager\
  \ = require('./data-manager')\nconst make_server = require('./server-0')\nTEST_DATA_PATH\
  \ = path.resolve( dirname, 'test-data.csv')\ndescribe('server', () => {\n  it('should\
  \ return statistics about survey data', (done) => {\n    expected = {\n      minYear:\
  \ 1979,\n      maxYear: 2000,\n      count: 10\n    }\n    const db = new DataManager(TEST_DATA_PATH)\n\
  \    const server = make_server(db)\n      .get('/survey/stats')\n      .expect(200)\n\
  \      .expect('Content-Type', 'application/json')\n      .end((err, res) => {\n\
  \        assert.deepEqual(res.body, expected, '')\n        done()\n      })\n  })\n\
  })\n```\n\n注意年份范围是 1979-2000，这**不是**完整数据集中的范围。我们通过以下命令运行：\n\n```bash\nnpm test –\
  \ src/capstone/back/test-server.js\n```\n\n并且它通过了。\n\n## 15.4 THE DISPLAY\n\n前端是对之前所做内容的简单复述。有一个名为\
  \ `index.html` 的单 HTML 页面：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Creatures</title>\n\
  \    <meta charset=\"utf-8\">\n    <script src=\"app.js\" async></script>\n  </head>\n\
  \  <body>\n    <div id=\"app\"></</div>\n  </body>\n</html>\n```\n\n`app.js` 中的主应用导入了组件，用于显示统计摘要、选择年份范围以及显示年度数据。API\
  \ 调用与组件之间没有那种紧紧的耦合，但这不是一个糟糕的起点。注意我们正在使用 `import`是因为我们正尝试现代化，尽管后端需要 `require`。\n\n\
  ```javascript\nimport React from 'react'\nimport ReactDOM from 'react-dom'\nimport\
  \ SurveyStats from './SurveyStats'\nimport ChooseRange from './ChooseRange'\nimport\
  \ DataDisplay from './DataDisplay'\n\nclass App extends React.Component {\n  constructor(props)\
  \ {\n    super(props)\n    this.baseUrl = 'http://localhost:3418'\n    this.state\
  \ = {\n      summary: null,\n      start: '',\n      end: '',\n      data: null\n\
  \    }\n  }\n\n  componentDidMount() {\n    const url = `${this.baseUrl}/survey/stats`\n\
  \    fetch(url).then((response) => {\n      return response.json()\n    }).then((summary)\
  \ => {\n      this.setState({\n        summary: summary\n      })\n  }\n}\n```\n\
  \n`componentDidMount` 方法是新的：它首次获取数据，以便用户在加载页面时能看到内容。我们没有自己调用这个方法；相反，React 会在我们的应用程序及其子组件加载后自动调用它。我们不能在应用程序构造函数中获取初始数据，因为我们无法控制显示部分初始化的顺序。好在，我们可以直接使用\
  \ `response.json()`，因为我们知道来源返回的是 JSON。该方法是更新摘要的地方，因为底层数据没有发生变化。\n\n接下来我们需要处理在“start”和“end”框中的输入。网页中的\
  \ HTML 控件无需我们的帮助即可捕获字符，但我们在状态中需要这些值：\n\n```javascript\nonStart = (start) => {\n\
  \  this.setState({\n    start: start\n  })\n}\nonEnd = (end) => {\n  this.setState({\n\
  \    end: end\n  })\n}\n```\n\n当点击按钮时，我们向相应的 URL 发送 JSON 数据请求并将结果记录在应用程序的状态中。React\
  \ 会注意到状态变化并为我们调用 `render`。更准确地说，当响应到达时浏览器会调用第一个回调，当数据转换为 JSON 后后调用第二个回调。\n\n```javascript\n\
  onNewRange = () => {\n  const params = {\n    method: 'GET',\n    headers: {\n \
  \     'Accept': 'application/json',\n      'Content-Type': 'application/json'\n\
  \    }\n  }\n  const url = `${this.baseUrl}/survey/${this.state.start}/${this.state.end}`\n\
  \  fetch(url, params).then((response) => {\n    return response.json()\n  }).then((data)\
  \ => {\n    this.setState({\n      data: data\n    })\n  })\n}\n```\n\n现在让我们用 `SurveyStats`、`ChooseRange`、`DataChart`\
  \ 和 `DataDisplay` 更新显示，它们都是无状态组件（即它们显示内容但不改变任何内容）：\n\n```javascript\nrender = ()\
  \ => {\n  const tableStyle = {overflow: 'scroll', height: '200px'}\n  return (\n\
  \    <div>\n      <h1>Creatures</h1>\n      <SurveyStats data={this.state.summary}\
  \ />\n      <ChooseRange\n        start={this.state.start} onStart={this.onStart}\n\
  \        end={this.state.end} onEnd={this.onEnd}\n        onNewRange={this.onNewRange}\n\
  \      />\n      <DataChart data={this.state.data} />\n      <div style={tableStyle}>\n\
  \        <DataDisplay data={this.state.data} />\n      </div>\n    </div>\n  )\n\
  }\n```\n\n## 15.5 THE TABLES\n\n我们将表格的形式显示调查统计数据，并在没有数据时显示段落回退。首先，我们在页面顶部以表格形式显示整个数据集的统计摘要（由我们之前为\
  \ `GET /survey/stats 查询` 的处理程序返回）。再次，我们需要在 HTML 片段周围加上括号以便它能正确解析。）\n\n```javascript\n\
  import React from 'react'\n\nconst SurveyStats = ({data}) => {\n  if (data === null)\
  \ {\n    return (<p>no data</p>)\n  }\n}\n```\n\n\n\n\n```javascript\nreturn (\n\
  \  <table>\n    <tbody>\n      <tr><th>记录计数</th><td>{data.record_count}</td></tr>\n\
  \      <tr><th>年度最低值</th><td>{data.year_low}</td></tr>\n      <tr><th>年度最高值</th><td>{data.year_high}</td></tr>\n\
  \    </tbody>\n  </table>\n)\n}\n\nexport default SurveyStats\n```\n\n```接下来，我们在另一个表格中显示给定年份范围的聚合统计数据（`GET\
  \ /survey/:start/:end query`）。\n\n```javascript\nimport React from 'react'\n\nconst\
  \ DataDisplay = ({data}) => {\n  if (! data) {\n    return (<p>no data</p>)\n  }\n\
  \n  const columns = [\n    'year',\n    'min_hindfoot_length',\n    'ave_hindfoot_length',\n\
  \    'max_hindfoot_length',\n    'min_weight',\n    'ave_weight',\n    'max_weight'\n\
  \  ]\n  return (\n    <table>\n      <tbody>\n        <tr>{columns.map((c) => (<th>{c}</th>))}</tr>\n\
  \        {data.filter(r => r).map((record) => {\n          return (<tr>{columns.map((c)\
  \ => (<td>{record[c]}</td>))}</tr>)\n        })}\n      </tbody>\n    </table>\n\
  \  )\n}\n\nexport default DataDisplay\n```\n\n与 `SurveyStats`一样，`DataDisplay` 返回一个列出服务器返回结果的表格。与\
  \ `SurveyStats` 不同，此组件在构建表格行之前需要检查每个记录是否存在。请记住，当我们早些在 `DataManager` 中定义如何处理年份范围查询时，我们告诉它只返回那些拥有数据的记录对象。在这里，我们在将数据映射到回调函数之前添加了\
  \ `.filter(r => r)`，以确保 `DataDisplay` 只尝试为非空记录创建 `tr` 元素。我们在绘制数据时也执行了相同的操作。\n\n\
  ## 15.6 图表\n\n我们最初尝试直接使用 `Vega-Lite` 绘制图表，但在几次失败和一些在线搜索后，我们切换到了 `react-vega-lite`：`Vega-Lite\
  \ 的 vega-embed` 在被调用时想要修改现有的 DOM 元素，而 `react-vega-lite` 则构建一个在合适时间放置的元素，这被证明更容易使用。步骤如下：\n\
  \n1. 如果没有数据，创建一个段落占位符。\n2. 将非空数据重新组织成图表所需的格式。\n3. 构建一个类似于之前见过的配置（spec）。\n4. 创建选项以关闭那些烦人的链接（之前也见过）。\n\
  5. 返回 `VegaLite` 组件的实例。\n\n```javascript\nimport React from 'react'\nimport VegaLite\
  \ from 'react-vega-lite'\n\nconst DataChart = ({data}) => {\n  if (! data) {\n \
  \   return (<p>no data</p>)\n  }\n  const values = data\n    .filter(r => r)\n \
  \   .map(r => ({x: r.ave_hindfoot_length, y: r.ave_weight}))\n  let spec = {\n \
  \   '$schema': 'https://vega.github.io/schema/vega-lite/v2.0.json',\n    'description':\
  \ '平均体重 vs 平均后脚长度',\n    'mark': 'point',\n    'encoding': {\n      'x': {'field':\
  \ 'x', 'type': 'quantitative'},\n      'y': {'field': 'y', 'type': 'quantitative'}\n\
  \    }\n  }\n  let options = {\n    'actions': {\n      'export': false,\n     \
  \ 'source': false,\n      'editor': false\n    }\n  }\n  let scatterData = {\n \
  \   'values': values\n  }\n  return (<VegaLite spec={spec} data={scatterData} options={options}/>)\n\
  }\nexport default DataChart\n```\n\n图 15.1：查看项目的首次尝试\n\n其他组件与我们见过的类似。\n\n## 15.7\
  \ 运行程序\n\n为了测试我们的应用程序，我们需要运行一个数据服务器，然后使用 Parcel 启动我们的应用程序。最简单的方法是打开两个窗口并让屏幕各占一半（或高度），这样我们就可以看到操作两个部分产生的消息。\n\
  \n在一个窗口中，我们运行：\n\n`node src/capstone/back/driver.js src/capstone/back/test-data.csv`\n\
  \n注意，我们没有使用 `npm run dev` 来触发 Parcel：这是在服务器上运行，因此不需要打包。在另一个窗口中，我们运行：\n\n`npm run\
  \ dev src/capstone/index.html`\n\n显示如下：\n\n```\n> js4ds@0.1.0 /Users/js4ds\n> parcel\
  \ serve -p 4000 \"src/capstone/index.html\"\nServer running at http://localhost:4000\
  \ in 15s.\n```\n\n然后我们会在浏览器中打开 `http://localhost:4000` 并看到图 15.1。这出乎意料：我们应该看到初始数据。如果在浏览器中打开控制台并刷新页面，我们会看到这条错误信息：跨源请求被阻止：同源策略不允许读取位于\
  \ `http://localhost:3418/survey/stats` 的远程资源。（原因：缺少 CORS 头部 `Access-Control-Origin`）。\n\
  \n错误信息中提供的“了解更多”链接带我们进入一个页面，页面使用了许多我们不认识的科学术语。网页搜索发现了维基百科上的这篇文章，它告诉我们跨源资源共享 (CORS)\
  \ 是一种安全机制。如果页面加载了某些 JavaScript，并且该 JavaScript 被允许向页面来源以外的服务器发送请求，那么坏人就能执行诸如将浏览器中保存的密码发送给自己的操作。细节对于教程来说太复杂了；好消息它们被封装在一个名为\
  \ `cors` 的 Node 库中，我们只需要几行代码即可将其添加到服务器：\n\n```javascript\nconst express = require('express')\n\
  const cors = require('cors')\nlet dataManager = null\nconst app = express()\napp.use(cors())\n\
  app.get('/survey/stats', (req, res, next) => {\n  // ...同上文\n})\napp.get('/survey/:start/:end',\
  \ (req, res, next) => {\n  // ...同上文\n})\napp.use((req, res, next) => {\n  // ...同上文\n\
  })\nmodule.exports = (dbm) => {\n  // ...同上文\n}\n```\n\n由于这段代码保存在 `server-1.js`\
  \ 中，我们需要创建一个驱动程序的副本 `driver-1.js` 来调用它。让我们运行它：\n\n`node src/capstone/back/driver-1.js\
  \ src/capstone/back/test-data.csv`\n\n然后重新启动我们的应用程序获取图 15.2。这要好得多。我们现在可以在“start”和“end”框中输入某些日期，按下“update”后，我们就会获得给定年份范围的聚合统计图表和表格（图\
  \ 15.3）。\n\n我们构建了一个界面，使用它提交查询，然后由服务器处理，服务器返回可以由我们的 React 组件转换为内容的数据，我们的毕业设计项目就完成了。\n\
  \n图 15.2：查看毕业设计项目的第二次尝试\n\n图 15.3：完成的毕业设计项目\n\n## 15.8 练习\n\n## 报告其他数据\n\n一个用户请求每年观察到的雄性和雌性动物数量。\n\
  \n1. 你应该将此添加到现有的年度数据查询中，还是创建一个新的 API 调用？\n2. 实现你的选择。\n\n### 错误检查\n\n1. 修改服务器，如果请求的年份范围无效，则返回\
  \ 400 和错误信息。\n2. 将你的实现与别人的进行对比。你们对“无效”的定义是否相同，即，你的程序是否会对每个查询始终返回相同的状态码？\n\n### 添加更多测试\n\
  \n1. 我们更新后的 `server-1.js` 没有关联测试。复制 `test-server.js` 并调整它以测试此版本的服务器。\n2. 应用程序中还有其他哪些元素可以且应该被测试？尝试为这些元素编写测试。在这一过程中，你是否发现了示例代码中的缺陷？如果是，我们很想听听你的（见附录\
  \ C）。\n\n### 使用所有数据\n\n使用所有调查数据创建一个数据库并测试显示。与显示测试数据相比，你注意到了哪些 bug 或缺点？\n\n### 合并显示\n\
  \n\n\n\n\n前端的 `SurveyStats` 和 `DataDisplay` 组件都显示表格。\n\n1. 编写一个新组件 `TableDisplay`，它能够根据提供的列名列表和对象列表（这些对象应（至少）包含这些字段）来显示任意表格。\n\
  2. 用你的新组件替换 `SurveyStats` 和 `DataDisplay`。\n3. 修改你的组件，为表格中的每个值生成一个唯一的 ID。（提示：你可能需要向每次调用传递第三个参数，用作这些唯一\
  \ ID 的根根节点或前缀。）\n\n### 格式化\n\n修改 `DataDisplay`，将分数格式化为一位小数，但让整数保持原样。问问自己，为什么在数字计算机发明七十年后，这并没有变得更简单。\n\
  \n### 数据，无处不在的数据\n\n修改 `DataChart`，让 \"data\" 这个词不要以如此多的不同方式出现。这样做让你作为一个人的感觉好受吗？再次修改它，将图表的高度和宽度作为参数传入。这有帮助吗？\n\
  \n### 核心要点\n\n• 使用实际数据的切片（slices）来测试应用程序。\n\n• 测试摘要和小型用例，以便手动检查结果。\n\n• 将状态存储在类中，使用纯函数来显示它。\n\
