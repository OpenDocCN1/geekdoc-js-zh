- "# 数据科学的 JavaScript\n\n\n\n\n\n*献辞*\n_____________\n*献给 Jordan，他教我失败是通往成功的铺路石。 —\
  \ Maya*\n*献给 Oskar。 — Toby*\n*献给 Kara, Claudia, Erin, Gabriela, Hannah, Laura 和\
  \ Julia。 — Greg*\n*本书销售产生的所有版税都将捐赠给 R-Ladies，这是一个全球性组织，其使命是促进 R 社区的性别多样性。*\n\n\n\
  David Beazley 认为“JavaScript 对比数据科学”会是这本书更好的标题。虽然这个词概括了许多人对这种语言的看法，但我们希望能够说服你现代 JavaScript\
  \ 既好用又有用。我们在编写这本书时考虑到的是科学家和工程师，但我们希望这些课程也能帮助图书管理员、数字人文学者以及其他在研究中使用计算的人。\n\n我们将涵盖：\n\
  - 现代 JavaScript 的核心特性\n- 使用回调和承诺进行编程\n- 创建对象和类\n- 编写 HTML 和 CSS\n- 使用 React 创建交互页面\n\
  - 构建数据服务\n- 测试\n- 数据可视化\n- 将一切结合创建一个三层 Web 应用\n\n与大多数 JavaScript 简介不同，这些课程均衡结合了浏览器编程和服务器编程。我们对每个主题只提供浅层覆盖；如果你想了解更多，还有许多其他教程可以深入研究。\n\
  \n## 1.1 你是谁\n\n每节课程都应该旨在满足特定学习者的需求。以下三个人定义了目标读者群。\n\n**Bhadra** 五年前获得了微生物学学士学位，之后一直在一家生物技术公司工作。她在本科期间上过使用\
  \ `R` 的统计课，随后在 Software Carpentry 工作坊中学了更多 `R` 和一些 shell 脚本编写，但没有其他的程序员培训。Bhadra\
  \ 的团队正在开发检测蛋白质之间结构相似性的工具。他们希望为自己的工具构建一个浏览器界面，以便人们可以在不同的数据集上测试不同的算法。这本书将向 Bhadra\
  \ 展示如何构建、测试和部署该界面。\n\n**Efraim** 为自然资源部开展了三十年的野外工作。他学习了 Visual Basic 以编写 Excel 宏，然后掌握了\
  \ `C` 语言以维护一些二手遥感设备的控制软件。Efraim 最近退休了，现在是几个公民科学项目的活跃成员。这本书将向他展示如何创建一个服务来与世界分享这些项目的数据，以及如何为它构建一个基于\
  \ Web 的管理界面。\n\n**Sumi** 正在完成 19 世纪历史博士学位。作为其研究的一部分，她正在转录和编目录几十位日裔美国助产士的记录。她已经创建和定制\
  \ WordPress 网站多年，并在此期间学了一些 JavaScript 碎片。Sumi 即将开始找工作，并想创建一个交互式网站来展示她的研究。这本书将填补她知识中的某些空白，并向她展示如何利用\
  \ JavaScript 更现代的特性。\n\n这些典型用户：\n- 可以编写使用列表、循环、条件判断和函数的两页程序\n- 可以在 Unix shell 中运行命令以导航文件系统并创建和删除目录及文件\n\
  - 拥有可靠的互联网访问权限\n\n\n\n\n\n`Maya Gans` 是一位拥有定量生物学背景的自由数据科学家和前端开发人员。她拥有 4 年的 `R` 编程经验，对数据可视化的热情带她进入了奇妙的\
  \ `JavaScript` 世界。当她不在调试代码或编写代码博客时，她可能在某个偏远的地方攀登大山。她将这本书献给她的自学程序员同仁们，他们曾被告诉自己不够优秀，但他们动力十足且充满激情，完全不在乎这些。\n\
  \n`Toby Hodges` 是一位从生物信息学家转变为社区协调员的专家，在 `EMBL` 的 `Bio-IT Project` 工作。他教授许多计算类课程，组织了大量的社区建设活动，听很多朋克摇滚，偶尔还会抽时间写代码和骑自行车。Toby\
  \ 感谢他的妻子在他不断抱怨 `JavaScript` 调试有多么烦人时，给予了他的支持与耐心。\n\n`Greg Wilson` 在工业界和学术界均工作了 35\
  \ 年，是多本计算相关书籍的作者或编辑，其中两本是面向儿童的。他创立了 `Software Carpentry`，这是一个向研究人员教授基础计算技能的非营利组织，现在是\
  \ `RStudio` 教育团队的一员。Greg 感谢 `Rangle` 的所有人，在他学习 `JavaScript` 期间对他一直非常有耐心。\n\n## 1.3\
  \ 环境搭建\n\n你可以在我们 GitHub 仓库的 `src` 目录下找到每个章节的示例。每个子文件夹都包含了跟随学习所需的代码和数据。\n\n每章末尾的练习包含了你之后在书中需要的新信息，因此它们不是可选的。你可以使用如\
  \ `RunKit` 等服务在线完成前几个练习，该服务会在浏览器中为你提供一个交互式的 `JavaScript` 乐场。对于较大的内容，以及从创建动态网页章节（`第\
  \ 7 章`）开始的章节，你应该下载并安装最新版本的长期支持（LTS）的 `Node` 和 `NPM`。\n\n`Node` 是 `JavaScript` 的开源实现，包含一个类似于\
  \ `Python` 和 `R` 等语言的命令行解释器。`node` 命令本身会启动一个**读取-评估-打印循环** (REPL)，它会在你输入命令时执行命令并显示输出。`filename.js`\
  \ 命令则读取并运行 `filename.js` 中的命令；我们将在 `第 6 章` 查看如何在浏览器中运行 `JavaScript`。\n\n`npm` 是\
  \ Node **包管理器**，一个用于查找、安装、更新、构建和执行 `JavaScript` 库的命令行工具。命令 `npm install global library-name`（不带\
  \ `.js` 后缀）会将库**全局**安装以便所有项目都能使用，而 `npm install –save library-name` 则会将库安装**本地**（即当前项目文件夹中）。本地安装通常是更好的选择，因为可以将项目相互隔离。\n\
  \n## 1.4 贡献\n\n我们欢迎各种形式的贡献，从错误更正和微小改进到全新的章节：请向我们的 GitHub 仓库提交 issue（问题）或 pull request（拉请求）。所有被采纳的作品都会获得感谢；请注意，所有贡献者都必须遵守我们的行为准则（`附录\
  \ B`）。请注意我们使用的是简化英语而非传统英语，即使用美式而非英式的拼写和语法。我们鼓励翻译；如果你想承担这项工作，请通过电子邮件联系我们。\n\n如果你想报告错误或对措辞提出建议，请在报告正文的第一行包含章节名称（例如\
  \ `Testing Data Analysis`）。\n\n### 1.4.1 致谢\n\n我们一如既往感谢 Shashi Kumar 在 `LaTeX` 方面的帮助。我们也感谢以下人的修复：\n\
  \n* Stephan Druskat\n* Chiranjeev Gupta\n* Eric Leung\n* Peter Munro\n* Leonardo\
  \ Uieda\n\n## 1.5 练习\n\n### 环境搭建\n\n在你的电脑上安装 `Node`，然后运行 `node –version` 和 `npm\
  \ –version` 命令查看你安装的版本。\n\n### 核心要点\n\n* 现代 `JavaScript` 是构建桌面和 Web 应用的良好工具。\n*\
  \ 本课程适用于了解循环和函数，但从未用过 `JavaScript` 或构建过 Web 应用的人。\n* `Node` 是 `JavaScript` 的命令行解释器，可以交互式使用，也可以运行文件中的脚本。\n\
  * `NPM` 是 Node 包管理器，可用于查找、安装、更新、构建和执行 `JavaScript` 库。\n\n# 2 基础特性\n\n本节介绍了 `JavaScript`\
  \ 的核心特性，包括如何运行程序、语言的基础数据类型、数组和对象、循环、条件判断、函数和模块。如果你编写过程序，所有这些概念应该是熟悉的。\n\n## 2.1\
  \ 你好，世界\n\n使用你喜喜欢的文本编辑器在名为 `hello.js` 的文件中写入以下行：\n\n```javascript\nconsole.log('hello,\
  \ world')\n```\n\n`console` 是一个内置的**模块**，提供基本的打印服务（以及其他功能）。与许多语言一样，我们使用**点符号表示法**\
  \ `X.Y` 来获取对象 `X` 的部分 `Y`——在本例中，是获取控制 的 `log` 函数。像 `'hello, world'` 这样的字符串可以使用单引号或双引号编写，只要引号匹配即可，语句末尾的分号现在（在大多数情况下）是可选的。\n\
  \n要运行程序，在命令行中输入 `node program_name.js`。（我们会在 shell 命令前加一个 `$` 以于识别。）\n\n```bash\n\
  $ node src/basics/hello.js\nhello, world\n```\n\n## 2.2 基础数据类型\n\nJavaScript 拥有常见的数据类型，尽管与\
  \ `C`、`Python` 和许多其他语言不同，它没有独立的整数类型：它将所有数字存储为 64 位浮点值，精确可达 15 位小数。我们可以使用 `typeof`\
  \ 来检查这一点，它返回一个字符串。（注意：`typeof` 是一个运算符，*不是*函数：我们通过在后面紧跟想要检查类型的对象的名称来应用它，例如 `typeof\
  \ dress` 而不是 `typeof(dress)`。）我们在下文中配合 `const` 使用了它，后者在想要给一个**常量**值命名时本身非常有用：\n\n\
  ```javascript\nconst aNumber = 123.45\nconsole.log('the type of ', aNumber, ' is\
  \ ', typeof aNumber)\n// the type of 123.45 is number\n\nconst anInteger = 123\n\
  console.log('the type of ', anInteger, ' is ', typeof anInteger)\n// the type of\
  \ 123 is number\n```\n\n我们已经遇到过字符串，它可以包含任何 **Unicode** 字符：\n\n```javascript\nconst\
  \ aString = 'some text'\nconsole.log('the type of ', aString, ' is ', typeof aString)\n\
  // the type of some text is string\n```\n\n函数也是一种数据类型，这一事实的影响将在 `第 3 章` 中探讨：\n\n\
  ```javascript\nconsole.log('the type of ', console.log, ' is ', typeof console.log)\n\
  // the type of function () { [native code] } is function\n```\n\n与其逐个展示其他基础类型，我们将会把三个值放入一个列表并对其进行循环：\n\
  \n```javascript\nconst otherValues = [true, undefined, null]\nfor (let value of\
  \ otherValues) {\n  console.log('the type of ', value, ' is ', typeof value)\n}\n\
  ```\n\n\n\n\n`true` 的类型是 `boolean`\n\n`undefined` 的类型是 `undefined`\n\n`null` 的类型是\
  \ `object`\n\n如上例所示，我们创建了一个名为 `otherValues` 的值数组进行循环。我们使用 `for` 关键字初始化循环。在括号中，`let`\
  \ 创建了一个名为 `value` 的变量，用于遍历 `otherValues` 中的每个元素，而 `value` 是 `otherValues` 中不断变化的数组元素\
  \ `value`。最后，在花括号中，我们对每个值执行所需的操作。\n\n请注意，我们使用了 `let` 而不是旧的 `var`，使用了 `of` 而不是 `in`：后者返回集合的索引（例如\
  \ 0, 1, 2），这对于粗心留心的人来说有一些陷阱（附录 G.2）。同样注意，索引从 0 开始而不是 1 开始，而且缩进是可选的，仅为了可读性。这可能与你习惯的语言有所不同。\n\
  \n> **常量与变量**\n\n> *除非真的需要是变量，否则你应该将事物设为常量，因为对于人类和计算机来说，追踪定义一次且永远改变的事物更容易。*\n\n\
  在完成这一切之后，类型本身显得有些平淡。JavaScript 的 `boolean` 类型可以是 `true` 或 `false`，尽管我们在下文中会看到其他东西也可以被视为布尔值。`undefined`\
  \ 意味着“尚未赋值”，而 `null` 意味着“有一个值，但它是空”。\n\n![图像](img/fig2_1.jpg)\n\n图 2.1：嵌套循环遍历\n\n\
  ## 2.3 控制流 #07_Contents.xhtml_ch2-3\n\n我们已经见过 for 循环和扁平数组，所以让我们来看看嵌套数组和条件判断。我们从包含其他数组的数组开始，通常通过嵌套循环进行处理：\n\
  \n```javascript\nconst nested = [[′northwest′, ′northeast′],\n    [′southwest′,\
  \ ′southeast′]];\n\nfor (let outer of nested) {\n  for (let inner of outer) {\n\
  \    console.log(inner)\n  }\n}\n```\n\nnorthwest\nnortheast\nsouthwest\nsoutheast\n\
  \n对于 `outer loop`（外层循环）的每次迭代，`inner loop`（内层循环）都会运行完整的迭代周期。赋值给变量 `outer` 的每个值是一对，因此赋值给\
  \ `inner` 的每个值都是该对中的两个字符串之一（图 2.1）。\n\nJavaScript 程序还可以做出选择：只有当 `condition`（条件）为真时，才会执行\
  \ `if` 语句的 `body`（主体）。每个 `if` 都可以有一个 `else`，其主体只有在条件不为真时才会执行：\n\n```javascript\n\
  const values = [0, 1, ′′, ′text′, undefined, null, [], [2, 3]];\n\nfor (let element\
  \ of values) {\n  if (element) {\n    console.log(element, ′of type′, typeof element,\
  \ ′is truthy′)\n  } else {\n    console.log(element, ′of type′, typeof element,\
  \ ′is falsy′)\n  }\n}\n```\n\n0 of type number is falsy\n1 of type number is truthy\n\
  of of string is falsy\ntext of type string is truthy\nundefined of type undefined\
  \ is falsy\nnull of type object is falsy\nof type object is truthy\n2,3 of type\
  \ object is truthy\n\n这个示例展示了数组是异构的，即它们可以包含许多不同类型的值。它还显示了 JavaScript 对“真”的本质有一些相当奇怪的想法。0\
  \ 是假的（falsy），而所有其他数字都是真的（truthy）；同样，空字符串是假的，而所有其他字符串都是真的。`undefined` 和 `null` 都是假的，正如大多数程序员预期的那样。\n\
  \n但正如输出的最后两行所示，空数组是真的的，这与在大多数编程语言中的处理方式不同。JavaScript 支持者的论点是，空数组确实在那里，它恰好是空的，但这种行为仍然是\
  \ bug 的常见原因。在测试数组时，请检查 `Array.length` 是否为 0。（注意这是一个 `property`，而不是 `method`，即它应该被视为变量，而不是像函数一样被调用。）\n\
  \n> **安全提示**\n\n> *在 JavaScript 中测试相等和不相等时，请始终使用 `===`（三等号）和 `!==`。`==` 和 `!=` 会进行类型转换，这可能会产生一些糟糕的意外（章节\
  \ G.1）。\n\n## 2.4 格式化字符串 #07_Contents.xhtml_ch2-4\n\n与其打印多个字符串和表达式，我们可以将值插值到反引号括的字符串中。（我们必须使用反引号，因为这个功能是在语言最初创建很久之后才添加到\
  \ JavaScript 中的。）如下例所示，要进行插值的值放在 `${…}` 中，并且可以是任何有效的 JavaScript 表达式，包括函数或方法调用。\n\
  \n```javascript\nfor (let color of [′red′, ′green′, ′blue′]) {\n  const message\
  \ = `color is ${color}`;\n  console.log(message, `and capitalized is ${color.toUpperCase()}`);\n\
  }\n```\n\ncolor is red and capitalized is RED\ncolor is green and capitalized is\
  \ BLUE\n\n## 2.5 对象 #07_Contents.xhtml_ch2-5\n\n对象 (`object`) 是键值对的集合，等同于 Python\
  \ 中的字典。我们可以将对象可视化为一个表格，其中一列是键，另一列是值（图 2.1）。对象的类型总是 `object`。我们可以使用 `object[key]`\
  \ 获取与键关联的值，但如果键是简单名称，可以使用 `object.key`。\n\n由于字符串键非常常见，而且程序员经常使用简单名称，JavaScript 允许我们在创建对象时不给键加引号：\n\
  \n```javascript\nconst creature = {\n  order: ′Primates′,\n  family: ′Callitidae′,\n\
  \  genus: ′Callithrix′,\n  species: ′Jacchus′\n};\n```\n\n当我们想要对象包含什么时，[`object\
  \ Object`] 并不是非常有用的输出。为了获得更有帮助的字符串表示，请使用 `JSON.stringify(object)`：\n\n```javascript\n\
  console.log(JSON.stringify(creature)) {\"order\":\"Primates\",\"family\":\"Callitidae\"\
  ,\"genus\":\"Callithrix\",\"species\":\"Jacchus\"}\n```\n\n在这里，JSON 代表“JavaScript\
  \ 对象表示”；我们将在第 11 章 中学习更多。\n\n## 2.6 函数 #07_Contents.xhtml_ch2-6\n\n函数让凡人能够理解程序，因为它允许我们一次只考虑一部分。这里有一个寻找数组中最低和最高值的函数：\n\
  \n```javascript\nfunction limits (values) {\n  if (!values.length) {\n    return\
  \ [undefined, undefined];\n  }\n  let low = values[0];\n  let high = values[0];\n\
  \  for (let v of values) {\n    if (v < low) low = v;\n    if (v > high) high =\
  \ v;\n  }\n  return [low, high];\n}\n```\n\n它的定义由 `function` 关键字、名称、一个括号括的**参数**列表（可能是空的）以及它的主体组成。\n\
  \n\n\n\n函数的体始于对该对象进行测试，该对象在函数内部被称为 `values`，它是作为函数的 `argument` 传入的。如果 `values` 没有长度——即它不包含多个条目——该函数将返回\
  \ `[undefined, undefined]`。（我们将在练习中讨论这种行为背后的原理。）\n\n```javascript\nif (!values.length)\
  \ {\n  return [undefined, undefined]\n}\n```\n\n如果初始检查发现 `values` 确实有长度——即 `!values.length`\
  \ 返回 `false`——则执行函数的剩余部分。这首先初始化了两个变量 `low` 和 `high`，并将它们的值设置为 `values` 中的第一个项。\n\
  \n```javascript\nlet low = values[0]\nlet high = values[0]\n```\n\n在函数的下一个阶段，会对所有的\
  \ `values` 进行迭代，如果下一个值分别小于 `low` 或大于 `high`，则分别为 `low` 和 `high` 分赋新值。\n\n```javascript\n\
  for (let v of values) {\n  if (v < low) low = v\n  if (v > high) high = v\n}\n```\n\
  \n一旦检查了 `values` 中的所有项，`low` 和 `high` 的值就是 `values` 中的最小值和最大值。它们作为数组中的的形式返回。\n\n\
  ```javascript\nreturn [low, high]\n```\n\n注意，我们可以在任何时候使用 `return` 来显式返回一个值；如果没有返回任何内容，函数的结果将是\
  \ `undefined`。\n\nJavaScript 的一个特性是，几乎任何东西都可以与其他任何东西进行比较。以下是几个演示这种特点的测试：\n\n```javascript\n\
  const allTests = [\n  [],\n  [9],\n  [3, 30, 300],\n  ['apple', 'Grapefruit', 'banana'],\n\
  \  [3, 'apple', ['sub-array']]\n]\n\nfor (let test of allTests) {\n  console.log(`limits\
  \ of ${test} are ${limits(test)}`)\n}\n```\n\nlimits of are,\nlimits of 9 are 9,9\n\
  limits of 3,30,300 are 3,300\nlimits of apple, Grapefruit, banana are Grapefruit,\
  \ banana\nlimits of 3, apple, sub-array are 3,3\n\n程序员通常不再以这种方式编写函数，因为它们与语言的其他特性产生了奇怪的交互；Section\
  \ G.3 详细详细解释了原因以及如何这样做。现在，大多数程序员编写的是**箭头函数**（fat arrow functions），它由参数列表、`=>` 符号和函数体组成。箭头函数没有名称，因此必须将函数赋值给常量或变量以便以后使用：\n\
  \n```javascript\nconst limits = (values) => {\n  if (!values.length) {\n    return\
  \ [undefined, undefined]\n  }\n  let low = values[0]\n  let high = values[0]\n \
  \ for (let v of values) {\n    if (v < low) low = v\n    if (v > high) high = v\n\
  \  }\n  return [low, high]\n}\n```\n\n无论函数如何定义，每个函数都是一个 `scope`（作用域），这意味着它的参数和在内部创建的任何变量都是该函数的\
  \ `local`（局部的）。我们将在 第 3 章 中更详细地讨论作用域。\n\n> **固步过去**\n> 为什么 JavaScript 引入了另一种语法，而不是修复用\
  \ `function` 定义的行为？两个答案是：更改会破坏依赖旧行为的遗留程序，以及语言的开发者希望定义小函数变得非常容易。在这里和其他地方，我们将看到语言的历史和用途如何塑造它的演变。\n\
  \n## 2.7 模块](#07_Contents.xhtml_ch2-7)\n\n随着我们的程序变大，我们将希望将代码放在多个文件中。不可避免的坏消息是，JavaScript\
  \ 有多种模块系统：Node 仍然使用一个名为 CommonJS 的系统，但正在转换为名为 ES6 的现代标准，因此我们在命令行使用的与在浏览器中使用的不同（目前）。\n\
  \n> **Ee Ess**\n> JavaScript 的正式名称是 ECMAScript，尽管只有在日常对话中使用“datum”一词的人才会这样称呼它。因此，该语言的后续被称为\
  \ ES5、ES6 等，除非它们被称为（例如）ES2018。\n\n由于我们将在浏览器中进行任何操作之前将先构建命令行程序，我们将首先介绍 Node 的模块系统（图\
  \ 2.3）。我们首先将这段代码放在名为 `utilities.js` 的文件中：\n\n![Image](img/fig2_3.jpg)\n\n图 2.3：Require\
  \ 如何工作\n\n```javascript\nDEFAULT_BOUND = 3\n\nconst clip = (values, bound = DEFAULT_BOUND)\
  \ => {\n  let result = []\n  for (let v of values) {\n    if (v <= bound) {\n  \
  \    result.push(v)\n    }\n  }\n  return result\n}\n\nmodule.exports = {\n  clip:\
  \ clip\n}\n```\n\n函数定义非常直观；正如你可能猜的那样，`bound = DEFAULT_BOUND` 为该参数设置了默认值，使得只需传入数组即可调用\
  \ `clip`。你可能也猜到了 `Array.push` 会将一个值添加到数组的末尾；如果你不知道，好吧，现在你知道了。\n\n更重要的是将对象赋值给 `module.exports`。只有在该对象中命名的内容对外部世界可见，因此\
  \ `DEFAULT_BOUND` 不可见。记住，简单的键不需要引号，所以 `clip`: `clip` 意味着“将函数 `clip` 的引用与字符串键 `\"\
  clip\"` 关联”。\n\n要使用我们新定义的模块，我们必须 `require` 它。例如，我们可以将此放入 `application.js`：\n\n```javascript\n\
  const utilities = require('./utilities')\nconst data = [-1, 5, 3, 0, 10]\n\nconsole.log(`clip(${data})\
  \ -> ${utilities.clip(data)}`)\nconsole.log(`clip(${data}, 5) -> ${utilities.clip(data,\
  \ 5)}`)\n```\n\nclip(-1,5,3,0,10) -> -1,3,0\nclip(-1,5,3,0,10, 5) -> -1,3,0\n\n\
  `require` 返回了赋值给 `module.exports` 的对象。我们使用以 `./` 或 `../` 开头的路径导入本地文件；赋值给变量 `utilities`\
  \ 后我们调用该函数。\n\n## 2.8 练习](#07_Contents.xhtml_ch2-8)\n\n## TYPEOF\n\n`typeof` 是什么类型的？它是一个表达式？函数？还是其他？你可能会发现\
  \ `typeof` 是你的朋友，正如 Mozilla Developer Network 一。\n\n### 填空\n\n回答关于以下程序的问题：\n\n1.\
  \ `Array.push` 做什么？\n2. `while` 循环是如何工作的？\n3. `+=` 做什么？\n4. `Array.reverse` 做什么，它返回什么？\n\
  \n```javascript\nlet current = 0\nlet table = []\nwhile (current < 5) {\n  const\
  \ entry = `square of ${current} is ${current * current}`\n  table.push(entry)\n\
  \  current += 1\n}\ntable.reverse()\nfor (let line of table) {\n  console.log(line)\n\
  }\n```\n\nsquare of 4 is 16\nsquare of 3 is 9\nsquare of 2 is 4\nsquare of 1 is\
  \ 1\nsquare of 0 is 0\n\n### 是否真\n\n编写一个名为 `isTruthy` 的函数，对于 JavaScript 认为真的值返回\
  \ `true`，对于它认为为假的值返回 `false`，但空数组除外：`isTruthy` 应该对它们返回 `false`。\n\n### 未来的形状\n\n\
  我们在上面写的示例函数 `limits` 在传入没有长度的变量时会返回 `[undefined, undefined]`。与返回 `undefined` 相比，这样做的优势是什么？\n\
  \n### 不同类型的组合\n\n`NaN` 代表什么？以下代码输出是什么？尝试运行它查看结果是否符合你的预期。在处理真实世界的数据时，这种行为意味着什么？\n\
  \n```javascript\nconst first = [3, 7, 8, 9, 1]\nconsole.log(`aggregating ${first}`)\n\
  let total = 0\nfor (let d of first) {\n  total += d\n}\nconsole.log(total)\n\nconst\
  \ second = [0, 3, -1, NaN, 8]\nconsole.log(`aggregating ${second}`)\ntotal = 0\n\
  for (let d of second) {\n  total += d\n}\nconsole.log(total)\n```\n\n### 这是在做什么？\n\
  \n解释创建常量 `creature` 的赋值语句中发生了什么。\n\n\n\n\n\n```javascript\nconst genus = ′Callithrix′\n\
  const species = ′Jacchus′\nconst creature = {genus, species}\nconsole.log(creature)\n\
  // { genus: ′Callithrix′, species: ′Jacchus′ }\n```\n\n### 解构赋值\n\n当这个简短程序运行时：\n\
  \n```javascript\nconst creature = {\n  genus: ′Callithrix′,\n  species: ′Jacchus′\n\
  }\nconst {genus, species} = creature\nconsole.log(′genus is ${genus}′)\nconsole.log(′species\
  \ is ${species}′)\n```\n\n它输出了输出：\n```\ngenus is Callithrix\nspecies is Jacchus\n\
  ```\n\n但当这个程序运行时：\n\n```javascript\nconst creature = {\n  first: ′Callithrix′,\n\
  \  second: ′Jacchus′\n}\nconst {genus, species} = creature\nconsole.log(′genus is\
  \ ${genus}′)\nconsole.log(′species is ${species}′)\n```\n\n它输出了：\n```\ngenus is\
  \ undefined\nspecies is undefined\n```\n\n1. 这两个程序之间的区别是什么？\n2. **解构赋值**通常情况下是如何工作的？\n\
  3. 我们如何使用这种技术来重写 `src/basics/import.js` 中的 `require` 语句，使得 `clip` 可以直接作为 `clip(…)`\
  \ 调用，而不是作为 `utilities.clip(…)` 调用？\n\n### 回到我，因为我的心只有你\n\n如果你运行这段代码，会在控制台中看到什么输出？\n\
  \n```javascript\nconst verbose_sum = (first, second) => {\n  console.log(′Going\
  \ to add ${first} to ${second}′)\n  let total = first + second\n  return total\n\
  \  console.log(′Finished summing′)\n}\nvar result = verbose_sum(3, 6)\nconsole.log(result)\n\
  ```\n\n1. `Going to add ${first} to ${second}`\n`9`\n2. `Going to add 3 to 6`\n\
  `9`\n`Finished summing`\n3. `Going to add 3 to 6`\n`9`\n4. `Going to add 3 to 6`\n\
  `36`\n\n### 关键点\n\n- 使用 `console.log` 打印消息。\n- 使用点符号 `X.Y` 获取对象 `X` 的部分 `Y`。\n-\
  \ 基础数据类型是布尔值、数字和字符字符串。\n- 数组顺序存储多个值。\n- 特殊值 `null` 和 `undefined` 意味着“无值”和“不存在”。\n\
  - 使用 `const` 定义常量，使用 `let` 定义变量。\n- `typeof` 返回值的类型。\n- `for (let variable of collection)\
  \ {…}` 遍历数组中的值。\n- `if (condition) {…} else {…}` 根据条件条件执行某些代码。\n- `false`、0、空字符串、`null`\
  \ 和 `undefined` 为假（false）；其他所有值均为真（true）。\n- 使用反引号和 `${…}` 将值插值到字符串中。\n- 对象是写在 `{…}`\
  \ 中的键名/值对的集合。\n- `object[key] or object.key` 从对象中获取值。\n- 函数是对象，可以赋值给变量、存储在列表中等。\n\
  - `function name(…parameters…) {…body…}` 是定义函数的旧方法。\n- `name = (…parameters…) =>\
  \ {…body… }` 是定义函数的新方法。\n- 在函数体内使用 `return` 在任何点返回值。\n- 使用模块将代码划分在多个文件中以便于重用。\n\
  - 赋值给 `module.exports` 以指定模块导出的内容。\n- `require(…path…)` 导入模块。\n- 以 `.` 或 `/` 开头的路径从本地导入，但没有\
  \ `.` 或 `/` 开头的路径会在库中查找。\n\n# 3 回调函数\n\nJavaScript 高度依赖回调函数：与其让函数立即给我们返回结果，不如给它另一个函数，告诉它下一步做什么。许多其他语言也使用它们，但\
  \ JavaScript 通常是数据科学背景的程序员首次遇到它们的地方。为了理解它们如何工作以及如何使用，我们必须首先理解函数在定义和调用时实际上发生了什么。\n\
  \n## 3.1 调用栈\n\n当 JavaScript **解析** 表达式 `let name = \"text\"` 时，它会分配一块足够存储四个字符的内存，并将指向该字符块的引用存储在变量\
  \ `name` 中。我们可以通过绘制像图 3.1 这样的内存图来展示这一点。\n\n![Image](img/fig3_1.jpg)\n图 3.1：名称和值\n\
  \n当我们写下：\n\n```javascript\noneMore = (x) => {\n  return x + 1\n}\n```\n\nJavaScript\
  \ 分配一块足够存储若干条指令的内存，将函数的文本翻译成指令，并将这些指令的引用存储在变量 `oneMore` 中（图 3.2）。\n\n这两种情况之间的唯一区别是另一端的引用：四个字符或一组加\
  \ 1 的指令。这意味着我们可以将函数赋值给另一个变量，就像赋值一个数字一样：\n\n```javascript\n// 将函数 oneMore 赋值给 anotherName\n\
  const anotherName = oneMore\n\n// 与其调用函数 oneMore 相比\nconsole.log(anotherName(5))\n\
  ```\n\n![Image](img/fig3_2.jpg)\n图 3.2：内存中的函数\n\n这样做调用函数：3.3。调用栈允许我们编写函数而不必担心引用错误。在调用\
  \ `temp = first(initial)` 期间，在值返回赋值给 `temp` 之前，内存看起来如图 3.6。反转函数的顺序会改变结果：\n\n## 3.2\
  \ 函数的函数\n\n调用栈允许我们编写和调用函数而不必担心引用错误。由于函数只是另一种数据，我们可以将一个函数传递给另一个。例如，我们可以写一个名为 `doTwice`\
  \ 的函数来调用另一个函数：\n\n```javascript\nconst doTwice = (action) => {\n  action()\n  action()\n\
  }\n\nconst hello =()=>{\n  console.log(′hello)\n}\n\ndoTwice(hello)\n```\n\n![Image](img/fig3_4.jpg)\n\
  图 3.4：调用栈\n\n再次，当我们观察 `doTwice` 运行时内存的状态时，这变得清晰（图 3.5）。\n\n![Image](img/fig3_5.jpg)\n\
  图 3.5：函数的函数\n\n当传入的函数或函数有自己的参数时，这变得更有用。例如，`pipeline` 函数将值传递给一个函数，然后将该函数的结果传递给第二个，并返回最终结果：\n\
  \n```javascript\nconst pipeline = (initial, first, second) => {\n  return second(first(initial))\n\
  }\n```\n\n让我们使用它来组合一个修剪字符串两端空白的函数和另一个使用正则表达式将空格替换为点的函数：\n\n```javascript\nconst\
  \ trim = (text) => { return text.trim() }\nconst dot = (text) => { return text.replace(//g,\
  \ ′.′) }\n\nconst original = ′ this example uses text ′\n\nconst trimThenDot = pipeline(original,\
  \ trim, dot)\n\nconsole.log(′trim then dot: |${trimThenDot}|′)\n```\n\n\n\n\n我们可以通过传递函数数组来创建一个更通用的流水线：\n\
  \n```javascript\nconst pipeline = (initial, operations) => {\n  let current = initial\n\
  \  for (let op of operations) {\n    current = op(current)\n  }\n  return current\n\
  }\n```\n\n逐行分析这段代码：\n\n- `pipeline` 函数接收一个初始输入值和一个函数数组。其中每个函数都必须接收一个值作为输入，并产生一个值作为输出。\n\
  - 我们初始化一个名为 `current` 的变量来存储当前值。我们必须使用 `let` 而不是 `const`，因为我们希望在流水线的每一步运行后更新它。\n\
  - 接着，我们按顺序调用流水线中的每个函数，传入当前值以及要传递给下一个函数的结果。\n- 最终结果就是流水线最后一步输出的内容。。\n\n我们实际上并不需要为当前值创建一个单独变量；由于参数总是变量而不是常量，我们可以像这样反复重写参数\
  \ `initial`：\n\n```javascript\nconst pipeline = (current, operations) => {\n  for\
  \ (let op of operations) {\n    current = op(current)\n  }\n  return current\n}\n\
  ```\n\n让我们为我们的文本处理工具集中添加一个 `double` 函数：\n\n```javascript\nconst double = (text)\
  \ => { return text + text }\n```\n\n然后尝试运行一下：\n\n```javascript\nconst original =\
  \ ′ some text ′\nconst final = pipeline(original, [double, trim, dot])\nconsole.log(`|${original}|\
  \ -> |${final}|`)\n```\n\n`| some text | -> |some.text..some.text|`\n\n操作顺序如下：\n\
  \n1. `current` 被赋值为 `′ some text ′`（每个单词周围都有空格）。\n2. 随后它被赋值为 `double(’ some text\
  \ ’)`，即 `′ some text some text ′`。\n3. 该值随后传递给 `trim`，因此 `’some text some text’`（没有前后空格）被赋值给\
  \ `current`。\n4. 最后，当前值被传递给 `dot` 并返回结果 `some.text..some.text.`。\n\n## 3.3 匿名函数\n\
  \n还记得 `oneMore` 函数吗？我们可以向它传递一个动态计算的值：\n\n```javascript\noneMore = (x) => {\n  return\
  \ x + 1\n}\nconsole.log(oneMore(3 * 2))\n```\n\n在底层，JavaScript 分配了一个无名的临时变量来存储 `3\
  \ * 2` 的值，然后将该临时变量的引用传递给 `oneMore`。我们对函数也可以同样的操作，即在将其传递给其他函数时，不给它命名而直接动态创建一个。例如，假设我们不是让一个值通过函数流水线，而是想为数组中的每个值调用一次函数：\n\
  \n```javascript\nconst transform = (values, operation) => {\n  let result = []\n\
  \  for (let v of values) {\n    result.push(operation(v))\n  }\n  return result\n\
  }\n\nconst data = [′one′, ′two′, ′three′]\nconst upper = transform(data, (x) =>\
  \ { return x.toUpperCase() })\nconsole.log(`upper: ${upper}`)\n```\n\n`upper: ONE,\
  \ TWO, THREE`\n\n获取单词的首字母是如此简单，以至于不值专门为这个函数命名，所以，让我们将定义移动到 `transform` 的调用中：\n\n\
  ```javascript\nconst first = transform(data, (x) => { return x[0] })\nconsole.log(`first:\
  \ ${first}`)\n```\n\n`first: o,t,t`\n\n在定义处使用且未赋值命名的函数被称为**匿名函数**。JavaScript 中的大多数回调函数都是这样编写的：带有给定参数和体的函数（在此例中为\
  \ `x` 和 `return x[0]`）被直接传递给其他地方（在此例中为 `transform`）以便调用。\n\n## 3.4 函数式编程\n\n**函数式编程**是一种高度依赖**高阶函数**的编程风格，例如接收其他函数作为参数的\
  \ `pipeline`。此外，函数式编程要求函数不要修改数据，而是从旧数据创建新数据。例如，函数式编程的实信者会对这段代码感到难过：\n\n```javascript\n\
  // 创建测试数组\nconst test = [1,2,3]\nconst impure = (values) => {\n  for (let i in values)\
  \ {\n    values[i] += 1\n  }\n}\n\n// 运行函数\nimpure(test)\n// 原数组已被修改\n```\n\n并且会礼貌地建议将其重写为：\n\
  \n```javascript\nconst test = [1,2,3]\nconst pure = (values) => {\n  let result\
  \ = []\n  for (let v of values) {\n    result.push(v + 1)\n  }\n  return result\n\
  }\n\n// 与其修改 test，我们创建一个新数组\nconst newArray = pure(test)\nconsole.log(`test: ${newArray}`)\n\
  ```\n\n`test: 2,3,4`\n\nJavaScript 数组提供了多种方法来支持函数式编程。例如，`Array.some` 在数组中*任意*元素通过测试时返回\
  \ `true`，而 `Array.every` 在数组中*所有*元素都通过测试时返回 `true`。它们的工作方式如下：\n\n```javascript\n\
  const data = [′this′, ′is′, ′a′, ′test′]\n// 如果任意一个元素长度大于 3 个字符，Array.some 返回 true\n\
  console.log(data.some((x) => x.length > 3)) \n// 如果所有元素长度大于 3 个字符，Array.every 返回\
  \ true\nconsole.log(data.every((x) => x.length > 3))\n```\n\n`true`\n`false`\n\n\
  `Array.map` 通过为现有数组的每个元素调用函数来创建一个新数组：\n\n```javascript\nconst data = [′this′, ′is′,\
  \ ′a′, ′test′]\nconst shortened = data.map((x) => x.slice(0, 2))\nconsole.log(shortened)\n\
  ```\n\n`[\"th\", \"is\", \"\", \"te\"]`\n\n最后，`Array.reduce` 使用合并函数和起始值将数组归约为单个值。合并函数必须接收两个值：当前运行的总和和数组中的下一个值；如果数组为空，`Array.reduce`\
  \ 返回起始值。\n\n通过例子会让这一点更清晰。首先，让我们用循环创建一个缩写词：\n\n```javascript\nconst data = [′this′,\
  \ ′is′, ′a′, ′test′]\nlet acronym = ′′\nfor (let value of data) {\n  acronym = acronym\
  \ + value[0]\n}\nconsole.log(`acronym of ${data} is ${acronym}`)\n```\n\n`acronym\
  \ of this, is, a, test`\n\n上面的短程序中有三个关键要素：输入数据、变量 `acronym` 的初始值以及更新该变量的方式。使用 `Array.reduce`\
  \ 时，数组是数据，初始值和更新函数作为参数传递：\n\n```javascript\nconst data = [′this′, ′is′, ′a′, ′test′]\n\
  const concatFirst = (accumulator, nextValue) => {\n  return accumulator + nextValue[0]\n\
  }\nlet acronym = data.reduce(concatFirst, ′′)\nconsole.log(`acronym of ${data} is\
  \ ${acronym}`)\n```\n\n和其他地方一样，我们可以在使用处定义函数：\n\n```javascript\nconst data = [′this′,\
  \ ′is′, ′a′, ′test′]\nacronym = data.reduce((accum, next) => {\n  return accum +\
  \ next[0]\n}, ′′)\nconsole.log(`all in one step: ${acronym}`)\n```\n\n\n\n我们最后一个需要介绍的工具是内存处理方式产生的一种极其有用的副作用。最简单的的解释方法是使用示例。我们已经定义了一个名为\
  \ `pipeline` 的函数，它可以将任意数量的其他函数链在一起：\n\n```javascript\nconst pipeline = (initial,\
  \ operations) => {\n  let current = initial\n  for (let op of operations) {\n  \
  \  current = op(current)\n  }\n  return current\n}\n```\n\n然而，只有当 `operations` 数组中的每个函数都只有一个参数时，`pipeline`\
  \ 才能正常工作。如果我们想要实现加 1、加 2 等，就必须编写单独的函数，这很麻烦。\n\n更好的选项是写一个函数来创建我们想要的函数：\n\n```javascript\n\
  const adder = (increment) => {\n  const f = (value) => {\n    return value + increment\n\
  \  }\n  return f\n}\n\nconst add_1 = adder(1)\nconst add_2 = adder(2)\n\nconsole.log(`add_1(100)\
  \ is ${add_1(100)}, add_2(100) is ${add_2(100)}`)\nadd_1(100) is 101, add_2(100)\
  \ is 102\n```\n\n![Image](img/fig3_7.jpg)\n\n图 3.7：创建一个加法器（步骤 1）\n\n理解发生过程最好方法是绘制一个逐步内存图。在步骤\
  \ 1 中，我们调用了 `adder(1)`（图 3.7）。`adder` 创建了一个新函数，该函数包含了我们刚刚传入的 1 的引用（图 3.8）。在步骤 3\
  \ 中，`adder` 返回该函数，并将其赋值给 `add_1`（图 3.9）。至关重要的是，`add_1` 引用的函数仍然对值 1 有引用，尽管该值不再被其他任何地方引用了。\n\
  \n在步骤 4–6 中，我们重复这三个步骤来创建另一个对值 2 有引用的函数，并将该函数赋值给 `add_2`（图 3.10）。\n\n当我们现在调用 `add_1`\
  \ 或 `add_2` 时，它们会加上传入的值以及它们保留引用的值。\n\n这种在其他内部捕获值引用的技巧被称为**闭包**（closure）。它之所以有效，是因为只要任何地方任何东西仍然引用这些值，JavaScript\
  \ 就会保留它们。闭包通过允许我们动态定义小函数并给它们额外数据来处理，解决了我们的流水线问题：\n\n```javascript\nconst result\
  \ = pipeline(100, [adder(1), adder(2)])\nconsole.log(`adding 1 and 2 to 100 -> ${result}`)\n\
  adding 1 and 2 to 100 -> 103\n```\n\n再次，`adder(1)` 和 `adder(2)` 并没有对任何东西增加任何东西：它们定义了新的（无名的）函数，在被调用时分别加\
  \ 1 和 2。\n\n程序员通常会更进一步，以这种内联的方式定义这样的小函数：\n\n```javascript\nconst result = pipeline(100,\
  \ [(x) => x + 1, (x) => x + 2])\nconsole.log(`adding 1 and 2 to 100 -> ${result}`)\n\
  adding 1 and 2 to 100 -> 103\n```\n\n![Image](img/fig3_8.jpg)\n\n图 3.8：创建一个加法器（步骤\
  \ 2）\n\n![Image](img/fig3_9.jpg)\n\n图 3.9：创建一个加法器（步骤 3）\n\n![Image](img/fig3_10.jpg)\n\
  \n图 3.10：创建一个加法器（步骤 4-6）\n\n如此示例所示，如果函数体是一个单一表达式，它就不不必包含在 `{…}` 中，且不需要使用 `return`。\n\
  \n## 3.6 练习题\n\n## 使用 `FOREACH` 的副作用\n\nJavaScript 数组有一个名为 `forEach` 的方法，它会为数组的每个元素调用一次回调函数。与\
  \ `map` 不同，`forEach` *不会* 保存这些调用返回的值，也不会返回结果数组。其完整语法为：\n\n```javascript\nsomeArray.forEach((value,\
  \ location, container) => {\n  // 'value' 是 'someArray' 中的值\n  // 'location' 是该值的索引\n\
  \  // 'container' 是包含它的数组（在此例中为 'someArray'）\n})\n```\n\n如果你只需要值，可以提供一个只接受一个参数的回调；如果你只需要值和它的位置，可以提供一个接受两个参数的回调。使用此编写一个函数\
  \ `doubleInPlace`，在原地将数组中的所有值翻倍：\n\n```javascript\nconst vals = [1, 2, 3]\ndoubleInPlace(vals)\n\
  console.log(`vals after change: ${vals}`)\nvals after change: 2,4,6\n```\n\n###\
  \ 数据标注\n\n给定一个表示野生动物观察结果的对象数组：\n\n```javascript\ndata = [\n  {date: '1977-7-16',\
  \ sex: 'M', species: 'NL'},\n  {date: '1977-7-16', sex: 'M', species: 'NL'},\n \
  \ {date: '1977-7-16', sex: 'F', species: 'DM'},\n  {date: '1977-7-16', sex: 'M',\
  \ species: 'DM'},\n  {date: '1977-7-16', sex: 'M', species: 'DM'}\n]\n```\n\n编写一个函数返回一个这样的新对象数组：\n\
  \n```javascript\nnewData = [\n  {date: '1977-7-16', sex: 'M', species: 'NL'},\n\
  \  {date: '1977-7-16', sex: 'M', species: 'NL'},\n  {date: '1977-7-16', sex: 'F',\
  \ species: 'DM'},\n  {date: '1977-7-16', sex: 'M', species: 'DM'},\n  {date: '1977-7-16',\
  \ sex: 'M', species: 'DM'}\n]\n```\n\n不要使用循环。变化是：\n\n### 关键要点\n\n- JavaScript 在内存中存储函数。\n\
  - 闭包是在定义期间捕获的变量集。\n- 函数式编程使用高阶函数。\n- `Array.some` 在任意元素通过时为真，而 `Array.every` 在所有元素都通过时为真。\n\
  - `Array.filter` 选择元素。\n- `Array.map` 创建新数组。\n- `Array.reduce` 将数组归纳为单一值。\n\n# 4\
  \ 对象与类\n\n让新代码使用旧代码很容易：只需加载你需要的库即可。让旧代码使用新代码要棘手得多，但**面向对象编程 (OOP)** 可以提供帮助。\n\n\
  ## 4.1 手动实现\n\n正如我们在第 2 章 中看到的，JavaScript 中的对象是一组键值对。由于函数只是另一种类型的数据，因此，对象的值可以是函数，因此数据可以携带函数。例如，我们可以创建一个表示正方形的对象：\n\
  \n```javascript\nsquare = {\n  name: 'square',\n  size: 5,\n  area: (it) => { return\
  \ it.size * it.size },\n  perimeter: (it) => { return 4 * it.size }\n}\n```\n\n\
  然后将对象本身传递给自己的函数：\n\n```javascript\nconst a = square.area(square)\nconsole.log(`area\
  \ of square is ${a}`)\n```\n\n这样做很笨拙——我们经常忘记将对象传递给它的函数——但它允许我们以相同的方式处理许多不同类型。例如，我们可以创建另一个表示圆的对象：\n\
  \n```javascript\ncircle = {\n  name: 'circle',\n  radius: 3,\n  area: (it) => {\
  \ return Math.PI * it.radius * it.radius },\n  perimeter: (it) => { return 2 * Math.PI\
  \ * it.radius }\n}\n```\n\n然后将所有这些不同的对象放入数组中，并以相同的方式对它们进行操作，而无需切切我们正在处理什么类型的对象：\n\
  \n```javascript\nconst show_all = (shapes) => {\n  for (let s of shapes) {\n   \
  \ const a = s.area(s)\n    const p = s.perimeter(s)\n    console.log(`${s.name}:\
  \ area ${a} perimeter ${p}`)\n  }\n}\n\nshow_all([square, circle])\n```\n\n\n\n\
  只要我们只使用值名以及 `area` 和 `perimeter`（周长）函数，我们就不需要知道它是哪种形状。这被称为**多态**，它允许我们在不改变循环代码的情况下添加新的形状。换句话说，它允许旧代码（在此例中为\
  \ `show_all` 函数）使用新代码（新对象 `rectangle`）：\n\n```javascript\nconst rectangle = {\n\
  \  name: 'rectangle',\n  width: 2,\n  height: 3,\n  area: (it) => { return it.width\
  \ * it.height },\n  perimeter: (it) => { return 2 * (it.width + it.height) }\n}\n\
  \nshow_all([square, circle, rectangle])\n```\n\nsquare: area 25 perimeter 20\ncircle:\
  \ area 28.274333882308138 perimeter 18.84955592153876\nrectangle: area 6 perimeter\
  \ 10\n\n## 4.2 类\n\n手动构建每个对象并调用 `thing.function(thing)` 是很笨拙的。JavaScript 使用**原型**解决了这些问题，但事实证明原型与我们手工编写的解决方案几乎一样笨拙（见\
  \ G.3 节）。大多数面向对象的语言都使用**类**；这些类是在 ES6 中添加到 JavaScript 的，我们在整个过程中将使用类来代替原型。以下是创建一个定义正方形属性的类，而不实际创建任何特定的正方形：\n\
  \n```javascript\nclass Square {\n  constructor (size) {\n    this.name = 'square'\n\
  \    this.size = size\n  }\n  area () { return this.size * this.size }\n  perimeter\
  \ () { return 4 * this.size }\n}\n```\n\n（按照约定，类名使用驼峰命名法。）我们可以像使用函数一样使用类名创建一个特定的正方形：\n\
  \n```javascript\nconst sq = new Square(3)\nconsole.log(`sq name ${sq.name} and area\
  \ ${sq.area()}`)\n```\n\nsq name square and area 9\n\n![Image](img/fig4_1.jpg)\n\
  \n图 4.1: 内存中的对象与类\n\n`new ClassName(…)` 创建一个新的空白对象并对其进行标记，以显示它是 `ClassName` 的**实例**。对象需要知道它们属于哪个类，以便找到它们的**方法**，方法是定义在类内部的对该类实例进行操作的函数。（我们将在\
  \ G.3 节解释 JavaScript 如何标记对象；为了兼容语言的旧版本，它的实现比实际需要的要复杂。）\n\n在 `new` 将新创建的对象交还给程序之前，它会调用特殊命名的**构造函数**来初始化对象的状态。在构造函数和其他方法内部，被操作的对象通过代词\
  \ `this` 来指代。例如，如果构造函数将数组赋值给 `this.values`，那么该类的每个实例都将获得自己的数组。\n\n> 故旧皆为新\n> 方法在类内部内部使用经典的\
  \ `function` 语法定义，而不是我们一直在使用的箭头函数（fat arrows）。这种不一致性是遗憾的，但这种定义方法的方法是当前版本 Node 偏好的；我们将在第\
  \ 8 章进一步探讨这个话题。\n\n在前面的三个段落中包含了许多新术语，让我们重新追溯以下代码的执行：\n\n```javascript\nconst sq\
  \ = new Square(3)\nconsole.log(`sq name ${sq.name} and area ${sq.area()}`)\n```\n\
  \n1. `new` 创建一个空白对象，然后查找类 `Square` 的定义，并使用值 `3` 调用内部的 `constructor`。\n2. 在该调用内部，`this`\
  \ 指向新创建的空白对象。构造函数向对象添加两个键：`name` 的值为 `'square'`，`size` 的值为 `3`。\n3. 一旦构造函数完成，新创建的对象被赋值给变量\
  \ `sq`。\n4. 为了为 `console.log` 创建字符串，程序必须查找 `sq.name` 的值，这就像查找对象中的任何键一样。\n5. 程序还必须调用\
  \ `sq.area`。在调用期间，JavaScript 将 `sq` 赋值给变量 `this`，以便 `area` 方法可以在被调用对象中查找 `size`\
  \ 的值。\n6. 最后，程序填充模板并调用 `console.log`。\n\nJavaScript 类支持多态性：如果两个或多个类具有相同名称、相同参数并返回相同类型值的方法，其他代码就可以交替使用这些类的对象。例如，这里有一个基于类的重写：\n\
  \n```javascript\nclass Circle {\n  constructor (radius) {\n    this.name = 'circle'\n\
  \    this.radius = radius\n  }\n  area () { return Math.PI * this.radius }\n  perimeter\
  \ () { return 2 * Math.PI * this.radius }\n}\n\nclass Rectangle {\n  constructor\
  \ (width, height) {\n    this.name = 'rectangle'\n    this.width = width\n    this.height\
  \ = height\n  }\n  area () { return this.width * this.height }\n  perimeter () {\
  \ return 2 * (this.width + this.height) }\n}\n\nconst everything = [\n  new Square(3.5),\n\
  \  new Circle(2.5),\n  new Rectangle(1.5, 0.5)\n]\n\nfor (let thing of everything)\
  \ {\n  const a = thing.area(thing)\n  const p = thing.perimeter(thing)\n  console.log(`${thing.name}:\
  \ area ${a} perimeter ${p}`)\n}\n```\n\nsquare: area 12.25 perimeter 14\ncircle:\
  \ area 19.634954084936208 perimeter 15.70796326794896\nrectangle: area 0.75 perimeter\
  \ 4\n\n## 4.3 继承\n\n我们可以通过添加或**覆盖**方法从旧类中构建新类。为了展示这一点，我们将首先定义一个人类：\n\n```javascript\n\
  class Person {\n  constructor (name) {\n    this.name = name\n  }\n  greeting (formal)\
  \ {\n    if (formal) {\n      return `Hello, my name is ${this.name}`\n    } else\
  \ {\n      return `Hi, I’m ${this.name}`\n    }\n  }\n  farewell () {\n    return\
  \ 'Goodbye'\n  }\n}\n```\n\n这个类允许我们创建一个带有正式问候的实例：\n\n```javascript\nconst parent\
  \ = new Person('Hakim')\nconsole.log(`parent: ${parent.greeting(true)} - ${parent.farewell()}`)\n\
  ```\n\nparent: Hello, my name is Hakim - Goodbye\n\n现在我们可以**扩展** `Person` 来创建一个新类\
  \ `Scientist`，在这种情况下我们说 `Scientist` **继承**自 `Person`，或者 `Person` 是 `Scientist` 的**父类**，而\
  \ `Scientist` 是 `Person` 的**子类**。\n\n```javascript\nclass Scientist extends Person\
  \ {\n  constructor (name, area) {\n    super(name)\n    this.area = area\n  }\n\
  \  greeting (formal) {\n    return `${super.greeting(formal)}. Let’s talk about\
  \ ${this.area}...`\n  }\n}\n```\n\n这告诉我们 `Scientist` 是一个：\n- 拥有专业领域和名字的人\n- 以稍微长一点的方式招呼\n\
  - 以与 `Person`相同的方式告别（因为 `Scientist` *没有*定义自己的 `farewell` 方法）\n\n`super` 一词在这里有两种用法：\n\
  - 在 `Scientist` 的构造函数中，`super(name)` 调用父类 `Person` 的构造函数，以便在 `Scientist` 执行自己的初始化之前执行它的初始化。这避免了我们重复步骤。\n\
  - 在 `greeting` 内部，表达式 `super.greeting(formal)` 意味着“调用父类对象的 `greeting` 方法”。这允许子类定义的方法添加或修改父类定义的方法的行为，再次避免了代码重复。\n\
  \n让我们尝试一下：\n\n```javascript\nconst child = new Scientist('Bhadra', 'microbiology')\n\
  console.log(`child: ${child.greeting(false)} - ${child.farewell()}`)\n```\n\nchild:\
  \ Hi, I’m Bhadra. Let’s talk about microbiology… - Goodbye\n\n\n\n\n- 它在对象 `child`\
  \ 中查找是否存在名称正确的函数。\n- 并没有，所以它通过 `child` 的链接跳转到它的类 `Scientist`，查看那里是否有该函数。\n- 依然没有，于是它通过\
  \ `Scientist` 的链接到父类 `Person`，并找到了它正在寻找的函数。\n\n## 4.4 练习\n\n### (DELAYS)\n\n定义一个名为\
  \ `Delay` 的类，其 `call` 方法始终返回*上一次*调用给的值：\n\n![Image](img/fig4_2.jpg)\n\n图 4.2：面向对象的继承\n\
  \n```javascript\nconst example = new Delay('a')\n\nfor (let value of ['b', 'c',\
  \ 'd' ]) {\n  console.log(value, '->', example.call(value))\n}\n```\n\nb -> a\n\
  c -> b\nd -> c\n\n像 `Delay` 这样的类有时被称为**有状态的**（stateful），因为它会在每次调用之间记住它的状态。\n\n###\
  \ 过滤 (FILTERING)\n\n定义一个名为 `Filter` 的类，其 `call` 方法如果输入匹配其构造函数给出的值之一，则返回 `null`，否则返回输入：\n\
  \n```javascript\nconst example = new Filter('a', 'e', 'i', 'o', 'u')\n\nfor (let\
  \ value of ['a', 'b', 'c', 'd', 'e']) {\n  console.log(value, '->', example.call(value))\n\
  }\n```\n\na -> null\nb -> b\nc -> c\nd -> d\ne -> null\n\n像 `Filter` 这样的类有时被称为**无状态的**（stateless），因为它不会在调用之间记住它的状态。\n\
  \n### 流线 (PIPELINES)\n\n定义一个名为 `Pipeline` 的类，其构造函数接收一个或多个具有单参数 `call` 方法的对象，并且它自己的\
  \ `call` 方法将值依次传递给每个对象。如果任何组件的 `call` 方法返回 `null`，`Pipeline` 将立即停止并返回 `null`。\n\n\
  ```javascript\nconst example = new Pipeline(new Filter('a', 'e', 'i', 'o', 'u'),\
  \ new Delay('a'))\n\nfor (let value of ['a', 'b', 'c', 'd', 'e']) {\n  console.log(value,\
  \ '->', example.call(value))\n}\n```\n\na -> null\nb -> a\nc -> b\nd -> c\ne ->\
  \ null\n\n### 活跃表达式 (ACTIVE EXPRESSIONS)\n\n考虑这个类：\n\n```javascript\nclass Active\
  \ {\n  constructor (name, transform) {\n    this.name = name\n    this.transform\
  \ = transform\n    this.subscribers = []\n  }\n  subscribe (someone) {\n    this.subscribers.push(someone)\n\
  \  }\n  update (input) {\n    console.log(this.name, 'got', input)\n    const output\
  \ = this.transform(input)\n    for (let s of this.subscribers) {\n      s.update(output)\n\
  \    }\n  }\n}\n```\n\n以及使用它的程序：\n\n```javascript\nconst start = new Active('start',\
  \ (x) => Math.min(x, 10))\nconst left = new Active('left', (x) => 2 * x)\nconst\
  \ right = new Active('right', (x) => x + 1)\nconst final = new Active('final', (x)\
  \ => x)\n\nstart.subscribe(left)\nstart.subscribe(right)\nleft.subscribe(final)\n\
  right.subscribe(final)\n\nstart.update(123)\n```\n\n1. 追踪当程序的最后一行被调用时发生了什么。\n2.\
  \ 修改 `Active` 类，使得*如果*提供了 `transform` 函数，则调用它；如果如果没有提供转换函数，则调用 `Active.transform`\
  \ 方法。\n3. 创建一个新类 `Delay`，其 `transform` 方法始终返回上一个值。（它的构造函数需要接收一个初始值作为参数。）\n\n这种模式被称为**观察者/可观察者**（observer/observable）。\n\
  \n### 关键点\n\n- 创建类来定义数据和行为的组合。\n- 使用类的构造函数来初始化对象。\n- `this` 指向当前对象。\n- 使用多态来表达常见的行为模式。\n\
  - 有时扩展现有类来创建新类。\n- 重写方法以更改或扩展它们的行为。\n\n# 5 HTML 和 CSS\n\nHTML 是在 Web 浏览器中表示文档的标准方式，而\
  \ CSS 是描述其外观的标准方式。两者都比本该复杂的复杂，但为了创建 Web 应用程序，我们需要稍微了解两者。\n\n## 5.1 格式\n\nHTML 文档包含**元素**（以及可能包含其他内容）。元素使用标签显示：`<tagname>`\
  \ 显示元素开始的地方，`</tagname>` 显示元素结束的地方。文档形成一个**树**（图 5.1），即如果你在 `X` 内部嵌套 `Y`，你必须在关闭\
  \ `X` 之前关闭 `Y`。\n\n## 5.2 文本\n\nhead 内部的 `title` 元素赋予页面标题。这在页面打开时显示在浏览器栏中，但*不会*作为页面本身的一部分显示。\n\
  \n| 名称 | 转义序列 |\n| :--- | :--- |\n| 小于 | `<` |\n| 大于 | `>` |\n| 符号 | `&` |\n| 版权\
  \ | `&copy;` |\n| 加/减 | `&plus;` |\n| 微符号 | `&micro;` |\n\n前两个是常用的，`&copy;`、`&plus;`\
  \ 和 `&micro;` 通常不再需要，因为大多数编辑器可以直接在字符串中放入非 ASCII 字符。\n\n## 5.3 页面\n\nHTML 页面应该具有：\n\
  - 一个包含所有内容的 `html` 元素\n- 一个包含页面信息的 `head` 元素\n- 一个包含要显示内容的 `body` 元素\n\n无论我们如何缩进显示这些元素的标签，并不重要，但将它们分行布局有助于人类阅读。良好的页面还会使用注释：这些以\
  \ `<!--` 开始并以 `-->` 结束。遗憾的是，注释不能嵌套，即如果你注释掉页面的部分内容，结果将是不可预测的。\n\n这是一个具有上述结构的空页面：\n\
  \n```html\n<html>\n  <head>\n    <!-- 页面描述在这里 -->\n  </head>\n  <body>\n    <!--\
  \ 页面内容在这里 -->\n  </body>\n</html>\n```\n\n如果我们在浏览器中打开它，什么都不会显示出来，所以让我们添加一点内容：\n\n\
  ```html\n<html>\n  <head>\n    <title>这段文字显示在浏览器栏中</title>\n  </head>\n  <body>\n\
  \    <h1>显示内容从这里开始</h1>\n    <p>\n      本课程介绍了 <em>JavaScript</em>的核心功能，\n     \
  \ 并展示了在何时以及如何使用它们。\n    </p>\n    <!-- \"JavaScript\" 一词在前面的段落中是斜体（强调） -->\n   \
  \ <!-- 段落。 -->\n  </body>\n</html>\n```\n\n\n\n\n\n-   在标题或段落中，我们可以使用 `em` 来*强调*文本。我们也可以使用\
  \ `strong` 让文本变得*更粗*。这类标签比 `i`（用于斜体）或 `b`（用于加粗）标签更好，因为它们传达的是意图，而不是强制特定的布局。视障人士或使用小屏幕设备的人可能希望以不同的方式显示各种类型的强调。\n\
  \n## 5.4 属性\n\n可以通过为元素提供`attributes`来自定义元素，属性写在元素的起始标签内部，以 `name=\"value\"` 键对的形式存在。例如：\n\
  \n```html\n<h1 align=\"center\">A Centered Heading</h1>\n```\n\n将 `h1` 标题居中显示在页面，同时：\n\
  \n```html\n<p class=\"disclaimer\">This planet provided as-is.</p>\n```\n\n将此段落标记为免责声明。这对\
  \ HTML 来说并没有特殊含义，但正如我们之后将看到的，我们可以根据元素的 `class` 属性定义样式。\n\n属性名称在任何元素中最多只能出现一次，就像键在任何\
  \ JavaScript 对象中只能出现一次一样，所以 `<p align=\"left\" align=\"right\">…</p>` 是非法的。如果我们想给一个属性多个多个值——例如，如果我们希望一个元素拥有多个类——我们就将所有值放在一个字符串中。遗憾的是，如下例所示，HTML\
  \ 在值是否应该用空格还是分号分隔方面是不一致的：\n\n```html\n<p class=\"disclaimer optional\" style=\"\
  color: blue; font-size: 200%;\">\n```\n\n无论它们如何分隔，值都应该用引号括起来，但在实践中，我们通常直接使用 `name=value`\
  \ 也可以。对于值仅为 true 或 false 的布尔属性，我们有时甚至只用 `name` 即可。\n\n## 5.5 列表\n\n标题和段落都很好，但数据科学家需要更多内容。要创建一个无序列表（项目符号列表），我们使用\
  \ `ul` 元素，并将列表中的每个项目封装在 `li` 中。要创建一个有序列表（编号列表），我们使用 `ol` 代替 `ul`，但仍然使用 `li` 来作为列表项。\n\
  \n```html\n<ul>\n  <li>first</li>\n  <li>second</li>\n  <li>third</li>\n</ul>\n\
  ```\n\n-   first\n-   second\n-   third\n\n```html\n<ol>\n  <li>first</li>\n  <li>second</li>\n\
  \  <li>third</li>\n</ol>\n```\n\n1. first\n2. second\n3. third\n\n可以通过将内部列表的 `ul`\
  \ 或 `ol` 放在外部列表的其中一个 `li` 元素内部来嵌套列表：\n\n```html\n<ol>\n  <li>Major A\n    <ol>\n\
  \      <li>minor p</li>\n      <li>minor q</li>\n    </ol>\n  </li>\n  <li>Major\
  \ B\n    <ol>\n      <li>minor r</li>\n      <li>minor s</li>\n    </ol>\n  </li>\n\
  </ol>\n```\n\n1. Major A\n1. minor p\n2. minor q\n2. Major B\n1. minor r\n2. minor\
  \ s\n\n## 5.6 表格\n\n列表是入门的很好的方法，但如果我们*真的*想用我们的数据科学技能来惊艳他人，我们需要表格。意乎所的是，我们使用 `table`\
  \ 元素来创建这些。每一行都是一个 `tr`（代表“table 行”），在行内，列项通过 `td`（代表“table 数据”）或 `th`（代表“table 表头”）显示。\n\
  \n```html\n<table>\n  <tr><th>Alkali</th><th>Noble Gas</th></tr>\n  <tr><td>Hydrogen</td><td>Helium</td></tr>\n\
  \  <tr><td>Lithium</td><td>Neon</td></tr>\n  <tr><td>Sodium</td><td>Argon</td></tr>\n\
  </table>\n```\n\n| Alkali | Noble Gas |\n| --- | --- |\n| Hydrogen | Helium |\n\
  | Lithium | Neon |\n| Sodium | Argon |\n\n**不要*使用表格来创建多列布局：有更好的方法。\n\n## 5.7 链接\n\
  \n指向其他页面的链接使 HTML 成为超文本(图 5.2)）。令人困惑的是，显示链接的元素被称为 `a`。元素内部的文本会被显示并（通常）高亮以供点击。它的\
  \ `href` 属性指定了链接指向何；支持本地文件名和 URL。哦，我们可以使用\n\n`<br/>`\n\n在文本中强制换行（标签内部有一个尾随斜杠，因为\
  \ `br` 元素不包含任何内容）：\n\n![Image](img/fig5_2.jpg)\n\n图 5.2：页面与链接\n\n```html\n<a href=\"\
  https://nodejs.org/\">Node.js</a>\n<br/>\n<a href=\"https://facebook.github.io/react/\"\
  >React</a>\n<br/>\n<a href=\"../index.html\">home page (relative path)</a>\n```\n\
  \n它显示为：\n\nNode.js\nReact\nhome page (relative path)\n\n具有通常的点击性。\n\n## 5.8 图像\n\
  \n图像可以通过两种方式存储在 HTML 页面中：使用 SVG（我们将在第 8 章 中讨论它）或将图像编码为文本并将该文本包含页面主体中，这很聪明，但会让源代码非常难以阅读。\n\
  \n更常见的方法是将每个图像存储在单独的文件中并使用 `img` 元素引用该文件（这也允许我们在许多地方使用图像而无需复制它）。`img` 标签的 `src`\
  \ 属性指定了查找文件的位置；与 `a` 元素的 `href` 属性一样，这可以是 URL 或本地路径。每个 `img` 还应该包含一个 `title` 属性（其目的不言自明）和一个带有描述性文本的\
  \ `alt` 属性，以帮助辅助功能和搜索引擎。（再次，我们对内容进行了折行和包装，以便在打印版本中显示良好。）\n\n```html\n<img src=\"\
  ./assets/logo.png\" title=\"Book Logo\" alt=\"Displays the book logo using a local\
  \ path\" />\n```\n\n需要注意的两点：\n\n1. `img` 标签的 `src` 属性指定了查找文件的位置；与 `a` 元素的 `href`\
  \ 属性一样，这可以是 URL 或本地路径。\n2. 每一个 `img` 还应该包含一个 `title` 属性（其目的不言自明）和一个带有描述性文本的 `alt`\
  \ 属性，以帮助辅助功能和搜索引擎。\n\n## 5.9 级联样式\n\n当 HTML 最初出现时，人们通过设置属性来样式元素：\n\n```html\n<html>\n\
  <body>\n  <h1 align=\"center\">A Centered Heading</h1>\n  <p class=\"disclaimer\"\
  >This planet provided as-is.</p>\n</body>\n</html>\n```\n\n许多人仍然这样做，但更好的方法是使用**级联样式表**（CSS）。这些允许我们定义一次样式并多次使用，这使得维护变得简单得多。（我们本想说“保持易读”，但考虑到\
  \ CSS 的复杂性，我们无法做出这种承诺。）这里有一个使用 CSS 的页面：\n\n```html\n<html>\n<head>\n  <link rel=\"\
  stylesheet\" href=\"simple-style.css\" />\n</head>\n<body>\n  <h1 class=\"title\"\
  >A Centered Heading</h1>\n  <p><span class=\"keyword\">Text</span>可以可以被高亮或<span\
  \ class=\"highlight\">着色</span>。</p>\n</body>\n</html>\n```\n\n`simple-style.css`\
  \ 文件如下：\n\n```css\nh1.title {\n  text-align: center;\n}\n\nspan.keyword {\n  font-weight:\
  \ bold;\n}\n\n.highlight {\n  color: coral;\n}\n```\n\n\n\n\n每个条目都采用 `tag.class`\
  \ 的形式，后面跟着大括号内的属性组，每个属性都是一个键值对。我们可以省略类名只写（例如）：\n\n```css\np{\n  font-style: italic;\n\
  }\n```\n\n在这种情况下，样式将适用于所有带有该标签的内容。如果这样这样做，我们可以用特定规则来覆盖通用规则：免责声明段落的样式由 `p` 定义，而覆盖规则由\
  \ `p.disclaimer` 定义。我们也可以省略标签，简单地使用 `.class,`，在这种情况下，每个具有该类的元素都具有该样式。\n\n正如之前对分隔符的讨论所建议的，元素的\
  \ `class` 可以有多个值，例如 `<span class=\"keyword highlight\">…</</span>`。（`span` 元素只是标记一段文本区域，但除非对其应用样式，否则它没有作用。）\n\
  \n这些特性是 CSS 中一个（但遗憾不是唯一的）常见的困惑来源：如果人们既可以用特定规则覆盖通用规则，又可以为 `class` 提供多个值，我们该如何跟踪哪些规则将适用于具有多个类的元素呢？CSS\
  \ 规则优先级的详细讨论超出了本教程的范围。我们建议那些可能经常处理样式表的人阅读（并考虑收藏）这个 W3Schools 页面¹。\n\nCSS 能够做的另一一件事是匹配特定元素。我们可以使用\
  \ `id` 属性在页面内唯一地标记特定元素，然后使用 `#name` 作为选择器引用这些元素。例如，如果我们创建一个页面，为两个 `span` 分赋予了唯一的\
  \ ID：\n\n```html\n<<html>\n  <head>\n    <link rel=\"stylesheet\" href=\"selector-style.css\"\
  \ />\n  </head>\n  <body>\n    <p>\n      First <span id=\"major\">keyword</span>。\n\
  \    </p>\n    <p>\n      Full <span id=\"minor\">explanation</span>。\n    </p>\n\
  \  </body>\n</html>\n```\n\n那么我们就可以像这样为这些 `span` 设置样式：\n\n```css\n#major {\n  text-decoration:\
  \ underline red;\n}\n\n#minor {\n  text-decoration: overline blue;\n}\n```\n\n###\
  \ 内部链接\n\n我们可以在链接的 `href:` 中使用 `#name` 来链接页面中的元素，例如，`<a href=\"page.html#place\"\
  >text</a>` 指向 `page.html` 中的 `#place` 元素。这在页面内部特别有用：`<a href=\"#place\">jump</a>`\
  \ 会直接带我们跳转到本页面内的 `#place` 元素。这样的内部链接通常用于交叉引用和创建目录。\n\n## 5.10 BOOTSTRAP\n\nCSS 可能会很快变得非常复杂，因此大多数人使用框架来处理细节。最流行的框架之一是\
  \ Bootstrap²（我们用它来美化我们的网站）。下面是一个使用 Bootstrap 创建带有顶部横幅的双列布局页面的完整源代码（图 5.3）：\n\n```html\n\
  <html>\n  <head>\n    <link rel=\"stylesheet\" href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css\"\
  >\n    <style>\n      div {\n        border: solid 1px;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    <div class=\"jumbotron text-center\">\n      <h1>Page\
  \ Title</h1>\n      <p>调整此页面大小以查看布局的动态调整。</p>\n    </div>\n    <div class=\"container\"\
  >\n      <div class=\"row\">\n        <div class=\"col-sm-4\">\n          <h2>First\
  \ column is 4 wide</h2>\n          <p>Text here goes</p>\n          <p>in the column</p>\n\
  \        </div>\n        <div class=\"col-sm-8\">\n          <h2>Second column is\
  \ 8 wide</h2>\n          <p>Text over here goes</p>\n          <p>in the other column</p>\n\
  \        </div>\n      </div>\n    </div>\n  </body>\n</html>\n```\n\n![Image](img/fig5_3.jpg)\n\
  \n图 5.3：Bootstrap 布局\n\n该页面通过从网络加载 Bootstrap 来打开；我们也可以下载 `bootstrap.min.css` 并使用本地路径引用它。（文件名中的\
  \ `.min` 标志该文件经过压缩，因此加载速度会更快。）\n\n页面随后使用 `style` 元素创建一个内部样式表，为每个 `div` 添加一个 1 像素的实线边框，以便我们更清晰地看到页面区域。在页面头部中定义样式通常是一个坏主意，但它是快速测试内容的好方法。哦，`div`\
  \ 只是标记页面的一个区域而不对其进行任何操作，就像 `span` 标记一段文本区域而除非应用样式，否则不会改变其外观一样。\n\n第一个 `div` 创建了一个页眉框（称为“jumbotron”）并使其文本居中。第二个\
  \ `div` 是一个容器，它在我们内容的左右两侧创建了一些外边距。该容器内部有一行，包含两列，一列的宽度为行的 4/12，另一列的宽度为 8/12。（Bootstrap\
  \ 使用 12 列系统，是因为 12 有很多因数。）\n\nBootstrap 是响应式的：元素会随着页面变窄而改变大小，当屏幕变小到无法并排显示它们时，它们会堆叠在一起。\n\
  \n我们还省略了 HTML 和 CSS 的许多其他方面，例如图片说明、多列表格单元格，以及为什么在 `div` 中垂直居中文字如此困难。我们将在 第 10 章\
  \ 中返回的一个点是在如何在页面中包含按钮和表单等交互元素。处理这些内容是最初发明 JavaScript 的原因之一，但在处理它们之前，我们需要更多的经验。\n\
  \n## 5.11 练习题\n\n### 偷懒\n\n如果你忘记写全以下内容，显示器会显示什么：\n\n```html\n<p>这个段落开始了但没有结束。\n\
  <p>另一个段落开始了但没有结束。\n<ul>\n  <li>第一个项目没有闭合。</li>\n  <li>第二个项目没有闭合。</li>\n</ul>\n```\n\
  \n1. 如果漏掉 `p>` 或 `li>` 会发生什么？\n2. 你可以对 `ul` 或 `ol` 进行缩进吗？\n\n### 混合搭配\n\n1. 创建一个包含\
  \ 2x2 表格的页面，每个单元格中都有一个三点符号项目列表（无序列表）。\n2. 在不同的浏览器（例如 Firefox 或 Edge）中打开你的页面。它们会显示缩进列表吗？\n\
  3. 为什么程序的行为不一致？为什么要对我们这样做？为什么 为什么 为什么？\n\n### 命名\n\nBootstrap 中 `col-sm-4` 和 `col-sm-8`\
  \ 里的 `sm` 代表什么？你还可以使用哪些选项？为什么网页开发者在 21 世纪仍然使用 FORTRAN 风格的名称？\n\n### 颜色\n\nHTML 和\
  \ CSS 定义了少数颜色的名称。所有其他颜色都必须使用 RGB 值指定。编写一个小型 JavaScript 程序，创建一个 HTML 页面，用 100 种随机生成的颜色显示\
  \ `color` 这个词。将其与你网站中使用的配色方案进行比较。哪一个更不伤眼睛？\n\n### 单位\n\n在 CSS 中可以使用哪些不同的单位来指定文本大小？它们意味着什么？归根结底，任何东西意味着什么？\n\
  \n### 关键点\n\n- HTML 是长长标记语言序列中的最新成果。\n- HTML 文档包含元素（用角括号中的标签表示）和文本。\n- 元素必须严格嵌套。元素可以包含属性。\n\
  - 使用以与符号开头的转义序列来表示特殊字符。\n- 每个页面都应该有一个 `html` 元素，其中包含一个 `head` 和一个 `body`。\n- 使用\
  \ `ul` 和 `ol` 用于无序列表和有序列表，使用 `li` 用于列表元素。\n- 使用 `table` 用于表格，`tr` 用于行，`th` 用于表头，`td`\
  \ 用于普通数据。\n- 使用 `<a href=\"…\"></a>` 创建链接。\n- 使用 `<img src=\"…\" title=\"…\" alt=\"\
  …\" />` 包含图像。\n- 使用 CSS 定义元素的外观。\n- 使用 `class` 和 `id` 识别元素。\n- 使用选择器指定 CSS 应用于哪些元素。\n\
  \n\n\n\n# 6 操作页面\n\n我们已经介绍了许多工具，但目前还没有任何具体的应用。作为对你耐心的奖励，我们将通过几个示例来展示如何对网页进行实用的操作。这些示例引入了一些新概念，其中最重要的一点是\
  \ JavaScript 表示和操作 HTML 页面的方式。\n\n这些示例*没有*展示如何构建交互式 Web 页面。JavaScript 的发明主要是为了支持按钮、表单等，但在探索它们之前，我们需要积累一些背景知识。尽管如此，仅仅通过玩弄页面内容，我们就能完成许多令人惊讶的实用工作。\n\
  \n## 6.1 统计段落\n\n让我们从统计页面中段落的数量开始吧：\n\n```html\n<html>\n<head>\n    <meta charset=\"\
  utf-8\"/>\n</head>\n<body>\n    <h1>Title</h1>\n    <div id=\"fill\"></div>\n  \
  \  <h2 id=\"one\">First <em>emphasized</em></h2>\n    <p>stuff</p>\n    <h2 id=\"\
  two\">Second `with code`</h2>\n    <h3>stuff</h3>\n    <h2 id=\"three\">Third</h2>\n\
  \    <p>stuff</p>\n    <script>\n        const counter =() {\n            const\
  \ paragraphs = document.querySelectorAll('p')\n            return paragraphs.length\n\
  \        }\n        console.log('number of paragraphs: ${counter()}')\n    </script>\n\
  </body>\n</html>\n```\n\n此页面有三个主要部分：\n\n1. `head` 包含一个 `meta` 标签，指定了页面的**字符编码**，即用于表示\
  \ 1970 年代标准美国键盘上不存在的字符的方案。字符集和字符编码超出了本课的范围；请参阅这本文[¹]](#13_Chapter06.xhtml_fn6_1)\
  \ 中关于这一永不过的话题的讨论。\n2. `body` 的上半部分有一些标题和段落，供 JavaScript 操作。它还包含一个标记为 `class=\"fill\"\
  ` 的 `div`，我们的脚本最终会在其中填充计数结果。\n3. 脚本本身位于页面底部的 `script` 标签中；我们将在下文中对其进行深入探讨。\n\n>\
  \ 当脚本运行时\n>\n> *我们将脚本放在页面底部，是因为我们想确保在尝试处理内容之前，页面内容已实际存在于内存中。如果我们将 `script` 标签及其内容放在页面顶部，浏览器可能会在页面被读取*之后*、但在元素和文本被解析并存储到内存*之前*运行我们的\
  \ JavaScript。这种**竞态条件**会困扰 Web 编程；我们稍后会看到更健壮的方法来处理它们*。\n\n在 `script` 标签内部，我们定义了一个名为\
  \ `counter` 的函数，它不接受任何参数，然后使用 `console.log` 显示调用它的结果。函数内部我们之前没有遇到的唯一内容是 `document.querySelectorAll('p')`。正如你从它的名称中猜的那样，`document`\
  \ 是一个对象，为我们脚本所在页面的句；它由浏览器自动创建并提供。它的 `querySelectorAll` 方法可以找到页面中所有匹配我们提供的选择器的元素。在这种情况下，我们正在寻找所有的段落，所以只需搜索\
  \ `'p'`。\n\n要查看 JavaScript 的运行情况，请运行浏览器，打开开发者工具以便看到 JavaScript 控制台，然后加载页面。页面元素将照常显示，控制台将显示：\n\
  \nnumber of paragraphs: 2\n\n> 开发者工具\n>\n> *要在 Firefox 中打开开发者工具，请前往主菜单并选择 `Tools\
  \ > Web Developer > Toggle Tools`。页面底部会打开一个选项卡显示；选择 `Console` 查看你的 JavaScript 输出，或者编写一些代码并立即运行。你还可以在\
  \ Chrome 中通过 `View > Developer > JavaScript Console` 打开类似的工具集，或者在 Windows 的 Firefox、Chrome\
  \ 或 Microsoft Edge 中使用 `Ctrl+Shift+I`*。\n\n在控制台中显示结果对于开发工作来说已经足够了，但我们希望在页面本身中看到结果。为了实现，我们可以将对\
  \ `console.log` 的调用替换如下所示的两行代码：\n\n```javascript\nconst counter =() {\n    const\
  \ paragraphs = document.querySelectorAll('p')\n    return paragraphs.length\n}\n\
  \nconst fill = document.getElementById('fill')\nfill.innerHTML = 'number of paragraphs:\
  \ ${counter()}'\n```\n\n其中 `document.querySelectorAll` 返回所有匹配选择器的节点，`document.getElementById`\
  \ 返回具有指定 ID 的单个元素（该 ID 在元素的起始标签中通过 `id=\"some_name\"` 设置）。因此，变量 `fill` 被赋值为指向我们\
  \ `div` 的引用。然后我们可以通过给其 `innerHTML` 属性赋值来更改该元素内部的文本。当我们这样做时，JavaScript 会像处理 `HTML`\
  \ 一样解析我们提供的字符串，并创建表示结果所需的任何节点。在这种情况下，内容只是文本，因此 JavaScript 将创建一个单个文本节点，将 `\"number\
  \ of paragraphs: 2\"` 存储为其内容，并将其添加到表示页面的内存结构中。\n\n……此时，后台发生了一些魔法。浏览器将当前页面的元素和文本存储在一个名为文档对象模型（Document\
  \ Object Model）的数据结构中，更常被称为 **`DOM`**。正如图 5.1 [#12_Chapter05.xhtml_fig] 所示，DOM 以树的形式组织：每个元素或文本都是一个节点，而节点的子元素是包含其中的元素。每当\
  \ DOM 发生变化时，它都会自动刷新。\n\n## 6.2 创建目录\n\n报告段落数量是观察 JavaScript 如何工作的好方法，但并不特别有用（尽管计算单词数将在练习中解决）。我们更有可能放在真实页面中的目录，它比我们看到的稍微多一点代码：\n\
  \n```javascript\n(() => {\n    const container = document.getElementById('fill')\n\
  \    const headings = Array.from(document.querySelectorAll('h2'))\n    const items\
  \ = headings\n        .map((h) => `<li><a href=\"#${h.id}\">${h.innerHTML}</a></li>`\
  \ )\n        .join('')\n    container.innerHTML = '<ul>' + items + '</ul>'\n})()\n\
  ```\n\n让我们从第一行最后一行开始，因为它们展示了一种常用的用法。我们已经见过如何定义一个函数然后调用它：\n\n```javascript\nconst\
  \ f = (param) => {\n    // body\n}\nf()\n```\n\n如果我们只调用一次函数，还不如在定义它的同时立即调用它，而不给它命名：\n\
  \n```javascript\n(param) => {\n    // body\n}(actual_value)\n```\n\n然而，这种写法并不能可靠地工作；为了让\
  \ JavaScript 满意，我们必须给函数定义加上括号，以便清楚地表示哪些内容正在被调用：\n\n```javascript\n((param) => {\n\
  \    // body\n})(actual_value)\n```\n\n箭头函数之前的 `()` 表示“此函数不接受任何参数”。闭大括号后的第二个 `()`\
  \ 表示“调用该函数”。如果函数不接受任何参数，它将变成：\n\n```javascript\n(() => {\n    // body\n})()\n```\n\
  \n连续出现很多括号，但人们就是这样写的。\n\n让我们回到函数的体部：\n\n```javascript\ncontainer = document.getElementById('fill')\n\
  const headings = Array.from(document.querySelectorAll('h2'))\nconst items = headings\n\
  \    .map((h) => `<li><a href=\"#${h.id}\">${h.innerHTML}</a></li>` )\n    .join('')\n\
  container.innerHTML = '<ul>' + items + '</ul>'\n```\n\n\n\n\n和之前一样，第一行获取了我们要填充的\
  \ `div`。第二行抓取了所有的 `h2` 标题，我们人为决定这些标题是唯一值得包含在目录中的内容。我们将 `document.querySelectorAll`\
  \ 的结果通过 `Array.from` 函数，因为前者的结果并不是 JavaScript 数组：出于某些可能对某人、某处是有道理的原因，它是一个被称为 `NodeList`\
  \ 的类型，它缺少了 `Array` 的绝大多数有用方法。\n\n> 静态方法\n> `Array.from` 是一个静态方法：它属于类本身，而不是属于该类的对象。静态方法主要用于将工具函数与类关联，例如下面示例中的\
  \ `dist`。与像 `magnitude` 这样的实例方法的调用不同，静态方法使用 `class.method()` 进行调用，而不是 `some_object.method()`。\n\
  \n接，我们有三行代码完成了该函数的大部分工作。第一行告诉我们 `items` 将被赋值为源自 `headings` 的内容；第二行将标题数组转换为字符串数组，第三行将这些字符串连接起来创建一个单个字符串。观察\
  \ `map` 调用，每个标题都变成一个列表列表项 (li)，其中包含一个链接 (a)，其 `href` 属性是标题的 ID，而其显示内容（`<a…>` 和 `</a>`\
  \ 之间的文本）是标题的文本。`href` 属性的值以 `#` 开头，这使其成为本地链接（即它链接到同一页面内部的内容）。如果我们的 `h2` 标题之一没有设置\
  \ `id`，这个 `map` 将失败；我们将在练习中探索处理这种情况的方法。\n\n最后，上面显示的代码的最后一行在容器（即 `div`）中填充了一个无序列表\
  \ (`ul`)，该列表包含了我们刚刚构建的所有项目。再次，，当我们给元素的 `innerHTML` 属性赋值时，JavaScript 会解析我们给它的字符串并构建我们需要的\
  \ HTML 节点。虽然由我们自己构建这些节点会稍微快一点（我们将在练习中这样做），但构建和解析字符串通常更易读，而且在现代浏览器中性能差异微乎其微，只有当它们确实证明是一个问题时我们才需要担心它们。\n\
  \n## 6.3 可排序列表\n\n创建节点允许我们向页面添加内容，但我们也可以重新排列现节点。我们的下一个练习是对列表的元素进行排序，以便如果作者写道：\n\n\
  ```html\n<ul>\n  <li>pee (P)</li>\n  <li>cue (Q)</li>\n  <li>are (R)</li>\n</ul>\n\
  ```\n\n我们将自动重新排列项目为：\n\n```html\n<ul>\n  <li>are (R)</li>\n  <li>cue (Q)</li>\n\
  \  <li>pee (P)</li>\n</ul>\n```\n\n我们的第一次尝试使用此作为 HTML 页面：\n\n```html\n<html>\n \
  \ <head>\n    <meta charset=\"utf-8\">\n    <script src=\"sort-lists.js\"></script>\n\
  \  </head>\n  <body onload=\"sortLists()\">\n    <ul class=\"sorted\">\n      <li>first</li>\n\
  \      <li>second</li>\n      <li>third</li>\n      <li>fourth</li>\n      <li>fifth</li>\n\
  \    </ul>\n    <ol class=\"sorted\">\n      <li>one</li>\n      <li>two</li>\n\
  \      <li>three</li>\n      <li>four</li>\n      <li>fifth</li>\n    </ol>\n  </body>\n\
  </html>\n```\n\n并将此作为我们的初始脚本：\n\n```javascript\nconst sortLists = () => {\n  const\
  \ allLists = Array.from(document.querySelectorAll('#sorted'))\n  allLists.forEach((list)\
  \ => {\n    const children = Array.from(list.childNodes)\n      .filter(c => c.nodeName\
  \ !== '#text')\n      .sort((left, right) =>\n        left.textContent.localeCompare(right.textContent))\n\
  \    while (list.firstChild) {\n      list.removeChild(list.firstChild)\n    }\n\
  \    children.forEach(c => list.appendChild(c))\n  })\n}\n```\n\n然而，当我们加载页面时，项目并没有被排序。通过一些尝试发现，我们掉入了所提到的竞态条件陷阱：如果我们在\
  \ `body` 标签的 `onload` 属性中调用函数，它会在页面加载到内存中后、在页面内容被解析并转换为 DOM 树*之前*运行。在网上搜索“run JavaScript\
  \ page loaded”后，我们回到了这里：\n\n```html\n<html\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <script src=\"sort-lists.js\"></script>\n  </head>\n  <body>\n    ...lists...\n\
  \  </body>\n</html>\n```\n\n并像这样写我们的 JavaScript：\n\n```javascript\nconst sortLists\
  \ = () => {\n  //... 排序列表\n}\ndocument.addEventListener(\"DOMContentLoaded\", (event)\
  \ => {\n  sortLists()\n})\n```\n\n图 6.1: 排序与替换\n\n事件监听器是浏览器当某种类型的事件发生时调用的函数。在我们的示例中，我们关心的事件是“DOM\
  \ 内容已加载”。当该事件发生时，浏览器将调用 `sortLists`。我们函数的 `event` 参数将获得一个存储发生情况详情的对象。我们现在不需要那些信息，但当我们开始处理点击时会使用它们。让我们回到函数：\n\
  \n```javascript\nconst sortLists = () => {\n  const lists = Array.from(document.querySelectorAll('.sorted'))\n\
  \  lists.forEach((list) => {\n    const children = Array.from(list.childNodes)\n\
  \      .filter(c => c.nodeName !== '#text')\n      .sort((left, right) =>\n    \
  \    left.textContent.localeCompare(right.textContent))\n    while (list.firstChild)\
  \ {\n      list.removeChild(list.firstChild)\n    }\n    children.forEach(c => list.appendChild(c))\n\
  \  })\n}\n```\n\n和之前一样，它首先创建一个包含我们想要操作的节点的数组。我们使用选择器 `.sorted`（前面带点）来选择所有类为 `sorted`\
  \ 的元素，而不是 `#sorted`（后者会找到 ID 为 `sorted` 的节点）。该数组将包含该函数要排序的所有 `ul` 或 `ol` 列表。\n\n\
  我们通过 `lists.forEach` 分别处理每个列表。`forEach` 内部的回调函数使用 `Array.from` 创建包含主列表元素子节点的数组，然后过滤该列表以移除任何文本节点。我们需要\
  \ `Array.from` 调用是因为（再次）DOM 不使用 JavaScript 数组来存储子节点，而是使用自己设计的一种结构，该结构缺少我们想要调用的方法。我们移除文本节点是因为它们代表了列表元素之间的空白，例如闭合标签\
  \ `</li>` 之后和下一个开启标签 `<li>` 之前的换行符。\n\n> 识别文本节点\n> 我们可以检查 `c.nodeType` 而不是 `c.nodeName`\
  \ 来识别文本节点，但我们觉得 `nodeName` 让代码更易理解。一如既常，我们使用 `!==` 进行比较以防止不必要的意外。\n\n现在我们有了一个要排序的\
  \ `li` 元素数组，可以使用 `Array.sort` 对它们进行排序。由于我们想要根据包含的文本进行排序，我们必须提供自己的排序函数，返回负数、0 或正数，以显示其\
  \ `left` 参数小于、等于还是大于 `right` 参数。我们使用节点的 `textContent` 成员来获取它包含的文本，并使用字符串对象的 `localeCompare`\
  \ 来获取 -1/0/1 的结果。这一切都是通过网上搜索发现的，主要在 W3Schools 网站上。\n\n\n\n于是，我们来到了本节中最大的例子。HTML\
  \ 有一个用于格式化引用的 `cite` 标签，但它不允许我们直接链接到参考文献条目。为了尽可能减少学术论文中的打字量，我们希望找到像这样的链接：\n\n```\n\
  <a href=\"#b\">key1, key2</a>\n```\n\n并将它们转换为这样：\n\n```\n[<a href=\"../bib/#key1\"\
  >key1</a>, <a href=\"../bib/#key2\">key2</a>]\n```\n\n手动输入的形式已经是我们能接受的最少打字量；而显示的格式会将引用包裹在\
  \ `[...]` 中，并将每个单独的引用转换为指向参考文献列表的链接。目前，我们假设参考文献列表位于 `../bib/`，即位于名为 `bib` 的目录下的\
  \ `index.html` 文件中，而该目录是包含引用所在页面目录的同级目录。这种做法非常脆弱，我们应该为自己感到羞愧，但我们可以告诉自己稍后会修复它，现在先继续学习\
  \ `JavaScript`。\n\n我们的测试页面包含两个参考文献链接和一个非参考文献链接：\n\n```html\n<html>\n<head>\n  <meta\
  \ charset=\"utf-8\">\n  <script src=\"citations.js\"></script>\n</head>\n  <body>\n\
  \    <p>As <a href=\"#b\">Moreau1896</a> shows shows…</p>\n    <p>\n      We can\
  \ look to <a href=\"#b\">Brundle1982, Brundle1984</a>\n      for answers.\n    </p>\n\
  \    <hr/>\n    <p><em> Visit http://somewhere.org the author′s site.</em></p>\n\
  \  </body>\n</html>\n```\n\n这是我们的函数（图 6.2），我们将像以前一样从事件监听器中调用它：\n\n```javascript\n\
  const citations=() {\n  Array.from(document.querySelectorAll('a'))\n    .filter(link\
  \ => link.getAttribute('href') === '#b')\n    .map(link => (\n      {\n        node:\
  \ link,\n        text: link.textContent.split(',').map(s => s.trim())\n      }\n\
  \    ))\n    .map(({node, text}) => (\n      {\n        node,\n        text: text.map(cite\
  \ => `<a href=\"../bib/#${cite }>${cite}</a>`)\n      }\n    ))\n    .map(({node,\
  \ text}) => (\n      {\n        node,\n        text: `[${text.join(', ')}]`\n  \
  \    }\n    ))\n    .forEach(({node, text}) => {\n      const span = document.createElement('span')\n\
  \      span.innerHTML = text\n      node.parentNode.replaceChild(span, node)\n \
  \   })\n}\n```\n\n这里发生了很多操作，但它们使用的模式我们之前见过的。它首先构建文档中所有链接（即每个 `a` 元素）的数组：\n\n```javascript\n\
  Array.from(document.querySelectorAll('a'))\n```\n\n// *输出:*\n// - `<a href=\"#b\"\
  >Moreau1896</a>`\n// - `<a href=\"#b\">Brundle1982, Brundle1984</a>`\n// - `<a href=\"\
  http://somewhere.org\">http://somewhere.org</a>` 作者的站点\n\n（我们在注释中显示节点，以视觉化流水线中每一步的操作。）我们随后过滤此数组以找到指向\
  \ `#b` 的链接，我们正用它来标记引用：\n\n![图像](img/fig6_2.jpg)\n\n图 6.2：处理流水线\n\n```javascript\n\
  .filter(link => link.getAttribute('href') === '#b')\n```\n\n// *输出:*\n// - `<a href=\"\
  #b\">Moreau1896</a>`\n// - `<a href=\"#b\">Brundle1982, Brundle1984</a>`\n\n我们现在遇到了一个问题。可以使用\
  \ `map` 调用来从每个链接中提取文本并对其进行处理，但这样我们拥有的只是一个字符串数组。稍后我们还需要这些字符串所属的节点，以便能够修改它们的 `href`\
  \ 属性，因此我们必须以某种方式在流水线中将节点和字符串一起传递。一种方案是为每个元素创建一个包含两个元素的数组：\n\n```javascript\n.map(link\
  \ => [link, link.textContent.whatever])\n```\n\n但创建一个对象更具可读性，这样每个组件都有一个名称：\n\n```javascript\n\
  .map(link => (\n  {\n    node: link,\n    text: link.textContent.split(',').map(s\
  \ => s.trim())\n  }\n))\n```\n\n// *输出:*\n// - {node: <a href=\"#b\">Moreau1896</a>,\n\
  //   text: ['Moreau1896']}\n// - {node: <a href=\"#b\">Brundle1982, Brundle1984</a>,\n\
  //   text: ['Brundle1982', 'Brundle1984']}\n```\n\n在这里，我们将每个链接转换为一个对象，其 `\"node\"\
  ` 键的值是链接的 DOM 节点，其 `\"text\"` 键是节点的文本，我们对其进行了逗号分割并去除了首尾空格。\n\n我们还没有结束流水线的这个阶段：\n\
  \n1. 我们不需要给 `\"node\"` 和 `\"text\"` 加引号，尽管可以这样做。\n2. `String.split` 返回一个数组，因此与 `\"\
  text\"` 相关的值是一个数组。我们随后对它的元素进行 `map` 以去除首尾空格。\n3. 如果我们写 `link => {node: link, text:\
  \ whatever}`，JavaScript 会将大括号 `{…}` 解析为“这是函数体”，然后因为大括号里的显然不是函数体而报错。在大括号外加上括号，即写作\
  \ `({…})`，告诉 JavaScript 该函数返回一个对象。\n\n在完成所有这些之后，流水线的下一个阶段几乎是解脱：\n\n```javascript\n\
  .map(({node, text}) => (\n  {\n    node,\n    text: text.map(cite => `<a href=\"\
  ../bib/#${cite}\">${cite}</a>`)\n  }\n))\n```\n\n// *输出:*\n// - {node: <a href=\"\
  #b\">Moreau1896</a>,\n//   text: [<a href=\"../bib/#Moreau1896\">Moreau1896</a>>]}\n\
  // - {node: <a href=\"#b\">Brundle1982, Brundle1984</a>,\n//   text: [<a href=\"\
  ../bib/#Brundle1982\">Brundle1982</a>,\n//   <a href=\"../bib/#Brundle1984\">Brundle1984</a>>]}\n\
  ```\n\n流水线的最后一个阶段使用 `forEach` 而不是 `map`，因为我们要对数组的每个元素执行某些操作，但不需要返回值（因为我们正在做的具有修改文档的副作用）：\n\
  \n```javascript\n.forEach(({node, text}) => {\n  const span = document.createElement('span')\n\
  \  span.innerHTML = text\n  node.parentNode.replaceChild(span, node)\n})\n```\n\n\
  这正是我们在流水线中一直传递节点本身得到了回报的地方。我们创建一个 `span` 元素，通过赋值给其 `innerHTML` 属性来填充它，然后用刚刚创建的节点替换原始链接节点。如果我们现在在函数之后添加一个事件监听器，在页面加载时调用它，就能看到按我们期望格式化的引用。\n\
  \n## 6.5  实时时钟\n\n我们将用一个简短的例子结束本节，但它预示了未来的可能性：\n\n![图像](img/pg66_1.jpg)\n\n\n\n\
  定义一个函数：`check`。在 DOM 准备就绪时调用该函数：`check`。函数内部呢？很容易猜到 `Date()` 创建了一个包含日期的对象，而且由于我们将该对象赋值给名为\
  \ `today` 的变量，你甚至可能猜到，如果我们不指定想要的日期，我们得到的就是今天的值。然后，我们从日期中提取小时、分钟和秒，并将它们放入数组中，这样我们就可以将每个值转换为两个字符的字符串（必要时在前面补零），然后连接这些字符串以创建一个类似\
  \ `17:48:02` 的时间，并将其填充到 ID 为 `current` 的元素中。\n\n但 `setTimeout` 是做什么的？它告诉浏览器在经过若干毫秒后运行一个函数。在这种情况下，我们将在一秒后运行相同的函数\
  \ `startTime`。该调用将改变显示的时间，然后设置另一个回调在另一秒后运行，如此循环往复。当我们加载页面时，我们看到当前时间每秒一秒地自动更新，提醒着我们生活流逝得有多快。\n\
  \n## 6.6 练习题\n\n## 这是什么编码？\n\n1. 写一个函数，查找脚本所在页面的字符编码并将其打印到控制台。\n2. 扩展该函数以查找当前页面中所有的\
  \ meta 标签，并打印它们的名称和值。\n\n### 单词计数\n\n1. 写一个名为 `countWords` 的函数，找到页面中所有的文本节点，按空白拆分，并返回页面中的总单词数。\n\
  2. 写第二个名为 `showWords` 的函数，使用第一个函数找到单词数，然后将该数字显示在 ID 为 `wordcount` 的段落中。\n\n### 更健壮的目录\n\
  \n1. 如果 `h2` 没有 `id` 属性，目录示例会生成什么？\n2. 修改示例，使目录中仅包含具有 `id` 属性的 `h2` 元素。\n\n### 显式创建节点\n\
  \n在网上查找 `document.createElement` 和 `document.createTextNode` 这两个函数的文档，然后重写目录示例，使用这些方法（以及你需要的任何其他类似的方法），而不是赋值给节点的\
  \ `innerHTML` 属性。\n\n### 核心要点\n\n- 在页面页头中使用 `meta` 标签来指定页面的字符编码。\n- 页面使用文档对象模型 (DOM)\
  \ 在内存中表示。\n- `document` 对象代表脚本所在的页面。\n- 使用 `querySelectorAll` 方法查找匹配条件的 DOM 节点。\n\
  - 将 HTML 文本赋值给节点的 `innerHTML` 属性以更改节点内容。\n- 使用 `((params) => {…})(arguments)` 在单条语句中创建并调用函数。\n\
  - 事件监听器是浏览器在特定事件发生时运行的函数。\n- 为 `DOMContentLoaded` 创建事件监听器，以便在 DOM 构建后触发脚本执行。\n-\
  \ 检查 DOM 节点的 `nodeType` 或 `nodeName` 属性以确定它是什么类型的节点。\n- 解构赋值允许我们在单条语句中按名称为多个变量赋值。\n\
  - 使用 `setTimeout` 在延迟后触发函数的执行。\n- 要让程序无限运行，让 `setTimeout` 调用的函数设置相同函数的另一个定时。\n\n\
  # 7 动态页面\n\n起初，人们通过输入来创建 HTML 页面（正如我们一直所做的那样）。他们很快发现许多页面共享大量内容：导航菜单、联系信息等。几乎通用的做法是创建一个模板并嵌入命令以包含其他\
  \ HTML 片段（如页眉），并遍历数据结构以创建列表和表格。这被称为服务器端页面生成：HTML 在服务器上生成，它之所以流行是因为数据就在那里，而且那里是唯一可以运行代码的地方。（本教程使用了一个名为\
  \ Jekyll 的模板工具。它很笨拙且有限，但它是 GitHub 默认使用的。）\n\n服务器端生成可以是静态的或动态的，即页面可以编译一次、存储在磁盘上并在之后提供服务，或者在需要时重新编译每个页面，这使得轻松包含像今日头条新闻这样的动态元素。\n\
  \n随着浏览器和 JavaScript 变得越来越强大，平衡向客户端页面生成倾斜。在这种模型中，浏览器从一个或多个服务器获取数据，并将这些数据交给 JavaScript\
  \ 库，由其在浏览器中生成 HTML 并显示。这允许客户端决定如何渲染渲染数据，随着手机和平板电脑取代桌面和笔记本电脑，这一点变得越来越重要。它还将计算负担从服务器转移到客户端设备，因此已经创建并广泛使用了（许多）用于此类生成的\
  \ JavaScript 框架。其设计原则是：\n\n1. 我们使用 React 来决定“什么”。\n2. 使用事件监听器决定“何时”变化。\n3. 我们使用\
  \ DOM 来更新 HTML。\n\n## 7.1 页面生成 (07_Contents.xhtml_ch7)\n\n![图 7.1: 页面生成](img/fig7.jpg)\n\
  \n等等，让我们重新检查 7.1 节提供的文本，因为它看起来有些错乱。让我们根据逻辑重构它：\n\n让我们从开始：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <meta charset=\"utf-8\">\n    <title>Hello React</title>\n\
  \    <script src=\"https://unpkg.com/react@18.2.0/umd/react.development.js\"></script>\n\
  \    <script src=\"https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js\"\
  ></script>\n</head>\n<body>\n    <div id=\"app\"></div>\n    <script>\n        ReactDOM.render(\n\
  \            React.createElement('h1', null, \"Hello React\"),\n            document.getElementById(\"\
  app\")\n        );\n    </script>\n</body>\n</html>\n```\n\n（等等，7.1 节提供的文本实际上是描述和代码片段的混合。我将按照规则格式化提示词块中提供的*实际文本*。）\n\
  \n页面的 `head` 从网络加载两个库；我们稍后将使用本地安装的。`body` 包含一个带有 ID 的 `div` 以便查找。当我们的脚本运行时，React\
  \ 将将其生成的 HTML 放入此 `div` 中。\n\n脚本本身使用 `React.DOM.h1` 创建一个带有“Hello, React”文本的 `h1`，然后找到\
  \ ID 为 `\"app\"` 的文档元素，并使用 `ReactDOM.render` 将前者插入后者。这改变了内存中页面的表示，而不是磁盘上页面源码；如果我们想检查生成的\
  \ HTML，我们必须在浏览器中进行。最后，我们将脚本放在页面底部，这样浏览器在脚本运行之前就会将 HTML 转换为 DOM 树。我们稍后会回来修复这一点。\n\
  \n> 检查工具\n\n> 如果你正在使用 Firefox 浏览器，可以通过主菜单并选择 `工具 (Tools)… 网页开发者… 切换调试工具` 来打开开发者工具面板。页面底部将打开一个标签页显示；选择\
  \ `检查器 (Inspector)` 来查看页面内容和页面的 CSS。当你在页面本身移动鼠标时，相应的结构元素会被高亮。这其实非常酷*……\n\n`React.DOM.h1`\
  \ 的第一个参数在示例中是 `null`，但更通用地说，它可以是一个指定我们希望新创建的节点拥有的属性的对象。这里有一些特殊之处——例如我们必须使用 `fontStyle`\
  \ 而不是 `font-style`，以便属性对象的键看起来像法的 JavaScript 变量：\n\n```html\n<body>\n    <div id=\"\
  app\"></</div>\n    <script>\n```\n\n\n\n\n```javascript\nconst attributes = {\n\
  \  'style': {\n    'background': 'pink',\n    'fontStyle': 'italic'\n  }\n}\nReactDOM.render(\n\
  \  React.DOM.h1(attributes, \"Hello Stylish\"),\n  document.getElementById(\"app\"\
  )\n)\n```\n</script>\n</body\n\n## 7.2 JSX\n\n编写嵌套函数是编写 HTML 的笨拙方法，因此大多数 React 程序员使用一种名为\
  \ JSX 的工具，将 HTML 翻译成 JavaScript 函数调用。是的，这些 JavaScript 函数调用随后会产生 HTML——这是一个有趣的世界。这里是一个示例：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"utf-8\">\n   \
  \ <title>Hello JSX</title>\n    <script src=\"https://fb.me/react-15.0.1.js\"></script>\n\
  \    <script src=\"https://fb.me/react-dom-15.0.1.js\"></script>\n    <script src=\"\
  https://unpkg.com/babel-standalone@6/babel.js\"></script>\n  </head>\n  <body>\n\
  \    <div id=\"app\"></div>\n    <script type=\"text/babel\">\n      ReactDOM.render(\n\
  \        <h1>Hello JSX</h1>,\n        document.getElementById('app')\n      )\n\
  \    </script>\n  </body>\n</html>\n```\n\n除了这两个 React 库之外，此页面还包含了一个名为 Babel 的工具，可以将\
  \ HTML 和 JavaScript 的混合体翻译成纯 JavaScript。为了触发翻译，我们在 `script` 标签`中添加了 `type=\"text/babel\"\
  ` 属性。\n\n为什么要这样做呢？因为如上面的示例所示，它允许我们编写 `<h1>Hello JSX</h1>` 而不是调用函数。更普遍地说，JSX 允许我们把\
  \ JavaScript 放入 HTML 内部（放入我们的 JavaScript 内部（放入我们的 HTML 内部）），因此我们可以（例如）使用 `map` 将字符串列表转换为\
  \ HTML 列表：\n\n```html\n<body>\n  <h1>JSX List</h1>\n  <div id=\"app\"></div>\n \
  \ <script type=\"text/babel\">\n      const allNames = ['McNulty', 'Jennings', 'Snyder',\
  \ 'Meltzer', 'Bilas', 'Lichterman'];\n      ReactDOM.render(\n        <ul>{allNames.map((name)\
  \ => <li>{name}</li>)}</ul>, document.getElementById('app')\n      )\n  </script>\n\
  </body>\n```\n\n我们必须使用 `map` 而不是循环，因为我们运行的任何代码都必须返回一个可以插入 DOM 的东西，而 `for` 循环不返回任何内容。（我们可以使用循环通过重复拼接来构建字符串，但\
  \ `map` 更加整洁。）而且请注意：我们必须恰好返回一个节点，因为这是一个函数调用。我们将在练习中查看为什么 `<ul>` 元素内部紧跟其后的大括号是必要的。\n\
  \n另请注意，当我们运行此代码时，浏览器控制台会警告我们每个列表元素都应该有一个唯一的 `key` 属性，因为 React 希望页面的每个元素都是可被选择的。我们稍后会添加这一点。\n\
  \n## 7.3 创建组件\n\nReact 最强大的功能之一是它允许我们创建看起来像自定义 HTML 标签的新组件，但这些组件与我们编写的函数相关。React\
  \ 要求这些组件的名称以大写字母开头，以便与普通标签区分来。例如，我们可以定义一个函数 `ListOfNames` 来生成我们的名称列表，然后像放置 `h1`\
  \ 或 `p` 一样将该元素直接放入 `ReactDOM.Render` 中：\n\n```html\n<body>\n  <h1>Create Component</h1>\n\
  \  <div id=\"app\"></div>\n  <script type=\"text/babel\">\n      const allNames\
  \ = ['McNulty', 'Jennings', 'Snyder', 'Meltzer', 'Bilas', 'Lichterman'];\n     \
  \ const ListOfNames = ()=>\n        return (<ul>{allNames.map((name) => <li>{name}</li>)}</ul>)\n\
  \      \n      ReactDOM.render(\n        <ListOfNames />,\n        document.getElementById('app')\n\
  \      )\n  </script>\n</body>\n```\n\n然而，我们真正想做的是向这些组件传递参数：毕竟，JSX 正将它们转换为函数，而当我们能够给它们提供数据时，函数会变得有用得多。在\
  \ React 中，我们放在组件标签内部的所有属性都会通过单个 `props` 对象传递给我们的函数：\n\n```html\n<body>\n  <h1>Pass\
  \ Parameters</h1>\n  <div id=\"app\"></div>\n  <script type=\"text/babel\">\n  \
  \    const allNames = ['McNulty', 'Jennings', 'Snyder', 'Meltzer', 'Bilas', 'Lichterman'];\n\
  \      const ListElement = (props) =>\n        (<li id={props.name}>{props.name}</li>)\n\
  \      \n      ReactDOM.render(\n        <ul>{allNames.map((name) => <ListElement\
  \ name={name} />)}</ul>,\n        document.getElementById('app')\n      )\n  </script>\n\
  </body>\n```\n\n如果你仔细观察，你会发现传递给 `ListElement` 使用的 `name` 属性变成了实现 `ListElement` 的函数内部\
  \ `props.name` 的值。\n\n在像上面示例那样在 `ReactDOM.render` 中通过 `map` 处理数组中的每个组件之前，`ListElement`\
  \ 函数为我们提供了一个设置属性的精确的逻辑位置。在这里，我们使用 `ListElement` 将数组中的每个元素设置为斜体并给它们分配了 `ids`，但这些函数也可以用于对要渲染的每个元素进行任何转换或计算。\n\
  \n## 7.4 使用 PARCEL 开发\n\n将应用程序的所有源码放在一个 HTML 文件中是一种坏习惯，但我们已经看到了在页面头部加载 JavaScript\
  \ 时可能出现的竞态条件。那么 `require` 语句呢？浏览器将在这些语句执行时尝试加载所需的文件，但谁来提供它们呢？\n\n解决方案是使用打包器（图 7.2）将所有内容合并成一个大文件，并在开发期间运行本地服务器来预览我们的应用程序。然而，这个解决方案带来了另一个问题：选择哪种打包器？就像前端框架一样，有很多供选择，而且几乎每周都会增加新的工具。Webpack\
  \ 可能是最广泛使用的，但它相当复杂，因此我们将使用 Parcel，它更年轻，因此还没有臃肿（但请给它时间）。\n\n> **使用 Node 包管理器初始化项目**\n\
  >\n> 如果你直在跟着写代码，到为止我们创建了 HTML 和 JavaScript 文件，并在终端运行了 JavaScript 文件，但还没有使用 Node\
  \ 包管理器 `npm`。在安装 Parcel 之前，我们可以通过输入命令我们将创建 HTML 和 JavaScript 文件的目录转换为项目：\n> `npm\
  \ init -y`\n>\n> 安装 Parcel，运行：\n> `npm install parcel-bundler`\n>\n> 安装好 Parcel\
  \ 后，我们可以这样让它运行一个测试页面：\n> `node_modules/.bin/parcel serve -p 4000 src/dynamic/pass-params.html`\n\
  > 服务器正在运行在 http://localhost:4000\n> + 构建耗时 128ms。\n\n> **退出 Parcel**\n>\n> 使用键盘中断\
  \ Control-C 离开 Parcel。\n\n这之所以有效，是因为当 NPM 在项目的 `node_modules` 目录中安装库时，该库可能会在 `node_modules/.bin`\
  \ 中放入可执行脚本（注意是带领先点的 .bin，而不是 bin）。当我们要求 Parcel 服务应用程序时，它：\n\n* 查看命名文件以找到 JavaScript，\n\
  * 递归查看该文件加载的内容，\n* 将文件复制到名为 `./dist` 的目录（代表“发布”），并\n* 从那里提供服务。\n\nParcel 还会在 `./cache`\
  \ 中缓存内容，这样它就不需要重复工作；这两个目录通常会被添加到 `.gitignore`。要了解更多关于 Parcel 的信息，请看此短教程。\n\n![Image](img/fig7_2.jpg)\n\
  \n图 7.2：Parcel 中的内容分布\n\n将“运行我的应用程序”之类的任务放入 NPM 的 `package.json` 文件中是非常常见的，就像旧的程序员将经常使用的命令放入项目的\
  \ Makefile 中一样。在 `package.json` 中查找键为 `\"scripts\"` 的部分并添加此：\n\n```json\n\"scripts\"\
  : {\n  \"dev\": \"parcel serve -p 4000\",\n  …\n},\n```\n\n\n\n\n我们现在可以使用 `npm run\
  \ dev – src/dynamic/pass-params.html` 了，因为 `–` 之后的所有内容都会传递给正在运行的脚本。这不仅为我们节省了输入时间，还为其他开发者提供了一份如何使用项目的记录。遗憾的是，并没有标准的方法可以在\
  \ JSON 文件中添加注释。……\n\n> 哎呀\n>\n\n> *注意：如果我们不小心指定了目录名称（如 `src/dynamic`）而不是 HTML 文件的名称，Parcel\
  \ 会在控制台打印错误“no entries found”（未找到条目）。这是因为它试图将目录本身作为文件来读取。*\n\n## 7.5 多文件\n\n既然我们已经可以进行打包，让我们把\
  \ JSX 移动到 `app.js` 并在页面 `head` 中加载它：\n\n```html\n<!DOCTYPE html>\n<html\n  <head>\n\
  \    <meta charset=\"utf-8\">\n    <title>Hello Separate</title>\n    <script src=\"\
  https://fb.me/react-15.0.1.js\"></script>\n    <script src=\"https://fb.me/react-dom-15.0.1.js\"\
  ></script>\n    <script src=\"https://unpkg.com/babel-standalone@6/babel.js\"></script>\n\
  \    <script src=\"app.js\" type=\"text/babel\"></script>\n  </head>\n  <body>\n\
  \    <h1>Hello Separate</h1>\n    <div id=\"app\"></div>\n  </body>\n</html>\n```\n\
  \n目前，`app.js` 中的 JavaScript 代码如下：\n\n```javascript\nReactDOM.render(\n  <p>Rendered\
  \ by React</p>,\n  document.getElementById(\"app\")\n)\n```\n\n当我们加载此页面时，我们得到了 `h1`\
  \ 标题，但*没有*得到段落。浏览器控制台显示了以下信息：\n\n`Error: _registerComponent(…): Target container\
  \ is not a DOM element.`\n\n这与我们之前遇到的同一个竞态条件。在沮丧地叹了口气并又泡了一杯茶后，我们决定为了保持简单，将在页面的 `body`\
  \ 中加载脚本：\n\n```html\n<!DOCTYPE html>\n<html\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>Hello Bottom</title>\n  </head>\n  <body>\n    <h1>Hello Bottom</h1>\n\
  \    <div id=\"app\"></div>\n    <script src=\"./app.js\" type=\"text/babel\"></script>\n\
  \  </body>\n</html>\n```\n\n> **安装 React 和 ReactDOM**\n> *现在我们已经使用 `npm init` 创建了项目文件夹，并创建了\
  \ `project.json` 文件，我们可以安装我们的第一个模块了：*\n\n`$ npm install react`\n\n`$ npm install\
  \ reactDOM`\n\n通常情况下，使用 `require` 函数表示我们需要安装该库以访问模块的函数。\n\n更重要的是，我们将重写 `app.js`，让它加载所需的库，因为无法保证在\
  \ `head` 中加载的库在 `app.js` 运行时已是可用的：\n\n```javascript\nconst React = require('react')\n\
  const ReactDOM = require('react-dom')\n\nReactDOM.render(\n  <p>Rendered by React</p>,\n\
  \  document.getElementById('app')\n)\n```\n\n当我们每次进行此类更改时，都不需要关闭并重启服务器，因为 Parcel\
  \ 会监听文件的变化并在需要时重新启动。每当它这样做时，它都会查看 `app.js` 加载的库并重新打包它需要的内容：例如，现在 `dist/app.ef6b320b.js`\
  \ 长达 19930 行。\n\n比加载到部部，更现代的选项是在页面 `head` 中的脚本中添加 `async` 属性，这告诉浏览器在页面完成构建之前不要对\
  \ JavaScript 执行任何操作：\n\n```html\n<!DOCTYPE html>\n<html\n  <head>\n    <meta charset=\"\
  utf-8\">\n    <title>Hello Parcel</title>\n    <script src=\"./app.js\" type=\"\
  text/babel\" async></script>\n  </head>\n  <body>\n    <div id=\"app\"></div>\n\
  \  </body>\n</html>\n```\n\n## 7.6 练习\n\n## 该死的大括号\n\n我们的列表构建示例包含了这行代码：\n\n```html\n\
  <<ul>{allNames.map((name) => <<li>{name}</li> )}</ul>\n```\n\n为什么紧跟在 `<ul>` 元素内部的大括号是必要的？如果把它们删掉会发生什么？\n\
  \n### 真实数据\n\n1. 创建一个名为 `programmers.js` 的文件，定义一个名为 `programmers` 的 JSON 对象列表，其中包含我们程序员的\
  \ `firstName` 和 `lastName` 字段。（你可以在互联网上搜索他们的名字。）\n2. 像加载其他 JavaScript 文件一样在页面中加载该文件。\n\
  3. 从应用程序中删除 `allNames` 列表，并将其修改为使用来自 `programmers` 列表的数据。\n\n加载此类常量数据是测试期间常用的做法。\n\
  \n### 排序\n\n如果你更改网页中加载 JavaScript 文件的顺序会发生什么？例如，如果你在加载 `app.js` *之前* 先加载它会发生什么？\n\
  \n### 多目标\n\n如果你的 HTML 中包含 `id=\"app\"` 会发生什么？\n\n### 创建组件\n\n创建一个渲染名称的新组件。\n\n\
  ### 条纹处理\n\n假设我们想用背景颜色高亮交替行（这是一种糟糕的设计，但我们想要对齐）。\n\n### 关键点点\n\n- 表格很棒，但可视化通常更有效——前提是它们设计良好且你的受众有视力。\n\
  - 在浏览器中可视化数据的方法甚至比前端工具包的方法还要多。\n- Vega-Lite 是一个`声明式`框架：作为用户，你指定数据和设置，并让库处理一切。它并不做所有，但它能很好且轻松地处理常见事务，并与\
  \ React 良好地交互。\n- 服务器上的旧版动态网站。\n- 客户端的新的动态网站。\n- React 将 HTML 表示为函数调用。\n- JSX 翻译为\
