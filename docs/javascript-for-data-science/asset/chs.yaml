  - 某些应用程序将使用 `require` 处理服务端代码，使用 `import` 处理客户端代码。\n\n# 9 承诺 (Promises)\n\n到目前我们已经习惯了将回调函数作为参数传递给其他函数。回调由于以下原因会迅速变得复杂：\n\
  \n- 嵌套：一个延迟计算可能需要另一个延迟计算的结果，而那个结果还需要……\n- 错误处理：谁来注意到并处理错误？（这在现实生活中通常也是问题。）\n\n例如，假设我们想将一组\
  \ CSV 文件转换为 HTML 页面。我们函数的输入是包含一个或多个 CSV 文件的目录名称以及一个输出目录的名称；预期的结果是：如果输出目录不存在则创建它；为每个\
  \ CSV 文件创建一个 HTML 文件；删除目录中任何`不`对应于 CSV 文件的 HTML 文件；并创建一个包含所有页面链接的索引页。\n\n我们可以通过同步操作来实现这一点，但这不是\
  \ JavaScript 的做法（我们的意思是，这样做不会让你接触我们稍后需要的工具）。我们也可以尝试用回调来实现，但：\n\n- 在现有目录被清空之前，我们无法创建输出目录；\n\
  - 在输出目录重新创建之前，我们无法生成 HTML 页面；\n- 在 CSV 文件处理完成之前，我们无法生成索引页。\n\n与其使用纠缠的回调嵌套，不如使用 `promises`，然后使用\
  \ `async` 和 `await` 让事情变得更简单。JavaScript 提供了三种机制，是因为随着语言的演进，它的开发者发明了更好的处理问题的方法，但如果不理解它们的工作原理，简单的高层想法往往是没有意义的（这在现实生活中也是一个问题）。\n\
  \n## 9.1 执行队列 (EXECUTION QUEUE)\n\n为了让后续任何内容都有意义，理解 JavaScript 的 `event loop`（事件循环）至关重要，这里有完整的解释。大多数函数按顺序执行：\n\
  \n```javascript\n[1000, 1500, 500].forEach(t => {\n  console.log(t)\n})\n```\n1000\n\
  1500\n500\n\n然而，内置函数会延迟执行：它们不是立即运行，而是将回调添加到 JavaScript 解释器用于跟踪待执行事项的列表中。当一个任务完成时，解释器会取出下一个并运行。\n\
  \n`setTimeout` 是这类中最广泛使用的函数之一。它的工作方式如下：\n\n```javascript\n[1000, 1500, 500].forEach(t\
  \ => {\n  console.log(`about to setTimeout for ${t}`);\n  setTimeout(() => {console.log(`inside\
  \ handler for ${t}`)}, t)\n})\n```\nabout to setTimeout for 1000\nabout to setTimeout\
  \ for 1500\nabout to setTimeout for 500\ninside handler for 500\ninside handler\
  \ for 1000\ninside handler for 1500\n\n这并不奇怪：如果我们请求 JavaScript 延迟执行，执行就会延迟。奇怪的是，设置零超时也会延迟执行：\n\
  \n```javascript\nconst values = [1000, 1500, 500]\nconsole.log(`starting…`)\nvalues.forEach(t\
  \ => {\n  console.log(`about to setTimeout for ${t}`);\n  setTimeout(() => {console.log(`inside\
  \ handler for ${t}`)}, 0)\n})\nconsole.log(`finishing`)\n```\nstarting...\nabout\
  \ to setTimeout for 1000\nabout to setTimeout for 1500\nabout to setTimeout for\
  \ 500\n…finishing\ninside handler for 500\ninside handler for 1000\ninside handler\
  \ for 1500\n\n图 9.1 显示了在打印 `…finishing` 之前的执行队列。我们可以使用 `setTimeout` 构建一个通用的非阻塞函数：\n\
  \n![Image](img/fig9_1.jpg)\n\n图 9.1: 执行队列 (Run Queue)\n\n```javascript\nconst nonBlocking\
  \ = (callback) => {\n  setTimeout(callback, 0)\n}\n\n['a', 'b', 'c'].forEach(val\
  \ => {\n  console.log(`about to do nonBlocking for ${val}`);\n  nonBlocking(() =>\
  \ console.log(`inside callback for ${val}`))\n})\n```\nabout to do nonBlocking for\
  \ a\nabout to do nonBlocking for b\nabout to do nonBlocking for c\ninside callback\
  \ for a\ninside callback for b\ninside callback for c\n\n为什么要这样做？因为我们可能想给其他事情运行的机会。特别是从计算机的角度来看，文件\
  \ I/O 和任何涉及网络请求极其缓慢。如果一个 CPU 周期是一秒钟，那么从 RAM 获取数据需要几分钟，从固态硬盘获取数据需要六到八天，而通过网络获取则相当于八年。JavaScript\
  \ 的设计是为了让我们（或我们的浏览器）切换任务去做其他事情。\n\n使用零超时是一个巧妙的技巧，但 Node 提供了另一个名为 `setImmediate`\
  \ 的函数来为我们完成这件事。（还有 `process.nextTick`，它的作用并不相同。你可能不应该使用它。）\n\n```javascript\n['a',\
  \ 'b', 'c'].forEach(val => {\n  console.log(`about to do setImmediate for ${val}`);\n\
  \  setImmediate(() => console.log(`inside immediate handler for ${val}`))\n})\n\
  ```\nabout to do setImmediate for a\nabout to do setImmediate for b\nabout to do\
  \ setImmediate for c\ninside immediate handler for a\ninside immediate handler for\
  \ b\ninside immediate handler for c\n\n## 9.2 Promises\n\n新版本的 JavaScript 鼓励程序员使用\
  \ promises 来管理延迟操作。例如，如果我们想找到文件的大小，可以这样写：\n\n```javascript\nconst fs = require('fs-extra')\n\
  fs.stat('moby-dick.txt').then((stats) => console.log(stats.size))\n```\n1276201\n\
  \n`fs-extra.stat` 将最终产生关于文件的统计信息，但这将需要一段时间，所以 `fs-extra.stat` 会立即返回一个 `Promise`\
  \ 类的对象。`Promise` 有一个方法 `then` 接收回调并存储在 promise 对象中。当 `stat` 调用完成时，记录的回调会被调用，并传递另一个包含文件统计信息的对象（包括它的大小）。\n\
  \n为了更好地理解这一点，让我们创建自己的 promise 来从网络获取文件。（我们将 URL 分成了两行，以便其打印得美观。）\n\n```javascript\n\
  const fetch = require('node-fetch')\nurl = 'https://api.nasa.gov/neo/rest/v1/feed'\
  \ +\n  '?api_key=DEMO_KEY&start_date=2018-08-20'\n\nconst prom = new Promise((resolve,\
  \ reject) => {\n  fetch(url)\n    .then((response) => {\n      if (response.status\
  \ === 200) {\n        resolve('fetched page successfully')\n      }\n    })\n}).then((message)\
  \ => console.log(message))\n```\n\n这段代码构造了一个新的 `Promise` 对象。构造函数接收一个参数；这必须是一个有两个参数的回调函数，约定命名为\
  \ `resolve` 和 `reject`。在回调体内，如果一切按计划进行，我们调用 `resolve` 返回一个值。该值随后会被传递给 `Promise`\
  \ 的 `then` 方法。\n\n这似乎是一种迂回的方法，但它一次性解决了多个问题。第一个也是最重要的是错误处理：如果在传递给 `Promise` 构造函数的回调内部发生了了错误，我们可以调用\
  \ `reject` 而不是 `resolve`。就像 `then` 处理传递给 `resolve` 的任何内容一样，`Promise` 定义了一个名为 `catch`\
  \ 的方法来处理传递给 `reject` 的任何内容。因此，我们可以构建一个稍微健壮的数据获取器，如果我们把月份误写为 `80`，它会报告合理的提示：\n\n\
  ```javascript\nconst fetch = require('node-fetch')\nurl = 'https://api.nasa.gov/neo/rest/v1/feed'\
  \ +\n  '?api_key=DEMO_KEY&start_date=2018-80-20'\n\nnew Promise((resolve, reject)\
  \ => {\n  fetch(url)\n    .then((response) => {\n      if (response.status === 200)\
  \ {\n        resolve('fetched page successfully')\n      }\n    })\n```\n\n\n\n\n\
  ```javascript\n}\nelse {\n    reject(Error(`got HTTP status code ${response.status}`));\n\
  }\n})\n}).then((message) => console.log(message))\n.catch((error) => console.log(error.message))\n\
  ```\n\n获取 状态码 400\n\n![Image](img/fig9_2.jpg)\n\n图 9.2：作为对象的 Promise（创建后）\n\n请注意，在上面的示例中，我们没有将\
  \ Promise 对象赋值给变量。如果我们只需要用它们来定义成功完成/异常时的行为，并且之后不需要再次引用它们，那么可以动态创建 promise。\n\n这一切之所以能够运作的原因是\
  \ promise 是一个对象。图 9.2 显示了在该 promise 创建后瞬间，内存中的内容。这张图中有许多箭头，但它们都有自己的用途：\n\n-   promise\
  \ 有三个字段：初始操作（即传递给构造函数的回调函数）、在一切成功时要执行的操作，以及发生错误时要执行的操作。\n-   成功和错误操作是空的，因为初始操作尚未执行。\n\
  \n一旦 promise 被创建，程序就会按顺序调用它的 `then` 和 `catch` 方法，并为每个方法提供回调。这发生在传递给构造函数的回调（即初始操作）执行*之前*，并让\
  \ promise 处于图 9.3 所示的状态：\n\n![Image](img/fig9_3.jpg)\n\n图 9.3：作为对象的 Promise（执行 then\
  \ 和 catch 之后）\n\n调用 `then` 和 `catch`会将回调分配给 promise 对象的成功操作和错误操作成员。这些方法随后作为 `resolve`\
  \ 和 `reject` 传递给初始操作回调，也就是说，如果因为页面获取成功而调用了 `resolve`，实际上调用的是 promise 的成功操作，即传递给\
  \ `then` 的回调函数。另一方面，如果调用了 `reject`，它将触发错误操作的执行，即传递给 `catch` 的回调函数。\n\n是的，这很复杂——复杂到\
  \ JavaScript 增加了一层（我们将在第 9.4 节\nurl = 'https://api.nasa.gov/neo/rest/v1/feed' +\
  \ '?api_key=DEMO_KEY&start_date=2018-80-20' // 非法日期\n\ntry {\n    fetch(url)\n}\n\
  catch (err) {\n    console.log(err)\n}\n```\n\n那么错误信息将不会出现，因为 `fetch` 函数是异步的，这意味着代码按以下顺序执行：\n\
  \n1.  在 `try` 内部，要求计算机在未来的某点执行 `fetch(url)`\n2.  由于请求请求不会导致异常，因此跳过 `catch`\n3. \
  \ 然后运行 `fetch(url)`，它失败了，但没有任何地方捕获异常，因为 `try…catch` 已经结束，所以 `console.log` 永远不会运行，错误信息也不会出现。\n\
  \n此代码块中有两次执行过程：第一次是 `try…catch` 事件循环，第二次是 `fetch`。JavaScript 直接将异步代码从执行上下文中剥离出来！并没有错误，因为\
  \ `fetch` 还没有运行的机会。\n\n![Image](img/fig9_4.jpg)\n\n图 9.4：当 Try…Catch 失败时\n\n回到上面的\
  \ `fs–extra.stat` 示例，如果我们想处理多个文件（例如计算它们的总大小）该怎么办？我们可以写一个循环：\n\n```javascript\nconst\
  \ fs = require('fs-extra')\nlet total_size = 0\nconst files = ['jane-eyre.txt',\
  \ 'moby-dick.txt', 'life-of-frederick-douglass.txt']\n\nfor (let fileName of files)\
  \ {\n    fs.stat(fileName).then((stats) => {\n        total_size += stats.size\n\
  \    })\n}\nconsole.log(total_size)\n```\n\n但这是行通的：每次迭代中的 `stat` 都是异步执行的，因此在任何 promise\
  \ 代码运行之前，循环就会结束，脚本会打印总大小为零。\n\n方案 B 是将 promises 链起来，以确保每个 promise 只在上一个 resolve\
  \ 后才执行：\n\n```javascript\nconst fs = require('fs-extra')\nlet total_size = 0\n\n\
  new Promise((resolve, reject) => {\n    fs.stat('jane-eyre.txt').then((jeStats)\
  \ => {\n        fs.stat('moby-dick.txt').then((mdStats) => {\n            fs.stat('life-of-frederick-douglass.txt').then((fdStats)\
  \ => {\n                resolve(jeStats.size + mdStats.size + fdStats.size)\n  \
  \          })\n        })\n    })\n}).then((total) => console.log(total))\n```\n\
  \n\n\n\n```javascript\n.then(files => console.log('glob + Promise.all(…)', files))\n\
  .catch(error => console.error(error))\n```\n\n```javascript\nglob + Promise.all(…)\
  \ [ Stats {\n    dev: 16777220,\n    mode: 33188,\n    …more information… },\n \
  \   …five more Stats objects...\n]\n```\n\n在第 4 步中，我们记得需要跟踪我们正在查看的文件名，因此我们需要编写自己的函数，返回一个包含两个键的对象（一个用于文件名，另一个用于统计信息\
  \ stats）。如第 6 章所示，记法 `{a, b}` 会生成一个对象 `{\"a\": a, \"b\": b}`：\n\n```javascript//\
  \ …前面的的导入和参数与之前相同..\n\nconst statPair = (filename) => {\n  return new Promise((resolve,\
  \ reject) => {\n    fs.stat(filename)\n      .then(stats => resolve({filename, stats}))\n\
  \      .catch(error => reject(error))\n  })\n}\n```\n\n`glob('${srcDir}/**/*.txt')`\n\
  \  .then(files => Promise.all(files.map(f => statPair(f))))\n  .then(files => console.log('glob\
  \ + Promise.all(…)', files))\n  .catch(error => console.error(error))\n\n```javascript\n\
  glob + Promise.all(…) [ { filename: './common-sense.txt',\n    stats:\n    Stats\
  \ {\n      dev: 16777220,\n      mode: 33188,\n      …more information… }\n    },\n\
  \    …另外五个 (filename, Stats) 组合...\n]\n```\n\n第 5 步是确保我们只处理长度超过 100,000 个字符的文件：\n\
  \n```javascript// …前面的导入和参数与之前相同..\n\nglob('$ srcDir}/**/*.txt’)\n  .then(files\
  \ => Promise.all(files.map(f => statPair(f))))\n  .then(files => files.filter(pair\
  \ => pair.stats.size > 100000))\n  .then(files => Promise.all(files.map(f => fs.readFile(f.filename,\
  \ ′utf8’))))\n  .then(contents => console.log('…readFile', contents.map(c => c.length)))\n\
  \  .catch(error => console.error(error))\n```\n\n```javascript\n…readFile [ 148134,\
  \ 1070331, 248369, 1276201, 706124,\n204492 ]\n```\n\n在第 6 步中，我们将每个文件的内容拆分为行并计数：\n\
  \n```javascript// …前面的导入和参数与之前相同..\n\nconst countLines = (text) => {\n  return text.split('\\\
  n').length\n}\n```\n\n`glob('${srcDir}/**/*.txt')`\n  .then(files => Promise.all(files.map(f\
