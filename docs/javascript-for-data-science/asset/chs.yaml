  \ Data Analysis`）。\n\n# D 术语表\n\n**绝对路径 (absolute path)**：无论在何处评估，都指向文件系统中相同位置的路径。绝对路径等同于地理中的经纬度。参见**相对路径\
  \ (relative path)**。\n\n**聚合函数 (aggregation function)**：将多个值合并为一个值的函数，例如 `sum or\
  \ max`。\n\n**别名 (alias)**：指代相同数据或函数的第二个或后续名称。\n\n**匿名函数 (anonymous function)**：在定义时没有赋予名称的函数，例如在定义处定义的回调函数。匿名函数有时被称为\
  \ `lambda functions`，因为数学中用希腊字母 lambda 来表示它们。\n\n**应用程序编程接口 (API)**：库或网络服务提供给其他代码使用的函数集。\n\
  \n**参数 (argument)**：参见**参数 (parameter)**。\n\n**数组 (array)**：按特定顺序存储并用数字进行索引的值集合。数组以方括号内的逗号分隔值的形式书写，例如\
  \ `['a', 'b', 'c']`。**列表 (list)** 一词通常与数组同义使用。\n\n**ASCII**：一种广泛使用的用于表示拉丁字母和常用标点符号字符的数字代码集，现在已被\
  \ **Unicode** 取代。\n\n**断言 (assertion)**：程序中某一点某事为真的声明。断言通常用于定义测试，但也用于生产代码中以检查软件运行是否符合预期。\n\
  \n**属性 (attribute)**：附加到 HTML **元素 (element)** 的命名属性。\n\n**向后兼容 (backward-compatible)**：能够与旧系统一致工作。\n\
  \n**HTTP 消息体 (body of an HTTP message)**：在消息头之后发送的任何可选数据。\n\n**语句体 (body of a statement)**：程序中嵌套在另一个语句内部或受其控制的语句，例如组成函数的语句或仅在\
  \ `if` 的**条件 (condition)** 为真时才执行的语句。\n\n**布尔值 (Boolean)**：为真也可以为假的值，以英国数学家乔治·布尔（已故）的名字命名。\n\
  \n**打包器 (bundler)**：将 JavaScript 文件、网页、图像和其他资产合并成单个包以进行部署的工具。\n\n**缓存 (cache)**：存储最近使用的值副本的地方，以便更快地访问。\n\
  \n**调用栈 (call stack)**：一种存储正在进行中的函数调用信息的数据结构。每次函数调用都会在栈顶添加另一个变量-值对的表；当函数完成时，该表会被丢弃。参见**闭包\
  \ (closure)**。\n\n**回调函数 (callback function)**：传递给另一个函数 `B` 以供 `B` 在稍后调用的函数 `A`。回调函数用于实现延迟操作，例如在响应网络请求的数据到达时做什么。\n\
  \n**层叠样式表 (CSS)**：一种描述如何渲染 HTML 的。\n\n**捕获 (catch)**：负责处理**异常 (exception)**。`catch`\
  \ 是**抛出 (throw)** 的对应项。\n\n**知识共享-署名许可 (CC-BY)**：一种允许人们在引用原始来源的情况下重复使用作品的许可。\n\n\
  **字符编码 (character encoding)**：关于字符如何存储为字节的规范。目前最常用的编码是 **UTF-8**。\n\n**子类 (child\
  \ class)**：一个**继承 (extends)** 现有类（称为**父类 (parent class)**）的新**类 (class)**。\n\n**子节点\
  \ (child node)**：**树 (tree)** 中位于其他节点（称为子节点的**父节点 (parent)**）之下的节点。\n\n**类 (class)**：定义一组相关**对象\
  \ (objects)**属性和行为的编程结构。类可以**继承 (inherit)** 自其他类以逐步指定或更改行为。\n\n**客户端 (client)**：如向**服务器\
  \ (server)** 发送请求并对响应进行处理的程序（如浏览器）。有时将客户端比作向古代神灵祈求的巫师会有帮助。仅有时。\n\n**客户端页面生成 (client-side\
  \ page generation)**：在**客户端**内部使用**服务器**提供的数据创建 HTML 页面。参见**服务端页面生成 (server-side\
  \ page generation)**。\n\n**闭包 (closure)**：在相同**作用域 (scope)** 中定义的变量集合，其在在该作用域结束后仍然存在。闭包是编程中最难理解的概念之一。\n\
  \n**React 组件 (component in React)**：与生成 HTML 的函数调用相关的、用户定义的“标签”。\n\n**条件 (condition)**：控制\
  \ if 语句的**正文 (body)** 是否执行的逻辑测试。\n\n**构造函数 (constructor)**：在创建对象时自动调用以初始化对象的“方法”。\n\
  \n**逗号分隔值 (CSV)**：一种用于表格数据的文本格式，其中每个记录为一行，字段由逗号分隔。有许多细微变，特别是在字符串的引号处理。\n\n**连接管理器\
  \ (connection manager)**：一个维护到数据库连接的对象。当代码完成对数据库的操作时，连接管理器确保连接被关闭，这有助于避免数据损坏。\n\n\
  **内容分发网络 (CDN)**：一组地理分布的服务器，用于存储常用或最近使用的数据（如网页），以便更快地提供服务。\n\n\n\n\n\n`constant`:\
  \ 一个值不能更改的变量。注意，值本身可能会被改变：例如，在语句 `const v = [’a’, ’b’]` 之后，名称 `v` 将始终指向同一个数组，但数组的内容可以被更改。另参见\
  \ variable（变量）。\n\n`Cross-Origin Resource Sharing (CORS)`: 一种控制请求的方式，请求的数据和其他资源并非由提供浏览器原始页面的网站提供。\n\
  \n`dataframe`: 一种用于存储表格数据的数据结构。dataframe 具有零或多个命名列和零或多个行，每行在每个列中恰好有一个值。\n\n`declarative\
  \ programming`: 一种编程风格，用户指定他们想要什么，而由计算机确定如何实现。\n\n`deployment`: 将软件发布供他人使用的行为。\n\
  \n`destructuring`: 一种赋值形式，可以在一个步骤中解开数据结构，例如 `[a, b] = [1, 2]` 或 `{left, right} =\
  \ {left: 1, right: 2}`。\n\n`Domain Name System (DNS)`: 一种用于计算机的去中心化命名系统，用于将如 `third-bit.com`\
  \ 之类的逻辑名称转换为特定计算机的地址。\n\n`document`: 整个 HTML 页面。\n\n`Document Object Model (DOM)`:\
  \ 一种在内存中表示 HTML 的标准方法。面的元素、属性及其文本以组织成树的节点形式存储。\n\n`dotted notation`: 编程语言中引用结构各个部分的常用方式。`whole.part`\
  \ 意味着“属于 `whole` 的 `part`”。\n\n`driver`: 一个提供标准接口的程序，通过该接口与另一个硬件或软件通信。每块显卡都有一个驱动程序，将通用绘制命令转换为特定的操作；每个数据库都带有驱动程序，理论上允许其他程序以相同的方式与它们通信。\n\
  \n`element`: 网页的单个组件。在 HTML 中，元素被包含在匹配的 `<tag>` 和 `</tag>` 对中，或者如果不包含内容，则写为 `<tag/>`。元素在\
  \ DOM 中以节点表示。\n\n`entry point`: 一个具有已知名称和签名的函数，框架要求每个插件或其他动态加载的内容都具备该函数。入口点（如名称所示）是框架进入插件的方式。\n\
  \n`escape sequence`: 一种字符序列，用于表示某些否则具有特殊含义的字符。例如，转义序列 `\\\"` 用于在双引号字符串内部表示双引号字符。\n\
  \n`event handler`: 回回调函数，用于响应与浏览器的特定交互（如按下键或点击链接），执行某些操作。\n\n`event listener`: 另参见\
  \ event handler（事件处理器）。\n\n`event loop`: JavaScript 中基础的循环周期，它从列表中获取下一个任务并运行它，在此过程中可能向列表添加更多任务。\n\
  \n`event object`: 系统传递给事件处理器的对象，其中包含有关事件的信息，例如按了哪个键。\n\n`exception`: 一个存储程序中错误或其他异常事件信息的对象。程序的某部分将创建并抛出异常，以信号发生了某些意外情况；另一部分则将捕获它。\n\
  \n`extend`: 从现有类创建一个新类。我们说新类继承自旧类。\n\n`external style sheet`: 一组放置在外部文件而非网页内部的 CSS\
  \ 定义。另参见 internal style sheet（内部样式表）。\n\n`falsy`: 一个糟糕的新造词，意为“等于假（false）”。另参见同样糟糕的\
  \ truthy（真值化的）。\n\n`fat arrow function`: 一个使用 `(parameters) => {body}` 定义的函数。箭头函数处理特殊值\
  \ `this` 的方式比其旧的等效函数更一致。\n\n`field`: 关系数据库中记录的命名部分。字段通常显示为表格中的列。\n\n`fixture`: 运行单元测试时的数据。\n\
  \n`functional programming`: 一种编程风格，数据通过连续应用函数进行转换，而不是使用循环等控制结构。JavaScript 中的函数式编程严重依赖回调函数和高阶函数。\n\
  \n`global installation`: 放置在所有用户和项目都可以访问的位置的 JavaScript 库。另参见 local installation（本地安装）。\n\
  \n`global variable`: 定义在任何特定之外之外变量，因此对所有函数可见。另参见 local variable（局部变量）。\n\n`GNU Public\
  \ License (GPL)`: 一种允许人们重用软件的许可，只要他们分发修改后的。\n\n`header row`: 如果存在，CSV 文件的第一行，用于定义列名（不幸的是，没有定义它们的数据类型或单位）。\n\
  \n`heterogeneous`: 具有混合类型。例如，如果一个数组包含数字、字符字符串和其他类型的混合，则称它是异质的。另参见 homogeneous（同质的）。\n\
  \n`higher-order function`: 一个作用于其他函数的函数。例如，高阶函数 `forEach` 在数组的每个值上执行一次给定函数。高阶函数在函数式编程中被广泛使用。\n\
  \n`homogeneous`: 具有单一类型。例如，如果一个数组只包含数字或只包含字符字符串而不是而不是者的混合，则称它是同质的。\n\n`hostname`:\
  \ URL 中指定要通信计算机的部分。在 URL `http://example.com/something/` 中，主机是 `example.com`；在 URL\
  \ `http://localhost:1234/` 中，主机是 `localhost`。\n\n`HyperText Transfer Protocol (HTTP)`:\
  \ 用于在浏览器和网站之间、更广泛地说是在其他客户端和服务器之间交换信息的“超文本传输协议”。HTTP 是一个无状态协议，其通信由请求和响应组成。\n\n`HTTP\
  \ header`: HTTP 请求或响应开头的键值对。头部用于指定发送者可以处理的数据格式、消息发送的日期时间等。\n\n`HTTP method`: HTTP\
  \ 请求中的动词，定义了客户端想要做什么。常见方法有 `GET`（获取数据）和 `POST`（提交数据）。\n\n`HTTP request`: 从客户端（如浏览器）发送到服务器的精确格式的文本块，指定了正在请求的资源、客户端接受的数据格式等。\n\
  \n`HTTP response`: 服务器响应请求时发送回客户端的精确格式的文本块。\n\n`HTTP status code`: 一种数字代码，指示在处理\
  \ HTTP 请求时发生了什么，例如 200（OK）、404（未找到）或 500（内部服务器错误）。\n\n`immutable`: 一个在创建后无法被更改的数据。\n\
  \n`in-memory database`: 存储在内存而非永久存储器中的数据库。内存数据库通常用于测试。\n\n`inherit`: 从父类获取属性和方法。另参见\
  \ extend（扩展）。\n\n`inner loop`: 包含在循环体内的循环。另参见 nested loop（嵌套循环）。\n\n`instance`:\
  \ 如果对象 `obj` 属于特定的类 `cls`，我们说 `obj` 是 `cls` 的实例。\n\n`instance method`: 使用特定对象并作用于该对象的方法。另参见\
  \ static method（静态方法）。\n\n`internal style sheet`: 一组放置在网页内部而非外部文件中的 CSS 定义。另参见 external\
  \ style sheet（外部样式表）。\n\n\n\n\n**JavaScript Object Notation (JSON)**: 一种通过将数字和字符字符串等基本值在`arrays`\
  \ 和键值结构中组合来表示数据的方法。该缩写代表“JavaScript Object Notation”；与 `XML` 这种定义更良好的标准不同，它不受注释语法或定义`schemas.`方式的。\n\
  \n- **library**: 参见 `module.`。\n\n- **list**: 参见 `array.`。\n\n- **local installation**:\
  \ 放置在特定项目中的 JavaScript 库，仅在该项目内部可访问。参见 `global installation.`。\n\n- **local server**:\
  \ 运行在用户自己计算机上的`server`，通常用于开发期间的测试目的。\n\n- **local variable**: 定义在函数内部的变量，仅在该函数内部可见。另参见\
  \ `global variable` 和 `closure`。\n\n- **logging**: 以结构化的方式记录程序执行相关的信息。\n\n- **logging\
  \ transport**: 发送 `logging` 消息的通道，例如标准输出（用于用户的屏幕）或数据库连接。\n\n- **member variable**:\
  \ 参见 `property.`。\n\n- **memory diagram**: 显示程序包含的变量及其引用的数据的图片。\n\n- **method**:\
  \ 附加到 `object` 的函数，通常使用 `dotted notation.` 调用。在 JavaScript 和许多其他语言中，为方法提供了一个名为 `this`\
  \ 的特殊变量，用于指代调用该方法的特定对象。\n\n- **method chaining**: 一种编程风格，其中每个方法调用返回原始对象或新构建的对象，以便其他方法调用可以附加其上以创建长计算链。方法链产生的代码看起来像\
  \ `obj.a().b().c().`。\n\n- **minimization**: 从源文件中删除空格和其他多余字符（甚至可能重命名变量）。这使得这些文件更小且部署更快，但是以牺牲可读性为代价。\n\
  \n- **MIT License**: 一种允许人们在无限制的情况下重用软件的许可。\n\n- **model (of data)**: 数据存储的方式。另参见\
  \ `view.`。\n\n- **module**: 一组在一起的变量、函数和/或类，以便于管理（通常但并非总是单个文件）。模块有时也被称为 `libraries.`。\n\
  \n- **module variable**: 在模块内部可见但在外部不可可见的变量。另参见 `scope.`。\n\n- **mutation**: 原地修改数据，例如修改数组元素或向数据库添加记录。\n\
  \n- **name collision**: 当程序中两个或多个同名的事物同时激活时产生的歧义。`call stack` 的发明部分原因是为了解决这个问题。\n\
  \n- **nested loop**: 包含在另一个循环中的循环。对于 `outer loop` 的每次迭代，`inner loop` 可以运行多次。\n\n\
  - **Node**: 一种用于浏览器之外的 JavaScript 开源实现。\n\n- **node**: HTML 页面元素的内存表示（不要与 `Node.js`\
  \ 混淆）。另参见 `DOM.`。\n\n- **NoSQL database**: 任何不使用 `relational` 模型的数据库。这个奇怪的名字来自于此类数据库不使用\
  \ `SQL` 作为查询语言。\n\n- **Not a Number (NaN)**: 用于表示无效数字的特殊值，例如零除以零的结果。\n\n- **object**:\
  \ 程序中分组在一起的变量和/或 `methods` 簇。在大多数语言中，对象只能作为 `classes` 的实例创建，但 JavaScript 将任何使用 `{…}`\
  \ 创建的内容都称为对象。不要试图效法圣贤的足迹；而要寻找他们所追求的事物。\n\n- **object-oriented programming (OOP)**:\
  \ 一种以构建自包含对象为中心的编程风格，这些对象通过良好定义的（或至少是“定义的”）接口进行通信。\n\n- **observer**: 一种在状态发生变化时会通知\
  \ `objects` 的模式。\n\n- **outer loop**: 包含另一个循环的循环。\n\n- **override**: 用新定义替换 `method`。\n\
  \n- **parameter**: 传入函数的值。\n\n- **package manager**: 用于安装和管理软件库的工具。使用最广泛的是 `NPM`。\n\
  \n- **prototype**: JavaScript 中用于在对象之间共享属性的机制。\n\n- **parent class**: 一个被扩展的现有 `class`。\n\
  \n- **parsing**: 将程序的文本转换为数据结构。\n\n- **polymorphism**: 字面意思是“具有多种形式”。该术指的是 `objects`\
  \ 如何具有相同的名称。\n\n- **port**: 通信的逻辑端点，类似于电话号码。\n\n- **production code**: 交付给最终用户的软件。\n\
  \n- **promise**: JavaScript 中处理延迟计算的方法。\n\n- **property**: 与 `object` 关联的变量。该术语用于区分对象的被动数据与其可执行的\
  \ `methods`。\n\n- **pseudo-random number**: 以可重复的方式生成的值。\n\n- **pseudo-random number\
  \ generator**: 在用用 `seed` 初始化后，可以生成一系列 `pseudo-random numbers` 的函数。\n\n- **public\
  \ domain license (CC-0)**: 一种允许人们以任何想要的方式无限制地重用材料的许可。\n\n- **race condition**: 由于执行操作的顺序不同，导致计算结果可能变化的情况。\n\
  \n- **refactor**: 以不改变其行为的方式重新组织或清理代码。\n\n- **read-evaluate-print loop (REPL)**:\
  \ 一种交互式程序，它读取用户键入的命令，执行并打印结果，然后耐心地等待下一个命令。\n\n- **regular expression**: 用于匹配文本的模式，以文本本身的形式编写。\n\
  \n- **relational database**: 将信息组织成 `tables` 的数据库，每个表有一组固定的命名 `fields`（显示为列）和数量不等的\
  \ `records`（显示为行）。另参见 `SQL`。\n\n\n\n\n\n-   **relative path (相对路径)**：其目标相对于其他位置（如当前目录）解释的路径。相对路径等同于使用“直行”和“左转”等术语给出指示。参见**absolute\
  \ path (绝对路径)**。\n\n-   **responsive design (响应式设计)**：构建网页和其他应用程序的方法，能够根据不同的屏幕尺寸流畅地调整和重新组织内容。\n\
  \n-   **RGB**：使用红、绿、蓝强度三元组表示颜色的方法，每个分量的范围都是从 0 到 255。在现代系统中，RGB 通常会扩展为 RGBA，其中第四个组件是像素的透明度。\n\
  \n-   **root (根)**：`tree` 中唯一没有 `parent`（父节点）的节点。\n\n-   **root directory (根目录)**：直接或间接包含其他内容的目录。根目录写为\
  \ `/`（裸的正斜杠）。\n\n-   **root element (根元素)**：文档中包含所有其他元素。网页的根元素是 `html` 元素。\n\n-\
  \   **schema**：数据“形状”的规范，例如构成数据库表的 `fields` 或结构在 `JSON` 中嵌套的方式。\n\n-   **scope (作用域)**：程序中定义可以可见并使用的部分。参见\
  \ `global-variable`、`local-variable`、`module-variable` 以及（如果你足够勇敢）`closure`。\n\n\
  -   **seed (种子)**：用于初始化伪随机数生成器的值。\n\n-   **selector (选择器)**：识别 HTML 文档中元素的方法。例如，选择器\
  \ `h2#contents` 意味着“ID 为 `contents` 的 `h2` 元素”。\n\n-   **server (服务器)**：等待来自 `clients`\
  \ 请求并向其发送数据的程序。有时将服务器想象成试图照看满屋顽皮小孩的疲惫父母，这会很有帮助。\n\n-   **server-side page generation\
  \ (服务端页面生成)**：在服务器上创建 HTML 页面。该 HTML 页面随后按原样传递给浏览器进行显示。参见**client-side page generation\
  \ (客户端页面生成)**。\n\n-   **spread syntax (展开语法)**：`… in …some_array`，意味着“在处插值数组的值”。\n\
  \n-   **SQL**：用于为**rel databases (关系型数据库)** 编写查询的语言。该术语最初是 Structured Query Language\
  \ 的缩写。\n\n-   **signature (签名)**：函数或 `method`所需的参数数据类型的有序列表。如果两个函数或方法具有相同的签名，则可以用相同的方式调用它们。\n\
  \n-   **stateful (有状态的)**：从一个操作保留信息到下一个操作。\n\n-   **stateless (无状态的)**：不从一个操作保留信息到下一个操作。\n\
  \n-   **static method (静态方法)**：属于整个类而不是该类对象的方法。静态方法通常用于实现类的辅助方法。参见**instance method\
  \ (实例方法)**。\n\n-   **string (字符串)**：程序中的块文本。该术语是“character string”（字符字符串）的缩写。\n\n\
  -   **string interpolation (字符串插值)**：将对应于指定值的文本插入字符串中的过程，通常是为了使输出人类可读。\n\n-   **table\
  \ (表格)**：**relational database (关系型数据库)** 中一组格式统一的 `records`（记录）。表格通常用行（每行代表一条记录）和列（每列代表一个\
  \ `field` 字段）绘制。\n\n-   **tag (标签)**：识别 HTML 页面中某种元素的短文本标签。常用的标签包括 `p`（用于段落）和 `h1`（一级标题）。\n\
  \n-   **template (模板)**：带有某些占位符的文档，这些占位符可以用特定值填充。模板通常用于创建个性化的电子邮件消息和网页，尽管它们的效能取决于取决于现代社会对“个人化”构成要素的感知的持续商业化和贬值。\n\
  \n-   **test runner (测试运行器)**：查找并运行 `unit tests`（单元测试）并报告其结果的程序。\n\n-   **test suite\
  \ (测试套件)**：一组 `unit tests`（单元测试），通常存储在遵循规定命名规范的文件中。\n\n-   **throw (抛出)**：创建一个 `exception`（异常）并交给错误处理系统来信号程序中发生了意外或异常的情况，系统随后尝试在程序中找到可以\
  \ `catch`（捕获）它的点。（某些语言称之为 *raising* 异常。）\n\n-   **tidy data (整洁数据)**：满足四个条件的表格数据：\n\
  -   每列包含一个统计变量（即一个被测量或观察的属性）。\n-   每个不同的观测在不同的行中。\n-   每组观测对应一个表格。\n-   如果有多个表格，每个表格都有一个包含唯一键的列，以便链接相关数据。\n\
  \n-   **tree (树)**：一种包含严格嵌套 `nodes`（节点）的数据结构。除了 `root node`（根节点）之外，每个节点必须恰好有一个 `parent\
  \ node`（父节点），但每个节点可以有零或多个 `children`（子节点）。\n\n-   **truthy (真)**)**真正的奥威尔式新词，意味着“不等于假”。参见**falsy\
  \ (假值)**，但仅当你能够放下对英语语言的尊重时。\n\n-   **Unicode (Unicode)**：一种为数以万个字符和符号定义数值代码的标准。Unicode\
  \ 不定义如何存储这些数字；那是由 `UTF-8` 等标准完成的。\n\n-   **unit test (单元测试)**：对系统的某个属性或预期行为进行测试。\n\
  \n-   **URL**：指定计算机网络上某些内容的多个部分标识符。URL 可能包含协议（如 `http`）、主机名（如 `example.com`）、端口（如\
  \ `80`）、路径（如 `/homepage.html`）以及 **query parameters (查询参数)**。\n\n-   **UTF-8**：一种在内存中存储表示\
  \ Unicode 字符的数值的方法，与旧的 `ASCII` 标准兼容。\n\n-   **variable (变量)**：程序中关联某些数据的名称。变量的值在定义后可以更改。参见**constant\
  \ (常量)**。\n\n-   **view (of data) (数据视图)**：数据呈现的方式。参见**model (模型)**。\n\n-   **whitespace\
  \ (空白字符)**：占用空间但不产生可见标记的空格、换行符、回车以及水平和垂直制表符。该名字源于打字机时代在打印页面上的外观。\n\n-   **XML**：一组定义\
  \ HTML 类标签并使用它们格式化文档（通常是数据）的规则。XML 在 2000 年代初获得了普及，但其复杂性导致许多程序员转而采用 `JSON`。\n\n\
  # E 关键点\n\n### INTRODUCTION 引言\n- 现代 JavaScript 是构建桌面和基于 Web 的应用程序的良好工具。\n- 本课程适用于那些知道循环和函数，但从未使用过\
  \ JavaScript 或构建过 Web 应用的人。\n- `Node` 是 JavaScript 的命令行解释器，可以交互式使用，也可以用于运行文件中的脚本。\n\
  - `NPM` 是 Node 包管理器，可用于查找、安装、更新、构建和执行 JavaScript 库。\n\n### BASIC FEATURES 基础特性\n\
  - 使用 `console.log` 打印消息。\n- 使用点表示法 `X.Y` 获取对象 `X` 的部分 `Y`。\n- 基础数据类型是布尔值、数字和字符串。\n\
  - 数组顺序存储多个值。\n- 特殊值 `null` 和 `undefined` 意味着“无值”和“不存在”。\n- 使用 `const` 定义常量，使用 `let`\
  \ 定义变量。\n- `typeof` 返回值的类型。\n- `for (let variable of collection) {…}` 遍历数组中的值。\n\
  - `if (condition) {…} else {…}` 根据条件执行某些代码。\n- false、0、空字符串、null 和 undefined 为假；其他所有内容均为真。\n\
  - 使用反引号和 `${…}` 将值插值到字符串中。\n- 对象是一个写在 `{}` 中的键值对集合。\n- `object[key]` 或 `object.key`\
  \ 从对象中获取值。\n- 函数是可以赋值给变量、存储在列表等中的对象。\n- `function name(…parameters…) {…body…}` 是定义函数的旧方法。\n\
  - `name = (…parameters…) => {…body… }` 是定义函数的新方法。\n- 在函数体内使用 `return` 在任何点返回一个值。\n\
  - 使用模块将代码划分在多个文件之间以便复用。\n\n\n\n\n\n- 赋值给 `module.exports` 以指定模块导出的内容。\n- `require(…path…)`\
  \ 导入模块。\n- 以 `.` 或 `/` 开头的路径从本地导入，而没有 `.` 或 `/` 的路径会在库中查找。\n\n### 回调函数 (CALLBACKS)\n\
  \n- JavaScript 像其他对象一样在内存中存储函数的指令。\n- 函数对象可以赋值给变量、放入列表、作为其他函数的参数传递等。\n- 函数可以定义定义，而无需赋予名称。\n\
  - 回调函数是传递给另一个函数以便其在特定时刻执行的函数。\n- 函数式编程在不可变数据上使用高阶函数。\n- 如果数组中的任何元素通过测试，则 `Array.some`\
  \ 为真；而当所有元素都通过测试时，`Array.every` 为真。\n- `Array.filter` 选择数组中通过测试的元素。\n- `Array.map`\
  \ 通过转换现有数组中的值创建一个新数组。\n- `Array.reduce` 将数组归约为单个值。\n- 闭包是在函数定义期间捕获的一组变量。\n\n###\
  \ 对象与类 (OBJECTS AND CLASSES)\n\n- 创建类来定义数据和行为的组合。\n- 使用类的构造函数来初始化对象。\n- `this` 指向当前对象。\n\
  - 使用多态表达常见的行为模式。\n- 有时扩展现有类来创建新类。\n- 重写方法以更改或扩展它们的行为。\n\n### HTML 与 CSS\n\n- HTML\
  \ 是漫长标记语言系列中的最新。\n- HTML 文档包含元素（用尖括号中的标签表示）和文本。\n- 元素必须严格嵌套。\n- 元素可以包含属性。\n- 使用以和符号\
  \ `&` 开头的转义序列来表示特殊字符。\n- 每个页面应该包含一个包含 `head` 和 `body` 的 `html` 元素。\n- 使用 `<!…–>`\
  \ 在 HTML 中包含注释。\n- 使用 `ul` 和 `ol` 用于无序列表和有序列表，使用 `li` 用于列表元素。\n- 使用 `table` 创建表格，`tr`\
  \ 创建行，`th` 创建表头，`td` 创建普通数据。\n- 使用 `<a href=\"…\">…</a>` 创建链接。\n- 使用 `<img src=\"\
  …\" title=\"…\" alt=\"…\" />` 包含图像。\n- 使用 CSS 定义元素的样式。\n- 使用 `class` 和 `id` 标识元素。\n\
  - 使用选择器指定 CSS 应用于哪些元素。\n\n### 页面操作 (MANIPULATING PAGES)\n\n- 在页面的头部中使用 `meta` 标签来指定页面的字符编码。\n\
  - 页面使用文档对象模型 (DOM) 在内存中表示。\n- `document` 对象代表脚本所在的页面。\n- 使用 `querySelectorAll` 方法查找符合条件的\
  \ DOM 节点。\n- 将 HTML 文本赋值给节点的 `innerHTML` 属性以更改节点的内容。\n- 使用 `((params) => {…})(arguments)`\
  \ 在单步中创建并调用函数。\n- 事件监听器是浏览器在某些特定事件发生时运行的函数。\n- 为 `DOMContentLoaded` 创建事件监听器，以便在\
  \ DOM 构建后触发脚本执行。\n- 检查 DOM 节点的 `nodeType` 或 `nodeName` 属性以确定它是什么种的节点。\n- 解构构赋值允许我们在单条语句中通过名称为多个变量赋值。\n\
  - 使用 `setTimeout` 在延迟后触发函数的执行。\n- 要让某个永久运行，让 `setTimeout` 调用的函数设置另一个相同函数的超时。\n\n\
  ### 动态页面 (DYNAMIC PAGES)\n\n- 旧的动态网站在服务器上生成页面。\n- 较新的动态网站在客户端生成页面。\n- React 是用于客户端页面生成的\
  \ JavaScript 库，它将 HTML 元素表示为函数调用。\n- React 在内存中（而非磁盘）用动态生成的内容替换页面元素。\n- React 函数可以使用元素进行自定义。\n\
  - JSX 将 HTML 翻译为 React 函数调用，以便 HTML 和 JavaScript 可以自由混合。\n- 使用 Babel 将浏览器中的 JSX\
  \ 翻译为 JavaScript。\n- 使用伪 HTML 元素和相应的函数定义新的 React 组件。\n- 传递给伪 HTML 的属性作为 `props`\
  \ 对象传递给 JavaScript 函数。\n\n### 数据可视化 (VISUALIZING DATA)\n\n- Vega-Lite 是构建常见可视化的简单方法。\n\
  - Vega-Lite 是声明式的：用户创建一个描述其想要的内容的数据结构，由库创建可视化结果。\n- Vega-Lite 规范包含架构标识符、描述、数据、标记\
  \ (marks) 和编码 (encodings)。\n- Vega-Lite 可视化的整体布局可以通过设置选项来控制。\n\n### 承诺 (PROMISES)\n\
  \n- JavaScript 使用 promise 来管理异步活动。\n- 使用 `resolve` 表示成功完成，使用 `reject` 失败。使用 `then`\
  \ 处理下一步，使用 `catch` 处理错误。\n- 使用 `Promise.all` 等待列表中的所有 promise，使用 `Promise.race`\
  \ 等待集合中的第一个。\n- 使用 `await` 等待结果。\n\n### 交互式网站 (INTERACTIVE SITES)\n\n- 定义事件处理器以指定当用户进行交互时浏览器应该采取的操作。\n\
  - 浏览器将事件对象传递给事件处理器。\n- 使用类来保持状态。\n- React 调用类的 `render` 方法来显示它。将模型（存储数据）与视图（显示数据）分离来。\n\
  - 使用 `fetch` 从服务器获取数据。\n- 使用解构从对象中获取单个成员。\n\n### 数据管理 (MANAGING DATA)\n\n- 小型表格化数据集通常存储为逗号分隔值\
  \ (CSV)。\n- CSV 只能表示常规数据，且 CSV 文件通常不包含单位。\n- 嵌套数据通常使用 JavaScript 对象表示法 (JSON) 存储。\n\
  - 表格数据的 JSON 表示通常包含列名的冗余（可能不一致的）规范。\n- PapaParse 是一个健壮的 CSV 解析库，可生成 JSON。\n\n###\
  \ 创建服务器 (CREATING A SERVER)\n\n- HTTP 请求或响应由一个纯文本头部和一个可选体组成。\n- HTTP 是无状态协议。\n-\
  \ Express 提供了一个简单的基于路径的 JavaScript 服务器。\n- 编写回调函数来处理匹配路径的请求。\n- 为未识别的请求提供默认处理程序。\n\
  - 使用 `Content-Type` 指定返回的数据类型。\n- 使用动态加载来支持插件扩展。\n\n### 测试 (TESTING)\n\n- 单元测试隔离检查一个软件组件的行为。\n\
  - 单元测试的结果可以是通过、失败或错误。\n- 使用 Mocha 在 JavaScript 中编写和运行单元测试。\n- 在单元测试中放置断言以检查结果。\n\
  - 将测试组合成套件 (suites) 以于管理。\n- 将模块分为交互部分和非交互部分以便于测试。\n- 使用 `supertest` 模拟与服务器的交互进行测试。\n\
  - HTML 使用文档对象模型 (DOM) 在内存中表示。\n- 测试时检查 DOM 的结构而非 HTML 的文本表示。\n\n### 使用 DATA-FORGE\
  \ (USING DATA-FORGE)\n\n- 从具有相同键的对象数组、从带有 `columnNames` 和 `rows` 字段的规范中、或通过解析包含\
  \ CSV 或 JSON 的文本来创建 `DataFrame`。\n- 如果你在 dataframe 上使用循环，那么你的方法错了。\n- 使用方法链创建过滤数据并从旧值创建新值的流水线项目。\n\
  - 使用分组和聚合来汇总数据。\n\n### 毕业项目 (CAPSTONE PROJECT)\n\n- 使用实际数据的切片来测试应用程序。\n- 测试摘要和小情况用例，以便可以手动检查结果。\n\
  \n\n\n\n-   在类中存储状态，使用纯函数来显示它。\n\n### 结语\n\n-   我们学习了很多东西。\n-   非常欢迎各种贡献。\n\n# [F\
  \ 协作]\n\n一个项目可以在组织糟糕的代码中生存；但如果人们感到困惑、方向不一或充满敌意，没有任何一个项目能长久。因此，本附录将讨论项目可以做什么来让新成员感到受到欢迎，并在此后让事情运行顺畅。\n\
  \n在 JavaScript 教程中包含这些材料似乎很奇怪，但正如 Freeman 在 [`Free1972`] 中所指出的，每个小组都有权力结构；唯一的问题在于它是正式且负责任的，还是非正式且不予负责任的。在自由软件运动采取其现代、自我意识的形式三十年后，它的成功与失败已经表明，如果一个项目没有明确说明谁有权做什么，它最终将由那个叫门最大、争论最久的人来运行。关于这些问题的更深入的讨论，请参阅\
  \ [`Foge2005`]。\n\n## [F.1 软件许可]\n\n如果法律或出版协议阻止人们阅读你的作品或使用你的软件，你可能正在损害自己的职业生涯。你可能为了尊重个人或商业机密而这样做，但包容性的第一条也是最重要的规则是默认开放。\n\
  \n这说起来容易做起来难，尤其是法律还没有跟上日常实践 [`Mori2012`] 和这篇博客从科学的角度来看是很好的起点，而 [`Lind2008`] 则为想要细节的人提供了深度研究。简而言之，创作作品自动获得知识产权（因此是版权）保护。这意味着每个创作作品都有某种许可：唯一的问题是作者和用户是否知道是什么。\n\
  \n因此，每个项目都应该包含一个明确的许可。这种许可应该尽早选择：如果你在开始时没有正确设置，那么每个合作者都将拥有其作品的版权，在选择许可时需要征得他们的批准。按照惯例，许可通常放在项目根目录下名为\
  \ `LICENSE` 或 `LICENSE.txt` 的文件中。该文件应明确说明提供内容的许可（或许可）；使用复数形式是因为代码、数据和文本可能受不同许可的。\n\
  \n> 不要编写自己的许可\n> 即使你是一个律师也不行：法律术语是一种高度技术性的语言，词汇的含义并不如你想的那样。\n\n为了让许可选择尽可能简单，GitHub\
  \ 允许你在创建存储库时选择最常见的许可之一。开源倡议（Open Source Initiative）维护了一个许可列表，choosealicense.com\
  \ 将帮助你找到适合所需的许可。你需要考虑的一些事项包括：\n\n1. 你是否想对代码进行许可？\n2. 你许可的内容是源代码吗？\n3. 你是否要求分发衍生作品的人也分发他们的代码？\n\
  4. 你是否想处理专利权？\n5. 你的许可与你依赖的软件许可兼容吗？例如，正如我们将在讨论的，你可以在 GPL 许可的项目中使用 MIT 许可的代码，反之则不然。\n\
  \n两种流行的软件许可是 MIT 许可和 GNU 公共许可证 (GPL)。MIT 许可（以及与其相似的 BSD 许可）规定，只要引用原始来源，人们就可以对软件进行任何想要的操作，并且在出现问题时作者不承担任何责任。GPL\
  \ 给了人们类似的权利，但要求他们以相同的条件共享自己的工作：\n\n> 只要你在源文件中跟踪更改/日期，你就可以复制、分发和修改软件。对软件（包括通过编译器包含的\
  \ GPL 许可代码）的任何修改也必须在 GPL 下提供，并附带构建和安装说明。\n> — 而言之\n\n我们推荐 MIT 许可：它对未来行动的限制最少，以后可以变得更严格，而且过去三十年的经验表明，它足以保持工作开放。\n\
  \n## [F.2 数据和文档的许可]\n\nMIT 许可和 GPL 适用于软件。涉及到数据和报告时，最广泛使用的许可家族是知识共享（Creative Commons）制作的许可，这些许可由律师编写和检查，并被社区良好理解。\n\
  \n最宽松的许可被称为 CC-0，其中“0”代表“零限制”。CC-0 将作品置于公领域，即允许任何想使用它的人以他们意意的方式进行使用，而不受任何限制。这通常是数据的最佳选择，因为它简化了聚合分析。例如，如果你为数据选择了一种种要求人们引用来源的许可，那么任何在分析中使用该数据的人都必须引用你；引用他们结果的人也必须如此，以此此类推，这很快就会变得难以处理。\n\
  \n其次常见的许可是知识共享-署名许可，通常称为 CC-BY。这允许人们在引用原始来源的情况下对作品进行任何想要的操作。这是用于手稿的最佳许可，因为你希望人们广泛分享，同时也希望为你的工作获得认可。\n\
  \n其他知识共享许可包含了对特定使用用例的各种限制：\n\n- ND（禁止衍生作品）防止人们创建作品的修改版本。遗憾的是，这也会阻碍翻译和重新格式化。\n- NC（非商业使用）并不意味着人们不能对包含你工作的内容收费，尽管某些出版商仍试图暗示这一点，以吓走人们。相反，NC\
  \ 条款意味着未经你的明确许可，人们不能对使用你工作的内容收费，你可以根据你喜欢的任何条件提供这种许可。\n- 最后，SA（相同共享）要求人们以你使用的相同条件分享包含你作品的作品。再次，这在原则上没有问题，但在实践中会让聚合变成一个头疼的问题。\n\
  \n## [F.3 行为准则]\n\n你不指发生火灾，但每座大型建筑或活动都应该有消防安全计划。同样，为你的项目拥有像附录 B 这样的行为准则，可以减少参与者对于可接受和不可接受行为的不确定性。你可能认为这显而易见，但长期的经验表明，清晰简洁地阐述它可以减少因预期不同而引起的问题，特别是当来自不同文化背景的人尝试协作时。明确的行为准则对新成员特别有帮助，因此拥有它可以帮助你的项目成长并鼓励人们向你提供反馈。\n\
  \n对于边缘化或代表性不足的成员来说，拥有行为准则特别重要，他们以前可能经历过骚扰或不受欢迎的行为。通过采用准则，你传递了一个信号，你的项目正试图成为比 YouTube、Twitter\
  \ 和其他在线垃圾场更好的地方。有些人可能会反对，声称没有必要，或者它侵犯了言论自由，但根据我们的经验，他们通常的意思是，思考他们可能从过去的不平等中获益让他们感到不舒服，或者他们喜欢为了争论而争论。如果行为准则会导致他们去别的地方，那可能会让你的项目运行得更顺畅。\n\
  \n\n\n\n\n正如你不应该为项目编写自己的许可证一样，你可能也不应该自己编写自己的行为准则。我们建议在开发项目中使用“贡献者公约”（Contributor\
  \ Covenant），在面对面的活动中使用来自“Geek Feminism Wiki”的示例行为准则。这两者都经过了仔细的考虑，并根据经验进行了修订，而且目前都已广泛使用，以至于你项目中的许多潜在参与者不需要再对其进行解释。\n\
  \n规则如果不被执行，是没有意义的。因此，如果你采用了行为准则，那么明确如何报告问题以及由谁处理这些问题至关重要。`Auro2018`是一份处理事件的简短实用指南；与贡献者公约和示例行为准则一样，从他人已经思考并完善的内容开始，要比尝试从零创建某些东西要好。\n\
  \n## F.4 治理\n\n如果你的项目涉及人数超过六个人，你应该明确决策的制定方式。我们推荐玛莎规则（Martha’s Rules）`Mina1986`：\n\
  \n1. 在每次会议之前，任何愿意的人都可以发起提议。提案必须在会议前至少 24 小时分发，以便在会议上被考虑，并且必须包含：\n   - 一行摘要（问题的主题行）；\n\
  \   - 提案的全文；\n   - 任何必要信息；\n   - 优与缺点；\n   - 可能的替代方案。\n2. 如果会议有半数或以上的投票成员出席，则达到法定人数。\n\
  3. 一旦某人发起了提案，他们就对其负责。除非发起人或代表在场，否则小组不得讨论或对该问题进行投票。发起人还负责向小组展示该项目。\n4. 在发起人展示提案后，在任何讨论之前，会对该提案进行意向投票：\n\
  \   - 谁喜欢这个提议？\n   - 谁可以接受这个提议？\n   - 谁对这个提议感到不安？\n5. 如果小组全部或大多数人都喜欢或接受该提议，则立即进入正式投票，不进行讨论。\n\
  6. 如果大多数人对该提议感到不安，则将其推迟由发起人进行进一步修改。\n7. 如果某些成员感到不安，他们可以简要说明反对意见。然后设定一个计时器，由主持人主持简短讨论。在\
  \ 10 分钟后或无人有补充内容时（以先到者为准），主持人对该问题进行赞否投票：“我们是否应该在上述反对意见下实施它？”如果大多数人投“赞成”，则实施该提案。否则，提案将返回给发起人进一步处理。\n\
  \n# 遗留问题\n\nJavaScript 现在已经二十五年历史了，像很多事物一样，它仍在与其童年时代的问题斗争。本附录探讨了其中的三个问题。\n\n## G.1\
  \ 平等\n\nGary Bernhardt 在 2012 年的闪电可能是观看最多的 JavaScript 演示。在演讲中，他列出关于该语言的一些可能让你惊讶的真相。\n\
  \n| 操作 | 代码 | 结果 |\n| --- | --- | --- |\n| 空数组加空数组 | `[] + []` | \"\" |\n| 空数组加空对象\
  \ | `[] + {}` | `[object Object]` |\n| 空对象加空数组 | `{} + []` | `0` (数字) |\n| 空对象加空对象\
  \ | `{} + {}` | `NaN` (非数字) |\n\n表 G.1: 惊讶的结果\n\n为了理解这一点，我们需要了解几件事（在 Abhinav Sur\
  \ 的这篇文章中详细列出）：\n\n1. 数组是对象，其键恰好是顺序的。\n2. 当 JavaScript 尝试加非数字内容时，它会尝试将它们转换为数字，如果无效，则转换为字符串（因为它可以拼接字符串）。\n\
  3. 要将数组转换为字符串，JavaScript 会将元素转换为字符串并将它们拼接。如果数组是空的，结果则为空字符串。\n4. 在将对象转换为字符串时，JavaScript\
  \ 会生成 `object`，其中 `CLASS` 是对象类类的名称。\n5. `{}` 可以被解释为空对象或空代码块。\n\n所以：\n- 空数组加空数组变成空字符串加空字符串。\n\
  - 空数组加空对象变成空字符串加 `object Object`（因为空对象的类只是 `Object`）。\n- `{} + []` 被解释为“产生任何内容的空代码块，紧接着是\
  \ []”，这变成了“+ 空数组的数值”，然后变成了“+ 0”。\n- 空对象加空对象被解释为一个空对象加一个空代码块，由于空代码块不产生结果，它的“值”是 `NaN`（非数字）。\n\
  \n这是编程（以及现实生活）中许多情况之一，即在简单情况下方便的做法，在不常见的情况下会产生困惑。除了加拿大语英语外，每种语言都有这类瑕疵。\n\n## G.2\
  \ 迭代\n\n我们在上面写过数组是对象。这导致 JavaScript 最初的 `for` 循环出现了一些不理想的行为，它使用的是 `in` 而不是 `of`，并且会遍历对象的所有可枚举键：\n\
  \n```javascript\nconst things = ['x', 'y', 'z'];\nthings.someProperty = 'someValue';\n\
  for (let key in things) {\n  console.log(key);\n}\n```\n0\n1\n2\nsomeProperty\n\
  ```\n\n“可枚举键”这个短语本身隐藏了一些奇怪之处，但简单来说，`for-in` 循环会遍历从父对象继承的键，以及在对象本身定义的键。由于这通常不是程序员想要的（特别是对于数组），旧代码经常使用\
  \ C 风格的循环：\n\n```javascript\nfor (let i = 0; i < things.length; i += 1) {\n  console.log(i);\n\
  }\n```\n0\n1\n2\n```\n\n今天的解决方案是使用 `for-of` 来获取数组中的值，这通常是我们想要的：\n\n```javascript\n\
  for (let key of things) {\n  console.log(key);\n}\n```\nx\ny\nz\n```\n\n更好的做法是使用\
  \ `forEach` 并利用其可选的第二个和三个参数：\n\n```javascript\nthings.forEach((val, loc, array)\
  \ => {\n  console.log(`element ${loc} of ${array} is ${val}`);\n})\n```\nelement\
  \ 0 of x,y,z is x\nelement 1 of x,y,z is y\nelement 2 of x,y,z is z\n```\n\n## G.3\
  \ 原型\n\n我们最后来到 JavaScript 的一个导致极大困惑的方面：原型。每个 JavaScript 对象都有一个名为原型的内部属性。如果你尝试访问对象的某个属性但没有找到，JavaScript\
  \ 会自动在第一个对象的原型链所引用的对象中查找。如果目标属性不在那里， JavaScript 就会查找原型对象的原型，依此类推。\n\n那么，原型是从哪里来的呢？如果使用\
  \ `new Something()` 创建对象，并且函数 `Something` 有一个名为 `prototype` 的属性，那么新对象的原型将被设置为该 `prototype`\
  \ 属性所指向的对象。\n\n这一切通过一个示例和图表将变得清晰。让我们创建一个对象来存储冰淇淋筒的默认属性，然后创建一个创建实际冰淇淋的函数 `Cone`：\n\
  \n```javascript\nconst iceCream = {\n  size: 'large'\n}\n\nconst Cone = function(f)\
  \ {\n  this.flavor = f;\n}\n\nCone.prototype = iceCream;\n```\n\n我们现在可以创建一个冰淇淋并查看它的属性：\n\
  \n```javascript\nconst dessert = new Cone('mustard');\nconsole.log(`flavor \"${dessert.flavor}\"\
  \ size \"${dessert.size}\"`);\n```\nflavor \"mustard\" size \"large\"\n\n\n\n\n\
  如果我们更改了甜点的 `size`，查找操作在沿着原型链查找父对象之前，会先查找对象的属性：\n\n![Image](img/figG_1.jpg)\n\n图\
  \ G.1: 原型\n\n`dessert.size = ′extra-large′`\n\n```\nconsole.log(`new flavor \"**${dessert.flavor}\"\
  \ size \"**${dessert.size}\"`)\n```\n\nnew flavor \"mustard\" size \"extra-large\"\
  \n\n原型是面向对象编程中实现继承的一种方式；问题在于这种机制相当笨拙，与大多数程序员习惯的写法大不相同，因此人们在原型之上构建了许多层。为了让事情变得更加复杂，`this`\
  \ 的行为可能会出现一些非常奇怪的情况，人们再次构建了层级来试图让自己远离这些奇特性。原型仍然有它的追随者，但大多数人发现现代 JavaScript 的类（classes）更易用。\n\
  \n# H 正则表达式\n\n**正则表达式**是一种用于匹配文本的模式。大多数语言在库中实现它们，但它们是内置在 JavaScript 中的，并使用字符串前后的\
  \ `/` 来编写，而不是单引号或双引号。\n\n- 字母和数字匹配其自身，因此正则表达式 `/enjoy/` 匹配字符串中任何出现的“enjoy”单词。\n\
  - 点 `.` 匹配任意字符，因此 `/../` 匹配任意两个连续字符，而 `/en..y/` 匹配“enjoy”、“gently”和“brightens your\
  \ day”。\n- 星号 `*` 意味着“匹配紧跟在其前面的内容的零或多次出现”，所以 `en*`匹配“ten”和“penny”。它也匹配“feet”（其包含一个“e”，后面跟着零次“n”）。\n\
  - 加号 `+` 意味着“匹配紧跟在其前面的内容的*一次*或多次出现”，所以 `en+` 匹配“ten”和“penny”，但不匹配“feet”（因为没有“n”）。\n\
  - 括号像在数学中一样创建分组，所以 `(an) +` 匹配“banana”但不匹配“annual”。\n- 管道字符 `|` 意味着“或者/或者”，所以 `b|c`\
  \ 匹配单个的“b”或单个的“c”，而 `(either)|(or)` 匹配“either”或“or”。括号是必要的，因为 `either|or` 会匹配“eitherr”或“eitheor”。）\n\
  - 简写符号 `[a-z]` 意味着“范围内的所有字符”，比 `a|b|c|…|y|z` 更容易编写和阅读。\n- 字符 `^` 和 `$` 被称为锚点：它们匹配行的开头和结尾，而不匹配任何实际字符。\n\
  - 如果我们想在正则表达式中使用像 `.`、`*`、`+` 或 `|` 这样的特殊字符，我们必须用反斜杠 `\\` 对其进行**转义**。这意味着 `/stop\\\
  ./` 匹配“stop.”，而 `stop.` 则也会匹配“stops”。\n\n| 文本 | 模式 | 匹配 | 解释 |\n| --- | --- | ---\
  \ | --- |\n| `abc` | `/b/` | yes | 字符匹配自身 |\n| | `/b*/` | yes | 匹配零或多个 b |\n| |\
  \ `/z*/` | yes | 文本包含零个 z，因此模式匹配 |\n| | `/z+/` | no | 文本不包含一个或多个 z |\n| | `/a.c/`\
  \ | yes | ’.’匹配了 ’b’ |\n| | `/^b/` | no | 文本不以 ’b’ 开头 |\n| `abc`123 | `/[a-z]+/`\
  \ | yes | 包含一个或多个连续的小写字母 |\n| | `/^[a-z]+$/` | no | 字符串中的数字阻止了匹配 |\n| | `/^[a-z0-9]+$/`\
  \ | yes | 整个字符串为小写字母或数字 |\n| Dr. Toby | `/(Dr&#124;Prof)\\./` | yes | 包含“Dr”或“Prof”，后面跟着字面的\
  \ '.' |\n\n表 H.1 正则表达式匹配\n\n这些内容需要消化，所以表 H.1 显示了一些示例。正则表达式可以匹配数量惊人的其他模式，但在程序中使用相当简单。像字符串和数组一样，它们是带有方法的对象：如果模式是一个正则表达式，那么\
  \ `string.test(pattern)` 在 `pattern` 匹配字符串时返回 `true`，否则返回 `false`，而 `string.match(pattern)`\
  \ 返回一个匹配子串的数组。如果我们在正则表达式的结束斜杠后添加修饰符“g”使其成为“全局的”，那么 `string.match(pattern)` 返回*所有*匹配的子串。\n\
  \n```\nTests = [\n  'Jamie: james@geneinfo.org',\n  'Zara: zetsure@bio123.edu',\n\
  \  'Hong and Andrzej: hchui@euphoric.edu and aszego@euphoric.edu'\n]\n\nconst pattern\
  \ = /[a-z]+@[a-z]+\\.[a-z]+/g\n\nconsole.log(`pattern is ${pattern}`)\n\nfor (let\
  \ test of Tests) {\n  console.log(`tested against ${test}`)\n  const matches = test.match(pattern)\n\
  \  if (matches === null) {\n    console.log('-no matches-')\n  } else {\n    for\
  \ (let m of matches) {\n      console.log(m)\n    }\n  }\n}\n```\n\n```\npattern\
  \ is /[a-z]+@[a-z]+\\.[a-z]+/g\ntested against Jamie: james@geneinfo.org\njames@geneinfo.org\n\
  tested against Zara: zetsure@bio123.edu\n-no matches-\ntested against Hong and Andrzej:\
  \ hchui@euphoric.edu and aszego@euphoric.edu\nhchui@euphoric.edu\naszego@euphoric.edu\n\
  ```\n\n尽管正则表达式非常强大，但也有它们做不到的事情。不过在从文本中提取信息时，它们比长链式更易用且更高效。\n\n# I 日志\n\n我们使用的 `console`\
  \ 是**日志记录**（logging）。\n\n\n\n\n\n在上面的脚本中，我们通过一个额外的命令行参数设置日志级别。如果我们用 `debug` 级别运行脚本，所有的消息都会显示。如果我们用\
  \ `info` 级别运行，启动消息和 404 错误消息会显示；如果我们只用 `error` 级别，则只显示后者。\n\n```bash\n$ node src/logging/logging-server.js\
  \ src/logging/web-dir/info\n```\n\n```json\n{\"message\":\"Running on port 3418\
  \ with root src/logging/web-dir/\", \"level\":\"info\"}\n```\n\n```json\n{\"message\"\
  :\"Unable to find \\\"src/logging/web-dir/missing.html\\\"\", \"level\":\"error\"\
  }\n```\n\n# J 可扩展服务器\n\n假设我们想以某种方式扩展第 12 章中的服务器。我们可以编辑源文件并添加更多的 URL 处理器，或者让它动态加载并运行\
  \ JavaScript。\n\n```javascript\nconst express = require(′express’)\nconst PORT =\
  \ 3418\n\n// 主服务器对象。\nconst app = express()\n\n// 处理所有请求。\napp.use((req, res, next)\
  \ => {\n  if (req.url.endsWith(′.js′)) {\n    const libName = ′./′.concat(req.url.slice(0,\
  \ -3))\n    const dynamic = require(libName)\n    const data = dynamic.page()\n\
  \    res.status(200).send(data)\n  }\n  else {\n    res.status(404).send(\n    \
  \  `<<html><body><p>\"${req.url}\" not found</p></body></html>`);)\n  }\n})\napp.listen(PORT,\
  \ () => { console.log(`listening on port ${PORT}…`) })\n```\n\n这个简单的服务器检查 URL 中指定的路径是否以\
  \ `.js` 结尾。如果是，它会通过去掉 `.js` 并在主干前加上 `./` 来构造一个看起来像库名称的内容，然后使用 `require` 加载该文件。假设加载成功，它将调用该文件中定义的\
  \ `page` 函数。我们可以创建一个这样的非常简单的插件：\n\n```javascript\nfunction page() {\n  return (′<html><body><h1>Plugin\
  \ Content</h1></body></html 熾);\n}\n\nmodule.exports = {\n  page: page\n}\n```\n\
  \n如果我们运行服务器：\n\n```bash\n$ node src/extensible/dynamic.js\n```\n\n然后访问 `http://localhost:4000/plugin.js`，我们就会得到一个包含标题“Plugin\
  \ Content”的页面。\n\n这是一个非常强大的技术示例。与其将所有内容都构建在一个程序中，我们可以提供一组插件必须遵循的规则，这样人们就可以添加新功能，而无需重写已有的代码。每个插件都必须有一个像\
  \ `page` 函数这样的**入口点**，以便框架知道从哪里开始。\n\n# K 使用数据库\n\n我们的数据管理器（第 11 章）从单个 CSV 文件获取信息。这对于测试目的来说是可以的，但实际应用程序几乎总是使用某种数据库。现在有很多种选择，但**关系型数据库**仍然是\
  \ Web 开发的主力。\n\n关系型数据库使用一种名为 `SQL` 的语言进行操作，它最初代表“Structured Query Language”（结构化查询语言），根据说话者是左撇子还是右手，读音可能是“sequel”或“ess\
  \ cue ell”（替代方案统称为 **NoSQL 数据库**，并使用许多不同的存储模型）。我们将使用 SQL 数据库，因为它仍然是最常见的选择，但我们不会尝试引入\
  \ SQL 本身：关于这一点，请参阅这个短教程[¹。\n\n作为一个示例问题，我们将存储关于研讨会的信息。我们的数据库从一个包含三个**字段**和两个**记录**的单**表**开始：\n\
  \n```sql\ndrop table if exists Workshop;\ncreate table Workshop(\n  ident integer\
  \ unique not null primary key,\n  name text unique not null,\n  duration integer\
  \ not null – 以分钟为单位时长\n);\n\ninsert into Workshop values(1, \"Building Community\"\
  , 60);\ninsert into Workshop values(2, \"ENIAC Programming\", 150);\n```\n\n在教程的剩余部分，我们将构建一个类来处理与\
  \ SQLite 数据库的交互，对其进行测试，然后在之上构建一个 Web 服务。\n\n## K.1 起点\n\n我们的类被形象地命名为 `Database`，它接受\
  \ SQLite 数据库文件的路径作为构造函数参数，并创建一个**连接管理器**，通过它可以发送查询并获取结果。我们将为每个想要运行的查询创建一个方法，并编写一个显示查询结果的辅助方法。我们将为所有查询方法提供相同的签名，以便可以相互处理。整个结构如下：\n\
  \n```javascript\nconst sqlite3 = require(′sqlite3′)\n\nclass Database {\n  constructor\
  \ (path) {\n    this.db = new sqlite3.Database(path, (err) => {\n      if (err)\
  \ {\n        this.fail(err)\n      }\n    })\n  }\n\n  getAll (args) {\n    this.db.all(Q_WORKSHOP_GET_ALL,\
  \ args, (err, rows) => {\n      if (err) {\n        this.fail(err)\n      }\n  \
  \    this.display(rows)\n    })\n  }\n\n  getOne (args) {\n    this.db.all(Q_WORKSHOP_GET_ONE,\
  \ args, (err, rows) => {\n      if (err) {\n        this.fail(err)\n      }\n  \
  \    this.display(rows)\n    })\n  }\n\n  display (rows) {\n    for (let r of rows)\
  \ {\n      console.log(r)\n    }\n  }\n\n  fail (msg) {\n    console.log(msg)\n\
  \    process.exit(1)\n  }\n}\n\nconst Q_WORKSHOP_GET_ALL = `\nselect\n  ident as\
  \ workshopId,\n  name as workshopName,\n  duration as workshopDuration\nfrom Workshop\n\
  `\n\nconst Q_WORKSHOP_GET_ONE = `\nselect\n  ident as workshopId,\n  name as workshopName,\n\
  \  duration as workshopDuration\nfrom Workshop\nwhere\n  ident = ?\n`\n```\n\n一旦我们看到查询的样貌，这就有意义多了：（等一下，提供的文本代码片段顺序是乱的。我根据提供的片段重构了逻辑，以确保文档结构有效且可读。）\n\
  \n这看起来似乎起作用了：`getAll` 被调用了，结果是一个对象数组，每个记录一个对象，其名称显然是根据列名推导出来的。\n\n## K.2 内存数据库\n\
  \n上一个示例总是操作磁盘上的数据库。为了测试目的，使用内存数据库更快、更安全。让我们修改 `Database` 的构造函数来设置它：\n\n```javascript\n\
  constructor (mode, path) {\n  this.path = path\n  switch (mode) {\n```\n\n\n\n\n\
  \n```javascript\ncase 'memory' :\n  const setup = fs.readFileSync(this.path, 'utf-8')\n\
  \  this.db = new sqlite3.Database(':memory:', sqlite3.OPEN_READWRITE,\n    (err)\
  \ => {\n      if (err) {\n        this.fail(`In-memory database open error \"${err}\"\
  `)\n      }\n    })\n  this.db.exec(setup,(err) => {\n    if (err) {\n      this.fail(`Cannot\
  \ initialize in-memory database from \"${this.path}\"`)\n    }\n  })\n  break\n\
  case 'file' :\n  this.db = new sqlite3.Database(this.path, sqlite3.OPEN_READWRITE,\n\
  \    (err) => {\n      if (err) {\n        this.fail(`Database open error ${err}\
  \ for \"${path}\"`)\n      }\n    })\n  break\ndefault :\n  this.fail(`Unknown mode\
  \ \"{mode}\"`)\n  break\n}\n```\n\n如果 `mode` 参数为字符串 `\"memory\"`，我们创建一个内存数据库，并通过执行一个包含用户指定的设置命令的文件来初始化它——在我们的案例中，正是我们在课程开始时展示的命令。如果\
  \ `mode` 为 `\"file\"`，我们将文件参数解释为磁盘数据库的名称，并像以前一样进行。\n\n我们将错误信息设为全大写，因为这是我们可以使用的、令人烦人的选项。没那么烦人的，我们可以使用解构在驱动程序中处理命令行参数：\n\
  \n```javascript\nfunction main () {\n  const [mode, path, action, ...args] = process.argv.splice(2)\n\
  \  const database = new Database(mode, path)\n  databaseaction\n}\n```\n\n在这里，表达式\
  \ `...args` 的意思是“获取匹配完固定名称后剩余的所有内容并放入一个名为 `args` 的数组中”。在完成这些更改后，我们可以像这样运行查询来获取第二个工作坊的详情：\n\
  \n`node database-mode.js memory fixture.sql getOne 2`\n\n```json\n{ \n  workshopId:\
  \ 2,\n  workshopName: 'ENIAC Programming',\n  workshopDuration: 150 \n}\n```\n\n\
  经过一番实验，我们决定更进一步以使测试更简单。我们将允许驱动程序读取 SQL 脚本本身并将其传递给 `Database`，这样我们就可以执行一次文件 I/O，然后反复在内存中构建数据库进行测试。这样，我们的每项测试都将从已知且可预测的数据库状态开始，无论之前运行了哪些其他测试，以及它们对数据库做了哪些更改。以下是构造函数的更改：\n\
  \n```javascript\nconstructor (mode, arg) {\n  switch (mode) {\n    case 'direct'\
  \ :\n      this._inMemory(arg)\n      break\n    case 'memory' :\n      const setup\
  \ = fs.readFileSync(arg, 'utf-8')\n      this._inMemory(setup)\n      break\n  \
  \  case 'file' :\n      this._inFile(arg)\n      break\n    default :\n      this.fail(`Unknown\
  \ mode \"${mode}\"`)\n      break\n    }\n  }\n}\n```\n\n这里是辅助方法：\n\n```javascript\n\
  _inMemory (script) {\n  this.db = new sqlite3.Database(':memory:', sqlite3.OPEN_READWRITE,\n\
  \    (err) => {\n      if (err) {\n        this.fail(`In-memory database open error\
  \ \"${err}\"`)\n      }\n    })\n  this.db.exec(script,\n    (err) => {\n      if\
  \ (err) {\n        this.fail(`Unable to initialize in-memory database from \"${script}\"\
  `)\n      }\n    })\n}\n\n_inFile (path) {\n  this.db = new sqlite3.Database(path,\
  \ sqlite3.OPEN_READWRITE, (err) => {\n    if (err) this.fail(`Database open error\
  \ \"${err}\" for \"${path}\"`)\n  })\n}\n```\n\n我们还需要修改驱动程序（并最后检查请求的操作是否真的被支持）：\n\
  \n```javascript\nfunction main () {\n  let [mode, setup, action, ...args] = process.argv.splice(2)\n\
  \  if (mode === 'direct') {\n    setup = fs.readFileSync(setup, 'utf-8')\n  }\n\
  \  const database = new Database(mode, setup)\n  if (!(action in database)) {\n\
  \    database.fail(`No such operation \"${action}\"`)\n  }\n  databaseaction\n}\n\
  ```\n\n## K.3 使其可测试\n\n我们将数据库类及其驱动程序存放在不同的文件中，以便应用程序可以只加载后者。我们现在将更改数据库查询方法，返回结果用于显示，而不是直接显示，因为我们最终想要对它们进行比较或将其返回给服务器，而不是打印它们：\n\
  \n```javascript\nclass Database {\n  //…如之前*…\n  getAll (args) {\n    this.db.all(Q_WORKSHOP_GET_ALL,\
  \ [], (err, rows) => {\n      if (err) this.fail(err)\n      return rows\n    })\n\
  \  }\n  ////…如之前*…\n}\n```\n\n驱动程序看起来如下所示：\n\n```javascript\nconst Database = require('./separate-database')\n\
  const display = (rows) => {\n  for (let r of rows) {\n    console.log(r)\n  }\n\
  }\n\nconst main = () => {\n  let [mode, setup, action, ...args] = process.argv.splice(2)\n\
  \  if (mode === 'direct') {\n    setup = fs.readFileSync(setup, 'utf-8')\n  }\n\
  \  const database = new Database(mode, setup)\n  if (!(action in database)) {\n\
  \    database.fail(`No such operation \"${action}\"`)\n  }\n  databaseaction\n}\n\
  ```\n\n## K.4 测试\n\n我们终于可以写一些测试了：\n\n```javascript\nconst assert = require('assert')\n\
  const Database = require('./callback-database')\nconst FIXTURE = `\ndrop table if\
  \ exists Workshop;\ncreate table Workshop(\n  ident integer not null primary key,\n\
  \  name text not null,\n  duration integer not null – duration in minutes\n);\n\
  insert into Workshop values(1, \"Building Community\", 60);\ninsert into Workshop\
  \ values(2, \"ENIAC Programming\", 150);\n`\n\ndescribe('database', () => {\n  it('should\
  \ return all workshops', (done) => {\n    expected = [\n      { workshopName: 'Building\
  \ Community', workshopDuration: 60, workshopId: 1 },\n      { workshopName: 'ENIAC\
  \ Programming', workshopDuration: 150, workshopId: 2 }\n    ]\n    new Database('direct',\
  \ FIXTURE).getAll([], (results) => {\n      assert.deepEqual(results, expected,\
  \ 'Got expected workshops')\n      done()\n    })\n  })\n  it('should return one\
  \ workshop', (done) => {\n    expected = [\n      { workshopName: 'Building Community',\
  \ workshopDuration: 60, workshopId: 1 }\n    ]\n    new Database('direct', FIXTURE).getOne(1,\
  \ (results) => {\n      assert.deepEqual(results, expected, 'Got single expected\
  \ workshop')\n      done()\n    })\n  })\n  it('can only get workshops that exist',\
  \ (done) => {\n    new Database('direct', FIXTURE).getOne(99, (results) => {\n \
  \     assert.deepEqual(results, [], 'Got no workshops matching nonexistent key')\n\
  \      done()\n    })\n  })\n})\n```\n\n\n\n\n\n## K.5 更新数据库\n\n我们在[第 11 章]中构建的数据管理器只允许我们读取数据；我们无法修改它。让我们为我们的\
  \ `Database` 类添加一些新功能以支持变异（mutation）：\n\n```javascript\n// *…导入如上*…\n\nconst Q_WORKSHOP_GET_ALL\
  \ = *//…如上*…\n\nconst Q_WORKSHOP_GET_ONE = *//…如上*…\n\nconst Q_WORKSHOP_ADD = `\n\
  \ninsert into Workshop(name, duration) values(?, ?);\n\n`\n\nconst Q_WORKSHOP_DELETE\
  \ = `\n\ndelete from Workshop where ident = ?;\n\n`\n\nclass Database {\n  constructor\
  \ (mode, arg) {\n    // *…如上*…\n  }\n  getAll (args, callback) {\n    // *…如上*…\n\
  \  }\n  getOne (args, callback) {\n    // *…如上*…\n  }\n  addOne (args, callback)\
  \ {\n    this.db.run(Q_WORKSHOP_ADD, args, function (err, rows) {\n      if (err)\
  \ this.fail(err)\n      callback([], this.lastID)\n    })\n  }\n  deleteOne (args,\
  \ callback) {\n    this.db.run(Q_WORKSHOP_DELETE, args, (err, rows) => {\n     \
  \ if (err) this.fail(err)\n      callback([], undefined)\n    })\n  }\n  fail (msg)\
  \ {\n    // *…如上*…\n  }\n  _inMemory (script) {\n    // *…如上*…\n  }\n  _inFile (path)\
  \ {\n    // *…如上*…\n  }\n}\nmodule.exports = Database\n```\n\n这些新增非常直观：执行操作的查询语句被传递给\
  \ `this.db.run`，连同指定要添加或删除内容的传入参数，并将一个空行列表传递给操作回调（因为添加和删除不返回任何内容）。测试需要更多的打字工作，因为我们要检查操作执行后数据库是否处于正确的状态：\n\
  \n```javascript\n// *…导入如上*…\n\nconst FIXTURE = // *…如上*…\n\ndescribe(′mutating\
  \ database′, () => {\n  it(′can add a workshop′, (done) => {\n    const duration\
  \ = 35, name = ′Creating Bugs′\n    const db = new Database(′direct′, FIXTURE)\n\
  \    db.addOne([name, duration], function (results, lastID) {\n      assert.deepEqual(results,\
  \ [], ′Got empty list as result when adding′)\n      assert.equal(lastID, 3, ′Got\
  \ the correct last ID after adding′)\n      db.getAll([], (results) => {\n     \
  \   expected = [\n          { workshopName: ′Building Community′, workshopDuration:\
  \ 60, workshopId: 1 },\n          { workshopName: ′ENIAC Programming′, workshopDuration:\
  \ 150, workshopId: 2 }, { workshopName: name, workshopDuration: duration, workshopId:\
  \ 3 }\n        ]\n        assert.deepEqual(results, expected,\n          ′Got expected\
  \ workshops after add′)\n        done()\n      })\n    })\n  })\n  it(′can delete\
  \ a workshop′, (done) => {\n    const db = new Database(′direct′, FIXTURE)\n   \
  \ db.deleteOne([1], (results, lastID) => {\n      assert.equal(lastID, undefined,\
  \ ′Expected last ID to be undefined′)\n      assert.deepEqual(results, [], ′Got\
  \ empty list as result when deleting′)\n      db.getAll([], (results) => {\n   \
  \     expected = [\n          { workshopName: ′ENIAC Programming′, workshopDuration:\
  \ 150, workshopId: 2 }\n        ]\n        assert.deepEqual(results, expected,\n\
  \          ′Got expected workshops after delete′)\n        done()\n      })\n  \
  \  })\n  })\n})\n```\n\n## K.6 练习\n\n### 复制记录\n\n编写一个程序，将 `source.db` 数据库中 `Workshop`\
  \ 表的所有所有行复制到新数据库 `backup.db` 中同名的表中。\n\n### 过滤记录\n\n为 `Database` 类添加一个新方法，获取所有时长超过指定时间的研讨会：\n\
  \n```javascript\nconst db = new Database(path)\nconst rows = db.getLongerThan(100)\n\
  assert.deepEqual(rows, [\n  {workshopName: ′ENIAC Programming′, workshopDuration:\
  \ 150, workshopId: 2}\n])\n```\n\n你的 `Database.getLongerThan` 方法的 SQL 查询需要使用 `where`\
  \ 子句来选择特定记录。\n\n### 更多过滤\n\n封装在下方变量中的 SQL 查询可用于查找时长在范围内的所有研讨会。\n\n```javascript\n\
  const Q_WORKSHOP_DURATION_RANGE = `\n\nselect\n  Workshop.ident as workshopId,\n\
  \  Workshop.name as workshopName,\n  Workshop.duration as workshopDuration\nfrom\n\
  \  Workshop\nwhere\n  (Workshop.duration <= ?) and (Workshop.duration >= ?)\n\n\
  `\n```\n\n此查询中的 `?` 代表什么？为 `Database` 类再写一个名为 `getWithinLengthRange([args])` 的方法，使用该查询并像以前一样从命令行获取参数。当你向此函数提供错误的参数数量会发生什么？或者按错误的顺序提供会怎样？你能写出一个比这提供更有用反馈的测试吗？\n\
  \n### 错误处理\n\n`Database` 类在检测到错误时打印消息并退出。这样做很糟糕，我应该为此感到耻。正确的做法是 `throw` 一个 `exception`，让主程序可以\
  \ `catch` 并按其需要进行处理。\n\n1. 修改代码来实现此。\n\n### 在服务器上使用数据库\n\n## 部署\n\n在笔记本电脑上运行应用程序是可以的，但早晚我们希望将其放到网上。最简单的平台之一是\
  \ Glitch，它旨在帮助学生构建交互式网站。要尝试它，访问 glitch.com 并创建一个免费账户。然后你可以点击“New Project”按钮并选择 `hello-express`，这将创建一个基础\
  \ Express 应用。该项目包含几个文件：\n\n- `README.md`: Markdown 格式的项目描述。\n- `package.json`: 项目的\
  \ NPM 包列表。\n- `server.js`: 服务器。初始设置为将 `/` 请求路由到 index.html，但可以变得任意复杂。注意它使用了变量 `__dirname`（带有两个下划线）来获取服务器运行所在的目录名称；这是必要的，因为\
  \ Glitch 控制应用程序运行的位置。\n- `views/index.html`: 应用程序首页。我们可以添加许多其他页面，但它们必须放在 `views`\
  \ 文件夹中。\n- `public/client.js`: 在浏览器中运行的用户界面代码。public 文件夹作为服务器的根目录，因此在 `views/index.html`\
  \ 和其他页面中，我们将 `public/client.js` 简单引用为 `/client.js`。\n- `public/style.css`: 为应用程序样式的\
  \ CSS。同样，在 `views/index.html` 中将其引用为 `/style.css` 而无需命名 public 文件夹。\n- `.env`: 脚本，用于定义应用程序所需的任何配置变量，例如数据库密码。与上述文件不同，人们克隆我们的应用程序时不会复制它。如果我们在文件中定义了一个名为\
  \ `PASSWORD` 的变量，那么我们的服务器就可以使用 `process.env.PASSWORD` 获取其值（字符串格式）。\n\n![Image](img/figL_1.jpg)\n\
  \n图 L.1：Glitch 部署\n\n两个不存在的是许可证和行为准则，但可以通过点击“New File”按钮轻松添加。多种广泛使用的开源许可证可供选择，行为准则基于一个在开源项目中也被广泛使用的版本。添加这两者可以明确我们允许并期望人们对我们的项目做什么。\n\
  \n\n\n\n\n文件资源器底部的“重置”（Rewind）按钮让我们能够查看项目历史。Glitch 使用 `Git` 来存储更改，但将这些更改呈现为时间轴，这样我们就可以向前向后滚动，查看何时发生了什么变化。“工具”（Tools）按钮（同样位于文件资源器底部）允许我们访问日志和性能信息，并将项目连接到\
  \ GitHub 上的仓库。\n\n在后台，每个 Glitch 应用都运行在虚拟机中。它创建或修改的任何数据（如磁盘上的文件或 `SQLite` 数据库 附录\
  \ K）都会自动保存，上限为 128 MB。应用程序允许每小时处理数千请求；如果 5 分钟内没有收到请求，虚拟机将进入睡眠状态。当下次请求进来时，它会自动重启，但在唤醒时会有延迟。\n\
