  - 使用 `for` 循环在页面上显示日历，如下：\n\nMonday: task\nTuesday: task\netc…\n\n- 修改你的代码，使用提示框（prompt\
  \ box）让访问者选择一天，并在页面上显示分配给该天的任务。\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON\
  \ | 59 |\n|  |  |  |\n|  |  |  |\n\n## 17 二维数组 (Two Dimensional Arrays)\n\n### 关键点\n\
  \n- 回到邮箱类比，数组可以被想象成一排邮箱，每个邮箱都有自己的内容和标签，那么二维数组可以被看作是这些邮箱行堆叠在一起的。\n- 实际上，二维数组仅仅是一个每个元素本身又是数组的数组。二维数组的每个“子数组”长度可以不同——换句话说，二维数组不必是“正方形”的。\n\
  \n\n\n\n\n- 你可以使用两对方括号而不是仅仅是一对来访问每个子数组的内容。下面的示例能很好地说明这一点：\n\n```javascript\narray_1\
  \ = [\"element”, “element 2”];\narray_2 = [\"another element”, 2, 98, true];\narray_3\
  \ = [array_1, array_2];\nalert(array_3[1][3]);// 显示 “98”\n```\n\n- 虽然你不能在单个数组中混合数值索引和字符串索引系统（即数组不能既是数值数组又是关联性数组），但你可以在二维数组中同时拥有关联数组和数值数组。例如，将上述内容重构如下：\n\
  \n```javascript\narray_3 = new Array();\narray_3[\"firstArray\"] = array_1;\narray_3[\"\
  secondArray\"] = array_2;\nalert(array_3[\"secondArray\"][3]);\n//再次显示 “98”\n```\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 60 |\n|  |  |  |\n|  |  |  |\n\
  \n- 同样，我们可以愉快地对关联数组使用“对象”表示法：\n\n```javascript\nalert(array_3.secondArray[3]);\n\
  //再次显示 “98”\n```\n\n## 项目\n\n- 打开你之前的项目文件，并将其保存为 `chapter_17.html`。\n- 在你之前的项目的基础上，创建若干新的、包含七元素的关联数组，以表示\
