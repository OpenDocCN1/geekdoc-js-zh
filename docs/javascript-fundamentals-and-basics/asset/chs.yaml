  \ §26.4.3 “不是 Object 实例的对象”。\n\n## 11.3 语言规范的类型\n\nECMAScript 规范仅包含 7 种类型。这些类型的名称为（我使用的是\
  \ TypeScript 的名称）：\n\n- `undefined`：元素为 `undefined`。\n- `null`：元素为 `null`。\n- `boolean`：元素为\
  \ `false` 和 `true`。\n- `number`：所有数字的类型（例如 -123, 3.141）。\n- `string`：所有字符串的类型（例如\
  \ 'abc'）。\n- `symbol`：所有符号的类型（例如 `Symbol('My Symbol')`）。\n- `object`：所有对象的类型（不同于\
  \ `Object` 类及其子类的实例类型）。\n\n## 11.4 原始值对比对象\n\n### 11.4.1 原始值（简写: primitives）\n\n\
  #### 11.4.1.1 原始值是不可变的\n\n你无法对原始值修改、添加或删除属性：\n\n```javascript\nlet str = 'abc';\n\
  assert.equal(str.length, 3);\nassert.throws(() => { str.length = 1 },\n```\n\n\n\
  \n\n\n```javascript\n/^TypeError: Cannot assign to read only property 'length'/\n\
  ```\n\n### 11.4.1.2 基本类型按值传递\n\n基本类型是按值传递的：变量（包括参数）存储基本类型的内容。当将一个基本类型赋值给变量或将其作为参数传递给函数时，其内容会被复制。\n\
  \n```javascript\nlet x =  123;\nlet y = x;\nassert.equal(y,  123);\n```\n\n### 11.4.1.3\
  \ 基本类型按值比较\n\n基本类型按值比较：当比较两个基本类型值时，我们比较的是它们的内容。\n\n```javascript\nassert.equal(123\
  \  ===  123,  true);\nassert.equal('abc'  ===  'abc',  true);\n```\n\n想了解这种比较方式的特殊之处，请继续阅读以了解对象是如何比较的。\n\
  \n### 11.4.2 对象\n\n对象将在 §25 “单个对象”以及接下来的章节中进行详细介绍。在这里，我们主要关注它们与基本类型值的区别。\n\n让我们首先探索创建对象的两种常用方式：\n\
  \n*   **对象字面量**：\n    ```javascript\n    const obj = {\n      first:  'Jane',\n\
  \      last:  'Doe',\n    };\n    ```\n    对象字面量以大括号 `{}` 开始和结束。它创建了一个有两个属性的对象。第一个属性的键为\
  \ `'first'`（字符串），值为 `'Jane'`。第二个属性的键为 `'last'`，值为 `'Doe'`。关于对象字面量的更多信息，请参 §25.2.1\
  \ “对象字面量：属性”。\n\n*   **数组字面量**：\n    ```javascript\n    const arr = ['foo',  'bar'];\n\
  \    ```\n    数组字面量以方括号 `[]` 开始和结束。它创建了一个包含两个元素 `'foo'` 和 `'bar'` 的 `Array`。关于数组字面量的更多信息，请参阅\
  \ $full。\n\n#### 11.4.2.1 对象默认是可变的\n\n默认情况下，你可以自由地更改、添加和删除对象的属性：\n\n```javascript\n\
  const obj = {};\nobj.foo =  'abc';  // 添加属性\nassert.equal(obj.foo,  'abc');\nobj.foo\
  \ =  'def';  // 修改属性\nassert.equal(obj.foo,  'def');\n```\n\n#### 11.4.2.2 对象按身份传递\n\
  \n对象按身份传递（这是我的术语）：变量（包括参数）存储对象的身份。\n\n| 11.5 运算符 `typeof` 和 `instanceof`：值的类型是什么？\
  \ | 81 |\n\n对象的身份就像一个指向堆（heap）上对象实际数据的指针（或透明引用，可以想象成 JavaScript 引擎的共享主内存）。\n\n当将对象赋值给变量或将其作为参数传递给函数时，它的身份会被复制。每个对象字面量都会在堆上创建一个全新的对象并返回其身份。\n\
  \n```javascript\nconst a = {};  // 全新的空对象\n// 将 `a` 中的身份传递给 `b`：\nconst b = a;\n\
  // 现在 `a` 和 `b` 指向同一个对象（它们“共享”该对象）：\nassert.equal(a === b,  true);\n// 修改 `a` 也会改变\
  \ `b`：\na.foo =  123;\nassert.equal(b.foo,  123);\n```\n\nJavaScript 使用垃圾回收自动管理内存：\n\
  \n```javascript\nlet obj = {  prop:  'value'  };\nobj = {};\n```\n\n现在 `obj` 的旧值\
  \ `{ prop: 'value' }` 是垃圾（不再使用）。JavaScript 将在某个时间点自动进行垃圾回收（将其从内存中移除），如果有足够的可用内存，可能永远不会。\n\
  \n![](img/image01430.jpeg)![](img/image01417.jpeg)\n![](img/image01403.jpeg) 详情：按身份传递\n\
  \n“按身份传递”意味着对象的身份（一个透明引用）按值传递。这种方法也被称为[按共享传递](https://en.wikipedia.org/wiki/Evaluation_strategy#Call_by_sharing)。\n\
  \n#### 11.4.2.3 对象按身份比较\n\n对象按身份比较（这是我的术语）：两个变量只有在包含相同对象身份时才相等。如果它们指向内容相同的不同对象，则它们不相等。\n\
  \n```javascript\nconst obj = {};  // 全新的空对象\nassert.equal(obj === obj,  true); \
  \ // 相同身份\nassert.equal({} === {},  false);  // 不同身份，相同内容\n```\n\n### 11.5 运算符 `typeof`\
  \ 和 `instanceof`：值的类型是什么？\n\n`typeof` 和 `instanceof` 运算符让你确定给定值 `x` 具有什么类型：\n\n\
  8211 值\n\n```javascript\nif (typeof x ===  'string') ···\nif (x instanceof Array)\
  \ ···\n```\n\n它们之间有什么区别？\n\n*   `typeof` 区分规范中的 7 种类型（减少一个遗漏，增加一个）。\n*   `instanceof`\
  \ 测试哪个类创建了给定的值。\n\n![](img/image01431.jpeg)![](img/image01432.jpeg)\n![](img/image01427.jpeg)\
  \ 诀：`typeof` 用于基本类型，`instanceof` 用于对象。\n\n#### 11.5.1 typeof\n\n表 11.1：`typeof`\
  \ 运算符的结果。\n\n![](img/image01433.jpeg)\n\n| x | `typeof x` |\n| :--- | :--- |\n|\
