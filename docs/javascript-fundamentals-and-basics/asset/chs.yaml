  \ `our_logo` 的对象，我们可以使用以下代码行：\n`our_logo = document.getElementById(“theLogo”);`\n\
  - 结果对象有许多属性。由于在这种情况下，我们的对象代表一个图像元素，它的属性包括：\n`our_logo.height`\n`our_logo.width`\n\
  `our_logo.src`\n- 我们可以使用 JavaScript 更改这些属性的任何一个，所以如果我们想更改显示的图像，可以如下操作：\n`our_logo.src\
