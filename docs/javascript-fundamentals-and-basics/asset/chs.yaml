  \ 方法 . . . . . . . . . . . . . . . . . . . | 157 |\n\n## 18.1 普通字符串字面量\n\n字符串是原始值且是不可变的。14418\
  \ 字符串\n\n字符串字面量由单引号或双引号界定：\n\n```javascript\nconst str1 = 'abc';\nconst str2 = \"\
  abc\";\n```\n\n单引号的使用更频繁，因为这样更容易提到双引号。它们是可以互换的。\n\n### 18.1.1 转义\n\n反斜杠 `\\` 允许你创建特殊字符：\n\
  \n- Unix 换行：`\\n`\n- Windows 换行：`\\r`\n- 制表符：`\\t`\n- 反斜杠：`\\\\`\n\n反斜杠还允许你在字符串内部包含双引号：\n\
  \n```javascript\nconst s = \"She said: 'Let's go!'\";\n```\n\n## 18.2 访问字符和代码点\n\
  \n### 18.2.1 访问 JavaScript 字符\n\n你可以使用索引访问字符串中的字符：\n\n```javascript\nconst str =\
  \ 'abc';\n// 读取指定索引处的字符：\nassert.equal(str[1], 'b');\n\n// 计算字符串中的字符数：\nassert.equal(str.length,\
  \ 3);\n```\n\n### 18.2.2 通过 `for-of` 和扩展访问 Unicode 代码点字符\n\n通过 `for-of` 遍历字符串会访问代码点字符：\n\
  \n```javascript\nfor (const ch of 'x\U0001F601') {\n  console.log(ch);\n}\n// 输出：\n\
  // 'x'\n// '\U0001F601'\n// 'y'\n```\n\n以及通过扩展运算符将字符串转换为代码点字符的 `Array`：\n\n```javascript\n\
  assert.deepEqual([...'x\U0001F601'], ['x', '\U0001F601', 'y']);\n```\n\n## 18.3\
  \ 通过 `+` 拼接字符串\n\n如果操作数有一个字符串，加运算符（`+`）会将非字符串转换为字符串并拼接结果：\n\n```javascript\nassert.equal(3\
  \ + ' times ' + 4, '3 times 4');\n```\n\n使用 `+` 组合字符串是非常高效的，因为大多数 JavaScript 引擎对其进行了优化。\n\
  \n![](img/image1436.jpeg)![](img/image1437.jpeg)\n\n如果你想分段组装字符串，赋值运算符 `+=` 很有用：\n\
  \n```javascript\nlet str = ''; // 必须是 `let`\nstr += 'Say it';\nstr += ' one more';\n\
  str += ' time';\nassert.equal(str, 'Say it one more time');\n```\n\n## 18.4 转换为字符串\n\
  \n有三种将值 `x` 转换为字符串的方法：\n\n- `String(x)`\n- `''+x`\n- `x.toString()`（对 `undefined`\
  \ 和 `null` 不起）\n\n建议：使用具有描述性且安全的 `String()`。\n\n示例：\n\n```javascript\nassert.equal(String(undefined),\
  \ 'undefined');\nassert.equal(String(null), 'null');\nassert.equal(String(false),\
  \ 'false');\nassert.equal(String(true), 'true');\nassert.equal(String(123.45), '123.45');\n\
  ```\n\n\n\n\n`Boolean()` 返回 `false` 的唯一字符串是空字符串。\n\n### 18.4.1 字符串化\n\n普通对象有一个默认的字符串表示，这种表示并不好用：\n\
  \n```\nString({a: 1})\n```\n'[object Object]'\n\n数组有更好的字符串表示，但它仍然隐藏了大量信息：\n\n```\n\
  String(['a', 'b'])\n```\n'a,b'\n\n```\nString(['a', ['b']])\n```\n'a,b'\n\n```\n\
  String([1, 2])\n```\n'1,2'\n\n```\nString(['1', '2'])\n```\n'1,2'\n\n```\nString([true])\n\
  ```\n'true'\n\n```\nString(['true'])\n```\n'true'\n\n```\nString(true)\n```\n'true'\n\
  \n对函数进行字符串化，会返回它们的源代码：\n\n``` evenString(function f() {return 4})\n```\n'function\
  \ f() {return 4}'\n\n### 18.4.2 自定义对象的字符串化\n\n你可以通过实现 `toString()` 方法来重写内置的对象字符串化方式：\n\
  \n```javascript\nconst obj = {\n  toString() {\n    return 'hello';\n  }\n};\n\n\
  assert.equal(String(obj), 'hello');\n```\n\n### 18.4.3 值的字符串化的另一种方法\n\nJSON 数据格式是\
  \ JavaScript 值的文本表示形式。因此，`JSON.stringify()` 也可以用于将值转换为字符串：\n\n```\nJSON.stringify({a:\
  \ 1})\n```\n'{\"a\":1}'\n\n```\nJSON.stringify(['a', ['b']])\n```\n'[\"a\",[\"b\"\
  ]]'\n\n需要注意的是，JSON 仅支持 `null`、`booleans`、`numbers`、`strings`、`Arrays` 和 `objects`（它始终将其处理为通过对象字面量创建的）。\n\
  \n提示：第三参数允许你开启多行输出并指定缩进量。例如：\n\n```javascript\nconsole.log(JSON.stringify({first:\
  \ 'Jane', last: 'Doe'}, null, 2));\n```\n\n该语句产生以下输出。\n\n```json\n{\n  \"first\"\
  : \"Jane\",\n  \"last\": \"Doe\"\n}\n```\n\n### 18.5 比较字符串\n\n字符串可以通过以下运算符进行比较：\n\
  \n`<`, `<=`, `>`, `>=`\n\n有一个重要的注意事项需要考虑：这些运算符根据 JavaScript 字符的数值进行比较。这意味着 JavaScript\
  \ 用于字符串的顺序与字典和电话簿中使用的顺序不同：\n\n```javascript\n'A' < 'B' // 确定\ntrue\n```\n\n```javascript\n\
  'a' < 'B' // 不正确\nfalse\n```\n\n```javascript\n'ä' < 'b' // 不正确\nfalse\n```\n\n\
  正确地比较文本超出了本书的范围。它通过 [ECMA-Script 国际化 API (Intl)](https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/Intl)\
  \ 支持。\n\n### 18.6 文本的原子：Unicode 字符、JavaScript 字符、字形簇\n\n### 18.6 文本的原子：Unicode 字符、JavaScript\
  \ 字符、字形簇\n\n对 §17 “Unicode – 简要介绍”的快速回顾：\n\n- Unicode 字符由码点（code points）表示；即范围为\
  \ 21 位的数字。\n- 在 JavaScript 字符串中，Unicode 是通过基于 UTF-16 编码格式的代码单元（code units）实现的。每个代码单元是一个\
  \ 16 位的数字。编码单个码点需要一个到两个代码单元。\n- 因此，每个 JavaScript 字符由一个代码单元表示。在 JavaScript 标准库中，代码单元也称为字符编码（char\
  \ codes）。它们确实就是如此：JavaScript 字符的数字。\n- 字形簇（grapheme clusters，用户感知的字符）是屏幕或纸上显示的写入符号。编码单个字形簇需要一个或多个\
  \ Unicode 字符。\n\n以下代码演示了单个 Unicode 字符由一个或两个 JavaScript 字符组成。我们通过 `.length` 计数后者：\n\
  \n- 3 个 Unicode 字符，3 个 JavaScript 字符：`assert.equal('abc'.length, 3);`\n- 1 个 Unicode\
  \ 字符，2 个 JavaScript 字符：`assert.equal('☺'.length, 2);`\n\n下表总结了我们刚刚探索的概念：\n\n| 实体\
  \ | 数值表示 | 大小 | 编码方式 |\n| :--- | :--- | :--- | :--- |\n| 字形簇 | | | 1+ 码点 |\n| Unicode\
  \ 字符 | 码点 | 21 位 | 1–2 代码单元 |\n| JavaScript 字符 | UTF-16 代码单元 | 16 位 | – |\n\n####\
  \ 18.6.1 码点操作\n\n让我们探索 JavaScript 处理码点的工具。\n\n码点转义（code point escape）允许你以十六进制形式指定码点。它产生一个或两个\
  \ JavaScript 字符。\n\n```\n'\\u{1F642}'\n```\n'☺'\n```\n\n`String.fromCodePoint()`\
  \ 将单个码点转换为 1–2 个 JavaScript 字符：\n\n```\nString.fromCodePoint(0x1F642)\n```\n'☺'\n\
  ```\n\n`.codePointAt()` 将 1–2 个 JavaScript 字符转换为单个码点：\n\n```\n'☺'.codePointAt(0).toString(16)\n\
  ```\n'1f642'\n\n你可以解构等待，遍历字符串，这会访问 Unicode 字符（而不是 JavaScript 字符）。\n\n迭代将在本书后后部分描述。迭代的一种方法是通过\
  \ `for-of` 循环：\n\n```javascript\nconst str = '☺a';\nassert.equal(str.length, 3);\n\
  for (const codePointChar of str) {\n  console.log(codePointChar);\n}\n```\n\n- 输出：\n\
  - '☺'\n- 'a'\n\n将 `(...)` 展开到 `Array` 字面量中也是基于迭代并访问 Unicode 字符的：\n\n```\n[...'☺a']\n\
  ```\n[ '☺', 'a' ]\n```\n\n这使其成为计算 Unicode 字符的良好工具：\n\n```javascript\n[...'☺a'].length\n\
  ```\n2\n\n```javascript\n'☺a'.length\n```\n3\n\n#### 18.6.2 代码单元操作（字符编码 char codes）\n\
  \n字符串的索引和长度基于 JavaScript 字符（以 UTF-16 代码单元表示）。\n\n要以十六进制形式指定代码单元，你可以使用代码单元转义：\n\n\
  ```\n'\\uD83D\\uDE42'\n```\n'☺'\n```\n\n你可以使用 `String.fromCharCode()`。Char code\
  \ 是标准库中对代码单元的名称：\n\n```javascript\nString.fromCharCode(0xD83D) + String.fromCharCode(0xDE42)\n\
  ```\n'☺'\n```\n\n要获取字符的字符编码，使用 `.charCodeAt()`：\n\n```javascript\n'☺'.charCodeAt(0).toString(16)\n\
  ```\n'd83d'\n\n#### 18.6.3 注意事项：字形簇\n\n在处理可能用任何人类语言编写的文本时，最好在字形簇的边界分割，而不是在 Unicode\
  \ 字符的边界分割。\n\nTC39 正在开发 [Intl.Segmenter](https://github.com/tc39/proposal-intl-segmenter)，这是\
  \ ECMAScript 国际化 API 的提案，旨在支持 Unicode 分段（沿字形簇边界、单词边界、句子边界等）。\n\n在性提案成为标准之前，你可以使用多个可用库之一（在网络上搜索“JavaScript\
  \ grapheme”）。\n\n### 18.7 快速参考：字符串\n\n字符串是不可变的，没有任何字符串方法会修改它们自身的字符串。\n\n### 18.7.1\
  \ 转换为字符串\n\n表 18.2 描述了如何将各种值转换为字符串。\n\n表 18.2：将值转换为字符串。\n\n- `String(x)`\n\n| :---\
  \ | :--- |\n| undefined | 'undefined' |\n| null | 'null' |\n| Boolean value | false\
  \ → 'false', true → 'true' |\n| Number value | 示例：123 → '123' |\n| String value\
  \ | x（输入，保持不变） |\n| 一个对象 | 可通过例如 `toString()` 进行配置 |\n\n### 18.7.2 字符的数值值\n\n- **Char\
  \ code (字符编码)**：用数值表示 JavaScript 字符。JavaScript 对 Unicode 代码单元的名称。\n  - 大小：16 位，无符号\n\
  \  - 将数字转换为字符：`String.fromCharCode()` [ES1]\n  - 将字符转换为数字：字符串方法 `.charCodeAt()`\
  \ [ES1]\n- **Code point (码点)**：用数值表示 Unicode 字符。\n  - 大小：21 位，无符号（17 个平面，每个 16 位）\n\
  \  - 将数字转换为字符：`String.fromCodePoint()` [ES6]\n  - 将字符转换为数字：字符串方法 `.codePointAt()`\
  \ [ES6]\n\n### 18.7.3 字符串运算符\n\n// 通过 `[]` 字符\n\n```javascript\nconst str = 'abc';\n\
  assert.equal(str[1], 'b');\n```\n\n// 通过 `+` 拼接字符串\n\n```javascript\nassert.equal('a'\
  \ + 'b' + 'c', 'abc');\nassert.equal('take ' + 3 + ' oranges', 'take 3 oranges');\n\
  ```\n\n### 18.7.4 String.prototype：查找与匹配\n\n（String.prototype 是存储字符串方法的地方。）\n\n\
  - `.endsWith(searchString: string, endPos=this.length)` [ES6]\n  如果字符串长度为 `endPos`\
  \ 且以 `searchString` 结尾，则返回 `true`。\n  否则返回 `false`。\n\n```javascript\n'foo.txt'.endsWith('.txt')\
  \ // true\n```\n\n```javascript\n'abcde'.endsWith('cd', 4) // true\n```\n\n- `.includes(searchString:\
  \ string, startPos=0)` [ES6]\n  如果字符串包含 `searchString` 则返回 `true`，否则返回 `false`。搜索从\
  \ `startPos` 开始。\n\n```javascript\n'abc'.includes('b') // true\n```\n\n\n\n\n\n\
  ```javascript\n'abc'.includes('b', 2)\nfalse\n```\n\n• `.indexOf(searchString: string,\
  \ minIndex=0): number` [ES1]\n\n返回 `searchString` 在字符串中出现的最小索引，否则返回 `-1`。任何返回的索引都将是\
  \ `minIndex` 或更高。\n\n```javascript\n'abab'.indexOf('a')\n0\n```\n\n```javascript\n\
  'abab'.indexOf('a', 1)\n2\n```\n\n```javascript\n'abab'.indexOf('c')\n-1\n```\n\n\
  • `.lastIndexOf(searchString: string, maxIndex=Infinity): number` [ES1]\n\n返回 `searchString`\
  \ 在字符串中出现的最高索引，否则返回 `-1`。任何返回的索引都将是 `maxIndex` 或更。\n\n```javascript\n'abab'.lastIndexOf('ab',\
  \ 2)\n2\n```\n\n```javascript\n'abab'.lastIndexOf('ab', 1)\n0\n```\n\n```javascript\n\
  'abab'.lastIndexOf('ab')\n2\n```\n\n• [1 of 2] `.match(regExp: string | RegExp):\
  \ RegExpMatchArray | null` [ES3]\n\n如果 `regExp` 是没有设置标记 `/g` 的正则表达式，则 `.match()`\
  \ 返回 `regExp` 在字符串中的第一个匹配。如果没有匹配，则返回 `null`。如果 `regExp` 是字符串，则在执行上述步骤之前，它被用于创建一个正则表达式（类似于\
  \ `new RegExp()` 的参数）。\n\n结果的类型如下：\n\n```typescript\ninterface RegExpMatchArray\
  \ extends Array<string> {\n  index: number;\n  input: string;\n  groups: undefined\
  \ | {\n    [key: string]: string\n  };\n}\n```\n\n数字捕获组变为数组索引（这就是为什么该类型扩展了 `Array`）。命名捕获组（ES2018）变为\
  \ `.groups` 的属性。在此模式下，`.match()` 的工作方式类似于 `RegExp.prototype.exec()`。\n\n示例：\n\n\
  ```javascript\n'ababb'.match(/a(b+)/)\n{ 0: 'ab', 1: 'b', index: 0, input: 'ababb',\
  \ groups: undefined }\n```\n\n```javascript\n'ababb'.match(/a(?<foo>b+)/)\n{ 0:\
  \ 'ab', 1: 'b', index: 0, input: 'ababb', groups: { foo: 'b' } }\n```\n\n```javascript\n\
  'abab'.match(/x/)\nnull\n```\n\n• [2 of 2] `.match(regExp: RegExp): string[] | null`\
  \ [ES3]\n\n如果 `regExp` 的标记 `/g` 被设置，则 `.match()` 返回包含所有匹配项的数组，或者在没有匹配时返回 `null`。\n\
  \n```javascript\n'ababb'.match(/a(b+)/g)\n[ 'ab', 'abb' ]\n```\n\n```javascript\n\
  'ababb'.match(/a(?<foo>b+)/g)\n[ 'ab', 'abb' ]\n```\n\n```javascript\n'abab'.match(/x/g)\n\
  null\n```\n\n• `.search(regExp: string | RegExp): number` [ES3]\n\n返回 `regExp` 在字符串中出现的索引。如果\
  \ `regExp` 是字符串，则它被用于创建一个正则表达式（类似于 `new RegExp()` 的参数）。\n\n```javascript\n'a2b'.search(/[0-9]/)\n\
  1\n```\n\n```javascript\n'a2b'.search('[0-9]')\n1\n```\n\n• `.startsWith(searchString:\
  \ string, startPos=0): boolean` [ES6]\n\n如果 `searchString` 出现在字符串索引 `startPos` 处，则返回\
  \ `true`。否则返回 `false`。\n\n### 18.7 快速参考：字符串\n\n```javascript\n'.gitignore'.startsWith('.')\n\
  true\n```\n\n```javascript\n'abcde'.startsWith('bc', 1)\ntrue\n```\n\n### 18.7.5\
  \ String.prototype: 提取\n\n• `.slice(start=0, end=this.length): string` [ES3]\n\n\
  返回字符串中从索引 `start`（包含）开始到索引 `end`（不包含）结束的子字符串。如果索引为负数，则在使用之前将其加到 `.length` 上（-1 意味着\
  \ `this.length-1`，等）。\n\n```javascript\n'abc'.slice(1, 3)\n'bc'\n```\n\n```javascript\n\
  'abc'.slice(1)\n'bc'\n```\n\n```javascript\n'abc'.slice(-2)\n'bc'\n```\n\n• `.split(separator:\
  \ string | RegExp, limit?: number): string[]` [ES3]\n\n将字符串分割为子字符串数组——即出现在分隔符之间的字符串。分隔符可以是字符串：\n\
  \n```javascript\n'a | b | c'.split('|')\n[ 'a ', ' b ', ' c' ]\n```\n\n它也可以是正则表达式：\n\
  \n```javascript\n'a : b : c'.split(/ *: */)\n[ 'a', 'b', 'c' ]\n```\n\n```javascript\n\
  'a : b : c'.split(/( *):( *)/)\n[ 'a', ' ', ' ', 'b', ' ', ' ', 'c' ]\n```\n\n最后一次调用演示了正则表达式中的组所做的捕获如何变为返回数组的元素。\n\
  \n警告：`.split('')` 将字符串拆分为 JavaScript 字符。这在处理星际 Unicode 字符（编码为两个 JavaScript 字符）时效果不佳。例如，表情符号是星际字符的：\n\
  \n```javascript\n'☺X☺'.split('')\n[ '\\uD83D', '\\uDE42', 'X'\n```\n\n相反，最好使用展开运算符：\n\
  \n```javascript\n[...'X☺']\n[ '☺', 'X', '☺' ]\n```\n\n• `.substring(start: number,\
  \ end=this.length): string` [ES1]\n\n使用 `.slice()` 代替此方法。`.substring()` 在旧引擎中实现不一致，且不支持负索引。\n\
  \n### 18.7.6 String.prototype: 组合\n\n• `.concat(...strings: string[]): string` [ES3]\n\
  \n返回字符串与 `strings` 的拼接。`'a'.concat('b')` 等于 `'a'+'b'`。后者更流行。\n\n```javascript\n\
  'ab'.concat('cd', 'ef', 'gh')\n'abcdefgh'\n```\n\n• `.padEnd(len: number, fillString='\
  \ '): string` [ES2017]\n\n在字符串末尾附加 `fillString` 片直到达到指定的长度 `len`。如果已经达到或超过 `len`，则直接返回，不做任何更改。\n\
  \n```javascript\n'#'.padEnd(2)\n'# '\n```\n\n```javascript\n'abc'.padEnd(2)\n'abc'\n\
  ```\n\n```javascript\n'#'.padEnd(5, 'abc')\n'#abca'\n```\n\n• `.padStart(len: number,\
  \ fillString=' '): string` [ES2017]\n\n在字符串开头添加 `fillString` 片段直到达到指定的长度 `len`。如果已经达到或超过\
  \ `len`，则直接返回，不做任何更改。\n\n```javascript\n'#'.padStart(2)\n'#'\n```\n\n```javascript\n\
  'abc'.padStart(2)\n'abc'\n```\n\n```javascript\n'#'.padStart(5, 'abc')\n'abc#'\n\
  ```\n\n• `.repeat(count=0): string` [ES6]\n\n返回拼接 `count` 次的字符串。\n\n```javascript\n\
  '*'.repeat(3)\n'***'\n```\n\n• `.normalize(form: 'NFC'): string` [ES6]\n\n根据 Unicode\
  \ 规范化形式（`NFC`, `NFD`, `NKC`, `NFKD`）规范化字符串。\n\n```javascript\n'ﬁ'.normalize('NFC')\n\
  'ﬁ'\n```\n\n\n\n\n\n返回字符串的副本，其中所有大写字母字符都被转换为小写字母。该方法在不同字母表上的效果取决于 JavaScript 引擎。\n\
  \n```javascript\n'-A2B-'.toLowerCase()\n```\n'-a2b-'\n\n```javascript\n'ΑΒΓ'.toLowerCase()\n\
  ```\n'αβγ'\n\n*   `.trim()`: `string` [ES5]\n\n返回字符串的副本，其中所有开头和结尾的空白（空格、制表符、换行符等）都会被删除。\n\
  \n```javascript\n'\\r\\n#\\t'.trim()\n```\n'#'\n\n```javascript\n'abc'.trim()\n\
  ```\n'abc'\n\n*   `.trimEnd()`: `string` [ES2019]\n\n与 `.trim()` 相似，但只修剪字符串的结尾：\n\
  \n```javascript\n'abc'.trimEnd()\n```\nabc\n\n*   `.trimStart()`: `string` [ES2019]\n\
  \n与 `.trim()` 相似，但只修剪字符串的开头：\n\n### 18.7 快速参考：字符串\n\n```javascript\n'abc'.trimStart()\n\
  ```\n'abc'\n\n#### 18.7.8 来源\n\n*   [TypeScript 内置类型](https://github.com/Microsoft/TypeScript/blob/master/lib/)\n\
