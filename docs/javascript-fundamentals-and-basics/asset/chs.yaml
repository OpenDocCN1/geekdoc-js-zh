  | 25.5.7 | 通过 `entries()` 列出项 | 251 |\n| 25.5.8 | 通过 `keys()` 列出键 | 251 |\n| 25.5.9\
  \ | 通过 `from()` 组装对象 | 251 |\n| 25.5.10 | 使用对象的陷阱 | 253 |\n| 25.6 | 标准方法（高级） | 254\
  \ |\n| 25.6.1 | `toString()` | 254 |\n| 25.6.2 | `valueOf()` | 254 |\n| 25.6.3 |\
  \ `assign()` | 254 |\n| 25.7 | 高级主题 | 255 |\n| 25.7.1 | `Object()` | 255 |\n| 25.7.2\
  \ | 冷冻对象 | 255 |\n| 25.7.3 | 属性属性和描述符 | 255 |\n\n![](img/image01393.jpeg)\n\n在书中，JavaScript\
  \ 的面向对象编程（OOP）风格分四步介绍。本章涵盖第一步，下一章涵盖 2-4 步（图 25.1）：\n\n- **单个对象**：作为 JavaScript 基础构建块的对象是如何独立工作的？\n\
  - **原型链**：每个对象都有一个零或多个原型对象组成的链。原型是 JavaScript 的核心继承机制。\n- **类**：JavaScript 的类是对象的工厂。类与其实例之间的关系基于原型继承。\n\
  - **子类化**：子类与其父类之间的关系也基于原型继承。\n\n![](img/image1490.jpeg)\n\n```javascript\nclass\
  \ MyClass {\n  mthd() {}\n  data = 4;\n}\n\nclass SubClass {\n  __proto__ = MyClass;\n\
  \  data = 4;\n  subMthd() {}\n}\n```\n\n![](img/image01391.jpeg)\n\n\n\n\n\n- **字典**：作为字典的对象具有可数量的属性，其键在开发时是不可知的。它们的所有值都具有相同的类型。\n\
  \n这些角色影响了本章对对象的解释方式：\n\n- 首先，我们将探索“作为记录的对象”（objects-as-records）。尽管属性键在底层是字符串或符号，在本章的这部分它们对我们来说将是固定标识符。\n\
  - 随后，我们将探索“作为字典的对象”（objects-as-dictionaries）。注意，`Maps` 通常比对象是更好的字典。然而，我们将遇到的一些操作也对“作为记录的对象”很有用。\n\
  \n## 25.2 作为记录的对象\n\n让我们首先探索对象的“记录”角色。\n\n### 25.2.1 对象字面量：属性\n\n对象字面量是创建“作为记录的对象”的一种方式。它们是\
  \ JavaScript 的一项特性：你可以直接创建对象——不需要类！这是一个示例：\n\n```javascript\nconst jane = {\n  first:\
  \  'Jane',\n  last:  'Doe',  // 可选的尾随逗号\n};\n```\n\n在示例中，我们通过对象字面量创建了一个对象，它以大括号\
  \ `{}` 开始和结束。在内部，我们定义了两个属性（键值对）：\n\n- 第一个属性的键为 `first`，值为 `'Jane'`。\n- 第二个属性的键为\
  \ `last`，值为 `'Doe'`。\n\n我们稍后会看到指定属性键的其他方法，但使用这种指定方式，它们必须遵循 JavaScript 变量名的规则。例如，你可以使用\
  \ `first_name` 作为属性键，但不能使用 `first-name`。不过，允许保留字：\n\n```javascript\nconst obj =\
  \ {\n  if:  true,\n  const: true,\n};\n```\n\n为了检查各种操作对对象的影响，我们本章的这部分偶尔使用 `Object.keys()`。它列出了属性键：\n\
  \n```javascript\n// 23625 单个对象\nObject.keys({a:1, b:2})\n[ 'a', 'b' ]\n```\n\n###\
  \ 25.2.2 对象字面量：属性值简写\n\n当属性的值通过变量名定义，且该名称与键相同时，你可以省略键。\n\n```javascript\nfunction\
  \ createPoint(x, y) {\n  return {x, y};\n}\n\nassert.deepEqual(\n  createPoint(9,\
  \  2),\n  { x: 9, y: 2 }\n);\n```\n\n### 25.2.3 获取属性\n\n这是你获取（读取）属性的方式（A 行）：\n\n\
  ```javascript\nconst jane = {\n  first:  'Jane',\n  last:  'Doe',\n};\n// 获取属性 .first\n\
  assert.equal(jane.first,  'Jane');  // (A)\n```\n\n获取一个未知属性会产生 `undefined`：\n\n\
  ```javascript\nassert.equal(jane.unknownProperty, undefined);\n```\n\n### 25.2.4\
  \ 设置属性\n\n这是你设置（写入）属性的方式：\n\n```javascript\nconst obj = {\n  prop:  1,\n};\nassert.equal(obj.prop,\
  \  1);\nobj.prop =  2;  // (A)\nassert.equal(obj.prop, 2);\n```\n\n我们刚刚通过设置更改了现有的属性。如果我们设置一个未知属性，就会创建一个新条目：\n\
  \n```javascript\nconst obj = {};  // 空对象\nassert.deepEqual(Object.keys(obj), []);\n\
  obj.unknownProperty =  'abc';\n// | 25.2 作为记录的对象 | 237 |\nassert.deepEqual(Object.keys(obj),\
  \ ['unknownProperty']);\n```\n\n### 25.2.5 对象字面量：方法\n\n下面的代码了如何通过对象字面量创建方法 `.says()`：\n\
  \n```javascript\nconst jane = {\n  first:  'Jane',  // 数据属性\n  says(text) { // 方法\n\
  \    return `${this.first}  says “${text}”`;  // (A)\n  }, // 逗号作为分隔符（结尾可选）\n};\n\
  assert.equal(jane.says('hello'), Jane says “hello”');\n```\n\n在方法调用 `jane.says('hello')`\
  \ 期间，`jane` 被方法调用的接收者并赋值给特殊变量 `this`。这使得方法 `.says()` 能够访问 A 行中的兄弟属性 `.first`。\n\n\
  ### 25.2.6 对象字面量：访问器\n\nJavaScript 中有两种访问器：\n\n- **getter**（获取器）是一个类似于方法的实体，通过获取属性时被调用。\n\
  - **setter**（设置器）是一个类似于方法的实体，通过设置属性时被调用。\n\n#### 25.2.6.1 Getters\n\ngetter 是通过在方法定义前加上修饰符\
  \ `get` 来创建的：\n\n```javascript\nconst jane = {\n  first:  'Jane',\n  last:  'Doe',\n\
  \  get full() {\n    return `${this.first} ${this.last}`;\n  },\n};\nassert.equal(jane.full,\
  \  'Jane Doe');\njane.first =  'John';\nassert.equal(jane.full,  'John Doe');\n\
  ```\n\n#### 25.2.6.2 Setters\n\nsetter 是通过在方法定义前加上修饰符 `set` 来创建的：\n\n```javascript\n\
  const jane = {\n  first:  'Jane',\n  last:  'Doe',\n  set full(fullName) {\n   \
  \ const parts =  fullName.split(' ');\n    // 23825 单个对象\n    this.first  = parts[0];\n\
  \    this.last  = parts[1];\n  },\n};\njane.full =  'Richard Roe';\nassert.equal(jane.first,\
  \  'Richard');\nassert.equal(jane.last,  'Roe');\n```\n\n![](img/image01418.jpeg)![](img/image01451.jpeg)\n\
  ![](img/image01416.jpeg) 练习：通过对象字面量创建对象\n`exercises/single-objects/color_point_object_test.mjs`\n\
  \n## 25.3 展开到对象字面量 (...)\n\n在函数调用内部，展开 `(...)` 将可迭代对象的迭代值转换为 `arguments`（参数）。\n\n\
  在对象字面量内部，展开属性会将另一个对象的属性添加到当前对象中：\n\n- `const obj = {foo: 1, bar: 2};`\n- `{...obj,\
  \ baz: 3}` -> `{ foo: 1, bar: 2, baz: 3 }`\n\n如果属性键发生冲突，最后提到的属性“胜出”：\n\n- `const\
  \ obj = {foo: 1, bar: 2, baz: 3};`\n- `{...obj, foo: true}` -> `{ foo: true, bar:\
  \ 2, baz: 3 }`\n- `{foo: true, ...obj}` -> `{ foo: 1, bar: 2, baz: 3 }`\n\n### 25.3.1\
  \ 展开的用例：复制对象\n\n你可以使用展开创建对象 `original` 的拷贝：\n\n```javascript\nconst copy = {...original};\n\
  ```\n\n**注意——拷贝是浅拷贝的**：`copy` 是一个新对象，包含了 `original` 所有属性（键值对）的重复项。但如果属性值是对象，那么这些对象本身不会被复制；它们在\
  \ `original` 和 `copy` 之间共享。让我们看一个例子。\n\n```javascript\nconst original = {  a:  1,\
  \  b: {foo: true} }; \nconst copy = {...original};\n```\n\n`copy` 的第一层确实是拷贝：如果你更改该层级的任何属性，都不会影响原始对象：\n\
  \n```javascript\ncopy.a =  2;\n// 25.3 展开到对象字面量 (...)239\nassert.deepEqual(original,\
  \ { a: 1, b: {foo: true} }); // 无变化\n```\n\n然而，深层级并没有拷贝。例如，`.b` 的值在 `original` 和\
  \ `copy` 之间共享。在拷贝中更改 `.b` 也会更改原始对象中的 `.b`。\n\n```javascript\ncopy.b.foo =  false;\n\
  assert.deepEqual(original, { a: 1, b: {foo: false} });\n```\n\n![](img/image01438.jpeg)![](img/image01428.jpeg)\n\
  ![](img/image01412.jpeg) JavaScript 没有内置深拷贝支持\n\n对象的深拷贝（拷贝所有层级）在通用范围内是著名的难以实现。因此，JavaScript\
  \ 目前没有内置此类操作（目前）。如果你需要这种操作，就必须自己实现它。\n\n### 25.3.2 展开的用例：缺失属性的默认值\n\n如果你代码的输入之一是一个带有数据的对象，你可以通过指定默认值来使属性变为可选。实现这一点的一种技术是使用一个包含默认值的对象。在下面的示例中，该对象是\
  \ `DEFAULTS`：\n\n```javascript\nconst DEFAULTS = {foo:  'a',  bar:  'b'};\nconst\
  \ providedData = {foo:  1};\nconst allData = {...DEFAULTS, ...providedData};  \n\
  assert.deepEqual(allData, {foo: 1, bar: 'b'});\n```\n\n结果对象 `allData` 通过拷贝 `DEFAULTS`\
  \ 并用 `providedData` 覆盖其属性创建。\n\n但你不需要对象来指定默认值，你也可以在对象字面量内部单独指定它们：\n\n```javascript\n\
  const providedData = {foo:  1};\nconst allData = {foo:  'a',  bar:  'b', ...providedData};\n\
  assert.deepEqual(allData, {foo: 1, bar: 'b'});\n```\n\n### 25.3.3 展开的用例：非破坏性更改属性\n\
  \n到目前，我们遇到了一种更改对象属性 `.foo` 的方式：设置它（A 行）并对象。也就是说，这种更改属性的方法是破坏性的。\n\n```javascript\n\
  const obj = {foo:  'a',  bar:  'b'};\nobj.foo =  1;  // (A)\nassert.deepEqual(obj,\
  \ {foo: 1, bar: 'b'});\n```\n\n通过展开，我们可以非破坏地更改 `.foo`——我们创建一个 `obj` 的拷贝，其中 `.foo`\
  \ 具有不同的值：\n\n```javascript\n// 24025 单个对象\nconst obj = {foo:  'a',  bar:  'b'};\n\
  const updatedObj = {...obj,  foo:  1};\n```\n\n\n\n\n\n```javascript\nassert.deepEqual(updatedObj,\
  \ {foo: 1, bar: 'b'});\n```\n\n![](img/image01418.jpeg)![](img/image01451.jpeg)\n\
  \n![](img/image01416.jpeg) 练习：通过展开非破坏性地更新属性（固定键）\n\n`exercises/single-objects/update_name_test.mjs`\n\
  \n## 25.4 方法\n\n### 25.4.1 方法是值为函数的属性\n\n让我们回顾一下之前用于介绍方法的示例：\n\n```javascript\n\
  const jane = {\n  first: 'Jane',\n  says(text) {\n    return `${this.first} says\
  \ “${text}”`;\n  },\n};\n```\n\n有些令人惊讶的是，方法也是函数：\n\n```javascript\nassert.equal(typeof\
  \ jane.says, 'function');\n```\n\n这是为什么呢？记住，在关于可调用值的章节中，我们学习过普通函数扮演着多种角色。方法就是其中这些角色之一。因此，在底层，`jane`\
  \ 的结构大致如下。\n\n```javascript\nconst jane = {\n  first: 'Jane',\n  says: function\
  \ (text) {\n    return `${this.first} says “${text}”`;\n  },\n};\n```\n\n### 25.4.2\
  \ .call(): 通过参数指定 this\n\n记住每个函数 `someFunc` 也是一个对象，因此它也拥有方法。其中一个方法就是 `.call()` –\
  \ 它允许你在调用函数的同时通过参数指定 `this`：\n\n```javascript\nsomeFunc.call(thisValue, arg1, arg2,\
  \ arg3);\n```\n\n#### 25.4.2.1 方法与 .call()\n\n如果你进行方法调用，`this` 是一个隐式参数，通过调用的接收者（receiver）来填充：\n\
  \n```javascript\nconst obj = {\n  method(x) {\n    assert.equal(this, obj); // 隐式参数\n\
  \    assert.equal(x, 'a');\n  },\n};\n\nobj.method('a'); // 接收者是 `obj`\n```\n\n\
  25.4 方法 | 241\n\n最后一行的方法调用如下所示设置 `this`：\n\n```javascript\nobj.method.call(obj,\
  \ 'a');\n```\n\n顺带提一下，这意味着实际上有两个不同的点运算符：\n\n- 一个用于访问属性：`obj.prop`\n- 一个用于进行方法调用：`obj.prop()`\n\
  \n它们的区别在于，(2) 不仅仅是 (1) 加上函数调用运算符 `()`。相反，(2) 额外为 `this` 指定了一个值。\n\n#### 25.4.2.2\
  \ 函数与 .call()\n\n如果你调用一个普通函数，它的隐式参数 `this` 也会被提供 —— 它被隐式设置为 `undefined`：\n\n```javascript\n\
  function func(x) {\n  assert.equal(this, undefined); // 隐式参数\n  assert.equal(x,\
  \ 'a');\n}\n\nfunc('a');\n```\n\n最后行的函数调用如下所示设置 `this`：\n\n```javascript\nfunc.call(undefined,\
  \ 'a');\n```\n\n在函数调用期间将 `this` 设置为 `undefined`，表明这是一个仅在方法调用期间才需要的特性。\n\n接下来，我们将检查使用\
  \ `this` 的陷阱。在此之前，我们还需要另一个工具：函数的 `.bind()` 方法。\n\n### 25.4.3 .bind(): 预填充函数的 this\
  \ 和参数\n\n`.bind()` 是函数对象的另一个方法。该方法的调用方式如下：\n\n```javascript\nconst boundFunc = someFunc.bind(thisValue,\
  \ arg1, arg2);\n```\n\n`.bind()` 返回一个新的函数 `boundFunc()`。调用该函数将触发 `someFunc()`，其\
  \ `this` 被设置为 `thisValue`，并带有这些参数：`arg1`、`arg2`，随后是 `boundFunc()` 的参数。\n\n也就是说，以下两个函数调用是等价的：\n\
  \n```javascript\nboundFunc('a', 'b')\nsomeFunc.call(thisValue, arg1, arg2, 'a',\
  \ 'b')\n```\n\n24225 单对象\n\n#### 25.4.3.1 .bind() 的替代方案\n\n另一种预填充 `this` 和参数的方法是通过箭头函数：\n\
  \n```javascript\nconst boundFunc2 = (...args) =>\n  someFunc.call(thisValue, arg1,\
  \ arg2, ...args);\n```\n\n#### 25.4.3.2 .bind() 的实现\n\n考虑到上一节，`.bind()` 可以实现如下的真实函数：\n\
  \n```javascript\nfunction bind(func, thisValue, ...boundArgs) {\n  return (...args)\
  \ =>\n    func.call(thisValue, ...boundArgs, ...args);\n}\n```\n\n#### 25.4.3.3\
  \ 示例：绑定一个真实函数\n\n对真实函数使用 `.bind()` 有些不直观，因为你必须为 `this` 提供一个值。考虑到它在函数调用期间是 `undefined`，它通常被设置为\
  \ `undefined` 或 `null`。\n\n在下面的示例中，我们创建了 `add8()`，这是一个有一个参数的函数，通过将 `add()` 的第一个参数绑定到\
  \ 8。\n\n```javascript\nfunction add(x, y) {\n  return x + y;\n}\n\nconst add8 =\
  \ add.bind(undefined, 8);\nassert.equal(add8(1), 9);\n```\n\n#### 25.4.3.4 示例：绑定方法\n\
  \n在以下代码中，我们将方法 `.says()` 转换为独立函数 `func()`：\n\n```javascript\nconst jane = {\n  first:\
  \ 'Jane',\n  says(text) {\n    return `${this.first} says “${text}”`; // (A)\n \
  \ },\n};\n\nconst func = jane.says.bind(jane, 'hello');\nassert.equal(func(), 'Jane\
  \ says “hello”');\n```\n\n通过 `.bind()` 将 `this` 设置为 `jane` 在这里至关重要。否则，`func()` 将无法正常工作，因为\
  \ A 行使用了 `this`。\n\n25.4 方法 | 243\n\n### 25.4.4 this 陷阱：提取方法\n\n我们现在对函数和方法有了相当多的了解，准备好查看涉及方法和\
  \ `this` 最大的陷阱：如果不小心，调用从对象中提取出的方法可能会失败。\n\n在下面的示例中，当我们提取方法 `jane.says()`，将其存储在变量\
  \ `func` 中并调用 `func()` 时，我们失败了。\n\n```javascript\nconst jane = {\n  first: 'Jane',\n\
  \  says(text) {\n    return `${this.first} says “${text}”`;\n  },\n};\n\nconst func\
  \ = jane.says; // 提取方法\nassert.throws(\n  () => func('hello'), // (A)\n  {\n   \
  \ name: 'TypeError',\n    message: \"Cannot read property 'first' of undefined\"\
  ,\n  }\n);\n```\n\nA 行的函数调用等同于：\n\n```javascript\nassert.throws(\n  () => jane.says.call(undefined,\
  \ 'hello'), // `this` 是 undefined!\n  {\n    name: 'TypeError',\n    message: \"\
  Cannot read property 'first' of undefined\",\n  }\n);\n```\n\n那么我们如何修复这个问题？我们需要使用\
  \ `.bind()` 来提取方法 `.says()`：\n\n```javascript\nconst func2 = jane.says.bind(jane);\n\
  assert.equal(func2('hello'), 'Jane says “hello”');\n```\n\n`.bind()` 确保在调用 `func()`\
  \ 时 `this` 总是 `jane`。\n\n你也可以使用箭头函数来提取方法：\n\n```javascript\nconst func3 = text =>\
  \ jane.says(text);\nassert.equal(func3('hello'), 'Jane says “hello”');\n```\n\n\
  #### 25.4.4.1 示例：提取方法\n\n以下是在实际 Web 开发中可能会看到的代码的简化版本：\n\n```javascript\nclass ClickHandler\
  \ {\n  constructor(id, elem) {\n    this.id = id;\n    elem.addEventListener('click',\
  \ this.handleClick); // (A)\n  }\n  handleClick(event) {\n    alert('Clicked ' +\
  \ this.id);\n  }\n}\n```\n\n24425 单对象\n\n在 A 行中，我们没有正确提取方法 `.handleClick()`。相反，我们应该这样做：\n\
  \n```javascript\nelem.addEventListener('click', this.handleClick.bind(this));\n\
  ```\n\n![](img/image01418.jpeg)![](img/image01400.jpeg)\n\n![](img/image01416.jpeg)\
  \ 练习：提取方法\n\n`exercises/single-objects/method_extraction_exrc.mjs`\n\n### 25.4.5\
  \ this 陷阱：意外遮蔽 this\n\n![](img/image1493.jpeg)![](img/image1494.jpeg)\n\n![](img/image1427.jpeg)\
  \ 意外遮蔽 `this` 仅是普通函数的问题。箭头函数不会遮蔽 `this`。\n\n考虑以下问题：当你在普通函数内部时，无法访问周围作用域的 `this`，因为普通函数有自己的\
  \ `this`。换句话说：内部作用域的变量隐藏了外部作用域的变量。这被称为遮蔽（shadowing）。以下代码是一个示例：\n\n```javascript\n\
  const prefixer = {\n  prefix: '==> ',\n  prefixStringArray(stringArray) {\n    return\
  \ stringArray.map(\n      function (x) {\n        return this.prefix + x; // (A)\n\
  \      }\n    );\n  },\n};\n\nassert.throws(\n  () => prefixer.prefixStringArray(['a',\
  \ 'b']),\n  /^TypeError: Cannot read property 'prefix' of undefined$/\n);\n```\n\
  \n在 A 行中，我们想要访问 `.prefixStringArray()` 的 `this`。但我们不能，因为周围的普通函数有自己的 `this`，屏蔽（阻止访问）方法的\
  \ `this`。前者 `this` 的值为 `undefined` —— 由于回调函数是被函数调用的。这解释了错误信息。\n\n解决这个问题最简单的方法是通过箭头函数，因为它没有自己的\
  \ `this`，因此不会遮蔽任何东西：\n\n```javascript\nconst prefixer = {\n  prefix: '==> ',\n \
  \ prefixStringArray(stringArray) {\n    return stringArray.map(\n      x => {\n\
  \        return this.prefix + x;\n      }\n    );\n  },\n};\n\nassert.deepEqual(\n\
  \  prefixer.prefixStringArray(['a', 'b']),\n  ['==> a', '==> b']\n);\n```\n\n25.4\
  \ 方法 | 245\n\n\n\n\n我们也可以将此存储在不同的变量中（行 A），这样它就不会被遮蔽（shadowed）：\n\n```javascript\n\
  prefixStringArray(stringArray) {\n  const that = this;  // (A)\n  return stringArray.map(\n\
  \    function (x) {\n      return that.prefix  + x;\n    }\n  );\n}\n```\n\n另一种选项是通过\
