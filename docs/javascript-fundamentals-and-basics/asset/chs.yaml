  \ 26.5 常见问题：对象 (277)\n\n---\n\n## JavaScript 基础\n\n### 什么是 JavaScript？\n- 设计用于为\
  \ HTML 页面添加交互性\n- 是一种脚本语言\n- 是一种轻量级脚本语言\n- 是一种解释型语言（意味着无需编译）\n\n### JavaScript 可以做什么？\n\
  - 为设计师提供编程工具\n- 可以在 HTML 页面中放入动态文本\n- 可以对事件做出响应\n- 可用于创建 cookie\n\n### 如何将 JavaScript\
  \ 引入 HTML？\n- 使用 `<script>` 标签（也可以使用 type 属性）\n```html\n<script type=\"text/javascript\"\
  ></script>\n```\n\n### 脚本放在哪里？\n- 脚本可以放在 `<head>` 或 `<body>` 部分\n- 惯例是将其放在 `<head>`\
  \ 部分\n\n### 引用外部 JavaScript 文件\n- 可以使用 `src` 属性本地或远程提供脚本\n```html\n<script type=\"\
  text/javascript\" src=\"omesite/myOwnJavaScript.js\"></script>\n<script type=\"\
  text/javascript\" src=\"Subdirectory/myOwn2ndJavaScript.js\"></script>\n```\n\n\
  ## JavaScript 语言\n\n### 变量\n- 你可以使用 `var` 语句来创建变量\n```javascript\nvar strname =\
  \ some value\nstrname = some value\n```\n- 当你在函数内部声明变量时，该变量只能在该函数内部访问\n- 如果你在函数外部声明变量，页面上的所有函数都可以访问它\n\
  - 这些变量的生命周期从声明时开始，到页面关闭时结束\n\n### 弹出框\n- **警告框（Alert box）**：用户必须点击“OK”才能继续\n```javascript\n\
  alert(\"sometext\")\n```\n- **确认框（Confirm box）**：用户必须点击“OK”或“Cancel”才能继续\n```javascript\n\
  confirm(\"sometext\")\n```\n- **提示框（Prompt box）**：用户在输入值后必须点击“OK”或“Cancel”才能继续\n\
  ```javascript\nprompt(\"sometext\",\"defaultvalue\")\n```\n\n### 控制\n- 条件语句：`if`、`if..else`、`switch`\n\
  - 循环：`for` 循环、`while` 循环\n- 错误处理：`try...catch`、`throw`\n\n## 函数（行为类似于 Java 方法）\n\
  \n- JavaScript 函数包含某些代码，这些代码只有在事件发生或通过调用该函数时才会执行\n- 为了防止浏览器在页面加载时立即执行脚本，你可以将脚本写成一个函数\n\
  - 你可以在页面内的任何地方调用函数（如果函数嵌入在外部 .js 文件中，甚至可以在其他页面调用）。\n- 函数可以定义在 `<head>` 或 `<body>`\
  \ 部分。\n\n### 示例：JavaScript 函数\n```html\n<html>\n<head>\n<script type=\"text/javascript\"\
  >\n// 如果下面的 alert(\"Hello world!!\") 没有被写在函数内，\n// 它将在页面一加载时立即执行。 \nfunction displaymessage()\
  \ {\n  alert(\"Hello World!\")\n}\n</script>\n</head>\n<body>\n<form>\n  <input\
  \ type=\"button\" value=\"Click me!\" onclick=\"displaymessage()\">\n</form>\n</body>\n\
  </html>\n```\n\n\n\n\n\n## JavaScript 事件\n\n## 事件与事件处理器\n- 网页上的每个元素都具有某些事件，这些事件可以触发事件处理器的调用\n\
  - 属性被插入 HTML 标签中以定义事件和事件处理器\n- 事件示例：\n    * 鼠标点击\n    * 网页或图像加载\n    * 鼠标在网页上的热点上移动\n\
  \    * 选择 HTML 表单中的输入框\n    * 提交 HTML 表单\n\n### 常见事件\n- `onabort` - 图像加载被中断\n- `onblur`\
  \ - 元素失去焦点\n- `onchange` - 字段内容发生变化\n- `onclick` - 点击对象\n- `ondblclick` - 鼠标双击对象\n\
  - `onerror` - 加载文档或图像时发生错误\n- `onfocus` - 元素获得焦点\n- `onkeydown` - 键盘按键被按下\n- `onkeypress`\
  \ - 键盘按键被按下或按住\n- `onkeyup` - 键盘按键释放\n- `onload` - 页面或图像加载完成\n- `onmousedown` -\
  \ 鼠标按钮被按下\n- `onmousemove` - 鼠标移动\n- `onmouseout` - 鼠标移出元素\n- `onmouseover` - 鼠标移动到元素上\n\
  - `onmouseup` - 鼠标按钮被释放\n- `onreset` - 重置按钮被点击\n- `onresize` - 窗口或框架的大小被调整\n- `onselect`\
  \ - 文本被选中\n- `onsubmit` - 提交按钮被点击\n- `onunload` - 用户离开页面\n\n## onload & onUnload\
  \ 事件\n- 当用户进入或离开页面时会触发 `onload` 和 `onUnload` 事件。\n- `onload` 事件通常用于检查访问者的浏览器类型和版本，并根据这些信息加载相应版本的网页。\n\
  - `onload` 和 `onUnload` 事件也经常用于处理用户进入或离开页面时应设置的 cookie。\n\n## onFocus, onBlur and\
  \ onChange\n- `onFocus`、`onBlur` 和 `onChange` 事件通常与表单字段验证结合使用。\n- 示例：当用户更改字段内容时，都会调用\
  \ `checkEmail()` 函数：\n```html\n<input type=\"text\" size=\"30\" id=\"email\" onchange=\"\
  checkEmail()\">\n```\n\n## 示例与演示: onblur\n```html\n<<html>\n<head>\n<script type=\"\
  text/javascript\">\nfunction upperCase() {\n  var x=document.getElementById(\"fname\"\
  ).value\n}\ndocument.getElementById(\"fname\").value=x.toUpperCase()\n</script>\n\
  </head>\n<body>\nEnter your name:\n<input type=\"text\" id=\"fname\" onblur=\"upperCase()\"\
  >\n</body>\n</html>\n```\n\n## onSubmit\n- `onSubmit` 事件用于在提交表单之前验证所有表单字段。\n- 示例：当用户点击表单中的提交按钮时，将调用\
  \ `checkForm()` 函数。如果字段值不被接受，则应取消提交。`checkForm()` 函数返回 `true` 或 `false`。如果返回 `true`，则表单将提交，否则取消提交：\n\
  ```html\n<form method=\"post\" action=\"xxx.html\" onsubmit=\"return checkForm()\"\
  >\n```\n\n## 示例与演示: onSubmit\n```html\n<html\n<head>\n<script type=\"text/javascript\"\
  >\nfunction validate() {\n} // 根据验证逻辑返回 true 或 false\n</script>\n</head>\n<body>\n\
  <form action=\"tryjs_submitpage.htm\" onsubmit=\"return validate()\">\nName (max\
  \ 10 chararcters): <input type=\"text\" id=\"fname\" size=\"20\"><br />\nAge (from\
  \ 1 to 100): <input type=\"text\" id=\"age\" size=\"20\"><br />\nE-mail: <input\
  \ type=\"text\" id=\"email\" size=\"20\"><br /> <br />\n<input type=\"submit\" value=\"\
  Submit\">\n</form>\n</body>\n</html>\n```\n\n## onMouseOver and onMouseOut\n- `onMouseOver`\
  \ 和 `onMouseOut` 通常用于创建“动画”按钮。\n- 下面是一个 `onMouseOver` 事件的示例。当检测到 `onMouseOver` 事件时，会弹出警报框：\n\
  ```html\n<a href=\"http://www.w3schools.com\" onmouseover=\"alert('An onMouseOver\
  \ event');return false\"> <img src=\"w3schools.gif\" width=\"100\" height=\"30\"\
  > </a>\n```\n\n## JavaScript 对象\n\n## JavaScript 对象\n- JavaScript 是一种面向对象编程（OOP）语言。\n\
  - JavaScript 对象具有属性和方法。\n- 示例：`String` JavaScript 对象具有 `length` 属性和 `toUpperCase()`\
  \ 方法：\n```javascript\nvar txt=\"Hello World!\"\ndocument.write(txt.length)\ndocument.write(txt.toUpperCase())\n\
  ```\n\n## JavaScript 内置对象\n- `String`\n- `Date`\n- `Array`\n- `Boolean`\n- `Math`\n\
  \n## JavaScript 对象对比 Java 对象\n- 相似点：\n    * 都具有属性和方法\n- 不同点：\n    * JavaScript 对象可以是动态类型，而\
  \ Java 对象是静态类型。\n    * 在 JavaScript 中，属性和方法是动态添加的。\n\n# 创建 JavaScript 对象的 3 种方法\n\
  \n## 创建自定义 JavaScript 对象\n有 3 种方法：\n1. 使用 `Object` 类的内置构造函数创建对象的直接实例。\n2. 先创建一个模板（构造函数），然后从模板创建对象实例。\n\
  3. 使用哈希字面量（Hash Literal）创建对象实例。\n\n### 选项 1：创建 JavaScript 对象的直接实例\n- 通过调用 `Object`\
  \ 类的内置构造函数：\n```javascript\npersonObj=new Object(); // 初始化为空，没有任何属性或方法\n// 为其添加属性\n\
  personObj.firstname=\"John\";\npersonObj.age=50;\n// 为 personObj 中添加一个匿名函数\npersonObj.tellYourage=function(){\n\
  \  alert(\"This age is ” + this.age);\n}\n// 你可以这样调用 tellYourage 函数\npersonObj.tellYourage();\n\
  ```\n- 添加一个预定义的函数：\n```javascript\nfunction tellYourage(){\n  alert(“The age is”\
  \ + this.age);\n}\npersonObj.tellYourage=tellYourage;\n```\n- 注意，以下两行代码执行的是完全不同的操作：\n\
  ```javascript\n// 使用函数作为属性值\npersonObj.tellYourage=tellYourage;\n// 使用函数的返回值设置属性值\
  \ \npersonObj.tellYourage=tellYourage();\n```\n\n### 选项 2：创建 JavaScript 对象的模板\n\
  - 模板以函数的形式定义 JavaScript 对象的结构。\n- 你可以将模板看作构造函数：\n```javascript\nfunction Person(firstname,lastname,age,eyecolor)\
  \ { \n  this.firstname=firstname;\n  this.lastname=lastname;\n  this.age=age;\n\
  \  this.tellYourage=function(){\n    alert(“This age is ” + this.age);\n  }\n}\n\
  ```\n- 一旦有了模板，你就可以创建对象的新实例：\n```javascript\nmyFather=new Person(\"John\",\"Doe\"\
  ,50,\"blue\"); \nmyMother=new Person(\"Sally\",\"Rally\",48,\"green\");\n```\n-\
  \ 你为新对象添加新的属性和函数：\n```javascript\nmyFather.newField = “some data”; \nmyFather.myfunction\
  \ = function() { alert(this[\"fullName\"] + ” is ” + this.age); }\n```\n\n### 选项\
  \ 3：作为哈希字面量创建 JavaScript 对象\n- 创建 `personObj` JavaScript 对象：\n```javascript\nvar\
  \ personObj = {\n  firstname: \"John\",\n  lastname: \"Doe\",\n  age: 50,\n  tellYourage:\
  \ function () {\n    alert(“This age is ” + this.age);\n  },\n  tellSomething: function(something)\
  \ {\n    alert(something);\n  }\n};\npersonObj.tellYourage();\npersonObj.tellSomething(“Life\
  \ is good!”);\n```\n\n## JavaScript 对象：哈希（关联数组）\n- JavaScript 对象本质上是一个具有字段和方法的关联数组（哈希），这些内容通过名称键值。\n\
  - 以下两行代码在语义上是等等的：\n```javascript\nmyObject.myfield = “something”;\nmyObject['myfield']\
  \ = “something”;\n```\n\n## JavaScript 对象：类、对象、继承\n- JavaScript 拥有对象和类的概念（类似于 Java），但没有内置的继承概念（与\
  \ Java 不同）。\n\n\n\n\n\n> 每一个 JavaScript 对象实际上都是同一个基类的实例，该类能够在运行时将成员字段和函数绑定到它本身。\n\
  \n# JavaScript 对象：原型 (prototype)\n\n- `prototype`（原型）是每个 JavaScript 对象的属性。\n- 函数和属性可以与构造函数的属性关联。\n\
  - 当使用 `new` 关键字调用函数时，该函数 `prototype` 上的所有属性和方法都会附加到生成的对象上。\n\n```javascript\n//\
  \ Constructor of the MyObject function\nMyObject(name, size){\n  this.name=name;\n\
  \  this.size=size;\n}\n\n// Add a function to the prototype\nMyObject.prototype.tellSize=function{\n\
  \  alert(“size of “ + this.name+” is “ + this.size);\n}\n\n// Create an instance\
  \ of the object. The new object has tellSize() method.\nvar myObj=new MyObject(“Sang”,\
  \ “30 inches”);\nmyObj.tellSize();\n```\n\n## JavaScript 对象：再次谈论函数\n\n函数是一类 JavaScript\
  \ 对象\n\n- 函数有点像 Java 方法。\n> 它们有参数和返回值。\n- 函数是 JavaScript 中的一等对象（与 Java 不同）。\n> 可以被视为\
  \ `Object` 的后代。\n> 可以做普通 JavaScript 对象能做的一切事情，例如按名称存储属性。\n- 函数对象可以其他函数对象作为方法。\n\n\
  ## JavaScript 对象：上下文 (Context)\n\n函数可以接受变长参数\n\n- 你可以调用 `myfunction()` 或 `myfunction(20)`。\n\
  ```javascript\nfunction myfunction(value){\n  if (value){\n    this.area=value;\n\
  \  }\n  return this.area;\n}\n```\n\n## HTML DOM 对象\n\nHTML DOM\n\n- `HTML DOM`\
  \ 为 HTML 定义了一组标准对象以及访问操作 HTML 文档的标准方法。\n- 所有 HTML 元素及其包含的文本和属性都可以通过 `DOM` 访问。\n\
  > 内容可以被修改或删除，也可以创建新的元素。\n- `HTML DOM` 是独立平台和语言的。\n> 可以被任何编程语言使用，如 `Java`、`JavaScript`\
  \ 和 `VBScript`。\n\n## HTML DOM 对象\n\n- `Anchor` 对象\n- `Document` 对象\n- `Event` 对象\n\
  - `Form` 和 `Form Input` 对象\n- `Frame`, `Frameset` 和 `IFrame` 对象\n- `Image` 对象\n\
  - `Location` 对象\n- `Navigator` 对象\n- `Option` 和 `Select` 对象\n- `Screen` 对象\n- `Table`、`TableHeader`、`TableRow`、`TableData`\
  \ 对象\n- `Window` 对象\n\n# Document 对象\n\n## Document 对象：向输出写入文本\n\n```html\n<html>\n\
  <body>\n  <script type=\"text/javascript\">\n    document.write(\"Hello World!\"\
  )\n  </script>\n</body>\n</html>\n```\n\n## Document 对象：向输出写入带格式的文本\n\n```html\n\
  <html>\n<body>\n  <script type=\"text/javascript\">\n    document.write(\"<h1>Hello\
  \ World!</h1>\")\n  </script>\n</body>\n</html>\n```\n\n## Document 对象：使用 getElementById()\n\
  \n```html\n<html>\n<head>\n  <script type=\"text/javascript\">\n    function getElement()\
  \ {\n      var x=document.getElementById(\"myHeader\")\n    }\n    alert(\"I am\
  \ a \" + x.tagName + \" element\")\n  </script>\n</head>\n<body>\n  <h1 id=\"myHeader\"\
  \ onclick=\"getElement()\">Click to see what element I am!</h1> \n</body>\n</html>\n\
  ```\n\n## Document 对象：使用 getElementsByName()\n\n```html\n<html>\n<head>\n  <script\
  \ type=\"text/javascript\">\n    function getElements() {\n      var x=document.getElementsByName(\"\
  myInput\")\n    }\n    alert(x.length + \" elements!\")\n  </script>\n</head>\n\
  <body>\n  <input name=\"myInput\" type=\"text\" size=\"20\"><br />\n  <input name=\"\
  myInput\" type=\"text\" size=\"20\"><br />\n  <input name=\"myInput\" type=\"text\"\
  \ size=\"20\"><br />\n  <br />\n  <input type=\"button\" onclick=\"getElements()\"\
  \ value=\"How many elements named 'myInput'?\">\n</body>\n</html>\n```\n\n## Document\
  \ 对象：返回文档中第一个锚点（anchor）的 innerHTML\n\n```html\n<html>\n<body>\n  <a name=\"first\"\
  >First anchor</a><br />\n  <a name=\"second\">Second anchor</a><br /> <a name=\"\
  third\">Third anchor</a><br /> <br />\n  InnerHTML of the first anchor in this document:\n\
  \  <script type=\"text/javascript\">\n    document.write(document.anchors[0].innerHTML)\n\
  \  </script>\n</body>\n</html>\n```\n\n## Document 对象：访问集合中的某项\n\n```html\n<html>\n\
  <body>\n  <form id=\"Form1\" name=\"Form1\">\n    Your name: <input type=\"text\"\
  >\n  </form>\n  <form id=\"Form2\" name=\"Form2\">\n    Your car: <input type=\"\
  text\">\n  </form>\n  <p>要访问集合中的某项，你可以使用该项的数字或名称：</p>\n  <script type=\"text/javascript\"\
  >\n    document.write(\"<p>The first form's name is: \" + document.forms[0].name\
  \ + \"</p>\")\n    document.write(\"<p>The first form's name is: \" + document.getElementById(\"\
  Form1\").name + \"</p>\")\n  </script>\n</body>\n</html>\n```\n\n## 事件对象 (Event\
  \ Object)\n\n## 事件对象：光标的坐标是什么？\n\n```html\n<html>\n<head>\n  <script type=\"text/javascript\"\
  >\n    function show_coords(event) {\n      x=event.clientX\n      y=event.clientY\n\
  \      alert(\"X coords: \" + x + \", Y coords: \" + y)\n    }\n  </script>\n</head>\n\
  <body onmousedown=\"show_coords(event)\">\n  <p>在文档中点击。弹出框将显示光标的 x 和 y 坐标。</p>\n\
  </body>\n</html>\n```\n\n## 事件对象：按下按键的 Unicode 是什么？\n\n```html\n<html>\n<head>\n\
  \  <script type=\"text/javascript\">\n    function whichButton(event) {\n    }\n\
  \    alert(event.keyCode)\n  </script>\n</head>\n<body onkeyup=\"whichButton(event)\"\
  >\n  <p><b>注意：</b>在尝试此示例时，确保右帧拥有焦点！</p>\n  <p>在键盘上按下一个键。弹出框将显示按下按键的 Unicode。</p>\n\
  </body>\n</html>\n```\n\n## 事件对象：点击了哪个元素？\n\n```html\n<html>\n<head>\n  <script\
  \ type=\"text/javascript\">\n    function whichElement(e) {\n      var targ\n  \
  \    if (!e) var e = window.event\n      if (e.target) targ = e.target\n      else\
  \ if (e.srcElement) targ = e.srcElement\n      if (targ.nodeType == 3) // 修复 Safari\
  \ Bug\n        targ = targ.parentNode\n      var tname\n      tname=targ.tagName\n\
  \    }\n    alert(\"You clicked on a \" + tname + \" element.\")\n  </script>\n\
  </head>\n<body onmousedown=\"whichElement(event)\">\n  <p>在文档中某处点击。弹出框将显示你点击的元素的标签名。</p>\n\
  \  <h3>This is a header</h3>\n  <p>This is a paragraph</p>\n  <img border=\"0\"\
  \ src=\"ball16.gif\" width=\"29\" height=\"28\" alt=\"Ball\">\n</body>\n</html>\n\
  ```\n\n## 事件对象：发生了哪种事件？\n\n```html\n<html>\n<head>\n  <script type=\"text/javascript\"\
  >\n    function whichType(event) {\n    }\n    alert(event.type)\n  </script>\n\
  </head>\n<body onmousedown=\"whichType(event)\">\n  <p>在文档上点击。弹出框将显示发生了哪种类型的事件。</p>\n\
  </body>\n</html>\n```\n\n\n\n\n\n-   这些应用程序也是使用编程语言编写的，但根据原则，它们是使用多种相互依赖的技术构建的。这些技术可以很容易地（尽管并非完全）被分为两类：服务端和客户端。\n\
  \n![](img/image01388.jpeg)\n\n## 2 服务端 vs. 客户端\n\n### 关键点\n\n-   世界维网（World Wide\
  \ Web）是基于多种不同的技术构建的。\n-   对于大多数用户来说，网页的开始和结束于他们选择的网页浏览器。浏览器被称为网页的客户端，浏览器、运行浏览器的计算机以及浏览网页的用户统称为\
  \ `client`。\n-   考虑一个决定访问 `www.google.com` 网站的客户端。首先发生的情况是客户端将向 Google 的 Web 服务器请求该网站的默认页面。\n\
  -   Web 服务器是运行在 Google 拥有的计算机上的应用程序。与客户端一样，服务器应用程序及其运行的计算机定义了网页的服务端，统称为 `server`。\n\
  -   当服务器接收到客户端对特定页面的请求时，它的工作是从计算机文件中检索页面并将其返回给客户端。在许多情况下，此操作是一个非常简单的程序，服务器端的工作很少或完全没有。\n\
  -   然而，使用 `PHP`、`Perl` 或 `Java` 等编程语言，我们可以让服务器在将页面返回给客户端之前修改找到的页面，甚至从头开始生成页面。这被称为服务端应用程序。返回给客户端的页面（对客户端而言）与任何其他未修改的页面看起来完全一样。\n\
  \n![](img/image01388.jpeg)\n\n-   服务端应用程序的一个示例可能是向页面插入当前日期和时间。这意味着每当页面被请求时（例如，使用浏览器的刷新按钮），页面上都会添加一个全新的时间值。\n\
  -   一旦客户端从服务器接收到页面，它就会显示该页面并等待用户请求另一个页面。页面一旦进入这种状态，它就超出了服务器的控制。现在，任何服务端应用程序都无法更改页面内容，除非客户端必须再次返回服务器获取页新的（可能已更新的）页面副本。\n\
  -   然而，所有现代浏览器都允许运行客户端应用程序。这些是嵌入页面本身 `HTML` 代码中的小型应用程序。\n-   服务端应用程序在修改页面并发送给客户端时，会忽略在此过程中发现的任何客户端应用程序，因此通常情况下，两种类型的应用程序无法轻易“对话”。\n\
  -   然而，一旦客户端接收了客户端应用程序，它就可以开始动态修改页面，而无需返回服务器。\n-   客户端应用程序的一个示例可能是网页上每秒更新一次的时钟。\n\
  -   客户端应用程序的一个遗憾副作用是，所有代码必须发送到客户端运行，这意味着应用程序的内部机制对任何人可见。这使得检查密码或执行任何可能导致机密信息泄露到外部的操作变得不切。\n\
  -   此外，所有现代网络浏览器都为用户提供了完全关闭客户端应用程序的机会。在此基础上，同一个客户端应用程序的运行方式会随浏览器类型而异。\n-   尽管有这些缺点，客户端应用程序（由于其通用的简短，通常被称为脚本）仍然是开发网页应用程序时为网页用户提供丰富环境的最佳方式。\n\
  \n![](img/image01388.jpeg)\n\n## 3 关于 JavaScript\n\n### 关键点\n\n-   `JavaScript`\
  \ 是一种解释型的、客户端的、基于事件的、面向对象的脚本语言，你可以用它为你的网页添加动态交互性。\n-   `JavaScript` 脚本是以纯文本编写的，类似于\
  \ `HTML`、`XML`、`Java`、`PHP` 以及几乎任何其他现代计算机代码。在这些代码中，我们将使用 `Windows NotePad` 来创建和编辑我们的\
  \ `JavaScript` 代码，但也有许多替代方案。选择 `NotePad` 是为了演示 `JavaScript` 的即时性和简单性。\n-   你可以使用\
  \ `JavaScript` 实现任何以下功能：\n    -   使用图像创建特殊效果，当鼠标指针悬停在按钮上时，给人按钮被高亮或按下的印象。\n    -\
  \   验证用户输入到你的网页表单的信息。\n    -   在新窗口中打开页面，并自定义这些新窗口的外观。\n    -   检测用户浏览器的能力并相应更改你的页面内容。\n\
  \    -   在不需要像 `PHP` 等服务端语言的情况下，“即时”创建自定义页面。\n    -   以及更多……\n\n![](img/image01388.jpeg)\n\
  \n-   `JavaScript` 并不是 `Java`，尽管如果你有 `Java` 背景，你会发现这两种语言在编写时看起来相似。`Java` 是一种功能齐全且全面的编程语言，类似于\
  \ `C` 或 `C++`，尽管 `JavaScript` 可以与 `Java` Web 应用程序交互，但不应将两者混淆。\n-   不同的网络浏览器会以不同的、有时是不兼容的方式运行你的\
  \ `JavaScript`。为了解决这个问题，通常需要使用 `JavaScript` 本身来检测它所处浏览器的能力，并根据结果更改其操作。\n-   重新回顾本章中的原始定义，请注意以下几点：\n\
  \    -   解释型（Interpreted）指的是 `JavaScript` 代码在加载到浏览器时就会执行（处理）。这与 `Java` 等编译型语言有所不同，编译型语言在运行单行代码之前会彻底检查你的程序，如果你来自非解释型编程背景，这可能会产生许多让你措手不及的影响。\n\
  \    -   客户端（Client-side）已在上一章定义。\n    -   基于事件（Event-based）指的是 `JavaScript` 仅在指定事件发生时运行某些特定代码的能力。事件可以是页面加载、表单提交、链接被点击或鼠标指针指向图像。\n\
  \    -   面向对象（Object-oriented）意味着 `JavaScript` 控制 `HTML` 页面的能力是基于操作该页面内的对象的。如果你熟悉面向对象编程，你会意识到这种方式为编码环境带来的某些力量。\n\
  \n![](img/image01388.jpeg)\n\n\n\n\n\n• 最后的说明：虽然 `JavaScript` 是一种编程语言，但 `HTML`（万维网的语言）不是。`HTML`\
  \ 是一种标记语言，这意味着它可以用于将文档的某些区域标记为具有特殊特征，如标题、段落、图像、表单等，但它本身无法执行任何逻辑处理。因此，虽然 `JavaScript`\
  \ 经常与 `HTML` 一起编写，但一者的规则并不对对方有任何影响。\n\n![](img/image01388.jpeg)\n\n# 4 JavaScript\
  \ 导览\n\n## 核心要点\n• 让我们快速浏览一下 `JavaScript` 的主要功能。本章旨在展示 `JavaScript` 能做什么，而不是对深层概念进行深入研究，所以如果你迷了方向或不理解正在输入的代码，不要太担心！\n\
  \n## 项目\n• 我们的 `JavaScript` 代码都将使用 `NotePad` 编写。打开 `NotePad`并将生成的空文档保存到你的用户驱动器中，命名为\
  \ `chapter_4.html`。\n\n• 首先在空白空白中创建一个基础的 `HTML` 页面。不需要很花哨——以下内容就足够了：\n\n```html\n\
  <html>\n<head>\n<title>Chapter 4: A Tour of JavaScript</title>\n</head>\n<body>\n\
  <h1>A Tour of JavaScript</h1>\n</body>\n</html>\n```\n\n• 按照惯例，当笔记中意图是让你将所有代码写在同一行时，它们会使用像那样的箭头\
  \ `&#8592;` 来指示你在该处不要换行。对于 `HTML` 来说，这并不重要，但对于 `JavaScript` 来说，错误位置的换行可能会导致代码无法运行。\n\
  \n![](img/image01388.jpeg)\n\n• 保存你的新网页，并在浏览器中查看它。目前，请使用 `Internet Explorer` 查看此页面。执行此操作，请在用户驱动器中找到保存的文件，并双击它。这将默认用\
  \ `Internet Explorer` 打开该文件，并让你看到刚刚创建的标题。\n\n• 到目前为止，我们还没有做任何 `HTML` 范围之外的尝试。让我们向页面中添加一些\
  \ `JavaScript`。\n\n• （通常来说）网页中有三个地方可以添加 `JavaScript`。其中第一个是在一组新的 `HTML` 标签之间。这些\
  \ `script` 标签采用以下形式：\n\n```html\n<script language=\"JavaScript\" type=\"text/JavaScript\"\
  >\n… code …\n</script>\n```\n\n• 上述的 `script` 元素可以放在 `HTML` 页面中任何可以放置元素的地方——也就是说，可以放在\
  \ `head` 元素或 `body` 元素中。它最常放在前者，尽管通常这样做是为了让所有的代码都能在页面上被找到。\n\n• 同时注意，`HTML` 页面中包含的\
  \ `script` 元素数量没有人为限制。除了谨慎考虑外，没有什么能阻止你在页面上散布几百个这样的标签。\n\n让我们在页面的 `head` 元素中添加起始和结束脚本标签，如下所示：\n\
  \n```html\n<html\n<head>\n<title> … </title>\n<script language=\"JavaScript\" type=\"\
  text/JavaScript\">\n</script>\n</head>\n…\n```\n\n![](img/image01388.jpeg)\n\n•\
  \ 保存文件，然后尝试在浏览器窗口中刷新页面。注意发现什么都没有发生。这是我们预期的——到目前为止，我们只是在页面上设置了一个区域来存放我们的 `JavaScript`。\n\
  \n回到 `NotePad`，在起始和结束 `script` 标签之间输入以下文本：\n\n```javascript\nwindow.alert(\"Hello\
  \ world!\");\n```\n\n保存更改，再次在浏览器窗口中刷新页面。欢迎来到 `JavaScript` 的世界！\n\n回到 `notepad` 并删除你刚刚添加的\
  \ `window.alert` 行。现在添加以下稍复杂一点的代码：\n\n```javascript\nif( confirm(\"Go to Google?\"\
  ) ) { document.location = \"http://www.google.com/\"; }\n}\n```\n\n再次保存更改并刷新页面。对于那些关注后续章节的人来说，这是一个条件语句的示例，我们要求\
  \ `JavaScript` 检查某事的条件（在这种情况下，是我们对一个问题的回答），然后根据它的发现来改变其行为。\n\n现在，当页面加载到浏览器时，这两段\
  \ `JavaScript` 代码都不受控制地运行了。在大多数情况下，我们希望能够更有效地控制 `JavaScript` 何时执行我们要求的操作。\n\n这种控制是“事件”（events）的领域。在浏览器中，`HTML`\
  \ 文档的每个元素都关联着若干可能在其身上发生的事件。链接可以被点击，表单可以被提交，页面可以加载等等。\n\n修改你 `script` 元素中之前的 `JavaScript`\
  \ 代码以匹配以下内容：\n\n```javascript\nfunction go_to_google() {\n  if( confirm(\"Go to\
  \ Google?\") ) { document.location = \"http://www.google.com/\"; }\n}\n```\n\n![](img/image01388.jpeg)\n\
  \n注意这里的括号！\n\n保存并刷新，注意这次什么都没有发生。这是因为我们把之前的操作（弹出问题并根据响应采取行动）封装在一个函数（function）中。函数是一个被赋予名字的代码块——在这个情况下，名字是\
  \ `go_to_google()`——并且只有当该名字被“调用”时才会运行。将函数认为是在念出名字即可触发的魔咒可能会有用。\n\n要调用这个魔咒，我们需要在页面上选择一个元素来触发它。一个自然的候选者是链接元素，因此在页面的\
  \ `body` 部分添加以下 `HTML`：\n\n```html\n<p>A quick <a href=\"#\">test</a>.</p>\n```\n\
  \n`#` 链接是一个常用的 `HTML` 技巧，允许我们创建一个“通往何处的链接”。\n\n保存并刷新，检查链接是否出现在页面上，以及点击它时是否无处去。\n\
  \n现在，我们希望在点击该链接时，页面询问我们是否要“前往 Google”。方法如下：\n\n获取链接元素，并将其修改为：\n\n```html\n<a href=\"\
  #\" onclick=\"go_to_google();\">test</a>\n```\n\n保存并刷新，然后点击链接。这是一个事件处理器（event handler）的示例。当链接被点击时（`onclick`），我们的浏览器会说“魔咒”\
  \ `go_to_google()`，我们的函数就会被调用。\n\n最后一个技巧，在页面的 `body` 部分包含链接的段落之后添加以下代码：\n\n```html\n\
  <body>\n<script language=\"JavaScript\" type=\"text/JavaScript\">\ndocument.write(\"\
  <h2>Here’s another header!</h2>\");\n</script>\n``` 注意这行代码应该写在一行！\n\n![](img/image01388.jpeg)\n\
  \n保存页面并刷新浏览器。注意我们现在页面上有一行新文本——另一个标题！我们使用 `JavaScript` 创建了 `HTML` 并告诉浏览器适当显示它。在这个示例中，`JavaScript`\
  \ 所做的任何事情都不是我们用一行 `HTML` 无法做到的，但在未来的章节中，我们将看到如何利用它来编写当前日期等内容。\n\n![](img/image01388.jpeg)\n\
  \n## 5 对象、属性和方法\n\n## 核心要点\n- 一般来说，对象（objects）是“事物”。例如，钢琴就是一个对象。\n- 属性（properties）是用来描述和定义特定对象的术语。例如，我们的钢琴有颜色、重量、高度、踏板、键盘和盖子。\n\
  - 注意上述内容，对象的属性也可以是属性。所以我们有这样的情况：钢琴盖子是钢琴的属性，但它本身也是一个对象，拥有它自己的一组属性——例如，盖子有颜色、长度，甚至有开启或关闭的状态。\n\
  - 如果说对象是编程语言的名词，属性是形容词，那么方法（methods）就是动词。方法是可以在特定对象上执行（或由该对象执行）的操作。继续我们的钢琴例子，你可以弹钢琴、打开它的盖子，或踩下延音踏板。\n\
  \n\n\n\n\n许多编程语言在引用对象及其属性或方法方面有相似的方法。通常情况下，它们是分级的，对象与其属性、方法之间的关系，以及与其他之间的关系，通常可以通过编程表示法一眼看出。\n\
  \n在 JavaScript 中，我们使用“点符号表示”（dot notation）来表示对象及其属性和方法。例如，我们可以通过以下方式引用钢琴的颜色：\n\n\
  ```\npiano.colour;\n```\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 19 |\n\
  |  |  |  |\n|  |  |  |\n\n如果我们想让 JavaScript 播放钢琴，可以写出极其简单的代码：\n\n```javascript\n\
  piano.play();\n```\n\n如果我们决定打开钢琴的盖子，就可以看到一个对象层级的清晰例子：\n\n```javascript\npiano.lid.open();\n\
  ```\n\n或者如果我们想按下钢琴的延音踏板，则更为明显：\n\n```javascript\npiano.pedals.sustain.press();\n\
  ```\n\n请注意，在上面的某些示例中，我们在每组单词后面都带有括号 `()`，而在某些地方没有。这是为了确保 JavaScript 能够理解我们所表达的内容。\n\
  \nJavaScript 在浏览器中的整个运行过程中都在与对象交互。页面上所有的 HTML 元素都可以描述为对象、属性或方法。我们在之前的介绍章节中已经见过其中的一些对象：\n\
  \n```javascript\ndocument.write(...);\ndocument.location;\n```\n\n在这些示例中，`document`\
  \ 是一个对象，而 `write` 是一个方法，`location` 是一个属性。\n\n在这些行代码中，我们看到了关于在这些语句中使用括号的线索。我们使用括号是为了向\
  \ JavaScript 表示我们正在讨论一个对象的方法，而不是同名的属性。\n\n括号还允许我们向对象的方法传递某些额外信息。在上面的示例中，为了向网页文档写入文本“Hello\
  \ world!”，我们将编写以下 JavaScript：\n\n```javascript\ndocument.write(“Hello World”);\n\
  ```\n\n每个方法可以根据括号中放入的内容（或者用技术术语说，“作为参数传递给方法的内容”）可以执行不同的操作。事实上，许多方法可以接受多个“参数”来修改其行为。多个参数之间用逗号（`,`）分隔。\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 20 |\n|  |  |  |\n|  |  |  |\n\
  \n23 像这里显示的 JavaScript 指令被称为 JavaScript 语句。所有语句都应该以单个分号（`;`）结束。JavaScript 经常会忽略行尾缺失的分号，并自动为你插入分号。然而，这可能会导致一些意外的结果。考虑以下情况：\n\
  \n```javascript\ndocument.write(“<h1>\nHello World!\n</h1>”);\n```\n\n在许多其他语言中，这是可以接受的。然而，JavaScript\
  \ 经常会将此类内容解释为如下：\n\n```javascript\ndocument.write(“<h1>;\nHello World!;\n</h1>”);\n\
  ```\n\n这种解释将产生错误，因为 JavaScript 在结束语句时，如果没有确保引号内的任何项具有匹配的引号对，它就会报错。在这个例子中，第一行的“语句”被截断了，JavaScript\
  \ 将崩溃。\n\n出于这个原因，建议你所有的语句都以分号结尾。\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON\
  \ | 21 |\n|  |  |  |\n|  |  |  |\n\n## 6 给属性赋值\n\n### 关键点\n\n虽然对象和方法允许我们在页面上执行某些操作（例如更改内容或弹出对话框与用户交互），但在许多情况下，我们可能想要直接更改对象某个属性的值。这些情况类似于将我们的钢琴漆成绿色。\n\
  \n考虑到我们目前为止对方法的讨论，我们可能认为能够通过方法来更改对象的属性——例如，以下内容看起来是合逻辑的：\n\n```javascript\npiano.paint(“green”);\n\
  ```\n\n在许多情况下，我们确实是这样做的。然而，这里有两个缺点。首先，在本课程中，我们发现的大多数对象都是由浏览器内置并定义的。如果我们依赖使用方法来更改对象的属性，那么我们也就依赖于该方法本身存在的这一事实。\n\
  \n解决这个问题的更直接的方法是直接访问对象的属性。例如：\n\n```javascript\npiano.colour=“green”;\n```\n\n在这里，我们不再使用方法来执行操作，而是使用所谓的“运算符”。在这种情况下，该运算符的符号是\
  \ `=`，被称为“赋值运算符”。\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 22 |\n|  |\
  \  |  |\n|  |  |  |\n\n在 JavaScript 中，我们可以非常有效地使用这种运算符。例如，我们可以动态地更改文档的标题元素（浏览器窗口顶部栏中显示的文本）。这可以在用户使用事件处理器点击页面部分时完成（稍后会详细介绍），也可以设置为每分钟自动更新一次以在页面标题中显示当前时间。我们用于此任务的代码非常简单：\n\
  \n```javascript\ndocument.title=“a new title”;\n```\n\nJavaScript 中有很多赋值运算符。下表显示了一些较常用的运算符：\n\
  \n| 赋值 | 功能 |\n|  |  |\n| `x = y` | 将 `x` 的值设置为 `y` |\n|  |  |\n| `x += y` | 将 `x`\
  \ 的值加上 `y` |\n|  |  |\n| `x -= y` | 将 `x` 的值减去 `y` |\n|  |  |\n| `x *= y` | 将 `x`\
  \ 的值乘以 `y` |\n|  |  |\n| `x /= y` | 将 `x` 的值除以 `y` |\n\n并非 并不是所有的赋值运算符都适用于所有类型的值。但加法运算符同时适用于数字和文本。在处理数字时，结果将是数字之和。在处理文本（技术上称为字符串）时，结果将是两者的拼接：\n\
  \n```javascript\ndocument.title += “!”\n```\n\n将导致符号“!”追加到当前标题之后。\n\n### 项目\n\n\
  打开你的项目文件，并将其保存为 `chapter_6.html`。\n\n从你的脚本标签中删除任何现有的 JavaScript，但保留标签以准备新的 JavaScript。\n\
  \n![](img/image0138.jpeg)\n\n| ROBERT PETERSON | 23 |\n|  |  |  |\n|  |  |  |\n\n\
  使用你的文本编辑器将页面元素的值更改如下，然后在浏览器加载页面并查看结果：\n\n```html\n<title>With a little help from</title>\n\
  ```\n\n现在在我们的脚本中添加一条语句，将以下文本添加到标题末尾：\n\n```javascript\ndocument.title += “ROBERTERSON!”;\n\
  ```\n\n在浏览器中刷新页面并注意窗口的标题栏。\n\n我们目前所做的只是一个 HTML 也能实现的例子。让我们引入窗口对象的一个新方法，来为脚本添加一些动态性和交互性。将标题标签的值更改如下：\n\
  \n```html\n<title>Chapter 6: Assigning Values to Properties</title>\n```\n\n现在，删除之前的\
  \ JavaScript 语句并插入以下内容：\n\n```javascript\ndocument.title = window.prompt(“Your title?”,\
  \ “”);\n```\n\n刷新你的页面并考虑结果。\n\n我们以前遇到过窗口对象。我们在第 4 章中对 alert 方法的演示可以写写为：\n\n```javascript\n\
  window.alert(“message”);\n```\n\n在编写代码时，我们通常省略对象/属性/方法层级中的某些部分。我们稍后会再次讨论这一点。\n\n\
  \n\n\n最后，我们注意到这种 prompt 方法会以某种方式获取用户在框中输入的信息并将其传递给我们的 JavaScript 赋值。假设有人在框中输入了“Hello\
  \ World”。这就像我们的赋值实际上执行了：\n\n```javascript\ndocument.title = “Hello World”;\n```\n\
  \n当发生这种值的传递时，我们称该方法返回了所传递的值。在这种情况下，我们会说“prompt 方法返回了值‘Hello World’”，或者说“prompt 方法的返回值为‘Hello\
  \ World’”。\n\n当我们稍后处理事件处理器时，返回值将变得非常重要。\n\n![](img/image01388.jpeg)\n\n| ROBERT\
  \ PETERSON | 25 |\n|  |  |  |\n|  |  |  |\n\n## 关于注释 (About Comments)\n\n### 关键点\n\
  - 随我复读一遍：注释很重要。注释很重要。注释很重要。\n- 在代码中添加注释始终是一个良好的习惯。随着脚本复杂性的增加，注释可以帮助你（以及他人）在日后查看代码时理解其结构。\n\
  - 许多快速创建的代码被称为“只写”代码，因为它们天生缺乏结构或注释。调试此类代码或在几个月后重新使用它将变得极其困难，因为你试图记住某行代码本该是做什么的，或者由于为什么使用某些值似乎会导致你的代码停止工作。\n\
  - JavaScript 会完全忽略注释，只要其格式正确，注释就不会影响脚本的运行速度。\n- 然而，注释可能会减慢页面的加载速度——许多程序员会保留一份带有完整注释的“开发”版代码以供编辑，并在最终发布时移除代码中的所有注释。\n\
  - JavaScript 中有两种类型的的注释：单行注释和多行注释。\n\n### 单行注释\n单行注释以两个正斜杠字符（`//`）开始，并换行结束：\n\n\
  ```javascript\nthis is a comment alert(“hello”); // so is this\n```\n\n![](img/image01388.jpeg)\n\
  \n| ROBERT PETERSON | 26 |\n|  |  |  |\n|  |  |  |\n\nJavaScript 中的单行注释也可以使用你可能熟悉的\
  \ HTML 注释格式：\n\n```html\n<!-- this is a comment\nalert(“hello”);\n```\n\n注意两点：首先，这种对\
  \ HTML 注释格式的使用不需要闭合标签 `-->`。其次，这只是单行注释，与 HTML 中的用法不同（HTML 中的注释会注释直到闭合标签之前的所有行）。\n\
  \n### 多行注释\n你可以通过将注释块封装在 `/*` 和 `*/` 之间来添加多行注释。例如：\n\n```javascript\n/* 所有的这些文本都将被\
  \ JavaScript 忽略。这允许我们编写较大的注释，而不必担心需要逐行“注释掉”每一行 */\n\nalert(“Hello World”);\n\n/*\
  \ 一个单行的“多行”注释 */\n```\n\n除了为你的脚本添加叙述性内容外，你还可以使用注释从页面中移除代码，而无需删除代码。例如：\n\n```javascript\n\
  this was the old message\nalert(“Hello World”);\n\nand this is the new message\n\
  alert(“Hello everyone!”);\n```\n\n当你正尝试追踪代码中的错误时，这非常有用——你可以逐 own“注释掉”每一行可疑代码，直到代码恢复正常工作。\n\
  \n### 项目\n1. 打开你之前的项目文件，并将其保存为 `chapter_7.html`。\n2. 在脚本的开头添加单行注释：\n```javascript\n\
  This is my first comment\n```\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON |\
  \ 27 |\n|  |  |  |\n|  |  |  |\n\n3. 在你的脚本中添加一个多行注释，替换你之前的单行注释。多行注释应该描述你的脚本目前的功能。\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 28 |\n|  |  |  |\n|  |  |  |\n\
  \n#### 对旧版浏览器隐藏脚本\n\n### 关键点\n- 非常老旧的浏览器无法理解 JavaScript。今天使用此类浏览器的非常少，但有两个因素迫使我们继续考虑可能无法处理我们\
  \ JavaScript 代码的环境。\n- 首先，所有现代浏览器都允许用户控制是否运行 JavaScript 代码。在许多情况下，用户对自己的公司政策没有话语权，甚至可能不知道他们的工作机器已经禁用了\
  \ JavaScript。\n- 其次，并不是所有的访客都会使用可以利用 JavaScript 的浏览器。盲文显示器、屏幕阅读器和其他非视觉浏览器对许多 JavaScript\
  \ 技巧几乎无用其微。此外，像 Google 这样的搜索引擎会忽略你在页面上使用的任何 JavaScript，这可能会隐藏重要内容并导致你的页面无法被索引。\n\
  - 不支持 JavaScript 的浏览器本应该忽略忽略开启和结束 script 标签之间的任何内容。然而，许多浏览器违反了这一规则，并尝试将你的代码渲染为 HTML，这可能会导致尴尬的后果。\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 29 |\n|  |  |  |\n|  |  |  |\n\
  \n不过，我们可以利用 `<!--` 在 JavaScript 中表示单行注释但在 HTML 中表示多行注释的这一特性，以确保我们的代码能被精通 JavaScript\
  \ 的浏览器看到，但被其他设备视为被注释掉的 HTML 而忽略：\n\n```html\n<script>\n<!-- hidefrom older browsers\n\
  … your code\nstop hiding code\n```\n\n## 自动重定向用户\n\n### 关键点\n- 我们在第 4 章已经简要见过浏览器重定向。\n\
