  \ (231)\n## 24.12.2 导入 (231)\n\n# 24.1 JavaScript 源代码格式\n当前 JavaScript 模块的格局非常多样：ES6\
  \ 引入了内置模块，但在此之前的源代码格式仍然存在。理解后者有助于理解前者，让我们深入研究。接下来的章节描述了交付 JavaScript 源代码的如下：\n\n\
  * 脚本（Scripts）是浏览器在全局作用域运行的代码片段。它们是模块的前身。\n* CommonJS 模块是一种主要用于服务器端（例如通过 `Node.js`）的模块格式。\n\
  * AMD 模块是一种主要用于浏览器的模块格式。\n* ECMAScript 模块是 JavaScript 的内置模块格式。它取代了所有以前的格式。\n\n表\
  \ 24.1 简要这些代码格式的概述。请注意，对于 CommonJS 模块和 ECMAScript 模块，通常使用两个文件名扩展名。使用哪一个取决于你如何使用该文件。细节将在本章后面的部分给出。\n\
  \n表 24.1：交付 JavaScript 源代码的方式。\n\n![](img/image01482.jpeg)\n\n| 运行环境 | 加载方式 | 文件扩展名\
  \ |\n| :--- | :--- | :--- | :--- |\n| 脚本 | 浏览器 | async | .js |\n| CommonJS 模块 |\
  \ 服务器 | sync | .js .cjs |\n| AMD 模块 | 浏览器 | async | .js |\n| ECMAScript 模块 | 浏览器和服务器\
  \ | async | .js .mjs |\n\n## 24.1.1 内置模块之前的代码使用 ECMAScript 5 \n在我们介绍内置模块（于 ES6 引入）之前，你看到的所有代码都将用\
  \ ES5 编写。包括：\n\n* ES5 没有 `const` 和 `let`，只有 `var`。\n* ES5 没有箭头函数，只有函数表达式。\n\n# 24.2\
  \ 在模块出现之前，我们拥有脚本\n最初，浏览器只有脚本——即在全局作用域中执行的代码片段。例如，考虑通过以下 HTML 加载脚本文件的 HTML 文件：\n\n\
  ```html\n<script src=\"other-module1.js\"></script> <script src=\"other-module2.js\"\
  ></script> <script src=\"my-module.js\"></script>\n```\n\n主文件是 `my-module.js`，我们在其中模拟了一个模块：\n\
  \n```javascript\nvar myModule = (function () {  // 立即执行函数表达式\n  // 导入（通过全局变量）\n\
  var importedFunc1 = otherModule1.importedFunc1; var importedFunc2 = otherModule2.importedFunc2;\n\
  \n// 主体\nfunction internalFunc() {\n// ···\n}\nfunction exportedFunc() {\nimportedFunc1();\n\
  importedFunc2();\ninternalFunc();\n}\n\n// 导出（赋值给全局变量 `myModule`）\nreturn {\n  exportedFunc:\
  \ exportedFunc,\n};\n})(); // 关闭 IIFE\n```\n\n`myModule` 是一个全局变量，赋值为立即调用函数表达式的结果。该函数表达式从第一行开始，在最后一行调用。\n\
  \n这种封装代码片段的方式被称为立即执行函数表达式（IIFE，由 Ben Alman 命名）。我们从 IIFE 中获得了什么？`var` 不是块作用域（类似于\
  \ `const` 和 `let`），它是函数作用域的：为 `var` 声明变量创建新作用域的唯一方法是通过函数或方法（对于 `const` 和 `let`，你可以使用函数、方法或块\
  \ `{}`）。因此，示例中的 IIFE 从全局作用域隐藏了所有以下变量，并尽可能地减少了命名冲突：`importedFunc1`、`importedFunc2`、`internalFunc`、`exportedFunc`。\n\
  \n注意我们特定的方式使用了 IIFE：在结尾，我们选择想要导出的内容并通过对象字面量返回它。这被称为揭示模块模式（由 Christian Heilmann 命名）。\n\
  \n这种模拟模块的方法存在几个问题：\n\n* 脚本文件中的库通过全局变量导出和导入功能，这存在命名冲突的风险。\n* 依赖关系没有显式说明，脚本没有内置方法来加载它依赖的脚本。因此，网页不仅需要加载页面所需的脚本，还需要加载这些脚本的依赖项、依赖项的依赖项等。而且必须按照正确的顺序加载！\n\
  \n# 24.3 ES6 之前创建的模块系统\n在 ECMAScript 6 之前，JavaScript 没有内置模块。因此，该语言的灵活语法被用于在语言内部实现自定义模块系统。两种流行的有：\n\
  \n* CommonJS（针对服务器端）\n* AMD（异步模块定义，针对客户端端）\n\n## 24.3.1 服务器端：CommonJS 模块\n原始的 CommonJS\
  \ 模块标准为服务器和桌面平台创建。它是原始 Node.js 模块系统的基础，并在那里获得了巨大的普及。对这种普及做出贡献的是 Node 的 `npm` 包管理器以及在客户端启用\
  \ Node 模块的工具（browserify, webpack）。\n\n从现在起，CommonJS 模块意味着该标准的 Node.js 版本（带有一些额外功能）。这是一个\
  \ CommonJS 模块的示例：\n\n```javascript\n// 导入\nvar importedFunc1 = require('./other-module1.js').importedFunc1;\
  \ var importedFunc2 = require('./other-module2.js').importedFunc2;\n\n// 主体\nfunction\
  \ internalFunc() {\n// ···\n}\nfunction exportedFunc() {\nimportedFunc1();\nimportedFunc2();\n\
  internalFunc();\n}\n\n// 导出\nmodule.exports = {\n  exportedFunc: exportedFunc,\n\
  };\n```\n\nCommonJS 可以具有以下特征：\n\n* 为服务器设计。\n* 模块旨在同步加载（导入者在被导入模块加载和执行时进行等待）。\n*\
  \ 语法紧凑。\n\n## 24.3.2 客户端：AMD（异步模块定义）模块\nAMD 模块格式的创建是为了比 CommonJS 格式更容易在浏览器中使用。它最流行的实现是\
  \ [RequireJS](https://requirejs.org)。以下是一个 AMD 模块的示例。\n\n```javascript\ndefine(['./other-module1.js',\
  \ './other-module2.js'], function (otherModule1, otherModule2) {\n  var importedFunc1\
  \ = otherModule1.importedFunc1; var importedFunc2 = otherModule2.importedFunc2;\n\
  \n  function internalFunc() {\n  // ···\n  }\n  function exportedFunc() {\n  importedFunc1();\n\
  importedFunc2();\ninternalFunc();\n  }\n\n  return {\n    exportedFunc: exportedFunc,\n\
  \  };\n});\n```\n\nAMD 可以具有以下特征：\n\n* 为浏览器设计。\n* 模块旨在异步加载。这对于浏览器来说是一项关键需求，因为代码无法等待模块下载完成。它必须在模块可用时得到通知。\n\
  * 语法稍微复杂一些。\n\n\n\n\n优点的一方面，`AMD` 模块可以直接执行。相比之下，`CommonJS` 模块必须在部署之前编译，或者生成自定义源代码并进行动态评估（使用\
  \ `eval()`）。这在 Web 上并不总是被允许的\n\n### 24.3.3 JavaScript 模块的特征\n\n观察 `CommonJS` 和 `AMD`，这些\
  \ JavaScript 模块系统存在相似之处：\n\n- 每个文件一个模块。\n- 该文件基本上是一段执行的代码：\n    - **局部作用域**：代码在本地“模块作用域”中执行。因此，默认情况下，其中声明的所有变量、`functions`\
  \ 和 `classes` 都是内部的而不是全局的。\n    - **导出 (Exports)**：如果你希望导出任何声明的实体，必须显式将其标记为导出。\n\
  \    - **导入 (Imports)**：每个模块都可以从其他模块导入导实体。这些其他模块通过模块标识符（通常是路径，有时是完整的 URL）进行标识。\n\
  - 模块是单例：即使一个模块被导入多次，也只存在一个“实例”。\n- 不使用全局变量。相反，模块标识符充当了全局 ID。\n\n### 24.4 ECMAScript\
  \ 模块\n\nECMAScript 模块（简称 `ES modules`、`ESM`）是在 `ES6` 中引入的。它们延续了 JavaScript 模块的传统，并具有上述的所有特征。此外：\n\
  \n- 与 `CommonJS`一样，`ES modules` 共享简洁的语法和对循环依赖的支持。\n- 与 `AMD`一样，`ES modules` 支持异步加载。\n\
  \n`ES modules` 还具有新的优势：\n\n- 语法比 `CommonJS` 更加简洁。\n- 模块具有静态结构（运行时无法更改）。这有助于静态检查、优化的导入访问、死代码消除等。\n\
  - 对循环导入的支持是完全透明的。\n\n这是一个 ES 模块语法的示例：\n\n```javascript\nimport {importedFunc1} from\
  \ './other-module1.mjs';\nimport {importedFunc2} from './other-module2.mjs';\n\n\
  function internalFunc() {\n  // ...\n}\n\nexport function exportedFunc() {\n  importedFunc1();\n\
  \  importedFunc2();\n  internalFunc();\n}\n```\n\n从现在起，“模块”意味着“ECMAScript 模块”。\n\
  \n### 24.4.1 ES modules：语法、语义、加载器 API\n\nES 模块的完整标准包含以下部分：\n\n- **语法**（代码如何编写）：什么是模块？如何声明导入和导出？等等。\n\
  - **语义**（代码如何执行）：如何导出变量绑定？导入是如何与导出连接的？等等。\n- 用于配置模块加载的**程序化加载器 API**。\n\n第 1 和第\
  \ 2 部分是在 `ES6` 中引入的。第 3 部分正在开发中。\n\n### 24.5 导出 (Exporting)\n\n#### 24.5.1 命名导出\
  \ (Named exports)\n\n每个模块可以有零或多个命名导出。\n\n例如，考虑以下文件：\n- `lib/my-math.mjs`\n- `main1.mjs`\n\
  - `main2.mjs`\n\n模块 `my-math.mjs` 有两个命名导出：`square` 和 `LIGHTSPEED`。\n\n```javascript\n\
  // 未导出，模块私有\nfunction times(a, b) {\n  return a * b;\n}\n\nexport function square(x)\
  \ {\n  return times(x, x);\n}\n\nexport const LIGHTSPEED = 299792458;\n```\n\n模块\
  \ `main1.mjs` 有一个命名导入，`square`：\n\n```javascript\nimport {square} from './lib/my-math.mjs';\n\
  assert.equal(square(3), 9);\n```\n\n模块 `main2.mjs` 有一个所谓的命名空间导入——`my-math.mjs` 的所有命名导出都可以作为对象\
  \ `myMath` 的属性访问：\n\n```javascript\nimport * as myMath from './lib/my-math.mjs';\n\
  assert.equal(myMath.square(3), 9);\nassert.deepEqual(\n  Object.keys(myMath), ['LIGHTSPEED',\
  \ 'square']\n);\n```\n\n#### 24.5.2 默认导出 (Default exports)\n\n每个模块最多有一个默认导出。理念是模块本身就是导出的值。\n\
  \n#### 混合命名导出和默认导出\n\n模块可以同时拥有命名导出和默认导出，但通常只坚持其中一种更好。\n\n例如，考虑以下文件：\n\n`my-func.mjs`\n\
  ```javascript\nexport const GREETING = 'Hello!';\nexport default function func()\
  \ {\n  return GREETING;\n}\n```\n\n`main.mjs`\n```javascript\nimport func, { GREETING\
  \ } from './my-func.mjs';\nconsole.log(func(), GREETING);\n```\n\n#### 默认导出的样式\n\
  \n默认导出有两种样式：\n\n首先，你可以直接导出声明：\n\n```javascript\nexport default function foo() {}\n\
  ```\n\n其次，你可以定义一个变量然后导出它：\n\n```javascript\nconst bar = 1;\nconst baz = 2;\nexport\
  \ default baz;\n```\n\n### 24.6 导入 (Importing)\n\n#### 24.6.1 导入是导出的只读视图\n\n到目前为止，我们直观地使用了导入和导出，一切似乎运行良好。但现在是时候仔细观察导入和导出实际上是如何关联的。考虑以下模块：\n\
  \n`counter.mjs`\n```javascript\nexport let counter = 3;\nexport function incCounter()\
  \ {\n  counter++;\n}\n```\n\n`main.mjs`\n```javascript\nimport { counter, incCounter\
  \ } from './counter.mjs';\n\n// 导入的值 `counter` 是实时的\nassert.equal(counter, 3);\n\
  incCounter();\nassert.equal(counter, 4);\n```\n\n注意，虽然连接是实时的，但我们无法更改此变量（例如通过 `counter++`）。\n\
  \n以此方式处理导入有两个好处：\n\n- 更容易拆分模块，因为以前共享的变量可以变成导出。\n- 这种行为对于支持循环导入至关重要。\n\n#### 24.6.2\
  \ 语法陷阱：导入并非解构\n\n导入和解构看起来相似：\n\n```javascript\nimport {foo} from './bar.mjs'; //\
  \ 导入\nconst {foo} = require('./bar.mjs'); // 解构\n```\n\n但它们非常不同：\n\n- 导入保持与其导出的连接。\n\
  - 你可以在解构模式内部再次进行解构，但导入语句中的 `{}`  same 嵌套。\n- 重命的语法不同：\n\n```javascript\nimport {foo\
  \ as f} from './bar.mjs'; // 导入\nconst {foo: f} = require('./bar.mjs'); // 解构\n\
  ```\n\n#### 24.6.3 ESM 对循环导入的透明支持（进阶）\n\nESM 透明地支持循环导入。为了理解如何实现，请考虑以下示例：图 24.1 显示了模块导入其他模块的有向图。在这种情况下，P\
  \ 导入 M 就是循环。\n\n\n\n\n解析后，这些模块分两个阶段设置：\n\n- **实例化 (Instantiation)**：每个模块都会被访问，其导入将连接到它的导出。在父模块实例化之前，其所有子模块必须先实例化。\n\
  - **评估 (Evaluation)**：执行模块体。同样，子模块在父模块之前被评估。\n\n由于 ES 模块的两个特性，这种方法可以正确处理循环导入：\n\n\
  - 由于于 ES 模块的静态结构，在解析后导出已经是已知的。这使得在实例化子模块 `M` 之前实例化 `P` 是可能的：`P` 已经查找 `M` 的导出。\n\
  - 当评估 `P` 时，`M` 还没有被评估。然而，`P` 中的实体已经提到来自 `M` 的导入。它们只是还不能使用这些导入，因为导入的值会在稍后被填充。例如，`P`\
  \ 中的一个函数可以访问来自 `M` 的导入。唯一的限制是，我们必须等到 `M` 评估之后才能调用该函数。\n\n导入稍后填充的实现是因为它们是导出内容的“实时不可变视图（live\
  \ immutable views）”。\n\n## 24.7 npm packages\n\nnpm 软件注册表是 Node.js 和 浏览器 JavaScript\
  \ 库和应用程序的主要发布方式。它通过 `npm` 包管理器（简称：`npm`）管理。软件以所谓的“包（packages）”的形式发布。包是一个包含任意文件的目录，以及顶层一个描述包的\
  \ `package.json` 文件。例如，当 `npm` 在目录 `foo/` 内部创建一个空包时，你会得到这个 `package.json`：\n\n```json\n\
  {\n  \"name\": \"foo\",\n  \"version\": \"1.0.0\",\n  \"description\": \"\",\n \
  \ \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no\
  \ test specified\\\" && exit 1\"\n  },\n  \"keywords\": [],\n  \"author\": \"\"\
  ,\n  \"license\": \"ISC\"\n}\n```\n\n这些属性中的一些包含简单的元数据：\n\n- `name` 指定此包的名称。一旦上传到\
  \ npm 注册表，就可以通过 `npm install foo` 安装。\n- `version` 用于版本管理，并遵循[语义版本化](https://semver.org)，包含三个数字：\n\
  \  - 主版本号（Major）：当发生不兼容的 API 时增加。\n  - 小版本号（Minor）：当以向下兼容的方式添加功能时增加。\n  - 补丁版本号（Patch）：当进行向下兼容的更改时增加。\n\
  - `description`、`keywords`、`author` 让包更容易找到。\n- `license` 明确你可以如何使用此包。\n\n其他属性允许高级配置：\n\
  \n- `main`：指定“是”该包的模块（在本章稍后部分解释）。\n- `scripts`：你可以通过 `npm run` 执行的命令。例如，可以通过 `npm\
  \ run test` 执行脚本 `test`。\n\n有关关于 `package.json` 的更多信息，请参阅[npm 文档](https://docs.npmjs.com/files/package.json)。\n\
  \n### 24.7.1 包安装在 node_modules/ 目录内\n\n`npm` 总是将包安装在名为 `node_modules` 的目录中。通常有很多这样的目录。`npm`\
  \ 使用哪一个取决于当前所在的目录。例如，如果我们在 `/tmp/a/b/` 目录内部，`npm` 会尝试在当前目录、其父目录、父目录的父目录等处查找 `node_modules`。换句话说，它搜索以下位置链：\n\
  \n- `/tmp/a/b/node_modules`\n- `/tmp/a/node_modules`\n- `/tmp/node_modules`\n\n\
  安装包 `foo` 时，`npm` 使用最近的 `node_modules`。例如，如果我们在 `/tmp/a/b/` 内部且该目录下存在 `node_modules`，那么\
  \ `npm` 就会将包放在 `/tmp/a/b/node_modules/foo/` 目录下。\n\n在导入模块时，我们可以使用特殊的模块指定符（module\
  \ specifier）来告诉 Node.js 我们想从已安装的包中导入它。具体工作原理将在稍后解释。现在，考虑以下示例：\n\n```javascript\n\
  // /home/jane/proj/main.mjs\nimport * as theModule from 'the-package/the-module.mjs';\n\
  ```\n\n为了找到 `the-module.mjs`（Node.js 优先对 ES 模块使用 `.mjs` 扩展名），Node.js 会向上遍历 `node_module`\
  \ 链并搜索以下位置：\n\n- `/home/jane/proj/node_modules/the-package/the-module.mjs`\n- `/home/jane/node_modules/the-package/the-module.mjs`\n\
  - `/home/node/node_modules/the-package/the-module.mjs`\n\n### 24.7.2 为什么可以用 npm\
  \ 来安装前端库？\n\n在 `node_modules` 目录中查找已安装模块仅支持 Node.js。那么为什么我们也可以用 `npm` 安装用于浏览器的库呢？\n\
  \n这是通过打包工具（bundling tools）实现的，例如 `webpack`，它们在代码部署上线之前对其进行编译和优化。在编译过程中，`npm` 包中的代码会被适配以便在浏览器中运行。\n\
  \n## 24.8 模块命名\n\n对于模块文件名及其被导入的变量命名，目前没有建立的最佳实践。\n\n在本章中，我使用了以下命名样式：\n\n- 模块文件名使用短横线命名（dash-cased）并以小写字母开头：\n\
  \  - `./my-module.mjs`\n  - `./some-func.mjs`\n- 命名空间导入（namespace imports）的名字使用小写和驼峰命名（camel-cased）：\n\
  \  - `import * as myModule from './my-module.mjs';`\n- 默认导入（default imports）的名字使用小写和驼峰命名：\n\
  \  - `import someFunc from './some-func.mjs';`\n\n这种样式背后的原理是什么？\n\n- `npm` 不允许包名中包含大写字母（[来源](https://docs.npmjs.com/files/package.json#name)）。因此，我们避免使用驼峰命名，以便“本地”文件的命名与\
  \ `npm` 包名保持一致。仅使用小写字母也可以最大限地减少大小敏感文件系统与不敏感文件系统之间的冲突：前者可以区分字母相同但大小写不同的文件；后者则不可以。\n\
  - 将短横线命名的文件名转换为驼峰命名的 JavaScript 变量名有明确的规则。由于我们命名命名空间的方式，这些规则适用于命名空间导入和默认导入。\n\n\
  我也喜欢使用下划线命名（underscore-cased）的模块文件名，因为你可以直接为命名空间导入使用这些名称：\n\n```javascript\nimport\
  \ * as my_module from './my_module.mjs';\n```\n\n但这种样式对于默认导入：我喜欢命名对象使用下划线命名，但对于函数等并不是很好的选择。\n\
  \n## 24.9 模块指定符\n\n模块指定符是标识模块的字符串。它们在浏览器和 Node.js 中的工作方式略有。在查看差异之前，我们需要了解不同类型的指定符。\n\
  \n### 24.9.1 模块指定符分类\n\n在 ES 模块中，我们区分以下类型的指定符。这些类别源于 CommonJS 模块。\n\n- **相对路径 (Relative\
  \ path)**：以点开头。例如：\n  - `'./some/other/module.mjs'`\n  - `'../../lib/counter.mjs'`\n\
  - **绝对路径 (Absolute path)**：以斜杠开头。示例：\n  - `'/home/jane/file-tools.mjs'`\n- **URL**：包含协议（技术上路径也是\
  \ URL）。示例：\n  - `'https://example.com/some-module.mjs'`\n  - `'file:///home/john/tmp/main.mjs'`\n\
  - **裸路径 (Bare path)**：不以点、斜杠或协议开头，且由单个没有扩展名的文件名组成。示例：\n  - `'lodash'`\n  - `'the-package'`\n\
  - **深度导入路径 (Deep import path)**：以裸路径开头并至少有一个斜杠。示例：\n  - `'the-package/dist/the-module.mjs'`\n\
  \n### 24.9.2 浏览器中的 ES 模块指定符\n\n浏览器如下所示处理模块指定符：\n\n- 相对路径、绝对路径和 URL 按照预期工作。它们都必须指向真实的文件。（与\
  \ CommonJS 不同，后者允许省略文件名扩展名等。）\n- 模块的文件扩展名并不重要，只要它们以 `text/javascript` 内容类型提供服务。\n\
  - 裸路径最终如何被处理尚尚不清楚。你最终可能可以通过查找表将它们映射到其他指定符。\n\n\n\n\n请注意，诸如 `webpack` 等打包工具会将多个模块合并为较少的文件，它们对限定符的限制通常比浏览器要松。这是因为它们在构建/编译时（而不是在运行时）运行，并且可以通过遍历文件系统来搜索文件。\n\
  \n# 22624 模块\n\n## 24.9.3 Node.js 中的 ES 模块限定符\n\n![](img/image01485.jpeg)![](img/image01486.jpeg)\n\
  \n![](img/image01412.jpeg) Node.js 对 ES 模块的支持仍然是\n\n你可能需要通过命令行标记来开启它。详情请参阅[Node.js\
  \ 文档-](https://nodejs.org/api/esm.html)[件](https://nodejs.org/api/esm.html)。\n\n\
  Node.js 处理模块限定符如下：\n\n• 相对路径的解析与网络浏览器相同——相对于当前模块路径。\n\n• 目前不支持绝对路径。作为一种替代方案，你可以使用以\
  \ `file:///` 开头的 URL。你可以通过 `url.pathToFileURL()` 创建此类 URL。\n\n• URL 限定符仅支持 `file:`\
  \ 作为协议。\n\n• 裸路径（bare path）被解释为包名，并相对于最近的 `node_modules` 目录进行解析。应该加载哪个模块，取决于该包的\
  \ `package.json` 中的 `\"main\"` 属性（类似于 CommonJS）。\n\n• 深度导入路径也相对于最近的 `node_modules`\
  \ 目录进行解析。它们包含文件名，因此始终清楚地知道是指哪个模块。\n\n除了裸路径外，所有限定符必须引用实际文件。这意味着 ESM 不支持以下 CommonJS\
  \ 特性：\n\n• CommonJS 会自动添加缺失的文件扩展名。\n\n• 如果存在带有 `\"main\"` 属性的 `foo/package.json`，CommonJS\
  \ 可以导入目录 `foo`。\n\n• 如果存在模块 `foo/index.js`，CommonJS 可以导入目录 `foo`（此处此处意为导入该模块）。\n\
  \n所有内置 Node.js 模块都可以通过裸路径访问，并具有具命名的 ESM 导出。\n\n例如：\n\n```\nimport * as path from\
  \ 'path';\n\nimport {strict as assert} from 'assert';\nassert.equal(\n  path.join('a/b/c',\
  \ '../d'), 'a/b/d');\n```\n\n### 24.9.3.1 Node.js 中的文件名扩展名\n\nNode.js 支持以下默认文件名扩展名：\n\
  \n• `.mjs` 用于 ES 模块\n\n• `.cjs` 用于 CommonJS 模块\n\n`.js` 文件名扩展名代表 ESM 或 CommonJS。具体是哪一个是通过“最近”的\
  \ `package.json`（在当前目录、父目录等）进行配置的。以这种方式使用 `package.json` 是独立于包的。\n\n| 24.10 通过 `import()`\
  \ 动态加载模块 | 227 |\n\n在那个 `package.json` 中，有一个 `\"type\"` 属性，它有两个设置：\n\n• `\"commonjs\"\
  `（默认值）：扩展名为 `.js` 或没有扩展名的文件被解释为 CommonJS 模块。\n\n• `\"module\"`：扩展名为 `.js` 或没有扩展名的文件被解释为\
  \ ESM 模块。\n\n### 24.9.3.2 将非文件源代码解释为 CommonJS 或 ESM\n\n并不是所有由 Node.js 执行的源码都来自文件。你也可以通过\
  \ `stdin`、`--eval` 和 `--print` 发送代码。命令行选项 `--input-type` 允许你指定如何解释此类代码：\n\n• 作为\
  \ CommonJS（默认）：`--input-type=commonjs`\n\n• 作为 ESM：`--input-type=module`\n\n## 24.10\
  \ 通过 `import()` 动态加载模块\n\n到目前为止，导入模块的唯一方法是通过 `import` 语句。该语句有几个局限性：\n\n• 你必须在模块的顶层使用它。也就是说，例如，你不能在块内部导入\
  \ `some-thing`。\n\n• 模块限定符总是固定的。这意味着，你不能根据条件更改你导入的内容。你无法动态地组装限定符。\n\n`import()`\
  \ 操作符改变了这一点。让我们来看一个它的使用示例。\n\n### 24.10.1 示例：动态加载模块\n\n考虑以下文件：\n\n`lib/my-math.mjs`\n\
  `main1.mjs`\n`main2.mjs`\n\n我们已经看过了模块 `my-math.mjs`：\n\n```\n// 未导出，模块私有\nfunction\
  \ times(a, b) {\n  return a * b;\n}\nexport function square(x) {\n  return times(x,\
  \ x);\n}\nexport const LIGHTSPEED = 299792458;\n```\n\n这是在 `main1.mjs` 中使用 `import()`\
  \ 的样子：\n\n```javascript\nconst dir = './lib/';\nconst moduleSpecifier = dir + 'my-math.mjs';\n\
  \nfunction loadConstant() {\n  return import(moduleSpecifier)\n    .then(myMath\
  \ => {\n      const result = myMath.LIGHTSPEED;\n      assert.equal(result, 299792458);\n\
  \      return result;\n    });\n}\n```\n\n`.then()` 方法是 Promises 的一部分，是一种处理异步结果的机制，将在书中后部分介绍。\n\
  \n这段代码中有两点之前是不可能的：\n\n• 我们在函数内部导入（而不是在顶层）。\n\n• 模块限定符来自一个变量。\n\n接下来，我们将在 `main2.mjs`\
  \ 中实现相同的功能，但通过 `import()`：\n\n```javascript\nconst dir = './lib/';\nconst moduleSpecifier\
  \ = dir + 'my-math.mjs';\n\n// 22824 Modules\nfunction loadConstant() {\n  return\
  \ import(moduleSpecifier)\n    .then(myMath => {\n      const result = myMath.LIGHTSPEED;\n\
  \      assert.equal(result, 299792458);\n      return result;\n    });\n}\n```\n\
  \n等等，为什么 `import()` 是操作符而不是函数？尽管它的工作方式非常像函数，但它需要知道是从哪个模块被调用的。\n\n### 24.10.2 `import()`\
  \ 的用例\n\n#### 24.10.2.1 按需加载代码\nWeb 应用的功能不需要在启动时存在，`import()` 可以按需加载。例如：\n\n```javascript\n\
  button.addEventListener('click', () => {\n  import('./dialogBox.js')\n    .then(dialogBox\
  \ => {\n      dialogBox.open();\n    });\n});\n```\n\n#### 24.10.2.2 模块的条件加载\n有时你可能根据条件是否真来加载模块。例如，在旧平台上加载\
  \ polyfill：\n\n```javascript\nif (isLegacyPlatform()) {\n  import('...');\n}\n```\n\
  \n#### 24.10.2.3 计算出的模块限定符\n对于国际化等应用，如果可以动态模块限定符会有帮助：\n\n```javascript\nimport(`messages_${getLocale()}.js`);\n\
  ```\n\n## 24.11 预览：import.meta.url\n\n[“import.meta”](https://github.com/tc39/proposal-import-meta)\
  \ 是 Dominic Denicola 提出的 ECMAScript 特性。`import.meta` 对象持有当前模块的元数据。\n\n它最重要的属性是 `import.meta.url`，它包含一个当前模块\
  \ URL 的字符串。例如：\n\n`'https://example.com/code/main.mjs'`\n\n### 24.11.1 import.meta.url\
  \ 和 class URL\n\n`URL` 类在浏览器和 Node.js 中通过全局变量可用。你可以在[Node.js 文档](https://nodejs.org/api/url.html#url_class)\
  \ 中查询它的完整功能。在处理 `import.meta.url` 时，它的构造函数特别有用：\n\n`new URL(input: string, base?:\
  \ string|URL)`\n\n参数 `input` 包含要解析的 URL。如果提供了第二个参数 `base`，它可以是相对的。换句话说——此构造函数允许我们相对于基础\
  \ URL 解析相对路径：\n\n```javascript\n> new URL('other.mjs', 'https://example.com/code/main.mjs').href\n\
  'https://example.com/code/other.mjs'\n\n> new URL('../other.mjs', 'https://example.com/code/main.mjs').href\n\
  'https://example.com/other.mjs'\n```\n\n这就是我们如何获取一个指向当前模块旁边文件 `data.txt` 的 `URL`\
  \ 实例：\n\n```javascript\n// 230 24 Modules\nconst urlOfData = new URL('data.txt',\
  \ import.meta.url);\n```\n\n### 24.11.2 Node.js 中的 import.meta.url\n\n在 Node.js\
  \ 中，`import.meta.url` 总是带有 `file:` URL 的字符串。例如：\n\n`'file:///Users/rauschma/my-module.mjs'`\n\
  \n#### 24.11.2.1 示例：读取模块的兄弟文件\n\n许多 Node.js 文件系统操作都接受路径字符串或 `URL` 实例。\n\n\n\n\n\n\
  这允许我们读取当前模块的兄弟文件 `data.txt`：\n\n```javascript\nimport {promises as fs} from 'fs';\n\
  \nasync function main() {\n  const urlOfData = new URL('data.txt', import.meta.url);\n\
  \  const str = await fs.readFile(urlOfData, {encoding: 'UTF-8'});\n  assert.equal(str,\
  \ 'This is textual data.\\n');\n}\n\nmain();\n```\n\n`main()` 是一个 `async` 函数，如 `$full`\
  \ 中解释的那样。\n\n[fs.promises](https://nodejs.org/api/fs.html#fs_fs_promises_api) 包含了基于\
  \ `Promise` 的 `fs` API 版本，可以与 `async` 函数一起使用。\n\n### 24.11.2.在 file: URL 和路径之间转换\n\
  \n[Node.js 模块 `url`](https://nodejs.org/api/url.html) 有两个用于在 `file:` URL 和路径之间转换的函数：\n\
  \n• `fileURLToPath(url: URL|string): string`: 将 `file:` URL 转换为路径。\n• `pathToFileURL(path:\
  \ string): URL`: 将路径转换为 `file:` URL。\n\n如果你需要一个可以在本地文件系统中使用的路径，那么 `URL` 实例的 `.pathname`\
  \ 属性并不总是有效：\n\n```javascript\nassert.equal(\n  new URL('file:///tmp/with%20space.txt').pathname,\
  \ '/tmp/with%20space.txt');\n```\n\n因此，使用 `fileURLToPath()` 更好：\n\n```javascript\n\
  import * as url from 'url';\n\nassert.equal(\n  url.fileURLToPath('file:///tmp/with%20space.txt'),\
  \ '/tmp/with space.txt'); // Unix 上的结果\n```\n\n同样，`pathToFileURL()` 的功能不仅仅是在绝对路径前面加上\
  \ `'file://`。\n\n### 24.12 快速参考：导出和导入\n\n#### 24.12.11 导出\n\n```javascript\n// 从另一个模块重新导出\n\
  export * from './some-module.mjs';\nexport {foo, b as bar} from './some-module.mjs';\n\
  \n// 命名导出\nexport {foo, b as bar};\nexport function f() {}\nexport const one = 1;\n\
  \n// 默认导出\nexport default function f() {} // 带可选名称的声明\n// `const` 的替换（必须恰好有一个值）\n\
  export default 123;\n```\n\n#### 24.12.2 导入\n\n```javascript\n// 空导入（用于带有副作用的模块）\n\
  import './some-module.mjs';\n\n// 默认导入\nimport someModule from './some-module.mjs';\n\
  // 命名导入\nimport * as someModule from './some-module.mjs';\n// 命名导入\nimport {foo,\
  \ bar as b} from './some-module.mjs';\n\n// 组合：\nimport someModule, * as someModule\
  \ from './some-module.mjs';\nimport someModule, {foo, bar as b} from './some-module.mjs';\n\
  ```\n\n![](img/image01395.jpeg)![](img/image01396.jpeg)\n![](img/image01397.jpeg)\
