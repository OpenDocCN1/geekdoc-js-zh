  \ 函数添加到页面的 `body` 标签中，以确保它在页面加载完成后运行。使用以下语法：\n\n```html\n<body onload=\"preload_images();\"\
  >\n```\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 87 |\n|  |  |  |\n|  |\
  \  |  |\n\n- 一旦你验证图像切换仍然按预期工作，扩展你的 `preload_images` 函数以定义一个要预加载的图像数组，然后使用 `for`\
  \ 循环遍历数组并将每个图像分配给对象变量的 `src` 属性。提示：对象变量可以是任何可以存储信息的内容——例如数组元素。\n- 在浏览器中检查你的工作。\n\
