  \ 属性按确定顺序列出\n\n对象的自身的（非继承的）属性总是按照以下顺序列出：\n\n- 包含整数索引的字符串键属性（包括数组索引）：按数字升序排列\n- 剩余的字符串键属性：按它们被添加的顺序排列\n\
