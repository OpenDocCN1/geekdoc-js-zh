  \n查看测验应用。\n\n# 18 字符串\n\n# 第 19 章：使用模板字面量和标签模板\n\n## 目录\n\n![](img/image01393.jpeg)\n\
  \n*   19.1 消除歧义：“template（模板）”\n*   19.2 模板字面量\n*   19.3 标签模板\n*   19.3.1 熟式（Cooked）与原始（raw）模板字符串（高级）\n\
  *   19.3.2 标签函数库：lit-html\n*   19.3.3 标签函数库：re-template-tag\n*   19.3.4 标签函数库：graphql-tag\n\
  *   19.4 原始字符串字面量\n*   19.5 （高级）\n*   19.6 多行模板字面量和缩进\n*   19.6.1 修复：用于取消缩进的模板标签\n\
  *   19.6.2 修复：`.trim()`\n*   19.7 通过模板字面量进行简单模板化\n*   19.7.1 一个更复杂的示例\n*   19.7.2\
  \ 简单的 HTML 转义\n\n在我们深入研究模板字面量（template literal）和标签模板（tagged template）这两个特性之前，让我们先检查一下“template（模板）”一词的多种含义。\n\
  \n## 19.1 消除歧义：“template”\n\n尽管以下三者的名称中都包含 \"template\"，并且看起来很相似，但它们有显著不同：\n\n*\
  \   文本模板是从数据到文本的函数。它经常用于 Web 开发，并且通常通过文本文件定义。例如，以下文本定义了 [Handlebars](https://handlebarsjs.com)\
  \ 库的模板：\n\n```html\n<div class=\"entry\">\n<h1>{{title}}</h1>\n<div class=\"body\"\
  >\n{{body}}\n</div>\n</div>\n```\n\n这个模板有两个空白处需要填充：`title` 和 `body`。它的用法如下：\n\n\
  ```javascript\n// 第一步：获取模板文本，例如从文本文件中获取。 \nconst tmplFunc = Handlebars.compile(TEMPLATE_TEXT);\
  \  // 编译字符串\nconst data = {title: 'My page', body: 'Welcome to my page!'}; \nconst\
  \ html = tmplFunc(data);\n```\n\n*   模板字面量与字符串字面量类似，但具有额外的功能。例如，插值。它由反引号分隔：\n\n\
  ```javascript\nconst num = 5;\nassert.equal(`Count: ${num}!`, 'Count: 5!');\n```\n\
  \n*   在语法上，标签模板是一个跟在函数（或者准确说是求值为函数的表达式）后面的模板字面量。这会导致函数被调用。它的参数源自模板字面量的内容。\n\n```javascript\n\
  const getArgs = (...args) => args;\nassert.deepEqual(\n  getArgs`Count: ${5}!`,\n\
  \  [['Count: ', '!'], 5]\n);\n```\n\n注意 `getArgs()` 同时接收字面量的文本和通过 `${}` 插值的数据。\n\
  \n## 19.2 模板字面量\n\n与普通的字符串字面量相比，模板字面量有两个新特性。\n\n首先，它支持字符串插值：如果你在 `${}` 中放入一个动态计算的值，它会被转换为字符串并插入到该字面量返回的字符串中。\n\
  \n```javascript\nconst MAX = 100;\nfunction doSomeWork(x) {\n  if (x > MAX) {\n\
  \    throw new Error(`At most ${MAX} allowed: ${x}!`);\n  }\n  // ···\n}\nassert.throws(\n\
  \  () => doSomeWork(101),\n  {message: 'At most 100 allowed: 101!'}\n);\n```\n\n\
  其次，模板字面量可以跨多行：\n\n```javascript\nconst str = `this is\na text with\nmultiple lines`;\n\
  ```\n\n模板字面量始终产生字符串。\n\n## 19.3 标签模板\n\n行 A 中的表达式是一个标签模板。它等同于使用行 B 列出的参数调用 `tagFunc()`。\n\
  \n```javascript\nfunction tagFunc(...args) {\n  return args;\n}\n\nconst setting\
  \ = 'dark mode';\nconst value = true;\n\nassert.deepEqual(\n  tagFunc`Setting ${setting}\
  \ is ${value}!`, // (A)\n  [['Setting ', ' is ', '!'], 'dark mode', true] // (B)\n\
  );\n```\n\n反引号之前的函数被称为标签函数（tag function）。它的参数是：\n\n*   模板字符串（第一个参数）：一个包含 `${}` 周围文本片段的数组。在示例中：`['Setting\
  \ ', ' is ', '!']`\n*   替换值（剩余参数）：插值。在示例中：`'dark mode'` 和 `true`\n\n字面量的静态（固定）部分（模板字符串）与动态部分（替换值）分开。标签函数可以返回任意值。\n\
  \n### 19.3.1 熟式（Cooked）与原始（raw）模板字符串（高级）\n\n到为止，我们只看到了模板字符串的熟式解释。但标签函数实际上有两种解释：\n\
  \n*   熟式解释，其中反斜杠具有特殊含义。例如：`\\t` 产生一个制表符。这种模板字符串的解释存储在第一个参数的数组中。\n*   原始（raw）解释，其中反斜杠没有意义。例如：`\\\
  t` 产生两个字符——一个反斜杠和一个 at。这种模板字符串的解释存储在第一个参数（数组）的 `.raw` 属性中。\n\n下面的标签函数 `cookedRaw`\
  \ 使用了这两种解释：\n\n```javascript\nfunction cookedRaw(templateStrings, ...substitutions)\
  \ {\n  return {\n    cooked: [...templateStrings], // 复制数组元素\n    raw: templateStrings.raw,\n\
  \    substitutions,\n  };\n}\n\nassert.deepEqual(\n  cookedRaw`\\tab${'subst'}\\\
  newline\\\\`,\n  {\n    cooked: ['\\t', '\\newline\\\\'],\n    raw: ['\\\\tab',\
  \ '\\\\newline\\\\\\\\'],\n    substitutions: ['subst'],\n  }\n);\n```\n\n原始解释通过\
  \ `String.raw`（后后描述）和类似的应用实现了原始字符串字面量。标签模板非常支持小型嵌入语言（所谓的领域特定语言）。\n\n#### 19.3.2\
  \ 标签函数库：lit-html\n\n[lit-html](https://github.com/Polymer/lit-html) 是一个基于标签模板的模板库，被\
  \ [前端](https://www.polymer-project.org/) 框架 Polymer](https://www.polymer-project.org/)\
  \ 使用：\n\n```javascript\nimport {html, render} from 'lit-html';\n\nconst template\
  \ = (items) => html`\n<ul>\n${\n  repeat(items,\n    (item) => item.id,\n    (item,\
  \ index) => html`<li>${index}. ${item.name}</li>`\n  )\n}\n</ul>\n`;\n```\n\n`repeat()`\
  \ 是用于循环的自定义函数。它的第 2 个参数为第 3 个参数返回的值生成唯一键。注意该参数使用的嵌套标签模板。\n\n\n\n\n\n### 19.3.3 标签函数库：re-template-tag\n\
  \n[`re-template-tag`](https://github.com/rauschma/re-template-tag) 是一个用于组合正则表达式的简单库。使用\
  \ `re` 标记模板会生成正则表达式。其主要优势是你可以通过 `${}`（行 A）插值正则表达式和纯文本：\n\n```javascript\nconst RE_YEAR\
  \ = re`(?<year>[0-9]{4})`;\n\nconst RE_MONTH = re`(?<month>[0-9]{2})`;\n\nconst\
  \ RE_DAY = re`(?<day>[0-9]{2})`;\n\nconst RE_DATE = re`/${RE_YEAR}-${RE_MONTH}-${RE_DAY}/u`;\
  \  // (A)\n```\n\n```javascript\nconst match =  RE_DATE.exec('2017-01-27');\n\n\
  assert.equal(match.groups.year,  '2017');\n```\n\n### 19.3.4 标签函数库：graphql-tag\n\
  \n[graphql-tag 库](https://github.com/apollographql/graphql-tag) 允许你通过标记模板创建 GraphQL\
  \ 查询：\n\n```javascript\nimport gql from 'graphql-tag';\n\nconst query = gql`\n{\n\
  user(id: 5) {\nfirstName\nlastName\n}\n}\n`;\n```\n\n此外，还有用于在 Babel、TypeScript 等环境中预编译此类查询的插件。\n\
  \n### 19.4 原始字符串字面量 (Raw string literals)\n\n原始字符串字面量是通过标签函数 `String.raw` 实现的。在这种字符串字面量中，反斜杠没有特殊作用（例如转义字符等）：\n\
  \n```javascript\nassert.equal(String.raw`\\back`,  '\\\\back');\n```\n\n这在数据包含反斜杠时非常有帮助。例如包含正则表达式的字符串：\n\
  \n```javascript\nconst regex1 =  /^\\./;\n\nconst regex2 = new RegExp('^\\\\.');\n\
  \nconst regex3 = new RegExp(String.raw`^\\.`);\n```\n\n所有三个正则表达式是等。在普通字符串字面量中，你必须写两次反斜杠来对其字面量转义。而在原始字符串字面量中，你不需要这样做。\n\
  \n原始字符串字面量也用于指定 Windows 文件名路径：\n\n```javascript\nconst WIN_PATH =  String.raw`C:\\\
  foo\\bar`;\n\nassert.equal(WIN_PATH,  'C:\\\\foo\\\\bar');\n```\n\n### 19.5 (高级)\n\
  \n其余章节均为高级内容\n\n### 19.9 使用模板字面量和标记模板\n\n### 19.6 多行模板字面量和缩进\n\n如果你在模板字面量中放置多行文本，两个目标会产生冲突：一方面，模板字面量应该缩进以适应源代码；另一方面，其内容的每一行应该从最左侧列开始。\n\
  \n例如：\n\n```javascript\nfunction div(text) {\nreturn `\n\n<<div>\n\n${text}\n\n\
  </</div>>\n\n`;\n}\n\nconsole.log('Output:');\n\nconsole.log(\ndiv('Hello!')\n•\
  \ 将空格替换为中点:\n.replace(/ /g, '·')\n• 将 \\n 替换为 #\\n:\n.replace(/\\n/g, '#\\n')\n\
  );\n```\n\n由于缩进的原因，模板字面量可以很好地融入源代码。遗憾的是，输出也被缩进了。而且我们不希望开头有返回，结尾处有返回加两个空格。\n\n输出：\n\
  \n```\n#\n····<div>#\n······Hello!#\n····</div>#\n··\n```\n\n有两种方法可以修复：通过标记模板或通过裁剪（trim）模板字面量的结果。\n\
  \n#### 19.6.1 修复方法：用于取消缩进的模板标签\n\n第一种修复方法是使用自定义模板标签来移除不需要的空白。它利用初始换行符后的第一行来确定文本开始的列，并缩短各的缩进。它还删除了最开头的换行符和最后的缩进。其中一个模板标签是\
  \ [Desmond Brand 提供的 dedent](https://github.com/dmnd/dedent)：\n\n```javascript\n\
  import dedent from 'dedent';\n\nfunction divDedented(text) {\nreturn dedent`\n\n\
  <div>\n\n${text}\n\n</div>\n\n`.replace(/\\n/g, '#\\n');\n}\n\nconsole.log('Output:');\n\
  \nconsole.log(divDedented('Hello!'));\n```\n\n这一次，输出没有被缩进：\n\n输出：\n\n```\n<div>#\n\
  Hello!#\n</div>\n```\n\n#### 19.6.2 修复方法：.trim()\n\n第二种修复方法更快，但也更粗暴：\n\n```javascript\n\
  function divDedented(text) {\nreturn `\n\n<div>\n\n${text}\n\n</div>\n\n`.trim().replace(/\\\
  n/g, '#\\n');\n}\n\nconsole.log('Output:');\n\nconsole.log(divDedented('Hello!'));\n\
  ```\n\n字符串方法 `.trim()` 移除开头和结尾多余的空白，但内容本身必须从最左侧列开始。这种解决方案的优点是不需要自定义标签函数。缺点是它看起来很难看。\n\
  \n输出与 `dedent` 相同：\n\n输出：\n\n```\n<div>#\nHello!#\n</div>\n```\n\n### 19.7 通过模板字面量进行简单的模板化\n\
  \n虽然模板字面量看起来像文本模板，但如何用它们进行（文本）模板化并不而易见：文本模板从对象获取数据，而模板字面量从变量获取数据。解决方案是在函数体中使用模板字面量，该函数的参数接收模板化数据。例如：\n\
  \n```javascript\nconst tmpl = (data) => `Hello  ${data.name}!`;\n\nassert.equal(tmpl({name:\
  \  'Jane'}),  'Hello Jane!');\n```\n\n#### 19.7.1 一个更复杂的示例\n\n作为一个更复杂的示例，我们想要获取一个地址的\
  \ `Array` 并生成一个 HTML 表格。这个 `Array` 是：\n\n```javascript\nconst addresses = [\n{ first:\
  \ '<Jane>', last: 'Bond' },\n{ first: 'Lars', last: '<Croft>' },\n];\n```\n\n生成\
  \ HTML 表格的 `tmpl()` 函数如下：\n\n```javascript\nconst tmpl = (addrs) => `\n\n<table>\n\
  ${addrs.map(\n(addr) =>  `\n<tr>\n<td>${escapeHtml(addr.first)}</td>\n<td>${escapeHtml(addr.last)}</td>\n\
  </tr>\n`.trim()\n).join('')}\n</table>\n\n`.trim();\n```\n\n这段代码包含两个模板化函数：\n- 第一个函数（第\
  \ 1 行）接收 `addrs`（一个 `Array`），并返回一个带有表格（`<table>`）的字符串。\n- 第二个函数（第 4 行）接收 `addr`（一个\
  \ `object`），并返回一个带有行（`<tr>`）的字符串。\n- 注意结尾处的 `.trim()`（第 10 行），它移除了不必要的空白。\n- 第一个模板化函数通过将第二个模板化函数映射到\
  \ `addrs` 的每个元素，并将 `Array` 包在 `<table>` 中来生成结果。\n\n让我们使用 `addresses` 调用 `tmpl()`\
  \ 并打印结果：\n\n```javascript\nconsole.log(tmpl(addresses));\n```\n\n输出是：\n\n```\n<table><tr><td>Jane</td><td>Bond</td></tr><tr><td>Lars</td><td>Croft</td></tr></table>\n\
  ```\n\n#### 19.7.2 简单的 HTML 转义 (Escaping)\n\n以下函数对纯文本进行转义，使其在 HTML 中原样显示：\n\n```javascript\n\
  function escapeHtml(str) {\nreturn str\n.replace(/&/g, '&amp;')\n.replace(/>/g,\
  \ '&gt;')\n.replace(/</g, '&lt;')\n.replace(/\"/g, '&quot;')\n.replace(/'/g, '&#39;')\n\
  .replace(/`/g, '&#96;');\n}\n```\n\n```javascript\nassert.equal(escapeHtml('Rock\
  \ & Roll'),  'Rock &amp; Roll');\nassert.equal(escapeHtml('<blank>'),  '&lt;blank&gt;');\n\
  ```\n\n### 20 符号 (Symbols)\n\n### 20.1 符号的用例\n\n符号是通过工厂函数 `Symbol()` 创建的原始值：\n\n\
  ```javascript\nconst mySymbol =  Symbol('mySymbol');\n```\n\n参数是可选的，并提供一个描述，主要用于调试。\n\
  \n一方面，符号类似于对象，因为每个由 `Symbol()` 创建的值都是唯一的，且不通过值进行比较：\n\n```javascript\nSymbol() ===\
  \ Symbol()\nfalse\n```\n\n\n\n另一方面，它们的行为也像原始值。必须通过 `typeof` 来进行分类：\n\n```javascript\n\
  const sym = Symbol();\n\nassert.equal(typeof sym, 'symbol');\n```\n\n并且它们可以作为对象的属性键：\n\
  \n```javascript\nconst obj = {\n  [sym]: 123,\n};\n```\n\n# 20.1 Symbols 的用例\n\n\
  符号的主要用例有：\n\n* 常量的值\n* 唯一的属性键\n\n## 20.1.1 Symbols：常量的值\n\n假设你想创建代表红、橙、黄、绿、蓝、紫颜色的常量。实现这一目标的一种简单方法是使用字符串：\n\
  \n```javascript\nconst COLOR_BLUE = 'Blue';\n```\n\n优点是记录该常量会产生有用的输出。缺点是，存在将无关无关的值误认为颜色的风险，因为两个内容相同的字符串被认为是相等的：\n\
  \n```javascript\nconst MOOD_BLUE = 'Blue';\nassert.equal(COLOR_BLUE, MOOD_BLUE);\n\
  ```\n\n我们可以通过符号来解决这个问题：\n\n```javascript\nconst COLOR_BLUE = Symbol('Blue');\nconst\
  \ MOOD_BLUE = Symbol('Blue');\nassert.notEqual(COLOR_BLUE, MOOD_BLUE);\n```\n\n\
  让我们使用符号为值的常量来实现一个函数：\n\n```javascript\nconst COLOR_RED = Symbol('Red');\nconst COLOR_ORANGE\
  \ = Symbol('Orange');\nconst COLOR_YELLOW = Symbol('Yellow');\nconst COLOR_GREEN\
  \ = Symbol('Green');\nconst COLOR_BLUE = Symbol('Blue');\nconst COLOR_VIOLET = Symbol('Violet');\n\
  \nfunction getComplement(color) {\n  switch (color) {\n    case COLOR_RED:\n   \
  \   return COLOR_GREEN;\n    case COLOR_ORANGE:\n      return COLOR_BLUE;\n    case\
  \ COLOR_YELLOW:\n      return COLOR_VIOLET;\n    case COLOR_GREEN:\n      return\
  \ COLOR_RED;\n    case COLOR_BLUE:\n      return COLOR_ORANGE;\n    case COLOR_VIOLET:\n\
  \      return COLOR_YELLOW;\n    default:\n      throw new Exception('Unknown color:\
  \ ' + color);\n  }\n}\n\nassert.equal(getComplement(COLOR_YELLOW), COLOR_VIOLET);\n\
  ```\n\n## 20.1.2 Symbols：唯一的属性键\n\n对象中属性（字段）的键在两个级别使用：\n\n* 程序在基础级别运行。该层级的键反映了程序所解决的问题。\n\
  * 库和 ECMAScript 在元级别运行。该层级的键被用于操作基础级别数据和代码的服务。使用。其中一个键就是 `'toString'`。\n\n以下代码演示了区别：\n\
  \n```javascript\nconst pt = {\n  x: 7,\n  y: 4,\n  toString() {\n    return `(${this.x},\
  \ ${this.y})`;\n  },\n};\n\nassert.equal(String(pt), '(7, 4)');\n```\n\n属性 `.x`\
  \ 和 `.y` 存在于基础级别。它们持有 `pt` 所代表的点坐标，并用于解决问题——对点的计算。方法 `.toString()` 存在于元级别。它被 JavaScript\
  \ 用于将此对象转换为字符串。\n\n元级别的属性绝不能干扰基础级别的属性。也就是说，它们的键绝不能重叠。当语言和库都贡献于元级别时，这是困难的。例如，现在不可能给新的元级别方法起简单的名称（如\
  \ `toString`），因为它们可能与现有的基础级别名称冲突。Python 对此问题的解决方案是在特殊名称前后加上两个下划线：`__init__`、`__iter__`、`__hash__`\
  \ 等。然而，即使有了这种解决方案，库仍然拥有自己的元级别属性，因为这些属性可能与未来的语言属性冲突。\n\n作为属性键使用的符号在这里帮助我们解决了问题：每个符号都是唯一的，且符号键永远不会与其他字符串键或符号键冲突。\n\
  \n### 20.1.2.1 示例：带有元级别方法的库\n\n作为一个示例，假设我们正在编写一个库，如果对象实现了特殊方法，则对它们进行不同的处理。这就是为此类方法定义属性键并在对象中实现它的样子：\n\
  \n```javascript\nconst specialMethod = Symbol('specialMethod');\nconst obj = {\n\
  \  _id: 'kf12oi',\n  [specialMethod]() { // (A)\n    return this._id;\n  }\n};\n\
  \nassert.equal(obj[specialMethod](), 'kf12oi');\n```\n\n行 A 中的方括号允许我们指定该方法必须具有键\
  \ `specialMethod`。更多细节请见 §25.5.2 “计算属性键”。\n\n# 20.2 公共符号\n\n在 ECMAScript 中起特殊作用的符号称为公共符号。示例包括：\n\
  \n* `Symbol.iterator`：使对象变为可迭代的（`iterable`）。它是返回迭代器的方法的键。关于此主题的更多信息，请参见 `$full`。\n\
  * `Symbol.hasInstance`：自定义 `instanceof` 的工作方式。如果对象实现了带有该键的方法，它就可以用于该运算符的右侧。例如：\n\
  \n```javascript\nconst PrimitiveNull = {\n  Symbol.hasInstance {\n    return x ===\
  \ null;\n  }\n};\n\nassert.equal(null instanceof PrimitiveNull, true);\n```\n\n\
  * `Symbol.toStringTag`：影响默认的 `.toString()` 方法。\n\n```javascript\n> String({})\n\
  '[object Object]'\n> String({ [Symbol.toStringTag]: 'is no money' })\n'[object is\
  \ no money]'\n```\n\n注意：通常重写 `.toString()` 更好。\n\n## 练习：公共符号\n\n* `Symbol.toStringTag`:\
  \ `exercises/symbols/to_string_tag_test.mjs`\n* `Symbol.hasInstance`: `exercises/symbols/has_instance_test.mjs`\n\
  \n# 20.3 转换符号\n\n如果将符号 `sym` 转换为另一种原始类型会发生什么？表 20.1 提供了答案。\n\n表 20.1：符号转换为其他原始类型的结果。\n\
  \n| 转换为 | 显式转换 | 强制转换（隐式转换） |\n| :--- | :--- | :--- |\n| 布尔值 | `Boolean(sym)` →\
  \ OK | `!sym` → OK |\n| 数字 | `Number(sym)` → TypeError | `sym*2` → TypeError |\n\
  | 字符串 | `String(sym)` → OK | `''+sym` → TypeError |\n| | `sym.toString()` → OK |\
  \ `${sym}` → TypeError |\n\n使用符号的一个关键陷阱是在将其转换为其他内容时抛出异常的频率。这背后的逻辑是什么？首先，转换为数字永远没有意义并且应该被警告。其次，将符号转换为字符串对于诊断输出确实很有用。但警告无意将符号转换为字符串（另一种类型的属性键）也是有意义的：\n\
  \n```javascript\nconst obj = {};\nconst sym = Symbol();\nassert.throws(\n  () =>\
  \ { obj['__'+sym+'__'] = true },\n  { message: 'Cannot convert a Symbol value to\
  \ a string' }\n);\n```\n\n缺点是异常使得处理符号变得更加复杂。当你通过 `+` 运算符组装字符串时，你必须显式转换符号：\n\n* `const\
  \ mySymbol = Symbol('mySymbol');`\n* `'Symbol I used: ' + mySymbol`\n`TypeError:\
  \ Cannot convert a Symbol value to a string`\n\n`> 'Symbol I used: ' + String(mySymbol)`\n\
  `'Symbol I used: Symbol(mySymbol)'`\n\n# 第 V 部分：控制流与数据流\n\n# 第 21 章：控制语句\n\n## 21.1\
  \ 控制循环：break 和 continue\n\n### 21.1.1 break\n### 21.1.2 break 加上标签：离开任何标签语句\n###\
  \ 21.1.3 continue\n\n## 21.2 if 语句\n\n### 21.2.1 if 语句的语法\n\n## 21.3 switch 语句\n\
  \n### 21.3.1 switch 语句的第一个示例\n### 21.3.2 别忘记 return 或 break！\n### 21.3.3 空 case\
  \ 子句\n### 21.3.4 通过 default 子句检查非法值\n\n## 21.4 while 循环\n\n\n\n\n\n# 21 控制流语句\n\n\
  本章涵盖了以下控制流语句：\n\n- `if` 语句 (ES1)\n- `switch` 语句 (ES3)\n- `while` 循环 (ES1)\n- `do-while`\
  \ 循环 (ES3)\n- `for` 循环 (ES1)\n- `for-of` 循环 (ES6)\n- `for-await-of` 循环 (ES2018)\n\
  - `for-in` 循环 (ES1)\n\n在介绍实际控制流语句之前，让我们来看两个控制循环的运算符。\n\n## 21.1 控制循环：`break` 和 `continue`\n\
  \n`break` 和 `continue` 两个运算符可以在循环或其他语句内部用于控制这些语句的执行。\n\n### 21.1.1 `break`\n\n`break`\
  \ 有两个版本：一个带操作数和一个不带操作数。后者适用于以下语句：`while`、`do-while`、`for`、`for-of`、`for-await-of`、`for-in`\
  \ 和 `switch`。它会立即离开当前语句：\n\n```javascript\nfor (const x of ['a',  'b', 'c']) {\n\
  \  console.log(x);\n  if (x === 'b') break;\n  console.log('---')\n}\n```\n\n- 输出：\n\
  \  - 'a'\n  - '---'\n  - 'b'\n\n### 21.1.2 带标签的 `break`：离开任何带标签的语句\n\n带操作数的 `break`\
  \ 处处有效。它的操作数是一个标签（label）。标签可以放在任何语句前面，包括块。`break foo` 会离开标签为 `foo` 的语句：\n\n```javascript\n\
  foo: { // 标签\n  if (condition) break foo;  // 标签 break  // ··\n}\n```\n\n在接下来的示例中，我们使用带标签的\
  \ `break` 在成功时（A 行）以不同的方式离开循环。然后我们跳过紧跟在循环之后的的内容，那是我们在失败时会到达的地方。\n\n```javascript\n\
  function findSuffix(stringArray, suffix) {\n  let result;\n  search_block: {\n \
  \   for (const str of stringArray) {\n      if (str.endsWith(suffix)) {\n      \
  \  // 成功：result = str;\n        break search_block;  // (A)\n      }\n    } // for\n\
  \    // 失败：\n    result = '(Untitled)';\n  } // search_block\n  return { suffix,\
  \ result };\n  // 等同于：{suffix: suffix, result: result}\n}\n\nassert.deepEqual(\n\
  \  findSuffix(['foo.txt', 'bar.html'], '.html'),  { suffix: '.html', result: 'bar.html'\
  \ }\n);\n\nassert.deepEqual(\n  findSuffix(['foo.txt', 'bar.html'], '.mjs'),  {\
  \ suffix: '.mjs', result: '(Untitled)' }\n);\n```\n\n### 21.1.3 `continue`\n\n`continue`\
  \ 只能在 `while`、`do-while`、`for`、`for-of`、`for-await-of` 和 `for-in` 中工作。它会立即离开当前的循环迭代并继续下一次迭代。例如：\n\
  \n```javascript\nconst lines = [\n  'Normal line',\n  '# Comment',\n  'Another normal\
  \ line',\n];\n\nfor (const line of lines) {\n  if (line.startsWith('#')) continue;\n\
  \  console.log(line);\n}\n```\n\n- 输出：\n  - 'Normal line'\n  - 'Another normal line'\n\
  \n## 21.2 `if` 语句\n\n这是两个简单的 `if` 语句：一个只有一个“then”（那么）分支，另一个既有“then”分支也有“else”（否则）分支：\n\
  \n```javascript\nif (cond) {\n  // then 分支\n}\n\nif (cond) {\n  // then 分支\n} else\
  \ {\n  // else 分支\n}\n```\n\n除了代码块之外，`else` 后面也可以跟另一个 `if` 语句：\n\n```javascript\n\
  if (cond1) {\n  // ··\n} else if (cond2) {\n  // ··\n}\n\nif (cond1) {\n  // ··\n\
  } else if (cond2) {\n  // ··\n} else {\n  // ··\n}\n```\n\n你可以通过更多的 `else if` 继续这个链。\n\
  \n### 21.2.1 `if` 语句的语法\n\n`if` 语句的通用语法是：\n\n`if (cond) «then_statement» else «else_statement»`\n\
  \n到目前为止，`then_statement` 始终是一个块，但我们可以使用任何语句。该语句必须以分号结束：\n\n```javascript\nif (true)\
  \ console.log('Yes'); else console.log('No');\n```\n\n这意味着 `else if` 并不是一个独立的结构，它仅仅是一个\
  \ `else_statement` 为另一个 `if` 语句的 `if` 语句。\n\n## 21.3 `switch` 语句\n\n`switch` 语句如下：\n\
  \n```javascript\nswitch (`switch_expression`) {\n  «switch_body»\n}\n```\n\n`switch`\
  \ 体由零或多个 `case` 子句组成：\n\n```javascript\ncase «case_expression»:\n  «statements»\n\
  ```\n\n以及可选的 `default` 子句：\n\n```javascript\ndefault:\n  «statements»\n```\n\n`switch`\
  \ 的执行方式如下：\n\n- 它评估 `switch` 表达式。\n- 跳转到第一个表达式与 `switch` 表达式结果相同的 `case` 子句。\n-\
  \ 否则——如果没有这样的子句，则跳转到 `default` 子句。\n- 否则——如果没有 `default` 子句，则它什么都不做。\n\n### 21.3.1\
  \ `switch` 语句的第一个示例\n\n让我们来看一个例子：以下函数将 1–7 的数字转换为星期几的名称。\n\n```javascript\nfunction\
  \ dayOfTheWeek(num) {\n  switch (num) {\n    case 1: return 'Monday';\n    case\
  \ 2: return 'Tuesday';\n    case 3: return 'Wednesday';\n    case 4: return 'Thursday';\n\
  \    case 5: return 'Friday';\n    case 6: return 'Saturday';\n    case 7: return\
  \ 'Sunday';\n  }\n}\n\nassert.equal(dayOfTheWeek(5), 'Friday');\n```\n\n### 21.3.2\
  \ 别忘记 `return` 或 `break`！\n\n在 `case` 子句的结束，执行将继续到下一个 `case` 子句——除非你使用了 `return`\
  \ 或 `break`。例如：\n\n```javascript\nfunction englishToFrench(english) {\n  let french;\n\
  \  switch (english) {\n    case 'hello':\n      french = 'bonjour';\n    case 'goodbye':\n\
  \      french = 'au revoir';\n  }\n  return french;\n}\n\n// 结果应该是 'bonjour'！\n\
  assert.equal(englishToFrench('hello'), 'au revoir');\n```\n\n也就是说，我们对 `dayOfTheWeek()`\
  \ 的实现之所以有效，是因为我们使用了 `return`。\n\n我们可以通过 `break` 来修复 `englishToFrench()`：\n\n```javascript\n\
  function englishToFrench(english) {\n  let french;\n  switch (english) {\n    case\
  \ 'hello':\n      french = 'bonjour';\n      break;\n    case 'goodbye':\n     \
  \ french = 'au revoir';\n      break;\n  }\n  return french;\n}\n\nassert.equal(englishToFrench('hello'),\
  \ 'bonjour'); // ok\n```\n\n### 21.3.3 空 `case` 子句\n\n`case` 子句的语句可以省略，这实际上为我们每个每个\
  \ `case` 子句提供了多个 `case` 表达式：\n\n```javascript\nfunction isWeekDay(name) {\n  switch\
  \ (name) {\n    case 'Monday':\n    case 'Tuesday':\n    case 'Wednesday':\n   \
  \ case 'Thursday':\n    case 'Friday':\n      return true;\n    case 'Saturday':\n\
  \    case 'Sunday':\n      return false;\n  }\n}\n\nassert.equal(isWeekDay('Wednesday'),\
  \ true);\nassert.equal(isWeekDay('Sunday'), false);\n```\n\n### 21.3.4 通过 `default`\
  \ 子句检查非法值\n\n如果 `switch` 表达式没有其他匹配项，则跳转到 `default` 子句。这使得它对于错误检查有用：\n\n```javascript\n\
  function isWeekDay(name) {\n  switch (name) {\n    case 'Monday':\n    case 'Tuesday':\n\
  \    case 'Wednesday':\n    case 'Thursday':\n    case 'Friday':\n      return true;\n\
  \    case 'Saturday':\n    case 'Sunday':\n      return false;\n    default:\n \
  \     throw new Error('Illegal value: '+name);\n  }\n}\n\nassert.throws(\n  () =>\
  \ isWeekDay('January'),\n  {message: 'Illegal value: January'}\n);\n```\n\n## 21.4\
  \ `while` 循环\n\n`while` 循环具有以下语法：\n\n```javascript\nwhile (`condition`) {\n  «statements»\n\
  }\n```\n\n在每次循环迭代之前，`while` 会评估 `condition`：\n\n- 如果结果为假，则循环结束。\n- 如果结果为真，则再执行一次\
  \ `while` 主体。\n\n### 21.4.1 `while` 循环的示例\n\n以下代码使用了 `while` 循环。在每次循环迭代中，它通过 `.shift()`\
  \ 移除 `arr` 的第一个元素并打印它。\n\n```javascript\nconst arr = ['a', 'b', 'c'];\n\nwhile (arr.length\
  \ > 0) {\n  console.log(arr.shift());\n}\n```\n\n\n\n\n\n```javascript\nconst elem\
  \ = arr.shift(); // remove first element\nconsole.log(elem);\n```\n\n• 输出:\n• 'a'\n\
  • 'b'\n\n18421 控制流语句\n\n```javascript\n// 'c'\n```\n\n如果条件始终求值为 `true`，那么 `while`\
  \ 就是一个无限循环：\n\n```javascript\nwhile (true) {\n  if (Math.random() === 0) break;\n\
  }\n```\n\n## 21.5 do-while 循环\n\n`do-while` 循环的工作原理与 `while` 非常，但它在每次循环迭代后检查条件（而不是在之前）。\n\
  \n```javascript\nlet input;\n\ndo {\n  input = prompt('Enter text:');\n  console.log(input);\n\
  } while (input !== ':q');\n```\n\n[`prompt()`](https://developer.mozilla.org/en-US/docs/Web/API/Window/prompt)\
  \ 是 Web 浏览器中提供的全局函数。它提示用户输入文本并返回结果。\n\n## 21.6 for 循环\n\n`for` 循环具有如下语法：\n\n```javascript\n\
  for («initialization»; «condition»; «post_iteration») {\n  «statements»\n}\n```\n\
  \n第一行是循环头，控制循环体（循环的剩余部分）的执行频率。它包含三个部分，每个部分都是可选的：\n\n• `initialization`：为循环设置变量等。在这里通过\
  \ `let` 或 `const` 声明的变量仅存在循环内部。\n• `condition`：在每次循环迭代之前检查此条件。如果它为假（falsy），则停止循环。\n\
  • `post_iteration`：在每次循环迭代后执行该代码。\n\n因此，`for` 循环大致等同于以下 `while` 循环：\n\n```javascript\n\
  «initialization»\nwhile («condition») {\n  «statements»\n  «post_iteration»\n}\n\
  ```\n\n### 21.6.1 for 循环示例\n\n例如，这是通过 `for` 循环从零计数到二：\n\n```javascript\nfor (let\
  \ i=0; i<3; i++) {\n  console.log(i);\n}\n```\n\n• 输出:\n• 0\n• 1\n• 2\n\n这是通过 `for`\
  \ 循环记录 `Array` 内容的方法：\n\n```javascript\nconst arr = ['a', 'b', 'c'];\n\nfor (let\
  \ i=0; i<3; i++) {\n  console.log(arr[i]);\n}\n```\n\n• 输出:\n• 'a'\n• 'b'\n• 'c'\n\
  \n如果你省略了头部所有的三个部分，将得到一个无限循环：\n\n```javascript\nfor (;;) {\n  if (Math.random() ===\
  \ 0) break;\n}\n```\n\n## 21.7 for-of 循环\n\n`for-of` 循环遍历一个迭代器（iterable）——一个支持迭代协议的数据容器。\n\
  \n每个迭代值都存储在循环头中指定的变量中：\n\n```javascript\nfor («iteration_variable» of «iterable»)\
  \ {\n  «statements»\n}\n```\n\n迭代变量通常通过变量声明创建：\n\n```javascript\nconst iterable\
  \ = ['hello', 'world'];\n\nfor (const elem of iterable) {\n  console.log(elem);\n\
  }\n```\n\n• 输出:\n• 'hello'\n• 'world'\n\n但你也可以使用已经存在的（可变的）变量：\n\n```javascript\n\
  const iterable = ['hello', 'world'];\n\nlet elem;\n\nfor (elem of iterable) {\n\
  \  console.log(elem);\n}\n```\n\n### 21.7.1 const: for-of vs. for\n\n注意，在 `for-of`\
  \ 循环中，你可以使用 `const`。迭代变量对于每次迭代来说仍然可以是不同的（它只是在迭代期间不能改变）。将其想象为每次都在一个新的作用域中执行一个新的 `const`\
  \ 声明。\n\n相比之下，在 `for` 循环中，如果值发生变化，你必须通过 `let` 或 `var` 声明变量。\n\n### 21.7.2 遍历迭代器\n\
  \n如前所述，`for-of` 适用于任何迭代对象，而不仅仅是 `Arrays`。例如，对于 `Sets`：\n\n```javascript\nconst set\
  \ = new Set(['hello', 'world']);\nfor (const elem of set) {\n  console.log(elem);\n\
  }\n```\n\n### 21.7.3 遍历数组的 [index, element] 对\n\n最后，你也可以使用 `for-of` 来遍历数组的 `[index,\
  \ element]` 条目：\n\n```javascript\nconst arr = ['a', 'b', 'c'];\n\nfor (const [index,\
  \ elem] of arr.entries()) {\n  console.log(`${index} -> ${elem}`);\n}\n```\n\n•\
  \ 输出:\n• '0 -> a'\n• '1 -> b'\n• '2 -> c'\n\n通过 `[index, element]`，我们使用解构来访问 `Array`\
  \ 元素。\n\n## 21.8 for-await-of 循环\n\n`for-await-of` 类似于 `for-of`，但它适用于异步迭代器而不是同步迭代器。它只能在\
  \ `async` 函数和 `async` 生成器中使用。\n\n```javascript\nfor await (const item of asyncIterable)\
  \ {\n  // ···\n}\n```\n\n`for-await-of` 在异步迭代章节中有详细描述。\n\n## 21.9 for-in 循环（避免使用）\n\
  \n建议：不要使用 `for-in` 循环。`for-in` 有多个陷阱。因此，最好的方法是避免它。\n\n这是一个正确使用 `for-in` 的示例，它涉及模板代码（行\
  \ A）：\n\n```javascript\nfunction getOwnPropertyNames(obj) {\n  const result = [];\n\
  \  for (const key in obj) {\n    if ({}.hasOwnProperty.call(obj, key)) { // (A)\n\
  \      result.push(key);\n    }\n  }\n  return result;\n}\n\nassert.deepEqual(\n\
  \  getOwnPropertyNames({ a: 1, b:2 }),\n  ['a', 'b']\n);\n\nassert.deepEqual(\n\
  \  getOwnPropertyNames(['a', 'b']),\n  ['0', '1']); // 字符串！\n```\n\n我们可以在使用 `for-in`\
  \ 的情况下实现相同的功能，这几乎总是更好的：\n\n```javascript\nfunction getOwnPropertyNames(obj) {\n\
  \  const result = [];\n  for (const key of Object.keys(obj)) {\n    result.push(key);\n\
  \  }\n  return result;\n}\n```\n\n## 22 异常处理\n\n本章介绍了 JavaScript 如何处理异常。\n\n###\
  \ 22.1 动机：抛出和异常\n\nJavaScript 直到 ES3 才支持异常。这解释了为什么它们在语言中很少使用。\n\n考虑以下代码。它将文件中的配置读取到一个包含\
  \ `Profile` 实例的 `Array`：\n\n```javascript\nfunction readProfiles(filePaths) {\n\
  \  const profiles = [];\n  for (const filePath of filePaths) {\n    try {\n    \
  \  const profile = readOneProfile(filePath);\n      profiles.push(profile);\n  \
  \  } catch (err) { // (A)\n      console.log('Error in: '+filePath, err);\n    }\n\
  \  }\n}\n\nfunction readOneProfile(filePath) {\n  const profile = new Profile();\n\
  \  const file = openFile(filePath);\n  // ··· (将 `file` 中的数据读取到 `profile`)\n  return\
  \ profile;\n}\n\nfunction openFile(filePath) {\n  if (!fs.existsSync(filePath))\
  \ {\n    throw new Error('Could not find file '+filePath); // (B)\n  }\n  // ···\
  \ (打开路径为 `filePath` 的文件)\n}\n```\n\n让我们看看 B 行发生了什么：发生错误，但处理问题的最佳位置不是当前位置，而是 A 行。在那里，我们可以跳过当前文件并继续处理下一个。\n\
  \n因此：\n\n• 在 B 行，我们使用 `throw` 语句来表示发生了问题。\n• 在 A 行，我们使用 `try-catch` 语句来处理问题。\n\n\
  当我们抛出时，以下结构是激活的：\n\nreadProfiles(···)\nfor (const filePath of filePaths)\ntry\n\
  readOneProfile(···)\nopenFile(···)\nif (!fs.existsSync(filePath))\nthrow\n\n`throw`\
  \ 一个一个退出嵌套结构，直到遇到 `try` 语句。执行在在该 `try` 语句的 `catch` 子句中继续。\n\n### 22.2 throw\n\n\
  这是 `throw` 语句的语法：\n\n```javascript\nthrow «value»;\n```\n\n任何值都可以被抛出，但最好抛出 `Error`\
  \ 实例或其子类的实例。\n\n\n\n\n\n```javascript\nthrow new Error('Problem!');\n```\n\n###\
  \ 22.2.1 创建错误对象的选项\n\n- 使用 `Error` 类。在 JavaScript 中，这比在更静态语言中限制要少，因为你可以为实例添加自定义属性：\n\
  \n```javascript\nconst err = new Error('Could not find the file');\n\nerr.filePath\
  \ = filePath;\n\nthrow err;\n```\n\n- 使用 JavaScript 中 `Error` 的子类之一（后文会列出）。\n- 自定义\
  \ `Error` 的子类。\n\n```javascript\nclass MyError extends Error {\n\n}\n\nfunction\
  \ func() {\n  throw new MyError('Problem!');\n}\n\nassert.throws(\n  () => func(),\n\
  \  MyError\n);\n```\n\n### 22.3 try 语句\n\n`try` 语句的完整版本形式如下：\n\n```javascript\n\
  try {\n  «try_statements»\n} catch (error) { «catch_statements»\n} finally {\n \
  \ «finally_statements»\n}\n```\n\n你可以如下如下组合这些子句：\n\n- `try-catch`\n- `try-finally`\n\
  - `try-catch-finally`\n\n自 ECMAScript 2019 起，如果你对抛出的值感兴趣，可以省略 `catch` 参数 `(error)`。\n\
  \n### 22.3.1 try 块\n\n`try` 块可以被视为语句的体。这是我们执行常规代码的地方。\n\n### 22.3.2 catch 子句\n\n\
  如果异常到达 `try` 块，它将被赋值给 `catch` 子句的参数，并执行该子句中的代码。接下来，执行将在 `try` 语句后正常继续。如果出现以下情况，可能会发生变化：\n\
  \n- `catch` 块内部存在 `return`、`break` 或 `throw`。\n- 存在 `finally` 子句（它在 `try` 语句结束之前始终执行）。\n\
  \n下面的代码证明了 A 行抛出的值确实在 B 行被捕获。\n\n```javascript\nconst errorObject = new Error();\n\
  \nfunction func() {\n  throw errorObject; // (A)\n}\n\ntry {\n  func();\n} catch\
  \ (err) { // (B)\n  assert.equal(err, errorObject);\n}\n```\n\n### 22.3.3 finally\
  \ 子句\n\n`finally` 子句中的代码会在 `try` 语句结束时始终执行——无论 `try` 块或 `catch` 子句发生了什么。\n\n让我们来看\
  \ `finally` 的一个常见用例：你创建了一个资源，并希望在使用完成后始终销毁它——无论在处理过程中发生了什么。你可以这样实现：\n\n```javascript\n\
  const resource = createResource();\n\ntry {\n  // 使用 `resource`。可能会抛出错误。\n} finally\
  \ {\n  resource.destroy();\n}\n```\n\n#### 22.3.3.1 finally 始终执行\n\n`finally` 子句始终会被执行——即使抛出了错误（A\
  \ 行）：\n\n```javascript\nlet finallyWasExecuted = false;\n\nassert.throws(\n  ()\
  \ => {\n    try {\n      throw new Error(); // (A)\n    } finally {\n      finallyWasExecuted\
  \ = true;\n    }\n  },\n  Error\n);\n\nassert.equal(finallyWasExecuted, true);\n\
  ```\n\n即使存在 `return` 语句（A 行）：\n\n```javascript\nlet finallyWasExecuted = false;\n\
  \nfunction func() {\n  try {\n    return; // (A)\n  } finally {\n    finallyWasExecuted\
  \ = true;\n  }\n}\n\nfunc();\n\nassert.equal(finallyWasExecuted, true);\n```\n\n\
  ### 22.4 错误类\n\n`Error` 是所有内置错误类的公共超类。它具有以下子类（我引用了 [ECMAScript 规范](https://tc39.github.io/ecma262/#sec-native-error-types-used-in-this-standard)）：\n\
  \n- `RangeError`：表示一个值不在允许值的集合或范围内。\n- `ReferenceError`：表示检测到无效的引用值。\n- `SyntaxError`：表示发生了解析错误。\n\
  - `TypeError`：用于表示操作失败，当没有其他 `NativeError` 对象能恰当指示失败原因时。\n- `URIError`：表示某个全局 URI\
  \ 处理函数的使用方式与其定义不兼容。\n\n#### 22.4.1 错误对象的属性\n\n考虑 `err`，它是 `Error` 的实例：\n\n```javascript\n\
  const err = new Error('Hello!');\n\nassert.equal(String(err), 'Error: Hello!');\n\
  ```\n\n`err` 的两个属性特别有用：\n\n- `.message`：仅包含错误消息。\n  `assert.equal(err.message, 'Hello!');`\n\
  - `.stack`：包含堆栈跟踪。所有主流浏览器都支持它。\n  ```javascript\n  assert.equal(\n    err.stack,\n\
  \    `\nError: Hello!\nat ch_exception-handling.mjs:1:13\n`.trim()\n  );\n  ```\n\
  \n\n\n\n\n## 23.2.1 函数声明的组成部分\n\n让我们通过一个示例来看函数声明的组成部分：\n\n```javascript\nfunction\
  \ add(x, y) {\n  return x + y;\n}\n```\n\n* `add` 是函数声明的。\n* `add(x, y)` 是函数声明的头部。\n\
  * `x` 和 `y` 是参数。\n* 大括号 `{` 和 `}` 以及它们之间的所有内容是函数声明的函数体。\n\n## 23.2.2 普通函数扮演的角色\n\
  \n考虑上一节中的以下函数声明：\n\n```javascript\nfunction add(x, y) {\n  return x + y;\n}\n```\n\
  \n这个函数声明创建了一个名为 `add` 的普通函数。作为一个一个普通函数，`add()` 可以扮演三种角色：\n\n* **实函数 (Real function)**：通过函数调用执行。\n\
  ```javascript\nassert.equal(add(2, 1), 3);\n```\n* **方法 (Method)**：存储在属性中，通过方法调用执行。\n\
  ```javascript\nconst obj = { addAsMethod: add };\nassert.equal(obj.addAsMethod(2,\
  \ 4), 6);\n```\n* **构造函数/类 (Constructor function/class)**：通过 `new` 执行。\n```javascript\n\
  const inst = new add();\nassert.equal(inst instanceof add, true);\n```\n（顺带提一下，类的名称通常以大字母开头。）\n\
  \n![](img/image01475.jpeg)![](img/image01476.jpeg)\n\n![](img/image01403.jpeg) 普通函数\
  \ vs. 实函数\n\n在 JavaScript 中，我们区分：\n\n* 实体 `普通函数` (ordinary function)\n* 角色 `实函数`\
  \ (real function)，即普通函数扮演的角色\n\n在许多其他编程语言中，函数实体只扮演一个角色——函数。因此，同一个名称 `function` 可以同时用于两者。\n\
  \n## 23.2.3 普通函数的名称\n\n函数表达式的名称仅在函数内部可访问，函数可以使用该名称来引用自身（例如，用于自递归）：\n\n```javascript\n\
  const func = function funcExpr() { return funcExpr };\nassert.equal(func(), func);\n\
  ```\n\n* 名字 `funcExpr` 仅存在于函数内部：`assert.throws(() => funcExpr(), ReferenceError);`\n\
  \n相比之下，函数声明的名称在当前作用域内可访问：\n\n```javascript\nfunction funcDecl() { return funcDecl\
  \ }\n```\n\n* 名字 `funcDecl` 存在于当前作用域 `assert.equal(funcDecl(), funcDecl);`\n\n##\
  \ 23.3 特殊化函数\n\n特殊化函数是普通函数的单一用途版本。它们中的每一个都专注于单一的角色：\n\n* 箭头函数 (arrow function) 的目的是成为一个实函数：\n\
  ```javascript\nconst arrow = () => { return 123 };\nassert.equal(arrow(), 123);\n\
  ```\n* 方法 (method) 的目的是成为一个方法：\n```javascript\nconst obj = { method() { return 'abc'\
  \ } };\nassert.equal(obj.method(), 'abc');\n```\n* 类 (class) 的目的是成为一个构造函数：\n```javascript\n\
  class MyClass { /* ··· */ }\nconst inst = new MyClass();\n```\n\n除了更好的语法，每种特殊化函数还支持新功能，使得它们比普通函数更能胜任工作。\n\
  \n* 箭头函数将在本章稍后部分解释。\n* 方法将在单个对象的章节中解释。\n* 类将在类的章节中解释。\n\n表 23.1 列出了普通函数和特殊化函数的能力。“隐式\
  \ `this`”意味着 `this` 是一个隐式参数。\n\n![](img/image01477.jpeg)\n\n| | 普通函数 | 箭头函数 | 方法\
  \ | 类 |\n| --- | :--- | :--- | :--- | :--- |\n| 函数调用 | 隐式 `this` | ✔ | 隐式 `this`\
  \ | ✘ |\n| 方法调用 | ✔ | ✘ | ✔ | ✘ |\n| 构造调用 | ✔ | ✘ | ✘ | ✔ |\n\n## 23.3.1 特殊化函数仍然是函数\n\
  \n注意的是，箭头函数、方法和类仍然被归类函数：\n\n```javascript\n(() => {}) instanceof Function\ntrue\n\
  ```\n\n```javascript\n({ method() {} }.method) instanceof Function\ntrue\n```\n\n\
  ```javascript\n(class SomeClass {}) instanceof Function\ntrue\n```\n\n## 23.3.2\
  \ 建议：优先使用特殊化函数\n\n通常，你应该优先使用特殊化函数而不是普通函数，特别是类和方法。不过，箭头函数和普通函数之间的选择没有那么明确：\n\n* 箭头函数没有将\
  \ `this` 作为隐式参数。如果你使用实函数，这几乎总是你想要的，因为避免了一个重要的与 `this` 相关的陷阱（详情，请参阅 §25.4.6 “避免 `this`\
  \ 的陷阱”）。\n* 然而，我在语法上喜欢函数声明（它产生一个普通函数）。如果你不在它内部使用 `this`，它大部分等同于 `const` 加上箭头函数：\n\
  \n```javascript\nfunction funcDecl(x, y) {\n  return x * y;\n}\nconst arrowFunc\
  \ = (x, y) => {\n  return x * y;\n};\n```\n\n## 23.3.3 箭头函数\n\n箭头函数添加到 JavaScript\
  \ 有两个原因：\n\n* 提供一种更简洁的创建函数的方法。\n* 让处理实函数变得更容易：你无法在普通函数内部引用周围作用域的 `this`（稍后介绍）。\n\
  \n### 23.3.3.1 箭头函数的语法\n\n让我们回顾匿名函数表达式的语法：\n\n```javascript\nconst f = function\
  \ (x, y, z) { return 123 };\n```\n\n（大致）等价的箭头函数如下。箭头函数是表达式。\n\n```javascript\nconst\
  \ f = (x, y, z) => { return 123 };\n```\n\n在这里，箭头函数的体是一个块。但它也可以是一个表达式。下面的箭头函数工作原理与之前的完全相同。\n\
  \n```javascript\nconst f = (x, y, z) => 123;\n```\n\n如果箭头函数只有一个参数，且该参数是一个标识符（而不是解构模式），那么你可以省略参数周围的括号：\n\
  \n```javascript\nconst id = x => x;\n```\n\n这在将箭头函数作为参数传递给其他函数或方法时非常非常方便：\n\n```javascript\n\
  [1,2,3].map(x => x+1)\n[ 2, 3, 4 ]\n```\n\n上一个示例展示了箭头函数的一个优点——简洁性。如果我们使用函数表达式执行相同的任务，我们的代码会更冗长：\n\
  \n```javascript\n[1,2,3].map(function (x) { return x+1 });\n```\n\n### 23.3.3.2\
  \ 箭头函数：词法作用 `this`\n\n普通函数既可以是方法也可以是实函数。遗憾的是，这两个角色是冲突的：\n\n* 由于每个普通函数都可以是方法，它有自己的\
  \ `this`。\n* 它自己的 `this` 使得无法从普通函数内部访问周围作用域的 `this`。这对于实函数来说是不方便的。\n\n下面的代码演示了这个问题：\n\
  \n```javascript\nconst person = {\n  name: 'Jill',\n  someMethod() {\n    const\
  \ ordinaryFunc = function () {\n      assert.throws(\n        () => this.name, //\
  \ (A)\n        /^TypeError: Cannot read property 'name' of undefined$/);\n    };\n\
  \    const arrowFunc = () => {\n      assert.equal(this.name, 'Jill');  // (B)\n\
  \    };\n    ordinaryFunc();\n    arrowFunc();\n  },\n}\n```\n\n在这段代码中，我们可以观察到处理\
  \ `this` 的两种方式：\n\n* **动态 `this`**：在行 A 中，我们尝试从普通函数访问 `.someMethod()` 的 `this`。在那里，它被函数自己的\
  \ `this` 遮蔽，其值为 `undefined`（由于函数调用）。由于普通函数通过（动态）函数或方法调用接收其 `this`，因此它们的 `this` 被称为动态。\n\
  * **词法 `this`**：在行 B 中，我们再次尝试访问 `.someMethod()` 的 `this`。这次我们成功了，因为箭头函数没有自己的 `this`。`this`\
  \ 是词法解析的，就像任何其他变量一样。这就是为什么箭头函数的 `this` 被称为词法 `this`。\n\n### 23.3.3.3 语法陷阱：从箭头函数返回对象字面量\n\
  \n如果你想让箭头函数的表达式体是一个对象字面量，你必须将该字面量放在括号中：\n\n```javascript\nconst func1 = () => ({a:\
  \ 1});\nassert.deepEqual(func1(), { a: 1 });\n```\n\n如果你不这样做，JavaScript 会认为箭头函数有一个块体（不返回任何内容）：\n\
  \n```javascript\nconst func2 = () => {a: 1};\nassert.deepEqual(func2(), undefined);\n\
  ```\n\n{a: 1} 被解释为带有标签 `a:` 的表达式语句块。在没有显式 `return` 语句的情况下，块体返回 `undefined`。\n\n\n\
  \n\n\n这种陷阱是由语法歧义引起的：对象字面量和代码块具有相同的语法。我们使用括号来告诉 JavaScript 体是一个表达式（对象字面量），而不是一个语句（块）。\n\
  \n关于这种 `this` 意外遮蔽的更多信息，请参阅 §25.4.5 “this pitfall: accidentally shad-owing this”。\n\
  \n## 23.4 更多类型的函数和方法\n\n![](img/image01401.jpeg)[](Images/image01461.jpeg)\n\n![](img/image01409.jpeg)\
  \ 本节是后续内容的总结\n\n本节主要作为当前章节及后续章节的参考。\n\n如果你不能理解所有内容，请不要担心。\n\n到目前为止，我们见过的所有（真实的）函数和方法都是：\n\
  \n• 单结果\n• 同步的\n\n后续章节将涵盖其他编程模式：\n\n• 迭代器：将对象视为数据的容器（所谓的可迭代对象），并提供了一种获取其内部内容的标准化方法。如果函数或方法返回一个可迭代对象，它就会返回多个值。\n\
  • 异步编程处理长时间的计算。当计算完成时，你会收到通知，并在期间可以做其他事情。异步交付单个结果的标准模式称为 `Promise`。\n\n这些模式可以组合：例如，存在同步可迭代对象和异步可迭代对象。\n\
  \n几种新类型的函数和方法有助于某些模式的组合：\n\n• 异步函数（Async functions）：帮助实现返回 `Promises` 的函数。也有异步方法。\n\
  • 同步生成器函数（Synchronous generator functions）：帮助实现返回同步可迭代对象的函数。也有同步生成器方法。\n• 异步生成器函数（Asynchronous\
  \ generator functions）：帮助实现返回异步可迭代对象的函数。也有异步生成器方法。\n\n剩下 4 种（2 × 2）函数和方法：\n\n• 同步\
  \ vs. 异步\n• 生成器 vs. 单结果\n\n表 23.2 提供了这 4 种函数和方法的创建语法概述。\n\n表 23.2：创建函数和方法的语法。最后一列指定了实体产生多少个值。\n\
  \n![](img/image01478.jpeg)\n\n| | | 结果 | 值数量 |\n| | | | |\n| 同步函数 | 同步方法 | value\
  \ | 1 |\n| `function f() {}` | `{ m() {} }` | | |\n| `f = function () {}` | | |\
  \ |\n| `f = () => {}` | 同步生成器方法 | | |\n| 同步生成器函数 | 可迭代对象 | 0+ | |\n| `function*\
  \ f() {}` | `{ * m() {} }` | | |\n| `f = function* () {}` | 异步方法 | | |\n| 异步函数 |\
  \ Promise | 1 | |\n| `async function f() {}` | `{ async m() {} }` | | |\n| `f =\
  \ async function () {}` | | | |\n| `f = async () => {}` | 异步生成器方法 | | |\n| 异步生成器函数\
  \ | 异步可迭代对象 | 0+ | |\n| `async function* f() {}` | `{ async * m() {} }` | | |\n\
  | `f = async function* () {}` | | | |\n\n## 23.5 从函数和方法返回返回值\n\n（本节中提到的所有内容都适用于函数和方法。）\n\
  \n`return` 语句显式地从函数返回一个值：\n\n```\nfunction func() {\n  return 123;\n}\n```\n\nassert.equal(func(),\
  \ 123);\n\n另一个示例：\n\n```javascript\nfunction boolToYesNo(bool) {\n  if (bool) {\n\
  \    return 'Yes';\n  } else { return 'No';\n  }\n}\n```\n\nassert.equal(boolToYesNo(true),\
  \ 'Yes');\nassert.equal(boolToYesNo(false), 'No');\n\n如果函数结束时你没有显式地返回任何内容，JavaScript\
  \ 会为你返回 `undefined`：\n\n```javascript\nfunction noReturn() {\n  // 没有显式返回\n}\n```\n\
  \nassert.equal(noReturn(), undefined);\n```\n\n## 23.6 参数处理\n\n再次，在本节中我只提到函数，但所有内容也适用于方法。\n\
  \n### 23.6.1 术语：参数 (parameters) vs. 实参 (arguments)\n\nparameter（参数）和 argument（实参）这两个术语基本上相同。如果你愿意，可以进行如下区分：\n\
  \n• Parameters（形参数）是函数定义的一部分。它们也被称为形式参数或正式参数。\n• Arguments（实参）是函数调用的一部分。它们也被称为实际参数或实际参数。\n\
  \n### 23.6.2 术语：回调 (callback)\n\n回调或回调函数是作为函数或方法调用参数的函数。\n\n以下是回调的示例：\n\n```javascript\n\
  const myArray = ['a', 'b'];\nconst callback = (x) => console.log(x);\nmyArray.forEach(callback);\n\
  ```\n\n• 输出：\n• 'a'\n• 'b'\n\n![](img/image01479.jpeg)[](Images/image01480.jpeg)\n\
  \n![](img/image01403.jpeg) JavaScript 广泛使用 callback 术语\n\n在其他编程语言中，callback 一词通常有更窄的含义：它指的是通过函数值的参数来异步交付结果的模式。在这种含义下，回调（或续期）在函数完全完成计算后被调用。\n\
  \n作为异步模式的回调，在异步编程章节中进行了描述。\n\n### 23.6.3 参数过多或不足\n\n如果函数调用提供的参数数量与函数定义预期的数量不同，JavaScript\
  \ 不会报错：\n\n• 多余的参数会被忽略。\n• 缺失的参数将被设置为 `undefined`。\n\n例如：\n\n```javascript\nfunction\
  \ foo(x, y) {\n  return [x, y];\n}\n// 参数过多：\nassert.deepEqual(foo('a', 'b', 'c'),\
  \ ['a', 'b']);\n// 预期的参数数量：\nassert.deepEqual(foo('a', 'b'), ['a', 'b']);\n// 参数不足：\n\
  assert.deepEqual(foo('a'), ['a', undefined]);\n```\n\n### 23.6.4 参数默认值\n\n参数默认值指定了在未提供参数时使用的值。\n\
  \n例如：\n\n```javascript\nfunction f(x, y=0) {\n  return [x, y];\n}\n```\n\nassert.deepEqual(f(1),\
  \ [1, 0]);\nassert.deepEqual(f(), [undefined, 0]);\n\n`undefined` 也会触发默认值：\n\n```javascript\n\
  assert.deepEqual(\n  f(undefined, undefined),\n  [undefined, 0]\n);\n```\n\n###\
  \ 23.6.5 剩余参数 (Rest parameters)\n\n剩余参数通过在标识符前加三个点（`...`）来声明。在函数或方法调用期间，它接收所有剩余的数组。如果没有额外的参数，它是一个空数组。例如：\n\
  \n```javascript\nfunction f(x, ...y) {\n  return [x, y];\n}\n```\n\nassert.deepEqual(\n\
  \  f('a', 'b', 'c'),\n  ['a', ['b', 'c']]\n);\n\nassert.deepEqual(\n  f(),\n  [undefined,\
  \ []]\n);\n```\n\n#### 23.6.5.1 通过剩余参数强制参数数量\n\n你可以使用剩余参数来强制参数数量。考虑以下函数：\n\n```javascript\n\
  function createPoint(x, y) {\n  return {x, y};\n  // 等同于 {x: x, y: y}\n}\n```\n\n\
  这是我们如何强制调用者提供两个参数：\n\n```javascript\nfunction createPoint(...args) {\n  if (args.length\
  \ !== 2) {\n    throw new Error('请恰好提供两个参数！');\n  }\n  const [x, y] = args;  //\
  \ (A)\n  return {x, y};\n}\n```\n\n在行 (A) 中，我们通过解构访问 `args` 的元素。\n\n### 23.6.6 命名参数\
  \ (Named parameters)\n\n当有人调用函数时，调用者提供的参数会被分配给接收者的参数。执行映射的常用方式有两种：\n\n• 位置参数：如果参数位置相同，则进行赋值。仅使用位置参数的函数调用如下：\n\
  \n```javascript\nselectEntries(3, 20, 2)\n```\n\n• 命名参数：如果参数的名称相同，则进行赋值。JavaScript\
  \ 没有命名参数，但你可以模拟它们。例如，这是仅使用（模拟）命名参数的函数调用：\n\n```javascript\nselectEntries({start:\
  \ 3, end: 20, step: 2})\n```\n\n命名参数有几个优点：\n\n• 它们让代码更具自解释性，因为每个参数都有描述性的标签。\n• 参数的顺序并不重要（只要名称正确）。\n\
  \n\n\n\n\n-   处理多个可选参数更加方便：调用者可以轻松提供所有可选参数的子集，而无需关心他们省略了哪些（对于位置参数，你必须用 `undefined`\
  \ 填充之前的可选参数）。\n\n### 23.6.7 模拟命名参数\n\nJavaScript 并没有真正的命名参数。模拟它们的官方方法是通过对象字面量：\n\
  \n```javascript\nfunction selectEntries({start=0, end=-1, step=1}) {\n  return {start,\
  \ end, step};\n}\n```\n\n该函数使用解构赋值来访问其单一参数的属性。它使用的模式是以下模式的缩写：\n\n```javascript\n\
  {start: start=0, end: end=-1, step: step=1}\n```\n\n这种解构模式对于空对象字面量有效：\n\n```javascript\n\
  selectEntries({})\n{ start: 0, end: -1, step: 1 }\n```\n\n如果你在不传递任何参数的情况下调用函数，它将不起作用：\n\
  \n```javascript\nselectEntries()\nTypeError: Cannot destructure property `start`\
  \ of 'undefined' or 'null'.\n```\n\n你可以通过为整个模式提供默认值来修复此。此默认值的作用与简单参数定义中的默认值相同：如果参数缺失，则使用默认值。\n\
  \n```javascript\nfunction selectEntries({start=0, end=-1, step=1} = {}) { \n  return\
  \ {start, end, step};\n}\n\nassert.deepEqual(\n  selectEntries(),\n  { start: 0,\
  \ end: -1, step: 1 }\n);\n```\n\n### 23.6.8 展开 (...)到函数调用中\n\n如果你在函数调用的参数前放置三个点（`...`），则会对其进行展开。这意味着参数必须是一个\
  \ `iterable` 对象，并且迭代后的值都将变成参数。换句话说：一个参数被扩展为多个参数。例如：\n\n```javascript\nfunction func(x,\
  \ y) {\n  console.log(x);\n  console.log(y);\n}\n\nconst someIterable = ['a', 'b'];\n\
  func(...someIterable);\n// 等同于 func('a', 'b')\n// 输出:\n// 'a'\n// 'b'\n```\n\n展开（Spreading）和剩余参数（Rest\
  \ parameters）使用相同的语法（`...`），但它们的作用相反：\n\n- **剩余参数**用于定义函数或方法。它们将参数收集到 `Arrays` 中。\n\
  - **展开参数**用于调用函数或方法。它们将可迭代对象转换为参数。\n\n#### 23.6.8.1 示例：展开到 `Math.max()` \n\n`Math.max()`\
  \ 返回其零个或多个参数中最大的一个。遗憾的是，它不能用于 `Arrays`，但展开为我们提供了解决方法：\n\n```javascript\nMath.max(-1,\
  \ 5, 11, 3) // 11\nMath.max(...[-1, 5, 11, 3]) // 11\nMath.max(-1, ...[-5, 11],\
  \ 3) // 11\n```\n\n#### 23.6.8.2 示例：展开到 `Array.prototype.push()`\n\n同样，Array 方法\
  \ `push()` 会破坏性地将其零或多个参数添加到其 `Array` 的末尾。JavaScript 没有用于破坏性地将一个 `Array` 追加到另一个数组中的方法。再次，展开拯救了我们：\n\
  \n```javascript\nconst arr1 = ['a', 'b'];\nconst arr2 = ['c', 'd'];\narr1.push(...arr2);\n\
  assert.deepEqual(arr1, ['a', 'b', 'c', 'd']);\n```\n\n**练习：参数处理**\n\n- 位置参数：`exercises/callables/positional_parameters_test.mjs`\n\
  - 命名参数：`exercises/callables/named_parameters_test.mjs`\n\n### 23.7 动态评估代码：`eval()`，`new\
  \ Function()`（高级）\n\n接下来，我们将查看两种动态评估代码的方法：`eval()` 和 `new Function()`。\n\n#### 23.7.1\
  \ `eval()`\n\n给定一个带有 JavaScript 代码的字符串 `str`，`eval(str)` 会评估该代码并返回结果：\n\n```javascript\n\
  eval('2 ** 4') // 16\n```\n\n调用 `eval()` 有两种方式：\n\n- **直接调用**，通过函数调用。此时其参数中的代码将在`当前作用域`内进行评估。\n\
  - **间接调用**，不通过函数调用。此时它将在全局作用域中评估其代码。\n\n“不通过函数调用”意味着“任何看起来与 `eval(···)`不同的内容”：\n\
  \n- `eval.call(undefined, '···')`\n- `(0, eval)('···')`（使用逗号运算符）\n- `window.eval('···')`\n\
  - `const e = eval; e('···')`\n\n以下代码说明了这种差异：\n\n```javascript\nwindow.myVariable\
  \ = 'global';\nfunction func() {\n  const myVariable = 'local';\n  // 直接 eval\n\
  \  assert.equal(eval('myVariable'), 'local');\n  // 间接 eval\n  assert.equal(eval.call(undefined,\
  \ 'myVariable'), 'global');\n}\n```\n\n在全局范围内评估代码更安全，因为此时代码访问的内部机制更少。\n\n#### 23.7.2\
  \ `new Function()`\n\n`new Function()` 创建一个函数对象并如下被调用：\n\n```javascript\nconst func\
  \ = new Function('«param_1»', ..., '«param_n»', '«func_body»');\n```\n\n上一个语句等于下一个语句。注意\
  \ `«param_1»`（等）不再位于字符串字面量内部。\n\n```javascript\nconst func = function («param_1»,\
  \ ..., «param_n\") {\n  «func_body»\n};\n```\n\n在下一个示例中，我们两次创建了同一个函数。首先通过 `new Function()`，然后通过函数表达式：\n\
  \n```javascript\nconst times1 = new Function('a', 'b', 'return a * b'); const times2\
  \ = function (a, b) { return a * b };\n```\n\n`new Function()` 创建的是非严格模式函数。通过 `new\
  \ Function()` 创建的函数是松散的（sloppy）。\n\n#### 23.7.3 建议\n\n尽可能避免代码的动态评估：\n\n- 这是一个**安全风险**，因为它可能允许攻击者以你的代码的权限执行任意代码。\n\
  - 它可能会被禁用。例如，在浏览器中，通过[内容安全策略](https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP)。\n\
  \n很多时候，JavaScript 已经足够动态，以至于不需要 `eval()` 或类似的工具。在下面的示例中，我们用 `eval()` 做的事情（A 行）完全可以在不使用它的情况下实现（B\
  \ 行）：\n\n```javascript\nconst obj = {a: 1, b: 2};\nconst propKey = 'b';\nassert.equal(eval('obj.'\
  \ + propKey), 2); // (A)\nassert.equal(obj[propKey], 2); // (B)\n```\n\n如果你必须动态评估代码：\n\
  \n- 优先使用 `new Function()` 而非 `eval()`：它始终在全局上下文中执行代码，且函数为评估的代码提供了一个整洁的接口。\n- 优先使用**间接\
  \ `eval`** 而非**直接 `eval`**：在全局范围内评估代码更安全。\n\n# 第六部分：模块化\n## 第 24 章：模块\n\n**目录**\n\
