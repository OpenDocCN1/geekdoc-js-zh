  \n## 第 42 章：整体概念\n\n在本章中，我想描绘一张大图：你在这书中学习了什么？它是如何融入 Web 开发整体格局的？\n\n### 5.1 你在本书中学习了什么？\n\
  \n本书教授的是 JavaScript 语言。它专注于语言本身，但偶尔也会 JavaScript 可以使用的两个平台：\n\n- Web 浏览器\n- Node.js\n\
  \n`Node.js` 在 Web 开发中有有三个方面的重要性：\n\n- 你可以用它用 JavaScript 编写服务端软件。\n- 你还可以用它编写命令行软件（例如\
  \ Unix shell、Windows PowerShell 等）。许多与 JavaScript 相关的工具都是基于 `Node.js` 并通过 `Node.js`\
  \ 执行的。\n- `Node` 的软件注册表 `npm` 已成为安装工具（如编译器和构建工具）以及库的主流方式——即使对于客户端开发也是如此。\n\n###\
  \ 5.2 浏览器和 Node.js 的结构\n\nWeb 浏览器和 `Node.js` 这两个 JavaScript 平台的结构相似（图 5.1）：\n\n\
  - 基础层由 JavaScript 引擎和特定平台的“核心”功能组成。\n- 此基础之上托管两个 API：\n  - JavaScript 标准库是 JavaScript\
  \ 本身，运行在引擎之上。\n  - 平台 API 也可以通过 JavaScript 获取——它提供了对特定功能的访问。例如：\n    - 在浏览器中，如果你想做任何与用户界面相关的操作（响应鼠标点击、播放声音等），你需要使用平台\
  \ API。\n    - 在 `Node.js` 中，平台 API 允许你读写文件、通过 `HTTP` 下载数据等。\n\n### 5.3 JavaScript\
