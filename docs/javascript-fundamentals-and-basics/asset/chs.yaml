  \ {\n  const mappedEntries = Object.entries(object);\n  // 映射的实现逻辑\n}\n```\n\n|\
  \ 25.5 对象作为字典（高级） | 253 |\n\n## 25.5.9.3 `Object.fromEntries()` 的简单实现\n\n以下函数是 `Object.entries()`\
  \ 的简化版本：\n\n```javascript\nfunction fromEntries(iterable) {\n  const result = {};\n\
  \  for (const [key, value] of iterable) {\n    let coercedKey;\n    if (typeof key\
  \ === 'string' || typeof key === 'symbol') {\n      coercedKey = key;\n    } else\
  \ {\n      coercedKey = String(key);\n    }\n    result[coercedKey] = value;\n \
  \ }\n  return result;\n}\n```\n\n`Object.fromEntries()` 是 [Object.entries()](https://github.com/)\
  \ 的补丁。\n\n![](img/image0418.jpeg)![](img/image0419.jpeg)\n![](img/image0416.jpeg)\
  \ 练习：`Object.entries()`\n\n`exercises/single-objects/find_test.mjs`\n\n## 25.5.10\
