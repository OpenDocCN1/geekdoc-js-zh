  \n| ROBERT PETERSON | 125 |\n|  |  |  |\n|  |  |  |\n\n## 39 创建一个 JavaScript 时钟\n\
  \n### 关键点\n\n- `setTimeout()` 是 `window` 对象的一个方法。在它的常用形式中，它允许你在指定的时长（毫秒）通过后运行任何函数。例如：\n\
  ```javascript\nsetTimeout(\"functionName()\", 1000)\n```\n- 跟踪超时的最常见原因是为了在需要时取消它们——例如，你可能希望窗口在\
  \ 5 秒后关闭：\n```javascript\nfirstTimeout = setTimeout(\"close()\", 5000);\n```\n在按钮的事件处理器中添加以下代码：\n\
  ```javascript\nclearTimeout(firstTimeout);\n```\n- 通常情况下，让函数“递归”（即调用它自己）是一个坏主意。例如，想象一下以下操作有多令人烦恼：\n\
  ```javascript\nfunction annoy_() {\nalert(\"BOO\nannoy_meoy\n}\n```\n这将会不断弹出警报框，甚至锁定用户的计算机！\n\
  - 然而，你可能希望一个函数使用 `setTimeout` 定期地调用自己。想象一个函数每秒调用自己一次来检查时间，然后在同一位置显示结果。实际上，这可以是一个数字时钟。\n\
  - 如果你想清除时钟的超时——在这种情况下将停止时钟——则该超时必须已经在运行中。你不能清除一个不存在的超时。所以，你必须先检查超时是否正在运行。这样做的方法之一是每当启动启动时将变量设为\
  \ true。通过在尝试清除超时之前检查此变量，你就知道时钟是否正在运行，因此可以停止它。\n- 要显示 am/pm 时钟，你显然需要执行你在上一章项目中创建的转换。\n\
  - 但是，为了让显示在不同时间不会产生“移动”效果，你需要考虑时钟上的分钟或秒少于 10 的情况。例如，考虑：\n10:59:59 am\n变为：\n11:0:0\
  \ am\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 126 |\n|  |  |  |\n|  |\
  \  |  |\n\n- 在这种情况下，我们需要在实际值的前面拼接一个额外的“0”，以产生：\n11:00:00 am\n正如我们预期的那样。\n- 我们可以使用\
  \ if 条件的简写形式来变得简单。例如：\n```javascript\ns = theDate.getSeconds;\ns = ( s < 10 ) ?\
  \ “0” + s : s;\n```\n- 这里发生了什么？首先，我们获取秒的当前值并将其存储在名为 `s` 的变量中。接下来，我们根据括号中的条件重置 `s`\
  \ 的值。这种形式的 if 条件的原型是：\n\n\n\n\n\n```\nvar = ( condition )\n\n? value if true\n\n\
  : value if false;\n```\n\n换句话说，我们可以将 `?` 视作 `if` 条件语句的左括号 `{`，将 `:` 视作 `} else {`，并将\
  \ `;` 视作右括号。条件测试的结果将将存储在 `var` 中。\n\n请注意，这里将其分成了三行以便于阅读。在实践中（见上文），我们可以将其放在同一行中以方便使用。\n\
  \n## 项目\n\n- 打开你之前的项目文件，并将其另存为 `chapter_39.html`。\n- 移除页面 `body` 部分的所有内容。\n- 在 `body`\
  \ 部分中，创建一个 id 为 `clockBox` 的表单输入元素，以及两个标记为 `Start` 和 `Stop` 的表单输入按钮。\n- 在 `head`\
  \ 部分的 `scrip` 脚本元素中，创建两个空函数——`start_clock()` 和 `stop_clock()`。\n- 在两个函数定义之前，作为 `script`\
  \ 元素的第一条语句，创建一个名为 `timer` 的变量，并将其赋值为 `null`。\n\n![](img/image01388.jpeg)\n\n| ROBERT\
  \ PETERSON | 129 |\n|  |  |  |\n|  |  |  |\n\n- 在该语句正下方，创建一个名为 `timer_running` 的变量。将其赋值为\
  \ `false`。\n- 我们将使用这些变量来跟踪时钟的状态。\n- 现在，在 `start_clock()` 函数中添加语句以实现：\n    - 获取当前时间。\n\
  \    - 将当前时间格式化为 `hh:mm:ss am/pm`（视情况而定）。\n    - 将格式化后的时间显示在页面的字段中。\n    - 创建一个超时，半秒后再次运行\
  \ `start_clock()` 函数，并将该超时返回的对象赋值给 `timer` 对象变量。\n    - 将 `timer_running` 变量设置为\
  \ `true`。\n- 在 `stop_clock()` 函数中添加语句以实现：\n    - 检查时钟是否正在运行。\n    - 如果正在运行，则清除定时器超时并将\
  \ `timer_running` 设置为 `false`。\n- 最后，为这两个表单按钮添加事件处理器，确保标记为 `Stop` 的按钮在点击时调用函数 `stop_clock()`，而标记为\
  \ `Start` 的按钮在点击时调用函数 `start_clock()`。\n- 虽然这可以正常工作（测试你的代码！），但你会发现输出有点丑。在文本字段中显示时间并不是在页面上显示时钟最隐蔽的方式。\n\
  - 幸运的是，我们可以稍微修改代码以实现更专业的效果。\n- 将你的输入字段替换为以下内容：\n\n```html\n<span id=\"clockBox\"\
  ></span>\n```\n- `<<span>` 是一个 HTML 标签，允许你标记没有语义含义的 `content` 区域——例如，时钟既不是段落也不是标题，所以我们不想将其标记为此类。\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 130 |  |\n|  |  |  |\n|  |  |\
  \  |\n\n- 通过 JavaScript，我们可以控制页面上几乎任何元素的内容。在之前的示例中，我们使用了 `getElementById`（希望是这样！）来获取\
  \ `input` 字段的引用，然后更改它的 `value` 属性来显示我们的时钟。\n- 由于我们在这里使用了相同的 id 值，因此不需要过多修改函数。然而，`getElementById`\
  \ 方法现在返回一个不同类型的对象——一个没有 `value` 属性的对象。\n- 然而，HTML 中所有的内容标签（如 `<p>`, `<h1>`, `<div>`\
  \ 等）在作为 JavaScript 对象返回时都有一个特殊属性，指向它们的文本内容——该属性为 `innerHTML`。\n- 我们可以用它来更改标签的内容。例如，如果我们之前的输入字段方案有以下代码：\n\
  \n```javascript\nclk = document.getElementById(\"clockBox\"); clk.value = formatted_time;\n\
  ```\n其中 `formatted_time` 是一个包含所需格式化时间的变量，那么将其替换为此代码：\n\n```javascript\nclk = document.getElementById(\"\
  clockBox\"); clk.innerHTML = formatted_time;\n```\n将允许我们使用修改后的 `<span>` 元素来代替 `<input>`\
  \ 元素。\n- 尝试调整你的代码使用这种方法在页面上显示内容。\n\n![](img/image01388.jpeg)\n\n## 第 40 章\n\n###\
