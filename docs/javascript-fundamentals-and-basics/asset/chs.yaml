  \ 实现的。这意味着如果 `Object.prototype` 不在链中，它就会失效。\n\n![](img/image0395.jpeg)![](img/image0451.jpeg)\n\
  ![](img/image0416.jpeg) 练习：使用对象作为字典\n\n`exercises/single-objects/mjs`\n\n# 25.6\
  \ 标准方法（高级）\n\n`Object.prototype` 定义了若干标准方法，可以通过重写来配置语言处理对象的方式。两个重要的有：\n- `.toString()`\n\
  - `.valueOf()`\n\n## 25.6.1 `.toString()`\n\n`.toString()` 决定了如何将对象转换为字符串：\n\n>\
  \ `String({toString() { return 'Hello!' }})` -> `'Hello!'`\n\n> `String({})` ->\
  \ `'[object Object]'`\n\n## 25.6.2 `.valueOf()`\n\n`.valueOf()` 决定了如何将对象转换为数字：\n\
  \n> `Number({valueOf() { return 123 }})` -> `123`\n\n> `Number({})` -> `NaN`\n\n\
  # 25.7 高级主题\n\n以下子节提供了若干高级主题的简要概述。\n\n| 25.7 高级主题 | 255 |\n\n## 25.7.1 `Object.assign()`\n\
  \n`Object.assign()` 是一个工具方法：\n\n`Object.assign(target, source_1, source_2, ···)`\n\
  \n该表达式将 `source_1` 的所有属性赋值给 `target`，然后是 `source_2` 的，以此此类推。最后，它返回 `target`。例如：\n\
  \n```javascript\nconst target = { foo: 1 };\nconst result = Object.assign(\n  target,\n\
  \  {bar: 2},\n  {baz: 3, bar: 4}\n);\nassert.deepEqual(result, { foo: 1, bar: 4,\
  \ baz: 3 });\n```\n\n- target 被修改并返回：`assert.equal(result, target);`\n\n\n\n\n\n\
  `Object.assign()` 的用例与扩展属性（spread properties）相似。在某种意义上，它是破坏性地展开的。\n\n### 25.7.2\
  \ 冻结对象\n\n`Object.freeze(obj)` 使 `obj` 变得完全不可变：你无法更改属性、添加属性或更改其原型链。例如：\n\n```javascript\n\
  const frozen = Object.freeze({ x: 2, y: 5 });\nassert.throws(\n  () => { frozen.x\
  \ = 7 },\n  {\n    name: 'TypeError',\n    message: /^Cannot assign to read only\
  \ property 'x'/,\n  }\n);\n```\n\n有一个注意事项：`Object.freeze(obj)` 是浅层冻结的。这意味着只有 `obj`\
  \ 自身的属性被冻结，而存储在属性中的对象不会被冻结。\n\n### 25.7.3 属性特性和属性描述符\n\n正对象由属性组成，属性也由特性组成。属性的值只是几个特性中的之一。其他特性包括：\n\
  \n- `writable`：是否可以更改属性的值？\n- `enumerable`：属性是否会被 `Object.keys()`、扩展操作等考虑考虑？\n\n\
  当你使用处理属性特性的操作之一时，特性是通过属性描述符（property descriptors）指定的：属性描述符是一个对象，其中每个属性代表一个特性。例如，以下是读取属性\
  \ `obj.foo` 特性的方法：\n\n```javascript\nconst obj = { foo: 123 };\nassert.deepEqual(\n\
  \  Object.getOwnPropertyDescriptor(obj, 'foo'),\n  {\n    value: 123,\n    writable:\
  \ true,\n    enumerable: true,\n    configurable: true,\n  }\n);\n```\n\n以下是设置属性\
  \ `obj.bar` 特性的方法：\n\n```javascript\nconst obj = {\n  foo: 1,\n  bar: 2,\n};\nassert.deepEqual(Object.keys(obj),\
  \ ['foo', 'bar']);\n```\n\n#### 从 `Object.keys()` 中隐藏属性 `bar`\n\n```javascript\n\
  // 隐藏属性 bar\nObject.defineProperty(obj, 'bar', {\n  enumerable: false,\n});\nassert.deepEqual(Object.keys(obj),\
  \ ['foo']);\n```\n\n关于属性特性和属性描述符的更多信息，请参阅[“Speaking JavaScript”](http://speakingjs.com/es5/ch17.html#property_attributes)。\n\
  \n# 第 26 章 原型链和类\n\n在书中，JavaScript 的面向对象编程（OOP）风格分四步引入。本章涵盖了第 2–4 步，上一章涵盖了第 1 步。步骤如下（图\
  \ 26.1）：\n\n- **单个对象**：作为 JavaScript 基础 OOP 构建块的对象是如何独立工作的？\n- **原型链**：每个对象都有一个零或多个\
  \ `prototype` 对象的链。原型是 JavaScript 的核心继承机制。\n- **类**：JavaScript 的 `classes` 是对象的工厂。`class`\
  \ 与其实例之间的关系基于原型继承。\n- **子类化**：`subclass` 与其父类之间的关系也基于原型继承。\n\n## 26.1 原型链\n\n在对象字面量中，你可以通过特殊的\
  \ `__proto__` 属性设置原型：\n\n```javascript\nconst proto = {\n  protoProp: 'a',\n};\n\
  \nconst obj = {\n  __proto__: proto,\n  objProp: 'b',\n};\n```\n\n由于原型对象本身也可以拥有原型（或为\
  \ `null`），我们得到了一个对象链——即所谓的原型链。这意味着继承给我们留下了我们正在处理单个对象的印象，但实际上我们处理的是对象的链。\n\n未被继承的属性被称为“自身属性”（own\
  \ properties）。`obj` 拥有一个自身属性，`objProp`。\n\n### 26.1.1 JavaScript 的操作：所有属性 vs 自身属性\n\
  \n某些操作会考虑所有属性（自身的和继承的）。例如，获取属性：\n\n```javascript\nconst obj = { foo: 1 };\ntypeof\
  \ obj.foo // 属性的 'number'\ntypeof obj.toString // 继承的 'function'\n```\n\n其他操作只考虑自身属性。例如，`Object.keys()`：\n\
  \n```javascript\nObject.keys(obj) // [ 'foo' ]\n```\n\n### 26.1.2 陷阱：只有原型链的第一个成员被修改了\n\
  \n原型链中一个可能违背直觉的方面是：通过对象设置任何属性（即使是继承的属性）只会更改该对象本身——永远不会更改原型中的任何一个。\n\n考虑以下对象 `obj`：\n\
  \n```javascript\nconst proto = {\n  protoProp: 'a',\n};\n\nconst obj = {\n  __proto__:\
  \ proto,\n  objProp: 'b',\n};\n```\n\n在下一个代码片段中，我们设置了继承的属性 `obj.protoProp`（行 A）。这通过创建一个自身属性来“改变”了它：当读取\
  \ `obj.protoProp` 时，首先找到自身属性，其值覆盖了继承属性的值。\n\n```javascript\nobj.protoProp = 'x';\
  \ // (A)\n```\n\n\n\n\n// 我们创建了一个新的自有属性：\n\n```javascript\nassert.deepEqual(Object.keys(obj),\
  \ ['objProp',  'protoProp']);\n```\n\n• 继承的属性本身保持不变：`assert.equal(proto.protoProp,\
  \ 'a');`\n\n• 自有属性覆盖了继承的属性：`assert.equal(obj.protoProp, 'x');`\n\n`obj` 的原型链如图 26.3\
  \ 所示。\n\n...\n\n![](img/image01502.jpeg)\n\nproto\n__proto__\nprotoProp'a'\nobj\n\
  __proto__\nobjProp'b'\nprotoProp'x'\n\n图 26.3：`obj` 的自有属性 `.protoProp` 覆盖了从 `proto`\
  \ 继承的属性。\n\n### 26.1.3 使用原型技巧（进阶）\n\n#### 26.1.3.1 最佳实践：避免使用 `__proto__`，对象字面量除外\n\
  \n我建议避免使用伪属性 `__proto__`：正如我们后面看到的，并不是所有对象都拥有它。\n\n然而，对象字面量中的 `__proto__` 是不同的。在那里，它是一个内置特性且始终可用。\n\
  \n获取和设置原型的推荐方法是：\n\n• 获取原型的最佳方法是通过以下方法：\n\n| 26.1 原型链 | 261 |\n\n`Object.getPrototypeOf(obj:\
  \ Object) : Object`\n\n• 设置原型的最佳方法是在创建对象时进行的——通过对象字面量中的 `__proto__` 或通过以下方法：\n\n\
  `Object.create(proto: Object) : Object`\n\n如果确有，可以使用 `Object.setPrototypeOf()` 来更改现有对象的原型。但这可能会对性能产生负面影响。\n\
  \n这些功能的使用方式如下：\n\n```javascript\nconst proto1 = {};\nconst proto2 = {};\nconst obj\
  \ =  Object.create(proto1);\nassert.equal(Object.getPrototypeOf(obj), proto1);\n\
  Object.setPrototypeOf(obj, proto2);\nassert.equal(Object.getPrototypeOf(obj), proto2);\n\
  ```\n\n#### 26.1.3.2 检测：一个对象是否是另一个对象的原型？\n\n到目前为止，“p 是 o 的原型”始终意味着“p 是 o 的直接原型”。但它也可以更宽泛使用，意味着\
  \ p 在 o 的原型链中。这种较松的关系可以通过以下方式检查：\n\n`p.isPrototypeOf(o)`\n\n例如：\n\n```javascript\n\
  const a = {};\nconst b = {__proto__: a};\nconst c = {__proto__: b};\nassert.equal(a.isPrototypeOf(b),\
  \  true);\nassert.equal(a.isPrototypeOf(c),  true);\nassert.equal(a.isPrototypeOf(a),\
  \  false); assert.equal(c.isPrototypeOf(a),  false);\n```\n\n### 26.1.4 通过原型共享数据\n\
  \n考虑以下代码：\n\n```javascript\nconst jane = {\n  name:  'Jane',\n  describe() {\n \
  \   return 'Person named '+this.name;\n  },\n};\nconst tarzan = {\n  name:  'Tarzan',\n\
  \  describe() {\n    return 'Person named '+this.name;\n  },\n};\nassert.equal(jane.describe(),\
  \  'Person named Jane'); assert.equal(tarzan.describe(),  'Person named Tarzan');\n\
  ```\n\n我们有两个非常相似的对象。它们都有两个名称为 `.name` 和 `.describe` 的属性。此外，方法 `.describe()` 是相同的。我们如何避免该方法被重复呢？\n\
  \n我们可以将其移动到一个对象 `PersonProto`，并让该对象成为 `jane` 和 `tarzan` 的原型：\n\n```javascript\n\
  const PersonProto = {\n  describe() {\n    return 'Person named '  + this.name;\n\
  \  },\n};\nconst jane = {\n  __proto__: PersonProto,\n  name:  'Jane',\n};\nconst\
  \ tarzan = {\n  __proto__: PersonProto,\n  name:  'Tarzan',\n};\n```\n\n原型的名称反映了\
  \ `jane` 和 `tarzan` 都是人。\n\n| | PersonProto | |\n|---|---|---|---|\n| | describe\
  \ | function() {···} | |\n| jane | | tarzan | |\n| __proto__ | | __proto__ | |\n\
  | name | 'Jane' | name | 'Tarzan' |\n\n![](img/image01503.jpeg)\n\n图 26.4：对象 `jane`\
  \ 和 `tarzan` 通过它们共同的原型 `PersonProto` 共享方法 `.describe()`。\n\n图 26.4 展示了这三个对象是如何连接的：底部的对象现在包含了\
  \ `jane` 和 `tarzan` 特有的属性。顶部的对象包含了它们之间共享的属性。\n\n当你调用方法 `jane.describe()` 时，它指向该方法调用的接收者\
  \ `jane`（图的左下角）。这就是为什么该方法仍然有效的原因。`tarzan.describe()` 的原理类似。\n\n```javascript\nassert.equal(jane.describe(),\
  \  'Person named Jane'); assert.equal(tarzan.describe(),  'Person named Tarzan');\n\
  ```\n\n### 26.2 类\n\n我们现在准备好处理类（classes）了，类基本上是设置原型链的紧凑语法。在底层，JavaScript 的类是非惯常的。但在使用它们时，你很少遇到这一点。对于使用过其他面向对象编程语言的人来说，它们通常应该很熟悉。\n\
  \n#### 26.2.1 一个用于人的类\n\n我们之前处理过 `jane` 和 `tarzan` 这两个代表人的单个对象。\n\n让我们使用类声明来实现一个人的对象的工厂：\n\
  \n```javascript\nclass Person {\n  constructor(name) {\n    this.name  = name;\n\
  \  }\n  describe() {\n    return 'Person named '+this.name;\n  }\n}\n```\n\n现在 `jane`\
  \ 和 `tarzan` 可以通过 `new Person()` 创建了：\n\n```javascript\nconst jane = new Person('Jane');\n\
  assert.equal(jane.name,  'Jane');\nassert.equal(jane.describe(),  'Person named\
  \ Jane');\nconst tarzan = new Person('Tarzan');\nassert.equal(tarzan.name,  'Tarzan');\n\
  assert.equal(tarzan.describe(),  'Person named Tarzan');\n```\n\n#### 26.2.1.1 类表达式\n\
  \n有两种类的定义方式（定义类的方法）：\n\n• 类声明（Class declarations）：我们在上一节中见过。\n• 类表达式（Class expressions）：我们接下来将看到。\n\
  \n类表达式可以是匿名的具名的：\n\n```javascript\n// 匿名类表达式\nconst Person = class { ··· };\n//\
  \ 具名类表达式\nconst Person = class MyClass { ··· };\n```\n\n具名类表达式的名称与具名函数表达式的名称原理类似。\n\
  \n这是对类的初步了解。我们将很快探索更多功能，但首先我们需要学习类的内部机制。\n\n#### 26.2.2 底层的类\n\n类的底层有很多很多操作。让我们看看\
  \ `jane` 的结构图（图 26.5）。\n\n![](img/image01504.jpeg)\n\n| Person | Person.prototype\
  \ | |\n|---|---|---|\n| prototype | constructor | |\n| | describe | function() {...}\
  \ |\n| | | |\njane\n__proto__\nname'Jane' |\n\n图 26.5：`Person` 类拥有 `.prototype`\
  \ 属性，它指向一个作为所有 `Person` 实例的原型的对象。`jane` 就是这样的一个实例。\n\n`Person` 类的主要目的是设置右侧的原型链（`jane`\
  \ 后接 `Person.prototype`）。注意的是，类 `Person` 内部的两个构造（`.constructor` 和 `.describe()`）是在\
  \ `Person.prototype` 上创建属性，而不是 `Person`。\n\n这种奇怪方法的之所以是为了兼容：在类出现之前，构造函数（通过 `new`\
  \ 操作符调用的普通函数）经常被用作对象的工厂。类类是构造函数的更好语法，因此保持与旧代码兼容。这解释了为什么类是函数：\n\n```javascript\n\
  typeof Person\n'function'\n```\n\n在本书中，我交替使用构造函数（function）和类的术语。\n\n很容易混淆 `.__proto__`\
  \ 和 `.prototype`。希望图 26.5 能够清楚地阐明它们的区别：\n\n• `.__proto__` 是访问对象原型的伪属性。\n• `.prototype`\
  \ 是一个普通属性，仅由于 `new` 操作符的使用方式而变得特殊。这个名称并不理想：`Person.prototype` 指向的 `Person` 的原型，而是所有\
  \ `Person` 实例的原型。\n\n#### 26.2.2.1 Person.prototype.constructor（进阶）\n\n图 26.5 中有一个我们尚未观察的细节：`Person.prototype.constructor`\
  \ 指回 `Person`：\n\n```javascript\nPerson.prototype.constructor === Person true\n\
  ```\n\n这种设置也是为了兼容性。但它有两个额外的好处。\n\n首先，类的每个实例都继承 `.constructor` 属性。因此，给定一个实例，可以通过它创建“相似”的对象：\n\
  \n```javascript\nconst jane = new Person('Jane');\nconst cheeta = new jane.constructor('Cheeta');\n\
  ```\n\n• `cheeta` 也是 `Person` 的实例\n• （`instanceof` 操作符将在稍后解释）`assert.equal(cheeta\
  \ instanceof Person, true);`\n\n\n\n\n其次，你可以获取创建给定实例的类名：\n\n```javascript\nconst\
  \ tarzan = new Person('Tarzan');\nassert.equal(tarzan.constructor.name, 'Person');\n\
  ```\n\n### 26.2.3 类定义：原型属性\n\n以下类声明体中的所有构造结构都会创建 `Foo.prototype` 的属性。\n\n```javascript\n\
  class Foo {\n  constructor(prop) {\n    this.prop = prop;\n  }\n\n  protoMethod()\
  \ {\n    return 'protoMethod';\n  }\n\n  get protoGetter() {\n    return 'protoGetter';\n\
  \  }\n}\n```\n\n让我们按顺序检查它们：\n\n- `.constructor()` 在创建 `Foo` 的新实例后被调用，用于初始化该实例。\n\
  - `.protoMethod()` 是普通方法。它存储在 `Foo.prototype` 中。\n- `.protoGetter` 是存储在 `Foo.prototype`\
  \ 中的 getter（get）。\n\n以下交互使用了类 `Foo`：\n\n- `const foo = new Foo(123);`\n- `foo.prop`\
  \ -> `123`\n- `> foo.protoMethod()` -> `'protoMethod'`\n- `> foo.protoGetter` ->\
  \ `'protoGetter'`\n\n### 26.2.4 类定义：静态属性\n\n以下类声明体中的所有构造结构都会创建所谓的静态属性——`Bar` 本身的属性。\n\
  \n```javascript\nclass Bar {\n  static staticMethod() {\n    return 'staticMethod';\n\
  \  }\n\n  static get staticGetter() {\n    return 'staticGetter';\n  }\n}\n```\n\
  \n静态方法和静态 getter 的用法如下：\n\n- `> Bar.staticMethod()` -> `'staticMethod'`\n- `> Bar.staticGetter`\
  \ -> `'staticGetter'`\n\n### 26.2.5 instanceof 运算符\n\n`instanceof` 运算符可以判断一个值是否是给定类的实例：\n\
  \n- `> new Person('Jane') instanceof Person` -> `true`\n- `> ({}) instanceof Person`\
  \ -> `false`\n- `> ({}) instanceof Object` -> `true`\n- `> [] instanceof Array`\
  \ -> `true`\n\n我们将在之后查看子类化，更详细地探讨 `instanceof` 运算符。\n\n### 26.2.6 为什么我推荐使用类\n\n\
  我推荐使用类的原因如下：\n\n- 类是对象创建和继承的通用标准，现在被许多框架（React, Angular, Ember 等）广泛支持。这是对以前实现方式的改进，以前几乎每个框架都有自己的继承库。\n\
  - 它们帮助 IDE 和类型检查器等工具工作，并并在那里开启新功能。\n- 如果你从其他语言转向 JavaScript 并且习惯了类，那么你可以更快地上手。\n\
  - JavaScript 引擎对类进行了优化。也就是说，使用类的代码几乎总是比使用自定义继承库的代码快。\n- 你可以对内置构造函数（如 `Error`）进行扩展。\n\
  \n这并不意味着类是完美的：\n\n- 存在过度继承的风险。\n- 存在在类中放入过多功能的风险（而某些情况下将功能放在函数中效果更好）。\n- 它们在表面和底层的运行原理完全不同。换句话说，语法和语义之间存在脱节。两个例子是：\n\
  \    - 在类 `C` 内部定义的方法会在对象中创建一个方法。\n    - 类实际上是函数。\n\n这种脱节的动机是为了向后兼容。幸运的是，这种脱节在实践中很少引起问题；只要你遵循类所表现出来的特性，通常是没有问题的。\n\
  \n**练习：编写一个类**\n`exercises/proto-chains-classes/point_class_test.mjs`\n\n### 26.3\
  \ 类的私有数据\n\n本节描述了从外部隐藏对象部分数据的技术。我们将在类的上下文中讨论这些技术，但它们也适用于直接创建的对象（例如通过对象字面量创建）。\n\n\
  #### 26.3.1 私有数据：命名约定\n\n第一种技术通过在属性名称前加下划线来将其私有化。这并不会从任何方面保护属性；它只是向外部发出信号：“你不需要知道这个属性。”\n\
  \n在以下代码中，属性 `._counter` 和 `._action` 是私有的。\n\n```javascript\nclass Countdown {\n\
  \  constructor(counter, action) {\n    this._counter = counter;\n    this._action\
  \ = action;\n  }\n\n  dec() {\n    this._counter--;\n    if (this._counter === 0)\
  \ {\n      this._action();\n    }\n  }\n}\n```\n\n- 这两个属性并不是真正的私有：`assert.deepEqual(Object.keys(new\
  \ Countdown()), ['_counter', '_action']);`\n\n使用这种技术，你无法获得任何保护，且私有名称可能会冲突。但优点是，它很容易使用。\n\
  \n#### 26.3.2 私有数据：WeakMaps\n\n另一种技术是使用 `WeakMaps`。其具体工作原理将在 `WeakMaps` 章节中解释。这是一个预览：\n\
  \n```javascript\nconst _counter = new WeakMap();\nconst _action = new WeakMap();\n\
  \nclass Countdown {\n  constructor(counter, action) {\n    _counter.set(this, counter);\n\
  \    _action.set(this, action);\n  }\n\n  dec() {\n    let counter = _counter.get(this);\n\
  \    counter--;\n    _counter.set(this, counter);\n    if (counter === 0) {\n  \
  \    _action.get(this)();\n    }\n  }\n}\n```\n\n- 这两个伪属性是真正的私有的：`assert.deepEqual(Object.keys(new\
  \ Countdown()), []);`\n\n这种技术为你提供了极防止外部访问的保护，且不会发生任何名称冲突。但它的用起来也更复杂。\n\n#### 26.3.3\
  \ 更多私有数据技术\n\n本书解释了类中处理私有数据最重要的技术。可能很快就会内置支持。详情请参考 ECMAScript 提议 [Class](https://github.com/tc39/proposal-class-fields)\
  \ [Public Instance Fields & Private Instance Fields](https://github.com/tc39/proposal-class-fields)。\n\
  \n在 [\"Exploring ES6”(https://exploringjs.com/es6/ch_classes.html#sec_private-data-for-classes)\
  \ 中还解释了一些额外的技术。\n\n### 26.4 子类化\n\n类也可以子类化（“扩展”）现有的类。例如，下面的 `Employee` 类子类了 `Person`\
  \ 类：\n\n```javascript\nclass Person {\n  constructor(name) {\n    this.name = name;\n\
  \  }\n\n  describe() {\n    return `Person named ${this.name}`;\n  }\n\n  static\
  \ logNames(persons) {\n    for (const person of persons) {\n      console.log(person.name);\n\
  \    }\n  }\n}\n\nclass Employee extends Person {\n  constructor(name, title) {\n\
  \    super(name);\n    this.title = title;\n  }\n\n  describe() {\n    return super.describe()\
  \ + ` (${this.title})`;\n  }\n}\n\nconst jane = new Employee('Jane', 'CTO');\nassert.equal(jane.describe(),\
  \ 'Person named Jane (CTO)');\n```\n\n两点注释：\n\n- 在 `.constructor()` 方法内部，你必须通过 `super()`\
  \ 调用父类构造函数，才能访问 `this`。这是因为在调用父类构造函数之前，`this` 还不存在（这种现象是类特有的）。\n- 静态方法也会被继承。例如，`Employee`\
  \ 继承了静态方法 `.logNames()`：\n    `> 'logNames' in Employee` -> `true`\n\n**练习：子类化**\n\
  `exercises/proto-chains-classes/color_point_class_test.mjs`\n\n#### 26.4.1 子类的底层原理（进阶）\n\
  \n（表格表示省略，重点关注 `Person.prototype`、`Employee.prototype` 与实例 `jane` 之间通过 `__proto__`\
  \ 建立的关系）\n\n\n\n\n\n### 26.4.1.1 实例原型链（右列）\n\n实例原型链从 `jane` 开始，接着是 `Employee.prototype`\
  \ 和 `Person.prototype`。在原则上，原型链在这一步就结束了，但我们又得到了一个对象：`Object.prototype`。这个原型为几乎所有的对象提供服务，这就是为什么它也被包含在这里：\n\
  \n```javascript\nObject.getPrototypeOf(Person.prototype) === Object.prototype true\n\
  ```\n\n### 26.4.1.2 类原型链（左列）\n\n在类原型链中，`Employee` 排在前面，接着是 `Person`。之后，链继续到 `Function.prototype`，它之所以在那里，是因为\
  \ `Person` 是一个函数，而函数需要 `Function.prototype` 的服务。\n\n```javascript\nObject.getPrototypeOf(Person)\
  \ === Function.prototype true\n```\n\n### 26.4.2 详细介绍 instanceof（进阶）\n\n我们还没有见过\
  \ `instanceof` 实际上是如何工作的。给定以下表达式：\n\n```javascript\nx instanceof C\n```\n\n`instanceof`\
  \ 如何确定 `x` 是否是 `C` 的实例（或 `C` 的子类的实例）？它是通过检查 `C.prototype` 是否在 `x` 的原型链中来实现的。也就是说，以下表达式是等价：\n\
  \n```javascript\nC.prototype.isPrototypeOf(x)\n```\n\n如果我们回到图 26.6，我们可以确认原型链确实引导我们得到了以下正确答案：\n\
  \n```javascript\njane instanceof Employee\ntrue\n```\n\n```javascript\njane instanceof\
  \ Person\ntrue\n```\n\n```javascript\njane instanceof Object\ntrue\n```\n\n### 26.4.3\
  \ 内置对象的原型链（进阶）\n\n接下来，我们将利用对子类的知识来理解几个内置对象的原型链。下面的工具函数 `p()` 将帮助我们进行探索。\n\n```javascript\n\
  const p = Object.getPrototypeOf.bind(Object);\n```\n\n我们提取了 `Object` 的方法 `.getPrototypeOf()`\
  \ 并将其赋值给 `p`。\n\n#### 26.4.3.1 {} 的原型链\n\n让我们从检查普通对象开始：\n\n```javascript\np({})\
  \ === Object.prototype\ntrue\n```\n\n```javascript\np(p({})) === null\ntrue\n```\n\
  \n图 26.7 显示了该原型链的图。我们可以看到 `{}` 确实是 `Object` 的实例——`Object.prototype` 在它的原型链中。\n\n\
  （图 26.7：通过对象字量符创建对象的原型链从该对象开始，经过 `Object.prototype`，并以 `null` 结束。）\n\n#### 26.4.3.2\
  \ [] 的原型链\n\n`Array` 的原型链是什么样子的？\n\n```javascript\np([]) === Array.prototype\ntrue\n\
  ```\n\n```javascript\np(p([])) === Object.prototype\ntrue\n```\n\n```javascript\n\
  p(p(p([]))) === null\ntrue\n```\n\n（图 26.8：`Array` 的原型链包含这些成员：`Array` 实例、`Array.prototype`、`Object.prototype`、`null`\n\
  \n这个原型链（在图 26.8 中可视化）告诉我们 `Array` 对象是 `Array` 的实例，而 `Array` 是 `Object` 的子类。\n\n\
  #### 26.4.3.3 function () {} 的原型链\n\n最后，普通函数的原型链告诉我们所有函数都是对象：\n\n```javascript\n\
  p(function () {}) === Function.prototype\ntrue\n```\n\n```javascript\np(p(function\
  \ () {})) === Object.prototype\ntrue\n```\n\n#### 26.4.3.4 不是 Object 实例的对象\n\n只有当\
  \ `Object.prototype` 在其原型链中时，一个对象才是 `Object` 的实例。\n\n通过各种字面量创建的大多数对象都是 `Object`\
  \ 的实例：\n\n```javascript\n({}) instanceof Object\ntrue\n```\n\n```javascript\n(()\
  \ => {}) instanceof Object\ntrue\n```\n\n```javascript\n/abc/ug instanceof Object\n\
  true\n```\n\n没有原型的对象不是 `Object` 的实例：\n\n```javascript\n({ __proto__: null }) instanceof\
  \ Object\n```\n\n`Object.prototype` 结束了大多数原型链。它的原型是 `null`，这意味着它也不是 `Object` 的实例：\n\
  \n```javascript\nObject.prototype instanceof Object\nfalse\n```\n\n#### 26.4.3.5\
  \ 伪属性 .__proto__ 究竟是如何工作的？\n\n伪属性 `.__proto__` 是由类 `Object` 通过 getter 和 setter 实现的。\n\
  \n它可以像这样实现：\n\n```javascript\nclass Object {\n  get __proto__() {\n    return Object.getPrototypeOf(this);\n\
  \  }\n  set __proto__(other) {\n    Object.setPrototypeOf(this, other);\n  }\n \
  \ // ···\n}\n```\n\n这意味着你可以通过创建一个没有 `Object.prototype` 的对象来关闭 `.__proto__`：\n\n\
  ```javascript\n({ __proto__: null })\n```\n\n```\n\n创建一个 `proto.prototype``来切换 `.__proto__`\
  \ 是否在它的原型链中：\n\n```javascript\n'__proto__' in {}\ntrue\n```\n\n### 26.4.4 派发调用 vs\
  \ 直接调用（进阶）\n\n在类原型链中，`Employee` 排在前面，接着是 `Person`。之后，链继续到 `Function.prototype`，它之所以在那里，是因为\
  \ `Person` 是一个函数，而函数需要 `Function.prototype` 的服务。\n\n#### 检查派发调用\n\n检查检查 `C.prototype`\
  \ 是否在 ` ``` 的原型链中：\n\n```javascript\nclass Person {\n  constructor(name) {\n   \
  \ this.name = name;\n  }\n  describe() {\n    return..\n\n}\n}\n\nconst jane = new\
  \ Person('Jane');\n```\n\n图 26.9 显示了派发调用的情况：\n\n```javascript\njane.describe()\n\
  'Jane'\n```\n\n#### 借用方法\n\n直接方法调用在你在使用 `Object.prototype` 的方法时非常有用。例如，`Object.prototype.hasOwnProperty(k)`\
  \ 检查 `this` 是否具有键为 `k` 的属性：\n\n```javascript\nconst obj = { foo: 123 };\nobj.hasOwnProperty('foo')\n\
  true\n```\n\n```javascript\nobj.hasOwnProperty('bar')\nfalse\n```\n\n然而，在对象的原型链中，可能另一个键为\
  \ `'hasOwnProperty'` 的属性，覆盖了 `Object.prototype` 中的方法。这时派发调用将不起作用：\n\n```javascript\n\
  const obj = { hasOwnProperty: true };\nobj.hasOwnProperty('bar')\nTypeError: obj.hasOwnProperty\
  \ is not a function\n```\n\n解决方法是使用直接方法调用：\n\n```javascript\nObject.prototype.hasOwnProperty.call(obj,\
  \ 'bar')\nfalse\n```\n\n```javascript\nObject.prototype.hasOwnProperty.call(obj,\
  \ 'hasOwnProperty')\ntrue\n```\n\n这种直接方法调用调用缩写为：\n\n```javascript\n({}).hasOwnProperty.call(obj,\
  \ 'bar')\nfalse\n```\n\n```javascript\n({}).hasOwnProperty.call(obj, 'hasOwnProperty')\n\
  true\n```\n\n### 26.4.5 混入类（进阶）\n\nJavaScript 的类系统只支持单继承。也就是说，每个类最多可以有一个超类。绕过这一限制的方法是使用一种名为混入类（简称混入）的技术。\n\
  \n主意如下：假设我们想让类 `C` 继承自两个超类 `S1` 和 `S2`。这将是多重继承，JavaScript 不支持。\n\n我们的替代方案是将 `S1`\
  \ 和 `S2` 转换为混入，即子类的工厂：\n\n```javascript\nconst S1 = (Sup) => class extends Sup {\
  \ /*···*/ };;\nconst S2 = (Sup) => class extends Sup { /*···*/ };;\n```\n\n这两个函数每个返回一个扩展给定超类\
  \ `Sup` 的类。我们这样创建类 `C`：\n\n```javascript\nclass C extends S2(S1(Object)) {\n  /*···*/\n\
  }\n```\n\n现在我们有一个类 `C`，它扩展类 `S2`，`S2` 扩展类 `S1`，而 `S1` 扩展 `Object`（大多数类都是隐式这样做的）。\n\
  \n#### 26.4.5.1 示例：用于品牌管理的混入\n\n\n\n\n我们实现了一个名为 `Branded` 的混入（mixin），它包含了设置和获取对象品牌的辅助方法：\n\
  \n```javascript\nconst Branded = (Sup) => class extends Sup {\n  setBrand(brand)\
  \ {\n    this._brand = brand;\n    return this;\n  }\n\n  getBrand() {\n    return\
  \ this._brand;\n  }\n};\n```\n\n我们使用这个混入来为类 `Car` 实现品牌管理：\n\n```javascript\nclass\
  \ Car extends Branded(Object) {\n  constructor(model) {\n    super();\n    this._model\
  \ = model;\n  }\n\n  toString() {\n    return `${this.getBrand()} ${this._model}`;\n\
  \  }\n}\n```\n\n以下代码证实了混入已生效：`Car` 拥有来自 `Branded` 的 `setBrand()` 方法。\n\n```javascript\n\
  const modelT = new Car('Model T').setBrand('Ford');\nassert.equal(modelT.toString(),\
  \ 'Ford Model T');\n```\n\n### 26.4.5.2 混入的优势\n\n混入让我们摆脱了单继承的限制：\n\n- 同一个类可以扩展一个超类以及零个或多个混入。\n\
  - 同一个混入可以被多个类使用。\n"
