  \ 回到之前的状态。\n- 在浏览器中检查你的工作。\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 85\
  \ |\n|  |  |  |\n|  |  |  |\n\n## 24  对象实例化与更好的悬停效果\n\n### 关键点\n\n- 到目前为止，我们已经看到了一个非常简单的图像悬停示例。它是功能性的，并且按预期工作，但缺少一些细节。\n\
  - 具体来说，当我们使用 JavaScript 更改 `<img>` 标签的 `src` 属性时，浏览器必须从头开始加载此图像。在我们的本地机器上，这不会引起明显的延迟，但在处理远程服务器时（我们将将在互联网上操作的那样），这种延迟会导致明显的“卡顿”，从而破坏动态界面的感官。\n\
  - 理想情况下，我们希望指示浏览器在加载页面时加载任何替代图像。这将允许我们确保新图像位于用户的计算机上，准备好随时切换。\n- 为了实现这一点，我们需要查看对象变量和对象实例化（或创建）。特别是，我们需要查看\
  \ `Image` 对象。\n- 页面上的每个 `<img>` 标签在 JavaScript 中都有相应的 `Image` 对象。我们已经查看了直接操作它们的方法，并对\
  \ `Image` 对象可能具有的一些属性有了了解。\n- 然而，我们可以直接在 JavaScript 中创建 `Image` 对象，而不需要在页面上有相应的\
  \ `<img>` 标签。当我们创建这样的对象并设置其 `src` 属性时，浏览器会将适当的文件加载到内存中，但不会在页面上显示图像。\n\n![](img/image01388.jpeg)\n\
  \n| ROBERT PETERSON | 86 |\n|  |  |  |\n|  |  |  |\n\n- 换句话说，可以在 JavaScript 内部创建“虚拟”图像，并使用这些\
  \ `Image` 对象来存储“真实”图像的替代图像。\n- 要创建一个 `Image` 对象（实际上是创建任何对象），我们需要使用以下代码：\n\n```javascript\n\
  virtual_image = new Image();\n```\n\n- 我们以前见过这种语法——在我们创建数组 `Arrays` 时使用了 `new` 关键字。`new`\
  \ 告诉 JavaScript 我们正在创建一个新对象。赋值中的 `virtual_image` 部分只是一个变量名。在这种情况下，该变量是一个对象变量，因为它包含一个对象。\n\
  - 使用此变量来预加载我们的图像，利用了它具有与任何其他图像相同的属性和方法的特性：\n\n```javascript\nvirtual_image.src =\
  \ \"contactsover.jpg\";\n```\n- 现在浏览器将预加载我们的图像，准备在稍后切换。\n\n### 项目\n\n- 打开之前的项目文件，并将其保存为\
