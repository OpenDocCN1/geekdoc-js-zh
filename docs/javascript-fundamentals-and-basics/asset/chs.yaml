  const obj = {\n  'Can be any string!': 123,\n};\n```\n\n第二——在获取或设置属性时，我们可以使用带有内部字符串的方括号：\n\
  \n```javascript\n// 获取属性\nassert.equal(obj['Can be any string!'], 123);\n\n// 设置属性\n\
  obj['Can be any string!'] = 'abc';\nassert.equal(obj['Can be any string!'], 'abc');\n\
  ```\n\n你也可以对方法使用这些技术：\n\n```javascript\nconst obj = {\n  'A nice method'() {\n \
  \   return 'Yes!';\n  },\n};\nassert.equal(obj['A nice method'](), 'Yes!');\n```\n\
  \n### 25.5.2 计算属性键\n\n到目前为止，属性键始终是对象字面量内部的固定字符串。在本节中，我们学习如何动态计算属性键。这使我们能够使用任意字符串或符号。\n\
  \n对象字面量中动态计算属性键的语法灵感来自于动态访问属性。也就是说，这使我们能够使用任意字符串或符号。\n\n*(注：原文文本在 25.5.2 之后存在大量重复，此处译文已按要求去重)*\n\
  \n\n\n\n可枚举性是属性的一个`attribute`。不可枚举属性会被`some operations` 忽略。例如，通过 `Object.keys()`（见表）以及通过扩展运算符属性时。\n\
  \n# 25025 单个对象\n\n默认情况下，大多数属性都是可枚举的。接下来的示例展示了如何改变这一点。\n\n它还演示了列出属性键的不同方式。\n\n```javascript\n\
  const enumerableSymbolKey = Symbol('enumerableSymbolKey'); const nonEnumSymbolKey\
  \ = Symbol('nonEnumSymbolKey');\n\n// 我们通过对象字面量创建枚举属性\nconst obj = {\n  enumerableStringKey:\
  \ 1,\n  [enumerableSymbolKey]: 2,\n}\n\n// 对于不可枚举属性，我们需要一个更强大的工具\nObject.defineProperties(obj,\
  \ {\n  nonEnumStringKey: { value: 3, enumerable: false },\n  [nonEnumSymbolKey]:\
  \ {\n    value: 4,\n    enumerable: false,\n  },\n});\n\nassert.deepEqual(\n  Object.keys(obj),\n\
  \  ['enumerableStringKey']\n);\nassert.deepEqual(\n  Object.getOwnPropertyNames(obj),\n\
  \  ['enumerableStringKey', 'nonEnumStringKey']\n);\nassert.deepEqual(\n  Object.getOwnPropertySymbols(obj),\n\
  \  [enumerableSymbolKey, nonEnumSymbolKey]\n);\nassert.deepEqual(\n  Reflect.ownKeys(obj),\n\
  \  ['enumerableStringKey', 'nonEnumStringKey', enumerableSymbolKey, nonEnumSymbolKey],\n\
  );\n```\n\n`Object.defineProperties()` 将稍后解释。\n\n## 25.5.6 通过 `Object.values()`\
  \ 列出属性值\n\n`Object.values()` 列出对象所有可枚举属性的值：\n\n```javascript\nconst obj = {foo:\
