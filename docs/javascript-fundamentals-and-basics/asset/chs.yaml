  \ “TC39 流程”描述了未来特性是如何规划的。\n- §3.6 “FAQ：TC39 流程”回答了关于未来特各种问题。\n\n## 4.4 为什么 JavaScript\
  \ 经常静默失败？\n\nJavaScript 经常会静默失败。让我们来看两个例子。\n\n第一个例子：如果操作符的操作数没有合适的类型，它们将根据需要进行转换。\n\
  \n```\n'3' * '5'\n```\n15\n\n第二个例子：如果算术计算失败，你得到的是一个错误值而不是异常。\n\n```\n1 / 0\n```\n\
  Infinity\n\n静默失败的原因是历史性的：JavaScript 在 `ECMAScript 3` 之前没有异常。从那时起，设计者们一直试图避免静默失败。\n\
  \n## 4.5 为什么我们不能通过移除怪异行为和过时特性来清理 JavaScript？\n\n这个问题在 §3.7 “演化的 JavaScript：不要破坏网页”中有所解答。\n\
