  \ 严格模式下的改进\n\n\n\n\n\n断言（assertion）描述了计算结果预期的样子，如果这些预期不正确，则会抛出异常。例如，下面的断言表示计算 7\
  \ 加加 1 的结果必须是 8：\n\n```javascriptassert.equal(7 + 1, 8);\n```\n\n`assert.equal()`\
  \ 是一个方法调用（对象是 `assert`，方法是 `.equal()`），它带有两个参数：实际结果和预期结果。它是 Node.js 断言 API 的一部分，本书将在后后部分对其进行解释。\n\
  \n向浏览器或 Node.js 的控制台记录日志：\n\n• 将值打印到标准输出（另一个方法调用）`console.log('Hello!')`\n\n• 将错误信息打印到标准错误\n\
  ```javascript\nconsole.error('Something went wrong!');\n```\n\n### 运算符：\n\n```javascript\n\
  // 布尔值运算符\nassert.equal(true && false, false);  // 与\nassert.equal(true || false,\
  \ true);  // 或\n```\n\n• 数字运算符 `assert.equal(3 + 4, 7); assert.equal(5 - 1, 4);\
  \ assert.equal(3 * 4, 12); assert.equal(9 / 3, 3);`\n\n• 字符串运算符 `assert.equal('a'\
  \ + 'b', 'ab'); assert.equal('I see ' + 3 + ' monkeys', 'I see 3 monkeys');`\n\n\
  • 比较运算符\n`assert.equal(3 < 4, true); assert.equal(3 <= 4, true); assert.equal('abc'\
  \ === 'abc', true); assert.equal('abc' !== 'def', true);`\n\n### 声明变量：\n\n```javascript\n\
  let x;  // 声明 x（可变的）\nx = 3 * 5; // 给 x 赋值\nlet y = 3 * 5;  // 声明并赋值\nconst z =\
  \ 8;  // 声明 z（不可变的）\n```\n\n### 控制流语句：\n\n```javascript\n// 条件语句\nif (x < 0) { \
  \ // 如果 x 小于零？\n  x = -x;\n}\n```\n\n### 普通函数声明：\n\n```javascript\n// add1() 具有参数\
  \ a 和 b\nfunction add1(a, b) {\n  return a + b;\n}\n```\n\n• 调用函数 `add1()` `assert.equal(add1(5,\
  \ 2), 7);`\n\n### 箭头函数表达式（特别用于函数调用和方法调用的参数）：\n\n```javascript\nconst add2 = (a,\
  \ b) => { return a + b };\n```\n\n• 调用函数 `add2()` `assert.equal(add2(5, 2), 7);`\n\
  \n• 等同于 `add2`：\n```javascript\nconst add3 = (a, b) => a + b;\n```\n\n之前的代码包含以下两个箭头函数（表达式和语句术语将在本章稍后解释）：\n\
  \n• 体为代码块的箭头函数 `(a, b) => { return a + b }`\n• 体为表达式的箭头函数 `(a, b) => a + b`\n\n\
  ### 对象：\n\n```javascript\n// 通过对象字面量创建一个普通对象\nconst obj = {\n  first: 'Jane',  //\
  \ 属性\n  last: 'Doe',  // 属性\n  getFullName() {  // 属性（方法）\n    return this.first\
  \ + ' ' + this.last;\n  },\n};\n```\n\n• 获取属性值 `assert.equal(obj.first, 'Jane');`\n\
  \n• 设置属性值\n```javascript\nobj.first = 'Janey';\n```\n\n• 调用方法 `assert.equal(obj.getFullName(),\
  \ 'Janey Doe');`\n\n### 数组（数组也是对象）：\n\n```javascript\n// 通过数组字面量创建一个数组\nconst arr\
  \ = ['a', 'b', 'c'];\n```\n\n• 获取数组元素 `assert.equal(arr[1], 'b');`\n\n• 设置数组元素 `arr[1]\
  \ = 'β';`\n\n### 6.1.2 模块\n\n每个模块都是单独的文件。例如，考虑以下两个包含模块的文件：\n\n`file-tools.mjs` \
  \ \n`main.mjs`\n\n`file-tools.mjs` 中的模块导出了它的函数 `isTextFilePath()`：\n\n```javascript\n\
  export function isTextFilePath(filePath) {\n  return filePath.endsWith('.txt');\n\
  }\n```\n\n`main.mjs` 中的模块导入了整个模块 `path` 和函数 `isTextFilePath()`：\n\n```javascript\n\
  // 将整个模块作为命名空间对象 `path` \nimport * as path from 'path';\n\n// 导入 file-tools.mjs\
  \ 的单个导出\nimport {isTextFilePath} from './file-tools.mjs';\n```\n\n### 6.1.3 合法的变量名和属性名\n\
  \n变量名和属性名的语法类别称为 `identifier`标识符。\n\n标识符允许允许字符：\n\n• Unicode 字母：A–Z, a–z（等）\n• `$`,\
  \ `_`\n• Unicode 数字：0–9（等）\n– 变量名不能以数字开头\n\n某些单词在 JavaScript 中有特殊含义，被称为 `reserved`保留字。示例包括\
  \ `if`、`true`、`const`。\n\n保留字不能作为变量名：\n\n```javascript\nconst if = 123;\n// SyntaxError:\
  \ Unexpected token if\n```\n\n但它们允许作为属性名：\n\n• `const obj = { if: 123 };`\n• `obj.if`\n\
  \n### 6.1.4 命名风格\n\n连接单词的常用命名风格有：\n\n// 驼峰命名法 (Camel case): `threeConcatenatedWords`\n\
  // 下划线命名法 (Underscore case，也叫 snake case): `three_concatenated_words`\n// 连字符命名法\
  \ (Dash case，也叫 kebab case): `three-concatenated-words`\n\n### 6.1.5 大写\n\n通常情况下，JavaScript\
  \ 使用小写，常量除外。\n\n– 函数：`myFunction`\n– 方法：`myMethod`\n– 类：`MyClass`\n– 常量：`MY_CONSTANT`\n\
  – 变量：`myConstant`\n\n### 6.1.6 命名规范\n\n以下命名规范在 JavaScript 中很流行。如果对象的名称以下划线开头，则它被认为是私有的：\n\
  \n```javascript\nclass ValueWrapper {\n  constructor(value) {\n    this._value =\
  \ value;\n  }\n}\n```\n\n### 6.1.7 分号放在哪里？\n\n放在语句末尾：\n\n```javascript\nconst x\
  \ = 123;\nfunc();\n```\n\n但如果语句以大括号结尾则：\n\n```javascript\nwhile (false) {\n  //\
  \ ...\n}\n```\n\n然而，在这样的语句后添加分号并不是语法错误——它被解释为空空语句：\n\n```javascript\nfunction func()\
  \ {\n  // ...\n};\n```\n\n### 6.4: 语句 vs 表达式\n\n在这一节中，我们将探索 JavaScript 如何区分两种语法结构：语句和表达式。之后，我们发现这可能会导致问题，因为相同的语法取决于其使用位置可能有不同的含义。\n\
  \n### 6.4.1 语句\n\n语句是一段可以执行并执行某种操作的代码。例如，`if` 是一个语句：\n\n```javascript\nlet myStr;\n\
  if (myBool) {\n  myStr = 'Yes';\n} else {\n  myStr = 'No';\n}\n```\n\n另一个语句的示例：函数声明。\n\
  \n```javascript\nfunction twice(x) {\n  return x + x;\n}\n```\n\n### 6.4.2 表达式\n\
  \n\n\n\n\n表达式（expression）是可以求值并产生一个值的代码片段。例如，括号之间的代码就是一个表达式：\n\n```javascript\n\
  let myStr = (myBool ?  'Yes'  :  'No');\n```\n\n用于括号之间的运算符 `? :` 称为三元运算符。它是 `if`\
  \ 语句的表达式版本。\n\n让我们看更多关于表达式的示例。我们输入表达式，REPL 会为我们求值：\n\n> `'ab' + 'cd'`\n\n'abcd'\n\
  \n> `Number('123')`\n\n123\n\n> `true || false`\n\ntrue\n\n## 6.4 歧义语法\n\n### 6.4.3\
  \ 哪些地方允许做什么？\n\nJavaScript 源代码中的当前位置决定了你允许使用哪种语法结构：\n\n- 函数的体体必须是一序列的语句：\n\n```javascript\n\
  function max(x, y) {\n  if (x > y) {\n    return x;\n  } else {\n    return y;\n\
  \  }\n}\n```\n\n- 函数调用或方法调用的参数必须是表达式：\n\n```javascript\nconsole.log('ab'  +  'cd',\
  \ Number('123'));\n```\n\n然而，表达式可以作为语句使用。在这种情况下，它们被称为表达式语句（expression-statements）。反之则不然：当语境需要表达式时，你不能使用语句。\n\
  \n以下代码演示了任何表达式 `bar()` 既可以是表达式也可以是语句——这取决于语境：\n\n```javascript\nfunction f() {\n\
  \  console.log(bar());  // bar() 是表达式\n  bar();  // bar(); 是 (表达式)语句\n}\n```\n\n\
  ## 6.5 歧义语法\n\nJavaScript 有几处在语法上具有歧义的编程结构：相同的语法取决于它是在语句语文中还是表达式语文中使用的，会有不同的解释。本节将探讨这种现象以及它导致的陷阱。\n\
  \n### 6.5.1 相同语法：函数声明与函数表达式\n\n函数声明是一个语句：\n\n```javascript\nfunction id(x) {\n \
  \ return x;\n}\n```\n\n函数表达式是一个表达式（`=` 的右侧）：\n\n```javascript\nconst id = function\
  \ me(x) {\n  return x;\n};\n```\n\n### 6.5.2 相同语法：对象字面量与块\n\n在以下代码中，`{}` 是一个对象字面量：创建一个空对象的表达式。\n\
  \n```javascript\nconst obj = {};\n```\n\n这是一个空代码块（语句）：\n\n```javascript\n{\n}\n\
  ```\n\n### 6.5.3 消除歧义\n\n歧义在语句语文中才是问题：当 JavaScript 解析器遇到歧义语法时，它不知道这是一个普通语句还是表达式语句。例如：\n\
  \n- 如果语句以 `function` 开头：它是函数声明还是函数表达式？\n- 如果语句以 `{` 开头：它是对象字面量还是代码块？\n\n为了消除歧义，以\
  \ `function` 或 `{` 开头的语句永远不会被解释为表达式。如果你想让一个表达式语句以这两个标记中的之一开头，你必须将其封装在括号中：\n\n```javascript\n\
  (function (x) { console.log(x) })('abc');\n```\n\n输出：\n`'abc'`\n\n在这段代码中：\n\n1.\
  \ 我们首先通过函数表达式创建一个函数：`function (x) { console.log(x) }`\n2. 然后我们调用该函数：`('abc')`\n\n\
  `#` 仅被解释为表达式，因为我们将其封装在括号中。如果我们这样做，就会得到语法错误，因为此时 JavaScript 期望一个函数声明并对缺少函数名报错。此外，你不能在函数声明之后紧跟函数调用。\n\
  \n在书的后面，我们将看到更多由语法歧义引起的陷阱示例：\n\n- 通过对象解构赋值\n- 从箭头函数返回对象字面量\n\n## 6.6 分号\n\n### 6.6.1\
  \ 分号的经验法则\n\n每个语句都以分号结束。\n\n```javascript\nconst x = 3;\nsomeFunction('abc');\n\
  i++;\n```\n\n例外是：以块结尾的语句。\n\n```javascript\nfunction foo() {\n  // ···\n}\n\nif\
  \ (y > 0) {\n  // ···\n}\n```\n\n以下情况稍显复杂：\n\n```javascript\nconst func = () =>\
  \ {};  // 有分号！\n```\n\n整个 `const` 声明（一个语句）以分号结束，但在其内部有一个箭头函数表达式。也就是说：以大括号结束的并不是语句本身，而是嵌入的箭头函数表达式。这就是为什么结尾有一个分号。\n\
  \n### 6.6.2 分号：控制语句\n\n控制语句的体本身是一个语句。例如，这是 `while` 循环的语法：\n\n```javascript\nwhile\
  \ (condition)\n  statement\n```\n\n体可以是一个单一语句：\n\n```javascript\nwhile (a > 0) a--;\n\
  ```\n\n但块也是语句，因此是控制语句的合法体：\n\n```javascript\nwhile (a > 0) {\n  a--;\n}\n```\n\n\
  如果你想让循环有一个空体，你的第一个选择是空语句（只是一个分号）：\n\n```javascript\nwhile (processNextItem() > 0);\n\
  ```\n\n你的第二个选择是空块：\n\n```javascript\nwhile (processNextItem() > 0) {}\n```\n\n##\
  \ 6.7 自动分号插入 (ASI)\n\n虽然我建议始终写分号，但在 JavaScript 中，大多数分号都是可选的。使这一切成为可能的机制被称为自动分号插入（ASI）。在某种程度上，它修正了语法错误。\n\
  \nASI 的工作原理如下。语句的解析持续直到遇到以下情况之一：\n\n- 分号\n- 行终止符后跟一个非法标记\n\n换句话说，ASI 可以被视为插入分号。接下来的章节将介绍\
  \ ASI 的陷阱。\n\n### 6.7.1 意外触发的 ASI\n\n关于 ASI 的好消息是——你不依赖它并始终写分号——你只需要注意的一个陷阱。它就是\
  \ JavaScript 禁止在某些标记后换行。如果你确实插入了换行符，就会插入一个分号。例如，考虑以下代码：\n\n```javascript\nreturn\n\
  {\n  first: 'jane'\n}\n```\n\n这段代码被解析为：\n\n```javascript\nreturn;\n{\n  first: 'jane'\n\
  };\n```\n\n### 6.7.2 ASI 意外未触发\n\n在某些情况下，ASI 在你认为它应该触发时并没有触发。这让不喜欢分号的人的生活变得更加复杂，因为他们需要意识到这些情况。以下是三个示例：\n\
  \n示例 1：意外的函数调用。\n\n```javascript\na = b + c\n(d + e).print()\n```\n解析为：\n```javascript\n\
  a = b + c(d + e).print();\n```\n\n示例 2：意外的除法。\n\n```javascript\na = b\n/hi/g.exec(c).map(d)\n\
  ```\n解析为：\n```javascript\na = b / hi / g.exec(c).map(d);\n```\n\n示例 3：意外的属性访问。\n\
  \n```javascript\nsomeFunction()\n['ul', 'ol'].map(x => x + x)\n```\n执行为：\n```javascript\n\
  const propKey = ('ul','ol'); // 逗号运算符\nassert.equal(propKey, 'ol');\nsomeFunction()[propKey].map(x\
  \ => x + x);\n```\n\n## 6.8 分号：最佳实践\n\n我建议始终写分号：\n\n- 我喜欢它提供的代码结构——清晰地看到语句何时结束。\n\
  - 需要记住的规则更少。\n- 大多数 JavaScript 程序员使用分号。\n\n然而，也有很多人不喜欢分号带来的视觉混乱。如果你是这样：没有分号的代码是合法的。我建议使用工具来帮助避免错误。以下两个示例：\n\
  \n自动代码格式化工具 [Prettier](https://prettier.io) 可以配置为使用分号。它可以修复问题。例如，当它遇到以方括号头的行时，会在该行前加上分号。静态检查工具\
  \ [ESLint](https://eslint.org) 有一个规则 `https://eslint.org/docs/rules/semi`，你可以告诉它你偏好的样式（始终分号或尽可能少的分号），它会向你警告严重问题。\n\
  \n## 6.9 严格模式与松散模式\n\n从 ECMAScript 5 开始，JavaScript 有两种执行模式：\n\n- 正常的“松散模式”（sloppy\
  \ mode）：是脚本（作为模块的前身且被浏览器支持的代码片段）的默认模式。\n\n\n\n\n严格模式（Strict mode）：在模块和类中默认开启，并且可以在脚本中开启（后文将解释如何开启）。在这种模式下，普通模式的某些陷阱被移除，并且会抛出更多异常。\n\
  \n在现代 JavaScript 代码中，你很少遇到松散模式（sloppy mode），它几乎总是位于模块中。在本书中我假设严格模式始终开启状态。\n\n###\
  \ 6.9.1 开启严格模式\n\n在脚本文件和 `CommonJS` 模块中，你通过在第一行放置以下代码来为整个文件开启严格模式：\n\n```javascript\n\
  'use strict';\n```\n\n这个“指令”的巧妙之处在于，ES5 之前的 ECMAScript 版本会忽略它：它只是一个不执行任何操作的表达式语句。\n\
  \n你也可以只为单个函数开启严格模式：\n\n```javascript\nfunction functionInStrictMode() {\n  'use\
  \ strict';\n}\n```\n\n### 6.9.2 严格模式的改进\n\n让我们来看看严格模式比松散模式表现得更好的三件事。仅在本节中，所有代码片段都在松散模式下执行。\n\
  \n#### 6.9.2.1 松散模式陷阱：修改未声明的变量会创建全局变量\n\n在非严格模式下，修改未声明的变量会创建一个全局变量。\n\n```javascript\n\
  function sloppyFunc() {\n  undeclaredVar1 = 123;\n}\nsloppyFunc();\n```\n\n创建了全局变量\
  \ `undeclaredVar1`：`assert.equal(undeclaredVar1, 123);`\n\n严格模式处理得更好并抛出一个 `ReferenceError`。这使得更容易检测拼写错误。\n\
  \n```javascript\nfunction strictFunc() {\n  'use strict';\n  undeclaredVar2 = 123;\n\
  }\nassert.throws(\n  () => strictFunc(),\n  {\n    name: 'ReferenceError',\n   \
  \ message: 'undeclaredVar2 is not defined',\n  });\n```\n\n`assert.throws()` 表示其第一个参数（一个函数）在调用时会抛出\
  \ `ReferenceError`。\n\n#### 6.9.2.2 函数声明在严格模式下是块作用域，在松散模式下是函数作用域\n\n在严格模式下，通过函数声明创建的变量只存在于最内层的封闭块中：\n\
  \n```javascript\nfunction strictFunc() {\n  'use strict';\n  {\n    function foo()\
  \ { return 123 }\n  }\n  return foo(); // ReferenceError\n}\nassert.throws(\n  ()\
  \ => strictFunc(),\n  {\n    name: 'ReferenceError',\n    message: 'foo is not defined',\n\
  \  });\n```\n\n在松散模式下，函数声明是函数作用域：\n\n```javascript\nfunction sloppyFunc() {\n  {\n\
  \    function foo() { return 123 }\n  }\n  return foo(); // 正常工作\n}\nassert.equal(sloppyFunc(),\
  \ 123);\n```\n\n#### 6.9.2.3 松散模式在修改不可变数据时不抛出异常\n\n在严格模式下，如果你尝试修改不可变数据，将得到一个异常：\n\
  \n```javascript\nfunction strictFunc() {\n  'use strict';\n  true.prop = 1; // TypeError\n\
  }\nassert.throws(\n  () => strictFunc(),\n  {\n    name: 'TypeError',\n    message:\
  \ \"Cannot create property 'prop' on boolean 'true'\",\n  });\n```\n\n在松散模式下，赋值会静默失败：\n\
  \n```javascript\nfunction sloppyFunc() {\n  true.prop = 1; // 静默失败\n  return true.prop;\n\
  }\nassert.equal(sloppyFunc(), undefined);\n```\n\n延伸阅读：松散模式\n有关松散模式如何区别严格模式的更多信息，请参见\
  \ [MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode)。\n\
  \n### 7.1 尝试 JavaScript 代码\n\n你有许多选项可以快速运行 JavaScript 代码段。以下小节描述了其中一些。\n\n#### 7.1.1\
  \ 浏览器控制台\n\nWeb 浏览器有所谓的控制台（console）：交互式命令行，你可以通过 `console.log()` 向其打印文本，并在其中运行代码。打开控制台的方法因浏览器而异。图\
  \ 7.1 显示了 Google Chrome 的控制台。\n\n要查找如何在你的 Web 浏览器中打开控制台，你可以搜索“console <你的浏览器名称>”。以下是常用\
  \ Web 浏览器的页面：\n\n- [Apple Safari](https://developer.apple.com/safari/tools/)\n-\
  \ [Google Chrome](https://developers.google.com/web/tools/chrome-devtools/console/)\n\
  - [Microsoft Edge](https://docs.microsoft.com/en-us/microsoft-edge/devtools-guide/console)\n\
  - [Mozilla Firefox](https://developer.mozilla.org/en-US/docs/Tools/Web_Console/Opening_the_Web_Console)\n\
  \n#### 7.1.2 Node.js REPL\n\nREPL 代表 read-eval-print loop（读取-评估-打印循环），基本上意味着命令行。要使用它，你必须首先从操作系统的命令行通过\
  \ `node` 命令启动 Node.js。然后与它的交互看起来如图 7.2 所示：`>` 之后的文本是用户的输入；其他所有都是 Node.js 的输出。\n\n\
  阅读：REPL 交互\n我偶尔会通过 REPL 交互演示 JavaScript。这时我也使用大于号符号（`>`）来标记输入。例如：\n\n```text\n>\
  \ 3 + 5\n8\n```\n\n#### 7.1.3 其他选项\n\n其他选项包括：\n\n- 有许多 Web 应用允许你在 Web 浏览器中实验 JavaScript。例如，[Babel\
  \ 的 REPL](https://babeljs.io/repl)。\n- 还有用于运行 JavaScript 的原生应用和 IDE 插件。\n\n控制台通常在非严格模式下运行\n\
  现代 JavaScript 中，大多数代码（例如模块）在严格模式下执行。然而，控制台通常在非严格模式下运行。因此，当你使用控制台执行本书中的代码时，偶尔可能会得到不同的结果。\n\
  \n### 7.2 console.* API：打印数据及更多\n\n在浏览器中，控制台是你可以调出的通常情况下隐藏的内容。对于 Node.js，控制台是 Node.js\
  \ 当前运行的终端。\n\n控制台：交互式 JavaScript 命令行\n完整的 `console.*` API 文档可以在 [MDN Web 文档](https://developer.mozilla.org/en-US/docs/Web/API/console)\
  \ 和 [Node.js 网站](https://nodejs.org/api/console.html) 上找到。它不是 JavaScript 语言标准的一部分，但浏览器和\
  \ Node.js 都支持其许多功能。\n\n在本章中，我们只查看以下两种打印数据的方法。“打印”意味着显示在控制台中。\n\n`console.log()`\
  \ `console.error()`\n\n#### 7.2.1 打印值：console.log() (stdout)\n\n此操作有两种变体：\n\n```javascript\n\
  console.log(...values: any[]): void\nconsole.log(pattern: string, ...values: any[]):\
  \ void\n```\n\n#### 7.2.1.1 打印多个值\n\n第一种变体在控制台上打印值的（文本表示形式）：\n\n```javascript\n\
  console.log('abc', 123, true);\n```\n输出：`abc 123 true`\n\n在最后，`console.log()` 总是打印一个换行。因此，如果你带零参数调用它，它只会打印一个换行。\n\
  \n#### 7.2.1.2 打印带有替换的字符串\n\n第二种变体执行字符串替换：\n\n```javascript\nconsole.log('Test:\
  \ %s %j', 123, 'abc');\n```\n输出：`Test: 123 \"abc\"`\n\n这些是你可以用于替换的一些指令：\n\n- `%s`\
  \ 将对应的值转换为字符串并插入。\n\n```javascript\nconsole.log('%s %s', 'abc', 123);\n```\n输出：`abc\
  \ 123`\n\n- `%o` 插入对象的字符串表示。\n\n\n\n\n```\nconsole.log('%o', {foo: 123, bar: 'abc'});\n\
  ```\nOutput:\n`{ foo: 123, bar: 'abc' }`\n\n`%j` 将一个值转换为 JSON 字符串并插入。\n\n```javascript\n\
  console.log('%j', {foo: 123, bar: 'abc'});\n```\nOutput:\n`{\"foo\":123,\"bar\"\
  :\"abc\"}`\n\n```\n\n## 7.2 `console.*` API：打印数据及更多\n\n• `%%` 插入单个 `%`。\n\n```\n\
  console.log('%s%%', 99);\n```\nOutput:\n`99%`\n```\n\n### 7.2.2 打印错误信息：`console.error()`\
  \ (stderr)\n\n`console.error()` 的用法与 `console.log()` 相同，但它记录的内容被视为错误信息。对于 Node.js，这意味着输出在\
  \ Unix 上发送到 `stderr` 而不是 `stdout`。\n\n### 7.2.3 通过 `JSON.stringify()` 打印嵌套对象\n\n\
  `JSON.stringify()` 有时用于打印嵌套对象：\n\n```javascript\nconsole.log(JSON.stringify({first:\
  \ 'Jane', last: 'Doe'}, null, 2));\n```\nOutput:\n```json\n{\n\"first\": \"Jane\"\
  ,\n\"last\": \"Doe\"\n}\n```\n\n# 第 8 章：断言 API\n\n### 目录\n- 8.1 软件开发中的断言\n- 8.2\
  \ 断言在书中如何使用\n    - 8.2.1 通过断言在代码示例中记录结果\n    - 8.2.2 通过断言实现测试驱动的练习\n- 8.3 普通比较 vs.\
  \ 深度比较\n- 8.4 快速查阅：模块 `assert`\n    - 8.4.1 普通等价\n    - 8.4.2 深度相等\n    - 8.4.3\
  \ 预期异常\n    - 8.4.4 另一个工具函数\n\n## 8.1 软件开发中的断言\n\n在软件开发中，断言是指关于值或代码段必须为真的的事实。如果不成立，则会抛出异常。Node.js\
  \ 通过其内置模块 `assert` 支持断言。例如：\n\n```javascript\nimport {strict as assert} from 'assert';\n\
  assert.equal(3 + 5, 8);\n```\n该断言表示 `3 加 5` 的预期结果为 `8`。该导入语句使用了推荐的严格模式 `assert`\
  \ 版本。\n\n## 8.2 断言在书中如何使用\n\n在书中，断言有两种用法：用于在代码示例中记录结果，以及用于实现测试驱动的练习。\n\n### 8.2.1\
  \ 通过断言在代码示例中记录结果\n\n在代码示例中，断言表示预期的结果。例如以下函数：\n\n```javascript\nfunction id(x) {\n\
  \  return x;\n}\n```\n`id()` 返回它的参数。我们可以通过断言展示它的运行情况：\n\n```javascript\nassert.equal(id('abc'),\
  \ 'abc');\n```\n在示例中，我通常省略了导入 `assert` 的语句。使用断言的动机是：\n- 你可以精确指定预期内容。\n- 代码示例可以进行自动测试，从而确保它们确实有效。\n\
  \n### 8.2.2 通过断言实现测试驱动的练习\n\n书中的练习是通过测试框架 `AVA` 进行测试驱动的。测试内部的检查通过 `assert` 的方法完成。\n\
  \n以下此类测试的示例：\n\n```javascript\n// 对于练习，你必须实现 hello() 函数。\n// 测试会检查你是否正确完成。\ntest('First\
  \ exercise', t => {\n  assert.equal(hello('world'), 'Hello world!');\n  assert.equal(hello('Jane'),\
  \ 'Hello Jane!');\n  assert.equal(hello('John'), 'Hello John!');\n  assert.equal(hello(''),\
  \ 'Hello !');\n});\n```\n更多信息，请参阅 §9 “开始学习测验与练习”。\n\n## 8.3 普通比较 vs. 深度比较\n\n严格的\
  \ `equal()` 使用 `===` 来比较值。因此，一个对象只等于它自己——即使另一个对象具有相同的内容（因为 `===` 不比较对象的内容，只比较它们的标识性/引用性）：\n\
  \n```javascript\nassert.notEqual({foo: 1}, {foo: 1});\n```\n`deepEqual()` 是比较对象的更好选择：\n\
  \n```javascript\nassert.deepEqual({foo: 1}, {foo: 1});\n```\n该方法也适用于数组：\n\n```javascript\n\
  assert.deepEqual(['a', 'b', 'c'], ['a', 'b', 'c']);\n```\n\n## 8.4 快速查阅：模块 `assert`\n\
  \n完整文档请参阅 [Node.js 文档](https://nodejs.org/api/assert.html)。\n\n### 8.4.1 普通等价\n\n\
  ```javascript\nfunction equal(actual: any, expected: any, message?: string): void\n\
  // actual === expected 必须为真。如果不是，则抛出 AssertionError。\nassert.equal(3, 3);\n```\n\
  ```javascript\nfunction notEqual(actual: any, expected: any, message?: string):\
  \ void\n// actual !== expected 必须为真。如果不是，则抛出 AssertionError。\nassert.notEqual(3,\
  \ 2);\n```\n可选的 `message` 可用于解释断言的内容。如果断言失败，该消息将用于设置 `AssertionError`。\n\n```javascript\n\
  let e;\ntry {\n  assert.equal(x, 8, 'x must be equal to 8');\n} catch (err) {\n\
  \  assert.equal(String(err), 'AssertionError [ERR_ASSERTION]: x must be equal to\
  \ 8');\n}\n```\n\n### 8.4.2 深度相等\n\n```javascript\nfunction deepEqual(actual: any,\
  \ expected: any, message?: string): void\n// actual 必须与 expected 深度相等。如果不是，则抛出 AssertionError。\n\
  assert.deepEqual([1, 2, 3], [1, 2, 3]);\nassert.deepEqual([], []);\n```\n```javascript\n\
  function notEqual(actual: any, expected: any, message?: string): void\n// actual\
  \ 不能与 expected 深度相等。如果相等，则抛出 AssertionError。\nassert.notEqual([1, 2, 3], [1, 2]);\n\
  ```\n\n### 8.4.3 预期异常\n\n如果你想接收异常，需要 `throws()`。该函数调用它的第一个参数（`block`），并且只有在它抛出异常时才成功。\n\
  \n```javascript\nfunction throws(block: Function, error?: Object, message?: string):\
  \ void\nassert.throws(() => {\n  // throw error\n}, {\n  name: 'TypeError',\n  message:\
  \ `read property 'prop' of null`,\n});\n```\n\n### 8.4.4 另一个工具函数\n\n```javascript\n\
  function fail(message: string | Error): never\n// 调用时抛出 AssertionError。这在单元测试中偶尔很有用。\n\
  try {\n  functionShouldThrow();\n  assert.fail();\n} catch (_) {\n  // 成功\n}\n```\n\
  \n# 第 9 章：开始学习测验与练习\n\n### 目录\n- 9.1 测验\n- 9.2 练习\n    - 9.2.1 安装练习\n    - 9.2.2\
  \ 运行练习\n- 9.3 JavaScript 中的单元测试\n    - 9.3.1 典型测试\n    - 9.3.2 AVA 中的异步测试\n\n##\
  \ 9.1 测验\n\n安装：\n下载并解压 `impatient-js-quiz.zip`\n\n\n\n\n\n运行测试应用：\n\n在网络浏览器中打开 `impatient-js-quiz/index.html`。\n\
  \n你将看到所有测验的目录（TOC）。\n\n## 9.2 练习\n\n### 9.2.1 安装练习\n\n要安装练习：\n\n- 下载并解压 `impatient-js-code.zip`\n\
  - 遵循 `README.txt` 中的指令操作\n\n### 9.2.2 运行练习\n\n书书中通过路径引用练习程序。\n\n- 例如：`exercises/quizzes-exercises/first_module_test.mjs`\n\
  \n在每个文件中：\n\n- 第一行包含运行该练习的命令。\n- 随后的行描述了你需要执行的操作。\n\n## 9.3 JavaScript 中的单元测试\n\n\
  书中的所有练习都是通过测试框架 [AVA](https://github.com/avajs/ava) 运行的测试。本节将进行简要介绍。\n\n### 9.3.1\
  \ 一个典型的测试\n\n典型的测试代码分为两部分：\n\n- 部分 1：待测试的代码。\n- 部分 2：针对代码的测试用例。\n\n以以下两个文件为例：\n\n\
  - `id.mjs`（待测试的代码）\n- `id_test.mjs`（测试）\n\n#### 9.3.1.1 部分 1：代码\n\n代码本身位于 `id.mjs`\
  \ 中：\n\n```javascript\nexport function id(x) {\n  return x;\n}\n```\n\n这里的关键点是：你想要测试的内容都必须导出（export）。否则，测试代码无法访问它。\n\
  \n#### 9.3.1.2 部分 2：测试\n\n不用担心测试的具体细节：它们总是为你实现好的。因此，你只需要阅读它们，而不需要编写它们。\n\n代码的测试位于\
  \ `id_test.mjs` 中：\n\n```javascript\nimport test from 'ava';  // (A)\nimport {strict\
  \ as assert} from 'assert';  // (B)\nimport {id} from './id.mjs';  // (C)\n\ntest('My\
  \ test', t => {  // (D)\n  assert.equal(id('abc'), 'abc');  // (E)\n});\n```\n\n\
  该测试文件的核心是 E 行 —— 一个断言：`assert.equal()` 指定了 `id('abc')` 的预期结果为 `'abc'`。\n\n至于其他行：\n\
  \n- 行 A：我们导入测试框架。\n- 行 B：我们导入断言库。AVA 内置了断言，但 `assert` 模块让我们能够保持与原生 Node.js 的兼容。\n\
  - 行 C：我们导入要测试的函数。\n- 行 D：我们定义了一个测试。这是通过调用 `test()` 函数实现的：\n  - 第一个参数：测试的名称。\n  -\
  \ 第二参数：测试代码，通过箭头函数提供。参数 `t` 让我们能够访问 AVA 的测试 API（断言等）。\n\n要运行测试，我们在命令行中执行以下：\n\n\
  ```bash\nnpm t demos/quizzes-exercises/id_test.mjs\n```\n\n`t` 是 `test` 的缩写。也就是说，该命令的完整版本为：\n\
  \n```bash\nnpm test demos/quizzes-exercises/id_test.mjs\n```\n\n练习：你的第一个练习\n\n以下练习让你初次体验练习的样式：\n\
  \n`exercises/quizzes-exercises/first_module_test.mjs`\n\n### 9.3.2 AVA 中的异步测试\n\n\
  你可以推到学习异步编程章节后再阅读本节。\n\n为异步代码编写测试需要额外的工作：测试稍后接收结果，并在返回时必须向 AVA 信号它尚未完成。以下小节将探讨实现这种操作的三种方法。\n\
  \n#### 9.3.2.1 通过回调实现异步\n\n如果我们调用 `test.cb()` 而不是 `test()`，AVA 会切换到基于回调的异步模式。\n\n\
  ```javascript\ntest.cb('divideCallback', t => {\n  divideCallback(8, 4, (error,\
  \ result) => {\n    if (error) {\n      t.end(error);\n    } else {\n      assert.strictEqual(result,\
  \ 2);\n      t.end();\n    }\n  });\n});\n```\n\n#### 9.3.2.2 通过 Promise 实现异步\n\n\
  如果测试返回一个 `Promise`，AVA 会切换到基于 Promise 的异步模式。如果 Promise 被履行（fulfilled），则认为测试成功，如果\
  \ Promise 被拒绝（rejected）则认为失败。\n\n```javascript\ntest('dividePromise 1', t => {\n\
  \  return dividePromise(8, 4)\n    .then(result => {\n      assert.strictEqual(result,\
  \ 2);\n    });\n});\n```\n\n#### 9.3.2.3 异步函数作为测试“主体”\n\n异步函数总是返回 Promise。因此，异步函数是实现异步测试的一种方便方式。以下代码与上一个示例等效。\n\
  \n```javascript\ntest('dividePromise 2', async t => {\n  const result = await dividePromise(8,\
  \ 4);\n  assert.strictEqual(result, 2);\n});\n```\n\n不需要显式返回任何内容：隐式返回 `undefined`\
  \ 用于履行该函数返回 Promise。如果测试代码抛出异常，异步函数将处理拒绝该 Promise。\n\n## 10 变量与赋值\n\n这些是 JavaScript\
  \ 声明变量的主要方式：\n\n- `let` 声明可变变量。\n- `const` 声明常量（不可变变量）。\n\n在 ES6 之前，还有 `var`。但它有很多特殊之处，因此在现代\
  \ JavaScript 中最好避免使用。你可以在 [\"Speaking JavaScript”](http://speakingjs.com/es5/ch16.html)\
  \ 中阅读更多信息。\n\n### 10.1 let\n\n通过 `let` 声明的变量是变的：\n\n```javascript\nlet i;\ni = 0;\n\
  i = i + 1;\nassert.equal(i, 1);\n```\n\n### 10.2 const\n\n通过 `const` 声明的变量是不可变的。你必须始终初始化：\n\
  \n```javascript\nconst i = 0; // 必须初始化\nassert.throws(\n  () => { i = i + 1 },\n\
  \  {\n    name: 'TypeError',\n    message: 'Assignment to constant variable.',\n\
  \  }\n);\n```\n\n\n\n\n## 10.2.1 `const` 与不可变性\n\n在 JavaScript 中，`const` 仅意味着绑定（变量名与变量值之间的关联）是不可变的。值本身可能是可变的，例如示例中的\
  \ `obj`。\n\n```javascript\nconst obj = { prop: 0 };\n```\n\n允许：修改 `obj` 的属性：`obj.prop\
  \ = obj.prop + 1; assert.equal(obj.prop, 1);`\n\n不允许：给 `obj` 赋值：`assert.throws(\n\
  \  () => { obj = {} },\n  {\n    name: 'TypeError',\n    message: 'Assignment to\
  \ constant variable.',\n  }\n);`\n\n## 10.2.2 `const` 与循环\n\n你可以在 `for-of` 循环中使用\
  \ `const`，其中为每次迭代都会创建一个新的绑定：\n\n```javascript\nconst arr = ['hello', 'world'];\n\
  \nfor (const elem of arr) {\n  console.log(elem);\n}\n```\n**输出：**\n'hello'\n'world'\n\
  \n但在普通的 `for` 循环中，你必须使用 `let`：\n\n```javascript\nconst arr = ['hello', 'world'];\n\
  \nfor (let i=0; i<arr.length; i++) {\n  const elem = arr[i];\n  console.log(elem);\n\
  }\n```\n\n## 10.3 在 `let` 和 `const` 之间做决定\n\n我建议遵循以下规则决定决定 `let` 还是 `const`：\n\n\
  - `const` 表示不可变的绑定，且变量永远不会改变值。优先使用它。\n- `let` 表示变量的值会改变。只有在无法使用 `const` 时才使用它。\n\
  \n![](img/image01418.jpeg)![](img/image01419.jpeg)\n![](img/image01416.jpeg) **练习：**\
  \ `const`\n`exercises/variables-assignment/const_exrc.mjs`\n\n## 10.4 变量的作用域\n\n\
  变量的作用域程序可以访问它的区域。考虑以下代码。\n\n```javascript\n{ // 作用域 A。可访问：x\n  const x = 0;\n  assert.equal(x,\
  \ 0);\n\n  { // 作用域 B。可访问：x, y\n    const y = 1;\n    assert.equal(x, 0);\n    assert.equal(y,\
  \ 1);\n\n    { // 作用域 C。可访问：x, y, z\n      const z = 2;\n      assert.equal(x, 0);\n\
  \      assert.equal(y, 1);\n      assert.equal(z, 2);\n    }\n  }\n}\n\n// 外部。不可访问：x,\
  \ y, z\nassert.throws(\n  () => console.log(x),\n  {\n    name: 'ReferenceError',\n\
  \    message: 'x is not defined',\n  }\n);\n```\n\n- `Scope A` 是 `x` 的（直接）作用域。\n\
  - `Scopes B` 和 `C` 是 `scope A` 的内部作用域。\n- `Scope A` 是 `scope B` 和 `scope C` 的外部作用域。\n\
  \n每个变量在它的直接作用域以及所有嵌套在作用作用域内的所有作用域中都是可访问的。\n通过 `const` 和 `let` 声明的变量被称为块级作用域变量，因为它们的作用域总是周围最内层的块。\n\
  \n### 10.4.1 变量遮蔽（Shadowing）\n\n你不能在同一层声明两次相同的变量：\n\n```javascript\nassert.throws(\n\
  \  () => {\n    eval('let x = 1; let x = 2;');\n  },\n  {\n    name: 'SyntaxError',\n\
  \    message: \"Identifier 'x' has already been declared\",\n  }\n);\n```\n\n![](img/image01410.jpeg)![](img/image01420.jpeg)\n\
  ![](img/image01403.jpeg) **为什么用 `eval()`？** `eval()` 推延迟了解析（因此延迟了 `SyntaxError`），直到\
  \ `assert.throws()` 的回调执行。如果我们不使用它，在代码被解析时就会得到错误，`assert.throws()` 甚至不会执行。\n\n然而，你可以嵌套一个块，并使用与块外部相同的变量名\
  \ `x`：\n\n```javascript\nconst x = 1;\nassert.equal(x, 1);\n\n{\n  const x = 2;\n\
  \  assert.equal(x, 2);\n}\n\nassert.equal(x, 1);\n```\n\n在块内部，内部的 `x` 是该名称唯一可访问的变量。内部的\
  \ `x` 屏蔽了外部的 `x`。一旦离开块，你就可以再次访问旧值。\n\n![](img/image01399.jpeg)![](img/image01396.jpeg)\n\
  ![](img/image01397.jpeg) **测试：** \n查看测试应用程序。\n\n## 10.5 (高级)\n\n所有剩余章节都是高级内容。\n\n\
  ## 10.6 术语：静态 vs 动态\n\n这两个形容词描述了编程语言中的现象：\n\n- **静态 (Static)** 意味着某些与源代码有关，可以在不执行代码的情况下确定。\n\
  - **动态 (Dynamic)** 意味着运行时。\n\n让我们这两个术语的示例。\n\n### 10.6.1 静态现象：变量的作用域\n\n变量作用域是一种静态现象。考虑以下代码：\n\
  \n```javascript\nfunction f() {\n  const x = 3;\n  // ···\n}\n```\n\n`x` 是静态（或词法）作用域的。也就是说，它的作用域是固定的，不会在运行时改变。\n\
  变量作用域形成了一个静态树（通过静态嵌套）。\n\n### 10.6.2 动态现象：函数调用\n\n函数调用是一种动态现象。考虑以下代码：\n\n```javascript\n\
  function f() {\n  const x = 3;\n  // ···\n}\n```\n\n`x` 是静态（或词法）作用域的。也就是说，它的作用域是固定的，不会在运行时改变。\n\
  变量作用域形成了一个静态树（通过静态嵌套）。\n\n## 10.7 全局对象\n\n变量作用域是一种静态现象。考虑以下代码：\n\n```javascript\n\
  function f() {\n  const x = 3;\n  // ···\n}\n```\n\n`x` 是静态（或词法）作用域的。也就是说，它的作用域是固定的，不会在运行时改变。\n\
  变量作用域形成了一个静态树（通过静态嵌套）。\n\n### 10.7.1 全局对象\n\n全局对象提供了对全局变量的访问。在 JavaScript 中，全局对象由环境提供。\n\
  \n全局对象可以通过特殊变量可用：\n\n- `window`：引用全局对象的经典方式。但它只在普通的浏览器代码中有效，在 Node.js 中无效。\n- `self`：在浏览器各处可用，包括\
  \ Web Workers。但 Node.js 不支持。\n- `global`：仅在 Node.js 中可用。\n\n让我们 `window` 如何工作：\n\
  \n```javascript\n// 在脚本顶层\nvar myGlobalVariable = 123;\nassert.equal('myGlobalVariable'\
  \ in window, true);\n\ndelete window.myGlobalVariable;\nassert.throws(() => console.log(myGlobalVariable),\
  \ ReferenceError);\n\n// 在任何地方创建全局变量：\nif (true) {\n  window.anotherGlobalVariable\
  \ = 'abc';\n}\nassert.equal(anotherGlobalVariable, 'abc');\n```\n\n### 10.7.2 避免全局对象\n\
  \nBrendan Eich 将全局对象称为他对 JavaScript 最大遗憾之一。最好不要将变量放入它的作用域中：\n\n- 通常，对于网页上所有脚本全局的变量存在命名冲突的风险。\n\
  - 通过全局对象，你可以在任何地方创建和删除全局变量。这样做会导致代码变得不可预测，因为通常在嵌套作用域中无法进行这种更改。\n\n## 10.8 声明：作用域与激活\n\
  \n这些是声明的两个关键方面：\n\n- **作用域 (Scope)**：声明的实体可以在哪里被看到？这是一个静态特征。\n\n\n\n\n\n# 激活：我何时可以访问实体？这是一个动态特性。某些实体在我们进入其作用域后就可以被访问。对于其他实体，我们必须等候执行到达它们的声明处。\n\
  \n表 10.1 总结了各种声明如何处理这些方面。\n\n## 7010 变量与赋值\n\n表 10.1：声明的各个方面。“重复”（Duplicates）描述了声明是否可以在（每个作用域内）使用相同的名称两次。“全局属性”（Global\
  \ prop.）描述了声明在脚本的全局作用域执行时，是否会向全局对象添加属性。`TDZ` 意味着临时死区（后文将解释）。(*) 函数声明通常是块级作用域的但在但在严格模式（sloppy\
  \ mode）下是函数作用域的。\n\n![](img/image01422.jpeg)\n\n| | 作用域 | 激活 | 重复 | 全局属性 |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| `const` | 块 | 声明 (`TDZ`) | ✘ | ✘ |\n| `let` |\
  \ 块 | 声明 (`TDZ`) | ✘ | ✘ |\n| `function` | 块 (*) | 启动 | ✔ | ✔ |\n| `class` | 块 |\
  \ 声明 (`TDZ`) | ✘ | ✘ |\n| `import` | 模块 | 与 export 相同 | ✘ | ✘ |\n| `var` | 函数 |\
  \ 启动，部分激活 | ✔ | ✔ |\n\n`import` 在 §24.4 “ECMAScript 模块”中描述。接下来的章节将更详细地描述其他构造。\n\n\
  ### 10.8.1 `const` 和 `let`：临时死区\n\n对于 JavaScript，`TC39` 需要决定如果在直接作用域内、在声明之前访问常量会发生什么：\n\
  \n```javascript\n{\n  console.log(x);  // 这里会发生什么？\n  const x;\n}\n```\n\n一些可能的方法是：\n\
  \n- 在当前作用域周围的作用域中解析名称。\n- 你得到 `undefined`。\n- 产生一个错误。\n- (1) 被拒绝了，因为该语言中没有这种方法的先例。因此这对于\
  \ JavaScript 程序员来说是不直观的。\n- (2) 被拒绝了，因为那样 `x` 就不是一个常量了——它在声明之前之后会有不同的值。\n- `let`\
  \ 使用与 `const` 相同的方法 (3)，以便它们的工作方式相似，并且容易在它们之间切换。\n\n在进入变量作用域到执行其声明之间的时间被称为该变量的临时死区\
  \ (`TDZ`)：\n\n- 在这段时间内，该变量被认为是未初始化的（就像它拥有一个特殊值一样）。\n- 如果你访问未初始化的变量，你将得到一个 `ReferenceError`。\n\
  \n| 10.8 声明：作用域与激活 | 71 |\n\n一旦你到达变量声明处，变量将被设置为初始化器的值（通过赋值符号指定）或 `undefined` ——如果没有初始化器的话。\n\
  \n以下代码说明了临时死区：\n\n```javascript\nif (true) {\n  // 进入 `tmp` 的作用域，TDZ 开始\n  // `tmp`\
  \ 是未初始化的：\n  assert.throws(() =>  (tmp = 'abc'), ReferenceError); \n  assert.throws(()\
  \ => console.log(tmp), ReferenceError);\n  let tmp;  // TDZ 结束\n  assert.equal(tmp,\
  \ undefined);\n}\n```\n\n下一个示例显示了临时死区真的是时间性的（与时间相关）：\n\n```javascript\nif (true)\
  \ {\n  // 进入 `myVar` 的作用域，TDZ 开始\n  const func = () => {\n    console.log(myVar);\
  \  // 后执行\n  };\n  // 我们在 TDZ 内部：\n  // 访问 `myVar` 会导致 ReferenceError\n  let myVar\
  \ = 3;  // TDZ 结束\n  func();  // OK，在 TDZ 外部调用\n}\n```\n\n尽管 `func()` 位于 `myVar`\
  \ 声明之前并使用了该变量，我们仍然可以调用 `func()`。但我们必须等到 `myVar` 的临时死区结束。\n\n### 10.8.2 函数声明与早期激活\n\
  \n![](img/image01423.jpeg)![](img/image01424.jpeg)\n\n![](img/image01409.jpeg) 关于函数的更多信息\n\
  \n在本节中，我们正在使用函数——在我们还没有机会正确学习它们之前。希望一切仍然说得通。每当不通时请参见 §23 “可调用值”。\n\n函数声明在进入其作用域时始终会被执行，无论它位于该作用域的什么位置。这使你能够在声明之前调用函数\
  \ `foo()`：\n\n```javascript\nassert.equal(foo(), 123);  // OK\nfunction foo() {\
  \ return 123; }\n```\n\n`foo()` 的早期激活意味着之前的代码等同于：\n\n```javascript\nfunction foo()\
  \ { return 123; }\nassert.equal(foo(), 123);\n```\n\n7210 变量与赋值\n\n如果你通过 `const`\
  \ 或 `let` 声明函数，那么它就不会被早期激活：在下面的示例中，你只能在声明 `bar()` 之后使用它。\n\n```javascript\nassert.throws(\n\
  \  () => bar(), // 声明之前\n  ReferenceError\n);\nconst bar = () => { return 123; };\n\
  assert.equal(bar(), 123);  // 声明之后\n```\n\n#### 10.8.2.1 在没有早期激活的情况下提前调用\n\n即使函数\
  \ `g()` 没有被早期激活，它也可以被前面的函数 `f()`（在同一作用域内）调用——只要我们遵循以下规则：`f()` 必须在 `g()` 声明之后调用。\n\
  \n```javascript\nconst f = () => g();\nconst g = () => 123;\n// 我们在 g 声明后调用 f()\n\
  assert.equal(f(), 123);\n```\n\n在模块中，你很少需要担心这个。最后，注意早期激活如何自动让函数声明处于优先。\n\n#### 10.8.2.2\
  \ 早期激活的陷阱\n\n如果你依赖早期激活在声明之前调用 `funcDecl()`，你需要小心：\n\n```javascript\nconst MY_STR\
  \ = 'abc';\nfunction funcDecl() {\n  assert.throws(() => MY_STR, ReferenceError);\n\
  }\n```\n\n如果你在声明后进行调用，问题就会消失。\n\n#### 10.8.2.3 早期激活的优缺点\n\n我们看到早期激活有一个陷阱，而且你可以在不使用它的的情况下获得大部分益处。因此，避免早期激活更好。但我喜欢函数声明的语法。\n\
  \n| 10.8 声明：作用域与激活 | 73 |\n\n### 10.8.3 类声明不是早期激活的\n\n尽管类声明在某些方面与函数声明相似，但类声明不是早期激活的：\n\
  \n```javascript\nassert.throws(() => new MyClass(), ReferenceError);\nclass MyClass\
  \ {}\nassert.equal(new MyClass() instanceof MyClass, true);\n```\n\n为什么呢？考虑以下类声明：`extends`\
  \ 的操作数是一个表达式。因此，你可以做这些：\n\n```javascript\nconst identity = x => x;\nclass MyClass\
  \ extends identity(Object) {}\n```\n\n### 10.8.4 `var`：提升（部分早期激活）\n\n`var` 是一种旧的变量声明方式，早于\
  \ `const` 和 `let`（现在倾向于使用它们）。考虑以下 `var` 声明：\n\n```javascript\nvar x = 123;\n```\n\
  \n该声明有两个部分：\n\n- 声明 `var x`：`var` 声明变量的作用域是最内层的周围函数，而不是最内层的块（像大多数其他声明那样）。这种变量在在其作用域开始时已经是激活的，并被初始化为\
  \ `undefined`。\n- 赋值 `x = 123`：赋值始终原地执行。\n\n以下代码演示了 `var` 的影响：\n\n```javascript\n\
  function f() {\n  // 部分早期激活：assert.equal(x, undefined);\n  if (true) {\n    var\
  \ x = 123;\n    // 赋值在原地执行：assert.equal(x, 123);\n  }\n  // 作用域是函数而不是块：assert.equal(x,\
  \ 123);\n}\n```\n\n7410 变量与赋值\n\n## 10.9 闭包\n\n在探索闭包之前，我们需要学习绑定变量和自由变量。\n\n### 10.9.1\
  \ 绑定变量与 自由变量\n\n根据作用域，有一组被提到的变量。在这些变量中，我们区分：\n\n- 绑定变量是在作用域内声明的。它们是参数和局部变量。\n- 自由变量是在外部声明的。它们也被称为非局部变量。\n\
  \n考虑以下代码：\n\n```javascript\nfunction func(x) {\n  const y = 123;\n}\n```\n\n\n\n\
  \n\n```javascript\nconsole.log(z);\n\n}\n```\n\n在 `func()` 的体中，`x` 和 `y` 是绑定变量。`z`\
  \ 是一个自由变量。\n\n## 10.9.2 什么是闭包？\n\n那么，什么是闭包呢？\n\n闭包是一个函数加上与其“出生地”存在的变量的连接。\n\n保持这种连接的意义是什么？它为函数的自由变量提供了值。例如：\n\
  \n```javascript\nfunction funcFactory(value) {\n  return () => {\n    return value;\n\
  \  };\n}\n\nconst func =  funcFactory('abc');\n\nassert.equal(func(),  'abc'); \
  \ // (A)\n```\n\n`funcFactory` 返回一个被赋值给 `func` 的闭包。因为 `func` 拥有与其出生地变量的连接，当它在 A\
  \ 行被调用时，它仍然可以访问自由变量 `value`（尽管它“逃逸”了作用域）。\n\n![](img/image01425.jpeg)![](img/image01426.jpeg)\n\
  \n![](img/image01427.jpeg) JavaScript 中的所有函数都是闭包\n\nJavaScript 通过闭包支持静态作用域。因此，每个函数都是闭包。\n\
  \n| 10.9 闭包 | 75 |\n\n## 10.9.3 示例：自增器工厂\n\n以下函数返回自增器（一个我随口的名字）。自增器是一个内部存储一个数字的函数。当它被调用时，它通过将参数加到数字上更新该数字并返回新值。\n\
  \n```javascript\nfunction createInc(startValue) {\n  return (step) => {  // (A)\n\
  \    startValue += step;\n    return startValue;\n  };\n}\n\nconst inc =  createInc(5);\n\
  \nassert.equal(inc(2),  7);\n```\n\n我们可以看到 A 行创建的函数在自由变量 `startValue` 中保留它的内部数字。这次，我们不仅仅是从出生作用域读取，还利用它来存储我们会改变的、且跨函数调用持续的数据。\n\
  \n我们可以通过局部变量在出生作用域中创建更多的存储槽：\n\n```javascript\nfunction createInc(startValue) {\n\
  \  let index =  -1;\n  return (step) => {\n    startValue += step;\n    index++;\n\
  \    return [index, startValue];\n  };\n}\n\nconst inc =  createInc(5);\n\nassert.deepEqual(inc(2),\
  \ [0,  7]);\n\nassert.deepEqual(inc(2), [1,  9]);\n\nassert.deepEqual(inc(2), [2,\
  \  11]);\n```\n\n## 10.9.4 闭包的用例\n\n闭包有什么用？\n\n- 首先，它们仅仅是静态作用域的实现。因此，它们为回调函数提供了上下文数据。\n\
  - 它们也可以被函数用于存储跨函数调用用的持续的状态。`createInc()` 就是一个例子。\n- 它们还可以为对象（通过字面量或类产生）提供私有数据。关于其工作原理的细节在[探索\
  \ ES6](https://exploringjs.com/es6/ch_classes.html#_private-data-via-constructor-environments)中解释。\n\
  \n![](img/image01395.jpeg)![](img/image01396.jpeg)\n\n![](img/image01397.jpeg) 测验：高级\n\
