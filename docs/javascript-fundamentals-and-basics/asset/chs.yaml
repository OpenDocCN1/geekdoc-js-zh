  \ 方法从选择框移除焦点。\n-   `select` 对象可用的事件处理器如下：\n\n| 事件处理器 | 在什么情况下运行 JavaScript 代码 |\n\
  | :--- | :--- |\n| `onblur` | 选择框失去焦点 |\n| `onfocus` | 选择框获得焦点 |\n| `onchange` |\
  \ 选择框的值被修改 |\n-   当用户从选择框中选择选项时调用操作的方法，是准备一个 JavaScript 函数，该函数将通过 `select` 对象的 `onchange`\
  \ 事件处理器被调用：\n```html\n<select name=\"name\" onchange=\"functionname()\">\n```\n\n\
