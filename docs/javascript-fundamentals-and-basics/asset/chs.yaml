  \n## 25  与浏览器窗口交互\n\n### 关键点\n\n- 使用标准的 HTML 链接，我们可以打开新的浏览器窗口：\n\n```html\n<a href=\"\
  #\" target=\"_new\">link</a>\n```\n\n- 然而，这种方法对结果图像提供的控制力为零。我们无法通过这种方法控制窗口的大小、形状、在屏幕上的位置或其他窗口的任何属性。\n\
  - JavaScript 允许我们进行更精细的控制，正如我们预期的那样：\n\n```javascript\nwindow.open( page_url, name,\
  \ parameters );\n```\n\n- 从上面的原型可以看出，该方法只能接受三个参数。然而，`parameters` 参数实际上比我们想象的要复杂：\n\
  \n`\"param1,param2,param3,param4...\"`\n\n因为我们可以用它为该方法添加许多参数。注意参数列表中没有空格。\n\n`name`\
  \ 用于给窗口一个 HTML 名称——因此我们可以使用该名称通过上述“target”方法将链接打开到新窗口。\n\n![](img/image01388.jpeg)\n\
  \n| ROBERT PETERSON | 89 |\n|  |  |  |\n|  |  |  |\n\n\n\n\n\n• `open` 方法的返回值是一个指向新打开窗口的对象变量。换句话说，如果我们像这样打开一个新窗口：\n\
  \n```javascript\nwin = window.open(\"page.html\", \"\", \"\");\n```\n\n我们可以使用对象变量\
  \ `win` 通过 JavaScript 来修改新窗口。\n\n• 一个实际示例 —— 假设我们想要打开一个高 300 像素、宽 400 像素的新窗口，并在其中显示\
  \ BBC 新闻页面。使用以下代码即可：\n\n```javascript\nwindow.open(“http://news.bbc.co.uk/”, “bbc”,\
  \ “width=300,height=300”);\n```\n\n• 下表给出了一些可用参数：\n\n| 参数 | 值 | 功能 |\n| | | |\n\
  | location | Yes/no | 决定是否显示位置栏（地址栏） |\n| menubar | Yes/no | 决定是否显示菜单栏 |\n| status\
  \ | Yes/no | 决定是否显示状态栏 |\n| width | Pixels | 指定新窗口的宽度 |\n| height | Pixels | 指定新窗口的高度\
  \ |\n| resizable | Yes/no | 允许或不允许调整窗口大小 |\n| scrollbars | Yes/no | 允许或不允许窗口滚动 |\n\
  \n• 如果没有设置任何参数，则每个参数的值在适当的情况下将被设置为“yes”。例如：\n\n```javascript\nwindow.open(“http://www.bbc.co.uk/”,\
  \ “bbc”, “”);\n```\n\n等同于：\n\n```html\n<a href=”http://www.bbc.co.uk/” target=”bbc”>\n\
  ```\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 90 |\n| | | |\n| | | |\n\n\
  • 然而，如果设置了任何参数，所有其他参数将默认为“no”。所以如果你只想保留滚动条而其他内容，使用以下代码即可：\n\n```javascript\nwindow.open(“http://www.bbc.co.uk/”,\
  \ “bbc”, “scrollbars=yes”);\n```\n\n### Project\n\n• 打开你之前的项目文件，并将其保存为 `chapter_25.html`。\n\
