  \n## 31 JavaScript 与表单\n\n### 关键点\n\n• 没有 JavaScript，服务器将处理所有通过表单提交信息的验证和处理。在方程的客户端使用\
  \ JavaScript 可以为用户节省时间，并创建一个更高效的流程。\n\n• 某些处理可以由 JavaScript 处理（例如数学计算），并且 JavaScript\
  \ 可以确保只将正确的数据发送到服务器进行处理。\n\n\n\n\n\n- `JavaScript` 与服务器端处理结合使用——它不是后者的替代。\n- 为了以表单的形式访问信息，我们使用文档对象的\
  \ `getElementById()` 方法，就像我们之前访问页面上的其他对象所做。例如，如果页面上有一个所示的表单：\n\n```html\n<form id=”testForm”\
  \ … >\n</form>\n```\n\n我们会在 JavaScript 中使用以下代码访问它：\n\n```javascript\ndocument.getElementById(testForm’);\n\
  ```\n\n#### 得到的对象实际上是一个多维数组。它的每个元素本身都是数组，包含有关表单元素（文本框、按钮等）的信息。通过在相应的 `<INPUT>` 标签中为表单的每个元素正确命名，你可以访问与表单的每个元素相关的信息。\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 102 |\n|  |  |  |\n|  |  |  |\n\
  \n- 要访问存储在 id 为 `Enquiry` 的表单中名为 `Name` 的文本框中的数据，你可以如下使用 `value` 属性：\n\n```javascript\n\
  objForm = document.getElementById(‘Enquiry’);\nstrValue = objForm.Name.value\n```\n\
  \n- 有两种将表单数据发送到服务器的方法。使用 `method` 属性，你可以指定 `GET` 或 `POST` 方法：\n\n```html\n<form\
  \ id =”enquiryform” method=”GET”…\n```\n```html\n<form id =”enquiryform” method=”POST”…\n\
  ```\n\n- 一般而言，如果你想从表单发送大量数据（例如文件、大量文本），你应该应该使用 `POST` 方法。如果你想处理搜索表单等，应该使用 `GET`\
  \ 方法，因为 `GET` 表单将像 URL 一样传输，因此可以保存为书签或链接。\n- 通常情况下，你会将表单发送到服务器端脚本，由表单的 `action`\
  \ 属性指定：\n\n```html\n<form id=”enquiryform” method=”GET”\naction=”process.php”…\n\
  ```\n\n- 当用户点击表单的提交（Submit）按钮时，如果没有 JavaScript 的干预，表单数据将直接发送到服务器进行处理。但通过在 `<form>`\
  \ 标签中包含 `onsubmit` 事件处理程序，你可以在数据发送之前拦截数据（以便用 JavaScript 处理它）。这允许你在发送数据之前运行一个 JavaScript\
  \ 函数：\n\n```html\n<form id=”enquiryform” method=”GET”\naction=”process.php”\nonsubmit=”functionName()”>\n\
  ```\n\n- 在上面的示例中，当用户点击提交按钮时，首先运行函数 `functionName()`，然后将数据发送到服务器。\n\n![](img/image01388.jpeg)\n\
  \n| ROBERT PETERSON | 103 |\n|  |  |  |\n|  |  |  |\n\n- 当表单的提交触发 `submit` 事件时，浏览器会等待事件处理程序返回的结果。默认情况下，事件处理程序将返回\
  \ `true`。\n然而，如果事件处理程序返回 `false` 值，表单的提交将中止，页面将不会提交到服务器。\n- 通过从你的函数（上述示例中的 `functionName()`）返回\
  \ `true` 或 `false` 值，并确保该值也是 `onsubmit` 事件处理程序的返回值，你可以决定表单数据是否实际被发送到服务器。\n- 你可以通过以下方式指定函数的返回值也是\
  \ `onsubmit` 事件处理程序的返回值：\n\n```javascript\nonsubmit=”return functionName();”\n```\n\
