  \ Web . . . . . . . . . . . . . . . . . | 21 |\n\n### 3.1 JavaScript 是如何创建的\n\n\
  JavaScript 是于 1995 年 5 月由 Brendan Eich 在 10 天内创建的。Eich 就职于 Netscape，为他们的网页浏览器 Netscape\
  \ Navigator 实现了 JavaScript。\n\n\n\n\n\n- **ECMAScript 6 (2015 年 6 月)**：一次大型更新，实现了\
  \ `ECMAScript 4` 的许多承诺。该版本是第一个其正式名称——`ECMAScript 2015`——基于发布年份命名的版本。\n- **ECMAScript\
  \ 2016 (2016 年 6 月)**：首次年度发布。与大型的 `ES6` 相比，较短的发布周期导致新特性数量较少。\n- **ECMAScript 2017\
  \ (2017 年 6 月)**：第二次年度发布。\n- **随后的 ECMAScript 版本（ES2018 等）** 始终在 6 月通过批准。\n\n###\
  \ 3.4 Ecma 技术委员会 39 (TC39)\n\n`TC39` 是演进 JavaScript 的委员会。严格来说，其成员是公司：Adobe、Apple、Facebook、Google、Microsoft、Mozilla、Opera、Twitter\
  \ 等等。也就是说，这些通常是激烈竞争的公司正在为了语言的利益而共同努力。\n\n每两个月，`TC39` 都会举行会议，成员指派的代表和受邀专家都会参加。会议记录是公开的，存储在\
  \ [GitHub 仓库](https://github.com/tc39/tc39-notes/) 中。\n\n### 3.5 TC39 流程\n\n随着 `ECMAScript\
  \ 6` 的出现，当时使用的发布流程两个问题变得明显：\n\n- 如果发布之间的间隔时间过长，那么早期完成的特性必须等待很长时间才能发布。而晚期完成的特性则面临为了赶上截止日期而仓促发布的风险。\n\
  - 特性通常在实现和使用很久以前设计好了。因此，与实现和使用相关的设计缺陷发现得太晚。\n\n针对这些问题，`TC39` 建立了新的 `TC39` 流程：\n\n\
  - `ECMAScript` 特性独立设计并经过多个阶段，从阶段 0（“草案”）开始，到阶段 4（“完成”）结束。\n- 特别后期需要原型实现和真实世界的测试，导致设计与实现之间的反馈循环。\n\
  - `ECMAScript` 版本每年发布一次，包含所有在发布截止日期之前达到阶段 4 的特性。\n\n结果是：更小、增量式的发布，其特性已经过实地测试。\n\n\
  图 3.1 展示了 `TC39` 流程。\n\n`ES2016` 是第一个根据 `TC39` 流程设计的 `ECMAScript` 版本。\n\n#### 3.5.1\
  \ 提示：按单个特性和阶段思考，而不是 ECMAScript 版本\n\n在包括 `ES6` 在之前，最常见的做法是根据 `ECMAScript` 版本来考虑\
  \ JavaScript。例如：“这个浏览器现在支持 `ES6` 吗？”\n\n从 `ES2016` 开始，最好按单个特性来思考：一旦特性达到阶段 4，你就可以安全地使用它（如果你的目标\
  \ JavaScript 引擎支持它的话）。你不需要等到下一个 `ECMAScript` 发布。\n\n### 203 JavaScript 的历史与演变\n\n\
  | | TC39 会议评审 | |\n| :--- | :--- | :--- |\n| | 阶段 0: 草案 (strawman) | |\n| | 选出支持者\
  \ (champions) | |\n| | | TC39 提供帮助 |\n| | 阶段 1: 提议 (proposal) | |\n| 首次规范文本，2 实现\
  \ (implementations) | |\n| | | 可能被标准化 |\n| | 阶段 2: 草稿 (draft) | |\n| | 规范 (Spec)\
  \ | 完成 |\n| | | 已完成，需要来自实现的反馈 |\n| | 阶段 3: 候选 (candidate) | |\n| | Test 262 验收测试\
  \ | |\n| | | 准备好标准化 |\n| | 阶段 4: 完成 (finished) | |\n\n![](img/image01394.jpeg)\n\
  \n图 3.1：每个 `ECMAScript` 特性提议都会经过从 0 到 4 编号的阶段。支持者是支持该特性作者的 `TC39` 成员。`Test 262`\
  \ 是一套测试，用于检查 JavaScript 引擎是否符合语言规范。\n\n### 3.6 FAQ：TC39 流程\n\n#### 3.6.1 [我最喜欢的提议特性]进展如何？\n\
  \n如果你想知道各种提议特性处于什么阶段，请查阅 [GitHub](https://github.com/tc39/proposals) [仓库提议](https://github.com/tc39/proposals)。\n\
  \n#### 有 ECMAScript 特性的正式列表吗？\n\n是的，`TC39` 仓库列出了[已完成提议](https://github.com/tc39/proposals/blob/master/finished-proposals.md)，并提到了它们是在哪些\
  \ `ECMAScript` 版本中引入的。\n\n### 3.7 演进 JavaScript：不要破坏 Web\n\n偶尔会出现一个想法是通过移除旧特性和怪癖来清理\
  \ JavaScript。虽然这个想法的吸引力显而易见，但它有巨大的缺点。\n\n假设我们创建了一个不后兼容且修复了所有缺陷的 JavaScript 新版本。结果，我们将遇到以下问题：\n\
  \n- JavaScript 引擎变得臃肿：它们需要同时支持旧版本和新版本。相同的情况也是如此。（等等，原文此处似乎乱码/重复，我将保持提供的核心逻辑）。\n\n\
  - `ECMAScript` 版本每年发布一次，包含所有在发布截止日期之前达到阶段 4 的特性。\n- 结果是：更小、增量式的发布，其特性已经过实地测试。\n\n\
  \n\n\n\n- [Can I use…](https://caniuse.com/) 记录了网络浏览器支持哪些特性（包括 JavaScript 语言特性）。\n\
