  \n![](img/image01388.jpeg)\n\n## 12 比较\n\n## 关键点\n\n比较运算符对两个值进行比较。最常见的用法是比较两个变量的内容——例如，我们可能想检查\
  \ `var_1` 的值在数值上是否大于 `var_2`。\n\n当你使用比较运算符时，比较返回的值始终是 `true` 或 `false` 的布尔值。例如，考虑以下语句：\n\
  \n```javascript\nvar_1 = 4;\nvar_2 = 10;\nvar_3 = var_1 > var_2;\n```\n\n在这种情况下，`var_3`\
  \ 的值为 `false`。注意布尔值 `false` 与文本字符串“false”并不相同：\n\n```javascript\nvar_4 = false;\
  \ // 布尔值\nvar_5 = \"false\"; // 文本字符串\n```\n\n常见的比较运算符所示：\n\n| Comparison | Function\
  \ |\n| :--- | :--- |\n| `X == y` | 如果 x 和 y 等返回 true，否则返回 false |\n| `X != y` |\
  \ 如果 x 和 y 不等返回 true，否则返回 false |\n| `X > y` | 如果 x 在数值上大于 y，返回 true，否则返回 false\
  \ |\n| `X >= y` | 如果 x 在数值上大于或等于 y，返回 true，否则返回 false |\n| `X <= y` | 如果 y 在数值上大于或等于\
  \ x，返回 true，否则返回 false |\n\n为了反转比较返回的值，我们通常会在比较运算符前加上一个 `!`（“感叹号”）。注意，在很多情况下这并不是必要的，但有助于理解：\n\
  \n```javascript\nvar_1 !> var_2;\nvar_1 <= var_2;\n```\n\n这两者是等价的，但在特定的语境下，其中一个可能比另一个更符合语义逻辑。\n\
  \n# 项目\n\n打开你之前的项目文件，并将其保存为 `chapter_12.html`。\n\n确保你的两个变量都包含数值值而不是字符串。\n\n使用警告框针对上述列出的每个比较运算符，显示你两个变量之间比较的结果。\n\
  \n将其中一个数值替换为文本字符串并重复此过程。注意其中的差异。\n\n![](img/image01388.jpeg)\n\n## 13 条件语句\n\n##\
  \ 关键点\n\n直到现在，我们的 JavaScript 项目无法自发地改变其行为。当嵌入了我们 JavaScript 的页面加载时，它除了反复执行我们期待的内容之外无法执行任何事情。\n\
  \n我们看到的唯一区别是使用提示框（prompt box）来更改页面上显示的内容。然而，无论输入什么文本，页面本质上仍然对提供的文本执行相同的操作。\n\n真正方便的方法是给\
  \ JavaScript 一种做出决策的机制。例如，如果我们提供一个提示框询问访问者的名字，如果能有一个“已知姓名列表”，并对与网站其他访问者进行不同的问候，那就很好。\n\
  \n条件语句赋予了我们这种能力，是操作 JavaScript 的关键。\n\n条件语句由三部分组成：\n1. 测试（通常带有比较运算符或比较器），以检查给定条件是否为真或假。\n\
  2. 仅当条件为真时才执行的代码块。\n3. 一个可选的代码块，仅当条件为假时才执行。\n\n![](img/image01388.jpeg)\n\n这三个部分在\
  \ JavaScript 中表示为：\n\n```javascript\nif (condition) {\n    // 如果条件为真则执行的代码\n} else\
  \ {\n    // 如果条件为假则执行可选代码\n}\n```\n\n闭括号（大括号）是可选的，因此以下也是有效的：\n\n```javascript\n\
  if (condition)\n    // 语句\n```\n\n如果 `condition` 不返回真，则什么都不会发生。一个完整的条件语句示例如下：\n\n\
  ```javascript\nif (var_1 > var_2) {\n    alert(\"Variable 1 is greater\");\n} else\
  \ {\n    alert(\"Variable 2 is greater\");\n}\n```\n\n注意，上面的条件并不总是正确。考虑 `var_1`\
  \ 等于 `var_2` 的情况。在这种情况下，上面的代码将产生消息“Variable 2 is greater”，因为 `var_1 > var_2` 返回假。在这种情况下，我们希望在\
  \ `else` 分支中添加一个额外的条件：\n\n```javascript\nif (var_1 > var_2) {\n    alert(\"Variable\
  \ 1 is greater\");\n} else if (var_1 < var_2) {\n    alert(\"Variable 2 is greater\"\
  );\n}\n```\n\n在这种情况下，相等将产生产生输出。为了完整性，我们可以在语句中添加一个最后的 `else` 分支：\n\n```javascript\n\
  if (var_1 > var_2) {\n    alert(\"Variable 1 is greater\");\n} else if (var_1 <\
  \ var_2) {\n    alert(\"Variable 2 is greater\");\n} else {\n    alert(\"The variables\
  \ are equal\");\n}\n```\n\n注意，在这种情况下，我们不需要在最后一个分支中检查相等性，因为如果 `var_1` 既大于也不小于 `var_2`，那么至少从数值上来说，它们必须相等的。我们可以根据需要向此栈中继续添加尽可能多的\
  \ `else if` 语句。\n\n如果条件测试后有一个语句，可以省略大括号：\n\n```javascript\nif (var_1 > var_2)\n\
  alert(\"Variable 2 is greater\");\n```\n\n然而，如果你以后想在这个条件分支中添加更多语句，你必须在该块周围添加大括号，这可能会导致混淆。建议使用大括号包裹所有的条件代码块。\n\
  \n考虑以下代码块：\n\n```javascript\nif (var_1 > 4) {\n    var_2 = var_1;\n} else {\n  \
  \  var_2 = 4;\n}\n```\n\n\n\n\n\n- 这段代码相当长，但实现的功能相对简单——`var_2` 等于 `var_1` 或 `4`，两者中较大者。\n\
  - 这种写法更紧凑的写法可以是：\n\n```javascript\nvar_2 = 4;\nif ( var_1 > var_2 )\n{\n  var_2\
  \ = var_1;\n}\n```\n\n- 然而，更紧凑的写法可能是使用三元运算符：\n\n```javascript\nvar_2 = (var_1 >\
  \ 4) ? var_1 : 4;\n```\n\n- 在上述语句中，条件会被求值，如果为真，则返回 `?` 和 `:` 符号之间的值；如果为假，则返回 `:`\
  \ 和 `;` 符号之间的值。\n\n# 项目\n\n- 打开你之前的项目文件，并将其保存为 `chapter_13.html`。\n- 清除脚本标签 `<script>`\
