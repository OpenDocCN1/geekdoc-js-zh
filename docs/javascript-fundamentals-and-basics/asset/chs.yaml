  \ `Infinity` . . . . . . . . . . . . . . . . . . . . . | 117 |\n\n## 15.1 JavaScript\
  \ 只有浮点数\n\n你可以在 JavaScript 中同时表示整数和浮点数：\n\n98\n\n123.45\n\n然而，数字只有一种类型：它们都是双精度 64\
  \ 位浮点数，根据 IEEE 浮点算术标准 (IEEE 754) 实现。\n\n整数仅仅是不带小数部分的浮点数：\n\n> `98 === 98.0`\ntrue\n\
  \n注意，在底层，大多数 JavaScript 引擎通常能够使用真正的整数，从而获得性能和存储优势。\n\n## 15.2 数字字面量\n\n让我们检查数字字面量。\n\
  \n### 15.2.1 整数字面量\n\n几种整数字面量允许用不同的进制表示整数：\n\n- 二进制 (base 2)：`0b11` (3)\n- 八进制 (base\
  \ 8)：`0o10` (8)\n- 十进制 (base 10)：`35` (35)\n- 六进制 (base 16)：`0xE7` (231)\n\n###\
  \ 15.2.2 浮点字面量\n\n浮点数只能以进制表示。\n\n分数：\n\n> `35.0`\n35\n\n指数：`eN` 意味着 $10^N$\n\n>\
  \ `3e2`\n300\n\n> `3e-2`\n0.03\n\n> `0.3e2`\n30\n\n### 15.2.3 语法陷阱：整数字面量的属性\n\n\
  访问整数字面量的属性涉及一个陷阱：如果整数字面量后面紧跟着一个点，那么该点会被解释为小数点：\n\n```javascript\n7.toString(); //\
  \ 语法错误\n```\n\n有四种方法可以避免这个陷阱：\n\n- `7.0.toString()`\n- `(7).toString()`\n- `7..toString()`\n\
  - `7 .toString()` // 点前有空格\n\n## 15.3 算术运算符\n\n### 15.3.1 二元算术运算符\n\n表 15.1 列出了\
  \ JavaScript 的二元算术运算符。\n\n表 15.1：二元算术运算符。\n\n![](img/image01445.jpeg)\n\n| 运算符 |\
  \ 名称 | 范围 | 示例 |\n| :--- | :--- | :--- | :--- |\n| `n + m` | 加法 | ES1 | 3 + 4 →\
  \ 7 |\n\n\n\n\n\n| n - m | 减法 | ES1 | 9 | - 1 → 8 |\n| n * m | 乘法 | ES1 | 3 | *\
  \ 2.25 → 6.75 |\n| n / m | 除法 | ES1 | 5.625 | | / 5 → 1.125 |\n| n % m | 余数 | ES1\
  \ | 8 | % 5 | → 3 |\n| | 幂 | ES2016 | -8 % 5 | → -3 |\n| n ** m | 4 | ** 2 | → 16\
  \ |\n\n注意 `%` 是取余运算符（而不是模运算）——它的结果与第一个操作数的符号相同：\n\n```\n> 3 % 2\n1\n\n> --3 % 2\n\
  -1\n```\n\n### 15.3.2 一元加 (+) 和 取反 (-)\n\n表 15.2 总结了一元加(`+`) 和一元取反(`-`) 两个运算符。\n\
  \n表 15.2：一元加 (`+`) 和一元取反 (`-`) 运算符。\n\n![](img/image0144.jpeg)\n\n| 运算符 | 名称 | |\
  \ 示例 |\n| :--- | :--- | :--- | :--- |\n| +n | 一元加 | ES1 | `+(-7)` → -7 |\n| -n |\
  \ 一元取反 | ES1 | `-(-7)` → 7 |\n\n这两个运算符都会将操作数强制转换为数字：\n\n```\n> +'5'\n5\n\n> +'-12'\n\
  12\n\n> -'9'\n-9\n```\n\n因此，一元加允许我们将任意值转换为数字。\n\n### 15.3.3 递增 (++) 和 递减 (--)\n\n\
  递增运算符 `++` 存在前缀和后缀版本。在两个版本中，它都会以破坏性的方式对其操作数加 1。因此，它的操作数必须是一个可以更改的存储位置。递减运算符 `--`\
  \ 工作原理相同，但是从其操作数减 1。接下来的两个示例解释了前缀和后缀版本之间的区别。\n\n表 15.3 总结了递增和递减运算符。\n\n![](img/image0147.jpeg)\n\
  \n| 运算符 | 名称 | | 示例 |\n| :--- | :--- | :--- | :--- |\n| v++ | 递增 | ES1 | `let v=0;\
  \ [v++, v]` → [0, 1] |\n| ++v | 递增 | ES1 | `let v=0; [++v, v]` → [1, 1] |\n| v--\
  \ | 递减 | ES1 | `let v=1; [v--, v]` → [1, 0] |\n| --v | 递减 | ES1 | `let v=1; [--v,\
  \ v]` → [0, 0] |\n\n接下来，我们将看看这些运算符使用的示例。前缀 `++` 和后缀 `--` 先返回操作数然后改变它们。\n\n```\n\
  let foo = 3;\nassert.equal(++foo, 4);\nassert.equal(foo++, 4);\n\nlet bar = 3;\n\
  assert.equal(bar--, 3);\nassert.equal(bar--, 2);\n```\n\n#### 操作数：不是变量\n\n你也可以将这些运算符应用于属性值：\n\
  \n```\nconst obj = {a: 1};\n++obj.a;\nassert.equal(obj.a, 2);\n```\n\n#### 到数组元素：\n\
  \n```\nconst arr = [4];\narr[0]++;\nassert.deepEqual(arr, [5]);\n```\n\n#### 练习：数字运算符\n\
  \n这里有三种方法将值转换为数字：\n- `Number(value)`\n- `+value`\n- `parseFloat(value)` (避免使用；与另外两种不同！）\n\
  \n建议：使用具有描述性的 `Number()`。表 15.4 总结了它的工作原理。\n\n![](img/image0148.jpeg)\n\n### 15.4\
  \ 转换为数字\n\n表 15.4：将值转换为数字。\n\n![](img/image0149.jpeg)\n\n`Number(x)`\n\n![](img/image0450.jpeg)\n\
  \n#### 类型 | 结果 |\n| :--- | :--- |\n| undefined | NaN |\n| null | 0 |\n| boolean\
  \ | false → 0, true → 1 |\n| number | x (无变化) |\n| string | '' → 0, 其他 → 解析后的数字，忽略前后的空白空格\
  \ |\n| object | 可配置（例如，通过 `.valueOf()`） |\n\n示例：\n\n```\nassert.equal(Number(123.45),\
  \ 123.45);\nassert.equal(Number(''), 0);\nassert.equal(Number('\\n123.45\\t'), 123.45);\n\
  assert.equal(Number('xyz'), NaN);\n```\n\n对象如何转换为数字是可以配置的。例如，通过覆盖 `.valueOf()`：\n\
  \n```\nNumber({ valueOf() { return 123 } })\n123\n```\n\n![](img/image0418.jpeg)![](img/image0451.jpeg)\n\
  ![](img/image0416.jpeg) 练习：转换为数字\n`exercises/numbers-math/parse_number_test.mjs`\n\
  \n### 15.5 错误值\n\n当发生错误时，会返回两个数字值：\n- NaN\n- Infinity\n\n### 15.6 错误值：NaN\n\n`NaN`\
  \ 是“not a number”的缩写。讽刺的是，JavaScript 认为它是一个数字：\n\n```\n> typeof NaN\n'number'\n\
  ```\n\n什么时候会返回 `NaN`？\n\n如果数字无法解析，则返回 `NaN`：\n\n```\n> Number('$$')\nNaN\n\n> Number(undefined)\n\
  NaN\n```\n\n如果无法执行操作，则返回 `NaN`：\n\n```\n> Math.log(-1)\nNaN\n\n> Math.sqrt(-1)\n\
  NaN\n```\n\n如果操作数或参数是 `NaN`（为了传播错误），则返回 `NaN`：\n\n```\n> NaN - 3\nNaN\n\n> 7 **\
  \ NaN\nNaN\n```\n\n#### 15.6.1 检查 NaN\n\n`NaN` 是唯一一个不严格等于自身的 JavaScript 值：\n\n```javascript\n\
  const n = NaN;\nassert.equal(n === n, false);\n```\n\n以下是检查值 `x` 是否为 `NaN` 的几种方法：\n\
  \n```javascript\nconst x = NaN;\nassert.equal(Number.isNaN(x), true); // 优先\n```\n\
  \n#### 15.6.2 在数组中查找 NaN\n\n某些数组方法找不到 `NaN`：\n\n```\n> [NaN].indexOf(NaN)\n-1\n\
  ```\n\n其他的可以：\n\n```\n> [NaN].includes(NaN)\ntrue\n\n> [NaN].findIndex(NaN)\n0\n\
  ```\n\n### 15.7 错误值：Infinity\n\n如果数字太大，则返回 `Infinity`：\n\n```\n> Math.pow(2, 1023)\n\
  Infinity\n\n> Math.pow(2, 1024)\nInfinity\n```\n\n如果除以零，则返回 `Infinity`：\n\n```\n\
  > 5 / 0\nInfinity\n\n> -5 / 0\n-Infinity\n```\n\n#### 15.7.1 Infinity 作为默认值\n\n\
  `Infinity` 比所有数字都大（`NaN` 除）：\n\n```javascript\nfunction findMinimum(numbers) {\n\
  \  let min = Infinity;\n  for (const n of numbers) {\n    if (n < min) min = n;\n\
  \  }\n  return min;\n}\nassert.equal(findMinimum([5, -1]), -1);\n```\n\n#### 15.7.2\
  \ 检查 Infinity\n\n以下是检查值是否为 `Infinity` 的两种常用方法：\n\n```javascript\nlet x = Infinity;\n\
  assert.equal(x === Infinity, true);\nassert.equal(Number.isFinite(x), false);\n\
  ```\n\n\n\n\n这种表示无法编码零，因为它的第二个部分（涉及分数的部分）始终有一个前导 1。因此，零是通过特殊指数 `-1023` 和分数 `0` 来编码的。\n\
  \n# 15.10 浮点数的简化表示\n\n为了方便后续讨论，我们简化了之前的表示方法：\n\n- 我们不再使用 2 进制（二进制），而是使用 10 进制（十进制），这是大多数人更熟悉的。\n\
  - 分数是一个被解释为分数的自然数（小数点后的数字）。我们切换到尾数（mantissa），即一个被解释为自身的整数。作为结果，指数的使用方式发生了变化，但它的基本作用没有改变。\n\
  - 由于尾数是一个整数（带有自己的符号），我们不再需要单独的符号位了。\n\n新的表示方法如下：\n\n`mantissa × 10^exponent`\n\n\
  让我们尝试用这种表示法处理几个浮点数。\n\n- 对于整数 `-123`，我们主要需要尾数：\n```\n-123 * (10 ** 0)\n-123\n```\n\
  - 对于数字 `1.5`，我们想象尾数后面有一个点。我们使用负指数来将该点向左移动一位：\n```\n15 * (10 ** -1)\n1.5\n```\n-\
  \ 对于数字 `0.25`，我们将点向左移动两位：\n```\n25 * (10 ** -2)\n0.25\n```\n\n带有负指数的表示法也可以写成分母带有正指数的分数：\n\
  \n```\n15 * (10 ** -1) === 15 / (10 ** 1)\ntrue\n\n25 * (10 ** -2) === 25 / (10\
  \ ** 2)\ntrue\n```\n\n这些分数有助于我们理解，为什么存在一些我们的编码无法表示的数字：\n\n- `1/10`是可以表示的。它已经具备所需的格式：分母是\
  \ 10 的幂。\n- `1/2` 可以被表示为 `5/10`。我们通过将分子和分母同时乘以 `5`，将分母中的 `2` 变成了 10 的幂。\n- `1/4`\
  \ 可以被表示为 `25/100`。我们通过将分子和分母同时乘以 `25`，将分母中的 `4` 变成了 10 的幂。\n- `1/3` 是无法表示的。没有办法可以将分母变成\
  \ 10 的幂。（10 的质因数是 2 和 5。因此，任何只包含这些质因数的的分母都可以通过给分子和分母乘以足够的 2 和 5 来转换为 10 的幂。如果分母具有不同的质因数，那么我们就无能为力。）\n\
  \n结束这次之旅之前，我们回到 2 进制：\n\n- `0.5 = 1/2` 可以用 2 进制表示，因为分母已经是 2 的幂。\n- `0.25 = 1/4`\
  \ 可以用 2 进制表示，因为分母已经是 2 的幂。\n- `0.1 = 1/10` 无法表示，因为分母无法转换为 2 的幂。\n- `0.2 = 2/10`\
  \ 无法表示，因为分母无法转换为 2 的幂。\n\n现在我们知道为什么 `0.1 + 0.2` 没有产生正确的结果了：在内部，这两个操作数都无法精确表示。\n\n\
  使用十小数进行精确计算的唯一方法是在内部切换到 10 进制。对于许多编程语言，2 进制是默认的，10 进制是一个选项。例如，Java 拥有 `BigDecimal`\
  \ 类，而 Python 拥有 `decimal` 模块。目前计划为 JavaScript 添加类似的内容：ECMAScript 提案“Decimal”目前处于\
  \ 0 阶段。\n\n# 15.11 JavaScript 中的整数\n\nJavaScript 没有用于整数的特殊类型。相反，它们仅仅是不带小数部分的普通（浮点）数字：\n\
  \n```\n1 === 1.0\ntrue\n\nNumber.isInteger(1.0)\ntrue\n```\n\n在本节中，我们将查看一些处理这些伪整数的工具。\n\
  \n## 15.11.1 整数\n\n将数字转换为整数推荐的方法是使用 `Math` 舍入方法之一：\n\n- `Math.floor(n)`：返回最大的整数\
  \ `i ≤ n`\n```\nMath.floor(2.1)\n2\n\nMath.floor(2.9)\n2\n```\n- `Math.ceil(n)`：返回最小的整数\
  \ `i ≥ n`\n```\nMath.ceil(2.1)\n3\n\nMath.ceil(2.9)\n3\n```\n- `Math.round(n)`：返回离\
  \ n “最近”的整数。0.5 会四舍五入。例如：\n```\nMath.round(2.4)\n2\n\nMath.round(2.5)\n3\n```\n\
  - `Math.trunc(n)`：移除 `n` 拥有的任何小数部分（小数点后的），从而将其转换为整数。\n```\nMath.trunc(2.1)\n2\n\n\
  Math.trunc(2.9)\n2\n```\n\n关于舍入的更多信息，请参阅 §16.3 “舍入”。\n\n## 15.11.2 JavaScript 中的整数范围\n\
  \n这些是 JavaScript 中重要的整数范围：\n\n- **安全整数 (Safe integers)**：可以被 JavaScript “安全地”表示（在下一节中详细介绍其含义）\n\
  \  - 精度：53 位加上符号位\n  - 范围：`(-2⁵³, 2⁵³)`\n- **数组索引 (Array indices)**\n  - 精度：32 位，无符号\n\
  \  - 范围：`[0, 2³²−1)`（排除最大长度）\n  - 类型数组（Typed Arrays）拥有更大的范围，即 53 位（安全且无符号）\n- **位运算符\
  \ (Bitwise operators)**（位或等）\n  - 精度：32 位\n  - 无符号右移运算符 (`>>>`) 的范围：无符号，`[0, 2³²)`\n\
  \  - 所有其他位运算符的范围：有符号的，`[-2³¹, 2³¹)`\n\n## 15.11.3 安全整数\n\n这是 JavaScript 中安全的整数范围（53\
  \ 位加上符号位）：\n\n`[-2⁵³−1, 2⁵³−1]`\n\n如果一个整数恰好由一个 JavaScript 数字表示，那么它就是安全的。考虑到 JavaScript\
  \ 数字被编码为一个分数乘以 2 的指数幂，更高的整数也可以被表示，但它们之间会有间隙。\n\n例如（`18014398509481984` 是 `2⁵⁴`）：\n\
  \n```\n18014398509481984\n18014398509481984\n\n18014398509481985\n18014398509481984\n\
  \n18014398509481986\n18014398509481984\n```\n\n`Number` 的以下属性有助于判断一个整数是否安全：\n\n\
  ```\nNumber.MAX_SAFE_INTEGER, 2⁵³ - 1\n\nNumber.MIN_SAFE_INTEGER, -2⁵³\n\nNumber.isInteger(5),\
  \ true\n\nNumber.isInteger('5'), false\n\nNumber.isInteger(5.1), false\n\nNumber.isInteger(Number.MAX_SAFE_INTEGER),\
  \ true\n\nNumber.isInteger(Number.MAX_SAFE_INTEGER + 1), false\n```\n\n## 15.11.3.1\
  \ 安全计算\n\n让我们看看涉及安全整数的计算。\n\n以下结果是错误的且不安全的，尽管它的两个操作数都是安全的：\n```\n9007199254740990\
  \ + 3\n9007199254740992\n```\n以下结果是安全的但是错误的。第一个操作数是不安全的，第二个是安全的：\n```\n9007199254740995\
  \ - 10\n9007199254740986\n```\n\n因此，表达式 `a op b` 的结果是正确的当仅当：\n\n`isSafeInteger(a)\
  \ && isSafeInteger(b) && isSafeInteger(a op b)`\n\n也就是说，两个操作数和结果必须是安全的。\n\n# 15.12\
  \ 位运算符\n\n## 15.12.1 位运算符内部使用 32 位整数\n\nJavaScript 的位运算符在内部使用 32 位整数。它们按照以下步骤产生结果：\n\
  \n1. **输入 (JavaScript 数字)**：1~2 个操作数首先转换为 JavaScript 数字（64 位浮点数），然后转换为 32 位整数。\n\
  2. **计算 (32 位整数)**：实际操作处理 32 位整数并产生一个 32 位整数。\n3. **输出 (JavaScript 数字)**：在返回结果之前，它被回\
  \ JavaScript 数字。\n\n### 15.12.1.1 操作数和结果的类型\n\n对于每个位运算符，本书都会提到它的操作数和结果的类型。每个类型总是以下两者之一：\n\
  \n| 类型 | 描述 | 大小 | 范围 |\n| :--- | :--- | :--- | :--- |\n| Int32 | 有符号 32 位整数 | 32\
  \ 位（包含符号位） | `[-2³¹, 2³¹)` |\n\n\n\n\n\n| Uint32 | 无符号 32 位整数 | 32 位 | 0, 232) |\n\
  \n考虑到前面提到的步骤，我建议假装位运算符在内部与无符号 32 位整数一起操作（“计算”步骤）。而 `Int32` 和 `Uint32` 仅影响 JavaScript\
  \ 数字与整数之间的相互转换（“输入”和“输出”步骤）。\n\n### 15.12.1.2 将 JavaScript 数字显示为无符号 32 位整数\n\n在探索位运算符时，偶尔将\
  \ JavaScript 数字以二进制表示法显示为无符号 32 位整数会有帮助。这就是 `b32()` 的作用（其实现后文所示）：\n\n```javascript\n\
  assert.equal(\n  b32(-1),\n  '11111111111111111111111111111111');\nassert.equal(\n\
  \  b32(1),\n  '00000000000000000000000000000001');\nassert.equal(\n  b32(2 ** 31),\n\
  \  '10000000000000000000000000000000');\n```\n\n### 15.12.2 二进制位运算符\n\n表 15.7：二进制位运算符。\n\
  \n![| 操作 | 名称 | 类型签名 | || :--- | :--- | :--- | :--- || `num1 & num2` | 位与 | `Int32\
  \ × Int32 → Int32` | ES1 || `num1 \\| num2` | 位或 | `Int32 × Int32 → Int32` | ES1\
  \ || `num1 ^ num2` | 位异或 | `Int32 × Int32 → Int32` | ES1 |15.12 位运算符 | 123 二进制位运算符（表\
  \ 15.7）通过组合其操作数的位来产生结果：> `(0b1010 & 0b0011).toString(2).padStart(4, '0')`> '0010'>\
  \ `(0b1010 | 0b0011).toString(2).padStart(4, '0')`> '1011'> `(0b1010 ^ 0b0011).toString(2).padStart(4,\
  \ '0')`> '1001'### 15.12.3 位取反表 15.8：位取反运算符。![](img/image01455.jpeg)\n\n| 操作 | 名称\
  \ | 类型签名 | |\n| :--- | :--- | :--- | :--- |\n| `~num` | 位取反，按码 | `Int32 → Int32`\
  \ | ES1 |\n\n位取反运算符（表 15.8）会反转其操作数的每个二进制位：\n\n> `b32(~0b100)`\n> '11111111111111111111111111111011'\n\
  \n### 15.12.4 位移位运算符\n\n表 15.9：移位运算符。\n\n![](img/image01456.jpeg)\n\n| 操作 | 名称 |\
  \ 类型签名 | |\n| :--- | :--- | :--- | :--- |\n| `num << count` | 左移 | `Int32 × Uint32\
  \ → Int32` | ES1 |\n| `num >> count` | 有符号右移 | `Int32 × Uint32 → Int32` | ES1 |\n\
  | `num >>> count` | 无符号右移 | `Uint32 × Uint32 → Uint32` | ES1 |\n\n移位运算符（表 15.9）将二进制位向左或向右移动：\n\
  \n> `(0b10 << 1).toString(2)`\n> '100'\n\n`>>` 保留最高位，而 `>>>` 不保留：\n\n> `b32(0b10000000000000000000000000000010\
  \ >> 1)`\n> '11000000000000000000000000000001'\n\n> `b32(0b10000000000000000000000000000010\
  \ >>> 1)`\n> '01000000000000000000000000000001'\n\n### 15.12.5 b32():以二进制表示法显示无符号\
  \ 32 位整数\n\n我们现在已经使用了几次 `b32()`。以下是它的实现代码。\n\n```javascript\n/**\n * 返回一个表示 n 为\
  \ 32 位无符号整数的字符串，\n * 使用二进制表示。\n */\nfunction b32(n) {\n  // >>> 确保最高位不会被解释为符号位\n\
  \  return (n >>> 0).toString(2).padStart(32, '0');\n}\n\nassert.equal(\n  b32(6),\n\
  \  '00000000000000000000000000000110');\n```\n\n`>>> 0` 意味着我们将 `n` 向右移动零位。因此，在原理上\
  \ `>>>` 运算符什么都没做，但它仍然会将 `n` 强制转换为无符号 32 位整数：\n\n> `12 >>> 0`\n> 12\n\n> `-12 >>>\
  \ 0`\n> 4294967284\n\n> `(2**32 + 1) >>> 0`\n> 1\n\n### 15.13 快速参考：数字\n\n### 15.13.1\
  \ 数字的全局函数\n\nJavaScript 有以下四个数字的全局函数：\n\n- `isFinite()`\n- `isNaN()`\n- `parseFloat()`\n\
  - `parseInt()`\n\n然而，使用对应的方法（如 `Number.isFinite()` 等）更好，因为它们的陷阱更少。它们是 ES6 引入的，并在下文中讨论。\n\
  \n### 15.13.2 Number 的静态属性\n\n- `.EPSILON`: 数字 [ES6]\n1 与下一个可表示浮点数之间的差异。通常情况下，[机器精度](https://en.wikipedia.org/wiki/Machine_epsilon)\
  \ 为浮点运算中的舍误差提供了上界。\n– 大约：2.2204460492503130808472633361816 × 10-16\n\n- `.MAX_SAFE_INTEGER`:\
  \ 数字 [ES6]\nJavaScript 可以无歧表示的最大整数（2⁵³−1）。\n\n- `.MAX_VALUE`: 数字 [ES1]\n最大的正有限 JavaScript\
  \ 数字。\n– 大约：1.7976931348623157 × 10³⁰⁸\n\n- `.MIN_SAFE_INTEGER`: 数字 [ES6]\nJavaScript\
  \ 可以无歧表示的最小整数（−⁵³+1）。\n\n- `.MIN_VALUE`: 数字 [ES1]\n最小的正 JavaScript 数字。约为 5 × 10⁻³²⁴。\n\
  \n- `.NaN`: 数字 [ES1]\n与全局变量 `NaN` 相同。\n\n- `.NEGATIVE_INFINITY`: 数字 [ES1]\n与 `-Number.POSITIVE_INFINITY`\
  \ 相同。\n\n- `.POSITIVE_INFINITY`: 数字 [ES1]\n与全局变量 `Infinity` 相同。\n\n### 15.13.3 Number\
  \ 的静态方法\n\n- `.isFinite(num: number): boolean [ES6]`\n如果 `num` 是实际数字（不是 Infinity、-Infinity\
  \ 或 NaN），则返回 `true`。\n> `Number.isFinite(Infinity)`\n> false\n\n> `Number.isFinite(-Infinity)`\n\
  > false\n\n> `Number.isFinite(NaN)`\n> false\n\n> `Number.isFinite(123)`\n> true\n\
  \n- `.isInteger(num: number): boolean [ES6]`\n如果 `num` 是数字且没有小数部分，则返回 `true`。\n\
  > `Number.isInteger(-17)`\n> true\n\n> `Number.isInteger(33)`\n> true\n\n> `Number.isInteger(33.1)`\n\
  > false\n\n- `.isNaN(num: number): boolean [ES6]`\n如果 `num` 是 `NaN`，则返回 `true`。\n\
  > `Number.isNaN(NaN)`\n> true\n\n> `Number.isNaN(123)`\n> false\n\n- `.isSafeInteger(num:\
  \ number): boolean [ES6]`\n如果 `num` 是安全整数，则返回 `true`。\n> `Number.isSafeInteger(33)`\n\
  > true\n\n> `Number.isSafeInteger(33.1)`\n> false\n\n### 15.13.4 Number.prototype\
  \ 方法\n\n（Number.prototype 是存储数字的地方。）\n\n- `.toExponential(fractionDigits?: number):\
  \ string [ES3]`\n返回以指数计数法表示数字的字符串。通过 `fractionDigits`，你可以指定显示指数部分的数字位数（默认是显示尽可能多的位数）。\n\
  示例：数字太小，无法通过 `.toString()` 获取正指数。\n> `1234.toString()`\n> '1234'\n\n> `1234.toExponential()`\
  \ // 3 位小数\n> '1.234e+3'\n\n> `1234.toExponential(5)`\n> '1.23400e+3'\n\n> `1234.toExponential(1)`\n\
  > '1.2e+3'\n\n示例：分数不够小，无法通过 `.toString()` 获取负指数。\n> `0.003.toString()`\n> '0.003'\n\
  \n> `0.003.toExponential()`\n> '3e-3'\n\n- `.toFixed(fractionDigits=0): string [ES3]`\n\
  返回数字的无指数表示法，四舍五入到 `fractionDigits` 位。\n> `0.00000012.toString()` // 带指数 '1.2e-7'\n\
  \n> `0.00000012.toFixed(10)` // 无指数\n> '0.0000001200'\n\n> `0.00000012.toFixed()`\n\
  > '0'\n\n如果数字为 10²¹ 或更大，即使是 `.toFixed()` 也会使用指数：\n> `(10 ** 21).toFixed()`\n\n\n\
  \n\n\n'1e+21'\n\n- `.toPrecision(precision?: number): string` [ES3]\n用法与 `.toString()`\
  \ 类似，但 `precision` 指定了显示多少位数字。如果缺少 `precision`，则使用 `.toString()`。\n\n```\n1234..toPrecision(3)\
  \ // 需要指数计数法 '1.23e+3'\n1234..toPrecision(4)\n'1234'\n1234..toPrecision(5)\n'1234.0'\n\
  1.234.toPrecision(3)\n'1.23'\n```\n\n- `.toString(radix=10): string` [ES1]\n返回数字的字符串表示。\n\
  默认情况下，你得到一个 10 进制数字：\n```\n123.456.toString()\n'123.456'\n```\n如果你想让数字具有不同的进制，可以通过\
  \ `radix` 进行指定：\n```\n4..toString(2) // 二进制（底 2）\n'100'\n4.5.toString(2)\n'100.1'\n\
  255..toString(16) // 十六进制（底 16）\n'ff'\n255.66796875.toString(16)\n'ff.ab'\n1234567890..toString(36)\n\
  'kf12oi'\n```\n`parseInt()` 提供了逆操作：它将包含给定进制的整数（无小数！）数字字符串转换为数字。\n```\nparseInt('kf12oi',\
  \ 36)\n1234567890\n```\n\n## 15.13.5 来源\n- Wikipedia\n- [TypeScript 内置类型](https://github.com/Microsoft/TypeScript/blob/master/lib/)\n\
  - [MDN JavaScript 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript)\n\
  - [ECMAScript 语言规范](https://tc39.github.io/ecma262/)\n\n![](img/image01395.jpeg)![](img/image0140.jpeg)\n\
  \n![](img/image01397.jpeg) 测验：高级\n查看测验应用。\n\n# 第 16 章：Math\n\n## 目录\n- 16.1 数据属性\n\
  - 16.2 指数、根、对数\n- 16.3 取五\n- 16.4 三角函数\n- 16.5 其他各种函数\n- 16.6 来源\n\n`Math` 是一个带有用于处理数字的数据属性和方法的对象。你可以将其看作一个简版的模块：它在\
  \ JavaScript 拥有模块很久以前就已经被创建了。\n\n## 16.1 数据属性\n- `Math.E: number` [ES1]\n欧拉数，自然对数的底，约为\
  \ 2.7182818284590452354。\n- `Math.LN10: number` [ES1]\n10 的自然对数，约为 2.302585092994046。\n\
  - `Math.LN2: number` [ES1]\n2 的自然对数，约为 0.6931471805599453。\n- `Math.LOG10E: number`\
  \ [ES1]\n`e` 的底为 10 对数，约为 0.4342944819032518。\n- `Math.LOG2E: number` [ES1]\n`e`\
  \ 的底为 2 对数，约为 1.4426950408889634。\n- `Math.PI: number` [ES1]\n数学常数 `π`，圆周长与直径的比，约为\
  \ 3.1415926535897932。\n- `Math.SQRT1_2: number` [ES1]\n1/2 的平方根，约为 0.7071067811865476。\n\
  - `Math.SQRT2: number` [ES1]\n2 的平方根，约为 1.4142135623730951。\n\n## 16.2 指数、根、对数\n\
  - `Math.cbrt(x: number): number` [ES6]\n返回 `x` 的立方根。\n```\nMath.cbrt(8)\n2\n```\n\
  - `Math.exp(x: number): number` [ES1]\n返回 `ex`（`e` 为欧拉数）。`log()` 的逆操作。\n```\nMath.exp(0)\n\
  1\nMath.exp(1) === Math.E\ntrue\n```\n- `Math.expm1(x: number): number` [ES6]\n\
  返回 `exp(x)-1`。`log()` 的逆操作。非常小的数字（接近 0 的分数）用更高的精度表示。因此，每当 `exp()` 返回接近 1 的值时，此函数就会返回更精确的值。\n\
  - `Math.log(x: number): number` [ES1]\n返回 `x` 的自然对数（底为 `e`，欧拉数）。`exp()` 的逆操作。\n\
  ```\nMath.log(1)\n0\nMath.log(Math.E)\n1\n```\n- `Math.log1p(x: number): number`\
  \ [ES6]\n返回 `log(1 + x)`。`expm1()` 的逆操作。非常小的数字用更高的精度表示。因此，当 `log()` 的参数接近 1 时，你可以为此函数提供一个更精确的参数。\n\
  - `Math.log10(x: number): number` [ES6]\n返回 `x` 的底为 10 对数。`10 ** x` 的逆操作。\n```\n\
  Math.log10(1)\n0\nMath.log10(100)\n2\n```\n- `Math.log2(x: number): number` [ES6]\n\
  返回 `x` 的底为 2 对数。`2 ** x` 的逆操作。\n```\nMath.log2(1)\n0\nMath.log2(2)\n1\nMath.log2(4)\n\
  2\n```\n- `Math.pow(x: number, y: number): number` [ES1]\n返回 `x` 的 `y` 次方。\n- `Math.sqrt(x:\
  \ number): number` [ES1]\n返回 `x` 的平方根。\n\n## 16.3 取五\n取五意味着将任意数字转换为整数。\n- `Math.ceil(x:\
  \ number): number` [ES1]\n返回大于或等于 `x` 的最小整数（向上取）。\n```\nMath.ceil(2.1)\n3\n```\n\
  - `Math.floor(x: number): number` [ES1]\n返回小于或等于 `x` 的最大整数（向下取）。\n```\nMath.floor(2.9)\n\
  2\n```\n- `Math.round(x: number): number` [ES1]\n返回最近的整数（四舍五入）。\n```\nMath.round(2.5)\n\
  3\nMath.round(2.4)\n2\n```\n- `Math.trunc(x: number): number` [ES6]\n返回 `x` 的整数部分（截断小数部分）。\n\
  ```\nMath.trunc(2.9)\n2\nMath.trunc(-2.9)\n-2\n```\n\n## 16.4 三角函数\n角度以弧度为单位。使用以下两个函数在角度和弧度之间转换。\n\
  ```\nfunction degreesToRadians(degrees) {\n  return degrees / 180 * Math.PI;\n}\n\
  assert.equal(degreesToRadians(90), Math.PI/2);\n\nfunction radiansToDegrees(radians)\
  \ {\n  return radians / Math.PI * 180;\n}\nassert.equal(radiansToDegrees(Math.PI),\
  \ 180);\n```\n\n- `Math.acos(x: number): number` [ES1]\n返回 `x` 的反余弦（余弦角）。\n```\n\
  Math.acos(0)\n1.5707963267948966\nMath.acos(1)\n0\n```\n- `Math.asin(x: number):\
  \ number` [ES1]\n返回 `x` 的反正弦（正弦角）。\n```\nMath.asin(0)\n0\nMath.asin(1)\n1.5707963267948966\n\
  ```\n- `Math.atan(x: number): number` [ES1]\n返回 `x` 的反正正切（正切角）。\n```\nMath.atan(0)\n\
  0\nMath.atan(1)\n0.7853981633974483\n```\n- `Math.atan2(y: number, x: number): number`\
  \ [ES1]\n返回商 `y/x` 的反正正切。\n- `Math.cos(x: number): number` [ES1]\n返回 `x` 的余弦。\n\
  ```\nMath.cos(0)\n1\nMath.cos(Math.PI)\n-1\n```\n- `Math.cosh(x: number): number`\
  \ [ES6]\n返回 `x` 的双曲余弦。\n- `Math.hypot(...values: number): number` [ES6]\n返回 `values`\
  \ 平方和的平方根（勾股定理）：\n```\nMath.hypot(3, 4)\n5\n```\n- `Math.sin(x: number): number`\
  \ [ES1]\n返回 `x` 的正弦。\n```\nMath.sin(0)\n0\nMath.sin(Math.PI / 2)\n1\n```\n- `Math.sinh(x:\
  \ number): number` [ES6]\n返回 `x` 的双曲正弦。\n- `Math.tan(x: number): number` [ES1]\n\
  返回 `x` 的正切。\n```\nMath.tan(0)\n0\nMath.tan(1)\n1.5574077246549023\n```\n- `Math.tanh(x:\
  \ number): number; [ES6]`\n返回 `x` 的双曲正切。\n\n\n\n\n\n# 16.5 其他各种函数\n\n* `Math.abs(x:\
  \ number): number` [ES1]\n  返回 `x` 的绝对值。\n```\nMath.abs(3)\n3\n```\n```\nMath.abs(-3)\n\
  3\n```\n```\nMath.abs(0)\n0\n```\n\n* `Math.clz32(x: number): number` [ES6]\n  计算\
  \ 32 位整数 `x` 前导零的个数。用于 DSP 算法。\n```\nMath.clz32(0b01000000000000000000000000000000)\n\
  1\n```\n```\nMath.clz32(0b00100000000000000000000000000000)\n2\n```\n```\nMath.clz32(2)\n\
  30\n```\n```\nMath.clz32(1)\n31\n```\n\n* `Math.max(...values: number[]): number`\
  \ [ES1]\n  将 `values` 转换为数字并返回最大的。\n```\nMath.max(3, -5, 24)\n24\n```\n\n* `Math.min(...values:\
  \ number[]): number` [ES1]\n  将 `values` 转换为数字并返回最小的。\n```\nMath.min(3, -5, 24)\n\
  -5\n```\n\n* `Math.random(): number` [ES1]\n  返回一个伪随机数 `n`，`0 ≤ n < 1`。\n  计算一个随机整数\
  \ `i`，`0 ≤ i < max`：\n```\nfunction getRandomInteger(max) {\n  return Math.floor(Math.random()\
  \ * max);\n}\n```\n\n* `Math.sign(x: number): number` [ES6]\n  返回数字的正负号：\n```\n\
  Math.sign(-8)\n-1\n```\n```\nMath.sign(0)\n0\n```\n```\nMath.sign(3)\n1\n```\n\n\
  # 16.6 来源\n* 维基百科\n* [TypeScript 内置类型](https://github.com/Microsoft/TypeScript/blob/master/lib/)\n\
  * [MDN JavaScript 文档](https://developer.mozilla.org/en-US/docs/Web/JavaScript)\n\
  * [ECMAScript 语言规范](https://tc39.github.io/ecma262/)\n\n# 17 Unicode – 简介（高级）\n\n\
  Unicode 是用于在世界上大多数文字系统中表示和管理文本的标准。几乎所有处理文本的现代软件都支持 Unicode。该标准由 Unicode 联盟维护。每年都会发布新版本（包含新的\
  \ Emoji 等）。Unicode 版本 1.0.0 于 1991 年 10 月发布。\n\n## 17.1 代码点 vs. 编码单元\n\n这两个概念对于理解\
  \ Unicode 至关重要：\n* `Code points`（代码点）是表示 Unicode 字符的数字。\n* `Code units`（编码单元）是用于编码代码点的数字，以便存储或传输\
  \ Unicode 文本。一个或多个 `code units` 编码单个 `code point`。每个 `code unit` 的大小相同，取决于所使用的编码格式。最流行的格式\
  \ UTF-8 具有 8 位的 `code units`。\n\n### 17.1.1 代码点\n\n第一版本的 Unicode 使用 16 位的 `code\
  \ points`。从那时起字符数量大幅增加，`code points` 的大小被扩展到 21 位。这 21 位被分为 17 个平面（planes），每个平面\
  \ 16 位：\n* `Plane 0: 基础多语言平面 (BMP)`，`0x0000–0xFFFF`\n  * 包含几乎所有现代语言的字符（拉丁字母、亚洲汉字等）以及许多符号。\n\
  * `Plane 1: 补充多语言平面 (SMP)`，`0x10000–0x1FFFF`\n  * 支持历史文字系统（例如埃及象形字和楔形文字）以及额外的现代文字系统。\n\
  \  * 支持 emoji 和许多其他符号。\n* `Plane 2: 补充表意平面 (SIP)`，`0x20000–0x2FFFF`\n  * 包含额外的 CJK（中、日、韩）表意字。\n\
  * `Plane 3–13`：未分配\n* `Plane 14: 补充特殊平面 (SSP)`，`0xE0000–0xEFFFF`\n  * 包含非图形字符，如标签字符和字形变选择器。\n\
  * `Plane 15–16: 补充私用区 (S PUA A/B)`，`0x0F0000–0x10FFFF`\n  *供 ISO 和 Unicode 联盟之外的实体分配字符。未标准化。\n\
  \n平面 1-16 被称为补充平面或星际平面（astral planes）。\n\n让我们检查几个字符的 `code points`：\n```\n'A'.codePointAt(0).toString(16)\n\
  '41'\n```\n```\n'ü'.codePointAt(0).toString(16)\n'fc'\n```\n```\n'π'.codePointAt(0).toString(16)\n\
  '3c0'\n```\n```\n'☺'.codePointAt(0).toString(16)\n'1f642'\n```\n\n`code points`\
  \ 的十六进制数告诉我们，前三个字符位于平面 0（16 位以内），而 emoji 位于平面 1。\n\n### 17.1.2 编码 Unicode 代码点：UTF-32,\
  \ UTF-16, UTF-8\n\n编码 `code points` 的主要方法是三种 Unicode 转换格式（UTF）：UTF-32、UTF-16、UTF-8。每个格式末尾的数字表示其\
  \ `code units` 的大小（位）。\n\n#### 17.1.2.1 UTF-32 (32 位 Unicode 转换格式)\nUTF-32 使用 32\
  \ 位存储 `code units`，导致每个 `code point` 对应一个 `code unit`。这种格式是唯一的固定长度编码；其他所有格式都使用不同数量的\
  \ `code units` 来编码单个 `code point`。\n\n#### 17.1.2.2 UTF-16 (16 位 Unicode 转换格式)\n\
  UTF-16 使用 16 位的 `code units`。它按如下编码 `code points`：\n* `BMP (Unicode 的前 16 位)`：存储在单个\
  \ `code units` 中。\n* `星际平面 (Astral planes)`：BMP 包含 `0x10_000` 个 `code points`。由于\
  \ Unicode 总共有 `0x110_000` 个 `code points`，我们还需要编码剩余的 `0x100_000` 个 `code points`（20\
  \ 位）。BMP 有两个未分配 `code points` 范围提供了必要的存储空间：\n* 高 10 位（高位代理）：`0xD800-0xDBFF`\n* 低\
  \ 10 位（低位代理）：`0xDC00-0xDFFF`\n\n换句话说：结尾的两个十六进制数字贡献了 8 位。但只有当 BMP 以其中一个数字开头时，我们才能使用这\
  \ 8 位。\n\n#### 17.1.2.3 UTF-8 (8 位 Unicode 转换格式)\nUTF-8 具有 8 位的 `code units`。它使用\
  \ 1–4 个 `code units` 来编码一个 `code point`。\n\n| 代码点 | 编码单元 |\n| :--- | :--- |\n| 0000–007F\
  \ | 0bbbbb (7 位) |\n| 0080–07FF | 110bbbbb, 10bbbb (5+6 位) |\n| 0800–FFFF | 1110bbbb,\
  \ 10bbbb, 10bbbb (4+6+6 位) |\n| 10000–1FFFF | 11110bbb, 10bbbb, 10bbbb, 10bbbb (3+6+6+6\
  \ 位) |\n\n注意：\n* 每个 `code unit` 的前缀告诉我们：\n  - 序列的第一个吗？如果是，后面有多少个 `code units`？\n\
  \  - 它是第二个还是之后？\n* 0000–007F 范围内的字符映射与 ASCII 相同，这使得旧软件具有一定的兼容性。\n\n三个示例：\n\n| 字符\
  \ | 代码点 | 编码单元 |\n| :--- | :--- | :--- |\n| A | 0x0041 | 01000001 |\n| π | 0x03C0\
  \ | 11001111, 10000000 |\n| ☺ | 0x1F642 | 11110000, 10011111, 10011001, 10000010\
  \ |\n\n## 17.2 Web 开发中的编码：UTF-16 和 UTF-8\nWeb 开发中使用的 Unicode 编码格式：UTF-16 和 UTF-8。\n\
  \n### 17.2.1 源码源码：UTF-16\nECMAScript 规范内部使用 UTF-16 表示源码。\n\n### 17.2.2 字符串：UTF-16\n\
  JavaScript 字符串字符基于 UTF-16 编码单元：\n```javascript\nconst smiley = '☺';\nsmiley.length\n\
  2\n```\n\n\n\n\n\n```javascript\nsmiley === '\\uD83D\\uDE42' // 代码单元\n```\n\ntrue\n\
  \n关于 Unicode 和字符串的更多信息，请参阅 §18.6 “文本的原子：Unicode 字符、JavaScript 字符、字形聚簇”。\n\n## 17.2.3\
  \ 文件中的源代码：UTF-8\n\n现如今，HTML 和 JavaScript 几乎总是编码为 `UTF-8`。\n\n例如，现在 HTML 文件通常是这样开始的：\n\
  \n```html\n<!doctype html>\n<html\n<head>\n<meta charset=\"UTF-8\">\n···\n```\n\n\
  对于在浏览器中加载的 HTML 模块，[标准编码](https://html.spec.whatwg.org/multipage/webappapis.html#fetch-a-single-module-script)\
  \ 也是 `UTF-8`。\n\n## 17.3 字形聚簇 – 真正的字符\n\n一旦你考虑到世界上许多文字系统，“字符”的概念就会变得异常复杂。\n\n一方面，有由代码点（code\
  \ points）表示的 Unicode 字符。\n\n| 17.3 字形聚簇 – 真正的字符 | 141 |\n\n另一方面，有字形聚簇（grapheme clusters）。字形聚簇与屏幕或纸张上显示的符号最为对应。它被定义为“一个水平可分割的文本单元”。因此，[Unicode\
  \ 官方文档](https://unicode.org/reports/tr29/#Grapheme_Cluster_Boundaries) 也称之为“用户感知字符”。编码一个字形聚簇需要一个或多个代码点字符。\n\
  \n例如，天罗那朵提语的 `kshi` 是由 4 个代码点编码的。我们使用扩展运算符（`...`）将字符串拆分为包含代码点字符的 `Array`（详细信息请参阅\
  \ §18.6.1 “处理代码点”）：\n\n![](img/image01459.jpeg)\n\n国旗 Emoji 也是字形聚簇，由两个代码点字符组成。例如，日本国旗：\n\
