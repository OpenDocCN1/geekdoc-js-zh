  | 25.2.1 | 对象字面量：属性 | 235 |\n| 25.2.2 | 对象字面量：属性值简写 | 236 |\n| 25.2.3 | 获取属性 | 236\
  \ |\n| 25.2.4 | 设置属性 | 236 |\n| 25.2.5 | 对象字面量：方法 | 237 |\n| 25.2.6 | 对象字面量：访问器\
  \ | 237 |\n| 25.3 | 展开到对象字面量 (... ) | 238 |\n| 25.3.1 | 展开用例：复制对象 | 238 |\n| 25.3.2\
  \ | 展开用例：缺失属性的默认值 | 239 |\n| 25.3.3 | 展开用例：非破坏性修改属性 | 239 |\n| 25.4 | 方法 | 240 |\n\
  | 25.4.1 | 方法是值为函数的属性 | 240 |\n| 25.4.2 | .call():通过参数指定 `this` | 240 |\n| 25.4.3\
  \ | .bind(): 预填充 `this` 和函数的参数 | 241 |\n| 25.4.4 | `this` 陷阱：提取方法 | 243 |\n| 25.4.5\
