  \ . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . | 107 |\n\n原始类型 `boolean`\
  \ 包含两个值——`false` 和 `true`：\n\n> `typeof false`\n'boolean'\n\n> `typeof true`\n'boolean'\n\
  \n### 14.1 转换为布尔值\n\n以下是将任意值 `x` 转换为布尔值的三种方法：\n\n1. `Boolean(x)`：最具描述性；推荐。\n2. `x\
  \ ? true : false`：使用条件运算符（在本章稍后解释）。\n3. `!!x`：使用逻辑非运算符（`!`）。该运算符将其操作数强制转换为布尔值。再次应用它以获得非取反的结果。\n\
  \n表 14.1 描述了各种值如何转换为布尔值。\n\n**表 14.1：将值转换为布尔值。**\n\n![](img/image01441.jpeg)\n\n\
  `Boolean(x)`\n\n![](img/image01442.jpeg)\n\n| 输入 | 结果 |\n| :--- | :--- |\n| `undefined`\
  \ | `false` |\n| `null` | `false` |\n| 布尔值 | `x`（无变化） |\n| 数字值 | `0 → false`, `NaN\
  \ → false` |\n| 字符串值 | 其他数字 → true, `'' → false`, 其他字符串 → true |\n| 对象值 | 始终为 `true`\
  \ |\n\n### 14.2 假值（Falsy）和真值（Truthy）值\n\n在 JavaScript 中，如果你读取一个不存在的内容（例如缺失的参数或缺失的属性），通常会得到\
  \ `undefined` 结果。在这些情况下，存在检查等同于将值与 `undefined` 进行比较。例如，以下代码检查对象 `obj` 是否具有属性 `.prop`：\n\
  \n```javascript\nif (obj.prop !== undefined) {\n  // obj 有属性 .prop\n}\n```\n\n为了简化这种检查，我们可以利用\
  \ `if` 语句总是将其条件值转换为布尔值的特性：\n\n```javascript\nif ('abc') {  // 如果转换为布尔值，则为 true\n\
  \  console.log('Yes!');\n}\n```\n\n因此，我们可以使用以下代码检查 `obj.prop` 是否存在。这比与 `undefined`\
  \ 比较不精确，但更短：\n\n```javascript\nif (obj.prop) {\n  // obj 有属性 .prop\n}\n```\n\n这种简化的检查非常流行，因此引入了两个名称：\n\
  \n- 如果一个值转换为布尔值时为 `true`，则被称为**真值（truthy）**。\n- 如果一个值转换为布尔值时为 `false`，则被称为**假值（falsy）**。\n\
  \n查阅表 14.1，我们可以列出假值的完整列表：\n- `undefined`, `null`\n- 布尔值：`false`\n- 数字：`0`, `NaN`\n\
  - 字符串：`''`\n\n所有其他值（包括所有对象）都是真值：\n\n> `Boolean('abc')`\ntrue\n\n> `Boolean([])`\n\
  true\n\n> `Boolean({})`\ntrue\n\n#### 14.2.1 陷阱：真值检查不精确\n真值检查并不精确。考虑这个例子：\n\n```javascript\n\
  if (obj.prop) {\n  // obj 有属性 .prop\n}\n```\n如果 `obj.prop` 是 `undefined`，`if` 语句的体会被跳过；但如果它存在且具有任何假值，体也会被跳过。\n\
  \n#### 14.2.2 检查真值或假值\n条件运算符经常用于判断 `x` 是真值还是假值：\n\n```javascript\nif (x) {\n  //\
  \ x 是真值\n} else {\n  // x 是假值\n}\n```\n\n`const result = x ? 'truthy' : 'falsy';`\n\
  \n#### 14.2.3 用例：是否提供了参数？\n真值检查经常用于判断调用者是否提供了参数：\n\n```javascript\nfunction func(x)\
  \ {\n  if (!x) {\n    throw new Error('Missing parameter');\n  }\n}\n```\n另一种方法是检查\
  \ `undefined`：\n\n```javascript\nif (x === undefined) {\n  throw new Error('Missing\
  \ parameter');\n}\n```\n\n#### 14.2.4 用例：属性是否存在？\n真值检查也用于判断属性是否存在：\n\n```javascript\n\
  function readFile(fileDesc) {\n  if (!fileDesc.path) {\n    throw new Error('Missing\
  \ property: .path');\n  }\n}\n```\n如果你真的想检查属性是否存在，你必须使用 `in` 运算符：\n\n```javascript\n\
  if (! ('path' in fileDesc)) {\n  throw new Error('Missing property: .path');\n}\n\
  ```\n\n![](img/image0136.jpeg)\n\n### 14.3 条件运算符 (? :)\n\n条件运算符是 `if` 语句的表达式版本。它的语法为：\n\
  \n`«condition» ? «thenExpression» : «elseExpression>`\n\n它的执行方式如下：\n- 如果 `condition`\
  \ 为真值，执行并返回 `thenExpression`。\n- 否则，执行并返回 `elseExpression`。\n\n条件运算符也被称为三元运算符，因为它有三个操作数。以下代码演示了无论通过条件选择了“then”还是“else”分支——只有该分支会被执行。另一个分支不会被执行。\n\
  \n```javascript\nconst x = (true ? console.log('then') : console.log('else'));\n\
  // 输出: 'then'\n```\n\n### 14.4 二进制逻辑运算符：与 (x && y), 或 (x || y)\n\n`&&` 和 `||` 运算符是值保留且短路的。这意味着什么？\n\
  \n值保留意味着操作数被解释为布尔值，但返回时保持不变：\n\n> `12 || 'hello'`\n12\n\n### 练习：真值检查\n`exercises/booleans/truthiness_ex.mjs`\n\
  \n\n\n\n\n> `0 || 'hello'`\n\n`'hello'`\n\n短路逻辑意味着：如果第一个操作数已经决定了结果，则不会对第二个操作数求值。另一个延迟评估操作数的运算符是条件运算符：通常，所有操作数在执行操作之前都会求值。\n\
  \n例如，逻辑与 (`&&`) 在第一个操作数为为假（falsy）时，不会对第二个操作数求值：\n\n```javascript\nconst x = false\
  \ && console.log('hello');\n// 无输出\n```\n\n如果第一个操作数为真（truthy），则执行 `console.log()`：\n\
  \n```javascript\nconst x = true && console.log('hello');\n// 输出:\n'hello'\n```\n\
  \n# 10614 布尔值\n\n## 14.4.1 逻辑与 (`x && y`)\n\n表达式 `a && b`（“a 与 b”）的求值方式如下：\n\n1.\
  \ 求 `a` 的值。\n2. 结果为假吗？如果是。\n3. 否则，求 `b` 并返回结果。\n\n换句话说，以下两个表达式大致等价：\n\n```javascript\n\
  a && b\n!a ? a : b\n```\n\n### 示例：\n\n> `false && true`\n`false`\n\n> `false &&\
  \ 'abc'`\n`false`\n\n> `true && false`\n`false`\n\n> `true && 'abc'`\n`'abc'`\n\n\
  > `'' && 'abc'`\n`''`\n\n## 14.4.2 逻辑或 (`||`)\n\n表达式 `a || b`（“a 或 b”）的求值方式如下：\n\
  \n1. 求 `a` 的值。\n2. 结果为真吗？如果是。\n3. 否则，求 `b` 并返回结果。\n\n换句话说，以下两个表达式大致等价：\n\n```javascript\n\
  a || b\na ? a : b\n```\n\n### 示例：\n\n> `true || false`\n`true`\n\n> `true || 'abc'`\n\
  `true`\n\n> `false || true`\n`true`\n\n> `false || 'abc'`\n`'abc'`\n\n| 14.5 逻辑非\
  \ (`!`) | 107 |\n\n> `'abc' || 'def'`\n`'abc'`\n\n## 14.4.3 通过逻辑或 (`||`) 设置默认值\n\
  \n有时你会收到一个值，并且只想在它既不是 `null` 也不是 `undefined` 时使用它。否则，你想使用一个默认值作为回备。你可以通过 `||` 运算符来实现这一点：\n\
  \n```javascript\nconst valueToUse = valueReceived || defaultValue;\n```\n\n以下代码展示了一个真实世界的示例：\n\
  \n```javascript\nfunction countMatches(regex, str) {\n  const matchResult = str.match(regex);\
  \ // null 或 Array\n  return (matchResult || []).length;\n}\n```\n\n如果 `str` 中存在一个或多个\
  \ `regex` 匹配项，`.match()` 会返回一个 `Array`。如果没有匹配项，它会返回 `null`（而不是空 `Array`）。我们通过 `||`\
  \ 运算符修复这个问题。\n\n![](img/image01436.jpeg)![](img/image01444.jpeg)\n\n![](img/image01416.jpeg)\
  \ 练习：通过或运算符 (`||`) 设置默认值\n\n`exercises/booleans/default_via_or_exrc.mjs`\n\n# 14.5\
  \ 逻辑非 (`!`)\n\n表达式 `!x`（“非 x”）的求值方式如下：\n\n1. 求 `x` 的值。\n2. 它是真吗？如果是。返回 `false`。\n\
  3. 否则，返回 `true`。\n\n### 示例：\n\n> `!false`\n`true`\n\n> `!true`\n`false`\n\n> `!0`\n\
  `true`\n\n> `!123`\n`false`\n\n> `!''`\n`true`\n\n> `!'abc'`\n`false`\n\n# 10814\
  \ 布尔值\n\n![](img/image01395.jpeg)![](img/image01400.jpeg)\n\n![](img/image01397.jpeg)\
