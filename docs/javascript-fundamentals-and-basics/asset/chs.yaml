  \ `x` 是否是由类 `C` 创建的？\n\n`x instanceof C`\n\n例如：\n\n| 11.6 类和构造函数 | 83 |\n\n> `(function()\
  \ {}) instanceof Function`\n> true\n> `({}) instanceof Object`\n> true\n> `[] instanceof\
  \ Array`\n> true\n\n基本类型不是任何东西的实例：\n\n> `123 instanceof Number`\n> false\n> `''\
  \ instanceof String`\n> false\n> `'' instanceof Object`\n> false\n\n![](img/image01436.jpeg)![](img/image01437.jpeg)\n\
  ![](img/image01416.jpeg) 练习：`instanceof`\n\n`exercises/values/instanceof_exrc.mjs`\n\
  \n### 11.6 类和构造函数\n\nJavaScript 原始的创建工厂是构造函数：普通函数，当你通过 `new` 运算符调用它们时，它们会返回自身的“实例”。\n\
  \nES6 引入了类，类主要是构造函数更好的语法。\n\n在本书中，我交替使用构造函数和类的术语。\n\n类可以看作是将规范中的单一类型 `object` 划分为子类型——它们为我们提供了比规范有限\
  \ 7 种更多的类型。每个类都是它所创建对象的类型。\n\n#### 11.6.1 与基本类型关联的构造函数\n\n每个基本类型（除 `undefined` 和\
  \ `null` 的规范内部类型外）都有一个关联的构造函数（想象成类）：\n\n*   构造函数 `Boolean` 与布尔值关联。\n*   构造函数 `Number`\
  \ 与数字关联。\n*   构造函数 `String` 与字符串关联。\n*   构造函数 `Symbol` 与符号（symbol）关联。\n\n这些函数中的每一个都扮演着多个角色。例如，`Number`：\n\
  \n*   你可以将其作为函数使用并将值转换为数字：\n    ```javascript\n    assert.equal(Number('123'), \
  \ 123);\n    ```\n*   `Number.prototype` 为数字提供了属性。例如，方法 `.toString()`：\n    ```javascript\n\
  \    assert.equal((123).toString, Number.prototype.toString);\n    ```\n*   `Number`\
  \ 是用于数字工具函数的命名空间/容器对象。例如：\n    ```javascript\n    assert.equal(Number.isInteger(123),\
  \  true);\n    ```\n\n最后，你也可以将 `Number` 作为类并创建数字对象。这些对象与真实的数字不同，应该避免使用。\n\n```javascript\n\
  assert.notEqual(new Number(123),  123);\nassert.equal(new Number(123).valueOf(),\
  \  123);\n```\n\n#### 11.6.1.1 包装基本值\n\n基本类型相关的构造函数也称为包装类型（wrapper types），因为它们提供了将基本值转换为对象的标准方法。在这个过程中，基本值被“包装”在对象中。\n\
  \n```javascript\nconst prim = true;\nassert.equal(typeof  prim,  'boolean');\n```\n\
  \n\n\n\n\n```javascript\nassert.equal(prim instanceof Boolean, false);\n\nconst\
  \ wrapped = Object(prim);\n\nassert.equal(typeof wrapped, 'object');\n\nassert.equal(wrapped\
  \ instanceof Boolean, true);\n\nassert.equal(wrapped.valueOf(), prim);  // unwrap\n\
  ```\n\n包装在实践中很少使用，但它在语言规范内部内部，用于为原始类型提供属性。\n\n## 11.7 类型之间的转换\n\n在 JavaScript 中，值转换为其他类型的方式有两种方式：\n\
  \n1. **显式转换**：通过如 `String()` 等函数实现。\n2. **强制类型转换（自动转换）**：当操作接收到的它无法处理的操作数/参数时会发生。\n\
  \n### 11.7.1 类型之间的显式转换\n\n与原始类型关联的函数会将值显式地转换为该类型：\n\n> Boolean(0)\n> false\n\n>\
  \ Number('123')\n> 123\n\n> String(123)\n> '123'\n\n你也可以使用 `Object()` 将值转换为对象：\n\
  \n| 11.7 类型之间的转换 | 85 |\n\n> `typeof Object(123)`\n> 'object'\n\n### 11.7.2 强制类型转换（类型之间的自动转换）\n\
  \n对于许多操作，如果操作数/参数的类型不匹配，JavaScript 会自动转换。这种自动转换被称为强制转换。\n\n例如，乘法运算符会将其操作数转换为数字：\n\
  \n> '7' * '3'\n> 21\n\n许多内置函数也会进行强制转换。例如，`parseInt()` 将其参数转换为字符串（解析在第一个非数字字符处停止）：\n\
  \n> `parseInt(123.45)`\n> 123\n\n![](img/image01436.jpeg)![](img/image01437.jpeg)\n\
  \n![](img/image01416.jpeg) 练习：将值转换为原始类型\n\n`exercises/values/conversion_exrc.mjs`\n\
  \n![](img/image01395.jpeg)![](img/image01396.jpeg)\n\n![](img/image01397.jpeg) 测验\n\
  \n查看测验应用。\n\n## 12 运算符\n\n### 12.1 理解运算符\n\nJavaScript 的运算符可能看起来很古怪。通过以下两个规则，它们会更容易理解：\n\
  \n1. 运算符会将其操作数转换为适当的类型\n2. 大多数运算符只对原始值有效\n\n#### 12.1.1 运算符会将其操作数转换为适当的类型\n\n如果运算符获取的操作数类型不正确，它很少抛出异常。相反，它会强制转换（自动转换）操作数以便它可以处理。让我们来看两个例子。\n\
  \n首先，乘法运算符只能与数字一起。因此，它在计算结果之前会将字符串转换为数字。\n\n> '7' * '3'\n> 21\n\n其次，访问对象属性的方括号运算符（`[]`）只能处理字符串和符号。所有其他值都被转换为字符串：\n\
  \n```javascript\nconst obj = {};\nobj['true'] = 123;\n```\n\n#### 12.1.2 大多数运算符只对原始值有效\n\
  \n如前所述，大多数运算符只对原始值有效。如果操作数是一个对象，它通常会被强制转换为原始值。例如，加法运算符首先将其操作数转换为原始值。接下来，它会拼接这两个字符串：\n\
  \n> `[1,2,3] + [4,5,6]`\n> '123456'\n\n### 12.2 加法运算符 (+)\n\n加法运算符在 JavaScript 中的工作如下：首先，它将两个操作数转换为原始值。然后，它切换到两种模式之一：\n\
  \n- **字符串模式**：如果其中一个原始值是字符串，则会将另一个转换为字符串，拼接两个字符串并返回结果。\n- **数字模式**：否则，如果两个操作数都不是字符串（或变为字符串的对象），它会将它们相加并返回结果。\n\
  \n字符串模式允许我们使用 `+` 来组合字符串：\n\n> 'There are ' + 3\n> 'There are 3 items'\n\n### 12.3\
  \ 赋值运算符\n\n#### 12.3.1 普通赋值运算符\n\n普通赋值运算符用于更改存储位置：\n\n```javascript\nx = value;\
  \ // 赋值给之前声明的变量\nobj.prop = value; // 赋值给属性\narr[index] = value; // 赋值给数组元素\n```\n\
  \n变量声明中的初始化器也可以被视为赋值的形式：\n\n```javascript\nconst x = value;\nlet y = value;\n```\n\
  \n#### 12.3.2 复合赋值运算符\n\n给定运算符 `op`，以下两种赋值方式是等价的：\n\n```javascript\nvar op= value\n\
  var = op value\n```\n\n例如，如果 `op` 是 `+`，那么我们得到了运算符 `+=`，它的工作如下：\n\n```javascript\n\
  let str = '';\nstr += '<b>';\nstr += 'Hello!';\nstr += '</b>';\nassert.equal(str,\
  \ '<b>Hello!</b>');\n```\n\n所有复合赋值运算符列表\n\n- 算术运算符：`+=`, `-=`, `*=`, `/=`, `**=`\
  \ (`+=` 也适用于字符串拼接）\n- 位运算运算符：`<<=`, `>>=`, `&=`, `^=`, `|==`\n\n### 12.4 等等：== vs.\
  \ ===\n\nJavaScript 有两种等等运算符：松相等（`==`）和严格相等（`===`）。建议始终使用后者。\n\n`==` 和 `===` 的其他名称：\n\
  `==` 也称为双等等号。它在语言规范中的正式名称是 [抽象相等比较](https://tc39.github.io/ecma262/#sec-abstract-equality-comparison)。\n\
  `===` 也称为三等等号。\n\n#### 12.4.1 松相等 (== 和 !=)\n\n松相等是 JavaScript 的怪癖之一。它经常强制转换操作数。其中一些强制转换是合理的：\n\
  \n> '123' == 123\n> true\n\n> false == 0\n> true\n\n其他的则没那么合理：\n\n> '' == 0\n> true\n\
  \n当（且仅当！）另一个操作数是原始值时，对象会被强制转换：\n\n> [1, 2, 3] == '1,2,3'\n> true\n\n> ['1', '2',\
  \ '3'] == '1,2,3'\n> true\n\n如果两个操作数都是对象，那么只有当它们是同一个对象时才相等：\n\n> [1, 2, 3] == ['1',\
  \ '2', '3']\n> false\n\n> [1, 2, 3] == [1, 2, 3]\n> false\n\n```javascript\nconst\
  \ arr = [1, 2, 3];\narr == arr\n```\n\n最后，`==` 认为 `undefined` 和 `null` 是相等的：\n\n\
  > undefined == null\n> true\n\n#### 12.4.2 严格相等 (=== 和 !==)\n\n严格相等从不强制转换。两个值只有在类型相同时才相等。让我们回顾之前与\
  \ `==` 运算符的交互，看看 `===` 运算符做了什么：\n\n> false === 0\n> false\n\n> '123' === 123\n>\
  \ false\n\n对象仅在当该值是同一个对象时才相等：\n\n> [1, 2, 3] === '1,2,3'\n> false\n\n\n\n\n\n```javascript\n\
  ['1', '2', '3'] === '1,2,3'\nfalse\n```\n\n```javascript\n[1, 2, 3] === ['1', '2',\
  \ '3']\nfalse\n```\n\n```javascript\n[1, 2, 3] === [1, 2, 3]\nfalse\n```\n\n```javascript\n\
  const arr = [1, 2, 3];\narr === arr\ntrue\n```\n\n`===` 运算符并不认为 `undefined` 和 `null`\
  \ 相等：\n\n```javascript\nundefined === null\nfalse\n```\n\n### 12.4.3 建议：始终使用严格相等\n\
  \n我建议始终使用 `===`。这能让你的代码更易理解，并让你无需去思考 `==` 的各种怪特性。\n\n让我们来看 `==` 的两个用例以及我建议的替代方案。\n\
  \n#### 12.4.3.1 `==` 的用例：与数字或字符串比较\n\n它允许你检查值 `x` 是否为数字或该数字的字符串形式——只需一次比较：\n\n```javascript\n\
  if (x == 123) {\n    // x 是 123 或 '123'\n}\n```\n\n我更倾向于以下两种替代方案之一：\n\n```javascript\n\
  if (x === 123 || x === '123') ···\nif (Number(x) === 123) ···\n```\n\n你也可以在第一次遇到\
  \ `x` 时将其转换为数字。\n\n#### 12.4.3.2 `==` 的用例：与 `undefined` 或 `null` 比较\n\n`==` 的另一个用例是检查值\
  \ `x` 是否为 `undefined` 或 `null`：\n\n```javascript\nif (x == null) {\n    // x 是 null\
  \ 或 undefined\n}\n```\n\n这段代码的问题在于，你无法确定某人是故意这样写的，还是写错了并本想写 `=== null`。\n\n我更倾向于以下两种替代方案之一：\n\
  \n```javascript\nif (x === undefined || x === null) ···\nif (!x) ···\n```\n\n第二种替代方案比使用\
  \ `==` 更加粗率，但它是 JavaScript 中一种非常成熟的模式（将在 §14.2 中详细解释）。\n\n以下条件也大体等价：\n\n```javascript\n\
  if (x != null) ···\nif (x !== undefined && x !== null) ···\nif (x) ···\n```\n\n\
  ### 12.4.4 比 `===` 更严格的：`Object.is()`\n\n`Object.is()` 方法比较两个值：\n\n```javascript\n\
  Object.is(123, 123) // true\nObject.is(123, '123') // false\n```\n\n它比 `===` 更加严格。例如，它认为\
  \ `NaN`（涉及数字的错误值）与自身相等：\n\n```javascript\nObject.is(NaN, NaN) // true\nNaN === NaN\
  \ // false\n```\n\n这偶尔有用。例如，你可以用它来实现一个改进版的 `Array.indexOf()`：\n\n```javascript\n\
  const myIndexOf = (arr, elem) => {\n    return arr.findIndex(x => Object.is(x, elem));\n\
  };\n```\n\n`myIndexOf()` 在 `Array` 中可以找到 `NaN`，而 `indexOf()` 则不能：\n\n```javascript\n\
  myIndexOf([0, NaN, 2], NaN) // 1\n[0, NaN, 2].indexOf(NaN) // -1\n```\n\n结果 `-1`\
  \ 意味着 `indexOf()` 未在 `Array` 中找到它的参数。\n\n### 12.5 比较运算符\n\n表 12.1：JavaScript 的比较运算符。\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| `<` | 小于 |\n| `<=` | 小于等于\n| `>` | 大于 |\n| `>=`\
  \ | 大于等于 |\n\nJavaScript 的比较运算符同时适用于数字和字符串：\n\n```javascript\n5 >= 2 // true\n'bar'\
  \ < 'foo' // true\n```\n\n`<` 和 `>=` 基于严格相等。\n\n比较运算符对于人类语言来说效果并不好，例如当涉及大小写或重音符号时。细节在\
  \ §18.5 “比较字符串”中进行了解释。\n\n### 12.6 其他各种运算符\n\n布尔值、字符串、对象的运算符在本书的其他部分有所介绍。接下来的两个小节将讨论两个很少使用的运算符。\n\
  \n#### 12.6.1 逗号运算符\n\n逗号运算符有两个操作数，它求这两个值并返回第二个：\n\n```javascript\n'a', 'b' // 'b'\n\
  ```\n\n关于该运算符的更多信息，请参阅 [Speaking JavaScript](http://speakingjs.com/es5/09.html#comma_operator)。\n\
  \n#### 12.6.2 `void` 运算符\n\n`void` 运算符计算其操作数并返回 `undefined`：\n\n```javascript\n\
  void (3 + 2) // undefined\n```\n\n关于该运算符的更多信息，请参阅 [Speaking JavaScript](http://speakingjs.com/es5/09.html#void_operator)。\n\
  \n---\n\n# 第 13 章：原始值：非值 `undefined` 和 `null`\n\n许多编程语言都有一个名为 `null` 的“非值”。它表示变量当前没有指向任何对象。例如，当它尚未初始化时。\n\
  \n相比之下，JavaScript 有两个：`undefined` 和 `null`。\n\n### 13.1 `undefined` vs. `null`\n\
  \n这两个值非常相似，并且经常互用。因此它们的区别非常微妙。语言本身做出了以下区分：\n\n- `undefined` 意味着“未初始化”（例如变量）或“不存在”（例如对象的属性）。\n\
  - `null` 意味着“刻意缺席任何对象值”（引用自 [Speaking JavaScript]）。\n\n### 13.2 `undefined` 和 `null`\
  \ 的出现\n\n以下小节描述了 `undefined` 和 `null` 在语言中何处出现。\n\n#### 13.2.1 `undefined` 的出现\n\
  \n未初始化的变量 `myVar`：\n\n```javascript\nlet myVar;\nassert.equal(myVar, undefined);\n\
  ```\n\n未提供参数 `x`：\n\n```javascript\nfunction func(x) {\n    return x;\n}\nassert.equal(func(),\
  \ undefined);\n```\n\n属性 `unknownProp` 缺失：\n\n```javascript\nconst obj = {};\nassert.equal(obj.unknownProp,\
  \ undefined);\n```\n\n如果你没有通过 `return` 语句指定函数的返回值，JavaScript 会为你返回 `undefined`：\n\
  \n```javascript\nfunction func() {}\nassert.equal(func(), undefined);\n```\n\n####\
  \ 13.2.2 `null` 的出现\n\n对象的原型是一个对象，或者在原型链的末端是 `null`。\n\n```javascript\nObject.getPrototypeOf(Object.prototype)\
  \ // null\n```\n\n`Object.prototype` 没有原型。\n\n如果你对字符串（如 `'x'`）匹配正则表达式（如 `/a/`），你将要么得到一个包含匹配数据的对象（如果匹配成功），要么得到\
  \ `null`（如果匹配失败）：\n\n```javascript\n/a/.exec('x')\n```\n\nJSON 数据格式不支持 `undefined`，只支持\
  \ `null`：\n\n```javascript\nJSON.stringify({a: undefined, b: null}) // '{\"b\":null}'\n\
  ```\n\n### 13.3 检查 `undefined` 或 `null`\n\n检查其中任意一个：\n\n```javascript\nif (x ===\
  \ null) ···\nif (x === undefined) ···\n```\n\n`x` 有值吗？\n\n```javascript\nif (x !==\
  \ undefined && x !== null) {\n    // ···\n}\nif (x) { // 真值？\n    // x 不是：undefined,\
  \ null, false, 0, NaN, ''\n}\n```\n\n`x` 是 `undefined` 或 `null` 吗？\n\n```javascript\n\
  if (x === undefined || x === null) {\n    // ···\n}\nif (!x) { // 假值？\n    // x\
  \ 是：undefined, null, false, 0, NaN, ''\n}\n```\n\n\n\n\n\n`undefined` 和 `null` 是\
  \ JavaScript 中仅有的两个在尝试读取属性时会抛出异常（exception）的值。为了探索这一现象，让我们使用以下函数，它读取（“获取”）属性 `.foo`\
  \ 并返回结果。\n\n```javascript\nfunction getFoo(x) {\n  return x.foo;\n}\n```\n\n如果我们对各种值应用\
  \ `getFoo()`，可以发现它只在遇到 `undefined` 和 `null` 时才会失败：\n\n> `getFoo(undefined)`\nTypeError:\
  \ Cannot read property 'foo' of undefined\n\n> `getFoo(null)`\nTypeError: Cannot\
  \ read property 'foo' of null\n\n> `getFoo(true)`\nundefined\n\n> `getFoo({})`\n\
  undefined\n\n## 10013 非值 `undefined` 和 `null`\n\n### 13.5 `undefined` 和 `null` 的历史\n\
  \n在 Java 中（Java 启发了 JavaScript 的许多方面）中，初始化值取决于变量的静态类型：\n\n- 对象类型的变量初始化为 `null`。\n\
  - 每个原始类型都有其自己的初始化值。例如，`int` 变量初始化为 `0`。\n\n在 JavaScript 中，每个变量都可以同时持有对象值和原始值。因此，如果\
  \ `null` 意味着“不是对象”，那么 JavaScript 还需要一个意味着“既不是对象也不是原始值”的初始化值。这个初始化值就是 `undefined`。\n\
