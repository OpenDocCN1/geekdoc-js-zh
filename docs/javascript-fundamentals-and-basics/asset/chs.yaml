  - 上述方法（使用 `for` 循环遍历一系列数组元素）是我们课程中讨论的首批常用编程技术之一。它的用处不言而喻，因为它允许我们在一系列相关元素上执行重复性任务，而不需要在编写代码时就知道这些元素是什么。它可以应用于表单元素、cookie、页面元素、页面、窗口以及任何其他你可能想用\
