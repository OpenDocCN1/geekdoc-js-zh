  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 91 |\n| | | |\n| | | |\n\n26 浏览器窗口的定位\n\
  \n### Key Points\n\n• `screen` 对象允许你在 JavaScript 应用程序中访问用户计算机显示器的属性。\n• 一些可用属性包括：\n\
  \n| 属性 | 描述 |\n| : | |\n| availHeight | 用户屏幕的像素高度减去工具栏和任何其他永久对象（例如 Windows 任务栏）\
  \ |\n| availWidth | 与 availHeight 类似，但处理水平空间 |\n| colorDepth | 用户屏幕可以显示的最大颜色数（位格式，例如\
  \ 24 位、16 位等） |\n| height | 用户显示器的实际像素高度 |\n| width | 用户显示器的实际像素位宽 |\n\n• `open()`\
  \ 方法的 `left` 和 `top` 参数允许你通过指定距离屏幕左侧和顶部的像素数来指定窗口在屏幕上的位置。\n• 如果你需要使用变量来指定 `open()`\
  \ 方法中参数的值，可以如下操作：\n\n```javascript\nwindow.open(“index.html”, “window_name”, “width=200,height=200,left=”+var_left+\
  \ “top=”+var_top);\n```\n\n其中 `var_left` 和 `var_top` 是相应的变量。\n\n![](img/image01388.jpeg)\n\
  \n| ROBERT PETERSON | 92 |\n| | | |\n| | | |\n\n• 注意使用 `+` 运算符，以确保在添加变量时 `open()`\
  \ 方法的第三个参数保持为单个字符串。\n• 为了让窗口在用户屏幕上居中，需要一点简单的几何计算。屏幕的中心显然是屏幕宽度除以二、屏幕高度除以二时得到的点。然而，如果我们将窗口的\
  \ top 和 left 值设置为这些坐标，窗口的左上角将居中，而不是窗口本身。\n• 为了让窗口居中，我们需要从 top 值中减去窗口高度的一半，从 left\
  \ 值中减去窗口宽度的一半。实现此点的简单脚本如下：\n\n```javascript\nwin_width = 200;\nwin_height = 200;\n\
  win_left = (screen.availWidth/2) - (win_width/2);\nwin_top = (screen.availHeight/2)\
  \ - (win_height/2);\n```\n\n• 通过此脚本，对于任何适当使用 `win_width` 和 `win_height` 的窗口，`win_left`\
  \ 和 `win_top` 的值将被正确设置，以便在屏幕上居中。\n\n### Project\n\n• 打开你之前的项目文件，并将其保存为 `chapter_26.html`。\n\
  • 修改现有的代码，确保 logo 在用户屏幕上居中。如果可能，不要通过创建两个新函数以外的操作来修改你的原始函数——`get_win_left( width\
  \ )` 和 `get_win_top( height )`。\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON\
  \ | 93 |\n| | | |\n| | | |\n\n27 聚焦与失焦\n\n### Key Points\n\n• `window` 对象的 `focus()`\
  \ 方法为特定窗口赋予焦点。换句话说，它确保该窗口置于任何其他窗口之上，并由计算机激活。例如，如果我们创建了一个新窗口并将结果存储在名为 `new_window`\
  \ 的对象变量中，可以使用以下代码在窗口打开后的任何时候确保该窗口回到最前面：\n\n```javascript\nnew_window.focus();\n\
  ```\n\n• 反之，我们可以使用 `blur()` 方法移除指定窗口的焦点 —— 在需要时将焦点返回给之前选中的窗口。它的用法与 `focus()` 方法类似。\n\
  • 这两个都有关联的事件处理器：`onblur` 和 `onfocus`。然而，由于它们没有关联的 HTML 标签，我们如何将事件处理器附加到对象上呢？\n•\
  \ 事实证明在 JavaScript 中，每个对象对于其可以应用的每个事件处理器都有一个单独的属性。例如，如果我们想给页面上的 img 标签添加事件处理器，可以使用以下方法之一来实现：\n\
  \n```html\n<img src=”…” id=”test_img” onclick=”do_something();” />\n\n<script>\n\
  document.getElementById (“test_img”).onclick= do_something();\n</script>\n```\n\n\
  ![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 94 |\n| | | |\n| | | |\n\n• 所以，为了将函数附加到窗口的\
  \ `focus` 事件，我们可以使用：\n\n```javascript\nnew_window.onfocus = some_function();\n```\n\
