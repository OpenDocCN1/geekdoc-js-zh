  \ | 'number' |\n| String | 'string' |\n| Symbol | 'symbol' |\n| Function | 'function'\
  \ |\n| 所有其他对象 | 'object' |\n\n表 11.1 列出了 `typeof` 的所有结果。它们大致对应于语言规范中的 7 种类型。遗憾的是，有两个差异，它们是语言的特性：\n\
  \n*   `typeof null` 返回 `'object'` 而不是 `'null'`。这是一个 Bug。遗憾的是，它无法修复。TC39 曾尝试这样做，但破坏了\
  \ Web 上的太多代码。\n*   函数的 `typeof` 应该是 `'object'`（函数是对象）。引入一个独立的函数类别会引起困惑。\n\n![](img/image01434.jpeg)![](img/image01435.jpeg)\n\
  ![](img/image01416.jpeg) 练习：两个关于 `typeof` 的练习。\n\n`exercises/values/typeof_exrc.mjs`\n\
