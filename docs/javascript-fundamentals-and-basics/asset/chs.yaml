  \ 详细描述了属性的排序方式。\n\n## 25.5.9 通过 `Object.fromEntries()` 组装对象\n\n给定一个 `[key,value]`\
  \ 对的迭代器，`Object.fromEntries()` 创建一个对象：\n\n```javascript\nassert.deepEqual(\n  Object.fromEntries([['foo',1],\
