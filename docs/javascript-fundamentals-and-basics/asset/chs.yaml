  \n| ROBERT PETERSON | 97 |\n|  |  |  |\n|  |  |  |\n\n## 29 处理多个窗口\n\n### 关键点\n\n\
  • `window` 对象的 `close()` 方法允许你关闭一个窗口。如果你在当前窗口中有一个指向想要关闭的窗口的对象变量，你可以简单地使用：\n\n```javascript\n\
  new_window.close();\n```\n\n来关闭该窗口。\n\n• 当你想从打开新窗口的另一个窗口关闭该窗口时，情况会稍微复杂一些。为了解决这个问题，我们需要考虑窗口作用域（window\
  \ scope）。\n\n• 当我们在代码中编写 JavaScript 时，该脚本中的所有函数和变量都可以供我们在该窗口内使用。例如，如果我们在主窗口中有一个名为\
  \ `say_hello()` 的函数，我们可以轻松地调用该 `function`。然而，如果我们想从一个新打开的窗口调用该函数，我们无法在新窗口中直接调用它，因为我们的函数和变量是“绑定”在它们最初被定义的窗口上的。\n\
  \n• 这就是为什么当我们想向包含 JavaScript 代码之外的任何窗口写入内容时，我们必须访问该窗口的 `document` 对象以便将内容放在正确的位置。\n\
  \n• 但反过来操作呢？假设我们在主窗口（称之为 `window 1`）中使用一个函数来打开一个新窗口（`window 2`）。如果我们将 `window 2`\
  \ 存储为对象变量，我们就可以通过该对象从 `window 1` 访问 `window 2` 的所有属性。问题是，我们如何从 `window 2` 访问 `window\
  \ 1` 的任何属性呢？\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 98 |\n|  |  |  |\n\
  |  |  |  |\n\n• 关键在于 `window 2` 和 `window 1` 之间存在特殊关系——“父子关系”。我们可以通过特殊对象 `opener`\
  \ 从 `window 2` 访问 `window 1` 的任何属性。这是任何由 JavaScript 打开的窗口内部创建的对象，它始终指向打开新窗口的那个窗口。\n\
  \n• 为了这一点，让我们考虑之前的项目。我们有三个新窗口和一个“父”窗口。如果我们想在其中一个新窗口上使用事件处理器来关闭另一个新窗口，我们需要先访问父窗口，然后访问父窗口内指向想要关闭的窗口的对象变量。\n\
  \n• 假设我们从 `window_1` 中的一个链接关闭 `window_2`。我们必须在链接中创建一个带有以下代码的事件处理器：\n\n```html\n\
  onclick=”opener.window_2.close();”\n```\n\n## 项目\n\n• 打开你之前的项目文件，并将其保存为 `chapter_29.html`。\n\
  \n• 修改现有的脚本以实现以下功能：\n\n> 在第三个窗口的内容中添加两个新段落，包含以下文本：The Old Logo The New Logo\n> 每一行都应该包含在一个超链接中，链接的事件处理器访问父窗口中指向相应新窗口的对象变量。然后调用其\
  \ `close()` 方法。\n\n• 在浏览器中检查你的工作结果。\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON\
  \ | 99 |\n|  |  |  |\n|  |  |  |\n\n## 30 使用外部脚本文件\n\n### 关键点\n\n• JavaScript 可以轻松地避免我们需要输入大量的\
  \ HTML。正如我们所见，我们可以使用少量代码通过 JavaScript 来生成大型表单元素和表格。这对我们来说是个好消息，因为它让我们的工作变得更简单。对于访问者来说也是个好消息，因为他们只需要下载少量代码即可获取较大量的内容。\n\
  \n• 然而，我们可以做得更好。目前，如果我们有一个函数会为表单的出生日期部分生成年份下拉菜单，我们需要在每个需要的页面中都包含该函数。这意味着我们的访问者在多次下载相同的内容。此外，如果我们更改或改进了函数，我们必须确保在包含该函数的每个页面中更新它。\n\
  \n• HTML 允许我们通过提供一种机制将外部文本文件加载到 HTML 页面中并将其内容视为 JavaScript 代码来解决此问题。由于它是单独的文件，一旦被下载过一次，如果另一个页面请求它，浏览器将不再下载该文件的后续副本。换句话说，我们可以将所有的\
  \ JavaScript 代码加载到一个文件中，那里的任何更改将立即反映在整个网站上。\n\n• 要使用外部文件中的代码，我们仍然使用 `<script>` 标签，但带了一个新属性\
  \ `src` 属性。这与在页面上加载图像文件非常相似：\n\n```html\n<script language=”JavaScript” type=”text/JavaScript”\
  \ src=”s/script_file.js\"></script>\n```\n\n• 注意以下三点：\n\n![](img/image01388.jpeg)\n\
  \n| ROBERT PETERSON | 100 |\n|  |  |  |\n|  |  |  |\n\n• `language` 和 `type` 属性在这里是关重要的。\n\
