  \n```javascript\nprefixStringArray(stringArray) {\n  return stringArray.map(\n \
  \   function (x) {\n      return this.prefix  + x;\n    },\n    this);  // (A)\n\
  }\n```\n\n## 25.4.6 避免 `this` 的陷阱\n\n我们已经见过两个与 `this` 相关的陷阱：\n\n- 提取方法\n- 无意中遮蔽\
  \ `this`\n\n一个简单的规则可以帮助避免第二个陷阱：\n\n“避免使用 `function` 关键字”：不要使用普通函数，只使用箭头函数（用于真正的函数）和方法定义。\n\
  \n遵循这一规则有两个好处：\n\n- 它防止了第二个陷阱，因为普通函数永远不会被当作真正的函数使用。\n- `this` 变得更容易理解，因为它只会出现在方法内部（永远不会出现在普通函数内部）。这使得\
  \ `this` 显然是一个 OOP 特性。\n\n然而，尽管我不再使用（普通的）函数表达式，但我从语法上很喜欢函数声明（function declarations）。如果你不在它们内部引用\
  \ `this`，你就可以安全地使用它们。静态检查工具 `ESLint` 可以在你这样做错误时在开发期间向你警告，通过[一个内置规则](https://eslint.org/docs/rules/no-invalid-this)。\n\
