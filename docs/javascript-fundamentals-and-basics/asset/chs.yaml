  \ `this` 的值\n\n在各种上下文中，`this` 的值是什么？\n\n在一个可调用实体内部，`this` 的值取决于如何调用该可调用实体以及它是什么种可调用实体：\n\
  \n- **函数调用**：\n  - 普通函数：`this === undefined`\n  - 箭头函数：`this` 与周围作用域相同（词法 `this`）\n\
  - **方法调用**：`this` 是调用的接收者\n- **new**：`this` 指向新创建的实例\n\n你可以在所有常见的顶层作用域中访问 `this`：\n\
