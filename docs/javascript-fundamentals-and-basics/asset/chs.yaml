  \n| ROBERT PETERSON | 75 |\n|  |  |  |\n|  |  |  |\n\n## 1 使用事件处理程序\n\n### 关键点\n\
  \n- 到目前为止，我们的脚本在浏览器页面加载后就会运行了。即使我们使用了函数来“封装”代码，这些函数也是在加载时运行的，除非我们调用它们，否则它们就不会运行。目前，我们的脚本响应的唯一事件是页面加载。\n\
  - 然而，通常情况下，你希望代码响应用户活动。你需要定义函数，并让它们在用户做某些事情时触发。这就引入了事件处理程序。\n- 每当用户与页面交互时，浏览器都会告诉\
  \ JavaScript 正在发生一个“事件”。该事件可以是鼠标点击、鼠标移过或离开元素（如图像或段落）、切换到新部分、离开页面、提交表单等。\n- 事件处理程序是\
  \ JavaScript 代码，允许我们捕获每个事件，并通过运行某些代码做出响应。\n- 通常，我们将事件处理程序绑定到特定的 HTML 标签上，因此点击页面上的某个元素可能会被捕获，但点击其他地方可能会产生完全不同的结果，或者根本没有反应。\n\
  - 一些常见的事件处理程序如下所示：\n\n| | 事件处理程序 | 发生于 | |\n|---|---|---|---|\n| | `onload` | 元素加载页面时\
  \ | |\n\n| ROBERT PETERSON | 76 |\n|  |  |  |\n|  |  |  |\n| | `onunload` | 元素离开，例如用户离开页面时\
  \ |\n| | `onmouseover` | 鼠标进入 HTML 元素定义的区域时 |\n| | `onmouseout` | 鼠标离开 HTML 元素定义的区域时\
  \ |\n| | `onclick` | 在 HTML 元素区域内点击左键时 |\n| | `onmousedown` | 在 HTML 元素区域内按下左键时\
  \ |\n| | `onmouseup` | 在 HTML 元素区域内释放左键时 |\n\n- 后三个者是相关的，但存在细微差别——`onclick` 被定义为\
  \ `mousedown` 和 `mouseup` 事件都在给定元素区域内发生时。例如，如果你点击页面上的某个区域，这会注册该区域的 `mousedown` 事件。如果你按住鼠标移动到另一个区域再释放，它将注册另一个区域的\
  \ `mouseup` 事件。然而，浏览器的点击事件将保持未注册状态。\n\n- 理论上，我们可以将大多数事件处理程序添加到几乎任何 HTML 标签上。在实践中，许多浏览器限制了我们可以交互的内容。\n\
  \n\n\n\n\n- 我们将主要为 `<img>`、`<a>` 和 `<body>` 标签绑定事件处理器。\n- 要给标签上绑定事件处理器，我们使用以下方法：\n\
  ```html\n<a href=”…” onclick=”a_function();”>link\n</a>\n```\n- 我们可以使用此方法将上述列出的任何事件处理器绑定到页面的元素上。除了调用函数（当然可以带有任何可选参数）之外，我们还可以直接在事件处理器中编写\
  \ JavaScript：\n```html\n<a href=”…” onclick=”alert(‘hello’);”>link\n</a>\n```\n\
  ![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 77 |\n|  |  |  |\n|  |  |  |\n\n\
  - 注意这里引号的潜在问题——如果你在事件处理器周围使用双引号，那么你需要在内部使用单引号，反之亦然。\n\n## Project\n\n- 打开你之前的之前的项目文件，并将其另存为\
