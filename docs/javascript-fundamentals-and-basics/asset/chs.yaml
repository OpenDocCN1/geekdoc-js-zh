  \ 的操作与 `Object.entries()` 相反。为了演示这两者，我们将在接下来的子子节中使用它们来实现来自库 [Underscore](https://underscorejs.org)\
  \ 的两个工具函数。\n\n### 25.5.9.1 示例：`pick(object, ...keys)`\n\n[pick](https://underscorejs.org/#pick)\
  \ 返回 `object` 的拷贝，仅包含那些作为参数提到的键的属性：\n\n```javascript\nconst address = {\n  street:\
