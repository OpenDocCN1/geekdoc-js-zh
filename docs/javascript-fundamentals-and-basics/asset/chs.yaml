  >图像一</option>\n  <option value=\"two\">图像二</option>\n  <option value=\"three\">图像三</option>\n\
  </select>\n</form>\n```\n-   通常，从选择框中选择选项只是指定了选择框的值。这随后被用于进一步处理——通过 JavaScript 或通过服务器。\n\
  -   你可以使用 JavaScript 根据选择框的当前值来调用操作。这些操作可能直接加载另一个页面，或执行其他类型的处理。\n-   这种操作的另一种名称是“跳转菜单”。\n\
  -   为了实现这一点，你需要知道表单上的每个选择框都关联着一个 `select` 对象。使用上面的示例，因此你可以通过以下方式访问位于 `Product` 表单上的\
