  \  |  |\n|  |  |  |\n\n## 32 表单方法和事件处理器\n\n### 关键点\n\n- 每个表单对象（例如文本、按钮等）都有一组与其相关的属性。每个表单元素的情况不同。`value`\
  \ 属性是大多数表单元素通用的，而且是最有属性之一。\n- 你可以可以将在 id 为 `Enquiry` 的表单中名为 `Name` 的文本框中存储的数据赋值给\
  \ `variable`，如下：\n\n```javascript\nvariable = document.getElementById(‘Enquiry’).\n\
  Name.value\n```\n\n- 表单对象还有与其相关的方法。每个表单对象的可用方法集都不同。\n- 下面是文本对象的常用方法列表：\n\n| 方法 |\
  \ 说明 |\n| :--- | :--- |\n| `blur()` | 移除文本框的焦点 |\n| `focus()` | 使文本框获得焦点 |\n| `select()`\
  \ | 选中文本框 |\n\n- 下面是按钮对象的常用方法列表：\n\n| | 方法 | 说明 |\n| :--- | :--- | :--- |\n| | `blur()`\
  \ | 移除按钮的焦点 |\n| | `focus()` | 使按钮获得焦点 |\n| | `click()` | 调用按钮的事件处理器 |\n\n| ROBERT\
  \ PETERSON | 106 |\n|  |  |  |\n|  |  |  |\n\n- 表单对象还有与其相关的事件处理器。每个表单对象的事件处理器集都不同。\n\
  - 下面是文本对象的常用事件处理器列表：\n\n| 事件处理器 | 当……时运行 JavaScript 代码 |\n| :--- | :--- |\n| `onblur`\
  \ | 文本框失去焦点。 |\n| `onfocus` | 文本框获得焦点。 |\n| `onselect` | 用户选中了文本框内的部分文本。 |\n| `onchange`\
  \ | 文本框失去焦点且文本已过修改。 |\n\n- 下面是按钮对象的常用事件处理器列表：\n\n| 事件处理器 | 当……时运行 JavaScript 代码\
  \ |\n| :--- | :--- |\n| `onBlur` | 按钮失去焦点 |\n| `onFocus` | 按钮获得焦点 |\n| `onClick`\
  \ | 用户点击按钮 |\n\n- 最后，如果你正在向服务器发送数据，提交按钮并不是唯一的方法。你可以在由事件处理程序调用的函数中使用 `submit()` 方法。它的操作就像点击了提交按钮一样：\n\
  \n```javascript\ndocument.getElementById(‘Enquiry’).submit();\n```\n\n## 项目\n\n\
