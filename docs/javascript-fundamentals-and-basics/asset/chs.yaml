  \ | 81 |\n|  |  |  |\n|  |  |  |\n\n## 23 Simple Image Rollovers (简单的图像翻滚效果)\n\n\
  ### 要点\n\n- 简单的图像翻滚（image rollover）是一种当鼠标出现在页面上的图像（通常是链接按钮）上方时发生的效果。原始图像被另一个等大的图像替换，通常产生按钮以某种方式高亮的效果。\n\
  - 通过我们目前为止学到的知识，我们已经有了创建简单图像翻滚的能力。页面加载时，原始图像按照 `<img>` 标签 `src` 属性显示在页面上。\n- 鼠标移动到图像上，备用图像被加载到相应位置。\n\
  - 鼠标离开图像，原始图像被加载。\n- 正如你可能意识到的，我们将使用 JavaScript 来更改图像的 `src` 属性。考虑这一点的最好方法是将 `<img>`\
  \ 标签简单地视为页面上的一个空间，图像文件可以加载到其中。`src` 属性告诉浏览器要加载哪个图像，因此如果我们更改了该值，图像就会改变。\n- 换句话说，`<img>`\
  \ 标签的 `id` 属性命名的是“空间”，而不是图像。\n![](img/image388.jpeg)\n\n| ROBERT PETERSON | 82 |\n\
  |  |  |  |\n|  |  |  |\n\n- 现在，为了用 JavaScript 修改 `src` 属性，我们需要告诉 JavaScript 我们想要更改哪个图像“空间”。我们使用\
  \ `id` 属性结合上一章的 `getElementById()` 方法来实现此：\n```javascript\nbutton_img = document.getElementById(“button”);\n\
  button_img.src = “new_image.jpg”;\n```\n- 我们可以将此代码直接插入图像的事件处理器中：\n```html\n<img\
  \ src=”old.jpg” id=”button”\nonmouseover=\"document.getElementById(‘button’).src\
  \ = ’new.jpg’;\">\n```\n- 注意这段代码突然变得非常复杂。有两个潜在的解决方案。第一个是定义一个函数：\n```javascript\n\
  function swap_image( id, new_image )\n{\nimg = document.getElementById(id);\nimg.src\
  \ = new_image;\n}\n```\n- 这是一个更整洁的解决方案，重要的是我们可以通过更改函数调用的参数将其用于页面上的任何图像。我们也可以使用该函数来实现“切回”功能：\n\
  ```html\n<img src=”old.jpg” id=”button”\nonmouseover=\"swap_image(‘button’, ‘new.jpg’)\"\
  >\n```\n\n\n\n\n\n```html\n<img src=\"old.jpg\" id=\"button\" onmouseover=\"swap_image('button',\
  \ 'new.jpg');\" onmouseout=\"swap_image('button', 'old.jpg');\">\n```\n![](img/image01388.jpeg)\n\
  \n- 尽管如此，我们可以在“清理”代码方面更进一步。由于事件处理程序被用于修改发生事件的对象（即：鼠标移动到我们试图更改的图像标签上），我们可以使用“自动魔术”般的\
  \ JavaScript 对象 `this` 来执行操作：\n\n```javascript\nfunction swap_image( img, new_image\
  \ )\n{\nimg.src = new_image;\n}\n```\n\n```html\n<img src=\"old.jpg\" id=\"button\"\
  \ onmouseover=\"swap_image(this, 'new.jpg');\">\n```\n\n- 注意以下几点。首先，`this` 周围没有引号——我们像使用变量名一样使用它。其次，我们的函数现在直接使用第一个参数，而不是使用它从页面中获取相关对象。我们之所以这样做是因为\
  \ `this` 实际上是一个对象——它会获得调用它的时的任何对象的属性和方法，在这种情况下，它等同于 `document.getElementById('button')`，尽管显然要短得多！\n\
  \n- 使用 `this` 有一些局限性。例如，如果我们想在鼠标移动到“button”时更改页面上任何其他图像的 `src` 属性，我们将无法使用 `this`，因此定义另一个可以接受\
  \ id 作为参数的函数，并通过它获取相关对象。\n\n## 项目\n\n- 从网络驱动器将名为 `buttons` 的文件夹复制到你的项目文件夹。\n- 打开之前的项目文件，并将其保存为\
