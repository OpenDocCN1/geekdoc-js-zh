  \ 1955 年 7 月 17 日凌晨 1:00。通过向 `new Date()` 构造函数中输入相应的参数来实现。\n- 现在，再次使用参数，在你的脚本中添加新行，在现有日期下方单独起一行显示\
  \ 2004 年 7 月 17 日的午夜。\n- 最后，使用日期对象的字符串方法，在你的脚本中添加新行，在现有信息下方单独起一行显示 1999 年 12 月 31\
  \ 日的午夜，并使用标准日期和时间格式。\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 123 |\n\
  |  |  |  |\n|  |  |  |\n\n# 38 从日期对象中获取信息\n\n### 关键点\n\n\n\n- 下面是一些实用方法的选取，它们允许你从日期对象中获取一些有用信息：\n\
  \n| 方法 | 返回值 |\n| :--- | :--- |\n| `getDate()` | 月份几 (1-31) |\n| `getDay()` | 星期几\
  \ (0 = 周日, 6 = 周六) |\n| `getFullYear()` | 四位数字的年份 |\n| `getHours()` | 小时 (0-23)\
  \ |\n| `getMilliseconds()` | 毫秒 (0-999) |\n| `getMinutes()` | 分钟 (0-59) |\n| `getMonth()`\
  \ | 月份 (0-11) |\n| `getSeconds()` | 秒 (0-59) |\n| `getTime()` | 毫秒级的日期时间 – 也称为 Unix\
  \ 时间 |\n\n- JavaScript 内部将日期时间信息存储为自 1970 年 1 月 1 日以来的毫秒数。这是大多数编程语言的共同点，实际上也是大多数计算机系统存储时间信息的方式。\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 124 |\n|  |  |  |\n|  |  |  |\n\
  \n- 例如：\n```javascript\ndtNow = new Date();\ndocument.write(dtNow.getTime());\n\
  ```\n写入自 1970 年 1 月 1 日以来过的毫秒数。\n- 意识到每秒有 1000 毫秒，一分钟有 60 秒，一小时有 60 分钟，一天有 24 小时，你可以通过从一个毫秒格式的日期减去另一个毫秒格式的日期，建立两个日期之间的天数（或小时或分钟等）。要达到你需要的单位，执行相应的除法（例如，对于分钟数，先将减法结果除以\
  \ 1000，再除以 60），然后对结果使用 `Math.floor()` 按需要向下取整。\n\n## 项目\n\n- 打开之前的项目文件，并将其保存为 `chapter_38.html`。\n\
