  ## 18 字符串处理\n\n### 关键点\n\n- 在生产环境中使用 JavaScript 时，你经常会用它从变量中读取值，并根据发现的内容来更改行为。\n\
  - 我们在比较章节中已经见过一些基本的字符串读取，那里测试了相等性。然而，这种“全有全无”的方法对于我们的目的来说往往不够细腻。\n- 考虑这种情况：我们需要检查用户的用户名是否在已知用户列表中。例如，如果用户输入的名字是“Karen”，那么只有当他们的名字拼写与我们记录的完全一致（包括大小写等）时，才是可以。如果用户决定输入她的全名，比如“Karen\
  \ Aaronofsky”，代码将无法识别她。\n- 在这种情况下，我们想查看文本“Karen”是否出现在字符串中。我们称之为子字符串搜索，它可以非常有用。\n\
  - 最简单的子字符串搜索之一是通过使用 `indexOf` 方法完成的。每个字符串类型的变量都关联了此方法。考虑这段代码：\n\n```javascript\n\
  var_1 = “Karen Aaronofsky”;\nvar_2 = var_1.indexOf(“Karen”);\n```\n\n在这种情况下，`var_2`\
  \ 的值将为 0——记住 JavaScript 从 0 开始计数！\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON\
  \ | 62 |\n|  |  |  |\n|  |  |  |\n\n- 如果我们在这里搜索一个姓氏：\n\n```javascript\nvar_1 = “Karen\
  \ Aaronofsky”;\nvar_2 = var_1.indexOf(“Aaronofsky”);\n```\n\n`var_2` 的值将是 6。\n\n\
  - 最后，如果搜索“失败”了，比方我们作为子字符串搜索名字“Anisa”，那么 `var_2` 的值将是 -1。\n- 注意，尽管这种方法更灵活，但如果用户忘记大写我们正在搜索的任何子字符串中的某个字母，仍然会存在问题——在\
  \ JavaScript 中，“Karen”不等于“karen”。\n- 为了解决这个问题，我们可能希望确保不考虑大小写。实现这一点的的一种简单方法是在执行检查之前强制将字符串转换为小写：\n\
  \n```javascript\nreal_name = “Karen”;\nname = prompt(“你的名字?”,””);\nreal_name = real_name.toLowerCase();\n\
  try_name = try_name.toLowerCase();\n\nif ( try_name.indexOf(real_name) > -1 )\n\
  {\n    alert(“Hello Karen!”);\n}\nelse\n{\n    // 注意我们在这里使用了原始的、\n    // 未转换为小写的名字\n\
  \    alert(“Welcome “ + name);\n}\n```\n\n- 我们可以使用许多字符串方法来对字符串进行“值检查”。以下表格列出了其中几个方法：\n\
  \n| 方法 | 行为 |\n| :--- | :--- |\n| `String.indexOf(“str”)` | 返回子字符串“str”在字符串中第一个字符的数值位置\
  \ |\n| `String.charAt(x)` | 返回字符串中位置 `x` 处的字符——`indexOf` 的相反操作 |\n| `String.toLowerCase()`\
  \ | 返回字符串的副本，将所有大写字母替换为对应的小写字母 |\n| `String.toUpperCase()` | 返回字符串的副本，将所有小写字母替换为对应的大写字母\
  \ |\n| `String.match(/exp/)` | 根据对字符串的正则表达式搜索返回真或假 |\n\n| ROBERT PETERSON | 63 |\n\
  |  |  |  |\n|  |  |  |\n\n- 这里的最后一个方法值得一些说明。什么是正则表达式？\n- 正则表达式是编写易于识别的字符“模式”的标准方法。例如，考虑一个典型的电子邮件地址：`jonathan@relativesanity.com`\n\
  - 电子邮件地址遵循一种“模式”，这使得人类能够立即识别出它是一个电子邮件地址。如果我们能在 JavaScript 中定义该模式，不是很有用吗？正则表达式允许我们做到这一点。\n\
  - 让我们再次看看这个电子邮件地址。我们可以将其拆分为几个“块”：`[一些字母]@[一些字母].[几个字母]`\n- 当然，它比这要稍微复杂一点——地址的某些部分是不允许某些字符的（例如，没有空格），但这让你看到将此字符串拆分的思路。\n\
  - 现在，将此转换为正则表达式。就像我们在 JavaScript 中使用引号来表示（或“定界”）字符串值一样，为了标识一个正则表达式，我们使用斜杠：`/`。我们的电子邮件地址正则表达式可能像这样：`/^.+.+\\\
  ..$/`\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 64 |\n|  |  |  |\n|  |\
  \  |  |\n\n- 这值得一些讨论。让我们逐一个来看这些字符：\n- `/` 表示正则表达式。\n- `^` 表示我们希望这个正则表达式出现在字符串的最开头。\n\
  - `.+` 点符号 `.` 用于代表任何字符。加号 `+` 表示我们想要找到至少一个这样的字符。\n- `@` 这仅仅是一个字符——除了它本身，它没有特殊含义。\n\
  - `\\.` 这很有趣。我们知道点符号在正则表达式中有一个特殊含义——它意味着“匹配任何字符”。然而，在这里我们想要找到一个实际的点。不像 `@` 没有特殊含义，点，我们必须告诉\
  \ JavaScript 忽略点的特殊含义。我们通过在它前面加一个反斜杠来实现这一点。\n- `.+` 再次，在点之后至少有一个更多的字符。\n- `$` 是开头\
  \ `^` 的镜像——这匹配测试字符串的末尾。\n- `/` 告诉 JavaScript 我们到达了正则表达式的结束。\n\n\n\n\n\n• 呼！这里有很多需要考虑的地方。正则表达式在最好的情况下也是一门深奥的艺术，所以如果上面的代码难以理解，也不要太担心。现在需要意识到的点是，我们可以在\
  \ JavaScript 中执行一些相当复杂的模式识别，而无需多次检查字符串的每一个字符。\n\n![](img/image01388.jpeg)\n\n| ROBERT\
  \ PETERSON | 65 |\n|  |  |  |\n|  |  |  |\n\n• 下面的代码检查一个变量看它看起来像不像电子邮件地址：\n\n```javascript\n\
  var_1 = prompt(“Your email?”, “”);\n\nif ( var_1.match(/^.+@.+\\..+$/) )\n{\nalert(“valid\
  \ email address”);\n}\nelse\n{\nalert(“are you sure?”);\n}\n```\n\n• 目前这段代码存在几个问题——例如，它会很顺利地通过字符串“-@.-.-”，这显然是错误的。我们将在课程的稍后部分讨论解决方法。\n\
  \n### 项目\n\n• 打开你之前的项目文件，并将其保存为 `chapter_18.html`。\n\n• 清空 `<script>` 标签中所有的 JavaScript\
  \ 代码。\n\n• 使用 `prompt` 框捕获用户输入并赋值给名为 `check_string` 的变量。\n\n• 使用 `document.write`\
  \ 语句输出将各种字符串方法应用于用户输入时的结果。\n\n• 检查用户输入看其是否为电子邮件地址，并相应地更改你的输出，显示为“这是一个电子邮件地址”或“在我看来这看起来像一个电子邮件地址！”。\n\
  \n• 在后一种情况下，也输出失败的字符串，以便用户可以看到自己的输入，并在下次需要时进行修改。\n\n![](img/image01388.jpeg)\n\n\
  | ROBERT PETERSON | 66 |\n|  |  |  |\n|  |  |  |\n\n## 19 使用函数\n\n### 核心要点\n\n•\
  \ 函数是一组命名的 JavaScript 语句，用于执行特定任务并出现在标准的 `<script>` 标签内部。任务可以是简单的也可以是复杂的，函数的名称由你决定，其限制条件与变量命名相似。\n\
  \n• JavaScript 函数在在使用之前进行声明。声明写法如下：\n\n```javascript\nfunction name_of_function(\
  \ )\n{\n…在此处编写你的代码…\n}\n```\n\n• 与我们目前学过的所有 JavaScript 指令不同，函数内部的代码在没有被明确请求之前不会运行。这种请求被称为函数调用。\n\
  \n• 函数可以在页面上 JavaScript 存在的任何地方调用，但必须在函数声明后才能调用。例如，如果你在文档正文中声明了一个函数，然后在文档头部中调用它，你可能会发现浏览器返回了错误信息。由于这个原因，大多数\
  \ JavaScript 程序员会在页面的头部 `<script>` 标签之间定义他们将使用的任何函数，以确保它们在使用之前都已定义。\n\n• 函数之于对象正如变量之于对象属性——它们的调用方式也类似。要运行上述\
  \ `name_of_function` 函数包含的代码，我们将使用以下行代码：\n\n```javascript\nname_of_function();\n\
  ```\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 67 |\n|  |  |  |\n|  |  |\
  \  |\n\n• 注意函数名后的括号。这让 JavaScript 知道我们处理的是一个函数而不是变量。括号还允许我们向函数“传递”额外信息，这可以改变它的行为。考虑以下函数：\n\
  \n```javascript\nfunction greet_user( username )\n{\nmessage = “Hello “ + username;\n\
  alert(message);\n}\n```\n\n• 每只要调用该函数，它就会问候指定的指定的用户。我们该如何传递这些信息呢？考虑：\n\n```javascript\n\
  greet_user(“Anisa”);\n```\n\n或者\n\n```javascript\nvar_1 = prompt(“Name?”, “”);\n\
  greet_user(var_1);\n```\n\n• 我们应该在代码中尽可能地使用函数。当我们执行一个无法通过方法或赋值运算符完成的操作时，我们应该尝试构建一个可以完成该任务的函数。\n\
  \n• 例如，我们可以构建一个检查电子邮件地址的函数：\n\n```javascript\nfunction check_email( address )\n\
  {\nvar_1 = false;\nif ( address.match(/^.+@.+\\..+$/) )\n{\nvar_1 = true;\n}\n}\n\
  ```\n\n• 上述将接收传递给它的字符串（通常称为函数的参数），并根据发现的内容更改 `var_1` 的值。然而，该函数缺少一项重要的能力——将其发现的结果传回给脚本的其他部分。\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 68 |\n|  |  |  |\n|  |  |  |\n\
  \n• 我们在笔记中已经多次提到过返回值。现在我们看到了一个需要函数将其发现的结果返回给代码其他部分的情况。理想情况下，我们希望能够像下面一样使用上述函数：\n\
  \n```javascript\nif ( check_email(address) )\n{\n…执行一些邮件相关操作…\n}\n```\n\n• 为了让此起作用，`check_email`\
  \ 的返回值必须是一个布尔值（Boolean）。我们可以非常简单地安排：\n\n```javascript\nfunction check_email( address\
  \ )\n{\nvar_1 = false;\nif ( address.match(/^.+@.+\\..+$/) )\n{\nvar_1 = true;\n\
  }\nreturn var_1;\n}\n```\n\n• 由于 `var_1` 要么 true 要么 false，返回值将是布尔值。我们甚至可以在这里跳过变量的使用，更加直接：\n\
  \n```javascript\nfunction check_email( address )\n{\nif ( address.match(/^.+@.+\\\
  ..+$/) )\n{\nreturn true;\n}\nreturn false;\n}\n```\n\n或者更好，因为 `address.match()`\
  \ 本身就会返回一个布尔值：\n\n```javascript\nfunction check_email( address )\n{\nreturn address.match(/^.+@.+\\\
  ..+$);\n}\n```\n\n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 69 |\n|  |  |\
  \  |\n|  |  |  |\n\n• 上述函数看起来可能并不是巨大的节省。毕竟，我们正用四行代码来定义一个只执行一行代码的函数。对比一下：\n\n```javascript\n\
  function check_email( address )\n{\nreturn address.match(/^.+@.+\\..+$);\n}\nif\
  \ ( check_email(address) )\n{\n…执行一些邮件相关操作…\n}\n```\n\n与：\n\n```javascript\nif (\
  \ address.match(/^.+@.+\\..+$/) )\n{\n…执行一些邮件相关操作…\n}\n```\n\n• 虽然这里的益处并不明显，但考虑一下这种情况：在未来的某个时刻，你发现了一种更好的检查电子邮件地址的方法。在上面的第二种情况下，你必须搜索代码中该方法的每一个实例，并将其替换为你的新方法，而新方法可能不是一行。在第一种情况下，你只需要更改底层的函数定义，“升级”就会在你的整个代码中生效，而无需更新每个出现处。\n\
  \n### 项目\n\n• 打开你之前的项目文件，并将其保存为 `chapter_19.html`。\n\n• 清空 `<script>` 标签中所有的 JavaScript\
  \ 代码。\n\n• 确保你在文档头部区域有一个 `script` 元素，正文区域也有。\n\n• 在头部区域定义一个名为 `show_message` 的函数。该函数应该接受一个名为\
  \ `message` 的参数，并使用警告框显示参数的内容。\n\n• 在正文中，使用各种消息作为参数调用该函数。\n\n![](img/image01388.jpeg)\n\
  \n| ROBERT PETERSON | 70 |\n|  |  |  |\n|  |  |  |\n\n• 现在在正文中使用变量来存储 `prompt` 获取用户消息的返回值。将此变量作为\
  \ `show_message` 实例的参数。\n\n• 在头部定义一个名为 `get_message` 的新函数。它不接受任何参数，但应该复制你在正文中 `prompt`\
  \ 的功能，通过提示框询问用户消息。\n\n• 确保 `get_message` 返回一个合理的值。我们的目标是将正文中的提示语句替换为以下代码：\n\n```javascript\n\
  message = get_message();\n```\n\n所以考虑你需要返回什么才能使其工作。\n\n• 一旦你对 `get_message` 的定义感到满意，尝试用上述语句替换正文中的提示代码。\n\
  \n• 为了演示函数的威力，更改 `show_message` 的动作，将消息写入页面，而无需更改页面正文中的任何代码。\n\n\n\n\n\n- 在对条件语句讨论中，我们看到了如何通过比较运算符来检查单个条件的真假性：\n\
  \n```javascript\nif ( x > some_value )\n{\n…expressions…\n}\n```\n\n- 我们还看到了这种方法的局限性。假设我们想发现\
  \ `x` 是否位于两个值（例如 `val_1` 和 `val_2`）之间。我们有多种方法可以实现这一目标。在关于学生成绩的示例中，我们学习了可以使用一对 `if…else`\
  \ 语句对来实现这种效果：\n\n```javascript\nif ( x > val_1 )\n{\n…do something…\n}\nelse\nif\
  \ ( x > val_2 )\n{\n…do something else…\n}\n```\n\n- 上述代码实现了我们的目标——对于第二个分支，`x` 必须位于\
  \ `val_2` 和 `val_1` 之间（当然，假设 `val_1` 大于 `val_2`）。然而，它相当笨拙，并且无法优雅地扩展到检查三个条件（假设我们还想检查\
  \ `x` 是否为偶数），或者实际上无法扩展到十个条件。\n\n- 逻辑运算符（Logical Operators）登场。这些运算符用于连接条件检查，并根据所有或任何一个检查是否真来返回真或假。\n\
  \n![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 72 |\n|  |  |  |\n|  |  |  |\n\
  \n- 在英语中，我们使用“AND”和“OR”来称为这些运算符。\n\n- 例如，假设我们想在每周二晚上 8 点做某些事情。我们需要检查当前日期是否为周二，以及时间是否为晚上\
  \ 8 点。\n\n- 另一个例子：假设我们想在每月第一个周二做某些事情，同时也在每月 3 号做。我们必须检查当前日期是否是每月第一个周二，或者是否是该月的 3\
  \ 号。\n\n- 注意上一个例子，如果两个条件都成立，那么我们就在周二 3 号，并执行该操作。换句话说，“或”条件允许其中一个、另一个或两个条件都为真。\n\n\
  ![](img/image01388.jpeg)\n\n| ROBERT PETERSON | 73 |\n|  |  |  |\n|  |  |  |\n\n\
  - 在 JavaScript 中，我们使用以下语法来检查多个条件：\n\n```javascript\n( 100 > 10 && 5 < 8 )\n```\n\
  翻译为“如果 100 大于 10 且 5 小于 8”。在这种情况下，结果为 true。\n\n```javascript\n( 100 > 200 && 4 <\
  \ 9 )\n```\n在这种情况下，结果为 false。注意，这里实际上只检查了第一个条件。由于 `and` 要求两次比较都为真，一旦它发现一个为假，就会停止检查。这可以很有用。\n\
  \n```javascript\n( 100 > 10 || 9 < 8 )\n```\n翻译为“如果 100 大于 10 或者 9 小于 8”。在这种情况下，结果为\
  \ true，因为至少有一个条件被满足。\n\n```javascript\n( 100 > 200 || 4 > 9 )\n```\n在这种情况下，结果为 false，因为两个比较都不为真。最后：\n\
  \n```javascript\n( 100 > 200 || 5 < 2 || 3 > 2 )\n```\n在这种情况下，结果为 true。三个条件中的任何一个为真都会提供这个结果。\n\
  \n- 从最后一个例子中可以看到，这种检查方法可以扩展到任意数量的条件。我们还可以混合使用这些运算符。例如：\n\n```javascript\n( ( 100\
  \ > 200 && 100 > 300 ) || 100 > 2 )\n```\n在这种情况下，`and` 条件求结果为 false，但只要该条件或最后一个条件有一个为真就能返回真，所以整体条件返回\
  \ true，因为 100 确实大于 2。\n\n- 这种复杂的逻辑可能需要一段时间时间来理解，并且不会成为课程的重点。然而，意识到它是很有用的。\n\n![](img/image01388.jpeg)\n\
