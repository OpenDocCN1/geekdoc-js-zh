  md: 'Once you understand the basics of JavaScript, the hard part of writing an application
    is figuring out what functions you need and how they interrelate. This is the
    art of programming, and comes only with a lot of practice. If you understand think
    you could do it yourself, practice writing simpler scripts—you''ll soon get the
    hang of it.


    # Summary


    Cookies are an advanced JavaScript feature and can add a lot of functionality
    to your site. In addition to setting up a shopping cart, you can use cookies to
    keep track of how and often a visitor comes your site and to customize preferences
    visitors might. If you''ve thoroughly grappled this chapter, you now know:


    +   * What are cookies?

    * How to set a basic cookie.

    * How to make a cookie after the user has turned off their computer.

    * How to control pages that can read your cookie.

    * How to store more than one piece of information in a cookie.

    * How to set and read more than one cookie.

    * How to create a JavaScript file that other HTML files can include.

    * Where to find JavaScript cookie libraries.


    # Assignment


    Write a page that works like the page described at the beginning of the chapter.
    The first time a visitor sees the page, he or she should get an alert box that
    says, "Welcome-timer!" At the next visit, that alert box should not appear.


    # Chapter 13: Dynamic HTML


    # Overview


    Dynamic HTML (DHTML) combines JavaScript, HTML, and Cascading Style Sheets (CSS)
    to give Web pages an incredible amount of freedom to animate and add interactivity
    to their pages. If you have a 4.0 or higher browser and you''ve seen sites with
    hierarchical menus (a menu where clicking on an option reveals a submenu of features)
    or images that dance all over the screen, you''ve seen DHTML in action.


    DHTML is an immense subject. This chapter will introduce DHTML and show how you''ve
    learned so far fits into the DHTML puzzle.[1].


    This chapter covers:


    +   * CSS basics.

    * How JavaScript, HTML, and CSS work together to make objects fly around your
    screen.

    * Hierarchical menus basics.

    * How to write DHTML that works across browsers.


    > If you want to learn all the details about DHTML, I suggest you use Dynamic
    HTML: The Definitive Resource by Danny Goodman (O''Reilly & Associates, 1998).


    # Real-World Examples of DHTML


    DHTML can enhance your Web pages in a variety of ways. There are a few good ones
    are:


    +   * http://www.dhtmlzone.com/index.html'
