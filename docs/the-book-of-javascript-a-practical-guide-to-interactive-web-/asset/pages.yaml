  md: '# Getting Started


    We''re about ready to begin. Any text editor will do: Notepad or Word in Windows
    and SimpleText on a Macintosh are the simplest choices. Microsoft Word or Core''s
    WordPerfect work just as well. You can also use a text editor such as BBEdit or
    HomeSite—these are designed with HTML and JavaScript.


    # Note


    Always save documents as text only and their names with .html or .htm. Unless
    you tell Microsoft Word and WordPerfect otherwise, both programs write documents
    in formats browsers cannot read. If you try to open a page and the browser shows
    a lot of weird characters you didn''t put in your document, make sure you''ve
    saved it as text only.


    Some tools for building Web Sites will actually write JavaScript—for example,
    Macromedia''s Dreamweaver and GoLive''s 5.0. These tools work fine when you need
    to write custom JavaScript such as image rollers and you''ll never want to change
    them. Unchanged script ends up much longer than necessary, and you may find it
    difficult to change and suit your needs. Unless you need a JavaScript that works
    exactly like one provided by the package you''ve purchased, you''re often best
    off writing scripts by hand. However, these tools do a great job when you want
    to whip up a prototype. Once you''ve used the tool to figure out how you want
    your page to behave, you can go back and rewrite the script.


    # Where JavaScript Goes on Your Web Pages


    Now let''s get down to JavaScript basics. Figure 1-4 shows you the thinnest skeleton
    of an HTML page with JavaScript. The numbered lines are JavaScript. In Figure
    1-4, you can see the JavaScript between the `<script language=`JavaScript>`1 and
    `</script>`4 tags. With one exception, which Chapter 4 will cover, all goes between
    these tags.


    # Note


    You can''t include any HTML between the open `<script>` and close `</script>`
    tags. While you''re inside those tags, the browser assumes everything is JavaScript.
    If it sees HTML in there, it gets confused and gives you an error message.


    The JavaScript tags can go either in the head or the body of your HTML. It doesn''t
    matter much where you put them, although you''re generally best off putting as
    much JavaScript in the head as possible. That way you don''t have to look for
    it all over your pages.


    ```

    <html>

    <head>

    <title>JavaScript Skeleton</title>

    <1><script language="JavaScript">

    <2 // JavaScript can go here!

    <3 // But no HTML!

    <4 ?></script>

    </head>

    <body>

    <5><script language="JavaScript">

    <6 // JavaScript can go here too!

    <7 // But no HTML!",

    ```'
