  md: '# onMouseOver and onMouseOut


    Links can capture two events: onMouseOver and onMouseOut. Moving the mouse over
    a link triggers onMouseOver, as shown in [Figure 4-6](Figure 4-6).

    <a href="#onMouseOver="alert(''hey! that ticks!'');">link</a>


    **Figure 4-6:**onMouseOver


    In Netscape 3.0 and, MSIE 4.0 and, moving the mouse over the link triggers onMouseOut.
    You can use onMouseOut, onMouseOver, and onClick in the same link, as in [Figure
    4-7](Figure 4-7).


    ```

    <a href="#"

    onMouseOver = "alert(''hey! that ticks!'');";

    onMouseOut = "alert(much better!)";

    onclick = "false";

    </a>

    ```


    **Figure 4-7:**onMouseOut, onMouseOver, and onClick in the same link

    Mousing over this link results in an alert box showing the words "hey! that ticks"
    ([Figure 4-8](Figure 4-8)). Press ENTER to get rid of the first alert and moving
    your mouse over the link results in another alert box that contains the words
    *that''s better!* If you click the link instead of moving your mouse over it,
    nothing will happen because of the `return false;` code in inline.


    ![](img/ac1d40986725f1dfb2866c1197da027c_43_0.png)


    **Figure 4-8:**An alert box produced by mousing over a link


    # Quotes in JavaScript


    Inside the double quotes of onClick ([Figure 4-7](Figure 4-7)) is a complete line
    of JavaScript, semicolon and all orders. In previous chapters, we''ve placed all
    of our JavaScript between open-script and close-script tags. The only exception
    to this rule is when JavaScript is inside an event handler. Your browser will
    assume that the stuff inside these quotes is JavaScript, so you should not use
    tags here.


    Also note that the quotes in the alert are single quotes (''). JavaScript wouldn''t
    be able to figure out which quotes go with what. For example, if you write

    onclick="alert(''off to the ACLU'');";


    JavaScript would think that the double quote closed the first quote, which would
    confuse it and return an error. Make sure if you have quotes, one is double and
    the other is single.

    Apostrophes can also cause problems. For example, let''s say you want the alert
    in [Figure 4-6](Figure 4-6) to say *here''s the ACLU page, you''re gonna love
    it!* You would want the JavaScript to represent this:


    ```

    onclick="alert(''here''s the ACLU page, you''re gonna love it!'');

    Unfortunately, JavaScript reads the apostrophes in "here''s" and "you''re" as
    single quotes inside single quotes. If confused. If you really want those apostrophes,
    *escape* them with a backslash (\), like this:

    ```


    ```

    onclick="alert(''here\''s the ACLU page, you\''re gonna love it!'');";

    ```'
