    # Who Can Read the Cookie?


    I''ve already mentioned that only the Web site set a cookie can read it—McDonald''s
    can''t read Burger King''s cookies, and vice versa. The full story is a little
    more complicated than that, however.


    # Let One Page Read a Cookie Set by Another


    By default, only the page that set the cookie can read it. If one of your pages
    sets a cookie, let other pages on your site read it by setting the `path` of the
    cookie. The cookie `path` path sets the top-level directory from which a cookie
    can be read. Setting the `path` to a root-level directory of your site makes it
    possible for all your Web pages to read the cookie.

    To do this, add `path=` to your cookie. If you want the cookie readable in a directory
    called `food`, use `path=/food`.


    # Dealing with Multiple Domains


    Some sites have little of little domains. For example, the Yahoo portal has a
    main site (www.yahoo.com), a personalized site (my.yahoo.com), and many others.
    By default, a Web page on finances.yahoo.com sets cookies, and a page on my.yahoo.com
    cannot read them. If you add `domain=domain_name` to a cookie, all pages ending
    in `domain_name` can read the cookie. To allow all the machines in the yahoo.com
    domain to read a cookie, Yahoo has to add `domain=yahoo.com` to the cookie.


