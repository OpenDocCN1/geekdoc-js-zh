    of the name with the dog''s name: and see the alert come up,


    alert(the name + " has a dog * name");

    If I had used var inside the getDogName() function, "thau has a dog named fico"
    would come up. Var, as your JavaScript gets longer, you''re more likely to use
    the same variable in different functions. Without var, it''s very difficult to
    do what''s going wrong in these functions, so save your headache with a little
    preparation. Another reason to use var to hide variables inside functions is that
    you can write functions that you can cut and paste into other scripts. Without
    var, you don''t have to worry about whether a function you''ve written will mess
    up another function when you paste it into another page. Otherwise you can''t
