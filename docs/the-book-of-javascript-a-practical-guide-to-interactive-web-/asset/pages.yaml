  md: '# What Are the Alternatives to JavaScript?


    Several other programming languages can add interactivity to Web pages, but they
    all differ from JavaScript in important ways. The three main alternatives are
    CGI scripting, Java, and JavaScript.


    # CGI Scripting


    Before JavaScript, CGI scripts were the only way to make Web pages more than than
    hyperlink to other Web pages. CGI (Common Gateway Interface)—a language browsers
    and programs can use to communicate send messages to computer programs on Web
    servers. For example, a Web browser can send information (the length and type
    of fish) to a CGI program that calculates the weight of fish. The program runs
    its calculations, formats the answer as an HTML page, and sends the answer to
    the browser.


    CGI scripts are very powerful, but they reside on the Web server, which limits
    the speed of your Web browser. In this case, it might not count like a big problem,
    but imagine the scenario: You''re filling out an order with a dozen fields (such
    as name, address, and phone number—Figure 1-3 on page 6), but you forget to include
    your phone number and address. When you press the Submit button to send the information
    to the Internet to the Web server, the server sees that you didn''t fill the form
    correctly and sends back across the Internet requesting you to fill the form again.
    This cycle could take a while or over slow connection. If you fill out the form
    incorrectly, you have to go through another cycle. People find this process tiresome,
    especially if they''re customers who want their orders processed quickly.


    ![](img/ac1d40986725f1dfb2866c1197da027c_7_0.png)


    Figure 1-3: A simple order

    With JavaScript, the programs you write run in the browser instead. This means
    the browser can make sure you''ve filled out the form correctly before sending
    the form''s to the Web server. JavaScript reduces your time spent traveling between
    the browser and the server waiting until you''re really done before sending information.


    Another drawback to CGI scripts is that the Web server running down if too many
    people use the program simultaneously. When using HTML pages is pretty easy for
    a Web server. However, some CGI programs take a time to run on a machine, and
    each time someone tries to run the program, the server has to start another copy
    of it. As more and more people try to run the program, the server might take to
    long to respond or give visitors a "server busy" error. This problem does not
    exist in JavaScript because its programs run on each visitor''s Web browser—not
    on the Web server.


    A problem with CGI scripts is that not everyone has access to the parts of a Web
    server that can run CGI scripts. A single CGI script can conceivably crash a Web
    server,'
  merge: -1
