    A harder problem is when you do an image swap as I''ve described, the image''s
    swapped in only down when your visitors move over the image. If your network connection
    is slow or the image is big, there''s a delay between the mouse and the image
    swap.


    # Solving the Gotcha: Preloading Your Images


