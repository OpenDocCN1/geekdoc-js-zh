    # # Plug-ins and ActiveX


    Netscape and Microsoft Internet Explorer interact with external programs using
    plug-ins—software of other companies have built to allow their programs to exchange
    information with browsers. Web generally invoke plug-ins using the <embed> tag.
    For example, to put a QuickTime movie called "my_vacation" on your Web page, you
    would insert the following:


    ```

    <embed src="my_vacation"></embed>

    ```


    Unfortunately, no one has the QuickTime plug-in. Those won''t have on their machines
    get a broken-link icon instead of your video. You can use JavaScript to avoid
    the broken-link icon, but it''s not all straightforward because Netscape and Microsoft
    Internet Explorer deal with plug-ins in vastly different ways.


    # # How Netscape Deals with Plug-ins


    Netscape keeps track of plug-ins using arrays navigator.plugins and navigator.mimeTypes.
    However, not all plug-ins do a good job of letting Netscape know what they are,
    and different versions of Netscape handle the feature a bit differently, so using
    these arrays can be difficult.


    # # How MSIE Deals with Plug-ins


    Microsoft Internet Explorer has these arrays, but they''re always empty. To check
    which plug-ins or ActiveX components has, you must use Basic Basic, a Microsoft-proprietary
    language similar to JavaScript in Internet Explorer for PCs. If you''re using
    Microsoft Internet Explorer on a Macintosh, there''s no way to check for plug-ins.


    # # Use a Plug-in Detection Library


    Writing a browser-plugin detector is not an easy task. Luckily, several free plug-in
    libraries can do the work for you. I recommend Webmoney''s at http://www.hycos.com/webmoney/reference/javascript_code_library/wm_pluginbot/
    (it''s also on the included CD-ROM in other libraries/plugins/). Take a look to
    see the coding you''re saving by not writing your own plugin detector.


    # # Making Music with Plug-ins


    Some of the very plug-ins designed for browsers played music. Netscape uses a
    plug-called LiveAudio to manipulate sounds, and Microsoft Internet Explorer uses
    the ActiveMovie Control.


    # # Netscape''s LiveAudio


    LiveAudio comes packaged with Netscape 3 and so you probably have it if you''re
    using a Netscape browser. To use LiveAudio to manipulate a sound, include it in
    a Web page using the embed tag:


    ```

    <embed src="beep" hidden="true" autostart="false" mastersound></embed>

    ```


    The mastersound feature lets JavaScript affect the sound and setting the autostart
    feature to true plays the sound when the page first loads. If you have a plug-in
    such as QuickTime or Shockwave that actually shows something on the page, set
    the hidden'
