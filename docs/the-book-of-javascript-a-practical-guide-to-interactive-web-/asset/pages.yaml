  md: 'engineers generally guard this area, only allowing fellow engineers access.
    JavaScript, on the other hand, goes right into the HTML of a Web page. If you
    write a Web page, you can put JavaScript in the page without permission from recalcitrant
    engineers.


    # Java


    Although JavaScript and Java have similar names, they aren''t the same. Netscape
    initially created JavaScript to provide interactivity for Web pages, and Sun Microsystems
    wrote Java as a general programming language that works on all kinds of operating
    systems. you can see in [Appendix A], though JavaScript can talk to Java languages,
    they''re two totally separate languages.


    # VBScript


    The language most similar to JavaScript is Microsoft''s proprietary language,
    VBScript (VB stands for Visual Basic). Like JavaScript, VBScript runs on your
    browser and adds interactivity to Web pages. However, VBScript works only on computers
    Internet Explorer on Windows, so unless you want to restrict your readership to
    people who use that browser on operating system, you should go with JavaScript.


    # JavaScript''s Limitations


    Yes, JavaScript does have limitations—but they derive from its main purpose: to
    add interactivity to your Web pages.


    # JavaScript Can''t Talk to Servers


    One of JavaScript''s drawbacks is also its strength: it works entirely within
    the Web browser. As you see, this cuts on the amount of time your browser spends
    communicating with a server. On the other hand, JavaScript can''t handle some
    server tasks you may need to do.


    The primary tasks JavaScript can''t handle are aggregating information from your
    users and communicating with other machines. If you want to write a survey that
    asks visitors a couple of questions, stores their answers in a database, and sends
    emails when they finish, you''ll have to use a program on your server. As you
    see in [Chapter 7], JavaScript can''t make the survey run server—but once a visitor
    has finished, JavaScript can''t store the information on the server—JavaScript
    works only on the browser and cannot store the survey information, you need a
    CGI script or Java app, both of which fall outside the scope of this book.


    Sending email with JavaScript is also a problem: Your JavaScript would have to
    contact a server to send the mail, and of course it can''t do it. Again, you need
    a CGI script or Java app for this job.


    # JavaScript Can''t Create Graphics


    Another of JavaScript''s limitations is that it can''t create its own graphics.
    Whereas complicated languages can draw pictures, JavaScript can only manipulate
    existing pictures (is is, because JavaScript can created images in so many ways,
    you shouldn''t find this too limiting.


    # JavaScript Works Differently in Browsers


    Perhaps the most annoying problem with JavaScript is that it works somewhat differently
    in various browsers. JavaScript came out with Netscape 2.0 and has changed slightly
    with each new version. Internet Explorer started its version (MSIE) and added
    some features to its version of JavaScript when it introduced MSI 4.0. Luckily,
    the core of JavaScript is identical in all the browsers; but the fancy stuff like
    Dynamic HTML ([Chapter 13]) is different. I took Netscape 3.0''s JavaScript as
    the standard and I''ll point out incompatibilities with other browsers as they
    come throughout the book.'
  merge: -1
