    # # Assignment


    We''ve learned how to change the contents of the status bar of a window we''ve
    opened using JavaScript:

    var my_window = window.open("http://www.nostarch.com","my_window");

    my_window.status = "I''m in the new window''s status bar";

    We can use a similar technique to swap an image in another window, we''ve opened
    using JavaScript. Remember, the code to swap an image looks like this, where `the_image`
    is the name of an image on the main page.

    window.document.src = "new_image.gif"

    To swap an image in another window, just replace `window` in the script with the
    name of the window containing the image.

