    # # Line-by-Line Analysis of Figure 10-15


    The invisible frames store the visitor''s answers as he or she moves from page
    to page. If you didn''t put the quiz in frames, the browser would forget the visitor''s
    answer each time it loaded new Web page. Here''s the invisible frame stores information.


    The first page in [Figure 10-15](Figure-10-15), frameset.html, sets up the frames
    as we have seen before, but with some changes. It describes two frames; the first
    takes up 100 percent of the window, making it seem as if the page had no second
    frame. We set `border`, which controls the thickness of the line between the two
    frames, to `0` to eliminate any trace of the invisible frame.


    The second frame contains another element: `resize`. This element allows the browser
    to prevent visitors from resizing the frames. Without it, a visitor might accidentally
    click on the bottom of the window and pull the hidden frame out. Putting `noresize`
    inside the frame tags prevents this from happening. Also note that the invisible
    frame, called `tracker`, holds the HTML page `secret_code.html`—this is where
    we store information. Because the frame is hidden, visitors cannot see the contents
    of `secret_code.html`.


    The next page, `secret_code.html`, holds the visitor''s answers in the `answers`
    array `[4]` and the scores at the quiz.


    The scoring function starts at `2`. This function creates an array `correct_answers`,
    which holds the correct answer and loops through the array. If the answers match,
    the script increments the variable `correct`. Once the script has checked all
    the answers, the function calculates what percentage the visitor got right and
    announces the score in an alert.


    The two quiz pages show how the script stores the visitor''s answers in the invisible
    frame and how it calls the `score()` function.'
