    # Using the Right Name: How Windows See Each Other


    Every window is a bit eccentric and thinks of itself as window. Let''s say you
    open a Web page titled "The Original". Now let''s say that window opens the window
    new_window.html (titled "The New Window") using JavaScript, like this:


    ```

    var new_window;

    window.open("new_window.html","new_window","height=100,width=100");

    These windows see each other in different ways. The original window is called
    new_window. The new window, however, thinks of itself as window. This means if
    you want to close the new window using JavaScript inside the original window,
    you''d write this code:

    new_window.close();

    But to close the new window using JavaScript inside the new window, you''d write
    the following in new_window.html:

    window.close();

    ```


    This window center is one of the aspects of object-oriented programming that makes
    it interesting. It''s like dealing with distinct individuals who have different
    perspectives on the world.


    +   **Note** Unless an event triggers them (as in Figure 5-8), the new_window.close()
    and window.close() close the corresponding (new_window and window respectively)
    immediately after the window opens.


