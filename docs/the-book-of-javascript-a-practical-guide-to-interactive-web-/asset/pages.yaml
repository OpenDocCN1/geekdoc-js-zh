  md: "However, it is not a good idea to write a line in this: There's too much JavaScript\
    \ in the HTML. Excessive JavaScript makes HTML hard to follow, even for people\
    \ who know JavaScript. Furthermore, if you want two or three lines on your page,\
    \ your HTML becomes uglier and your page's download time increases. Moreover,\
    \ if you want to change the window size or centering, you have to make the change\
    \ everywhere you put the code.\n\nThe solution to these problems is to give all\
    \ the JavaScript in Figure 6-1 a name, simply call that name when you want to\
    \ open and center a window. That's exactly what home-made functions are for: They\
    \ allow you to call a set of JavaScript lines (the function) with just a name.\n\
    \n# Basic Structure of JavaScript Functions\n\nFigure 6-2 shows the skeleton of\
    \ a home-made function.\n\n```\nfunction functionName()\n{\n  a line of JavaScript;\n\
    \  another line of JavaScript;\n  more lines of JavaScript;\n}\n```\n\n**Figure\
    \ 6-2:** The basic structure of a home-made function. When JavaScript sees that\
    \ word, it knows you're about to define a bunch of JavaScript as a function.\n\
    \n# Naming Your Functions\n\nNext comes the function name. The rules for naming\
    \ a function are similar to those for naming a variable. The first character must\
    \ be a letter; the rest of the characters can include letters, numbers, dashes,\
    \ and underscores. No other characters will work, including spaces. Like variables,\
    \ function names are case sensitive, so a function called `feedCat()` is different\
    \ from a function called `FeedCat()`.\n\nMake sure you give a function and a variable\
    \ the same name. If you have a variable named `my_cat` and a function named `myCat`,\
    \ JavaScript will forget the first's supposed to be or what value you've stored\
    \ in the `my_cat` variable. This weird feat, caused by the case sensitivity of\
    \ function names, means that makes sense to have a different convention for naming\
    \ functions than for variables. The convention I use for variables is lowercase\
    \ with underscores, and for functions I what's called in-caps notation. Names\
    \ following an in-caps notation are strings of words without spaces, with every\
    \ word except the first-capitalized as in `myCat`, `openCenterWindow()`, and `printDate()`.\
    \ In-caps is a pretty common convention, and should serve you well.\n\n# Parentheses\
    \ and Curly Brackets\n\nA pair of parentheses follows the function name. For now,\
    \ you won't be entering anything between them, but they're still necessary.\n\n\
    After the parentheses you need a pair of curly brackets containing the JavaScript\
    \ which will run when the function is called.\n\n# An Example of a Simple Function\n\
    \nFigure 6-3 shows how the window centering code in Figure 5-13 on page 89 would\
    \ look rewritten as a Web page containing a function."
