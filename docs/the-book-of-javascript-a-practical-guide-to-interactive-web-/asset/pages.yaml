    # ## Triggering Events


    So far all the JavaScript we''ve seen triggered when a Web page loads into a browser.
    But JavaScript can also be **event-driven.**


    Event-driven JavaScript waits for your visitor to take a particular action, such
    as mousing over an image, it reacts. The key to coding event-driven JavaScript
    is to know the names of events and how to use them.


    # ## Event Types


    With JavaScript''s, different parts of your Web page can detect different events.
    For example, a pull-down menu can know when it has changed (see [Chapter 7]);
    a window when it has closed (see [Chapter 5]); and a link when a visitor has clicked
    on it. In this chapter I''ll focus on link events.'
