    In the above example, storing two cookies in document.cookie works because the
    JavaScript that looks at information doesn''t have to deal with the information
    in the other cookie. Unfortunately, it''s a bit difficult to pull the contents
    of a cookie out of document.cookie because it contains multiple cookies. Here''s
    where prewritten JavaScript libraries come in.


