    # Chapter 9: Timing Events


    # Overview


    Precise timing of events on your Web pages transforms them from static documents
    to true multimedia applications. If you can time events, you can pause slide shows,
    timed games, and control when visitors perform different actions. In later chapters
    we''ll show how events can animate your entire site.


    In this chapter, you will learn to:


    +   - Control events when happens on your Web page.

    - Build clocks that update in real time.

    - Create slide shows that move at whatever pace you want.


    # Real-World Examples of Timing Events


    We''ve already seen few examples of Web pages using Timing event. In the last
    chapter, we saw how Jeevees presents with a new query every 5 seconds. NASA''s
    space shuttle page at http://spaceflight.nasa.gov shows another example of timing
    on a Web page. As shown in Figure 9-1, NASA has one clock on its page that counts
    down to the next Space Shuttle launch and another clock that shows how long the
    space station has been in orbit. These clocks update once per second.'
