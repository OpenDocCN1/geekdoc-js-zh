    hello<br>\");\n}\n```\n\n**Figure 8-10:** Comparing a while loop and a for loop\n\
    \nBoth of the loops in Figure 8-10 write the word hello to a Web page ten times.\
    \ The main difference between them is that it has 2, and 2 in the while loop collapse\
    \ into 4 in the for loop. The format of a for loop is as follows:\n\n```\nfor\
    \ (initializer; increment);\n```\n\n```\n// some JavaScript\n```\n\nAll loops\
    \ start with the word for, followed by parentheses containing three values, separated\
    \ by semicolons. The first value is the loop's starting number. In all the previous\
    \ examples, we started them with var index = 0. In 4 of Figure 8-10, the first\
    \ value in the parentheses of the for loop is index = 0 (the same as 1 in the\
    \ while loop). The second value is the body of the for loop, which is the test.\
    \ In of Figure 8-10, the test is index < 10 (the same as 2 in the while loop).\
    \ The final value in the parentheses of the loop is the number to initialize the\
    \ variable each time the loop repeats (like 8 in the while loop). Whether you\
    \ use while or for loops is a matter of taste. You can write for loops in fewer\
    \ lines, while for loops are easier to read. Some people prefer for loops because\
    \ they lower the risk of accidentally getting into an infinite loop. In a while\
