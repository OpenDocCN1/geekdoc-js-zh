    # Figure 1-4: An HTML page with JavaScript


    The lines that start with two slashes // are JavaScript comments. The browser
    ignores any text that after two slashes. Comments are extremely important programming
    languages is just natural. The script you''re writing may make perfect sense when
    you''re writing it, but a few days later when you want to make a little modification,
    you might find just figuring out what you wrote the first time. If you change
    your code, you will save yourself the hassle of trying to remember what you were
    thinking when you wrote that bizarre code at 2 a.m. in the midst of what seemed
    like an amazing caffeine haze.


    # Dealing with Object Browsers


    There''s a slight problem with the JavaScript skeleton in Figure 1-4 (other than
    the fact it doesn''t really have any JavaScript in it); Netscape didn''t recognize
    the <script> tag version 2.0, so when a Netscape browser other than that will
    recognize the tag. When a browser sees an HTML tag it doesn''t understand, it
    ignores that tag. That''s generally a good thing. However, a browser that doesn''t
    understand JavaScript will write your lines of JavaScript to the browser as text.
    Figure 1-5 on page 10 shows what the JavaScript skeleton would look like in Figure
    1-4 in an order browser.


    ![](img/ac1d40986725f1dfb2866c1197da027c_10_0.png)


    Figure 1-5: What Figure 1-4 would look like in an order browser


    Hiding JavaScript from older Browsers

    For those who use browsers like Microsoft Internet Explorer 2.0 or MacWeb 0.9,
    it''s necessary to add the code in Figure 1-6, which hides your JavaScript from
    them.


    ```

    <script language="JavaScript">

    <!-- hide from older browsers


    // JavaScript goes here


    <!-- end hiding stuff -->

    </script>

    ```


    Figure 1-6: Hiding JavaScript from browsers that don''t understand it

    The important symbols are the <!-- code at and the // ---> and --> code as marking
    an entire These lines work because older browsers see the <!-- and --> as block
    of HTML comments, and just ignore everything between them. Luckily, browsers that
    understand JavaScript have different rules for HTML comments: They see'
  merge: -1
