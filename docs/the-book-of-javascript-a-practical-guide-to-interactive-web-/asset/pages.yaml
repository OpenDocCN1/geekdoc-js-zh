    # Hiding a div


    You can display or hide the contents of a div by either visible or hidden. The
    style puts the div in the lower center of the page and hides it.

    <div id="myFirstDiv" style="position:absolute; top:150; left:100; visibility:hidden">

    You can change the visibility of a div with JavaScript. Sometimes it makes sense
    to create a bunch of invisible divs and use JavaScript to make them appear when
    you need them. For example, you could make an entire section of HTML blink on
    and off by alternating hiding and showing.

    Later in the chapter, we talk about hierarchical merging, I''ll show you how to
    hide divs.


    # Layering divs


    Another feature of divs is that you can layer them on top of each other. For example,
    you could put an image of a maze in one div and an image of a maze in another,
    then put the div in the maze by moving the mouse on top of the maze div. Once
    you''ve done that, you can move the position of the mouse to make the maze look
    like it''s moving.

    To layer one div on top of another, set the div''s z-index. A div with a higher
    z-index appears on top of a div with a lower z-index. Figure 13-6 shows the code
    for a page with GIF (a white square) on top of another GIF (a black square). In
    Figure 13-7, the white GIF has a higher z-index, and in Figure 13-8, the black
    square has a higher z-index.


    ```

    <html><head><title>Layering divs</title></head>

    <body>

    <div id="whiteSquare" style="position:absolute; top:100; left:100; z-index:2">

    <img src="white.gif">

    </div>

    <div id="blackSquare" style="position:absolute; top:0; left:0; z-index:1">

    ```'
