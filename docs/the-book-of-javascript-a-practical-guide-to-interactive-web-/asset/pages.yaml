    she is using.


    # Netboost.com: A Real-World Example of Browser Detection


    Before we get into the details of browser detection and redirection, let''s take
    a look at a real-world example.

    Netboost (www.netboost.com), a company that sells software to high-end systems
    administrators, has a Web site (shown in Figure 3-1) that uses some tricky JavaScript
    and Dynamic HTML. Unfortunately, it works only in Internet Explorer 4.0, so Netboost
    needs to redirect visitors who have older browsers to a page that does not contain
    the problematic code. Netboost uses JavaScript to determine which browser a visitor
    is and redirects the visitor to the appropriate page, if necessary.


