    # Chapter 1: Welcome to JavaScript!


    Welcome to The Book of JavaScript. JavaScript is one of the fastest and easiest
    ways to make your Web site truly dynamic. If you want to spruce up-linked pages,
    you''ve got the right book.


    This book will give you ready-made JavaScripts you can implement immediately on
    your Web site, and it will take you step by step through sample scripts (both
    hypothetical and real-world examples) so you understand how JavaScript works.
    With this understanding, you can modify scripts to fit your specific needs as
    well as write scripts from scratch. Your knowledge of JavaScript will grow as
    you work through the book; each chapter introduces and explores in depth a new
    JavaScript by highlighting a real-life Web site that uses it.


    # Is JavaScript for You?


    If you want a quick, easy way to add interactivity to your Web site, if the thought
    of complex programs intimidates you, or if you''re simply interested in programming
    but don''t know where to start, JavaScript is for you.


    JavaScript, a programming language built into your Web browser, is one of the
    best ways to add interactivity to your Web site because it''s the only cross-browser
    language that works with Web browsers. Other languages, such as Java, Perl, and
    C, don''t have direct access to the images, forms, and windows that make up a
    page.


    JavaScript is also very easy to learn. You don''t need any special hardware or
    software, you don''t need access to a Web server, and you don''t need a degree
    in computer'
