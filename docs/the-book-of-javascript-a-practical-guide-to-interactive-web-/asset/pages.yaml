  md: 'The page quiz_1.html contains a form with two quiz questions and a link. Each
    quiz question is true or false; the visitor answers by clicking on the appropriate
    radio button. Clicking the True button in the first question runs the following
    code:

    parent.tracker.answers[0]=''true'';


    This line goes to the tracker in the parent (that is, the frame set) and stores
    the string ''true'' in the first slot (answers[0]) of the array. Clicking on the
    False button on the second question runs the following code, then stores the string
    ''false'' in the second slot of the answers array:

    parent.tracker.answers[1]=false;


    Clicking on the link reads the new page, quiz_2.html, into the visible frame.
    However, the iframe stays around, storing the values from the last page. It keeps
    the visitor''s answers to two questions on the third and fourth slots in the answers
    array. Clicking on the "score" button at 7 calls the following code:

    parent.tracker.score(parent.tracker.answers);


    This line invokes the score() function inside the tracker frame. The function
    takes an array of the visitor''s answers as parameter. Because the tracker frame
    stores the answers, the script can pass the score to the function frame by referring
    to parent.tracker.answers.


    This example practices every major element of programming this book has covered
    to date, so take a long to look at it and make sure you understand everything''s
    going on: I introduced two new concepts:


    +   - One frame refers to a variable stored in another frame with parent.other_frame.variable
    (as in parent.tracker.answers).

    - One frame calls a function declared in another frame with parent.other_frame.function()
    (as in parent.tracker.score()).


