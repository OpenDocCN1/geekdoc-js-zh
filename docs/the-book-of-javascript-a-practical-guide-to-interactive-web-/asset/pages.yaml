  md: '# Moving Windows to the Front and Back of the Screen


    Once you have opened a window, you can do more than just close it. You can move
    it to the front of the screen (on top of the other windows) or to the back of
    the screen (behind all other windows). The focus() method brings a window forward,
    and blur() puts the window back. The focus() method is especially useful when
    you have a window you always want to appear at the front of the screen. For example,
    if Salon wanted its window to appear over the other page, it could make all the
    links using this technique:


    ```

    <a href="#OnClick="pictures = window.open(''http://www.salon.com/pass/1999/02/bugs/frame.html'',
    ''pictures'',''width=605,height=350''); pictures.focus(); return false;">Portfolio
    of pictures</a>

    ```


    This line opens the window and puts it at the front of back.


    **Note** Note that I didn''t wind back the pictures before I called open(). If
    you use a link, JavaScript will focus the name of the window before it executes
    the rest of the JavaScript commands on the onClick. The reason for this will be
    clearer if you read Chapter 6.


    The unfortunate hitch with focus() and blur() is that they don''t work in Netscape
    2 or Microsoft Internet Explorer 3, so you''ll have to use some browser detection
    if you don''t want your page to give error messages.


    # Window Properties


    So far we''ve seen several methods for the window object: open(), close(), focus(),
    and blur(). It has few other properties that come in hand from time to time.


    **The status Property** One of the most useful (and most abused) of these properties
    is the window''s status. This appears in the window''s status bar (see Figure
    5-4). One common status is the URL of a link you are moving over.


    You can use the status to change what appears in the status bar. You may have
    noticed that people put a kind of marquee in this area, scrolling across the bottom
    with messages like "Buy our stuff! Buy our stuff! I don''t want to encourage abuse,
    so I''m not going to teach you how to do that; but you could use JavaScript techniques
    to create the effect. To change what appears in the status bar of a window, use
    a body tag like:


    ```

    <body onload="window.status = hi there!">

    ```


    This tag tells JavaScript to change the contents of the window''s status bar after
    the page has been fully loaded into the browser. You may want to use the status
    to inform visitors what they''ll see if they click on a link. For example, if
    you have a link to a graphics-intensive site, the words "Warning, this has a lot
    of graphs in the status bar when the visitor moves over it. You can set this up
    onMouseOver:


    ```

    <a href="http://www.animation.com/" onMouseOver="window.status=''Warning''; return
    true;">Animation</a>

    ```


    Notice the return true after setting the window.status command. This is similar
    to the return false I put at the end of my onClick (see Chapter 4), and does almost
    the same thing. When the user enacts an onMouse, return true prevents the URL
    from appearing in the status bar. If you don''t put it there, the words "Warning,
    this has a lot of graphs" in the status bar; then the link''s quickly replaces
    them before the warning can be seen.'
