    # Setting an Alarm with setTimeout()


    Built-in JavaScript function setTimeout() tells JavaScript to run a JavaScript
    command at some time in the future. The function takes two parameters: a JavaScript
    command and the time (in milliseconds) to wait before running it. For example,
    the following line causes an alert box to pop up after a visitor has been for
    three seconds:


    setTimeout(alert("You have been on this page for 3 seconds!"), 3000);

    The first parameter contains the JavaScript statement to execute. This statement
    is between quotes and ends with a semicolon, just like all JavaScript statements.
    Notice that the string in the alert command is between single quotes rather than
    double quotes (see Chapter 4).

    The second parameter tells JavaScript to execute the first parameter in 3,000
    milliseconds, which is three seconds (1,000 milliseconds in a second). Figure
    9-2 puts in the context of a full Web page.


    ```

    <html>

    <head>

    <title>A Three-Second Alert</title>

    <script language = "JavaScript">

    <!-- hide me

    setTimeout(alert("You have been on this page for 3 seconds!"), 3000);

    // show me --></

    </script>

    </head>

    <body>

    ```'
