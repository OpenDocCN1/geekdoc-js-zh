    # # Chapter 4: Rollovers: Everyone''s Favorite JavaScript Trick


    # ## Overview


    You''ve seen rollovers million times. You mouse over an image, and the image changes.
    You mouse off, and the image changes back to its original state. Rollovers are
    an easy way to make your site more interactive.


    This chapter will show you how to create a good rollover by:


    +   • Telling JavaScript to do an image swap when a visitor moves over _an image.

    • Telling JavaScript which to swap.

    • Replacing the old image with a new one.


    I''ll also teach you a new way to detect how a visitor is using.


    The Civil Liberties Union has a relatively straightforward and uncommon implementation
    of rollovers in at www.acu.org (Figure 4-1). If you mouse over an image "The Issues,"
    a check appears next to that image (Figure 4-2). Mouse over the left column, and
    those images change as well (see Figure 4-3 on page 52)


