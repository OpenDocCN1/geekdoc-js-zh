    \ name=\"form_frame\">\n</frameset>\n</html>\n```\n\nFigure 10-12: The frame set\
    \ for Figure 10-11\n\n# JavaScript and Frames Inside Frames\n\nAs long as you\
    \ have only one frame, JavaScript in one frame can influence any other by referring\
    \ to it as `parent.frame`. Matters gets a bit more complicated if you have nested\
    \ frame sets. Consider frame 3 in Figure 10-11. The parent of this frame is the\
    \ inner frame set (`bottom_frame.html`) containing frames 2 and 3. The appropriate\
    \ JavaScript in frame 3 could influence frame 2 using `parent.image_frame`. For\
    \ example change the URL shown in frame 2, frame 3 could run the following script:\n\
    \n```\nparent.frame.location = \"http://www.webmoney.com\";\nHow can JavaScript\
    \ in frame 3 change the content of frame 1? The inner frame (which contains frames\
    \ 2 and 3) doesn't \"know\" anything about frame 1 because it's located in another\
    \ frame set. The outer frame set (`index.html`), however, \"know\" about frame\
    \ 1 and the inner frame set it created. In order for a frame in the inner frame\
    \ set to affect a frame in the outer frame set, the outer frame set must ask the\
    \ inner to change the content. In this case, you could achieve this by calling\
    \ `parent.top`\n```\n\n```\nparent.top.location = \"http://www.webmoney.com\"\
    ;\nRunning this in frame 3 changes the URL in frame 1. The line in frame 3 tells\
    \ JavaScript to go to frame 3's `parent`, the inner frame set; find that frame's\
    \ `parent`, the frame in frameset.html; and then find the frame `top_frame` inside\
    \ that parent frame set.\n```\n\nAlternatively, you can refer directly to the\
    \ outermost frame set by using the word `top` in your script:\n\ntop.navigate.location\
    \ = \"http://www.webmoney.com\";\nThis tells JavaScript to find the topmost frame\
    \ set and look for the frame named `navigate` inside that frame set. The `top`\
    \ object contains everything in the Web browser window, if there are frame sets\
    \ on the page, `top` refers to the outermost frame set. If there are no frames\
    \ in the browser, `top` means the same thing as `window`.\nWhether you use `top`\
    \ or `parent` to deal with nested frame sets depends on the circumstances. If\
    \ you have a link in a frame buried four frame sets deep that you want to affect\
    \ a frame on the top level, using `top` probably makes sense. If you want the\
    \ link in the linked frame set to affect a frame in its own frame set, `parent`\
    \ is the way to go.\n\n# Frame Busting\n\nSome sites use frames to change their\
    \ site after you try to leave it. For example, when you do a search on Ask Jeeves\
    \ and click on a result, the result appears on a page that has Ask Jeeves in the\
    \ upper frame (see Figure 10-13). The result site is generally not an Ask Jeeves\
    \ site. It might even be a Web page you've written."
