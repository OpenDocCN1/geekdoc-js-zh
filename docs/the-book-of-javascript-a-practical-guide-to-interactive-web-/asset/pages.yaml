    **Figure 7-4:** Code for the basic HTML form in Figure 7-3

    Notice that the form is constructed of normal HTML. Like most HTML, the form must
    go between the <body> and </body> tags. The form begins with a <form> tag and
    ends with a </form>. Inside the form you''ll see the elements in 2 and 3, that
    hold information. In this chapter, you''ll encounter a variety of different elements,
    each with special characteristics. The elements in 2 and 3 are called text fields.
    These allow the user to type name of text in a field. Later you''ll learn how
    JavaScript reads the user''s input.


    The part of <input type="text"> tells the browser to draw a text field.

    The words before the input, as well the <br> after it, are normal HTML. The input
    itself tells the browser to create an input field of text. You can embellish the
    text field by attribute, you can make the text box bigger by setting its size:


    ```

    <input type="text" size="40">

    The size of the text field is roughly equal to the number of characters that can
    fit inside the field.

    You can also tell the browser to place words in the text box. For example, if
    you want the words your name in here to appear inside the text box, enter this:

    <input type="text" value="type your name in here">

    ```


    By setting the value of the text box, you determine what goes inside it. Remember
    the term value—it will come in handy later.'
