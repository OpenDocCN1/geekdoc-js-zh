    # Use Two Equal Signs in if-then Statements


    You must use two equal signs when you want, JavaScript to see if things are the
    same in an if-then statement. Accidentally using one equal sign inside an if-then
    statement is probably the mighty cause of mind-blowing programming errors. If
    you accidentally use one equal sign, JavaScript thinks you mean to set the variable
    on the left of the equal sign to whatever is on the right of the equal sign, and
    it will act as if the test result is always true. Here is an example of the mistake
    that can cause. Let''s say you want to write a JavaScript that puts "Happy Birthday,
    Mom! on your Web page when it''s your mother''s birthday. Say her birthday is
