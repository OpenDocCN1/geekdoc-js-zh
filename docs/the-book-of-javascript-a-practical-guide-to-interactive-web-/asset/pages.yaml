    your scripts. This chapter covers a few debugging tips and safe coding practices
    that will make this process easy.


    # Debugging Techniques


    The more you practice JavaScript, the more you''ll understand the sometimes opaque
    error messages JavaScript gives you—and the fewer errors you''ll introduce in
    your code. Programming is definitely a skill that improves dramatically over time,
    and learning how to debug efficiently is one of the biggest factors in that process.
    This section covers common debugging tips and techniques to decrease the number
    of bugs in your scripts and help you figure out why your program isn''t doing
    what you want to:


    +   - How to use and interpret your JavaScript bug detector.

    - How to print out variables in various ways.

    - How to watch for common mistakes.

    - What to think about before start coding.


    # Your Browser''s Built-in Debugger


    If you''ve been trying the examples and the assignments as you''ve gone along,
    you''ve no doubt encountered your browser''s debugger. When you''re making a coding
    mistake, running in your browser often results in a window that describes the
    error. Some browsers, like IE 5.0 and above, you''re up by printing an error icon
    at the bottom left of the window. Clicking on the error icon opens a window that
    describes the error. Other browsers, like Netscape 4.0, may not show errors at
    all instead have a console that displays errors. To see the console, type `javascript:`
    in the location box of your browser.


    Sometimes you may find the JavaScript error messages helpful, other other times
    they may seem confusing. All you can do is read the message to see if you understand
    it. If not, try some of the following debugging techniques.'
