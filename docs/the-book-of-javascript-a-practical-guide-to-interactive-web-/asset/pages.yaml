    CSS you can easily place a GIF in the center of your page or a block of text in
    the lower right corner. Unfortunately, CSS didn''t make it into Netscape and Microsoft
    Internet Explorer version 4.0, so our browsers wont understand CSS positioning
    instructions. Perhaps even worse, these browsers implement CSS differently, making
    it somewhat difficult to use. However, CSS basics work similar in both browsers.


    # # The div tag


    Before you position any HTML, you have to use the `<div>` and `</div>` tags to
