  md: "# if-then Statements\n\nNow you know what browser your visitor is using and\
    \ how to redirect him or her. Next, you need to find out how to tell JavaScript\
    \ which page to send someone to. To redirect Web pages based on what browser you\
    \ have, you tell JavaScript something like: \"If the visitor is Netscape, then\
    \ send them to the Netscape-tailed page.\" In JavaScript, an if-then statement\
    \ looks like this:\n\n```\nif (navigator.appName == \"Netscape\") {\n  // send\
    \ them to the netscape page\n  window.location = \"netscape_page.html\";\n}\n\
    ```\n\nHere's the basic structure of an if-then statement:\n\n+   - statement_1:\n\
    - statement_2:\n- statement_3:\n\nJavaScript is unforgiving: if that must be lowercase,\
    \ and you must put parentheses around the test that follows it. The statement\
    \ that appears between the parentheses is either true or false. If navigator.appName\
    \ equals \"Netscape\", the statement between the parentheses is true, and the\
    \ statements located between the curly brackets are executed. If navigator.appName\
    \ doesn't equal \"Netscape\", the statement between the curly brackets aren't\
    \ executed.\n\nNote\n\n# Booleans\n\nThe statement in the parentheses after if\
    \ is a Boolean statement—one that is either true or false. There are many types\
    \ of Boolean statements. Table 3-1 lists the major ones you'll be using.\n\nTable\
    \ 3-1: Boolean statements\n\n| Test | Meaning | Example (all of these are true)\
    \ |\n|---|---|---|n| < | Less than | 1 < 3 |\n| > | Greater than | 3 > 1 |\n|\
    \ == | The same as (equal) | \"happy\" =\n\"happy\", \n3 = 3 |\n| != | Different\
    \ from (not equal) | \"happy\" !=\n\"crabby\", \n3 = 2 |"
