    # What are Cookies?


    Cookies are bits of information that a site leaves on the hard drive of visitors.
    Because the information ends up on the hard drive, it remains after they leave
    the current page and even after they turn the computer off. This little feature
    extremely useful when you want to remember information about a user each time
    he she visits your site. Cookies were introduced in Netscape 2.0 and Microsoft
    Explorer 3.0. Unfortunately, MSI 3.0 offers a less-than-perfect implementation:
    While you can save cookies and read information on other'' computers, you can''t
    save cookies to your own computer. This means you can''t test your cookie code
    in MSI 3.0. If you''re still using MSI 3.0, it''s probably time to update your
    browser to a more recent version or switch to Netscape.


    You can see the cookies saved on your computer by looking for the cookies for
    Netscape or the cookies for MSI. In either case, you''ll see a long list of site
    names, each with a string of text. The text might seem incomprehensible to you
    since most sites encrypt cookies in some way to pack more information into them.
    But a look to see what these little left on your system—you''ll find it very educational.


    # What Cookies Can and Can''t Do


    Cookies involve writing and reading from visitors'' hard drives, dealing lots
    of security issues. As a result, using cookies has many limitations. The most
    important ones for the purposes of this chapter are:


    +   - Not everyone has a cookie-friendly browser.'
