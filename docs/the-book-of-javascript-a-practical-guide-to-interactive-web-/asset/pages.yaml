  md: "# Cookie Libraries\n\nYou'll find many free cookie libraries on the Web. Just\
    \ use any search engine and search for javascript cookie to get a list. The functions\
    \ in the libraries generally come ready to run, so you can just cut and paste\
    \ them into Web pages. Webmonkey has exceptionally well-commented libraries, so\
    \ we'll use his code. You can find more of Webmonkey's free JavaScript code at\n\
    \nhttp://hotwired.com/webmonkey/programming/javascript/code_library.\n\nWebmonkey's\
    \ Code for Accessing Multiple Cookies\n\nFigure 12-9 shows Webmonkey's code for\
    \ accessing one cookie when document.cookie is storing multiple cookies.\n\n```\n\
    function WM_readCookie(name) {\n\nif(document.cookie == \"\") { // there's no\
    \ cookie, so go no further\n\n    return false;\n\n} else { // there is a cookie\n\
    \nvar firstChar,lastChar;\n\nvar theBigCookie = document.cookie;\n\nvar firstChar=theBigCookie.indexOf(name);\
    \ // find the start of 'name'\n\nvar NN2Hack = firstChar + name.length;\n\n{//\
    \ if you found the cookie\n\nif((firstChar != -1) && (theBigCookie.charAt(NN2Hack)\
    \ == '=')\n\nfirstChar += name.length + 1; // skip 'name' and '='\n\n//Find the\
    \ end of the value string (the next ';').\n\nlastChar = theBigCookie.indexOf(';',\
    \ firstChar);\n\nif(lastChar==-1) lastChar=theBigCookie.length;\n\n    return\
    \ unescape(theBigCookie.substring(firstChar, lastChar));\n} else { // If there\
    \ was no cookie of that name, return false.\n\n    return false;\n\n}\n\n// WM_readCookie\n\
    ```\n\n**Figure 12-9:** Reading one cookie from document.cookie\nTo use these\
    \ functions, cut and paste them into the page and call the functions appropriately.\
    \ To retrieve a cookie named thisuser, call the function `WM_readCookie(\"thisuser\"\
    )`.\n\nWebmonkey's well-commented functions speak for themselves. If you use these,\
