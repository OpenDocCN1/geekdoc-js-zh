    **Line-by-Line Analysis of Figure 13**

    A hierarchical menu has a div for each menu option. The nine divs in Figure 13-16
    include one div for each top-level menu element, one for each submenu, one for
    the top border of the menu, one for the border, and for the right border. Each
    time a visitor moves over one of the menu options, the submenu matching the list
    record is shown. If the mouse moves over Cats, matching the list of cats visible,
    and then moves over Dogs, the closeAll() function hides the submenus and changeDiv()
    displays the submenus. Moving over the top, or right border calls all the submenus.


    # **The closeAll() Function**


    The closeAll() function loops through the array of divs defined at 1. Each time
    through the loop at 5 closeAll() calls the changeDiv() function to hide one of
    the divs.'
