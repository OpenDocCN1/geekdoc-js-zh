    # Chapter 12: Cookies


    # Overview


    It''s often helpful to remember a little bit of information about a visitor after
    he or she has left your site: a log-in name, the last time the visitor visited,
    or, if you have a shopping site, the visitor made. To remember this information,
    you will have to save it somewhere.


    Chapter 10 shows how you used frames to create a shopping cart. Unfortunately,
    this method does not retain the information the visitor entered after closing
    the browser. Cookies provide a solution to this problem: They let you save information
    on your visitor''s computer for a specified length of time.


    Cookies aren''t hard to use, but the code for saving and retrieving them can pose
    quite a challenge. You can use cookies for everyone''s code (ill point out some
    cookie libraries), but it''s a good idea to know how cookies work so you can alter
    the code from libraries to suit your needs.


    In this chapter you''ll learn:


    +   • What cookies are.

    • What you can and can''t do with them.

    • How to set a cookie.

    • How to read a cookie you''ve set.

    • How to remember names and dates with cookies.

    • How to build a basic shopping cart with cookies.

    • Where to get prewritten cookie code.


    # A Real-World Example of Cookies


    Cookies are used in all sorts of applications. A common use is to determine whether
    a visitor has seen a page before. For example, the first time you visit http_of.javascript.tripod.com/survey.html,
    you''ll receive a survey to fill out. After you''ve seen the survey, you''ll never
    see it again, because the page stores a cookie on your computer to record that
    first visit. Every time you visit the page, the page checks to see if you have
    the cookie; if you do, it won''t give you the survey.'
