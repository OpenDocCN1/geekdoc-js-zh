    # ### What''s with All the Dots?


    You may wonder why JavaScript refers to my_image as window.document.my_image,
    and not just as my_image. You may also wonder why you would use when you want
    to change the src of image. In short, what''s with all the dots?


    The answer has to do with how your browser looks at your Web page.

    Figure 4-15 shows the hierarchical organization of a Web page as JavaScript understands
    it—through the document object model (DOM). At the top of the window contains
    the Web page you''re viewing. That window contains the document, navigator, and
    location objects. Each of these objects has a lot of information in it, and by
    changing one you can change what happens on your Web page.'
