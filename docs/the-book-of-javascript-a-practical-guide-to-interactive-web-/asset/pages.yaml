    \ the quiz into several pages—the second page can keep track of what answers the\
    \ visitor gives on the first page.\n\nThere are few ways around this problem.\
    \ If you want to store the information for a long time on your visitor's computer,\
    \ cookies are the way to go (see [Chapter 12](#)). But if you only want to save\
