    # ## Overview


    Even with the advent of JavaScript, CGI scripting is an important way to add interactivity
    to a Web page. Used in conjunction with JavaScript, CGI scripts can run more quickly
    and give your visitors a better experience of your site. One of the most common
    ways to use JavaScript with CGI is as *form validator*. Making sure visitors have
    filled out a form correctly before sending it to a CGI script speeds up the process
    by cutting down the number of times they have to submit forms to your Web server.


    In this chapter you''ll learn to:


    +   - Make sure visitors fill out HTML forms correctly.

    - Make sure they have formatted strings (for example, email addresses) correctly.'
