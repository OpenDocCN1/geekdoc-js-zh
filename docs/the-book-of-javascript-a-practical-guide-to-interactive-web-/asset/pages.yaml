    There''s an art to figuring out how to use a function and knowing the best way
    to write one. In general, the best time to use a function is for a simple task
    you need to execute more than once. For example, patching the YZK bug in JavaScript
    you''ll probably have to deprototype, so it''s a good idea to create a function
    to handle it. As we see more complicated examples of JavaScript later in the book,
    you''ll get a sense of what should go into functions. And, of course, as you view
    the source code on all the Great pages you''ll see how various JavaScript use
    functions


    Almost all complicated JavaScript use at least one-made function. In this chapter,
    you''ve seen how to write simple functions with no parameters and more complicated
    functions that take parameters and return values. If you found all of this bit
    tricky, don''t worry. You''ll have many more opportunities to learn how to use
    functions in JavaScript.


