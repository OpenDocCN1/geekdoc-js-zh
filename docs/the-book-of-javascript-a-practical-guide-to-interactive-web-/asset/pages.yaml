  md: 'An alternative to window.move() is window.moveTo(). If you want to move a window
    5 pixels to the right and 10 pixels down from its current position, you''d type:

    window.moveBy(5,10);


    The first number is the number of pixels to the right you want to move the window,
    and the second number is the number of pixels down. If you want to move the window
    10 pixels and up to 5 to the left, use negative numbers:

    window.moveBy(-5,-10);


    # Don’t Move the Visitor’s Screen


    Be careful not to move a window entirely off a user''s screen. To ensure this
    possibility, you have to know the size of the user''s screen. The two properties
    that indicate this are:


    window.screen.availHeight

    window.screen.availWidth


    [Figure 5-13]() shows how you can use window.screen.availHeight and window.screen.availWidth
    to move a window to the center of the screen. This script centers the window on
    any screen, regardless of its size.


    ```

    <html>

    <head>

    <title>Center Window</title>

    <script language="JavaScript">

    <!-- hide me from older browsers -->


    // set some variables

    var window_height = 200;

    var window_width = 200;

    // make the window smallish

    window.resizeTo(window_height,window_width);

    // find out how big the screen is

    var height = window.screen.availHeight;

    var width = window.screen.availWidth;

    // get the left position

    // it''ll be half of the screen, minus

    // half of the width

    var left_point = parseInt(width / 2) - parseInt(window_width / 2);

    // get the top position

    // similar calculation as the left position

    top_point = parseInt(height/2) - parseInt(window_height / 2);

    // now, move the window

    //

    window.moveTo(left_point, top_point);


    // show me -->

    ```'
