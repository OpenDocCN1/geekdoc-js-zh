    # # Foreword


    I learned JavaScript completely on my own. There was no one to tell me about "event
    handlers" or how to set cookies. No one explained what variable is, let alone
    the best ways to use them. Of course I had reference books, but they were intimidating
    tones, full of cryptic lists, written by programmers. David Thau is a remarkable
    combination of natural teacher and seasoned programmer. As a result, The Book
    of JavaScript not teaches JavaScript thoroughly and enjoyably in a friendly, unintimidating
    tone, but it teaches programming as elegantly as any book I''ve ever seen. In
    fact, I''ve always thought of this Thau''s ulterior motive—he pretends he''s just
    showing you how to make a roller or validate the text in an HTML form, but before
    you''ve learned how to code


    Perhaps the best thing I can say is, reading this book, I can''t help but I was
    learning JavaScript for the first time. If you are, consider yourself lucky to
    have Thau as a teacher. You couldn''t do better.


    Happy JavaScript!

    Nadav Savoy


    # # Preface


    You are about to begin a journey through JavaScript—a programming language that
    adds interactivity and spark to Web pages all the Internet. This book, written
    primarily for beginners, provides you code to copy and paste into your Web site,
    but also makes sure you understand how they work so you can write your own scripts.
    Each chapter in the book focuses on a few important features, shows how professional
    websites use them, and then provides examples of how you might add those to your
    own website.

    Before you dive in, there is a quick overview of what you''ll learn as you make
    your way through The Book of JavaScript.:


    +   - Chapter 1 shows out the book''s goals, describes JavaScript and compares
    it with other tools, the many ways which JavaScript can enhance your Web pages,
    and takes you through writing your first JavaScript.

    - Chapter 2 describes how JavaScript works what it is and what it writes to a
    page Along the way you learn how JavaScript remembers things using variables and
    performs actions using functions.

    - Chapter 3 shows you to create a Web page specifically designed for his or her
    browser. This involves figuring out what the visitor is looking, making a decision
    based on information using if-then statements and their.

    - Chapter 4 covers that JavaScript trick—an image swap. You''ll also learn how
    to trigger JavaScript based on a viewer''s actions.

    - Chapter 5 tells you everything you need to know about opening new browser windows—the
    second-favorite JavaScript trick. You''ll also learn how JavaScript writes HTML
    to the new windows, closes them, and moves them around screen.'
