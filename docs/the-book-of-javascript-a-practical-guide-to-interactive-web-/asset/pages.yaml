    # while Loops


    One of kind is called a while loop. In English, this translates to "While such-and-is
    is true, do these lines." Figure 8-7 on page 150 shows a while loop that prints
    the word happy three times.


    Loops are a very common programming technique. They may seem strange the first
    couple of times you see them, but they are so common that after a while you''ll
    understand them on sight.

    The typical while loop starts with a variable set to zero, as in Figure 8-7s 1
    The variable index is just like any other variable.


    ```

    <html>

    <head>

    <title>I''m Happy and I Know It</title>

    </head>

    <body>

    I''m <br>

    <script language = "JavaScript">

    <!-- hide me

    (1) var index = 0;

    (2) while (index < 3)

    (3) {

    (4) window.document.writeln("<br>");

    (5) index = index + 1;

    (6)

    } // show me --

    </script>

    and know it!

    </body>

    </html>

    ```


    **Figure 8-7**: Printing the word three times with a while loop

    Once you''ve set the variable, the while loop begins. The ② reads, "While the
    index is less than three, execute the JavaScript between the curly braces and
    "

    The format of this line is important. The word while must be lowercase and the
    boolean test index < 3 must fall between parentheses.

    When JavaScript sees ② it checks whether the variable index is less than three.
    If it is, the script runs the lines between the curly braces ⑨ and ⑧. When we
    start, index is zero.'
