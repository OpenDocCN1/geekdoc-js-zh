  md: 'everything from <- to the end of that line as a comment, not the whole block
    between [1] and [2], so we won''t ignore the JavaScript. The words in the tags
    ("hide me from older browsers" and "end hiding") aren''t important. You can make
    whatever you want, or just leave them out. It is the <- and --> tags that are
    important.


    Frankly, it is a bit tough to understand. If you''re having trouble wrapping your
    mind around it, don''t worry—just remember to put the <- tag on its own line right
    after <script> and the // tag on its own line before </script>, and people with
    older browsers will thank you.


    # Your First JavaScript


    It''s time to run your first JavaScript program. I will explain the code in Figure
    1-7 in the next chapter, so for now just put the code into your text editor, save
    it as my_first_program.html, and run it in your browser. If you don''t want to
    type it all in, run the example from the CD-ROM under chapter01/fig-7.html.


    ```

    <html>

    <head>

    <title>JavaScript Skeleton</title>

    </head>

    <body>

    <script language="JavaScript">

    <!-- hide this from older browsers

    // say hello world!

    [1] alert("hello world!");

    // end hiding comment -->

    </script>

    </body>

    </html>

    ```


