    Beyond learning to write your own JavaScript and read other people''s scripts,
    I also want to learn where to look for additional information on JavaScript. The
    best place to learn new techniques is to view the source of a Web page you are
    finding. Several Web sites offer free JavaScript scripts. I''ll be introducing
