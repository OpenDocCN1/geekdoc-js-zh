    # # Fixing Bugs


    Once you''ve found where your bugs are, you need to fix them—and you have multiple
    options for this, both good and bad. This section covers a few things you should
    do when getting rid of bugs.


    # # Copy Your Program First


    Some bugs are really hard to get rid of. In fact, in the process of eradicating
    a little bug that''s driving your nuts, you end up destroying your entire program.
    It happens a lot, saving your program before you start to debug is the best way
    to ensure a bug doesn''t get the best of you.


    # # Fix One Bug at a Time


    If you have multiple bugs, fix one and test your fix before moving to the next
    bug. Fixing a lot at once increases the risk of adding even more bugs.


    # # Beware of Voodoo Coding


    Sometimes you bug exists, but you don''t really know why. Let''s say you have
    a variable called and for some reason index is 1 less than you should be. At this
    point you can do two things. You can sit there for a while and figure out why
    index is 1 less than it should be, or just shut it, add 1 to index before using
    it, and move on. The latter method is called voodoo programming. When you start
    thinking "What the hell? why index is 2 instead of 3? Well . . I''ll add 1 for
    now and fix it", you''re engaging in voodoo programming.


    Voodoo programming works in the short term, but eventually it will doom you. It''s
    like sweeping dust under a rug. The problem resurfaces—either you get another
    error you can''t figure out, or the poor soul next to you for your code it will
    be extremely hard to understand.


    Don''t practice voodoo coding.


    # # Look for Similar Bugs


    In some ways, the cut and paste code is the worst thing that ever happened to
    programmers. Often you''ll write JavaScript in one function, then cut and paste
    it into another function. If the first function has a problem, you have created
    problems two functions. I''m not saying you shouldn''t cut and paste—but keep
    in mind that bugs have a way of multiplying; if you find one bug, look for similar
    bugs elsewhere in your code. One bug that typically crops up in every JavaScript
    is a misspelled variable. If you missspell the_name as teh_name in one place,
    chances are you''ve done it somewhere else too.


    # # If All Else If


    You''re sitting staring at a bug and you can''t find what''s going on or how to
    fix it. Or maybe you can''t find the bug in the first place. The best thing to
    do is to walk away from your computer. Read a book and take a stroll around the
    corner. Get a tasty beverage. Do something—anything—but don''t think about the
    program or the problem. This technique is called incubation and it amazingly well.
    After you''ve had a little break and relaxed a bit, try finding the bug again.
    Often you''ll approach the'
