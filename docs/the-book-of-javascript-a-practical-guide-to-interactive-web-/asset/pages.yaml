    \n    var screen_height = window.screen.availHeight;\n    var screen_width = window.screen.availWidth;\n\
    \    var left_point = parseInt(screen_width / 2) - 100;\n    var top_point = parseInt(screen_height/2)\
    \ - 100;\n    the_window.moveTo(left_point,top_point);\n  }\n  return false;\"\
    >click on me to open a small centered window</a></a>\n```\n\n**Figure 6-1:** A\
    \ link that opens a small window and centers it in Netscape 4 and above"
