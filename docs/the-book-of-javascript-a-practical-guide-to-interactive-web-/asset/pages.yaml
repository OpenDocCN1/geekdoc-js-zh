    As you see, the style of the div tag has three components separated by semicolons.
    The position component gives the div a reference point (with position:absolute,
    the reference point is the browser window''s upper left corner). The top component
    determines how many pixels from the reference point the div appears, and the left
    component determines how many pixels to the reference point the div appears.

    Instead of positioning relative to the lower corner of the browser window, you
    can position it relative to where it would normally appear in the HTML. If you
    did not include any positioning information in the div, it would follow the line
    "This text is not inside a div." However, if you use the style shown on page 268
    but replace position:absolute with position:relative, the div appears 150 pixels
    below and 100 pixels to the right of that point. Figure 13-5 shows what this would
    look like.'
