    \ learn to:\n\n+   * Write your own functions.\n* Use-made functions to improve\
    \ your code.\n* Write functions that you can cut and paste into whatever you want.\n\
    \nWe'll be using home-made functions in every chapter from now on, so pay extra-close\
    \ attention to what's going on in this chapter. You will be glad you did.\n\n\
    # Functions as Shortcuts\n\nFunctions aren't anything new. You've already seen\
    \ a number of functions that come built into JavaScript. The alert() function,\
    \ for example, takes whatever text you put inside the parentheses and displays\
    \ an alert box with that. In its simplest form, a function is just a shorthand\
    \ name for a bunch of lines of JavaScript. When you call the alert() function,\
    \ JavaScript understands it as a command to carry out some task, such as opening\
    \ a little window with an OK button and a close button, and putting text in the\
    \ window.\n\nThe functions you create act as shorthand as well. Let's say you\
    \ want to write a link that opens a small window and centers on window when the\
    \ visitor is using Netscape 4.0 or above. (see Figure 5-13).\n\n```\n<a href=\"\
