    # The Document Object


    The document object lists all the items, links, forms, and other stuff on a Web
    page. To code an image, we must tell JavaScript to find the document object in
    the window, then locate the image we would like to change in the document object''s
    list, and finally change the image''s src. In JavaScript terms (where happy_gif
    is the image we''re swapping in), this is how it looks: window.document.my_src
    = "happy_gif";


    # Object Properties


    The object''s properties are the bits of information that describe the object,
    such as its height, width, and src (the name of the file that displays). Properties,
    like the src of an image, can be changed, and others can''t. As we''ve seen, changing
    the src property of an object changes which file is displayed: window.document.my_image_src
    = "happy_gif";


    Other properties, like the image''s height and width, are read-only and cannot
    be changed.


    +   - Each JavaScript object has its own set of properties. [Appendix B](#) for
    a list of the various objects and their properties.


