    \n# Figure 10-14: Frame-boosting code\n\nChecks to see if the page containing\
    \ this JavaScript is the top frame of the frame hierarchy (remember, **self**\
    \ means \"this page\") translates to \"If this page is not on top, perform the\
    \ statements between the checks by.\" If the frame is not on top, it is inside\
    \ an iframe frame. To escape the frame set, puts on top by setting the **top.location**\
    \ of the window to **self.location**. **self.location** stores the URL of a Web\
    \ page.\n\n# Using Frames to Store Information\n\nWeb pages have lousy memories.\
    \ Unless you do something fancy, the visitor leaves your Web page, and the page\
    \ forgets any information it has collected. For example, if you have a long quiz\
