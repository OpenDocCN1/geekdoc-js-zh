    # Chapter 10: Frames and Image Maps


    # Overview


    Frames and image maps are two of the fancier HTML tools available to Web developers.
    Frames divide a Web page into multiple sections and are useful for navigation
    and layout. Image maps contain multiple HTML links. Clicking on different parts
    of an image map directs your visitors to different Web pages. JavaScript can enhance
    both of these HTML features by allowing you to manipulate the contents of frames
    using image maps and links in other frames.


    In this chapter you''ll learn to:


    +   * Create basic maps.

    * Use JavaScript to control the contents of frames.

    * Use JavaScript to change two frames at once.

    * Use frames to share information between Web pages.

    * Create basic image maps.

    * Use JavaScript to add functionality to your image maps.


    # A Real-World Example of Frames and Image Maps


    My favorite example of integrating image maps, frames, and JavaScript comes from
    the Salon Web site. It presents a book about eating bugs (see Figure 10-1). (You
    can view this page at http://www.salon.com/wlist/part/1999/02/bugs/frame.html
    or on the CD-ROM in sites/salon/frame.html.) Mousing over the image map highlights
    that and swaps in two pictures, one of the insects people eat, and another of
    them preparing the insect for a meal.'
