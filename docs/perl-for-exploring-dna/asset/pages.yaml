    # 3.6.4 s: The Substitution Pattern Matching Operator


    ```

    /s/REPLACEMENT/[option]

    ```


    The substitution operator searches a given string for a PATTERN and replaces the
    characters in the PATTERN with those characters from the Replacement. This operator
    returns the number of substitutions. Of particular significance for this operator
    is that the PATTERN can be a regular expression (see chapter 4), this operator
    provides a rich set of possibilities for crafting patterns that you need to find
    and replace characters. Additionally, a number of options are available when performing
    substitution, including an ability to globally (g) replace all occurrences of
    the PATTERN or perform case-insensitive (i) pattern matching.


    Note that specific substitution will occur often when working larger Perl programs
    for each of the examples that follow, we assume a very specific context to keep
    the focus on learning how to use the substitution operator.


    The most straightforward substitutions are when you know the exact PATTERN you
    wish to replace. For example, perhaps you''d like to highlight the first start
    codon (ATG) from a sequence by making it appear in uppercase.


    # Good Practices


    Because the substitution (s) operator is a "destructive" operator—that is, it
    permanently alters the string—we make a copy of the original string prior to the
    substitution and then perform the substitution on the copy. It is often the case
    that you''ll want the original version making a copy and operating on the copy
    is a wise move.


    ```

    my $someGene; # upstream and beginning of a coding region

    my $copyGene = "coding copy of the region"

    $someGene = "ccgctataatgctgtcggccccta";

    print "Original: $someGene \n\n";n

    # highlight start codon

    $copyGene = $someGene;

    $copyGene -= s/atg/ATG/; # substitute upper for lower case

    print "Modified Start Codon: $copyGene \n\n";

    ```'
