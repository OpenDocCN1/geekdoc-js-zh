    # 6.8 Repetitional Control: Repeating Statements Over and with while


    Much of the same logic and syntax used in if-else statements can be used again
    in constructing while statements. The major difference between conditional (if-else)
    and repetitive control (while) is that while statements allow you to build a loop
    that cycles through a section of your program as many times as required. In short,
    while allows you to be relentless and thorough, while allows you to look through
    a long sequence of DNA (or entire genome) until something is found or you are
    satisfied that it is not there. (Note: The previous programs using only if-else
