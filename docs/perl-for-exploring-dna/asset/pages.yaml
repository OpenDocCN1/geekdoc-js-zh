  md: '# 10.1 The Convoluted Etymology and Use of Octothorpe and Its Many Synonyms


    From the very first Perl program, the symbol # has been used to designate the
    part of the program that is not read as code but contains comments in the programmer''s
    own words.


    The symbol # is sometimes called a hash, especially by programmers. And hash may
    be shortened to sh, as in the pronunciation of "sh bang" for #!, first symbols
    of a Perl program. (Note that "bang" charmingly refers to the exclamation point.)


    Of course, because # (hash) was selected as the comment indicator in Perl, it
    could not be employed as a symbol in building hash tables. For that, % comes into
    play. The symbol % also appears as a modulus operator among the arithmetic functions.
    These names have been researched by Michael Quinion for "World Wide Words," findable
    by an Internet search.


    The # is variously called


    +   - *Pound* because of its association with weight in pounds.

    - *Number*, perhaps related to its use for weight.

    - *Hash*, which may have been derived from a mispronunciation (from the 1970s)
    of hatch as cross-hatching or cutting with a hatchet, and this, too, is the derivation
    of hash table.

    - *Tic Toe* for its pattern.

    - *Crunch*, perhaps also-like.

    - *Square*, which was suggested as an international standard because it is easily
    translated into other languages.


    Octothorpe has to originated as a term from Bell Labs in the 1960s, although it
    did not appear in print until the mid-1970s. They were adding two new symbols
    to the telephone dial, the asterisk *, which renamed star, and the #, they called
    octothorpe. Octo is obviously for the eight points of figure. The suffix *thorpe*
    has a few explanations, the most likely of which may be this, recounted by a retiring
    Bell Labs scientist: Apparently at the same time there was a movement towards
    seeking a new name for the old pound sign, there was a movement towards the return
    of Jim Thorpe''s Olympic medals (after a disqualification) and a sympathetic Bell
    Labs employee commemorated the name in the newly coined jargon.


