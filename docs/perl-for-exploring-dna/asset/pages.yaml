    # printf("*VARIABLES)


    The printf function requires two arguments: (1) a format string that dictates
    the

    width and precision (for real numbers) to use for each of the values to be printed

    and (2) the variables that hold the values to be printed. Variables that hold

    integers are printed with a %d format, variables that hold strings are printed

    ith a %s format, and real numbers with a %f format. Each format

    letter (d, s, f) may also be preceded by an optional width (integer) that dictates

    t number of places to use when printing the value. A positive width means to

    print the value within the width right-justified and a negative width means to

    left-justified. In addition real number formats allow an additional

    option to indicate the number of places to print after the decimal point.

    The following table and example summarize the available formats and show some
    of

    more common uses.


    | When you need to format | In general | Example |

    |---|---|---|

    | real number | %<width>.<precision>f | %6.2f |

    | an integer | %<width>d | %8d |

    | a string | %<width>s | %25s |'
