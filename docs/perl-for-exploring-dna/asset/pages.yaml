    The next set of examples convert the full name for an organism (e.g., Escherichia
    coli K12) to the abbreviated genus name first followed by a period (e.g., E. coli
    K12). The first example assumes Escherichia coli specifically, and the latter
    examples use regex to handle the general case using the first letter in the genus
    name no matter what the name.


    ```

    my $fullName = "Escherichia coli K12";nmy $shortName = $fullName;


    $shortName -= s/Escherichia/E./;


    print "FullName: $fullName \n";nprint "Short name: $shortName \n";

    ```


    FullName: Escherichia coli K12

    Short name: E. coli K12


    Using a regex, we can produce a more powerful and general solution to this using
    only the first letter of the genus name as shown in the next example. The regex
    in the PATTERN


    ```

    s/(^(.)\S*(.*)/$1.$2/

    ```


    does follows: starting at the first letter (^), "save" or capture any initial
    character (.), ignore one more (+) of the remaining characters in this name that
    are not whitespace (\S), and then capture the remaining characters in the string
    (.*). (Note that match characters are not whitespace in regex is represented as
    backslash uppercase S; we would use lowercase S to mean "match any whitespace").nThe
    REPLACEMENT string, /$1.$2/, begins by recalling the captured pattern ($1), in
    this case pattern is the initial letter (.) of the genus name. This is followed
    by the insertion of a literal period, followed by the second captured pattern
    ($2), which is the remainder of the name (.*) beyond the genus name.'
