    # 4.8 Facing Page Translations


    Facing pages are often used to help readers translate between two different languages,
    for example, English text on the left-hand, even-numbered pages and the comparable
    French text on the right-hand odd-numbered pages. Here we introduce regular expression
    syntax in small doses, first applying regex to English text on the left and then
    applying that regex to DNA sequences on the right. Using regex to find patterns
    in English words is instantly gratifying. Applying the same regex to find patterns
    in motifs complements the power of simple pattern-matching syntax. Each pair of
    facing pages introducing new regex syntax with examples and questions is followed
    by an associated pair of pages with answers to the questions.'
