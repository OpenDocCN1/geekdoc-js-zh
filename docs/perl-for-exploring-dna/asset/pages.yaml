  md: '# 5.2.1 An Example Using log() and exp() : Finding

    The Likelihood of a Motif


    One of the tools that our genomics research group has built a motif lexicon or

    "DNA dictionary" (Dyer et al., 2004). The user selects a genome and enters a motif
    of

    interest, for instance, ACGT, and the motif returns a rich set of annotation

    that motif including all locations (bp), leafs to upstream and downstream\genes
    for each location, and introductory statistical information about the likelihood

    of finding this motif. The following example highlights the use of the mathematical

    functions log() and exp() in the context of computing how likely it is to find

    motif of interest when working with a specific A-C-G-T distribution.


    As shown in chapter 3, the translate (tr) function can be used to count the

    nucleotides in a sequence.


    ```

    # determine the length of the DNA sequence

    $sequenceLength = length($sequence)


    # find number of Adenines (A), etc...

    $numA = ($sequence =~ tr/A/A/)

    $numC = ($sequence =~ tr/C/C/)

    $numG = ($sequence =~ tr/G/G/)

    $numT = ($sequence =~ tr/T/T/)

