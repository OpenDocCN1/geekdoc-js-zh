  md: "# 12.4 Look-Ahead Assertions\n\nLook-ahead assertions allow the regex engine\
    \ to peek ahead into the string without advancing the current position (pos).\
    \ In the context of a string a while loop repeatedly attempts to find all occurrences\
    \ of a pattern within a string (using the /g global mode of regex), each time\
    \ the regex engine finds a match, the starting position for the next round of\
    \ searching is at the end of the previous match. At times, you need a way to know\
    \ what's ahead but still hold back the current position of the last match. In\
    \ previous examples where we (globally) find all matches, we compensate for the\
    \ fact that the current position of the regex engine is located after the last\
    \ match by subtracting the length of the pattern from the current position after\
    \ a match is found.\n\n```\n# the position after a match is at the end of the\
    \ match\nwhile ($dna ~ m/some regex pattern/g ) {\n    my $match = $1; # save\
    \ match\n    my $foundBP = pos($dna)-length($match);\n    print \"Found match\
    \ at bp $foundBP \\n\"\n}\n```\n\nIn situations when you cannot afford to move\
    \ beyond a certain point, the significance of the current position being at the\
    \ end of a matching string after a successful match becomes important. This is\
    \ not easy, so let's move to an example.\n\n# 12.4.1 Motivation for Negative Look\
    \ Ahead\n\nAssume we are searching a DNA coding sequence and are looking for two\
    \ specific consecutive codons: AAA (asparagine) followed by CGG (arginine). The\
    \ following while loop searches for and reports all patterns containing these\
    \ two codons.\n\n```\n# find AAA followed by CGG (e.g., AAACGG)\n$seq = \"ACCAACGAAACGGCTCAAACGGTAG\"\
    ;\nwhile ($seq ~ m/) {\n    AAA # Asparagine, followed by\nCGG # Arginine\n  \
    \  /xg\n    my $foundBP = pos($seq)-6; # 6 matched bp\n}\n```"
  merge: -1
  pgno: 240
