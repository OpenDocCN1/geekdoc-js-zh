  md: '# 5 Using Perl to Do Calculations


    In which some of the mysteries of calculating with Perl will be elucidated.


    > If you are almost correct you are a liability.

    —Fred Kollett


    Arithmetic in Perl is fairly intuitive in its use of symbols. There are all sorts
    of reasons for doing a little arithmetic on the fly in the midst of your Perl
    program. For example, you may wish to calculate:


    +   - percentages of As, Cs, Gs, and Ts

    - exact locations (such as starting base) of a sequence in respect to other sequences
    in a file

    - the probability that a particular string will appear, given a certain A:C:G:T
    ratio

    - conversions from one unit (nanometers) to another (Angstroms)

    - other applications that will appear in subsequent chapters on an as-needed basis.


    Note: Running statistical tests is an obvious application in bioinformatics, although
    we will not be making specific recommendations as to what statistical tests you
    need for your own analyses. Use a statistics book as a supplement. Perl provides
    you with the arithmetic you need to set up your equations.


    # 5.1 Arithmetic Operators


    Writing programs to perform mathematical operations is similar to using a hand-held
    calculator. Like a calculator, Perl includes the standard set of arithmetic operators—addition,
    subtraction, multiplication, and division—as well as additional functionality
    like exponentiation, modulo division, and a rich suite of mathematical functions
    (e.g., square root, absolute value, cosine, etc.). The syntax for the arithmetic
    symbols is what you might expect, although note the subtle changes such as the
    use of the asterisk symbol (*) for multiplication, the double asterisk for exponentiation
    (**), and the percent sign (%) for modulo division.'
  merge: -1
  pgno: 90
