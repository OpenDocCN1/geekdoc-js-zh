  md: '# Arrays 159


    Note that array subscripts begin with zero, the length of an array is always one
    larger than the subscript of the last cell in the array that is filled with data.
    The exact value of the subscript of the last element in the array can be obtained
    with $arrayName, for example, $bacteriaFilenames evaluates to the value of the
    subscript of the last element @bacteriaFilenames. For arrays that contain data,
    the last subscript in an array is always one less than the length of the array;
    this, the following example is true:


    ```

    scalar(@arrayName) == ($arrayName + 1)

    ```


    The following example manually fills a small array and shows an example of determining
    the length and ending subscript of an array.


    ```

    my @patronSaints; # an array of names of our "patron saints"

    @patronSaints = ("Chargaff", "Franklin", "Kent", "Wall");


    | Chargaff | Franklin | Kent | Wall |

    | 0 | 1 | 2 | 3 |


    my $lengthOfArray = scalar(@patronSaints);

    my $lastSubscript = $$patronSaints;

    print "The length of the array is: $lengthOfArray \n\n"

    print "The last subscript in the array is: $lastSubscript \n";

    ```


    ![](img/7faeba5fa4e60c11fd52ee03d48c0344_172_0.png)


