- img_proc: true
  md: '# Appendix 1

    How to Isolate DNA from Strawberries


    This is from the classic method for DNA isolation, for example, it was used by
    Franklin, Watson, and Crick when they isolated DNA for their X-ray analyses. Strawberries
    are an especially pleasant starting material. (Other procedures recommend beginning
    with a piece of thymus gland from a calf.) As a stringy, slimy molecule, DNA comes
    out of solution and displays itself as a gelatinous mass. This procedure is so
    easy that one of us (the biologist, of course) surreptitiously isolated some DNA
    (as a sort of demonstration for a computer science colleague) in a diner in downtown
    Worcester, Massachusetts, while eating breakfast.


    +   1. Cut up two strawberries and place them in a sealable plastic sandwich bag.

    2. Add about 100 ml (3/8 cup) of chilled extraction buffer (made of household
    ingredients):

    Extraction Buffer

    (keep in refrigerator) (for enough for three extractions)

    1/8 cup (33 ml) of simple shampoo (without condition)

    2/3 tsp (5 g) salt

    1 1/8 cup (300 ml) water

    The shampoo contains a detergent, sodium lauryl sulfate, which breaks apart cell
    membranes, and other cell contents. The salt helps make a solution that is similar
    in saltiness to the inside of cells.

    3. Seal the bag and squish the strawberries, being careful not to squirt the mixture
    from the bag.

    4. Pour the strawberry mixture cheese to remove the pulp.

    5. Pour the red liquid into a tall, narrow, clear vessel.

    6. Slowly pour about 50 ml (about 1/4 cup) of ice-cold ethanol down the side of
    the vessel to form a layer on top of the red liquid. (Keep the ethanol in the
    freezer until you are ready to use it.)

    For best results, use at least 90% alcohol. In some states, that can be purchased
    (by people over 21) as grain alcohol. Alternatively, you could ask a chemistry
    or biology teacher for 50 ml of denatured ethanol. It will contain methanol, rendering
    it Poisonous to drink.(That’s what “denatured” means in this context.) High-proof
    alcohols like vodka are actually not concentrated enough for optimal results.
    For example 150-proof vodka is only 75 percent alcohol.

    7. Notice the filmy DNA precipitating where the ethanol and red liquid are interfaced.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '+   8. Use a glass rod to gently spin DNA from the interface. (Alternatively
    you could use some kitchen item like a toothpick, however the use of the glass
    rod is classic.)


    +   9. Note the ready, mucousous nature of the DNA. If you touch the glob to the
    side of the glass and gently pull it away, you may catch a glimpse of a gossamer
    thread forming temporarily.


    +   10. When done, rinse all solutions down the sink and rinse glassware.


    # How About Other Starting Materials Besides Strawberries?


    Strawberries work well because they can be macerated by hand in a plastic bag.
    Bananas and kiwi fruit work, too. For tougher fruits and vegetables or fresh (or
    frozen) meat, you need to chop finely and then run through a blender. If you choose
    to try animal tissue (meat), the best choice is organ meat like liver or sweetbread
    (thymus), as fresh as possible or frozen.


    Source: Based on a procedure by Diane Sweeney, Pearson Education (carnegieinstitute.org).'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Appendix 2

    Bioinformatics as Part of the Solution


    Jane Margolis and Allan Fisher asked the difficult question of why there are so
    few women in computer science. The results of their study, focused mostly on the
    computer science department of Carnegie Mellon University are presented in Unlocking
    the Clubhouse (2002). The authors included a list of suggestions for enriching
    computer science assignments that they might be more broadly appealing to women,
    who (according to the study) are less attracted to more conventional programming
    problems. (We would add that a minority of men are attracted to computer science
    as well.) We noticed reading list of suggested enrichments that bioinformatics
    may be part of the solution. Our own approach to Perl has primarily centered on
    the joys of applications and the intriguing personalities and problems of bioinformatics.
    Therefore we are reprinting the list of Margolis and Fisher, shortened by us and
    including our own commentary (in parentheses) on the excellent fit of Perl and
    DNA sequence analysis.


    # Ways to Enrich a Programming Assignment

    (or Career in Computer Science)


    +   1. Make it useful, personal, or local. Make it socially relevant. Include
    observations of the real world. (That’s bioinformatics! All sorts of fascinating,
    practical problems in medicine, the environment, and evolution may be solved through
    computation.)

    2. Interface with other programs. (The public repository of sequences at NCBI
    includes powerful programs for analysis such as BLAST. We encourage a balance
    of using what is already available and writing our own as needed.)

    3. Focus on the case of use. (Throughout this book we emphasized how do-able this
    is without necessarily being a wizard or guru.)

    4. Use big data. Use real-world data. Problems that are too large to solve by
    hand help students understand the real value of computing. (Are billions of bases
    of DNA a big enough data set? The sequence files are growing every day. There
    is enough unanalyzed information for lifetimes of work. We are in an age of genome
    exploration.)

    5. Use natural-language text. (We were pleased to see this one because our approach
    to sequence analysis is to treat the data like a text to be deciphered. Our working
    metaphor is linguistics.)'
  merge: -1
  pgno: 276
- img_proc: true
  md: '+   6. Make it sensory: graphics, audio, animations. Write simulations. (Although
    we don''t go there in our book, graphics and simulations are an obvious next step
    for creatively presenting the intricacies of DNA.)


    +   7. Bring in experts. (One of our favorite teaching methods is linking preexisting
    courses in which, for example, a biologist does a couple of lectures in computer
    science and vice versa and then the two sets of students collaborate on an interdisciplinary
    project in DNA sequence analysis.)


    +   8. Illustrate how everyday computational objects work. (Medicine and other
    practical areas of science increasingly will be organized and implemented with
    computational methods. Knowing how some of the programs and databases work is
    empowering.)'
