    # Box 10.3 Complexity: 2X versus. X^2


    A major problem in DNA sequence analysis or any other topic in bioinformatics
    is complexity. Even the shortest list of elements can escalate into numerous potential
    combinations and connections. Microbiologist Jared Leadbetter, speaking at a Gordon
    conference in 2005 about the challenges of sorting out the interactions of a community
    of bacteria, said, “It is the difference between 2X and X^2.\nIn Perl, we would
    say:


    ```

    my $X; # X is the number of items we are considering

    print "Complexity is not about $X * 2 \n"; # Complexity isn''t 2X

    print "Complexity is about $X ** 2 \n"; # Complexity is X^2

