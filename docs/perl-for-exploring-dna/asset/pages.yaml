  md: '# Perl for Exploring DNA


    should do everything. In regard to output, we recommend that you use Perl to read
    your input sequence files, perform your analyses, and then print the tab-delimited
    or comma-delimited results to an output file that can be opened for later use
    by another tool, for example, Excel, Map, or R.


    To open a file for output, we use the output mode, ''>''. Unlike opening a file
    for reading, the ''>'' mode will either (1) overwrite the contents of an existing
    file if a file with that name already exists, or (2) create a new file with that
    name. Clearly, the case can be potentially dangerous and you should be careful
    to avoid reusing a file that you do not want overwritten.


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;


    my $outputFilename;

    ------------------------------------------------

    # OPEN THE OUTPUT FILE (a tab-delimited file for Excel)

    my $OUTPUT_HANDLE;

    $outputFilename = "output.xls";n

    open ($OUTPUT_HANDLE, ''>'', $outputFilename) \or die "Cannot open the file: $outputFilename:
    $!";

    \my $numA = 135;

    my $numT = 158;

    my $total = 612;


    my $perA = ($numA / $total)*100;

    my $perT = ($numT / $total)*100;


    printf $OUTPUT_HANDLE "Percent A\tPercent T \n";

    printf $OUTPUT_HANDLE "%6.2f\t%6.2f", $perA, $perT;

    close ($OUTPUT_HANDLE );

    ```


