  md: '# Your First Perl Programs with a Focus on String Argument


    The index function has two mandatory arguments and an optional third argument.
    The first argument is the STRING to search and the second argument is the SUBSTRING
    to search for within the (larger) first STRING. The optional argument indicates
    at what POSITION to begin the search. If a third argument is not provided, the
    search begins at the beginning position zero (0).


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;


    # A program to find the location of the first

    # three-letter ATG (start) codon

    my $putativeGene; # holds start of a putative coding region

    $putativeGene = "CCGTATGTACG";

    my $whereStart; # to hold the location of first start codon

    # find the first location of a start codon (ATG)

    $whereStart = index($putativeGene, "ATG");

    print "First ATG codon found at position $whereStart \n\n";

    my $whereAC; # to hold location of first dimer AC after ATG

    # after ATG, find the location of the dimer AC

    $whereAC = index($putativeGene, "AC", $whereStart);

    print "After ATG, first AC dimer found at position $whereAC \n";

    ```


