    # ## 12.2 Greediness


    Perl''s regular expressions are greedy, that is, the behavior of the regular expression
    quantifiers such as * (zero or more matches) and + (one or more matches) is to
    find and return the longest match as long as the rest of the pattern matches.
    This has significant implications when designing regular expressions that contain
    patterns as (.*) and (+).'
