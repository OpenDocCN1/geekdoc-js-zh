    # 7.5 Scope


    In Perl and most other programming languages, the variables that you declare and
    the values stored in those variables are available for you, the program to use
    the block of Perl where each variable was declared. The specific block or blocks
    that each variable can be accessed as that variable''s scope. Appreciating how
    scope fully works is well, beyond the scope of this text; however, an introductory
    appreciation can help avoid some memory errors as well as encourage you to follow
    some good programming practices that will serve you well in the future.


    Recall that we have encouraged you to always use the following line at the top
    of all of your Perl programs.


    ```

    use strict;


    my $DNA;

    my $len;

    ```


    This directive to the Perl system requires you to declare every variable with
    the Perl keyword, for example,


    The keyword declares a variable and defines its scope to be from the point of
    declaration until the end of a block unless that variable is redeclared. A block
    is delineated by Perl''s begin and ending braces { }; if there is no enclosing
    set of braces, the scope is the (current) file. This all becomes important if
    you choose to use the same variable name in multiple places in your program. If
    you use the same name, the scope of variable with multiple names determines which
    variable is actually being referenced. An example can help shed some light here.'
