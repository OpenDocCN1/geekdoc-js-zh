  md: '# Perl for Exploring DNA


    2003 the human genome was declared “done” (at least from the perspective of the
    popular press), and the number of genes was announced as being in the range of
    (a shocking) 24,000. Clearly complexity of function and structure is not correlated
    with the number of genes! Note Caenorhabitis elegans, a model worm of about 1,000
    cells and 1 millimeter in length has about 20,000 genes. (The winner of GeneSweep
    was Lee Rowan of the Institute of Biology in Seattle with a guess of 25,947).
    However, most genome biologists agree that the number is far from settled and
    considerable work is still needed in the area of gene finding software.


    # What About the Enormous Spaces between the Genes?


    With only about 24,000 genes, lightly sprinkled throughout 3 billion base pairs,
    the spaces between the genes, the intergenic sequences, are enormous. Let''s roughly
    estimate the length of a gene as 10,000 base pairs. (Gene lengths vary widely.)
    That means that genes occupy approximately 240 million base pairs, which is only
    about 12 percent of the genome. So take that 1.5-meter length of string from your
    pocket and pinch off about 18 centimeters. The rest of the string represents the
    intergenic regions. Because it is now becoming pretty clear that we cannot attribute
    our complexity to our quantity of genes, we really must focus on the spaces between.


    # What About the Intergenic Sequences?


    They aren''t junk. Those sequences are where of gene regulation is being encoded,
    resulting in the crucial and subtle differences in our limited repertoire of genes
    is being used. It is where “complexity” is encoded.


    However, the metaphor of deciphering DNA, especially intergenic DNA that has not
    yet been deciphered as “junk,” is so simple and visual and easy for the general
    public that it is used and over again by popular science writers. Unfortunately,
    the phrase “junk DNA” is certain to be with you for quite a while. No matter how
    many studies come out dispelling the idea of junk DNA, by patiently deciphering
    and finding in yet another useless piece of it, reporting by the popular press
    continues to be biased. Each new meaningful bit of sequence is dismissed as an
    odd exception. For example, long repeats of intergenic DNA (microsatellites) have
    a history of being declared and dismissed as junk. However (and this is just one
    of many examples) the length of a microsatellite distinguishes two types of volatiles.
    A longer microsatellite near a gene for hormone control seems to confer greater
    paternal care of offspring thus a different family structure in the mole nest
    (Hammock and Young 2005).


    Perhaps one problem is that these examples viewed one at a time seem to be trivial
    and ever anomalous. Vole paternal care might well be an exceptional case and the
    rest of intergenic DNA is still junk! Such examples viewed not one at a time by
    the thousands will perhaps lay the myth to rest some day. It isn''t junk; it just
    hasn''t been examined and deciphered yet.'
