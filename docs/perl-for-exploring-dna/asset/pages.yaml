- img_proc: true
  md: '# 8.2 Open a File for Reading (Input)


    When reading data from a file into your program, Perl''s built-in function associates
    the name of a data file with a user-declared file handle to move data from the
    file to your program. As shown earlier, it is helpful to visualize the file handle
    as a named pipe that connects your program to the input file. The basics are shown
    in the following program, which opens a file for reading, reads the initial header
    line from the file, and closes it.


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;


    Drosophila melanogaster odorant receptor Or83b mRNA

    my $filename = "fly_odorant_receptor.fna";


    my $FNAFILE; # create a variable to hold the file handle


    # try to open the file;

    # if no file by that name, print error message ($), then exit


    open($FNAFILE, ''<'', $filename)

    or die "Cannot open the input file: $filename: $!"


    my $header;

    $header = <FNAFILE>; # read first line of file

    chomp($header); # remove newline at end of the line

    print "Header line is: \n$header \n";

    close($FNAFILE); # close the file

    ```


    ```

    open($FILEHANDLE, ''MODE'', FILENAME )

    ```


    $FILEHANDLE is a user-defined variable, that is, you to make up the name, for
    example, $FNAFILE. Because this is the name you will use in your program whenever
    you perform a read, we recommend that you use a good name for your file handle.
    The FILENAME can be one of three types of strings:


    +   - a simple file name ("fly_odorant_receptor.fna") implying that the file is
    in the same directory as the Perl program;

    - a relative path name ("fly/olfaction_genes/fly_odorant_receptor.fna") implying
    that the Perl program is in a directory that contains a directory called fruit_fly,
    which contains a directory called olfaction_genes, which contains the input file
    to open (fly_odorant_receptor.fna);'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Accessing Files of Sequences from Databases


    iii. an absolute path, implying that the program knows the “absolute"

    location of the input file, for example,


    Windows Users: `C:\gens\fly_odorant_receptor.fna`;

    macOS X Linux Users:


    `/Users/mleblanc/Desktop/fly_odorant_receptor.fna`.

    (If you use TextRanger or BBEdit editors on macOS X, see

    8.5).


    When a FILENAME is opened for reading, the second argument to the open

    function is ‘c’. This second argument, referred to as the MODE, means the file
    is

    be “opened for input”. A summary of various modes is shown in section 8.4.

    Notice the use of “or die” in conjunction with the open statement. Although

    not required, we recommend that you always use this safety feature when opening-

    a file. Failure to open a file is a common occurrence for reasons,

    mississelling a file name. If the open function should fail for any reason,

    the die function will print an appropriate message. We recommend that you

    also print the system $ variable in this session. This will print extra system

    information concerning the reason the open file failed. The open statement will
    fill

    if the given name cannot be found or the input file has permissions set to

    unreadable by you.


    Once opened, your program can read data from the file one line at a

    time using the line input operator, <>. Perl’s line operator surrounds

    your FILEHANDLE. Note that when reading from the file you use the FILEHANDLE,

    not FILENAME.


    ```

    $header = <FNAFILE>; # read one line

    ```


    The line input operator returns the line in the input file or an undefined value

    (false) if no more data are available in the file. We will use this convention
    to detect

    the end of a file. Note that the line input operator grabs all the characters
    on the

    line, including the end of line character (e.g., newline character). It is often
    the case

    that you do not want to store this extra character. We follow a read-line statement

    with Perl’s chop function that chops the newline character from the

    end of the string. If a line of input does not end with a newline character, chop
    has

    o effect on chop removes trailing newline characters. Finally, it is

    always good programming practice to close your file handle once you have finished

    reading from the input file.


