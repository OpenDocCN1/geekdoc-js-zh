  md: '# Arithmetic operation


    | Arithmetic | Symbol |

    |---|---|

    | Exponentiation | ** |

    | Unary minus (e.g., -3) | * |

    | Multiplication | / |

    | Division | / |

    | Modulo division | % |

    | Addition | + |

    | Subtraction | - |


    As in a natural language, knowing the tokens (symbols) and syntax does not ensure
    that a sentence will be semantically correct (meaningful) or unambiguous. Unlike
    humans, computers in general and programming languages in particular do not tolerate
    ambiguity. A mathematical expression that is ambiguous to a human will be interpreted
    by Perl in a strict fashion following a set of rules. Before plunging into some
    of the details, the take-home story is that programmers must work hard to avoid
    ambiguity in their solutions, and simple techniques like the liberal use of parentheses
    go a long way toward eliminating any or potentially ambiguous expressions.


    Consider the seemingly ambiguous (at least to us humans) Perl statement:


    ```

    $x = 2 + 5 * 4; # seems ambiguous, no?

    ```


    Is the result, stored in the variable $x, the answer 28 (2 + 5 is 7, then multiplied
    by 4) or the answer 22 (5 times 4 is 20, added with 2)? The answer of course depends
    on whether the computer does the addition first or the multiplication first. (In
    Perl, the answer is actually 22 because the rule is that without parentheses multiplication
    occurs before addition.) Without a rule to which operator to perform first, the
    statement define a precedence or priority for the operators. For each Perl statement
    involving arithmetic operators, the precedence hierarchy of the operators is consulted
    and those with the highest priority are performed first. If more than one operator
    of the same precedence appears in the statement, the associativity is consulted,
    where associativity dictates if the operators with equal precedence are handled
    from left to right or from right to left. The precedence and associativity of
    the arithmetic operators is shown in the following table. Those operators appearing
    in the first row of the table have the highest precedence and are performed first,
    followed by the operators of the second row, and so on. Although parentheses ()
    are not operators, their use for disambiguation is so critical that we include
    them here.


    # Associativity


    | Associativity | Symbols |

    |---|---|

    | inside-out, i.e., inside pairs first | ** |

    | then continue working outward | (unary, negative) |

    | right to left | * / % |

    | left to right | + |

    | left to right | |

    | left to right |'
