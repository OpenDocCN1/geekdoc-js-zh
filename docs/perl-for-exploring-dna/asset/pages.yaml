  md: '# 7 Subroutines


    In which you will be encouraged to write short, stand-alone sections of a program,
    subroutines, that may be used in whenever needed.


    > For I saw before me in dark contours contesting the beginning of a grammar of
    biology.

    —Chargaff, 1971


    A metaphor for subroutines goes something like this. You organize your notes on
    the topic of cellular metabolism. Maybe you are a student studying for an exam
    or a professor constructing a built-in diagram) Either way, a subject as intricate
    as cellular metabolism can benefit from a decomposition into modular units. For
    example, electron transport itself is worth understanding as a process with its
    own inputs and outputs. The concept (and diagram) of electron transport can be
    placed modular like several different metabolisms. It is used in photosynthesis
    driven by light, it is used in respiration driven by the breakdown of product
    molecules, and it is used in several unique bacterial metabolisms. Electron transport
    is a sort of subroutine (one of many) for explaining and describing metabolism.
    Where exactly electron transport appears in your lecture or study notes is a personal
    decision. However, making a stand-alone topic that can be referred to in several
    different contexts is not a bad idea.


    Most complex computer programs are broken down into functional sections called
    subroutines. In Perl, subroutines and functions are synonymous, although we will
    tend to refer to built-in utilities (e.g., length, substr) the utilities that
    you write as subroutines. Subroutines stand apart from the linear order of a program''s
    flow. The code for a particular subroutine is often represented just once in a
    neat package at the bottom of the program (or in another file) and then called
    into action. Furthermore, once a subroutine is written, it can be easily cut and
    pasted into other programs; it is modular. Examples of subroutines might include
    complement, reverse, sequence. Likewise, a countNucleotide subroutine might stand
    by the bottom of the program until needed to count the number of instances of
    a particular nucleotide within a sequence.


    A wise use of subroutines makes programs


    +   1. more readable because a section of code can be written in one subroutine
    and used over and in any part of the program by simply calling (by name) for its
    use; a call to the subroutine replaces the details with a name;

    2. more concise because you only need to make little adjustments and repairs to
    the one section of your code that performs the details;

    3. reusable because a subroutine that works in one program today can be used in
    another program tomorrow.'
