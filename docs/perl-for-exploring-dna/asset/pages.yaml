  md: '```

    $numC = ( sequence =~ tr/C/C );

    ```


    First of all, when using tr to solely count number of occurrences of a particular
    character, we don''t really want to change the character, thus we translate it
    to itself. For example, in the example line, the cytosine (C) is changed to itself.
    The second unusual piece of syntax is the use of both the binding operator (=~)
    on the same line. As all assignments, the instruction is executed from the right
    to the left, thus first the tr operator binds to the string stored in the variable
    $sequence then translates all occurrences of the letter C to C. On the completion
    of the tr operation (everything inside the parentheses), the number of characters
    that were translated is returned and then assigned (=) to a variable to hold that
    count ($numC). Note that the parentheses are optional but help remind the reader
    that all the work on the right-hand side (inside the parentheses) is done first
    and then the result is assigned to the variable.


    ```

    # count number of pyrimidines

    my $sequence = "ACGCTCTTCAG";nmy $numC;

    my $numT;

    print "t Number of bases\n"

    $numC = ($sequence =~ tr/C/C/)

    print "C:\t $numC \n"

    $numT = ($sequence =~ tr/T/T/)

    print "T:\t $numT \n";

    ```


