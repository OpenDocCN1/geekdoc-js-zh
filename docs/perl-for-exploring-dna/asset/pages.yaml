    one of the important steps toward programming in the large.


    As shown in the diagram, when your Perl program opens a file for reading (e.g.,
    geneXYZ.fna), a “pipe” (formally called a file handle) connects your Perl program
    to the input file. the next line travels down the pipe to your Perl program, which
    can store the line of data in a variable. Alternatively, when your Perl program
    opens a file for writing, a pipe connects data from a variable in your program
    to output file. Each time your Perl program writes some data from a variable in
    your program to the file, the data travels down the output pipe and is added to
    the output file.


    ![](img/7faeba5fa4e60c11fd52ee03d48c0344_150_0.png)'
