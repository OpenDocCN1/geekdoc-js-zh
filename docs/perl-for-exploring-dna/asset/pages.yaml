  md: "# 12.2.1 A Greedy Match\n\nGiven a long sequence of DNA, including an entire\
    \ genome, how can we design a regex to find all the mirror repeats of length greater\
    \ than 6 bp? The following example shows a first cut, but unfortunately the (.*)\
    \ is greedy, and thus the pattern returns the match. In this case, greediness\
    \ is not good.\n\n```\n$dna = \"ATCGATCATCCTCCTATGCGCA\";\nwhile ($dna ~ m/(\n\
    \    # capture (remember) entire match\n    (.)(.)(.)\n    # any 3 nucleotides,\
    \ remember, then\n    # GREEDY! 0 or more of any nucl.\n    \\\\4\\\\3\\\\2\n\
    \    # recall in mirror-order\n    # end of entire match\n)/xg\n    # find all\
    \ (g) globally\n# while another match is found\n```\n\nThe output of the regex\
    \ with the greedy quantifier (*) is shown below.\n\nFound (non-greedy) MR: CGCATGC\
    \ at bp 2\nFound (non-greedy) MR: CGTCATGTGC at bp 15\n\nA careful look at the\
    \ sequence will reveal that this regex has returned the shortest and longest mirror\
    \ repeat (MR) and skipped past the initial MR.\n\nWhat about this MR?\n\n```\n\
    ATCGCATATCCTCCTCGATGCGTGCA\n```\n\n```\n(.)(.)(.) (.**)\\\\4\\\\3\\\\2\ngready\n\
    ```\n\nSince the * quantifier is greedy, (*) will match as much as it can. So\
    \ would (+). If you were to run this regex against a string representing an entire\
    \ genome, you'd get back one very long result. In that case, you might suspect\
    \ something was amiss,\n\n![](img/7faeba5fa4e60c11fd52ee03d48c0344_234_0.png)"
