    \ programs on a Linux or OS command line.\n\nBecause TextWrangler and BBEdit are\
    \ text editors and not fully-fledged Perl development environments, they are not\
    \ able to recognize by default the directory where your Perl program runs. The\
    \ following solution will help. It contains some features of Perl that have not\
    \ yet been addressed, but consider this exercise in borrowing code. In File::Spec.\
    \ In particular, the splitdir and catfile functions help determine the absolute\
    \ path of your running program, thereby helping you construct the appropriate\
    \ path name to use in your files.\n\n```\n#!/usr/bin/perl\nuse strict;\nuse warnings;\n\
    \n# needed for MacOS X if using BBEdit or TextWrangler\nuse File::Spec;\n-\n#\
    \ establish the absolute pathname to directory of input files\n#n need for MacOS\
    \ X when using BBEdit or TextWrangler\n#n# determine the absolute pathname to\
    \ the current directory\nmy @path = File::Spec->splitdir(File::Spec->relabs($0));\n\
    \nmy $abs_pathname;\n$abs_pathname = File::Spec->catfile($path[0..$#-1], \"\"\
    );\n\nmy $pathname = \"BACT/BACT_ancient/BACT_ancient_Thermotoga\";\nmy $filename\
    \ = \"D_04_TM0008.fna\";\n\nmy $fullname = $abs_pathname . $pathname . $filename;\n\
    my $FNAFILE;\n\nopen ($FNAFILE, '<', $fullname)\n  or die \"Cannot open the input\
    \ file: $filename: $!\";\n\nprint \"full pathname opened is: \\n$fullname \\n\"\
    ;\n#...\nclose ($FNAFILE);\n```"
