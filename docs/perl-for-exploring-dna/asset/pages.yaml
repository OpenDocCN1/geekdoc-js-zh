  md: "but imagine if you were searching relatively shorter sequences such as upstream\
    \ regions in a prokaryotic genome. In this case, the MRs returned would look to\
    \ be of reasonable length.\n\n# 12.2.2 A Nongready Minimal Match (The Solution\
    \ You Want)\n\nYou can force nongready matching by placing a question mark (?)\
    \ after your quantifiers. Thus (.*?) will minimally match zero or more and (.+)\
    \ will match one or more. Adding ? after the quantifier in the regex will force\
    \ the regex to match as few characters as possible, thereby finding the smallest\
    \ MR that matches the rest of the regex.\n\n```\n$my dna = \"ATCGTCATGCCTTCTCGATCGGTGCA\"\
    \nwhile ($dna ~ m/)\n  # capture (remember) entire match\n  (.).(.).. # any 3\
    \ nucleotides, remember, then\n  (*?) # NOT GREEDY! 0 or more minimally\n  \\\
    4\\3\\2 # recall in mirror-order\n) # end of entire match\n  /xg\n) # find all\
    \ (g) globally\n} # while another match is found\n```\n\n```\nmy $mirrorRepeat\
    \ = $1;\n$foundBP = pos($dna)-length($mirrorRepeat);\nprint \"Found (non-greedy)\
    \ MR: $mirrorRepeat at bp\\n$foundBP \\n\";\n# end while more MRs to find\n```\n\
    \nThe output when using the nongready quantifier is shown here.\n\n```\nFound\
    \ (non-greedy) MR: CGATGC at bp 2\nFound (non-greedy) MR: CGATCGGTGC at bp 15\n\
    ```\n\nThis time, the nongready quantifier finds both MRs. Perhaps you are thinking,\
    \ \"Gee, just one little symbol and such different results.\" Regexes are powerful,\
    \ and with with power responsibility.\n\nMR at bp 2\n\n```\nATCGTCATGCCTTCTCGATCGGTGCA\n\
