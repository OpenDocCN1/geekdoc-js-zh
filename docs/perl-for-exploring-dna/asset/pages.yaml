  md: '# 9.8.5 Summary of Using split


    | Delimiter | Pattern | Example use |

    | --- | --- | --- |

    | whitespace | " " | my @items = split(" \ "one two three");

    # #items[0] is "one"

    # #items[1] is "two"

    # #items[2] is "three" |

    | comma | ,, | @items=split(,,, "one, two three");

    # #items[0] is one

    # #items[1] is two three |

    | colon | :/ | @items=split(:/, "one:two:three, four");

    # #items[0] is one

    # #items[1] is two

    # #items[2] is four |

    | pipe | \|\| | @items=split(\|/, "one, two|three");

    # #items[0] is one, two

    # #items[1] is three |

    | start of line | ^/ | @items=split(\^/, $manyLines);

    # #items[0] is first line in $manyLines

    # #items[1] is second line in $manyLines

    # # etc |

    | nothing | // | @items=split(//, $sequence);

    # #items[0] is first character in $sequence

    # #items[1] is second character in $sequence

    # # etc |


    # 9.9 Using join


    join( DELIMITER, LIST )


    The join function joins all the individual elements stored within a LIST (or cells
    of an array) into a single string with each item separated by a specific DELIMITER.
    Note unlike the split function, join does not have the regular expression pattern
    as the initial argument.'
