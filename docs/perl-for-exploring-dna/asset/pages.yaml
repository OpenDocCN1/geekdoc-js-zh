  md: '# Box 10.2 Continued


    grammar and spelling may be overlooked. If the goal is to decipher promoter information,
    minimal functional size may be misleading.


    +   Many mutations in promoter regions have no discernible effect, within the
    limits of lab assays. Therefore, many promoter sequences seem unconserved and
    irrelevant. However, the promoter regions are much less dependent on linear, vectorial
    code. Promoters may be error-tolerant due to redundancies that compensate for
    missing or misspelled information. Furthermore, the spacing of motifs should be
    considered as informative as the motifs themselves.


    +   Enhancers are often considered in a separate category from promoters, being
    hundreds of thousands of bp away from the gene. Furthermore, for convenience,
    some promoter studies deliberately focus only on sequences within a few hundred
    bases of a gene. Enhancers seem to be quite modular and context-sensitive. Including
    them into more promoter studies might facilitate deciphering regulatory information.


    +   Probably all proteins have a minimum, low-affinity binding to DNA. Mutational
    studies of promoters might shift affinity a continuum from strong to random. However
    it should not be assumed that strong binding is representative of actual use in
    promoting genes. There may be situations in which a lack of or low-level binding
    forms seem essential of information, but it would be extremely difficult to detect
    these above background noise of random binding.


    +   Instructions for gene regulation may be scattered throughout the genome. The
    linearity of chromosomes is an illusion of databases and models. Actual DNA is
    stuffed into a nucleus or cell that the information is being used three- and four-dimensionally.
    Attempting to “read” promoters linearly may never lead to full deciphering of
    the information


    +   Motifs in promoters and enhancers are often collected, reported, and stored
    as linear (like genes). This is a practical matter for designing databases of
    sequences, however, it may not reflect the true functioning of motifs.


    +   Evolution is quite different from design. It is messy, illogical, and good
    enough (even if just marginally) for the particular context of a generation in
    an environment. Therefore, looking carefully for logical patterns may lead to
    many misunderstandings about promoters.


    So what can we do about all of this? Take it as a challenge. We think of the upstreams
    (and downsstreams) of genes as whitewater of the genome. The exploration of whitewater
    on a raft, we do not expect a linear, vectorial ride on the river. The design
    of databases to handle intergenic (whitewater) sequences is a major problem requiring
    many more dimensions than required for gene data. (Introns, the noncoding sequences
    within genes, also are not recorded in proper dimensionality, reflecting their
    complexity.)


    Anyone tackling the project might look beyond simple English lexicons as a model.
    For example, dictionaries of Chinese characters are more complex,",


