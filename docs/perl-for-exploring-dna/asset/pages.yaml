  md: '# Phrasing Questions by Writing Algorithms


    Meanwhile, you want your code to be absolutely transparent to future users, especially
    those who will need to add, and otherwise maintain your program. That future user
    could be yourself, a year from now, puzzled by your own choices. Descriptive variable
    names and essay-like comments take up space and time. It takes longer to trace
    through code that occupies scores instead of dozens of lines.


    To achieve that balance between efficiency and understandability is to produce
    something beautiful. Our friend and Perl guru Greg Williams, who like many gurus
    sometimes leans towards (rather than verbose), says that the goal is “to use as
    few of the language features of Perl as possible for the greatest effect while
    still being completely understandable.”

    This is something we all might aspire.


    # 11.4 Jim Kent''s BLAT Algorithm


    A heroic story of algorithm building is that of Jim Kent, a programmer who was
    completing graduate work in biology at the University of California, Santa Cruz.
    When the sequencing of the chromosomes of the human genome had been completed,
    that genome was, that far, from finished. Like most frequently sequenced genomes,
    it was all in fragments, three million of them, described by Kent as being like
    fragments of the Dead Sea scrolls. Assembly of all small DNA sequences was predicted
    to be a long and arduous process using the available software of the Human Genome
    Project. Meanwhile, the competing commercial enterprise at Celera was away from
    assembling its own draft of the human genome and (at least for a time) keeping
    it proprietary as well as applying for patents on as many genes as possible.


    Undaunted Kent began sketching out algorithms (based on his research) by which
    the assembly might go more smoothly and quickly. Ambitiously, he focused on speed,
    requiring the assembly to be completed about two weeks. Working as much as 80
    hours out of his week and using 100 Pentium III processors, Kent produced and
    implemented GigAssembly. It was used in June 2000, finishing the first draft of
    the human genome a few days earlier than Clara. Almost immediately, Kent and his
    group placed the draft into the public domain. In 2002 Kent published the algorithm
    for his tool, BLAT, which stands for BLAST-Like Alignment Tool. The goal of BLAT
    was to “stitch together” sequence fragments with significant overlaps. For example,
    these two fragments might be stitched together.


    ```

    actggcattagct and ttagctacatgtct

    ```


    to make


    ```

    actggcattagctatacatgtct

    ```


    and so on, to assemble another chromosome.

    In his paper, Kent compared BLAST with BLAT, summarized and simplified this by
    us.'
