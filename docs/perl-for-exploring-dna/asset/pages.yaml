    topic for research itself.


    # What This Book Is Not


    This is not a direct route to complete mastery of Perl; this is not a comprehensive
    treatise on all things Perl; you will not be trained as a wizard or guard unless
    you are inspired to go much further than the contents of this book. Biologists,
    we are not urging you to quit your day job and become a programmer. We argue that
    there is a useful function for a simplified Perl book like this one directly applied
    to biological sequence analysis.


    # Who Are the Authors (And How Did They Come to Write This Book)?


    Neither of us are Perl gurus or wizards. Both of us are extremely enthusiastic
    searching for patterns in DNA sequences and applying it to our own research and
    teaching students to the day.


    Mark DLeBlanc, a computer scientist, has written most of his software in C, C++,
    or Lisp, although Perl now appears more in his research projects. Like any good
    programmer, Mark has been trained to learn new languages as needed and as much
    as needed. Learning Perl was a reasonable step, but not his initial step in genomics.
    Like reading poetry over time, applying Perl to problems in string manipulation
    led to an appreciation that occurred over time. As an experienced teacher of undergraduate
    computer science courses at all levels, Mark explains and interprets programming
    syntax clearly and for presenting difficult material. He is also a good predictor
    of the pitfalls that await novice programmers. Mark wrote nearly all of the Perl
    examples in this book, and Betsey served essentially as the first reader and also
    author of those examples.


    Betsey Dexter Dyer, a biologist, is something of a Luddite. She often hand-writes
    drafts using a fountain pen that she carries with everywhere in a special case.
    On the other hand, she is logical enough to come up with workable algorithms for
    complex problems, and communicates with a diversity of programmers. She has many
    questions about DNA sequences that seem to be tractable in part via string searching
    and pattern matching (the strong points of Perl). Some of these questions are
    being answered in an ongoing research group that she and Mark supervise, which
    is composed of undergraduate computer science and biology majors who are designing
    and writing software to decipher some aspects of gene regulation.


    However, Betsey’s particular contribution to this book is her tendency to take
    nothing for granted. “phrase book for travelers” approach has a'
