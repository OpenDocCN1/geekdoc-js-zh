  md: 'The reader should take special care to note that the recall variables in the

    REPLACEMENT section of the substitution operator be referenced $1, $2,

    and so on and not \1, \2. Remember that \1 and \2 variables are the way to recall

    previous matches within the same regular expression (see the examples for direct

    repeats in section 4.8). To recall a captured match, for example, (.) or (.*),
    after

    the regex has finished, we must use the Perl variables $1, $2, and so on to recall
    the

    respective match.


    In the next example, two different organism names are used to show that the

    identical regex handles both cases.


    ```

    $shortName = "Escheria coli K12"

    # keep only the first letter of the Genus name

    $shortName ~ s/^(.)\S+(.*)/$1.$2/


    print "Fullname: $fullName\n"

    print "Short name: $shortName\n\n"

    $fullName = "Oryza sativa" # # rice

    $shortName = $fullName


    $shortName ~ s/^(.)\S+(.*)/$1.$2/ # same RegEx


    print "Fullname: $fullName\n"

    print "Short name: $shortName\n\n"

    ```


    Fullname: Escherichia coli K12

    Short name: E. coli K12


    Fullname: Oryza sativa

    Short name: 0. sativa


    Notice that $2 captures whitespace, that is, all characters after the genus

    name. For example, $2 holds a single blank character before "coli K12." So $2

    ensures that we will get a space between "E." and the final part of the name when
    we

    print the results in $shortName.


    # 4.11 Recalling Captured Matches after the Regex


    In addition to recalling regex matches within the substitute operator as shown,
    it is

    important to appreciate that Perl''s $1, $2,...$n variables retain their captured

    values from the most recent regex match until the next regex. This means that
    you

    can recall in subsequent Perl instructions any part of the last regex match that
    was

    captured. Because Perl remembers your captured regex matches, you can recall

    the captured matches many statements later, that is, you need not to recall the
    imme-

    diately following the statement containing the regex.'
