    In this chapter, a number of fairly small values are multiplied together to produce
    an even smaller value. In the spirit of the quote that leads this chapter, it
    is important to acknowledge the limitations of storing very small (or very large)
    values in a computer. Computers have a physical limit on how small and how large
    values can be represented internally. Numbers that get too large cause to overflow
    (become larger than the maximum possible value that can be stored on that machine)
    and values that get too small cause to underflow (become smaller than the smallest
    possible value that can be stored on that machine). Overflow and underflow are
    difficult to detect, and therefore it is best to consider strategies for avoiding
    the situation when possible or needed. In the example here, multiplying many small
    values together potentially result in underflow. To avoid multiplying many small
    values together, we use logarithms to convert a length series of multiplications
    into a sum. Avoiding multiplications of small values can help prevent the chance
    of underflow. Logarithms can help you convert a product of values into a sum,
    as shown here:


    ```

    p(GACCAGC) = p(G) p(C) p(C) p(A) p(G) p(C)

    log(p(GACCAGC)) = log(p(G)) log(p(C)) log(p(C)) log(p(A)) log(p(G)) log(p(C))
    take the log of both sides avoid multiplying lots of small values together by
    noting that the log of the product is the same as the sum of logs of multiplicands

    ```


    ```

    sumOfLogs = log(p(G))+log(p(C))+log(p(C))+log(p(A))+log(p(G))+log(p(C))

    p(GACCAGC) = e^sumOfLogs e^ of the sum of logs to remove the logs

    ```'
