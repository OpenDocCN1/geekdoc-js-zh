  md: '# 9.4 Storing “Glob” of File Names


    A good example of using an array is to store an unknown number of file names that
    are stored in a directory (or folder) into an array. Perl''s glob function will
    peek into a given directory and store the name of each file into an array, one
    per cell in the array. Assume there is a directory called bacteriaGenomes holding
    the DNA sequence data for many complete genomes.


    ![](img/7faeba5fa4e60c11fd52ee03d48c0344_168_0.png)


    We can use glob to load all the file names found in this directory into an array.


    ```

    @bacteriaFilenames; # an array of many bacterial filenames

    # a directory called “bacteriaGenomes” holds the files

    # the /* means to get all the files in that directory

    my $pathName = "bacteriaGenomes/*";

    # grab a “glob” of files, each of the filenames

    # is put into individual elements of the array

    @bacteriaFilenames = glob($pathName);

    ```


    Once glob has done its work, the array @bacteriaFilenames will be filled with
    all the file names in the directory bacteriaGenomes, with each cell of the array
    filled with one name. The diagram below shows the initial two cells of the array.


    | .../Acinobacter_sp_ADP1.fna | .../Escherichia_coli_K12.fna |


    Each cell in an array is numbered and the numbering begins with zero. These numbers
    are referred to as subscripts or indices. Array subscripts provide immediate access
    to individual cells in the array. We return to array subscripts in the next section.'
  merge: -1
