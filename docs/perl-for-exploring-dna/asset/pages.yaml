    # 6.1 Simple Statements versus Controlled Statements


    So far, you have been issuing simple commands in Perl, and as long as the spelling
    and syntax have been correct, you have obeyed. For example, strings of DNA sequences
    have been sought, found, and manipulated in various ways. What are right now are
    certain subtleties that enable you to handle mutually exclusive events and relieve
    you of the chore of having to issue the same Perl statements over and again.


    You say, "Find this substring." but what you really wanted to say is: "Find the
    motif ACGTGG and keep on finding it while you are still in the sequence and don''t
    stop until you have found all of them."


    A "while loop" is what you need; it will issue your statements again and again
    "while" there is still more searching to do.


    Or perhaps you would like Perl to check for a certain condition as it searches
    through a file of DNA sequence. You might want something like this: "Find a motif
    (substring) with certain characteristics. If it is of length greater than 10,
    then report it; if not (else) do not report it."


    In programming parlance, testing for mutually exclusive situations and repeatedly
    executing commands are referred to as conditional and repetitional control, respectively.
    Most programming languages provide the programmer (you) with three types of control:
    (1) sequential (one instruction after another from top to bottom), (2) conditional
    (if-else), and (3) repetition (while). Up to this point, all your Perl programs
    have used only sequential control; that is, statements are executed sequentially,
    from the top of your Perl program to the bottom. This chapter introduces to the
    other two types of control, conditional and repetition. All programs from this
    point will be creative blends of these three types of control structures.'
