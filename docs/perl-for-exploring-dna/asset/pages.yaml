  md: '# Box 11.1 An Algorithm for Discovery: Five Simple Principles


    +   1. Slow down to explore. Discovery is facilitated by an unhurried attitude.
    We favor a relaxed attentive yet prepared state of mind that is free of the checklists,
    deadlines, and other exigencies of the workday schedule. Resist the temptation
    to settle for quick closure and instead search for deviations, inconsistencies,
    and peculiarities that don''t quite fit. Often hidden among these anomalies are
    the clues that might challenge prevailing thinking and conventional explanations.


    +   2. Read, but not too much. It is important to master what others have already
    written. Published works are the forum for scientific discourse and embody the
    accumulated experience of the research community. But the influence of experts
    can be powerful and might squash a nascent idea before it can take root. Fledging
    ideas need nurturing until their viability can be tested without bias. So think
    again before abandoning an investigation merely because someone says it can''t
    be or is unimportant.


    +   3. Pursue quality for its own sake. Spend time refining methods and design
    is always rewarded. Rigorous attention to such details helps the premature rejection
    or acceptance of hypotheses. In the process of perfecting one''s approach, unexpected
    discoveries can be made. An example of this is the background radiation attributed
    to the Big Bang, which was identified by researchers while they were pursuing
    the source of a noisy signal from a radio telescope. Meticulous testing is a key
    to generating the kind of reliable information that can lead to new breakthroughs.


    +   4. Look at the raw data. There is no substitute for viewing the data firsthand.
    Of course, there is no question that processing of data is essential for their
    management, analysis, and presentation. The problem is that most of us do not
    really understand how automated packaging tools work. Looking at the raw data
    provides a check against the automated averaging of unusual, subtle, or contradictory
    phenomena.


    +   5. Cultivate smart friends. A buddy can sharpen critical thinking and spark
    new insights. Sharing with a buddy finding the right colleague is itself a process
    of discovery and requires some luck. Shear intelligence is not enough; a pal whose
    attributes are complementary to your own, and you may be rewarded with a new perspective
    on your work. Being kind of friend to another is the secret to winning this kind
    of friendship in return.


    Although most of us already know these five precepts in one form or another, we
    have noticed some difficulty in putting them into practice. Many obligations appear
    to erode time for discovery. We hope that this essay can serve as an inspiration
    for reclaiming the process of discovery and making it part of the daily routine.
    In 1936, in Physics and Reality, Einstein wrote, "The world of science is nothing
    more than a refinement of everyday thinking." Practicing this art does not require
    elaborate instrumentation, generous funding, or prolonged sabbaticals. It does
    require a commitment to exercising one''s creative spirit—for curiosity''s sake.


    Reprinted and slightly abridged from Paydarfer and Schwarts (2001).'
