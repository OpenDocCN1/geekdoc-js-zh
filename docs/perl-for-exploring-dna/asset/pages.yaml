  md: "# 13.4 Weasel Programs: Interesting Applications for rand or shuffle\n\nIf\
    \ you do an Internet search, you will find the Web site of writer and evolutionist\
    \ Richard Dawkins (Richarddawkins.net), along with several links to computer programs\
    \ that perform the weasel code as described by Dawkins (1996). The algorithm is\
    \ briefly summarized in this section. The program demonstrates the power of cumulative\
    \ selection as far superior to random searching when seeking a target word in\
    \ a large search space. Cumulative selection is but one aspect (albeit an important\
    \ one) of evolution that happens to lend itself to programming, but of course,\
    \ it is by no means the entire story. Thus, the program is not a simulation of\
    \ evolution per se, as some have argued in its criticism of it. An Internet search\
    \ for Dawkins and the weasel code will lead you to a range of commentary as people\
    \ either over- or underestimate the program is actually doing.\n\nOne example\
    \ of a weasel program written in Perl is by Wesley Elsbery. You can find it (at\
    \ Dawkins' site), cut and paste it into your IDE, and run the program. It allows\
    \ you to choose some parameters, such as the mutation rate and the target string,\
    \ as “methinks.” However, particularly unlike using a random DNA or protein sequence\
    \ as a target. For example, you could start with a random DNA sequence and set\
    \ the target to a particular molecule. Or you could start with a random amino\
    \ acid sequence and set the target to be a sequence with the greatest number of\
    \ hydrophobic amino acids (or amino acids of some other chemical propertynA simplified\
    \ algorithm for such a program is as follows.\n\n```\nCreate random string (of\
    \ length L) of amino acids (or English alphabet or nucleotides).\nPut the random\
    \ string into two identical arrays (experimental arrays #1 and #2).\nChoose a\
    \ target sequence of length L.\nPlace the target sequence into an array (target\
    \ array).\nBegin While loop (while the chosen experimental array does not equal\
    \ the target array)\nMutate:\n  Use random number generator to choose a N within\
    \ the list of the array.\n  Use random number generator to choose an amino acid\
    \ from the list of 20 (or the alphabet or the nucleotides).\n  Change one of the\
    \ two experimental arrays by changing the Nth element in the newly generated random\
    \ amino acid.\nCompare and Select:\n  Compare the two experimental arrays with\
    \ the target sequence array, index by index.\n  Choose the experimental array\
    \ that best matches the target array.\n  Discard the other. Replace it with replicate\
    \ of best match\nCount this as Generation #1 (#2, #3, etc.).\nRepeat until experimental\
    \ array is the same as the target\nReport on the number of generations it took\
    \ to get the match\n```"
