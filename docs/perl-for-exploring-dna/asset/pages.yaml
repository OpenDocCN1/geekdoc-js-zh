  md: "# 13.2 Generating Random Sequences of DNA\n\nYou can use rand to help generate\
    \ random nucleotides one at a time and concatenate each randomly generated nucleotide\
    \ to the end of a string. Ultimately, you want the randomly generated sequence\
    \ to reflect the A:C:G:T ratios in your actual sequence of DNA. For example, particular\
    \ intergenic region of DNA might contain a high preponderance of As and Ts; thus,\
    \ random sequences generated for comparison purposes should be more likely to\
    \ contain a high number of As and Ts.\n\n# 13.2.1 Random Sequences with Equally\
    \ Likely Nucleotides (A = C = G = T)\n\nUsing rand to generate integers from one\
    \ to four, inclusive, you could associate each of the four integers with a particular\
    \ nucleotide, for example, A = 1, C = 2, G = 3, T = 4. In this case, note that\
    \ we assume that the proportion of nucleotides in the sequence is 1:1:1:1. The\
    \ following example generates 1,000 random nucleotides, counts the number of times\
    \ we get each one, and prints the final totals.\n\n```\n# generate 1000 equally\
    \ likely nucleotides\nprint \"1000 random nucleotides: \\n\";\nmy $numA = 0;\n\
    my $numC = 0;\nmy $numG = 0;\nmy $numT = 0;\n\nforeach $trial (1..1000) {\n  my\
    \ $N = int(rand(4)) + 1;\n  if ($N == 1) # A {\n    $numA++;\n  } elsif ($N ==\
    \ 2) # C {\n    $numC++;\n  } elsif ($N == 3) # G {\n    $numG++;\n  } else #\
    \ must be a T {\n    $numT++;\n  }\n} # end foreach trial\n```"
