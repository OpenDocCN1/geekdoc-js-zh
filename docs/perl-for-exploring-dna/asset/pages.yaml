  md: "# 172 Perl for Exploring DNA\n\ngenomes. Assume that each lineage is prefaced\
    \ by the GenBank accession number and the number and levels of the lineage are\
    \ delimited by semicolons. The following is an example for one genome.\n\n'AE0005212;\
    \ Bacteria; Thermotogae; Thermotogales; Thermotogaceae; Thermotoga; Thermotoga\
    \ maritima MSB8'\n\nAssume each lineage is stored in one cell of an array. The\
    \ initial three cells of the array @genomeLineages are shown next.\n\n| AE0005212;\
    \ Bacteria; Thermotogae;... | AE009950; Archaea; Euryarchaeota;... | BA000002;\
    \ Archaea; Crenarchaeota;... |\n|--- |--- |--- |\n| 0 | 1 | 2 |\n\nTo sort by\
    \ the initial two levels of taxonomic names, we need to isolate the domain name\
    \ (the second field) and group name (the third field) using split. By using both\
    \ fields, we can ensure that all Archaea genomes and all Bacteria genomes are\
    \ alphabetically sorted by their next-level taxonomic name, respectively.\n\n\
    ```\n#-----------\n# taxonomically \\\n#-----------\n# This routine is called\
    \ by Perl's sort() function\n# This tourtine sorts first by domain name if those\
    \ are identical\n# it will sort by the second level (group) names\n#\n# IN: two\
    \ semicolon delimited strings of lineage (stored in\n# $a and $b) e.g.: \"AE0005212;\
    \ Bacteria; Thermotogae;\"\n#n# RETURNS: -1 if $a comes before $b\n#         \
    \ 1 if $a comes after $b\n#          0 if $a is the identical lineage of $b\n\n\
    ub taxonomically {\n    # isolate the fields to sort by [0] = Accession [1] =\
    \ Domain\n    # [2] = Group\n    my @a_fields = split(/; /, $a);\n    my @b_fields\
    \ = split(/; /, $b);\n\n```"
