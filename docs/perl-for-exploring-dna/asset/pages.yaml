  md: "# Perl for Exploring DNA\n\nIntrigued? We hope so. In addition to warnings\
    \ and recommendations, this chapter includes lots of refinements for your pattern\
    \ matching search strategies and suggestions for how to use them in sequence analysis.\n\
    \n# 12.1 Commenting Regular Expressions\n\nRegular expressions are sections of\
    \ code written in a compact syntax. The subtleties of these pattern-matching subroutines\
    \ require documentation for the same reasons we comment the subroutines we write.\
    \ For the same rationale for documenting routines (e.g., see section 7.2), regular\
    \ expressions require accompanying comments that help the reader translate pattern-matching\
    \ intentions into English. More often than not, the reader will be you, attempting\
    \ to decipher your own regex.\n\nThe extended formatting mode (/x) allows you\
    \ to comment your regular expressions. All whitespace (e.g., blank spaces and\
    \ newlines) within your regex are not considered of the pattern to match and are\
    \ ignored. In addition, the comment symbol (#) and anything following to the end\
    \ of the line is also ignored, thus you can comment each individual section of\
    \ your regex like you do with other lines of Perl.\n\nFor example, the following\
    \ regular expression is nontrivial to parse. What exactly is this intending to\
    \ match?\n\n```\nif ($smotif ~ /((.)(.).*)(.*?))\\4\\3\\2)/ /\n```\n\nGranted,\
    \ we have thrown in one feature that we have to introduce, but the point is that\
    \ by using the extended formatting mode for regex (/x), this patternmatching expression\
    \ can be teased apart, translated to English, and presented to the reader in a\
    \ very clear fashion.\n\n```\nmy $dna = \"ATCGTCCATGCCTCTATGCGGTCA\";\nif ($dna\
    \ ~ m/\\(\n  # capture (remember) entire match\n  (.).(.).. # any three nucleotides,\
    \ remember them,\n  (.*?) # zero or more of any nucl, NON-GREEDY, then\n  # recall\
    \ three nucleotides in mirror-order\n  \\4\\3\\2 # end of entire match\n) /x\n\
    {\n  # if match is found\n  my $mirrorRepeat = $1; # save match with an appropriate\
    \ name\n  print \"Found (non-greedy) MIRROR REPEAT (>= 6bp): $mirrorRepeat\\n\"\
