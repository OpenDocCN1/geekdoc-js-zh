  md: '# Box 12.2 Continued


    pictogram of waves in water (water) and a crouching man holding his hand to his
    mouth (drink).


    If this were done in English, then the word for cough might look like couFgh followed
    closely by near one or more pictures depicting a person coughing. This would be
    the way to make sure that you could pronounce the gh like F and know the meaning
    from the picture.


    Like any evolved system, hieroglyphics is convoluted in its lack of simplicity
    and shows many vestiges in its origins as a completely pictorial method of writing.
    The newer (5,000-year-old) phonetics seem to have been layered in cautiously leaving
    extra cues to make sure of the meaning. In hieroglyphics there are at least two
    methods of perception for deciphering a word: hearing and pronouncing the phonogram
    and seeing the pictogram. Finally, of course, context is important. One would
    hope to find the word third surrounded by other words that complete a logical
    sentence. Otherwise it is back to the dictionary for more deciphering as there
    are many opportunities for ambiguity, including abbreviations and transpositions
    of glyphs for reasons of aesthetics. Ironically, the great care to avoid misunderstandings
    by using layers of redundancy makes simple translation of years later later impossible.


    Like hieroglyphics, DNA can appear deceptively linear in its translated form,
    acggtgcca. The actual meaning is likely to be more complex, multilayer, and redundant,
    representing the kinking and coiling of the DNA at that site of the motif and
    the likely binding of one or more proteins. Thus the perception and meaning of
    a motif of DNA is the result of several types of chemical interactions, their
    probabilities of occurring and the context of the motif within the longer string.
    Furthermore, it is an evolved system and as is expected to be a bit ambiguous
    and jerry-ridden with vestiges of former meanings.


    Where does this leave the DNA analyzer? We submit with a deep respect for the
    ground truth of the lab bench. We cannot go back to ancient Egypt to clear up
    all of the many misunderstanding of hieroglyphics. We can, however, go into the
    wet lab or collaborate with colleagues who can do that for sequence interpretation.
    A certain motif may appear again and again in an enticing upstream position of
    a gene. It remains to the lab to find out what actually matters. How many different
    proteins can it bind and how securely? What is the shape of the DNA at that motif
    and under what conditions? What happens to the cell or organism if that motif
    is missing? It is just a list of hypothetical motifs without that information.


