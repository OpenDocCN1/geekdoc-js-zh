  md: '# 156 Perl for Exploring DNA


    glob (EXPRESSION)

    The glob function returns a list of file names. The argument for glob is a path
    identifier (EXPRESSION), which specifies how to find the files and file names
    to match and return. File name extensions occur as you might encounter on a Linux
    or MS-DOS command line, for example, a * means any sequence of characters including
    none. Note glob file syntax is close to but not the same as the full suite of
    regular expression syntax. The following examples show potential uses of glob.


    ```

    my filenames; # an array to hold filenames


    glob all files (*) in the current directory

    # that end with the extension ".fna"

    @filenames = glob(\*.fna")


    glob all files (*) in the directory Archaea/

    # that end with the extension ".fna"

    @filenames = glob("Archaea/*.fna")


    glob all files in the directory Bacteria/ProteinTables/

    # that begin with ''E'' and end with the extension ".ppt"

    @filenames = glob("Bacteria/ProteinTables/E*.ppt")

    ```


    # Special Cases


    +   Two important special cases are worth mentioning.

    1. A file name that begins with a dot (.) is ignored by glob unless you''ve specifically
    requested that this character is explicitly matched in the EXPRESSION. In Linux,
    this means that glob will not return the current (.) directory not the one level
    above ().

    2. glob may not work on file names that contain whitespace. Thus, a file name
    containing a blank space, for example, Ecoli_K12.fna, may not be handled by glob.
    Names that contain spaces should either be renamed, or by replacing the blank
    with an underscore Ecoli_K12.fna, or if you are faced with too many names that
    contain whitespace, you''ll need to use the Perl module File::Glob, which handles
    whitespace in file names (see chapter 14).


    # Try This Now


    The ability to glob files and deal with one at a time is a must-tool available
    to you. Whether you need to peek at the header line of hundreds of coding sequence
    or you are running an experiment on genomes, the glob function and foreach loop
    encourage you to organize your input (sequence data) files in directories, glob
    the file names into an array, and then operate on those files one at a time.'
  merge: -1
