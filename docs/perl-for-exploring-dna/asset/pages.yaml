  md: '# Introduction: Explorations and Indexes


    # 1.5 Why Write Your Own Programs for DNA Analysis?


    Bioinformatics is still an immature field with many set unknown possibilities
    for new methods and equipment. There is plenty of room for inventing new procedures.
    Most sciences started off that way. Then as the various fields matured, equipment
    and procedures “fossilized,” and you can assume that researchers are no longer
    building their own. For example, chemists used to blow much of their special-ized
    glass, glassware, and chemistry departments often still maintain glass-blowing
    rooms, to the wonder of undergraduates who used to build their own gel boxes with
    supplies from the hardware store (clamps, panes of glass, and wires). Protein
    sequencing projects at one time began with building your own sequencer. Furthermore,
    there is a long tradition in science of using modular parts of equipment to invent
    new equipment. That means many science departments still have drawers and cabinets
    of glass connectors and odd bits of tubing—relics of a more inventive past. Bioinformatics
    is still very much at that invention stage. The metaphorical drawers and cabinets
    of software are still in use. Although it is true that some bioinformatics software
    can be taken and applied directly from the shelf, much of it remains to be written.
    The field is appealingly undeveloped (compared to other scientific fields) and
    open for fascinating, new approaches.


    Note that one of the following list of Sixteen Reasons to Write Your Own Code
    precludes:


    +   1. Using pre preexisting software, for example, there is no to rewrite a BLAST-like
    program for yourself if BLAST is what you need. Being able to program makes it
    easier to understand pre preexisting software—how it works and what its limitations
    might be.

    2. Getting professional programmers to write complicated software with thousands
    of lines of code, with intricacies that takes years of experience.


    # Sixteen Reasons to Write Your Own Code


    +   1. You have some really creative (so far unique) questions about genome structure
    and function and you don''t want to be held back by software.

    2. You like tinkering with things, taking them apart, putting them back together.

    3. You (like an old-time explorer) are adventurous and even fearless!

    4. Writing software is actually a hypothesis-building activity—because of the
    decisions and priorities that have to be made at every step.

    5. After using a commercial software package, you come up with additional queries
    that went beyond the capabilities of the software.

    6. You are in a working group that includes programmers and you''d like to communicate
    with them a little better. You want a better idea of what the possibilities are
    and how quickly they could happen.

    7. You might find that you really enjoy building software. In finding that out,
    you will get an even better rapport and empathy with programmers, further improving
    communication and team synergy.

    8. Want to get a better idea of when you to reinvent the wheel and when preexisting
    software is enough or tweakable.'
