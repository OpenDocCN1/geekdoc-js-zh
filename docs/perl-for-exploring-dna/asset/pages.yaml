  md: '# Box 11.6 Continued


    smaller ones. To programmers, DNA is easily abstracted to a string, and strings
    are searchable. Once you''ve introduced yourself, try some of your favorite questions.


    +   1. I''ve written a little section of a program that does ______, but there
    is more than one way to do this? The answer to that is so obvious that Perl programmers
    sometimes use an acronym for the triumphant answer: TIMTOWTDI, pronounced “Tim
    Toady”, which means “There is more than one way to do it.\n2. I want my program
    to do ______ Will I have to write that function myself, or do you know of a built-in
    Perl function I can use?\n3. My program is a little sluggish. Could my algorithm
    be causing a bottleneck somewhere? By the way, “sluggish” means it takes a second
    or two longer than instantaneous to return a result on a small test set. If that''s
    what your program does with a short sequence of DNA, it is going to be much worse
    with an entire chromosome or genome.


    In general, you, a novice in Perl, are going to be intriguing to your computer
    science colleague. Programmers love to show the capabilities of their favorite
    programming language, and they will enjoy your eager attention. Furthermore, most
    programmers like writing algorithms on the board, while drinking tall cups of
    caffeinated beverages; it is a sort of recreation. Being able to use some of the
    conventions in algorithm writing, described in this chapter, will help you bond
