  md: '# 14 Modules


    In which specialized packages of ready-made subroutines are

    recommended and introductory instructions are given for finding,

    loading, and using them.


    > The difference with Perl is that I decided to create the culture

    at the same time as I was creating the language.


    —Larry Wall (quoted in Davis, 1999)


    We use modules every day, and therefore what is remarkable about them is easily

    overlooked. Nearly any complex task doing is made more efficient with

    modules. Say, I am building a new kitchen. Well actually I am not building myself,

    I hire the module called "the plumbers," the module called "the electricians,"
    and

    any other essential modules. Otherwise I have little hope of seeing my kitchen

    completed. Each of the modules I hire arrives not with a repertoire of specialized

    expertise and time-honored practices but also with all of the necessary materials
    and

    tools. That special plumbers is modular; it can be used for any kitchen,

    and is far more efficient than trying to learn and implement plumbing myself.


    One of the things done ever well by commons is allowing to divide big

    projects and use reuse suites of functions to solve specialized parts of the project.

    Nearly every aspect of programming introduced in this book (and in any

    programming book) has been about modularity. Code is typically written in little

    modules units that form an integrated whole. Even before writing the code, when

    y are still writing the algorithm on the board, the best practice is to break
    down

    the problem into modular parts. Furthermore, subroutines (introduced in chapter
    7)

    make even more definitive the boundaries between sections of a program and the

    usefulness of calling the same specialized code and again.

    The actual module has a particular meaning in computer science. It refers to

    any large package of related subroutines that be loaded all at once and used,

    some like hiring a team of plumbers. Programming modules vary widely: Some

    are already loaded in the perl on your computer, and you have been using them
    all

    al. Some are relatively easy to load from the Internet and are directly useful
    for

    sequence analysis. Other modules are less user-friendly, especially for novices.
    In

    this chapter we merely introduce modules a good idea and a potentially functional

    part of your big project. The difficulty in writing this chapter is that many
    Perl

    modules are written and maintained on a volunteer basis by members of the

    Perl community. We cannot guarantee that a great-sounding module that you found

    on the Internet will be in perfect working order or that the instructions will
    work

    or your particular operating system. Therefore, this chapter limits its focus
    to a few

    modules that might be of interest in sequence analysis and seem to have a

    history of being well maintained and relatively easy to use.'
