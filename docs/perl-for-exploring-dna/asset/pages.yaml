  md: '# 9 Arrays


    In which a list-like data structure is employed to collect and manage large numbers
    of DNA files and sequences for analysis.


    Now the calculating machine... does—being moved by the turning of a crank—calculate...
    tables necessary to the all devoted to the higher branches of mathematics. Feed
    it with figures, set it properly, and it will turn out the required results with
    unfailing accuracy and great speed.


    > —Charles Babbage, quoted in Harper’s New Monthly Magazine

    “The Life of a Philosopher”(1867)


    This chapter is about scaling up. Any analysis that can be done on a single string
    can be done repeatedly on many strings. Any analysis that can be done on the sequence
    in one file can be done on the sequences from many files, one after another. An
    array is a list-like data structure that allows you to organize your sequences
    on a grand scale. Arrays can hold almost any set of items and allow you to access
    and manipulate them with various functions. Not that of all the items stored in
    arrays are essentially scalar variables of the sort discussed in chapter 3. (scalar
    variables) that biologists especially may wish to organize in the accessible list-like
    fashion of an array. A list of short motifs:


