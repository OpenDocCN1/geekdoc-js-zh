    # Box 5.3 The Library of Babel


    Now might be a great time to read or reread the wonderful short story by Jorge

    Luis Borges, "The Library of Babel." Various English translations that

    is found online or at the library. The story consists of a detailed, often

    mathematical description of a fantastic library of all possible books (of length

    410 pages) that can be created of 22 alphabet letters (the Spanish alphabet) plus

    a space, a comma, and a period for a total of 25 characters. "In vast library,

    there are no two identical books." And the number of books "thought

    out or nearly so. For example, "One... was made up of the letters

    MCV, repeatedly reinterpreted from the first line to the last.


    Yet the library contains books on every conceivable subject as well as those

    are conceivable.


    The minutely detailed history of the future, the angels'' autobiographies, the

    faithful catalogues of the Library, thousands and thousands of false catalogues,

    demonstration of the fallacy of those catalogues, the demonstration of the

    fall of the true catalogue, the Gnostic gospel of Basilides, the commentary on

    that gospel, the commentary on the commentary on that gospel, the story

    of your death, the translation of every book in all languages, the interpolations

    of every book in all.",.


    As usual, we are thinking of DNA. Consisting of combinations of a mere four

    letters, the catalog (or library) of all possible DNA sequences (of gene length,

    for example) is vast smaller than Borges''s library but nonetheless

    daunting if analysis is the goal.


    If we choose 3000 bases as the length of a typical gene (producing a protein

    of about 1000 amino acids) then the probability of any particular gene in the

    catalogue is 4 to the 3000th power (⁴³⁰⁰⁰), a far too great to have a

    ame. True, we do not have to deal with all possible random and therefore

    meaningless sequences, but until we understand DNA coding completely, we

    will always recognize the difference between noise and meaning. Natural

    selection sorts out quite a lot for us, although selection also provides

    loop of circular reasoning: The genes of successfully reproducing organisms

    m have sufficient meaning and a relative lack of random sequences to carry

    out the minimum necessary functions. That leaves the nontrivial task of

    analyzing what we mean by "sufficient," "relative lack," and "minimum nec-

    essary," which is much of what the work of DNA sequence analysis is about.'
