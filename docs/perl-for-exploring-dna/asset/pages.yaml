    # 4.1 Why Repeats Are Interesting


    # Mirror Repeats (MR)


    With your thumbs touching, hold out your hands as though to grasp a thick rope.
    The model for many DNA binding proteins, the mirrored structure seeking out (or
    actually happening upon) a corresponding mirror-like sequence in the DNA. Interestingly,
    the mirror may be in the form of an actual reflecting sequence as in this double
    stranded sequence


    ```

    ACGT-TGCAnCA-ACGT

    ```


    # Inverted Repeats (IR)


    The reflecting sequences could be more of a funhouse mirror, like, so that the
    double stranded sequence (called an inverted repeat) is


    ```

    TAGG-CCTA

    ATCC-GGAT

    ```


    Give that mirror sequence (both strands) a little twist at the pivot point and
    you have a straight mirror!


    ```

    TAGG-GGAT

    ATCC-CCTA

    ```


    Meanwhile notice that the properties of the original inverted repeat include the
    potential for internal base pairing, forming two hairpin-like loops or a cruciform
    shape. (The rest of the strand is represented with a stretch of As and Ts.)'
