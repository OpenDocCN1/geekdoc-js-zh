  md: '# Table 7.1 Erwin Chargaff, the First Bioinformaticist (He Counted As, Cs,
    Gs, and Ts)


    There are people who suffer from giddiness when watching the Milky Way for a long
    time on a clear night. Such people should not look into the cell nucleus.

    —Chargaff (1963, p. 90)


    Erwin Chargaff (1905–2002) has been assigned a rather limited role in the various
    retellings of the history of DNA. However, giving him some amount of credit is
    nearly unavoidable, given his eponymous numbers, A being equal in frequency to
    T and C to G. The astounding significance of these was noticed by Watson and Crick,
    after numerous trial-and-error attempts at model building Chargaff''s numbers.


    Erwin Chargaff is one of the overlooked great thinkers in the history of DNA.
    He has a subtle legacy of eloquence in the unfolding of molecular biology. We
    consider him the first DNA bioinformaticist, who is the counter of As, Gs, and
    Ts. Just as important, he was one of the first philosophers of DNA, devoting serene
    contemplation and eloquent writing on the question of what the sequences could
    make. He lived long enough to see many of his predictions come true. As early
    as 1947 he stated it “clear that whatever ‘code’ was carried by the nucleic acids
    must be imprinted on the sequential arrangement” (1963, p. 133). This was well
    before the nature of that sequence had been determined. It was that idea prompted
    Chargaff’s analysis leading to the publication of the Chargaff ratios A:T and
    C:G and a near miss at deducing the right of significance.


    In his Essays on Nucleic Acids, published in 1963 (10 years after the publication
    of Watson, Crick, Franklin, Wilkins et al.) with computation not yet applicable
    to the problem, Chargaff noted that although an alphabet of four or five letters
    may look meager, “the result may be oppressively informative.” He added that with
    “stepwise and orderly dismemberment,” the labor would be so slow that the cryptographer
    would find the sequence had evolved, and the analysis would begin again.


    In that same book of essays, Chargaff calls on the “modern disciplines” of “cybernetics
    and information theory.” It must have been gratifying to him to see in the last
    20 years of his life the great strides in acquiring and analyzing sequences and
    making it all so accessible at NCBI.


    # 7.2 Calling to and Returning from Subroutines: A Walkthrough


    Subroutines are small, modular sets of statements that perform one specific task,
    typically a task that you need to repeat a number of times. A subroutine can hide
    the sometimes messy details of a particular task. Once written, the programmer
    need only call for the subroutine to do its work whenever needed, thereby avoiding
    a duplicate of details each time the task is called for.'
