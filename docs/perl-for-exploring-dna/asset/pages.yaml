    ttheir resulting value, we are left with the expression:


    ```

    $ z = 5 - 4 + 6 ;

    ```


    Because we have completed all the multiplication and division operators, we move

    down the hierarchy again. Next, addition and subtraction are of the same precedence

    with a left-to-right associativity, thus the subtraction ($5 - 4$) is computed
    next rather

    than ($4 + 6$). Notice that in this case the left-to-right associativity makes
    a difference

    since $((5 - 4) + 6)$ ($5 - (4 + 6)$). Once all arithmetic is completed on the
