  md: "# Good Practices\n\nIt is considered wise practice to write documentation (#\
    \ comments) for each of the subroutines. Your documentation should give a short\
    \ SUMMARY of what the subroutine does (not how it does it), a description of each\
    \ of the items that are sent to the subroutine, as well as a description of the\
    \ value that is RETURN. In addition to the English descriptions, we provide a\
    \ sample style that makes your subroutines stand out as independent sequences\
    \ of code (e.g., a file in a filing cabinet) to facilitate the copy-and-paste\
    \ use of the subroutine in later programs.\n\n```\n#----------------------\\\n\
    # complement \\\\\n#\n# SUMMARY: This subroutine accepts a sequence of DNA and\n\
    # returns the complement sequence of DNA.\n# IN: a sequence of DNA (string scalar)\n\
    # RETURNS: the complementary sequence (string scalar)\nsub complement\n{\n   \
    \ my $dna = shift(@); # shift the string value\n    my $antiSense = $dna;\n  \
    \  $antiSense = $tr/ACGTacgt/TGCATGca/\n    return $antiSense;\n}\n#----------------------\n\
    ```\n\nBox 7.2 The Etymology of the Metasyntactic Variable Foobar\n\nWe come across\
    \ an amazingly exhaustive document from Donald Eastlake, Carl Uno Marcos, and\
    \ Eric Raymond (The Internet Society) on the etymology of the word foo. (http://www.faqs.org/rfcs/rfc3092.html)\
    \ Foo and its extension foobar as the diminutive bar are temporary names for variables,\
    \ introduced on the fly and before anything that go into assigning a more useful\
    \ name. Many computer scientists use foo and foobar without knowing anything about\
    \ their history. First-time programmers may be puzzled by the sudden appearance\
    \ of such metasyntactic (lacking proper definition) variables. Other such variables\
    \ include qux, quux, gault, fred, and syxzy.\nFoo may have originated in the 1930s\
    \ as a comic phrase, sounding vaguely Yiddish or Chinese. For example, foo appeared\
    \ often on signs and license plates in Bill Holman’s “Smokey Stover\" as well\
    \ as in Walt Kelly’s \"Pojo.\" As a result, foo became a trendy slang word in\
    \ the 1930s. Then it seems to have been picked up by the American military in\
    \ WW II."
