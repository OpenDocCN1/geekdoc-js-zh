  md: '# Box 7.2 Continued


    re-employed in a subversive backronym: FUBAR for “Fouled Up [or] Beyond All Repair”
    along related acronyms, such as SNAFU for “Situation Normal—All Fouled Up."


    Apparently in postwar years, foo and its derivatives (including the acronym F.U.)
    were adopted by early programmers as useful jargon, couched in boyish inside humor.
    Early spells were either foobar or fubar; one source of its spreading in computing
    may have been manuals from the Digital Equipment Corporation in the 1960s, including
    the backronym use of fubar for “failed unibius address register."


    Now that you know all of that, what might (a relatively novice programmer) do?
    There are several choices:


    +   1. Join the club and employ foo, foobar, and bar just like the experienced
    programmers do; that should include not leaving the names permanently in your
    code but using them only when you are sketching out ideas for code on the board
    and are at a temporary loss for a descriptive name.


    +   2. Make something more creative and distinctive. In fact, you could come up
    with your own signature metasyntactic variable names, such as termite or blueCar
    and glueTar to rhyme with foo.


    +   3. Do your part to deconstruct jargon, especially when it is part of the network
    of insider (often male-oriented) humor that pervades computer science. Most programmers
    do not know the etymology of foo, so you can be the first to explain it in detail
    to them.


