  md: '# Using Perl to Do Calculations


    # 81


    Because the precedence hierarchy is not something that is easy to recall, programmers
    often get lost on paper. enter their arithmetic statements as they would do algebraically.
    But of course, Perl forgets the correct order of operations, a small error on
    your part can lead to wildly incorrect results.


    ```

    ## raise negative two(-2) to the fourth power (the wrong way)

    $z = -2 ** 4; # WRONG! before unary(-), so does = (-2**4)

    $z holds -16 (+16 !)


    ## raise negative two(-2) to the fourth power (the right way)

    $z = (-2) ** 4; # RIGHT!

    ```


    In this example, exponentiation comes before unary minus; if you do not use parentheses
    to force the unary minus to do its work, you end up with a result of -16 rather
    than +16! Note the lack of parentheses is not far as Perl is concerned. You should
    not expect Perl to halt your program and give you an error message. The statement
    is syntactically correct (and that is all the interpreter checks), but it is logically
    wrong. This is not cause for alarm if you are writing Perl programs on your own
    desktop computer; however, if this line of code is part of a system that is dripping
    medicine into your arm, we can agree that -16 units of medicine is not a good
    thing.


    # Good Practices


    (Always use parentheses!) The outset, when you are entering mathematical equations
    that involve more than one operator, we recommend that you get in the habit of
    using parentheses to surround each set of (operator operand). Although it is very
    important that you learn the order of operations so you can correctly interpret
    Perl written by others or even your own, this is one area where humans succumb
    to the unforgiving but consistent nature. A good practice when dealing with complicated
    mathematical equations is to write down the formula on paper and insert parentheses
    around the operations you expect to occur first, working outward surrounding combined
    operations within parentheses, and so on.


    ```

    $z = $a - 4 + $b * 2 / $sc; # ambiguous to a human!

    $z = $a - 4 + ( $b / 2 ) / ($sc $sd); # much better

    ```


    Two important features of writing good programs are readability and maintainability.
    Readability means that a program is easy to interpret on a statement-by-statement
    basis. The programmer who considers readability is ever conscious of a future
    programmer who will be reviewing the program at a later time. Often the future
    programmer is yourself! Maintainability goes hand-in-hand with readability: a
    readable program is a program that is easily altered, updated, and maintained.'
