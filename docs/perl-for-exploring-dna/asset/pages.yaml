  md: '# Table 4.1 Continued


    Irregular, Imperfect, or Mismatched Repeats


    The vast majority of repeats have one or more mismatches. These are computationally
    challenging because of the many decisions that must be made in searching for them.
    For example, how many mism will be allowed per string and if there is not one
    way to make a match, which one will be used? These are some of the same issues
    encountered in any string comparison for analyzing phylogenies and relatedness.


    # 4.2 How Comparable Are These Two Word Lists?


    A list of words from an English dictionary and a list of seven-letter DNA motifs
    of E. coli are not directly comparable at all. However, they are useful as introductory
    datasets for learning regex syntax and thinking about how pattern matching might
    be applied to DNA sequences. The beginning of each of the two lists are shown.
    The list of DNA motifs (words) was generated artificially from all possible 7-mers
    of the E.coli genome. It is a list with little meaning in and of itself, a collection
    in which all seven-letter motifs that appear in the E.coli genome are considered.
    That is not to say that none of these 7-mer motifs are without meaning. A few
    DNA motifs (of this length) have had their functions worked out and demonstrated
    in the Lab. For example, some are protein-binding sites and some are restriction
    sites; however, the majority of short motifs remain to be analyzed, and generating
    motif lists from a genome is merely one small step.


    The list of English language words is full of meaning to any native speaker. It
    serves as a sort of familiar, comfortable grounding for the first forays into
    pattern matching. However it is not meant to be directly analogous to the DNA
    motif list. Any English words that you “discover” will already have well-established
    meanings. In fact, in this chapter you are not making of a discovery at all but
    testing your ability to write an accurate statement using the regex syntax. This
    is quite important because regexes carelessly written can return bad results quickly,
    and it takes some practice and vigilance to spot the errors. In this case, we
    use our knowledge of English to spot the successful searches and the errors (if
    any).


    ```

    english.txt

    A

    a\aardvark

    aardwolf

    Aaron

