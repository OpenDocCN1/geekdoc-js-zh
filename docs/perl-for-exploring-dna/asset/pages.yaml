  md: '# 118 Perl for Exploring DNA


    As you have seen in earlier chapters, Perl supports a large number of built-in
    functions (or subroutines). For example, you can call the function square root
    by typing sqrt in your program. The hidden calculations to perform a square root
    are done behind the scenes, yet the result is returned to your program. The various
    string analyses that have been introduced previously, such as length, substring
    (substr) and index, are all built-in Perl functions. The focus and strength of
    any programming language is in part due to the nature of such built-in functions.
    Perl''s popularity for handling strings is due to its strong, comprehensive, and
    efficient list of string-focused functions.


    If Perl does not have the built-in function you are looking for, it may still,
    having been written and archived by some member of the Perl community. There are
    many Web sites devoted to the distribution of subroutines, written in response
    to particular needs. Each subroutine extends the Perl language, packaging behaviors
    that are labeled with meaningful symbolic names. Also available are packages of
    interrelated subroutines, called modules, which we will introduce in chapter 14.


    Finally, if neither Perl nor the community has the built-in function or subroutine
    you are wishing for, you can write it yourself. In the long run, taking the time
    to write a subroutine is more efficient and much safer than taking the same piece
    of code over and over for some repetitive action.


    # 7.1 How to Find and Use Existing Subroutines


    One of the common questions concerning subroutines is, "How do I know if a subroutine
    has already been written?" is a good question and one we recommend that you often
    ask. Clearly, if a subroutine already exists and you find out, avoid rewriting
    it. Chances are good that if it is a built-in function (or a function that exists
    in an external module that you can load into your program; see chapter 14), the
    function works correctly and has survived some review that deemed it worthy. In
    fact, like the buttons on a scientific calculator, the built-in functions are
    built because programmers like you appreciate the abstraction that furnishes the
    functionality without having to know the details.


    In addition to this book and other more comprehensive versions of Perl, you can
    search the web using the phrase "Perl functions by category" to find groups of
    functions that are related by their functionality, for example, "operate on scalars,"
    "operate on numbers," and "regular expressions and pattern matching." Such a search
    will reveal a list of functions for you to consider, including but not limited
    to


    Functions for scalars or strings


    ```

    chomp, index, length, reverse, substr, tr///, uc...

    ```


    Regular expressions and pattern matching


    ```

    m//, pos, s///, split...

    ```


    Numeric functions


    ```

    abs, cos, exp, int, log, rand, sin, sqrt, srand

    ```'
