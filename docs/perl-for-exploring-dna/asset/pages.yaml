  md: '# Box 3.1 The Perl Community


    The fact that there is something called “the Perl community” says as much about
    the open and congenial nature of the Perl language and its users. To get a glimpse
    of it, you could join one of their online email lists and read some posts, essentially
    lining in. For example, look for the Perl Mongers site that has links to many
    regional groups. The dialogues will likely be loaded with jargon and queries about
    especially difficult problems. For example, “I bet you can work around by saving
    STDOUT, reopening it in IO::tee and having IO::tee output to the file and the
    saved STDOUT.” When they are planning going out for bears, the exchange of posts
    can sound as though they are planning an essentially technical expedition to the
    peak of Mount Everest.


    Should you make amateur queries on a professional Perl discussion group? The answer
    could be overly technical and even bit sarcastic. It might be better to go to
    one of the many Perl tutorials and do some lookups.


    Keep an eye on the discussion lists for speakers stopping in town. Some of the
    many innovators of Perl enjoy stopping in a “technical meeting” and either giving
    a talk or just conversing about Perl. You may never get enough to become part
    of the main dialogue, but you may get something out of attending one of the talks.
    If you are feeling more intrepid you can find out when the next YAP (Yet Another
    Perl conference) is to be held and attend.


    The Perl community provides an important service for all of us, no matter how
    amateur our use of Perl might be. The community has stockpiled and annotated lots
    of useful code and suggestions for putting together programs. It is easy to make
    queries and look up bits of code that are actually called look ups. Make queries
    for code at Perldoc.com; for many different useful links to Perl.


    # 3.2 Controlling Output


    Controlling how the results from your Perl program appear in the output window
    is an important part of programming. Although your program might take minutes
    or even hours to search and compute, the output from your print statements are
    your only source of knowing how your program is proceeding and if your final results
    are correct. It is always worth the time to write neat and explicit messages to
    print your programs. Later, as you write complicated programs, the practice of
    writing good print statements will serve you.


    Each print statement literally outputs the message between the double quotes,
    but unless told otherwise, each print statement continues printing the previous
    message ended. But differently, a series of print statements will continue to
    print on the same line even if they are on separate lines of code, as shown in
    the file testPrint.pl and the associated output.'
