    # Who Are You, the Reader?


    If you are a novice programmer, perhaps a biologist who is interested in trying
    Perl (which you''ve heard many wonderful things about) to do a little pattern
    matching with DNA (or protein) sequences, this may be a fruitful beginning.


    If you are a Perl wizard, perhaps you are quickly leaf through this book out of
    curiosity, the word Perl in the title having caught your eye. Let us know what
    you think!


    If you are already a computer programmer in other languages, this book might be
    a little too easy for you. However, you may discover within appealing ways to
    present Perl to your own students or colleagues, and you may not be familiar yet
    with all of the sequence applications that we suggest throughout.


    If you are a “wordie,” an enthusiast of anagrams and other word play (as we are),
    or if you are a linguist experimenting with string searching to analyze texts,
    you may enjoy our attempts to mirror language examples with DNA examples. At the
    very least, you could build your own anagram finder, just for fun.


    # For the Instructor


    All Perl source code contained in this book can be downloaded from the companion
    website: www.oup.com/us/perlforDNA.'
