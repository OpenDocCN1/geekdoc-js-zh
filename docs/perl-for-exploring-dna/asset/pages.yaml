  md: '# 9.8.3 Parsing FASTA Format Header Lines


    DNA sequence files in FASTA format begin with a header line, an initial line providing
    information about the sequence found in the file. The header line often begins
    with a greater than character (>), and the individual pieces of information in
    the header line are typically separated by a delimiter character, often a vertical
    bar (|sometimes called a pipe). A sample header line is delimited by pipe characters
    (|):


    ```

    >gi|49175990|ref|NC_000913.2| Escherichia coli K12, genome

    ```


    The regular expression in the split function can match each pipe character, access
    the individual substrings of information between the pipes, and return the substrings
    in a list context to be stored individually, as shown in the following example.


    ```

    $header = `gi|49175990|ref|NC_000913.2| Escherichia coli K12, complete genome`;

    chomp($header); # remove newline if any

    my @headerFields = split(/\|/, $header);

    my $NCBI_number = $headerFields[ 3 ];

    my $description = $headerFields[ 4 ];

    ```


    print The fourth item in the header is: $NCBI_number \n"

    print The fifth item in the header is: $description \n"


    > Note that the pattern in the regular expression contains the pipe character
    (|), but because this character is part of the regular expression syntax (to allow
    multiple possible matches, match this "or" that), we must precede the pipe character
    with a backslash (\). Thus, the combination of (\|) means that we really mean
    the pipe character should be matched as the delimiter or in other words, do not
    (\) as a regular expression or-symbol.


    # 9.8.4 Converting a String into an Array of Characters Using Split


    The split function makes it easy to break a DNA sequence into individual nucleotides
    or a protein sequence into individual amino acid symbols and store each individual
    item into an array. In this case, you split on "" (//), being a default way to
    divide a string into individual characters. In the example that follows, split
    breaks the protein sequence apart and stores each symbol into the cells of the
    array @proteinSymbols.


    ```

    # split on the empty pattern; returns individual letters

    $proteinSequence = "FAMILY"; # hydrophobic AAs

    my @proteinSymbols = split ( //, $proteinSequence );

    ```'
