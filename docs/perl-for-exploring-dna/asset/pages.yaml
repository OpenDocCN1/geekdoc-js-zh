    # 10.3 Hash Tables in Memory


    With hash tables, you are not guaranteed that the order in which (key, value)
    pairs inserted will be identical to the order stored in the hash. The order in
    which (key, value) pairs are loaded into a hash table depends on the internal
    (hidden from us) hashing algorithm used by the Perl implementation. For the time
    being, rest assured that the (key, value) pairs do indeed get loaded and can be
    retrieved in a very efficient (fast) fashion.


