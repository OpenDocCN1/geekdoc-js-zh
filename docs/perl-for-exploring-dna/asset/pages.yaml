    # 4.1 Plunging In with Regular Expressions


    We would argue that all DNA sequence analysis is one form or another of pattern
    matching (The rest is indexing as we we presented in chapter 1.) Whether you are
    comparing sequences to build phylogenetic trees or to determine their identities,
    you are looking for similar patterns. Therefore we take the unconventional step
    of introducing a powerful syntax for pattern matching immediately. The tools are
    called regular expressions or regex for short. Many different languages use regex,
    however they fit especially well within the syntax of Perl. In examples of this
    chapter, the regex will be embedded within Perl languages. Don''t worry that you
    do not know all the Perl in these examples. At this point you will be using verbatim
    a Perl program that we''ve already written, and you will just focus on play with
    the entertaining parts of these programs, that is, the regex. Look at any other
    book on Perl and you will find regular expressions in the later chapters because
    they have been traditionally considered advanced topics. However for DNA sequence
    analysis, regexes may be exactly what you hoped for. Therefore, we start here
    with the instant gratification of a sweet dessert (regex) and move on to more
    of the meat and potatoes main course in the next chapter.


    If you have skimmed ahead to this chapter, failing to stop at chapter 2, back!
    You cannot play with our regex examples until you have installed Perl and a Perl
    programming environment on your computer.


    The particular datasets that we would like you to play with were generated or
    captured by us for the purpose of showing off the powers of regular expressions.
    You will find the data in the form of two lists on the Web site accompanying this
    book. One is a generation of all possible 7-mers (heptamers or seven-letter "words")
    composed of As, Cs, Gs, and Ts from the entire genome of the bacterium Escherichia
    coli (E. coli). To produce it, we shifted a seven-base (seven-letter) window,
    one at a time, through the entire genome, listing all of the 7-mers, one word
    per line. We treat the E. coli 7-mer list like a word list. It is roughly comparable'
