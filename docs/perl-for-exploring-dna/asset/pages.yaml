  md: 'Using Perl to Do Calculations


    # 5.1.1 Examples of Operators in Action


    Some examples will help reinforce the rules that Perl follows when handling a
    statement involving these operators.


    ```

    $x = 2 + 5 * 4;

    # (22) multiplication before addition: 2 + (5 * 4)

    $y = (2 + 5) * 4;

    # (28) parentheses force addition first

    $z = 3 * 5 * 2;

    # (30) left-to-right: (3 * 5) * 2

    $x = 2 ** 3 ** 2;

    # (512) right-to-left: 2 ** (3 ** 2)

    $y = 1 + 2 * 3 - 4;

    # (3) means: (1 + (2 * 3)) - 4

    $z = 5 - 4 + 3 / 2 ** 1 ** 0;

    # (7) means: (5 - 4) + ((3 * 2) / (1 ** 0))

    ```


    Becoming comfortable with the operator precedence, associativity, and overall
    order of operations is a crucial element when writing good Perl, but do not be
    discouraged if this takes practice. In this spirit, we offer a step-by-step trace
    of a relatively long arithmetic statement:


    $z = 5 - 4 + 3 / 2 ** 1 ** # not a nice expression


    Notice that this statement has five different arithmetic operators. Two sets of
    operators have equal precedence, so we must be careful to set each in the correct
    left-to-right order. Referring to the table of arithmetic operator symbols, first
    find all expressions within parentheses. Because there are no parentheses, we
    move down the table to the operator with the next highest precedence, exponentiation
    (**). Exponentiation has right-to-left associativity, so we must start with the
    rightmost exponentiation. In this case, there is only one exponentiation, so that
    is performed (1**0). Recall that any number raised to the power of zero is has
    one (1). In the table below, notice that the expression (1**0) is now replaced
    by the resulting value of that expression. We recommend that you practice deciphering
    arithmetic expressions in this manner. Having completed all exponentations, we
    move down the precedence hierarchy to the next operator, the unary minus. The
    next set of operators: (* /, %, which is multiplication, division, and modulo).
    All three of these operators have the same precedence and a left-to-right associativity,
    thus (3*2) is computed rather than (2/1). Clearly, 3*2 computes to a six (6) and
    that result is used as the left operand to the division operator (6/1),'
