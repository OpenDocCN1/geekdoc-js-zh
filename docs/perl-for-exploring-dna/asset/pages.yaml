  md: '# 11.3 Writing Algorithms


    Beginning programmers often wonder, “Why bother with an algorithm on the whiteboard?
    Why not sit down at the computer and start hacking the program? If it doesn’t
    run immediately, just keep making tweaks and adjustments until it does.” Actually
    some small programs can be written on the fly, and plenty of programmers write
    them that way. However a better answer to the question, “Why bother with an algorithm?”
    is the following.


    +   1. Lots of little experiments (followed by tweaks and adjustments) on a hastily
    assembled program may end up telling you about your particular program and your
    chosen (hastily assembled) data set. You may never discover wonderful alternative,
    faster, more elegant solutions.

    2. Putting together several approaches and writing them up on the board in algorithmic
    style gives a group of interested colleagues the opportunity to discuss, compare,
    contrast, and brainstorm. It is less likely to happen if the group is forced to
    look over your shoulder as you hammer away on your keyboard.

    3. Many programs are long, often hundreds to thousands of lines. It will take
    days or weeks to produce them in workable form. It is much quicker to write an
    algorithm and hand trace the steps, looking for ways to make improvements and
    trying to spot errors in logic ahead of time. Hand tracing is when you play the
    part of the computer, recording each update to each variable, array, or hash as
    you walk through your algorithm. Force yourself to trace the algorithm all the
    way to the end, not just the tricky parts. That might avoid a tiny, boring (but
    fatal) problem that just happened to be at the end.

    4. From your point-of-view, as the reader of this book, it is possible that as
    a biologist in an interdisciplinary group, you might find yourself writing mostly
    in pseudocode to communicate with other group members who will actually write
    the lines of Perl.


    | Box 11.3 Importance of Beauty II |


    There is beauty in the tension between efficiency and understandability. You want
    to write code that makes optimal, efficient, and economical use of Perl’s features;
    you don’t want your program to look rigged up and convoluted like an intricate
    Route Goldberg scheme. The path from A to B should not be full of detours. Code
    should be crisp and even a bit laconic.

    In seeming contradiction to common advice, sometimes you do have to reinvent the
    wheel. Maybe Perl has what you need or you are willing to stretch what you need
    to fit Perl. However, in some cases you may want to start from the beginning,
    tossing out all of the assumptions and rigging up your own little invention with
    duct tape and clothespins.'
