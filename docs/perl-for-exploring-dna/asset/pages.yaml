    Box 10.2 Chargaffian Clues ...or Things That Don''t Add Up

    The of the puzzles in the deciphering of Egyptian hieroglyphs was that the numbers
    just didn''t add up. On the Rosetta stone were 14 lines of hieroglyphics corresponding
    to 18 lines of Greek. The Greek section had about 500 words, but the hieroglyphics
    had about 1,400 signs or glyphs. The glyphs were not simple pictograms with a
    one-to-one correspondence with words. Furthermore, each glyph was comprised of
    signs. In the entire text, only 66'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'signs were used over and over in various combinations. Yet these appeared not
    be used phonetically, like individual letters and sounds. The puzzle was solved
    with the realization that the glyphs are combinations (often highly redundant),
    or both phonetic and pictorial information.


    What does this have to do with DNA? Many numbers and facts about DNA sequences
    do not add up (yet). The first and most notable numerical problem was Chargaff''s
    numbers. Dismantle a double helix and the component bases. The frequency of As
    will be equal to the frequency of Ts; the frequency of Cs will be equal to the
    frequency of Gs, which is a Biology 101 lesson about DNA. At one point, the significance
    was lost on many researchers including Watson, Crick, Wilkins, Franklin, and even
    Chargaff himself. Rebuilding a crooked and bumpy DNA model, using Chargaff''s
    numbers, were the eureka moment in early 1953 for Watson and Crick. Suddenly the
    model helix became a smooth cylinder as bases were aligned and linked in proper
    symmetry and Chargaff''s numbers were transformed into the canonical pairings
    of A:T and C:G.


    Other problems might be considered "Chargaffian clues". These are situations that
    do not quite make sense or add up and which suggest that data are missing or alternative
    points of view are still forthcoming. We include on the list the following examples
    from research on promoter regions.


    To summarize all of these, the lack of extensive conservation of promoter and
    enhancer motifs does not make sense if the goal is to think of them as linear,
    vectorial two-dimensional information, a paradigm that has worked for genes.


    +   1. There are many well-studied and seemingly well-positioned and essential
    short (10 bp or fewer) motifs in gene promoters. Much lab research in gene regulation
    has often cover much more than 10 bp, and nonspecific, fuzzy binding across longer
    sequences may be significant.


    +   2. Many lab assays for gene regulation are about turning on or off a particular
    by inserting or deleting a motif in the promoter. However the promoter information
    may be highly modular and interchangeable. It may be possible to form syntactically
    correct and functional “sentences” in the promoter that are nonetheless nonsense.
    We have called this the Mad Libs paradox, after the children''s game in which
    humorous, syntactically and grammatically correct sentences are formed by inserting
    various words. The result might be nonsense, such as “The tree act my uncle.".


    +   3. The search for a minimal functional size or consensus sequence for a particular
    promoter motif may yield results but may not reflect the real use of a particular
    motif. We have called this classified ad or Vanna White paradox. Note that “3
    brdm apt” is readable and might represent a minimal functional size of readability
    in a classified ad. Furthermore, if Vanna White reveals EL_PH_NT, perhaps we see
    the minimal functional size of the full word elephant. However by focusing on
    minimal functional size in a genome (or in any language) the subtle nuances of'
