  md: '# 9.3 Motivation for Using Arrays


    Suppose your group needed to run some experiments on prokaryotic genomes. Following
    good software engineering advice, you decide to start with just three genomes
    to ensure that you can successfully open the genome data files and check that
    your logic and math are correct. You might store the names of the files containing
    the FASTA format genome data in one scalar variable per genome.


    ```

    my genome1 = "Bacillus_anthracis_str_Ames.fna"

    my genome2 = "Escherichia_coli_K12.fna"

    my genome3 = "Pyrococcus_furius_DSM_3638.fna";

    ```


    Assuming that your experimental tests on these three genomes go well, your group
    leader peers over your shoulder says, "Great. Now can you make that work for the
    200+ bacterial genomes available at NCBI and why not include the scores of Archaea
    genomes as well?"

    as you look at the Perl, you suddenly get this awful image in your head of the
    following:


    ```

    my genome001 = "Acinetobacter_sp_ADP1.fna";

    my genome013 = "Bacillus_anthracis_str_Ames.fna";

    my genome102 = "Escherichia_coli_K12.fna";

    my genome179 = "Pyrococcus_furius_DSM_3638.fna";

    my genome214 = "Zymomonas_mobilis_subsp_mobilis_ZM4.fna";

    ```


    Clearly, this is a programming nightmare. If you were to get this program to work
    with all these independent variables, what would you do if your group decides
    to remove all the Gammaproteobacteria genomes? This is a classic case of a program
    that works versus a program that has been designed to handle the general case.
    In this example, we need a program that works for any number of genome files and
    in a data structure without having to change the program to accommodate the varying
    number of files on a particular run.

    take-home story from this example is that scalar variables are alone not sufficient
    to store a list of many related items, especially when you need to write a program
    that can operate on those items one at a time. The next section reveals a solution
    for holding multiple file names by using an array.'
