  md: '# Understanding Randomness


    In which certain hazards of sequence analysis are noted, including attaching too
    much significance to discoveries and not being sufficiently cautious about “controlling”
    experiments for background noise with randomized datasets.


    > Indexes...a place where the pleasure of sorting and ordering meets the opposite
    pleasure of the random, the inconsequential, and the chancy.

    —Byatt (2001)


    Most people do not have an intuitive understanding of randomness and, including
    ourselves, are susceptible to seeing and believing in the existence of patterns
    in random sequences. This can be a major challenge in DNA sequence analysis. Whether
    a pattern pops out to the naked eye or is revealed by pattern-seeking software,
    there is a great risk of misinterpreting the meaning of DNA sequences.


    # Our Intuition about Randomness Can Fool Us


    Try this. Hand out two sheets of blank paper to each of several people. Their
    assignment is to write on one sheet of 100 Hs and Ts, representing heads and tails
    of a coin flip, producing a sequence that looks as random as possible— enough
    to fool you into thinking that it was not thoughtfully produced by hand, letter
    by letter. On the second sheet they record the results of 100 fair coin tosses.
    This will be another string of Hs and Ts, this time a result of mindless, random
    tumbles and falls.


    Now go from person to person and glance at each of their sequences. Try to guess
    which is the true sequence (the one generated from 100 tosses) and which is the
    false sequence (the one created by letter). What is your trick for doing so? Look
    for the longest of Hs and Ts and most likely those will be in the random sequence.
    Most people, in constructing a random-sequence, cannot bring themselves to run
    as long as HHHHHHHHH because it looks too much like a pattern and they know that
    patterns are not supposed to show up in random coin tosses. In fact, the reality
    is the opposite, and random sequences may be dangerously loaded with pattern-like
    strings.


    Now this. If you have acquaintances who regularly play a lottery game and who
    consider themselves fairly astute at choosing numbers wisely, ask them: what is
    a better number to play, 33333 or 43723? In many cases, the latter will be chosen
    as the more appealing lottery choice because patterns like 33333 seem too'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'meaningful and therefore too improbable. Of course, the chances of getting
    either sequence are identical. Next, ask the lottery players whether they would
    reuse today''s winning number again the next day. Irrationally, the answer is
    “no, of course not” on grounds that the lucky number had its win and is no longer
    due for winnings in the near future. However, the winning number has no greater
    or less probability than any other for being drawn on the very next day. Disconcertingly,
    one can even ask these questions of students in a statistics class and discover
    that they have not lost any of their irrational instincts at choosing lottery
    numbers.


    In many programs you might be writing for sequence analysis it is essential to
    run the same program on random strings of DNA to get a better picture of what
    is the potential significance of a sequence in your experimental string.


    # 13.1 Using rand to Generate Random Sequences


    A Perl function called rand can be rolled like a die to yield a pseudo fractional
    number from a specified range, for example, 0 to 3. This fractional number may
    be truncated to an integer, converted to a particular nucleotide or amino acid,
    and then concatenated onto the end of a string. Why pseudo-random and not random?
    A true random number is impossible to generate by any algorithm. Casti (1995)
    defines a string as random if there is no rule for generating it that uses a shorter
    string to write down the rule. Essentially, that means that a true random number
    is maximally complex. The Perl function rand does not have a maximally complex
    method to seek a nearly perfect random number. Instead it has a sophisticated
    algorithm that is good enough for most purposes. However, if you generate an entire
    string of DNA with rand, one nucleotide at a time, it is best not to trust the
    first string you get as being sufficiently random. In experimental fashion, plan
    to generate hundreds to thousands of random strings for comparison to get a better
    approximation. From this point, when we say or imply “random number generator,
    we mean pseudo-random.


    # rand (EXPR)


    The rand function returns a random fractional number greater than or equal to
    zero and less than the value of EXPR. The value of EXPR should be positive and
    if omitted the value 1 is used, generating a fractional random number between
    zero and one, not including one. Because rand returns a fractional value, you
    should apply int to the returned value to convert the result to an integer. You
    may know that all random number generators need to be seeded before generating
    random numbers (i.e., primed to start). Perl has a function called strand, but
    rand calls strand automatically for you on the initial call to rand, so you do
    not need to explicitly call strand yourself.'
