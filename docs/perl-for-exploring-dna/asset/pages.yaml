  md: '# Box 14.2 Fonts for DNA


    What if there was a module (perhaps a collaboration of a Perl programmer and a
    type designer) that improved the readability of a DNA sequence, perhaps with a
    range of fonts or symbols for types of analyses?


    The letters A, T, C, and G are far from ideal as graphic representations of DNA.
    The use of these letters is merely serendipestinous, a consequence of the initial
    letters of the chemical names It strains the eyes to scan DNA sequences, trying
    to count bases or spot a particular motif or triplet that is not necessarily-our
    fault.


    ```

    ATCGGTATCACTAGGGGCATCAAAAGTCTCTTTGTACGACGATACG

    ```


    The Cs and Gs are essentially identical. The single leg of the T disproportionate
    white space in the line. Depending on what letters it is next to, the A sometimes
    appears to be hiding and other times to form a mountainous landscape. What would
    be better? Almost anything.


    We think that there is considerable room for a clever font designer to explore
    some other possibilities. Simply trying out the range of fonts available on your
    word processor is a start. Note that included with your font collection is probably
    at least one set of symbols, as Zapf Dingbats by prolific type designer Hermann
    Zapf. It may be that symbols would be a better system. Or a different alphabet
    would work, such as the ancient Celtic system of Oghams could be used to write
    on.


    A couple of examples are presented in the Pattern Book edited by Clifford Picker.
    Ulrich Melcher suggests a Braille-like representation for DNA that deliberately
    emphasizes and sharpens the differences between the four symbols. Thomas Schneider
    “sequence logos” by which letters of varying heights symbolize the probability
    of a particular base appearing in a sequence.


    All this is to say that we do not have to settle for the usual sequence presentations
    of nucleotides. It might be an interesting interdisciplinary project to invent
    something better and present it as a module.


    # 14.3 Searching the CPAN


    The easiest way to find what modules are available on the CPAN is to use the CPAN
    Search Site, located at search.cpan.org. Some of the modules are categorized and
    available from links on the main page: Data and Data Types, File Handle Input/Output,
    World Wide Web. A more direct approach is to use the search field to find modules
    that match a specific keyword or words


    # 14.3.1 Searching for WWW : Search : : PubMed


    As an example of searching for modules on CPAN, go to the CPAN Search Site and
    search for PubMed. This will search the documentation for modules on CPAN,'
