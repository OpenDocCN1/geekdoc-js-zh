    The printf statement, somewhat cryptic, can facilitate the formatting of

    y output. Your built-in function prints a formatted string by giving you more

    control over how you would like your real numbers, integers, and strings to appear.

    A quick example can reveal a primary reason you would use the printf function.

    The printf statement below prints one-third (1/3) in six spaces: two leading

    blank spaces, a zero, one of the total six spaces taken up by the decimal point,
    and

    no (2) digits after the decimal point.


    ```

    $sa = 1 / 3;

    print "Unformatted: %a \n"

    printf "Using printf: %6.2f \n", $sa;

