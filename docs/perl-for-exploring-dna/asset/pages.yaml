  md: '# Your First Perl Programs with a Focus on String Analysis


    testPrint.pl


    ```

    #!/usr/bin/perl

    use strict;

    use warnings;


    print "one";nprint "two";nprint "three";

    ```


    ![](img/7faeba5fa4e60c11fd52ee03d48c0344_34_0.png)


    To force a subsequent line of output to begin on a new line, you can output a
    new line character by explicitly ending your message with \n. The backslash-n
    combination is referred to as an escape sequence. The backslash informs the print
    statement that the next character is not to be interpreted as the normal alphabetic
    letter n but rather the special character that forces the output to the next (new)
    line. If we add \n to the end of each of the Perl print statements,


    ```

    print "one \n";nprint "two \n";nprint "three \n";

    ```


    we will produce the following output


    ![](img/7faeba5fa4e60c11fd52ee03d48c0344_34_1.png)


    Each \n combination forces any proceeding output to begin on the new line. It
    is possible to use more than one in a print statement, as shown in the next example.
    To ensure that you understand both the absence and use of \n, carefully read the
    Perl print statements in the next example and compare your expected output with
    the actual output.'
