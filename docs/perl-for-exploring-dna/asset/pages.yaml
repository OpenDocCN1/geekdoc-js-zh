  md: "# 9.9.1 Preparing Tab-Delimited Output with join\n\nOne example where we like\
    \ to use join involves preparing a list of items to print an output file where\
    \ we want each of the individual elements to be separated by a tab (\t). As we've\
    \ seen before, tab- or comma-delimited output is especially useful when we open\
    \ the output of your Perl program with another tool, such as the Excel spreadsheet\
    \ program.\n\n```\n# assume filehandle $TO_EXCEL is already established\n# join\
    \ multiple values into one tab-delimited string to print\n# to Excel\n\n$line\
    \ = join(\"t\", $genus, $speces, $percent_G, $percent_C );\nprint $TO_EXCEL \"\
    $line \\n\";\n```\n\n# 9.9.2 Converting an Array of Characters into One String\n\
    \nThe join function makes it easy to create a string from individual characters\
    \ stored in an array. Each character stored in the cells of the array @shuffledNucleotides\
    \ will be joined (with nothing, the empty string) into one string.\n\n```\n# join\
    \ individual letters into a sequence\n$randomSequence = join('',', @shuffledNucleotides);\n\
    ```\n\n# 9.10 Sorting Arrays\n\nsort [USER_SUBROUTINE_NAME] LIST\nThe sort function\
    \ arranges the values found in LIST and returns the list in sorted fashion. By\
    \ default, the sort function uses standard string comparisons to determine if\
    \ one item should appear before another. Thus when the items you want sorted are\
    \ not strings, additional care must be taken.\n\n# 9.10.1 Sorting Arrays of Strings\n\
    \nThe most straightforward use of sort is the sorting of string values within\
    \ an array."
