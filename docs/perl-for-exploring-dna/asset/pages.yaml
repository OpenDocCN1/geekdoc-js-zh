    # 5.1.2 Unary Minus


    The unary minus (negation) operator is somewhat of an anomaly. Intuitively, we
    use

    it all the time, for example, when we write "negative five," — 5. Specifically,
    this

    negation operator is unary it operates on only one operand, that is, it negates

    the sign of the value to the right. This is as opposed to the costly binary operators

    like subtraction that operate on two operands. Like exponentiation, unary operators

    hare handled from right to left. Thus, you must handle each unary operator that
    you

    ncounter in each statement starting on the right and working towards the left.


    ```

    $x = -5;

    $ x now holds a negative value (-5)


    $y = -$x;

    $ y holds negated value in $x, thus -(-5) or (positive) 5


    $z = -$x + 1;

    $ x holds -5

    $ z now holds (-5) + 1 or six (6)

    ```'
