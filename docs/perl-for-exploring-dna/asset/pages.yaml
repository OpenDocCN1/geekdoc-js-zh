    Alternatively, we could use an array to hold these motif counts, yet an array
    is not able to facilitate the mapping from motif (string) to count (integer).
    Recall that when using arrays, a particular cell in the array must be referenced
    by an integer:


    ```

    @arrayOfMotifCounts;

    $arrayOfMotifCounts[ 0 ] the initial cell in the array indexed by the integer
    zero

    $arrayOfMotifCounts[ $1 ] the 1th cell in the array where $1 holds some integer

    ```


    In an array, it would not be clear which motif-count pair would be represented
    by a particular cell, which motif''s count is stored at index zero, $arrayOfMotifCounts[0]?
    With hash tables, references to particular cells can be handled with the more
    intuitive key (e.g., ATTT).


    A final significant point is that a hash table provides efficient and fast access
    to a data item of interest. As we''ve seen in the previous discussion of parallel
    arrays (see section 9.12), we could store our motifs in one array and the respective
    counts in another, parallel array. However, arrays are indexed by integers (not
    strings or motifs in this case), and thus there is no direct way to access the
    count for a particular motif. If you wanted to update the count for TATA, your
    program would have to search through the array of motifs until it found TATA and
    then, having found the correct cell, the parallel array of counts could be incremented.
    Functionally, the parallel array with search gets the same task done as a hash
    table, but the primary value of the hash is speed of access of a particular item.'
