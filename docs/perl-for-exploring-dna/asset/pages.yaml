    # Box 14.3 Musical DNA


    What if there was a module that allowed you to input any sequence and then played
    it back as distinctive sounds, either music-like or not. That way, in addition
    to visual analyses, you could take advantage of the fine auditory discrimination
    that allows you to recognize voices, pick out themes in fugues, or identify syncopations
    when they occur. The ear may be anutilized sense for sensing sequences.


    Furthermore, the important information in DNA sequences may not be pixel-like
    or quantum-like. Although we collect, store, and analyze discrete sequences, the
    real message may be more of a flow, like a video or like music. If we click through
    a video frame or through music note by note, we miss much of the temporal and
    spatial information.


    Many Web sites feature music composed by using combinations of DNA bases or amino
    acids as notes. Try an Internet search of "DNA music" or "protein music" to listen
    to many fascinating musical interpretations of particular genes or proteins. The
    primary reason for converting biological sequences to music seems to be an aesthetic
    one so far.


    We are not aware of any attempts to identify sequence patterns with sound, but
    it might be a creative approach worth trying. It could be that using four very
    distinct (not necessarily musical) sounds might allow the ear to pick up certain
    patterns that the eyes do not. Or perhaps a more derived, complex, and musical
    rendering of a sequence would reveal more complex fugue-like patterns.


    This is a potential module that might be an enjoyable collaboration for a musician
    or composer or sound engineer with a Perl programmer.'
