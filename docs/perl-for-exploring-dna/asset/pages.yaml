  md: '# Perl for Exploring DNA


    +   1. Most characters themselves, for example, a G matches a G, a T matches a
    T.

    2. A match anywhere within a string is a match. That is, unless explicitly requested
    to do so, a regex need not match an entire word or line.

    3. Anchors (^ $) can restrain where a match takes place, for example, $ means
    at the end of a word.

    4. Some symbols (e.g., ^) have multiple meanings depending on the context of their
    use within the regex.

    5. Quantifiers (such as + and *) modify the previous character in the regular
    expression.

    6. The match is case sensitive, so is, lowercase c does not match uppercase C.
    Note, however, that our program regex.pl in this chapter is case insensitive.


    # 4.7 Summary of Regular Expression Syntax


    This is a good page for a bookmark—or photocopy the page, laminate it, and use
    it as the bookmark! Rest assured that we will slowly introduce these features.
    Note that a more elaborate version of this table appears in chapter 12.


    | Regex | Meaning |

    |---|---|

    | TATA | match four consecutive letters, TATA |

    | TAG|TGA|TAA | match TAG or TGA or TAA |

    | | match any character but not a newline character |

    | .. | match any two characters (independently, not necessarily the same character)
    |

    | (.) | capture (remember) and match any character |

    | .* | match any character 0 or more times (each is independent of others) |

    | (.*) | capture and match any character 0 or more times |

    | .+ | match any character 1 or more times (each is independent of others) |

    | (.+) | capture and match any character 1 or more times |

    | \1 | recall the first captured (parenthesized) group |

    | \2 | recall the second captured group |

    | \n | recall the $n$th captured group |'
