  md: '# The largest red signal is: 2798


    As mentioned earlier, we prefer to export the functions with the use operator.


    ```

    use List::Util(`max`);\      # use module, export max

    my @redSignals = (1500, 1246, 1099, 2798, 1003);

    my $slargest;

    $slargest = max(@redSignals);

    print "The largest red signal is: $largest \n";

    ```


    Often you will need to use more than one of the functions in a module. In this
    case, we recommend that you export them all at once. Note that because function
    names must be quoted, we recommend that you use the quote words (qw) to construct
    a list of space-separated words.


    ```

    use List::Util qw(max min shuffle);

    ```


    # 14.1.2 File:Glob


    As discussed in section 9.4, the default glob function (CORE::glob) may not handle
    directory and file names containing whitespace. Thus, if you try to glob some
    files in a directory that has whitespace in one or more parts (e.g., if your path
    name was intergenic krebs cycle.fna or on Windows computers, if included Documents
    and Settings), glob may not work. The module File::Glob to the rescue! This module
    includes a glob function that does not split on whitespace and thus can handle
    directory and file names with whitespace as shown in the next example.


    ```

    use File::Glob(`glob`);      # export the glob function

    my $fileList;

    # DNA files found in directory: "bacteria and archaea"

    $fileList = glob("bacteria and archaea/*.fna");

    ```'
