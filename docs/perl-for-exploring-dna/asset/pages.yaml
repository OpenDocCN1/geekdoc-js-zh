  md: '# Hash Tables


    In data which are referenced by key words to collect and manage large collections
    of sequences and their related information in the versatile, table-like data structure
    of a hash.


    From a good index it is possible to find out what is covered in a book [genome],
    which subjects are covered in the greatest depth, and to get a "feel" for the
    shape and style. Experience of unreliable, or tedious, or badly planned indexes
    causes us to see slowly just what skill and intelligence go into a good one. Still,
    one comes to admire the index as a work of art.


    > Byatt, 2001, p.11


    Hash tables offer a programmer the ability to intuitively and efficiently store
    and access related pieces of information. In contrast to an array, which is a
    list of cells each accessed by an integer, a hash table references its cells by
    words. For sequence analysis, this is a considerable advantage. To print the count
    of the number of times a motif occurs in a sequence, a programmer wants to look
    up the motif by name (e.g., CAAT) rather than number (motif #39). To convert a
    codon to its associated amino acid name, a programmer wants a mechanism to quickly
    map a codon (e.g., GGU) to its name (glycine). Hash tables are good starting places
    for annotation projects in which data are accumulating about a particular sequence:
    its locations, its genes, its putative functions, and its relationships with other
    sequences.


    # 10.1 Motivation for Using Hash Tables


    A hash table is an unordered set of key-value pairs where keys reference their
    associated values (scalars). The hash table (or hash) data structure is similar
    to the array data structure in that they both hold a collection of values. A main
    difference between hashes and arrays is that each cell in a hash table is referenced
    or indexed by a key (string), whereas in an array each are indexed by integers.
    The diagram below shows the Perl declaration of a hash to help keep track of the
    number of occurrences of each of the possible 256 motifs of length four (4-mers).
    The diagram assumes the hash has already been populated with (key, value) pairs,
