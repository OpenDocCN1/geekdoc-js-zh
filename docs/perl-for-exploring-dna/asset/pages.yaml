  md: "# Perl for Exploring DNA\n\n```\nelsif ( $a > $b ) {\n    return 1;    # means\
    \ $b should come before $a\n} else # $a == $b {\n    return 0;    # otherwise\
    \ the two items are the same\n}\n```\n\nThe use of $a and $b in the numerically_the_long_way\
    \ subroutine requires some faith on your part. At this point, it would be reasonable\
    \ to ask you, “But where are $a and $b declared? From where do the values in $a\
    \ and $b come? Why does returning a minus one (-1) signal that the value in $a\
    \ should come before the value in $b?” Good questions.\n\nWhen you call Perl's\
    \ sort function, it repeatedly selects two items from the list or array to compare\
    \ and assigns those values to the globally-defined variables $a and $b. “Globally\
    \ defined” means the variables $a and $b are defined elsewhere, in a built-in\
    \ module (see chapter 14) containing the sort function. The variables $a and $b\
    \ are actually aliases to the real values, and you should never try to change\
    \ their values. The sort function calls your subroutine, each time setting the\
    \ two values to compare $a and $b. For every two values sent to your subroutine,\
    \ the sort function returns a value to indicate the result of the comparison.\
    \ The use of -1, 1, and 0 for return are part of a standard definition when comparing\
    \ two items; you cannot alter this definition when using sort. If $a is less than\
    \ $b, sort expects that your subroutine will return a -1. One element should precede\
    \ another element and returns the appropriate integer.\n\nPerl's comparison relational\
    \ operators, <= for numbers and cmp for strings, automatically return -1, 1, and\
    \ 0 according to the standard definition of comparing two items. Thus we can rewrite\
    \ the subroutine to be used by sort when sorting numerical items by relying on\
    \ the <= operator rather than the if-elsif-else structure.\n\n```\n# This subroutine\
    \ is used by sort when comparing two\n# numerical items to determine their numerical\
    \ order.\n# Note: the two items are automatically stored in $a and $b,\n# so do\
    \ not attempt to declare $a and $b\n\nsub numerically_increasing {\n    return\
    \ ($a <= $b );\n}\n```"
