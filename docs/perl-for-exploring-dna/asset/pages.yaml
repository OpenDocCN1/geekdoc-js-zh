  md: '# Introduction: Explorations and Indexes


    In which the reason for and approach of this book are justified using examples
    from diverse sources. Enticing reasons for writing your own programs for analyzing
    DNA sequences: collecting, cataloging, annotating, and indexing as tools for scientific
    exploration and discovery.


    Indexes need not necessarily be dry, and in some cases form the most interesting
    portion of a book.


    > —Wheatley 1878, p. 14


    # 1.1 Darwin''s (Hypothetical) Undergraduate Interns


    If Charles Darwin had taken a couple of undergraduate interns with him on the
    Beagle, those students would have discovered, described, anded their share of
    new species. It would have been almost unavoidable, because few neotropical flora
    and fauna had been examined and characterized at the time of voyage. The nineteenth
    century was rewarding for naturalists with a passion for collecting, pressing,
    stuffing, pinning, and naming. And then in the twentieth century, such activities
    fell out of fashion as legitimate occupations of scientists. Ernest Rutherford
    (as quoted by his student, P. M. S. Blackett) summarized the importance of the
    scientific method, especially as defined and refined by physicists: "All science
    is either physics or stam collecting" (quoted in Birk 1962, p. 108).


    Thus Rutherford, a physicist, dismissed as trivial the work of collecting and
    cataloging. Admonitions of that were taken quite seriously by many scientists
    in all disciplines and well as directors of funding agencies and editors of journals.
    E. O. Wilson is among those who lament about collecting and taxonomy because we
    have recorded only a fraction of the catalog of organism diversity on Earth. We
    scarcely know what lives in the canopies of forests or in the oceans or polar
    ice cap or many microbial habitats. A handful of soil is an undiscovered universe
    of geonemes.


    Therefore it is ironic that we are experiencing once an age of exploration and
    discovery via the old-fashioned activities of collecting and cataloging. This
    time is not only organisms but also DNA sequences. Billions of bases of undescribed,
    essentially unnamed, unanaly sequences are being stockpiled, the numbers growing
    daily, in the convenient databases of the National Center for Biotechnology Information
    (NCBI) and other major public databases. The sequences are available for anyone,
    expert or amateur, to commence any study, on any scale, with almost any purpose.
    As it happens, collecting, sorting, annotating and describing DNA sequences are
    high on the list of what needs to be done. Even the most obvious'
