    # ### Box 12.1 Go Ahead and Name It (and Join the DNA Philological Club)


    Let'' say you or your students are curious about ants and would like to immediately
    begin a project to find out kinds of ants are attracted to a bait of peanut butter
    on the ground. A major stopping point is that you know nothing of ant taxonomy
    and would have to pore over dense dichotomous keys to have any hope of identifying
    a single ant genus and species. That isn''t a very gratifying start to an intriguing
    project. Tropical biologist Barbara Bentley suggests this solution. Started with
    the peanut butter immediately. Then, as needed, make up your own taxonomic key
    of whichever ants arrive. You go ahead and name them: "bighead," "tiny," and "red."
    Now you are free to make all sorts of fascinating observations about their interactions
    and activities, which is what you want to do in the first place. You could do
    the same with sequences, of course, well ahead of any serious search to see whether
    the sequence already has an official name. In your explorations, do not be held
    back by jargon invented by other people. That can come later when you are fitting
    your own into the bigger picture.


    Now let''s say you want to popularize your organisms (or sequences), encouraging
    others to appreciate what you see and may join in. This is a realistic scenario
    for sequence analysis. In an interdisciplinary group, you need to cut through
    the jargon and demystify the naming process. A good example is what lowers of
    dragonflies. They set out to popularize dragons, bringing them up to a similar
    status to that of birds or butterflies, by making attractive common names for
    each one. For example, "goldenrings" instead of Cordiidae. The multisyllabic Latin
    name still stands as the most important identifier, but novices can enter the
    dragonfly more easily. If it is with sequences, you don''t want your first day
    in the interdisciplinary group to be popular outside of your lab, Even if jargon
    does not become popular, you have taken important first steps to building your
    own working community. One of the many examples from our is a versatile repeat,
    coined by us for repeats that are both (inverted and direct) or are both (mirror
    and direct). We began using that phrase well before any analysis or deciphering
    of potential meaning.


    Here is one pitfall of naming, particularly in a finalized form. The essential
    nature of the act of naming and thereby sorting and classifying is sometimes reflected
    in premature names and categories—found later to be incorrect or impractical but
    which are fossilized in the literature. Biology is full of terms that must nonetheless
    be memorized if one is to follow the literature at any depth. Learning jargon
    is one of the most difficult tasks of undergraduate biologists, and it is further
    exacerbated by underestimates of just how important it is to be able to spell,
    pronounce, and accurately and spontaneously use multisyllabic jargon couched in
    two ancient languages (Greek and Latin). Furthermore, it is not always clear to
