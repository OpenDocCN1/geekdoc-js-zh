  md: '# Introduction: Explorations and Indexes


    # 1.3 Computers as Serendipity Machines


    Serendipity, n., the faculty of making happy and unexpected discoveries accident,
    storage, and analysis of huge quantities of sequence data means that there are
    some "new" ways of doing experiments, including forming hypotheses and following
    through on them. Actually these new days from the origins of biology in nature
    history. David Green in The Serendipity Machine refers to fortunate accidents
    that occur during exploration and discovery: "For most of human history, information
    was scarce and expensive; now it is abundant and cheap" (p. 5). And that has changed
    some ways of approaching scientific problems. The larger the data set and the
    more quickly and freely it can be explored or mined, the more likely it is that
    new combinations, connections, and relationships will be found among the elements.


    Computers are essentially engines for creating serendipitous discoveries, says
    Green. It is a legitimate (albeit still controversial) scientific activity to
    see patterns first (often lighting via computers) and contemplate and hypothesize
    later! "This is a relatively new way of doing research which came to the fore
    first in the 1970s as the power of computers increased. However many older scientists
    (and are still) uncomfortable with the idea of deliberately setting out to make
    scientific discoveries without knowing what you are looking for. This is surprising’s
    to not, because science has always exploited serendipity" (p. 89).


    Darwin, on the Beagle was relatively unencumbered by hypotheses. Cataloging and
    cataloguing have been ends in themselves, the specimens stored safely in museums.
    It was only late back in Darwin that reexamined his specimens, observed the patterns
    and distributions, and proposed an origin of species by natural selection.


    Green points out that large sets (or large collections such as the data set) provide
    so many opportunities for accidental discovery because there are so possible combinations
    of the individual items. No matter how database is designed (or a collection arranged),
    unanticipated patterns will emerge. The larger the database, the greater the possibility
    of serendipitous discovery. Indeed, the arrangements of data ought be frequently
    examined as new items arrive daily because old hierarchies and taxonomies no longer
    fit the new information. Green calls this the "platypus effect" after the temporary
    chaos that occurred when duck-billed platypuses were discovered in Australia and
    could not be neatly caught with the other mammals until the classification was
    adjusted. Hierarchies and classifications are no more than hypotheses. Current
    practices in storing, sorting, and annotating DNA may need to be reexamined as
    more information pours in. Of the new sequences may have platypus-like effects
    on the databases.


