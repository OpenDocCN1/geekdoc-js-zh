  md: '# Making Decisions Over and Over Again with Perl''s if and while 115


    missing grammar or control statements, such as what we are introducing in this
    chapter. Using this grammar metaphor, a diagram of a well-regulated rhodopsin
    “command” might look more like a little program like:


    If the cell is in the retina of the eye

    And

    If the cell is depleted of rhodopsin

    Make rhodopsin


    And for each rhodopsin, the modifications or splices needed to produce a functional
    molecule

    And if the cell is still depleted of rhodopsin, repeat this loop.

    Else

    Do not make Rhodopsin

    And don''t forget to put in all the semicolons;


    So where are these elements in an actual genome? Many hypothesize and have shown
    that short motifs upstream and downstream of genes and even thousands of base
    pairs away from genes form a sort of grammar or program for regulation. Proteins
    bind in a coordinated fashion to each other and to particular DNA motifs to influence
    whether and how a transcript will be made. The analogy with a computer program
    falls apart somewhat in that gene regulation seems to involve a bit of sloppiness,
    fuzziness, redundancy, and lack of perfect efficiency, none of which are well
    tolerated by computers. There are plenty of semicolons left out and the “program”
    runs well enough, typical of any evolved system.


    However, an interesting aspect of Perl as a programming language is that it was
    designed to have some characteristics of an evolving system. include the fuzzy,
    sloppy, redundant, inefficient properties of evolving natural languages. Therefore
    some of the parallels between Perl language structure and DNA regulation may be
    worth considering as working metaphors and hypotheses for genome exploration.'
