  md: '# Phrasing Questions by Writing Algorithms 207


    # Box 11.2 Importance of Beauty I


    A search for things of beauty is a worthy and time-honored starting premise for
    scientific exploration. Examples of beauty include elements of novelty, complexity
    (or simplicity), irregularity (or “perfection”), and surprise. One year we,sustained
    excitement in our genomics research group by writing programs to search genomes
    for inverted repeats.


    ACGTAT:ATGCAGT is an inverted repeat because of the internal base pairing. The
    outside goes with the outside T, the C goes with the next last G, and so on. The
    linear sequence can be folded into a hairpin shape and held together by base pairing
    along the entire length. The rest of the sequence, not in a hairpin loop, is represented
    here with Ns.


    ```

    T-A

    A-T

    G-C

    C-G

    T-A

    G-C

    C-G

    NNNNNNNATNNNNNNN

    ```


    At the time we started our research group, we were almost ignorant of information
    concerning the functional nature of inverted repeats (IRs). One of us (the biologist,
    of course) was aware of the presence of IRs in introns and in the promoters of
    some bacterial genes. We still had a lot to learn.


    However, what kept us going was the realization that these repeats are beautiful.
    The more we searched, the broader our definitions of beauty became. It included
    regular repeats with mismatches and asymmetrical repeats as well as perfect ones.
    We soon became intrigued with repeats in general (direct and mirror repeats) and
    even extended our enthusiasm to English language examples, such as mirror palindrome.
    One night we discovered that some DRs are also IRs, such as the lovely GATTATC;
    other DRs are MRs, as the somewhat less attractive GAGGAG. We then spent considerable
    time exploring the various properties of repeats, even coined the phrase “versatile
    repeat” (VR) for the DR/IR and DR/MR combinations.


    Beauty is in the eye of the beholder, as we have been, but there is much to behold
    in a genome. Somewhere within are sequences that reveal themselves as beautiful,
    as in your own research group. You may want to collect them in a nicely ordered
    data structure, such as an array or hash. You may want others to appreciate them
    via friendly search queries and attractive graphics. In cataloging and displaying
    favorite sequences and making them accessible to others and yourself for further
    analysis, you are making a much-needed contribution in genomics.'
  merge: -1
