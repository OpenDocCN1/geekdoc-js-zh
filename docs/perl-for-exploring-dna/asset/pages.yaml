  md: '# Box 3.4 Why Do Computer Scientists Count from Zero?


    Let''s turn that title question around and ask why the rest of the world is inconsistent
    in its counting practices.


    Although it makes practical sense that any useful counting system ought to begin
    with zero, children are persistently taught to begin at age. Perhaps it is the
    fault of our having convenient counting objects as our fingers and our reluctance
    to imagine zero of them. Indeed, as books like Zero (Seife 2000) and The Nothing
    that Is (Kaplan and Kaplan 1999) attest, the concept of zero was not only obvious
    but even strongly resisted through most of the history of human counting.


    Nevertheless (index-like) we all begin at age zero and spend our first year as
    age zero, consistent with the way we name subsequent years as age 1 or 11 or age
    51. However a certain discomfort with zero means that we prefer to count it an
    infant''s age (especially for an entire year) and substitute the (more satisfying)
    counting of weeks and months instead. The same is true for the Western calendar,
    which began awkwardly with the year one rather than the year zero. Thus there
    was a bit of confusion exactly when we should consider the new millennium to have
    begun. If the first 1 year was 0, then we were premature in opening all that champagne
    in 2000!


    Meanwhile, the practicalities of travel space lend themselves wisely to the correct
    use of zero. We do instinctively perceive because the physical reality is unavoidable.
    For example, a trip begins with zero until one has the first step. One does not
    get to count mile number one or even step number until one has achieved it. That
    mundane truth is the simple reason for beginning an index or list or array in
    computer science to a trip down the length of a string of As, Cs, Gs, and Ts.
    Until we have moved off the first DNA base, we are at zero. That starting base
    is not our first base; it is our zeroth base!


    This elegant (and correct) counting system, allows calculations to be more readily,
    which is why number lines zero are eventually (by perhaps not so enough) introduced
    in elementary school math. We can slide with ease and count down a number line
    that commences with zero adding and subtracting numbers (including 1-1=0) and
    always arriving in the right spot. And unlike a number line beginning with one
    (if there is a thing outside of the realm of a child''s fingers), zero provides
    possibilities to explore the realms of negative numbers as well as Zeno''s territory
    of infinite fractions less than one.


