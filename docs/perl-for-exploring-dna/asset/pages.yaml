  md: '# Perl for Exploring DNA


    At glance, building an index would seem to be a mundane and even tedious chore
    that necessarily follows the writing of a book and not much more. Concordances
    (essentially an index of words and their locations rather subjects) and even the
    more elaborately detailed versions of indices, such as catalogs do not signify
    much exciting more. However some sorts of decisions about what to index and how
    to place an indexed item in a hierarchy and whether to cross-index and add annotation
    are all common practices of DNA annotation.


    The act of indexing (or concordance building) essentially allows you, the curious
    researcher, to get first dibs on virgin genomic sequences! It allows you to make
    or impression on the raw data, pulling it into some semblance of informative.
    In fact, until the first steps in indexing are taken, genomic sequences may well
    have been generated randomly, so little information is revealed. You are indeed
    building an index or catalog when you


    +   1. Annotate any part of a genomeseeking and recording genes, introns, motors,
    and others. Objectivity is of course a goal, but subjectivity guides the decisions
    to what gets emphasized.


    +   2. Look for and record binding motifs, protein domains, and restriction sites,
    including motifs of (as yet) unknown function—as small inverted repeats in promoter
    regions.


    +   3. Organize sequences according to metabolic pathways and co-regulated genes.


    +   4. Look for and record transposons, viruses, pseudogenes, and other intriguing
    genomic sequences.


    +   5. Attempt to decode the promoters of suites of co-regulated genes in a pathway.
    Perform all sorts of oligonucleotides—such as A, C, G, T Ratios,


    +   dimers, trimers, tetramers, and so on.


    +   7. Do any of the above while comparing and contrasting genomes.


    +   8. Make phylogenetic trees. The tree itself is an informative, nonlinear index!


    +   9. Create graphic-like representations of sequence information. Maps, too,
    are nonlinear indexes.


    +   10. Produce software that filters or mines data that is essentially index
    building, complete with all the best guesses as to what is worth collecting.


    All of the above are hypotheses or hypothesis generators, to change and with potential
    discoveries. What you choose to include and in what hierarchies and categories
    and relationships represent your best as to what is meaningful and appropriate.
    What you omit or exclude may be just as revealing.


    Commenting on the subject of indexing books, A. S. Wyatt (2001) notes that some
    of the late entries to an index are made only after the realization that a particular
    topic is relevant. An example is the Dewey decimal system (essentially an index
    of books), which was invented before computers. There was not much space in the
    system for books for programming. Where are they now? They are within 003 to 006,
    tucked in books about books (002) and bibliographies (010), a sort of best guess
    at the time to where such a topic ought to reside. guesses (or hypotheses) about
    relevance, connections, and hierarchies may be worth considering for the organized
    storage of DNA sequences as well. Making the decisions as to what is informative
    and what is random is one of the most daunting and essential, challenging, and
    exciting tasks of a bioinformaticist.'
