  md: '# Conclusions


    To travel hopefully is a better thing than arrive.

    —Robert Louis Stevenson, “El Dorado” in Virginibus Puerisque (1881)


    Anton van Leeuwenhoek, the microscopist, was in great demand as a party guest
    in fashionable Delft homes in the seventeenth century. He could be counted on
    to bring along several handheld microscopes with glass bead on which he would
    mount diverse specimens, including scrapings from the teeth of his fellow guests.
    A contemporary of Leeuwenhoek, essayist Constantijn Huygens, wrote about such
    scenes, noting the difficulty of people seeing for the first time the microscopic
    inhabitants of their mouths. Without previous experience and a context in which
    to classify the new information, most complained that they had seen nothing: “When
    even completely inexperienced people look at things they have never seen, they
    complain at first that they see nothing, but soon cry out that they perceive marvelous
    objects with their eyes” (Alpers, 1984).


    Often do we not see what we do not (yet). The problem in sequence analysis is
    compounded by the sheer quantity of the unanalyzed information and the indirect
    methods by which that information is deciphered.


    How do we build tools to seek out particular types of sequences when we do not
    know the full extent of what might constitute a meaningful sequence? Phrasing
    a question and building a computational to answer it is activities in forming
    hypotheses. We are worthy scientific analyses and in of themselves.


    What do we do with the results of genome analyses? These, too, are potential hypotheses
    for continued searching, for tweaks, and designing new ones. Finally there is
    the ground of the molecular biology wet lab where sequence results can provide
    the hypotheses for experiments.


    How should results of sequence analysis be organized? It should be done with an
    appreciation that any given organizational system is just one of many choices.
    Furthermore, we are often limited to visualizing data in one to two dimensions.
    Some multidimensional correlations may be invisible on our choices. Deciding on
    a particular presentation of data is also a form of hypotheses building. It is
    important to be ready to take advantage of serendipitous correlations, juxtapositions,
    and relations that tumble out of any large data set. Keep the hypotheses flexible
    and know when to abandon one. Fortunately, some programming approaches allow you
    to do that, by abandoning a de-anded Internet search.


    How much information is slipping through our current methods of classification
    and decoding because we do not yet have the context by which to design the right
    search tools? Industrial labs, academic labs, granting agencies, and editors of
    journals often have clear and definitive opinions of what sorts of sequences are
    worth collecting, analyzing, and using; traditionally, gene sequences have been
    featured'
