  md: '# 1.2 How Much DNA Is There in a Genome (Using the Human Genome as the Example)?


    Every human cell has two copies of 3 billion base pairs. So that makes a total
    of 6 billion base pairs per cell. Depending on how tightly the DNA is coiled,
    there are about 4,000 base pairs per micrometer (micron) of DNA. A little calculation
    reveals that each cell contains the astounding length of 1,500,000 meters of DNA.
    That number can be made more vivid by converting it to meters, cutting a string
    of length, tucking it into your pocket and slowly pulling the string out, after
    eliciting guesses from onlookers to the length. The string is 1.5 meters! How
    such an enormous polymer (no matter how thin) could be stuffed into a nucleus
    of about 1 micron diameter and remain functional is a topic of ongoing research.


    Now consider that there are about 10 trillion cells in an human body. That means
    that we carry around 15 million meters of DNA, a number almost impossible to imagine
    unless converted into other units, although representing it as 15 billion kilometers
    doesn''t quite do it. Note that the sun is about 150 billion kilometers from Earth.
    This means we have enough DNA to string out into space 100 times the distance
    to the sun.


    By the way, most of the cells we are hauling around are not the 10 trillion of
    ours but rather ours of symbiotic bacteria, 100 trillion of them. And each of
    those bacteria has its own genome and so on.


    For more calculations about DNA, see chapter 5, in which the numbers are the printing
    of letters A, C, G, T to fill the right number of books to contain the human genome.


    # How Many Genes Are There in the Human Genome?


    This is still a contentious matter because of the difficulty of defining the word
    gene and for political reasons. The definitional problem centers on the extraordinarily
    flexible way that eukaryotes use their genes to get numerous products out of one
    sequence. Exons (functional sections of genes) may be spliced together, resulting
    in many combinatory possibilities. If we tally messenger RNAs or proteins in a
    cell, we get far more than the number of genes. Furthermore, different gene predicting
    programs stumble in different ways over introns (the nonfiction parts of genes)
    and pseudogenes (genes that are no longer functional due to accumulated mutations).
    The political problem centers around the commercial interests in “owning” or at
    least controlling parts of the genome. In this context genes can be viewed as
    marketable units, each representing a potential function, cure, and profit.


    GeneSweep was established as a friendly wager at the Cold Spring Genome Meeting
    in 2000. Bets ($1 the first year, $5 the next, and $20 after that) were recorded
    in a lab notebook. Participants submitted estimates of the number of human genes.
    These estimates from experts in the field ranged from 26,000 to 150,000, which
    gives an idea of the challenges of gene prediction. Finally in'
