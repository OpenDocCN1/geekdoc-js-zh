  md: '# Box 12.2 Hieroglyphics


    Is a language (like English) with a linear (string-like) representation useful
    in generating hypotheses about information that might or not be present in a DNA
    string? On first glance, an English-language (or linear-language) metaphor may
    seem a reasonable first step to finding working hypotheses. Indeed, many of the
    examples in this book do just that: They treat DNA like a linear string of information
    that may be analyzed by some of the traditional methods of linguistic analysis,
    such as frequency analysis and index-building or concordance-building.


    However, a purely linear approach has its limitations given the three-dimensional
    folds, kinks, and coils of DNA and the three-dimensional nature of DNA interactions.
    Reluctant to let go of a natural-language metaphor prematurely and in the spirit
    of open-minded exploration, we suggest an examination of some of the less linear
    (multidimensional) languages expressed in their written form. These might include
    Chinese ideograms and hieroglyphics.


    Hieroglyphic ideograms are typically set out in linear fashion one after another,
    either right to left, left to right, up to, down to. Like many ancient writing
    systems, hieroglyphics lack vowels and spaces between them. Hieroglyphs do not
    have a simple one-to-one correspondence or transliteration with linearly represented
    languages, such as English or Russian. The hieroglyphic characters double on themselves,
    three dimensionally, by containing layers of redundant information within each
    ideogram. That is quite a challenge for translators. Indeed, the code was impenetrable
    until the Rosetta Stone provided a translation in Greek for a set of hieroglyphics.


    Middle Egyptian scribes had several choices as to how to write a word in hieroglyphic
    notation. They could spell it by letter and leave it at that, but simple spelling
    is almost never done. There are 22 unilateral letters in the alphabet, including
    *m*, which is a picture of an owl and *w*, which is a quill chick.


    The scribe could use diliter or triliter symbols for that example *mw* becomes
    a new symbol, waves of water. Within a single ideogram, a scribe might choose
    to use both methods (the unilateral letters and the diliter) to depict *mw* redundantly
    using all three—owl, quill chick, and water—emphasis.


    But that''s not all. That is merely the phonetic part as a sort of derived pictogram
    and the ideogram. The owl sign also means “water,” the waves of water sign also
    mean “water.” A third level of redundancy might be introduced. The pictorial representation
    for a particular word might be layered as though to emphasize the meaning.


    To summarize, any given word in hieroglyphics is a complex, redundant combination
    of its phonogram (how it ought to sound) and its pictogram (what it ought to mean).
    For example, the ideogram for third requires five symbols. (Keep in mind that
    vowels are off left.) The symbols are a (y) and a foot (b) representing the two
    consonants of the word, followed by a baby goat representing the diphthong for
    those two consonants, followed by the


    continued'
