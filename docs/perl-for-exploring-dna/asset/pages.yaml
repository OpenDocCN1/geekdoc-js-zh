  md: '# Preface


    This book is an introduction to the Perl programming language for the exploration
    of biological sequences (DNA and protein) with a focus on most examples. DNA can
    be depicted as a linear map of As, Cs, Gs, and Ts, but that map (the direct output
    of DNA sequencing project) only hints at the varied contours and crevices, twist
    and kinks, loops that comprise the structure and function of the extraordinary
    double helix. An expedition into that terrain, mostly unknown, can be approached
    in two major venues, interdependent with each other.


    The first is with the repertoire of techniques that is molecular biology. By these
    methods, we know genes and have had a good understanding of how they code for
    proteins since we also know many short sequences proximal to the genes with specific
    functions which genes are regulated.


    The second is with the set of computational tools that comprise the emerging fields
    of genomics (DNA) and proteomics (protein). The approach is like large-scale,
    methodical code-breaking, a search for revealing patterns that suggest meaning.
    In contrast, even "scaled-up" experiments in molecular biology are piecemeal,
    one sequence at a time, wet if organized and accelerated by their own computers,
    are limited by the speed of the robotic arms and the incubation times for exhaustive,
    repetitive, tireless searches and meticulous cataloging and annotation limited
    by the imaginations and wills of the programmers.


    In large-scale, comprehensive genomics (or proteomics) project, molecular biology
    and computational analyses are co-dependent. Computational programs are the lightning-fast
    map readers, flying across miles of tedious As, Cs, Gs, and Ts and relentlessly
    collecting and "imaging"every pattern. Molecular biology provides the "ground
    truth" because many patterns can be easily imagined but prove to be leads, more
    than random. Computation has the power to provide hypotheses for molecular biology.
    For example, "We (the computers) have an unusual abundance of short sequences
    ''GTGAGTCAC'' upstream of some related genes." Molecular biology completes this
    hypothesis with a mutant study by subtle point-point changes in GTGAGTCAC are
    indeed found to have significant effects.


    Perl has been the language of choice when working with, searching, and identifying
    patterns in strings of text. DNA and protein sequence analysis is all about strings
    (for example, linear map of As, Cs, Gs, and Ts) so it is not surprising that Perl
    has emerged as the programming language of choice for researchers in'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'bioinformatics, genomics, proteomics, and systems biology. As such, Perl is
    ideally suited to answer questions such as


    +   How can I determine all the three-letter prefixes of every word from a John
    Donne poem?

    How can I determine all the three-letter prefixes of every-7mer upstream of my
    favorite kinesin gene in yeast?

    How can I determine all the partial anagrams in a certain word?

    How can I search for hydrophobic domains in proteins?

    How I find every occurrence of ''love'' in a psalm?

    How can I find and count every occurrence of the putative binding site ACGT upstream
    of genes in the Krebs cycle?

    How can I find all palindromes in the English dictionary?

    How can I find all mirror repeats in a genome


    # Intriguing and Unique Aspects of This Perl Book


    +   1. Uses an appealing “exploration” metaphor throughout. Biology has returned
    to an age of discovery, perhaps not seen since the days of nineteenth-century
    scientific expeditions. For example, Charles Darwin was charged with cataloging
    every new organism that he could on his voyage to the Beagle. We are aware (biologists
    and computer scientists as explorers) with billions of bases of uncharted DNA
    sequences and a great need for simple collecting, cataloging, and annotating.
    With intrepid traveler needs a guide to make the transition into sequence analysis
    enjoyable and rewarding.

    2. Uses a foreign language “phrase book” approach for instant gratification for
    the novice user. For example using a French phrase to say, “May I have a croissant,
    please?” brings the speaker a croissant. Substituting the word espresso for croissant
    brings more gratification in form of espresso. Knowing all of the fine points
    of the grammar is not necessary to get results.

    By analogy, a biologist (and Perl novice) using our wish to search for all direct
    repeats of length six in a DNA sequence, would


    ```

    m/(.).(.).(.).\1\2/g

    ```


    And to find repeats would simply substitute:


    ```

    m/(.).(.).\3/1/g

    ```


    +   3. Encourages a “favorite gene” approach by which the user is encouraged to
    use all possible tools to solve a particular research problem. This is not entirely
    new for biologists who are accustomed to trying different lab techniques and in
    some cases using prepackaged software for sequence analysis. What new is the ease
    with which biologists can begin queries specific to their own favorite genes using
    their own Perl scripts. We strongly believe that a grassroots effort in genomics
    will solve many of the more interesting problems on DNA function and regulation.'
