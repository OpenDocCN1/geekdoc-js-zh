  md: '# Regular Expressions Revisited


    In which some refinements will be introduced by which your regular expressions
    might be restrained from their customary greedy and exuberant activities. This
    is introductory school for regular expressions.


    Some people, when confronted with a problem, think: "I know, I''ll use regular
    expressions." Now they have two problems.

    —Jamie Zawinski (in Conway, 2005)


    Regular expressions (regex), introduced in chapters 4 and 6, deserve a revisit.
    Before reading this chapter, you may want to review some aspects of regex syntax
    from those earlier chapters. Like an overgrown golden retriever puppy, regexes
    are lots of fun and eager to please. They are also destructive and a bit dangerous
    if trained incorrectly. Even professional programmers use regexes with caution.


    Let''s say a bit, fluffy, golden retriever pup has been sent out to fetch the
    news—instead it fetches every single newspaper in the neighborhood, chews some
    of them, leaves others in the bushes, and proudly brings the rest home. All is
    that regexes are greedy in their eagerness to please. If you send one out to collect
    sequences of a particular length, you might expect to get the biggest sequence
    the regex could, though you might have been hoping for something more subtle.
    This chapter shows you how to guide your regexes some obedience training. You''re
    looking for a particular sort of sequence in a big file, what you probably want
    is the first and every consequent occurrence of the pattern and not the single
    longest sequence the regex could retrieve for you.


    Another challenge with long regular expressions is that they can be difficult
    to read if they are written out in one line of code. This introduces the practice
    of splitting a big regex into lots of lines and commenting each section. You (and
    others who have read your code) will not regret this in the long run. Regex syntax
    is not Perl syntax; it is far from it. It is like inserting lines of Greek or
    Chinese into English text. In the examples to follow, we make lavish of comments
    to help the reader translate these regexes.


    Regular expressions in Perl rely on some syntax and use what Larry Wall refers
    to as "magical Elvish variables," which charming but adds to the difficulty of
    matching exactly what you were expecting. For example, global pattern matching
    variables introduced in chapters 4 and 6, such as $1 and $2, held items from parentheses
    in the regex. Your results will be tucked into these special variables unless
    you use special syntax to prevent it. It is especially important to learn the
    syntax enables noncapturing groups so that the regex does not become overloaded
    with secret caches of items. That''s your golden retriever puppy with lots of
    secrets filling the yard with hidden treasure.'
  merge: -1
