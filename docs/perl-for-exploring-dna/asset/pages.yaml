  md: "# Arrays\n\n# 173\n\n```\n# we are sorting strings so use the string operators\
    \ (lt, gt, eq)\n# attempt to sort by first level (Domain)\nif ($a_fields[1] lt\
    \ $b_fields[1]) {\n    return -1; # means $a should come before $b\n}\nelselif\
    \ ($a_fields[1] gt $b_fields[1]) {\n    return 1; # means $b should come before\
    \ a\n}\nelse must be eq, that is, ($a_fields[1] eq $b_fields[1]) {\n    # the\
    \ other two Domain names are the same\n    # so we need to compare by the [2]\
    \ Group field\n    # rather than use another if-elseif-else, we'll use cmp\n \
    \   # which does all that work for us\n    return ($a_fields[2] cmp $b_fields[2]);\n\
    }\n end taxonomically\n```\n\nTo sort all the Archaea and all Bacteria alphabetically,\
    \ we must define a comparison on more than one field. In this case, if the Domain\
    \ fields are the same (see the else case), we need to refer to the next-level\
    \ Domain name to resolve the comparison. For example, when comparing two Archaea\
    \ like Archaea; Crenarchaeota and Archaea; Euryarchaeota, $a_fields[1] and $b_fields[1]\
