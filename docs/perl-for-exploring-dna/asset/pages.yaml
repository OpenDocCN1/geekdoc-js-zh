  md: "Given the subroutine numerically_increasing, numerically, you can use this\
    \ subroutine name as the first argument when using sort. Notice the use of the\
    \ subroutine name when calling sort.\n\n```\nmy @redSignals = (1500, 1246, 1099,\
    \ 1003, 2798);\nmy @sortedValues = sort numerically_increasing @redSignals;\n\
    print \"Sorted: @sortedValues \\n\";\n```\n\nSorted: 1003 1099 1246 1500 2798\n\
    \nYou may already surmised that if you want to sort numbers in decreasing order,\
    \ you can reverse $a and $b as shown here.\n\n```\nsub numerically_decreasing\n\
    {\n    return ($b <=> $a);\n}\n```\n\nIt is worth mentioning that it is possible\
    \ to avoid the subroutine entirely and include the comparisons inline. In fact,\
    \ as we'll see later in chapter 10, performing the comparison inline without a\
    \ subroutine is sometimes the easiest way.\n\n```\nmy @redSignals = (1500, 1246,\
    \ 1099, 1003, 2798);\n# sort \"inline\" without using a subroutine\nmy @sortedValues\
    \ = sort { $a <=> $b } @redSignals;\nprint \"Sorted: @sortedValues \\n\";\n```\n\
