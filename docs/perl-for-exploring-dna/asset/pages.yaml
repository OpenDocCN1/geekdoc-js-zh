  md: '# 6.4 Capturing and Clustering in Regular Expressions


    As shown in the previous example, surrounding your regular expression with a set
    of parentheses is a way for Perl to “remember” the exact substring that successfully
    matched your pattern. Using parentheses in your regex is often called clustering
    and recalling the matched substring is called capturing. In chapter 4 when regular
    expressions were introduced, you used clustering within a regular expression to
    remember initial parts of a pattern when you needed to recall those parts of the
    pattern in the tail end of the regular expression. For example, recall our regex
    to find a direct repeat (DR):


    Are there any words in which a sequence of three letters is repeated elsewhere
    in the word?\Search for words where a sequence of three letters is repeated.


    ```

    (\.).(\.).*\1\2\3

    acclimatization

    Albuquerque

    amalgamate

    ```


    In this example, the parentheses (.) were used to cluster (store) results for
    three consecutive letters and later in the same regex we used the back references
    \1, \2, and \3 to capture (recall) the first, second, and third characters remembered.
    But not if we want to remember the entire matched pattern outside (after) the
    regex, we place a set of parentheses around the entire regex and recall the match
    in a later line of Perl with $1. Thus a Perl if statement that attempts to find
    (match) direct repeats needs an additional set of parentheses around the entire
    regex and our back references within the regex must be renumbered. Starting from
    the left in a regex, each open parenthesis indicates the number that must be used
    to recall that particular item; the leftmost (first) parenthesis can be later
    recalled with (1), the


    ```

    # check if a motif contains a Direct Repeat (DM)


    if ($motif =~ m/ ( (.).(.).*\2\3\4 ) /

    (


    $DR = $1; # capture (recall) the entire DR found

    ```'
