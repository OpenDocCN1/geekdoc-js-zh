    # BLAT


    Query is some unknown sequence

    Database is all known sequences

    Builds index of short sequences in query

    Scans linearly through database

    Output shows areas of homology


    Query is one of three million fragments

    Database is all of the other fragments

    Builds index of short sequences in database

    Scans linearly through query sequence

    Output shows stitched-together fragments between sequences


    Both scan short matches and extend those to find the highest scoring match.


    Kent noted that all fast alignment programs he knew of break the problem into
    two parts:


    +   - Search stage—Find all regions that are likely to be homologous.

    - Alignment stage—Examine regions from step 1 and make best alignments.


    Presumably the search stage will screen out and reduce the amount of sequence
    passed to the online, thus speeding up the more costly alignment.


    Kent acknowledged that setting up the index of all possible short sequences is
    a hurdle but once it is set up for a genome, the programmer “owns” it and the
    index does not have to be done again.


    > Box 11.4 Speed I


    Perl walks on water, right? Well, not always. One of the reasons that so many
    different programming languages have been invented and developed because there
    are so many different types of problems. Languages excel in some but not all situations.
    Here is a case in point.


    One of us (the computer scientist) wanted to analyze 200 microbial genomes at
    once. The program in Perl was relatively easy to design and implement, but ran
    slowly. Although significantly more difficult to implement, the program was rewritten
    in C++ in an attempt to decrease the run time for each experimental run. The experimental
    times for 200 genomes was reduced from many hours to about one hour. For this
    unique case, C+ was a better choice, at least in the time it took to complete
    an experimental run.


    Similar to other languages you may know of (including Python and Java), Perl is
    not strictly a compiled language. What does that mean? Every Perl program is processed
    by the perl interpreter (Notice that the language Perl is spelled with an uppercase
    P and the interpreter or “engine” is spelled with a lowercase p.). The interpreter
    handles the execution of all Perl programs, much like word processing (e.g., Word)
    handles written documents. The perl interpreter performs four steps: (1) loads
    a Perl program, (2) checks for syntax (“bugs”), and assuming there are no problems
    (commonly called syntax “bugs”), (3) converts (compiles) each of the Perl instructions
    from the'
