    16. You are using a nice piece of software but are occasionally plagued with thoughts
    of "what is this software not showing me? What decisions did the programmer make
    to leave certain things out?"


    # Box 1.2 Finding Words and Motifs with Your Word Processor


    Why not commence your first endeavor in sequence analysis right now with your
    word processor? You have Find and Replace in the edit menu. You also probably
    have the capability of doing a wildcard search with an asterisk, as in "wildcard.\*
    This feature might not pop immediately but may be revealed with a little sleething
    using online Help. Remember, you also have the capability of counting characters,
    with and without spaces, as well as counting words, lines, and paragraphs. Some
    sequence analysis software begins with these basics. Some of the first programs
    you write may not do more than what these built-in functions are doing.


    Using your word processor, create a new file and type in a sequence of As, Cs,
    Gs and Ts like this:


    ```

    actgaaatgcgatgtaaaacccctcgagatgaccaattacgaaatgtgcgtatcgacgaattgcgc

    ```


    By using Find, you immediately and effortlessly locate each instance of "tt" or
    "gcat" or any other motif of interest. Try a wildcard with "c" for a fuzzy search.
    If you had several pages of sequence to search through and merely wanted to discover
    and underline every position of "atg," some of which could be serving as start
    codons at the beginnings of genes, your word processor might suffice. Use Replace
    to make all of instances of "atg" bold, capitals, or underlined.


    ```

    actgaaatgcgatgtaaaacccctcgagatgaccaattacgaaatgtgtgcgtatcgacgaattgcgc

    ```'
