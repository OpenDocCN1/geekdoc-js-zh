    # 4.3 What Would Be a More Comparable Pairing of Lists?


    If we did not know any English or if we had taken the task of deciphering an unknown
    language such as the ancient and cryptic Linear B, we might take a first step
    of choosing a text and generating it from all possible words of certain lengths.
    Then we would examine the frequencies with which words and word patterns occurred.
    Certain everyday words would be expected to occur often. Certain elements of grammar
    and syntax might be expected in repeating patterns. Some aspects of the analogy
    might be useful for DNA sequence analysis, and we return in later chapters.


    Box 4.2 Alice Kober, Linear B, and Motif Frequencies


    Linear B is a writing system of 90 characters for an ancient Greek dialect in
    about 3500 years ago. It was discovered on clay tablets in 1900 and remained undeciphered
    until 1952. The laborious primary method for decoding the script was that Alice
    Kober (1906–1950). She worked entirely without a computer, of course, but she
    was further hampered by the World War II rationing of paper. Kober created letter
    and frequency lists by hand on no more than 180,000 cards, cut to a size of two
    inches from scraps of paper. These scraps enveloped, greeting cards, and exam
    books. The relevance of the size was that the cards fit into empty cartons from
    Lucky Strike and Fleetwood, cigarettes smoked by Kober. Her death at age 43, probably
    by two years after the announcement of the decoding of Linear B, She received
    little or no posthumous credit at that time. A colleague, Michael Ventris, was
    awarded an Order of the British Empire for the work. The method used for deciphering
    Linear B is sometimes called the Kober/Ventris approach and is potentially relevant
    to other strings of text, including DNA. For example, generating a frequency list
    of all possible motifs (within a certain size range) is now a relatively simple
    first step, with the help of computers.


    Source: Based on Palaima and Trembley, 2003.'
