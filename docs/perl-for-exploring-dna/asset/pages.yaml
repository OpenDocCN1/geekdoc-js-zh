- img_proc: true
  md: 'program to a middle-level language (a bytecode), and then (4) immediately

    “interprets” each bytecode to perform the requested action. The first three steps

    of the perl interpreter are not unlike those performed during the biological

    process of translation where ribosomes (the interpreter) read and convert codons

    to amino acids (bycodes).


    In contrast to the compile-interpret-run steps in Perl, languages like

    C++ are compiled and executed in two stages. C++ programs are

    passed through a compiler that checks for syntax errors, and then the

    compiler translates C++ instruction into a series of very efficient

    low-level instructions, starting the low-level in a new executable file (e.g.,npairwise.exe).
    This is the primary reason for the increase in speed in the

    previously mentioned C++ program: The compiler converts the C++ into

    low-level instructions that are perfectly suited for that computer. Note that

    second step is required where the user must run the compiled C++ program. On the

    opposite end of the language spectrum, pure-interpreted languages do not

    compile instructions into a low level or even translate to a middle level, but

    immediately interpret and execute each line of the program as soon as it

    is encountered. Purely interpreted languages are the slowest languages in

    regard to execution speed.


    | Compiled language | Compiled-Interpreted | Interpreted-only language |

    | --- | --- | --- |

    | High level | C, C++, Fortran | Perl, Python, Java | BASIC, JavaScript, shell
    scripts |

    | example name | pairwise.cpp | findRepeats.pl | moveFiles.sh |

    | | COMPILER | COMPILER and INTERPRETER | INTERPRETER |

    | | Check syntax, if okay then create a new file containing the machine code |
    Check syntax in entire script, if okay, then compile into and immediately execute
    the bytecode | Immediately execute each line of the script, halting if any line
    has an error |

    | Low level | machine code (pairwise.exe) | |'
