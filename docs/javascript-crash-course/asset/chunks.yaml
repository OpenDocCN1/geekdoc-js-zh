    ## 第 4 ：在 JavaScript 中进行数学运算


    ### 运算符和操作数


    计算机指令由两个基本部分组成：运算符和操作数。**运算符**是表示动作的字符。例如，加号（`+`）是一个表示加法的算术运算符。**操作数**是计算机指令中指定要进行操作或处理的数据部分。因此，在表达式
