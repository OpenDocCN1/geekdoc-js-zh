    ### 全局变量与局部变量


    变量的 `scope`（作用域）是其定义的上下文。变量的作用域可以是全局的或局部的。`global`全局变量定义在函数外部，对程序的所有部分都可用。另一方面，`local`局部变量定义在函数内部，仅在该函数内可用。函数声明括号内的参数是局部变量。


