    `for` 循环之后的 `if` 语句会检查 `paymentSelected` 变量的值。如果其值为 `false`，它会向用户发送一条提醒消息，提醒他选择单选按钮。此外，它还会返回一个
    `false` 值，这会告诉浏览器“不要将表单数据发送到服务器”。


    如果 `paymentSelected` 变量值为 `true`，则执行 `else` 语句。如果 `paymentSelected` 变量值为 `true`，函数将返回值
    `true`，这会告诉浏览器“好的，你可以将表单数据发送到服务器”。


    ### 检查输入框是否为空


    接下来，让我们检查用户是否填写了表单中的电子邮件地址部分。在 `confirmSubmit()` 函数内部，在 `if` 语句之后、`else` 语句之前，添加以下
    JavaScript 代码。


    ![检查邮箱的代码](img/00111.jpeg)


    这段代码的目的是检查电子邮件输入文本框的值是否为空。值为 `""`（被称为空字符串）意味着用户没有在输入文本框中输入任何文本。如果输入文本框的值为空字符串，我们将提醒用户输入有效的电子邮件地址。此外，我们还会返回一个
    `false` 值，这意味着表单数据将不会提交到服务器。如果输入文本框的值为空，则将运行 `else` 语句并返回 `true`，从而允许表单数据提交到服务器。


    ### 检查下拉列表中的项目是否已选择


    最后，我们将检查用户是否已从下拉列表中选择了一个项目。在 `confirmSubmit()` 函数内部，在 `else if` 语句之后、`else` 语句之前，添加以下代码。


    ![检查下拉列表的代码](img/00112.jpeg)


    这段代码将检查用户是否从下拉列表中选择了一个项目。`else if` 语句检查用户在下拉列表中选中的值。如果该值为空字符串，则意味着用户没有从下拉列表中选择尺寸。在这种情况下，会提醒用户选择一个尺寸，且函数会返回
    `false` 值，这意味着表单数据将不会提交到服务器。如果 `else if` 语句检测到空字符串以外的值，则会运行 `else` 语句，函数返回 `true`
    值，从而允许表单数据发送到服务器。


    ### confirmReset 函数


    在我们的示例中，当用户点击 <samp class="calibre11">重置表单</samp> 按钮时，就会调用 `confirmReset()` 函数。因此，让我们创建
    `confirmReset()` 函数。再次打开你的 `"myform.html"` 文件，在 `<head>` 部分的 `<script></script>`
    标签之间添加 `confirmReset()` 函数，紧跟在 `confirmSubmit()` 函数之后。


    ![confirmReset 函数的代码](img/00113.jpeg)


    上述代码的目的是弹出一个确认对话框，询问用户在重置表单之前是否确定要重置它。我们创建了一个名为 `resetForm` 的布尔变量来存储用户的响应。如果用户点击
    <samp class="calibre11">确定</samp> 按钮，值 `true` 将存储在变量 `resetForm` 中；而如果用户点击 <samp
    class="calibre11">取消</samp> 按钮，值 `false` 将存储在 `resetForm` 变量中。然后函数将返回 `resetForm`
    变量的值。当返回 `true` 时，表单被重置；但当返回 `false` 时，表单不会重置。


