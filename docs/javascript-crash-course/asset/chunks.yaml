    class="calibre11">提交</samp> 按钮。你的浏览器应该会在窗口顶部 URL 框中以键/值对（name/value pairs）的形式显示你输入的所有信息。键/值对中的名称部分是在你在
    HTML 中创建表单时使用 `name` 属性为表单元素指定的名称。值部分部分是用户在表单中输入的信息。


