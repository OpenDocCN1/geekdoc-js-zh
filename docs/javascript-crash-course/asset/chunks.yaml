    The `if` statement after the `for` loop checks the value of the `paymentSelected`
    variable. If it''s value is `false`, it sends an alert message to the user reminding
    him to select a radio button. Additionally, it sends back a return value of `false`,
    which tells the browser "Don''t send the form data to the server".


    The `else` statement is executed if the value of the `paymentSelected` variable
    is `true`. If the `paymentSelected` variable has a value of `true`, the function
    returns a value of `true`, which tells the browser "O.K. you can send the form
    data to the server".


    ### Checking If An Input Text Box Is Empty


    Next, let''s check if the user has filled in the email address section of our
    form. Add the following JavaScript code inside the `confirmSubmit()` function,
    after the `if` statement and before the `else` statement.


    ![code for checking email](images/00111.jpeg)


    The purpose of this block of code is to check if the value of the email input
    text box is empty. A value of `""`, called the empty string, means that the user
    has not entered any text into the input text box. If the value of the input text
    box is the empty string, we will alert the user to enter a valid email address.
    In addition, we will send back a return value of `false`, which means the form
    data will not be submitted to the server. If the value of the input text box is
    not empty, the `else` statement will run, sending back a return value of `true`,
    thus enabling the form data to be submitted to the server.


    ### Checking If An Item In A Drop Down List Has Been Selected


    Finally, we will check if the user has selected an item from the drop down list.
    Add the following code inside the `confirmSubmit()` function, after the `else
    if` statement and before the `else` statement.


    ![code for checking drop down list](images/00112.jpeg)


    This block of code will check if the user has selected an item from the drop down
    list. The `else if` statement checks the value selected by the user in the drop
    down list. If the value is the empty string, that means the user did not select
    a size from the drop down list. In that case, the user is alerted to select a
    size and the function sends a return value of `false`, which means the form data
    will not be submitted to the server. If a value other than the empty string is
    detected by the `else if` statement, the `else` statement runs and the function
    sends a return value of `true`, enabling the form data to be sent to the server.


    ### The confirmReset Function


    In our example, when the user clicks the <samp class="calibre11">Reset Form</samp>
    button, the function `confirmReset()` is called. So, let''s create our `confirmReset()`
    function. Open your `"myform.html"` file again and add the `confirmReset()` function
    between the `<script></script>` tags in the `<head>` section, right after the
    `confirmSubmit()` function.


    ![code for confirmReset function](images/00113.jpeg)


    The purpose of the code above is to send a pop up confirmation dialog box to ask
    the user if he is sure that he wants to reset the form before the form is reset.
    We create a boolean variable named `resetForm` to hold the response of the user.
    If the user presses the <samp class="calibre11">OK</samp> button, the value of
    `true` is stored in the variable `resetForm`, whereas if the user presses the
    <samp class="calibre11">Cancel</samp> button, a value of `false` is stored in
    the `resetForm` variable. The value of the `resetForm` variable is then returned
    by the function. When the value of `true` is returned, the form is reset, but
    when the value of `false` is returned, the form is not reset.


    ### Testing Our Form


    Save your `"myform.html"` file and launch it in Chrome or the browser of you choice.
    Now, let''s test out our form. First, fill out all of the fields on your form
    and click the <samp class="calibre11">Submit</samp> button. Your browser should
    display all the information you entered in name / value pairs in the URL box at
    the top of your browser window. The name portion of the name / value pair is the
    name that you gave to the form element using the `name` attribute when you created
    your form in HTML. The value portion is the information that the user entered
    in the form.


    ![screenshoot url after submitting form](images/00114.jpeg)


    NOTE: The name / value pairs are separated from the URL by a `?` symbol, and each
    name / value pair is separated from each other by an `&` symbol.


    Next, let''s test our form by filling out every field except the email address
    field, and then clicking on the <samp class="calibre11">Submit</samp> button.
    Your browser window should display an alert box as follows:


    ![screenshoot of error submit form](images/00115.jpeg)


    Fill out the form again, this time leaving out the <samp class="calibre11">Method
    Of Payment</samp> field. Click on the <samp class="calibre11">Submit</samp> button.
    You should get an error message that alerts you to select a method of payment.


    Now, fill out the form again, but don''t choose a size from the drop down list.
    Click on the <samp class="calibre11">Submit</samp> button. You should get an alert
    message telling you to choose a size.


    Finally, fill out the form again, but this time click on the <samp class="calibre11">Reset
    Form</samp> button. A pop up confirmation box should appear asking you if you
    are sure you want to reset the form.


    * * *


