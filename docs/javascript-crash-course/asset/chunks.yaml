    ## Lesson 11: An Introduction To Object Oriented Programming In JavaScript


    ### What Is An Object?


    Everything is an object in JavaScript. Strings, numbers, functions, arrays, booleans,
    forms, any HTML element on your webpage, the webpage itself, the browser window,
    etc, are all objects. An `object` is a special kind of data that has properties
    and methods.


    ### What Is A Property?


    `properties` are the values that are associated with an object. For example, suppose
    you have a variable called `myName` whose value is the string "Dr. Code". Then,
    the variable `myName` is an `instance of` the string object. All string objects
    have a `length` property that returns the number of characters in the string.
    Therefore, you can use the `length` property to find the number of characters
    in the variable `myName` using the following bit of code:


    ![example](images/00083.jpeg)


    NOTE: The code `myName.length` will return the number `8` since the string "Dr.
    Code" has 8 characters, including the period and the space.


    The syntax for accessing a property of an object is as follows:


    ![syntax](images/00084.jpeg)


    ### What Is A Method?


    A `method` is an action that can be performed on an object. For example, all string
    objects have a `toUpperCase()` method that converts all the letters in a string
    to upper case letters. So, we can change all the letters in the variable `myName`
    to upper case letters by using the following bit of code:


    ![example](images/00085.jpeg)


    NOTE: The code `myName.toUpperCase()` will return the string "DR. CODE".


    The syntax for calling a method is as follows:


    ![syntax](images/00086.jpeg)


    Now, let''s look at some examples of objects that we have already used: the array
    object, the window object, and the document object.


