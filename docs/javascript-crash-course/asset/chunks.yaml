    ## Introduction


    ### What is Javascript?


    In this day and age, websites are interactive, not static like they used to be.
    This dynamic nature adds so much value to the internet because websites can interact
    with their users instead of simply displaying information. This interaction with
    the user is made possible by languages such as `JavaScript`. `JavaScript` is a
    programming language that enables a web page to respond to user input. For example,
    if a user skips over a required field in an online form, you can use `JavaScript`
    to display an error message directing the user to fill out the required information.
    This is part of what is called "form validation", and it is a major reason that
    people learn `JavaScript`. However, that is only one of the many cool things you
    can do with `JavaScript`.


    `JavaScript` is a client-side scripting language, which means that it runs in
    a browser on the user''s computer. `JavaScript` code can be inserted directly
    into `HTML` pages, and can be executed by all modern web browsers.


    ![pic of computer network](images/00001.jpeg)


    `Figure 1. A computer network` (Image courtesy of jscreationzs / freedigitalphotos.net)


    NOTE: A server-side scripting language is executed on the computer of your web
    hosting service.


    ## Getting Started


    All you need to start building your website is a `notepad++` editor. I highly
    recommend `notepad++`, because it is such an awesome coding tool that is very
    simple to use and it works with many different programming languages. You can
    download this software for free at [www.notepad-plus-plus.org](http://notepad-plus-plus.org/download/v6.3.html).
    Once you get to this website, just click on the big green download button and
    install the software on your computer.


    Next, open a new file and type the following code. Save this file as `"template.html"`.
    Make sure you type every character exactly as shown below, otherwise you could
    get an error when validating your webpage.


    ![template](images/00002.jpeg)


    Now we''re ready to get started!!!


    ## Lesson 1: The Script Tags


    `JavaScript` code can be placed inside an `HTML` document or in an external file.


    ### Using The Script Tags Inside Your HTML Document


    `JavaScript` code that is placed inside an `HTML` document must be placed between
    a pair of `<script></script>` tags to differentiate it from `HTML` and `CSS` code.
    The `<script></script>` tags may be placed in either the `<head>` or `<body>`
    section of an `HTML` document, or both. In fact, you can create as many pairs
    of `<script></script>` tags as you want or need. When in the `<head>` section,
    the `<script></script>` tags are positioned after the `<meta>` tag. When in the
    `<body>` section, they can be placed anywhere as long as they are between the
    `<body></body>` tags. However, in general, it is best to place as much of your
    `JavaScript` code as possible in the `<head>` section, because the `<head>` of
    the document is rendered before the `<body>`.


    ![html doc with script tags](images/00003.jpeg)

