    ## 第 10 课：事件与事件处理器


    ### 什么是事件？


    JavaScript 代码的主要用途是响应网页上发生的事件。`event`（事件）是网页上发生的可以被 JavaScript 检测到的事情，你的代码可以以某种方式对其做出响应。一个事件可以是用户执行的操作，例如用户在
    HTML 元素上点击鼠标，这被称为 `click` 事件。事件也可以是浏览器执行的操作，例如 `load` 事件，它在 Web 浏览器完成网页加载时发生。下面列了一些常见的事件及其触发器：


    ![list of events](img/00072.jpeg)


    ### 什么是事件处理器？


    响应特定事件的 JavaScript 代码被称为 `event handler`（事件处理器）。事件处理器是关键字，负责在事件发生时执行 JavaScript
    代码，例如，当用户点击按钮、将鼠标移动到 HTML 元素上或提交表单等时执行代码。如果你在事件名称前加上前缀 "on"，就得到了事件处理器的名称。因此，`onclick`
    是 "click" 事件的事件处理器。事件处理器的名称必须全部小写字母。


    事件处理器作为属性使用在触发事件的 HTML 元素内部。事件处理器属性的值是你希望在响应事件时运行的 JavaScript 代码。例如，假设你希望当用户鼠标移动到网页上某张图像时创建一个非常酷的效果。你可以使用代码
