    ### What Is A Variable?


    A variable is a name that stands for a value. Variables can represent numbers,
    characters, boolean values, memory locations, and much more. Using variables allows
    programs to process different sets of data. Each variable has a name and a data
    type. The data type tells the computer what type of value is stored. For example,
    if you want to store a user''s name, you might call the variable `name`. A constant
    is the opposite of a variable. A constant is a value that never changes.


    ### Naming Variables In JavaScript


    In JavaScript, your variable name must consist of only letters, numbers, the `$`
    sign, or underscores. Variable names can not start with a number, so you can not
    name your variable `1car`, but you can name it `car1`. Variables are case-sensitive,
    so the variable `car1` is not the same as `Car1`. Finally, you can not use a reserved
    word as a variable name. A reserved word is a word that has special meaning in
    a programming language. Reserved words are also called keywords. Reserved words
