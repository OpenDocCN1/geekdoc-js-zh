    ## 第 6 Lesson：决策与条件语句


    很多时候，你会遇到这样的情况：当某个条件为真时运行一段代码，当另一个条件为真时运行另一段代码。我们可以使用 `conditional statements`（条件语句）根据各种条件执行不同的操作。我们可以从四种不同的条件语句中选择：


    *   `if` 语句

    *   `if...else` 语句

    *   `if...else if...else` 语句

    *   以及 `switch` 语句


    让我们仔细查看每种条件语句。


    ### If 语句


    简单的 `if` 语句测试特定条件。如果条件为真，则 `if` 语句内部的代码将运行。然而，如果条件为假，`if` 语句内部的代码将被忽略，计算机将跳到大括号
    { } 之外的下一行代码。如果你只想在指定条件为真时运行一段代码，可以使用简单的 `if` 语句。`if` 语句的语法如下：


    ![if 语句的语法](img/00032.jpeg)


    ### If...Else 语句


    如果你希望在某个条件为真时执行一段代码，在条件为假时执行另一段代码，可以使用 `if...else` 语句。如果条件为真，第一段代码将运行。然而，如果条件为假，第二段代码将运行。`if...else`
    语句的语法如下：


    ![if else 语句的语法](img/00033.jpeg)


    ### Else-If 语句


    有时，可能需要测试多个条件。在这种情况下，你必须使用 `if...else if...else` 语句。这种条件语句允许你测试多个条件。第一个条件总是用 `if`
    语句指定的。任何额外条件都使用 `else...if` 语句指定。每个 `else if` 语句允许你指定另一个条件。你可以指定任意数量的条件，因此你可以任意数量的
    `else if` 语句。如果指定的条件都不为真，`else` 语句内部的代码块将运行。`if...else if...else` 语句的语法如下：


    ![else if 语句的语法](img/00034.jpeg)


    ### 条件与比较运算符


    比较运算符用于比较两个操作数，它们通常用于条件语句。常用的比较运算符列如下：


    ![常用的比较运算符](img/00035.jpeg)


    比较两个操作数后，会返回布尔值 `true` 或 `false`。例如，表达式 `5 == 5` 将返回 `true`，而表达式 `5 != 5` 将返回
    `false`。


    相等运算符 (==) 会检查两个操作数是否相等，然而，操作数可以是不同数据类型仍然相等。例如，表达式 `5=="5"` 将返回 `true`，因为 JavaScript
    解释器会尝试将字符串值转换为数字。然而，如果字符串无法转换为数字，则返回 `false` 值。因此，表达式 `5 == "five"` 将返回 `false`，因为解释器无法将字符串
    `"five"` 转换为数字。


    严格相等运算符 (===) 与相等运算符略有不同。它检查两个操作数具有相同的值且数据类型相同。例如，表达式 `5==="5"` 将返回 `false`，因为一个操作数是数字类型，而另一个是字符串类型。


    ### 复杂条件与逻辑运算符


