    ## 第 11 课：JavaScript 面向对象编程简介


    ### 什么是对象？


    在 JavaScript 中，一切都是对象。字符串、数字、函数、数组、布尔值、表单、网页上的任何 HTML 元素、网页本身、浏览器窗口等都是对象。`object`（对象）是一种具有属性方法的特殊数据类型。


    ### 什么是属性？


    `properties`（属性）是与对象关联的值。例如，假设你有一个变量名为 `myName`，其值为字符串 "Dr. Code"。那么，变量 `myName`
    就是字符串对象的 `instance of`（实例）。所有字符串对象都有一个 `length` 属性，用于返回字符串中的字符数。因此，你可以使用以下代码通过
    `length` 属性来查找变量 `myName` 中的字符数：


    ![example](img/00083.jpeg)


    注意：代码 `myName.length` 将返回数字 `8`，因为字符串 "Dr. Code" 有 8 个字符，包括点和空格。


    访问对象属性的语法如下：


    ![syntax](img/00084.jpeg)


    ### 什么是方法？


    `method`（方法）是可以在对象上执行的操作。例如，所有字符串对象都有一个 `toUpperCase()` 方法，它可以将字符串中的所有字母转换为大写字母。因此，我们可以使用以下代码将变量
    `myName` 中的所有字母更改为大写：


    ![example](img/00085.jpeg)


    注意：代码 `myName.toUpperCase()` 将返回字符串 "DR. CODE"。


    调用方法的语法如下：


    ![syntax](img/00086.jpeg)


