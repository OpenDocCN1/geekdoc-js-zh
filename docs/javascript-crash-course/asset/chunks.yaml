    ### Creating Your Own Objects


    The previous discussion was a sampling of some of the pre-defined objects available
    to you in JavaScript. In addition, however, JavaScript allows you to define and
    create your own objects. There are two ways that you can create your own objects
    in JavaScript:


    1.  You can use a function to define an object and then create new instances of
    the object (Constructor Functions)


    2.  You can define and create a direct instance of an object (Object Initializers)


    ### Creating Your Own Objects With Constructor Functions


