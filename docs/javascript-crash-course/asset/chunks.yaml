    with the assignment operator. The compound assignment operators are `+=, -=, *=,
    and /=`. They are used as shorthand for basic arithmetic statements. For example,
    `sum += 10;` is short for `sum = sum + 10;`. In the same way, `num -= 2;` is short
    for `num = num - 2;`, and `num *= 2;` is short for `num = num * 2;`. Finally,
    as you might have guessed, `num /= 2;` is short for `num = num / 2;`.


    ### The Increment Operator


    The **increment operator** is the symbol `( ++ )`. It is a shorthand for incrementing
    the value of a numeric variable by 1\. So the statement `num++;` is shorthand
    for `num = num + 1;`. You can use this operator before or after the variable name.
    For example, if you have a variable called `num` and you want to increment it
    by 1, you can either write `num++;` or `++num;`. Both of these statements will
    increment the value of the variable `num` by 1\. The only difference is when you
    want to use the value of the variable `num` in a calculation or print its value
    to the screen. So, for example, the statement `document.write(num++);` will print
    the value of the variable `num` to the screen and then it will add 1 to it. The
    code below will print the value <samp class="calibre11">6</samp> to the screen.


    ![increment example code](images/00017.jpeg)


    However, if we change the code slightly and put the increment operator before
    the variable, the computer adds 1 to the value of the variable `num` first, and
    then print its value to the screen. So the result of the code below is that the
    value of 7 is printed to the screen.


    ![another increment example code](images/00018.jpeg)


    ### The Decrement Operator


    The **decrement operator** is the symbol `( -- )`. It is used to decrease the
    value of a variable by 1\. So the statement `num--;` is shorthand for `num = num
    - 1;`. This operator is very similar to the increment operator except it subtracts
    1 from the value of your variable.


