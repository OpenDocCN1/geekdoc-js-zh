    变量是代表值的名称。变量可以代表数字、字符、布尔值、内存位置等。使用变量允许程序处理不同的数据集。每个变量都有一个名称和一个数据类型。数据类型告诉计算机存储的是什么类型的值。例如，如果你想存储用户的姓名，你可以将变量命名为
