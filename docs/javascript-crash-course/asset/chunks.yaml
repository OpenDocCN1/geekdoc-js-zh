    ## Lesson 7: Loops


    ### What Is A Loop?


    A `loop` is a block of code that is executed repeatedly until a certain condition
    is met. There are two main types of loops: the `for` loop, and the `while` loop.
    Let''s take a closer look at each one.


    ### The For Loop


    The `for` loop is used to execute a block of code a number of times. A `for` loop
    begins with the `for` keyword followed by three statements that are enclosed in
    a pair of parenthesis `()`. The first statement is used to initialize the value
    of the counter variable and is executed before the loop begins. The second statement
    provides the condition for running the loop. The third statement is executed at
    the end of each loop and is used to update the value of the counter variable.
    The block of code that you want to repeat is enclosed inside curly braces `{ }`.
    The syntax of the `for` loop is as follows:


    ![syntax for for loop](images/00041.jpeg)


    Let''s look at an example of a `for` loop to make things more clear. Statement
    1 in the `for` loop below assigns the value of zero to the counter variable `x`.
    Statement 2 specifies the condition that as long as the counter variable `x` is
    less than 3, the `for` loop should run. Statement 3 runs after each run of the
    loop and increments the value of the counter variable `x` by 1\. So the end result
    of the `for` loop below is that the numbers 0, 1, and 2 are printed on separate
    lines to your browser window.


    ![example of for loop](images/00042.jpeg)


    NOTE: You can also use the decrement operator (` -- `) in a `for` loop to count
    backwards. In such case, you should initialize your counter variable to a number
    other than zero if you want to deal with positive numbers.


    The following table shows the values for the variable `x` in each run of the `for`
    loop and explains how each of the three statements helps in the decision making
    process of executing the `for` loop.


    ![the for loop in action](images/00043.jpeg)


    After the `for` loop has run, your browser window should appear as follows:


    ![for loop screenshot](images/00044.jpeg)


    ### The While Loop


    A `while` loop is another method you can use to repeatedly execute a block of
    code. The `while` loop begins with the `while` keyword followed by a condition
    enclosed within a pair of parenthesis `()`. A `while` loop continues running as
    long as the specified condition is true. The block of code to be repeated is enclosed
    within a pair of curly braces `{ }`. The syntax for the while loop is shown below:


    ![syntax for while loop](images/00045.jpeg)


    Now let''s see the while loop in action. The while loop below will execute as
    long as the value of the variable `x` is less than or equal to 4\. It is very
    important that you put a statement inside the loop that will stop the while loop
    from executing, otherwise you will have an `infinite loop`. An infinite loop is
    a loop that never stops running, and it will cause your browser to crash. In this
    example, the statement `x++;` is very important because it provides a means for
    the loop to finish executing. Without this statement, you will have an infinite
    loop because the variable `x` will always have the value of 1, and 1 is always
    less than 4.


    ![example of while loop](images/00046.jpeg)


    The table below shows the values of the variable `x` in each run of the `while`
    loop and explains the decision making process for executing the `while` loop.


    ![the while loop in action](images/00047.jpeg)


    After the `while` loop runs, your browser window should look as follows:


    ![while loop screenshot](images/00048.jpeg)


    ### The Continue Statement


    The `continue;` statement allows you to skip over one iteration of a loop. When
    the `continue;` statement is placed in a block of code, it tells the interpreter
    to skip the remaining block of code and immediately start the next iteration of
    the loop.


