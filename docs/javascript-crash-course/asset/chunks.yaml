    ## 第 9 课：JavaScript 弹出框


    弹出对话框用于与用户通信并从用户处获取信息。弹出框有三种：警告框（alert box）、确认框（confirm box）和提示框（prompt box）。让我们来看看如何使用它们。


    ### Alert 警告框


    alert 警告弹出框用于向用户显示信息，通常用于显示错误消息。例如，如果用户忘记填写必填字段，你可以提醒用户填写必填字段。你还可以使用 alert 对话框通过通过显示特定阶段变量的值来测试你的
    JavaScript 代码。alert 对话框包含一个 `OK` 按钮，按下后确认用户已看到消息。


    ![弹出 alert](img/00061.jpeg)


    创建 alert 对话框的语法如下：


    ![alert 语法](img/00062.jpeg)


    或者，你可以使用以下简写代码：


    ![alert 函数语法](img/00063.jpeg)


    我们将在第 10 课中练习使用 alert 弹出框。


    ### Confirm 确认框


    confirm 弹出框比 alert 警告框稍微复杂一点。confirm 对话框不仅仅是显示消息，它允许向用户提问。confirm 弹出框在对话框底部显示两个按钮：`OK`
    和 `Cancel`。当用户选择 `OK` 按钮时，返回值为 `true`，但当用户选择 `Cancel` 按钮时，返回值为 `false`。confirm
    对话框允许你向用户一个是非问题，并根据用户的回答继续处理。


    ![弹出 confirm](img/00064.jpeg)


    创建 confirm 对话框的语法如下：


    ![confirm 函数语法](img/00065.jpeg)


    或者，你可以使用以下简写代码：


    ![confirm 函数语法](img/00066.jpeg)


    我们将在第 12 课中练习使用 confirm 弹出框。


    ### Prompt 提示框


    prompt 弹出框允许你向用户提问并以文本字符串的形式从用户处获取信息。prompt 对话框在选择 `OK` 按钮时返回用户输入的文本字符串，在选择 `Cancel`
    按钮时返回 `null`。


    ![弹出 prompt](img/00067.jpeg)


