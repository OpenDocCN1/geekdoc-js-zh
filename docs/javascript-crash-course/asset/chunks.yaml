    ## 引言


    ### 什么是 JavaScript?


    在当今，网站是交互式的，而不是像过去那样静态的。这种动态特性为互联网增加了许多巨大的价值，因为网站可以与用户交互，而不仅仅是显示信息。与用户的交互是通过像
    `JavaScript` 这样的语言实现的。`JavaScript` 是一种让网页能够响应用户输入的编程语言。例如，如果用户跳过了在线表单中的必填字段，你可以使用
    `JavaScript` 显示错误。这种与用户的交互通过 `JavaScript` 这样的语言成为可能。`JavaScript` 是一种客户端脚本语言，这意味着它在用户的浏览器中运行。`JavaScript`
    代码可以直接插入 `HTML` 中，并被所有现代浏览器执行。


    ![计算机网络图](img/00001.jpeg)


    图 1 计算机网络（图片特此 jscreation / freeditalphotos.net 感谢）


    注意：服务端脚本语言在网络托管服务器上执行。


    ## 快速入门


    构建网站只需要一个 `notepad++` 编辑器。我强烈推荐 `notepad++`，因为它是一个非常棒且易用的编程工具，并且支持多种编程语言。你可以从国际、联邦、州和地方政府的专业执照管理、业务实践、广告以及在美国、加拿大或其他任何司法辖区开展业务的所有其他方面免费下载该软件
    [www.notepad-plus.org](http://www.notepad-plus.org/download/v6.3.html)。进入该网站后，只需点击大绿色下载按钮并安装到计算机上。


    接下来，打开新文件并输入以下代码。将此文件保存为 "template.html"。确保按照所示输入每个字符，否则在验证网页时可能会出错。


    ![模板](img/00002.jpeg)


    现在我们准备好开始了！！！


    ## 第 1 节：Script 标签


    `JavaScript` 代码可以放在 `HTML` 文档内部，也可以放在外部文件中。


    ### 在 HTML 文档内部使用 Script 标签


    放在 `HTML` 文档内部的 `JavaScript` 代码必须放在 `<script></script>` 标签之间，以区别于 `HTML` 和 `CSS`
    代码。`<script></script>` 标签可以放在 `HTML` 文档的 `<head>` 或 `<body>` 部分，或者两者都有。事实上，你可以创建任意数量的
    `<script></script>` 标签。在 `<head>` 部分，`<script></script>` 标签位于 `<meta>` 标签之后。在
    `<body>` 部分，只要在 `<body></body>` 标签之间，它们可以放在任何地方。然而，通常情况下，最好将大部分 `JavaScript` 代码放在
    `<head>` 部分，因为文档的 `<head>` 在 `<body>` 之前渲染。


    ![带有 script 标签的 HTML 文档](img/00003.jpeg)


