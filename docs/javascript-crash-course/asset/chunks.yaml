    The `action` attribute of the `form` tag tells your browser where to send the
    form data when the user clicks on the `Submit` button. For simplicity and learning
    purposes, our form validation code will be located in the `<head>` section of
    our `"myform.html"` document, so we will send the data to the file `"myform.html"`
    for processing. However, when you have more complicated forms, you may want to
    send your form data to an external JavaScript source file for validation.


    ### The Method Attribute


    The `method` attribute tells the browser how to send the form data. The two most
    commonly used methods are the `get` method and the `post` method. The `get` method
    attaches form data to the URL in name / value pairs. The `get` method should never
    be used when dealing with sensitive data because the data will be visible in the
    URL. Furthermore, if you have lengthy data to send, you should not use the `get`
    method because the length of the URL is limited to about 3000 characters. In instances
    when you have sensitive or lengthy data, you should use the `post` method, which
    has no restrictions on the length of the data, and is a more secure method since
    the data is not shown in the URL. However, for learning purposes, the `get` method
    is ideal since we will be able to see our submitted form data in the URL.


    ### The Onsubmit And Onreset Event Handlers


    In our example, the `onsubmit` event handler calls the `confirmSubmit()` function
    when the user clicks on the `Submit` button of our form.


    When the user clicks on the `Reset` button, all of the values that the user has
    entered in the form will be erased. In addition, you can use the `onreset` event
    handler to give the browser extra instructions on what to do when the `Reset`
    button is clicked. In our example, the `onreset` event handler calls the function
    `confirmReset()`.


    ### Accessing Form Data


    Before we can check if the user filled out our form correctly, we must know how
    to access the data that was entered into the form by the user. The `document`
    object has a `forms[]` array that contains all the forms on a web page. Each form
    is contained within a pair of `<form></form>` tags, and you can have multiple
    forms on a web page. The forms are referenced according to their position on the
    web page. So the first `<form>` element on the web page is referred to as `forms[0]`,
    the second form element is `forms[1]`, and the third form element is `forms[2]`,
    and so on. However, most web pages do not contain more than one `<form>` element.
    If there are no forms on the web page, the `forms[]` array is empty. So, in our
    example, the code `document.forms[0]` will give us access to the form we created
    in the beginning of this lesson.


    The `forms[]` array contains elements within the form, such as the `<input>` element,
    the `<select>` element, etc. that can be accessed. We can access the elements
    in a form by using the value of the `name` attribute of the element. For example,
    in the form that we created in the beginning of this lesson, we named the first
    `<input>` element `"myemail"` using the `name` attribute. We named the `<select>`
    element `"size"`, and we named the set of radio buttons `"payment"`. So, if we
    wanted to refer to the first `<input>` element that we created in our form, we
    would use the code `document.forms[0].myemail`.


    Each element in a form is an object with properties and methods. One very useful
    property is the `value` property. The `value` property stores the data that the
    user enters into a `<form>` element. In the case of the email input field, the
    `value` property stores a string whose value is the text that the user enters
    into the email input field. So, if we want to access the email address that the
    user typed into the email address input field, we would use the code `document.forms[0].myemail.value`.


    The `<select>` element is a little different from the email `<input>` element.
    The values of the `<select>` element are pre-defined. Recall the `<select>` element
    in our form at the beginning of this lesson:


    ![select element](images/00108.jpeg)


    Notice that there is a `value` attribute inside each of the `<option>` tags. The
    `value` attribute equals the empty string (`""`) when the first `<option>` tag
    is selected. This means the user did not select any option from the drop down
    list. The text for the first option is usually reserved for writing instructions
    for the user, such as `Select An Option`. The `value` attribute equals `"small"`
    when the user selects the second option, it equals `"med"` when the user selects
    the third option, and so on. So, if we wanted to find out which option the user
    selected from the drop down list, we would use the code `document.forms[0].size.value`.


    Recall that our form included a radio button element that let the user choose
    his method of payment, and that we named this set of radio buttons `payment` using
    the `name` attribute. Radio buttons and checkboxes are different from other `<input>`
    elements because the same name applies to a set of buttons. In order to distinguish
    between the buttons, we need to store the values of each button in an array called
    `payment[]`, where the first button''s value is stored in `payment[0]`, the second
    button''s value is stored in `payment[1]`, and the third button''s value is stored
    in `payment[2]`. The value of each button is either `true` or `false`. It is `true`
    if the user selects the button, and `false` if the user does not select the button.


    ![radio buttons](images/00109.jpeg)


    The `checked` property is only available to check boxes and radio buttons, and
    it returns the boolean value that tells whether a radio button or check box has
    been selected by the user. So, if we wanted to check if the user selected the
    `Debit Card` radio button in the `Method Of Payment` section of our form, we could
    use the following code: `document.forms[0].payment[1].checked`. If this bit of
    code returns a value of `true`, then the user has checked the `Debit Card` radio
    button.


    ### The confirmSubmit Function


    The purpose of the `confirmSubmit()` function will be to validate our form data.
    You can name your function anything you like, but in our example, we named our
    function `confirmSubmit()`. Now that we''ve named our function, let''s start building
    it!


    ### Checking If A Radio Button Has Been Selected


    Now, let''s start creating our `confirmSubmit()` function. Open your `"myform.html"`
    file and add the following code between the `<script></script>` tags in the `<head>`
    section:


    ![code for confirmSubmit function](images/00110.jpeg)


    The purpose of the code above is to check if the user has selected a radio button
    in our form.


    First, we assume that the user has not selected a radio button, so we set the
    value of a boolean variable called `paymentSelected` to `false`.


    Next, we will check to see if any of the radio buttons have been selected using
    a `for` loop. Since there are 3 radio buttons on our form, we will set our counter
    variable to go through the loop 3 times. Each run of the loop checks for a value
    of `true`. If a value of `true` is found, that means the user checked a radio
    button, and we can change the value of our boolean variable `paymentSelected`
    to `true`, and break out of the loop. On the other hand, if none of the checked
    values has the value of `true` after the `for` loop has run, then the boolean
    variable `paymentSelected` will remain `false`, which means the user did not select
    a radio button.

    '
