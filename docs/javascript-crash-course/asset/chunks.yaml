    ## Lesson 6: Making Decisions And Conditional Statements


    Many times, you will come across a situation in which you need one block of code
    to run if a certain condition is true, and another block of code to run if another
    condition is true. We can use `conditional statements` to perform different actions
    based on various conditions. There are four different kinds of conditional statements
    that we can choose from:


    *   the `if` statement

    *   the `if...else` statement

    *   the `if...else if...else` statement

    *   and the `switch` statement


    Let''s take a closer look at each type of conditional statement.


    ### The If Statement


    A simple `if` statement tests for a certain condition. If the condition is true,
    the code inside the `if` statement runs. However, if the condition is false, the
    code inside the `if` statement is ignored and the computer skips to the next line
    of code outside the curly braces { }. You can use a simple `if` statement if you
    want a block of code to run only if the specified condition is true. The syntax
    of the `if` statement is as follows:


    ![syntax for if statement](images/00032.jpeg)


    ### The If...Else Statement


    If you want to execute a block of code if a certain condition is true, and another
    block of code if the condition is false, you can use an `if...else` statement.
    If the condition is true, the first block of code will run. However, if the conditions
    is false, the second block of code will run. The syntax of the `if...else` statement
    is as follows:


    ![syntax for if else statement](images/00033.jpeg)


    ### The Else-If Statement


    Sometimes, it may be necessary to test for more than one condition. In such a
    case, you must use the `if...else if...else` statement. This type of conditional
    statement allows you to test for more than one condition. The first condition
    is always specified with the `if` statement. Any additional conditions are specified
    using `else...if` statements. Each `else if` statement allows you to specify another
    condition. You can specify as many conditions as you like, so you can have as
    many `else if` statements as you want. If none of the specified conditions are
    true, the block of code inside the `else` statement will run. The syntax for the
    `if...else if...else` statement is as follows:


    ![syntax for else if statement](images/00034.jpeg)


    ### Conditions And Comparison Operators


    Comparison operators are used to compare two operands, and they are commonly used
    in conditional statements. Some commonly used comparison operators are listed
    below:


    ![some comparison operators](images/00035.jpeg)


    A Boolean value of either `true` or `false` is returned after the two operands
    are compared. For example, the expression `5 == 5` will return a value of `true`,
    while the expression `5 != 5` will return a value of `false`.


    The equal operator (==) will check if two operands are equal, however, the operands
    can be of different data types and still be equal. For example, the expression
    `5=="5"` will return a value of `true`, because the JavaScript interpreter will
    try to convert a string value to a number. However, if the string can not be converted
    to a number, the value of `false` is returned. So, the expression `5 == "five"`
    will return a value of `false` because the interpreter can not convert the string
    `"five"` to a number.


    The strictly equal operator (===) is slightly different from the equal operator.
    It checks if two operands have the same value and are of the same data type. For
    example, the expression `5==="5"` will return a value of `false`, because one
    operand is of the number type, while the other is of the string type.


