    ![code for array methods](images/00059.jpeg)


    Save the file as `methods.html` and launch it in Chrome or the browser of your
    choice. Your browser window should look as follows:


    ![screenshot](images/00060.jpeg)


    ## Lesson 9: JavaScript Pop Up Boxes


    Pop up dialog boxes are used to communicate with and get information from the
    user. There are three kinds of pop up boxes: the alert box, the confirm box, and
    the prompt box. Let''s take a look at how to use them.


    ### The Alert Box


    The alert pop up box is used to display information to the user, and it is often
    used to display error messages. For example, if a user forgets to fill out a required
    field, you could alert the user to fill out the required field. You can also use
    the alert dialog box to test your JavaScript code by using it to display the value
    of a variable at a certain stage. The alert dialog box contains an `OK` button
    that when pressed confirms that the message has been seen by the user.


    ![pop up alert](images/00061.jpeg)


    The syntax for creating an alert dialog box is as follows:


    ![syntax for alert](images/00062.jpeg)


    Or, you can use the following shorthand code:


    ![syntax for alert function](images/00063.jpeg)


    We will practice using the alert pop up box in Lesson 10.


    ### The Confirm Box


    The confirm pop up box is a little more complex than the alert pop up box. Instead
    of simply displaying a message, the confirm dialog box allows you to ask the user
    a question. The confirm pop up box displays two buttons at the bottom of the dialog
    box, `OK` and `Cancel`. When the user chooses the `OK` button, a value of true
    is returned, but when the user chooses the `Cancel` button, a value of false is
    returned. The confirm dialog box allows you to ask the user a yes or no question
    and continue processing based on the user''s answer.


    ![pop up confirm](images/00064.jpeg)


    The syntax for creating a confirm dialog box is as follows:


    ![syntax for confirm function](images/00065.jpeg)


    Or, you can use the following shorthand code:


    ![syntax for confirm function](images/00066.jpeg)


    We will practice using the confirm pop up box in Lesson 12.


    ### The Prompt Box


    The prompt pop up box enables you to ask your user a question and get information
    from your user in the form of a text string. The prompt dialog box returns the
    text string entered by the user when the `OK` button is selected, and it returns
    null when the `Cancel` button is selected.


    ![pop up prompt](images/00067.jpeg)

