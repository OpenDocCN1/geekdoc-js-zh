    `form` 标签的 `action` 属性告诉浏览器当用户点击 `Submit` 按钮时将表单数据发送到哪里。为了简单起见为了学习，我们的表单验证代码将位于
    `"myform.html"` 文档的 `<head>` 部分，因此我们将数据发送到 `"myform.html"` 文件进行处理。然而，当你有更复杂的表单时，你可能希望将表单数据发送到外部
    JavaScript 源文件进行验证。


    ### Method 属性 (Method Attribute)


    `method` 属性告诉浏览器如何发送表单数据。最常用的两种方法是 `get` 方法和 `post` 方法。`get` 方法以名称/值对的形式将表单数据附加到
    URL 中。处理敏感数据时，绝不应该使用 `get` 方法，因为数据在 URL 中可见的。此外，如果你有很长的数据需要发送，不应该使用 `get` 方法，因为
    URL 的长度被限制在 3000 个字符左右。在处理敏感或很长数据的情况下，你应该使用 `post` 方法，它对数据长度没有限制，而且由于数据不显示在 URL
    中，因此是一种更安全的方法。不过，出于学习目的，`get` 方法是理想的，因为我们可以在 URL 中看到提交的表单数据。


    ### Onsubmit 和 Onreset 事件处理器 (The Onsubmit And Onreset Event Handlers)


    在示例中，当用户点击表单的 `Submit` 按钮时，`onsubmit` 事件处理器调用 `confirmSubmit()` 函数。


    当用户点击 `Reset` 按钮时，用户在表单中输入的所有值将被清除。此外，你可以使用 `onreset` 事件处理器告诉浏览器在点击 `Reset` 按钮时执行额外指令。在我们的示例中，`onreset`
    事件处理器调用函数 `confirmReset()`。


    ### 访问表单数据 (Accessing Form Data)


    在我们检查用户是否正确填写了表单之前，我们必须知道如何访问用户输入表单的数据。`document` 对象有一个 `forms[]` 数组，其中包含了网页上所有的表单。每个表单都包含在
    `<form></form>` 标签中，你可以在一个网页上有多个表单。表单根据它们在网页上的位置进行引用。因此，网页上的第一个 `<form>` 元素被称为
    `forms[0]`，第二个表单元素是 `forms[1]`，第三个表单元素是 `forms[2]`，依此类推。然而，大多数网页不包含多个 `<form>`
    元素。如果网页上没有表单，`forms[]` 数组就是空的。因此，在我们的示例中，代码 `document.forms[0]` 将允许我们访问在本课程开始创建的表单。


    `forms[]` 数组包含了表单内的元素，例如 `<input>` 元素、`<select>` 元素等，是可以访问的。我们可以通过使用元素的 `name`
    属性值来访问表单中的元素。例如，在我们课程开始时创建的表单中，我们使用 `name` 属性将第一个 `<input>` 元素命名为 `"myemail"`。我们将
    `<select>` 元素命名为 `"size"`，并将这组单选按钮命名为 `"payment"`。因此，如果我们想引用表单中创建的第一个 `<input>`
    元素，我们将使用代码 `document.forms[0].myemail`。


    表单中的每个元素都是具有属性和方法的对象。一个非常有用的属性是 `value` 属性。`value` 属性存储用户输入到 `<form>` 元素的数据。在电子邮件输入字段的情况下，`value`
    属性存储一个字符串，其值是用户在电子邮件输入字段中输入的文本。因此，如果我们想访问用户在电子邮件地址输入字段中输入的地址，我们将使用代码 `document.forms[0].myemail.value`。


    `<select>` 元素与电子邮件 `<input>` 元素略有不同。`<select>` 元素的值是预定义的。回想我们在课程开始时表单中的 `<select>`
    元素：


    ![select element](img/00108.jpeg)


    注意每个 `<option>` 标签内部都有一个 `value` 属性。当选择第一个 `<option>` 标签时，`value` 属性等于空字符串 (`""`)。这意味着用户没有从下拉列表中选择任何选项。第一个选项的文本通常留作为用户撰写说明，例如
    `Select An Option`。当用户选择第二个选项时，`value` 属性等于 `"small"`，当用户选择第三个选项时，`value` 等于 `"med"`，依此类推。因此，如果我们想知道用户从下拉列表中选择了哪个选项，我们将使用代码
    `document.forms[0].size.value`。


    回想我们的表单包含一个单选按钮元素，允许用户选择其支付方式，我们使用 `name` 属性将这组单选按钮命名为 `payment`。单选按钮和复选框与其他 `<input>`
    元素不同，因为相同的名称适用于一组按钮。为了区分这些按钮，我们需要将每个按钮的值存储在一个名为 `payment[]` 的数组中，其中第一个按钮的值存储在
    `payment[0]` 中，第二个按钮的值存储在 `payment[1]` 中，第三个按钮的值存储在 `payment[2]` 中。每个按钮的值为 `true`
    或 `false`。如果用户选择了按钮，则为 `true`；如果用户没有选择该按钮，则为 `false`。


    ![radio buttons](img/00109.jpeg)


    `checked` 属性仅对复选框和单选按钮可用，它返回一个布尔值，告诉我们用户是否选中了单选按钮或复选框。因此，如果我们想检查用户是否选中了表单中 `Method
    Of Payment` 部分的 `Debit Card` 单选按钮，可以使用以下代码：`document.forms[0].payment[1].checked`。如果这段代码返回值为
    `true`，则用户已选中 `Debit Card` 单选按钮。


    ### confirmSubmit 函数 (The confirmSubmit Function)


    `confirmSubmit()` 函数的目的是验证我们的表单数据。你可以为函数命名任何名称，但在我们的示例中，我们将函数命名为 `confirmSubmit()`。现在我们已经命名了函数，让我们开始构建它！


    ### 检查单选按钮是否被选中 (Checking If A Radio Button Has Been Selected)


    现在，让我们开始创建 `confirmSubmit()` 函数。打开你的 `"myform.html"` 文件，并在 `<head>` 部分的 `<script></script>`
    标签之间添加以下代码：


    ![code for confirmSubmit function](img/00110.jpeg)


    上述代码的作用是检查用户是否选择了表单中的单选按钮。


    首先，我们假设用户没有选择单选按钮，因此我们将名为 `paymentSelected` 的布尔变量的值设置为 `false`。


    接下来，我们将使用 `for` 循环检查是否有任何单选按钮被选中。由于我们的表单上有 3 个单选按钮，我们将计数器变量设置为循环 3 次。循环的每次运行都会检查值是否为
    `true`。如果发现值为 `true`，意味着用户选中了单选按钮，我们可以将布尔变量 `paymentSelected` 的值改为 `true` 并跳出循环。另一方面，如果
    `for` 循环运行后没有任何被选中的值为为 `true`，那么布尔变量 `paymentSelected` 将保持为 `false`，这意味着用户没有选择单选按钮。


