    Because JavaScript is the most popular scripting language used today, you don''t
    have to use the `type` attribute inside the opening `<script>` tag when creating
    a web page in HTML5. However, in older versions of HTML, you must specify that
    you are placing JavaScript code inside the `<script></script>` tags, by using
    the `type` attribute with a value of `"text/javascript"`. This book assumes that
    you are using HTML5, so the script tags will not have the `type` attribute specified.


    ![script tags](images/00004.jpeg)


    ## Using An External JavaScript File


    A more efficient way to add JavaScript code to your webpage is to use an external
    JavaScript source file. Using an external JavaScript file makes your code easier
    to read because your JavaScript code is separated from your HTML code. Another
    benefit is that you can effortlessly apply your JavaScript code to multiple webpages
    using this method.


    You can call an external JavaScript file by using the `"src"` attribute in the
    opening `<script>` tag as follows: `<script src="filename.js">`. An external JavaScript
    file has a `".js"` extension, and contains only JavaScript statements. It is important
    to note that an external JavaScript source file does not contain a `<script>`
    element. The `<script>` element is located only within the HTML document that
    calls the JavaScript source file.


    You can call an external JavaScript source file in either the `<head>` section
    or in the `<body>` section of your HTML document. However, when you call an external
    JavaScript file, any JavaScript statements in between the `<script></script>`
    tags will be ignored.


    ![how to use the source attribute](images/00005.jpeg)


    ## Lesson 2: Hello World!


    JavaScript code is made up of statements. The purpose of a statement is to tell
    the browser what to do. A statement in JavaScript is comparable to a sentence
    in the English language, except each statement must end with a semicolon `(""`
    instead of a period `"."`.


    Now we will learn our very first JavaScript statement, the `document.write();`
    statement. This statement enables you to write text on your web page, however,
    it does not include a line break. Any text that you want to write to your browser
    window should be enclosed in quotation marks ("") and placed between the parenthesis
    of the `document.write();` statement as follows: `document.write("text in here");`.


    ### Now It''s Your Turn To Practice:


    We will now type our very first JavaScript statement which will print the words
    `<samp class="calibre11">"Hello World!"</samp>` on our web page. Open your `"template.html"`
    file and add the following code between the `<script></script>` tags in the body
    section of your HTML document:


    ![code for hello world example](images/00006.jpeg)


    Save the file as `"hello.html"` and launch it in Chrome or the browser of your
    choice. Your browser window should look like this:


    ![screen shot](images/00007.jpeg)


    ### More Practice:


    Now let''s practice using an external JavaScript source file. Cut out the JavaScript
    code from between the `<script></script>` tags and paste them into a new file
