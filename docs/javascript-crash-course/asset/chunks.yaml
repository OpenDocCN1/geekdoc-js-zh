    Logical Operators


    Sometimes you will want to test for more than one condition. In that case, you
    can create complex conditions consisting of 2 or more conditions using logical
    operators. There are three logical operators in JavaScript, and they are listed
    below:


    ![symbols for logical operators](images/00036.jpeg)


    The AND operator (`&&`) returns a Boolean value of `true` only when all the operands
    have a value of `true`. The OR operator (` || `) returns a value of `true` when
    at least one of the operands has a value of `true`, otherwise it returns `false`.
    The NOT operator (` ! `) returns a value of `false` when the operand has a value
    of `true`, and it returns a value of `true` when the value of the operand is `false`.
    This information is summarized in the table below:


    ![summary of logical operators](images/00037.jpeg)


    Let''s look at some examples of how to create complex conditions using the logical
    operators. The expression `(5 < 30) && (6 == 8)`, will return a value of `false`
    because one of the operands has a value of `false`. However, the expression `(5
    < 30) || (6 == 8)` will return `true` because one of the operands is `true`. And
    finally, the expression `!(6 == 8)` will return a value of `true` because the
    value of the operand is `false`.


