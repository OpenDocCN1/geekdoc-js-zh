    ### The getElementById Method


    The document object has another very useful method, called the `getElementById()`
    method. The `getElementById()` method allows you to manipulate HTML elements on
    your webpage. This method not only enables you to change the content of an element
    based on user interaction, but it also allows you to change the CSS style rules
    associated with an element.


    However, before you can manipulate an HTML element, you must use the `id` attribute
    to specify which element you want to manipulate. You can specify a unique name
    for an element as follows:


    ![syntax for adding id attribute](images/00089.jpeg)


    Now that we have marked the HTML element that we want to manipulate with the `id`
    attribute, we can use the id name with the `getElementById()` method to access
    that particular HTML element as follows:


    ![syntax for getElementById](images/00090.jpeg)


    There are several things that we can do to manipulate an HTML element. We can
    change the content of an element, we can change the attribute of an element, and
    we can change the style of an element.


