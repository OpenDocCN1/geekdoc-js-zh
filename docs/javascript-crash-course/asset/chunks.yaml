    `grade` 变量对应的正确代码块是否运行。


    ## 第 7 ：循环


    ### 什么是循环？


    `loop`（循环）是一段重复执行的代码块，直到满足特定条件为止。循环有两种主要类型：`for` 循环和 `while` 循环。让我们仔细查看每一个。


    ### for 循环


    `for` 循环用于重复执行指定次数的代码块。一个 `for` 循环以 `for` 关键字开始，后面跟着三个包含在括号 `()` 中的语句。第一个语句用于初始化计数器变量的值，并在循环开始之前执行。第二个语句提供了运行循环的条件。第三个语句在每次循环结束时执行，用于更新计数器变量的值。你想要重复的代码块包含在大花括号
    `{ }` 中。`for` 循环的语法如下：


    ![for 循环语法](img/00041.jpeg)


    让我们来看一个 `for` 循环的示例以便更清楚。下面的 `for` 循环中的语句 1 将零值赋值给计数器变量 `x`。语句 2 规定了条件：只要计数器变量
    `x` 小于 3，`for` 循环就会运行。语句 3 在每次循环后运行，并将计数器变量 `x` 的值加 1。因此，下面的 `for` 循环的最终结果是将数字
    0、1 和 2 分行打印到你的浏览器窗口中。


    ![for 循环示例](img/00042.jpeg)


    注意：你也可以在 `for` 循环中使用递减运算符（` -- `）来倒序计数。在这种情况下，如果你想处理正数，应该将计数器变量初始化为非零数字。


    下表显示了 `for` 循环在每次运行时变量 `x` 的值，并解释了这三个语句中的每一个如何帮助执行 `for` 循环的决策过程。


    ![for 循环运行演示](img/00043.jpeg)


    在 `for` 循环结束后，你的浏览器窗口应该如下：


    ![for 循环截图](img/00044.jpeg)


    ### while 循环


    `while` 循环是另一种你可以用来重复执行代码块的方法。`while` 循环以 `while` 关键字开始，后面跟着包含在括号 `()` 中的条件。只要指定的条件为真，`while`
    循环就会继续运行。要重复的代码块在大花括号 `{ }` 中。`while` 循环的语法所示：


    ![while 循环语法](img/00045.jpeg)


    现在让我们来看看 `while` 循环的运行情况。下面的 `while` 循环只要变量 `x` 的值小于或等于 4 就会执行。在循环内部放置一个能够停止 `while`
    循环执行的语句是非常重要的，否则你将会得到一个 `infinite loop`（无限循环）。无限循环是一个永远停止运行的循环，它会导致浏览器崩溃。在这个示例中，`x++;`
    语句非常重要，因为它为循环结束执行提供了手段。没有这条语句，你将会陷入无限循环，因为变量 `x` 的值始终为 1，而 1 永远小于 4。


    ![while 循环示例](img/00046.jpeg)


    下表显示了 `while` 循环在每次运行时变量 `x` 的值，并解释了执行 `while` 循环的决策过程。


    ![while 循环运行演示](img/00047.jpeg)


    在 `while` 循环运行时，你的浏览器窗口应该如下：


    ![while 循环截图](img/00048.jpeg)


    ### continue 语句


    `continue;` 语句允许你跳过循环的当前迭代。当 `continue;` 语句放在代码块中时，它告诉解释器跳过剩余的代码块并立即开始循环的下一次迭代。


