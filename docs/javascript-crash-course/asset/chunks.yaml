    ## Lesson 8: Arrays


    ### What Is An Array?


    An array is used to store multiple values using a single variable name. For example,
    suppose you have a list of customer names. You could create a new variable for
    each customer as follows: `customer1 = "John Doe"; customer2 = "Mary Contrary";
    customer3 = "Tom Tiger";`. However, if you wanted to loop through them to find
    a specific customer name, what would you do? The solution is to create a special
    data type that can store multiple values under a single name and enable you to
    access the values by referencing an index number. This special new data type is
    called an array. Referring back to our customer names example, you could create
    a `customer` array that has a list of names in it. You can access the names by
    using an index number as follows: `customer[0] = "John Doe"; customer[1] = "Mary
    Contrary"; customer[2] = "Tom Tiger";`.


    ### Creating And Populating An Array


    Now that we have a general idea of what an array is, let''s see how to create
    and populate an array. The syntax for creating an array in JavaScript is as follows:


    ![syntax for creating an array](images/00053.jpeg)


    Once you have created an array, you will need to store values in it. This is called
    populating the array. To populate an array with values, you will need the name
    of the array, the index where you want to store a value, and the value that you
    want to store in the array. The syntax for populating an array is as follows:


    ![syntax for populating an array](images/00054.jpeg)


    Now, let''s look at some example code. The following code demonstrates how to
    create and populate the array from the previous discussion:


    ![example for creating an array](images/00055.jpeg)


    ### The Length Property Of An Array


    The `length` property of an array is used to find out how many values are stored
    in an array. The syntax for using this property with an array is as follows:


    ![syntax for length property](images/00056.gif)


    So, in our previous example, if we wanted to find the number of values stored
    in the `customer` array, we would use the code `customer.length`, which should
    return the number 3, since we have 3 values stored in our `customer` array.


    ### Now It''s Your Turn To Practice:


    Now, let''s practice looping through an array. Open your `template.html` file
    and add the following code between the `<script></script>` tags in the `<head>`
    section of your HTML document:


    ![code for array example](images/00057.jpeg)


    Save the file as `arrays.html` and launch it in Chrome or the browser of your
    choice. Your browser window should look as follows:


    ![screen shot](images/00058.jpeg)


    ### Methods Of Arrays


    Methods are actions that can be performed on an array. There are many methods
    for arrays, but we will look at only a few of them so you can understand how to
    use them.


    The `reverse()` method does not take any parameters and reverses the order of
    the array.


    The `push()` method adds elements on to the end of the array. The parameters of
    this method are the items that you want to add to the array. Each item is separated
    with a comma. If the item that you want to add to the array is a string, it should
    also be enclosed in quotation marks.


    The `sort()` method sorts the elements of your array in alphabetical order.


    The `join()` method joins the elements of your array into a string object. If
    you use this method without any arguments, it will join the items in the list
    with a comma in between them but no space. If you want to separate the items in
    the array in a different way, you can use a parameter with the `join()` method.
    The value of the parameter will be the characters that you want to use to separate
    the items in the array. So, for example, `people.join(" ");` .


