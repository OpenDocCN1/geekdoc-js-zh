    ## Lesson 4: Doing Math In JavaScript


    ### Operators And Operands


    A computer instruction is made up of two basic parts: operators and operands.
    An **operator** is a character that represents an action. For example, the plus
    sign (`+`) is an arithmetic operator that represents addition. An **operand**
    is the part of a computer instruction that specifies the data that is to be operated
    on, or manipulated. So in the expression `x + 3`, `x` and `3` are the operands.


    ![pic of operator](images/00015.jpeg)


    ### The Assignment Operator


    The **assignment operator** (`=`) is used to assign a value to a variable.


    ### The Arithmetic Operators


    The most commonly used arithmetic operators are (`+`) for addition, (`-`) for
    subtraction, (`*`) for multiplication, (`/`) for division, and (`%`) for modulo
    reduction. Modulo reduction means that you are finding the remainder from integer
    division. So, for example, `7 % 3` (pronounced "seven modulo three") is 1, because
    the remainder when you divide 3 into 7 is 1. All of these operators may be used
    with both numbers and variables.


    However, the addition operator (`+`) can also be used with strings. When you add
    two strings together, it is called **concatenation**. The code below shows how
    to use the addition operator to add numbers, variables, and strings.


    ![arithmetic operator examples](images/00016.jpeg)


    ### Compound Assignment Operators


    Compound assignment operators make coding easier by combining the arithmetic operators
    with the assignment operator. The compound assignment operators are `+=`, `-=`,
    `*=`, and `/=`. They are used as shorthand for basic arithmetic statements. For
    example, `sum += 10;` is short for `sum = sum + 10;`. In the same way, `num -=
    2;` is short for `num = num - 2;`, and `num *= 2;` is short for `num = num * 2;`.
    Finally, as you might have guessed, `num /= 2;` is short for `num = num / 2;`.


    ### The Increment Operator


    The **increment operator** is the symbol (`++`). It is a shorthand for incrementing
    the value of a numeric variable by 1. So the statement `num++;` is shorthand for
    `num = num + 1;`. You can use this operator before or after the variable name.
    For example, if you have a variable called `num` and you want to increment it
    by 1, you can either write `num++;` or `++num;`. Both of these statements will
    increment the value of the variable `num` by 1. The only difference is when you
    want to use the value of the variable `num` in a calculation or print its value
    to the screen. So, for example, the statement `document.write(num)`


    ### The Decrement Operator


    The **decrement operator** is the symbol (`--`). It is a shorthand for decrementing
    the value of a numeric variable by 1. So the statement `num--;` is short for `num
    = num - 1;`.


    ## Lesson 5: Functions


    ### What Is A Function?


    Have you ever seen how workers in an auto factory use specialization? One worker
    is responsible for welding the frame, another puts on the doors, while another
    puts in the glass windows, and so on, until you have a finished auto-mobile. The
    huge project of building a car is broken down into smaller tasks, and each worker
    specializes in doing one task. Similarly, we use functions to break down a big
    program into smaller parts. Creating a complex program is similar to building
    a car. It is easier if you break down the job that you want your program to do
    into smaller tasks that can be tackled. A **function** is a named block of code
    that performs a particular task when called.


    ### Defining A Function


    **Defining** a function means giving our function a name and writing a block of
    code for it so it can do something. We define a function by using the keyword
    `function` with the name we want to give our function. We can name our function
    anything we like, but the first character must be a letter, and the rest of the
    name can include letters, numbers, or underscores. By convention, programmers
    use function names like `getUserName`, where the first word is not capitalized,
    and every word after the first starts with a capital letter. This naming convention
    is called **camel-caps notation**.

