    ## Lesson 5: Functions


    ### What Is A Function?


    Have you ever seen how workers in an auto factory use job specialization? One
    worker is responsible for welding the frame, another puts on the doors, while
    yet another puts in the glass windows, and so on, until you have a finished auto-mobile.
    The huge project of building a car is broken down into smaller tasks, and each
    worker specializes in doing one task. Similarly, we use functions to break down
    a big program into smaller manageable parts. Creating a complex program is similar
    to building a car. It is easier if you break down the job that you want your program
    to do into smaller tasks that can be easily tackled. A function is similar to
    the worker who uses job specialization to perform his task on the assembly line.
    A **function** is a named block of code that performs a particular task when called.


    Another reason that functions are so awesome is that functions allow us to write
    a bit of code once, but we can use it over and over again, as many times as we
    want. That not only saves us lots of time and effort, but it also makes our code
    easier to read.


    ### Defining A Function


    **Defining** a function means giving our function a name and writing a block of
    code for it so it can do something. We define a function by using the keyword
    `function` along with the name we want to give our function. We can name our function
    anything we like, but the first character must be a letter, and the rest of the
    name can include letters, numbers, or underscores. By convention, programmers
    use function names like `getUserName`, where the first word is not capitalized,
    and every word after the first starts with a capital letter. This naming convention
    is called **camel-caps notation**.


    More often than not, our function will need some kind of information from outside
    the function to perform its task. This "outside information" that a function needs
    to do its job is called a **parameter**. A function might not take any parameters,
    or it could take one or more parameters, depending on what it is created to do.
    The parameters that a function needs are placed between a pair of parenthesis
    ( ), after the function name.'
