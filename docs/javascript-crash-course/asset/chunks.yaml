    ## Lesson 10: Events And Event Handlers


    ### What Is An Event?


    The primary way that JavaScript code is used is to respond to events on a web
    page. An `event` is something that happens on a web page that can be detected
    by JavaScript, and that your code can respond to in some way. An event can be
    an action performed by a user, such as the user clicking his mouse on an HTML
    element. This is called the `click` event. An event can also be an action performed
    by the browser, such as the `load` event, which occurs when a web browser finishes
    loading a web page. Some of the more common events and their triggers are listed
    below:


    ![list of events](images/00072.jpeg)


    ### What Are Event Handlers?


    JavaScript code that responds to a specific event is called an `event handler`.
    Event handlers are keywords that are responsible for executing JavaScript code
    when an event happens, such as when the user clicks on a button, moves his mouse
    over an HTML element, or submits a form, etc. If you add the prefix "on" to the
    event name, you get the name of the event handler. So, `onclick` is the event
    handler for the "click" event. Event handler names must be written in all lower
    case letters.


    Event handlers are used as attributes inside the HTML element that initiates the
    event. The value of the event handler attribute is the JavaScript code that you
    want to run in response to the event. For example, suppose you want to create
    a really cool effect when a user moves his mouse over an image on your web page.
    You could use the code `<img onmouseover="JavaScript code" >` to add a mouseover
    event to the image element. The basic syntax of an event handler is:


    ![syntax for event handler](images/00073.jpeg)


    You can add more than one JavaScript statement in an event handler. Just remember
    to enclose all of the statements within the quotation marks (" ") and end each
    statement with a semicolon (;) as follows:


    ![syntax ](images/00074.jpeg)


