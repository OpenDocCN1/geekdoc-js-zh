    ### 赋值运算符


    **赋值运算符**（`=`）用于给变量赋值。


    ### 算术运算符


    最常用的算术运算符是（`+` 用于加法，`-` 用于减法，`*` 用于乘法，`/` 用于除法，以及（`%` 用于取模运算（取余）。取模运算意味着你正在寻找整数除法的余数。例如，`7
    % 3`（读作 "seven modulo three"）是 1，因为 7 除以 3 的余数是 1。所有这些运算符都可以用于数字和变量。


    然而，加法运算符（`+`）也可以用于字符串。当你将两个字符串相加时，这被称为**拼接**。下面的代码展示了如何使用加法运算符处理数字、变量和字符串。


    ![算术运算符示例](img/00016.jpeg)


    ### 复合赋值运算符


    复合赋值运算符通过将算术运算符与赋值运算符相结合使编码变得更容易。复合赋值运算符有 `+=`、`-=`、`*=` 和 `/=`。它们被用作基本算术语句的简写。例如，`sum
    += 10;` 是 `sum = sum + 10;` 的简写。同样，`num -= 2;` 是 `num = num - 2;` 的简写，`num *=
    2;` 是 `num = num * 2;` 的简写。最后，正如你可能猜到的那样，`num /= 2;` 是 `num = num / 2;` 的简写。


    ### 递增运算符


    **递增运算符**是符号（`++`）。它是数字变量值加 1 的简写。因此，语句 `num++;` 是 `num = num + 1;` 的简写。你可以在变量名之前或之后使用该运算符。例如，如果你有一个名为
    `num` 的变量并想让它加 1，你可以写 `num++;` 或 `++num;`。这两个语句都会将变量 `num` 的值加 1。唯一的区别在于你何时想在计算中使用变量
    `num` 的值或将其值打印到屏幕上。例如，语句 `document.write(num)`


    ### 递减运算符


    **递减运算符**是符号（`--`）。它是数字变量值减 1 的简写。因此，语句 `num--;` 是 `num = num - 1;` 的简写。


    ## 第 5 ：函数


    ### 什么是函数？


    你是否见过汽车工厂的工人是如何使用分工的？一个工人负责焊接框架，另一个人安装门，另一个人安装玻璃窗窗，依此类推，直到你得到一辆完工的汽车。制造汽车的巨大工程被拆分为更小的任务，每个工人专门负责一项任务。同样，我们使用函数将一个大程序拆分成更小的部分。创建一个复杂的程序类似于造汽车。如果你将想让程序执行的工作拆分为可以处理的小任务，就会变得更容易。**函数**是一个在调用时执行特定任务的命名代码块。


    ### 定义函数


    **定义**函数意味着为我们的函数命名并为其编写代码块以便执行某些操作。我们通过使用关键字 `function` 加上我们要给函数的名字来定义函数。我们可以为函数任意命名，但第一个字符必须是字母，名称其余部分可以是字母、数字或下划线。按照习惯，程序员使用像
    `getUserName` 这样的函数名，其中第一个单词小写，之后的每个单词大大写字母开头。这种命名约定被称为**驼峰命名法（camel-caps notation）**。


