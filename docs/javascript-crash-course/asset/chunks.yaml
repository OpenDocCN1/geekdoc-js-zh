    Your browser window should display the message `<samp class="calibre11">You are
    an adult who is not retired!</samp>` Now, experiment by changing the value of
    the `age` variable to `2` and then to `70`. Your browser should display the message
    `<samp class="calibre11">You are still a child!</samp>` when the age is 2 and
    `<samp class="calibre11">You are retired!</samp>` when the age is 70.


    ### The Switch Statement


    Finally, let''s look at the last type of conditional statement, the `switch` statement.
    The `switch` statement can be very useful when you have one expression that needs
    to be evaluated, but many conditions and blocks of code that depend on the value
    of that expression. The `switch` statement works as follows:


    1. The expression, which is most often a variable, is evaluated once.

    2. Then the value of the expression is compared to a list of case values.

    3. If a match is found, the block of code associated with that case is executed.

    4. The `break;` statement allows you to exit the `switch` statement.

    5. If no match is found, the `default` block of code runs.


    The following keywords are used in the `switch` statement: `switch, case, break`,
    and `default`. The syntax for the `switch` statement is as follows:


    ![syntax for switch statement](images/00039.jpeg)


    NOTE: The blocks of code inside each `case` do not need to be enclosed in curly
    braces `{ }`, so there should only be one pair of curly braces in the entire `switch`
    statement.


