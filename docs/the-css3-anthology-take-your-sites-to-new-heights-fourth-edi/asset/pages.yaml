    If you design in Photoshop or similar, you may find that dropping in standard
    UI form elements when creating your designs helps you to remember that sometimes
    these elements are outside your control, and see them as part of the design. A
    good set of these elements can be found at Designers Toolbox.^6


    # You''ve Got Form


    In this chapter, we''ve looked at a variety of ways to style forms using CSS,
    from simply changing the look of form elements using CSS to lay out forms. We
    have seen how CSS can greatly enhance the appearance and usability of forms. We
    have also touched on the accessibility of forms for users of alternative devices,
    and we''ve seen how, by, being careful when marking forms up, you can make it
    easier for all visitors to use your site or web application.


