    \ the employment of Selectivizr more compelling as there no need for additional\
    \ CSS selectors. If the browsers eventually stop registering in the states on\
    \ your, you can simply remove the JavaScript include.\n\n# Can I add CSS or JavaScript\
    \ and have it served only to older versions of IE?\n\nThe previous solution used\
    \ a script that polyfills support for older versions of Internet Explorer. Is\
    \ it possible to serve only this script to older browsers?\n\n# Solution\n\nThe\
    \ Selectivizr polyfill is designed to provide CSS3 selector support in Internet\
