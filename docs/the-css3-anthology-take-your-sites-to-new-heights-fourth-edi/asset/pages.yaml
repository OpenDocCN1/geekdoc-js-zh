  md: '# Solution


    We can use the clear property to clear block-level elements so that they only
    render once the floated element is complete. Take a look at Figure 8.9.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_338_0.png)


    Figure 8.9. Our page is much neater after clearing the ingredients


