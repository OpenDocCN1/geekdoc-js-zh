  md: '# CSS for Layout 37


    This file fixes an orientation problem (at the time of writing), where iOS devices
    may display a layout incorrectly when a user switches from landscape to portrait.
    At some point, Apple will no doubt this fix, and it will eventually only be an
    issue for older iOS devices still circulation; hence, check that this is still
    a requirement when implementing your layouts.


    # Enquiries May Be Ignored


    Versions of Internet Explorer earlier than IE9 offer no support for media queries,
    so they will ignore all media query declarations within your CSS, serving only
    the mobile version of the site. See the section “What about other browsers and
    responsive design?” for some suggestions on how to accommodate visitors using
    browsers.


    So, that it—we’ve created a simple responsive layout. Despite being a basic project,
    the principles we’ve investigated remain the same for more complex responsive
    layouts, and we’ll have a look at a slightly different example in the section
    called “How can I use responsive-design techniques when my site is image-heavy?”


    # How do I create a print stylesheet?


    While we are ensuring users on a range of mobile or desktop devices have a rewarding
    experience viewing our site, there’s another group we should consider: those who
    wish to print content displayed on our site.


    # Solution


    Fortunately, we can create a print-specific stylesheet for our site, as illustrated
    in Figure 9.18. We''ll also need to add a link tag in the head of our HTML document
    that points to this standalone stylesheet:


    ```

    chapter_09/3col-responsive.html (excerpt)

    <link rel="stylesheet" href="3col-responsive.css" media="screen" />

    <link rel="stylesheet" href="3col-responsive-print.css" media="print" />

    ```


