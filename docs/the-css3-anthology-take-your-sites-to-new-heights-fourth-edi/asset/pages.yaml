  md: "To arrange the two columns using absolute positioning, I first need to create\
    \ a positioning context for them. If I use position: absolute, they’ll position\
    \ themselves against the viewport; I actually want to place them within the main\
    \ area of my document, below the header.\n\nMy markup has a div that wraps both\
    \ columns; it has a class of main. If I position: relative on the div so that\
    \ it creates a positioning context—the container for my two columns:\n\n```\n\
    chapter_09/2col-positioning.css (excerpt)\n.main {\n  position: relative;\n}\n\
    ```\n\nNow I simply position my two columns within this container. I set article\
    \ and aside to position: absolute. Then I position article top and left within\
    \ this container, and aside top and right:\n\n```\nchapter_09/2col-positioning.css\
    \ (excerpt)\n.article {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width:\
    \ 540px;\n}\n.aside {\n  width: 300px;\n  position: absolute;\n  top: 0;\n  right:\
    \ 0;\n}\n```\n\nOur simple two-column layout is complete. This technique can be\
    \ used anywhere in a layout—from major columns of content to small elements within\
    \ a container. We’ll discover some weaknesses with positioning in the next section,\
    \ but you should still find it useful in some contexts."
