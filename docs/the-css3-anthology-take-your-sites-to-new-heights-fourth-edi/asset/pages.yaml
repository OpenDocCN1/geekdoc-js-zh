  md: "```\n.wrapper {\n  width: 80%;\n  margin: 20px auto 40px;\n  position: relative;\n\
    }\n```\n\nIn Figure 8.13, you can see what happens. The boxes now take their position\
    \ from the height and width of the wrapper and themselves 10 pixels from the top-left\
    \ and bottom-right of the wrapper. So box2 is now below the bottom of the viewport\
    \ with our browser window size, rather than sticking to the viewport as it did\
    \ before.\n\n# Chapter 8: CSS Positioning\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_344_0.png)\n\
    \nFigure 8.13. The boxes are now positioned inside the .wrapper div\n\nThe wrapper\
    \ becomes the new “positioning context” for the absolutely positioned elements\
    \ and this behavior is important to remember. If you position absolutely, it will\
    \ take its position from the next parent element that has position: relative or\
    \ position: absolute set. If it does not find anything, it will take its position\
    \ from the viewport."
