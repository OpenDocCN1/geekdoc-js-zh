    # Discussion


    While the float property takes elements out of the normal document flow and changes
    the ways they relate to other elements, it also enables them to be cleared. So
    an element—the footer in this instance—can be set to clear: both and then display
    below the floated elements.


    To display our columns using float rather than position simply involves removing
    the position, top, left, and right properties; instead, we use float set to left
    and right, respectively:


    ```

    .article {

    float: left;

    width: 540px;

    }

    .aside {

    width: 300px;

    float: right;

    }

    ```


    We can then set the clear property on our footer:


    ```

    .footer {

    clear: both;

    background-color: rgb(59,67,68);

    color: rgb(255,255,255);

    padding: 20px;

    }

    ```


    We''re going to use float again on elements within our footer, and this will give
    us a chance to look at some of the potential issues you might encounter when using
    float and clear.'
