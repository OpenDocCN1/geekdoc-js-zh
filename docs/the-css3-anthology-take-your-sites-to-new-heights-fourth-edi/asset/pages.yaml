  md: "# CSS for Layout 355\n\n```\n<p class=\"fn org\">Recipe for Success</p>\n<div\
    \ class=\"street-address\">1 The Avenue</div>\n<div class=\"Location\">Mytown</div>\n\
    <div class=\"postal-code\">SR4 4TT</div>\n<div class=\"country-name\">United Kingdom</div>\n\
    <a class=\"email\" href=\"mailto:test@example.com\">test@example.com</a></div>\n\
    <div class=\"tel value=\"+44&nbsp;(0);&nbsp;1234 56789\"></div>\n</div>\n<div\
    \ class=\"clear\"></div></div>\n```\n\nNow set the class .clear to clear:\n\n\
    ```\n.clear {\n  clear: both;\n}\n```\n\nThis will clear the footer; however,\
    \ it's a relatively inlegant approach! I'm going to show you some other solutions,\
    \ all of which are valid ways to clear floats. Knowing a few methods is handy,\
    \ as floats can trigger odd layout bugs (especially in older versions of Internet\
    \ Explorer). Having a few tricks up your sleeve means if one technique is giving\
    \ you problems, you can try another.\n\n# Floating the Outer Container\n\nIf you\
    \ float an element or elements within a wrapping element that is itself floated,\
    \ that wrapping element will then safely contain the inner floated elements, and\
    \ your floated elements will display according to plan. So, in our example, if\
    \ we float footer left, it will contain our inner, floated elements, and the footer\
    \ will display in full:\n\n```\n.footer {\n  clear: both;\n  background-color:\
    \ rgb(59,67,68);\n  color: rgb(255,255,255);\n  padding: 20px;\n  float: left;\n\
    \  width: 900px;\n}\n```"
  merge: -1
  pgno: 374
- img_proc: true
  md: "# 356 The CSS3 Anthology\n\nThe main problem with floating a containing element\
    \ in this manner is that, when floating an element, you need to give it an explicit\
    \ width, and this may not always be preferable or possible. Even in situations\
    \ where it is, declaring widths on internal elements of your pages makes them\
    \ less flexible if they used elsewhere across your site (for instance, the width\
    \ may be incorrect for the dimensions of another page). You also need to calculate\
    \ margins and padding carefully. In our example, we'd need to set a width of 900\
    \ pixels, taking into account the 20 pixels on each side of the footer.\n\n# Setting\
    \ overflow: auto or overflow: hidden\n\nAnother trick that will cause a wrapper\
    \ to neatly contain floated elements is to set overflow: auto or overflow: hidden\
    \ on the container. Watch out for any content that might extend beyond the container\
    \ (for example, a long URL that does not wrap), as it will either generate a scrollbar\
    \ if the overflow is set to auto, or will fail to show if the overflow is set\
    \ to hidden:\n\n```\n.footer {\n  clear: both;\n  background-color: rgb(59,67,68);\n\
    \  color: rgb(255,255,255);\n  padding: 20px;\n  overflow: auto;\n}\n```\n\nThose\
    \ warnings aside, this is a very simple technique that you can use in many situations.\n\
    \n# Clearfix Hack\n\nAnother technique you may come across is known as the clearfix\
    \ hack. I tend to avoid it in my work, though, as the previous methods suffice\
    \ in most situations. There are a few versions of the clearfix hack, but they\
    \ use generated content to add markup that clears the container. The example we've\
    \ used in this case is explained on Nicolas Gallagher's site:¹\n\n> ¹ http://nicolagasagher.com/micro-clearfix-hack/"
  merge: -1
