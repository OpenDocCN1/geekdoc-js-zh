  md: '# 376 The CSS3 Anthology


    Let''s set our target container at 940 pixels wide in this version, and then use
    that to calculate our percentages. This time round, of course, we have three columns
    to calculate widths.


    With the first two columns floated left, we need to add a margin-right to .subnav
    to stop .article colliding against it. We calculate the 20-pixel margin in exactly
    the same way as we calculate the column widths: 20 / 940 = 2.12765966%.


    The final addition to this media query is out .aside. In our previous media query,
    we gave it a rule of clear: both. Here, though, we need to unset this rule so
    the other two columns aren''t cleared, and the .aside floats up into its place
    on the far right of the layout.


    # Adding Some Device-specific Fixes


    There are a couple of lines you will want to add to your HTML document if you''re
    creating a responsive design. The first is a meta tag:


    ```

    <meta name="viewport" content="device-width,device-density=160dpi,initial-scale=1.0"
    />

    ```


    This meta tag means that mobile browsers will set the width of the browser viewport
    equal to the width of the device. If you''ve browsed the Web using a mobile device,
    you''ll noticed that your first view of a website is usually zoomed out. In the
    case of our earlier fixed-width, three-column layout, the first view you would
    be presented with a smartphone is all three columns on the page; you''d need to
    zoom in to read the content you want to isolate.


    As we''ve gone the effort of creating a customized smartphone version of our layout,
    we want mobile browsers to display it zoomed in, and this meta tag will ensure
    this happens.


    The second line we want to add to our HTML is a link—just above the closing body
    tag at the bottom of the page—to a JavaScript file:


    ```

    <script src="ios-orientationchange-fix.js"></script>

    ```


    I have included the file in the code archive, or you can download it from GitHub.


    > ² https://github.com/scottjehl/iOS-Orientationchange-Fix'
