  md: '# How do I deal with the most common issues in IE6 and IE7?


    CSS3, this weight is then downloaded by all users, and you''d need to rebuild
    the nsite in the future to take advantage of CSS3.


    The most troublesome browsers that you''re likely to come across today are Internet
    Explorer 6 and 7. They''re particularly troublesome because they have significant
    rendering bugs. Other browsers that you might come across, including Internet
    Explorer 8, tend to have issues that stem from a lack of support for some CSS.
    As we''ve seen, a lack of support is often a manageable problem, as you can decide
    whether to allow browser to show a simpler rendering of the site, or attempt to
    use polyfills to patch support. Browser, however, can cause perfectly valid markup
    and CSS to display in very strange ways, and even supporting IE6 and 7 at a basic
    level could you run into some of these.


    # Solution


    I''d advise you to avoid worrying too much about these old browsers while developing
    your site unless you''re in the unfortunate position of having a large number
    of users on such browsers (a situation that is becoming less each month). Develop
    in an up-to-date browser, validate your markup and CSS, and get everything working
    as you want it for modern browsers first. I believe strongly that you should refrain
    from cluttering your markup with fixes for old browsers, and continually checking
    and trying to fix issues as you go towards that temptation.


    There will probably be some problems in IE6 when you look at your layout. These
    might be small predicaments such as incorrect padding between page elements, or
    larger issues such as huge sections of your page disappearing or displaying in
    an odd place. There''s no need to panic! Most IE6 issues can be easily resolved
    by specifying different style rules for this particular browser.


    The same goes for IE7, although I find there are fewer layout problems to fix
    in this browser.'
