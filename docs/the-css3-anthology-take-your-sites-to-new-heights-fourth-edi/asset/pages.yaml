    # How do I create tabbed navigation using CSS?


    Navigation that appears as tabs across the top of the page is popular. Many sites
    create these tabs using images; however, this can make it less accessible, and
    it''s also problematic if your navigation is created using a Content Management
    System, as users of such a system are unable to add tabs or change the text in
    the tabs. The good news is it''s possible to create a tab effect just using CSS.


