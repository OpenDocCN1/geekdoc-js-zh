    # How can I visually indicate which links are external to my site?


    It can be helpful to visitors if links that lead to another site are displayed
    differently from links to pages on your own site. Adding a class to every link
    in order to be able to select it, however, is far from practical.


    # Solution


    If your internal links omit your site''s full domain, we can use attribute selectors
    to target external links: icons are placed next to external links, but not internal
    links.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_167_0.png)


    Figure 4.15. Displaying external links with an icon'
