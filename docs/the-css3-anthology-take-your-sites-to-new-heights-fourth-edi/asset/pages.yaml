    All the magic lies between the style tags in the head of the document, where we
    specify that a light blue, sans-serif font should be applied to all h1 and h2
    elements on the page. Regarding the syntax, I''ll explain it in detail shortly.
    By changing the style definition at the top of the page, it''s unnecessary to
    add to the markup itself; it will affect all three headings, as well as any other
    headings that might be at a later date.


    > HTML or XHTML?

    Throughout this book, the examples will be presented with HTML5 documents using
    XML-style syntax, as this is my preference. All these examples, however, will
    work in an XHTML or HTML4 document.


    # Inline Styles


    The simplest method of adding CSS styles to your web pages is to use inline styles.
    An inline style is applied to an HTML element via its style attribute, like this:


    ```

    <p style="font-family: Times New Roman, Times, serif;

    color: #3366cc;">

    Amazingly few discotheques provide jukeboxes.

    </p>

    ```


    An inline style has no selector; the style declarations are applied to the parent
    element. In the above example, this is the p tag.'
