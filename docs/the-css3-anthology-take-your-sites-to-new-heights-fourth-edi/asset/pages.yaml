    when placed visually after the form field, so that they all line up. I can use
    a technique described on Simply Accessible to achieve this.¹


    First, I need to add position: relative to the containing div (we will discuss
    relative and absolute positioning fully in Chapter 8). This simply means that
    we can now position content inside this div relative to it as a container:


    > ¹ http://simplyaccessible.com/article/required-form-fields/'
