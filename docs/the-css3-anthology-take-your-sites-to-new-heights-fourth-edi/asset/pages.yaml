    # Discussion


    The background-position property can take as its value keywords, percentage values,
    or values in units, such as pixels.


    # Keywords


    In this example, we used keywords to specify that the background image should
    be displayed at the bottom right of the content div:


    ```

    background-position: bottom right;

    ```'
