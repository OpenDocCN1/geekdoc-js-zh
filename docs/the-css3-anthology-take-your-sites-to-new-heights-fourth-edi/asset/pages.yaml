- img_proc: true
  md: "# 382 The CSS3 Anthology\n\nmap directions using a large font size, which is\
    \ useful when you're trying to navigate while driving. Many browsers won't print\
    \ out background colors and images, make sure everything remains legible.\n\n\
    Furthermore, unless you're creating a multicolumn layout for print, either avoid\
    \ setting widths on containers or set them to 100%; that the content will fill\
    \ the page nicely, whatever the size is used for printing.\n\nIf your content\
    \ has a lot of inline links, you can use generated content to display a URL after\
    \ its corresponding link in the printed document by adding the following CSS:\n\
    \n```\na:link:after {\n  content: \" (attr(href) \\)\";\n}\n```\n\nFinally, be\
    \ considerate of your users ink: set large images to display: none and hide advertising\
    \ banners.\n\n# How can I use responsive-design techniques when my site is image-heavy?\n\
    \nOur responsive layout has behaved nicely, but so far it's only comprised text—an\
