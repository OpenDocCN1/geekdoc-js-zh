  md: '# 354 The CSS3 Anthology


    If you highlight the text as in Figure 9.8, you can see that the footer element
    is still there. What''s happening is that the background color of the footer has
    collapsed to the same height as the padding on the top and bottom of the footer:
    ten pixels. The copyright statement and contact text have their color set to white,
    so they disappear against the white page background.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_373_0.png)


    Figure 9.8. The amazing disappearing footer


    The reason why the footer background has disappeared is that the two columns of
    content have been taken out of the normal flow using float. The solution is to
    set a clear below these two columns—just as the footer itself clears the main
    columns on the page.


    # Clearing Inside Containers


    You are now encountering one of the most-discussed and troubling issues of layout
    using floats: how to self-clear a page element.


    There''s no markup below our two footer columns to which we can add a clear property.
    A very basic solution would be to add a bit of redundant markup in the form of
    a div with a class of clear:


    ```

    <div class="footer">

    <p class="copy">Copyright&copy; Recipe for Success 2012</p>

    <div class="vcard">

    <h3>Contact Us</h3></div>

    ```'
