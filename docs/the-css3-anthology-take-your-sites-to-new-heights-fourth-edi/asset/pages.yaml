    \ h1 {\n  padding: 20px 0 20px 0;\n  font-size: 175%;\n}\n\nheader .nav li {\n\
    \  font-size: 175%;\n}\n```\n\nWe recalculate our column widths so that we end\
    \ up with three images on each row of the grid, each being three columns in width:\n\
    \n```\n.gallery li {\n  width: 31.42857%;\n  margin: 0 0 2.85714% 2.85714%;\n\
    }\n```\n\nFinally, we need to change the .gallery li selector so that the first\
    \ and every third list item thereafter (:nth-child(3n+1)) has no left margin.\
    \ However, in addition to implementing its own rules, this stylesheet will also\
    \ inherit the CSS rules from the stylesheet before it; in particular, responsive-410.css.\
    \ We removed the left margin on the first and every second list item thereafter.\
    \ This isn't what we want in our new stylesheet and corresponding screen size;\
    \ we need to update the margin-left property for our .gallery li:nth-child(2n+1)\
    \ selector with our new gutter width:"
