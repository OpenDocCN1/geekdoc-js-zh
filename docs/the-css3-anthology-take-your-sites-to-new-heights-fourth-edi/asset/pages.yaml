  md: "# Making a Start with CSS\n\nThe two parts of the cascade will affect your\
    \ daily CSS work the most are specificity and source order. The rule of specificity\
    \ ensures the style rule with the most specific selector overrides any others\
    \ with less-specific selectors.\n\nTo give you an example of how this works, consider\
    \ this simple snippet of HTML markup:\n\n```\n<div id=\"content\">\n<p class=\"\
    message\">\n  This is an important message.\n</p>\n</div>\n```\n\nNow consider\
    \ the following style rules that are to be applied to this:\n\n```\np { color:\
    \ #000000; }\n.message { color: #CCCCCC; }\np.message { color: #0000FF; }\n#content\
    \ p.message { color: #FF0000; }\n```\n\nThese four selectors match the paragraph\
    \ element in the example HTML and set the text color. What color will be applied\
    \ to the paragraph? If you guessed #FF0000, or red, you'd be right. The p selector\
    \ (any element) has the lowest level of specificity, with .message (any element\
    \ with class) coming next. The selector p.message (any element with class message)\
    \ then has a higher level of specificity. The highest is the selector #content\
    \ p.message (any p element with child of the element with id content).\n\nLonger\
    \ selectors aren't necessarily more specific. An ID selector, for example, will\
    \ always have a higher specificity than an element type or class selector. It\
    \ becomes trickier the more complex your selectors are, but you should find the\
    \ examples in this simple block enough. If you'd like to know the exact formula\
    \ for measuring specificity, once again the SitePoint CSS Reference has all the\
    \ answers⁴\n\nIf two or more rules are still applicable to an element, the order\
    \ in which the rules appear—the source order—is used. The last rule to be declared\
    \ is applied. This is also true if you declare more than one style with the same\
    \ selector; for example, .message in your stylesheet. It will be the second instance\
    \ of the rule that\n\n> ⁴ http://reference.sitepoint.com/css/specificity"
  merge: -1
