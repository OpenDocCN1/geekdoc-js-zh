  md: "# The CSS3 Anthology\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_215_0.png)\n\
    \nFigure 5.11. Highlighting a row\n\n# # Solution\n\nThis can be a very simple\
    \ solution; all you need to do is add the following rule to your CSS:\n\n```\n\
    chapter_05/hililterow.css (excerpt)\n\n.datatables tr:hover {\n  background-color:\
    \ #DFE7F2;\n  color: #000;\n```\n\nJob done!\n\n# # Discussion\n\nWhen we discussed\
    \ :hover on links, I mentioned that you can also use :hover on other elements\
    \ to create attractive effects; in addition, these serve to give the user feedback\
    \ as to what they are interacting with.\n\nThis solution will work in all modern\
    \ browsers including Internet Explorer 7—but not in Internet Explorer 6. But as\
    \ long as your tables are clear, the highlight feature could be regarded as a\
    \ “nice to have,” rather than a necessary tool."
