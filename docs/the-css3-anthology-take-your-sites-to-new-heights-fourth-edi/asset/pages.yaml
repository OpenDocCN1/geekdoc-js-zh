- img_proc: true
  md: "# 256 The CSS3 Anthology\n\nFinally, I style the div Submit button in a similar\
    \ way to the fieldset elements. I align the contents of the div center so that\
    \ the way Submit button now displays centrally.\n\nAs with the forms earlier in\
    \ this chapter, I'm using an attribute selector to target the Submit button and\
    \ give it appropriate styles:\n\n> chapter_06/fieldsets.css (excerpt)\n\n```\n\
    div.submit {\n  float: none;\n  background-color: rgba(126,208,214,0.3);\n  border:\
    \ 3px solid rgb(255,255,255);\n  -webkit-border-radius: 10px;\n  -moz-border-radius:\
    \ 10px;\n  border-radius: 10px;\n  margin: 0 0 1em 0;\n  padding: 0.5em 0 0.5em\
    \ 0;\n  text-align: center;\n}\n\nform input[type=\"submit\"] {\n  width: auto;\n\
    \  border: 3px solid rgb(126,208,214);\n  background-color: rgba(78,150,137,0.5);\n\
    \  color: rgb(255,255,255);\n}\n\nform input[type=\"submit\"]:hover {\n  background-color:\
    \ rgb(78,150,137);\n}\n```\n\nIn Figure 6.17, you can see that an asterisk is\
    \ used to indicate required fields in the form. This appears as part of the label\
    \ element so that—in the case of a user using a screen reader—the required status\
    \ of the field will be read out, along with the label for the field.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_275_0.png)"
