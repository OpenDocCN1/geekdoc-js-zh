    # Discussion


    We can simply use the :focus pseudo-class to target the field when it has focus,
    meaning it is ready to be used; for example, entering text into a text field,
    making a selection using a select box, or clicking a button. Some browsers may
    implement something like this effect natively.


    This gives the user a nice way to see where they are in the form. Such feedback
    may be helpful when they’re working with a very long or complex form.


    # What additional elements and attributes are part of the HTML5 forms spec?


    We have so far looked at some fairly basic form elements. These elements have
    been in the HTML specification for a long time without much changing about them.
    HTML5 has brought with it some new form elements and attributes, and consequently
    a much richer interface to form-based web applications.


    Figure 6.6. Highlighting a form field on focus'
  merge: -1
  pgno: 254
- img_proc: true
  md: "# 236 The CSS3 Anthology\n\nMany of the new elements react poorly to attempts\
    \ at styling them with CSS; they rely heavily on the UI provided by the operating\
    \ system or browser. The new attributes are interesting, though, for the front-end\
    \ developer or designer as they offer some additional aspects we can target using\
    \ CSS.\n\n# Solution\n\nA practical example of HTML5 in forms can be seen by making\
    \ a small change to our existing contact form markup: changing the email field\
    \ from type=\"text\" to the HTML5 type=\"email\", adding a placeholder attribute\
    \ with some placeholder text, and setting a required flag, indicating that the\
    \ field is required field:\n\n> chapter_06/form-html5.html (excerpt)\n\n```\n\
    <form method=\"post\" action=\"/contact\" id=\"contact-form\">\n<div>\n  <label\
    \ for=\"fName\">Name</label>\n  <input type=\"text\" name=\"fName\" id=\"fName\"\
    \n  required=\"required\" />\n</div>\n<div>\n  <label for=\"fMail\">Email address</label>\n\
    \  <input type=\"email\" name=\"fMail\" id=\"fMail\"\n  required=\"required\"\n\
    \  placeholder=\"name@example.com\" />\n</div>\n<div>\n  <label for=\"fQuestion\"\
    >Question / Comments</label>\n  <textarea name=\"fQuestion\" id=\"fQuestion\"\
    \ rows=\"10\" cols=\"30\">\n</textarea>\n</div>\n<div class=\"submit\">\n  <input\
    \ type=\"submit\" name=\"contact-submit\" id=\"contact-submit\"\n  value=\"Submit\"\
    \ />\n</div>\n</form>\n```"
  merge: -1
