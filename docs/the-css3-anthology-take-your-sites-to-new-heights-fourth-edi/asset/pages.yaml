  md: "Now we can recalculate the widths of our list items and the margins on the\
    \ first and every fifth element thereafter. Our gallery images each take up three\
    \ columns, and this means that the image in the feature div will line up with\
    \ the first four images in the gallery below it—with intro sitting in a column\
    \ that lines up with the fifth image below it:\n\n```\nchapter_09/responsive-1180.css\
    \ (excerpt)\n.gallery li:nth-child(n) {\n  width: 18.64406%;\n  margin: 0 0 1.6941%\
    \ 1.6941%;\n}\n\n.gallery li:nth-child(5n+1) {\n  margin-left: 0;\n}\n```\n\n\
    That's it! You have a responsive, image-heavy layout that complies with a strict\
    \ grid.\n\nWhen creating these layouts, I tend to calculate my column widths and\
    \ gutters as we did at the start of each stylesheet here. It certainly pays to\
    \ insert the columns in a block comment at the start of your stylesheet. There\
    \ are also a number of grid frameworks available that use this same basic technique,\
    \ which you may find useful.\n\n# What about older browsers and responsive design?\n\
    \nIt's impossible to discuss responsive design without considering older browser\
    \ support. In the section called “How do I create a design that works on mobile\
    \ devices?”, we added a JavaScript file to provide a fix for a bug in iOS devices,\
    \ but what can we use to accommodate older browsers that don't deal so well with\
    \ modern design techniques?\n\n# Solution\n\nAs already mentioned, Internet Explorer\
    \ below IE9 doesn't support media queries. If a user is viewing our previous example\
    \ sites in Internet Explorer 6, 7, or 8, they'll be presented with the view rendered\
    \ by our basic, mobile-specific stylesheets. These"
