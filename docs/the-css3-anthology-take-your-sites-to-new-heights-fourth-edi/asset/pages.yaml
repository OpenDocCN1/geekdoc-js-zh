  md: "# Discussion\n\nOur example site is a recipe site, so it's highly likely that\
    \ people will want to print out the recipes to refer to them in the kitchen. We\
    \ can customize a separate stylesheet to ensure that users only print the recipe\
    \ itself, and not the navigation area or other elements on the site that are unnecessary\
    \ for their purpose.\n\nThe first action is to set the media attribute on the\
    \ link to our original stylesheet to screen. The means that the main stylesheet\
    \ (col-responsive.css) will only be used when the site is displayed onscreen.\
    \ We then add a second link tag pointing to our print-specific stylesheet; this\
    \ has a media attribute of print. Browsers will use this stylesheet to render\
    \ the document ready to be printed out.\n\nWe can now set some basic print-view\
    \ CSS for the first task is to go through the stylesheet and set any element on\
    \ the page that we don't want users to print to display: none:\n\n```\nchapter_09/3col-responsive-print.css\
    \ (excerpt)\n\n.subnav {\n  display: none;\n}\n\n.aside {\n  display: none;\n\
    }\n\n.footer .vcard {\n  display: none;\n}\n```\n\nWe can then go and tweak other\
    \ styles to suit a printed copy of our web page; for instance, eliminating the\
    \ color and text-shadow properties on our h1s, h2s, and h3s, and deleting our\
    \ a:hover selector altogether. We'll test in our browser's preview facility until\
    \ we're happy with the result.\n\n> Think of the Ink\nWhen creating a print stylesheet,\
    \ think about how the content to be printed will be used. The Automobile Association\
    \ (AA) website in the UK allows you to print out driving directions, for example,\
    \ and the print stylesheet for the site prints out"
  merge: -1
