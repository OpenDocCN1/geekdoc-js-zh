  md: "```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Chapter\
    \ 4: Showing external links</title>\n  <link rel=\"stylesheet\" href=\"external-links.css\"\
    \ />\n</head>\n<body>\n  <div class=\"wrapper\">\n    <p>You can search for more\
    \ delicious cheese recipes using\n    <a href=\"http://google.com\">Google</a>\
    \ or view more recipes on\n    <a href=\"/recipes/\">this site</a>.</p>\n  </div>\n\
    </body>\n</html>\n```\n\nWe can use an attribute selector that looks for href\
    \ attributes containing a value starting with http: and add a background image:\n\
    \n```\na[href^=\"http:\"] {\n  padding-left: 20px;\n  background-image: url(icon-link-external.png);\n\
    \  background-repeat: no-repeat;\n}\n```\n\nNow, any links on our page that start\
    \ with http: (which should be external, as we don't link to pages on our own site\
    \ this way) will display with the world icon.\n\n> Mind Your Protocols\nThis solution\
    \ relies on your internal links not having the http:// in front of them. If you're\
    \ using an editor or CMS that adds the full domain of your site to internal links,\
    \ this solution is unsuitable.\n\n# Discussion\n\nThe attribute selector is widely\
    \ supported in modern browsers, although it will be ignored in Internet Explorer\
    \ 6. In browsers that lack support for this selector, the"
