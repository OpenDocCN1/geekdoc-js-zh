  md: "# Making a Start with CSS\n\nThe formatting makes no difference at all; it's\
    \ totally up to you how you write your stylesheets.\n\n# What are CSS selectors\
    \ and how do I use them?\n\nA selector is what we use to target the particular\
    \ bit of markup on the page that we wish to style. These range from very simple\
    \ (targeting a particular HTML element by name) to complex (targeting an element\
    \ when it's in a certain position or state). In the following example, h1 and\
    \ h2 are the selectors, which means that the rule should apply to all h1 and h2\
    \ elements:\n\n```\nh1, h2 {\n  font-family: \"Times New Roman\", serif;\n  color:\
    \ #3366CC;\n}\n```\n\nWe'll be seeing examples of CSS selectors throughout the\
    \ book, so you should quickly become accustomed to the different types of selector\
    \ and how they work. Below are some examples of the main selector types, these\
    \ should be familiar when you encounter them later.\n\n# Type Selectors\n\nThe\
    \ most basic form of selector is a type selector, which we've already seen. By\
    \ naming a particular HTML element, you can apply a style rule to every occurrence\
    \ of that element in the document. Type selectors are often used to set the basic\
    \ styles that appear throughout a website. For example, the following style rule\
    \ might be to set the default h1 font for a website:\n\n```\nh1 {\n  font-family:\
    \ Tahoma, Verdana, Arial, Helvetica, sans-serif;\n  font-size: 1.2em;\n  color:\
    \ #000000;\n}\n```\n\nHere we've set the font, size, size, and color for all h1\
    \ elements in the document."
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Class Selectors


    Assigning styles to elements is all well and good, but what happens if you want
    assign different styles to identical elements that occur in various places within
    your document? This is where CSS classes come in.


    Consider the following style, which colors all h2 headings blue in a document:


    ```

    h2 {

    color: #0000ff;

    }

    ```


    That''s great, but what would happen if you had a sidebar on your page with a
    blue background? If the text in the sidebar were to display blue as well, it would
    be invisible. What you need to do is define a class for your sidebar text, then
    assign a CSS style to that class.


    First, edit your HTML to add a class to the heading:


    ```

    <h2 class="sidebar">This text will be white, as specified by the CSS style definition
    below.</h2>

    ```


    Now write the style for this class:


    ```

    h2 {

    color: #0000ff;

    }


    sidebar {

    color: #ffff;

    }

    ```


    This second rule uses a class selector of .sidebar to indicate that the style
    should be applied to any element with a class value of .sidebar. The period (.)
    at the beginning indicates that we''re naming a class instead of an HTML element.


    You can add a class to as many elements in your document as you need to.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# ID Selectors


    In contrast with class selectors, **ID selectors** are used to select one particular
    element, rather than a group of elements. To use an ID selector, you first add
    an id attribute to the element you wish to style. It''s important that the ID
    is unique within the HTML document:


    ```

    <p id="tagline">This paragraph is uniquely identified by the "tagline"</p>

    ```


    To reference this element by its ID selector, we precede the ID with a hash (#).
    For example, the following rule will make the preceding paragraph white:


    ```

    #tagline {

    color: #ffffff;

    }

    ```


    # Combinators


    The next group of selectors we shall take a look at are **combinators**. The combinator
    refers to a character added between two selectors to create a selector more capable
    of targeting a precise part of the document.


    # Descendant Selectors


    The descendant selector matches an element that descends from a specified element.
    The combinator used in this selector is a whitespace character.


    You might have an h2 element on your site''s to display as blue; however, within
    the sidebar of the site are some h2 elements that you want to display white in
    order to show up against a dark background. As we saw earlier, you could add a
    class to all these headings, but it would be neater to instead target them with
    CSS. This is when the descendant selector is used.


    Here''s the new selector:


    ```

    .sidebar h2 {

    color: #ffffff;

    }

    ```'
  merge: -1
