  md: '# How does the browser decide which styles to apply?


    How does the browser understand our intentions? When more than one rule can be
    applied to the same element, the browser uses the cascade to determine which style
    properties to apply.


    Understanding the cascade is important when dealing with CSS, because many CSS
    development problems are due to styles unintentionally applied to an element.
    We''ve already presented examples in this chapter where we''ve written a general
    style rule focused on paragraph elements, and then a specific rule aimed at one
    or more particular paragraphs. Both style rules target paragraphs, but the specific
    rule overrides the general rule in the case of matching paragraphs.


    There are four factors that the browser uses to make the decision: weight, origin,
    specificity, and source order.


    The weight of a particular style declaration is determined by the use of the keyword
    !important. When the keyword appears after a property value, that value can''t
    be overridden by the same property in another style rule, except in very specific
    circumstances. Using !important in your stylesheets has a huge negative impact
    on maintainability, and there''s often little call for it anyway. For these reasons
    it should be avoided, which we''ll do in this book. If you''d like to know more,
    you can read about it in the SitePoint CSS Reference.


    There are three possible origins: the browser, the author, and the user. In this
    book, we focus on what are author stylesheets; that is stylesheets written by
    the web page creator—you! We''ve mentioned the browser internal stylesheet that
    provides the default styles for all elements, but styles in author stylesheets
    will always override styles in the browser default stylesheet. The only possible
    origin for stylesheets are user stylesheets—custom styles written by the browser
    users—and these are overridden by the author stylesheet except in rare circumstances.
    Again, if you''d like to know more, the SitePoint CSS Reference has a whole section
    on it.


    > http://reference.sitepoint.com/css/importantdeclarations'
  merge: -1
  pgno: 39
