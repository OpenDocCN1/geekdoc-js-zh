    # # How should I go about testing on mobile browsers?


    All smartphones have capable browsers, and are increasingly used for viewing websites.
    In addition, we’re seeing a rise in the number of tablets, such as the iPad, in
    use. So considering that most of us tend to own just the phone, how can we test
    across devices?


    # ## Solution


    There are two issues when it comes to testing on mobile devices. One is that they
    have smaller screen sizes than their desktop counterparts; the second is that
    the experience of using a mobile touchscreen device is different from using a
    desktop computer with a keyboard and mouse. So your testing needs to cover “does
    it look okay?” and “is it usable?”


    The browsers used by mobile devices tend to be fairly up to date. The iPhone and
    iPad use mobile Safari, which uses Web as its rendering engine—the same engine
    behind the default Android browser, and the browser used in new Blackberry devices.
    In addition, there are mobile versions of Opera and Firefox. Windows uses a mobile
    browser based on the rendering engine in Internet Explorer 9. Due to these up-to-date
    browsers, you can be more confident using CSS3 for phones than the desktop. The
    rendering is generally the same as desktop versions of these rendering engines—albeit
    at a small size, and in Chapter 9 we’ll be discussing how you might support such
    smaller screens in particular. For current information on mobile browsers and
    devices, I suggest visiting the mobile section of QuirksMode.20 run by Peter-Paul
    Koch and Mobile HTML521 by Maximiliano


    19 http://smashingmagazine.com/2011/09/02/reliable-cross-browser-testing


    20 http://www.quirksmode.org/mobile/


    21 http://mobilehtml5.org/'
