  md: "Navigation \x157\n\nThis gives us a rollover image effect that combines a single\
    \ background image and text for an accessible, search-engine-friendly navigation\
    \ bar.\n\n# Using Opacity for Rollover Effects\n\nBefore finishing this solution,\
    \ I want to show you an alternate method of creating a nice rollover effect using\
    \ the opacity property.\n\nThe effect shown in Figure 4.20 is achieved with the\
    \ same markup we've been using and an image sprite, but this one only has three\
    \ states in it. I have then used the opacity property to make the image and text\
    \ semitransparent.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_176_0.png)\n\n\
    Figure 4.20. Rollovers using opacity\n\nOn hover, I set opacity to 1—that's fully\
