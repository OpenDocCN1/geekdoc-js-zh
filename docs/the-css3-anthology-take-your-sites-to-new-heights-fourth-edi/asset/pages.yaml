  md: '# Text Styling and Other Basics 35


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_54_0.png)


    Figure 2.4. Links with text-decoration underline and overline sct


    # Avoid Applying Misleading Lines


    You can use the text-decoration property to apply underlines to any text, even
    if it''s standard underlined text, but be wary of doing this. The underlining
    of links is so widely accepted that users are inclined to think that any underlined
    text is a link to another document.


    # When removing underlines a bad idea?


    Underlining links are a standard convention followed by all web browsers, and
    consequently, users expect to see links underlined. Removing the underline from
    links that appear within large areas of text can make it very difficult for people
    to realize that these words are, in fact, links, rather than just highlighted
    text. I''d advise against removing the underlines from links within text. There
    are other ways in which you can style links so that they look attractive, and
    removing the underline is rarely, if ever, necessary.


    Links used as part of a menu, or appear in some other situation in which the text
    is quite obviously a link—for instance, where the text is styled with CSS to resemble
    a graphical button—are a different story. If you wish, you can remove the underline...
    because it should be obvious from their context what they are.'
  merge: -1
  pgno: 54
- img_proc: true
  md: "# How do I create a link that changes color when the cursor moves over it?\n\
    \nThere's an attractive link effect that changes the color or otherwise alters\
    \ a link’s appearance when the cursor is moved over it. This effect can be applied\
    \ to great advantage on navigation menus created with CSS, but it can also be\
    \ used on links within regular paragraph text.\n\n# Solution\n\nTo create this\
    \ effect, we need to style the :hover and :active dynamic pseudo-classes of the\
    \ anchor element differently from its other pseudo-classes.\n\nLet’s look at an\
    \ example. Here’s a typical style rule that applies the same declarations to all\
    \ of an anchor element’s pseudo-classes:\n\n```\ncss\na:link, a:visited, a:hover,\
    \ a:active {\n  text-decoration: underline;\n  color: #6A5ACD;\n  background-color:\
    \ transparent;\n}\n```\n\nWhen this stylesheet is applied, our links will display\
