  md: '# The CSS3 Anthology


    And here''s the updated HTML:


    ```

    <div class="sidebar">

    <h2>A heading in white</h2>

    <h2>Another heading in white</h2>

    </div>

    ```


    As you can see, a descendant selector comprises a list of selectors (separated
    spaces) that match a page element (or group of elements) from the outside in.
    In this case, our page contains a div element with a class of sidebar, the descendant
    selector .sidebar h2 refers to all h2 elements inside that div.


    By using a descendant selector, there''s no need to access your HTML to all elements;
    instead, use the main structural areas of the page—identified by classes or IDs
    where required—and style elements within them.


    # Child Selectors


    Unlike the descendant selector—which matches all elements that are descendants
    of the parent element, including elements that are not direct descendants—the
    child selector matches all elements that are the immediate children of a specified
    element. The combinator used in this selector is the greater-than sign (>).


    Consider the following markup:


    ```

    <div class="sidebar">

    <p>This paragraph will be displayed in white.</p>

    <p>So will this one.</p>

    <div class="tagline">

    <p>If we use a descendant selector, this will be white.

    But if we use a child selector, it will be blue.</p>

    </div>

    </div>

    ```


    In this example, the descendant selector we saw in the section called “Descendant
    Selectors”. .sidebar p would match all the paragraphs that are nested within the
    div element with the class sidebar, as well as those inside the div with the class
    tagline. But if, instead, you only wanted to style those paragraphs that were
    direct descendants of the sidebar div, you''d use a child selector. A child selector
    uses the > character to specify a direct descendant.'
