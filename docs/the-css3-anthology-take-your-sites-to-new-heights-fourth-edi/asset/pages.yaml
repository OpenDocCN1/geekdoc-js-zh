  md: '# Chapter 4


    # # Navigation


    Unless you limit yourself to one-page websites, you''ll need to incorporate navigation
    into your design. In fact, navigation is among the most important parts of any
    web design, and requires a great deal of thought if visitors are to move around
    your site easily.


    Making site navigation easy is one area in which CSS really comes into its own.
    While you could use images for your navigation, this practice can have considerable
    downsides. Navigation created from images means it may be less accessible, as
    the images can''t be resized easily to make the text larger. Zooming images of
    text can also lead to hard-to-read text. In addition, if your site is built using
    a CMS, when you want to add a new navigation item you''ll need to create a new
    image, which may require the intervention of the designer. CSS allows you to create
    attractive navigation that is, in reality, no more than textthat can be marked
    up in such a way to ensure that it''s both accessible and understandable by all,
    and easy to content-manage.


    In this chapter, we''ll look at a variety of solutions for creating CSS-based
    navigation and give you the skills to start creating your own navigation styles.'
  merge: -1
  pgno: 138
- img_proc: true
  md: "# How do I style a structural list as a navigation menu?\n\nNavigation is essentially\
    \ a list of places to visit on your site, so markup navigation menus as lists\
    \ makes sense semantically and we can hook our CSS styles to the list elements\
    \ themselves. It's important, however, to avoid having our navigation look like\
    \ a standard bulleted list as rendered by the browser's internal stylesheet.\n\
    \n# Solution\n\nThe simple navigation bar shown in Figure 4.1 is marked up as\
    \ an unordered list and then styled using CSS.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_139_0.png)\n\
    \nFigure 4.1. The list navigation\n\nHere’s the markup:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Chapter 4: List navigation</title>\n\
    \  <link rel=\"stylesheet\" href=\"listnav.css\" />\n```"
  merge: -1
  pgno: 139
- img_proc: true
  md: "# Navigation 121\n\n```\n</head>\n<body>\n<div class=\"wrapper\">\n  <ul class=\"\
    nav\">\n    <li><a href=\"*Wine\"></a></li>\n    <li><a href=\"*Fruit\"></a></li>\n\
    \    <li><a href=\"*Spreads\"></a></li>\n    <li><a href=\"*Biscuits\"></a></li>\n\
    \  </ul>\n</div>\n</body>\n</html>\n```\n\nHere is the CSS used to transform this\
    \ plain list into a standard-looking vertical navigation bar:\n\n```\nchapter_04/listnav.css\
    \ (excerpt)\n\n.nav {\n  list-style: none;\n  margin: 0;\n  padding: 0;\n  width:\
    \ 200px;\n}\n\nnav li {\n  border-left: 10px solid rgb(144,154,181);\n  border-bottom:\
    \ 1px solid rgb(144,154,181);\n}\n\nnav li a:link,\nnav li a:visited {\n  background-color:\
    \ rgb(192,202,229);\n  color: rgb(49,52,61);\n  padding: 0.5em;\n  display: block;\n\
    \  text-decoration: none;\n  border-left: 5px solid rgb(239,213,252);\n}\n```\n\
    \n# Discussion\n\nTo produce navigation based on an unordered list, you first\
    \ have to create your list, placing each navigation link inside a li element:"
