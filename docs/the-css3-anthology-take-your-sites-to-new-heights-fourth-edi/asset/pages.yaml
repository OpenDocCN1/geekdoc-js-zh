  md: "Now let's create the three-column version, which will provide desktop-browser\
    \ users with the same experience they had when they viewed the fixed-width version\
    \ of our site.\n\nOur completed min-width: 992px section follows. It should be\
    \ fairly familiar to you from the previous width calculations, with a couple of\
    \ exceptions:\n\n```\n@media only screen and (min-width: 992px) {\n.wrapper {\n\
