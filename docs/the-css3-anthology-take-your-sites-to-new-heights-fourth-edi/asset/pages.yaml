  md: '# How can I test in many browsers when I only have access to one operating
    system?


    If you are a Windows, Mac, or Linux user with access to only one operating system,
    testing all the browsers can be a bit of a struggle. How does the web developer
    without access to a full test suite deal with cross-browser testing?


    # Solution


    There are now fewer serious bugs in commonly used CSS, but new issues mean that
    we can''t afford to test in just one modern browser before launching a site. We
    need to check that our content is readable in older browsers when using CSS3,
    and we''re likely to find that fonts (especially custom fonts imported using @fontface)
    render differently across operating systems.


    Some browsers are available across all operating systems: Firefox, Chrome, and
    Opera, for example, can be installed on Windows, OS X, and Linux. There is a version
    of Safari, the default browser on OS X, for Windows. As Chrome is based on WebKit—the
    same rendering engine as Safari—there are many similarities across these browsers;
    however, in the other (such as the support of CSS3, for example). They are, after
    all, on different release cycles.


    # Virtual Machines on OS X


    If you use a Mac running OS X, you''re probably in the most fortunate position.
    You can natively test any Mac-specific browsers, and by installing virtualization
    software such as VMware Fusion,¹² Parallels,¹³ or the VirtualBox,¹⁴ you can install
    Windows and Linux operating systems in a virtual machine and then whichever browsers
    you like; you can even have multiple virtual machines with different versions
    of browsers and operating systems installed. Windows and Linux users can install
    virtual machines to test browsers for Windows and Linux. There are attempts to
    get OS X working in a virtual machine or on-Apple


    +   ¹² http://www.vmware.com/products/fusion/overview.html

    ¹³ http://www.parallels.com/au/products/desktop/

    ¹⁴ https://www.virtualbox.org/'
