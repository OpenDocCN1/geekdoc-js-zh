    # Can I rotate images without image-editing software?


    Another exciting feature of CSS3 is CSS transforms. It enables you to manipulate
    elements on the page using just CSS. In this solution, we''ll use the transform
    property to gently rotate an image on the page.


    # Solution


    I''ve included an image on my recipe page and given it a little drop shadow using
    box-shadow, as shown in Figure 3.23.


    I''d like to slightly rotate this image. If my recipes were coming out of a content
    management system, I''d never expect people to open each image in image-editing
    software and apply the correct angle to each one before uploading them, so I''ll
    use CSS to apply the rotation.'
