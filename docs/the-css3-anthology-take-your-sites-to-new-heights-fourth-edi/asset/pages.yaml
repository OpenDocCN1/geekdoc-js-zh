  md: '# Adding Browser-specific Stylesheets Using Conditional Comments


    At this point, I''d suggest that you place an additional stylesheet—described
    in the previous section—using conditional comments to target IE6, 7, or both.
    You add this stylesheet to your document head (after the existing stylesheets
    in HTML) so that any rules you place in your IE6 and IE7-specific stylesheet will
    overwrite the same rules in the main stylesheet.


    # Fixing Internet Explorer Problems


    You can work through any problems that you can see in IE6 and 7 in a modern way,
    applying fixes in your alternate stylesheet, safe in the knowledge they''ll only
    ever be applied by the browsers that need them. The following tips solve most
    of the issues that we see in IE6. For IE7, I usually find there''s no need for
    all the rules used for IE6, some are still required. It''s rare that I find a
    brand new issue in IE7 that I''ve yet to see in IE6, and fixes are generally the
    same.


    # Checking Your doctype


    Make sure that you''re using a correct doctype as the first line in your markup;
    for most sites, this will be the HTML5 doctype as used in all the examples in
    this book. Omitting a doctype or using an incorrect doctype may cause your layout
    to display in quirks mode in some browsers. This avoids implementing an old, correct
    box model used in very early browsers—best for modern sites. If you want to know
    more about this, see the article at Activating Browser Modes with Doctype.


    # Fixing the Lack of min-height Support in IE6


    Internet Explorer 6 has no support for min-height (the minimum height element
    should take), but it incorrectly interprets height as min-height. So, even though
    height is used to specify a fixed height in other browsers, Internet Explorer
    6 takes it to the minimum height; therefore a block element will expand taller
    than specified height if need be.


    > 8 Many modern browsers have two rendering modes. Quirks mode renders documents
    according to the implementations of older browsers such as Internet Explorer 6.
    Standards or compliance mode renders documents as per the W3C specifications,
    or as close to them as they can.


    > 9 http://hsivonen.iki.fi/doctype/'
