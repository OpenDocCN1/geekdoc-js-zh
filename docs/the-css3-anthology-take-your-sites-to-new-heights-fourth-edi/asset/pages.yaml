  md: '# The CSS3 Anthology


    In our example, we''re stating that if the browser is greater than or equal to
    IE6 AND less or equal to IE8, it should load the JavaScript. Non-IE browsers and
    Internet Explorer 9 and above will ignore it.


    Here are some further examples of useful conditional comments. This would include
    ie6fixes.css if the browser is IE6:


    ```

    <[if IE 6]>

    <link rel="stylesheet" type="text/css" href="ie6fixes.css" />

    <![endif]-->

    ```


    This includes ie7fixes.css if the browser is equal to IE7:


    ```

    <[if IE 7]>

    <link rel="stylesheet" type="text/css" href="ie7fixes.css" />

    <![endif]-->>

    ```


    This code will reveal a stylesheet to all versions of Internet Explorer less or
    equal to version 7. It''s useful if you have layout fixes for these old browsers:


    ```

    <[if 1te IE 7]>

    <link rel="stylesheet" type="text/css" href="iefixes.css" />

    <![endif]-->

    ```


    For further examples of conditional comments and a full guide to their use, see
    the SitePoint CSS Reference page.


    # How do I achieve rounded corners in browsers without support for border-radius?


    As we saw in Figure 7.3, it''s often perfectly acceptable not to try to support
    CSS3 features in old browsers. Making your design fall back to square corners
    where border-radius is Unsupported be a reasonable solution. But what if your
    client or boss is insistent that the rounded corners work in older browsers?


    > http://reference.sitepoint.com/css/conditionalcomments'
