  md: "# The CSS3 Anthology\n\nThe second method is to use RGBA when specifying the\
    \ background-color value of the box. You may already be familiar with using RGB\
    \ to set a color or background color. For example, to make the background white\
    \ we would use:\n\n```\nbackground-color: rgb(255,255,255);\n```\n\nRGBA adds\
    \ a fourth value to the list—the A in RGBA stands for Alpha—and opacity. We can\
    \ use it to set the opacity level of the color, as shown in this example:\n\n\
    ```\nh1 {\n  width: 40%;\n  padding: 0.6em 0.6em 0.6em;\n  margin: 40px 0 0 0;\n\
    \  font-size: 127.6%;\n  background-color: rgba(255,255,255,0.5);\n  color: #000;\n\
    }\n\n.content {\n  width: 60%;\n  padding: 0.6em 0.6em 0.6em;\n  margin: 40px\
    \ 0 0 0;\n  background-color: rgba(255,255,255,0.5);\n  color: #000;\n}\n```\n\
    \nThe effect of the second method is shown in Figure 3.18."
