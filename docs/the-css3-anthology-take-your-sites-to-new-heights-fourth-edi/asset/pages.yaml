  md: '# In the Picture?


    With the increase in support for CSS3, we have so many more tools at our disposal
    than when I first started writing earlier editions of this book. Without resorting
    to using images, we can apply subtle and beautiful effects to our web pages and
    user interfaces such as rounded corners, gradients, shadows, and transforms. However,
    with all this new power comes the responsibility of ensuring that our finishing
    touches don''t render our information unusable to some users.


    Enjoy playing with these different effects. If you''re yet to use CSS3, it can
    be an enjoyable exercise to take an older design and see how many of the images
    can be replaced by CSS. You''ll see many more examples of these design elements
    throughout the book.'
