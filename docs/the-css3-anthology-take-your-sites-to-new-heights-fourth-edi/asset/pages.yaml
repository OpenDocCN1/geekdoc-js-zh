    Figure 2.16. Justified text


    # Discussion


    The other values for text-align are:


    +   - right: aligns the text to the right of the container

    - left: aligns the text to the left of the container

    - center: centers the text in the container


    > > The Language of text-align

    >

    > The default value for text-align is left for languages that are read from left
    to right (such as English and French) and right for languages that are read right
    to left (Hebrew or Arabic). If no text-align value is set, the text will be displayed
    depending on the text direction of the language the site is being viewed in. If
    your site has to support bidirectional text flowed into the same templates, take
    care to test text-align in both language directions.'
