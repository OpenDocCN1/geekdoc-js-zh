  md: '# The CSS3 Anthology


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_85_0.png)


    # Setting Bullets on Individual List Items


    The list-style-image property applies to the list item (li) elements in the list.
    If you apply it list-style-image to the list as a whole (the ul or ol element),
    each individual list item will inherit it. You do, however, have the option of
    setting the property on individual list items by assigning a class or id to each,
    giving individual items their own unique bullet images.


    If turning the bullet into an image is falling short of the desired result, your
    other option would be to use a background image, which we''ll discuss in Chapter
    3.


    # How do I remove the indented left-hand margin from a list?


    If you''ve set list-style-type to none, you may also wish to remove or decrease
    the default left-hand margin that the browser sets on a list.'
