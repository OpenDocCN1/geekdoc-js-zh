  md: '# Required fields


    We discussed required fields earlier in this chapter where we discovered that
    HTML5 offers a way to flag a field as being required. Ultimately, screen readers
    may well catch up with this, and start to announce the required or optional status
    of a field. But until we know that browser support is across the board for these
    attributes, we need to add to our markup to ensure users know the field is


    Using CSS alone to indicate that a field is required is insufficient, as screen
    readers users aren''t supported. You should also avoid using color as the only
    way to indicate a field element is required, as it can be problematic due to the
    incidence of color-blindness among users.


    In the solution in the section called "How do I group related fields?", I opted
    to use an asterisk in the label element, knowing that the label will be read as
    an instruction, this would most likely ensure the required nature was indicated
    to a screen reader user. In the solution in the section called "How do I create
    a form that reads like a sentence with inline fields?", I simply stated that all
    fields were required when introducing the form; this is an option for short forms
    where all fields must be completed to submit the form.


    You could also consider adding the ARIA-required flag³ to the element as some
    readers understand it:


    ```

    <label for="fname">My name is </label><input type="text" name="fname" id="fname"
    required="true" />

    ```


    WAI-ARIA (Web Accessibility Initiative–Accessible Rich Internet Applications)
    ARIA is a specification developed by the W3C⁴ It provides a method for User Interface
    widgets in a web application to describe what they are, so that they''re usable
    for assistive technology users. ARIA also deals with the issue of updating


    ³ http://www.alistpart.com/articles/aria-and-progressive-enhancement/


    ⁴ http://www.w3.org/TR/wai-aria/'
  merge: -1
  pgno: 284
