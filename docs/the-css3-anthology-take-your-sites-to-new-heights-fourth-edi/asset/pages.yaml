  md: '# Chapter 3


    # Images and Other Design Elements


    The Web is filled with sites featuring beautiful, rich graphic design that takes
    advantage of the power of CSS. In this chapter, we''ll look at how to use CSS
    and images to create gorgeous effects. We''ll be using images more in subsequent
    chapters, but, with most of the solutions in this book, feel free to experiment
    to see what unique effects you can create.


    # How do I add borders to images?


    Photographic images, which might be used to illustrate an article or be displayed
    in a photo album, look neat when they''re bordered with a thin line. However,
    it''s a time-consuming process to open each image in a graphics program in order
    to add borders, if you ever need to change a given border''s color or thickness,
    you''ll be required to go through the same arduous process all over again. Fortunately,
    CSS makes this chore a whole lot easier.


    # Solution


    Adding a border to an image is a simple procedure using CSS. To start, take the
    two images displayed in Figure 3.1.'
