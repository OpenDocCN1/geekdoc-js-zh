  md: '# Cross-browser Techniques 297


    Upload an example to a location to which you can link from your post. If you manage
    to reproduce the problem outside a complex layout,28 so much the better—this will
    make it easier for others to work out what''s going on. If you can recreate your
    problem in a tool like jsFiddle,29 better still. This will allow other people
    to play around with the issue and see if they can solve it for.


    Explain the solutions you''ve tried so far. This saves the recipients of your
    message from pursuing those same dead-ends, and shows that you''ve attempted to
    fix the problem before asking for help.


    Give your message a descriptive title. People are more likely to read a post entitled
    "Double height margin in Internet Explorer 8" or one that screams, "HELP!" Descriptive
    titles also make the list archives more useful, as people can see at a glance
    the post topics in a thread.


    Be polite and to the point.


    Be patient while you wait for answers. If you fail to receive a reply after a
    day or if it''s a busy list, it is usually acceptable to post again with the word
    "REPOST" in the subject line. Posts can be overlooked in particularly large boards,
    and this is a polite way to remind users that you''ve yet to receive any assistance
    with your problem.


    When you receive answers, try implementing the poster''s suggestions. Avoid becoming
    upset or angry if the poster is asking you to try very basic measures. I''ve seen
    threads go on many posts as different posters weigh in to help a user solve a
    problem, continuing the discussion until a solution is found. Give people a chance
    to help!


    If you find a solution, or you have no success and decide instead to change your
