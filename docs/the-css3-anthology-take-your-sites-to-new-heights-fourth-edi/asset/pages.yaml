  md: '# Form Input Types


    The type="email" used for the email field is one of the new values for the type
    attribute brought to us by HTML5 forms. What''s good about these new input types
    is that browsers fail to recognize it, they just display a regular text input.
    In the case of our email field, a browser without support for type="email" simply
    treats this as type="text". While there''s no additional format validation, the
    data is collected as normal and any error is caught by your server-side validation
    routine.


    The email input type is quite well supported, however. The full list of input
    types can be seen in Table 6.1.


    # Table 6.1. HTML5 form input type values


    | type="" | Input device / validation |

    |---|---|

    | search | takes on the look and feel of an operating system search element |

    | tel | is a text field input for telephone numbers (no syntax is enforced and
    تلیفون numbers vary worldwide) |

    | url | is a text field input validating that the format is a URL |

    | email | is a text field input validating that the format is an email address
    |

    | datetime | displays a date and time picker |

    | date | displays a date picker |

    | month | displays a date picker that allows selection of a month only |

    | week | displays a date picker that allows selection of a week only |

    | time | displays a date picker |

    | datetime-local | displays a date and time picker |

    | number | displays a widget that allows you to increment a number |

    | range | displays a range slider selector |

    | color | presents a color-picker widget |


    Support for these types is fairly patchy. Opera typically has the most advanced
    support. Figure 6.10 and Figure 6.11 show Opera with the number, date, and color
    values.'
