    ></script>\n<![endif]-->\n</head>\n``````\n```\n\n# Discussion\n\nConditional\
    \ comments were introduced by Internet Explorer as a proprietary method of serving\
    \ content to specific versions of Internet Explorer. They can be used to include\
    \ an additional stylesheet to fix problems in certain versions of IE, or as we're\
    \ doing in this example, to include polyfills that only target certain versions\
    \ of IE."
