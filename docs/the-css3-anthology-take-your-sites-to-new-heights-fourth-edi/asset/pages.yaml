  md: "# Text Styling and Other Basics\n\n@font-face rule declares the name of the\
    \ font, it enables you to load in a font file that's on your server with the src\
    \ property. You can then just use this font in your font-family list as you would\
    \ any other font.\n\n# Discussion\n\n\\ \"There are two issues with using @font-face\
    \ currently.\nThere are two issues with using @font-face currently. The first\
    \ is that no single font format is supported across all browsers and operating\
    \ systems; therefore, importing a font is a little more complex than loading in\
    \ a single file as in the preceding example.\n\nThe second issue is licensing.\
    \ Many of the fonts that you might use in Photoshop on your own computer aren't\
    \ licensed to be uploaded to a web server and served in this way, as others could\
    \ download the font file itself—just as you can download an image that you're\
    \ using on your website.\n\n# Browser Compatibility for Fonts You Can Upload to\
    \ Your Server\n\nIf you have a font that's licensed for use on the Web, your main\
    \ issue is generating a package of fonts that will cover all browsers and operating\
    \ systems. The simplest way to do this is to use one of the sites that can generate\
    \ a set of fonts; I like to use Font Squirrel.7 In addition to having a library\
    \ of fonts you may use on the Web, the site has a @font-face generator that will\
    \ create your set of fonts from one that you upload. Upload your font, and you\
    \ can then download a package of various fonts type along with the CSS rules needed\
    \ to include them in your site:\n\n> chapter_02/fontface.css (excerpt)\n\n```\n\
    @font-face {\n  font-family:'YanonekaeesBold';\n  src: url('yanonekaeesatz-bold-webfont.eot');\n\
    \  src: url('yanonekaeesatz-bold-webfont.eot?#iefix')\n       format('embedded-opentype'),\n\
    \       url('yanonekaeesatz-bold.woff') format('woff'),\n       url('yanonekaeesatz-bold-webfont.ttf')\
    \ format('truetype'),\n       url('yanonekaeesatz-bold-webfont.svg#YanonekaeesatzBold')\n\
    \       format('svg');\n```\n\n7 http://www.fontsquirrel.com/fontface/generator"
