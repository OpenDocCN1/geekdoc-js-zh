  md: '# The CSS3 Anthology


    will be applied to the element. As we''ll see in later chapters, this behavior
    is very useful.


    # Will using a CSS framework make it easier to learn CSS?


    Since I wrote the previous edition of this book, the use of CSS frameworks by
    designers to speed up the development of their CSS has grown.


    My take on these frameworks is that they can be very useful, but they''re not
    substitute for learning CSS. Once you understand CSS and are used to writing it
    for your projects, you may come up workflow issues that are resolved by employing
    some of the available tools and frameworks. If they solve a problem you have great!
    There is nothing inherently wrong with building on the work of other people. However,
    if your problem is that you lack a good grasp of CSS, the use of any framework
    is more likely to compound your confusion—another layer of complexity that will
    only make it harder to come to grips with the basics.


    # A Decent Selection


    This chapter has given you a taste of CSS and its usage at the basic level. We''ve
    even touched on the sometimes confusing concept of the cascade. If you''re a newbie
    to CSS but have an understanding of the concepts discussed in this chapter, you
    should be able to start using the examples in this book.


    The examples in the early chapters are simpler than those found later on, so if
    you''re yet to work with CSS, you might want to begin with these. They will build
    on the knowledge you gained in this chapter to start using and, I hope, enjoying
    CSS.'
  merge: -1
