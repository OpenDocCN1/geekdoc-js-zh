  md: "# The CSS3 Anthology\n\nThese keywords are defined relative to each other,\
    \ and browsers implement them in different ways. Most browsers display medium\
    \ at the same size as unstyled text, with the other keywords resizing text to\
    \ varying degrees, as indicated by their names.\n\nThese keyword measurements\
    \ are considered absolute in they don't inherit from any parent element. Yet,\
    \ unlike the absolute values provided for height, such as pixels and points, they\
    \ allow the text to be resized in the browser, and will honor users' browser settings.\
    \ The main problem with these keywords is consistency between browsers—x- small-sized\
    \ text may be perfectly readable in one browser and minuscule in another. Due\
    \ to this lack of control, you rarely see these keywords in use.\n\n# Relative-size\
    \ Keywords\n\nText sized relative size-keywords—larger and smaller—takes its size\
    \ from the parent element in the same way text sized with em and % does. Therefore,\
    \ if you set the size of your p element to using absolute keywords and decide\
    \ that you want emphasized text to display comparatively larger, you could add\
    \ the following to the stylesheets:\n\n```\nchapter_02/relative.css\np {\n  font-size:\
    \ small;\n}\n\nem {\n  font-size: larger;\n}\n```\n\nThe following markup would\
    \ display as shown in Figure 2.1, because the text between the <em> and </</em>\
    \ tags will display larger than its parent, the p element:\n\n```\nchapter_02/relative.html\
    \ (excerpt)\n<p>Garlic may be known for being a little bit <em>stinky</em>, but\
    \ baked it is absolutely delicious and as long as you feed it to all of your guests\
    \ no-one will complain about the smell! Once baked the garlic becomes creamy and\
    \ sweet making an ideal spread to accompany cheese.</p>\n```"
  merge: -1
