    # When It''s All Done for Show


    You should only highlight text in this way if the effect is purely presentational,
    and only relevant to those who can see the text in the browser. If the text needs
    to be highlighted in order to convey its meaning, consider em (for emphasis) or
    strong and then style the em or strong element. By using em or strong, you affect
    the meaning of the document. In such cases where highlighting is for looks only
    and no additional semantic elements are required, the technique explained here
    is the best one to use.


    # How do I alter the line height (leading) of my text?


    One of the great advantages that CSS had over earlier web design methods like
    font tags is that it gave you far more control over the way text looked on the
    page. In this solution, we''ll alter the leading of the text in your document.'
  merge: -1
