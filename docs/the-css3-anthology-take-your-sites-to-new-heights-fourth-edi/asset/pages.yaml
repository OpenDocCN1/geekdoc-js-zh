  md: "# How do I display table columns in alternating colors?\n\nWhile alternate\
    \ row colors are a common feature of data tables, we see alternately colored columns\
    \ less frequently. However, they can be a helpful way to show groupings of data.\n\
    \n# Solution\n\nIf we use the col element to describe our table's columns, we\
    \ can employ CSS to add a background to those columns. You can see the col elements\
    \ I've added—one for each column—in the following table markup:\n\nchapter_05/columns.html\
    \ (excerpt)\n\n```\n<table class=\"datatable\">\n<col />\n<col />\n<col />\n<col\
    \ />\n<tr>\n  <th>Pool A</th>\n  <th>Pool B</th>\n  <th>Pool C</th>\n  <th>Pool\
    \ D</th>\n</tr>\n<tr>\n  <td>England</td>\n  <td>Australia</td>\n  <td>New Zealand</td>\n\
    \  <td>France</td>\n</tr>\n<tr>\n  <td>South Africa</td>\n  <td>Wales</td>\n \
    \ <td>Scotland</td>\n  <td>Ireland</td>\n</tr>\n<tr>\n  <td>Samoa</td>\n  <td>Fiji</td>\n\
    \  <td>Italy</td>\n  <td>Argentina</td>\n</tr></table>\n```"
