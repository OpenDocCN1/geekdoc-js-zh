    ```

    background-repeat: repeat-x;

    ```


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_103_0.png)


    Figure 3.6. The image tiles along the x axis


    As you''ve probably realized by now, we can also tile it down the y axis with:


    ```

    background-repeat: repeat-y;

    ```'
