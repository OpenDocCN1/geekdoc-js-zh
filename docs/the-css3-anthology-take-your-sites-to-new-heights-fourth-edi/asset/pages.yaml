  md: "# Pseudo-class selectors\n\nA pseudo-class selector acts as if an element has\
    \ a class applied according to the state of element. Pseudo-class selectors start\
    \ with a colon and are usually added immediately after a type selector with no\
    \ additional whitespace.\n\nMy am here to familiarize you with the syntax of and\
    \ terminology around these selectors, so that we meet them later, you'll have\
    \ an understanding of how they work. As a result, I won't demonstrate all the\
    \ selectors in this chapter, but a full list with explanations can be found online\
    \ in the SitePoint CSS Reference.²\n\n# Links\n\nMost of us first come across\
    \ pseudo-class selectors when they're applied to links. A link has various states.\
    \ It can be unvisited or visited, hovered over, or clicked. We can use CSS to\
    \ target each of these states:\n\n```\na:link {\n  color: #0000ff;\n}\n\na:visited\
    \ {\n  color: #ff00ff;\n}\n\na:hover {\n  color: #00ccff;\n}\n\na:active {\n \
    \ color: #ff0000;\n}\n```\n\nThe first definition sets the color for the link\
    \ state, which displays for links that users have visited. If they have visited\
    \ the link, the second rule is used. If they hover over the link, the :hover definition\
    \ is used, and when clicking or otherwise activating the link, the :active and\
    \ :active pseudo-class selectors are actually termed dynamic pseudo-classes, as\
    \ they take effect only\n\n> ² http://reference.sitepoint.com/css/selectorref"
  merge: -1
