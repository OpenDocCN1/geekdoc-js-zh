  md: '# Recipe for Success


    # Baked Garlic


    Garlic may be known for being a little bit stinky, but baked it is absolutely
    delicious and as long as you feed it to all of your guests no-one will complain
    about the smell! Once the garlic becomes creamy and sweet making an ideal spread
    to accompany cheese.


    To make your own baked garlic, you will need:


    +   * Whole heads of garlic

    * Salt

    * Olive Oil

    * Foil


    # Instructions


    +   1. Cut the tops and bottoms off the garlic heads with a sharp knife, keeping
    the head intact, snip the tops of the cloves so you can see the garlic inside.

    2. In a large overproof dish use foil to make a ''nest'' large enough to hold
    all of your garlic. If you are doing a lot of garlic you could put them into several
    vessels.

    3. Add a few tablespoons of olive oil to water to then add the garlic heads.

    4. Pour over a tablespoons of olive oil per garlic, season with salt and tightly
    wrap the top of the foil nest to seal in the.

    5. Bake for 30 minutes at 200C, open the nest and bake the garlic in the Juices,
    then cover and bake after another 30 minutes.

    6. Enjoy!


