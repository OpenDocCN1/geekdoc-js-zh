  md: 'In Figure 8.18, you can see that the third image has a large caption and so
    is taller than the other boxes. I reduced the size of the browser window shown
    in Figure 8.19 to better show the issue as the images flow into two columns. As
    you can see, the different heights of the boxes cause the items to display untidily.
    If we were to use inline-block instead, this issue would disappear.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_352_0.png)


    Figure 8.19. The same display using the float method


    A good reason to use float would be when you need to accommodate browsers without
    support for inline-block, such as Internet Explorer 6 and 7. A way around this
    problem would be to use inline-block for supporting browsers, and in a stylesheet
    included with conditional comments use the float method to support these older
    browsers. If you''re using float, you''ll also want to ensure that items have
    the same height, if possible, to avoid the problem just shown.


    A drop shadow completes the look of the list items. Next, I want to set the caption
    to display on top of the images.


