    # # How do I display a calendar using CSS?


    Calendars, such as the example from a desktop application in Figure 5.14, involve
    tabular data. The days of the week along the top of the calendar represent the
    headings of the columns. As such, a calendar''s display constitutes the legitimate
    use of a table, but you can keep markup to a minimum by using CSS to control the
    look and feel.'
  merge: -1
