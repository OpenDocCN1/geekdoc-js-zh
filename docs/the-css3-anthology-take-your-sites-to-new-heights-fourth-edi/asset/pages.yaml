  md: '# Discussion


    The syntax for the text-shadow property is straightforward:


    ```

    text-shadow: 5px, 5px, 5px, #9999;

    ```


    The first value is the horizontal distance from the text; the second is the vertical
    distance; the third is the blur radius or spread of the shadow; and the final
    value is the color. The easiest way to see how text-shadow works is to create
    a large heading—so you can easily see your changes—and then play with the values.
    You can also have a play around with text-shadow and many other CSS3 properties
    at the online CSS3 Generator.


    > Beyond a Shadow of Doubt

    When adding shadows to text, make sure that your text is still legible. I find
    text-shadow most useful when adding effects to form buttons and big headings,
    but large quantities of body copy can be hard to read with a shadow applied. Sadly,
    the text-shadow property is unsupported in Internet Explorer (including


