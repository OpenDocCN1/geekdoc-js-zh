  md: '# Chapter 5


    # # Tabular Data


    You''ve probably heard the mantra "tables are for tabular data, not layout." Originally
    designed to display tabular data correctly in HTML documents, they were soon misappropriated
    as a way to lay out web pages. Back then, understanding how to create complex
    layouts using nested tables was a part of the standard skill set of every web
    designer. Yet using tables in this way requires large amounts of markup, making
    a website increasingly complex and difficult to maintain, as well as causing pages
    to load slowly. This method also creates problems for users who are trying to
    access content using screen readers or text-only devices. Since then, the Web
    Standards movement has pushed for the replacement of tabular layouts with CSS,
    which is designed for the job and is, ultimately, far more flexible, as we''ll
    discover in Chapter 9.


    But, from being evil, tables can (and should) be used for their true purpose—that
    of displaying tabular data. This chapter will illustrate some common, correct
    uses of tables, incorporating elements and attributes that, though used infrequently,
    help to make your tables accessible. We''ll also look at how CSS can make these
    tables more attractive and usable for those viewing them in a web browser.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# How do I lay out spreadsheet data using CSS?


    The quick answer is, you don''t! Spreadsheet data is tabular by nature and, therefore,
    should be displayed in an HTML table. However, we can still spruce up the display
    of that data using CSS, as we will see later in this chapter. And we should still
    be concerned about the accessibility of our tables, even when we''re using them
    to display the right kind of content.


    # Discussion


    Tabular data is information that''s displayed in a table, and which may be logically
    arranged into columns and rows.


    Your accounts, when stored in spreadsheet format, are a good example of tabular
    data. If you needed to mark up the annual accounts of an organization for which
    you were building a site, it might be given a spreadsheet that looked like Figure
    5.1.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_195_0.png)


    Figure 5.1. Displaying the accounts information in Excel'
  merge: -1
  pgno: 195
- img_proc: true
  md: "Obviously, this is tabular data. We see column and row headings to which the\
    \ data in each cell relates. Ideally, we'd display this data in a table, as shown\
    \ in Figure 5.2, complete with table headings to ensure that the data is structured\
    \ logically.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_196_0.png)\n\nFigure\
    \ 5.2. The accounts information displayed as a table using HTML\n\n# How do I\
    \ make my tabular data accessible?\n\nThe HTML table specification includes elements\
    \ and attributes that go beyond the basics required to achieve a certain look\
    \ for tabular data. These extra parts of the table can be used to ensure that\
    \ its content is clear when it's read out to impaired users who are unable to\
    \ see the layout for themselves. They're also easy to implement, though they're\
    \ often omitted by web developers. Take a look at this example:\n\n```\nchapter_05/table.html\
    \ (excerpt)\n<table class=\"datatable\">\n  <caption>\n    Yearly Income 2008\
    \ - 2011\n  </caption>\n```"
