    This chapter will explore the application of CSS for styling text. It will cover
    a lot of CSS basics, as well as answer some of the more frequently asked questions
    about these techniques. If you’ new to CSS, these examples will introduce a variety
    of properties and their usages, and provide a solid foundation from which to start
    your own experiments. For those already familiar with CSS, this chapter will serve
    as a quick refresher for those moments when you’s struggling to remember how to
    achieve a certain effect.


    The examples I’ve provided here are well supported across a variety of browsers
    and versions, though, as always, testing your code in different browsers is important.
    While there may be small inconsistencies or a lack of support for these techniques
    in older browsers, none of the solutions presented here should cause you any serious
