  md: "link will just display as normal; thus, it's a nice enhancement for browsers\
    \ with support while leaving the experience unchanged for those with older browsers.\n\
    \nLet's take a closer look at selector:\n\n```\na[href ^=\"http*\"]\n```\n\nWe're\
    \ selecting the href attribute, and we want selector to match when it finds the\
    \ text http: at the beginning of the attribute value. The ^ operator means \"\
    begins with.\" You could use a similar selector to match all email links; for\
    \ example, a[href ^=\"mailto:\"].\n\nAnother useful selector is to target the\
    \ file extension of a link. This means that you can add a small icon to show that\
    \ a document is a PDF or other document type, depending on the extension. The\
    \ selector a[href $=\".pdf\"] will match any link that has a file extension of\
    \ .pdf. The $ operator means \"ends with,\" so this selector will match when an\
    \ href attribute value ends with .pdf:\n\nchapter_04/external-links2.html\n\n\
    ```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Chapter\
