  md: '# CSS Syntax


    A stylesheet is a collection of style definitions. Every CSS style definition,
    or rule, has two main components:


    +   - A list of one or more selectors, separated by commas, define the element
    or elements to which the style will be applied.


    +   - The declaration block, separated by curly braces {...}, specifies what the
    rule actually does.


    The declaration block contains one or more style declarations and each one sets
    the value of a specific property. Multiple declarations are separated by a semicolon
    (;). A property declaration is made up of the property name and a value, separated
    by a colon (:). You can see all of these elements labeled in Figure 1.1.


    | property | value | value |

    |---|---|---|

    | h1, h2 selectors | { font-family: sans-serif; color: #3366CC; } declaration
    block | declaration block |


    > Figure 1.1. The components of a CSS rule: a list of selectors and a declaration
    block


    The solutions throughout the book focus mainly on the different properties and
    the values they can take. Figure 1.1 illustrates that a style rule can be written
    in a single line. Some CSS authors prefer to indent their style rules to aid readability,
    while others write their rules on one line to save space. The following shows
    the same rule written both ways:


    ```

    h1, h2 {

    font-family: "Times New Roman", Times, serif;

    color: #3366cc;

    }


    h1, h2 {

    font-family: "Times New Roman", Times, serif; color: #3366cc;

    }

    ```'
  merge: -1
