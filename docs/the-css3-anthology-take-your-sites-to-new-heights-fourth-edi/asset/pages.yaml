  md: '# Chapter 8


    # CSS Positioning Basics


    In this chapter, we will look in further depth at some of the vital concepts when
    positioning page elements using CSS. If you''re reading this book chapter by chapter,
    you''ll already have come across some of these concepts used in the examples.
    Here we''ll take a proper look at them, and see how they can be used in combination
    to layout our pages and components.


    # How do I decide when to use a class and when to use an ID?


    At first glance, classes and IDs seem to be used much in the same way: you can
    assign properties to both classes and IDs, and apply them to change the way HTML
    elements look. But in which circumstances are classes and IDs best applied?


    # Solution


    The most important rule where classes and IDs are concerned is that an ID must
    be used only once in a document, as it uniquely identifies the element to which
    it''s applied. Once you''ve assigned an ID to an element, you cannot use that
    ID again within that document.'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'Classes, on the other hand, may be used as many times as you like within the
    same document. If there''s a feature on a page that you wish to repeat, a class
    is the ideal choice. Even if you don''t wish to repeat the element on the page,
    if there''s a chance you might use it again in the future, use a class.


    You can apply both a class and an ID to any element. For example, you might be
    required to add an ID to an unordered list, so that JavaScript you''re using can
    target it. If you were to create CSS for the ID, you would only be able to use
    that once within the page. However, you could instead add a class to the element
    as well as the ID and write CSS for the class selector, making it possible to
    reuse the CSS multiple times in the page.


    # What are block-level and inline elements in CSS, and can I change how these
    display?


    In CSS, most elements are categorized as block or inline, and this affects the
    default way they behave in browsers. This default display method can be changed
    using the display property.


    # Solution


    In Figure 8.1, we can see some HTML elements, each describing their default display
    (block or inline) with an example of what happens if we change the display property
    on that element.'
  merge: -1
  pgno: 321
