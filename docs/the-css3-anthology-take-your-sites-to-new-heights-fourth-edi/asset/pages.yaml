    \ but still worked at 800 possible, although it did require compromise.\n\nThe\
    \ problem with liquid layouts becomes obvious at large screen resolutions with\
    \ the browser maximized: lines become very long and text hard to read. These layouts\
    \ also struggle when viewed on mobile devices, as the columns become tiny, often\
    \ with a single word on each line.\n\nMany website owners, developers, and designers\
    \ have attempted to remedy this issue by maintaining completely separate, independent\
    \ mobile sites. The problem with this technique is that modern mobile devices\
    \ are very flexible when it comes to web page display, and users don't necessarily\
    \ want to view a bare-bones, paredown version of a site. They want to see all\
    \ of the content, but want it displayed in a way that makes it easy to read on\
    \ their device.\n\n# ## Solution\n\nThe best solution to supporting a wide range\
