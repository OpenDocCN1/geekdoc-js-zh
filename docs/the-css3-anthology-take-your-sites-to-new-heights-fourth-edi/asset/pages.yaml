    \nFigure 4.25. The completed menu system\n\n# Discussion\n\nThe original drop-down\
    \ menus were knocked for being inaccessible and bloated. They often required JavaScript\
    \ to work, leaving you without any navigation at all if you didn't have JavaScript\
    \ enabled. Because of this, drop-down menus were never popular with web designers.\n\
    \nMore recently, web developers realized that the support of the :hover dynamic\
    \ pseudo-class on elements other than links would enable us to create CSS-only\
    \ drop-down menus without needing JavaScript at all. Solutions such as the new-famous\
    \ Suckerfish menus were developed using this technique.\n\n> ² http://www.alistapart.com/articles/dropdowns"
