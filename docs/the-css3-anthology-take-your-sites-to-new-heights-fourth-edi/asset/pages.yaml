  md: "# CSS for Layout 371\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_390_0.png)\n\
    \n# # Discussion\n\nThe majority of our stylesheets remains the same as the section\
    \ called \"How do I create a fixed-width layout with a full-width header and footer?\"\
    : we want to display all our text styling in the top part of the document to all\
