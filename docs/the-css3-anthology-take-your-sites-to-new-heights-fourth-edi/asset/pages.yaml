  md: '# Text Styling and Other Basics


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_50_0.png)


    Figure 2.1. The emphasized word within the paragraph


    # Discussion


    When you''re deciding which method of text sizing to use, it''s best to select
    one that allows all users to resize the text, as well as ensuring that text complies
    with the settings users have chosen within their browsers. Relative font sizing
    works as long as you''re careful about the way the elements inherit sizing. In
    order to achieve even basic level of accessibility, though, it''s important to
    enable users to set fonts to a comfortable level.


    Designing your layout with relative text also allows you to avoid another issue.
    Sometimes designers assume that setting font sizes in pixels will allow them to
    fix the heights of containers, or place text on fixed-height images. This approach
    will work in Internet Explorer, which doesn''t resize text set in pixels; it may,
    however, result in a complete mess of overflowing text in Firefox (versions prior
    to 3, or version 3 with Zoom set to zoom text only), where the height of boxes
    containing text is always unknown.


    I tend to use a combination of ems (to set the base size) and percentages within
    the document (percentages of base size). This means that if the clients want the
    site''s text to be larger or smaller, I can simply adjust the base size and all
    other text stays in proportion to it.'
  merge: -1
  pgno: 50
- img_proc: true
  md: "# The Sky’s Limit\n\nWhen designing for the Web, it's best to assume that you\
    \ do not know the height of anything; it will save you a lot of grief in the future.\
    \ Text resizing, people adding more text than expected via a content management\
    \ system, or long words causing line-wrapping can blow apart a layout that counts\
    \ on elements being a fixed height.\n\n# Relative Sizing and Inheritance\n\nWhen\
    \ you use any kind of relative sizing, remember that the element will inherit\
    \ its starting size from its parent element, then adjust its accordingly. Be careful,\
    \ though, when using a relative font size for the parent element as well; this\
    \ can become problematic in complex layouts where the parent element is less obvious.\
    \ Consider the following markup:\n\n```\n<div>\n  <p>\n    You'll &lt;em&gt;probably&lt;/em&gt;\
    \ be surprised when using\n    <a href=\"#\"a relative &lt;code&gt;font-size&lt;/code&gt;&lt;/a&gt;\n\
    \    and nested elements.\n  </p>\n</div>\n```\n\nLet's say we wanted to set the\
    \ font-size of the markup text to 130% of the default size, and we made the mistake\
    \ of setting it in this way:\n\n```\ndiv, p, em, a, code {\n  font-size: 130%;\n\
    }\n```\n\nThe effect of this style rule is to make the font-size of the nested\
    \ elements progressively bigger; that’s 130% of the font-size of the parent element,\
    \ which is already 130% of the font-size of its parent and so on, as demonstrated\
    \ in Figure 2.2."
