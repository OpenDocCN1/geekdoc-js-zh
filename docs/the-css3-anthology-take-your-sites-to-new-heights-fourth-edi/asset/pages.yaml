  md: "# Discussion\n\nThis technique works in current browsers, including Internet\
    \ Explorer 9. Browsers failing to support the property will display the background\
    \ image centered, but not scaled down or up. Depending on your site and the image\
    \ you choose, this can often be quite acceptable. For a range of more complicated\
    \ methods to achieve this effect in earlier browsers, you could read Chris Coyier's\
    \ article on the subject on the CSS-Tricks website.\n\nThe biggest issue with\
    \ scalable background images is the minimum size that it needs to be in order\
    \ to render well at large sizes. Take care with your image selection and how you\
    \ optimize the image so that your users avoid having to download a huge file size.\n\
    \n# How do I add more than one background image to an element?\n\nCSS2 only allowed\
    \ for one background image to be applied to an element. In CSS3, however, you\
    \ can add multiple background images.\n\n# Solution\n\nUsing the shorthand background\
    \ property that we discussed earlier, we can simply add a list of background images\
    \ and positioning information for the background property (each image is separated\
    \ by a comma):\n\n```\n.box {\n  height: 200px;\n  width: 200px;\n  border: 3px\
    \ solid #333;\n  background: url(gear.png) top right no-repeat,\n  url(gear2.png)\
    \ top left no-repeat,\n  url(gear3.png) bottom left no-repeat,\n  url(gear4.png)\
    \ bottom right no-repeat;\n}\n```\n\nThis will display as in Figure 3.14, where\
    \ each gear image is a background image."
