- img_proc: true
  md: "The problem with CSS-only menus is that they can be very difficult to use.\
    \ While there are no accessibility issues for screen-reader users in the way there\
    \ were for those old JavaScript-inserted menus (because the markup is right there\
    \ on the page), the menus are generally inaccessible for those using a keyboard\
    \ to navigate, and can be fiddly to click on when using a mouse, as we'll soon\
    \ see. My advice is to create your menus using CSS, but then use JavaScript to\
    \ enhance their usability, as I'll show you here.\n\nWe start with a set of nested\
    \ lists, as seen in Figure 4.26.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_188_0.png)\n\
    \nFigure 4.26. The unstyled nested lists\n\nWe can now use CSS to display this\
    \ list as a horizontal menu:\n\n```\n.nav {\n  list-style: none;\n  margin: 0;\n\
    \  padding: 0;\n  font-size: 114.3%;\n}\n```"
