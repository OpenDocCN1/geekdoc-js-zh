  md: "# The CSS3 Anthology\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_391_0.png)\n\
    \nFigure 17. The default style for all devices\n\nWe now need to create our set\
    \ of media queries, which you can see in our stylesheets. Media queries are part\
    \ of the CSS3 specification and enable us to target devices by certain properties,\
    \ such as their screen width. You can use media queries within a stylesheet as\
    \ we have here, or in your HTML document, as we will do in a later example.\n\n\
    For this simple site, we are going to target three width-related breakpoints.\
    \ First, we'll have a default stylesheet that will be used by all devices. We'll\
    \ use a media query to check if the browser window is wider than 768 pixels. If\
    \ we'll arrange the content into two columns. Finally, we're also going to check\
    \ for desktop widths by looking for screens over 992 pixels, in which the layout\
    \ will display over three columns. The media queries we need are as follows:\n\
    \n```\n@media only screen (min-width: 768px) {\n  /* css for 768 pixel width devices\
    \ and wider goes here */\n}\n\n@media only screen (min-width: 992px) {\n  /* css\
    \ for 992 pixel width devices and wider goes here */\n}\n```"
  merge: -1
  pgno: 391
- img_proc: true
  md: "# CSS for Layout 373\n\nInside the section for min-width:768px, we need to\
    \ add code that we will arrange our site into two columns. As we have a three-column\
    \ layout—consisting of our subnav, article, and aside—we're going to drop the\
    \ aside below the other two columns at this width.\n\nWe need to be able to calculate\
    \ the new widths of our columns, but as we've set the width of .wrapper to a percentage\
    \ (90%), we're unsure what its exact width will be at this point. The actual viewport\
    \ could be anywhere from 768 pixels to 991 pixels, and with the width of the wrapper\
    \ we set to 90%, that makes its potential width anywhere between 691 pixels and\
    \ 892 pixels. This means we can't use pixels to size our individual columns; we\
    \ need to calculate percentages.\n\nFirst, we decide on an arbitrary width for\
    \ .wrapper at this breakpoint that between these two values; let's go with 700\
    \ pixels. The calculation that we need to remember is this: target / container\
    \ = percentage.\n\nSo, our wrapper is 700 pixels wide and .subnav is 220 pixels\
    \ wide. We also want to leave a 20-pixel gutter between .subnav and .article;\
    \ therefore, .article will be 460 pixels if we float these columns left and right\
    \ respectively. We calculate the percentage width of .subnav as follows: 220/700\
    \ = 31.42857%.\n\nWe then calculate .article: 460/700 = 65.71428%. We can now\
    \ enter these values as the column widths into our CSS. We also need to set our\
    \ .aside to a width of 100%, and give it a rule of clear: so that it drops underneath\
    \ these first two columns:\n\n```\nchapter_09/3col-responsive.css (excerpt)\n\
    @media only screen and (min-width: 768px) {\n  .subnav {\n    width: 31.42857%;\
    \ /* 220/700 * */\n    float: left;\n  }\n\n  .article {\n    float: right;\n\
    \    width: 65.71428%; /* 460/700 * */\n  }\n\n  .aside {\n    width: 100%;\n\
    \  }\n```"
  merge: -1
  pgno: 392
- img_proc: true
  md: "# 374 The CSS Anthology\n\n```\nclear: both;\n}\n```\n\nOkay, let's test it.\
    \ Load the site in your browser, and pull your window down to a narrow view, so\
    \ that the content displays as one column. Now stretch out wider to see it rearrange\
    \ itself into two columns. Your first fluid grid!\n\nTo tidy up this screen width,\
    \ we can use the same width calculations to arrange the two chunks of footer content\
    \ into two columns as we have had in previous examples. Our final media query\
    \ for min-width: 768px is as follows:\n\n```\n@media only screen and (min-width:\
    \ 768px) {\n  .subnav {\n    width: 31.42857%; /* * 220/700 */\n    float: left;\n\
    \  }\n\n  .article {\n    float: right;\n    width: 65.71428%; /* * 460/700 */\n\
    \  }\n\n  .aside {\n    width: 100%;\n    clear: both;\n  }\n\n  .footer .copy\
    \ {\n    float: left;\n    width: 31.42857%; /* * 220/700 */\n  }\n\n  .footer\
    \ .vcard {\n    float: right;\n    width: 31.42857%; /* * 220/700 */\n  }\n}\n\
    ```"
