  md: "# Discussion\n\nThe value that you should be as per the CSS3 specification\
    \ is simply:\n\n```\nbackground-image: linear-gradient(top, #000, #666);\n```\n\
    \nFrom the solution, you can see that we need to repeat this line using the different\
    \ syntaxes used by various browsers and the relevant vendor-specific extensions,\
    \ as discussed in Chapter 1.\n\nThis technique works in all modern browsers except\
    \ Internet Explorer. I've included despite the lack of support in Internet Explorer\
    \ because there is one environment where you're likely to find such gradients\
    \ indeed: when you're developing for smartphones, tablets, or other mobile devices.\
    \ Saving of these devices from downloading images with large file sizes and employing\
    \ CSS instead is very handy. It helps users avoid limitations such as network\
    \ latency, limited bandwidth, and expensive data plans. We'll discuss this some\
    \ more in Chapter 7.\n\nSo, what should you do if you need a gradient that works\
    \ in Internet Explorer? My suggestion is to use an image. Create a one-pixel-wide\
    \ image that's a gradient from black to #333333, and save it as gradient.png.\
    \ Then use the following CSS to repeat the gradient image as a background along\
    \ the x of the body element, creating a gradient background:\n\n```\nchapter_03/gradient2.css\
    \ (excerpt)\n```\n\n```\nbody {\n  background-color: #666;\n  background-image:\
    \ url(gradient.png);\n  background-repeat: repeat-x;\n  color: #fff;\n  margin:\
    \ 0;\n  padding: 0;\n  font: 0.75em/1.3 \"Lucida Grande\", \"Lucida Sans Unicode\"\
    , sans-serif;\n  \"Lucida Sans\", Verdana, Tahoma, sans-serif;\n}\n```\n\nRemember\
    \ to set your background color to the same as that the gradient ends, so that\
    \ color continues even when the image stops."
