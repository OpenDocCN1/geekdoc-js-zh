  md: "# Text Styling and Other Basics\n\n```\np {\n  font-size: 10pt;\n}\n```\n\n\
    A point has a fixed size of 1/72nd of an inch, while a pica is one-sixth of an\
    \ inch. A printed document whose fonts are specified using these units will appear\
    \ exactly as you intend; after all, one-sixth of an inch is the same physical\
    \ measurement whether you're printing on an A4 page or a billboard. However, computers\
    \ are unable to accurately predict the physical size at which elements will appear\
    \ on the monitor, so they guess—and guess badly—at the size of a point or pica,\
    \ with results that vary between platforms.\n\nIf you're creating a print stylesheet\
    \ (as we do in the section called “How to create a print stylesheet?” in Chapter\
    \ 9) or a document that's intended for print—rather than screen-viewing, points\
    \ and picas are the units to use. However, as a general rule of thumb we should\
    \ avoid when designing for the Web.\n\n# Pixels\n\nMany designers like to set\
    \ font sizes in pixel measurements:\n\n```\np {\n  font-size: 12px;\n}\n```\n\n\
    Using pixels measurements makes it easy to achieve consistent text displays across\
    \ various browsers and platforms. However, pixel measurements ignore any preferences\
    \ users have set in their own browsers; furthermore, in the case of Internet Explorer,\
    \ font sizes that the designer has dictated in pixels cannot be resized by users.\
    \ This limitation presents a serious accessibility problem for users who need\
    \ to make text larger in order to read it clearly.\n\nWhile pixel measurements\
    \ may seem like the easiest option for setting font sizes, they should be avoided\
    \ if another method can be used. Even if you disregard the text resizing issue,\
    \ given that many users will use page zoom rather resize the text, using scalable\
    \ font sizes will make your life far easier once you venture into modern layout\
    \ techniques (we'll discuss this later in the book). If you're creating a document\
    \ for print or creating a print stylesheet, you should avoid pixels entirely.\
    \ Pixels have no meaning in the world of print, and like the application of points\
    \ to"
  merge: -1
