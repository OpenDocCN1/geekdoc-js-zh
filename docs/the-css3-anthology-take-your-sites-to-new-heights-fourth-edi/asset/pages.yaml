- img_proc: true
  md: "![](img/91ffcf72aa0d1324280d9a5972b3b7e7_272_0.png)\n\nI start by styling the\
    \ form, giving it a background color and some rounded corners. I'm also using\
    \ padding to provide a bit of space between the edge of the form and the fieldsets\
    \ within it:\n\n```\nform {\n  background-color: rgb(244,252,232);\n  width: 500px;\n\
    \  padding: 1em;\n  -webkit-border-radius: 10px;\n  -moz-border-radius: 10px;\n\
    \  border-radius: 10px;\n}\n```\n\nThen I style the fieldsets by giving them a\
    \ chunky rounded border. You can remove the borders although, but I want to maintain\
    \ the visual distinction between the sections in my form. As an extra touch, I'm\
    \ using:hover on the fieldset element to change the alpha value of my RGBA color\
    \ when the user moves their pointer to that fieldset. After making these changes,\
    \ my form now displays as in Figure 6.16:"
  merge: -1
  pgno: 272
- img_proc: true
  md: "```\nfieldset {\n  background-color: rgba(126,208,214,0.3);\n  border: 3px\
    \ solid rgb(255,255,255);\n  -webkit-border-radius: 10px;\n  -moz-border-radius:\
    \ 10px;\n  border-radius: 10px;\n  margin: 0 0 1em 0;\n}\n\nfieldset:hover {\n\
    \  background-color: rgba(126,208,214,0.5);\n}\n```\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_273_0.png)\n\
    \nFigure 6.16. After styling the form and fieldset\n\nThe legend element is a\
    \ label for the fieldset. I'm increasing the size of this to make it more of a\
    \ heading:"
  merge: -1
  pgno: 273
- img_proc: true
  md: "```\nlegend {\n  font-size: 133%;\n}\n```\n\nI can style the div elements within\
    \ the fieldsets—just as we have for the other solutions in this chapter. The CSS3\
    \ selector first-of-type is being used to add some extra padding to the top of\
    \ the first div element:\n\n```\nform div {\n  float: left;\n  width: 100%;\n\
    \  padding: 0 0 0.75em 0;\n}\n\nform fieldset div:first-of-type {\n  padding-top:\
    \ 1em;\n}\n```\n\nThen I float my labels left and style the input elements:\n\n\
