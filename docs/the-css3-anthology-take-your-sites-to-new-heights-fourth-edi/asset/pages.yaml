    \ (excerpt)\n<script src=\"//ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js\"\
    ></script>\n<script>\n$(document).ready(function() {\n$('tr:nth-child(odd)\\).addClass(\"\
    odd\");\n});\n</script>\n```\n\nWe need to make a small change to our CSS: adding\
    \ a selector that looks for a class of odd alongside our tr-nth-child selector:\n\
    \n```\nchapter_07/selectors-jquery.css (excerpt)\n.datatable tr.odd {\n  background-color:\
    \ #dfe7f2;\ncolor: #000000;\n}\n```\n\nThis will cause the rows to be striped\
    \ in older browsers as long as they support JavaScript.\n\nWhether you use Selectivizr\
    \ or decide to write your own JavaScript is up to you. As most of our projects\
    \ use jQuery anyway, and we tend to have a JavaScript file that deals with a UI\
    \ requirements, I often create a fewSelectors function that goes through and adds\
