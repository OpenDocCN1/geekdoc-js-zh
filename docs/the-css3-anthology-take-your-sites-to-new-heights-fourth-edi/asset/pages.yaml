- img_proc: true
  md: "# Discussion\n\nYou should avoid using the HTML tag blockquote to indent text\
    \ unless the text is actually a quote. This bad habit was a technique encouraged\
    \ in past environments such Dreamweaver, which played on the fact that a browser's\
    \ default stylesheet usually indents a blockquote. Some WYSIWYG (What You See\
    \ Is What You Get) editors used in content management systems also do this. If\
    \ you're currently using an editor that employs blockquote tags to indent text,\
    \ you should resist the temptation to use it for this purpose; instead, set up\
    \ a CSS rule to indent the appropriate blocks as just shown.\n\nThe blockquote\
    \ tag is designed to mark up a quote, and devices such as screen readers used\
    \ by visually impaired people will read this text in a way that helps them understand\
    \ that it's a quote. Hence, using blockquote to indent regular paragraphs will\
    \ be very confusing for such users.\n\n# A One-liner\n\nA related technique enables\
    \ us to indent just the first line of each paragraph. Simply apply the CSS property\
    \ text-indent to the paragraph—or to a class that's applied to the paragraphs—that\
    \ you wish to display in this way:\n\n```\n```chapter_02/indent.css\npp {\n  text-indent:\
    \ 1.5em;\n}\n```\n```"
  merge: -1
