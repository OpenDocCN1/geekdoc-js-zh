  md: "Text Styling and Other Basics 33\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_52_0.png)\n\
    \nFigure 2.2. Relative font sizing\n\n# # How do I remove underlines from my links?\n\
    \nThe widely accepted default indicator that text on a web page links to another\
    \ document is that it is underlined and displays in a different color from the\
    \ rest of the text. However, there may be instances in which you want to remove\
    \ that underline.\n\n# ## Solution\n\nWe use the text-decoration property to remove\
    \ the underlines from link text. By default, the browser will set the text-decoration\
    \ property of all elements to underline. To remove the underline, simply set the\
    \ text-decoration property for the link to none:\n\n```\ntext-decoration: none;\n\
    ```\n\nThe CSS used to create the effect shown in Figure 2.3 is as follows:\n\n\
    ```\nchapter_02/textdecoration.css\na:link, a:visited {\n  text-decoration: none;\n\
    }\n```"
  merge: -1
