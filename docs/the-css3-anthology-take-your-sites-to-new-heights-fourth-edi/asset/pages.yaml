- img_proc: true
  md: '# Making a Start with CSS


    2. Candidate Recommendation: implementation experience is gathered during this
    phase


    3. Proposed Recommendation: the module is sent to the W3C Advisory Committee for
    final endorsement


    4. W3C Recommendation: the module is now endorsed by the W3C and should be widely
    adopted


    While a module is moving through the various stages, browser manufacturers often
    start implementing the module at Working Draft stage. This is good, because it
    helps to provide implementation experience in terms of how the specification works
    used; however, it is possible that implementation details could change from the
    initial proposal.


    For example, if you had used a CSS3 property that subsequently changed, a site
    built a year ago might look very old indeed in a new browser that changed the
    implementation to the new, correct way of doing it.


    To avoid this issue, browser manufacturers often use a vendor prefix when doing
    their early stage implementations to create a vendor-specific implementation of
    the property. For example, we use border-radius to create rounded corners like
    so:


    ```

    border-radius: 10px;

    ```


    However, for rounded corners to work in earlier versions of Firefox and Safari,
    you’d also need to add the vendor-prefixed versions:


    ```

    -webkit-border-radius: 10px;

    -moz-border-radius: 10px;

    border-radius: 10px;

    ```


    Once the module is unlikely to change, the browsers start supporting the real
    property alongside their own. Some browsers may never have a vendor-specific version
    and just implement the one from the specification.


    You’ll witness many examples of these prefixed properties throughout the book,
    so you should become comfortable using them.'
  merge: -1
  pgno: 38
