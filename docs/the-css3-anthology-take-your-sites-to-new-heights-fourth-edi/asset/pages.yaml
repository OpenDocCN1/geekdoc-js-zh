  md: '# Your Feedback


    If you''re unable to find an answer through the forums, or if you wish to contact
    us for any other reason, the best place to write is books@sitepoint.com. We have
    an email support system set to track your inquiries, and friendly support staff
    who can answer your questions. Suggestions for improvements, as well as notices
    of any mistakes you may find, are especially welcome.


    # Acknowledgments


    Firstly, I''d like to thank the SitePoint team for making a fourth edition of
    this book possible. Despite being spread across a range of time zones, the whole
    process has been enjoyable and the comments from everyone have served to make
    this a better book than it would otherwise.


    To those people who are really breaking new ground in the world of CSS, those
    whose ideas are discussed throughout this book, and those who share their ideas
    and creativity with the wider community, thank you.


    Thanks to Drew, for accepting yet another book project into our personal and professional
    lives, and for being part of many discussions that have informed topics covered
    in this book. Finally, thanks must go to my daughter Bethany, who is understanding
    of the time I spend working, and makes me laugh when I am tired. Both make so
    many things possible; thank you.


    # Conventions Used in This Book


    You''ll notice that we''ve used certain typographic and layout styles throughout
    this book to signify different types of information. Look out for the following
    items.


    # Markup Samples


    Any markup—be that HTML or CSS—will be displayed using a fixed-width font like
    so:


    ```

    <h1>A perfect summer''s day</h1>

    <p>It was a lovely day for a walk in the park. The birds were singing and the
    kids were all back at school.\</p>

    ```'
