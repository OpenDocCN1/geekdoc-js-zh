  md: '![](img/91ffcf72aa0d1324280d9a5972b3b7e7_180_0.png)


    # # Discussion


    The sitemap starts life as a list for the main navigation elements with the submenus
    nested inside—the same way the list with subnavigation discussed in the previous
    section called "Can I use CSS and lists to create a navigation system with subnavigation?"
    did. The difference with the sitemap is that all menus will display their subnaviga-.
    If the sitemap becomes deeper (with further levels), you just continue nesting
    in the same way, with subpages being a sublist of their parent page.


    Take care to nest the list items properly. The submenu needs to go before the
    closing 11 of the parent list. Without CSS, the sitemap displays as in Figure
    4.22.'
