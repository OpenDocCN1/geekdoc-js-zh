    \n```\nchapter_02/textdecoration4.css\na:link, a:visited {\n  text-decoration:\
    \ underline;\n  color: #6A5ACD;\n  background-color: transparent;\n}\n\na:hover,\
    \ a:active {\n  text-decoration: underline overline;\n  color: #191970;\n  background-color:\
    \ #C9C3ED;\n}\n```\n\nAs you've probably realized, you can style the anchor's\
    \ other pseudo-classes separately, too. In particular, you might like to apply\
    \ a different style to links that users have visited. To do so, you'd simply style\
    \ the :visited pseudo-class separately."
