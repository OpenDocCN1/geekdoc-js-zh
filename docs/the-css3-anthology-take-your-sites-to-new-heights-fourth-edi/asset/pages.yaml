  md: "# Chapter 1\n\n# # Making a Start with CSS\n\nA web page consists of markup—HTML\
    \ or XHTML that describes the meaning of the content on the page—and CSS (Cascading\
    \ Style Sheets) that tell the browser how the content should be displayed in browsers\
    \ and other user agents that need to display it. CSS tells the browser everything\
    \ about the layout of the page to the colors of your headings.\n\nIn this chapter,\
    \ whose format differs to the rest of the book, I'll explain the basics of CSS\
    \ syntax and how to apply CSS to your web pages. If you're experienced with CSS,\
    \ feel free to skip this chapter and start with the solutions in Chapter 2.\n\n\
