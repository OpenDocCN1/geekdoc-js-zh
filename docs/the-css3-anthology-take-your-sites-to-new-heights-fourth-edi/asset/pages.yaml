  md: '# The CSS3 Anthology


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_257_0.png)


    At the time of writing, Safari and IE9 does not support required, while Opera,
    Chrome, and Firefox do. This situation is likely to change fairly quickly, though,
    so you may find by the time you read this all the mainstream browsers support
    this feature.


    # Discussion


    The new HTML5 elements and attributes offer a lot of potential to those of us
    develop web applications and need to use forms frequently. The prospect of being
    able to do client-side validation simply by adding the relevant HTML element is
    very appealing, and by using built-in browser handling for this validation, we
    use a feature that users will be accustomed to—once there’s good browser support.


    In our solution, we looked at the use of the required attribute to perform client-side
    validation; however, these new built-in browser validation techniques should never
    suffer alone for testing user input. It is still essential that you validate any
    input from your form with server-side code, just as you would when using JavaScript
    validation functions. Currently, bypassing the HTML5 required field just needs
    the user to be using Internet Explorer 9, because it doesn’t support required
    and so allows the user to submit the form.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'The required attribute is ignored by browsers without support for it, so there''s
    no harm in using it. You could even inspect the input field using JavaScript to
    see if it''s required, and for browsers without support for HTML5 validation,
    create your own JavaScript validation.


    # Can we style the validation messages using CSS?


    The question that may now be in your mind is whether we can style the messages
    that appear, and the answer is: not in any standard way, although browser vendors
    themselves have their own pseudo-classes that we can apply CSS to. These messages
    are generated by the operating system and browser, so they take on a default style.
    This is good in some ways, as it enables people to become used to these messages
    and how they look and act; however, it may be frustrating to designers who find
    the alerts ugly—there''s certainly a difference between browsers. Figure 6.9 reveals
    the same form, this time in Firefox on OS X.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_258_0.png)


    Figure 6.9. The form alerts in Firefox'
  merge: -1
