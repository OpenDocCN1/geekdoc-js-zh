  md: "# Discussion\n\nThe nth-child selector makes it very easy to target the odd\
    \ and even rows in your table using the keywords odd and even:\n\n```\n.datatable\
    \ tr:nth-child(odd) {\n  background-color: #dfe7f2;\n  color: #000;\n}\n```\n\n\
    Prior to widespread support for this selector, we'd have to add a class to every\
    \ other row and then use the class to target the row:\n\n```\n.datatable tr.altrow\
    \ {\n  background-color: #dfe7f2;\n  color: #000;\n}\n```\n\nIn Chapter 7, we\
    \ will look at some other ways to deal with the lack of support for selectors\
    \ such as nth-child in older browsers.\n\n# How do I change a row's background\
    \ color when the mouse hovers over it?\n\nOne way to boost the readability of\
    \ tabular data is to change the color of rows as users move the cursor over them\
    \ to highlight the row they're reading. This can be seen in Figure 5.11."
