    # # Discussion


    The col element provides us with further flexibility for styling a table''s columns,
    making our table attractive and easier to understand. It''s also possible to nest
    col elements within a colgroup element, which allows us to change the column''s
    appearance by applying style rules to the parent colgroup element.'
  merge: -1
  pgno: 217
- img_proc: true
  md: "Here’s example of nested col elements:\n\n```\n<table class=\"datatable\">\n\
    <colgroup>\n<col />\n<col />\n</colgroup>\n<colgroup>\n<col />\n<col />\n</colgroup>\n\
    <tr>\n<th>Pool A</th>\n<th>Pool B</th>\n<th>Pool C</th>\n<th>Pool D</th>\n</tr>\n\
    </table>\n```\n\nHere are the styles that are applied to the colgroup element\
    \ rather than col:\n\n```\n.datatable colgroup: nth-child(odd) {\n  background-color:\
    \ #B0c9ff;\n  color: #000;\n}\n\n.datatable colgroup: nth-child(even) {\n  background-color:\
    \ #bfe4ff;\n  color: #000;\n}\n```\n\nThe result of this change is as shown in\
    \ Figure 5.13."
