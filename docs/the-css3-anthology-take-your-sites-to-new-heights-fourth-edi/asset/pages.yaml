  md: '# Solution


    This is a solution that helps you find the solution.


    # Take a Break


    Once we''re frustrated with battling a problem, applying any kind of rational
    process for finding a solution is difficult at best. Take a break. Go for a walk,
    tidy your desk, or do some housework. If you''re at your work with boss looking
    over your shoulder (and unable to make it to the coffee machine in peace), work
    on another task: answer some mail or tidy up some content. Do anything to take
    your mind off the problem for a while.


    # Validate Your Stylesheet and Document


    If you''ve tried to do so, your next step is to validate the CSS and the markup
    (although you may come across some validation problems regarding CSS33; see the
    section called "The validator complains about your vendor-specific extensions,
    how do I validate CSS33?” for details). Errors in your CSS or markup may well
    cause problems and, even if your problem is actually caused by another issue,
    they often make it more difficult to find a solution.


    # Double-check that the Properties You''re Using Are Supported in the Browser
    You''re Testing


    It''s very easy to forget at which point a CSS3 property made it into a particular
    browser. For example, if you''re using `first-child` to remove a margin on the
    first element, this will fail to work in Internet Explorer 6, and you''ll need
    to patch this with a JavaScript polyfill, use some alternate CSS, or live with
    the difference in spacing. The Website when I use ...²25 is an excellent resource
    for checking which browsers support properties.


    # Isolate the Problem


    Can you make your issue occur in isolation from the rest of your document? CSS
    problems often display only when a certain group of conditions is met, finding
    out exactly where the problem occurs may help you work out how it can be fixed.
    Try to reproduce the problem in a document separate from the rest of your layout.'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'If you are using JavaScript polyfills, does the issue go away if you remove
    the JavaScript? You may have encountered a bug in a third-party polyfill script,
    in which case the script''s support would be the best place to start asking questions.


    # Search the Web


    If your issue is with a very old browser, in particular Internet Explorer 6 and
    7, it''s highly likely to be a problem that has been previously experienced. Bugs
    with IE6 and its rendering engine are very well documented. Searching the Web
    should turn up plenty of sites with details of these issues; and don''t worry
    the websites look out of date—the browsers out too!


    There are fewer actual CSS rendering bugs with the newer browsers; the most likely
    issues for those will be in the lack of support for properties you''re using.
    Google can also help you find answers to problems, as it''s fairly rare to come
    up against completely new issues.


    # Ask for Help


    If you''re yet to find a solution as you''ve moved through the aforementioned
    steps, ask for help. Even the most experienced developers hit problems that they''re
    unable to see past. Sometimes, just talking through the issue with a bunch of
    people with fresh eyes can help resolve the problem, or come up with new ideas
    to test—even if no one has an immediate solution.


    If you have a reasonable number of front-end developer followers on Twitter, simply
    posting an example of the issue may well prompt you familiar with the issue to
    come to your aid. There are also various forums and lists where help can be found,
    such as the SitePoint forums²²⁶ or Stack Overflow.²⁷


    When you post to a website, forum, or mailing list, remember these rules of thumb:


    +   - Search the site or list archives, just in case your question is common enough
    to be asked at least once a day.


    +   - Make sure that your CSS and HTML validates; otherwise, the answer you''ll
    receive is most likely to be “Go and validate your document and see if that helps.”


    > ²⁶ http://www.sitepoint.com/forums/forum.php


    > ²⁷ http://stackoverflow.com/'
  merge: -1
