    # Chapter 8: CSS Positioning


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_343_0.png)


    Figure 8.12. The boxes sit on top of any other content


    A common rookie error of those who are just beginning to use CSS is to think they
    can simply position everything on the page using position absolute. This might
    work in their own browsers, but in another browser with a larger default text
    size, or if more content is added, everything starts to overlap!


    # Discussion


    We''ve seen how it is possible to position items from the edge of the viewport,
    but this is unlikely to be very useful. What can be useful (when done carefully)
    is the ability to position items within a container.


    If, in our previous example, we wanted our positioned elements to respect the
    parent wrapper `div`, we could do so by setting `.wrapper to position: relative`
    as follows:'
