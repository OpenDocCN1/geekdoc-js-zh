  md: "# The CSS3 Anthology\n\n```\n<table class=\"clmonth\">\n  <caption>November\
    \ 2011</caption>\n  <tr>\n    <th scope=\"col\">Monday</th>\n    <th scope=\"\
    col\">Tuesday</th>\n    <th scope=\"col\">Wednesday</th>\n    <th scope=\"col\"\
    >Thursday</th>\n    <th scope=\"col\">Friday</th>\n    <th scope=\"col\">Saturday</th>\n\
    \    <th scope=\"col\">Sunday</th>\n  </tr>\n</table>\n```\n\nThe has a class\
    \ of clmonth. I've used a class rather than an ID because, in some situations,\
    \ you might want to display more than one month on the page. If you found that\
    \ you needed to give the table an ID—perhaps to allow you to show and hide the\
    \ table using JavaScript—you could add an ID as well as the class.\n\nThe days\
    \ are held within individual table cells, and the events for each day are marked\
    \ as a list within the appropriate table cell.\n\nIn the following markup, you\
    \ can see that I have added classes to two of the table cells. The class previous\
    \ is applied to cells containing days that fall within the preceding month (we'll\
    \ use next later for days in the following month), while the class active is applied\
    \ to cells that contain event information, so that we may highlight them:\n\n\
    ```\n<tr>\n  <td class=\"previous\">31</td>\n  <td class=\"active\">1\n    <ul>\n\
    \      <li>New pupils' open day</li>\n      <li>Year 8 theater trip</li>\n   \
    \ </ul>\n  </td>\n  <td>2</td>\n  <td>3</td>\n  <td>4</td>\n  <td>5</td>\n  <td>6</td>\n\
    </tr>\n```"
  merge: -1
  pgno: 225
- img_proc: true
  md: "The table, without CSS, displays as shown in Figure 5.16.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_226_0.png)\n\
    \nNow that we have the structural markup in place, we can style the calendar.\
    \ I set a standard style for the body, including a base font size. Then I set\
    \ a style for the class cmonth for the borders to collapse, leaving no space between\
    \ cells:\n\n```\nbody {\n    background-color: #fff;\n    color: #111;\n    margin:\
    \ 0;\n    padding: 0;\n    font: 0.75em/1.3 \"Lucida Grande\", \"Lucida Sans Unicode\"\
    ,\n    \"Lucida Sans\", Verdana, Tahoma, sans-serif;\n}\n\n.wrapper {\n    width:\
    \ 80%;\n    margin: 20px auto 40px auto;\n}\n```"
