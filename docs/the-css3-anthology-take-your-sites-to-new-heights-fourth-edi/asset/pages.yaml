  md: "# CSS for Layout 393\n\nChapter 9: Responsive Images\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_412_0.png)\n\
    \nFigure 9.23. On a very wide screen, we move the introductory text next to the\
    \ large image\n\n# Discussion\n\nIf you look at this design in a browser, you'll\
    \ discover that not only does the grid scale between width breakpoints, the images\
    \ do as well. To facilitate this, we need to add a very simple rule in our CSS:\n\
    \n```\nimg {\n  max-width: 100%;\n}\n```nchapter_09/responsive-basic.css (excerpt)\n\
    ```\n\nWhen we set this rule, all images' maximum widths will be, at most, equal\
    \ to the width of the image itself; they'll display smaller as their containers\
    \ shrink when the browser is resized.*"
