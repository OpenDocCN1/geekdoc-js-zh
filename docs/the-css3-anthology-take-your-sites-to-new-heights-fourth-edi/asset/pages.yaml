  md: "# Discussion\n\nWhen you add an extra column to your layout, you need to ensure\
    \ that all your width calculations are correct. In our two-column layout, we float\
    \ our .article and .aside elements left and right; because the total width of\
    \ the two combined was less than the 940-pixel total width of the wrapper, a natural\
    \ gap was left between them.\n\nWith a three-column layout, we float both .subnav\
    \ and .article left. If there was no right-hand margin on, there would be no space\
    \ between the two elements, but adding a 20-pixel margin to .subnav creates a\
    \ gutter between them, ensuring the text in each column does not abut.\n\n# How\
    \ do I create a fixed-width layout with a full-width header and footer?\n\nThe\
    \ layout that we have been working on so far is completely contained within a\
    \ 940-pixel wrapper. This means that the dark-gray header and footer bars stay\
    \ at 940 pixels wide. A common design structure involves a fixed central content\
    \ area that allows the background color on some or all of the containers to bleed\
    \ out to the edges of the viewport, as seen in Figure 9.10. So how is this achieved?\n\
    \n# Solution\n\nWe need to make a few changes to our markup to enable a wider\
    \ footer:\n\n```\n<DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n\
    \  <title>Chapter 9: 3 Column Layout - floats, wider footer</title>\n  <link rel=\"\
    stylesheet\" href=\"3-colide-wide-footer.css\" />\n</head>\n<body>\n  <div class=\"\
    header\">\n    <div class=\"inner\">\n      <div class=\"wrapper\">\n        <h1>Recipe\
    \ <span>for</span></span> Success</h1>\n```"
