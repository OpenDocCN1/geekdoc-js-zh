  md: "# Can I style input elements based on their validity?\n\nKnowing that an element\
    \ is required is obviously useful, as we saw in the previous solution, let alone\
    \ knowing whether the element has an error or is valid. Can we access these states\
    \ using CSS?\n\n# Solution\n\nThe CSS3 Basic User Interface Module outlines several\
    \ dynamic pseudo-classes that we can use to detect the various states of a field\
    \ as it's interacted with by the user:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\" />\n  <title>Chapter 6: Form Validation</title>\n \
    \ <link rel=\"stylesheet\" href=\"form-validation.css\" />\n</head>\n<body>\n\
    \  <div class=\"wrapper\">\n    <form method=\"post\" action=\"/contact\" id=\"\
    contact-form\">\n      <div>\n        <label for=\"fName\">Name</label>\n    \
    \    <input type=\"text\" name=\"fName\" id=\"fName\" required=\"required\" />\n\
    \      </div>\n      <div>\n        <label for=\"fEmail\">Email address</label>\n\
    \        <input type=\"email\" name=\"fEmail\" id=\"fEmail\" required=\"required\"\
    \ placeholder=\"name@example.com\" />\n      </div>\n      <div>\n        <label\
    \ for=\"fQuestion\">Question / Comments</label>\n        <textarea name=\"fQuestion\"\
    \ id=\"fQuestion\" rows=\"10\" cols=\"30\"></textarea>\n      </div>\n      <div\
    \ class=\"submit\">\n        <input type=\"submit\" name=\"contact-submit\" id=\"\
    contact-submit\" value=\"Submit\" />\n      </div>\n```"
