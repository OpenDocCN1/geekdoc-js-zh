  md: "# 402 The CSS3 Anthology\n\nbrowsers will completely ignore the media queries\
    \ we inserted into our CSS, as well as the separate stylesheets we created and\
    \ linked to our HTML document.\n\nThere are two possible solutions to this issue.\
    \ The first is to use a JavaScript polyfill called Respond.js that causes these\
    \ older browsers to load the CSS rules within the media queries. A polyfill is\
    \ simply a piece of code or plugin that takes care of functionality you'd expect\
    \ a browser to perform natively.\n\nYou can download the Respond.js project from\
    \ GitHub. Remember to read the attached notes to ensure your stylesheets can be\
    \ parsed by the script.\n\nThe second solution is what I intend to do in production,\
    \ and that is not to try to serve media queries to old versions of Internet Explorer\
    \ at all. Instead, add a separate stylesheet (or stylesheets) that sets Internet\
    \ Explorer to display the site at a fixed width as in the CSS below. The result\
    \ can be seen in Figure 9.24:\n\n```\nchapter_09/responsive-ie.html (excerpt)\n\
    \n<!--[if (lt IE 9) && IEMobile)]\n<link rel=\"stylesheet\" href=\"responsive-ie-old.css\"\
    \ />\n<![endif]-->\n```\n\n```\nchapter_09/responsive-ie-old.css\n\n.wrapper {\n\
    \  width: 940px;\n}\n\n.header .nav {\n  position: absolute;\n  top: 20px;\n \
    \ right: 0;\n  list-style-type: none;\n}\n\n.header h1 {\n  padding: 20px 0 20px\
    \ 0;\n  font-size: 175%;\n}\n```\n\n6 https://github.com/scottjehl/Respond"
