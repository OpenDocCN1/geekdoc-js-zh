  md: '# Triggering the hasLayout Property


    To work around this issue, we simply use the height property in our IE6-specific
    stylesheet we''ve used min-height in our main stylesheet.


    IE6 and 7 have a mysterious scripting property called hasLayout that''s an internal
    component of the rendering engine, and the source of many seemingly bizarre rendering
    bugs. When an element with a layout is responsible for sizing and arranging its
    contents, it''s said to have a layout. If an element is without a layout, it relies
    on its parent or an ancestor element to take care of its size and position. When
    an element has no layout, the potential for weird stuff to happen—like content
    disappearing and the layout behaving erratically. Some elements, like table cells,
    automatically have a layout; however, div elements do not. Specifying CSS properties,
    such as setting float to left or right, also causes an element to gain a layout.
    In making an element gain layout, most of these problems disappear. The trick
    is to find a CSS property that gives an element a layout without a detrimental
    effect on your overall design.


    In IE6, I find the simplest way to trigger a layout on an element is to give it
    a height of 1%. IE6 treats height as min-height, so a height of 1% actually renders
    as a minimum height of 1%—so this is perfectly safe to apply and the box will
    be sized to suit its contents. Obviously you need to do this in your IE6-specific
    stylesheets''s included with conditional comments.


    IE7, by contrast, supports the height property correctly, so we''re unable to
    use it as we might with IE6. However, setting the min-height property to any value—even
    to 0 in IE7 causes the element to gain a layout. This is a safe approach because
    the default value for min-height is 0 always.


    It''s not always obvious which element is need the layout trigger applied, but
    if you work methodically, you may find the one that causes everything to jump
    into shape. I usually work from the innermost container out, so if I have a div
    nested inside two more divs, I add the height to the inner div and refresh to
    see if it made a difference. Otherwise, I remove it and try the next div, and
    so on.


    # Adding Position: Relative to Elements


    If gaining a layout fails to work, setting position to relative on an element
    will sometimes fix a problem. Keep in mind that setting position to relative on
    an'
