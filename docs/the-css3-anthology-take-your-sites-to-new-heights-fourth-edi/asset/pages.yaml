    \n# # Discussion\n\nWe start out with a marked-up form comprising two sections\
    \ of information: basic account information and address details. In Figure 6.15,\
    \ you can see the form without any CSS applied, and the two fieldsets clear—if\
    \ a bit ugly—with a gray border."
