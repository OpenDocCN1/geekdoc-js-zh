    # # Discussion


    The use of box-shadow makes adding shadows incredibly simple—far removed from
    the pain of creating shadow images in image-editing software and adding them as
    backgrounds. The official W3C syntax for box-shadow is:


    ```

    box-shadow: 3px 3px 10px 8px rgba(0, 0, 0, 0.4);

    ```


    The values are as follows, listed in the order shown above:


    # Horizontal offset value


    This can be a positive or negative value. If positive, the shadow will be on the
    right side of the box; a negative value positions it to the left.'
