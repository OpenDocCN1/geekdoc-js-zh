    the box and negative above it.


    # Blur radius


    A low value here means the shadow will be sharper, while a higher value makes
    it more blurred. This value must be 0 or a positive value; negative values aren''t
    allowed.


    # Spread


    Positive values cause the shadow shape to spread in all directions, while negative
    values cause the shadow to contract.


    # Color


    This may be of RGBA, as used in this example, or hex.


    You can also add a keyword of inset at the beginning of the list of values, which
    will create an inner shadow:


    ```

    box-shadow: inset 3px 3px 10px 8px rgba(0, 0, 0, 0.4);

    ```


    Playing with the values is the best way to get a feel for how box-shadow works.
    I often use an online box-shadow generator at the CSS3 Generator site⁶ as it creates
    the syntax for me, and I can play around with values to see what effect they’ll
    have.


    The box-shadow property is supported by all modern browsers, including Internet
    Explorer 9, and will be ignored by earlier browsers without support.


    # How do I create rounded corners on an element?


    To create rounded corners on an element, such as the wrapper in Figure 3.22, use
    the border-radius property:'
