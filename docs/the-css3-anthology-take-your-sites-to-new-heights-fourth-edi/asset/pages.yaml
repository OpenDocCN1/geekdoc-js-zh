    # Discussion


    The float floats the image against the edge of the block-level element that it
    contains. Other block-level elements will ignore the floated element and render
    as if it''s. Inline elements as content, however, will make space for the floated
    element, which is what we can use to wrap the text around an image.


    As we can clearly see in Figure 8.7, the text collides against the side of the
    image. If we add a border to that image, the text will bump against the side of
    the border.


    To create space between our image and the text, we need to add a margin to the
    image. Since the image is aligned against the left-hand margin, we only need to
    add right and bottom margins to move the text slightly away from the image:


    ```

