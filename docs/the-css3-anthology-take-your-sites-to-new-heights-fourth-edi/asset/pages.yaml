  md: "```\nbackground-repeat: no-repeat;\ntext-decoration: none;\n\n```\n\n# Discussion\n\
    \nThe use of background images is a core part of designing for the Web, but how\
    \ do you know whether an image should be a background image, or if it should be\
    \ part of the page as a regular image in HTML?\n\nMy rule of thumb is whether\
    \ or not the image has any meaning to the rest of the document. I'd embed a photo\
    \ or diagram related to the content as a regular image in the HTML document, and\
    \ include the relevant alt text for users who are unable to see the image. Images\
    \ that are added as a background image do not have alt text, so'll be completely\
    \ invisible to a screen reader. Save background images for purely aesthetic design\
    \ elements that would be of no interest to a user reading the text of a page.\n\
    \nYou might choose to omit or replace these background images when creating a\
    \ mobile version of the layout, which we will discuss later in Chapter 9. Having\
    \ incidental images as background images will make this task easier.\n\n# How\
    \ do I create a gradient background?\n\nIt's common to require a linear gradient\
    \ as the background of an entire web page or box or other element.\n\n# Solution\n\
    \nThe CSS3 approach is to use the background-image property and specify a linear\
    \ gradient as the value of this property:\n\n> chapter_03/gradient.css (excerpt)\n\
    \n```\nhtml {\n  height: 100%;\n}\nnbody {\n  height: 100%;\n}\n```"
