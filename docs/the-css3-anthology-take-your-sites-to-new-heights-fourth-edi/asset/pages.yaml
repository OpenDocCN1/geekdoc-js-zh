  md: '# The CSS3 Anthology


    # Discussion


    The background-color property simply adds a color to the page or element to which
    it''s applied. I used background-color to set the body to a dark gray color (just
    in case the image fails to load for some reason), and then set the wrapper div
    to white. If there had been no background color of wrapper, the background image
    on the body would have showed through.


    The background-image property allows you to specify an image to be loaded and
    displayed as a background image. In this case, we wanted to add it as a background
    image for the whole page so we used it on the body tag. You can use background
    images on most elements, as you''ll see in a later example in this chapter.


    By default the background will tile. In this example, I downloaded the image brushed_alu_dark.png,
    a small tile, from a site offering free patterns.¹ The browser repeats the tile
    to fill the available space in the element.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_101_0.png)


    Figure 3.4. The background tile


    > ¹ http://subtlepatterns.com'
  merge: -1
