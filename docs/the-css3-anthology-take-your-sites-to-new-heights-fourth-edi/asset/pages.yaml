    When styling pseudo-classes, take care that you leave the size or weight (or boldness)
    of the text unchanged. Otherwise, you''ll find that your page appears to jiggle,
    as the surrounding content has to move make way for the larger text to display
    when your cursor hovers over the link.


    # Ordering Pseudo–class Declarations


    The anchor pseudo-classes should be declared in the following order: :link, :visited,:hover,
    :active, or else you may find that they work differently than you intended. One
    way to remember this order is by using the mnemonic: LoVeHAte.


    > Fashion Police

    You are limited in the styles you may apply to visited links.² This is because
    of the potential privacy implications of your browser knowing which links you
    have visited. If visited styles do not appear to be showing in a particular browser,
    it may be due to this issue.


    ² http://hacks.mozilla.org/2010/03/privacy-related-changes-coming-to-css-visited/'
