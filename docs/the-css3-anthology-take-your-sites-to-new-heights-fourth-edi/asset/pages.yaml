    # Discussion


    The float property changes the way other elements respond to the floated element,
    causing other block-level elements to ignore it altogether. So the border on the
    top of the ingredients list was correctly taking the full width of the container,
    as if there were no floated image. The floated image essentially sits on top of
    any block-level elements, whereas space is made for it by inline elements. We''ll
    see a lot more of this behavior in the next chapter.


    The clear property tells the block-level elements below any floated images that
    they should clear those floated elements; that is, only once the floats have finished.
    The clear property can take the following values:


    +   - left: clear only items left

    - right: clear only items floated right

    - none: clear nothing

    - both: clear items floated left and right


    # How do I set an item''s position on the page using CSS?


    We can use CSS to position elements using absolute positioning.


    # Solution


    If you set the value of the position property to absolute, you can position your
    element top, left, bottom, and right. This positioning will happen in relation
    to the viewport unless you''ve given absolute or relative positioning to a parent
    element of the element that you''re trying to position. This is easier to understand
    with a series of examples.


    The image shown in Figure 8.10 has two boxes that are positioned using absolute
    positioning, from the top-left and bottom-right of the viewport.'
