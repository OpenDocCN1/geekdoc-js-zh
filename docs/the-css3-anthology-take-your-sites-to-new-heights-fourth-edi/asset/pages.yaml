  md: '# How do I define styles with CSS?


    The basic purpose of CSS is to allow the designer to define style declarations—formatting
    details such as fonts, element sizes, and colors—and then apply styles to selected
    portions of HTML pages using selectors: references to an element or group of elements
    to which the style is applied.


    Let''s look at a basic example to see how this is done. Consider the following
    HTML document:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8" />

    <title>A Simple Page</title>

    </head>

    <body>

    <h1>First Title</h1>

    <p>A paragraph of interesting content.</p>

    <h2>Second Title</h2>

    <p>A paragraph of interesting content.</p>

    <h2>Third title</h2>

    <p>A paragraph of interesting content.</p>

    </body>

    </html>

    ```


    This document contains three boldfaced headings, which have been created using
    h1 and h2 tags. Without CSS, the headings will be rendered using the browser''s
    internal stylesheet; the h1 heading will be displayed in a large font size, and
    the h2 headings will be smaller than the h1, but larger than paragraph text. The
    document that uses these default styles will be readable, if a little plain. We
    can use some simple CSS to change the look of these elements:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8" />

    <title>A Simple Page</title>

    <style>

    h1, h2 {

    font-family: "Times New Roman", Times, serif;

    ```'
  merge: -1
