  md: '# # How do I control how my background image repeats?


    # ## Solution


    To prevent the background from repeating at all, we''d use the keyword no-repeat:


    ```

    background-repeat: no-repeat;

    ```


    This means that the only background image we''d see be a single square of the
    tile in the top-left corner, as Figure 3.5 indicates.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_102_0.png)


    Figure 3.5. The tile is set to no-repeat


    If we wanted to only tile along the x axis, as shown in Figure 3.6, we could use
    the following:'
