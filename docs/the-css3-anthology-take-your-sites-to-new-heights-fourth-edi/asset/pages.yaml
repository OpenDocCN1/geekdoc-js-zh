  md: 'I have added a background-color and color using RGB color values in this case,
    although you could also use hex. I''ve also added padding to the link itself and
    set it to display: block.


    This tweak is important, because the link is an inline element and by default
    doesn''t take the full area of the li—so it''s not a easy target to click. To
    make links like block-level elements, we need to explicitly declare the value
    of the display property to block. We''ll discover more about this in later chapters;
    for now, remember that if you want to take up the full area of your container,
    it needs to be set to display: block.


    We need to add the padding to the link, not the list item; if we added to the
    list item, the padding area would be unthinkable—and we want to create an area
    where it''s easy to click the link.


    I''ve also set text-decoration to be none so as remove the underline that browsers
    apply to links, and given the link a left border, producing a double border effect
    as the li has a border.


    You should now have a navigation bar as shown in Figure 4.1. You can play around
    with this technique trying different colors and stylistic effects once you''ve
    mastered the basic idea.


    # How do I use CSS to create rollover navigation without images or JavaScript?


    Site navigation features a rollover effect: when a user holds the cursor over
    a menu button, a new button image displays, creating a highlighting effect. We
    can create this a number of ways, and we''ll look at more advanced variations
    later in the chapter. Here, however, is a very simple method.


    # Solution


    Using CSS to build your navigation makes the creation of attractive rollover effects
    far simpler than it would be if you used images. The CSS rollover is created using
    the :hover pseudo-class, which we met when discussing styling links in Chapter
    2.


    Let''s take the previous list-navigation example and add the following rule to
    create a rollover effect:'
  merge: -1
  pgno: 144
- img_proc: true
  md: "```\n.nav li a:hover {\n  background-color: rgb(144,154,181);\n  color: rgb(255,255,255);\n\
    \  border-left: 5px solid rgb(250,136,234);\n}\n```\n\nFigure 4.5 shows the effect\
    \ seen when the cursor is positioned over the first menu item.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_145_0.png)\n\
    \nFigure 4.5. The menu showing the hover state\n\n# Discussion\n\nPut simply,\
    \ I've changed the color of three rules applied to the link: background color,\
    \ color of the text, and left border. This then creates a pleasing visual effect\
    \ when the link is hovered over.\n\n> Hover Gets Broad Support\n> In modern browsers,\
    \ you can apply a :hover pseudo-class to any element like. Internet Explorer 6\
    \ and below only allow you to apply it to links."
  merge: -1
