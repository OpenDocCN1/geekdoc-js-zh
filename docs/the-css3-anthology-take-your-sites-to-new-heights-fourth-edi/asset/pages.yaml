  md: "```\nform p.helptext {\n  line-height: 1.4;\n  font-style: italic;\n}\n```\n\
    \nThe remaining CSS is simply to style the look of the form fields themselves,\
    \ and it's similar to what was used earlier in the chapter.\n\n# What should I\
    \ be aware of in terms of accessibility when creating forms?\n\nThroughout this\
    \ chapter, I've mentioned many components that are vital when creating accessible\
    \ forms, because we need to take special care to ensure our user interfaces are\
    \ accessible to all our users. In this solution, I want to highlight the most\
    \ important factors to consider, and I encourage you to keep these in mind when\
    \ creating your own form designs.\n\n# Solution\n\nThe first thing we can do to\
    \ ensure our forms are accessible is to use the correct markup. Helps those using\
    \ screen-reading software make sense of our forms.\n\nThe label element, used\
    \ in all our examples, links the text telling us what goes into a field with the\
    \ field itself. This is vital for the screen reader user, who'd-otherwise have\
    \ no idea what should be put in any given field.\n\nLabels are also helpful for\
    \ users with a regular browser, as clicking the label will focus the form field\
    \ (or make a selection in the checkbox or radio button). This can make the experience\
    \ of using a form less fiddly for a user who has trouble clicking accurately,\
    \ or for one using an inaccurate touch interface.\n\nIn longer forms, grouping\
    \ related fields using a fieldset with an appropriate legend element helps ensure\
    \ what needs to be inputted in this part of the form. The visual grouping that\
    \ can be achieved with CSS may also assist in breaking up the form so that it's\
    \ easier to understand."
  merge: -1
