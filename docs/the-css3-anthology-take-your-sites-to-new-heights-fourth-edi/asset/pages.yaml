    # How do I make an element transparent so that the background shows through?


    The use of opacity can add subtle effects to your design. Until fairly recently,
    this was difficult to do across browsers and required the use of PNG images with
    an alpha channel—a portion of data which represents transparency information on
    a perpixel basis; however, we now have ways to achieve opacity in our designs
    just using CSS.


    # Solution


    I''m going to demonstrate two possible ways to make an element transparent. The
    first is to use the opacity property. This takes a value of between 0 and 1, where
    0 is fully transparent and 1 is fully opaque:'
