  md: "# Solution\n\nIf the default spacing between the lines of text on your page\
    \ looks a little narrow, you can change it with the line-height property:\n\n\
    ```\np {\n  font: 1em Verdana, Geneva, Arial, Helvetica, sans-serif;\n  line-height:\
    \ 2.2;\n}\n```\n\nThe result is shown in Figure 2.15.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_70_0.png)\n\
    \nFigure 2.15. Adjusting the leading using line-height\n\nJust take care not to\
    \ overdo it by spacing the text out so much that it's hard to read."
  merge: -1
  pgno: 70
- img_proc: true
  md: "> You'll notice that we didn't specify any unit of measurement in this example;\
    \ that's because the value of 2.2 is a ratio. You can specify a value for line-height\
    \ using standard CSS units of measurement, such as em or pixels, but that breaks\
    \ the link between the line height and the font size for child elements. For instance,\
    \ if this example contained a span that set a large font-size, the line height\
    \ would scale proportionally and maintain the same ratio, because the line-height\
    \ of the paragraph was set to the numerical value 2.2. If, however, the line-height\
    \ was set to 2.2em or 220%, the span would inherit the actual line height instead\
    \ of the ratio and would have no effect on the line height of the span. Depending\
    \ on the effect you're going for, this may actually be a desirable result.\n\n\
    # How do I justify text?\n\nWhen you justify text, you alter the spacing between\
    \ the words so that both the left and right margins are aligned. You can create\
    \ this effect easily using CSS.\n\n# Solution\n\nYou can justify paragraph text\
    \ with the help of the text-align property, like so:\n\n```\np {\n  text-align:\
    \ justify;\n  font: 1em Verdana, Geneva, Arial, Helvetica, sans-serif;\n  line-height:\
    \ 2.2;\n}\n```"
  merge: -1
