    CSS3 selectors are incredibly useful, as we’ve already seen in earlier chapters
    of this book. If you’re relying on them in your design, though, it could look
    a little strange in older browsers lacking support.


    # Solution


    CSS3 selectors are one of the simplest aspects of CSS3 to create support for using
    JavaScript. You can do so by writing JavaScript yourself, or by writing functions
    to


