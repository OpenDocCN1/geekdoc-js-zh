  md: '# The validator complains about my vendor-specific extensions, so how do I
    validate CSS3?


    When trying out the examples in this book, or using the techniques in your own
    work, you may find that the validator displays warnings due to proprietary extensions
    used in your CSS.


    # Solution


    Vendor-specific extensions, starting with -moz, \-webkit, and so on, are not part
    of the CSS3 specification, so they''ll be unrecognized by the validator and throw
    a warning or error. The syntax of beginning an extension to CSS with a "-" is
    correct, however, so the validator understand about the existence of these extensions.
    Therefore, you can use the additional options fields at the W3C Markup Validator
    to hide these messages.


    At the CSS Validator,³⁰ seen in Figure 7.11, open the **More Options** area and
    make sure that under **Profile** you have selected **CSS level 3**. You can then
    select **No warnings** and set the **Vendor Extensions** notification to show
    up as **Warnings**. This will allow you to validate your CSS for the important
    errors. I''d advise you to also check the warnings as well, but it can be hard
    to start looking for problems if you''re swamped with hundreds of messages about
    the legitimate use of prefixed properties.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '![](img/91ffcf72aa0d1324280d9a5972b3b7e7_318_0.png)


    # Discussion


    Another point to note with regards to the Validator is that when you first validate
    your page, don''t panic if you see lots and lots of error messages. Deal with
    the first one, then validate again. Often the messages cascade from one problem,
    so fixing it will also "fix" further errors. Fix each issue, then validate, and
    see what you''re left with.


    # All Users Catered For


    This chapter has aimed to shed some light on the thorny subject of browser testing.
    It can''t be a complete guide—and the browsers and devices that we deal with are
    changing on a regular basis. My best advice is to test often, in as many browsers
    and devices as you can get your hands on.


    In the last few years we''ve seen browsers move to a more consistent rendering
    of CSS 2.1, and other than dealing with old browsers, the modern web developer
    has far fewer browser bugs to fight with. Nowadays, we need to keep up with which
    browsers support which parts of CSS3 and HTML5, and there are also the issues
    of


    Figure 7.11. Setting options on the CSS Validator'
