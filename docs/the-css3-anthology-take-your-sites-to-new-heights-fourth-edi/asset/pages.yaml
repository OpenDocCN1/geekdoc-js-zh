  md: '# Chapter 6


    # Forms and User Interfaces


    Forms are an inescapable part of web design and development. We use them to capture
    information from our users, to post information to message boards, to add items
    to shopping carts, and to update our blogs—to name a few.


    CSS gives us plenty of options with which to style our forms; however, forms are
    unlike the other HTML elements that we''ve encountered so far. Form elements—for
    example, fields, buttons, and any other input element—are included as a “replaced
    element” in the spec. Replaced elements are those whose appearance is defined
    by an external source. In the case of form elements, this is the browser or operating
    system UI. Due to this, user agents provide interface controls that best suit
    the environment they''re running in; for example, a browser on a phone may deal
    with a select list in a different way from a desktop browser. This is helpful
    in terms of usability, in that a user grows used to the control offered by the
    device they''re using; however, it can be frustrating to web designers who feel
    they should have more control over these interface elements.


    Since this book''s last edition, new form elements and attributes that are part
    of HTML5 have become included in browsers, offering their own styling opportunities'
  merge: -1
  pgno: 242
- img_proc: true
