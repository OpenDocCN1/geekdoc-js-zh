- img_proc: true
  md: 'You can use any of these keyword combinations:


    +   - top left

    - top center

    - top right

    - center left

    - center right

    - bottom left

    - bottom center

    - bottom right


    If you only specify one of the values, the other will default to center:


    ```

    background-position: top;

    ```


    This is the same as:


    ```

    background-position: top center;

    ```


    # Percentage Values


    To achieve a more accurate image placement, you can specify the values as percentages.
    This approach is particularly useful in a layout where other page elements are
    specified in percentages, so that they resize in accordance with the user''s resolution
    and dimensions. This becomes particularly important when creating responsive designs,
    as we''ll see in later chapters of this book:


    ```

    background-position: 30% 80%;

    ```


    The first of the percentages refers to the background''s horizontal position;
    the second dictates its vertical position. Percentages are taken from the top-left
    corner of the display, with 0% placing the top-left corner of the image against
    the top-left corner of the browser window, and 100% placing the bottom-right corner
    of the image against the bottom-right corner of the window.


    As with keywords, a default percentage value comes into play if you only specify
    one value. That default is 50%. Take a look at the following declaration:'
