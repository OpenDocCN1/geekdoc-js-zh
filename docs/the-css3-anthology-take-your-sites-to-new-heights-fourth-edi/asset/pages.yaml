  md: "# Percentages\n\nAs with em and fonts, font sizes that are set in percentages\
    \ will honor users' text size settings and can be resized by users:\n\n```\np\
    \ {\n  font-size: 100%;\n}\n```\n\nSetting the size of a p element to 100% will\
    \ display your text at users' default font-size settings (as will setting the\
    \ font size to 1 em). Decreasing the percentage will make the text smaller:\n\n\
    ```\np {\n  font-size: 90%;\n}\n```\n\nIncreasing the percentage will make the\
    \ text larger:\n\n```\np {\n  font-size: 150%;\n}\n```\n\n# Sizing Fonts Using\
    \ Keywords\n\nAs an alternative to numerical values to set text sizes, you can\
    \ use absolute and relative keywords.\n\n# Absolute-size Keywords\n\nWe can use\
    \ any of seven absolute-size keywords to set text size in CSS:\n\n+   - xx-small\n\
    - x-small\n- small\n- medium\n- large\n- x-large\n- xx-large"
  merge: -1
