    \ ways to get older browsers up to speed with\nt latest CSS, such using JavaScript\
    \ to add support for CSS3 selectors in older\nversions of Internet Explorer. If\
    \ you know a project you're working on will have\na large share of its users using\
    \ old versions of IE, for example, it's advisable to turn\nto that chapter to\
    \ plan your support strategy from the outset.\n\n# Vendor-specific Extensions\n\
    \nAs you move through the solutions in the next few chapters, you'll see examples\n\
    of one way that browsers are coping with the intention of CSS3. The CSS3 spe-\n\
    cification is different from earlier specifications in that it is modular. The\
    \ spec is\nbro down into modules that can each reach completion—in W3C terms this\
    \ is\nknown as a W3C Recommendation—at different times. The stages a moves\nthrough\
    \ as follows:\n\n+   1. Working Draft: the module has been published for review\
    \ by the community"
  merge: -1
