  md: "# The CSS3 Anthology\n\nInline styles have one major disadvantage: it's impossible\
    \ to reuse them. For example, if we wanted to apply the style above to another\
    \ element, we'd have to type it out again in that element's style attribute. If\
    \ the style needed changing further on, we'd have to find and edit every HTML\
    \ tag where the style was copied. Additionally, because inline styles are located\
    \ within the page's markup, it makes the code difficult to read and maintain.\n\
    \n# Embedded Styles\n\nAnother approach for applying CSS styles to your web pages\
    \ is to use the style element, as in the first example we looked at. Using this\
    \ method, you can declare any number of CSS styles by placing them between the\
    \ opening and closing style tags, as follows:\n\n```\n<style>\n  CSS styles go\
    \ in here...\n</style>\n```\n\nThe style tags are placed inside the head element,\
    \ and while it's nice and simple, the style tag has one major disadvantage: if\
    \ you want to use a particular set of styles throughout your site, you'll have\
    \ to repeat those style definitions within the style element at the top of every\
    \ one of your site's pages.\n\nA more sensible alternative is to place those definitions\
    \ in a plain text file, then link your documents to that file. This external file\
    \ is referred to as an external stylesheet.\n\n# External Stylesheets\n\nAn external\
    \ stylesheet is a file (usually given a .css filename) that contains a website's\
    \ CSS styles, keeping them separate from any one web page. Multiple pages can\
    \ link to the same .css file, and any changes you make to the style definitions\
    \ in that file will affect all the pages that link to it. This achieves the objective\
    \ of creating site-wide style definitions as mentioned previously.\n\nTo link\
    \ a document to an external stylesheet (say, styles.css), we simply place a link\
    \ element within the document's head element:\n\n```\n<link rel=\"stylesheet\"\
    \ href=\"styles.css\" />\n```"
  merge: -1
  pgno: 23
- img_proc: true
  md: "# Making a Start with CSS\n\nRemember our original example in which three headings\
    \ share a single style rule?\nLet's save that rule to an external stylesheet with\
    \ the filename styles.css, and link it to the web page like so:\n\n```\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>A\
    \ Simple Page</title>\n  <link rel=\"stylesheet\" href=\"styles.css\" />\n</head>\n\
    <body>\n<h1>First Title</h1>\n<p>A paragraph of interesting content.</p>\n<h2>Second\
    \ Title</h2>\n<p>A paragraph of interesting content.</p>\n<h2>Third title</h2>\n\
    <p>A paragraph of interesting content.</p>\n</body>\n</html>\n```\n\nThe value\
    \ of the rel attribute must be stylesheet. The rel attribute indicates the location\
    \ and name of the stylesheet file.\n\n> Not Your Type\nYou'll see the link to\
    \ the stylesheet written as: <link rel=\"stylesheet\" type=\"text/css\" href=\"\
    styles.css\" />. We've omitted the type attribute here because we're using HTML5,\
    \ along with browsers, has no requirement for it.\n\nThe linked styles.css file\
    \ contains the following style definition:\n\n```\nh1, h2 {\n  font-family: \"\
    Times New Roman\", Times, serif;\n  color: #3366cc;\n}\n```\n\nAs with an image\
    \ file, you can reuse this styles.css file in any page in which it's needed. It\
    \ will save you from retyping the styles, as well as ensure that your headings\
    \ display consistently across the entire site."
