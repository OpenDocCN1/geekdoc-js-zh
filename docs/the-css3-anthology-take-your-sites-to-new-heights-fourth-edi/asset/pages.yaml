    In this document, you can also see that the HTML5 structural elements have been
    set to display: block. This normally happens inside your stylesheet for the page.
    We''ll be covering the display property in Chapter 9 more thoroughly; but by setting
    these elements to display: block, we''re able to apply CSS to them much as we
    would a div element on our page.


    # Discussion


    The new HTML5 semantic elements offer better ways of marking up sections of your
    pages than simply using a div element. If navigation is marked up using the nav
    element, a device could indicate to the user where the navigation was on the page;
    knowing the header and footer of a document offers potential in terms of being
    able to parse and extract content for reuse.


    If you decide to take advantage of these elements, you need to be aware that any
    CSS used to style them won''t be applied by Internet Explorer 8 and below. The
    HTML5 sh JavaScript will enable these elements to be styled; however, you are
    building in a reliance on JavaScript for those of browsers.


    Depending on the traffic to your site, you can decide whether these semantic elements
    and thus requiring JavaScript is acceptable. The alternative is to continue using
    the div element to mark areas on your page (perhaps adding a class or ID using
    the HTML5 semantic element) until such time the nonsupporting browsers are enough
    of an acceptable minority for you to feel happy about switching. The decisions
    you make are likely to be different for each site depending on the site and audience.'
