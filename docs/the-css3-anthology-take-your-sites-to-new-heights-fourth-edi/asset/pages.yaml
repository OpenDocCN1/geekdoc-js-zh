  md: '# Chapter 9


    # CSS for Layout


    While writing the fourth edition of this book, it''s apparent how practical and
    usable CSS has become since the previous edition. In just under two years, we''ve
    gone from CSS3 being an attractive but hard-to-implement concept, to being able
    to put much of what it offers into practice. We now have improved ways to create
    many design effects, from shadows to rounded corners. We''re able to precisely
    target elements in our pages with CSS3 selectors, and can eliminate clutter to
    our markup when styling page elements.


    When using CSS for layout purposes


    One area that has rapidly evolved recently is in providing support for smartphones,
    tablets, and other devices—in a myriad of screen sizes—access the Web. We''ll
    spend much of this chapter exploring the area of responsive design, and how we
    can use traditional layout techniques to create designs that display neatly across
    a range of devices. Modern web design must heed the rising popularity of mobile
    browsing.'
