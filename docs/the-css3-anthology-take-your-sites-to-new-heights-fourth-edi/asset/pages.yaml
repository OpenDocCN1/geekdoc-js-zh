  md: '# CSS Positioning Basics 313


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_332_0.png)


    Figure 8.5. A single div with margins and padding applied


    If you’re applying margins and padding to a fixed-width element, they’ll be added
    to the specified width to produce the total width for that element. So, if your
    element has a width of 500 pixels, and you add 20 pixels'' worth of padding on
    all sides, you’ll make the element take up 540 pixels of total width (500 pixels
    plus 20 pixels on each side). Add 20 pixels of margin to that, and the element
    will occupy a width of 580 pixels (a visible width of 540 pixels with 20 pixels
    of spacing on either side). If you have a very precise layout, remember to calculate
    your sizes carefully, including any added margins and padding.


    # It''s Collapsing!


    You may notice strange behavior where two elements have margins and you would
    expect both margins to take effect, but you seem to end up with only one margin.
    As margins are essentially invisible, this can be really confusing! The culprit
    is **margin collapsing**, and this is part of the CSS specification.


    Essentially, if you have two margins adjacent to each other, or “touching” due
    to being a parent-child relationship between the elements, they’ll collapse, with
    only the largest margin honored. You can read an in-depth discussion of margin
    collapsing, complete with examples, in the SitePoint CSS Reference.¹


    ¹ http://reference.sitepoint.com/css/collapsingmargins'
