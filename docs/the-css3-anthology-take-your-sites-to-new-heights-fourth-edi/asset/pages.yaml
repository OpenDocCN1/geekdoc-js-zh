  md: "You can set many properties that affect the look and feel of form fields, but\
    \ it will depend on the browser and operating system as to what can actually be\
    \ applied. As replaced elements, form fields don't have to take on the CSS provided\
    \ by the author. This means that you do need to test elements very carefully across\
    \ browsers and devices. Personally, I feel that less is more when I come to styling\
    \ forms, so I tend to lend the elements as much as I can. Instead, I concentrate\
    \ on providing good help text and error messaging to make the forms as usable\
    \ as possible.\n\n# How do I highlight a field when the user tabs into or clicks\
    \ on it?\n\nIt's a nifty effect to highlight a field when it has focus and is\
    \ ready to be typed in.\n\n# Solution\n\nThe effect we can see in Figure 6.6 is\
