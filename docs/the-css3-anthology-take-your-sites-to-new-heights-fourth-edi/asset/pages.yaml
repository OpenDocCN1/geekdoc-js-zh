    \ /* 440/940 */\n}\n\n.aside {\n  width: 23.404255%; /* 220/940 */\n  float: right;\n\
    \  clear: none; /* to counteract the clearing of the previous breakpoint */\n\
    }\n\n.footer .copy {\n  width: 23.404255%; /* 220/940 */\n}\n\n.footer .vcard\
    \ {\n  width: 23.404255%; /* 220/940 */\n}\n```\n\nOur first task is to set .wrapper\
    \ to have a maximum width of 1,180 pixels. What this does is stop the layout from\
