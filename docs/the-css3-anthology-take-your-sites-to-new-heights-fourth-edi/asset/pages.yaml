  md: '# Discussion


    The transform property is one of the more fiddly properties added in the CSS specification,
    but it can be used to create great effect in your designs, I''d encourage you
    to play around with it. In addition to rotating, transform can be used to:


    +   - scale an element, making it larger or smaller than it really is

    - "translate" an element, which is moving it along the x and y axis

    - skew an element, which skews the image and makes it slant along the x and y
    axis


    These transformations come into their own when applied as a user interacts with
    the page; for example, causing an element to grow as the user moves over it using
    scale, or rotate. For more information on how to use transforms in your work,
    I recommend the article "A Primer on CSS3 Transforms" on the SitePoint website,7
    written by Louis Lazaridis, the expert reviewer of this book.


    7 http://www.sitepoint.com/a-primer-on-css3-transforms/


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_133_0.png)'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'It''s important to note that using transforms transforms the rest of the content
    will not reflow to make room for the changed element. Therefore, when using rotate,
    you need to ensure that your rotated image won''t obscure any text.


    By using vendor prefixes in the aforementioned example, you''ll find that transforms
    are supported in all modern browsers and ignored in older browsers. Here an older
    browser would simply show the image in its unrotated state.


    # # What should I be aware of in terms of accessibility when using color?


    When using color and opacity in your designs, it''s vital to keep in mind that
    not all users see color in the same way, or that some may use browsers or devices
    that don''t support all the CSS that you''ve used, and so fail to load images
    and on. By being careful when creating your CSS, you''ll ensure that all users
    can read your content, even if they''re unable to experience the full effect of
    the design.


    # # Solution


    This solution comprises a short checklist of what to think about when using color.
    I''ve already mentioned many of them while describing other solutions in this
    chapter, but it''s worth highlighting them again here in one place.


    # # Set Background Colors When Using Background Images


    If you''ve used a background image in your design underneath some text—such as
    giving a background color to a column or box—make sure you also add a background
    color. That way, if the image fails to load, the color will ensure that the text
    on top remains at a high enough contrast to be read.


    # # If You Set a Background Color, You Need to Set a Background Color, and Vice
    Versa


    In the interests of readability, color settings should always be considered in
    tandem; that is, the foreground and background colors should be chosen so that
    they contrast sufficiently. If you were to only set one color, say the background,
    and a user''s default foreground lacks contrast with your choice of color, it
    may leave your text unreachable. For example, if the user has set their background
    color to black and foreground to white, and you then set the main text color to
    black, the'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'text will seem to disappear! If you want users to be able to make their own
    choices as to colors, you should leave all colors unset—but very few web designers
    would feel able to do that!


    # Use Sensible Fallback Colors When Using RGBA as a Background or Foreground Color


    As mentioned when we discussed setting background transparency, you should ensure
    that your fallback color will cause the text to be readable if the browser is
    without support for RGBA.


    # Check Color Contrasts


    Take care of the contrast of text against background colors. For users with any
    kind of visual impairment, a low contrast between the text and the background
    can make the text very hard to read. You should also consider those users with
    color blindness who may find certain combinations of foreground and background
    difficult to distinguish. WCAG 2.0 Success Criterion 1.4.3 requires that, in general,
    text and images of text should have a contrast ratio of at least 4.5:1. To help
    you assess whether your chosen colors will pass this ratio, you can use the handy
    Luminosity Contrast Ratio Analyzer⁹ written by Ge Lemon.


    You can also test your pages using the Colorblend Web Page Filter.¹⁰ This simulates
    the different types of color blindness, giving you an idea of how your design
    might be seen by those who have some form of color blindness.


    # Backgrounds Should Only Be Decorative


    It''s so easy to use background images in CSS that we can fall into the trap of
    using them everywhere. It''s worth remembering, however, that anyone who is unable
    to load images and/or CSS will know the image exists at all if it is set as a
    background image. This is acceptable if the image is purely for visual display,
    but if it''s important to the content, it''s more appropriate to put the image
    inline with descriptive alt text; that way, users who are unable to see the image
    understand what''s and what it represents.


    8 http://www.w3.org/TR/2008/REC-WCAG20-20081211/#visual-audio-contrast-contrast


    9 http://juicystudio.com/services/luminositycontrstratio.php


    10 http://colorfilter.wickline.org/'
  merge: -1
