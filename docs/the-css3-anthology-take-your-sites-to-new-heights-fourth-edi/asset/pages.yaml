    \ rules to paste into your CSS—try the Gradient Editor.³\n\n# A Final Tip on Gradients\n\
    \nEven if you need to create images for your gradients for better browser support,\
    \ understanding CSS gradients can be really helpful while you're designing the\
    \ site. Instead of creating gradients in dedicated image-editing software, saving\
    \ a file, and then trying it out in the browser—simply change the values in your\
    \ stylesheet. You can then create the final gradients and add them in, saving\
    \ a whole lot of time!\n\n# Can I create a background image that scales with the\
    \ browser window?\n\nA popular effect is to use a full-size image in the background\
    \ of a website that scales to the size of the browser window. How is this achieved?\n\
    \n# Solution\n\nTo create scalable background images, you need to use the background-size\
    \ property with a value of cover:\n\n> chapter_03/backgroundscalable.css (excerpt)\n\
    \n```\nhtml {\n  background-image: url(ballet-background.jpg);\n  background-repeat:\
