  md: 'We can see this behavior by looking at the large feature image, **main.jpg**.
    We use the same image on all screen sizes, but it scales right down neatly fit
    our mobile layout, or up to its full size on a desktop layout.


    # Size Matters


    If you''re thinking that it''s not ideal having mobile users download images with
    large footprints, you''d be right. At the time of writing, this problem doesn''t
    have an easy solution. Responsive design is a new field, and serving responsive
    images at appropriate sizes for various viewport dimensions is something that
    is being discussed at length within the web community. Searching for the phrase
    "responsive images" should bring you the latest thinking on the issue, and there
    are helpful tools⁴ and articles⁵ popping up on the Web all time.


    If you are just using a single image, optimize the image as much as possible,
    and make sure it is no larger than it needs to be for the largest width it will
    display at. Don''t let the fact that you are using responsive images make you
    avoid resizing and optimizing your images before uploading them to your site!


    Now we can look at the rest of our layout.


    As with our recipe website, we''ll use a **mobile-first strategy**, but this time
    we''re going to employ separate stylesheets. Mobile-first means that we only load
    the stylesheets the device being used can actually utilize. Our **responsive-basic.css**
    stylesheet is the file that we expect all devices to download and use, so it contains
    all our basic formatting. It''s linked into our HTML document with a regular link
    element:


    ```

    <link rel="stylesheet" href="responsive-basic.css" />

    ```


    With this stylesheet in play, our image gallery will display in a linear fashion,
    one image below another.


    Next, let''s add a stylesheet that will be used by a browser viewport wider than
    or equal to 460 pixels:


    ⁴ http://adaptive-images.com/


    ⁵ http://www.cloudflare.com/responsive-images-part-2/'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# CSS as Layout 395


    ```

    <link rel="stylesheet" media="only screen and (min-width: 460px)" href="responsive-410.css"
    />

    ```


    The media attribute used here is just like the media query used within our CSS
    for the recipe website. In this stylesheet, we''re using a grid that is 410 pixels
    wide with six columns of 60 pixels, each with a ten-pixel gutter. The dimensions
    of this grid help us work out the percentage widths we need:


    ```

    gutter = 10px | 2.43902%

    1 = 60px | 14.63414%

    2 = 130px | 31.70731%

    3 = 200px | 48.78048%

    4 = 270px | 65.85365%

    5 = 340px | 82.96282%

    6 = 410px | 100%

    ```


    In this stylesheet, we''ll set .gallery to overflow: hidden so that it contains
    the floated elements. We can then float our gallery list items, and give each
    a percentage width of 48.78048%. We obtain this value from the three-column width
    calculation.


    # Spacing Issues


    In Chapter 8, we looked at a gallery example that used display: inline-block for
    layout purposes. Ideally, we would use that here, but inline-block preserves whitespace
    and creates gaps between elements, unfortunately. Counteracting this can be problematic;
    spacing can be inconsistent between browsers, so where the calculations are vital
    (as in this layout), I''ve reverted to using floats.


    If you remove all the whitespace between the 11 elements—example, if you''re generating
    content from a server-side script and can ensure the script outputs no whitespace—you
    would be safe to replace the float here with inline-block.


    As you will discover, CSS development tends to involve a range of compromises,
    and it pays to have a few tricks up your sleeve when deciding what works best
    in each circumstance.


    We also add a left and bottom margin of 2.43902%, the calculation we arrived at
    in evaluating gutters of 10 pixels:'
