  md: '# Chapter 7


    # Cross-browser Techniques


    At the time of writing this current edition of The CSS Anthology, we’re in an
    exciting period of web design and development. The latest versions of browsers
    have great support for CSS, including much of CSS3. The majority of techniques
    shown so far in this book will work in the most current versions of desktop browsers
    and most mobile browsers. Browser manufacturers are working to faster release
    schedules and implementing new parts of CSS3 far more swiftly than a few years
    ago, which means that we can start experimenting with new features quicker.


    With modern browsers, we’re dealing less frequently with browser bugs that we
    were in the past. Our issues now tend to center on whether or not browser supports
    a certain feature. However, in the real world there are clients using older browsers
    containing significant bugs, as well as a complete lack of support for CSS3. A
    question we all need to ask is: how should we balance using CSS3 to create modern
    web designs with supporting these older browsers?


    This chapter outlines how to create a browser support policy for each site that
    we work on, and demonstrates how to provide good experiences for users of older
    browsers. We’ll also cover some testing tips, as well as details of some of the
    main'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'bugs that come with very old versions of Internet Explorer, so that if you
    come across them, you''re able to fix them quickly.


    # In which browsers should I test my sites?


    When I started working in web development, we talked about testing in “both browsers”—that
    was Internet Explorer and Netscape. Today, we''re faced with a large number of
    browsers and rendering engines.


    # Solution


    The answer is to be able to test your sites in as many browsers as you can. The
    types of browsers that you''re able to install will depend on the operating systems
    to which you have access. At the very least, you should test in Internet Explorer
    6, 7, 8, and 9, as well as the latest versions of Firefox, Opera, Safari, and
    Chrome. Additionally, if you''re not providing a different experience for mobile
    users, it''s worth checking how the site behaves on the iPhone, iPad, and other
    mobile devices, making sure that everything is usable via a touch interface.


    That''s not to say that the site should look identical in all of these browsers.
    The experience for an IE6 user could be very different from an IE9 user—but you
    should aim to have the content accessible and the site usable.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_287_0.png)


    > ### In the Engine Room

    You have come across the term browser rendering engine. If we conceive of the
    browser as the complete software package, including the application interface
    and features, the browser rendering engine is the part that interprets the HTML
    and CSS, rendering the web pages for you to view and interact. Some engines are
    separate software products that are used by more than one browser. For example,
    the Gecko engine developed by the Mozilla Foundation is used by Firefox, as well
    as Camel and the last versions of Netscape Navigator, among others. The WebKit
    engine powers Safari and Chrome, and was originally derived from the KHTML engine
    that powers the Conquer web browser on Linux. WebKit is also particularly interesting
    as it is the rendering engine behind mobile Safari (used on iPhones and iPads)
    and also browsers for Android and modern Blackberry devices.


    You may be thinking that if two browsers use the same rendering engine, you only
    need to test in one. While true to a certain extent, there can still be differences,'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Cross-browser Techniques 269


    especially across versions and operating systems. Some browsers, like Internet
    Explorer and Opera, use their own internal engines.


    # # Can I just ignore older browsers?


    With the latest versions of browsers having good support for many of the interesting
    CSS3 properties, and far fewer browser bugs than we have seen in the past, it
    is tempting to consider dropping support completely for old versions of Internet
    Explorer. How do we decide which browsers to support, and what level of support
    to provide them?


    # # Solution


    When starting work on a new site, you should first consider the kind of person
    who will be using the site, as well as the likely browsers and devices they''ll
    be using. If you are redesigning a website, you''re in luck! There should be some
    existing information in the web statistics as which browsers are being used.


    Even if it is a brand new site, you should be able to draw some conclusions based
    on the audience. For example, many really old Internet Explorer browsers (IE6
    and 7) can be found in large companies in the UK where it require for legacy internal
    products. If your site is aimed at these users, you may find that you need to
    provide more support for these old browsers. If your site is aimed at young people,
    or is particularly useful to people on the go, you might have more mobile devices
    than average browsing the site.


    You might also have other sites, for which you have access to statistics, that
    serve a similar audience. There are also a number of sites that publish statistics,
    such as StatCounter.¹ offers an analytics service, collating the data from all
    the sites that run its service to provide some idea of browser and version trends.


    By looking at the browsers and devices that your users most frequently employ,
    you can put together a browser support policy for your site. This can outline
    the browsers that you test in, and the level of support you offer in terms of
    the design.


    ¹ http://gs.statcounter.com'
  merge: -1
  pgno: 288
