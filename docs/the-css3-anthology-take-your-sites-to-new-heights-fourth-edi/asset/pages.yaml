    Figure 2.12. The default heading and paragraph spacing in Safari


    # Solution


    To remove all space between a heading and the paragraph that follows it, you must
    remove the bottom margin from the heading as well as the top margin from the paragraph.
    In modern browsers—including Internet Explorer 7 and above—we can do this with
    CSS using an adjacent selector. To achieve the same effect in older browsers,
    however, we need to revert to other techniques that are better supported.


    # Using an Adjacent Selector


    An adjacent selector lets you target an element that follows another element,
    as long as both share the parent. In fact, you can use adjacent selectors to specify
    an element that follows several others instead of just one. The element to which
    the style is applied is always the last element in the chain. If you''re confused,
    be assured that this concept will be clearer once you''ve seen it in action.


    The following style rules remove the top margin from any paragraph that immediately
    follows a level-one heading. Note that the top margin is actually removed from
    the paragraph that follows the h1, rather than the level-one heading itself:'
  merge: -1
  pgno: 66
