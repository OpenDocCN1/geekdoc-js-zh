  md: "# Tabular Data 209\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_228_0.png)\n\
    \nFigure 5.17. After styling the calendar cells, it's starting to look more like\
    \ a desktop calendar\n\nWe can now style the list of events within each table\
    \ cell, removing the bullet and adding space between list items:\n\n```\nchapter_05/cal.css\
    \ (excerpt)\n\n.clmonth ul {\n  list-style-type: none;\n  margin: 0;\n  padding-left:\
    \ 1em;\n  padding-right: 0.6em;\n}\n\n.clmonth li {\n  margin-bottom: 1em;\n}\n\
    ```\n\nFinally, we add styles for the previous and next classes, giving the effect\
    \ of graying out the days not part of the current month. We also style the active\
    \ class, which highlights those days on which events take place:"
  merge: -1
