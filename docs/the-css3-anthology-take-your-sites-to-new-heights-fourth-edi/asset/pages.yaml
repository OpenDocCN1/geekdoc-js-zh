    Figure 9.24. Our fixed-width layout in Internet Explorer 8


    # # Discussion


    The CSS for this solution should look fairly straightforward. Remember that Internet
    Explorer versions lower than IE9 receive no positioning information from your
    media query-linked stylesheets, so you need to add all the rules that you want
    applied in your IE-only stylesheet.


    Here, we have the fixed width of .wrapper to 940 pixels, and then set the widths
    of other elements in pixels too—just as we would have done we were creating a
    fixed-width layout from the outset.


    Another issue we can take care of in this stylesheet is to compensate for Internet
    Explorer not supporting the nth-child selector prior to IE9. Instead of using
    nth-child to remove the left margin on list elements as they wrap around each
    row with the browser''s resizing, we can use an old trick: setting a negative
    left margin on'
  merge: -1
  pgno: 423
- img_proc: true
  md: "# CSS for Layout 405\n\n.gallery, and then ignoring the extra left margin on\
    \ each .gallery li. These left margins will be countered by the negative margin\
    \ set on the gallery itself:\n\n> chapter_09/responsive-ie-old.css (excerpt)\n\
    \n```\n.gallery {\n  overflow: hidden;\n  clear: both;\n  width: 960px;\n  margin-left:\
    \ -20px;\n}\n\n.gallery li {\n  float: left;\n  width: 220px;\n  margin: 0 0 20px\
    \ 20px;\n}\n```\n\nWe also set widths and heights on images, as there's no need\
    \ for them to respond to changing column widths. If you go back as far as IE6,\
    \ you'll find that max-width has no support, so the images will display at their\
    \ largest size.\n\nIf you're going to polyfill Internet Explorer's lack of support\
    \ for media queries, you'd do well to read Ethan Marcotte's article on fluid images,7\
    \ which includes some tips for working old versions of IE.\n\n# Leave IE till\
    \ Last\n\nI usually create my-IE stylesheets right at the end of development.\
    \ That way, I can just copy into the rules that are needed from the other stylesheets,\
    \ rather than constantly adding them throughout the development process.\n\nWhether\
    \ you try to polyfill media queries or just serve older browsers a fixed-width\
    \ stylesheet is up to you. As always, check what browsers visitors to your site\
    \ are using and formulate a browser support policy based on that.\n\n7 http://unstoppablerbotninja.com/entry/fluid-images/"
  merge: -1
