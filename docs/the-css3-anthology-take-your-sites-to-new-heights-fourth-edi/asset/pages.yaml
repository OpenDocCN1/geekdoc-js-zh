  md: '# About Rachel Andrew


    Rachel Andrew is a front- and back-end web developer who has written numerous
    books, including the first three editions of The CSS Anthology. Her work in her
    company edgeofmyseat.com (http://www.edgeofmyseat.com/) informs her writing, ensuring
    it remains grounded in the real world of client projects, large and small.


    # About Louis Lazaris


    Louis Lazaris is a freelance web designer and front-end developer based in Toronto,
    Canada who has been involved in the web design industry since 2000. Louis has
    been working on websites ever since the days when table layouts and one-pixel
    GIFs dominated the industry. Over the past five years, he has come to embrace
    web standards while endeavoring to promote best practices that help developers
    and their clients reach practical goals for their projects. Louis writes regularly
    for a number of top web design blogs including his own site, Impressive Webs (http://www.impressivewebs.com/).


