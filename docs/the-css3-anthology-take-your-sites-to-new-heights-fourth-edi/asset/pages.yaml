  md: '# Text Styling and Other Basics 75


    Web Fonts from Fonts.com¹¹⁰


    These services host the fonts in a secure way; you sign up for an account, and
    can then use the fonts on your website by loading them from the remote server.
    Typically, they have a tool that allows you to generate the code required for
    your site. Each service works in a slightly different way, but getting up and
    running with a font usually involves selecting it on the service and pasting some
    code into your site. You can then use the fonts as normal in your CSS.


