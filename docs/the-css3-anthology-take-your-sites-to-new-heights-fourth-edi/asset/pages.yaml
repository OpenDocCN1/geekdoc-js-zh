    # And If All Else False


    The above tips should fix the worst problems, but you may still be left with slight
    alignment, margin, or padding issues. At this point remind yourself that you''re
    dealing with old, buggy browsers, so you should feel quite at liberty in your
    IE6 and IE7-specific stylesheets to manipulate elements by adjusting the margin,
    padding, or positioning until it works. This will have no effect on any other
    browser if you''ve used conditional comments, so no harm is done. It''s to be
    hoped there''s little to do, because it will need to be redone the layout ever
    changes. Sometimes, with a very complex layout, you need to just jam hammers into
    place!


    # How do I style HTML5 semantic elements that are unsupported in older browsers?


    HTML5 brings us new elements for marking up sections of our pages; however, these
    problems in older browsers prohibit CSS from being applied to them.


    # Solution


    Internet Explorer below version 9 won''t recognize the new HTML5 elements, and
    will not apply CSS to them that fails to recognize. If you want to use these elements,
    you can add the HTML5 shim¹⁰ to your document as documented in this boilerplate
    document from HTML5 Doctor:¹¹


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8" />

    <title>HTML 5 complete</title>

    <!--[lte IE 8] -->

    <script src="http://html5shim.googlecode.com/svn/trunk/html5.js"></script>

    <!--[endif]-->

    ```


    > ¹⁰ See http://ejohn.org/blog/html5-shim/ for an explanation of this tool.


    > ¹¹ http://html5doctor.com/html-5-boilerplates/'
