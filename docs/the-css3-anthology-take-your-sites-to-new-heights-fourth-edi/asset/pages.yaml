  md: '# What is the future of CSS layouts?


    At the beginning of this chapter, I mentioned that there have been fewer practical,
    usable advances for CSS layouts than we''ve seen in other parts of the specification.
    However, this is about to change, and I hope that by the time the fifth edition
    of this book comes out, we''ll have the browser support to really take advantage
    of these new features.


    So, just as a quick glance into the future, and to give you some extras to play
    with your own time to keep your skills up to date, let''s have a look at the tools
    we hope to be able to use soon.


    # CSS3 Grid Layout


    The CSS3 Grid Layout is currently a W3C Working Draft and at the time of writing
    it is implemented in Internet Explorer 10 Developer Preview, with an -ms prefix.
    What''s exciting about Grid Layout is that it will enable the start of control
    you have when laying a site out tables, but is not tied to source-ordered content—that
    is, placing your most important content at the beginning of your HTML document.
    This would be incredibly useful for responsive design.


    Currently, when creating a complex responsive design we have to think very carefully
    about the order of the HTML source. We want it to be able to collapse to one column
    in a usable way if necessary, but still enable us to float the columns into the
    right position for multicolumn layouts.


    There''s an alternate proposal for Grid Layout in the CSS Template Layout Module.
    This is also currently in Working Draft, but with no browser implementation at
    present.


    # Flexible Box Layout Module


    Also in Working Draft is the Flexible Box Layout Module, another potentially useful
    module when working with responsive designs.


    8 http://www.w3.org/TR/css3-grid-layout/

    9 http://www.w3.org/TR/css3-layout/

    10 http://www.w3.org/TR/2009/WD-css3-flexbox-20090723/'
  merge: -1
  pgno: 425
- img_proc: true
  md: 'CSS for Layout 407


    Currently, we have no way of vertically centering elements, or placing a set of
    elements inside a box and using CSS to say “spread these items out evenly.” These
    are problems that the Flexible Box Layout Module should solve. Where Grid Layout
    should solve our full-page layout problems, flexible boxes will solve many of
    the small issues we have with our layouts.


    Support is reasonably good for flexible boxes; it''s included in IE10 Preview,
    and Firefox and Chrome have implemented in recent releases. There''s also a polyfill
    called flexie.js,¹¹ which provides cross-browser support for the module, and the
    developers of flexie.js have created a Flexbox Playground¹² for you to experiment
    inside, as in Figure 9.25.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_426_0.png)


    Figure 9.25. The Flexbox Playground


    # CSS Multicolumn Layout Module


    Another module with reasonable cross-browser support is CSS3 Multicolumn Layout
    Module.¹³ This module is at Candidate Recommendation stage, the next stage from
    Working Draft. With the exception of Internet Explorer, it''s implemented in


    ¹¹ http://flexie.com


    ¹² http://flexie.js/playground/


    ¹³ http://www.w3.org/TR/css3-multicol/'
  merge: -1
  pgno: 426
- img_proc: true
  md: "current browsers, and is also part of IE10 Developer Preview, so we can assume\
    \ it will make it into Internet Explorer 10.\n\nMulticolumn layouts will enable\
    \ us to create newspaper-style columns of equal measurements by adding a column-count\
    \ property to the containing element:\n\n```\n.article {\n  column-count: 3;\n\
    }\n```\n\nThere are also properties for controlling the width of columns, setting\
    \ points where you want content to break, and balancing columns so that they all\
    \ end up the same length.\n\nOnce Internet Explorer 10 is released—which will\
    \ mean that all current browsers provide support for much that's included in the\
    \ above modules—I expect we will see more and more examples of developers using\
    \ these new CSS layout properties. The future of CSS layouts is very exciting,\
    \ and these modules mean that we'll have to make fewer compromises when designing\
    \ and developing CSS layouts than we do present.\n\n# A Design for Life\n\nIn\
    \ this chapter, we've seen how to use the fundamental building blocks of CSS layout\
    \ to create responsive designs for all web, regardless of what device they're\
    \ using. More complex designs use the same techniques to structure the different\
    \ components of a layout. When you tackle any design, to break it down into its\
    \ component parts—the main layout structure and the elements inside—and then approach\
    \ their positioning in the simplest possible way.\n\nYou'll sometimes need to\
    \ make compromises with the thorny issues of browser support, but as we've seen,\
    \ CSS for layout is improving all the time. Browsers now support the older tools\
    \ of our trade more constantly—such as floats and positioning—with support arriving\
    \ for new and exciting CSS3 modules.\n\nThis is an exciting time to be a web designer\
    \ or developer! Whether you're reading this book as a newcomer to CSS, or as an\
    \ old hand refreshing your skills, I hope you continue to experiment and build\
    \ on the tips and tricks we've studied together."
