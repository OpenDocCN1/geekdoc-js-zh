    # Discussion


    Understanding the display property is important because it explains why certain
    CSS rules will appear to work on one element and not on another. Knowing whether
    an item is set to inline or block (and that you can change this) also means that
    you''re aware of it''s necessary to set widths or other properties on an element,
    and when you can simply let it take up the room it requires.


    # Inline Elements


    An element set to display inline will only take up the space it needs. In our
    previous example, the default display of a element is to remain inline with the
    text. It won''t force a line break and the background color is simply behind the
    element self—it does not extend out further than this. In addition, inline elements:


    +   - ignore top and bottom margins if applied'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 306 The CSS3 Anthology


    +   - disregard height and width properties

    - can be affected by the vertical-align property


    An inline element will become block-level if you set the display property to block,
    or if you float the element. Floated elements automatically become block-level
    and so height, width, and all margins will start to take effect.


    # Block-level Elements


    Block-level elements will force a line break and drop to the next line in your
    document (unless a float is in above the element—see the section called "How do
    I stop the next item floating once you''ve floated an element?" on float and clear
    for more information). They expand to fill the parent element unless a width has
    been given to them. In addition, block-level elements:


    +   - respect all margin and padding properties

    - expand in height to fit everything they contain; therefore, a div will expand
    to contain any amount of text and images as the text and images are not positioned
    or floated, as we will see later in this chapter

    - are not affected by vertical-align


    # In-block Elements


    While discussing block and inline elements, it''s worth noting another value for
    the display property: inline-block. If you set an element to display: inline-block,
    it will behave like a block-level element in terms of respecting all margins,
    padding, height, and width; however, it will not force a line break. Note that
    inlineblock has no support in Internet Explorer 6 and 7.


    # How do margins and padding work in CSS?


    What''s the difference between the margin and padding properties, and how do they
    affect elements?


    # Solution


    The margin properties add space to the outside of an element. You can set margins
    individually:'
