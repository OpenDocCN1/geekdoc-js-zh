    # # Discussion


    Forms displayed in this way can seem more friendly than the alternative. In the
    case of the health insurance company example, it seems less imposing answering
    a few questions asked as a sentence instead of a more formal-looking application.


    In the markup I''ve ensured that the label element is wrapped around text that
    explains what''s required to complete the field. Therefore, each field has an
    associated label:


