  md: '# Relative Positioning


    Setting position: relative as in our example will have no effect on the wrapper
    than to cause it to become a positioning context for the items inside it. If you
    set top, left, bottom, or right values on an element that is set to position:
    relative, the item will shift from its original position by those pixels. This
    can be useful to shift an item small distance from the position it ends up in
    way of the document flow, but it cause elements to overlap.


    # How do I center a layout on the page?


    A common page layout has the main content area of the page as a fixed or flexible
    width box centered in the browser window. How do we achieve this centering?


    # Solution


    Figure 8.14 shows a centered box. It''s done by setting the left and right margins
    on the div with a class of wrapper to a value of auto.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_345_0.png)


    Figure 8.14. Centering a box


