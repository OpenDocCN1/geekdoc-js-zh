  md: '# Forms and User Interfaces 237


    You can see that the value of the placeholder attribute—name@example.com, an example
    of a valid email address in Figure 6.7—is inside the form field on load of the
    form. Otherwise, the form looks much the the same.


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_256_0.png)


    Figure 6.7. The form after adding an input field with a type of email


    In a supporting browser, however, if you try and submit the form without completing
    the fields, or if you enter something other than an email address in the email
    field, you''ll receive a validation error message, as shown in Figure 6.8 below.
    This all happens through the browser with no JavaScript required.'
