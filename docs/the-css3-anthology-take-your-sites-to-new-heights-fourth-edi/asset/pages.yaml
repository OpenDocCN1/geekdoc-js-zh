    \ the previous definitions. We'll find out why that's the case later in this chapter,\
    \ when we discuss the cascade.\n\n# First Child\n\nThe first-child pseudo-class\
    \ selector targets element when it's the first child of a parent element. As with\
    \ all these selectors, it's easier to understand when you can see an example.\n\
    \nWithin your document is a set of paragraphs. These are contained inside a div\
