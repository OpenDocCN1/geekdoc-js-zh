  md: 'Overall, the page content is perfectly accessible and looks good in all the
    browsers; however, where the very old browsers are concerned, we lose some of
    the finer detail.


    # Discussion


    This approach is a simple example of **progressive enhancement, we’ve** Essentially
    our IE6 layout has all the bases in place. By using CSS, we’ve added detail that’s
    unsupported in the older browsers, those browsers still display a basic, readable
    experience. This concept of progressive enhancement is crucial to robust front-end
    development. You start for the browsers that have little support, and layer in
    CSS properties, JavaScript, and other enhancements for the most capable browsers.
    Everyone has a decent experience, and with newer, more capable devices gain all
    the additional finse of a modern user interface.


    For very complex layouts that rely heavily on new CSS features and have very little
    traffic from browsers such as IE6, you may wish to take this approach step further
    and serve a very simple stylesheet to IE6. Andy Clark has popularized this approach,
    and his Universal IE6 Stylesheet is available on Google Code.³


    My advice is not to ignore older browsers while we still see some traffic from
    them; however, it’s appropriate with these problematic browsers to serve something
    different. Keep your content accessible, but there’s no need to try to replicate
    the modern web experience for ten-year-old browsers.


