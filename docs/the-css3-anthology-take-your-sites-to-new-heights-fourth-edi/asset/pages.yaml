  md: "# The CSS3 Anthology\n\nthe on-screen environment, when print applications\
    \ are provided with a pixel measurement, they'll simply try to guess the size\
    \ at which the font should appear on paper—erratic results.\n\n# Ems\n\nThe em\
    \ is a relative font measurement. The name em comes from the typographical world,\
    \ where it relates to the size of the capital letter M, usually the widest character\
    \ in a font. In CSS, 1em seems to be equal to the user's default font size, or\
    \ the size of the parent element when it's set to a value other than the default.\n\
    \nIf you use ems (or any other relative unit) to set your font sizes, users will\
    \ be able to resize the text in all browsers. For IE6 users are unable to resize\
    \ text in pixels, and have no other zoom control.\n\nEm values can be set using\
    \ decimal numbers. For example, to display text at a size 10% smaller than the\
    \ user's default (or the font size of its parent element), you could use this\
    \ rule:\n\n```\np {\n  font-size: 0.9em;\n}\n```\n\nTo display the text 10% larger\
    \ than the default or inherited size, you would use this rule:\n\n```\np {\n \
    \ font-size: 1.1em;\n}\n```\n\n# Exes\n\nThe ex is a relative unit measurement\
    \ that corresponds to the height of the lowercase x in the default font size.\
    \ In theory, if you set the font size of text to 1ex, the uppercase letters will\
    \ display at the height at which the lowercase x would have appeared if the font\
    \ size had been unspecified. Furthermore, the lowercase letters will be sized\
    \ relative to those uppercase letters.\n\nHistorically, browsers lacked support\
    \ for the typographical features needed to determine the precise size of an ex,\
    \ making a rough guess for this measurement. For this reason, exes are rarely\
    \ used at the time of writing."
  merge: -1
