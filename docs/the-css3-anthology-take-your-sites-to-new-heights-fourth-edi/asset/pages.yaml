  md: "![](img/91ffcf72aa0d1324280d9a5972b3b7e7_53_0.png)\n\n# # Discussion\n\nIn\
    \ addition to underline and none, there are other values for text-decoration that\
    \ you can try out:\n\n+   - overline\n- line-through\n- blink\n\nIt is possible\
    \ to combine these values. For instance, should you wish to have an underline\
    \ and overline on a particular link—as illustrated in Figure 2.4—you’d use this\
    \ style rule:\n\n```\ncss\na:link, a:visited {\n  text-decoration: underline overline;\n\
    }\n```"
