  md: "# Combining the Two Approaches\n\nAs described by Chris Coyier in the article\
    \ “Speed Up with CSS Gradients.”^2 it is possible to combine the use of CSS gradients\
    \ and a fallback image. Simply load the image first, then add the gradients—essentially\
    \ combining the two techniques outlined:\n\n```\nhtml {\n  height: 100%;\n}\n\n\
    body {\n  height: 100%;\n  background-attachment: fixed;\n  background-color:\
    \ #666;\n  background-image: url(gradient.png);\n  background-repeat: repeat-x;\n\
    \  background-image: -webkit-gradient(linear, 0% 0%, 100%, from(#000), to(#666));\n\
    \  background-image: -moz-linear-gradient(top, #000, #666);\n  background-image:\
    \ -ms-linear-gradient(top, #000, #666);\n  background-image: -o-linear-gradient(top,\
    \ #000, #666);\n  background-image: linear-gradient(top, #000, #666);\n  color:\
    \ #fff;\n  margin: 0;\n  padding: 0;\n  font: 0.75em/1.3 \"Lucida Grande\", \"\
    Lucida Sans Unicode\", \"Lucida Sans\", Verdana, Tahoma, sans-serif;\n}\n```\n\
    \nBecause supporting browsers won’t load the fallback image, this enables browsers\
    \ that do support CSS3 gradients to avoid the overhead of downloading an image.\
    \ This will be particularly advantageous if you use many gradients in your site,\
    \ and you’ll gain the added benefit of being able to set these values as a percentage,\
    \ as well as easily change the colors and settings.\n\n> ^2 http://css-tricks.com/5700-css3-gradients/"
  merge: -1
  pgno: 115
- img_proc: true
  md: "# Images and Other Design Elements\n\nThis has been a simple introduction to\
