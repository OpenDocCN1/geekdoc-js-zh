  md: "# Images and Other Design Elements 85\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_104_0.png)\n\
    \n# Baked Garlic\n\nGarlic may be known for being a bit stinky, but baked it is\
    \ absolutely delicious and as long as you feed it to all of your guests no-one\
    \ will complain about the smell! Once baked garlic becomes savoury and sweet making\
    \ an ideal spread to accompany cheese.\n\nTo make your baked garlic, you will\
    \ need:\n\n+   - Whole heads of garlic\n- Salt\n- Olive Oil\n- Foil\n\n# Instructions\n\
    \n+   1. Cut the tops and bottoms off the garlic heads with a sharp knife, keeping\
    \ the head intact, then strip the tips of the cloves so you can see the garlic\
    \ inside.\n2. In a large oven use foil as a 'nest' large enough to hold all of\
    \ your garlic, if you are doing a lot of garlic you could put into several vessels.\n\
    3. Add few tablespoons of water to the nest then add the garlic heads.\n4. Pour\
    \ over a tablespoon of olive oil per garlic, seasoning with salt and tightly wrap\
    \ the top of the foil to seal it.\n5. Bake for 30 minutes at 200C, open the nest\
    \ and bake the garlic in the juices, then cover and bake for another 10 minutes.\n\
    6. Enjoy!\n\nFigure 3.7. The images tile along the y axis\n\n# How do I position\
    \ my background image?\n\nBy default, if you add a single, non-repeating background\
    \ image to the page, it will appear in the top-left corner of the viewport. If\
    \ you've set the background to fill in any direction, the first image will appear\
    \ in this location and tile from that point. However, it's possible to display\
    \ the image at other locations on the page.\n\n# Solution\n\nWe use the CSS property\
    \ background-position to position background images:\n\n```\n.box {\n  height:\
    \ 200px;\n  width: 200px;\n  border: 3px solid #333;\n  background-image: url(gear.png);\n\
    }\n```"
