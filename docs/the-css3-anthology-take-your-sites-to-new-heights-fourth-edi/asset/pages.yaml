    # Discussion


    By experimenting with CSS borders on your tables, you can create many appealing
    effects—even if the data contained within is dull! You can use differently colored
    borders for table headings and table cells, and apply various thicknesses and
    styles of border to table cells. You might even try such tricks as using one for
    top and left borders, and another for bottom and right borders, to create an indented
    effect.


    We can apply a range of values to the CSS border-style property. We''ve already
    met solid, which displays a solid line as the border, and this is shown along
    with the other available options in Figure 5.5.'
