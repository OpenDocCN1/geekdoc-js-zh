    most recent version of Internet Explorer, and they''re particularly problematic;
    however, it''s only possible to run one version of Internet Explorer on a Windows
    machine at a time. So what''s the best way to test multiple Internet Explorer
    browser versions?


    # Solution


    In my experience, the best way to test Internet Explorer is to use a proper version
    of Internet Explorer in a virtual machine. The free virtualization software, Virtual-Box,¹¹⁶
    is very capable when used for this purpose.


    You need a reasonable amount of disk space and memory to run virtual machines—especially
    if you have several open at once. This is a problem for you, Utili IE Collection¹⁷
    may be helpful; it installs a collection of standalone versions of Internet Explorer.
    I would suggest doing inside a virtual machine even if you are a Windows user,
    to avoid creating any issues with your primary Internet Explorer browser.


    # Discussion


    There are simpler solutions for Internet Explorer testing. Internet Explorer itself,
    in recent versions, has a method for rendering pages as if it''s an earlier version.
    In Explorer 9 Developer Tools, you can switch browser mode and view a page as
    if using the earlier browser. While this works reasonably well, in some cases
    what you see in browser mode IE9 is different from the real browser, and browser
    mode itself may have its own quirks not present in the original browser. So it
    might be good for a quick look during development, but I''d always suggest proper
    testing in the real browser.


    There are also multiple IE testing tools such as IET,¹⁸ however, in my experience
    these are unreliable. In particular, conditional comments are often ignored (so
    a stylesheet or script file targeted by this browser may be bypassed). I''ve spent


