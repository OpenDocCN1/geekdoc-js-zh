    row\">Total</th>\n<td>58,460</td>\n<td>57,859</td>\n<td>58,110</td>\n<td>60,700</td>\n\
    </tr>\n</table>\n\n# # Discussion\n\nThis markup creates a table that uses elements\
    \ and attributes to clearly explain the contents of each cell. Let's discuss the\
    \ value that each of these elements and attributes adds.\n\n# # The caption element\n\
    \n```\n```\n<caption>\nYearly Income 2008 - 2011\n</caption>\n```\n```\n\nThe\
    \ caption element adds a caption to the table. By default, browsers generally\
    \ display the caption above the table; however, you can manually set the position\
    \ of the caption in relation to the table using the caption-side CSS property.\n\
    \n```\n```\ntable {\n  caption-side: bottom;\n}\n```\n```\n\nWhy might you want\
    \ to use a caption instead of just adding a heading or paragraph text for display\
    \ with the table? By using caption, you can ensure that the text is tied to the\
    \ table, and that it's recognized as the table's caption; there's no chance that\
    \ the screen reader could interpret it as a separate element. If you want your\
    \ table captions to display as paragraph text or level-three headings in a graphical\
    \ browser,"
  merge: -1
  pgno: 198
- img_proc: true
  md: '# The CSS Anthology


    no problem! You can create CSS rules for captions just as you would for any other
    \element.


    # The th element


    ```

    <th scope="col">2011</th>

    ```


    The th element identifies data''s a row or column heading. The example markup
    contains both row and column headings and, to ensure that this is clear, we use
    the scope attribute of the th tag. The scope attribute shows whether a given heading
    is applied to the column (col) or row (row).


    Before you begin to style your tables to complement the look and feel of the site,
    it is good practice to ensure the accessibility of those tables to users such
    as screen readers. Accessibility is one of concerns that many developers brush
    off, saying,"I''ll check it when I''m finished." But if you leave accessibility
    checks until the end of development, you may never deal with them; the problems
    they identify may require time-consuming fixes, particularly in complex applications.
    Once you make a habit of keeping accessibility in mind as you design, you''ll
    find that it becomes second nature and adds very little to a project''s development
    time.


    CSS attributes make the styling of data tables simple and quick. For instance,
    I begin a new site on which I know I''ll have to use a lot of data tables, I create
    a style with the class selector .datatables; this contains the basic styles I
    want to affect all data tables, and can easily be applied to the table tag of
    each. We create style rules for .datatables th (the heading cells), .datatables
    td (the regular cells), and .datatable caption (the table captions).


    From that point, adding a new table is easy. The styles are there—I just need
    to apply the datatable class. If I decide to change the styles I''ve created after
    the tables in my site, I simply edit my stylesheet.


    # How do I add a border to a table?


    You can add borders to tables just as you can with other HTML elements. Borders
    are particularly useful for tables, as they help to make the data understandable:'
