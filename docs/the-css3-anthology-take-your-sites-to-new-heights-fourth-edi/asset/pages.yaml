  md: "# How do I display two different styles of link on one page?\n\nThe previous\
    \ solution explained how to style the different selectors of the anchor element,\
    \ but what if you want to use different link styles within the same document?\
    \ Perhaps you want to display links without underlines in your navigation menu,\
    \ make sure that links within the body content are easily identifiable. Or maybe\
    \ part of your document has a dark background color, so you need to use a lighter\
    \ colored link style there.\n\n# Solution\n\nTo demonstrate how to create multiple\
    \ styles for links displayed on one page, let's take an example in what we've\
    \ already styled the regular\n\n```\nchapter_02/linktypes.css (excerpt)\n\na:link,\
    \ a:visited {\n  text-decoration: underline;\n  color: #65ACD;\n  background-color:\
    \ transparent;\n}\n\na:hover, a:active {\n  text-decoration: underline outline;\n\
    \  color: #191970;\n  background-color: #C9C3ED;\n}\n```\n\nThese should be taken\
    \ as the default link styles: they reflect the way links will normally be styled\
    \ within your documents. The first rule makes the link blue, so if an area of\
    \ our page has a blue background, the links that appear in that space will be\
    \ unreachable. We need to create a second set of styles for links in that area.\n\
    \nFirst, let's create a class or an id for the element that will contain the differently\
    \ colored links. If the container is already styled with CSS, it may already have\
    \ a class or id that we can use. Suppose our document contains the following markup:"
