    \n# # How should I style a sitemap?\n\nA sitemap is a helpful page on your website\
    \ that lists all pages in the site. It can help those who are unable to find what\
    \ they're looking for in the navigation, as well provide a quick way to see what's\
    \ available and go to it with one click.\n\n# ## Solution\n\nA sitemap is really\
    \ a list of all the destinations on your site, so it's ideally marked up as a\
    \ set of nested lists. The first list is your main navigation, with the internal\
    \ navigation nested within each main navigation point. A list works if your site\
    \ structure has many levels and should be easy to generate from a content management\
    \ system. Figure 4.21 displays the results of the following code:"
