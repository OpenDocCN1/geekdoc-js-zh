  md: '# The CSS3 Anthology


    There is a handy article on the SitePoint website that describes some common font
    stacks, and these would be a good starting point if you are just beginning to
    explore web typography.¹


    # Should I use pixels, points, ems, or another unit identifier to set font sizes?


    You can size text in CSS using the font -size property, like so:


    ```

    font-size: 12px;

    ```


    # Solution


    We''ve used pixel sizing here, but the font - size property can take a variety
    of values. Before you decide which to use, you should know the relative merits
    of each option.


    Table 2.1. Units identifies the units that you can use to size fonts.


    # Table 2.1. Units of measurement for sizing fonts


    | Unit Identifier | Corresponding Units |

    |---|---|

    | pt | points |

    | pc | picas |

    | px | pixels |

    | em | ems |

    | ex | exes |

    | % | percentages |


    # Points and Picas


    You should avoid using points and picas to style text for display on screen. The
    point unit is an excellent way to set font sizes for print design, as the point
    measurement was created for that purpose:


    > http://www.sitepoint.com/eight-definitive-font-stacks/'
  merge: -1
