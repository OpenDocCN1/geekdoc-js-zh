  md: '# 276 The CSS3 Anthology


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_295_0.png)


    One way to patch this is by using Selectivizer.^4 This script provides CSS3 selector
    support for Internet Explorer, and does so without needing to make any other changes
    to your CSS. A script that adds support like this is sometimes referred to as
    a polyfill.


    > What is a polyfill?

    nA polyfill, sometimes referred to as a shim, a piece of code that provides support
    for technology that you would expect the browser to provide itself.^5 Here we''re
    looking at CSS3 polyfills, though the same approach is also used to provide support
    for HTML5 features.^6


    Selectivizr requires another JavaScript library to work. You can see on the website
    which libraries works with, if you''re already using a library, it''s quite likely
    to be included. As my page doesn''t already use a library, I''ve chosen to include
    jQuery.


    I add the jquery include, and then download and link in Selectivizr:


    +   ^4 http://selectivizr.com/

    5 http://remysharp.com/2010/10/08/what-is-a-polyfill/

    6 https://github.com/Modernizr/Modernizr/wiki/HTML5-Cross-browser-Polyfills'
