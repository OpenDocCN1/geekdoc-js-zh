  md: "# How do I set my text to display in a certain font?\n\nThe browser will display\
    \ text in the default font used for that browser and operating system. How do\
    \ you change it to the one used in your design?\n\n# Solution\n\nSpecify the typeface\
    \ that your text will adopt using the `font-family` property:\n\n```\np {\n  font-family:\
    \ Verdana;\n}\n```\n\n# Discussion\n\nAs well as specific fonts, such as Verdana\
    \ or Times, CSS allows the specification of some more-generic family names:\n\n\
    +   - serif\n- sans-serif\n- monospace\n- cursive\n- fantasy\n\nWhen you specify\
    \ generic fonts, it's important to remember that users are unlikely to have the\
    \ same fonts installed that you have on your computer. If you define a font that\
    \ the user doesn't have, your text will display according to their browsers' default\
    \ fonts, regardless of what you'd prefer.\n\nTo avoid this eventuality, you can\
    \ simply specify generic font names and let users' systems decide which font to\
    \ apply. For instance, if you want your document to appear in a sans-serif font\
    \ like Arial, you could use the following style rule:\n\n```\np {\n  font-family:\
    \ sans-serif;\n}\n```"
  merge: -1
  pgno: 43
- img_proc: true
  md: "# Text Styling and Other Basics 25\n\nNow, you will probably want more control\
    \ than this over the way your site displays—and you can. It's possible to specify\
    \ both font names and generic fonts the same declaration block. Take, for example,\
    \ the following style rule for the p element:\n\n```\np {\n  font-family: Verdana,\
    \ Geneva, Arial, Helvetica, sans-serif;\n}\n```\n\nHere, we've specified that\
    \ if Verdana is installed on the system, it should be used; otherwise, the browser\
    \ is instructed to see if Geneva is installed; failing that, the computer will\
    \ look for Arial, then Helvetica. If none of these fonts are available, the browser\
    \ will then use that system's default sans-serif font.\n\nIf a font-family name\
    \ contains spaces, it should be enclosed in quotation marks, like so:\n\n```\n\
    p {\n  font-family: \"Courier New\", \"Andale Mono\", monospace;\n}\n```\n\nThe\
    \ generic font-family names should always be without quotes and appear last in\
    \ the list. The list of fonts is often termed a “font stack,” which is a good\
    \ term to search on if you're looking for information on fonts to use in this\
    \ way.\n\nFonts that you can feel confident using:\n\n+   **Windows** Arial, Lucida,\
    \ Impact, Times New Roman, Courier New, Tahoma, Comic Sans, Verdana, Georgia,\
    \ Garamond\n**Mac** Helvetica, Futura, Bodoni, Times, Palatino, Courier, Gill\
    \ Sans, Geneva, Baskerville, Andale Mono\n\nThis list reveals the reason why we\
    \ chose the fonts we specified in our style rule. We begin by specifying our first\
    \ preference, a common Windows font (Verdana), then list a similar Mac font (Geneva).\
    \ Then we follow up with other fonts that would be usable if neither of these\
    \ fonts were available."
  merge: -1
