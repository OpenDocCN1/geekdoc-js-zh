  md: "# Discussion\n\nWe can style our fields using UI pseudo-classes in exactly\
    \ the same way we use the dynamic pseudo-class :hover to target the hover state\
    \ of a link. The pseudo-classes defined in the Basic User Interface Module are:\n\
    \n+   - :default\n- :valid\n- :invalid\n- :in-range\n- :out-of-range\n- :required\n\
    - :optional\n- :read-only\n- :read-write\n\nIn this solution, we're looking at\
    \ the valid and invalid pseudo-classes as they apply to our form fields. The first\
    \ field—fName—is valid if any text is entered into the field:\n\n```\n<div>\n\
    \  <label for=\"fName\">Name</label>\n  <input type=\"text\" name=\"fName\" id=\"\
    fName\" required=\"required\" />\n</div>\n```\n\nThe second field is only valid\
    \ if a correctly formatted email address is entered into the field:\n\n```\n<div>\n\
    \  <label for=\"fEmail\">Email address</label>\n  <input type=\"email\" name=\"\
    fEmail\" id=\"fEmail\" required=\"required\" placeholder=\"name@example.com\"\
    \ />\n</div>\n```\n\nIn the CSS, I start by creating rules for text fields that\
    \ are set to required:"
  merge: -1
  pgno: 265
- img_proc: true
  md: "# Forms and User Interfaces 247\n\n```\ninput:focus:required:invalid {\n  background-image:\
    \ url(error.png);\n  background-position: 98% center;\n  background-repeat: no-repeat;\n\
    }\n\ninput:required:valid {\n  background-image: url(accept.png);\n  background-position:\
    \ 98% center;\n  background-repeat: no-repeat;\n}\n```\n\nThe first slightly long-twisted\
    \ selector selects input elements that are focused (the user has been tabbed or\
    \ clicked them), set to required, and invalid. This means that the invalid icon\
    \ won't show when the user first arrives at the form—only once they start completing\
    \ an input.\n\nThe second targets any input element that's required and invalid.\
    \ I've chosen not to set these to only show on focus. This is because it's comforting\
    \ to the confirm that your input is correct, they'll stay after the user clicks\
    \ out of the field once it's completed correctly. Next, I'm going to update the\
    \ code to react differently when a field has a type of email. I'll use an attribute\
    \ selector to target this field and use a different icon:\n\n```\ninput[type=\"\
    email\\]:focus:required:invalid {\n  background-image: url(email_error.png);\n\
    }\n```\n\nSo an invalid email field shows a little envelope with an error icon.\
    \ Here you see how simple it is to stack up your selectors so that they target\
    \ elements precisely.\n\n![](img/91ffcf72aa0d1324280d9a5972b3b7e7_266_0.png)\n\
    \n> Required Information\nThis nifty technique will enhance your forms for the\
    \ users who can see the icons; however, you should never rely on this or any other\
    \ purely visual method to inform users that a field is required. A user who relies\
    \ on a screen reader will be unaware that the icon is changing."
  merge: -1
  pgno: 266
- img_proc: true
  md: "In time, I hope that screen readers will support the HTML5 required attribute\
    \ and relay that information to the user, but until then we need to provide this\
    \ information ourselves. See the solution at the end of this chapter for details\
    \ on how we can make our forms accessible while also making them attractive.\n\
    \n# How do I group related fields?\n\nWe can group fields logically using a fieldset,\
    \ and then style the fieldset element to make the end result more attractive.\n\
    \n# Solution\n\nThe form in Figure 6.14 comprises two fieldsets:\n\n```\nchapter_06/fieldsets.html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Chapter\
    \ 6: grouping data with fieldsets</title>\n  <link rel=\"stylesheet\" href=\"\
    fieldsets.css\" />\n</head>\n<body>\n  <div class=\"wrapper\">\n    <form method=\"\
    post\" action=\"/contact\" id=\"contact-form\">\n      <p class=\"help\">Please\
    \ complete the form to register. Required fields are indicated by a <em></em>.</p>\n\
    \      <fieldset>\n        <legend>Create an account</legend>\n        <div>\n\
    \          <label for=\"fName\">Name <em></em></label>\n          <input type=\"\
    text\" name=\"fName\" id=\"fName\" required=\"required\" />\n        </div>\n\
    \        <div>\n          <label for=\"fEmail\">Email address <em></em></label>\n\
    \          <input type=\"email\" name=\"fEmail\" id=\"fEmail\" required=\"required\"\
    \ placeholder=\"name@example.com\" />\n        </div>\n        <div>\n       \
    \   <label for=\"fPassword\">Password <em></em></label>\n          <input type=\"\
    text\" name=\"fPassword\" id=\"fPassword\" required=\"required\" />\n```"
