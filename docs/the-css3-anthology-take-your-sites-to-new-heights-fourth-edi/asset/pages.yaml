  md: '# The CSS3 Anthology


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_89_0.png)


    Figure 2.29. The default page padding and margins have been removed


    # How can I remove browsers’ default padding and marins from all elements?


    The display that you see in a browser when you view an unstyled document is the
    result of the browser''s internal stylesheet. Often, the differences that arise
    in the way various browsers display an unstyled page occur because those browsers
    have slightly different internal stylesheets.


    # Solution


    One to solve this problem is to remove the default margins and padding from all
    elements before you create your styles. The following rule will set the padding
    and margins on all elements to zero. This will have the effect of causing every
    element on the page—paragraphs, headings, lists, and more—to display without leaving
    any space between them, as Figure 2.30 demonstrates:'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Text Styling and Other Basics 71


    ![](img/91ffcf72aa0d1324280d9a5972b3b7e7_90_0.png)


    Figure 2.30. Removing padding and margins from all elements with the universal
    selector


    ```

    * {

    margin: 0;

    padding: 0

    }

    ```


    # Discussion


    This style rule uses the universal selector—also known as the asterisk or star
    (**)—to remove the margins and padding from everything, a technique known as performing
    a global whitespace reset. If you''re working on a particularly complex design,
    this may be the best way to start.


    Once you''ve done this, though, you''ll need to go back and add margins and padding
    to every element you use. This is particularly important for some form elements,
    which may be rendered unusable by this style rule.


    For simpler designs, removing the whitespace from every element is usually overkill,
    and simply generates more work; you''ll need to go back and add padding and'
  merge: -1
  pgno: 90
- img_proc: true
  md: "margins to elements such as paragraphs, blockquotes, and lists. A viable alternative\
    \ is to remove the margins and padding from a select set of elements only. The\
    \ following-style rule shows how this works, removing whitespace from heading\
    \ and list elements:\n\n```\nh1, h2, h3, h4, h5, h6, ul, ol {\n  margin: 0;\n\
    \  padding: 0;\n}\n```\n\nThere has been much discussion in the web development\
    \ community over whether CSS Resets are a good idea or not. Personally, I don't\
    \ use them, instead preferring to perform a similar method to what we've seen,\
    \ depending on the project. If you find them helpful, I'd suggest looking at Eric\
    \ Meyer's CSS Reset⁶ as a solid starting point.\n\n# How do I use fonts other\
    \ than those installed on most users' computers?\n\nWhen we discussed font-family\
    \ at the beginning of this chapter, I mentioned that you have to be careful about\
    \ selecting fonts, as there are only a few fonts that you can safely assume are\
    \ on most users' computers. However, CSS provides a way to use other fonts, too,\
    \ by loading a font file from the server.\n\n# Solution\n\nIn theory, we can import\
    \ a new font using the font-face property:\n\n```\n@font-face {\n  font-family:\
    \ KaffesatzBold;\n  src: url(YanoneKaffesatz-Bold.ttf);\n}\nh1 {\n  font-family:\
    \ KaffesatzBold, sans-serif;\n  font-weight: normal;\n}\n```\n\n⁶ http://meyerweb.com/eric/tools/css/reset/"
