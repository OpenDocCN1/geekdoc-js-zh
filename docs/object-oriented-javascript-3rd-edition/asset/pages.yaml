- img_proc: true
  md: '# Reactive Programming and React


    That is what we can accomplish with event streams. Let''s say a is an event stream
    of just the value 3. Then, we have streamB, which is streamA mapped. Each of these
    values will be mapped to 10 * a.


    If we add an event listener to streamB, and we console log, we will see b being
    30. Take a look at the example:


    ```

    var streamA = Rx.Observable.of(3, 4);

    var streamB = streamA.map(a => 10 * a);

    streamB.subscribe(b => console.log(b));

    ```


    If we do this, we have an event stream that has just two events. It has event
    3, and then it has event 4, and b will change accordingly whenever a changes.
    If we run this, we will see b being 30 and 40.


    Now that we have spent some time in getting the basics of reactive programming
    sorted, you may ask the following question.


    # Why should you consider reactive programming?


    As we write highly responsive and interactive UI applications on modern web and
    mobile, there is a strong need to find a way to deal with real-time events without
    stopping the user interactions on the UI. When you are dealing with multiple UI
    and server events fired, you will be spending most of your time writing code to
    deal with these events. This is tedious. Reactive programming gives you a structured
    framework to deal with asynchronous events with minimal code while you focus on
    the business logic for your application.


    Reactive programming is not limited to JavaScript. Reactive extensions are available
    in many platforms and languages, such as Java, Scala, Clojure, Ruby, Python, and
    Object C/Cocoa. Rx js and Bacon.js are popular JavaScript libraries that provide
    reactive programming.


    A deep dive into Rx.js is not the intention of this chapter. The idea was to introduce
    you to the idea of reactive programming. If you are on adopting reactive programming
    for your projects, you should look at Andre Staltz''s excellent introduction (https://gist.github.com/staltz/868e79bc2a7b8c1cf754).'
