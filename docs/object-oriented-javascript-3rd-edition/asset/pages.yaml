  md: '# Objects


    If you call a function that is designed to be a constructor but you omit the new
    operator, it is not an error. However, it doesn''t give you the expected result:


    ```

    > var h = Hero(''Leonardo'');

    > typeof h;

    > "undefined"

    ```


    What happened there? There is no new operator, so a new object was not created.
    The function was called like any other function, so the variable h contains the
    value that the function returns. The function does not return anything (there''s
    no return function), so it actually returns undefined, which gets assigned to
    the variable h.


    In this case, what does this refer to? It refers to the global object.


    # The global object


    You have already learned a bit about global variables (and how you should avoid
    them). You also know that JavaScript programs run inside a host environment (the
    browser, for example). Now that you know about objects, it''s time for the whole
    truth, the host environment provides a global object, and all global variables
    are accessible as properties of the global object.


    If your host environment is the web browser, the global object is called window.
    Another way to access the global object (and this is also true in most other environments)
    is to use the this keyword outside a constructor function, for example in the
    global program code outside any function.


    As an illustration, you can declare a global variable outside any function as
    follows:


    ```

    > var a = 1;

    ```


    Then, you can access this global variable in various ways:


    +   * As a variable a

    * As a property of the global object, for example, window[''a''] or window.a

    * As a property of the global object referred to as this:


    ```

    > var a = 1;

    > window.a;

    1

    > this.a;

    1

    ```'
