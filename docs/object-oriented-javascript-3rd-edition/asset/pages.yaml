    its own property name, but uses the one added to the prototype. This is more efficient,
    but you should only use it for properties that don''t change from one instance
    to another. Methods are ideal for this type of sharing.


    Let''s improve the preceding example by adding all methods and suitable properties
    to prototype. In the case of Shape() and TwoDShape(), everything is meant to be
    shared:


