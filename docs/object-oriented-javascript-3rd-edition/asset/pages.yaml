  md: "# Classes and Modules\n\nBefore we go into more details of the ES6 module system,\
    \ we need to understand how ES5 supported them via external libraries. ES5 has\
    \ two non-compatible module systems, which are as follows:\n\n+   - CommonJS:\
    \ This is the dominant standard as Node.js adopted it\n- AMD (Asynchronous Module\
    \ Definition): This is slightly more complicated than CommonJS and designed for\
    \ asynchronous module loading, and targeted toward browsers\n\nES6 modules were\
    \ aimed to be easy to use for engineers coming from any of these systems.\n\n\
    # Export lists\n\nInstead of tagging each exported function or class from your\
    \ module with the export keyword, you can write a single list of all the things\
    \ you want to export from the module, which are as follows:\n\n```\nexport (port,\
    \ startServer, Config);\nconst port = 8080;\nfunction startServer() {\n  //...start\
    \ server\n}\nclass Config {\n  //...\n}\nfunction processConfig() {\n  //...\n\
    }\",\n```\n\nThe first line of the module is the list of exports. You can have\
    \ multiple export lists in the module file and the list can appear anywhere in\
    \ the file. You can also have a mix of export list and export declarations in\
    \ the same module file, but you can export one name only once.\n\nIn a large project,\
    \ there are cases when you encounter name conflicts. Suppose you import two modules,\
    \ and both of them export a function with the same name. In such cases, you can\
    \ rename the imports as follows:\n\n+   - import {trunc as StringLib} from \"\
    ../lib/string.js\"\n- import {trunc as MathLib} from \"../lib/math.js\"\n\n[ 274\
    \ ]"
