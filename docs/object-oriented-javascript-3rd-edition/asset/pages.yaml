    # Built-in objects


    Earlier in this chapter, you come across the Object() constructor function. It''s
    returned when you create objects with the object literal notation and access their
    constructor property. Object() is one of the built-constructors; there are a few
    others, and in the rest of this chapter you will see all of them.


    The built-in objects can be divided into three groups:


    +   - Data wrapper objects: These are Object, Array, Function, Boolean, Number,
    and String. These objects correspond to the different data types in JavaScript.
    There is a data wrapper object for every value returned by typeof (discussed in
    Chapter 2, Primitive Data Types, Arrays, Loops, and Conditions), with the exception
    of undefined and null.

