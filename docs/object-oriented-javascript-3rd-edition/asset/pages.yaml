  md: '# Reactive Programming and React


    First, we extract our input element into a stateless function component and call
    it a Widget. We pass props to this component. Then, we change onChange to use
    props.update. Now, inside our render method, we use the Widget component and pass
    a prop update that binds the updateGreeting() method. Now that Widget is a component,
    we can reuse it anywhere in the Greet component. We are creating three instances
