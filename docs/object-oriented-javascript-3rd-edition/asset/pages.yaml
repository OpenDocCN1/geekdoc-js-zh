  md: "# Closure #2\n\nThe final result of the next example will be the same as the\
    \ previous example, but the way to achieve it is a little different. F() doesn't\
    \ return a function, but instead it creates a new global function, inner(), inside\
    \ its body.\n\nLet's start by declaring a placeholder for the global function-to-be.\
    \ This is optional, but it's always good to declare your variables. Then, you\
    \ can define the F() function as:\n\n```\nvar inner; // placeholder\nvar F = function\
    \ () {\n  var b = \"local variable\";\n  var N = function () {\n    return b;\n\
    \  }\n  inner = N;\n}\n```\n\nNow, let's see what happens when you invoke F():\n\
    \nA new function, N(), is defined inside F() and assigned to the global inner\
    \ function. During definition time, N() was inside F(), so it had access to the\
    \ F() function's scope. The inner() function will keep its access to the F() function's\
    \ scope, even though it's part of the global space, for example:\n\n+   - inner();\n\
    - \"local variable\"\n\n# A definition and closure #3\n\nEvery function can be\
    \ considered a closure. This is because every function maintains a secret link\
    \ to the environment (the scope) in which it was created. But, most of the time,\
    \ the scope is destroyed unless something happens (as shown in the preceding code)\
    \ that causes it to be maintained.\n\nBased on what you've seen so far, you can\
    \ say that a closure is created when a function keeps a link to its parent scope\
    \ even after the parent has returned. And, every function is a closure because,\
    \ at the very least, every function maintains access to the global scope, which\
    \ is never destroyed."
