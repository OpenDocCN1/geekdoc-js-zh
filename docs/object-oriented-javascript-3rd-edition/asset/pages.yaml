  md: "# Prototype chaining default example\n\nPrototype chaining is the default way\
    \ to implement inheritance. In order to implement the hierarchy, let's define\
    \ three constructor functions:\n\n```\nfunction Shape() {\n  this.name = 'Shape';\n\
    \  this.toString = function () {\n    return this.name;\n  }\n}\nfunction TwoDhape()\
    \ {\n  this.name = '2D shape';\n}\nfunction Triangle(side, height) {\n  this.name\
    \ = 'Triangle';\n  this.side = side;\n  this.height = height;\n  this.getArea\
    \ = function () {\n    return this.side * this.height / 2;\n  }\n}\n```\n\nThe\
    \ code that performs the inheritance magic is as follows:\n\n```\nTwoDShape.prototype\
    \ = new Shape();\nTriangle.prototype = new TwoDShape();\n```\n\nWhat's happening\
    \ here? You take the object contained in the prototype property of TwoDShape,\
    \ and instead of augmenting it with individual properties, you overwrite it with\
    \ another object, created by invoking the Shape() constructor with new. The same\
    \ process is followed for Triangle-sts prototype replaced by an object created\
    \ by new TwoDShape(). It's important to remember that JavaScript works with objects,\
    \ not classes. You need to create an instance using the new Shape() constructor,\
    \ and after that, you can inherit its properties; you don't inherit from Shape()\
    \ directly. Additionally, after inheriting, you can modify the Shape() constructor,\
    \ overwrite it, or even delete it, and this will have no effect on TwoDShape,\
    \ because all you needed is one instance to inherit from."
