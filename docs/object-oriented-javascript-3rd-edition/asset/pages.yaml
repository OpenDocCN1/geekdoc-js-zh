    # Using window.history property


    The window.history property allows limited access to the previously visited pages
    in the same browser session. For example, you can see how many pages the user
    has visited before coming to your page, as follows:


    ```

    window.history.length;

    5

    ```


    You cannot see the actual URLs though. For privacy reasons, this doesn''t work.
    See the following code:


    ```

    window.history[0];

    ```


    You can, however, navigate back and forth through the user''s session as if the
    user had clicked on the back/forward button buttons, as follows:


    ```

    history.forward();

    history.back();

    ```


    You can also skip pages back and forth with history.go(). This is the same as
    calling history.back(). The code for history.go() is as follows:


    ```

    history.go(-1);

    ```


    To go two pages back, use the following code:


    ```

    history.go(-2);

    ```


    Reload the current page using the following code:


    ```

    history.go(0);

    ```'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'Most recent browsers also support HTML5 history API, which lets you change
    the URL without reloading the page. This is perfect for dynamic pages because
    they can allow users to bookmark a specific URL, which represents the state of
    the application, and when they come back, or share with their friends, the page
    can restore the application state based on the URL. To get a sense of the history
    API, go to any page and write the following lines of code in the console:


    ```

    > history.pushState({a: 1}, "hello");

    > history.pushState({b: 2}, "hello-you-too-many");

    > history.state;

    ```


    Notice how the URL changes, but the page is the same. Now, experiment with back
    and forward buttons in the browser and inspect the history.state object.


    # using window.frames property


    The window.frames property is a collection of all the frames in the current page.
    It doesn''t distinguish between frames and iframes (inline frames). Regardless
    of whether there are frames on the page or not, window.frames always exists and
    points to window, as follows:


    ```

    > window.frames === window;

    true

    ```


    Let''s consider an example where you have a page with one iframe, as follows:


    ```

    <iframe name="myframe" src="hello.html" />

    ```


    In order to tell if there are any frames on the page, you can check the length
    property. In case of one iframe, you''ll see the following output:


    ```

    > frames.length

    1

    ```


    Each frame contains another page, which has its own global window object.

    To get access to the iframe''s window, you can execute any of the following:


    ```

    > window.frames[0];

    > window.frames[0].window;

    > window.frames[0].window.frames;

    > frames[0].window;

    > frames[0];

    ```'
  merge: -1
