    The console also has an autocomplete feature. It works in a similar way to the
    normal command-line prompt in your operating system or autocomplete feature of
    the full-fledged IDEs. If, for example you type docu and hit the Tab or right
    arrow key, doc will be autocompleted to document. If, if you type . (the dot operator),
    you can iterate through all the available properties and methods you can call
    on the object.


    By using the up and down arrow keys, you can go through the list of already executed
    commands and bring them back in the console.


    The console gives you only one line to type in, but you can execute JavaScript
    statements by separating them with semicolons. If you need more lines, you can
    press Shift+ Enter to go to a new line without executing the result just yet.


    # JavaScriptCore on a Mac


    On a Mac, you don''t actually need a browser; you can explore JavaScript directly
    from your command line Terminal application.


    If you''ve never used Terminal, you can simply search for it in Spotlight search.
    Once you''ve launched it, type the following command:


    ```

