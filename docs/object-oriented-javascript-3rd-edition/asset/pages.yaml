  md: '# Booleans


    There are only two values that belong to the Boolean data type—the true and false
    values used without:


    ```

    > var b = true;

    > typeof b;

    "boolean"

    > var b = false;

    > typeof b;

    "boolean"

    ```


    If you quote true or false, they become strings, as shown in the following example:


    ```

    > var b = "true";

    > typeof b;

    "string"

    ```


    # Logical operators


    There are three operators, called logical operators, that work with Boolean values.
    These are as follows:


    +   - logical NOT (negation)

    - logical AND

    - logical OR


    You know that when something is not, it must be false. Here''s how this is expressed
    using JavaScript and the logical ! operator:


    ```

    > var b = !true;

    > b;

    false

    ```


    If you use the logical NOT twice, you will get the original value, which is as
    follows:


    ```

    > var b = !!true;

    > b;

    true

    ```


    If you use a logical operator on a non-Boolean value, the value is converted to
    Boolean behind the scenes, as follows:


    ```

    > var b = "one";

    > !b;

    false

    ```'
