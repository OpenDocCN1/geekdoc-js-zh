  md: "Simply copying all the properties is a straightforward pattern, and it's widely\
    \ used. Let's see this function in action. You start by having a base object:\n\
    \n```\nvar shape = {\n  name: 'Shape',\n  toString: function () {\n    return\
    \ this.name;\n  }\n};\n```\n\nIn order to create a new object that builds upon\
    \ the old one, you can call the extendCopy() function, which returns a new object.\
    \ Then, you can augment the new object with additional functionality:\n\n```\n\
    var twoDee = extendCopy(shape);\ntwoDee.name = '2D shape';\ntwoDee.toString =\
    \ function () {\n  return this.uber.toString() + ', ' + this.name;\n};\n```\n\n\
    Here is a triangle object that inherits the 2D shape object:\n\n```\nvar triangle\
    \ = extendCopy(twoDee);\ntriangle.name = 'Triangle';\ntriangle.getArea = function\
    \ () {\n  return this.side * this.height / 2;\n};\n```\n\nUsing the triangle,\
