  md: '# Cookies, title, referrer, and domain


    The four additional properties of document you''ll see in this section are also
    ported from DOM Level 0 to the HTML extension of DOM Level 1. Unlike the previous
    ones, for these properties, there are no core DOM equivalents.


    document.cookie is a property that contains a string. This string is the content
    of the cookies exchanged between the server and the client. When the server sends
    a page to the browser, it may include the Set-Cookie HTTP header. When the client
    sends a request to the server, it sends the cookie information with the Cookie
    header. Using document.cookie, you can also alter the cookies the browser sends
    to the server. For example, visiting cnn.com and typing document.cookie in the
    console gives you the following:


    ```

    > document.cookie;

    "mbox-check=true#1356053765|session#1356053704195-121286#1356055565;..."

    ```


    document.title allows you to change the title of the page displayed in the browser
    window. For example, see the following code:


    ```

    > document.title = ''My title'';

    "My title"

    ```


    Note that this doesn''t change the value of the <title> element, but only the
    display in the browser window, so it''s not equivalent to document.querySelector(''title'').


    document.referrer tells you the URL of the previously visited page. This is the
    same value that the browser sends in the Referer HTTP header when requesting the
    page. (Note that Referer is misspelled in the HTTP headers, but is correct in
    JavaScript''s document.referrer). If you''ve visited the CNN page by searching
    on Yahoo! first you see something like the following:


    ```

    > document.referrer;

    "http://search.yahoo.com/search?p=cnn&ei=UTF-8&fr=moz2"

    ```


    document.domain property gives you access to the domain of the currently loaded
    page. This is commonly used when you need to perform so-called domain relaxation.
    Imagine your page is www.yahoo.com, and you have an iframe hosted on music.yahoo.com
    subdomain. These are two separate domains, so the browser''s security restrictions
    won''t allow the page and the iframe to communicate. To resolve this, you can
    set document.domain property on both pages to yahoo.com and they''ll be able to
    talk to each other.'
  merge: -1
  pgno: 353
- img_proc: true
  md: "Note that you can only set the domain to a less specific one, for example,\
    \ you can change\nwww.yahoo.com to yahoo.com, but you cannot change yahoo.com\
    \ to www.yahoo.com, or\nany other non-yahoo domain. Consider the following code:\n\
    \n+   > document.domain;\n  \"www.yahoo.com\"\n> document.domain = 'yahoo.com';\n\
    \  \"yahoo.com\"\n> document.domain = 'www.yahoo.com';\n  Error: DOM Exception\
    \ 18\n> document.domain = 'www.example.org';\n  Error: DOM Exception 18\n\nPreviously,\
    \ in this chapter, you saw the window.location object. Well, the same\nfunctionality\
    \ is also available as document.location object:\n\n```\nwindow.location === document.location;\n\
    true\n```\n\n# Events\n\nImagine you are listening to a radio program and they\
    \ announce, “Big event! Huge! Aliens\nhave landed on Earth!” You might think,\
    \ “Yeah, whatever\"; some other listeners might think\n“They come in peace\";\
    \ and some might think, “We’re all gonna die!”. The browser\nbroadcasts events,\
    \ and your code can be notified should it decide to tune in and listen to the\n\
    events as they happen. Some example events are:\n\n+   * The User clicks a button\n\
    * The user types a character in a form field\n* The page finishes loading\n\n\
    You can attach a JavaScript function called event listener or event handler to\
    \ a specific event\nand the browser will invoke your function as soon as the event\
    \ occurs. Let’s see how this is\ndone."
  merge: -1
