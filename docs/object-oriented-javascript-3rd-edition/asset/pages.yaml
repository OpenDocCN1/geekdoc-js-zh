  md: "Functions\n\nIf you define an inner() function nested inside outer(), it will\
    \ have access to variables in its own scope, plus the scope of its parents. This\
    \ is known as a scope chain, and the chain can be as long (deep) as you need it\
    \ to be:\n\n```\nvar global = 1;\nfunction outer() {\n  var outer_local = 2;\n\
    \  function inner() {\n    var inner_local = 3;\n    return inner_local + outer_local\
    \ + global;\n  }\n  return inner();\n}\n```\n\nLet's test if the inner() function\
    \ has access to all variables:\n\n```\n> outer();\n6\n```\n\n# Breaking the chain\
    \ with a closure\n\nLet's introduce closures with an illustration and look at\
    \ the following code and see what's happening here:\n\n```\nvar a = \"global variable\"\
    ;\nvar F = function () {\n  var b = \"local variable\";\n  var N = function ()\
    \ {\n    var c = \"inner local\";\n  };\n}\n```"
  merge: -1
