  md: '# ES6 Iterators and Generators


    Similar to maps, you can create a Set via an iterator:


    ```

    const colors = new Set([''red'', white, ''blue'']);

    ```


    When you add a value to the Set, and the value already exists, nothing happens.
    Similarly, if you delete a value from the Set, and the value didn''t exist in
    the first place, nothing happens. There is no way to catch this scenario.


    # WeakMap and WeakSet


    WeakMap and WeakSet have the similar, restricted, APIs as the Map and Set respectively,
    and they work mostly like their strong counterparts. There are a few differences,
    which are as follows:


    +   * WeakMap only supports the new, has(), get(), set(), and delete() methods

    * WeakSet only supports new, has(), add(), and delete() methods

    * Keys of a WeakMap must be objects

    * Values of a WeakSet must be objects

    * You can''t iterate over WeakMap; the only way you can access a value is via
    its key

    * You can''t iterate over a WeakSet

    * You can clear a WeakMap or a WeakSet


    Let''s understand WeakMap first. The difference between a Map and a WeakMap is
    that a WeakMap allows itself to be garbage collected. The keys in a WeakMap are
    weakly held. WeakMap keys are not counted when the garbage collector does a reference
    count (a technique to save all references), and they are garbage collected when
    possible.


    WeakMaps are useful when you don''t have any control over the life cycle of the
    object you are keeping in the Map. You don''t need to worry about memory leak
    when using WeakMaps because the objects will not keep the memory occupied even
    if their life cycle is long.


    Same implementation details apply to WeakSet as well. However, as you cannot iterate
    over a WeakSet, there are not many use cases for a WeakSet.'
