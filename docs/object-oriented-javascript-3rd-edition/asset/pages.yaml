    RegExp provides two methods you can find to matches-test() and exec(). They both
    accept a string parameter. The test() method returns a Boolean (true when there''s
    a match, false otherwise), while exec() returns an array of matched strings. Obviously,
    exec() is doing more work, so use test() only if you really need to do something
    with the matches. People often use regular expressions to validate data. In this
    case, test() should be enough.'
