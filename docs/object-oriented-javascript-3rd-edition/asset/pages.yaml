    # Object


    Object is the parent of all JavaScript objects, which means that every object
    you create

    inherits from it. To create a new empty object, you can use the literal notation
    or the

    Object() constructor function. The following two lines are equivalent:


    ```

    > var o = {};

    > var o = new Object();

    ```


    As mentioned before, an empty (or blank) object is not completely useless, because
    it

    already contains several inherited methods and properties. In this book, empty
    means an

    object {} that has no properties of its own, other than the ones it automatically
    gets.

    Let''s look at a few of the properties that even blank objects already have:


    +   * o.constructor property returns a reference to the constructor function

    * o.toString() is a method that returns a string representation of the object

    * o.valueOf() returns a single-value representation of the object; often, this
    is

    object itself


    Let''s see these methods in action. Create first an object:


    ```

    > var o = new Object();

    ```


    Calling toString() returns a string representation of the object:


    ```

    > o.toString();

    "[object Object]"

    ```


    The toString() method will be called internally by JavaScript when an object is
    used in a

    string context. For example, alert() works only with strings, so if you call the
    alert()

    function passing an object, the toString() method will be called behind the scenes.
    These

    two lines produce the same result:


    ```

    > alert(o);

    > alert(o.toString());

    ```'
