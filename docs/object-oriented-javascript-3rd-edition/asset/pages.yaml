    \ to achieve this. A popular way of implementing mixins in ES6 is to write a function\
    \ with a superclass as an input and a subclass extending that superclass as the\
    \ output, for:\n\n```\nclass Person {}\nconst BackgroundCheck = Tools => class\
    \ extends Tools {\n  check() {}\n}\nconst Onboard = Tools => class extends Tools\
