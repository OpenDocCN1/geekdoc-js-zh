  md: '# Copy properties using Object.assign


    This method is used to copy properties of the target object into the source object.
    In other words, this method merges the source object with the target object and
    modifies the target object:


    ```

    let a = {}

    Object.assign(a, { age: 25 })

    console.log(a) //{"age":25}

    ```


    The first parameter to Object.assign is the target on which source properties
    are copied. The same target object is returned to the caller. Existing properties
    are overwritten, while properties that aren''t part of the source object are ignored:


    ```

    let a = {: age: 23, gender: "male"}

    Object.assign(a, { age: 25 }) // age overwritten, but gender ignored

    console.log(a) //{"age":25, "gender":"male"}

    ```


    Object.assign can take multiple source objects. You can write Object.assign(source1,
    source2). Here is an example:


    ```

    console.log(Object.assign({a:1, b:2}, {a: 2}, {c: 4}, {b: 3}))

    //Object {

    //"a": 2,

    //"b": 3,

    //"c": 4

    //

    ```


    In this snippet, we are assigning properties from multiple source objects. Also,
    notice how Object.assign() returns the target object, which we turn in use console.log().


    One point to note is that only enumerable (non-inherited) properties can be copied
    using Object.assign(). Properties from the prototype chain (will be discussed
    later in this chapter when we talk about Inheritance) are not considered. Our
    earlier discussion of enumerable properties will help you understand this distinction.'
