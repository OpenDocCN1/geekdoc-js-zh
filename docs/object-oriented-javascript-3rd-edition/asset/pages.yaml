  md: "# Coding and Design Patterns\n\nNow, when you call MYAPP.dom.setStyle(), it\
    \ invokes the private _setStyle() function. You can also overwrite setStyle()\
    \ from the outside as follows:\n\n```\nMYAPP.dom.setStyle = function () {alert('b')};\n\
    ```\n\nNow, the result is as follows:\n\n+   - MYAPP.dom.setStyle points to the\
    \ new function\n- MYAPP.dom.yetAnother still points to _setStyle()\n- _setStyle()\
    \ is always available when any other internal code relies on it to be\nworking\
    \ as intended, regardless of the outside code\n\nWhen you expose something private,\
    \ keep in mind that (functions and arrays are objects) are passed by reference,\
    \ and therefore, can be modified from the outside.\n\n# Immediate functions\n\n\
    Another pattern that helps keep the global namespace clean is to wrap your code\
    \ in an anonymous function and execute that function immediately. This way any\
    \ variables inside the function are clear, as long as you use the var statement,\
    \ and are destroyed when the function returns, if they aren't part of a closure.\
    \ This pattern was discussed in more detail in Chapter 3, Functions. Take a look\
    \ at the following code:\n\n```\nfunction () {\n  // code goes here...\n}());\n\
    ```\n\nThis pattern is especially suitable for on-off initialization task, performed\
    \ when the script loads.\n\nThe immediate self-executing function pattern can\
    \ be extended to create and return objects. If the creation of these objects is\
    \ more complicated and involves some initialization work, then you can do this\
    \ in the first part of the self-executing function and return a single object\
    \ that can access and benefit from any private properties to the top portion,\
    \ as follows:\n\n```\nvar MYAPP = {};\nMYAPP.dom = (function () {\n  // initialization\
    \ code...\n  function _private() {\n    ...\n  }\n  return {\n    setStyle: function\
    \ (el, prop) {\n```"
