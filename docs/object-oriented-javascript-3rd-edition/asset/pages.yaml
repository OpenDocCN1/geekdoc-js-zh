  md: "# Immediate functions\n\nSo far, we have discussed using anonymous functions\
    \ as callbacks. Let's see another application of an anonymous function—calling\
    \ a function immediately after it's defined.\nHere's an example:\n\n```\nfunction\
    \ () {\n  alert('boo');\n}\n)();\n```\n\nThe syntax may look a little scary at\
    \ first, but all you do is simply place a function inside parentheses followed\
    \ by another set of parentheses. The second set execute now and is also the place\
    \ to put any arguments that your anonymous function might accept, for example:\n\
    \n```\nfunction (name) {\n  alert('Hello ' + name + '!!');\n}\n('dude');\n```\n\
    \nAlternatively, you can move the closing of the first set of parentheses to the\
    \ end. Both of these work:\n\n```\nfunction () {\n  // ...\n}()();\n\n// vs.\n\
    function () {\n  // ...\n}()();\n```\n\nOne good application of immediate (self-invoking)\
    \ anonymous functions is when you want to have some work done without creating\
    \ extra global variables. A drawback, of course, is that you cannot execute the\
    \ same function twice. This makes immediate functions best suited for one-off\
    \ or initialization tasks."
  merge: -1
