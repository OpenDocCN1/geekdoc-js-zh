  md: "# The Browser Environment\n\nIn addition to being a reference to the global\
    \ object, the window object also serves a second purpose-providing information\
    \ about the browser environment. There's a window object for every frame, iframe,\
    \ pop up, or browser tab.\n\nLet's see some of the browser-related properties\
    \ of the window object. Again, these can vary from one to another, so let's consider\
    \ the properties that are implemented consistently and reliably across all major\
    \ browsers.\n\n# Using window.navigator.property\n\nThe navigator is an object\
    \ that has some information about the browser and its capabilities. One property\
    \ is navigator.userAgent, which is a long string of browser identification. In\
    \ Firefox, you'll get the following output:\n\n> > window.navigator.userAgent;\n\
    >Mozilla/5.0 (Macintosh; Intel Mac OS X 10_8_3)\n>AppleWebKit/536.28.10\n>(KHTML,\
    \ like Gecko) Version/6.0.3 Safari/536.28.10\n\nTheAgent string in Microsoft Internet\
    \ Explorer is something like:\n\n> \"Mozilla/5.0 (compatible; MSIE 10.0; Windows\
    \ NT 6.1; Trident/6.0)\"\n\nAs the browsers have different capabilities, developers\
    \ are using the userAgent string to identify the browser and different versions\
    \ of the code. For example, the following code snippet searches for the presence\
    \ of the MSIE string to identify Internet Explorer:\n\n```\nif (navigator.userAgent.indexOf('MSIE')\
    \ !== -1) {\n  // this is IE\n} else {\n  // not IE\n}\n```"
