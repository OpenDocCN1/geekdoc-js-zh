  md: '# Event loop


    A browser tab runs in a single thread—an event loop. This loop continuously picks
    messages from the message queue and executes the callbacks associated with them.
    The event loop simply keeps picking tasks from the message queues while other
    processes add tasks to the message queue. Other processes such as timers and event
    handlers run in parallel and keep adding tasks to the queue.


    # Timers


    The `setTimeout()` method creates a timer and waits until it fires. When the timer
    is executed, a task is added to the message queue. The `setTimeout()` method takes
    two arguments: a callback, and the duration in milliseconds. After the duration,
    the callback is added to the message queue. Once the callback is added to the
    message queue, the event loop will eventually pick it up and execute it. There
    is, however, no guarantee when the callback will be picked up by the event loop.


    # Run to completion


    When the event loop picks up a message from the queue, the associated callback
    is run to completion. This means that a message is processed completely before
    the next message from the queue is processed. This property gives the asynchronous
    model a sense of predictability. As there is no intervention to preempt any of
    the messages in execution, this model is much simpler than other models, where
    any unit of execution can be halted in between. However, once the message is picked
    up, even if the execution takes too long, any interaction on the browser is blocked.'
  merge: -1
  pgno: 300
- img_proc: true
  md: "# Events\n\nYou can register event handlers for an object and receive results\
    \ of a method asynchronously. The following example shows how we can set up event\
    \ handlers for the XMLHttpRequest API:\n\n```\nvar xhr = new XMLHttpRequest();\n\
    xhr.open('GET', 'http://babeljs.io', true);\nxr.onload = function(e) {\n  if (this.status\
    \ == 200) {\n    console.log(\"Works\");\n  }\n}\nxhr.send();\n```\n\nIn the preceding\
    \ snippet, we create the object of the XMLHttpRequest class. Once the request\
    \ object is created, we will register event handlers for it. Event handlers, such\
    \ as onload(), are triggered asynchronously when the response is received from\
    \ the open() method.\n\nThe send() method doesn't actually initiate the request,\
    \ it adds the request to the message queue for the event loop to pick it up and\
    \ execute necessary callbacks associated with it.\n\n# Callbacks\n\nThe Node.js\
    \ application popularized this style of receiving asynchronous data. A callback\
    \ is a function passed as the last argument to the asynchronous function call.\n\
    \nTo illustrate the usage, let's use the following example of reading a file in\
    \ Node.js:\n\n```\nfs.readFile('/etc/passwd', (err, data) => {\n  if (err) throw\
    \ err;\n  console.log(data);\n});\n```\n\nDon't worry about a few details here.\
    \ We are using the filesystem module as an fs alias. This module has a readFile\
    \ method to read a file asynchronously. We will pass the file path and filename\
    \ as the first argument and a callback function as the last argument of the function.\
    \ We are using an anonymous function as the callback in the example."
  merge: -1
  pgno: 301
- img_proc: true
  md: "# Promises and Proxies\n\nThe callback function has two arguments--error and\
    \ data. When the readFile() method is successful, the callback function receives\
    \ data, and if it fails, the error argument will have the error details.\n\nWe\
    \ can also use a slightly functional style to write the same callback. Consider\
    \ the following example:\n\n```\nfs.readFile('/etc/passwd',\n//success\nfunction(data)\
    \ {\n  console.log(data)\n}\n//error\nfunction(error) {\n  console.log(error)\n\
    };\n```\n\nThis style of passing callbacks is also called continuous-passing style\
    \ (CPS); the next step of execution or continuation is passed as a parameter.\
    \ The following example illustrates the CPS style of callbacks:\n\n```\nconsole.log(\"\
    1\");\ncps(\\2\", function cps_step2(val2) {\n  console.log(val2);\n  cps(\"3\"\
    , function cps_step3(val3) {\n    console.log(val3);\n  });\n  console.log(\"\
    4\");\n});\nconsole.log(\"5\");\n//1 5 2 4 3\n```\n\n```\nfunction cps(val, callback)\
    \ {\n  setTimeout(function () {\n    callback(val);\n  }, 0);\n}\n```\n\nWe will\
    \ provide the continuation (the next callback) to each step. This nested callback\
    \ style also causes a problem sometimes referred to as callback hell.\n\nCallbacks\
    \ and the CPS introduce a radically different style of programming. Although it\
    \ is easier to understand callbacks compared to other constructs, callbacks can\
    \ create slightly difficult to understand code."
  merge: -1
