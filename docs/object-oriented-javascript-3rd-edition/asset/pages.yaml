- img_proc: true
  md: "The window.open() method accepts the following parameters:\n\n+   - URL to\
    \ load in the new window\n- Name of the new window that can be used as the value\
    \ of a form’s target attribute\n- Comma-separated list of features, which is as\
    \ follows:\n  - resizable:Should the user be able to resize the new window\n \
    \ - width, height: Width and height of the pop up\n  - status:Should the status\
    \ bar be visible\n\nThe window.open() method returns a reference to the window\
    \ object of the newly created browser instance. The following is an example:\n\
    \n```\nvar win = window.open('http://www.packtub.com', 'packt',\n'width=300,height=300,\
    \ resizable=yes');\n```\n\nThe window variable points to the window object of\
    \ the pop up. You can check if win has a false value, which means the pop up was\
    \ blocked.\n\nThe win.close() method closes the window.\n\nIt's best to stay away\
    \ from opening new windows for accessibility and usability reasons. If you don't\
    \ like sites popping up windows to you, why do it to your users? There are legitimate\
    \ purposes, such as providing help information while filling out a form, but often,\
    \ the same can be achieved with alternative solutions, such as using a floating\
    \ <div> inside the page.\n\n# window.moveTo() and window.resizeTo() methods\n\n\
    Continuing the shady practices from the past, the following are more methods to\
    \ irritate your users, provided their browser and personal settings allow you\
    \ to do:\n\n+   - window.moveTo(100, 100): This moves the browser window to screen\
    \ location x = 100 and y = 100, which is counted from the top-left corner\n- window.moveToBy(10,\
    \ -10): This moves the window 10 pixels to the right from its current location\n\
    - window.resizeTo(x, y) and window.resizeBy(x, y): These accept the same parameters\
    \ as the move methods, but they resize the window as opposed to moving it"
