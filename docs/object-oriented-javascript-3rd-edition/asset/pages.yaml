- img_proc: true
  md: "If you put the indexes in one column and the values in another, you'll end\
    \ up with a table of key/value pairs shown as follows:\n\n| Key | Value |\n| 0\
    \ | red |\n| 1 | blue |\n| 2 | yellow |\n| 3 | purple |\n\nAn object is similar\
    \ to an array, but the difference is that you define the keys yourself. You're\
    \ not limited to using only numeric indexes, and you can use friendlier keys such\
    \ as first_name, age, and so on.\n\nLet's take a look at a simple object and examine\
    \ its parts:\n\n```\nvar hero = {\n  breed: 'Turtle',\n  occupation: 'Ninja'\n\
    };\n```\n\nYou can see that:\n\n+   * The name of the variable that refers to\
    \ the object hero\n* Instead of [ and ], which you use to define an array, you\
    \ use { and } for objects\n* You separate the elements (called properties) contained\
    \ in the object with commas\n* The key/value pairs are divided by colons, as in\
    \ key:value\n\nThe keys (names of the properties) can optionally be placed in\
    \ quotation marks. For example, these keys are all the same:\n\n```\nvar hero\
    \ = {occupation: 1};\nvar hero = {\"occupation\": 1};\nvar hero = {'occupation':\
    \ 1};\n```"
