  md: "# DOM-only method\n\nThe innerHTML property gets things done a little more\
    \ quickly than using pure DOM. In pure DOM, you will need to perform the following\
    \ steps:\n\n+   1. Create a new text node containing yet another node.\n2. Create\
    \ a new paragraph node.\n3. Append the text node as a child to the paragraph.\n\
    4. Append the paragraph as a child to the body.\n\nThis way, you can create any\
    \ number of text nodes and elements and nest them, however you like. Let's say,\
    \ you want to add the following HTML to the end of the body:\n\n```\n<p>one more\
    \ paragraph<strong>bold</strong></p>\n```\n\nPresenting the preceding code as\
    \ a hierarchy would be something like the following code snippet:\n\n```\nP element\n\
    \    text node with value \"one more paragraph\"\n    STRONG element\n       \
    \ text node with value \"bold\"\n```\n\nThe code that accomplishes this is as\
    \ follows:\n\n```\n// create P\nvar myp = document.createElement('p');\n// create\
    \ text node and append to P\nvar myt = document.createTextNode('one more paragraph');\n\
    myp.appendChild(myt);\n// create STRONG and append another text node to it\nvar\
    \ str = document.createElement('strong');\nstr.appendChild(document.createTextNode('bold'));\n\
    // append STRONG to P\nmyp.appendChild(str);\n// append P to BODY\ndocument.body.appendChild(myp);\n\
    ```"
  merge: -1
  pgno: 346
- img_proc: true
  md: "# Using cloneNode() method\n\nAnother way to create nodes is by copying or\
    \ cloning existing ones. The cloneNode () method does this and accepts a Boolean\
    \ parameter (true = deep copy with all the children, false = shallow copy, only\
    \ this node). Let's test the method.\n\nGetting a reference to the element you\
    \ want to clone can be as follows:\n\n+   > var el = document.getElementsByTagName('p')\
    \ [1];\n\nNow, el refers to the second paragraph on the page that looks like the\
    \ following code:\n\n```\n<p><em>second</em></p> paragraph\n```\n\nLet's create\
    \ a shallow clone of el and append it to the body as follows:\n\n+   > document.body.appendChild(el.cloneNode(false));\n\
    \nYou won't see a difference on the page because the shallow clone only copied\
    \ the P node without any children. This means that the text inside the paragraph,\
    \ which is a text node, was not cloned. The preceding line will be equivalent\
    \ to the following code line:\n\n+   > document.body.appendChild(createElement('p'));\n\
    \nHowever, if you create a deep copy, the whole DOM subtree starting from P is\
    \ copied, and this includes text nodes and the EM element. This line copies (visually\
    \ too) the second paragraph to the end of the document. Consider the following\
    \ line of code:\n\n+   > document.body.appendChild(el.cloneNode(true));\n\nYou\
    \ can also copy only the EM if you want, as shown in the following lines of code:\n\
    \n+   > document.body.appendChild(el.firstChild.cloneNode(true);\n<<em>second</em>\n\
    \nOr, you can copy only the text node with value second, as follows:\n\n+   >\
    \ document.body.appendChild(\n  el.firstChild.firstChild.cloneNode(false);\n \
    \ \"second\""
  merge: -1
