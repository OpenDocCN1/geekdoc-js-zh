  md: '# DOM access shortcuts


    Using childNodes, parentNode, nodeName, nodeValue, and attributes, you can navigate
    up and down the tree and do anything with the document. However, the fact that
    whitespace is a text node makes this a fragile way of working with the DOM. If
    the page changes, your script may no longer work correctly. Also, if you want
    to get a deeper in the tree, it could take a bit of code before you get. That''s
    why you have shortcut methods, namely, getElementsByTagName(), getElementsByName(),
    and getElementById().


    The getElementsByTagName() method takes a tag name (name of an element node) and
    returns an HTML collection (array-like object) of nodes with the matching tag
    name. For example, the following example asks-give a count of all paragraphs,
    which is given as follows:


    ```

    document.getElementsByTagName(''p'').length;

    ```


    You can access an item in the list using the list notation, or the item() method,
    and passing the index (0 for the first element). Using item() is discouraged,
    array brackets are more consistent and also shorter to type. Refer to the following
    piece of code:


    ```

    document.getElementsByTagName(''p'')[0];

    <p class="opener">first paragraph</p>

    document.getElementsByTagName(''p'').item(0);

    <p class="opener">first paragraph</p>

    ```


    Getting the contents of the first p can be done as follows:


    ```

    document.getElementsByTagName(''p'')[0].innerHTML;

    "first paragraph"

    ```


    Accessing the last p can be done as follows:


    ```

    document.getElementsByTagName(''p'')[2];

    <p id="closer">final</p>

    ```


    To access the attributes of an element, you can use the attributes collection
    or getAttribute(), as previously shown. However, a shorter way is to get attribute
    name as a property of the element you''re working with. So, to get the value of
    the id attribute, you will just use id as a property, which is as follows:


    ```

    document.getElementsByTagName(''p'')[2].id;

    "closer"

    ```'
