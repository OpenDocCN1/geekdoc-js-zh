    # ECMAScript 5 additions to objects


    In ECMAScript 3 all object properties can be changed, added, or deleted at any
    time, except for built-in properties (for example, Math.PI). In ES5 you have the
    ability to define properties that cannot be changed or deleted, a privilege previously
    reserved for built-ins. ES5 introduces the concept of property descriptors that
    give you tighter control over the properties you define.


    Think of a property descriptor as an object that specifies the features of a property.
    The syntax to describe these features is a regular object literal, so property
    have properties and methods of their own, let''s call them attributes to avoid
    confusion. The attributes are:


    +   * value - what you get when you access the property

    * writable - can you change this property

    * enumerable - should appear in for...in loops

    * configurable - you can delete it

    * set() - a function called any time you update the value

    * get() - called when you access the value of the property'
