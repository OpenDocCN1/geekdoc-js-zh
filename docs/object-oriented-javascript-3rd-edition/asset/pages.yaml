    \ to the function:\n\n```\nfunction multi() {\n  var n = {}, stuff, j = 0, len\
    \ = arguments.length;\n  for (j = 0; j<len; j++) {\n    stuff = arguments[j];\n\
    \    for (var i in stuff) {\n      if (stuff.hasOwnProperty(i)) {\n        n[i]\
    \ = stuff[i];\n      }\n    }\n  }\n  return n;\n}\n```\n\nLet's test this by\
    \ creating three objects-shape,twoDee, and a third, unnamed object. creating a\
    \ triangle object means calling multi() and passing all three objects:\n\n```\n\
    var shape = {\n  name: 'Shape',\n  toString: function () {\n    return this.name;\n\
    \  }\n};\nvar twoDee = {\n  name: '2D shape',\n  dimensions: 2\n};\nvar triangle\
    \ = multi(shape, twoDee, {\n  name: 'Triangle',\n  getArea: function () {\n  \
    \  return this.side * this.height / 2;\n  },\n  side: 5,\n  height: 10\n});\n\
