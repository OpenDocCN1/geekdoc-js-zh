  md: "# 5\nES6 Iterators and Generators\n\nSo far, we have discussed language-level\
    \ constructs of JavaScript without looking at any specific language version. In\
    \ this chapter, however, we will primarily focus on a few language features introduced\
    \ in ES6. These features have a big impact on how you write JavaScript code. Not\
    \ only do they improve the language significantly, they also offer several functional\
    \ programming constructs unavailable to JavaScript programmers thus far.\n\nIn\
    \ this chapter, we will take a look at newly introduced iterators and generators\
    \ in ES6. With that knowledge, we will proceed to take a detailed look at the\
    \ enhanced Collections constructs.\n\n# For...of loop\n\nFor...of loops are introduced\
    \ in ES6 along with the iterable and iterator constructs. The new loop replaces\
    \ both the for...in and for...each loop constructs of ES5. As the for...of loop\
    \ supports the iteration protocol, it can be used on built-in objects such as\
    \ arrays, strings, maps, sets, and so on, and custom objects that are iterables.\
    \ Consider the following piece of code as an example:\n\n```\nconst iter = ['a',\
    \ 'b'];\nfor (const i of iter) {\n  console.log(i);\n}\n\"a\"\n\"b\"\n\n```"
  merge: -1
  pgno: 205
- img_proc: true
  md: "# ES6 Iterators and Generators\n\nThe `for...of` loop works with iterables\
    \ and built-ins like iterables. If you notice, we are using `const` instead of\
    \ `var` when we define the loop variable. This is a good practice because you\
    \ use `const`, a fresh variable is created with a new binding and storage space.\
    \ You should use `const` over `var` declaration with the `for...of` loop when\
    \ you don't intend to modify the loop variable inside the block.\n\nOther collections\
    \ support `for...of` over a `var`. For example, as a string is a sequence of Unicode\
    \ characters, `for...of` loop works just:\n\n```\nfor (let c of \"String\") {\n\
    \  console.log(c);\n}\n// \"s\" \"t\" \"r\" \"i\" \"n\" \"g\"\n```\n\nThe main\
    \ difference between `for...in` and `for...of` loop is that the `for...in` iterates\
    \ through all enumerable properties of an object. `For...of` loop has a specific\
    \ purpose, and that is to follow the iteration behavior based on how the object\
    \ defines the iterable protocol.\n\n# Iterators and iterables\n\nES6 introduces\
    \ a new mechanism of iteration over data. Traversing a list of data and doing\
    \ something with it is a very common operation. ES6 enhances the iteration constructs.\
    \ There are two primary concepts involved with this change–iterators and iterables.\n\
    \n# Iterators\n\nA JavaScript iter is an object that exposes the `next()` method.\
    \ This method returns the next item from the collection in the form of an object\
    \ that has two properties–done and value. In the following example, we will return\
    \ an iterator from an array by exposing the `next()` method:\n\n```\n//Take an\
    \ array and return an iterator\nfunction iter(array) {\n  var nextId = 0;\n  return\
    \ {\n    next: function () {\n      if(nextId < array.length) {\n        return\
    \ {value: array[nextId++], done: false};\n      } else {\n        return {done:\
    \ true};\n      }\n    }\n  };\n}\n```"
  merge: -1
  pgno: 206
