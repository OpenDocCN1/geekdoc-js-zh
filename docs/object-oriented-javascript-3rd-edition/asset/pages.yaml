  md: "# Reactive Programming and React\n\nBefore we create a HelloWorld react component,\
    \ a couple of important things to notice far.\n\nIn App.js and index.js, we are\
    \ importing two libraries necessary to create react components. Consider the following\
    \ lines of code:\n\n```\nimport React from 'react';\nimport ReactDOM from 'react-dom';\"\
    ,\n```\n\nHere, we're importing React, which is the library that allows us to\
    \ build react components. We're also importing ReactDOM, which is the library\
    \ that allows us to place our components and work with them in the context of\
    \ the DOM. Then, we're importing the component that we just worked on-the App\
    \ component.\n\nWe created our first component in App.js. Consider the following\
    \ line of code:\n\n```\nconst App = () => <h1>Hello React</h1>\n```\n\nThis is\
    \ a stateless function component. The other way to create a component is to create\
    \ a class component. We can replace the preceding component with the following\
    \ class component:\n\n```\nclass App extends React.Component {\n  render() {\n\
    \    return <h1>Hello World</h1>\n  }\n}\n```\n\nThere are a bunch of interesting\
    \ things going on here. The superclass we are creating a class component with\
    \ the class keyword that extends from the React.Component.\n\nOur component App\
    \ is a react component class or react component type. A component takes in parameters,\
    \ also called props, and returns a hierarchy of views to display via the render\
    \ function.\n\nThe render method returns a description of what you want to render,\
    \ and then takes that description and renders it to the screen. In particular,\
    \ render returns a react element, which is a lightweight description of what you\
    \ render. Most developers use a syntax called JSX which makes it easier to write\
    \ these structures. The <div /> syntax is transformed at build time to React.createElement('div').\
    \ The JSX expression, <h1>Hello World</h1>, is transformed at build time into\
    \ the following:\n\n```\nreturn React.createElement('h1', null, 'Hello World');\n\
    ```"
