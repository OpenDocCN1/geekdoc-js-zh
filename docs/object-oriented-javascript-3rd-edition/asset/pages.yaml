  md: 'In this example, the first <script> tag includes an external file, somefile.js,
    which contains JavaScript code. The second <script> tag includes the JavaScript
    code directly in the HTML code of the page. The browser executes the JavaScript
    code in the sequence it finds on the page and all the code in all tags share the
