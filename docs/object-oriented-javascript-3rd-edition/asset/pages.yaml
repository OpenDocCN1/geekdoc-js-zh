    \ method as follows:\n\n```\nvar tree = {};\ntree.decorator = function () {\n\
    \  alert('Make sure the tree won't fall');\n};\n```\n\nNow, let's implement a\
    \ `Decorator()` method that adds extra decorators. The decorators will be implemented\
    \ as constructor functions, and they'll all inherit from the base `tree` object\
    \ as:\n\n```\ngetDecorator = function (deco) {\ntree[deco].prototype = this;\n\
    return new tree[deco];\n};\n```\n\nNow, let's create the first decorator, `RedBalls()`,\
    \ as a property of `tree`, in order to keep the global namespace cleaner. The\
    \ red balls also provide a `decorate()` method, but they make sure they call their\
    \ parent's `decorate()` first. For example, take a look at the following code:\n\
    \n```\ntree.RedBalls = function () {\nthis.decorate = function () {\n  this.RedBalls.prototype.decorate();\n\
