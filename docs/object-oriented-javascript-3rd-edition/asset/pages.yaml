  md: '# Object-Oriented JavaScript


    # Aggregation


    Combining several objects into a new one is known as aggregation or composition.
    It''s a powerful way to separate a problem into smaller and more manageable parts
    (divide and conquer). When a problem scope is so complex that it''s impossible
    to think about it at a detailed level you can separate the problem into several
    smaller areas, and possibly separate each of these into several chunks. This allows
    you to think about the problem on several levels of abstraction.


    Take, for example, a personal computer. It''s a complex object. You cannot think
    about all the things that need to happen when you start your computer. But, you
    can abstract the problem by saying you initialize all the separate objects that
    your Computer object consists of the Monitor object, the Mouse object, the Keyboard
    object, and so on. Then, you can dive deeper into each of the subobjects. This
    way, you''re composing complex objects by assembling reusable parts.


    To use another analogy, a Book object can contain (aggregate) one or more Author
    objects, a Publisher object, several Chapter objects, a TOC (table of contents),
    and so on.


    # Inheritance


    Inheritance is an elegant way to reuse existing code. For example, you can have
    a generic object, Person, which has properties such as name and date_of_birth,
    and which also implements the walk, talk, sleep, and eat functionality. Then,
    you figure out that you need another object called Programmer. You can reimplement
    all the methods and properties that a Person object has, but it will be smarter
    to just say that the Programmer inherits a Person object, and save yourself some
    work. The Programmer only needs to implement more specific functionality, such
    as the writeCode method, while reusing all of the Person object''s functionality.


    In classical OOP, classes inherit from other classes, but in JavaScript, as there
    are no classes, objects inherit from other objects.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Object-Oriented JavaScript


    When an object inherits from another object, it usually adds new methods to the
    inherited ones, thus extending the old object. Often, the following phrases can
    be used interchangeably–B inherits from A and B extends A. Also, the object that
    inherits can pick one or more methods and redefine them, customizing for its own
    needs. This way, the interface stays the same and the method name is the same,
    but when called on the new object, the method behaves differently. This way of
    redefining how an inherited method works is known as overriding.


    # Polymorphism


    In the preceding example, a Programmer object inherited all the methods of the
    parent Person object. This means that both objects provide a talk method, among
    others. Now imagine that in your code, there''s a variable called Bob, and it
    just happens that you don''t know if Bob is a Person object or a Programmer object.
    You can still call the talk method on the Bob object and the code will work. This
    ability to call the same method on different objects, and each of them respond
    in their own way, is called polymorphism.


    # OOP summary


    Here''s a quick table summarizing the concepts discussed so far:


    | Feature | Illustrates concept |

    | --- | --- |

    | Bob is a man (an object). | Objects |

    | Bob''s date of birth is June 1, 1980, gender – male, and hair – black. | Properties
    |

    | Bob can eat, sleep, drink, talk, and calculate his own age. | Methods |

