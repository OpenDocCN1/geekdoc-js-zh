  md: "Primitive Data Types, Arrays, Loops, and Conditions\n\n# The else clause\n\n\
    There can also be an optional else part of the if condition. The else statement\
    \ is followed by a block of code that runs if the condition evaluates to false:\n\
    \n```\nif (a > 2) {\n    result = 'a is greater than 2';\n} else {\n    result\
    \ = 'a is NOT greater than 2';\n}\n```\n\nIn the between if and the else statements,\
    \ there can also be an unlimited number of else...if conditions. Here's an example:\n\
    \n```\nif (a > 2 || a < -2) {\n    result = 'a is not between -2 and 2';\n} else\
