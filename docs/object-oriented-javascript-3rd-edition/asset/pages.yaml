  md: "# The Browser Environment\n\nRemoving with innerHTML is fast and easy. The\
    \ DOM-only way will be to go over all of the child nodes and remove each one individually.\
    \ Here's a little function that removes all nodes from a given start node:\n\n\
    ```\nfunction removeAll(n) {\n  while (n.firstChild) {\n    n.removeChild(n.firstChild);\n\
    \  }\n}\n```\n\nIf you want to delete all the children from the body element with\
    \ an empty <body></body>, use the following code:\n\n+   - removeAll(document.body);\n\
    \n# HTML – only DOM objects\n\nAs you already know, the DOM applies to both XML\
    \ and HTML documents. What you've learned earlier about traversing the tree and\
    \ then adding, removing, or modifying nodes, applies to any XML document. There\
    \ are, however, some HTML-only objects and properties.\n\ndocument.body is one\
    \ such HTML-only object. It's so common to have a <body> tag in HTML documents,\
    \ and it's accessed so often, that it makes sense to have an object's shorter\
    \ and friendlier than the equivalent document.getElementsByTagName('body') [0].\n\
    \ndocument.body element is one example of a legacy inherited from the prehistoric\
    \ DOM Level 0 and moved to the HTML extension of the DOM specification. There\
    \ are other objects similar to document.body element. For some of them, there\
    \ is no core DOM equivalent, for others, there is an equivalent; however, the\
    \ DOM 0 original was anyway ported for simplicity and legacy purposes. Let's see\
    \ some of those objects."
