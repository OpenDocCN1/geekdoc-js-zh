    \ the following example:\n\n```\n// object together with the method declarations\n\
    MYAPP.event = {\n  addEventListener: function (el, type, fn) {\n    // ... do\
    \ the thing\n  },\n  removeListener: function (el, type, fn) {\n    // ...\n \
    \ },\n  getEvent: function (e) {\n    // ...\n  },\n  // ... other methods or\
    \ properties\n};\n```\n\n# Namespaced constructors\n\nUsing a namespace doesn't\
    \ prevent you from creating constructor functions. Here is how you can have a\
    \ DOM utility that has an Element constructor, which allows you to create DOM\
    \ elements easily:\n\n```\nMYAPP.dom = {};\nMYAPP.dom.Element = function (type,\
    \ properties) {\n  var tmp = document.createElement(type);\n  for (var i in properties)\
    \ {\n    if (properties.hasOwnProperty(i)) {\n      tmp.setAttribute(i, properties[i]);\n\
    \    }\n  }\n  return tmp;\n};\n```"
