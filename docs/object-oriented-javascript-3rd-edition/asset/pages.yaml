  md: '# #4 Objects


    Now that you''ve mastered JavaScript''s primitive data types, arrays, and functions,
    it''s time to stay true to the promise of the book title and talk about objects.


    JavaScript has an eccentric take on the classical Object-oriented programming.
    Object-oriented programming is one of the most popular programming paradigms and
    has been a mainstream in most of programming languages like Java and C++. There
    are well defined ideas proposed by classical OOP that most of these languages
    adopt. JavaScript, however, has a different take on it. We will look JavaScript''s
    way of supporting OOP.


    In this chapter, you will learn the following topics:


    +   - How to create and use objects

    - What are the constructor functions

    - What types of built-in JavaScript objects exist and what they can do for you


    # ## From arrays to objects


    As you already know from Chapter 2, Primitive Data Types, Arrays, Loops, and Conditions,
    an array is a list of values. Each value has an index (numeric key) that starts
    from zero and increments by one for each value. Consider the following example:


    ```

    > var myarr = [''red'', ''blue'', ''yellow'', ''purple''];

    > myarr;

    ["red", "blue", "yellow", "purple"].

    > myarr[0];

    "red"

    > myarr[3];

    "purple"

    ```'
