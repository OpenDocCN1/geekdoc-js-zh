  md: "# What is a function?\n\nFunctions allow you to group together a code, give\
    \ it a name, and reuse it later, addressing\nit by the name you gave it it. Let's\
    \ consider the following code as an example:\n\n```\nfunction sum(a, b) {\n  var\
    \ c = a + b;\n  return c;\n}\n```\n\nThe parts that make up a function are shown\
    \ as follows:\n\n+   * The function keyword.\n* The name of the function; in this\
    \ case, sum.\n* The function parameters; in this case, a and b. A function can\
    \ take any number of parameters, or no parameters, separated by commas.\n* A code\
    \ block, also called the body of the function.\n* The return statement. A function\
    \ always returns a value. If it doesn't return a value explicitly, it implicitly\
    \ returns the value undefined.\n\nNote that a function can only return a single\
    \ value. If you need to return more values,\nYou can simply return an array that\
    \ contains all of the values you need as elements of this array.\n\nThe preceding\
    \ syntax is called a function declaration. It's just one of the ways to create\
    \ a\nfunction in JavaScript, and more ways are coming up.\n\n# Calling a function\n\
    \nIn order to make use of a function, you will need to call it. You can call a\
    \ function simply\nusing its name, optionally, followed by any number of values\
    \ in parentheses. To invoke a\nfunction is another way of saying to call.\n\n\
    Let's call the sum() function, passing two arguments and assigning the value that\
    \ the\nfunction returns to the variable result:\n\n```\n> var result = sum(1,\
    \ 2);\n> result;\n3\n```"
  merge: -1
  pgno: 92
- img_proc: true
  md: "# Parameters\n\nWhen defining a function, you can specify what parameters the\
    \ function expects to receive when it's called. A function may not require any\
    \ parameters, but if it does, and you forget to pass them, JavaScript will assign\
    \ the undefined value to the ones skipped. In the next example, the function returns\
    \ NaN because it tries to sum 1 and undefined:\n\n```\n> sum(1);\nNaN\n```\n\n\
    Technically speaking, there is a difference between parameters and arguments,\
    \ although the two are often used interchangeably. Parameters are defined together\
    \ with the function, although arguments are passed to the function when it's called.\
    \ Consider the following example:\n\n```\n> function sum(a, b) {\n  return a +\
    \ b;\n}\n> sum(1, 2);\n```\n\nHere, a and b are parameters, 1 and 2 are arguments.\n\
    \nJavaScript is not picky when it comes to accepting arguments. If you pass more\
    \ than the function expects, the extras will be silently ignored, as shown in\
    \ the following example:\n\n```\n> sum(1, 2, 3, 4, 5);\n\n```\n\nWhat's more,\
    \ you can create functions that are flexible about the number of parameters they\
    \ accept. This is possible through the special value arguments that are created\
    \ automatically inside each function. Here's a function that simply returns whatever\
    \ arguments are passed to it:\n\n```\n> function args() {\n  return arguments;\n\
    }\n> args();\n[]\n> args(1, 2, 3, 4, true, 'ninja');\n[1, 2, 3, 4, true, \"ninja\"\
    ]\n```"
  merge: -1
