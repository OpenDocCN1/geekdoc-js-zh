  md: '# About the Authors


    Ved Antani has been building scalable server and mobile platforms using JavaScript,
    Go, and Java since 2005. He is an associate vice president at Myntra and has previously
    worked at Electronic Arts and Oracle. He is an avid reader and author on several
    subjects. He has studied computer science and currently lives in Bangalore, India.
    Ved is passionate about classical music and loves to spend time with his son.


    Writing this book required a significant investment of my time, and I would like
    to thank my parents and family for their support and encouragement during those
    long days and weekends when I was practically invisible.


    Stoyan Stefanov is a Facebook engineer, author, and speaker. He talks regularly
    about web development topics at conferences, and his blog, www.phpied.com. He
    also runs a number of other sites, including JSPatterns.com - a site dedicated
    to exploring JavaScript patterns. Previously at Yahoo!, Stoyan was the architect
    of YSlow 2.0 and creator of the image optimization tool.


    "citizen of the world", Stoyan was born and raised in Bulgaria, but is also a
    Canadian citizen, currently residing in Los Angeles, California. In his offline
    moments, he enjoys playing the guitar, taking flying lessons, and spending time
    at the Santa Monica beaches with his family.


