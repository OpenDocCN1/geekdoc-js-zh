  md: 'Functions


    # # Encode/decode URIs


    In a Uniform Resource Locator (URL) or a Uniform Resource Identifier (URI), some
    characters have special meanings. If you want to escape those characters, you
    can use the `encodeURI()` or `encodeURIComponent()` functions. The first one will
    return a usable URL, while the second one assumes you are only passing a part
    of the URL, such as a query string for example, and will encode all applicable
    characters, as follows:


    ```

    > var url = ''http://www.packpub.com/script.php?q=this and that'';

    > encodeURI(url);

    > "http://www.packpub.com/script.php?q=this%20and%20that"

    > encodeURIComponent();

    > "http%3A%2F%2Fwww.packpub.com%2Fscript.php%3Fq%3Dthis%20and%20that"

    ```


    The opposites of `encodeURI()` and `encodeURIComponent()` are `decodeURI()` and
    `decodeURIComponent()`, respectively.


    Sometimes, in legacy code, you might see the functions `escape()` and `unescape()`
    used to encode and decode URLs, but these functions have been deprecated; they
    encode differently and should not be used.


    # # eval()


    The `eval()` function takes a string input and executes it as a JavaScript code,
    as follows:


    ```

    > eval(''var ii = 2'');

    > ii;

    2

    ```


    `eval(''var ii = 2'')` is the same as `var ii = 2;;


    The `eval()` function can be useful, but it should be avoided if there are other
    options. Most of the time, there are alternatives, and in most cases, the alternatives
    are more elegant and easier to write and maintain. `eval` is a mantra you can
    often hear from seasoned JavaScript programmers. The drawbacks of `eval()` are
    as follows:


    +   * **Security:** JavaScript is powerful, which also means it can cause damage.
    If you don''t trust the source of the input you pass to `eval()`, just don''t
    use it.

    * **Performance:** It''s slower to evaluate live code than to have the code compiled
    directly in the script.


    [ 84 ]'
