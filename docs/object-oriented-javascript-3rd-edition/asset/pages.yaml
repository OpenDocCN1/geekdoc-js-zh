  md: '# Object-Oriented JavaScript


    # # Browser support for ES6


    The majority of the browsers and server frameworks are on their way towards implementing
    ES6 features. You can check out what is supported and what is not by clicking
    `http://kangax.github.io/compat-table/es6/.


    Though ES6 is not fully supported on all browsers and server frameworks, we can
    start using almost all features of ES6 with the **help of transpilers**. Transpilers
    are source-to-source compilers allow you to write code in ES6 syntax and compile/transform
    them into equivalent ES5 syntax, which can be run on browsers that do not support
    the entire range of ES6 features.


    The de facto ES6 transpiler at the moment is Babel. In this book, we will use
    Babel and write test our examples.


    # # Babel


    Babel supports almost all ES6 features out of the box or with custom plugins.
    Babel can be used from a wide range of build systems, frameworks, and languages
    to template engines, and has a good command line and **read-eval-print loop**
    (REPL) built in.


    To get a good idea how Babel transpiles ES6 to its ES5 equivalent form, head over
    to Babel REPL `http://babeljs.io/repl/.


    Babel REPL allows you to quickly test small snippets of ES6. When you open Babel
    REPL in the browser, you will see some ES6 code defaulted. On the left pane, remove
    the code and type in the following text:


    ```

    var name = "John", mood = "happy";nconsole.log(`Hey ${name}, are you feeling ${mood}
    today?`)

    ```


    When you type this and out of the left pane, you will see REPL transpiling this
    ES6 code into something like the following code:


    ```

    "use strict";

    var name = "John";

    mood = "happy";

    console.log("Hey " + name + ", ");

    nare you feeling " + mood + " today today?");

    ```'
