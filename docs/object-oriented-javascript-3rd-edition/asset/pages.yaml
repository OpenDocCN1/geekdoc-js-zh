  md: "# Using window.location property\n\nThe location property points to an object\
    \ that contains information about the URL of\ncurrently loaded page. For example,\
    \ location.href is the full URL and\nlocation.hostname is only the domain. With\
    \ a simple loop, you can see the full list of\nproperties of the location object.\n\
    \nImagine you're on a page with the following URL:\n\n```\nhttp://search.phpied.com:8080/search?q=java&what=results.\n\
    ```\n\nConsider the following code:\n\n```\nfor (var i in location) {\n  if (typeof\
