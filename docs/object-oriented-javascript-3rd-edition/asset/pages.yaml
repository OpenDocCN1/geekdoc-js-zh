  md: '# Prototype chaining


    Let''s start with the default way of implementing inheritance – inheritance chaining
    through the prototype.


    As you already know, every function has a prototype property, which points to
    an object. When a function is invoked using the new operator, an object is created
    and returned. This new object has a secret link to the prototype object. The secret
    link (called __proto__ in some environments allows methods and properties of the
    prototype object to be used as if they belong to the newly created object.


    The prototype object is just a regular object and, therefore, it also has the
    secret link to the prototype. And so, a chain called a prototype chain is created:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_238_0.png)


    In this illustration, an object A contains a number of properties. One of the
    properties is the hidden __proto__ property, which points to another object, B''s
    __proto__ property points to C. This chain ends with the Object.prototype object,
    the grandparent, and every object inherits from it.


    This is good to know, but how does it help you? The practical side is when object
    A lacks a property but B has it, A can still access this property as its own.
    The same applies if B also doesn''t have the required property, but C does. This
    is how inheritance takes place – an object can access any property found somewhere
    down the inheritance chain.


    Throughout this chapter, you will see different examples that use the following
    hierarchy – a generic Shape parent is inherited by a 2D shape, which in turn is
    inherited by any number of specific two-dimensional shapes such as a triangle,
    rectangle, and so on.'
  merge: -1
