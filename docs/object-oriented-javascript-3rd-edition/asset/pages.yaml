  md: '# Core DOM and HTML DOM


    One last diversion before moving on to more practical examples. As you now know,
    the DOM represents both XML documents and HTML documents. In fact, HTML documents
    are XML documents, but a little more specific. Therefore, as part of DOM Level
    1, there is a Core DOM specification that is applicable to all XML documents,
    and there is also an HTML DOM specification, which extends and builds upon the
    core DOM. Of course, the HTML DOM doesn''t apply to all XML documents, but only
    to HTML documents. Let''s see some examples of Core DOM and HTML DOM constructors:


    | Constructor | Inherits from | Comment |

    | --- | --- | --- |

    | Node | Core | Any node on the tree |

    | Document | Core | The document object, the main entry point to any XML document
    |

    | HTMLDocument | HTML | This is window,or simply document, the HTML-specific version
    of the previous object, which you''ll use extensively |

    | Element | Core | Every tag in the source is represented by an element. That''s
    why you say-the <p></p> tag |

    | HTMLElement | HTML | General-purpose constructor, all constructors for HTML
    elements inherit from it |

    | HTMLBodyElement | HTMLElement | HTML | Element representing the <body> tag |

    | HTMLLinkElement | HTMLElement | HTML | An element: an <a href="...\</a> tag
    |

    | And other such constructors | HTMLElement | HTML | All the rest of HTML elements
    |

    | CharacterData | Node | General-purpose constructor for dealing with texts |

    | Text | CharacterData | Text node inside a tag; in <em>EM</em>, you have the
    text node EM and the text node with value second |'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# The Browser Environment


    | Constructor | Inherits from | Core or HTML | Comment |

    |---|---|---|--|

    | Comment | CharacterData | Core | <!-- any comment --> |

    | Attr | Node | Core | Represents an attribute of a tag; in <p id="closer"> the
    id attribute is a DOM object created by the Attr() constructor |

    | NodeList | | Core | A list of nodes, an array-like object that has a length
    property |

    | NamedNodeMap | | Core | Same as NodeList, but the nodes can be accessed by name,
    not only by numeric index. |

    | HTMLCollection | | HTML | Similar to NamedNodeMap but specific for HTML. |


    Each, by no means, all of the Core DOM and HTML DOM objects. For the full list,
    consult http://www.w3.org/TR/DOM-Level-1/.


    Now that this bit of the DOM theory is behind you, let''s focus on the practical
    side of working with the DOM. In the following sections, you''ll learn how to
    do the following topics:


    +   * Access DOM nodes

    * Modify nodes

    * Create new nodes

    * Remove nodes


