  md: '> ECMAScript 5 removes the octal literal values and avoids the confusion with
    parseInt() and unspecified radix.


    # parseFloat()


    The parseFloat() function is similar to the parseInt() function, but it also looks
    for decimals when trying to figure out a number from your input. This function
    takes only one parameter, which is as follows:


    +   > parseFloat(''123'');

    123

    > parseFloat(''1.23'');

    1.23

    > parseFloat(''1.23abc.00'');

    1.23

    > parseFloat(''a.bc1.23'');

    NaN


    As with parseInt(), parseFloat() gives up at the first occurrence of an unexpected
    character, even though the rest of the string might have usable numbers in it:


    +   > parseFloat(''a123.34'');

    NaN

    > parseFloat(''12a3.34'');

    12


    The parseFloat() function understands exponents in the input (unlike parseInt()):


    +   > parseFloat(''123e-2'');

    1.23

    > parseFloat(''1e10'');

    10000000000

    > parseInt(''1e10'');

    1'
