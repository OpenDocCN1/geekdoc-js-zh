    I firmly believe that the best way to learn a programming language is by writing
    code. There are no cut-and-paste-ready code downloads that you simply put in your
    pages. On the contrary, you''re expected to type in code, see how it works, and
    then tweak it and play around it. When trying out the code examples, you''re encouraged
    to enter the code into a JavaScript console. Let''s see how you go about this.


    As a developer, you most likely already have a number of web browsers installed
    on your system, such as Firefox, Safari, Chrome, or Internet Explorer. All modern
    browsers have a JavaScript console feature that you will use throughout the book
    to help you learn and experiment with the language. More specifically, this book
    uses WebKit console, which is available in Safari and Chrome, but the examples
    should work in any other console.'
