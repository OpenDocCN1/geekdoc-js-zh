- img_proc: true
  md: "# Inheritance\n\nThe triangle failed to get the Shape function's prototype\
    \ properties because there was never a new Shape() instance created, so the prototype\
    \ was never used. However, you saw how to do this at the beginning of this chapter.\
    \ You can redefine Triangle as follows:\n\n```\nfunction Triangle() {\n  Shape.apply(this,\
    \ arguments);\n}\nTriangle.prototype = new Shape();\nTriangle.prototype.name =\
    \ 'Triangle';\n```\n\nIn this inheritance pattern, the parent's own properties\
    \ are recreated as the child's own properties. If a child inherits an array or\
    \ other object, it's a completely new value (not a reference), and modifying it\
    \ won't affect the parent.\n\nThe drawback is that the parent's constructor gets\
    \ called twice—once with apply() to inherit own properties and once with new to\
    \ inherit the prototype. In fact, the properties of the parent are inherited twice.\
    \ Let's take this simplified scenario:\n\n```\nfunction Shape(id) {\n  this.id\
    \ = id;\n}\nfunction Triangle() {\n  Shape.apply(this, arguments);\n}\nTriangle.prototype\
    \ = new Shape(101);\n```\n\nHere, we will create a new instance:\n\n```\n>var\
    \ t = new Triangle(202);\n>t.id;\n202\n```\n\nThere's an own property id, but\
    \ there's also one that comes down the prototype chain, ready to shine through:\n\
    \n```\n>t.__proto__.id;\n101\n> delete t.id;\ntrue\n>t.id;\n101\n```"
  merge: -1
  pgno: 267
- img_proc: true
  md: "# Borrowing a constructor and copying its prototype\n\nThe problem of the double\
    \ work performed by calling the constructor twice can easily be corrected. You\
    \ can call apply() on the parent constructor to get all own properties and then\
    \ copy the prototype's properties using a simple iteration (or extend2()) as discussed\
    \ previously:\n\n```\nfunction Shape(id) {\n  this.id = id;\n}\nShape.prototype.name\
    \ = 'Shape';\nShape.prototype.toString = function () {\n  return this.name;\n\
    }\n\nfunction Triangle() {\n  Shape.apply(this, arguments);\n}\nextend2(Triangle,\
    \ Shape);\nTriangle.prototype.name = 'Triangle';\n```\n\nLets test the following\
    \ code:\n\n```\n>var t = new Triangle(101);\n>t.toString();\n>\"Triangle\"\n>t.id;\n\
    101\n```\n\nNo double inheritance:\n\n```\n>typeof t.__proto__.id;\n\"undefined\"\
    \n```\n\nThe extend2() method also gives access to uber if needed:\n\n```\n>t.uber.name;\n\
    \"Shape\"\n```"
