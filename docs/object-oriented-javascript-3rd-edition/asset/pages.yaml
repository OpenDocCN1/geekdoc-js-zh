  md: '# Inheritance Example Classification Notes


    | # | Name | Example | Notes |

    | --- | --- | --- | --- |

    | 7 | Prototypal inheritance | function object(o) { function F() {} F.prototype
    = o; return new F(); } | • Works with objects • Uses the prototype chain | No
    pseudo-classes, objects inherit from objects • Leverages the benefits of the prototype
    |

    | 8 | Extend and augment | function objectPlus(o, stuff) { var n {}; function
    F() {} F.prototype = o; return new F(); n.umber = { for (var i in stuff) { n[i]
    = stuff[i]; } return n; } } | • Works with objects • Uses the prototype chain
    • Copies properties | Mix of prototypal inheritance (#7) and copying properties
    • One function call to inherit and extend at the same time |

    | 9 | Multiple inheritance | function multi() { var n = {}, stuff, j = 0; len
    = arguments.length; for (j = 0; j<len; j++) { stuff = arguments[j]; } for (var
    i in stuff) { n[i] = stuff[i]; } return n; } } | • Works with objects • Copies
    properties | A mixin-style implementation • Copies all the properties of all the
    parent objects in the order of appearance |

    | 10 | Parasitic inheritance | function parasite(victim) { var that = object(victim);
    that.more = 1; return that; } | • Works with objects • Uses the prototype chain
    | Constructor-like function creates objects • Copies an object, and augments and
    returns the copy |'
