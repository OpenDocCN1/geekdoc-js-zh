  md: "# Using window.setTimeout() and window.setInterval() methods\n\nThe `setTimeout()`\
    \ and `setInterval()` methods allow scheduling the execution of a piece of code.\
    \ The `setTimeout()` method attempts to execute the given code once, after a specified\
    \ number of milliseconds. The `setInterval()` method attempts to execute repeatedly\
    \ after approximately a specified number of milliseconds has passed.\n\nThis shows\
    \ an alert after approximately 2 seconds (2000 milliseconds). Consider the following\
    \ code:\n\n```\n> function boo() { alert('Boo!'); }\n> setTimeout(boo, 2000);\n\
    \  4\n```\n\nAs you can see, the function returned an integer (in this case, 4)\
    \ representing the ID of the timeout. You can use this to cancel the timeout using\
    \ `clearTimeout`. In the following example, if you're quick enough, and clear\
    \ the timeout before 2 seconds have passed, the alert will never be shown, as\
    \ you can see in the following code:\n\n```\n> var id = setTimeout(boo, 2000);\n\
    > clearTimeout(id);\n```\n\nLet's change `boo()` to something less intrusive,\
    \ as follows:\n\n```\n> function boo() { console.log('boo'); }\n```\n\nNow, using\
    \ `setInterval()`, you can schedule `boo()` to execute every 2 seconds, until\
    \ you cancel the scheduled execution with `clearInterval`. Consider the following\
    \ code:\n\n```\n> var id = setInterval(boo, 2000);\n  boo\n  boo\n  boo\n  boo\n\
    \  boo\n  boo\n> clearInterval(id);\n```\n\nNote that both functions accept a\
    \ pointer to a callback function as a first parameter. They can also accept a\
    \ string, which is evaluated with `eval()`; however, as you know, `eval()` is\
    \ evil, so it should be avoided. Moreover, what if you want to pass arguments\
    \ to the function? In such cases, you can just wrap the function call inside another\
    \ function."
  merge: -1
  pgno: 325
- img_proc: true
  md: "# The Browser Environment\n\nThe following code is valid, but not recommended:\n\
    \n```\n// bad idea\nvar id = setInterval('alert('boo, boo', 2000);\n```\n\nThis\
    \ alternative is preferred:\n\n```\nvar id = setInterval(\nfunction () {\n  alert('boo,\
    \ boo');\n},\n2000\n);\n```\n\nBe aware that scheduling a function in some amount\
    \ of milliseconds is not a guarantee that it will execute exactly at that time.\
    \ One reason is that most browsers don't have millisecond resolution time. There\
    \ is a minimum of 15 in older IEs and sooner in more modern browsers, but most\
    \ likely, not in 1 millisecond. The other reason is that the browsers maintain\
    \ a queue of what you request them to do. 100 milliseconds timeout means add to\
    \ the queue after 100 milliseconds. However, if the queue is delayed by something\
    \ slow happening, your function will have to wait and execute after, 120 milliseconds.\n\
    \nMore recent browsers implement the requestAnimationFrame() function. It's preferable\
    \ to the timeout functions because you're asking the browser to call your function\
    \ whenever it has available resources, not after a predefined time in milliseconds.\
    \ Try executing the following code snippet in your console:\n\n```\nfunction animateMe()\
    \ {\n  webkitRequestAnimationFrame(function () {\n    console.log(new Date());\n\
    \    animateMe();\n  });\n}\n```\n\n```\nanimateMe();\n```"
