  md: '# Object-Oriented JavaScript


    Everything changed in the years following the end of the browser wars. A number
    of events reshaped the web development landscape in a positive way. Some of them
    are given as follows:


    +   - Microsoft won the war with the introduction of IE6, the best browser at
    the time, and for many years they stopped developing Internet Explorer. This allowed
    for other browsers to catch up and even surpass IE''s capabilities.

    - The movement for web standards was embraced by developers and browser vendors
    alike. Naturally, developers didn''t like having to code everything two (or more)
    times to account for browsers'' differences; therefore, they liked the idea of
    having agreed-upon standards that everyone would follow.

    - Developers and technologies made more people started caring about things such
    as usability, progressive enhancement techniques, and accessibility. Tools such
    as Firebug made developers more productive and the development loss of a pain.


    In this healthier environment, developers started finding out new and better ways
    to use the instruments were already available. After the public release of applications
    such as Gmail and Google Maps, which were on client-side programming, it became
    clear that JavaScript is a mature, in certain ways, and prototypical object-oriented
    language. The best example of its rediscovery was the wide adoption of the functionality
    provided by the XMLHttpRequest object, which was once an IE-only innovation, but
    then implemented by most browsers. XMLHttpRequest allows JavaScript to make HTTP
    requests and get fresh content from the server in order to update some parts of
    a page without a full page reload. Due to the use of the XMLHttpRequest object,
    a new breed of desktop-like web applications, dubbed Ajax applications, was born.


    # The present


    An interesting thing about JavaScript is that it always runs inside a host environment.
    The web browser is just one of the available hosts. JavaScript can also run on
    the server, the desktop, and on mobile devices. Today, you can use JavaScript
    to do all of the following:


    +   - Create rich and powerful web applications (the kind of applications that
    run inside the web browser). Additions to HTML5, such as cache application, client-side
    storage, and databases, make browser programming more powerful for both online
    and offline applications. Powerful additions to Chrome WebKit also support for
    service workers and browser push notifications.

    - Write server-side code using Node.js, as well as code that can run using Rhino
    (a JavaScript engine written in Java).'
