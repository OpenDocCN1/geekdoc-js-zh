  md: "As you can see, there's no difference between a named function expression and\
    \ a function declaration. But they are, in fact, different. The only way to distinguish\
    \ between the two is to look at the context in which they are used. Function declarations\
    \ may only appear in program code (in a body of another function or in the main\
    \ program). You'll see many examples of functions later on in the book that will\
    \ clarify these concepts.\n\nWhen you use the typeof operator on a variable that\
    \ holds a function value, it returns the string \"function\" as shown in the following\
    \ example:\n\n```\n> function define() {\n  return 1;\n}\n\n> var express = function\
    \ () {\n  return 1;\n};\n\n> typeof define;\n  \"function\"\n\n> typeof express;\n\
    \  \"function\"\n```\n\nSo, JavaScript functions are data, but a special kind\
    \ of data with the following important features:\n\n+   - They contain code\n\
    - They are executable (they can be invoked)\n\nAs you have seen before, the way\
    \ to execute a function is by adding parentheses after its name. As the next example\
    \ demonstrates, this whereas regardless of how the function was defined. In the\
    \ example, you can also see how a function is treated as a regular value; it can\
    \ be copied to a different variable, as follows:\n\n```\n> var sum = function\
    \ (a, b) {\n  return a + b;\n}\n\n> var add = sum;\n> typeof add;\nfunction\n\
    > add(1, 2);\n3\n```"
