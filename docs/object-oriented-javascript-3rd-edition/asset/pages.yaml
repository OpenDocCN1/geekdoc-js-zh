    as shown in the following screenshot:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_439_0.png)


    # Life cycle events


    When we have a bunch of components with several state changes and events, the
    housekeeping becomes important. React provides you with several component life
    hooks to handle life events of components. Understanding the component life cycle
    will enable you to perform certain actions when a component is created or destroyed.
    Furthermore, it gives you the opportunity to decide if a component should be updated
    in the first place, and to react to state changes.


    There are three phases that the component goes through-mounting, updating, and
    unmounting. For each of these stages, we have hooks. Take a look at the following
    diagram:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_439_1.png)


