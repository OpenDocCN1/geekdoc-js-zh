  md: "Primitive Data Types, Arrays, Loops, and Conditions\n\n# Do-while loops\n\n\
    The do...while loops are a slight variation of while loops. An example is shown\
    \ as follows:\n\n```\nvar i = 0;\ndo {\n  i++;\n} while (i < 10);\n```\n\nHere,\
    \ the do statement is followed by a code block and a condition after the block.\
    \ This means that the code block is always executed, at least once, before the\
    \ condition is evaluated.\n\nIf you initialize i to 11 instead of 0 in the last\
    \ two examples, the code block in the first example (the while loop) will not\
    \ be executed, and i will still be 11 at the end, while in the second (the do...while\
    \ loop), the code block will be executed once and i will become 12.\n\n# For loops\n\
    \nThe for loop is the most widely used type of loop, and you should make sure\
    \ you're comfortable with this one. It requires just a little bit more in terms\
    \ of syntax:\n\n![](img/717ca68bb945a398c8e0c562c6cc94d7_85_0.png)\n\nIn addition\
    \ to the C condition and the L code block, you have the following:\n\n+   * Initialization:\
    \ This is the code that is executed before you even enter the loop (marked with\
    \ 0 in the diagram)\n* Increment: This is the code that is executed after every\
    \ iteration (marked with ++ in the diagram)"
