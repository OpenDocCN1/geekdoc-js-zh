  md: "# Classes and Modules\n\nHere, we are using the super keyword to call functions\
    \ from the parent class. The following are the three ways in which the super keyword\
    \ can be used:\n\n+   * You can use super(<params>) as a function call to invoke\
    \ the constructor of the parent class\n* You can use super.<parentClassMethod>\
    \ to access the parent class methods\n* You can use super.<parentClassProp> to\
    \ access the parent class properties\n\nIn the derive constructor, you must call\
    \ the super() method before you can use, this keyword; for example, the following\
    \ piece of code will fail:\n\n```\nclass Base {}\nclass Derive extends Base {\n\
    \  constructor(name) {\n    this.name = name; //'this' is not allowed before super()\n\
    \  }\n}\n```\n\nYou can't implicitly have a derived constructor with a super()\
    \ method as an error:\n\n```\nclass Base {}\nclass Derive extends Base {\n  constructor()\
    \ { //missing super() call in constructor\n}\n```\n\nIf you don't provide a constructor\
    \ for the base class, the following constructor is used:\n\n```\nconstructor()\
    \ {}\",\n```\n\nFor the derived classes, the default constructor is as follows:\n\
    \n```\nconstructor(...args) {\n  super(...args);\n}\n```\n\n# Mixins\n\nJavaScript\
    \ supports only single inheritance. At most, a class can have one superclass.\
