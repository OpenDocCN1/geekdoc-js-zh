  md: "# Constructor functions\n\nThere is another way to create objects–using constructor\
    \ functions. Let's look at an example:\n\n```\nfunction Hero() {\n  this.occupation\
    \ = 'Ninja';\n}\n```\n\nIn order to create an object using this function, you\
    \ can use the new operator as follows:\n\n```\n> var hero = new Hero();\n> hero.occupation;\n\
    > \"Ninja\"\n```\n\nA benefit of using constructor functions is that they accept\
    \ parameters, which can be used when creating new objects. Let's modify the constructor\
    \ to accept one parameter and add it to the name property:\n\n```\nfunction Hero(name)\
    \ {\n  this.name = name;\n  this.occupation = 'Ninja';\n  this.whoAreYou = function\
    \ () {\n    return \"I'm \" + this.name + \" and I'm a \" + this.occupation;\n\
    \  };\n}\n```\n\nNow, you can create different objects using the same constructor:\n\
    \n```\n> var h1 = new Hero('Michelangelo');\n> var h2 = new Hero('Donatello');\n\
    > h1.whoAreYou();\n> \"I'm Michelangelo and I'm a Ninja\"\n> h2.whoAreYou();\n\
    > \"I'm Donatello and I'm a Ninja\"\n```\n\nBy convention, you should capitalize\
    \ the first letter of your constructor functions so that you have a visual clue\
    \ that they are not intended to be called as regular functions.\n\n![](img/717ca68bb945a398c8e0c562c6cc94d7_142_0.png)"
