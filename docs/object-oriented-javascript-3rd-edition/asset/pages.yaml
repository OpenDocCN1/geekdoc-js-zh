  md: '# Infinity


    There is a special value in JavaScript called Infinity. It represents a number
    too big for JavaScript to handle. Infinity is indeed a number, as typing typeof
    Infinity in the console will confirm. You can also quickly check that a number
    with 308 zeros is ok, but 309 zeros is too much. To be precise, the biggest number
    JavaScript can handle is 1.797693148623157e308, while the smallest is 5e-324,
    Look at the following example:


    +   > Infinity;

    > Infinity

    > typeof Infinity;

    > "number"

    > ie309;

    > Infinity

    > ie308;

    > 1e+308;


    Dividing by zero gives you, infinity, for example:


    +   > var a = 6 / 0;

    > a;

    > Infinity


    Infinity is the biggest number (or rather a little bigger than the biggest), but
    how ever the smallest? It''s infinity with a minus sign in front of it; -Infinity,
    for example:


    +   > var i = -Infinity;

    > i;

    > -Infinity

    > typeof i;

    > "number"


    Does this mean you can have something that''s exactly twice as big as Infinity,
    from 0 to infinity and from 0 down to infinity? Well, not really. When you sum
    Infinity and -Infinity, you don''t get 0, but something that is called Not a Number
    (NaN), For example:


    +   > Infinity - Infinity;

    NaN

    > -Infinity + Infinity;

    NaN'
