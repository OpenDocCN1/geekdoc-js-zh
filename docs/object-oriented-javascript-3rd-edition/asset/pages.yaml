  md: "# Inheritance\n\nThe Triangle constructor takes three point objects and assigns\
    \ them to this.points (its own collection of points). Then, it implements the\
    \ getArea () method, using Heron's formula:\n\nArea = s(s-a) (s-b) (s-c)\n\ns\
    \ is the semi-perimeter (perimeter divided by two).\n\nNext comes the Rectangle\
    \ constructor. It receives one point (the upper-left point) and the lengths of\
    \ the two sides. Then, it populates its points array starting from that point:\n\
    \n```\nfunction Rectangle(p, side_a, side_b){\n  this.points = [\n  P,\n  new\
    \ Point(p.x + side_a, p.y),// top right\n  new Point(p.x + side_a, p.y + side_b),\
    \ // bottom right\n  new Point(p.x, p.y + side_b)// bottom left\n  };\n  this.getArea\
    \ = function () {\n    return side_a * side_b;\n  }\n}\n```\n\nThe last child\
    \ constructor Square. A square is a special case of a rectangle, so it makes sense\
    \ to use Rectangle. The easiest thing to do here is to borrow the constructor:\n\
    \n```\nfunction Square(p, side){\n  Rectangle.call(this, p, side, side);\n}\n\
    ```\n\nNow that all constructors are done, let's take care of inheritance. Any\
    \ pseudo-classical pattern (that one with constructors as objects to objects)\
    \ will do. Let's try using a modified and simplified version of the prototype-chaining\
    \ pattern (the first method described in this chapter). This pattern calls for\
    \ creating a new instance of the parent and setting it as the child's prototype.\
    \ In this case, it is not necessary to have a new instance for child-day they\
    \ can share it:\n\n```\nfunction () {\n  var s = new Shape();\n  Triangle.prototype\
    \ = s;\n  Rectangle.prototype = s;\n  Square.prototype = s;\n}();\n```"
