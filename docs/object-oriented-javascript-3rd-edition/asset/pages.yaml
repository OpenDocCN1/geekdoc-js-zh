  md: '# Predefined functions


    There are a number of functions that are built into the JavaScript engine and
    are available for you to use. Let''s take a look at them. While doing so, you''ll
    have a chance to experiment with functions, their arguments and return values,
    and become comfortable working with functions. The following is a list of the
    built-in functions:


    +   * parseInt()

    * parseFloat()

    * isNaN()

    * isFinite()

    * encodeURI()

    * decodeURI()

    * encodeURICComponent()

    * decodeURICComponent()

    * eval()


    The black box function

    Often, when you invoke functions, your program doesn''t need to know how these
    functions work internally. You can think of a function as a black box, give it
    some values (as input arguments), and then take the output result it. This is
    true for any function—one that''s built into the JavaScript engine, one that you
    create, or one that a co-worker or someone else created.


    # parseInt()


    parseInt() function takes any type of input (most often a string) and tries to
    make an integer out of it. If it fails, it returns NaN, as shown in the following
    code:


    ```

    > parseInt(''123'');

    123

    > parseInt(''abc123'');

    NaN

    > parseInt(''1abc23'');

    1

    > parseInt(''123abc'');

    123

    ```'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'The function accepts an optional second parameter, which is the radix, telling
    the function what type of number to expect-decimal, hexadecimal, binary, and so
    on. For example, trying to extract a decimal number out of the FF string makes
    no sense, so the result is NaN, if you use FF as a hexadecimal, you get 255, as
    shown in the following piece of code:


    ```

    > parseInt(''FF'', 10);

    NaN

    > parseInt(''FF'', 16);

    ```


    Another example would be parsing a string with a base 10 (decimal) and base 8
    (octal):


    ```

    > parseInt(''0377'', 10);

    377

    > parseInt(''0377'', 8);

    ```


    If you omit the second argument when calling parseInt(), the function will assume
    10 (decimal), with the following exceptions:


    +   * If you pass a string beginning with 0x, then the radix is assumed to be
    16 (a hexadecimal number is assumed).

    * If the string you parse starts with 0, the function assumes radix 8 (an octal
    number is assumed). Consider the following examples:


    ```

    > parseInt(''377'');

    377

    > console.log(00377);

    255

    > parseInt(''0x377'');

    ```


    The safest thing to do is to always specify the radix. If you omit the radix,
    your code will probably still work in 99 percent of cases (because most often
    you parse decimals); however, every once in a while, it might cause you a bit
    of hair loss while debugging edge cases. For example, imagine you have a form
    field that accepts calendar days or months and the user types 06 or 08.'
  merge: -1
