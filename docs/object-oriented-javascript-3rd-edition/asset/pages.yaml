  md: "# Iterating over generators\n\nGenerators are iterators, and like all ES6 constructs\
    \ that support iterables, they can be used to iterate over generators.\n\nThe\
    \ first method is to use the for...of loop, as shown in the following code:\n\n\
    ```\nfunction* logger() {\n  yield 'a'\n  yield 'b'\n  for (const i of logger())\
    \ {\n    console.log(i)\n  }\n  //\"a\" \"b\"\n```\n\nWe are not creating a generator\
    \ object. The For...of loop has support for iterables and generators naturally\
    \ fall into this loop.\n\nThe spread operator can be used to turn iterables into\
    \ arrays. Consider the following example:\n\n```\nfunction* logger() {\n  yield\
    \ 'a'\n  yield 'b'\n  const arr = [...logger()]\n  console.log(arr) //[\"a\",\
    \ \"b\"]\n```\n\nFinally, you can use the destructuring syntax with generators,\
    \ as follows:\n\n```\nfunction* logger() {\n  yield 'a'\n  yield 'b'\n  const\
    \ [x,y] = logger()\n  console.log(x,y) //\"/a\" \"b\"\n```\n\nGenerators play\
    \ an important role in asynchronous programming. Shortly, we will look at asynchronous\
    \ programming and promises in ES6. JavaScript and Node.js offer a great environment\
