- img_proc: true
  md: "# Creating promises\n\nWe saw how we can consume promises. Now, let's look\
    \ at how we can produce produce them.\n\nAs a producer, you can create a Promise\
    \ object and send a result via the Promise. The construct looks like the following\
    \ code snippet:\n\n```\nconst p = new Promise(\n  function (resolve, reject) {\
    \ // (1)\n    if ( {\n      resolve(value); // success\n    }\n    else {\n  \
    \    reject(reason); // failure\n    }\n});\n```\n\nThe parameter to Promise is\
    \ an executor function. The executor handles two states of the promise, which\
    \ we are as follows:\n\n+   - **Resolving:** If the result was generated successfully,\
    \ the executor sends the results back via the resolve() method. This method usually\
    \ fulfills the Promise object.\n- **Rejecting:** If an error happened, the executor\
    \ notifies the consumer via the reject() method. If an exception occurs, it is\
    \ notified via the reject() method as well.\n\nAs a consumer, you are notified\
    \ of either fulfillment of promise or rejection of promise via the then() and\
    \ catch() methods. Consider the following piece of code as an:\n\n```\npromise\n\
    .then(result => { /* promise fulfilled */ })\n.catch(error => { /* promise rejected\
    \ */ });\n```"
  merge: -1
  pgno: 305
- img_proc: true
  md: "# Promises and Proxies\n\nNow that we have some background on how to produce\
    \ promises, let's rewrite our earlier example of the asynchronous file's read\
    \ method to produce promises. We will use Node.js filesystem module and the readFile()\
    \ method as we did last time. If you don't understand any Node.js specific construct\
    \ in the following snippet, please don't worry. Consider the following code:\n\
    \n```\nimport { readFile } from 'fs';\nfunction readFilePromises(filename) {\n\
    \  return new Promise(\n    function (resolve, reject) {\n      readFile(filename,\n\
    \        (error, data) => {\n          if (error) {\n            reject(error);\n\
    \          } else {\n            resolve(data);\n          }\n        });\n  \
    \  }\n  ));\n}\n```\n\nIn the preceding snippet, we are creating a new Promise\
    \ object and returning it to the consumer. As we saw earlier, the parameter to\
    \ the Promise object is the executor function and the executor function takes\
    \ two states of Promise–fulfilled and rejected. These are the functions that notify\
    \ the state of the Promise object to the consumer.\n\nInside the executor function,\
    \ we will call the actual function–the readFile() method; if this function is\
    \ successful, we will return the result using the resolve() method and if there\
    \ is an error, we will notify the consumer using the reject() method.\n\nIf an\
    \ error happens in one of the then() reactions, they can be caught in the subsequent\
    \ catch() block. Take a look at the following code:\n\n```\nreadFileWithPromises('file.txt')\n\
    .then(result=> { 'something causes an exception' })\n.catch(error=> { 'Something\
    \ went wrong'});\n```\n\nIn this case, the then() reaction causes an exception\
    \ or error, and the subsequent catch() block can handle this."
  merge: -1
  pgno: 306
