  md: '# Testing and Debugging


    You will refrain from refactoring or optimizing your code, because you won''t
    be really sure what changes to the code base would potentially break something
    (again, because there are no test case to confirm your changes); all this is a
    vicious cycle. It''s like a civil engineer saying—although I have constructed
    this bridge, I have no confidence on the quality of the construction. It may collapse
    immediately or never. Although this might sound like an exaggeration, I have seen
    lot of high production code being pushed with no test coverage. This is risky
    and should be avoided. When you are writing enough test cases to cover majority
    of your functional code, when you make change to those pieces, you will immediately
    realize if there is a problem with this new change. If your changes the test case
    fail, you will realize the problem. If your refactor breaks the test scenario,
    you will realize the problem; all of this happens much before the code is pushed
    to production.


    In recent years, ideas like test-driven development and self-testing code are
    gaining prominence, especially in agile methodology. These are fundamentally sound
    ideas and will help you write robust code – the code you are confident of. We
    will discuss all these ideas in this chapter. We will understand how to write
    good test cases in modern JavaScript. We will also look at several tools and methods
    to debug your code. JavaScript was traditionally a bit difficult to test and debug,
    primarily due to lack of tools, but modern tools make both of these easy and natural.


    # Unit testing


    When we talk about test cases, we mostly mean unit tests. It is incorrect to assume
    that the unit we want to test is a function. The unit, or unit of work, is a logical
    unit that constitutes single behavior. This unit should should be able to be invoked
    via a public interface and should be testable independently.


    Thus, a unit test can perform the following functions:


    +   * It tests a single logical function

    * It can run without a specific order of execution

    * It takes care of its own dependencies and mock data

    * It always returns the same result for the same input

    * It should be self-explanatory, maintainable, and readable


    Martin Fowler advocates the Test Pyramid (http://martinfowler.com/bliki/TestPyramid.html)
    strategy to make sure we have a high number of unit tests to ensure maximum code
    coverage. There are two important testing strategies that we will discuss in this
    chapter.'
