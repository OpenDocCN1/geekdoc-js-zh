    \ are non-enumerable while user properties are enumerable. Unless there is a strong\
    \ reason, this property should remain untouched\n\n+   - Configurable(boolean):\
    \ If this attribute is false, the property cannot be deleted or edited (it cannot\
    \ change any of its attribute).\n\nYou can use the Object.getPropertyDescriptor()\
    \ method to retrieve an object's properties:\n\n```\nlet obj = {\n  age: 25\n\
    }\nconsole.log(Object.getPropertyDescriptor(obj, 'age'));\n//\"value\":25,\"writable\"\
    :true,\"enumerable\":true,\"configurable\":true\n```\n\nMeanwhile, the property\
    \ can be defined using the Object.defineProperty() method:\n\n```\nlet obj = {\n\
    \  age: 25\n}\nObject.defineProperty(obj, 'age', { configurable: false })\nconsole.log(Object.getPropertyDescriptor(obj,\
    \ 'age'));\n//\"value\":25,\"writable\":true,\"enumerable\":true,\"configurable\"\
    :false\n```\n\nThough you would never use these methods, it is important to understand\
    \ object properties and attributes. In the next section, we will discuss how of\
    \ the object methods are used in context of these properties.\n\n# ES6 object\
    \ methods\n\nES6 introduces a few static helper methods for objects. Object.assign\
