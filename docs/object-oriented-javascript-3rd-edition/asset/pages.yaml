  md: "# Objects\n\nThere can be an optional finally statement (not used in this example)\
    \ followed by a block of code, which is executed regardless of whether there was\
    \ an error or not.\n\nIn the previous example, the code block that follows the\
    \ catch statement didn't do anything. However, this is the place where you put\
    \ the code that can help recover from the error, or at least give feedback to\
    \ the user that your application is aware there was a special condition.\n\nThe\
    \ variable e in the parentheses after the catch statement contains an error object.\
    \ Like any other object, it contains properties and methods. Unfortunately, different\
    \ browsers implement these methods and properties differently, but there are two\
    \ properties that are consistently implemented—e.name and e.message.\n\nLet's\
    \ try this code now:\n\n```\ntry {\n  iDontExist();\n} catch (e) {\n  alert(e.name\
    \ + ' ' + e.message);\n} finally {\n  alert('Finally!');\n}\n```\n\nThis will\
    \ present an alert() showing e.name and e.message and then another alert() saying\
    \ Finally!\n\nIn Firefox and Chrome, the first alert will say ReferenceError:\
    \ iDontExist is not defined. In Internet Explorer, it will be TypeError: Object\
    \ expected. This tells us that things:\n\n+   - The e.name method contains the\
    \ name of the constructor that was used to create the error object\n- As the error\
    \ objects are not consistent across host environments (browsers), it would be\
    \ somewhat tricky to have your code act differently depending on the type (the\
    \ value of e.name)\n\nYou can also create error objects yourself using new Error()\
    \ or any of the other error constructors and then let the JavaScript engine know\
    \ that there's an erroneous condition using the throw statement."
