  md: "# Coding and Design Patterns\n\nHigher order functions are one of the important\
    \ mainstays of functional programming. Higher order function is a function that\
    \ does at least one of the following:\n\n+   - Takes one or more functions as\
    \ arguments\n- Returns a function as a result\n\nAs functions are first class\
    \ objects in JavaScript, passing and returning functions to and from a function\
    \ is a pretty affair. Callbacks are higher order functions. Let's take a look\
    \ at how we can take these two principles together and write a higher order function.\n\
    \nLet's write a filter function; this function filters out values from an array\
    \ based on a criteria determined by a function. This function takes two arguments—function,\
    \ which returns a Boolean value, true for keeping this element.\n\nFor example,\
    \ with this function, we are filtering all values from an array. Consider the\
    \ following lines of code:\n\n```\nconsole.log([1, 2, 3, 4, 5].filter(function(ele){\n\
    \  return ele % 2 == 0; }));\n//[2,4]\n```\n\nWe are passing an anonymous function\
    \ to the filter function as the first argument. This function returns a Boolean\
    \ based on a condition that checks if the element is odd or even.\n\nThis is an\
    \ example of the several higher order functions added to ECMAScript 5. The point\
    \ we are trying to make here is that you will increasingly see similar patterns\
    \ of usage in JavaScript. You must first understand how higher order functions\
    \ work and later, once you are comfortable with the concept, try to incorporate\
    \ them in your code as well.\n\nWith ES6 syntax changes, it is even more elegant\
    \ to write higher order functions. Let's take a small example in ES5 and see how\
    \ that translates into its ES6 equivalent:\n\n```\nfunction add(x) {\n  return\
    \ function(y) {\n    return y + x;\n  }\n}\n\nvar add3 = add(3);\nconsole.log(add3(3));\
    \ // => 6\nconsole.log(add(9)(10)); // => 19\n```\n\nThe add function takes x\
    \ and returns a function that takes y as an argument and then returns value of\
    \ expression y+x."
