  md: "# Modules\n\nJavaScript modules are not new. In fact, there were been libraries\
    \ that support modules for some time now. ES6, however, offers built-in modules.\
    \ Traditionally, JavaScript's major use was on browsers, where most of the JavaScript\
    \ code was either embedded or small enough to manage without much trouble. Things\
    \ have changed. JavaScript projects are now on a massive scale. Without an efficient\
    \ system of spreading the code into files and directories, managing code becomes\
    \ a nightmare.\n\nES6 modules are files. One module per file and one file per\
    \ module. There is no module keyword. Whatever code you write in the module file\
    \ is local to the module unless you export it. You may have a bunch of functions\
    \ in a module, and you want to export only a few of them. You can export functionality\
    \ in a couple of ways.\n\nThe first way is to use the export keyword. You can\
    \ export any top-level function, var, let, or const.\n\nThe following example\
    \ shows a module inside server.js where we export a function, class, and a const.\
    \ We don't export the processConfig() function, and any file importing this module\
    \ will not be able to access the unexported:\n\n```\n//----------------server.js-----------------\n\
    export const port = 8080;\nexport function startServer() {\n  //...start server\n\
    }\nexport class Config {\n  //...\n}\nfunction processConfig() {\n  //...\nn}\n\
    ```\n\nAny code that has access to server.js can import the exported functionality:\n\
    \n```\n//--------------------app.js--------------------\nimport {Config, startServer}\
    \ from 'server'\nstartServer(port);\n```\n\nIn this case, another JavaScript file\
    \ is importing Config and startServer from the server module (with the corresponding\
    \ JavaScript file server.js, we drop the file extension."
  merge: -1
