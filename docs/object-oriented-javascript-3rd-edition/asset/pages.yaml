    # A temporary constructor – new F()


    A solution to the previously outlined problem, where all prototypes point to the
    same object and the parents get children''s properties, is to use an intermediary
    to break the chain. The intermediary is in the form of a temporary constructor
    function. Creating an empty function F() and setting its prototype to the prototype
    of the parent constructor allows you to call new F() and create objects that have
    no properties of their own, but inherit everything from the parent''s prototype.


