  md: '# Object-Oriented JavaScript


    Let''s start with the following:


    +   - A brief introduction to the story behind JavaScript

    - The basic concepts you''ll encounter in discussions on object-oriented programming


    # A bit of history


    Initially, the web was not much more than just a number of scientific publications
    in the form of static HTML documents connected together with hyperlinks. Believe
    it or not, there was a time when there was no way to put an image in a page. However,
    soon changed. As the web grew in popularity and size, the webmasters were creating
    HTML pages felt they needed something more. They wanted to create richer user
    interactions, mainly driven by the desire to save server round trips for simple
    tasks such as form validation. Two options came up-Java applets and LiveScript,
    a language conceived by Brendan Eich at Netscape in 1995 and later included in
    the Netscape 2.0 browser under the name of JavaScript.


    The applets didn''t quite catch on, but JavaScript did. The ability to use code
    snippets embedded in HTML documents and alter static elements of a web page was
    embraced by the webmaster community. Soon, the competing browser vendor, Microsoft,
    shipped Internet Explorer (IE) 3.0 with JavaScript, which was a reverse engineered
    version of JavaScript plus some IE-specific features. Eventually, European Computer
    Manufacturers Association (ECMA) created the standard called ECMA-262, which describes
    the core parts of the JavaScript programming language without browser and web
    page-specific features.


    You can think of JavaScript as a term that encompasses the following three pieces:


    +   - ECMAScript: The language-variables, functions, loops, and so on. This part
    is independent of the browser and this language can be used in many other environments.

    - Document Object Model (DOM): This provides ways to work with HTML and XML documents.
    Initially, JavaScript provided limited access to what scriptable on the page,
    mainly forms, links, and images. Later, it was expanded to make all elements scriptable.
    This led to the creation of the DOM standard by the World Web Consortium (W3C)
    as a language-independent (no longer tied to JavaScript) way to manipulate structured
    documents.'
  merge: -1
