  md: '| # | Name | Example | Classification | Notes |

    |---|---|---|---|---|n| 11 | Borrowing constructors | function Child() { Parent.apply(this,
    arguments); } | • Works with constructors | • Inherits only properties • Can be
    combined with #1 to inherit the prototype too • Convenient way to deal with the
    issues when a child inherits a property that is an object (and, therefore, passed
    by reference) |

    | 12 | Borrow a constructor and copy the prototype | function Child() { Parent.apply(this,
    arguments); } extend2(Child, Parent); | • Works with prototype • Uses the prototype
    chain • Copies properties | • Combination of #11 and #4 • Allows you to inherit
    both own properties and prototype properties without calling the parent constructor
    twice |


    Given so many options, you must be wondering which is the right one. That depends
    on your style and preferences, your project, task, and team. Are you more comfortable
    thinking in terms of classes? Pick one of the methods that work with constructors.
    Are you going to need just one or a few instances of your class? Then choose an
    object-based pattern.


    Are these the only ways of implementing inheritance? No. You can choose a pattern
    from the preceding table, you can mix them, or you can think of your own. The
    important thing is to understand and be comfortable with objects, prototypes,
    and constructors; the rest is just pure joy.'
