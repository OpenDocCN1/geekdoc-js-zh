  md: '# isNaN()


    Using isNaN(), you can check if an input value is a valid number that can be safely
    used in arithmetic operations. This function is also a convenient way to check
    whether parseInt(), parseFloat(), or any arithmetic operation succeeded:


    ```

    > isNaN(NaN);

    true

    > isNaN(123);

    false

    > isNaN(1.23);

    false

    > isNaN(parseInt(''abc123''));

    true

    ```


    The function will also try to convert the input into a number:


    ```

    > isNaN(''1.23'');

    false

    > isNaN(''a1.23'');

    true

    ```


    The isNaN() function is useful because the special value NaN is not equal to anything,
    including itself. In other words, NaN === NaN is false. So, NaN cannot be used
    to check if a value is a valid number.


    # isFinite()


    The isFinite() function checks whether the input is a number that is neither Infinity
    nor NaN:


    ```

    > isFinite(Infinity);

    false

    > isFinite(-Infinity);

    false

    > isFinite(12);

    false

    > isFinite(1e308);

    true

    > isFinite(1e309);

    false

    ```


    If you are wondering about the results returned by the last two calls, remember
    from the previous chapter that the biggest number in JavaScript is 1.7976931348623157e+308,
    so 1e309 is effectively infinity.'
