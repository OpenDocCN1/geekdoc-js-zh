  md: "# Classes and Modules\n\nThere is an important distinction between classes\
    \ and normal functions. While normal functions are hoisted, classes are not. A\
    \ normal function is available immediately when you enter a scope in which it\
    \ is declared; this is called hoisting, which means that a normal function can\
    \ be declared anywhere in the scope, and it will be available. However, classes\
    \ are not hoisted; they are available only after they are declared. For a normal\
    \ function, you say:\n\n```\nnormalFunction(); // use first\nfunction normalFunction()\
    \ {} //declare later\n```\n\nHowever, you cannot use the class before declaring\
    \ it, for example:\n\n```\nvar ford = new Car(); //Reference Error\nclass Car\
    \ {}\",\n```\n\nThe other way to define a class is to use a class expression.\
    \ A class expression, like a function expression, may or may not have a name.\n\
    \nThe following example shows an anonymous class expression:\n\n```\nconst Car\
    \ = class {\n  constructor(model, year){\n    this.model = model;\n    this.year\
    \ = year;\n}\n```\n\nIf you name the class expression, the name is local to the\
    \ class's body and not available outside:\n\n```\nconst NamedCar = class Car{\n\
    \  constructor(model, year){\n    this.model = model;\n    this.year = year;\n\
    \  }\n  getName() {\n    return Car.name;\n  }\nconst ford = new NamedCar();\n\
    console.log(ford.getName()); // Car\nconsole.log(ford.name); // ReferenceError:\
    \ name is not defined\n```\n\nAs you can see, we will give a name to the Car class.\
    \ This name is available within the body of the class, but when we try to access\
    \ it outside the class, we get a reference error."
