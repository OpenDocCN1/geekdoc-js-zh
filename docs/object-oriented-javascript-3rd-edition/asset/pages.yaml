  md: 'Functions


    # A bonus – the alert() function


    Let''s take a look at another common function–alert(). It''s not part of the core
    JavaScript (it''s nowhere to be found in the ECMA specification), but it''s provided
    by the host environment–the browser. It shows a string of text in a message box.
    It can also be used as a primitive debugging tool, although the debuggers in modern
    browsers are much better suited for this purpose.


    Here''s a screenshot showing the result of executing the alert("Hi There") code:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_103_0.png)


    Before using this function, bear in mind that it blocks the browser thread, meaning
    that no other code will be executed until the user closes the alert. If you have
    a busy Ajax-type application, it''s generally not a good idea to use alert().


    # Scope of variables


    It''s important to note, especially if you have come to JavaScript from another
    language, variables in JavaScript are not defined in a block scope, but in a function
    scope. This means that if a variable is defined inside a function, it''s not visible
    outside of the function. However, if it''s defined inside a block, it is. The
    term global variables describes variables you define outside of any function (in
    the global program code), as opposed to local variables, which are defined inside
    a function. The code inside a function has access to all global variables as well
    as to its local ones.'
