  md: "# The prototype property\n\nThe functions in JavaScript are objects, and they\
    \ contain methods and properties. Some of the methods that you're already familiar\
    \ with are apply() and call(), and some of the other properties are length and\
    \ constructor. Another property of the function objects is prototype.\n\nIf you\
    \ define a simple function, foo(), you can access its properties as you would\
    \ do with any other object. Consider the following code:\n\n```\n> function foo(a,\
    \ b) {\n  return a * b;\n}\n> foo.length;\n2\n> foo.constructor;\nfunction Function()\
    \ { [native code] }\n```\n\nThe prototype property is a property that is available\
    \ to you as soon as you define the function. Its initial value is an empty object:\n\
    \n```\n> typeof foo.prototype;\n\"object\"\n```\n\nIt's as if you added this property\
    \ yourself, as follows:\n\n```\n> foo.prototype = {};\n```\n\nYou can augment\
    \ this empty object with properties and methods. They won't have any effect on\
    \ the foo() function itself; they'll only be used if you call foo() as a constructor.\n\
    \n# Adding methods and properties using the prototype\n\nIn the previous chapter,\
    \ you learned how to define constructor functions that you can use to create (construct)\
    \ new objects. The main idea is that, inside a function invoked with new, you\
    \ will have access to the this value, which refers to the object to be returned\
    \ by the constructor. Augmenting, which is adding methods and properties to this,\
    \ is how you can add functionality to the object being constructed."
