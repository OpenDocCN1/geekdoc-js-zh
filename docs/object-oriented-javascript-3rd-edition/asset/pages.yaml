    console.log(it.next().value); // ''Hello''

    console.log(it.next().value); // ''Iterators''

    console.log(it.next().done); // true

    ```


    In the preceding example, we are returning value and done till we have elements
    in the array. When we exhaust elements in the array to return, we will return
    done as true, indicating that the iteration has no more values. Elements from
    an iterator are accessed using the next() method repeatedly.


    # Iterables


    An iterable is an object that defines its iteration behavior or internal iteration.
    Such objects can be used in the for...of loops introduced in ES6. Built-in types
    such as arrays and strings define default iteration behavior. For an object to
    be iterable, it must implement the @iterator method, meaning the object must have
    a property with ''Symbol.iterator'' as key.


    An object becomes iterable if it implements a method whose key is ''Symbol.iterator''.
    This method must return an iterator via the next() method. Let''s take a look
    at the following example to clarify this:


    ```

    // iterable object

    //1. Has a method with key ''Symbol.iterator''

    //2. This method returns an iterator via method ''next''

    let iter = {

    0: ''Hello'',

    1: ''World of '',

    2: ''Iterators'',

    length: 3,

    [Symbol.iterator]() {

    let index = 0;

    return {

    next: () => {

    let value = this[index];

    let done = index >= this.length;

    index++;

    return { value, done };

    }

    }

    };

    ```


    [ 189 ]'
