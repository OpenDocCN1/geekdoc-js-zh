  md: '# Siblings, body, first, and last child


    The nextSibling and previousSibling are two other convenient properties to navigate
    the DOM tree once you have a reference to one element. Consider the following
    code:


    ```

    > var para = document.getElementById(''closer'');

    > para.nextSibling;

    > #text

    > para.previousSibling;

    > #text

    > para.previousSibling.previousSibling;

    > <p>...</p>

    > para.previousSibling.previousSibling.previousSibling;

    > #text

    > para.previousSibling.previousSibling.nextSibling.nextSibling;

    > <p id="closer">final</p>

    ```


    The body element is used so often that it has its shortcut, which is as follows:


    ```

    > document.body;

    > <body>...</body>

    > document.body.nextSibling;

    > null

    > document.body.previousSibling.previousSibling;

    > <head>...</head>

    ```


    The firstChild and lastChild properties are also convenient. The firstChild property
    is the same as childNodes[0] and lastChild is the same as childNodes[childNodes.length
    - 1] properties:


    ```

    > document.body.firstChild;

    > #text

    > document.body.lastChild;

    > #text

    > document.body.lastChild.previousSibling;

    > <!-- and that''s about it --

    > document.body.lastChild.previousSibling.nodeValue;

    > " and that''s about it "

    ```'
