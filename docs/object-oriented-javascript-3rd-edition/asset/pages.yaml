    # Undefined and null


    If you try to use a non-existing variable, you''ll get the following error:


    ```

    > foo

    ReferenceError: foo is not defined

    ```


    Using the typeof operator on a non-existing variable is not an error. You will
    get the "undefined" string back, as follows:


    ```

    > typeof foo;

    "undefined"

    ```


    If you declare a variable without giving it a value, this is, of course, not an
    error. But, the type still returns "undefined":


    ```

    > var somevar;

    somevar;

    typeof somevar;

    "undefined"

    ```


    This is because, when you declare a variable without initializing it, JavaScript
    automatically initializes it with the undefined value, as shown in the following
    lines of code:


    ```

    > var somevar;

    somevar === undefined;

    true

    ```


    The null value, on the other hand, is not assigned by JavaScript behind the scenes;
    it''s assigned by your code, which is as follows:


    ```

    > var somevar = null;

    null;

    somevar;

    typeof somevar;

    "object"

    ```


    Although the difference between null and undefined is small, it can be critical
    at times. For example, if you attempt an arithmetic operation, you will get different
    results:


    ```

    > var i = 1 + undefined;

    i;

    NaN

    > var i = 1 + null;

    i;

    1

    ```


