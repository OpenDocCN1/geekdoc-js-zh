  md: "# Objects\n\nIt's recommended that you don't quote the names of the properties\
    \ (it's less typing), but there are cases when you use quotes. Some of the cases\
    \ are stated here:\n\n+   * If the property name is one of the reserved words\
    \ in JavaScript (see Appendix A, Reserved Words)\n* If it contains spaces or special\
    \ characters (anything other than letters, numbers, and the _ and $ characters)\n\
    * If it starts with a number\n\nIn other words, if the name you have chosen for\
    \ a property is not a valid name for a variable in JavaScript, then you'll need\
    \ to wrap it in quotes.\n\nHave a look at this bizarre-looking object:\n\n```\n\
    var o = {\n  Something: 1,\n  'yes or no': 'yes',\n  '!@#$%^&*': true\n};\n```\n\
    \nThis is a valid object. The quotes are required for the second and the third\
    \ properties; otherwise, you'll get an error.\n\nLater in this chapter, you'll\
    \ see other ways to define objects and arrays, in addition to [] and { }. However,\
    \ first, let's introduce this bit of terminology – defining an array with [] is\
    \ called array literal notation, and defining an object using curly braces {}\
    \ is called object literal notation.\n\n# Elements, properties, methods, and members\n\
    \nWhen talking about arrays, you say that they contain elements. When talking\
    \ about objects, you say that they contain properties. There isn't any significant\
    \ difference in JavaScript; it's just the terminology that people are used to,\
    \ probably from other programming languages."
