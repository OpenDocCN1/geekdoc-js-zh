  md: "Changing the search query by setting the text contained in the value attribute\
    \ is done as follows:\n\n> > input.value = 'my query'\n\"my query\"\n\nNow, let's\
    \ have some fun and change the word Lucky with Tricky in the button:\n\n> > var\
    \ feeling = document.querySelectorAll(\"button\")[2];\n> feeling.textContent =\
    \ feelingtextContent.replace(/Lu/, 'Tri');\n**'Im Feeling Tricky**\n\n![](img/717ca68bb945a398c8e0c562c6cc94d7_344_0.png)\n\
    \nNow, let's implement the tricky part and make that button show and hide for\
    \ one second. You can do this with a simple function. Let's call it toggle().\
    \ Every time you call the function, it checks the value of the CSS property visibility,\
    \ and sets it to visible if it's hidden and versa using the following code snippet\n\
    \n```\nfunction toggle() {\n  var st = document.querySelectorAll('button')[2].style;\n\
    \  st.visibility = (st.visibility === 'hidden')\n  ? 'visible'\n  : ':hidden';\n\
    }\n```\n\nInstead of calling the function manually, let's use an interval and\
    \ call it every second:\n\n> > var myint = setInterval(toggle, 1000);\n\nThe button\
    \ starts blinking, making it tricky to click. When you're tired of chasing it,\
    \ just remove the timeout interval by writing the following line of code:\n\n\
    > > clearInterval(myint);"
