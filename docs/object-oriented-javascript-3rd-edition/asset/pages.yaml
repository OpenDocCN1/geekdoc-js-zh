  md: "# Coding and Design Patterns\n\nTesting the new method is done as follows:\n\
    \n```\nMYAPP.namespace('event');\nMYAPP.namespace('dom.style');\n```\n\nThe result\
    \ of the preceding code is as if you did the following:\n\n```\nvar MYAPP = {\n\
    event: {\n  dom: {\n    style: {}\n  }\n};\n```\n\n# Init-time branching\n\nIn\
    \ the previous chapter, you noticed that sometimes, different browsers have different\
    \ implementations for the same or similar functionalities. In such cases, you\
    \ will need to branch your code, depending on what's supported by the browser\
    \ executing your script. Depending on your program, this branching can happen\
    \ far too often and, as a result, may slow down the script execution.\n\nYou can\
    \ mitigate this by branching some parts of the code during initialization, when\
    \ the script loads, rather than during runtime. Building upon the ability to define\
    \ functions dynamically, you can branch and define the same function with a different\
    \ body, depending on the browser. Let's see how.\n\nFirst, let's define a namespace\
    \ and placeholder method for the event utility:\n\n```\nvar MYAPP = {};\nMYAPP.event\
    \ = {\n  addEventListener: null,\n  removeEventListener: null\n};\n```\n\nAt this\
    \ point, the methods to add or remove a listener are not implemented. Based on\
    \ the results from feature sniffing, these methods can be defined differently,\
    \ as follows:\n\n```\nif (window.addEventListener) {\nMYAPP.event.addEventListener\
    \ = function (el, type, fn) {\n  el.addEventListener(type, fn, false);\n};\nMYAPP.event.removeEventListener\
    \ = function (el, type, fn) {\n  el.removeEventListener(type, fn, false);\n};\n\
    ```\n\n 364"
