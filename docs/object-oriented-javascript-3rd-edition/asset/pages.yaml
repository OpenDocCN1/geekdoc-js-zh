  md: '# 9


    # # Promises and Proxies


    This chapter introduces the important concept of asynchronous programming and
    how JavaScript is an ideal language to utilize it. The other topic that we will
    cover in this chapter is meta programming with proxies. These two concepts are
    introduced in ES6.


    In this chapter, our primary focus is to understand asynchronous programming,
    before we jump into the language – specific constructs, let''s spend time in understanding
    the concept first.


    The first model–the synchronous model–is where it all began. This is the simplest
    model of programming. Each task is executed one at a time, and only after the
    first task completes execution can, the next task start. When you program in this
    model, we expect that all tasks before the current task are complete and Take
    a look at the following figure:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_294_0.png)'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'Promises and Proxies


    **The single threaded asynchronous model** is a familiar model we all know. However,
    this model can be wasteful and optimized. For any nontrivial programs composed
    of different tasks, this model can be slow. Consider the following hypothetical
    scenario as an example:


    ```

    var result = database.query("SELECT * FROM table");

    console.log("After reading from the database");

    ```


    With the synchronous model, two tasks are executed one after the other. This means
    that the second statement will only be executed once the first has completed execution.
    Assuming the first statement is a costly one and takes 10 seconds (it is normal
    to take even more time to read from a remote database), the second statement will
    be blocked.


    This is a serious problem when you need to write high – performance and scalable
    systems. There is another problem that manifests when you are writing programs
    where you need to write interfaces for human interactions like we do on websites
    that run on a browser. While you are performing a task that may take some time,
    you cannot block the user. They may be entering something in an input field while
    the costly task is running; it would be a terrible experience if we block user
    input while we are busy doing a costly operation. In such scenarios, the costly
    tasks needs to be run in the background while we can happily take input from the
    user.


    To solve this, one solution is to split each task into its own thread of control.
    This is called the **multi-threaded** or **threaded model**. Consider the following
    figure:


    | Task1 | Task2 | Task3 |

    |---|---|---||

    | | | |


    [ 277 ]'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'The difference is how the tasks are split. In the threaded model, each task
    is performed in its own thread of control. Usually, threads are managed by the
    operating system and can be run in parallel on different CPU cores or on a single
    core with appropriate thread scheduling done by the CPU. With modern CPUs, the
    threaded model can be extremely optimal in performance. Several languages support
    this popular model. Although a threaded model can be complex to implement in practice.
    The threads need to communicate and coordinate with each other. Inter-thread communication
    can get tricky very quickly. There are variations of the threaded model where
    the state is immutable. In such cases, the model becomes simpler as each thread
    is responsible for immutable state and there is no need to manage state between
    threads.


    # Asynchronous programming model


    The third model is what interests us the most. In this model, tasks are interleaved
    in a single thread of control. Consider the following figure:


    | Task1 | |

    | Task2 | |

    | Task3 | |

    | Time |'
  merge: -1
