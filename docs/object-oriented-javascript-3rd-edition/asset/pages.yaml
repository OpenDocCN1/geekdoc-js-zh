    \ here\n</script>\n```\n\nNow, let's take a look at what's in the JavaScript part.\
    \ First is the helper Point constructor. It just can't get any simpler than the\
    \ following:\n\n```\nfunction Point(x, y) {\n  this.x = x;\n  this.y = y;\n}\n\
    ```\n\nBear in mind that the coordinates of the points on the canvas start from\
    \ x=0, y=0, which is the top left. The bottom right will be x = 800, y = 600:\n\
    \n![](img/717ca68bb945a398c8e0c562c6cc94d7_270_0.png)\n\nNext comes the Line constructor.\
    \ It takes two points and calculates the length of the line between them, using\
    \ the Pythagorean theorem a²+b²=c² (imagine a right-angled triangle where the\
    \ hypotenuse connects the two points):\n\n```\nfunction Line(p1, p2) {\n  this.p1\
    \ = p1;\n  this.p2 = p2;\n  this.length = Math.sqrt(\n    Math.pow(p1.x - p2.x,\
    \ 2) +\n    Math.pow(p1.y - p2.y, 2)\n  );\n}\n```\n\n[ 252 ]"
