  md: "With this conceptual background of the asynchronous model with us, we can look\
    \ at\nlanguage – specific constructs to support this model.\n\n# # JavaScript\
    \ call stack\n\nJavaScript, function calls form a stack of frames. Consider the\
    \ following example:\n\n```\nfunction c(z2) {\n  console.log(new Error().stack);\n\
    }\nfunction b(z1) {\n  c(z1 + 1);\n}\nfunction a(z) {\n  b(z + 1);\n}\n// at c\
    \ (eval at <anonymous>)\n// at b (eval at <anonymous>)\n// at a (eval at <anonymous>)\n\
    ```\n\nWhen we call a(), the first frame in the stack is created with arguments\
    \ to the\nfunction and all local variables in the a() function. When function\
    \ a() calls function b(), a\nsecond frame is created and pushed to the top of\
    \ the stack. This goes on for all function\ncalls. When the c() function returns,\
    \ the top frame from the stack is popped out, leaving\nfunctions b() and a();\
    \ this goes until the entire stack is empty. It is necessary to\nmaintain because\
    \ once the finishes execution, JavaScript will need to know where\nto return.\n\
    \n# # Message queue\n\nThe JavaScript runtime contains a message queue. This queue\
    \ contains the list of messages\nto be processed. These messages are queued in\
    \ response to events such as click or an\nHTTP response received. Each message\
    \ is associated with a callback function."
