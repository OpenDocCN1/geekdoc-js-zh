  md: '# Test Driven Development


    Test driven development (TDD) has gained a lot of prominence in the last few years.
    The concept was first proposed as part of the extreme programming methodology.
    The idea is to have short repetitive development cycles where the focus is on
    writing the test cases first. The cycle looks like this:


    +   1. Add a test case as the specifications for the specific unit of code.

    2. Run existing suite of test cases to see if the new test case you wrote fails;
    it should, because there is no code for that unit yet. This ensures that the current
    test harness works.

    3. Write the code that mainly serves to confirm to the test case. This code is
    not optimized, refactored, or even entirely correct. However, this is fine at
    this moment.

    4. Run tests and see if all the test cases pass. After this step, you are confident
    that the new code is not breaking anything.

    5. Refactor code to make sure you are optimizing the unit and handling all cases


    These steps are repeated for any new code you add. This is an elegant strategy
    that works well really for agile methodology. TDD will be successful only if the
    testable units of code are small and confirms only to the test case.


    # Behavior Driven Development


    A very common problem while trying to follow TDD is vocabulary and the definition
    of correctness, BDD tries to introduce a ubiquitous language while writing the
    test cases when you are following TDD. This language makes sure that both the
    business and the engineering are talking about the same thing.


    We will use Jasmine as the primary BDD framework and explore various testing strategies.


