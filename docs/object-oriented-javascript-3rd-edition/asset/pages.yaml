    \ you should always thoroughly consider your options before using this approach.\n\
    \nThe reason is that once you know JavaScript, you're expecting it to work the\
    \ same way, no matter which third-party library or widget you're. Modifying core\
    \ objects can confuse the users and managers of your code and create unexpected\
    \ errors.\n\nJavaScript evolves and browser vendors continuously support more\
    \ features. What you consider a missing method today and decide to add a core\
    \ prototype could be a built-in method tomorrow. In this case, your method is\
    \ no longer needed. Additionally, what if you have already written a lot of code\
    \ that uses the method and your method is slightly different from the new built-in\
    \ implementation?\n\nThe most common and acceptable use case to augment built-in\
    \ prototypes is to add support for new features (ones that are already standardized\
    \ by the ECMAScript committee and implemented in new browsers) to old browsers.\
    \ One example will be adding an ES5 method to old versions of IE. These extensions\
    \ are known as shims or polyfills.\n\nWhen augmenting prototypes, you will first\
    \ check if the method exists before implementing it yourself, you use the native\
