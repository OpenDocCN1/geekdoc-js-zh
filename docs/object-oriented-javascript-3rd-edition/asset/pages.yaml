  md: 'Again, try to solve the problem you''re facing without resorting to these methods.


    # window.alert(), window.prompt(), and window.confirm() methods


    In Chapter 2, Primitive Data Types, Arrays, Loops, and Conditions, we talked about
    the alert() function. Now you know that global functions are accessible as methods
    of the global object, so as alert(''Watchout!'') and window.alert(''Watchout!'')
    are exactly the same.


    The alert() function is not an ECMAScript function but a BOM method. In addition
    to it, two BOM methods allow you to interact with the user through system messages.
    The following are the methods:


    +   * confirm(): This gives the user two options, OK and Cancel

    * prompt(): This collects textual input


    This is how it works:


    ```

    > var answer = confirm(''Are you cool?'');

    > answer;

    ```


    It presents you with a window similar to the following screenshot (the exact look
    depends on the browser and the operating system):


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_323_0.png)'
