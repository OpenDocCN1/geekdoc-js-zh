  md: "# Closures\n\nThe rest of the chapter is about closures (what better way to\
    \ close a chapter?). Closures can be a little hard to grasp initially, so don't\
    \ feel discouraged if you don't get it during the first read. You should go through\
    \ the rest of the chapter and experiment with the examples on your own, but if\
    \ you don't fully understand the concept, you can come back to it later when the\
    \ topics discussed previously in this chapter have had a chance to sink in.\n\n\
    Before moving on to closures, let's first review and expand on the concept of\
    \ scope in JavaScript.\n\n# Scope chain\n\nAs you know, in JavaScript, there is\
    \ no curly braces, but there is a function scope. A variable defined in a function\
    \ is not visible outside the function, but a variable defined in a code block\
    \ (for example an if or for loop) is visible outside the block, for example:\n\
    \n```\n> var a = 1;\n> function f() {\n  var b = 1;\n  return a;\n}\n> f();\n\
    1\n> b;\nReferenceError: b is not defined\n```\n\nA variable is in the global\
    \ space, while b is in the scope of the function f(). So, we have the following:\n\
    \n+   * Inside f(), both a and b are visible\n* Outside f(), a is visible, but\
    \ b is not"
  merge: -1
