- img_proc: true
  md: '# Reactive Programming and React


    React uses something called a Virtual DOM. A virtual DOM is a lightweight abstraction
    of the HTML DOM. You can think of it as an in-memory copy of the HTML DOM. React
    uses it to do all computations necessary to render the state of a UI component.


    You can find more details of this optimization

    https://facebook.github.io/react/docs/reconciliation.html.


    React''s primary strength, however, is not just Virtual DOM. React is a fantastic
    abstraction that makes composition, unidirectional dataflow, and static modeling
    easier while developing large applications.


    # Installing and running react


    First, let''s install react. Earlier, installing and getting react set up on your
    machine needed a bunch of dependencies to take care of. However, we will use a
    relatively fast way to get up and running. We will use create-react-app to which
    we can install react without any build configuration. Installation is done via
    npm which is as follows:


    ```

    npm install -g create-react-app

    ```


    Here, we are installing the create-react-app node module globally. Once create-react-app
    is installed, you can set up the directory for your application. Consider the
    following commands:


    ```

    create-react-app react-app

    cd react-app/

    npm start

    ```


    Then, open http://localhost:3000/ to see your app. You should see something like
    the following screenshot:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_431_0.png)'
