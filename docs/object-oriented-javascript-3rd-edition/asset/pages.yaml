  md: '# String


    You can use the String() constructor function to create string objects. String
    objects provide convenient methods for text manipulation.


    Here''s an example that shows the difference between a String object and a primitive
    string data type:


    +   > var primitive = ''Hello'';

    > typeof primitive;

    "string"

    > var obj = new String(''world'');

    > typeof obj;

    "object"


    A String object is similar to an array of characters. String objects have an indexed
    property for each character (introduced in ES5, long supported in many browsers,
    except old IEs), and they also have a length property.


    +   > obj[0];

    "w"

    > obj[4];

    "d"

    > obj.length;

    5


    To extract the primitive value from the String object, you can use the valueOf()
    or toString() inherited from Object. You''ll probably never need to do this, as
    toString() is also called behind the scenes if you use an object in a primitive
    string context:


    +   > obj.valueOf();

    "World"

    > obj.toString();

    "World"

    > obj + "";

    "World"


