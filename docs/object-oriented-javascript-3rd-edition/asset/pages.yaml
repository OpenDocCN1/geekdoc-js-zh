  md: "Functions\n\nThis gives you the expected result as follows:\n\n```\n> var arr\
    \ = F();\n> arr[0]();\n0\n> arr[1]();\n1\n> arr[2]();\n2\n```\n\nHere, instead\
    \ of just creating a function that returns i, you pass the i variable's current\
