  md: "# The Browser Environment\n\nYou'll notice the following things:\n\n+   - Nothing\
    \ gets written to the console until you close this message, which means that any\
    \ JavaScript code execution freezes, waiting for the user's answer\n- Clicking\
    \ on OK returns `true`, clicking on Cancel or closing the message using the X\
    \ icon, or the ESC key, returns `false`\n\nThis is handy to confirm user actions,\
    \ as shown in the following piece of code:\n\n```\nif (confirm('Sure you want\
    \ to delete this?')) {\n  // delete\n} else {\n  // abort\n}\n```\n\nMake sure\
    \ you provide an alternative way to confirm user actions for people who have disabled\
    \ JavaScript, or for search engine spiders.\n\nThe `window.prompt()` method presents\
    \ the user with a dialog to enter text, as follows:\n\n+   - var answer = prompt('And\
    \ your name was?');\n- answer;\n\nThis results in the following dialog box (Chrome,\
    \ MacOS):\n\n![](img/717ca68bb945a398c8e0c562c6cc94d7_324_0.png)\n\nThe value\
    \ of `answer` is one of the following:\n\n+   - null: This happens if you click\
    \ on Cancel, the X icon, or press ESC key\n- `\"` (empty string): This happens\
    \ if you click on OK or press Enter without typing anything\n- A text string:\
    \ This is if you type something and then click on `OK` or press Enter\n\nThe function\
    \ also takes a string as a second parameter and displays it as a default value\
    \ prefilled into the input field."
