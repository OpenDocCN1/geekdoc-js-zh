    { var F = function (){}; F.prototype = Parent.prototype; Child.prototype = new
    F(); Child.prototype.constructor = Child; Child.uber = Parent.prototype; }` |
    • Works with constructors

    • Uses the prototype chain | • Unlike #1, it only inherits properties of the prototype;

    • own properties (created with this constructor) are not inherited.

    • Provides Provides convenient access to the parent (through uber) |

    | 4 | Copying the prototype properties | `function extend2(Child, Parent) { var
    p = Parent.prototype; var c = Child.prototype; for (var i in p) { c[i] = p[i];
