    It''s a different object that you completely overwrite the Wee function''s copy
    of owns with another object (if opposed to modifying the existing one). In this
    case, Papa.owns keeps pointing to the old object, Wee.owns points to a new one:


    ```

    >Wee.prototype.owns= [''empty bowl'', ''broken chair''];

    >Papa.prototype.owns.push(''bed'');

    >Papa.prototype.owns;

    ["porridge", "chair", "bed"]

    ```


    Think of an object as something that is created and stored in a physical location
    in memory. Variables and properties merely point to this location, when you assign
    a brand new object to Wee.prototype.owns, you essentially say-Hey, forget about
    this old object, move your pointer to this one instead.


    The following diagram illustrates what happens if you imagine the memory being
    a heap of objects (like a wall of bricks) and you point to (refer to) some of
    these objects:


    +   * A new object is created, and A points to it.

    * A new variable B is created and made equal to A, meaning it now points to the
    same place A is pointing to.

    * A property color is changed using the B handle (pointer). The brick is now white.
    A check for A.color === "white" would be true.

    * A new object is created, and the B variable/pointer is recycled to that new
    object. A and B are now pointing to different parts of the memory pile. They have
    nothing in common and changes to one of them do not affect the other:


    [ 236 ]'
