  md: "# Objects\n\nLet's cause an error and see what happens. What's a simple way\
    \ to cause an error? Just call a function that doesn't exist. Type this into the\
    \ console:\n\n```\n> iDontExist();\n```\n\nYou'll get something like the following:\n\
    \n![](img/717ca68bb945a398c8e0c562c6cc94d7_198_0.png)\n\nThe display of errors\
    \ can vary greatly between browsers and other host environments. In fact, most\
    \ recent browsers tend to hide the errors from the users. However, you cannot\
    \ assume that all of your users have disabled the display of errors, and it is\
    \ your responsibility to ensure an error-free experience for them. The previous\
    \ error propagated to the user, because the code didn't try to catch (this) this\
    \ error. The code didn't expect the error and was not prepared to handle it. Fortunately,\
    \ it's trivial to trap the error. All you need is the try statement followed by\
    \ a catch statement.\n\nThis code hides the error from the user:\n\n```\ntry {\n\
    \  iDontExist();\n} catch (e) {\n  // do nothing\n}\n```\n\nHere you have:\n\n\
    +   - The try statement followed by a block of code.\n- The catch statement followed\
    \ by a variable name in parentheses and another block of code."
