  md: '# Summary


    In this chapter, you learned quite a few ways (patterns) of implementing inheritance,
    and the following table summarizes them. The different types can roughly be divided
    into the following:


    +   - Patterns that work with constructors

    - Patterns that work with objects


    You can also classify the patterns based on whether:


    +   - Use the prototype

    - Copy properties

    - Do both (copy properties of the prototype):


    | # | Name | Example | Classification | Notes |

    |---|---|---|---|--|

    | 1 | Prototype chaining (pseudo-classical) | Child.prototype = Parent(); | •
    Works with constructors

    • Uses the prototype chain | • The default mechanism

    • Tip - move all properties/methods that are meant to be reused to the prototype,
    and add the non-reusable as properties |

    | 2 | Inher only the prototype | Child.prototype = Parent.prototype; | • Works
    with constructors

    • Copies the prototype chain, as all share the same prototype object | • More
    efficient; no new instances are created for the sake of inheritance

    • Prototype chain lookup during runtime; it is fast, since there''s no chain

    • Drawback: children can modify parents'' functionality |'
  merge: -1
