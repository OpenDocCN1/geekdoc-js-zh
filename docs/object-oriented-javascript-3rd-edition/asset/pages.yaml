  md: "Primitive Data Types, Arrays, Loops, and Conditions\n\n? is called a ternary\
    \ operator because it takes three operands.\n\n# Switch\n\nIf you find yourself\
    \ using an if condition and having too many else...if parts, you can consider\
    \ changing the if to a switch, as follows:\n\n```\nvar a = '1',\n  result = '';\n\
    switch (a) {\n  case 1:\n    result = 'Number 1';\n    break;\n  case '1':\n \
    \   result = 'String 1';\n    break;\n  default:\n    result = 'I don't know';\n\
    \    break;\n}\n```\n\nThe result after executing this is \"String 1\". Let's\
    \ see what the parts of a switch are:\n\n+   - The switch statement.\n- An expression\
    \ in parentheses. The expression most often contains a variable, but can be anything\
    \ that returns a value.\n- A number of case blocks enclosed in curly brackets.\n\
    - Each case statement is followed by an expression. The result of the expression\
    \ is compared to the expression found after the switch statement. If the result\
    \ of the comparison is true, the code that follows the colon after the case is\
    \ executed.\n- There is an optional break statement to signal the end of the case\
    \ block. If this break statement is reached, the switch statement is all done.\
    \ Otherwise, if the break is missing, the program execution enter's the next case\
    \ block.\n- There's an optional default case marked with the default statement\
    \ and followed by a block of code. The default case is executed if none of the\
    \ previous cases evaluated to true."
