  md: "# Coding and Design Patterns\n\nWhen we looked at arrow functions, we discussed\
    \ that arrow functions return results of a single expression implicitly. So, the\
    \ preceding function can be turned into an arrow function by making the body of\
    \ the arrow function another arrow function. Take a look at the following example:\n\
    \n```\nconst add = x => y => y + x;\n```\n\nHere, we have an outer function, x\
    \ => [inner function with x as argument], and we have an inner function, y =>\
    \ y+x.\n\nThis introduction will help you get familiar with the increasing usage\
    \ of higher order functions, and their increased importance in JavaScript.\n\n\
    # Design patterns\n\nThe second part of this chapter presents a JavaScript approach\
    \ to a subset of the design patterns introduced by Design Patterns: Elements of\
    \ Reusable Object-Oriented Software, an influential book most commonly referred\
    \ to as the Book of Four, the Gang of Four, or GoF (after its four authors). The\
    \ patterns discussed in the GoF book are divided into the three following groups:\n\
    \n+   - Creational patterns that deal with how objects are created (instantiated)\n\
    - Structural patterns that describe how different objects can be composed in order\
    \ to provide new functionality\n Behavioral patterns that describe ways for objects\
    \ to communicate with each other\n\nThere are 23 patterns in the Book of Four,\
    \ and more patterns have been identified since the book's publication. It's beyond\
    \ the scope of this book to discuss all of them, so the remainder of the chapter\
    \ demonstrates only four, with examples of their implementation in JavaScript.\
    \ Remember that the patterns are more about interfaces and relationships rather\
    \ than implementation. Once you have an understanding of a design pattern, it's\
    \ not difficult to implement it, especially in a dynamic language such as JavaScript.\n\
    \nThe patterns discussed through the rest of the chapter are as follows:\n\n+\
    \   - Singleton\n- Factory\n- Decorator\n- Observer"
