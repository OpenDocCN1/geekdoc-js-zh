  md: "# Coding and Design Patterns\n\nUsing the three different constructors is exactly\
    \ the same–pass the url variable and call the insert() method, as follows:\n\n\
    ```\nvar url = 'http://www.phpied.com/images/covers/oojs.jpg';\n\nvar o = new\
    \ MYAPP.dom.Image(url)\n.insert(document.body);\n\nvar o = new MYAPP.dom.Text(url)\n\
    .insert(document.body);\n\nvar o = new MYAPP.dom.Link(url)\n.insert(document.body);\n\
    ```\n\nImagine your program doesn't know in advance which type of object is required.\
    \ The user decides, during runtime, clicking on a button for example. If type\
    \ contains the required type of object, you'll need to use an if or a switch statement,\
    \ and write something like the following piece of code:\n\n```\nvar o;\nif (type\
    \ === 'Image') {\n  o = new MYAPP.dom.Image(url);\n}\nif (type === 'Link') {\n\
    \  o = new MYAPP.dom.Link(url);\n}\nif (type === 'Text') {\n  o = new MYAPP.dom.Text(url);\n\
    }\no.url = 'http://...';\n.insert(o);\n```\n\nThis works; however, if you have\
    \ a lot of constructors, the code becomes too lengthy and hard to maintain. Also,\
    \ if you are creating a library or a framework that allows extensions or plugins,\
    \ or you don't know the exact names of all the constructor functions in advance.\
    \ In such cases, it's convenient to have a factory function that takes care of\
    \ creating an object of the dynamically determined type.\n\nLet's add a factory\
    \ method to the MYAPP.dom utility:\n\n```\nMYAPP.dom.factory = function (type,\
    \ url) {\n  return new MYAPP.dom[type](url);\n};\n```"
