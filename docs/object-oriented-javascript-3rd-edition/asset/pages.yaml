  md: '# Coding and Design Patterns


    Instead of having many parameters, you can use one parameter and make it an object.
    The properties of the object are the actual parameters. This is suitable to pass
    configuration options because these tend to be numerous and optional (with smart
    defaults). The beauty of using a single object to multiple parameters is described
    as follows:


    +   - The order doesn''t matter

    - You can easily skip parameters that you don''t want set

    - It''s easy to add more optional configuration attributes

    - It makes the code more readable because the configuration object''s properties
    are present in the calling code with their names


    Imagine you have some sort of UI widget constructor you use to create fancy buttons.
    It accepts the text to put the button (the value attribute of the <input> tag)
    and an optional parameter of the type of button. For simplicity, let''s say the
    fancy button takes the same configuration as a regular button. Take a look at
    the following code:


    ```

    // constructor that creates buttons

    MYAPP.dom.FancyButton = function (text, type) {

    var b = document.createElement(''input'');

    b.type = type || ''submit'';

    b.value = text;

    return b;

    }

    ```


    Using the constructor is simple; you just give it a string. Then, you can add
    the new button to the body of the document as:


    ```

    document.body.appendChild(

    new MYAPP.dom.FancyButton(''puuush'')

    )

    ```


    This is all well and works, but then you decide you also want to be able to set
    some of the style properties of the button, as as colors and fonts. You can end
    up with a definition like:


    ```

    MYAPP.dom.FancyButton =

    function (text, type, color, border, font) {

    // ...

    }

    ```'
