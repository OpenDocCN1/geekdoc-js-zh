  md: "What happened? The f() function contains the local variable. Before calling\
    \ the function, the variable doesn't exist. When you call the function for the\
    \ first time, the local variable is created with a global scope. Then, if you\
    \ access the local variable outside the function, it will be available.\n\n# Best\
    \ practice tips\n\n+   Minimize the number of global variables in order to avoid\
    \ naming collisions. Imagine two people working on two different functions in\
    \ the same script, and they decide to use the same name for their global variable.\
    \ This could easily lead to unexpected results and hard-to-find bugs. Always declare\
    \ your variables with the var statement. Consider a single var pattern. Define\
    \ all variables needed in your function at the very top of the function so you\
    \ have a single place to look for variables and, hopefully, prevent accidental\
    \ globals.\n\n![](img/717ca68bb945a398c8e0c562c6cc94d7_105_0.png)\n\n# Variable\
    \ hoisting\n\nHere's an interesting example that shows an important aspect of\
    \ local versus global scoping:\n\n```\nvar a = 123;\n\nfunction f() {\n  alert(a);\n\
    \  var a = 1;\n  alert(a);\n}\n\nf();\n```\n\nYou might expect that the first\
    \ alert() function will display 123 (the value of the global variable a) and the\
    \ second will display 1 (the local variable a). But, this is not the case. The\
    \ first alert will show undefined. This is because, inside the function, the local\
    \ scope is more important than the global scope. So, a local variable overwrites\
    \ any global variable with the same name. At the time of the first alert(), a\
    \ variable was not yet defined (hence the undefined value), but it still existed\
    \ in the local space due to the special behavior called hoisting."
