  md: "# Objects inherit from objects\n\nAll the examples so far in this chapter assume\
    \ that you create your objects with constructor functions, and you want objects\
    \ created with one constructor to inherit properties that come from another constructor.\
    \ However, you can also create objects without the help of a constructor function,\
    \ just using the object literal, which is, in fact, less typing. So, how about\
    \ those?\n\nIn Java or PHP, you define classes and have them inherit from other\
    \ classes. That's why you will see the term classical, because the OO functionality\
    \ comes from the use of classes. In JavaScript, there are no classes, so programmers\
    \ who come from a classical background resort to constructor functions, because\
    \ constructors are the closest to what they are used to. In addition, JavaScript\
    \ provides the new operator, which can further suggest that JavaScript is like\
    \ Java. The truth is that, in the end, it comes down to objects. The first example\
    \ in this chapter used this syntax:\n\n```\nChild.prototype = new Parent();\n\
    ```\n\nHere, the Child constructor (or class, if you) inherits from Parent. However,\
    \ this is done by creating an object using new Parent() and inheriting from it.\
    \ That's why this is also referred to as a pseudo-classical inheritance pattern,\
    \ because it resembles classical inheritance, although it isn't (no classes involved).\n\
    \nSo, why not get rid of the middleman (the constructor/class) and just have inherit\
    \ from objects? In extend2(), the properties of the parent prototype object were\
    \ copied as properties of the child prototype object. The two prototypes are,\
    \ in essence, objects. Forgetting about prototypes and constructor functions,\
    \ you can simply take an object and copy all of its properties into another object.\n\
    \nYou already know that objects can start as a blank canvas without any properties,\
    \ using var o = {}; and then properties later. However, instead of starting fresh,\
    \ you can start by copying all of the properties of an existing object. Here's\
    \ a function that does exactly this: to take an object and returns a new copy\
    \ of it:\n\n```\nfunction extendCopy(p) {\n  var c = {};\n  for (var i in p) {\n\
    \    c[i] = p[i];\n  }\n  c.uber = p;\n  return c;\n}\n```"
  merge: -1
