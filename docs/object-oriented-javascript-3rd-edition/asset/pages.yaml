  md: 'Getting the class attribute of the first paragraph won''t work though. It''s
    an exception because it just happens to be a reserved word in ECMAScript. You
    can use className instead, as follows:


    ```

    document.getElementsByTagName(''p'')[0].className;

    "opener"

    ```


    Using getElementsByTagName(''*''), you can get all of the elements on the page,
    as follows:


    ```

    document.getElementsByTagName(''*'').length;

    8

    ```


    In earlier versions of IE before 7, * is not acceptable as a tag name. To get
    all elements, you can use IE''s proprietary document.all collection, although
    selecting every element is rarely needed.


    The other shortcut mentioned is getElementById(). This is probably the most common
    way of accessing an element. You just assign IDs to the elements you plan to play
    with and they''ll be easy to access later on, as seen in the following code:


    ```

    document.getElementById(''closer'');

    <p id="closer">final</p>

    ```


    Additional shortcut methods in more recent browsers include the following:


    +   - getClassName():This method finds elements using their class attribute

    - querySelector(): This method finds an element using a CSS selector string

    - querySelectorAll(): This method is the same as the previous but returns all
    matching elements, not just the first'
