    also exists in the second <script> block.


    # BOM and DOM – an overview


    The JavaScript code in a page has access to a number of objects. These objects
    can be divided into the following types:


    +   - Core ECMAScript objects: This consists of all the objects mentioned in the
    previous chapters

    - DOM: This consists of objects that have to do with the currently loaded page,
    which is also called the document

    - BOM: This consists of objects that deal with everything outside the page-the
    browser window and the desktop screen


    BOM stands for Document Object Model and BOM for Browser Object Model.


    The DOM is a standard governed by the World Wide Web Consortium (W3C) and has
    different versions, called levels, such as DOM Level 1, DOM Level 2, and so on.
    Browsers in use today have different degrees of compliance with the standard,
    but in general, they almost completely implement DOM Level 1. The DOM was standardized
    post fact after the browser vendors each implemented their own ways to access
    the document. The legacy part from before the W3C took over is still around and
    is referred to as DOM 0, although no DOM Level 0 standard exists. Some of DOM
    de facto standards as major browsers support them; some of these were added to
    the DOM Level 1 standard. The rest of DOM 0 didn''t find its way to DOM 1 is too
    specific and won''t be discussed here.


    Historically, BOM was not a part of any standard. Similar to DOM 0, it has a subset
    of objects that is supported by all major browsers, and another subset that is
    browser-specific. The HTML5 standard codifies common behavior among browsers,
    and it includes common BOM objects. Additionally, mobile devices come with their
    specific objects (and HTML5 aims to standardize those as well), which traditionally
    were not necessary for desktop computers, but make sense in a mobile world, for
    example, geolocation, camera access, vibration, touch events, telephony, and SMS.'
