  md: "# Functions\n\nWhen you call the global outer() function, it will internally\
    \ call the local inner() function. As inner() is local, it's not accessible outside\
    \ outer(), so you can say it's a private function:\n\n```\n> outer(2);\n\"The\
    \ result is 4\"\n> outer(8);\n\"The result is 16\"\n> inner(2);\nReferenceError:\
    \ inner is not defined\n```\n\nThe benefits of using private functions are as\
    \ follows:\n\n+   * You can keep the global namespace clean, which is less likely\
    \ to cause naming collisions\n* Privacy—you can expose those functions to the\
    \ outside world that you decide, and keep the functionality that is not meant\
    \ to be consumed by the rest of the application to yourself\n\n# Functions that\
    \ return functions\n\nAs mentioned earlier, a function always returns a value,\
    \ and if it doesn't do it explicitly with return, then it does implicitly by returning\
    \ undefined. A function can return only one value, and this value can just easily\
    \ be another function, for example:\n\n```\nfunction a() {\n  alert('A!');\n \
    \ return function () {\n    alert('B!');\n  };\n}\n```\n\nIn this example, the\
    \ a() function does its job (says A!) and returns another function that does something\
    \ else (says B!). You can assign the return value to a variable and use this variable\
    \ as a new function, as follows:\n\n```\n> var newFunc = a();\n> newFunc();\n\
    ```"
