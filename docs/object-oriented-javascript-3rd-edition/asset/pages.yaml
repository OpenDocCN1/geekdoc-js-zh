    # Promise.all()


    One interesting use case is to create an iterable promises. Let''s assume that
    you have a list of URLs to visit and parse the results. You can create promises
    for each of the fetch URL calls and use them individually, or you can create an
    iterator with all the URLs and use them in one. The Promise.all() method takes
    the iterable promises as an argument. When all of the promises are fulfilled,
    an array is filled with their results. Consider the following code as an example:


    ```

    Promise.all([\nf1(),

    f2()

    ])

    .then(([r1,r2]) => {

    //

    })

    .catch(err => {

    //..

    });

    ```


    # Metaprogramming and proxies


    Metaprogramming refers to a method of programming where the program is aware of
    its structure and can manipulate itself. Many languages have support for metaprogramming
    in the form of macros. Macros are important constructs in functional languages
    such as LISP (**Locator/ID Separation Protocol**). In languages such as Java and
    C#, reflection is a form of metaprogramming because a program can examine information
    about itself using reflection.'
  merge: -1
  pgno: 307
- img_proc: true
  md: "# Promises and Proxies\n\nIn JavaScript, you can say that methods of object\
    \ allow you to examine the structure and however, they offer metaprogramming.\
    \ There are three types of metaprogramming paradigms\n(The Art of the Metaobject\
    \ Protocol, Kiczales et al,\nhttps://mitpress.mit.edu/books/art-metaobject-protocol):\n\
    \n+   * **Introspection**: This gives a read-only access to the internals of a\
    \ program\n* **Self-modification**: This makes structural changes possible to\
    \ the program\n* **Intercession**: This changes language semantics\n\nThe `Object.keys()`\
    \ method is an example of introspection. In the following example, the program\
    \ is examining its own structure:\n\n```\nconst introspection =\n  intro() {\n\
    \    console.log(\"I think therefore I am\");\n  }\n  for (const key of Object.keys(introspection)){\n\
    \    console.log(key); //intro\n  }\n```\n\nSelf-modification is also possible\
    \ in JavaScript by mutating the properties of an object.\n\nHowever, intercession,\
    \ or the ability to change language semantics, is something not available in JavaScript\
    \ ES6. Proxies are introduced to open up this possibility.\n\n# Proxy\n\nYou can\
    \ use a proxy to determine the behavior of an object, which is called the target,\
    \ whenever its properties are accessed. A proxy is used to define custom behavior\
    \ for basic operations on an object, such as looking up a property, function invocation,\
    \ and assignment.\n\nA proxy needs two parameters, which are as follows:\n\n+\
    \   * **Handler**: For each operation you want to customize, you need a `handler`\
    \ method. This method intercepts the operations and is sometimes called a trap.\n\
    * **Target**: When the `handler` does not intercept the operation, the `target`\
    \ is used as a fallback."
  merge: -1
  pgno: 308
- img_proc: true
  md: "# Promises and Proxies\n\nLet's take a look at the following example to understand\
    \ this concept better:\n\n```\nvar handler = {\n  get: function(target, name)\
    \ {\n    return name in target ? target[name] : 42;\n  }\n}\nvar p = new Proxy({},\
    \ handler);\np.a = 100;\np.b = undefined;\nconsole.log(p.a, p.b); // 100, undefined\n\
    console.log('c' in p, p.c); // false, false\n```\n\nIn this example, we are trapping\
    \ the operation of getting a property from the object. We return 42 as a default\
    \ property value if the property does not exist. We are using the get handler\
    \ to trap this operation.\n\nYou can use proxies to validate values before setting\
    \ them on an object. For this, we can trap the set handler as follows:\n\n```\n\
    let ageValidator = {\n  set: function(obj, prop, value) {\n    if (prop === 'age')\
    \ {\n      if (!Number.isInteger(value)) {\n        throw new TypeError('The age\
    \ is not an number');\n      }\n      if (value > 100) {\n        throw new RangeError('You\
    \ cant be older than 100');\n      }\n    }\n    // If no error - just store the\
    \ value in the property\n    obj[prop] = value;\n  }\n}\nlet p = new Proxy({},\
    \ ageValidator);\np.page = 100;\nconsole.log(p.page); // 100\np.page = 'Two';\
    \ // Exception\np.page = 300; // Exception\n```\n\nIn the preceding example, we\
    \ are trapping the set handler. When we set a property of the object, we are trapping\
    \ that operation and introducing validation of values. If the value is valid,\
    \ we will set the property."
  merge: -1
  pgno: 309
- img_proc: true
  md: "# Function traps\n\nThere are two operations that can be trapped if the target\
    \ is a function: apply and construct.\n\nTo intercept function calls, you will\
    \ need to trap the get and apply operations. First get the function and then apply\
    \ to call the function. So, you get the function and return the function.\n\n\
    Let's consider the following example to understand how method interception works:\n\
    \n```\nvar car = {\n  name: \"Ford\",\n  method_1: function(text) {\n    console.log(\"\
    Method_1 called with \" + text);\n  }\n}\nvar methodInterceptorProxy = new Proxy(car,\
    \ {\n  //target is the object being proxied, receiver is the proxy\n  get: function(target,\
    \ propKey, receiver) {\n    //I only want to intercept method calls, not property\
    \ access\n    var propValue = target[propKey];\n    if (typeof propValue != \"\
    function\"){\n      return propValue;\n    }\n    else{\n      return function()\
    \ {\n        console.log(\"intercepting call to \" + propKey +\n        \" in\
    \ car \" + target.name);\n        //target is the object being proxied\n     \
    \   return propValue.apply(target, arguments);\n      }\n    }\n  }\n})\nmethodInterceptorProxy.method_1(\"\
    Mercedes\");\n//intercepting call to method_1 in car Ford\n//Method_1 called with\
    \ Mercedes\n```\n\nIn the preceding example, we are trapping the get operation.\
    \ If the type of the property get is a function, we will use apply to invoke function.\
    \ If you see the output, we are getting two console.logs; the first is from the\
    \ proxy where we trapped the get operation and the second is from the actual method\
    \ call."
  merge: -1
