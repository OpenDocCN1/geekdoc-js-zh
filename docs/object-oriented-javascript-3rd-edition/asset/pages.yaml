  md: '# Modifying DOM nodes


    Now that you know a whole lot of methods to access any node of the DOM tree and
    its properties, let''s see how you can modify these nodes:


    Let''s assign a pointer to the last paragraph to the variable my, as follows:


    ```

    var my = document.getElementById(''closer'');

    ```


    Now, changing the text of the paragraph can be as easy as changing the innerHTML
    value, which is as follows:


    ```

    my.innerHTML = ''final!!!'';

    "final!!!"

    ```


    As innerHTML accepts a string of HTML source code, you can also create a new em
    node in the DOM tree as:


    ```

    my.innerHTML = ''<em>my</em> final'';

    "<em>my</em> final"

    ```


    The new em node becomes part of the tree. Let''s take a look at the following
    code:


    ```

    my.firstChild;

    <em>my</em>

    my.firstChild.firstChild;

    "my"

    ```


    Another way to change text is to get the actual text node and change its nodeValue,
    as shown in the following piece of code:


    ```

    my.firstChild.firstChild.nodeValue = ''your'';

    "your"

    ```


    # Modifying styles


    Often you don''t change the content of a node, but its presentation. The elements
    have a style property, which in turn has a property mapped to each CSS property.
    For example, changing the style of the paragraph to add a red border, as follows:


    ```

    my.style.border = "ipx solid red";

    "ipx solid red"

    ```'
