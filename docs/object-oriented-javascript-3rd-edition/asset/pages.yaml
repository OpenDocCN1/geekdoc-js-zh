  md: "# Coding and Design Patterns\n\nNow, you can replace the three if functions\
    \ with the simpler code, as follows:\n\n```\nvar image = MYAPP.dom.factory(\"\
    Image\", url);\nimage.insert(document.body);\n```\n\nThe example factory() method\
    \ in the previous code was simple; however, in a real-life scenario, you'd want\
    \ to do some validation against the type value (for example, check if MYAPP.dom[type]\
    \ exists and optionally do some set up work common to all object types (for example,\
    \ set up the URL all constructors use).\n\n# Decorator pattern\n\nThe decorator\
    \ design pattern is a structural pattern; it doesn't have much to do with how\
    \ objects are created, but how their functionality is extended. Instead of using\
    \ inheritance, where you extend in a linear way (parent-child-child), you can\
    \ have one base object and a pool of different decorators that provide extra functionality.\
    \ You can pick and choose which decorators it wants, and in which order. For a\
    \ different program or code, you may have a different set of requirements and\
    \ pick different decorators out of the same pool. Take a look at the following\
    \ code snippet to see how the usage of the decorator pattern can be implemented:\n\
    \n```\nvar obj = {\n  doSomething: function () {\n    console.log('sure, asap!');\n\
    \  }\n  // ...\n};\nobj = obj.getDecorator('deco1');\nobj = obj.getDecorator('deco13');\n\
    obj = obj.getDecorator('deco5');\nobj.doSomething();\n```\n\nYou can now start\
    \ with a simple object that has a doSomething() method. Then, you can pick one\
    \ of the decorator objects you are lying around and which can be identified by\
    \ name. All decorators provide a doSomething() method that first calls the same\
    \ method of the previous decorator and then proceeds with its own code. Every\
    \ time you add a decorator, you overwrite the base obj with an improved version\
    \ of it. In the end, when you are finished adding decorators, you call doSomething().\
    \ As a result, all of the doSomething() methods of all the decorators are executed\
    \ in sequence. Let's see an example."
