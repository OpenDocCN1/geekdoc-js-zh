  md: '# Objects


    A regular expression consists of:


    +   - A pattern you use to match text

    - Zero or more modifiers (also called flags) that provide more instructions on
    how the pattern should be used


    The pattern can be as simple as literal text to be matched verbatim, but that''s
    rare, and in such cases you''re better off using RegExpOf(). Most of the time,
    the pattern is more complex and could be difficult to understand. Mastering regular
    expressions'' patterns is a large topic, which won''t be discussed in full detail
    here. Instead, you''ll see what JavaScript provides in terms of syntax, objects,
    and methods in order to support the use of regular expressions. You can also refer
    to Appendix D, Regular Expressions, to help you when you''re writing patterns.


    JavaScript provides the RegExp constructor, which allows you to create regular
    expression objects:


    ```

    > var re = new RegExp(".*");

    ```


    There is also the convenient regexp literal notation:


    ```

    > var re = /j.*t/;

    ```


    In the preceding example, j.*t is the regular expression pattern. It means " matches
    any string that starts with j, ends with t, and has zero or more characters in
    between ". The asterisk (*) means " zero or more of the preceding, " and the dot
    (.) means " any character ". . The patterns need to be quoted when passed to a
    RegExp() constructor.


    # Properties of RegExp objects


    Regular expression objects have the following properties:


    +   - global: If this property is false, which is the default, the search stops
    when the first match is found. Set this to true if you want all matches.

    - ignoreCase: When the match is case insensitive, this property defaults to false
    (meaning the default is a case-sensitive match).

    - multiline: Search that may span over more than one line default to false.

    - lastIndex: The position at which to start the search; this defaults to 0.

    - source: This contains the RegExp pattern.'
