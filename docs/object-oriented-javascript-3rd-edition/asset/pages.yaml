  md: '# Comparing objects


    When you compare objects, you''ll get true only if you compare two references
    to the same object. If you compare two distinct objects that happen to have the
    exact same methods and properties, the result would be false.


    Let’s create two objects that look the same:


    ```

    > var fido = {breed: ''dog''};

    > var benji = {breed: ''dog''};

    ```


    Comparing them returns false:


    ```

    > benji === fido;

    false

    > benji === fido;

    false

    ```


    You can create a new variable, mydog, and assign one of the objects to it. This
    way, the variable mydog actually points to the same


    ```

    > var mydog = benji;

    ```


    In this case, benji is mydog because they are the same object (changing the mydog
    variable''s properties will change the benji variable''s properties). The comparison
    returns true:


    ```

    > mydog === benji;

    true

    ```


    As fido is a different object, it does not compare to mydog:


    ```

    > mydog === fido;

    false

    ```


