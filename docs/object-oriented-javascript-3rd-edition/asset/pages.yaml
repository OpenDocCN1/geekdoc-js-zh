  md: "# ES6 Iterators and Generators\n\n# Converting maps to arrays\n\nThe spread\
    \ operator (...) comes in handy if you want to convert a Map to an array:\n\n\
    ```\nconst m = new Map([\n  [ 1, 'one'],\n  [ 2, 'two'],\n  [ 3, 'three' ],\n\
    ]);\nconst keys = [...m.keys()]\nconsole.log(keys)\n//Array [\n//1,\n//2,\n//3\n\
    //]\n```\n\nAs maps are iterable, you can convert the entire Map into an array\
    \ using spread operators:\n\n```\nconst m = new Map([\n  [ 1, 'one'],\n  [ 2,\
    \ 'two'],\n  [ 3, 'three' ],\n]);\nconst arr = [...m]\nconsole.log(arr)\n//Array\
    \ [\n//1,\"one\",\n//2,\"two\",\n//3,\"three\"\n//]\n```\n\n# Set\n\nA Set is\
    \ a collection of values. You can add and remove values from it. Although this\
    \ sounds like adding to arrays, sets don't allow the same value twice. Value in\
    \ a Set can be of any type. So far, you must be wondering how this is different\
    \ from an Array? A Set is designed to do one thing quickly-membership testing.\
    \ Arrays are relatively slower at this. Set operations are similar to Map operations:\n\
    \n```\nconst s = new Set();\ns.add('first');\ns.has('first'); // true\ns.delete('first');\
