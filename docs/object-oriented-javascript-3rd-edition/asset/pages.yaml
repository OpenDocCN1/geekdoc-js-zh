  md: '# Object-Oriented JavaScript


    +   - Browser Object Model (BOM): This is a set of objects related to the browser
    environment and was never part of any standard until HTML5 started standardizing
    some of the common objects that exist across browsers.


    While there is one chapter in this book dedicated to the browser, the DOM, and
    the BOM, most of this book describes the core language and teaches you skills
    you can use in any environment where JavaScript programs run.


    # Browser wars and renaissance


    For better or worse, JavaScript''s instant popularity happened during the period
    of the browser wars I (approximately 1996 to 2001). Those were the times during
    the Internet boom when the two major browser vendors, Netscape and Microsoft,
    were competing for market share. Both were constantly adding bells and whistles
    to their browsers and their versions of JavaScript, DOM, and BOM, which naturally
    led to many inconsistencies. While adding more features, the browser vendors were
    falling behind on proper development and debugging tools and adequate documentation.
    Often, development was a pain; you would write a script testing in one browser,
    and once you''re done with development, you test in the other browser, only to
    find that your script simply fails for no apparent reason, and the best you get
    is a cryptic error message, as operation aborted.


    Inconsistent implementations, missing documentation, and no appropriate tools
    painted JavaScript in such a light that many programmers simply refused to bother
    with it.


    On the other hand, developers who did try to experiment with JavaScript got a
    little carried away, adding too many effects to their pages without much regard
    of how usable the browsers provided, were eager to make use of every new possibility
    and enhancing their web pages with things such as animations in the status bar,
    flashing colors, blinking texts, objects stalking your mouse, and many other innovations
    that actually hurt the user experience. These various ways to abuse JavaScript
    are now mostly gone, but they were one of the reasons why the language had something
    of nothing but a toy for designers to play around with, and dismissed it as a
    language unsuitable for serious applications. The JavaScript backlash caused some
    web projects to completely ban any client-side programming and trust only their
    predictable and tightly controlled server. And really, would you double the time
    to deliver a finished product and then spend additional time debugging problems
    with the different browsers?'
