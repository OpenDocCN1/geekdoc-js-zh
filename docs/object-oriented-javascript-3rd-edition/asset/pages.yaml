    # Operator precedence


    You might wonder why the previous expression (false && false || true && true)
    returned true. The answer lies in the operator precedence, as you know from mathematics:


    +   - 1 + 2 * 3;

    7


    This is because multiplication has a higher precedence over addition, so 2 * 3
    is evaluated first, as if you typed:


    +   - 1 + (2 * 3);

    7


    Similarly for logical operations, ! has the highest precedence and is executed
    first, assuming there are no parentheses that demand otherwise. Then, in order
    of precedence, comes && and ||. In other words, the following code snippets are
    the same. The first one is as follows:


    > > false && false || true && true;

    true'
