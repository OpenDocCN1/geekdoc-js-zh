  md: "# Augmenting built-in objects\n\nThe objects created by the built-in constructor\
    \ functions, such as Array, String, and even Object and Function can be augmented\
    \ (or enhanced) through the use of prototypes. This means that you can, for example,\
    \ add new methods to the Array prototype, and in this way you can make them available\
    \ to all arrays. Let's see how to do this.\n\nIn PHP, there is a function in_array(),\
    \ which tells you whether a value exists in an array. In JavaScript, there is\
    \ no Array() method, although, in ES5, there's indexOf(), which you can use for\
    \ the same purpose. So let's implement it and add it to Array.prototype, as follows:\n\
    \n```\nArray.prototype.isArray = function (needle) {\n  for (var i = 0, len =\
    \ this.length; i < len; i++) {\n    if (this[i] === needle) {\n      return true;\n\
    \    }\n  }\n  return false;\n}\n```\n\nNow, all arrays have access to the new\
    \ method. Let's test the following code:\n\n```\n> var colors = ['red', 'green',\
    \ 'blue'];\n> colors.isArray('red');\ntrue\n> colors.isArray('yellow');\nfalse\n\
    ```\n\nThat was nice and easy! Let's do it. Imagine your application often needs\
    \ to spell words backward, and you feel that there is a built-in reverse() method\
    \ for string objects. After, all arrays have reverse(). You can easily add a reverse()\
    \ method to the String prototype by borrowing Array.prototype.reverse() (there\
    \ was a similar exercise at the end of Chapter 4, Objects):\n\n```\nString.prototype.reverse\
    \ = function () {\n  return Array.prototype.reverse\n    .apply(this.split('')).join('');\n\
    }\n```\n\n;"
