  md: '# Using window.screen property


    The screen property provides information about the environment outside the browser.
    For example, the screen.colorDepth contains the color bit depth (the color quality)
    of the monitor. This is mostly used for statistical purposes. Take a look at the
    following code:


    ```

    window.screen.colorDepth;

    32

    ```


    You can also check the available screen real estate (the resolution), as follows:


    ```

    screen.width;

    1440

    screen.availWidth;

    1440

    screen.height;

    900

    screen.availHeight;

    847

    ```


    The difference between height and availHeight is that height is the whole screen,
    availHeight subtracts any operating system menus, such as the Windows task bar.
    The same is true for width and availWidth.


    Somewhat related is the property mentioned in the following code:


    ```

    window.devicePixelRatio;

    1

    ```


    It tells you the difference (ratio) between physical pixels and device pixels
    in the retina displays in mobile devices, for example, value 2 in iPhone.


    # window.open()/close() method


    Having explored some of the most common cross-browser properties of the window
    object, let''s move to some of the methods. One method is open(), which allows
    you to open new browser windows (pop ups). Various browser policies and user settings
    prevent you from opening a pop up (due to abuse of the technique for marketing
    purposes), but generally, you should be able to open a new window if it was initiated
    by the user. Otherwise, if you try to open a pop up as the page loads, it will
    most likely be blocked, because the user didn''t initiate it explicitly.'
