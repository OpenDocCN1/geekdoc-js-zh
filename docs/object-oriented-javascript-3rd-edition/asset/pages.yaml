  md: "# Primitive Data Types, Arrays, Loops, and Conditions\n\nThe following is the\
    \ most widely used for loop pattern:\n\n+   - In the initialization part, you\
    \ can define a variable (or set the initial value of an existing variable), most\
    \ often called i\n- In the condition part, you can compare i to a boundary value,\
    \ such as i < 100\n- In the increment part, you can increase i by 1, such as i++\n\
    \nHere's an example:\n\n```\nvar punishment = '';\nfor (var i = 0; i < 100; i++)\
    \ {\n    punishment += 'I will never do this again, ';';\n}\n```\n\nAll parts\
    \ (initialization, condition, and increment) can contain multiple expressions\
    \ separated by commas. Say you want to rewrite the example and define the variable\
    \ punishment inside the initialization part of the loop:\n\n```\nfor (var i =\
    \ 0, punishment = ''; i < 100; i++) {\n    punishment += 'I will never do this\
    \ again, ';\n}\n```\n\nCan you move the body of the loop inside the increment\
    \ part? Yes, you can, especially as a one-liner. This gives you a loop that looks\
    \ a little awkward, as it has no body. Note that this is just an intellectual\
    \ exercise; it's not recommended that you write awkward-looking code:\n\n```\n\
    for (\n    var i = 0, punishment = '';\n    i < 100;\n    punishment += 'I will\
    \ never do this again, ');\n\n    // nothing here\n)\n```\n\nThese parts are all\
    \ optional. Here's another way of rewriting the same example:\n\n```\nvar i =\
    \ 0, punishment = '';\nfor (;;) {\n    punishment += 'I will never do this again,\
    \ ';\n    if (++i == 100) {\n        break;\n    }\n}\n```\n\n[ 68 ]"
