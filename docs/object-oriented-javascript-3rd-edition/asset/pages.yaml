    Once listed in the nice-to-have sections of job postings, today, knowledge of
    JavaScript is often a deciding factor when it comes to hiring web developers.
    Common job interview questions you can hear today-Is JavaScript an object-oriented
    language? Good. Now, how do you implement inheritance in JavaScript? After reading
    this book, you''ll be prepared to ace your JavaScript job interview and even impress
    your interviewers with some bits that, maybe, they didn''t know.


    # ECMAScript 5


    The last most milestone in ECMAScript revisions was ECMAScript 5 (ES5), officially
    accepted in December 2009. ECMAScript 5 standard is implemented and supported
    on all major browsers and server-side technologies.


    ES5 was a major revision because apart from several important syntactic changes
    and additions to the standard libraries, ES5 also introduced several new constructs
    in the language.


    For instance, ES5 introduced some new objects and properties, and also the so-called
    strict mode. The strict mode is a subset of the language that excludes deprecated
    features. The strict mode is opt-in and not required, meaning that if you want
    your code to run in the strict mode, you will declare your intention using (once
    per function, or once for the whole program) the following string:


    ```

    "use strict";

    ```


    This is a JavaScript string, and it''s ok to have strings floating around unassigned
    to any variable. As a result, older browsers that don''t speak ES5 will simply
    ignore it, so strict mode is backwards compatible and won''t break older browsers.


    For backwards compatibility, all the examples in this book will work in ES3, but
    at the time, all the code in the book is written so that it will run without warnings
    in ES5''s strict mode. Additionally, any ES5-specific parts will be clearly marked.
    Appendix C, Built-in Objects, lists the new additions to ES5 in detail.'
