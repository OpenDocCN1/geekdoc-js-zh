  md: "Let's see one more example of a closure, this time using the function parameters.\
    \ Function\nparameters behave like local variables to this function, but they\
    \ are implicitly created; you\ndon't need to use var for them. You can create\
    \ a function that returns another function,\nwhich in turn returns its parent's\
    \ parameter, as follows:\n\n```\nfunction F(param) {\n  var N = function () {\n\
    \    return param;\n  };\n  param++;\n  return N;\n}\n```\n\nYou can use the function\
    \ as follows:\n\n```\n> var inner = F(123);\n> inner();\n```\n\nNotice how param++\
    \ was incremented after the function was defined and yet, when called,\ninner()\
    \ returned the updated value. This demonstrates that the function maintains a\n\
    reference to the scope where it was defined, and not to the variables and their\
    \ values found\nin the scope during the function execution.\n\n# Closures in a\
    \ loop\n\nLet's take a look at a canonical rookie mistake when it comes to closures.\
    \ It can easily lead to\nhard-to-spot bugs, but on the surface, everything looks\
    \ normal.\n\nLet's loop three times, each time creating a new function that returns\
    \ the loop sequence\nnumber. The new functions will be added to the array and\
    \ the array is returned at the end.\nHere's the function:\n\n```\nfunction F()\
    \ {\n  var arr = [], i;\n  for (i = 0; i < 3; i++) {\n    arr[i] = function ()\
    \ {\n      return i;\n    };\n  }\n  return arr;\n}\n```"
