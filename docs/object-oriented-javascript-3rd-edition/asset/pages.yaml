  md: '# Reactive Programming and React


    Two methods are called when a component is initially rendered, getDefaultProps
    and getState, and as their names suggest, we can set default props and initial
    state of a component in these methods.


    The componentWillMount is called before the render method is executed. We already
    know render to be the place where we return the component to be rendered. As soon
    as the render method finishes, the componentDidMount method is invoked. You can
    access DOM in this method, and it is recommended to perform any DOM interactions
    in this method.


    State changes invoke a few methods. The shouldComponentUpdate is invoked before
    the render method, and it decides if we should be rendering or skip it. This method
    is never called on the initial rendering. The componentWillUpdate method gets
    called immediately after the shouldComponentUpdate method returns true. The componentDidUpdate
    method is rendered after render finishes.


    Any change to the props object triggers similar methods as a state change. One
    additional method called is componentWillReceiveProps; it is called only when
    the props have changed, and it is not initial rendering. You can update state
    based on new and old props in this method.


    When a component is removed from DOM, componentWillUnmount is called. This is
    a useful method to perform cleanups.


    Great thing about react is when you start using it, the framework feels very natural
    to you. There are very few moving parts you will need to learn, and the abstraction
    is just right.


    # Summary


    This chapter was aimed at some of the new new ideas that are gaining a lot of
    prominence lately. Both reactive programming and react can significantly boost
    programmer productivity. React is definitely one of the most important emerging
    technologies backed by the likes of Facebook and Netflix.


    This chapter was intended to give you an introduction to both these technologies
    and help you start exploring them in more detail.'
