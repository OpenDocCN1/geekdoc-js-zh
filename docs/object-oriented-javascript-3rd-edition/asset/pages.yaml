  md: "# Default parameters\n\nFunction parameters can be assigned default values.\
    \ While calling the function, if a parameter is omitted, the default value assigned\
    \ to the parameter is used:\n\n```\nfunction render(fog_level=0, spark_level=100){\n\
    \  console.log(`Fog Level: ${fog_level} and spark_level: ${spark_level}\\`);\n\
    }\nrender(10); // Fog Level: 10 and spark_level: 100\n```\n\nIn this example,\
    \ we are omitting the spark_level parameter, and hence the default value assigned\
    \ to the parameter is used. It is important to note that undefined is considered\
    \ as an absence of a parameter value; consider the following line of code, for\
    \ example:\n\n```\nrender(undefined,10); //Fog Level: 0 and spark_level: 100\n\
    ```\n\nWhile providing default values of parameters, it is possible to refer to\
    \ other parameters as well:\n\n```\nfunction t(fog_level=1, spark_level=fog_level){\n\
    \  console.log(`Fog Level: ${fog_level} and spark_level: ${spark_level}\\`);\n\
    \  //Fog Level: 10 and spark_level: 10\n}\nfunction s(fog_level=10, spark_level=fog_level*10){\n\
    \  console.log(`Fog Level: ${fog_level} and spark_level: ${spark_level}\\`);\n\
    \  //Fog Level: 10 and spark_level: 100\n}\nt(10);\ns(10);\n```"
  merge: -1
  pgno: 95
- img_proc: true
  md: "Default parameters have their own scope; this scope is sandwiched between the\
    \ outer function scope and the inner scope of the function. If the parameter is\
    \ shadowed by a variable in inner scope, surprisingly, the inner variable is not\
    \ available. The following example will help explain this:\n\n```\nvar scope=\"\
    outer_scope\";nscoper(val){\n  var scope=\"inner_scope\"\n  console.log(val);\
    \ //outer_scope\n}\nscoper();\n```\n\nYou may expect val to get shadowed by the\
    \ inner definition of the scope variable, but as the default parameters have their\
    \ own scope, the value assigned to val is unaffected by the inner scope.\n\n#\
    \ # Rest parameters\n\nES6 introduces rest parameters. Rest parameters allow us\
    \ to send an arbitrary number of parameters to a function in the form of an array.\
    \ Rest parameter can only be the last one in the list of parameters, and there\
    \ can be only one rest parameter. Putting a rest operator(...) before the last\
    \ formal parameter that parameter is a rest parameter. The following example shows\
    \ adding a rest operator before the last formal parameter:\n\n```\nfunction sayThings(tone,\
    \ ...quotes){\n  console.log(Array.isArray(quotes)); //true\n  console.log(`In\
    \ ${tone} voice, I say ${quotes}`)\n}\nsayThings(\"Morgan Freeman\",\"Something\
    \ serious\",\nImploding Universe\",\"Amen\");\n//In Morgan Freeman voice, I say\
    \ Something serious,\nImploding Universe, Amen\n```\n\nThe first parameter passed\
    \ to the function is received in tone, while the rest of the parameters are received\
    \ as an array. Variable arguments (var-args) have been part of several other languages\
    \ and a welcome edition to ES6. Rest parameters can replace the slightly controversial\
    \ arguments variable. The major difference between rest parameters is that the\
    \ rest parameters are real arrays. All array methods are available to rest parameters."
  merge: -1
  pgno: 96
- img_proc: true
  md: "# Spread operators\n\nA spread operator looks exactly like a rest operator\
    \ but performs the exact opposite function. Spread operators are used while providing\
    \ arguments while calling a function or defining an array. The spread operator\
    \ takes an array and splits it into individual variables. The following example\
    \ illustrates how the spread operator provides a much clearer syntax when calling\
    \ functions that take an array as an:\n\n```\nfunction sumAll(a,b,c) {\n  return\
    \ a+b+c\n}\nvar numbers = [6,7,8];\n//ES5 way of passing array as an argument\
    \ of a function\nconsole.log(sumAll.apply(null,numbers)); //21\n//ES6 Spread operator\n\
    console.log(sumAll(...numbers)); //21\n```\n\nIn ES5, it is common to use the\
    \ `apply()` function when passing an array as an argument to a function. In the\
    \ preceding example, we have an array to pass to a function where the function\
    \ accepts three variables. The ES5 method of passing an array to this function\
    \ uses the `apply()` function, where the second argument allows an array to be\
    \ passed to the function being called. ES6 spread operators give a much clearer\
    \ and precise way to deal with the `numbers` array to the function call. The array\
    \ is then split into individual variables—a, b, and c.\n\nSpread operators improve\
    \ the capabilities of arrays in JavaScript. If you want to create an array that\
    \ is made up of another array, the array syntax does not support this. You have\
    \ to use `push`, `splice`, and `concat` to achieve this. However, using spread\
    \ operators, this becomes trivial:\n\n```\nvar midweek = ['Wed', 'Thu'];\nvar\
    \ weekend = ['Sat', 'Sun'];\nvar week = ['Mon', 'Tue', ...midweek, 'Fri', ...weekend];\n\
    //[\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\",\"Sat\", \"Sun\"]\nconsole.log(week);\n\
    ```\n\nIn the preceding example, we are constructing a `week` array using two\
    \ arrays, `midweek` and `weekend`, using the spread operator."
  merge: -1
