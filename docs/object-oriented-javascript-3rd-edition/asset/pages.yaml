  md: "# Arrow functions\n\nJavaScript uses almost all variations of arrows. With\
    \ ES6, it introduces a new syntax for writing functions. We have always written\
    \ function expressions in JavaScript. It is idiomatic to write code like this\
    \ in JavaScript (this example is in jQuery):\n\n```\n$(\"#submit-btn\").click(function\
    \ (event) {\n  validateForm();\n  submitMessage();\n});\n```\n\nThis is a jQuery\
    \ event handler. The event handler click() accepts a function as a parameter and\
    \ we will simply create an anonymous function expression and pass it to the click\
    \ function. This style of anonymous function expressions is known as Lambda functions.\
    \ Several other languages support this feature. Though lambdas are more or less\
    \ standard in new languages, JavaScript was responsible for popularizing their\
    \ usage, the lambda syntax in JavaScript has not been very concise. Ese arrow\
    \ functions fill gap and provide a concise syntax to write functions.\n\nArrow\
    \ function provide a more concise syntax than the traditional function expressions;\
    \ for example, consider the following piece of code:\n\n```\nconst num = [1,2,3];nconst\
    \ squares = num.map(function(n) {\n  return n*n;\n});\nconsole.log(squares); //[1,4,9]\n\
    ```\n\nArrow functions syntax can simplify the function to the following line\
    \ of code:\n\n```\nconst squares_6 =num.map( n=> n*n)\n```\n\nAs you can see,\
    \ there is no function or return keyword anywhere. If your function has only one\
    \ argument, you will end up writing the function as identifier => expression.\n\
    \nWhen you need multiple arguments, you need to wrap the argument list in braces:\n\
    \n+   - No parameters: () => {...}\n- One parameter: a => {...}\n- More than one\
    \ parameters: (a,b) => {...}"
