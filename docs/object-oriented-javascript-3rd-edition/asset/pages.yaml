  md: '# Collections


    ES6 introduces four data structures–Map, WeakMap, Set, and WeakSet. JavaScript,
    when compared to other languages as Python and Ruby, had a very weak standard
    library to support hash or Map data structures or dictionaries. Several hacks
    were invented to somehow achieve the behavior of a Map by mapping a string key
    with an object. There were effects of such hacks. Language support for such data
    structures was sorely needed.


    ES6 supports standard dictionary data structures; we will look at more details
    around these in the next section.


    # Map


    Map allows arbitrary values as keys. The keys are mapped to values. Maps allow
    fast access to values. Let''s look at some examples of maps:


    ```

    const m = new Map(); //Creates an empty Map

    m.set(''first'', 1); //Set a value associated with a key

    console.log(m.get(''first'')); //Get a value using the key

    ```


    We will create an empty Map using the constructor. You can use the set() method
    to add an entry to the Map associating key with value, and overwriting any existing
    entry with the same key. Its counterpart method, get(), gets the value associated
    with a key, or undefined if there is no entry in the map.


    There are other helper methods available with maps, which are as follows:


    ```

    console.log(m.has(''first'')); //Checks for existence of a key

    //true

    m.delete(''first'');

    console.log(m.has(''first'')); //false

    ```


    ```

    m.set(''foo'', 1)

    m.set(''bar'', 0)

    ```


    ```

    console.log(m.size); //2

    m.clear(); //clears the entire map

    console.log(m.size); //0

    ```'
