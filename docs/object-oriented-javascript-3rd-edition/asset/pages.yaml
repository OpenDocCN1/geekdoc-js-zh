  md: "Now, let's define two simple additional functions using a function declaration\
    \ pattern that only returns hardcoded values:\n\n```\nfunction one() {\n  return\
    \ 1;\n}\nfunction two() {\n  return 2;\n}\n```\n\nNow you can pass those functions\
    \ to the original function, invokeAdd(), and get the following result:\n\n+  \
    \ > invokeAdd(one, two);\n3\n\nAnother example of passing a function as a parameter\
    \ is to use anonymous functions (function expressions). Instead of defining one()\
    \ and two(), you can simply do the following:\n\n+   > invokeAdd(function () {return\
    \ 1; }, function () {return 2; }});\n3\n\nOr, you can make it more readable, as\
    \ shown in the following code:\n\n+   > invokeAdd(\n  function () { return 1;\
    \ },n  function () { return 2; }\n);\n3\n\nOr, you can do the following:\n\n+\
    \   > invokeAdd(\n  function () {\n    return 1;\n  },\n  function () {\n    return\
    \ 2;\n  }\n);\n3\n\nWhen you pass a function, A, to another function, B, and then\
    \ B executes A, it's often said that A is a callback function. If A doesn't have\
    \ a name, then you can say that it's an anonymous callback function."
