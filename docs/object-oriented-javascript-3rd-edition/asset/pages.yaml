  md: "# Coding and Design Patterns\n\n# In a private property\n\nThe solution to\
    \ the problem of overwriting the publicly visible property is not to use a public\
    \ property, but a private one. You already know how to protect variables with\
    \ a closure, so as an exercise, you can implement this approach to the singleton\
    \ pattern.\n\n# Factory pattern\n\nThe factory is another creational design pattern,\
    \ as it deals with creating objects. The factory can help you when you have similar\
    \ types of objects and you don't know in advance which one want to use. Based\
    \ on user input or other criteria, your code determines the type of object it\
    \ needs on the fly.\n\nLet's say you have three constructors that implement similar\
    \ functionality. All the objects they create take a URL but do different things\
    \ with it. One creates a text DOM node; the second creates a link; and the third,\
    \ an image, as:\n\n```\nvar MYAPP = {};\nMYAPP.dom = {};\nMYAPP.dom.Text = function\
    \ (url) {\n  this.url = url;\n  this.insert = function (where) {\n    var txt\
    \ = document.createTextNode(this.url);\n    where.appendChild(txt);\n  };\n};\n\
    MYAPP.dom.Link = function (url) {\n  this.url = url;\n  this.insert = function\
    \ (where) {\n    var link = document.createElement('a');\n    link.href = this.url;\n\
    \    link.appendChild(document.createTextNode(this.url));\n    where.appendChild(link);\n\
    \  };\n};\nMYAPP.dom.Image = function (url) {\n  this.url = url;\n  this.insert\
    \ = function (where) {\n    var im = document.createElement('img');\n    im.src\
    \ = this.url;\n    where.appendChild(im);\n  }\n};\n```\n\n[ 380 ]"
