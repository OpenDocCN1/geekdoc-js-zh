  md: 'Object-Oriented JavaScript


    # # Objects


    As the name object-oriented suggests, objects are important. An object is a representation
    of a thing (someone or something), and this representation is expressed with the
    help of a programming language. The thing can be anything, a real-life object,
    or a more convoluted concept. Taking a common object, a cat, for example, you
    can see that it has certain characteristics–color, name, weight, and so on and
    can perform some actions–meow, hide, escape, sleep, and so on. The characteristics
    of the object are called properties in OOP-speak, and the actions are called methods.


    The analogy with the spoken language are as follows:


    +   - Objects are often named using nouns, such as book, person, and so on

    - Methods are verbs, for example, read, run, and so on

    - Values of the properties are adjectives


    The sentence "The cat sleeps on the mat" as an example. "The cat" (a noun) is
    the object, "black" (adjective) is the value of the color property, and "sleep"
    (a verb) is an action or a method in OOP. For the sake of the analogy, we can
    go a step further and say that "on the mat" specifies about the action "sleep",
    so it''s acting as a parameter passed to the sleep method.


    # # Classes


    In real life, similar objects can be grouped on some criteria. A hummingbird and
    an eagle are both birds, so they can be classified as belonging to some-up Birds
    class. In OOP, a class is a blueprint or a recipe for an object. Another name
    for object is instance, so we can say that each is one concrete instance of the
    general Birds class. You can create different objects using the same class because
    a class is a template, while the objects are concrete instances on the template.


    There''s a difference between JavaScript and the classic OO languages like C++
    and Java. You should be aware right from the start that in JavaScript, there are
    no classes; everything is based on objects. JavaScript has the notion of prototypes,
    which are also objects (we''ll discuss them later in detail). In a classic OO
    language, you''d say something like–create a new object for me called Bob, which
    is of class Person. In a prototyp OO language, you''d say–I''m going to create
    this object Bob''s dad that I have lying around (on the couch in front of the
    TV?) and reuse it as a prototype for a new object that I''ll call Bob.


    [ 16 ]'
  merge: -1
