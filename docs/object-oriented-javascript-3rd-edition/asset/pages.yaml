    You can get the text contained in the paragraph using the textContent property.
    It doesn''t exist in older IEs, but another property called innerText returns
    the same value, as seen in the following:


    > > bd.childNodes[1].textContent;

    > "first paragraph"


    There is also the innerHTML property. It''s a relatively new addition to the DOM
    standard, despite the fact that it previously existed in all major browsers. It
    returns (or sets) HTML code contained in a node. You can see this is a little
    inconsistent as DOM treats the document as a tree of nodes, not as a string of
    tags. However, innerHTML is so convenient that you can use it everywhere. Refer
    to the following code:


    > > bd.childNodes[1].innerHTML;

    > "first paragraph"


    The first paragraph contains only text, so innerHTML is the same as textContent
    (or innerText in IE). However, the second paragraph does contain an em node, so
    you can see the difference in as follows:


    > > bd.childNodes[3].innerHTML;

    > "<em&gt;second&</em&gt; paragraph"

    > bd.childNodes[3].textContent;

    > "second paragraph"


    Another way to get the text contained in the first paragraph is by using the nodeValue
    method of the text contained inside the p node, as follows:


    > > bd.childNodes[1].length;

    > 1

    > bd.childNodes[1].childNodes[0].nodeName;

    > "#text"

    > bd.childNodes[1].childNodes[0].nodeValue;

    > "first paragraph"'
