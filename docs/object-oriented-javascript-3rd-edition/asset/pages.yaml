  md: "# Built-in Objects\n\nFurther there's a distinction between data descriptors\
    \ (you define the properties enumerable, configurable, value and writable) and\
    \ accessor descriptors (you define enumerable, configurable, set(), and get()).\
    \ If you define set() or get(), the descriptor is considered an accessor and attempting\
    \ to define value or writable will raise an error.\n\nDefining a regular old ES3-style\
    \ property:\n\n```\nvar person = {};\nperson.legs = 2;\n```\n\nSame using ES5\
    \ data descriptor:\n\n```\nvar person = {};\nObject.defineProperty(person, \"\
    legs\", {\n  value: 2,\n  writable: true,\n  configurable: true,\n  enumerable:\
    \ true\n});\n```\n\nThe value of value if set to undefined by default, all others\
    \ are false. So you need to set them to true explicitly if you want to be able\
    \ to change this property later.\n\nOr the same property using an ES5 accessor\
    \ descriptor:\n\n```\nvar person = {};\nObject.defineProperty(person, \"legs\"\
    , {\n  set: function (v) { this.value = v; }\n  get: function (v) { return this.value;\
    \ }\n  configurable: true,\n  enumerable: true\n});\nperson.legs = 2;\n```\n\n\
    As you can see property descriptors are a lot more code, so you only use them\
    \ if you really want to prevent someone from mangling the property, and also you\
    \ forget about backwards compatibility with ES3 browsers because, unlike additions\
    \ to Array.prototype for example, you cannot \"shim\" this feature in old browsers."
