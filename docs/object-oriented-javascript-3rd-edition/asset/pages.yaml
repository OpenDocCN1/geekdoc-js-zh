  md: "In JavaScript, traditional functions play several roles. They are non-method\
    \ functions (aka\nsubroutines or functions), methods (part of an object), and\
    \ constructors. When functions do\nt duty of the subroutine, there is a small\
    \ problem due to dynamic this. As subroutines are\ncalled on an object, the value\
    \ of this is undefined in a strict mode and set to the global\nscope otherwise.\
    \ This makes writing callbacks difficult. Consider the following example:\n\n\
    ```\nvar greeter = {\n  default: \"Hello \",n  greet: function(function(name)\
    \ {\n    names.forEach(function(name) {\n      console.log(this.default + name);\
    \ //Cannot read property\n      'default' of undefined\n    })\n  }\n}\nconsole.log(greeter.greet(['world',\
    \ 'heaven']))\n```\n\nWe are passing a subroutine to theforEach() function on\
    \ the names array. This\nsubroutine has an undefined value of this, and unfortunately,\
    \ it does not have access to\nth of the outer greet method. Clearly, this subroutine\
    \ needs a lexical this,derive this\nfrom the surrounding scope of the greet method.\
    \ To fix this limitation, we\nassign the lexical this into a variable, which is\
    \ then accessible to the subroutine via closure.\n\nWe can fix the earlier example\
    \ as follows:\n\n```\nvar greeter = {\n  default: \"Hello \",n  greet: function\
    \ (names) {\n    let that = this\n    names.forEach(function(name) {\n      console.log(that.default\
    \ + name);\n    })\n  }\n}\nconsole.log(greeter.greet(['world', 'heaven']))\n\
    ```\n\nThis is a reasonable hack to simulate lexical this. However, the problem\
    \ with such hacks is\nthat it creates too much noise for the person writing or\
    \ reviewing this code. First, you do\nto understand the quirk of the behavior\
    \ of this. Even if you understand this behavior\nwell, you will need to continuously\
    \ remain on the lookout for such hacks in your code."
