  md: "# Inheritance\n\nYou can:\n\n+   * Use prototypal inheritance to use an existing\
    \ object as a prototype of a new one\n* Copy all the properties of another object\
    \ into the newly created one:\n\n```\nfunction objectPlus(o, stuff) {\n  var n;\n\
    \  function F() {\n    F.prototype = o;\n    n = new F();\n    n.uber = o;\n \
    \ for (var i in stuff) {\n    n[i] = stuff[i];\n  }\n  return n;\n}\n```\n\nThis\
    \ function takes an object o to inherit from another object stuff that has the\
    \ additional methods and properties that are to be copied. Let's see this in action.\n\
    \nStart with the base shape object:\n\n```\nvar shape = {\n  name: 'Shape',\n\
    \  toString: function () {\n    return this.name;\n  }\n};\n```\n\nCreate a 2D\
    \ object by inheriting shape and adding more properties. The additional properties\
    \ are simply created with an object literal:\n\n```\nvar twoDee = objectPlus(shape,\
    \ {\n  name: '2D shape',\n  toString: function () {\n    return this.uber.toString()\
    \ + ' ', ' ' + this.name;\n  }\n});\n```"
