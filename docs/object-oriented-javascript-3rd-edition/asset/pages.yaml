    ```


    This command makes an alias to the little jsc application that stands for JavaScriptCore
    and is part of the WebKit engine. JavaScriptCore is shipped together with Mac
    operating systems.


    You can add the alias line shown previously to your ~/.profile file so that jsc
    is always there when you need it.'
