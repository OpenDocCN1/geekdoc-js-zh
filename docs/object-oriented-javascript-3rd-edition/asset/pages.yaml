  md: "# Coding and Design Patterns\n\n```\n } else if (document.attachEvent) { //\
    \ IE\nMYAPP.event.addEventListener = function (el, type, fn) {\n  el.attachEvent('on'\
    \ + type, fn);\n}\nMYAPP.event.removeEventListener = function (el, type, fn) {\n\
    \  el.detachEvent('on' + type, fn);\n} else { // older browsers\nMYAPP.event.addEventListener\
    \ = function (el, type, fn) {\n  el['on' + type] = fn;\n}\nMYAPP.event.removeEventListener\
    \ = function (el, type) {\n  el['on' + type] = null;\n}\n}\n```\n\nAfter this\
    \ script executes, you have the addListener() and removeListener() methods defined\
    \ in a browser-dependent way. Every time you invoke one of these methods, there's\
    \ no more feature-sniffing, and it results in lower and faster execution.\n\n\
    One thing to watch out for when sniffing is not to assume too much checking for\
    \ one feature. In the previous example, this rule is broken because the code only\
    \ checks for addEventListener support, but then defines addListener() and removeListener().\
    \ In this case, it's probably safe to assume that if a browser implements addEventListener(),\
    \ it also implements removeEventListener(). However imagine what happens if a\
    \ browser implements stopPropagation() but not preventDefault(), and you haven't\
    \ checked for these individually. You have assumed that addEventListener() is\
    \ not defined, the browser must be an old IE and write your code using knowledge\
    \ and assumptions of how IE works. Remember that all your knowledge is based on\
    \ a certain browser works today, but not necessarily the way it will work tomorrow.\
    \ To avoid many rewrites of your code as new browsers are shipped, it's best to\
    \ individually check for features you intend to use and don't generalize on what\
    \ a certain browser supports.\n\n# Lazy definition\n\nThe lazy definition pattern\
    \ is similar to the previous init-time branching pattern. The difference is that\
    \ the branching happens only when the function is called for the first time. When\
    \ the function is called, it redefines itself with the best implementation. Unlike\
    \ the init-time branching, where it happens once, during loading, here may not\
    \ happen at all, in cases where the function is never called. The lazy definition\
    \ also makes the initialization process lighter as there's no init-time branching\
    \ work to done.\n\n[ 365 ]"
