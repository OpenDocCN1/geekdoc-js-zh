  md: '# Creating arrays using Array.of


    Creating array using the Array() constructor causes a bit of a problem. The constructor
    behaves differently based on the number and type of arguments. When you pass a
    single numeric value to the Array() constructor, an array of undefined elements
    is created, with the value of the length assigned to the value of the argument:


    ```

    let arr = new Array(2)

    console.log(arr) //[undefined, undefined]

    console.log(arr.length) // 2

    ```


    On the other hand, if you pass only one non-numeric value, it becomes the only
    item in the array:


    ```

    let arr = new Array("2")

    console.log(arr) //[

    ```


    This is not all. If you pass multiple values, they become elements of the array:


    ```

    let arr = new Array(1,"2",{obj: "3"})

    console.log(arr.length) // 3

    ```


    So, there needs to be a better way to create arrays to avoid such confusion. ES6
    introduces the Array.of method that works like the Array() constructor, but guarantees
    one standard behavior. Array.of creates an array from its arguments, regardless
    of their number and type:


    ```

    let arr = Array.of(1,"2",{obj: "3"})

    console.log(arr.length) // 3

    ```


    # Array.prototype methods


    ES6 introduces several interesting methods as part of array instances. These methods
    help with array iteration and searching elements in the array, both of which are
    very frequent and useful operations.


    Here are the methods used for iterating over arrays:


    +   - Array.prototype.entries()

    - Array.prototype.values()

    - Array.prototype.keys()'
