    how any value converts to a Boolean is important. Most values convert to true
    with the exception of the following, which convert to false:


    +   - The empty string ""

    - null

    - undefined

    - The number 0

    - The number NaN

    - The Boolean false


    These six values are referred to as false, while all others are truthy, (including,
    for example, the strings "0", " , and "false")


    Let''s see some examples of the other two operators–logical AND (&&) and the logical
    OR (||). When you use &&, the result is true only if all of the operands are true.
    When you use ||, the result is true if least one of the operands is true:


    ```

    > var b1 = true, b2 = false;

    > b1 || b2;

    true

    > b1 && b2;

    false

    ```


    Here''s a list of the possible operations and their results:


    | Operation | Result |

    |---|---|

    | true && true | true |

    | true && false | false |

    | false && true | false |

    | false && false | false |

    | true || true | true |'
