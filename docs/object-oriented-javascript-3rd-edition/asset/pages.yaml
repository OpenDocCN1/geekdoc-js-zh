  md: "# Functions\n\nWhen are callback functions useful? Let's see some examples\
    \ that demonstrate the benefits of callback functions, namely:\n\n+   * They let\
    \ you pass functions without the need to name them, which means there are fewer\
    \ variables floating around\n* You can delegate the responsibility of calling\
    \ a function to another function, which means there is less code to write\n* They\
    \ can help with performance by deferring the execution or by unblocking calls\n\
    \n# Callback examples\n\nTake a look at this common scenario-you have a function\
    \ that returns a value, which you pass to another function. In our example, the\
    \ first function, multiplyByTwo(), accepts three parameters, loops through them,\
    \ multiplies them by two, and returns an array containing the result. The second\
    \ function, addOne(), takes a value, adds one to it, and returns it, as follows:\n\
    \n```\nfunction multiplyByTwo(a, b, c) {\n  var i, ar = [];\n  for (i = 0; i <\
    \ 3; i++) {\n    ar[i] = arguments[i] * 2;\n  }\n  return ar;\n}\n\nfunction addOne(a)\
    \ {\n  return a + 1;\n}\n```\n\nLet's test these functions:\n\n+   > multiplyByTwo(1,\
    \ 2, 3);\n[2, 4, 6]\n> addOne(100);\n101\n\nNow, let's say you want to have an\
    \ array, myarr, that contains three elements, and each of the elements to be passed\
    \ through both functions. First, let's start with a call to multiplyByTwo():\n\
    \n+   > var myarr = [];\n> myarr = multiplyByTwo(10, 20, 30);\n[20, 40, 60]"
  merge: -1
  pgno: 112
- img_proc: true
  md: "# Functions\n\nNow, loop through each element, passing it to addOne():\n\n\
    ```\nfor (var i = 0; i < 3; i++) {\n  myarr[i] = addOne(myarr[i]);\n}\nmyarr;\n\
    [21, 41, 61]\n```\n\nAs you can see, everything works fine, but there's room for\
    \ improvement. For example, there were two loops. Loops can be expensive if they\
    \ go through a lot of repetitions. You can achieve the same result with only one\
    \ loop. Here's how to modify multiplyByTwo() so it accepts a callback function\
    \ and invokes callback on every iteration:\n\n```\nfunction multiplyByTwo(a, b,\
    \ c, callback) {\n  var i, ar = [];\n  for (i = 0; i < 3; i++) {\n    ar[i] =\
    \ callback(arguments[i] * 2);\n  }\n  return ar;\n}\n```\n\nUsing the modified\
    \ function, all the work is done with just one function call, which passes the\
    \ start values and the callback function, as follows:\n\n```\nmyarr = multiplyByTwo(1,\
    \ 2, 3, addOne);\n[3, 5, 7]\n```\n\nInstead of defining addOne(), you can use\
    \ an anonymous function, therefore saving an extra global variable:\n\n```\nmultiplyByTwo(1,\
    \ 2, 3, function (a) {\n  return a + 1;\n}}\n[3, 5, 7]\n```\n\nAnonymous functions\
    \ are easy to change should the need arise:\n\n```\nmultiplyByTwo(1, 2, 3, function\
    \ (a) {\n  return a + 2;\n}}\n[4, 6, 8]\n```"
  merge: -1
