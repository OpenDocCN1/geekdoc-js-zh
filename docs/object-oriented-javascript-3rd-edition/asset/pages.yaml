    # Observer pattern


    The observer pattern, also known as the subscriber-publisher pattern, is a behavioral
    pattern, which means that it deals with how different objects interact and communicate
    with each other. When implementing the observer pattern, you have the objects:


    +   - One or more publisher objects that announce when they do something important.

    - One or more subscribers tuned in to one or more publishers. They listen to what
    the publishers announce and then act appropriately.


    The observer pattern may look familiar to you. It sounds like the browser events
    discussed in the previous chapter, and rightly so, because the browser events
    are one example application of this pattern. The browser is the publisher; it
    announces the fact that an event, such as a click, has happened. Your event listener
    functions that are subscribed to listen to this type of event will be notified
    when it happens. In your custom implementations, you can send any type of data
    you find appropriate.'
