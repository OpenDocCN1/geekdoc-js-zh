    \ as an object that provides some useful functionality but is meant to be inherited\
    \ and extended by subobjects. The approach to multiple inheritance outlined previously\
    \ can be considered an implementation of the mixins idea. When you create a new\
    \ object, you can pick and choose any other objects to mix into your new object.\
    \ By passing them all to multi(), you get all their functionality without making\
    \ them part of the inheritance tree.\n\n# Parasitic inheritance\n\nIf you like\
    \ the fact that you can have all kinds of different ways to implement inheritance\
    \ in JavaScript and you're hungry for more, here's another one. This pattern,\
    \ courtesy of Douglas Crockford, is called parasitic inheritance. It's about a\
    \ function that creates objects by taking all the functionality from another object\
    \ into a new one, augmenting the new object, and returning it, pretending that\
    \ it has done all the work.\n\nHere's an ordinary object, defined with an object\
    \ literal, and unaware of the fact that it's soon going to fall victim to parasitism:\n\
    \n```\nvar twoD = {\n  name: '2D shape',\n  dimensions: 2\n};\n```"
