  md: "# Asynchronous JavaScript loading\n\nYou noticed how the script was loaded\
    \ at the end of the HTML, right before closing the body. The reason is that JavaScript\
    \ blocks the DOM construction of the page, and in some browsers, even downloads\
    \ of the other components that follow. By moving the scripts to the bottom of\
    \ the page, you ensure that the script is out of the way, and when it arrives,\
    \ it simply enhances the already usable page.\n\nAnother way to prevent external\
    \ JavaScript files from blocking the page is to load them asynchronously. This\
    \ way you can start loading them earlier. HTML5 has the `defer` attribute for\
    \ this purpose. Consider the following line of code:\n\n```\n```html\n<script\
    \ defer src=\"behaviors.js\"></script>\n```\n```\n\nUnfortunately, the `defer`\
    \ attribute is not supported by older browsers, but luckily, there is a solution\
    \ that works across browsers, old and new. The solution is to create a script\
    \ node dynamically and append it to the DOM. In other words, you can use a bit\
    \ of inline JavaScript to load the external JavaScript file. You can have this\
    \ script loader snippet at the top of your document so that the download has an\
    \ early start. Take a look at the following code example:\n\n```\n```html\n...\n\
    <head>\n  <script>\n    function () {\n      var s = document.createElement('script');\n\
    \      s.src = 'behaviors.js';\n      document.getElementsByTagName('head')[0].appendChild(s);\n\
    \    }();\n  </script>\n</head>\n...\n```\n```\n\n# Namespaces\n\nGlobal variables\
    \ should be avoided in order to reduce the possibility of variable naming collisions.\
    \ You can minimize the number of globals by namesacing your variables and functions.\
    \ The idea is simple, you will create only one global object, and all your other\
    \ variables and functions become properties of that object."
  merge: -1
