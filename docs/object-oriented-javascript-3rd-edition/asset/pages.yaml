  md: "Now, using the constructor can become a little inconvenient, especially when\
    \ you want to set the third and fifth parameter, but not the second or the fourth.\
    \ Consider the following example:\n\n```\nnew MYAPP.dom.FancyButton(\n  'puuush',\
    \ null, 'white', null, 'Arial');\n```\n\nA better approach is to use one object\
    \ parameter for all the settings. The function definition can become something\
    \ like the following code snippet:\n\n```\nMYAPP.dom.FancyButton = function (text,\
    \ conf) {\n  var type = conf.type || 'submit';\n  var font = conf.font || 'Verdana';\n\
    \  //\n};\n```\n\nUsing the constructor is shown as follows:\n\n```\nvar config\
    \ = {\n  font: 'Arial, Verdana, sans-serif',\n  color: 'white'\n};\nnew MYAPP.dom.FancyButton('puuush',\
    \ config);\n```\n\nAnother usage example is as follows:\n\n```\ndocument.body.appendChild(\n\
    \  new MYAPP.dom.FancyButton('dude', {color: 'red'})\n);\n```\n\nAs you can see,\
    \ it's easy to set only some of the parameters and to switch around their order.\
    \ In addition, the code is friendlier and easier to understand when you see the\
    \ names of the parameters at the same place where you call the method.\n\nA drawback\
    \ of this pattern is the same as its strength. It is tempting to keep adding more\
    \ parameters, which means trivial to abuse the technique. Once you have an excuse\
    \ to add this free-for all bag of properties, you will find tempting to keep adding\
    \ that are not entirely optional, or some that are dependent on other properties.\n\
    \nAs a rule of thumb, these properties should be independent and optional. If\
    \ you have to check all possible combinations inside your function (\"oh, A is\
    \ set, but A is only used if B is also set\"), this is a recipe for a large function\
    \ body, which quickly becomes confusing and difficult, if not impossible, to test,\
    \ because of all the combinations."
