- img_proc: true
  md: "When your JavaScript program execution enters a new function, all the variables\
    \ declared anywhere in the function are moved, elevated, or hoisted to the top\
    \ of the function. This is an important concept to keep in mind. Further, only\
    \ the declaration is hoisted, meaning only the presence of the variable is moved\
    \ to the top. Any assignments stay where they are. In the preceding example, the\
    \ declaration of the local variable a was hoisted to the top. Only the declaration\
    \ was hoisted, not the assignment to 1. It's if the function was written in the\
    \ following way:\n\n```\nvar a = 123;\n```\n\n```\nfunction f() {\n  var a; //\
    \ same as: var a = undefined;\n  alert(a); // undefined\n  a = 1;\n  alert(a);\
    \ // 1\n}\n```\n\nYou can also adopt the single pattern mentioned previously in\
    \ the best practice section. In this case, you'll be doing a sort of manual variable\
    \ hoisting to prevent confusion with the JavaScript hoisting behavior.\n\n# Block\
    \ scope\n\nES6 provides additional scope while declaring variables. We looked\
    \ at function scope and how it affects variables with the var keyword. If you\
    \ are coding in ES6, block scope will mostly replace your need to use variables\
    \ declared using var. Although, if you are still with ES5, you want to make sure\
    \ that you look at hoisting behavior carefully.\n\nES6 introduces the let and\
    \ const keywords that allow you to declare variables.\n\nVariables declared with\
    \ let are block-scoped. They exist only within the current block. Variables declared\
    \ with var are function scoped, as we saw earlier. The following example illustrates\
    \ the block scope:\n\n```\nvar a = 1;\n{\n  let a = 2;\n  console.log( a ); //\
    \ 2\n}\nconsole.log( a ); // 1\n```"
