  md: "There's also the replaceChild() method that removes a node and puts another\
    \ one in its place.\n\nAfter removing the node, the tree looks as follows:\n\n\
    ```\n<body>\n  <p class=\"opener\">first paragraph</p>\n  <p id=\"closer\">final</p>\n\
    \  <!--\n  and that's about it -->\n</body>\n```\n\nNow, the second paragraph\
