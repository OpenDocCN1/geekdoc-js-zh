  md: '# Object-Oriented JavaScript


    # Encapsulation OOP


    Encapsulation is another OOP related concept, which illustrates the fact that
    an object contains (encapsulates) the following:


    +   - Data (stored in properties)

    - The means to do something with the data (using methods)


    One other term that goes together with encapsulation is information hiding. This
    is a rather broad term and can mean different things, let''s see what people usually
    mean when they use it in the context of OOP.


    Imagine an object, as an MP3 player. You, as the user of the object, are given
    some interface to work with, such as buttons, display, and so on. You use the
    interface to get the object to do something useful for you, like play a song.
    How exactly the device is working on the inside, you don''t know, and most often,
    don''t care. In other words, your code uses an object by calling its methods.
    It doesn''t matter if you coded the object methods work, the implementation of
    the interface is hidden from you. The same thing happens in OOP when your code
    uses itself or it comes from some third-party library; your code doesn''t need
    to know how the methods work internally. In compiled languages, you can''t actually
    read the code that makes an object work. In JavaScript, because it''s an interpreted
    language, you can see the source code, but the concept is the same-you work with
    the object''s interface without worrying about its implementation.


    Another aspect of information hiding is the visibility of methods and properties.
    In some languages, objects can define the level of access the users of the object
    have. For example, only the methods of the same object have access to private
    methods, while anyone has access to public ones. In JavaScript, all methods and
    properties are public, but we''ll see that there are ways to protect the data
    inside an object and achieve privacy.


    [ 17 ]'
  merge: -1
