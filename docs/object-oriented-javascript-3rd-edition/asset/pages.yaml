    In CSS, you have several options to define a color, two of them are as follows:


    +   * Using decimal values to specify the amount of R (red), G (green), and B
    (blue), ranging from 0 to 255. For example, rgb(0, 0, 0) is black and rgb(255,
    0, 0) is red (maximum amount of red and no green or blue).

    * Using hexadecimal and specifying two characters for each R, G, and B value.
    For example, #00000 is black and #ff0000 is red. This is because ff is the hexadecimal
    value for 255.


