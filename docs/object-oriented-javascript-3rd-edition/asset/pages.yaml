- img_proc: true
  md: '# Reactive Programming and React


    Reactive programming is essentially programming with asynchronous event streams.
    An event stream is a sequence of events happening over time. Consider the following
    diagram:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_427_0.png)


    In the preceding diagram, time passes from left to right and different events
    occur over time. As the event happens over time, we can add an event listener
    to this whole sequence. Whenever an event happens, we can react to it by doing
    something.


    Another type of sequence in JavaScript is an array. For example, consider the
    following lines of code:


    ```

    var arr = [1,1,13,''Rx'',0,0];nconsole.log(arr);

    >>> [1, 1, 13, "Rx", 0, 0]

    ```


    In this case, the entire sequence lives in memory at the same time. However, in
    case of event, events happening over time and there is no state at that point
    of time. Consider the following lines of code:


    ```

    var arr = Rx.Observable.interval(500).take(9).map(

    a=[1,1,13,''Rx'',0,0]);

    var result = arr;

    result.subscribe(x=>console.log(x));

    ```


    Don''t worry too much about what is going on in this example just yet. Here, events
    are happening over time. Instead of having a fixed bunch of elements in an array,
    here they are happening over time, after 500 ms.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# Reactive Programming and React


    We will add an event listener to the arr event stream, and when an event happens,
    we will print the element on console. You can see a similarity between the methods
    in arrays and the event streams. Now, to expand on this similarity, let''s say,
    you want to filter all numbers from this list. You can use the map function to
    this event stream, just like you would it on an array, and then you would want
    to filter the results to show only integers. Consider the following lines of code:


    ```

    var arr = [1,1,13,''Rx'',0];

    var result = arr.map(x => parseInt(x)).filter(x => !isNaN(x));

    console.log(result);

    ```


    Interestingly, the same methods work for event streams as well. Take a look at
    the following code example:


    ```

    var arr = Rx.Observable.interval(500).take(9).map(a=>[1,13,''Rx'',0](a));

    var result = arr.map(x=>parseInt(x)).filter(x => !isNaN(x));

    result.subscribe(console.log(x));

    ```


    These are simpler examples to make sure you are starting seeing how event flows
    over time. Please don''t bother about the syntax and construct just. Before we
    look at them, we need to make sure we understand how to think in reactive programming.
    Event streams are fundamental to reactive programming; they allow you to define
    the dynamic behavior of a value at declaration time (definition taken from Andre
    Startz''s blog).


    Let''s say you have a variable, which has initially the value 3. Then, you have
    a b variable, which is 10 * a. If we log out b, we will see 30. Consider the following
    lines of code:


    ```

    let a = 3;

    let b = a * 10;

    console.log(b); // 30

    a = 4;

    console.log(b); // Still 30

    ```


    We know the result is very straightforwardforward. When we change the value of
    a to 4, the value of b will not change. This is how static declaration works.
    When we talk about reactive programming and event streams, this is the area where
    people find difficulty in understanding how events flows. Ideally, we want to
    create a formula, b=a*10, and over time, whenever the value of a changes, the
    changed value is reflected in the formula.'
