    ;\n    }\n};\n()\n```\n\nAnd, you can use the module in the following way:\n\n\
    ```\nMYAPP.module.amazing.hi(); // \"hello\"\n```\n\n# Chaining\n\nChaining is\
    \ a pattern that allows you to invoke multiple methods on one line as if the methods\
    \ are in a chain. This is convenient when calling several related methods. You\
    \ invoke the next method on the result of the previous without the use of an intermediate\
    \ variable.\n\nSay you've created a constructor that helps you work with DOM elements.\
    \ The code to create a `<span>` tag that is added to the `<body>` tag can look\
    \ something like the:\n\n```\nvar obj = new MYAPP.dom.Element('span');\nobj.setText('hello');\n\
    obj.setStyle('color', 'red');\nobj.setStyle('font', 'Verdana');\ndocument.body.appendChild(obj);\n\
    ```\n\nAs you know, constructors return the object referred to as `this` keyword\
    \ that they create. You can make your methods, such as `setText()` and `setStyle()`,\
    \ also return `this` which allows you to call the next method on the instance\
    \ returned by the previous one. This way, you can chain method calls, as follows:\n\
    \n```\nvar obj = new MYAPP.dom.Element('span');\nobj.setText('hello')\n    .setStyle('color',\
    \ 'red')\n    .setStyle('font', 'Verdana')\ndocument.body.appendChild(obj);\n\
    ```"
