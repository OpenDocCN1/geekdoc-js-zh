  md: "The call() and apply() methods were discussed in Chapter 4, Objects, but here's\
    \ a refresher; they allow you to call a function and pass an object that the function\
    \ should bind to its this value. So for inheritance purposes, the child constructor\
    \ calls the parent's constructor and binds the child's newly created object as\
    \ the parent's this.\n\nLet's have this parent constructor Shape():\n\n```\nfunction\
    \ Shape() {\n  this.id = id;\n}\nShape.prototype.name = 'Shape';\nShape.prototype.toString\
    \ = function () {\n  return this.name;\n};\n```\n\nNow, let's define Triangle(),\
    \ which uses apply() to call the Shape() constructor, passing this (an instance\
    \ created with new Triangle()) and any additional arguments:\n\n```\nfunction\
    \ Triangle() {\n  Shape.apply(this, arguments);\n}\nTriangle.prototype.name =\
    \ 'Triangle';\n```\n\nNote that both Triangle() and Shape() have added some extra\
    \ properties to their prototypes.\n\nNow, let's test this by creating a new triangle\
    \ object:\n\n```\n>var t = new Triangle(101);\n>t.name;\n\"Triangle\"\n```\n\n\
    The new triangle object inherits the id property from the parent, but it doesn't\
    \ inherit anything added to the parent's prototype:\n\n```\n>t.id;\n101\n>t.toString();\n\
    \"[object Object]\"\n```"
