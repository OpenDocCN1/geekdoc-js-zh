  md: "# Singleton pattern\n\nSingleton is a creational design pattern, meaning that\
    \ its focus is on creating objects. It helps when you want to make sure there\
    \ is only one object of a given kind or class. In a classical language, this would\
    \ mean that an instance of a class is only created once, and any subsequent attempts\
    \ to create new objects of the same class would return the original instance.\n\
    \nIn JavaScript, because there are no classes, a singleton is the default and\
    \ most natural pattern. Every object is a singleton object.\n\nThe most basic\
    \ implementation of the singleton in JavaScript is the object literal. Take a\
    \ look at the following line of code:\n\n```\nvar single = {};\n```\n\nThat was\
    \ easy, right?\n\n# Singleton 2 pattern\n\nIf you want to use a class-like syntax\
    \ and still implement the singleton pattern, things become a bit more interesting.\
    \ Let's say, you have a constructor called Logger(), and you want to be able to\
    \ do something like the following:\n\n```\nvar my_log = new Logger();\nmy_log.log('some\
    \ event');\n\n// ... 1000 lines of code later in a different scope\n\nvar other_log\
    \ = new Logger();\nother_log.log('some new event');\nconsole.log(other_log ===\
    \ my_log); // true\n```\n\nThe idea is that, although you use new, only one instance\
    \ needs to be created, and this instance is returned in consecutive calls.\n\n\
    # Global variable\n\nOne approach is to use a global variable to store the single\
    \ instance. Your constructor could look like the code snippet:\n\n```\nfunction\
    \ Logger() {\n  if (typeof global_log === \"undefined\") {\n```"
