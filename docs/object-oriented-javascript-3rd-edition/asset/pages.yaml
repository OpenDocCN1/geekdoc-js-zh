  md: 'Reactive Programming and React


    # React


    React is taking the JavaScript world by storm. Facebook created the react framework
    to solve an age-old problem–how to deal efficiently with the view part of the
    traditional Model-View-Controller applications.


    React provides a declarative and flexible way to build user interfaces. The most
    important thing to remember about react is that it deals with only one thing–the
    view, or the UI. React does not deal with data, data bindings, and anything else.
    There are complete frameworks, such as Angular, that deal with data, bindings,
    and UI; React is not.


    React gives a template language and a small set of functions to render HTML. React
    components can store their state in memory. To build a full-fledged application,
    you will need other pieces as well; React is just to handle the view part of that
    application.


    A big challenge when writing complex UI is to manage state of the UI elements
    when the model changes. React provides a declarative API so that you don''t have
    to worry about what changes on every update. This makes writing applications a
    lot easier. React uses Virtual DOM and diff algorithm, so that component updates
    are predictable fast enough for high-performance apps.


    # Virtual DOM


    Let''s take a moment to understand what is a Virtual DOM. We discussed DOM (document
    object model), a tree of HTML element on a web page. DOM is de facto, and the
    primary rendering mechanism of the web. DOM APIs, such as getElementById(), allowing
    traversal and modification of the elements in the DOM tree. DOM is a tree and
    this structure works pretty well with traversal and updating of elements. However,
    both the traversing and updating of DOM is not very quick. For a large page, the
    DOM tree has bunch of user interactions, updating DOM elements can be tedious
    and slow. We have tried jQuery and other libraries to reduce the tedious syntax
    for frequent DOM modifications, but DOM as a structure is quite limited.


    What if we don''t have to traverse the DOM over and again modify elements? What
    if you just declare a component should look like and let someone handle the logic
    of how to render that component? react does exactly that. React lets you you want
    your UI element to look like and abstracts low-level DOM manipulation APIs. Apart
    from this very useful, react does something pretty smart to solve the performance
    problem as well.


    [ 412 ]'
  merge: -1
