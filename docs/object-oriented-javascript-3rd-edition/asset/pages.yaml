  md: '# The Browser Environment


    CSS properties often have dashes, but dashes are not acceptable in JavaScript
    identifiers. In such cases, skip the dash and uppercase the next letter. So, padding-top
    becomes paddingTop, margin-left becomes marginLeft, and so on. Take a look at
    the following code:


    ```

    > my.style.fontWeight += ''bold'';

    "bold"

    ```


    You also have to the cssText property of style, which lets you work with styles
    as strings, you can use in the following code snippet:


    ```

    > my.style.cssText;

    "border: 1px solid red; font-weight: bold;"

    ```


    Moreover, modifying styles is a string manipulation:


    ```

    > my.style.cssText += " border-style: dashed;"

    "border: 1px dashed red; font-weight: bold; border-style: dashed;"

    ```


    # Fun with forms


    As mentioned earlier, JavaScript is great for client-side input validation and
    can save few round-trip to the server. Let''s practice form manipulations and
    play a little bit with a form located on a popular page, www.google.com:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_343_0.png)


    Finding the first text input using the querySelector() method and a CSS selector
    string as follows:


    ```

    > var input = document.querySelector(''input[type=text]'');

    ```


    Accessing the search box. Consider the following code:


    ```

    > input.name;

    "q"

    ```'
