    # Summary


    Let''s summarize the most important topics you have learned in this chapter:


    +   All functions have a property called prototype. Initially, it contains an
    empty object-an object without any own properties.


    +   You can add properties and methods to the prototype object. You can even replace
    it completely with an object of your choice.


    +   When you create an object using a function as a constructor (with new), the
    object gets a secret link pointing to the prototype of the constructor and can
    access the prototype''s properties.


    +   An object''s own properties take precedence over a prototype''s properties
    with the same name.


    +   Use the hasProperty() method to differentiate between an object''s properties
    and prototype properties.


    +   There is a prototype chain. When you execute foo.bar, and if your foo object
    doesn''t have a property called bar, the JavaScript interpreter looks for a bar
    property in the prototype. If none is found, it searches in the prototype''s prototype,
    then the prototype of the prototype''s prototype, and it will keep going all the
    way up to Object.prototype.


    +   You can augment the prototypes of built-in constructor functions, and all
    objects will see your additions. Assign a function to Array.prototype.flip and
    all arrays will immediately get a flip() method, as in [1, 2, 3].flip(). But,
    do check whether the method/property you want to add already exists, so you can
    future-proof your scripts.'
