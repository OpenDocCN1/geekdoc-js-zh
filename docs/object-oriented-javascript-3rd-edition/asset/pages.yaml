    \ a namespace utility that makes your life easier so that you can use more convenient\
    \ syntax as follows:\n\n```\nMYAPP.namespace('dom.style');\n```\n\nInstead of\
    \ the more verbose syntax as follows:\n\n```\nMYAPP.dom = {};\nMYAPP.dom.style\
    \ = {};\n```\n\nHere's how you can create such a namespace() method. First, by\
    \ splitting the input string using the (.) as a separator. Then, for every element\
    \ in the array, you will add a property to your global object, if one doesn't\
    \ already exist, as as follows:\n\n```\nvar MYAPP = {};\nMYAPP.namespace = function\
    \ (name) {\n  var parts = name.split('.');\n  var current = MYAPP;\n  for (var\
    \ i = 0; i < parts.length; i++) {\n    if (!current[parts[i]]) {\n      current[parts[i]]\
    \ = {};\n    }\n    current = current[parts[i]];\n  }\n};\n```"
