  md: "# Coding and Design Patterns\n\nIn this implementation, styles is a private\
    \ property and setStyle() is a private method. The constructor uses them internally\
    \ (and they can access anything inside the constructor), but they are not available\
    \ to code outside the function.\n\n# Privileged methods\n\nPrivileged methods\
    \ (this term was coined by Douglas Crockford) are normal public methods that can\
    \ access private methods or properties. They can act like a bridge in making some\
    \ of the private functionality accessible, but in a controlled manner, wrapped\
    \ in a privileged method.\n\n# Private functions as public methods\n\nLet's say\
    \ you've defined a function that you absolutely need to keep intact, so you make\
    \ it private. However, you also want to provide access to the same function, so\
    \ that outside code can also benefit from it. In this case, you can assign the\
    \ private function to a properly property.\n\nLet's define _setStyle() and _getStyle()\
    \ as private functions, then assign them to the public setStyle() and getStyle(),\
    \ consider the following example:\n\n```\nvar MYAPP = {};\nMYAPP.dom = (function\
    \ () {\n  var _setStyle = function (el, prop, value) {\n    console.log('setStyle');\n\
    \  };\n  var _getStyle = function (el, prop) {\n    console.log('getStyle');\n\
    \  };\n  return {\n    setStyle: _setStyle,\n    getStyle: _getStyle,\n    yetAnother:\
    \ _setStyle\n  };\n})();\n```"
  merge: -1
