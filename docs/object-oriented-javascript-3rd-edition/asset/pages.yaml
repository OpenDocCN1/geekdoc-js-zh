  md: "A property of an object can point to a function, because functions are just\
    \ data. Properties that point to functions are also called methods. In the following\
    \ example, talk is a method:\n\n```\nvar dog = {\n  name: 'Benji',\n  talk: function\
    \ () {\n    alert('Woof, woof!');\n  }\n};\n```\n\nAs you have seen in the previous\
    \ chapter, it's also possible to store functions as array elements and invoke\
    \ them, but you'll not see much code like this in practice:\n\n+   > var a = [];\n\
    > a[0] = function (what) { alert(what); };\n> a[0] = ('Woof');\n\nYou can also\
    \ see people using the word members to refer to the properties of an object, most\
    \ often when it doesn't matter if the property is a function or not.\n\n# Hashes\
    \ and associative arrays\n\nIn some programming languages, there is a distinction\
    \ between:\n\n+   - A regular array, also called an indexed or enumerated array\
    \ (the keys are numbers)\n- An associative array, also called a hash or a dictionary\
    \ (the keys are strings)\n\nJavaScript uses arrays to represent indexed arrays\
    \ and objects to represent associative arrays. If you want a hash in JavaScript,\
    \ you use an object.\n\n# Accessing an object's properties\n\nThere are two ways\
    \ to access the property of an object:\n\n+   - Using the square bracket notation,\
    \ for example, hero['occupation']\n- Using the dot notation, for example, hero.occupation"
