  md: '# Inheritance


    The name of the uber property could have been superclass, but this would suggest
    that JavaScript has classes. Ideally, it''dve been super (as in Java), but super
    is a reserved word in JavaScript. The German word uber suggested by Douglas Crockford
    means less the same as super, and you have to admit, it sounds cool.


    # Isolating the inheritance part into a function


    Let''s move the code that takes care of all the inheritance details from the last
    example into a reusable extend() function:


    ```

    function extend(Child, Parent) {

    var F = function () {};

    F.prototype = Parent.prototype;

    Child.prototype = new F();

    Child.prototype.constructor = Child;

    Child.uber = Parent.prototype;

    }

    ```


    Using this function (or your custom version of it) helps you keep your code clean
    with regard to the repetitive inheritance-related tasks. This way, you can inherit
    by simply using the following lines of code:


    ```

    extend(TwoDShape, Shape);

    extend(Triangle, TwoDShape);

    ```


    Let''s see a complete example:


    ```

    // inheritance helper

    function extend(Child, Parent) {

