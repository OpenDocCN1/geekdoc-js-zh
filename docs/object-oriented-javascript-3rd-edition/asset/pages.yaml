  md: "# Primitive Data Types, Arrays, Loops, and Conditions\n\nLet's say you are\
    \ (your program execution is) traveling from A to B. At some point, you will reach\
    \ a place where you have to evaluate a condition, C. The result of evaluating\
    \ C tells you whether you go into a loop, L. You make one iteration and arrive\
    \ at C again. Then, you evaluate the condition once again to see if another iteration\
    \ is needed. Eventually, you move on your way to B:\n\n![](img/717ca68bb945a398c8e0c562c6cc94d7_84_0.png)\n\
    \nAn infinite loop is when the condition is always true, and your code gets stuck\
    \ in the loop forever. This is, of course, a logical error, and you should look\
    \ out for such scenarios.\n\nIn JavaScript, the following are the four types of\
    \ loops:\n\n+   * while loops\n* do-while loops\n* for loops\n* for-in loops\n\
    \n# While loops\n\nThe while loops are the simplest type of iteration. They look\
    \ like the following:\n\n```\nvar i = 0;\nwhile (i < 10) {\n  i++;\n}\n```\n\n\
    The while statement is followed by a condition in parentheses and a code block\
    \ in curly brackets. As long as the condition evaluates to true, the code block\
    \ is executed over and again again."
