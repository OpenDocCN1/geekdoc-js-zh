  md: '# # 6 Prototype


    In this chapter, you''ll learn about the prototype property of the function objects.
    Understanding how the prototype works is an important part of learning the JavaScript
    language. After all, JavaScript is often classified as having a prototype-based
    object model. There''s nothing particularly difficult about the prototype, but
    it''s a new concept, and as such, may sometimes take a bit of time to sink in.
    Like closures the prototype is one of those things in JavaScript which, once you
    get, seem obvious and make perfect sense. As with the rest of this book, you''re
    strongly encouraged to type in and play around with the examples – this makes
    it much easier to learn and remember the concepts.


    In this chapter, we will cover the following topics:


    +   * Every function has a prototype property and it contains an object

    * Adding properties to the prototype object

    * Using the properties added to the prototype

    * The difference between own properties and properties of the prototype

    * The __proto__ property, the secret link every object keeps to its prototype

    * Methods such as isPrototypeOf(), hasOwnProperty(), and propertyIsEnumerable()

    * Enhancing built-in objects, such as arrays or strings, and why that can be a
    bad idea'
