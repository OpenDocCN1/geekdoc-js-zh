- img_proc: true
  md: "As functions are data assigned to variables, the same rules for naming functions\
    \ apply for naming variables—a function name cannot start with a number and it\
    \ can contain any combination of letters, numbers, the underscore character, and\
    \ the dollar sign.\n\n# Anonymous functions\n\nAs you now know, there exists a\
    \ function expression syntax where you can have a function defined like the following:\n\
    \n```\nvar f = function (a) {\n  return a;\n};\n```\n\nThis is also called an\
    \ anonymous function (as it doesn't have a name), especially when such a function\
    \ is used even without assigning it to a variable. In this case, there can be\
    \ two elegant uses for such anonymous functions, which are as follows:\n\n+  \
    \ * You can pass an anonymous function as a parameter to another function. The\
    \ receiving function can do something useful with the function that you pass.\n\
    * You can define an anonymous function and execute it right away.\n\nLet's see\
    \ these two applications of anonymous functions in more detail.\n\n# Callback\
    \ functions\n\nAs a function is just like other data assigned to a variable, it\
    \ can be defined, copied, and also passed as an argument to other functions.\n\
    \nHere's an example of a function that accepts two functions as parameters, executes\
    \ them, and returns the sum of each of them returns:\n\n```\nfunction invokeAdd(a,\
    \ b) {\n  return a() + b;\n}\n```"
  merge: -1
