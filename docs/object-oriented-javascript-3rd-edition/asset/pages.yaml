    \ will be the same:\n\n```\n> a()();\n```\n\n# Function, rewrite yourself!\n\n\
    As a function can return a function, you can use the new function to replace the\
    \ old one. Continuing with the previous example, you can take the value returned\
    \ by the call to a() to overwrite the actual a() function: order to avoid doing\
    \ unnecessary repetitive work every time it's called.\n\n```\n> a = a();\n```\n\
    \nThe preceding line code alert A!, but the next time you call a() it alerts B!\
    \ This is useful when a function has some initial one-off work to do. The function\
    \ overwrites itself after the first call in order to avoid doing unnecessary repetitive\
    \ work every time it's called.\n\nIn the preceding example, the function was redefined\
    \ from the outside and the returned value was assigned back to the function. But\
    \ the function can actually rewrite itself from the inside, as shown in the following\
    \ example:\n\n```\nfunction a() {\n  alert('A!');\n  a = function () {\n    alert('B!');\n\
    \  };\n}\n```\n\nIf you call this function for the first time, it will do the\
    \ following:\n\n+   * Alert A! (consider this as being the one-off preparatory\
