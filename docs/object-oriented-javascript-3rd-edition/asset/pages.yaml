    \  }\n}\n```\n\n```\nhref = \"http://search.phpied.com:8080/search?\nq-java&what=\"\
    @results\"\nhash = \"#results\"\nhost = \"search.phpied.com:8080\"\nhostname =\
    \ \"search.phpied.com\"\npathname = \"/search\"\nport = <<http:>\nprotocol = <<http:>\n\
    search = \"?q=java&what=script\";\n```\n\nThere are also three methods that location\
    \ provides, namely reload(),\nassign(), and replace().\n\nIt's interesting how\
