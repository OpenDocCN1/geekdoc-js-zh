    [1, "two", false, null, undefined, Array[3]]

    ```


    The Array[3] in the result is clickable in the console and it expands the array
    values. Let''s look at an example where you have an array of two elements, both
    of them being other arrays:


    ```

    > var a = [[1, 2, 3], [4, 5, 6]];

    > a;

    [Array[3], Array[3]]

    ```'
