    for (var i in p) { c[i] = p[i]; } c.uber = p; return c; }` | • Works with objects

    • Copies properties | • Simple

    • Doesn''t use prototypes |

    | 6 | Deep copy | Same as the previous one, but recurse into objects | • Works
    with objects

    • Copies properties | • Same as #5, but clones objects and arrays |'
