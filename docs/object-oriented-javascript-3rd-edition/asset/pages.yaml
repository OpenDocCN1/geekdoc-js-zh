  md: "# Deep copy\n\nThe extendCopy() function discussed previously creates what\
    \ is called a shallow copy of an object, just like extend2() before that. The\
    \ opposite of a shallow copy would be, naturally, a deep copy. As discussed previously\
    \ (in the Heads-up copying by reference section of this chapter), when you copy\
    \ objects, you only copy pointers to the location in memory where the object is\
    \ stored. This is what happens in a shallow copy. If you modify an object in the\
    \ copy, you also modify the original. The deep copy solves this problem.\n\nThe\
    \ deep copy is implemented in the same way as the shallow copy–you loop through\
    \ the properties and copy them one by one. However, when you encounter a property\
    \ that points to an object, you call the deepcopy function:\n\n```\nfunction deepCopy(p,\
    \ c) {\n  c = c || {};\n  for (var i in p) {\n    if (p.hasOwnProperty(i)) {\n\
    \      if (typeof p[i] === 'object') {\n        c[i] = Array.isArray(p[i]) ? []\
    \ : {};\n        deepCopy(p[i], c[i]);\n      } else {\n        c[i] = p[i];\n\
    \      }\n    }\n  }\n  return c;\n}\n```\n\nLet's create an object that has arrays\
    \ and a subobject properties:\n\n```\nvar parent = {\n  numbers: [1, 2, 3],\n\
    \  letters: ['a', 'b', 'c'],\n  obj: {\n    prop: 1,\n    bool: true\n  }\n};\n\
    ```\n\nLet's test this by creating a deep copy and a shallow copy. Unlike the\
    \ shallow copy, when you update the numbers property of a deep copy, the original\
    \ is not affected:\n\n```\nvar mydeep = deepCopy(parent);\nvar mysallow = extendCopy(parent);\n\
    mydeep.numbers.push(4, 5, 6);\n```"
