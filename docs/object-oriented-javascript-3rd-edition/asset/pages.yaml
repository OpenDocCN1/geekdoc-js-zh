  md: "# Coding and Design Patterns\n\nLet's see an example that illustrates this\
    \ via the definition of an addEventListener() function. The function is first\
    \ defined with a generic body. It checks whether functionality is supported by\
    \ the browser when it's called for the first time and redefines itself using the\
    \ most suitable implementation. At the end of the first call, the function calls\
    \ itself so that the actual event attaching is performed. The next time you call\
    \ the same function, it will be defined with its new body and ready for use, so\
    \ no further branching is necessary. The following is the code snippet\n\n```\n\
    var MYAPP = {\n  MYAPP.myevent = {\n    addEventListener: function (el, type,\
    \ fn) {\n      if (el.addEventListener) {\n        MYAPP.myevent.addEventListener\
    \ = function (el, type, fn) {\n          el.addEventListener(type, fn, false);\n\
    \        }\n      } else if (el.attachEvent) {\n        MYAPP.myevent.addEventListener\
    \ = function (el, type, fn) {\n          el.attachEvent('on' + type, fn);\n  \
    \      }\n      } else {\n        MYAPP.myevent.addEventListener = function (el,\
    \ type, fn) {\n          el['on' + type] = fn;\n        }\n      }\n      MYAPP.myevent.addEventListener(el,\
    \ type, fn);\n    }\n  }\n};\n```\n\n# Configuration object\n\nThis pattern is\
    \ convenient when you have a function or method that accepts a lot of optional\
    \ parameters. It's up to you to decide how many constitutes a lot. But generally,\
    \ a function with more than three parameters is not convenient to call, because\
    \ you have to remember the order of the parameters, and it is even more inconvenient\
    \ when some of the parameters are optional."
