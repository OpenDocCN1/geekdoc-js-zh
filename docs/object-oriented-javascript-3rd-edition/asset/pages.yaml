    \ inside a block should be placed one per line and separated by semicolons.\n\n\
    Indent any code placed within curly brackets. Some programmers like one tab indentation,\
    \ some use four spaces, and some use two. It doesn't matter, as long as you're\
    \ consistent. In the preceding example, the outer block is indented with two spaces,\
    \ the code in the first nested block is indented with four spaces, and the innermost\
    \ block is indented with six spaces.\n\nUse curly brackets. When a block consists\
    \ of only one expression, the curly brackets are optional, but for readability\
    \ and maintainability, you should get into the habit of using them, even when\
    \ they're optional.\n\n# The if condition\n\nHere's a simple example of an if\
    \ condition:\n\n```\nvar result = '', a = 3;\nif (a > 2) {\n    result = 'a is\
    \ greater than 2';\n}\n```\n\nThe parts of the if condition are as follows:\n\n\
    +   - The if statement\n- A condition in parentheses-is a greater than 2?\n- A\
    \ block of code wrapped in {} that executes if the condition is satisfied\n\n\
    The condition (the part in parentheses) always returns i Boolean value, and may\
    \ contain the following:\n\n+   - A logical operation—!, &&, or || ||\n- A comparison,\
    \ such as ==, !=, >, and so on\n- Any value or variable that can be converted\
    \ to a Boolean\n- A combination of the above"
