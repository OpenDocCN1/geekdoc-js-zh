- img_proc: true
  md: "# Inline HTML attributes\n\nAdding specific attributes to a tag is the laziest\
    \ but the least maintainable way; take the following line of code as an example:\n\
    \n```\n<div onclick=\"alert('Ouch!')\">click</</div>\n```\n\nIn this case, when\
    \ the user clicks on &lt;div&gt;, the click event fires and the string of JavaScript\
    \ code contained in the onclick attribute is executed. There's no explicit function\
    \ that listens to the click event; however, behind the scenes, a function is still\
    \ created, and it contains the code you specified as a value of the onclick attribute.\n\
    \n# Element Properties\n\nAnother way to have some code executed when a click\
    \ event fires is to assign a function to the onclick property of a DOM node element.\
    \ For example, take a look at the following piece of code:\n\n```\n<div id=\"\
    my-div\">click</</div>\n<script>\n  var myelement = document.getElementById('my-div');\n\
    \  mylist.onclick = function () {\n    alert('Ouch!');\n    alert('And double\
    \ ouch!');\n  }\n</script>\n```\n\nThis way is better because it helps keep the\
    \ &lt;div&gt; tag clean of any JavaScript code. Always keep in mind that HTML\
    \ is for content, JavaScript for behavior, and CSS for formatting, and you should\
    \ keep these three separate as much as possible.\n\nThis method has the drawback\
    \ that you can attach only one function to the event, as if the radio program\
    \ has only one listener. It's true that you can have a lot happening inside the\
    \ same function, but this is not always convenient, as if all the radio listeners\
    \ are in the same room."
  merge: -1
  pgno: 355
- img_proc: true
  md: "# DOM event listeners\n\nThe best way to work with browser events is to use\
    \ the event listener approach outlined in DOM Level 2, where you can have many\
    \ functions listening to an event. When an event fires, all the functions are\
    \ executed. All of the listeners don't need to know about each other and can work\
    \ independently. They can tune in and out at any time, without affecting the other\
    \ listeners.\n\nLet's use the same simple markup from the previous section, which\
    \ is available for you to play with at http://www.phpied.com/files/jsoop/ch7.html.\
    \ It has this piece of markup, which is as follows:\n\n```\n<p id=\"closer\">final</p>\n\
    ```\n\nYour JavaScript code can assign listeners to the click event using the\
    \ addEventListener method. Let us assign listeners as follows:\n\n```\nvar mypara\
    \ = document.getElementById('closer');\nmypara.addEventListener('click', function\
    \ () {\n  alert('Boo!');\n}, false);\nmypara.addEventListener('click', console.log.bind(console),\
    \ false);\n```\n\nAs you can see, addEventListeners\n\n# Capturing and bubbling\n\
    \nIn the calls to addEventListener(), there was a third parameter-false. Let's\
    \ see what it is.\n\nLet's say you have a link inside an unordered list, which\
    \ is as follows:\n\n```\n<body>\n<ul>\n  <li><a href=\"http://phpied.com\">my\
    \ blog</a></li>\n</ul>\n</body>\n```"
  merge: -1
  pgno: 356
- img_proc: true
  md: '# The Browser Environment


    When you click on the link, you''re actually also clicking on the list item, <li>,
    the <ul> list, the <body> tag, and eventually, the document as a whole. This is
    called event propagation. A click on a link can also be seen as a click on the
    document. The process of propagating an event can be implemented in the two following
    ways:


    +   - Event capturing: This click happens in the document first, then it propagates
    down to the body, the list, the list item, and finally, to the link

    - Event bubbling: This click happens on the link and then bubbles back up to the
    document


    DOM level 2 events specification suggests that the events propagate in three phases,
    namely, capturing, at target, and bubbling. This means that the event propagates
    from the document to the link (target) and then bubbles back up the document.
    The event objects have an eventPhase property, which reflects the current phase:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_357_0.png)


    Historically, IE and Netscape (working on their own and without a standard to
    follow) implemented the exact opposites. IE implemented only bubbling and Netscape
    only capturing. Today, long after the DOM specification, modern browsers implement
    all three phases.


    [ 339 ]'
  merge: -1
  pgno: 357
- img_proc: true
  md: "The Browser Environment\n\nThe practical implications related to the event\
    \ propagation are as follows:\n\n+   - The third parameter to addEventListener()\
    \ specifies whether or not capturing should be used. In order to have your code\
    \ more portable across browsers, it's better to set this parameter to false and\
    \ use bubbling.\n\n+   - You can stop the propagation of the event in your listeners\
    \ so that it stops bubbling up and never reaches the document. To do this, you\
    \ can call the stopPropagation() method of the event object; there is an example\
    \ in the section.\n\n+   - You can also use event delegation. If you have ten\
    \ buttons inside <div>, you can always attach ten listeners, one for each button.\
    \ However, a smarter thing is to attach only one listener to the wrapping <div>\
    \ and once the event happens, check which button was the target of the click.\n\
    \nAs a side note, there is a way to use event capturing in old IEs too (using\
    \ setCapture() and releaseCapture() methods) but only for mouse events. Capturing\
    \ any other events (keystate events for example) is not supported.\n\n# Stop propagation\n\
    \nLet's see an example of how you can stop the event from bubbling up. Going back\
    \ to the test document, there is this piece of code:\n\n```\n<p id=\"closer\"\
    >final</p>\n```\n\nLet's define a function that handles clicks on the paragraph,\
    \ as follows:\n\n```\nfunction paraHandler() {\n  alert('clicked paragraph');\n\
    }\n```\n\nNow, let's attach this function as a listener to the click event:\n\n\
    ```\nvar para = document.getElementById('closer');\npara.addEventListener('click',\
    \ paraHandler, false);\n```"
  merge: -1
  pgno: 358
- img_proc: true
  md: "Let's also attach listeners to the click event on the body, the document, and\
    \ the browser window:\n\n```\ndocument.body.addEventListener('click', function\
    \ () {\n  alert('clicked body');\n  }, false);\ndocument.addEventListener('click',\
    \ function () {\n  alert('clicked doc');\n  }, false);\nwindow.addEventListener('click',\
    \ function () {\n  alert('clicked window');\n  }, false);\n```\n\nNote that the\
    \ DOM specifications don't say anything about events on the window. And why would\
    \ they, as DOM deals with the document and not the browser. So browsers implement\
    \ window events inconsistently.\n\nNow, if you click on the paragraph, you'll\
    \ see four alerts saying:\n\n+   * clicked paragraph\n* clicked body\n* clicked\
    \ doc\n* clicked window\n\nThis illustrates how the same single click event propagates\
    \ (bubbles up) from the target all the way up to the window.\n\nThe opposite of\
    \ addEventListener() is removeEventListener(), and it accepts exactly the same\
    \ parameters. Let's remove the listener attached to the paragraph by writing the\
    \ following line of code:\n\n> > para.removeEventListener('click', paraHandler,\
    \ false);\n\nIf you try now, you'll see alerts only for the click event on the\
    \ body, document, and window, but not on the paragraph.\n\nNow, let's stop the\
    \ propagation of the event. The function you add as a listener receives the event\
    \ object as a parameter, and you can call the stopPropagation() method of that\
    \ event object as follows:\n\n```\nfunction paraHandler(e) {\n  alert('clicked\
    \ paragraph');\n  e.stopPropagation();\n}\n```"
  merge: -1
  pgno: 359
- img_proc: true
  md: "Adding the modified listener is done as follows:\n\n```\npara.addEventListener('click',\
    \ paraHandler, false);\n```\n\nNow, when you click on the paragraph, you will\
    \ see only one alert because the event doesn't bubble up to the top, the document,\
    \ or the window.\n\nNote that when you remove a listener, you have to pass a pointer\
    \ to the same function you previously attached. Otherwise, the following does\
    \ not work because the argument is not a function, not the same you passed when\
    \ adding the event listener, if the body is exactly the same. Consider the following\
    \ code:\n\n```\ndocument.body.removeEventListener('click',\nfunction () {\n  alert('clicked\
    \ body');\n  \nfalse); // does NOT remove the handler\n```\n\n# Prevent default\
    \ behavior\n\nSome browser events have a predefined behavior. For example, clicking\
    \ a link causes the browser to navigate to another page. You can attach listeners\
    \ to clicks on a link, and you can also disable the default behavior by calling\
    \ the preventDefault() method on the event object.\n\nLet's see how you can annoy\
    \ your visitors by asking \"Are sure you want to follow this link?\" every time\
    \ you click a link? If the user clicks on Cancel (causing confirm() to return\
    \ false) the preventDefault() method is called, which is shown as follows:\n\n\
    ```\n// all links\nvar all_links = document.getElementsByTagName('a');\nfor (var\
    \ i = 0; i < all_links.length; i++) { // loop links\n  all_links[i].addEventListener(\n\
    \    'click', // event type\n    function () { // handler\n      if (!confirm('Sure\
    \ you want to follow this link?')) {\n        e.preventDefault();\n      }\n \
    \   },\n    false // don' use capturing\n  );\n```"
  merge: -1
  pgno: 360
- img_proc: true
  md: "# The Browser Environment\n\nNote that not all events allow you to prevent\
    \ the default behavior. Most do, but if you want to be sure, you can check the\
    \ cancellable property of the event object.\n\n# Cross-browser event listeners\n\
    \nAs you already know, most modern browsers almost fully implement the DOM Level\
    \ 1 specification. However, the events were not standardized until DOM 2. As a\
    \ result, there are quite few differences in IE, before version 9, implements\
    \ this functionality compared to modern browsers.\n\nCheck out an example that\
    \ causes nodeName of the element (the target element) to be written to the console:\n\
    \n```\ndocument.addEventListener('click', function (e) {\n  console.log(e.target.nodeName);\n\
    }, false);\n```\n\nNow, let's take a look at how IE differs:\n\n+   - IE, there's\
    \ no addEventListener() method; although, since IE 5, there is an equivalent attachEvent()\
    \ method. For earlier versions, your only choice is accessing the property directly,\
    \ such as onclick.\n- The click becomes onclick when using attachEvent().\n- If\
    \ you listen to events the old fashioned way (for example, by setting a value\
    \ to the onclick property), when the callback is invoked, it doesn't get an event\
    \ object passed as a parameter. However, regardless of how you attach the listener\
    \ in IE, there is always a global object window.event that points to the latest\
    \ event.\n- IE, the event object doesn't get a target attribute telling you the\
    \ element on which the event fired, but it does have an equivalent called srcElement.\n\
    - As mentioned earlier, event capturing doesn't apply to all elements, so only\
    \ bubbling should be used.\n- There's no stopPropagation() method, but you can\
    \ set the IE-only cancelBubble property to true.\n- There's no preventDefault()\
    \ method, but you can set the IE-only returnValue property to false.\n- To stop\
    \ listening to an event, instead of removeEventListener() in IE, you'll need detachEvent()."
  merge: -1
  pgno: 361
- img_proc: true
  md: "So, here's the revised version of the previous code that works across browsers:\n\
    \n```\nfunction callback(evt) {\n  // prep work\n  evt = evt || window.event;\n\
    \  var target = evt.target || evt.srcElement;\n\n  // actual callback work\n \
    \ console.log(target.nodeName);\n}\n\n// start listening for click events\nif\
    \ (document.addEventListener) { // Modern browsers\n  document.addEventListener('click',\
    \ callback, false);\n} else if (document.attachEvent) { // old IE\n  document.attachEvent('onclick',\
    \ callback);\n} else {\n  document.onclick = callback; // ancient\n}\n```\n\n\
    # Type of events\n\nNow you know how to handle cross-browser events. However,\
    \ all of the preceding examples used only click events. What other events are\
    \ happening out there? As you can probably guess, different browsers provide different\
    \ events. There is a subset of cross-browser events, and some browser-specific\
    \ ones. For a full list of events, you should consult the browser's documentation,\
    \ but here's a selection of cross-browser events:\n\n+   - Mouse events\n  - mouse,\
    \ mousedown, click (the sequence is mousedown-up-click), dblclick\n  - mouseover\
    \ (mouse is over an element), mouseout (mouse was over an element but left it),\
    \ mousemove\n\n+   - Keyboard events\n  - keydown, keypress,keyup (occur in this\
    \ sequence)"
  merge: -1
  pgno: 362
- img_proc: true
  md: "The Browser Environment\n\n+   - Loading/window events\n  - `load` (an image\
    \ or a page and all of its components are done loading), `unload` (user leaves\
    \ the page), `beforeunload` (the script can provide the user with an option to\
    \ stop the loading)\n  - `abort` (user stops loading the page or an image in IE),\
    \ `error` (a JavaScript error, also when an image cannot be loaded in IE)\n  -\
    \ `resize` (the browser window is resized), `scroll` (the page is scrolled), `contextmenu`\
    \ (the right-click menu appears)\n- Form events\n  - `focus` (enter a form field),\
    \ `blur` (leave the form field)\n  - `change` (leave a field after the value has\
    \ changed), `select` (select text in a text field)\n  - `reset` (wipe out all\
    \ user input), `submit` (send the form)\n\nAdditionally, modern browsers provide\
    \ drag events (`dragstart`, `dragend`, `drop`, and others) and touch devices provide\
    \ `touchstart`, `touchmove`, and `touchend`.\n\nThis concludes the discussion\
    \ of events. Refer to the exercise section at the end of this chapter for a little\
    \ challenge of creating your own event utility to handle cross-browser events.\n\
    \n# XMLHttpRequest\n\nXMLHttpRequest() is an object (a constructor function) that\
    \ allows you to send HTTP requests from JavaScript. Historically, XHR (XMLHttpRequest)\
    \ was introduced in IE and implemented as an ActiveX object. Starting with IE7,\
    \ it's a native browser object, the same way as in the other browsers. The common\
    \ implementation of this object gives birth to the so-called Ajax applications,\
    \ where it's no longer necessary to refresh the whole page every time you add\
    \ new content. With JavaScript, you can make an HTTP request to the server, get\
    \ the response, and update only a part of the page. This way, you can build much\
    \ more responsive and desktop-like web pages.\n\n[ 345 ]"
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Ajax stands for Asynchronous JavaScript and XML:


    +   - Asynchronous because, after sending an HTTP request, your code doesn''t
    need to wait for the response; however, it can do other stuff and be notified,
    through an event, when the response arrives.

    - JavaScript because it''s obvious that XHR objects are created with JavaScript.

    - XML became initially developers were making HTTP requests for XML documents
    and were using the data contained in them to update the page. This is no longer
    a common practice, though, as you can request data in plain text, or simply as
    HTML to be inserted into the page.


    There are two steps to using the XMLHttpRequest object, which are as follows:


    +   - Send the request: This includes creating an XMLHttpRequest object and attaching
    an event listener

    - Process the response: This happens when your event listener gets notified that
    the response has arrived, and your code gets busy doing something amazing with
    the response


    # Sending the request


    In order to create an object, you will simply use the following code (let''s deal
    with browser inconsistencies in just a bit):


    ```

    var xhr = new XMLHttpRequest();

    ```


    The next thing is to attach an event listener to the onreadystatechange event
    fired by the object:


    ```

    xhr.onreadystatechange = myCallback;

    ```


    Then, you will need to call the open() method, as follows:


    ```

    xhr.open(''GET'', ''somefile.txt'', true);

    ```'
  merge: -1
  pgno: 364
- img_proc: true
  md: "The first parameter specifies the type of HTTP request, such as GET, POST,\
    \ HEAD, and so on.\nGET and POST are the most common ones. Use GET when you don't\
    \ need to send much data\n the request and your request doesn't modify (write)\
    \ data on the server, otherwise, use\nPOST. The second parameter is the URL you\
    \ are requesting. In this example, it's the text file\nsomefile.txt located in\
    \ the same directory as the page. The last parameter is a Boolean\nspecifying\
    \ whether the request is asynchronous (true, always prefer this) or not (false,\n\
    blocks all the JavaScript execution and waits until the response arrives.\n\n\
    The last step is to fire off the request, which is done as follows:\n\n```\nxhr.send('');\n\
    ```\n\nThe send() method accepts any data you want to send with the request. For\
    \ GET requests,\nis an empty string because the data is in the URL. For POST request,\
    \ it''s a query string in\nthe key=value&key2=value form.\n\nAt this point, the\
    \ request is sent and your code and the user can move on to other tasks. The\n\
    callback function, myCallback, will be invoked when the response comes back from\
    \ the\nserver.\n\n# Processing the response\n\nA listener is attached to the readstate\
    \ event. So, what exactly is the ready state\n how does it change?\n\nThere is\
    \ a property of the XHR object called readyState. Every time it changes, the\n\
    readystatechange event fires. The possible values of the readyState property are\
    \ as\nfollows:\n\n+   - 0-uninitialized\n- 1-loading\n- 2-loaded\n- 3-interactive\n\
    - 4-complete"
  merge: -1
  pgno: 365
- img_proc: true
  md: "# The Browser Environment\n\nWhen ready gets the value of 4, it means the response\
    \ is back and ready to be processed. In myCallback, you make sure ready is 4,\
    \ the other thing to check is the status code of the HTTP request. You might have\
    \ requested a non-existing URL, for example, and got a 404 (File not found) status\
    \ code. The interesting code is the 200 (OK) code, so myCallback should check\
    \ for this value. The status code is available in the status property of the xhr\
    \ object.\n\nOnce xhr.readyState is 4 and xhr.status is 200, you can access the\
    \ contents of the requested URL using the xhr.responseText property. Let's see\
    \ how myCallback can be implemented to simply alert() of the contents of the requested\
    \ URL:\n\n```\nfunction myCallback() {\n  if (xhr.readyState < 4) {\n    return;\
    \ // not ready yet\n  }\n  if (xhr.status !== 200) {\n    alert('Error!'); //\
    \ the HTTP status code is not OK\n    return;\n  }\n```\n\n```\n// all is fine,\
    \ do the work\nalert(xhr.responseText);\n```\n\nOnce you've received the new content\
    \ you requested, you can add it to the page, use it for some calculations, or\
    \ for any other purpose you find suitable.\n\nOverall, this two-step process (send\
    \ request and process response) is the core of the whole XHR/Ajax functionality.\
    \ Now that you know the basics, you can move on to building the next Gmail. Oh\
    \ yes, let's take a look at minor browser inconsistencies.\n\n# Creating XMLHttpRequest\
    \ objects in IE prior to Version 7\n\nIn Internet Explorer, prior to version 7,\
    \ the XMLHttpRequest object was an ActiveX object, so creating an XHR instance\
    \ is a little different. It is as follows:\n\n```\nvar xhr = new XMLHttpRequest('MSXML2.XMLHTTP.3.0');\n\
    ```"
  merge: -1
  pgno: 366
- img_proc: true
  md: "# The Browser Environment\n\nMSXML2.XMLHttpRequest.3.0 is the identifier of\
    \ the object you want to create. There are several versions of the XMLHttpRequest\
    \ object, and if your page visitor doesn't have the latest one installed, you\
    \ can try two older ones before you give up.\n\nFor a fully-cross-browser solution,\
    \ you should first test to see if user's browser supports XMLHttpRequest as a\
    \ native object, and if not, try the IE way. Therefore, the code of creating an\
    \ XHR instance is like the following:\n\n```\nvar ids = ['MSXML2.XMLHttpRequest.3.0',\n\
    \           'MSXML2.XMLHttpRequest',\n           'Microsoft.XMLHttpRequest'];\n\
    var xhr;\nif (XMLHttpRequest) {\n  xhr = new XMLHttpRequest();\n} else {\n  //\
    \ IE: try to find an ActiveX object to use\n  for (var i = 0; i < ids.length;\
    \ i++) {\n    try {\n      xhr = new ActiveXObject(ids[i]);\n      break;\n  \
    \  } catch (e) {\n  }\n}\n```\n\nWhat is this doing? The ids array contains a\
    \ list of ActiveX program IDs to try. The xhr variable points to the new XHR object.\
    \ The code first checks to see if XMLHttpRequest exists. If so, this means that\
    \ the browser supports XMLHttpRequest() natively, so the browser is relatively\
    \ modern. If it is not, the code loops through ids trying to create an object.\
    \ The catch(e) block quietly ignores failures and the loop continues. As soon\
    \ as an xhr object is created, you break out of the loop.\n\nAs you can see, this\
    \ is a bit of code, so it's better to abstract it into a function. Actually, one\
    \ of the exercises at the end of the chapter prompts you to create your own Ajax\
    \ utility.\n\n# A is for Asynchronous\n\nNow you know how to create an XHR object,\
    \ give it a URL and handle the response to the request. What happens when you\
    \ send two requests asynchronously? What if the response to the second request\
    \ comes before the first?"
  merge: -1
  pgno: 367
- img_proc: true
  md: "# The Browser Environment\n\nIn the preceding example, the XHR object was global\
    \ and myCallback was relying on the presence of this global object in order to\
    \ access its readyState, status, and responseText properties. Another way, which\
    \ prevents you from relying on global variables, is to wrap the callback in a\
    \ closure. Let's see how:\n\n```\nvar xhr = new XMLHttpRequest();\n\nxr.readystatechange\
    \ = (function (myxhr) {\n  return function () {\n    myCallback(myxhr);\n  };\n\
    }(xhr));\n\nxr.open('GET', 'somefile.txt', true);\nxhr.send();\n```\n\nIn this\
    \ case, myCallback() receives the XHR object as a parameter and will not go looking\
    \ it in the global space. This means that at the time the response is received,\
    \ the original XHR might be reused for a second request. The closure keeps pointing\
    \ to the original object.\n\n# X is for XML\n\nAlthough these days JSON (discussed\
    \ in the next chapter) is preferred over XML as a data transfer format, XML is\
    \ still an option. In addition to the responseText property, the XHR objects also\
    \ have another property called responseXML. When you send an HTTP request for\
    \ an XML document, responseXML points to an XML DOM object. To work with this\
    \ document, you can use all of the core DOM methods discussed previously in this\
    \ chapter, such as getElementsByTagName(), getElementById(), and so on.\n\n# An\
    \ example\n\nLet's wrap up the different XHR topics with an example. You can visit\
    \ the page located at http://www.phpied.com/files/jsoop/xhr.html to work on the\
    \ example yourself."
  merge: -1
  pgno: 368
- img_proc: true
  md: "The main page, xhr.html, is a simple static page that contains nothing but\
    \ three <div> tags, which are as follows:\n\n```\n<div id=\"text\">Text will be\
    \ here </div>\n<div id=\"html\">HTML will be here </div>\n<div id=\"xml\">XML\
    \ will be here </div>\n```\n\nUsing the console, you can write code that requests\
    \ three files and loads their respective contents into each <div>.\n\nThe three\
    \ files to load are as follows:\n\n+   * content.txt: This is a simple text file\
    \ containing the text I am a text file\n* content.html: This is a file containing\
    \ HTML code I am <strong>formatted</strong>/<strong><em>HTML</em></strong>\n*\
    \ content.xml: This is an XML file containing the following code:\n\n```\n<?xml\
    \ version=\"1.0\" ?>\n<root>\n I'm XML data.\n</root>\n```\n\nAll of the files\
    \ are stored in the same directory as xhr.html.\n\n> For security reasons, you\
    \ can only use the original XMLHttpRequest to request files that are on the same\
    \ domain. However, modern browsers support XHR2, which lets you make cross-domain\
    \ requests, provided that the appropriate Access-Control-Allow-Origin header is\
