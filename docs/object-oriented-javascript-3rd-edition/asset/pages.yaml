  md: "# window.document property\n\nThe window.document property is a BOM object\
    \ that refers to the currently loaded document (page). Its methods and properties\
    \ fall into the DOM category of objects. Take a deep breath (may look first at\
    \ the BOM exercises at the end of the chapter) and let's dive into the DOM.\n\n\
    # DOM\n\nThe DOM represents an XML or an HTML document as a tree of nodes, Using\
    \ DOM methods and properties, you can access any element on the page, modify or\
    \ remove elements, or add new ones. The DOM is a language-independent API and\
    \ can be implemented not only in JavaScript, but also in any other language. For\
    \ example, you can generate pages on the server-side with PHP's DOM implementation\
    \ (http://php.net/dom).\n\nTake a look at this HTML page:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>My page</title>\n</head>\n<body>\n  <p class=\"opener\"\
    >first paragraph</p>\n  <p>em>second</em> paragraph</p>\n  <p id=\"closer\">final</p>\n\
    \  <!-- and that's about it ---\\>\n</body>\n</html>\n```"
  merge: -1
