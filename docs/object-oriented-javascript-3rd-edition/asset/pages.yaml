- img_proc: true
  md: 'Promises and Proxies


    The asynchronous model is simpler because you have only one thread. When you are
    executing one task, you are sure that only that task is being executed. This model
    doesn''t require complex mechanism for inter-thread coordination and, hence, is
    more predictable. There is one more difference between the threaded and the asynchronous
    models; in the threaded model, you don''t have a way to control the thread execution
    as the thread scheduling is mostly done by the operating system. However, in the
    asynchronous model, there is no such challenge.


    In which scenarios tasks can the asynchronous model outperform the synchronous
    model? If we are simply splitting tasks into smaller chunks, intuitively, even
    the smaller chunks will take quite an amount of time when you add them up in the
    end.


    There is a significant factor we have not yet considered. When you execute a task,
    you will end up waiting on something—a disk read, a database query, or a network
    call; these are blocking operations. When you enter a blocked mode, your task
    simply waits in the synchronous model. Take a look at the following figure:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_297_0.png)


    [ 279 ]'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'Promises and Proxies


    In the preceding diagram, the black blocks are where a task is waiting on something.
    What are the typical operations that can cause such a block? A task is performed
    in a CPU and RAM. A typical CPU and RAM can handle transfer orders of magnitude
    faster than a typical disc read or a network call.


    > Please refer to a comparison (https://gist.github.com/jboner/2841832) of latencies
    between CPU, internal memory, and discs.


    When your tasks wait on an I/O (Input/Output) from such sources, the latency is
    unpredictable. For a synchronous program that does a lot of I/O, this is a recipe
    for bad performance.


    The most important difference between the synchronous and asynchronous models
    is the way they handle blocking operations. In the asynchronous model, a program,
    when faced with a task that encounters a block, executes another task without
    waiting for the blocking operation to finish. In a program where there are potential
    blocks, an asynchronous program outperforms an equivalent synchronous program
    because less time is spent on waiting. A slightly inaccurate visualization of
    such a model would be seen in the following figure:


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_298_0.png)'
