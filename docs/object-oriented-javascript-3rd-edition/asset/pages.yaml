    \ when an error occurs somewhere in a long chain, and you don't know which link\
    \ is to blame because they are all on the same line.\n\n# JSON\n\nLet's wrap up\
    \ the coding patterns section of this chapter with a few words about JSON. JSON\
    \ is not technically a coding pattern, but you can say that using it is a good\
    \ pattern.\n\nJSON is a popular lightweight format to exchange data. It's often\
    \ preferred over XML when using XMLHttpRequest to retrieve data from the server.\
    \ There's nothing specifically interesting about JSON over the fact that it's\
    \ extremely convenient. The JSON format consists of data defined using object\
    \ and array literals. Here is an example of a JSON string your server can respond\
    \ with after an XHR request:\n\n```\n{\n  'name': 'Stoyan',\n  'family': 'Stefanov',\n\
    \  'books': ['OOJS', 'JSPatterns', 'JS4PHP']\n}\n```\n\nAn XML equivalent of this\
