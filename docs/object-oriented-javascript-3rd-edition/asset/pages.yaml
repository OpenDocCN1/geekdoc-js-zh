  md: "# An Object as a namespace\n\nLet's create a global object called MYAPP:\n\n\
    ```\n// global namespace\nvar MYAPP = MYAPP || {};\n```\n\nNow, instead of having\
    \ a global myevent utility (from the previous chapter), you can create it as an\
    \ event property of the MYAPP object, as follows:\n\n```\n// sub-object\nMYAPP.event\
