  md: "# Functions\n\nAnother keyword introduced in ES6 is const. A variable declared\
    \ with the const keyword creates a read-only reference to a value. This does not\
    \ mean that the value held by the reference is immutable. However, the variable\
    \ identifier cannot be reassigned. Constants are block-scoped like variables created\
    \ using the let keyword. Also, you have to assign a value to the variable while\
    \ declaring them.\n\nAlthough it sounds like it, const has nothing to do with\
    \ immutable values. Constants create immutable binding. This is an important distinction\
    \ and needs to be understood correctly. Let's consider the following example:\n\
    \n```\nconst car = {};ncar.tyres = 4;\n```\n\nThis is a valid code; here we are\
    \ assigning value {} to a constant car. Once assigned, this reference cannot be\
    \ changed. In ES6, you should do the following:\n\n+   - Use const where possible.\
    \ Use them for all variables whose values don't change:\n  - Use let\n  - Avoid\
    \ var.\n\n# Functions are data\n\nFunctions in JavaScript are actually data. This\
    \ is an important concept that we'll need later on. This means that you can create\
    \ a function and assign it to a variable, as follows:\n\n```\nvar f = function\
    \ () {\nreturn 1;\n};\n```\n\nThis way of defining a function is sometimes referred\
