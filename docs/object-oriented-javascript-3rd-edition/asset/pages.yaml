  md: '# # 13

    Reactive Programming and React


    Along with ES6, several new ideas are emerging. These are powerful ideas and can
    help you build powerful systems with more streamlined code and design. We will
    introduce you to two such ideas–reactive programming and react. Although they
    sound similar, they are very different. This chapter does not go into practical
    details of these ideas but gives you necessary information to become aware of
    what these ideas are capable of. With that information, you can start incorporating
    these ideas and frameworks into your projects. We will discuss the basic idea
    of reactive programming and take a bit more detailed look at react.


    # ## Reactive programming


    Reactive programming is getting a lot of focus lately. This idea is relatively
    new and, like many new ideas, has lots of confusing, and sometimes contradictory
    information floating around. We discussed asynchronous programming earlier in
    this book. JavaScript takes asynchronous programming to new heights by providing
    first class language constructs that support it.'
  merge: -1
