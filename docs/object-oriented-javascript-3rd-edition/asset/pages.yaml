  md: '# debugging


    If you are not a completely new programmer, I am sure you have spent some amount
    of time debugging your or someone else''s code. Debugging is almost like an art
    form. Every language has different methods and challenges around the debugging.
    JavaScript is traditionally a difficult language to debug, I have spent days and
    nights in misery, trying to debug written JavaScript code using alert() functions.
    Fortunately, modern browsers, such as Mozilla, Firefox, and Google Chrome, have
    excellent Developer Tools to help debug JavaScript. There are IDEs like IntelliJ
    IDEA and WebStorm with great debugging support for JavaScript and Node.js. In
    this chapter, we will focus primarily on Google Chrome''s built-in developer tools.
    Firefox also supports Debug extension and has excellent built-in developer tools,
    but they behave more or less the same as Google Chrome''s Developer Tools, so
    we will discuss common debugging approaches that work in these of those.


    Before we talk about the specific debugging techniques, let''s understand the
    type of errors we would be interested in while we try to debug our code.


    # Syntax errors


    When your code something that does not conform to the JavaScript language grammar,
    the interpreter rejects piece of code. These are easy to catch if your IDE is
    helping you with syntax checking. Most modern IDEs help with these errors. Earlier,
    we discussed the usefulness of tools, such as JLint and JSHint, around catching
    syntax issues with your code. They analyze the code and flag errors in the syntax.
    The Syntax output can be very illuminating. For example, the following shows up
    so many things we can change in the code. The code snippet is one of my projects:


    ```

    temp git:(dev-branch) x eslint test.js

    test.js: line 1, col 1, Use the function form of "use strict"

    test.js: line 4, col 1, ''destructuring expression''

    is is available in ES6 (use next option) or

