  md: '# Object-Oriented JavaScript


    # Strict mode in ES6


    While strict mode is optional in ES5, all ES6 modules and classes are strict by
    default. As you will see soon, most of the code we write in ES6 resides in a module;
    hence, strict mode is enforced by default. However, it is important to understand
    that all constructs do not have implicit strict mode enforced. There were efforts
    to make newer constructs, such as arrow and generator functions, to also enforce
    strict mode, but it was later decided that doing so would result in fragmented
    language rules and code.


    # ECMAScript 6


    ECMAScript 6 revision took a long time to finish and was finally accepted on June
    17, 2015. ES6 features are slowly becoming part of major browsers and server technologies.
    It is possible to use transpilers to compile ES6 to ES5 and use the code on environments
    that do not yet support ES6 completely (we will discuss transpilers in detail
    later).


    ES6 substantially upgrades JavaScript as a language and brings in very exciting
    syntactical changes and language constructs. Broadly, there are two kinds of fundamental
    changes in this revision of ECMAScript, which are as follows:


    +   - Improved syntax for existing features and editions to the standard library;
    for example, classes and promises

    - New language features; for example, generators


    ES6 allows you to think differently about your code. New syntax changes can let
    you write code that is cleaner, easier to maintain, and does not require special
    tricks. The language itself supports several constructs that required third-party
    modules earlier. Language changes introduced in ES6 need a rethink in the way
    we have been coding in JavaScript.


    A note on the nomenclature–ECMAScript 6, ES6, and ECMAScript 2015 are the same,
    but used interchangeably.'
