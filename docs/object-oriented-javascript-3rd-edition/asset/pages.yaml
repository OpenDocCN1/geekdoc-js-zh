  md: "Using arguments, you can improve the sum() function to accept any number of\
    \ arguments and add them all up, as shown in the following example:\n\n```\nfunction\
    \ sumOnSteroids() {\n  var i,\n  res = 0,\n  number_of_params = arguments.length;\n\
    \  for (i = 0; i < number_of_params; i++) {\n    res += arguments[i];\n  }\n \
    \ return res;\n}\n```\n\nIf you test this function by calling it with a different\
    \ number of arguments, or even none at all, you can verify that it works as expected,\
    \ as you can see in the following example:\n\n+   > sumOnSteroids(1, 1, 1);\n\
    > sumOnSteroids(1, 2, 3, 4);\n> sumOnSteroids(1, 2, 3, 4, 3, 2, 1);\n> sumOnSteroids(5);\n\
    > sumOnSteroids();\n\nThe arguments.length expression returns the number of arguments\
    \ passed when the function was called. Don't worry if the syntax is unfamiliar,\
    \ we'll examine it in detail in the next chapter. You also see that arguments\
    \ is not an array (although it sure looks like one), but an array-object.\n\n\
    ES6 introduces several important improvements around function parameters. ES6\
