  md: '# Primitive ways to access the document


    to the elements of an HTML document. This was done mainly through a number of
    collections, which are as follows:

    Unlike the DOM, which gives you access to any element, and even comments and whitespace,
    initially, JavaScript had only limited access to the elements of an HTML document.
    This was done mainly through a number of collections, which are as follows:


    +   - document.images: This is a collection of all the images on the page. The
    Core DOM element is document.getElementsByTagName(''img'').

    - document.applets: This is the same as document.getElementsByTagName(''applet'').

    - document.links: The document.links collection contains a list of <a href="...\</a>
    tags on the page, meaning the <a> has an href attribute.

    - document.anchors: The document.anchors collection contains all links with a
    name attribute (<a name="...">)

    - document.forms: One of the most used collections is document.forms, which contains
    a list of <form> elements.


    Let''s say with a page that contains a form and an input (http://www.phpied.com/files/jsop/ch7-form.html).
    The following line of code gives you access to the first form on the page:


    ```

    document.forms[0];

    ```


    It''s the same as the following line of code:


    ```

    document.getElementsByTagName(''forms'') [0];

    ```


    The document.forms contains collections of input fields and buttons, accessible
    through the elements property. Here''s how to access the first input of the first
    form on the page:


    ```

    document.forms[0].elements[0];

    ```


    Once you have access to an element, you can access its attributes as object properties.
    The first field of the first form in the test page is as follows:


    ```

    <input name="search" id="search" type="text" size="50" maxlength="255" value="Enter
    email..." />

    ```'
