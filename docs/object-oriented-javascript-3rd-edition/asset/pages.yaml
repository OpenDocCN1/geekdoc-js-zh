  md: '# Primitive Data Types, Arrays, Loops, and Conditions


    In other words, the step-by-step procedure to execute a switch statement is as
    follows:


    +   - Evaluate the switch expression in parentheses; remember it.

    - Move to the first case and compare its value with the one from Step 1.

    - If the comparison in Step 2 returns true, execute the code in the case block.

    - After the case block is executed, if there''s a break statement at the end of
    it, exit switch.

    - If there''s no break or Step 2 returned false, move on to the next case block.

    - Repeat steps 2 to 5.

    - If you are still here (no exit in Step 4), execute the code following the default
    statement.


    Indent the code that follows the lines. You can also indent case from the switch,
    but that doesn''t give you much in terms of readability.


    ![](img/717ca68bb945a398c8e0c562c6cc94d7_83_0.png)


    # Don''t forget to break


    Sometimes, you may want to omit the break intentionally, but that''s rare. It''s
    called fallthrough and should always be documented because it might look like
    an accidental omission. On the other hand, sometimes you may want to omit the
    whole code block following a case and have two cases sharing the same code. This
    is fine, but it doesn''t change the rule that if there''s code that follows a
    case statement, this code should end with a break. In terms of indentation, aligning
    the line with the case or with the code inside the case is a personal preference;
    again, being consistent with what matters.


    Use the default case. This helps you make sure that you always have a meaningful
    result after the switch statement, even if none of the cases matches the value
    being switched.


    # Loops


    The if...else and switch statements allow your code to take different paths, if
    you''re at a crossroads, and decide which way to go depending on a condition.
    Loops, on the other hand, allow your code to take a few roundabouts merging back
    into the main road. How many repetitions? That depends on the result of evaluating
    a condition before (or after) each iteration.'
