  md: '# Case study – drawing shapes


    Let''s finish off this chapter with a more practical example of inheritance. The
    task is to be able to calculate the area and the perimeter of different shapes,
    as well as to draw them, while reusing as much code as possible.


    # Analysis


    Let''s have one Shape constructor that contains all the common parts. From there,
    let''s have Triangle, Rectangle, and Square constructors, all inheriting from
    Shape. A square is really a rectangle with the same lengths, so let''s reuse Rectangle
    when building Square.


    In order to define a shape, you''ll need points with x y coordinates. A generic
    shape can have any number of points. A triangle is defined with three points,
    a rectangle (to keep simpler) with one point and the lengths of the sides. The
    perimeter of any shape is the sum of its side''s lengths. Calculating the area
    is shape specific and will be implemented by each shape.


    The common functionality in Shape would be:


    +   * A draw() method that can draw any shape given the points

    * A getParameter() method

    * A property that contains an array of points

    * Other methods and properties as needed


    For the drawing part, let''s use a <canvas> tag. It''s not supported in early
    IEs, but hey, this is just an exercise.


    Let''s have two other helper constructors–Point and Line. Point will help when
    defining shapes. Line will make calculations easier, as it can give the length
    of the line connecting any two points.


    You can play with a working example at http://www.phpied.com/files/canvas/. Just
    open your console and start creating new shapes as you''ll see in a moment.'
