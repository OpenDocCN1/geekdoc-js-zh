    # Deleting elements


    To delete an element, you can use the delete operator. However, after the deletion,
    the length of the array does not change. In a sense, you may get a hole in the
    array:


    ```

    > var a = [1, 2, 3];

    > delete a[1];

    true

    > a;

    [1, undefined, 3]

    > typeof a[1];

    "undefined"

    ```


    # Arrays of arrays


    Arrays can contain all types of values, including other arrays:


    ```

    > var a = [1, "two", false, null, undefined];

