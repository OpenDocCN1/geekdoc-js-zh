- img_proc: true
  md: "The difference between the class component and stateless function component\
    \ is that the class component can contain a state while the stateless (hence the\
    \ name) function cannot.\n\nThe render method of the react component is allowed\
    \ to return only a single node. If you do something like the following:\n\n```\n\
    return <h1>Hello World</h1><p>React Rocks</p>\n```\n\nYou will get the following\
    \ error:\n\n```\nError in .src/App.js\nSyntax error: Adjacent JSX elements must\
    \ be wrapped in\nan enclosing tag (4:31)\n```\n\nThis is because you are essentially\
    \ returning two React.createElement functions, that is not valid JavaScript. While\
    \ this may seem like a deal breaker, this is easy to solve. We can wrap our nodes\
    \ into a parent node and return that parent node from the render function. We\
    \ can create a parent div and wrap other nodes under it. Consider the following\
    \ example:\n\n```\nrender(){\n  return (\n    <div>\n      <h1>Hello World</h1>\n\
    \      <p>React Rocks</p>\n    </div>\n  )\n}\n```\n\n# Components and props\n\
    \nComponents can be conceptually considered as JavaScript functions. They take\
    \ arbitrary number of inputs like normal functions. These inputs are called props.\
    \ To illustrate this, let's consider the following function:\n\n```\nfunction\
