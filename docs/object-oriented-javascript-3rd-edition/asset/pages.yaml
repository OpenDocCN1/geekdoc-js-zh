  md: "# Private properties and methods\n\nJavaScript doesn't have the notion of access\
    \ modifiers, which set the privileges of the properties in an object. Other languages\
    \ often have access modifiers, as follows:\n\n+   * **Public**: All users of an\
    \ object can access these properties or methods\n* **Private**: Only the object\
    \ itself can access these properties\n* **Protected**: Only objects inheriting\
    \ the object in question can access these properties\n\nJavaScript doesn't have\
    \ a special syntax to denote private properties or methods, but as discussed in\
    \ Chapter 3, Functions, you can use local variables and methods inside a function\
    \ and achieve the same level of protection.\n\nContinuing with the example of\
    \ the FancyButton constructor, you can have local variable styles that contains\
    \ all the defaults, and a local setStyle() function. These are invisible to the\
    \ code outside of the constructor. Here's how FancyButton can make use of the\
    \ private properties:\n\n```\nvar MYAPP = {};\nMYAPP.dom = {};\nMYAPP.dom.FancyButton\
    \ = function (text, conf) {\n  var styles = {\n    font: 'Verdana',\n    border:\
    \ '1px solid black',\n    color: 'black',\n    background: 'grey'\n  };\n  function\
    \ setStyles(b) {\n    var i;\n    for (i in styles) {\n      if (styles.hasOwnProperty(i))\
    \ {\n        b.style[i] = conf[i] || styles[i];\n      }\n    }\n  }\n  conf =\
    \ conf || {};\n  var b = document.createElement('input');\n  b.type = conf.type\
    \ || 'submit';\n  b.value = text;\n  setStyles(b);\n  return b;\n};\n```"
  merge: -1
