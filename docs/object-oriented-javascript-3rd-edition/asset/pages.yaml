  md: '# # D Regular Expressions


    When you use regular expressions (discussed in Chapter 4, Objects), you can match
    literal strings, for example:


    ```

    > "some text".match(/me/);

    "me"

    ```


    However, the true power of regular expressions comes from matching patterns, not
    literal strings. The following table describes the different syntax you can use
    in your patterns, and provides some examples of their use:


    | Pattern | Description |

    | [abc] | Matches a class of characters:

    > "some text".match(/[otx]/g);

    "o", "c", "x", "t" |

    | [a-z] | A class of characters defined as a range. For example, [a-d] is the
    same as [abcd], [a-z] matches all lowercase characters, [a-zA-Z0-9] matches all
    characters, and the underscore character:

    > "Some Text".match(/[a-z]/g);

    "o", "m", "e", "e", "x", "t"

    > "Some Text".match(/[a-zA-Z]/g);

    "S", "o", "m", "e", "T", "e", "t" |

    | [^abc] | Matches everything that is not matched by the class of characters:

    > "Some Text".match(/[^a-z]/g);

    "S", "", "t" |'
