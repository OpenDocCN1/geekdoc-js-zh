  md: 'What happens then? N is in the same global space as a. And, as functions remember
    the environment in which they were defined, N will still have access to the F
    space, and hence, can access b. This is interesting, because N is where a and
    yet N does not have access to b, but a doesn''t.


    Additionally, how does N break the chain? By making itself global (omitting var)
    or by having F deliver (or return) it to the global space. Let''s see how this
    is done in practice.


    # Closure #1


    Take a look at following function, which is the same as before, only F returns
    N and also N returns b, to which it has access via the scope chain:


    ```

    var a = "global variable";nvar F = function () {

    var b = "local variable";nvar N = function () {

    var c = "inner local";nreturn b;

    return N;

    };

    ```


    The F contains the b variable, which is local, and therefore inaccessible from
    the global space:


    +   > b;

    ReferenceError: b is not defined


    The N function has access to its private space, to the F () function''s space,
    and to the global space. So, it can see b. As F () is call from the global space
    (it''s a global function), you can call it and assign the returned value to another
    global variable. The result – a new function that has access to the F () function''s
    private space:


    +   > var inner = F();

    > inner();

    >"local variable"'
