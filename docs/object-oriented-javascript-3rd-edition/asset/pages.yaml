- img_proc: true
  md: 'From the parent page, you can access properties of the child frame as well.
    For example,

    you can reload the frame as follows:


    ```

    frames[0].window.location.reload();

    ```


    From inside the child, you can access the parent as follows:


    ```

    frames[0].parent === window;

    true

    ```


    Using a property called top, you can access the top-most-page-the one that contains
    all the

    other-frames from any frame, as follows:


    ```

    window.frames[0].window.top === window;

    true

    window.frames[0].window.top === window.top;

    true

    window.frames[0].window.top === top;

    true

    ```


    In addition, self is the same as window, as you can see in the following code
    snippet:


    ```

    self === window;

    true

    frames[0].self === frames[0].window;

    true

    ```


    If a frame has a name attribute, you cannot only access the frame by name, but
    also by

    index, as shown in the following piece of code:


    ```

    window.frames[''myframe''] === window.frames[0];ntrue

    ```


    Or, alternatively, you can use the following code:


    ```

    frames.myframe === window.frames[0];ntrue

    ```'
