    \ The opposite, your global variable overwriting someone else's is also possible.\n\
    \n# Property of the constructor\n\nAs you know, functions are objects and they\
    \ have properties. You can assign the single instance to a property of the constructor\
    \ function, as follows:\n\n```\nfunction Logger() {\nif (!Logger.single_instance)\
    \ {\n  Logger.single_instance = this;\n}\nreturn Logger.single_instance;\n}\n\
    ```\n\nIf you write a = new Logger(), a points to the newly created Logger.single_instance\
    \ property. A subsequent var b = new Logger() call results in b pointing to the\
    \ same Logger.single_instance property, which is exactly what you want.\n\nThis\
    \ approach entirely solves the global namespace issue because no global variables\
    \ are created. The only drawback is that the property of the Logger constructor\
    \ is publicly visible, so it can be overwritten at any time. In such cases, the\
    \ single instance can be lost or modified. Of course, you can only provide so\
    \ much protection against fellow programmers shooting themselves in the foot.\
    \ After all, if someone can mess with the single-instance property, they can mess\
    \ up the Logger constructor directly as well.\n\n[ 379 ]"
