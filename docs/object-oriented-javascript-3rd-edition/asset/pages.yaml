  md: '# Creating new nodes


    To create new nodes, you can use the `createElement()` and `createTextNodeNode()`
    methods. Once you have the new nodes, you can add them to the DOM tree using `appendChild()`,
    `insertBefore()`, or `replaceChild()`.


    Reload `http://www.phpied.com/files/jsoop/ch7.html` and let''s play.


    Create a new `p` element and set its `innerHTML`, as shown in the following code:


    ```

    > var myp = document.createElement(''p'');

    > myp.innerHTML = ''yet another'';

    > "yet another"

    ```


    The new element automatically gets all the default properties, such as `style`,
    which you can modify as follows:


    +   > myp.style;

    > CSSDeclaration

    > myp.style.border = ''2px dotted blue'';

    > "2px dotted blue"


    Using `appendChild()`, you can add the new node to the DOM tree. Calling this
    method on the `document.body` node means creating one child node right after the
    last child, as follows:


    +   > document.body.appendChild(myp);

    > <p style="border: 2px dotted blue;">yet another</p>


    Here''s an illustration of how the page looks after the new node is appended:


    | first paragraph |

    | second paragraph |

    | final |

    | yet another |'
