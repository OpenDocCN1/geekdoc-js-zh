    # Numbers


    The simplest number is an integer. If you assign 1 to a variable, and then use
    the typeof operator, it returns the string number, as follows:


    ```

    > var n = 1;

    > typeof n;

    "number"

    > n = 1234;

    > typeof n;

    "number"

    ```


    In the preceding example, you can see that the second time you set a variable''s
    value, you don''t need the var statement.


    Numbers can also be floating point (decimals), for example:


    ```

    > var n2 = 1.23;

    > typeof n;

    "number"

    ```


    You can call typeof directly on the value without assigning it to a variable first,
    for example:


    ```

    > typeof 123;

    "number"

    ```


    # Octal and hexadecimal numbers


    When a number starts with a 0, it''s considered an octal number. For example,
    the octal 0377 is the decimal 255:


    ```

    > var n3 = 0377;

    > typeof n3;

    "number"

    > n3;

    255

    ```


    The last line in the preceding example prints the decimal representation of the
    octal value.'
