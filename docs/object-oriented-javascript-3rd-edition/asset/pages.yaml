    }\n```\n\nUsing this constructor gives the expected result, which is as follows:\n\
    \n```\nvar a = new Logger();\nvar b = new Logger();\nconsole.log(a === b); //\
    \ true\n```\n\nThe drawback is, obviously, the use of a global variable. It can\
