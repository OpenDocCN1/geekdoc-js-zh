  md: '# Coding and Design Patterns


    First, you can see how JSON is lighter in terms of the number of bytes. However,
    the main benefit is not the smaller byte size, but the fact that it''s trivial
    to work with JSON in JavaScript. Let''s say, you''ve made an XHR request and have
    received a JSON string in the responseText of the XHR object. You can convert
    this string of data into a working JavaScript object simply using eval(). Consider
    the following:


    ```

    // counter-example

    var response = eval('' + xhr.responseText + '')'';

    ```


    Now, you can access the data in obj as object properties as follows:


    ```

    console.log(response.name); // "Stoyan"

    console.log(response.books[2]); // "JS4PHP";

    ```


    The problem is that eval() is insecure, so it''s best you use the JSON object
    to parse the JSON data (a fallback for older browsers is available at http://json.org/).
    Creating an object from a JSON string is still trivial as follows:


    ```

    var response = JSON.parse(xhr.responseText);

    ```


    To do the opposite, is, to convert an object to a JSON string, you can use the
    stringify() method, as follows:


    ```

    var str = JSON.stringify({hello: "you"});

    ```


    Due to its simplicity, JSON has quickly become popular as a language-independent
    format to exchange data, and you can easily produce JSON on the server side using
    your preferred language. In PHP, for example, there are the json_encode() and
    json_decode() functions that let you serialize a PHP array or object into a JSON
    string, and vice versa.


