  md: "# Objects\n\n# The arguments object revisited\n\nIn the previous chapter, you\
    \ have seen how, from inside a function, you have access to something called arguments,\
    \ which contains the values of all the parameters passed to the function:\n\n\
    ```\n> function f() {\n  return arguments;\n}\n> f(1, 2, 3);\n```\n\nThe arguments\
    \ looks like an array, but it is actually an array-like object. It resembles an\
    \ array because it contains indexed elements and a length property. However, the\
    \ similarity ends there, as arguments doesn't provide any of the array methods,\
    \ such as sort() or slice().\n\nHowever, you can convert arguments to an array\
    \ and benefit from all the array goodies. Here's what you can do, practicing your\
    \ newly-learned call() method:\n\n```\n> function f() {\n  var args = [].slice.call(arguments);\n\
    \  return args.reverse();\n}\n> f(1, 2, 3, 4);\n> [4, 3, 2, 1];\n```\n\nAs you\
    \ can see, you can borrow slice() using [].slice or the verbose Array.prototype.slice.\n\
    \n# Lexical this in arrow functions\n\nWe discussed ES6 arrow functions and the\
    \ syntax in detail in the last chapter. However, an important aspect of arrow\
    \ functions is that they behave differently from normal functions. The difference\
    \ is subtle but important. Arrow functions do not have their own value of this.\
    \ The value of this in an arrow function is inherited from the enclosing (lexical)\
    \ scope.\n\nFunctions have a special variable this that refers to the object via\
    \ which the method was invoked. The value of this is dynamically given by the\
    \ function invocation, it is sometimes called dynamic. A function is executed\
    \ in two scopes—lexical and dynamic. A lexical scope is a scope that surrounds\
    \ the function scope, and the dynamic scope is the scope that calls the function\
    \ (usually an object)"
