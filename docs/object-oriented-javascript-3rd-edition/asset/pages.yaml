- img_proc: true
  md: "# Testing and Debugging\n\nIn this example, the var a = doesnotext line tries\
    \ to assign an undefined variable, doesnotexist, to another variable. This causes\
    \ a runtime exception. When we wrap this problematic code into try{}catch{} block\
    \ or when the exception occurs (or is thrown), the execution stops in the try()\
    \ block and goes directly to the catch() handler. The catch handler is responsible\
    \ for handling the exceptional scenario. In this case, we are displaying the error\
    \ message on the console for debugging purposes. You can explicitly throw an exception\
    \ to trigger an unhandled scenario in the code. Consider the following example:\n\
    \n```\nfunction engageGear(gear) {\n  if(gear==\"R\") { console.log(\"Reversing\"\
    );}\n  if(gear==\"D\") { console.log(\"Driving\");}\n  if(gear==\"N\") { console.log(\"\
    Neutral/Parking\");}\n  throw new Error(\"Invalid Gear State\");\n}\ntry {\n \
    \ engageGear(\"R\"); //Reversing\n  engageGear(\"P\"); //Invalid Gear State\n\
    } catch (e) {\n  console.log(e.message);\n}\n```\n\nIn this example, we are handling\
    \ valid states of a gear shift: R, N, and D; however, when we receive an invalid\
    \ state, we are explicitly throwing an exception clearly stating the reason. When\
    \ we call the function which we think may throw an exception, we will wrap the\
    \ code in the try{} block and attach a catch() handler with it. When the exception\
    \ is caught by the catch() block, we will handle the exceptional condition appropriately.\n\
    \n# Console.log and asserts\n\nDisplaying the state of execution on console can\
    \ be very useful while debugging. Although, modern developer tools allow you to\
    \ put breakpoints and halt execution to inspect a particular value during runtime.\
    \ You can quickly detect small issues by logging some variable state on the console.\n\
    \nWith these concepts with us, let's see how we can use Chrome Developer Tools\
    \ to debug JavaScript code."
