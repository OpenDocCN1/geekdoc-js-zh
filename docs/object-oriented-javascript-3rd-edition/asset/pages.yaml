  md: "In the inheritance pattern from the chapter and the previous exercise, all\
    \ children were sharing the same prototype, for example:\n\n```\nvar s = new Shape();\n\
    Kite.prototype = s;\nRhombus.prototype = s;\n```\n\nWhile this is convenient,\
    \ it also means no one can touch the prototype because it will affect everyone's\
    \ prototype. The drawback is that all custom methods need to own properties, for\
    \ example this.getArea.\n\nIt's a good idea to have methods shared among instances\
    \ and defined in the prototype, instead of recreating them for every object. The\
    \ following example moves the custom getArea() methods to the prototype.\n\nIn\
    \ the inheritance function, you'll see the children only inherit the parent's\
    \ prototype. So own properties as this.lines will not be set. Therefore, you need\
    \ to have each child constructor call uber to get the own properties, example:\n\
    \n```\nChild.prototype.uber.call(this, args...)\n```\n\nAnother nice-to-have feature\
    \ is carrying over the prototype properties already added to the child. This allows\
    \ the child to inherit first and add more customizations or the other way around\
    \ as well, which is just a little more convenient.\n\n```\nfunction inherit(Child,\
    \ Parent) {\n  // remember prototype\n  var extensions = Child.prototype;\n\n\
    \  // inheritance with an intermediate F()\n  var F = function () {};n  F.prototype\
    \ = Parent.prototype;\n  Child.prototype = new F();\n  // reset constructor\n\
    \  Child.prototype.constructor = Child;\n  // remember parent\n  Child.prototype.uber\
    \ = Parent;\n\n  // keep track of who inherits the Parent\n  if (!Parent.children)\
    \ {\n    Parent.children = [];\n  }\n  Parent.children.push(Child);\n```\n\n[\
    \ 500 ]"
