  md: "# Functions\n\nThe scope between an opening brace '{' and a closing brace '}'\
    \ is a block. If you are coming from a background in Java or C/C++, the concept\
    \ of a block scope will be very familiar to you. In those languages, programmers\
    \ introduced blocks just to define a scope. In JavaScript, there was a need to\
    \ idiomatically introduce blocks as they didn't have a scope associated to it.\
    \ However, ES6 allows you to use the let keyword. As you can see in the preceding\
    \ example, a variable created inside the block is available within the block.\
    \ While declaring block-scoped variables, it is generally recommended to add the\
    \ let declaration at the top of the block. Let's look at another example to clearly\
    \ distinguish function and block:\n\n```\nfunction swap(a,b){ //--function scope\
    \ starts here\n  if(a>0 && b<0) { <--block scope starts here\n    let tmp=a;\n\
    \    a=b;\n    b=tmp;\n  } <--block scope ends here\n  console.log(a,b);\n  console.log(tmp);\
    \ // tmp is not defined as it is available\n  only in the block scope\n  return\
    \ [a,b];\n}\nswap(1,2);\n```\n\nAs you can see, tmp is declared with let and is\
    \ available only in the block in which it was defined. For all practical purposes,\
    \ you should maximize your use of block-scoped variables. Unless there is something\
    \ very specific you are trying to do that makes it necessary for you to use var\
    \ declarations, make sure you prefer block scoped variables. However, incorrectly\
    \ using the let keyword can cause a couple of problems. First, you cannot redeclare\
    \ the same variable within the same function or block scope using the let keyword:\n\
    \n```\nfunction blocker(x){\n  if(x) {\n    let f;\n    let f; //duplicate declaration\
    \ \"f\"\n  }\n}\n```\n\nIn ES6, variables declared by the let keyword are hoisted\
    \ to block scope. However, referencing the variable before its declaration is\
    \ an error."
