  md: '# Passing a string when a RegExp is expected


    One last thing to note is that the four methods that you have just seen (split(),
    match(), search(), and replace()) can also take strings as opposed to regular
    expressions. In this case, the string argument is used to produce a new regex
    if it was passed to new RegExp().


    An example of passing a string to replace is shown as follows:


    +   > "test".replace(''t'', ''r'')

    > "rest"


    The preceding lines of code are the same as the following one:


    +   > "test".replace(new RegExp(''t''), ''r'')

    > "rest"


    When you pass a string, you cannot set the modifiers as you do with a normal or
    regex literal. There''s a common source of errors when using a string instead
    of a regular expression for string replacements, and it''s due to the fact that
    the g modifier is false by default. The outcome is that only the first string
    is replaced, which is inconsistent with most other languages and a little confusing.
    Here is an example:


    +   > "pool".replace(''o'', ''*'')

    > "p*"


    Most likely, you want to replace all occurrences:


    +   > "pool".replace(/o/g, ''*'')

    > "p*ol"


    # Error objects


    Errors happen, and it''s good to have the mechanisms in place so that your code
    can realize that there has been an error condition and can recover from it in
    a graceful manner. JavaScript provides the try, catch, and finally statements
    to help you deal with errors. If an error occurs, an error object is created using
    one of these built-in constructors–EvalError, RangeError, ReferenceError, SyntaxError,
    TypeError, and URIError. All inherit from Error.'
