  md: "# Classes and Modules\n\nYou can also import everything that was exported from\
    \ the module:\n\n```\nimport * from 'server'\n```\n\nIf you have only one thing\
    \ to export, you can use the default export syntax. Consider the following piece\
    \ of code as an example:\n\n```\n//---server.js-\nexport default class {\n  //...\n\
    }\n//---app.js-\nimport Server from 'server';\nconst s = new Server();\n```\n\n\
    In this example, we will keep the class anonymous as we can use the module name\
    \ itself as the reference outside.\n\nBefore ES6 modules, external libraries supported\
    \ several approaches to modules. They established fairly good guidelines/styles\
    \ for ES6 to follow. The following style is followed by ES6:\n\n+   - Modules\
    \ are singletons. A module is imported only once, even if you try to import it\
    \ several times in your code.\n- Variable, functions, and other type of declarations\
    \ are local to the module. Only declarations marked with `export` are available\
    \ outside the module. Only `import` is used to access exported declarations.\n\
    - Modules can import from other modules. The following are the three options for\
    \ referring to other modules:\n    - You can use relative paths (`\"../lib/server/\"\
    );; these paths are resolved relatively to the file importing the module. For\
    \ example, if you are importing the module from `<project_path>/src/app.js`, and\
    \ the module file is located at `<project_path>/lib/server.js`, you will need\
    \ to provide a path relative to the `app.js - -../lib/server` in this case.\n\
    \    - Absolute paths can also point to the module file directly.\n- You can drop\
    \ the `.js` extension while importing the module.\n\n[ 273 ]"
