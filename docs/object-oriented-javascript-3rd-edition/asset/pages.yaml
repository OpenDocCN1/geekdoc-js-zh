    \ values and split it:\n\n```\n> var csv = 'one,two,three,four';\n> csv.split(',');\n\
    [\"one\", \"two\", \"three\", \"four\"]\n```\n\nBecause the input string has random\
    \ inconsistent spaces before and after the commas, the array result has spaces\
    \ too. With a regular expression, you can fix this with `\\s*`,\n\n```\n> csv.split(/\\\
    s*,\\s*/);\n[\"one\", \"two\", \"three\", \"four\"]\n```"
