  md: "# Functions\n\nLet's run the function, assigning the result to the arr array:\n\
    \n```\nvar arr = F();\n```\n\nNow you have an array of three functions. Let's\
    \ invoke them by adding parentheses after each array element. The expected behavior\
    \ is to see the loop sequence printed out as 0, 1, and 2. Let's try:\n\n```\n\
    arr[0]();\n3\narr[1]();\n3\narr[2]();\n3\n```\n\nHmm, quite as expected. What\
    \ happened here? All three functions point to the same local variable: i. Why\
    \ The functions don't remember values, they only keep a link (reference) to the\
    \ environment where they were created. In this case, the i variable happens to\
    \ live in the environment where the three functions were defined. So, all functions,\
    \ when they need to access the value, reach back to the environment and find the\
    \ most current value of i. After the loop, the i variable's value is 3. So, all\
    \ three functions point to the same value.\n\nWhy three and not two is another\
    \ good question to think about for better understanding the loop.\n\nSo, how do\
    \ you implement the correct behavior? The answer is to use another closure, as\
    \ shown in the following piece of code:\n\n```\nfunction F() {\n  var arr = [],\
    \ i;\n  for (i = 0; i < 3; i++) {\n    arr[i] = (function (x) {\n      return\
    \ function () {\n        return x;\n      }\n    })(i);\n  }\n  return arr;\n\
    }\n```\n\n[ 108 ]"
