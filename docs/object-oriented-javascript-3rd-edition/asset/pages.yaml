    \ strict\n\nWe briefly discussed the strict mode in earlier chapters. When you\
    \ use strict mode, JavaScript stops accepting syntactical errors in your code.\
    \ Rather than silently failing strict mode makes these failure errors instead.\
    \ It also helps you convert mistakes into actual errors. There are two ways of\
    \ enforcing strict mode. If you want the strict mode for the entire script, you\
    \ can just add the strict statement (with the quotes) as the first line of your\
    \ JavaScript program. If you want a specific function to confirm to strict mode,\
    \ you can add the directive as the first line of a function. For example, take\
    \ a look at the following code snippet:\n\n```\nfunction strictFn() {\n  // This\
    \ line makes EVERYTHING under this strict mode\n  'use strict';\n  ...\n  function\
    \ nestedStrictFn() {\n    //Everything in this function is also nested\n  ...}\n\
    }\n```\n\n# Runtime exceptions\n\nThese errors appear when you execute the code,\
    \ to refer to an undefined variable, or to process a null. When a runtime exception\
    \ occurs, any code after that particular line, which caused the exception, does\
    \ not execute. It is essential to correctly handle such exceptional scenarios\
    \ in the code. While exception handling can prevent crashes, also aid in debugging.\
    \ You can wrap the code that may encounter a runtime exception into a try block.\
    \ When any code inside this block generates a runtime exception, a corresponding\
    \ handler catches it. The handler is defined by a catch (exception) {} block.\
    \ Let's clarify this using the following example:\n\n```\ntry {\n  var a = doesnotexist;\
    \ // throws a runtime exception\n} catch (e) {\n  console.log(e.message); // handle\
    \ the exception\n  //prints \"doesnotexist is not defined\"\n}\n```"
