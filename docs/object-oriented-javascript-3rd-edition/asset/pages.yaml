  md: "```\n; for (let i of iter) {\n  console.log(i);\n}\n\"Hello\"\n\"World of \"\
    \n\"Iterators\"\n```\n\nLet's break this example down into smaller pieces. We\
    \ are creating an already iterable object. We will create an iter object using\
    \ object literal syntax that we are already familiar with. One special aspect\
    \ of this object is a [Symbol.iterator] method. This method definition uses a\
    \ combination of computed properties and ES6 shorthand method syntax, which we\
    \ already discussed in the last chapter. As this object contains a [Symbol.iterator]\
    \ method, this object is iterable, or it follows an iterator protocol. This method\
    \ also returns the iterator object that defines the behavior via exposing the\
    \ next() method. Now this object can be used with the for...of loop.\n\n# Generators\n\
    \nClosely linked with iterators and iterables, generators are one of the most\
    \ talked about features of ES6. Generator functions return a generator object;\
    \ this term sounds confusing at first. When you write a function, you instinctively\
    \ understand its behavior-the function starts execution, line-by-line, and finishes\
    \ execution when the last line is executed. Once the function is linearly executed\
    \ this, the rest of the code that the function is executed.\n\nIn languages where\
    \ multithreading is supported, such flow of execution can be interrupted and partially\
    \ finished tasks can be shared between different threads, processes, and channels.\
    \ JavaScript is single-threaded, and you don't need to deal with challenges around\
    \ multithreading at the moment.\n\nHowever, generator functions can be paused\
    \ and resumed. The important idea here is that the generator function chooses\
    \ to pause itself, it cannot be paused by any external code. During execution,\
    \ the function uses the yield keyword to pause. Once a generator function is paused,\
    \ it can only be resumed by code outside the function.\n\nYou can pause and resume\
    \ a generator function as many times you want to. With generator functions, a\
    \ popular pattern is to write infinite loops and pause and resume them when needed.\
    \ There are pros and cons of doing this, but the pattern has caught up already."
  merge: -1
  pgno: 208
- img_proc: true
  md: "# ES6 Iterators and Generators\n\nAnother important point to understand is\
    \ that generator functions also allow two-way message passing, in and out of it.\
    \ Whenever you pause the function using yield keyword, the message is sent out\
    \ of the generator function, and when the function is resumed, the message is\
    \ passed back to the generator function.\n\nLet's look at the following example\
    \ generatorFunc() to clarify how the generator functions works:\n\n```\nfunction*\
    \ generatorFunc() {\n  console.log('1'); //--> A\n  yield; //--> B\n  console.log('2');\
    \ //--> C\n}\nconst generatorObj = generatorFunc();\nconsole.log(generatorObj.next());\n\
    //\"value\"\n//Object {\n  // \"done\": false,\n  // \"value\": undefined\n//}\n\
    ```\n\nThis is a very simple generator function. However, there are several interesting\
    \ aspects that need careful understanding.\n\nFirst, notice an asterisk * immediately\
    \ after the keyword function, this is the syntax to indicate that the function\
    \ is a generator function. It is also okay to keep the asterisk immediately preceding\
    \ the function name. Both of the following are valid declarations:\n\n```\nfunction\
    \ *f() {\n  f() {\n```\n\nInside the function, the real magic is around the yield\
    \ keyword. When the yield keyword is encountered, the function pauses itself.\
    \ Before we move further, let's see how the function is invoked:\n\n```\nconst\
    \ generatorObj = generatorFunc();\ngeneratorObj.next(); //\"1\"\n```\n\nWhen we\
    \ invoke the generator function, it is not executed like a normal function, but\
    \ returns a generator object. You can use this generator object to control the\
    \ execution of the generator function. The next() method on the generator object\
    \ resumes the execution of the function."
  merge: -1
  pgno: 209
- img_proc: true
  md: "# ES6 Iterators and Generators\n\nWhen we call next() the first time, the execution\
    \ proceeds up until the first line of the function (marked by 'A'), and pauses\
    \ when the yield keyword is encountered. If we call the next () function again,\
    \ it will resume the execution to the next line from the point the execution paused\
    \ last time:\n\n```\nconsole.log(generatorObj.next());\n// \"2\"\n// Object {\n\
    \  // \"done\": true,\n  // \"value\": undefined\n}\n```\n\nOnce the first function\
    \ is executed, any calls to next() on the generator object have no effect. We\
    \ talked about generator functions allowing a two-way message passing. How does\
    \ that work? In the previous example, you can see that whenever we receive the\
    \ generator function, we receive an object with two values, done and value; in\
    \ our case, we received undefined as the value. This is because we did not return\
    \ any value with the yield keyword. When you return a value with the yield keyword,\
    \ the calling function receives it. Consider the following example:\n\n```\nfunction\
    \ logger() {\n  console.log('start')\n  console.log(yield)\n  console.log(yield)\n\
    \  console.log(yield)\n  return('end')\n}\n```\n\n```\nvar genObj = logger();\n\
    \n// the first call of next executes from the\nstart of the function until the\
    \ first yield statement\nconsole.log(genObj.next())\n// \"start\", Object {\"\
    done\": false,\"value\": undefined}\nconsole.log(genObj.next('Save'))\n// \"Save\"\
    , Object {\"done\": false,\"value\": undefined}\nconsole.log(genObj.next('Our'))\n\
    // \"Our\", Object {\"done\": false,\"value\": undefined}\nconsole.log(genObj.next('Souls'))\n\
    // \"Souls\", Object {\"done\": true,\"value\": \"end\"}\n```"
  merge: -1
  pgno: 210
- img_proc: true
  md: "# ES6 Iterators and Generators\n\nLet's trace the flow of execution of this\
    \ example step by step. The generator function has three pauses and yields. We\
    \ can create the generator object by writing the following line of code:\n\n```\n\
    var genObj = logger();\n```\n\nWe will start the execution of the generator function\
    \ by calling the `next` method; this method starts the execution until the first\
    \ yield. If you notice, we are not passing any value to the `next()` method in\
    \ the first call. The purpose of this `next()` method is just to start the generator\
    \ function. We will call the `next()` method again, but this time with a \"Save\"\
    \ value passed as a parameter. This value is received by `yield` when the function\
    \ execution is resumed, and we can see the value printed on console:\n\n> \"Save\"\
    , Object (\"done\": false, \"value\": undefined\")\n\nWe will call the `next()`\
    \ method with two different values, and the output is similar to the one in the\
    \ preceding code. When we call the `next()` method the last time, the execution\
    \ ends and the generator function returns an `end` value to the calling piece\
    \ of code. At the end of the execution, you will see `done` set as `true` and\
    \ `value` assigned the value returned by the function, that is, end:\n\n> \"Souls\"\
    ,Object (\"done\": true, \"value\": \"end\")\n\nIt is important to note that the\
    \ purpose of the first `next()` method is to start the execution of the generator\
    \ function- takes us to the first `yield` keyword and hence, any value passed\
    \ to the first `next()` method is ignored.\n\nFrom this discussion so far, it\
    \ is apparent that generator objects conform to the iterator contract:\n\n```\n\
    function* logger() {\n  yield 'a'\n  yield 'b'\n}\nvar genObj = logger();\n//the\
    \ generator object is built using generator function\nconsole.log(typeof genObj[Symbol.iterator]\
    \ === 'function') //true\n// it is an iterable\nconsole.log(typeof genObj.next\
    \ === 'function') //true\n// and an iterator (has a next(method))\nconsole.log(genObj[Symbol.iterator]()\
    \ === genObj) //true\n```\n\nThis example confirms that generator functions also\
    \ conform to the iterables contract."
