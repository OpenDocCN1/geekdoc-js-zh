  md: "Here's another example that combines several of the techniques discussed in\
    \ the last few\nsections of this chapter:\n\n```\nvar a = (function () {\n  function\
    \ someSetup() {\n    var setup = 'done';\n  }\n\n  function actualWork() {\n \
    \   alert('Worky-worky');\n  }\n\n  someSetup();\n  return actualWork();\n\n}()));\n\
    ```\n\nFrom this example, you can note the following things:\n\n+   - You have\
    \ private functions: someSetup() and actualWork().\n- You have an immediate function:\
    \ an anonymous function that calls itself using the parentheses following its\
    \ definition.\n- The function executes for the first time, calls someSetup(),\
    \ and returns a reference to the actualWork variable, which is a function. Notice\
    \ that there are no parentheses in the return statement because you're returning\
    \ a function reference, not the result of invoking this function.\n- As the whole\
    \ thing starts var a =, the value returned by the self-invoked function is assigned\
    \ to a.\n\nIf you want to test your understanding of the topics discussed, answer\
    \ the following\nquestions. What will the preceding code alert be in the following\
    \ cases:\n\n+   - It is initially loaded?\n- You call a () afterwards?\n\nThese\
    \ techniques can be really useful when working in the browser environment.\nDifferent\
    \ browsers can have different ways of achieving the same result. If you know that\n\
    the browser features won't change between function calls, you can have a function\n\
    determine the best way to do the work in the current browser, then redefine itself\
    \ so that\nthe browser capability detection is done only once. You'll see concrete\
    \ examples of this\nscenario later in this book."
