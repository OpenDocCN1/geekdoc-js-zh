- img_proc: true
  md: "# Promises\n\nES6 introduces promises as an alternate to callbacks. Like callbacks,\
    \ promises are used to retrieve the results of an asynchronous function call.\
    \ Using promises is easier than callbacks and produces more readable code. However,\
    \ to implement promises for your asynchronous functions requires more work.\n\n\
    A promise object represents a value that may be available now or in the future,\
    \ possibly never. A promise may be fulfilled or rejected. A promise acts as a\
    \ placeholder for the eventual result.\n\nA promise has three exclusive states,\
    \ which are as follows:\n\n+   1. A promise is pending before the result is ready;\
    \ this is the initial state.\n2. A promise is fulfilled when the result is ready.\n\
    3. On an error, a promise is rejected.\n\nWhen a pending promise is either fulfilled\
    \ or rejected, associated callbacks/handlers are queued up by the then() method\
    \ of the promise are executed.\n\nThe purpose of promises is to provide a better\
    \ syntax for the CPS callbacks. The typical CPS style asynchronous functions like\
    \ the following one:\n\n```\nasyncFunction(arg, result) => {\n  //...\n}\n```\n\
    \nThe preceding code can be written differently with promises, as shown in the\
    \ following lines of code:\n\n```\nasyncFunction(arg)\nthen(result=>{\n  //...\n\
    });\n```\n\nThe asynchronous function now returns a promise, which is the placeholder\
    \ for an eventual result. Callbacks registered with the then() method are notified\
    \ when the result is ready."
  merge: -1
  pgno: 303
- img_proc: true
  md: "You can chain the then() method. When the then() method sees that the callback\
    \ triggered another asynchronous action that returns a promise, it returns that\
    \ promise. Take a look at the following example:\n\n```\nasyncFunction(arg)\n\
    .then(resultA=>{\n  //...\n  return asyncFunctionB(arg);\n})\n.then(resultB=>{\n\
    \  //...\n})\n```\n\nLet's see a real example of how we can use promises. We saw\
    \ a typical example of asynchronous file reads in Node.js; now let's see what\
    \ that example will look like when used with promises. To jog our memories, we\
    \ wrote something like the following:\n\n```\nfs.readFile('text.json',\nfunction\
    \ (error, text) {\n  if (error) {\n    console.error('Error while reading text\
    \ file');\n  } else {\n    try {\n      //...\n    } catch (e) {\n      console.error('Invalid\
    \ content');\n    }\n  }\n});\n```\n\nWe see callbacks as continuation here; now\
    \ let's see how the same function can be written using promises:\n\n```\nreadFileWithPromises('text.json')\n\
    .then(text=>{\n  //...process text\n})\n.catch(error=>{\n  console.error('Error\
    \ while reading text file');\n})\n```\n\nNow the callbacks are invoked via the\
    \ result and methods then() and catch(). The handling is much cleaner because\
    \ we are not writing the if...else and try...catch constructs anymore."
  merge: -1
