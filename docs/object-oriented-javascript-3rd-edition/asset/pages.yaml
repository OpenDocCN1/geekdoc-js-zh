    > Best practice

    Use parentheses instead of relying on operator precedence. This makes your code
    easier to read and understand.


    The ECMAScript defines the precedence of operators. While it may be a good memorization
    exercise, this book doesn''t offer it. First of all, you''ll forget it, and second,
    even if you manage to remember it, you shouldn''t rely on it. The person reading
    and maintaining your code will likely be confused.


    # Lazy evaluation


    If you have several logical operations one after the other, but the result becomes
    clear at some point before the end, the final operations will not be performed
    because they don''t affect the result. Consider the following line of code as
    an example:


    ```

    > true || false || true || false;

    true

    ```


    As these are all OR operations and have the same precedence, the result will be
    true if least, one of the operands is true. After the first operand is evaluated,
    it becomes clear that the result will be true, no matter what values follow. So,
    the JavaScript engine decides to be lazy (OK, efficient) and avoids unnecessary
    work by evaluating code that doesn''t affect the end result. You can verify this
    short-circuiting behavior by experimenting in the console, as shown in the following
    code block:


    ```

    > var b = 5;

    > true || (b = 6);

    true

    > b;

    5

    > true && (b = 6);

    6

    > b;

    6

    ```'
