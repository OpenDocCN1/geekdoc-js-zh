  md: '# Using insertBefore() method


    Using appendChild(), you can only add children at the end of the selected element.
    For more control over the exact location, there is insertBefore(). This is the
    same as append(), but accepts an extra parameter specifying (before which) to
    insert the new node. For example, the following code inserts a text node at the
    end of the body element:


    ```

    document.body.appendChild(document.createTextNode(''boo!''));

    ```


    Moreover, this creates another node and adds it as the first child of the body
    element:


    ```

    document.body.insertBefore(

    document.createTextNode(''first boo!''),

    document.body.firstChild

    );

    ```


    # Removing nodes


    To remove nodes from the DOM tree, you can use the removeChild() method. Again,
    let''s start fresh with the same page with the body:


    ```

    <body>

    <p class="opener">first paragraph</p>

    <p><em>second</em> paragraph</p>

    <p id="closer">final</p>

    <!-- and that that''s about it --

    </body>",

    ```


    Here''s how you can remove the second paragraph:


    ```

    > var myp = document.getElementsByTagName(''p'')[1];

    > var removed = document.body.removeChild(myp);

    ```


    The method returns the removed node if you want to use it later. You can use all
    the DOM methods even though the element is no longer in the tree. Lets take a
    look on the following code:


    ```

    > removed;

    <p>...</p>

    > removed.firstChild;

    <em>second</em>",

    ```'
