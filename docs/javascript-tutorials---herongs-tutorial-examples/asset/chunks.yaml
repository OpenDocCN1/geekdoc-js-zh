  trans: "\n\n# JavaScript 教程 - Herong 的教程示例(#part0001.xhtml)\n\n## 对象介绍(#part0073.xhtml)\n\
    \n### 添加和删除对象方法\n\n本节对对象的自有方法进行了简要描述。提供了一个如何添加、调用和删除对象自有方法的教程示例。\n\n当你从 `Object`\
    \ 构造函数创建一个新对象时，你将得到一个仅包含某些方法的对象：\n\n- `toString()` - 这个默认方法输出 `[object Object]`。它需要被真实的方法所替换。\n\
    - `valueOf()` - 这个默认方法输出 `[object Object]`。它需要被真实的方法所替换。\n\n但你可以随时使用所示的赋值操作为一个对象添加更多方法：\n\
    \n```\n object_name.method_name = function_name;\n```\n\n添加的方法仅适用于该特定对象。其他对象将没有此方法。\n\
    \n在对象上调用方法与如下所示调用分配的函数是相同的：\n\n```\n object_name.method_name(param1, param2, ...);\n\
    ```\n\n你也可以随时使用所示的删除操作从对象中删除方法：\n\n```\n delete object_name.method_name;\n```\n\
    \n这里有一个教程示例，向你如何添加新方法、调用方法以及删除方法。\n\n```html\n <html>\n<!-- Object_Method.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>\"\
    Object\" 的方法</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n// 我用来打招呼的函数\nfunction sayHello(name) {\n   window.alert(\"Hello \"+name);\n\
    }\n\n   // 准备两个 \"Object\" 类型的对象\n   var mySite = new Object();\n   var myBook\
    \ = new Object();\n   mySite.url = \"herongyang.com\";\n   myBook.author = \"\
    Herong Yang\";\n\n   // 仅为一个对象添加方法\n   myBook.greet = sayHello;\n\n   // 在 \"\
    myBook\" 上调用方法\n   myBook.greet(myBook.author);\n\n   // 在 \"mySite\" 上调用方法 -\
    \ 将无法作用\n//   mySite.greet(myBook.author);\n\n   // 删除 \"myBook\" 上的方法\n   delete\
    \ myBook.greet;\n\n   // 在对象上调用方法 - 将无法作用\n//   myBook.greet(myBook.author);\n\
    </script>\n</pre>\n</body>\n</html>\n```\n\n如果你运行这个 JavaScript 页面，你会在屏幕上看到一个警告框，显示：“Hello\
    \ Herong Yang”。\n\n### 使用 \"this\" 关键字表示当前对象\n\n本节对 `this` 关键字进行了简要描述，它在对象方法中表示当前对象。提供了一个如何访问当前对象的属性和方法的教程示例。\n\
    \n在定义作为对象方法的方法时，你可以使用关键字 `this` 来表示调用方法所在的对象。JavaScript 中 `this` 关键字的用法与 Java\
    \ 中相同。\n\n这里是使用 `this` 关键字访问当前对象属性和方法的教程示例：\n\n```html\n <html>\n<!-- Object_this_Keyword.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>对象方法中的\
    \ \"this\" 关键字</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// 使用 \"this\" 获取属性\nfunction myToString() {\n   return '\"'+this.title +\
    \ '\" by '+this.author;\n}\n\n// 使用 \"this\" 获取 \"toString\" 方法\nfunction showAll()\
    \ {\n   window.alert(this.toString());\n}\n\n   // 准备一个 \"Object\" 类型的对象\n   var\
    \ myBook = new Object();\n   myBook.author = \"Herong Yang\";\n   myBook.title\
    \ = \"JavaScript Tutorials\";\n\n   // 仅为一个对象添加新方法\n   myBook.print = showAll;\n\
    \n   // 仅在一个对象上重写 \"toString()\"\n   myBook.toString = myToString;\n\n   // 在\
    \ \"myBook\" 上调用方法\n   myBook.print();\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\n如果你运行这个 \"this\" 关键字示例，你将得到一个警告框，消息内容为：\"JavaScript Tutorials\" by Herong\
    \ Yang。\n\n### \"Object\" 类型对象字面量\n\n本节对用于创建 `Object` 类型新对象的对象字面量或初始化器进行了简要描述。提供了一个如何初始化具有两个属性和两个方法的对象的教程示例。\n\
    \n在之前的章节中，我们学习了 `Object` 类型对象可以通过构造函数函数 `new Object()` 创建。\n\nJavaScript 还支持使用如下格式的对象字面量创建\
    \ `Object` 类型对象的简单方法：\n\n```\n {property1: value1, property2: value2, ...}\n```\n\
    \n其中 `property1` 和 `property2` 是属性或方法名。在 JavaScript 语言中，对象中的属性和方法是以相同的方式管理的。\n\
    \n对象字面量也被称为对象初始化器，因为它允许你在单次操作中创建新对象并用属性和方法对其进行初始化。\n\n使用对象字面量创建对象的结果与使用构造函数相同。但对象字面量要易于使用得多。以下两个代码段是完全相同的，但第一个要简单得多：\n\
    \n```javascript\n // 使用对象字面量创建对象\n   var obj = {property1: value1, property2:\
    \ value2, ...};\n\n   // 使用构造函数创建对象\n   var obj = new Object();\n   obj.property1\
    \ = value1;\n   obj.property2 = value2;\n   ...;\n```\n\n这里是使用对象字面量或初始化器创建 \"\
    Object\" 类型对象的教程示例：\n\n```html\n <html>\n<!-- Object_Literal.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>\"Object\" 类型的对象字面量</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n// 使用 \"this\" 获取属性\n\
    function myToString() {\n   return '\"'+this.title + '\" by '+this.author;\n}\n\
    \n// 使用 \"this\" 获取 \"toString\" 方法\nfunction showAll() {\n   window.alert(this.toString());\n\
    }\n\n   // 使用对象字面量\n   var myBook = {\n      author: \"Herong Yang\",\n      title:\
    \ \"JavaScript Tutorials\",\n      print: showAll,\n      toString: myToString\n\
    \   };\n\n   // 在 \"myBook\" 上调用方法\n   myBook.print();\n</script>\n</pre>\n</body>\n\
    </html>\n```\n\n如果你运行这个教程示例，你将得到与上一节示例相同的结果：\"JavaScript Tutorials\" by Herong\
    \ Yang。\n\n### 对象与关联数组\n\n本节对如何使用关联数组格式 `object_name['property_name']` 访问对象属性进行了简要描述。提供了一个如何将对象作为关联数组使用的教程示例。\n\
    \n在上一节中，我提到 JavaScript 中对象的方法管理方式与属性相同。这引出了 JavaScript 对象的另一个很棒特性：\n\nJavaScript\
    \ 中的对象实际上是关联数组，它们包含一个键值对的集合。键（Keys）代表属性名和方法名，值（Values）代表属性值和函数定义。\n\n现在你知道如何通过两种方式引用方法属性或方法了：\n\
    \n- 点运算符 (`.`) - 示例：`object_name.property_name`。\n- 关联数组运算符 - 示例：`object_name[\"\
    property_name\"]`。\n\n这里有一个关于如何以关联数组格式访问对象属性和方法的教程示例：\n\n"
- fmt: "\n```html\n <html>\n<!-- Object_Associate_Array.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Objects and Associate Arrays</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n// Using \"this\" to\
    \ get the properties\nfunction myToString() {\n   return '\"'+this.title + '\"\
    \ by '+this.author;\n}\n\n   // Using object literal format\n   var myBook = {\n\
    \      author: \"Herong Yang\",\n      title: \"JavaScript Tutorials\",\n    \
    \  toString: myToString\n   };\n\n   // Adding a new property\n   myBook['date']\
    \ = 2008;\n\n   // Getting properties values via different format\n   document.writeln(\"\
    myBook.title: \"+myBook.title);\n   document.writeln(\"myBook['title']: \"+myBook['title']);\n\
    \   document.writeln(\"myBook.date: \"+myBook.date);\n   document.writeln(\"myBook['date']:\
    \ \"+myBook['date']);\n   document.writeln(\"myBook.toString: \"+myBook.toString);\n\
    \   document.writeln(\"myBook['toString']: \"+myBook['toString']);\n\n   // Checking\
    \ property data types\n   document.writeln();\n   document.writeln(\"myBook.title\
    \ Type: \"+(typeof myBook.title));\n   document.writeln(\"myBook['date'] Type:\
    \ \"+(typeof myBook['date']));\n   document.writeln(\"myBook.toString Type: \"\
    \n      +(typeof myBook.toString));\n</script>\n</pre>\n</body>\n</html>\n```\n\
    \nIf you run this tutorial example, you will see the following output, which confirms\
    \ my understanding that the dot (`.`) operator and associate array element operator\
    \ (`[]`) are interchangeable.\n\n```text\n myBook.title: JavaScript Tutorials\n\
    myBook['title']: JavaScript Tutorials\nmyBook.date: 2008\nmyBook['date']: 2008\n\
    myBook.toString: function myToString() {\n    return \"\\\"\" + this.title + \"\
    \\\" by \" + this.author;\n}\nmyBook['toString']: function myToString() {\n  \
    \  return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\n\nmyBook.title\
    \ Type: string\nmyBook['date'] Type: number\nmyBook.toString Type: function\n\
    ```\n\nThe output also shows that as an object property, the value of a method\
    \ is the function definition.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Introduction to Objects](#part0073.xhtml)\n\n### Objects with Indexed Properties\n\
    \nThis section provides a quick description of indexed properties and indexed\
    \ methods. A tutorial example is provided on how to create and access indexed\
    \ properties and indexed methods.\n\nJavaScript also supports objects with indexed\
    \ properties with the following features:\n\n- An indexed property is a property\
    \ with an index number instead of a property name.\n- An indexed property can\
    \ not be accessed with the dot (`.`) operator.\n- An indexed property can be accessed\
    \ with the associate array operator (`['index']`).\n- An indexed property can\
    \ also be accessed with the array operator (`[index]`).\n- An indexed property\
    \ can be assigned with a function to become an indexed method.\n\nHere is a tutorial\
    \ example on how to define and access object's indexed properties and indexed\
    \ methods in two formats: array format and associate array format:\n\n```html\n\
    \ <html>\n<!-- Object_Indexed_Properties.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Objects with Indexed Properties</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n// Using \"this\" to\
    \ get the properties\nfunction myToString() {\n   return '\"'+this.title + '\"\
    \ by '+this.author;\n}\n\n   // Using object literal format\n   var myBook = {\n\
    \      author: \"Herong Yang\",\n      title: \"JavaScript Tutorials\",\n    \
    \  3: 2008,\n      price: \"Free\",\n      4: myToString\n   };\n\n   // Adding\
    \ a new indexed property   \n   myBook[9] = \"Programming\";\n\n   // An index\
    \ property can not be accessed with (.)\n   // document.writeln(\"myBook.3: \"\
    +myBook.3);\n\n   // Getting indexed property values\n   document.writeln(\"myBook[3]:\
    \ \"+myBook[3]);\n   document.writeln(\"myBook['3']: \"+myBook['3']);\n   document.writeln(\"\
    myBook[4]: \"+myBook[4]);\n   document.writeln(\"myBook[9]: \"+myBook[9]);\n\n\
    \   // Checking property data types\n   document.writeln();\n   document.writeln(myBook[4]());\n\
    </script>\n</pre>\n</body>\n</html>\n```\n\nThe output of this tutorial example\
    \ matches my expectation:\n\n```text\n myBook[3]: 2008\nmyBook['3']: 2008\nmyBook[4]:\
    \ function myToString() {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n\
    }\nmyBook[9]: Programming\n\n\"JavaScript Tutorials\" by Herong Yang\n```\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction\
    \ to Objects](#part0073.xhtml)\n\n### Differences between \"Object\" and \"Array\"\
    \n\nThis section provides a quick description of similarities and differences\
    \ of `Array` and `Object`. A tutorial example is provided on how to compare an\
    \ `Array` object to an `Object` object.\n\nJavaScript supports a number of predefined\
    \ core object types. Among them, `Object` and `Array` have very close relations.\
    \ If you compare `Array` with `Object`, you should see the following similarities\
    \ and differences:\n\n- `Array` is subclass, or sub-prototype, of `Object`. So\
    \ `Array` inherits all features from `Object`.\n- `Array` is not a new data type.\
    \ `Array` and `Object` are sharing the same data type `object`.\n- The `typeof`\
    \ operator on an `Array` object returns `object`.\n- The `instanceof` operator\
    \ on an `Array` object matches `Array`. It also matches `Object`, because `Array`\
    \ is a subclass of `Object`.\n- An object of `Object` can have indexed properties\
    \ using the same syntax as `Array` objects.\n- An object of `Object` is not an\
    \ object of `Array`.\n- An object of `Array` is also an object of `Object`.\n\n\
    Here is a JavaScript tutorial example that shows how `Array` and `Object` are\
    \ similar to each other:\n\n```html\n <html>\n<!-- Object_Associate_Array.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Objects\
    \ and Associate Arrays</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n// Using \"this\" to get the properties\nfunction myToString() {\n   return\
    \ '\"'+this.title + '\" by '+this.author;\n}\n\n   // Using object literal format\n\
    \   var myBook = {\n      author: \"Herong Yang\",\n      title: \"JavaScript\
    \ Tutorials\",\n      toString: myToString\n   };\n\n   // Adding a new property\n\
    \   myBook['date'] = 2008;\n\n   // Getting properties values via different format\n\
    \   document.writeln(\"myBook.title: \"+myBook.title);\n   document.writeln(\"\
    myBook['title']: \"+myBook['title']);\n   document.writeln(\"myBook.date: \"+myBook.date);\n\
    \   document.writeln(\"myBook['date']: \"+myBook['date']);\n   document.writeln(\"\
    myBook.toString: \"+myBook.toString);\n   document.writeln(\"myBook['toString']:\
    \ \"+myBook['toString']);\n\n   // Checking property data types\n   document.writeln();\n\
    \   document.writeln(\"myBook.title Type: \"+(typeof myBook.title));\n   document.writeln(\"\
    myBook['date'] Type: \"+(typeof myBook['date']));\n   document.writeln(\"myBook.toString\
    \ Type: \"\n      +(typeof myBook.toString));\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n*(Wait, the provided text for the comparison block in the prompt was actually\
