    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to Objects](#part0073.xhtml)\n\
    \n∟Objects of \"Object\" Data Type\n\nThis section provides a quick description\
    \ of the 'Object' data type, its properties and methods. A tutorial example is\
    \ provided on how to create and test an object of the 'Object' data type.\n\n\
    To learn how to use objects in JavaScript, we need to start with the \"Object\"\
    \ data type, which has the following basic features:\n\n*   All \"prototype\"\
    \ data types are extended from the \"Object\" data type.\n\n*   All objects of\
    \ all \"prototype\" data types are inheriting properties and methods from the\
