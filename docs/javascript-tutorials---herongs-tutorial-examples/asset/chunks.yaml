    # JavaScript Tutorials - Herong''s Tutorial Examples


    ## About This Book


    This section provides some detailed information about this book - JavaScript Tutorials
    - Herong''s Tutorial Examples.


    **Title:** JavaScript Tutorials - Herong''s Tutorial Examples


    **Author:** Dr. Herong Yang - Contact by email via herong_yang@yahoo.com.


    **Category:** JavaScript


    **Version/Edition:** 2.31, 2020


    **Number of pages in PDF format:** 204


    **Description:** This book is a collection of tutorial examples and notes written
    by the author while he was learning JavaScript. Topics include ECMAScript specifications;
    data types, variables and expressions; flow control statements: `if`, `for`, `switch`,
    and `while`; using arrays and objects; defining and calling functions; embedding
    JavaScript code in HTML documents; DOM (Document Object Model) API levels; using
    the JavaScript console in Web browsers; creating new object types with prototypes;
    building prototype inheritance hierarchy; managing functions as objects; `jrunscript`
    JavaScript shell. Updated in 2020 (Version 2.31) with minor corrections.


    **Keywords:** JavaScript, `jrunscript`, DOM, JSON


    **Copyright:**


    *   This book is under Copyright Copyright © 2020 by Dr. Herong Yang. All rights
    reserved.

    *   Material in this book may not be published, broadcasted, rewritten or redistributed
    in any form.

