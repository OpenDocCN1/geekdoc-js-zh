    \ println(\"   value of myObject.toString() = \"+s);\n   println(\"   value of\
    \ myObject.toFixed() = \"+f);\n\n   println(\"\\nConverting to Number objects\
    \ on the fly:\");\n   println(\"   (2/3).toFixed() = \"+((2/3).toFixed(2)));\n\
    \n   println(\"\\nUsing properties of the Number constructor:\");\n   println(\"\
    \   Number.MAX_VALUE = \"+Number.MAX_VALUE);\n   println(\"   Number.MIN_VALUE\
    \ = \"+Number.MIN_VALUE);\n```\n\nIf you run this script with `jrunscript`, you\
    \ will get:\n\n```\n About this \"myObject\":\n   Type = object\n   Instance Of\
    \ Object: true\n   Instance Of Number: true\n\nExecution result:\n   typeof myObject\
    \ = object\n   typeof myObject.valueOf() = number\n   typeof myObject.toString()\
    \ = string\n   typeof myObject.toFixed() = string\n   value of myObject.valueOf()\
    \ = 3.14159\n   value of myObject.toString() = 3.14159\n   value of myObject.toFixed()\
    \ = 3.14\n\nConverting to Number objects on the fly:\n   (2/3).toFixed() = 0.67\n\
    \nUsing properties of the Number constructor:\n   Number.MAX_VALUE = 1.7976931348623157e+308\n\
    \   Number.MIN_VALUE = 5e-324\n```\n\nNow we know how to create \"Number\" objects\
    \ with the `Number()` constructor.\n"
