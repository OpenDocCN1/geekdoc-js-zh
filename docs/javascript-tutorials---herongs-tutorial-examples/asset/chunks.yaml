    \ the \"onMouseDown\" event trigger attribute on the \"body\" tag is used to add\
    \ a short listener code to be executed with the user push down the mouse button\
    \ on the page. The listener code uses the \"event\" object provided by the browser\
    \ to retrieve x and y coordinates of the location.\n\nThe coordinates are reported\
    \ back the user with an alert box by calling the \"alert()\" method on the \"\
    window\" object. See the picture below:\n\n![](Images/image00134.jpeg)\n\nWindow\
    \ Alert Box\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n∟'javascript:' Pseudo-URL\
    \ Addresses\n\nThis section describes what is a 'javascript:' pseudo-URL address\
    \ and provides several interesting examples of 'javascript:' URLs.\n\nMany Web\
    \ browsers also support \"javascript:\" pseudo-URL addresses in the form of:\n\
    \n```\n javascript:statement;statement;...\n```\n\nWhen a \"javascript:\" pseudo-URL\
    \ is given to a browser, it will start to evaluate those JavaScript statements\
    \ included in the URL. Here are some examples of \"javascript:\" pseudo-URL addresses\
    \ that you can try:\n\n1\\. The following URL will cause the browser to display\
    \ a text message in small dialog box.\n\n```\n javascript:alert(\"Hello World!\"\
    );\n```\n\n2\\. The following URL will cause the browser to display a new page\
    \ with a text message.\n\n```\n javascript:document.write(\"<html><body>Hello\
    \ World!</body></html>\");\n```\n\n3\\. The following URL will cause the browser\
    \ to execute a complex JavaScript code resulting a HTML page with prime numbers.\
    \ Note that the entire URL address must be written in a single line. So you need\
    \ to join those lines below, copy and paste it to a browser.\n\n```\n javascript:var\
    \ i, j, is_prime; document.write('<body><pre>'); \n   for ( i=3; i<=30; i+=2 )\
    \ { is_prime = true; for ( j=2; j<=i/2; j++)\n   { is_prime = i%j > 0; if (!is_prime)\
    \ break;} \n   if (is_prime) document.writeln('Found a prime number: ' + i); }\
    \ \n   document.write('</pre></body>');\n```\n\nNow it's your turn to write more\
    \ \"javascript:\" URL examples.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n∟JavaScript Console\
    \ in Google Chrome\n\nThis section provides tutorial example on how to use the\
    \ JavaScript Console in Google Chrome to view execution errors and log messages\
    \ resulted from JavaScript execution. You can also use it to run any JavaScript\
    \ statements to interact with the HTML document.\n\n**What is JavaScript Console\
    \ in Google Chrome**? JavaScript Console in Google Chrome is a console provided\
    \ by the browser for you:\n\n*   To see any errors or log messages generated by\
    \ the browser when executing embedded JavaScript codes.\n\n*   To run any JavaScript\
    \ code to interact with the Web document interactively.\n\nHere is what I did\
    \ to test the JavaScript Console in Google Chrome:\n\n1\\. Run Google Chrome and\
    \ load the following HTML code:\n\n```\n <html>\n<head><title>Hello World!</title></head>\n\
    <body>\n<script type=\"text/javascript\">\n   document.write('Hello World! - Document');\n\
    \   console.log('Hello World! - Console');\n</script>\n</body>\n</html>\n```\n\
    \n2\\. Press F12 key. I see the developer panel displayed on the screen.\n\n3\\\
    . Click \"Console\" tab on the developer panel. I see the console log message\
    \ displayed: \"Hello World! - Console\".\n\n4\\. Enter some JavaScript statements\
    \ in the console to run:\n\n```\n Hello World! - Console\n> var msg = document.title;\n\
    < undefined\n> console.log(msg.length);\n  12\n< undefined\n> \n```\n\nCool. The\
    \ console is nice tool to troubleshoot any issues with my JavaScript code in HTML\
    \ pages running on Google Chrome.\n\n![](Images/image00135.jpeg)\n\nJavaScript\
    \ Console in Google Chrome\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n∟JavaScript Console\
    \ in Mozilla Firefox\n\nThis section provides tutorial example on how to use the\
    \ JavaScript Console in Mozilla Firefox to view execution errors and log messages\
    \ resulted from JavaScript execution. You can also use it to run any JavaScript\
    \ statements to interact with the HTML document.\n\n**What is JavaScript Console\
    \ in Mozilla Firefox**? JavaScript Console in Mozilla Firefox is a console provided\
    \ by the browser for you:\n\n*   To see any errors or log messages generated by\
    \ the browser when executing embedded JavaScript codes.\n\n*   To run any JavaScript\
    \ code to interact with the Web document interactively.\n\nHere is what I did\
    \ to test the JavaScript Console in Mozilla Firefox:\n\n1\\. Run Mozilla Firefox\
    \ and load the following HTML code:\n\n```\n <html>\n<head><title>Hello World!</title></head>\n\
    <body>\n<script type=\"text/javascript\">\n   document.write('Hello World! - Document');\n\
    \   console.log('Hello World! - Console');\n</script>\n</body>\n</html>\n```\n\
    \n2\\. Press F12 key. I see the developer panel displayed on the screen.\n\n3\\\
    . Click \"Console\" tab on the developer panel. I see the console log message\
    \ displayed: \"Hello World! - Console\".\n\n4\\. Enter some JavaScript statements\
    \ in the console to run:\n\n```\n Hello World! - Console\n>> var msg = document.title;\n\
    < undefined\n>> console.log(msg.length);\n  12\n< undefined\n> \n```\n\nCool.\
    \ The console is nice tool to troubleshoot any issues with my JavaScript code\
    \ in HTML pages running on Mozilla Firefox.\n\n![](Images/image00136.jpeg)\n\n\
    JavaScript Console in Mozilla Firefox\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n∟JavaScript Console in Apple Safari"
