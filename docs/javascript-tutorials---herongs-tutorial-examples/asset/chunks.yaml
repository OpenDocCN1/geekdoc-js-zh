  trans: "\n\n# JavaScript 教程 - Herong 的教程示例(#part0001.xhtml)\n\n## 控制语句\n\n### \"\
    while\" 循环语句示例\n\n本节提供了一个 JavaScript 教程示例，展示如何编写 `while` 循环语句。\n\n为了帮助你理解 `while`\
    \ 循环语句的工作，我编写了以下 JavaScript 教程示例：`For_Loop_Statements.html`：\n\n```html\n <>\n\
    <!-- While_Loop_Statements.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head><title>While Loop Statements</title></head>\n<body\n<pre>\n<script\
    \ type=\"text/javascript\">\n   var i, j, is_prime;\n   i = 3;\n   while ( i<=30\
    \ ) {\n      is_prime = true;\n      j = 2;\n      while ( j<=i/2 ) {\n      \
    \   is_prime = i%j > 0;\n         if (!is_prime) break;\n         j++;\n     \
    \ }\n      if (is_prime)\n         document.write(\"Found a prime number: \" +\
    \ i + \".\\n\");\n      i += 2;\n   }\n</script>\n</pre>\n</body\n</>\n```\n\n\
    此 JavaScript 使用嵌套的 `while` 语句来计算质数。它的执行逻辑与 `While_Loop_Statements.html` 中的 JavaScript\
    \ 相同。\n\n此示例 JavaScript 的输出为：\n\n```\n Found a prime number: 3.\nFound a prime\
    \ number: 5.\nFound a prime number: 7.\nFound a prime number: 11.\nFound a prime\
    \ number: 13.\nFound a prime number: 17.\nFound a prime number: 19.\nFound a prime\
    \ number: 23.\nFound a prime number: 29.\n```\n\n# JavaScript 教程 - Herong 的教程示例(#part0001.xhtml)\n\
    \n## 创建、访问和操作数组\n\n本章简要介绍了创建和操作数组的方法。主题包括：什么是数组；创建数组；访问数组元素；扩展和截断数组；调用数组对象方法。\n\
    \n- 什么是数组\n- 创建数组对象\n- 通过索引访问数组元素\n- 截断和迭代数组元素\n- 数组对象实例方法\n- 数组对象实例方法示例\n\n结论：\n\
    \n- 数组是一个对象，而不是原始数据类型。\n- 数组的元素不需要是相同的数据类型。\n- 可以使用数组字面量创建数组：`[a, b, ..., x]`。\n\
    - 可以使用 `Array` 构造函数创建数组：`New Array()`。\n- 可以使用内置函数创建数组：`Array()`。\n- 使用索引访问数组元素：`users[i]`。\n\
    - 数组有许多对象方法，如 `users.sort()`、`users.push(\"Herong\")` 等。\n\n# JavaScript 教程 -\
    \ Herong 的教程示例(#part0001.xhtml)\n\n## 创建、访问和操作数组\n\n### 什么是数组\n\n本节简要描述了 JavaScript\
    \ 中什么是数组，并提供了一个展示 JavaScript 数组特性的教程示例。\n\n与其他编程语言一样，JavaScript 支持数组，允许你存储和检索元素列表。\n\
    \n但与许多语言不同，JavaScript 没有显式的数组数据类型。相反，它提供了一个 `Array` 对象类型，让你像对象一样创建数组。以下是 JavaScript\
    \ 数组的主要特征：\n\n- 数组不是原始数据类型。\n- 数组是一个对象。\n- 数组元素是有索引的。可以通过索引存储和检索元素。\n- 数组索引从 0\
    \ 开始。换句话说，索引 0 表示第一个元素。\n- 数组的大小不是静态定义的。它可以动态地扩展或截断。\n- 数组的元素不需要是相同的数据类型。\n- 数组对象提供了多种方法，允许你直接操作数组。\n\
    \n以下是一个 JavaScript 教程示例，展示了上述的一些特征：\n\n```html\n <>\n<!-- Array_Features.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Array\
    \ Features</title></head>\n<body\n<pre>\n<script type=\"text/javascript\">\n\n\
    \   // 创建一个混合数据类型的新数组\n   var account = [\"Saving\", 999.99, true];\n\n   // 向数组中存储新值\n\
    \   account[2] = false;\n\n   // 获取一个元素\n   document.write(\"Account type: \"\
    +account[0]+\"\\n\");\n\n   // 调用数组方法\n   account.push(5.25/100);\n   document.write(\"\
    Interest rate: \"+account[3]*100+\"%\\n\");\n</script>\n</pre>\n</body\n</>\n\
    ```\n\n此示例 JavaScript 的输出为：\n\n```\n Account type: Saving\nInterest rate: 5.25%\n\
    ```\n\n# JavaScript 教程 - Herong 的教程示例(#part0001.xhtml)\n\n## 创建、访问和操作数组\n\n###\
    \ 创建数组对象\n\n本节提供了一个关于如何创建数组对象的教程示例。\n\n有 3 方法创建数组：\n\n1. 使用数组字面量：`[a, b, ...,\
    \ x]`。\n2. 使用 `Array` 构造函数：`new Array()`。\n3. 使用 `Array` 函数：`Array()`。\n\n以下是一个展示如何创建数组对象的\
    \ JavaScript 教程示例：\n\n```html\n <>\n<!-- Create_Arrays.html\n   Copyright (c)\
    \ HerongYang.com. All Rights Reserved.\n-->\n<head><title>Create Arrays</title></head>\n\
    <body\n<pre>\n<script type=\"text/javascript\">\n\n   // 使用数组字面量\n   var my_saving\
    \ = [\"Saving\", 999.99, true];\n\n   // 使用构造函数\n   var my_checking = new Array(\"\
    Checking\", 9.99);\n\n   // 使用函数\n   var my_stock = Array(\"Stock\", 99999.99);\n\
    \n   // 创建一个空数组\n   var new_account = [];\n\n   document.write(my_checking[0]+\"\
    : \"+my_checking[1]+\"\\n\");\n   document.write(my_saving[0]+\": \"+my_saving[1]+\"\
    \\n\");\n   document.write(my_stock[0]+\": \"+my_stock[1]+\"\\n\");\n   document.write(new_account[0]+\"\
    : \"+new_account[1]+\"\\n\");\n</script>\n</pre>\n</body\n</>\n```\n\n此示例 JavaScript\
    \ 的输出为：\n\n```\n Checking: 9.99\nSaving: 999.99\nStock: 99999.99\nundefined: undefined\n\
    ```\n\n# JavaScript 教程 - Herong 的教程示例(#part0001.xhtml)\n\n## 创建、访问和操作数组\n\n###\
    \ 通过索引访问数组元素\n\n本节提供了一个关于如何通过索引访问数组元素的教程示例。\n\n可以通过以下简单规则通过索引访问数组元素：\n\n- 与许多其他语言一样，可以使用\
    \ `array_name[index]` 语法访问数组元素。\n- 数组索引从 0 开始。\n- 数组长度定义为所有元素索引加 1。\n- JavaScript\
    \ 中没有越界异常。\n- 如果检索数组元素时指定的索引大于数组长度，将返回 `undefined` 值。\n- 如果存储数组元素时指定的索引大于数组长度，数组将扩展以便在指定的索引处存储元素。\n\
    \n"
