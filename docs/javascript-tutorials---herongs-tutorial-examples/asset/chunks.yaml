    本节提供了 `Global` 内置对象类型的简要描述和一个教程示例脚本，该类型用于创建一个默认的不可见全局对象，以存储所有的全局属性和函数。\n\n\"Global\"\
    \ 对象可能是最神秘的内置对象类型。它具有以下主要特征：\n\n- \"Global\" 是一个保留对象类型。你不能创建自己的 \"Global\" 对象。`Global()`\
    \ 构造函数是不可用的。\n- 主环境会创建一个默认的 \"Global\" 对象，它没有赋值给任何引用变量。因此这个 \"Global\" 对象是不可见的。\n\
    - 然而，通过使用 `this` 关键字，可以在全局执行上下文（任何函数之外）看到这个不可见的 \"Global\" 对象。\n- 你可以使用表达式 `this\
    \ instanceof Global` 来检查 `this` 的对象类型，因为 `Global()` 是不可用的。\n- 创建 \"Global\" 对象是为了存储主环境提供的所有内置属性和函数，例如\
    \ `NaN`、`eval()` 等。\n- 从技术上讲，内置属性或函数都定义为 \"Global\" 对象的属性。但你可以直接使用它们，而无需引用 `Global`\
    \ 对象。\n\n这里有一个显示其中一些特的教程示例脚本：\n\n```\n // Global_Object_Type.js\n// Copyright\
