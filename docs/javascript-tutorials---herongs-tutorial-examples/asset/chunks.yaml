  trans: "\n\n- 有几个主要的内置对象，它们表示构造函数，包括 `Array()`、`Boolean()`、`Date()`、`Error()`、`Function()`、`Math()`、`Number()`、`Object()`、`RegExp()`\
    \ 和 `String()`。\n- JavaScript 似乎不支持多重继承。\n- JavaScript 以特殊方式支持私有属性和方法。\n\n本章稍后将提供几个教程示例来阐明其中一些特性。\n\
    \nJavaScript 教程 - Herong 的教程示例\n\n### ∟定义你自己的对象类型](#part0084.xhtml)\n\n## 定义对象构造函数\n\
    \n本节简要介绍了如何定义对象构造函数。提供了一个教程示例，演示了如何创建一个具有 3 个属性和 1 个方法的 `'Book'` 构造函数。\n\n学习 JavaScript\
    \ 原型编程风格的第一要点是构造函数。在编写构造函数时，我们需要记住：\n\n- 构造函数的名称将作为对象的类型名称。因此，请为构造函数选择一个好的名称。\n\
    - 在构造函数中，`this` 关键字可以表示要构建的对象。\n- 属性应该在构造函数中使用赋值表达式添加，如 `this.property_name =\
    \ initial_value`。\n- 构造函数应该接受一些参数来初始化属性。\n- 方法应该在构造函数中使用赋值表达式添加，如 `this.method_name\
    \ = function_name`，其中 `function_name` 指向一个现有函数。\n- 不要在构造函数中使用任何 `return` 语句。当使用\
    \ `new` 运算符将其作为对象构造函数调用时，返回值将被忽略。\n\n这里有一个定义了名为 `Book(...)` 构造函数的教程示例，它定义了 3 个属性和\
    \ 1 个方法：\n\n```html\n <html>\n<!-- Prototype_Constructor_Function.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Defining Object\
    \ Constructor Functions</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// Defining the constructor function for a new object type\nfunction Book(title,\
    \ author) {\n   document.writeln(\"\\nConstructing a \\\"Book\\\" object...\"\
    );\n   this.title = title;\n   this.author = author;\n   this.price = undefined;\n\
    \   this.getDesc = getDescription;\n}\n\n// Defining a function to be used as\
    \ a method\nfunction getDescription() {\n   return \"\\\"\"+this.title+\"\\\"\
    \ by \"+this.author;\n}\n\n   // Creating an object of \"Book\"\n   var myBook\
    \ = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n   document.writeln(\"\
    \\nChecking the \\\"Book\\\" object\");\n   document.writeln(\"   Type: \"+(typeof\
    \ myBook));\n   document.writeln(\"   Instance of \\\"Book\\\": \"\n      +(myBook\
    \ instanceof Book));\n\n   // Testing properties and methods\n   document.writeln(\"\
    \   myBook.title: \"+myBook.title);\n   document.writeln(\"   myBook.author: \"\
    +myBook.author);\n   document.writeln(\"   myBook.price: \"+myBook.price);\n \
    \  document.writeln(\"   myBook.getDesc(): \"+myBook.getDesc());\n\n   // Trying\
    \ to call a constructor function as a normal function\n   Book(\"JavaScript Cookbook\"\
    , \"Yosef Cohen\");\n</script>\n</pre>\n</body>\n</html>\n```\n\n教程示例的输出打印所示：\n\
    \n```\n Constructing a \"Book\" object...\n\nChecking the \"Book\" object\n  \
    \ Type: object\n   Instance of \"Book\": true\n   myBook.title: JavaScript Tutorials\n\
    \   myBook.author: Herong Yang\n   myBook.price: undefined\n   myBook.getDesc():\
    \ \"JavaScript Tutorials\" by Herong Yang\n\nConstructing a \"Book\" object...\n\
    ```\n\n注意，最后一个测试语句证明构造函数只是一个普通函数，你可以直接调用它。但直接调用构造函数不会产生任何结果。\n\n简单总结：\n\n- 构造函数等于函数。构造函数是一个函数。而函数也是构造函数。\n\
    - 构造函数可以使用 `new` 运算符创建一个新对象。\n- 任何构造函数都可以被调用并作为函数执行。\n- 任何函数都可以作为构造函数创建对象。\n\n\
    JavaScript 教程 - Herong 的教程示例\n\n### ∟定义你自己的对象类型](#part0084.xhtml)\n\n## 向对象添加属性和方法\n\
    \n本节仅简要介绍了向对象添加属性和方法。提供了一个教程示例，演示了如何向 1 个对象添加 1 个额外的属性和 1 个额外的方法。\n\n从构造函数创建对象后，可以使用以下格式向该对象添加额外的属性和方法：\n\
    \n```\n object_name.property_name = initial_value;\n   object_name.method_name\
    \ = function_name;\n```\n\n这里有一个教程示例，它从 `Book()` 创建了两个对象，并仅向对象 `myBook` 添加了 1\
    \ 个额外的属性和 1 个额外的方法：\n\n```html\n <html>\n<!-- Prototype_Add_Property_and_Method.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Adding\
    \ Additional Properties and Methods to Objects</title>\n</head>\n<body>\n<pre>\n\
    <script type=\"text/javascript\">\n\n// Defining the constructor function for\
    \ a new object type\nfunction Book(title, author) {\n   this.title = title;\n\
    \   this.author = author;\n   this.price = undefined;\n   this.getDesc = getDescription;\n\
    }\n\n// Defining a function to be used as a method\nfunction getDescription()\
    \ {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // Creating\
    \ an object of \"Book\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"\
    Herong Yang\");\n   var ckBook = new Book(\"JavaScript Cookbook\", \"Yosef Cohen\"\
    );\n\n   // Adding additional property and method to myBook\n   myBook.price =\
    \ 99.99;\n   myBook.getDesc = getDescription;\n\n   function showObject(object,\
    \ name) {\n      document.writeln(\"\\nShowing object \\\"\"+name+\"\\\\\"\");\n\
    \      document.writeln(\"   Own Properties and Methods:\");\n      for (var item\
    \ in object) {\n          document.writeln(\"      \"+item+\": \"+object[item]);\n\
    \      }\n   }\n\n   showObject(myBook, \"myBook\");\n   showObject(ckBook, \"\
    ckBook\");\n</script>\n</pre>\n</body>\n</html>\n```\n\n教程示例的输出显示，构造函数中定义的属性被添加到两个对象。但添加到\
    \ `myBook` 的属性和方法仅适用于 `myBook`。\n\n```\n Showing object \"myBook\"\n   Own Properties\
    \ and Methods:\n      title: JavaScript Tutorials\n      author: Herong Yang\n\
    \      price: 99.99\n      getDesc: function() {\n    return \"\\\"\" + this.title\
    \ + \"\\\" by + this.author;\n}\n\nShowing object \"ckBook\"\n   Own Properties\
    \ and Methods:\n      title: JavaScript Cookbook\n      author: Yosef Cohen\n\
    ```\n\nJavaScript 教程 - Herong 的教程示例\n\n### ∟定义你自己的对象类型](#part0084.xhtml)\n\n##\
    \ \"for ... in\" 和 \"for each ... in\" 语句\n\n本节简要介绍了用于遍历对象属性和方法的特殊循环语句。提供了一个教程示例来展示相同类型对象的额外属性和方法。\n\
    \nJavaScript 支持两种特殊的循环语句，允许遍历对象中所有的属性和方法：\n\n1. `for ... in` 语句的语法如下：\n\n```\n\
    for (var item in object_name) {\n      ... statements with object_name[item] ...\n\
    }\n```\n\n在 `for ... in` 语句中，嵌入语句会对每个属性和方法执行。变量 `item` 将包含当前的属性或方法名称。表达式 `object_name[item]`\
    \ 使用关联数组格式获取属性值。\n\n2. `for each ... in` 语句的语法如下：\n\n```\nfor each (var value\
    \ in object_name) {\n      ... statements with value ...\n}\n```\n\n在 `for each\
    \ ... in` 语句中，嵌入语句会对每个属性和方法执行。变量 `value` 将包含当前属性的值或当前方法的函数。\n\n这里有一个教程示例，它同时使用\
    \ `for ... in` 和 `for each ... in` 语句来遍历所有属性和方法：\n\n"
- fmt: "\n```html\n<html\n<!-- Prototype_Property_Method_Loop.html\n   Copyright (c)\
    \ HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Adding Additional\
    \ Properties and Methods to Objects</title>\n</head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n\n// Defining the constructor function for a new object type\n\
    function Book(title, author) {\n   this.title = title;\n   this.author = author;\n\
    }\n\n// Defining a function to be used as a method\nfunction getDescription()\
    \ {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // Creating\
    \ an object of \"Book\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"\
    Herong Yang\");\n\n   // Adding additional property and method to one object\n\
    \   myBook.price = 99.99;\n   myBook.getDesc = getDescription;\n\n   // Showing\
    \ object properties and methods\n   showObject(myBook, \"myBook\");\n\nfunction\
    \ showObject(object, name) {\n   document.writeln(\"\\nShowing object \\\"\"+name+\"\
    \\\"\");\n   document.writeln(\"   Property/method names and values:\");\n   for\
    \ (var item in object) {\n      document.writeln(\"      \"+item+\": \"+object[item]);\n\
    \   }\n\n   document.writeln(\"\\nShowing object \\\"\"+name+\"\\\"\");\n   document.writeln(\"\
    \   Property/method values:\");\n   for each (var v in object) {\n      document.writeln(\"\
    \      \"+v);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output\
    \ of this tutorial example is printed below:\n\n```\n Showing object \"myBook\"\
    \n   Property/method names and values:\n      title: JavaScript Tutorials\n  \
    \    author: Herong Yang\n      price: 99.99\n      getDesc: function getDescription()\
    \ {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\n\nShowing\
    \ object \"myBook\"\n   Property/method values:\n      JavaScript Tutorials\n\
    \      Herong Yang\n      99.99\n      function getDescription() {\n    return\
    \ \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\n```\n\nNote that the\
    \ `for each ... in` statement has been deprecated. Do not use it anymore.\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining\
    \ Your Own Object Types](#part0084.xhtml)\n\n## \"prototype\" Property of the\
    \ Constructor Function Object\n\nThis section provides a quick description of\
    \ the built-in `prototype` property on the constructor function. A tutorial example\
    \ is provided on how to store properties and methods in the `prototype` property\
    \ to be inherited by all objects created by the constructor.\n\nIn previous sections,\
    \ we learned that a constructor can be used to create new objects. But a constructor\
    \ also carries a built-in property called `prototype`, which provides the mechanism\
    \ to allow objects to share and inherit properties and methods.\n\n*   A constructor\
    \ is also an object of the `Function` type.\n*   A constructor can its own properties\
    \ as an object.\n*   Every constructor has a default property called `prototype`.\n\
    *   The default `prototype` property of a constructor is an object.\n*   New properties\
    \ and methods can be added to the constructor's `prototype` object.\n*   All properties\
    \ and methods of the constructor's `prototype` object are shared by all objects\
    \ created from this constructor.\n\nLet's test this out using the following tutorial\
    \ example:\n\n```html\n <html>\n<!-- Prototype_Property_on_Constructor.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>The\
    \ \"prototype\" Property on the Constructor Function</title>\n</head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n\n// Defining object type constructor\
    \ function\nfunction Book(title, author) {\n   this.title = title;\n   this.author\
    \ = author;\n}\n\n   // Adding properties and methods to the \"prototype\"\n \
    \  Book.prototype.price = 9.99;\n   Book.prototype.getDesc = getDescription;\n\
    \n// Defining a function to be used as a method\nfunction getDescription() {\n\
    \   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // Creating\
    \ an object of \"Book\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"\
    Herong Yang\");\n\n   // Showing the object, constructor, and prototype\n   showObject(myBook,\
    \ \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype,\
    \ \"Book.prototype\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\
    \\nShowing object \\\"\"+name+\"\\\"\");\n   document.writeln(\"   Type: \"+(typeof\
    \ object));\n   document.writeln(\"   Property/method names and values:\");\n\
    \   for (var item in object) {\n      document.writeln(\"      \"+item+\": \"\
    +object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output\
    \ of this tutorial example shows that how the properties and methods of the \"\
    prototype\" are inherited by the object:\n\n```\n Showing object \"myBook\"\n\
    \   Type: object\n   Property/method names and values:\n      title: JavaScript\
    \ Tutorials\n      author: Herong Yang\n      price: 99.99\n      getDesc: function\
    \ getDescription() {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n\
    }\n\nShowing object \"Book\"\n   Type: function\n   Property/method names and\
    \ values:\n      prototype: [object Object]\n\nShowing object \"Book.prototype\"\
    \n   Type: object\n   Property/method names and values:\n      price: 9.99\n \
    \     getDesc: function getDescription() {\n    return \"\\\"\" + this.title +\
    \ \"\\\" by \" + this.author;\n}\n```\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[Defining Your Own Object Types](#part0084.xhtml)\n\
    \n## \"instanceof\" Operator - Determining Object Type\n\nThis section provides\
    \ a quick description of the `instanceof` operator. A tutorial example is provided\
    \ on how to use the `instanceof` operator to determine what is the type of an\
    \ object, and its parent types.\n\nSo far, we have played with several types of\
    \ objects, like `Object`, `Array`, `Function`, and `Book` (my own object type).\
    \ And we know how to create objects with these type by using their constructor\
    \ functions.\n\nBut we are given an object, how can we test its object type? JavaScript\
    \ offers the `instanceof` operator to help us with this expression\n\n```\n object_name\
    \ instanceof constructor_name;\n```\n\nThis `instanceof` expression returns a\
    \ Boolean value indicating whether or not the specified object is an instance\
    \ of the specified type (the constructor name represents the object type name).\n\
    \nThe tutorial examples below uses the `instanceof` operator to test 3 objects\
    \ used in my previous example:\n\n```html\n <html>\n<!-- Prototype_instanceof_Operator.html\n\
