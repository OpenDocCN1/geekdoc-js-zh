    }\n      4: function myToString() {\n    return \"\\\"\" + this.title + \"\\\"\
    \ by \" + this.author;\n}\n   # of properties and methods: 6\n\nCalling its methods:\n\
    \   bookArray.toString(): \"JavaScript Tutorials\" by Herong Yang\n   bookArray[4]():\
    \ \"JavaScript Tutorials\" by Herong Yang\n```\n\n# [JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n##  Defining Your Own Object Types\n\n\
    This chapter provides introductions and tutorial examples on how to define your\
    \ own object types. Topics include defining constructor functions; adding properties\
    \ and methods to objects or constructor prototypes; looping through properties\
    \ and methods; using `'instanceof'` and `'typeof'` operators.\n\n*   [Prototype-Dased\
    \ Object-Oriented Programming Style](#part0085.xhtml)\n*   [Prototype-Based Programming\
    \ Features in JavaScript](#part0086.xhtml)\n*   [Defining Object Constructor Functions](#part0087.xhtml)\n\
    *   [Adding Properties and Methods to Objects](#part0088.xhtml)\n*   [\"for ...\
    \ in\" and \"for each ... in\" Statements](#part0089.xhtml)\n*   [\"prototype\"\
    \ Property of the Constructor Function Object](#part0090.xhtml)\n*   [\"instanceof\"\
    \ Operator - Determining Object Type](#part0091.xhtml)\n*   [\"typeof\" Operator\
    \ and Data Types](#part0092.xhtml)\n\n### Conclusion:\n\n*   JavaScript is a prototype-based\
    \ programming language that supports object encapsulation, polymorphism, and inheritance.\n\
    *   JavaScript has no class definitions.\n*   Objects are created by calling constructor\
    \ functions: `New Abc()`.\n*   Object properties and methods can be added in the\
    \ constructor function.\n*   Object properties and methods can be added to individual\
    \ instances too.\n*   `for (var item in object_name)` and `for each (var value\
    \ in object_name)` statements can be used to loop through properties and methods\
    \ in an object.\n*   A constructor function itself is an object, which has property\
    \ called `\"prototype\"` referring the prototype definition.\n\n# [JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n## ∟Defining Your\
    \ Own Object Types](#part0084.xhtml)\n\n### Prototype-Dased Object-Oriented Programming\
    \ Style\n\nThis section provides a quick description of object-oriented programming\
    \ and prototype-based programming style.\n\nThere are three primary goals of object-oriented\
    \ programming:\n\n*   **Encapsulation**: The ability to conceal functional details\
    \ of an object behind an interface - In other words, encapsulation is the ability\
    \ to hide functional details of an object from objects that send messages.\n*\
    \   **Inheritance**: The ability for an object of a derived type to inherit attributes\
    \ from parent type.\n*   **Polymorphism**: The ability for two objects of type\
    \ to respond the same interface with their own behaviors.\n\nThese goals can be\
    \ archived with two different programming styles:\n\n*   **Class-Based Programming**:\
    \ An object is created through an instantiation process based on the specified\
    \ class, which is statically defined with the structure and behavior of the resulting\
    \ object.\n*   **Prototype-Based Programming**: An object is created through a\
    \ cloning process based on another object serving as prototype, which can be dynamically\
    \ modified.\n\nJavaScript is a prototype-based programming language which supports\
    \ encapsulation, polymorphism, and inheritance as described below:\n\n*   Encapsulation:\
    \ Functional details of an object are hidden inside properties and methods.\n\
    *   Inheritance: Properties and methods of a parent type are inherited through\
    \ prototype object.\n*   Polymorphism: Inherited properties and methods can be\
    \ overridden by an object specific to this object.\n\nSee other sections of this\
    \ chapter for detailed descriptions and tutorial examples of JavaScript prototype-based\
    \ programming features.\n\n# [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n## ∟[Defining Your Own Object Types](#part0084.xhtml)\n\n### ∟Prototype-Based\
    \ Programming Features in JavaScript\n\nThis section provides a list of some prototype-based\
    \ programming features in JavaScript, like constructor function, prototype object,\
    \ object properties and methods.\n\nAs I mentioned in the previous section, JavaScript\
    \ is a prototype-based programming language. It supports object-oriented programming\
    \ through a number of features:\n\n*   There is no class definitions. JavaScript\
    \ does not use classes.\n*   Objects are created from constructor functions.\n\
    *   Each constructor function represents a unique object type.\n*   A constructor\
    \ function can define properties and methods for all objects created from this\
    \ constructor function.\n*   Each constructor function can be associated with\
    \ a prototype object.\n*   An object automatically inherits properties and methods\
    \ of the prototype object associated with its constructor function.\n*   Each\
    \ object can its own properties and methods.\n*   Inherited properties and methods\
    \ can be overridden by a specific object or the prototype object.\n*   There is\
    \ one built-in constructor function called `Object()` that provides the base object\
    \ type for all other object types.\n*   All functions are actually objects created\
    \ from the base constructor function called `Function()`.\n*   All objects of\
    \ all types are inheriting properties and methods defined by the base constructor\
    \ function `Object()`.\n"
  raw: "*   Named properties can be added to \"Array\" objects.\n\n*   Elements of\
    \ an \"Array\" object are really indexed properties.\n\n*   Named properties and\
    \ indexed properties can be accessed using the associate array format.\n\n*  \
    \ Methods can be added as named properties or indexed properties.\n\nBelow is\
    \ a JavaScript tutorial example showing you how to use an \"Array\" object as\
    \ an \"Object\" object:\n\n```\n <html>\n<!-- Object_Array_as_Object.html\n  \
    \ Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Using\
    \ an Array as an Object</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n// Using \"this\" to get the properties\nfunction myToString() {\n   return\
    \ '\"'+this.title + '\" by '+this.author;\n}\n\n   // Creating an object of \"\
    Array\"\n   var bookArray = new Array();\n   bookArray[3] = 2008;\n   bookArray[9]\
    \ = \"Programming\";\n\n   // Adding named properties to \"bookArray\"\n   bookArray.author\
    \ = \"Herong Yang\";\n   bookArray.title = \"JavaScript Tutorials\";\n\n   //\
    \ Adding methods in 2 ways\n   bookArray.toString = myToString;\n   bookArray[4]\
    \ = myToString;\n\n   // Checking \"bookArray\"\n   document.writeln();\n   document.writeln(\"\
    About the \\\"Array\\\" object:\");\n   document.writeln(\"   Type: \"+(typeof\
    \ bookArray));\n   document.writeln(\"   Instance Of Object: \"\n      +(bookArray\
    \ instanceof Object));\n   document.writeln(\"   Instance Of Array: \"\n     \
    \ +(bookArray instanceof Array));\n   document.writeln(\"   Array Length: \"+bookArray.length);\n\
    \n   // Looping through all properties and methods\n   document.writeln(\"   Members:\"\
    );\n   var count = 0; \n   for (var item in bookArray) {\n      document.writeln(\"\
    \      \"+item+\": \"+bookArray[item]);\n      count++;\n   }\n   document.writeln(\"\
    \   # of properties and methods: \"+count);\n\n   // Calling its methods\n   document.writeln();\n\
    \   document.writeln(\"Calling its methods:\");\n   document.writeln(\"   bookArray.toString():\
    \ \"\n      +bookArray.toString());\n   document.writeln(\"   bookArray[4]():\
    \ \"+bookArray[4]());\n</script>\n</pre>\n</body>\n</html>\n```\n\nHere is the\
    \ output of this tutorial example. Notice that as an \"Array\" object, \"bookArray.length\"\
    \ returns 10 elements. But it only has 6 properties and methods.\n\n```\n About\
    \ the \"Array\" object:\n   Type: object\n   Instance Of Object: true\n   Instance\
    \ Of Array: true\n   Array Length: 10\n   Members:\n      3: 2008\n      9: Programming\n\
    \      author: Herong Yang\n      title: JavaScript Tutorials\n      toString:\
    \ function myToString() {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n\
    }\n      4: function myToString() {\n    return \"\\\"\" + this.title + \"\\\"\
    \ by \" + this.author;\n}\n   # of properties and methods: 6\n\nCalling its methods:\n\
    \   bookArray.toString(): \"JavaScript Tutorials\" by Herong Yang\n   bookArray[4]():\
    \ \"JavaScript Tutorials\" by Herong Yang\n```\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟Defining Your Own Object Types\n\nThis\
    \ chapter provides introductions and tutorial examples on how to define your own\
    \ object types. Topics include defining constructor functions; adding properties\
    \ and methods to objects or constructor prototypes; looping through properties\
    \ and methods; using 'instanceof' and 'typeof' operators.\n\n> [Prototype-Dased\
    \ Object-Oriented Programming Style](#part0085.xhtml)\n\n> \n\n> [Prototype-Based\
    \ Programming Features in JavaScript](#part0086.xhtml)\n\n> \n\n> [Defining Object\
    \ Constructor Functions](#part0087.xhtml)\n\n> \n\n> [Adding Properties and Methods\
    \ to Objects](#part0088.xhtml)\n\n> \n\n> [\"for ... in\" and \"for each ... in\"\
    \ Statements](#part0089.xhtml)\n\n> \n\n> [\"prototype\" Property of the Constructor\
    \ Function Object](#part0090.xhtml)\n\n> \n\n> [\"instanceof\" Operator - Determining\
    \ Object Type](#part0091.xhtml)\n\n> \n\n> [\"typeof\" Operator and Data Types](#part0092.xhtml)\n\
    \nConclusion:\n\n*   JavaScript is a prototype-based programming language that\
    \ supports object encapsulation, polymorphism, and inheritance.\n\n*   JavaScript\
    \ has no class definitions.\n\n*   Objects are created by calling constructor\
    \ functions: New Abc().\n\n*   Object properties and methods can be added in the\
    \ constructor function.\n\n*   Object properties and methods can be added to individual\
    \ instances too.\n\n*   \"for (var item in object_name)\" and \"for each (var\
    \ value in object_name)\" statements can be used to loop through properties and\
    \ methods in an object.\n\n*   A constructor function itself is an object, which\
    \ has property called \"prototype\" referring the prototype definition.\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining Your\
    \ Own Object Types](#part0084.xhtml)\n\n∟Prototype-Dased Object-Oriented Programming\
    \ Style\n\nThis section provides a quick description of object-oriented programming\
    \ and prototype-based programming style.\n\nThere are three primary goals of object-oriented\
    \ programming:\n\n*   Encapsulation - The ability to conceal functional details\
    \ of an object from objects that send messages to it In other words, encapsulation\
    \ is the ability to hide functional details of an object behind an interface -\
    \ a collection of methods for other objects to call.\n\n*   Inheritance - The\
    \ ability for an object of a derived type to inherit attributes and behaviors\
    \ from a parent type.\n\n*   Polymorphism - The ability for two objects of a parent\
    \ type and a derived type to respond to the same message from other objects with\
    \ their own type specific behaviors.\n\nThese goals can be archived with two different\
    \ programming styles:\n\n*   Class-Based Programming - An object is created through\
    \ an instantiation process based on the specified class, which is statically defined\
    \ with the structure and behavior of the resulting object.\n\n*   Prototype-Based\
    \ Programming - An object is created through a cloning process based on another\
    \ object serving as a prototype, which can be dynamically modified.\n\nJavaScript\
    \ is a prototype-based programming language which supports encapsulation, polymorphism,\
    \ and inheritance as described below:\n\n*   Encapsulation - Functional details\
    \ of an object are hidden inside properties and methods of the object.\n\n*  \
    \ Inheritance - Properties and methods of a parent type are inherited through\
    \ a prototype object.\n\n*   Polymorphism - Inherited properties and methods can\
    \ be overridden by an object of a derived type to respond the same interface specific\
    \ to this object.\n\nSee other sections of this chapter for detailed descriptions\
    \ and tutorial examples of JavaScript prototype-based programming features.\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining\
    \ Your Own Object Types](#part0084.xhtml)\n\n∟Prototype-Based Programming Features\
    \ in JavaScript\n\nThis section provides a list of some prototype-based programming\
    \ features in JavaScript, like constructor function, prototype object, object\
    \ properties and methods.\n\nAs I mentioned in the previous section, JavaScript\
    \ is a prototype-based programming language. It supports object-oriented programming\
    \ through a number of features:\n\n*   There is no class definitions. JavaScript\
    \ does not use classes.\n\n*   Objects are created from constructor functions.\n\
    \n*   Each constructor function represents a unique object type.\n\n*   A constructor\
    \ function can define properties and methods for all objects created from this\
    \ constructor function.\n\n*   Each constructor function can be associated with\
    \ a prototype object.\n\n*   An object automatically inherits properties and methods\
    \ of the prototype object associated with its constructor function.\n\n*   Each\
    \ object can its own properties and methods.\n\n*   Inherited properties and methods\
    \ can be overridden by a specific object or the prototype object.\n\n*   There\
    \ is one built-in constructor function called \"Object()\" that provides the base\
    \ object type for all other object types.\n\n*   All functions are actually objects\
    \ created from the base constructor function called \"Function()\".\n\n*   All\
    \ objects of all types are inheriting properties and methods defined by the base\
    \ constructor function \"Object()\"."
