    \n## [Introduction to Built-in Object Types](#part0118.xhtml)\n\n### The \"Function\"\
    \ Object Type - Functions Are Objects\n\nThis section provides a quick description\
    \ and a tutorial example script on the `Function` built-in object type, which\
    \ is used to create functions.\n\nThe `Function` object type is a special built-in\
    \ object type to be used to create new functions. It has the following main features:\n\
    \n* New functions can be created with the `Function()` constructor.\n* All `Function`\
