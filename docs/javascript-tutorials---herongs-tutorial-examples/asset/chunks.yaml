    \n∟[W3C's Document Object Model (DOM) Specifications](#part0134.xhtml)\n\n∟DOM\
    \ Level Test - document.implementation.hasFeature\n\nThis section provides a tutorial\
    \ example of using the `document.implementation.hasFeature()` method to test DOM\
    \ levels supported in a particular Web browser.\n\nIn DOM Level 1, 2, and 3 specifications,\
    \ there is one method that will let you to test what levels of DOM specifications\
    \ are supported in a specific Web browser: `document.implementation.hasFeature(feature,\
    \ level)`. It returns true, if the specified feature and level is supported by\
    \ the Web browser. Note that the level must be specified in the dot format like\
    \ `1.0`, `2.0`, or `3.0`.\n\nI used this method in the tutorial example to test\
    \ what levels of DOM are supported by Web browsers on my machine.\n\n```\n <html>\n\
    <!-- DOM_Level_Test.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head>\n<title>DOM Level Test</title>\n</head>\n<body><pre>\n<script type=\"\
    text/javascript\">\n   document.writeln(\"\\nDOM Level 0 Test:\");\n   document.writeln(\"\
    \   document.bgColor = \"+document.bgColor);\n\n   for (var i=1; i<4; i++) {\n\
    \      document.writeln(\"\\nDOM Level \"+i+\".0 Test:\");\n      document.writeln(\"\
    \   Core \"+i+\".0 = \"\n         + document.implementation.hasFeature(\"Core\"\
    , i+\".0\"));\n      document.writeln(\"   HTML \"+i+\".0 = \"\n         + document.implementation.hasFeature(\"\
    HTML\", i+\".0\"));\n   }\n</script>\n</pre></body>\n</html>\n```\n\nWhen I use\
    \ this script to test Chrome 68 and Firefox 61, the result shows that they support\
    \ DOM Level 1, 2, and 3.\n\n```\n DOM Level 0 Test:\n   document.bgColor = \n\n\
    DOM Level 1.0 Test:\n   Core 1.0 = true\n   HTML 1.0 = true\n\nDOM Level 2.0 Test:\n\
    \   Core 2.0 = true\n   HTML 2.0 = true\n\nDOM Level 3.0 Test:\n   Core 3.0 =\
    \ true\n   HTML 3.0 = true\n```\n\nWhen I use this script to test IE 11, the result\
    \ shows that they support DOM Level 1, and 2\\. Level 3 is not supported.\n\n\
    ```\n DOM Level 0 Test:\n   document.bgColor = #ffffff\n\nDOM Level 1.0 Test:\n\
    \   Core 1.0 = true\n   HTML 1.0 = true\n\nDOM Level 2.0 Test:\n   Core 2.0 =\
    \ true\n   HTML 2.0 = true\n\nDOM Level 3.0 Test:\n   Core 3.0 = false\n   HTML\
    \ 3.0 = false\n```\n\nIE 6.0 only supports Level 1:\n\n```\n DOM Level 0 Test:\n\
    \   document.bgColor = #ffffff\n\nDOM Level 1.0 Test:\n   Core 1.0 = false\n \
    \  HTML 1.0 = true\n\nDOM Level 2.0 Test:\n   Core 2.0 = false\n   HTML 2.0 =\
    \ false\n\nDOM Level 3.0 Test:\n   Core 3.0 = false\n   HTML 3.0 = false\n```\n\
    \nFirefox 2.0 supports Level 2:\n\n```\n DOM Level 0 Test:\n   document.bgColor\
    \ = #ffffff\n\nDOM Level 1.0 Test:\n   Core 1.0 = false\n   HTML 1.0 = true\n\n\
    DOM Level 2.0 Test:\n   Core 2.0 = true\n   HTML 2.0 = true\n\nDOM Level 3.0 Test:\n\
    \   Core 3.0 = false\n   HTML 3.0 = false\n```\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[W3C's Document Object Model (DOM) Specifications](#part0134.xhtml)\n\
    \n∟Inheritance vs. Flattened Views of the API\n\nThis section provides two different\
    \ views of DOM API: Flattened View - Everything is a node, and Inheritance View\
    \ - A hierarchy of inherited interfaces.\n\nThe DOM API provides two different\
    \ approaches to represent an XML/HTML document:\n\n1. \"Objected Oriented\" Approach\
    \ - a document is represented by a collection of linked objects that have different\
    \ interfaces with a hierarchy of inheritance. In other words, the entire DOM API\
    \ can be viewed as a hierarchy of inherited interfaces. This is also called the\
    \ \"Inheritance View of DOM\".\n\nIn this \"Inheritance View of DOM\", you need\
    \ to lean a family of related interfaces:\n\n```\n interface Node\n^\n|- interface\
    \ Document : Node\n|  ^\n|  |- interface HTMLDocument : Document\n|\n|- interface\
    \ Element : Node\n   ^\n   |- interface  HTMLElement : Element\n      ^\n    \
    \  |- interface HTMLHtmlElement : HTMLElement\n      |- interface HTMLHeadElement\
    \ : HTMLElement\n      |- interface HTMLTitleElement : HTMLElement\n      |- interface\
    \ HTMLBodyElement : HTMLElement\n      |- interface HTMLParagraphElement : HTMLElement\n\
    \      |- interface HTMLFormElement : HTMLElement\n      |- interface HTMLImageElement\
    \ : HTMLElement\n      ...\n```\n\n2. \"Everything Is a Node\" Approach - a document\
    \ is represented by a tree of objects that have a single interface called \"Node\"\
    . In other words, the entire DOM API can be viewed as an single interface - the\
    \ `Node` interface. This is also called the \"Flattened View of DOM\".\n\nIn this\
    \ \"Flattened View of DOM\", you just need to learn one interface, \"Node\":\n\
    \n```\n interface Node {\n  readonly attribute DOMString        nodeName;\n  \
    \         attribute DOMString        nodeValue;\n  readonly attribute unsigned\
    \ short   nodeType;\n  readonly attribute Node             parentNode;\n  readonly\
    \ attribute NodeList         childNodes;\n  readonly attribute NamedNodeMap  \
    \   attributes;\n  readonly attribute Document         ownerDocument;\n  Node\
    \               removeChild(in Node oldChild);\n  Node               appendChild(in\
    \ Node newChild);\n  ...\n};\n```\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[W3C's Document Object Model (DOM) Specifications](#part0134.xhtml)\n\
    \n∟A Web Document A Tree of Different Interfaces\n\nThis section provides a tutorial\
    \ example of JavaScript to show DOM interfaces for different elements. We know\
    \ that a Web page, a document, is a tree of elements (ignoring attributes). From\
    \ an object oriented point of view, different elements are represented by different\
    \ types of objects.\n\nNow let's walk through the tree and figure out which interface\
    \ is supported on each element with a simple JavaScript example:\n\n```\n <html\n\
    <!-- DOM_API_Oriented_View.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head>\n<title>DOM API - Oriented View</title>\n<style type=\"text/css\"\
    >body {background-color: #aaaaff}</style>\n<script type=\"text/javascript\">\n\
    function showInterface(node, prefix, out) {\n   out += prefix+node.constructor+\"\
    \\n\";\n   var list = node.childNodes;\n   for (var i=0; i<list.length; i++) {\n\
