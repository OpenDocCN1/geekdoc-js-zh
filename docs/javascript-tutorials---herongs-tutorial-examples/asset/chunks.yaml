    \ \"if\":\n\n```\n if (condition) statement;\n```\n\nwhere \"condition\" is a\
    \ Boolean value, and \"statement\" is a regular statement. The specified statement\
    \ will be executed, if and only if the specified condition is \"true\".\n\n2\\\
    . Multi-statement \"if\":\n\n```\n if (condition) {\n      statement_1;\n    \
    \  statement_2;\n      ...\n   }\n```\n\nThe specified multiple statements, a\
    \ statement block, will be executed, if and only if the specified condition is\
    \ \"true\".\n\n3\\. \"if ... else\" Statement:\n\n```\n if (condition) \n    \
    \  statement or statement block\n   else\n      statement or statement block\n\
