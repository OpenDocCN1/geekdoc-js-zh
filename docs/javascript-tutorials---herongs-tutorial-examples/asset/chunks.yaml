  trans: "` 开始处截断了），我将根据你提供的格式和要求，对已出现的内容进行翻译。如果后续还有内容，请继续提供完整的文本。\n\n[content]\n\n\
    ```html\n <html>\n<!-- Inheritance_Add_Inherited_Method.html\n   Copyright (c)\
    \ HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>在原型中添加继承方法</title>\n\
    </head>\n<body\n<pre>\n<script type=\"text/javascript\">\n\n// 设置我的构造函数、原型和对象\n\
    function Book(title, author) {\n   this.title = title;\n   this.author = author;\n\
    \   this.getDesc = getDescription;\n}\n\n// 定义一个被用作本地方法的函数\nfunction getDescription()\
    \ {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // 替换默认的原型对象\n\
    \   myPrototype = new Object();\n   Book.prototype = myPrototype;\n   Book.prototype.price\
    \ = 9.99;\n   Book.prototype.constructor = Book;\n\n   // 在原型中添加继承方法\n   Book.prototype.toString\
    \ = getString;\n\n// 定义一个被用作继承方法的函数\nfunction getString() {\n   return this.author+\"\
    /\"+this.title+\"/\"+this.price;\n}\n\n   // 修改基础原型对象\n   Object.prototype.copyright\
    \ = \"herongyang.com\";\n\n   // 从我的构造函数创建对象\n   var myBook = new Book(\"JavaScript\
    \ Tutorials\", \"Herong Yang\");\n\n   // 这些方法位于何处\n   document.writeln(\"\\nChecking\
    \ Object.prototype...\");\n   dumpProperty(Object.prototype, \"getDesc\");\n \
    \  dumpProperty(Object.prototype, \"toString\");\n   document.writeln(\"\\nChecking\
    \ Book.prototype...\");\n   dumpProperty(Book.prototype, \"getDesc\");\n   dumpProperty(Book.prototype,\
    \ \"toString\");\n   document.writeln(\"\\nChecking myBook...\");\n   dumpProperty(myBook,\
    \ \"getDesc\");\n   dumpProperty(myBook, \"toString\");\n\n   // 执行这些方法\n   document.writeln(\"\
    \\nRunning myBook.getDesc()...\");\n   document.writeln(\"   \"+myBook.getDesc());\n\
    \   document.writeln(\"\\nRunning myBook.toString()...\");\n   document.writeln(\"\
    \   \"+myBook.toString());\n\nfunction dumpProperty(object, property) {\n   var\
    \ inheritance; \n   if (object.hasOwnProperty(property)) \n      inheritance =\
    \ \"Local\";\n   else \n      inheritance = \"Inherited\";\n   document.writeln(\"\
    \   \"+property+\": \"+inheritance+\": \"\n      +object[property]);\n}\n</script>\n\
    </pre>\n</</body>\n</</html>\n```\n\n此教程示例的输出确认了 `toString` 是原型层面的继承方法：\n\n```\n\
    \ Checking Object.prototype...\n   getDesc: Inherited: undefined\n   toString:\
    \ Local: function toString() {\n    [native code]\n}\n\nChecking Book.prototype...\n\
    \   getDesc: Inherited: undefined\n   toString: Local: function getString() {\n\
    \    return this.author + \"/\" + this.title + \"/\" + this.price;\n}\n\nChecking\
    \ myBook...\n   getDesc: Local: function getDescription() {\n    return \"\\\"\
    \" + this.title + \"\\\" by \" + this.author;\n}\n   toString: Inherited: function\
    \ getString() {\n    return this.author + \"/\" + this.title + \"/\" + this.price;\n\
    }\n\nRunning myBook.getDesc()...\n   \"JavaScript Tutorials\" by Herong Yang\n\
    \nRunning myBook.toString()...\n   Herong Yang/JavaScript Tutorials/9.99\n```\n\
    \n现在我们知道本地方法和继承方法所在的位置了。这是我更新后的对象继承树结构图：\n\n![](img/image00148.jpeg)\n\nJavaScript\
    \ 教程 - Herong 的教程示例\n\n∟通过原型对象链继承属性和方法\n\n∟构建多级原型对象\n\n本节提供了一个关于如何构建多级级原型对象的教程示例。它还展示了如何用本地属性覆盖继承属性。\n\
    \n作为通过多级原型对象对象属性继承的总结，我编写了此教程示例，使用 `myBook` 作为原型来定义一个 `EBook` 构造函数：\n\n```html\n\
    \ <html\n<!-- Inheritance_Multiple_Level_Prototypes.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>构建多级原型</title>\n</head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n// 修改基础原型对象\n\n   Object.prototype.copyright\
    \ = \"herongyang.com\";\n</script>\n<script type=\"text/javascript\">\n// 定义 \"\
    Book\" 构造函数\n\nfunction Book(title, author) {\n   this.title = title;\n   this.author\
    \ = author;\n   this.getDesc = getDescription;\n}\n\nfunction getDescription()\
    \ {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   var myPrototype\
    \ = new Object();\n   Book.prototype = myPrototype;\n   Book.prototype.price =\
    \ 9.99;\n   Book.prototype.constructor = Book;\n   Book.prototype.toString = getString;\n\
    \nfunction getString() {\n   return this.author+\"/\"+this.title+\"/\"+this.price;\n\
    }\n</script>\n<script type=\"text/javascript\">\n// 定义第二级构造函数 \"EBook\"\n\nfunction\
    \ EBook(url) {\n   this.url = url;\n}\n\n   var myBook = new Book(\"JavaScript\
    \ Tutorials\", \"Herong Yang\");\n   EBook.prototype = myBook;\n   EBook.prototype.constructor\
    \ = EBook;\n\n   // 从我的构造函数创建对象\n   var myEBook = new EBook(\"www.example.com\"\
    );\n\n   // 这些方法位于何处\n   document.writeln(\"\\nChecking Object.prototype...\"\
    );\n   dumpProperty(Object.prototype, \"getDesc\");\n   dumpProperty(Object.prototype,\
    \ \"toString\");\n   document.writeln(\"\\nChecking Book.prototype...\");\n  \
    \ dumpProperty(Book.prototype, \"getDesc\");\n   dumpProperty(Book.prototype,\
    \ \"toString\");\n   document.writeln(\"\\nChecking myBook.prototype...\");\n\
    \   dumpProperty(myBook.prototype, \"getDesc\");\n   dumpProperty(myBook.prototype,\
    \ \"toString\");\n   document.writeln(\"\\nChecking myEBook...\");\n   dumpProperty(myEBook,\
    \ \"getDesc\");\n   dumpProperty(myEBook, \"toString\");\n\n   // 执行这些方法\n   document.writeln(\"\
    \\nRunning myEBook.getDesc()...\");\n   document.writeln(\"   \"+myEBook.getDesc());\n\
    \   document.writeln(\"\\nRunning myEBook.toString()...\");\n   document.writeln(\"\
    \   \"+myEBook.toString());\n\nfunction dumpProperty(object, property) {\n   var\
    \ inheritance; \n   if (object.hasOwnProperty(property)) \n      inheritance =\
    \ \"Local\";\n   else \n      inheritance = \"Inherited\";\n   document.writeln(\"\
    \   \"+property+\": \"+inheritance+\": \"\n      +object[property]);\n}\n</script>\n\
    </pre>\n</body>\n</html>\n```\n\n"
- fmt: "\nThis chapter provides introductions and tutorial examples on JavaScript\
    \ shell command included in the JDK package. Topics include downloading and installing\
    \ JDK; ECMAScript (JavaScript) engine used in `jrunscript` command; running JavaScript\
    \ code in command line; interactive or batch mode.\n\n- [Downloading and Installing\
    \ JDK 10](#part0105.xhtml)\n- [\"jrunscript\" - Scripting Shell Command and Options](#part0106.xhtml)\n\
    - [Running JavaScript Code with 'jrunscript'](#part0107.xhtml)\n- [Evaluating\
    \ JavaScript Code with 'jrunscript' Interactively](#part0108.xhtml)\n- [Running\
    \ a JavaScript Code File with 'jrunscript'](#part0109.xhtml)\n\n### Conclusion:\n\
    \n- JDK (Java Development Kit) package includes a JavaScript execution tool called\
    \ `jrunscript`.\n- You can run JavaScript code interactively using the `jrunscript`\
    \ command.\n- You can run JavaScript code embedded in the command line using `jrunscript\
    \ -e` option.\n- You can run JavaScript code stored in a file using the `jrunscript\
    \ -f` command.\n\n### [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟['jrunscript' - JavaScript Shell Command from JDK](#part0104.xhtml)\n\n###\
    \ Downloading and Installing JDK 10\n\nThis section describes how to download\
    \ and install Java SE 1.6 Update 2 on Windows.\n\n`jrunscript`: A command line\
    \ script shell included in the current version JDK (Java Development Kit) from\
    \ Oracle.com. `jrunscript` supports both an interactive (read-eval-print) mode\
    \ and a batch (`-f` option) mode of script execution. This is a scripting language\
    \ independent shell. By default, JavaScript is the language used, but the `-l`\
    \ option can be used to specify a different language.\n\n`jrunscript` allows you\
    \ to run JavaScript code in a stand alone mode without using any Web browsers.\
    \ In order to try `jrunscript`, you have to have a copy of JDK installed on your\
    \ machine.\n\nHere is what I did to download and install JDK 10 on my Windows\
    \ machine:\n\n- Open the Java SE Download page with this URL: `http://www.oracle.com/technetwork/java/javase/downloads/`\n\
    - Click the download button next to \"Java Platform (JDK) 10\". You will see a\
    \ new page with a list of different download files of JDK 10.\n- Accept the license\
    \ agreement.\n- Click the hyper link of `jdk-10.0.1_windows-x64_bin.exe`, next\
    \ to \"Windows 390.19 MB\".\n- Save `jdk-10.0.1_windows-x64_bin.exe` to a temporary\
    \ directory.\n- Double-click on `jdk-10.0.1_windows-x64_bin.exe` to start the\
    \ installation wizard.\n- The installation wizard will guide you to finish the\
    \ installation.\n\nTo test the installation, open a command window to try the\
    \ `java` command. If you are getting the following output, your installation was\
    \ ok:\n\n```\nC:\\herong>\\progra~1\\java\\jdk-10.0.1\\bin\\java -version\njava\
    \ version \"10.0.1\" 2018-04-17\nJava(TM) SE Runtime Environment 18.3 (build 10.0.1+10)\n\
    Java HotSpot(TM) 64-Bit Server VM 18.3 (build 10.0.1+10, mixed mode)\n```\n\n\
    ### [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟['jrunscript'\
    \ - JavaScript Shell Command from JDK](#part0104.xhtml)\n\n### \"jrunscript\"\
    \ - Scripting Shell Command and Options\n\nThis section describes the scripting\
    \ shell, `jrunscript`, command and options. The default scripting engine is JavaScript\
    \ - ECMAScript 1.6 implementation 'Mozilla Rhino' 1.6 release 2.\n\nAfter installing\
    \ JDK on my machine, I want to get some help information on how to use the `jrunscript`\
    \ command by running it with the `-help` option:\n\n```\nC:\\herong>\\progra~1\\\
    java\\jdk-10.0.1\\bin\\jrunscript -help\n\nUsage: jrunscript [options] [arguments...]\n\
    \nwhere [options] include:\n -classpath <path>    Specify where to find user class\
    \ files\n -cp <path>           Specify where to find user class files\n -D<name>=<value>\
    \     Set a system property\n -J<flag>             Pass <flag> directly to the\
    \ runtime system\n -l <language>        Use specified scripting language\n -e\
    \ <script>          Evaluate given script\n -encoding <encoding> Specify character\
    \ encoding used by script files\n -f <script file>     Evaluate given script file\n\
    \ -f -                 Interactive mode, read script from standard \n        \
    \              input. If this is used, this should be the last\n             \
    \         -f option\n -help                Print this usage message and exit\n\
    \ -?                   Print this usage message and exit\n -q                \
    \   List all scripting engines available and exit\n```\n\nIf `[arguments..]` are\
    \ present and if no `-e` or `-f` option is used, then first argument is script\
    \ file and the rest of the arguments, if any, are passed as script arguments.\
    \ If `[arguments..]` and `-e` or `-f` option is used, then...\n"
