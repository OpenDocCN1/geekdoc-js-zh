    \n## The \"Array\" Object Type - Arrays Are Objects\n\nThis section provides a\
    \ quick description and a tutorial example script on the `Array` built-in object\
    \ type, which is used to create arrays.\n\nThe `Array` object type is a special\
    \ built-in object type to be used to create new arrays. It has the following main\
    \ features:\n\n- New arrays can be created with the `Array()` constructor.\n-\
    \ All `Array` objects have an inherited property called `length` representing\
    \ the number of elements of the array.\n- All `Array` objects have many inherited\
    \ methods: `reverse()`, `sort()`, `indexOf()`, `push()`, `pop()`, `shift()`, etc..\n\
    - All elements in an array are actually properties with their indexes as property\
    \ names.\n- A `Array` object can also be created with an array literal: `[elements...]`.\n\
    - A `Array` object can also be created with the `Array` function: `Array(elements...)`.\n\
    \nHere is a tutorial example script showing some of those features:\n\n```javascript\n\
    \ // Array_Object_Type.js\n// Copyright (c) HerongYang.com. All Rights Reserved.\n\
    \n   // Creating a new array\n   var colors = new Array(\"Red\", \"Green\", \"\
    Blue\");\n\n   // Checking this object\n   println(\"\\nAbout this \\\"colors\\\
    \":\");\n   println(\"   Type = \"+(typeof colors));\n   println(\"   Instance\
    \ Of Object: \"+(colors instanceof Object));\n   println(\"   Instance Of Array:\
    \ \"+(colors instanceof Array));\n\n   println(\"\\nList of array properties:\"\
    );\n   for (item in colors) {\n      println(\"   \"+item+\" = \"+colors[item]);\n\
    \   }\n\n   // Using array's inherited property and method\n   colors.push(\"\
    Yellow\");\n   colors.sort();\n\n   // Accessing elements through indexes\n  \
    \ println(\"\\nAfter push() and sort():\");\n   for (var i=0; i<colors.length;\
    \ i++) {\n      println(\"   \"+i+\" = \"+colors[i]);\n   }\n```\n\nIf you run\
    \ this script with `jrunscript`, you will get:\n\n```\n About this \"colors\"\
    :\n   Type = object\n   Instance Of Object: true\n   Instance Of Array: true\n\
    \nList of array properties:\n   0 = Red\n   1 = Green\n   2 = Blue\n\nAfter push()\
    \ and sort():\n   0 = Blue\n   1 = Green\n   2 = Red\n   3 = Yellow\n```\n\nNow\
    \ we know how to create arrays with the `Array()` constructor.\n\nRead other \"\
    Array\" related chapters to see more tutorial examples.\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to Built-in\
    \ Object Types](#part0118.xhtml)\n\n## The \"JSON\" Object Type - parse() and\
    \ stringify\n\nThis section provides a quick description and a tutorial example\
    \ script on the `JSON` built-in object type, which is used to parse JSON strings\
    \ to create JavaScript structured values and convert JavaScript structured values\
    \ to JSON strings.\n\nThe `JSON` object type that offers 2 static functions to\
    \ parse and generate JSON text strings:\n\n1. `JSON.parse()` - Parses a text string\
    \ from a JSON text string, constructs the JavaScript value. An optional `reviver`\
    \ function can be provided to perform a transformation on the resulting object\
    \ before it is returned.\n2. `JSON.stringify()` - Converts a JavaScript value\
    \ to a JSON text string. An optional `replacer` function is specified to replace\
    \ some values.\n\nHere is a JavaScript code example, `JSON.html`, that shows you\
    \ how to use the built-in `JSON` object:\n\n```html\n <html>\n<body>\n<script\
    \ type=\"text/javascript\">\n   var object = {\"msg\":\"Hello World!\"};\n   var\
    \ str = JSON.stringify(object);\n\n   document.write(\"<p>JSON text string from\
    \ JSON.stringify():</p>\");\n   document.write(\"<pre>str = \"+str+\"</pre>\"\
    );\n\n   var val = JSON.parse(str);\n   document.write(\"<p>Value from JSON.parse():</p>\"\
    );\n   document.write(\"<pre>val.msg = \"+val.msg+\"</pre>\");\n</script>\n</body>\n\
    </html>\n```\n\nOpen this example, `JSON.html`, in a Web browser. You see the\
    \ following:\n\n```\n JSON text string from JSON.stringify():\n   str = {\"msg\"\
    :\"Hello World!\"}\n\nValue from JSON.parse():\n   val.msg = Hello World!\n```\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction\
    \ to Built-in Object Types](#part0118.xhtml)\n\n## The \"String\" Object Type\
    \ - Not Equal to String Primitive Type\n\nThis section provides a quick description\
    \ and a tutorial example script on the `String` built-in object type, which is\
    \ used to create `String` objects. Watch out: `String` objects are not string\
    \ values.\n\nThe `String` object type is a special built-in object type to be\
    \ used to create a `String` object, which is different than a string value of\
    \ the string primitive type. It has the following main features:\n\n- New `String`\
    \ objects can be created with the `String()` constructor. Note that `String()`\
    \ is also a regular function, which returns a string value, not a `String` object.\n\
    - All `String` objects have an inherited property called `length` representing\
    \ the number of characters of the string.\n- All `String` objects have many inherited\
    \ methods: `toString()`, `charAt()`, `charCodeAt()`, `concat()`, `indexOf()`,\
    \ etc.. Accessing those inherited methods is the main reason of using `String`\
    \ objects instead of string values.\n- A string literal, `\"...\"`, creates a\
    \ string value, not a `String` object.\n- A string value can be converted to a\
    \ `String` object on the fly with the `.` operator, for example: `\"string\".length`.\n\
    \nHere is a tutorial example script showing some of those features:\n\n```javascript\n\
    \ // String_Object_Type.js\n// Copyright (c) HerongYang.com. All Rights Reserved.\n\
    \n   // Creating a new String object\n   var message = new String(\"Hello World!\"\
    );\n\n   // Checking this object\n   println(\"\\nAbout this \\\"message\\\":\"\
    );\n   println(\"   Type = \"+(typeof message));\n   println(\"   Instance Of\
    \ Object: \"+(message instanceof Object));\n   println(\"   Instance Of String:\
    \ \"+(message instanceof String));\n\n   // Using String's inherited property\
    \ and method\n   var upperMessage = message.toUpperCase();\n   var l = message.length;\n\
    \   var subMessage = message.substring(0,l-7);\n\n   println(\"\\nExecution result:\"\
    );\n   println(\"   typeof message = \"+(typeof message));\n   println(\"   message.toString()\
    \ = \"+message.toString());\n   println(\"   typeof upperMessage = \"+(typeof\
    \ upperMessage));\n   println(\"   upperMessage = \"+upperMessage);\n   println(\"\
    \   typeof subMessage = \"+(typeof subMessage));\n   println(\"   subMessage =\
    \ \"+subMessage);\n\n   println(\"\\nConverting to String objects on the fly:\"\
    );\n   println(\"   \\\"...\\\".length = \"+(\"Hello World!\".length));\n   println(\"\
    \   \\\"...\\\".toUpperCase() = \"\n      +(\"Hello World!\".toUpperCase()));\n\
    ```\n\nIf you run this script with `jrunscript`, you will get:\n"
