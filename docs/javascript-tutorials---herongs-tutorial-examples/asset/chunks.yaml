    <body>\n<pre>\n<script type=\"text/javascript\">\n\n   // Creating an empty array\n\
    \   var glossary = new Array();\n\n   // Adding the first element\n   glossary[0]\
    \ = \"JavaScript\";\n\n   // Adding the second element at index 10\n   // This\
