    \ 示例\n- DOM Level 2 - 示例\n- DOM Level 3 - 示例\n- DOM 节点 - document.implementation.hasFeature\n\
    - API 的继承与扁平化视图对比\n- 作为不同接口树的 Web 文档\n- 作为节点树的 Web 文档\n- 在新窗口中输出文档 - JavaScript\
