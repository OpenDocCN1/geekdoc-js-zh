  trans: "\n\n# Google Chrome 中的 JavaScript 控制台\n# Mozilla Firefox 中的 JavaScript 控制台\n\
    # Apple Safari 中的 JavaScript 控制台\n# IE (Internet Explorer) 中的 JavaScript 控制台\n\
    \n## 结论\n\n- 所有流行的 Web 浏览器都支持在 HTML 文档中使用 `<script>` 标签在渲染 HTML 文档时执行 JavaScript\
    \ 代码。\n- 所有流行的 Web 浏览器都支持 `DOM`（文档对象模型）`API`（应用程序接口），允许 JavaScript 代码与浏览器及 HTML\
    \ 文档交互。\n- 所有流行的 Web 浏览器都支持事件，在用户与浏览器交互时触发 JavaScript 代码的执行。\n- 所有流行的 Web 浏览器都支持\
    \ `\"javascript:\"` 伪 URL - 在浏览器地址栏中评估 JavaScript 代码。\n- 在 HTML 文档中嵌入 JavaScript\
    \ 代码时，不应在 JavaScript 代码内部任何地方直接使用 `</script>`。\n- JavaScript 代码可以存储在外部文件中并链接到任何\
    \ HTML 文档。\n- 内置对象 `document` 代表嵌入的 HTML 文档，并为你提供操作 HTML 文档的 `DOM`（文档对象模型）`API`。\n\
    - 内置对象 `window` 代表浏览器窗口，并提供属性和方法让你与浏览器窗口交互。\n- 流行的 Web 浏览器都提供了 JavaScript 控制台，允许查看执行错误和日志消息。它还允许你运行\
    \ JavaScript 语句与 Web 文档交互。\n\n## JavaScript 教程 - Heron 的教程示例\n\n## 支持 JavaScript\
    \ 的 Web 浏览器\n\n#### 浏览器对 JavaScript 的支持\n\n本节简要描述 Web 浏览器如何执行 JavaScript 代码、提供用于文档交互的\
    \ `DOM API` 以及提供触发 JavaScript 代码执行的事件。\n\n典型的 Web 浏览器通常会在 4 个方面提供 JavaScript 支持：\n\
    \n- 支持 HTML 文档中的 `<script>` 标签，在渲染 HTML 文档时执行 JavaScript 代码。\n- 支持 `DOM`（文档对象模型）`API`（应用程序接口），允许\
    \ JavaScript 代码与浏览器及 HTML 文档交互。\n- 支持事件，在用户与浏览器交互时触发 JavaScript 代码的执行。\n- 支持 `\"\
    javascript:\"` 伪 URL - 在浏览器地址栏中评估 JavaScript 代码。\n\n让我们用一个简单的 JavaScript 示例来说说明这些领域：\n\
    \n```html\n <html>\n<!-- DOM_and_Event.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>DOM and Event</title>\n<script type=\"\
    text/javascript\">\nvar colorID = 0;\nfunction changeColor() {\n   if (colorID\
    \ == 0 )\n      document.body.bgColor = \"lightgrey\";\n   else if (colorID ==\
    \ 1 )\n      document.body.bgColor = \"lightblue\";\n   else if (colorID == 2\
    \ )\n      document.body.bgColor = \"lightgreen\";\n   else if (colorID == 3 )\n\
    \      document.body.bgColor = \"lightyellow\";\n   colorID = (colorID+1)%4;\n\
    }\n</script>\n</head>\n<body>\n<p>\n<script type=\"text/javascript\">\n   document.write('Hello\
    \ World!');\n</script>\n</p>\n<form>\n  <input type=\"button\" value=\"Click to\
    \ change background color\"\n   onClick=\"changeColor();\"/>\n</form>\n<p>Want\
    \ to know the color code? \n<a href=\"javascript:alert(document.body.bgColor)\"\
    >Click here.</a>\n</p>\n</body>\n</html>\n```\n\n在 Web 浏览器中运行此 JavaScript 示例，并点击更改颜色按钮。每当你点击按钮时，浏览器都会改变页面的背景颜色。\n\
    \n如果你想知道当前背景色的代码值，可以点击页面附近的超链接。\n\n现在再次查看 JavaScript 示例。浏览器确实在 4 个方面提供了支持：\n\n\
    1. 在渲染 HTML 文档时执行包含在 `\"script\"` 标签中的 JavaScript 代码：\n\n```html\n <script type=\"\
    text/javascript\">\n   document.write('Hello World!');\n</script>\n```\n\n2. 将\
    \ `\"document\"` 对象作为 `DOM API` 的一部分，允许 JavaScript 代码与 HTML 文档交互：\n\n```javascript\n\
    \ document.write('Hello World!');\n   document.body.bgColor = \"lightgrey\";\n\
    \   ...\n```\n\n3. 提供 `\"onClick\"` 事件以允许执行 JavaScript 代码：\n\n```html\n <input\
    \ type=\"button\" value=\"Click to change background color\"\n   onClick=\"changeColor();\"\
    />\n```\n\n4. 执行包含在 `\"javascript:\"` 伪 URL 中的 JavaScript 代码。\n\n```html\n <a\
    \ href=\"javascript:alert(document.body.bgColor)\">Click here.</a>\n```\n\n##\
    \ JavaScript 教程 - Heron 的教程示例\n\n## 支持 JavaScript 的 Web 浏览器\n\n#### 使用 HTML \"\
    script\" 标签包含 JavaScript 代码\n\n本节简要描述如何使用 `'script'` 标签将 JavaScript 代码包含到 HTML\
    \ 文档中。提供了一个调用 `'head'` 标签中定义函数的教程示例。\n\nJavaScript 代码的设计初衷主要是由客户端系统的 Web 浏览器执行。因此，JavaScript\
    \ 代码需要嵌入 HTML 文档中以便传递给浏览器。\n\nHTML 文档语言标准支持 `\"script\"` 标签，允许你在 HTML 文档中包含 JavaScript\
    \ 代码。`\"script\"` 标签的语法如下：\n\n```html\n <script type=\"text/javascript\" ...>\n\
    \   ... JavaScript 语句 ...\n</script>\n```\n\n在单个 HTML 文档中，可以将多个带有 JavaScript 代码的\
    \ `\"script\"` 标签放置在不同的位置。`\"script\"` 标签的确切位置和关系由以下简单规则描述：\n\n- `\"script\"`\
    \ 标签可以放置在 `\"head\"` 标签内部。\n- `\"script\"` 标签可以放置在许多块级标签内部，如 `\"body\"`、`p`、`pre`、`div`\
    \ 等。\n- `\"script\"` 标签可以放置在许多行内标签内部，如 `\"strong\"`、`em`、`span` 等。\n- 包含在 `\"\
    head\"` 标签内 `\"script\"` 标签中的 JavaScript 代码将在网页主体处理之前执行。\n- 包含在块级和行内标签内 `\"script\"\
    ` 标签中的 JavaScript 代码将在网页主体处理期间执行。\n- 包含在 `\"script\"` 标签中的 JavaScript 代码将按照它们在\
    \ HTML 文档中出现的顺序执行。\n- 来自所有 `\"script\"` 标签的 JavaScript 代码将被视为同一个执行会话，就像它们包含在单个\
    \ `\"script\"` 标签中一样。\n\n基于这些规则，我们可以在文档的 `\"head\"` 标签中定义用户函数，稍后在同一文档的 `\"pre\"\
    ` 标签中调用它。这是一个显示这种有趣行为的简单教程示例：\n\n```html\n <html>\n<!-- Hello_World_Head.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>printHello()\
    \ Function in the \"head\" Tag</title>\n<script type=\"text/javascript\">\nfunction\
    \ printHello() {\n   document.write('Hello World!');\n}\n</script>\n</head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   printHello();\n</script>\n\
    </pre>\n</body>\n</html>\n```\n\n当然，这个示例 JavaScript 页面的输出将是页面上的简单文本：“Hello World!”\n\
    \n## JavaScript 教程 - Heron 的教程示例\n\n## 支持 JavaScript 的 Web 浏览器\n\n#### type=\"\
    text/javascript\" 或 language=\"JavaScript\"\n\n本节描述了 `type='text/javascript'`\
    \ 或 `language='JavaScript'` 属性的区别。\n\n在使用 `<script>` 标签在 HTML 文档中嵌入脚本代码时，可以通过多种方式指定脚本语言：\n\
    \n1. 仅使用 `type=\"text/javascript\"` 属性 - 浏览器将脚本代码作为 JavaScript 执行：\n\n```html\n\
    \ <script type=\"text/javascript\">\n   ... JavaScript 代码 ...\n</script>\n```\n\
    \n2. 仅使用 `language=\"JavaScript\"` 属性 - 浏览器将脚本代码作为 JavaScript 执行：\n\n```html\n\
    \ <script language=\"JavaScript\">\n   ... JavaScript 代码 ...\n</script>\n```\n\
    \n3. 仅使用 `language=\"JavaScript1.8\"` 属性 - 只有当浏览器支持 JavaScript 1.7 版本时，才会将脚本代码作为\
    \ JavaScript 执行：\n\n```html\n <script language=\"JavaScript1.8\">\n   ... JavaScript\
    \ 代码 ...\n</script>\n```\n\n"
- fmt: "\n# 4. Using type=\"text/javascript\" and language=\"JavaScript1.8\" attributes\
    \ - The Web browser will execute the script code JavaScript, and `language=\"\
    JavaScript1.8\"` attribute is ignored.\n\n```html\n <script type=\"text/javascript\"\
    \ language=\"JavaScript1.8\">\n   ... JavaScript code ...\n</script>\n```\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web\
    \ Browser Supporting JavaScript](#part0048.xhtml)\n\n∟JavaScript Version Supported\
    \ by Browsers\n\nThis section describes the differences `type='text/javascript'`\
    \ or `language='JavaScript'` attributes.\n\nIf you want to test which JavaScript\
    \ version is supported by a Web browser, you can use the following script example:\n\
    \n```\n <html>\n<!-- JavaScript_Version_Test.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>JavaScript Version Test</title>\n\
    <script type=\"text/javascript\">\n   version = \"Unknown\";\n</script>\n<script\
    \ language=\"JavaScript1.1\">\n   version = \"JavaScript1.1\";\n</script>\n<script\
    \ language=\"JavaScript1.2\">\n   version = \"JavaScript1.2\";\n</script>\n<script\
    \ language=\"JavaScript1.3\">\n   version = \"JavaScript1.3\";\n</script>\n<script\
    \ language=\"JavaScript1.4\">\n   version = \"JavaScript1.4\";\n</script>\n<script\
    \ language=\"JavaScript1.5\">\n   version = \"JavaScript1.5\";\n</script>\n<script\
    \ language=\"JavaScript1.6\">\n   version = \"JavaScript1.6\";\n</script>\n<script\
    \ language=\"JavaScript1.7\">\n   version = \"JavaScript1.7\";\n</script>\n<script\
    \ language=\"JavaScript1.8\">\n   version = \"JavaScript1.8\";\n</script>\n</head>\n\
    <body>\n<p>Version supported: \n<script type=\"text/javascript\">\n   document.writeln(version);\n\
    </script>\n</p>\n</body>\n</html>\n```\n\nHere is my test result:\n\n```\n Google\
    \ Chrome: JavaScript1.7\nApple Safari: JavaScript1.7\nMozilla Firefox: JavaScript1.5\
    \ \nInternet Explorer 11: JavaScript1.3 \n```\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n∟Including 'script' Tags in String Literals\n\nThis section provides a tutorial\
    \ example showing the issue of including 'script' tags in string literals in HTML\
    \ document.\n\nAs we learned from the previous section, JavaScript codes must\
    \ be included in \"script\" tags in HTML documents like: `<script ...> JavaScript\
    \ code </script>`. This put an extra restriction on the JavaScript code:\n\n*Never\
    \ include `</script>` directly any where in your JavaScript code.*\n\nIf you use\
    \ `</script>` directly in your JavaScript code, it will cause the Web browser\
    \ or server to end your JavaScript code prematurely and cause execution errors.\
    \ Here is a tutorial example of including `</script>` directly:\n\n```html\n <html>\n\
    <!-- Escape_Script_Tag.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head><title>Escaping Script Tags</title></head>\n<body><pre>\n<script type=\"\
    text/javascript\">\n   document.writeln(\"Question: How to use the <script> tag?\"\
    );\n   document.writeln(\"Answer: <script>...Script Code...</script>\");\n   document.writeln(\"\
    Rate this answer: 1 | 2 | 3 | 4 | 5\");\n</script>\n</pre></body>\n</html>\n```\n\
    \nIf you run this example script in a browser, you will get:\n\n```\n \");\n \
    \  document.writeln(\"Rate this answer: 1 | 2 | 3 | 4 | 5\");\n```\n\nSurprised?\
    \ Not really. Here is what happened when the browser processes this HTML document:\n\
    \n*   When the browser reaches the `</script>` tag included in the string literal\
    \ in the `document.writeln()` statement, it will end the JavaScript code.\n* \
    \  The prematurely ended JavaScript code will not write anything to the HTML document,\
    \ because the last statement is incomplete.\n*   The rest of the JavaScript code\
    \ after the `</script>` will be processed as static text of the HTML document.\
    \ This is why it is displayed in the browser window.\n\nSee the next section on\
    \ how to fix this problem.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n∟Escaping 'script'\
    \ Tags in String Literals\n\nThis section provides a tutorial example on how to\
    \ use escape character in 'script' tags to prevent browser prematurely end embedded\
    \ JavaScript code.\n\nNow let's try to fix the problem we found in the previous\
    \ section.\n\nThe first fix is to use the backslash character (`\\`) to escape\
    \ (`/`) in the `</script>` tag. This extra backslash will stop the browser to\
    \ recognize this tag as the end of JavaScript code. At the same time, JavaScript\
    \ engine will ignore this backslash and evaluate the string literal in the same\
    \ way as without the extra backslash.\n\nHere is the revised HTML document with\
    \ the extra backslash character:\n\n```html\n <html>\n<!-- Escape_Script_Tag_Backslash.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Escaping\
    \ Script Tags</title></head>\n<body><pre>\n<script type=\"text/javascript\">\n\
    \   document.writeln(\"Question: How to use the <script> tag?\");\n   document.writeln(\"\
    Answer: <script>...Script Code...<\\/script>\");\n   document.writeln(\"Rate this\
    \ answer: 1 | 2 | 3 | 4 | 5\");\n</script>\n</pre></body>\n</html>\n```\n\nIf\
    \ you run this example script in a browser, you will get:\n\n```\n Question: How\
    \ to use the \nRate this answer: 1 | 2 | 3 | 4 | 5\n```\n\nBetter? Yes. But this\
    \ is still not what we expected. Here is what happened when the browser processes\
    \ this HTML document:\n\n*   The browser correctly skipped the `<\\/script>` and\
    \ reached the real end of the JavaScript code.\n*   The entire JavaScript code\
    \ is executed correctly without any error.\n\nIn another word, there is no code\
    \ error in the JavaScript code now. The execution of the JavaScript code inserted\
    \ the following content into the `\"document\"` object:\n\n```\n Question: How\
    \ to use the <script> tag:\nAnswer: <script>...Script Code...<\\/script>\nRate\
    \ this answer: 1 | 2 | 3 | 4 | 5\n```\n\nWhen the browser renders this content,\
    \ it will treat \"script\" tags as HTML tags, causing some text not showing on\
    \ the final page.\n\nSee the next section on how to protect \"script\" tags in\
    \ HTML documents.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n∟Using HTML Entities\
    \ to Protect HTML Tags\n\nThis section provides a tutorial example on how to use\
    \ HTML entities `&lt;` and `&gt;` to protext HTML tags.\n\nTo completely resolve\
    \ the problem we saw in the previous section, we need to use HTML entities to\
    \ replace `<` and `>`, if you want some HTML tags to be displayed as page content.\n\
    \nHere is the revised HTML document using `&lt;` and `&gt;` entities:\n\n```html\n\
    \ <html>\n<!-- Escape_Script_Tag_HTML_Entity.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Escaping Script Tags</title></head>\n\
    <body><pre>\n<script type=\"text/javascript\">\n   document.writeln(\"Q: How to\
    \ use the &lt;script&gt; tag?\");\n   document.writeln(\"A: &lt;script&gt;...Code...&lt;\\\
    /script&gt;\");\n   document.writeln(\"Rate this answer: 1 | 2 | 3 | 4 | 5\");\n\
    </script>\n</pre></body>\n</html>\n```\n\nIf you run this example script in a\
    \ browser, you will get:\n\n```\n Q: How to use the <script> tag?\nA: <script>...Code...</script>\n\
    Rate this answer: 1 | 2 | 3 | 4 | 5\n```\n\nFinally, we get what we want!\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web\
    \ Browser Supporting JavaScript](#part0048.xhtml)\n\n∟Including JavaScript Codes\
    \ as External Files\n\nThis section provides a quick description of how to save\
    \ JavaScript codes into separate files and include them into HTML documents with\
    \ 'script' tags. A tutorial example is provided on calling a function stored in\
    \ a separate JavaScript file.\n\nSometime, if you have a large amount of JavaScript\
    \ code that needs to be shared by multiple HTML documents, you can store the JavaScript\
    \ code in a separate file, and use the \"script\" tag to retrieve this tile.\n\
    \nThe syntax of the \"script\" tag to retrieve a separate JavaScript code looks\
    \ like this:\n\n```html\n <script type=\"text/javascript\" src=\"JavaScript_file_URL\"\
    >\n</script>\n```\n\nTo test this feature, I wrote this JavaScript code and saved\
    \ as a file, `Hello_World_Function.js`:\n\n```javascript\n function printHello()\
    \ {\n   document.write('Hello World!');\n}\n```\n"
  raw: "4\\. Using type=\"text/javascript\" and language=\"JavaScript1.8\" attributes\
    \ - The Web browser will execute the script code JavaScript, and language=\"JavaScript1.8\"\
    \ attribute is ignored.\n\n```\n <script type=\"text/javascript\" language=\"\
    JavaScript1.8\">\n   ... JavaScript code ...\n</script>\n```\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n∟JavaScript Version Supported by Browsers\n\nThis section describes the differences\
    \ type='text/javascript' or language='JavaScript' attributes.\n\nIf you want to\
    \ test which JavaScript version is supported by a Web browser, you can use the\
    \ following script example:\n\n```\n <html>\n<!-- JavaScript_Version_Test.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>JavaScript\
    \ Version Test</title>\n<script type=\"text/javascript\">\n   version = \"Unknown\"\
    ;\n</script>\n<script language=\"JavaScript1.1\">\n   version = \"JavaScript1.1\"\
    ;\n</script>\n<script language=\"JavaScript1.2\">\n   version = \"JavaScript1.2\"\
    ;\n</script>\n<script language=\"JavaScript1.3\">\n   version = \"JavaScript1.3\"\
    ;\n</script>\n<script language=\"JavaScript1.4\">\n   version = \"JavaScript1.4\"\
    ;\n</script>\n<script language=\"JavaScript1.5\">\n   version = \"JavaScript1.5\"\
    ;\n</script>\n<script language=\"JavaScript1.6\">\n   version = \"JavaScript1.6\"\
    ;\n</script>\n<script language=\"JavaScript1.7\">\n   version = \"JavaScript1.7\"\
    ;\n</script>\n<script language=\"JavaScript1.8\">\n   version = \"JavaScript1.8\"\
    ;\n</script>\n</head>\n<body>\n<p>Version supported: \n<script type=\"text/javascript\"\
    >\n   document.writeln(version);\n</script>\n</p>\n</body>\n</html>\n```\n\nHere\
    \ is my test result:\n\n```\n Google Chrome: JavaScript1.7\nApple Safari: JavaScript1.7\n\
    Mozilla Firefox: JavaScript1.5 \nInternet Explorer 11: JavaScript1.3 \n```\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web\
    \ Browser Supporting JavaScript](#part0048.xhtml)\n\n∟Including 'script' Tags\
    \ in String Literals\n\nThis section provides a tutorial example showing the issue\
    \ of including 'script' tags in string literals in HTML document.\n\nAs we learned\
    \ from the previous section, JavaScript codes must be included in \"script\" tags\
    \ in HTML documents like: <script ...> JavaScript code </script>. This put an\
    \ extra restriction on the JavaScript code:\n\n*Never include </script> directly\
    \ any where in your JavaScript code.*\n\nIf you use </script> directly in your\
    \ JavaScript code, it will cause the Web browser or server to end your JavaScript\
    \ code prematurely and cause execution errors. Here is a tutorial example of including\
    \ </script> directly:\n\n```\n <html>\n<!-- Escape_Script_Tag.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Escaping Script\
    \ Tags</title></head>\n<body><pre>\n<script type=\"text/javascript\">\n   document.writeln(\"\
    Question: How to use the <script> tag?\");\n   document.writeln(\"Answer: <script>...Script\
    \ Code...</script>\");\n   document.writeln(\"Rate this answer: 1 | 2 | 3 | 4\
    \ | 5\");\n</script>\n</pre></body>\n</html>\n```\n\nIf you run this example script\
    \ in a browser, you will get:\n\n```\n \");\n   document.writeln(\"Rate this answer:\
    \ 1 | 2 | 3 | 4 | 5\");\n```\n\nSurprised? Not really. Here is what happened when\
    \ the browser processes this HTML document:\n\n*   When the browser reaches the\
    \ </script> tag included in the string literal in the document.writeln() statement,\
    \ it will end the JavaScript code.\n\n*   The prematurely ended JavaScript code\
    \ will not write anything to the HTML document, because the last statement is\
    \ incomplete.\n\n*   The rest of the JavaScript code after the </script> will\
    \ be processed as static text of the HTML document. This is why it is displayed\
    \ in the browser window.\n\nSee the next section on how to fix this problem.\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web\
    \ Browser Supporting JavaScript](#part0048.xhtml)\n\n∟Escaping 'script' Tags in\
    \ String Literals\n\nThis section provides a tutorial example on how to use escape\
    \ character in 'script' tags to prevent browser prematurely end embedded JavaScript\
    \ code.\n\nNow let's try to fix the problem we found in the previous section.\n\
    \nThe first fix is to use the backslash character (\\) to escape (/) in the </script>\
    \ tag. This extra backslash will stop the browser to recognize this tag as the\
    \ end of JavaScript code. At the same time, JavaScript engine will ignore this\
    \ backslash and evaluate the string literal in the same way as without the extra\
    \ backslash.\n\nHere is the revised HTML document with the extra backslash character:\n\
    \n```\n <html>\n<!-- Escape_Script_Tag_Backslash.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Escaping Script Tags</title></head>\n\
    <body><pre>\n<script type=\"text/javascript\">\n   document.writeln(\"Question:\
    \ How to use the <script> tag?\");\n   document.writeln(\"Answer: <script>...Script\
    \ Code...<\\/script>\");\n   document.writeln(\"Rate this answer: 1 | 2 | 3 |\
    \ 4 | 5\");\n</script>\n</pre></body>\n</html>\n```\n\nIf you run this example\
    \ script in a browser, you will get:\n\n```\n Question: How to use the \nRate\
    \ this answer: 1 | 2 | 3 | 4 | 5\n```\n\nBetter? Yes. But this is still not what\
    \ we expected. Here is what happened when the browser processes this HTML document:\n\
    \n*   The browser correctly skipped the <\\/script> and reached the real end of\
    \ the JavaScript code.\n\n*   The entire JavaScript code is executed correctly\
    \ without any error.\n\nIn another word, there is no code error in the JavaScript\
    \ code now. The execution of the JavaScript code inserted the following content\
    \ into the \"document\" object:\n\n```\n Question: How to use the <script> tag:\n\
    Answer: <script>...Script Code...<\\/script>\nRate this answer: 1 | 2 | 3 | 4\
    \ | 5\n```\n\nWhen the browser renders this content, it will treat \"script\"\
    \ tags as HTML tags, causing some text not showing on the final page.\n\nSee the\
    \ next section on how to protect \"script\" tags in HTML documents.\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting\
    \ JavaScript](#part0048.xhtml)\n\n∟Using HTML Entities to Protect HTML Tags\n\n\
    This section provides a tutorial example on how to use HTML entities &lt; and\
    \ &gt; to protext HTML tags\n\nTo completely resolve the problem we saw in the\
    \ previous section, we need to use HTML entities to replace '<' and '>', if you\
    \ want some HTML tags to be displayed as page content.\n\nHere is the revised\
    \ HTML document using &lt; and &gt; entities:\n\n```\n <html>\n<!-- Escape_Script_Tag_HTML_Entity.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Escaping\
    \ Script Tags</title></head>\n<body><pre>\n<script type=\"text/javascript\">\n\
    \   document.writeln(\"Q: How to use the &lt;script&gt; tag?\");\n   document.writeln(\"\
    A: &lt;script&gt;...Code...&lt;\\/script&gt;\");\n   document.writeln(\"Rate this\
    \ answer: 1 | 2 | 3 | 4 | 5\");\n</script>\n</pre></body>\n</html>\n```\n\nIf\
    \ you run this example script in a browser, you will get:\n\n```\n Q: How to use\
    \ the <script> tag?\nA: <script>...Code...</script>\nRate this answer: 1 | 2 |\
    \ 3 | 4 | 5\n```\n\nFinally, we get what we want!\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n∟Including JavaScript Codes as External Files\n\nThis section provides a quick\
    \ description of how to save JavaScript codes into separate files and include\
    \ them into HTML documents with 'script' tags. A tutorial example is provided\
    \ on calling a function stored in a separate JavaScript file.\n\nSometime, if\
    \ you have a large amount of JavaScript code that needs to be shared by multiple\
    \ HTML documents, you can store the JavaScript code in a separate file, and use\
    \ the \"script\" tag to retrieve this tile.\n\nThe syntax of the \"script\" tag\
    \ to retrieve a separate JavaScript code looks like this:\n\n```\n <script type=\"\
    text/javascript\" src=\"JavaScript_file_URL\">\n</script>\n```\n\nTo test this\
    \ feature, I wrote this JavaScript code and saved as a file, Hello_World_Function.js:\n\
    \n```\n function printHello() {\n   document.write('Hello World!');\n}\n```"
