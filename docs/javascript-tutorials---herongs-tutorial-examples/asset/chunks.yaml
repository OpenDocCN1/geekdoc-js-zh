    \n∟Inheritance vs. Flattened Views of the API\n\nThis section provides two different\
    \ views of DOM API: Flattened View - Everything is a node, and Inheritance View\
    \ - A hierarchy of inherited interfaces.\n\nThe DOM API provides two different\
    \ approaches to represent an XML/HTML document:\n\n1.\"Objected Oriented\" Approach\
    \ - A document is represented by a collection of linked objects that have different\
    \ interfaces with a hierarchy of inheritance. In other words, the entire DOM API\
    \ can be viewed as a hierarchy of inherited interfaces. This is also called the\
    \ \"Inheritance View of DOM\".\n\nIn this \"Inheritance View of DOM\", you need\
    \ to lean a family of related interfaces:\n\n```\n interface Node\n^\n|- interface\
    \ Document : Node\n|  ^\n|  |- interface HTMLDocument : Document\n|\n|- interface\
    \ Element : Node\n   ^\n   |- interface  HTMLElement : Element\n      ^\n    \
    \  |- interface HTMLHtmlElement : HTMLElement\n      |- interface HTMLHeadElement\
    \ : HTMLElement\n      |- interface HTMLTitleElement : HTMLElement\n      |- interface\
    \ HTMLBodyElement : HTMLElement\n      |- interface HTMLParagraphElement : HTMLElement\n\
    \      |- interface HTMLFormElement : HTMLElement\n      |- interface HTMLImageElement\
    \ : HTMLElement\n      ...\n```\n\n2\\. \"Everything Is a Node\" Approach - A\
    \ document is represented by a tree of objects that have a single interface called\
    \ \"Node\". In other words, the entire DOM API can be viewed as an single interface\
    \ - the Node interface. This is also called the \"Flattened View of DOM\".\n\n\
    In this \"Flattened View of DOM\", you just need to learn one interface, \"Node\"\
    :\n\n```\n interface Node {\n  readonly attribute DOMString        nodeName;\n\
    \           attribute DOMString        nodeValue;\n  readonly attribute unsigned\
    \ short   nodeType;\n  readonly attribute Node             parentNode;\n  readonly\
    \ attribute NodeList         childNodes;\n  readonly attribute NamedNodeMap  \
    \   attributes;\n  readonly attribute Document         ownerDocument;\n  Node\
    \               removeChild(in Node oldChild);\n  Node               appendChild(in\
    \ Node newChild);\n  ...\n};\n```\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[W3C's Document Object Model (DOM) Specifications](#part0134.xhtml)\n\
    \n∟A Web Document as A Tree of Different Interfaces\n\nThis section provides a\
    \ tutorial example of JavaScript to show different DOM interfaces for different\
    \ elements used in a Web page. This shows the object oriented view of DOM API.\n\
    \nWe know that a Web page, a HTML document, is a tree of elements (ignoring attributes\
    \ for a moment). From an object oriented point of view, different elements are\
    \ represented by different types of objects, or interfaces in DOM term.\n\nNow\
    \ let's walk through the tree and figure out which DOM interface is supported\
    \ on each element with a simple JavaScript example:\n\n```\n <html>\n<!-- DOM_API_Object_Oriented_View.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>DOM\
    \ API - Object Oriented View</title>\n<style type=\"text/css\">body {background-color:\
    \ #aaaaff}</style>\n<script type=\"text/javascript\">\nfunction showInterface(node,\
    \ prefix, out) {\n   out += prefix+node.constructor+\"\\n\";\n   var list = node.childNodes;\n\
    \   for (var i=0; i<list.length; i++) {\n      out = showInterface(list.item(i),\
    \ prefix+\"   \", out);\n   }\n   return out;\n}\nfunction show() {\n   var text\
    \ = document.createTextNode(showInterface(document,\"\",\"\"));\n   var display\
    \ = document.getElementById(\"display\");\n   display.replaceChild(text,display.firstChild);\n\
    }\n</script>\n</head>\n<body>\nThis first text is in the \"body\" element directly.\n\
    <p>This second text is in a \"p\" element.</p>\n<form action=\"nothing\" method=\"\
    get\">\n   <input type=\"button\" value=\"View\" onClick=\"show();\"/>\n</form>\n\
    <pre id=\"display\">\nClick the View button to see interface names...\n</pre>\n\
    </body>\n</html>\n```\n\nNotice that I am using a special property \"node.constructor\"\
    \ to get the name of the constructor function name, which is also the name of\
    \ the JavaScript class that implements the DOM interface. \"node.constructor\"\
    \ is not valid DOM attribute.\n\nI have tried to use the DOM attribute \"node.className\"\
    \ to get the implementation class name. But Firefox returns \"undefined\".\n\n\
    In you run this JavaScript page in Firefox 18 and click the \"View\" button, you\
    \ will get a nice tree list of DOM interfaces used in this Web page:"
