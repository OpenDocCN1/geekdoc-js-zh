    \ elements are indexed. Elements can be stored and retrieved by indexes.\n\n*\
    \   Array's index starts from 0\\. In other words, index 0 represents the first\
    \ element.\n\n*   The size of an array is not statically defined. It can be dynamically\
    \ expanded or truncated.\n\n*   Array's elements do not have to be the same data\
    \ type.\n\n*   Several methods are provided on array objects allowing you to manipulate\
    \ arrays directly.\n\nHere is a tutorial example JavaScript that shows you some\
    \ of the features mentioned above:\n\n```\n <html>\n<!-- Array_Features.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Array\
    \ Features</title></head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n\
    \   // Creating a new array of mixed data types\n   var account = [\"Saving\"\
    , 999.99, true];\n\n   // Store new value to the array\n   account[2] = false;\n\
    \n   // Retrieving an element\n   document.write(\"Account type: \"+account[0]+\"\
    \\n\");\n\n   // Calling an array method\n   account.push(5.25/100);\n   document.write(\"\
    Interest rate: \"+account[3]*100+\"%\\n\");\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of this sample JavaScript is:\n\n```\n Account type: Saving\n\
    Interest rate: 5.25%\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Creating, Accessing, and Manipulating Arrays](#part0029.xhtml)\n\n∟Creating\
    \ an Array Object\n\nThis section provides a tutorial example on how to create\
    \ array objects in JavaScript.\n\nThere are 3 ways to create a new array object:\n\
    \n1\\. Using the array literal - A new array object can be created by using the\
    \ array literal syntax of [exp1, exp2, ...]. For example:\n\n```\n var colors\
    \ = [\"Red\", \"Green\", \"Blue\"];\n   var account = [\"Saving\", 999.99, true];\n\
    ```\n\n2\\. Calling the array constructor - A new array object can be created\
    \ by calling the array constructor of (new Array(exp1, exp, ...)). For example:\n\
    \n```\n var colors = new Array(\"Red\", \"Green\", \"Blue\");\n   var account\
    \ = new Array(\"Saving\", 999.99, true);\n```\n\n3\\. Calling the array function\
    \ - A new array object can be created by calling the array function of (array(exp1,\
    \ exp, ...)). For example:\n\n```\n var colors = Array(\"Red\", \"Green\", \"\
    Blue\");\n   var account = Array(\"Saving\", 999.99, true);\n```\n\nHere is a\
    \ tutorial example JavaScript that shows you how to create new array objects:\n\
    \n```\n <html>\n<!-- Create_Arrays.html\n   Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n-->\n<head><title>Create Arrays</title></head>\n<body>\n<pre>\n\
    <script type=\"text/javascript\">\n\n   // Using array literal\n   var my_saving\
    \ = [\"Saving\", 999.99, true];\n\n   // Using array constructor\n   var my_checking\
    \ = new Array(\"Checking\", 9.99, true);\n\n   // Using array function\n   var\
    \ my_stock = Array(\"Stock\", 99999.99, true);\n\n   // Creating an empty array\n\
    \   var new_account = [];\n\n   document.write(my_checking[0]+\": \"+my_checking[1]+\"\
    \\n\");\n   document.write(my_saving[0]+\": \"+my_saving[1]+\"\\n\");\n   document.write(my_stock[0]+\"\
    : \"+my_stock[1]+\"\\n\");\n   document.write(new_account[0]+\": \"+new_account[1]+\"\
    \\n\");\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output of this sample\
    \ JavaScript is:\n\n```\n Checking: 9.99\nSaving: 999.99\nStock: 99999.99\nundefined:\
    \ undefined\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Creating, Accessing, and Manipulating Arrays](#part0029.xhtml)\n\n∟Accessing\
    \ Array Elements with Indexes\n\nThis section provides a tutorial example on how\
    \ to access array elements with element indexes.\n\nArray elements can be access\
    \ with array indexes with several simple rules:\n\n*   Like many other programming\
    \ languages, an array element can be accessed with the array element syntax of\
    \ array_name[index].\n\n*   An array index starts with 0.\n\n*   The length of\
    \ an array is defined as the highest index of all elements plus 1.\n\n*   There\
    \ is no index-out-of-bound exception in JavaScript.\n\n*   If an index greater\
    \ than the array length is specified when retrieving an array element, the \"\
    undefined\" value will be returned.\n\n*   If an index greater than the array\
    \ length is specified when storing an array element, the array will be expanded\
    \ to store the element at the specified index.\n\nHere is a tutorial example JavaScript\
    \ that shows you how to store or retrieve array elements with element indexes:"
