    \n##  定义你自己的对象类型\n\n本章提供了关于如何定义你自己的对象类型的介绍和教程示例。主题包括定义构造函数；向对象或构造函数原型添加属性和方法；遍历属性和方法；使用\
    \ `'instanceof'` 和 `'typeof'` 运算符。\n\n*   基于原型的面向对象编程风格\n*   JavaScript 中基于原型的编程特性\n\
    *   定义对象构造函数\n*   向对象添加属性和方法\n*   \"for ... in\" 和 \"for each ... in\" 语句\n* \
    \  构造函数对象对象的 \"prototype\" 属性\n*   \"instanceof\" 运算符 - 确定对象类型\n*   \"typeof\"\
    \ 运算符和数据类型\n\n### 结论：\n\n*   JavaScript 是一种基于原型的编程语言，支持对象的封装、多态和继承。\n*   JavaScript\
    \ 没有类定义。\n*   对象通过调用构造函数创建：`New Abc()`。\n*   可以在构造函数中添加对象属性和方法。\n*   也可以向单个实例添加对象属性和方法。\n\
    *   可以使用 `for (var item in object_name)` 和 `for each (var value in object_name)`\
    \ 语句来遍历对象中的属性和方法。\n*   构造函数本身是一个对象，它有一个名为 `\"prototype\"` 的属性，指向原型定义。\n\n# JavaScript\
    \ 教程 - Herong 的教程示例\n\n## ∟定义你自己的对象类型](#part0084.xhtml)\n\n### 基于原型的面向对象编程风格\n\
    \n本节提供了面向对象编程和基于原型的编程风格的快速描述。\n\n面向对象编程有三个主要目标：\n\n*   **封装**：在接口后隐藏对象功能细节的能力——换句话说，封装是向发送消息的对象隐藏对象功能细节的能力。\n\
    *   **继承**：派生类型对象从父类型继承属性的能力。\n*   **多态**：相同类型的两个对象以自己的行为响应相同接口的能力。\n\n这些目标可以通过两种不同的编程风格实现：\n\
    \n*   **基于类的编程**：对象通过基于指定类的实例化过程创建，该类静态地定义了结果对象的结构和行为。\n*   **基于原型的编程**：对象通过基于另一个对象作为原型的克隆过程创建，该原型可以被动态修改。\n\
    \nJavaScript 是一种基于原型的编程语言，支持如下所述的封装、多态和继承：\n\n*   封装：对象的功能细节隐藏在属性和方法内部。\n*   继承：父类型的属性和方法通过原型对象被继承。\n\
    *   多态：继承的属性和方法可以被特定于该对象的重写。\n\n请查看本章的其他章节，获取有关 JavaScript 基于原型的编程特性的详细描述和教程示例。\n\
    \n# JavaScript 教程 - Herong 的教程示例\n\n## ∟定义你自己的对象类型\n\n### ∟JavaScript 中基于原型的编程特性\n\
    \n本节提供了 JavaScript 中一些基于原型的编程特性的列表，例如构造函数、原型对象、对象属性和方法。\n\n正如我在上一节提到的，JavaScript\
    \ 是一种基于原型的编程语言。它通过许多特性支持面向对象编程：\n\n*   没有类定义。JavaScript 不使用类。\n*   对象是从构造函数创建的。\n\
    *   每个构造函数代表一种唯一的对象类型。\n*   构造函数可以为从该构造函数创建的所有对象定义属性和方法。\n*   每个构造函数都可以与一个原型对象关联。\n\
    *   对象会自动继承与其构造函数关联的原型对象的属性和方法。\n*   每个对象都可以有它自己的属性和方法。\n*   继承的属性和方法可以被特定对象或原型对象重写。\n\
    *   有一个名为 `Object()` 的内置构造函数，它为所有其他对象类型提供了基础对象类型。\n*   所有函数实际上都是从基础构造函数 `Function()`\
    \ 创建的对象。\n*   所有类型的对象都继承了由基础构造函数 `Object()` 定义的属性和方法。\n\n"
- fmt: "\n- There are several major built-in objects, representing constructor functions,\
    \ including `Array()`, `Boolean()`, `Date()`, `Error()`, `Function()`, `Math()`,\
    \ `Number()`, `Object()`, `RegExp()`, `String()`.\n- There seems to be no multi-inheritance\
    \ support in JavaScript.\n- Private properties and methods are supported in JavaScript\
    \ in a special way.\n\nSeveral tutorial examples will be provided later in this\
    \ chapter to illustrate some of those features.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n### ∟Defining Your Own Object Types](#part0084.xhtml)\n\
    \n## Defining Object Constructor Functions\n\nThis section provides a quick description\
    \ on defining object constructor functions. A tutorial example is provided on\
    \ creating a `'Book'` constructor with 3 properties and 1 method.\n\nThe first\
    \ thing to learn about prototype-based programming style in JavaScript is the\
    \ constructor function. When writing a constructor function, we need to remember:\n\
    \n- The constructor function name will be the object type name. So select a good\
    \ name for the constructor function.\n- In the constructor function, `this` keyword\
    \ can be used to represent the object to be constructed.\n- Properties should\
    \ be added in the constructor function with assignment expressions as `this.property_name\
    \ = initial_value`.\n- Constructor function should take some parameters to initialize\
    \ properties.\n- Methods should be added in the constructor function with assignment\
    \ expressions as `this.method_name = function_name`, where `function_name` refers\
    \ to an existing function.\n- Don't use any `return` statement in the constructor\
    \ function. The return value will be ignored when it is called as an object constructor\
    \ with the `new` operator.\n\nHere is a tutorial example that defines a constructor\
    \ function called `Book(...)`, which defines 3 properties and 1 method:\n\n```html\n\
    \ <html>\n<!-- Prototype_Constructor_Function.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Defining Object Constructor Functions</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n// Defining the constructor\
    \ function for a new object type\nfunction Book(title, author) {\n   document.writeln(\"\
    \\nConstructing a \\\"Book\\\" object...\");\n   this.title = title;\n   this.author\
    \ = author;\n   this.price = undefined;\n   this.getDesc = getDescription;\n}\n\
    \n// Defining a function to be used as a method\nfunction getDescription() {\n\
    \   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // Creating\
    \ an object of \"Book\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"\
    Herong Yang\");\n   document.writeln(\"\\nChecking the \\\"Book\\\" object\");\n\
    \   document.writeln(\"   Type: \"+(typeof myBook));\n   document.writeln(\" \
    \  Instance of \\\"Book\\\": \"\n      +(myBook instanceof Book));\n\n   // Testing\
    \ properties and methods\n   document.writeln(\"   myBook.title: \"+myBook.title);\n\
    \   document.writeln(\"   myBook.author: \"+myBook.author);\n   document.writeln(\"\
    \   myBook.price: \"+myBook.price);\n   document.writeln(\"   myBook.getDesc():\
    \ \"+myBook.getDesc());\n\n   // Trying to call a constructor function as a normal\
    \ function\n   Book(\"JavaScript Cookbook\", \"Yosef Cohen\");\n</script>\n</pre>\n\
    </body>\n</html>\n```\n\nThe output of the tutorial example is printed below:\n\
    \n```\n Constructing a \"Book\" object...\n\nChecking the \"Book\" object\n  \
    \ Type: object\n   Instance of \"Book\": true\n   myBook.title: JavaScript Tutorials\n\
    \   myBook.author: Herong Yang\n   myBook.price: undefined\n   myBook.getDesc():\
    \ \"JavaScript Tutorials\" by Herong Yang\n\nConstructing a \"Book\" object...\n\
    ```\n\nNotice that the last test statement proves that a constructor function\
    \ is just a normal function, and you can call it directly. But calling a constructor\
    \ function directly will not produce any result.\n\nAs a quick summary:\n\n- Constructor\
    \ equals to function. A constructor is a function. And a function is a constructor.\n\
    - A constructor can be used to create a new object with the `new` operator.\n\
    - Any constructor can be called to execute as a function.\n- Any function can\
    \ be used to create objects as a constructor.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n### ∟Defining Your Own Object Types](#part0084.xhtml)\n\
    \n## Adding Properties and Methods to Objects\n\nThis section provides a quick\
    \ description of adding properties and methods to objects only. A tutorial example\
    \ is provided on adding 1 extra property and 1 extra method to 1 object only.\n\
    \nAfter an object has been created from the constructor function, additional properties\
    \ and methods can be added to this object only, using these formats:\n\n```\n\
    \ object_name.property_name = initial_value;\n   object_name.method_name = function_name;\n\
    ```\n\nHere is tutorial example that creates two objects from `Book()`, and adds\
    \ 1 extra property and 1 extra method to object `myBook` only:\n\n```html\n <html>\n\
    <!-- Prototype_Add_Property_and_Method.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Adding Additional Properties and Methods\
    \ to Objects</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// Defining the constructor function for a new object type\nfunction Book(title,\
    \ author) {\n   this.title = title;\n   this.author = author;\n   this.price =\
    \ undefined;\n   this.getDesc = getDescription;\n}\n\n// Defining a function to\
    \ be used as a method\nfunction getDescription() {\n   return \"\\\"\"+this.title+\"\
    \\\" by \"+this.author;\n}\n\n   // Creating an object of \"Book\"\n   var myBook\
    \ = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n   var ckBook = new\
    \ Book(\"JavaScript Cookbook\", \"Yosef Cohen\");\n\n   // Adding additional property\
    \ and method to myBook\n   myBook.price = 99.99;\n   myBook.getDesc = getDescription;\n\
    \n   function showObject(object, name) {\n      document.writeln(\"\\nShowing\
    \ object \\\"\"+name+\"\\\\\"\");\n      document.writeln(\"   Own Properties\
    \ and Methods:\");\n      for (var item in object) {\n          document.writeln(\"\
    \      \"+item+\": \"+object[item]);\n      }\n   }\n\n   showObject(myBook, \"\
    myBook\");\n   showObject(ckBook, \"ckBook\");\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of the tutorial example shows that properties defined in the\
    \ constructor function are added to both objects. But properties and methods added\
    \ to object `myBook` are for `myBook` only.\n\n```\n Showing object \"myBook\"\
    \n   Own Properties and Methods:\n      title: JavaScript Tutorials\n      author:\
    \ Herong Yang\n      price: 99.99\n      getDesc: function() {\n    return \"\\\
    \"\" + this.title + \"\\\" by + this.author;\n}\n\nShowing object \"ckBook\"\n\
    \   Own Properties and Methods:\n      title: JavaScript Cookbook\n      author:\
    \ Yosef Cohen\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### ∟Defining Your Own Object Types](#part0084.xhtml)\n\n## \"for ... in\" and\
    \ \"for each ... in\" Statements\n\nThis section provides a quick description\
    \ of two special loop statements for iterating properties and methods of object.\
    \ A tutorial example is provided to show the extra properties and methods of two\
    \ objects of the same type.\n\nJavaScript supports two special loop statements\
    \ that allows you to iterate all properties and methods in an object:\n\n1. A\
    \ `for ... in` statement has the following syntax:\n\n```\nfor (var item in object_name)\
    \ {\n      ... statements with object_name[item] ...\n}\n```\n\nIn this `for ...\
    \ in` statement, the embedded statements will be executed for each properties\
    \ and methods. Variable `item` will contain the current property or method name.\
    \ Expression `object_name[item]` uses the associate array format to retrieve the\
    \ property value.\n\n2. A `for each ... in` statement has the following syntax:\n\
    \n```\nfor each (var value in object_name) {\n      ... statements with value\
    \ ...\n}\n```\n\nIn this `for each ... in` statement, the embedded statements\
    \ will be executed for each properties and methods. Variable `value` will contain\
    \ the value of the current property or the function of the current method.\n\n\
    Here is a tutorial example that use both `for ... in` and `for each ... in` statements\
    \ to loop through all properties and methods:\n"
  raw: "*   There are several major built-in objects, representing constructor functions,\
    \ including \"Array()\", \"Boolean()\", \"Date()\", \"Error()\", \"Function()\"\
    , \"Math()\", \"Number()\", \"Object()\", \"RegExp()\", \"String()\".\n\n*   There\
    \ seems to be no multi-inheritance support in JavaScript.\n\n*   Private properties\
    \ and methods are supported in JavaScript in a special way.\n\nSeveral tutorial\
    \ examples will be provided later in this chapter to illustrate some of those\
    \ features.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Defining Your Own Object Types](#part0084.xhtml)\n\n∟Defining Object Constructor\
    \ Functions\n\nThis section provides a quick description on defining object constructor\
    \ functions. A tutorial example is provided on creating a 'Book' constructor with\
    \ 3 properties and 1 method.\n\nThe first thing to learn about prototype-based\
    \ programming style in JavaScript is the constructor function. When writing a\
    \ constructor function, we need to remember:\n\n*   The constructor function name\
    \ will be the object type name. So select a good name for the constructor function.\n\
    \n*   In the constructor function, \"this\" keyword can be used to represent the\
    \ object to be constructed.\n\n*   Properties should be added in the constructor\
    \ function with assignment expressions as \"this.property_name = initial_value\"\
    .\n\n*   Constructor function should take some parameters to initialize properties.\n\
    \n*   Methods should be added in the constructor function with assignment expressions\
    \ as \"this.method_name = function_name\", where \"function_name\" refers to an\
    \ existing function.\n\n*   Don't use any \"return\" statement in the constructor\
    \ function. The return value will be ignored when it is called as an object constructor\
    \ with the \"new\" operator.\n\nHere is a tutorial example that defines a constructor\
    \ function called \"Book(...)\", which defines 3 properties and 1 method:\n\n\
    ```\n <html>\n<!-- Prototype_Constructor_Function.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Defining Object Constructor Functions</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n// Defining the constructor\
    \ function for a new object type\nfunction Book(title, author) {\n   document.writeln(\"\
    \\nConstructing a \\\"Book\\\" object...\");\n   this.title = title;\n   this.author\
    \ = author;\n   this.price = undefined;\n   this.getDesc = getDescription;\n}\n\
    \n// Defining a function to be used as a method\nfunction getDescription() {\n\
    \   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // Creating\
    \ an object of \"Book\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"\
    Herong Yang\");\n   document.writeln(\"\\nChecking the \\\"Book\\\" object\");\n\
    \   document.writeln(\"   Type: \"+(typeof myBook));\n   document.writeln(\" \
    \  Instance of \\\"Book\\\": \"\n      +(myBook instanceof Book));\n\n   // Testing\
    \ properties and methods\n   document.writeln(\"   myBook.title: \"+myBook.title);\n\
    \   document.writeln(\"   myBook.author: \"+myBook.author);\n   document.writeln(\"\
    \   myBook.price: \"+myBook.price);\n   document.writeln(\"   myBook.getDesc():\
    \ \"+myBook.getDesc());\n\n   // Trying to call a constructor function as a normal\
    \ function\n   Book(\"JavaScript Cookbook\", \"Yosef Cohen\");\n</script>\n</pre>\n\
    </body>\n</html>\n```\n\nThe output of the tutorial example is printed below:\n\
    \n```\n Constructing a \"Book\" object...\n\nChecking the \"Book\" object\n  \
    \ Type: object\n   Instance of \"Book\": true\n   myBook.title: JavaScript Tutorials\n\
    \   myBook.author: Herong Yang\n   myBook.price: undefined\n   myBook.getDesc():\
    \ \"JavaScript Tutorials\" by Herong Yang\n\nConstructing a \"Book\" object...\n\
    ```\n\nNotice that the last test statement proves that a constructor function\
    \ is just a normal function, and you can call it directly. But calling a constructor\
    \ function directly will not produce any result.\n\nAs a quick summary:\n\n* \
    \  Constructor equals to function. A constructor is a function. And a function\
    \ is a constructor.\n\n*   A constructor can be used to create a new object with\
    \ the \"new\" operator.\n\n*   Any constructor can be called to execute as a function.\n\
    \n*   Any function can be used to create objects as a constructor.\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining Your\
    \ Own Object Types](#part0084.xhtml)\n\n∟Adding Properties and Methods to Objects\n\
    \nThis section provides a quick description of adding properties and methods to\
    \ objects only. A tutorial example is provided on adding 1 extra property and\
    \ 1 extra method to 1 object only.\n\nAfter an object has been created from the\
    \ constructor function, additional properties and methods can be added to this\
    \ object only, using these formats:\n\n```\n object_name.property_name = initial_value;\n\
    \   object_name.method_name = function_name;\n```\n\nHere is tutorial example\
    \ that creates two objects from \"Book()\", and adds 1 extra property and 1 extra\
    \ method to object \"myBook\" only:\n\n```\n <html>\n<!-- Prototype_Add_Property_and_Method.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Adding\
    \ Additional Properties and Methods to Objects</title>\n</head>\n<body>\n<pre>\n\
    <script type=\"text/javascript\">\n\n// Defining the constructor function for\
    \ a new object type\nfunction Book(title, author) {\n   this.title = title;\n\
    \   this.author = author;\n}\n\n// Defining a function to be used as a method\n\
    function getDescription() {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n\
    }\n\n   // Creating an object of \"Book\"\n   var myBook = new Book(\"JavaScript\
    \ Tutorials\", \"Herong Yang\");\n   var ckBook = new Book(\"JavaScript Cookbook\"\
    , \"Yosef Cohen\");\n\n   // Adding additional property and method to one object\n\
    \   myBook.price = 99.99;\n   myBook.getDesc = getDescription;\n\n   // Showing\
    \ object properties and methods\n   showObject(myBook, \"myBook\");\n   showObject(ckBook,\
    \ \"ckBook\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\\\
    nShowing object \\\"\"+name+\"\\\"\");\n   document.writeln(\"   Own Properties\
    \ and Methods:\");\n   for (var item in object) {\n      document.writeln(\" \
    \     \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of the tutorial example shows that properties defined in the\
    \ constructor function are added to both objects. But properties and methods added\
    \ to object \"myBook\" are for \"myBook\" only.\n\n```\n Showing object \"myBook\"\
    \n   Own Properties and Methods:\n      title: JavaScript Tutorials\n      author:\
    \ Herong Yang\n      price: 99.99\n      getDesc: function getDescription() {\n\
    \    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\n\nShowing\
    \ object \"ckBook\"\n   Own Properties and Methods:\n      title: JavaScript Cookbook\n\
    \      author: Yosef Cohen\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Defining Your Own Object Types](#part0084.xhtml)\n\n∟\"for ... in\" and \"\
    for each ... in\" Statements\n\nThis section provides a quick description of two\
    \ special loop statements for iterating properties and methods of object. A tutorial\
    \ example is provided to show the extra properties and methods of two objects\
    \ of the same type.\n\nJavaScript supports two special loop statements that allows\
    \ you to iterate all properties and methods in an object:\n\n1\\. A \"for ...\
    \ in\" statement has the following syntax:\n\n```\n for (var item in object_name)\
    \ {\n      ... statements with object_name[item] ... \n   }\n```\n\nIn this \"\
    for ... in\" statement, the embedded statements will be executed for each properties\
    \ and methods. Variable \"item\" will contain the current property or method name.\
    \ Expression \"object_name[item]\" uses the associate array format to retrieve\
    \ the property value.\n\n2\\. A \"for each ... in\" statement has the following\
    \ syntax:\n\n```\n for each (var value in object_name) {\n      ... statements\
    \ with value ... \n   }\n```\n\nIn this \"for each ... in\" statement, the embedded\
    \ statements will be executed for each properties and methods. Variable \"value\"\
    \ will contain the value of the current property or the function of the current\
    \ method.\n\nHere is a tutorial example that use both \"for ... in\" and \"for\
    \ each ... in\" statements to loop through all properties and methods:"
