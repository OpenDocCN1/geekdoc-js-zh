  trans: "\n\n```\n Showing object \"myBook\"\n   Instance of Object: true\n   Instance\
    \ of Function: false\n   Instance of Book: true\n\nShowing object \"Book\"\n \
    \  Instance of Object: true\n   Instance of Function: true\n   Instance of Book:\
    \ false\n\nShowing object \"Book.prototype\"\n   Instance of Object: true\n  \
    \ Instance of Function: false\n   Instance of Book: false\n\nShowing object \"\
    Object\"\n   Instance of Object: true\n   Instance of Function: true\n   Instance\
    \ of Book: false\n\nShowing object \"Object.prototype\"\n   Instance of Object:\
    \ false\n   Instance of Function: false\n   Instance of Book: false\n```\n\n##\
    \ 关于输出的几点有趣说明\n\n- `\"myBook\"` 是一个通过 `Book()` 创建的对象。因此，它是 `\"Book\"` 的实例。\n-\
    \ 但 `\"myBook\"` 也是 `\"Object\"` 的实例，因为 `\"Book\"` 是 `\"Object\"` 的子类型。所有使用的定义的对象类型默认情况下都是基础\
    \ `\"Object\"` 类型的子类型。\n- `\"Book\"` 是一个函数。因此它是 `\"Function\"` 的实例。\n- 但 `\"Book\"\
    ` 也是 `\"Object\"` 的实例，因为 `\"Function\"` 是 `\"Object\"` 的子类型。\n- `\"Book.prototype\"\
    ` 是基础对象类型：`\"Object\"` 的实例。\n- `\"Object\"` 是一个函数。因此它是两个对象类型的实例：`\"Function\"\
    ` 和 `\"Object\"`。\n- 然而 `\"Object.prototype\"`是一个对象。所以它应该是 `\"Object\"` 的实例。但输出显示不是。JavaScript\
    \ 可能为 `\"Object.prototype\"` 分配了一个内部对象类型。\n\nJavaScript 教程 - Herong 的教程示例\n\n\
    ### 定义自己的对象类型\n\n#### \"typeof\" 运算符和数据类型\n\n本节快速介绍了 `typeof` 运算符和 JavaScript\
    \ 支持的数据类型。提供了一个教程示例来列出所有数据类型：数字、字符串、布尔、对象、函数和未定义。\n\n在上一节中，我们学习了如何使用 `instanceof`\
    \ 运算符。但 JavaScript 另一个名为 `typeof` 的运算符，它的工作方式与 `instanceof` 。以下是它们的对比：\n\n1. `object_name\
    \ instanceof constructor_name` 如果指定的对象是指定类型的实例，则返回 true。\n2. `typeof expression`\
    \ 返回指定表达式的数据类型名称。记住 JavaScript 支持几种数据类型：`\"number\"`、`\"string\"`、`\"boolean\"\
    `、`\"object\"`、`\"function\"` 和 `\"\"undefined\"`。\n\n为了向你展示这些数据类型以及如何使用 `typeof`，我写了这个教程示例：\n\
    \n```html\n <html>\n<!-- Prototype_typeof_Operator.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>\"typeof\" 运算符</title>\n</head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   // 创建一个 \"Book\" 对象\n   var\
    \ myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n\n   // 显示不同的数据类型\n\
    \   showDatatype(9, \"9\");\n   showDatatype(3.14, \"3.14\");\n   showDatatype(\"\
    Hello\", \"\\\"Hello\\\"\");\n   showDatatype(true, \"true\");\n   showDatatype(undefined,\
    \ \"undefined\");\n   showDatatype(null, \"null\");\n   showDatatype(myBook, \"\
    myBook\");\n   showDatatype(Book, \"Book\");\n\nfunction showDatatype(x, name)\
    \ {\n   document.writeln(name+\": \"+(typeof x));\n}\n\nfunction Book(title, author)\
    \ {\n   this.title = title;\n   this.author = author;\n}\n</script>\n</pre>\n\
    </body>\n</html>\n```\n\n这是该教程示例的输出。注意 `\"null\"` 的数据类型是 `\"object\"`。\n\n```\n\
    \ 9: number\n3.14: number\n\"Hello\": string\ntrue: boolean\nundefined: undefined\n\
    null: object\nmyBook: object\nBook: function\n```\n\nJavaScript 教程 - Herong 的教程示例\n\
    \n### ### 通过原型对象链实现属性和方法的继承\n\n本章提供了对象属性和方法继承的介绍和教程示例。主题包括：从构造函数的原型继承属性和方法；回顾内置默认属性和方法；使用\
    \ `constructor` 属性；添加本地和继承的属性；覆盖继承的属性。\n\n- 从构造函数的原型对象继承\n- 更改构造函数的原型对象\n- 从两级原型对象继承属性\n\
    - \"Object.prototype\" 中的内置属性和方法\n- 使用 \"hasOwnProperty()\" 方法测试继承的属性\n- 在 \"\
    prototype\" 对象中设置 \"constructor\" 属性\n- 在对象级别添加本地方法\n- 在原型级别添加继承方法\n- 构建多级原型对象\n\
    - 原型对象链总结](#part0103.xhtml)\n\n**结论：**\n\n- 当定义一个构造函数时，你实际上是在定义一个 `\"prototype\"\
    ` 对象。\n 当 当调用构造函数创建新对象时，你正在从构造函数定义的原型中继承属性和方法。\n- 你可以随时修改构造函数的原型。\n- 对象从它的原型以及原型的原型继承属性和方法，以此此类推。\n\
    - 根原型有一些内置的属性和方法：`constructor`、`hasOwnProperty()`、`isPrototypeOf()`、`toString()`\
    \ 和 `valueOf()`。\n- 属性和方法可以本地添加到单个对象实例中。\n\nJavaScript 教程 - Herong 的教程示例\n\n###\
    \ ### 通过原型对象链实现属性和方法的继承](#part0093.xhtml)\n\n#### #### 从构造函数的原型对象继承\n\n本节快速介绍了对象如何从其构造函数的原型对象继承属性和方法。提供了一个教程示例和图表来展示对象、其构造函数以及构造函数的原型对象之间的关系。\n\
    \n通过书中之前的章节，我们了解到：\n\n- 构造函数是一个函数。但它也是一个对象。\n- 每个构造函数都有一个名为 `\"prototype\"` 的内置默认属性。\n\
    - 构造函数的 `\"prototype\"` 是一个对象。\n- 属性和方法可以添加到构造函数的原型对象中。\n- 每个对象将从其构造函数的原型对象继承属性和方法。\n\
    \n为了演示这些规则，我写了以下教程示例，允许 `\"myBook\"` 从构造函数的原型对象中继承 `\"price\"` 属性：\n\n```html\n\
    \ <html>\n<!-- Inheritance_from_Prototype.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>从原型继承</title>\n</head>\n<body>\n<pre>\n\
    <script type=\"text/javascript\">\n\n// 定义构造函数: \"Book\"\nfunction Book(title,\
    \ author) {\n   this.title = title;\n   this.author = author;\n}\n\n   // 向 \"\
    prototype\" 添加属性\n   Book.prototype.price = 9.99;\n\n   // 创建一个对象: \"myBook\"\n\
    \   var myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n\n   //\
    \ 显示对象、构造函数和原型\n   showObject(myBook, \"myBook\");\n   showObject(Book, \"Book\"\
    );\n   showObject(Book.prototype, \"Book.prototype\");\n\nfunction showObject(object,\
    \ name) {\n   document.writeln(\"\\n\\\"\"+name+\"\\\" properties:\");\n   for\
    \ (var item in object) {\n      document.writeln(\"   \"+item+\": \"+object[item]);\n\
    \   }\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\n该教程示例的输出确认了我们之前学到的内容：\n\n\
    ```\n \"myBook\" properties:\n   title: JavaScript Tutorials\n   author: Herong\
    \ Yang\n   price: 9.99\n\n\"Book\" properties:\n   prototype: [object Object]\n\
    \n\"Book.prototype\" properties:\n   price: 9.99\n```\n\n输出也可以用此图表表示：\n\n![](img/image00143.jpeg)\n\
    \n从原型继承\n\nJavaScript 教程 - Herong 的教程示例\n\n### ### 通过原型对象链实现属性和方法的继承](#part0093.xhtml)\n\
    \n#### #### 更改构造函数的原型对象\n\n"
- fmt: "\nThis section provides a quick description of what is the default prototype\
    \ object and how to change it. A tutorial example is provided to create your own\
    \ prototype object and replace the default prototype object.\n\nIn the previous\
    \ section, we saw that an object is automatically created and assigned to the\
    \ constructor's `prototype` property when a constructor function is defined.\n\
    \nBut if you don't like the object created by the system, you can create an object\
    \ yourself and assign it to the `prototype` property.\n\nTo show you how to replace\
    \ the default `prototype` object, I wrote the following tutorial example to allow\
    \ `myBook` to inherit the `year` property stored in the prototype object created\
    \ by myself:\n\n```javascript\n <html>\n<!-- Inheritance_Change_Prototype.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Changing\
    \ Prototype Object</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// Define the constructor: \"Book\"\nfunction Book(title, author) {\n   this.title\
    \ = title;\n   this.author = author;\n}\n\n   // Adding a property to the \"prototype\"\
    \nBook.prototype.price = 9.99;\n\n   // Creating my own prototype object\n   myPrototype\
    \ = new Object();\n   myPrototype.year = 2008;\n\n   // Changing the constructor's\
    \ prototype object\n   Book.prototype = myPrototype;\n\n   // Creating an object:\
    \ \"myBook\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\"\
    );\n\n   // Showing the object, constructor, and prototype\n   showObject(myBook,\
    \ \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype,\
    \ \"Book.prototype\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\
    \\n\\\"\"+name+\"\\\" properties:\");\n   for (var item in object) {\n      document.writeln(\"\
    \   \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of this tutorial example confirms that the default `prototype`\
    \ object has been replaced by my own object called `myPrototype`:\n\n```\n \"\
    myBook\" properties:\n   title: JavaScript Tutorials\n   author: Herong Yang\n\
    \   year: 2008\n\n\"Book\" properties:\n   prototype: [object Object]\n\n\"Book.prototype\"\
    \ properties:\n   year: 2008\n```\n\nThe diagram below shows what happened during\
    \ the execution of this tutorial example. The default object originally assigned\
    \ to `Book.prototype` is grayed in the diagram.\n\n![](Images/image00144.jpeg)\n\
    \n# Changing the Prototype Object\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[Inheritance of Properties and Methods through\
    \ the Prototype Object Chain](#part0093.xhtml)\n\n∟Inheriting Properties from\
    \ Two Level Prototype Objects\n\nThis section provides a quick description of\
    \ how constructor's prototype objects form a two-level inheritance. A tutorial\
    \ example is provided to show object property inheritance from first and send\
    \ level prototype objects.\n\nNow we know how an object inherits properties from\
    \ its constructor's prototype object.\n\nSince the constructor's prototype object\
    \ can also inherit properties from its own constructor's prototype object, an\
    \ object can inherit properties from its own prototype object and the prototype's\
    \ prototype object.\n\nTo show you this two-level inheritance inheritance, I wrote\
    \ this tutorial example below to allow `myBook` inherit properties from the `price`\
    \ property from the first level prototype and the `copyright` property from the\
    \ second level prototype:\n\n```javascript\n <html>\n<!-- Inheritance_from_Second_Level_Prototype.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Inheriting\
    \ Properties from the Second-Level Prototype Object\n</title>\n</head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n\n// Define the constructor: \"Book\"\
    \nfunction Book(title, author) {\n   this.title = title;\n   this.author = author;\n\
    }\n\n   // Adding a property to the \"prototype\"\nBook.prototype.price = 9.99;\n\
    \n   // Adding a property to the prototype's \"prototype\"\n   // Book.prototype's\
    \ constructor is Object\nObject.prototype.copyright = \"herongyang.com\";\n\n\
    \   // Creating an object: \"myBook\"\n   var myBook = new Book(\"JavaScript Tutorials\"\
    , \"Herong Yang\");\n\n   // Showing the object, constructor, and prototype\n\
    \   showObject(myBook, \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype,\
    \ \"Book.prototype\");\n   showObject(Object.prototype, \"Object.prototype\");\n\
    \nfunction showObject(object, name) {\n   document.writeln(\"\\n\\\"\"+name+\"\
    \\\" properties:\");\n   for (var item in object) {\n      document.writeln(\"\
    \   \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of this tutorial example confirms that JavaScript allows objects\
    \ to inherit properties from its parent prototype objects of multiple levels:\n\
    \n```\n \"myBook\" properties:\n   title: JavaScript Tutorials\n   author: Herong\
    \ Yang\n   price: 9.99\n   copyright: herongyang.com\n\n\"Book\" properties:\n\
    \   prototype: [object Object]\n   copyright: herongyang.com\n\n\"Book.prototype\"\
    \ properties:\n   price: 9.99\n   copyright: herongyang.com\n\n\"Object.prototype\"\
    \ properties:\n   copyright: herongyang.com\n```\n\nThe diagram below shows you\
    \ how properties from prototype objects of two levels are inherited by the object.\n\
    \n![](Images/image00145.jpeg)\n\n# Two-Level Prototype Inheritance\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Inheritance of\
    \ Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n∟Built-in Properties and Methods in \"Object.prototype\"\n\nThis section provides\
    \ a quick description of built-in default properties and methods in `Object.prototype`.\
    \ A tutorial example is provided to dump what's in `Object.prototype`.\n\nAs I\
    \ mentioned in the previous section, the default prototype object is created from\
    \ the `Object()` constructor function. Its prototype object, `Object.prototype`,\
    \ is the base prototype object of all other prototype objects. Therefore, properties\
    \ of `Object.prototype` will be inherited by all objects.\n\nBecause of this nature,\
    \ JavaScript provides a number built-in properties and methods in `Object.prototype`\
    \ accessible by all objects through the inheritance tree. Some of them are listed\
    \ below:\n\n- `constructor`: Property pointing back to the constructor function\
    \ of this object.\n- `hasOwnProperty(prop)`: Method returning true if the specified\
    \ property belongs this object, not inherited from its prototype chain.\n- `isPrototypeOf(obj)`:\
    \ Method returning true if this object is one of the parent prototype objects\
    \ of the child object.\n- `toString()`: Method returning the string representation\
    \ of this object.\n- `valueOf()`: Method returning the primitive value represented\
    \ by this object.\n\nLet's first confirm that those properties and method do exist\
    \ in `Object.prototype`. To do this I wrote the following tutorial example to\
    \ print out their values. Notice that I use the `hasOwnProperty()` method to separate\n\
    \n```javascript\n <html>\n<!-- Inheritance_Built_in_Propertie_and_Method.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Built-in\
    \ Properties and Methods in Object.prototype</title>\n</head>\n<body>\n<pre>\n\
    <script type=\"text/javascript\">\n\n   // Adding a property to the base prototype\n\
    Object.prototype.copyright = \"herongyang.com\";\n\n   // Dumping some built-in\
    \ properties\n   document.writeln(\"\\nObject.prototype's built-in properties:\"\
    );\n   dumpProperty(Object.prototype, \"constructor\");\n   dumpProperty(Object.prototype,\
    \ \"hasOwnProperty\");\n   dumpProperty(Object.prototype, \"isPrototypeOf\");\n\
    \   dumpProperty(Object.prototype, \"toString\");\n   dumpProperty(Object.prototype,\
    \ \"valueOf\");\n\n   // Dumping the user added property\n   document.writeln(\"\
    \\nObject.prototype's user added properties:\");\n   dumpProperty(Object.prototype,\
    \ \"copyright\");\n\nfunction dumpProperty(object, property) {\n   var inheritance;\
    \ \n   if (object.hasOwnProperty(property)) \n      inheritance = \"Local\";\n\
    \   else \n      inheritance = \"Inherited\";\n   document.writeln(\"   \"+property+\"\
    : \"+inheritance+\": \"\n      +object[property]);\n}\n</script>\n</pre>\n</body>\n\
    </html>\n```\n"
  raw: "This section provides a quick description of what is the default prototype\
    \ object and how to change it. A tutorial example is provided to create your own\
    \ prototype object and replace the default prototype object.\n\nIn the previous\
    \ section, we saw that an object is automatically created and assigned to the\
    \ constructor's \"prototype\" property when a constructor function is defined.\n\
    \nBut if you don't like the object created by the system, you can create an object\
    \ yourself and assign it to the \"prototype\" property.\n\nTo show you how to\
    \ replace the default \"prototype\" object, I wrote the following tutorial example\
    \ to allow \"myBook\" to inherit the \"year\" property stored in the prototype\
    \ object created by myself:\n\n```\n <html>\n<!-- Inheritance_Change_Prototype.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Changing\
    \ Prototype Object</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// Define the constructor: \"Book\"\nfunction Book(title, author) {\n   this.title\
    \ = title;\n   this.author = author;\n}\n\n   // Adding a property to the \"prototype\"\
    \n   Book.prototype.price = 9.99;\n\n   // Creating my own prototype object\n\
    \   myPrototype = new Object();\n   myPrototype.year = 2008;\n\n   // Changing\
    \ the constructor's prototype object\n   Book.prototype = myPrototype;\n\n   //\
    \ Creating an object: \"myBook\"\n   var myBook = new Book(\"JavaScript Tutorials\"\
    , \"Herong Yang\");\n\n   // Showing the object, constructor, and prototype\n\
    \   showObject(myBook, \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype,\
    \ \"Book.prototype\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\
    \\n\\\"\"+name+\"\\\" properties:\");\n   for (var item in object) {\n      document.writeln(\"\
    \   \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of this tutorial example confirms that the default \"prototype\"\
    \ object has been replaced by my own object called \"myPrototype\":\n\n```\n \"\
    myBook\" properties:\n   title: JavaScript Tutorials\n   author: Herong Yang\n\
    \   year: 2008\n\n\"Book\" properties:\n   prototype: [object Object]\n\n\"Book.prototype\"\
    \ properties:\n   year: 2008\n```\n\nThe diagram below shows what happened during\
    \ the execution of this tutorial example. The default object originally assigned\
    \ to \"Book.prototype\" is grayed in the diagram.\n\n![](Images/image00144.jpeg)\n\
    \nChanging the Prototype Object\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Inheritance of Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n∟Inheriting Properties from Two Level Prototype Objects\n\nThis section provides\
    \ a quick description of how constructor's prototype objects form a two-level\
    \ inheritance. A tutorial example is provided to show object property inheritance\
    \ from first and send level prototype objects.\n\nNow we know how an object inherits\
    \ properties from its constructor's prototype object.\n\nSince the constructor's\
    \ prototype object can also inherit properties from its own constructor's prototype\
    \ object, an object can inherit properties from its own prototype object and the\
    \ prototype's prototype object.\n\nTo show you this two-level inheritance feature,\
    \ I wrote this tutorial example below to allow \"myBook\" inherit properties from\
    \ the \"price\" property from the first level prototype and the \"copyright\"\
    \ property from the second level prototype:\n\n```\n <html>\n<!-- Inheritance_from_Second_Level_Prototype.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Inheriting\
    \ Properties from the Second-Level Prototype Object\n</title>\n</head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n\n// Define the constructor: \"Book\"\
    \nfunction Book(title, author) {\n   this.title = title;\n   this.author = author;\n\
    }\n\n   // Adding a property to the \"prototype\"\n   Book.prototype.price = 9.99;\n\
    \n   // Adding a property to the prototype's \"prototype\"\n   // Book.prototype's\
    \ constructor is Object\n   Object.prototype.copyright = \"herongyang.com\";\n\
    \n   // Creating an object: \"myBook\"\n   var myBook = new Book(\"JavaScript\
    \ Tutorials\", \"Herong Yang\");\n\n   // Showing the object, constructor, and\
    \ prototype\n   showObject(myBook, \"myBook\");\n   showObject(Book, \"Book\"\
    );\n   showObject(Book.prototype, \"Book.prototype\");\n   showObject(Object.prototype,\
    \ \"Object.prototype\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\
    \\n\\\"\"+name+\"\\\" properties:\");\n   for (var item in object) {\n      document.writeln(\"\
    \   \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of this tutorial example confirms that JavaScript allows objects\
    \ to inherit properties from its parent prototype objects of multiple levels:\n\
    \n```\n \"myBook\" properties:\n   title: JavaScript Tutorials\n   author: Herong\
    \ Yang\n   price: 9.99\n   copyright: herongyang.com\n\n\"Book\" properties:\n\
    \   prototype: [object Object]\n   copyright: herongyang.com\n\n\"Book.prototype\"\
    \ properties:\n   price: 9.99\n   copyright: herongyang.com\n\n\"Object.prototype\"\
    \ properties:\n   copyright: herongyang.com\n```\n\nThe diagram below shows you\
    \ how properties from prototype objects of two levels are inherited by the object.\n\
    \n![](Images/image00145.jpeg)\n\nTwo-Level Prototype Inheritance\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Inheritance of\
    \ Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n∟Built-in Properties and Methods in \"Object.prototype\"\n\nThis section provides\
    \ a quick description of built-in default properties and methods in 'Object.prototype'.\
    \ A tutorial example is provided to dump what's in 'Object.prototype'.\n\nAs I\
    \ mentioned in the previous section, the default prototype object is created from\
    \ the \"Object()\" constructor function. Its prototype object, \"Object.prototype\"\
    , is the base prototype object of all other prototype objects. Therefor, properties\
    \ of \"Object.prototype\" will be inherited by all objects.\n\nBecause of this\
    \ nature, JavaScript provides a number built-in properties and methods in \"Object.prototype\"\
    \ accessible by all objects through the inheritance tree. Some of them are listed\
    \ below:\n\n*   \"constructor\" - Property pointing back to the constructor function\
    \ of this object.\n\n*   \"hasOwnProperty(prop)\" - Method returning true if the\
    \ specified property belongs this object, not inherited from its prototype object\
    \ chain.\n\n*   \"isPrototypeOf(obj)\" - Method returning true if this object\
    \ is one of the parent prototype objects of the specified child object.\n\n* \
    \  \"toString()\" - Method returning the string representation of this object.\n\
    \n*   \"valueOf()\" - Method returning the primitive value represented by this\
    \ object.\n\nLet's first confirm that those properties and method do exist in\
    \ \"Object.prototype\". To do this I wrote the following tutorial example to print\
    \ out their values. Notice that how I use the hasOwnProperty() method to separate\n\
    \n```\n <html>\n<!-- Inheritance_Built_in_Propertie_and_Method.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Built-in Properties\
    \ and Methods in Object.prototype</title>\n</head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n\n   // Adding a property to the base prototype\n   Object.prototype.copyright\
    \ = \"herongyang.com\";\n\n   // Dumping some built-in properties\n   document.writeln(\"\
    \\nObject.prototype's built-in properties:\");\n   dumpProperty(Object.prototype,\
    \ \"constructor\");\n   dumpProperty(Object.prototype, \"hasOwnProperty\");\n\
    \   dumpProperty(Object.prototype, \"isPrototypeOf\");\n   dumpProperty(Object.prototype,\
    \ \"toString\");\n   dumpProperty(Object.prototype, \"valueOf\");\n\n   // Dumping\
    \ the user added property\n   document.writeln(\"\\nObject.prototype's user added\
    \ properties:\");\n   dumpProperty(Object.prototype, \"copyright\");\n\nfunction\
    \ dumpProperty(object, property) {\n   var inheritance; \n   if (object.hasOwnProperty(property))\
    \ \n      inheritance = \"Local\";\n   else \n      inheritance = \"Inherited\"\
    ;\n   document.writeln(\"   \"+property+\": \"+inheritance+\": \"\n      +object[property]);\n\
    }\n</script>\n</pre>\n</body>\n</html>\n```"
