    \ call:\n   localVar is not valid\n   localNoVar = Orange - Updated\n```\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining and Calling\
    \ Functions](#part0036.xhtml)\n\n# Collision of Global and Local Variables - Examples\n\
    \nThis section provides a tutorial example on how JavaScript handles local variables\
    \ collide with global variables.\n\nTo see JavaScript handles global and local\
    \ variables collide with identical names inside and outside functions, I wrote\
    \ the following tutorial example:\n\n```html\n <html\n<!-- Variable_Collision.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Variable\
    \ Collision</title></head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\
    \   var tempVar;\n   tempVar = \"Bird\";\n   tempNoVar = \"Fish\";\n\n   scopeCheck();\n\
    \n   document.write(\"\\n\\nAfter function call:\");\n   document.write(\"\\n\
    \   tempVar = \" + tempVar);\n   document.write(\"\\n   tempNoVar = \" + tempNoVar);\n\
    \nfunction scopeCheck() {\n   var tempVar;\n   tempVar = \"Bird\";\n   tempNoVar\
    \ = \"Fish\";\n\n   tempVar = tempVar + \" - Updated\";\n   tempNoVar = tempNoVar\
    \ + \" - Updated\";\n\n   document.write(\"\\n\\nUpdated value in function:\"\
    );\n   document.write(\"\\n   tempVar = \" + tempVar);\n   document.write(\"\\\
    n   tempNoVar = \" + tempNoVar);\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\
    \nThis tutorial example tests two sets of variables. One set introduced outside\
    \ the function, and one set inside the function. Names of variables in one set\
    \ collide with the other set. Two `tempVar` declared with `var` statements stay\
