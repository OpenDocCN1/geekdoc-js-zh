    ：\n\n```\n 1 <html>\n2 <head><title>Hello World!</title></head>\n3 <body>\n4 <script\
    \ type=\"text/javascript\">\n5    document.write('Hello World!');\n6 </script>\n\
    7 </body>\n8 </html>\n```\n\n前 3 行是普通的 HTML 标签。\n\n第 4 行有一个特殊的 HTML 标签 `<script>`，它开始了一段\
    \ JavaScript 代码。注意 `type=\"text/javascript\"` 属性表示标签中包含的是是 JavaScript 代码。\n\n\
    第 5 行是该 HTML 文档中唯一的 JavaScript 语句，它调用了内置对象 `document` 的 `write()` 函数。此调用会将字符串\
    \ \"Hello World!\" 输出到 HTML 文档中。\n\n第 6 行结束了 JavaScript 代码。\n\n当 Web 浏览器处理此 HTML\
    \ 文档时，它会解释 `<script>` 标签内所有的 JavaScript 语句。\n\nJavaScript 教程 - Herong' 教程示例\n\n\
    ∟JavaScript 简介\n\n∟document.write() 方法\n\n本节提供了 `document.write()` 方法的简要描述以及一个使用\
    \ `document.write()` 方法的简单教程示例。\n\n从上一节的 JavaScript 示例可以看出，`document.write(string)`\
    \ 方法是一个非常实用的方法。关于该方法的一些说明：\n\n* `document` 是一个内置对象，代表嵌入 JavaScript 的 HTML 文档。\n\
    \n* `write(string)` 是由 `document` 对象提供的方法。它将指定的字符串写入由 `document` 对象表示的 HTML 文档中。\n\
    \n你可以使用 `document.write(string)` 方法向 HTML 文档写入任何内容，包括 HTML 标签。\n\n这是一个教程示例，展示了如何使用\
    \ `document.write()` 方法写入 HTML 文档的一大部分内容：\n\n```\n <html>\n<!-- Document_Write.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>The\
    \ document.write() Method</title></head>\n<body>\n<script type=\"text/javascript\"\
    >\n   document.write('<center>');\n   document.write('Summer summer oh so hot,<br/>');\n\
    \   document.write('Summer summer trapped in a pot.<br/>');\n   document.write('When\
    \ I open the lid I let you out,<br/>');\n   document.write('You make me so happy<br/>');\n\
    \   document.write('I want to shout!<br/>');\n   document.write('</center>');\n\
    </script>\n</body>\n</</html>\n```\n\n[JavaScript 教程 - Herong' 教程示例\n\n∟[ECMAScript\
