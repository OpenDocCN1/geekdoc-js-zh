    \ JavaScript 历史与版本\n\n> \n\n> ECMAScript 语言规范\n\n> \n\n> 自动插入分号以结束语句\n\n结论：\n\n\
    * ECMAScript (ECMA-262) 是 JavaScript 语言规范的官方名称。\n\n* JavaScript 最初在 Netscape 中实现，是\
