  trans: "\n\n下方的教程示例展示了如何通过 3 种不同的创建函数：\n\n```javascript\n // Function_Creation_Facilities.js\n\
    // Copyright (c) HerongYang.com. All Rights Reserved.\n\n// 使用 \"function\" 声明语句创建函数\n\
    \   function convert_1(fahrenheit) {\n      println(\"Converting Fahrenheit =\
    \ \"+fahrenheit);\n      var celsius = (fahrenheit - 32.0 ) / 1.8;\n      println(\"\
    Returning Celsius = \"+celsius);\n      return celsius;\n      }\n\n// 使用 \"function\"\
    \ 运算符创建函数\n   var convert_2 = function (fahrenheit) {\n      println(\"Converting\
    \ Fahrenheit = \"+fahrenheit);\n      var celsius = (fahrenheit - 32.0 ) / 1.8;\n\
    \      println(\"Returning Celsius = \"+celsius);\n      return celsius;\n   \
    \   };\n\n// 使用 \"Function()\" 构造函数创建函数\n   var convert_3 = new Function(\"fahrenheit\"\
    ,\n      \"println(\\\"Converting Fahrenheit = \\\"+fahrenheit);\"\n      + \"\
    var celsius = (fahrenheit - 32.0 ) / 1.8;\"\n      + \"println(\\\"Returning Celsius\
    \ = \\\"+celsius);\"\n      + \"return celsius;\"\n      );\n\n// 调用所有 3 个\n \
    \  convert_1(70.0);\n   convert_2(70.0);\n   convert_3(70.0);\n```\n\n在命令行窗口中使用\
    \ `jrunscript` 此 JavaScript 文件，你将得到：\n\n```\n Converting Fahrenheit = 70\nReturning\
    \ Celsius = 21.11111111111111\n Converting Fahrenheit = 70\nReturning Celsius\
    \ = 21.11111111111111\nConverting Fahrenheit = 70\nReturning Celsius = 21.11111111111111\n\
    ```\n\nJavaScript 教程 - Herong 的教程示例\n\n# 内置对象类型简介\n\n本章快速介绍 JavaScript 内置对象。主题包括全局对象及其宿主环境提供的属性；`Math`\
    \ 对象及其属性；内置对象类型：`Function`、`Array`、`String`、`Boolean`、`Number`、`Date`、`RegExp`\
    \ 和 `Error`。\n\n* 内置对象类型概述\n* \"Object\" 对象类型 - 根对象类型\n* \"Global\" 对象类型 - 不见的全局容器\n\
    * 在 ECMAScript 中定义的全局属性和函数\n* \"jrunscript\" 提供的全局属性和函数\n* \"Function\" 对象类型 -\
    \ 函数是对象\n* \"Array\" 对象类型 - 数组是对象\n* \"JSON\" 对象类型 - `parse()` 和 `stringify()`\n\
    * \"String\" 对象类型 - 不等于字符串原始类型\n* \"Boolean\" 对象类型 - 将布尔值封装为对象\n* \"Number\" 对象类型\
    \ - 不等于数字原始类型\n* \"Date\" 对象类型 - 管理日期和时间\n* \"RegExp\" 对象类型 - 正则表达式模式\n* \"Error\"\
    \ 对象类型 - 运行时异常\n* \"Math\" 对象类型 - 数学容器\n\n结论：\n\n* JavaScript 规范自 ECMAScript 第\
    \ 3 版起，支持这些内置对象类型：`Object`、`Global`、`Function`、`Array`、`String`、`Boolean`、`Number`、`Date`、`RegExp`、`Error`、`Math`。\n\
    * \"Global\" 是一个特殊的对象类型，只有一个没有引用变量的默认实例。但你可以通过全局上下文中的 `this` 关键字访问它。\n* \"Global\"\
    \ 对象实例用于持有所有内置属性和方法，如 `undefined`、`eval()` 等。\n\nJavaScript 教程 - Herong 的教程示例\n\
    \n# 内置对象类型简介\n\n## 内置对象类型概述\n\n本节提供了 ECMAScript 规范定义的所有内置对象类型列表。\n\n当前的 Mozilla\
    \ JavaScript 规范定义了以下内置对象类型：\n\n* `Global`: 一个特殊的对象类型，用于创建一个且仅创建一个对象来持有全局内置属性和函数。注意，ECMAScript\
    \ 仅支持一个 `Global` 类型的单一对象。不允许使用 `Global()` 构造函数创建其他 Global 对象。\n* `Object`: 对象类型树中的根对象类型。所有其他对象类型都继承自\
    \ `Object` 对象类型。\n* `Function`: 用于创建函数的对象类型。所有函数都是 `Function` 对象类型的实例。\n* `Boolean`:\
    \ 用于创建 `Boolean` 对象的对象类型。`Boolean` 对象类型允许将布尔原始值作为对象处理。\n* `Symbol`: 用于存储所有可能用\
    \ `Object` 属性键的非字符串值的对象类型。\n* `Error`、`AggregateError`、`EvalError`、`InternalError`、`RangeError`、`ReferenceError`、`SyntaxError`、`TypeError`、`URIError`:\
    \ 用于异常处理过程中错误对象的对象类型。\n* `Number`: 用于创建数字对象的对象类型。`Boolean` 对象类型允许将数字原始值作为对象处理。（注：此处原文可能有误，应为\
    \ Number）\n* `BigInt`: 用于创建大于 `2⁵³ - 1` 的整数的对象类型。\n* `Math`: 一个特殊的对象类型，用于创建一个且仅创建一个对象来持有数学相关的属性和函数。\n\
    * `Date`: 用于创建日期和时间对象的对象类型。\n* `String`: 用于创建字符串对象的对象类型。`String` 对象类型允许将字符串原始值作为对象处理。\n\
    * `RegExp`: 用于文本处理正则表达式对象的对象类型。\n* `Array`、`Int8Array`、`Uint8Array`、`Uint8ClampedArray`、`Int16Array`、`Uint16Array`、`Int32Array`、`Uint32Array`、`Float32Array`、`Float64Array`、`BigInt64Array`、`BigUint64Array`:\
    \ 用于创建数组的对象类型。所有数组都是 `Array` 类型的对象。\n* `Map`: 用于存储键值对并记住键的原始插入顺序的对象类型。任何值（对象和原始值）都可以作为键或值。\n\
    * `Set`: 用于存储任何类型的唯一值（无论是原始值还是对象引用）的对象类型。\n* `ArrayBuffer`、`SharedArrayBuffer`、`Atomics`、`DataView`:\
    \ 用于表示通用固定长度原始二进制数据的对象类型。\n* `JSON`: 用于解析 JavaScript 对象表示法 (JSON) 和将值转换为 JSON\
    \ 的对象类型。\n* `Promise`: 用于表示异步操作最终完成（或失败）及其结果值的对象类型。\n* `Generator`、`GeneratorFunction`:\
    \ 生成器函数返回对象的对象类型。\n* `AsyncFunction`: 创建异步异步函数的对象类型。在 JavaScript 中，每个异步函数实际上都是\
    \ `AsyncFunction` 对象。\n* `Reflect`: 提供可拦截的 JavaScript 操作方法的对象类型。这些方法与代理处理器（proxy\
    \ handlers）的方法相同。`Reflect` 不是函数对象，因此不可构造的。\n* `Proxy`: 用于为基本操作（例如属性查找、赋值、枚举、函数调用等）定义自定义行为的对象类型。\n\
    \n查看后续章节以获取上述某些内置对象类型的快速介绍。\n\nJavaScript 教程 - Herong 的教程示例\n\n# \"Object\" 对象类型\
    \ - 根对象类型\n\n本节提供了 `Object` 内置对象类型的快速描述和教程示例脚本，它是所有其他对象类型的根或基对象类型。\n\n\"Object\"\
    \ 对象类型可能是最重要的内置对象类型。它具有以下主要特征：\n\n* `Object` 是对象类型树中的根（或基）对象类型。所有其他对象类型都继承自 `Object`\
    \ 对象类型。\n* `Object` 对象可以通过 `Object()` 构造函数创建。\n* `Object` 对象也可以通过对象字面量创建：`{property:\
    \ value, ...}`。\n\n这是一个教程示例脚本，向你展示了其中一些特征：\n\n"
- fmt: "\n```\n // Object_Object_Type.js\n// Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n\n   // Creating an object of the \"Object\" object type\n   var\
    \ myObject = new Object();\n\n   // Adding properties to the object\n   myObject.name\
    \ = \"Unknown\";\n   myObject.size = \"1.71m\";\n   myObject.weigth = \"65kg\"\
    ;\n\n   // Checking the object\n   println(\"About the myObject:\");\n   println(\"\
    \   Type: \"+(typeof myObject));\n   println(\"   Instance Of Object: \"+(myObject\
    \ instanceof Object));\n   println(\"   Properties:\");\n   for (var item in myObject)\
    \ {\n      println(\"      \"+item+\": \"+myObject[item]);\n   }\n\n   // Creating\
    \ an object of the \"Book\" object type\n   var myBook = new Book(\"JavaScript\
    \ Tutorial\", \"Herong Yang\");\n\n   // Checking the object\n   println(\"About\
    \ the myBook:\");\n   println(\"   Type: \"+(typeof myBook));\n   println(\" \
    \  Instance Of Object: \"+(myBook instanceof Object));\n   println(\"   Instance\
    \ Of Book: \"+(myBook instanceof Book));\n   println(\"   Properties:\");\n  \
    \ for (var item in myBook) {\n      println(\"      \"+item+\": \"+myBook[item]);\n\
    \   }\n\n// Defining the constructor for a new object type\nfunction Book(title,\
    \ author) {\n   this.title = title;\n   this.author = author;\n}\n```\n\nIf you\
    \ run this script with `jrunscript`, you will get:\n\n```\n About the myObject:\n\
    \   Type: object\n   Instance Of Object: true\n   Properties:\n      weigth: 65kg\n\
    \      name: Unknown\n      size: 1.71m\n\nAbout the myBook:\n   Type: object\n\
    \   Instance Of Object: true\n   Instance Of Book: true\n   Properties:\n    \
    \  title: JavaScript Tutorial\n      author: Herong Yang\n```\n\n`myBook` is an\
    \ instance of `Book` and `Object`, because `Book` is sub type of `Object` by default.\n\
    \nRead other \"Object\" related chapters to see more tutorial examples.\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to\
    \ Built-in Object Types](#part0118.xhtml)\n\n## The \"Global\" Object Type - The\
    \ Invisible Global Container\n\nThis section provides a quick description and\
    \ a tutorial example script of the `Global` built-in object type, which is used\
    \ to create a default invisible global object to hold all global properties and\
    \ functions.\n\nThe \"Global\" object type is probably the most mysterious built-in\
    \ object type. It has the following main features:\n\n- \"Global\" is a reserved\
    \ object type. You can not create your own \"Global\" objects. The `Global()`\
    \ constructor is not accessible.\n- The host environment will create a single\
    \ default \"Global\" object, which is not assigned to any reference variables.\
    \ So this \"Global\" object is invisible.\n- However, this invisible \"Global\"\
    \ object is visible in the global execution context (outside any functions) by\
    \ using the `this` keyword.\n- You can use the expression `this instanceof Global`\
    \ to check the object type of `this`, because the `Global()` is not accessible.\n\
    - The \"Global\" object is created to hold all built-in properties and functions\
    \ provided by the host environment, like `NaN`, `eval()`, etc..\n- Technically\
    \ built-in properties or functions are all defined as properties of the \"Global\"\
    \ object. But you can use them directly without the reference to the `Global`\
    \ object.\n\nHere is a tutorial sample script showing you some of those features:\n\
    \n```\n // Global_Object_Type.js\n// Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n\n   // Global() constructor is not accessible \n   // var myGlobal\
    \ = new Global();\n\n   println(\"\\nAbout this \\\"this\\\":\");\n   println(\"\
    \   Type = \"+(typeof this));\n   println(\"   Instance Of Object: \"+(this instanceof\
    \ Object));\n\n   // \"instanceof Global\" is not allowed\n   // println(\"  \
    \ Instance Of Global: \"+(this instanceof Global));\n\n   // toString() will us\
    \ more\n   println(\"   toString() = \"+this.toString());\n\n   // Accessing a\
    \ global property directly\n   println(\"\\nChecking NaN:\");\n   println(\" \
    \  NaN: Type = \"+(typeof NaN) \n      + \", Value = \"+NaN);\n\n   // Accessing\
    \ a global property indirectly\n   println(\"\\nChecking this.NaN:\");\n   println(\"\
    \   this.NaN: Type = \"+(typeof this.NaN) \n      + \", Value = \"+this.NaN);\n\
    \n   // Testing a global function\n   println(\"\\nTesting eval() in two ways:\"\
    );\n   println(\"   eval('7*7') = \"+eval('7*7')); \n   println(\"   this.eval('7*7')\
    \ = \"+this.eval('7*7'));\n```\n\nIf you run this script with `jrunscript`, you\
    \ will get:\n\n```\n About this \"this\":\n   Type = object\n   Instance Of Object:\
    \ true\n   toString() = [object Global]\n\nChecking NaN:\n   NaN: Type = number,\
    \ Value = NaN\n\nChecking this.NaN:\n   this.NaN: Type = number, Value = NaN\n\
    \nTesting eval() in two ways:\n   eval('7*7') = 49\n   this.eval('7*7') = 49\n\
    ```\n\n`this.toString()` proves that `this` is a `Global` object.\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to\
    \ Built-in Object Types](#part0118.xhtml)\n\n## Global Properties and Functions\
    \ Defined in ECMAScript\n\nThis section provides a quick description of all global\
    \ properties and functions mentioned in the ECMAScript specification.\n\nThere\
    \ are 3 built-in global properties with primitive values contained in the invisible\
    \ \"Global\" object mentioned in the ECMAScript specification:\n\n- \"NaN\" -\
    \ A global property that holds the special number value: `NaN` (Not A Number).\n\
    - \"Infinity\" - A global property that holds the special number value: `Infinity`.\n\
    - \"undefined\" - A global property that holds the undefined value: `undefined`.\n\
    \nThere are 9 regular built-in global functions contained in the invisible \"\
    Global\" object mentioned in the ECMAScript specification:\n\n- `eval(x)` - Evaluates\
    \ the specified string a JavaScript expression and returns the result.\n- `parseInt(string,\
    \ radix)` - Produces an integer value dictated by interpretation of the contents\
    \ of the string argument according to the specified radix.\n- `parseFloat(string)`\
    \ - Produces a number value dictated by interpretation of the contents of the\
    \ string argument as a decimal literal.\n- `isNaN(number)` - Returns true if the\
    \ specified number is `NaN`.\n- `isFinite(number)` - Returns true if the specified\
    \ number is a finite number.\n- `decodeURI(encodedURI)` - Decodes an encoded URI\
    \ string back to a URI string.\n- `decodeURIComponent(encodedURIComponent)` -\
    \ Decodes an encoded URI component string back to a URI component string.\n- `encodeURI(uri)`\
    \ - Encodes a URI string by replacing all characters except the following: alphabetic,\
    \ decimal digits, - _ . ! ~ * ' ( ) # ; , / ? : @ & = = + $, with escape sequences.\n\
    - `encodeURIComponent(uriComponent)` - Encodes a URI component string by replacing\
    \ all characters except the following: alphabetic, decimal digits, - _ . ! ~ *\
    \ ' ( ), with escape sequences.\n\nThere are 9 special built-in global functions\
    \ contained in the invisible \"Global\" object mentioned in the ECMAScript specification.\
    \ These functions are really constructors of built-in object types:\n\n- `Object()`\
    \ - Constructor of the Object object type.\n- `Function(...)` - Constructor of\
    \ the Function object type.\n- `Array(...)` - Constructor of the Array object\
    \ type.\n- `String(...)` - Constructor of the String object type.\n- `Boolean(...)`\
    \ - Constructor of the Boolean object type.\n- `Number(...)` - Constructor of\
    \ the Number object type.\n- `Date(...)` - Constructor of the Date object type.\n\
    - `RegExp(...)` - Constructor of the RegExp object type.\n- `Error(...)` - Constructor\
    \ of the Error object type.\n\nThere is 1 built-in global properties with an object\
    \ value contained in the invisible \"Global\" object mentioned in the ECMAScript\
    \ specification:\n\n- \"Math\" - A global property that holds the default \"Math\"\
    \ object which contains all mathematics related properties and functions.\n\n\
    In order to verify those global properties and functions, I wrote this simple\
    \ script:\n"
