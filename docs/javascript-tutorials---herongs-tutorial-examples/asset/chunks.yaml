    \ ... in` 语句已废用。请不要再使用它。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟定义你自己的对象类型\n\n##\
    \ 构造函数对象的 \"prototype\" 属性\n\n本节快速介绍了构造函数上内置的 `prototype` 属性。提供了一个教程示例，说明了如何在\
    \ `prototype` 属性中存储属性和方法，以便由该构造函数创建的所有对象继承它们。\n\n在之前的章节中，我们学习了可以使用构造函数来创建新对象。但构造函数还带有一个内置属性名为\
    \ `prototype`，它提供了允许对象共享和继承属性及方法的机制。\n\n*   构造函数也是一个 `Function` 类型的对象。\n*   构造函数可以作为对象拥有自己的属性。\n\
    *   每个构造函数都有一个名为 `prototype` 的默认属性。\n*   构造函数的默认 `prototype` 属性是一个对象。\n*   可以向构造函数的\
    \ `prototype` 对象中添加新的属性和方法。\n* 构造函数的 `prototype` 对象的所有属性和方法都由从该构造函数创建的所有对象共享。\n\
    \n让我们使用以下教程示例来测试一下：\n\n```html\n <html>\n<!-- Prototype_Property_on_Constructor.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>构造函数上的\
    \ \"prototype\" 属性</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// 定义对象类型构造函数\nfunction Book(title, author) {\n   this.title = title;\n \
    \  this.author = author;\n}\n\n   // 向 \"prototype\" 添加属性和方法\n   Book.prototype.price\
    \ = 9.99;\n   Book.prototype.getDesc = getDescription;\n\n// 定义一个用作方法的函数\nfunction\
    \ getDescription() {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n\
    }\n\n   // 创建一个 \"Book\" 的对象\n   var myBook = new Book(\"JavaScript Tutorials\"\
    , \"Herong Yang\");\n\n   // 显示对象、构造函数和原型\n   showObject(myBook, \"myBook\");\n\
    \   showObject(Book, \"Book\");\n   showObject(Book.prototype, \"Book.prototype\"\
    );\n\nfunction showObject(object, name) {\n   document.writeln(\"\\nShowing object\
    \ \\\"\"+name+\"\\\"\");\n   document.writeln(\"   Type: \"+(typeof object));\n\
    \   document.writeln(\"   Property/method names and values:\");\n   for (var item\
    \ in object) {\n      document.writeln(\"      \"+item+\": \"+object[item]);\n\
    \   }\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\n此教程示例的输出显示了 \"prototype\"\
    \ 是是如何被对象继承的：\n\n Showing object \"myBook\"\n   Type: object\n   Property/method\
    \ names and values:\n      title: JavaScript Tutorials\n      author: Herong Yang\n\
    \      price: 99.99\n      getDesc: function getDescription() {\n    return \"\
    \\\"\" + this.title + \"\\\" by \" + this.author;\n}\n\nShowing object \"Book\"\
    \n   Type: function\n   Property/method names and values:\n      prototype: Object\n\
    \nShowing object \"Book.prototype\"\n   Type: object\n   Property/method names\
    \ and values:\n      price: 9.99\n      getDesc: function getDescription() {\n\
    \    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\n\nJavaScript\
    \ 教程 - Herong 的教程示例\n\n∟定义你自己的对象类型\n\n## \"instanceof\" 运算符 - 确定对象类型\n\n本节介绍了\
    \ `instanceof` 运算符。提供了一个教程示例，说明了如何使用 `instanceof` 运算符确定对象的类型。\n\n到目前为止，我们通过使用构造函数创建了多种类型的对象，如\
    \ `Object`、`Array`、`Function` 和 `Book`（我们自己的对象类型）。\n\n但如果我们有一个对象，如何测试它的对象类型？JavaScript\
    \ 提供了 `instanceof` 运算符来帮助我们完成这个表达式：\n\n```\n object instanceof constructor\n```\n\
    \n此 `instanceof` 表达式返回一个布尔值，指示指定的对象是否是指定类型（构造函数名称）的实例。\n\n下面的示例使用 `instanceof`\
    \ 运算符测试之前示例中使用的 3 个对象：\n\n```html\n <html>\n<!-- Prototype_instanceof_Operator.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>\"\
    instanceof\" 运算符 - 确定对象类型</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// 定义对象类型构造函数\nfunction Book(title, author) {\n   this.title = title;\n \
    \  this.author = author;\n}\n\n   // 向原型 添加属性和方法\n   Book.prototype.price = 9.99;\n\
    \   Book.prototype.getDesc = getDescription;\n\n// 定义一个用作方法的函数\nfunction getDescription()\
    \ {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // 创建一个\
    \ \"Book\" 的对象\n   var myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\"\
    );\n\n   // 显示对象、构造函数和原型\n   showObject(myBook, \"myBook\");\n   showObject(Book,\
    \ \"Book\");\n   showObject(Book.prototype, \"Book.prototype\");\n\nfunction showObject(object,\
    \ name) {\n   document.writeln(\"\\nShowing object \\\"\"+name+\"\\\"\");\n\n\
    \   // 使用 \"instanceof\" 确定对象类型\n   document.writeln(\"   Instance of Object:\
    \ \"\n      +(object instanceof Object));\n   document.writeln(\"   Instance of\
    \ Function: \"\n      +(object instanceof Function));\n   document.writeln(\"\
    \   Instance of Book: \"\n      +(object instanceof Book));\n}\n</script>\n</pre>\n\
    </body>\n</html>\n```\n"
- fmt: "\n```\n Showing object \"myBook\"\n   Instance of Object: true\n   Instance\
    \ of Function: false\n   Instance of Book: true\n\nShowing object \"Book\"\n \
    \  Instance of Object: true\n   Instance of Function: true\n   Instance of Book:\
