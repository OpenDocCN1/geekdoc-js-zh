    <script type=\\\"text/javascript\\\">\");\n   document.writeln(\"document.writeln(\\\
    \" Hello World!\\\");\");\n   document.writeln(\"<\\/script>\");\n</script>\n\
    </pre></body>\n</html>\n```\n\nTake a guess on what you will see on the browser\
    \ window if you run this HTML document.\n\n```\n Hello World!\n Hello World!\n\
    ```\n\nWhat happens is that when the browser finishes the execution of the embedded\
    \ JavaScript code, it will get the following the HTML document:\n\n```\n Hello\
    \ World!\n<script type=\"text/javascript\">\ndocument.writeln(\" Hello World!\"\
    );\n</script>\n```\n\nThere is another JavaScript code in the output. The browser\
    \ will execute it again resulting the final HTML document you saw earlier.\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Server-Side\
    \ and Client-Side Web Scripting](#part0066.xhtml)\n\n∟New Script Resulted from\
    \ Two Original Scripts\n\nThis section provides a tutorial example showing how\
    \ the Web browser fails to execute the JavaScript code resulted from two original\
    \ JavaScript codes.\n\nActually, the Web browser processes new script code correctly\
    \ only if it is resulted from a single execution.\n\nHere is HTML document with\
    \ two JavaScript codes that works together to return a new JavaScript code:\n\n\
    ```\n <html>\n<!-- Hello_Nested_Script_Error.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Hello from Nested Script Error</title></head>\n\
    <body><pre>\n<script type=\"text/javascript\">\n   document.writeln(\"-- Before\
    \ the new script.\");\n   document.writeln(\"<script type=\\\"text/javascript\\\
    \">\");\n</script>\ndocument.writeln(\\\"Hello World!\\\");\n<script type=\"text/javascript\"\
    >\n   document.writeln(\"<\\/script>\");\n   document.writeln(\"-- After the new\
    \ script.\");\n</script>\n</pre></body>\n</html>\n```\n\nAfter the first round\
    \ of JavaScript execution, the HTML document would have a new JavaScript code\
    \ like this:\n\n```\n -- Before the new script.\n<script type=\"text/javascript\"\
    >\ndocument.writeln(\\\"Hello World!\\\");\n</script>\n-- After the new script.\n\
    ```\n\nIf the Web browser executes the new JavaScript code again correctly, the\
    \ final HTML document would look like this:\n\n```\n -- Before the new script.\n\
    Hello World!\n-- After the new script.\n```\n\nBut both Internet Explorer and\
    \ Firefox give the following result:\n\n```\n -- Before the new script.\n```\n\
    \nConclusion: if a new script code is returned from two original script codes,\
    \ the Web browser will fail to execute it correctly.\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟Introduction to Objects\n\
    \nThis chapter provides introductions and tutorial examples on the 'Object' data\
    \ type in JavaScript. Topics include creating 'Object' objects; adding and retrieving\
    \ properties; adding and running methods; named and indexed properties; comparing\
    \ arrays with objects.\n\n> [What Is an Object?](#part0074.xhtml)\n\n> \n\n> [Objects\
    \ of \"Object\" Data Type](#part0075.xhtml)\n\n> \n\n> [Adding and Deleting Object\
    \ Own Properties](#part0076.xhtml)\n\n> \n\n> [Adding and Deleting Object Own\
    \ Methods](#part0077.xhtml)\n\n> \n\n> [Using \"this\" Keyword to Represent Current\
    \ Object](#part0078.xhtml)\n\n> \n\n> [Object Literals of the \"Object\" Type](#part0079.xhtml)\n\
    \n> \n\n> [Objects and Associate Arrays](#part0080.xhtml)\n\n> \n\n> [Objects\
    \ with Indexed Properties](#part0081.xhtml)\n\n> \n\n> [Differences between \"\
    Object\" and \"Array\"](#part0082.xhtml)\n\n> \n\n> [Using \"Array\" Objects as\
    \ \"Object\" Objects](#part0083.xhtml)\n\nConclusion:\n\n*   An object is an instance\
    \ of a special data type called \"Object\" or any \"prototype\" data type.\n\n\
    *   \"Object\" data type is root \"prototype\" of all \"prototype\" data types.\n\
    \n*   A new object can be created using an object literal: {n:v, ...}.\n\n*  \
    \ A new object can be created using the Object constructor: New Object().\n\n\
    *   An object's property or method can be accessed using the dot \".\" operation.\n\
    \n*   An object's property or method can be deleted using the dot \"delete\" operation.\n\
    \n*   When defining the method body of an object, can you use the \"this\" keyword\
    \ to refer to the object.\n\n*   An object's property can be accessed as an element\
    \ of an associated array.\n\n*   An object can have indexed properties, similar\
    \ to an array.\n\n*   An array is an object.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to Objects](#part0073.xhtml)"
