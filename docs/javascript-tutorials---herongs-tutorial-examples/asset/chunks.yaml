    \n## [W3C's Document Object Model (DOM) Specifications](#part0134.xhtml)\n\n##\
    \ A Web Document as A Tree of Nodes\n\nThis section provides a tutorial example\
    \ of JavaScript to show that a Web page is a tree of nodes. This shows the simplified\
    \ flattened view of DOM API.\n\nWe know that a Web page, a HTML document, is a\
    \ tree of elements (ignoring attributes for a moment). From a simplified point\
    \ of view, all elements are represented by the `Node` interface. To differentiate\
    \ different types of nodes from each other, we can check the \"type\" and \"name\"\
    \ attributes.\n\nNow let's walk through the tree and present each element as a\
    \ node with its type and name with a simple JavaScript example:\n\n```\n <html>\n\
    <!-- DOM_API_Simplified_Node_View.html\n   Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n-->\n<head>\n<title>DOM API - Simplified Node View</title>\n<style\
    \ type=\"text/css\">body {background-color: #aaaaff}</style>\n<script type=\"\
    text/javascript\">\nfunction showInterface(node, prefix, out) {\n   var typeName\
    \ = new Array(\"NULL\", \"ELEMENT\", \"ATTRIBUTE\", \"TEXT\",\n      \"CDATA\"\
    , \"ENTITY_REFERENCE\", \"ENTITY\", \"RROCESSING_INSTRUCTION\",\n      \"COMMENT\"\
    , \"DOCUMENT\", \"DOCUMENT_TYPE\", \"DOCUMENT_FRAGMENT\",\n      \"NOTATION\"\
    );\n   out += prefix+\"[Node type=\"+typeName[node.nodeType]\n      +\" name=\"\
    +node.nodeName+\"]\\n\";\n   var list = node.childNodes;\n   for (var i=0; i<list.length;\
    \ i++) {\n      out = showInterface(list.item(i), prefix+\"   \", out);\n   }\n\
    \   return out;\n}\nfunction show() {\n   var text = document.createTextNode(showInterface(document,\"\
    \",\"\"));\n   var display = document.getElementById(\"display\");\n   display.replaceChild(text,display.firstChild);\n\
    }\n</script>\n</head>\n<body>\nThis first text is in the \"body\" element directly.\n\
    <p>This second text is in a \"p\" element.</p>\n<form action=\"nothing\" method=\"\
    get\">\n   <input type=\"button\" value=\"View\" onClick=\"show();\"/>\n</form>\n\
    <pre id=\"display\">\nClick the View button to see interface names...\n</pre>\n\
    </body>\n</html>\n```\n\nNotice that I am using an array to translate `node.nodeType`\
    \ from an integer to a string.\n\nIn you run this JavaScript page in Firefox 2.0\
    \ and click the \"View\" button, you will get a nice tree list of nodes with their\
    \ types and names used in this Web page:\n\n```\n [Node type=DOCUMENT name=#document]\n\
    \   [Node type=ELEMENT name=HTML]\n      [Node type=ELEMENT name=HEAD]\n     \
    \    [Node type=COMMENT name=#comment]\n         [Node type=ELEMENT name=TITLE]\n\
    \            [Node type=TEXT name=#text]\n         [Node type=TEXT name=#text]\n\
    \         [Node type=ELEMENT name=STYLE]\n            [Node type=TEXT name=#text]\n\
    \         [Node type=TEXT name=#text]\n         [Node type=ELEMENT name=SCRIPT]\n\
    \            [Node type=TEXT name=#text]\n      [Node type=ELEMENT name=BODY]\n\
    \         [Node type=TEXT name=#text]\n         [Node type=ELEMENT name=P]\n \
    \           [Node type=TEXT name=#text]\n         [Node type=TEXT name=#text]\n\
    \         [Node type=ELEMENT name=FORM]\n            [Node type=TEXT name=#text]\n\
    \            [Node type=ELEMENT name=INPUT]\n            [Node type=TEXT name=#text]\n\
    \         [Node type=TEXT name=#text]\n         [Node type=ELEMENT name=PRE]\n\
    \            [Node type=TEXT name=#text]\n         [Node type=TEXT name=#text]\n\
    ```\n\n# [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n## [W3C's Document Object Model (DOM) Specifications](#part0134.xhtml)\n\n##\
    \ Dump Document in a New Window - JavaScript Source\n\nThis section provides a\
    \ tutorial example of JavaScript to dump the browser built-in `document` object\
    \ as an XML message in new browser window by using DOM API attributes and methods.\n\
    \nTo summarize what I have learned about DOM API specifications so far, I wrote\
    \ a JavaScript page to dump the browser built-in \"document\" object with DOM\
    \ attributes and methods, `DOM_HTML_Document_Dump.html`:\n\n```\n <html>\n<head>\n\
    <!-- DOM_HTML_Document_Dump.html\n   Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n-->\n<title>Dump HTML Document in New Window</title>\n<script type=\"\
    text/javascript\">\nfunction nodeToXML(node, indentation, out) {\n   out += indentation+\"\
    <\"+node.nodeName.toLowerCase();\n   if (node.attributes!=null) {\n      for (var\
    \ i=0; i<node.attributes.length; i++) {\n         var item = node.attributes.item(i);\n\
    \         var value = item.nodeValue;\n         if (value==null) value = \"\"\
    ;\n         out += \" \"+item.nodeName+\"=\\\"\"+value+\"\\\"\";\n      }\n  \
    \ }\n   out += \">\\n\";\n   for (var i=0; i<node.childNodes.length; i++) {\n\
