    # JavaScript 简介


    ## 引言


    本章快速介绍了 JavaScript。主题包括什么是 JavaScript；在 HTML 文档中编写 JavaScript 代码；在浏览器中运行 JavaScript
    代码；浏览器内置的 `document`。


    ## 什么是 JavaScript


    本节对什么是 JavaScript 进行快速描述。


    **什么是 JavaScript？** JavaScript 是一种主要用于编写动态 Web 页面的脚本语言。当用 JavaScript 编写的脚本嵌入 Web
    页面时，它由客户端的 Web 浏览器执行。


    JavaScript 的历史在 wikipedia.org 上有很好的总结：


    JavaScript 最初由 Netscape 的 Brendan Eich 开发，最初名为 Mocha，后来称为 LiveScript，最后重命名为 JavaScript。从
    LiveScript 到 JavaScript 的更名恰好与 Netscape 在其 Netscape Navigator Web 浏览器中增加了对 Java
    技术的支持。JavaScript 早于 1995 年 12 月在 Netscape 浏览器 2.0B3 版本中首次引入并部署。这一命名引起了困惑，给人一种该语言是
    Java 衍生语言的印象，许多人将其视为 Netscape 的营销手段，旨在赋予 JavaScript 当时热门 Web 编程语言的光誉。


    为了避免商标问题，微软将其语言的实现命名为 JScript。JScript 在 1996 年 8 月发布的 Internet Explorer 3.0 版本中首次支持，并包含了符合
    Y2K 的日期函数，与当时 JavaScript 中基于 `java.util.Date` 的函数不同。


    Netscape 将 JavaScript 提交给国际电子组织进行标准化，产生了标准化版本 ECMAScript。


    ## 总结


    *   JavaScript 是一种主要用于编写动态 Web 页面的脚本语言。

    *   官方 JavaScript 规范称为“Standard ECMA-262 - ECMAScript 2019 Language Specification”。

    *   学习 JavaScript 的最佳方法是将 JavaScript 代码嵌入 HTML 文档中并在浏览器中运行。

    *   `<script type="text/javascript">` 是在 HTML 文档中嵌入 JavaScript 代码的标签。

    *   `document.write()` 是在 HTML 文档中生成动态内容的方法。


