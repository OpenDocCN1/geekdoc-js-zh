  trans: "\nJavaScript 是一种动态类型语言。数据类型与值相关，而不是与变量相关。换句话说，声明变量不需要指定特定的数据类型。它们被赋值任何类型的值。\n\
    \n在 JavaScript 源代码中，可以像下面描述的那样以字面量的形式提供不同类型的值。\n\nJavaScript 教程 - Herong 的教程示例\n\
    \n数据类型、变量和表达式\n\n#### 数值字面量\n本节提供了对数值字面量的描述，以及一个关于如何在 JavaScript 代码中使用它们的教程示例。为了在\
    \ JavaScript 源代码中提供数字值，你需要使用以下 3 种格式的数值字面量：\n\n#### 整数字面量\n跟在可选符号字符之后的数字序列，用于表示从\
    \ `-9007199254740991` 到 `9007199254740991` 之间的整数值。例如：`2008`、`-12`。\n\n#### 十进制字面量\n\
    跟在 `0x` 或 `0X` 之后的十六进制数字序列，表示正整数或浮点值。十六进制字面量也可以带有符号字符。例如：`0x07D8`、`-0x0C`、`0xffffffffffffffff`。\n\
    \n#### 浮点字面量\n实数的科学计数法，语法如下：`(sign)(digits).e(sign)(digits)`。例如：`4.1`、`0.333333`、`-1.5e10`、`4.1e-29`。\n\
    \n在 JavaScript 中，所有数字（包括整数）都以 IEEE754 标准规定的 64 位浮点格式存储。这里有一个 JavaScript 教程示例，展示了如何在\
    \ JavaScript 代码中使用不同类型的数字字面量：\n\n```html\n<html>\n<!-- Number_Literals.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Number\
    \ Literals</title></head>\n<<body>\n<pre>\n<script type=\"text/javascript\">\n\
    \tdocument.write(2020);\n\tdocument.write('\\n');\n\n\tdocument.write(0x07E4);\n\
    \tdocument.write('\\n');\n\n   document.write(-0x0C);\n   document.write('\\n');\n\
    \n   document.write(0xffffffffffffffff);\n   document.write('\\n');\n\n   document.write(-1.51e10);\n\
    \   document.write('\\n');\n\n   document.write(4.10e-29);\n   document.write('\\\
    n');\n</script>\n</pre>\n</body>\n</html>\n```\n\n该 JavaScript 示例的输出结果为：\n\n```\n\
    2020\n2020\n-12\n1.208925819614292e+24\n-1510000000\n4.1e-29\n```\n\n#### 字符串字面量\n\
    本节提供了对字符串字面量的描述，以及一个关于如何在 JavaScript 代码中使用它们的教程示例。为了在 JavaScript 源代码中提供字符串值，你需要按照以下规则使用字符串值字面量：\n\
    \n1. 字符串字面量是 Unicode 字符序列。\n2. 字符串字面量必须包含在单引号 `'...'` 或双引号 `\"...\"` 中。\n3. 某些字符前面必须带有转义字符反斜杠\
    \ (`\\`)：`\\b`、`\\f`、`\\n`、`\\r`、`\\t`、`\\v`、`\\'`、`\\\"` 和 `\\\\`。\n4. Latin-1\
    \ 字符可以用十六进制转义序列表示。例如，`\\xA9` 表示版权符号。\n5. Unicode 字符可以用 Unicode 转义序列表示。例如，`\\u4E16`\
    \ 表示一个汉字。\n\n这里有一个 JavaScript 教程示例，展示了如何在 JavaScript 代码中使用字符串字面量：\n\n```html\n\
    <html\n<!-- String_Literals.html\n   Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n-->\n<head><title>String Literals</title></head>\n<body>\n<pre>\n\
    <script type=\"text/javascript\">\n   document.write(\"Hello World!\");\n   document.write('\\\
    n');\n\n   document.write('Herong\\'s Tutorial');\n   document.write('\\n');\n\
    \n   document.write(\"Double quote \\\"\");\n   document.write('\\n');\n\n   document.write(\"\
    Copyright \\xA9 2020.\");\n   document.write('\\n');\n\n   document.write(\"\\\
    u4E16\\u754C\\u4F60\\u597D\\uFF01\");\n   document.write('\\n');\n</script>\n\
    </pre>\n</body>\n</html>\n```\n\n该 JavaScript 示例的输出结果为：\n\n```\nHello World!\n\
    Herong's Tutorial\nDouble quote (\")\nCopyright © 2020.\n世界你好！\n```\n\n#### 声明变量\
    \ - \"var\" 语句\n本节提供了关于变量的描述，以及一个如何使用 `var` 语句声明变量的教程示例。\n\n**什么是变量？** 变量是指指向存储值的符号名称。\n\
    \n变量声明不需要特定的数据类型。它们可以被赋值任何类型的值。在 JavaScript 源代码中，可以像前面章节描述的那样以字面量的形式提供不同类型的值。\n\
    \n这里有一个 JavaScript 教程示例，展示了如何使用 `var` 语句声明变量：\n\n```html\n<html\n<!-- Variables.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Variables</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\nvar url = 'herongyang.com';\n\
    var rank = 9;\nvar title = \"Herong's Tutorial Examples\";\nvar content = undefined;\n\
    \ndocument.write(url);\ndocument.write('\\n');\n\ndocument.write(title);\ndocument.write('\\\
    n');\n\ndocument.write(rank);\ndocument.write('\\n');\n\ndocument.write(content);\n\
    document.write('\\n');\n</script>\n</pre>\n</body>\n</html>\n```\n\n该 JavaScript\
    \ 示例的输出结果为：\n\n```\nherongyang.com\nHerong's Tutorial Examples\n9\nundefined\n\
    ```\n"
- fmt: "\n# Operators and Expressions - Examples\n\nThis section provides a JavaScript\
    \ tutorial example on using arithmetic, comparison, bitwise, and assignment operators.\n\
    \nBased on the description of operators and expressions given in the previous\
    \ section, here is a JavaScript tutorial example that shows you different types\
    \ of operators:\n\n```html\n <html>\n<!-- Operators.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Operators and Expressions</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   document.write(10/3);\n \
    \  document.write('\\n');\n   document.write(10%3);\n   document.write('\\n');\n\
    \n   document.write(1>0);\n   document.write('\\n');\n   document.write('Five'>'One');\n\
    \   document.write('\\n');\n\n   document.write(10=='10');\n   document.write('\\\
    n');\n   document.write(10==='10');\n   document.write('\\n');\n\n   document.write(1<<3);\n\
    \   document.write('\\n');\n   document.write(8>>3);\n   document.write('\\n');\n\
    \n   var comment;\n   document.write(comment='Assignment is expression');\n  \
    \ document.write('\\n');\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output\
    \ of this sample JavaScript is:\n\n```\n 3.3333333333333335\n1\ntrue\nfalse\n\
    true\nfalse\n8\n1\nAssignment is expression\n```\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n# Flow Control Statements\n\nThis chapter\
    \ provides a quick introduction of JavaScript flow control statements. Topics\
    \ include 'if...then' statements, 'while' statements, 'for' statements, 'break'\
    \ statements.\n\n- [What Is a Statement](#part0020.xhtml)\n- [Conditional \"if\"\
    \ Statements](#part0021.xhtml)\n- [Conditional \"if\" Statement Examples](#part0022.xhtml)\n\
    - [\"switch ... case\" Statements](#part0023.xhtml)\n- [\"switch ... case\" Statement\
    \ Example](#part0024.xhtml)\n- [\"for\" Loop Statements](#part0025.xhtml)\n- [\"\
    for\" Loop Statement Example](#part0026.xhtml)\n- [\"while\" Loop Statements](#part0027.xhtml)\n\
    - [\"while\" Loop Statement Example](#part0028.xhtml)\n\n### Conclusion:\n\n-\
    \ JavaScript has two types of statements: Expression Statement and Keyword Statement.\n\
    - A JavaScript statement must end with semicolon (`;`).\n- Line breaks do not\
    \ end JavaScript statements.\n- JavaScript supports two types of conditional statements:\
    \ \"if ... else if ... else ...\" statements and \"switch ... case ... default\
    \ ...\" statements.\n- JavaScript supports two types of loop statements: \"for\
    \ ...\" statements and \"while ...\" statements.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n# Flow Control Statements](#part0019.xhtml)\n\
    \n## What Is a Statement\n\nThis section provides a quick description of different\
    \ types of statements and a tutorial example on how to write expression and other\
    \ statements.\n\n**What is a statement?** A statement is a basic execution unit\
    \ in JavaScript. Several notes about JavaScript statements:\n\n- A statement must\
    \ end with semicolon (`;`).\n- Line breaks do not end statements. In other words,\
    \ a single statement can be written in multiple lines, and multiple statements\
    \ can be written in a single line.\n- A statement may be consist of a very simple\
    \ expression, like a single literal; or a complex expression with assignment and\
    \ or comma operators.\n- Most statements have statement key words, like `var`,\
    \ `if`, `while`, `break`, etc.\n- Multiple statements may be grouped together\
    \ to form a statement block in the format of `{s1; s2; ...; }`.\n- Comments enclosed\
    \ in `\"/* ... */\"` or `\"// ... (end of line)\"` can be inserted anywhere inside\
    \ a statement.\n\nHere is a JavaScript tutorial example that shows you different\
    \ types of statements:\n\n```html\n <html>\n<!-- Statements.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Statements</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   var x,y,z; // A \"var\" statement\n\
    \n   x=1, y=4, z=9; /* An expression statement \n      with 3 comma operators\
    \ and 3 assignment operators.\n      The result this expression is 9.*/ \n\n \
    \  x*x; y*y; z*z; // 3 statements in 1 line\n\n   { // a statement block\n   \
    \   x *= x; \n      y *= y;\n      z *= z;\n   }\n\n   if (true) // A \"if\" statement\
    \ \n      document.write(\"7 statements in total.\");\n</script>\n</pre>\n</body>\n\
    </html>\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n# Flow Control Statements](#part0019.xhtml)\n\n## Conditional \"if\" Statements\n\
    \nThis section provides quick descriptions of different flavors of conditional\
    \ 'if' statements.\n\n\"if\" statements are called conditional statements. An\
    \ \"if\" statement allows you to create one or more statement blocks. The execution\
    \ flow will be controlled to go through one of those based on the condition. JavaScript\
    \ supports 4 flavors of \"if\" statements:\n\n1. Single-statement \"if\":\n```javascript\n\
    if (condition)\n```\nwhere `condition` is a Boolean value.\n\n2. Multi-statement\
    \ \"if\":\n```javascript\nif (condition) {\n   statement1;\n   statement2;\n}\n\
    ```\nwhere `condition` is a Boolean value.\n\n3. \"if ... else\" statement:\n\
    ```javascript\nif (condition) \n   statement\nelse\n   statement\n```\nTwo statements\
    \ or blocks are specified. But only one of them will be executed.\n\n4. \"if ...\
    \ else if\" statement:\n```javascript\nif (condition_1)\n   statement\nelse if\
    \ (condition_2)\n   statement\n...\nelse\n   statement\n```\nMany statements or\
    \ blocks are specified.\n\nA tutorial example will be given in the next section.\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n"
