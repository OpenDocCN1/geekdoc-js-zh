    \ Console in Mozilla Firefox](#part0063.xhtml)\n\n> \n\n> [JavaScript Console\
    \ in Apple Safari](#part0064.xhtml)\n\n> \n\n> [JavaScript Console in IE (Internet\
    \ Explorer)](#part0065.xhtml)\n\nConclusion:\n\n*   All popular Web browsers support\
    \ <script> tags in the HTML document to execute JavaScript codes while rendering\
    \ the HTML document.\n\n*   All popular Web browsers support DOM (Document Object\
    \ Model) API (Application Programming Interface) to allow JavaScript codes to\
    \ interact with the browser and the HTML document.\n\n*   All popular Web browsers\
    \ support events to trigger executions of JavaScript codes while user interacts\
    \ with the browser.\n\n*   All popular Web browsers support \"javascript:\" pseudo-URL\
    \ - evaluating JavaScript code in the address field of the browser.\n\n*   When\
    \ embedding JavaScript code in HTML documents, </script> should not be used directly\
    \ anywhere inside the JavaScript code.\n\n*   JavaScript code can be stored in\
    \ external files and linked to any HTML documents.\n\n*   The built-in object\
    \ \"document\" represents the embedding HTML document and provides the DOM (Document\
    \ Object Model) API for you to manipulate the HTML document.\n\n*   The built-in\
    \ object \"window\" represents the browser window and provides properties and\
    \ methods for you to interact with the browser window.\n\n*   Popular Web browsers\
    \ all provide a JavaScript console that allows you to see execution errors and\
    \ log messages. It also allow you to run JavaScript statements to interact with\
    \ the Web document.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n∟JavaScript Support\
    \ in Web Browsers\n\nThis section provides a quick description of how Web browsers\
    \ execute JavaScript codes, provide DOM API for document interaction, and provide\
    \ events to trigger JavaScript code execution.\n\nA typical Web browser will provide\
    \ support to JavaScript in 4 areas:\n\n*   Support <script> tags in the HTML document\
    \ to execute JavaScript codes while rendering the HTML document.\n\n*   Support\
    \ DOM (Document Object Model) API (Application Programming Interface) to allow\
    \ JavaScript codes to interact with the browser and the HTML document.\n\n*  \
    \ Support events to trigger executions of JavaScript codes while user interacts\
    \ with the browser.\n\n*   Support \"javascript:\" pseudo-URL - evaluating JavaScript\
    \ code in the address field of the browser.\n\nLet's use a simple JavsScript example\
    \ to illustrate those areas:\n\n```\n <html>\n<!-- DOM_and_Event.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>DOM and Event</title>\n\
    <script type=\"text/javascript\">\nvar colorID = 0;\nfunction changeColor() {\n\
    \   if (colorID == 0 )\n      document.body.bgColor = \"lightgrey\";\n   else\
    \ if (colorID == 1 )\n      document.body.bgColor = \"lightblue\";\n   else if\
    \ (colorID == 2 )\n      document.body.bgColor = \"lightgreen\";\n   else if (colorID\
    \ == 3 )\n      document.body.bgColor = \"lightyellow\";\n   colorID = (colorID+1)%4;\n\
    }\n</script>\n</head>\n<body>\n<p>\n<script type=\"text/javascript\">\n   document.write('Hello\
    \ World!');\n</script>\n</p>\n<form>\n  <input type=\"button\" value=\"Click to\
    \ change background color\"\n   onClick=\"changeColor();\"/>\n</form>\n<p>Want\
    \ to know the color code? \n<a href=\"javascript:alert(document.body.bgColor)\"\
    >Click here.</a>\n</p>\n</body>\n</html>\n```\n\nRun this JavaScript example in\
    \ a Web browser, and click the change color button. The browser will change the\
    \ background color of the page each time you click the button.\n\nIf you want\
    \ to know the code value of the current background color, you can click the hyper\
    \ link near the end of the page.\n\nNow look at the JavaScript example again.\
    \ The browser indeed supports you in 4 areas:\n\n1\\. Executes the JavaScript\
    \ code included in the \"script\" tag while rendering the HTML document:\n\n```\n\
    \ <script type=\"text/javascript\">\n   document.write('Hello World!');\n</script>\n\
    ```\n\n2\\. Provides the \"document\" object as part of the DOM API to allow the\
    \ JavaScript code to interact with the HTML document:\n\n```\n document.write('Hello\
    \ World!');\n   document.body.bgColor = \"lightgrey\";\n   ...\n```\n\n3\\. Provides\
    \ the \"onClick\" event to allow the JavaScript code to be executed:\n\n```\n\
    \ <input type=\"button\" value=\"Click to change background color\"\n   onClick=\"\
    changeColor();\"/>\n```\n\n4\\. Executes the JavaScript code included in \"javascript:\"\
    \ pseudo-URL.\n\n```\n <a href=\"javascript:alert(document.body.bgColor)\">Click\
    \ here.</a>\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n∟Including JavaScript\
    \ Codes with HTML \"script\" Tags\n\nThis section provides a quick description\
    \ of how to include JavaScript codes into HTML documents with 'script' tags. A\
    \ tutorial example is provided on calling a function defined in the 'head' tag.\n\
    \nJavaScript code is designed to be executed mainly by Web browsers on client\
    \ systems. So JavaScript code needs to be embedded in HTML documents to be delivered\
    \ to browsers.\n\nHTML document language standard supports the \"script\" tag\
    \ that allows you to include JavaScript code in HTML documents. The syntax of\
    \ the \"script\" tag looks like this:\n\n```\n <script type=\"text/javascript\"\
    \ ...>\n   ... JavaScript statements ...\n</script>\n```\n\nIn a single HTML document,\
    \ multiple \"script\" tags with JavaScript codes can be placed in different locations.\
    \ The exact locations and relations of \"script\" tags are described in following\
    \ simple rules:\n\n*   \"script\" tags can be placed inside the \"head\" tag.\n\
    \n*   \"script\" tags can be placed inside many block-level tags, like \"body\"\
    , \"p\", \"pre\", \"div\", etc.\n\n*   \"script\" tags can be placed inside many\
    \ line-level tags, like \"strong\", \"em\", \"span\", etc.\n\n*   JavaScript codes\
    \ included in \"script\" tags in the \"head\" tag will be executed before the\
    \ Web page body gets processed.\n\n*   JavaScript codes included in \"script\"\
    \ tags in the block-level and line-level tags will be executed while the Web page\
    \ body gets processed.\n\n*   JavaScript codes included in \"script\" tags will\
    \ be executed in the same order as they appear in the HTML document.\n\n*   JavaScript\
    \ codes from all \"script\" tags will be considered as a single execution session,\
    \ as if they were included in a single \"script\" tag.\n\nBased these rules, we\
    \ could define a user function in the \"head\" tag of the document, and call it\
    \ later in a \"pre\" tag in the same document. Here is a simple tutorial example\
    \ that shows this interesting behavior:\n\n```\n <html>\n<!-- Hello_World_Head.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>printHello()\
    \ Function in the \"head\" Tag</title>\n<script type=\"text/javascript\">\nfunction\
    \ printHello() {\n   document.write('Hello World!');\n}\n</script>\n</head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   printHello();\n</script>\n\
    </pre>\n</body>\n</html>\n```\n\nOf course, the output of this sample JavaScript\
    \ page will be a simple text on the page: \"Hello World!\".\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n∟type=\"text/javascript\" or language=\"JavaScript\"\n\nThis section describes\
    \ the differences type='text/javascript' or language='JavaScript' attributes.\n\
    \nWhen using the <script> tag to embed a script code in HTML documents, you can\
    \ specify the scripting language in several ways:\n\n1\\. Using type=\"text/javascript\"\
    \ attribute only - The Web browser will execute the script code as JavaScript:\n\
    \n```\n <script type=\"text/javascript\">\n   ... JavaScript code ...\n</script>\n\
    ```\n\n2\\. Using language=\"JavaScript\" attribute only - The Web browser will\
    \ execute the script code as JavaScript:\n\n```\n <script language=\"JavaScript\"\
    >\n   ... JavaScript code ...\n</script>\n```\n\n3\\. Using language=\"JavaScript1.8\"\
    \ attribute only - The Web browser will execute the script code JavaScript only\
    \ if it supports JavaScript 1.7 version:\n\n```\n <script language=\"JavaScript1.8\"\
    >\n   ... JavaScript code ...\n</script>\n```"
