    \ + \" - Updated\";\n\n   document.write(\"\\n\\nUpdated value in function:\"\
    );\n   document.write(\"\\n   globalVar = \" + globalVar);\n   document.write(\"\
    \\n   globalNoVar = \" + globalNoVar);\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThis tutorial example tests two global variables: one declared with a \"\
    var\" statement, and one without. Both variables behave identically. They are\
    \ valid and accessible inside the function. See the output:\n\n```\n Updated value\
    \ in function:\n   globalVar = Cat - Updated\n   globalNoVar = Dog - Updated\n\
    \nAfter function call:\n   globalVar = Cat - Updated\n   globalNoVar = Dog - Updated\n\
    ```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n\
    ∟[Defining and Calling Functions](#part0036.xhtml)\n\n∟Local Variables - Examples\n\
    \nThis section provides a tutorial example on how local variables behave inside\
    \ and outside functions.\n\nTo see how local variables behave inside and outside\
    \ functions, I wrote the following tutorial example:\n\n```\n <html>\n<!-- Local_Variable_Scope.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Local\
    \ Variable Scope</title></head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n   scopeCheck();\n\n   document.write(\"\\n\\nAfter function call:\");\n\n\
    \   // localVar is not a valid variable\n   // document.write(\"\\n   localVar\
    \ = \" + localVar);\n   document.write(\"\\n   localVar is not valid\");\n\n \
    \  // localNoVar is a valid variable, auto-declared by scopeCheck()\n   document.write(\"\
    \\n   localNoVar = \" + localNoVar);\n\nfunction scopeCheck() {\n   var localVar;\n\
    \   localVar = \"Apple\";\n   localNoVar = \"Orange\";\n\n   localVar = localVar\
    \ + \" - Updated\";\n   localNoVar = localNoVar + \" - Updated\";\n\n   document.write(\"\
    \\n\\nUpdated value in function:\");\n   document.write(\"\\n   localVar = \"\
    \ + localVar);\n   document.write(\"\\n   localNoVar = \" + localNoVar);\n}\n\
    </script>\n</pre>\n</body>\n</html>\n```\n\nThis tutorial example tests two \"\
    local\" variables: one declared with a \"var\" statement, and one without. They\
    \ behave differently. \"localVar\" declared with a \"var\" statement is a true\
    \ local variable. \"localNoVar\" auto-declared without a \"var\" statement becomes\
    \ a global variable. See the output:\n\n```\n Updated value in function:\n   localVar\
    \ = Apple - Updated\n   localNoVar = Orange - Updated\n\nAfter function call:\n\
    \   localVar is not valid\n   localNoVar = Orange - Updated\n```\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining and Calling\
    \ Functions](#part0036.xhtml)\n\n∟Collision of Global and Local Variables - Examples\n\
    \nThis section provides a tutorial example on how JavaScript handles local variables\
    \ collide with global variables.\n\nTo see JavaScript handles global and local\
    \ variables collide with identical names inside and outside functions, I wrote\
    \ the following tutorial example:\n\n```\n <html>\n<!-- Variable_Collision.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Variable\
    \ Collision</title></head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\
    \   var tempVar;\n   tempVar = \"Bird\";\n   tempNoVar = \"Fish\";\n\n   scopeCheck();\n\
    \n   document.write(\"\\n\\nAfter function call:\");\n   document.write(\"\\n\
    \   tempVar = \" + tempVar);\n   document.write(\"\\n   tempNoVar = \" + tempNoVar);\n\
    \nfunction scopeCheck() {\n   var tempVar;\n   tempVar = \"Bird\";\n   tempNoVar\
    \ = \"Fish\";\n\n   tempVar = tempVar + \" - Updated\";\n   tempNoVar = tempNoVar\
    \ + \" - Updated\";\n\n   document.write(\"\\n\\nUpdated value in function:\"\
    );\n   document.write(\"\\n   tempVar = \" + tempVar);\n   document.write(\"\\\
    n   tempNoVar = \" + tempNoVar);\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\
    \nThis tutorial example tests two sets variables. One set introduced outside the\
    \ function, and one set inside the function. Names of variables in one set collide\
    \ with the other set. Two \"tempVar\" declared with \"var\" statements stay as\
    \ two variables. But two \"tempNoVar\" auto-declared without \"var\" statements\
    \ become one variable. See the output:\n\n```\n Updated value in function:\n \
    \  tempVar = Bird - Updated\n   tempNoVar = Fish - Updated\n\nAfter function call:\n\
    \   tempVar = Bird\n   tempNoVar = Fish - Updated\n```\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining and Calling Functions](#part0036.xhtml)\n\
    \n∟\"return\" Statement and Return Value\n\nThis section provides a quick description\
    \ on 'return' statements and return values. A tutorial example on how return values\
    \ are passed back to calling expressions is provided.\n\nJavaScript supports \"\
    return\" statements to allow functions to return values back to calling expressions.\
    \ Here are some basic rules on the return value from a function.\n\n*   If no\
    \ return statement is used in a function, the calling expression will receive\
    \ a special value: \"undefined\".\n\n*   If the return value is a primitive value,\
    \ the calling expression will receive a copy of the return value.\n\n*   If the\
    \ return value is an object reference, the calling expression will receive a copy\
    \ of the object reference.\n\nTo help you understand different types of return\
    \ values, I wrote this JavaScript tutorial example:\n\n```\n <html>\n<!-- Return_Values.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Return\
    \ Values</title></head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n\
    \   var resValue = valueReturn();\n   var resObject = objectReturn();\n   var\
    \ resUndefined = noReturn();\n\n   document.write(\"\\n\\nAfter function calls:\"\
    );\n   document.write(\"\\n   resValue = \" + resValue);\n   document.write(\"\
    \\n   resObject = \" + resObject[0]);\n   document.write(\"\\n   resUndefined\
    \ = \" + resUndefined);\n\nfunction valueReturn() {\n   document.write(\"\\nInside\
    \ valueReturn()\");\n   var value = \"String value\";\n   return value;\n}\n\n\
    function objectReturn() {\n   document.write(\"\\nInside objectReturn()\");\n\
    \   var object = new Array(\"Array object\");\n   return object;\n}\n\nfunction\
    \ noReturn() {\n   document.write(\"\\nInside noReturn()\");\n}\n</script>\n</pre>\n\
    </body>\n</html>\n```\n\nThe output of this tutorial example shows no surprises:\n\
    \n```\n Inside valueReturn()\nInside objectReturn()\nInside noReturn()\n\nAfter\
    \ function calls:\n   resValue = String value\n   resObject = Array object\n \
    \  resUndefined = undefined\n```\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟Web Browser Supporting JavaScript\n\nThis chapter\
    \ provides introductions and tutorial examples on how Web browsers provide support\
    \ to JavaScript code embedded in HTML documents. Topics include executing JavaScript\
    \ codes embedded in 'script' tags; including JavaScript code through external\
    \ files; DOM API 'document' and 'window' objects; browser event triggers and listeners;\
    \ JavaScript console in Web browsers.\n\n> [JavaScript Support in Web Browsers](#part0049.xhtml)\n\
    \n> \n\n> [Including JavaScript Codes with HTML \"script\" Tags](#part0050.xhtml)\n\
    \n> \n\n> [type=\"text/javascript\" or language=\"JavaScript\"](#part0051.xhtml)\n\
    \n> \n\n> [JavaScript Version Supported by Browsers](#part0052.xhtml)\n\n> \n\n\
    > [Including 'script' Tags in String Literals](#part0053.xhtml)\n\n> \n\n> [Escaping\
    \ 'script' Tags in String Literals](#part0054.xhtml)\n\n> \n\n> [Using HTML Entities\
    \ to Protect HTML Tags](#part0055.xhtml)\n\n> \n\n> [Including JavaScript Codes\
    \ as External Files](#part0056.xhtml)\n\n> \n\n> [DOM API - The \"document\" Object](#part0057.xhtml)\n\
    \n> \n\n> [DOM API - The \"window\" Object](#part0058.xhtml)\n\n> \n\n> [DOM API\
    \ - The \"window.open\" Method](#part0059.xhtml)\n\n> \n\n> [Event Listeners and\
    \ Objects](#part0060.xhtml)\n\n> \n\n> ['javascript:' Pseudo-URL Addresses](#part0061.xhtml)\n\
    \n> "
