  trans: "\n\n# 4. 使用 type=\"text/javascript\" 和 language=\"JavaScript1.8\" 属性 - 网页浏览器将执行\
    \ JavaScript 代码，并且 `language=\"JavaScript1.8\"` 属性会被忽略。\n\n```html\n <script type=\"\
    text/javascript\" language=\"JavaScript1.8\">\n   ... JavaScript code ...\n</script>\n\
    ```\n\nJavaScript 教程 - Herong 的教程示例\n\n∟支持 JavaScript 的网页浏览器\n\n∟浏览器支持的 JavaScript\
    \ 版本\n\n本节描述了 `type='text/javascript'` 或 `language='JavaScript'` 属性之间的差异。\n\n\
    如果你想测试 Web 浏览器支持哪个版本的 JavaScript，可以使用以下脚本示例：\n\n```\n <html>\n<!-- JavaScript_Version_Test.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>JavaScript\
    \ Version Test</title>\n<script type=\"text/javascript\">\n   version = \"Unknown\"\
    ;\n</script>\n<script language=\"JavaScript1.1\">\n   version = \"JavaScript1.1\"\
    ;\n</script>\n<script language=\"JavaScript1.2\">\n   version = \"JavaScript1.2\"\
    ;\n</script>\n<script language=\"JavaScript1.3\">\n   version = \"JavaScript1.3\"\
    ;\n</script>\n<script language=\"JavaScript1.4\">\n   version = \"JavaScript1.4\"\
    ;\n</script>\n<script language=\"JavaScript1.5\">\n   version = \"JavaScript1.5\"\
    ;\n</script>\n<script language=\"JavaScript1.6\">\n   version = \"JavaScript1.6\"\
    ;\n</script>\n<script language=\"JavaScript1.7\">\n   version = \"JavaScript1.7\"\
    ;\n</script>\n<script language=\"JavaScript1.8\">\n   version = \"JavaScript1.8\"\
    ;\n</script>\n</head>\n<body>\n<p>Version supported: \n<script type=\"text/javascript\"\
    >\n   document.writeln(version);\n</script>\n</p>\n</body>\n</html>\n```\n\n以下是我的测试结果：\n\
    \n```\n Google Chrome: JavaScript1.7\nApple Safari: JavaScript1.7\nMozilla Firefox:\
    \ JavaScript1.5 \nInternet Explorer 11: JavaScript1.3 \n```\n\nJavaScript 教程 -\
    \ Herong 的教程示例\n\n∟支持 JavaScript 的网页浏览器\n\n∟在字符串面量中包含 'script' 标签\n\n本节提供了一个教程示例，展示了在\
    \ HTML 文档字符串面量中包含 'script' 标签的问题。\n\n正如我们在上一节中学到的，JavaScript 代码必须包含在 HTML 文档的\
    \ \"script\" 标签中，例如：`<script ...> JavaScript 代码 </script>`。这对 JavaScript 代码增加了额外的限制：\n\
    \n*切勿在你的 JavaScript 代码的任何地方直接包含 `</script>`。*\n\n如果你在 JavaScript 代码中直接使用 `</script>`，将导致网页浏览器或服务器提前结束你的\
    \ JavaScript 代码，并引起执行错误。以下是直接包含 `</script>` 的教程示例：\n\n```html\n <html>\n<!-- Escape_Script_Tag.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Escaping\
    \ Script Tags</title></head>\n<body><pre>\n<script type=\"text/javascript\">\n\
    \   document.writeln(\"Question: How to use the <script> tag?\");\n   document.writeln(\"\
    Answer: <script>...Script Code...</script>\");\n   document.writeln(\"Rate this\
    \ answer: 1 | 2 | 3 | 4 | 5\");\n</script>\n</pre></body>\n</html>\n```\n\n如果你在浏览器中运行此示例脚本，你将得到：\n\
    \n```\n \");\n   document.writeln(\"Rate this answer: 1 | 2 | 3 | 4 | 5\");\n\
    ```\n\n感到惊讶吗？并不如此。以下是浏览器处理此 HTML 文档时发生的情况：\n\n*   当浏览器到达 `document.writeln()`\
    \ 语句字符串面量中包含的 `</script>` 标签时，它将结束 JavaScript 代码。\n*   提前结束的 JavaScript 代码不会向\
    \ HTML 文档写入任何内容，因为最后一条语句是不完整的。\n*   `</script>` 之后的剩余 JavaScript 代码将作为 HTML 文档的静态文本处理。这就是为什么它会在浏览器窗口中显示出来。\n\
    \n请查看下一节了解如何解决这个问题。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟支持 JavaScript 的网页浏览器\n\
    \n∟在字符串面量中转义 'script' 标签\n\n本节提供了一个教程示例，介绍如何在 'script' 标签中使用转义字符来防止浏览器提前结束嵌入的\
    \ JavaScript 代码。\n\n现在让我们尝试修复在上一节中发现的问题。\n\n第一个修复方法是使用反斜杠字符（\\`）来转义 `</script>`\
    \ 标签中的（/`。这个额外的反斜杠将阻止浏览器将此标签识别为 JavaScript 代码的结束。同时，JavaScript 引擎将忽略这个反斜杠，并以与没有额外反斜杠相同评估字符串面量。\n\
    \n以下是带有额外反斜杠字符修改后的 HTML 文档：\n\n```html\n <html>\n<!-- Escape_Script_Tag_Backslash.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Escaping\
    \ Script Tags</title></head>\n<body><pre>\n<script type=\"text/javascript\">\n\
    \   document.writeln(\"Question: How to use the <script> tag?\");\n   document.writeln(\"\
    Answer: <script>...Script Code...<\\/script>\");\n   document.writeln(\"Rate this\
    \ answer: 1 | 2 | 3 | 4 | 5\");\n</script>\n</pre></body>\n</html>\n```\n\n如果你在浏览器中运行此示例脚本，你将得到：\n\
    \n```\n Question: How to use the \nRate this answer: 1 | 2 | 3 | 4 | 5\n```\n\n\
    好些了吗？是的。但仍然不是我们预期的。这里是浏览器处理此 HTML 文档时发生的情况：\n\n*   浏览器正确跳过了 `<\\/script>` 并到达\
    \ JavaScript 代码的结尾。\n*   整个 JavaScript 代码现在正确执行，没有报错。\n\n换句话说，现在 JavaScript 代码中没有错误。JavaScript\
    \ 代码插入了以下内容：\n\n```\n Question: How to use the <script>\nAnswer: <script>...Script\
    \ Code...\nRate this answer: 1 | 2 | 3 | 4 | 5\n```\n\n当浏览器渲染此内容时，它会将 \"script\"\
    \ 标签视为 HTML 标签。\n\n请查看下一节如何在 HTML 文档中保护 \"script\" 标签。\n\nJavaScript 教程 - Herong\
    \ 的教程示例\n\n∟支持 JavaScript 的网页浏览器\n\n∟使用 HTML 实体来保护 HTML 标签\n\n本节提供了一个教程示例，介绍如何使用\
    \ HTML 实体 `&lt;` 和 `&gt;` 来保护 HTML 标签。\n\n为了完全解决我们在上一节看到的问题，我们需要使用 HTML 实体来替换\
    \ `<` 和 `>`, 如果你想让某些 HTML 标签显示页面。\n\n以下是使用 `&lt;` 和 `&gt;` 实体的修改后的 HTML 文档：\n\n\
    ```html\n <html>\n<!-- Escape_Script_Tag_HTML_Entity.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Escaping Script Tags</title></head>\n\
    <body><pre>\n<script type=\"text/javascript\">\n   document.writeln(\"Q: How to\
    \ use the &lt;script&gt; tag?\");\n   document.writeln(\"A: &lt;script&gt;...Code...&lt;\\\
    /script&gt;\");\n   document.writeln(\"Rate this answer: 1 | 2 | 3 | 4 | 5\");\n\
    </script>\n</pre></body>\n</html>\n```\n\n如果你在浏览器中运行此示例脚本，你将得到：\n\n```\n Q: How\
    \ to use the <script> tag?\nA: <script>...Code...</script>\nRate this answer:\
    \ 1 | 2 | 3 | 4 | 5\n```\n\n最后，我们得到了想要的！\n\nJavaScript 教程 - Herong 的教程示例\n\n∟支持\
    \ JavaScript 的网页浏览器\n\n∟将 JavaScript 代码作为外部文件引入\n\n本节简要介绍了如何将 JavaScript 代码保存到单独的文件并使用\
    \ 'script' 标签将其包含在 HTML 文档中提供了一个调用存储在单独 JavaScript 文件中的函数的教程示例。\n\n为了测试此功能，我编写了以下\
    \ JavaScript 代码并保存为文件 `Hello_World_Function.js`：\n\n```javascript\n function printHello()\
    \ {\n   document.write('Hello World!');\n}\n```\n\n"
- fmt: "\nNow I can modify my HTML document in the previous section to retrieve this\
    \ file with a `\"script\"` tag:\n\n```\n <html>\n<!-- Hello_World_Head_Include.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>printHello()\
    \ Function in an Include File</title>\n<script type=\"text/javascript\" src=\"\
    Hello_World_Function.js\">\n</script>\n</head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n   printHello();\n</script>\n</pre>\n</body>\n</html\n```\n\
    \nOf course, the output of the modified JavaScript page will be the same text:\
    \ \"Hello World!\".\n\nWhile testing this `\"src\"` attribute of the `\"script\"\
    ` tag, I also notice that the shorthand form of the empty tag does not work:\n\
    \n```\n <script type=\"text/javascript\" src=\"JavaScript_file_URL\"/>\n```\n\n\
    You must use the close tag `</script>` explicitly!\n\n[JavaScript Tutorials -\
    \ Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n### DOM API - The \"document\" Object\n\nThis section provides a quick description\
    \ of the `'document'` object of the DOM API. A tutorial example is provided on\
    \ building a simple HTML document with the `'document'` object.\n\nA typical Web\
    \ browser provides the DOM (Document Object Model) API (Application Programming\
    \ Interface) to allow JavaScript codes to interact with the browser and the HTML\
    \ document.\n\nThe most commonly used object in the DOM API is the `\"document\"\
    ` object, which has the following features:\n\n*   The `\"document\"` object is\
    \ a browser built-in object that represents the current HTML document in the browser.\n\
    *   The `\"document\"` object represents all elements in the HTML document with\
    \ tree structure of `\"node\"` objects.\n*   The `\"document\"` object and its\
    \ `\"node\"` objects offer various methods to allow you to manipulate the HTML\
    \ document.\n*   The `\"document\"` object share the same programming interface\
    \ in JavaScript and other programming languages.\n\nTo illustrate some nice features\
    \ of the `\"document\"` object, I wrote this JavaScript tutorial example:\n\n\
    ```\n <html>\n<!-- Document_Object.html\n   Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n-->\n<head>\n<title>Document Object</title>\n<script type=\"\
    text/javascript\">\nfunction buildDocument() {\n   // Building a <p> tag\n   var\
    \ paragraph = document.createElement(\"p\");\n   var text = document.createTextNode(\"\
    Hello World!\");\n   paragraph.appendChild(text);\n\n   // Inserting the <p> tag\n\
    \   document.body.appendChild(paragraph);\n   document.body.bgColor = \"lightblue\"\
    ;\n}\n</script>\n</head>\n<body onLoad=\"buildDocument();\"/>\n</html>\n```\n\n\
    If you run this JavaScript page in a browser, you will see the \"Hello World!\"\
    \ paragraph with light blue background.\n\nFor more tutorial examples on the `\"\
    document\"` object, see the DOM API chapters in this book.\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n### DOM API - The \"window\" Object\n\nThis section provides a quick description\
    \ of the `'window'` object of the DOM API. A tutorial example is provided on retrieving\
    \ properties from the current browser window.\n\nThe DOM API provided by the Web\
    \ browser contains another useful object called `\"window\"`, which has the following\
    \ features:\n\n*   The `\"window\"` object is a browser built-in object that represents\
    \ the browser window that contains the current HTML document.\n*   The `\"window\"\
    ` object offers a number of properties to allow you to retrieve information about\
    \ the current window.\n*   The `\"window\"` object offers a method called `open()`\
    \ to allow you to create a new window and obtain a new window object.\n*   The\
    \ new window object created by yourself offers a number of methods to allow you\
    \ to manipulate it.\n*   For security reasons, the window manipulation methods\
    \ will not work on the current window object `\"window\"`.\n\nTo illustrate how\
    \ to retrieve properties from the current window, I wrote this JavaScript tutorial\
    \ example:\n\n```\n <html>\n<!-- Window_Properties.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Window Properties</title>\n<script\
    \ type=\"text/javascript\">\nfunction getWindowProperties() {\n   var text = \"\
    \";\n   text += \"'document' property: \"+ window.document.title+\"\\n\";\n  \
    \ text += \"'location' property: \"+ window.location.pathname+\"\\n\";\n   text\
    \ += \"'history' property: \"+ window.history.length+\"\\n\";\n   text += \"'navigator'\
    \ property: \"+ window.navigator.appCodeName+\"\\n\";\n   text += \"'outerWidth,outerHeight'\
    \ property: \"\n      + window.outerWidth+\",\"+ window.outerHeight+\"\\n\";\n\
    \   text += \"'innerWidth,innerHeight' property: \"\n      + window.innerWidth+\"\
    ,\"+ window.innerHeight+\"\\n\";\n   text += \"'screenX,screenY' property: \"\n\
    \      + window.screenX+\",\"+ window.screenY+\"\\n\";\n   return text;\n}\n</script>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n   document.write(getWindowProperties());\n\
    </script>\n</pre>\n</body>\n</html\n```\n\nRun this JavaScript example in Firefox\
    \ browser, you will get something like this:\n\n```\n 'document' property: Window\
    \ Properties\n'location' property: /C:/herong/Window_Properties.html\n'history'\
    \ property: 1\n'navigator' property: Mozilla\n'outerWidth,outerHeight' property:\
    \ 1024\n768\n'innerWidth,innerHeight' property: 1024\n754\n'screenX,screenY' property:\
    \ 0\n0\n```\n"
  raw: "Now I can modify my HTML document in the previous section to retrieve this\
    \ file with a \"script\" tag:\n\n```\n <html>\n<!-- Hello_World_Head_Include.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>printHello()\
    \ Function in an Include File</title>\n<script type=\"text/javascript\" src=\"\
    Hello_World_Function.js\">\n</script>\n</head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n   printHello();\n</script>\n</pre>\n</body>\n</html>\n```\n\
    \nOf course, the output of the modified JavaScript page will be the same text:\
    \ \"Hello World!\".\n\nWhile testing this \"src\" attribute of the \"script\"\
    \ tag, I also notice that the shorthand form of the empty tag does not work:\n\
    \n```\n <script type=\"text/javascript\" src=\"JavaScript_file_URL\"/>\n```\n\n\
    You must use the close tag </script> explicitly!\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n∟DOM API - The \"document\" Object\n\nThis section provides a quick description\
    \ of the 'document' object of the DOM API. A tutorial example is provided on building\
    \ a simple HTML document with the 'document' object.\n\nA typical Web browser\
    \ provides the DOM (Document Object Model) API (Application Programming Interface)\
    \ to allow JavaScript codes to interact with the browser and the HTML document.\n\
    \nThe most commonly used object in the DOM API is the \"document\" object, which\
    \ has the following features:\n\n*   The \"document\" object is a browser built-in\
    \ object that represents the current HTML document in the browser.\n\n*   The\
    \ \"document\" object represents all elements in the HTML document with tree structure\
    \ of \"node\" objects.\n\n*   The \"document\" object and its \"node\" objects\
    \ offer various methods to allow you to manipulate the HTML document.\n\n*   The\
    \ \"document\" object share the same programming interface in JavaScript and other\
    \ programming languages.\n\nTo illustrate some nice features of the \"document\"\
    \ object, I wrote this JavaScript tutorial example:\n\n```\n <html>\n<!-- Document_Object.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Document\
    \ Object</title>\n<script type=\"text/javascript\">\nfunction buildDocument()\
    \ {\n   // Building a <p> tag\n   var paragraph = document.createElement(\"p\"\
    );\n   var text = document.createTextNode(\"Hello World!\");\n   paragraph.appendChild(text);\n\
    \n   // Inserting the <p> tag\n   document.body.appendChild(paragraph);\n   document.body.bgColor\
    \ = \"lightblue\";\n}\n</script>\n</head>\n<body onLoad=\"buildDocument();\"/>\n\
    </html>\n```\n\nIf you run this JavaScript page in a browser, you will see the\
    \ \"Hello World!\" paragraph with light blue background.\n\nFor more tutorial\
    \ examples on the \"document\" object, see the DOM API chapters in this book.\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Web\
    \ Browser Supporting JavaScript](#part0048.xhtml)\n\n∟DOM API - The \"window\"\
    \ Object\n\nThis section provides a quick description of the 'window' object of\
    \ the DOM API. A tutorial example is provided on retrieving properties from the\
    \ current browser window.\n\nThe DOM API provided by the Web browser contains\
    \ another useful object called \"window\", which has the following features:\n\
    \n*   The \"window\" object is a browser built-in object that represents the browser\
    \ window that contains the current HTML document.\n\n*   The \"window\" object\
    \ offers a number of properties to allow you to retrieve information about the\
    \ current window.\n\n*   The \"window\" object offers a method called open() to\
    \ allow you to create a new window and obtain a new window object.\n\n*   The\
    \ new window object created by yourself offers a number of methods to allow you\
    \ to manipulate it.\n\n*   For security reasons, the window manipulation methods\
    \ will not work on the current window object \"window\".\n\nTo illustrate how\
    \ to retrieve properties from the current window, I wrote this JavaScript tutorial\
    \ example:\n\n```\n <html>\n<!-- Window_Properties.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Window Properties</title>\n<script\
    \ type=\"text/javascript\">\nfunction getWindowProperties() {\n   var text = \"\
    \";\n   text += \"'document' property: \"+ window.document.title+\"\\n\";\n  \
    \ text += \"'location' property: \"+ window.location.pathname+\"\\n\";\n   text\
    \ += \"'history' property: \"+ window.history.length+\"\\n\";\n   text += \"'navigator'\
    \ property: \"+ window.navigator.appCodeName+\"\\n\";\n   text += \"'outerWidth,outerHeight'\
    \ property: \"\n      + window.outerWidth+\",\"+ window.outerHeight+\"\\n\";\n\
    \   text += \"'innerWidth,innerHeight' property: \"\n      + window.innerWidth+\"\
    ,\"+ window.innerHeight+\"\\n\";\n   text += \"'screenX,screenY' property: \"\n\
    \      + window.screenX+\",\"+ window.screenY+\"\\n\";\n   return text;\n}\n</script>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n   document.write(getWindowProperties());\n\
    </script>\n</pre>\n</body>\n</html>\n```\n\nRun this JavaScript example in Firefox\
    \ browser, you will get something like this:\n\n```\n 'document' property: Window\
    \ Properties\n'location' property: /C:/herong/Window_Properties.html\n'history'\
    \ property: 3\n'navigator' property: Mozilla\n'outerWidth,outerHeight' property:\
    \ 1024,608\n'innerWidth,innerHeight' property: 1006,485\n'screenX,screenY' property:\
    \ 72,73\n```\n\nThis tutorial shows that:\n\n*   \"window.document\" returns the\
    \ \"document\" object representing the content of the page in the current window.\n\
    \n*   \"window.location\" returns the \"location\" object representing the page\
    \ address in the current window.\n\n*   \"window.history\" returns the \"history\"\
    \ object representing a list web addresses visited in the current window.\n\n\
    *   \"window.navigator\" returns the \"navigator\" object representing the browser.\n\
    \n*   \"window.outerWidth and window.outerHeight\" returns the outer size of the\
    \ current window including the border, browser menu, and other browser elements.\n\
    \n*   \"window.innerWidth and window.innerHeight\" returns the inner size of the\
    \ current window excluding the border, browser menu, and other browser elements.\n\
    \n*   \"window.screenX and window.screenY\" returns the top left corner location\
    \ of the current window in the screen.\n\nSee the next tutorial on how to create\
    \ a new Window with the window.open() method.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n∟DOM API - The \"window.open\" Method\n\nThis section provides a quick description\
    \ of the 'window' object of the DOM API. A tutorial example is provided on changing\
    \ browser window size through the 'window' object.\n\nThe built-in object \"window\"\
    \ also allows you to create a new browser window and returns a new window object.\
    \ You can manipulate the new browser window through this object.\n\nHere is JavaScript\
    \ tutorial example that uses the window.open() method to create a new window:\n\
    \n```\n <html>\n<!-- Window_Object.html\n   Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n-->\n<head>\n<title>Window Object</title>\n<script type=\"\
    text/javascript\">\nvar mySize = 0;\nvar myWin;\n\nfunction openWin() {\n   myWin\
    \ = window.open('','','left=300,top=100,width=600,height=600');\n   myWin.focus();\n\
    }\n\nfunction changeSize() {\n   if (mySize == 0 )\n      myWin.resizeTo(300,300);\
    \ \n   else if (mySize == 1 )\n      myWin.resizeTo(400,400); \n   else if (mySize\
    \ == 2 )\n      myWin.resizeTo(500,500); \n   else if (mySize == 3 )\n      myWin.resizeTo(600,600);\
    \ \n   mySize = (mySize+1)%4;\n   myWin.focus();\n}\n\nfunction closeWin() {\n\
    \   myWin.close();\n}\n\n</script>\n</head>\n<body>\n<p>Click \"Create Window\"\
    \ first start the test:</p>\n<p><form>\n  <input type=\"button\" value=\"Create\
    \ Window\" onClick=\"openWin();\"/>\n  <input type=\"button\" value=\"Resize Window\"\
    \ onClick=\"changeSize();\"/>\n  <input type=\"button\" value=\"Close Window\"\
    \ onClick=\"closeWin();\"/>\n</form></p>\n</body>\n</html>\n```\n\nRun this JavaScript\
    \ example in a Web browser and follow these steps to test this tutorial:\n\n*\
    \   Click the \"Create Window\" button, you will a new browser window created.\n\
    \n*   Click the \"Resize Window\" button, the new browser window size will be\
    \ changed."
