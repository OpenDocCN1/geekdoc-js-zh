    \ of the prototype, and so on.\n\n*   The root prototype has some built-in properties\
    \ and methods: constructor, hasOwnProperty(), isPrototypeOf(), toString() and\
    \ valueOf().\n\n*   Properties and methods can be added locally to individual\
    \ object instances.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
