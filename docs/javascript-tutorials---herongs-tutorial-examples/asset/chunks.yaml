    \ For example: 4.13, 0.333333, -1.51e10, 4.10e-29, etc.\n\nIn JavaScript, all\
    \ numbers, including integers, are stored in 64-bit floating point format as described\
    \ in the IEEE 754 standard.\n\nHere is a JavaScript tutorial example that shows\
    \ you how to use different types of number literals in JavaScript source code:\n\
    \n```\n <html>\n<!-- Number_Literals.html\n   Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n-->\n<head><title>Number Literals</title></head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n\t document.write(2020);\n\t document.write('\\\
    n');\n\n\t document.write(0x07E4);\n\t document.write('\\n');\n\n   document.write(-0x0C);\n\
    \   document.write('\\n');\n\n   document.write(0xffffffffffffffffffff);\n   document.write('\\\
    n');\n\n   document.write(-1.51e10);\n   document.write('\\n');\n\n   document.write(4.10e-29);\n\
    \   document.write('\\n');\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output\
    \ of this sample JavaScript is:\n\n```\n 2020\n2020\n-12\n1.2089258196146292e+24\n\
    -15100000000\n4.1e-29\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Data Types, Variables and Expressions](#part0012.xhtml)\n\n∟String Literials\n\
    \nThis section provides descriptions on string literals and a tutorial example\
    \ on how to use them in JavaScript source code.\n\nTo provide values of strings\
    \ in JavaScript source code, you need to use string value literals following these\
    \ rules:\n\n1\\. String literals are sequences of Unicode characters.\n\n2\\.\
    \ String literals must be enclosed in single quotes ('...') or double quotes (\"\
    ...\").\n\n3\\. Several characters must be preceded with the escaping character,\
    \ backslash (\\): \\b, \\f, \\n, \\r, \\t, \\v, \\', \\\", and \\\\.\n\n4\\. Latin-1\
    \ characters can be presented as hexadecimal escape sequences. For example, \\\
    xA9 represents the copyright symbol.\n\n5\\. Unicode characters can be presented\
    \ as Unicode escape sequences. For example, \\u4E16 represents a Chinese character.\n\
    \nHere is a JavaScript tutorial example that shows you how to use string literals\
    \ in JavaScript source code:\n\n```\n <html>\n<!-- String_Literals.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>String Literals</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   document.write(\"Hello World!\"\
    );\n   document.write('\\n');\n\n   document.write('Herong\\'s Tutorial');\n \
    \  document.write('\\n');\n\n   document.write(\"Double quote (\\\")\");\n   document.write('\\\
    n');\n\n   document.write(\"Copyright \\xA9 2020.\");\n   document.write('\\n');\n\
    \n   document.write(\"\\u4E16\\u754C\\u4F60\\u597D\\uFF01\");\n   document.write('\\\
    n');\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output of this sample JavaScript\
    \ is:\n\n```\n Hello World!\nHerong's Tutorial\nDouble quote (\")\nCopyright ©\
    \ 2020.\n世界你好！\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Data Types, Variables and Expressions](#part0012.xhtml)\n\n∟Declaring Variables\
    \ - \"var\" Statements\n\nThis section provides descriptions on variables and\
    \ a tutorial example on how to declare variables with 'var' statements.\n\n**What\
    \ are variables?** Variables are symbolic names that refer to values stored in\
    \ the memory.\n\nVariable names must be sequences of alphanumeric characters and\
    \ underscore (_). But the first character can not be a numeric character. (_5star)\
    \ is a valid variable name. But (5star) is not an invalid variable name.\n\nVariable\
    \ can be used without declaration. But it is strongly recommended that all variables\
    \ are declared with \"var\" statements in the following syntax formats:\n\n```\n\
    \ var var_name_1;\nvar var_name_1 = value_1;\nvar var_name_1, var_name_2, var_name_3,\
    \ ...; \nvar var_name_1 = value_1, var_name_1 = value_1, ...;\n```\n\nIf a variable\
    \ is declared without initial value, it contains the \"undefined\" value.\n\n\
    Here is a JavaScript tutorial example that shows you how to declare variables\
    \ with \"var\" statements:\n\n```\n <html>\n<!-- Variables.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Variables</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   var site_url = 'herongyang.com';\n\
    \   var site_rank = 9;\n   var site_content;\n\n   site_title = \"Herong's Tutorial\
    \ Examples\"; // should be declared first\n\n   document.write(site_url);\n  \
    \ document.write('\\n');\n   document.write(site_title);\n   document.write('\\\
    n');\n   document.write(site_rank);\n   document.write('\\n');\n   document.write(site_content);\n\
    \   document.write('\\n');\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output\
    \ of this sample JavaScript is:\n\n```\n herongyang.com\nHerong's Tutorial Examples\n\
    9\nundefined\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Data Types, Variables and Expressions](#part0012.xhtml)\n\n∟Operators and\
    \ Expressions\n\nThis section provides descriptions on operators and expressions,\
    \ including arithmetic, comparison, logical, bitwise, and assignment operators.\n\
    \n**What are expressions?** Expressions are sequences of literals, variables,\
    \ and operators that can be evaluated to values.\n\nOperators are the most important\
    \ parts of expressions. JavaScripts basic operators divided into several groups:\n\
    \n1\\. Arithmetic Operator - Taking numeric values and returning a single numeric\
    \ value. Arithmetic operators include addition (+), subtraction (-), multiplication\
    \ (*), and division (/), modulus (%), increment (++), decrement (--), and unary\
    \ negation (-).\n\n2\\. Comparison Operator - Taking values of any types and returning\
    \ a single boolean value. Comparison operators include equal (==), not equal (!=),\
    \ strict equal (===), strict not equal (!==), greater than (>), greater than or\
    \ equal (>=), less than (<), and less than or equal (<=).\n\n3\\. Logical Operator\
    \ - Taking boolean values and returning a single boolean value. Logical operators\
    \ include logical AND (&&), logical OR (||), and logical NOT (!).\n\n4\\. Bitwise\
    \ Operator - Taking bit strings of 32 bits and returning a single numeric value.\
    \ Bitwise operators include bitwise AND (&), bitwise OR (|), bitwise XOR (^),\
    \ bitwise NOT (~), left shift (<<), sign-propagating right shift (>>), and zero-fill\
    \ right shift (>>>).\n\n5\\. Assignment Operator - Taking a value of any type\
    \ and returning a single value. An assignment operator assigns a value to its\
    \ left operand based on the value of its right operand. Assignment operators include\
    \ simple assignment (=), assignments combined with arithmetic operators (+=, -=,\
    \ *=, /=, %=), and assignments combined with bitwise operators (&=, ^=, |=, <<=,\
    \ >>=, >>>=).\n\nA tutorial example will be given in the next section showing\
    \ examples of different operators and expressions.\n\n[JavaScript Tutorials -\
    \ Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Data Types, Variables and\
    \ Expressions](#part0012.xhtml)"
