  trans: "\n\n请注意，所有的 `jrunscript` 命令都是在单命令行中输入的。我将它们分成多行，是因为书籍的页面宽度有限。\n\n# JavaScript\
    \ 教程 - Herong 的教程示例\n\n## ['jrunscript' - JDK 中的 JavaScript 壳命令\n\n### 使用 'jrunscript'\
    \ 交互式评估 JavaScript 代码\n\n本节提供了一个如何使用 `jrunscript` 以交互模式评估 JavaScript 代码的教程示例。每一行都会作为表达式进行评估。结果将打印在屏幕上。\n\
    \n使用 `jrunscript` 运行 JavaScript 代码的另一种方法是使用交互模式。关于使用 `jrunscript` 交互模式的几点注意事项：\n\
    \n- 每一行代码都会立即作为表达式进行评估。\n- 每一行代码必须是一个或多个完整的语句。单个语句不能跨行输入。\n- 如果单行代码中涉及多个表达式，则最后一个表达式的值会在评估结束时打印在屏幕上。\n\
    \n我对 `jrunscript` 交互模式进行了多次测试，并将其中一些结果记录在下方：\n\n```\n C:\\herong>\\progra~1\\\
    java\\jdk-10.0.1\\bin\\jrunscript \n\nnashorn> println(\"Hello World!\");\nHello\
    \ World!\n\nnashorn> x = \"Apple\"; y = \"Orange\";\nOrange\n\nnashorn> println(x\
    \ + ' and ' + y);\nApple and Orange\n\nnashorn> var s = 0;\n\nnashorn> for ( i=1;\
    \ i<=100; i++) {\nscript error: sun.org.mozilla.javascript.internal.EvaluatorException:\
    \ \n   missing } in compound statement (<STDIN>#1) in <STDIN> at \n   line number\
    \ 1\n\nnashorn> for ( i=1; i<=100; i++) { s += i; }\n5050.0\n\nnashorn> println(s);\n\
    5050\n\njs> exit();\n```\n\n# JavaScript 教程 - Herong 的教程示例\n\n## ['jrunscript'\
    \ - JDK 中的 JavaScript 壳命令\n\n### 使用 'jrunscript' 运行 JavaScript 代码文件\n\n本节提供了一个如何使用\
    \ `jrunscript` 以批模式运行 JavaScript 代码文件的教程示例。\n\n使用 `jrunscript` 的最佳方法可能是以批模式运行，即在命令行中指定\
    \ JavaScript 代码文件。`jrunscript` 将一次性处理整个代码文件。\n\n为了测试批模式下的 `jrunscript`，我将我现有的一个\
    \ JavaScript Web 页面文件修改为纯 JavaScript 代码文件，`For_Loop_Statements.js`：\n\n```\n //\
    \ For_Loop_Statements.js\n// Copyright (c) HerongYang.com. All Rights Reserved.\n\
    \n   var i, j, is_prime;\n   for ( i=3; i<=30; i+=2 ) {\n      is_prime = true;\n\
    \      for ( j=2; j<=i/2; j++) {\n         is_prime = i%j > 0;\n         if (!is_prime)\
    \ break;\n      }\n      if (is_prime)\n//       document.write(\"Found a prime\
    \ number: \" + i + \".\\n\");\n         print(\"Found a prime number: \" + i +\
    \ \".\\n\");\n   }\n```\n\n注意，我必须将 `document.write()` 方法更改为 `print()` 方法，因为只有在\
    \ Web 浏览器中执行脚本时 `document` 对象才可用。以下是我如何使用 `jrunscript` 运行此脚本文件的：\n\n```\n C:\\\
    herong>\\progra~1\\java\\jdk-10.0.1\\bin\\jrunscript \\\n   -f For_Loop_Statements.js\n\
    \nFound a prime number: 3.\nFound a prime number: 5.\nFound a prime number: 7.\n\
    Found a prime number: 11.\nFound a prime number: 13.\nFound a prime number: 17.\n\
    Found a prime number: 19.\nFound a prime number: 23.\nFound a prime number: 29.\n\
    ```\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 将函数作为“函数”对象使用\n\n本章介绍了作为对象的函数的教程示例。主题包括内置对象类型\
    \ `Function`；使用 `Function()` 构造函数创建函数；函数实例以及继承的属性和方法；`function` 语句和运算符。\n\n- 函数是“Function”类型的对象\n\
    - 使用 Function 构造函数\n- 函数对象的继承属性和方法\n- 函数对象的实例属性\n- 使用 \"function\" 语句创建函数对象\n\
    - 使用 \"function\" 运算符创建函数对象\n- 比较创建的三种方法\n\n结论：\n\n- JavaScript 函数实际上是 `Function`\
    \ 对象类型的实例。\n- 你可以通过调用 `Function` 构造函数来创建一个新函数：`new Function(\"arg_1\", \"arg_2\"\
    , ..., \"function_body\")`。\n- `Function` 对象具有内置属性和方法：`length`、`apply()`、`call()`\
    \ 和 `toString()`。\n- 你可以为 `Function` 对象实例添加额外的属性和方法。\n- `function` 语句实际上是 `function`\
    \ 操作的一个表达式，它返回一个指向新 `Function` 对象的引用。\n\n# JavaScript 教程 - Herong 的教程示例\n\n##\
    \ 将函数作为“函数”对象使用\n\n### 函数是“Function”类型的对象\n\n本节提供了 JavaScript 语言一个独特性的概述：函数是 `Function`\
    \ 类型的对象。\n\nJavaScript 语言一个非常有趣的特性是，函数是 `Function` 对象类型的对象。将函数视为对象可以带来若干编程影响：\n\
    \n- JavaScript 支持一种名为 `Function` 的特殊内置对象类型。\n- 可以使用 `Function()` 构造函数创建函数。\n-\
    \ 函数具有继承的属性和方法：`length`、`apply()`、`call()` 和 `toString()`。\n- 函数可以有自己的实例属性 - 在多次函数调用之间共享值的一种良好方法。\n\
    - 函数可以作为表达式的一部分创建。\n- 函数可以作为参数传递给其他函数。\n\n函数可以通过 3 种不同的方式创建：\n\n- 使用 `function`\
    \ 声明语句 - 以传统方式创建函数。\n- 使用 `function` 运算符 - 在评估表达式时作为函数字面量动态创建函数。\n- 使用 `Function()`\
    \ 构造函数 - 以面向对象的方式创建函数。\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 将函数作为“函数”对象使用\n\
    \n### 使用 Function 构造函数\n\n本节提供了一个如何使用 `Function` 对象类型构造函数定义新函数的教程示例。\n\nJavaScript\
    \ 提供了 `Function` 作为内置对象类型。`Function` 类型的构造函数具有以下调用签名：\n\n```\n new Function(\"\
    arg_1\", \"arg_2\", ..., \"function_body\");\n```\n\n其中最后一个参数是形成新函数体的语句列表，而所有其他参数都是新函数的参数名称。\n\
    \n下面的教程示例向你展示如何使用 `Function` 对象类型构造函数定义新函数：\n\n```\n // Function_Constructor.js\n\
    // Copyright (c) HerongYang.com. All Rights Reserved.\n\n// 定义一个没有参数的新函数\n   var\
    \ hello = new Function(\n      \"println(\\\"Hello World!\\\");\"\n   )\n\n//\
    \ 调用函数\n   hello();\n\n// 定义一个带有一个参数的新函数\n   var f2c = new Function(\"fahrenheit\"\
    ,\n      \"println(\\\"Converting Fahrenheit = \\\"+fahrenheit);\"\n      + \"\
    var celsius = (fahrenheit - 32.0 ) / 1.8;\"\n      + \"println(\\\"Returning Celsius\
    \ = \\\"+celsius);\"\n      + \"return celsius;\"\n   )\n\n// 调用函数\n   var received\
    \ = f2c(212.0);\n   println(\"Received Celsius = \"+received);\n```\n\n在命令行窗口中使用\
    \ `jrunscript` 运行此 JavaScript 文件，你将得到：\n\n```\n Hello World!\nConverting Fahrenheit\
    \ = 212\nReturning Celsius = 100\nReceived Celsius = 100\n```\n\n结论：`Function`\
    \ 对象类型构造函数是有效的。但它非常难以使用，主要因为新函数的语句必须作为单个字符串字面量输入。这些语句中的所有引号都必须用反斜杠 (\\) 进行转义。仍然最好使用\
    \ `function` 语句通过传统方式来定义新函数。\n\n"
- fmt: "\n# Function Object Inherited Properties and Methods\n\nThis section provides\
    \ a tutorial example on how `Function` object inherited properties and methods.\n\
    \nBecause a function is an object of the `Function` type, it has some interesting\
    \ inherited properties and methods:\n\n- `\"length\"` - A property represents\
    \ the number of arguments expected by this function.\n- `\"apply()\"` - A method\
    \ to apply (execute) this function on a specified object with specified parameters\
    \ in an array.\n- `\"call()\"` - A method to call (execute) this function on a\
    \ specified object with specified parameters.\n- `\"toString()\"` - A method to\
    \ return the body of this function as a string.\n\nThe tutorial example below\
    \ shows you how to use the properties and methods inherited in a `Function` object:\n\
    \n``` // Function_Properties_and_Methods.js\n// Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n\n   var sign = new Function(\"name\",\n      \"this.signature\
    \ = name;\"\n   )\n\n   println(\"Function body: \" + sign.toString());\n\n  \
    \ println(\"# of parameters: \" + sign.length);\n\n// Executing it on the current\
    \ object\n   sign(\"Herong\");\n   println(\"this.signature: \" + this.signature);\n\
    \n// Applying it on another object\n   var java = new Object();\n   sign.apply(java,\
    \ new Array(\"Sun\"));\n   println(\"java.signature: \" + java.signature);\n\n\
    // Calling it on another object\n   var pc = new Object();\n   sign.call(pc, \"\
    IBM\");\n   println(\"pc.signature: \" + pc.signature);\n```\n\nRun this JavaScript\
    \ file with `jrunscript` in a command window, you will get:\n\n```\n Function\
    \ body:\nfunction anonymous(name) {\n    this.signature = name;\n}\n\n# of parameters:\
    \ 1\nthis.signature: Herong\njava.signature: Sun\npc.signature: IBM\n```\n\nVery\
    \ cool. Everything worked as I expected. One small surprise is that the name of\
    \ a function object created with the `Function` constructor is \"anonymous\".\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n[Using\
    \ Functions as \"Function\" Objects](#part0110.xhtml)\n\n# Function Object Instance\
    \ Properties\n\nThis section provides a tutorial example on how to use an instance\
    \ properties of a function to share values across multiple function calls.\n\n\
    As an object, a function can also have its own instance properties. An instance\
    \ property of a function can also be viewed as a static variable whose value persists\
    \ across multiple function calls.\n\nThe tutorial example below shows you how\
    \ to use an instance property of a function to share values across multiple function\
    \ calls.\n\n``` // Function_Own_Properties.js\n// Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n\n   var sign = new Function(\"name\",\n      \"this.signature\
    \ = name;\"\n      + \"sign.count++;\"\n   )\n   sign.count = 0;\n\n// Executing\
    \ it on the current object\n   sign(\"Herong\");\n\n// Applying it on another\
    \ object\n   var java = new Object();\n   sign.apply(java, new Array(\"Sun\"));\n\
    \n// Calling it on another object\n   var pc = new Object();\n   sign.call(pc,\
    \ \"IBM\");\n\n// # of times the function has been called\n   println(\"Call counts:\
    \ \" + sign.count);\n```\n\nRun this JavaScript file with `jrunscript` in a command\
    \ window, you will get:\n\n```\n Call counts: 3\n```\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n[Using Functions as \"Function\"\
    \ Objects](#part0110.xhtml)\n\n# Creating Function Objects with \"function\" Statements\n\
    \nThis section provides a tutorial example on how to create a Function object\
    \ with a 'function' statement, which also assigns the object to a variable.\n\n\
    By definition, a function is an object instance of the `Function` object type.\
    \ In previous sections, we learned how to create a function with the `Function`\
    \ constructor.\n\nA function can also be created with the \"function\" statement:\n\
    \n```\n function function_name(parameter_1, parameter_2, ...) {\n   statement_1;\
    \ \n   statement_2;\n   ...\n   return return_expression\n}\n```\n\nThe \"function\"\
    \ statement actually does 4 things:\n\n- Created a `Function` object.\n- Named\
    \ the `Function` object with `\"function_name\"`.\n- Declared a variable named\
    \ as `\"fucntion_name\"`.\n- Assigned the `Function` object to the variable `\"\
    function_name\"`.\n\nThe tutorial example below shows you how to use a \"function\"\
    \ statement to create a `Function` object:\n\n``` // Function_Statements.js\n\
    // Copyright (c) HerongYang.com. All Rights Reserved.\n\n// Using the \"function\"\
    \ statement\nfunction f2c(fahrenheit) {\n   println(\"Converting Fahrenheit =\
    \ \"+fahrenheit);\n   var celsius = (fahrenheit - 32.0 ) / 1.8;\n   println(\"\
    Returning Celsius = \"+celsius);\n   return celsius;\n}\n\n   println(\"Function\
    \ body: \" + f2c.toString());\n\n   println(\"# of parameters: \" + f2c.length);\n\
    \n   var received = f2c.call(this, 70.0);\n   println(\"Received Celsius = \"\
    +received);\n```\n\nRun this JavaScript file with `jrunscript` in a command window,\
    \ you will get:\n\n```\n # of parameters: 1\nConverting Fahrenheit = 70\nReturning\
    \ Celsius = 21.11111111111111\nReceived Celsius = 21.11111111111111\n```\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n[Using Functions\
    \ as \"Function\" Objects](#part0110.xhtml)\n\n# Creating Function Objects with\
    \ the \"function\" Operator\n\nThis section provides a tutorial example on how\
    \ to create a Function object with a 'function' operator. A function defined with\
    \ a 'function' operator is also called function literal or expression.\n\nBy definition,\
    \ a function is an object instance of the `Function` object type. In previous\
    \ sections, we learned how to create a function with the `Function` constructor.\n\
    \nA function can also be created with the \"function\" operator:\n\n```\n function\
    \ [function_name](parameter_1, parameter_2, ...) {\n   statement_1; \n   statement_2;\n\
    \   ...\n   return return_expression\n};\n```\n\nThe \"function\" operator actually\
    \ does only 2 things:\n\n- Created a `Function` object.\n- Named the `Function`\
    \ object with `\"function_name\"`. If no name is provided, the `Function` object\
    \ will have no name.\n\nA function defined with the \"function\" operator is also\
    \ called a function literal or a function expression.\n\nA function defined with\
    \ the \"function\" operator should be assigned to a variable. Otherwise, it will\
    \ be accessible outside the expression where the operator is used.\n\nThe tutorial\
    \ example below shows you how to use the \"function\" operator to create a `Function`\
    \ object:\n\n``` // Function_Operator.js\n// Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n\n// A function with no reference variable and no name\n \
    \  function() { println('Apple'); };\n   // no way to call it outside the expression\n\
    \n   // call it as part of the expression is ok\n   (function() { println('Banana');\
    \ }).call(this);\n\n// A function with a reference variable and no name\n   var\
    \ orange = function() { println('Orange'); };\n   orange();\n\n// A function with\
    \ a reference variable and a name\n   var hello = function allo() { println('Hello');\
    \ };\n   hello();\n   // allo(); // calling by function name is not allowed!\n\
    \n// A function with a reference variable, a parameter and no name\n   var f2c\
    \ = function (fahrenheit) {\n      println(\"Converting Fahrenheit = \"+fahrenheit);\n\
    \      var celsius = (fahrenheit - 32.0 ) / 1.8;\n      println(\"Returning Celsius\
    \ = \"+celsius);\n      return celsius;\n      };\n   f2c(70.0);\n```\n\nRun this\
    \ JavaScript file with `jrunscript` in a command window, you will get:\n\n```\n\
    \ Banana\nOrange\nHello\nConverting Fahrenheit = 70\nReturning Celsius = 21.11111111111111\n\
    ```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n\
    [Using Functions as \"Function\" Objects](#part0110.xhtml)\n\n# Comparing 3 Ways\
    \ of Creating Functions\n\nThis section provides a tutorial example to compare\
    \ 3 different ways of creating a function object: 'function' statement, 'function'\
    \ operator, and `Function()` constructor.\n\nNow we know that there are 3 different\
    \ ways to create a function:\n\n- Using the \"function\" declaration statement\
    \ - Creating a function in the traditional way.\n- Using the \"function\" operator\
    \ - Creating a function as a function literal on the fly while evaluating an expression.\n\
    - Using the \"Function()\" constructor - Creating a function in the object-oriented\
    \ way.\n"
