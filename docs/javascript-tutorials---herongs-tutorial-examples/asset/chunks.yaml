    \n∟[Introduction to Built-in Object Types](#part0118.xhtml)\n\n## The \"Math\"\
    \ Object Type - The Math Container\n\nThis section provides a quick description\
    \ and a tutorial example script on the 'Math' built-in object type. There is only\
    \ one default 'Math' object called `Math` that holds all math properties and functions.\n\
    \nThe \"Math\" object type is a special built-in object type, that is used by\
    \ the host environment to create a single \"Math\" object as a container for many\
    \ mathematics related properties and functions. It has the following main features:\n\
    \n- There is no way you can create your own \"Math\" objects, because the `Math()`\
    \ constructor is not accessible.\n- The host environment creates the default `Math`\
    \ object.\n- The default `Math` object has several value properties: `E`, `LN10`,\
    \ `LN2`, `PI`, `SQRT2`, etc.\n- The default `Math` object has many function properties\
    \ (methods): `abs()`, `floor()`, `ceil()`, `round()`, `sin()`, `cos()`, `random()`,\
    \ etc.\n\nHere is a tutorial example script showing some of those features:\n\n\
    ```javascript\n // Math_Object_Type.js\n// Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n\n   // Creating your own \"Math\" objects is not allowed\n   //\
    \ var myObject = new Math();\n\n   // Checking this object\n   println(\"\\nAbout\
    \ this \\\"Math\\\":\");\n   println(\"   Type = \"+(typeof Math));\n   println(\"\
    \   Instance Of Object: \"+(Math instanceof Object));\n   println(\"   Instance\
    \ Of Function: \"+(Math instanceof Function));\n   println(\"   Instance Of Math:\
    \ \"+(Math instanceof Math));\n   println(\"   toString(): \"+Math.toString());\n\
    \n   println(\"\\n\\\"Math\\\" value properties:\");\n      println(\"   Math.E\
    \ = \"+Math.E);\n      println(\"   Math.PI = \"+Math.PI);\n      println(\" \
    \  Math.SQRT2 = \"+Math.SQRT2);\n\n   println(\"\\nCalling \\\"Math\\\" function\
    \ properties - methods:\");\n      println(\"   Math.sqrt(2) = \"+Math.sqrt(2));\n\
    \      println(\"   Math.sin(Math.PI) = \"+Math.sin(Math.PI));\n      println(\"\
    \   Math.abs(-17.78) = \"+Math.abs(-17.78));\n      println(\"   Math.ceil(-17.78)\
    \ = \"+Math.ceil(-17.78));\n      println(\"   Math.floor(-17.78) = \"+Math.floor(-17.78));\n\
    \      println(\"   Math.round(-17.78) = \"+Math.round(-17.78));\n      println(\"\
    \   Math.random() = \"+Math.random());\n```\n\nIf you run this script with \"\
    jrunscript\", you will get:\n\n```\n About this \"Math\":\n   Type = object\n\
    \   Instance Of Object: true\n   Instance Of Function: false\n   Instance Of Math:\
    \ false\n   toString(): [object Math]\n\n\"Math\" value properties:\n   Math.E\
    \ = 2.718281828459045\n   Math.PI = 3.141592653589793\n   Math.SQRT2 = 1.4142135623730951\n\
    \nCalling \"Math\" function properties - methods:\n   Math.sqrt(2) = 1.4142135623730951\n\
    \   Math.sin(Math.PI) = 1.2246467991473532e-16\n   Math.abs(-17.78) = 17.78\n\
    \   Math.ceil(-17.78) = -17\n   Math.floor(-17.78) = -18\n   Math.round(-17.78)\
    \ = -18\n   Math.random() = 0.4715524330340368\n```\n\nNow we know how to use\
    \ the \"Math\" object.\n\nRead other \"Math\" related chapters to see more tutorial\
    \ examples.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
