    \n## \"Math\" 对象类型 - Math 容器\n\n本节提供了关于 'Math' 内置对象类型的简要描述和教程示例脚本。只有一个名为 `Math`\
    \ 的默认 'Math' 对象，它包含了所有的数学属性和函数。\n\n\"Math\" 对象类型是一个特殊的内置对象类型，由宿主环境创建一个单一的 \"Math\"\
    \ 对象，作为许多数学相关属性和函数的容器。它具有以下主要特征：\n\n- 你无法创建自己的 \"Math\" 对象，因为 `Math()` 构造函数是不可用的。\n\
    - 宿主环境创建默认的 `Math` 对象。\n- 默认的 `Math` 对象具有几个值属性：`E`、`LN10`、`LN2`、`PI`、`SQRT2` 等。\n\
    - 默认的 `Math` 对象有许多函数属性（方法）：`abs()`、`floor()`、`ceil()`、`round()`、`sin()`、`cos()`、`random()`\
    \ 等。这是一个显示某些功能的教程示例脚本：\n\n```javascript\n // Math_Object_Type.js\n// Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n\n   // 不允许创建自己的 \"Math\" 对象\n   //\
    \ var myObject = new Math();\n\n   // 检查此对象\n   println(\"\\nAbout this \\\"Math\\\
    \":\");\n   println(\"   Type = \"+(typeof Math));\n   println(\"   Instance Of\
    \ Object: \"+(Math instanceof Object));\n   println(\"   Instance Of Function:\
    \ \"+(Math instanceof Function));\n   println(\"   Instance Of Math: \"+(Math\
    \ instanceof Math));\n   println(\"   toString(): \"+Math.toString());\n\n   println(\"\
    \\n\\\"Math\\\" value properties:\");\n      println(\"   Math.E = \"+Math.E);\n\
    \      println(\"   Math.PI = \"+Math.PI);\n      println(\"   Math.SQRT2 = \"\
    +Math.SQRT2);\n\n   println(\"\\nCalling \\\"Math\\\" function properties - methods:\"\
    );\n      println(\"   Math.sqrt(2) = \"+Math.sqrt(2));\n      println(\"   Math.sin(Math.PI)\
    \ = \"+Math.sin(Math.PI));\n      println(\"   Math.abs(-17.78) = \"+Math.abs(-17.78));\n\
    \      println(\"   Math.ceil(-17.78) = \"+Math.ceil(-17.78));\n      println(\"\
    \   Math.floor(-17.78) = \"+Math.floor(-17.78));\n      println(\"   Math.round(-17.78)\
    \ = \"+Math.round(-17.78));\n      println(\"   Math.random() = \"+Math.random());\n\
    ```\n\n如果你用 \"jrunscript\" 运行此脚本，你将得到：\n\n```\n About this \"Math\":\n   Type\
    \ = object\n   Instance Of Object: true\n   Instance Of Function: false\n   Instance\
    \ Of Math: false\n   toString(): [object Math]\n\n\"Math\" value properties:\n\
    \   Math.E = 2.718281828459045\n   Math.PI = 3.141592653589793\n   Math.SQRT2\
    \ = 1.4142135623730951\n\nCalling \"Math\" function properties - methods:\n  \
    \ Math.sqrt(2) = 1.4142135623730951\n   Math.sin(Math.PI) = 1.2246467991473532e-16\n\
    \   Math.abs(-17.78) = 17.78\n   Math.ceil(-17.78) = -17\n   Math.floor(-17.78)\
    \ = -18\n   Math.round(-17.78) = -18\n   Math.random() = 0.4715524330340368\n\
    ```\n\n现在我们知道如何使用 \"Math\" 对象。\n\n阅读其他关于 \"Math\" 的章节查看更多教程示例。\n\nJavaScript 教程\
    \ - Herong 的教程示例\n\n## W3C 文档对象模型 (DOM) 规范\n\n本节介绍了 W3C 的文档对象模型 (DOM) 规范。主题包括\
