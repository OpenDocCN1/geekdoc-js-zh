    \" + this.title + \"\\\" by \" + this.author;\n}\n   toString: Inherited: function\
    \ getString() {\n    return this.author + \"/\" + this.title + \"/\" + this.price;\n\
    }\n\nRunning myBook.getDesc()...\n   \"JavaScript Tutorials\" by Herong Yang\n\
    \nRunning myBook.toString()...\n   Herong Yang/JavaScript Tutorials/9.99\n```\n\
    \nNow we know where local methods and inherited methods are located. Here is my\
    \ updated diagram of my object inheritance tree structure:\n\n![](Images/image00148.jpeg)\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Inheritance\
    \ of Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n∟Building Multiple Levels of Prototype Objects\n\nThis section provides a tutorial\
    \ example on how to build multiple levels of prototype objects. It also shows\
    \ how to override an inherited property with a local property.\n\nAs a summary\
    \ of object property inheritance through multiple levels of prototype objects,\
    \ I wrote this tutorial example to use `myBook` as a prototype to define an `EBook`\
    \ constructor function:\n\n```html\n <html>\n<!-- Inheritance_Multiple_Level_Prototypes.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Building\
    \ Multiple Level Prototypes</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n// Modifying the base prototype object\n\n   Object.prototype.copyright = \"\
    herongyang.com\";\n</script>\n<script type=\"text/javascript\">\n// Defining the\
    \ \"Book\" constructor\n\nfunction Book(title, author) {\n   this.title = title;\n\
    \   this.author = author;\n   this.getDesc = getDescription;\n}\n\nfunction getDescription()\
    \ {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   var myPrototype\
    \ = new Object();\n   Book.prototype = myPrototype;\n   Book.prototype.price =\
    \ 9.99;\n   Book.prototype.constructor = Book;\n   Book.prototype.toString = getString;\n\
    \nfunction getString() {\n   return this.author+\"/\"+this.title+\"/\"+this.price;\n\
    }\n</script>\n<script type=\"text/javascript\">\n// Defining the second level\
    \ constructor \"EBook\"\n\nfunction EBook(url) {\n   this.url = url;\n}\n\n  \
    \ var myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n   EBook.prototype\
    \ = myBook;\n   EBook.prototype.constructor = EBook;\n\n   // Creating an object\
    \ from my constructor\n   var myEBook = new EBook(\"www.example.com\");\n\n  \
    \ // Where are these methods located\n   document.writeln(\"\\nChecking Object.prototype...\"\
    );\n   dumpProperty(Object.prototype, \"getDesc\");\n   dumpProperty(Object.prototype,\
    \ \"toString\");\n   document.writeln(\"\\nChecking Book.prototype...\");\n  \
    \ dumpProperty(Book.prototype, \"getDesc\");\n   dumpProperty(Book.prototype,\
    \ \"toString\");\n   document.writeln(\"\\nChecking myBook.prototype...\");\n\
    \   dumpProperty(myBook.prototype, \"getDesc\");\n   dumpProperty(myBook.prototype,\
    \ \"toString\");\n   document.writeln(\"\\nChecking myEBook...\");\n   dumpProperty(myEBook,\
    \ \"getDesc\");\n   dumpProperty(myEBook, \"toString\");\n\n   // Running these\
    \ methods\n   document.writeln(\"\\nRunning myEBook.getDesc()...\");\n   document.writeln(\"\
    \   \"+myEBook.getDesc());\n   document.writeln(\"\\nRunning myEBook.toString()...\"\
    );\n   document.writeln(\"   \"+myEBook.toString());\n\nfunction dumpProperty(object,\
