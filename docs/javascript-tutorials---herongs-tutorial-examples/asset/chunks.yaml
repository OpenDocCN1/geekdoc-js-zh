    # Introduction to JavaScript


    ## Introduction


    This chapter provides a quick introduction of JavaScript. Topics include what
    is JavaScript; writing JavaScript code inside HTML documents; running JavaScript
    code in browser; browser built-in `document`.


    ## What Is JavaScript


    This section provides a quick description of what is JavaScript.


    **What is JavaScript?** JavaScript is a scripting language mainly used for writing
    dynamic Web pages. When a script written in JavaScript is embedded in a Web page,
    it will be executed by the Web browser on the client machine.


    The history of JavaScript is nicely summarized on wikipedia.org as:


    JavaScript was originally developed by Brendan Eich of Netscape under the name
    Mocha, later LiveScript, and finally renamed to JavaScript. The change of name
    from LiveScript to JavaScript roughly coincided with Netscape adding support for
    Java technology in its Netscape Navigator web browser. JavaScript was first introduced
    and deployed in the Netscape browser version 2.0B3 in December of 1995\. The naming
    has caused confusion, giving the impression that the language is a spinoff of
    Java and has been characterized by many as a marketing ploy by Netscape to give
    JavaScript the cachet of what was then the hot new web-programming language.


    To avoid trademark issues, Microsoft named its implementation of the language
    JScript. JScript was first supported in Internet Explorer version 3.0, released
    in August 1996 and included Y2K compliant date functions, unlike those based on
    `java.util.Date` in JavaScript at the time.


    Netscape submitted JavaScript to ECMA International for standardization resulting
    in the standardized version named ECMAScript.


    ## Conclusion


    *   JavaScript is a scripting language mainly used for writing dynamic Web pages.

    *   The official JavaScript specification is called "Standard ECMA-262 - ECMAScript
    2019 Language Specification".

    *   The best way to learn JavaScript is to embed the JavaScript code in an HTML
    document and run it in a browser.

    *   `<script type="text/javascript">` is the tag to embed JavaScript code in HTML
    documents.

    *   `document.write()` is method to generate dynamic content in an HTML document.

