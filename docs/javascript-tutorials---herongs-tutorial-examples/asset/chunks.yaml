    \n∟[Introduction to Built-in Object Types](#part0118.xhtml)\n\n∟The \"RegExp\"\
    \ Object Type - Regular Expression Patterns\n\nThis section provides a quick description\
    \ and a tutorial example script on the `RegExp` built-in object type, which is\
    \ used to create `RegExp` objects for pattern matching operations.\n\nThe `RegExp`\
    \ object type is a built-in object type to be used to create a `RegExp` object,\
    \ representing a regular expression pattern. It has the following main features:\n\
    \n* New `RegExp` objects can be created with the `RegExp()` constructor. `RegExp()`\
    \ can also be used as a regular function, which also returns a `RegExp` object.\n\
    \n* All `RegExp` objects have their own properties: `source`, `global`, `ignoreCase`,\
    \ `multiline`, and `lastIndex`.\n\n* All `RegExp` objects have 3 inherited methods:\
    \ `test()`, `exec()`, and `toString()`.\n\n* A `RegExp` object can also be created\
    \ with a RegExp literal: `/.../i`.\n\nHere is a tutorial example script showing\
    \ some of those features:\n\n```javascript\n // RegExp_Object_Type.js\n// Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n\n   // Creating a new RegExp object\n\
    \   var myObject = new RegExp('\\\\S+@.*\\.com','i');\n\n   // Checking this object\n\
    \   println(\"\\nAbout this \\\"myObject\\\":\");\n   println(\"   Type = \"+(typeof\
    \ myObject));\n   println(\"   Instance Of Object: \"+(myObject instanceof Object));\n\
    \   println(\"   Instance Of RegExp: \"+(myObject instanceof RegExp));\n\n   println(\"\
    \\nProperties of this \\\"myObject\\\":\");\n   println(\"   myObject.source =\
    \ \"+myObject.source);\n   println(\"   myObject.global = \"+myObject.global);\n\
    \   println(\"   myObject.ignoreCase = \"+myObject.ignoreCase);\n   println(\"\
    \   myObject.multiline = \"+myObject.multiline);\n   println(\"   myObject.lastIndex\
    \ = \"+myObject.lastIndex);\n\n   // Using RegExp's inherited methods\n   var\
    \ text = \"Please write to me@herongyang.com for help.\";\n   var t = myObject.test(text);\n\
    \   var e = myObject.exec(text);\n\n   println(\"\\nExecution result:\");\n  \
    \ println(\"   typeof myObject = \"+(typeof myObject));\n   println(\"   typeof\
    \ myObject.test() = \"+(typeof t));\n   println(\"   myObject.toString() = \"\
    +myObject.toString());\n   println(\"   myObject.test() = \"+t);\n\n   println(\"\
    \\nAbout myObject.exec():\");\n   println(\"   typeof myObject.exec() = \"+(typeof\
    \ e));\n   println(\"   myObject.exec() instanceOf Array: \"+(e instanceof Array));\n\
    \   for (var item in e) {\n      println(\"   \"+item+\" = \"+e[item]);\n   }\n\
    ```\n\nIf you run this script with `jrunscript`, you will get:\n\n```\n About\
    \ this \"myObject\":\n   Type = function\n   Instance Of Object: true\n   Instance\
    \ Of RegExp: true\n\nProperties of this \"myObject\":\n   myObject.source = \\\
    S+@.*.com\n   myObject.global = false\n   myObject.ignoreCase = true\n   myObject.multiline\
    \ = false\n   myObject.lastIndex = 0\n\nExecution result:\n   typeof myObject\
    \ = function\n   typeof myObject.test() = boolean\n   myObject.toString() = /\\\
    S+@.*.com/i\n   myObject.test() = true\n\nAbout myObject.exec():\n   typeof myObject.exec()\
    \ = object\n   myObject.exec() instanceOf Array: true\n   0 = me@her.com\n   1\
    \ = 16\n   input = Please write to me@herongyang.com\n```\n\nNow we know how to\
    \ create \"Date\" objects with the `RegExp()` constructor. The output also shows\
    \ that `typeof myObject` returns \"function\".\n"
