  trans: "\n\n本章介绍了 JDK 软件包中包含的 JavaScript 命令行命令及其教程示例。主题包括下载和安装 JDK；`jrunscript`\
    \ 命令中使用的 ECMAScript (JavaScript) 引擎；在命令行中运行 JavaScript 代码；交互模式或批模式。\n\n- 下载和安装\
    \ JDK 10\n- \"jrunscript\" - 脚本命令行及选项\n- 使用 'jrunscript' 运行 JavaScript 代码\n- 交互式使用\
    \ 'jrunscript' 评估 JavaScript 代码\n- 使用 'jrunscript' 运行 JavaScript 代码文件\n\n### 结论：\n\
    \n- JDK（Java 开发工具包）软件包包含一个名为 `jrunscript` 的 JavaScript 执行工具。\n- 你可以使用 `jrunscript`\
    \ 命令交互式地运行 JavaScript 代码。\n- 你可以使用 `jrunscript -e` 选项在命令行中运行嵌入 JavaScript 代码。\n\
    - 你可以使用 `jrunscript -f` 命令运行存储在文件中的 JavaScript 代码。\n\n### JavaScript 教程 - Herong\
    \ 的教程示例\n\n∟'jrunscript' - 来自 JDK 的 JavaScript 命令行\n\n### 下载和安装 JDK 10\n\n本节描述了如何在\
    \ Windows 上下载和安装 Java SE 1.6 Update 2。\n\n`jrunscript`：来自 Oracle.com 的当前版本 JDK（Java\
    \ 开发工具包）包含的命令行脚本 shell。`jrunscript` 支持交互式（读取-评估-打印）模式和批（`-f` 选项）脚本执行模式。这是一个与脚本语言无关的\
    \ shell。默认使用的是 JavaScript，但可以使用 `-l` 选项指定不同的语言。\n\n`jrunscript` 允许你在不使用任何网络浏览器的情况下独立运行运行\
    \ JavaScript 代码。为了尝试 `jrunscript`，你需要在机器上安装 JDK。\n\n以下是我在 Windows 机器上下载并安装 JDK\
    \ 10 的步骤：\n\n- 使用此 URL 打开 Java SE 下载页面：`http://www.oracle.com/technetwork/java/javase/downloads/`\n\
    - 点击 \"Java Platform (JDK) 10\" 旁边的下载按钮。你会看到一个列出 JDK 10 不同下载文件的的新页面。\n- 接受许可协议。\n\
    - 点击 \"Windows 390.19 MB\" 旁 `jdk-10.0.1_windows-x64_bin.exe` 的链接。\n- 将 `jdk-10.0.1_windows-x64_bin.exe`\
    \ 保存到临时目录。\n- 双击 `jdk-10.0.1_windows-x64_bin.exe` 启动安装向导。\n- 安装向导将引导你完成安装。\n\n\
    要测试安装，打开命令行窗口尝试 `java` 命令。如果你看到以下输出，说明安装成功：\n\n```\nC:\\herong>\\progra~1\\java\\\
    jdk-10.0.1\\bin\\java -version\njava version \"10.0.1\" 2018-04-17\nJava(TM) SE\
    \ Runtime Environment 18.3 (build 10.0.1+10)\nJava HotSpot(TM) 64-Bit Server VM\
    \ 18.3 (build 10.0.1+10, mixed mode)\n```\n\n### JavaScript 教程 - Herong 的教程示例\n\
    \n∟'jrunscript' - 来自 JDK 的 JavaScript 命令行\n\n### \"jrunscript\" - 脚本命令行及选项\n\n\
    本节描述了脚本 shell `jrunscript` 命令及其选项。默认的脚本引擎是 JavaScript - ECMAScript 1.6 实现版本 'Mozilla\
    \ Rhino' 1.6 release 2。\n\n在我的机器上安装 JDK 后，我想通过带有 `-help` 选项运行它来获取关于如何使用 `jrunscript`\
    \ 命令的帮助信息：\n\n```\nC:\\herong>\\progra~1\\java\\jdk-10.0.1\\bin\\jrunscript -help\n\
    \n用法: jrunscript [options] [arguments...]\n\n其中 [options] 包括：\n -classpath <path>\
    \    指定查找用户类文件的路径\n -cp <path>           指定查找用户类文件的路径\n -D<name>=<value>     设置系统属性\n\
    \ -J<flag>             将 <flag> 直接传递给运行时系统\n -l <language>        使用指定的脚本语言\n\
    \ -e <script>          评估给定的脚本\n -encoding <encoding> 指定脚本文件使用的字符编码\n -f <script\
    \ file>     评估给定的脚本文件\n -f -                 交互模式，从标准\n                      输入读取脚本。如果使用此项，这应是最后的\n\
    \                      -f 选项\n -help                打印此用法信息并退出\n -?          \
    \         打印此用法信息并退出\n -q                   列出所有可用脚本引擎并退出\n```\n\n如果存在 `[arguments..]`\
    \ 且没有使用 `-e` 或 `-f` 选项，则第一个参数为脚本文件，其余参数（如果有）将作为脚本参数传递。如果 `[arguments..]` 且使用了\
    \ `-e` 或 `-f` 选项，则...\n\n"
- fmt: "\nNote that all `jrunscript` commands were entered in a single command line.\
    \ I split them into multiple lines because the book page width is limited.\n\n\
    # [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n## [['jrunscript'\
    \ - JavaScript Shell Command from JDK](#part0104.xhtml)\n\n### Evaluating JavaScript\
    \ Code with 'jrunscript' Interactively\n\nThis section provides a tutorial example\
    \ on how to evaluate JavaScript codes with `jrunscript` in interactive mode. Each\
    \ line is evaluated as an expression. The value is printed on the screen.\n\n\
    Another way to run JavaScriptScript code with `jrunscript` is to use `jrunscript`\
    \ in interactive mode. Several notes about using `jrunscript` interactive mode:\n\
    \n- Each line of code will be evaluated immediately as expressions.\n- Each line\
    \ of code must be one or multiple complete statements. A single statement can\
    \ not be entered in multiple lines.\n- If there are multiple expressions involved\
    \ in a single line of code, the value of the last expression is printed on the\
    \ screen at the end of the evaluation.\n\nI did a number of tests with `jrunscript`\
    \ interactive mode and recorded some of them below:\n\n```\n C:\\herong>\\progra~1\\\
    java\\jdk-10.0.1\\bin\\jrunscript \n\nnashorn> println(\"Hello World!\");\nHello\
    \ World!\n\nnashorn> x = \"Apple\"; y = \"Orange\";\nOrange\n\nnashorn> println(x\
    \ + ' and ' + y);\nApple and Orange\n\nnashorn> var s = 0;\n\nnashorn> for ( i=1;\
    \ i<=100; i++) {\nscript error: sun.org.mozilla.javascript.internal.EvaluatorException:\
    \ \n   missing } in compound statement (<STDIN>#1) in <STDIN> at \n   line number\
    \ 1\n\nnashorn> for ( i=1; i<=100; i++) { s += i; }\n5050.0\n\nnashorn> println(s);\n\
    5050\n\njs> exit();\n```\n\n# [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n## [['jrunscript' - JavaScript Shell Command from JDK](#part0104.xhtml)\n\n\
    ### Running a JavaScript Code File with 'jrunscript'\n\nThis section provides\
    \ a tutorial example on how to run a JavaScript code file with `jrunscript` in\
    \ batch mode.\n\nProbably the best way to use `jrunscript` is to run it in batch\
    \ mode, where is JavaScript code file is specified at the command line. `jrunscript`\
    \ will process the entire code file in one shot.\n\nIn order to test `jrunscript`\
    \ in batch mode, I revised one of my existing JavaScript Web page file into a\
    \ pure JavaScript code file, `For_Loop_Statements.js`:\n\n```\n // For_Loop_Statements.js\n\
    // Copyright (c) HerongYang.com. All Rights Reserved.\n\n   var i, j, is_prime;\n\
    \   for ( i=3; i<=30; i+=2 ) {\n      is_prime = true;\n      for ( j=2; j<=i/2;\
    \ j++) {\n         is_prime = i%j > 0;\n         if (!is_prime) break;\n     \
    \ }\n      if (is_prime)\n//       document.write(\"Found a prime number: \" +\
    \ i + \".\\n\");\n         print(\"Found a prime number: \" + i + \".\\n\");\n\
    \   }\n```\n\nNotice that, I have to change `document.write()` method to `print()`\
    \ method, because `document` object is only available, if the script is executed\
    \ in a Web browser. Here is how I ran this script file with `jrunscript`:\n\n\
    ```\n C:\\herong>\\progra~1\\java\\jdk-10.0.1\\bin\\jrunscript \\\n   -f For_Loop_Statements.js\n\
    \nFound a prime number: 3.\nFound a prime number: 5.\nFound a prime number: 7.\n\
    Found a prime number: 11.\nFound a prime number: 13.\nFound a prime number: 17.\n\
    Found a prime number: 19.\nFound a prime number: 23.\nFound a prime number: 29.\n\
    ```\n\n# [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n## [Using Functions as \"Function\" Objects\n\nThis chapter provides introductions\
    \ and tutorial examples on functions as objects. Topics include the built-in object\
    \ type `Function`; creating functions using the `Function()` constructor; function\
    \ instance and inherited properties and methods; `function` statement and operator.\n\
    \n- [Functions Are Objects of the \"Function\" Type](#part0111.xhtml)\n- [Using\
    \ the Function Constructor](#part0112.xhtml)\n- [Function Object Inherited Properties\
    \ and Methods](#part0113.xhtml)\n- [Function Object Instance Properties](#part0114.xhtml)\n\
    - [Creating Function Objects with \"function\" Statements](#part0115.xhtml)\n\
    - [Creating Function Objects with the \"function\" Operator](#part0116.xhtml)\n\
    - [Comparing 3 Ways of Creating Functions](#part0117.xhtml)\n\nConclusion:\n\n\
    - JavaScript functions are actually instances of `Function` object type.\n- You\
    \ can create a new function by calling the `Function` constructor: `new Function(\"\
    arg_1\", \"arg_2\", ..., \"function_body\")`.\n- A `Function` object has built-in\
    \ properties and methods: `length`, `apply()`, `call()`, and `toString()`.\n-\
    \ You can add additional properties and methods to `Function` object instances.\n\
    - A `function` statement is actually an expression of `function` operation, which\
    \ returns a reference to new `Function` object.\n\n# [JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n## [[Using Functions as \"Function\"\
    \ Objects](#part0110.xhtml)\n\n### Functions Are Objects of the \"Function\" Type\n\
    \nThis section provides an overview of a unique feature of JavaScript language:\
    \ functions are objects of the `Function` type.\n\nOne very interesting feature\
    \ the JavaScript language is that a function is an object of the `Function` object\
    \ type. Treating functions as objects can lead to several programming implications:\n\
    \n- JavaScript supports a special built-in object type called `Function`.\n- A\
    \ function can be created with the `Function()` constructor.\n- A function has\
    \ inherited properties and methods: `length`, `apply()`, `call()`, and `toString()`.\n\
    - A function can have its own instance properties - nice way to share values across\
    \ multiple function calls.\n- A function can be created as part of an expression.\n\
    - A function can be passed as a parameter into other functions.\n\nA function\
    \ can be created in 3 different ways:\n\n- Using the `function` declaration statement\
    \ - Creating a function in the traditional way.\n- Using the `function` operator\
    \ - Creating a function as a function literal on the fly while evaluating an expression.\n\
    - Using the `Function()` constructor Creating a function in the object-oriented\
    \ way.\n\n# [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n## [[Using Functions as \"Function\" Objects](#part0110.xhtml)\n\n### Using\
    \ the Function Constructor\n\nThis section provides a tutorial example on how\
    \ to define new functions with the `Function` object type constructor.\n\nJavaScript\
    \ provides `Function` as a built-in object type. The constructor of the `Function`\
    \ type has the following calling signature:\n\n```\n new Function(\"arg_1\", \"\
    arg_2\", ..., \"function_body\");\n```\n\nwhere the last parameter is a list o\
    \ statements to form the body of the new function, and all other parameters are\
    \ names of parameters of the new function.\n\nThe tutorial example below shows\
    \ you how to define new functions with the `Function` object type constructor:\n\
    \n```\n // Function_Constructor.js\n// Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n\n// Defining a new function with no parameters\n   var hello = new\
    \ Function(\n      \"println(\\\"Hello World!\\\");\"\n   )\n\n// Calling the\
    \ function\n   hello();\n\n// Defining a new function with one parameter\n   var\
    \ f2c = new Function(\"fahrenheit\",\n      \"println(\\\"Converting Fahrenheit\
    \ = \\\"+fahrenheit);\"\n      + \"var celsius = (fahrenheit - 32.0 ) / 1.8;\"\
    \n      + \"println(\\\"Returning Celsius = \\\"+celsius);\"\n      + \"return\
    \ celsius;\"\n   )\n\n// Calling the function\n   var received = f2c(212.0);\n\
    \   println(\"Received Celsius = \"+received);\n```\n\nRun this JavaScript file\
    \ with `jrunscript` in a command window, you will get:\n\n```\n Hello World!\n\
    Converting Fahrenheit = 212\nReturning Celsius = 100\nReceived Celsius = 100\n\
    ```\n\nConclusion: The `Function` object type constructor works. But it is very\
    \ hard to use, mainly because the statements of the new function must be entered\
    \ as a single string literal. All quotes in those statements must be escaped with\
    \ backslashes (\\). It is still better to use the traditional way to define new\
    \ functions using the `function` statements.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Using Functions as \"Function\" Objects](#part0110.xhtml)\n"
