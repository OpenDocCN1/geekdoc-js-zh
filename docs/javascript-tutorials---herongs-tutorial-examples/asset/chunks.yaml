  trans: "\n\n## 第 6 ：客户端脚本步骤\nWeb 浏览器扫描 HTML 文档，查找其中嵌入的任何客户端脚本代码。Web 浏览器将移除嵌入的脚本代码并执行它。当浏览器执行嵌入的脚本代码时，它会提供许多代表客户端宿主环境机对象。通过这些主机对象，客户端脚本代码可以访问承载的\
    \ HTML 文档和浏览器窗口。出于安全考虑，客户端脚本代码无法访问文件系统或客户端机器浏览器之外的任何内容。\n\n### 第 7a \n某些客户端脚本会在浏览器窗口渲染之前更新页面文档对象（document\
    \ object）。\n\n### 第 7b \n某些客户端脚本将被注册为各种事件的处理器，这些事件会在浏览器窗口及其页面 UI 控件上触发。在终端用户触发这些事件之前，这些脚本将不会执行。\n\
    \nJavaScript 教程 - Herong 的教程示例\n\n∟服务器端与客户端 Web 脚本\n\n∟用于事件处理的客户端脚本\n\n本节提供了用于事件处理的客户端脚本的概述。当终端用户在最终的\
    \ Web 页面上触发事件时，注册为事件处理程序的脚本将会被执行。\n\n用于窗口事件处理的服务器端脚本发生在第 7b 步和第 10 步，如下所示：\n\n\
    ![](img/image00142.jpeg)\n\n### 用于事件处理的客户端脚本\n\n### 第 7b\n某些客户端脚本将被注册为各种事件的处理器，这些事件会在浏览器窗口及其页面\
    \ UI 控件上触发。在终端用户触发这些事件之前，这些脚本将不会执行。\n\n### 第 8\n由某些客户端脚本更新的页面文档对象由 Web 浏览器在浏览器窗口上渲染，向用户显示最终的\
    \ Web 页面。\n\n### 第 9 \n用户在 Web 页面上输入某些内容或点击某些 UI 控件。这将触发一个或多个事件。\n\n### 第 10\n\
    Web 浏览器执行注册为触发事件处理器的客户端脚本。Web 浏览器将提供许多代表客户端宿主环境机对象。通过这些主机对象，事件处理器脚本可以访问页面文档和浏览器窗口。出于安全考虑，客户端脚本代码无法访问文件系统或客户端机器浏览器之外的任何内容。\n\
    \n### 第 7a \n某些事件处理器脚本将更新在浏览器窗口上渲染的页面文档对象。\n\n### 第 11 \n某些事件处理器脚本将强制 Web 浏览器请求一个新的\
    \ Web 页面。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟服务器端与客户端 Web 脚本\n\n∟多次处理的客户端脚本过程\n\
    \n本节提供了一个 JavaScript 代码教程示例，该代码将另一段 JavaScript 代码插入回 HTML 文档中。Web 浏览器会多次执行脚本代码。\n\
    \n正如我们之前学到的，当 Web 浏览器从 Web 服务器接收 HTML 文档时，它会移除所有嵌入的脚本代码并执行它们。\n\n如果在第一轮脚本执行期间向\
    \ HTML 文档中插入了新的脚本代码会发生什么？Web 浏览器将移除插入的脚本代码并再次执行它。\n\n这是一个有趣的 JavaScript 代码教程示例，它将另一段\
    \ JavaScript 代码插入 HTML 文档中：\n\n```javascript\n <html\n<!-- Hello_Nested_Scripts.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Hello\
    \ from Nested Scripts</title></head>\n<body><pre>\n<script type=\"text/javascript\"\
    >\n   document.writeln(\"Hello World!\");\n   document.writeln(\"<script type=\\\
    \"text/javascript\\\">\");\n   document.writeln(\"document.writeln(\\\" Hello\
    \ World!\\\");\");\n   document.writeln(\"<\\/script>\");\n</script>\n</pre></body>\n\
    </</html>\n```\n\n猜猜如果你运行这个 HTML 文档，你会在浏览器窗口上看到什么。\n\n```\n Hello World!\n Hello\
    \ World!\n```\n\n发生的情况是，当浏览器完成嵌入的 JavaScript 代码的执行时，它将得到如下 HTML 文档：\n\n```html\n\
    \ Hello World!\n<script type=\"text/javascript\">\ndocument.writeln(\" Hello World!\"\
    );\n</script>\n```\n\n输出中还有另一个 JavaScript 代码。浏览器将再次执行它，导致你之前看到的最终 HTML 文档。\n\n\
    JavaScript 教程 - Herong 的教程示例\n\n∟服务器端与客户端 Web 脚本\n\n∟由两个原始脚本产生的新脚本\n\n本节提供了一个教程示例，展示了\
    \ Web 浏览器如何无法执行由两个原始 JavaScript 代码产生的 JavaScript 代码。\n\n实际上，只有当新脚本代码是单次执行的结果时，Web\
    \ 浏览器才能正确处理它。\n\n这里有一个包含两个 JavaScript 代码的 HTML 文档，它们协同工作返回一个新的 JavaScript 代码：\n\
    \n```html\n <html\n<!-- Hello_Nested_Script_Error.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Hello from Nested Script Error</title></head>\n\
    <body><pre>\n<script type=\"text/javascript\">\n   document.writeln(\"-- Before\
    \ the new script.\");\n   document.writeln(\"<script type=\\\"text/javascript\\\
    \">\");\n</script>\ndocument.writeln(\\\"Hello World!\\\");\n<script type=\"text/javascript\"\
    >\n   document.writeln(\"<\\/script>\");\n   document.writeln(\"-- After the new\
    \ script.\");\n</script>\n</pre></body>\n</</html>\n```\n\n在第一轮 JavaScript 执行后，HTML\
    \ 文档将拥有一个新的 JavaScript 代码：\n\n```\n -- Before the new script.\n<script type=\"\
    text/javascript\">\ndocument.writeln(\\\"Hello World!\\\");\n</script>\n-- After\
    \ the new script.\n```\n\n如果 Web 浏览器再次执行 JavaScript 代码，最终的 HTML 文档将如下所示：\n\n```\n\
    \ -- Before the new script.\nHello World!\n-- After the new script.\n```\n\n但\
    \ Internet Explorer 和 Firefox 得到的结果是：\n\n```\n -- Before the new script.\n```\n\
    \n结论：如果脚本代码是由两个原始脚本代码产生的，Web 浏览器将无法执行它。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟对象简介\n\
    \n本章提供了 JavaScript 中“对象”类型的介绍和教程示例。主题包括创建“对象”；添加属性和运行方法；命名属性和索引属性；数组的比较。\n\n>\
    \ 什么是对象？\n> Object 类型的对象\n> 添加和删除属性\n> 添加和删除方法\n> 使用 this 关键字表示当前对象\n> 对象字面量\n\
    > 对象与关联数组\n> 具有索引属性的对象\n> 数组与对象的区别\n> 将数组对象作为对象使用\n\n结论：\n\n* 对象是特殊类型“Object”或任何“原型”类型的实例。\n\
    * “Object”类型是所有“原型”类型的根。\n* 使用对象字面量创建新对象：`{n:v, ...}`。\n* 使用 `Object` 构造函数创建新对象：`New\
    \ Object()`。\n* 使用点 `.` 操作访问对象的属性或方法。\n* 使用点 `delete` 操作删除对象的属性或方法。\n\n"
- fmt: "\n# What Is an Object?\n\nThis section provides a quick description of what\
    \ is an object in JavaScript and some interesting features on creating and using\
    \ objects. A tutorial example is also provided.\n\n## What Is an Object?\n\nAn\
    \ object is an instance of a special data type called `\"Object\"` or any `\"\
    prototype\"` data type.\n\nJavaScript supports objects with some interesting features:\n\
    \n* An object is instantiated from a `\"prototype\"`, not from a `\"class\"` or\
    \ a `\"struct\"` like other languages.\n* Objects of the `\"Object\"` data type\
    \ can be created with the object initializer operator (`{}`).\n* Objects of the\
    \ `\"Object\"` data type and any `\"prototype\"` data type can be created with\
    \ the constructor operator (`new`).\n* When an object is assigned to a variable,\
    \ a reference of the object is stored in the variable. This is different than\
    \ assigning a primitive value to a variable, where the value itself is stored\
    \ in the variable.\n* An object can only have public properties and public methods.\n\
    * Properties and methods can be accessed with the dot (`.`) operator.\n* An object\
    \ in JavaScript is equivalent to an associate array in other languages.\n* Properties\
    \ and methods can be accessed with the array operator (`[]`).\n* New properties\
    \ and methods can be added to all objects of a single prototype dynamically.\n\
    * Existing properties and methods can be removed from all objects of a single\
    \ prototype dynamically.\n* New properties and methods can be added to one object\
    \ and not to other objects of the same prototype dynamically.\n* Existing properties\
    \ and methods can be removed from one objects and not from other objects of the\
    \ same prototype dynamically.\n* JavaScript provided a couple of built-in user\
    \ defined data types, `Array`, `Boolean`, `Date`, `Function`, `Math`, `Number`,\
    \ `RegExp`, and `String`.\n\nTo show you some of these feature, I wrote this simple\
    \ tutorial example to create an object of `\"Object\"` data type, and add a new\
    \ property on this new object:\n\n```\n <html>\n<!-- Object_Data_Type_and_Value.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Object\
    \ Data Type and Value</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n   // Assigning a primitive value to a variable\n   var jsSite = \"mozilla.org\"\
    ;\n\n   // Creating an object and assigning it to a variable\n   var mySite =\
    \ new Object();\n\n   // Adding a new property to one object\n   mySite.name =\
    \ \"herongyang.com\";\n\n   // Retrieving the value of object property\n   document.writeln('\"\
    mySite.name\" property: '+mySite.name); \n\n   // Checking the data type of mySite\n\
    \   document.writeln('\"mySite\" data type: '+(typeof mySite)); \n\n   // Checking\
    \ the data type of jsSite\n   document.writeln('\"jsSite\" data type: '+(typeof\
    \ jsSite)); \n</script>\n</pre>\n</body>\n</</html>\n```\n\nRun this example,\
    \ you will get:\n\n```\n \"mySite.Name\" property: herongyang.com\n\"mySite\"\
    \ data type: object\n\"jsSite\" data type: string\n```\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n# [Introduction to Objects](#part0073.xhtml)\n\
    \n## Objects of \"Object\" Data Type\n\nThis section provides a quick description\
    \ of the `'Object'` data type, its properties and methods. A tutorial example\
    \ is provided on how to create and test an object of the `'Object'` data type.\
    \ To learn how to use objects in JavaScript, we need to start with the `'Object'`\
    \ data type, which has the following features:\n\n* Objects of the `\"Object\"\
    ` data type can be created with the object initializer operator (`{}`).\n* Objects\
    \ of the `\"Object\"` data type and any `\"prototype\"` data type can be created\
    \ with the constructor operator (`new`).\n* Properties and methods can be accessed\
    \ with the dot (`.`) operator.\n* Properties and methods can be accessed with\
    \ the array operator (`[]`).\n\nHere is a tutorial example showing some of these\
    \ feature:\n\n```\n <html>\n<!-- Object_Data_Type_and_Value.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Object Data Type\
    \ and Value</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n   // Assigning a primitive value to a variable\n   var jsSite = \"mozilla.org\"\
    ;\n\n   // Creating an object and assigning it to a variable\n   var mySite =\
    \ new Object();\n\n   // Adding a new property to one object\n   mySite.name =\
    \ \"herongyang.com\";\n\n   // Retrieving the value of object property\n   document.writeln('\"\
    mySite.name\" property: '+mySite.name); \n\n   // Checking the data type of mySite\n\
    \   document.writeln('\"mySite\" data type: '+(typeof mySite)); \n\n   // Checking\
    \ the data type of jsSite\n   document.writeln('\"jsSite\" data type: '+(typeof\
    \ jsSite)); \n</script>\n</pre>\n</body>\n</</html>\n```\n\nRun this example,\
    \ you will get:\n\n```\n \"mySite.Name\" property: herongyang.com\n\"mySite\"\
    \ data type: object\n\"jsSite\" data type: string\n```\n\n# Adding and Deleting\
    \ Object Properties\n\nThis section provides a quick description of how to add,\
    \ update, and delete properties.\n\n* New properties and methods can be added\
    \ to one object and not to other objects of the same prototype dynamically.\n\
    * Existing properties and methods can be removed from one objects and not from\
    \ other objects of the same prototype dynamically.\n\nHere is a tutorial example\
    \ that shows how to add a new property, update the property value, and delete\
    \ a property:\n\n```\n <html>\n<!-- Object_Property.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Object Properties of \"Object\"</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n   // Creating objects\
    \ of \"Object\" type\n   var mySite = new Object();\n   var myBook = new Object();\n\
    \n   // Adding a new property to one object only\n   mySite.url = \"herongyang.com\"\
    ;\n   myBook.author = \"Herong Yang\";\n\n   // Updating a property value\n  \
    \ mySite.url = \"www.herongyang.com\";\n\n   // Showing property values\n   document.writeln('mySite.url:\
    \ '+mySite.url);\n   document.writeln('myBoot.url: '+myBook.url);\n   document.writeln('mySite.author:\
    \ '+mySite.author);\n   document.writeln('myBook.author: '+myBook.author);\n\n\
    \   // Is this property for one object only?\n   document.writeln('mySite.hasOwnProperty(\"\
    url\"): '\n      +mySite.hasOwnProperty(\"url\"));\n\n   // Deleting a property\
    \ from one only\n   document.writeln('Deleting mySite.url...');\n   delete mySite.url;\n\
    \   document.writeln('mySite.url: '+mySite.url);\n</script>\n</pre>\n</body>\n\
    </</html>\n```\n\nThe result matches my expectation:\n\n```\n mySite.url: www.herongyang.com\n\
    myBoot.url: undefined\nmySite.author: undefined\nmyBook.author: Herong Yang\n\
    mySite.hasOwnProperty(\"url\"): true\nDeleting mySite.url...\nmySite.url: undefined\n\
    ```\n"
