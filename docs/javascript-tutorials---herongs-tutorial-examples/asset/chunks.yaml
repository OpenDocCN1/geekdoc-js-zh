    \ I wrote the following the JavaScript tutorial example, For_Loop_Statements.html:\n\
    \n```\n <html>\n<!-- For_Loop_Statements.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>For Loop Statements</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   var i, j, is_prime;\n   for\
    \ ( i=3; i<=30; i+=2 ) {\n      is_prime = true;\n      for ( j=2; j<=i/2; j++)\
    \ {\n         is_prime = i%j > 0;\n         if (!is_prime) break;\n      }\n \
    \     if (is_prime)\n         document.write(\"Found a prime number: \" + i +\
    \ \".\\n\");\n   }\n</script>\n</pre>\n</body>\n</html>\n```\n\nNote that:\n\n\
    *   This JavaScript uses a nested \"for\" loop statements to calculate prime numbers.\n\
    \n*   The outer \"for\" loop uses variable \"i\" to control the loop execution.\n\
    \n*   The inner \"for\" loop uses variable \"j\" to control the loop execution.\n\
    \n*   The outer \"for\" loop's stop condition is \"i<=30\". The value of \"i\"\
    \ is increased by 2 in each iteration.\n\n*   The inner \"for\" loop's stop condition\
    \ is \"j<=i/2\". The value of \"j\" is increased by 1 in each iteration.\n\n*\
    \   The inner \"for\" loop has a \"break\" statement that will break the loop\
    \ when \"is_prime\" is true.\n\nThe output of this sample JavaScript is:\n\n```\n\
    \ Found a prime number: 3.\nFound a prime number: 5.\nFound a prime number: 7.\n\
    Found a prime number: 11.\nFound a prime number: 13.\nFound a prime number: 17.\n\
    Found a prime number: 19.\nFound a prime number: 23.\nFound a prime number: 29.\n\
    ```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n\
    ∟[Flow Control Statements](#part0019.xhtml)\n\n∟\"while\" Loop Statements\n\n\
    This section provides a quick description of the 'while' loop statement.\n\nThe\
    \ \"while\" statement is a very common loop statement in many programming languages.\
    \ The JavaScript \"while\" statement has the following generic syntax format:\n\
    \n```\n while (loop_condition)\n   statement or statement_block\n```\n\nA \"while\"\
    \ statement is executed as follows:\n\nStep 1: \"loop_condition\" expression is\
    \ evaluated as a Boolean value.\n\nStep 2: If \"loop_condition\" is evaluated\
    \ to \"true\", continue with Step 4.\n\nStep 3: If \"loop_condition\" is evaluated\
    \ to \"false\", terminate the loop.\n\nStep 4: Execute \"statement\" or \"statement_block\"\
    .\n\nStep 5: Continue with Step 1.\n\nThere is another form of \"while\" loop,\
    \ called \"do ... while\" loop statement, with the following syntax format:\n\n\
    ```\n do\n   statement or statement_block\nwhile (loop_condition);\n```\n\n\"\
    while\" loop statement could be executed infinitely, if the \"loop_condition\"\
    \ is always evaluated to \"true\".\n\nA \"break\" statement could be used inside\
    \ the loop statement block to terminate the loop early.\n\nA \"continue\" statement\
    \ could be used inside the loop statement block to skip the rest of the block\
    \ and start the next iteration of the loop.\n\nA tutorial example will be given\
    \ in the next section showing an example of the \"while\" loop statement."
