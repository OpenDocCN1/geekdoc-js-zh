    \ adding local and inherited properties; overriding inherited properties.\n\n\
    > [Inheriting from Constructor's Prototype Object](#part0094.xhtml)\n\n> \n\n\
    > [Changing the Constructor's Prototype Object](#part0095.xhtml)\n\n> \n\n> [Inheriting\
    \ Properties from Two Level Prototype Objects](#part0096.xhtml)\n\n> \n\n> [Built-in\
    \ Properties and Methods in \"Object.prototype\"](#part0097.xhtml)\n\n> \n\n>\
    \ [Using \"hasOwnProperty()\" Method to Test Inherited Properties](#part0098.xhtml)\n\
    \n> \n\n> [Setting the \"constructor\" Property in the \"prototype\" Object](#part0099.xhtml)\n\
    \n> \n\n> [Adding Local Methods at the Object Level](#part0100.xhtml)\n\n> \n\n\
    > [Adding Inherited Methods at the Prototype Level](#part0101.xhtml)\n\n> \n\n\
    > [Building Multiple Levels of Prototype Objects](#part0102.xhtml)\n\n> \n\n>\
    \ [Prototype Object Chain Summary](#part0103.xhtml)\n\nConclusion:\n\n*   When\
    \ defining a constructor function, you are actually defining a \"prototype\" object.\n\
    \n*   When creating a new object by calling the constructor function, you are\
    \ inheriting properties and methods from the prototype defined in the constructor.\n\
    \n*   You can modify the prototype of a constructor at any time.\n\n*   An object\
