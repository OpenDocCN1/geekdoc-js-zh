  trans: "\n\n*   `function (...) {...}` 语句允许你定义自己的函数。\n*   调用函数时，基本类型参数通过值传递。而对象参数通过引用传递。\n\
    *   调用函数后，得到的结果是返回的基类型值的副本，或者是返回的对象的引用。\n*   参数可以是命名的，也可以是非命名的。\n*   未命名参数可以通过函数内部的内置数组\
    \ `arguments[]`访问。\n*   在函数内部声明的变量具有局部作用域，局限于函数体。\n\n# JavaScript 教程 - Herong\
    \ 的教程示例\n\n## 定义和调用函数\n\n### 定义你自己的函数\n\n本节简要描述了如何定义自己的函数以及 JavaScript 函数的一些基本特征。\n\
    \n与许多许多编程语言一样，JavaScript 允许你定义自己的函数。JavaScript 使用以下语法格式来定义新函数：\n\n```javascript\n\
    \ function function_name(parameter_1, parameter_2, ...) {\n   statement_1; \n\
    \   statement_2;\n   ...\n   return return_expression\n}\n```\n\n为了定义新函数，你需要了解以下\
    \ 4 个区域：\n\n*   **函数名称**：你应该为函数命名，以便稍后调用它。上述语法格式中的 `function_name`。\n*   **参数列表**：如果你想通过名称引用参数，则应该为函数的参数命名。上述语法格式中的\
    \ `parameter_1`, `parameter_2`, ...`。\n*   **函数体**：在花括号 `{}` 内部提供的语句列表构成了函数体。上述语法格式中的\
    \ `statement_1`, `statement_2`, ...`。\n*   **返回值**：你应该在函数体中使用 `return` 语句来结束函数的执行，并向调用语句返回一个返回值。\n\
    \nJavaScript 函数具有以下基本特征：\n\n*   基本类型参数通过值传递。\n*   对象参数通过引用传递。\n*   额外的参数可以传递给函数，而无需在函数定义中列出它们。\n\
    *   参数可以通过函数体中的内置数组 `arguments[]` 访问。\n*   函数可以被递归调用。\n*   函数为它的局部变量提供了一个作用域边界。\n\
    \n下一节将给出一个教程示例，展示你如何定义新函数。\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 定义和调用函数\n\n\
    ### 定义你自己的函数 - 示例\n\n本节提供了一个关于如何定义自己的 JavaScript 函数的教程示例。\n\n这是一个定义用户函数的 JavaScript\
    \ 教程示例。\n\n```html\n <html>\n<!-- Define_Functions.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Define Functions</title></head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n// 定义一个什么都不做的空函数\nfunction null() {\n\
    }\n\n// 定义一个简单的函数\nfunction hello() {\n   document.write('Hello World!');\n}\n\
    \n// 定义一个用于将华氏度转换为摄氏度的函数\nfunction f2c(fahrenheit) {\n   document.write(\"Converting\
    \ Fahrenheit = \"+fahrenheit+\"\\n\");\n   var celsius = (fahrenheit - 32.0 )\
    \ / 1.8;\n   document.write(\"Returning Celsius = \"+celsius+\"\\n\");\n   return\
    \ celsius;\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\n如果你在 Web 浏览器中运行此 JavaScript\
    \ 页面，你会得到一个空白窗口，因为它只定义了 3 个函数，但没有调用其中任何一个来运行。因此，没有语句被执行。\n\n第一个函数 `null()` 被定义为什么都不做。\n\
    \n第二个函数 `hello()` 被定义为向 HTML 文档写入 \"Hello World!\"。\n\n第三个函数 `f2c()` 被定义为执行几件事：接收参数\
    \ `fahrenheit`，声明局部变量 `celsius`，将从 `fahrenheit` 转换来的摄氏度值赋值给 `celsius`，向 HTML 文档写入两行文本，返回\
    \ `celsius` 中的值。\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 定义和调用函数\n\n### 调用你自己的函数\
    \ - 示例\n\n本节简要描述了如何调用自己的 JavaScript 函数以及一个调用温度转换函数的教程示例。\n\n一旦定义了函数，你就可以作为表达式的一部分调用它，如此语法格式所示：\n\
    \n```javascript\n ... function_name(exp1, exp2, ...) ...;\n```\n\n当求值上述表达式时，将遵循以下步骤：\n\
    \n*   **步骤 1**：指定的参数表达式在传递到函数体之前，会被求值为基类型值或对象引用。\n*   **步骤 2**：执行指定函数的函数体。\n*\
    \   **步骤 3**：收集返回值，它将用于用于求值调用表达式的其他部分。\n\n这是一个教程示例，它定义了一个简单的函数，用于将华氏度温度值转换为摄氏度：\n\
    \n```html\n <html>\n<!-- Define_Call_Functions.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Define and Call Functions</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n// 定义一个新函数\nfunction f2c(fahrenheit)\
    \ {\n   document.write(\"Converting Fahrenheit = \"+fahrenheit+\"\\n\");\n   var\
    \ celsius = (fahrenheit - 32.0 ) / 1.8;\n   document.write(\"Returning Celsius\
    \ = \"+celsius+\"\\n\");\n   return celsius;\n}\n\n// 调用新函数\n   var received;\n\
    \n   document.write(\"\\nTest 1:\\n\");\n   received = f2c(70.0)\n   document.write(\"\
    Received Celsius = \"+received+\"\\n\");\n\n   document.write(\"\\nTest 2:\\n\"\
    );\n   received = f2c(212.0)\n   document.write(\"Received Celsius = \"+received+\"\
    \\n\");\n\n   document.write(\"\\nTest 3:\\n\");\n   received = f2c(0.0)\n   document.write(\"\
    Received Celsius = \"+received+\"\\n\");\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\n此教程示例的输出并没有出任何意外：\n\n```\n Test 1:\nConverting Fahrenheit = 70\nReturning\
    \ Celsius = 21.11111111111111\nReceived Celsius = 21.11111111111111\n\nTest 2:\n\
    Converting Fahrenheit = 212\nReturning Celsius = 100\nReceived Celsius = 100\n\
    \nTest 3:\nConverting Fahrenheit = 0\nReturning Celsius = -17.77777777777778\n\
    Received Celsius = -17.77777777777778\n```\n\n# JavaScript 教程 - Herong 的教程示例\n\
    \n## 定义和调用函数\n\n### 按值或按引用传递参数\n\n本节提供了一个教程示例，展示基本类型参数通过值传递，对象参数通过引用传递。\n\n正如我在上一个节中提到的，JavaScript\
    \ 文档说基本类型参数通过值传递，对象参数通过引用传递。我想用以下 JavaScript 教程示例来测试这些规则：\n\n```html\n <html>\n\
    <!-- Swap_Values_and_Arrays.html\n   Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n-->\n<head><title>Swap Values and Arrays</title></head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n// 定义一个交换值的函数\nfunction swap_values(left,\
    \ right) {\n   var temp;\n   temp = left;\n   left = right;\n   right = temp;\n\
    }\n\n// 定义一个交换数组的函数\nfunction swap_arrays(left, right) {\n   var temp;\n   for\
    \ (var i=0; i<left.length; i++) {\n      temp = left[i];\n      left[i] = right[i];\n\
    \      right[i] = temp;\n   }\n}\n\n   var first = \"Black\";\n   var second =\
    \ \"White\";\n   document.write(\"\\nTest 1: Swapping two string variables\\n\"\
    );\n   document.write(\"   Before call: \"+first+\" | \"+second+\"\\n\");\n  \
    \ swap_values(first,second);\n   document.write(\"   After call: \"+first+\" |\
    \ \"+second+\"\\n\");\n\n   var colors = new Array(\"Red\", \"Green\", \"Blue\"\
    , \"Yellow\");\n   var animals = new Array(\"Dog\", \"Cat\", \"Fish\", \"Bird\"\
    );\n   document.write(\"\\nTest 2: Swapping two array objects\\n\");\n   document.write(\"\
    \   Before call: \"+colors+\"\\n\");\n   swap_arrays(colors,animals);\n   document.write(\"\
    \   After call: \"+colors+\"\\n\");\n</script>\n</pre>\n</body>\n</html>\n```\n\
    \n这里是该教程示例的输出：\n\n"
- fmt: "\n```\n Test 1: Swapping two string variables\n   Before call: Black | White\n\
    \   After call: Black | White\n\nTest 2: Swapping two array objects\n   Before\
    \ call: Red,Green,Blue,Yellow\n   After call: Dog,Cat,Fish,Bird\n```\n\nThe output\
    \ shows no surprises. When statement `swap_values(first,second);` is executed,\
    \ Copies of values stored in `first` and `second` are passed into the `swap_values()`\
    \ function. The swap operation inside `swap_values()` is performed on copied values.\
    \ Not on original values in `first` and `second`. This is why `first` still contains\
    \ `Blank` after the function call.\n\nWhen statement `swap_arrays(colors,animals);`\
    \ is executed, References to arrays stored in `colors` and `animals` are passed\
    \ into the `swap_arrays()` function. The swap operation inside `swap_arrays()`\
    \ is performed on original arrays. This is why the `colors` array contains animals\
    \ now.\n\n### [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n#### ∟Defining and Calling Functions](#part0036.xhtml)\n\n##### ∟Function Parameters\
    \ Are Passed as Local Copies\n\nThis section provides a quick description of how\
    \ primitive parameters and object parameters are all passed as local copies of\
    \ whatever original variables store.\n\nAs shown in a previous section, JavaScript\
    \ function call follows two rules: primitive parameters are passed by value and\
    \ object parameters are passed by reference.\n\nBut actually, both rules are derived\
    \ from a single rule: parameters are passed as local copies of whatever original\
    \ variable store:\n\n*   If a parameter is a primitive variable, a local copy\
    \ of the variable is created inside the function. Since a primitive variable contains\
    \ the value directly, the local copy is a copy of the value. Therefore we say\
    \ primitive parameters are passed by value.\n*   If a parameter is an object variable,\
    \ a local copy of the variable is created inside the function. Since an object\
    \ variable contains the reference to the object, the local copy is a copy of the\
    \ reference. Therefore we say object parameters are passed by value.\n\nNotice\
    \ that the above explanation uses these assumptions:\n\n*   A primitive variable\
    \ contains the value directly.\n*   An object variable contains the reference\
    \ to the object. In other words, an object variable contains the address where\
    \ the object is stored.\n\nSaying that parameters are passed as local copies is\
    \ actually more accurate, because passing parameters by reference is a very different\
    \ programming feature.\n\nTaking VBScript as an example, it supports the `ByRef`\
    \ keyword to allow you to pass a function parameter as true reference for any\
    \ data types, including primitive types. A VBScript function will not create a\
    \ local copy of a `ByRef` parameter. It will use the `ByRef` parameter as an alias\
    \ of the original variable.\n\nThe following VBScript code will swap the original\
    \ variables by using `ByRef` parameters:\n\n```\n vFirst = \"Dog\"\nvSecond =\
    \ \"Cat\"\nCall SwapByRef(vFirst, vSecond)\ndocument.writeln(\" After Sub: \"\
    \ & vFirst & \" | \" & vSecond)\n\nSub SwapByRef(ByRef vLeft, ByRef vRight)\n\
    vTemp = vLeft\nvLeft = vRight\nvRight = vTemp\nEnd Sub\n```\n\nIf you try to write\
    \ a JavaScript function to swap two objects, you will definitely fail. See the\
    \ next section for my examples.\n\n### [JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n#### ∟Defining and Calling Functions](#part0036.xhtml)\n\
    \n##### ∟Function Parameters Are Passed as Local Copies - Example\n\nThis section\
    \ provides a tutorial example on swapping original primitive and object variables\
    \ in a function.\n\nTo prove that JavaScript function always create local copies\
    \ for object parameters, I wrote the following tutorial example to try to swap\
    \ two objects:\n\n```\n <html>\n<!-- Swap_Function.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Swap Function</title></head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n// Defining a swap function\nfunction\
    \ swap(left, right) {\n   var temp = left;\n   left = right;\n   right = temp;\n\
    \   document.write(\"   Inside swap(): \"+left+\" | \"+right+\"\\n\");\n   document.write(\"\
    \   Type of argument: \"+(typeof left)+\"\\n\"); \n}\n\n   var first = \"Dog\"\
    ;\n   var second = \"Cat\";\n   document.write(\"\\nTest 1: Swapping two string\
    \ variables\\n\");\n   document.write(\"   Before call: \"+first+\" | \"+second+\"\
    \\n\");\n   swap(first,second);\n   document.write(\"   After call: \"+first+\"\
    \ | \"+second+\"\\n\");\n\n   var one = new String(\"White\");\n   var two = new\
    \ String(\"Black\");\n   document.write(\"\\nTest 2: Swapping two string objects\\\
    n\");\n   document.write(\"   Before call: \"+one+\" | \"+two+\"\\n\");\n   swap(one,two);\n\
    \   document.write(\"   After call: \"+one+\" | \"+two+\"\\n\");\n</script>\n\
    </pre>\n</body>\n</</html>\n```\n\nThe output shows that function parameters are\
    \ always passed as local copies of original variables:\n\n```\n Test 1: Swapping\
    \ two string variables\n   Before call: Dog | Cat\n   Inside swap(): Cat | Dog\n\
    \   Type of argument: string\n   After call: Dog | Cat\n\nTest 2: Swapping two\
    \ string objects\n   Before call: White | Black\n   Inside swap(): Black | White\n\
    \   Type of argument: object\n   After call: White | Black\n```\n\nThere is no\
    \ way to swap two original variables in a function, no matter if they are primitive\
    \ or object variables.\n\n### [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n#### ∟Defining and Calling Functions](#part0036.xhtml)\n\n##### ∟Global and\
    \ Local Variables - Scope Rules\n\nThis section provides a quick description of\
    \ global variables and local variables. Basic rules about variable scopes are\
    \ provided.\n\nWhen functions are used in a JavaScript code, variables are declared\
    \ in two levels. Here are some basic rules:\n\n1.  Script Level Scope - A variable\
    \ declared with `var` statement outside any function has a scope at the script\
    \ level. A variable with script level scope, called global variable, is valid\
    \ everywhere in the script, even inside functions.\n2.  Function Level Scope -\
    \ A variable declared with `var` statement inside a function has a scope at the\
    \ function level. A variable with function level scope, called local variable,\
    \ is valid only inside the function where it is declared.\n3.  Auto-declaration\
    \ - If a variable is used without the `var` declaration statement, it will be\
    \ automatically declared with the script level scope, becoming a global variable,\
    \ event it is used inside a function. But using this approach of auto declaration\
    \ global variables is not recommended.\n4.  Collision - If a variable is explicitly\
    \ defined in a function has the same name as a variable defined outside the function,\
    \ the variable outside the function become in-accessible within this function.\n\
    \nThere are some interesting consequences of those rules:\n\n*   The nice thing\
    \ about rule #1 is that variables defined the main code are automatically accessible\
    \ in all procedures. You don't have to pass them as reference arguments to share\
    \ them in a procedure.\n*   The bad thing about rule #2 is that if you are using\
    \ temporary variable in a procedure without explicit declaration, you could accidentally\
    \ change the value of a global variable of the same name.\n*   Rule #3 helps us\
    \ to avoid the bad impact of rule #3, if you declare all temporary variables explicitly\
    \ in procedures.\n\nSee the next section for examples of how variable scope rules\
    \ are applied.\n\n#### Global Variables - Examples\n\nThis section provides a\
