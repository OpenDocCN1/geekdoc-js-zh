    \ Multiple Times](#part0071.xhtml)\n\n> \n\n> [New Script Resulted from Two Original\
    \ Scripts](#part0072.xhtml)\n\nConclusion:\n\n*   Web applications can use scripts\
    \ in 3 areas: Server-Side Scripting, Client-Side Scripting for Page Document Building\
    \ and Client-Side Scripting for Browser Event Handling.\n\n*   When using JavaScript\
    \ in the page document building process, the browser will scan and execute script\
    \ multiple rounds.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Server-Side and Client-Side Web Scripting](#part0066.xhtml)\n\n∟Web Scripting\
    \ Architecture Overview\n\nThis section provides an overview of a typical Web\
    \ scripting processing flow architecture showing server-side and client-side scripting\
    \ steps.\n\nAs we can see from previous chapters, JavaScript code can be used\
    \ in three areas to help building Web sites or Web based applications:\n\n*  \
    \ Server-Side Scripting - Scripts embedded in HTML documents to be processed by\
    \ the Web server before sending to the client - Web browser. Server-side scripting\
    \ usually used to interact with database or other backend applications and to\
    \ bring dynamic data into HTML documents.\n\n*   Client-Side Scripting for Page\
    \ Document Building - Scripts embedded in HTML documents to be processed by the\
    \ Web browser before rendering the page document on the browser window.\n\n* \
    \  Client-Side Scripting for Browser Event Handling - Scripts embedded in HTML\
    \ documents to be processed by the Web browser when user interacts with the Web\
    \ browser window.\n\nThe diagram below shows you how server-side scripting and\
    \ client-side scripting can be used together performing different functions in\
    \ a typical Web application process flow architecture:\n\n![](Images/image00139.jpeg)\n\
    \nWeb Scripting Flow Architecture\n\nRed lines used in this diagram indicate where\
    \ JavaScript could be used. Different sections of this Web scripting flow architecture\
    \ diagram will be explained later.\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[Server-Side and Client-Side Web Scripting](#part0066.xhtml)\n\
    \n∟Server-Side Scripting Overview\n\nThis section provides an overview of the\
    \ Web server-side scripting process flow. The Web server removes the script code\
    \ and executes it.\n\nServer-side scripting happens in step 4 as shown in the\
    \ diagram below:\n\n![](Images/image00140.jpeg)\n\nServer-Side Scripting Flow\n\
    \nStep 1: The user enters a new Web page address or clicks a link that requires\
    \ a new Web page from the Web server.\n\nStep 2: The Web browser connects the\
    \ Web server and sends a HTTP GET command with the path name of the requested\
    \ Web page.\n\nStep 3: The Web server fetches the HTML document of the requested\
    \ page or asks an application server to generate the HTML document.\n\nStep 4:\
    \ The Server-side scripting step: The Web server scans the HTML document for any\
    \ server-side script code embedded in the document. The Web server will remove\
    \ the embedded script code and execute it.\n\nWhen the Web server executes the\
    \ embedded script code, it will provide many host objects representing the server\
    \ host environment. Through those host objects, server-side script code can easily\
    \ access the carrying HTML document, the server filesystem, any databases, and\
    \ networked computers.\n\nUsually, server-side script code will update the carrying\
    \ HTML document with dynamic data resulted from its computations.\n\nAt the end\
    \ of the server-side script process step, the updated HTML document is ready to\
    \ be sent back the client - the Web browser.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Server-Side and Client-Side Web Scripting](#part0066.xhtml)\n\
    \n∟Client-Side Scripts for Document Updating\n\nThis section provides an overview\
    \ of client-side scripting. Some scripts are executed to update the page document\
    \ final rendering. Some scripts are registered as event handler to be executed\
    \ later.\n\nServer-side scripting for page document updating happens in step 6\
    \ and 7a as shown in the diagram below:\n\n![](Images/image00141.jpeg)\n\nClient-Side\
    \ Scripts for Document Updating\n\nStep 5: The Web server sends the final HTML\
    \ document to the Web browser."
