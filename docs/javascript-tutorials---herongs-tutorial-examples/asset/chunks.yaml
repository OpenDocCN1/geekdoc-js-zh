  trans: "\n\n# 函数对象的继承属性和方法\n\n本节提供了一个关于如何使用 `Function` 对象继承的属性和方法的教程示例。\n\n由于函数是\
    \ `Function` 类型的对象，因此它具有一些有趣的继承的属性和方法：\n\n- `\"length\"` - 该属性表示此函数预期的参数个数。\n\
    - `\"apply()\"` - 一个方法，用于在指定的对象上使用数组指定的参数调用（执行）此函数。\n- `\"call()\"` - 一个方法，用于在指定的对象上使用指定的参数调用（执行）此函数。\n\
    - `\"toString()\"` - 一个方法，将函数的体体作为字符串返回。\n\n下面的教程示例向你展示了如何使用 `Function` 对象继承的属性和方法：\n\
    \n``` // Function_Properties_and_Methods.js\n// Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n\n   var sign = new Function(\"name\",\n      \"this.signature\
    \ = name;\"\n   )\n\n   println(\"Function body: \" + sign.toString());\n\n  \
    \ println(\"# of parameters: \" + sign.length);\n\n// 在当前对象上执行\n   sign(\"Herong\"\
    );\n   println(\"this.signature: \" + this.signature);\n\n// 在另一个对象上应用\n   var\
    \ java = new Object();\n   sign.apply(java, new Array(\"Sun\"));\n   println(\"\
    java.signature: \" + java.signature);\n\n// 在另一个对象上调用\n   var pc = new Object();\n\
    \   sign.call(pc, \"IBM\");\n   println(\"pc.signature: \" + pc.signature);\n\
    ```\n\n在命令行窗口中使用 `jrunscript` 运行此 JavaScript 文件，你将得到：\n\n```\n Function body:\n\
    function anonymous(name) {\n    this.signature = name;\n}\n\n# of parameters:\
    \ 1\nthis.signature: Herong\njava.signature: Sun\npc.signature: IBM\n```\n\n非常酷。一切都符合我的预期。一个小小的惊喜是，用\
    \ `Function` 构造函数创建的函数对象的名称是 \"anonymous\"。\n\nJavaScript 教程 - Herong 的教程示例\n\n\
    将函数作为“函数”对象使用\n\n# 函数实例属性\n\n本节提供了一个关于如何使用函数的实例属性在多次函数调用之间共享值的教程示例。\n\n作为一个对象，函数也可以拥有它自己的实例属性。函数的实例属性也可以被看是一个静态变量，其值在多次函数调用之间持续。\n\
    \n下面的教程示例向你展示了如何使用函数的实例属性在多次函数调用之间共享值。\n\n``` // Function_Own_Properties.js\n\
    // Copyright (c) HerongYang.com. All Rights Reserved.\n\n   var sign = new Function(\"\
    name\",\n      \"this.signature = name;\"\n      + \"sign.count++;\"\n   )\n \
    \  sign.count = 0;\n\n// 在当前对象上执行\n   sign(\"Herong\");\n\n// 在另一个对象上应用\n   var\
    \ java = new Object();\n   sign.apply(java, new Array(\"Sun\"));\n\n// 在另一个对象上调用\n\
    \   var pc = new Object();\n   sign.call(pc, \"IBM\");\n\n// 函数被调用的次数\n   println(\"\
    Call counts: \" + sign.count);\n```\n\n在命令行窗口中使用 `jrunscript` 运行此 JavaScript 文件，你将得到：\n\
    \n```\n Call counts: 3\n```\n\nJavaScript 教程 - Herong 的教程示例\n\n将函数作为“函数”对象使用\n\
    \n# 使用 \"function\" 语句创建函数对象\n\n本节提供了一个关于如何用 'function' 语句创建函数对象的教程示例，该语句还将将对象赋值给变量。\n\
    \n根据定义，函数是 `Function` 对象类型的一个对象实例。在之前的章节中，我们学习了如何使用 `Function` 构造函数创建函数。\n\n函数也可以用\
    \ \"function\" 语句来创建：\n\n```\n function function_name(parameter_1, parameter_2,\
    \ ...) {\n   statement_1; \n   statement_2;\n   ...\n   return return_expression\n\
    }\n```\n\n\"function\" 语句实际上执行了 4 件事：\n\n- 创建了一个 `Function` 对象。\n- 使用 `\"function_name\"\
    ` 为 `Function` 对象命名。\n- 声明了一个名为 `\"fucntion_name\"` 的变量。\n- 将 `Function` 对象赋值给变量\
    \ `\"function_name\"`。\n\n下面的教程示例向你展示了如何使用 \"function\" 语句来创建 `Function` 对象：\n\
    \n``` // Function_Statements.js\n// Copyright (c) HerongYang.com. All Rights Reserved.\n\
    \n// 使用 \"function\" 语句\nfunction f2c(fahrenheit) {\n   println(\"Converting Fahrenheit\
    \ = \"+fahrenheit);\n   var celsius = (fahrenheit - 32.0 ) / 1.8;\n   println(\"\
    Returning Celsius = \"+celsius);\n   return celsius;\n}\n\n   println(\"Function\
    \ body: \" + f2c.toString());\n\n   println(\"# of parameters: \" + f2c.length);\n\
    \n   var received = f2c.call(this, 70.0);\n   println(\"Received Celsius = \"\
    +received);\n```\n\n在命令行窗口中使用 `jrunscript` 运行此 JavaScript 文件，你将得到：\n\n```\n #\
    \ of parameters: 1\nConverting Fahrenheit = 70\nReturning Celsius = 21.11111111111111\n\
    Received Celsius = 21.11111111111111\n```\n\nJavaScript 教程 - Herong 的教程示例\n\n\
    将函数作为“函数”对象使用\n\n# 使用 \"function\" 运算符创建函数对象\n\n本节提供了一个关于如何用 'function' 运算符创建函数对象的教程示例。用\
    \ 'function' 运算符定义的函数也称为函数字面量（function literal）或表达式（function expression）。\n\n\
    根据定义，函数是 `Function` 对象类型的一个对象实例。在之前的章节中，我们学习了如何使用 `Function` 构造函数创建函数。\n\n函数也可以用\
    \ \"function\" 运算符来创建：\n\n```\n function function_name {\n   statement_1; \n \
    \  statement_2;\n   ...\n   return return_expression\n};\n```\n\n\"function\"\
    \ 运算符实际上只执行了 2 件事：\n\n- 创建了一个 `Function` 对象。\n- 使用 `\"function_name\"` 为 `Function`\
    \ 对象命名。如果没有提供名称，则该 `Function` 对象将没有名称。\n\n用 \"function\" 运算符定义的函数也称为函数字面量或函数表达式。\n\
    \n用 \"function\" 运算符定义的函数应该被赋值给变量。否则，它无法在运算符使用的地方之外访问。\n\n下面的教程示例向你展示了如何使用 \"\
    function\" 运算符创建 `Function` 对象：\n\n``` // Function_Operator.js\n// Copyright (c)\
    \ HerongYang.com. All Rights Reserved.\n\n// 没有引用变量也没有名称的函数\n   function() { println('Apple');\
    \ };\n   // 在表达式之外无法调用\n\n   // 作为表达式的一部分调用是可以的\n   (function() { println('Banana');\
    \ }).call(this);\n\n// 有引用变量但没有名称的函数\n   var orange = function() { println('Orange');\
    \ };\n   orange();\n\n// 有引用变量也有名称的函数\n   var hello = function allo() { println('Hello');\
    \ };\n   hello();\n   // allo(); // 不允许通过函数调用调用\n\n// 有引用变量、参数但没有名称的函数\n   var\
    \ f2c = function (fahrenheit) {\n      println(\"Converting Fahrenheit = \"+fahrenheit);\n\
    \      var celsius = (fahrenheit - 32.0 ) / 1.8;\n      println(\"Returning Celsius\
    \ = \"+celsius);\n      return celsius;\n      };\n   f2c(70.0);\n```\n\n在命令行窗口中使用\
    \ `jrunscript` 运行此 JavaScript 文件，你将得到：\n\n```\n Banana\nOrange\nHello\nConverting\
    \ Fahrenheit = 70\nReturning Celsius = 21.11111111111111\n```\n\nJavaScript 教程\
    \ - Herong 的教程示例\n\n将函数作为“函数”对象使用\n\n# 比较创建的三种方法\n\n本节提供了一个教程示例，用于比较创建函数对象的不同方法：'function'\
    \ 语句、'function' 运算符和 `Function()` 构造函数。\n\n现在我们知道有 3 种创建函数的方法：\n\n- 使用 \"function\"\
    \ 声明语句 - 以传统方式创建函数。\n- 使用 \"function\" 运算符 - 在计算表达式时作为函数字面量动态创建函数。\n- 使用 \"Function()\"\
    \ 构造函数 - 以面向对象的方式创建函数。\n\n"
- fmt: "\nThe tutorial example below shows you how to create functions with 3 different\
    \ ways:\n\n```javascript\n // Function_Creation_Facilities.js\n// Copyright (c)\
    \ HerongYang.com. All Rights Reserved.\n\n// Creating a function with the \"function\"\
    \ declaration statement\n   function convert_1(fahrenheit) {\n      println(\"\
    Converting Fahrenheit = \"+fahrenheit);\n      var celsius = (fahrenheit - 32.0\
    \ ) / 1.8;\n      println(\"Returning Celsius = \"+celsius);\n      return celsius;\n\
    \      }\n\n// Creating a function with the \"function\" operator\n   var convert_2\
    \ = function (fahrenheit) {\n      println(\"Converting Fahrenheit = \"+fahrenheit);\n\
    \      var celsius = (fahrenheit - 32.0 ) / 1.8;\n      println(\"Returning Celsius\
    \ = \"+celsius);\n      return celsius;\n      };\n\n// Creating a function with\
    \ the \"Function()\" constructor\n   var convert_3 = new Function(\"fahrenheit\"\
    ,\n      \"println(\\\"Converting Fahrenheit = \\\"+fahrenheit);\"\n      + \"\
    var celsius = (fahrenheit - 32.0 ) / 1.8;\"\n      + \"println(\\\"Returning Celsius\
    \ = \\\"+celsius);\"\n      + \"return celsius;\"\n      );\n\n// Calling all\
    \ 3\n   convert_1(70.0);\n   convert_2(70.0);\n   convert_3(70.0);\n```\n\nRun\
    \ this JavaScript file with `jrunscript` in a command window, you will get:\n\n\
    ```\n Converting Fahrenheit = 70\nReturning Celsius = 21.11111111111111\n Converting\
    \ Fahrenheit = 70\nReturning Celsius = 21.11111111111111\nConverting Fahrenheit\
    \ = 70\nReturning Celsius = 21.11111111111111\n```\n\n[JavaScript Tutorials -\
    \ Herong's Tutorial Examples](#part0001.xhtml)\n\n# Introduction to Built-in Object\
    \ Types\n\nThis chapter provides a quick introduction of JavaScript built-in objects.\
    \ Topics include the global object and its properties provided by the host environment;\
    \ the `Math` object and its properties; built-in object types: `Function`, `Array`,\
    \ `String`, `Boolean`, `Number`, `Date`, `RegExp`, and `Error`.\n\n* [Overview\
    \ of Built-in Object Types](#part0119.xhtml)\n* [The \"Object\" Object Type -\
    \ The Root Object Type](#part0120.xhtml)\n* [The \"Global\" Object Type - The\
    \ Invisible Global Container](#part0121.xhtml)\n* [Global Properties and Functions\
    \ Defined in ECMAScript](#part0122.xhtml)\n* [Global Properties and Functions\
    \ Provided by \"jrunscript\"]](#part0123.xhtml)\n* [The \"Function\" Object Type\
    \ - Functions Are Objects](#part0124.xhtml)\n* [The \"Array\" Object Type - Arrays\
    \ Are Objects](#part0125.xhtml)\n* [The \"JSON\" Object Type - `parse()` and `stringify()`](#part0126.xhtml)\n\
    * [The \"String\" Object Type - Not Equal to String Primitive Type](#part0127.xhtml)\n\
    * [The \"Boolean\" Object Type - Wrapping Boolean Values into Objects](#part0128.xhtml)\n\
    * [The \"Number\" Object Type - Not Equal to Number Primitive Type](#part0129.xhtml)\n\
    * [The \"Date\" Object Type - Managing Dates and Times](#part0130.xhtml)\n* [The\
    \ \"RegExp\" Object Type - Regular Expression Patterns](#part0131.xhtml)\n* [The\
    \ \"Error\" Object Type - Runtime Exceptions](#part0132.xhtml)\n* [The \"Math\"\
    \ Object Type - The Math Container](#part0133.xhtml)\n\nConclusion:\n\n* JavaScript\
    \ specification, since ECMAScript 3rd Edition, supports these built-in Object\
    \ types: `Object`, `Global`, `Function`, `Array`, `String`, `Boolean`, `Number`,\
    \ `Date`, `RegExp`, `Error`, `Math`.\n* \"Global\" is a special Object type with\
    \ one default instance with no reference variable. But you can access it by `this`\
    \ keyword in the global context.\n* The \"Global\" object instance is used to\
    \ hold all built-in properties and methods like: `undefined`, `eval()`, etc.\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n# Introduction\
    \ to Built-in Object Types\n\n## Overview of Built-in Object Types\n\nThis section\
    \ provides a list of all built-in object types defined in the ECMAScript specification.\n\
    \nThe current Mozilla JavaScript specification defines the following built-in\
    \ object types:\n\n* `Global`: A special object type used to create one and only\
    \ one object to hold global built-in properties and functions. Note that ECMAScript\
    \ only supports one single object of the `Global` object type. You are not allowed\
    \ to the `Global()` constructor to create other Global objects.\n* `Object`: The\
    \ root object type in the object type tree. All other object types are inherited\
    \ from the `Object` object type.\n* `Function`: An object type used to create\
    \ functions. All functions are objects of the `Function` object type.\n* `Boolean`:\
    \ An object type used to create `Boolean` objects. `Boolean` object type allows\
    \ you to handle Boolean` primitive values as objects.\n* `Symbol`: An object type\
    \ used to store all non-String values that may be used as the key of an `Object`\
    \ property.\n* `Error`, `AggregateError`, `EvalError`, `InternalError`, `RangeError`,\
    \ `ReferenceError`, `SyntaxError`, `TypeError`, `URIError`: An object type used\
    \ to create error objects used in exception handling processes.\n* `Number`: An\
    \ object type used to create number objects. `Boolean` object type allows you\
    \ to handle number primitive values as objects.\n* `BigInt`: An object type used\
    \ to create integers that are bigger than `2^(53) - 1`.\n* `Math`: A special object\
    \ type used to create one and only one object to hold mathematics related properties\
    \ and functions.\n* `Date`: An object type used to create date and time objects.\n\
    * `String`: An object type used to create string objects. `String` object type\
    \ allows you to handle string primitive values as objects.\n* `RegExp`: An object\
    \ type used to create regular expression objects for text processing.\n* `Array`,\
    \ `Int8Array`, `Uint8Array`, `Uint8ClampedArray`, `Int16Array`, `Uint16Array`,\
    \ `Int32Array`, `Uint32Array`, `Float32Array`, `Float64Array`, `BigInt64Array`,\
    \ `BigUint64Array`: An object type used to create arrays. All arrays are objects\
    \ of the `Array` type.\n* `Map`: An object type used to hold key-value pairs and\
    \ remembers the original insertion order of the keys. Any value (both objects\
    \ and primitive) may be used as either a key or a value.\n* `Set`: An object type\
    \ used to store unique values of any type, whether primitive values or object\
    \ references.\n* `ArrayBuffer`, `SharedArrayBuffer`, `Atomics`, `DataView`: An\
    \ object type used to represent a generic, fixed-length raw binary data.\n* `JSON`:\
    \ An object type used to hold methods for parsing JavaScript Object Notation (JSON)\
    \ and converting values to JSON.\n* `Promise`: An object type used to represent\
    \ the eventual completion (or failure) of an asynchronous operation, and its resulting\
    \ value.\n* `Generator`, `GeneratorFunction`: An object type used for objects\
    \ returned by generator functions.\n* `AsyncFunction`: An object type to create\
    \ a async async function. In JavaScript, every asynchronous function is actually\
    \ an `AsyncFunction` object.\n* `Reflect`: An object type that provides methods\
    \ for interceptable JavaScript operations. The methods are the same as those of\
    \ proxy handlers. `Reflect` is not a function object, so it's not constructible.\n\
    * `Proxy`: An object type used to define custom behavior for fundamental operations\
    \ (e.g., property lookup, assignment, enumeration, function invocation, etc.)\n\
    \nSee next sections for quick introductions of some built-in object types defined\
    \ above.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n# The \"Object\" Object Type - The Root Object Type\n\nThis section provides\
    \ a quick description and a tutorial example script of the `Object` built-in object\
    \ type, which is the root or base object type of all other object types.\n\nThe\
    \ \"Object\" object type is probably the most important built-in object type.\
    \ It has the following main features:\n\n* `Object` is the root (or base) object\
    \ type in the object type tree. All other object types are inherited from the\
    \ `Object` object type.\n* `Object` objects can be created with the `Object()`\
    \ constructor function.\n* `Object` objects can also be created with an object\
    \ literal: `{property: value, ...}`.\n\nHere is a tutorial sample script showing\
    \ you some of those features:\n"
