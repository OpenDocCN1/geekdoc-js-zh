    \n∟对象简介\n\n### “对象”与“数组”之间的区别\n\n本节对 `Array` 和 `Object` 的相似之处和不同进行了简要描述。提供了一个教程示例，说明如何比较\
    \ `Array` 对象和 `Object` 对象。\n\nJavaScript 支持许多预定义的核心对象类型。其中，`Object` 和 `Array`\
    \ 之间的关系非常紧密。如果你将 `Array` 与 `Object` 进行比较，你应该看到以下相似点和不同点：\n\n- `Array` 是 `Object`\
    \ 的子类，或子原型。因此 `Array` 继承了 `Object` 的所有特征。\n- `Array` 不是一种新的数据类型。`Array` 和 `Object`\
    \ 共享相同的数据类型 `object`。\n- 在 `Array` 对象上的 `typeof` 运算符返回 `object`。\n- 在 `Array`\
    \ 对象上的 `instanceof` 运算符匹配 `Array`。它也匹配 `Object`，因为 `Array` 是 `Object` 的子类。\n-\
    \ `Object` 类型的对象可以使用与 `Array` 对象相同的语法拥有索引属性。\n- `Object` 类型的对象不是 `Array` 对象。\n\
    - `Array` 创建的对象也是 `Object` 对象。\n\n这是一个 JavaScript 教程示例，展示了 `Array` 和 `Object`\
    \ 之间是相似的：\n\n```html\n <html>\n<!-- Object_Associate_Array.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>比较对象与数组</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n   // 创建一个“Array”对象\
    \ - 数组字面量\n   var bookArray = [\n      \"JavaScript Tutorials\",\n      \"Herong\
    \ Yang\",\n      2008,\n      \"Programming\"\n   ];\n\n   // 创建一个“Object”对象 -\
    \ 对象字面量\n   var bookObject = {\n      title: \"JavaScript Tutorials\",\n     \
    \ author: \"Herong Yang\",\n      year: 2008,\n      category: \"Programming\"\
    \n   };\n\n   // 检查 bookArray\n   document.writeln(\"About the \\\"Array\\\" object:\"\
    );\n   document.writeln(\"   Type: \"+(typeof bookArray));\n   document.writeln(\"\
    \   Instance of Object: \"+bookArray instanceof Object));\n   document.writeln(\"\
    \   Instance of Array: \"+bookArray instanceof Array));\n   document.writeln(\"\
    \   Members:\");\n   for (var item in bookArray) {\n      document.writeln(\"\
    \      \"+item+\": \"+bookArray[item]);\n   }\n\n   // 检查 bookObject\n   document.writeln();\n\
    \   document.writeln(\"About the \\\"Object\\\" object:\");\n   document.writeln(\"\
    \   Type: \"+(typeof bookObject));\n   document.writeln(\"   Instance of Object:\
    \ \"+bookObject instanceof Object));\n   document.writeln(\"   Instance of Array:\
    \ \"+bookObject instanceof Array));\n   document.writeln(\"   Members:\");\n \
    \  for (var item in bookObject) {\n      document.writeln(\"      \"+item+\":\
    \ \"+bookObject[item]);\n   }\n</script>\n</pre>\n</body>\n</html>\n```\n\n此教程示例的输出展示了\
    \ `Array` 对象与 `Object` 对象是如何相似的：\n\n```text\n About the \"Array\" object:\n  \
    \ Type: object\n   Instance of Object: true\n   Instance of Array: true\n   Members:\n\
    \      0: JavaScript Tutorials\n      1: Herong Yang\n      2: 2008\n      3:\
    \ Programming\n\nAbout the \"Object\" object:\n   Type: object\n   Instance of\
    \ Object: true\n   Instance of Array: false\n   Members:\n      title: JavaScript\
    \ Tutorials\n      author: Herong Yang\n      year: 2008\n      category: Programming\n\
    ```\n\nJavaScript 教程 - Herong 的教程示例\n\n∟对象简介\n\n### 将“数组”对象作为“对象”使用\n\n本节提供了一个教程示例，说明如何将\
    \ `Array` 对象作为 `Object` 对象来命名属性和方法。\n\n正如我在上一节中提到的，`Array` 是 `Object` 的子类。因此，`Array`\
    \ 对象可以作为 `Object` 对象使用。\n\n"
- fmt: "\n*   Named properties can be added to `\"Array\"` objects.\n*   Elements\
    \ of an `\"Array\"` object are really indexed properties.\n*   Named properties\
    \ and indexed properties can be accessed using the associate array format.\n*\
    \   Methods can be added as named properties or indexed properties.\n\nBelow is\
    \ a JavaScript tutorial example showing you how to use an `\"Array\"` object as\
    \ an `\"Object\"` object:\n\n```\n <html>\n<!-- Object_Array_as_Object.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Using\
    \ an Array as an Object</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n// Using \"this\" to get the properties\nfunction myToString() {\n   return\
    \ '\"'+this.title + '\" by '+this.author;\n}\n\n   // Creating an object of \"\
    Array\"\n   var bookArray = new Array();\n   bookArray[3] = 2008;\n   bookArray[9]\
    \ = \"Programming\";\n\n   // Adding named properties to \"bookArray\"\n   bookArray.author\
    \ = \"Herong Yang\";\n   bookArray.title = \"JavaScript Tutorials\";\n\n   //\
    \ Adding methods in 2 ways\n   bookArray.toString = myToString;\n   bookArray[4]\
    \ = myToString;\n\n   // Checking \"bookArray\"\n   document.writeln();\n   document.writeln(\"\
    About the \\\"Array\\\" object:\");\n   document.writeln(\"   Type: \"+(typeof\
    \ bookArray));\n   document.writeln(\"   Instance Of Object: \"\n      +(bookArray\
    \ instanceof Object));\n   document.writeln(\"   Instance Of Array: \"\n     \
    \ +(bookArray instanceof Array));\n   document.writeln(\"   Array Length: \"+bookArray.length);\n\
    \n   // Looping through all properties and methods\n   document.writeln(\"   Members:\"\
    );\n   var count = 0; \n   for (var item in bookArray) {\n      document.writeln(\"\
    \      \"+item+\": \"+bookArray[item]);\n      count++;\n   }\n   document.writeln(\"\
    \   # of properties and methods: \"+count);\n\n   // Calling its methods\n   document.writeln();\n\
    \   document.writeln(\"Calling its methods:\");\n   document.writeln(\"   bookArray.toString():\
    \ \"\n      +bookArray.toString());\n   document.writeln(\"   bookArray[4]():\
    \ \"+bookArray[4]());\n</script>\n</pre>\n</body>\n</html>\n```\n\nHere is the\
