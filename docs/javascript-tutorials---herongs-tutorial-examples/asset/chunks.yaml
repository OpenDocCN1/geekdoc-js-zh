    \ and JavaScript Dialects](#part0008.xhtml)\n\n## ECMAScript Language Specification\n\
    \nThis section provides a quick description of the ECMAScript Language Specification\
    \ and its version history.\n\nThe ECMAScript Language Specification is developed\
    \ and maintained by `ECMA` (European Computer Manufacturers Association). It defines\
    \ a scripting language standard based on several originating technologies, the\
    \ most well known being `JavaScript` (Netscape) and `JScript` (Microsoft).\n\n\
    ### ECMAScript edition history:\n\n```\n 1997   ECMA-262 Edition 1 - First edition\n\
    1998   ECMA-262 Edition 2 - Editorial changes only\n1999   ECMA-262 Edition 3\
    \ - Added many new features\n   ?   ECMA-262 Edition 4 - Abandoned\n2009   ECMA-262\
    \ Edition 5 - Adds \"strict mode\"\n2011   ECMA-262 Edition 5.1 - Aligned ISO/IEC\
    \ 16262:2011\n2018   ECMA-262 Edition 9\n2019   ECMA-262 Edition 10\n```\n\nECMA\
    \ current definition of ECMAScript: `ECMAScript` is an object-oriented programming\
    \ language for performing computations and manipulating computational objects\
    \ within a host environment.\n\nOne very important note on the ECMAScript specification\
    \ is that it does not provide any facilities to interact with the host environment.\
    \ In another word, a pure `ECMAScript` code written only with rules and objects\
    \ described with the specification can only perform computations and manipulate\
    \ objects in memory. It will not able to exchange data with the host environment.\n\
    \nIn order to exchange data with the host environment, each dialect of ECMAScript\
    \ must extend the specification to add new facilities to interact with the host\
    \ environment.\n\nFor example, The `JavaScript` dialect of ECMAScript designed\
    \ for the `Firefox` browser host environment adds the `\"document\"` object and\
    \ its properties and methods, providing access to the browser's current document.\n\
    \nAnother example, The `JScript` dialect of ECMAScript designed for the Internet\
    \ Information Server (`IIS`) Web server host environment adds the `\"request\"\
    ` object and its properties and methods, providing access to the server's current\
    \ HTTP request.\n\nIf you want to get a copy of the `ECMA-262` (`ECMAScript Language\
    \ Specification`) Edition 9, please visit [http://www.ecma-international.org/publications/standards/Ecma-262.htm](http://www.ecma-international.org/publications/standards/Ecma-262.htm).\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[ECMAScript\
    \ Language Specification and JavaScript Dialects](#part0008.xhtml)\n\n## Automatic\
    \ Semicolon Insertion to End Statements\n\nThis section provides the automatic\
    \ semicolon insertion rule supported by the ECMAScript specification. A tutorial\
    \ example is provided to show you a problem when writing `'return'` in a line\
    \ by itself.\n\nECMAScript has very interesting rule for automatic semicolon insertion\
    \ to end statements. Here is how the specification describes this rule:\n\n*Certain\
    \ ECMAScript statements (empty statement, variable statement, expression statement,\
    \ do-while statement, continue statement, break statement, return statement, and\
    \ throw statement) must be terminated with semicolons. Such semicolons may always\
    \ appear explicitly in the source text. For convenience, however, such semicolons\
    \ may be omitted from the source text in certain situations. These situations\
    \ are described by saying that semicolons are automatically inserted into the\
    \ source code token stream in those situations.*\n\nThe first situation is when,\
    \ as the program is parsed from left to right, a token (called the offending token)\
    \ is encountered that is not allowed by any production of the grammar, then a\
    \ semicolon is automatically inserted before the offending token if one or more\
    \ of the following conditions is true:\n\n*   The offending token is separated\
    \ from the previous token by at least one `LineTerminator`.\n*   The offending\
    \ token is `}`.\n\nOther situations are listed in the specification.\n\nThe Automatic\
    \ Semicolon Insertion rule is very nice in many cases. But in some cases, it could\
    \ cause problems. See the following interesting example:\n\n```\n <html>\n<!--\
    \ Semicolon_Insertion.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head><title>Semicolon Insertion Rule</title></head>\n<body><body>\n<pre>\n\
    <script type=\"text/javascript\">\n   document.writeln(\"Gravity: \"+getGravity());\n\
