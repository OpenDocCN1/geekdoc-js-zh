    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction\
    \ to Objects](#part0073.xhtml)\n\n∟Object Literals of the \"Object\" Type\n\n\
    This section provides a quick description of object literals or initializers for\
    \ creating new objects of the 'Object' type. A tutorial example is provided on\
    \ how to initialize an object with two properties and two methods.\n\nIn previous\
    \ sections we learned that objects of \"Object\" type can be created with the\
    \ constructor function \"new Object()\".\n\nJavaScript also support a simpler\
    \ way to create objects of \"Object\" type using object literals in the format\
    \ of:\n\n```\n {property1: value1, property2: value2, ...}\n```\n\nwhere \"property1\"\
    \ and \"property2\" are property or method names. In JavaScript language, properties\
    \ and methods in an object are really managed in an identical way.\n\nAn object\
    \ literal is also called object initializer, because it allows you to create a\
    \ new object and to initialize it with properties and methods in a single operation.\n\
    \nUsing an object literal to create an object has the same result as using the\
    \ constructor. But object literals are much easier to use. The following two code\
    \ segments are identical. But the first one is much simpler:\n\n```\n // Creating\
    \ an object with an object literal\n   var obj = {property1: value1, property2:\
    \ value2, ...};\n\n   // Creating an object with the constructor\n   var obj =\
    \ new Object();\n   obj.property1 = value1;\n   obj.property2 = value2;\n   ...;\n\
    ```\n\nHere is a tutorial example of creating an object of the \"Object\" type\
    \ with an object literal, or initializer:\n\n```\n <html>\n<!-- Object_Literal.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Object\
    \ Literals of \"Object\" Type</title>\n</head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n\n// Using \"this\" to get the properties\nfunction myToString()\
    \ {\n   return '\"'+this.title + '\" by '+this.author;\n}\n\n// Using \"this\"\
    \ to get the \"toString\" method\nfunction showAll() {\n   window.alert(this.toString());\n\
    }\n\n   // Using object literal format\n   var myBook = {\n      author: \"Herong\
    \ Yang\",\n      title: \"JavaScript Tutorials\",\n      print: showAll,\n   \
    \   toString: myToString\n   };\n\n   // Calling the method on \"myBook\"\n  \
    \ myBook.print();\n</script>\n</pre>\n</body>\n</html>\n```\n\nIf you run this\
    \ tutorial example, you will get the same result as the example in the previous\
    \ section: \"JavaScript Tutorials\" by Herong Yang.\n\n[JavaScript Tutorials -\
    \ Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to Objects](#part0073.xhtml)\n\
    \n∟Objects and Associate Arrays\n\nThis section provides a quick description of\
    \ access object properties using the associate array formats object_name['property_name'].\
    \ A tutorial example is provided on how to use objects as associate arrays.\n\n\
    In previous section, I mentioned that methods of an object are managed in the\
    \ same as properties in JavaScript. This leads to another nice feature of JavaScript\
    \ objects:\n\nObjects in JavaScript are really associated arrays, which contains\
    \ a collection of key-value pairs. Keys represent property names and method names,\
    \ and values represent property values and function definitions.\n\nNow you know\
    \ how to refer to a method property or a method in two ways:\n\n*   Dot (.) Operator\
    \ - Example: object_name.property_name.\n\n*   Associate Array Operator - Example:\
    \ object_name[\"property_name\"]\n\nHere is a tutorial example on how to access\
    \ object's properties and methods in the format of an associate arrays:"
