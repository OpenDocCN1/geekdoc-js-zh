    \n## The \"Boolean\" Object Type - Wrapping Boolean Values into Objects\n\nThis\
    \ section provides a quick description and a tutorial example script on the 'Boolean'\
    \ built-in object type, which is used to create 'Boolean' objects.\n\nThe \"Boolean\"\
    \ object type is a special built-in object type to be used to create a \"Boolean\"\
    \ object, which is different than a Boolean value of the Boolean primitive type.\
    \ It has the following main features:\n\n- New \"Boolean\" objects can be created\
    \ with the `Boolean()` constructor. Note that `Boolean()` is also a regular function,\
    \ which returns a Boolean value, not a \"Boolean\" object.\n- All \"Boolean objects\"\
    \ have 2 inherited methods: `toString()` and `valueOf()`.\n- A string value can\
    \ be converted to a \"Boolean\" object on the fly with the `.` operator, for example:\
    \ `(2>1).toString()`.\n- The \"Boolean\" object type is used to wrap Boolean values\
    \ into objects. There are no other benefits of using \"Boolean\" objects.\n\n\
    Here is a tutorial example script showing some of those features:\n\n```\n //\
    \ Boolean_Object_Type.js\n// Copyright (c) HerongYang.com. All Rights Reserved.\n\
    \n   // Creating a new Boolean object\n   var isBetter = new Boolean(\"JavaScript\"\
    >\"Java\");\n\n   // Checking this object\n   println(\"\\nAbout this \\\"isBetter\\\
    \":\");\n   println(\"   Type = \"+(typeof isBetter));\n   println(\"   Instance\
    \ Of Object: \"+(isBetter instanceof Object));\n   println(\"   Instance Of Boolean:\
    \ \"+(isBetter instanceof Boolean));\n\n   // Using Boolean's inherited methods\n\
    \   var v = isBetter.valueOf();\n   var s = isBetter.toString();\n\n   println(\"\
    \\nExecution result:\");\n   println(\"   typeof isBetter = \"+(typeof isBetter));\n\
    \   println(\"   typeof isBetter.valueOf() = \"+(typeof v));\n   println(\"  \
    \ typeof isBetter.toString() = \"+(typeof s));\n\n   println(\"\\nConverting to\
    \ Boolean objects on the fly:\");\n   println(\"   \\\"...\\\".toString() = \"\
    \n      +((\"JavaScript\">\"Java\").toString()));\n```\n\nIf you run this script\
    \ with `jrunscript`, you will get:\n\n```\n About this \"isBetter\":\n   Type\
    \ = object\n   Instance Of Object: true\n   Instance Of Boolean: true\n\nExecution\
    \ result:\n   typeof isBetter = object\n   typeof isBetter.valueOf() = boolean\n\
    \   typeof isBetter.toString() = string\n\nConverting to Boolean objects on the\
    \ fly:\n   \"...\".toString() = true\n```\n\nNow we know how to create \"Boolean\"\
    \ objects with the `Boolean()` constructor.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to Built-in Object Types](#part0118.xhtml)\n\
    \n## The \"Number\" Object Type - Not Equal to Number Primitive Type\n\nThis section\
    \ provides a quick description and a tutorial example script on the 'Number' built-in\
    \ object type, which is used to create 'Number' objects.\n\nThe \"Number\" object\
    \ type is a special built-in object type to be used to create a \"Number\" object,\
    \ which is different than a Number value of the Number primitive type. It has\
    \ the following main features:\n\n- New \"Number\" objects can be created with\
    \ the `Number()` constructor. Note that `Number()` is also a regular function,\
    \ which returns a Number value, not a \"Number\" object.\n- All \"Number objects\"\
    \ have several inherited methods: `toString()`, `valueOf()`, `toFixed()`, etc..\n\
    - A number value can be converted to a \"Number\" object on the fly with the `.`\
    \ operator, for example: `(2/3).toFixed(2)`.\n- The \"Number\" constructor offers\
    \ its own properties: `Number.MAX_VALUE`, `Number.MIN_VALUE`, etc..\n\nHere is\
    \ a tutorial example script showing some of those features:\n\n```\n // Number_Object_Type.js\n\
    // Copyright (c) HerongYang.com. All Rights Reserved.\n\n   // Creating a new\
    \ Number object\n   var myObject = new Number(3.14159);\n\n   // Checking this\
    \ object\n   println(\"\\nAbout this \\\"myObject\\\":\");\n   println(\"   Type\
    \ = \"+(typeof myObject));\n   println(\"   Instance Of Object: \"+(myObject instanceof\
    \ Object));\n   println(\"   Instance Of Number: \"+(myObject instanceof Number));\n\
    \n   // Using Number's inherited methods\n   var v = myObject.valueOf();\n   var\
