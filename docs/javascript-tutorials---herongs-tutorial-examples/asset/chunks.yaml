    \ call: Red,Green,Blue,Yellow\n   After call: Dog,Cat,Fish,Bird\n```\n\nThe output\
    \ shows no surprises. When statement \"swap_values(first,second);\" is executed,\
    \ Copies of values stored in \"first\" and \"second\" are passed into the swap_values()\
    \ function. The swap operation inside swap_values() is performed on copied values.\
    \ Not on original values in \"first\" and \"second\". This is why \"first\" still\
    \ contains \"Blank\" after the function call.\n\nWhen statement \"swap_arrays(colors,animals);\"\
    \ is executed, References to arrays stored in \"colors\" and \"animals\" are passed\
    \ into the swap_arrays() function. The swap operation inside swap_arrays() is\
    \ performed on original arrays. This is why the \"colors\" array contains animals\
    \ now.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Defining and Calling Functions](#part0036.xhtml)\n\n∟Function Parameters Are\
    \ Passed as Local Copies\n\nThis section provides a quick description of how primitive\
    \ parameters and object parameters are all passed as local copies of whatever\
    \ original variables store.\n\nAs shown in a previous section, JavaScript function\
    \ call follows two rules: primitive parameters are passed by value and object\
    \ parameters are passed by reference.\n\nBut actually, both rules are derived\
    \ from a single rule: parameters are passed as local copies of whatever original\
    \ variable store:\n\n*   If a parameter is a primitive variable, a local copy\
    \ of the variable is created inside the function. Since a primitive variable contains\
    \ the value directly, the local copy is a copy of the value. Therefore we say\
    \ primitive parameters are passed by value.\n\n*   If a parameter is an object\
    \ variable, a local copy of the variable is created inside the function. Since\
    \ an object variable contains the reference to the object, the local copy is a\
    \ copy of the reference. Therefore we say object parameters are passed by value.\n\
    \nNotice that the above explanation uses these assumptions:\n\n*   A primitive\
    \ variable contains the value directly.\n\n*   An object variable contains the\
    \ reference to the object. In other words, an object variable contains the address\
    \ where the object is stored.\n\nSaying that parameters are passed as local copies\
    \ is actually more accurate, because passing parameters by reference is a very\
    \ different programming feature.\n\nTaking VBScript as an example, it supports\
    \ the \"ByRef\" keyword to allow you to pass a function parameter as true reference\
    \ for any data types, including primitive types. A VBScript function will not\
    \ create a local copy of a \"ByRef\" parameter. It will use the \"ByRef\" parameter\
    \ as an alias of the original variable.\n\nThe following VBScript code will swap\
    \ the original variables by using \"ByRef\" parameters:\n\n```\n vFirst = \"Dog\"\
    \nvSecond = \"Cat\"\nCall SwapByRef(vFirst, vSecond)\ndocument.writeln(\" After\
    \ Sub: \" & vFirst & \" | \" & vSecond)\n\nSub SwapByRef(ByRef vLeft, ByRef vRight)\n\
    vTemp = vLeft\nvLeft = vRight\nvRight = vTemp\nEnd Sub\n```\n\nIf you try to write\
    \ a JavaScript function to swap two objects, you will definitely fail. See the\
    \ next section for my examples.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Defining and Calling Functions](#part0036.xhtml)\n\n∟Function Parameters Are\
    \ Passed as Local Copies - Example\n\nThis section provides a tutorial example\
    \ on swapping original primitive and object variables in a function.\n\nTo prove\
    \ that JavaScript function always create local copies for object parameters, I\
    \ wrote the following tutorial example to try to swap two objects:\n\n```\n <html>\n\
    <!-- Swap_Function.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head><title>Swap Function</title></head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n// Defining a swap function\nfunction swap(left, right) {\n\
    \   var temp = left;\n   left = right;\n   right = temp;\n   document.write(\"\
    \   Inside swap(): \"+left+\" | \"+right+\"\\n\");\n   document.write(\"   Type\
    \ of argument: \"+(typeof left)+\"\\n\"); \n}\n\n   var first = \"Dog\";\n   var\
    \ second = \"Cat\";\n   document.write(\"\\nTest 1: Swapping two string variables\\\
    n\");\n   document.write(\"   Before call: \"+first+\" | \"+second+\"\\n\");\n\
    \   swap(first,second);\n   document.write(\"   After call: \"+first+\" | \"+second+\"\
    \\n\");\n\n   var one = new String(\"White\");\n   var two = new String(\"Black\"\
    );\n   document.write(\"\\nTest 2: Swapping two string objects\\n\");\n   document.write(\"\
    \   Before call: \"+one+\" | \"+two+\"\\n\");\n   swap(one,two);\n   document.write(\"\
    \   After call: \"+one+\" | \"+two+\"\\n\");\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output shows that function parameters are always passed as local copies\
    \ of original variables:\n\n```\n Test 1: Swapping two string variables\n   Before\
    \ call: Dog | Cat\n   Inside swap(): Cat | Dog\n   Type of argument: string\n\
    \   After call: Dog | Cat\n\nTest 2: Swapping two string objects\n   Before call:\
    \ White | Black\n   Inside swap(): Black | White\n   Type of argument: object\n\
    \   After call: White | Black\n```\n\nThere is no way to swap two original variables\
    \ in a function, no matter if they are primitive variables or object variables.\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining\
    \ and Calling Functions](#part0036.xhtml)\n\n∟Global and Local Variables - Scope\
    \ Rules\n\nThis section provides a quick description of global variables and local\
    \ variables. Basic rules about variable scopes are provided.\n\nWhen functions\
    \ are used in a JavaScript code, variables are declared in two scope levels. Here\
    \ are some basic rules related to variable scope:\n\n1\\. Script Level Scope -\
    \ A variable declared with a \"var\" statement outside any function has a scope\
    \ at the script level. A variable with a script level scope, called global variable,\
    \ is valid everywhere in the script, even inside functions.\n\n2\\. Function Level\
    \ Scope - A variable declared with a \"var\" statement inside a function has a\
    \ scope at the function level. A variable with a function level scope, called\
    \ local variable, is valid only inside the function where it is declared.\n\n\
    3\\. Auto-declaration - If a variable is used without the \"var\" declaration\
    \ statement, it will be automatically declared with the script level scope, becoming\
    \ a global variable, event it is used inside a function. But using this approach\
    \ of auto declaration global variables is not recommended.\n\n4\\. Collision -\
    \ If a variable is explicitly defined in a function has the same name as a variable\
    \ defined outside the function, the variable outside the function become in-accessible\
    \ within this function.\n\nThere are some interesting consequences of those rules:\n\
    \n*   The nice thing about rule #1 is that variables defined the main code are\
    \ automatically accessible in all procedures. You don't have to pass them as reference\
    \ arguments to share them in a procedure.\n\n*   The bad thing about rule #2 is\
    \ that if you are using temporary variable in a procedure without explicit declaration,\
    \ you could accidentally change the value of a global variable of the same name.\n\
    \n*   Rule #3 helps us to avoid the bad impact of rule #3, if you declare all\
    \ temporary variables explicitly in procedures.\n\nSee the next section for examples\
    \ of how variable scope rules are applied.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Defining and Calling Functions](#part0036.xhtml)\n\
    \n∟Global Variables - Examples\n\nThis section provides a tutorial example on\
    \ how global variables behave inside and outside functions.\n\nTo see how global\
    \ variables behave inside and outside functions, I wrote the following tutorial\
    \ example:"
