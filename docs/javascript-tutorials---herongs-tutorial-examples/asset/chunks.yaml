    # JavaScript Tutorials


    - Herong''s Tutorial Examples


    ![](Images/image00133.jpeg)


    2.31, 2020


    Dr. Herong Yang


    Copyright © 2020 by Dr. Herong Yang. All rights reserved.


    This book is a collection of tutorial examples and notes written by the author
    while he was learning JavaScript. Topics include ECMAScript specifications; data
    types, variables and expressions; flow control statements: `if`, `for`, `switch`,
    and `while`; using arrays and objects; defining and calling functions; embedding
    JavaScript code in HTML documents; `DOM` (Document Object Model) API levels; using
    the JavaScript console in Web browsers; creating new object types with prototypes;
    building prototype inheritance hierarchy; managing functions as objects; `jrunscript`
    JavaScript shell. Updated in 2020 (Version 2.31) with minor corrections. For latest
    updates and free sample chapters, visit http://www.herongyang.com/JavaScript.


