    \ this simple tutorial example to create an object of \"Object\" data type, and\
    \ add a new property on this new object:\n\n```\n <html>\n<!-- Object_Data_Type_and_Value.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Object\
