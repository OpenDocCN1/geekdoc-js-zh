    \   tempVar = Bird\n   tempNoVar = Fish - Updated\n```\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining and Calling Functions](#part0036.xhtml)\n\
    \n# \"return\" Statement and Return Value\n\nThis section provides a tutorial\
    \ example on how `return` statements pass values back. To help you understand\
    \ different types of return values, I wrote this tutorial example:\n\n```html\n\
    \ <html\n<!-- Return_Values.html\n   Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n-->\n<head><title>Return Values</title></head>\n<body>\n<pre>\n<script\
    \ type=\"text/javascript\">\n\n   var resValue = valueReturn();\n   var resObject\
    \ = objectReturn();\n   var resUndefined = noReturn();\n\n   document.write(\"\
    \\n\\nAfter function calls:\");\n   document.write(\"\\n   resValue = \" + resValue);\n\
    \   document.write(\"\\n   resObject = \" + resObject);\n   document.write(\"\\\
    n   resUndefined = \" + resUndefined);\n\nfunction valueReturn() {\n   var value\
    \ = \"String value\";\n   return value;\n}\n\nfunction objectReturn() {\n   var\
    \ object = new Array(\"Array object\");\n   return object;\n}\n\nfunction noReturn()\
    \ {\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output of this tutorial\
    \ example shows no surprises:\n\n```\n valueReturn()\nobjectReturn()\nnoReturn()\n\
    \nAfter function calls:\n   resValue = String value\n   resObject = Array object\n\
    \   resUndefined = undefined\n```\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n# Web Browser Supporting JavaScript\n\nThis chapter\
    \ provides introductions and tutorial examples on how Web browsers provide support\
