    In the previous section, we learned how to use the \"instanceof\" operator. But\
    \ JavaScript offers another operator called \"typeof\", which works like \"instanceof\"\
    . Here is a comparison of them:\n\n1\\. \"object_name instanceof constructor_name\"\
    \ returns true if the specified object is an instance of the specified type.\n\
    \n2\\. \"typeof expression\" returns the data type name of the specified expression.\
    \ Remember that JavaScript supports several data types: \"number\", \"string\"\
    , \"boolean\", \"object\", \"function\", and \"undefined\".\n\nTo show you those\
