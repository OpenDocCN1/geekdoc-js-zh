    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining\
    \ Your Own Object Types](#part0084.xhtml)\n\n∟\"prototype\" Property of the Constructor\
    \ Function Object\n\nThis section provides a quick description of the built-in\
    \ 'prototype' property on the constructor function. A tutorial example is provided\
    \ on how to store properties and methods in the 'prototype' property to be inherited\
    \ by all objects created by the constructor.\n\nIn previous sections, we learned\
    \ that a constructor can be used to create new objects. But a constructor also\
    \ carries a built-in property called \"prototype\", which provides the mechanism\
    \ to allow objects to share and inherit properties and methods.\n\n*   A constructor\
    \ is also an object of the \"Function\" type.\n\n*   A constructor can its own\
    \ properties as an object.\n\n*   Every constructor has a default property called\
    \ \"prototype\".\n\n*   The default \"prototype\" property of a constructor is\
    \ an object.\n\n*   New properties and methods can be added to the constructor's\
    \ \"prototype\" object.\n\n*   All properties and methods of the constructor's\
    \ \"prototype\" object are shared by all objects created from this constructor.\n\
    \nLet's test this out using the following tutorial example:\n\n```\n <html>\n\
    <!-- Prototype_Property_on_Constructor.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>The \"prototype\" Property on the\
    \ Constructor Function</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// Defining object type constructor function\nfunction Book(title, author)\
    \ {\n   this.title = title;\n   this.author = author;\n}\n\n   // Adding properties\
    \ and methods to the \"prototype\"\n   Book.prototype.price = 9.99;\n   Book.prototype.getDesc\
    \ = getDescription;\n\n// Defining a function to be used as a method\nfunction\
    \ getDescription() {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n\
    }\n\n   // Creating an object of \"Book\"\n   var myBook = new Book(\"JavaScript\
    \ Tutorials\", \"Herong Yang\");\n\n   // Showing the object, constructor, and\
    \ prototype\n   showObject(myBook, \"myBook\");\n   showObject(Book, \"Book\"\
    );\n   showObject(Book.prototype, \"Book.prototype\");\n\nfunction showObject(object,\
    \ name) {\n   document.writeln(\"\\nShowing object \\\"\"+name+\"\\\"\");\n  \
    \ document.writeln(\"   Type: \"+(typeof object));\n   document.writeln(\"   Property/method\
    \ names and values:\");\n   for (var item in object) {\n      document.writeln(\"\
    \      \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of this tutorial example shows that how the properties and methods\
    \ of the \"prototype\" are inherited by the object:\n\n```\n Showing object \"\
    myBook\"\n   Type: object\n   Property/method names and values:\n      title:\
    \ JavaScript Tutorials\n      author: Herong Yang\n      price: 9.99\n      getDesc:\
    \ function getDescription() {\n    return \"\\\"\" + this.title + \"\\\" by \"\
    \ + this.author;\n}\n\nShowing object \"Book\"\n   Type: function\n   Property/method\
    \ names and values:\n      prototype: [object Object]\n\nShowing object \"Book.prototype\"\
    \n   Type: object\n   Property/method names and values:\n      price: 9.99\n \
    \     getDesc: function getDescription() {\n    return \"\\\"\" + this.title +\
    \ \"\\\" by \" + this.author;\n}\n```\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[Defining Your Own Object Types](#part0084.xhtml)\n\
    \n∟\"instanceof\" Operator - Determining Object Type\n\nThis section provides\
    \ a quick description of the 'instanceof' operator. A tutorial example is provided\
    \ on how to use the 'instanceof' operator to determine what is the type of an\
    \ object, and its parent types.\n\nSo far, we have played with several types of\
    \ objects, like Object, Array, Function, and Book (my own object type). And we\
    \ know how to create objects with these type by using their constructor functions.\n\
    \nBut we are given an object, how can we test its object type? JavaScript offers\
    \ the \"instanceof\" operator to help us with this expression\n\n```\n object_name\
    \ instanceof constructor_name;\n```\n\nThis \"instanceof\" expression returns\
    \ a Boolean value indicating whether or not the specified object is an instance\
    \ of the specified type (the constructor name represents the object type name).\n\
    \nThe tutorial examples below uses the \"instanceof\" operator to test 3 objects\
    \ used in my previous example:\n\n```\n <html>\n<!-- Prototype_instanceof_Operator.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>The\
    \ \"instanceof\" Operator - Determining Object Types</title>\n</head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n\n// Defining object type constructor\
    \ function\nfunction Book(title, author) {\n   this.title = title;\n   this.author\
    \ = author;\n}\n\n   // Adding properties and methods to the \"prototype\"\n \
    \  Book.prototype.price = 9.99;\n   Book.prototype.getDesc = getDescription;\n\
    \n// Defining a function to be used as a method\nfunction getDescription() {\n\
    \   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // Creating\
    \ an object of \"Book\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"\
    Herong Yang\");\n\n   // Showing the object, constructor, and prototype\n   showObject(myBook,\
    \ \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype,\
    \ \"Book.prototype\");\n   showObject(Object, \"Object\");\n   showObject(Object.prototype,\
    \ \"Object.prototype\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\
    \\nShowing object \\\"\"+name+\"\\\"\");\n\n   // Using \"instanceof\" to determine\
    \ object type\n   document.writeln(\"   Instance of Object: \"\n      +(object\
    \ instanceof Object));\n   document.writeln(\"   Instance of Function: \"\n  \
    \    +(object instanceof Function));\n   document.writeln(\"   Instance of Book:\
    \ \"\n      +(object instanceof Book));\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nHere is the output of this tutorial example:"
