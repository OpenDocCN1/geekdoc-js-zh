    \ code in command line; interactive or batch mode.\n\n> [Downloading and Installing\
    \ JDK 10](#part0105.xhtml)\n\n> \n\n> [\"jrunscript\" - Scripting Shell Command\
    \ and Options](#part0106.xhtml)\n\n> \n\n> [Running JavaScript Code with 'jrunscript'](#part0107.xhtml)\n\
    \n> \n\n> [Evaluating JavaScript Code with 'jrunscript' Interactively](#part0108.xhtml)\n\
    \n> \n\n> [Running a JavaScript Code File with 'jrunscript'](#part0109.xhtml)\n\
    \nConclusion:\n\n*   JDK (Java Development Kit) package includes a JavaScript\
    \ execution tool called \"jrunscript\".\n\n*   You can run JavaScript code interactively\
    \ using the \"jrunscript\" command.\n\n*   You can run JavaScript code embedded\
    \ in the command line using \"jrunscript -e\" option.\n\n*   You can run JavaScript\
    \ code stored in a file using the \"jrunscript -f\" command.\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟['jrunscript' - JavaScript\
    \ Shell Command from JDK](#part0104.xhtml)\n\n∟Downloading and Installing JDK\
    \ 10\n\nThis section describes how to download and install Java SE 1.6 Update\
    \ 2 on Windows.\n\n**\"jrunscript\"**: A command line script shell included in\
    \ the current version JDK (Java Development Kit) from Oracle.com. \"jrunscript\"\
    \ supports both an interactive (read-eval-print) mode and a batch (-f option)\
    \ mode of script execution. This is a scripting language independent shell. By\
    \ default, JavaScript is the language used, but the -l option can be used to specify\
    \ a different language.\n\n\"jrunscript\" allows you to run JavaScript code in\
    \ a stand alone mode without using any Web browsers. In order to try \"jrunscript\"\
    , you have to have a copy of JDK installed on your machine.\n\nHere is what I\
    \ did to download and install JDK 10 on my Windows machine.\n\n*   Open the Java\
    \ SE Download page with this URL: [http://www.oracle.com/technetwork/java/javase/downloads/](http://www.oracle.com/technetwork/java/javase/downloads/).\n\
    \n*   Click the download button next to \"Java Platform (JDK) 10\". You will see\
    \ a new page with a list of different download files of JDK 10.\n\n*   Accept\
    \ the license agreement.\n\n*   Click the hyper link of \"jdk-10.0.1_windows-x64_bin.exe\"\
    , next to \"Windows 390.19 MB\".\n\n*   Save jdk-10.0.1_windows-x64_bin.exe to\
    \ a temporary directory.\n\n*   Double-click on jdk-10.0.1_windows-x64_bin.exe\
    \ to start the installation wizard.\n\n*   The installation wizard will guide\
    \ you to finish the installation.\n\nTo test the installation, open a command\
    \ window to try the java command. If you are getting the following output, your\
    \ installation was ok:\n\n```\n C:\\herong>\\progra~1\\java\\jdk-10.0.1\\bin\\\
    java -version\njava version \"10.0.1\" 2018-04-17\nJava(TM) SE Runtime Environment\
    \ 18.3 (build 10.0.1+10)\nJava HotSpot(TM) 64-Bit Server VM 18.3 (build 10.0.1+10,\
    \ mixed mode)\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟['jrunscript' - JavaScript Shell Command from JDK](#part0104.xhtml)\n\n∟\"\
    jrunscript\" - Scripting Shell Command and Options\n\nThis section describes the\
    \ scripting shell, 'jrunscript', command and options. The default scripting engine\
    \ is JavaScript - ECMAScript 1.6 implementation 'Mozilla Rhino' 1.6 release 2.\n\
    \nAfter installing JDK on my machine, I want to get some help information on how\
    \ to use the \"jrunscript\" command by running it with the \"-help\" option:\n\
    \n```\n C:\\herong>\\progra~1\\java\\jdk-10.0.1\\bin\\jrunscript -help\n\nUsage:\
    \ jrunscript [options] [arguments...]\n\nwhere [options] include:\n -classpath\
    \ <path>    Specify where to find user class files\n -cp <path>           Specify\
    \ where to find user class files\n -D<name>=<value>     Set a system property\n\
    \ -J<flag>             Pass <flag> directly to the runtime system\n -l <language>\
    \        Use specified scripting language\n -e <script>          Evaluate given\
    \ script\n -encoding <encoding> Specify character encoding used by script files\n\
    \ -f <script file>     Evaluate given script file\n -f -                 Interactive\
    \ mode, read script from standard \n                      input. If this is used,\
    \ this should be the last\n                      -f option\n -help           \
    \     Print this usage message and exit\n -?                   Print this usage\
    \ message and exit\n -q                   List all scripting engines available\
    \ and exit\n\nIf [arguments..] are present and if no -e or -f option is used,\
    \ then \nfirst argument is script file and the rest of the arguments, if any,\
    \ \nare passed as script arguments. If [arguments..] and -e or -f option \nis\
    \ used, then all [arguments..] are passed as script arguments. If \n[arguments..],\
    \ -e, -f are missing, then interactive mode is used.\n```\n\nAs the first test,\
    \ I want to see what are the scripting engines supported by JDK by using the \"\
    -q\" option:\n\n```\n C:\\herong>\\progra~1\\java\\jdk-10.0.1\\bin\\jrunscript\
    \ -q\n\nLanguage ECMAScript ECMA - 262 Edition 5.1 implementation \n\"Oracle Nashorn\"\
    \ 10.0.1\n```\n\nNice. My \"jrunscript\" command is working. There is only one\
    \ default scripting engine: JavaScript - Language ECMAScript ECMA - 262 Edition\
    \ 5.1 implementation \"Oracle Nashorn\" 10.0.1.\n\nHere is the JDK's \"jrunscript\"\
    \ JavaScript engine version history:\n\n*   JDK 13 - Language ECMAScript ECMA\
    \ - 262 Edition 5.1 implementation \"Oracle Nashorn\" 13\n\n*   JDK 10 - Language\
    \ ECMAScript ECMA - 262 Edition 5.1 implementation \"Oracle Nashorn\" 10\n\n*\
    \   JDK 1.8 - Language ECMAScript ECMA - 262 Edition 5.1 implementation \"Oracle\
    \ Nashorn\" 1.8\n\n*   JDK 1.7 - Language ECMAScript 1.8 implementation \"Mozilla\
    \ Rhino\" 1.7 release 3 PRERELEASE\n\n*   JDK 1.6 - Language ECMAScript 1.6 implementation\
    \ \"Mozilla Rhino\" 1.6 release 2.\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟['jrunscript' - JavaScript Shell Command from\
    \ JDK](#part0104.xhtml)\n\n∟Running JavaScript Code with 'jrunscript'\n\nThis\
    \ section describes 3 ways to run JavaScript code with the scripting shell, 'jrunscript':\
    \ interactive mode, batch mode and command line mode.\n\nThe JDK script shell,\
    \ \"jrunscript\", allows you to run JavaScript codes in three ways:\n\n*   \"\
    jrunscript\" - Interactive mode: Running \"jrunscript\" without \"-e\" or \"-f\"\
    \ option tells \"jrunscript\" to run in interactive mode. JavaScript code will\
    \ be entered and evaluated one line as a time from the standard input.\n\n*  \
    \ \"jrunscript -e <script_code>\" - Command line mode: With the \"-e\" option,\
    \ \"jrunscript\" will take script code only from the command line\n\n*   \"jrunscript\
    \ -f <script_file_name>\" - Batch mode: In this mode, \"jrunscript\" will read\
    \ script code from the specified script file.\n\nLet's try the command line mode\
    \ first. There are 2 challenges when entering JavaScript code in the command line:\n\
    \n*   The entire code must be entered in a single line. It is ok to enter multiple\
    \ statements in the command line. But they must be entered in one line without\
    \ any line breaks.\n\n*   On Windows system, the entire code must be enclosed\
    \ in double quotes (\"\"). This may cause problems if you are using double quotes\
    \ inside your JavaScript Statements.\n\nHere are some examples of running \"jrunscript\"\
    \ to evaluate JavaScript codes specified in command line:\n\n```\n C:\\herong>\\\
    progra~1\\java\\jdk-10.0.1\\bin\\jrunscript \\\n   -e \"print('Hello World!');\"\
    \n\nHello World!\n\nC:\\herong>\\progra~1\\java\\jdk-10.0.1\\bin\\jrunscript \\\
    \n   -e \"msg='Hello World!'; print(msg);\"\n\nHello World!\n\nC:\\herong>\\progra~1\\\
    java\\jdk-10.0.1\\bin\\jrunscript \\\n   -e \"var i, j, is_prime; for ( i=3; i<=30;\
    \ i+=2 ) { is_prime = true; \\\n   for ( j=2; j<=i/2; j++) { is_prime = i%j >\
    \ 0; if (!is_prime) \\\n   break;} if (is_prime) println('Found a prime number:\
    \ ' + i); }\"\n\nFound a prime number: 3\nFound a prime number: 5\nFound a prime\
    \ number: 7\nFound a prime number: 11\nFound a prime number: 13\nFound a prime\
    \ number: 17\nFound a prime number: 19\nFound a prime number: 23\nFound a prime\
    \ number: 29\n```"
