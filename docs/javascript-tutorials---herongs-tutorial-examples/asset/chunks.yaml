    , \"parameter_2\", ... in the above syntax format.\n\n*   Function Body - The\
    \ list of statements provided inside curly braces {} forms the function body.\
    \ \"statement_1\", \"statement_2\", ... in the above syntax format.\n\n*   Return\
    \ Value - You should use \"return\" statements in the function body to end the\
    \ execution of the function and to return a return value to the calling statement.\n\
    \nA JavaScript function has the following basic features:\n\n*   Primitive parameters\
    \ are passed by values.\n\n*   Object parameters are passed by references.\n\n\
    *   Extra parameters can be passed into a function without list them in the function\
    \ definition.\n\n*   Parameters can be accessed through a built-in array \"arguments[]\"\
    \ in the function body.\n\n*   Functions can be called recursively.\n\n*   A function\
    \ provides a scope boundary for its local variables.\n\nA tutorial example will\
    \ be given in the next section showing your how to define a new function.\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining\
    \ and Calling Functions](#part0036.xhtml)\n\n∟Defining Your Own Functions - Example\n\
    \nThis section provides a tutorial example on how to define your own JavaScript\
    \ functions.\n\nHere is a JavaScript tutorial example of defining a user function.\n\
    \n```\n <html>\n<!-- Define_Functions.html\n   Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n-->\n<head><title>Define Functions</title></head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n// Defining a null function that does\
    \ nothing\nfunction null() {\n}\n\n// Defining a simple function\nfunction hello()\
    \ {\n   document.write('Hello World!');\n}\n\n// Defining a function to convert\
    \ Fahrenheit to Celsius\nfunction f2c(fahrenheit) {\n   document.write(\"Converting\
    \ Fahrenheit = \"+fahrenheit+\"\\n\");\n   var celsius = (fahrenheit - 32.0 )\
    \ / 1.8;\n   document.write(\"Returning Celsius = \"+celsius+\"\\n\");\n   return\
    \ celsius;\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\nIf you run this JavaScript\
    \ page in a Web browser, you will get a blank window, because it only defines\
    \ 3 functions. But it does not call any of them to run. Therefore no statement\
    \ gets executed.\n\nThe first function null() is defined to do absolutely nothing.\n\
    \nThe second function hello() is defined to write \"Hello World!\" into the HTML\
    \ document.\n\nThe third function f2c() is defined to do a couple of things: taking\
    \ a parameter \"fahrenheit\", declaring a local variable \"celsius\", assigning\
    \ \"celsius\" with the Celsius value converted from \"fahrenheit\", writing two\
    \ lines of text into the HTML document, returning the value in \"celsius\".\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Defining\
    \ and Calling Functions](#part0036.xhtml)\n\n∟Calling Your Own Functions - Example\n\
    \nThis section provides a quick description of how to call your own JavaScript\
    \ functions and a tutorial example of calling temperature conversion function.\n\
    \nOnce a function is defined, you can call it as part of an expression as shown\
    \ in this syntax format:\n\n```\n ... function_name(exp1, exp2, ...) ...;\n}\n\
    ```\n\nWhen the above expression is evaluated, the following steps will be followed:\n\
    \n*   Step 1\\. The specified parameter expressions will be evaluated into primitive\
    \ values or object references before passing them into the function body.\n\n\
    *   Step 2\\. The body of the specified function will be executed.\n\n*   Step\
    \ 3\\. The return value is collected and it will be used to evaluate the rest\
    \ of the calling expression.\n\nHere is a tutorial example that defines a simple\
    \ function to convert a temperature value in Fahrenheit to Celsius:\n\n```\n <html>\n\
    <!-- Define_Call_Functions.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head><title>Define and Call Functions</title></head>\n<body>\n<pre>\n<script\
    \ type=\"text/javascript\">\n// Defining a new function\nfunction f2c(fahrenheit)\
    \ {\n   document.write(\"Converting Fahrenheit = \"+fahrenheit+\"\\n\");\n   var\
    \ celsius = (fahrenheit - 32.0 ) / 1.8;\n   document.write(\"Returning Celsius\
    \ = \"+celsius+\"\\n\");\n   return celsius;\n}\n\n// Calling the new function\n\
    \   var received;\n\n   document.write(\"\\nTest 1:\\n\");\n   received = f2c(70.0)\n\
    \   document.write(\"Received Celsius = \"+received+\"\\n\");\n\n   document.write(\"\
    \\nTest 2:\\n\");\n   received = f2c(212.0)\n   document.write(\"Received Celsius\
    \ = \"+received+\"\\n\");\n\n   document.write(\"\\nTest 3:\\n\");\n   received\
    \ = f2c(0.0)\n   document.write(\"Received Celsius = \"+received+\"\\n\");\n</script>\n\
    </pre>\n</body>\n</html>\n```\n\nThe output of this tutorial example shows no\
    \ surprises:\n\n```\n Test 1:\nConverting Fahrenheit = 70\nReturning Celsius =\
    \ 21.11111111111111\nReceived Celsius = 21.11111111111111\n\nTest 2:\nConverting\
    \ Fahrenheit = 212\nReturning Celsius = 100\nReceived Celsius = 100\n\nTest 3:\n\
    Converting Fahrenheit = 0\nReturning Celsius = -17.77777777777778\nReceived Celsius\
    \ = -17.77777777777778\n```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Defining and Calling Functions](#part0036.xhtml)\n\n∟Passing Parameters by\
    \ Value or by Reference\n\nThis section provides a tutorial example showing that\
    \ primitive parameters are passed by value and object parameters are passed by\
    \ reference.\n\nAs I mentioned in a previous section, JavaScript documentation\
    \ says that primitive parameters are passed by value and object parameters are\
    \ passed by reference. I want to test these rules using the following JavaScript\
    \ tutorial example:\n\n```\n <html>\n<!-- Swap_Values_and_Arrays.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Swap Values and\
    \ Arrays</title></head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n//\
    \ Defining a function to swap values\nfunction swap_values(left, right) {\n  \
    \ var temp;\n   temp = left;\n   left = right;\n   right = temp;\n}\n\n// Defining\
    \ a function to swap arrays\nfunction swap_arrays(left, right) {\n   var temp;\n\
    \   for (var i=0; i<left.length; i++) {\n      temp = left[i];\n      left[i]\
    \ = right[i];\n      right[i] = temp;\n   }\n}\n\n   var first = \"Black\";\n\
    \   var second = \"White\";\n   document.write(\"\\nTest 1: Swapping two string\
    \ variables\\n\");\n   document.write(\"   Before call: \"+first+\" | \"+second+\"\
    \\n\");\n   swap_values(first,second);\n   document.write(\"   After call: \"\
    +first+\" | \"+second+\"\\n\");\n\n   var colors = new Array(\"Red\", \"Green\"\
    , \"Blue\", \"Yellow\");\n   var animals = new Array(\"Dog\", \"Cat\", \"Fish\"\
    , \"Bird\");\n   document.write(\"\\nTest 2: Swapping two array objects\\n\");\n\
    \   document.write(\"   Before call: \"+colors+\"\\n\");\n   swap_arrays(colors,animals);\n\
    \   document.write(\"   After call: \"+colors+\"\\n\");\n</script>\n</pre>\n</body>\n\
    </html>\n```\n\nHere is the output of this tutorial example:"
