    \  return '\"'+this.title + '\" by '+this.author;\n}\n\n   // 使用对象字面量格式\n   var\
    \ myBook = {\n      author: \"Herong Yang\",\n      title: \"JavaScript Tutorials\"\
    ,\n      3: 2008,\n      price: \"Free\",\n      4: myToString\n   };\n\n   //\
