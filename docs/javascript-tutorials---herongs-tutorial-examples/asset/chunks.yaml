    \ (DOM) 规范\n\n## 将 Web 文档视为节点树\n\n本节提供了一个 JavaScript 教程示例用于展示 页面是一个节点树。这展示了 DOM\
    \ API 的简化扁平化视图。\n\n我们知道 Web 页面（一个 HTML 文档）是一个元素树（暂时忽略属性）。从简化的角度来看，所有元素都由 `Node`\
    \ 接口表示。为了区分不同类型的节点，我们可以检查“type”（类型）和“name”（名称）属性。\n\n现在，让我们通过一个简单的 JavaScript\
    \ 示例遍历树，并将每个元素呈现为带有类型和名称的节点：\n\n```\n <html>\n<!-- DOM_API_Simplified_Node_View.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>DOM\
    \ API - Simplified Node View</title>\n<style type=\"text/css\">body {background-color:\
    \ #aaaaff}</style>\n<script type=\"text/javascript\">\nfunction showInterface(node,\
    \ prefix, out) {\n   var typeName = new Array(\"NULL\", \"ELEMENT\", \"ATTRIBUTE\"\
    , \"TEXT\",\n      \"CDATA\", \"ENTITY_REFERENCE\", \"ENTITY\", \"RROCESSING_INSTRUCTION\"\
    ,\n      \"COMMENT\", \"DOCUMENT\", \"DOCUMENT_TYPE\", \"DOCUMENT_FRAGMENT\",\n\
    \      \"NOTATION\");\n   out += prefix+\"[Node type=\"+typeName[node.nodeType]\n\
    \      +\" name=\"+node.nodeName+\"]\\n\";\n   var list = node.childNodes;\n \
    \  for (var i=0; i<list.length; i++) {\n      out = showInterface(list.item(i),\
    \ prefix+\"   \", out);\n   }\n   return out;\n}\nfunction show() {\n   var text\
    \ = document.createTextNode(showInterface(document,\"\",\"\"));\n   var display\
    \ = document.getElementById(\"display\");\n   display.replaceChild(text,display.firstChild);\n\
    }\n</script>\n</head>\n<body>\n第一段文本直接位于 \"body\" 元素中。\n<p>第二段文本位于 \"p\" 元素中。</p>\n\
    <form action=\"nothing\" method=\"get\">\n   <input type=\"button\" value=\"View\"\
    \ onClick=\"show();\"/>\n</form>\n<pre id=\"display\">\n点击 View 按钮查看接口名称...\n\
    </pre>\n</body>\n</html>\n```\n\n注意，我正在使用数组将 `node.nodeType` 从整数转换为字符串。\n\n如果你在\
    \ Firefox 2.0 中运行此 JavaScript 页面并点击 \"View\" 按钮，你将获得一个包含该 Web 页面节点类型和名称的漂亮树列表：\n\
    \n```\n [Node type=DOCUMENT name=#document]\n   [Node type=ELEMENT name=HTML]\n\
    \      [Node type=ELEMENT name=HEAD]\n         [Node type=COMMENT name=#comment]\n\
    \         [Node type=ELEMENT name=TITLE]\n            [Node type=TEXT name=#text]\n\
