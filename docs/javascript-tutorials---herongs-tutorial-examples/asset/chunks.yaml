  trans: "\n现在我可以修改上一节中的 HTML 文档，使用 `\"script\"` 标签来此文件：\n\n```\n <html>\n<!-- Hello_World_Head_Include.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>printHello()\
    \ Function in an Include File</title>\n<script type=\"text/javascript\" src=\"\
    Hello_World_Function.js\">\n</script>\n</head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n   printHello();\n</script>\n</pre>\n</body>\n</html\n```\n\
    \n当然，修改后的 JavaScript 页面的输出将仍然是文本：\"Hello World!\"。\n\n在测试此 `\"script\"` 标签的 `\"\
    src\"` 属性时，我注意到空标签的简写形式不起作用：\n\n```\n <script type=\"text/javascript\" src=\"\
    JavaScript_file_URL\"/>\n```\n\n你必须显式使用结束标签 `</script>`！\n\nJavaScript 教程 - Herong\
    \ 的教程示例\n\n∟支持 JavaScript 的 Web 浏览器\n\n### DOM API - \"document\" 对象\n\n本节提供了对\
    \ DOM API 中 `'document'` 对象的简要描述。还提供了一个关于使用 `'document'` 对象构建简单 HTML 文档的教程示例。\n\
    \n典型的 Web 浏览器提供了 DOM（文档对象模型）API（应用程序编程接口），允许 JavaScript 代码与浏览器以及 HTML 文档进行交互。\n\
    \nDOM API 中最常用的对象是 `\"document\"` 对象，它具有以下特性：\n\n*   `\"document\"` 对象是浏览器内置的对象，代表浏览器中当前的的\
    \ HTML 文档。\n*   `\"document\"` 对象以 `\"node\"` 对象的树形结构表示 HTML 文档中的所有元素。\n*   `\"\
    document\"` 对象及其它的 `\"node\"` 对象提供了多种方法，允许你操纵 HTML 文档。\n*   `\"document\"` 对象在\
    \ JavaScript 和其他编程语言中共享相同的编程接口。\n\n为了演示 `\"document\"` 对象的一些优秀特性，我编写了以下 JavaScript\
    \ 教程示例：\n\n```\n <html>\n<!-- Document_Object.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Document Object</title>\n<script type=\"\
    text/javascript\">\nfunction buildDocument() {\n   // 构建一个 <p> 标签\n   var paragraph\
    \ = document.createElement(\"p\");\n   var text = document.createTextNode(\"Hello\
    \ World!\");\n   paragraph.appendChild(text);\n\n   // 插入 <p> 标签\n   document.body.appendChild(paragraph);\n\
    \   document.body.bgColor = \"lightblue\";\n}\n</script>\n</head>\n<body onLoad=\"\
    buildDocument();\"/>\n</html\n```\n\n如果你在浏览器中运行此 JavaScript ，你将看到浅蓝色背景的 \"Hello\
    \ World!\" 段落。\n\n更多关于 `\"document\"` 对象的教程示例，请参阅本书中的 DOM API 章节。\n\nJavaScript\
    \ 教程 - Herong 的教程示例\n\n∟支持 JavaScript 的 Web 浏览器\n\n### DOM API - \"window\" 对象\n\
    \n本节提供了对 DOM API 中 `'window'` 对象的简要描述。还提供了一个关于从当前浏览器窗口获取属性的教程示例。\n\nWeb 浏览器提供的\
    \ DOM API 包含另一个名为 `\"window\"` 的有用对象，它具有以下特性：\n\n*   `\"window\"` 对象是浏览器内置的对象，代表包含当前\
    \ HTML 文档的浏览器窗口。\n*   `\"window\"` 对象提供了许多属性，允许你获取有关当前窗口的信息。\n*   `\"window\"\
    ` 对象提供了一个名为 `open()` 的方法，允许你创建一个新窗口并获取一个新的窗口对象。\n*   你自己创建的新窗口对象提供了许多方法允许你对其进行操纵。\n\
    *   出于安全考虑，窗口操纵方法将无法作用于当前窗口对象 `\"window\"`。\n\n为了演示如何从当前窗口获取属性，我编写了以下 JavaScript\
    \ 教程示例：\n\n```\n <html>\n<!-- Window_Properties.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Window Properties</title>\n<script\
    \ type=\"text/javascript\">\nfunction getWindowProperties() {\n   var text = \"\
    \";\n   text += \"'document' property: \"+ window.document.title+\"\\n\";\n  \
    \ text += \"'location' property: \"+ window.location.pathname+\"\\n\";\n   text\
    \ += \"'history' property: \"+ window.history.length+\"\\n\";\n   text += \"'navigator'\
    \ property: \"+ window.navigator.appCodeName+\"\\n\";\n   text += \"'outerWidth,outerHeight'\
    \ property: \"\n      + window.outerWidth+\",\"+ window.outerHeight+\"\\n\";\n\
    \   text += \"'innerWidth,innerHeight' property: \"\n      + window.innerWidth+\"\
    ,\"+ window.innerHeight+\"\\n\";\n   text += \"'screenX,screenY' property: \"\n\
    \      + window.screenX+\",\"+ window.screenY+\"\\n\";\n   return text;\n}\n</script>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n   document.write(getWindowProperties());\n\
    </script>\n</pre>\n</body>\n</html\n```\n\n在 Firefox 浏览器中运行此 JavaScript 示例，你将得到类似的内容：\n\
    \n```\n 'document' property: Window Properties\n'location' property: /C:/herong/Window_Properties.html\n\
    'history' property: 1\n'navigator' property: Mozilla\n'outerWidth,outerHeight'\
    \ property: 1024\n768\n'innerWidth,innerHeight' property: 1024\n754\n'screenX,screenY'\
    \ property: 0\n0\n```\n"
- fmt: "\n*   Click the \"Close Window\" button, the new browser window will be closed.\n\
    \nFor more tutorial examples on the `window` object, see the DOM API chapters\
    \ in this book.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### ∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n#### #### Event\
    \ Listeners and Objects\n\nThis section provides a quick description of event\
    \ trigger attributes on different HTML tags and the `event` object representing\
    \ the event with detail information about the event. A tutorial example is provided\
    \ to display mouse location by adding a listener to the mouse-pushed-down event.\n\
    \nA typical Web browser also supports special HTML attributes to let you add event\
    \ listeners and passing event objects. Here are few commonly used HTML attributes\
    \ on various HTML tags:\n\n*   `<body onLoad=\"listener_code\" ...>` - The specified\
    \ listener code will be executed when the `onLoad` event is triggered by the browser\
    \ starting to load the HTML document.\n*   `<body onMouseDown=\"listener_code\"\
    \ ...>` - The specified listener code will be executed when the `onMouseDown`\
    \ event is triggered by the user pushing down the mouse button anywhere in the\
    \ browser window.\n*   `<a onMouseOver=\"listener_code\" ...>` - The specified\
    \ listener code will be executed when the `onMouseOver` event is triggered by\
    \ the user moving mouse over this hyper link.\n*   `<input type=\"button\" onClick=\"\
    listener_code\" ...>` - The specified listener code will be executed when the\
    \ `onClick` event is triggered by the user clicking this button.\n\nMore event\
    \ trigger attributes will be introduced in other chapters in this book.\n\nIn\
    \ each event trigger attribute, the browser will provide an object called `event`,\
    \ which presents this event and contains detailed information about this event.\
    \ This `event` object has various properties and methods for you to use.\n\nTo\
    \ illustrate some nice features of event triggers and the `event` object, I wrote\
    \ this JavaScript tutorial example:\n\n```\n <html>\n<!-- Event_Object_and_Trigger.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Event\
    \ Object and Trigger</title>\n</head>\n<body onMouseDown=\n   \"window.alert('X:\
    \ '+event.clientX+', Y: '+event.clientY);\">\n<p>Click anywhere on the page to\
    \ see location coordinates.</p>\n</body>\n</html>\n```\n\nIn this tutorial example,\
    \ the `onMouseDown` event trigger attribute on the `body` tag is used to add a\
    \ short listener code to be executed with the user push down the mouse button\
    \ on the page. The listener code uses the `event` object provided by the browser\
    \ to retrieve x and y coordinates of the location.\n\nThe coordinates are reported\
    \ back the user with an alert box by calling the `alert()` method on the `window`\
    \ object. See the picture below:\n\n![](Images/image00134.jpeg)\n\nWindow Alert\
    \ Box\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### ∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n#### #### ####'javascript:'\
    \ Pseudo-URL Addresses\n\nThis section describes what is a `javascript:` pseudo-URL\
    \ address and provides several interesting examples of `javascript:` URLs.\n\n\
    Many Web browsers also support `javascript:` pseudo-URL addresses in the form\
    \ of:\n\n```\n javascript:statement;statement;...\n```\n\nWhen a `javascript:`\
    \ pseudo-URL is given to a browser, it will start to evaluate those JavaScript\
    \ statements included in the URL. Here are some examples of `javascript:` pseudo-URL\
    \ addresses that you can try:\n\n1. The following URL will cause the browser to\
    \ display a text message in small dialog box.\n\n```\n javascript:alert(\"Hello\
    \ World!\");\n```\n\n2. The following URL will cause the browser to display a\
    \ new page with a text message.\n\n```\n javascript:document.write(\"<html><body>Hello\
    \ World!</body></html>\");\n```\n\n3. The following URL will cause the browser\
    \ to execute a complex JavaScript code resulting a HTML page with prime numbers.\
    \ Note that the entire URL address must be written in a single line. So you need\
    \ to join those lines below, copy and paste it to a browser.\n\n```\n javascript:var\
    \ i, j, is_prime; document.write('<body><pre>'); \n   for ( i=3; i<=30; i+=2 )\
    \ { is_prime = true; for ( j=2; j<=i/2; j++)\n   { is_prime = i%j > 0; if (!is_prime)\
    \ break;} \n   if (is_prime) document.writeln('Found a prime number: ' + i); }\
    \ \n   document.write('</pre></body>');\n```\n\nNow it's your turn to write more\
    \ `javascript:` URL examples.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### ∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n#### #### ####\
    \ JavaScript Console in Google Chrome\n\nThis section provides tutorial example\
    \ on how to use the JavaScript Console in Google Chrome to view execution errors\
    \ and log messages resulted from JavaScript execution. You can also use it to\
    \ run any JavaScript statements to interact with the HTML document.\n\n**What\
    \ is JavaScript Console in Google Chrome**? JavaScript Console in Google Chrome\
    \ is a console provided by the browser for you:\n\n*   To see any errors or log\
    \ messages generated by the browser when executing embedded JavaScript codes.\n\
    *   To run any JavaScript code to interact with the Web document interactively.\n\
    \nHere is what I did to test the JavaScript Console in Google Chrome:\n\n1. Run\
    \ Google Chrome and load the following HTML code:\n\n```\n <html>\n<head><title>Hello\
    \ World!</title></head>\n<body>\n<script type=\"text/javascript\">\n   document.write('Hello\
    \ World! - Document');\n   console.log('Hello World! - Console');\n</script>\n\
    </body>\n</html>\n```\n\n2. Press F12 key. I see the developer panel displayed\
    \ on the screen.\n3. Click \"Console\" tab on the developer panel. I see the console\
    \ log message displayed: \"Hello World! - Console\".\n4. Enter some JavaScript\
    \ statements in the console to run:\n\n```\n Hello World! - Console\n> var msg\
    \ = document.title;\n< undefined\n> console.log(msg.length);\n  12\n< undefined\n\
    > \n```\n\nCool. The console is nice tool to troubleshoot any issues with my JavaScript\
    \ code in HTML pages running on Google Chrome.\n\n![](Images/image00135.jpeg)\n\
    \nJavaScript Console in Google Chrome\n"
