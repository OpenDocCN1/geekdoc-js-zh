    \   this.author = author;\n   this.getDesc = getDescription;\n}\n\nfunction getDescription()\
    \ {\n   return \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   var myPrototype\
    \ = new Object();\n   Book.prototype = myPrototype;\n   Book.prototype.price =\
    \ 9.99;\n   Book.prototype.constructor = Book;\n   Book.prototype.toString = getString;\n\
    \nfunction getString() {\n   return this.author+\"/\"+this.title+\"/\"+this.price;\n\
    }\n</script>\n<script type=\"text/javascript\">\n// Defining the second level\
    \ constructor \"EBook\"\n\nfunction EBook(url) {\n   this.url = url;\n}\n\n  \
    \ var myBook = new Book(\"Programming Tutorials\", \"Herong Yang\");\n   EBook.prototype\
    \ = myBook;\n   Book.prototype.constructor = EBook;\n\n// Creating an object of\
    \ \"EBook\"\n   var myEBook = new EBook(\"www.herongyang.com\");\n\n// Adding\
    \ a local property \n   myEBook.title = \"JavaScript Tutorials\";\n\n   // Showing\
    \ properties of this object\n   showObject(myEBook, \"myEBook\");\n\nfunction\
    \ showObject(object, name) {\n   document.writeln(\"\\n\\\"\"+name+\"\\\" properties:\"\
    );\n   for (var item in object) {\n      if (object.hasOwnProperty(item)) \n \
    \        var inheritance = \"Local\";\n      else \n         var inheritance =\
    \ \"Inherited\";\n      document.writeln(\"   \"+item+\": \"+inheritance+\": \"\
    \n         +object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\
    \nThe output of this tutorial example confirms that object \"myEBook\" inherits\
    \ from \"EBook.prototype\", \"Book.prototype\", and \"Object.prototype\". Notice\
    \ \"myEBook\" has a local property \"title\" overrides the inherited property\
    \ \"EBook.prototype.title\":\n\n```\n \"myEBook\" properties:\n   url: Local:\
    \ www.herongyang.com\n   title: Local: JavaScript Tutorials\n   author: Inherited:\
    \ Herong Yang\n   getDesc: Inherited: function getDescription() {\n    return\
    \ \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\n   price: Inherited:\
    \ 9.99\n   constructor: Inherited: function EBook(url) {\n    this.url = url;\n\
    }\n   toString: Inherited: function getString() {\n    return this.author + \"\
    /\" + this.title + \"/\" + this.price;\n}\n   copyright: Inherited: herongyang.com\n\
    ```\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n\
    ∟[Inheritance of Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n∟Prototype Object Chain Summary\n\nThis section provides a quick summary of\
    \ object property and method inheritance through the prototype object chain.\n\
    \nHere is a summary of how object, constructor, and prototype are related to each\
    \ other.\n\n*   JavaScript supports objects without class.\n\n*   An object is\
    \ created from a constructor function, which is also an object.\n\n*   A property\
    \ can be added to an object through the constructor during the object creation\
    \ process.\n\n*   A property can be added to an object after it has been created.\n\
    \n*   A constructor contains a property called \"prototype\", which points to\
    \ an object serving as the prototype to the constructor.\n\n*   An object inherits\
    \ all properties of its constructor's prototype.\n\n*   The inheritance process\
    \ is recursive process, which allows an object to inherit from multiple levels\
    \ of prototypes of its constructor prototype chain.\n\n*   The prototype of the\
    \ constructor \"Object\" is base prototype of any prototype chain.\n\n*   Methods\
    \ follow same inheritance rules as properties. Actually, methods are properties\
    \ with function definitions as their values.\n\n*   The base prototype has several\
    \ built-in default properties and methods.\n\nHere is my diagram representing\
    \ relations of object, constructor, and prototype. It also shows how object properties\
    \ and methods are inherited from its parent prototypes:\n\n![](Images/image00149.jpeg)\n\
    \nMulti-Level Prototype Inheritance\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟'jrunscript' - JavaScript Shell Command from\
    \ JDK"
