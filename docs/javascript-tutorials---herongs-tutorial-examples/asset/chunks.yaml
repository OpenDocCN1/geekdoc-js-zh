  trans: "\n\n```\n 新年快乐！\n\n打开日志文件。\n写入日志消息。\n关闭日志文件。\n\n显示视图按钮。\n\n图书馆的开放时间为上午 9:00\
    \ 到下午 9:00。\n```\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 流程控制语句\n\n### \"switch\
    \ ... case\" 语句\n\n本节提供了 `switch ... case` 语句的简要描述。\n\n`\"switch case\"` 语句根据某些条件选择性执行语句的另一种方式。`switch\
    \ case` 语句具有以下通用语法格式：\n\n```\n switch (test_expression) {\n   case expected_value_1:\n\
    \      statement_11;\n      statement_12;\n      ...\n      [break;]\n   case\
    \ expected_value_2:\n      statement_21;\n      statement_22;\n      ...\n   \
    \   [break;]\n   ...\n      ...\n   default:\n      statement_x1;\n      statement_x2;\n\
    \      ...\n      [break;]\n}\n```\n\n其中 `\"test_expression\"` 用于生成一个测试值，该值将与\
    \ `\"case\"` 子句中指定的预期值进行比较。`switch case` 语句的执行过程如下：\n\n*   `\"case\"` 子句是可能的执行起始点。每个\
    \ `\"case\"` 子句将从上到下顺序依次访问。\n*   如果某个 `\"case\"` 子句的预期值等于 switch 表达式产生的测试值，则执行从该\
    \ `\"case\"` 子句中列出的语句开始。\n*   一旦开始执行，它将继续执行，直到遇到 `break` 语句或到达 `switch` 块的结束。\n\
    *   `\"default\"` 子句是可选的。但如果提供了它，当 `\"default\"` 子句之前的所有 case 测试都失败时，它将成为执行的起始点。\n\
    \n与许多其他编程语言不同，JavaScript 支持将数值表达式和字符串表达式作为 switch 测试表达式。\n\n下一节将提供一个教程示例，展示 `switch\
    \ ... case` 语句的示例。\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 流程控制语句\n\n### \"switch\
    \ ... case\" 语句示例\n\n本节提供了一个 JavaScript 教程示例，展示如何编写 `switch ... case` 语句。\n\n\
    为了帮助你理解 `switch ... case` 语句的工作原理，我编写了以下 JavaScript 教程示例 `Switch_Case_Statements.html`：\n\
    \n```\n <html>\n<!-- Switch_Case_Statements.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Switch Case Statements</title></head>\n\
    <body\n<pre>\n<script type=\"text/javascript\">\n\n// 使用数值表达式的 switch 语句\n   var\
    \ week_day = 4;\n   var day, open_hours;\n   switch (week_day) {\n\n      case\
    \ 0:\n         day = \"Sunday\";\n         open_hours = \"closed\";\n        \
    \ break;\n\n      case 1:\n      case 2:\n      case 3:\n      case 4:\n     \
    \ case 5:\n         day = \"a weekday\";\n         open_hours = \"open from 9:00am\
    \ to 9:00pm\";\n         break;\n\n      case 6:\n         day = \"unknown\";\n\
    \         open_hours = \"open from 9:00am to 5:00pm\";\n         break;\n\n  \
    \    default:\n         day = \"unknown\"\n         open_hours = \"undefined\"\
    ;\n   }\n   document.write('\\n');\n   document.write(\"Today is \" + day + \"\
    .\\n\");\n   document.write(\"The library is \" + open_hours + \".\\n\");\n</script>\n\
    </pre>\n</</body>\n</html>\n```\n\n该 JavaScript 示例的输出是：\n\n```\n Today is a weekday.\n\
    The library is open from 9:00am to 9:00pm.\n```\n\n# JavaScript 教程 - Herong 的教程示例\n\
    \n## 流程控制语句\n\n### \"for\" 循环语句\n\n本节提供了 `for` 循环语句的简要描述。\n\n`for` 语句是许多编程语言中非常常见的循环语句。JavaScript\
    \ 的 `for` 语句具有以下通用语法格式：\n\n```\n for ([initial_exp]; [loop_condition]; [increment_exp])\n\
    \   statement or statement_block\n```\n\n如果你想确切知道 `for` 语句将如何执行，这里是我的理解：\n\n*\
    \   步骤 1：评估 `\"intial_exp\"`（通常是一个赋值表达式）。\n*   步骤 2：评估 `\"loop_condition\"`（一个布尔表达式）。\n\
    *   步骤 3：如果 `\"loop_condition\"` 评估结果为 `\"true\"`，则继续第 5 步。\n*   步骤 4：如果 `\"loop_condition\"\
    ` 评估结果为 `\"false\"`，则终止循环。\n*   步骤 5：执行 `statement` 或 `statement_block`。\n*  \
    \ 步骤 6：评估 `\"increment_exp\"`（通常是一个赋值表达式）。\n*   步骤 7：继续第 2 步。\n\n如果 `\"loop_condition\"\
    ` 始终评估为 `\"true\"`，`for` 循环语句可能会无限执行。\n\n可以在循环语句块中使用 `break` 语句来提前终止循环。\n\n可以在循环语句块中使用\
    \ `continue` 语句来跳过块的剩余部分并开始循环的下一次迭代。\n\n下一节将提供一个教程示例，展示 `for` 循环语句的示例。\n\n# JavaScript\
    \ 教程 - Herong 的教程示例\n\n## 流程控制语句\n\n### \"for\" 循环语句示例\n\n本节提供了一个 JavaScript 教程示例，展示如何编写\
    \ `for` 循环语句。\n\n为了帮助你理解 `for` 循环语句的工作原理，我编写了以下 `Switch_Case_Statements.html`：\n\
    \n```\n <html>\n<!-- Switch_Case_Statements.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Switch Case Statements</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   var i, j, is_prime;\n   for\
    \ ( i=3; i<=30; i+=2 ) {\n      is_prime = true;\n      for ( j=2; j<=i/2; j++)\
    \ {\n         if (i%j == 0) {\n            is_prime = false;\n            break;\n\
    \         }\n      }\n      if (is_prime) {\n         document.write(\"Found prime\
    \ number: \" + i + \".\\n\");\n      }\n   }\n</script>\n</pre>\n</body>\n</html\n\
    ```\n\n注意：\n\n*   此 JavaScript 使用嵌套的 `for` 循环来计算质数。\n*   外层 `for` 循环使用变量 `i` 控制执行。\n\
    *   内层 `for` 循环使用变量 `j` 控制执行。\n*   外层 `for` 循环的停止条件是 `i<=30`。每次迭代中 `i` 的值增加 2。\n\
    *   内层 `for` 循环的停止条件是 `j<=i/2`。每次迭代中 `j` 的值增加 1。\n*   内层 `for` 循环有一个 `break` 语句，当\
    \ `is_prime` 为 false 时将跳出循环。\n\n该 JavaScript 示例的输出是：\n\n```\n Found prime number:\
    \ 3.\nFound prime number: 5.\nFound prime number: 7.\nFound prime number: 11.\n\
    Found prime number: 13.\nFound prime number: 17.\nFound prime number: 19.\nFound\
    \ prime number: 23.\nFound prime number: 29.\n```\n\n# JavaScript 教程 - Herong\
    \ 的教程示例\n\n## 流程控制语句\n\n### \"while\" 循环语句\n\n本节提供了 `while` 循环语句的简要描述。\n\n`while`\
    \ 语句是许多编程语言中非常常见的循环语句。JavaScript 的 `while` 语句具有以下通用语法格式：\n\n```\n while (loop_condition)\n\
    \   statement or statement_block\n```\n\n`while` 语句的执行如下：\n\n*   步骤 1：评估 `\"loop_condition\"\
    ` 表达式为布尔值。\n*   步骤 2：如果 `\"loop_condition\"` 评估为 `\"true\"`，则继续第 4 步。\n*   步骤\
    \ 3：如果 `\"loop_condition\"` 评估结果为 `\"false\"`，则终止循环。\n*   步骤 4：执行 `statement`\
    \ 或 `statement_block`。\n*   步骤 5：继续第 1 步。\n\n另一种形式的 `while` 循环称为 `do ... while`\
    \ 循环语句，具有以下语法格式：\n\n```\n do\n   statement or statement_block\nwhile (loop_condition);\n\
    ```\n\n如果 `\"loop_condition\"` 始终评估为 `\"true\"`，`while` 循环语句可能会无限执行。\n\n可以在循环语句块中使用\
    \ `break` 语句来提前终止循环。\n\n可以在循环语句块中使用 `continue` 语句来跳过块的剩余部分并开始循环的下一次迭代。\n\n下一节将提供一个教程示例，展示\
    \ `while` 循环语句的示例。\n\n"
- fmt: "\n# JavaScript Tutorials - Herong's Tutorial Examples(#part0001.xhtml)\n\n\
    ## [Flow Control Statements](#part0019.xhtml)\n\n### \"while\" Loop Statement\
    \ Example\n\nThis section provides a JavaScript tutorial example showing how to\
    \ write a `while` loop statement.\n\nTo help you understand how `while` loop statements\
    \ work, I wrote the following the JavaScript tutorial example, `For_Loop_Statements.html`:\n\
    \n```html\n <>\n<!-- While_Loop_Statements.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>While Loop Statements</title></head>\n\
    <body\n<pre>\n<script type=\"text/javascript\">\n   var i, j, is_prime;\n   i\
    \ = 3;\n   while ( i<=30 ) {\n      is_prime = true;\n      j = 2;\n      while\
    \ ( j<=i/2 ) {\n         is_prime = i%j > 0;\n         if (!is_prime) break;\n\
    \         j++;\n      }\n      if (is_prime)\n         document.write(\"Found\
    \ a prime number: \" + i + \".\\n\");\n      i += 2;\n   }\n</script>\n</pre>\n\
    </body>\n</>\n```\n\nThis JavaScript uses a nested `while` loop statements to\
    \ calculate prime numbers. It has the same execution logic as the `While_Loop_Statements.html`\
    \ JavaScript.\n\nThe output of this sample JavaScript is:\n\n```\n Found a prime\
    \ number: 3.\nFound a prime number: 5.\nFound a prime number: 7.\nFound a prime\
    \ number: 11.\nFound a prime number: 13.\nFound a prime number: 17.\nFound a prime\
    \ number: 19.\nFound a prime number: 23.\nFound a prime number: 29.\n```\n\n#\
    \ JavaScript Tutorials - Herong's Tutorial Examples(#part0001.xhtml)\n\n## Creating,\
    \ Accessing, and Manipulating Arrays\n\nThis chapter provides a quick introduction\
    \ of creating and manipulating arrays. Topics include what is an array; creating\
    \ an array; accessing array elements; expanding and truncating arrays; calling\
    \ array object methods.\n\n- [What Is an Array](#part0030.xhtml)\n- [Creating\
    \ an Array Object](#part0031.xhtml)\n- [Accessing Array Elements with Indexes](#part0032.xhtml)\n\
    - [Truncating and Iterating Array Elements](#part0033.xhtml)\n- [Array Object\
    \ Instance Methods](#part0034.xhtml)\n- [Array Object Instance Method Examples](#part0035.xhtml)\n\
    \nConclusion:\n\n- An array is an object, not a primitive data type.\n- Array's\
    \ elements do not have to be the same data type.\n- An array can be created using\
    \ an array literal: `[a, b, ..., x]`.\n- An array can be created using the `Array`\
    \ constructor: `New Array()`.\n- An array can be created using the built-in function:\
    \ `Array()`.\n- Array's elements can be accessed using an index: `users[i]`.\n\
    - An array has many object methods like `users.sort()`, `users.push(\"Herong\"\
    )`, etc.\n\n# JavaScript Tutorials - Herong's Tutorial Examples(#part0001.xhtml)\n\
    \n## [Creating, Accessing, and Manipulating Arrays](#part0029.xhtml)\n\n### What\
    \ Is an Array\n\nThis section provides a quick description of what is an array\
    \ in JavaScript and a tutorial example showing JavaScript array features.\n\n\
    Like many programming languages, JavaScript support arrays allowing you to store\
    \ and retrieve a list of elements.\n\nBut unlike many other languages, JavaScript\
    \ does not have an explicit array data type. Instead, it provides an `Array` object\
    \ type to let you create arrays as objects. Here are the main features of an array\
    \ in JavaScript:\n\n- An array is not a primitive data type.\n- An array is an\
    \ object.\n- Array elements are indexed. Elements can be stored and retrieved\
    \ by indexes.\n- Array's index starts from 0. In other words, index 0 represents\
    \ the first element.\n- The size of an array is not statically defined. It can\
    \ be dynamically expanded or truncated.\n- Array's elements do not have to be\
    \ the same data type.\n- Several methods are provided on array objects allowing\
    \ you to manipulate arrays directly.\n\nHere is a tutorial example JavaScript\
    \ that shows you some of the features mentioned above:\n\n```html\n <>\n<!-- Array_Features.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Array\
    \ Features</title></head>\n<body\n<pre>\n<script type=\"text/javascript\">\n\n\
    \   // Creating a new array of mixed data types\n   var account = [\"Saving\"\
    , 999.99, true];\n\n   // Store new value to the array\n   account[2] = false;\n\
    \n   // Retrieving an element\n   document.write(\"Account type: \"+account[0]+\"\
    \\n\");\n\n   // Calling an array method\n   account.push(5.25/100);\n   document.write(\"\
    Interest rate: \"+account[3]*100+\"%\\n\");\n</script>\n</pre>\n</body>\n</>\n\
    ```\n\nThe output of this sample JavaScript is:\n\n```\n Account type: Saving\n\
    Interest rate: 5.25%\n```\n\n# JavaScript Tutorials - Herong's Tutorial Examples(#part0001.xhtml)\n\
    \n## [Creating, Accessing, and Manipulating Arrays](#part0029.xhtml)\n\n### Creating\
    \ an Array Object\n\nThis section provides a tutorial example on how to create\
    \ array objects.\n\nThere are 3 ways to create a new array:\n\n1. Using an array\
    \ literal: `[a, b, ..., x]`.\n2. Using the `Array` constructor: `new Array()`.\n\
    3. Using the `Array` function: `Array()`.\n\nHere is a tutorial example JavaScript\
    \ that shows you how to create array objects:\n\n```html\n <>\n<!-- Create_Arrays.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Create\
    \ Arrays</title></head>\n<body\n<pre>\n<script type=\"text/javascript\">\n\n \
    \  // Using array literal\n   var my_saving = [\"Saving\", 999.99, true];\n\n\
    \   // Using array constructor\n   var my_checking = new Array(\"Checking\", 9.99);\n\
    \n   // Using array function\n   var my_stock = Array(\"Stock\", 99999.99);\n\n\
    \   // Creating an empty array\n   var new_account = [];\n\n   document.write(my_checking[0]+\"\
    : \"+my_checking[1]+\"\\n\");\n   document.write(my_saving[0]+\": \"+my_saving[1]+\"\
    \\n\");\n   document.write(my_stock[0]+\": \"+my_stock[1]+\"\\n\");\n   document.write(new_account[0]+\"\
    : \"+new_account[1]+\"\\n\");\n</script>\n</pre>\n</body>\n</>\n```\n\nThe output\
    \ of this sample JavaScript is:\n\n```\n Checking: 9.99\nSaving: 999.99\nStock:\
    \ 99999.99\nundefined: undefined\n```\n\n# JavaScript Tutorials - Herong's Tutorial\
    \ Examples(#part0001.xhtml)\n\n## [Creating, Accessing, and Manipulating Arrays](#part0029.xhtml)\n\
    \n### Accessing Array Elements with Indexes\n\nThis section provides a tutorial\
    \ example on how to access array elements with element indexes.\n\nArray elements\
    \ can be access with array indexes with several simple rules:\n\n- Like many other\
    \ programming languages, an array element can be accessed with the array element\
    \ syntax of `array_name[index]`.\n- An array index starts with 0.\n- The length\
    \ of an array is defined as the highest index of all elements plus 1.\n- There\
    \ is no index-out-of-bound exception in JavaScript.\n- If an index greater than\
    \ the array length is specified when retrieving an array element, the `undefined`\
    \ value will be returned.\n- If an index greater than the array length is specified\
    \ when storing an array element, the array will be expanded to store the element\
    \ at the specified index.\n"
