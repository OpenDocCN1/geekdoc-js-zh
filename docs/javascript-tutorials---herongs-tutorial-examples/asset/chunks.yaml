    \ will be executed based on the value of the specified condition. If the specified\
    \ condition is \"true\", the first statement or statement block will be executed.\
    \ If the specified condition is \"false\", the second statement or statement block\
    \ will be executed.\n\n4\\. \"if ... else if\" Statement:\n\n```\n if (condition_1)\
    \ \n      statement or statement block\n   else if (condition_2)\n      statement\
    \ or statement block\n   ...\n      ...\n   else\n      statement or statement\
    \ block\n```\n\nMany statements or statement blocks are specified. But only one\
    \ of them will be executed based on the value of the condition specified for that\
