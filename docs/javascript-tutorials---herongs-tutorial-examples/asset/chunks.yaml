    , \"Blue\");\n\n   // 检查此对象\n   println(\"\\nAbout this \\\"colors\\\":\");\n\
    \   println(\"   Type = \"+(typeof colors));\n   println(\"   Instance Of Object:\
    \ \"+(colors instanceof Object));\n   println(\"   Instance Of Array: \"+(colors\
    \ instanceof Array));\n\n   println(\"\\nList of array properties:\");\n   for\
    \ (item in colors) {\n      println(\"   \"+item+\" = \"+colors[item]);\n   }\n\
