  trans: "\n\n*   点击“关闭窗口”（Close Window）按钮，新的浏览器窗口将被关闭。\n\n关于 `window` 对象的更多教程示例，请参阅本书中的\
    \ DOM API 章节。\n\nJavaScript 教程 - 荷教程示例\n\n### ∟支持 JavaScript 的 Web 浏览器\n\n####\
    \ #### 事件监听器与对象\n\n本节快速描述了不同 HTML 标签上的事件触发属性，以及代表事件并包含事件详细信息的 `event` 对象。提供了一个教程示例，通过在鼠标按下事件上添加监听器来显示鼠标位置。\n\
    \n典型的 Web 浏览器还支持特殊的 HTML 属性，允许您添加事件监听器并传递事件对象。以下是各种 HTML 标签上常用的 HTML 属性：\n\n*\
    \   `<body onLoad=\"listener_code\" ...>` - 当浏览器开始加载 HTML 文档并触发 `onLoad` 事件时，将执行指定的监听器代码。\n\
    *   `<body onMouseDown=\"listener_code\" ...>` - 当用户在浏览器窗口的任何位置按下鼠标按钮触发 `onMouseDown`\
    \ 事件时，将执行指定的监听器代码。\n*   `<a onMouseOver=\"listener_code\" ...>` - 当用户将鼠标移动过此超链接触发\
    \ `onMouseOver` 事件时，将执行指定的监听器代码。\n*   `<input type=\"button\" onClick=\"listener_code\"\
    \ ...>` - 当用户点击此按钮触发 `onClick` 事件时，将执行指定的监听器代码。\n\n本书的其他章节将介绍更多事件触发属性。\n\n在每个事件触发属性中，浏览器都会提供一个名为\
    \ `event` 的对象，该对象表示此事件并包含有关此事件的详细信息。此 `event` 对象具有多种属性和方法供您使用。\n\n为了演示事件触发和 `event`\
    \ 对象的一些优秀特性，我编写了这个 JavaScript 教程示例：\n\n```\n <html>\n<!-- Event_Object_and_Trigger.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Event\
    \ Object and Trigger</title>\n</head>\n<body onMouseDown=\n   \"window.alert('X:\
    \ '+event.clientX+', Y: '+event.clientY);\">\n<p>点击页面任意位置查看位置坐标。</p>\n</body>\n\
    </</html>>\n```\n\n在此教程示例中，`body` 标签上的 `onMouseDown` 事件触发属性被用于添加一段短的监听器代码，当用户在页面上按下鼠标时执行。监听器代码使用浏览器提供的\
    \ `event` 对象来获取位置的 x 和 y 坐标。\n\n通过调用 `window` 对象上的 `alert()` 方法，通过警报框向用户报告坐标。见下图：\n\
    \n![](img/image00134.jpeg)\n\n窗口警报框\n\nJavaScript 教程 - 荷教程示例\n\n### ∟支持 JavaScript\
    \ 的 Web 浏览器\n\n#### #### ####'javascript:' 伪 URL 地址\n\n本节描述了什么是 `javascript:`\
    \ 伪 URL 地址，并提供了若干几个有趣的 `javascript:` URL 示例。\n\n许多 Web 浏览器还支持形式如下的 `javascript:`\
    \ 伪 URL 地址：\n\n```\n javascript:statement;statement;...\n```\n\n当给浏览器提供 `javascript:`\
    \ 伪 URL 时，它将开始评估 URL 中包含的 JavaScript 语句。以下是一些您可以尝试的 `javascript:` 伪 URL 地址示例：\n\
    \n1. 下列 URL 将导致浏览器在小型对话框中显示文本消息。\n\n```\n javascript:alert(\"Hello World!\");\n\
    ```\n\n2. 下列 URL 将导致浏览器显示一个带有文本消息的新页面。\n\n```\n javascript:document.write(\"<html><body>Hello\
    \ World!</body></html>\");\n```\n\n3. 下列 URL 将导致浏览器执行复杂的 JavaScript 代码，从而生成一个包含质数的\
    \ HTML 页面。注意，整个 URL 地址必须写在单行中。因此，您需要合并以下行，将其复制并粘贴到浏览器。\n\n```\n javascript:var\
    \ i, j, is_prime; document.write('<body><pre>'); \n   for ( i=3; i<=30; i+=2 )\
    \ { is_prime = true; for ( j=2; j<=i/2; j++)\n   { is_prime = i%j > 0; if (!is_prime)\
    \ break;} \n   if (is_prime) document.writeln('Found a prime number: ' + i); }\
    \ \n   document.write('</pre></body>');\n```\n\n现在轮到你编写更多 `javascript:` URL 示例了。\n\
    \nJavaScript 教程 - 荷教程示例\n\n### ∟支持 JavaScript 的 Web 浏览器\n\n#### #### #### Google\
    \ Chrome 中的 JavaScript 控制台\n\n本节提供了教程示例，介绍如何使用 Google Chrome 中的 JavaScript 控制台来查看\
    \ JavaScript 执行结果执行错误和日志消息。你也可以用它运行任何 JavaScript 语句来与 HTML 文档进行交互。\n\n**什么是 Google\
    \ Chrome 中的 JavaScript 控制台？** Google Chrome 中的 JavaScript 控制台是浏览器为您提供的一个控制台，用于：\n\
    \n*   查看浏览器在执行嵌入 JavaScript 代码时生成的任何错误或日志消息。\n*   运行任何 JavaScript 代码以交互方式与 Web\
    \ 文档交互。\n\n以下是我测试 Google Chrome 中 JavaScript 控制台的操作步骤：\n\n1. 运行 Google Chrome\
    \ 并加载以下 HTML 代码：\n\n```\n <html>\n<head><title>Hello World!</title></head>\n<body>\n\
    <script type=\"text/javascript\">\n   document.write('Hello World! - Document');\n\
    \   console.log('Hello World! - Console');\n</script>\n</body>\n</</html>\n```\n\
    \n2. 按下 F12 键。我看到屏幕上显示了开发者面板。\n3. 点击开发者面板上的“Console”选项卡。我看到控制台日志消息显示：“Hello World!\
    \ - Console”。\n4. 在控制台中输入一些 JavaScript 语句并运行：\n\n```\n Hello World! - Console\n\
    > var msg = document.title;\n< undefined\n> console.log(msg.length);\n  12\n<\
    \ undefined\n> \n```\n\n很酷。控制台是排查 Google Chrome 上运行的 HTML 页面中 JavaScript 代码问题的很好的工具。\n\
    \n![](img/image00135.jpeg)\n\nJavaScript 控制台\n\n"
- fmt: "\nThis section provides tutorial example on how to use the JavaScript Console\
    \ in Apple Safari to view execution errors and log messages resulted from JavaScript\
    \ execution. You can also use it to run any JavaScript statements to interact\
    \ with the HTML document.\n\n## What is JavaScript Console in Apple Safari?\n\n\
    JavaScript Console in Apple Safari is a console provided by the browser for you:\n\
    \n* To see any errors or log messages generated by the browser when executing\
    \ embedded JavaScript codes.\n* To run any JavaScript code to interact with the\
    \ Web document interactively.\n\nHere is what I did to test the JavaScript Console\
    \ in Apple Safari:\n\n1. Run Apple Safari and load the following HTML code:\n\n\
    ```html\n <html>\n<head><title>Hello World!</title></head>\n<body>\n<script type=\"\
    text/javascript\">\n   document.write('Hello World! - Document');\n   console.log('Hello\
    \ World! - Console');\n</script>\n</body>\n</html>\n```\n\n2. Press \"Option-Command-C\"\
    \ key combination (or select \"Develop > Show JavaScript Console\" menu). I see\
    \ \"Console\" tab on the developer panel displayed on the screen, with the log\
    \ message displayed: \"Hello World! - Console\".\n\n3. Enter some JavaScript statements\
    \ in the console to run:\n\n```\n Hello World! - Console\n>> var msg = document.title;\n\
    < undefined\n>> console.log(msg.length);\n  12\n< undefined\n> \n```\n\nCool.\
    \ The console is nice tool to troubleshoot any issues with my JavaScript code\
    \ in HTML pages running on Apple Safari.\n\n![](Images/image00137.jpeg)\n\nJavaScript\
    \ Console in Apple Safari\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Web Browser Supporting JavaScript](#part0048.xhtml)\n\n∟ JavaScript Console\
    \ in IE (Internet Explorer)\n\nThis section provides tutorial example on how to\
    \ use the JavaScript Console in IE (Internet Explorer) to view execution errors\
    \ and log messages resulted from JavaScript execution. You can also use it to\
    \ run any JavaScript statements to interact with the HTML document.\n\n## What\
    \ is JavaScript Console in IE (Internet Explorer)?\n\nJavaScript Console in IE\
    \ is a console provided by the browser for you:\n\n* To see any errors or log\
    \ messages generated by the browser when executing embedded JavaScript codes.\n\
    * To run any JavaScript code to interact with the Web document interactively.\n\
    \nHere is what I did to test the JavaScript Console in IE:\n\n1. Run IE and load\
    \ the following HTML code:\n\n```html\n <html>\n<head><title>Hello World!</title></head>\n\
    <body>\n<script type=\"text/javascript\">\n   document.write('Hello World! - Document');\n\
    \   console.log('Hello World! - Console');\n</script>\n</body>\n</html>\n```\n\
    \n2. Press F12 key. I see the developer window displayed on the screen.\n\n3.\
    \ Click \"Console\" tab on the developer window. I see the console log message\
    \ displayed: \"Hello World! - Console\".\n\n4. Enter some JavaScript statements\
    \ in the console to run:\n\n```\n >> var msg = document.title;\n< undefined\n\
    >> console.log(msg.length);\n  12\n< undefined\n> \n```\n\nCool. The console is\
    \ nice tool to troubleshoot any issues with my JavaScript code in HTML pages running\
    \ on IE.\n\n![](Images/image00138.jpeg)\n\nJavaScript Console in IE (Internet\
    \ Explorer)\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟Server-Side and Client-Side Web Scripting\n\nThis chapter provides introductions\
    \ and tutorial examples on server-side and client-side Web scripting. Topics include\
    \ Web scripting processing architecture overview; processing steps of server-side\
    \ and client-side scripting; event handling scripts; script code returns new script\
    \ code.\n\n> [Web Scripting Architecture Overview](#part0067.xhtml)\n> [Server-Side\
    \ Scripting Overview](#part0068.xhtml)\n> [Client-Side Scripts for Document Updating](#part0069.xhtml)\n\
    > [Client-Side Scripts for Event Handling](#part0070.xhtml)\n> [Client-Side Scripting\
    \ Processed Multiple Times](#part0071.xhtml)\n> [New Script Resulted from Two\
    \ Original Scripts](#part0072.xhtml)\n\nConclusion:\n\n* Web applications can\
    \ use scripts in 3 areas: Server-Side Scripting, Client-Side Scripting for Page\
    \ Document Building and Client-Side Scripting for Browser Event Handling.\n* When\
    \ using JavaScript in the page document building process, the browser will scan\
    \ and execute script multiple rounds.\n\n[JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[Server-Side and Client-Side Web Scripting](#part0066.xhtml)\n\
    \n## Web Scripting Architecture Overview\n\nThis section provides an overview\
    \ of a typical Web scripting processing flow architecture showing server-side\
    \ and client-side scripting steps.\n\nAs we can see from previous chapters, JavaScript\
    \ code can be used in three areas to help building Web sites or Web based applications:\n\
    \n* Server-Side Scripting - Scripts embedded in HTML documents to be processed\
    \ by the Web server before sending to the client - Web browser. Server-side scripting\
    \ usually used to interact with database or other backend applications and to\
    \ bring dynamic data into HTML documents.\n* Client-Side Scripting for Page Document\
    \ Building - Scripts embedded in HTML documents to be processed by the Web browser\
    \ before rendering the page document on the browser window.\n* Client-Side Scripting\
    \ for Browser Event Handling - Scripts embedded in HTML documents to be processed\
    \ by the Web browser when user interacts with the Web browser window.\n\nThe diagram\
    \ below shows you how server-side scripting and client-side scripting can be used\
    \ together performing different functions in a typical Web application process\
    \ flow architecture:\n\n![](Images/image00139.jpeg)\n\nWeb Scripting Flow Architecture\n\
    \nRed lines used in this diagram indicate where JavaScript could be used. Different\
    \ sections of this Web scripting flow architecture diagram will be explained later.\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Server-Side\
    \ and Client-Side Web Scripting](#part0066.xhtml)\n\n## Server-Side Scripting\
    \ Overview\n\nThis section provides an overview of the Web server-side scripting\
    \ process flow. The Web server removes the script code and executes it.\n\nServer-side\
    \ scripting happens in step 4 as shown in the diagram below:\n\n![](Images/image00140.jpeg)\n\
    \nServer-Side Scripting Flow\n\nStep 1: The user enters a new Web page address\
    \ or clicks a link that requires a new Web page from the Web server.\nStep 2:\
    \ The Web browser connects the Web server and sends a `HTTP GET` command with\
    \ the path name of the requested Web page.\nStep 3: The Web server fetches the\
    \ HTML document of the requested page or asks an application server to generate\
    \ the HTML document.\nStep 4: The Server-side scripting step: The Web server scans\
    \ the HTML document for any server-side script code embedded in the document.\
    \ The Web server will remove the embedded script code and execute it.\n\nWhen\
    \ the Web server executes the embedded script code, it will provide many host\
    \ objects representing the server host environment. Through those host objects,\
    \ server-side script code can easily access the carrying HTML document, the server\
    \ filesystem, any databases, and networked computers.\n\nUsually, server-side\
    \ script code will update the carrying HTML document with dynamic data resulted\
    \ from its computations.\n\nAt the end of the server-side script process step,\
    \ the updated HTML document is ready to be sent back the client - the Web browser.\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Server-Side\
    \ and Client-Side Web Scripting](#part0066.xhtml)\n\n## Client-Side Scripts for\
    \ Document Updating\n\nThis section provides an overview of client-side scripting.\
    \ Some scripts are executed to update the page document final rendering. Some\
    \ scripts are registered as event handler to be executed later.\n\nServer-side\
    \ scripting for page document updating happens in step 6 and 7a as shown in the\
    \ diagram below:\n\n![](Images/image00141.jpeg)\n\nClient-Side Scripts for Document\
    \ Updating\n\nStep 5: The Web server sends the final HTML document to the Web\
    \ browser.\n"
