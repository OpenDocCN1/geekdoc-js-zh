    \ false\n   Instance of Function: false\n   Instance of Book: false\n```\n\n##\
    \ Several interesting notes on the output\n\n- `\"myBook\"` is an object created\
    \ with `Book()`. So it is an instance of `\"Book\"`.\n- But `\"myBook\"` is also\
    \ an instance of `\"Object\"`, because `\"Book\"` is a subtype of `\"Object\"\
    `. All used defined object types, by default, are subtypes of the base `\"Object\"\
    ` object type.\n- `\"Book\"` is a function. So it is an instance of `\"Function\"\
    `.\n- But `\"Book\"` is also an instance of `\"Object\"`, because `\"Function\"\
    ` is a subtype of `\"Object\"`.\n- `\"Book.prototype\"` is an instance of the\
    \ base object type: `\"Object\"`.\n- `\"Object\"` is a function. So it is an instance\
    \ of both object types: `\"Function\"` and `\"Object\"`.\n- However `\"Object.prototype\"\
    ` is an object. So it should be an instance of `\"Object\"`. But the output says\
    \ no. May JavaScript has assigned `\"Object.prototype\"` with an internal object\
    \ type.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### [Defining Your Own Object Types](#part0084.xhtml)\n\n#### \"typeof\" Operator\
    \ and Data Types\n\nThis section provides a quick description of the `typeof`\
    \ operator and data types supported in JavaScript. A tutorial example is provided\
    \ to list all data types number, string, boolean, object, function, and undefined.\n\
    \nIn the previous section, we learned how to use the `instanceof` operator. But\
    \ JavaScript offers another operator called `typeof`, which works like `instanceof`.\
    \ Here is a comparison of them:\n\n1. `object_name instanceof constructor_name`\
    \ returns true if the specified object is an instance of the specified type.\n\
    2. `typeof expression` returns the data type name of the specified expression.\
    \ Remember that JavaScript supports several data types: `\"number\"`, `\"string\"\
    `, `\"boolean\"`, `\"object\"`, `\"function\"`, and `\"undefined\"`.\n\nTo show\
    \ you those data types and how to use `typeof`, I wrote this tutorial example:\n\
    \n```html\n <html>\n<!-- Prototype_typeof_Operator.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>\"typeof\" Operator</title>\n</head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   // Creating an object of\
    \ \"Book\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\"\
    );\n\n   // Show different data types\n   showDatatype(9, \"9\");\n   showDatatype(3.14,\
    \ \"3.14\");\n   showDatatype(\"Hello\", \"\\\"Hello\\\"\");\n   showDatatype(true,\
    \ \"true\");\n   showDatatype(undefined, \"undefined\");\n   showDatatype(null,\
    \ \"null\");\n   showDatatype(myBook, \"myBook\");\n   showDatatype(Book, \"Book\"\
    );\n\nfunction showDatatype(x, name) {\n   document.writeln(name+\": \"+(typeof\
    \ x));\n}\n\nfunction Book(title, author) {\n   this.title = title;\n   this.author\
    \ = author;\n}\n</script>\n</pre>\n</body>\n</</html>\n```\n\nHere is the output\
    \ of this tutorial example. Note that the data type of `\"null\"` is `\"object\"\
    `.\n\n```\n 9: number\n3.14: number\n\"Hello\": string\ntrue: boolean\nundefined:\
    \ undefined\nnull: object\nmyBook: object\nBook: function\n```\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n### ### Inheritance\
    \ of Properties and Methods through the Prototype Object Chain\n\nThis chapter\
    \ provides introductions and tutorial examples on object property and method inheritance.\
    \ Topics include inheriting properties and methods from constructor's prototype;\
    \ reviewing built-in default properties and methods; using the `constructor` property;\
    \ adding local and inherited properties; overriding inherited properties.\n\n\
    - [Inheriting from Constructor's Prototype Object](#part0094.xhtml)\n- [Changing\
    \ the Constructor's Prototype Object](#part0095.xhtml)\n- [Inheriting Properties\
    \ from Two Level Prototype Objects](#part0096.xhtml)\n- [Built-in Properties and\
    \ Methods in \"Object.prototype\"](#part0097.xhtml)\n- [Using \"hasOwnProperty()\"\
    \ Method to Test Inherited Properties](#part0098.xhtml)\n- [Setting the \"constructor\"\
    \ Property in the \"prototype\" Object](#part0099.xhtml)\n- [Adding Local Methods\
    \ at the Object Level](#part0100.xhtml)\n- [Adding Inherited Methods at the Prototype\
    \ Level](#part0101.xhtml)\n- [Building Multiple Levels of Prototype Objects](#part0102.xhtml)\n\
    - [Prototype Object Chain Summary](#part0103.xhtml)\n\n**Conclusion:**\n\n- When\
    \ defining a constructor function, you are actually defining a `\"prototype\"\
    ` object.\n- When creating a new object by calling the constructor function, you\
    \ are inheriting properties and methods from the prototype defined in the constructor.\n\
    - You can modify the prototype of a constructor at any time.\n- An object inherits\
    \ properties and methods from its prototype, and the parent prototype of the prototype,\
    \ and so on.\n- The root prototype has some built-in properties and methods: `constructor`,\
    \ `hasOwnProperty()`, `isPrototypeOf()`, `toString()` and `valueOf()`.\n- Properties\
    \ and methods can be added locally to individual object instances.\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n### ### Inheritance\
    \ of Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n#### #### Inheriting from Constructor's Prototype Object\n\nThis section provides\
    \ a quick description of how object inheriting properties and methods from its\
    \ constructor's prototype object. A tutorial example and diagram is provided to\
    \ show relations of an object, its constructor, and the constructor's prototype\
    \ object.\n\nFrom previous chapters in this book, we learned that:\n\n- A constructor\
    \ is a function. But it is also an object.\n- Each constructor has built-in default\
    \ property called `\"prototype\"`.\n- The constructor's `\"prototype\"` is an\
    \ object.\n- Properties and methods can be added to the constructor's prototype\
    \ object.\n- Each object will inherit properties and methods from its constructor's\
    \ prototype object.\n\nTo demonstrate those rules, I wrote the following tutorial\
    \ example to allow `\"myBook\"` to inherit the `\"price\"` property from the constructor's\
    \ prototype object:\n\n```html\n <html>\n<!-- Inheritance_from_Prototype.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Inheritance\
    \ from Prototype</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// Define the constructor: \"Book\"\nfunction Book(title, author) {\n   this.title\
    \ = title;\n   this.author = author;\n}\n\n   // Adding a property to the \"prototype\"\
    \n   Book.prototype.price = 9.99;\n\n   // Creating an object: \"myBook\"\n  \
    \ var myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n\n   // Showing\
    \ the object, constructor, and prototype\n   showObject(myBook, \"myBook\");\n\
    \   showObject(Book, \"Book\");\n   showObject(Book.prototype, \"Book.prototype\"\
    );\n\nfunction showObject(object, name) {\n   document.writeln(\"\\n\\\"\"+name+\"\
    \\\" properties:\");\n   for (var item in object) {\n      document.writeln(\"\
    \   \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</</html>\n\
    ```\n\nThe output of this tutorial example confirms what we learned earlier:\n\
    \n```\n \"myBook\" properties:\n   title: JavaScript Tutorials\n   author: Herong\
    \ Yang\n   price: 9.99\n\n\"Book\" properties:\n   prototype: [object Object]\n\
    \n\"Book.prototype\" properties:\n   price: 9.99\n```\n\nThe output can also be\
    \ represented with this diagram:\n\n![](Images/image00143.jpeg)\n\nInheritance\
    \ from Prototype\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### ### Inheritance of Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n#### #### Changing the Constructor's Prototype Object\n"
