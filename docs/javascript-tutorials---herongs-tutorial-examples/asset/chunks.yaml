    \ the log file.\n\nDisplay the view button.\n\nThe library is open from 9:00am\
    \ to 9:00pm.\n```\n\n# [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n## [Flow Control Statements](#part0019.xhtml)\n\n### \"switch ... case\" Statements\n\
    \nThis section provides a quick description of the `switch ... case` statement.\n\
    \n`\"switch case\"` statements are alternative ways of executing statements selectively\
    \ based on certain conditions. A `switch case` statement has the following generic\
    \ syntax format:\n\n```\n switch (test_expression) {\n   case expected_value_1:\n\
    \      statement_11;\n      statement_12;\n      ...\n      [break;]\n   case\
    \ expected_value_2:\n      statement_21;\n      statement_22;\n      ...\n   \
    \   [break;]\n   ...\n      ...\n   default:\n      statement_x1;\n      statement_x2;\n\
    \      ...\n      [break;]\n}\n```\n\nwhere `\"test_expression\"` is used to generate\
    \ a test value that will be tested against with expected values specified in `\"\
    case\"` clauses. The execution of a `switch case` statement goes like this:\n\n\
    *   `\"case\"` clauses are possible execution starting points. Each `\"case\"\
    ` clause will be visited sequentially from top to bottom.\n*   If the expected\
    \ value of a `\"case\"` clause equals to the test value resulted from the switch\
    \ expression, the execution starts from those statements listed in this `\"case\"\
    ` clause.\n*   Once the execution started, it will continue until a `break` statement\
    \ is reached or the end of the `switch` block is reached.\n*   The `\"default\"\
    ` clause is optional. But if it is provided, it will become the execution starting\
    \ point when all case tests before the `\"default\"` clause are failed.\n\nUnlike\
    \ many other programming languages, JavaScript supports both numeric expression\
    \ and string expression as the switch test expression.\n\nA tutorial example will\
    \ be given in the next section showing examples of `switch ... case` statements.\n\
    \n# [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n##\
    \ [Flow Control Statements](#part0019.xhtml)\n\n### \"switch ... case\" Statement\
    \ Example\n\nThis section provides a JavaScript tutorial example showing how to\
    \ write a `switch ... case` statement.\n\nTo help you understand how `switch ...\
    \ case` statements work, I wrote the following the JavaScript tutorial example,\
    \ `Switch_Case_Statements.html`:\n\n```\n <html>\n<!-- Switch_Case_Statements.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Switch\
    \ Case Statements</title></head>\n<body\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// Switch statement with a numeric expression\n   var week_day = 4;\n   var\
    \ day, open_hours;\n   switch (week_day) {\n\n      case 0:\n         day = \"\
    Sunday\";\n         open_hours = \"closed\";\n         break;\n\n      case 1:\n\
    \      case 2:\n      case 3:\n      case 4:\n      case 5:\n         day = \"\
    a weekday\";\n         open_hours = \"open from 9:00am to 9:00pm\";\n        \
    \ break;\n\n      case 6:\n         day = \"unknown\";\n         open_hours =\
    \ \"open from 9:00am to 5:00pm\";\n         break;\n\n      default:\n       \
    \  day = \"unknown\"\n         open_hours = \"undefined\";\n   }\n   document.write('\\\
    n');\n   document.write(\"Today is \" + day + \".\\n\");\n   document.write(\"\
    The library is \" + open_hours + \".\\n\");\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nThe output of this sample JavaScript is:\n\n```\n Today is a weekday.\n\
    The library is open from 9:00am to 9:00pm.\n```\n\n# [JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n## [Flow Control Statements](#part0019.xhtml)\n\
    \n### \"for\" Loop Statements\n\nThis section provides a quick description of\
    \ the `for` loop statement.\n\nThe `for` statement is a very common loop statement\
    \ in many programming languages. The JavaScript `for` statement has the following\
    \ generic syntax format:\n\n```\n for ([initial_exp]; [loop_condition]; [increment_exp])\n\
    \   statement or statement_block\n```\n\nIf you want to know exactly how a `for`\
    \ statement will be executed, here is my understanding:\n\n*   Step 1: `\"intial_exp\"\
    `, usually an assignment expression, is evaluated.\n*   Step 2: `\"loop_condition\"\
    `, a Boolean expression, is evaluated.\n*   Step 3: If `\"loop_condition\"` is\
    \ evaluated to `\"true\"`, continue with Step 5.\n*   Step 4: If `\"loop_condition\"\
    ` is evaluated to `\"false\"`, terminate the loop.\n*   Step 5: Execute `statement`\
    \ or `statement_block`.\n*   Step 6: `\"increment_exp\"`, usually an assignment\
    \ expression, is evaluated.\n*   Step 7: Continue with Step 2.\n\n`for` loop statement\
    \ could be executed infinitely, if the `\"loop_condition\"` is always evaluated\
    \ to `\"true\"`.\n\nA `break` statement could be used inside the loop statement\
    \ block to terminate the loop early.\n\nA `continue` statement could be used inside\
    \ the loop statement block to skip the rest of the block and start the next iteration\
    \ of the loop.\n\nA tutorial example will be given in the next section showing\
    \ examples of `for` loop statements.\n\n# [JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n## [Flow Control Statements](#part0019.xhtml)\n\
    \n### \"for\" Loop Statement Example\n\nThis section provides a JavaScript tutorial\
    \ example showing how to write a `for` loop statement.\n\nTo help you understand\
    \ how `for` loop statements work, I wrote the following `Switch_Case_Statements.html`:\n\
    \n```\n <html>\n<!-- Switch_Case_Statements.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Switch Case Statements</title></head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n   var i, j, is_prime;\n   for\
    \ ( i=3; i<=30; i+=2 ) {\n      is_prime = true;\n      for ( j=2; j<=i/2; j++)\
    \ {\n         if (i%j == 0) {\n            is_prime = false;\n            break;\n\
    \         }\n      }\n      if (is_prime) {\n         document.write(\"Found prime\
    \ number: \" + i + \".\\n\");\n      }\n   }\n</script>\n</pre>\n</body>\n</html\n\
    ```\n\nNote that:\n\n*   This JavaScript uses nested `for` loop to calculate prime\
    \ numbers.\n*   The outer `for` loop uses variable `i` to control the execution.\n\
    *   The inner `for` loop uses variable `j` to control the execution.\n*   The\
    \ outer `for` loop's stop condition is `i<=30`. The value of `i` is increased\
    \ by 2 in each iteration.\n*   The inner `for` loop's stop condition is `j<=i/2`.\
    \ The value of `j` is increased by 1 in each iteration.\n*   The inner `for` loop\
    \ has a `break` statement will break the loop when `is_prime` is false.\n\nThe\
    \ output of this sample JavaScript is:\n\n```\n Found prime number: 3.\nFound\
    \ prime number: 5.\nFound prime number: 7.\nFound prime number: 11.\nFound prime\
    \ number: 13.\nFound prime number: 17.\nFound prime number: 19.\nFound prime number:\
    \ 23.\nFound prime number: 29.\n```\n\n# [JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n## [Flow Control Statements](#part0019.xhtml)\n\
    \n### \"while\" Loop Statements\n\nThis section provides a quick description of\
    \ the `while` loop statement.\n\nThe `while` statement is a very common loop statement\
    \ in many programming languages. The JavaScript `while` statement has the following\
    \ generic syntax format:\n\n```\n while (loop_condition)\n   statement or statement_block\n\
    ```\n\nA `while` statement is executed as follows:\n\n*   Step 1: `\"loop_condition\"\
    ` expression is evaluated as a Boolean value.\n*   Step 2: If `\"loop_condition\"\
    ` is evaluated to `\"true\"`, continue with Step 4.\n*   Step 3: If `\"loop_condition\"\
    ` is evaluated to `\"false\"`, terminate the loop.\n*   Step 4: Execute `statement`\
    \ or `statement_block`.\n*   Step 5: Continue with Step 1.\n\nThere is another\
    \ form of `while` loop, called `do ... while` loop statement, with the following\
    \ syntax format:\n\n```\n do\n   statement or statement_block\nwhile (loop_condition);\n\
    ```\n\n`while` loop statement could be executed infinitely, if the `\"loop_condition\"\
    ` is always evaluated to `\"true\"`.\n\nA `break` statement could be used inside\
    \ the loop statement block to terminate the loop early.\n\nA `continue` statement\
    \ could be used inside the loop statement block to skip the rest of the block\
    \ and start the next iteration of the loop.\n\nA tutorial example will be given\
    \ in the next section showing an example of the `while` loop statement.\n"
