    \n最新版本的 JavaScript 规范是 `ECMA-262 Edition 10`。因此，我们应该将其作为主要的参考来学习 JavaScript。\n\
    \nJavaScript 教程 - Herong 的教程示例\n\n∟ECMAScript 语言规范和 JavaScript 方言\n\n## ECMAScript\
    \ 语言规范\n\n本节快速介绍了 ECMAScript 语言规范及其版本历史。\n\nECMAScript 语言规范由 `ECMA`（欧洲计算机制造商协会）开发和维护。它定义了一种基于几种源自技术的脚本语言标准，其中最为人知的是\
    \ `JavaScript`（Netscape）和 `JScript`（Microsoft）。\n\n### ECMAScript 版本历史：\n\n```\n\
    \ 1997   ECMA-262 Edition 1 - 第一版\n1998   ECMA-262 Edition 2 - 仅编辑更改\n1999   ECMA-262\
    \ Edition 3 - 添加了许多新功能\n   ?   ECMA-262 Edition 4 - 废弃\n2009   ECMA-262 Edition\
    \ 5 - 添加了“严格模式”\n2011   ECMA-262 Edition 5.1 - 与 ISO/IEC 16262:2011 标准\n2018 \
    \  ECMA-262 Edition 9\n2019   ECMA-262 Edition 10\n```\n\nECMA 当前对 ECMAScript\
    \ 的定义：`ECMAScript` 是一种面向对象的编程语言，用于在主机环境中执行计算和操作计算对象。\n\n关于 ECMAScript 规范，一个非常重要的说明是，它没有提供任何与主机环境交互的设施。换句话说，仅用规范描述的规则和对象编写的纯\
    \ `ECMAScript` 代码只能在内存中进行计算和操作对象。它无法与主机环境交换数据。\n\n为了与主机环境交换数据，每种 ECMAScript 方言都必须扩展规范，以添加与主机环境交互的新设施。\n\
    \n例如，专为 `Firefox` 浏览器主机环境设计的 ECMAScript `JavaScript` 方言添加了 `\"document\"` 对象及其属性和方法，提供了对浏览器当前文档的访问。\n\
    \n另一个例子，为 Internet 信息服务器 (`IIS`) Web 服务器主机环境设计的 ECMAScript `JScript` 方言添加了 `\"\
    request\"` 对象及其属性和方法，提供了对服务器当前 HTTP 请求的访问。\n\n如果你想获取 `ECMA-262` (`ECMAScript 语言规范`）第\
    \ 9 版，请访问 [`www.ecma-international.org/publications/standards/Ecma-262.htm`](http://www.ecma-international.org/publications/standards/Ecma-262.htm)。\n\
    \nJavaScript 教程 - Herong 的教程示例\n\n∟ECMAScript 语言规范和 JavaScript 方言\n\n## ECMAScript\
    \ 语言规范 自动分号插入\n\n本节详细介绍了 JavaScript 自动分号插入的规则。\n\nECMAScript 自动分号插入规则允许在解析代码时自动添加分号，这使得开发者在编写代码时可以省略分号。\n\
    \n这种规则是基于 JavaScript 语法规则（ASI, Automatic Semicolon Insertion）的。解析器在扫描代码时，如果发现缺少分号，它会根据特定的规则尝试插入一个分号。\n\
    \n以下是自动分号插入的常见场景：\n\n```javascript\nfunction foo() {\n  return\n  {\n    a: 1\n\
    \  };\n}\n```\n\n在上面的例子中，`return` 后面会被插入一个分号，导致函数返回 `undefined`，而不是后面的对象。为了修复这个问题，应该写成：\n\
    \n```javascript\nfunction foo() {\n  return {\n    a: 1\n  };\n}\n```\n\n同样地，在\
    \ `if` 语句、`for` 循环或 `return` 语句中，如果紧跟大括号，可能会由于自动插入分号导致非预期的错误。\n\n例如：\n\n```javascript\n\
    var a = 1\nvar b =\na\n{\n  console.log(b)\n}\n```\n\n```javascript\nvar a = 1\n\
    var b = a\n{\n  console.log(b) // 输出 1\n}\n```\n\n在第二个例子中，`b = a` 后面没有插入分号，因此\
    \ `b` 被赋值为 `a`，而后面的 `{...}` 则被视为代码块。\n\n为了避免这些问题，建议在编写 JavaScript 代码时始终显式地使用分号。\n\
    \n"
- fmt: "\nJavaScript is a dynamic typing language. Data types are associated with\
    \ values, instead of variables. In other words, variables are declared without\
    \ specific data types. They can be assigned with values of any type.\n\nIn JavaScript\
    \ source code, values of different types can be provided as value literals as\
    \ described below.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n[Data Types, Variables and Expressions](#part0012.xhtml)\n\n### Numeric Literals\n\
    This section provides descriptions on numeric literals and a tutorial example\
    \ on how to use them in JavaScript code. To provide values of numbers in JavaScript\
    \ source code, you need to use numeric literals in 3 formats:\n\n#### Integer\
    \ Literal\nA sequence of digits following an optional sign character to represent\
    \ an integer value between `-9007199254740991` and `9007199254740991` inclusive.\
    \ For example: `2008`, `-12`.\n\n#### Hexadecimal Literal\nA sequence of hexadecimal\
    \ digits following `0x` or `0X` representing a positive integer or floating point\
    \ value. A hexadecimal literal may also have a sign character. For example: `0x07D8`,\
    \ `-0x0C`, `0xffffffffffffffff`.\n\n#### Floating Point Literal\nThe scientific\
    \ notation of a real number with the following syntax: `(sign)(digits).e(sign)(digits)`.\
    \ For example: `4.1`, `0.333333`, `-1.5e10`, `4.1e-29`.\n\nIn JavaScript, all\
    \ numbers, including integers, are stored in 64-bit floating point format as described\
    \ in IEEE754 standard. Here is a JavaScript tutorial example that shows how to\
    \ use different types of number literals in JavaScript code:\n\n```html\n<html>\n\
    <!-- Number_Literals.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head><title>Number Literals</title></head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n\tdocument.write(2020);\n\tdocument.write('\\n');\n\n\tdocument.write(0x07E4);\n\
    \tdocument.write('\\n');\n\n   document.write(-0x0C);\n   document.write('\\n');\n\
    \n   document.write(0xffffffffffffffff);\n   document.write('\\n');\n\n   document.write(-1.51e10);\n\
    \   document.write('\\n');\n\n   document.write(4.10e-29);\n   document.write('\\\
    n');\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output of this sample JavaScript\
    \ is:\n\n```\n2020\n2020\n-12\n1.208925819614292e+24\n-1510000000\n4.1e-29\n```\n\
    \n### String Literals\nThis section provides descriptions on string literals and\
    \ a tutorial example on how to use them in JavaScript code. To provide values\
    \ of strings in JavaScript source code, you need to use string value literals\
    \ following these rules:\n\n1. String literals are sequences of Unicode characters.\n\
    2. String literals must be enclosed in single quotes `'...'` or double quotes\
    \ `\"...\"`.\n3. Several characters must be preceded with the escaping character,\
    \ backslash (`\\`): `\\b`, `\\f`, `\\n`, `\\r`, `\\t`, `\\v`, `\\'`, `\\\"`, and\
    \ `\\\\`.\n4. Latin-1 characters can be presented as hexadecimal escape sequences.\
    \ For example, `\\xA9` represents the copyright symbol.\n5. Unicode characters\
    \ can be presented as Unicode escape sequences. For example, `\\u4E16` represents\
    \ a Chinese character.\n\nHere is a JavaScript tutorial example that shows how\
    \ to use string literals in JavaScript code:\n\n```html\n<html>\n<!-- String_Literals.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>String\
    \ Literals</title></head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\
    \   document.write(\"Hello World!\");\n   document.write('\\n');\n\n   document.write('Herong\\\
    's Tutorial');\n   document.write('\\n');\n\n   document.write(\"Double quote\
    \ \\\"\");\n   document.write('\\n');\n\n   document.write(\"Copyright \\xA9 2020.\"\
    );\n   document.write('\\n');\n\n   document.write(\"\\u4E16\\u754C\\u4F60\\u597D\\\
    uFF01\");\n   document.write('\\n');\n</script>\n</pre>\n</body>\n</html>\n```\n\
    \nThe output of this sample JavaScript is:\n\n```\nHello World!\nHerong's Tutorial\n\
    Double quote (\")\nCopyright © 2020.\n世界你好！\n```\n\n### Declaring Variables -\
    \ \"var\" Statements\nThis section provides descriptions on variables and a tutorial\
    \ example on how to declare variables with `var` statements.\n\n**What are variables?**\
    \ Variables are symbolic names that refer to values stored in the memory.\n\n\
    Variables are declared without specific data types. They can be assigned with\
    \ values of any type. In JavaScript source code, values of different types can\
    \ be provided as value literals as described in the previous sections. \n\nHere\
    \ is a JavaScript tutorial example that shows how to declare variables with `var`\
    \ statements:\n\n```html\n<html>\n<!-- Variables.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Variables</title></head>\n<body>\n<pre>\n\
    <script type=\"text/javascript\">\nvar url = 'herongyang.com';\nvar rank = 9;\n\
    var title = \"Herong's Tutorial Examples\";\nvar content = undefined;\n\ndocument.write(url);\n\
    document.write('\\n');\n\ndocument.write(title);\ndocument.write('\\n');\n\ndocument.write(rank);\n\
    document.write('\\n');\n\ndocument.write(content);\ndocument.write('\\n');\n</script>\n\
    </pre>\n</body>\n</html>\n```\n\nThe output of this sample JavaScript is:\n\n\
    ```\nherongyang.com\nHerong's Tutorial Examples\n9\nundefined\n```\n"
