    <body>\n<pre>\n<script type=\"text/javascript\">\n   var globalVar;\n   globalVar\
    \ = \"Cat\";\n   globalNoVar = \"Dog\";\n\n   scopeCheck();\n\n   document.write(\"\
    \\n\\nAfter function call:\");\n   document.write(\"\\n   globalVar = \" + globalVar);\n\
    \   document.write(\"\\n   globalNoVar = \" + globalNoVar);\n\nfunction scopeCheck()\
    \ {\n   globalVar = globalVar + \" - Updated\";\n   globalNoVar = globalNoVar\
    \ + \" - Updated\";\n\n   document.write(\"\\n\\nUpdated value in function:\"\
    );\n   document.write(\"\\n   globalVar = \" + globalVar);\n   document.write(\"\
    \\n   globalNoVar = \" + globalNoVar);\n}\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\n这个教程示例测试了两个全局变量：一个使用 `var` 语句声明，另一个没有。这两个变量的行为完全相同。它们在函数内部均有效且可访问。查看输出：\n\
    \n```\n Updated value in function:\n   globalVar = Cat - Updated\n   globalNoVar\
    \ = Dog - Updated\n\nAfter function call:\n   globalVar = Cat - Updated\n   globalNoVar\
    \ = Dog - Updated\n```\n\nJavaScript 教程 - Herong 的教程示例\n\n∟定义和调用函数\n\n# 局部变量 -\
    \ 示例\n\n本节提供了一个关于局部变量在函数内部外部行为的教程示例。\n\n为了查看局部变量在函数内部和外部的行为，我编写了以下教程示例：\n\n```html\n\
    \ <html\n<!-- Local_Variable_Scope.html\n   Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n-->\n<head><title>局部变量范围</title></head>\n<body>\n<pre>\n<script\
    \ type=\"text/javascript\">\n\n   scopeCheck();\n\n   document.write(\"\\n\\nAfter\
    \ function call:\");\n\n   // localVar 不是一个有效的变量\n   // document.write(\"\\n \
    \  localVar = \" + localVar);\n   document.write(\"\\n   localVar is not valid\"\
    );\n\n   // localNoVar 是一个有效的变量，由 scopeCheck() 自动声明\n   document.write(\"\\n \
    \  localNoVar = \" + localNoVar);\n\nfunction scopeCheck() {\n   var localVar;\n\
    \   localVar = \"Apple\";\n   localNoVar = \"Orange\";\n\n   localVar = localVar\
    \ + \" - Updated\";\n   localNoVar = localNoVar + \" - Updated\";\n\n   document.write(\"\
    \\n\\nUpdated value in function:\");\n   document.write(\"\\n   localVar = \"\
    \ + localVar);\n   document.write(\"\\n   localNoVar = \" + localNoVar);\n}\n\
    </script>\n</pre>\n</body>\n</html>\n```\n\n这个教程示例测试了两个“局部”变量：一个使用 `var` 语句声明，另一个没有。它们的行为不同。使用\
    \ `var` 语句声明的 `localVar` 是真正的局部变量。未使用 `var` 语句自动声明的 `localNoVar` 变成了全局变量。查看输出：\n\
    \n```\n Updated value in function:\n   localVar = Apple - Updated\n   localNoVar\
    \ = Orange - Updated\n\nAfter function call:\n   localVar is not valid\n   localNoVar\
    \ = Orange - Updated\n```\n\nJavaScript 教程 - Herong 的教程示例\n\n∟定义和调用函数\n\n# 全局变量与局部变量的冲突\
    \ - 示例\n\n本节提供了一个关于 JavaScript 如何处理局部变量与全局变量冲突的教程示例。\n\n为了查看 JavaScript 如何处理函数内部外部具有相同名称的全局和局部变量，我编写了以下教程示例：\n\
    \n```html\n <html\n<!-- Variable_Collision.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>变量冲突</title></head>\n<body>\n<pre>\n\
    <script type=\"text/javascript\">\n   var tempVar;\n   tempVar = \"Bird\";\n \
    \  tempNoVar = \"Fish\";\n\n   scopeCheck();\n\n   document.write(\"\\n\\nAfter\
    \ function call:\");\n   document.write(\"\\n   tempVar = \" + tempVar);\n   document.write(\"\
    \\n   tempNoVar = \" + tempNoVar);\n\nfunction scopeCheck() {\n   var tempVar;\n\
    \   tempVar = \"Bird\";\n   tempNoVar = \"Fish\";\n\n   tempVar = tempVar + \"\
    \ - Updated\";\n   tempNoVar = tempNoVar + \" - Updated\";\n\n   document.write(\"\
    \\n\\nUpdated value in function:\");\n   document.write(\"\\n   tempVar = \" +\
    \ tempVar);\n   document.write(\"\\n   tempNoVar = \" + tempNoVar);\n}\n</script>\n\
    </pre>\n</body>\n</html>\n```\n\n这个教程示例测试了两组变量。一组在函数外部引入，一组在函数内部。一组的变量名与另一组冲突。两个使用\
    \ `var` 语句声明的 `tempVar` 保持为两个变量。但两个未使用 `var` 自动声明的 `tempNoVar` 变成了一个变量。查看输出：\n\
    \n```\n Updated value in function:\n   tempVar = Bird - Updated\n   tempNoVar\
    \ = Fish - Updated\n\nAfter function call:\n   tempVar = Bird\n   tempNoVar =\
    \ Fish - Updated\n```\n\nJavaScript 教程 - Herong 的教程示例\n\n∟定义和调用函数\n\n# \"return\"\
    \ 语句与返回值\n\n本节提供了一个关于 `return` 语句如何传递值的教程示例。为了帮助你理解不同类型的返回值，我编写了此教程示例：\n\n```html\n\
    \ <html\n<!-- Return_Values.html\n   Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n-->\n<head><title>返回值</title></head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n\n   var resValue = valueReturn();\n   var resObject = objectReturn();\n\
    \   var resUndefined = noReturn();\n\n   document.write(\"\\n\\nAfter function\
    \ calls:\");\n   document.write(\"\\n   resValue = \" + resValue);\n   document.write(\"\
    \\n   resObject = \" + resObject);\n   document.write(\"\\n   resUndefined = \"\
    \ + resUndefined);\n\nfunction valueReturn() {\n   var value = \"String value\"\
    ;\n   return value;\n}\n\nfunction objectReturn() {\n   var object = new Array(\"\
    Array object\");\n   return object;\n}\n\nfunction noReturn() {\n}\n</script>\n\
    </pre>\n</body>\n</html>\n```\n\n此教程示例的输出并没有任何意外：\n\n```\n valueReturn()\nobjectReturn()\n\
    noReturn()\n\nAfter function calls:\n   resValue = String value\n   resObject\
    \ = Array object\n   resUndefined = undefined\n```\n\nJavaScript 教程 - Herong 的教程示例\n\
    \n# 浏览器支持 JavaScript\n\n本章介绍了 Web 浏览器如何支持嵌入在 HTML 文档中的 JavaScript 代码。主题包括：执行嵌入\
    \ `script` 标签中的 JavaScript 代码；通过外部文件引入 JavaScript 代码；DOM API `document` 和 `window`\
    \ 对象；浏览器事件触发器和监听器；Web 浏览器中的 JavaScript 控制台。\n\n"
- fmt: "\n# [JavaScript Console in Google Chrome](#part0062.xhtml)\n# [JavaScript\
    \ Console in Mozilla Firefox](#part0063.xhtml)\n# [JavaScript Console in Apple\
    \ Safari](#part0064.xhtml)\n# [JavaScript Console in IE (Internet Explorer](#part0065.xhtml)\n\
    \n## Conclusion\n\n- All popular Web browsers support `<script>` tags in the HTML\
    \ document to execute JavaScript codes while rendering the HTML document.\n- All\
    \ popular Web browsers support `DOM` (Document Object Model) `API` (Application\
    \ Programming Interface) to allow JavaScript codes to interact with the browser\
    \ and the HTML document.\n- All popular Web browsers support events to trigger\
    \ executions of JavaScript codes while user interacts with the browser.\n- All\
    \ popular Web browsers support `\"javascript:\"` pseudo-URL - evaluating JavaScript\
    \ code in the address field of the browser.\n- When embedding JavaScript code\
    \ in HTML documents, `</script>` should not be used directly anywhere inside the\
    \ JavaScript code.\n- JavaScript code can be stored in external files and linked\
    \ to any HTML documents.\n- The built-in object `document` represents the embedding\
    \ HTML document and provides the `DOM` (Document Object Model) `API` for you to\
    \ manipulate the HTML document.\n- The built-in object `window` represents the\
    \ browser window and provides properties and methods for you to interact with\
    \ the browser window.\n- Popular Web browsers all provide a JavaScript console\
    \ that allows you to see execution errors and log messages. It also allow you\
    \ to run JavaScript statements to interact with the Web document.\n\n## [JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n## [Web Browser\
    \ Supporting JavaScript](#part0048.xhtml)\n\n### JavaScript Support in Web Browsers\n\
    \nThis section provides a quick description of how Web browsers execute JavaScript\
    \ codes, provide `DOM API` for document interaction, and provide events to trigger\
    \ JavaScript code execution.\n\nA typical Web browser will provide support to\
    \ JavaScript in 4 areas:\n\n- Support `<script>` tags in the HTML document to\
    \ execute JavaScript codes while rendering the HTML document.\n- Support `DOM`\
    \ (Document Object Model) `API` (Application Programming Interface) to allow JavaScript\
    \ codes to interact with the browser and the HTML document.\n- Support events\
    \ to trigger executions of JavaScript codes while user interacts with the browser.\n\
    - Support `\"javascript:\"` pseudo-URL - evaluating JavaScript code in the address\
    \ field of the browser.\n\nLet's use a simple JavsScript example to illustrate\
    \ those areas:\n\n```html\n <html>\n<!-- DOM_and_Event.html\n   Copyright (c)\
    \ HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>DOM and Event</title>\n\
    <script type=\"text/javascript\">\nvar colorID = 0;\nfunction changeColor() {\n\
    \   if (colorID == 0 )\n      document.body.bgColor = \"lightgrey\";\n   else\
    \ if (colorID == 1 )\n      document.body.bgColor = \"lightblue\";\n   else if\
    \ (colorID == 2 )\n      document.body.bgColor = \"lightgreen\";\n   else if (colorID\
    \ == 3 )\n      document.body.bgColor = \"lightyellow\";\n   colorID = (colorID+1)%4;\n\
    }\n</script>\n</head>\n<body>\n<p>\n<script type=\"text/javascript\">\n   document.write('Hello\
    \ World!');\n</script>\n</p>\n<form>\n  <input type=\"button\" value=\"Click to\
    \ change background color\"\n   onClick=\"changeColor();\"/>\n</form>\n<p>Want\
    \ to know the color code? \n<a href=\"javascript:alert(document.body.bgColor)\"\
    >Click here.</a>\n</p>\n</body>\n</html>\n```\n\nRun this JavaScript example in\
    \ a Web browser, and click the change color button. The browser will change the\
    \ background background color of the page each time you click the button.\n\n\
    If you want to know the code value of the current background color, you can click\
    \ the hyper link near the end of the page.\n\nNow look at the JavaScript example\
    \ again. The browser indeed supports you in 4 areas:\n\n1. Executes the JavaScript\
    \ code included in the `\"script\"` tag while rendering the HTML document:\n\n\
    ```html\n <script type=\"text/javascript\">\n   document.write('Hello World!');\n\
    </script>\n```\n\n2. Provides the `\"document\"` object as part of the `DOM API`\
    \ to allow the JavaScript code to interact with the HTML document:\n\n```javascript\n\
    \ document.write('Hello World!');\n   document.body.bgColor = \"lightgrey\";\n\
    \   ...\n```\n\n3. Provides the `\"onClick\"` event to allow the JavaScript code\
    \ to be executed:\n\n```html\n <input type=\"button\" value=\"Click to change\
    \ background color\"\n   onClick=\"changeColor();\"/>\n```\n\n4. Executes the\
    \ JavaScript code included in `\"javascript:\"` pseudo-URL.\n\n```html\n <a href=\"\
    javascript:alert(document.body.bgColor)\">Click here.</a>\n```\n\n## [JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n## [Web Browser\
    \ Supporting JavaScript](#part0048.xhtml)\n\n### Including JavaScript Codes with\
    \ HTML \"script\" Tags\n\nThis section provides a quick description of how to\
    \ include JavaScript codes into HTML documents with `'script'` tags. A tutorial\
    \ example is provided on calling a function defined in the `'head'` tag.\n\nJavaScript\
    \ code is designed to be executed mainly by Web browsers on client systems. So\
    \ JavaScript code needs to be embedded in HTML documents to be delivered to browsers.\n\
    \nHTML document language standard supports the `\"script\"` tag that allows you\
    \ to include JavaScript code in HTML documents. The syntax of the `\"script\"\
    ` tag looks like this:\n\n```html\n <script type=\"text/javascript\" ...>\n  \
    \ ... JavaScript statements ...\n</script>\n```\n\nIn a single HTML document,\
    \ multiple `\"script\"` tags with JavaScript codes can be placed in different\
    \ locations. The exact locations and relations of `\"script\"` tags are described\
    \ in following simple rules:\n\n- `\"script\"` tags can be placed inside the `\"\
    head\"` tag.\n- `\"script\"` tags can be placed inside many block-level tags,\
    \ like `\"body\"`, `\"p\"`, `\"pre\"`, `\"div\"`, etc.\n- `\"script\"` tags can\
    \ be placed inside many line-level tags, like `\"strong\"`, `\"em\"`, `\"span\"\
    `, etc.\n- JavaScript codes included in `\"script\"` tags in the `\"head\"` tag\
    \ will be executed before the Web page body gets processed.\n- JavaScript codes\
    \ included in `\"script\"` tags in the block-level and line-level tags will be\
    \ executed while the Web page body gets processed.\n- JavaScript codes included\
    \ in `\"script\"` tags will be executed in the same order as they appear in the\
    \ HTML document.\n- JavaScript codes from all `\"script\"` tags will be considered\
    \ as a single execution session, as if they were included in a single `\"script\"\
    ` tag.\n\nBased these rules, we could define a user function in the `\"head\"\
    ` tag of the document, and call it later in a `\"pre\"` tag in the same document.\
    \ Here is a simple tutorial example that shows this interesting behavior:\n\n\
    ```html\n <html>\n<!-- Hello_World_Head.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>printHello() Function in the \"head\"\
    \ Tag</title>\n<script type=\"text/javascript\">\nfunction printHello() {\n  \
    \ document.write('Hello World!');\n}\n</script>\n</head>\n<body>\n<pre>\n<script\
    \ type=\"text/javascript\">\n   printHello();\n</script>\n</pre>\n</body>\n</html>\n\
    ```\n\nOf course, the output of this sample JavaScript page will be a simple text\
    \ on the page: \"Hello World!\".\n\n## [JavaScript Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n## [Web Browser Supporting JavaScript](#part0048.xhtml)\n\
    \n### type=\"text/javascript\" or language=\"JavaScript\"\n\nThis section describes\
    \ the differences `type='text/javascript'` or `language='JavaScript'` attributes.\n\
    \nWhen using the `<script>` tag to embed a script code in HTML documents, you\
    \ can specify the scripting language in several ways:\n\n1. Using `type=\"text/javascript\"\
    ` attribute only - The Web browser will execute the script code as JavaScript:\n\
    \n```html\n <script type=\"text/javascript\">\n   ... JavaScript code ...\n</script>\n\
    ```\n\n2. Using `language=\"JavaScript\"` attribute only - The Web browser will\
    \ execute the script code as JavaScript:\n\n```html\n <script language=\"JavaScript\"\
    >\n   ... JavaScript code ...\n</script>\n```\n\n3. Using `language=\"JavaScript1.8\"\
    ` attribute only - The Web browser will execute the script code JavaScript only\
    \ if it supports JavaScript 1.7 version:\n\n```html\n <script language=\"JavaScript1.8\"\
    >\n   ... JavaScript code ...\n</script>\n```\n"
