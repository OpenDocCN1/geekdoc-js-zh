    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Setting\
    \ the \"constructor\" Property in the Prototype Object</title>\n</head>\n<body>\n\
    <pre>\n<script type=\"text/javascript\">\n\n// Setting up my constructor, prototype\
    \ and object\nfunction Book(title, author) {\n   this.title = title;\n   this.author\
    \ = author;\n}\n\n   // Replacing the default prototype object\n   myPrototype\
    \ = new Object();\n   Book.prototype = myPrototype;\n   Book.prototype.price =\
    \ 9.99;\n   Book.prototype.constructor = Book;\n\n   // Modifying the base prototype\
    \ object\n   Object.prototype.copyright = \"herongyang.com\";\n\n   // Creating\
    \ an object from my constructor\n   var myBook = new Book(\"JavaScript Tutorials\"\
    , \"Herong Yang\");\n\n   // Dumping built-in properties at the base prototype\
    \ level\n   document.writeln(\"\\nObject.prototype's built-in properties:\");\n\
    \   dumpProperty(Object.prototype, \"constructor\");\n   dumpProperty(Object.prototype,\
    \ \"hasOwnProperty\");\n   dumpProperty(Object.prototype, \"isPrototypeOf\");\n\
    \   dumpProperty(Object.prototype, \"toString\");\n   dumpProperty(Object.prototype,\
    \ \"valueOf\");\n\n   // Dumping built-in properties at the my prototype level\n\
    \   document.writeln(\"\\nBook.prototype's built-in properties:\");\n   dumpProperty(Book.prototype,\
    \ \"constructor\");\n   dumpProperty(Book.prototype, \"hasOwnProperty\");\n  \
    \ dumpProperty(Book.prototype, \"isPrototypeOf\");\n   dumpProperty(Book.prototype,\
    \ \"toString\");\n   dumpProperty(Book.prototype, \"valueOf\");\n\n   // Dumping\
    \ built-in properties at the object level\n   document.writeln(\"\\nmyBook's built-in\
    \ properties:\");\n   dumpProperty(myBook, \"constructor\");\n   dumpProperty(myBook,\
    \ \"hasOwnProperty\");\n   dumpProperty(myBook, \"isPrototypeOf\");\n   dumpProperty(myBook,\
    \ \"toString\");\n   dumpProperty(myBook, \"valueOf\");\n\nfunction dumpProperty(object,\
    \ property) {\n   var inheritance; \n   if (object.hasOwnProperty(property)) \n\
    \      inheritance = \"Local\";\n   else \n      inheritance = \"Inherited\";\n\
    \   document.writeln(\"   \"+property+\": \"+inheritance+\": \"\n      +object[property]);\n\
    }\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output of the modified tutorial\
    \ example will be identical to the previous one. But now we have a much better\
    \ understanding of where properties are stored in the prototype hierarchical tree.\
    \ See the diagram below:\n\n![](Images/image00147.jpeg)\n\n### constructor Property\
    \ of the Prototype Object\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Inheritance of Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n### ... Adding Local Methods at the Object Level\n\nThis section provides a\
    \ quick description of adding local methods at the object level through the constructor\
    \ function to all objects or directly on one object.\n\nNow we have a good picture\
    \ of where properties and methods are stored and accessed through the inheritance\
    \ path. We are ready to add local methods at the object level - in objects themselves,\
    \ not their prototype object. This can be done in two ways:\n\n*   Add the local\
    \ method in the constructor function, so all objects created by this constructor\
    \ will have this local method.\n*   Add the local method to one object only, so\
    \ other objects will not have this local method.\n\nLet's try to add a method\
    \ called `getDesc` in the `Book()` constructor function as shown in this tutorial\
    \ example:\n\n```html\n <html>\n<!-- Inheritance_Add_Local_Method.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Adding a Local\
    \ Method through the Constructor</title>\n</head>\n<body>\n<pre>\n<script type=\"\
    text/javascript\">\n\n// Setting up my constructor, prototype and object\nfunction\
    \ Book(title, author) {\n   this.title = title;\n   this.author = author;\n  \
    \ this.getDesc = getDescription;\n}\n\n// Defining a function to be used as a\
    \ method\nfunction getDescription() {\n   return \"\\\"\"+this.title+\"\\\" by\
    \ \"+this.author;\n}\n\n   // Replacing the default prototype object\n   myPrototype\
    \ = new Object();\n   Book.prototype = myPrototype;\n   Book.prototype.price =\
    \ 9.99;\n   Book.prototype.constructor = Book;\n\n   // Modifying the base prototype\
    \ object\n   Object.prototype.copyright = \"herongyang.com\";\n\n   // Creating\
    \ an object from my constructor\n   var myBook = new Book(\"JavaScript Tutorials\"\
    , \"Herong Yang\");\n\n   // Where is this method located\n   document.writeln(\"\
    \\nChecking Object.prototype...\");\n   dumpProperty(Object.prototype, \"getDesc\"\
    );\n   document.writeln(\"\\nChecking Book.prototype...\");\n   dumpProperty(Book.prototype,\
    \ \"getDesc\");\n   document.writeln(\"\\nChecking myBook...\");\n   dumpProperty(myBook,\
    \ \"getDesc\");\n\n   // Running this method\n   document.writeln(\"\\nRunning\
    \ myBook.getDesc()...\");\n   document.writeln(\"   \"+myBook.getDesc());\n\n\
    function dumpProperty(object, property) {\n   var inheritance; \n   if (object.hasOwnProperty(property))\
    \ \n      inheritance = \"Local\";\n   else \n      inheritance = \"Inherited\"\
    ;\n   document.writeln(\"   \"+property+\": \"+inheritance+\": \"\n      +object[property]);\n\
    }\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output of this tutorial example\
    \ confirms that `getDesc` is a local method at the object level:\n\n```\n Checking\
    \ Object.prototype...\n   getDesc: Inherited: undefined\n\nChecking Book.prototype...\n\
    \   getDesc: Inherited: undefined\n\nChecking myBook...\n   getDesc: Local: function\
    \ getDescription() {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n\
    }\n\nRunning myBook.getDesc()...\n   \"JavaScript Tutorials\" by Herong Yang\n\
    ```\n\nSee the next section on how to add a method at the prototype level.\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Inheritance\
    \ of Properties and Methods through the Prototype Object Chain](#part0093.xhtml)\n\
    \n### ... Adding Inherited Methods at the Prototype Level\n\nThis section provides\
    \ a quick description of adding inherited methods at the constructor's prototype\
    \ object to allow all objects created by the constructor to share.\n\nIn the previous\
    \ section, we learned how to add a local method to all objects through the constructor\
    \ function.\n\nHowever if a method needs to be used by all objects, it's better\
    \ to add it as an inherited method in the prototype object. This saves the extra\
    \ storage required in each object to store a local method.\n\nLet's try to add\
    \ a method called `toString` in the `Book.prototype` object. This `toString` method\
    \ will be inherited by all objects created by `Book()`. By the way, `Book.prototype.toString`\
    \ will override `Object.prototype.toString` in the inheritance tree.\n"
