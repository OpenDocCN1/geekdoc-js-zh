  trans: "\n\n# 什么是对象？\n\n本节简要介绍了 JavaScript 中什么是对象，以及创建和使用对象的一些有趣特性。此外还提供了一个教程示例。\n\
    \n## 什么是对象？\n\n对象是特殊数据类型 `\"Object\"` 或任何 `\"prototype\"` 数据类型的实例。\n\nJavaScript\
    \ 支持具有以下有趣特性的对象：\n\n*   对象是从 `\"prototype\"` 实例化的，而不是像其他语言那样从 `\"class\"` 或 `\"\
    struct\"` 实例化。\n*   `\"Object\"` 数据类型的对象可以使用对象初始化运算符 (`{}`) 创建。\n*   `\"Object\"\
    ` 数据类型和任何 `\"prototype\"` 数据类型的对象可以使用构造函数运算符 (`new`) 创建。\n*   当将对象赋值给变量时，变量中存储的是对象的引用。这与将基本值赋值给变量不同，后者是值本身被存储在变量中的。\n\
    *   对象只能有公共属性和公共方法。\n*   可以使用点运算符 (`.`) 访问属性和方法。\n*   JavaScript 中的对象等同于其他语言中的关联数组（associate\
    \ array）。\n*   可以使用数组运算符 (`[]`) 访问属性和方法。\n*   可以动态地为单个原型的所有对象添加新的属性和方法。\n*   可以动态地从单个原型的所有对象中删除现有的属性和方法。\n\
    *   可以动态地为一个对象添加新的属性和方法，而不影响同一原型的其他对象。\n*   可以动态地从一个对象删除现有的属性和方法，而不影响同一原型的其他对象。\n\
    *   JavaScript 提供了几个内置自定义数据类型：`Array`、`Boolean`、`Date`、`Function`、`Math`、`Number`、`RegExp`\
    \ 和 `String`。\n\n为了向这些特性，我编写了这个简单的教程示例来创建一个 `\"Object\"` 数据类型的对象，并在这个新对象上添加新属性：\n\
    \n```\n <html>\n<!-- Object_Data_Type_and_Value.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Object Data Type and Value</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n   // 将基本值赋值给变量\n\
    \   var jsSite = \"mozilla.org\";\n\n   // 创建对象并将其赋值给变量\n   var mySite = new Object();\n\
    \n   // 为一个对象添加新属性\n   mySite.name = \"herongyang.com\";\n\n   // 获取对象属性的值\n \
    \  document.writeln('\"mySite.name\" property: '+mySite.name); \n\n   // 检查 mySite\
    \ 的数据类型\n   document.writeln('\"mySite\" data type: '+(typeof mySite)); \n\n \
    \  // 检查 jsSite 的数据类型\n   document.writeln('\"jsSite\" data type: '+(typeof jsSite));\
    \ \n</script>\n</pre>\n</body>\n</html>\n```\n\n运行此示例，你将得到：\n\n```\n \"mySite.Name\"\
    \ property: herongyang.com\n\"mySite\" data type: object\n\"jsSite\" data type:\
    \ string\n```\n\nJavaScript 教程 - Herong 的教程示例\n\n# 对象介绍\n\n## \"Object\" 数据类型的对象\n\
    \n本节简要介绍了 `'Object'` 数据类型及其属性和方法。提供了一个如何创建和测试 `'Object'` 数据类型对象的教程示例。要学习如何在 JavaScript\
    \ 中使用对象，我们需要从 `'Object'` 数据类型开始，它具有以下特性：\n\n*   `\"Object\"` 数据类型的对象可以使用对象初始化运算符\
    \ (`{}`) 创建。\n*   `\"Object\"` 数据类型和任何 `\"prototype\"` 数据类型的对象可以使用构造函数运算符 (`new`)\
    \ 创建。\n*   可以使用点运算符 (`.`) 访问属性和方法。\n*   可以使用数组运算符 (`[]`) 访问属性和方法。\n\n这里是一个显示其中一些特性的教程示例：\n\
    \n```\n <html>\n<!-- Object_Data_Type_and_Value.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Object Data Type and Value</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n   // 将基本值赋值给变量\n\
    \   var jsSite = \"mozilla.org\";\n\n   // 创建对象并将其赋值给变量\n   var mySite = new Object();\n\
    \n   // 为一个对象添加新属性\n   mySite.name = \"herongyang.com\";\n\n   // 获取对象属性的值\n \
    \  document.writeln('\"mySite.name\" property: '+mySite.name); \n\n   // 检查 mySite\
    \ 的数据类型\n   document.writeln('\"mySite\" data type: '+(typeof mySite)); \n\n \
    \  // 检查 jsSite 的数据类型\n   document.writeln('\"jsSite\" data type: '+(typeof jsSite));\
    \ \n</script>\n</pre>\n</body>\n</html>\n```\n\n运行此示例，你将得到：\n\n```\n \"mySite.Name\"\
    \ property: herongyang.com\n\"mySite\" data type: object\n\"jsSite\" data type:\
    \ string\n```\n\n# 添加和删除对象属性\n\n本节简要介绍了如何添加、更新和删除属性。\n\n*   可以动态地为一个对象添加新的属性和方法，而不影响同一原型的其他对象。\n\
    *   可以动态地从一个对象删除现有的属性和方法，而不影响同一原型的其他对象。\n\n这里有一个教程示例，展示了如何添加新属性、更新属性值以及删除属性：\n\
    \n```\n <html>\n<!-- Object_Property.html\n   Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n-->\n<head>\n<title>Object Properties of \"Object\"</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n   // 创建 \"Object\"\
    \ 类型的对象\n   var mySite = new Object();\n   var myBook = new Object();\n\n   //\
    \ 仅为一个对象添加新属性\n   mySite.url = \"herongyang.com\";\n   myBook.author = \"Herong\
    \ Yang\";\n\n   // 更新属性值\n   mySite.url = \"www.herongyang.com\";\n\n   // 显示属性值\n\
    \   document.writeln('mySite.url: '+mySite.url);\n   document.writeln('myBoot.url:\
    \ '+myBook.url);\n   document.writeln('mySite.author: '+mySite.author);\n   document.writeln('myBook.author:\
    \ '+myBook.author);\n\n   // 这个属性仅属于一个对象吗？\n   document.writeln('mySite.hasOwnProperty(\"\
    url\"): '\n      +mySite.hasOwnProperty(\"url\"));\n\n   // 仅从一个对象删除属性\n   document.writeln('Deleting\
    \ mySite.url...');\n   delete mySite.url;\n   document.writeln('mySite.url: '+mySite.url);\n\
    </script>\n</pre>\n</body>\n</html>\n```\n\n结果符合我的预期：\n\n```\n mySite.url: www.herongyang.com\n\
    myBoot.url: undefined\nmySite.author: undefined\nmyBook.author: Herong Yang\n\
    mySite.hasOwnProperty(\"url\"): true\nDeleting mySite.url...\nmySite.url: undefined\n\
    ```\n\n"
- fmt: "\n# JavaScript Tutorials - Herong's Tutorial Examples(#part0001.xhtml)\n\n\
    ## Introduction to Objects(#part0073.xhtml)\n\n### Adding and Deleting Object\
    \ Own Methods\n\nThis section provides a quick description of object's own methods.\
    \ A tutorial example is provided on how to add, call, and delete object's own\
    \ methods.\n\nWhen you create a new object from the `Object` constructor, you\
    \ will get an object with only some default methods:\n\n- `toString()` - This\
    \ default method outputs `[object Object]`. It needs to be placed with a real\
    \ one.\n- `valueOf()` - This default method outputs `[object Object]`. It needs\
    \ to be placed with a real one.\n\nBut you can add more methods to one object\
    \ at any time using an assignment operation like this:\n\n```\n object_name.method_name\
    \ = function_name;\n```\n\nThe added method is for this one object only. Other\
    \ objects will not have this method.\n\nCalling a method on an object is the same\
    \ as calling the assigned function as shown below:\n\n```\n object_name.method_name(param1,\
    \ param2, ...);\n```\n\nYou can also delete methods from one object at any time\
    \ using a delete operation like this:\n\n```\n delete object_name.method_name;\n\
    ```\n\nHere is a tutorial example that shows you how to add a new method, call\
    \ a method, and delete a method.\n\n```html\n <html>\n<!-- Object_Method.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Object\
    \ Methods of \"Object\"</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n// My function to say hello\nfunction sayHello(name) {\n   window.alert(\"\
    Hello \"+name);\n}\n\n   // Preparing two objects of \"Object\" type\n   var mySite\
    \ = new Object();\n   var myBook = new Object();\n   mySite.url = \"herongyang.com\"\
    ;\n   myBook.author = \"Herong Yang\";\n\n   // Adding a method to one object\
    \ only\n   myBook.greet = sayHello;\n\n   // Calling the method on \"myBook\"\n\
    \   myBook.greet(myBook.author);\n\n   // Calling the method on \"mySite\" - will\
    \ not work\n//   mySite.greet(myBook.author);\n\n   // Deleting the method on\
    \ \"myBook\"\n   delete myBook.greet;\n\n   // Calling the method on the object\
    \ - will not work\n//   myBook.greet(myBook.author);\n</script>\n</pre>\n</body>\n\
    </</html>\n```\n\nIf you run this JavaScript page, you will get alert box on the\
    \ screen saying: \"Hello Herong Yang\".\n\n### Using \"this\" Keyword to Represent\
    \ Current Object\n\nThis section provides a quick description of the `this` keyword,\
    \ which represents the current object in object method. A tutorial example is\
    \ provided on how to access properties and methods of the current object.\n\n\
    While defining a function to be used as a method for objects, you can use the\
    \ keyword `this` to represent the current object the method is called against.\
    \ The `this` keyword in JavaScript has the same usage as in Java.\n\nHere is tutorial\
    \ example of using `this` keyword to access properties and methods of the current\
    \ object:\n\n```html\n <html>\n<!-- Object_this_Keyword.html\n   Copyright (c)\
    \ HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>\"this\" Keyword in\
    \ Object Methods</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n// Using \"this\" to get the properties\nfunction myToString() {\n   return\
    \ '\"'+this.title + '\" by '+this.author;\n}\n\n// Using \"this\" to get the \"\
    toString\" method\nfunction showAll() {\n   window.alert(this.toString());\n}\n\
    \n   // Preparing one of \"Object\" type\n   var myBook = new Object();\n   myBook.author\
    \ = \"Herong Yang\";\n   myBook.title = \"JavaScript Tutorials\";\n\n   // Adding\
    \ a new method to one object only\n   myBook.print = showAll;\n\n   // Overriding\
    \ \"toString()\" on one object only\n   myBook.toString = myToString;\n\n   //\
    \ Calling the method on \"myBook\"\n   myBook.print();\n</script>\n</pre>\n</body>\n\
    </</html>\n```\n\nIf you run this \"this\" keyword example, you will get an alert\
    \ box with the message of: \"JavaScript Tutorials\" by Herong Yang.\n\n### Object\
    \ Literals of the \"Object\" Type\n\nThis section provides a quick description\
    \ of object literals or initializers for creating new objects of the `Object`\
    \ type. A tutorial example is provided on how to initialize an object with two\
    \ properties and two methods.\n\nIn previous sections we learned that objects\
    \ of `Object` type can be created with the constructor function `new Object()`.\n\
    \nJavaScript also support a simpler way to create objects of `Object` type using\
    \ object literals in the format of:\n\n```\n {property1: value1, property2: value2,\
    \ ...}\n```\n\nwhere `property1` and `property2` are property or method names.\
    \ In JavaScript language, properties and methods in an object are really managed\
    \ in an identical way.\n\nAn object literal is also called object initializer,\
    \ because it allows you to create a new object and to initialize it with properties\
    \ and methods in a single operation.\n\nUsing an object literal to create an object\
    \ has the same result as using the constructor. But object literals are much easier\
    \ to use. The following two code segments are identical. But the first one is\
    \ much simpler:\n\n```javascript\n // Creating an object with an object literal\n\
    \   var obj = {property1: value1, property2: value2, ...};\n\n   // Creating an\
    \ object with the constructor\n   var obj = new Object();\n   obj.property1 =\
    \ value1;\n   obj.property2 = value2;\n   ...;\n```\n\nHere is a tutorial example\
    \ of creating an object of the \"Object\" type with an object literal, or initializer:\n\
    \n```html\n <html>\n<!-- Object_Literal.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head>\n<title>Object Literals of \"Object\" Type</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n// Using \"this\"\
    \ to get the properties\nfunction myToString() {\n   return '\"'+this.title +\
    \ '\" by '+this.author;\n}\n\n// Using \"this\" to get the \"toString\" method\n\
    function showAll() {\n   window.alert(this.toString());\n}\n\n   // Using object\
    \ literal\n   var myBook = {\n      author: \"Herong Yang\",\n      title: \"\
    JavaScript Tutorials\",\n      print: showAll,\n      toString: myToString\n \
    \  };\n\n   // Calling the method on \"myBook\"\n   myBook.print();\n</script>\n\
    </pre>\n</body>\n</</html>\n```\n\nIf you run this tutorial example, you will\
    \ get the same result as the example in the previous section: \"JavaScript Tutorials\"\
    \ by Herong Yang.\n\n### Objects and Associate Arrays\n\nThis section provides\
    \ a quick description of access object properties using the associate array formats\
    \ `object_name['property_name']`. A tutorial example is provided on how to use\
    \ objects as associate arrays.\n\nIn previous section, I mentioned that methods\
    \ of an object are managed in the same as properties in JavaScript. This leads\
    \ to another nice feature of JavaScript objects:\n\nObjects in JavaScript are\
    \ really associated arrays, which contains a collection of key-value pairs. Keys\
    \ represent property names and method names, and values represent property values\
    \ and function definitions.\n\nNow you know how to refer to a method property\
    \ or a method in two ways:\n\n- Dot (`. Operator - Example: `object_name.property_name`.\n\
    - Associate Array Operator - Example: `object_name[\"property_name\"]`.\n\nHere\
    \ is a tutorial example on how to access object's properties and methods in the\
    \ format of an associate arrays:\n"
