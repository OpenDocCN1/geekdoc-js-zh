    \ with the object initializer operator ({}).\n\n*   \"Object\" data type has two\
    \ properties: \"constructor\", and \"prototype\"\n\n*   \"Object\" data type has\
    \ a number of methods: \"hasOwnProperty()\", \"isPrototypeOf()\", \"toString()\"\
    , \"valueOf()\".\n\nHere is tutorial example showing some of those properties\
    \ and methods defined on \"Object\" data type:\n\n```\n <html>\n<!-- Object_Object.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Objects\
    \ of \"Object\"</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n   // Creating an object and assigning it to a variable\n   var mySite =\
    \ new Object();\n\n   // Showing the built-in properties\n   document.writeln('mySite.constructor:\
    \ '+mySite.constructor); \n   document.writeln('mySite.prototype: '+mySite.prototype);\
    \ \n\n   // Adding a property this object only\n   mySite.name = \"herongyang.com\"\
    ;\n\n   // Converting this object to a string\n   document.writeln('mySite.toString():\
    \ '+mySite.toString()); \n\n   // Converting this object to a numeric value\n\
    \   document.writeln('mySite.valueOf(): '+mySite.valueOf());\n\n   // Testing\
    \ a property of this object\n   document.writeln('mySite.hasOwnProperty(\"name\"\
    ): '\n      +mySite.hasOwnProperty(\"name\"));\n   document.writeln('mySite.hasOwnProperty(\"\
    constructor\"): '\n      +mySite.hasOwnProperty(\"constructor\"));\n   document.writeln('mySite.hasOwnProperty(\"\
    address\"): '\n      +mySite.hasOwnProperty(\"address\"));\n</script>\n</pre>\n\
    </body>\n</html>\n```\n\nRun this example, you will get this interesting result:\n\
    \n```\n mySite.constructor: \nfunction Object() {\n    [native code]\n}\n\nmySite.prototype:\
    \ undefined\nmySite.toString(): [object Object]\nmySite.valueOf(): [object Object]\n\
    mySite.hasOwnProperty(\"name\"): true\nmySite.hasOwnProperty(\"constructor\"):\
    \ false\nmySite.hasOwnProperty(\"address\"): false\n```\n\nExplanation of this\
    \ result will be provided in next sections.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to Objects](#part0073.xhtml)\n\
    \n∟Adding and Deleting Object Own Properties\n\nThis section provides a quick\
    \ description of object's own properties. A tutorial example is provided on how\
    \ to add, update, and delete object's own properties.\n\nWhen you create a new\
    \ object from the \"Object\" constructor, you will get an object with only two\
    \ default properties:\n\n*   \"constructor\" - This property contains the constructor\
    \ function of this object.\n\n*   \"prototype\" - This property represents the\
    \ prototype of this object to allow you to modify the prototype on the fly.\n\n\
    But you can add more properties to one object at any time using an assignment\
    \ operation like this:\n\n```\n object_name.property_name = initial_value;\n```\n\
    \nThe added property is for this one object only. Other objects will not have\
    \ this property.\n\nYou can also delete properties from one object at any time\
    \ using a delete operation like this:\n\n```\n delete object_name.property_name;\n\
    ```\n\nHere is a tutorial example that shows you how to add a new property, update\
    \ the property value, retrieve the property value, and delete a property.\n\n\
    ```\n <html>\n<!-- Object_Property.html\n   Copyright (c) HerongYang.com. All\
    \ Rights Reserved.\n-->\n<head>\n<title>Object Properties of \"Object\"</title>\n\
    </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n   // Creating objects\
    \ of \"Object\" type\n   var mySite = new Object();\n   var myBook = new Object();\n\
    \n   // Adding a new property to one object only\n   mySite.url = \"herongyang.com\"\
    ;\n   myBook.author = \"Herong Yang\";\n\n   // Updating a property value\n  \
    \ mySite.url = \"www.herongyang.com\";\n\n   // Showing property values\n   document.writeln('mySite.url:\
    \ '+mySite.url);\n   document.writeln('myBoot.url: '+myBook.url);\n   document.writeln('mySite.author:\
    \ '+mySite.author);\n   document.writeln('myBook.author: '+myBook.author);\n\n\
    \   // Is this property for one object only?\n   document.writeln('mySite.hasOwnProperty(\"\
    url\"): '\n      +mySite.hasOwnProperty(\"url\"));\n\n   // Deleting a property\
    \ from one only\n   document.writeln('Deleting mySite.url...');\n   delete mySite.url;\n\
    \   document.writeln('mySite.url: '+mySite.url);\n</script>\n</pre>\n</body>\n\
    </html>\n```\n\nThe result matches my expectation:\n\n```\n mySite.url: www.herongyang.com\n\
    myBoot.url: undefined\nmySite.author: undefined\nmyBook.author: Herong Yang\n\
    mySite.hasOwnProperty(\"url\"): true\nDeleting mySite.url...\nmySite.url: undefined\n\
    ```"
