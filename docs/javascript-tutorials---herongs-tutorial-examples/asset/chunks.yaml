  trans: "\n\n本节提供了教程示例，介绍如何使用 Apple Safari 中的 JavaScript 控制台（Console）来查看 JavaScript\
    \ 执行产生的错误和日志消息。你也可以使用它来运行任何 JavaScript 语句以与 HTML 文档进行交互。\n\n## 什么是 Apple Safari\
    \ 中的 JavaScript 控制台？\n\nApple Safari 中的 JavaScript 控制台是浏览器为你提供的一个控制台：\n\n* 查看浏览器在执行嵌入\
    \ JavaScript 代码时生成的任何错误或日志消息。\n* 运行任何 JavaScript 代码以交互式的方式与 Web 文交互。\n\n以下是我测试\
    \ Apple Safari 中 JavaScript 控制台的操作：\n\n1. 运行 Apple Safari 并加载以下 HTML 代码：\n\n```html\n\
    \ <html>\n<head><title>Hello World!</title></head>\n<<body>\n<script type=\"text/javascript\"\
    >\n   document.write('Hello World! - Document');\n   console.log('Hello World!\
    \ - Console');\n</script>\n</body>\n</html>\n```\n\n2. 按“Option-Command-C”组合键（或选择“开发\
    \ > 显示 JavaScript 控制台”菜单）。我在屏幕上显示的开发者面板中看到了“Console”选项卡，上面显示了日志消息：“Hello World!\
    \ - Console”。\n\n3. 在控制台中输入一些 JavaScript 语句并运行：\n\n```\n Hello World! - Console\n\
    >> var msg = document.title;\n< undefined\n>> console.log(msg.length);\n  12\n\
    < undefined\n> \n```\n\n酷酷。控制台是排查在 Apple Safari 上运行的 HTML 页面中 JavaScript 代码问题的很好工具。\n\
    \n![](img/image00137.jpeg)\n\nApple Safari 中的 JavaScript 控制台\n\nJavaScript 教程\
    \ - Herong 的教程示例\n\n∟支持 JavaScript 的 Web 浏览器\n\n∟ IE (Internet Explorer) 中的 JavaScript\
    \ 控制台\n\n本节提供了教程示例，介绍如何使用 IE (Internet Explorer) 中的 JavaScript 控制台来查看 JavaScript\
    \ 执行产生的错误和日志消息。你也可以使用它来运行任何 JavaScript 语句以与 HTML 文档进行交互。\n\n## 什么是 IE (Internet\
    \ Explorer) 中的 JavaScript 控制台？\n\nIE 中的 JavaScript 控制台是浏览器为你提供的一个控制台：\n\n* 查看浏览器在执行嵌入\
    \ JavaScript 代码时生成的任何错误或日志消息。\n* 运行任何 JavaScript 代码以交互式的方式与 Web 文交互。\n\n以下是我测试\
    \ IE 中 JavaScript 控制台的操作：\n\n1. 运行 IE 并加载以下 HTML 代码：\n\n```html\n <html>\n<head><title>Hello\
    \ World!</title></head>\n<body>\n<script type=\"text/javascript\">\n   document.write('Hello\
    \ World! - Document');\n   console.log('Hello World! - Console');\n</script>\n\
    </body>\n</html>\n```\n\n2. 按 F12 键。我看到屏幕上显示了开发者窗口。\n\n3. 点击开发者窗口上的“Console”选项卡。我看到了控制台日志消息：“Hello\
    \ World! - Console”。\n\n4. 在控制台中输入一些 JavaScript 语句并运行：\n\n```\n >> var msg = document.title;\n\
    < undefined\n>> console.log(msg.length);\n  12\n< undefined\n> \n```\n\n酷酷。控制台是排查在\
    \ IE 上运行的 HTML 页面中 JavaScript 代码问题的很好工具。\n\n![](img/image00138.jpeg)\n\nIE (Internet\
    \ Explorer) 中的 JavaScript 控制台\n\nJavaScript 教程 - Herong 的教程示例\n\n∟服务端和客户端 Web\
    \ 脚本\n\n本章提供了关于服务端和客户端 Web 脚本的介绍和教程示例。主题包括：Web 脚本处理架构概述；服务端和客户端脚本的处理步骤；事件处理脚本；脚本代码返回新的脚本代码。\n\
    \n> Web 脚本架构概览\n> 服务端脚本概述\n> 用于文档更新的客户端脚本\n> 用于事件处理的客户端脚本\n> 经过多次处理的客户端脚本\n> 由两个原始脚本产生的新脚本\n\
    \n结论：\n\n* Web 应用程序可以在三个领域使用脚本：服务端脚本、用于页面文档构建的客户端脚本，以及用于浏览器事件处理的客户端脚本。\n* 在页面文档构建过程中使用\
    \ JavaScript 时，浏览器将多轮扫描并执行脚本。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟服务端和客户端 Web\
    \ 脚本\n\n## Web 脚本架构概览\n\n本节提供了典型的 Web 脚本处理流程架构概述，显示了服务端和客户端的脚本步骤。\n\n正如我们在之前的章节中看到的，JavaScript\
    \ 代码可以用于三个领域来帮助构建网站或基于 Web 的应用程序：\n\n* 服务端脚本 - 嵌入在 HTML 文档中的脚本，在发送到客户端（Web 浏览器）之前由\
    \ Web 服务器处理。服务端脚本通常用于与数据库或其他后端应用程序交互，并将动态数据引入 HTML 文档。\n* 用于页面文档构建的客户端脚本 - 嵌入在\
    \ HTML 文档中的脚本，在浏览器窗口上渲染页面文档之前由 Web 浏览器处理。\n* 用于浏览器事件处理的客户端脚本 - 嵌入在 HTML 文档中的脚本，当用户与浏览器窗口交互时由\
    \ Web 浏览器处理。\n\n下面的图显示了服务端脚本和客户端脚本如何共同工作，在典型的 Web 应用程序流程架构中执行不同的功能：\n\n![](img/image00139.jpeg)\n\
    \nWeb 脚本流程架构\n\n图中使用的红线表示可以使用 JavaScript 的地方。此 Web 脚本流程架构图的不同部分将在稍后进行解释。\n\nJavaScript\
    \ 教程 - Herong 的教程示例\n\n∟服务端和客户端 Web 脚本\n\n## 服务端脚本概述\n\n本节提供了 Web 服务端脚本处理流程的概述。Web\
    \ 服务器会移除脚本代码并执行它。\n\n服务端脚本发生在下方所示的第 4 步：\n\n![](img/image00140.jpeg)\n\n服务端脚本流程\n\
    \n步骤 1：用户输入新的 Web 页面地址或点击需要从 Web 服务器获取新 Web 页面的链接。\n步骤 2：Web 浏览器连接到 Web 服务器并发送带有请求\
    \ Web 页面路径名的 `HTTP GET` 命令。\n步骤 3： Web 服务器获取请求页面的 HTML 文档，或请求应用程序服务器生成 HTML 文档。\n\
    步骤 4：服务端脚本步骤：Web 服务器扫描 HTML 文档查找其中嵌入的任何服务端脚本代码。Web 服务器将移除嵌入的脚本代码并执行它。\n\n当 Web\
    \ 服务器执行嵌入的脚本代码时，它将提供许多代表主机环境的主机对象。通过这些主机对象，服务端脚本可以轻松访问载的 HTML 文档、服务器文件系统、任何数据库以及网络计算机。\n\
    \n通常，服务端脚本代码将根据其计算产生的动态数据更新载的 HTML 文档。\n\n在服务端脚本处理步骤结束时，更新后的 HTML 文档准备好发送回客户端——Web\
    \ 浏览器。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟服务端和客户端 Web 脚本\n\n## 用于文档更新的客户端脚本\n\
    \n本节提供了客户端脚本的概述。某些脚本被执行以更新页面文档的最终渲染。某些脚本被注册为事件处理程序以便稍后执行。\n\n用于页面文档更新的服务端脚本发生在下方所示的第\
    \ 6 步和 7a 步：\n\n![](img/image00141.jpeg)\n\n用于文档更新的客户端脚本\n\n步骤 5：Web 服务器将最终的 HTML\
    \ 文档发送给 Web 浏览器。\n\n"
- fmt: "\n## Step 6: The Client-side scripting step\nThe Web browser scans the HTML\
    \ document for any client-side script code embedded in the document. The Web browser\
    \ will remove the embedded script code and execute it. When the Web browser executes\
    \ the embedded script code, it will provide many host objects representing the\
    \ client host environment. Through those host objects, client-side script code\
    \ can access the carrying HTML document and the browser windows. Client-side script\
    \ code can not access the filesystem or anything outside the Web browser on the\
    \ client machine for security reasons.\n\n### Step 7a\nSome client-side scripts\
    \ will update the page document object before it is rendered on the browser window.\n\
    \n### Step 7b\nSome client-side scripts will be registered as handlers for various\
    \ events to be triggered on the browser window and it page UI controls. Those\
    \ scripts will not be executed until their events are triggered by the end user.\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Server-Side\
    \ and Client-Side Web Scripting](#part0066.xhtml)\n\n∟Client-Side Scripts for\
    \ Event Handling\n\nThis section provides an overview of client-side scripting\
    \ for event handling. Scripts registered as event handlers will be executed when\
    \ events are triggered by the end user on the final Web page.\n\nServer-side scripting\
    \ for windows event handling happens in step 7b and 10 as shown in the diagram\
    \ below:\n\n![](Images/image00142.jpeg)\n\n### Client-Side Scripts for Event Handling\n\
    \n### Step 7b\nSome client-side scripts will be registered as handlers for various\
    \ events to be triggered on the browser window and it page UI controls. Those\
    \ scripts will not be executed until their events are triggered by the end user.\n\
    \n### Step 8\nThe page document object updated by some client-side scripts is\
    \ rendered by the Web browser on the browser window showing the final Web page\
    \ the user.\n\n### Step 9\nThe user enters some input or clicks some UI control\
    \ on the Web page. An event or multiple events will be triggered.\n\n### Step\
    \ 10\nThe Web browser executes the client-side script registered as the handler\
    \ of the triggered event. The Web browser will provide many host objects representing\
    \ the client host environment. Through those host objects, the event handler script\
    \ can access the page document and the browser windows. Client-side script code\
    \ can not access the filesystem or anything outside the Web browser on the client\
    \ machine for security reasons.\n\n### Step 7a\nSome event handler scripts will\
    \ update the page document object rendered on the browser window.\n\n### Step\
    \ 11\nSome event handler scripts will force the Web browser to request a new Web\
    \ page.\n\n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Server-Side and Client-Side Web Scripting](#part0066.xhtml)\n\n∟Client-Side\
    \ Scripting Processed Multiple Times\n\nThis section provides a tutorial example\
    \ of a JavaScript code inserts another JavaScript code back into the HTML document.\
    \ The Web browser executes script code multiple times.\n\nAs we learned earlier,\
    \ when the Web browser receives the HTML document from the Web server, it will\
    \ remove all embedded script codes and execute them.\n\nWhat happens if a new\
    \ script code is inserted back into the HTML document during the first round of\
    \ script execution? The Web browser will remove the inserted script code and execute\
    \ it again.\n\nHere is an interesting tutorial example of a JavaScript code that\
    \ inserts another JavaScript code into the HTML document:\n\n```javascript\n <html>\n\
    <!-- Hello_Nested_Scripts.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
    -->\n<head><title>Hello from Nested Scripts</title></head>\n<body><pre>\n<script\
    \ type=\"text/javascript\">\n   document.writeln(\"Hello World!\");\n   document.writeln(\"\
    <script type=\\\"text/javascript\\\">\");\n   document.writeln(\"document.writeln(\\\
    \" Hello World!\\\");\");\n   document.writeln(\"<\\/script>\");\n</script>\n\
    </pre></body>\n</html>\n```\n\nTake a guess on what you will see on the browser\
    \ window if you run this HTML document.\n\n```\n Hello World!\n Hello World!\n\
    ```\n\nWhat happens is that when the browser finishes the execution of the embedded\
    \ JavaScript code, it will get the following the HTML document:\n\n```html\n Hello\
    \ World!\n<script type=\"text/javascript\">\ndocument.writeln(\" Hello World!\"\
    );\n</script>\n```\n\nThere is another JavaScript code in the output. The browser\
    \ will execute it again resulting the final HTML document you saw earlier.\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Server-Side\
    \ and Client-Side Web Scripting](#part0066.xhtml)\n\n∟New Script Resulted from\
    \ Two Original Scripts\n\nThis section provides a tutorial example showing how\
    \ the Web browser fails to execute the JavaScript code resulted from two original\
    \ JavaScript codes.\n\nActually, the Web browser processes new script code correctly\
    \ only if it is resulted from a single execution.\n\nHere is HTML document with\
    \ two JavaScript codes that works together to return a new JavaScript code:\n\n\
    ```html\n <html>\n<!-- Hello_Nested_Script_Error.html\n   Copyright (c) HerongYang.com.\
    \ All Rights Reserved.\n-->\n<head><title>Hello from Nested Script Error</title></head>\n\
    <body><pre>\n<script type=\"text/javascript\">\n   document.writeln(\"-- Before\
    \ the new script.\");\n   document.writeln(\"<script type=\\\"text/javascript\\\
    \">\");\n</script>\ndocument.writeln(\\\"Hello World!\\\");\n<script type=\"text/javascript\"\
    >\n   document.writeln(\"<\\/script>\");\n   document.writeln(\"-- After the new\
    \ script.\");\n</script>\n</pre></body>\n</html>\n```\n\nAfter the first round\
    \ of JavaScript execution, the HTML document would have a new JavaScript code\
    \ like this:\n\n```\n -- Before the new script.\n<script type=\"text/javascript\"\
    >\ndocument.writeln(\\\"Hello World!\\\");\n</script>\n-- After the new script.\n\
    ```\n\nIf the Web browser executes the new JavaScript code again correctly, the\
    \ final HTML document would look like this:\n\n```\n -- Before the new script.\n\
    Hello World!\n-- After the new script.\n```\n\nBut both Internet Explorer and\
    \ Firefox give the following result:\n\n```\n -- Before the new script.\n```\n\
    \nConclusion: if a new script code is returned from two original script codes,\
    \ the Web browser will fail to execute it correctly.\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟Introduction to Objects\n\
    \nThis chapter provides introductions and tutorial examples on the 'Object' data\
    \ type in JavaScript. Topics include creating 'Object' objects; adding and retrieving\
    \ properties; adding and running methods; named and indexed properties; comparing\
    \ arrays with objects.\n\n> [What Is an Object?](#part0074.xhtml)\n> [Objects\
    \ of \"Object\" Data Type](#part0075.xhtml)\n> [Adding and Deleting Object Properties](#part0076.xhtml)\n\
    > [Adding and Deleting Object Methods](#part0077.xhtml)\n> [Using \"this\" Keyword\
    \ to Represent Current Object](#part0078.xhtml)\n> [Object Literals of the \"\
    Object\" Type](#part0079.xhtml)\n> [Objects and Associate Arrays](#part0080.xhtml)\n\
    > [Objects with Indexed Properties](#part0081.xhtml)\n> [Differences between \"\
    Object\" and \"Array\"](#part0082.xhtml)\n> [Using \"Array\" Objects as \"Object\"\
    \ Objects](#part0083.xhtml)\n\nConclusion:\n\n* An object is an instance of a\
    \ special data type called \"Object\" or any \"prototype\" data type.\n* \"Object\"\
    \ data type is root \"prototype\" of all \"prototype\" data types.\n* A new object\
    \ can be created using an object literal: `{n:v, ...}`.\n* A new object can be\
    \ created using the `Object` constructor: `New Object()`.\n* An object's property\
    \ or method can be accessed using the dot `.` operation.\n* An object's property\
    \ or method can be deleted using the dot `delete` operation.\n* When defining\
    \ the method body of an object, can you use the `this` keyword to refer to the\
    \ object.\n* An object's property can be accessed as an element of an associated\
    \ array.\n* An object can have indexed properties, similar to an array.\n* An\
    \ array is an object.\n"
