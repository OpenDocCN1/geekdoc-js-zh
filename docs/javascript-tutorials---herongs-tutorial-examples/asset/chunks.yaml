    \ + \"\\\" by \" + this.author;\n}\n\nmyBook.title Type: string\nmyBook['date']\
    \ Type: number\nmyBook.toString Type: function\n```\n\nThe output also shows that\
    \ as an object property, the value of a method is the function definition.\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction\
    \ to Objects](#part0073.xhtml)\n\n∟Objects with Indexed Properties\n\nThis section\
    \ provides a quick description of indexed properties and indexed methods. A tutorial\
    \ example is provided on how to create and access indexed properties and indexed\
    \ methods.\n\nJavaScript also supports objects with indexed properties with the\
    \ following features:\n\n*   An indexed property is a property with an index number\
    \ instead of a property name.\n\n*   An indexed property can not be accessed with\
    \ the dot (.) operator.\n\n*   An indexed property can be accessed with the associate\
    \ array operator (['index']).\n\n*   An indexed property can also be accessed\
    \ with the array operator ([index]).\n\n*   An indexed property can be assigned\
    \ with a function to become an indexed method.\n\nHere is a tutorial example on\
    \ how to define and access object's indexed properties and indexed methods in\
    \ two formats: array format and associate array format:\n\n```\n <html>\n<!--\
    \ Object_Indexed_Properties.html\n   Copyright (c) HerongYang.com. All Rights\
    \ Reserved.\n-->\n<head>\n<title>Objects with Indexed Properties</title>\n</head>\n\
    <body>\n<pre>\n<script type=\"text/javascript\">\n// Using \"this\" to get the\
    \ properties\nfunction myToString() {\n   return '\"'+this.title + '\" by '+this.author;\n\
    }\n\n   // Using object literal format\n   var myBook = {\n      author: \"Herong\
    \ Yang\",\n      title: \"JavaScript Tutorials\",\n      3: 2008,\n      price:\
    \ \"Free\",\n      4: myToString\n   };\n\n   // Adding a new indexed property\
    \   \n   myBook[9] = \"Programming\";\n\n   // An index property can not be accessed\
    \ with (.)\n   // document.writeln(\"myBook.3: \"+myBook.3);\n\n   // Getting\
    \ indexed property values\n   document.writeln(\"myBook[3]: \"+myBook[3]);\n \
    \  document.writeln(\"myBook['3']: \"+myBook['3']);\n   document.writeln(\"myBook[4]:\
    \ \"+myBook[4]);\n   document.writeln(\"myBook[9]: \"+myBook[9]);\n\n   // Checking\
    \ property data types\n   document.writeln();\n   document.writeln(myBook[4]());\n\
    </script>\n</pre>\n</body>\n</html>\n```\n\nThe output of this tutorial example\
    \ matches my expectation:\n\n```\n myBook[3]: 2008\nmyBook['3']: 2008\nmyBook[4]:\
    \ function myToString() {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n\
    }\nmyBook[9]: Programming\n\n\"JavaScript Tutorials\" by Herong Yang\n```\n\n\
    [JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction\
    \ to Objects](#part0073.xhtml)\n\n∟Differences between \"Object\" and \"Array\"\
    \n\nThis section provides a quick description of similarities and differences\
    \ of 'Array' and 'Object'. A tutorial example is provided on how to compare an\
    \ 'Array' object to an 'Object' object.\n\nJavaScript supports a number of predefined\
    \ core object types. Among them, \"Object\" and \"Array\" have very close relations.\
    \ If you compare \"Array\" with \"Object\", you should see the following similarities\
    \ and differences:\n\n*   \"Array\" is subclass, or sub-prototype, of \"Object\"\
    . So \"Array\" inherits all features from \"Object\".\n\n*   \"Array\" is not\
    \ a new data type. \"Array\" and \"Object\" are sharing the same data type \"\
    object\".\n\n*   The \"typeof\" operator on an \"Array\" object returns \"object\"\
    .\n\n*   The \"instanceof\" operator on an \"Array\" object matches \"Array\"\
    . It also matches \"Object\", because \"Array\" is a subclass of \"Object\".\n\
    \n*   An object of \"Object\" can have indexed properties using the same syntax\
    \ as \"Array\" objects.\n\n*   An object of \"Object\" is not an object of \"\
    Array\".\n\n*   An object of \"Array\" is also an object of \"Object\".\n\nHere\
    \ is a JavaScript tutorial example that shows how \"Array\" and \"Object\" are\
    \ similar to each other:\n\n```\n <html>\n<!-- Object_and_Array.html\n   Copyright\
    \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Comparing Object\
    \ and Array</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
    >\n\n   // Creating an object of \"Array\" - array literal\n   var bookArray =\
    \ [\n      \"JavaScript Tutorial\", \n      \"Herong Yang\", \n      2008, \n\
    \      \"Programming\"\n   ];\n\n   // Creating an object of \"Object\" - object\
    \ literal\n   var bookObject = {\n      title: \"JavaScript Tutorial\", \n   \
    \   author: \"Herong Yang\", \n      year: 2008, \n      category: \"Programming\"\
    \n   };\n\n   // Checking \"bookArray\"\n   document.writeln();\n   document.writeln(\"\
    About the \\\"Array\\\" object:\");\n   document.writeln(\"   Type: \"+(typeof\
    \ bookArray));\n   document.writeln(\"   Instance Of Object: \"\n      +(bookArray\
    \ instanceof Object));\n   document.writeln(\"   Instance Of Array: \"\n     \
    \ +(bookArray instanceof Array));\n   document.writeln(\"   Members:\");\n   for\
    \ (var item in bookArray) {\n      document.writeln(\"      \"+item+\": \"+bookArray[item]);\n\
    \   }\n\n   // Checking \"bookObject\"\n   document.writeln();\n   document.writeln(\"\
    About the \\\"Object\\\" object:\");\n   document.writeln(\"   Type: \"+(typeof\
    \ bookObject));\n   document.writeln(\"   Instance Of Object: \"\n      +(bookObject\
    \ instanceof Object));\n   document.writeln(\"   Instance Of Array: \"\n     \
    \ +(bookObject instanceof Array));\n   document.writeln(\"   Members:\");\n  \
    \ for (var item in bookObject) {\n      document.writeln(\"      \"+item+\": \"\
    +bookObject[item]);\n   }\n</script>\n</pre>\n</body>\n</html>\n```\n\nThe output\
    \ of this tutorial example shows that how an \"Array\" object is similar to an\
    \ \"Object\" object:\n\n```\n About the \"Array\" object:\n   Type: object\n \
    \  Instance Of Object: true\n   Instance Of Array: true\n   Members:\n      0:\
    \ JavaScript Tutorial\n      1: Herong Yang\n      2: 2008\n      3: Programming\n\
    \nAbout the \"Object\" object:\n   Type: object\n   Instance Of Object: true\n\
    \   Instance Of Array: false\n   Members:\n      title: JavaScript Tutorial\n\
    \      author: Herong Yang\n      year: 2008\n      category: Programming\n```\n\
    \n[JavaScript Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction\
    \ to Objects](#part0073.xhtml)\n\n∟Using \"Array\" Objects as \"Object\" Objects\n\
