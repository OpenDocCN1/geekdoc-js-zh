    \n## W3C 文档对象模型 (DOM) 规范\n\n## 在新窗口中导出文档 - JavaScript 源码\n\n本节提供了一个 JavaScript\
    \ 教程示例，使用 DOM API 属性和方法将浏览器内置的 `document` 对象作为 XML 消息导出到新浏览器窗口。\n\n为了总结我目前学到的关于\
    \ DOM API 规范的知识，我写了一个 JavaScript 页面 `DOM_HTML_Document_Dump.html` 来用 DOM 属性和方法导出浏览器内置的\
    \ \"document\" 对象：\n\n```\n <html>\n<head>\n<!-- DOM_HTML_Document_Dump.html\n\
    \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<title>在新窗口中导出 HTML\
    \ 文档</title>\n<script type=\"text/javascript\">\nfunction nodeToXML(node, indentation,\
    \ out) {\n   out += indentation+\"<\"+node.nodeName.toLowerCase();\n   if (node.attributes!=null)\
    \ {\n      for (var i=0; i<node.attributes.length; i++) {\n         var item =\
    \ node.attributes.item(i);\n         var value = item.nodeValue;\n         if\
    \ (value==null) value = \"\";\n         out += \" \"+item.nodeName+\"=\\\"\"+value+\"\
    \\\"\";\n      }\n   }\n   out += \">\\n\";\n   for (var i=0; i<node.childNodes.length;\
    \ i++) {\n      var item = node.childNodes.item(i);\n      out = nodeToXML(item,\
    \ indentation+\"   \", out);\n   }\n   if (node.nodeValue!=null) \n      out +=\
    \ indentation+\"   \"+node.nodeValue+\"\\n\";\n   out += indentation+\"</\"+node.nodeName.toLowerCase()+\"\
    >\\n\";\n   return out;\n}\nfunction show() {\n   var w = window.open('', 'Popup',\
    \ '');\n   w.document.write('<html><head><title>Document Dump</title>');\n   w.document.write('</head><body><pre>');\n\
    \n   var s = nodeToXML(document, '', '');\n   s = s.replace(new RegExp('&','g'),'&amp;');\n\
    \   s = s.replace(new RegExp('<','g'),'&lt;');\n   s = s.replace(new RegExp('>','g'),'&gt;');\n\
    \   w.document.write(s);\n   w.document.write('</pre></body></html>');\n   w.document.close();\n\
    }\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\n   document.write('<p>点击在新窗口中显示文档：</p>');\n\
    </script>\n<form>\n<input type=\"button\" value=\"Show\" onClick=\"show();\"/>\n\
    </form>\n</body>\n</html>\n```\n\n这段 JavaScript 的思路非常简单：\n\n*   使用递归函数 `nodeToXML()`\
    \ 遍历文档树。\n*   对于每个节点，将其作为 XML 元素导出。节点名称变为元素名称。节点属性变为元素属性。节点子列表变为元素子列表。节点值变为元素内容。\n\
    *   导出的 XML 字符串随后在新窗口中显示。\n\n阅读后续章节查看某些流行 浏览器的结果。\n\n# JavaScript 教程 - Herong\
    \ 的教程示例\n\n## W3C 文档对象模型 (DOM) 规范\n\n## 在新窗口中导出文档 - 浏览器结果\n\n本节提供了教程示例的 Web 浏览器测试结果，该示例使用\
    \ DOM API 属性和方法将浏览器内置的 `document` 对象作为 XML 消息导出到新浏览器窗口。\n\n如果你在 Chrome、Firefox\
    \ 和 IE (Internet Explorer) Web 浏览器中运行 JavaScript 页面 `DOM_HTML_Document_Dump.html`，你将在新窗口中获得\
    \ \"document\" XML 导出结果：\n\n"
