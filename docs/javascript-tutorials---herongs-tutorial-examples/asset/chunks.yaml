    \ - An object type used to create number objects. Boolean object type allows you\
    \ to handle number primitive values as objects.\n\n*   BigInt - An object type\
    \ used to create integers that are bigger than 2^(53) - 1.\n\n*   Math - A special\
    \ object type used to create one and only one object to hold mathematics related\
    \ properties and functions.\n\n*   Date - An object type used to create date and\
    \ time objects.\n\n*   String - An object type used to create string objects.\
    \ String object type allows you to handle string primitive values as objects.\n\
    \n*   RegExp - An object type used to create regular expression objects for text\
    \ processing.\n\n*   Array, Int8Array, Uint8Array, Uint8ClampedArray, Int16Array,\
    \ Uint16Array, Int32Array, Uint32Array, Float32Array, Float64Array, BigInt64Array,\
    \ BigUint64Array - An object type used to create arrays. All arrays are objects\
    \ of the Array object type.\n\n*   Map - An object type used to hold key-value\
    \ pairs and remembers the original insertion order of the keys. Any value (both\
    \ objects and primitive values) may be used as either a key or a value.\n\n* \
    \  Set - An object type used to store unique values of any type, whether primitive\
    \ values or object references.\n\n*   ArrayBuffer, SharedArrayBuffer, Atomics,\
    \ DataView - An object type used to represent a generic, fixed-length raw binary\
    \ data buffer.\n\n*   JSON - An object type used to hold methods for parsing JavaScript\
    \ Object Notation (JSON) and converting values to JSON.\n\n*   Promise - An object\
    \ type used to represent the eventual completion (or failure) of an asynchronous\
    \ operation, and its resulting value.\n\n*   Generator, GeneratorFunction - An\
    \ object type used for objects returned by generator functions.\n\n*   AsyncFunction\
    \ - An object type to create a new async function object. In JavaScript, every\
    \ asynchronous function is actually an AsyncFunction object.\n\n*   Reflect -\
    \ An object type that provides methods for interceptable JavaScript operations.\
    \ The methods are the same as those of proxy handlers. Reflect is not a function\
    \ object, so it's not constructible.\n\n*   Proxy - An object type used to define\
    \ custom behavior for fundamental operations (e.g., property lookup, assignment,\
    \ enumeration, function invocation, etc.)\n\nSee next sections for quick introductions\
    \ of some built-in object types defined above.\n\n[JavaScript Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to Built-in Object Types](#part0118.xhtml)\n\
    \n∟The \"Object\" Object Type - The Root Object Type\n\nThis section provides\
    \ a quick description and a tutorial example script of the 'Object' built-in object\
    \ type, which is the root or base object type of all other object types.\n\nThe\
    \ \"Object\" object type is probably the most important built-in object type.\
    \ It has the following main features:\n\n*   \"Object\" is the root (or base)\
    \ object type in the object type tree. All other object types are inherited from\
    \ the Object object type.\n\n*   \"Object\" objects can be created with the Object()\
    \ constructor function.\n\n*   \"Object\" objects can also be created with an\
    \ object literal: {property: value, ...}.\n\nHere is a tutorial sample script\
    \ showing you some of those features:"
