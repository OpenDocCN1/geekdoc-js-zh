    \   June 2008\nJavaScript 1.7   October 2006\nJavaScript 1.6   November 2005\n\
    JavaScript 1.5   November 2000 - ECMA-262 3rd edition\nJavaScript 1.4\t \nJavaScript\
    \ 1.3\t October 1998 - ECMA-262 1st + 2nd \nJavaScript 1.2\t June 1997\nJavaScript\
    \ 1.1\t August 1996\nJavaScript 1.0   March 1996\n```\n\nAs a programming language,\
    \ JavaScript has the following unique features:\n\n* JavaScript is a scripting\
    \ language - Source code is interpreted, instead of compiled and executed. Like\
    \ most other interpreted languages, it does support the `eval(source_code)` function.\n\
    \n* JavaScript is a dynamic typing language - Data types are associated with values,\
    \ instead of variables. In other words, variables are declared without specific\
    \ data types. They can be assigned with values of any data type.\n\n* JavaScript\
    \ is a prototype-based language - Prototypes, instead of classes, are used for\
    \ defining object properties, methods, and inheritance.\n\n* JavaScript uses associative\
    \ arrays to represent objects - Property names and values are stored as associative\
    \ array elements. Properties and their values can be added, changed, or deleted\
    \ at run-time.\n\n* JavaScript supports functions as first-class functions - Functions\
    \ are really objects. Like regular objects, functions can be created during execution,\
    \ stored in data structure, and passed to other functions as arguments.\n\nAs\
    \ of 2020, the latest version of the JavaScript is 1.8.5.\n\n[JavaScript Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to JavaScript](#part0003.xhtml)\n\
    \n∟First JavaScript - \"Hello World!\"\n\nThis section provides the first JavaScript\
    \ tutorial example - 'Hello World!'.\n\nThe best way to learn JavaScript is to\
    \ embed the JavaScript code in an HTML document and run it in a Web browser. Here\
    \ is what I did to write and run my first JavaScript code - \"Hello World!\".\n\
    \n1. Enter the following HTML document with one line of JavaScript:\n\n```\n <html>\n\
    <head><title>Hello World!</title></head>\n<body>\n<script type=\"text/javascript\"\
    >\n   document.write('Hello World!');\n</script>\n</body>\n</html>\n```\n\n2.\
    \ Save this HTML document as `Hello_World.html`.\n\n3. Open `Hello_World.html`\
    \ in Web browser. You will see:\n\n```\n Hello World! \n```\n\nCongratulations,\
    \ you have created and executed your first JavaScript successfully!\n\n[JavaScript\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Introduction to\
    \ JavaScript](#part0003.xhtml)\n\n∟Walking through the First JavaScript\n\nThis\
    \ section provides a walkthrough of the first JavaScript - 'Hello World!'.\n\n\
    Now let me walkthrough the first JavaScript code, \"Hello World!\", provided in\
    \ the previous tutorial:\n\n```\n 1 <html>\n2 <head><title>Hello World!</title></head>\n\
    3 <body>\n4 <script type=\"text/javascript\">\n5    document.write('Hello World!');\n\
    6 </script>\n7 </body>\n8 </html>\n```\n\nThe first 3 lines are normal HTML tags.\n\
    \nLine 4 has a special HTML tag `<script>` that starts a section of JavaScript\
    \ code. Notice that the `type=\"text/javascript\"` attribute indicates that the\
