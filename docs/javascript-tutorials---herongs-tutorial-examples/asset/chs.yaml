  \n最新版本的 JavaScript 规范是 `ECMA-262 Edition 10`。因此，我们应该将其作为主要的参考来学习 JavaScript。\n\n\
  JavaScript 教程 - Herong 的教程示例\n\n∟ECMAScript 语言规范和 JavaScript 方言\n\n## ECMAScript\
  \ 语言规范\n\n本节快速介绍了 ECMAScript 语言规范及其版本历史。\n\nECMAScript 语言规范由 `ECMA`（欧洲计算机制造商协会）开发和维护。它定义了一种基于几种源自技术的脚本语言标准，其中最为人知的是\
  \ `JavaScript`（Netscape）和 `JScript`（Microsoft）。\n\n### ECMAScript 版本历史：\n\n```\n\
  \ 1997   ECMA-262 Edition 1 - 第一版\n1998   ECMA-262 Edition 2 - 仅编辑更改\n1999   ECMA-262\
  \ Edition 3 - 添加了许多新功能\n   ?   ECMA-262 Edition 4 - 废弃\n2009   ECMA-262 Edition\
  \ 5 - 添加了“严格模式”\n2011   ECMA-262 Edition 5.1 - 与 ISO/IEC 16262:2011 标准\n2018   ECMA-262\
  \ Edition 9\n2019   ECMA-262 Edition 10\n```\n\nECMA 当前对 ECMAScript 的定义：`ECMAScript`\
  \ 是一种面向对象的编程语言，用于在主机环境中执行计算和操作计算对象。\n\n关于 ECMAScript 规范，一个非常重要的说明是，它没有提供任何与主机环境交互的设施。换句话说，仅用规范描述的规则和对象编写的纯\
  \ `ECMAScript` 代码只能在内存中进行计算和操作对象。它无法与主机环境交换数据。\n\n为了与主机环境交换数据，每种 ECMAScript 方言都必须扩展规范，以添加与主机环境交互的新设施。\n\
  \n例如，专为 `Firefox` 浏览器主机环境设计的 ECMAScript `JavaScript` 方言添加了 `\"document\"` 对象及其属性和方法，提供了对浏览器当前文档的访问。\n\
  \n另一个例子，为 Internet 信息服务器 (`IIS`) Web 服务器主机环境设计的 ECMAScript `JScript` 方言添加了 `\"request\"\
  ` 对象及其属性和方法，提供了对服务器当前 HTTP 请求的访问。\n\n如果你想获取 `ECMA-262` (`ECMAScript 语言规范`）第 9 版，请访问\
  \ [`www.ecma-international.org/publications/standards/Ecma-262.htm`](http://www.ecma-international.org/publications/standards/Ecma-262.htm)。\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n∟ECMAScript 语言规范和 JavaScript 方言\n\n## ECMAScript\
  \ 语言规范 自动分号插入\n\n本节详细介绍了 JavaScript 自动分号插入的规则。\n\nECMAScript 自动分号插入规则允许在解析代码时自动添加分号，这使得开发者在编写代码时可以省略分号。\n\
  \n这种规则是基于 JavaScript 语法规则（ASI, Automatic Semicolon Insertion）的。解析器在扫描代码时，如果发现缺少分号，它会根据特定的规则尝试插入一个分号。\n\
  \n以下是自动分号插入的常见场景：\n\n```javascript\nfunction foo() {\n  return\n  {\n    a: 1\n\
  \  };\n}\n```\n\n在上面的例子中，`return` 后面会被插入一个分号，导致函数返回 `undefined`，而不是后面的对象。为了修复这个问题，应该写成：\n\
  \n```javascript\nfunction foo() {\n  return {\n    a: 1\n  };\n}\n```\n\n同样地，在 `if`\
  \ 语句、`for` 循环或 `return` 语句中，如果紧跟大括号，可能会由于自动插入分号导致非预期的错误。\n\n例如：\n\n```javascript\n\
  var a = 1\nvar b =\na\n{\n  console.log(b)\n}\n```\n\n```javascript\nvar a = 1\n\
  var b = a\n{\n  console.log(b) // 输出 1\n}\n```\n\n在第二个例子中，`b = a` 后面没有插入分号，因此 `b`\
  \ 被赋值为 `a`，而后面的 `{...}` 则被视为代码块。\n\n为了避免这些问题，建议在编写 JavaScript 代码时始终显式地使用分号。\n\n\n\
  \n\nJavaScript 是一种动态类型语言。数据类型与值相关，而不是与变量相关。换句话说，声明变量不需要指定特定的数据类型。它们被赋值任何类型的值。\n\n\
  在 JavaScript 源代码中，可以像下面描述的那样以字面量的形式提供不同类型的值。\n\nJavaScript 教程 - Herong 的教程示例\n\n\
  数据类型、变量和表达式\n\n#### 数值字面量\n本节提供了对数值字面量的描述，以及一个关于如何在 JavaScript 代码中使用它们的教程示例。为了在\
  \ JavaScript 源代码中提供数字值，你需要使用以下 3 种格式的数值字面量：\n\n#### 整数字面量\n跟在可选符号字符之后的数字序列，用于表示从\
  \ `-9007199254740991` 到 `9007199254740991` 之间的整数值。例如：`2008`、`-12`。\n\n#### 十进制字面量\n\
  跟在 `0x` 或 `0X` 之后的十六进制数字序列，表示正整数或浮点值。十六进制字面量也可以带有符号字符。例如：`0x07D8`、`-0x0C`、`0xffffffffffffffff`。\n\
  \n#### 浮点字面量\n实数的科学计数法，语法如下：`(sign)(digits).e(sign)(digits)`。例如：`4.1`、`0.333333`、`-1.5e10`、`4.1e-29`。\n\
  \n在 JavaScript 中，所有数字（包括整数）都以 IEEE754 标准规定的 64 位浮点格式存储。这里有一个 JavaScript 教程示例，展示了如何在\
  \ JavaScript 代码中使用不同类型的数字字面量：\n\n```html\n<html>\n<!-- Number_Literals.html\n  \
  \ Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Number Literals</title></head>\n\
  <<body>\n<pre>\n<script type=\"text/javascript\">\n\tdocument.write(2020);\n\tdocument.write('\\\
