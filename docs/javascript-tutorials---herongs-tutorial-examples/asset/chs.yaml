  \ - 提供如何获取 PDF、EPUB 或其他格式完整版书籍的信息。\n\n\n---\n\n# JavaScript 简介\n\n## 引言\n\n本章快速介绍了\
  \ JavaScript。主题包括什么是 JavaScript；在 HTML 文档中编写 JavaScript 代码；在浏览器中运行 JavaScript 代码；浏览器内置的\
  \ `document`。\n\n## 什么是 JavaScript\n\n本节对什么是 JavaScript 进行快速描述。\n\n**什么是 JavaScript？**\
  \ JavaScript 是一种主要用于编写动态 Web 页面的脚本语言。当用 JavaScript 编写的脚本嵌入 Web 页面时，它由客户端的 Web 浏览器执行。\n\
  \nJavaScript 的历史在 wikipedia.org 上有很好的总结：\n\nJavaScript 最初由 Netscape 的 Brendan Eich\
  \ 开发，最初名为 Mocha，后来称为 LiveScript，最后重命名为 JavaScript。从 LiveScript 到 JavaScript 的更名恰好与\
  \ Netscape 在其 Netscape Navigator Web 浏览器中增加了对 Java 技术的支持。JavaScript 早于 1995 年 12\
  \ 月在 Netscape 浏览器 2.0B3 版本中首次引入并部署。这一命名引起了困惑，给人一种该语言是 Java 衍生语言的印象，许多人将其视为 Netscape\
  \ 的营销手段，旨在赋予 JavaScript 当时热门 Web 编程语言的光誉。\n\n为了避免商标问题，微软将其语言的实现命名为 JScript。JScript\
  \ 在 1996 年 8 月发布的 Internet Explorer 3.0 版本中首次支持，并包含了符合 Y2K 的日期函数，与当时 JavaScript\
  \ 中基于 `java.util.Date` 的函数不同。\n\nNetscape 将 JavaScript 提交给国际电子组织进行标准化，产生了标准化版本 ECMAScript。\n\
  \n## 总结\n\n*   JavaScript 是一种主要用于编写动态 Web 页面的脚本语言。\n*   官方 JavaScript 规范称为“Standard\
  \ ECMA-262 - ECMAScript 2019 Language Specification”。\n*   学习 JavaScript 的最佳方法是将\
  \ JavaScript 代码嵌入 HTML 文档中并在浏览器中运行。\n*   `<script type=\"text/javascript\">` 是在\
  \ HTML 文档中嵌入 JavaScript 代码的标签。\n*   `document.write()` 是在 HTML 文档中生成动态内容的方法。\n\n\
  \n\n\n\n```\n JavaScript 1.8.5 July 2010 - ECMA-262 5th edition\nJavaScript 1.8\
  \   June 2008\nJavaScript 1.7   October 2006\nJavaScript 1.6   November 2005\nJavaScript\
  \ 1.5   November 2000 - ECMA-262 3rd edition\nJavaScript 1.4\t \nJavaScript 1.3\t\
  \ October 1998 - ECMA-262 1st + 2nd \nJavaScript 1.2\t June 1997\nJavaScript 1.1\t\
  \ August 1996\nJavaScript 1.0   March 1996\n```\n\n作为一种编程语言，JavaScript 具有以下独特特性：\n\
  \n* JavaScript 是一种脚本语言 - 源代码是被解释执行的，而不是编译执行。和其他大多数解释型语言一样，它确实支持 `eval(source_code)`\
  \ 函数。\n\n* JavaScript 是一种动态类型语言 - 数据类型与值关联，而不是与变量关联。换说，声明变量不需要指定特定的数据类型。它可以被赋予任何数据类型的值。\n\
  \n* JavaScript 是一种基于原型的语言 - 使用原型而不是类来定义对象的属性、方法和继承关系。\n\n* JavaScript 使用关联数组来表示对象\
  \ - 属性名和值以关联数组元素的形式存储。属性及其值可以在运行时被添加、修改或删除。\n\n* JavaScript 支持函数作为一等公民 - 函数实际上是对象。像普通对象一样，函数可以在执行期间创建、存储在数据结构中并作为参数传递给其他函数。\n\
  \n截至 2020 年，JavaScript 的最新版本是 1.8.5。\n\nJavaScript 教程 - Herong' 教程示例\n\n∟JavaScript\
  \ 简介\n\n∟第一个 JavaScript - \"Hello World!\"\n\n本节提供了第一个 JavaScript 教程示例 - 'Hello\
  \ World!'。\n\n学习 JavaScript 的最佳方法是将 JavaScript 代码嵌入到 HTML 文档并在 Web 浏览器中运行它。以下是我编写并运行第一个\
  \ JavaScript 代码 \"Hello World!\" 所采取的步骤：\n\n1. 输入以下包含一行 JavaScript 代码的 HTML 文档：\n\
  \n```\n <html>\n<head><title>Hello World!</title></head>\n<body>\n<script type=\"\
  text/javascript\">\n   document.write('Hello World!');\n</script>\n</body>\n</</html>\n\
  ```\n\n2. 将此 HTML 文档保存为 `Hello_World.html`。\n\n3. 在 Web 浏览器中打开 `Hello_World.html`。你将看到：\n\
  \n```\n Hello World! \n```\n\n恭喜你，你成功创建并执行了你的第一个 JavaScript 代码！\n\nJavaScript 教程\
  \ - Herong' 教程示例\n\n∟JavaScript 简介\n\n∟逐步解析第一个 JavaScript\n\n本节对第一个 JavaScript 'Hello\
  \ World!' 进行逐步解析。\n\n现在让我逐步解析上一个教程中提供的第一个 JavaScript 代码 \"Hello World!\"：\n\n```\n\
  \ 1 <html>\n2 <head><title>Hello World!</title></head>\n3 <body>\n4 <script type=\"\
  text/javascript\">\n5    document.write('Hello World!');\n6 </script>\n7 </body>\n\
  8 </html>\n```\n\n前 3 行是普通的 HTML 标签。\n\n第 4 行有一个特殊的 HTML 标签 `<script>`，它开始了一段 JavaScript\
  \ 代码。注意 `type=\"text/javascript\"` 属性表示标签中包含的是是 JavaScript 代码。\n\n第 5 行是该 HTML 文档中唯一的\
  \ JavaScript 语句，它调用了内置对象 `document` 的 `write()` 函数。此调用会将字符串 \"Hello World!\" 输出到\
  \ HTML 文档中。\n\n第 6 行结束了 JavaScript 代码。\n\n当 Web 浏览器处理此 HTML 文档时，它会解释 `<script>`\
  \ 标签内所有的 JavaScript 语句。\n\nJavaScript 教程 - Herong' 教程示例\n\n∟JavaScript 简介\n\n∟document.write()\
  \ 方法\n\n本节提供了 `document.write()` 方法的简要描述以及一个使用 `document.write()` 方法的简单教程示例。\n\n\
  从上一节的 JavaScript 示例可以看出，`document.write(string)` 方法是一个非常实用的方法。关于该方法的一些说明：\n\n* `document`\
  \ 是一个内置对象，代表嵌入 JavaScript 的 HTML 文档。\n\n* `write(string)` 是由 `document` 对象提供的方法。它将指定的字符串写入由\
  \ `document` 对象表示的 HTML 文档中。\n\n你可以使用 `document.write(string)` 方法向 HTML 文档写入任何内容，包括\
  \ HTML 标签。\n\n这是一个教程示例，展示了如何使用 `document.write()` 方法写入 HTML 文档的一大部分内容：\n\n```\n\
  \ <html>\n<!-- Document_Write.html\n   Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n-->\n<head><title>The document.write() Method</title></head>\n<body>\n\
  <script type=\"text/javascript\">\n   document.write('<center>');\n   document.write('Summer\
  \ summer oh so hot,<br/>');\n   document.write('Summer summer trapped in a pot.<br/>');\n\
  \   document.write('When I open the lid I let you out,<br/>');\n   document.write('You\
  \ make me so happy<br/>');\n   document.write('I want to shout!<br/>');\n   document.write('</center>');\n\
  </script>\n</body>\n</</html>\n```\n\n[JavaScript 教程 - Herong' 教程示例\n\n∟[ECMAScript\
  \ 语言规范与 JavaScript 方言]\n\n本章介绍了 ECMAScript 语言规范和 JavaScript 方言的介绍及教程示例。主题包括：JavaScript\
  \ 历史；方言版本：LiveScript, JavaScript, JScript, JScript .NET；与宿主环境的交互；自动分号插入。\n\n> JavaScript\
  \ 历史与版本\n\n> \n\n> ECMAScript 语言规范\n\n> \n\n> 自动插入分号以结束语句\n\n结论：\n\n* ECMAScript\
  \ (ECMA-262) 是 JavaScript 语言规范的官方名称。\n\n* JavaScript 最初在 Netscape 中实现，是 ECMAScript\
  \ 语言规范的源自方言。\n\n* JScript 是微软的 ECMAScript 语言规范方言。\n\n* ECMAScript 在自动插入分号以结束语句方面有非常有趣的规则。\n\
  \nJavaScript 教程 - Herong' 教程示例\n\n∟ECMAScript 语言规范与 JavaScript 方言\n\n∟[JavaScript\
  \ 历史与版本]\n\n本节对 JavaScript 语言规范标准、ECMAScript、JavaScript、LiveScript、JScript 以及版本历史进行了简要描述。\n\
  \nJavaScript 有一个规范和几种方言：\n\n* ECMAScript - JavaScript 语言规范的官方名称，ECMA-262 规范。\n\n\
  * JavaScript - ECMAScript 语言规范的源自方言。JavaScript 在 Netscape 中实现。\n\n* LiveScript -\
  \ JavaScript 的前身。LiveScript 在 Netscape 3.0 中重命名为 JavaScript。\n\n* JScript - 微软的\
  \ ECMAScript 语言规范方言。JScript 最初实现在 1996 年 8 月发布的 Internet Explorer 3.0 浏览器中。\n\n\
  * JScript .NET - 微软 .NET 框架下 JScript 的继任者。\n\n以下是 JavaScript 历史及其方言版本的简要总结：\n\n\n\
