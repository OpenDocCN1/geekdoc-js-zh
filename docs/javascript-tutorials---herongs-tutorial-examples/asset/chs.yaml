  \ ](##part0019.xhtml)\n\n## 什么是语句\n\n本节快速提供了不同类型语句的描述，以及一个关于如何编写表达式和其他语句的教程示例。\n\
  \n**什么是语句？** 语句是 JavaScript 中的基本执行单元。关于 JavaScript 语句的几点说明：\n\n- 语句必须以分号（`;`）结束。\n\
  - 换行不会结束语句。换句话说，一个语句可以写在多行，多个语句也可以写在同一行。\n- 语句可以由非常简单的表达式组成，例如单个字面量；也可以由包含赋值或或逗号运算符的复杂表达式组成。\n\
  - 大多数语句都有关键字，如 `var`、`if`、`while`、`break` 等。\n- 多个语句可以组合成格式为 `{s1; s2; ...; }` 的语句块。\n\
  - 在 `\"/* ... */\"` 或 `\"// ... (行尾)\"` 中的注释可以插入语句的任何位置。\n\n这是一个 JavaScript 教程示例，向你展示了不同类型的语句：\n\
  \n```html\n <html>\n<!-- Statements.html\n   Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n-->\n<head><title>Statements</title></head>\n<body>\n<pre>\n<script\
  \ type=\"text/javascript\">\n   var x,y,z; // 一个 \"var\" 语句\n\n   x=1, y=4, z=9;\
  \ /* 一个表达式语句 \n      包含 3 个逗号运算符和 3 个赋值运算符。\n      该表达式的结果是 9.*/ \n\n   x*x; y*y;\
  \ z*z; // 1 行中的 3 条语句\n\n   { // 一个语句块\n      x *= x; \n      y *= y;\n      z *=\
  \ z;\n   }\n\n   if (true) // 一个 \"if\" 语句 \n      document.write(\"7 statements\
  \ in total.\");\n</script>\n</pre>\n</body>\n</</html>\n```\n\nJavaScript 教程 - Herong\
  \ 的教程示例\n\n# 流程控制语句](#part0019.xhtml)\n\n## 条件 \"if\" 语句\n\n本节快速提供了不同类型的条件 'if'\
  \ 语句的描述。\n\n\"if\" 语句被称为条件语句。一个 \"if\" 语句允许你创建一个或多个语句块。执行流将根据条件通过这些语句中的之一。JavaScript\
  \ 支持 4 种类型的 \"if\" 语句：\n\n1. 单语句 \"if\":\n```javascript\nif (condition)\n```\n其中\
  \ `condition` 是布尔值。\n\n2. 多语句 \"if\":\n```javascript\nif (condition) {\n   statement1;\n\
  \   statement2;\n}\n```\n其中 `condition` 是布尔值。\n\n3. \"if ... else\" 语句:\n```javascript\n\
  if (condition) \n   statement\nelse\n   statement\n```\n指定了两个语句或块。但只有其中一个会被执行。\n\
  \n4. \"if ... else if\" 语句:\n```javascript\nif (condition_1)\n   statement\nelse\
  \ if (condition_2)\n   statement\n...\nelse\n   statement\n```\n指定了多个语句或块。\n\n下一节将提供一个教程示例。\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n\n\n\n\n```\n 新年快乐！\n\n打开日志文件。\n写入日志消息。\n关闭日志文件。\n\
