  \ - IE 6.0 结果\n\n### 结论：\n\n- DOM（文档对象模型）是 W3C（万维网联盟）推荐的一套规范，用于为有效的 HTML 和格式良好的\
  \ XML 文档定义 API（应用程序编程接口）。\n- 最新的 DOM 规范是 DOM Level 3，分为 21 个模块。它于 2004 年发布。\n- 所有流行的\
  \ Web 浏览器都支持 DOM Level 3。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟W3C 文档对象模型 (DOM) 规范\n\
  \n## DOM 规范概述\n\n本节提供了 DOM（文档对象模型）规范的概述，这是一套被分为多个级别和模块（功能）的 API。\n\nDOM（文档对象模型）是\
  \ W3C（万维网联盟）推荐的一套规范，用于为有效的 HTML 和格式良好的 XML [p.208] 文档定义 API（应用程序编程接口）。\n\n目前，DOM\
  \ 有 4 个级别的规范：\n\n**DOM Level 0** - 未发布正式规范：一组由 Netscape Navigator 3.0 版本和 Microsoft\
  \ Internet Explorer 3.0 版本提供的 HTML 文档功能集。\nDOM Level 0 功能示例：`document.bgColor` 和\
  \ `document.alinkColor`。\n\n**DOM Level 1** - 最新版本于 1998 年 10 月发布：包含 2 个模块的 API：Core\
  \ 和 HTML。DOM Level 1 Core 代表用于 XML 文档的功能。DOM Level 1 HTML 将 DOM Level 1 Core 扩展到特定\
  \ HTML 文档的功能。\nDOM Level 1 功能示例：`document.createElement()` 和 `document.body.bgColor`。\n\
  \n**DOM Level 2** - 于 2000 年 11 月发布：包含 14 个模块的 API：Core, XML, HTML, Views, StyleSheets,\
  \ CSS, CSS2, Events, User interface Events, Mouse Events, Mutation Events, HTML\
  \ Events, Range 和 Traversal。\nDOM Level 2 功能示例：`document.defaultView`、`document.styleSheets`、`document.getElementById()`\
  \ 和 `document.body.style`。\n\n**DOM Level 3** - 于 2004 年 4 月发布：包含 21 个模块的 API：Core,\
  \ XML, HTML, XPath, Travesal, Range, Validation, Load and Save, Asynchronous Load,\
  \ Views, Stylesheets, CSS, CSS2, Events, HTML Events, Mutation Events, Mutation\
  \ Name Events, UI Events, Mouse Events, Text Events 和 Keyboard Events。\nDOM Level\
  \ 3 功能示例：`document.xmlVersion`、`document.inputEncoding` 和 `document.title.textContent`。\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n∟DOM Level 0 - 示例\n\n本节提供了在 Netscape 3 和 IE 3\
  \ 中的 DOM Level 0 对象和属性的教程示例。\n\n这是一个使用 DOM Level 0 对象和属性的教程示例：\n\n\n\n\n\n```html\n\
  \ <html>\n<!-- DOM_Level_0_Example.html\n   Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n-->\n<head>\n<title>DOM Level 0 Example</title>\n<script type=\"text/javascript\"\
  >\nvar colorID = 0;\nfunction changeColor() {\n   if (colorID == 0 )\n      document.bgColor\
  \ = \"#ff8888\";\n   else if (colorID == 1 )\n      document.bgColor = \"#88ff88\"\
  ;\n   else if (colorID == 2 )\n      document.bgColor = \"#8888ff\";\n   else if\
  \ (colorID == 3 )\n      document.bgColor = \"#888888\";\n   document.forms[0].elements[0].value\
  \ = document.bgColor;\n   colorID = (colorID+1)%4;\n}\n</script>\n</head>\n<body>\n\
  <pre>\n<script type=\"text/javascript\">\n   document.writeln(\"\\\"documnet\\\"\
