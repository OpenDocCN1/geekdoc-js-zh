  \   document.writeln(\"   linkColor = \"+document.linkColor);\n   document.writeln(\"\
  \   vlinkColor = \"+document.vlinkColor);\n</script>\n</pre>\n<form>\n  Current\
  \ document.bgColor: \n  <input type=\"text\" name=\"bgcolor\" value=\"#ffffff\"\
