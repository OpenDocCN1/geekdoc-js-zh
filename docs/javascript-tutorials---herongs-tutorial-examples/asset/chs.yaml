  Apple Safari: JavaScript1.7\nMozilla Firefox: JavaScript1.5 \nInternet Explorer\
  \ 11: JavaScript1.3 \n```\n\nJavaScript 教程 - Herong 的教程示例\n\n∟支持 JavaScript 的网页浏览器\n\
  \n∟在字符串面量中包含 'script' 标签\n\n本节提供了一个教程示例，展示了在 HTML 文档字符串面量中包含 'script' 标签的问题。\n\n\
  正如我们在上一节中学到的，JavaScript 代码必须包含在 HTML 文档的 \"script\" 标签中，例如：`<script ...> JavaScript\
  \ 代码 </script>`。这对 JavaScript 代码增加了额外的限制：\n\n*切勿在你的 JavaScript 代码的任何地方直接包含 `</script>`。*\n\
  \n如果你在 JavaScript 代码中直接使用 `</script>`，将导致网页浏览器或服务器提前结束你的 JavaScript 代码，并引起执行错误。以下是直接包含\
  \ `</script>` 的教程示例：\n\n```html\n <html>\n<!-- Escape_Script_Tag.html\n   Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Escaping Script Tags</title></head>\n\
  <body><pre>\n<script type=\"text/javascript\">\n   document.writeln(\"Question:\
  \ How to use the <script> tag?\");\n   document.writeln(\"Answer: <script>...Script\
  \ Code...</script>\");\n   document.writeln(\"Rate this answer: 1 | 2 | 3 | 4 |\
  \ 5\");\n</script>\n</pre></body>\n</html>\n```\n\n如果你在浏览器中运行此示例脚本，你将得到：\n\n```\n\
  \ \");\n   document.writeln(\"Rate this answer: 1 | 2 | 3 | 4 | 5\");\n```\n\n感到惊讶吗？并不如此。以下是浏览器处理此\
  \ HTML 文档时发生的情况：\n\n*   当浏览器到达 `document.writeln()` 语句字符串面量中包含的 `</script>` 标签时，它将结束\
  \ JavaScript 代码。\n*   提前结束的 JavaScript 代码不会向 HTML 文档写入任何内容，因为最后一条语句是不完整的。\n*   `</script>`\
  \ 之后的剩余 JavaScript 代码将作为 HTML 文档的静态文本处理。这就是为什么它会在浏览器窗口中显示出来。\n\n请查看下一节了解如何解决这个问题。\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n∟支持 JavaScript 的网页浏览器\n\n∟在字符串面量中转义 'script' 标签\n\
  \n本节提供了一个教程示例，介绍如何在 'script' 标签中使用转义字符来防止浏览器提前结束嵌入的 JavaScript 代码。\n\n现在让我们尝试修复在上一节中发现的问题。\n\
  \n第一个修复方法是使用反斜杠字符（\\`）来转义 `</script>` 标签中的（/`。这个额外的反斜杠将阻止浏览器将此标签识别为 JavaScript 代码的结束。同时，JavaScript\
  \ 引擎将忽略这个反斜杠，并以与没有额外反斜杠相同评估字符串面量。\n\n以下是带有额外反斜杠字符修改后的 HTML 文档：\n\n```html\n <html>\n\
  <!-- Escape_Script_Tag_Backslash.html\n   Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n-->\n<head><title>Escaping Script Tags</title></head>\n<body><pre>\n\
  <script type=\"text/javascript\">\n   document.writeln(\"Question: How to use the\
  \ <script> tag?\");\n   document.writeln(\"Answer: <script>...Script Code...<\\\
  /script>\");\n   document.writeln(\"Rate this answer: 1 | 2 | 3 | 4 | 5\");\n</script>\n\
  </pre></body>\n</html>\n```\n\n如果你在浏览器中运行此示例脚本，你将得到：\n\n```\n Question: How to use\
  \ the \nRate this answer: 1 | 2 | 3 | 4 | 5\n```\n\n好些了吗？是的。但仍然不是我们预期的。这里是浏览器处理此\
  \ HTML 文档时发生的情况：\n\n*   浏览器正确跳过了 `<\\/script>` 并到达 JavaScript 代码的结尾。\n*   整个 JavaScript\
  \ 代码现在正确执行，没有报错。\n\n换句话说，现在 JavaScript 代码中没有错误。JavaScript 代码插入了以下内容：\n\n```\n Question:\
  \ How to use the <script>\nAnswer: <script>...Script Code...\nRate this answer:\
  \ 1 | 2 | 3 | 4 | 5\n```\n\n当浏览器渲染此内容时，它会将 \"script\" 标签视为 HTML 标签。\n\n请查看下一节如何在\
  \ HTML 文档中保护 \"script\" 标签。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟支持 JavaScript 的网页浏览器\n\
  \n∟使用 HTML 实体来保护 HTML 标签\n\n本节提供了一个教程示例，介绍如何使用 HTML 实体 `&lt;` 和 `&gt;` 来保护 HTML\
  \ 标签。\n\n为了完全解决我们在上一节看到的问题，我们需要使用 HTML 实体来替换 `<` 和 `>`, 如果你想让某些 HTML 标签显示页面。\n\n\
  以下是使用 `&lt;` 和 `&gt;` 实体的修改后的 HTML 文档：\n\n```html\n <html>\n<!-- Escape_Script_Tag_HTML_Entity.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Escaping\
  \ Script Tags</title></head>\n<body><pre>\n<script type=\"text/javascript\">\n \
  \  document.writeln(\"Q: How to use the &lt;script&gt; tag?\");\n   document.writeln(\"\
  A: &lt;script&gt;...Code...&lt;\\/script&gt;\");\n   document.writeln(\"Rate this\
  \ answer: 1 | 2 | 3 | 4 | 5\");\n</script>\n</pre></body>\n</html>\n```\n\n如果你在浏览器中运行此示例脚本，你将得到：\n\
  \n```\n Q: How to use the <script> tag?\nA: <script>...Code...</script>\nRate this\
  \ answer: 1 | 2 | 3 | 4 | 5\n```\n\n最后，我们得到了想要的！\n\nJavaScript 教程 - Herong 的教程示例\n\
  \n∟支持 JavaScript 的网页浏览器\n\n∟将 JavaScript 代码作为外部文件引入\n\n本节简要介绍了如何将 JavaScript 代码保存到单独的文件并使用\
  \ 'script' 标签将其包含在 HTML 文档中提供了一个调用存储在单独 JavaScript 文件中的函数的教程示例。\n\n为了测试此功能，我编写了以下\
  \ JavaScript 代码并保存为文件 `Hello_World_Function.js`：\n\n```javascript\n function printHello()\
  \ {\n   document.write('Hello World!');\n}\n```\n\n\n\n\n现在我可以修改上一节中的 HTML 文档，使用\
  \ `\"script\"` 标签来此文件：\n\n```\n <html>\n<!-- Hello_World_Head_Include.html\n   Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>printHello() Function\
  \ in an Include File</title>\n<script type=\"text/javascript\" src=\"Hello_World_Function.js\"\
  >\n</script>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n   printHello();\n\
  </script>\n</pre>\n</body>\n</html\n```\n\n当然，修改后的 JavaScript 页面的输出将仍然是文本：\"Hello\
  \ World!\"。\n\n在测试此 `\"script\"` 标签的 `\"src\"` 属性时，我注意到空标签的简写形式不起作用：\n\n```\n <script\
  \ type=\"text/javascript\" src=\"JavaScript_file_URL\"/>\n```\n\n你必须显式使用结束标签 `</script>`！\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n∟支持 JavaScript 的 Web 浏览器\n\n### DOM API - \"document\"\
  \ 对象\n\n本节提供了对 DOM API 中 `'document'` 对象的简要描述。还提供了一个关于使用 `'document'` 对象构建简单 HTML\
  \ 文档的教程示例。\n\n典型的 Web 浏览器提供了 DOM（文档对象模型）API（应用程序编程接口），允许 JavaScript 代码与浏览器以及 HTML\
  \ 文档进行交互。\n\nDOM API 中最常用的对象是 `\"document\"` 对象，它具有以下特性：\n\n*   `\"document\"` 对象是浏览器内置的对象，代表浏览器中当前的的\
  \ HTML 文档。\n*   `\"document\"` 对象以 `\"node\"` 对象的树形结构表示 HTML 文档中的所有元素。\n*   `\"\
  document\"` 对象及其它的 `\"node\"` 对象提供了多种方法，允许你操纵 HTML 文档。\n*   `\"document\"` 对象在 JavaScript\
  \ 和其他编程语言中共享相同的编程接口。\n\n为了演示 `\"document\"` 对象的一些优秀特性，我编写了以下 JavaScript 教程示例：\n\n\
  ```\n <html>\n<!-- Document_Object.html\n   Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n-->\n<head>\n<title>Document Object</title>\n<script type=\"text/javascript\"\
  >\nfunction buildDocument() {\n   // 构建一个 <p> 标签\n   var paragraph = document.createElement(\"\
  p\");\n   var text = document.createTextNode(\"Hello World!\");\n   paragraph.appendChild(text);\n\
  \n   // 插入 <p> 标签\n   document.body.appendChild(paragraph);\n   document.body.bgColor\
  \ = \"lightblue\";\n}\n</script>\n</head>\n<body onLoad=\"buildDocument();\"/>\n\
  </html\n```\n\n如果你在浏览器中运行此 JavaScript ，你将看到浅蓝色背景的 \"Hello World!\" 段落。\n\n更多关于 `\"\
  document\"` 对象的教程示例，请参阅本书中的 DOM API 章节。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟支持 JavaScript\
  \ 的 Web 浏览器\n\n### DOM API - \"window\" 对象\n\n本节提供了对 DOM API 中 `'window'` 对象的简要描述。还提供了一个关于从当前浏览器窗口获取属性的教程示例。\n\
  \nWeb 浏览器提供的 DOM API 包含另一个名为 `\"window\"` 的有用对象，它具有以下特性：\n\n*   `\"window\"` 对象是浏览器内置的对象，代表包含当前\
  \ HTML 文档的浏览器窗口。\n*   `\"window\"` 对象提供了许多属性，允许你获取有关当前窗口的信息。\n*   `\"window\"` 对象提供了一个名为\
  \ `open()` 的方法，允许你创建一个新窗口并获取一个新的窗口对象。\n*   你自己创建的新窗口对象提供了许多方法允许你对其进行操纵。\n*   出于安全考虑，窗口操纵方法将无法作用于当前窗口对象\
  \ `\"window\"`。\n\n为了演示如何从当前窗口获取属性，我编写了以下 JavaScript 教程示例：\n\n```\n <html>\n<!--\
  \ Window_Properties.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
  -->\n<head>\n<title>Window Properties</title>\n<script type=\"text/javascript\"\
  >\nfunction getWindowProperties() {\n   var text = \"\";\n   text += \"'document'\
  \ property: \"+ window.document.title+\"\\n\";\n   text += \"'location' property:\
  \ \"+ window.location.pathname+\"\\n\";\n   text += \"'history' property: \"+ window.history.length+\"\
  \\n\";\n   text += \"'navigator' property: \"+ window.navigator.appCodeName+\"\\\
  n\";\n   text += \"'outerWidth,outerHeight' property: \"\n      + window.outerWidth+\"\
  ,\"+ window.outerHeight+\"\\n\";\n   text += \"'innerWidth,innerHeight' property:\
  \ \"\n      + window.innerWidth+\",\"+ window.innerHeight+\"\\n\";\n   text += \"\
  'screenX,screenY' property: \"\n      + window.screenX+\",\"+ window.screenY+\"\\\
  n\";\n   return text;\n}\n</script>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
  >\n   document.write(getWindowProperties());\n</script>\n</pre>\n</body>\n</html\n\
  ```\n\n在 Firefox 浏览器中运行此 JavaScript 示例，你将得到类似的内容：\n\n```\n 'document' property:\
  \ Window Properties\n'location' property: /C:/herong/Window_Properties.html\n'history'\
  \ property: 1\n'navigator' property: Mozilla\n'outerWidth,outerHeight' property:\
  \ 1024\n768\n'innerWidth,innerHeight' property: 1024\n754\n'screenX,screenY' property:\
  \ 0\n0\n```\n\n\n\n\n*   点击“关闭窗口”（Close Window）按钮，新的浏览器窗口将被关闭。\n\n关于 `window` 对象的更多教程示例，请参阅本书中的\
  \ DOM API 章节。\n\nJavaScript 教程 - 荷教程示例\n\n### ∟支持 JavaScript 的 Web 浏览器\n\n#### ####\
  \ 事件监听器与对象\n\n本节快速描述了不同 HTML 标签上的事件触发属性，以及代表事件并包含事件详细信息的 `event` 对象。提供了一个教程示例，通过在鼠标按下事件上添加监听器来显示鼠标位置。\n\
  \n典型的 Web 浏览器还支持特殊的 HTML 属性，允许您添加事件监听器并传递事件对象。以下是各种 HTML 标签上常用的 HTML 属性：\n\n*  \
  \ `<body onLoad=\"listener_code\" ...>` - 当浏览器开始加载 HTML 文档并触发 `onLoad` 事件时，将执行指定的监听器代码。\n\
  *   `<body onMouseDown=\"listener_code\" ...>` - 当用户在浏览器窗口的任何位置按下鼠标按钮触发 `onMouseDown`\
  \ 事件时，将执行指定的监听器代码。\n*   `<a onMouseOver=\"listener_code\" ...>` - 当用户将鼠标移动过此超链接触发\
  \ `onMouseOver` 事件时，将执行指定的监听器代码。\n*   `<input type=\"button\" onClick=\"listener_code\"\
  \ ...>` - 当用户点击此按钮触发 `onClick` 事件时，将执行指定的监听器代码。\n\n本书的其他章节将介绍更多事件触发属性。\n\n在每个事件触发属性中，浏览器都会提供一个名为\
  \ `event` 的对象，该对象表示此事件并包含有关此事件的详细信息。此 `event` 对象具有多种属性和方法供您使用。\n\n为了演示事件触发和 `event`\
  \ 对象的一些优秀特性，我编写了这个 JavaScript 教程示例：\n\n```\n <html>\n<!-- Event_Object_and_Trigger.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Event\
  \ Object and Trigger</title>\n</head>\n<body onMouseDown=\n   \"window.alert('X:\
  \ '+event.clientX+', Y: '+event.clientY);\">\n<p>点击页面任意位置查看位置坐标。</p>\n</body>\n\
  </</html>>\n```\n\n在此教程示例中，`body` 标签上的 `onMouseDown` 事件触发属性被用于添加一段短的监听器代码，当用户在页面上按下鼠标时执行。监听器代码使用浏览器提供的\
  \ `event` 对象来获取位置的 x 和 y 坐标。\n\n通过调用 `window` 对象上的 `alert()` 方法，通过警报框向用户报告坐标。见下图：\n\
  \n![](img/image00134.jpeg)\n\n窗口警报框\n\nJavaScript 教程 - 荷教程示例\n\n### ∟支持 JavaScript\
  \ 的 Web 浏览器\n\n#### #### ####'javascript:' 伪 URL 地址\n\n本节描述了什么是 `javascript:` 伪\
  \ URL 地址，并提供了若干几个有趣的 `javascript:` URL 示例。\n\n许多 Web 浏览器还支持形式如下的 `javascript:` 伪\
  \ URL 地址：\n\n```\n javascript:statement;statement;...\n```\n\n当给浏览器提供 `javascript:`\
  \ 伪 URL 时，它将开始评估 URL 中包含的 JavaScript 语句。以下是一些您可以尝试的 `javascript:` 伪 URL 地址示例：\n\n\
  1. 下列 URL 将导致浏览器在小型对话框中显示文本消息。\n\n```\n javascript:alert(\"Hello World!\");\n```\n\
  \n2. 下列 URL 将导致浏览器显示一个带有文本消息的新页面。\n\n```\n javascript:document.write(\"<html><body>Hello\
  \ World!</body></html>\");\n```\n\n3. 下列 URL 将导致浏览器执行复杂的 JavaScript 代码，从而生成一个包含质数的\
  \ HTML 页面。注意，整个 URL 地址必须写在单行中。因此，您需要合并以下行，将其复制并粘贴到浏览器。\n\n```\n javascript:var i,\
  \ j, is_prime; document.write('<body><pre>'); \n   for ( i=3; i<=30; i+=2 ) { is_prime\
  \ = true; for ( j=2; j<=i/2; j++)\n   { is_prime = i%j > 0; if (!is_prime) break;}\
  \ \n   if (is_prime) document.writeln('Found a prime number: ' + i); } \n   document.write('</pre></body>');\n\
  ```\n\n现在轮到你编写更多 `javascript:` URL 示例了。\n\nJavaScript 教程 - 荷教程示例\n\n### ∟支持 JavaScript\
  \ 的 Web 浏览器\n\n#### #### #### Google Chrome 中的 JavaScript 控制台\n\n本节提供了教程示例，介绍如何使用\
  \ Google Chrome 中的 JavaScript 控制台来查看 JavaScript 执行结果执行错误和日志消息。你也可以用它运行任何 JavaScript\
  \ 语句来与 HTML 文档进行交互。\n\n**什么是 Google Chrome 中的 JavaScript 控制台？** Google Chrome 中的\
  \ JavaScript 控制台是浏览器为您提供的一个控制台，用于：\n\n*   查看浏览器在执行嵌入 JavaScript 代码时生成的任何错误或日志消息。\n\
  *   运行任何 JavaScript 代码以交互方式与 Web 文档交互。\n\n以下是我测试 Google Chrome 中 JavaScript 控制台的操作步骤：\n\
  \n1. 运行 Google Chrome 并加载以下 HTML 代码：\n\n```\n <html>\n<head><title>Hello World!</title></head>\n\
  <body>\n<script type=\"text/javascript\">\n   document.write('Hello World! - Document');\n\
  \   console.log('Hello World! - Console');\n</script>\n</body>\n</</html>\n```\n\
  \n2. 按下 F12 键。我看到屏幕上显示了开发者面板。\n3. 点击开发者面板上的“Console”选项卡。我看到控制台日志消息显示：“Hello World!\
  \ - Console”。\n4. 在控制台中输入一些 JavaScript 语句并运行：\n\n```\n Hello World! - Console\n\
  > var msg = document.title;\n< undefined\n> console.log(msg.length);\n  12\n< undefined\n\
  > \n```\n\n很酷。控制台是排查 Google Chrome 上运行的 HTML 页面中 JavaScript 代码问题的很好的工具。\n\n![](img/image00135.jpeg)\n\
  \nJavaScript 控制台\n\n\n\n\n\n本节提供了教程示例，介绍如何使用 Apple Safari 中的 JavaScript 控制台（Console）来查看\
  \ JavaScript 执行产生的错误和日志消息。你也可以使用它来运行任何 JavaScript 语句以与 HTML 文档进行交互。\n\n## 什么是 Apple\
