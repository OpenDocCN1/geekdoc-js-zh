  \ 对象的引用。\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 将函数作为“函数”对象使用\n\n### 函数是“Function”类型的对象\n\
  \n本节提供了 JavaScript 语言一个独特性的概述：函数是 `Function` 类型的对象。\n\nJavaScript 语言一个非常有趣的特性是，函数是\
  \ `Function` 对象类型的对象。将函数视为对象可以带来若干编程影响：\n\n- JavaScript 支持一种名为 `Function` 的特殊内置对象类型。\n\
  - 可以使用 `Function()` 构造函数创建函数。\n- 函数具有继承的属性和方法：`length`、`apply()`、`call()` 和 `toString()`。\n\
  - 函数可以有自己的实例属性 - 在多次函数调用之间共享值的一种良好方法。\n- 函数可以作为表达式的一部分创建。\n- 函数可以作为参数传递给其他函数。\n\n\
  函数可以通过 3 种不同的方式创建：\n\n- 使用 `function` 声明语句 - 以传统方式创建函数。\n- 使用 `function` 运算符 - 在评估表达式时作为函数字面量动态创建函数。\n\
  - 使用 `Function()` 构造函数 - 以面向对象的方式创建函数。\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 将函数作为“函数”对象使用\n\
  \n### 使用 Function 构造函数\n\n本节提供了一个如何使用 `Function` 对象类型构造函数定义新函数的教程示例。\n\nJavaScript\
  \ 提供了 `Function` 作为内置对象类型。`Function` 类型的构造函数具有以下调用签名：\n\n```\n new Function(\"arg_1\"\
  , \"arg_2\", ..., \"function_body\");\n```\n\n其中最后一个参数是形成新函数体的语句列表，而所有其他参数都是新函数的参数名称。\n\
  \n下面的教程示例向你展示如何使用 `Function` 对象类型构造函数定义新函数：\n\n```\n // Function_Constructor.js\n\
  // Copyright (c) HerongYang.com. All Rights Reserved.\n\n// 定义一个没有参数的新函数\n   var\
  \ hello = new Function(\n      \"println(\\\"Hello World!\\\");\"\n   )\n\n// 调用函数\n\
  \   hello();\n\n// 定义一个带有一个参数的新函数\n   var f2c = new Function(\"fahrenheit\",\n \
  \     \"println(\\\"Converting Fahrenheit = \\\"+fahrenheit);\"\n      + \"var celsius\
  \ = (fahrenheit - 32.0 ) / 1.8;\"\n      + \"println(\\\"Returning Celsius = \\\"\
  +celsius);\"\n      + \"return celsius;\"\n   )\n\n// 调用函数\n   var received = f2c(212.0);\n\
  \   println(\"Received Celsius = \"+received);\n```\n\n在命令行窗口中使用 `jrunscript` 运行此\
  \ JavaScript 文件，你将得到：\n\n```\n Hello World!\nConverting Fahrenheit = 212\nReturning\
  \ Celsius = 100\nReceived Celsius = 100\n```\n\n结论：`Function` 对象类型构造函数是有效的。但它非常难以使用，主要因为新函数的语句必须作为单个字符串字面量输入。这些语句中的所有引号都必须用反斜杠\
  \ (\\) 进行转义。仍然最好使用 `function` 语句通过传统方式来定义新函数。\n\n\n\n\n\n# 函数对象的继承属性和方法\n\n本节提供了一个关于如何使用\
  \ `Function` 对象继承的属性和方法的教程示例。\n\n由于函数是 `Function` 类型的对象，因此它具有一些有趣的继承的属性和方法：\n\n\
  - `\"length\"` - 该属性表示此函数预期的参数个数。\n- `\"apply()\"` - 一个方法，用于在指定的对象上使用数组指定的参数调用（执行）此函数。\n\
  - `\"call()\"` - 一个方法，用于在指定的对象上使用指定的参数调用（执行）此函数。\n- `\"toString()\"` - 一个方法，将函数的体体作为字符串返回。\n\
  \n下面的教程示例向你展示了如何使用 `Function` 对象继承的属性和方法：\n\n``` // Function_Properties_and_Methods.js\n\
  // Copyright (c) HerongYang.com. All Rights Reserved.\n\n   var sign = new Function(\"\
  name\",\n      \"this.signature = name;\"\n   )\n\n   println(\"Function body: \"\
  \ + sign.toString());\n\n   println(\"# of parameters: \" + sign.length);\n\n//\
  \ 在当前对象上执行\n   sign(\"Herong\");\n   println(\"this.signature: \" + this.signature);\n\
  \n// 在另一个对象上应用\n   var java = new Object();\n   sign.apply(java, new Array(\"Sun\"\
  ));\n   println(\"java.signature: \" + java.signature);\n\n// 在另一个对象上调用\n   var\
  \ pc = new Object();\n   sign.call(pc, \"IBM\");\n   println(\"pc.signature: \"\
  \ + pc.signature);\n```\n\n在命令行窗口中使用 `jrunscript` 运行此 JavaScript 文件，你将得到：\n\n```\n\
  \ Function body:\nfunction anonymous(name) {\n    this.signature = name;\n}\n\n\
  # of parameters: 1\nthis.signature: Herong\njava.signature: Sun\npc.signature: IBM\n\
  ```\n\n非常酷。一切都符合我的预期。一个小小的惊喜是，用 `Function` 构造函数创建的函数对象的名称是 \"anonymous\"。\n\nJavaScript\
  \ 教程 - Herong 的教程示例\n\n将函数作为“函数”对象使用\n\n# 函数实例属性\n\n本节提供了一个关于如何使用函数的实例属性在多次函数调用之间共享值的教程示例。\n\
  \n作为一个对象，函数也可以拥有它自己的实例属性。函数的实例属性也可以被看是一个静态变量，其值在多次函数调用之间持续。\n\n下面的教程示例向你展示了如何使用函数的实例属性在多次函数调用之间共享值。\n\
  \n``` // Function_Own_Properties.js\n// Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n\n   var sign = new Function(\"name\",\n      \"this.signature = name;\"\
  \n      + \"sign.count++;\"\n   )\n   sign.count = 0;\n\n// 在当前对象上执行\n   sign(\"\
  Herong\");\n\n// 在另一个对象上应用\n   var java = new Object();\n   sign.apply(java, new\
  \ Array(\"Sun\"));\n\n// 在另一个对象上调用\n   var pc = new Object();\n   sign.call(pc,\
  \ \"IBM\");\n\n// 函数被调用的次数\n   println(\"Call counts: \" + sign.count);\n```\n\n\
  在命令行窗口中使用 `jrunscript` 运行此 JavaScript 文件，你将得到：\n\n```\n Call counts: 3\n```\n\n\
  JavaScript 教程 - Herong 的教程示例\n\n将函数作为“函数”对象使用\n\n# 使用 \"function\" 语句创建函数对象\n\n\
  本节提供了一个关于如何用 'function' 语句创建函数对象的教程示例，该语句还将将对象赋值给变量。\n\n根据定义，函数是 `Function` 对象类型的一个对象实例。在之前的章节中，我们学习了如何使用\
  \ `Function` 构造函数创建函数。\n\n函数也可以用 \"function\" 语句来创建：\n\n```\n function function_name(parameter_1,\
  \ parameter_2, ...) {\n   statement_1; \n   statement_2;\n   ...\n   return return_expression\n\
  }\n```\n\n\"function\" 语句实际上执行了 4 件事：\n\n- 创建了一个 `Function` 对象。\n- 使用 `\"function_name\"\
  ` 为 `Function` 对象命名。\n- 声明了一个名为 `\"fucntion_name\"` 的变量。\n- 将 `Function` 对象赋值给变量\
  \ `\"function_name\"`。\n\n下面的教程示例向你展示了如何使用 \"function\" 语句来创建 `Function` 对象：\n\n\
  ``` // Function_Statements.js\n// Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \n// 使用 \"function\" 语句\nfunction f2c(fahrenheit) {\n   println(\"Converting Fahrenheit\
  \ = \"+fahrenheit);\n   var celsius = (fahrenheit - 32.0 ) / 1.8;\n   println(\"\
  Returning Celsius = \"+celsius);\n   return celsius;\n}\n\n   println(\"Function\
  \ body: \" + f2c.toString());\n\n   println(\"# of parameters: \" + f2c.length);\n\
  \n   var received = f2c.call(this, 70.0);\n   println(\"Received Celsius = \"+received);\n\
  ```\n\n在命令行窗口中使用 `jrunscript` 运行此 JavaScript 文件，你将得到：\n\n```\n # of parameters:\
  \ 1\nConverting Fahrenheit = 70\nReturning Celsius = 21.11111111111111\nReceived\
  \ Celsius = 21.11111111111111\n```\n\nJavaScript 教程 - Herong 的教程示例\n\n将函数作为“函数”对象使用\n\
  \n# 使用 \"function\" 运算符创建函数对象\n\n本节提供了一个关于如何用 'function' 运算符创建函数对象的教程示例。用 'function'\
  \ 运算符定义的函数也称为函数字面量（function literal）或表达式（function expression）。\n\n根据定义，函数是 `Function`\
  \ 对象类型的一个对象实例。在之前的章节中，我们学习了如何使用 `Function` 构造函数创建函数。\n\n函数也可以用 \"function\" 运算符来创建：\n\
  \n```\n function function_name {\n   statement_1; \n   statement_2;\n   ...\n  \
  \ return return_expression\n};\n```\n\n\"function\" 运算符实际上只执行了 2 件事：\n\n- 创建了一个\
  \ `Function` 对象。\n- 使用 `\"function_name\"` 为 `Function` 对象命名。如果没有提供名称，则该 `Function`\
  \ 对象将没有名称。\n\n用 \"function\" 运算符定义的函数也称为函数字面量或函数表达式。\n\n用 \"function\" 运算符定义的函数应该被赋值给变量。否则，它无法在运算符使用的地方之外访问。\n\
  \n下面的教程示例向你展示了如何使用 \"function\" 运算符创建 `Function` 对象：\n\n``` // Function_Operator.js\n\
  // Copyright (c) HerongYang.com. All Rights Reserved.\n\n// 没有引用变量也没有名称的函数\n   function()\
  \ { println('Apple'); };\n   // 在表达式之外无法调用\n\n   // 作为表达式的一部分调用是可以的\n   (function()\
  \ { println('Banana'); }).call(this);\n\n// 有引用变量但没有名称的函数\n   var orange = function()\
  \ { println('Orange'); };\n   orange();\n\n// 有引用变量也有名称的函数\n   var hello = function\
  \ allo() { println('Hello'); };\n   hello();\n   // allo(); // 不允许通过函数调用调用\n\n//\
  \ 有引用变量、参数但没有名称的函数\n   var f2c = function (fahrenheit) {\n      println(\"Converting\
  \ Fahrenheit = \"+fahrenheit);\n      var celsius = (fahrenheit - 32.0 ) / 1.8;\n\
  \      println(\"Returning Celsius = \"+celsius);\n      return celsius;\n     \
  \ };\n   f2c(70.0);\n```\n\n在命令行窗口中使用 `jrunscript` 运行此 JavaScript 文件，你将得到：\n\n```\n\
  \ Banana\nOrange\nHello\nConverting Fahrenheit = 70\nReturning Celsius = 21.11111111111111\n\
  ```\n\nJavaScript 教程 - Herong 的教程示例\n\n将函数作为“函数”对象使用\n\n# 比较创建的三种方法\n\n本节提供了一个教程示例，用于比较创建函数对象的不同方法：'function'\
  \ 语句、'function' 运算符和 `Function()` 构造函数。\n\n现在我们知道有 3 种创建函数的方法：\n\n- 使用 \"function\"\
  \ 声明语句 - 以传统方式创建函数。\n- 使用 \"function\" 运算符 - 在计算表达式时作为函数字面量动态创建函数。\n- 使用 \"Function()\"\
  \ 构造函数 - 以面向对象的方式创建函数。\n\n\n\n\n\n下方的教程示例展示了如何通过 3 种不同的创建函数：\n\n```javascript\n\
  \ // Function_Creation_Facilities.js\n// Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n\n// 使用 \"function\" 声明语句创建函数\n   function convert_1(fahrenheit) {\n\
  \      println(\"Converting Fahrenheit = \"+fahrenheit);\n      var celsius = (fahrenheit\
  \ - 32.0 ) / 1.8;\n      println(\"Returning Celsius = \"+celsius);\n      return\
  \ celsius;\n      }\n\n// 使用 \"function\" 运算符创建函数\n   var convert_2 = function (fahrenheit)\
  \ {\n      println(\"Converting Fahrenheit = \"+fahrenheit);\n      var celsius\
  \ = (fahrenheit - 32.0 ) / 1.8;\n      println(\"Returning Celsius = \"+celsius);\n\
  \      return celsius;\n      };\n\n// 使用 \"Function()\" 构造函数创建函数\n   var convert_3\
  \ = new Function(\"fahrenheit\",\n      \"println(\\\"Converting Fahrenheit = \\\
  \"+fahrenheit);\"\n      + \"var celsius = (fahrenheit - 32.0 ) / 1.8;\"\n     \
  \ + \"println(\\\"Returning Celsius = \\\"+celsius);\"\n      + \"return celsius;\"\
  \n      );\n\n// 调用所有 3 个\n   convert_1(70.0);\n   convert_2(70.0);\n   convert_3(70.0);\n\
  ```\n\n在命令行窗口中使用 `jrunscript` 此 JavaScript 文件，你将得到：\n\n```\n Converting Fahrenheit\
  \ = 70\nReturning Celsius = 21.11111111111111\n Converting Fahrenheit = 70\nReturning\
  \ Celsius = 21.11111111111111\nConverting Fahrenheit = 70\nReturning Celsius = 21.11111111111111\n\
  ```\n\nJavaScript 教程 - Herong 的教程示例\n\n# 内置对象类型简介\n\n本章快速介绍 JavaScript 内置对象。主题包括全局对象及其宿主环境提供的属性；`Math`\
  \ 对象及其属性；内置对象类型：`Function`、`Array`、`String`、`Boolean`、`Number`、`Date`、`RegExp` 和\
  \ `Error`。\n\n* 内置对象类型概述\n* \"Object\" 对象类型 - 根对象类型\n* \"Global\" 对象类型 - 不见的全局容器\n\
  * 在 ECMAScript 中定义的全局属性和函数\n* \"jrunscript\" 提供的全局属性和函数\n* \"Function\" 对象类型 - 函数是对象\n\
  * \"Array\" 对象类型 - 数组是对象\n* \"JSON\" 对象类型 - `parse()` 和 `stringify()`\n* \"String\"\
  \ 对象类型 - 不等于字符串原始类型\n* \"Boolean\" 对象类型 - 将布尔值封装为对象\n* \"Number\" 对象类型 - 不等于数字原始类型\n\
  * \"Date\" 对象类型 - 管理日期和时间\n* \"RegExp\" 对象类型 - 正则表达式模式\n* \"Error\" 对象类型 - 运行时异常\n\
  * \"Math\" 对象类型 - 数学容器\n\n结论：\n\n* JavaScript 规范自 ECMAScript 第 3 版起，支持这些内置对象类型：`Object`、`Global`、`Function`、`Array`、`String`、`Boolean`、`Number`、`Date`、`RegExp`、`Error`、`Math`。\n\
  * \"Global\" 是一个特殊的对象类型，只有一个没有引用变量的默认实例。但你可以通过全局上下文中的 `this` 关键字访问它。\n* \"Global\"\
  \ 对象实例用于持有所有内置属性和方法，如 `undefined`、`eval()` 等。\n\nJavaScript 教程 - Herong 的教程示例\n\n\
  # 内置对象类型简介\n\n## 内置对象类型概述\n\n本节提供了 ECMAScript 规范定义的所有内置对象类型列表。\n\n当前的 Mozilla JavaScript\
  \ 规范定义了以下内置对象类型：\n\n* `Global`: 一个特殊的对象类型，用于创建一个且仅创建一个对象来持有全局内置属性和函数。注意，ECMAScript\
  \ 仅支持一个 `Global` 类型的单一对象。不允许使用 `Global()` 构造函数创建其他 Global 对象。\n* `Object`: 对象类型树中的根对象类型。所有其他对象类型都继承自\
  \ `Object` 对象类型。\n* `Function`: 用于创建函数的对象类型。所有函数都是 `Function` 对象类型的实例。\n* `Boolean`:\
  \ 用于创建 `Boolean` 对象的对象类型。`Boolean` 对象类型允许将布尔原始值作为对象处理。\n* `Symbol`: 用于存储所有可能用 `Object`\
  \ 属性键的非字符串值的对象类型。\n* `Error`、`AggregateError`、`EvalError`、`InternalError`、`RangeError`、`ReferenceError`、`SyntaxError`、`TypeError`、`URIError`:\
  \ 用于异常处理过程中错误对象的对象类型。\n* `Number`: 用于创建数字对象的对象类型。`Boolean` 对象类型允许将数字原始值作为对象处理。（注：此处原文可能有误，应为\
  \ Number）\n* `BigInt`: 用于创建大于 `2⁵³ - 1` 的整数的对象类型。\n* `Math`: 一个特殊的对象类型，用于创建一个且仅创建一个对象来持有数学相关的属性和函数。\n\
  * `Date`: 用于创建日期和时间对象的对象类型。\n* `String`: 用于创建字符串对象的对象类型。`String` 对象类型允许将字符串原始值作为对象处理。\n\
  * `RegExp`: 用于文本处理正则表达式对象的对象类型。\n* `Array`、`Int8Array`、`Uint8Array`、`Uint8ClampedArray`、`Int16Array`、`Uint16Array`、`Int32Array`、`Uint32Array`、`Float32Array`、`Float64Array`、`BigInt64Array`、`BigUint64Array`:\
  \ 用于创建数组的对象类型。所有数组都是 `Array` 类型的对象。\n* `Map`: 用于存储键值对并记住键的原始插入顺序的对象类型。任何值（对象和原始值）都可以作为键或值。\n\
  * `Set`: 用于存储任何类型的唯一值（无论是原始值还是对象引用）的对象类型。\n* `ArrayBuffer`、`SharedArrayBuffer`、`Atomics`、`DataView`:\
  \ 用于表示通用固定长度原始二进制数据的对象类型。\n* `JSON`: 用于解析 JavaScript 对象表示法 (JSON) 和将值转换为 JSON 的对象类型。\n\
  * `Promise`: 用于表示异步操作最终完成（或失败）及其结果值的对象类型。\n* `Generator`、`GeneratorFunction`: 生成器函数返回对象的对象类型。\n\
  * `AsyncFunction`: 创建异步异步函数的对象类型。在 JavaScript 中，每个异步函数实际上都是 `AsyncFunction` 对象。\n\
  * `Reflect`: 提供可拦截的 JavaScript 操作方法的对象类型。这些方法与代理处理器（proxy handlers）的方法相同。`Reflect`\
  \ 不是函数对象，因此不可构造的。\n* `Proxy`: 用于为基本操作（例如属性查找、赋值、枚举、函数调用等）定义自定义行为的对象类型。\n\n查看后续章节以获取上述某些内置对象类型的快速介绍。\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n# \"Object\" 对象类型 - 根对象类型\n\n本节提供了 `Object` 内置对象类型的快速描述和教程示例脚本，它是所有其他对象类型的根或基对象类型。\n\
  \n\"Object\" 对象类型可能是最重要的内置对象类型。它具有以下主要特征：\n\n* `Object` 是对象类型树中的根（或基）对象类型。所有其他对象类型都继承自\
  \ `Object` 对象类型。\n* `Object` 对象可以通过 `Object()` 构造函数创建。\n* `Object` 对象也可以通过对象字面量创建：`{property:\
  \ value, ...}`。\n\n这是一个教程示例脚本，向你展示了其中一些特征：\n\n\n\n\n\n```\n // Object_Object_Type.js\n\
  // Copyright (c) HerongYang.com. All Rights Reserved.\n\n   // 创建一个 \"Object\" 类型的对象\n\
  \   var myObject = new Object();\n\n   // 为对象添加属性\n   myObject.name = \"Unknown\"\
  ;\n   myObject.size = \"1.71m\";\n   myObject.weigth = \"65kg\";\n\n   // 检查对象\n\
  \   println(\"About the myObject:\");\n   println(\"   Type: \"+(typeof myObject));\n\
  \   println(\"   Instance Of Object: \"+(myObject instanceof Object));\n   println(\"\
  \   Properties:\");\n   for (var item in myObject) {\n      println(\"      \"+item+\"\
  : \"+myObject[item]);\n   }\n\n   // 创建一个 \"Book\" 类型的对象\n   var myBook = new Book(\"\
  JavaScript Tutorial\", \"Herong Yang\");\n\n   // 检查对象\n   println(\"About the myBook:\"\
  );\n   println(\"   Type: \"+(typeof myBook));\n   println(\"   Instance Of Object:\
  \ \"+(myBook instanceof Object));\n   println(\"   Instance Of Book: \"+(myBook\
  \ instanceof Book));\n   println(\"   Properties:\");\n   for (var item in myBook)\
  \ {\n      println(\"      \"+item+\": \"+myBook[item]);\n   }\n\n// 定义新对象类型的构造函数\n\
  function Book(title, author) {\n   this.title = title;\n   this.author = author;\n\
  }\n```\n\n如果你使用 `jrunscript` 运行此脚本，将得到：\n\n```\n About the myObject:\n   Type: object\n\
  \   Instance Of Object: true\n   Properties:\n      weigth: 65kg\n      name: Unknown\n\
  \      size: 1.71m\n\nAbout the myBook:\n   Type: object\n   Instance Of Object:\
  \ true\n   Instance Of Book: true\n   Properties:\n      title: JavaScript Tutorial\n\
  \      author: Herong Yang\n```\n\n`myBook` 是 `Book` 和 `Object` 的实例，因为 `Book` 默认是\
  \ `Object` 的子类型。\n\n阅读其他与 \"Object\" 相关的章节查看更多教程示例。\n\nJavaScript 教程 - Herong 的教程示例\n\
  \n∟内置对象类型介绍\n\n## \"Global\" 对象类型 - 不见的全局容器\n\n本节提供了 `Global` 内置对象类型的简要描述和一个教程示例脚本，该类型用于创建一个默认的不可见全局对象，以存储所有的全局属性和函数。\n\
  \n\"Global\" 对象可能是最神秘的内置对象类型。它具有以下主要特征：\n\n- \"Global\" 是一个保留对象类型。你不能创建自己的 \"Global\"\
  \ 对象。`Global()` 构造函数是不可用的。\n- 主环境会创建一个默认的 \"Global\" 对象，它没有赋值给任何引用变量。因此这个 \"Global\"\
  \ 对象是不可见的。\n- 然而，通过使用 `this` 关键字，可以在全局执行上下文（任何函数之外）看到这个不可见的 \"Global\" 对象。\n- 你可以使用表达式\
  \ `this instanceof Global` 来检查 `this` 的对象类型，因为 `Global()` 是不可用的。\n- 创建 \"Global\"\
  \ 对象是为了存储主环境提供的所有内置属性和函数，例如 `NaN`、`eval()` 等。\n- 从技术上讲，内置属性或函数都定义为 \"Global\" 对象的属性。但你可以直接使用它们，而无需引用\
  \ `Global` 对象。\n\n这里有一个显示其中一些特的教程示例脚本：\n\n```\n // Global_Object_Type.js\n// Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n\n   // Global() 构造函数不可用 \n   // var\
  \ myGlobal = new Global();\n\n   println(\"\\nAbout this \\\"this\\\":\");\n   println(\"\
  \   Type = \"+(typeof this));\n   println(\"   Instance Of Object: \"+(this instanceof\
  \ Object));\n\n   // 不允许使用 \"instanceof Global\"\n   // println(\"   Instance Of\
  \ Global: \"+(this instanceof Global));\n\n   // toString() 将提供更多信息\n   println(\"\
  \   toString() = \"+this.toString());\n\n   // 直接访问全局属性\n   println(\"\\nChecking\
  \ NaN:\");\n   println(\"   NaN: Type = \"+(typeof NaN) \n      + \", Value = \"\
  +NaN);\n\n   // 间接访问全局属性\n   println(\"\\nChecking this.NaN:\");\n   println(\"\
  \   this.NaN: Type = \"+(typeof this.NaN) \n      + \", Value = \"+this.NaN);\n\n\
  \   // 测试全局函数\n   println(\"\\nTesting eval() in two ways:\");\n   println(\"  \
  \ eval('7*7') = \"+eval('7*7')); \n   println(\"   this.eval('7*7') = \"+this.eval('7*7'));\n\
  ```\n\n如果你使用 `jrunscript` 运行此脚本，将得到：\n\n```\n About this \"this\":\n   Type = object\n\
  \   Instance Of Object: true\n   toString() = [object Global]\n\nChecking NaN:\n\
  \   NaN: Type = number, Value = NaN\n\nChecking this.NaN:\n   this.NaN: Type = number,\
  \ Value = NaN\n\nTesting eval() in two ways:\n   eval('7*7') = 49\n   this.eval('7*7')\
  \ = 49\n```\n\n`this.toString()` 证明 `this` 是一个 `Global` 对象。\n\nJavaScript 教程 - Herong\
  \ 的教程示例\n\n∟内置对象类型介绍\n\n## ECMAScript 中定义的全局属性和函数\n\n本节提供了 ECMAScript 规范中提到的所有全局属性和函数的简要描述。\n\
  \n在 ECMAScript 规范中提到的不可见 \"Global\" 对象中，有 3 个包含原始值的内置全局属性：\n\n- \"NaN\" - 全局属性，持有特殊的数字值：`NaN`（非数字）。\n\
  - \"Infinity\" - 全局属性，持有特殊的数字值：`Infinity`（无穷大）。\n- \"undefined\" - 全局属性，持有未定义值：`undefined`。\n\
  \n在 ECMAScript 规范中提到的不可见 \"Global\" 对象中，包含 9 个常规内置全局函数：\n\n- `eval(x)` - 将指定的字符串作为\
  \ JavaScript 表达式求值并返回结果。\n- `parseInt(string, radix)` - 根据指定的基数解释字符串参数的内容，产生一个整数值。\n\
  - `parseFloat(string)` - 根据对字符串参数内容作为十进制字面量的解释，产生一个数值。\n- `isNaN(number)` - 如果指定的数字是\
  \ `NaN` 则返回 `true`。\n- `isFinite(number)` - 如果指定的数字是有限数字，则返回 `true`。\n- `decodeURI(encodedURI)`\
  \ - 将编码的 URI 字符串解码回 URI 字符串。\n- `decodeURIComponent(encodedURIComponent)` - 将编码的\
  \ URI 组件字符串解码回 URI 组件字符串。\n- `encodeURI(uri)` - 通过将除以下字符的所有字符（字母、数字、- _ . ! ~ *\
  \ ' ( ) # ; , / ? : @ & = = + $）替换为转义序列，对 URI 字符串进行编码。\n- `encodeURIComponent(uriComponent)`\
  \ - 通过将除以下字符的所有字符（字母、数字、- _ . ! ~ * ' ( )）替换为转义序列，对 URI 组件字符串进行编码。\n\n在 ECMAScript\
  \ 规范中提到的不可见 \"Global\" 对象中，包含 9 个特殊的内置全局函数。这些函数实际上是内置对象类型的构造函数：\n\n- `Object()`\
  \ - Object 类型的构造函数。\n- `Function(...)` - Function 类型的构造函数。\n- `Array(...)` - Array\
  \ 类型的构造函数。\n- `String(...)` - String 类型的构造函数。\n- `Boolean(...)` - Boolean 类型的构造函数。\n\
  - `Number(...)` - Number 类型的构造函数。\n- `Date(...)` - Date 类型的构造函数。\n- `RegExp(...)`\
  \ - RegExp 类型的构造函数。\n- `Error(...)` - Error 类型的构造函数。\n\n在 ECMAScript 规范中提到的不可见 \"\
  Global\" 对象中，包含 1 个带有对象值的全局属性：\n\n- \"Math\" - 全局属性，持有默认的 \"Math\" 对象，该对象包含了所有与数学相关的属性和函数。\n\
  \n为了验证这些全局属性和函数，我编写了这个简单的脚本：\n\n\n\n\n\n```javascript\n // Global_Object_Properties.js\n\
  // Copyright (c) HerongYang.com. All Rights Reserved.\n\n   println(\"\\nGlobal\
  \ primitive-value properties:\");\n   println(\"   NaN: Type = \"+(typeof this.NaN)\
  \ \n      + \", Value = \"+this.NaN);\n   println(\"   Infinity: Type = \"+(typeof\
  \ this.Infinity) \n      + \", Value: \"+this.Infinity);\n   println(\"   undefined:\
  \ Type = \"+(typeof this.undefined) \n      + \", Value = \"+this.undefined);\n\n\
  \   println(\"\\nGlobal functions:\");\n   println(\"   eval: Value = \"+this.eval);\n\
  \   println(\"   parseInt: Value = \"+this.parseInt);\n   println(\"   parseFloat:\
  \ Value = \"+this.parseFloat);\n   println(\"   isNaN: Value = \"+this.isNaN);\n\
  \   println(\"   isFinite: Value = \"+this.isFinite);\n   println(\"   decodeURI:\
  \ Value = \"+this.decodeURI);\n   println(\"   decodeURIComponent: Value = \"+this.decodeURIComponent);\n\
  \   println(\"   encodeURI: Value = \"+this.encodeURI);\n   println(\"   encodeURIComponent:\
  \ Value = \"+this.encodeURIComponent);\n\n   println(\"\\nGlobal constructors:\"\
  );\n   println(\"   Object: Value = \"+this.Object);\n   println(\"   Function:\
  \ Value = \"+this.Function);\n   println(\"   Array: Value = \"+this.Array);\n \
  \  println(\"   String: Value = \"+this.String);\n   println(\"   Boolean: Value\
  \ = \"+this.Boolean);\n   println(\"   Number: Value = \"+this.Number);\n   println(\"\
  \   Date: Value = \"+this.Object);\n   println(\"   RegExp: Value = \"+this.RegExp);\n\
  \   println(\"   Error: Value = \"+this.Error);\n\n   println(\"\\nGlobal object-value\
  \ property:\");\n   println(\"   Math: Type = \"+(typeof this.Math) \n      + \"\
  , Value = \"+this.Math);\n```\n\n如果你使用 `jrunscript` 运行此脚本，将得到：\n\n```\n Global primitive-value\
  \ properties:\n   NaN: Type = number, Value = NaN\n   Infinity: Type = number, Value\
  \ = Infinity\n   undefined: Type = undefined, Value = undefined\n\nGlobal functions:\n\
  \   eval: Value = function eval() { [native code\n   parseInt: Value = function\
  \ parseInt() { [native code\n   parseFloat: Value = function parseFloat() { [native\
  \ code\n   isNaN: Value = function isNaN() { [native code\n   isFinite: Value =\
  \ function isFinite() { [native code\n   decodeURI: Value = function decodeURI()\
  \ { [native code\n   decodeURIComponent: Value = function decodeURIComponent() {\
  \ [native\n   encodeURI: Value = function encodeURI() { [native code\n   encodeURIComponent:\
  \ Value = function encodeURIComponent() { [native\n\nGlobal constructors:\n   Object:\
  \ Value = function Object() { [native code\n   Function: Value = function Function()\
  \ { [native code\n   Array: Value = function Array() { [native code\n   String:\
  \ Value = function String() { [native code\n   Boolean: Value = function Boolean()\
  \ { [native code\n   Number: Value = function Number() { [native code\n   Date:\
  \ Value = function Object() { [native code\n   RegExp: Value = function RegExp()\
  \ { [native code\n   Error: Value = function Error() { [native code\n\nGlobal object-value\
  \ property:\n   Math: Type = object, Value = [object Math]\n```\n\n这证实了 `jrunscript`\
  \ 支持 `ECMAScript` 规范中提到的所有全局属性和函数。\n\n# JavaScript 教程 - Herong 的教程示例\n\n## 内置对象类型介绍\n\
  \n### \"jrunscript\" 提供的全局属性和函数\n\n本节提供了 `jrunscript` 宿环境提供的所有额外全局属性和函数的快速描述。\n\n\
  除了 `ECMAScript` 规范中定义的全局属性和函数外，每个 JavaScript 实现都可能向不可见的 `Global` 对象中添加自己的全局属性和函数。\n\
  \n这里是一个教程示例脚本，它列出了 JavaScript 实现提供的所有全局属性和函数：\n\n```javascript\n // Global_Object_Properties_jrunscript.js\n\
  // Copyright (c) HerongYang.com. All Rights Reserved.\n\n   println(\"\\nList of\
  \ global properties:\");\n   for (item in this) {\n      println(\"   \"+item+\"\
  : \"+this[item]);\n   }\n```\n\n如果你使用 `jrunscript` 运行此脚本，将得到一个包含 59 个属性和函数的列表。全局函数的函数体也列在输出中。以下是一些示例：\n\
  \n```\n List of global properties:\n   ...\n\n   javax.script.filename: Global_Object_Properties_jrunscript.js\n\
  \n   months: Jan,Feb,Mar,Apr,May,Jun,Jul,Aug,Sep,Oct,Nov,Dec\n\n   cp: \nfunction\
  \ cp(from, to) {\n    if (from == to) {\n        println(\"file \" + from + \" cannot\
  \ be copied onto itself!\");\n        return;\n    }\n    var inp = inStream(from);\n\
  \    var out = outStream(to);\n    var binp = new BufferedInputStream(inp);\n  \
  \  var bout = new BufferedOutputStream(out);\n    var buff = javaByteArray(1024);\n\
  \    var len;\n    while ((len = binp.read(buff)) > 0) {\n        bout.write(buff,\
  \ 0, len);\n    }\n    bout.flush();\n    streamClose(inp);\n    streamClose(out);\n\
  }\n\n   read: \nfunction read(prompt, multiline) {\n    if (!prompt) {\n       \
  \ prompt = \">\";\n    }\n    var inp = java.lang.System[\"in\"];\n    var reader\
  \ = new BufferedReader(new InputStreamReader(inp));\n    if (multiline) {\n    \
  \    var line = \"\";\n        while (true) {\n            java.lang.System.err.print(prompt);\n\
  \            java.lang.System.err.flush();\n            var tmp = reader.readLine();\n\
  \            if (tmp == \"\" || tmp == null) {\n                break;\n       \
  \     }\n            line += tmp + \"\\n\";\n        }\n        return line;\n \
  \   } else {\n        java.lang.System.err.print(prompt);\n        java.lang.System.err.flush();\n\
  \        return reader.readLine();\n    }\n}\n\n   print: \nfunction print(str,\
  \ newline) {\n    if (typeof (str) == \"undefined\") {\n        str = \"undefined\"\
  ;\n    } else {\n        if (str == null) {\n            str = \"null\";\n     \
  \   }\n    }\n    var out = context.getWriter();\n    out.print(String(str));\n\
  \    if (newline) {\n        out.print(\"\\n\");\n    }\n    out.flush();\n}\n\n\
  \   println: \nfunction println(str) {\n    print(str, true);\n}\n\n   ...\n```\n\
  \n现在我们知道了 `println()` 在 `jrunscript` 中是如何实现的。\n\n# JavaScript 教程 - Herong 的教程示例\n\
  \n## 内置对象类型介绍\n\n### \"Function\" 对象类型 - 函数也是对象\n\n本节提供了关于用于创建函数的 `Function` 对象类型的快速描述和教程示例脚本。\n\
  \n`Function` 对象类型是一种用于创建新函数的特殊内置对象类型。它具有以下主要特性：\n\n* 可以使用 `Function()` 构造函数创建新函数。\n\
  * 所有 `Function` 对象都有一个名为 `length` 的继承属性，表示函数的参数个数。\n* 所有 `Function` 对象都有 3 个继承的方法：`apply()`、`call()`\
  \ 和 `toString()`。\n* `Function` 对象可以拥有自己的属性，以便在多次调用之间共享值。\n* `Function` 对象也可以通过函数字面量创建：`function\
  \ name(param...) {body...}`。\n* 当然，`Function` 对象也可以传统的方式创建——函数声明语句：`function name(param...)\
  \ {body...}`。\n\n```javascript\nfunction function_name { statement_1; statement_2;\
  \ ... return return_expression };\n```\n\n这里是一个展示其中一些特性的教程示例脚本：\n\n\n\n\n\n```javascript\n\
  \ // Function_Object_Type.js\n// Copyright (c) HerongYang.com. All Rights Reserved.\n\
  \n   // 使用 \"Function()\" 构造创建一个新函数\n   var sign = new Function(\"name\",\n    \
  \  \"this.signature = name;\"\n      + \"sign.count++;\"\n   )\n\n   // 为函数添加一个实例属性\n\
  \   sign.count = 0;\n\n   // 检查此对象\n   println(\"\\nAbout this \\\"sign\\\":\");\n\
  \   println(\"   Type = \"+(typeof sign));\n   println(\"   Instance Of Object:\
  \ \"+(sign instanceof Object));\n   println(\"   Instance Of Function: \"+(sign\
  \ instanceof Function));\n\n   // 在当前对象上执行\n   sign(\"Herong\");\n\n   // 在另一个对象上调用\n\
  \   var pc = new Object();\n   sign.call(pc, \"IBM\");\n\n   // 检查签名\n   println(\"\
  \\nExecution result:\");\n   println(\"   this.signature = \" + this.signature);\n\
  \   println(\"   pc.signature = \" + pc.signature);\n   println(\"   # of calls\
  \ = \" + sign.count);\n```\n\n如果你使用 `jrunscript` 运行此脚本，你将得到：\n\n```\n About this\
  \ \"sign\":\n   Type = function\n   Instance Of Object: true\n   Instance Of Function:\
  \ true\n\nExecution result:\n   this.signature = Herong\n   pc.signature = IBM\n\
  \   # of calls = 2\n```\n\n现在我们知道如何使用 `Function()` 构造函数创建函数了。\n\n阅读其他关于 \"Function\"\
  \ 的章节以查看更多教程示例。\n\nJavaScript Tutorials - Herong's Tutorial Examples\n\n∟内置对象类型介绍\n\
  \n## \"Array\" 对象类型 - 数组是对象\n\n本节提供了关于 `Array` 内置对象类型的简要描述和教程示例脚本，该类型用于创建数组。\n\n\
  `Array` 对象类型是一种特殊的内置对象类型，用于创建新数组。它具有以下主要特征：\n\n-   可以使用 `Array()` 构造函数创建新数组。\n-\
  \   所有的 `Array` 对象都拥有一个名为 `length` 的继承属性，表示数组的元素个数。\n-   所有的 `Array` 对象都有许多继承的方法：`reverse()`、`sort()`、`indexOf()`、`push()`、`pop()`、`shift()`\
  \ 等。\n-   数组中的所有元素实际上都是以索引为属性名的属性。\n-   可以使用数组字面量 `[elements...]` 创建 `Array` 对象。\n\
  -   可以使用 `Array` 函数 `Array(elements...)` 创建 `Array` 对象。\n\n以下是一个展示了其中一些特征的教程示例脚本：\n\
  \n```javascript\n // Array_Object_Type.js\n// Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n\n   // 创建新数组\n   var colors = new Array(\"Red\", \"Green\"\
  , \"Blue\");\n\n   // 检查此对象\n   println(\"\\nAbout this \\\"colors\\\":\");\n  \
  \ println(\"   Type = \"+(typeof colors));\n   println(\"   Instance Of Object:\
  \ \"+(colors instanceof Object));\n   println(\"   Instance Of Array: \"+(colors\
  \ instanceof Array));\n\n   println(\"\\nList of array properties:\");\n   for (item\
  \ in colors) {\n      println(\"   \"+item+\" = \"+colors[item]);\n   }\n\n   //\
  \ 使用数组继承的属性和方法\n   colors.push(\"Yellow\");\n   colors.sort();\n\n   // 通过索引访问元素\n\
  \   println(\"\\nAfter push() and sort():\");\n   for (var i=0; i<colors.length;\
  \ i++) {\n      println(\"   \"+i+\" = \"+colors[i]);\n   }\n```\n\n如果你使用 `jrunscript`\
  \ 运行此脚本，你将得到：\n\n```\n About this \"colors\":\n   Type = object\n   Instance Of\
  \ Object: true\n   Instance Of Array: true\n\nList of array properties:\n   0 =\
  \ Red\n   1 = Green\n   2 = Blue\n\nAfter push() and sort():\n   0 = Blue\n   1\
  \ = Green\n   2 = Red\n   3 = Yellow\n```\n\n现在我们知道如何使用 `Array()` 构造函数创建数组了。\n\n\
  阅读其他关于 \"Array\" 的章节以查看更多教程示例。\n\nJavaScript Tutorials - Herong's Tutorial Examples\n\
  \n∟内置对象类型介绍\n\n## \"JSON\" 对象类型 - parse() 和 stringify\n\n本节提供了关于 `JSON` 内置对象类型的简要描述和教程示例脚本，该类型用于解析\
  \ JSON 字符串以创建 JavaScript 结构化值，并将 JavaScript 结构化值转换为 JSON 字符串。\n\n`JSON` 类型提供了两个静态函数来解析和生成\
  \ JSON 文本字符串：\n\n1. `JSON.parse()` - 从 JSON 文本字符串解析文本字符串，构建 JavaScript 值。可以提供一个可选的\
  \ `reviver` 函数在返回结果对象之前对其进行转换。\n2. `JSON.stringify()` - 将 JavaScript 值转换为 JSON 文本字符串。指定一个可选的\
  \ `replacer` 函数来替换某些值。\n\n以下是一个 JavaScript 代码示例 `JSON.html`，它向你展示如何使用内置的 `JSON`\
  \ 对象：\n\n```html\n <html>\n<body>\n<script type=\"text/javascript\">\n   var object\
  \ = {\"msg\":\"Hello World!\"};\n   var str = JSON.stringify(object);\n\n   document.write(\"\
  <p>JSON text string from JSON.stringify():</p>\");\n   document.write(\"<pre>str\
  \ = \"+str+\"</pre>\");\n\n   var val = JSON.parse(str);\n   document.write(\"<p>Value\
  \ from JSON.parse():</p>\");\n   document.write(\"<pre>val.msg = \"+val.msg+\"</pre>\"\
  );\n</script>\n</body>\n</html>\n```\n\n在 浏览器中打开此示例 `JSON.html`。你会看到以下内容：\n\n```\n\
  \ JSON text string from JSON.stringify():\n   str = {\"msg\":\"Hello World!\"}\n\
  \nValue from JSON.parse():\n   val.msg = Hello World!\n```\n\nJavaScript Tutorials\
  \ - Herong's Tutorial Examples\n\n∟内置对象类型介绍\n\n## \"String\" 对象类型 - 不等于字符串原始类型\n\
  \n本节提供了关于 `String` 内置对象类型的简要描述和教程示例脚本，该类型用于创建 `String` 对象。注意：`String` 对象不是字符串值。\n\
  \n`String` 对象类型是一种特殊的内置对象类型，用于创建 `String` 对象，这与字符串原始类型的字符串值不同。它具有以下主要特征：\n\n-  \
  \ 可以使用 `String()` 构造函数创建新的 `String` 对象。注意 `String()` 也是一个普通函数，返回的是字符串值而不是 `String`\
  \ 对象。\n-   所有的 `String` 对象都拥有一个名为 `length` 的继承属性，表示字符串的字符个数。\n-   所有的 `String` 对象都有许多继承的方法：`toString()`、`charAt()`、`charCodeAt()`、`concat()`、`indexOf()`\
  \ 等。访问这些继承方法是使用 `String` 对象而不是字符串值的主要原因。\n-   字符串字面量 `\"...\"` 创建的是字符串值，而不是 `String`\
  \ 对象。\n-   可以使用 `.` 运算符临时将字符串值转换为 `String` 对象，例如：`\"string\".length`。\n\n以下是一个展示了其中一些特征的教程示例脚本：\n\
  \n```javascript\n // String_Object_Type.js\n// Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n\n   // 创建一个新的新的 String 对象\n   var message = new String(\"Hello\
  \ World!\");\n\n   // 检查此对象\n   println(\"\\nAbout this \\\"message\\\":\");\n \
  \  println(\"   Type = \"+(typeof message));\n   println(\"   Instance Of Object:\
  \ \"+(message instanceof Object));\n   println(\"   Instance Of String: \"+(message\
  \ instanceof String));\n\n   // 使用 String 继承的属性和方法\n   var upperMessage = message.toUpperCase();\n\
  \   var l = message.length;\n   var subMessage = message.substring(0,l-7);\n\n \
  \  println(\"\\nExecution result:\");\n   println(\"   typeof message = \"+(typeof\
  \ message));\n   println(\"   message.toString() = \"+message.toString());\n   println(\"\
  \   typeof upperMessage = \"+(typeof upperMessage));\n   println(\"   upperMessage\
  \ = \"+upperMessage);\n   println(\"   typeof subMessage = \"+(typeof subMessage));\n\
  \   println(\"   subMessage = \"+subMessage);\n\n   println(\"\\nConverting to String\
  \ objects on the fly:\");\n   println(\"   \\\"...\\\".length = \"+(\"Hello World!\"\
  .length));\n   println(\"   \\\"...\\\".toUpperCase() = \"\n      +(\"Hello World!\"\
  .toUpperCase()));\n```\n\n如果你使用 `jrunscript` 运行此脚本，你将得到：\n\n\n\n\n\n```\n About\
  \ this \"message\":\n   Type = object\n   Instance Of Object: true\n   Instance\
  \ Of String: true\n\nExecution result:\n   typeof message = object\n   message.toString()\
  \ = Hello World!\n   typeof upperMessage = string\n   upperMessage = HELLO WORLD!\n\
  \   typeof subMessage = string\n   subMessage = Hello\n\nConverting to String objects\
  \ on the fly:\n   \"...\".length = 12\n   \"...\".toUpperCase() = HELLO WORLD!\n\
  ```\n\n现在我们知道如何使用 `String()` 构造函数来创建 \"String\" 对象了。\n\n阅读与其他 \"String\" 相关的章节查看更多教程示例。\n\
