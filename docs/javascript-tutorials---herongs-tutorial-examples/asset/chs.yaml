  \n结论：\n\n* Web 应用程序可以在三个领域使用脚本：服务端脚本、用于页面文档构建的客户端脚本，以及用于浏览器事件处理的客户端脚本。\n* 在页面文档构建过程中使用\
  \ JavaScript 时，浏览器将多轮扫描并执行脚本。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟服务端和客户端 Web 脚本\n\
  \n## Web 脚本架构概览\n\n本节提供了典型的 Web 脚本处理流程架构概述，显示了服务端和客户端的脚本步骤。\n\n正如我们在之前的章节中看到的，JavaScript\
  \ 代码可以用于三个领域来帮助构建网站或基于 Web 的应用程序：\n\n* 服务端脚本 - 嵌入在 HTML 文档中的脚本，在发送到客户端（Web 浏览器）之前由\
  \ Web 服务器处理。服务端脚本通常用于与数据库或其他后端应用程序交互，并将动态数据引入 HTML 文档。\n* 用于页面文档构建的客户端脚本 - 嵌入在 HTML\
  \ 文档中的脚本，在浏览器窗口上渲染页面文档之前由 Web 浏览器处理。\n* 用于浏览器事件处理的客户端脚本 - 嵌入在 HTML 文档中的脚本，当用户与浏览器窗口交互时由\
  \ Web 浏览器处理。\n\n下面的图显示了服务端脚本和客户端脚本如何共同工作，在典型的 Web 应用程序流程架构中执行不同的功能：\n\n![](img/image00139.jpeg)\n\
  \nWeb 脚本流程架构\n\n图中使用的红线表示可以使用 JavaScript 的地方。此 Web 脚本流程架构图的不同部分将在稍后进行解释。\n\nJavaScript\
  \ 教程 - Herong 的教程示例\n\n∟服务端和客户端 Web 脚本\n\n## 服务端脚本概述\n\n本节提供了 Web 服务端脚本处理流程的概述。Web\
  \ 服务器会移除脚本代码并执行它。\n\n服务端脚本发生在下方所示的第 4 步：\n\n![](img/image00140.jpeg)\n\n服务端脚本流程\n\
  \n步骤 1：用户输入新的 Web 页面地址或点击需要从 Web 服务器获取新 Web 页面的链接。\n步骤 2：Web 浏览器连接到 Web 服务器并发送带有请求\
  \ Web 页面路径名的 `HTTP GET` 命令。\n步骤 3： Web 服务器获取请求页面的 HTML 文档，或请求应用程序服务器生成 HTML 文档。\n\
  步骤 4：服务端脚本步骤：Web 服务器扫描 HTML 文档查找其中嵌入的任何服务端脚本代码。Web 服务器将移除嵌入的脚本代码并执行它。\n\n当 Web 服务器执行嵌入的脚本代码时，它将提供许多代表主机环境的主机对象。通过这些主机对象，服务端脚本可以轻松访问载的\
  \ HTML 文档、服务器文件系统、任何数据库以及网络计算机。\n\n通常，服务端脚本代码将根据其计算产生的动态数据更新载的 HTML 文档。\n\n在服务端脚本处理步骤结束时，更新后的\
  \ HTML 文档准备好发送回客户端——Web 浏览器。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟服务端和客户端 Web 脚本\n\
  \n## 用于文档更新的客户端脚本\n\n本节提供了客户端脚本的概述。某些脚本被执行以更新页面文档的最终渲染。某些脚本被注册为事件处理程序以便稍后执行。\n\n\
  用于页面文档更新的服务端脚本发生在下方所示的第 6 步和 7a 步：\n\n![](img/image00141.jpeg)\n\n用于文档更新的客户端脚本\n\
  \n步骤 5：Web 服务器将最终的 HTML 文档发送给 Web 浏览器。\n\n\n\n\n\n# 第 6 ：客户端脚本步骤\nWeb 浏览器扫描 HTML\
  \ 文档，查找其中嵌入的任何客户端脚本代码。Web 浏览器将移除嵌入的脚本代码并执行它。当浏览器执行嵌入的脚本代码时，它会提供许多代表客户端宿主环境机对象。通过这些主机对象，客户端脚本代码可以访问承载的\
  \ HTML 文档和浏览器窗口。出于安全考虑，客户端脚本代码无法访问文件系统或客户端机器浏览器之外的任何内容。\n\n### 第 7a \n某些客户端脚本会在浏览器窗口渲染之前更新页面文档对象（document\
  \ object）。\n\n### 第 7b \n某些客户端脚本将被注册为各种事件的处理器，这些事件会在浏览器窗口及其页面 UI 控件上触发。在终端用户触发这些事件之前，这些脚本将不会执行。\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n∟服务器端与客户端 Web 脚本\n\n∟用于事件处理的客户端脚本\n\n本节提供了用于事件处理的客户端脚本的概述。当终端用户在最终的\
  \ Web 页面上触发事件时，注册为事件处理程序的脚本将会被执行。\n\n用于窗口事件处理的服务器端脚本发生在第 7b 步和第 10 步，如下所示：\n\n![](img/image00142.jpeg)\n\
  \n### 用于事件处理的客户端脚本\n\n### 第 7b\n某些客户端脚本将被注册为各种事件的处理器，这些事件会在浏览器窗口及其页面 UI 控件上触发。在终端用户触发这些事件之前，这些脚本将不会执行。\n\
  \n### 第 8\n由某些客户端脚本更新的页面文档对象由 Web 浏览器在浏览器窗口上渲染，向用户显示最终的 Web 页面。\n\n### 第 9 \n用户在\
  \ Web 页面上输入某些内容或点击某些 UI 控件。这将触发一个或多个事件。\n\n### 第 10\nWeb 浏览器执行注册为触发事件处理器的客户端脚本。Web\
  \ 浏览器将提供许多代表客户端宿主环境机对象。通过这些主机对象，事件处理器脚本可以访问页面文档和浏览器窗口。出于安全考虑，客户端脚本代码无法访问文件系统或客户端机器浏览器之外的任何内容。\n\
  \n### 第 7a \n某些事件处理器脚本将更新在浏览器窗口上渲染的页面文档对象。\n\n### 第 11 \n某些事件处理器脚本将强制 Web 浏览器请求一个新的\
  \ Web 页面。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟服务器端与客户端 Web 脚本\n\n∟多次处理的客户端脚本过程\n\
  \n本节提供了一个 JavaScript 代码教程示例，该代码将另一段 JavaScript 代码插入回 HTML 文档中。Web 浏览器会多次执行脚本代码。\n\
  \n正如我们之前学到的，当 Web 浏览器从 Web 服务器接收 HTML 文档时，它会移除所有嵌入的脚本代码并执行它们。\n\n如果在第一轮脚本执行期间向 HTML\
  \ 文档中插入了新的脚本代码会发生什么？Web 浏览器将移除插入的脚本代码并再次执行它。\n\n这是一个有趣的 JavaScript 代码教程示例，它将另一段\
  \ JavaScript 代码插入 HTML 文档中：\n\n```javascript\n <html\n<!-- Hello_Nested_Scripts.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Hello\
  \ from Nested Scripts</title></head>\n<body><pre>\n<script type=\"text/javascript\"\
  >\n   document.writeln(\"Hello World!\");\n   document.writeln(\"<script type=\\\
  \"text/javascript\\\">\");\n   document.writeln(\"document.writeln(\\\" Hello World!\\\
  \");\");\n   document.writeln(\"<\\/script>\");\n</script>\n</pre></body>\n</</html>\n\
  ```\n\n猜猜如果你运行这个 HTML 文档，你会在浏览器窗口上看到什么。\n\n```\n Hello World!\n Hello World!\n```\n\
  \n发生的情况是，当浏览器完成嵌入的 JavaScript 代码的执行时，它将得到如下 HTML 文档：\n\n```html\n Hello World!\n\
  <script type=\"text/javascript\">\ndocument.writeln(\" Hello World!\");\n</script>\n\
  ```\n\n输出中还有另一个 JavaScript 代码。浏览器将再次执行它，导致你之前看到的最终 HTML 文档。\n\nJavaScript 教程 - Herong\
  \ 的教程示例\n\n∟服务器端与客户端 Web 脚本\n\n∟由两个原始脚本产生的新脚本\n\n本节提供了一个教程示例，展示了 Web 浏览器如何无法执行由两个原始\
  \ JavaScript 代码产生的 JavaScript 代码。\n\n实际上，只有当新脚本代码是单次执行的结果时，Web 浏览器才能正确处理它。\n\n这里有一个包含两个\
  \ JavaScript 代码的 HTML 文档，它们协同工作返回一个新的 JavaScript 代码：\n\n```html\n <html\n<!-- Hello_Nested_Script_Error.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head><title>Hello\
  \ from Nested Script Error</title></head>\n<body><pre>\n<script type=\"text/javascript\"\
  >\n   document.writeln(\"-- Before the new script.\");\n   document.writeln(\"<script\
  \ type=\\\"text/javascript\\\">\");\n</script>\ndocument.writeln(\\\"Hello World!\\\
  \");\n<script type=\"text/javascript\">\n   document.writeln(\"<\\/script>\");\n\
  \   document.writeln(\"-- After the new script.\");\n</script>\n</pre></body>\n\
  </</html>\n```\n\n在第一轮 JavaScript 执行后，HTML 文档将拥有一个新的 JavaScript 代码：\n\n```\n --\
  \ Before the new script.\n<script type=\"text/javascript\">\ndocument.writeln(\\\
  \"Hello World!\\\");\n</script>\n-- After the new script.\n```\n\n如果 Web 浏览器再次执行\
  \ JavaScript 代码，最终的 HTML 文档将如下所示：\n\n```\n -- Before the new script.\nHello World!\n\
  -- After the new script.\n```\n\n但 Internet Explorer 和 Firefox 得到的结果是：\n\n```\n\
  \ -- Before the new script.\n```\n\n结论：如果脚本代码是由两个原始脚本代码产生的，Web 浏览器将无法执行它。\n\nJavaScript\
  \ 教程 - Herong 的教程示例\n\n∟对象简介\n\n本章提供了 JavaScript 中“对象”类型的介绍和教程示例。主题包括创建“对象”；添加属性和运行方法；命名属性和索引属性；数组的比较。\n\
  \n> 什么是对象？\n> Object 类型的对象\n> 添加和删除属性\n> 添加和删除方法\n> 使用 this 关键字表示当前对象\n> 对象字面量\n\
  > 对象与关联数组\n> 具有索引属性的对象\n> 数组与对象的区别\n> 将数组对象作为对象使用\n\n结论：\n\n* 对象是特殊类型“Object”或任何“原型”类型的实例。\n\
  * “Object”类型是所有“原型”类型的根。\n* 使用对象字面量创建新对象：`{n:v, ...}`。\n* 使用 `Object` 构造函数创建新对象：`New\
  \ Object()`。\n* 使用点 `.` 操作访问对象的属性或方法。\n* 使用点 `delete` 操作删除对象的属性或方法。\n\n\n\n\n\n\
  ## 什么是对象？\n\n本节简要介绍了 JavaScript 中什么是对象，以及创建和使用对象的一些有趣特性。此外还提供了一个教程示例。\n\n## 什么是对象？\n\
  \n对象是特殊数据类型 `\"Object\"` 或任何 `\"prototype\"` 数据类型的实例。\n\nJavaScript 支持具有以下有趣特性的对象：\n\
  \n*   对象是从 `\"prototype\"` 实例化的，而不是像其他语言那样从 `\"class\"` 或 `\"struct\"` 实例化。\n* \
  \  `\"Object\"` 数据类型的对象可以使用对象初始化运算符 (`{}`) 创建。\n*   `\"Object\"` 数据类型和任何 `\"prototype\"\
  ` 数据类型的对象可以使用构造函数运算符 (`new`) 创建。\n*   当将对象赋值给变量时，变量中存储的是对象的引用。这与将基本值赋值给变量不同，后者是值本身被存储在变量中的。\n\
  *   对象只能有公共属性和公共方法。\n*   可以使用点运算符 (`.`) 访问属性和方法。\n*   JavaScript 中的对象等同于其他语言中的关联数组（associate\
  \ array）。\n*   可以使用数组运算符 (`[]`) 访问属性和方法。\n*   可以动态地为单个原型的所有对象添加新的属性和方法。\n*   可以动态地从单个原型的所有对象中删除现有的属性和方法。\n\
  *   可以动态地为一个对象添加新的属性和方法，而不影响同一原型的其他对象。\n*   可以动态地从一个对象删除现有的属性和方法，而不影响同一原型的其他对象。\n\
  *   JavaScript 提供了几个内置自定义数据类型：`Array`、`Boolean`、`Date`、`Function`、`Math`、`Number`、`RegExp`\
  \ 和 `String`。\n\n为了向这些特性，我编写了这个简单的教程示例来创建一个 `\"Object\"` 数据类型的对象，并在这个新对象上添加新属性：\n\
  \n```\n <html>\n<!-- Object_Data_Type_and_Value.html\n   Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n-->\n<head>\n<title>Object Data Type and Value</title>\n\
  </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n   // 将基本值赋值给变量\n \
  \  var jsSite = \"mozilla.org\";\n\n   // 创建对象并将其赋值给变量\n   var mySite = new Object();\n\
  \n   // 为一个对象添加新属性\n   mySite.name = \"herongyang.com\";\n\n   // 获取对象属性的值\n   document.writeln('\"\
  mySite.name\" property: '+mySite.name); \n\n   // 检查 mySite 的数据类型\n   document.writeln('\"\
  mySite\" data type: '+(typeof mySite)); \n\n   // 检查 jsSite 的数据类型\n   document.writeln('\"\
  jsSite\" data type: '+(typeof jsSite)); \n</script>\n</pre>\n</body>\n</html>\n\
  ```\n\n运行此示例，你将得到：\n\n```\n \"mySite.Name\" property: herongyang.com\n\"mySite\"\
  \ data type: object\n\"jsSite\" data type: string\n```\n\nJavaScript 教程 - Herong\
  \ 的教程示例\n\n# 对象介绍\n\n## \"Object\" 数据类型的对象\n\n本节简要介绍了 `'Object'` 数据类型及其属性和方法。提供了一个如何创建和测试\
  \ `'Object'` 数据类型对象的教程示例。要学习如何在 JavaScript 中使用对象，我们需要从 `'Object'` 数据类型开始，它具有以下特性：\n\
  \n*   `\"Object\"` 数据类型的对象可以使用对象初始化运算符 (`{}`) 创建。\n*   `\"Object\"` 数据类型和任何 `\"\
  prototype\"` 数据类型的对象可以使用构造函数运算符 (`new`) 创建。\n*   可以使用点运算符 (`.`) 访问属性和方法。\n*   可以使用数组运算符\
  \ (`[]`) 访问属性和方法。\n\n这里是一个显示其中一些特性的教程示例：\n\n```\n <html>\n<!-- Object_Data_Type_and_Value.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Object\
  \ Data Type and Value</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
  >\n\n   // 将基本值赋值给变量\n   var jsSite = \"mozilla.org\";\n\n   // 创建对象并将其赋值给变量\n \
  \  var mySite = new Object();\n\n   // 为一个对象添加新属性\n   mySite.name = \"herongyang.com\"\
  ;\n\n   // 获取对象属性的值\n   document.writeln('\"mySite.name\" property: '+mySite.name);\
  \ \n\n   // 检查 mySite 的数据类型\n   document.writeln('\"mySite\" data type: '+(typeof\
  \ mySite)); \n\n   // 检查 jsSite 的数据类型\n   document.writeln('\"jsSite\" data type:\
  \ '+(typeof jsSite)); \n</script>\n</pre>\n</body>\n</html>\n```\n\n运行此示例，你将得到：\n\
  \n```\n \"mySite.Name\" property: herongyang.com\n\"mySite\" data type: object\n\
  \"jsSite\" data type: string\n```\n\n# 添加和删除对象属性\n\n本节简要介绍了如何添加、更新和删除属性。\n\n*  \
  \ 可以动态地为一个对象添加新的属性和方法，而不影响同一原型的其他对象。\n*   可以动态地从一个对象删除现有的属性和方法，而不影响同一原型的其他对象。\n\n\
  这里有一个教程示例，展示了如何添加新属性、更新属性值以及删除属性：\n\n```\n <html>\n<!-- Object_Property.html\n \
  \  Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Object\
  \ Properties of \"Object\"</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
  >\n\n   // 创建 \"Object\" 类型的对象\n   var mySite = new Object();\n   var myBook = new\
  \ Object();\n\n   // 仅为一个对象添加新属性\n   mySite.url = \"herongyang.com\";\n   myBook.author\
  \ = \"Herong Yang\";\n\n   // 更新属性值\n   mySite.url = \"www.herongyang.com\";\n\n\
  \   // 显示属性值\n   document.writeln('mySite.url: '+mySite.url);\n   document.writeln('myBoot.url:\
  \ '+myBook.url);\n   document.writeln('mySite.author: '+mySite.author);\n   document.writeln('myBook.author:\
  \ '+myBook.author);\n\n   // 这个属性仅属于一个对象吗？\n   document.writeln('mySite.hasOwnProperty(\"\
  url\"): '\n      +mySite.hasOwnProperty(\"url\"));\n\n   // 仅从一个对象删除属性\n   document.writeln('Deleting\
  \ mySite.url...');\n   delete mySite.url;\n   document.writeln('mySite.url: '+mySite.url);\n\
  </script>\n</pre>\n</body>\n</html>\n```\n\n结果符合我的预期：\n\n```\n mySite.url: www.herongyang.com\n\
  myBoot.url: undefined\nmySite.author: undefined\nmyBook.author: Herong Yang\nmySite.hasOwnProperty(\"\
  url\"): true\nDeleting mySite.url...\nmySite.url: undefined\n```\n\n\n\n\n\n# JavaScript\
  \ 教程 - Herong 的教程示例(#part0001.xhtml)\n\n## 对象介绍(#part0073.xhtml)\n\n### 添加和删除对象方法\n\
  \n本节对对象的自有方法进行了简要描述。提供了一个如何添加、调用和删除对象自有方法的教程示例。\n\n当你从 `Object` 构造函数创建一个新对象时，你将得到一个仅包含某些方法的对象：\n\
  \n- `toString()` - 这个默认方法输出 `[object Object]`。它需要被真实的方法所替换。\n- `valueOf()` - 这个默认方法输出\
  \ `[object Object]`。它需要被真实的方法所替换。\n\n但你可以随时使用所示的赋值操作为一个对象添加更多方法：\n\n```\n object_name.method_name\
  \ = function_name;\n```\n\n添加的方法仅适用于该特定对象。其他对象将没有此方法。\n\n在对象上调用方法与如下所示调用分配的函数是相同的：\n\
  \n```\n object_name.method_name(param1, param2, ...);\n```\n\n你也可以随时使用所示的删除操作从对象中删除方法：\n\
  \n```\n delete object_name.method_name;\n```\n\n这里有一个教程示例，向你如何添加新方法、调用方法以及删除方法。\n\
  \n```html\n <html>\n<!-- Object_Method.html\n   Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n-->\n<head>\n<title>\"Object\" 的方法</title>\n</head>\n<body>\n\
  <pre>\n<script type=\"text/javascript\">\n// 我用来打招呼的函数\nfunction sayHello(name)\
  \ {\n   window.alert(\"Hello \"+name);\n}\n\n   // 准备两个 \"Object\" 类型的对象\n   var\
  \ mySite = new Object();\n   var myBook = new Object();\n   mySite.url = \"herongyang.com\"\
  ;\n   myBook.author = \"Herong Yang\";\n\n   // 仅为一个对象添加方法\n   myBook.greet = sayHello;\n\
  \n   // 在 \"myBook\" 上调用方法\n   myBook.greet(myBook.author);\n\n   // 在 \"mySite\"\
  \ 上调用方法 - 将无法作用\n//   mySite.greet(myBook.author);\n\n   // 删除 \"myBook\" 上的方法\n\
  \   delete myBook.greet;\n\n   // 在对象上调用方法 - 将无法作用\n//   myBook.greet(myBook.author);\n\
  </script>\n</pre>\n</body>\n</html>\n```\n\n如果你运行这个 JavaScript 页面，你会在屏幕上看到一个警告框，显示：“Hello\
  \ Herong Yang”。\n\n### 使用 \"this\" 关键字表示当前对象\n\n本节对 `this` 关键字进行了简要描述，它在对象方法中表示当前对象。提供了一个如何访问当前对象的属性和方法的教程示例。\n\
  \n在定义作为对象方法的方法时，你可以使用关键字 `this` 来表示调用方法所在的对象。JavaScript 中 `this` 关键字的用法与 Java 中相同。\n\
  \n这里是使用 `this` 关键字访问当前对象属性和方法的教程示例：\n\n```html\n <html>\n<!-- Object_this_Keyword.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>对象方法中的\
  \ \"this\" 关键字</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
  >\n\n// 使用 \"this\" 获取属性\nfunction myToString() {\n   return '\"'+this.title + '\"\
  \ by '+this.author;\n}\n\n// 使用 \"this\" 获取 \"toString\" 方法\nfunction showAll()\
  \ {\n   window.alert(this.toString());\n}\n\n   // 准备一个 \"Object\" 类型的对象\n   var\
  \ myBook = new Object();\n   myBook.author = \"Herong Yang\";\n   myBook.title =\
  \ \"JavaScript Tutorials\";\n\n   // 仅为一个对象添加新方法\n   myBook.print = showAll;\n\n\
  \   // 仅在一个对象上重写 \"toString()\"\n   myBook.toString = myToString;\n\n   // 在 \"\
  myBook\" 上调用方法\n   myBook.print();\n</script>\n</pre>\n</body>\n</html>\n```\n\n\
  如果你运行这个 \"this\" 关键字示例，你将得到一个警告框，消息内容为：\"JavaScript Tutorials\" by Herong Yang。\n\
  \n### \"Object\" 类型对象字面量\n\n本节对用于创建 `Object` 类型新对象的对象字面量或初始化器进行了简要描述。提供了一个如何初始化具有两个属性和两个方法的对象的教程示例。\n\
  \n在之前的章节中，我们学习了 `Object` 类型对象可以通过构造函数函数 `new Object()` 创建。\n\nJavaScript 还支持使用如下格式的对象字面量创建\
  \ `Object` 类型对象的简单方法：\n\n```\n {property1: value1, property2: value2, ...}\n```\n\
  \n其中 `property1` 和 `property2` 是属性或方法名。在 JavaScript 语言中，对象中的属性和方法是以相同的方式管理的。\n\n\
  对象字面量也被称为对象初始化器，因为它允许你在单次操作中创建新对象并用属性和方法对其进行初始化。\n\n使用对象字面量创建对象的结果与使用构造函数相同。但对象字面量要易于使用得多。以下两个代码段是完全相同的，但第一个要简单得多：\n\
  \n```javascript\n // 使用对象字面量创建对象\n   var obj = {property1: value1, property2: value2,\
  \ ...};\n\n   // 使用构造函数创建对象\n   var obj = new Object();\n   obj.property1 = value1;\n\
  \   obj.property2 = value2;\n   ...;\n```\n\n这里是使用对象字面量或初始化器创建 \"Object\" 类型对象的教程示例：\n\
  \n```html\n <html>\n<!-- Object_Literal.html\n   Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n-->\n<head>\n<title>\"Object\" 类型的对象字面量</title>\n</head>\n<body>\n\
  <pre>\n<script type=\"text/javascript\">\n\n// 使用 \"this\" 获取属性\nfunction myToString()\
  \ {\n   return '\"'+this.title + '\" by '+this.author;\n}\n\n// 使用 \"this\" 获取 \"\
  toString\" 方法\nfunction showAll() {\n   window.alert(this.toString());\n}\n\n  \
  \ // 使用对象字面量\n   var myBook = {\n      author: \"Herong Yang\",\n      title: \"\
  JavaScript Tutorials\",\n      print: showAll,\n      toString: myToString\n   };\n\
  \n   // 在 \"myBook\" 上调用方法\n   myBook.print();\n</script>\n</pre>\n</body>\n</html>\n\
  ```\n\n如果你运行这个教程示例，你将得到与上一节示例相同的结果：\"JavaScript Tutorials\" by Herong Yang。\n\n\
  ### 对象与关联数组\n\n本节对如何使用关联数组格式 `object_name['property_name']` 访问对象属性进行了简要描述。提供了一个如何将对象作为关联数组使用的教程示例。\n\
  \n在上一节中，我提到 JavaScript 中对象的方法管理方式与属性相同。这引出了 JavaScript 对象的另一个很棒特性：\n\nJavaScript\
  \ 中的对象实际上是关联数组，它们包含一个键值对的集合。键（Keys）代表属性名和方法名，值（Values）代表属性值和函数定义。\n\n现在你知道如何通过两种方式引用方法属性或方法了：\n\
  \n- 点运算符 (`.`) - 示例：`object_name.property_name`。\n- 关联数组运算符 - 示例：`object_name[\"\
  property_name\"]`。\n\n这里有一个关于如何以关联数组格式访问对象属性和方法的教程示例：\n\n\n\n\n\n```html\n <html>\n\
  <!-- Object_Associate_Array.html\n   Copyright (c) HerongYang.com. All Rights Reserved.\n\
  -->\n<head>\n<title>对象与关联数组</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
  >\n// 使用 \"this\" 来获取属性\nfunction myToString() {\n   return '\"'+this.title + '\"\
  \ by '+this.author;\n}\n\n   // 使用对象字面量格式\n   var myBook = {\n      author: \"Herong\
  \ Yang\",\n      title: \"JavaScript Tutorials\",\n      toString: myToString\n\
  \   };\n\n   // 添加一个新属性\n   myBook['date'] = 2008;\n\n   // 通过不同的格式获取属性值\n   document.writeln(\"\
  myBook.title: \"+myBook.title);\n   document.writeln(\"myBook['title']: \"+myBook['title']);\n\
  \   document.writeln(\"myBook.date: \"+myBook.date);\n   document.writeln(\"myBook['date']:\
  \ \"+myBook['date']);\n   document.writeln(\"myBook.toString: \"+myBook.toString);\n\
  \   document.writeln(\"myBook['toString']: \"+myBook['toString']);\n\n   // 检查属性数据类型\n\
  \   document.writeln();\n   document.writeln(\"myBook.title Type: \"+(typeof myBook.title));\n\
  \   document.writeln(\"myBook['date'] Type: \"+(typeof myBook['date']));\n   document.writeln(\"\
  myBook.toString Type: \"\n      +(typeof myBook.toString));\n</script>\n</pre>\n\
  </body>\n</html>\n```\n\n运行此教程示例，你将看到以下输出，这证实了我的理解：点运算符（`.`）和关联数组运算符（`[]`）是可以互换的。\n\
  \n```text\n myBook.title: JavaScript Tutorials\nmyBook['title']: JavaScript Tutorials\n\
  myBook.date: 2008\nmyBook['date']: 2008\nmyBook.toString: function myToString()\
  \ {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\nmyBook['toString']:\
  \ function myToString() {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n\
  }\n\nmyBook.title Type: string\nmyBook['date'] Type: number\nmyBook.toString Type:\
  \ function\n```\n\n输出还表明，作为对象的属性，方法的值是函数的定义。\n\nJavaScript 教程 - Herong 的教程示例\n\n\
  ∟对象简介\n\n### 带有索引属性的对象\n\n本节对索引属性和索引方法进行了简要描述。提供了一个教程示例，说明如何创建和访问索引属性以及索引方法。\n\n\
  JavaScript 还支持具有以下特征的带有索引属性的对象：\n\n- 索引属性是以索引数字而不是属性命名的属性。\n- 索引属性不能用点运算符（`.`）访问。\n\
  - 索引属性可以使用关联数组运算符（`['index']`）访问。\n- 索引属性可以使用数组运算符（`[index]`）访问。\n- 索引属性可以赋值一个函数以成为索引方法。\n\
  \n这是一个教程示例，展示了如何以两种格式（数组格式和关联数组格式）定义和访问对象的索引属性和索引方法：\n\n```html\n <html>\n<!-- Object_Indexed_Properties.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>带有索引属性的对象</title>\n\
  </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n// 使用 \"this\" 来获取属性\n\
  function myToString() {\n   return '\"'+this.title + '\" by '+this.author;\n}\n\n\
  \   // 使用对象字面量格式\n   var myBook = {\n      author: \"Herong Yang\",\n      title:\
  \ \"JavaScript Tutorials\",\n      3: 2008,\n      price: \"Free\",\n      4: myToString\n\
  \   };\n\n   // 添加一个新的索引属性   \n   myBook[9] = \"Programming\";\n\n   // 索引属性不能通过\
  \ (.) 访问\n   // document.writeln(\"myBook.3: \"+myBook.3);\n\n   // 获取索引属性值\n  \
  \ document.writeln(\"myBook[3]: \"+myBook[3]);\n   document.writeln(\"myBook['3']:\
  \ \"+myBook['3']);\n   document.writeln(\"myBook[4]: \"+myBook[4]);\n   document.writeln(\"\
  myBook[9]: \"+myBook[9]);\n\n   // 检查属性数据类型\n   document.writeln();\n   document.writeln(myBook[4]());\n\
  </script>\n</pre>\n</body>\n</html>\n```\n\n此教程示例的输出符合我的预期：\n\n```text\n myBook[3]:\
  \ 2008\nmyBook['3']: 2008\nmyBook[4]: function myToString() {\n    return \"\\\"\
  \" + this.title + \"\\\" by \" + this.author;\n}\nmyBook[9]: Programming\n\n\"JavaScript\
  \ Tutorials\" by Herong Yang\n```\n\nJavaScript 教程 - Herong 的教程示例\n\n∟对象简介\n\n###\
  \ “对象”与“数组”之间的区别\n\n本节对 `Array` 和 `Object` 的相似之处和不同进行了简要描述。提供了一个教程示例，说明如何比较 `Array`\
  \ 对象和 `Object` 对象。\n\nJavaScript 支持许多预定义的核心对象类型。其中，`Object` 和 `Array` 之间的关系非常紧密。如果你将\
  \ `Array` 与 `Object` 进行比较，你应该看到以下相似点和不同点：\n\n- `Array` 是 `Object` 的子类，或子原型。因此 `Array`\
  \ 继承了 `Object` 的所有特征。\n- `Array` 不是一种新的数据类型。`Array` 和 `Object` 共享相同的数据类型 `object`。\n\
  - 在 `Array` 对象上的 `typeof` 运算符返回 `object`。\n- 在 `Array` 对象上的 `instanceof` 运算符匹配 `Array`。它也匹配\
  \ `Object`，因为 `Array` 是 `Object` 的子类。\n- `Object` 类型的对象可以使用与 `Array` 对象相同的语法拥有索引属性。\n\
  - `Object` 类型的对象不是 `Array` 对象。\n- `Array` 创建的对象也是 `Object` 对象。\n\n这是一个 JavaScript\
  \ 教程示例，展示了 `Array` 和 `Object` 之间是相似的：\n\n```html\n <html>\n<!-- Object_Associate_Array.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>比较对象与数组</title>\n\
  </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n   // 创建一个“Array”对象 -\
  \ 数组字面量\n   var bookArray = [\n      \"JavaScript Tutorials\",\n      \"Herong Yang\"\
  ,\n      2008,\n      \"Programming\"\n   ];\n\n   // 创建一个“Object”对象 - 对象字面量\n \
  \  var bookObject = {\n      title: \"JavaScript Tutorials\",\n      author: \"\
  Herong Yang\",\n      year: 2008,\n      category: \"Programming\"\n   };\n\n  \
  \ // 检查 bookArray\n   document.writeln(\"About the \\\"Array\\\" object:\");\n \
  \  document.writeln(\"   Type: \"+(typeof bookArray));\n   document.writeln(\" \
  \  Instance of Object: \"+bookArray instanceof Object));\n   document.writeln(\"\
  \   Instance of Array: \"+bookArray instanceof Array));\n   document.writeln(\"\
  \   Members:\");\n   for (var item in bookArray) {\n      document.writeln(\"  \
  \    \"+item+\": \"+bookArray[item]);\n   }\n\n   // 检查 bookObject\n   document.writeln();\n\
  \   document.writeln(\"About the \\\"Object\\\" object:\");\n   document.writeln(\"\
  \   Type: \"+(typeof bookObject));\n   document.writeln(\"   Instance of Object:\
  \ \"+bookObject instanceof Object));\n   document.writeln(\"   Instance of Array:\
  \ \"+bookObject instanceof Array));\n   document.writeln(\"   Members:\");\n   for\
  \ (var item in bookObject) {\n      document.writeln(\"      \"+item+\": \"+bookObject[item]);\n\
  \   }\n</script>\n</pre>\n</body>\n</html>\n```\n\n此教程示例的输出展示了 `Array` 对象与 `Object`\
  \ 对象是如何相似的：\n\n```text\n About the \"Array\" object:\n   Type: object\n   Instance\
  \ of Object: true\n   Instance of Array: true\n   Members:\n      0: JavaScript\
  \ Tutorials\n      1: Herong Yang\n      2: 2008\n      3: Programming\n\nAbout\
  \ the \"Object\" object:\n   Type: object\n   Instance of Object: true\n   Instance\
  \ of Array: false\n   Members:\n      title: JavaScript Tutorials\n      author:\
  \ Herong Yang\n      year: 2008\n      category: Programming\n```\n\nJavaScript\
  \ 教程 - Herong 的教程示例\n\n∟对象简介\n\n### 将“数组”对象作为“对象”使用\n\n本节提供了一个教程示例，说明如何将 `Array`\
  \ 对象作为 `Object` 对象来命名属性和方法。\n\n正如我在上一节中提到的，`Array` 是 `Object` 的子类。因此，`Array` 对象可以作为\
  \ `Object` 对象使用。\n\n\n\n\n\n*   可以为 `\"Array\"` 对象添加命名属性。\n*   `\"Array\"` 对象的元素实际上是索引属性。\n\
  *   可以使用关联数组格式访问命名属性和索引属性。\n*   方法可以作为命名属性或索引属性被添加。\n\n下面是一个 JavaScript 教程示例，向你展示了如何将\
  \ `\"Array\"` 对象当作 `\"Object\"` 对象使用：\n\n```\n <html>\n<!-- Object_Array_as_Object.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Using\
  \ an Array as an Object</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
  >\n// Using \"this\" to get the properties\nfunction myToString() {\n   return '\"\
  '+this.title + '\" by '+this.author;\n}\n\n   // Creating an object of \"Array\"\
  \n   var bookArray = new Array();\n   bookArray[3] = 2008;\n   bookArray[9] = \"\
  Programming\";\n\n   // Adding named properties to \"bookArray\"\n   bookArray.author\
  \ = \"Herong Yang\";\n   bookArray.title = \"JavaScript Tutorials\";\n\n   // Adding\
  \ methods in 2 ways\n   bookArray.toString = myToString;\n   bookArray[4] = myToString;\n\
  \n   // Checking \"bookArray\"\n   document.writeln();\n   document.writeln(\"About\
  \ the \\\"Array\\\" object:\");\n   document.writeln(\"   Type: \"+(typeof bookArray));\n\
  \   document.writeln(\"   Instance Of Object: \"\n      +(bookArray instanceof Object));\n\
  \   document.writeln(\"   Instance Of Array: \"\n      +(bookArray instanceof Array));\n\
  \   document.writeln(\"   Array Length: \"+bookArray.length);\n\n   // Looping through\
  \ all properties and methods\n   document.writeln(\"   Members:\");\n   var count\
  \ = 0; \n   for (var item in bookArray) {\n      document.writeln(\"      \"+item+\"\
  : \"+bookArray[item]);\n      count++;\n   }\n   document.writeln(\"   # of properties\
  \ and methods: \"+count);\n\n   // Calling its methods\n   document.writeln();\n\
  \   document.writeln(\"Calling its methods:\");\n   document.writeln(\"   bookArray.toString():\
  \ \"\n      +bookArray.toString());\n   document.writeln(\"   bookArray[4](): \"\
  +bookArray[4]());\n</script>\n</pre>\n</body>\n</html>\n```\n\n这是该教程示例的输出。请注意，作为一个\
  \ `\"Array\"` 对象，`bookArray.length` 返回 10 个元素。但它只有 6 个属性和方法。\n\n```\n About the\
  \ \"Array\" object:\n   Type: object\n   Instance Of Object: true\n   Instance Of\
  \ Array: true\n   Array Length: 10\n   Members:\n      3: 2008\n      9: Programming\n\
  \      author: Herong Yang\n      title: JavaScript Tutorials\n      toString: function\
  \ myToString() {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n\
  }\n      4: function myToString() {\n    return \"\\\"\" + this.title + \"\\\" by\
  \ \" + this.author;\n}\n   # of properties and methods: 6\n\nCalling its methods:\n\
  \   bookArray.toString(): \"JavaScript Tutorials\" by Herong Yang\n   bookArray[4]():\
  \ \"JavaScript Tutorials\" by Herong Yang\n```\n\n# JavaScript 教程 - Herong 的教程示例\n\
  \n##  定义你自己的对象类型\n\n本章提供了关于如何定义你自己的对象类型的介绍和教程示例。主题包括定义构造函数；向对象或构造函数原型添加属性和方法；遍历属性和方法；使用\
  \ `'instanceof'` 和 `'typeof'` 运算符。\n\n*   基于原型的面向对象编程风格\n*   JavaScript 中基于原型的编程特性\n\
  *   定义对象构造函数\n*   向对象添加属性和方法\n*   \"for ... in\" 和 \"for each ... in\" 语句\n*   构造函数对象对象的\
  \ \"prototype\" 属性\n*   \"instanceof\" 运算符 - 确定对象类型\n*   \"typeof\" 运算符和数据类型\n\n\
  ### 结论：\n\n*   JavaScript 是一种基于原型的编程语言，支持对象的封装、多态和继承。\n*   JavaScript 没有类定义。\n*\
  \   对象通过调用构造函数创建：`New Abc()`。\n*   可以在构造函数中添加对象属性和方法。\n*   也可以向单个实例添加对象属性和方法。\n\
  *   可以使用 `for (var item in object_name)` 和 `for each (var value in object_name)`\
  \ 语句来遍历对象中的属性和方法。\n*   构造函数本身是一个对象，它有一个名为 `\"prototype\"` 的属性，指向原型定义。\n\n# JavaScript\
  \ 教程 - Herong 的教程示例\n\n## ∟定义你自己的对象类型](#part0084.xhtml)\n\n### 基于原型的面向对象编程风格\n\n\
  本节提供了面向对象编程和基于原型的编程风格的快速描述。\n\n面向对象编程有三个主要目标：\n\n*   **封装**：在接口后隐藏对象功能细节的能力——换句话说，封装是向发送消息的对象隐藏对象功能细节的能力。\n\
  *   **继承**：派生类型对象从父类型继承属性的能力。\n*   **多态**：相同类型的两个对象以自己的行为响应相同接口的能力。\n\n这些目标可以通过两种不同的编程风格实现：\n\
  \n*   **基于类的编程**：对象通过基于指定类的实例化过程创建，该类静态地定义了结果对象的结构和行为。\n*   **基于原型的编程**：对象通过基于另一个对象作为原型的克隆过程创建，该原型可以被动态修改。\n\
  \nJavaScript 是一种基于原型的编程语言，支持如下所述的封装、多态和继承：\n\n*   封装：对象的功能细节隐藏在属性和方法内部。\n*   继承：父类型的属性和方法通过原型对象被继承。\n\
  *   多态：继承的属性和方法可以被特定于该对象的重写。\n\n请查看本章的其他章节，获取有关 JavaScript 基于原型的编程特性的详细描述和教程示例。\n\
  \n# JavaScript 教程 - Herong 的教程示例\n\n## ∟定义你自己的对象类型\n\n### ∟JavaScript 中基于原型的编程特性\n\
  \n本节提供了 JavaScript 中一些基于原型的编程特性的列表，例如构造函数、原型对象、对象属性和方法。\n\n正如我在上一节提到的，JavaScript\
  \ 是一种基于原型的编程语言。它通过许多特性支持面向对象编程：\n\n*   没有类定义。JavaScript 不使用类。\n*   对象是从构造函数创建的。\n\
  *   每个构造函数代表一种唯一的对象类型。\n*   构造函数可以为从该构造函数创建的所有对象定义属性和方法。\n*   每个构造函数都可以与一个原型对象关联。\n\
  *   对象会自动继承与其构造函数关联的原型对象的属性和方法。\n*   每个对象都可以有它自己的属性和方法。\n*   继承的属性和方法可以被特定对象或原型对象重写。\n\
  *   有一个名为 `Object()` 的内置构造函数，它为所有其他对象类型提供了基础对象类型。\n*   所有函数实际上都是从基础构造函数 `Function()`\
  \ 创建的对象。\n*   所有类型的对象都继承了由基础构造函数 `Object()` 定义的属性和方法。\n\n\n\n\n\n- 有几个主要的内置对象，它们表示构造函数，包括\
  \ `Array()`、`Boolean()`、`Date()`、`Error()`、`Function()`、`Math()`、`Number()`、`Object()`、`RegExp()`\
  \ 和 `String()`。\n- JavaScript 似乎不支持多重继承。\n- JavaScript 以特殊方式支持私有属性和方法。\n\n本章稍后将提供几个教程示例来阐明其中一些特性。\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n### ∟定义你自己的对象类型](#part0084.xhtml)\n\n## 定义对象构造函数\n\
  \n本节简要介绍了如何定义对象构造函数。提供了一个教程示例，演示了如何创建一个具有 3 个属性和 1 个方法的 `'Book'` 构造函数。\n\n学习 JavaScript\
  \ 原型编程风格的第一要点是构造函数。在编写构造函数时，我们需要记住：\n\n- 构造函数的名称将作为对象的类型名称。因此，请为构造函数选择一个好的名称。\n\
  - 在构造函数中，`this` 关键字可以表示要构建的对象。\n- 属性应该在构造函数中使用赋值表达式添加，如 `this.property_name = initial_value`。\n\
  - 构造函数应该接受一些参数来初始化属性。\n- 方法应该在构造函数中使用赋值表达式添加，如 `this.method_name = function_name`，其中\
  \ `function_name` 指向一个现有函数。\n- 不要在构造函数中使用任何 `return` 语句。当使用 `new` 运算符将其作为对象构造函数调用时，返回值将被忽略。\n\
  \n这里有一个定义了名为 `Book(...)` 构造函数的教程示例，它定义了 3 个属性和 1 个方法：\n\n```html\n <html>\n<!--\
  \ Prototype_Constructor_Function.html\n   Copyright (c) HerongYang.com. All Rights\
  \ Reserved.\n-->\n<head>\n<title>Defining Object Constructor Functions</title>\n\
  </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n// Defining the constructor\
  \ function for a new object type\nfunction Book(title, author) {\n   document.writeln(\"\
  \\nConstructing a \\\"Book\\\" object...\");\n   this.title = title;\n   this.author\
  \ = author;\n   this.price = undefined;\n   this.getDesc = getDescription;\n}\n\n\
  // Defining a function to be used as a method\nfunction getDescription() {\n   return\
  \ \"\\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // Creating an object of\
  \ \"Book\"\n   var myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n\
  \   document.writeln(\"\\nChecking the \\\"Book\\\" object\");\n   document.writeln(\"\
  \   Type: \"+(typeof myBook));\n   document.writeln(\"   Instance of \\\"Book\\\"\
  : \"\n      +(myBook instanceof Book));\n\n   // Testing properties and methods\n\
  \   document.writeln(\"   myBook.title: \"+myBook.title);\n   document.writeln(\"\
  \   myBook.author: \"+myBook.author);\n   document.writeln(\"   myBook.price: \"\
  +myBook.price);\n   document.writeln(\"   myBook.getDesc(): \"+myBook.getDesc());\n\
  \n   // Trying to call a constructor function as a normal function\n   Book(\"JavaScript\
  \ Cookbook\", \"Yosef Cohen\");\n</script>\n</pre>\n</body>\n</html>\n```\n\n教程示例的输出打印所示：\n\
  \n```\n Constructing a \"Book\" object...\n\nChecking the \"Book\" object\n   Type:\
  \ object\n   Instance of \"Book\": true\n   myBook.title: JavaScript Tutorials\n\
  \   myBook.author: Herong Yang\n   myBook.price: undefined\n   myBook.getDesc():\
  \ \"JavaScript Tutorials\" by Herong Yang\n\nConstructing a \"Book\" object...\n\
  ```\n\n注意，最后一个测试语句证明构造函数只是一个普通函数，你可以直接调用它。但直接调用构造函数不会产生任何结果。\n\n简单总结：\n\n- 构造函数等于函数。构造函数是一个函数。而函数也是构造函数。\n\
  - 构造函数可以使用 `new` 运算符创建一个新对象。\n- 任何构造函数都可以被调用并作为函数执行。\n- 任何函数都可以作为构造函数创建对象。\n\nJavaScript\
  \ 教程 - Herong 的教程示例\n\n### ∟定义你自己的对象类型](#part0084.xhtml)\n\n## 向对象添加属性和方法\n\n本节仅简要介绍了向对象添加属性和方法。提供了一个教程示例，演示了如何向\
  \ 1 个对象添加 1 个额外的属性和 1 个额外的方法。\n\n从构造函数创建对象后，可以使用以下格式向该对象添加额外的属性和方法：\n\n```\n object_name.property_name\
  \ = initial_value;\n   object_name.method_name = function_name;\n```\n\n这里有一个教程示例，它从\
  \ `Book()` 创建了两个对象，并仅向对象 `myBook` 添加了 1 个额外的属性和 1 个额外的方法：\n\n```html\n <html>\n\
  <!-- Prototype_Add_Property_and_Method.html\n   Copyright (c) HerongYang.com. All\
  \ Rights Reserved.\n-->\n<head>\n<title>Adding Additional Properties and Methods\
  \ to Objects</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\
  \n// Defining the constructor function for a new object type\nfunction Book(title,\
  \ author) {\n   this.title = title;\n   this.author = author;\n   this.price = undefined;\n\
  \   this.getDesc = getDescription;\n}\n\n// Defining a function to be used as a\
  \ method\nfunction getDescription() {\n   return \"\\\"\"+this.title+\"\\\" by \"\
  +this.author;\n}\n\n   // Creating an object of \"Book\"\n   var myBook = new Book(\"\
  JavaScript Tutorials\", \"Herong Yang\");\n   var ckBook = new Book(\"JavaScript\
  \ Cookbook\", \"Yosef Cohen\");\n\n   // Adding additional property and method to\
  \ myBook\n   myBook.price = 99.99;\n   myBook.getDesc = getDescription;\n\n   function\
  \ showObject(object, name) {\n      document.writeln(\"\\nShowing object \\\"\"\
  +name+\"\\\\\"\");\n      document.writeln(\"   Own Properties and Methods:\");\n\
  \      for (var item in object) {\n          document.writeln(\"      \"+item+\"\
  : \"+object[item]);\n      }\n   }\n\n   showObject(myBook, \"myBook\");\n   showObject(ckBook,\
  \ \"ckBook\");\n</script>\n</pre>\n</body>\n</html>\n```\n\n教程示例的输出显示，构造函数中定义的属性被添加到两个对象。但添加到\
  \ `myBook` 的属性和方法仅适用于 `myBook`。\n\n```\n Showing object \"myBook\"\n   Own Properties\
  \ and Methods:\n      title: JavaScript Tutorials\n      author: Herong Yang\n \
  \     price: 99.99\n      getDesc: function() {\n    return \"\\\"\" + this.title\
  \ + \"\\\" by + this.author;\n}\n\nShowing object \"ckBook\"\n   Own Properties\
  \ and Methods:\n      title: JavaScript Cookbook\n      author: Yosef Cohen\n```\n\
  \nJavaScript 教程 - Herong 的教程示例\n\n### ∟定义你自己的对象类型](#part0084.xhtml)\n\n## \"for\
  \ ... in\" 和 \"for each ... in\" 语句\n\n本节简要介绍了用于遍历对象属性和方法的特殊循环语句。提供了一个教程示例来展示相同类型对象的额外属性和方法。\n\
  \nJavaScript 支持两种特殊的循环语句，允许遍历对象中所有的属性和方法：\n\n1. `for ... in` 语句的语法如下：\n\n```\nfor\
  \ (var item in object_name) {\n      ... statements with object_name[item] ...\n\
  }\n```\n\n在 `for ... in` 语句中，嵌入语句会对每个属性和方法执行。变量 `item` 将包含当前的属性或方法名称。表达式 `object_name[item]`\
  \ 使用关联数组格式获取属性值。\n\n2. `for each ... in` 语句的语法如下：\n\n```\nfor each (var value in\
  \ object_name) {\n      ... statements with value ...\n}\n```\n\n在 `for each ...\
  \ in` 语句中，嵌入语句会对每个属性和方法执行。变量 `value` 将包含当前属性的值或当前方法的函数。\n\n这里有一个教程示例，它同时使用 `for\
  \ ... in` 和 `for each ... in` 语句来遍历所有属性和方法：\n\n\n\n\n```html\n<html\n<!-- Prototype_Property_Method_Loop.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>为对象添加额外的属性和方法</title>\n\
  </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n// 为新对象类型定义构造函数\nfunction\
  \ Book(title, author) {\n   this.title = title;\n   this.author = author;\n}\n\n\
  // 定义一个用作方法的函数\nfunction getDescription() {\n   return \"\\\"\"+this.title+\"\\\"\
  \ by \"+this.author;\n}\n\n   // 创建一个 \"Book\" 的对象\n   var myBook = new Book(\"\
  JavaScript Tutorials\", \"Herong Yang\");\n\n   // 为一个对象添加额外的属性和方法\n   myBook.price\
  \ = 99.99;\n   myBook.getDesc = getDescription;\n\n   // 显示对象的属性和方法\n   showObject(myBook,\
  \ \"myBook\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\\\
  nShowing object \\\"\"+name+\"\\\"\");\n   document.writeln(\"   Property/method\
  \ names and values:\");\n   for (var item in object) {\n      document.writeln(\"\
  \      \"+item+\": \"+object[item]);\n   }\n\n   document.writeln(\"\\nShowing object\
  \ \\\"\"+name+\"\\\"\");\n   document.writeln(\"   Property/method values:\");\n\
  \   for each (var v in object) {\n      document.writeln(\"      \"+v);\n   }\n\
  }\n</script>\n</pre>\n</body>\n</html>\n```\n\n此教程示例的输出如下：\n\n```\n Showing object\
  \ \"myBook\"\n   Property/method names and values:\n      title: JavaScript Tutorials\n\
  \      author: Herong Yang\n      price: 99.99\n      getDesc: function getDescription()\
  \ {\n    return \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\n\nShowing\
  \ object \"myBook\"\n   Property/method values:\n      JavaScript Tutorials\n  \
  \    Herong Yang\n      99.99\n      function getDescription() {\n    return \"\\\
  \"\" + this.title + \"\\\" by \" + this.author;\n}\n```\n\n请注意 `for each ... in`\
  \ 语句已废用。请不要再使用它。\n\nJavaScript 教程 - Herong 的教程示例\n\n∟定义你自己的对象类型\n\n## 构造函数对象的 \"\
  prototype\" 属性\n\n本节快速介绍了构造函数上内置的 `prototype` 属性。提供了一个教程示例，说明了如何在 `prototype` 属性中存储属性和方法，以便由该构造函数创建的所有对象继承它们。\n\
  \n在之前的章节中，我们学习了可以使用构造函数来创建新对象。但构造函数还带有一个内置属性名为 `prototype`，它提供了允许对象共享和继承属性及方法的机制。\n\
  \n*   构造函数也是一个 `Function` 类型的对象。\n*   构造函数可以作为对象拥有自己的属性。\n*   每个构造函数都有一个名为 `prototype`\
  \ 的默认属性。\n*   构造函数的默认 `prototype` 属性是一个对象。\n*   可以向构造函数的 `prototype` 对象中添加新的属性和方法。\n\
  * 构造函数的 `prototype` 对象的所有属性和方法都由从该构造函数创建的所有对象共享。\n\n让我们使用以下教程示例来测试一下：\n\n```html\n\
  \ <html>\n<!-- Prototype_Property_on_Constructor.html\n   Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n-->\n<head>\n<title>构造函数上的 \"prototype\" 属性</title>\n</head>\n\
  <body>\n<pre>\n<script type=\"text/javascript\">\n\n// 定义对象类型构造函数\nfunction Book(title,\
  \ author) {\n   this.title = title;\n   this.author = author;\n}\n\n   // 向 \"prototype\"\
  \ 添加属性和方法\n   Book.prototype.price = 9.99;\n   Book.prototype.getDesc = getDescription;\n\
  \n// 定义一个用作方法的函数\nfunction getDescription() {\n   return \"\\\"\"+this.title+\"\\\
  \" by \"+this.author;\n}\n\n   // 创建一个 \"Book\" 的对象\n   var myBook = new Book(\"\
  JavaScript Tutorials\", \"Herong Yang\");\n\n   // 显示对象、构造函数和原型\n   showObject(myBook,\
  \ \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype, \"\
  Book.prototype\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\
  \\nShowing object \\\"\"+name+\"\\\"\");\n   document.writeln(\"   Type: \"+(typeof\
  \ object));\n   document.writeln(\"   Property/method names and values:\");\n  \
  \ for (var item in object) {\n      document.writeln(\"      \"+item+\": \"+object[item]);\n\
  \   }\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\n此教程示例的输出显示了 \"prototype\"\
  \ 是是如何被对象继承的：\n\n Showing object \"myBook\"\n   Type: object\n   Property/method\
  \ names and values:\n      title: JavaScript Tutorials\n      author: Herong Yang\n\
  \      price: 99.99\n      getDesc: function getDescription() {\n    return \"\\\
  \"\" + this.title + \"\\\" by \" + this.author;\n}\n\nShowing object \"Book\"\n\
  \   Type: function\n   Property/method names and values:\n      prototype: Object\n\
  \nShowing object \"Book.prototype\"\n   Type: object\n   Property/method names and\
  \ values:\n      price: 9.99\n      getDesc: function getDescription() {\n    return\
  \ \"\\\"\" + this.title + \"\\\" by \" + this.author;\n}\n\nJavaScript 教程 - Herong\
  \ 的教程示例\n\n∟定义你自己的对象类型\n\n## \"instanceof\" 运算符 - 确定对象类型\n\n本节介绍了 `instanceof` 运算符。提供了一个教程示例，说明了如何使用\
  \ `instanceof` 运算符确定对象的类型。\n\n到目前为止，我们通过使用构造函数创建了多种类型的对象，如 `Object`、`Array`、`Function`\
  \ 和 `Book`（我们自己的对象类型）。\n\n但如果我们有一个对象，如何测试它的对象类型？JavaScript 提供了 `instanceof` 运算符来帮助我们完成这个表达式：\n\
  \n```\n object instanceof constructor\n```\n\n此 `instanceof` 表达式返回一个布尔值，指示指定的对象是否是指定类型（构造函数名称）的实例。\n\
  \n下面的示例使用 `instanceof` 运算符测试之前示例中使用的 3 个对象：\n\n```html\n <html>\n<!-- Prototype_instanceof_Operator.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>\"instanceof\"\
  \ 运算符 - 确定对象类型</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
  >\n\n// 定义对象类型构造函数\nfunction Book(title, author) {\n   this.title = title;\n   this.author\
  \ = author;\n}\n\n   // 向原型 添加属性和方法\n   Book.prototype.price = 9.99;\n   Book.prototype.getDesc\
  \ = getDescription;\n\n// 定义一个用作方法的函数\nfunction getDescription() {\n   return \"\
  \\\"\"+this.title+\"\\\" by \"+this.author;\n}\n\n   // 创建一个 \"Book\" 的对象\n   var\
  \ myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n\n   // 显示对象、构造函数和原型\n\
  \   showObject(myBook, \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype,\
  \ \"Book.prototype\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\
  \\nShowing object \\\"\"+name+\"\\\"\");\n\n   // 使用 \"instanceof\" 确定对象类型\n   document.writeln(\"\
  \   Instance of Object: \"\n      +(object instanceof Object));\n   document.writeln(\"\
  \   Instance of Function: \"\n      +(object instanceof Function));\n   document.writeln(\"\
  \   Instance of Book: \"\n      +(object instanceof Book));\n}\n</script>\n</pre>\n\
  </body>\n</html>\n```\n\n\n\n\n```\n Showing object \"myBook\"\n   Instance of Object:\
  \ true\n   Instance of Function: false\n   Instance of Book: true\n\nShowing object\
  \ \"Book\"\n   Instance of Object: true\n   Instance of Function: true\n   Instance\
  \ of Book: false\n\nShowing object \"Book.prototype\"\n   Instance of Object: true\n\
  \   Instance of Function: false\n   Instance of Book: false\n\nShowing object \"\
  Object\"\n   Instance of Object: true\n   Instance of Function: true\n   Instance\
  \ of Book: false\n\nShowing object \"Object.prototype\"\n   Instance of Object:\
  \ false\n   Instance of Function: false\n   Instance of Book: false\n```\n\n## 关于输出的几点有趣说明\n\
  \n- `\"myBook\"` 是一个通过 `Book()` 创建的对象。因此，它是 `\"Book\"` 的实例。\n- 但 `\"myBook\"` 也是\
  \ `\"Object\"` 的实例，因为 `\"Book\"` 是 `\"Object\"` 的子类型。所有使用的定义的对象类型默认情况下都是基础 `\"Object\"\
  ` 类型的子类型。\n- `\"Book\"` 是一个函数。因此它是 `\"Function\"` 的实例。\n- 但 `\"Book\"` 也是 `\"Object\"\
  ` 的实例，因为 `\"Function\"` 是 `\"Object\"` 的子类型。\n- `\"Book.prototype\"` 是基础对象类型：`\"\
  Object\"` 的实例。\n- `\"Object\"` 是一个函数。因此它是两个对象类型的实例：`\"Function\"` 和 `\"Object\"\
  `。\n- 然而 `\"Object.prototype\"`是一个对象。所以它应该是 `\"Object\"` 的实例。但输出显示不是。JavaScript\
  \ 可能为 `\"Object.prototype\"` 分配了一个内部对象类型。\n\nJavaScript 教程 - Herong 的教程示例\n\n###\
  \ 定义自己的对象类型\n\n#### \"typeof\" 运算符和数据类型\n\n本节快速介绍了 `typeof` 运算符和 JavaScript 支持的数据类型。提供了一个教程示例来列出所有数据类型：数字、字符串、布尔、对象、函数和未定义。\n\
  \n在上一节中，我们学习了如何使用 `instanceof` 运算符。但 JavaScript 另一个名为 `typeof` 的运算符，它的工作方式与 `instanceof`\
  \ 。以下是它们的对比：\n\n1. `object_name instanceof constructor_name` 如果指定的对象是指定类型的实例，则返回\
  \ true。\n2. `typeof expression` 返回指定表达式的数据类型名称。记住 JavaScript 支持几种数据类型：`\"number\"\
  `、`\"string\"`、`\"boolean\"`、`\"object\"`、`\"function\"` 和 `\"\"undefined\"`。\n\n\
  为了向你展示这些数据类型以及如何使用 `typeof`，我写了这个教程示例：\n\n```html\n <html>\n<!-- Prototype_typeof_Operator.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>\"typeof\"\
  \ 运算符</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n   //\
  \ 创建一个 \"Book\" 对象\n   var myBook = new Book(\"JavaScript Tutorials\", \"Herong\
  \ Yang\");\n\n   // 显示不同的数据类型\n   showDatatype(9, \"9\");\n   showDatatype(3.14,\
  \ \"3.14\");\n   showDatatype(\"Hello\", \"\\\"Hello\\\"\");\n   showDatatype(true,\
  \ \"true\");\n   showDatatype(undefined, \"undefined\");\n   showDatatype(null,\
  \ \"null\");\n   showDatatype(myBook, \"myBook\");\n   showDatatype(Book, \"Book\"\
  );\n\nfunction showDatatype(x, name) {\n   document.writeln(name+\": \"+(typeof\
  \ x));\n}\n\nfunction Book(title, author) {\n   this.title = title;\n   this.author\
  \ = author;\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\n这是该教程示例的输出。注意 `\"null\"\
  ` 的数据类型是 `\"object\"`。\n\n```\n 9: number\n3.14: number\n\"Hello\": string\ntrue:\
  \ boolean\nundefined: undefined\nnull: object\nmyBook: object\nBook: function\n\
  ```\n\nJavaScript 教程 - Herong 的教程示例\n\n### ### 通过原型对象链实现属性和方法的继承\n\n本章提供了对象属性和方法继承的介绍和教程示例。主题包括：从构造函数的原型继承属性和方法；回顾内置默认属性和方法；使用\
  \ `constructor` 属性；添加本地和继承的属性；覆盖继承的属性。\n\n- 从构造函数的原型对象继承\n- 更改构造函数的原型对象\n- 从两级原型对象继承属性\n\
  - \"Object.prototype\" 中的内置属性和方法\n- 使用 \"hasOwnProperty()\" 方法测试继承的属性\n- 在 \"prototype\"\
  \ 对象中设置 \"constructor\" 属性\n- 在对象级别添加本地方法\n- 在原型级别添加继承方法\n- 构建多级原型对象\n- 原型对象链总结](#part0103.xhtml)\n\
  \n**结论：**\n\n- 当定义一个构造函数时，你实际上是在定义一个 `\"prototype\"` 对象。\n 当 当调用构造函数创建新对象时，你正在从构造函数定义的原型中继承属性和方法。\n\
  - 你可以随时修改构造函数的原型。\n- 对象从它的原型以及原型的原型继承属性和方法，以此此类推。\n- 根原型有一些内置的属性和方法：`constructor`、`hasOwnProperty()`、`isPrototypeOf()`、`toString()`\
  \ 和 `valueOf()`。\n- 属性和方法可以本地添加到单个对象实例中。\n\nJavaScript 教程 - Herong 的教程示例\n\n###\
  \ ### 通过原型对象链实现属性和方法的继承](#part0093.xhtml)\n\n#### #### 从构造函数的原型对象继承\n\n本节快速介绍了对象如何从其构造函数的原型对象继承属性和方法。提供了一个教程示例和图表来展示对象、其构造函数以及构造函数的原型对象之间的关系。\n\
  \n通过书中之前的章节，我们了解到：\n\n- 构造函数是一个函数。但它也是一个对象。\n- 每个构造函数都有一个名为 `\"prototype\"` 的内置默认属性。\n\
  - 构造函数的 `\"prototype\"` 是一个对象。\n- 属性和方法可以添加到构造函数的原型对象中。\n- 每个对象将从其构造函数的原型对象继承属性和方法。\n\
  \n为了演示这些规则，我写了以下教程示例，允许 `\"myBook\"` 从构造函数的原型对象中继承 `\"price\"` 属性：\n\n```html\n\
  \ <html>\n<!-- Inheritance_from_Prototype.html\n   Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n-->\n<head>\n<title>从原型继承</title>\n</head>\n<body>\n<pre>\n\
  <script type=\"text/javascript\">\n\n// 定义构造函数: \"Book\"\nfunction Book(title, author)\
  \ {\n   this.title = title;\n   this.author = author;\n}\n\n   // 向 \"prototype\"\
  \ 添加属性\n   Book.prototype.price = 9.99;\n\n   // 创建一个对象: \"myBook\"\n   var myBook\
  \ = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n\n   // 显示对象、构造函数和原型\n\
  \   showObject(myBook, \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype,\
  \ \"Book.prototype\");\n\nfunction showObject(object, name) {\n   document.writeln(\"\
  \\n\\\"\"+name+\"\\\" properties:\");\n   for (var item in object) {\n      document.writeln(\"\
  \   \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n\
  ```\n\n该教程示例的输出确认了我们之前学到的内容：\n\n```\n \"myBook\" properties:\n   title: JavaScript\
  \ Tutorials\n   author: Herong Yang\n   price: 9.99\n\n\"Book\" properties:\n  \
  \ prototype: [object Object]\n\n\"Book.prototype\" properties:\n   price: 9.99\n\
  ```\n\n输出也可以用此图表表示：\n\n![](img/image00143.jpeg)\n\n从原型继承\n\nJavaScript 教程 - Herong\
  \ 的教程示例\n\n### ### 通过原型对象链实现属性和方法的继承](#part0093.xhtml)\n\n#### #### 更改构造函数的原型对象\n\
  \n\n\n\n\n本节简要描述什么是默认原型对象以及如何更改它。文中提供了一个教程示例，用于创建你自己的原型对象并替换默认原型对象。\n\n在节一节中，我们看到当定义一个构造函数时，会自动创建一个对象并将其赋值给构造函数的\
  \ `prototype` 属性。\n\n但如果你不喜欢系统创建的对象，可以自己创建一个对象并将其赋值给 `prototype` 属性。\n\n为了向你展示如何替换默认的\
  \ `prototype` 对象，我编写了以下教程示例，允许 `myBook` 继承我自己创建的原型对象中存储的 `year` 属性：\n\n```javascript\n\
  \ <html>\n<!-- Inheritance_Change_Prototype.html\n   Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n-->\n<head>\n<title>Changing Prototype Object</title>\n\
  </head>\n<body\n<pre>\n<script type=\"text/javascript\">\n\n// Define the constructor:\
  \ \"Book\"\nfunction Book(title, author) {\n   this.title = title;\n   this.author\
  \ = author;\n}\n\n   // Adding a property to the \"prototype\"\nBook.prototype.price\
  \ = 9.99;\n\n   // Creating my own prototype object\n   myPrototype = new Object();\n\
  \   myPrototype.year = 2008;\n\n   // Changing the constructor's prototype object\n\
  \   Book.prototype = myPrototype;\n\n   // Creating an object: \"myBook\"\n   var\
  \ myBook = new Book(\"JavaScript Tutorials\", \"Herong Yang\");\n\n   // Showing\
  \ the object, constructor, and prototype\n   showObject(myBook, \"myBook\");\n \
  \  showObject(Book, \"Book\");\n   showObject(Book.prototype, \"Book.prototype\"\
  );\n\nfunction showObject(object, name) {\n   document.writeln(\"\\n\\\"\"+name+\"\
  \\\" properties:\");\n   for (var item in object) {\n      document.writeln(\" \
  \  \"+item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n\
  ```\n\n该教程示例的输出确认了默认的 `prototype` 对象已被我名为 `myPrototype` 的对象所替换：\n\n```\n \"myBook\"\
  \ properties:\n   title: JavaScript Tutorials\n   author: Herong Yang\n   year:\
  \ 2008\n\n\"Book\" properties:\n   prototype: [object Object]\n\n\"Book.prototype\"\
  \ properties:\n   year: 2008\n```\n\n下图显示了在执行此教程示例期间发生的情况。起初赋值给 `Book.prototype`\
  \ 的默认对象在图中显示为灰色。\n\n![](img/image00144.jpeg)\n\n# 修改原型对象\n\nJavaScript Tutorials\
  \ - Herong's Tutorial Examples\n\n∟通过原型对象链继承属性和方法\n\n∟从两级原型对象继承属性\n\n本节简要描述了构造函数的原型对象如何形成两级继承。文中提供了一个教程示例，用于展示对象如何从第一级和第二级原型对象继承属性。\n\
  \n现在我们知道对象如何从其构造函数的原型对象继承属性。\n\n由于构造函数的原型对象也可以从其自己的构造函数的原型对象继承属性，因此一个对象可以从它自己的原型对象以及原型的原型对象继承属性。\n\
  \n为了向你展示这种两级继承，我在下面编写了此教程示例，允许 `myBook` 继承第一级原型中的 `price` 属性和第二级原型中的 `copyright`\
  \ 属性：\n\n```javascript\n <html>\n<!-- Inheritance_from_Second_Level_Prototype.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>Inheriting\
  \ Properties from the Second-Level Prototype Object\n</title>\n</head>\n<body>\n\
  <pre>\n<script type=\"text/javascript\">\n\n// Define the constructor: \"Book\"\n\
  function Book(title, author) {\n   this.title = title;\n   this.author = author;\n\
  }\n\n   // Adding a property to the \"prototype\"\nBook.prototype.price = 9.99;\n\
  \n   // Adding a property to the prototype's \"prototype\"\n   // Book.prototype's\
  \ constructor is Object\nObject.prototype.copyright = \"herongyang.com\";\n\n  \
  \ // Creating an object: \"myBook\"\n   var myBook = new Book(\"JavaScript Tutorials\"\
  , \"Herong Yang\");\n\n   // Showing the object, constructor, and prototype\n  \
  \ showObject(myBook, \"myBook\");\n   showObject(Book, \"Book\");\n   showObject(Book.prototype,\
  \ \"Book.prototype\");\n   showObject(Object.prototype, \"Object.prototype\");\n\
  \nfunction showObject(object, name) {\n   document.writeln(\"\\n\\\"\"+name+\"\\\
  \" properties:\");\n   for (var item in object) {\n      document.writeln(\"   \"\
  +item+\": \"+object[item]);\n   }\n}\n</script>\n</pre>\n</body>\n</html>\n```\n\
  \n该教程示例的输出确认了 JavaScript 允许对象从其多级父原型对象继承属性：\n\n```\n \"myBook\" properties:\n  \
  \ title: JavaScript Tutorials\n   author: Herong Yang\n   price: 9.99\n   copyright:\
  \ herongyang.com\n\n\"Book\" properties:\n   prototype: [object Object]\n   copyright:\
  \ herongyang.com\n\n\"Book.prototype\" properties:\n   price: 9.99\n   copyright:\
  \ herongyang.com\n\n\"Object.prototype\" properties:\n   copyright: herongyang.com\n\
  ```\n\n下图展示了对象如何从两级原型对象继承属性。\n\n![](img/image00145.jpeg)\n\n# 两级原型继承\n\nJavaScript\
  \ Tutorials - Herong's Tutorial Examples\n\n∟通过原型对象链继承属性和方法\n\n∟\"Object.prototype\"\
  \ 中的内置属性和方法\n\n本节简要描述了 `Object.prototype` 中的内置默认属性和方法。提供了一个教程示例来列出 `Object.prototype`\
  \ 中的内容。\n\n正如我在节一节中提到的，默认原型对象是由 `Object()` 构造函数创建的。它的原型对象 `Object.prototype` 是所有其他原型对象的基原型对象。因此，`Object.prototype`\
  \ 的属性将被所有对象继承。\n\n由于这种特性，JavaScript 在 `Object.prototype` 中提供了许多内置属性和方法，所有对象都可以继承树访问它们。其中一些列如下：\n\
  \n- `constructor`: 指向该对象构造函数的属性。\n- `hasOwnProperty(prop)`: 如果指定的属性属于该对象而不是从其原型链继承，则该方法返回\
  \ `true`。\n- `isPrototypeOf(obj)`: 如果此对象是子对象的父原型对象之一，该方法返回 `true`。\n- `toString()`:\
  \ 返回该对象的字符串表示的方法。\n- `valueOf()`: 返回该对象所代表的原始值的方法。\n\n让我们先确认这些属性和方法确实存在于 `Object.prototype`\
  \ 中。为了做到这一点，我编写了以下教程示例来打印它们的值。注意我 `hasOwnProperty()` 方法来区分\n\n```javascript\n <html>\n\
  <!-- Inheritance_Built_in_Propertie_and_Method.html\n   Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n-->\n<head>\n<title>Built-in Properties and Methods in Object.prototype</title>\n\
  </head>\n<body>\n<pre>\n<script type=\"text/javascript\">\n\n   // Adding a property\
  \ to the base prototype\nObject.prototype.copyright = \"herongyang.com\";\n\n  \
  \ // Dumping some built-in properties\n   document.writeln(\"\\nObject.prototype's\
  \ built-in properties:\");\n   dumpProperty(Object.prototype, \"constructor\");\n\
  \   dumpProperty(Object.prototype, \"hasOwnProperty\");\n   dumpProperty(Object.prototype,\
  \ \"isPrototypeOf\");\n   dumpProperty(Object.prototype, \"toString\");\n   dumpProperty(Object.prototype,\
  \ \"valueOf\");\n\n   // Dumping the user added property\n   document.writeln(\"\
  \\nObject.prototype's user added properties:\");\n   dumpProperty(Object.prototype,\
  \ \"copyright\");\n\nfunction dumpProperty(object, property) {\n   var inheritance;\
  \ \n   if (object.hasOwnProperty(property)) \n      inheritance = \"Local\";\n \
  \  else \n      inheritance = \"Inherited\";\n   document.writeln(\"   \"+property+\"\
  : \"+inheritance+\": \"\n      +object[property]);\n}\n</script>\n</pre>\n</body>\n\
  </html>\n```\n\n\n\n\n\n此教程示例的输出告诉我们，这些属性和方法确实存在并存在于 `Object.prototype` 对象。然而，JavaScript\
  \ 并不会在所有情况下向我们展示它们的值（即函数的定义）。\n\n```\n Object.prototype's built-in properties:\n\
  \   constructor: Local: function Object() {\n    [native code]\n}\n   hasOwnProperty:\
  \ Local: function hasOwnProperty() {\n    [native code]\n}\n   isPrototypeOf: Local:\
  \ function isPrototypeOf() {\n    [native code]\n}\n   toString: Local: function\
  \ toString() {\n    [native code]\n}\n   valueOf: Local: function valueOf() {\n\
  \    [native code]\n}\n\nObject.prototype's added properties:\n   copyright: Local:\
  \ herongyang.com\n```\n\n我现在准备更新我的 JavaScript 对象继承模型：\n\n![](img/image0146.jpeg)\n\
  \n## 属性和方法\n\n∟通过原型链继承属性和方法\n\n### 使用 \"hasOwnProperty()\" 方法测试属性\n\n本节简要描述内置方法\
  \ `hasOwnProperty()`。教程示例演示了如何使用 `hasOwnProperty()` 方法来测试属性是对象的本地属性还是继承的。\n\n从之前的章节中了解到，`Object.prototype`\
  \ 拥有一个名为 `hasOwnProperty()` 的方法，它会被所有对象继承。\n\n对于任何对象，你都可以使用 `hasOwnProperty(prop)`\
  \ 方法来测试指定的属性是否为该对象的本地属性。\n\n通过这个工具，我想回顾 `Book` 对象示例，检查不同继承层级的属性：\n\n```html\n<html>\n\
  <!-- Inheritance_Method.html\n   Copyright (c) HerongYang. All Reserved.\n-->\n\
  <head>\n<title>Using \"hasOwnProperty\" Method</title>\n</head>\n<body>\n<pre>\n\
  <script type=\"text/javascript\">\n\n// 设置构造函数、原型和对象\nfunction Book(title, author)\
  \ {\n   this.title = title;\n   this.author = author;\n}\n   Book.prototype.price\
  \ = 99;\n   Object.prototype.copyright = \"herongyang.com\";\n   var myBook = new\
  \ Book(\"JavaScript Tutorials\", \"Herong Yang\");\n\n   // 在基础原型层打印内置属性\n   document.writeln(\"\
  \\nObject.prototype's built-in properties:\");\n   dumpProperty(Object.prototype,\
  \ \"constructor\");\n   dumpProperty(Object.prototype, \"hasOwnProperty\");\n  \
  \ dumpProperty(Object.prototype, \"isPrototypeOf\");\n   dumpProperty(Object.prototype,\
  \ \"toString\");\n   dumpProperty(Object.prototype, \"valueOf\");\n\n   // 在原型层打印内置属性\n\
  \   document.writeln(\"\\nBook.prototype's built-in properties:\");\n   dumpProperty(Book.prototype,\
  \ \"constructor\");\n   dumpProperty(Book.prototype, \"hasOwnProperty\");\n   dumpProperty(Book.prototype,\
  \ \"isPrototypeOf\");\n   dumpProperty(Book.prototype, \"toString\");\n   dumpProperty(Book.prototype,\
  \ \"valueOf\");\n\n   // 在对象层打印内置属性\n   document.writeln(\"\\nmyBook's built-in\
  \ properties:\");\n   dumpProperty(myBook, \"constructor\");\n   dumpProperty(myBook,\
  \ \"hasOwnProperty\");\n   dumpProperty(myBook, \"isPrototypeOf\");\n   dumpProperty(myBook,\
  \ \"toString\");\n   dumpProperty(myBook, \"valueOf\");\n\nfunction dumpProperty(object,\
  \ property) {\n   var inheritance; \n   if (object.hasOwnProperty(property)) \n\
  \      inheritance = \"Local\";\n   else \n      inheritance = \"Inherited\";\n\
  \   document.writeln(\"   \"+property+\": \"+inheritance+\": \"\n      +object[property]);\n\
  }\n</script>\n</pre>\n</body>\n</html>\n```\n\n这是该教程示例的输出：\n\n```\n Object.prototype's\
  \ built-in properties:\n   constructor: Local: function Object() {\n    [native\
  \ code]\n}\n   hasOwnProperty: Local: function hasOwnProperty() {\n    [native code]\n\
  }\n   isPrototypeOf: Local: function isPrototypeOf() {\n    [native code]\n}\n \
  \  toString: Local: function toString() {\n    [native code]\n}\n   valueOf: Local:\
  \ function valueOf() {\n    [native code]\n}\n\nBook.prototype's built-in properties:\n\
  \   constructor: Local: function Book(title, author) {\n    this.title = title;\n\
  \    this.author = author;\n}\n   hasOwnProperty: Inherited: function hasOwnProperty()\
  \ {\n    [native code]\n}\n   ...\n\nmyBook's built-in properties:\n   constructor:\
  \ Inherited: function Book(title, author) {\n    this.title = title;\n    this.author\
  \ = author;\n}\n   ...\n```\n\n请注意：\n\n* 内置默认属性和方法确实被 `Book.prototype` 和 `myBook`\
  \ 继承了。\n\n* 但有一个例外。`Book.prototype` 拥有 `constructor` 的本地副本，指向 `Book()`。这告诉我们 JavaScript\
  \ 在 `Book.prototype` 中创建了一个本地属性 `constructor`，而不是从 `Object.prototype` 继承而来的。\n\n\
  JavaScript 教程 - Herong 的教程示例\n\n∟通过原型对象链继承属性和方法\n\n### 在 \"prototype\" 对象中设置 \"\
  constructor\" 属性\n\n本节简要描述原型对象中 `constructor` 属性的本地副本。教程示例演示了如果你替换了默认的原型对象，应该如何添加\
  \ `constructor` 属性。\n\n从之前的教程示例中，我们注意到当创建一个新的构造函数时，JavaScript 会自动为你创建一个默认的原型对象并将其赋值给构造函数。在这个默认的原型对象中，会添加一个指向构造函数本身的\
  \ `constructor` 属性的本地副本。\n\n换句话说，一个构造函数（例如 `Book()`）和它的默认原型对象之间形成了一个循环引用。以下表达式应该返回\
  \ \"true\"：\n\n```\n Book === Book.prototype.constructor \n```\n\n但如果你用自己的原型对象替换了默认的原型对象，你需要通过类似语句手动添加本地\
  \ `constructor` 属性：\n\n```javascript\n Book.prototype.constructor = Book;\n```\n\
  \n\n\n\n\n```html\n <html>\n<!-- Inheritance_prototype_constructor_Property.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>在原型对象中设置\
  \ \"constructor\" 属性</title>\n</head>\n<body>\n<pre>\n<script type=\"text/javascript\"\
  >\n\n// 设置我的构造函数、原型和对象\nfunction Book(title, author) {\n   this.title = title;\n\
  \   this.author = author;\n}\n\n   // 替换默认的原型对象\n   myPrototype = new Object();\n\
  \   Book.prototype = myPrototype;\n   Book.prototype.price = 9.99;\n   Book.prototype.constructor\
  \ = Book;\n\n   // 修改基础原型对象\n   Object.prototype.copyright = \"herongyang.com\"\
  ;\n\n   // 从我的构造函数创建对象\n   var myBook = new Book(\"JavaScript Tutorials\", \"Herong\
  \ Yang\");\n\n   // 在基础原型层级转储（打印）内置属性\n   document.writeln(\"\\nObject.prototype's\
  \ built-in properties:\");\n   dumpProperty(Object.prototype, \"constructor\");\n\
  \   dumpProperty(Object.prototype, \"hasOwnProperty\");\n   dumpProperty(Object.prototype,\
  \ \"isPrototypeOf\");\n   dumpProperty(Object.prototype, \"toString\");\n   dumpProperty(Object.prototype,\
  \ \"valueOf\");\n\n   // 在我的原型层级转储内置属性\n   document.writeln(\"\\nBook.prototype's\
  \ built-in properties:\");\n   dumpProperty(Book.prototype, \"constructor\");\n\
  \   dumpProperty(Book.prototype, \"hasOwnProperty\");\n   dumpProperty(Book.prototype,\
  \ \"isPrototypeOf\");\n   dumpProperty(Book.prototype, \"toString\");\n   dumpProperty(Book.prototype,\
  \ \"valueOf\");\n\n   // 在对象层级转储内置属性\n   document.writeln(\"\\nmyBook's built-in\
  \ properties:\");\n   dumpProperty(myBook, \"constructor\");\n   dumpProperty(myBook,\
  \ \"hasOwnProperty\");\n   dumpProperty(myBook, \"isPrototypeOf\");\n   dumpProperty(myBook,\
  \ \"toString\");\n   dumpProperty(myBook, \"valueOf\");\n\nfunction dumpProperty(object,\
  \ property) {\n   var inheritance; \n   if (object.hasOwnProperty(property)) \n\
  \      inheritance = \"Local\";\n   else \n      inheritance = \"Inherited\";\n\
