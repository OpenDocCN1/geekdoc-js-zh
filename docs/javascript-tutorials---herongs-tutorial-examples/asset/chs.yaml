  \ 5.6            ECMA-262 Edition 3, 1999\n2002   Netscape 7.0/JavaScript 1.5  \
  \ ECMA-262 Edition 3, 1999\n2004   Firefox 1.0                   ECMA-262 Edition\
  \ 3, 1999\n2006   IE 7.0/JScript ?              ECMA-262 Edition 3, 1999\n2006 \
  \  Firefox 2.0/JavaScript 1.7    ECMA-262 Edition 3, 1999\n2007   Netscape 8.0/JavaScript\
  \ ?     ECMA-262 Edition ?\n2008   IE 8.0/JScript ?              ECMA-262 Edition\
  \ ?\n200?   Firefox 3.0/JavaScript 1.8    ECMA-262 Edition ?\n2011   Firefox 4.0/JavaScript\
  \ 1.8.5  ECMA-262 Edition ?\n                                     ECMA-262 Edition\
