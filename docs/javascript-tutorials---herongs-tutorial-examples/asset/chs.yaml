  >\n   var i, j, is_prime;\n   i = 3;\n   while ( i<=30 ) {\n      is_prime = true;\n\
  \      j = 2;\n      while ( j<=i/2 ) {\n         is_prime = i%j > 0;\n        \
  \ if (!is_prime) break;\n         j++;\n      }\n      if (is_prime)\n         document.write(\"\
  Found a prime number: \" + i + \".\\n\");\n      i += 2;\n   }\n</script>\n</pre>\n\
  </body\n</>\n```\n\n此 JavaScript 使用嵌套的 `while` 语句来计算质数。它的执行逻辑与 `While_Loop_Statements.html`\
  \ 中的 JavaScript 相同。\n\n此示例 JavaScript 的输出为：\n\n```\n Found a prime number: 3.\n\
  Found a prime number: 5.\nFound a prime number: 7.\nFound a prime number: 11.\n\
  Found a prime number: 13.\nFound a prime number: 17.\nFound a prime number: 19.\n\
