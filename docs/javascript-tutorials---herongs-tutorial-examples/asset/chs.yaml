  \ 3.0            ECMA-262 Edition 1, 1997\n199?   Netscape 4.0/JavaScript 1.2  \
  \ ECMA-262 Edition 1, 1997\n1999   IE 5.0/JScript 5.0            ECMA-262 Edition\
