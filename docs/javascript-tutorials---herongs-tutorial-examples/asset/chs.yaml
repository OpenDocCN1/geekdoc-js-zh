  \n本节提供了一个使用 `document.implementation.hasFeature()` 方法的教程示例，用于测试特定 Web 浏览器支持的 DOM\
  \ 级别。\n\n在 DOM Level 1、2 和 3 规范中，有一个方法可以让你测试特定 Web 浏览器支持多哪些 DOM 规范级别：`document.implementation.hasFeature(feature,\
  \ level)`。如果 Web 浏览器支持指定的特性和级别，它返回 true。请注意，级别必须以点格式指定，如 `1.0`、`2.0` 或 `3.0`。\n\n\
  我在教程示例使用了此方法来测试我机器上 Web 浏览器支持的 DOM 级别。\n\n```\n <html>\n<!-- DOM_Level_Test.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>DOM\
  \ Level Test</title>\n</head>\n<body><pre>\n<script type=\"text/javascript\">\n\
  \   document.writeln(\"\\nDOM Level 0 Test:\");\n   document.writeln(\"   document.bgColor\
  \ = \"+document.bgColor);\n\n   for (var i=1; i<4; i++) {\n      document.writeln(\"\
  \\nDOM Level \"+i+\".0 Test:\");\n      document.writeln(\"   Core \"+i+\".0 = \"\
  \n         + document.implementation.hasFeature(\"Core\", i+\".0\"));\n      document.writeln(\"\
  \   HTML \"+i+\".0 = \"\n         + document.implementation.hasFeature(\"HTML\"\
  , i+\".0\"));\n   }\n</script>\n</pre></body>\n</html\n```\n\n当我使用此脚本测试 Chrome 68\
  \ 和 Firefox 61 时，结果显示它们支持 DOM Level 1、2 和 3。\n\n```\n DOM Level 0 Test:\n   document.bgColor\
  \ = \n\nDOM Level 1.0 Test:\n   Core 1.0 = true\n   HTML 1.0 = true\n\nDOM Level\
  \ 2.0 Test:\n   Core 2.0 = true\n   HTML 2.0 = true\n\nDOM Level 3.0 Test:\n   Core\
