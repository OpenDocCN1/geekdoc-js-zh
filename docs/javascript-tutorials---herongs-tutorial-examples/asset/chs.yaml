  \n∟继承视图与 API 的扁平化视图\n\n本节提供了 DOM API 的两种不同视图：扁平化视图 - 一切都是节点，以及继承视图 - 继承接口的层级结构。\n\
  \nDOM API 提供了两种表示 XML/HTML 文档的不同方法：\n\n1. “面向对象”方法 - 文档由一组链接对象表示，这些对象具有具有层级结构的不同接口。换句话说，整个\
  \ DOM API 可以被视为一个继承接口的层级结构。这被称为“DOM 的继承视图”。\n\n在“DOM 的继承视图”中，你只需要学习一组相关的接口：\n\n\
  ```\n interface Node\n^\n|- interface Document : Node\n|  ^\n|  |- interface HTMLDocument\
  \ : Document\n|\n|- interface Element : Node\n   ^\n   |- interface  HTMLElement\
  \ : Element\n      ^\n      |- interface HTMLHtmlElement : HTMLElement\n      |-\
  \ interface HTMLHeadElement : HTMLElement\n      |- interface HTMLTitleElement :\
  \ HTMLElement\n      |- interface HTMLBodyElement : HTMLElement\n      |- interface\
  \ HTMLParagraphElement : HTMLElement\n      |- interface HTMLFormElement : HTMLElement\n\
  \      |- interface HTMLImageElement : HTMLElement\n      ...\n```\n\n2. “一切都是节点”方法\
  \ - 文档由对象树表示，这些对象具有名为“Node”的单一接口。换句话说，整个 DOM API 可以被视为单一接口 - `Node` 接口。这被称为“DOM\
  \ 的扁平化视图”。\n\n在“DOM 的扁平化视图”中，你只需要学习一个接口，“Node”：\n\n```\n interface Node {\n  readonly\
  \ attribute DOMString        nodeName;\n           attribute DOMString        nodeValue;\n\
  \  readonly attribute unsigned short   nodeType;\n  readonly attribute Node    \
  \         parentNode;\n  readonly attribute NodeList         childNodes;\n  readonly\
  \ attribute NamedNodeMap     attributes;\n  readonly attribute Document        \
  \ ownerDocument;\n  Node               removeChild(in Node oldChild);\n  Node  \
  \             appendChild(in Node newChild);\n  ...\n};\n```\n\nJavaScript 教程 -\
  \ Herong 的教程示例\n\n∟W3C 文档对象模型 (DOM) 规范\n\n∟Web 文档 接口接口树\n\n本节提供了一个 JavaScript 教程示例，用于显示元素的\
  \ DOM 接口。我们知道一个 Web 页面（文档）是一个元素树（忽略属性）。从面向对象的角度来看，不同的元素由不同类型的对象表示。\n\n现在通过一个简单的\
  \ JavaScript 示例遍历树，确定每个元素支持的接口：\n\n```\n <html\n<!-- DOM_API_Oriented_View.html\n\
  \   Copyright (c) HerongYang.com. All Rights Reserved.\n-->\n<head>\n<title>DOM\
  \ API - 面向视图</title>\n<style type=\"text/css\">body {background-color: #aaaaff}</style>\n\
  <script type=\"text/javascript\">\nfunction showInterface(node, prefix, out) {\n\
  \   out += prefix+node.constructor+\"\\n\";\n   var list = node.childNodes;\n  \
  \ for (var i=0; i<list.length; i++) {\n      out = showInterface(list.item(i), prefix+\"\
  \   \", out);\n   }\n   return out;\n}\nfunction show() {\n   var text = document.createTextNode(showInterface(document,\"\
  \",\"\"));\n   var display = document.getElementById(\"display\");\n   display.replaceChild(text,display.firstChild);\n\
  }\n</script>\n</head>\n<body>\n这段第一个文本直接在“body”元素中。\n<p>这段第二个文本在“p”元素中。</p>\n<form\
  \ action=\"nothing\" method=\"get\">\n   <input type=\"button\" value=\"View\" onClick=\"\
  show();\"/>\n</form>\n<pre id=\"display\">\n点击 View 按钮查看接口名称...\n</pre>\n</body>\n\
  </html>\n```\n\n请注意，我使用了一个特殊属性 `node.constructor` 来获取构造函数的名称，这通常也是实现 DOM 接口的 JavaScript\
  \ 类名。`node.constructor` 并不是有效的 DOM 属性。\n\n我尝试过使用 DOM 属性 `node.className` 来获取实现类名，但\
  \ Firefox 返回“undefined”。\n\n如果你在 Firefox 18 中运行这个 JavaScript 页面并点击“View”按钮，你将获得该\
  \ Web 页面使用的 DOM 接口的漂亮树列表：\n\n\n\n\n\n```\n [object HTMLDocument]\n   [object HTMLHtmlElement]\n\
  \      [object Comment]\n      [object HTMLHeadElement]\n         [object Text]\n\
  \         [object HTMLTitleElement]\n            [object Text]\n         [object\
  \ Text]\n         [object HTMLStyleElement]\n            [object Text]\n       \
  \  [object Text]\n         [object HTMLScriptElement]\n            [object Text]\n\
  \         [object Text]\n      [object Text]\n      [object HTMLBodyElement]\n \
  \        [object Text]\n         [object HTMLParagraphElement]\n            [object\
  \ Text]\n         [object Text]\n         [object HTMLFormElement]\n           \
  \ [object Text]\n            [object HTMLInputElement]\n            [object Text]\n\
  \         [object Text]\n         [object HTMLPreElement]\n            [object Text]\n\
  \         [object Text]\n```\n\n# JavaScript 教程 - Herong 的教程示例\n\n## W3C 文档对象模型\
  \ (DOM) 规范\n\n## 将 Web 文档视为节点树\n\n本节提供了一个 JavaScript 教程示例用于展示 页面是一个节点树。这展示了 DOM\
  \ API 的简化扁平化视图。\n\n我们知道 Web 页面（一个 HTML 文档）是一个元素树（暂时忽略属性）。从简化的角度来看，所有元素都由 `Node`\
  \ 接口表示。为了区分不同类型的节点，我们可以检查“type”（类型）和“name”（名称）属性。\n\n现在，让我们通过一个简单的 JavaScript 示例遍历树，并将每个元素呈现为带有类型和名称的节点：\n\
  \n```\n <html>\n<!-- DOM_API_Simplified_Node_View.html\n   Copyright (c) HerongYang.com.\
  \ All Rights Reserved.\n-->\n<head>\n<title>DOM API - Simplified Node View</title>\n\
  <style type=\"text/css\">body {background-color: #aaaaff}</style>\n<script type=\"\
  text/javascript\">\nfunction showInterface(node, prefix, out) {\n   var typeName\
  \ = new Array(\"NULL\", \"ELEMENT\", \"ATTRIBUTE\", \"TEXT\",\n      \"CDATA\",\
  \ \"ENTITY_REFERENCE\", \"ENTITY\", \"RROCESSING_INSTRUCTION\",\n      \"COMMENT\"\
  , \"DOCUMENT\", \"DOCUMENT_TYPE\", \"DOCUMENT_FRAGMENT\",\n      \"NOTATION\");\n\
  \   out += prefix+\"[Node type=\"+typeName[node.nodeType]\n      +\" name=\"+node.nodeName+\"\
  ]\\n\";\n   var list = node.childNodes;\n   for (var i=0; i<list.length; i++) {\n\
  \      out = showInterface(list.item(i), prefix+\"   \", out);\n   }\n   return\
  \ out;\n}\nfunction show() {\n   var text = document.createTextNode(showInterface(document,\"\
  \",\"\"));\n   var display = document.getElementById(\"display\");\n   display.replaceChild(text,display.firstChild);\n\
  }\n</script>\n</head>\n<body>\n第一段文本直接位于 \"body\" 元素中。\n<p>第二段文本位于 \"p\" 元素中。</p>\n\
  <form action=\"nothing\" method=\"get\">\n   <input type=\"button\" value=\"View\"\
  \ onClick=\"show();\"/>\n</form>\n<pre id=\"display\">\n点击 View 按钮查看接口名称...\n</pre>\n\
  </body>\n</html>\n```\n\n注意，我正在使用数组将 `node.nodeType` 从整数转换为字符串。\n\n如果你在 Firefox\
  \ 2.0 中运行此 JavaScript 页面并点击 \"View\" 按钮，你将获得一个包含该 Web 页面节点类型和名称的漂亮树列表：\n\n```\n\
  \ [Node type=DOCUMENT name=#document]\n   [Node type=ELEMENT name=HTML]\n      [Node\
  \ type=ELEMENT name=HEAD]\n         [Node type=COMMENT name=#comment]\n        \
  \ [Node type=ELEMENT name=TITLE]\n            [Node type=TEXT name=#text]\n    \
  \     [Node type=TEXT name=#text]\n         [Node type=ELEMENT name=STYLE]\n   \
  \         [Node type=TEXT name=#text]\n         [Node type=TEXT name=#text]\n  \
  \       [Node type=ELEMENT name=SCRIPT]\n            [Node type=TEXT name=#text]\n\
  \      [Node type=ELEMENT name=BODY]\n         [Node type=TEXT name=#text]\n   \
  \      [Node type=ELEMENT name=P]\n            [Node type=TEXT name=#text]\n   \
  \      [Node type=TEXT name=#text]\n         [Node type=ELEMENT name=FORM]\n   \
  \         [Node type=TEXT name=#text]\n            [Node type=ELEMENT name=INPUT]\n\
  \            [Node type=TEXT name=#text]\n         [Node type=TEXT name=#text]\n\
  \         [Node type=ELEMENT name=PRE]\n            [Node type=TEXT name=#text]\n\
  \         [Node type=TEXT name=#text]\n```\n\n# JavaScript 教程 - Herong 的教程示例\n\n\
  ## W3C 文档对象模型 (DOM) 规范\n\n## 在新窗口中导出文档 - JavaScript 源码\n\n本节提供了一个 JavaScript 教程示例，使用\
  \ DOM API 属性和方法将浏览器内置的 `document` 对象作为 XML 消息导出到新浏览器窗口。\n\n为了总结我目前学到的关于 DOM API\
  \ 规范的知识，我写了一个 JavaScript 页面 `DOM_HTML_Document_Dump.html` 来用 DOM 属性和方法导出浏览器内置的 \"\
  document\" 对象：\n\n```\n <html>\n<head>\n<!-- DOM_HTML_Document_Dump.html\n   Copyright\
  \ (c) HerongYang.com. All Rights Reserved.\n-->\n<title>在新窗口中导出 HTML 文档</title>\n\
  <script type=\"text/javascript\">\nfunction nodeToXML(node, indentation, out) {\n\
  \   out += indentation+\"<\"+node.nodeName.toLowerCase();\n   if (node.attributes!=null)\
  \ {\n      for (var i=0; i<node.attributes.length; i++) {\n         var item = node.attributes.item(i);\n\
  \         var value = item.nodeValue;\n         if (value==null) value = \"\";\n\
  \         out += \" \"+item.nodeName+\"=\\\"\"+value+\"\\\"\";\n      }\n   }\n\
  \   out += \">\\n\";\n   for (var i=0; i<node.childNodes.length; i++) {\n      var\
  \ item = node.childNodes.item(i);\n      out = nodeToXML(item, indentation+\"  \
  \ \", out);\n   }\n   if (node.nodeValue!=null) \n      out += indentation+\"  \
  \ \"+node.nodeValue+\"\\n\";\n   out += indentation+\"</\"+node.nodeName.toLowerCase()+\"\
  >\\n\";\n   return out;\n}\nfunction show() {\n   var w = window.open('', 'Popup',\
  \ '');\n   w.document.write('<html><head><title>Document Dump</title>');\n   w.document.write('</head><body><pre>');\n\
  \n   var s = nodeToXML(document, '', '');\n   s = s.replace(new RegExp('&','g'),'&amp;');\n\
  \   s = s.replace(new RegExp('<','g'),'&lt;');\n   s = s.replace(new RegExp('>','g'),'&gt;');\n\
  \   w.document.write(s);\n   w.document.write('</pre></body></html>');\n   w.document.close();\n\
  }\n</script>\n</head>\n<body>\n<script type=\"text/javascript\">\n   document.write('<p>点击在新窗口中显示文档：</p>');\n\
  </script>\n<form>\n<input type=\"button\" value=\"Show\" onClick=\"show();\"/>\n\
  </form>\n</body>\n</html>\n```\n\n这段 JavaScript 的思路非常简单：\n\n*   使用递归函数 `nodeToXML()`\
  \ 遍历文档树。\n*   对于每个节点，将其作为 XML 元素导出。节点名称变为元素名称。节点属性变为元素属性。节点子列表变为元素子列表。节点值变为元素内容。\n\
  *   导出的 XML 字符串随后在新窗口中显示。\n\n阅读后续章节查看某些流行 浏览器的结果。\n\n# JavaScript 教程 - Herong 的教程示例\n\
