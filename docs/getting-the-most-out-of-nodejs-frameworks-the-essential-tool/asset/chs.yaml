  \ Git 的朋友，可以从 [`git-scm.com`](https://git-scm.com) 下载相应的安装程序——Windows、Mac 以及 Linux\
  \ 平台都有可用的安装程序。\n\n要验证你的 Git 安装，可以发出一个简单的命令来检查已安装的 Git 版本，如下所示：\n\n如果一切安装正确，你将看到其中显示的已安装\
