  \n## 结论\n\n在本章中，我们大致了解了 Aurelia 作为一个框架的基本概况。我们可以基于这些知识进一步掌握 Aurelia，并用它做更多事情。\n\n\
  ### Aurelia 生态系统\n\n作为一个用于 Web、移动和桌面的 JavaScript 客户端框架，Aurelia 有很多值得探讨的潜力。然而，就其生态系统而言，新用户往往会遇到一些障碍。\n\
  \n首先需要牢记的是，Aurelia 的文档有时会令人困惑。这使得初学者的学习曲线更加陡峭。话虽如此，互联网上由社区维护的文献还算令人满意，但官方文档的分类相当糟糕，用户可能难以快速找到关键概念。\n\
  \n尽管如此，学习 Aurelia 本身也有几个关键优势。在很大程度上，它是一个灵活的框架，能够适应各种使用场景。虽然它不像 React 那样受欢迎，但它仍然是许多开发者和用户的不错选择。因此，如果你正在寻找一个简单、无冗余、能完成任务的客户端框架，Aurelia\
  \ 绝对值得一看！\n\n### 后续步骤\n\n既然你已经了解了 Aurelia，接下来该做什么呢？\n\n花点时间熟悉一下 Aurelia 的整体工作流程可能是个好主意。有许多插件和扩展可以让\
  \ Aurelia 开发者的工作更轻松。\n\n大多数情况下，你可能会使用 Aurelia 来构建简化的 Web 应用或类似项目。更重要的是，你还可以考虑将其与\
  \ Polymer 或 Webpack 集成（我们将在本书后续章节中介绍 Webpack），请记住 Aurelia 既支持本地化，也能处理外部查询。\n\n###\
  \ 推荐资源\n\n大多数情况下，无需参考大量文献就能掌握 Aurelia。\n\n*   如果你在寻找实际示例，可以在 [`aurelia.io/​docs/​tutorials/​creating-a-todo-app`](https://aurelia.io)\
  \ 找到待办事项应用教程，以及在 [`aurelia.io/​docs/​tutorials/​creating-a-contact-manager`](https://aurelia.io)\
  \ 找到联系人管理器应用教程。\n\n*   此外，Aurelia 也有自己的培训部分，可通过 [`aurelia.io/​#training`](https://aurelia.io)\
  \ 地址访问。\n\n*   最后，如果你需要一份关于 Aurelia 应用开发的详细指南，Matthew Duffield 所著的《Practical App\
  \ Development with Aurelia》是一本不错的参考书。该书可通过 [`www.apress.com/​us/​book/​9781484234013`](https://www.apress.com)\
  \ 获取。\n\n*   Aurelia 主页：[`aurelia.io/​home`](https://aurelia.io)\n\n*至此，关于 Aurelia\
  \ 的这一章就结束了。到目前为止，我们已经学习了六种不同的 JavaScript 框架*。\n\n*在下一章中，我们将把注意力转向 Svelte，这是一个旨在创建无框架应用的\
  \ JavaScript 框架——感到困惑了吗？让我们在下一章中进一步了解 Svelte！*\n\n# 第 7 章 Svelte\n\nDOI：[10.1201/​9781003203711-7](https://doi.org/10.1201/9781003203711-7)\n\
  \n在上一章中，我们学习了 Aurelia JavaScript 框架。与 JavaScript 中的其他所有框架一样，Aurelia 也需要在代码执行期间加载和运行。但是，如果某个框架能提供技术上无框架的模板，岂不是更好？\n\
  \n想知道这怎么可能吗？\n\n在本章中，我们将介绍一个能够做到这一点的 JavaScript 框架。我们讨论的 JS 框架 Svelte 将自己描述为“神奇的消失用户界面（UI）框架”。这个短语本身足以说明\
  \ Svelte 是用于 UI 开发的。\n\n当然，这还不足以证明 Svelte 的优势和目的。那么，让我们开始对这个灵活多变的 JavaScript 框架进行更全面的介绍。\n\
  \n## 引言\n\n我们首先将讨论 Svelte 带来的好处和优势，以及任何可能的缺点。然后，我们将进入框架的安装和实际使用。\n\n### 什么是 Svelte？\n\
  \n如上所述，Svelte 使用的标语是“神奇的消失 UI 框架”。当我们说“消失”时，我们是相当务实地在说——Svelte 在构建时（而非运行时）将我们的应用转换为纯\
  \ JavaScript。\n\n### 这意味着什么？\n\n好吧，让我们这样理解。在本书的前几章中，我们阅读了关于 React、Angular、Vue 等\
  \ JS 框架的内容。无论它们用于何种目的，大多数框架都有一个共同特点——这些 JS 框架帮助我们轻松编写代码，然后在代码运行或执行时将应用代码转换或解释为理想的\
  \ JS。\n\n自然，这意味着 JS 框架本身需要在运行时存在。而 Svelte 则在构建时就将应用代码转换为理想的 JS。这意味着我们在运行时并不需要完整地附带\
  \ Svelte。\n\n简单来说，Svelte 不是在运行时加载一个庞大的运行时库，而是在构建时进行编译。这使我们的代码文件体积更小，应用也得到内在优化。\n\
  \n### Svelte 有何特别之处？\n\nSvelte 之所以特别，最明显的一点是它能够生成无框架且高度精简的代码。\n\n总的来说，考虑到我们已经介绍了相当多的\
  \ JS 框架，我们知道大多数框架都要求我们将它们作为 `<script>` 标签添加到页面中。\n\n\n\n\n\n然而，Svelte 略有不同。请记住，Svelte\
  \ 并非在运行时执行，而是在构建时运行，因此我们需要将其集成到构建系统中。\n\n根据我们选择的构建系统（无论是 Rollup、Gulp 还是其他类似工具），我们可以找到所需的插件，然后相应地集成\
  \ Svelte。在本章后面，我们将详细讨论 REPL 和 Rollup 集成，并介绍与其他各种构建系统集成 Svelte 的插件链接。\n\n这正是 Svelte\
  \ 的独特之处。通过要求与构建系统本身集成，Svelte 能够为开发者提供更强大、更全面的控制。此外，它不需要我们重新发明轮子或改变工作方式，而是根据我们选择集成的插件和构建系统来调整自身。\n\
  \n话虽如此，同样值得注意的是，Svelte 在速度和执行方面提供了显著的改进。我们几乎不需要将庞大的依赖项与代码捆绑在一起，从而避免运行时延迟；Svelte\
  \ 在构建时就已经提前处理了所有问题。\n\n因此，如果我们称 Svelte 更像是一个编译器，同时具备用于 UI 开发的 JS 框架的能力，这或许并非错误的推论。考虑到\
  \ Svelte 在构建过程中进行编译，它与现代编译器确实有很多共同之处。\n\n### 优点\n\nSvelte 提供的最明显、最大的优势是，它在构建时将应用转换为理想的\
  \ JS，因此在运行时没有臃肿的代码。这相对减少了加载时间，使我们的应用不仅体积更小，而且加载速度更快。\n\n自然，由于加载时间缩短，应用的内存使用量也会相应减少。Svelte\
  \ 几乎消除了运行时库的开销，从而为我们提供了优化更好、执行更干净、运行更轻松且消耗更少内存资源的 JS 代码。\n\n但 Svelte 节省的远不止执行时间！通过提供封装了相互关联的函数和特性的可重用代码块（称为组件），Svelte\
  \ 还能节省大量开发时间。这意味着我们的应用不仅运行更快，而且构建也更快！\n\n对于喜欢简洁、逻辑清晰的开发工作流程的人来说，Svelte 拥有自己的 API。它易于安装（我们将在本章中很快看到），并且更易于学习。此外，Svelte\
  \ 可以无缝集成到现有项目代码库中，进一步提升代码运行时性能。\n\n这意味着 Svelte 不仅适用于独立开发，也适用于集成到现有的大型项目中。话虽如此，Svelte\
  \ 的单文件组件和更快的处理速度也使其成为构建移动应用（例如 Android 应用）的不错选择。\n\n### 缺点\n\n但 Svelte 不可能全是优点，对吧？\n\
  \nSvelte 最大的缺点是，在 JS 框架的阵营中，它仍然是一个不太流行的存在。诚然，它正以值得称赞的速度崛起，并拥有一些令人惊叹的性能改进，但归根结底，Svelte\
  \ 并不是人们可能期望的那种高度流行的 JS 框架。\n\n在撰写本文时，Svelte 的 Discord 频道总用户数略超过 550 人；这对大多数人来说已经是一个不错的数字，但如果期望的是成千上万的活跃用户，Svelte\
  \ 就显得太小了。\n\n更重要的是，考虑到 Svelte 的方法相当独特，它可能并不适合每个人的工作流程。如果你不习惯将 JS 框架集成到构建系统中，而更倾向于使用主流方案，那么\
  \ Svelte 可能不是你的理想选择。\n\n文档确实值得称赞。然而，在用户友好性方面，它仍然与人们的期望相去甚远；没有视频教程，也没有针对初学者的分步指南。不过，Svelte\
  \ 才刚刚起步，随着时间的推移，情况肯定会有所改善。\n\n目前，考虑到 Svelte 拥有众多可能性，并且是一个相当令人印象深刻的 JS 框架，强烈建议花些时间更深入、更仔细地了解它。\n\
  \n为此，让我们开始使用 Svelte 吧！\n\n## 如何使用 Svelte？\n\n既然我们已经了解了 Svelte 能为我们做什么，那么就开始使用它吧。\n\
  \n### 安装 Svelte\n\n使用任何 JS 框架的第一步，显然都是安装！到目前为止，我们大多使用 `npm` 来安装 JS 框架。对于 Svelte\
  \ 来说，同样适用。Svelte 在 `npm` 包仓库中可用，地址为 [`www.npmjs.com/​package/​svelte`](https://www.npmjs.com)，并附有详细的安装和使用指南。\n\
  \n大多数情况下，我们通过 `npm` 安装 Svelte 的命令是：\n\n```\nnpm install svelte\n```\n\n除此之外，与 Aurelia\
  \ 类似，Svelte 也有自己的命令行界面（CLI），我们可以安装并使用它。要全局安装 Svelte CLI，可以使用以下命令：\n\n```\nnpm install\
  \ -g svelte-cli\n```\n\n现在，我们已经通过 `npm` 安装了 Svelte 和 Svelte CLI，那么是否可以认为一切准备就绪，可以开始工作了？嗯，显然不是。\n\
  \n一般来说，如果我们只是想初步尝试 Svelte，看看它能做什么以及如何工作，Svelte CLI 非常有用。但如果最终目标是严肃的应用开发，则不推荐使用 Svelte\
  \ CLI。\n\n对于生产环境，Svelte CLI 确实可以轻松编译我们的组件，但它不会在更改时自动重新编译组件。这意味着每次修改代码时，都必须手动重复编译过程。这几乎违背了使用\
  \ JS 框架节省时间和精力的初衷。\n\n因此，虽然我们随时可以试用 Svelte CLI，但在生产环境中，我们可能需要更快、更简单的东西。\n\n为此，让我们将注意力转向\
  \ Svelte REPL。\n\n### 使用 Svelte 构建应用\n\n开始使用 Svelte 的最简单方法不是通过 CLI。相反，我们可以访问 Svelte\
  \ REPL，地址为 [`svelte.technology/​repl`](https://svelte.technology)\n\nSvelte REPL\
  \ 包含一系列方便初学者的示例。如果你刚开始 Svelte 开发，或许通读这些示例是个好主意。\n\nREPL 最棒的地方在于，我们可以立即开始编写一些基本代码，并预览其中的更改和\
  \ HTML。一旦我们确信代码已经超出了 Svelte REPL 的范围，只需点击“下载”按钮，即可获取包含所有相关代码文件的 zip 文件。\n\n下载后，我们可以将文件解压到任意目录。然后，在终端窗口中，我们需要导航到该目录：\n\
  \n```\ncd /path/to/your/app\n```\n\n并在其中运行 `npm install`：\n\n```\nnpm install\n\
  ```\n\n接着运行开发引擎：\n\n```\nnpm run dev\n```\n\n这将启动我们的应用，引擎将等待更改，如终端窗口所示。\n\n我们可以安全地在任意\
  \ Web 浏览器中导航到 `localhost:5000` 端口地址。此外，当我们对代码文件（位于应用目录下的 `src` 子目录中）进行更改时，输出将刷新以显示最新更改。\n\
  \n就是这样！我们已经成功在开发系统上安装并运行了 Svelte，可以开始用它构建出色的东西了。\n\n### 理解 Svelte 组件\n\n\n\n\n在\
  \ Svelte 中，组件是每个应用程序的构建块。因此，我们可以说 Svelte 组件是一个可复用的自包含代码块，它将样式、标记和其他资源整合在一起。\n\n\
  在实际应用中，我们遇到的每个组件都是一个单独的 HTML 文件。然后，Svelte 可以将每个 HTML 文件转换为一个 JS 模块，该模块可以进一步导入到我们的应用程序中。\n\
  \n例如，假设我们有一个位于 `something.html` 的组件。现在，要使用这个仅包含单个文件的组件，我们需要将其导入到应用程序中，如下所示：\n\n\
  上述代码将导入该组件。然后我们可以修改其数据，例如：\n\n当应用程序运行完毕后，我们可以分离该组件并清理内存：\n\n关于组件的内容就这些！上面的示例展示了\
  \ Svelte API 在实际使用中的工作方式。值得花些精力去了解更多关于 Svelte 中可用的组件 API，因为该列表会经常更新以反映最新的变化：[`svelte.technology/​guide#component-api`](https://svelte.technology)\n\
  \n### 附加信息：使用 degit 搭建 Svelte 模板\n\n考虑到 Svelte 主要用于 UI 开发，开发者自然会对应用程序的前端感到好奇。\n\n\
  本质上，每次我们从 Svelte REPL 下载一个 zip 文件并在系统上开始处理它时，我们也在获取一个定制版本的 Svelte 模板。\n\n这个特定的模板本身可以在\
  \ GitHub 上找到，地址为 [`github.com/​sveltejs/​template`](https://github.com)\n\n大多数情况下，许多开发者可能更倾向于定制模板以满足自己的需求。在这种情况下，fork\
  \ 模板是合理的，并且可以在 GitHub 上轻松完成。然而，我们真的需要一直摆弄 zip 文件吗？\n\n这时 `degit` 就可以派上用场了。它是一个简单、完全开源且完全免费使用的项目脚手架工具。换句话说，`degit`\
  \ 可以用来复制现有的 Git 仓库。因此，当我们运行 `degit repo-address-here` 时，它会定位到该仓库的最新提交，然后下载 `tar.gz`\
  \ 文件。\n\n`degit` 的 GitHub 仓库可以在 [`github.com/​Rich-Harris/​degit`](https://github.com)\
  \ 找到\n\n`degit` 本身比使用 `git clone` 快得多，因为我们不会下载整个 Git 历史，只下载最新提交的 `tar.gz` 文件。\n\n\
  为了将 `degit` 与 Svelte 一起使用，第一步是安装 `degit`。我们需要在系统上安装 Node.js 和 npm，然后以下命令可以帮我们完成：\n\
  \n```\nnpm install -g degit\n```\n\n然后，我们可以安全地从 Svelte 模板下载最新提交：\n\n```\nnpx degit\
  \ sveltejs/template my-svelte-project\n```\n\n之后，过程与上面相同，我们首先进入应用程序目录：\n\n```\n\
  cd my-svelte-project\n```\n\n然后运行安装命令：\n\n```\nnpm install\n```\n\n值得注意的是，`degit`\
  \ 默认只对本地磁盘上空的目录有效。如果目录不为空，我们需要使用一个新目录，或者为 `degit` 指定覆盖选项（这可以在 `degit` 官方指南中找到）。以下是我们的命令行或终端可能的样子：\n\
  \n然后可以接着启动开发引擎：\n\n```\nnpm run dev\n```\n\n默认模板会在浏览器中显示 `Hello World!`。开发引擎会在终端中相应地显示进度。\n\
  \n一旦应用程序准备就绪，我们可以安全地运行构建命令：\n\n```\nnpm run build\n```\n\nSvelte 附带了关于如何将应用程序部署到\
  \ Surge 和其他服务的详细说明。\n\n上述示例中的代码可以在本书的代码文件部分找到。最终构建结果位于 `/public` 目录中。\n\n当然，上面的应用程序只是一个显示\
  \ `Hello World` 的空白画布模板，但基于这个模型，我们可以构建更复杂的应用程序。\n\n此外，虽然我们在上面的示例中使用了 Rollup 和 REPL，但\
  \ Svelte 还提供了其他各种集成，包括 Webpack 的集成。我们将在本书后续内容中转向 Webpack。如果你想知道与其他构建系统的集成，以下是相关插件的列表：\n\
  \n*   `gulp-svelte`：Gulp 插件\n*   `metalsmith-svelte`：Metalsmith 插件\n*   `system-svelte`：System.js\
  \ 插件\n*   `svelte-loader`：Webpack 插件\n*   `meteor-svelte`：Meteor 插件\n*   `sveltejs-brunch`：Brunch\
  \ 插件\n*   `rollup-plugin-svelte`：Rollup 插件\n*   `parcel-plugin-svelte`：Parcel 插件\n\
  *   `sveltify`：Browserify 插件\n\n## 结论\n\n在本章中，我们学到了关于 Svelte 的不少知识。我们现在知道，Svelte\
  \ 作为一个前端 UI 框架，其运行模式与其他现有框架有很大不同。\n\n简单来说，我们已经看到了 Svelte 与其他各种 JS 框架的不同之处，例如它作为编译器的功能，我们更倾向于使用构建系统而不是\
  \ CLI 等。\n\n### Svelte 生态系统\n\n与 Angular、React 或 Vue 相比，Svelte 仍然是一个小角色。因此，期望它拥有庞大的社区基础是不太现实的。\n\
  \n尽管如此，Svelte 的独特卖点在于它能够减少实际代码体积。由于它在构建时编译内容，Svelte 因其速度和优化能力而赢得了声誉。更重要的是，Svelte\
  \ 可以帮助组织和编码人员为他们的应用程序节省大量性能成本和时间。\n\n这正是为什么 Svelte 可以成为许多注重速度和执行效率的应用程序中值得选择的 JS\
  \ 框架的原因。\n\n换句话说，虽然人们可能不会选择将 Svelte 作为独立框架来构建整个项目，但考虑将 Svelte 增量地添加到现有代码设置中是一个非常好的主意。此外，Svelte\
  \ 组件可以轻松地作为独立包发布，在大多数情况下无需依赖即可运行。\n\n自然，假设你手头已有现有的代码库，Svelte 可以集成到其中，以减少最终构建大小和执行时间。如果你还没有这样做，那么非常值得认真考虑。\n\
  \n### 后续步骤\n\n如上所述，Svelte 可用于提高现有应用程序的性能并减少代码体积。尽管如此，虽然我们在本章中使用了 REPL 模型，但你可以考虑选择最适合你模型的方法。\n\
  \n例如，你可以集成 Webpack、Browserify，或者坚持使用 Svelte CLI（尽管存在一些问题，但 CLI 对许多有经验的编码人员来说确实有效），或者直接访问\
  \ Svelte API 并从你的应用程序内部直接调用 API。\n\n值得注意的是，Svelte 社区虽然规模不大，但非常活跃。如果你用 Svelte 构建了一些有趣的东西，建议将其分享到社区的\
  \ Svelte Gitter 聊天室：[`gitter.im/​sveltejs/​svelte`](https://gitter.im)\n\nSvelte\
  \ 社区的 Discord 频道相当新，但也值得一试：[`discord.gg/​yy75DKs`](https://discord.gg)\n\n### 推荐资源\n\
  \n大多数情况下，官方文档是一个不错的起点，但对于习惯了更丰富文档的人来说，它可能仍显得像是一个进行中的作品。\n\n尽管如此，在处理复杂应用程序时，API 值得参考：[`github.com/​sveltejs/​svelte#api`](https://github.com)\n\
  \n除此之外，其他一些有用的链接如下：\n\n*   Svelte 主页：[`svelte.technology/​`](https://svelte.technology)\n\
  *   文档：[`svelte.technology/​guide`](https://svelte.technology)\n*   GitHub：[`github.com/​sveltejs/​svelte`](https://github.com)\n\
  *   Svelte REPL：[`svelte.technology/​repl`](https://svelte.technology)\n\n\n\n至此，我们关于\
  \ Svelte 的章节就结束了。作为一个以独特方法和编译能力为傲的简洁 UI 框架，Svelte 绝对值得你关注，尤其是当你认真对待那些注重优化和性能的 JS\
  \ 框架时。\n\nSvelte 的“无框架框架”理念近来吸引了许多人，如果它在未来迅速流行起来，也不会令人意外。\n\n目前，关于 Svelte 的讨论就到此为止。\n\
  \n*在下一章中，我们将把注意力转向另一个简单、小巧但实用的 JS 框架——Conditioner.js，它提供了易于使用且具备上下文感知能力的 JS 模块。*\n\
  \n# 第 8 章 Conditioner.js\n\nDOI: [10.1201/9781003203711-8](https://doi.org/10.1201/9781003203711-8)\n\
  \n在上一章中，我们学习了 Svelte，这是一个易于使用的 JavaScript 框架，专注于性能和优化，能够提升我们应用的运行时速度。\n\n在本章中，我们将继续讨论另一个实用且非常便捷的\
  \ JavaScript 框架，它同样关注速度和性能。认识一下 Conditioner.js——一个特别适用于内容型网站的 JavaScript 框架。如果你的网站需要一些交互功能，并且你非常关心用户体验，那么\
  \ Conditioner.js 可能正是为你量身打造的！\n\n但究竟是什么让这个 JavaScript 框架如此特别，我们又为什么要费心去了解它呢？难道现有的众多框架还不足以让\
  \ Web 开发变得足够复杂吗？Conditioner.js 能解决什么问题？\n\n是的，本章将回答以上所有疑问，我们将更详细地探索 Conditioner.js。\n\
  \n## 引言\n\nConditioner.js 自称是一个为开发者提供“无毛躁、上下文感知的 JavaScript 模块”的 JavaScript 框架。\n\
  \n自然，既然我们在谈论模块，就需要理解 Conditioner.js 究竟想要实现什么。\n\n### 什么是 Conditioner.js？\n\n简单来说，Conditioner.js\
  \ 是一个面向内容型网站的 JavaScript 框架。当我们说“内容型”时，指的是那些专注于内容发布或处理不同形式数据和信息的现代网站。这几乎可以包括我们能想到的任何网站，例如维基百科、[Apress.com](http://Apress.com)\
  \ 等等。\n\nConditioner.js 的最终目标是借助 JavaScript 增强网站的呈现方面，从而提供更好、更优化的用户体验。\n\n当然，这可以大大提升我们网站的可展示性和灵活性。至少，Conditioner.js\
  \ 充分利用了函数式 JavaScript 元素，使我们能够从这些元素中发挥出更强的功能。\n\n### 是什么让 Conditioner.js 与众不同？\n\
  \n仅仅将其主要目的描述为提供“无毛躁、上下文感知的 JavaScript 模块”，并不能真正说明 Conditioner.js 值得花时间研究，对吧？市面上有许多大大小小的\
  \ JavaScript 框架，今天出现明天就消失了。自然，任何理智的开发者可能都会对在商业或企业项目（尤其是高度多样化的应用）中使用 Conditioner.js\
  \ 的实际可行性和长期生存能力感到担忧。\n\n但这正是 Conditioner.js 对我们来说特别的地方。与许多其他 JavaScript 框架不同，Conditioner.js\
  \ 并不专注于构建 Web 应用。\n\n是的，你没看错。\n\nConditioner.js 高度针对的是“内容感知型网站”，而不是用于构建“内容感知型 Web\
  \ 应用”。\n\n有人可能会问，这两者真的有这么大的区别吗？在当今世界，“网站”和“Web 应用”几乎可以互换使用，开发者社区中很多人可能看不出两者有多大区别。此外，任何结构合理的网站都可以轻松转换为\
  \ Web 应用，而且随着渐进增强的兴起，越来越多的交互式网站正在向 Web 应用的领域迈进。\n\nConditioner.js 更进一步，将“网站”描述为从内容角度创建的东西。因此，网站的目标是为用户提供内容。\n\
  \n现在，由于我们主要关注内容，网站上所做的一切都应该围绕内容展开：\n\n*   需要语义化的 HTML 来描述内容本身，而不是相反。\n*   CSS 用于使内容在各种屏幕尺寸和浏览器规格下具有可展示性。\n\
  *   同样，JavaScript 用于在处理内容时提供更好的用户体验，例如动画、可点击按钮、表单中的可选值等。\n\n可以看出，根据 Conditioner.js\
  \ 的定义，“网站”的范围相当广泛。任何提供内容的网站都符合这个条件。\n\n*   维基百科？是的。\n*   APress 网站？是的。\n*   新闻网站？是的。\n\
  *   你的大学网站？也是的。\n\n不符合上述定义的包括电子邮件 Web 应用、谷歌地图等。这些理想情况下属于“Web 应用”，Conditioner.js\
  \ 可能无法提供帮助。\n\n说实话，上述区分有些吹毛求疵。大多数“Web 应用”也倾向于处理内容——事实上，网络上几乎没有什么是不使用内容的。Conditioner.js\
  \ 认为，像地图或电子邮件客户端这样的“Web 应用”倾向于“与内容交互”，而网站则倾向于“呈现内容”。\n\n这就是关键所在。如果一个项目侧重于呈现内容，我们可以将其归类为网站，并可以考虑使用\
  \ Conditioner.js。另一方面，如果我们是在交互或利用内容，那么手头就是一个 Web 应用，应该避免使用 Conditioner.js。\n\n现在，由于\
  \ Conditioner.js 只专注于网站，可以说它的目标是增强 JavaScript 的整体呈现方面。\n\n### 优点\n\n拥有像 Conditioner.js\
  \ 这样主要致力于为用户创造更好体验的东西，有一个显而易见的目的——我们可以改善网站的整体功能和呈现效果。\n\n大多数 JavaScript 模块只要经过良好优化、正确编码和结构化，加载速度都相当快。Conditioner.js\
  \ 为我们提供了一种渐进增强的形式。它根据各种参数（如视口大小、元素可见性等）将 JavaScript 模块链接到 DOM 元素。\n\n这意味着 Conditioner.js\
  \ 在处理响应式设计网站时是一个不错的选择。\n\n此外，Conditioner.js 非常易于使用，可以直接通过内容分发网络（CDN）作为脚本调用。将现有网站切换到\
  \ Conditioner.js 也很容易。\n\n因此，易用性、对响应式 Web 设计的支持以及提供上下文感知模块的能力，是 Conditioner.js 最大的几个积极方面。\n\
  \n### 缺点\n\nConditioner.js 最大的缺点在于它是一个相对较小的 JavaScript 框架，目标受众非常狭窄。相当多的 JavaScript\
  \ 开发者同时处理 Web 应用和网站。依赖 Conditioner.js 意味着可能需要维护两套独立的工作流程——Conditioner.js 根本不适用于\
  \ Web 应用，开发者需要为 Web 应用开发提出另一套框架。因此，Conditioner.js 的使用范围非常有限。\n\n更甚者，内容感知型网站现在正迅速被应用程序所补充，两者之间的界限也相当模糊。对于一个既提供内容发布又提供股票交易、电子邮件或地图类功能的网站，我们该怎么办？我们是否只在那些能用上它的页面上有选择地使用\
  \ Conditioner.js？\n\n\n\n\n显而易见，除非目标项目是专门为 `Conditioner.js` 定制的，否则这个特定的 JavaScript\
  \ 框架可能从一开始就无法证明其使用或包含的合理性。这几乎保证了 `Conditioner.js` 永远不会实现不可估量的增长。\n\n此外，`Conditioner.js`\
  \ 背后并没有一个庞大的社区。事实证明，这个 JavaScript 框架基本上是一个单人项目，只有少数其他贡献者参与。对于 `Conditioner.js` 来说，企业级使用可能不可行，因为安全修复、更新和其他积极的开发方法通常用于评估给定\
  \ JavaScript 框架的可行性和适用性。\n\n尽管如此，`Conditioner.js` 是一个有用的实体，可以节省我们的开发时间。\n\n## 如何使用\
  \ CONDITIONER.JS？\n\n现在让我们看看 `Conditioner.js` 的实际应用。\n\n### 安装 Conditioner.js\n\n\
