  \ Node.js 版本或长期支持版本，则可以继续。\n\nNode.js 和 npm 与 Git 一样，也有适用于各种平台（包括 Mac、Windows 和\
  \ Linux）的安装程序。你可以从此页面获取相应的安装程序：[`nodejs.org`](https://nodejs.org) 此外，如果你运行的是 Linux，建议从源代码编译\
