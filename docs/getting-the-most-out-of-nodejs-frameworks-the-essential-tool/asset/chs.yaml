  \ Webix 安装方法。\n\n## 结论\n\n至此，我们结束了关于 Webix 的这一章。总结一下，Webix 是一个 JavaScript 框架，允许你创建具有响应式设计的桌面和移动\
  \ Web 应用程序。该框架在两种许可证下可用：GNU GPLv3 和商业许可证。在产品开发中使用 Webix UI 的公司包括丰田、特斯拉、马自达、东芝、雅马哈、三星、富士通和西门子。\n\
  \n*至此，我们已经了解了众多 JS 框架。在下一章中，我们将把注意力转向一些常见且非常有用的 Node 工具和库。*\n\n# 第 10 章 有用的 JavaScript\
  \ 库和工具\n\nDOI: [10.1201/​9781003203711-10](https://doi.org/10.1201/9781003203711-10)\n\
  \n在前面的章节中，我们介绍了一些常见且非常有用的 Node.js 框架。现在，让我们把注意力转向有用的 JavaScript 库和工具。首先，我们从任务管理器开始。\n\
  \n## 什么是任务管理器？\n\n任务管理器是一个小型应用程序，用于自动化那些在项目开发过程中必须不断执行的枯燥但同样重要的常规任务。这些任务包括，例如，运行单元测试、文件合并、压缩和\
  \ CSS 预处理。只需创建一个任务文件，你就可以指示任务管理器如何执行特定任务。之后，你就可以去做其他事情了。这是一个相当简单的想法，却能节省大量时间，并有助于将注意力集中在与项目开发直接相关的任务上。\n\
  \n## NPM\n\nNode.js 允许你在服务器上编写 JavaScript 应用程序。它基于 V8 JavaScript 运行时构建，并用 C++ 编写。它最初旨在作为应用程序的服务器端环境，但开发者开始使用它来创建工具，以帮助他们自动化本地任务。从那时起，一个全新的基于\
  \ Node 的工具生态系统出现，改变了前端的面貌。\n\n为了在 Node.js 中使用这些工具（或包），我们应该能够以有用的方式安装和管理它们。这就是 `npm`（Node\
  \ 包管理器）的作用所在。它安装你想要使用的包，并提供一个用户友好的界面来使用它们。\n\n\n\n\n`npm` 是一个包管理器，是 Node.js 的一部分。多年来，Node\
  \ 一直被 JavaScript 开发者广泛用于交换工具、安装各种模块以及管理依赖关系。因此，对于使用 Node.js 的人来说，理解 `npm` 是什么非常重要。\n\
  \n`npm` 最初是作为 Node.js 的包管理系统创建的，但如今它也用于 JavaScript 前端项目的开发。为了与 `npm` 注册表交互，需要使用同名的命令行工具，它为开发者提供了大量功能。\n\
  \n### npm 如何工作？\n\n它通过执行以下两种角色之一来工作：\n\n1. 它是一个广泛使用的仓库，用于发布 Node.js 开源项目。这意味着它是一个在线平台，任何人都可以发布和分享用\
  \ JavaScript 编写的工具。\n\n2. `npm` 是一个命令行工具，帮助你与浏览器和服务器等在线平台进行交互。该工具帮助你安装和删除包，并管理运行项目所需的版本和依赖关系。\n\
  \n要使用包，你的项目必须包含一个名为 `package.json` 的文件。在这个包中，你会找到与项目相关的元数据。\n\n元数据按以下顺序显示项目的多个方面：\n\
  \n* 项目名称\n* 初始版本\n* 描述\n* 入口点\n* 测试命令\n* Git 仓库\n* 关键词\n* 许可证\n* 依赖项\n* 开发依赖项\n\n\
  元数据有助于识别项目，并作为项目信息的主要来源。\n\n### 安装\n\nNPM 默认随 Node.js 一起安装，因此你无需安装其他任何东西。但你可以将已安装的版本更新到最新版本。为此，请在命令行/终端中运行以下命令（适用于\
