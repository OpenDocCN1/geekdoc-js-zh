  \n成功安装 Chocolatey 后，你可以直接在命令提示符下（显然需要管理员权限）运行以下命令：\n\n剩下的会自动完成。\n\n另一方面，如果你使用的是\
  \ Linux 或 Mac，可以打开命令行终端，然后运行如下命令——\n\n```\ncurl https://install.meteor.com/ | sh\n\
  ```\n\n如果我们系统上已经安装了 Meteor，以超级用户身份运行上述 `curl` 命令将移除旧版本并安装最新的 Meteor 版本。\n\n与本书中我们见过或将要学习的大多数其他\
  \ JavaScript 框架不同，Meteor.js 预装了 `npm`。这意味着即使你的系统没有 `npm`，也无需单独安装。\n\n或者，如果你更喜欢使用\
  \ `npm`，可以继续用它来管理你的项目和包（在这种情况下，你需要全局安装 `npm`）。\n\n这就是安装 Meteor.js 的全部内容。\n\n成功安装后，我们会看到一条确认消息。\n\
  \n一旦我们成功安装了 Meteor，就可以开始使用它来提供应用服务了。\n\n### 在 Meteor.js 中提供应用服务\n\n安装 Meteor.js\
  \ 后，我们首先需要创建一个项目。这个项目本身将是我们大部分开发工作发生的地方。\n\n要创建项目，我们需要：\n\n运行上述命令后，我们创建了一个名为 `myfancyapp`\
  \ 的项目。\n\n现在，我们准备在本地运行或提供应用服务。以下命令将为我们完成此任务。\n\n基本上，我们首先导航到项目的目录。然后，我们在 localhost\
  \ 上运行应用本身。\n\n如果一切按计划进行，终端中的进程将显示一条成功消息。\n\n之后，我们只需在 Web 浏览器中导航到显示的 localhost 地址，我们的应用就可以查看了。当然，它仍然是一个基本结构，所以没有太多可看的，但思路很清晰。\n\
  \n至此，我们已经成功启动并提供了我们的第一个 Meteor.js 应用！现在，我们是否可以用它来做更多的事情呢？\n\n### 在 Meteor 中构建 Web\
  \ 应用\n\n在 Meteor.js 中创建应用相当直接，原因很简单：这个特定的 JavaScript 框架是为性能优化的 Web 应用量身定制的。正如我们已经讨论过的，Meteor.js\
  \ 拥有多项特性，使其非常适合开发和部署渐进式应用。\n\n但为了充分利用 Meteor 的特性，最好先熟悉 Meteor.js 中应用的结构或组织。\n\n\
  在上一节中，我们已经学习了如何创建一个 Meteor 应用。让我们重复之前讨论过的命令，假设我们正在创建一个名为 MyFancyApp 的应用：\n\n上述命令将创建一个名为\
  \ `myfancyapp` 的目录，其中包含我们新应用的文件和代码。要启动这个应用，我们可以在应用目录中执行该命令，如上所述。终端中从应用创建到执行的最终代码应该看起来像这样：\n\
  \n然而，Meteor 应用的结构或布局到底是什么样的呢？\n\n当我们打开应用目录时，会看到一个带有根文件夹的应用结构。\n\n这些文件大多不言自明。\n\n\
  `.meteor` 目录包含 Meteor 文件的内部细节。`package.json` 文件，正如我们现在所知道的，包含 npm 包的详细信息。\n\n在服务器目录中，我们会看到一个\
  \ `main.js` 文件。这个特定文件在服务器上加载时充当 JavaScript 的起点。\n\n客户端目录中有另一个 `main.js` 文件。这个文件也充当入口点，但在客户端加载。\n\
  \n客户端目录还包含 `main.html` 和 `main.css` 文件——这些是在 Web 浏览器中渲染的文件。\n\n现在，我们知道只需在终端中导航到应用目录，然后使用\
  \ `meteor` 命令运行应用即可。\n\n\n\n\n\n接下来，我们只需打开一个网页浏览器，访问 [`localhost:3000`](http://localhost:3000)，我们的应用就会加载出来。这一点我们在上一节已经介绍过了。\n\
  \n想稍微尝试一下吗？我们只需要对 `client` 目录下的 `main.html` 文件进行 HTML 修改，或者对 `client` 目录下的 `main.css`\
  \ 文件添加一些漂亮的 CSS 样式。保存更改后，[`localhost:3000`](http://localhost:3000) 这个 URL 就会自动更新以反映这些变化。\n\
  \n这种前端显示自动更新以反映代码变化的功能，就是我们常说的**热重载**！在 JavaScript 的世界里，这并非一个陌生的概念，因为如今越来越多的客户端框架都支持它，包括\
  \ Meteor。\n\n那么，到目前为止我们学到了什么？\n\n我们的 Meteor 应用结构相当简单。我们可以对 `main.html` 文件进行 HTML\
  \ 修改，或者添加另一个 HTML 文件并将其导入。同样，CSS 样式放在 `main.css` 文件中。\n\n`main.js` 文件是我们添加所有 JavaScript\
  \ 代码的地方。如果碰巧需要导入自定义的 JavaScript 脚本，比如 React 库或组件，我们只需运行所需的 `npm` 命令即可。\n\n在很大程度上，这就是\
  \ Meteor 应用开发的全部内容。当然，为了在 Meteor 中构建复杂的应用，你还需要结合更多关于 JavaScript 框架的详细知识，甚至可能需要额外学习。但现在你已经对如何搭建有了基本概念，继续推进就相对容易了。\n\
  \n## 结论\n\n既然我们已经学习了 Meteor 的一些基本概念，那么接下来该如何推进呢？\n\n### Meteor 生态系统\n\nMeteor 作为一个\
  \ JavaScript 框架，并没有像其他某些 JavaScript 框架那样享有盛誉和强大的支持。例如，Angular 有 Google 的支持，React\
  \ 受到 Facebook 的青睐，而 Meteor 并没有一个大型科技公司全职为其背书。\n\n话虽如此，如果认为 Meteor 没有被大型项目使用和喜爱，那可能是一个巨大的错误。有许多成功的项目和产品都是从头开始用\
  \ Meteor 构建的。\n\n不妨看看像 Rocket.Chat 或 Telescope 这样的项目，进一步了解 Meteor 的能力。\n\n除此之外，Meteor\
  \ 社区本身也非常乐于助人且相当活跃。如果你刚开始接触 Meteor，提问和获得答案都不会太困难。\n\n*   **Rocket.Chat：** [`rocket.chat/`](https://rocket.chat/)\n\
  *   **Telescope：** [`www.telescopeapp.org/`](http://www.telescopeapp.org/)\n*  \
  \ **Wekan：** [`wekan.github.io/`](https://wekan.github.io/)\n\n### 后续步骤\n\n随着你对\
  \ Meteor 的深入使用，你很快会发现这个特定的 JavaScript 框架适用于高度动态的项目，这些项目必须有一个面向客户的环境。\n\n事实上，在大多数情况下，当构建或处理与用户交互频繁的项目和应用时（例如票务预订解决方案、新闻聚合网站、病毒式内容管理系统等），Meteor\
  \ 是一个值得考虑的选择。\n\n因此，Meteor 的用途可以服务于相当流行和大型的项目。话虽如此，在大多数情况下，人们可能会经常需要借助其他 JavaScript\
  \ 库或框架来与 Meteor 配合使用。\n\n这并不意味着 Meteor 不能作为独立的 JS 框架使用。相反，有时项目需求会使得使用 React 或 Vue\
  \ 等框架成为必要；幸运的是，Meteor 自带了 `npm`，安装单独的组件或包并不麻烦。\n\n### 推荐资源\n\n最后，如果你想进一步学习并深入 Meteor\
  \ 的世界，该从哪里开始呢？\n\n首先，最理想的起点是 Meteor 的主页：[`www.meteor.com/`](https://www.meteor.com/)\n\
  \n其次，很可能也是最好且更新最频繁的 Meteor 资源是官方指南本身：[`guide.meteor.com/`](https://guide.meteor.com/)\n\
  \n为了随时了解开发动态，或者 fork 项目本身，Meteor 的 GitHub 仓库位于：[`github.com/meteor/meteor`](https://github.com/meteor/meteor)\n\
  \n如果你是一位现有的 Meteor 开发者，或者有过一些使用经验，你可以考虑迁移到 Meteor 1.7，以便利用最新功能以及该框架提供的所有特性。这里有一份非常详细且条理清晰的迁移指南，位于：[`guide.meteor.com/1.7-migration.html`](https://guide.meteor.com/1.7-migration.html)\n\
  \n同样，对于寻找视频内容的朋友，官方频道上有视频教程：[`www.youtube.com/user/MeteorVideos`](https://www.youtube.com/user/MeteorVideos)\n\
  \nMeteor 论坛也相当活跃，其社区规模比你在大多数其他 JavaScript 框架中看到的都要大。这主要是因为 Meteor 可以轻松地与大多数其他 JavaScript\
  \ 框架集成，同时也因为面向客户的动态应用是 Meteor 的强项。查看论坛：[`forums.meteor.com/`](https://forums.meteor.com/)\n\
  \n最后，对于社交活跃、喜欢外出交流的人来说，Meteor 社区在全球范围内有不少线下聚会。更多详情请见：[`www.meetup.com/en-US/topics/meteor/`](https://www.meetup.com/en-US/topics/meteor/)\n\
  \n*至此，我们结束了关于 Meteor JavaScript 框架的这一章。*\n\n*在下一章中，我们将把注意力转向 Aurelia，一个简单而精致的 JavaScript\
  \ 框架，它正在缓慢但稳步地流行起来。与 Meteor 不同，Aurelia 服务于一组预定义的目的，更像是一个以用例为中心的 JavaScript 框架。*\n\
  \n# 第六章 Aurelia\n\nDOI：[10.1201/9781003203711-6](https://doi.org/10.1201/9781003203711-6)\n\
  \n在上一章中，我们学习了 Meteor 及其各种用途。Meteor 是一个相当流行的 JavaScript 框架，其受欢迎程度正在稳步上升。凭借我们在上一章中看到的多样化功能，很明显\
  \ Meteor 提供了很多内容。\n\n接下来，在本章中，我们将把注意力转向另一个 JavaScript 框架，它虽然不像 React 或 Angular 那样流行，但使用量正在增长。这个特定的\
  \ JavaScript 框架，就像 Meteor 一样，也提供了一系列令人印象深刻的功能。\n\n认识一下 Aurelia，一个用于 Web、移动端以及桌面的\
  \ JavaScript 客户端框架，它没有外部依赖。\n\n在本章中，我们将深入探讨 Aurelia，了解更多关于它的功能以及它在哪些方面能发挥最佳作用。\n\
  \n## 引言\n\n如前所述，Aurelia 是一个本身没有外部依赖的客户端框架。但它的特别之处是什么？它到底是关于什么的？让我们一探究竟！\n\n### 什么是\
  \ Aurelia？\n\n作为一个客户端框架，Aurelia 是为最终用户或客户端使用而设计的。换句话说，它不适合在服务器端使用，比如 Node.js。\n\n\
  话虽如此，Aurelia 更注重可用性和易用性。它采用下一代 ECMAScript 编写，并与 Web 组件无缝集成。这意味着创建自定义 HTML 元素或向现有元素添加自定义属性相当简单直接。\n\
  \n事实上，即使是 JavaScript 新手也能很快上手 Aurelia。其架构本身易于理解——Aurelia 并非一个单体框架，而是由多个专注于特定任务的小型模块组成。这使得开发人员更容易进行定制和抽象。\n\
  \n![Aurelia 主页左侧显示徽标，右侧文字显示：简单、强大、不显眼。文字下方有两个按钮：开始使用 和 GitHub。](img/ufig6_1.jpg)\n\
  \n但关键问题是，Aurelia 有什么特别之处呢？\n\n\n\n\n\n### 它有何特别之处？\n\nAurelia 最值得称道的一点是，它采用下一代 ECMAScript\
  \ 编写，并与 Web Components 集成。再加上 Aurelia 没有外部依赖，你就拥有了一款开箱即用、适用于 Web 和移动应用的出色 JavaScript\
  \ 框架。\n\n此外，Aurelia 由专注于特定任务的小型模块组成。这意味着开发者可以根据需求挑选模块，从而构建高度可定制的 Web 应用。使用 Aurelia\
  \ 时几乎没有任何臃肿的软件。\n\n更重要的是，Aurelia 支持双向数据绑定，这与本书中讨论的许多其他 JavaScript 框架类似。不过，Aurelia\
  \ 自带可扩展的 HTML 编译器，不仅能处理数据绑定，还能处理动态加载和批量渲染。正如我们将在本章后续部分看到的，在 Aurelia 中创建和使用自定义属性非常轻松。\n\
  \nAurelia 的客户端路由器拥有自己的动态路由模式。但值得注意的是，许多开发者倾向于不使用路由器，而是采用基于数据的用户界面（UI）组合——Aurelia\
  \ 同样支持这种方式。你可以利用 Aurelia 中现有的模块化约定，也可以对其进行定制以满足特殊需求。\n\n总而言之，Aurelia 可用于构建需要最少配置的简单应用。如果你的主要目标是节省开发时间，并希望避免在搭建环境上花费大量时间和精力，那么\
  \ Aurelia 可能是一个合适的选择。更重要的是，在使用 Web 标准进行开发时，Aurelia 是一个不错的 JavaScript 框架选择。\n\n###\
  \ 优点\n\nAurelia 最大的优势在于其广泛的语言支持。无论你想使用 ES5、ES 2015、ES 2016 还是 TypeScript，Aurelia\
  \ 都能处理。它的所有 API 都是跨兼容的，这意味着与许多脚本语言无缝兼容。\n\n这种兼容性也意味着可以使用 ES 2015 和其他模块来编写最少的代码。通常情况下，Aurelia\
  \ 项目和应用的代码量不会达到数千行。当然，这很大程度上取决于项目的规模和大小，但在 Aurelia 中，最小耦合的代码是常态。\n\n除此之外，正如我们已经看到的，Aurelia\
  \ 允许我们创建自定义 HTML 元素。这意味着在 Aurelia 中进行定制、调整和额外实现相当容易。借助其小型模块，我们可以按需选择，只选用那些服务于特定目的的模块。这种非臃肿的方法赋予了\
  \ Aurelia 一种简洁性，这在大型 JavaScript 框架中往往难以见到。\n\n### 缺点\n\n然而，缺点在于，选择所需的自定义模块而忽略不需要的模块这一选项，并非所有用户都认同。有时，一个单体\
  \ JS 框架是很好的选择。许多开发者，尤其是那些不太熟悉 JavaScript 框架世界的开发者，并不想将模块拼凑在一起，而是更倾向于一个单体结构，该结构对允许和不允许的内容有非常明确的规则。\n\
  \n在这种情况下，Aurelia 通常不是理想的选择。事实上，虽然 Aurelia 相当容易学习，甚至更容易掌握，但其开放式的特性意味着在使用 Aurelia\
  \ 时，同样容易编写出质量低劣的应用代码。强烈建议，尤其是对于新手开发者，先磨练自己的编码技能，并遵循诸如 Angular 或 React 等框架中的推荐标准，然后再转向\
  \ Aurelia 这样的框架。对于完全不熟悉标准化编码方法的人来说，Aurelia 就像一张过于空白的画布，难以提供帮助。\n\n考虑到 Aurelia 是一个客户端框架，它通常更侧重于前端开发。这本身当然不是缺点。但对于那些寻求更多功能的人来说，Aurelia\
  \ 并非万能的解决方案。\n\n好了，关于 Aurelia 的理论介绍就到这里。我们何不开始实际操作，看看 Aurelia 的表现呢？\n\n## 如何使用 Aurelia？\n\
  \n在实际使用之前，我们首先需要安装 Aurelia。安装过程本身相当简单，考虑到你已经熟悉了其他几个 JavaScript 框架的安装步骤，安装 Aurelia\
  \ 应该也不在话下。\n\n### 安装 Aurelia\n\n大多数情况下，你将使用 Aurelia 命令行界面（CLI）。因此，我们即将安装的正是 Aurelia\
  \ CLI。根据你的环境，你可能需要以 root 或超级用户身份运行命令，例如在 Linux 上使用 `sudo`。话虽如此，安装 Aurelia CLI 有一些先决条件。\n\
  \n首先，我们需要最新版本的 Node.js。我们将在本书后续部分详细讨论 Node.js。不过，正如我们在前几章中学到的，Node.js 是一个服务器端框架，通常用于运行许多其他\
  \ JavaScript 框架。你可以从官方网站获取最新版本：[`nodejs.org/​en/​`](https://nodejs.org)\n\n除此之外，我们还需要一个\
  \ Git 客户端。最好使用来自 [`git-scm.com/​`](https://git-scm.com) 网站的标准 Git 客户端，该客户端根据你选择的操作系统以跨平台方式提供。如果你希望使用图形界面桌面客户端，GitHub\
  \ 提供了一个选项，可通过 [`desktop.github.com/​`](https://desktop.github.com) 访问。\n\n一旦满足 Node.js\
  \ 和 Git 的要求，就可以使用 npm 从命令行安装 Aurelia CLI。必须注意，npm 是随 Node.js 一起安装的。安装 Aurelia CLI\
  \ 的命令如下：\n\n```\nnpm install -g aurelia-cli\n```\n\n上述命令将在我们的系统上全局安装 Aurelia CLI。\n\
  \n人们常说，创建新项目不需要最新版本的 npm，因此即使某个系统或设置没有最新版本的 Node.js，仍然可以在过时的 npm 版本上继续安装和使用 Aurelia。从技术和字面意义上讲，这在一定程度上是正确的。然而，前端开发实际上需要扁平包结构，而过时的\
  \ npm 版本无法支持这一点。因此，从逻辑和安全角度来看，强烈建议使用最新版本的 Node.js 和 npm。\n\n现在我们已经安装好 Aurelia CLI\
  \ 并准备就绪，是时候开始应用开发了！\n\n### 使用 Aurelia 创建和本地化应用\n\n第一步，显然是创建一个新项目。为此，我们可以运行如下命令：\n\
  \n```\nau new\n```\n\n上述命令会呈现一系列选项和询问。对于初学者来说，这是输入项目信息的地方；Aurelia 的首次使用者可以坚持使用默认值，而高级用户则可以选择更大的定制化。\n\
  \n无论哪种情况，一旦项目设置完成，Aurelia 将获取并安装依赖项以供使用。之后，我们就可以自由地开始处理全新的项目了。\n\n项目设置完成后，我们可以运行以下命令来执行应用：\n\
  \n```\nau run\n```\n\n上述命令将构建应用、运行 Web 服务器，然后提供应用服务。只要 Web 服务器在运行，当我们对 Web 应用进行更改时，页面本身也会刷新。\n\
  \n大多数情况下，Aurelia 的开发可以通过上述讨论的 Aurelia CLI 完成，尤其是对于初学者。然而，无论我们正在开发的应用性质如何，在后期考虑对其进行本地化可能是一个好主意。\n\
  \n\n\n\n\n因此，更明智的做法是同时添加国际化支持。为此，我们可以借助 Aurelia 中的 `i18N` 配置及其支持。\n\n第一步自然是安装 Aurelia\
  \ i18n 插件，以便为我们的应用添加国际化和本地化功能。该插件本身支持国际化，并能帮助我们实现应用的本地化。\n\n不言而喻，我们需要 `Node.js`\
  \ 和 `npm` 来安装该插件。除此之外，我们显然还需要已经设置并运行好的 Aurelia CLI，以便在应用中使用该插件。\n\n一切准备就绪后，可以通过以下命令完成安装：\n\
