  \ API 文档。](img/ufig2_2.jpg)\n\n下载后，通过安装程序安装该软件包即可开始使用。\n\n### 通过包管理器安装 Node.js\n\
  \n#### Android\n\nNode.js 对 Android 的支持仍处于实验阶段，因此预编译的二进制文件尚未公开提供。\n\n不过，也有一些第三方解决方案。例如，Termux\
  \ 社区提供了一个终端模拟器和适用于 Android 的 Linux 环境，以及自己的包管理器和大量预编译的应用程序集合。在 Termux 应用中运行以下命令将安装最新可用的\
  \ Node.js 版本：\n\n#### nvm\n\n\n\n\n\nNode Version Manager 是一个用于管理多个已发布版本的 Node.js\
  \ 的 bash 脚本。它允许你执行安装、删除、切换版本等操作。要安装 `nvm`，请使用此安装脚本。\n\n在 Unix/OS X 系统上，通过源代码创建的\
  \ Node.js 可以使用 `nvm` 安装到默认的 nvm 文件夹中：\n\n之后，你可以使用 `nvm` 在已发布版本和从源代码构建的版本之间切换。例如，如果\
  \ Node.js 版本是 v8.0.0-pre：\n\n### MacOS\n\n直接从网站 [nodejs.org](http://nodejs.org)\
  \ 下载 macOS 安装程序即可。\n\n![Node.js 在 Mac OS 上的下载页面显示两个选项卡：LTS 和 Current。LTS 选项卡被选中，并显示以下选项：Windows\
  \ 安装程序、macOS 安装程序和源代码。](img/ufig2_3.jpg)\n\n如果你想通过 bash 下载一个包：\n\n### Arch Linux\n\
  \n`Node.js` 和 `npm` 在社区仓库中可用。\n\n安装后，你会在 `node` 命令行中获得一个新命令。你可以通过两种方式使用 Node。\n\n\
  第一种是不带参数：此命令在命令行中打开一个交互模式，你可以在其中执行 JavaScript 代码。\n\n```\n$ node\n> console.log('Hello\
  \ World');\nHello World\nundefined\n```\n\n在这个例子中，我刚刚输入了 `console.log('Hello World');`\
  \ 并按下回车。Node 将开始执行，我们会看到我们的消息。它还会输出“undefined”，因为它打印了返回值，而 `console.log` 没有返回任何内容。另一种使用\
  \ Node.js 的方法是创建一个 JavaScript 文件。\n\n那么，让我们创建一个文件：\n\n并将其保存到我们将运行此文件的目录中。要进入命令行，只需输入\
  \ `cd 目录全名`（或者你可以使用相对路径）。\n\n在命令行中运行：\n\n在这种情况下，我们将 `console.log` 文件中的消息移动，并将此文件作为参数传递给\
  \ `node` 命令。Node 运行文件中的 JavaScript 代码并打印出“Hello World”。\n\n### 使用 Node.js 处理 I/O\
  \ 文件\n\n运行纯 JavaScript 很棒，但不太实用。因此，Node.js 拥有大量用于处理实际任务的库（模块）。在这个例子中，我们将打开一个包含记录的文件并处理它。\n\
  \n#### example_log.txt\n\n*   *2021-09-09T10:15:33.166Z A 8*\n\n*   *2021-09-09T10:16:33.166Z\
  \ B 8*\n\n*   *2021-09-09T10:17:33.166Z C 7*\n\n*   *2021-09-09T10:18:33.166Z C\
  \ 7*\n\n*   *2021-09-09T10:19:33.166Z A 8*\n\n这个文件的内容并不重要，但你需要知道每条记录包含一个日期、一个字母和一个值。我们希望将每个字母与其对应的值关联起来，并读取文件的内容。\n\
  \n#### my_parser.js\n\n幸运的是，Node.js 通过内置的文件系统（`fs`）模块极大地简化了文件内容的处理。`fs` 模块有一个 `readFile`\
  \ 函数，它接受文件路径和一个回调函数。当文件完全读取后，回调函数将被执行。文件数据以 `Buffer` 类型的形式出现，这是一组位。我们可以使用 `toString()`\
  \ 函数将其转换为字符串。\n\n现在让我们添加解析器（它是用纯 JavaScript 编写的）。\n\n#### my_parser.js\n\n当文件作为\
  \ `node` 命令的参数时，结果会被打印并输出。\n\n### Node.js 中的异步调用\n\n正如你在上一个例子中注意到的，Node.js 的特点是使用异步调用。本质上，你编写需要完成的操作，当操作完成时，会调用一个回调函数，因为\
  \ Node.js 是单线程的。在等待回调启动时，Node.js 可以去做其他事情，而不是阻塞直到请求完成。\n\n这对于 Web 服务器尤其重要。现代 Web\
  \ 应用程序经常需要访问数据库。在等待数据库返回结果时，Node 可以处理更多的请求。这使得你能够以较小的开销处理数千个并发请求，而无需为每个连接创建单独的线程。\n\
  \n## 用于服务器应用程序开发的 NODE.JS\n\nNode.js 基于异步机制。除了非阻塞 I/O 之外，这使得在 Node.js 上运行的服务器应用程序在单位时间内能够服务的客户端请求数量远多于大多数其他服务器开发技术开发的类似应用程序。\n\
  \n这对业务意味着什么？\n\n*   你可以以相对较低的服务器基础设施成本运行你的项目。\n\n*   通过精心构建的架构，这使你能够在不投入大量资金的情况下扩展业务。\n\
  \n这对开发者意味着什么？\n\n*   如果你不了解异步代码的工作原理并且没有相关经验，那么一开始会非常困难。很难理解某些写在“前面”的指令可能会比后面的指令执行得晚得多，甚至可能根本不会执行。你需要深入学习回调、Promise、Promise\
  \ 上的 async-await 包装器、同步和异步生成器以及迭代器的概念。但这能很好地锻炼结构化思维，让你以不同的视角看待程序执行过程，理解“正常”的同步程序在等待期间浪费了多少时间，并学会如何节省这些时间。\n\
  \n*   对异步开发方法的深入理解会大大提升一个专业人员在劳动力市场上的价值，从而让你能够要求更高的薪水。\n\nNode 允许你快速开发 MVP。Node\
  \ 已经开发了大量具有不同功能的包。你可以不必花时间开发基础功能，而是立即专注于业务逻辑。\n\n这对业务意味着什么？\n\n*   新产品将更快地推向市场（TTM\
  \ 将缩短）。\n\n*   开发过程将花费更少的资金，因为创建产品第一个版本所需的开发工时更少。\n\n*   在初始市场调研中形成的假设将更快得到验证，对产品的调整将更快完成，资金最终将更快周转。这对项目投资者来说是一个非常重要的特性。\n\
  \n这对开发者意味着什么？\n\n*   你不必在每个项目上都发明新东西（这不可避免地会导致大量错误并使工作变得乏味），而是可以紧密处理对项目重要的任务。\n\n\
  *   在选择方法、构建架构以及完善不符合架构师和/或客户要求的标准功能方面拥有更大的自由度。\n\n*   Node 基于 JavaScript 语言构建。因此，这大大增加了在开发团队中培养全栈专家的可能性：精通后端的前端开发者，或精通前端的前端开发者。\n\
  \nNode.js 与 JavaScript 紧密相关，语法和架构方法完全相同，只是“绑定”（浏览器和服务器）不同。\n\n这对业务意味着什么？\n\n*  \
  \ 开发团队将拥有对问题有更广泛视角的专家，这意味着管理层的负担将减轻。\n\n*   开发过程将更高效，因为一个人（全栈开发者）与自己协商总是比与另一个人协商更容易、更快捷。因此，专家之间的沟通成本降低了。\n\
  \n*   在开发过程中，错误会更少，因为浮动错误通常发生在不同开发技术（具有不同数据类型）的交界处。\n\n这对开发者意味着什么？\n\n*   如果你以前必须与前端紧密合作，那么你会对资源用户部分中数据发生的过程有很好的理解，从而与前端开发者进行更简单的对话。\n\
  \n*   一个优秀的全栈专家在市场上通常比优秀的后端或前端开发者更受重视。\n\n\n\n\n如果你有足够的时间分配给项目开发，你可以独立完成前端和后端，从而避免大量的“冲突”，这些冲突通常需要花费大量时间来解决。\n\
  \n## 使用 NODE.JS 创建 WEB 服务器\n\n如前所述，Node 本身无法独立完成任何工作。其中一个内置模块可以轻松创建简单的 HTTP 服务器，其使用示例在官方网站的主页上给出。\n\
  \n### mywebserver.js\n\n再次强调：这是一个基础的 Web 服务器，并非功能完整的服务器。它无法提供图片或 HTML 文件。实际上，无论你发送什么请求，它都会返回“Hello\
  \ World”。不过，你可以运行这个脚本，在浏览器中访问 [`localhost:8080`](http://localhost:8080) 并看到这段文本。\n\
  \n你可能已经注意到，你的 Node.js 应用程序不再停止运行。这是因为你创建了一个 Web 服务器，你的 Node.js 应用程序会持续响应请求，直到你手动停止它。\n\
  \n如果你想创建一个功能完整的 Web 服务器，就需要做一些工作：你需要检查所有请求，读取相应的文件，并返回输出。不过也有好消息：别人已经为你完成了这些繁重的工作。\n\
  \n在本章中，我们介绍了与 Node.js 相关的基础知识。现在我们对 Node.js 是什么、Node 能做什么以及如何使用它完成一些基本任务有了清晰的认识。在下一章中，我们将更深入地探索\
  \ Node 的世界。\n\n# 第 3 章 用 Node.js 做更多事\n\nDOI: [10.1201/​9781003203711-3](https://doi.org/10.1201/9781003203711-3)\n\
  \n在上一章中，我们介绍了一些 Node 的基础知识，例如安装、创建基础简单的 Web 服务器等。在本章中，我们将把注意力转向 Node 更精细的细节和可扩展性。首先，让我们聚焦于\
  \ Node 模块——Node.js 生态系统的关键组成部分。\n\n## 模块\n\n除了少数提到的变量（如 `console` 和 `process`）之外，Node\
  \ 在全局作用域中的功能很少。要访问其余的内置函数，你需要使用模块系统。\n\nCommonJS 系统内置于 Node 中，用于加载从内置模块和下载的库到程序中的文件的所有内容。\n\
  \n当调用 `require` 时，Node 必须将指定的字符串转换为文件名。以“/”、“./”或“../”开头的路径会被转换为相对于当前路径的路径。“./”表示当前目录，“../”表示上一级目录，“/”表示文件系统的根目录。如果你从文件\
  \ `/home/marijn/elife/run.js` 中请求 `\"./world/world\"`，Node 会尝试加载文件 `/home/marijn/elife/world/world.js`。`.js`\
  \ 扩展名可以省略。\n\n当传入的字符串看起来不像相对路径或绝对路径时，则假定它要么是内置模块，要么是安装在 `node_modules` 目录中的模块。例如，`require(\"\
  fs\")` 会为你提供一个用于处理文件系统的内置模块，而 `require(\"elife\")` 会尝试从 `node_modules/elife/` 加载库。安装库的典型方法是使用\
  \ `NPM`（Node 包管理器），我们稍后会再讨论。\n\n为了演示，让我们用两个文件创建一个简单的项目。第一个文件名为 `main.js`，它将定义一个从命令行调用的脚本，用于扭曲字符串。\n\
  \n`garble.js` 文件定义了一个字符串扭曲库，它既可以被前面定义的命令行程序使用，也可以被其他需要直接访问 `garble` 函数的脚本使用。\n\n\
  将 `module.exports` 替换为某个值（而不是向其添加属性）允许我们从模块中导出一个特定的值。在这种情况下，我们模块的请求结果将是扭曲函数本身。\n\
  \n该函数使用空字符串的 `split` 将字符串拆分为字符，然后将所有字符替换为代码值大 5 的其他字符。最后将结果重新连接成一个字符串。\n\n现在我们可以调用我们的工具：\n\
  \n### HTTP 模块\n\n另一个主要模块是“http”。它提供了创建 HTTP 服务器和 HTTP 请求的功能。以下是运行一个简单 HTTP 服务器所需的一切：\n\
  \n在你的机器上运行该脚本后，你可以将浏览器导航到地址 `localhost:8000/hello`，从而向服务器发起一个请求。服务器将响应一个小的 HTML\
  \ 页面。\n\n作为参数传递给 `createServer` 的函数会在每次尝试连接到服务器时被调用。`request` 和 `response` 变量是表示输入和输出数据的对象。第一个包含有关请求的信息，例如\
  \ `url` 属性包含请求的 URL。\n\n要发送回一些内容，请使用 `response` 对象的方法。第一个方法 `writeHead` 用于写入响应头（参见第\
  \ 17 章）。你需要给它一个状态码（这里为 200，表示“OK”）和一个包含头信息的对象。这里我们告诉客户端它应该等待 HTML 文档。\n\n接下来是响应体（文档本身），通过\
  \ `response.write` 发送。如果你希望分块发送响应，可以多次调用此方法。例如，在流式数据到达时逐块发送。最后，`response.end` 表示响应结束。\n\
  \n调用 `server.listen` 会使服务器监听 8000 端口的请求。因此，你需要在浏览器中访问 `localhost:8000`，而不是仅仅 `localhost`（默认端口为\
  \ 80）。\n\n要停止这样一个不会自动终止（因为它正在等待后续事件，此处为连接）的 Node 脚本，请按 `Ctrl-C`。\n\n一个真正的 Web 服务器所做的远不止示例中描述的内容。它会查看请求方法（`method`\
  \ 属性）以了解客户端试图执行什么操作，并查看请求 URL 以了解该操作应在哪个资源上执行。接下来你将看到一个更高级的服务器版本。\n\n要创建一个 HTTP\
  \ 客户端，我们可以使用“http”模块的 `request` 函数。\n\n`request` 的第一个参数配置请求，告诉 Node 我们将与哪个服务器通信、请求的路径以及使用的方法。第二个参数是一个函数，它将在请求结束时被调用。`response`\
  \ 对象被传递给它，其中包含有关响应的所有信息——例如状态码。\n\n与服务器的 `response` 对象类似，`request` 返回的对象允许你通过 `write`\
  \ 方法传递数据，并通过 `end` 方法结束请求。示例中没有使用 `write`，因为 GET 请求不应在请求体中包含数据。\n\n对于安全 URL（HTTPS）的请求，Node\
  \ 提供了 `https` 模块，它有自己的 `request` 函数，类似于 `http.request`。\n\n### 流\n\n我们在 HTTP 示例中看到了两个流的例子——服务器可以写入的\
  \ `response` 对象，以及从 `http.request` 返回的 `request` 对象。\n\n只写流是 Node 接口中的一个流行概念。所有流都有一个\
  \ `write` 方法，可以传入一个字符串或 `Buffer` 对象。\n\n`end` 方法关闭流，如果提供了参数，则在关闭前输出一段数据。这两个方法都可以通过一个额外的参数传入回调函数，该回调函数会在写入完成或流结束时被调用。\n\
  \n可以使用 `fs.createWriteStream` 函数创建一个指向文件的流。之后，你可以使用 `write` 方法分块写入文件，而不是像 `fs.WriteFile`\
  \ 那样一次性写入整个文件。\n\n\n\n\n只读流会稍微复杂一些。传递给 HTTP 服务器回调函数的 `request` 变量和传递给 HTTP 客户端的\
  \ `response` 变量都是只读流。（服务器读取请求然后写入响应，客户端先写入请求然后读取响应）。从流中读取数据是通过事件处理程序完成的，而不是通过方法。\n\
  \n在 Node 中，创建事件的对象有一个 `on` 方法，类似于浏览器的 `addEventListener` 方法。你给它一个事件名称和一个函数，它会注册这个函数，以便在事件发生时立即调用它。\n\
  \n只读流有 `data` 和 `end` 事件。第一个在接收到数据时触发，第二个在结束时触发。这种模型适用于可以即时处理的流式数据，即使尚未接收到整个文档。可以通过\
  \ `fs.createReadStream` 将文件作为流读取。\n\n以下代码创建了一个服务器，它读取请求体，并以大写文本流的形式将其发送回响应。\n\n\
  传递给数据处理程序的 `chunk` 变量将是一个二进制 `Buffer`，可以通过调用其 `toString` 方法将其转换为字符串，该方法从默认编码（`UTF-8`）解码。\n\
  \n以下代码与服务器同时运行，将向服务器发送一个请求并输出接收到的响应：\n\n该示例写入 `process.stdout`（进程的标准输出，它是一个可写流），而不是\
  \ `console.log`。我们不能使用 `console.log`，因为它会在每段代码后添加一个额外的换行符——这里不需要。\n\n### 简单文件服务器\n\
  \n让我们将关于 HTTP 服务器的新知识与文件系统操作结合起来，并在它们之间搭建一座桥梁：一个提供远程文件访问的 HTTP 服务器。这样的服务器有很多用途。它使\
  \ Web 应用程序能够存储和共享数据，或者可以让一组人访问一组文件。\n\n当我们通过 HTTP 协议将文件视为资源时，可以使用 `make`、`put` 和\
  \ `delete` 方法来读取、写入和删除文件。我们将把请求中的路径解释为文件的路径。\n\n我们不需要开放对整个文件系统的访问，因此我们将这些路径解释为相对于根目录的路径，而根目录将是脚本运行的目录。如果我从\
  \ `/home/marein/public/`（或 Windows 上的 `C:\\Users\\marijn\\public\\`）运行服务器，那么对 `/file.txt`\
  \ 的请求必须指向 `/home/marijn/public/file.txt`（或 `C:\\Users\\marijn\\public\\file.txt`）。\n\
  \n我们将逐步开发程序，使用 `methods` 对象来存储处理不同 HTTP 方法的函数。\n\n这段代码将启动服务器并返回 405 错误。此代码用于指示服务器不支持请求的方法。\n\
  \n`response` 函数被传递给处理各种方法的函数，并作为结束请求的回调。它接受 HTTP 状态码、响应体，以及可能的 content type。如果传递的响应体是一个只读流，它将有一个\
  \ `pipe` 方法，用于将读取流传递给写入流。如果不是，则假定它为 null（响应体为空）或字符串，然后直接传递给 `end` 响应方法。\n\n为了从请求的\
  \ URL 中获取路径，`urlToPath` 函数使用内置的 Node `url` 模块解析 URL。它获取一个路径名，例如 `/file.txt`，解码以去除转义码\
  \ `%20`，并在开头插入一个点，以获得相对于当前目录的路径。\n\n你认为 `urlToPath` 函数不安全吗？你是对的。我们将在练习中回到这个问题。\n\
  \n我们将安排 `GET` 方法，使其在读取目录时返回文件列表，在读取文件时返回文件内容。\n\n需要填写的问题是，在读取文件时我们应该返回什么类型的 `Content-Type`\
  \ 头。由于文件可以是任何内容，服务器不能为所有人返回相同的类型。但 `NPM` 可以帮上忙。`mime` 模块（文件内容类型指示符，如 `text/plain`，也称为\
  \ MIME 类型）知道大量文件扩展名的正确类型。\n\n通过在服务器脚本所在的目录中运行以下 `npm` 命令，你可以使用 `require(\"mime\"\
  )` 来查询类型库。\n\n当请求的文件不存在时，这种情况的正确错误码是 `404`。我们将使用 `fs.stat` 返回文件信息，以确定是否存在这样的文件，以及它是否不是目录。\n\
  \n由于磁盘请求需要时间，`fs.stat` 是异步工作的。当文件不存在时，`fs.stat` 会将一个错误对象传递给回调函数，该对象的 `code` 属性值为\
  \ `ENOENT`。如果 Node 能为不同的错误定义不同的错误类型就好了，但事实并非如此。相反，它输出令人困惑的 Unix 风格代码。\n\n我们将所有意外错误都返回代码\
  \ `500`，这表示服务器出现问题——与以 4 开头的代码相反，后者表示请求出现问题。在某些情况下，这并不完全准确，但对于一个小示例程序来说，这已经足够了。\n\
  \n`fs.stat` 返回的 `stats` 对象告诉我们关于文件的一切。例如，`size`——文件大小，`mtime`——修改日期。这里我们需要确定它是目录还是普通文件——`isDirectory`\
  \ 方法会告诉我们。\n\n为了读取目录中的文件列表，我们使用 `fs.readdir`，并在另一个回调之后将其返回给用户。对于普通文件，我们通过 `fs.createReadStream`\
  \ 创建一个可读流，并将其与 `mime` 模块为该文件发出的内容类型一起传递给响应。\n\n`DELETE` 处理代码会更简单：\n\n你可能想知道为什么尝试删除一个不存在的文件会返回状态\
  \ `204` 而不是错误。你可以说，当你尝试删除一个不存在的文件时，由于文件已经不存在，请求已经执行。HTTP 标准鼓励人们进行幂等请求——也就是说，重复执行相同的操作不会导致不同的结果。\n\
  \n当 HTTP 响应不包含数据时，你可以使用状态码 `204`（“无内容”）。由于我们需要提供回调函数，这些函数要么报告错误，要么在不同情况下返回 `204`\
  \ 响应，我编写了一个特殊的 `respondErrorOrNothing` 函数来创建这样的回调。\n\n这是 `PUT` 请求处理程序：\n\n这里我们不需要检查文件是否存在——如果存在，我们只需覆盖它。同样，我们使用\
  \ `pipe` 将数据从读取流传输到写入流，在我们的例子中，是从请求传输到文件。如果无法创建线程，则会触发 `error` 事件，我们在响应中报告该事件。当数据成功传递时，`pipe`\
  \ 将关闭两个线程，这将触发 `finish` 事件。之后，我们可以用代码 `204` 报告成功。\n\n完整的服务器脚本可在网站上找到：`eloquentjavascript.net/code/file_server.js`。你可以下载并通过\
  \ `Node` 运行它来启动你自己的文件服务器。当然，可以更改和补充它以解决练习或进行实验。\n\n`curl` 命令行工具在 Unix 系统上公开可用，可用于创建\
  \ HTTP 请求。以下片段测试了我们的服务器。`-X` 选项用于指定请求方法，`-d` 用于包含请求体。\n\n*   `curl` [`localhost:8000/​file.txt`](http://localhost:8000/file.txt)\n\
  *   文件未找到\n*   `curl -X PUT -d hello` [`localhost:8000/​file.txt`](http://localhost:8000/file.txt)\n\
  *   `curl` [`localhost:8000/​file.txt`](http://localhost:8000/file.txt)\n*   hello\n\
  *   `curl -X DELETE` [`localhost:8000/​file.txt`](http://localhost:8000/file.txt)\n\
  *   `curl` [`localhost:8000/​file.txt`](http://localhost:8000/file.txt)\n*   文件未找到\n\
  \n\n\n\n\n对 `file.txt` 的第一次请求失败，因为文件还不存在。PUT 请求创建了一个文件，接着下一次请求成功获取了它。通过 DELETE 删除后，文件再次丢失。\n\
  \n### 错误处理\n\n在文件服务器代码中，有六个地方我们在不知道如何处理错误时重定向了异常。由于异常不会自动传递给回调函数，而是作为参数传递，因此每次都需要单独处理它们。这抵消了异常处理的优势，即集中处理错误的能力。\n\
  \n当系统中确实抛出异常时会发生什么？我们没有使用 `try` 块，因此异常会被传递到调用栈的最顶层。在 Node 中，这会导致程序停止执行，并将异常信息（连同堆栈跟踪）输出到标准输出。\n\
  \n因此，当代码中出现问题时，我们的服务器会崩溃——这与异步问题不同，异步问题会作为参数传递给调用函数。如果我们需要处理处理请求时发生的所有异常，以便准确发送响应，则需要在每个回调中添加\
  \ `try/catch` 块。\n\n这并不好。许多 Node 程序编写时尽可能少用异常处理，这意味着如果发生异常，程序无法处理，因此只能崩溃。\n\n另一种方法是使用\
  \ Promise。它们会捕获回调函数抛出的异常，并将其作为错误传递。在 Node 中，你可以加载 Promise 库并使用它来处理异步调用。很少有 Node\
  \ 库集成了 Promise，但通常很容易封装它们。NPM 上优秀的“promise”模块包含一个 `denodeify` 函数，它接受一个异步函数（如 `fs.ReadFile`）并将其转换为返回\
  \ Promise 的函数。\n\n## 什么是服务器端编程？\n\n服务器端网站编程基本上涉及选择响应请求返回给浏览器的内容。服务器端代码处理诸如验证发送的数据和请求、使用数据库存储和检索数据、以及根据需要将正确的数据发送到客户端等任务。\n\
  \n大多数大型网站使用服务器端编程在需要时动态显示各种数据，这些数据通常取自位于服务器上的数据库，并通过某些代码发送到客户端进行显示。\n\n服务器端编程最重要的好处可能是它允许你为特定用户定制网站内容。\n\
  \n服务器端编程非常有价值，因为它允许你有效地传递为个人用户编译的信息，从而创造更好的用户体验。\n\n像亚马逊这样的公司使用后端编程来构建产品的研究结果，根据客户偏好和之前的购买生成有针对性的优惠，简化订单等。银行使用后端编程来存储会计信息，并只允许授权用户查看和完成交易。Instagram、Facebook、Twitter\
  \ 和维基百科使用后端来突出显示、分发和控制对有趣内容的访问。\n\nNode 平台使用 V8 虚拟机，该虚拟机使用 Google Chrome 进行服务器编程。得益于\
  \ V8，Node 的性能得到了提升，因为消除了创建可执行代码的中间阶段。它不是生成字节码或使用解释器，而是直接编译为本机机器码。由于 Node 在服务器端应用\
  \ JavaScript，因此具有以下优势：\n\n* 开发人员可以用单一语言创建 Web 应用程序，从而减少了开发服务器和客户端时上下文切换的需要。这确保了客户端和服务器之间的代码共享，例如用于验证表单中输入数据的代码或游戏逻辑的代码。\n\
  * 最流行的 JSON 数据交换格式是 JavaScript 的专有格式。\n* JavaScript 被用于各种 NoSQL 数据库（例如 CouchDB 和\
  \ MongoDB），因此与这些数据库的连接以自然的形式进行。例如，MongoDB 数据库的包装器和查询语言是 JavaScript。CouchDB 数据库的投影/信息也是\
  \ JavaScript。\n* Node.js 中的编译目标是 JavaScript，此外目前还有许多其他编程语言编译为 JavaScript。\n* Node\
  \ 使用单个虚拟机（V8），该虚拟机兼容 ECMAScript 5 标准。换句话说，你不必等到所有与 Node 平台相关的新 JavaScript 工具在所有浏览器中可用。\n\
  \n## V8 和其他引擎\n\nV8 是 Google Chrome 和 Chromium 系列浏览器中使用的 JavaScript 引擎的名称。它负责执行在互联网上工作时进入浏览器的\
  \ JavaScript 代码。V8 为 JavaScript 提供了运行时环境。DOM 和其他 Web 平台 API 由浏览器提供。\n\nJS 引擎独立于其运行的浏览器。正是这一事实使得\
  \ Node.js 平台的出现和发展成为可能。V8 在 2009 年被选为 Node.js 的引擎。由于 Node.js 的爆炸性增长，V8 成为了如今负责执行大量服务器端\
  \ JS 代码的引擎。Node.js 生态系统非常庞大。因此，V8 也通过像 Electron 这样的项目用于桌面应用程序的开发。值得注意的是，除了 V8 之外，还有其他引擎：\n\
  \n* Firefox 浏览器使用 SpiderMonkey 引擎。\n* Safari 使用 JavaScriptCore（也称为 Nitro）。\n* Edge\
  \ 使用 Chakra 引擎。\n\n这些引擎实现了 ECMA-262 规范，也称为 ECMAScript。\n\nV8 引擎是用 C++ 编写的，并且不断改进。它可以在许多系统上运行，特别是\
  \ Mac、Windows 和 Linux。V8 在不断发展，其他引擎也是如此。这尤其导致了 Web 浏览器和 Node.js 平台性能的提升。浏览器引擎制造商多年来一直在争夺代码执行速度。这一切对用户和程序员都有好处。\n\
  \n## Node.js 与浏览器的区别\n\n为 Node.js 进行 JS 开发与浏览器编程有什么区别？这些环境的相似之处在于它们都使用相同的语言。但为在浏览器中运行而设计的应用程序的开发与服务器应用程序的开发截然不同。尽管使用相同的语言，但存在一些关键差异，使得这两种开发成为完全不同的活动。\n\
  \n值得注意的是，如果以前从事前端开发的人开始学习 Node.js，他/她将有一个非常难得的机会快速掌握所需的一切，因为将用已经熟悉的语言编写代码。如果在学习新语言的需求上再加上学习新环境的需求，任务就会变得复杂得多。\n\
  \n因此，客户端和服务器之间的主要区别在于需要编程的环境以及这些环境的生态系统。在浏览器中，主要工作是通过 DOM 对 Web 文档执行各种操作，以及使用其他\
  \ Web 平台 API，例如处理 cookie 的机制。所有这些在 Node.js 中当然都不存在。没有 `document` 对象，没有 `window`\
  \ 对象，也没有浏览器提供的其他对象。\n\n反过来，浏览器也没有 Node.js 环境中可用的那些编程机制，这些机制作为模块存在，可以连接到应用程序。例如，用于访问文件系统的\
  \ API。\n\n\n\n\n\nJavaScript 在客户端和服务端开发的另一个区别在于 Node 环境下的工作方式。JS 开发者可以完全控制环境。除非你开发的是可在任何地方运行的开源应用，否则你确切知道，例如，你的项目将在哪个\
  \ Node.js 版本上运行。这与客户端环境相比非常方便，因为在客户端环境中，你的代码必须在用户现有的浏览器中工作。此外，这意味着你可以使用语言的最新特性，而无需担心兼容性问题。\n\
  \n由于 JavaScript 发展极其迅速，浏览器根本没有足够的时间快速实现其所有创新。此外，并非所有用户都使用最新版本的浏览器。因此，想要在程序中使用新特性的开发者必须考虑到这一点，并关注其应用与所用浏览器的兼容性，这可能导致需要放弃现代\
  \ JavaScript 特性。当然，你可以使用 Babel 转译器将代码转换为所有浏览器都支持的 ECMAScript 5 标准兼容格式，但在使用 Node.js\
  \ 时则不需要这样做。\n\nNode.js 与浏览器的另一个区别在于，Node.js 使用 CommonJS 模块系统，而浏览器中可以看到 ES 标准模块实现的初步迹象。实际上，这意味着目前在\
  \ Node.js 中，连接外部代码使用 `require()` 结构，而在浏览器代码中使用 `import`。\n\n## NODE.JS 应用的托管\n\n\
  Node.js 应用的托管选择取决于你的需求。以下是一小部分托管选项列表，当你决定部署应用并使其公开时，可以研究这些选项。首先，我们将考虑功能有限的简单选项，然后是更复杂但功能也更强大的选项。\n\
  \n### 最简单的托管选项：本地隧道\n\n即使你的计算机被分配了动态 IP 地址，或者你位于 NAT 之后，你也可以在其上部署应用，并使用本地隧道为用户请求提供服务。此选项适用于快速组织测试、组织产品演示，或向非常小的人群提供应用访问权限。对于组织本地隧道，有一个非常好的服务\
  \ ngrok，适用于许多平台。使用 ngrok，只需执行类似 `ngrok PORT` 的命令，你指定的端口即可从互联网访问。同时，如果你使用该服务的免费版本，你将获得一个\
  \ `ngrok.io` 域下的地址。如果你决定注册付费订阅，则可以使用自己的域名，此外，还可以提高解决方案的安全性（使用 ngrok，你将向整个互联网开放对计算机的访问）。\n\
  \n### 无需配置的 Node.js 项目部署环境\n\n#### Glitch\n\nGlitch 是一个用于快速应用开发的交互式环境和平台，允许你在 `glitch.com`\
  \ 的子域中部署应用。该平台尚不支持自己的用户域名，并且在使用时有一些限制，但它非常适合开发应用原型。Glitch 的设计看起来相当有趣（也许这可以算作该平台的优点），但这并不是一个“玩具”式的、极度受限的环境。在这里，你可以使用\
  \ Node.js、内容分发网络（CDN）、敏感信息的安全存储、与 GitHub 的数据共享等功能。Glitch 项目由与 FogBugz 和 Trello 相同的公司运营（该公司也是\
  \ StackOverflow 的创建者之一）。我经常使用这个平台来演示应用。\n\n#### Codepen\n\nCodepen 是一个优秀的平台，围绕它形成了一个有趣的社区。在这里，你可以创建包含多个文件的项目，并使用自己的域名进行部署。\n\
  \n#### 无服务器环境\n\n无服务器平台允许你发布应用，而无需考虑服务器、配置或管理它们。无服务器计算范式是指将应用发布为响应网络端点访问的函数。这种应用部署方法也称为函数即服务（FAAS）。\n\
  \n#### Google Cloud Platform\n\nGoogle Cloud 是部署 Node.js 应用的绝佳环境。以下是其文档的相关部分。\n\n\
  #### VPS 托管\n\n有许多平台提供 VPS 托管服务。这些平台的一个共同特点是，开发者获得一台虚拟服务器，自行安装操作系统（Linux 或 Windows），并自行部署应用。在众多提供\
  \ VPS 服务的平台中，你可以注意以下我使用过并可以推荐给其他人的平台：\n\n*   Digital Ocean\n*   Linode\n*   Amazon\
  \ Web Services\n\n#### PaaS 解决方案\n\nPaaS（平台即服务）是那些负责处理许多通常由部署应用的开发者处理的事务的平台。\n\n\
  #### Zeit Now\n\nZeit 是一个有趣的部署应用选项。使用该平台时，部署简化为在终端中输入 `now` 命令。Zeit 有免费版本，但使用时有一些限制。也有付费的、更强大的版本。使用\
  \ Zeit，你完全可以不必考虑应用需要服务器才能运行。你只需部署应用，其余一切由该平台负责。\n\n#### Nanobox\n\nNanobox 平台的创建者（该平台包含\
  \ Node.js 应用的部署）将其称为 PAAS V2。\n\n#### Heroku\n\nHeroku 是另一个用于托管 Node.js 应用的优秀平台。\n\
  \n#### Microsoft Azure\n\nAzure 是微软的云平台。其文档中有一个专门介绍 Node.js 应用的章节。\n\n#### 标准服务器\n\
  \n另一种托管解决方案是购买（或租用，例如使用 Vultr Bare Metal 服务）一台标准服务器，在其上安装 Linux 和其他软件，连接到互联网，并在其上托管\
  \ Node.js 应用。托管是一个庞大的话题，但我们希望本节中的材料能让你选择到所需的内容。\n\n## NODE.JS 框架\n\n很可能，Node.js\
  \ 初学者在解析 POST 请求、路由 URL 或形成视图时，不想重新发明轮子。在这些情况下，你很可能希望使用一个流行的 Web 框架。本节概述了主要的框架。\n\
  \n### Node.js 框架的主要优势\n\n更好的性能、功能性、高速度和可扩展性等特点，使 Node.js 成为大型企业级应用开发的首选。\n\n使用 Node.js\
  \ 可以在前端和后端使用同一种语言。这将使你免于学习和应用新的编程语言。\n\n以下是一些主要优势：\n\n*   高速函数\n*   支持数据流\n*   实时操作\n\
  *   为所有数据库查询提供解决方案\n*   易于编写代码\n*   开源代码\n*   跨平台\n*   与代理服务器协作\n*   高性能\n*   解决同步问题\n\
  *   友好的社区\n\n### Express.js\n\n目前，Express 是大多数 Node.js 开发者最合适的框架。它相对成熟，并基于 connect\
  \ 构建。支持路由、配置、模板引擎、POST 请求解析等功能。\n\n\n\n\n\n虽然 Express 已经是一个相当稳固的框架，但与 Rails、CakePHP\
  \ 或 Django 等同类框架相比，它的应用规模要小得多。Express 更像 Sinatra 这样的工具，而且遗憾的是，它尚未在摆脱 Ruby 根源、向更符合\
  \ JavaScript 自然特性的方向迈出太多努力。不过，使用它比创建自己的框架要容易和快速得多，而且目前它是最值得的选择。\n\n![Express.js\
  \ 的主页显示了以下标签：首页、入门指南、教程、API 参考、高级主题和资源，以及一个搜索框。页面文字为：Express……快速、不固执己见、极简的 Node.js\
  \ Web 框架。](img/ufig3_1.jpg)\n\nExpress.js 包含附加特性，例如简化的多路由、数据库集成、模板引擎等。此外，高级 Node.js\
  \ 开发者还可以为其编写扩展、插件和包。一些知名网站和应用程序，如 Geekli.st、MySpace、Yummly、Klout 和 Segment.io，都是基于\
  \ Express.js 构建的。\n\nExpress 让你可以灵活地使用任何签名匹配的模板引擎、任何用户认证方案以及任何第三方数据库。它会以方便你的方式帮助你确定项目目录的结构。\n\
  \nExpress.js 是一个 Node.js Web 应用服务器平台，专门用于创建单页、多页和混合 Web 应用程序。\n\n它已成为 Node.js 的标准服务器平台。Express\
  \ 是所谓的 MEAN 栈的核心部分。\n\nMEAN 是一个免费、开源的 JavaScript 软件栈，用于创建动态网站和 Web 应用程序，包含以下组件：\n\
  \n*   MongoDB——标准 NoSQL 数据库\n*   Express.js——默认的 Web 应用程序平台\n*   Angular.js——用于\
  \ Web 应用程序的 JavaScript MVC 框架\n*   Node.js——用于可扩展服务器和网络应用程序的平台\n\nExpress.js 环境使得开发能够处理多种类型请求（如\
  \ GET、PUT、POST 和 DELETE 请求）的应用程序变得非常容易。\n\n#### 安装和使用 Express\n\nExpress 通过 NPM\
  \ 安装。你可以在命令行中运行以下命令来完成安装：\n\n```\nnpm install express\n```\n\n上述命令要求 NPM 下载必要的 express\
  \ 模块并相应地进行安装。\n\n让我们使用新安装的 Express 平台创建一个简单的 `\"Hello World\"` 应用程序。\n\n我们的应用程序将创建一个简单的服务器模块，监听端口号\
  \ 3000。在我们的示例中，如果通过浏览器向该端口号发出请求，服务器应用程序将向客户端发送一个“Hello World”响应。\n\n在我们的第一行代码中，我们使用\
  \ `require` 函数来启用 `express` 模块。在开始使用 `express` 模块之前，我们需要从中创建一个对象。这里我们创建一个回调函数。每当有人访问我们\
  \ Web 应用程序的根目录（即 `http://localhost:3000`）时，就会调用此函数。该回调函数将用于向网页发送字符串 `\"Hello World\"\
  `。在回调函数中，我们将字符串 `\"Hello World\"` 发送回客户端。`res` 参数用于将内容发送回网页。这个 `res` 参数是由 `request`\
  \ 模块提供的，用于允许将内容发送回网页。然后我们使用监听函数让我们的服务器应用程序监听端口 3000 上的客户端请求。这里你可以指定任何可用的端口。\n\n\
  如果命令成功执行，当在浏览器中运行代码并访问 localhost 的 3000 端口时，你将看到页面上显示字符串 `\"Hello World\"`。\n\n\
  #### 路由\n\n路由定义了应用程序如何响应客户端对特定端点的请求。\n\n例如，客户端可以对各种 URL 发出 http GET、POST、PUT 或 DELETE\
  \ 请求，如下所示：\n\n`http://localhost:3000/​Books`\n\n`http://localhost:3000/​Teachers`\n\
  \n在上面的示例中，如果对第一个 URL 发出 GET 请求，那么理想情况下响应应该是一个书籍列表。如果对第二个 URL 发出 GET 请求，那么理想情况下响应应该是一个教师列表。因此，根据所访问的\
  \ URL，Web 服务器上会调用其他函数，并相应地发送响应给客户端。这就是路由的概念。每个路由可以有一个或多个处理函数，当路由被映射时这些函数会被执行。\n\n\
  ### Hapi.js\n\nHapi.js 是最好的 Node.js Web 框架，用于开发应用程序接口。得益于强大的插件系统，Hapi.js 让你能够完全管理开发过程。Hapi\
  \ 激励开发者专注于重用逻辑，而不是花时间构建基础设施。\n\n![Hapi.js 的主页显示了以下标签：API、教程、资源、政策、模块、插件、商店和支持。](img/ufig3_2.jpg)<details><summary>详细描述</summary>\n\
  \n页面文字为：简单、安全的框架，开发者信赖。构建强大、可扩展的应用程序，开销最小且功能开箱即用。提供了一个标有“开始使用 hapi”的按钮。</details>\n\
  \n它主要以其强大的插件系统和众多关键特性而闻名，包括基于配置的功能、输入验证、错误处理、缓存实现和日志记录。这个框架特别适用于传递数据库连接。\n\n其简洁的设计使其易于上手。Hapi\
  \ 的核心使用了 ES6 JavaScript 的许多最新特性，例如 ES6 的 Promise。对于那些之前使用过 Express 的人来说，Hapi 让你可以尝试新事物并体验所有最新的\
  \ JavaScript 特性。这个框架被 Concrete、PayPal、Disney 和 Wal-Mart 等大公司使用。\n\n#### Hapi.js\
  \ 的特性\n\n*   强大的输入数据验证\n*   功能性\n*   缓存实现\n*   改进的错误处理系统\n\n接下来我们安装 Hapi.js。我们将使用\
  \ NPM 为我们的项目下载 Hapi.js 及其依赖项。为此，在项目目录中执行以下操作：\n\n```\nnpm install hapi\n```\n\n\
  这会从 NPM 下载 Hapi.js 并将其安装到我们的项目目录中。同时，Hapi.js 所依赖的任何依赖项也会为了方便而一并上传。\n\n### Koa.js\n\
  \nKoa.js——这是一个最小且灵活的 Node.js Web 应用程序基础设施，为 Web 和移动应用程序提供了一套强大的功能。它是一个开源框架，由 Express.js（最流行的\
  \ Node.js Web 框架）的创建者开发和维护。\n\n![koa.js 的主页在页面中央显示了字母 k o a。字母下方的文字为：下一代 Node.js\
  \ Web 框架。](img/ufig3_3.jpg)\n\n其开发目的是填补 Express.js 的不足。由于脚本和方法的独特性，Koa 可以在不同的浏览器中工作。它还可以在不使用回调的情况下工作，并拥有强大的错误处理系统。\n\
  \nKoa.js 的特性：\n\n*   使用必要的生成器来管理和处理回调\n*   有效的错误处理流程\n*   基于组件的模块\n*   级联中间件模型，无回调地狱\n\
  \nKoa 占用空间小（约 600 行代码），是 Node 之上非常薄的一层抽象，用于创建服务器端应用程序。它完全可插拔，拥有庞大的社区。它还允许我们轻松扩展\
  \ Koa 并根据我们的需求使用它。它使用先进技术（ES6）构建，这使其比 Express 等旧平台更具优势。\n\n要开始使用 Koa 基础设施进行开发，你需要安装\
  \ Node 和 `npm`。通过在终端中运行以下命令，确保 `node` 和 `npm` 已安装。\n\n```\nnode --version\nnpm --version\n\
  ```\n\n\n\n\n\n确保你的 `node` 版本高于 `6.5.0`。现在我们已经配置好了 `Node` 和 `npm`，接下来让我们弄清楚 `npm`\
  \ 是什么以及如何使用它。\n\n一旦我们完成了开发环境的搭建，就可以开始使用 `Koa` 开发第一个应用程序了。创建一个名为 `app.js` 的新文件，并在其中输入以下内容：\n\
  \n保存文件，打开终端，然后输入以下命令。\n\n这将启动服务器。要测试这个应用，打开浏览器并访问 [`localhost`](https://localhost):3000，你应该会看到“Hello\
  \ World!”消息。\n\n这个应用是如何工作的？第一行将 `Koa` 导入到我们的文件中。我们可以通过 `Koa` 变量访问其 API。我们用它来创建一个应用，并将其赋值给变量\
  \ `app`。\n\n*   `app.use(function)`：这个函数是一个中间件，每当我们的服务器收到请求时就会被调用。我们将在后续章节中了解更多关于中间件的内容。回调函数是一个生成器，我们将在下一章中看到。这个生成器的上下文在\
  \ `Koa` 中被称为上下文。这个上下文用于访问和修改请求和响应对象。我们将响应的主体设置为 Hello world!\n\n*   `app.listen(port,\
  \ function)`：这个函数绑定并监听指定端口上的连接。端口是这里唯一必需的参数。如果应用程序成功运行，则会执行回调函数。\n\n#### 路由\n\n\
  Web 框架通过不同的路由提供资源，例如 HTML 页面、脚本、图像等。`Koa` 在主模块中不支持路由。我们需要使用 `Koa-router` 模块来轻松地在\
  \ `Koa` 中创建路由。使用以下命令安装此模块。\n\n现在我们已经安装了 `Koa` 路由器，让我们看一个简单的 `GET` 路由示例。\n\n如果我们启动应用并访问\
  \ `localhost:3000/hello`，服务器将收到一个沿着“/hello”路由的 `GET` 请求。我们的 `Koa` 应用执行附加到此路由的回调函数，并发送“Hello\
  \ World!”作为响应。\n\n### Total.js\n\n`Total.js` 由来自斯洛伐克的程序员 Peter Shirka 于 2013 年创建。当时（2013\
  \ 年），`Node.js` 刚刚开始流行。开发者的主要想法是创建一个具有大量基本功能的内核，同时无需安装大量额外的依赖项，这与 `Express.js` 不同，后者基本功能较少，需要借助外部模块来扩展。`Total.js`\
  \ 也可以通过 `npm` 中的各种模块进行扩展。`Total.js` 的架构让人联想到 `Ruby` 的 `Rails` 或 `PHP` 的 `Laravel`\
  \ 框架。\n\n![Total.js 平台的主页显示以下选项卡：欢迎、平台、应用、云、支持、参考、新闻和关于我们。](img/ufig3_4.jpg)<details><summary>长描述</summary>\n\
  \n页面显示：开源 JavaScript 平台。Total.js 平台为您提供了一个优秀且稳定的服务器端 Node.js 框架，以及一个客户端库，用于免费创建拥有超过\
  \ 230 个 UI 组件的著名 Web 应用程序。提供了一个按钮，用于探索 Total.js 平台。还提供了开源、total.js 云、在线服务、免费 node.js\
  \ 应用、无依赖和优秀支持等按钮。</details>\n\n`Total.js` 需要最少的维护，并提供高性能和无缝扩展。`Total.js` 团队努力满足用户的需求，以使该平台对全球用户来说既方便又有吸引力。因此，`Total.js`\
  \ 在未来几年内完全有潜力获得流行。\n\n`Total.js` 的特性：\n\n*   按照模型-视图-控制器模式设计的软件架构\n\n*   可扩展且异步的框架\n\
  \n*   完全支持 `RESTful` 路由引擎\n\n*   完全支持 `WebSocket` 和媒体流协议\n\n#### 路由\n\n`Total.js`\
  \ 支持经典路由、动态路由以及使用正则表达式的路由。你可以为动态内容、文件或 `WebSocket` 编写自己的路由。\n\n路由在控制器中声明，每个路由定义了所需操作的处理程序。路由还支持标志。你可以使用标志来定义特殊行为，例如\
  \ HTTP 方法、`CORS`、模式、中间处理等。\n\n#### 模板引擎\n\n内置的模板引擎支持许多功能，并具有出色的性能。\n\n*   布局\n\n\
  *   条件、循环和辅助函数\n\n*   嵌套视图\n\n*   区块\n\n`Total.js` 已经成为一个完整的平台，而且它是免费的。现在，使用这些工具来启动你的应用程序将变得更加容易和快捷。所有你可以在生态系统中使用的开源项目：\n\
  \n1.  `SuperAdmin`：`Node.js` 应用程序管理系统：\n\n    *   创建 SSL 证书\n\n    *   短信和电子邮件更新\n\
  \n    *   用于 API 的个人访问 ID\n\n    *   与 `GIT` 轻松集成\n\n    *   通过 `FTP` 自动备份\n\n2.\
  \  `Node.js CMS`：一个简单、美观且注重设计的 `Total.js` 内容管理系统，具有许多令人印象深刻的功能。`Total.js CMS` 将帮助你轻松管理你有趣的新商业或个人网站。`Node.js\
  \ CMS` 构建在内置的 `NoSQL` 数据库之上，并且没有依赖项。\n\n3.  `OpenPlatform`：用于第三方应用程序的企业容器。`OpenPlatform`\
  \ 是一个简单的平台，用于运行、集成和管理多个第三方 Web 应用程序。它为运行的应用程序提供一组服务，例如用户管理和安全性，因此程序员可以专注于业务逻辑。例如，基于此解决方案，你可以开发自己的企业\
  \ `CRM`。\n\n4.  `Node.js Messenger`：`Slack` 的免费替代品，具有类似的功能。一个小巧、快速、开源的 Web 应用程序，你可以根据自己的需求进行定制。\n\
  \n5.  `Flow`：用于实时数据处理的视觉编程界面。专为物联网以及经典的 Web/REST 应用程序等设计。你还可以将其添加到任何现有的 `Total.js`\
  \ 应用程序中（框架 + `2.5.x`）。\n\n6.  `Node.js Eshop`：用 `Node.js` 编写的小型企业电子商务解决方案。一个完整的商店，构建在另一个工具\
  \ `Total.js CMS` 的平台之上。从 CMS 中，还提供了小部件集、文章编辑器。与任何完整的商店一样，它具有搜索和编辑产品及订单的功能，以及用于支付的\
  \ `PayPal`。\n\n7.  `Node.js Helpdesk`：该解决方案将帮助你更快地解决客户的问题。将你的客户注册到系统中，并为他们分配预付费的每月分钟数。你的支持团队可以轻松解决他们的问题。\n\
  \n8.  `Node.js Wiki`：一个简单的工具/应用程序，用于以 Wiki 形式创建文档。文档使用 `Markdown` 格式创建。\n\n### Derby.js\n\
  \n一个 `MVC` 框架，使得编写既能在 `Node.js` 中运行又能在浏览器中运行的实时协作应用程序变得更加容易。就在几天前，`Derby` 仓库的主分支发生了变更。\n\
  \n![Derby.js 的主页显示以下选项卡：开始使用、文档和资源。](img/ufig3_5.jpg)<details><summary>长描述</summary>\n\
  \n页面显示：对你的 MVC 有更多期待。Derby JS 是一个用于编写现代 Web 应用程序的全栈框架。页面中间有一个标有“开始使用”的按钮。底部的文字显示：实时协作。</details>\n\
  \n它提供了服务器和客户端之间的无缝数据同步。`Derby.js` 作为用于编写现代 Web 应用程序的全栈 `Node.js` 框架而闻名。你可以使用它来创建自定义代码并开发高性能的\
  \ Web 应用程序。由于其独特的特性，`Derby.js` 如今越来越受欢迎。\n\n`Derby.js` 的特性：\n\n*   客户端和服务器端均采用 `MVC`\
  \ 模板\n\n*   非常适合移动和 Web 应用程序开发\n\n*   使用服务器端渲染实现快速页面加载、HTML 模板和搜索引擎支持\n\n### Mojito.js\n\
  \n\n\n\nMojito 是一个 JavaScript 网络框架，允许你为客户端和服务器端编写程序。服务器端使用 Node.js。借助 Mojito，开发者不再需要编写不同的后端和前端代码。如果浏览器未启用\
  \ JavaScript，Mojito 应用程序仍将在服务器端使用相同的代码执行。该框架基于著名的 JavaScript 库 Yahoo!——YUI 3（雅虎用户界面库）。\n\
  \n![Mojito.js 的主页显示以下选项卡：开始使用、示例、API 参考、博客和 GitHub。](img/ufig3_6.jpg)<details><summary>长描述</summary>\n\
  \n左侧的侧边菜单显示以下部分：简介和 JS 交付。右侧的侧边菜单列出了平台的功能。页面内容为：Mojito 框架概述。Mojito 是一个模块化、源代码控制的分割测试框架，让你能够通过\
  \ Git/CI 构建、启动和分析实验。它由 3 个核心模块组成，这些模块可以相互独立使用，也可以协同使用。1. Mojito JS 交付：通过 JS 在你的网站上运行实验。2.\
  \ Mojito Snowplow 存储：用于跟踪到 Snowplow Analytics 的事件和数据模型。3. Mojito R Analytics：可模板化的\
  \ R Markdown 实验报告。右侧菜单列出了诸如 Mojito 与供应商对比、示例实验以及独立使用模块等功能。</details>\n\nMojito 是雅虎开发者网络创建的另一个强大的移动应用开发平台。Mojito\
  \ 还充当 MVC 应用程序框架，可以使用 JavaScript、CSS3 和 HTML5 构建高性能的移动和网络应用程序。\n\n由于客户端和服务器组件都是用\
  \ JavaScript 编写的，Mojito 提供了开发在客户端和服务器端都能运行的高性能、标准跨平台应用程序的能力。它还提供了一种便捷的数据收集方式，非常适合本地开发环境和工具。\n\
  \n它作为一个模块，能够很好地与其他核心 Node 模块连接。Mojito 适用于简化库的本地化和国际化。\n\nMojito 框架可在 GitHub 上获取，并根据\
  \ BSD 许可证分发。\n\n### Adonis.js\n\nAdonisJs 是最流行的 Node.js 框架之一，可在所有主流操作系统上运行。它拥有一个用于编写服务器端网络应用程序的静态生态系统。因此，你可以根据特定的业务需求选择合适的包。\n\
  \nAdonis 是一个真正的 Node.js MVC 框架，拥有正确的框架结构。它借鉴了流行的 Laravel PHP 框架中的服务提供者概念，用于创建大规模应用程序，同时利用\
  \ ES6 的所有特性使代码更精确且更易维护。\n\n![Adonis.js 的主页显示以下选项卡：快速入门、指南、食谱和社区。](img/ufig3_7.jpg)<details><summary>长描述</summary>\n\
  \n页面内容为：一切都归结于信心。编写微服务，或者如果你是 TDD 的爱好者，一切都归结于信心。Adonis JS 的简洁性会让你对自己的代码充满信心。底部有一个“开始使用”按钮。</details>\n\
  \n该基础设施支持便捷的身份验证、SQL ORM（关系对象映射）、迁移和数据库填充。AdonisJs 的架构类似于 PHP 应用程序的 Laravel 网络基础设施架构，具有相同的文件夹结构和几个相似的配置概念。\n\
  \n默认情况下，AdonisJs 使用 Edge 模板系统，设计为直观易用。与 Laravel 类似，AdonisJs 有一个名为 Lucid 的 ORM 系统，作为应用程序模型与数据库之间交互的接口。借助\
  \ AdonisJs，开发者可以创建复杂的应用程序，其中后端负责应用业务逻辑、路由和渲染应用程序的所有页面。你还可以创建一个网络服务 API，从控制器返回 JSON\
  \ 响应。这些网络服务可以与 Vue.js、React 和 Angular 等客户端框架一起使用。\n\n#### Adonis.js 的特性\n\n*   支持由\
  \ SQL 数据库组成的 ORM\n*   高效创建基于活动记录的 SQL 查询\n*   易于学习的查询构建器，用于创建简单快速的查询\n*   提供对 MongoDB\
  \ 等 No-SQL 数据库的支持\n\n#### 安装 Adonis CLI\n\n让我们在本地计算机上安装 Adonis CLI 及其所有必需的包。CLI\
  \ 允许你创建新的 AdonisJs 项目结构，以及在应用程序中创建和生成控制器、绑定器和模型的模板。你还需要为项目创建一个数据库。\n\n运行以下命令，使用\
  \ `npm` 在计算机上全局安装 AdonisJs CLI：\n\n安装过程完成后，在终端中输入以下命令以确认 AdonisJs 的安装并查看当前版本：\n\n\
  你将看到输出显示 Adonis.js 的当前版本。\n\n我们已经成功安装了 AdonisJS CLI，现在可以使用 `adonis` 命令来安装新的 AdonisJs\
  \ 项目、管理项目以及生成所需的文件，包括控制器、模型等。\n\n### Keystone.js\n\nKeystone.js 是一个内容管理系统和框架，用于创建与数据库交互的服务器端应用程序。它基于\
  \ Node.js 的 Express 平台，并使用 MongoDB 进行数据存储。对于希望创建数据驱动网站但不想迁移到 PHP 平台或 WordPress 等大型系统的网络开发者来说，它是\
  \ CMS 的替代方案。\n\n![Keystone.js 的主页显示一个搜索栏和以下选项：Twitter、GitHub 和 Slack。](img/ufig3_8.jpg)<details><summary>长描述</summary>\n\
  \n页面内容为：用于 Node 的无头 CMS 和 GraphQL API。在 JavaScript 中配置你的模式，KeyStone JS 将生成一个强大的\
  \ GraphQL API 和 CMS。页面底部有四个选项：开始使用、文档、博客和在 GitHub 上查看。页面右侧显示了一个视频。</details>\n\n\
  虽然 WordPress 可以由非技术用户配置，但 KeystoneJS 提供了专业用户开发新网站所需的控制权，尽管使用 KeystoneJS 仍然比从头手动创建网站要容易得多。它不仅提供了一个构建网站的平台；你几乎可以替换其中的所有内容，并开发更专业的系统，例如应用程序和\
  \ API。\n\nKeystoneJS 建立在 Node.js/JavaScript 平台之上，这使得它在特定应用程序上可能比基于 PHP 的 WordPress\
  \ 更具生产力。该平台的一个优势是包的可用性；如果你需要某个功能，很可能存在一个包可以实现你想要的功能。\n\n#### 数据库\n\nKeystoneJS 使用\
  \ MongoDB 存储所有数据。MongoDB 是市场上最流行的非关系型数据库之一，由于在 JavaScript 项目中易于使用，经常被 Node.js 开发者使用。\n\
  \n由于 KeystoneJS 更像是一个库而不是一个即用型系统，如果你了解 JavaScript，几乎一切都可以自定义。因为它基于 Node.js、Express\
  \ 和 Mongoose，你几乎拥有同样的自由度；只是多了一些可以更快工作的额外功能。\n\n#### 模板引擎\n\n你还可以在 WordPress 中选择一些模板引擎（如\
  \ Timber），这些引擎允许你使用不同的语言编写更易读的主题，类似于其他平台上的模板语言。\n\n#### 主要特性\n\n1.  **自动生成的管理员用户界面：**\
  \ 当你使用 Keystone.js 创建内容时，你定义的数据模型也会用于自动创建一个管理面板来管理你的数据。你不需要直接安装数据库模型；而是使用列表来描述你的数据。\n\
  \n\n\n\n\n2.  **轻量且易于设置：** 你无需深入了解庞大的系统就能掌控一切，这使得网站搭建变得简单快捷。\n\n3.  **易于扩展：** KeystoneJS\
  \ 可视为一个库，你不必局限于仅使用它提供的功能。你可以轻松集成来自最大库生态系统之一——JavaScript 中的任何包。\n\n4.  **从零开始或使用模板：**\
  \ 如果你想开始创建博客之类的内容，无需花时间学习系统逻辑；KeystoneJS 提供了现成的模板供你使用或自定义。如果你有特殊需求，也可以使用他们提供的工具从零开始，但无需自己编写所有内容。\n\
  \n5.  **专为开发者设计：** 其他 CMS 往往将所有功能打包在一起，以便非技术用户能尽快上手。然而，KeystoneJS 面向的是那些想要创建 CMS，但又不想让成品系统臃肿或受限的开发者。\n\
  \n6.  **兼容第三方服务：** KeystoneJS 开箱即用地集成了一些有用的第三方服务，例如 Amazon S3、Cloudinary、Mandrill。假设你想将某些数据存储在\
  \ Amazon S3 中，只需在定义数据时添加一个 `{type: Types.S3File}` 字段类型即可。\n\n#### 使用场景\n\n1.  **面向非技术用户的网站：**\
  \ 如果你为客户做 Web 开发，可能会发现为非技术人员创建网站并不容易，因为你还需要创建一个管理面板来添加和更新数据。使用 KeystoneJS，你无需担心重复工作；管理面板会自动生成。\n\
  \n2.  **动态网站：** KeystoneJS 提供了处理网站动态数据的有用框架和工具，当静态网站过于简单，而 WordPress 等传统 CMS 对你的项目来说过于笨重或存在问题时，它非常有用。\n\
  \n3.  **性能：** 没有什么比按需定制更好了；如果你需要一个高度专业化的网站，并且性能是关键，你可以使用 KeystoneJS 创建满足需求并利用 Node.js\
  \ 平台性能（尤其是并行服务）的解决方案。\n\n4.  **生态系统：** JavaScript 拥有最丰富的第三方包生态系统之一。此外，如果你需要在客户端和服务器端都使用\
  \ JavaScript（或者你更倾向于这样做），KeystoneJS 是一个很好的工具。\n\n5.  **紧迫的截止日期：** 你有一个具有特殊功能且截止日期非常接近的项目吗？KeystoneJS\
  \ 处理数据的方式以及自动生成管理面板的特性，意味着你可以花更多时间创建网站的实际逻辑，而不是处理实现细节。\n\n### Socket.IO\n\n这是用于创建实时\
  \ Web 应用的最佳 Node.js 服务器和 Web 框架。它实现了 Node.js 服务器与浏览器之间基于事件的通信。Socket.IO 既作为 Node.js\
  \ 的后端库，也作为浏览器的前端库。\n\nSocket.IO 的主要特性包括二进制流、异步 I/O 处理和即时消息传递。该框架支持文档协作所需的实时并发。\n\
