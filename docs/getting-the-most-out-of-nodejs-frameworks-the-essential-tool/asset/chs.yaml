  \n**Sufyan bin Uzayr**\n\n# 关于作者\n\n**Sufyan bin Uzayr** 是一位作家、程序员和企业家，拥有十多年的行业经验。他此前已撰写多本书籍，主题涵盖从历史到计算机/IT\
  \ 的广泛领域。\n\nSufyan 是 Parakozm 的董事，这是一家专注于教育科技解决方案的跨国 IT 公司。他还运营着 Zeba Academy，这是一个专注于\
  \ STEM 领域的在线学习和教学平台。\n\nSufyan 精通多种技术，如 JavaScript、Dart、WordPress、Drupal、Linux 和\
  \ Python。他拥有多个学位，包括管理学、IT、文学和政治学。\n\nSufyan 是一位数字游民，在四个国家之间分配时间。他曾在全球多所大学和教育机构生活并任教。Sufyan\
  \ 对技术、政治、文学、历史和体育有着浓厚的兴趣，业余时间喜欢教年轻学生学习编程和英语。\n\n了解更多请访问 [sufyanism.com](http://sufyanism.com)。\n\
  \n# 第 1 章 JavaScript 框架简介\n\nDOI：[10.1201/9781003203711-1](https://doi.org/10.1201/9781003203711-1)\n\
  \n如果你有过 JavaScript（JS）的使用经验，你一定已经听说过“JavaScript 框架”这个术语。大家常说的这些 JS 框架到底是什么？它们又为开发带来了哪些特色？\n\
  \n虽然如今人们倾向于将几乎每个项目都贴上“框架”的标签，但要使一段代码被称为“框架”，需要具备某些关键特征。在 JS 的世界里，框架和库并不匮乏。\n\n随着你阅读本书各章节的深入，你将了解一些最流行、最具创新性和专业化的\
  \ JS 框架。你将学习有关安装和设置的细节，以及充分利用这些 JS 框架的最佳实践和方法。\n\n话虽如此，在进一步深入之前，先了解一下框架的一般概念是个好主意。如上所述，有时许多概念或库被错误地称为\
  \ JS 框架。\n\n为了避免犯这样的错误，让我们花点时间熟悉一下什么是 JS 框架，它们能做什么（以及不能做什么），以及你应该如何考虑使用它们。\n\n在本章中，我们不仅会介绍\
  \ JS 框架的含义，还会探讨这些框架与库的区别、它们的主要用途，以及何时应该或不应该使用它们。\n\n## 什么是 JS 框架？\n\n首先，让我们从弄清楚\
  \ JS 框架到底是什么开始讨论。\n\n用最简单的话来说，JS 框架是一种应用级别的实体，用于定义或组合整个应用程序的设计。\n\n感到困惑？这样说吧：JS\
  \ 框架是一组组件和代码块的集合，用于执行特定的功能和操作。换句话说，JS 框架是一段预定义的代码体，你可以通过将其与自己的代码结合，在项目中使用它。\n\n\
  通过这种方式，JS 框架通过调用其各种方法和组件来执行特定功能，从而减轻了开发者的负担。请注意，这里开发者的代码并不调用框架——而是相反。JS 框架为特定类型的应用程序（例如单页\
  \ Web 应用）勾勒出指导原则，而实际代码可以围绕这些原则进行建模。\n\n当然，根据 JS 框架所能处理的功能级别、复杂性和数量，它可能是一个非常大的框架，也可能是一个针对非常特定小众任务的小型框架。较小或不太通用的\
  \ JS 框架通常被称为库——我们将在本章后面讨论这一关键区别。\n\n现在，为了更好地理解 JS 框架如何运作，请考虑以下情况：假设我们有自己的代码，旨在执行特定角色。然而，它目前无法运行，因为它需要更多的函数、依赖项、库等。我们有两个选择：我们可以自己编写所有代码，花费数小时甚至数天的时间；或者我们可以使用一个现成的\
  \ JS 框架，其中包含一组预定义的代码，这些代码将执行我们代码运行所需的依赖操作。通过将 JS 框架与预写代码结合，我们可以轻松完成任务，并节省大量编码时间。\n\
  \n## JS 框架与库有何不同？\n\n\n\n\n\n既然我们已经讨论了什么是 JS 框架，现在该把注意力转向另一个常被（错误地）与框架混为一谈的概念——JS\
  \ 库。\n\n库是一组帮助你执行特定任务的工具和代码方法。而框架更像是一种指导方针，它规定了你应该如何组织你的代码。通常不是你的代码调用框架，而是 JS 框架调用你的代码。无论你构建什么应用程序，代码的结构在很大程度上都是由\
  \ JS 框架定义的。\n\n很多时候，许多程序员发现库和框架之间的区别相当模糊。但实际上，这并不难区分。JS 框架会告诉你项目或应用程序应该如何结构化。而 JS\
  \ 库只是一组组件和模块，你可以用它们在项目或应用程序中执行一系列任务。\n\nJS 库通常更容易集成到项目中。无论你的编码方法如何，你都可以使用像 `jQuery`\
  \ 这样的 JS 库，并轻松地将它们集成到你的项目中。然而，JS 框架在实现和组织方面往往要求更高。\n\n通常，更好的做法是从项目一开始就使用 JS 框架，并围绕框架（例如\
  \ `Angular`）来设计项目。虽然你可以轻松地将一个新库集成到现有项目中，但在现有项目中实现一个新框架通常是一件棘手的事情，需要付出相当大的努力。\n\n\
  因此，我们可以稳妥地说，JS 库比 JS 框架更灵活。\n\n现在，为了更好地理解每个概念如何应用于你的项目，请考虑这个简单的说明：假设我们计划构建一个 JS\
  \ 应用程序，它充当计算器并执行基本的数学功能。但是，对于每个结果（例如加法或减法），它在显示输出时都会播放一个动画。\n\n如你所见，你的代码使用了 JS 库，并调用其各种函数或方法来执行一系列任务（在本例中是动画）。库本身包含在\
  \ JS 框架内，而框架又调用你的代码来构建应用程序（在本例中是计算器）。这是一个非常简化的直接示例，旨在帮助你理解 JS 框架在整体架构中的位置和作用。\n\n\
  简单来说，我们可以说 JS 库基本上是类和方法的集合。这类库最好也最明显的用途是能够重用现有代码，从而节省时间和精力。而框架则提供了一个骨架，你的应用程序可以基于它定义自己的特性，框架会在需要时调用这些特性。\n\
  \n最近，某些 JS 库（如 `Prototype`）已经发展到非常普遍的使用程度，以至于它们同时被归类为框架和库。我们将在本书后面讨论 `Prototype`\
  \ 时再探讨这个概念。现在，记住以下几点就足够了：\n\n* 代码调用库，而 JS 框架本身调用代码。\n* JS 框架是一个半完整的实体，为你的代码提供了一个基于它的骨架结构，以满足特定的目的或需求。与框架不同，库是一组函数，你的项目可以用它们来执行特定的一组任务。\n\
  \n## JS 框架的优缺点\n\n理解或评估 JS 框架的优缺点相当容易，尤其是如果你有一定的开发背景。\n\n与任何 JS 框架相关的好处是，你有一个坚实的基础可以开始。大多数像样的\
  \ JS 框架往往带有健壮且非常可靠的代码库，并且这些代码库始终处于积极开发中。错误修复、安全更新以及其他一切都很容易获得。\n\n这自然大大减轻了开发中的头痛问题。你不必担心从头开始编写任何东西——你已经有了\
  \ JS 框架提供的坚实基础，可以在其上构建你的项目。\n\n除此之外，JS 框架还有各种明显的好处。首先，大多数主要的 JS 框架往往拥有非常忠诚且活跃的社区。这意味着如果你在项目中遇到错误或麻烦，同一\
  \ JS 框架的其他用户随时可以提供帮助。\n\n其次，新更新和补丁会相当快速地应用到 JS 框架中——尤其是当社区活跃时。这意味着你的项目有可靠的支撑。\n\n\
  第三，借助 JS 框架进行编码通常比没有框架更省时、更容易。它通过提供现成的代码库来节省编码时间和精力。\n\n综上所述，JS 框架带来了以下优势：\n\n*\
  \ **高效编码：** 这得益于每个像样的 JS 框架往往提供的健壮代码库和可靠的编码标准。\n* **节省时间/金钱/精力：** 仅仅通过为你提供构建项目的坚实基础，框架从长远来看可以节省大量时间。\n\
  * **更好的安全性/更新：** 社区永不眠！像 `React`、`Angular` 或 `VueJS` 这样的 JS 框架拥有非常忠实的用户，他们总是乐于报告问题、帮助新用户并解答你可能有的任何疑问！\n\
  * **出色的文档：** 即使官方文档有所欠缺，许多主要的 JS 框架在互联网上也有非常有效的文献资料，可以让学习再次变得有趣。\n\n但这是否意味着 JS 框架没有缺点？当然不是。根据你的需求和偏好，有时你可能会发现\
  \ JS 框架在某些方面有所欠缺。\n\n首先，任何 JS 框架，无论多么轻量级和灵活，通常都比原始 JS 运行得慢。这意味着你在某种程度上牺牲了速度。\n\n\
  但可以说，与 JS 框架相关的最大缺陷是迁移并非总是那么容易。当你为项目选择了一个 JS 框架，日后迁移到另一个不同的框架肯定是一项具有挑战性的任务，即使不是完全困难。虽然在大多数情况下你是安全的，不需要从\
  \ JS 框架迁移，但如果该框架停止开发了呢？\n\n这通常发生在较小且不太知名的框架上（而不是 `React` 或 `Angular`）。如果社区或开发者失去兴趣，错误修复和安全补丁可能很难获得。这意味着你的项目将依赖于过时的代码——自然，迁移到另一个框架将是唯一合理的选择。\n\
  \n这样一来，选择 JS 框架有时会对许多开发者造成限制。这就是为什么许多“专家”级程序员倾向于采用无框架的方法。当然，这只是故事的一面。有时你需要节省编码时间。其他时候，使用\
  \ JS 框架仅仅意味着你不想重新发明轮子，而是选择一种标准化的编码标准，确保你的应用程序符合最佳编码实践。仅仅因为某个软件（例如 Mac OS）可能在几十年后停止开发，并不意味着你今天不能使用它。技术是一个不断发展的概念，JS\
  \ 框架也是如此。\n\n话虽如此，如果你的工作流程在没有框架的情况下感觉更好，也许你应该只是有节制地或偶尔使用 JS 框架，而更多地专注于原生 JS。\n\n\
  等等，原生 JS？那是什么？现在让我们把注意力转向框架与无框架世界的比较。\n\n## JS 框架 vs 原生 JS\n\n\n\n\n什么是 vanilla\
  \ JS？简单来说，它指的是没有活跃框架的纯原生 JS。为了清晰起见，甚至可以将其称为“纯”JS，尽管这个术语常被视为用词不当——JS 中的框架并非杂质。\n\n\
  然而，不使用 JS 框架进行开发到底有什么好处呢？关于是否使用框架，有很多支持与反对的论点。例如，可以认为原生 JS 能让你更好地掌控项目，并按照你期望的方式精确地引导项目方向和表现。\n\
  \n对于高级且有经验的程序员来说，这或许确实如此。有时，对应用程序的控制确实非常可取，尤其是当你使用的框架具有高度主观性（如 Angular）时。使用原生 JS\
  \ 意味着你不受特定框架标准的约束，并且有更大的实验空间。\n\n不利的一面是，使用无框架的 JS 无疑会带来更陡峭且相对更困难的学习曲线。你无法访问框架的社区文献或文档。此外，对于完全初学者来说，遵循框架方法进行开发通常更容易，因为他们有现成的基础可以依赖。而在纯\
  \ JS 中，没有这样的便利。\n\n但以上几点都是相对次要的论点。支持 JS 框架的理由是，它们的最佳用途是在处理用户界面（UI）时。使用原生 JS 进行 UI\
  \ 开发通常很复杂，有时甚至令人困惑——随着本书章节的推进，当你接触到专门为此类任务设计的 JS 框架时，你会注意到没有这些框架的生活是多么艰难。\n\n而反对\
  \ JS 框架的最大论点是什么？如果你具备纯 JS 的实用知识，即使你依赖一组特定的框架，你也可以认为自己不受框架限制。想想看：如今，大量 jQuery 开发者正在学习并试图赶上\
  \ React 或 Angular。为什么会这样？因为后者越来越受欢迎。\n\n然而，对于不总是依赖单一框架的纯 JS 开发者来说，这种追赶更容易实现。你可以在\
  \ VueJS 或 Meteor 中构建应用，而无需精通这些框架，前提是你对 JS 本身有扎实的了解。\n\n因此，即使你使用 JS 框架，也建议你保持良好的\
  \ JS 能力，并花时间回头学习纯 JS。这实际上能确保你不局限于某个特定框架的特定标准，而是拥有更大的灵活性和成长空间。\n\n### 但如何做到这一点？\n\
  \n实际上相当简单。当你使用任何你选择的 JS 框架编写项目代码时，你也应该考虑问自己：如果不使用 JS 框架，等效的代码会是什么？更重要的是，如果该 JS 框架被另一个框架取代，你会怎么做？\n\
  \n在本书的某些章节中，我们将对比讨论代码示例，以便更好地理解差异，并更牢固地掌握纯 JS。在这个阶段，如果你刚接触 JS 世界，可能会觉得有些 daunting（令人生畏）。但一旦你理解了基础知识，从一个阶段过渡到另一个阶段就会非常容易。\n\
  \n现在我们已经讨论了很多关于 JS 框架的内容，可以安全地将注意力转向最后一个问题。\n\n## 为什么以及何时应该使用 JS 框架？\n\n至此，我们已经介绍了什么是框架、它们与\
  \ JS 库的区别，以及它们提供的优缺点。\n\n现在，进入更大的问题：为什么要使用 JS 框架？以及何时选择哪一个？\n\n“为什么”这部分应该更容易回答。我们已经介绍了\
  \ JS 框架能提供的许多好处——易用性、更平缓的学习曲线、更好的文档和支持、定期更新等。\n\n这意味着 JS 框架基本上是让生活更轻松的工具。就像艺术家会使用特定的颜色或画笔，仅仅因为它们适合他的艺术风格一样，程序员可能会使用某个\
  \ JS 框架，因为它适合他的编码风格并让生活更轻松。\n\n但更大的原因是 JS 框架可以节省时间和精力。问问自己，你更愿意：从头开始编写 150 行代码来完成一项任务？还是拥有一个现成的基础，借助它仅编写\
  \ 15 行代码就能完成同样的任务？使用 JS 框架，编程本身可以变得不那么繁琐。\n\n最后，这一点尤其适用于如果你是初级 JS 开发者——框架是由通常对语言及其能力了如指掌的\
  \ JS 专家开发、维护和管理的。这意味着对于新开发者来说，JS 框架可以作为手册或指南，鼓励他们编写更好、更干净的代码，并使用高效的调用和参数。\n\n通过确保符合编码标准和最佳实践，JS\
  \ 框架可以成为良好的学习标尺。自然，高效和标准化的编码实践意味着你的项目消耗更少的内存、运行更快、与多种浏览器和操作系统有更好的兼容性等等。没有糟糕或错误关闭的函数调用，也没有浪费系统资源和内存的参数。\n\
  \n事实上，正是因为这个原因，许多经验丰富的 JS 开发者也会依赖 JS 框架。有些人甚至更进一步，编写自己的 JS 框架，以便更好地利用系统资源并根据需求解决特定问题。\n\
  \n所以，如你所见，使用 JS 框架通常利大于弊。但在这个充满各种 JS 框架的混乱世界中，你何时该使用哪一个呢？\n\n最知名的两个是 Angular 和 React。它们在\
  \ JS 框架领域都非常有名，各自拥有忠实的追随者。本书中有专门章节介绍这两个框架，因此我们在此不深入细节。\n\n然而，Angular 更适合构建只需要一个模块框架来处理的\
  \ Web 应用程序。另一方面，React 更适合作为用于 UI 开发的同构 Web 框架。\n\n然后，根据项目的需求，你可以选择专门的 JS 框架。例如，如果你在处理游戏引擎或\
  \ 3D 场景，Babylon 就是你需要的 JS 框架。它将 WebGL 与 JS 结合，为你提供终极的 3D 游戏引擎兼框架。\n\n类似地，对于项目测试和渗透测试，PhantomJS\
  \ 或 Karma 是理想的选择。\n\n一个你可以参考的绝佳资源是 MicroJS。¹ 基本上，这是一个针对 JS 框架的“搜索引擎”。你只需输入你“需要”的内容，比如高度移动端特定的东西，或者用于异步编程的东西。甚至是你自己编写\
  \ JS 框架的能力！\n\n然后，MicroJS 会为你推荐一个可供选择的 JS 框架列表。这可以轻松帮助你筛选并找到所需内容，在一个高度饱和且拥挤的 JS\
  \ 框架世界中。\n\nMicroJS 是一个方便的资源，列出了大多数已知的小型 JS 框架和库。作为开发者，你可以利用它来发现和揭示一些很酷的 JS 框架和库，并在你的项目中使用它们！\n\
  \n## 结论\n\n在本章中，我们介绍了与 JS 框架相关的大量基础知识。现在，你应该了解以下内容：\n\n*   什么是 JS 框架？\n*   JS 框架与\
  \ JS 库有何不同？\n*   与 JS 框架相关的主要优缺点是什么？\n*   无框架的 JS 又是什么？\n\n\n\n\n为什么以及何时应考虑使用 JS\
  \ 框架，又该去哪里寻找它们？\n\n如今，由于市面上有无数 JS 框架，我们不可能逐一介绍。事实上，当你阅读本书时，很可能在你读完之前，又会有新的 JS 框架发布！\n\
  \n在接下来的章节中，我们为你整理了一些最实用、最通用的 JS 框架。每一章都专门介绍一个 JS 框架，并讨论其用途、安装与设置、工作流程和方法论等内容。\n\n\
  除此之外，我们还将尝试讨论每个 JS 框架最适合（以及可能不适合）的场景，以帮助你在 Web 项目中做出更明智的选择。\n\n我们将首先介绍三大 JS 框架——Angular、React\
  \ 和 VueJS。之后，我们会将注意力转向一些高度专业化的 JS 框架，然后进一步聚焦于有用的 JS 工具，以协助你的 JS 开发工作流程。\n\n下一章将讨论\
  \ Angular，这是一个由 Google 支持且非常流行的 JS 框架。值得注意的是，你可以选择使用自己偏好的集成开发环境（IDE）/代码编辑器来处理 JS\
  \ 框架项目。\n\n根据你的工作环境和设置，你可能需要安装一系列 JS 依赖项或库。例如，VueJS 要求你启用 Node.js 8 或更高版本。每个 JS\
  \ 框架的具体要求将在相应章节中说明。\n\n# 第 2 章 Node.js 入门\n\nDOI：[10.1201/9781003203711-2](https://doi.org/10.1201/9781003203711-2)\n\
  \n在本章中，我们将简要了解 Node.js 是什么、它通常做什么以及它对我们有何用处。如果你已经熟悉 Node，并且只想查找与其框架直接相关的信息，可以跳过本章。\n\
  \n## 什么是 Node.js？\n\nNode.js——浏览器之外的 JavaScript 代码执行环境。该平台允许你为动态网页和 Web 应用程序以及命令行程序编写服务器端代码。使用\
  \ Node.js 实现了“JavaScript 无处不在”的范式。它意味着使用单一编程语言开发 Web 应用程序，而不是在前端和后端使用不同的语言。Node.js\
  \ 是一个通过 V8 引擎处理 JavaScript 的服务器平台。\n\n使用 Node 更容易扩展。当数千名用户同时连接到服务器时，Node 会异步工作，即更合理地设置优先级并分配资源。例如，Java\
  \ 会为每个连接分配一个单独的线程。\n\nNode.js 非常适合开发能够实时响应用户操作的 RTA Web 应用程序。例如，它可以是一个像 Google Docs\
  \ 这样的在线编辑器，允许多个用户同时处理同一个文档。\n\nNode.js 能够轻松同时处理大量请求，并确保应用程序的性能。因此，服务器端 JavaScript\
  \ 常被用于创建在客户端进行渲染的 SPA（单页 Web 应用程序）。Netflix、Uber、eBay、Groupon、Yahoo 等知名组织和项目都在后端使用\
  \ Node.js。\n\nNode.js 并非一个能主宰 Web 开发世界的万能平台。相反，它是一个用于解决严格定义任务的平台。理解这一点至关重要。当然，你不应该将\
  \ Node.js 用于密集加载处理器的操作，而且，在重型计算中使用 Node.js 实际上会使其所有优势化为乌有。Node.js 真正擅长的是创建快速、可扩展的网络应用程序，因为它能够同时处理大量高带宽连接，这等同于高可扩展性。\n\
  \nNode.js“引擎盖下”的细节相当有趣。与传统的 Web 服务版本（每个连接（请求）都会生成一个新线程，消耗系统 RAM，并最终无痕地解析该内存）相比，Node.js\
  \ 要经济得多：它在单个线程中运行，对调用使用非阻塞 I/O，并支持数万个并发连接。\n\n## 什么是 JavaScript？\n\nJavaScript 是一种多范式编程语言，通常作为嵌入式工具用于以编程方式访问各种应用程序对象。从\
  \ Web 开发的角度来看，不了解这项技术就不可能创建现代交互式网站。JS 语言是“激活”页面标记（HTML）和网站用户功能（CMS）的关键。该语言允许页面或其单个元素对用户的操作做出反应。如今，JavaScript\
  \ 是浏览器的基础编程语言。它与 Windows、Linux、Mac OS 操作系统以及所有流行的移动平台完全兼容。\n\n## 简要历史\n\nNode.js\
  \ 平台于 2009 年推出。它由工程师 Ryan Dahl 创建，开发工作由 Joyent 赞助。该公司以支持开源项目而闻名，包括 Node.js、Illumos、SmartOS。\n\
  \nRyan Dahl 使用 V8 引擎创建了 Node.js。该平台采用低层非阻塞 I/O 模型实现，该模型基于事件驱动模型。\n\n2014 年底，平台主要开发团队之一的工程师\
  \ Fedor Indutny 创建了一个流行的 Node.js 分支——io.js。该分支的出现是由于开发者对 Joyent 公司政策的不满。\n\nio.js\
  \ 平台在性能上优于 Node.js。但该分支的创建者于 2015 年决定与 Node.js 重新合并，以影响主平台的发展。目前，开发工作由 Node.js 基金会正式管理。\n\
  \n## 为什么我们应该学习 Node.js？\n\n市场上已经见证了多家 Node.js 先驱公司的收购，包括 IBM 收购 StrongLoop、Red Hat\
  \ 收购 FeedHenry 以及 Progress Software 收购 Modulus。\n\nIT 行业专家指出，基于 JavaScript 的脚本语言是现代公司开发和交付应用程序的必备工具。\n\
  \nNode.js 几乎以前所未有的速度持续发展。在过去 5 年中，开发者向 Node.js（以及其他 JavaScript 库）添加了超过 190,000 个模块。这超过了整个\
  \ Perl CPAN 仓库（已编译 20 年），并且超越了 Java Maven Central，尽管 Node.js 的开发者数量较少。\n\n是什么让它在企业开发者中如此受欢迎？CIO\
  \ 们能否确信 Node.js 至少还会被积极使用 10 年？\n\n围绕核心的 Node.js 模块支持生态系统经历了强劲增长。Node 社区从 Node 包管理器（NPM）的存在中受益匪浅，它提供了一个共享模块的中央仓库。\n\
  \n这是 Node.js 灵活且易于使用方式的关键部分。它允许每个应用程序在其自己的依赖树中拥有所需的模块。因此，每个应用程序都可以拥有自己的一组模块，从而避免与其他应用程序的依赖冲突。\n\
  \n这是一个基于 Node.js 的灵活工具，使用 [npmjs.org](http://npmjs.org) 服务，导致公共模块数量显著增加，并且 [npmjs.org](http://npmjs.org)\
  \ 不仅成为服务器端 Node.js 的仓库，也成为客户端 JavaScript 模块的仓库。\n\n在 Node.js 开发的早期阶段，Netflix、Walmart、PayPal、Dow\
  \ Jones 和 Groupon 等公司就已经开始使用它。它们创建了内部团队，采用分而治之的方法使用 Node：将过去构建 Web 服务的“单体”方法分解开来。这使得它们能够快速开发和更新各种业务领域的解决方案，并立即将微服务部署到生产环境中。\n\
  \n\n\n\n## NODE.JS 成为主流\n\nNode.js 尤其适合那些拥有 Web 基础设施和移动应用的公司，这些应用的后端需要利用基于微服务构建的架构快速引入创新。这包括那些看似保守的组织，它们面临着既要开发能够适应商业世界快速变化的应用程序，又要维护现有系统稳定性和安全性的双重需求。\n\
  \n这些双重需求迫使 IT 团队改变思维方式。几乎所有公司都不得不找到快速响应业务软件需求的方法，同时维护当前变化频率较低的传统遗留代码。Node.js 是开发交互系统（如移动解决方案）的团队所使用的工具之一。\n\
  \nNode.js 常因其能够响应企业需求，并允许开发者以简单高效的方式构建具有 API 的应用程序而受到称赞，这些 API 可以访问后端和大量数据。事实上，将可复用的\
  \ RESTful API 作为构建大规模软件系统架构的更灵活方式这一重点，让 Node.js 找到了自己的位置。\n\nNode.js 能够在保持相同功能的同时显著缩短应用程序开发时间。约翰·K·奥斯特豪特（John\
  \ K. Ousterhout）曾帮助开发了重要的 Tcl/Tk 脚本语言和工具集，他在 1990 年代就提出，脚本编程语言本质上比 C 或 C++ 等更重的编程语言更具生产力。\n\
  \n与更重的技术栈相比，使用 Node.js 开发应用程序速度更快，而且随着 Node 生态系统的发展，这种速度只会越来越快。在这种情况下，值得花时间搜索 Node\
  \ 社区中已有的内容，并找出是否可以复用某些通用模块。\n\n在开发环境中，Node 受到非常友好的对待，并受到该技术专家的尊重。如果组织的 IT 结构中有团队使用\
  \ Node.js，那么开发人员的团结和士气就会得到提升。这被视为一个有趣且真正酷的机会。\n\nNode.js 非常适合基于微服务架构构建的应用程序，这得益于其低\
  \ CPU 消耗、处理能力以及对 RAM 的高效利用。这一优势在涉及 I/O 操作而非 CPU 使用的任务中尤为明显，因为 Node.js 执行模型的实现允许使用基于单线程执行模型的“轻量级”并行，无需复杂的并行编程技术。\n\
  \n综合所有这些——程序员的思维方式以及轻量级方法的各种技术优势——公司获得了一种新的解决 IT 问题的方法，其开发团队既有动力解决问题，又配备了高速工具集。\n\
  \n## NODE.JS 是为了什么而创建的？\n\nNode.js 不是一种独立的编程语言，而是一个在服务器端使用 JavaScript 的平台。如果谈论语言本身，那么前端和后端都使用相同的\
  \ JavaScript。唯一的区别在于前端和后端开发者所使用的 API 集合不同。\n\n基于浏览器的 JavaScript 使用 Web API，这些 API\
  \ 提供对页面和 Web 应用程序的 DOM 及用户界面的访问。服务器端的 JavaScript 使用提供对应用程序文件系统、HTTP 请求和流进行访问的 API。\n\
  \n也就是说，Node.js 是一种在后端使用 JS 的技术。JavaScript 语言的特性和发展前景可以在相关文章中找到，而这里我们讨论的是该语言的一种技术。\n\
  \n在编写通过网络进行通信的系统时，最困难的问题之一就是处理输入和输出。从网络、磁盘和其他设备读取和写入数据。移动数据需要时间，而正确规划这些操作会极大地影响系统对用户或网络请求的响应时间。\n\
  \n传统的输入输出处理方法假设一个函数（例如 ReadFile）开始读取文件，并且只有在文件完全读取后才停止工作。这被称为同步 I/O（输入/输出）。\n\n\
  Node 的构想是为了促进和简化异步 I/O 的使用。\n\nJavaScript 代码很容易适应 Node 类型的系统。它是少数几种没有内置 I/O 系统的语言之一。因此，JavaScript\
  \ 很容易嵌入到 Node 中相当独特的 I/O 方法中，并且不会产生两个不同的输入输出系统。在 2009 年开发 Node 时，人们已经在浏览器中使用基于回调的\
  \ I/O，因此该语言周围的社区已经习惯了异步编程风格。\n\n## NODE.JS 的主要特性\n\n让我们来看看 Node.js 的主要特性。\n\n###\
  \ 速度\n\nNode.js 最吸引人的特性之一就是速度。在 Node.js 环境中运行的 JavaScript 代码的速度可以是 C 或 Java 等编译型语言的两倍，并且比\
  \ Python 或 Ruby 等解释型语言快几个数量级。原因是该平台的非阻塞架构，具体结果取决于所使用的性能测试，但总的来说，Node.js 是一个非常快速的平台。\n\
  \n### 简单性\n\nNode.js 平台易于学习和使用。实际上，它相当简单，尤其是与其他一些服务器平台相比。\n\n### JavaScript\n\n\
  Node.js 环境执行用 JavaScript 编写的代码。这意味着数百万已经在浏览器中使用 JavaScript 的前端开发者可以用同一种编程语言编写服务器端和客户端代码，而无需学习全新的工具来转向服务器端开发。浏览器和服务器使用相同的语言概念。此外，在\
  \ Node.js 中，当新的 ECMAScript 标准在平台上实现时，可以快速切换到使用它们。为此，你不需要等待用户更新他们的浏览器，因为 Node.js\
  \ 是一个完全由开发者控制的服务器环境。因此，当你安装支持新语言特性的 Node.js 版本时，这些特性就可以使用了。\n\n### V8 引擎\n\nNode.js\
  \ 的核心（除其他解决方案外）是来自 Google 的开源 JavaScript 引擎 V8，该引擎用于 Google Chrome 和其他浏览器。这意味着 Node.js\
  \ 利用了数千名工程师的工作成果，他们使 Chrome 的 JavaScript 运行时变得极其快速，并继续致力于改进 V8。\n\n### 异步性\n\n在传统编程语言（C、Java、Python、PHP）中，所有指令默认都是阻塞的，除非开发者明确处理异步代码执行。因此，如果在这种环境中发出网络请求以下载某个\
  \ JSON 代码，那么发出请求的线程的执行将被挂起，直到收到并处理响应。JavaScript 使得使用单线程、回调函数和事件驱动的开发方法编写异步和非阻塞代码变得更加容易。每当我们需要执行一个繁重的操作时，我们都会将回调传递给相应的机制，该机制将在该操作完成后立即被调用。因此，你不需要等待这些操作的结果就可以继续工作。浏览器中也出现了类似的机制。我们无法承受等待（例如）AJAX\
  \ 请求结束而无法响应用户操作（如按钮点击）的代价。为了让用户舒适地使用网页，从网络加载数据和处理按钮点击等所有操作都必须实时同时进行。如果你曾经创建过按钮点击事件处理程序，那么你已经使用了异步编程技术。\n\
  \n\n\n\n\n异步机制使得单个 Node.js 服务器能够同时处理数千个连接，而无需程序员承担管理线程和组织并行代码执行的任务。这类任务往往是错误的根源。Node.js\
  \ 为开发者提供了非阻塞的基本 I/O 机制，并且通常，在 Node.js 环境中使用的库也是采用非阻塞范式编写的。这使得阻塞代码行为成为例外而非常态。\n\n\
  当 Node.js 需要执行 I/O 操作（例如从网络加载数据、访问数据库或访问文件系统）时，它不会阻塞主线程等待操作结果，而是启动该操作的执行，并继续处理其他事务，直到收到该操作的结果。\n\
  \n### 库\n\n得益于 Node.js 包管理器（称为 npm）的简便性和易用性，Node.js 生态系统蓬勃发展。如今，npm 注册表中已有超过 50\
  \ 万个开源包，任何 Node.js 开发者都可以自由使用。在了解了 Node.js 平台的一些主要特性后，让我们实际尝试一下。先从安装开始。\n\n## 最佳使用场景\n\
  \n我们来讨论一下探索 Node.js 的一些理由：\n\n1.  **实时应用：** 用户希望彼此实时互动。聊天、游戏、持续的社交媒体更新、协作工具、电子商务网站、实时追踪应用、市场——这些功能都需要用户、客户端和服务器之间通过互联网进行实时通信。构建实时应用颇具挑战性，因为它规模庞大，需要支持成百上千甚至数百万用户。客户端与服务器之间的实时通信需要快速且持续的\
  \ I/O。\n\n    Node.js 非常适合此类应用。使用 Node.js 的同步过程快速且有序，因为事件控制着同时服务于客户端和服务器端的架构。通过\
  \ WebSocket 协议的事件循环处理多用户功能。它基于 TCP 工作，避免了 HTTP 拥塞。Node.js 还使实时应用在软件开发方面变得轻量、可扩展、易于维护且用户友好。\n\
  \n2.  **低学习曲线：** 无论你在后端使用什么语言，前端仍然需要 JavaScript，因此与其花时间学习像 PHP、Java 或 Ruby on Rails\
  \ 这样的服务器端语言，不如将所有精力用于学习和掌握 JavaScript。同一种语言 JavaScript 既可用于客户端也可用于服务器端。因此，熟悉 JS\
  \ 的开发者无需学习其他语言就能担任全栈开发者。由于在两端统一使用该语言，界面和后端也更容易保持同步。\n\n    对于初创公司来说，这是用更少的开发者快速完成工作的一大优势。无需将团队分成两部分。这提供了更好的性能，以及共享或重新处理代码的能力，并在团队内部确保知识的顺畅交流。\n\
  \n3.  **性能与可扩展性：** Node.js 基于 Google 的 Chrome V8 引擎构建。这使得 Node 能够提供一个服务器端运行时环境，以闪电般的速度编译和执行\
  \ JavaScript。V8 引擎将 JavaScript 编译为机器码，而不是解释执行或作为字节码执行，这使 Node 非常快速。与 Java 或 C 相比，轻量级的\
  \ JavaScript 用更少的代码行就能实现高性能。Chrome V8 引擎也在不断更新，因为 Google 持续对其进行大量投入。\n\n    JavaScript\
  \ 快速执行的原因在于事件循环。在典型的采用阻塞 I/O 的应用服务器模型中，应用必须按顺序处理每个请求，挂起线程直到处理完成。这会使应用复杂化，当然也会拖慢应用速度。\n\
  \n    Node.js 支持事件循环，为你管理所有异步操作。这使你能够使用非阻塞 I/O，在这种模式下，线程（此处指顺序而非并行）可以管理多个请求。如果某个请求无法立即处理，它实际上会以“承诺”（Promise）的形式被“挂起”，意味着可以在稍后执行，而不会延迟其他线程。整个过程使开发者能够用更少的内存和资源管理更多操作。\n\
  \n    PayPal 在其应用中使用了 Node，他们发现应用创建速度提升了两倍，所需人员更少，代码行数减少了 33%，文件数减少了 40%。更重要的是，他们每秒处理的请求数翻了一番，平均响应时间降低了\
  \ 35%。因此，Node 是构建高度可扩展应用的绝佳选择。\n\n4.  **支持丰富模块的 NPM：** 很少有编程语言能像 Node.js 那样提供丰富的包生态系统。安装\
  \ Node.js 时，它会自动安装 NPM 程序。任何 Node.js 开发者都可以将其库和解决方案打包成模块，其他人可以使用官方 Node 包管理器 NPM\
  \ 安装该模块。成千上万的 JavaScript 开发库和工具都构建在 NPM 之上。在 Node.js 社区的持续支持下，NPM 致力于鼓励用户添加新包，因此针对特定问题你有多种现成的解决方案。\n\
  \n    迄今为止，它拥有超过 6 万个模块，并且每天都在增长。对于某些常见功能，使用这些模块而不是从头编写代码，难道不值得吗？Node 的这一强大特性降低了复杂性，使开发更简单、更快速，并允许你轻松共享、更新甚至重用代码。\n\
  \n5.  **统一的代码库优势：** 使用 Node，可以轻松地在服务器和客户端编码之间发送和同步数据。通过在两端使用相同的 JavaScript 语言，你的源代码将更清晰、更一致。你将使用相同的命名约定、相同的工具和相同的最佳实践。得益于这一特性，开发者的时间得到了极大节省。\n\
  \n6.  **数据流处理：** 就像数据结构中的数组一样，流是一组数据，处理这些数据需要一流的输入/输出数据处理技术。Node.js 在这方面表现出色，因为它处理\
  \ I/O 过程的方式允许用户在下载媒体文件的同时对其进行转码。与其他数据处理方法相比，处理数据所需的时间更少。Node.js 的流极大地简化了 I/O 任务。\n\
  \n    Node.js 使用四种类型的流——可写流、可读流、双工流和转换流，以及用于处理数据的 Pipe 方法。开发者可以充分利用这些特性，例如在上传文件时处理文件。Node.js\
  \ 的流允许应用在同时处理大量数据时消耗更少的内存，从而运行得更快。这一特性为实时处理音频或视频编码的开发者带来了更多优势。\n\n\n\n\n\n### 非常适合构建微服务：\n\
  \n正如我们之前所说，Node.js 具有高度可扩展性和轻量级特性，因此它是微服务架构的首选。简而言之，微服务架构意味着将应用程序拆分为独立且隔离的服务。这使得更新和维护架构更加容易，因为各个服务相互独立，你可以添加新服务或修复现有架构，而不会影响应用程序的其他部分。Node.js\
  \ 非常适合使用 Node 模块（Node.js 函数的构建块）来设计此类架构。得益于这种架构，应用程序可以独立开发、处理、运行和测试，从而避免了基础设施风险。这一特性还提供了在客户端和服务器端之间复用代码的能力，并且由于你只需考虑引入了哪些新服务或更新了哪些服务，因此还能缩短开发时间并降低成本。\n\
  \n### 强大的企业支持：\n\n2015 年，包括 IBM、微软、PayPal、Fidelity、SAP 在内的多家公司共同组建了 Node.js 基金会。这是一个独立的社区，旨在推动核心\
  \ Node.js 工具的发展。Node.js 基金会的成立是为了加速 Node.js 的发展，并确保其广泛传播。在生产环境中使用 Node.js 的组织数量持续增长，其中包括近三百家知名公司，如\
  \ Medium、Uber。\n\n让我们来看一些实际案例，在这些案例中，使用 Node.js 将是完美的解决方案。\n\n#### 对象数据库之上的 API\n\
  \n尽管 Node.js 在实时应用场景中表现尤为出色，但它也非常适合从对象数据库（例如 MongoDB）提供信息。以 JSON 格式存储的数据使得 Node.js\
  \ 函数无需进行格式匹配和数据转换即可正常工作。\n\n例如，如果你使用 Rails，则必须将 JSON 转换为二进制模型，然后在数据被 Backbone.js、Angular.js\
  \ 甚至常规的 jQuery AJAX 调用消费时，再通过 HTTP 将其作为 JSON 提供。而使用 Node.js，你可以直接通过 REST API 将 JSON\
  \ 对象提供给客户端，让客户端直接消费它们。此外，在读取数据库和写入数据库时（如果使用 MongoDB），你无需担心 JSON 与其他格式之间的转换。因此，你可以省去大量转换工作，使用一种通用的数据序列化格式，该格式在客户端、服务器端以及数据库中均可使用。\n\
  \n#### 聊天\n\n聊天是最典型的实时多用户应用程序。从 IRC（那是很久以前的事了）使用各种开放协议并通过非标准端口运行，到如今，一切都可以在 Node.js\
  \ 上实现，使用通过标准 80 端口运行的 Web Socket。\n\n聊天程序确实是使用 Node.js 的理想产品：它是一个轻量级、高流量、数据密集型（但几乎不涉及计算密集型）的应用程序，运行在各种分布式设备上。此外，用它来学习也非常方便，因为尽管它很简单，但它涵盖了在典型\
  \ Node.js 应用程序中可能需要使用的大部分范式。\n\n让我们试着弄清楚它是如何工作的。\n\n在最简单的情况下，我们的网站上有一个聊天室，用户进入后以“一对多”（实际上是“对所有用户”）模式交换消息。假设我们的网站上有三位访客，他们都可以在我们的论坛上写消息。\n\
  \n在服务器端，我们有一个简单的 Express `application.js`，它实现了两件事：(1) 一个 `GET \"/\"` 请求处理程序，用于提供包含消息论坛和“发送”按钮的网页，该按钮用于初始化新输入的消息；(2)\
  \ 一个 Web Socket 服务器，用于监听 Web Socket 客户端发出的新消息。\n\n在客户端，我们有一个 HTML 页面，配置了两个处理程序：一个监听“发送”按钮的点击事件，该事件获取输入的消息并通过\
  \ Web Socket 发送出去；另一个监听客户端上新的传入消息，以便为 Web Socket 提供服务（即其他客户端发送的消息，服务器将使用这个特定客户端来显示这些消息）。\n\
  \n以下是其中一个客户端发送消息时发生的情况：\n\n浏览器使用 JavaScript 处理程序捕获“发送”按钮的点击，从输入字段中获取值（即消息文本），并通过连接到我们服务器的\
  \ Web Socket 客户端（该客户端与网页一起初始化）输出一条 Web Socket 消息。\n\nWeb Socket 连接的服务器组件接收消息，并使用广播方法将其转发给所有其他已连接的客户端。\n\
  \n所有客户端通过网页上运行的 Web Socket 组件接收新的推送消息。然后，它们获取消息内容并更新网页，在论坛中添加一条新帖子。\n\n这是一个最简单的例子。对于更可靠的解决方案，你可以使用基于\
  \ Redis 存储的简单缓存。更高级的解决方案是消息队列，它允许处理到客户端的消息路由，并提供更可靠的传递机制，从而能够补偿临时的连接中断，或者在注册客户端离线时为其存储消息。但无论你进行何种优化，Node.js\
  \ 仍将遵循相同的基本原则：响应事件、处理多个并发连接，并保持流畅的用户交互。\n\n#### 输入队列\n\n如果你收到大量并发数据，数据库可能会成为瓶颈。如上所述，Node.js\
  \ 本身可以轻松处理并发连接。但由于访问数据库是一个阻塞操作（在这种情况下），我们会遇到问题。解决方案是在数据实际写入数据库之前捕获客户端的行为。\n\n使用这种方法，即使在高负载下也能保持系统的响应能力，这在客户端不需要确认数据写入成功时尤其有用。典型的例子：日志记录或用户活动数据记录（用户跟踪），这些数据批量处理且后续不再使用；需要即时反映的操作（例如更新\
  \ Facebook 上的“点赞”数），其中最终一致性是可以接受的，因此在 NoSQL 世界中经常使用。\n\n数据通过专门用于缓存和处理消息队列的基础设施（例如\
  \ RabbitMQ、ZeroMQ）进行排队，并由一个专为批量写入而设计的独立数据库进程，或由专为密集计算而设计的特殊数据库接口服务进行消化。类似的行为也可以使用其他语言/框架实现，但需要在不同的硬件上，并且无法达到如此高且稳定的吞吐量。\n\
  \n简而言之，Node 允许你将数据库写入操作推迟到稍后执行，同时继续以与这些写入操作已成功完成相同的方式工作。\n\n#### 数据流\n\n在更传统的 Web\
  \ 平台上，HTTP 请求和响应被视为孤立的事件；但实际上它们是流。这一点可以在 Node.js 中用来创建一些很酷的功能。例如，你可以在文件仍在上传时对其进行处理，因为数据是以流的形式传入的，我们可以实时处理它们。例如，在实时编码视频或音频时，或者在多个不同数据源之间设置代理时（更多信息请参见下一节），都可以这样做。\n\
  \n#### 代理\n\nNode.js 可以用作服务器代理，在这种情况下，它可以以非阻塞模式处理大量并发连接。这在协调具有不同响应时间的多个服务之间，或者从多个来源收集数据时尤其有用。\n\
  \n\n\n\n\n例如，考虑一个与第三方资源交换信息、从各种来源收集数据，或存储图片和视频等资源（随后提供给第三方云服务）的服务器应用。\n\n尽管有专门的代理服务器，但使用\
  \ Node 会更方便，尤其是在代理基础设施不存在，或者你需要一个本地开发解决方案的情况下。这里我的意思是，可以创建一个客户端应用，其中 Node 开发服务器将作为\
  \ `applied.js`，我们将在其中存储资源并为 API 请求制作代理/桩，而在实际环境中，此类交互将使用专门的代理服务（如 nginx、HAProxy\
  \ 等）来完成。\n\n#### 应用监控仪表盘\n\n这是另一个“Node+Web Socket”模型非常适用的实际案例。在这里，我们跟踪网站访问者并实时可视化他们的交互（如果你对这个想法感兴趣，它已经通过\
  \ Hummingbird 得到了解决）。\n\n你可以实时收集用户统计数据，甚至可以通过添加与用户的目标交互来提升一个层次，一旦访客到达你漏斗中的特定节点，就打开一个通信渠道（如果你对这个想法感兴趣，它已经通过\
  \ CANDDi 得到了解决）。\n\n想象一下，如果你能实时了解用户正在做什么，并可视化他们的交互，你的业务将得到怎样的优化。双向的 `Node sockets.js`\
  \ 为你提供了这样的机会。\n\n#### 系统跟踪信息面板\n\n现在我们来谈谈基础设施方面。假设有一个 SaaS 提供商，希望为用户提供一个服务跟踪页面（比如\
  \ GitHub 的状态页面）。有了 `Node event loop.js`，你可以创建一个强大的 Web 界面，其中服务状态将被实时异步检查，并通过 Web\
  \ Socket 将数据发送到客户端。\n\n这项技术允许你实时报告内部（企业内）和公共服务的状态。让我们稍微扩展一下这个想法，试着想象一个网络运营中心（NOC），它监控着电信运营商、云服务提供商/托管提供商或某个金融机构的应用运行情况。这一切都基于\
  \ Node.js 和 Web Socket 的开放 Web 技术栈，而不是 Java 和/或 Java 小程序。\n\n#### 股票交易仪表盘\n\n让我们回到应用层。另一个\
  \ PC 软件占主导地位，但很容易被基于 Web 的实时解决方案取代的领域是股票交易软件，其中需要跟踪报价、进行计算和技术分析、绘制折线图和柱状图。\n\n如果在这种情况下使用实时\
  \ Web 解决方案，使用它的经纪人将能够轻松地在不同工作站或地点之间切换。\n\n## 开始学习 NODE.JS 需要具备哪些 JAVASCRIPT 知识？\n\
  \n假设你刚刚开始编程。你需要多深入地学习 JavaScript 才能成功掌握 Node.js？对于初学者来说，要达到对自己的专业技能有足够信心的水平是很困难的。此外，在学习编程的过程中，你可能会感到不清楚浏览器端的\
  \ JavaScript 在哪里结束，而 Node.js 的开发又从哪里开始。如果你正处于 JavaScript 编程的起步阶段，那么在编写 Node.js 代码之前，请先熟练掌握以下语言概念：词法结构、表达式、类型、变量、函数、箭头函数、循环、作用域、数组、模板字符串、严格模式。\n\
  \n实际上，这个列表还可以继续列下去，但如果你掌握了所有这些，就意味着你为在 JavaScript 中进行高效的客户端和服务器端开发打下了良好的基础。\n\n\
  ## 哪些知名公司使用 NODE.JS？\n\n鉴于使用 Node.js 的诸多好处，很容易相信使用这项技术的大公司名单中包括 NASA、Uber 和 Twitter。谁在使用\
  \ Node.js，他们为什么选择转向 Node.js，以及结果如何？\n\n### NASA\n\nNASA 是世界上最著名的组织之一。在一次险些造成致命后果的事件之后，NASA\
  \ 决定转向 Node.js。该事件的原因是多个节点之间数据存储效率低下导致访问时间过长。NASA 的开发人员认为，将数据迁移到云数据库以减少访问时间非常重要。此外，NASA\
  \ 的大部分应用都是用 JavaScript 编写的。\n\n### Trello\n\nTrello 是一个项目管理工具，被广泛应用于各个行业和国家。这样的平台需要即时、无延迟的实时更新，这就是\
  \ Trello 成为在服务器端使用 Node.js 的公司之一的原因。Trello 需要管理多个实时服务器连接，以确保更新能够顺畅且准时地交付。\n\n###\
  \ LinkedIn\n\n另一家使用 Node.js 的公司是 LinkedIn，这是最大的商业和就业社交平台。它的受欢迎程度逐年快速增长。从 Ruby on\
  \ Rails 切换到 Node.js 后，该公司创建了一个比旧版本快十倍的应用。这一决定是由于 Ruby 中的同步问题导致加载时间增加，尤其是在流量增长时。\n\
  \n### Twitter\n\n超过 80% 的 Twitter 账户所有者通过智能手机访问。因此，该公司决定创建 Twitter Lite——一个功能最小化、即使在网络连接不佳的情况下也能正常工作的应用。此外，Twitter\
  \ 的网页版并未针对不良连接条件进行优化。所有这些都导致 Twitter 成为使用 Node.js 的公司之一。\n\n## 安装与设置\n\n安装 Node\
  \ 软件 `platform.js`，以便让 JavaScript 能够通过其 API 与 I/O 设备交互，并连接各种外部库。\n\n### 在 Windows\
