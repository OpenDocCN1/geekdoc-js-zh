  \n*   **Google+ 上的 Polymer：** [`plus.google.com/​107187849809354688692/`](http://plus.google.com)\n\
  \n关于 Polymer 的内容就到这里！在下一章中，我们将重点介绍 MeteorJS，这是另一个用于快速原型开发的免费、开源、同构的 JS 框架。\n\n#\
  \ 第 5 章 Meteor\n\nDOI：[10.1201/​9781003203711-5](https://doi.org/10.1201/9781003203711-5)\n\
  \n承接上一章，本章我们将把注意力转向另一个流行的 JavaScript 框架。Meteor 的口号是“用 JavaScript 构建应用”，它可能是一个 JavaScript\
  \ 框架所能做到的最直接的了。\n\n但不要被简单的介绍所迷惑！\n\nMeteor 是一个功能强大且高度通用的 JavaScript 框架，能够处理任何规模的复杂项目。它可以很好地与自定义组件（如\
  \ React 组件等）协同工作。此外，它提供了非常简单的应用结构，我们只需分别修改客户端文件和服务端文件。\n\n还需要更多吗？Meteor 已经拥有经过验证的记录，并已被用于构建各种流行的、企业级的应用。\n\
  \n## 引言\n\n既然我们已经确定 Meteor 在 JavaScript 框架领域并非等闲之辈，那么让我们首先对 Meteor 本身进行介绍性了解。\n\n\
  ### 什么是 Meteor？\n\n用纯粹的教科书术语来说，Meteor 是一个简单、开源的 JavaScript 框架，用于构建动态、现代的 Web 应用。它支持最新的\
  \ JavaScript 编码标准，并与流行的开源库良好集成。\n\n考虑到 Meteor 与各种其他开源库和框架集成，它适用于多种用途。学习曲线本身并不陡峭，而且\
  \ Meteor 拥有强大的代码库，可以轻松处理更大的项目。\n\nMeteor 经常用于大型商业项目。除此之外，React 或 Angular 开发者可能会发现\
  \ Meteor 更易于学习、使用和部署，尤其是当它与 Angular 或 React 组件同步使用时。\n\n### Meteor 有何特别之处？\n\nMeteor\
  \ 的最大卖点在于其简单的架构和相当直接的操作方式。依赖项列表几乎可以忽略不计，Meteor 甚至自带 `npm`，从而确保尚未预装 `npm` 的环境仍然可以通过\
  \ `npm` 进行包安装。\n\n需要注意的是，为了调用 Meteor 捆绑的 `npm` 版本，我们需要使用的命令是 `meteor npm`。\n\n另一方面，要调用全局\
  \ `npm` 版本（假设我们已在系统上安装），我们只需使用命令 `npm`。\n\n其余命令和参数保持不变。例如，要使用全局 `npm` 命令安装 lodash\
  \ 模块，我们将执行：\n\n而使用 Meteor 捆绑的 `npm` 版本安装相同模块时，我们将执行如下命令：\n\n\n\n\n但究竟有什么区别呢？好吧，如果某个环境尚未安装\
  \ `npm`，这可以为我们节省一点时间。此外，如果我们热衷于添加具有二进制依赖并调用原生 C 代码的 Node.js 模块，使用捆绑的 `npm` 版本就很重要（使用捆绑的\
  \ `npm` 版本可以确保这些模块使用相同的库进行编译）。\n\n但这并不是 Meteor 与众不同的唯一之处。Meteor 的另一个特殊之处在于它依赖于一个集成的\
  \ JavaScript 栈，可以确保我们用最少的代码行完成大量执行工作。换句话说，使用 Meteor 可以节省大量时间，同时还能提升最终用户体验，因为我们可以完全控制应用程序的各个方面。\n\
  \n### 优点\n\n与 Meteor 相关的最明显优势是它对初级开发人员来说相对易于使用。即使我们的系统上没有 `npm`，或者不熟悉复杂的安装过程，Meteor\
  \ 在设置和安装方面也相当简化。\n\n除此之外，Meteor 让我们能够构建各种应用程序，这些应用可以在任何类型的设备上运行。无论是 iOS、Android\
  \ 还是桌面端，Meteor 应用都能在所有平台上无缝且完美地运行。\n\n我们已经讨论过使用 Meteor 如何节省时间和精力。事实上，由于其易用性和对开发时间的低压力，Meteor\
  \ 在短时间内就成为 JavaScript 框架领域的热门选择。像 QualComm 和 IKEA 这样的公司已经转向使用 Meteor 来为其内部和面向客户的平台开发和部署多功能且强大的\
  \ Web 应用。\n\n与 Meteor 相关的另一个好处是它能够很好地集成并与其他各种库和 JavaScript 框架协同工作。需要包含 Angular 或\
  \ React 的组件？Blaze 怎么样？是的，Meteor 支持所有这些！Meteor 还与 MongoDB、Vue 甚至 Apache Cordova 等集成！\n\
  \n### 缺点\n\n我们已经详细讨论了 Meteor 的优点，但它是否有任何明显的缺点呢？\n\n大多数情况下，Meteor 并没有开发者通常担心的那么多缺点。然而，开箱即用缺乏服务器端渲染意味着最终构建的\
  \ Web 应用在 SEO 方面不会很友好。当然，我们可以选择使用自定义插件或从我们这边添加服务器端渲染以实现搜索引擎优化和速度相关目的，但 Meteor 本身并没有内置任何此类功能。\n\
  \n在构建复杂应用时，几乎没有什么空间可以完全只依赖 Meteor。开发者往往发现自己不得不导入自定义组件和库，然后在 Meteor 中使用它们。当然，这算不上什么负面因素，但对于内心追求纯粹的人来说，仍然值得注意。\n\
  \n## 如何使用？\n\n现在我们已经了解了 Meteor.js 是什么，让我们看看它的实际应用。但在进一步操作之前，我们首先需要安装 Meteor.js。\n\
  \n### 安装 Meteor.js\n\n安装 Meteor.js 相当容易。在这个阶段，你可能已经熟悉了 JavaScript 框架的安装。因此，Meteor\
