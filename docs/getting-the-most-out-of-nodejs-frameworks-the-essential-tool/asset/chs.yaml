  \ Yarn 安装，请输入以下命令：\n\n## 异步编程\n\n\n\n\nJavaScript 本身是一种同步、单线程的编程语言。这意味着你无法在代码中创建并行运行的新线程。然而，计算机本质上是异步的。也就是说，某些操作可以独立于程序执行的主线程进行。在现代计算机中，每个程序都会被分配一定的处理器时间，当这段时间用完时，系统会将资源分配给另一个程序，同样持续一段时间。这种切换是循环进行的，而且速度极快，以至于人类根本无法察觉，结果我们以为自己的计算机同时运行着许多程序。但这只是一种错觉（如果不考虑多处理器机器的话）。\n\
  \n在程序内部，会使用中断——即发送给处理器的信号，用于吸引系统的注意。我们不会深入细节，最重要的是要记住，异步行为——即程序执行被挂起，直到它需要 CPU 资源的那一刻——是完全正常的。当程序不占用系统工作时，计算机可以处理其他任务。例如，在这种方法中，当程序等待其发出的网络请求的响应时，它不会阻塞处理器，直到收到响应。\n\
  \n通常，编程语言是异步的，其中一些语言允许程序员通过使用内置语言工具或专门的库来管理异步机制。这里指的是诸如 C、Java、C#、PHP、Go、Ruby、Swift、Python\
  \ 等语言。其中一些语言允许你使用线程、启动新进程来以异步风格进行编程。\n\n### JavaScript 中的异步\n\n如前所述，JavaScript 是一种单线程同步语言。用\
  \ JS 编写的代码行按照它们在文本中出现的顺序依次执行。例如，下面是一个相当常见的 JS 程序，演示了这种行为：\n\n但 JavaScript 是为在浏览器中使用而创建的。它最初的主要任务是组织与用户活动相关的事件处理。例如，诸如\
  \ `onClick`、`onMouseOver`、`onChange`、`onSubmit` 等事件。如何在同步编程模型的框架内解决这些问题？答案在于 JavaScript\
  \ 运行的环境。\n\n也就是说，浏览器通过向程序员提供相应的 API 来有效解决这些问题。在 Node.js 环境中，有用于执行非阻塞 I/O 操作的工具，例如处理文件、组织网络数据交换等。\n\
  \n### 回调函数\n\n如果谈论基于浏览器的 JavaScript，可以注意到你无法提前知道用户何时点击某个按钮。为了确保系统对此类事件做出响应，需要为其创建一个处理程序。事件处理程序接受一个函数，该函数将在事件发生时被调用。它看起来像这样：\n\
  \n这样的函数也被称为回调函数或回调。回调是一个普通函数，作为值传递给另一个函数。它只会在事件发生时被调用。JavaScript 实现了头等函数的概念。这样的函数可以赋值给变量，并传递给其他函数（称为高阶函数）。在客户端\
  \ JavaScript 开发中，一种常见的方法是将所有客户端代码包装在 window 对象的 `load` 事件监听器中，该监听器在页面准备好工作后调用传递给它的回调：\n\
  \n回调无处不在，不仅用于处理 DOM 事件。例如，我们已经在定时器中见过它们的使用：\n\n### 回调中的错误处理\n\n我们来谈谈如何处理回调中的错误。有一种常见的错误处理策略，也用于\
  \ Node.js。它在于任何回调函数的第一个参数都是一个错误对象。如果没有错误，该参数将被赋值为 `null`。否则，将有一个包含错误描述及其附加信息的错误对象。如下所示：\n\
  \n### 什么是“Promise”？\n\n从 ES6 标准开始，JavaScript 引入了新特性，使得编写异步代码更加容易，从而可以避免使用回调。这里指的是\
  \ ES6 中出现的 Promise，以及 ES8 中引入的 `async/await` 结构。\n\nPromise 是在 JavaScript 中处理异步程序结构的一种方式，总体上减少了回调的使用。\n\
  \nPromise 通常被定义为某些预期在未来出现的值的代理对象。Promise 也被称为“承诺”或“承诺的结果”。尽管这个概念已经存在多年，但 Promise\
  \ 直到 ES2015 才被标准化并添加到语言中。ES2017 引入了基于 Promise 的 `async/await` 结构，可以视为 Promise 的便捷替代品。因此，即使你不打算使用普通的\
  \ Promise，理解它们的工作原理对于有效使用 `async/await` 结构也很重要。\n\n调用 Promise 后，它会进入待定状态。这意味着调用\
  \ Promise 的函数继续执行，同时在 Promise 内部进行一些计算，之后 Promise 会报告结果。如果 Promise 执行的操作成功完成，则 Promise\
  \ 进入“已完成”状态。这样的 Promise 被称为成功解决。如果操作失败，则 Promise 进入“已拒绝”状态。\n\n### 什么是 Async/Await\
  \ 结构？\n\n`async/await` 结构代表了异步编程的现代方法，简化了异步编程。异步函数可以看作是 Promise 和生成器的组合，总体而言，这种结构是对\
  \ Promise 的抽象。\n\n`async/await` 结构允许减少在使用 Promise 时必须编写的样板代码量。当 Promise 在 ES2015\
  \ 标准中出现时，它们旨在解决创建异步代码的问题。它们完成了这个任务，但在 ES2015 和 ES2017 标准发布之间的两年里，人们发现它们不能被视为问题的最终解决方案。\n\
  \nPromise 解决的问题之一是著名的“回调地狱”，但它们解决了这个问题，同时也产生了自己类似性质的问题。\n\nPromise 是简单的结构，可以围绕它们构建语法更简单的东西。结果，时机成熟时，`async/await`\
  \ 结构出现了。使用它编写的代码看起来像是同步的，但实际上是异步的，特别是不会阻塞主线程。\n\n### 在 Node.js 中生成事件\n\n如果你在浏览器中使用过\
  \ JavaScript，就会知道事件在处理用户与页面的交互中扮演着重要角色。这里指的是处理由鼠标点击和移动、键盘按键等引起的事件。在 Node.js 中，可以处理程序员自己创建的事件。你可以使用\
  \ `events` 模块创建自己的事件系统。具体来说，该模块提供了 `EventEmitter` 类，可以利用其功能来组织事件处理。在使用此机制之前，需要先引入它：\n\
  \n在使用时，我们可以使用 `on()` 和 `emit()` 等方法。`emit` 方法用于触发事件。`on` 方法用于配置回调，即当特定事件被触发时调用的事件处理程序。\n\
  \n至此，我们在 Node 编程方面已经覆盖了相当多的内容。我们现在熟悉了许多常见的 Node 框架、Node 模块，以及异步编程和服务器端扩展等概念。\n\n\
  \n\n\n因此，我们现在可以开始学习更多的 Node.js 框架，并深入了解其中一些最重要的框架。\n\n# 第 4 章 Polymer\n\nDOI：[10.1201/​9781003203711-4](https://doi.org/10.1201/9781003203711-4)\n\
  \n既然我们已经掌握了 Node.js 的基础知识，是时候将注意力转向其他内容了。在本章中，我们将重点介绍 Google Polymer，这是一个创新且非常实用的\
  \ JavaScript（JS）库，自诞生以来其受欢迎程度一直在上升。\n\n本质上，Polymer 本身并不是一个主流的“框架”。相反，它是一个 JS 库。但就像\
  \ JS 框架一样，Polymer 也主要围绕数据封装和可重用性展开，我们将在本章中很快看到这一点。这意味着 Polymer 在现代 Web 应用程序中可以找到很好的应用和用途，尤其是在目标是节省开发时间的情况下。\n\
  \nPolymer 采用 3-Clause BSD 许可证，并且自然是完全开源的。它被广泛的 Google 服务和应用程序以及许多其他项目所使用。\n\n在进一步深入之前，我们必须先了解\
  \ Polymer 能实现什么以及它是如何工作的。之后，我们将开始安装、设置和使用。\n\n## POLYMER 简介\n\n介绍 Polymer 并不是一项复杂的任务，即使是最基础的\
  \ JS 编码人员也能快速掌握其基本概念。这是因为与那些大型 JS 框架不同，Polymer 专注于一组特定的任务，而不是众多的目标和任务。\n\n### 什么是\
  \ Polymer？\n\n正如我们上面提到的，如果按照教科书定义，Polymer 是一个 JS 库，而不是一个完整的 JS 框架。然而，它的运作方式和目的与\
  \ JS 框架高度重叠，因此通常被归入 JS 框架的范畴。\n\nPolymer 由 Google 以及一群忠实的用户社区维护和管理。\n\n广义上讲，Polymer\
  \ 用于使用 Web Components 作为底层工具来开发 Web 应用程序。那么，这些 Web Components 是什么呢？\n\n以下是 Polymer\
  \ GitHub 页面描述 Web Components 的方式：¹\n\n> Web Components 是一组极其强大的新原语，内置于 Web 平台中，为前端代码的组件化以及轻松创建强大、沉浸式、类似应用程序的\
  \ Web 体验开辟了一个全新的可能性世界。\n\n但这并没有说得很清楚，对吧？\n\n让我们这样理解。Web Components 是可重用的元素或元素块，你可以在\
  \ Web 应用程序和项目中使用它们。因此，你不需要从头开始或从零开始编写所有代码。你可以导入并重用现有的 Web Components 来执行项目中的常见任务，然后进一步编写额外的功能以满足你的需求。这显然可以节省你的开发时间和精力，并简化整个开发过程。\n\
  \n现在，是不是很清楚为什么 Polymer 的功能与 JS 框架的功能重叠了？尽管 Polymer 是一个真正的 JS 库，但它不仅提供代码块，还提供一整套“组件”，你可以围绕这些组件构建应用程序和项目，从而帮助你节省时间。换句话说，你可以将\
  \ Polymer 提供的 Web Components 视为乐高积木或宜家家具，它们有各种形状、尺寸和变体，但主要目的保持不变：帮助你根据需求组装和拼凑东西。\n\
  \n事实上，JS 开发者将 Polymer Web Components 与 Vue.js、React 甚至 Angular 结合使用的情况并不少见。实际上，Polymer\
  \ 与大多数其他现代 JS 库和框架都能很好地配合，其代码的可重用性在构建复杂项目时非常有用。\n\n此时，或许有必要提及 Web Components 的一些主要特性：\n\
  \nPolymer 中的 Web Components 类似于 HTML 导入，就像我们习惯在主题或模板中导入 CSS 样式表一样。\n\n如果你想知道，是的，你可以编写和构建自己的\
  \ Web Components。事实上，自定义 Web Components 经常在 Polymer 社区中被开发者重用和分享。\n\n了解 Polymer\
  \ 中的 Shadow DOM 也很有价值。作为 JS 开发者，你可能已经了解 DOM 的概念。Shadow DOM 会在你现有的 DOM 中插入一个新节点；然后它在你的\
  \ DOM 和新节点之间创建一个边界。\n\nShadow DOM 有什么用？假设我们有一个自定义的 Web Component 元素，它使用了自身的 CSS\
  \ 样式。现在，如果我们希望在同一项目或其他项目中重用该元素，会发生什么？CSS 样式有可能被新项目的样式覆盖。为了避免这种情况，Shadow DOM 用于封装我们样式和脚本结构的部分或全部，以便元素和组件的样式或脚本不受新项目的影响。\n\
  \n你可以在 [`www.webcomponents.org/`](https://www.webcomponents.org) 找到各种 Web Components。其中许多与\
  \ Polymer 相关，而许多则不是。这表明 Web Components 并非 Polymer 独有，尽管在 JS 世界中，Polymer 是使用它们的一个相当流行的选择。\n\
  \n现在我们已经了解了 Polymer 是什么以及它如何通过 Web Components 工作，是时候了解更多关于它的特殊功能了。\n\n### Polymer\
  \ 有何特别之处？\n\nPolymer 最大的卖点或许是它允许你创建自己的 HTML 元素，然后你可以在复杂的应用程序和项目中使用这些元素。这意味着你的应用程序更易于维护且完全可扩展，因为你可以修改\
  \ Web Components 和 HTML 元素以满足你的需求。\n\n换句话说，你不需要严重或完全依赖脚本和标记。相反，重点转向了 Web Components\
  \ 的声明式使用——只需声明你希望在项目中使用的（或重用的）组件或元素，就完成了。凭借 Polymer 提供的抽象和封装级别，它非常适合主流的日常使用。\n\n\
  这就是 Polymer 与其他 JS“库”（例如 jQuery）真正不同的地方。没有自定义要求专注于一组给定的脚本或类似实体。Polymer 相信利用当今 Web\
  \ 浏览器客户端提供的原生技术。\n\n为了更好地理解这个概念，假设你已经用 Polymer 构建了一个应用程序。现在，如果这个应用程序是用其他 JS 库编写或构建的，你将如何使用它？你可能需要转换该应用程序以使其适用于其他库，或者导入大量依赖项。但在\
  \ Polymer 中，你的应用程序只不过是一个元素。因此，你可以通过将其导入到你选择的任何项目（例如一个 HTML 页面）中并为其添加标签来简单地使用它。\n\
  \n这就是 Polymer 的特别之处。无论你的 Polymer 应用程序有多复杂，归根结底，它只是你导入到页面中的另一个元素。你可以轻松访问它们的属性和方法，甚至在其他框架或库中也是如此。更重要的是，你可以使用\
  \ Polymer 创建整个复杂的应用程序，甚至将它们作为 HTML 元素使用。\n\nPolymer 与大多数其他元素库完全兼容。因此，与 JS 框架非常相似，Polymer\
  \ 也不会带来兼容性问题，并且可以根据其结构和范式无缝工作。\n\n### Polymer 的主要优缺点\n\n现在我们已经了解了 Polymer 带来的特殊功能，是时候了解它的一些优缺点了。\n\
  \n#### 优点\n\n*   如上所述，Polymer 最大的优点是通过为项目提供可重用的 Web Components 来节省开发时间和精力。\n\n*\
  \   使用 Polymer 创建自定义元素非常容易，即使是新手 JS 开发者也能在短时间内掌握。\n\n\n\n\n\n*   Polymer 支持条件模板以及\
  \ Shadow DOM，从而为你的项目提供更好的封装和抽象，并更轻松地控制整体工作流程。\n\n*   Polymer 支持手势事件以及计算属性。事实上，在本章末尾讨论一些使用\
  \ Polymer 的主要应用和现有项目时，你会明显发现 Polymer 提供了你可能从 Web 组件库中需要的所有花哨功能。\n\n*   Polymer 支持单向和双向数据绑定模型。不过，最近（2018\
  \ 年 5 月）有消息称，未来将逐渐转向单向数据绑定，而不再强调双向数据绑定。\n\n考虑到使用 Polymer 创建的自定义元素可重用且与其他框架或开发实践兼容，因此在现有项目中采用\
  \ Polymer 相当直接。到目前为止，这是 Polymer 最大的优势。由于可重用 Web 组件的概念，它本身具有普遍的吸引力。\n\n#### 缺点\n\n\
  关于 Polymer 的缺点，能说的并不多。然而，它并非没有自己的注意事项：\n\n*   对于大多数编码人员或用户来说，这已不再是缺点。但是，如果你的目标受众依赖原始浏览器或过时的技术，Polymer\
  \ 可能会使你的项目与之不兼容。真正的问题在于，通过将所有内容实现为标签内的 HTML 元素，Polymer 消除了导入大量脚本的需求。然而，这也意味着给 Web\
  \ 浏览器带来了很大负担。对于现代 Web 浏览器来说，这完全不是问题，一切运行流畅。但对于较旧的 Web 浏览器，有时这种负担可能过大。这也适用于现代的“轻量级”Web\
  \ 浏览器。\n\n*   近年来，文档和支持教程已经有了很大进步，但 Polymer 的文档仍然无法与 Vue.js 甚至 Aurelia 等框架相比。事实上，Polymer\
  \ 的官方文档有时确实会让一些用户感到困惑。\n\n*   Polymer 足够轻巧，不会出现任何重大性能问题。话虽如此，在某些移动平台上（尽管是知名度较低的平台，例如三星的\
  \ Tizen），Polymer 的 Web 组件需要一定时间才能加载。即使一切按计划进行，你仍然会在网页上看到一些不合适的空白区域，或者在加载期间看到空白页面。\n\
  \n人们经常争论说，Polymer 在桌面 Web 浏览器客户端上运行完美，但在移动 Web 浏览器客户端上却举步维艰。如果你依赖内存有限的移动设备，这一点会更加明显。\n\
  \n渲染 Polymer 元素可能会给移动 Web 浏览器带来内存压力，如果你同时尝试多任务处理，页面冻结可能会变得很常见。尝试在内存较低的设备上的移动 Web\
  \ 浏览器中使用 Google Earth 或 Allo for Web？遇到页面性能迟缓了吗？正是如此！\n\n然而，所有这些负面方面更多地与手头的设备或客户端有关，而不是直接与\
  \ Polymer 有关。毕竟，如今大多数用户不再依赖较旧的 Web 浏览器，而且越来越多的设备配备了额外的内存和更好的能力来运行网页中的详细 HTML 元素。但是，如果你的目标受众来自硬件或软件较弱的少数群体，请谨慎在应用中使用过多的\
  \ Polymer 元素。\n\n至此，我们已经完成了对 Polymer 的介绍。我们了解了它是什么、它能做什么以及它的主要优缺点。现在，我们准备开始使用 Polymer，并了解其设置、安装和其他相关细节。\n\
  \n## 如何使用 Polymer？\n\n为了使用 Polymer 进行开发，我们首先需要安装它。接下来，我们将逐步完成安装步骤，以便让 Polymer 准备好工作。\n\
