  \n想知道 `i18next` 是什么吗？它是一个功能广泛、简单通用的开源库。它更像是一个面向 JavaScript 开发者的国际化框架，为我们提供了一套标准的\
  \ i18n 功能。它可以与各种 JavaScript 框架以及其他多个平台一起使用或集成。自然，`i18next` 是为你的应用和项目添加本地化支持的不错选择。\n\
  \n在 Aurelia 中，Aurelia-i18n 插件本身使用 `i18next` 作为其提供本地化内容的核心。考虑到 `i18next` 完全可扩展且功能多样，Aurelia-i18n\
  \ 插件也继承了同样的特性和灵活性。\n\n要安装 `i18next`，以下命令就足够了：\n\n你可以在其主页了解更多关于 `i18next` 的信息 – [`www.i18next.com/​`](https://www.i18next.com)\n\
