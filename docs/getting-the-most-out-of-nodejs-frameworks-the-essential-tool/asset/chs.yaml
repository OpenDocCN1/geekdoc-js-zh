  \ 的讨论就到此为止。\n\n在下一章中，我们将把注意力转向 Webix，它恰好是另一个用于用户界面（UI）开发的 JavaScript 框架。不过，这个框架自带了一套自定义\
  \ UI 小部件以及多个 CSS 和 HTML5 组件，以加速 Web 开发工作流程。\n\n# 第 9 章 Webix\n\nDOI：[10.1201/​9781003203711-9](https://doi.org/10.1201/9781003203711-9)\n\
  \n在上一章中，我们学习了 `Conditioner.js`，它恰好是一个专门用于网站开发的 JS 框架。`Conditioner.js` 本身是一个相当有趣的概念，尽管它不能用于很多目的，尤其是在基于\
  \ Web 的应用方面。\n\n在本章中，我们将继续探索另一个 JS 框架。更重要的是，这个框架更进一步，配备了一系列模块、组件和元素，可以辅助用户界面（UI）开发。\n\
  \nWebix 是一个 JS 框架，带有多个 HTML5 UI 组件和许多功能丰富的小部件。话虽如此，在进一步讨论之前，还值得注意的是 Webix 也有一个高级版本。\n\
  \n那么，为 JS 框架付费？这有意义吗，尤其是当市面上有许多令人惊叹的 JS 框架完全免费使用，并且比 Webix 功能更丰富、更先进时？\n\n当然，这些都是合理的问题，取决于你问谁，你会得到不同的答案，从正面到负面。然而，只要商业模式可行，并且产品有功能和特性来支撑它，拥有商业模式并没有错。\n\
  \n这引出了另一个问题：Webix 真的能证明其高级产品的价值吗？换句话说，Webix 值得投入吗？\n\n为了回答这些问题以及更多问题，我们首先需要熟悉 Webix\
  \ 及其提供的功能，它能为我们做什么，等等！\n\n所以，不要再浪费时间了，让我们开始了解 Webix！\n\n## 什么是 WEBIX？\n\n\n\n\n\n\
  在实际应用中，Webix 将自己定义为一个用于加速 Web 开发的 JavaScript UI 框架。显然，这个定义相当宽泛。让我们花点时间来更好地理解 Webix\
  \ 究竟是什么。\n\n### 介绍 Webix\n\nWebix 自带多种皮肤和小部件，我们可以在项目中使用它们。因此，我们可以利用 Webix 的 UI 元素、组件和小部件来节省开发时间，而不是从头开始构建一切。\n\
  \n这意味着 Webix 更像是一个面向 Web 开发者的用户界面元素的集合或组合，而不是一种编码机制。自然，这能吸引许多开发者，因为相当多的 Web 开发者往往浪费宝贵的时间去编写那些本可以在\
  \ Webix 库中找到的 UI 元素。\n\n另一方面，对于像 JavaScript 学生或想要深入了解代码细节的人来说，Webix 似乎没有太大用处。Webix\
  \ 是为专业开发者、机构和公司设计的，他们确切知道如何使用其库和小部件。\n\n既然我们已经明确了 Webix 的真正目的和目标，那么它究竟能提供什么，我们又为什么要关注\
  \ Webix 呢？让我们继续阅读以找出答案！\n\n### Webix 有何特别之处？\n\n作为 JS 框架，Webix 与我们目前在本章中介绍的其他框架有很大不同。从一开始，这一点就很明显：Webix\
  \ 自带自己的小部件库，这些小部件本质上是“现成的”——我们只需要在项目中使用它们即可。这些小部件从非常直观的图表和地图，到高度复杂的电子表格、图形等，应有尽有。\n\
  \n自然，Webix 更像是一个打包成 JS 框架的“产品”。这就是为什么为 Webix 提供高级版本很有意义。\n\n那么，Webix 是完全付费的产品吗？绝对不是。\n\
  \nWebix 也有一个完全开源的免费版本，可以轻松下载。然而，免费版本缺少一些高级且功能丰富的小部件，这些部件只包含在高级版本中。此外，付费计划还附带支持。\n\
  \n从这个意义上说，Webix 与 WordPress 插件（如 WooCommerce 等）的世界相当可比，其中核心产品是开源且免费的。然而，通过付费的附加组件和模块，可以进一步扩展基本功能。\n\
  \n事实上，作为一个 UI 组件的组合库，Webix 更像是一种集中且有针对性的方法，如果开发者希望节省时间并快速构建项目，他们会发现它非常有用。\n\n这很可能让读者想起诸如\
  \ Bootstrap 之类的工具，它们也旨在节省开发时间。这正是 Webix 的独特之处所在——它是一个经过充分测试、可直接用于生产的资源集合，专为 Web\
  \ 开发而设计。\n\n### Webix 的特性\n\n*   易于学习。文档非常详细，理解一切工作原理并不困难。你不需要成为 JS 大师或 JS 忍者就能上手。你甚至不需要理解它们之间的区别。\n\
  *   与流行框架集成。实现了与 Backbone.js、AngularJS 和 jQuery 的集成。例如，后一个特性允许你使用 jQuery 语法创建 Webix\
  \ 小部件。\n*   与第三方小部件集成。在此，我们仅列出：Mercury、Nicedit、Tinymce、CodeMirror、CKEditor、Raphael、D3、Sigma、JustPage、Google\
  \ Maps、Nokia Maps、Yandex Maps、dhtmlxScheduler 和 dhtmlxGantt。\n*   体积小，速度快。压缩后，js\
  \ 文件仅重 128 KB，同时一切运行得相当快（据开发者称，它“飞”起来了）。\n*   触摸屏支持。创建的小部件在桌面端和智能手机/平板电脑上表现同样出色。\n\
  \n## 安装与使用\n\n现在我们已经了解了 Webix 是什么以及它能提供什么，让我们开始 Webix 开发。第一步，显然是安装 Webix。\n\n###\
  \ 安装 Webix\n\n在大多数情况下，我们将假设我们使用的是 Webix 的开源且完全免费的版本。安装 Webix 最简单直接的方法是通过内容分发网络（CDN）。\n\
  \n使用 CDN 时，我们只需要指定位于 Webix CDN 中的 `webix.js` 和 `webix.css` 文件的链接。在这种情况下，我们的文件规范可能如下所示：\n\
  \n第二种选择是通过 `npm` 安装。我们已经看到如何使用 `npm` 安装多个 JS 框架，Webix 也不例外。命令相当简单：\n\n然后安装过程就会开始。\n\
  \n值得注意的是，在使用 Webix 的高级版本时，`npm` 安装是一个不错的选择。虽然上述命令适用于免费开源版本，但高级版本的命令可以在 Webix 文档中找到——通常，你需要指定你的凭据以验证自己为授权用户。\n\
  \n还有第三种安装 Webix 的方法，尽管这更像是下载而非安装。一旦我们下载了 Webix 的免费版本，我们可以简单地解压缩文件，然后在代码中使用相对路径引用所需的文件。\n\
