  \ 安装并重新安装。要在 Windows 中正确更新 `npm`，你需要执行以下操作。首先，以管理员身份打开 PowerShell 并运行以下命令：\n\n这将确保脚本在你的系统上运行。接下来，你需要安装\
  \ `npm-windows-upgrade` 工具。安装该工具后，你需要运行它，以便它为你更新 `npm`。请在提升权限的 PowerShell 控制台中执行所有这些操作。\n\
  \n要查看当前 `npm` 的版本，请在命令行/终端中输入以下命令：\n\n要检查是否安装了 Node.js，请打开终端或命令行工具并输入 `node -v`。如果已安装\
  \ Node.js 包，你应该会看到版本号：\n\n要检查是否安装了 `npm`，请输入 `npm -v`。同样，你应该会看到版本号：\n\n### Node\
  \ 打包模块\n\n`npm` 可以在本地模式或全局模式下安装包。在本地模式下，它会将包安装在你当前工作目录的 `node_modules` 文件夹中。该位置属于当前用户。全局包安装在\
  \ `{prefix}/lib/node_modules/` 目录下，该目录归 root 所有（其中 `{prefix}` 通常是 `/usr/` 或 `/usr/local`）。这意味着你必须使用\
  \ `sudo` 来全局安装包，这可能会导致在解析第三方依赖时出现权限错误，以及安全问题。\n\n### package.json 文件\n\n包文件 `package.json`\
  \ 包含有关应用程序的信息：名称、版本、依赖项等。任何包含此文件的目录都被解释为一个 Node.js 包，即使你不打算发布它。\n\n如何使用包文件 `package.json`\
  \ 取决于你是要下载包还是发布包。\n\n包配置文件 `package.json` 用于更方便地管理 `npm` 中的应用程序配置和包。因此，在 `modulesapp`\
  \ 项目文件夹中添加一个新的 `package.json` 文件：\n\n这里只定义了两个部分：项目名称为 `modulesapp`，版本为 `1.0.0`。这是\
  \ `package.json` 文件的最小必需定义。一个给定的文件可以包含更多部分。\n\n### devDependencies\n\n除了在应用程序运行和工作状态下使用的包（例如\
  \ `express`，即“生产”状态）之外，还有一些包用于开发应用程序和测试。这些包通常被添加到另一个部分——`devDependencies`。\n\n###\
  \ 下载包\n\n如果你想手动下载包，则不需要为此使用 `package.json`。你可以在终端中运行 `npm` 命令，并将所需包的名称作为命令参数，该包将自动下载到当前目录。例如：\n\
  \n你也可以使用 `package.json` 来下载包。在你的项目目录中创建一个包文件 `package.json`，并向其中添加以下代码（我们不指定自己的包名称和版本，因为我们不打算发布它；我们指定要下载的包的名称和版本）：\n\
  \n然后保存文件，并在终端中运行 `npm install` 命令。\n\n如果你想在项目中使用多个包，最好在 `package.json` 中指定它们，而不是每次都通过终端下载。\n\
  \n如果你使用 `package.json` 来下载包，那么实际上你是在创建一个用于下载包的包。我知道这很奇怪，但它确实有效。\n\n如果任何包有依赖项，`npm`\
  \ 将通过下载的包的 `package.json` 找到它们并下载它们。在我们的例子中，`canvas-diagram` 包也有一个 `package.json`\
  \ 文件，其中指定了依赖项。\n\n### 发布包\n\n要发布包，你需要将所有源代码和 `package.json` 文件收集到一个目录中。在 `package.json`\
  \ 中，必须指定包名称、版本和依赖项。例如：\n\n查看这段代码，我们可以看出 `canvas-project` 包依赖于 `canvas-diagram` 包。你可以使用\
  \ `npm publish` 命令发布包。\n\n### 将包用作可执行文件\n\n当 `npm` 下载一个包时，它会在 `package.json` 文件中查找\
  \ `bin` 属性。如果找到该属性，它会将此包转换为可执行文件，并将其放置在指定的目录中。\n\n例如，下面的命令将 `grunt-cli` 加载到当前目录，并将源代码转换为可执行文件，然后将其放置在所有可执行文件的文件夹中。结果，我们将能够调用\
  \ `grunt-cli` 命令。\n\n### 删除包\n\n无论包信息位于 `dependencies` 还是 `devDependencies` 部分，包都会从这些部分中删除。\n\
  \n如果我们需要删除多个包，我们可以从包文件 `package.json` 中删除它们的定义，然后输入 `npm install` 命令，从 `package.json`\
  \ 中移除的包也将从 `node_modules` 文件夹中删除。\n\n例如，将 `package.json` 文件修改如下：\n\n这里不再有任何包的定义。然后输入命令：\n\
  \n此外，我们还可以同时向 `package.json` 中添加一些包，并删除另一些包。当运行 `npm install` 命令时，包管理器将安装新包，并从 `package.json`\
  \ 中删除已移除的包。\n\n### 语义化版本控制\n\n语义化版本控制用于确定包版本。版本号通常采用以下格式设置：`\"major.minor.patch\"\
  `。如果在应用程序或包中发现错误并修复，则“补丁”号增加 1。如果向包中添加了与先前版本兼容的新功能，则这是一个小改动，“次要”号增加。如果对包进行了与先前版本不兼容的重大更改，则“主要”号增加。也就是说，通过查看不同版本的包，我们可以推测它们之间的差异有多大。\n\
  \n\n\n\n## GULP\n\n像 Gulp 这样的应用程序属于所谓的“任务运行器”，因为它们用于在网站构建时执行任务。目前最流行的两个任务管理器是 Gulp\
  \ 和 Grunt。让我们来了解它们的任务和特性。\n\nGulp 是一个用于自动化 Web 开发中出现的日常任务的工具。它不仅可以用于前端开发，也可以用于后端开发。\n\
  \n如果你在工作中实现了像 `gulp` 这样的工具，你将显著加快工作速度。此外，这个工具将“开辟”新的机会，从而大幅提升你的 Web 开发水平和知识。\n\n\
  Gulp 是一个用 JavaScript 编程语言编写的程序。为了开始使用它，最好至少了解 JavaScript 语言的基础知识。如果你了解这些，那么使用 Gulp\
  \ 程序对你来说会容易得多。\n\n其含义如下：我们为 Gulp 系统创建特定的任务。换句话说，我们用 JavaScript 描述这些任务。然后，Gulp 按照我们设定的顺序简单地执行这些任务。Gulp\
  \ 只是一个用于管理 Web 开发任务的系统。它也被称为任务管理器。\n\n重要的是要理解，Gulp 只是一个核心，我们为其附加额外的模块、插件，这些插件“教会”Gulp\
  \ 执行某些特定的功能或工作。通过安装这些插件，我们在 Gulp 系统中获得了可以使用的新的功能。\n\n使用 Gulp 系统可以解决哪些典型任务？\n\n让我们看看其中最基本的几个。\n\
  \n1. **代码压缩：** 这是 Gulp 及类似系统最常用的任务之一——代码压缩任务。对你来说，这段代码看起来很好，但如果你将这段代码放在托管你网站的工作服务器上，那么由于代码中包含大量不必要的缩进、注释等信息，加载时间会相当长。\n\
  \n   Gulp 允许你移除所有不必要的代码，将其准备好以便上传到工作服务器。\n\n2. **将不同文件中的代码合并为一个：** 你可以将 CSS、JavaScript\
  \ 等文件中的代码合并为一个。这同样重要，因为文档加载速度。在使用 http 协议时，每个文件请求都会增加页面加载时间。如果将代码合并到一个文件中，上传它比上传多个文件更简单、更快。这是现代\
  \ Web 开发中必须解决的典型任务。如果代码被分成模块和独立部分，编写程序会容易得多。\n\n3. **使用 CSS 预处理器：SASS、LESS 等：**\
  \ Gulp 系统允许你在工作中使用它们，你将获得一个强大的工具来提升你的 Web 开发技能。\n\n4. **支持新的 JavaScript 语言标准：**\
  \ 由于 JavaScript 是一种客户端编程语言，它依赖于运行它的浏览器。如果你网站的访问者使用一些旧浏览器，新的标准将无法在他们那里工作。使用 Gulp，你可以解决这个问题。\n\
  \nGulp 并不是唯一能够解决此类任务的工具。重要的是要理解，Gulp 是最简单、最容易的解决方案之一，可以让你做到这一点。\n\n为 Gulp 编写的代码直观易懂，你得到的项目也相当紧凑和方便。它将包含\
  \ Web 开发所需的一切。\n\n可以肯定地说，Gulp 及其编写的众多实用程序适用于解决任何复杂程度项目开发中的几乎任何任务——从小型网站到大型项目。\n\n\
  任何使用 Gulp 的项目在其根目录下都有一个 `gulpfile.js` 文件，其中包含一组项目管理指令。我想立即说明，为 Gulp 编写指令并不是编程，尽管它们是用\
  \ JavaScript 编写的。不要害怕庞大的 `gulpfile.js`，基本上所有指令都是同一类型，并且具有共同的特征。当你阅读完本指南时，你应该不会对\
  \ Gulp 有任何疑问，因为构建系统是基础的。但如果你仍有问题，请务必在评论中写下。\n\n### 安装\n\n要使用 Gulp，你必须已安装 Node.js。为不同平台安装\
  \ Node.js 相当简单——下载适用于你操作系统的 Node 安装程序并安装。我建议安装最新的稳定版本。\n\n注意！如果你是最新版本 Windows 的用户，我建议使用\
  \ WSL 进行 Web 开发。在这种情况下，不需要从 [Nodejs.org](http://Nodejs.org) 网站下载安装程序。\n\n一旦 Node\
  \ 安装完成，你就可以开始安装 Gulp。打开终端（在文件夹中按住 Shift 键并右键单击。在此处打开 Linux shell）并运行以下命令：\n\n对于\
  \ Mac 和 Linux 用户以及 Windows 上的 Ubuntu bash，使用 `-g` 键进行全局安装必须具有超级用户权限，例如使用 `sudo`：\n\
  \n从这个命令中，我们可以看到 npm 包管理器（NPM）被启动，它使用 `install` 命令将 Gulp 安装到系统中。`-g` 键表示该包将全局安装到系统中，即安装到系统而非项目文件夹中。如果没有\
  \ `-g` 键，包将安装到当前执行命令的文件夹中，所以请小心。\n\n### 创建 Gulp 项目\n\n让我们为将要处理的示例创建一个项目文件夹，例如命名为\
  \ `myproject` 文件夹。\n\n现在在项目文件夹中打开终端。对于 Windows 用户，只需按住 Shift 并打开上下文菜单。其中会出现“在此处打开\
  \ Linux shell”选项。Linux shell 必须预先安装。\n\n接下来，我们将在创建的文件夹中初始化项目：\n\n按照提示，填写关于我们项目的元信息：\n\
  \n* 将项目命名为“MyProject”\n* 保留当前版本 1.0.0\n* 输入项目的简短描述——My First Gulp Project\n* 入口点、测试命令、git\
  \ 仓库和关键字可以保留默认值\n* 你也可以指定作者姓名\n* 许可证保留默认值并输入 yes\n\n通过这个简单的新 Gulp 项目初始设置，`myproject`\
  \ 文件夹中将生成一个新的 `package.json` 文件。\n\n`package.json` 文件是我们项目的清单文件，除了我们在终端中输入的信息外，它还描述了项目中使用的包的信息。\n\
  \n例如，如果我们使用 `--save-dev` 键在项目中安装 Gulp，那么该包及其使用的版本将自动添加到我们的 `package.json` 中。这种记录允许你使用现有的\
  \ `package.json` 快速部署新项目，并在新项目中安装 `package.json` 中指定的依赖模块。\n\n让我们在项目中安装 Gulp：\n\n\
  从这一行我们可以看到：`npm install` 将 `gulp` 包安装到当前的 `myproject` 文件夹中（因为没有 `-g` 键将包全局安装到系统中），并将包名和版本保存到\
  \ `package.json` 文件中。\n\n此外，我们有了 `node_modules` 文件夹，其中现在包含已安装的 `gulp` 包及其必要的依赖项。这个文件夹将自动存放我们将在项目中安装的所有模块和依赖项。尽管我们安装的包不多，但可能会有很多依赖项文件夹，这是因为除了主包之外，还会安装主包正常运行所需的程序。你不需要清理或删除\
  \ `node_modules` 文件夹中的任何内容。你可能还会有一个额外的 `package-lock.json` 文件。这没有问题，它是一个服务文件，你可以忽略它。\n\
  \n### Gulp SASS\n\n让我们在项目中安装 `gulp-sass` 包，并将版本和名称保存到 `package.json` 中。\n\n\n\n\n\
  \n请注意，任何用于任务的 Gulp 包都很容易通过谷歌搜索找到，并且在其主页和文档中都有相当全面的连接说明。\n\n接下来，我们将在文件 `gulpfile.js`\
  \ 中连接 `gulp-sass`。请注意，用于连接包的变量可以用逗号分隔：\n\n### Node 中的替换模式\n\n替换模式允许你向 `gulp.src`\
  \ 添加多个文件。这类似于正则表达式，但仅适用于目录。使用替换模式时，计算机会检查文件和路径名称以匹配模式。如果模板存在，则找到该文件。大多数任务通常需要 4\
  \ 种不同的替换模式：\n\n*   `*.scss`：`*` 字符匹配当前目录中的任何模板。在我们的例子中，我们正在查找项目根文件夹中所有以 `.scss`\
  \ 结尾的文件。\n\n*   `**/*.scss`：这是一个更高级的模板，用于在根目录和所有子文件夹中查找以 `.scss` 结尾的文件。\n\n*   `!not-me.scss`：字符\
  \ `!` 指定 Gulp 将从匹配结果中排除特定文件。在我们的例子中，`not-me.scss` 将被排除。\n\n*   `*.+(scss|sass)`：`+`\
  \ 号和括号 `()` 有助于创建多个模板，模板之间用 `|` 字符分隔。在我们的例子中，Gulp 将查找根文件夹中所有以 `.scss` 或 `.sass`\
  \ 结尾的文件。\n\n## GRUNT\n\n基于 Node.js，Grunt 是一个基于任务的命令行工具，通过降低为生产环境准备资源所需的工作量来加速工作流程。它通过将任务封装成任务，在你进行过程中自动编译来实现这一点。本质上，你可以将\
  \ Grunt 用于大多数你认为繁琐且通常需要手动配置和运行的任务。简而言之，Grunt 是一个使用任务从命令行构建 JavaScript 项目的工具。\n\n\
  ### 为什么我们应该使用 Grunt？\n\nGrunt 最好的特性之一是为团队带来的一致性。如果你曾经尝试过在团队中工作，你可能知道代码中的不一致会多么令人沮丧。Grunt\
  \ 允许团队使用一组命令，从而确保所有团队成员按照相同的标准编写代码。在团队协作中，即使是代码中最微小的不一致也可能带来大问题。\n\n此外，Grunt 拥有一个非常活跃的开发者社区，定期发布新的插件。由于已经有大量的工具和自动化任务，入门门槛相对较低。\n\
  \n### 安装\n\nGrunt 作为 NPM 模块安装。如果你没有安装 `node.js` 和 `npm`，那么你需要先安装它们。你可以从 node.js\
  \ 的官方网站安装，或者如果你有 Mac，可以使用 homebrew。然后你需要安装 `npm` 包管理器（你可以将 npm 与 ruby gems 进行类比）。请注意，如果你从官方网站安装\
  \ node.js，则 npm 已包含在内。只有当你从源代码构建 node.js 或使用 homebrew 时，才需要单独安装 npm。\n\n直接安装 Grunt\
  \ 只需执行简单的 `npm install -g grunt` 命令。`-g` 标志表示全局安装。Grunt 将始终可以从命令行使用，因为它安装在 `node_modules`\
  \ 根文件夹中。如果你只想在特定文件夹中运行 Grunt，则在该文件夹中运行相同的命令，但不带 `-g` 标志。\n\n最后一步是安装 Grunt 命令行界面（CLI）。这将使终端能够处理\
  \ `grunt` 命令。没有它，运行 `grunt` 将返回错误“Command Not Found”（命令或文件未找到）。出于效率原因，它被单独安装。否则，如果你有十几个项目，你将不得不安装十个\
  \ GruntCLI 副本。\n\n安装 GruntCLI 只需在终端中输入一行命令。只需运行：\n\n```\nnpm install -g grunt-cli\n\
  ```\n\n之后，你应该关闭并重新打开终端窗口。这通常是确保一切正常工作的好方法。就像过去安装新程序后重启计算机一样。\n\n### 让 Grunt 合并几个文件\n\
  \n假设我们的项目有三个独立的 JavaScript 文件：\n\n*   `jquery.js`：我们使用的库\n\n*   `carousel.js`：我们使用的\
  \ jQuery 插件\n\n*   `global.js`：我们自己编写的文件，用于配置和调用插件\n\n在生产环境中，我们需要将所有文件合并为一个，以提高性能（一个\
  \ http 请求比三个好）。我们需要告诉 Grunt 为我们执行此操作。\n\n但是等等，Grunt 本身并不真正做任何事情。你记得 Grunt 只是一个执行任务的工具。我们必须自己添加任务。到目前为止，我们还没有设置\
  \ Grunt 做任何事情，所以让我们开始吧。\n\n用于合并文件的官方 Grunt 插件是 `grunt-contrib-concat`。\n\n这种安装方法的一个好处是，包配置文件\
  \ `package.json` 将自动更新，并写入新的依赖项。打开它并确认。将会出现一行新内容：\n\n```\n\"grunt-contrib-concat\"\
  : \"¹.0.1\"\n```\n\n现在我们准备使用这个插件。要使用它，我们需要开始设置 Grunt 并告诉它要做什么。\n\n你可以使用名为 `Gruntfile.js`\
  \ 的配置文件告诉 Grunt 要做什么。\n\n就像 `package.json` 文件一样，`Gruntfile.js` 有自己的格式，你需要遵守。我不担心其中每个单词的含义。只需看这个例子：\n\
  \n```\nmodule.exports = function(grunt) {\n  grunt.initConfig({\n    concat: {\n\
  \      dist: {\n        src: ['js/libs/*.js', 'js/global.js'],\n        dest: 'js/production.js'\n\
  \      }\n    }\n  });\n  grunt.loadNpmTasks('grunt-contrib-concat');\n  grunt.registerTask('default',\
  \ ['concat']);\n};\n```\n\n现在我们需要创建一个配置文件。文档可能让人不知所措。让我们专注于一个简单的例子。\n\n记住，我们有三个要合并的\
  \ JavaScript 文件。我们将在 `src` 中以数组形式列出它们的路径（作为带引号的字符串），然后指定目标文件为 `dest`。目标文件在此阶段不必存在。它将在相应任务启动时创建，该任务会将所有文件合并为一个。\n\
  \n而 `jquery.js` 和 `carousel.js` 是库。我们可能不会更改它们。并且，为了项目中的秩序，我们将它们放在单独的文件夹 `/js/libs/`\
  \ 中。文件 `global.js` 是我们编写自己代码的地方，因此它将直接位于 `/js/` 文件夹的根目录中。现在你需要向 Grunt 解释如何找到所有这些文件并将它们合并为一个文件\
  \ `production.js`，命名以表明它将用于实际的、真实的网站。\n\n以下将包含与此相同的小段配置代码。它们的目的是引起对重要地方的注意，但是，一开始你可能不理解每个片段如何集成到一个大文件中。\n\
  \n当 `concat` 配置就位后，打开终端并运行命令：\n\n```\ngrunt\n```\n\n看，发生了什么！创建了 `production.js`\
  \ 文件，它是三个文件的完美组合。\n\n### Gulp 和 Grunt 有什么区别？\n\n没有人喜欢做无聊且重复的任务，但计算机可以为我们做这些。当谈到自动化前端项目的构建时，有两个主要参与者：Grunt\
  \ 和 Gulp。但是该选哪个？它们之间有什么区别？哪个更好？让我们看看 Grunt 和 Gulp 的主要区别。\n\nGrunt 和 Gulp 是用于构建 Web\
  \ 应用程序的工具，旨在自动化重复性过程，例如连接（粘合）文件、压缩图像、样式表和 JavaScript 文件。\n\n### Grunt 和 Gulp 的相似之处\n\
  \nGrunt 和 Gulp 自动化开发人员的日常任务，例如：\n\n*   代码压缩和代码质量分析\n\n*   图像优化\n\n*   添加供应商（浏览器）前缀\n\
  \n*   测试\n\n如果你在开发过程中有多次重复的任务，你很可能可以使用 Grunt 或 Gulp 来自动化它们。\n\n构建工具如何执行任务？很简单。你编写指令告诉构建工具要做什么：\n\
  \n*   使用哪些文件\n\n*   对这些文件做什么（最小化、连接、分析错误等）\n\n*   将处理后的文件放在哪里\n\n\n\n\n\n乍一看，Grunt\
  \ 和 Gulp 非常相似。使用这些构建工具中的任何一个，你都可以自动化 Web 开发流程。更广泛地说，Grunt 和 Gulp 在以下方面是相同的：\n\n\
  - 两者都能自动化开发流程\n- 我们使用 JavaScript 编写任务\n- 两个构建工具都需要 Node.js 和 npm 才能运行\n\n相似之处到此为止。它们完成任务的方式是不同的。\n\
  \n### Grunt 与 Gulp 的区别\n\nGrunt 和 Gulp 之间主要有两个区别：\n\n1. 任务的配置方式。Grunt 基于配置，而 Gulp\
  \ 基于流。\n2. 任务的启动方式。Grunt 按顺序运行任务，而 Gulp 则尝试并行运行任务。\n\n#### 入门门槛\n\n如果说到入门，那么 Grunt\
  \ 的入门相对容易一些，但硬币的另一面是，阅读现成项目的配置会比较困难。Gulp 没有这个缺点：它的任务读起来和写起来一样容易。不过，经过足够的练习，这种差异并不那么明显。\n\
  \n#### 任务配置的差异\n\nGulp 的语法比 Grunt 更简洁。很棒的一点是，Gulp 是一个流式构建系统。要描述 Gulp 中的任务，你需要编写的代码要少得多。\n\
  \n#### 任务执行\n\n##### Grunt\n\n为了执行任务中的每个进程，Grunt 必须：\n\n- 打开所需文件\n- 启动当前进程\n- 保存更改\n\
  - 关闭当前处理的文件，以便下一个进程可以访问它\n\n##### Gulp\n\nGulp 不需要在进程之间创建临时文件。文件在执行完当前进程后，会立即传递给下一个进程，无需浪费时间保存文件。\n\
  \nGulp 使用 `Orchestrator`，它有助于尽可能并行地运行进程。这意味着 Gulp 会尝试同时完成所有任务。理论上，这能让 Gulp 更快地执行任务。\n\
  \n##### 插件\n\n在插件数量方面，Gulp 明显不如 Grunt，但这很可能是因为 Gulp 比它的对手更年轻。以下是一些 Grunt 插件，可以帮助你优化工作：\n\
  \n- `grunt-contrib-watch`：当被监视的文件发生变化时启动任务。\n- `grunt-contrib-jshint`：对 JavaScript\
  \ 文件进行验证。\n- `grunt-mocha`：用于使用 Mocha 框架进行测试。\n- `grunt-notify`：当任务出错时自动显示消息。\n\
  - `grunt-contrib-uglify`：使用 UglifyJS 压缩文件。\n\nGulp 也拥有所有这些插件。Gulp 还有一个 `gulp-grunt`\
  \ 插件，允许你运行 Grunt 文件。它不会创建流，而是作为参数调用：\n\n#### 开发活跃度\n\n要评估软件，可以看看它更新的频率。如果工具在不断被改进、修复错误，那么它的质量就会更高。查看\
  \ Grunt 和 Gulp 的 GitHub 仓库，我们可以了解开发者的活跃程度。\n\n每次代码更新时都会产生提交。这可以显示开发者在项目上的工作活跃度。\n\
  \n#### GitHub Gulp\n\n![Gulp 页面显示以下选项卡：代码、问题、拉取请求、讨论、操作、项目、安全性和洞察。](img/ufig10_1.jpg)<details><summary>长描述</summary>\n\
  \n代码选项卡被选中。选项卡下方有一个三列表格。第一列显示文件夹或文件名，第二列显示描述，第三列显示日期。关于和发布部分位于页面右侧。</details>\n\n\
  #### GitHub Grunt\n\n![Grunt 页面显示以下选项卡：代码、问题、拉取请求、操作、项目、Wiki、安全性和洞察。](img/ufig10_2.jpg)<details><summary>长描述</summary>\n\
  \n代码选项卡被选中。选项卡下方有一个三列表格。第一列显示文件夹或文件名，第二列显示描述，第三列显示日期。关于和发布部分位于页面右侧。</details>\n\n\
  在撰写本文时，Gulp 有 1195 次提交和 22 个版本，而 Grunt 有 1476 次提交和 18 个版本。\n\n考虑到以上所有因素，应该选择哪个构建工具：Grunt\
  \ 还是 Gulp？首先，我们不建议你仅仅因为有人试图向你证明其中一个有非凡的好处就切换到 Gulp 或 Grunt。如果你个人觉得使用那个被大肆吹捧的构建工具并不顺手，那么这些差异并不重要。\n\
  \n其次，在选择 Grunt 和 Gulp 时，要考虑你的需求。Grunt 易于使用，你不需要深入了解复杂管道系统的特性，而且执行简单任务非常清晰。Grunt\
  \ 是一个成熟的产品，拥有大量插件，被众多开发者使用。同时，它也有缺点，比如配置文件过于复杂难以阅读，或者由于重复的 I/O 操作，在处理大量文件时会变慢。\n\
  \n而 Gulp 则非常灵活。它当然更年轻，但现在它已经拥有了 Grunt 中所有主要的插件。此外，如果你要处理大量文件，同步执行任务的能力正是你所需要的。但如果你之前没有使用过\
  \ NodeJS，一开始可能会在线程方面遇到一些问题。\n\n如你所见，Grunt 和 Gulp 之间的选择更多是个人偏好问题。如果你从未使用过构建工具，请再次权衡以上所有利弊——它们将帮助你决定选择哪个工具来自动化你的工作。\n\
  \n#### 总结…\n\nGrunt 用 JavaScript 编写，使用 Node.js，并支持不同平台。该软件拥有以下插件：压缩 JavaScript 和\
  \ CSS、集成 CSS 和 JavaScript 的预处理器（如 Sass/Compass、Less 和 Stylus、CoffeeScript 或 LiveScript\
  \ SASS/Compass）、优化 PNG 和 JPEG 图像文件大小以及自动嵌入图像，以及许多其他对工作有用的功能。使用 Grunt，你可以创建自己的高质量产品。在官方网站上，你可以找到所有可能的插件链接并开始使用它们。此外，在编写大型\
  \ Web 应用程序时，该产品将成为不可或缺的助手。它的特点包括：集成了对 `Require.js` 和 `Google Closure Compiler` 的优化，允许预编译\
  \ `Handlebars`、`Jade`、`Underscore`、`Mustache`、`Eco` 或 `Hogan` 模板。还有用于流行测试框架的插件——`Jasmine`、`Mocha`、`QUnit`\
  \ 和 `Cucumber`。\n\nGulp 是另一个项目构建工具，通过自动化任务启动来加速开发。它拥有大量插件。它还允许你管理 JavaScript 文件，并通过其他任务来配置任务的启动。\n\
  \nGulp.js 使用代码而不是配置。这使得管理更加容易。为了快速运行，它使用流。它与 Grunt 的不同之处在于，Gulp 不是为每个插件创建输入/输出，而是将源文件传递给所有已安装的插件，然后创建输出文件。\n\
  \nGulp 基于数据流的原则，这让你对发生的事情有更多的控制，并消除了中间文件夹和文件。你将文件传递给 gulp，然后只将结果保存到另一个文件。这种方案简单易用。\n\
  \n在 Gulp 构建工具中，由于它较新，开发者们尽力避免重复 Grunt 的缺点。首先，你不需要使用 watch 插件，响应文件变化的功能已经内置在内核中。它使用简单清晰的\
  \ JavaScript 代码，而在 Grunt 中，配置文件类似于 JSON 对象。此外，在 Grunt 中，任务处理的是文件而不是数据流，而在 Gulp 中，如上所述，工作基于数据流，这要方便得多。\n\
  \n## CHART.JS\n\n\n\n\n\n![Chart.js 的主页，中间显示标志，下方文字为：Chart.js。为设计师和初学者提供的简单而灵活的\
  \ JavaScript 图表工具。提供了四个按钮：开始使用、示例、生态系统和 GitHub。](img/ufig10_3.jpg)\n\n通常，人们不会感知以文本或表格形式呈现的数据。首先是因为它枯燥，但更重要的原因是，以这种形式呈现的数字价值更难理解。即使表格很小，人们仍然有可能一扫而过，错过某些信息。通常，用户只会仔细查看几个他们特别感兴趣的国家。如果同样的数据以图表形式呈现，人们就能轻松看到全貌，即不同国家的人口比例。\n\
  \n处理图表时，我们更容易识别趋势或事实。例如，只需看一眼图表，就能立刻明白美国人口是孟加拉国的两倍，而中国人口是俄罗斯的十倍。\n\n`Chart.js` 是一个流行的工具，用于创建图形和图表。本系列教程将涵盖使用该库的所有方面。你可以基于\
  \ HTML5 Canvas 创建任意复杂度的自适应图表。\n\n该库允许你轻松创建任何类型的图形和图表，并在时间范围和对数刻度上构建数据。它还内置了动画处理工具，使你能够根据新数据有效修改图形，并尝试不同的颜色。\n\
  \n让我们从安装开始，然后处理配置和其他设置。\n\n### 安装\n\n你可以从 GitHub 下载最新版本的 `Chart.js`，或通过 CDN 链接将库连接到你的项目。你也可以通过运行以下命令之一，使用\
  \ `npm` 或 `bower` 进行安装：\n\n```\nnpm install chart.js --save\n```\n\n源代码提供两种精简级别。完整版\
  \ `Chart.js` 和精简版 `Chart.min.js`，后者包含 `Chart.js` 库和调色板解析器。如果选择第二个选项，你需要额外单独连接 `Moment.js`\
  \ 才能使用时间刻度创建图表。\n\n在 `Chart.bundle.js` 或 `Chart.bundle.min.js` 版本中，`Moment.js` 已经包含在内。这可以避免你附加多个单独文件。只需确保\
  \ `Moment.js` 不会被加载两次，否则可能导致库版本冲突。\n\n现在我们已经决定了要使用的库版本，可以连接代码并开始创建酷炫的图表了。\n\n##\
  \ CHOREOGRAPHER.JS\n\n![Choreographer.js 的主页，文字为：Choreographer JS，一个处理复杂 CSS 动画的简单库。文字下方有一个向下滚动选项。](img/ufig10_4.jpg)\n\
  \n`Choreographer.js` 是一个用于 CSS 动画的简单 JavaScript 库。它易于使用，能真正帮助你为网站创建复杂的 CSS 动画。\n\
  \n### 安装\n\n你可以通过输入以下命令安装 `Choreographer.js`：\n\n```\nnpm install choreographer-js\n\
  ```\n\n## GLIMMER.JS\n\n![Glimmer.js 的主页显示以下选项：指南、尝试和 GitHub。](img/ufig10_5.jpg)<details><summary>长描述</summary>\n\
  \n页面文字为：快速轻量的 Web UI 组件。可用于 Ember.js 和独立应用。页面底部有一个标题为“在 Ember.js 中使用”的部分。</details>\n\
  \n`Glimmer.js` 是一个出色的库，有助于处理用户界面组件和 DOM 渲染。它基于 Ember CLI 构建，并使用 Git、Node.js、npm\
  \ 和 Yarn。如果你正在寻找一个创建组件的工具，并希望优化处理它们的过程，请关注 `Glimmer`。\n\n### 安装\n\n你可以像这样在 Ember\
  \ 应用中安装 `Glimmer`：\n\n```\nember install @glimmer/component\n```\n\n你也可以通过以下方式安装\
  \ `Glimmer`：\n\n```\nnpm install @glimmer/component\n```\n\n## GRANIM.JS\n\n![Granim.js\
  \ 的主页顶部显示以下选项：GitHub、分享到 Facebook 和分享到 Twitter。](img/ufig10_6.jpg)<details><summary>长描述</summary>\n\
  \n中间文字为：Granim.js。使用这个小型 JavaScript 库创建流畅且交互式的动画。底部有三个选项：示例、API 和下载。</details>\n\
  \n使用 `Granim.js` 为你的网站背景装饰上多彩渐变。这个小型 JavaScript 库非常适合添加平滑且交互式的渐变。你可以将它们独立于其他元素使用，也可以用来覆盖图像或放置在图形蒙版下方。\n\
  \n## ANIME.JS\n\n![Anime.js 的主页显示以下选项卡：文档、示例和下载版本 3.2.1。](img/ufig10_7.jpg)\n\n\
  `Anime.js` 和微交互如今正流行。`Anime.js` 将为网站增加一些流量。`Anime.js` 是一个轻量级的 JavaScript 动画库，拥有简单但强大的\
  \ API。它适用于 CSS 属性、可缩放矢量图形（SVG）、DOM 属性和 JavaScript 对象。\n\n它拥有一系列功能，其中一些包括：\n\n* \
  \  内置在 anime 中的逐步系统使得处理复杂且重叠的动画变得容易。它可用于时间线和属性。\n*   在单个 HTML 元素中同时使用不同的时间戳对多个 CSS\
  \ 转换属性进行动画处理。\n*   使用完整的内置回调和控制功能，同步播放、暂停、控制、反转和触发事件。\n*   适用于任何网站。使用统一的 API 对所有\
  \ CSS、SVG、DOM 属性以及 JavaScript 对象进行动画处理。\n\n## AOS——滚动动画.js\n\n![AOS.js 的主页文字为：AOS.JS，滚动动画库。文字下方有一个向下滚动选项。](img/ufig10_8.jpg)\n\
  \n你正在开发一个带有视差效果的单页网站吗？`Animate on Scroll` 在页面滚动时添加了漂亮的动画。这个库将帮助你创建有吸引力的设计：它拥有从淡入效果到静态绑定的所有功能。\n\
  \n## BIDEO.JS\n\n![Bideo.js 的主页文字为：BIDEO.JS。一个让添加全屏背景视频变得超级简单的 JS 库。文字下方有两个选项：查看\
  \ GitHub 和如何工作。](img/ufig10_9.jpg)\n\n全屏视频是网站绝佳的背景。`Bideo.js`——一个用于添加视频背景的 JavaScript\
  \ 库，在任何尺寸的屏幕上都能良好显示并平滑缩放。\n\n## CLEAVE.JS\n\n![Cleave.js 的主页文字为：Cleave.js。在输入时格式化你的\
  \ ← 输入/→ 内容。页面底部有一个标有“演示”的向下箭头。](img/ufig10_10.jpg)\n\n你是否曾使用过在输入时自动格式化内容的表单字段？例如，将\
  \ `1020304050` 转换为带有国际区号的电话号码：`(102) 030-4050`。`Cleave.js` 是一个 JavaScript 库，允许你为网站添加类似功能。\n\
  \n## THREE.JS\n\n![Three.js 的主页。页面中间填满了平铺图像。左侧边栏显示以下部分：学习、社区、代码和资源。](img/ufig10_11.jpg)\n\
  \n`Three.js` 是一个对三维设计感兴趣的人来说非常有趣的 JavaScript 库。看看 Paper Planes 网站——你可以在那里用手机扔纸飞机。\n\
  \n## VOCA.JS\n\n![Voca.js 的主页。左侧边栏显示一个搜索栏和以下部分：大小写和链式操作。Voca 的文档显示在页面中央。](img/ufig10_12.jpg)\n\
  \n`Voca` 通过提供大小写转换、裁剪和截断等实用函数，使字符串处理更加容易。该库分为多个模块，允许你使用其单独的功能。\n\n## TWEEN.JS\n\n\
  \n\n\n\n![Tween dot j s 的主页显示以下标签：easel dot j s、tween dot j s、sound dot j s、preload\
  \ dot j s、docs、tools 和 blog。页面中央的字母显示为 T w e e n j s。字母下方有三个选项：下载、文档和入门指南。](img/ufig10_13.jpg)\n\
  \nTween 是 CreateJS 包的一部分，因此在 HTML 和 JavaScript 中创建动画时效率极高。\n\n## SLICK.JS\n\n![Slick\
  \ 的主页显示：Slick，你需要的最后一个轮播插件。](img/ufig10_14.jpg)\n\n标题下方的选项包括：演示、用法、设置、WordPress\
  \ 和立即获取。Slick 的功能列在页面底部：完全响应式。随容器缩放。每个断点独立设置。优先使用 CSS3，不可用时完全功能正常。支持滑动操作，也可禁用。桌面鼠标拖拽。无限循环。完全支持键盘导航。\n\
  \nSlick 能帮助你实现轮播效果。它拥有丰富的选项，支持移动设备的滑动手势，并具备其他酷炫功能。你甚至可以同步两个轮播，以创建叠加效果。\n\n## 结论\n\
  \n至此，这本关于 Node 框架的书就结束了。我们从讨论 JavaScript 框架的概念、工作原理、用途等开始。\n\n接着，我们花了一些时间理解 Node.js\
  \ 的基础知识，例如其用途、安装和特性。然后我们将注意力转向 Node 及其服务器端用法，以及 Node 模块的概念。\n\n完成这些之后，我们探索了众多 Node.js\
  \ 框架，例如 Polymer、Aurelia、Svelte、Webix、Conditioner.js 等。\n\n最后，我们转向了 JS 工具，如任务管理器（npm）和任务运行器（如\
  \ Gulp 或 Grunt）。此外，我们还简要讨论了一些较小的库，它们涉及特定的功能和概念。\n\n现在你已经读完了这本书，希望它能在你的 JavaScript\
