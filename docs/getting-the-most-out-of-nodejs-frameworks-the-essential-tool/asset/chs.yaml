  \n顾名思义，Polymer CLI 是用于处理 Polymer 的命令行界面。它是一个多用途工具，可帮助你构建、提供甚至测试你的 Polymer 项目。它有自己的命令集，本身就是一个非常有用的实用程序。你可以在\
  \ [`www.polymer-project.org/3.0/docs/tools/polymer-cli`](https://www.polymer-project.org)\
  \ 上找到 Polymer CLI 的详细文档以及相关命令。\n\n### 提供 Polymer 应用\n\n现在你已经安装并准备好了 Polymer，是时候学习如何构建和提供应用了。\n\
  \n*请注意，本示例将遵循 Polymer 的最新版本。在撰写本文时，最新版本是 Polymer 3（因此 Polymer 1.x 或 2.x 可能不符合给定的格式）。*\n\
  \n第一步是为你的应用创建一个新文件夹：\n\n之后，你可以使用应用模板初始化项目：\n\n此时你可以下载 polymer-3-starter-kit，以便 Polymer\
  \ CLI 使用 Polymer 3 Starter Kit 模板初始化并设置你的应用。\n\n接下来，要执行的命令相当简单。要提供你的项目：\n\nserve\
  \ 命令与许多其他 JS 项目一样，会告诉你应用所在的位置（就 localhost 上的 IP 地址而言）。然后你可以在 Web 浏览器中浏览它，并实时查看你的项目。\n\
  \n\n\n\n当然，以上只是如何“入门”一个项目。接下来，你需要添加额外的功能和特性，并可能将 Polymer 元素集成到更大、更复杂的应用中。\n\n在应用部署方面，你可以注册各种服务，例如\
  \ Google App Engine 或 Firebase，甚至使用自己的自定义云服务器。具体流程因情况而异，通常你选择的服务商会提供详细的文档，因此你应该查阅相关文档。\n\
  \n不过请记住，为了在外部项目中使用 Polymer 应用或元素，你需要准备好项目以便集成。因此，Web 开发者使用 Vue.js 或 React 构建应用，然后在其内部使用\
  \ Polymer 元素的情况并不少见。\n\n但这并不意味着 Polymer 不能用于构建功能完备的 Web 应用。事实上，Polymer 团队自己就制作了两个合适的\
  \ Web 应用，作为 Polymer 用途的示例。你可以查看 Shop 应用的案例研究，网址为 [`www.polymer-project.org/​3.0/​toolbox/​case-study`](https://www.polymer-project.org)，以及\
  \ News 应用的案例研究，网址为 [`www.polymer-project.org/​3.0/​toolbox/​news-case-study`](https://www.polymer-project.org)。\n\
  \n### 使用 Polymer 构建渐进式 Web 应用\n\n如果你打算使用 Polymer 库构建渐进式 Web 应用，你会发现 Polymer App\
  \ Toolbox 非常有用。\n\n这个特定的 App Toolbox 是一系列资源、组件、工具和模板的集合，可用于在 Polymer 中构建渐进式 Web\
  \ 应用。\n\nPolymer App Toolbox 遵循基于 Web Components 和 Polymer 的标准化实践。它提供了一系列完全响应式的模板，并支持本地化以及用于测试和调试的本地存储。\n\
  \n关于 App Toolbox 的详细文档可以在 [`www.polymer-project.org/​3.0/​toolbox/`](https://www.polymer-project.org)\
  \ 找到。为了借助 Polymer 构建渐进式 Web 应用，使用 Toolbox 很可能是最简单、最快捷的方式。\n\n## 结论\n\n在本章中，我们熟悉了\
  \ Polymer 及其用途。我们了解了它的特性、它如何证明自己的价值、它的优缺点，以及 Polymer 的基本操作模式。\n\n现在，在结束本章之前，让我们花点时间了解\
  \ Polymer 在现实世界中的实际用途。\n\n### Polymer 生态系统\n\nPolymer 被 Google 的各种服务和产品所使用，例如 YouTube\
  \ 的全新改版外观。它还被用于 Google Play Music、Google Allo Messenger for Web 以及重新设计的 Google Sites。\n\
  \n本质上，当你希望添加需要定期重用的元素时，Polymer 非常有用。因此，对于围绕特定操作集的应用，例如社区应用的 Web 界面，Polymer 可以提供自定义\
  \ HTML 元素，这些元素可以在需要时重复使用。\n\n最初，Polymer 的接受度较低。这是因为人们认为它是一个超前的库——某些浏览器无法很好地处理 Polymer\
  \ 组件，唯一的解决方法是捆绑自定义脚本，就像 jQuery 一样。显然，这违背了 Polymer 的初衷。\n\n然而，在浏览器大战中，Chrome 和 Firefox\
  \ 大幅崛起，Internet Explorer 彻底崩溃，Polymer 的受欢迎程度成倍增长。如今，Polymer 正受到广泛关注，其导入和重用组件的方法也受到许多开发者的赞赏。\n\
  \n如果你是一名 JS 开发者，希望为自己的技能库添加一些额外的框架或库，那么 Polymer 绝对是你应该认真考虑的对象。如果你主要从事 Web 应用开发，并希望在\
  \ Web 浏览器中提供接近原生的体验，那么它尤其方便。\n\n### 后续步骤\n\n接下来，你可以更多地尝试 Polymer 和自定义元素。花些时间学习如何修改、定制和调整元素，使其更适合你的需求，这是一个好主意。\n\
  \n除此之外，你还可以尝试用 Polymer 构建应用，尽管通常情况下，Polymer 更多地用于构建元素，这些元素会被导入到由某个更大框架管理的应用中。坦白说，这是主流方法，你也可以选择忽略它。\n\
  \n### 推荐资源\n\n要了解更多关于使用 Polymer 进行开发的信息：\n\n*   **GitHub 上的 Polymer 页面：** [`github.com/​Polymer/​polymer`](https://github.com)\n\
  \n*   **Polymer 官方文档：** [`www.polymer-project.org/​3.0/​start/`](https://www.polymer-project.org)\n\
