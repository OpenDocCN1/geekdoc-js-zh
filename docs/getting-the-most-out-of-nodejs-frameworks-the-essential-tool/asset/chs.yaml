  或者，对于 Windows、Mac 和其他平台，运行所需的安装应用程序。Node.js 文档在这个主题上相当丰富，我们将在 Node.js 章节中再次讨论。\n\
  \n成功安装 Node.js 和 npm 后，你可以通过验证版本来检查安装，如下所示：\n\n以及\n\n如果一切正常，你将看到已安装的版本详细信息。\n\n\
  现在，我们已经设置好了环境。我们的系统上有了 Git、npm 和 Node.js，可以轻松安装 Polymer 命令行界面（CLI）。\n\n要下载并安装 Polymer\
  \ CLI，我们将运行 `npm` 命令，如下所示：\n\n根据需要获取的依赖项数量，完全安装 Polymer CLI 可能需要一些时间。\n\n完成后，你可能希望确认\
