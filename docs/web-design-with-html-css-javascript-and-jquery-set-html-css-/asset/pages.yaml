  md: '# CSS ASSOCIATES STYLE RULES WITH HTML ELEMENTS


    CSS works by associating rules with HTML elements. These rules govern the content
    of specified elements should be displayed. A CSS rule contains two parts: a selector
    and a declaration.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_237_0.png)


    This rule indicates that all <p> elements should be shown in the Arial typeface.


    Selectors indicate which element the rule applies to. The same can apply to more
    than one element if you separate the element names with commas. Declarations indicate
    how the elements referred to the selector should be styled. Declarations are split
    into two parts (a property and a value), and are separated by a colon.'
  merge: -1
  pgno: 237
- img_proc: true
  md: "# CSS PROPERTIES AFFECT HOW ELEMENTS ARE DISPLAYED\n\nCSS declarations sit\
    \ inside curly brackets and each is made up of two parts: a property and a value,\
    \ separated by a colon. You can specify several properties in one declaration,\
    \ each separated by a semi-colon.\n\n```\nh1, h2, h3 {\n  font-family: Arial;\n\
    \  color: yellow;\n}\n```\n\nThis rule indicates that all <h1>, <h2> and <h3>\
    \ elements should be shown in the Arial typeface, in a yellow color.\n\nProperties\
    \ indicate the aspects of the element you want to change. For example, color,\
    \ font, width, height and border.\n\nValues specify the settings to use for the\
    \ chosen properties. For example, if you want to specify a color property then\
    \ the value is the color you want the text in these elements to be."
