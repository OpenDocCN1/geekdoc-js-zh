  md: '# UNDERSTANDING COLOR


    Every color on a computer screen is created by mixing amounts of red, green, and
    blue. To find the color you want, you can use a color picker.


    Computer monitors are made up of thousands of tiny squares called pixels (if you
    look closely at your monitor you should be able to see them).


    When the screen is not turned on, it''s black because it''s not emitting any light.
    When it''s on, each pixel can be a different color, creating a picture.


    The color of every pixel on the screen is expressed in terms of a mix of red,
    green, and blue — just like on a television screen.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_257_0.png)


    Color picking tools are available in image editing programs like Photoshop and
    GIMP. You can see the RGB values specified next to the radio buttons that say
    R, G, B.


    The hex value is provided next to the pound or hash # symbol. There is also a
    good color picking tool at: colorschemedesigner.com


    | Inline Example |

    |---|---|

    | current | OK Cancel |

    | R | 48 |

    | G | 100 % |

    | B | 255 |

    | | 204 |

    | | 0 |

    | #: ffcc00 |'
  merge: -1
