  md: '# LINKING TO A SPECIFIC PART OF THE SAME PAGE


    At the top of a long page you might want to add a list of contents that links
    to the corresponding sections lower. Or you might want to add a link from part
    down the page back to the top of it to add users from having to scroll back to
    the top.


    Before you can link to a specific part of a page, you need to identify the points
    in the page that your link will go to. By using the id attribute (which can be
    used on every HTML element), you can see that the h1 and h2 elements in this example
    have been given 1 id attributes that identify those sections of the page.


    The value of the id attribute should start with a letter or an underscore (not
    a number or any other character), and on a single page, no two id attributes have
    the same value.


    To link to an element that uses an id attribute you use the <a> element again,
    but the value of the href attribute starts with the # symbol, followed by the
    value of the id attribute of the element you want to link to. In this example,
    a <a href="#top"> links to the <h1> element at the top of the page whose id attribute
    has a value of top.


    chapter-04/linking-to-a-specific-part.html HTML


    ```

    <h1 id="top">Film-Making Terms</h1>

    <a href="Arc_shot">Arc Shot</a></a><br />

    <a href="#interlude">Interlude</a></a><br />

    <a href="#prologue">Prologue</a></a><br />

    <h2 id="arc_shot">Arc Shot</h2>

    <p>A shot in which the subject is photographed by an encircling or moving camera</p>

    <p>An intervening film scene or sequence, specifically tied to the plot, that
    appears within a film</p>

    <h2 id="prologue">Prologue</h2>

    <p>A speech, preface, introduction, or brief speech preceding the main action
    or plot of a film; contrast to epilogue</p>

    <p><a href="#top">Top</a></a></p>

    ```'
  merge: -1
