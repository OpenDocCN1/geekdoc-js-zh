  md: '# # MEASURING IMAGES

    AND RESOLUTION


    When sizing an image for use on the screen you should always set dimensions of
    the image in terms of pixels (not centimeters or inches).


    The images on your computer screen are made up of tiny squares known as **pixels**.
    The resolution of the screen is the number of pixels represented on it, and on
    most computers you can increase and decrease this number.


    If a screen''s resolution is set at 640x480 pixels, and it then increased to 1024x768
    pixels, the images and text will appear smaller because the screen is showing
    a lot more pixels within the same amount of space. (There are more pixels per
    inch.)


    When creating images for print, it is best to save them at a resolution of 300
    dots per inch (DPI) or higher (to ensure they look sharp).


    On the web, however, the resolution of an image is irrelevant. We only need to
    think of the size of image in terms of its **dimensions** in pixels.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_121_0.png)


    You may have heard that for the web we need to be 72 pixels per inch (PPI), but
    users can change the resolution of the screen itself (affecting the number of
    pixels shown per inch of the screen). Screens therefore determine the size of
    an image solely on its width and height in pixels.


    On a screen, an image that is 300x300 pixels exactly the same as an image that
    is 300x300 pixels at 500ppi. The resolution of the image only matters when the
    image is printed.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# VECTOR IMAGES


    Vector images differ from bitmap images and are resolution-independent. Vector
    images are commonly created in programs such as Adobe Illustrator.


    When an image is a line drawing (such as a logo, illustration, or diagram), designers
    often create it in vector format. Vector formatted images are very different from
    bitmap images.


    Vector images are created by placing points on a grid, and drawing lines between
    those points. A color can then be added to "fill in" the lines that have been
    created.


    The advantage of creating line drawings in vector format is you can increase the
    dimensions of the image without affecting the quality of it.


    The current method of using vector images for display on websites involves saving
    a bitmap version of the original vector image and using that.


    Scalable Vector Graphics (SVG) are a relatively new format to display vector images
    directly on the web (eliminating the need to create bitmap versions of them),
    however its use is not yet widespread.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# ANIMATED GIFS


    Animated GIFs show several frames of an image in sequence and therefore can be
    used to create simple animations.


    Below you can see the individual frames that make up an animated GIF that shows
    an orange dot revolving around a circle — the kind of animation you might see
    when a web page is loading.


    IT IS IMPORTANT TO REMEMBER:


    Some designers frown on animated GIFs because they remember a lot of amateur web
    designers overusing them in the 1990''s.


    Each extra frame of the image increases the size of the file, and can therefore
    add to the time it takes for an image to download (and web users do not waiting
    a long time for images to download).


    Some image editing applications such as Adobe Photoshop allow you to create animated
    GIFs. There are several tutorials about how to do this on the web. There are also
    several websites that allow you to upload the graphics for the individual frames
    and create the animated GIF for.


    Because GIFs are not an ideal format for displaying photographs, animated GIFs
    are really suitable for simple illustrations.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_123_0.png)'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# TRANSPARENCY


    Creating an image that is partially transparent (or "see-through") for the web
    involves selecting one of two formats:


    # TRANSPARENT GIF


    # PNG


    If the transparent part of the image has straight edges and it is 100% transparent
    (that is, not semi-opaque), you can save the image as a GIF (with the transparency
    option selected).


    If the transparent part of the image is diagonal or rounded edges or if you want
    a semi-opaque transparency or a drop-shadow, then you will need to save it as
    a PNG.


    Transparent PNGs are not fully supported in older browsers, most notably Internet
    Explorer 6 (IE6). There is some JavaScript you can use to get around this issue.
    The details of this script can be found in the tools section accompanying this
    book.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_124_0.png)'
  merge: -1
