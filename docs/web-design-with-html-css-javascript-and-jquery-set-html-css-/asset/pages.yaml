  md: '# RELATIVE URLs


    Relative URLs can be used when linking to pages within your own website. They
    provide a shorthand way of telling the browser where to find your files.


    When you are linking to a page on your own website, you do not need to specify
    the domain name. You can use relative URLs which are a shorthand way to tell the
    browser where a page is in relation to the current page.


    If all of the files in your site are in one folder, you simply use the file name
    for that page.


    If your site is organized into separate folders (directories), you need to tell
    the browser how to get from the page it is currently on the page that you are
    linking to.


    This is especially helpful when creating a new website or learning about HTML
    because you can create links between pages when they are only on your personal
    computer (before you have got a domain name and uploaded them to the web).


    If you link to the same page from two different pages you might, therefore, need
    to write two different relative URLs.


    Because you do not need to repeat the domain name in each link, they are also
    quicker to write.


    These links make use of the same terminology (borrowed from that family trees)
    met on the previous page which introduces directory structure.'
  merge: -1
  pgno: 89
