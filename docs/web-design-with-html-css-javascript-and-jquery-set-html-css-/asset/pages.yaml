  md: '# BORDER STYLE

    border-style


    # HTML


    ```

    ```html

    <p class="one">Wurlitzer Electric Piano</p>

    <p class="two">Wurlitzer Electric Piano</p>

    <p class="three">Wurlitzer Electric Piano</p>

    <p class="four">Wurlitzer Electric Piano</p>

    <p class="five">Wurlitzer Electric Piano</p>

    <p class="six">Wurlitzer Electric Piano</p>

    <p class="seven">Wurlitzer Electric Piano</p>

    <p class="eight">Wurlitzer Electric Piano</p>

    ```

    ```


    You can control the style of a border using the border-style property. This property
    can take the following values:


    solid a single solid line


    dotted a series of square dots (if your border is 2px wide, the dots are 2px squared
    with a 2px gap between each dot)


    dashed a series of short lines


    # CSS


    ```

    ```css

    p.one (border-style: solid);

    p.two (border-style: dotted);

    p.three (border-style: dashed);

    p.four (border-style: groove);

    .five (border-style: dotted);

    p.six (border-style: ridge);

    p.seven (border-style: inset);

    p.eight (border-style: outset);

    ```

    ```


    double two solid lines (the value of border-width property creates the sum of
    the two lines)


    groove appears to be carved into the page


    ridge appears to stick out from the page


    inset appears embedded into the page


    inset looks like it is coming out of the screen


    hidden - no border is shown


    # RESULT


    | Wurlitzer Electric Piano |

    | :--- |

    | Wurlitzer Electric Piano |

    | ----------------------- |

    | Wurlitzer Electric Piano |

    | ----------------------- |

    | Wurlitzer Electric Piano |

    | Wurlitzer Electric Piano |

    | Wurlitzer Electric Piano |

    | Wurlitzer Electric Piano |

    | Wurlitzer Electric Piano |

    | Wurlitzer Electric Piano |

    | Wurlitzer Electric Piano |


    You can individually change the styles of different borders using:

    border-style

    border-left-style

    border-right-style

    border-bottom-style'
