    HTML has six "levels" of headings:


    # This is a Main Heading


    <h1> is used for main headings


    This is a Level 2 Heading


    <h2> is used for subheadings


    This is a Level 3 Heading


    If there are further sections under the subheadings then the <h3> element is used,
    and so on...


    This is a Level 4 Heading


    This is a Level 5 Heading


    This is a Level 6 Heading


    Browsers display the contents of headings at different sizes. The contents of
    an <h1> element is the largest, and the contents of an <h6> element is the smallest.
    The exact size at which each browser can vary slightly. Users can also adjust
    the size of text in their browser. You will see how to control the size of text,
    its color, and the fonts used when we come to look at CSS.'
