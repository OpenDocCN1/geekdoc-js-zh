  md: 'This section discusses a process that you can use when you are creating a new
    website.


    It looks at who might be visiting your site and how to ensure the pages feature
    the information those visitors need. It also covers some key aspects of design
    theory to help you create professional looking sites. In this chapter, we will
    look at:


    +   - How to understand the audience your site may attract and what information
    they will expect to find on it

    - How to organize information so that visitors can find what they are looking
    for

    - Design theory for presenting information in a way that helps visitors achieve
    their goals

    - Design tips to help you create more attractive and professional sites'
