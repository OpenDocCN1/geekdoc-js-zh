  md: '# CSS3: BORDER IMAGES

    border-image


    The border-image property applies an image to the border of any box. It takes
    a background image and slices into new pieces.


    Here is the image. I added marks where it is sliced in the example, taking 18
    pixels from each corner to place an circle in each corner. The corners are always
    placed in the four corners of the box, but we have a choice whether the sides
    are stretched or repeated.


    This property requires three pieces of information:


    +   1: The URL of the image

    2: Where to slice the image

    3: What to do with the straight edges; the possible values are:

    stretch repeats the image like repeat but if the tiles do not fit exactly, scales
    the tile image so they will


    The box must also have a border width for the image to be shown.


    -moz-border-image and -webkit-border-image properties are not in the CSS specification
    but help earlier versions of Chrome, Firefox, and Safari display this effect.


    ```

    chapter-13/border-image.html

    <p class="one"></p>

    <p class="two"></p>

    ```


    ```

    p.one (

    -moz-border-image: url("images/dots.gif")

    11 11 11 11 stretch;

    -webkit-border-image: url("images/dots.gif")

    11 11 11 11 stretch;

    border-image: url("images/dots.gif")

    11 11 11 11 stretch);

    p.two (

    -moz-border-image: url("images/dots.gif")

    11 11 11 11 round;

    -webkit-border-image: url("images/dots.gif")

    11 11 11 11 round;

    border-image: url("images/dots.gif")

    11 11 11 11 round);

    ```


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_325_0.png)'
