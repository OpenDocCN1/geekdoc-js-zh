  md: "# BORDER ON EMPTY CELLS\nempty-cells\n\nIf you have empty cells in your table,\
    \ then you can use the empty-cells property to specify whether or not your borders\
    \ should be shown.\n\nSince browsers treat empty cells in different ways, if you\
    \ want to explicitly show or hide borders on any empty cells then you should use\
    \ this property.\n\nIt can take one of three values:\n\n```\nchapter-14/empty-cells.html\n\
    \n<table class=\"one\">\n  <tr>\n    <td>1</td>\n    <td>2</td>\n  </tr>\n  <tr>\n\
    \    <td>3</td>\n    <td></td>\n  </tr>\n</table>\n```\n\n# show\n\nThis shows\
    \ the borders of any empty cells.\n\n```\nCSS\ntd {\n  border: 1px solid #0088dd;\n\
    \  padding: 15px;\ntable.one {\n  empty-cells: show;\n}\ntable.two {\n  empty-cells:\
    \ hide;\n}\n```\n\n# hide\n\nThis hides the borders of any empty cells.\n\n# inherit\n\
    \nIf you have one table nested inside another, the inherit value instructs the\
    \ table cells to obey the rules of the containing table.\n\nIn the first table\
    \ on the left, you can see that the border of the empty cell is showing. In the\
    \ second table, it is hidden.\n\n| 1 | 2 |\n|---|---|\n| 3 | |"
  merge: -1
  pgno: 345
- img_proc: true
  md: "# GAPS BETWEEN CELLS\nborder-spacing, border-collapse\n\nThe border-spacing\
    \ property allows you to control the distance between adjacent cells. By default,\
    \ browsers often leave a small gap between each cell, so if you want to increase\
    \ or decrease this then the border-spacing property allows you to control.\n\n\
    HTML chapter-14/gaps-between-cells.html\n\n```\n<table class=\"one\">\n<tr>\n\
    <td>1</td>\n<td>2</td>\n</tr>\n<tr>\n<td>3</td>\n<td>4</td>\n</tr>\n</table>\n\
    ```\n\nThe value of this property is usually specified in pixels. You can specify\
    \ two values to specify separate numbers for horizontal and vertical spacing.\n\
    \n```\nCSS\ntd {\n  background-color: #008Bdd;\n  padding: 15px;\n  border: 2px\
    \ solid #000000;\ntable.one {\n  border-spacing: 5px;\ntable.two {\n  border-collapse:\
    \ collapse;}\n}\n```\n\nWhen a border has been used on table cells, where two\
    \ cells meet, the width of lines would be twice that of the outside edges. It\
    \ is possible to collapse adjacent borders to prevent this by using the border-collapse\
    \ property. Possible values are:\n\n# collapse\n\nBorders are collapsed into a\
    \ single border where possible. (border-spacing will be ignored and cells pushed\
    \ together, and empty-cells will be ignored.)\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_346_0.png)\n\
    \n# separate\n\nBorders are detached from each other. (border-spacing and empty-cells\
    \ will be obeyed.)"
  merge: -1
  pgno: 346
- img_proc: true
  md: '# STYLING FORMS


    Nobody knows enjoys filling in forms, so if you can make yours more attractive
    and easier to use, more people are likely to fill them in. Also, when you come
    to look at a form in a few different browsers (as shown on the right), you will
    see that each browser displays it differently.


    # MAC: SAFARI


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_347_0.png)


    CSS is commonly used to control the appearance of form elements. This is both
    to make them more attractive and make them consistent across browsers


    # MAC: FIREFOX


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_347_1.png)


    It is most common to style:


    +   * Text inputs and areas

    * Submit buttons


    +   * Labels on forms, to get the form controls to align nicely


    In the coming pages you will see how to control these with CSS.


    # PC: CHROME


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_347_2.png)


    # PC: IE


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_347_3.png)


    Styling text inputs and submit buttons is fairly easy. It is harder to get select
    boxes, radio buttons, and checkboxes to look consistent across all browsers.


    To achieve, you might like to download the CSS files available at http://formalize.me.
    The author of this website has done the hard work of making


    forms look consistent across browsers. Although the solution incorporates JavaScript,
    no prior knowledge of this is needed in order to implement the code.'
  merge: -1
  pgno: 347
- img_proc: true
  md: "# STYLING TEXT INPUTS\n\n# CSS\n\n```\ninput (\n  font-size: 120%;\n  color:\
    \ #5a5854;\n  background-color: #f2f2f2;\n  border: 1px solid #bdbdbd;\n  border-radius:\
    \ 5px;\n  padding: 5px 5px 30px;\n  background-repeat: no-repeat;\n  background-position:\
    \ 8px 9px;\n  display: block;\n  margin-bottom: 10px);\ninput:focus, input:hover\
    \ {\n  background-color: #ffffff;\n  border: 1px solid #blele4;\n}\\input#email\
    \ {\n  background-image: url(\"images/email.png\");\ninput#twitter {\n  background-image:\
    \ url(\"images/twitter.png\");\ninput#web {\n  background-image: url(\"images/web.png\"\
    );\n}\n```\n\nThis example demonstrates the CSS properties commonly used with\
    \ text inputs, most of which you have already met.\n\nfont-size sets the size\
    \ of the text entered by the user.\n\ncolor sets the text color, and background-color\
    \ sets the background color of the input.\n\nborder adds a border around the edge\
    \ of the input, and border-radius can be used to create rounded corners (for browsers\
    \ that support the property).\n\nThefocus pseudo-class is used to change the background\
    \ color of the input when it is being used, and the :hover pseudo-class applies\
    \ the same style when the user hovers over them.\n\nbackground-image adds a background\
    \ image to the box. Because there is a different image for each input, we are\
    \ using an attribute selector looking for the value of the id attribute on each\
    \ input.\n\n# RESULT\n\n| |\n| -|\n| |\n| |\n\nYou will learn more about background\
    \ images and how to position them in Chapter 16.\n\nLISTS TABLES AND FORMS 342"
  merge: -1
  pgno: 348
- img_proc: true
  md: "# STYLING SUBMIT BUTTONS\n\nHere are some properties that can be used to style\
    \ submit buttons. This example builds on the one in the previous page, and the\
    \ submit button inherits the styles set for the <input> element on last page.\n\
    \ncolor is used to change the color of the button.\n\ntext-shadow can give a 3D\
    \ look to the text in browsers that support this property.\n\nborder-bottom has\
    \ been used to make the border slightly thicker, which gives it a more 3D feel.\n\
    \nhover can make the button stand out from other items around it. (Creating a\
    \ consistent style for all buttons helps users understand how they interact with\
    \ the site.) A gradient background has been added for browsers that support gradients.\
    \ Gradients are covered on page 419.\n\n```\nchapter-14/styling-submit-buttons.html\
    \ CSS\ninput@submit {\n  color: #444444;\n  text-shadow: 0px 1px 1px #ffffff;\n\
    \  border-bottom: 2px solid #b2b2b2;\n  background-color: #b9e4e3;\n  background:\
    \ -webkit-gradient(linear, top, left bottom, #beeae9, #a8fcce);\n  -moz-linear-gradient(top,\
    \ #beeae9, #a8fcce);\n  -o-linear-gradient(top, #beeae9, #a8fcce);\n  -ms-linear-gradient(top,\
    \ #beeae9, #a8fcce);\n}\n@submit:hover {\n  color: #333333;\n  border: 1px solid\
    \ #a4a4a4;\n  border-top: 2px solid #b2b2b2;\n  background-color: #a0bcbc4;\n\
    \  background: -webkit-gradient(linear, top, left bottom, #08fcce, #beeae9);\n\
    \  -moz-linear-gradient(top, #a8fcce, #beeae9);\n  -o-linear-gradient(top, #a8fcce,\
    \ #beeae9);\n  -ms-linear-gradient(top, #a8fcce, #beeae9);\n}\n```\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_349_0.png)"
  merge: -1
  pgno: 349
- img_proc: true
  md: "# STYLING FIELDSETS & LEGENDS\n\nCSS chapter-14/styling-fieldsets-and-legends.html\n\
    \n```\nfieldset (\n  width: 350px;\n  border: 1px solid #dcdcdc;\n  border-radius:\
    \ 10px;\n  padding: 20px;\n  text-align: right;\n)\nlegend (\n  background-color:\
    \ #efefef;\n  border: 1px solid #dcdcdc;\n  border-radius: 10px;\n  padding: 10px;\n\
    \  text-align: left;\n  text-transform: uppercase;\n)\n```\n\nFieldsets are particularly\
    \ helpful in determining the edges of a form. In a long form they can help group\
    \ related information within it.\n\nThe legend is used to indicate what information\
    \ is required in the fieldset.\n\nProperties commonly used with these two elements:\n\
    \nwidth is used to control the width of the fieldset. In this example, the width\
    \ of the fieldset forces the elements to wrap onto a new line in the correct place.\
    \ (If it were wider, the items might sit on one line.)\n\nRESULT\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_350_0.png)\n\
    \ncolor is used to control the color of text.\n\nbackground-color is used to change\
    \ the color before these items.\n\nborder is used to control the appearance of\
    \ the border around the fieldset and/or legend.\n\nborder-radius is used to soften\
    \ the edges of these elements in browsers that support this property.\n\npadding\
    \ can be used to add space inside these elements."
  merge: -1
  pgno: 350
- img_proc: true
  md: "# # ALIGNING FORM CONTROLS: PROBLEM\n\nLabels for form elements are often different\
    \ lengths, which means that the form controls will not appear in a straight line.\
    \ This is demonstrated on the right (without CSS applied to the form controls).\n\
    \nIn this form, each topic we ask the user about is placed inside a <div> to ensure\
    \ that each question appears on a new line. It is easier to fill in a form if\
    \ the controls are aligned in a straight vertical line. The CSS on the opposite\
    \ page addresses this.\n\nIf we look at what users their, the two radio buttons\
    \ each have their own <label> (one saying male and another saying female). A <span>\
    \ has been added to the title which will help align these.\n\nOn the previous\
    \ page we saw another technique to align form elements. When the form only contains\
    \ text, by setting all of the text inputs to be the same width, as well as aligning\
    \ all of the form content to the right, the fields line up and the labels are\
    \ in a consistent place. For more complex forms, you will need a solution like\
    \ the one on these pages.\n\n```\nchapter-14/aligning-form-controls-problem.html\n\
    <form action=\"example.php\" method=\"post\">\n<div>\n  <label for=\"name\" class=\"\
    title\">Name:</label>\n  <input type=\"text\" id=\"name\" name=\"name\" />\n</div>\n\
    <div>\n  <label for=\"email\" class=\"title\">Email:</label>\n  <input type=\"\
    email\" id=\"email\" name=\"email\" />\n</div>\n<div class=\"radio-buttons\">\n\
    \  <span class=\"title\">Gender:</span>\n  <input type=\"radio\" name=\"gender\"\
    \ id=\"male\" value=\"M\" />\n  <label for=\"male\">M</label>\n  <input type=\"\
    radio\" name=\"gender\" id=\"female\" value=\"F\" />\n  <label for=\"female\"\
    >F</label>\n</div>\n<div class=\"submit\">\n  <input type=\"submit\" value=\"\
    Register\" id=\"submit\" />\n</div>\n</form>\n```\n\n| Name: |\n| --- |\n| Email:\
    \ |\n| Gender: ◯ M ◯ F |\n| Register |"
  merge: -1
  pgno: 351
- img_proc: true
  md: "# ALIGNING FORM\nCONTROLS: SOLUTION\n\nCSS chapter-14/aligning-form-controls-solution.html\n\
    \n```\ndiv {\n  border-bottom: 1px solid #efefef;\n  margin: 10px;\n  padding-bottom:\
    \ 10px;\n  width: 260px;\n}\ntitle {\n  float: left;\n  width: 100px;\n  text-align:\
    \ right;\n  padding-right: 10px;\n}\nsubmit {\n  text-align: right;\n}\n```\n\n\
    Each row of the form has a title telling users what they need to enter. For the\
    \ text inputs, the title is in the `\\<label>\\` element. For the radio buttons,\
    \ the title is in a `<span><span>\\` element. Both have a class attribute with\
    \ a value of title.\n\nWe can use a property called float to move the titles to\
    \ the left of the page. (The float property is covered in greater detail on pages\
    \ 370-376.)\n\nBy setting the width property on those elements, we know that the\
    \ titles will each take up the same width. Therefore, the form controls next to\
    \ them will line up.\n\nThe text-align property is used to align the titles to\
    \ the right, and padding is used to make sure there is a gap between the text\
    \ in the title boxes and the form controls.\n\nStyles are also applied to the\
    \ `<div>` elements that contain each row of the form (fixing their width and creating\
    \ vertical space between each row). The submit button is also aligned to the right.\n\
    \n# RESULT\n\n| Name: | |\n|---|---|\n| Email: | |\n| Gender: | ◯ ● F |\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_352_0.png)\n\
    \nLISTS TABLES AND FORMS"
  merge: -1
  pgno: 352
- img_proc: true
  md: "# CURSOR STYLES\n\n# cursor\n\nThe cursor property allows you to control the\
    \ type of mouse cursor that should be displayed to users.\n\n```\nchapter-14/cursor.html\n\
    \n<a href=\"http://www.whitmanarchive.org\">\nWalt Whitmann</a>\n```\n\nFor example,\
    \ on a form you might set the cursor to be a hand when the user hovers over it.\n\
    \n```\nCSS\na (\n  cursor: move;\n)\n```\n\n+   auto\ncrosshair\ndefault\npointer\n\
    move\ntext\nwait\nhelp\nurl(\"cursor.gif\");\n\n```\nRESULT\nWalt Whitman\n```\n\
    \nYou should only use these values to add helpful information for users in places\
    \ they would expect to see that cursor. (For example, using a crosshair on a link\
    \ might confuse users because they are not used to seeing it.)"
