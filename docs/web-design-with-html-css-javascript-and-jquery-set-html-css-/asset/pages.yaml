  md: "# # RESPONDING TO USERS\n:hover, :active, :focus\n\nThere are three pseudo-classes\
    \ that allow you to change the appearance of elements when a user is interacting\
    \ with them.\n\napplied when a user hovers over an element with a pointing device\
    \ such as a mouse. This has commonly been used to change the appearance of links\
    \ and buttons when user places their cursor over them. It is worth noting that\
    \ such events do not work on devices touch screens (such as the iPad) because\
    \ the screen is not able to tell when someone is hovering their finger over an\
    \ element.\n\n# :hover\n\n```\ninput {\n  padding: 6px 12px 6px 12px;\n  border:\
    \ 1px solid #665544;\n  color: #ffffff;\n}input.submit:hover {\n  background-color:\
    \ #665544;\n}input.submit:active {\n  background-color: chocolate;\n}input.text\
    \ {\n  color: #cccccc;\n}input.text:focus {\n  color: #665544;\n}\n```\n\n# :active\n\
    \napplied when an element is being activated by a user; for example, when a button\
    \ is being pressed or a link being clicked. Sometimes this is used to make a button\
    \ or link feel more like it is being pressed by changing the style or position\
    \ of the element slightly.\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_297_0.png)\n\
    \n# :focus\n\napplied when an element has focus. Any element that you can interact\
    \ with, such as a link you can click on or any form control has focus.\n\nFocus\
    \ occurs when a browser discovers that you are ready to interact with an element\
    \ on the page. When your cursor is in a form input ready to accept typing, that\
    \ element is said to have focus. It is also\n\npossible to use the key on your\
    \ keyboard to move through the interactive items on a page. When pseudo-classes\
    \ are used, they should appear in the order : :link, :visited, :hover, :active."
