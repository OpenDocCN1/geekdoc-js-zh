  md: '# LAYOUT GRIDS


    Composition in any visual art (such as design, painting, or photography) is the
    placement or arrangement of visual elements — how they are organized on a page.
    Many designers use a grid structure to help them position position items on a
    page, and the same is true for web designers.


    On the right, you can see a set of thick vertical lines superimposed over the
    top of a newspaper website to show you how the page was designed according to
    a grid. This grid is called the 960 pixel grid and is widely used by web designers.


    Grids set consistent proportions and spaces between items which helps to create
    a professional looking design.


    While a grid might seem like a restriction, in actual fact it:


    +   - Creates a continuity between different pages which may use different designs

    - Helps users predict where to find information on various pages

    - Makes it easier to add new content to the site in a consistent way

    - Helps people collaborate on the design of a site in a consistent way


    If you flick back through the pages of this book you will see that it, too, has
    been constructed according to a grid (comprising three columns).


    As you will see on pages 389-390, it is possible to create many different layouts
    using this one versatile grid.'
  merge: -1
  pgno: 393
