  md: '# # TECHNIQUES THAT OFFER A WIDER CHOICE OF TYPEFACES


    There are several ways to use fonts other than those listed on the previous page.
    However, typefaces are subject to copyright, so the techniques you can choose
    from are limited by their respective licenses.


    # ## FONT-FAMILY


    # ## FONT-FACE


    # ## SERVICE-BASED FONT-FACE


    The user''s computer needs the typeface installed. CSS is used to specify the
    typeface.


    CSS specifies where a font can be downloaded if it is not installed on the computer.


    Commercial services give users access to a wider range of fonts using@font-face.


    # ## COVERED ON


    Pages 273-274


    Pages 277-278


    Pages 277-278


    # ## ISSUES


    There is a limited choice of typefaces that most users have installed.


    The user has to download the font file, which can slow down loading of the page.


    There is an ongoing fee to cover licenses paid to font foundries.


    # ## LICENSING


    You are not distributing the typeface, so there is no licensing issue.


    The license to use the font must permit its distribution using @font-face.


    The service takes care of the licensing issues with the people who made the font.


    # ## CHOICE OF TYPEFACES


    There is a limited choice because the font needs to be installed on users'' computers.


    Choice is limited because few typefaces can be freely distributed this way.


    Each service offers a different choice of fonts based on their agreements with
    font foundries.


    SUITABLE FOR ANY LENGTH OF TEXT'
