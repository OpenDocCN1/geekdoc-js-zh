  md: 'CSS allows you to create rules that control the way that each individual box
    (and the contents of that box) is presented.


    In this example, block level elements are shown with red borders, and inline elements
    have green borders.


    # The Cottage Garden


    the cottage garden is a distinct style of garden that uses an informal design,
    dense plantings, and a mixture of ornamental and edible plants.


    The Cottage Garden originated in England and its history can be traced back for
    centuries, although they were re-invented in 1870''s England, when stylized versions
    were formed as a reaction to the more structured and rigorously maintained estate
    gardens.


    The <body> element creates the first box, then the <h1>, <h2>, <p>, <img>, and
    <a> elements create their own boxes within it.


    Using CSS, you could add a border around any of the boxes, specify its width and
    height, or add a background color. You could also control text inside a box —
    for example, its color, size, and the typeface used.


    The earliest cottage gardens were more practical than their modern descendants,
    with an emphasis on vegetables and herbs, with some loose fruit trees.


