  md: "# ABSOLUTE POSITIONING\nposition:absolute\n\nWhen the position property is\
    \ given a value of absolute, the box is taken out of normal flow and no longer\
    \ affects the position of other elements on the page. (They act like it is not\
    \ there.)\n\nThe box offsets properties (top or bottom and left or right) specify\
    \ where element should appear in relation to its containing element.\n\nIn this\
    \ example, the heading has been positioned at the top of the page and 500 pixels\
    \ from its left edge. The width of the heading is set to 250 pixels wide.\n\n\
    The width property has also been applied to the <p> elements in this example to\
    \ prevent the text from overlapping and becoming unreadable.\n\nBy default, most\
    \ browsers apply a margin to the top of the <h1> element. Why is there a gap between\
    \ the browser and the box containing the heading? If you wanted to remove this\
    \ margin, you could add the following code to the <h1> element's style rules;\
    \ margin: 0px;\n\n```\nchapter-15/position-absolute.html\n<body>\n  <h1>The Evolution\
    \ of the Bicycle</h1>\n  <p>In 1817 Baron von Drais invented a walking machine\
    \ that would help him get around the royal gardens after....</p>\n</body>\n```\n\
    \n```\nh1 {\n  position: absolute;\n  top: 0px;\n  left: 500px;\n  width: 250px;\n\
    }\np {\n  width: 450px;\n}\n```\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_373_0.png)\n\
    \n37 LAYOUT"
