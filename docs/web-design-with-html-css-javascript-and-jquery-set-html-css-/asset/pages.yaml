  md: "# ARTICLES\n<article>\n\nThe <article> element acts as a container for any\
    \ section of a page that could stand alone and potentially be syndicated.\n\n\
    This could be an individual article or blog entry, a comment or forum post, or\
    \ any other independent piece of content.\n\nIf a page contains several articles\
    \ (or even summaries of articles), then each individual article would live inside\
    \ its own <article> element.\n\nThe <article> elements can be nested inside each\
    \ other. For example, a blog post might live inside one <article> element and\
    \ each comment on the article could live inside its own <article> element.\n\n\
    ```\nchapter-7/example.html\n<article>\n  <figure>\n    <img src=\"bok-choi.jpg\"\
    \ alt=\"Bok Choi />\n    <figcaption>Bok Choi</figcaption>\n  </figure>\n  <group>\n\
