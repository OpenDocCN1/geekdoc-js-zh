  md: '# FIXED WIDTH LAYOUTS


    Fixed width layout designs do not change size as the user increases or decreases
    the size of their browser window. Measurements tend to be given in pixels.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_387_0.png)


    # ADVANTAGES


    # DISADVANTAGES


    +   - Pixel values are accurate at controlling size and positioning of elements.

    - The designer has greater control over the appearance and position of items on
    the page with liquid layouts.

    - You can control the lengths of lines of text regardless of the size of the user''s
    window.

    - The size of an image will always remain the same relative to the rest of the
    page.


    +   - You can end up with big gaps around the edge of a page.

    - If the user''s screen is a higher resolution than the designer''s screen, the
    page can look smaller and text can be harder to read.

    - If a user increases font sizes, text might not fit into the allotted spaces.

    - The design works best on devices that have a site or resolution similar to that
    of desktop or laptop computers.

    - The page will often take up more vertical space than a liquid layout with the
    same content.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# # LIQUID LAYOUTS


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_388_0.png)


    Liquid layout designs stretch and contract as the user increases or decreases
    the size of their browser window. They tend to use percentages.


