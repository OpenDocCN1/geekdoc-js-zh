  md: "# BORDER WIDTH\nborder-width\n\nThe border-width property is used to control\
    \ the width of a border. The value of this property can be given in pixels or\
    \ using one of the following values:\n\n+   thin\nmedium\nthick\n\n(You cannot\
    \ use percentages with this property.)\n\nYou can control the size of borders\
    \ using four separate properties:\n\n```\nchapter-13/border-width.html\n\n<p class=\"\
    one\">Hohner's \"Clavinet\" is essentially an electric clavichord.</p>\n<p class=\"\
    two\">Hohner's \"Clavinet\" is essentially an electric clavichord.</p>\n<p class=\"\
