  md: "# SHORTHAND background\n\nCSS chapter-16/background-shorthand.html\n\n```\n\
    body {\n  background: #ffffff url(\"images/tulip.gif\")\n  no-repeat top right;\n\
    }\n```\n\nThe background property acts like a shorthand for all of the other background\
    \ properties you have just seen, and also the background-color property.\n\nThe\
    \ properties must be specified in the following order, but you can miss any value\
    \ if you do not want to specify it.\n\n+   1: background-color\n2: background-image\n\
    3: background-repeat\n4: background-attachment\n5: background-position\n\n# RESULT\n\
    \n# Planting Guide\n\n# Magnolia\n\nMagnolia grandiflora commonly known as the\
    \ southern magnolia native to the southern United States, from coastal Virginia\
    \ to central Florida, and to eastern Texas and Oklahoma. Growing 27.5 m (90 ft)\
    \ in height, it is a large striking evergreen tree with large dark green leaves\
    \ and white flowers. Cultivated around the world, cultivars have been bred and\
    \ used commercially to make furniture, pallets, and veneer.\n\n# Rancunculus\n\
    \nRancunculus asiatic (Persian Buttercup) is a species of buttercup (Rancunculus)\
    \ native to the Mediterranean region in eastern Asia, southern Europe (Crete,\
    \ Cyprus and Rhodes), and northeastern Africa. It is a herbaceous perennial growing\
    \ up to 45 cm, with simple or branched stems. The leaves are three-leaved, with\
    \ leaves on the stem more deeply divided; the them are yellow or hairy. The flowers\
    \ are 3–5 cm diameter, variable to pink, yellow, or white, with one several flowers\
    \ on each.\n\n# Tulip\n\nTulip genera L. or \"Tulip\" is a plant belonging to\
    \ the family of Liliaceae. This species has uncertain origins, possibly from Asia,\
    \ and has been naturalised in southern Europe and North Africa. All are derived\
    \ from Tulip genera. The flower and bulb can cause damage through the alkaloid,\
    \ although the bulbs usually with ill-effect. The flower blooms in April and May.\
    \ The plant is resistant to frost, and can tolerate temperatures below freezing\
    \ – a period of temperature is necessary to induce growth and flowering, triggered\
    \ by an increase in sensitivity to the phytloreoxin auxin. The bulbs may be dried\
    \ and pulverized and added to flour.\n\nCSS3 will also support the use of multiple\
    \ background images by repeating the background. Because few flowers are supported\
    \ at the time of writing, it was not commonly used.\n\n```\ndiv {\nbackground:\n\
    \  url(example-1.jpg)\n  no-repeat top left,\n  url(example-2.jpg)\n  no-repeat\
    \ bottom left,\n  repeat-x center top;\n}\n```\n\nThe first image is shown on\
    \ top, with the last one on the bottom.\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_422_0.png)"
