  md: "# USING EXTERNAL CSS\n\n# &lt;link&gt;\n\n&lt;link&gt; element can be used\
    \ in an HTML document to tell the browser how to style the page. It is an empty\
    \ element (meaning it does not need a closing tag), and it lives inside the &lt;head&gt;\
    \ element. It should use three attributes:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>Using External CSS</title>\n  <link href=\"styles.css\" type=\"text/css\"\
    \ rel=\"stylesheet\" />\n</head>\n<body>\n  <h1>Potatoes</h1>\n  <p>Potatoes are\
    \ dozens of different potato varieties. They are usually described as early, early\
    \ and maincrops.</p>\n</body>\n</html>\n```\n\n# href\n\nThis specifies the path\
    \ to the CSS file (which is often placed in a folder called css or styles).\n\n\
    # type\n\nThis attribute specifies the type of document being linked to. The value\
    \ should be text/css..\n\n# rel\n\nThis specifies the relationship between the\
    \ HTML page and the file it is linked to. The value should be stylesheet when\
    \ linking to a CSS file.\n\nAn HTML page can use more than one CSS style. To do\
    \ this it could have a &lt;link&gt; element for every CSS file it uses. For example,\
    \ some authors use one CSS file to control the presentation (such as fonts and\
    \ colors) and a second to control the layout.\n\n```\nbody {\n  font-family: arial;\n\
    \  background-color: rgb(185,179,175);\n}\nh1 {\n  color: rgb(255,255,255);\n\
    }\n```\n\n# Potatoes\n\nThere are dozens of different potato varieties. They are\
    \ usually described as early, early and maincrops potatoes."
