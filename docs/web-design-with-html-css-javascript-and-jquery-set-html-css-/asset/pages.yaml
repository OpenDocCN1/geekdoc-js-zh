  md: '# HTML5: EMAIL & URL INPUT


    # <input>


    HTML5 has also introduced inputs that allow visitors to enter email addresses
    and URLs. Browsers that do not support these input types will just treat them
    as boxes.


    ```

    chapter-07/html15-email-input.html HTML

    ```


    ```

    <form action="http://www.example.org/subscribe.php">

    <p>Please enter your email address:</p>

    <input type="email" name="email" />

    <input type="submit" value="Submit" />

    </form>

    ```


    # type="email",


    If you ask for an email address, you can use the email input. Browsers that support
    HTML5 validation will check that the user has provided information in the correct
    format of an email address. Some smart phones also optimize their keyboard to
    display the keys they are most likely to need when entering an email (such as
    the @).


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_173_0.png)


    ```

    chapter-07/html15-url-input.html HTML

    ```


    ```

    <form action="http://www.example.org/profile.php">

    <p>Please enter your website address:</p>

    <input type="url" name="website" />

    <input type="submit" value="Submit" />

    </form>

    ```


    # type="url",


    A URL input can be used when you are asking a user for a web page address. Browsers
    that support HTML validation will check that the user provided information in
    the format of a URL. Some smart phones also optimize their keyboard to display
    the keys you are most likely to need when entering a URL.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_173_1.png)'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# HTML5: SEARCH INPUT


    | HTML | chapter-07/html5-search-input.html |

    |---|---|

    | | <form action="http://www.example.org/search.php">

    <p>Search:</p>

    <input type="search" name="search" />

    <input type="submit" value="Search" />

    </form> |


    # <input>


    If you want to create a single line box for search queries, HTML5 provides a special
    type of input for that purpose.


    # type="search"


    | RESULT | |

    |---|---|

    | Search: Thelonius [ ] Search |


    If you want to create a single line box for search queries, HTML5 provides a special
    search input.


    To create the HTML5 search box the <input> element should have a type attribute
    value search. Older browsers will simply treat it like a single line box.


    | HTML | chapter-07/html5-placeholder.html |

    |---|---|

    | <form action="http://www.example.org/search.php">

    <p>Search:</p>

    <input type="search" name="search" placeholder="Enter keyword" />

    <input type="submit" value="Search" />

    </form> |


    Recent browsers add some features that improve usability. For example, Safari
    on a Mac adds a cross to the search box when you have to enter information. Safari
    also automatically rounds the corners on the search field.


    # placeholder


    | RESULT | |

    |---|---|

    | Search: [ Enter keyword ] [ ] |


    On any text input, you can also use an attribute placeholder whose value is text
    that will be shown in the text box until the user clicks in that area. Older browsers
    ignore this attribute.'
