  md: "# TABLE HEADINGS\n\n```\nHTML chapter-06/table-headings.html\n<table>\n  <tr>\n\
    \    <th>col</th>\n    <th scope=\"col\">Saturday</th>\n    <th scope=\"col\"\
    >Sunday</th>\n  </tr>\n  <tr>\n    <th scope=\"row\">Tickets sold:</th>\n    <td>120</td>\n\
    \    <td>135</td>\n  </tr>\n  <tr>\n    <th scope=\"row\">Total sales:</th>\n\
    \    <td>$600</td>\n    <td>$675</td>\n  </tr>\n</table>\n```\n\nThe `<th>` element\
    \ is used just like the `<td>` element but its purpose is to represent the heading\
    \ for either a column or a row. (The `th` stands for table heading.)\n\nEven if\
    \ a cell has no content, you should still use a `<td>` or `<th>` element to represent\
    \ the presence of an empty cell otherwise the table will not render correctly.\
    \ (The first cell in the first row of this example shows an empty cell.)\n\nUsing\
    \ th elements helps people who use screen readers, improves the ability for search\
    \ engines to index your pages, and gives you greater control over the appearance\
    \ of tables when you use CSS.\n\nYou can use the scope attribute on the `<th>`\
    \ element to indicate whether it is a heading for a column or a row. It can take\
    \ the values row to indicate a heading for a row or col to indicate a heading\
    \ for a column.\n\n| | Saturday | Sunday |\n|---|---||\n| Tickets sold: | 120\
    \ | 135 |\n| Total sales: | $600 | $675 |\n\nBrowsers usually display the content\
    \ of a `<th>` element in bold and in the middle of the cell."
  merge: -1
  pgno: 138
- img_proc: true
  md: '# SPANNING COLUMNS


    Sometimes you may need the entries in a table to stretch across more than one
    column.


    The colspan attribute can be used on a `<th></th>` or `<td><td>` element and indicates
    how many columns that cell should run across.


    ```

    chapter-06/spanning-columns.html

    <table>

    <tr>

    <th></th>

    <th>9am</th>

    <th>10am</th>

    <th>11am</th>

    <th>12am</th>

    </tr>

    <tr>

    <th>Monday</th>

    <td colspan="2">Geography</td>

    <td>Math</td>

    <td>Art</td>

    </tr>

    <tr>

    <th>Tuesday</th>

    <td colspan="3">Gym</td>

    <td>Home</td>n<td>Ec</td>

    </tr>

    </table>

    ```


    In the example you can see a timetable with five columns; the first column contains
    the heading for that row (the day), the remaining four represent one hour slots.


    If you look at the table that contains the words ''Geography'' you will see that
    the value of the colspan attribute is 2, which indicates that the cell should
    run across two columns. In the third row, ''Gym'' runs across three columns.


    You can see that the second and third rows have fewer `<td>` elements than there
    are columns. This is because, a cell extends across more than one column, the
    `<td>` or `<th>` cells that would have been in the place of the wider cells are
    not included in the code.


    | 9am | 10am | 11am | 12am |

    |---|---|---|---||

    | Geography | | Math | Art |

    | Tuesday | Gym | | Home Ec |


    I added CSS styles to this example so that you can see how the cells span more
    than one column. You will learn how to do this on pages 250, 337-340.'
  merge: -1
  pgno: 139
