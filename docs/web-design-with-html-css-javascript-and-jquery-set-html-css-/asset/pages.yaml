  md: '# CHOOSING A TYPEFACEnFOR YOUR WEBSITE


    When choosing a typeface, it is important to understand that a browser will usually
    display it if it''s installed on that user''s computer.


    # SERIF


    Serif fonts have extra details on the end of the main strokes of the letters.


    # SANS-SERIF


    Sans-serif fonts have straight ends to letters and therefore have a much cleaner
    design.


    EXAMPLES:


    EXAMPLES:


    +   - Georgia

    - Times

    - Times New Roman


    +   - Arial

    - Verdana

    - Helvetica


    As a result, sites often use a small set of typefaces that are installed on most
    computers (shown above). There are some techniques to get around this limitation
    (which are covered on pages 271-272).


    It is possible to specify more than one typeface and create an order of preference
    (in case the user does not have your first choice of typeface installed). This
    is sometimes referred to as a font stack.'
