  md: '# SCREEN SIZES


    Different visitors to your site will have different sized screens that show different
    amounts of information, so your design needs to be able to work on a range of
    different sized screens.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_383_0.png)


    iPhone 4

    Size: 3.5 inches

    Resolution: 960 x 640 pixels


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_383_1.png)


    iPad 2

    Size: 9.7 inches

    Resolution: 1024 x 768 pixels


    When designing for print, you always know the size of the piece of paper that
    your design will be printed on. However, when it comes to designing for the web,
    you are faced with the unique challenge that different users will have different
    sized screens.


    Since computers have been sold to the public, the size of screens has been steadily
    increasing. This means that some people viewing your site might have 13 inch monitors
    while others have 27+ monitors.


    The size of a user''s screen affects how big they can open their windows and how
    much of the page they will see. There is also an increasing number of handheld
    devices (mobile phones and tablets) that have smaller screens.'
  merge: -1
  pgno: 383
- img_proc: true
  md: '# # SCREEN RESOLUTION


    Resolution refers to the number of dots a screen shows per inch. Some devices
    have a higher resolution than desktop computers and most operating systems allow
    users to adjust the resolution of their screens.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_384_0.png)


    13" MacBook

    Size: 13.3 inches

    Resolution: 1280 x 800 pixels


    27" iMac

    Size: 27 inches

    Resolution: 2560 x 1440 pixels


    | Resolutions |

    | --- |

    | 720 x 480 |

    | 720 x 480 (stretched) |

    | 800 x 600 |

    | 800 x 600 (stretched) |

    | 1024 x 768 |

    | 1024 x 768 (stretched) |

    | 1280 x 800 |


    Most computers will allow owners to adjust the display or the number of pixels
    that are shown on the screen. For example, here you can see the options to change
    the screen size from 720 to 480 pixels up to 1280 x 800 pixels.


    It is interesting to note that the higher the resolution, the smaller the text
    appears. Many mobile devices have screens that are higher resolution than their
    desktop counterparts.'
  merge: -1
  pgno: 384
