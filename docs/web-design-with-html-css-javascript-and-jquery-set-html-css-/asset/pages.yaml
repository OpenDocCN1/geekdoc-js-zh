  md: "# DOCTYPES\n\nBecause there have been several versions of HTML, each web page\
    \ should begin with a DOCTYPE declaration to tell a browser which version of HTML\
    \ the page is using (although browsers usually display the page even if it is\
    \ not included). We will therefore include one in each example for the rest of\
    \ the book.\n\nAs you will see when we come to CSS and its box model on page 316,\
    \ the use of a DOCTYPE can also help the browser to render a page correctly.\n\
    \nBecause XHTML was written in XML, you will sometimes see pages that use the\
    \ XHTML strict DOCTYPE start with the optional XML declaration. Where this is\
    \ used, it should be the first thing in a document. There must be nothing before\
    \ it, not even a space.\n\n| HTML5 | HTML |\n|---||\n| <!DOCTYPE html> |\n\nHTML\
    \ 4\n\n```\n<!DOCTYPE html PUBLIC\n  \"//W3C//DTD HTML 4.01 Transitional//EN\"\
    \n  \"http://www.w3.org/TR/html44/loose.dtd\">\n```\n\nTransitional XHTML 1.0\n\
    \n```\n<!DOCTYPE html PUBLIC\n  \"//W3C//DTD XHTML 1.0 Transitional//EN\"\n  \"\
    http://www.w3.org/TR/xhtml11/DTD/\nxhtml11-transitional.dtd\">\n```\n\nStrict\
    \ XHTML 1.0\n\n```\n<!DOCTYPE html PUBLIC\n  \"//W3C//DTD XHTML 1.0 Strict//EN\"\
    \n  \"http://www.w3.org/TR/xhtml11/DTD/\nxhtml11-strict.dtd\">\n```\n\nXML Declaration\n\
    \n```\n<?xml version=\"1.0\" ?>\n```"
  merge: -1
