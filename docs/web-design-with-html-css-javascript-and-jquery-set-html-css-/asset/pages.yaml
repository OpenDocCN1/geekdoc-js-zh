  md: "# # CSS3: OPACITY\nopacity, rgba\n\n| CSS | chapter-11/opacity.html |\n\n```\n\
    ```css\np.one (\n  background-color: rgb(0,0,0);\n  opacity: 0.5;\nnp.two (\n\
    \  background-color: rgb(0,0,0);\n  background-color: rgba(0,0,0,0.5);\n)\n```\n\
    ```\n\nCSS3 introduces the opacity property which allows you to specify the opacity\
    \ of an element and any of its child elements. The value is a number between 0.0\
    \ and 1.0 (so a value of 0.5 is 50% opacity and 0.15 is 15% opacity).\n\n| RESULT\
    \ |\n\nThe CSS3 rgba property allows you to specify a color, just like you would\
    \ with an RGB value, but adds a fourth value to indicate opacity. This value is\
    \ known as an alpha value and is a number between 0.0 and 1.0 (so a value of 0.5\
    \ is 50% opacity and 0.15 is 15% opacity). The rgba value will only affect the\
    \ element on which it is applied (not child elements).\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_260_0.png)\n\
    \nBecause some browsers will not recognize RG colors, you can offer a fallback\
    \ so that they display a solid color. If there are two rules that apply to the\
    \ same element, the latter of the two will take priority. To create the fallback,\
    \ you can specify a color as a hex code, color name or RGB value, followed by\
    \ the rule that specifies an RGBA value. If the browser understands RGBA colors\
    \ it will use that rule. If it doesn't, it will use the RGB value.\n\n| RESULT\
    \ IN OLDER BROWSER |\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_260_1.png)\n\n\
    At the time of writing, the opacity and rgba properties are only supported by\
    \ the most recent browsers."
  merge: -1
