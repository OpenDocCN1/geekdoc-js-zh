  md: '# ADDING IMAGES


    # <img></img>


    To add an image into the page you need to use an <img> element. It is an empty
    element (which means there is no closing tag). It must carry the following two
    attributes:


    ```

    chapter-05/adding-images.html  HTML

    <img src="images/quokka.jpg" alt="A family of quokka" title="The quokka is an
    Australian marsupial that is similar in size to the domestic cat." />

    ```


    # src


    This tells the browser where it can find the image file. This will usually be
    a relative URL pointing to an image on your site. (Here you can see that the images
    are in a child folder called images — relative URLs were covered on pages 83–84).


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_105_0.png)


    # alt


    This provides a text description of the image which describes the image if you
    cannot see it.


    # title


    You can also use the title attribute with the <img> element to provide additional
    information about the image. Most browsers will display the content of theのである
    in a tooltip when the user hovers over the image.


    The text referred to the alt attribute is often referred as alt text. It should
    give an accurate description of the image content so it can be understood by screen
    reader software (used by people with visual impairments) and search engines.


    If the image is just to make a page attractive (and it has no meaning, such as
    a graphic dividing line), then the alt attribute should still be used but the
    quotes should be left empty.'
  merge: -1
