  md: "# MARGIN\nmargin\n\n# HTML\nchapter-13/margin.html\n\n```\n<p>Analog synthesizers\
    \ are often said to have a\n\"warmer\" sound than their digital counterparts.\n\
    </p>\n<p class=\"example\">Analog synthesizers are often\nsaid to have a \"warmer\"\
    \ sound than their digital\ncounterparts.</p>\n```\n\nThe margin property controls\
    \ the gap between boxes. Its value is commonly given in pixels, although you may\
    \ also use percentages or ems.\n\nIf one box sits on top of another, margins are\
    \ collapsed, which means the larger of the two margins will be used and the smaller\
    \ will be disregarded.\n\n# CSS\n\n```\np {\n  width: 200px;\n  border: 2px solid\
    \ #0088dd;\n  padding: 10px;\n}\np.example {\n  margin: 20px;\n}\n```\n\nPlease\
    \ note: if the width of a box is specified then the margin is added to the width\
    \ of the box.\n\nYou can specify values for each side of a box:\n\n# RESULT\n\n\
    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_320_0.png)\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_320_1.png)\n\
    \n```\nmargin-top:\nmargin-right:\nmargin-bottom:\nmargin-left:\n```\n\nYou can\
    \ also use the shorthand (where the values are in clockwise order: top, right,\
    \ bottom, left): margin: 1px 2px 3px 4px;\n\nSomtimes you see this means the left\
    \ and right margins should be 10 pixels and the top and bottom margins should\
    \ be 20 pixels: margin: 20px 10px;\n\nThe value of the margin property is not\
    \ inherited by child elements in the same way that the color value of the font-family\
    \ property is, you need to set the margin in for every element that needs to use\
    \ it.\n\nUp until Internet Explorer 6, the width of the box would include the\
    \ padding and margins. You can see more about this on page 316.\n\n(This same\
    \ shorthand above can also be applied to padding.)"
