  md: '# IMAGE DIMENSIONS


    The images you use on your website should be saved at the same width and height
    that you want them to appear on the page.


    For example, if you have designed a page to include an image that is 300 pixels
    wide by 150 pixels tall, the image you use may need to use image editing tools
    to resize and crop the image


    When sourcing images, it is important to understand how you can alter the dimensions
    of an image; imagine that you have designed a web page to include an image that
    is 300 pixels wide by 150 pixels tall:


    # ONLINE EXTRA


    Visit the tools section of the website accompanying this book to watch a video
    guide to resizing images in Photoshop and GIMP.


    # REDUCING IMAGE SIZE


    You can reduce the size of images to create a smaller version of the image.


    # INCREASING IMAGE SIZE


    You can''t increase the size of photos significantly without affecting the image
    quality.


    # CHANGING SHAPE


    Only some images can be cropped without losing valuable information (see next
    page).


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_119_0.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_119_1.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_119_2.png)


    Example: If your image is 600 pixels wide and 300 pixels tall, you can reduce
    the size of the image by 50%.


    Example: If your image is only 100 pixels wide by 50 pixels tall, increasing the
    size by 300% would result in poor quality.


    Example: If your image is 300 pixels square, you can remove parts of it, but in
    doing so you might lose valuable information.


    Result: This will create an image that is quicker to download.


    Result: The image will look blurry or blocky.


    Result: Only some images can be cropped and still make sense.'
