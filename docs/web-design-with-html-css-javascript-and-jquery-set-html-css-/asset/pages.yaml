  md: "# CHANGE INLINE/BLOCK\ndisplay\n\nThe display property allows you to turn an\
    \ inline element into a block-level element or versa, and can also be used to\
    \ hide an element from the page.\n\nThe values this property can take:\n\n```\n\
    chapter-13/display.html\n<ul>\n  <li>Home</li>\n  <li>Products</li>\n  <li class=\"\
    coming-soon\">Services</li>\n  <li>About</li>\n  <li>Contact</li>\n</ul>\n```\n\
    \n# inline\n\nThis causes a block-level element to act like an inline element.\n\
    \n```\nCSS\nli {\n  display: inline;\n  margin-right: 10px;\n}\nli.coming-soon\
    \ {\n  display: none;\n}\n```\n\n# block\n\nThis causes an inline element to act\
    \ like a block-level element.\n\n# inline-block\n\nThis causes a block-level element\
    \ to flow like an inline element, while retaining features of a block-level element.\n\
    \nRESULT\nHome Products About Contact\n\n# none\n\nThis hides an element from\
    \ the page. In this case, the element acts as though it is not on the page at\
    \ all (although a user could still see the content of the box if they used the\
    \ `view source` option in their browser).\n\nIf you use this property, it is important\
    \ to note that inline boxes are **not** supposed to create block-level elements.\n\
    \nIn this example you can see a list. Each item in the list is usually treated\
    \ as a block-level element, but the rule for the `<li>` elements indicates they\
    \ should be treated as inline elements, which they will sit alongside each other\
    \ appearing on new lines.\n\nThis technique is often used to create navigation\
    \ for a site, and in this example has a margin added to the right of each of the\
    \ items to separate them out. The rule that applies to the `<li>` element whose\
    \ class is `coming-soon` has been hidden as if it were not in the page at all."
  merge: -1
  pgno: 323
- img_proc: true
  md: "# # HIDING BOXES\nvisibility\n\n```\nHTML\n<ul>\n  <li>Home</li>\n  <li>Products</li>\n\
    \  <li class=\"coming-soon\">Services</li>\n  <li>About</li>\n  <li>Contact</li>\n\
    </ul>\n```\n\nThe visibility property allows you to hide boxes from users but\
    \ it leaves a space where the element would have been.\n\nThis property can take\
    \ two values:\n\nhidden\nThis shows the element.\n\n```\nCSS\nli {\n  display:\
    \ inline;\n  margin-right: 10px;\n}\nli.coming-soon {\n  visibility: hidden;\n\
    }\n```\n\nvisible\nThis shows the element.\n\nIf the visibility of an element\
    \ is set to hidden, a blank space will appear in its place.\n\nIf you do not want\
    \ a blank space to appear, then you should use the display property with a value\
    \ of none instead (as covered on the previous page).\n\nPlease note that anyone\
    \ can view the contents of any elements whose visibility property has been set\
    \ to hidden by viewing the source in their browser.\n\n```\nRESULT\n```\n\nHome\
    \ Products About Contact"
