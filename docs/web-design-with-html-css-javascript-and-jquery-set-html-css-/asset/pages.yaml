  md: '# BORDER COLOR

    border-color


    You can specify the color of a border using either RGB values, hex codes or CSS
    color names (as you saw on pages 251-252).


    It is possible to individually control the colors of the borders on different
    sides of a box using:


    ```

    border-top-color

    border-right-color

    border-bottom-color

    border-left-color

    ```


    It is also possible to use a shorthand to control all four border colors in the
    one property:


    ```

    border-color: darkcyan

    deeepink darkcyan

    deeepink:

    ```


    The values appear here in clockwise order: top, right, bottom, left.


    You could also use HSL to specify the color as shown on pages 255-256. However,
    these were only introduced in CSS3 and will not work in older browsers.


    ```

    chapter-13/border-color.html

    <p class="one">The ARP Odyssey was introduced in 1972.</</p>

    <p class="two">The ARP Odyssey was introduced in 1972.</</p>

    ```


    ```

    p.one (

    border-color: #0088dd);

    p.two (

    border-color: #bbbaaa #111111 #ee3e80 #0088dd);

    ```


