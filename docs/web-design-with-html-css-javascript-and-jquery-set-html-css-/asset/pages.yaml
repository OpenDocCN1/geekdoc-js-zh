  md: '# HTML5: MULTIPLE VIDEO SOURCES


    ```

    <source>

    ```


    To specify the location of the file to be played, you can use the <source> element
    inside the <video> element. (This should replace the src attribute in the opening
    <video> tag.)


    You can also use <source> elements to specify that the video is available in different
    formats.


    (Due to a bug on the iPad, you should provide the MP4 video as the first format.
    Otherwise, it might not play.)


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>Multiple Video Sources</title>

    </head>

    <body>

    <video poster="images/puppy.jpg" width="320" height=" controls>

    <source src="video/puppy.mp4" type="video/mp4; codecs="avc1.c42E01E,mp4a.40.2"
    />

    <source src="video/puppy.webm" type="video/webm; codecs="vp8, vorbis" />

    <p>A video of a puppy playing in the snow</p>

    </body>

    </html>

    ```


    # src


    This attribute specifies the path to the video.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_221_0.png)


    # type


    You should use this attribute to tell the browser what format the video is in.
    Otherwise, it will download some of the video to see if it can play the file (which
    will take time and bandwidth).


    # codec


    The codec that was used to encode the video is supplied within the type attribute.
    Note the use of single quotes, as well as double quotes in the type attribute,
    when it is supplied.


    If the browser does not support the <video> element or the format of video used,
    it will display whatever is between the opening <video> and closing </video> tags.


    We have provided links to tools that help you encode videos and audio into the
    correct formats in the Tools section of the website.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# # HTML5: COMBINING FLASH & HTML5 VIDEO


    By offering your videos in both HTML5 and Flash Video formats, you will ensure
    that it can be viewed by the majority of users on your site.


    You may choose to offer HTML5 as the first option, and Flash video as a fallback
    for people whose browser does not support HTML5 video. Or you may work the other
    way around.


    Because some of the video players built in Flash support H264 encoding, if you
    use a player that supports this format you would only need to provide the video
    in H264 and WebM formats. (You would not need it in FLV format as well.) You will
    see this demonstrated in the example at the end of the chapter.


    If you start to work with HTML5 video in depth, you can also:


    +   - Create your own playback controls

    - Provide different versions of the video for browsers that have different sized
    screens (so you can provide lower resolution content for handheld devices)

    - Tell different parts of a page to change when the video reaches a certain point'
  merge: -1
  pgno: 222
