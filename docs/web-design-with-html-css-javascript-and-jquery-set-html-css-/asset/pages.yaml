  md: "# # PADDING\npadding\n\nThe padding allows you to specify how much space should\
    \ appear between the content of an element and its border.\n\nThe value of this\
    \ property is most often specified in pixels (although it is also possible to\
    \ use percentages or ems). If a percentage is used, the padding is a percentage\
    \ of the browser window (or of the containing box if it is another box).\n\nPlease\
    \ note: If a width is specified for padding, the second is added to the width\
    \ of the box.\n\nAs you can see, the second paragraph here is much easier to read\
    \ because there is space between the text and the border of the box. The box is\
    \ also wider because it has padding.\n\nYou can specify different values for each\
    \ side of a box:\n\n+   - padding-top\n- padding-right\n- padding-bottom\n- padding-left\n\
    \nOr you can use a shorthand (where the values are in clockwise order: top, right,\
    \ bottom, left):\n\npadding: 10px 5px 3px 1px;\n\n```\nchapter-13/padding.html\n\
    <p>Analog synths produce a wave sound, whereas sounds stored on a digital synth\
    \ have been sampled and then turned into numbers.</p>\n<p class=\"example\">Analog\
    \ synths produce a wave sound, whereas the sounds stored on a digital synth have\
    \ been sampled and then ...</p>\n```\n\n```\np {\n  width: 275px;\n  border: 2px\
    \ solid #0088dd;\n}\np.example {\n  padding: 10px;\n}\n```\n\n> Analog synths\
    \ produce a wave sound, whereas the sounds stored on a digital synth have been\
    \ sampled and then turned into numbers.\n\n> Analog synths produce a wave sound,\
    \ whereas the sounds stored on a digital synth have been sampled and then turned\
    \ into numbers.\n\nThe value of the property is not inherited by child elements\
    \ in the same way that the color of the font-family property is; so you need to\
    \ specify the padding for every element that needs to use it.\n\nUp until Internet\
    \ Explorer 6, the width of the box would include the padding and margins. You\
    \ can see more about this page 316."
  merge: -1
  pgno: 319
