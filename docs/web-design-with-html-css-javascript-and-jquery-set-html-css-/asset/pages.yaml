  md: '# RELATIVE FOLDER LINK TYPE


    # EXAMPLE (from diagram on previous page)


    # SAME FOLDER


    To link to a file in the same folder, just use the file name. (Nothing else is
    needed.)


    To link to music reviews from the music homepage: <a href="reviews.html">Reviews</a>


    # CHILD FOLDER


    For a child folder, use the name of the child folder, followed by a forward slash,
    then the file name.


    To link to music listings from the homepage: <a href="music/listings.html">/</a>


    # GRANDCHILD FOLDER


    Use the name of the child folder, followed by a forward slash, then the name of
    the grandchild folder, followed by another forward slash, then the file name.


    To link to the homepage from the reviews: <a href="movies/dvd/reviews.html">Reviews</a>


    # PARENT FOLDER


    Use ../ to indicate the folder above the current one, then follow it with the
    file name.


    To link to the homepage from the reviews: <a href="../index.html">Home</a>


    # GRANDPARENT FOLDER


    Repeat ../ to indicate that you want to go up two folders (rather than one), then
    follow it with the file name.


    To link to the homepage from the DVD reviews: <a href="../index.html">Home</a>


    When a website is live (that is, uploaded to a web server) you may see a couple
    of other techniques used that do not work when the files are on your local computer.


    For example, you may see the name of a child folder without the name of a file.
    In this case the web server will usually try to show the homepage for that section.


    A forward slash will return the homepage for the entire site, and a forward slash
    followed by a file name will return that it is in the root directory.'
  merge: -1
