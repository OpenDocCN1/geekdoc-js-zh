- img_proc: true
  md: "# PASSWORD INPUT\n\n```\nchapter-07/password-input.html  HTML\n<form action=\"\
    http://www.example.com/login.php\">\n  <p>Username:\n  <input type=\"text\" name=\"\
    username\" size=\"15\" maxlength=\"30\" />\n</p>\n  <p>Password:\n  <input type=\"\
    password\" name=\"password\" size=\"15\" maxlength=\"30\" />\n</p>\n</form>\n\
    ```\n\n<input type=\"password\">\nWhen the type attribute has a value of password\
    \ it creates a text box that acts just like a single-line text input, except the\
    \ characters are blocked out. They are hidden in this way if someone is looking\
    \ over the user's shoulder, they cannot see sensitive data such as passwords.\n\
    \nname\nThe attribute indicates the name of the password input, which is sent\
    \ to the server with the password user enters.\n\n| Username: | |\n| Password:\
    \ | |\n\nsize, maxLength\nIt can also carry the size and maxLength attributes\
    \ like the single-line text input.\n\nAlthough the password is hidden on the screen,\
    \ this does not mean that the data in a password control is sent securely to the\
    \ server. You should never use these for sending sensitive data such as credit\
    \ card numbers.\n\nFor full security, the server needs to be set up to communicate\
    \ with users using browsers via Secure Sockets Layer (SSL). The topic of SSL is\
    \ beyond the scope of this book, however there are links to learn more about the\
    \ accompanying website."
