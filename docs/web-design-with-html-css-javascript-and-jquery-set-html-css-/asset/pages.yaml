  md: "# IFRAMES\n\n# &lt;iframe&gt;\n\nAn iframe is like a little window that has\
    \ been cut into your page — and in that window you can see another page. The term\
    \ iframe is an abbreviation of inline frame.\n\nOne common use of iframes (that\
    \ you may have seen on websites) is to embed a Google Map into a page. The content\
    \ of the iframe can be any html page (either on the same server or anywhere else\
    \ on the web).\n\nAn iframe is created using the &lt;iframe&gt; element. It has\
    \ a few attributes that you will need to know to use it:\n\n# src\n\nThe src attribute\
    \ specifies the URL of the page to show in the frame.\n\n# height\n\nThe height\
    \ attribute specifies the height of the iframe in pixels.\n\n# width\n\nThe width\
    \ attribute specifies the width of the iframe in pixels.\n\nchapter-08/iframes.html\
    \ | HTML\n\n```\n&lt;iframe\n  width=\"450\"\n  height=\"350\"\n  src=\"http://maps.google.co.uk/maps?q=moma-new+york&amp;output=embed\"\
    \\gt;\n&lt;/iframe&gt;\n```\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_195_0.png)"
