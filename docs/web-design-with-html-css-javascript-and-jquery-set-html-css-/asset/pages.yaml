  md: '# WHY PEOPLE VISIT YOUR WEBSITE


    Now that you know who your visitors are, you need to consider why they are coming.
    While some people will simply chance across your website, most will visit for
    a specific reason.


    Your content and design should be influenced by the goals of your users.


    # KEY MOTIVATIONS


    # SPECIFIC GOALS


    To help determine why people are coming to your website, there are two basic categories
    of questions you can ask:


    +   - Are they looking for general entertainment or do they need to achieve a
    specific goal?


    +   - If there is a specific goal, is it a personal or professional one?


    +   - Do they see spending time on this activity as essential or as luxury?


    +   - Do they want general information / research (such as a topic / company),
    or are they after something specific (such as a particular fact or information
    on a product)?


    +   - Are they already familiar with the service or product that you offer or
    do they need to be introduced to?


    +   - Are they looking for time sensitive information, such as the latest news
    or updates on a particular topic?


    +   - Do they want to discover information about a specific product or service
    to help them decide whether to buy it or not?


    +   - Do they need to contact you? If so, can they visit in person (which might
    require opening hours and a map)? Or might they need email or telephone contact
    details?


    +   1: The first attempts to discover the underlying motivations for why visitors
    come to the site.


    +   2: The second examines the specific goals of the visitors. These are the triggers
    making them come to the site now.'
  merge: -1
  pgno: 463
- img_proc: true
  md: '# WHAT YOUR VISITORS ARE TRYING TO ACHIEVE


    First you want to create a list of reasons why people would be coming to your
    site. You can assign the list of tasks to the fictional visitors you created in
    the step described on the previous page.


    It is unlikely that you will be able to list every reason why someone visits your
    site but you are looking for key tasks and motivations. This information can help
    guide your site designs.


    GORDON bought a tennis racquet several years ago; now he wants to purchase one
    from your site for his girlfriend.


    MOLLY has read about your new puppy daycare service in the press and wants to
    find out whether it would be suitable for her use.


    JAS had a bad experience staying in a hotel when visiting Sydney, Australia, and
    wants to make a complaint.


    AYO hopes to study architecture and wants to learn more about a new course that
    is being offered.


    IVY is a picture editor and wants to look at a photographer’s site to see examples
    of his work before deciding whether to commission him.'
