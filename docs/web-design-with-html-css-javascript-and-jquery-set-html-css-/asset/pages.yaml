  md: '# SEARCH ENGINE OPTIMIZATION (SEO)


    SEO is a huge topic and several books have been written on the subject. The following
    pages will help you understand the key concepts so you can improve your website''s
    visibility on search engines.


    # THE BASICS


    # ON-PAGE TECHNIQUES


    # OFF-PAGE TECHNIQUES


    Search engine optimization (or SEO) is the practice of trying to help your site
    appear near the top of search engine results when people look for the topics that
    website covers.


    On-page techniques are the methods you can use on your web pages to improve their
    rating in search engines.


    Getting other sites to link to you is just as important as on-page techniques.
    Search engines help determine how to rank your site by the number of other sites
    that link to you.


    At the heart of SEO is the idea of working out which terms are likely to enter
    into search engine and then using these in the right places on your site to increase
    the chances that search engines will link your site to yours.


    The main component of this is looking at keywords that people are likely to enter
    into search engine if they wanted to find your site, and then including these
    in the text and HTML code for your site in order to help search engines know what
    site covers these topics.


    They are particularly interested in sites whose content is related to yours. For
    example, if you were running a website that sold fish bait, then a link from a
    hairdresser is not likely to be considered as relevant as one from an angling
    industry.


    In order to determine comes first in the search results, search engines do not
    only what appears on your site. They also consider how many links are to you (and
    how relevant those links are). For this reason, SEO is split into two areas: on-page
    techniques and off-page techniques.


    Search engines rely very heavily on the text that is in pages so it is important
    that the keywords people are searching for are in text. There are seven essential
    places where you want your keywords to appear.


    Search engines also look at the words between the `<a>` tag and closing `</a>`
    tag in the link. If the text link contains keywords (rather than just click *here*
    or your website address) it may be considered more relevant.


    Ensuring that any images have appropriate text in the value of their `alt` attribute
    also helps search engines understand the content of images.


    The words that appear in links to you should also appear in the text of the page
    that the site links to.'
  merge: -1
  pgno: 485
- img_proc: true
  md: '# ON-PAGE SEO


    In every page of your website there are seven places where keywords (the words
    people might search on to find your site) can appear in order to improve its findability.


    # 1: PAGE TITLE


    The page title appears at the top of the browser window or tab of a browser. It
    is specified in the <head> element which lives inside the <title> element.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_486_0.png)


    # 2: URL / WEB ADDRESS


    The name of the file is part of the URL. Where possible, use keywords in the file
    name.


    # 3: HEADINGS


    If the keywords are in a <h1> element then a search engine will know that this
    page is all about that subject and give it greater weight than other.


    # 4: TEXT


    Where it helps to repeat the keywords in the main body of the text at least 2-3
    times. Do not, however, overuse these terms, because the text must be easy for
    a human to read.


    # 5: LINK TEXT


    Use the keywords in the text create links between pages (rather than using expressions
    like "click here")


    # 7: PAGE DESCRIPTIONS


    The description lives inside the <head> element and is specified using a <meta>
    tag. It should be the content of the page. (These are not shown in the browser
    window but may be displayed in the results of search engines.)


    # 6: IMAGE ALT TEXT


    Search engines rely on providing accurate descriptions of images in the text.
    It will also help your images show up in the results of image-based searches.


    Never try to fool search engines! They will penalize you for. For example, never
    add text in the same color as the background of the page as they can detect this.'
  merge: -1
  pgno: 486
- img_proc: true
  md: '# HOW TO IDENTIFY KEYWORDS AND PHRASES


    Determining which keywords to use on your site can be one of the hardest tasks
    when you start to think about SEO. Here are six steps that will help you identify
    the right keywords and phrases for your site.


    # 1: BRAINSTORM


    # 2: ORGANIZE


    # 3: RESEARCH


    List the words that someone might type into Google to include the various topics,
    products or services your site is about.


    Group the keywords into separate lists for the different sections or categories
    of your website.


    There are several tools that let you enter your keywords and then they will suggest
    additional keywords you might like to consider, such as:


    It often helps to ask other people what words they would use to find your site
    because people feel less familiar with a topic use different terms than you. (In
    particular, they are less likely to use industry-specific jargon.)


    For example, if your website was a pet shop you might have different categories
    for different animals (such as dogs, cats and rabbits).


    adwords.google.co.uk/select/keywordToolExternal

    (When using this tool, select the "exact match" option rather than "broad match.")


    ```

    www.tracker.com

    www.keyworddiscovery.com

    ```


    Your list may include some keyword phrases (not just individual words) if you
    have topics which are described by more than one word.


    On a large site you may break this up into sub-categories (for example, separate
    groups for different pet food brands).


    Once these tools have suggested additional keywords, add the relevant options
    to your lists. (Keywords will most likely suggest some terms that are irrelevant
    so do omit any that do not seem appropriate).'
  merge: -1
  pgno: 487
- img_proc: true
  md: '# 4: COMPARE


    # 5: REFINE


    # 6: MAP


    It is very unlikely that your site will appear at the top of the search results
    for every keyword. This is especially true for topics where there is a lot of
    competition. The more sites out there that have already been optimized for a given
    keyword, the harder it will be for you to rise up the search results when people
    search on that term.


    Now you need to pick keywords you will focus on. These should always be the ones
    that are most relevant to each section of your site.


    Now that you have a refined list of keywords, you know which have the most competition
    and which ones are most relevant, it is time to start picking keywords you will
    use for each page.


    If there is a phrase that is very relevant but you find there is a lot of competition,
    you should use it. To improve the chances of your site being found you can look
    at whether there are other words that could be incorporated into a phrase. If
    the information or service you offer on your website is location specific, then
    you will find that incorporating your keyword into your location will help people
    find you.


    Pick 3-5 keywords or phrases to map each page of your website and use these as
    keywords for each page.


    Some of the research sites can tell you how many people have searched for a specific
    keyword to help you know how much competition those have.


    You should not need to repeat the same keywords on all of the pages. It is also
    likely that, as you move further away from the homepage into the sections of the
    site, the keywords will become more specific to the individual dealt with on each
    page.


    You can use Google''s advanced search to search the titles of pages. This will
    help you determine how many sites have that keyword in the title of their pages.
    (The more pages with the term in the title, the more competition there is.)


    If you are promoting a slate roofing company in Australia then it is better to
    get 100 people from Australia who are looking for a slate roof than 10,000 from
    the USA who are looking for other kinds of roofs.


    PRACTICAL INFORMATION'
  merge: -1
  pgno: 488
- img_proc: true
  md: '# ANALYTICS: LEARNING ABOUT YOUR VISITORS


    As soon as people start coming to your site, you can start analyzing how they
    found it, what they were looking at and at what point they were leaving. One of
    the best tools for doing this is a free service offered by Google called Google
    Analytics.


    # SIGNING UP


    # HOW IT WORKS


    # THE TRACKING CODE


    The Google Analytics service relies on you signing up for an account: **www.google.com/analytics**
    The site will give you a piece of tracking code which you need to put on every
    page of your site.


    Every time someone loads a page of your site, the tracking code sends data to
    the Google servers where it is stored. Google provides a web-based interface that
    allows you to see how visitors use your site.


    A tracking code is provided by Google Analytics for each website you are tracking.
    It should appear just before the closing</head>` tag. The code does not alter
    the appearance of your web pages.


    At the time of writing, Google was updating their Analytics interface to Version
    5. If you log into your account and see a different interface, look for a link
    in the top right-corner of the page that says ''New Version.'''
  merge: -1
  pgno: 489
- img_proc: true
  md: '# HOW MANY PEOPLE ARE COMING TO YOUR SITE?


    The overview page gives you a snapshot of the key information you are likely to
    want to know. In particular, it tells you how many people are coming to your site.


    VISITS

    This is the number of people come to your site. If someone is inactive on your
    site for 30 minutes and then looks at another page on your site, it will be counted
    as a new visit.


    UNIQUE VISITS

    This is the total number of people who have visited your site over the specified
    period. The number of unique visits will be lower than the number of visits if
    people have been returning to your site more than once in the defined period.


    PAGE VIEWS

    The total number of pages visitors have viewed on your site.


    PAGES PER VISIT

    The average number of pages each visitor has looked at on your site.


    AVERAGE TIME ON SITE

    The average amount of time each user has spent on the site per visit.


    DATE SELECTOR

    Using the selector in the top right corner of the site, you can change the period
    of time the reports display. When you log in, this is usually set to the last
    month, but you can change it to report on a specific time period.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_490_0.png)


    EXPORT

    The export link just above the title that says "visitors overview" allows you
    to export the statistics on this page for other applications as Excel.'
  merge: -1
  pgno: 490
- img_proc: true
  md: '# # WHAT ARE YOUR VISITORS LOOKING AT?


    The content link on the left-hand side allows you to learn more about what the
    visitors are looking at when they come to your site.


    # ## PAGES


    This tells you which pages your visitors are looking at the most and also pages
    which they are spending the most time on.


    # ## LANDING PAGES


    These are the pages that people arrive on when first visiting your site. This
    can be particularly helpful if you find people are not coming into your site via
    the homepage.


    # ## EXIT PAGES


    This shows which pages people most commonly leave from. If a lot of people are
    leaving from the same page then you might consider changing that page or improving
    it.


    # ## BOUNCE RATE


    This shows the number of people who left on the same page that they arrived on.
    A high bounce rate suggests that the content is not what they were looking for
    or the page did not encourage them to look around the rest of the site. What counts
    as a bounce:


    +   - Clicked a link to another site

    - Clicked on an advertisement

    - Entered a new URL

    - Used the "back" button

    - Closed the browser


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_491_0.png)'
  merge: -1
  pgno: 491
- img_proc: true
  md: '# WHERE ARE YOUR VISITORS COMING FROM?


    The traffic sources link on the left hand side allows you to learn where your
    visitors are coming from.


    # REFERRERS


    This shows the sites that have linked to you and the number of people who come
    via those sites. If a site sends a lot of traffic to you, get in touch and work
    together to ensure traffic keeps flowing. You could also try to find similar sites
    and ask them to link to you.


    This shows page a user arrived if they did not come via a link on another site.
    They might have typed the URL into their browser, used a browser bookmark, or
    clicked a link in an email, PDF, or Word document.


    This shows the terms entered into a search engine to find your site. This can
    help you learn how visitors describe what they''re looking for (which is often
    different to how someone describes their own site). This can help you fine-tune
    your content and SEO keywords.


    # SEARCH TERMS


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_492_0.png)


