  md: "# CSS3: GRADIENTS background-image\n\nCSS3 is going to introduce the ability\
    \ to specify a gradient for the background of a box. The gradient is created using\
    \ the background-image property and, at the time of writing, different browsers\
    \ required a different syntax.\n\nSince it is not supported by all browsers, it\
    \ is possible to specify a background image for the box first (which would represent\
    \ the gradient) and then provide the CSS alternatives for browsers that support\
    \ gradients.\n\nOn this page, we are focusing on linear gradients. You can see\
    \ in order to create a linear gradient, we need to specify two colors (that the\
    \ gradient is between).\n\nSome browsers allow you to specify the angle of the\
    \ gradient, or even different types of gradients (such as radial gradients), but\
    \ support is not as widespread as that for linear gradients.\n\n```\nchapter-16/gradient.html\n\
    #gradient {\n  /* fallback color */\n  background-color: #66ccc;\n  /* fallback\
    \ image */\n  background-image:url(\"images/fallback-background-image.png\");\n\
    \  /* Firefox 3.6+ */\n  background-image:-moz-linear-gradient(#336666,#66ccc);\n\
    \  /* Safari 4+, Chrome 1+ */\n  background-image:-webkit-gradient(linear, 0%\
    \ 100%,from(#66ccc),to(#336666));\n  /* Safari 5.1, Chrome 10+ */\n  background-image:-webkit-linear-gradient(#336666,#66ccc);\n\
    \  /* Opera 11.0+ */\n  background-image:-o-linear-gradient(#336666,#66ccc);\n\
    \  height: 150px;\n  width: 300px;\n}\n```\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_425_0.png)"
  merge: -1
