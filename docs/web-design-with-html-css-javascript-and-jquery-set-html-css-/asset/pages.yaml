  md: '# IS IT HARD TO LEARN?


    Many books that teach HTML and CSS resemble dull manuals. To make it easier for
    you to learn, we threw away the traditional template used by publishers and redesigned
    this book from scratch.


    I have focussed on the code you need to use 90% of the time and omitted the code
    that you would rarely see if writing websites is your full time job. By the end
    of the book, if you come across the other 10% you will be able to Google it to
    find out what it means quickly and easily.


    At work, when people look at my screen and see it full of code, it''s not unusual
    to get a comment about looking very complicated or how clever I must be understand.
    The truth is, it is not hard to learn how to write web pages and read the code
    used to create them; you certainly do not have to be a "programmer."


    Understanding HTML and CSS can help anyone who works with the web; designers can
    create attractive and usable sites, website editors can create better content,
    marketers can communicate with their audience more effectively, and managers can
    commission better sites and get the best out of their teams.


    I have also added practical information on topics I am commonly asked about, such
    as how to prepare images, audio and video for the web, how to approach the design
    and build of a new site, how to improve your rankings in search engines (SEO),
    and how to use Google Analytics to learn about visitors your site.


    INTRODUCTION'
