  md: '# THE EVOLUTION OF HTML


    Since the web was first created, there have been several different versions of
    HTML.


    # HTML 4


    RELEASED 1997


    # XHTML 1.0


    RELEASED 2000


    Each new version was designed to be an improvement on the last (with new elements
    and attributes added order code removed).


    With the exception of a few elements added in HTML5 (which have been highlighted),
    the elements you have seen in this book were all available in HTML 4.


    In 1998, a language called XML was published. Its purpose was to allow people
    to write new markup languages. Since HTML was the most widely used markup language,
    it decided that HTML 4 should be reformulated to follow the rules of XML and it
    was renamed XHTML. This meant that authors had to follow some new stricter rules
    about writing markup. For example:


    There have also been several versions of each browser used to view web pages,
    each of which implements code. Not all web users, have the latest browsers installed
    on their computers, which means not everyone will be able to view all of the latest
    features and markup.


    Although HTML 4 had some presentational elements to control the appearance of
    pages, authors are not recommended to use them more.(Examples include the <center>
    element for centering content a <font> for controlling the appearance of text,
    and <strike> to put a line through the text — all of these can be achieved with
    CSS instead.)


    +   * Every element needed a closing tag (except for elements such as <img> />).


    +   * Attribute names had to be in lowercase.


    +   * All attributes required a value, and all values were to be placed in double
    quotes.


    +   * Deprecated elements should no longer be used.


    +   * Every element that opened inside another element should be closed inside
    that same element.


    Where you should particularly aware of browsers not supporting certain features,
    I have made a note of this (you have seen with some of the HTML5 elements introduced
    in the Forms chapter — and you will see in the CSS chapters).'
  merge: -1
  pgno: 185
