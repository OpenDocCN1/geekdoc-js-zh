  md: '# PREPARING A FLASH\VIDEO FOR YOUR SITE


    There are three steps you need to follow to add a Flash Video to your web page:


    # 1


    # CONVERT YOUR VIDEO

    INTO FLV FORMAT


    To play a Flash Video, you need to convert your video into FLV format. Since Flash
    6, the Flash authoring environment has come with a Flash Video Encoder to convert
    videos into FLV format.


    Some Flash video players also support a format called H264 (and some video editing
    programs export video in this format).


    Googling "FLV" or H264 converters will allow you to find alternative encoding
    software.


    # 2


    # FIND AN FLV PLAYER TO

    PLAY THE VIDEO


    You''ll need a player written in Flash to play the file. Its purpose is to hold
    the FLV movie and add controls such as play/pause. There are two sites that offer
    FLV players:


    ```

    www.osflv.com

    www.longtailvideo.com

    ```


    You do not need the Flash authoring environment to use either of these on your
    website.


    # 3


    # INCLUDE THE PLAYER

    VIDEO IN YOUR PAGE


    You can include the player in your page using a JavaScript technique such as SWFObject,
    which was mentioned earlier in this chapter.


    You will also need to tell the player which file that you want it to play. (Some
    players have developed features such as the ability to create playlists of multiple
    videos, or add a still picture before you plays.)


    I have provided a sample FLV file you can use using the download code on the website
    (It is in a separate folder because the video files are large.)


    In the following example, we will use the OS FLV player, which is a free, open-source
    Flash Video player. This is included in the download code. It only supports the
    FLV format (not H264).


    In the following example, we will also be using the SWFObject JavaScript technique
    mentioned on pages 207-208.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# ADDING A FLASH VIDEO TO YOUR PAGES


    | HTML | chapter-09/adding-a-flash-video.html |


    ```

    <!DOCTYPE html>

    <html>

    <title>Adding a Flash Video</title>

    <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/swobject/2.2/swobject.js"></script>

    <script type="text/javascript">

    var flashvars = {};

    var params = (movie:"../puppy.flv");

    swobject.embedSWF("flash/osplayer.swf",

    "snow","400","320","8.0.0",

    flashvars,params);</script>

    </head>

    <body>

    <div id="snow"><p>A video of a puppy playing in the snow</p></div>

    </body>

    </html>

    ```


    This example uses the OS FLV player to display a video called puppy.flv, which
    has already been converted into FLV format.


    You have already seen how to use SWObject to embed a basic animation in a page,
    but Flash movies need information in order for them to work. In this example,
    the video player needs to know the path to the video it has to play, so SWObject
    uses variables to pass this information to the Flash movie. These are provided
    in the two lines of code that start with var.


    This particular player is not expecting any information in the flashvars variable,
    so that is left empty.


    The path to the movie is supplied in the called parameters.


    ```

    var params = (movie:"../videos/puppy.flv");

    ```


    The line after is the one that tells the script to replace the HTML element with
    the video player. It is very similar to the one you saw in the earlier example
    that introduced SWObject.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_218_0.png)


    Different video players usually require information such as the path to the video
    in slightly different formats, but they usually come with examples and documentation
    to help you understand how to use them.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# # HTML5: PREPARING VIDEO FOR YOUR PAGES


    Despite the HTML5 <video> element being a very recent addition, it is enjoying
    widespread use. Here are some of the key issues to be aware of:


    # SUPPORT


    # FORMATS


    # CONTROLS


    The new HTML5 <video> element is only supported by recent browsers, so you cannot
    just use this technique if you want to be able to see your video (you need to
    combine this HTML5 with Flash Video).


    Not all browsers support the same video formats. Therefore, you need to supply
    your video in more than one format.


    The browser supplies its own controls for the player, and these can vary from
    browser to browser. You can control the appearance of these controls using JavaScript
    (but that is beyond the scope of this book).


    # DIGITAL RIGHTS


    To reach as many browsers as possible, you should provide the video in the following
    formats:


    # IN THE BROWSER


    At the time of writing, the <video> element does not support any type of Digital
    Rights Management (DRM) — sometimes referred to as copy protection). But a dedicated
    pirate will find a way around DRM.


    **H264**: IE and Safari

    **WebM**: Android, Chrome, Firefox, Opera


    One of the problems with players such as the Flash Player is that they can behave
    inconsistently when elements such as menus drop over down, or the window is scaled
    up or down. The HTML5 option solves these issues.


    Chrome, Firefox, and Opera indicated that they will support a format called WebM.
    (Some Flash players also support H264, and WebM — which will save on the number
    of conversions).


    On page 222 you will see how to combine this HTML5 video technique with Flash
    Video to achieve wider reach.


    I have provided a sample video in H264 and WebM format for you to try with the
    code downloads.


    If you look at this example in Firefox and Opera you will see different controls
    when you hover over the video.'
  merge: -1
  pgno: 219
