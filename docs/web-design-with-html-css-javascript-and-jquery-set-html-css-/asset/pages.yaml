  md: "# HTML5: FORM VALIDATION\n\nYou have probably seen forms on the web that give\
    \ users messages if the form control has not been filled in correctly; this is\
    \ known as form validation.\n\nTraditionally, form validation has been performed\
    \ using JavaScript (which is beyond the scope of this book). But HTML5 is introducing\
    \ validation and leaving the work to the browser.\n\nValidation helps ensure the\
    \ user enters information in a form that the server will be able to understand\
    \ when the form is submitted. Validating the contents of the form before it is\
    \ sent to the server helps:\n\n+   - Reduce the amount of work the server has\
    \ to do\n- Enable users to see if there are problems with the form (faster than\
    \ if validation were performed on the server)\n\n```\n<form action=\"http://www.example.com/login/\
    \ method=\"post\">\n  <label for=\"username\">Username:</label>\n  <input type=\"\
    text\" name=\"username\" required=\"required\" /><br>\n  <label for=\"password\"\
    >Password:</label>\n  <input type=\"password\" name=\"password\" required=\"required\"\
    \ />\n  <input type=\"submit\" value=\"Submit\" />\n</form>\n```\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_171_0.png)\n\
    \nAt the time of writing, Chrome and Opera supported HTML5 validation, although\
    \ other browsers are expected to follow; in order to support older browsers (that\
    \ do not understand HTML5), web page authors are likely to continue using JavaScript\
    \ to validate forms.\n\nAn example of HTML5 form validation is the required attribute,\
    \ which can be used on any form element that the user is expected to fill in.\
    \ This HTML5 attribute does not need a value but in HTML 5, So, some people give\
    \ this attribute a value of required."
  merge: -1
  pgno: 171
- img_proc: true
  md: "# HTML5: DATE INPUT\n\n# HTML\n\n```\n<form action=\"http://www.example.com/bookings/\"\
    \n  method=\"post\">\n  <label for=\"depart>Departure date:</label>\n  <input\
    \ type=\"date\" name=\"depart\" />\n  <input type=\"submit\" value=\"Submit\"\
    \ />\n</form>\n```\n\n# <input>\n\nMany forms need to gather information such\
    \ as dates, email addresses, and URLs. This has traditionally been done using\
    \ inputs.\n\nHTML5 introduces new form controls to standardize the way that information\
    \ is gathered. Older browsers do not recognize these inputs will just treat them\
    \ as a single text box.\n\n# RESULT\n\n# type=\"date\"\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_172_0.png)\n\
    \nIf you are asking the user for a date, you can use an <input> element and give\
    \ the type attribute a value of date. This will create a date input in browsers\
    \ that support the HTML5 input types.\n\nThis example shows what the date input\
    \ looks like in the Opera browser. The appearance of the date input changes across\
    \ different browsers."
  merge: -1
