  md: "# CSS\n\nHere are some tips for styling\ntables to ensure they are clean\n\
    and easy to follow:\n\n```\nbody {\n  font-family: Arial, Verdana, sans-serif;\n\
    \  color: #111111;\nntable {\n  width: 600px;\nnth, td {\n  padding: 7px 10px\
    \ 10px 10px;\n}\nth {\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n\
    \  font-size: 90%;\n  border-bottom: 2px solid #111111;\n  border-top: 1px solid\
    \ #999;\n  text-align: left;\n}\ntriv {\n  background-color: #efefef;\nnthover\
    \ {\n  background-color: #c3e6e5;\nnmoney {\n  text-align: right;\n}\n```\n\n\
    GIVE CELLS PADDING\nIf in the table either\ntouches a border (or another\ncell),\
    \ it becomes much harder to\nread. Adding padding helps to\nimprove readability.\n\
    \nDISTINGUISH HEADINGS\nPutting all table headings in\nbold (the default style\
    \ for the\n<th element) makes them\neasier to read. You can also\nmake headings\
    \ uppercase and\nthen add a background\ncolor or an underline to clearly\ndistinguish\
    \ them from content.\n\nSHADE ALTERNATE ROWS\nShading every other row can\nhelp\
    \ users follow along the lines.\nA subtle distinction from the\nnormal color of\
    \ the rows to keep\nthe table cleaning.\n\n# RESULT\n\n# First Edition Auctions\n\
    \n| AUTHOR | TITLE | RESERVE PRICE | CURRENT BID |\n| --- | --- | --- | --- |\n\
    | E.E. Cummings | Tulips & Chimneys | $2,000.00 | $2,642.50 |\n| Charles'Orleans\
    \ | Poems | | $5,866.00 |\n| T.S. Eliot | Poems 1909 - 1925 | $1,250.00 | $8,849.35\
    \ |\n| Sylvia Plath | The Colossus | | $1031.72 |\n\nALIGN NUMBERS\nYou can use\
    \ the text-align\nproperty to align the content\nof any column that contains\n\
    numbers to the right, so that\nlarge numbers are clearly\ndistinguished from smaller\
    \ ones.\n\nONLINE EXTRA\nThere are many examples of\nusing CSS to style tables\
    \ in thentnt section of the website."
  merge: -1
