  md: '# UNDERSTANDING CSS: THINKING INSIDE THE BOX


    The key to understanding how CSS works is to imagine that there is an invisible
    box around every HTML element.


    On this page, you can see a basic HTML page.


    On the right hand page, you can see the same HTML page, but I have added outlines
    to each of the elements so that you can see how CSS will treat each element as
    if it lives inside its own box.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_235_0.png)


    # BLOCK & INLINE ELEMENTS


    You may remember from pages 185-186 that there is a difference between block level
    and inline elements and how browsers display them.


    Block level elements look like a new line. Examples include the <h1>, <h6>, <p>
    and <div> elements.


    Inline elements flow within the text and do not start on a new line. Examples
    include <b>, <i>, <img>, <em> and <span>.'
  merge: -1
