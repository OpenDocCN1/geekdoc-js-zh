  md: 'HTML5 allows you to use uppercase attribute names and omit the quotomarks,
    but this is not recommended.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_32_0.png)


    The majority of attributes can only be used on certain elements, although a few
    attributes (such as lang) can appear on any element.


    Most attribute values are either pre-defined or follow a stipulated format. We
    will look at the permitted values as we introduce each new attribute.


    The value of the lang attribute is an abbreviated way of specifying which language
    is used inside the element that all browsers understand.'
