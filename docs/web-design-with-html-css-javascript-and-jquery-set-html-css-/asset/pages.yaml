  md: '# CSS FRAMEWORKS


    CSS frameworks aim to make your life easier by providing the code for common tasks,
    such as creating layout grids, styling forms, creating printer-friendly versions
    of pages and so on. You can include the CSS framework code in your projects rather
    than writing the CSS from scratch.


    # ADVANTAGES


    # DISADVANTAGES


    +   - They save you from repeatedly writing code for the same tasks.


    +   - They will have been tested across different browser versions (which helps
    avoid browser bugs).


    +   - They often require that you use class names in HTML code that only control
    the presentation of the page (rather describe its content).


    +   - In order to satisfy a wide variety of needs, they often contain more code
    than you need for your particular web page (commonly referred to as code "bloat”).


    # INTRODUCING THE 960.GS CSS FRAMEWORK


    One of the most popular uses of CSS frameworks is in creating grids to layout
    pages. There are several frameworks out there, but the one we will be looking
    at the next few pages is the 960 Grid System (available at **www.960.gs**).


    download to help design your pages using a 12 column grid. (In addition, there
    is a variation on the grid that uses 16 columns.)


    such as grid_3 (for a block that stretches over two columns), grid_4 (for a block
    that stretches over four columns) and so on to grid_12 (for a box that is the
    full width of the pages). These columns float to the left, and there is a 10 pixel
    margin to the left of each one.


    To create a 12 column grid, an element that contains the entire page is given
    a class attribute whose value is container_12. This sets the content of the page
    to 960 pixels and indicates that we are using a 12 column grid.


    960 provides a style sheet that you can include in your HTML pages. Once page
    links to this style, you can provide the appropriate classes to your HTML code
    and it will create multiple layout layouts. The 960 website also provides templates
    you can


    There are different classes for blocks that take up 1, 2, 3, and up to 12 columns
    of the grid. Each block uses class names


    There are several other grid-based CSS frameworks available online, such as: blueprintcss.com
    lessframework.com developer.yahoo.com/yui/grids/'
