  md: '# # WHAT INFORMATION

    YOUR VISITORS NEED


    You know who is coming to your site and why they are coming, now you need to work
    out what information they need in order to achieve their goals quickly and effectively.


    You may want to offer additional supporting information that they think might
    find helpful.


    Look at each of the reasons why people will be visiting your site and determine
    what they need to achieve their goals.


    You can prioritize levels of information from key points down to non-essential
    or background information.


    By ensuring you provide the information that your visitors are looking for, they
    will consider your site more relevant to them.


    Therefore, you will have more opportunity to tell them any extra information that
    you think would be helpful to them (or expose them to other products and services
    you want to promote).


    If you do not appear relevant to them by answering their needs, however, they
    are likely to go elsewhere.


    Here are some questions to help you decide what information to provide for visitors
    to your site...


    # KEY INFORMATION


    +   - Visitors will be familiar with your subject area / brand or do you need
    to introduce yourself?

    - Will they be familiar with the product / service / information you are covering
    or do they need background information on it?

    - What are the most important features of what you are offering?

    - What is special about what you offer that differentiates you from other sites
    that offer something similar?

    - Once people have achieved the goal that sent them to your site, are there common
    questions people ask about this area?'
  merge: -1
  pgno: 465
- img_proc: true
  md: '# HOW OFTEN PEOPLE WILL VISIT YOUR SITE


    Some sites benefit from being updated more frequently than others. Some information
    (such as news) may be constantly changing, while other content remains static.


    A website about fashion trends will need to change a lot more than one that is
    promoting a service that people do not buy regularly (such as domestic plumbing
    or double glazing).


    It can often be helpful to set a schedule for when a site will be updated (rather
    than doing it on ad hoc basis).


    # GOODS / SERVICES


    +   - How often do the same people return to purchase from you?


    You will find that some parts of a site will benefit from being updated more frequently
    than others.


    +   - How often is your stock updated or your service changed?


    Once a site has been built, it can take a lot of time and resources to update
    it frequently.


    Here are some questions to help you decide how often to update your website...


    # INFORMATION


    +   - How often is the subject updated?


    Working out how often people are likely to revisit your site gives you an indication
    for how often you should update the site.


    +   - What percentage of your visitors would return for regular updates on the
    subject, compared with those who will just need the information once?'
  merge: -1
  pgno: 466
- img_proc: true
  md: '# SITE MAPS


    Now that you know what needs to appear on your site, you can start to organize
    the information into sections or pages.


    The aim is to create a diagram of the pages that will be used to structure the
    site. This is known as a site map and it will show how those pages can be grouped.


    The groups of information are then turned into the diagram that is known as the
    site map.


    Sometimes it can be helpful to ask people who are the target audience to help
    you group information together.


    You may need to duplicate some information if it needs to appear on more than
    one page.


    The pages (or groups of pages) will inform how users navigate through the site.


    To help you decide what information should go on each page, you can use a technique
    card sorting.


    A site map will begin with the homepage. Additionally, if the site is large and
    compartmentalized into sections, each section might require its own homepage to
    link to all of the information within.


    Remember to focus on the goals that your visitors want to achieve.


    This involves placing each piece of information that a visitor might need to know
    on a separate piece of paper and organizing the related information into groups.


    It is worth noting that the site owner might organize information in a way that
    is different from what the public expects. It is important to reflect the public''s
    understanding of the subject (rather than just the site owner''s understanding
    of it).


    Each group relates to a page and, on larger sites, the pages can in turn be grouped
    together to create different sections of the website.


    For example, most online shops have section wallpapers for each type of product,
    which then link to individual product pages.'
  merge: -1
