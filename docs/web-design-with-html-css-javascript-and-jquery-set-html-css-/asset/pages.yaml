  md: '# EXAMPLE IMAGES


    This example demonstrates how to use CSS to create a simple image gallery layout.


    A background texture is applied to the whole page by repeating an image with the
    texture behind the `<body>` element. A repeating background image is sometimes
    referred to as **wallpaper**.


    The content of the page is put inside a `<div>` element whose class is wrapper.
    This is used to fix the width of the page to 720 pixels. Its left and right margins
    are set to auto to center it in the middle of the screen.


    The images sit inside an HTML `<figure>` element, and their captions are provided
    in the `<figcaption>` element. CSS is used to set the dimensions and background
    color for each `<figure>` element. The dimensions of the images themselves are
    also set using CSS, and are given a single pixel gray border.


    For captions, a background image is used to the left of the text. We do not want
    this image to fill the background so specifically that it should not repeat. Padding
    is used to the left of the text so that the words do not go over the background
    image.


    Each of the `<figure>` elements is contained within a `<div>` which has two purposes.
    Firstly, it is used to create the three-column layout by specifying a width and
    margins for the element and then floating it to the left. Secondly, it adds a
    subtle shadow underneath each image. This creates a three-dimensional appearance
    making it look like a piece of card. To ensure that this sits underneath the image,
    the background-position property is used.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_428_0.png)'
  merge: -1
