  md: '# INFORMATION ABOUT

    YOUR PAGES


    # <meta>


    The <meta> element lives inside the <head> element and contains information about
    that web page.


    The value of the name attribute can be anything you want it to be. Some defined
    values for this attribute that are commonly used are:


    It is not visible to users but fulfills a number of purposes such as telling search
    engines about your page, who created it, and whether or not it is time sensitive.
    (If the page is time sensitive, it can be exposed to.)


    # description


    This contains a description of the page. This description is commonly used by
    search engines to understand what the page is about and should be a maximum of
    155 characters. Sometimes it is also displayed in search results.


    The <meta> element is an empty element so it does not have a closing tag. It uses
    attributes to carry the information.


    # keywords


    This contains a list of comma-separated words that a user might search on to find
    the page. In practice, this no longer has noticeable effect on how search engines
    index your site.


    # robots


    This indicates whether search engines should add this page to their search results
    or not. A value of noindex can be used if this page should not be added. A value
    of nofollow can be used if search engines add this page in their results but not
    any pages that it links to.


    In the first line of the example on the opposite page, you can see a <meta> element
    where the name attribute indicates an intention to specify a description for the
    page. The content attribute is where this description is actually specified.'
  merge: -1
  pgno: 197
