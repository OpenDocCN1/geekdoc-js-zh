  md: '# BOX DIMENSIONS

    width, height


    By default a box is sized just enough to hold its contents. To set your own dimensions
    for a box you can use the height and width properties.


    The most popular ways to specify the size of a box are to use pixels, percentages,
    or ems. Traditionally, pixels have been the most popular method because they allow
    designers to accurately control their size.


    When you use percentages, the size of the box is relative to the size of the browser
    window or if the box is encased within another box, it is a percentage of the
    size of the containing box.


    When you use ems, the size of the box is based on the size of text within it.
    Designers have recently started to use percentages and ems for measurements as
    they try to create designs that are flexible across devices which have different-sized
    screens.


    ```

    chapter-13/width-height.html

    <div>

    <p&gt;The Moog company pioneered the commercial manufacture of modular voltage-controlled
    analog synthesizer systems in the early 1950s.</p&gt;

    </div>

    ```


    ```

    div {

    height: 300px;

    width: 400px;

    background-color: #ee3e80;

    p {

    height: 75%;

    width: 75%;

    background-color: #eldddda;

    }

    ```


    > The Moog company pioneered the commercial manufacture of modular voltage-controlled
    analog synthesizer systems in the early 1950s.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_309_0.png)


    In the example on the right, you can see that a containing <div> element is used
    which is 300 pixels wide by 300 pixels high. Inside of this is a paragraph that
    is 75% of the width and height of the containing element. This means that the
    size of the paragraph is 225 pixels wide by 225 pixels high.'
  merge: -1
  pgno: 309
