  md: '# # LINE BREAKS & HORIZONTAL RULES


    | HTML | chapter-02/line-breaks.html |

    |---|---|

    | <p>The Earth<br />gets one hundred tons heavier every day<br />due to falling
    space dust.</p> | |


    As you have already seen, the browser will automatically show each new paragraph
    or heading on a new line. But if you wanted to add a line break inside the middle
    of a paragraph you can use the line break tag <br /> /.


    | RESULT |

    |---||

    | The Earth gets one hundred tons heavier every day due to falling space dust.
    |


    | HTML | chapter-02/horizontal-rules.html |

    |---|---|

    | <p>Venus is the only planet that rotates clockwise.</p>

    <hr />

    <p>Jupiter is bigger than all the other planets combined.</p> | |


    To create a break between themes — such as a change of topic in a book or a new
    scene in a play — you can add a horizontal rule between sections using the <hr
    /> /.


    There are a few elements that do not have words between an opening and closing
    tag. They are known as empty elements and are written differently.


    | RESULT |

    |---||

    | Venus is the only planet that rotates clockwise.


    Jupiter is bigger than all the other planets combined. |


    An empty element usually has only one line. Before the closing angled bracket
    of an empty element there will often be a space and a forward slash character.
    Some web page miss this out but it is a good habit to get into.'
