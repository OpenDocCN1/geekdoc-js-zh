  md: "# # CLEARING FLOATS clear\n\nHTML chapter-15/clear.html\n\nThe clear property\
    \ allows you to say that no element (within the same containing element) should\
    \ touch the left or right sides of a box. It can take the following values:\n\n\
    ```\n<p class=\"clear\">In 1865, the velocopede (meaning \"fast foot\") attached\
    \ pedals to the front wheel, but its wooden structure made it extremely uncomfortable.</p>\n\
    ```\n\nCSS\n\n```\nbody {\n  width: 750px;\n  font-family: Arial, Verdana, sans-serif;\n\
    \  color: #665544;\n}\np {\n  width: 230px;\n  float: left;\n  margin: 5px;\n\
    \  padding: 5px;\n  background-color: #efefef;\n}\nclear {\n  clear: left;\n}\n\
    ```\n\nleft\nThe left-hand side of the box should not touch any elements appearing\
    \ in the same containing element.\n\nright\nThe right-hand side of the box will\
    \ not touch elements appearing in the same containing element.\n\nboth\nNeither\
    \ the left nor right-hand sides of the box will touch elements in the same containing\
    \ element.\n\nRESULT\nElements can touch either.\n\n# ## Evolution of the Bicycle\n\
    \n| In 1817 Baron von Drais invented a walking machine that would help him get\
