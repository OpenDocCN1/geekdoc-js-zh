  md: '# CONTRAST OF BACKGROUND IMAGES


    If you want to overlay text on a background image, the image must be low contrast
    in order for the text to be legible.


    # HIGH CONTRAST


    # LOW CONTRAST


    # SCREEN


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_426_0.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_426_1.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_426_2.png)


    The majority of photographs have quite a high contrast, which means that they
    are not ideal for use as a background image.


    Image editing applications such as Photoshop and GIMP have tools that allow you
    to manually adjust your images to have lower contrast.


    To overlay text on an image with high contrast, you can place a semi-transparent
    background color (or ''screen'') behind the text to improve legibility.'
