  md: "# # OVERLAPPING ELEMENTS\nz-index\n\nWhen you use relative, fixed, or absolute\
    \ positioning, boxes can do overlap. The elements that appear later in the HTML\
    \ code sit on top of those that are earlier in the page.\n\nIf you want to control\
    \ which element sits on top, you can use the z-index property. Its value is a\
    \ number, and the higher the closer that is to the front. For example, an element\
    \ with a z-index of 10 will appear over the top of one with a z-index of 5.\n\n\
    This example looks similar to the one on page 368, but it uses positioning for\
    \ the <p> elements. Because the paragraphs are positioned, by default they would\
    \ appear over the top of the header as you scroll down the page. To ensure that\
    \ the <h1> element stays on top, you can use the z-index rule for the <h1> element.\n\
    \nThe z-index is sometimes referred to as the stacking context (as the blocks\
    \ that have been stacked on top of each other on an axis). If you are familiar\
    \ with desktop publishing packages, it is equivalent to using the 'bring to front'\
    \ and 'send to back' features.\n\n```\nchapter-15/z-index.html\nh1 {\n  position:\
    \ fixed;\n  top: 0px;\n  left: 0px;\n  margin: 0px;\n  padding: 10px;\n  width:\
    \ 100%;\n  background-color: #efefef;\n  z-index: 10;\n}\np {\n  position: relative;\n\
