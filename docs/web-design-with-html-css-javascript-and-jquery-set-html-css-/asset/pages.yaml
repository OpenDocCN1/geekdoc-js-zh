  md: "# CONTROLLING SIZES OF IMAGES IN CSS\n\nYou can control the size of an image\
    \ with the width and height properties in CSS, just like you can for any other\
    \ box.\n\nSpecifying image sizes helps pages load more smoothly because the HTML\
    \ and CSS code will load before the images, and tell the browser how much space\
    \ to leave for the image allow to render the rest of the page waiting for the\
    \ image to download.\n\nYou might think that your site is likely to have images\
    \ of all different sizes, but a lot of sites use the same size image across many\
    \ of their pages.\n\nFor example, an e-commerce site tends to show products at\
    \ the same size. Or, if your site is designed on a grid, then you might have a\
    \ selection of image sizes that are commonly used on all pages, such as:\n\nSmall\
    \ portrait: 220 x 360\nSmall landscape: 330 x 210\nFeature photo: 620 x 400\n\n\
    Whenever you consistently sized images across a site, you can use CSS to control\
    \ the dimensions of the images, instead of putting the dimensions in the HTML.\n\
    \n# chapter-16/image-sizes.html\n\n```\n```html\n<img src=\"images/magnolia-large.jpg\"\
    \ class=\"large\" alt=\"Magnolia\" />\n<img src=\"images/magnolia-medium.jpg\"\
    \ class=\"medium\" alt=\"Magnolia\" />\n<img src=\"images/magnolia-small.jpg\"\
    \ class=\"small\" alt=\"Magnolia\" />\n```\n```\n\n```\n```css\nimg.large {\n\
    \  width: 500px;\n  height: 500px;\n}\nimg.medium {\n  width: 250px;\n  height:\
    \ 250px;\n}\nimg.small {\n  width: 100px;\n  height: 100px;\n}\n```\n```"
  merge: -1
