  md: '# CSS3: HSL COLORS


    CSS3 introduces an entirely new and intuitive way to specify colors using hue,
    saturation, and lightness values.


    # HUE


    Hue is the colloquial idea of color. In HSL colors, hue is often represented as
    a color circle where the angle represents the color, although it may also be shown
    as a slider with values from 0 to 360.


    # SATURATION


    Saturation is the amount of gray in a color. Saturation is represented as a percentage.
    100% is full saturation and 0% is a shade of gray.


    # LIGHTNESS


    Lightness is the amount of white (lightness) or black (darkness) in a color. Lightness
    is represented as a percentage. 0% lightness is black, 100% lightness is white,
    and 50% lightness is normal. Lightness is sometimes referred to as luminosity.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_261_0.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_261_1.png)


    Please note that lightness is a different concept to brightness. Graphic design
    software (Such as Photoshop and GIMP) have color pickers that use hue, saturation,
    and brightness — but brightness only adds black, whereas lightness offers both
    white and black.'
  merge: -1
  pgno: 261
