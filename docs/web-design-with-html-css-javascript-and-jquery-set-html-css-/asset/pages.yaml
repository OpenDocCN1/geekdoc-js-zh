  md: '# SELECTOR MEANING EXAMPLE


    | SELECTOR | MEANING | EXAMPLE |

    |---|---|---|

    | UNIVERSAL SELECTOR | Applies to all elements in the document | * {} - Targets
    all elements on the page |

    | TYPE SELECTOR | Matches element name | h1, h2, h3 { {} - Targets the <h1>, <h2>
    and <h3> elements |

    | CLASS SELECTOR | Matches an element whose class attribute has a value that matches
    the one specified after the period (or full stop) symbol | .note {} - Targets
    any element whose class attribute has a value of note p.note {} - Targets only
    <p> elements whose class attribute has a value of note |

    | ID SELECTOR | Matches an element whose id attribute has a value that matches
    the one specified after the pound or hash symbol | #introduction {} - Targets
    the element whose id attribute has a value of introduction |

    | CHILD SELECTOR | Matches an element that is a direct child of another | li>a
    {} - Targets any <a> elements that are children of an <li> element (but not other
    <a> elements in the page) |

    | DESCENDANT SELECTOR | Matches an element that is a descendant of another element
    (not just a direct child of that element) | p a {} - Targets any <a> elements
    that sit inside a <p>, even if there are other elements nested within it |

    | ADJACENT SIBING SELECTOR | Matches an element that is the next sibling of another
    | h1+p {} - Targets the first <p> element after any <h1> element (but not other
    <p>) |

    | GENERAL SIBLING SELECTOR | Matches an element that is a sibling of another,
    although it does not have to be the directly preceding element | h1~p {} - If
    you had two <p> elements that are siblings of an <h1> element, this rule would
    apply to both |'
  merge: -1
  pgno: 244
