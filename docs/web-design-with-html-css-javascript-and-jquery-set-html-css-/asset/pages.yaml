  md: '# COMPLETE IMAGE SPRITE


    In this example, you can see two links that look like buttons. Each of the buttons
    has three different states. These are all represented in a single image.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_424_0.png)


    Because the <a> element is an inline element, we set the display property of these
    links to indicate that they should be inline-block elements. This allows us to
    specify the width and height of each <a> element so that it matches the size of
    its corresponding button.


    # RESULT


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_424_1.png)


    The background-position property is used to move the image in order to show the
    button in the right state.


    When the user hovers over a link, the :hover pseudo-class has a rule that moves
    the background-position of the image to show a different state for that button.


    Similarly, when the user clicks on the link, the :active pseudo-class has a rule
    to show the third state for that button.


    Touch devices will not change a link''s state when the user hovers over it, as
    the screens do not yet have a way to tell when the user is hovering. However,
    they will change their appearance when the user activates them.'
  merge: -1
