  md: 'When creating a web page, you add tags (known as markup) to the contents of
    the page. These tags provide extra meaning and allow browsers to show users the
    appropriate structure for the page.


    In this chapter we focus on how to add markup to the text that appears on your
    pages. You will learn about:


    +   - Structural markup: the elements that you can use to describe both headings
    and paragraphs

    - Semantic markup: which provides extra information; such as where emphasis is
    placed in a sentence, that something you have written is a quotation (and who
    said it), the meaning of acronyms, and so on'
