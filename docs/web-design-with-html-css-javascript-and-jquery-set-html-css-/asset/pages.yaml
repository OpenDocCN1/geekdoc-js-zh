  md: '# CSS3: ROUNDED CORNERS

    border-radius


    CSS3 introduces the ability to create rounded corners on any box, using a property
    called border-radius. The value indicates the size of the radius in pixels.


    Older browsers that do not support this property will show a box with right-angled
    corners.


    The -moz-border-radius and -webkit-border-radius properties are not in the CSS
    specification. However, they are used in some versions of Chrome, Firefox, and
    Safari to offer early support for this style (and therefore can be used to achieve
    this effect in more browsers).


    You can specify individual values for each corner of a box:


    ```

    border-top-radius

    border-bottom-right-radius

    border-bottom-left-radius

    border-top-left-radius

    ```


    You can use a shorthand for these four properties (in clockwise order: top, right,
    bottom, left). For example:


    ```

    border-radius: 5px, 10px;

    5px, 10px;

    ```


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_327_0.png)


    ```

    <p>Pet Sounds featured a number of unconventional instruments such as bicycle
    bells, buzzing organs, harpsichords, flutes, Electro-Theremin, dog whistles, trains,
    Hawaiian-sounding string instruments, Coca-Cola cans and barking dogs.</p>

    ```


    ```

    css (

    border: 5px solid #ee3e80;

    padding: 20px;

    width: 275px;

    border-radius: 10px;

    -moz-border-radius: 10px;

    -webkit-border-radius: 10px;

    )

    ```


    Pet Sounds featured a number of unconventional instruments such as bicycle bells,
    buzzing organs, harpsichords, flutes, Electro-Theremin, dog whistles, trains,
    Hawaiian-sounding string instruments, Coca-Cola cans and barking dogs.'
