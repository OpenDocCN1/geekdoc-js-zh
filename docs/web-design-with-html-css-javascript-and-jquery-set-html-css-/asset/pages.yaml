  md: "# TABLE PROPERTIES\n\nYou have already met several properties that are commonly\
    \ used with tables. Here we will put them together in a single example using the\
    \ following:\n\nwidth to set the width of the table\n\npadding to set the space\
    \ between the border of each table and its content\n\ntext-align to convert the\
    \ content of the table headers to uppercase\n\nvertical-align, font-size to add\
    \ additional styling to the content of the table headers\n\nborder-color to set\
    \ borders above and below the table headers\n\ntext-align to align the writing\
