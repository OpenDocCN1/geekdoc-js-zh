  md: '# GROUPING AND SIMILARITY


    When making sense of a design, we tend to organize visual elements into groups.
    Grouping related pieces of information together can make a design easier to comprehend.
    Here are some ways this can be achieved.


    # PROXIMITY


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_475_0.png)


    When several items are placed close together, they are perceived as more related
    than items that are placed further apart. (You can also nest groups of information
    within larger groups.)


    # CLOSURE


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_475_1.png)


    When faced with a complicated arrangement of items, we will often look for a single
    or recognisable pattern or form. A real or imaginary box can be formed around
    elementary elements due to their proximity and alignment.


    # CONTINUANCE


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_475_2.png)


    When elements are placed in a line or a curve then they are perceived to be more
    related than those that are not following the same direction. This can be used
    to direct a reader from one part of the page to the next.


    # WHITE SPACE


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_475_3.png)


    Placing related items closer together and leaving a bigger gap between unrelated
    items.


    # COLOR


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_475_4.png)


    A background color placed behind related items to emphasize their connection.


    # BORDERS


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_475_5.png)


    A line can be drawn around the border of the group or between and its neighbors.'
  merge: -1
  pgno: 475
