  md: '# TROUBLESHOOTING


    Here are a few problems that beginners commonly face, along with the pages where
    you can find solutions to them.


    # STARTING OUT


    The browser shows the markup typed in (not the result). Check the file extension
    is .html and not .txt. [30, 32]


    Bold text, italics, headings, or list text are extending longer than expected.
    Check that you have the relevant tag <a>. [21, 22]


    The page I linked to not found. Check the relative URL. [83, 84]


    # IMAGES


    Images are not showing. Check the relative URL. [83, 84]


    Images are looking blurry. Check that you have saved your images in the right
    format and the size you want to show them at. [109, 113]


    # TEXT


    Some text flashes before showing the correct format. You have a Flash Of Unstyled
    Content. [278]


    When copying text from processors, lots of extra tags are added to the markup.
    Copy the text into plain editor (or removing formatting) paste it into your HTML
    editor. [49]


    Some text looks bigger/smaller. This is usually due to variances in resolution.
    Check the type style is set for the <body>. [377, 275, 276]


    The font size is wrong when I use em. See above. [276]


    The font is not showing in text blocks. The computer must have font installed.
    If you use@font-face it must be in several formats. [269, 272]


    My font looks jagged on a PC. Some fonts do not anti-alias as well as on a Mac.
    Try a different typeface or a thicker version. [272]


    # GENERAL CSS


    A specific style is not showing. Remember CSS selectors are case sensitive.


    Check that your selectors are correct. [238]


    The web developer toolbar help you find the right selector. [348]


    If the selectors are correct, do you have another selector that applies to the
    same element later in the CSS? [239, 240]


    CSS varies in some browsers. There are a number of CSS/bugs quirks that they render
    the page slightly differently - trying searching for the problem and if it is
    a known CSS/bug. [242]


    # HTML 5


    The browser is not applying styles to HTML elements. If it is IE, you might need
    use the HTML5 shim / thing. [442]


    Block-level elements are rendering as inline elements. Use display:block to tell
    the browser which HTML5 elements are block elements. [442]


    Border images are not showing. This only works with longer browsers. (Also, check
    the relative URL). [319]


    GIFs that were resized now look grainy or have jagged edges. Check the color space
    in your image editing program. It should be RGB (not indexed color).


    # INDEX'
  merge: -1
  pgno: 509
- img_proc: true
  md: '# LAYOUT


    The design looks bigger/smaller on some screens.

    The resolution of a monitor affects how the items appears on the page. p 377,
    378


    A background image is not showing on my.

    Does the box you are applying the style to have a defined height and width? p
    303


    My floated element takes up the full width of the browser (or containing box).

    Check that you have specified a width for the floated element. p 370, 371


    Margins above and below a box not showing.

    Vertical margins collapse. p 308, 314


    Does the container have overflow property set to auto? p 373, 374


    The container around floated elements are one pixel tall.

    The element doesn''t know the height of the floated elements inside it. You can
    add an element as a clearing box or over float property with a value set to auto.
    p 373, 374


    My content does not fit in the containing box/browser.

    You can deal with this using the overflow property. p 306, 316


    My images do not show when the page is printed.

    Most browsers do not print background images by default to save ink. You can adjust
    this in your preferences.


    Boxes does not fit size in IE.

    Some versions of IE use a different model than all others. Use a DOCTYPE to make
    sense of IE behave like other browsers. p 316


    There is a gap between the browser window and my content.

    You may need to margin and padding on the <body> element to O. p 313, 314


    I added an extra margin to my floated element.

    The display property to inline.


    Boxes do not appear when using a to for left and right margins.

    You may need to use the text-align property on the containing element. p 315


    # FLOAT LAYOUT


    A box is not sitting next to another floated element.

    Ensure there is enough space in the containing element for the two to sit side
    by side. p 303, 371, 372


    Elements are layering.

    When you take elements out of normal flow, z-index helps you control which items
    go on top. p 369


    Margins and padding are added to the width of the box (except for older versions
    of IE, which have a different model). Therefore, the box may be wider than the
    specified property. p 316


    Why is the vertical-align property not centering my block-level element?

    This property is not designed for this purpose. It is used to center inline elements
    on the page.

    You will find several ways to vertically center block-level elements (depending
    on their context) if you search on Google.


    If you come across a problem that you think belongs in this troubleshooting section,
    please feel free to email us at: hello@tmandsbook.com. We will endeavor to address
    the most common problems readers have faced in future editions of this book. Thank
    you!


    Did you specify a width for the floated element? (See next point.)'
