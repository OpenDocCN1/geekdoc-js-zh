  md: '# ATTRIBUTE SELECTORS


    You met the most popular CSS selectors on page 238. There are also a set of attribute
    selectors that allow you to create rules that apply to elements that have an attribute
    with a specific value.


    | SELECTOR | MEANING | EXAMPLE |

    | --- --- --- |

    | EXISTENCE | [] Matches a specific attribute (whatever its value) p[class] Targets
    any <p> element with an attribute called class |

    | EQUALITY | [=] Matches a specific attribute with a specific value p[class="dog"]
    Targets any <p> element with an attribute class whose value is dog |

    | SPACE | [--] Matches a specific attribute whose value appears in a space-separated
    list of words p[class~="dog"] Targets any <p> element with an attribute class
    whose value is a list of space-separated words, which is dog |

    | PREFIX | [^=] Matches a specific attribute whose value begins with a specific
    string p[attr="d"] Targets any <p> element with an attribute value begins with
    the letter "d" |

    | SUBSTRING | [*] Matches a specific attribute whose value contains a specific
    substring p[attr*=""] Targets any <p> element with an attribute value contains
    the letters "*" |

    | SUFFIX | [$] Matches a specific attribute whose value ends with a specific string
    p[attr$="g"] Targets any <p> element with an attribute value ends with the letter
    "g" |'
