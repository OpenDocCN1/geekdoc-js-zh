  md: '# DOMAIN NAMES\ & HOSTING


    In order to put your site on the web you will need a domain name and web hosting.


    # DOMAIN NAMES


    # WEB HOSTING


    Your domain name is your address (e.g. google.com or bbc.co.uk). There are many
    websites that allow you to register domain names. Usually you will have to pay
    an annual fee to keep that domain name.


    So that other people can see your site, you will need to upload it to a server.
    Web servers are special characters that are constantly connected to the Internet.
    They are usually set up to serve web pages when they are requested.


    # DISK SPACE


    This refers to the total size of all the files that make up your site (all of
    the HTML and CSS files, images and scripts).


    # BANDWIDTH


    This is the amount of data the hosting company will send to your site''s visitors.
    If you imagine 10 people looked at every page on your site, then it would be the
    equivalent to 10 times the amount of disk space you use.


    These sites usually have a form that allows you to check whether your preferred
    domain name is available, and millions of domain names have already been registered,
    it might take you to find the one that is right for your site.


    With the exception of some large sites, most websites live on web servers run
    by web hosting companies. This is usually cheaper and more reliable than trying
    to run your own web servers.


    # BACKUPS


    A lot of sites that offer domain name registration also offer web hosting.


    There are lots of different types of hosting on. We will now take a look at some
    of the things that will help you choose which hosting company to use.


    Check whether the hosting company performs backups on your site (and how often).
    Only create backups so that they can restore your website in the event of a server
    breaking. Others allow access to backups (which can be helpful if you accidentally
    break the site when updating it).


    PRACTICAL INFORMATION'
  merge: -1
  pgno: 493
- img_proc: true
  md: '# EMAIL ACCOUNTS


    Most hosting companies will provide email servers with their web hosting packages.
    You will want to check the size of mailbox you are allowed and the number of mailboxes
    you can use.


    # SERVER-SIDE LANGUAGES AND DATABASES


    If you are using a content management system, it will likely use a server-side
    programming language and a database (such as PHP with a MySQL database, or ASP.Net
    with a SQL database). Be sure to check that your hosting company supports the
    technologies your software needs to run.


    # HOSTED SERVICES


    It is often worth searching for reviews of a hosting company to see what other
    people''s experience has been with a hosting company. Unfortunately, a hosting
    company is when something goes wrong, you often can tell how good is able to help
    you (so you can find out how they are to see a few negative reviews for any company).


    There are a number of online services that allow you to point your domain name
    to their servers. Blogging platforms such as WordPress.com, Tumblr, and Posterous,
    or e-commerce platforms like Big Cartel and Shopify provide the servers that your
    site is hosted on. If you are using a platform like this you will not need own
    hosting for the website, although you still need hosting for your email. If this
    is the case, some web hosting companies offer packages that will just offer email
    services.'
  merge: -1
  pgno: 494
- img_proc: true
  md: '# FTP & THIRD PARTY TOOLS


    To transfer your code and images from your computer to your hosting company, you
    use something known as File Transfer Protocol.


    As the name suggests, File Transfer Protocol (or FTP) allows you to transfer files
    across the Internet from your computer to the web server hosting your site.


    There are many FTP programs that offer a simple interface that shows you the files
    on your computer alongside the files that are on your web server. These allow
    you to drag and drop files from your computer to the server or vice versa.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_495_0.png)'
  merge: -1
  pgno: 495
- img_proc: true
