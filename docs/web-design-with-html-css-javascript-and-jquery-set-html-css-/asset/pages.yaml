    \ font-size: 200%;\nnh2 {\n  font-size: 1.3em;\n}\n```\n\nThe font-size property\
    \ enables you to specify a size for the font. There are several ways to specify\
    \ the size of a font. The most common are:\n\nPIXELS are commonly used because\
    \ they allow designers very precise control over how much space their text takes\
    \ up. The number of pixels is followed by the letters.\n\nRESULT\n\n\n\n\n# Briards\n\
    \nby iv Duck\n\nThe briard, or berger de brie, is a large breed of dog traditionally\
    \ used as a herder and guardian of sheep.\n\n# Breed History\n\nThe briard, which\
