  md: '# DIRECTORY STRUCTURE


    On larger websites it''s a good idea to organize your code by placing the pages
    for each different section section of the site into a new folder. Folders on a
    website are sometimes referred to as directories.


    # STRUCTURE


    # RELATIONSHIPS


    # HOMEPAGES


    The diagram on the right shows the directory structure for a fictional entertainment
    listings called ExampleArts.


    The relationship between files and folders on a website is described using the
    same terminology as a family tree.


    The main homepage of a site written in HTML (and the hompages of each section
    in a child folder) is called **index.html**.


    The top-level folder is known as the **root** folder. (In example, the root folder
    is called **examplearts**) contains all of the other files and folders for a website.


    In the diagram on the right, you can see some relationships have been drawn.


    Web servers are usually set up to return the **index.html** file if no name is
    specified.


    The **examplearts** folder is a parent of the **movies**, **music** and **theater**
    folders. And the **movies**, **music** and **theater** folders are children of
    the **examplearts** folder.


    Therefore, if you enter examplearts.com it will return examplearts.com/index.html,
    and examplearts.com/music will return examplearts.com/music/index.html.


    Each section of the site is placed in a separate folder; this helps organize the
    files.


    If you are working with a content management system, blogging software, or an
    e-commerce system, you might not have individual files for each page of the website.


    Instead, these systems use one template file for each type of page (such as news
    articles, blog posts, or products).


    Editing the template file would change all of the pages that use that template.
    Do not change any code that is not HTML or you may break the page.'
