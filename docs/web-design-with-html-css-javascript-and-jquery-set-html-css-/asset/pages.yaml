  md: '# SUMMARY BOXES


    +   * CSS treats each HTML element as if it has its own box.

    * You can use CSS to control the dimensions of a box.

    * You can also control the borders, margins and padding for each box with CSS.

    * It is possible to hide elements using the display and visibility properties.

    * Block-level boxes can be made into inline boxes, and inline boxes made into
    block-level boxes.

    * Legibility can be improved by controlling the width of boxes containing text
    and the leading.

    * CSS3 has introduced the ability to create image borders and rounded borders.'
