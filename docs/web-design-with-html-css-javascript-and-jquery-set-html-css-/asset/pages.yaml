  md: '# IE6 BOX MODEL


    # RESULT IN IE6 WITHOUT DOCTYPE


    When you specify the width of a box, any padding or margin should be added to
    the width of it. Internet Explorer 6, however, has a quirk where it includes the
    padding and margins in the width of the box.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_322_0.png)


    The way around is to ensure that you provide a DOCTYPE declaration for the HTML
    page. (DOCTYPE declarations were covered on page 18.1). You can use either the
    HTML5, HTML 4 strict, or HTML 4 transitional DOCTYPE declarations to ensure that
    IE6 follows the correct box model.


    To demonstrate this, you can see the example from the left hand show in IE6, first
    without a DOCTYPE declaration and then again with the HTML5 DOCTYPE declaration.


    # RESULT IN IE6 WITH DOCTYPE


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_322_1.png)'
  merge: -1
  pgno: 322
