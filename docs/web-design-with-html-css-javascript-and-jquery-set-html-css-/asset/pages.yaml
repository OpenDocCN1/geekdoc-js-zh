  md: '# LINKING TO OTHER SITES


    ```

    <a>

    ```


    Links are created using the <a> element which has an attribute called href. The
    value of the href attribute is the page that you want people to go when they click
    on the link.


    Users can click on anything that appears after the opening <a> tag and will be
    taken to the page specified in the href attribute.


    When you link to a different website, the value of the href attribute will be
    the full web address for the site, which is known as absolute URL.


    Browsers show links in blue with an underline by default.


    ```

    chapter-04/linking-to-other-sites.html

    <p>Movie Reviews:

    <ul>

    <li><a href="http://www.empireonline.com">Empire</a></li>

    <li><a href="http://www.metacritic.com">Metacritic</a></li>

    <li><a href="http://www.rottentomatoes.com">Rotten Tomatoes</a></li>

    <li><a href="http://www.variety.com">Variety</a></li>

    </ul>

    </p>

    ```


    Movie Reviews:


    +   - Empire

    - Metacritic

    - Rotten Tomatoes

    - Variety


    # ABSOLUTE URLS


    URL stands for Uniform Resource Locator. Every web page has its own URL. This
    is the web address that you would type into a browser if you wanted to visit that
    specific page.


    An absolute URL starts with the domain name for that site, and can be followed
    by the path to a specific page. If no page is specified, the site will display
    the homepage.'
  merge: -1
