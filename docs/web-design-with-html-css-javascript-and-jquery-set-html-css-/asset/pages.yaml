  md: '# CODE IN A CONTENT MANAGEMENT SYSTEM


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_39_0.png)


    If you are working with a content management system, blogging platform, or e-commerce
    application, you will probably go into a special section of the website to control
    it. The tools provided in the administration sections of these sites usually allow
    you to edit parts of the page rather than the entire page, which means you will
    rarely see the `<html>`, `<head>`, or `<body>` elements.


    Looking at the content management system on the opposite page, you have a box


    that allows you to enter a title for the page, another box for the main article,
    to view a publication date, and something to indicate which of the site page it
    belongs.


    For an e-commerce store, you might have boxes that allow you to enter a title
    for the product, a description of the product, its price, and the quantity available.


    That is because they use a single ''template'' to control all of the pages for
    a section of the site. (For example, an e-commerce


    system might use the same template to show all of their products.) The information
    you supply is placed inside the templates.


    The advantage of this approach is that people who do not know how to write pages
    can add information to a website and it is also possible to change the presentation
    of something in the template, and it will automatically update every page that
    uses that template. If you imagine an e-commerce store with 1,000 items for sale,
    just'
