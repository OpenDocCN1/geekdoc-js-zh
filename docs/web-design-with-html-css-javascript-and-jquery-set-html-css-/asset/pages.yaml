  md: "# PARENTS OF FLOATED ELEMENTS: SOLUTION\n\n| HTML | chapter-15/float-solution.html\
    \ |\n\n```\n<body>\n  <h1>The Evolution of the Bicycle</h1>\n  <div>\n    <p>In\
    \ 1817 Baron von Drais invented a walking machine that would help him get around\
    \ his royal gardens faster...</p>\n  </div>\n</body>\n```\n\nTraditionally, developers\
    \ get around this problem by adding an extra element after the last floated element\
    \ (inside the containing element). A CSS rule would be applied to this additional\
    \ element setting the clear property to have a value of both. But this meant that\
    \ an extra element was added to the HTML just to fix the height of the containing\
    \ element.\n\n| CSS |\n\n```\ndiv {\n  border: 1px solid #665544;\n  overflow:\
    \ auto;\n  width: 100%;\n}\n```\n\nMore recently, developers have opted for a\
    \ purely CSS-based solution because it means there is no need to add an extra\
    \ element to the HTML page after the floated elements. The pure solution adds\
    \ two CSS rules to the containing element (like the <div> element):\n\n| RESULT\
    \ |\n\n# The Evolution of the Bicycle\n\n| 1817 Baron von Drais invented a walking\
    \ machine that would help him get around the gardens faster. | The device known\
    \ as the Draisienne (or \"hobby horse\") was made of wood, and propelled by pushing\
    \ your feet on the ground while riding. | It was not as stable as any other place\
