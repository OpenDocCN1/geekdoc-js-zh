  md: '# Visual hierarchy refers to the order in which your eyes perceive what they
    see. It is created by adding visual contrast between the items displayed. Items
    with higher contrast are recognized and processed first.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_474_0.png)


    Images create a high visual contrast and often attract the eye first. They can
    be used to draw attention to a specific message within the page. In some cases,
    the right image can succinctly reveal more than an page of text.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_474_1.png)


    The effect of a well-designed visual hierarchy is largely subliminal. Achieving
    a good hierarchy requires balance; if nothing stands out a site can be unintentional,
    and if too many aspects are competing for your attention, it can be hard to find
    the key messages. This example has a clear hierarchy which addresses the needs
    of visitors to the site.'
  merge: -1
  pgno: 474
