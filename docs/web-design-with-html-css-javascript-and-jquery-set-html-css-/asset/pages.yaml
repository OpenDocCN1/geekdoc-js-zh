  md: '# HOW THE WEB WORKS


    When you visit a website, the web server hosting that site could be anywhere in
    the world. In order for you to find the location of the web server, your browser
    will first connect to a Domain Name System (DNS) server.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_15_0.png)


    On this page you can see examples that demonstrate how the web server hosts the
    website you are visiting can be anywhere in the world. It is the DNS servers that
    tell your browser how to find the website.


    +   - A user in Barcelona visits sony.jp in Tokyo

    - A user in New York visits google.com in San Francisco

    - A user in Stockholm visits qantas.com.au in Sydney

    - A user in Vancouver visits airindia.in in Bangalore


    On the right you can see what happens when a web user in England wants to view
    the website of the Louvre art gallery in France which is located at www.louvre.fr.
    Firstly, the browser in Cambridge contacts a DNS server in London. The DNS server
    then tells the location of the web server hosting the site in Paris.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'When you connect to the web, you do so via an Internet Service Provider (ISP).
    You type a domain name or web address into your browser to visit a site; for example:
    google.com, bbc.co.uk, microsoft.com.


    Your computer contacts a network of servers called Domain Name System (DNS) servers.
    These act like phone books; they tell your the IP address associated with the
    requested domain name. Every device on the web has a unique IP address; is like
    the telephone number for computer. Traditionally these were numbers of up to 12
    digits separated by periods/stops but they are now being updated to sets of up
    to 32 characters.


    The unique number that the DNS server returns to your computer allows your browser
    to contact the web server that hosts the website you requested. A web server is
    a computer that is constantly connected to the web, and is set especially to send
    web pages to users.


    # Cambridge


    # LONDON


    # PARIS


    The web server then sends the page you requested back to your web browser.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_16_0.png)'
