  md: '# Color can really bring your pages to life.


    In this chapter we will look at:


    +   - How to specify colors, as there are three common ways in which you can indicate
    your choice of colors (plus extra ways made available in CSS3)


    +   - Color terminology, as there are some terms that are very helpful to understand
    when it comes to picking colors


    +   - Contrast, and ensuring that your text is readable


    +   - Background colors for behind either your entire page or parts of a page


    What you will learn about colors in this chapter will then be used in subsequent
    chapters when it comes to looking at colors of text and boxes in CSS.'
