  md: '# # BULLET POINT STYLES

    list-style-type


    The list-style-type property allows you to control the shape or style of a bullet
    point (also known as a **marker**).


    It can be used on rules that apply to the <ol>, <ul>, and <li> elements.


    ```

    chapter-14/list-style-type.html

    <h1>The Complete Poems</h1>

    <h2>Emily Dickinson</h2>

    <ol>

    <li>Life</li>

    <li>Nature</li>

    <li>Love</li>

    <li>Time and Eternity</li>

    <li>The Single Hound</li>

    </ol>

    ```


    # ## ORDERED LISTS


    For an unordered list you can use the following values:


    +   - none

    - disc

    - circle

    - square


    ```

    ol (

    list-style-type: lower-roman);

    )

    ```


    # ## ORDERED LISTS


    For an ordered (numbered) list you can use the following values:


    +   - decimal

    1 2 3


    +   - decimal-leading-zero

    01 02 03


    +   - lower-alpha

    a b c


    +   - upper-alpha

    A B C


    +   - lower-roman

    i. ii. iii.


    +   - upper-roman

    I II III


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_339_0.png)'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# IMAGES FOR BULLETS

    list-style-image


    HTML

    chapter-14/list-style-image.html

    <h1>Index of Translated Poems</h1>

    <h2>Arthur Rimbaud</h2>

    <ul>

    <li>Ophelia</li>

    <li>To Music</li>

    <li>A Dream for Winter</li>

    <li>Vowels</li>

    <li>The Drunken Boat</li>

    </ul>


    You can specify an image to act as a bullet point using the list-style-image property.


    The value starts with the letters url and is followed by a pair of parentheses.
    Inside the parentheses, the path to the image is given inside double quotes.


    This property can be used on rules that apply to the <ul> and <li> elements.


    CSS

    uul {

    list-style-image: url("images/star.png");

    li {

    margin: 10px 0px 0px 0px;

    }


    The example on this page also shows the use of the margin property to increase
    the vertical gap between each item in the list.


    # Index of Translated Poems


    +   Arthur Rimbaud

    * Ophelia

    * To Music

    * A Dream for Winter

    * Vowels

    * The Drunken Boat'
