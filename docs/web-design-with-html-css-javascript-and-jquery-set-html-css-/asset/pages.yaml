  md: "# POSITIONING THE MARKER\nlist-style-position\n\nLists are indented into the\
    \ page by default and the list-style-position indicates whether the marker should\
    \ appear on the inside or the outside of the box containing the main points.\n\
    \nThis property can take one of two values:\n\n# outside\n\nThe marker sits to\
    \ the left of the block of text. (This is the default behaviour if this property\
    \ is not used.)\n\n# inside\n\nThe marker sits inside the box of text (which is\
    \ indented).\n\nIn the example shown, the width of the list has been limited to\
    \ 250 pixels. This ensures that the text wraps onto a new line so you can see\
    \ the value of inside side the bullet inside the first line of text.\n\nA margin\
    \ has been added to each list item so that there is a clear gap between each.\n\
    \n```\nchapter-14/list-style-position.html\n<ul class=\"illuminations\">\n  <li>That\
    \ idol, black eyes and .../</li>\n  <li>Gracious son of Pan! .../</li>\n  <li>When\
    \ the world is reduced .../</li>\n</ul>\n<ul class=\"season\">\n  <li>Once, if\
    \ my memory serves .../</li>\n  <li>Hadn't I once a youth .../</li>\n  <li>Autumn\
    \ already! .../</li>\n</ul>\n```\n\n```\nul {\n  width: 250px;\n  li {\n    margin:\
    \ 10px;\n    ul.illuminations {\n      list-style-position: outside;\n    }\n\
    \    ul.season {\n      list-style-position: inside;\n    }\n  }\n```\n\n| RESULT\
    \ | RESULT |\n|---|---|\n| • Idol, black eyes and yellow mop, without period or\
    \ court | | Once, if my memory serves well was a banquet |\n| Gracious son of\
    \ Pan! Around your fortune counted with flowers ... | Hadn't I once a youth that\
    \ was lively, fertile, childish |\n| When the world is reduced to a single dark\
    \ wood for four ... | Autumn already! - But why regret the everlasting sun if\
    \ we are |"
  merge: -1
  pgno: 341
- img_proc: true
  md: "# # LIST SHORTHAND\nlist-style\n\nHTML chapter-14/list-style.html\n\nAs with\
    \ several of the other CSS properties, there is a property that acts as a shorthand\
    \ for list styles. It is called list-style, and it allows you to express the markers'\
    \ style, image and position properties in any order.\n\n```\n<html>\nQuotes from\
    \ Edgar Allan Poe</h1>\n<ul>\n  <li>I have great faith in fools; self-confidence\
    \ my friends call it.</li>\n  <li>All that we see or seem is but a dream within\
    \ a dream.</li>\n  <li>I would define, in brief, the poetry of words as the rhythmical\
    \ creation of Beauty.</li>\n</ul>\n```\n\nCSS\n\n```\nul {\n  list-style: inside\
    \ circle;\n  width: 300px;\n}\\li {\n  margin: 10px 0px 0px 0px;\n}\n```\n\nRESULT\n\
    \n# ## Quotes from Edgar Allan Poe\n\n+   - I have great faith in fools; self-confidence\
    \ my friends call it.\n- All that we see or seem is but a dream within a dream.\n\
    - I would define, in brief, the poetry of words as the rhythmical creation of\
    \ Beauty."
  merge: -1
  pgno: 342
