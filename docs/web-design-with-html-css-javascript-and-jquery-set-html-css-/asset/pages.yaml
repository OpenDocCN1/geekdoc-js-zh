  md: "# USING FLOAT TO PLACE ELEMENTS SIDE-BY-SIDE\n\nA lot of layouts place place\
    \ boxes next to each other. The float property is commonly used to achieve this.\n\
    \nWhen elements are floated, the height of the boxes can affect which of the following\
    \ elements sit.\n\nIn this example, you can see three paragraphs, each of which\
    \ has a width and a float property set.\n\nThe fourth paragraph (which begins\
    \ \"In 1865, the velocipede...\") does not cross to the left edge of the page\
    \ as it sits right under the third paragraph.\n\nThe reason for this is that the\
    \ fourth paragraph has space to start under the third paragraph, but it cannot\
    \ go further to the second because it is in the way.\n\nSetting the height of\
    \ the paragraphs to be the same as the tallest paragraph would solve this issue,\
    \ but it is rarely suited to reread designs where the amount of text in a paragraph\
    \ or column may vary. It is more common to use the clear property (discussed on\
    \ the next page) to solve this issue.\n\n```\nchapter-15/using-float.html\n<body>\n\
    \  <h1>The Evolution of the Bicycle</h1>\n  <p>In 1817 Baron von Drais invented\
    \ a walking machine that would help him get around...</p>\n</body>\n```\n\n```\n\
    body {\n  width: 750px;\n  font-family: Arial, Verdana, sans-serif;\n  color:\
    \ #665544;\nnp {\n  width: 230px;\n  float: 1px;\n  margin: 5px;\n  padding: 5px;\n\
    \  background-color: #efefef;\n}\n```\n\n| The Evolution of the Bicycle | It was\
    \ not as suitable for any other place than a well maintained pathway. |\n|---|---|n|\
    \ 1817 Baron von Drais invented a walking machine that would help him get around\
