  md: '# KEY CONCEPTS IN

    POSITIONING ELEMENTS


    # BUILDING BLOCKS


    CSS treats each HTML element as if it is in

    own box. This box will either be a block-level

    box or an inline box.


    Block-level boxes start on a new line and act as the main blocks

    of any layout, while inline boxes flow between surrounding text. You

    control how much space each box takes up by setting the width of

    the boxes (sometimes the height). To separate boxes, you can

    use borders, margins, padding, and background colors.


    # BLOCK-LEVEL ELEMENTS

    START ON A NEW LINE


    Examples include:

    <h1> <p> <ul></li>


