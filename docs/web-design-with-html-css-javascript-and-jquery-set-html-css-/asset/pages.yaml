    \ of all time ...</p>\n<h2>Gibson Les Paul</h2>\n<p>The Gibson Les Paul is a solid\
    \ electric guitar that was first sold in 1952 ...</p>\n```\n\n```\nh2, p {\n \
    \ width: 400px;\n  font-size: 90%;\n  line-height: 1.2em;\n  color: #0088dd;\n\
    \  border-bottom: 1px solid #0088dd;\n}\np {\n  min-height: 10px;\n  max-height:\
    \ 30px;\n}\n```\n\nFender Mustang\nTheender Mustang was introduced in 1964 as\
