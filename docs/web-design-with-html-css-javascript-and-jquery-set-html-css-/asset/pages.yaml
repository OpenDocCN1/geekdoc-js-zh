  md: '# FIGURES

    <figure> <figcaption>


    You already met the <figure> element in Chapter 5 when we looked at images. It
    can be used to contain any content that is referenced from the main flow of an
    article (not just images).


    ```

    chapter-17/example.html

    <figure>

    <img src="images/bok-choi.jpg" alt="Bok Choi" />

    <figcaption>Bok Choi</figcaption>

    </figure>

    ```


    It is important to note that the article should still make sense if the content
    of the <figure> element were moved (to another part of the page, or even to a
    different page altogether).


    For this reason, it should only be used when the content simply references the
    element (and not for something that is absolutely integral to the flow of a page).


    Examples of usage include:


    +   - Images

    - Videos

    - Graphs

    - Diagrams

    - Code samples

    - Text that supports the main body of an article


    The <figure> element should also contain a <figcaption> element which provides
    a text description for the content of the <figure> element. In this example, you
    can see a <figure> has been added inside the <article> element.'
  merge: -1
  pgno: 445
