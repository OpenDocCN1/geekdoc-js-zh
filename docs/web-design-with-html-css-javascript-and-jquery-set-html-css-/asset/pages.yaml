  md: 'A large site may have primary, secondary and even tertiary navigation. Primary
    navigation often appears across the top of the site from left to right, or down
    the left hand side of the page. Secondary navigation could be under the primary


    navigation or down the side of the page. Tertiary navigation sits in the footer
    of the page. The menu will not be the only users navigate the site. They will
    also use links within each page. Some sites also offer a search function.


    # ONLINE EXTRA


    Go to the website accompanying this book for information on how to implement search
    functionality for your site using Google Search.


    # CONTEXT


    # INTERACTIVE


    # CONSISTENT


    Good navigation provides context. It lets the user know where they are in the
    website at that moment. Using a different color or some kind of visual marker
    to indicate the current page is a good way to do this.


    Each link should be big enough to click on and the appearance of the link should
    change when the user hovers over each item or clicks on it. It should also be
    visually distinct from other content on the page.


    The more pages a site contains, the larger number of navigation items there will
    be. Although secondary navigation will change from page to page, it is best to
    keep the primary navigation exactly the same.


    | Home Artist Profiles | Exhibitions Galleries Publications About Contact |


    | Home Artist Profiles | Exhibitions Galleries Publications About Contact |'
