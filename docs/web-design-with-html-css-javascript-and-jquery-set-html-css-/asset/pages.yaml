  md: '# CONTROLLING THE POSITION OF ELEMENTS


    CSS has the following positioning schemes that allow you to control the layout
    of a page: normal flow, relative positioning, and absolute positioning. You specify
    the positioning scheme using the position property in CSS. You can also float
    elements using the float property.


    # NORMAL FLOW


    Every block-level element appears on a new line, causing each to appear down the
    page from the previous one. Even if you specify the width of the boxes for two
    elements to sit side-by-side, they will not appear next to each other. This is
    the default behavior (unless you tell the browser to do so).


    # RELATIVE POSITIONING


    This moves an element from the position it would be in normal flow, shifting it
    to the top, right, bottom, or left of where it have been placed. This does not
    affect the position of surrounding elements; they stay in the position they would
    be in normal flow.


    # ABSOLUTE POSITIONING


    This positions the element in relation to its containing element. It is taken
    out of normal flow, meaning that it does not affect the position of any surrounding
    elements (as they simply ignore the space it would have taken). Absolutely positioned
    elements move as you scroll down the page.


