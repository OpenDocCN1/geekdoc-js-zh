  md: '# TYPE SCALES


    You may have noticed that programs such as Word, Photoshop and InDesign offer
    the same sizes of text.


    This is because they are set according to a scale or ratio that was developed
    by European typographers in the sixteenth century.


    browser is 16 pixels. So if you use percentages or em, you calculate the size
    of text you want on the default size used in browsers. For example, you could
    scale down to 12 pixels for body copy and scale up to 24 pixels for headings.


    +   8pt

    9pt

    10pt

    11pt

    12pt

    14pt


    It is considered that this scale for type is pleasing to the eye and it has therefore
    changed little in the last 400 years.


    For this reason, when you designing pages, using sizes from this scale will help
    them look more attractive.


    +   18pt

    24pt

    36pt

    48pt

    60pt

    72pt


    Recently, some web designers have started to leave the body text at the default
    size of 16 pixels and adjust the other font using a scale that keeps the relative
    proportions of one.


    On the next page, you can see how to achieve this scale using pixels, percentages,
    and em.


    When you first see body text at 16 pixels, it might seem large. Once you used
    to the larger type, however most people find it easier to read; and going back
    to a page where main type is 12 pixels will often look quite small.


    Print designers often refer to the size of text in terms of points rather than
    pixels (hence the size of pt on the right). A point roughly equates to a point
    because a point corresponds to 1/72 of an inch, and most computer displays have
    72 dots per inch.


    The default size of text in a'
