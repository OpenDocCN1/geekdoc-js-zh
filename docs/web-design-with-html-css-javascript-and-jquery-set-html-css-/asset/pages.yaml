  md: '# STRUCTURING WORD DOCUMENTS


    The use of headings and subheadings in any document often reflects a hierarchy
    of information. For example, a document might start with a large heading, followed
    by an introduction or the most important information.


    This might be expanded upon subheadings lower down on the page. When using a word
    processor to create a document, we separate the text to give it structure. Each
    topic might have a new paragraph, and each section can have a heading to describe
    what it covers.


    On the right, you can see a simple document in Microsoft Word. The different styles
    for the document, such as different levels of heading, are shown in the drop down
    box. If you regularly use Word, you might have also used the formatting toolbar
    or palette to do this.'
