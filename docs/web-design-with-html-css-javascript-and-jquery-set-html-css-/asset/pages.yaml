  md: "# SECTIONS\n<section>\n\nThe <section> element groups related content together,\
    \ and typically each section would have its own heading.\n\nFor example, on a\
    \ homepage there may be several <section> elements to contain different sections\
    \ of the page, such as latest news, top products, and newsletter signup.\n\nBecause\
    \ the <section> element groups related items together, it may contain several\
    \ distinct <article> elements that have a common theme or purpose.\n\nAlternatively,\
    \ if you have a page with a long article, the <section> element can be used to\
    \ split the article into separate sections.\n\nThe <section> element should not\
    \ be used as a wrapper for the entire page (unless the page only contains one\
    \ distinct piece of content). If you want a containing element for the entire\
    \ page, that job is still best left to the <div> element.\n\n```\nchapter-17/example.html\n\
    <section class=\"popular-recipes\">\n  <h2>Popular Recipes</h2>\n  <a href=\"\"\
    >Yakitori (grilled chicken)</a>\n  <a href=\"\">Tsuukune (minced chicken patties)</a>\n\
