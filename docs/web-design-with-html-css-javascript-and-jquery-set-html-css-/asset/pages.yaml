  md: "# # HELPING OLDER BROWERS UNDERSTAND\n\n```\nCSS\nchapter-17/example.html\n\
    header, section, footer, aside, nav, article,\nfigure, figcaption {\n  display:\
    \ block;\n}\n```\n\nOlder browsers that do not know the new HTML5 elements will\
    \ automatically treat them as inline elements. Therefore, to help older browsers,\
    \ you should include the line of CSS on the left which switches new elements to\
    \ be rendered as block-level elements.\n\n```\nCSS\nchapter-17/example.html\n\
    <!--[if lt IE 9]>\n<script src=\"http://html5shiv.google.com/svn/trunk/html5shiv.js\"\
    ></script>\n<![endif]-->\n```\n\nAlso, IE9 was the first version of Internet Explorer\
    \ to allow CSS rules to be associated with these new HTML5 layout elements. In\
    \ order to style these elements using earlier versions of IE, you need to use\
    \ a simple JavaScript known as the HTML5 shiv or HTML5 shim.\n\nYou do not need\
    \ to understand JavaScript to use it. You can link to a copy that Google hosts\
    \ on its servers. It should be placed inside a conditional comment which checks\
    \ if the browser version is less than (hence the 1t) IE9.\n\nUnfortunately, this\
    \ workaround does require that anyone using earlier versions of IE has JavaScript\
    \ enabled in their browser. If they do not have JavaScript enabled then they will\
    \ not be able to see the content of these HTML5 elements."
  merge: -1
