  md: "# IMAGE ROLLOVERS & SPRITES\n\nUsing CSS, it is possible to create a link or\
    \ button that changes to a second style when a user moves their mouse over it\
    \ (known as a rollover) and a third style when they click on it.\n\nThis is achieved\
    \ by setting a background image for the link or button that has three different\
    \ styles of the same button (but only allows enough space to show one of them\
    \ at a time). You can see the image we are using in this example on the right.\
    \ It actually features two buttons on the one image.\n\nWhen the users move their\
    \ mouse over the element, or clicks on it, the background image is moved to show\
    \ the relevant image.\n\nWhen a single image is used for several different parts\
    \ of an interface, it is known as a sprite. You can add the logo and other interface\
    \ elements, as well as buttons to the image.\n\nThe advantage of using sprites\
    \ is that the browser only needs request one image rather than many images, which\
    \ can make the web page load faster.\n\nchapter-16/image-rollovers-and-sprites.html\n\
    \n```\n<a class=\"button\" id=\"add-to-basket\">\nAdd to basket</a>\n<a class=\"\
    button\" id=\"framing-options\">\nFraming options</a>\n```\n\nCSS\n\n```\na.button\
    \ {\n  height: 36px;\n  background-image: url(\"images/button-sprite.jpg\");\n\
    \  text-indent: -9999px;\n  display: inline-block;\n}\n#add-to-basket {\n  width:\
    \ 174px;\n  background-position: 0px 0px;\n}\n#framing-options {\n  width: 210px;\n\
    \  background-position: -175px 0px;\n}\n#add-to-basket:hover {\n  background-position:\
    \ 0px -40px;\n}\n#framing-options:hover {\n  background-position: -175px -40px;\n\
    }\n#add-to-basket:active {\n  background-position: 0px -80px;\n}\n#framing-options:active\
    \ {\n  background-position: -175px -80px;\n}\n```"
  merge: -1
  pgno: 423
