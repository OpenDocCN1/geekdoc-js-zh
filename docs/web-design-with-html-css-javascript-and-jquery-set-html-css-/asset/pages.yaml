  md: "# # LIMITING HEIGHT\nmin-height, max-height\n\nIn the same way you might want\
    \ to limit the width of a box on a page, you may also want to limit the height\
    \ of it. This is achieved using the min-height and max-height properties.\n\n\
    The example on this page demonstrates these properties in action. It also shows\
    \ what happens when the content of the box takes up more space than sized for\
    \ the box.\n\nIf the box is not big enough to hold the content, and the content\
    \ expands outside the box it can look messy. What happens when there is not enough\
    \ space for the content of a box, you can use the overflow property, which is\
    \ discussed on the next page.\n\n```\nchapter-13/min-height-max-height.html\n\
    <h2>Fender Mustang</h2>\n<p>The Fender Mustang was introduced in 1964 as the basis\
