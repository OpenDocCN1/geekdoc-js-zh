  md: '# CHANGES TO CONTENT


    | HTML | chapter-02/insert-and-delete.html |

    |---||

    | <p>It was the <del>worst</del><ins>best</ins> idea she had ever had.</p> |


    The <ins> element can be used to show content that has been inserted into a document,
    while the <del> element can show text that has been deleted from it.


    The content of an <ins> element is usually underlined, while the content of a
    <del> element usually has a line through it.


    | RESULT |

    |---||

    | It was the worst best idea she had ever had. |


    | HTML | chapter-02/strikethrough.html |

    |---||

    | <p>Laptop computer:</p>

    <p><s>Was $995</s></p>

    <p>Now only $375</p> |


    The <s> element indicates that something is no longer accurate or relevant (but
    that should not be deleted).


    Visually the content of an <s> element will usually be displayed with a line through
    the center.


    Older versions of HTML had a <u> element for content that was underlined, but
    this is being phased out.


    | RESULT |

    |---||

    | Laptop computer:

    Was $995

    Now only $375 |'
