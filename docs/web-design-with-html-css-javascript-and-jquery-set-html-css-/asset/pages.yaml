  md: "# FILE INPUT BOX\n\n# <input>\n\nIf you want to allow users to upload a file\
    \ (for example an image, video, mp3, or a PDF), you will need to use a file box.\n\
    \n```\nchapter-07/file-input-box.html\n```html\n<form action=\"http://www.example.com/upload.php\"\
    \n  method=\"post\">\n  <p>Upload your song in MP3 format:</p>\n  <input type=\"\
    file\" name=\"user-song\" /><br />\n  <input type=\"submit\" value=\"Upload\"\
    \ />\n</form>\n```\n```\n\n# type=\"file\"\n\nThis type of input creates a box\
    \ that looks like a text input followed by a Browse button. (One notable exception\
    \ is Safari on a Mac, which tends to display a button labelled Choose File, followed\
    \ by the text \"no file selected\" or the name of the file that has been chosen\
    \ by the user.) When the user clicks on the Browse button, a window opens up that\
    \ allows them to select a file from their computer to be uploaded to the website.\n\
    \nWhen you are allowing users to upload files, the method attribute of the <Form>\
    \ element must have a value of post. (You cannot send files using the HTTP method.)\n\
    \nUpload your song in MP3 format:\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_165_0.png)\n\
    \nWhen a user clicks on the browse button, the presentation of the window that\
    \ allows them to browse for the file they want to upload will match the windows\
    \ of the user's operating system. You cannot control the appearance of these windows."
  merge: -1
  pgno: 165
- img_proc: true
  md: "# SUBMIT BUTTON\n\n```\nHTML\nchapter-07/submit-button.html\n<form action=\"\
    http://www.example.com/subscribe.php\">\n  <p>Subscribe to our email list:</p>\n\
    \  <input type=\"text\" name=\"email\" />\n  <input type=\"submit\" name=\"subscribe\"\
    \ value=\"Subscribe\" />\n</form>\n```\n\n# <input type=\"submit\">\n\nThe submit\
    \ button is used to send a form to the server.\n\n# name\n\nIt can use a name\
    \ attribute but it does not need to have one.\n\n# value\n\nThe value attribute\
    \ is used to control the text that appears on a button. It is a good idea to specify\
    \ the words you want to appear on a button because the default value of buttons\
    \ on some browsers is 'Submit query' and this might not be appropriate for all\
    \ kinds of forms.\n\n# RESULT\n\nSubscribe to our email list:\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_166_0.png)\n\
    \nDifferent browsers will show submit buttons in different ways and tend to fit\
    \ the visual presentation of the browser. If you want to control the appearance\
    \ of a submit button, you can either use CSS (as you will learn on page 343),\
    \ or you can use an Image for the button."
