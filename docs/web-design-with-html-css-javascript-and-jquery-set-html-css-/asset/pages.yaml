  md: 'If you design on a Mac, it is important to check what the typefaces look like
    on a PC because PCs can render type less smoothly. But if you design on a PC,
    then it should look fine on a Mac.


    # IMAGES


    # SIFR


    # CUFON


    You can create a graphic that contains the text as you want to appear in a different
    typeface.


    The font is embedded into a Flash movie, and JavaScript replaces specified HTML
    text with a flash version of it.


    Cufon offers functionality to sIFR. It uses JavaScript to create either an SVG
    or VML version of the text.


    Pages 99-100 and 109-113


    See website for more details


    See website for more details


    # COVERED ON


    # ISSUES


    People who use screen readers will only rely on the al t text to know what is
    said.


    This method only works if the user has Flash and JavaScript enabled on their device.


    Requires JavaScript to be enabled. Also, users cannot select text, and text can''t
    change when a user hovers over it.


    # LICENSING


    You can use any typeface that you have a license to use on your computer (because
    you are not distributing the typeface).


    Many commercial merchants of typefaces allow this technique, although you may
    need to pay for an extra web-use license.


    As sIFR, some typeface makers allow use of their fonts with CUFON, but you need
    to check the license.


    # CHOICE OF TYPEFACES


    Very wide choice because you can use any typeface that you have a license for.


    This method provides a lot of choice because many of the major typeface manufacturers
    permit this kind of usage.


    Slightly less choice than sIFR, as some typeface manufacturers are not as known
    on this technique.


    NOT SUITABLE FOR LONG PASSAGES OF TEXT'
