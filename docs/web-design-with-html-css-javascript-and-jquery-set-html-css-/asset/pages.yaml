  md: '# RADIO BUTTON


    # <input type="radio">


    Radio buttons allow users to pick just one of many options.


    # name


    The name attribute is sent to the server with the value of the option the user
    selects. When a question provides users with options in the form of radio buttons,
    the value of the name attribute should be the same for all of the radio buttons
    used to answer that question.


    # value


    The value attribute indicates the value that is sent to the server for the selected
    option. The value of each of the buttons in a group should be different (so that
    the server knows which option the user has selected).


    # checked


    The checked attribute can be used to indicate which (if any) should be selected
    when the page loads. The value of this attribute is checked. Only one radio button
    in a group should use this attribute.


    ```

    chapter-07/radio-button.htmln<form action="http://www.example.com/profile.php">

    <p>Please select your favorite genre:

    <br />

    <input type="radio" name="genre" value="rock"

    checked="checked" /> Rock

    <input type="radio" name="genre" value="pop" /> Pop

    <input type="radio" name="genre" value="jazz" /> Jazz

    </p>

    </form>

    ```


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_161_0.png)


    > Please note: Once a radio button has been selected it cannot be deselected.
    The user can only select a different option. If you are only allowing the one
    and want them to be able to deselect it (for example if they are indicating they
    agree to terms and conditions), you should use a checkbox instead.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# CHECKBOX


    ```

    <form action="http://www.example.com/profile.php">

    <p>Please select your favorite music service(s):

    <br />

    <input type="checkbox" name="service" value="itunes" checked="checked" /> iTunes

    <input type="checkbox" name="service" value="lastfm" /> Last.fm

    <input type="checkbox" name="service" value="spotify" /> Spotify

    </p>

    </form>

    ```


    # <input type="checkbox">


    Checkboxes allow users to select (and deselect) one or more options in answer
    to a question.


    # name


    The name attribute is sent to the server with the value of the option(s) the user
    selects. When a question provides users with options for checkboxes, the value
    of the name attribute should be the same for all of the buttons that answer that
    question.


    # RESULT


    Please select your favorite music service(s):


    +   - iTunes

    - Last.fm

    - Spotify


    # value


    The value attribute indicates the value sent to the server if this box is checked.


    # checked


    The checked attribute indicates that this box should be checked when the page
    loads. If used, its value should be checked.'
  merge: -1
