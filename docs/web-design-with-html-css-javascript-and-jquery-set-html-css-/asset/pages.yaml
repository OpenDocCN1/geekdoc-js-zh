  md: '# # WHY USE EXTERNAL STYLE SHEETS?


    When building a website there are several advantages to placing your CSS rules
    in a separate style sheet.


    All of your web pages can share the same style sheet. This is achieved by using
    the <link> element on each HTML page of your site to link to the same CSS document.
    This means that the same code does not need to be repeated in every page (which
    results in less code and smaller HTML pages).


    Therefore, once the user has downloaded the CSS stylesheets, the rest of the site
    will load faster. If you want to make a change to how your site appears, you only
    need to edit the one CSS file and all of your pages will be updated. For example,
    you can change the style of every <style> by altering


    the one CSS style sheet, rather than changing the CSS rules on every page. The
    HTML code will be easier to read and edit because it does not have lots of CSS
    rules in the same document. It is generally considered good practice to have the
    content of the site separated from the rules that determine how it appears.


    Sometimes you might consider CSS rules in the same page as your HTML code.


    If you are just creating a single page, you might decide to put the rules in the
    same file to keep everything in one place. (However, many authors would consider
    it better practice to keep the CSS in a separate file.)


    If you have one page which requires a few extra rules (that are not used by the
    rest of the site), you might consider using CSS in the same page. (Again, many
    authors consider it better practice to keep all CSS rules in a separate file.)


    Most of the examples in this book place the CSS rules in the <head> of the document
    (using the <style> element) rather than a separate document. It is simply to save
    you opening two files to see how the CSS work.'
  merge: -1
  pgno: 247
