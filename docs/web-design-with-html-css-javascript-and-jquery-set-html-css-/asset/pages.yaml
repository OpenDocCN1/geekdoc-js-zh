  md: 'In this section, we will look at how to make your web pages more attractive,
    controlling the design of them using CSS.


    CSS allows you to create rules that specify how the content of an element should
    appear. For example, you can specify that the background of the page is cream,
    all paragraphs should appear in gray using the Arial typeface, or that all level
    one headings should be in a blue, italic, Times typeface.


    Once you have learned how to write a CSS rule, learning CSS mostly involves learning
    the different properties you can use. So this chapter will:


    +   - Introduce you to how CSS works

    - Teach you how to write CSS rules

    - Show you how CSS rules apply to HTML pages


    The remaining chapters in this section will look at all of the various CSS properties
    you can use.'
