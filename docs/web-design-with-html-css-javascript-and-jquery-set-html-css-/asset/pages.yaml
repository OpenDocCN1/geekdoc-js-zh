  md: "# # CENTERING IMAGES\nUSING CSS\n\n# HTML\n\n```\n<p><img src=\"images/magnolia-medium.jpg\"\
    \nalalt=\"Magnolia\" class=\"align-center medium\" />\n<b><i>Magnolia</i></b>\
    \ is a large genus\ncontains over 200 flowering plant species. It is\nnamed after\
    \ French botanist Pierre Magnol and,\nhaving evolved before bees appeared, the\n\
    flowers were developed to encourage pollination\by beetles.</p>\n```\n\nBy default,\
    \ images are inline elements. This means that they flow within the surrounding\
    \ text. In order to center an image, it should be turned into a block-level element\
    \ using the display property with a value of block.\n\nOnce it has been made into\
    \ a block-level element, there are two common ways in which you can horizontally\
    \ center an image:\n\n# CSS\n\n```\nimg.align-center {\n  display: block;\n  margin:\
    \ 0px auto;\n}\nimg.medium {\n  width: 250px;\n  height: 250px;\n}\n```\n\n+ \
    \  1: On the containing element, you can use the text-align property with a value\
    \ of center.\n\n+   2: On the image itself, you can use the margin property and\
    \ set the values of the left and right margins to auto.\n\nYou can specify class\
    \ names that allow any element to be centered, the same way you can for the dimensions\
    \ or alignment of images.\n\n# RESULT\n\nThe techniques for specifying image size\
    \ and alignment of images can also be used with the HTML5 <figure> element, which\
    \ you met on page 120.\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_418_0.png)\n\
    \nMagnolia is a large genus that contains over 200 flowering plant species. It\
    \ is named after French botanist Pierre Magnol and, having evolved before bees\
    \ appeared, the flowers were developed to encourage pollination by beetles."
  merge: -1
