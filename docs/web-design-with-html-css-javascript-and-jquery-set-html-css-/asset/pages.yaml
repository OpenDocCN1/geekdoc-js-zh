  md: '# WHO IS THE SITE FOR?


    Every website should be designed for the target audience—not just for yourself
    or the site owner. It is therefore very important to understand who your target
    audience is.


    It can be helpful to ask some questions about the people you would expect to be
    interested in the subject of your site.


    # TARGET AUDIENCE: INDIVIDUALS


    If you ask a client who a site is for, it is not uncommon for them to answer "the
    entire world."


    +   * What is the age range of your target audience?

    * Will your site appeal to more women or men? What is the mix?

    * Which country do your visitors live in?

    * Do they live in urban or rural areas?

    * What is the average income of visitors?

    * What level of education do they have?

    * What is their marital or family status?

    * What is their occupation?

    * How many hours do they work per week?

    * How often do they use the web?

    * What kind of device do they use to access the web?


    Realistically, it is unlikely to relevant to everyone. If your site sells light
    bulbs, even though most people use a computer probably light bulbs, are not likely
    to order them from someone in a different country.


    Even if the site has a wide appeal, you can still think about the demographics
    of a sample of the target audience.


    # TARGET AUDIENCE: COMPANIES


    +   * What is the size of the company or relevant department?

    * What is the position of people in the company who visit your site?

    * Will visitors be using the site forประเทศไทย or for someone else?

    * How large is the budget they control?'
  merge: -1
  pgno: 461
- img_proc: true
  md: 'Invent some fictional visitors from your typical target audience. They will
    become your friends. They can influence design decisions from color palettes to
    level of detail in descriptions.


    | NAME | GORDON | MOLLY | JASPER | AYO | IVY |

    |---|---|---|---|---||

    | Gender | M | F | M | M | F |

    | Age | 28 | 47 | 19 | 32 | 35 |

    | Location | Chicago | San Francisco | New York | Miami | Boston |

    | Occupation | Teacher | Attorney | Student | Retail | Journalist |

    | Income | $62k | $180k | $24k | $160k | $75k |

    | Web Use | 2-3 days/wk | Daily | Daily | 4-5 days/wk | Daily |


    If you have a question about how the site is going to be used, or what its priorities
    should be, you will be able to think back and ask yourself, "What would Gordon
    or Molly want in this situation?"'
