  md: "# SPECIFYING TYPEFACES\nfont-family\n\nThe font-family property allows you\
    \ to specify the typeface that should be used for any text inside the element(s)\
    \ by a CSS rule.\n\nThe value of this property is the name of the typeface you\
    \ want to use.\n\nThe people who are visiting your site need the typeface you\
    \ have specified installed on their computer in order for it to be displayed.\n\
    \nYou can specify a list of fonts separated by comma, so if the user does not\
    \ have your first choice of typeface installed, the browser can try to find an\
    \ alternative font from the list.\n\nIt is also common to end with a generic name\
    \ for that type of font (which you can see on pages 269-270).\n\nIf a name is\
    \ made up of more than one word, it should be put in double quotes.\n\nDesigners\
    \ suggest pages look better if they use no more than three types on a page.\n\n\
    If we use an extended version of the HTML shown on this page for all of the examples\
    \ in this chapter.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Font Family</title>\n\
    <style type=\"text/css\">\nbody\n  font-family: Georgia, Times, serif;\n  h1,\
    \ h2\n  font-family: Arial, Verdana, sans-serif;\n  .credits\n  font-family: \"\
    Courier New\", Courier,\n  monospaced;\n</style>\n</head>\n<body>\n<h1>Briards</h1>\n\
    <p class=\"credits\">by Ivy Duckett</p>\n<p class=\"intro\">The <a class=\"breed\"\
    \ \nref=\"http://en.wikipedia.org/wiki/Briard/></a>, or de large breed of dog\
    \ traditionally used as a herder and guardian of sheep...</</p>\n</body>\n</html>\n\
    ```\n\n| chapter-12/font-family.html | HTML | CSS |\n\n# Briards\n\nby Ivy Duckett\n\
    \nThe briard, or berger de brie, is a large breed of dog traditionally used as\
    \ a herder and guardian\n\n# Breed History\n\nThe briard is believed to have originated\
    \ in France, has been bred for centuries to herd and protect sheep. The breed\
    \ was used by the French army as messengers and to save wounded soldiers because\
    \ of its fine sense of hearing. Briards were used in the World War almost to the\
    \ point of extinction. Currently, the population of briards is slowly recovering.\
    \ Charlemagne, Napoleon, Thomas Jefferson and Lafayette owned briards.\n\n| RESULT\
    \ |"
  merge: -1
