    Width and height

    Borders (color, width, and style)

    Background color and images

    Position in the browser window


    Typeface

    Size

    Color

    Itics, bold, uppercase,

    lowercase, small-caps


    There are also specific ways in which you can style certain elements as lists,
    tables, and forms.'
