  md: '# HTML5: FIGURE AND FIGURE CAPTION


    HTML chapter-05/figure-and-figure-caption.html


    ```

    <figure>

    <img src="images/otters.jpg" alt="Photograph of two sea otters floating in water"
    /><br />

    <figcaption>Sea otters hold hands when they sleep they don''t drift away from
    each other.</figcaption>

    </figure>

    ```


    Images often come with captions. HTML5 has introduced a new <figure> element to
    contain images and their caption so that they are associated.


    You can have more than one image inside the <figure> element as long as they all
    share the same caption.


    Browsers sometimes indent the contents of the <figure> element.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_126_0.png)


    # <figcaption>


    The <figcaption> element has been added to HTML5 in order to allow web page authors
    to add a caption to an image.


    Before these elements were created there was no way to associate an <img> element
    with its caption.


    Older browsers that do not understand HTML5 elements simply ignore the new elements
    and display the content of them.'
  merge: -1
  pgno: 126
