  md: '# # CONTAINING ELEMENTS


    If one block-level element sits inside another block-level element then the outer
    box is known as the **containing** or **parent** element.


    It is common to group a number of elements together inside a `<div>` (or block-level)
    element. For example, you might group together all of the elements that form the
    header of a site (such as the logo and the main navigation). The `<div>` element
    that contains this group of elements is referred to as the **containing** element.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_368_0.png)


    A box may be nested inside several other block-level elements. The containing
    element is **always the parent of element**.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_368_1.png)


    The orange lines in this diagram represent `<div>` elements. The header (containing
    the logo and navigation) are in one `<div>` element, the main content of the page
    is in another, and the footer is in a third. The `<body>` element is the containing
    element for these three `<div>` elements. The second `<div>` element is the containing
