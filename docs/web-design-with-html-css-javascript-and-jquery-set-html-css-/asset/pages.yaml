  md: '# HOW PEOPLE ACCESS THE WEB


    Before we look at the code used to build websites it is important to consider
    the different ways in which people access the web and clarify some terminology.


    # BROWSERS


    # WEB SERVERS


    # SCREEN READERS


    People access websites using software called a web browser. Popular examples include
    Firefox, Internet Explorer, Safari, Chrome, and Opera.


    When you ask your browser for a web page, the request is sent across the Internet
    to a special computer known as a web server which hosts the website.


    Screen readers are programs that read out the contents of a computer screen to
    a user. They are commonly used by people with visual impairments.


    In order to view a web page, users might need a web address into their browser,
    follow a link from another, or use a bookmark.


    Web servers are special computers that are constantly connected to the Internet,
    and are optimized to send web pages to people who request them.


    In the same way that many countries have legisl that require public buildings
    to be accessible to those with disabilities, many laws have been passed that require
    websites to be accessible to those with disabilities.


    Software manufacturers regularly release new versions of browsers with new features
    and supporting new additions to languages. It is important, however, to remember
    that many computer owners will not be running the latest versions of these browsers.
    Therefore you cannot rely on all visitors to your site being able to use the latest
    functionality offered in all browsers.


    Some big companies run their own web servers, but it is more common to use the
    services of a web hosting company charge a fee to host your site.


    Through this book you will see several references to screen readers. These notes
    will help ensure that the sites you create are accessible to people who use such
    software.


    # DEVICES


    People are accessing websites on an increasing range of devices including desktop
    computers, laptops, tablets, and mobile phones. It is important to remember that
    various devices have different sizes and some have faster connections to the web
    others.


    You will learn how to tell which browsers visitors use to access your website
    in Chapter 19.


    It is interesting to note that similar to those employed by screen readers are
    also being used in other areas where people are unable read a screen, as when
    they are driving or jogging.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# HOW WEBSITES ARE CREATED


    All websites use HTML and CSS, but content management systems, blogging software,
    and e-commerce platforms often add a few more technologies into the mix.


    # WHAT YOU SEE


    # HOW IT IS CREATED


    # HTML5 & CSS3


    When you are looking at a website, it is most likely that your browser will be
    receiving HTML and CSS from the web server that hosts the site. The web browser
    interprets the HTML and CSS code to create the page you see.


    Small websites are often written using HTML and CSS.


    Since the web was first created there have been several versions of HTML and CSS
    — each intended to be an improvement on the previous version.


    Larger websites — in particular those that are updated regularly and use a content
    management system (CMS), blogging tools, or e-commerce software — often make use
    of more complex technologies on the web server, but these technologies are actually
    used to produce HTML and CSS that is sent to the browser. If your site uses these
    technologies, you will be able to use your new HTML and CSS knowledge control
    over your site links.


    At the time of writing this book, HTML5 & CSS3 were still being developed. Although
    they had not finalized, many browsers were already supporting some features of
    these languages and a lot of people were using the latest code on their websites.
    I have therefore chosen to teach you these versions.


    Most pages also include extra content such as images, audio, video, or animations
    this book will teach you how to prepare for their use on the web and how to insert
    them into your pages.


    Some sites also use JavaScript or Flash to flash, and you will see how to add
    JavaScript and Flash in your web pages. Both of these technologies are advanced
    topics that you can go on learn about once you have mastered HTML and CSS, if
    you want to.


    Larger, more complex sites like these use a database to store data, and programming
    languages such as PHP, ASP.NET, Java, or Ruby on the web server, but you do not
    need to know these technologies to improve the user feels. The skills you learn
    in this book should be enough to help you on that road.


    Because HTML5 and CSS3 built on previous versions of these languages, learning
    these means you will also be able to understand the earlier versions of them.
    I have added clear notes when the code is new and when it might not work in older
    browsers.


    INTRODUCTION'
  merge: -1
