  md: '# # WEB DEVELOPER TOOLBAR


    This helpful extension for Firefox and Chrome provides tools to show you the CSS
    styles apply to an element when you hover over it, along with the structure of
    the HTML.


    Download this tool from: [www.chrispederick.com/work/web-developer/](https://www.chrispederick.com/work/web-developer/)


    To see the CSS styles and HTML structure of a web page, go to the CSS menu of
    the Web Developer Toolbar and pick View Style Information.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_354_0.png)


    # ## 1: OUTLINES


    # ## 2: STRUCTURE


    # ## 3: CSS STYLES


    When you hover over an element, a red outline will be drawn around it, showing
    how much space the element takes.


    While hovering over an element, the structure will be shown at the top of the
    window. You can see the `<h1>` has a class of completed, `<ul>` with a class called
    `to-do`. The list is inside `<div>` with an id of page, and this sits inside the
    `<body>` and `<html>` elements.


    This can be very helpful when writing CSS selectors to help you target the right
    element.


    When hovering over an element, click with your mouse to display the CSS. You will
    see the rules that apply to it (and the line they are on). Above you can see the
    code of the style sheet (and the path to it).


    This helps check which styles are applied to an element. You can use it for code
    for your own site or when you want to see what styles someone else is on their
    site.


    This tool also allows you to change the screen size, validate your HTML and CSS,
    and turn off images.'
