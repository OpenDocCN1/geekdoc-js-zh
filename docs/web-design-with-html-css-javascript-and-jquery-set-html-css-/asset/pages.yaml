    \ dissolved gases (mostly oxygen and carbon), minerals (like calcium and carbon\
    \ dioxide), nutrients, and pH. These elements vary in their composition as well\
    \ as their influence on marine life.\n\n# SATURATION\n\nThis is expressed as a\
    \ percentage.\n\n# LIGHTNESS\n\nThis is expressed as a percentage with 0% white,\
    \ 50% normal, and 100% black.\n\nThe hsla color property allows you to specify\
    \ color properties using hue, saturation, and lightness as well as a fourth value\
    \ which represents transparency (just like rgba property). The stands for:\n\n\
    Older browsers do not recognize HSL and HSLA values, it is a good idea to add\
    \ an extra rule which specifies the color using a hex code, RGB value, or color\
