  md: '# UNDERSTANDING VIDEO FORMATS AND PLAYERS


    To add video to your site, there are two key issues to understand: file formats
    and video players/plugins.


    # FORMATS


    # PLAYERS / PLUGINS


    # APPROACH


    Videos are available in many formats (Blu-Ray, DVD, VHS, to name a few). There
    are even more video formats (including AVI, Flash Video, H264, MPEG, Ogg Theory,
    QuickTime, WebM, and Windows Media).


    Browsers were initially designed to show text and images only. For this reason,
    browsers built prior to 2010 generally required another program called a player
    or plugin to be installed in order to play video content.


    The easiest way to add video to your site is to use a hosted service such as YouTube
    or Vimeo.


    Just as your DVD player won''t play a VHS cassette, browsers differ in what video
    formats they do and not support.


    These players and plugins only supported certain video formats.


    However, there are some cases where using these services is not appropriate (as
    you will see on the next page) and you will want to host the video on your own
    site.


    In order to view your video online, you may need to convert it to another format.


    Recently browsers have evolved to support the HTML5 <video> tag (which renders
    players and plugins obsolete).


    At the time of writing, to ensure most people can play your video content, it
    is considered best practice to use the HTML <video> element for browsers that
    support it, and Flash video that do not. This means you would need to upload any
    videos you want to show in at least two formats: WebM and MP4.


    The process of converting a video into another format is sometimes referred to
    as "encoding" the video.


    There are several apps available on the web that enable you to encode videos (such
    as www.myvideoconverter.com).


    Unfortunately, you cannot rely on every visitor to your website having a browser
    that supports this new HTML5 element and the browsers that do recognize the <video>
    element require the video to be encoded in different formats.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# USING HOSTED VIDEO SERVICES


    The easiest way to add a video to your site is to upload the video to a site like
    YouTube or Vimeo and use the features provided on their site to embed the video
    in your page.


    # ADVANTAGES


    # DISADVANTAGES


    # THE ALTERNATIVE


    Hosted video sites (such as YouTube) provide players that work with the majority
    of web browsers.


    Your video will be available on the site of the hosted service, so if you want
    the content to be exclusively available on your site (and not visible on other
    sites), you need to host the video on your own server and add your player into
    the page.


    If you want to host video on your own site - than a lot more work is involved
    in setting up your site to play the video.


    You do not need to worry about encoding your video since these sites allow you
    to upload your content in a range of formats. Once uploaded, they automatically
    convert your video into the various formats required by different browsers.


    We will be looking at two ways that you can host your own videos: using Flash
    and the HTML5 <video> element.


    Some services will limit what video is allowed to include. For example, most prohibit
    the use of advertising in the video you upload (which prevents you from monetizing
    that content).


    In order to have the maximum number of visitors to your site can see the video,
    you will need to use a combination of these techniques.


    Hosting companies charge extra if you use a lot of bandwidth, and video files
    can be quite large. Therefore, it can cost you to host the videos on your own
    site. If your video is hosted on a site like Vimeo, however, you do not need to
    pay for the bandwidth.


    Some services will play their own adverts before your video will begin, or even
    them over the screen as your video is playing. The quality of video on some hosted
    services can also be limited.'
  merge: -1
  pgno: 216
