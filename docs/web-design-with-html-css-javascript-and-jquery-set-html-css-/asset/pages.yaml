  md: '# HOW FLASH WORKS


    Since the late 1990s, Flash has been a very popular tool for creating animations,
    and later for playing audio and video in websites.


    Whether you are creating an animation or a media player in Flash, the files you
    put on your website are referred to as **Flash movies**.


    If you want to create your own movie, you need to purchase the Flash authoring
    environment from Adobe.


    When you create a Flash file in the Flash authoring environment, it is saved with
    the .fla file extension. In order to use this on a web page it has to be saved
    in a different format known as SWF. (It has the .swf extension.)


    When you export movie into SWF format, Flash creates code that you can embed the
    Flash movie in your page. Traditionally, this code used the HTML `<object>` and
    `<embed>` tags. Now, however it is more common to use JavaScript.


    To view Flash, browsers need to use a plugin (an extra piece of software that
    runs in the browser) called the Flash Player. Statistics indicate that 98% of
    browsers on desktop computers have the Flash plugin installed. (The percentage
    of mobiles and tablets with it is much less.)


    There are, however, several companies that offer Flash animations and slideshows,
    as well as video and audio players that you can use without purchasing this tool.


    There is no space in this book to teach you how to create Flash movies (there
    are many books devoted to that one topic), but this chapter will show you how
    to add Flash movies to your site.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_209_0.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_209_1.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_209_2.png)


    The Flash authoring environment is used to create Flash Movies.


    The .fla file is exported to .swf format to use in a web page.


    The .swf file is included in your web page using JavaScript.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# USE OF FLASH


    Since 2005, a number of factors have made fewer websites are written in Flash
    or even use elements of Flash in their pages.


    When Flash was first released, it was developed to create animations. The technology
    quickly evolved, however, and people started to use it to build media players
    and even entire websites.


    There are several reasons why fewer websites are using Flash these days, including:


    There have been laws introduced to ensure that websites are usable by those with
    visual or physical impairments — and Flash has been criticized because Flash content
    does not always meet accessibility requirements.


    In 2005-6, a set of JavaScript libraries were launched (including Prototype, script.aculo.us,
    and JQuery) which made it easier for people to create animated effects using JavaScript.


    In 2008, browsers started to support HTML5 <video> and <audio> tags. At the time
    of writing, Flash is still a popular way of playing video and audio on the web
    but more and more people are switching to HTML5.


    Although Flash is still very popular, in recent years people have been more selective
    about when they use it (and now rarely consider an entire website in Flash).


    When Apple launched the iPhone in 2007 and later the iPad in 2010, they took the
    decision not to support Flash.


    Despite this, Flash does have a future on the web because there are some things
    it does very well, such as creating animations.


    (You will see how to use these elements later in the chapter.)'
  merge: -1
  pgno: 210
