    \nYou then use the offset properties (top and bottom or left or right) to indicate\
    \ how far to move the element from where it would have been in normal flow.\n\n\
    To move the box up or down, you can use either the top or bottom properties.\n\
    \n| RESULT | |\n|---||\n\n# ### The Evolution of the Bicycle\n\nIn 1817 Baron\
