  md: "# BUTTON & HIDDEN\nCONTROLS\n\n# HTML\n\n```\n<form action=\"http://www.example.com/add.php\"\
    >\n  <button><img src=\"images/add.gif\" alt=\"add\nwidth=\"10\" height=\"10\"\
    \ /> Add</button>\n  <input type=\"hidden\" name=\"bookmark\"\nvalue=\"lyrics\"\
    \ />\n</form>\n```\n\n# <button>\n\nThe <button> element was introduced to allow\
    \ users more control over how their buttons appear, and to allow other elements\
    \ to appear inside the button.\n\n# RESULT\n\nThis means that you can combine\
    \ text and images between the <button> tag and closing </button> tag.\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_168_0.png)\n\
    \n# <input=\"hidden\">\n\nThis example also shows a hidden form control. These\
    \ form controls are not shown on the page (although you can see them if you use\
    \ the View Source option in the browser). They allow web page authors to add values\
    \ to forms that users cannot see. For example, a web page author might use a hidden\
    \ field to indicate which page the user was on they submitted a form."
  merge: -1
