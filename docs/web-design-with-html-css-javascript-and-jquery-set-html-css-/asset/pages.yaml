  md: '# RGB VALUES


    # HEX CODES


    # COLOR NAMES


    Values for red, green, and blue are expressed as numbers between 0 and 255.


    Hex values represent values for red, green, and blue in hexadecimal code.


    Colors are represented by predefined names. However, they are very limited in
    number.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_258_0.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_258_1.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_258_2.png)


    rgb(102,205,170)


    #66cdaa


    MediumAquaMarine


    This color is made up of the following values:

    102 red

    205 green

    170 blue


    The value of the red, 102, is expressed as 66 in hexadecimal code. The 205 of
    the green is expressed as cd and the 170 of the blue equates to aa. Hex values
    are not case sensitive. Where all the characters are the same (e.g #ffffff), they
    can be abbreviated to three characters


    There are 147 color names supported by browsers (like Aqua). Most consider this
    to be a limited palette, and it is hard to remember the name for each of the colors
    (so white and black) they are not used.


    # HUE


    # SATURATION


    # BRIGHTNESS


    Hue is near to the colloquial idea of color. Technically speaking however, a color
    can also have saturation and brightness as well as hue.


    Saturation refers to the amount of gray in a color. At maximum saturation, there
    would be no gray. At minimum saturation, the color would be mostly gray.


    Brightness (or "value") refers to how much black is in a color. At maximum brightness,
    there would be no black in the color. At minimum brightness, the color would be
    very dark.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_258_3.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_258_4.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_258_5.png)'
  merge: -1
