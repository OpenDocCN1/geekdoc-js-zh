  md: "# NORMAL FLOW\nposition:static\n\nIn normal flow, each block-level element\
    \ sits on top of the next one. Since this is the default way in browsers treat\
    \ HTML elements, you do not need a CSS property to indicate that elements should\
    \ appear in normal flow, the syntax would be:\n\nposition: static;\n\nI have not\
    \ specified a width property for the heading element, so you can see how it stretches\
    \ the width of the entire browser window by default.\n\nThe paragraphs are restricted\
    \ to 450 pixels. This shows how elements in normal flow start on a new line if\
    \ they do not take the full width of the browser window.\n\nAll of the examples\
    \ that demonstrate positioning use a similar HTML structure.\n\n```\nchapter-15/normal-flow.html\n\
    \n<body>\n  <h1>The Evolution of the Bicycle</h1>\n  <p>In 1817 Baron von Drais\
    \ invented a walking machine that would help him get around the royal gardens\
    \ faster...</p>\n</body>\n```\n\n```\nbody {\n  width: 750px;\n  font-family:\
    \ Arial, Verdana, sans-serif;\n  color: #665544;\n  background-color: #efefef;\n\
    \  padding: 10px;\n}\n```\n\n# The Evolution of the Bicycle\n\nIn 1817 Baron von\
    \ Drais invented a walking machine that would help him get around the royal gardens\
    \ faster. His invention consisted of two wheels and a frame upon which you sat.\
    \ The device was propelled by pushing your feet against the ground, rolling yourself\
    \ and the device in a sort of walking.\n\nThe machine became known as the Draisienne\
    \ or \"hobby horse\". It had a short-lived popularity, as it was not very practical\
    \ for transportation in any other place than a well-maintained pathway such as\
    \ in a park or garden.\n\nThe next appearance of a two-wheeled riding machine\
    \ was in 1865, when pedals were attached to the front wheel. This machine was\
    \ known as the velocipede (meaning \"fast foot\") as well as the \"Boneshaker\"\
    \ due to the pedals combined with the cobblestone roads of the day made for an\
    \ extremely uncomfortable ride. They also became fast and indoor riding academies,\
    \ like roller skating, could be found in large cities."
