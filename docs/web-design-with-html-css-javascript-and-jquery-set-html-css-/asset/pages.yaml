  md: "# DROP DOWN LIST BOX\n\n# <select>\n\nA drop down list box (also known as a\
    \ <select>) allows users to select one option from a drop list.\n\nThe <select>\
    \ element is used to create a drop down list box. It contains two or more <option>\
    \ elements.\n\n```\n```html\nchapter-07/drop-list-box.html\n<form action=\"http://www.example.com/profile.php\"\
    >\n  <p>What device do you listen to music on?</p>\n  <select name=\"devices\"\
    >\n    <option value=\"ipod\">iPod</option>\n    <option value=\"radio\">Radio</option>\n\
    \    <option value=\"computer\">Computer</option>\n  </select>\n</form>\n```\n\
    ```\n\n# name\n\nThe name attribute indicates the name of the control being sent\
    \ to the server, along with the value user selected.\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_163_0.png)\n\
    \n# <option>\n\nThe <option> element is used to specify the options that the user\
    \ can select. From the words between the opening <option> and closing </option>\
    \ tags will be shown in the drop box.\n\n# selected\n\nThe selected attribute\
    \ can be used to indicate the option that should be selected when the page loads.\
    \ The value of this attribute should be selected.\n\nThe function of the drop\
    \ down list is similar to that of the radio buttons (in that only one can be selected).\
    \ There are two key factors in choosing which to use:\n\n+   1. If users need\
    \ to see all options at a glance, radio buttons are better suited.\n2. If there\
    \ is a very long list of options (such as a list of controls), drop down list\
    \ boxes work better.\n\nIf this attribute is not set, the first option will be\
    \ shown when the page loads. If the user does not select an option, the first\
    \ item will be sent to the server as the value for this control.\n\n# value\n\n\
    The <option> element uses the value attribute to indicate the value that is sent\
    \ to the server along with the name of the control if this option is selected."
  merge: -1
  pgno: 163
- img_proc: true
  md: "# MULTIPLE SELECT BOX\n\nHTML chapter-07/multiple-select-box.html\n\n```\n\
    <form action=\"http://www.example.com/profile.php\">\n<p>Do you play any of the\
    \ following instruments?\n(You can select more than one option by holding down\
    \ control on a PC or command key on a Mac while selecting different options.)</p>\n\
    <select name=\"Instruments\" size=\"3\" multiple=\"multiple\">\n  <option value=\"\
    guitar\" selected=\"selected\">Guitar</option>\n  <option value=\"drums\">Drums</option>\n\
    \  <option value=\"keyboard\" selected=\"selected\">Keyboard</option>\n  <option\
    \ value=\"bass\">Bass</option>\n</select>\n</form>\n```\n\n# <select>\n\n# size\n\
    \nYou can turn a down select box into a box that shows more than one option by\
    \ adding the size attribute. Its value should be the number of options you want\
    \ to show. In the example you can see that three of the four options are shown.\n\
    \nUnfortunately, the way that browsers implemented this attribute is not perfect,\
    \ and it should be tested thoroughly if used (in particular in Firefox and Safari\
    \ on a Mac).\n\n# RESULT\n\nDo you play any of the following instruments? (You\
    \ can select more than one option by holding down control on a PC or command key\
    \ on a Mac while selecting different options.)\n\n|Guitar\nDrums\nKeyboard\nBass|\n\
    \n# multiple\n\nYou allow users to select multiple options from this list by adding\
    \ the multiple attribute with a value of multiple.\n\nIt is a good idea to tell\
    \ users if they can select more than one option at a time. It is also helpful\
    \ to indicate that on a PC they should hold down the control key while selecting\
    \ multiple options and on a Mac they should use the command key while selecting\
    \ options."
  merge: -1
  pgno: 164
