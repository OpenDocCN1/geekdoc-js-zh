  md: "# LEADING\nline-height\n\nLeading (pronounced ledding) is a term typographers\
    \ use for the vertical space between lines of text. In a typeface, part of a letter\
    \ drops beneath the baseline is called a descender, while the highest point of\
    \ a letter is called the ascender. Leading is measured from the descender on one\
    \ line to the top of the ascender on the next.\n\n```\nchapter-12/line-height.html\n\
    p {\n  line-height: 1.4em;\n}\n```\n\nCSS\n\nRESULT\n\n# Briards\n\nby Ivy Duckett\n\
