  md: '# FOREGROUND COLOR

    color


    The color property allows you to specify the color of text inside an element.
    You can specify any color in CSS in one of three ways:


    # RGB VALUES


    These express colors in terms of how much red, green and blue are used to make
    it up. For example: rgb(100,100,90)


    # HEX CODES


    These are six-digit codes that represent the amount of red, green and blue in
    a color, preceded by a pound or # sign. For example: #ee3e80


    # COLOR NAMES


    There are 147 predefined color names that are recognized by browsers. For example:
    DarkCyan


    We look at these three different ways of specifying colors on the next double-page
    spread.


    ```

    chapter-11/foreground-color.html

    /* color name */

    h1 {

    color: DarkCyan;

    /* hex code */

    h2 {

    color: #ee3e80;

    /* rgb value */

    p {

    color: rgb(100,100,90);


    ```


    # Marine Biology


    # The Composition of Seawater


    Almost anything can be found in seawater. This includes dissolved materials from
    Earth''s crust as well as materials released from organisms. The most important
    factors influencing life forms are salinity, dissolved gases (oxygen and carbon
    dioxide), nutrients, and pH. These elements vary in their influence on marine
    life.


    CSS3 has also introduced another way to specify colors called HSLA, which you
    will meet near the end of this page 255-256.


    Above each CSS rule in this example you can see how CSS allows you to add comments
    to your CSS files. Anything between the /* and */ symbols will not be interpreted
    by the browser. They are shown in grey.


    The use of comments can help you to understand a CSS file (and organise it, by
    splitting a document into sections). Here, we have used comments to specify each
    of the different types of colors.'
  merge: -1
