    \  &lt;/tr&gt;\n  &lt;tr&gt;\n    &lt;td&gt;60&lt;/td&gt;\n    &lt;td&gt;90&lt;/td&gt;\n\
    \    &lt;td&gt;90&lt;/td&gt;\n  &lt;/tr&gt;\n&lt;/table&gt;\n```\n\n# &lt;tr&gt;\n\
    \nYou indicate the start of each row using the opening &lt;tr&gt; tag. (The &lt;tr&gt;\
    \ stands for table row.)\n\nIt is followed by one or more &lt;td&gt; elements\
    \ (one for each cell in that row).\n\nAt the end of the row you use a closing\
    \ &lt;/tr&gt; tag.\n\n# &lt;td&gt;\n\n| 15 15 30 |\n| 45 60 45 |\n| 60 90 90 |\n\
    \nEach cell of a table is represented using a &lt;td&gt; element. The &lt;td&gt;\
    \ stands for table data.\n\nAt the end of each cell you use a closing &lt;/td&gt;\
    \ tag.\n\nSome browsers automatically draw lines around the table and/or the individual\
    \ cells. You will learn how to control the borders of tables using CSS on pages\
    \ 309-312 and 337-340."
