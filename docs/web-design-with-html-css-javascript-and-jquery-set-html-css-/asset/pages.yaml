  md: "# BACKGROUND POSITION\nbackground-position\n\nWhen an image is not being repeated,\
    \ you can use the background-position property to specify where in the browser\
    \ window the background image should be placed.\n\nThis property usually has a\
    \ pair of values. The first represents the horizontal position and the second\
    \ represents the vertical.\n\nchapter-16/background-position.html | CSS\n|---|---|\n\
    | body {\n  background-image: url(\"images/tulip.gif\");\n  background-repeat:\
