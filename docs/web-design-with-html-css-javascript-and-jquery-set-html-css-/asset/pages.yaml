  md: "# HOW CSS RULES CASCADE\n\nIf there are two or more rules that apply to the\
    \ same element, it is important to understand which will take precedence.\n\n\
    ```\nchapter-10/cascade.html\nHTML\n<h1>Potatoes</h1>\n<p id=\"intro\">There are\
    \ <i>dozens</i> of different <b>potato</b> varieties.</p>\n<p>They are usually\
    \ described as early, second early and maincropt potatoes.</p>\n```\n\nLAST RULE\n\
    If the two selectors are identical, the latter of the two will take precedence.\
    \ Here you can see the second i selects precedence over the first.\n\n```\nCSS\n\
    {\n  font-family: Arial, Verdana, sans-serif;\nh {\n  font-family: \"Courier New\"\
    , monospace;\n {\n  color: green;\n {\n  color: red;\nb {\n  color: pink;\nb {\n\
    \  color: blue !important;\n b {\n  color: violet;\np#intro {\n  font-size: 100%;\n\
    p {\n  font-size: 75%;\n}\n```\n\nSPECIFICITY\nIf one selector is more specific\
    \ than the others, the more specific rule will take precedence over general ones.\
    \ In this example:\n\nh1 is more specific than p\nb is more specific than p\n\
    p#intro is more specific than p\n\nIMPORTANT\nYou can add important after any\
    \ property value to indicate that it should be considered more important than\
    \ other rules that apply to the same element.\n\nUnderstanding how CSS rules cascade\
    \ means you can use with simpler style sheets you can create generic rules that\
    \ apply to most elements and then override the properties of individual elements\
    \ that need to appear differently.\n\nRESULT\nPotatoes\nThere are dozens of different\
    \ potato varieties.\nThey are usually described as early, second early and maincropt\
    \ potatoes."
  merge: -1
