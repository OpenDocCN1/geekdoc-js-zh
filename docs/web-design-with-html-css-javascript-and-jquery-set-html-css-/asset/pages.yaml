  md: '# MULTIPLE STYLE SHEETS link


    # HTML


    chapter-15/multiple-style-sheets-link.html


    On this page you can see the other technique for including multiple style sheets.
    Inside the <head> element is a separate <link> element for each style sheet.


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>Multiple Style Sheets - Link</title>

    <link rel="stylesheet" type="text/css" href="css/site.css" />

    <link rel="stylesheet" type="text/css" href="css/tables.css" />

    <link rel="stylesheet" type="text/css" href="css/typography.css" />

    </head>

    <body>

    <!-- HTML page content here --

    </body>

    </html>

    ```


    The contents of site.css are identical to site.css on the left hand page, which
    code does not contain @Import rules.


    # RESULT


    As with this style, if two rules apply to the same element then rules that appear
    later in a document will take precedence over previous rules.


