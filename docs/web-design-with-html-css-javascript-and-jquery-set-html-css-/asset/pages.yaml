  md: '# THREE RULES FOR CREATING IMAGES


    There are three rules to remember when you are creating images for your website
    which are summarized below. We go into greater detail on each topic over the next
    nine pages.


    # 1


    # SAVE IMAGES IN THE RIGHT FORMAT


    Websites mainly use images in jpeg, gif, or png format. If you choose the right
    format your image might not look as sharp as it should and can make the web page
    slower to load.


    # 2


    # SAVE IMAGES AT THE RIGHT SIZE


    You should save the image at the same width and height it will appear on the website
    (measured in pixels). If the image is smaller than the width or height that you
    have specified, the image can be distorted and stretched. If the image is larger
    than the width and height you have specified, the image will take longer to display
    on the page.


    # 3


    # MEASURE IMAGES IN PIXELS


    Computer screens are made up of tiny squares known as pixels. The number of pixels
    shown per inch of screen can vary if the user increases or decreases the resolution.
    Therefore, when you are saving images at the right size for the web, you should
    always measure the image in terms of the width and height in pixels (and not in
    centimeters or inches).'
  merge: -1
