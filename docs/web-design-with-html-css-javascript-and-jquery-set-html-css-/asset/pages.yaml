  md: '# # TRADITIONAL HTML LAYOUTS


    For a long time, web page authors used `<div>` elements to group related elements
    on the page (such as the elements that form a header, an article, footer or sidebar).
    Authors used class or id attributes to indicate the role of the `<div>` element
    in the structure of the page.


    On the right you can see a layout that is quite common (particularly on blog sites).


    At the top of the page is the header, containing a logo and the primary navigation.


    Under this are one or more articles or posts. Sometimes these are summaries that
    link to individual posts.


    There is a side bar on the right-hand side (perhaps featuring a search option,
    links to other recent articles, other sections of the site, or even ads).


    When coding a site like this, developers would usually put these main sections
    of the page inside `<div>` elements and use the class or id attributes to indicate
    the purpose of that part of the page.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_437_0.png)'
  merge: -1
  pgno: 437
- img_proc: true
  md: "# NEW HTML5 LAYOUT ELEMENTS\n\nHTML5 introduces a new set of elements that\
    \ allow you to divide the parts of a page. The names of these elements indicate\
    \ the kind of content you will find in them. They are still subject to change,\
    \ but that has not stopped many web page authors from using them already.\n\n\
    ```\n<body>\n  <div id=\"page\">\n    <header></header>\n    <div id=\"content\"\
    >\n      <article></article>\n      <aside></aside>\n      <article></article>\n\
    \    </div>\n    <footer></footer>\n  </div>\n</body>\n```\n\nThis example has\
    \ exactly the structure as seen on the previous page. However, many of the <div>\
    \ elements have been replaced by new HTML5 layout elements.\n\nFor example, the\
    \ header sits inside a new <header> element, the navigation in a <nav> element,\
    \ and the articles are in individual <article> elements.\n\nThe point of creating\
    \ these new elements is that web page authors can use them to help describe the\
    \ structure of the page. For example, search reader software might allow users\
    \ to ignore headers and footers and get straight to the content. Similarly, search\
    \ engines might place more weight on the content in an <article> element than\
    \ in the <header> or <footer> elements. I think you will agree that it also makes\
    \ the code easier to follow."
  merge: -1
  pgno: 438
- img_proc: true
  md: "# HEADERS & FOOTERS\n<header> <footer>\n\nThe <header> and <footer> elements\
    \ can be used for:\n\n+   - The main header or footer appears at the top or bottom\
    \ of every page on the site\n- A header for an individual <article> within the\
    \ page\n\nIn this example, the <header> element is used to contain the site name\
    \ and the navigation. The <footer> element contains copyright information.\n\n\
    ```\nchapter-17/example.html HTML\n<header>\n  <h1>Yoko's Kitchen</h1>\n  <nav>\n\
    \    <ul>\n      <li><a href=\"#\" class=\"current\">home</a></li>\n      <li><a\
    \ href=\"#\">classes</a></li>\n      <li><a href=\"#\">catering</a></li>\n   \
    \   <li><a href=\"#\">about</a></li>\n      </ul></li>\n      <li><a href=\"#\"\
    >contact</a></li>\n    </ul>\n  </nav>\n</header>\n```\n\nEach individual <article>\
    \ and <section> element can also have its <header> and <footer> elements to hold\
    \ the header or footer information for that section within the page.\n\n```\n\
    chapter-17/example.html HTML\n<footer>\n  &copy; 2011 Yoko's Kitchen\n</footer>\n\
    ```\n\nFor example, on a page with several blog posts, each individual post can\
    \ be thought of as a separate section. The <header> element there can be used\
    \ to contain the title and date of each individual post, and the <footer> might\
    \ contain links to share the article on social networking sites.\n\nPlease note\
