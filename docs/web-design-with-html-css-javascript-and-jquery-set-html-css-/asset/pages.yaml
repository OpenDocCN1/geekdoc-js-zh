  md: "# CENTERING CONTENT\n\nIf you want to center a box on the page (or center it\
    \ inside the element that it sits in), you can set the left-margin and right-margin\
    \ to auto.\n\nIn order to center a box on the page, you need to set a width for\
    \ the box (otherwise it will take the full width of the page).\n\nOnce you have\
    \ specified the width of the box, setting the left and right margins to auto will\
    \ make the browser put one gap on each side of the box. This centers the box on\
    \ the page (or within the element that the box sits inside).\n\nIn order for this\
    \ work in older browsers (particularly IE6), the element that the box sits inside\
    \ should have a text-align property with its value set to center.\n\nThe text-align\
    \ property is inherited by child elements. You also need to specify the text-align\
    \ property on the centered box if you do not want the text inside it to be centered.\n\
    \n```\nchapter-13/centering-content.html\n<body>\n  <p>Analog synthesizers are\
    \ often said to have a \"warmer\" sound than their digital counterparts.</p>\n\
    \  <p class=\"example\">Analog synthesizers are often said to have a \"warmer\"\
    \ sound than their digital counterparts.</p>\n</body>\n```\n\n```\nCSS\np {\n\
    \  text-align: center;\n  width: 300px;\n  padding: 50px;\n  border: 20px solid\
    \ #0088dd;\n}\np.example {\n  margin: 10px auto;\n  text-align: left;\n}\n```\n\
    \n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_321_0.png)"
  merge: -1
