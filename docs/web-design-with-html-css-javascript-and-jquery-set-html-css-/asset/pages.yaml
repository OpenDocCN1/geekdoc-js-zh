  md: '# WHY FORMS?


    The best known form on the web is probably the search box that sits right in the
    middle of Google’s home page.


    In addition to enabling users to search, forms also allow users to perform other
    functions online. You will see forms


    when registering as a member of a website, when shopping online, and when signing
    up for newsletters or mailing lists.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_153_0.png)'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# FORM CONTROLS


    There are several types of form controls that you can use to collect information
    from visitors to your site.


    # ADDING TEXT:


    Text input (single-line)

    Used for a single line of text such as email addresses and names.


    ```

    ivy

    ```


    # Password input


    Like a single line text box but masks the characters entered.


    ```

    ******

    ```


    # Text area (multi-line)


    For longer areas of text, such as messages and comments.


    ```

    Enter your comments...

    ```


    # MAKING CHOICES:


    Radio buttons

    When a user must select one of number options.


    +   - Rock

    - Pop

    - Jazz


    # Checkboxes


    When a user can select and unselect one or more options.


    +   - iTunes

    - Last.fm

    - Spotify


    # Drop-down boxes


    When a user must pick one of number options from a list.


    +   - iPod


    # SUBMITTING FORMS:


    Submit buttons

    To submit data from your form to another web page.


    ```

    Subscribe

    ```


    # Image buttons


    Similar to submit buttons but they allow you to use an image.


    ```

    SUBSCRIBE

    ```


    # UPLOADING FILES:


    File upload

    Allows users to upload files (e.g. images) to a website.


    ```

    Upload

    ```


    ```

    Browse...

    ```'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# HOW FORMS WORK


    A user fills in a form and then presses a button to submit the information to
    the server.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_155_0.png)


    The name of each form control is sent to the server along with the value the user
    enters or selects.


    The server processes the information using a programming language such as PHP,
    C#, VB.net, or Java. It may also store the information in a database.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_155_1.png)


    The server creates a new page to send back to the browser based on the information
    received.'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'A form may have several form controls, each gathering different information.
    The server needs to know which piece of inputted data corresponds with which form
    element.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_156_0.png)


    To differentiate between various pieces of inputted data, information is sent
    from the browser to the server using name/value pairs. In this example, the form
    asks for the visitor''s username and also for their favorite jazz musician. The
    name/value pairs sent to the server are:


    # username=Ivy vote=Herbie


    If the form control allows the user to enter text, the value of the form control
    is whatever the user has typed in.


    If the form control allows you to choose from a fixed set of answers (e.g. radio
    buttons, checkboxes or a drop down list), the web page author will add code that
    gives each option an automatic value.


    You should never change the name of a form control in a page unless you know that
    the code on the server will understand this new value.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# FORM STRUCTURE


    # <form>


    Form controls live inside a <form> element. This element should always carry the
    action attribute and will usually have a method and id attribute.


    ```

    chapter-07/form-structure.html HTML

    <form action="http://www.example.com/subscribe.php"

    method="get">

    <p>This is where the form controls will appear.</p>

    </form>

    ```


    # action


    Every <form> element requires an action attribute. Its value is the URL for the
    page on the server that will receive the information in the form when it is submitted.


    > This is where the form controls will appear.


    # method


    Forms can be sent using one of two methods: get or post.


    With the get method, the values from the form are added to the end of the URL
    specified in the action attribute. The get method is ideal for:


    With the post method the values are sent in what are known as HTTP headers. As
    a rule of thumb you should use the post method if your form:


    If the method attribute is not used, the form data will be sent using the get
    method.


    +   - short forms (such as search boxes)

    - when you are retrieving data from the web server (not sending information that
    should be added to or deleted from a database)


    +   - allows users to upload a file

    - very long

    - contains sensitive data (e.g. passwords)

    - adds information to, or deletes information from, a database


    # id


    We look the id attribute on page 183, but the value is used to identify the form
    distinctly from other elements on the page (and is often used by scripts — as
    those that check you have entered information into fields that require values).'
  merge: -1
  pgno: 157
- img_proc: true
  md: "# TEXT INPUT\n\n# HTML chapter-07/text-input.html\n\n```\n<form action=\"http://www.example.com/login.php\"\
    >\n<p>Username:\n  <input type=\"text\" name=\"username\" size=\"15\" maxlength=\"\
    30\" />\n</p>\n</form>\n```\n\n# <input>\n\n <input> element is used to create\
    \ several different form controls. The value of the type attribute determines\
    \ what kind of input\n\n# RESULT\n\n# type=\"text\"\n\nWhen the type attribute\
    \ has a value of text, it creates a single-line input.\n\nUsername:\n\n# name\n\
    \nWhen users enter information into a form, the server needs to know which form\
    \ control each piece of data was entered into. (For example, in a login form,\
    \ the server needs to know what has been entered as the username and what has\
    \ been given as the password.) Therefore, each form requires a name attribute.\
    \ The value of this attribute identifies the form control and is sent along with\
    \ the information they enter to the server.\n\n# size\n\nThe size attribute should\
    \ not be used in old forms. It in forms to indicate the width of the text input\
    \ (measured by the number of characters that would be seen).\n\n(although a user\
    \ could enter more characters if they desired).\n\nIn any new forms you write,\
    \ CSS should be used to control the width of form elements. The size attribute\
    \ is only mentioned because you may come across it when looking at old code.\n\
    \nFor example, a value of 3 would create a box wide enough to display three characters\n\
    \n# maxLength\n\nYou can use the length attribute to limit the number of characters\
    \ a user may enter into the text field. Its value is the number of characters\
    \ they may enter. For example, if you were asking for a year, the maxLength attribute\
    \ could have a value of 4."
  merge: -1
