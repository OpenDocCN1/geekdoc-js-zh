  md: '# DIFFERENT VERSIONS OF CSS & BROWSER QUIRKS


    CSS1 was released in 1996 and CSS2 followed two years later. Work on CSS3 has
    been ongoing but the major browsers have already started to implement it.


    In the same way that there have been several versions of HTML, there have also
    different versions of CSS.


    Browsers did not implement all CSS features at once, so some older browsers do
    not support every property.


    This is mentioned when it is likely to affect you, along with notes where CSS
    properties might not behave as expected.


    Any seasoned user of CSS will tell you that some browsers display a few of the
    CSS properties in an unexpected way. But finding and squashing those bugs is easy
    when you know...


    Before launching any new site, it is important to test it in more one browser,
    because there can be slight differences in how browsers display the pages.


    Using these tools, it is a good idea to check the site on different operating
    systems (PC, Mac, and Linux) and older versions of the major browsers, as well
    as recent versions.


    Some common browsers are discussed in this book, but there are many smaller browsers
    that only occur in rare situations, or old browsers that people use.


    You do not need of computers to test your site, as there are online tools to show
    you what a page looks like in multiple browsers:


    When you look at your site in more than one browser, you might find that some
    elements on your page do not look like you expect them to.


    If you come across a CSS bug, you can use your search engine to find a solution.
    Or you can check these:


    +   - BrowserCam.com

    - BrowserLab.Adobe.org

    - BrowserShots.org

    - CrossBrowserTesting.com


    When a CSS property does not display as expected, it is generally referred to
    as a browser quirk or CSS bug.


    PositionIsEverything.net QuirksMode.org'
  merge: -1
