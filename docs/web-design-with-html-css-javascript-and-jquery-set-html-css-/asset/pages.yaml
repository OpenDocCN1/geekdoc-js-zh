  md: 'To indicate where a box should be positioned, you may also need to use box
    offset properties to tell the browser how far from the top or bottom and left
    or right it should be placed. (You will meet these when we introduce the positioning
    schemes on the following pages.)


    # FIXED POSITIONING


    This is a form of absolute positioning that positions the element in relation
    to the browser window, to the containing element. Elements with fixed positioning
    do not affect the position of surrounding elements and do not move when the user
    scrolls down the page.


    # FLOATING ELEMENTS


    Floating an element allows you to take that element out of normal flow and position
    it to the far left or right of a containing box. The floated element becomes a
    block-level element around other content can flow.


