  md: '# MULTIPLE STYLE SHEETS

    @import


    Some web pages split up their CSS style rules into separate style sheets. For
    example, they might use one style sheet to control the layout and another to control
    fonts, colors and so on.


    Some authors take an even modular approach to stylesheets, separate stylesheets
    to control typography, layout, forms, tables, even different styles for each sub-section
    of a site.


    There are two ways to add multiple style sheets to a:


    +   1: Your HTML page can link to one style sheet and that @stylesheet can use
    the @import to import other stylesheets.


    +   2: In the HTML you can use a separate <link> element for each style sheet.


    The example on this page uses one <link> element in the HTML to link to a style
    sheet called styles.css. This stylesheet then uses the @import rule to import
    the typography.css and tables.css files.


    If a stylesheet uses the @import rule, it will appear before the other rules...


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_401_0.png)


    ```

    <!DOCTYPE html>

    <html>

    <Head>

    <title>Multiple Style Sheets - Import/</title>

    <link rel="stylesheet" type="text/css" href="styles.css" />

    </head>

    <body>

    <!-- HTML page content here -->

    </body>

    </html>

    ```


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_401_1.png)


    ```

    @import url("tables.css");

    @import url("typography.css");

    body {

    color: #666666;

    background-color: #f8f8f8;

    text-align: center;

    }

    page {

    width: 600px;

    text-align: left;

    margin-left: auto;

    margin-right: auto;

    border: 1px solid #d6d6d6;

    padding: 20px;

    }

    h3 {

    color: #547ca0;


    ```'
