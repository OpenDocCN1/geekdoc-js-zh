  md: '# LABELLING FORM

    CONTROLS


    ```

    <label>

    ```


    When introducing form controls, the code was kept simple by indicating the purpose
    of each one next to it. However, each form should have its own <label> element
    as it makes the form accessible to vision-impaired users.


    ```

    chapter-07/labelling-form-controls.html

    ```


    ```

    <label>Age: <input type="text" name="age" /></label>

    <br />

    Gender:

    <input id="female" type="radio" name="gender" value="f">

    <label for="female">Female</label>

    <input id="male" type="radio" name="gender" value="m">

    <label for="male">Male</label>

    ```


    The <label> element can be used in two ways. It can:


    +   1. Wrap around both the text description and the form input (as shown on the
    first line of the example to your right).

    2. Keep separate from the form control and use the for attribute to indicate which
    form control it is a label for (as shown with the radio buttons).


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_169_0.png)


    # for


    The attribute states which form label belongs to. Note how the radio buttons use
    the id attribute. The value of the id attribute uniquely identifies an element
    from all other elements on a page. (The 1d attribute is covered on page 183.).


    The value of the attribute matches that of the  id attribute on the form control
    it is labelling. This technique using the for and


    1d can be used on any form control. When a <label> element is used with a checkbox
    or radio button, users can click on either the form control or the label to select.
    The clickable area makes the form easier to use. The position of the label is
    very important. If users do not know where to enter information or what information
    to enter, they are less likely to use the form correctly.


    As a rule of thumb, here are the best places to place labels on form controls.


    +   ABOVE OR TO THE LEFT:

    - Text inputs

    - Text areas

    - Select boxes

    - File uploads


    +   TO THE RIGHT:

    - Individual checkboxes

    - Individual radio buttons'
  merge: -1
