    \ 5px 5px 5px #7777777;\n  -webkit-box-shadow: 5px 5px 5px #7777777;\n  box-shadow:\
    \ 5px 5px 5px #7777777;\n}\np.two {\n  -moz-box-shadow: 5px 5px 5px #7777777;\n\
    \  -webkit-box-shadow: 5px 5px 5px #7777777;\n  box-shadow: 5px 5px 5px #7777777;\n\
    }\np.three {\n  -moz-box-shadow: 5px 5px 5px #7777777;\n  -webkit-box-shadow:\
    \ 5px 5px 5px #7777777;\n  box-shadow: 5px 5px 5px #7777777;\n}\np.four {\n  -moz-box-shadow:\
    \ 0 0 10px #7777777;\n  -webkit-box-shadow: 0 0 10px #7777777;\n  box-shadow:\
    \ 0 0 10px #7777777;\n}\np.five {\n  -moz-box-shadow: Inset 0 0 10px #7777777;\n\
    \  -webkit-box-shadow: Inset 0 0 10px #7777777;\n  box-shadow: Inset 0 0 10px\
    \ #7777777;\n}\n```\n\nThe box-shadow property allows you to add a drop shadow\
    \ around a box. It works just like the text-shadow property that you met on page\
    \ 288. It must use at least the first of these values as a color:\n\n# HORIZONTAL\
    \ OFFSET\n\nNegative values position the shadow to the left of the box.\n\n# VERTICAL\
    \ OFFSET\n\nNegative values position the shadow to the top of the box.\n\n# BLUR\
    \ DISTANCE\n\nIf omitted, the shadow is a solid line like a border.\n\n# SPREAD\
    \ OF SHADOW\n\nIf used, a positive value will cause the shadow to expand in all\
    \ directions, and a negative value will make contrast.\n\n# RESULT\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_326_0.png)\n\
    \n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_326_1.png)\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_326_2.png)\n\
    \n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_326_3.png)\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_326_4.png)\n\
    \n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_326_5.png)\n\nThe Inset keyword can\
    \ also be used before these values to create an inner-shadow.\n\nChrome, Firefox,\
    \ and Safari will support this property quick to start using the -moz-box-shadow\
    \ and -webkit11-box-shadow properties. These are not in the CSS specification\
    \ but using them can help this style to work in these browsers."
