  md: '# BOLD & ITALIC


    ```

    <b>\</b>

    ```


    By enclosing words in the tags &lt;b&gt; and &lt;/b&gt; we can make characters
    appear bold.


    The &lt;b&gt; element also represents a section of text that would be presented
    in a visually different way (for example key words in a paragraph) although the
    use of the &lt;b&gt; element does not imply any additional meaning.


    See page 51 for the &lt;strong&gt; element.


    chapter-02/bold.html HTML

    <p>This is how we make a word appear &lt;b&gt;bold.&lt;/b&gt;</p>

    <p>Inside a product description you might see some &lt;b&gt;key features&lt;/b&gt;
    in bold.</p>


    This is how we make a word appear bold. RESULT

    Inside a product description you might see some key features in bold.


    ```

    &lt;i&gt;

    ```


    By enclosing words in the tags &lt;i&gt; and &lt;/i&gt; we can make characters
    appear italic.


    The &lt;i&gt; element also represents a section of text that would be said in
    a different way from surrounding content — such as technical terms, names of ships,
    foreign words, thoughts, or other terms that would usually be italicized.


    See page 51 for the &lt;em&gt; element.


    chapter-02/italic.html HTML

    <p>This is how we make a word appear &lt;i&gt;italic&lt;/i&gt;</p>

    <p>It''s a potato &lt;i&gt;Solanum tuberosum&lt;/i&gt;</p>

    <p>Captain Cook sailed to Australia on the &lt;i&gt;Endavour&lt;/i&gt>.</p>


    This is how we make a word italic. RESULT

    It''s a potato Solanum tuberosum.

    Captain Cook sailed to Australia on the Endeavour.'
