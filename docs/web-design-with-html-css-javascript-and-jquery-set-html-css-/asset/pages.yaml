  md: '# # EXAMINING IMAGES ON THE WEB


    # ## CHECKING THE SIZE OF IMAGES


    If you are updating a website, you might need to check the size of an existing
    image before creating a new one to replace it. This can be achieved by right-clicking
    on the image and making a selection from the pop-up menu that appears. (Mac users
    need to hold down the control key and click rather than right-click.)


    On the left you can see how to check the size of images and how to download them
    using Safari. Below is a brief overview of what to select in the pop-up menu to
    perform these functions


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_125_0.png)


    ### CHROME

    Size: **Open Image in New Tab**

    Size appears in new tab

    Download: **Save Image As**


    ### FIREFOX

    Size: **View Image Info**

    Size appears in pop-up window

    Download: **Save Image As**


    # ## DOWNLOADING IMAGES


    If you want to download images from a website, you can do so by accessing the
    pop-up menu. (Please remember that all images online are subject to copyright
    and require explicit permission to reuse.)


    ### INTERNET EXPLORER

