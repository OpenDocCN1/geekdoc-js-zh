  md: '# CLASS ATTRIBUTE


    # HTML


    ```

    <p class="important">For a one-year period from November 2010, the Marugame Genichiro-Inokuma
    Museum of Contemporary Art (MIMOCA) will host a cycle of four Hiroshi Sugimoto
    exhibitions.</p>

    <p>Each showcase works by the artist thematically contextualized under the headings
    "Science," "Architecture," "History" and "Religion" so to present a comprehensive
    panorama of the artist''s oeuvre.</p>

    <p class="important">Hours: 10:00 - 18:00 (No admission after 17:30)</p>

    ```


    Every HTML element can also carry a class attribute. Sometimes, rather than uniquely
    identifying one element within a document, you will want a way to identify several
    elements as being different from the other elements on the page. For example,
    you might might have some paragraphs of text that contain information that is
    more important than others and want to distinguish between elements, or you might
    want to differentiate links that point to pages on your own site and links that
    point to external sites.


    # RESULT


    FOR A ONE-YEAR PERIOD FROM NOVEMBER 2010, THE MARUGAME GENICHIRO-INOKUMA MUSEUM
    OF CONTPORARY ART (MIMOCA) WILL HOST A CYCLE OF FOUR HIROSHI SUGIMOTO EXHIBITIONS.


    Each showcase works by the artist thematically contextualized under the headings
    "Science," "Architecture," "History" and "Religion" so to present a comprehensive
    panorama of the artist''s oeuvre.


    HOURS: 10:00 - 18:00 (NO ADMISSION AFTER 17:30)


    Do with this you can use the class attribute. Its value should describe the class
    it belongs to. In the example on the left, key paragraphs have a class attribute
    whose value is important.


    The class attribute on any element can share the same value. In this example,
    the value of important could be used on headings and links, to.


    By default, using these attributes does not affect the presentation of an element.
    It will only change their appearance if there is a CSS rule that indicates it
    should be displayed differently.


    In this example, CSS has been applied to elements with a class attribute whose
    value is important, and elements with a class attribute whose value is admitted.


    If you would like to indicate that an element belongs to several classes, you
    can separate classes with a space, as you you see in the third paragraph in the
    example above.


    EXTRA MARKUP'
  merge: -1
