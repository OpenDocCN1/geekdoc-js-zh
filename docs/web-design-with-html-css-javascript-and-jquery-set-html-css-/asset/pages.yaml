  md: '# From Garden to Plate


    A potager is a French term for an ornamental vegetable or kitchen garden. Often
    flowers (edible and non-edible) and herbs are planted with the vegetables to enhance
    the garden''s beauty. The goal is to make the function of providing food aesthetically
    pleasing.


