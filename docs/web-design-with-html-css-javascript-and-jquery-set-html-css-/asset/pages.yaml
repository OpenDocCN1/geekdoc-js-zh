    \ we include the CSS for the grid using the <link> element inside the <head> of\
    \ page.\n\nThe styles we are writing ourselves are shown on the right hand page.\n\
    \nThe 960_12_col.css stylesheet contains all of the rules we need to control the\
    \ grid layout. The HTML uses these names:\n\ncontainer_12 to act as a container\
    \ for the whole page and indicate that we are using a 12 column grid\n\nclearfix\
    \ to ensure that browsers know the height of the containing box, because it only\
    \ contains floated elements (this addresses the issue you met on pages 371-372)\n\
