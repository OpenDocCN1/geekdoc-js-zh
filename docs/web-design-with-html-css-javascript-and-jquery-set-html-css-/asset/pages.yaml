  md: 'On the previous page you saw how structure was added to a Word document to
    make it easier to understand. We use structure in the same way when writing web
    pages.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_25_0.png)


    # This is the Main Heading


    This text might be an introduction to the rest of the page. And if the page is
    a long one it might be split into several sub-headings.


    # This is a Sub-Heading


    Many long articles have sub-headings to help you follow the structure of what
    is being written. They may even be sub-sub-headings (or lower-level headings).


    # Another Sub-Heading


    Here you can see another sub-heading.'
