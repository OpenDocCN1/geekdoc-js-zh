    </form>

    ```


    # <textarea>


    The <textarea> element is used to create a multi-line text input. Unlike other
    input elements is not an empty element. It should therefore have an opening and
    a closing tag.


    Any text that appears between the opening <textarea> and closing </textarea> tags
    will appear in the text box when the page loads.


    # RESULT


    # What did you think of this gig?


    | Enter your comments... |


    If the user does not delete any text between these tags, this message will get
    sent to the server with whatever the user has typed.(Some sites use JavaScript
    to clear this information when the user clicks in the text area.)


    If you are creating a new form, you should use CSS to control the width and height
    of a <textarea>. However, if you are looking at older code, you may see the cols
    and rows attributes used with this element.


    The cols attribute indicates how wide the text area should be (measured in numbers
    of characters). The rows attribute indicates how many rows the text area should
    take up vertically.'
  merge: -1
