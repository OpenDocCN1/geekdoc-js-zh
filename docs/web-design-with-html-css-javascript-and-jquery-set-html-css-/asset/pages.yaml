  md: "# INHERITANCE\n\n# CSS\n\n```\n<div class=\"page\">\\  <h1>Potatoes</h1>\n\
    \  <p>There are dozens of different potato varieties.</p>\n  <p>They are usually\
    \ described as early, second and maincrop potatoes.</p>\n</div>\n```\n\nIf you\
    \ specify the font-family or color properties on the <body> element, they will\
    \ apply to most child elements. This is because the value of the font-family property\
    \ is inherited by child elements. It saves you from having to apply these properties\
    \ to many elements (and results in simpler styles sheets).\n\n```\nbody {\n  font-family:\
    \ Arial, Verdana, sans-serif;\n  color: #665544;\n  padding: 10px;\n}\npage {\n\
    \  border: 1px solid #665544;\n  background-color: #efefef;\n  padding: inherit;\n\
    }\n```\n\nYou can compare this with the background-color or border properties;\
    \ they are not inherited by child elements. If these were inherited by all child\
    \ elements then the page could look quite messy.\n\n# RESULT\n\nYou can force\
    \ a lot of properties to inherit values from parent elements by using inherit\
    \ for the value of the properties. In this example, the <div> element with a class\
    \ page inherits the padding size from the CSS rule that applies to the <body>\
    \ element.\n\n| Potatoes |\n| There are dozens of different potato varieties.\
    \ |\n| They are usually described as early, second and maincrop potatoes. |"
  merge: -1
