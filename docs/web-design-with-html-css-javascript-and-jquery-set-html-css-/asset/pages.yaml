  md: "# GROUPING FORM ELEMENTS\n\nHTML chapter-07/grouping-form-elements.html\n\n\
    ```\n<fieldset>\n  <legend>Contact details</legend>\n  <label>Email:<br />\n \
    \ <input type=\"text\" name=\"email\" /></label><br />\n  <label>Mobile:<br />\n\
