  md: '# OLD CODE: ALIGNING IMAGES VERTICALLY


    As you saw on the last page, the align attribute is no longer used in HTML5, but
    it is covered because you may see it used in older versions and it is still used
    in the code created by some visual editors.


    You can see how to use CSS to achieve the same effects on pages 285–286.


    There are three values that the align attribute can take to control how the image
    should align vertically with the text that surrounds it:


    # top


    This aligns the first line of the surrounding text with the top of the image.


    # middle


    This aligns the first line of the surrounding text with the middle of the image.


    # bottom


    This aligns the first line of the surrounding text with the bottom of the image.


    chapter-05/aligning-images-vertically.html HTML


    <p><img src="images/bird.gif" alt="Bird" width="100" height="100" align="top"
    />There are around 10,000 living species of birds that inhabit different ecosystems
    from the Arctic to Antarctic. Many species undertake long distance annual migrations,
    and many more perform shorter irregular journeys.</p>

    <hr />

    <p><img src="images/bird.gif" alt="Bird" width="100" height="100" align="middle"
    />There are around 10,000 living species of birds that inhabit different ecosystems
    from the Arctic to Antarctic. Many species undertake long distance annual migrations,
