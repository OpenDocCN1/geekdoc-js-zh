- img_proc: true
  md: '# CONTRAST


    When picking foreground and background colors, it is important to ensure that
    there is enough contrast for the text to be legible.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_259_0.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_259_1.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_259_2.png)


    Text is harder to read when there is low contrast between background and foreground
    colors.


    Text is easier to read when there is higher contrast between background and foreground
    colors.


    For long spans of text, reducing the contrast a little bit improves readability.


    A lack of contrast is particularly a problem for those with visual impairments
    and color blindness.


    If you want people to read a lot of text on your page, however, then too much
    contrast can make it easier to read, too.


    You can reduce contrast by using dark gray text on a white background or an off-white
    text on a dark background.


    It also affects those with poor monitors and sunlight on their screens (which
    is increasingly common as people use handheld devices outdoors).


    > If text is reversed (a light colour on a dark background), you can increase
    the height between lines and the weight of the font to make it easier to read.


    To check contrast there is a handy online tool at: www.snook.ca/technical/colour_contrast/colour.html


    COLOR'
  merge: -1
