  md: '# STORING IMAGES ON

    YOUR SITE


    If you are building a site from scratch, it is good practice to create a folder
    for all of the images the site uses.


    As a website grows, keeping images in a separate folder helps you understand how
    the site is organized. Here you can see an example of the files for a website;
    all a folder of all the images are stored in a folder called *images.*


    On a big site you might like to add subfolders inside the *images* folder. For
    example, images such as logos and buttons might sit in a folder called *interface*,
    photographs called *products*, and images related to news might live in a folder
    called *news*.


    If you are using a content management system or blogging platform, there are usually
    tools built into the admin site that allow you to upload images, and the program
    will probably already have a separate folder for image files and any other uploads.


