  md: 'We come across all kinds of documents every day of our lives. Newspapers, insurance
    forms, shop catalogues... the list goes on.


    Many web pages act like electronic versions of these documents. For example, newspapers
    show the same stories in print as they do on websites; you can apply for insurance
    over the web; and stores have online catalogs and e-commerce facilities.


    In all kinds of documents, structure is very important in helping readers to understand
    the messages you are trying to convey and navigate around the document. So, in
    order to learn how to write web pages, it is very important to understand how
    to structure documents. In this chapter you will:


    +   - See how HTML describes the structure of a web page

    - Learn how tags or elements are added to your document

    - Write your first web page'
