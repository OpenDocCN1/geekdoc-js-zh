  md: "# # ALIGNING IMAGES USING CSS\n\nIn the last chapter, you saw how the float\
    \ property can be used to move an element to the left or the right of its containing\
    \ block, allowing text to flow around.\n\nRather than using the <img> element's\
    \ align attribute, web pages are increasingly using the float property to align\
    \ images. There are two ways that this is commonly achieved:\n\n+   1: The float\
    \ property is added to the class that will represent the size of the image (Such\
    \ as the small class in our example).\n\n+   2: New classes are created with names\
    \ such as align-left or align-right to align the images to the left or right of\
    \ the page. These class are used in addition to classes that indicate the size\
    \ of the image.\n\nIn this example you can see the align-left and align-right\
    \ classes used to align the image.\n\nIt is also common to add a margin to the\
    \ image to ensure that the text does not touch their edges.\n\nchapter-16/aligning-images.html\n\
    \n```\n<img src=\"images/magnolia-medium.jpg\" alt=\"Magnolia\" class=\"align-left\
    \ medium\" />\n<b><i>Magnolia</i> is a large genus that contains over 200 flowering\
    \ plant species...</p>\n<p><img src=\"images/magnolia-medium.jpg\" alt=\"Magnolia\
    \ class=\"align-right medium\" />\nSome magnolias, as <i>Magnolia stellata</i>\
    \ and <i>Magnolia souleangeana</i>, flower early in the spring before the leaves\
    \ open...</p>\n```\n\n```\n.align-left {\n  float: left;\n  margin-right: 10px;\n\
    }\n.align-right {\n  float: right;\n  margin-left: 10px;\n}\nimg {\n  width: 250px;\n\
    \  height: 250px;\n}\n```\n\n> Magnolia is a large genus that contains over 200\
    \ flowering plant species. It is named after French botanist Pierre Magnol, and\
    \ having evolved before the flowers were developed for pollination by beetles.\n\
    \nSome magnolias, such as Magnolia and Magnolia souleangeana, flower early in\
    \ the spring before the leaves open. Others flower in late spring or early summer,\
    \ such as Magnolia grandiflora.\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_417_0.png)"
  merge: -1
