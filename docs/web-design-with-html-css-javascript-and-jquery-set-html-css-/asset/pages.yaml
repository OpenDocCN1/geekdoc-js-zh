  md: "# BACKGROUND IMAGES\nbackground-image\n\nThe background-image property allows\
    \ you to place an image behind any HTML element. This could be the entire page\
    \ or part of the page. By default, a background image will repeat to fill the\
    \ tile.\n\nThe path to the image follows the letters url(), and it is put inside\
    \ parentheses and quotes.\n\n+   * Here is the image tiled in this example.\n\n\
    In the first example, you can see a background image applied to an entire page\
    \ (because the CSS selector applies to the <body> element). In the second example,\
    \ the background image just applies to a paragraph.\n\nIf you search online, you\
    \ will find lots of resources for background textures that you can use on your\
    \ pages.\n\nBackground images are often the last thing on the page to load (which\
    \ can make a website seem slower to load). As with any images you use online,\
    \ if the size of the file is large it will take longer to download.\n\n```\nchapter-16/background-image-body.html\n\
    CSS\nbody {\n  background-image: url(\"images/pattern.gif\");\n```\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_419_0.png)\n\
    \n```\nchapter-16/background-image-element.html\nCSS\nP {\n  background-image:\
    \ url(\"images/pattern.gif\");\n```\n\n![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_419_1.png)"
