  md: '# HTML5: ADDING HTML5 AUDIO TO YOUR PAGES


    # <audio>


    HTML5 introduced the <audio> element to include audio files in your pages. As
    with HTML5 video, browsers expect different formats for the audio.


    The <audio> element has a number of attributes which allow you to control audio
    playback:


    # src


    This attribute specifies the path to the audio file.


    # controls


    This attribute indicates whether or not the player should display controls. If
    you do not use this attribute, no controls will be shown by default. You can also
    specify your own controls using JavaScript.


    ```

    chapter-09/adding-html5-audio.html


    <!DOCTYPE html>

    <html>

    <head>

    <title>Adding HTML5 Audio</title>

    </head>

    <body>

    <audio src="test-audio.ogg" controls autoplay>

    <p>This browser does not support our audio format.</p>

    </audio>

    </body>

    </html>

    ```


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_225_0.png)


    # preload


    The presence indicates that the audio should start playing automatically. (It
    is considered better practice to let visitors choose to play audio.)


    This attribute indicates what the browser should do if the player is not set to
    autoplay. It can have the same values we saw on page 214 for the <video> element.


    This example only works in browsers that support the Vorbis audio format (Firefox,
    Chrome, and Opera). For it to work in Safari 5 and IE 9, the audio would need
    to be in MP3 format (or the <source> element covered on the next page to offer
    different formats).


    # loop


    This attribute specifies that the audio track should play again once it has finished.'
  merge: -1
  pgno: 225
