  md: "# ADDING A FLASH MOVIE TO YOUR WEB PAGE\n\nThe most popular way of Adding Flash\
    \ into a web page is using JavaScript. Several scripts that allow you to do this\
    \ without an in-depth understanding of the JavaScript language.\n\n```\nchapter-09/adding-a-flash-movie.html\n\
    \n<!DOCTYPE html>\n<html>\n<head>\n    <title>Adding a Flash Movie</title>\n \
    \   <script type=\"text/javascript\">\nsrc=\"http://ajax.googleapis.com/ajax/libs/swfobject/2.2/swfobject.js\"\
    ></script>\n    <script type=\"text/javascript\">\nsfobject.embedSWF(\"flash/bird.swf\"\
    ,\n    \"width\":\"400\",\n    \"height\":\"300\"\n);\n    </script>\n</head>\n\
    <body>\n    <div id=\"bird\">\n        <p>An animation of a bird\n        shower</p>\n\
    \    </div>\n</body>\n</html>\n```\n\nThe script we will be looking at is called\
    \ SWFObject. You can obtain a copy of it free from Google, and you can see how\
    \ we use it on the next page.\n\nOne advantage to using this technique is that\
    \ it allows browsers to show alternative content for users whose browsers are\
    \ not capable of showing Flash.\n\nThis technique uses a <div> element to create\
    \ a space where the Flash movie should sit. The <div> has an id attribute value\
    \ used by the SWFObject. In this example, the value of the id attribute is bird.\n\
    \nThe SWFObject will check if the user's browser can play the Flash movie. If\
    \ it can, the script will replace the content of the <div> with a .swf file.\n\
    \nIf you use a text description as alternative content, then you can achieve two\
    \ benefits:\n\nFor users who cannot play the Flash movie, you could show a still\
    \ image instead. You might also like to consider using a text description of the\
    \ Flash file.\n\n+   1. The text can be accessed by those with visual and/or physical\
    \ impairments who are not able to interact with the Flash file.\n\n+   2. The\
    \ text can be indexed by search engines (which are not as effective at indexing\
    \ SWF files), increasing the chance that your content will be found.\n\nInside\
    \ the <div> element you can place the alternative content for users who are not\
    \ able to play Flash."
  merge: -1
