  md: '# # How to View the Source of This Page


    If you go to your browser''s View menu, you will see an option that allows you
    to see the source code behind a web page.


    When the web was first taking off this was a very popular way for people to learn
    how web pages had been built.


    Today, people still view the source of pages to learn how a web page has been
    built.


