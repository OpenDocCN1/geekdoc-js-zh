  md: '# UNITS OF TYPE SIZE


    # PIXELS


    # PERCENTAGES


    # EMS


    TWELVE PIXEL SCALE


    | h1 | 24px |

    | h2 | 18px |

    | h3 | 14px |

    | body | 12px |


    | h1 | 200% |

    | h2 | 150% |

    | h3 | 117% |

    | body | 75% |


    | h1 | 1.5em |

    | h2 | 1.3em |

    | h3 | 0.875em |

    | body | 0.75em |


    SIXTEEN PIXEL SCALE


    | h1 | 32px |

    | h2 | 24px |

    | h3 | 18px |

    | body | 16px |


    | h1 | 200% |

    | h2 | 150% |

    | h3 | 112.5% |

    | body | 100% |


    | h1 | 2em |

    | h2 | 1.5em |

    | h3 | 1.125em |

    | body | 1em |


    Setting font size in pixels is the best way to ensure that the type appears at
    the size you intended (percentages and ems are more likely to vary if a user has
    changed the default font size in their browser).


    Pixels are relative to the resolution of the screen, so the same type size will
    look larger when a screen has a resolution of 800x600 than it when it is 1280x800.


    The default font size in a web browser is 16 pixels. Using percentages of this
    amount, you can create a scale where the default text size is 12 pixels, and headings
    are sized in relation to this.


    It is possible for users to change the default size of text in their web browsers.
    If they have done this, the fonts will be displayed at the same scale as the designer
    intended, but at a larger size.


    Ems allow to change the size of text relative to the size of the text in the parent
    element. The default size of text in web browsers is 16 pixels, so you can use
    rules to show those for percentages.


    Because users can change the default size of text in their browser, the fonts
    could appear larger (or smaller) than the designer intended.


    You can also use pt for font sizes instead of px for pixels, but you should only
    do this when creating style sheets for printer-friendly versions of pages.


    The p rule is above to help Internet Explorer 6 and 7 display the fonts at the
    right size. Without this extra rule, IE6 and IE7 exaggerate the relative sizes
    of other text.'
