  md: '# VISUAL EDITORS & THEIR CODE VIEWS


    Content management systems and HTML editors such as Dreamweaver usually have two
    views of the page you are creating: a visual editor and a code view.


    Visual editors often resemble word processors. Although each editor will differ
    slightly, there are some features that are common to most that allow you to control
    the presentation of text.


    +   - Headings are created by highlighting text then using a drop-down box to
    select a heading.


    +   - Bold and italic text are created by highlighting text and pressing a b o
    i button.


    +   - New paragraphs are created by using the return or the enter key.


    +   - Line breaks are created by pressing the shift key and the return key at
    the same time of text.


    +   - Horizontal rules are created using a button with a straight line on it.


    If you copy and paste text from a program that allows you to format text (such
    as Word) into a visual editor, it may add extra markup. To prevent this, copy
    the text into a plain text editor (such as Notepad on a PC or TextEdit on a Mac)
    and then copy it from program and paste into the visual editor.


    Code views show you the code created by the visual editor so you can manually
    edit it, or you can just enter new code yourself by using an icon that says HTML
    or has angled brackets. White space may be added to the code by the editor to
    make the code easier to read.


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_55_0.png)'
  merge: -1
  pgno: 55
