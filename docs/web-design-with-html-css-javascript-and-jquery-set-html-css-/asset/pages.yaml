  md: 'This example shows a pH scale to demonstrate the different ways that colors
    can be specified using CSS (using color names, hex codes, RGB, and HSL).


    The rule for the `&lt;body&gt;` element sets a default color for all the text
    as well as the default background color for the page. Both use color names.


    The rule for the `&lt;h1&gt;` element sets the color of the heading using a hex
    code. There are two values for the background-color property of the `&lt;h1&gt;`
    element. The first provides a fallback color using a hex code and the second is
    an HSLA value for browsers that support this method.


    Each paragraph is then shown in a different color to represent the varying levels
    of acidity or alkalinity, and these are specified using RGB values.


    The example also uses a property called margin to decrease the gap between the
    paragraph boxes, and a property called padding to create a gap between the edge
    of the boxes and the text within them. (These properties are covered on pages
    313-314.)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_264_0.png)'
