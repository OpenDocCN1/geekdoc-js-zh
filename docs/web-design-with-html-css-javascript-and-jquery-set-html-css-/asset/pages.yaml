  md: '# HTML DESCRIBES THE STRUCTURE OF PAGES


    In the browser window you can see a web page that features exactly the same content
    as the Word document you met on the page 18. To describe the structure of a web
    page, add code to the words we want to appear on the page.


    You can see the HTML code for this page below. Don''t worry about what the code
    means. We start to look at it in more detail on the next page. Note that the HTML
    code is in blue, and the text you see on screen is in black.


    ```

    <html>

    <body>

    <h1>This is the Main Heading</h1>

    <p>This text might be an introduction to the rest of the page. And if the page
