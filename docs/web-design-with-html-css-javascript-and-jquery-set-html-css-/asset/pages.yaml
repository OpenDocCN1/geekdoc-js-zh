    Duis aute irure dolor in reprehenderit in voluptate esse esse dolore eu fugiat
    nulla pariatur.


    # ## ADVANTAGES


    # ## DISADVANTAGES


    +   - Pages expand to fill the entire window so there are no spaces around the
    page on a large screen.

    - If the user has a small window, the page can contract to fit it without the
    user having to scroll to the side.

    - The design is tolerant of users setting font sizes than the designer intended
    (because the page can stretch).


    +   - If you do not control the width of sections of the page then the design
    can look very different than you intended, with unexpected gaps around certain
    elements or items squashed together.

    - If the user has a wide window, lines of text can become very long, makes them
    harder to read.

    - If the user has a narrow window, words may be squashed and you end up with few
    words on each line.

    - If a fixed item (such as an image) is in a box that is too small to hold it
    (because the user has made the window smaller) the image can overflow over the
    text.


    Because liquid layouts can stretch the entire width of the browser, resulting
    in lines of text that are hard to read, some liquid layouts only let part of the
    page expand and contract. Parts of the page have minimum and maximum widths.'
