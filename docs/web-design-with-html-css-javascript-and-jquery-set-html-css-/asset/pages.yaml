  md: '# SEMANTIC MARKUP


    There are some text elements that are not intended to affect the structure of
    your web pages, but they do add extra information to the pages — they are known
    as semantic markup.


    In the rest of the chapter you will meet some more elements that will help you
    when you are adding text to web pages. For example, you are going to meet the
    `<em>` element that allows you to indicate where emphasis should be placed on
    selected words and the `<blockquote>` element which indicates that a block of
    text is a quotation.


    Browsers often display the contents of these elements in a different way. For
    example, the content of the `<em>` element is shown in italics, and a `<blockquote>`
    is usually indented. You should not use them to change the way that your text
    looks; their purpose is to describe the content of your web pages more accurately.


    The reason for using these elements is that other programs, such as screen readers
    or search engines, can use this information. For example, the voice of a screen
    reader may add emphasis to the words inside the `<em>` element, or a search engine
    might register that your page features a `<blockquote>quote` if you use the `<blockquote>`
    element.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '# STRONG & EMPHASIS


    # <strong>


    The use of the <strong> element indicates that its content has strong importance.
    For example, the words contained in this element might be said with strong.


    ```

    chapter-02/strong.html

    <p><strong>Beware:</strong> Pickpockets operate in this area.</p>

    <p>This toy has many small pieces and is <strong>not suitable for children under
    five years old.</strong></p>

    ```


    By default, browsers will show the contents of a <strong> element in bold.


    > Beware: Pickpockets operate in this area.

    nThis toy has many small pieces and is not suitable for children under five years
    old.


    # <em>


    The <em> element indicates emphasis that subtly changes the meaning of a sentence.


    ```

    chapter-02/emphasis.html

    <p>I <em>think</em> Ivy was the first.</p>

    <p>I think <em>Ivy</em> was the first.</p>

    <p>I think Ivy was the <em>first</em>.</p>

    ```


    By default, browsers will show the contents of an <em> element in italic.


    I think Ivy was the first.

    I think Ivy was the first.

    I think Ivy was the first.'
  merge: -1
