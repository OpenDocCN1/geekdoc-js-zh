  md: '# TYPEFACE TERMINOLOGY


    # SERIF


    Serif fonts have extra details on the ends of the main strokes of the letters.
    These details are known as serifs.


    # SANS-SERIF


    Sans-serif fonts have straight ends to letters, and therefore have a much cleaner
    design.


    # MONOSPACE


    Every letter in a monospace (or fixed-width) font is the same width. (Non-monospace
    fonts have different widths.)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_273_0.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_273_1.png)


    ![](img/e6c4b3cd8fbe75ea4d238f930a7bca3c_273_2.png)


    In print, serif fonts were traditionally used for long passages of text because
    they were considered easier to read.


    Screens have a lower resolution than print. So, if the text is small, sans-serif
    fonts can be clearer to read.


    Monospace fonts are commonly used for code because they align nicely, making the
    text easier to follow.'
  merge: -1
