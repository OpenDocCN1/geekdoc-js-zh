  md: "# LONG TABLES\n\nThere are three elements that the help distinguish between\
    \ the main content of the table and the first and last rows (which can contain\
    \ different content).\n\nThese elements help people who use screen readers and\
    \ allow you to style these sections in a different manner than the rest of the\
    \ table (as you will see when you learn about CSS).\n\n# <thead>\n\nThe headings\
    \ of the table should sit inside the `<thead>` element.\n\n# <body>\n\nThe body\
    \ should sit inside the `<body>` element.\n\n# <tfoot>\n\nThe footer belongs inside\
    \ the `<tfoot>` element.\n\nBy default, browsers rarely treat the content of these\
    \ elements differently than other elements, however designers often use CSS styles\
    \ to change their appearance.\n\n```\n<table>\n  <head>\n    <tr>\n      <th>Date</th>\n\
    \      <th>Income</th>\n      <th>Expenditure</th>\n    </tr>\n  </head>\n  <tbody>\n\
    \    <tr>\n      <th>1st January</th>\n      <td>250</td>\n      <td>36</td>\n\
    \    </tr>\n    <tr>\n      <th>2nd January</th>\n      <td>285</td>\n      <td>48</td>\n\
    \      <!-- additional rows as above -->\n    <tr>\n      <th>31st January</th>\n\
