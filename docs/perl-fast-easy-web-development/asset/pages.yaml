  md: '# Variable Interpolation Revisited


    You have learned already about interpolation, wherein if a variable is contained
    within a string enclosed in double quotes, the variable will be replaced by the
    value of that variable.


    ```

    $language = "Perl";

    print "The best Web Programming language is $language \n";

    ```


    will give you


    "The best Web Programming language is Perl"


    There are occasions when you want a variable value when interpolated to join up
    to an adjacent word. Consider the following example:


    ```

    $something = "comfort";

    print "This chair is very $something \n";

    ```


    This is trying to join $something to the literal part of the main string. Unfortunately,
    it will not work, as Perl will try to expand a variable called $something. If
    you add a space to try to fix it, obviously you''ll get a space in the result.


