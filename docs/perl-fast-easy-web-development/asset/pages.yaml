  md: '# How Do I Install Perl?


    Before you can use Perl, you need to install and set up the Web server with which
    you are going to use it. You will learn how to set up the Web server shortly,
    but for now, here is the information you need to get started with Perl. Perl can
    be used at the "command prompt" the way you may run DOS programs in the old days!
    Perl began life as a system administration and reporting tool, so it works equally
    in this way.


    # Windows Installation


    +   1. Download Perl from www.activestate.com or www.perl.com.


    +   2. When the download is complete, double-click the file to begin installation.


    +   3. Follow the on-screen prompts to install Perl on your machine. If the installation
    fails, you may need to obtain the latest copy of the Microsoft Installer. If you
    are using the Activistate site, you will find a link to the MS installer after
    you Downloads under Downloads.


    ![](img/c880e5f7fac453846757b224a7e33f2d_21_0.png)


    The installation process should update the windows path so that the Perl executable
    can be found. Open an MS-DOS "prompt" command window to run Perl and verify its
    version.


    +   4. Click the Start button on the Taskbar.'
