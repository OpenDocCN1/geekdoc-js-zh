  md: '# Saving HTML Files and Testing HTML Pages


    HTML is merely text, and so can be written using any text editor (like Notepad,
    WordPad, Word, HTMLPad 2000 and so on). There are many HTML editors on the market
    but they differ from ordinary text editors only in so far as they have specialized
    tools that enable you to write HTML more quickly and with (hopefully) fewer errors.


    When you save an HTML file, you will normally save it so that it has an .htm extension.


    ```

    Home.htm

    ```


    > NOTE

    You can also use the .html extension, which is usually the standard on UNIX-based
    systems. The three-character .htm extension probably came because of the 8.3 filename
    limitation in DOS and Windows 3.1


    Be careful when using editors such as Notepad or Word because they might (unless
    you explicitly ask them to do otherwise) add a .txt or a .doc extension to your
    HTML filename.


    You can test your HTML pages simply by opening a file directly in the Web browser.
    In Windows, you would do this simply by double-clicking the file, which causes
    the browser to open, displaying the contents of the HTML file. Of course, a better
    way to test the files is to save them into a folder under wwwroot or htdocs (depending
    upon your platform, Web server, and so on). You can then use the http://127.0.0.1/foldername
    type of address in your browser location window.


    > NOTE\When you actually write Perl Web (CGI) programs, you must save them in
    a scripts folder (or another folder with execute permissions) under your Web server
    or they will not work.'
  merge: -1
