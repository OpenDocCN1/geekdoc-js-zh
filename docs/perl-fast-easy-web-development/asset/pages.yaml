  md: '![](img/c880e5f7fac453846757b224a7e33f2d_307_0.png)


    # # Reading Records from a Database Using ADO


    In this chapter we are going to learn two methods of using databases with Perl—using
    OLE (Object Linking and Embedding) database access, and the Perl DBI method. The
    first method is often referred to as ActiveXData Objects, or ADO. In this section
    you will learn how to select records from a relational database using ADO and
    SQL (Structured Query Language), the language used to select records from the
    database, write records to it, and so on). An in-depth discussion on SQL is beyond
    the scope of this book, but you will learn sufficient SQL here to be able to perform
    the most common database functions—read, write, delete, and so on.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# CHAPTER 14: USING PERL WITH DATABASES


    # 1. Open your editor and start a new program.


    ```

    #!/c:perl/bin

    ```


    2. Bring a couple of required modules into your Perl program. These contain the
    code required to enable you to manipulate databases using the Win32 OLE method.


    ```

    use Win32::OLE;

    use Win32::OLE::Const ''Microsoft ActiveX Data Objects'';

    ```


    ![](img/c880e5f7fac453846757b224a7e33f2d_308_0.png)


    3. Create a variable to hold the name of your database table.


    ```

    $table = "addressable";

    ```


    4. Now create an ADO database connection.


    ```

    $conn = Win32::OLE:

    >new(ADODB.Connection);

    ```


    5. Create an ADO recordset to hold the records returned from the database.


    ```

    $rs = Win32::OLE->new(ADODB.Recordset);

    ```


    > A recordset is a temporary table containing the records that are returned from
    your database SQL query.


    # 6. Using the connection you created, open the address database.


    ```

    $conn->Open("address");

