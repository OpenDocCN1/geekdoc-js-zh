  md: '# CHAPTER 16: THE CGI.pm MODULE


    # Forms and CGI.pm


    CGI.pm can also build forms. You can generate the HTML on-the-fly to create forms,
    including all the usual elements, such as select boxes, text areas, and a submit
    button. Try the following program, which has many of the usual elements you might
    expect to find in a form. I''ll leave you to judge how easy it is to use.


    The page you are going to create here is going to call itself. This form will
    also remember the state or values of all the fields on each execution of the form.
    You will see what I mean in a moment.


    ![](img/c880e5f7fac453846757b224a7e33f2d_366_0.png)


    +   1. Open a new program in your editor.


    ```

    #!c:/perl/bin

    ```


    +   2. Bring in the CGI.pm module.


    ```

    use CGI '':standard'';

    ```


    +   3. Create an HTTP header using the CGI.pm header function.


    ```

    print header();

    ```


    +   4. Add a title and a few new lines


    ```

    print p, "<Form Elements</br>", br(), br();

    ```


    +   5. Tell CGI.pm that you are going to start a new form.


    ```

    print start_form();

    ```'
