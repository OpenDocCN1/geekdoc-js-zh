  md: '# CHAPTER 4: OPERATORS


    There is one more thing that is probably worth mentioning before you move on.
    The increment and decrement operators can occur before the variable name, like
    this:


    ++$count;


    Initially, it might not appear to be any different than the following:


    $count++;


    And there isn''t a lot of difference. After all, the value still ends incremented
    by 1. The only difference is that, in situations where the variable is used in
    a loop, the value contained in the variable $count is before its value is used
    in the first case, and after it is used in the second case. It might not appear
    to matter at first sight, but remember it; I guarantee you will find a reason
    to use one rather than the other.


    Try this simple example to demonstrate the subtle difference.


    # 1. Open your editor.


