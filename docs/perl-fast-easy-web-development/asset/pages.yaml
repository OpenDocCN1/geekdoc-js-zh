    chop() has behaved in exactly the same way it did for the string variable. This
    is not altogether surprising; as you will remember, a scalar can be string or
    numeric, in fact any single value of any data type.


    Chop() receives a scalar variable as its argument (parameter) and so regardless
    of what it contains, chop() deals with it in the same way.


    the chop function is very useful when it comes to things like removing the carriage
    return character at the end of a line in a file, for example, but you will find
    other uses for it as you go along.


    # A Smart Chop: chomp()


    chop is similar to chop, except that you have some control over what it chops...err,
    chops. It takes characters from the end of a line (string), but this time only
    the characters you tell it to. It does this through the use of a special variable
    known as the input record separator. The input record separator is represented
    like this:


    ```

    $/

    ```


    $/ will contain the character you removed from the end of a string, which means
    if the string you give it doesn''t have the character(s) you wanted, the original
    string is returned. Check out the example on the next page.'
