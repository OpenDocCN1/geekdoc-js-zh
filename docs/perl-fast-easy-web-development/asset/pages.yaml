- img_proc: true
  md: 'On the NT platform, this first line will be treated as a comment. However,
    NT uses “association” between a program and the file extension of its name. In
    other words, when Windows NT (and Windows 9x, and so on) sees a .pl extension,
    it will automatically invoke the Perl interpreter.


    # Getting Things In and Out of Perl Programs


    We have already seen that we can display things on the screen using the Perl print
    command:


    +   1. Open your text editor and start a new file.


    Many editors like HTMLPad 2000 try to be helpful and add some starting code for
    you. Now, you will not need what it offers. To clear the text in the editor window,
    press the CTRL key and “A” simultaneously; this will cause the text to turn blue.
    Now press the Delete, and the editor window will be emptied.


    ![](img/c880e5f7fac453846757b224a7e33f2d_44_0.png)


    +   2. On the first line (do not add any spaces in front; that is, to start in
    column 1 line 1), type:


    ```

    #!c:\perl\bin

    ```


    (or #!usr/bin/perl if you are using a UNIX platform).


    +   3. On the next line (or the one after, to improve readability), type:


    ```

    print "Perl Fast & Easy Web Development!";

    ```


    (Note the semicolon at the end of the statement.)


    +   4. Save this little program as 02-01.pl in your “Test” folder.'
