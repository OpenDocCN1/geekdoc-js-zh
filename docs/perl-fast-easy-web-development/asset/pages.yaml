  md: 'Very simply, these Perl functions perform the following operations:


    +   - uc. Converts a string to uppercase.

    - lc. Converts a string to lowercase.

    - ucfirst. Converts just the first character of a string to uppercase.

    - lcfirst. Converts just the first character of a string to lowercase.


    Try this sample program.


    # 1. Set up a couple of string variables like this:


    ```

