    \  return($variable);\n}\n```\n\nIf you are expecting a value to be returned,\
    \ you can capture that value like this:\n\n```\n$result = subroutine_name();\n\
    ```\n\nYou can also pass parameters as you do with many built-in functions.\n\n\
