  pgno: 416
- img_proc: true
  md: 'If you leave out the $replacementstring parameter, then just the substring
    is returned so that the same code as above but without the $replacementstring
    parameter, would give


    Cats


    substr() is quite a powerful function.


    # The tr/// Operator


    The tr/// operator is not, strictly speaking, a function, but it can be argued
    that it provides one. The syntax of the tr/// operator is


    ```

    tr/ searchstring / replacingstr /

    ```


    The forward slashes are simply delimiters.


    The tr/// operator is very powerful. Consider the following:


    ```

    $newstring =~ tr/a-z/A - Z/

    ```


    This will replace every character in a string, of the range a to z, and replace
    it with the uppercase equivalent A to Z.


    Note the =~ symbol. This is called the binding operator and if it is not used,
    the operation is carried out on whatever is in $_ In this case you will not use
    a variable on the lefhand side, like this:


    ```

    tr/a-k/A-K

    ```


    You can also add modifiers onto the end of the translation operator. So


    ```

    tr/a-k/h-k/c

    ```


    (where /c is the modifier) replaces any character that is not in the search string.


    ```

    tr/a-k/h-k/d

    ```


    deletes any characters that are found to match the searchstring characters, where
    no replacement is present in replacingstr.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# The chr() Function


    The chr() function returns the character corresponding to the ASCII code supplied
    in the parentheses.


    Chr(67)


    returns the letter C.


    This function can be useful for issuing special codes such as linefeed characters,
    tab characters, and so on.


    # The ord() Function


    Essentially, the ord() function does the opposite of the chr() function. So if
    you provide C as an argument or parameter, 67 will be returned.


    If you send more than one character to the function, only the first character
    is used.


    So


    ```

    $asciinumber = ord("Cat");

    ```


    returns 67 in the variable $asciinumber.


    # The join() Function


    The join() function is an interesting function. It joins together lists or strings
    into one string, but separates them by a supplied separator. The syntax is like
    this:


    ```

    $wholestring = join (separator_character, list);

    ```


    Often the separator will be a comma or some other character considered useful
    as a field separator. This has obvious uses in creating comma-separated value
    (csv) files.'
  merge: -1
  pgno: 418
- img_proc: true
  md: 'For example:


    ```

    @array1 = ( "Lord", "of", "the", "rings";

    $string1 = join( '' '', @array1);

    print $string1;

    ```


    will display


    Lord, of, the, rings


    The separator can be any string you like.


    # The sort() Function


    The sort() function sorts lists of values.


    The syntax is


    ```

    sort (@listofvalues);

    ```


    For example, if you do this:


    ```

    print sort("animal", "vegetable", "mineral");

    ```


    then


    animalmineralvegetable


    would be displayed. You can separate the words again using the join() function.


    # The rand() Function


    The rand() function generates random floating-point number that is less than one
    but greater then zero. If you want a larger number you have to supply the maximum
    value you want. If you want an integer you must use the int() function to return
    a whole number, like this:


    ```

    print int(rand(10));

    ```


    This prints an integer between 0 and 9.'
  merge: -1
  pgno: 419
- img_proc: true
  md: '# APPENDIX A: MORE PERL FUNCTIONS


    # The Here Document


    This is a peculiar but very useful feature. The Here document enables you to pass
    everything that follows an opening identifier to pass straight through so that
    everything is quoted as though it were text until Perl sees a closing identifier.


    If you put an unquoted identifier at the beginning of the Here document, Perl
    will interpolate any variables it finds in the text. This is very useful if you
    are sending a form back with variables assigned to form elements. It saves a lot
    of coding.


    This is the basic syntax:


    ```

    <<an_identifier_string;

    a line of text

    and another line of text\and yet another line of text

    an_identifier_string

    ```


    If the closing identifier is the last line of your Perl program, there must be
    another carriage return.


    A quoted opening identifier such as


    ```

    ''''an_identifier_string'';",

    ```


    prevents interpolation.


    There is an example of this use in Chapter 17, "Case Study: Contact Database."


    I hope you find these additional functions and features useful. This book does
    not describe or constitute a full list of the features and functions available
    in Perl, nor has every possible use of every parameter of every function described.
    But I hope there has been enough to whet your appetite without scaring you away.'
