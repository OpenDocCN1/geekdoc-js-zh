  md: '# WRITING AN HTML DOCUMENT 147


    From this point on, it''s up to you to decide which method to use for testing
    HTML files.


    # The Structure of an HTML Document


    HTML tags tell the Web browser all about your page and how to format it. In most
    cases, HTML tags have a start tag and an end tag so that the browser knows when
    to start the formatting and to end it. Often, you can get without the end tag,
    but it is poor practice and might cause problems with some browsers.


    There are many optional elements in an HTML document, but basically, an HTML document
    consists of the <HEAD> tag and the <BODY> tag. In turn, the <HEAD> tag and the
    <BODY> tag may consist of a number of other tags.


    The <HEAD> tag can contain:


    +   - The <TITLE> tag. This is the title that appears on the title bar right at
    the top of the browser window.

    - The <SCRIPT> tag. Optionally, scripts can be added inside the HTML header, for
    example, for Field validation—more on that later.

    - Other tags such as <META ...> tags, which contain information about the page
    and are used by search engines to find and catalogue your page.

    - The <BODY> tag contains the actual content of the page—often referred to the
    document—which consists of a wide range of possible HTML tags.


    # Writing an HTML Document


    In this chapter, you''ll learn the basics of HTML to get you up and running with
    Web applications as quickly as possible, but you should know that there are formal,
    recognized standards for HTML as there are many other things in computing. As
    you become more proficient in writing Web applications, you will want to know
    more about these standards. There are many sites on the Web, as well as some excellent
    books, that will help you to extend your knowledge.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'HTML is simple, but like most things in life, it does have rules. Follow the
    text and try the examples, by the time you get to the end of this chapter, you
    should be able to write a Web page from scratch, using little more than a simple
    text editor and your Web browser.


    Start by telling the browser that this is an HTML document. To do this, you use
    the <HTML> tag. You end the HTML document with the </HTML> tag. All tags are the
    same as the start tags, except they have the forward slash at the start of the
    tag name.


    So, the header tag is <HEAD> and ends with </HEAD>. The body tag is <BODY> and
    ends with </BODY>. Get the idea?


    Open your editor and start coding some HTML.


