  md: '# Introduction


    Perl was born in October, 1987. Written by Larry Wall as a Ph.D. project, first
    appeared on the comp.sources News Group as Perl version 1.0. Perl now offers a
    standard set of supplied libraries, object-oriented programming facilities, and
    expanded regular expressions. Perl used to be written as PERL (and sometimes still
    is), reminding us that it stands for Practical Extraction and Reporting Language.
    That is what it did, did, back when it was first written. Now it does de, much
    more.


    Perl is an interpreted language. It means it''s not as fast as languages like
    C, but it also means you don''t have to keep cycling through the laborious process
    of editing, compiling testing, then re-editing, recompiling, and so on. With Perl,
    you just edit and run! It''s a fast language to develop in and a great one to
    prototype with! Perl can also be very concise. It is possible to achieve a lot
    with very little code. In current parlance, then, Perl is a results-oriented language.


    Perl has become the "glue" that allows many other tools to be linked together.
    It has been "ported" to many platforms and has become an essential tool for OS
    administrators and Web Programmers. It has been used to build complete systems,
    and it is also used for creating throwaway code snippets to do one-off jobs. Perl
    is used worldwide on numerous platforms with many different Web servers. In many
    cases it is the default Web language. If an ISP offers any CGI-type programming
    facilities, it is likely that they will include Perl. If it offers only one language,
    that language is probably Perl. Perl is powerful, Perl is fast (for an interpreted
    language!), and Perl is useful! There is virtually no job that cannot be done
    with Perl, and often jobs can be done with far less code than would be using most
    other languages.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# INTRODUCTION


    In this book you will explore many of Perl''s features before looking at how you
    can use it to build dynamic Web sites. You will not Brawl through huge conceptual
    discussions on the whys and wherefores of Perl. Rather, you''ll take the language
    and select the methods and mechanisms that can help you most in your quest to
    write active Web sites. In other words, you''ll be exploring ways of solving problems.
    After all, that programming languages are designed to do! My aim in this book
    is to get you to your destination in the shortest possible time, at the same time
    seeking to help you understand how Perl works in this field.


    # How is This Book Organized?


    This is very much “get you started” book. I have deliberately avoided some of
    the more difficult aspects of learning a language such as Perl, for that way lies
    the seeds of exasperation, disillusionment, and the probable abandonment of the
    language.


    You will find that first chapters of the book are concerned with the creation
    of the Web development environment—installing Perl and a Web server. From there
    to a little over half-way through the book, you''ll find bite-sized pieces of
    Perl code, each designed to demonstrate one particular aspect of the Perl language.
    The step-by-step code examples are accompanied by screenshots showing the code
    and its resulting execution.


    From onwards, you will work to wards building real Perl applications—examining
    CGI and forms, as well as files and e-mail. The book ends with a full Perl database
    Web application.


    # Who Should Read this Book?


    This book assumes as little as it is possible to assume. It is aimed at someone
    who has little knowledge of Web development, or someone who has used WYSIWYG point-and-click-type
    Web authoring tools and now wants to move into creating Web applications in as
    short a time as possible.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Software/Hardware Requirements


    To use this book and the examples supplied, you will need a Web server. If you''re
    using Windows 95 then you can obtain Personal Web Server. This is often to be
    found on freebie magazine-mounted CDs in a free product called NT Server 4 Option
    Pack. The Option Pack also contains Peer Web Services for Windows NT 4, which
    does the same job. Users of Windows 98 / ME should find that they have a copy
    of Personal Web Server already on their machine. If not, check your Windows installation
    CD. Windows 2000 professional / XP Professional users should find they have a
    copy of Internet Information Server (IIS) on their machine, which is even better.
    UNIX users can make use of the brilliant Apache Web server available from www.apache.org
    (a Windows version is also available).


    Of course, you will need Perl itself; where to obtain it and how to install it
    are covered in the book.


    You will need an editor to code with. You can use a simple editor, such as Notepad
    in Windows or Vi or Emacs on the UNIX platform. For Windows, a personal favorite
    of mine is HTMLPad 2000 (http://www.blumentals.net/). There is also OptPerl (http://www.xarka.com/optierl/)
    which offers a full Integrated Development Environment (IDE) for Perl.


    You do not need an incredibly powerful machine to develop in Perl; almost anything
    will do, as long as it has plenty of memory (128Mb+) and few hundred megabytes
    of space free for you to develop in.


    And of course you will need a Web Browser; most of you will have Microsoft''s
    Internet Explorer already on your machine, but you may also want to try Opera
    (www.opera.com), an excellent browser that comes with a decent mail client built
    in.'
  merge: -1
