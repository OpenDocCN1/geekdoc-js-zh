    Note that the standard convention is to capitalize the second word in a variable.
    This makes the code easier to read and reduces mistakes. It is up to you whether
    to follow this convention, but doing so will make it easier for other people following
    along you to update your code.


    Subtraction, multiplication, and division are performed in a similar manner to
