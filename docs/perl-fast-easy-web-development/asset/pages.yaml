  md: "# 8. You should see this output from your program.\n\n# Loops in Perl\n\nPerl\
    \ is fairly rich in its loop facilities. Perl can do loop while a condition is\
    \ True. It can loop until a condition is True or do while or until a condition\
    \ is True or False, performing the loop at least once. Finally, Perl can loop\
    \ a predetermined number of times\n\nusing the for loop. Next you will learn how\
    \ to use each of these loop structures.\n\n# The while and until Loops\n\nThe\
    \ while loop runs a loop as long as a condition is True. If the condition specified\
    \ is not True to begin with, the code within the while loop is never executed.\
    \ The while loop looks like this:\n\n```\nwhile (condition)\n{\n    statement\
    \ ...;\n    statement ...;\n}\n```\n\n> NOTE\n that again you will often see the\
    \ opening brace on the same line as the while(condition)—it is just another convention."
  merge: -1
  pgno: 129
