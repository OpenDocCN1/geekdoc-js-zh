    # Installing Perl on a UNIX Machine


    Installing Perl on a UNIX machine is very different from doing so on a Windows
    machine. To install Perl on a UNIX machine you must first obtain a copy of the
    Perl Bundle, as it is known, from either http://www.perl.com or from http://www.activate.com.
    Note that there is a Production version and a version that is often marked as
    "Development." I recommend that you go for the Production version (sometimes referred
    to as the "Stable" version).


    > TIP

    You will also find a number of useful tools on these sites, as well as helpful
    articles, tutorials, helpful hints, and so on.


    Having obtained your UNIX Perl Bundle, you must now build your Perl system. For
    this you will need an ANSI Compiler. There are a number to choose from, and you
    may already have one on your UNIX "box."


    In fact, you may already have a copy of Perl on your machine, as many machines
    are now shipped with Perl as part of the operating system.'
