    This chapter will begin with a basic discussion on what program flow is (regardless
    of the language being used, there is always some kind of flow control in a program).
    You will then learn how to use flow control to produce the result you want from
    your Perl programs.


    If you are already familiar with basic programming techniques, you may want to
    skip this short introduction. If you''re a Web author branching out into Web development,
    or someone fairly new to programming who wishes to become a Web developer, you
    may find this section to be of interest.


    In this chapter you will learn:


    +   - What program flow is

    - How program flow works in Perl

    - How to use the if statement

    - How to use loops in Perl'
  merge: -1
