- img_proc: true
  md: '# 216 CHAPTER 10: CGI PROGRAMMING


    # 14. Open your browser.


    15. Enter the following URL into the address box:

    http://127.0.0.1/myhtml/

    select.htm.


    ![](img/c880e5f7fac453846757b224a7e33f2d_234_0.png)


    You should see two select boxes, one of which is a single select and the other
    a multiple select.


    You will find the <select> tags very useful for many reasons. Say you want to
    save data from an HTML form in a database and you want to be


    able to manipulate database later. Suppose you want to pick out the people who
    live in London. Some will type London, some will type london, and some even spell
    it wrong. If you use a select box for all such fields, you eliminate the possibility
    of input error for those fields.


    # Text Area Fields


    Text area field is useful when users want to type in lots of text. You can provide
    a place for users to type with the <input type=text> tag, but with that method,
    the user can''t see what he''s typed once he''s filled the box, because the text
    “tickertapes out of the box to the left. With a text area field, you have a number
    of rows of text, so that as the user types the text scrolls up the box. You can
    also have a scrollbar so that the user can scroll up and down the text to review
    it.


    ```

    <TEXTAREA NAME="comments" COLS="*50" ROWS="*50"></TEXTAREA>

    ```


    There is not value clause with the text area. If there is a default text, then
    you place it between the <textarea> and the </textarea> tags.'
