  md: '# 366 CHAPTER 17: CASE STUDY: A CONTACT DATABASE


    # 1. Open your editor and start a new Perl program.


    ```

    #!:/perl/bin

    ```


    2. You are going to use ADO to access the database, so you''ll need to bring into
    your program the appropriate Perl modules, like this:


    ```

    use Win32::OLE;

    use Win32::OLE::Const ''Microsoft ActiveX Data Objects'';

    ```


    ![](img/c880e5f7fac453846757b224a7e33f2d_384_0.png)


    3. Now create some variables to enable your program to access the database. Note
    that the table has been named "contact_table". When you create your table in Microsoft
    Access, you will need to call it by this name so you can refer to it in your database.


    ```

    $table = "contact_table";

    $conn = Win32::OLE::Connection->_new(''ADODB.Connection'');

    $rs = Win32::OLE::Recordset->_new(''ADODB.Recordset'');

    ```


    4. You will also need a connection to the database. Your database will be recognized
    by the database that you give it in ODBC. The following command allows you to
    establish a connection with the database.


    ```

    $conn->Open("contact");

    ```


    5. Create a table to contain a list of the results that you receive from the database.
    Use a Table Header to set the width of the table columns and headings for each
    cell.


    ```

    print "Content-Type:text/html\n\n";

    print "<div align="center"><font face=verdana color=#333339 size=5>Contact Database</font><br><br";

    ```'
