    ```


    ![](img/c880e5f7fac453846757b224a7e33f2d_385_0.png)


    # 6. Now create a variable to contain a SQL statement for requesting the records
    from your contacts database, and then open a record containing the results of
    your SQL statement.


    ```

    $sql = "SELECT * FROM table";

    rs->Open($sql, $conn, 1, 1);

    ```


    # NOTE


    Note that you are using the * FROM table type of SQL statement, meaning get all
    of the columns. This is fine for a small program like this, but you are actually
    bringing back columns that you do not need and the database and the network doing
    unnecessary work. It keeps simple for this example, but a better SQL statement
    would be:


    ```

    $sql = "SELECT id, firstname, lastname, town FROM $table";

    ```'
