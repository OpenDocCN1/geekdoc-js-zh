- img_proc: true
  md: '# 2

    Taking Your First Steps with Perl


    This fairly short chapter is meant to get you started by writing a simple Perl
    program and running it, and, hopefully, understanding what''s going on in the
    process.


    As Perl is an interpreted language (a language in which each line of code is converted
    into machine code and immediately executed) it is fairly easy to test. You can
    keep your editor open and run your code in another window. If there is a problem,
    you can nip back into your editor, make changes, and run it again, repeating the
    process until you get it right. Since most of the problems you encounter will
    be typos, this is a very convenient way to work.


    Though Perl is actually quite fast for an interpreted language, you will eventually
    be using it in online applications, where speed is not normally a huge issue (compared,
    for example, to high-volume batch processing).


    In this chapter you will learn:


    +   - The basics of coding in Perl

    - Basic Perl syntax

    - How get input for a Perl program'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Before You Start


    It will be useful at this stage to decide which text editor you''d like to use
    to write and edit your programs. There are many available, from Notepad (on Windows)
    and Vi (on UNIX) to more sophisticated editors with specific language-support
    functions, buttons, and help. A good starter''s editor is HTMLPad 2000. It is
    great for HTML, Perl, and quite a few other languages, and although it doesn''t
    offer real language support, it does "color code" your source code, making it
    easier to read. HTMLPad 2000 is a nice, easy-to-use editor to learn with; later,
    you can choose an editor that includes the language support you want and works
    in a way that suits you.


    For this chapter, and for the next few chapters, create a new folder anywhere
    on your hard drive. You could create a new folder called "test" (or whatever you
    prefer to call it) inside the top-level: c:\Perl folder, or create a folder called
    "myPer" on your hard drive. It doesn''t matter where you put it, really, as long
    as you can find it easily!


    # The Basics of Coding in Perl


    In this chapter, you will begin looking at the structure of Perl, what elements
    make up a Perl program, and how to use them. So you can learn the basic concepts,
    the examples at this stage will be kept as simple as possible. As you proceed
    into later sections, you will be introduced to other useful Perl concepts and
    gradually increase your knowledge. Finally, a full CGI Perl sample program will
    bring together all you have learned, and add practical elements and concepts as
    you try the example.


    Now it''s time to learn how to put Perl programs together and how to represent
    and manipulate data. You''ll also have a chance to examine some simple processing
    mechanisms.


    # Perl Syntax


    You don''t need to learn all parts of Perl syntax in this chapter, but there are
    a few general points you need to understand before you can begin to put together
    a Perl program.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Statement Formatting


    Following are a few definitions to help you with statement formatting:


    +   - A statement is the smallest complete unit of code that actually does something.

    It is the computing equivalent of a sentence in English.

    - An expression is a value, or an arithmetic, algebraic, or string value.

    - A comment is a line (or more than one line) that performs no function in the

    program. It is descriptive text used to help a human reader understand what

    is going on in the code. Each line of a comment in Perl starts with a # sign.


    Perl is a free format language. That is, there can be as much white space (spaces,

    tabs, line breaks, and so on) as you wish. This means that you can write your
    code

    in a manner that makes it a lot more readable than other languages.


    It also means that Perl needs some way of showing when it has reached the end

    a statement. This is achieved by the use of the semicolon (;). So a Perl statement

    may look like this:


    ```

    print "I think Perl is great \n";

    ```


    This is a common method of terminating a statement. C, C++, Java, PHP, and

    Pascal, among others, all use the semicolon to terminate statements; so if you
    are

    coming from one of those languages, you will be familiar with this approach.


    Okay, assuming you have selected which editor you would like to work with, and

    can plunge into some Perl and see how it hangs together!


    # Beginning Perl


    All Perl programs should begin with what is affectionately known as the “shebang"

    statement. The shebang statement should occur in the beginning of the first

    column on the first line of the program, and it should contain the file path to
    the

    Perl interpreter, perl.exe. Why it should be called the “shebang” statement is'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'to debate, but it is typical of the type of names that are used in computing
    for

    some special characters (the exclamation mark is often referred to as the "shriek"

    or the "splat").


    The shebang statement starts with a # sign, indicating that it is a comment line.

    However, it is actually the one exception to this! On UNIX systems, this line
    tells the

    operating system to find Perl so that the program can be executed.


    # NOTE


    Remember: A Perl program should always begin with


    "!#pathname_to_Perl,


    inin column 1, line 1.


    For UNIX, this will look like this:


    ```

    #!/usr/bin/perl

    ```


    Optionally, this may be followed

    by a flag, which, for example,

    invokes the Perl syntax checker:


    ```

    #!/usr/bin/perl -w

    ```


    ![](img/c880e5f7fac453846757b224a7e33f2d_42_0.png)'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# BEGINNING PERL 25


    And for Windows, the shebang

    will look like this:


    ```

    #!C:perl/bin/

    ```


    Note, though, that for Windows,

    this is purely a comment!


    ![](img/c880e5f7fac453846757b224a7e33f2d_43_0.png)


    # CAUTION


    Here is an important

    difference between the\UNIX and NT platforms.

    Any statement starting

    with a # is regarded by

    Perl as a comment and is

    therefore ignored by the

    interpreter. An exception

    to this is the first line of a

    Perl program, as

    described earlier. This

    first statement tells the

    UNIX operating system

    where to find the Perl

    interpreter. As long as the

    program file is made an

    executable file (by setting

    chmod to 755), then just

    typing its name will cause

    to run.


    You can of course still use

    the -w flag on

    command line in NT.


    ![](img/c880e5f7fac453846757b224a7e33f2d_43_1.png)'
  merge: -1
