  md: '# CHAPTER 3: PERL DATA TYPES: SCALARS


    > NOTE\Note the way that comments appear automatically in italics. This is a function
    of the editor I have chosen to use here. If you are using another editor your
    comments may not appear in italics, though it is common in modern editors.


    Looking back at your program, note the backslash (\) the variable name in lines
    6, 10, 15, and so on. This is used so that Perl will print $number as a literal
    and not try to treat it as a variable. Where the $ is preceded by a backslash
    you will notice that the value is substituted for the variable name.


    There is a slight complication to the increment and decrement assignment operators.
    This is that they can occur either before or after the variable. The effect of
    the operator is the same except that when the operator is the variable, the value
    of the variable is updated before the variable is used. If the operator is used
    after the variable, the value of the variable is updated after the variable is
    used. If you are all familiar with C, C++, Java, PHP, and so on, you will be familiar
    with this; otherwise it might sound confusing. Don’t worry much about it for now—uses
    for these techniques will suggest themselves as you get deeper into Perl.


    # Strings


    Strings are also held in scalar variables, for instance, a person’s surname might
    be held in a scalar, like so:


    ```

    $surname

    ```


    But remember, a scalar is a scalar. For example, I can also use the $surname variable
    to hold a number. However, it is not all chaotic. Perl will recognize that you
    are using a scalar as a number by the action you are carrying out it. For example,
    if you carry out an arithmetic operation upon a numeric scalar you will get a
    sensible result.


    If you do the same on a scalar variable containing a string you will probably
    get zero. In other words, Perl recognizes a variable type by the context in which
    it is'
