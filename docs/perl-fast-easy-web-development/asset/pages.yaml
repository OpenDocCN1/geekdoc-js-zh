  md: '# The Paragraph Tag


    The paragraph tag <P> is used to split out sections of text into paragraphs. It
    is preferable to the <BR> tag, which is used simply for breaking lines. The <P>
    tag has an end tag </P> and this should be used. Right now you might be able to
    get away with not using it, but it is meant to be there, and there is no guarantee
    that future browsers will not insert it being present. Anyway, it helps keep your
    HTML tidy, so use it!


    Here is a simple example of the paragraph tag.


    # 1. Open a new HTML file in your editor.


    # 2. Create the usual opening <HTML> and <HEAD> tags.


    ```

    <html>

    <HEAD>

    <TITLE>This is an example Web Page</TITLE>

    </HEAD>

    <BODY>

    <P>This is the first paragraph. The text will simply wrap around until the end
    paragraph tag is found. Then the text will break ready for a new paragraph. <P>This
    is the second paragraph, etc. ...</P>

    </BODY>

    </html>

    ```


    # 3. Open a <BODY> tag.


    # 4. Open a paragraph tag like this:


    ```

    <P>

    ```


    # 5. Now enter some text:


    This is the first paragraph. The text will simply wrap around until the end paragraph
    tag is found. Then the text will break ready for a new paragraph. The paragraph
    can be as long as you like, and although the end tag is not mandatory, it is recommended
    that you include an end paragraph tag to tidy things!'
