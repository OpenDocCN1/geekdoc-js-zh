- img_proc: true
  md: '# Getting Data from Forms


    Here is an area where CGI.pm really does come into its. Getting data from forms
    using CGI.pm is so much easier and more intuitive for the programmer. With CGI.pm,
    you don''t have to think about how you''re going to separate the key value pairs,
    or how you are going to separate the form field name from its accompanying value.


    Remember all that stuff you learned about getting the data from a form and having
    to convert characters, splitting on = and so on? Well, thanks to CGI.pm you can
    now dodge all that. If you are using the POST method, you can simply get at form
    data by using CGI.pm''s param(`fieldname`) function.


    The param() function simply returns the value of the field named in the param()
    parentheses. So


    ```

    myfield = param(''surname'');

    ```


    returns the value that had been typed into a field called Surname on the sending
    form. Now that''s useful!


    Try this:


    +   1. Re-open your last program in your editor.'
  merge: -1
