  md: '# # Sending E-mail in Perl


    E-mail is a useful addition to the facilities in your Perl Web applications. And
    it is not difficult to send e-mail in Perl. Unfortunately, the methods used to
    do so differ, and it is largely a matter of asking your ISP for information. E-mail
    requires a program called a Mail Transfer Agent (MTA) to send the e-mail to an
    SMTP server. On the UNIX platform, the shell command `mail` does this. In Windows-type
    environments there is the SMTP server that comes with Microsoft''s Internet Information
    Services (IIS), but there is no MTA in Windows. Instead, you can use a package
    called SMTP in Perl to help you send e-mail, or you can use a more recent module
    called sender.pm. A program called Blat.exe can also be used on Windows platforms
    to send e-mail via SMTP.


    In this chapter you will learn:


    +   * What FTP is and how to use it

    * How to use SMTP in Perl to send e-mail

    * How to send e-mail using Blat.exe

    * How to send e-mail on a UNIX server using Sendmail'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# CHAPTER 13: SENDING E-MAIL IN PERL


    Because methods of using e-mail vary from ISP to ISP, I will describe each method
    generally, but with real code. Obviously, it is difficult to demonstrate with
    screenshots that e-mail has worked, but I''ll describe and show the code as usual.
    Please check with your ISP if you have any problems, or ask your ISP before you
    start if there is anything you need to know about your particular environment.
    Most problems will be minor—you may have to change the path to the Blat.exe or
    the Sendmail program, for example.


    Regardless of the platform that is being used, the method of sending e-mail is
    similar. Certain information is needed to send an e-mail, no matter what hardware
    or software you are using. For example, the following data items will always be
    required:


    +   * Recipient

    * Subject

    * Message body

    * Sender


    Armed with this basic information, you can build a Perl program to send e-mail.


    As I said, the basic method of sending e-mail on all platforms is similar. The
    general method is to:


    +   1. Define the path to the mail program.

    2. Open the mail connection.

    3. Supply the recipient and subject information.

    4. Send the mail body data.

    5. Close the e-mail connection.


    # Using FTP


    Before you begin to learn about e-mail in Perl, you need to know how to get your
    files from your machine up to your ISP or hosting company Web space because, for
    this chapter, you need to step outside of your development cocoon (Microsoft Personal
    Web Server if you''re using Windows 9x or Peer Web Services if you''re'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'using Windows NT). You will also need to use Web space that has an e-mail service
    attached to it. You will need an SMTP server or some means of being able to send
    e-mail. To get your work onto your ISP Web space, you''re going to have to learn
    how to get your files from your machine up to the ISP server using FTP (File Transfer
    Protocol)


    # What Is FTP?


    FTP is the means by which you are able to transfer your files from your computer
    to another, usually a server at your ISP installation where you keep your Web
    sites and Web applications.


    It isn''t difficult to use FTP, but it''s a good idea to become familiar with
    it to remove some of the guesswork and to speed you along your way. So, before
    you start to learn about sending e-mail, read this short briefing on how to use
    FTP. I shall use one example of an FTP client; there are many, but they are basically
    very similar There are a number of FTP clients on the market, and some of them
    are free for personal use.


    # NOTE


    > For the purposes of this discussion, I will concentrate on WS-FTP LE (the LE
    stands for Light Edition). This is an excellent, free FTP client that is easy
    to use and very effective.


    # How Do I Use FTP?


    First of all, obtain a copy of WS-FTP from http://www.ipswitch.com. Download a
    copy of the installation file, follow the onsite instructions, and install a copy
    of WS-FTP LE. There are a number of FTP clients out there, so you may want to
    shop around to find a product that suits you once you are comfortable using FTP.


    After you have installed the product, you have to configure it. To do so, follow
    this procedure.'
