  md: '# Using Perl with Databases


    You have learned how, using Perl, you can collect data from users. You know how
    to store data in files and how to retrieve it. You know how to use Perl to respond
    to people who visit your Web site e-mail. Now you are going to use Perl to store
    your data in a much more powerful way, by using relational databases.


    Essentially, a database is almost any store of related data. For example, a filing
    cabinet is a database. But generally these days, what we really mean is an electronic
    database.


    In this chapter you will learn how:


    +   - Add MS Access databases to your Web site

    - Read, add, update, and delete records from a database using ADO

    - Read, add, update, and delete records from a database using DBI'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Access 97 and Relational Databases


    Access 97 is a database package that includes sufficient code to enable the user
    to create complete standalone applications using forms, SQL, and so on. However,
    in this chapter you are only interested in using the engine itself. There are
    many other database systems that are as good or better, such as MySQL, PostgreSQL,
    and SQL Server, but Microsoft Access is widely used and available to many users,
    so I’ll use it for the examples in this chapter.


    > NOTE

    You can also use Access 2000 for the exercises in this chapter.


    Access 97 is a relational database system. A relational database allows the data
    structures to be defined or described. The data is organized into tables. A table
    is a collection of identically organized records and each record, or row, in a
    table contains the same fields, forming columns of that field. One or more fields
    may be designated as keys, allowing searches for specific values to be speeded
    up.


    For the purposes of this chapter, you will learn how to write the scripts that
    would be the basis of building a simple address book. For simplicity, the HTML
    forms will be left out and values to enter into the database you are going to
    build will be hard-coded in the Perl code. Obviously this is not a practical arrangement,
    but you already know how to get data back from a form (if you have forgotten,
    refer to Chapter 11).


    Right now, concentrate on learning the techniques and code necessary to manipulate
    a simple address book database.


    # The Database Design


    This will be a simple database that will be easy to implement in Access 97. The
    data items you are going to use are given in Table 14.1, along with some typical
    test data that you might want to enter to test your code.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# ACCESS 97 AND RELATIONAL DATABASES 279


    | TABLE 14.1 Database Items and Test Data |

    | ID | First name | Last name | Address |

    |---|---|---|---|n| 1 | Joe | Bloggs | 14 High Street |

    | 2 | Fred | Smith | 1 Sun Street |

    | 3 | Jane | Doe | 4 Love Lane |

    | 4 | Angus | McCoatup | 17 Lake Close |


    Note the ID column. This will not be used in this chapter, but you will have a
    use for it when you expand this example into the Contact Database case study in
    Chapter 17. Briefly, the ID field (or whatever you decide to call it) is a unique
    reference to each record (or row) in the database. This is needed, as certain
    operations on the database need to know precisely which record you are referring.
    For example, if you had to delete a record from the database, a unique ID would
    ensure the correct record and only the correct record is deleted. This is much
    better than a system where, for example, if you tried to delete a record for someone
    by the name of Smith, the database would not know which you meant and so probably
    delete them all. Of course, there are times you want to do something like that,
    but often you will want to pluck out a certain record, and that is the ID field,
    a unique key, is so useful.


    Another consideration of databases is that of data types. Not all data is text
    data. There are date and time fields (notorious for creating problems), Boolean
    fields (which are used as flags and contain values that signify yes or no, or
    on 1, 0, or True or False) and memo fields (which are able to hold large amounts
    of text).


    Finally, there are rules and default values. An example of a rule might be “allow
    zero length strings.” Default values are used to fill in a field with a value
    in the absence of a value coming back from a form.


    Databases can be very complex. You can have a large number of tables, many of
    which link to each other through a system of foreign keys that one table can give
    a lookup on another. This sort of database, and the complex SQL to do with it,
    are beyond the scope of this book, but as your experience and confidence in building
    simple applications grows, you will want to extend your knowledge in this area.'
  merge: -1
  pgno: 297
