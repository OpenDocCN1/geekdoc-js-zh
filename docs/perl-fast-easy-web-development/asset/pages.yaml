  md: '# Now you can create headings for passages of text in your Web pages, but note
    that in the previous example, the titles are all left-justified, that is, they
    are lined up with the left hand edge of the page. Sometimes, you might want to
    have a title or heading that is centered on the page.


    There are two ways of doing this—by using the <CENTER></CENTER> tags or the <DIV
    ALIGN=CENTER></DIV> tags. The <DIV> tag can be used for a number of purposes but
    here is used for centering text. The <CENTER> tag is a deprecated tag, and it
    is therefore preferable to use the <DIV> tag.


    > NOTE

    A deprecated tag is a tag that is not considered obsolete but is still supported
    by current versions of HTML and browsers but may be dropped from future versions.


    Notice that here, the DIV uses the ALIGN= parameter to perform positioning. This
    can also be used to position text (or images) to the left or to the right. As
    you would expect, the tags then read as <DIV ALIGN=LEFT></DIV> or <DIV ALIGN=RIGHT>.


