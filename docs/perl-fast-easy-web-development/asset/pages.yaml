  md: "# Program Flow in Perl\n\nFirst of all, let us discuss the program block. This\
    \ is a group of statements that are always executed one after the other. They\
    \ are wrapped in braces, like this:\n\n```\n{\n  statement one;\n  statement two;\n\
    \  statement three;\n  statement four;\n}\n```\n\nYou can nest a block of statements\
    \ inside another block. Note that although it makes no difference to the way a\
    \ program works, blocks of code are usually indented from the rest of the code\
    \ before and after them. This helps to make code more readable and to simplify\
    \ future maintenance. Blocks are usually found in loop constructs and IF statements,\
    \ and these too will be indented, again, to make the program easier to read.\n\
    \n# The If Statement\n\nThe if statement is one of Perl's selection statements.\
    \ It enables Perl to make decisions based on the values contained in variables.\n\
    \nThe if statement in Perl is similar to that in C, C++, and other languages.\n\
    \n```\nIf (condition)\n{\n  statement ...;\n  statement ...;\n}\\elsif\n{\n  statement\
    \ ...;\n  statement ...;\n}\\else\n{\n```"
