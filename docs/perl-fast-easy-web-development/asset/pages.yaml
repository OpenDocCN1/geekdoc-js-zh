    \ in order to help you understand the material in this chapter. You have just\
    \ started to scratch the surface of some of the built-in functions available in\
    \ Perl, though. There are many more, as you will see.\n\nFor now though, take\
    \ a look at another type of function—the subroutine.\n\n# Subroutines\n\nSubroutines\
    \ are very similar to functions, except they are user-defined functions. You can\
    \ go and write your own subroutines and when they are written, your program can\
    \ call them like it does a built-in Perl function. These days, the subroutine\
    \ is used interchangeably with function. However, so it is clear that you are\
    \ looking at sub-routines that you have written yourself, the distinction is maintained\
    \ in this text.\n\nSubroutines are created using the following syntax:\n\n```\n\
    Sub subroutine_name\n{\n    statement1 ...;\n    statement2 ...;\n    statement3\
    \ ...;\n    statement4 ...;\n}\n```\n\nThe subroutine is called in a similar way\
    \ to a function.\n\nSubroutine_name( );"
