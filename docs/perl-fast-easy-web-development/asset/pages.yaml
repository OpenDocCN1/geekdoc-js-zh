  md: '# Frames


    Before you start, a warning: use frames sparingly—they can make your site slower
    to load and they don''t always look the same in all browsers. However they do
    have their users. The most common purpose is to aid navigation.


    You have seen Web sites where you have a menu of options down the left side and
    perhaps a banner at the top of the screen. If you find when you scroll down the
    main screen the left side menu doesn''t move, this site has probably been created
    using frames.


    Frames (or "framesets," as collections of frames are called) are not part of any
    of the pages that you normally see. Rather, they are a container for the other
    frames that contain, for example, the menu banner and the main page that displays
    the site content selected from the menu. Such an arrangement would look like this.


    Of course, this is only one option. You can create frame layouts of any type you
    want to set up, but this is one of the most commonly used.


    ![](img/c880e5f7fac453846757b224a7e33f2d_199_0.png)


    > NOTE

    If you created a page that described the above layout and then tried to view it
    in a browser, you would see nothing. As I have already said, the frame page merely
    describes the frame layout that will contain the pages that fit into each frame.
    Those pages are set up separately as conventional HTML pages and are then loaded
    into the required frame.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'In summary, a frameset is a collection of frames designed to contain HTML pages,
    which are then displayed as one page in the browser.


    # Frame Tags


    There can be several frames in a frameset but more than two or three becomes impractical.
    For each frame, you specify the size of the frame. The frames effectively divide
    up page area that you see in the browser. This is achieved by specifying the width
    or height of each frame.


    To get the frames to look like you want them to appear at first, but it is logical.
    Honestly.


    ![](img/c880e5f7fac453846757b224a7e33f2d_200_0.png)


    Let''s copy the earlier "typical" frame design.


    Remember that you will need an HTML page to fit into each of the above frames.
    To fit in with the scheme, you can call them Banner.htm, Menu.htm, and Page1.htm.


    The coding needed to produce the frames page to achieve the layout is as follows:


    ```

    <HTML>

    <HEAD>

    <TITLE>Frames Demo</TITLE>

    </HEAD>

    <FRAMET ROWS="20%,80%" COLS="*" FRAMEBORDER="0">

    <FRAME SRC="banner.htm" NAME="banner">

    <FRAMET COLS="20%,80%" ROWS="*">

    <FRAME SRC="menu.htm" name="menu">

    <FRAME SRC="page1.htm" name="main">

    ```'
  merge: -1
  pgno: 200
