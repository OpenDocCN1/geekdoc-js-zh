  md: '# Another Diversion:

    JavaScript


    You know how to create a form and how to get the data sent by the form into your
    Perl program. But what if the data entered by the user is invalid? You can get
    your Perl program to return the form with an indication of what the problem is,
    but this is an inefficient way of checking the form data because each error discovered
    means that the page is re-sent over and over until the user has corrected all
    of his mistakes. Wouldn''t it be nice if you knew (as far as possible) that the
    data being received into your Perl program was okay?


    This is where JavaScript comes in. JavaScript can check your form data at the
    client (that is, within your Web page) and can prevent your form being submitted
    until all the errors in the entered data have been corrected. This means that
    you get instant notification of any errors and there is (hopefully) only one trip
    across the Internet for your form.


    In this chapter you will learn about:


    +   - Object orientation

    - JavaScript syntax

    - Using JavaScript to validate form data'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# A Few Notes about JavaScript


    JavaScript is an interpreted, object-oriented programming language developed for
    use in HTML Web pages (that is, client-side programming). Although it can also
    be used as a server-side programming language, we are not going to discuss that
    aspect of JavaScript here.


    JavaScript is similar in its syntax to Java and C++, and behaves in the much same
    way. However, JavaScript is not the same as Java. Java enables you to build full-blown,
    stand-alone applications; JavaScript does not. It simply reacts with objects within
    a Web page.


    # Object Orientation


    Object orientation attempts to bring the real world into programming. Real world
    objects (I''ll give an example of such an object soon) are represented as software
    objects. In theory, object-oriented programs are simpler, more reliable, and more
    closely model their real-world subjects.


    Object orientation should also be more efficient in terms of software creation,
    as you do not, in theory, have to keep re-writing things. Objects are described
    using what is known as a class. This class contains all the definitions of the
    data that are relevant to that object and all of the functions that operate upon
    that data. Classes can be reused and modified to suit a particular purpose without
    having to re-write things from scratch. This gives rise to a property known as
    inheritance.


    An example of a real-world object is a bank account. You could have a class describing
    such an account. The data for a bank account would include


    +   * Account number

    * Account name

    * Sort node

    * Balance


    These items describe the data contained within the description of the class.'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'Having decided upon the data that might be contained within a class, you now
    need to be able to manipulate these data items to read, write, update, and delete
    them. That is, to use the account you need to be able to


    +   * Open the account

    * Add funds

    * Debit funds

    * Close the account


    In a class definition you would write methods (know as functions in normal programming
    terms) to deal with each of these actions.


    With the definition of the object (in the form of a class) you can now create
    the bank account object itself; in fact you can create lots of them. Where ordinary
    languages might have arrays of integers and so on, in object-oriented languages
    you can have arrays of objects too. This is very powerful indeed. Imagine trying
    to keep track of loads of accounts in a normal procedural language.


    One of the main points of object orientation is that the data within an object
    can be set up to be accessed only via object''s methods. This helps to ensure
    the integrity of the data and reduces bugs. This feature is known as *data hiding*.


    Creating an object from the class definition is referred to as *instantiation*.


    A form of notation has been developed to help you describe the act of accessing
    the methods within an object. This is sometimes referred to as *dot notation*.
    For example, if you want to access the `add_funds()` method of an object you can
    write it as


    ```

    account.add_funds()

    ```


    Note the dot between `account` and `add_funds()` ().


    If you are with me so far, here is another twist.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# 312 CHAPTER 15: ANOTHER DIVERSION: JAVASCRIPT


    Having created your account class, you can now slightly change the purpose of
    the account. For example, you can have current accounts and savings accounts.
    The basic information that defines an account (account number, balance, and so
    on) can be held in a super class. Then other classes can inherit from this class
    and provide the more specific information that describes a particular type of
    account. This is an illustration of the potential flexibility of object orientation.
    This use of inheritance is an example of the much-discussed code re-use advantage
    of object-oriented languages.


    Let''s go for a silly example, and create a class called Animal.


    What data can you hold about an animal?


    +   - Carnivore (true/false)

    - Number of legs (integer)


    What methods (functions) could you have? Most animals make a sound of sort, so
    you could have a method called


    ```

    talk();

    ```


    This gives a basic animal class. You can inherit from this class and specialize
    into more specific subclasses. Your subclasses can inherit the basic methods from
    the superclass, or higher level class. So you can create a class for a cat and
    one for a dog, both based on the animal superclass but with their own specializations
    that describe the differences from the basic animal class.


    Now calling the talk() method for each object you create, such as dog.talk(),
    cat.talk(), causes an appropriate response from each object—the dog will bark
    and the cat will mew.


    This ability to produce an equivalent but appropriate response is known as polymorphism.
    Perhaps you can begin to see the possible uses of such behavior.


    An in-depth discussion about all the aspects of object orientation is beyond the
    scope of this book, but I hope that you can begin to see there are possible advantages
    of object orientation over conventional procedural programming. Now let''s turn
    back to discussing JavaScript.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Elements of JavaScript


    JavaScript uses objects. The HTML page that you might be on any particular time
    is referred to as the document object. There are many other objects as well, such
    as the window object, the form object, the form element object (containing the
    <INPUT TYPE...> elements), and the button object.


    Many of these objects produce events, that is, result of the user''s action or
    a change in the state of some element on a page or in a window. For example, clicking
    a button on a form triggers the onClick event. When you roll your mouse over an
    image you trigger the MouseOver event. You can attach JavaScript code to these
    events to cause to happen.


    As in other object-oriented languages, you use methods to cause something to happen
    to an object. Here is a simple example. If you want to move the cursor into a
    text field Surname on a form called MyForm1 you would write


    ```

    document.MyForm1.Surname.focus();

    ```


    Note the dot notation again. This means that the document object contains a form
    object called MyForm1, and object MyForm1 contains an object called Surname. The
    object called Surname has a method within it called Focus(), which is what is
    being called, or executed, in the example. So you have objects contained within
    objects, a bit like a Russian nesting doll.


    Also notice the parentheses at the end of the method name. These show that this
    is a method, but they are also used to pass parameters to methods that accept
    them. In our earlier bank account example, you might want to add funds. When you
    use the method to do this, you can write


    ```

    account1.addfunds(500.00)

    ```


    This means (in this example) you are adding $500.00 to account1.


    Much of the time, the parentheses following a method name are empty. Sometimes,
    as in the previous example, the parentheses are used to pass information to the
    method.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# 314 CHAPTER 15: ANOTHER DIVERSION: JAVASCRIPT


    So now you have an idea of how objects are used; you will start to build upon
    this with some examples. But before you do that, you must learn how to incorporate
    JavaScript into your Web pages.


    # Where Do You Put Your JavaScript?


    Now you have some idea of what JavaScript is all about, it is time to look at
    where to put it in. To tell the Web browser that you are using any kind of script,
    you have to use the <SCRIPT> tag. This is a general HTML tag and not anything
    to do with JavaScript itself. It is used to point out that some kind of script
    follows. The default script language (for IES at least) is JavaScript. So, if
    you want to use JavaScript, you should use


    ```

    <SCRIPT LANGUAGE="JavaScript>

    ```


    If you don''t specify the language, the browser is usually clever enough to recognize
    which language you are using, but does not assume anything.


    </SCRIPT> is used to end all script sections, whether they are VBS, JavaScript,
    or another language.


    Note also that there are several versions of JavaScript, so you might see:


    ```

    <SCRIPT LANGUAGE="JavaScript1.0>

    ```


    or


    ```

    <SCRIPT LANGUAGE="JavaScript1.1>

    ```


    or


    ```

    <SCRIPT LANGUAGE="JavaScript1.2>

    ```


    These versions offer more updated functionality, and you will need to become aware
    of the differences as you become more proficient at using JavaScript and want
    to extend the complexity of your scripts.'
  merge: -1
  pgno: 332
- img_proc: true
  md: "Another thing to remember is that you can place script either in the <BODY>\
    \ of an HTML document or in the <HEAD>.\n\nGenerally, you use JavaScript in the\
    \ body of a document if you want it to execute as the page loads. JavaScript placed\
