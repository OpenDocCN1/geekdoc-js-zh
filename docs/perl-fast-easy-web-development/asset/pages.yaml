    # Data Files


    You have already seen how to read data from and to write data to a file. But in
    that case, the data was simple strings of text. On most occasions your data will
    be more sophisticated than that. For example, a simple employee directory may
    store its data in separate fields for data items such as forename, surname, department,
    telephone number, and so on. How do you know which bit of data belongs in a file?


    You have to tell your program how to determine that. It''s not as daunting as
    it sounds. All you have to do is decide on a character to use as a field separator.
    Often, you will see the comma used for this purpose, but what if there are commas
    in the data? Just use a different character that is unlikely to appear in the
    data. You can use any character you like; in the following examples you will see
    the not (~) character used. It really doesn''t matter what you use as long as
    you use it to separate each data item from the next, and as long as that separator
    does not appear in the text.'
