  md: "# 1. Start your program in the usual way, and add the HTTP header here.\n\n\
    ```\n#!/perl/bin\n\nprint \"Content-type: text/html\\n\\n\";\n```\n\n# 2. Add\
    \ the following line to read the Form input into your Perl program:\n\n```\nread(STDIN,\
    \ $tempbuffer, $ENV{'CONTENT_LENGTH'});\n```\n\n![](img/c880e5f7fac453846757b224a7e33f2d_245_0.png)\n\
    \nThis line reads from STDIN.\nSTDIN is a reference to a built-in File Handler.\
    \ In this case, the data from your form is being placed into a temporary buffer,\
    \ called $tempbuffer, where you can access the data. The amount of data taken\
    \ from the form is arrived by using an environment variable CONTENT_LENGTH. So,\
    \ this line knows how much data to expect and places it into $tempbuffer.\n\n\
    ```\nmy @pairs = split(/\\n/, $tempbuffer);\nforeach my $pair (@pairs) {\n   \
    \ list($key, $value) = split(/=/, $pair);\n    print \"<font face='verdana' size='2'\
    \ color='blue'>$key: $value</font>\\n\";\n}\n```\n\n# 3. The data from the form\
    \ is held as a single item in $tempbuffer. To be of any use, you need to know\
    \ what the original field was and what value it contained. The next line does\
    \ this for you.\n\n```\n@pairs=split(/\\&/, $tempbuffer);\n```\n\nAn array, @pairs,\
    \ is used to contain the key value pairs from the form. This line of code uses\
    \ the split function to separate each key-value pair from all the other pairs\
    \ so you end up with an array of pairs containing a field and its associated value.\
    \ (Notice that each pair is separated from the next by an &; the split function\
    \ in this case uses this character to separate the data into discrete pairs.)\
    \ You are almost at the stage where you have something useful."
  merge: -1
  pgno: 245
- img_proc: true
