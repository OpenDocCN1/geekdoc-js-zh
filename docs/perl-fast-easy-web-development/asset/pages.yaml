- img_proc: true
  md: 'Conceptually, an array can be thought of as a number of “pigeon-holes,” each
    of which can separate items of data. As mentioned, each element shares a common
    name with all of the others, and uses a *subscript* (a sort of address) to determine
    which element in the array is being referenced.


    You will remember that the scalar variable is preceded by the dollar sign ($).
    The array uses a prefix to make it instantly recognizable just as the scalar variables
    do. Scalar variables use the $ sign as a prefix, whereas arrays use the @ sign
    instead, so that you can instantly recognize that it is an array in a program
    source code listing.


    > As in most programming languages, the first item in an array is element zero.
    I will mention this again as time goes on, and I''ll make no apology for doing
    so, as it cannot be emphasized enough. This concept can be the source of some
    confusing programming errors if you are not used to it.


    # Declaring Arrays


    You can declare an array prior to use, or you can load the array at the same time
    that you declare it.


    An example will illustrate the point.


    +   1. Open your editor and start a new program.'
