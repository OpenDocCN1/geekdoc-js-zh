  md: '# # 3

    # Perl Data Types: Scalars


    Perl has four built-in data types. They are scalars, arrays, hashes (also known
    as associative arrays) and references (used for file handles and so on). Scalars
    are basically single items of data. Arrays are lists of data accessed by means
    of a numeric subscript, and hashes are lists of data accessed via another scalar
    variable or literal; arrays and hashes will be covered in later chapters. A reference
    is a "pointer" to something else. For example, references are used as "file handles"
    in order to point to a file (you will examine files in Chapter 12, "Using Files
    in Perl").


    This chapter concerns the scalar data type in Perl. Specifically, you will learn
    about:


    +   - Scalar variables


    +   - Strings


    +   - Escape sequences for formatting'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Scalar Variables


    All scalar variable names are preceded by the dollar sign ($). So, for instance,
    the variable to hold the age of a person may be written as


    $age


    If you are not used to languages that use this kind of variable notation, you
    could easily forget the $ and find some strange errors creeping into your code.


    > NOTE

    Perl variable names are case sensitive. Case-sensitivity is common in modern languages,
    but do keep it in mind, as it can be the source of some frustration when debugging
    Perl programs.


    Scalar variables are variables that hold a single value. They can be integer,
    string, floating-point numbers (real numbers), or references. A reference scalar
    variable is a variable that simply holds the address of another variable; that
    is, it is a pointer to that variable.


    An integer scalar is simply a variable that holds a whole number:


    ```

    $age = 20;

    ```


    Of course, you can do all the things that you can normally do with a numeric variable.
    To demonstrate this and to show how you use simple arithmetic in Perl, try the
    following:


    +   1. Open your text editor.'
  merge: -1
