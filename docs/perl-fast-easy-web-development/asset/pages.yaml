    top of your Web browser, not in the Web page itself!) is coded as


    ```

    <HEAD>

    <TITLE>This is a Web

    Page</TITLE>

    ```


    # NOTE


    The <HEAD> tag opens the HTML page header. The <HEAD> is used to contain the title
    and other things as script code, for example, JavaScript, VBScript, and so on.
    You will see a little of this when you come to code forms.'
