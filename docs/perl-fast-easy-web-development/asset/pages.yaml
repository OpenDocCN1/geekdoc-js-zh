  md: '# FIRST LEVEL HEAD 117


    You will sometimes see odd implementations of for loops. Try this one:


    ```

    for(;;)

    {

    print "Perl Fast & easy \n";

    }

    ```


    This loop has no initialized variable, no test, and no update of any test variable,
    so it will loop forever. Often, this means that you don''t always know under what
    conditions the loop should terminate, and so this technique is sometimes used
    to allow you a different method of deciding when you should break out of the loop.
    An unusual use of this type of loop, but it serves to illustrate the flexibility
    of the Perl loop.


    We have discussed the data types used in Perl and given a few examples of how
    they can be used. You have also learned the syntax of some program flow processing
    elements of the Perl language. There is more to learn in these respects, and you
    will be extending your knowledge of the language as you need to. The rest of this
    book will provide much of that knowledge; your own experience and looking at the
    work of others (who were once where you are now) will fill in the gaps and extend
    your experience.'
