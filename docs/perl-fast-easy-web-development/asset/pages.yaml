  md: '# About the Author


    LES BATE is a Senior Analyst Programmer working for CSC at the British Aerospace
    (Airbus) site in Filton, Bristol, in the UK. He started out as a TV engineer for
    Visionhire in the West Midlands, England, spending many years at college learning
    about analogue and digital electronics before becoming a self-employed electronics
    engineer.


    Les later switched careers and moved into systems analysis and programming at
    British Aerospace. Originally working on mainframe batch and CICS programming,
    Les finally made the move into Lotus Notes development and from there to Web development.


    In 1998 he gained a BSc (Hons) in Computing from the University of the West of
    England, which he says opened totally new horizons for him in terms of technology
    and its application in computing.


    Les has used many of the currently available technologies, including C, C++, Perl,
    PHP, Java, JavaScript, VBScript, ASP, and HTML, and he enjoys exploring the possibilities
    that new technologies offer.


    In his spare time he messes around with electronics, plays the guitar (he says
    very badly!), and enjoys listening to music, traveling, and reading. He attributes
    his love for reading solely to the works of J.R.R. Tolkien.'
