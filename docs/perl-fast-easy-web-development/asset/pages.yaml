  md: '# What is a Function?


    A function is normally considered to be a section of code that performs a limited
    set of related actions. It might act upon a value (a number of values passed to
    it, called *arguments* or *parameters*), and it often returns a *result*. A function
    that does not return a result is often called a *subroutine*.


    To begin, take a look at some of the functions you can use in Perl, a few of which
    you have seen before in earlier chapters.


    # String Functions


    There are many string functions provided by Perl. In this chapter you will learn
    about the following:


    +   * chop()

    * chop()

    * length()

    * substr()

    * lc()

    * uc()

    * lcfirst()

    * ucfirst()


    # Chopping a String: chop()


    The chop function removes a character from the end of a scalar variable (in other
    words, it will work with numeric values as well as strings).


    The basic syntax for the chop function is


    ```

    $scalar_variable = chop($other_scalar_variable);

    ```'
  merge: -1
