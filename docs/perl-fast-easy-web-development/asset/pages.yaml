  md: '# 17

    Case Study: A Contact Database


    In this chapter you are going to see how all of the things you have learned so
    far can be brought together to demonstrate a complete Perl database-driven application.
    This application is a simple contacts database. You can, of course, modify it
    to do any number of different jobs including the ubiquitous Guest book. I think
    you will find many useful things to do with the techniques used in this application.


    In this chapter you will:


    +   - Create a home page

    - Use the listcontacts.pl program to read and list the contents of a database
    table

    - Use the editcontact.pl program to insert data in the database

    - Use the editcontact.pl program to load data into fields'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# The Requirements


    What are the requirements for a contacts database application?


    Very simply, you need to be able to:


    +   - Add a new contact

    - Update an existing contact

    - Delete a contact

    - List contacts


    Yes, there are variations and refinements that can be applied, but basically this
    is the core requirement of any database application. Everything else is a tweak
    (although some of the tweaks are very useful). I will mention some tweaks you
    might like to try at the end of this chapter.


    You know what you want to do with the database, so what data items might you be
    interested in? Here is a set to begin with.


    +   - First name

    - Middle name

    - Last name

    - Address (number, street, and so on)

    - Town/City

    - Post code/ZIP code

    - Telephone number

    - E-mail address


    This forms the basis of a useful set of information. There are other bits of information
    you want to store, and you can go back and add any extra bits you would like.
    Or, of course, you can change all the data and use the application for something
    else entirely.


    Now you know what we are going to do and what we are going to do it with. It''s'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# THE HOME PAGE 363


    time to visualize the application should look like, and how it should behave.
    When I say “look like,” I don’t mean aesthetically—that isn’t important, and it
    is something you can tinker with when you’re happy with your application. What
    I mean is how it is going to work.


    A good place to start is to imagine you are the user of the new application. What
    would you expect to see when the application started? How do you see new records
    being added and how should this work? How would you navigate around the system?
    In short, how can you best make your application friendlier and less cumbersome?


    A good starting point is draw out your ideas on paper and plan what your application
    is to consist of and how it hangs together, paying attention to navigation and
    to a logical sequence of events.


    ![](img/c880e5f7fac453846757b224a7e33f2d_381_0.png)


    Here is the approach I took for this simple application. I think this simple design
    is fairly self-explanatory. I have named the files to give you an idea of what
    they should be doing. The solid lines are links to the different parts of the
    application. The dotted lines are possible links that you might want to ease navigation.


    Now you can start putting together your application.


    # The Home Page


    A good place to start is with the home.htm page, which is a simple HTML page to
