    ![](img/c880e5f7fac453846757b224a7e33f2d_228_0.png)


    # # Check Boxes


    The check box is another type of input box. It is similar in principle to the
    radio button, except that it is designed for multiple choices—you have no doubt
    seen the online survey forms wherein you are asked to choose from a list of all
    the items that you like or agree with.


    Given the check boxes the same name does not change their behavior. it does make
    them a little more difficult to deal with, so it would make more sense to give
    them their own individual names. You can have a page full of check boxes and select
    few or as many as you want.


    Also, note that you deselect check boxes by clicking them again.


    ```

    <INPUT TYPE="CHECKBOX" NAME="selection1">

    ```


    Again, if you want to show this field already checked, then add the checked attribute.


    ```

    <INPUT TYPE="checkbox" NAME="choicel" checked>

    ```


    Here is an example similar to the previous one, but for check boxes instead.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# 1. As in the previous example, open your editor and start a new HTML file.


    # 2. Complete the usual HTML header.


    ```

    <html>

