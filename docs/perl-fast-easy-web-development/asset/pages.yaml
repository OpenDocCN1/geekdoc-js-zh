  md: '# Getting Started


    This first chapter will cover setting up Perl on your machine. The emphasis is
    here for Windows users, but there is no shortage of advice for setup on other
    platforms. See the useful URLs in Appendix B of this book, where you will find
    Web addresses for the Perl organization and for huge Perl resources supplying
    detailed advice, examples, and updates. When you are surfing the Internet, take
    a look at these sites—they really are awesome sources for all things Perl!


    Specifically, this chapter will cover:


    +   - Where to obtain Perl

    - How to Install Perl

