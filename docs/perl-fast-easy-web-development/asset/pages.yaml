  md: '# Arrays


    Arrays are simply collections of scalars. The array has a name much like the simple
    scalar does, but it also has a number of elements. Each element has the same name
    and is pointed at by a numeric subscript.


    In this chapter you will learn about:


    +   - Declaring arrays

    - Loading arrays

