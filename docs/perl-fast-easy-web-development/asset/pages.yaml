    Form manipulation is a very useful area in which to use CGI.pm. In my opinion,
    the most useful of all! However, there is one aspect that will interest you—the
    object-oriented mode of CGI.pm.


    # CGI.pm in Object-Oriented Mode


    Before we leave the subject of CGI.pm, there is a little more you should know
    about it. You have so far used CGI.pm in what is known as function-oriented mode.
    CGI.pm can also be used in an object-oriented way.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# CGI.PM IN OBJECT-ORIENTED MODE 355


    This has a few advantages:


    +   * If you treat CGI as a class, you can have more than one CGI object.

    * You can inherit from a CGI class and modify the resulting object''s behavior
    to suit your requirements.

    * Using CGI.pm in object-oriented mode uses less memory.

    * You can use parameters of tags generated by name, so you don''t have to learn
    the positional location of a parameter; you just name it and assign a value in
    any order you like.

    * You can save a CGI object to disk and reload it.


    However, the object-oriented mode is also more verbose, so it means more typing.


    Just for fun, let''s do a program similar to the last one (16-04.pl) in object-oriented
    mode and you''ll see what I mean.


    ![](img/c880e5f7fac453846757b224a7e33f2d_373_0.png)


    # 1. Start a new program in your editor.


    ```

    #!c:/perl/bin

    ```


    # 2. Import the CGI module.


    use CGI;


    # 3. With this, create a new CGI object; call the object q1.


    ```

    $q1 = new CGI;

    ```


    # 4. Call the header method of your new CGI object, q1.


    ```

    print $q1->header();

    ```'
