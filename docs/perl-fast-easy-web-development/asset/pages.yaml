  md: '# # Hashes


    Hashes are sometimes regarded as a difficult subject in Perl. This perception
    is largely due to the so-called “misleading and inconsistent” syntax. For this
    reason, the beginning of this short chapter includes a discussion of what hashes
    are and how you refer to them in Perl. Hopefully, you will see that hashes are
    not only useful, but also perfectly logical! You will then learn practice of how
    to use this powerful data structure. So, read on and bear with me; the short ride
    will be worth it.


    In this chapter you will learn what a hash is and how to use hash prefixes, as
    well as how to:


    +   - Initialize a hash

    - Create a hash

    - Load and search hashes

    - Remove keys from hashes'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# What are Hashes?


    Hashes (sometimes referred to as associative arrays) are similar to “normal” arrays
    in much as they are a list of scalar values. However, the way in which they are
    accessed is different—the mechanism utilizes “keys” rather than the simple numeric
    subscript. The important thing to remember about hashes is simply the order in
    which you quote or specify them, that is, the key and the value. In most other
    respects, hashes might be considered a bucket into which you can pour your data.


    Hashes have a prefix just like scalars and arrays do. For hashes, the prefix is
    the % symbol. This denotes, when used, that you are referring to the whole hash;
    if you want to access a single element of a hash you use the % prefix as you do
    with arrays. This might seem confusing until you consider that you are only referencing
    a single scalar within the hash; therefore, you use the scalar notation. Only
    when you are accessing the whole hash you use the hash % symbol.


    Hashes provide you with a useful lookup mechanism that is a bit like some database
    tables. A unique key is used to locate a given value. Hashes are uniformly fast;
    that is, hashes can grow large with little degradation in speed, and as long as
    your machine has the resources to cope with them, you can make them as large as
    you like!


    Hashes have many uses, not least in Web applications, where they are useful for
    handling input from HTML forms, CGI environment variables, and other elements,
    as you will see.


    # Hash Prefixes


    You have just learned that you refer to a hash using the % sign. You will also
    see the prefixes $ and @ used. Confusing? Well, actually it is quite simple. Always
    try to think what it is that you are doing with Perl, and all will become clear.


    For example, if you are trying to return a single item from a hash, you will see


    ```

    $item = $hashname{''keyvalue''}

    ```'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# INITIALIZING A HASH


    Notice that the hash is using the $ prefix. That makes sense doesn''t it? It does,
    because you are returning a single item, that is, a scalar. Similarly, when you
    want to return a number of values you use this:


    ```

    @arrayvalues = @hashname{''keyvalue1'', ''keyvalue2''}

    ```


    This means: return an array of item values from the given hash that correspond
    to (in case) the two key values supplied. You are returning more than one item,
    so you use the @ prefix. Why? You are returning more than one item into an array.


    Just to make it fun, you can do this even:


    ```

    @arrayvalues = @hashname{@arraykeys}

    ```


    Instead of supplying the keys in the braces (yes, those braces are not parentheses),
    you supply an array of keys. Still, you are returning a number of values just
    like in the previous example, so you use the hash name prefix by.


    Like a lot of things in Perl, at first sight might seem contradictory or illogical,
    but when you look at them and think about it, it all makes perfect sense. Perl
    does force you to think, but you realize that if it is logical, it will work in
    Perl. As you become more proficient in Perl, you will grow ideas of your own and
    you will be amazed to discover that your logical idea works just fine.


    You are now going to creating and manipulating hashes. It''s easier than it seems
    at first, I promise.


    # Initializing a Hash


    To initialize a hash, simply do this:


    ```

    %animals = ();

    ```


    You now have a hash called animals, with no keys or values.


    You will try this out in a moment, but let''s cover a few more simple hash operations
    first. You will begin by adding keys and values to a hash.'
  merge: -1
  pgno: 115
- img_proc: true
  md: "# Creating a Hash\n\nYou can add key-value pairs to a hash individually or\
    \ many at a time. To add elements to a hash you can do something like this:\n\n\
    ```\n$animals['Horse'] = 'Red Rum'\n```\n\nThis adds one key-value pair to the\
    \ hash animals. (Note the $ prefix. As you saw previously\n\nIf you want to add\
    \ several at once, you can do so in the following manner:\n\n```\n%animals = ('Red\
    \ Rum', 'Horse', 'Jaws', 'Shark', 'King Kong', 'Gorilla');\n```\n\nNow, this is\
    \ okay, but you have noticed what starts to happen as you read along the list?\
    \ As you go read the list, imagine what happens when you try to jump into the\
    \ middle of the list. With the subjects and names you're using here it is far\
    \ obvious which is a key and what is a value. However, in some cases this not\
    \ be quite so obvious, and Perl has another notation that helps you to determine\
    \ which is, no matter how long the list is. The notation is known as the comma-arrow\
    \ operator and looks like this:\n\n```\n%animals = (Horse => 'Red Rum', Shark\
    \ => 'Jaws', Gorilla => 'King Kong');\n```\n\nNow you can easily see that the\
    \ => operator is pointing from the key to that pair in the hash. Not only that,\
    \ but you can now add newline / carriage returns and other whitespace characters\
    \ and it will still work, so you can make your hash definitions more readable\
    \ in your programs by using one key-value pair per line,\n\n```\n%animals = (Horse\
    \ => 'Red Rum',\n  Shark => 'Jaws',\n  Gorilla => 'King Kong');\n```\n\nThis notation\
    \ is probably called the comma-arrow operator because the => replaces a comma\
    \ in the previous example. Whatever the reason, the comma-arrow operator makes\
    \ the pairs easier to identify.\n\nLet's load your first hash."
  merge: -1
