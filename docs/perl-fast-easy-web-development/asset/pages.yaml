  md: '# Other Operators


    Perl also supports the increment and decrement operators, as you discovered earlier;
    now you can take a look at them in a little more detail. These operators are a
    shorthand way of updating the value of a numeric variable.


    ```

    $counter++;      # This is the same as:      $counter = $counter + 1;

    $counter--;      # This is the same as:      $counter = $counter - 1;

    ```


    If you want to add more than one to a numeric variable, you can do the following.


    ```

    $counter+=5;      # This is the same as:      $counter = $counter + 5;

    ```


    Similarly:


    ```

    $counter-=5;      # This is the same as:      $counter = $counter - 5;

    ```


    This shorthand method of updating variables also works with other operators, as
    shown here:


    ```

    $counter %=5;      # This is the same as:      $counter = $counter % 5;

    ```


    (That is, divide $counter by 5, and then place the remainder into $counter.)


    ```

    $counter*=5;      # This is the same as:      $counter = $counter * 5;

    ```


    By way of a reminder, here is a little program to demonstrate these operators.'
  merge: -1
