  md: '# 264 CHAPTER 13: SENDING E-MAIL IN PERL


    > NOTE

    Of course, you can also transfer the other way, by highlighting files in the right
    window and clicking the left arrow button.


    You can select more than one file by holding down the Shift key as you click with
    the mouse to select a list of files that are grouped together in the list, or
    by using the Ctrl key as you click the mouse to select files that are not together
    in the list.


    Try transferring some files and you will soon see how easy WS-FTP is. Like most
    Windows-type tools, the easiest way to learn how to use them is to play with them
    and read the help screens.


    One thing to note is that you will want to transfer your Perl and HTML files as
    ASCII. Your images will be transferred as binary files. If you look at the bottom
    of the WS-FTP transfer screen, you will see radio buttons for ASCII and Binary.
    Select the appropriate one for the type of file you are transferring.


    > TIP

    The Auto button uses the file extension to determine whether to use binary transfer
    mode or ASCII. To set up the extensions in order to transfer files automatically,
    click the Options button, select the Extensions tab, then add all of the ASCII
    extensions you may want to use.


    There are lots of settings for you to play with in WS-FTP LE, but I will leave
    you to discover them yourself; I suggest you read the help documentation before
    changing any setting.


    # Sending E-mail Using SMTP in Perl


    Perl has a module Net that contains its networking functions. One of the components
    of Net is the SMTP module that contains all of the functions needed to send e-mail
    via an SMTP server. Try the example on the next page.'
