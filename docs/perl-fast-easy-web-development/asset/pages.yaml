- img_proc: true
  md: '# What Is Program Flow?


    Program flow is the property of a program that gives that program the capability
    to make decisions or do repetitive work. In programming logic, there are basically
    three program structures: sequence, selection, and iteration.


    # Sequence


    Sequence is a mode of programming in which a sequence of instructions is executed
    in the order in which the instructions are written until the program reaches the
    end. Most of the old assembly language programs were of this type (with a few
    "go to" statements or something similar thrown in).


    # Selection


    Selection is concerned with the route through a program dependent upon values
    presented to it or values calculated or derived within a program. In other words,
    when a program is executed, the statements that are executed are decided upon
    based on certain detaa. Some of that data might come from outside the program
    under consideration; other data might be the result of calculations occurring
    within the program.


    The main tools used in selection are variants of the IF and CASE statements.


    # Iteration


    Iteration is a fancy name for looping. Looping, when it is unintentional, can
    be a programmer''s nightmare. But it can also be very useful used correctly; for
    example, a loop construct can be used to process records in a file or database.


    There are a number of loop constructs, the most common in most languages are the
    for loop, the while loop, and the repeat loop.'
  merge: -1
