    ![](img/c880e5f7fac453846757b224a7e33f2d_95_0.png)


    # Logical Operators


    Finally, in your brief examination of operators, comes the logical operator. A
    logical operator is used to evaluate whether or not a condition being tested is
    true or false. You will often see True and False capitalized, as here, to emphasize
    that it is a logical, or Boolean, value.


    The term Boolean comes from the name of a mathematician, George Boole, who pioneered
    the rules of logical form of algebra. Computers rely on the logic to work, and
    so you will often come across the True (often represented by the value 1, but
    can be represented by any non-zero value) and False (often represented by the
    value zero).


    A numeric True value is any non-zero value, and therefore, numeric zero equates
    to False. So 1, 5, 7, 232, -175, and so on are all True. Only numeric zero is
    False. We can apply True/False checks to strings, too. The word Olympic is True,
    a string containing “0” is True, and a single empty space is True. Only the absence
    of any alphanumeric characters at all is False.'
  merge: -1
