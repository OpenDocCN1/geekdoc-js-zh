    # Color


    You can create HTML documents, you can create titles of different sizes and position
    them across the width of the page, and you can create text for the pages and render
    it bold, italicized, underlined, and so on. Unfortunately, it looks a bit boring
    because the text is all black on a white background. This would be even worse
