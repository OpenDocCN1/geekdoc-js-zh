  md: '# The Horizontal Rule Tag


    One other tag of interest at this point is the <HR> tag. HR stands for horizontal
    rule, and it gives a dividing line across the screen. It is not employed as often
    as it is used to be because authors who now favor more graphical methods, but
    it is useful as a simple page divider. Note that an end tag is not required.


    Modify an earlier page to show what HR looks like (it doesn''t matter which example
    you use, or whether you make up your own).


    The horizontal rule tag can be a very simple tag, as shown here:


    ```

    <HR>

    ```


    Or you can add other attributes to it such as its width as a percentage, like
    this:


    ```

    <HR WIDTH=75%>

    ```


    And you can even add a color attribute like this:


    ```

    <HR WIDTH=50 SIZE COLOR="#804040">

    ```


    ![](img/c880e5f7fac453846757b224a7e33f2d_185_0.png)


    +   1. Add the following to the second sample Web page (09-02.htm):

    <HR WIDTH=75%>

    It is just a simple demonstration<BR>

    <HR>

    Here is some more text<BR>

    <HR WIDTH=500 SIZE="#804040">


    +   2. Also add <DIV ALIGN=CENTER> before the first line of text and </DIV> before
    the </BODY> tag.


    +   3. Save this example as 09-07.htm.'
