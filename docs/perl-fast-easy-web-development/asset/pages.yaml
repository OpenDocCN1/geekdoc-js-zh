  md: '# CHAPTER 13: SENDING E-MAIL IN PERL


    # 5. Now open the Sendmail program.


    open (SENDMAIL, " \$sendmailpath -t") or die "Cannot open \$sendmail: $";


    ![](img/c880e5f7fac453846757b224a7e33f2d_292_0.png)


    Note the pipe symbol (\|) before the \$sendmailpath variable. This tells sendmail
    that its input can be taken from STDIN, which is the default input stream.


    The option -t is added to the Sendmail command. This simply tells Sendmail to
    scan for To, CC, and BCC data.


    Also note the use of the die option and the use of the \$ variable to report (hopefully)
    some meaningful information in the event of an error.


