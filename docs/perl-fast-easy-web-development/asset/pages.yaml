  md: '# CGI: Making the Connection


    You now know the basics of Perl—you know how variables work, you can build forms,
    and you even know what you can do with data after you get it onto the server.
    You can build an HTML page, and you have learned how to provide navigation through
    hyperlinks, how to add color, and how to build forms to capture data from users.
    You have even learned about environment variables and how useful they might be.


    What you have not learned yet is how the information gets from your form into
    your Perl program on the Web server. Now you''ll see how to make the connection
    from HTML form to Perl script.


    In this chapter you will:


    +   - Examine how data is received from forms

    - Learn how to use HTML tables

    - Learn how to get form data via the GET and POST methods'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Receiving Data from Forms


    As always, the best way to demonstrate the you use forms is way of a simple example.
    But first, you should learn about another feature of HTML: tables. This is a good
    time to discuss HTML tables, as they are very useful for creating neat format
    layouts!


    # HTML Tables


    HTML tables are used to (amongst other things) format the contents of a Web page.
    In this section you''ll learn how to use them to make a Web input HTML form look
    prettier. Tables are not essential for forms—but they do them look better. You
    can use spaces (&nbsp;) and breaks (&lt;BR&gt;) to position the elements on the
    page, but it probably wouldnt look very good.


    As you would expect, a table starts with the <TABLE> tag. The <TABLE> tag has
    a number of attributes; for example, you can use background = imageName.jpg to
    set the background image of a table, just like you did for the <BODY> tag. In
    the same way, you can set the background color using the bgcolor attribute.


    You can set the width of the table using the width=nnn or width=nn% attributes
    of the table tag, rather like the width attribute of the <HR>, horizontal rule
    tag.


    A typical table tag might look like this:


    ```

    <table width=600 bgcolor=lightblue>

    ```


    This code says to create a table 600 pixels in width with a light blue background
    color. Simple enough, isn''t it?


    A table achieves its aims by being what you would expect it to be: a table of
    rows and columns into which you can place the elements, pictures, or text you
    choose.


    At the top of a table, you can have an optional "header" row, intended for like
    titles. A header row looks like this:


    ```

    <<tr><th width=200>Column Title 1</th><th width=200>Column Title 2</th><th width=200>Column
    Title 3</th><tr>

    ```


    ![](img/c880e5f7fac453846757b224a7e33f2d_240_0.png)'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# RECEIVING DATA FROM FORMS 223


    The <tr> tag signifies the start of a table row. The <th> tag defines a table
    header for a column, in this case the width of the header, and therefore the whole
    column has been fixed at 200 pixels (again, percentages could be used). The </tr>
    tag closes this header. In this example, there are three identical headers containing
    three column titles for the table.


    Note that although the width of the headers is set in this example to 200 pixels,
    the title between the <th> and </tr> tags exceeds 200-pixel width, the column
    will stretch (that is, any cells directly beneath the header tag stretch) to accommodate
    the text, image, or whatever you choose to place within it.


    At the end of the headers, the row is closed using the </tr> tag.


    Following rows can contain what HTML data. The format of the data rows is very
    similar to the header row, except that the individual cells are defined by <td>
    instead of the <th> tag of the header row. A header row or a data row can also
    have its own width tags, background color tags, and so on.


    A data row may look like this:


    ```

    <tr><td>Column Title 1</td><td>Column Title 2</td><td>Column Title 3</td></tr>

    ```


    An HTML table can contain many rows of data, which is, as you will see, very useful
    in Web-based applications.


    Each <td> or <th> tag can have its own background color, bgcolor, width, and height
    attributes. They can also have tags for aligning the contents of the cell. Horizontal,
    alignment can be specified as left, center, or right. Vertically, alignment can
    be specified as top, middle, or bottom. So for example, a <td> tag can have its
    alignment attributes specified this thus:


    ```

    <td align="center" valign="top">

    ```


    Note that the valign and height attributes can also be added to the <tr> tag.


    The HTML table is closed, as you would expect, using the </table> tag.


    The following form example shows how a table is used to position the form elements
    to produce a neat layout.'
  merge: -1
