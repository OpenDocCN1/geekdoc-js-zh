  md: '# Escape Sequences For Formatting


    You have already used the print function in Perl. And you recently learned about
    the use of an escape character \n to give a newline character—that is, to force
    a line break and move the text cursor to the next line, and \t to give a tab character.


    In Chapter 2 you saw a short table of escape sequences. There are a number of
    other escape sequences that provide text formatting. See Table 3.1 for a more
    complete list of these common escape sequences.


    TABLE 3.1 Escape Sequences

    | Escape codes | Meaning |

    |---|---|

    | \b | Backspace |

    | \n | Newline |

    | \r | Carriage return (go to the beginning of the line) |

    | \t | Tab |

    | \b | Backspace |

    | \u | Convert the next character to uppercase |

    | \U | Convert the following characters to uppercase |

    | \ | Convert the next character to lowercase |

    | \L | Convert the following characters to lowercase |

    | \\ | Display a backslash |

    | \'' | Display a single quote |

    | \" | Display a double quote |

    | \E | End an U or L effect |


    Note that the backslash can also be used for purposes other than text formatting.
    For example, what if you want to display a string such as \n or even just a \
    ?'
