    # 13. You should have something like this.


    There are a couple of things to note here. The SRC= attribute gives the name of
    the file and the path to the file if it is not in the same folder as the HTML
    file. The image file could even be at another location, in which case you could
    give the full URL. If the image file is in a folder called Images below the current
