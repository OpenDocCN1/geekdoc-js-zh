    validation. But before we go any further, let us briefly re-visit the object discussion.
    All things in JavaScript are regarded as objects. An HTML page is called a document
    object. As you learned short time ago, a form is another object that lives inside
    a document object and has a name by which you can refer to it. Therefore, you
    refer to a form that has a NAME="addrecord" attribute like this.


    ```

    document.addrecord

    ```


    Note the dot!


    This is not a complete statement yet, but it means "go to the form addrecord contained
    within the document."


    Any fields in the form are referred to in a similar way. So, if you have a field
    called surname, like this:


    ```

    <INPUT TYPE=TEXT NAME="surname*>

