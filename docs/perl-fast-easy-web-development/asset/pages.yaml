  md: '# 210 CHAPTER 10: CGI PROGRAMMING


    +   10. Type the address to your new HTML file in the address box of your browser
    and press the Enter key.


    You should see a result like this.


    +   11. Play with the radio buttons and observe the effect.


    +   12. Change the names of the radio button attributes and see how they no longer
