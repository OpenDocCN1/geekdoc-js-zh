    You should see something similar to this.


    # Drop-Down Boxes


    For drop-boxes you use the <SELECT> tag. The select tag is a little different
    from the others in that it is not a variation on the <input type=> type tag.


    A typical select tag looks like this:


    ```

    <SELECT NAME="country">

    <OPTION value="UK">UK</OPTION>

    <OPTION value="USA">USA</OPTION>

    <OPTION value="France">France</OPTION>

    <OPTION value="Germany">Germany</OPTION>

    </SELECT>

    ```


    The select tag has embedded within it a number of option tags. Each option tag
    holds one option. The value clause of the option statement is the value that is
    actually used by the form. The text immediately before the option tag is the text
    that is actually displayed on the page, although often the two will be the same.


    If you want to show one of the options as preselected when the page loads, include
    the selected attribute within the option tag.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'You can also specify a size for the select tag, but this looks confusing to
    the user. But you can use the size tag when you add the multiple attribute to
    the select tag. This tells the select tag that you can select more than one option.
    The user does this by holding down the Ctrl key and then clicking more options
    with the mouse. You can also select a block of options by clicking the first option,
    moving down the select list until you get to the end of the block you want to
    select, and finally holding down the Shift key and clicking the last item. All
    the selections in the block are then selected and turn blue.


    You can now use the size attribute of the select tag. The size attribute determines
    how many options are visible.


    Try the following to see an example of both types of select tags.


    # 1. Open your editor.


    # 2. Start a new file.


    ![](img/c880e5f7fac453846757b224a7e33f2d_231_0.png)


