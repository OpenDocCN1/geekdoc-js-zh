  md: '# # 9

    A Diversion: HTML


    In order to use Perl for the Web, you have to know the main language of the Web,
    HTML. This chapter is bit of a diversion into HTML for those who don''t have any
    experience with it (or for those who use WYSIWYG editors). Even if you do prefer
    to use point and click editors, an understanding of HTML is useful if you want
    to know what is really going on in an application.


    If you''re already familiar with HTML, you can skip this chapter. If you have
    never seen any HTML, then read on. If you are unsure, treat it as a refresher
    course—we all need those from time to time!


    In this chapter you will learn how to:


    +   - Write an HTML document

    - Add headers and color

    - Add images and hyperlinks

    - Add frames'
