  md: '# The length() Function


    The length() function returns the length of a scalar variable. The syntax for
    the length function is


    ```

    $size = length($variable);

    ```


    For example, the following code:


    ```

    $variable = "fred";

    $size = length($variable);

    print "The length of \size = $size";

    ```


    would display


    ```

    The length of $size = 4

    ```


    # The reverse() Function


    The reverse() function takes an array as its argument, and returns an array in
    the order of the elements has been reversed. The syntax is


    ```

    @reversedarray = reverse (@startarray);

    ```


    So, if you do this


    ```

    @startarray = (A .. K);

    @reversedarray = reverse (@startarray );

    print "Array = @reversedarray \n";

    ```


    Then you will see


    ```

    K J I H G F E D C B A

    ```'
  merge: -1
  pgno: 414
- img_proc: true
  md: '# The index() Function


    The index() function finds the position of the first occurrence of another string.
    By default, it starts at the leftmost character of the string being searched.
    If you add a third optional parameter, the function will start at the location
    in this parameter.


    The syntax is as follows:


    ```

    $position = index($teststring, $substring);

    ```


    Or


    ```

    $position = index($teststring, $substring, $startposition);

    ```


    So, for example


    ```

    $teststring = "Perl Fast & Easy Web Development";n$position = index($teststring,
    "Web");

    print "The position of \Web\" in \teststring is: $position \n";

    ```


    will display


    The position of "Web" in $teststring is: 17;


    > NOTE

    The first location in the string is 0. If the substring being searched is not
    found, the function will return the value -1.


    # The rindex() Function


    The rindex() function finds the rightmost position of the first occurrence of
    another string. That is, it searches the string backwards. In all other respects,
    this function is the same as the index() function.'
  merge: -1
  pgno: 415
