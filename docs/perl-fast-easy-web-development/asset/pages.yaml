  md: "The until loop is very similar to the while loop. As the names of these loops\
    \ suggest, the while loop continues to loop while a given condition is satisfied,\
    \ whereas the until loop continues to loop until a condition arises.\n\nHere is\
    \ an example with both types of loops.\n\n+   1. Start a new program in your editor.\n\
    \n+   2. Announce what you are going to do (this is optional, of course).\n\n\
    print \"The While Loop:\\n\";\n\n![](img/c880e5f7fac453846757b224a7e33f2d_130_0.png)\n\
    \n+   3. Initialize a variable (\\$loopcounter) to 1.\n\n$loopcounter = 1;\n\n\
    +   4. Use the while loop code to demonstrate its operation.\n\n```\nwhile ($loopcounter\
    \ < 10)\n{\n    print *loop count =\n    $loopcounter++\n}\n```\n\n+   5. Reset\
    \ the counter variable, \\$loopcounter, to 1.\n\n$loopcounter = 1;\n\n+   6. Again,\
    \ announce what you are going to do (optional).\n\nprint \"\\n\\nThe Until Loop:\\\
    n\";\n\n+   7. Use the until loop code on the next page to demonstrate its operation."
