  md: '![](img/c880e5f7fac453846757b224a7e33f2d_93_0.png)


    The comparison decided that the two strings were the same.


    The reason for this is that == is a numeric comparison operator, and so Perl will
    interpret $string1 and $string2 as numeric variables. Because Perl will be unable
    to evaluate them as numbers, they will be set to zero. Therefore, both variables
    are numerically equal and so the test is passed and the string "Those two names
    are the same!" is printed.


    For this reason, Perl has a different set of comparison operators for strings.


    +   * **eq.** Equal to

    * **ne.** Not equal to

    * **it.** Less than

    * **gt.** Greater than

    * **le.** Less than or equal to

    * **ge.** Greater than or equal to


    These operators are used in a similar manner to the numeric ones, but obviously
    only with string variables.


    Here is an identical program, except you will be using the string eq comparison
    operator, and there is an else option to catch the result; otherwise you would
    have no output.


