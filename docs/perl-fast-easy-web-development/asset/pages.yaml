    # JavaScript Variables


    As do all other languages, JavaScript uses variables to store information. Variables
    can be created on-the-fly as and when you need them, but it is a good idea to
    create them at the beginning of your script so that it is easier to follow, and
    you know where to look for them. To create a variable you use the *var* keyword.


    ```

    var age;

    var name;

    ```


    And so on.


    To assign a value to a variable you use the assignment operator, =


    ```

    age = 17;

    name = "fred";

    ```


    JavaScript statements end with a semicolon. JavaScript, like most modern languages,
    is *free format*, that is, it can be split over many lines if desired, usually
    to aid readability. It uses the semicolon to indicate the end of a statement,
    a form of notation borrowed from C++ and Java (and of course, Perl) languages.'
