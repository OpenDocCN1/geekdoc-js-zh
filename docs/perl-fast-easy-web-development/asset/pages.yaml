    # Print Formatting


    Before you can achieve anything very exciting with your Perl print statements,
    you must take a small diversion. You will revisit the subject again later, in
    Chapter 3, but it''s worthwhile to learn a little bit about print (screen display)
    formatting so that you can use it in the early sample code snippets without getting
    too confused.


    Output to the screen can be formatted using the built-in “escape sequences.” Table
    2.1 lists some common escape codes.


    | TABLE 2.1 Common Escape Codes |

    | Escape code | Meaning or effect |

    | \n | Inserts a newline character |

    | \t | Inserts a tab character |

    | \r | Go back to the beginning of the current line (that is, carriage return
    but no newline) |

    | \ This is how you add a backslash to the output string (otherwise, it would
    "escape" the next character. |

    | " | As above but for double quotes |

    | \'' | As above but for single quotes |

    | \$ | This is needed to stop Perl interpreting $ for the beginning of a variable.
    |'
