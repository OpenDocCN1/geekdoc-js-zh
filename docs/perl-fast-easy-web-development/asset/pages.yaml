    $convertinglc = lc($stringupper);

    print "\nusing lc gives: \$convertinglc\n";

    $convertingucfirst = ucfirst($stringlower);

    print "\nusing ucfirst gives: \$convertingucfirst\n";

    $convertinglcfirst = lcfirst($stringupper);

