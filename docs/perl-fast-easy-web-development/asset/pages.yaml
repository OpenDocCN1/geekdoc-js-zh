- img_proc: true
  md: '# Where Can I Get Perl?


    Perl is available from a number of sources. The best known are http://www.activestate.com
    and http://www.perl.com.


    I advise you not to download a "development version" of Perl, as doing so may
    cause some confusion if you get any errors. Development versions of software are,
    as not final, fully debugged versions and may have bugs that could lead you to
    think that you had made a mistake in your code. For this reason, development versions
    of Perl are often referred to as "unstable." When you are more experienced in
    the use of Perl you may want to try development versions, in order to make use
    of new facilities provided, but until then it is best to stick to the "stable"
    version.


    In addition to downloading Perl, you might want to look around at some of the
    resources available for Perl developers. Some useful Internet sites are given,
    and here are more in Appendix B.


    ![](img/c880e5f7fac453846757b224a7e33f2d_20_0.png)


    +   - http://www.activestate.com/

    - http://www.perl.com/

    - http://www.perl.org/


    These sites will keep you up-to-date with what is happening in the world of Perl
    and will provide you with invaluable resources for techniques, coding ideas, and
    loads of news about the Perl language and those who use it. Perl is a natural
    language for the Internet, so it is equally natural that you will find lots of


    ongoing support for this powerful and much respected language on the World Wide
    Web and News Groups, email lists, and bulletin boards.'
  merge: -1
