- img_proc: true
  md: '# Opening Files in Perl


    Before you can do anything with a file, you need to open it. This is done using
    the Perl open function. The general syntax for the open function is


    ```

    Open(MYFILE, "testfile.dat") || die "Error encountered when opening file ...";

    ```


    This means that Perl will attempt to open a file whose file handle is MYFILE.
    A file handle is a reference variable that is used to store the internal name
    of the file, that is, the name by which the Perl program will recognize the file.


    Following the file handle is the real name of the file; in this example, testfile.dat.


    Notice in the line of code that the next thing on the line is a double pipe. This
    is the OR operator and is used here to execute whatever it follows if the file
    open code fails. In other words, if for any reason the file cannot be opened by
    Perl, code following the || symbol will be executed.


    The code after the double pipe OR operator simply says


    ```

    die "Error encountered when opening file ...";

    ```


    The die function then stops the program running after displaying the message "Error
    encountered when opening file...",


    A general error message in itself isn''t very helpful. However, Perl also has
    a special error variable that holds the error message for an event such as this.
    This is the $ variable. You can now add this variable to the die error message:


    ```

    Open(MYFILE, "testfile.dat") || die "Error encountered when opening file ...$";

    ```


    As you would be unable to do anything when a file is successfully opened, trying
    an example would be a bit pointless right now. The next step is to read a file
    so that you can see the open function in action and see how data is read from
    a file. If you want to, you can rename the input file so that the program cannot
    find it, and then try out the die function and error message.'
  merge: -1
  pgno: 254
- img_proc: true
  md: "# Reading Data from a File\n\nData may be read from a file in Perl using the\
    \ angle operator, < > To get a line of data, you simply wrap the file handle in\
    \ the angle operator like this:\n\n```\n$dataline = <MYDATA>;\n```\n\nThis will\
    \ take any data from MYDATA (testfile.dat) and store it into $dataline. The data\
    \ will stop when a newline character is encountered.\n\nThe end of a file is recognized\
    \ when the file handle returns “undefined.” To so read and display the whole contents\
    \ of a file you can do this:\n\n```\nwhile(defined($dataline<MYFILE>))\n{\n  \
    \  print \"$dataline <br>\";\n}\n```\n\nThis can be simplified still further if\
    \ you do not have any other conditions in the while statement. The while statement\
    \ will execute while the conditions in the following parentheses are True. The\
    \ condition “undefined” of the file handle is effectively False.\n\nTherefore,\
    \ you can now say\n\n```\nwhile(<MYFILE>)\n{\n    print;\n}\n```\n\nNote that\
    \ now, unless you had <BR> tags at the end of your lines of data in the file,\
    \ the data would all be joined together. Of course, you could put a separate print\
    \ line after the empty one to provide the <br> tag.\n\n```\nwhile(<MYFILE>)\n\
    {\n    print;\n    print \"<br>\";\n}\n```"
  merge: -1
  pgno: 255
