- img_proc: true
  md: '# HTML FORMS


    ![](img/c880e5f7fac453846757b224a7e33f2d_221_0.png)


    You should see this.


    Keep this program handy because it is useful to see what environment variable
    does. You will want to use many of them when you start to build your own Web applications.


    Your Perl Web applications are beginning to get just a little more interesting.
    But what can you do with them? You can find out information about the client browser
    and so on, but there is something missing.


    # HTML Forms


    To make Web applications really useful, you have to be able to “talk” to them—to
    send them data and to get data back. You can get data back using the print HTML
    type statements we have already used. But how do you send data? To do this you
    need a little more HTML than we have covered so far. You need HTML forms.


    # NOTE


    Before you go any further, create a folder called myhtml under the wwwroot folder
    if you have not done so already. It will be useful for the examples you are about
    to try.


    HTML forms allow users to interact with Web sites by entering data which can be
    used to populate a database or file, or perhaps to send an email to the owner
    of the site. Forms make Web pages useful! Using forms, you can collect information
    from users of your site and give them the information they want and need.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# What Are Forms?


    If you are to build anything other than a flat HTML site; that is, if you want
    the page to do something other than display text and images, you have to connect
    the page to some storage mechanism. This would enable you to store data so that
    you can capture data from users and send data to a user''s Web browser.


    Normally, data is held in databases or files. If your page is to be able to manipulate
    data of some kind then you must be able to enter data in some way—this entry mechanism
    is the form.


    The form has a number of elements, described in Table 10.1.


    | TABLE 10.1 Form elements and their purposes |

    | Element | Purpose |

    | --- | --- |

    | Text | Enables entry of short strings. |

    | Textarea | Enables the entry of longer strings occupying a number of lines of
    text. |

    | Radio Button | A "one of n" choice selection mechanism. |

    | Check Box | A true/false indicator—a box with a tick or an X when selected.
    |

    | Select Boxes | A pull-down list of options from which one (or more) options
    can be selected. |

    | Hidden | A text box where the box is not visible on the page. It is often used
    to carry data that the user does not need to see. |

    | Password | Similar to a text box, but represents each character with an asterisk
    as the user types. |

    | Submit Button | A button that enables the data entered into the form to be transferred
    to the processing mechanism. |

    | Reset Button | A button that clears all data from the form so that the user
    can begin again. |


    The form itself is defined using the <FORM> </FORM> tags and within them are tags
    to represent all of the data needed.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'Here is a typical FORM tag:


    ```

    <FORM NAME="myform" METHOD="POST" ACTION="/scripts/myscript.pl">

    ```


    The NAME attribute enables elements within the form to be referenced by scripts
    within the page, as JavaScript, VBScript, and so on. You''ll learn more about
    JavaScript in Chapter 15.


    METHOD usually is set to either "POST" or "GET." This is a method of sending data
    to a script or other program.


    # METHOD="GET"


    Data sent by the GET method is sent along with the URL to the script all as one
    string. You might have noticed, when filling in a form on the Internet, something
    like this in the URL location box of the browser:


    ```

    http://www.somedomain.com/scripts/ascript.exe?dataitem1=value

    ```


    Note the question mark separating the name of the script from the data that follows
    it.


    The main disadvantages of this method are that the data that is being passed can
    be easily seen and also the length of the data string is limited.


    # METHOD="POST"


    This method sends the data to the "standard input" of the program to which the
    data is being sent. Programmers, especially those who have written software in
    C++, and so on, will understand what this means. Suffice to say that this is a
    standard method of getting data into a program.


    The main advantage of this method is that the amount of data that can be transferred
    is unlimited.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# ACTION


    The ACTION is the attribute that describes the location and the name of the script
    or to be executed. It will be something like


    ```

    /scripts/myprogram.pl

    ```


    Of course, you can use a program that lives elsewhere, perhaps on another server
    at another domain, in which case you can use the full syntax for the program like
    this:


    ```

    http://www.mydomain.net/scripts/myprogram.pl

    ```


    # Using the Form


    Place the tags you need to represent all of the data to be collected by the form
    between the <FORM> and </FORM> tags.


    You will now look at some typical tags used to describe the data input fields.
    Almost all fields in an HTML form are of the INPUT tag type.


    > NOTE

    Tag names in the following text will appear both capitalized (example: SELECT)
    and all lowercase (example: select). In the early days of HTML it was a convention
    to always uppercase HTML tags. In recent years, it has become the convention to
    use lowercase characters through an HTML document, probably because HTML (or the
    programs that generate the HTML) is now often coded by programmers who are used
    to using lowercase in languages such as C, C++, Java, and so on. You should get
    used to seeing tag names written both ways.


    # Text Fields


    The text field is probably the most commonly used. Often, almost all fields on
    forms are of this type. They give you the usual rectangular input box that takes
    a single line of text.'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'The HTML code for the text field looks like this:


    ```

    <INPUT TYPE="TEXT" NAME="surname" SIZE="30" MAXLENGTH="25">

    ```


    The size attribute is optional and determines the size of the box in characters.


    The MAXLENGTH attribute is also optional, and is used when you want to limit the
    amount of text that can be typed into the box. In this case, the limit has been
    set to 25 characters.


    # Password Fields


    The password field is, in most respects, the same as the text field. The main
    difference is that text typed into a password field cannot be seen. Each character
    entered is replaced by an asterisk.


    The HTML code for a typical password field would look like this:


    ```

    <INPUT TYPE="Password" NAME="pwd">

    ```


    Obviously, the password field is useful for login type functions in Web applications.


    # Hidden Fields


    Hidden fields are also very similar to text fields. The main difference is that
    you cannot see the field on the Web page at all. You might think pretty useless,
    but it''s very handy for quietly passing data from one page to another page or
    to a Perl CGI program.


    The HTML code for a typical hidden field would look like this:


    ```

    <INPUT TYPE="hidden" NAME="secret" value=3000>

    ```


    # Radio Buttons


    The radio button gets its name from the old radios with the mechanical selection
    buttons for waveband. You used to press the button and any previously selected
    buttons would pop out. These radio buttons behave in a logically similar way.
    They are'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'round in appearance (on most browsers.); if there are several of them and you
    select one by clicking it with the mouse, any previously selected buttons will
    be deselected.


    The syntax of the radio button is


    ```

    <INPUT TYPE="RADIO" NAME="choice1">

    ```


    If you want this type of field to be already selected, you add the SELECTED attribute.


    ```

    <INPUT TYPE="RADIO" NAME="choice1" SELECTED>

    ```


    The radio button can also have a value like this:


    ```

    <INPUT TYPE="RADIO" NAME="choice1" value="1">

    ```


    Here is a very simple HTML example just so that you get the idea.


    # 1. Open your editor.


    ![](img/c880e5f7fac453846757b224a7e33f2d_226_0.png)


    # 2. Start an HTML page like this:


    ```

    <html>

    <head>

    <title>Radio Button Demo()</title>

    <head>

    ```


    # 3. Open the body of the Web page.


    ```

    <body>

    ```


    # 4. Now start the form. Because you


    are not going to use this with a CGI program, you do not need an action or a method
    attribute.


    ```

    <form name=radiotest>

    ```'
  merge: -1
  pgno: 226
- img_proc: true
