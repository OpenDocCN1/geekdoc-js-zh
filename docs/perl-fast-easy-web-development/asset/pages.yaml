- img_proc: true
  md: '# What Is CGI?


    Let''s have a quick overview of what the Web server does. Normally, the Web server
    receives a request, as it is known, from the user''s Web browser. That is, the
    user requests a page from a Web site. The Web server receives the request, the
    page, and returns it to the browser. The browser renders the page using the HTML
    tags we talked about earlier to format the page on the user''s screen.


    ![](img/c880e5f7fac453846757b224a7e33f2d_210_0.png)


    The setup then is a bit like this. This is fine for HTML pages, but what happens
    when you want your Web page to use a Perl program to update a database? A Web
    server cannot handle that by itself. When such a request arrives at the Web server
    it is passed to other external


    software. This is achieved through the Common Gateway Interface; and this is what
    CGI programming is all about.


    # CGI Processing


    So now the set up looks like this.


    The CGI box shown can consist of many things. For instance, if you intend to use
    ASP for your Web applications, any requests for an ASP page will be diverted to
    the program asp.dll. But of most interest right now is Perl; requests for Perl
    scripts or


    ![](img/c880e5f7fac453846757b224a7e33f2d_210_1.png)


    programs are passed to perl.exe. In Chapter 1 you installed Perl on your machine,
    so now you should be all ready to go.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# What Can I Do with CGI?


    CGI programming allows you to do almost any Web-based task you could ever want
    to do with a Perl CGI program.


    There are some rules for using Perl to talk to its Web surroundings that you''ll
    need to learn. There are also some features of CGI itself to learn that you will
    find useful.


    # A Simple Perl CGI Program


    At last you are going to try a real CGI program. You are going to write a very
    simple Perl program to display the IP address of your machine on a Web page.


    > NOTE

    An IP address is the network address of your PC. Every computer connected to the
    Internet has an IP address. An IP address looks like: 121.236.157.53. That is,
    four sets of numbers separated by dots (periods). The Internet uses names to find
    Web addresses, but these names are converted into IP addresses by Domain Name
    Servers (DNS), computers whose job it is to carry out this conversion so that
    computers can find each other.


    In Chapter 1, you learned about the Web server and how to set up Web sites. You
    also learned about the cgi-bin, or scripts folder. You will be putting your Perl
    program in the scripts if you are using Microsoft Personal Web Server or into
    the cgi-bin folder if you are using a UNIX machine and something like Apache Web
    Server (an excellent choice).


    Of course, if your ISP enables you to run your own Perl scripts, find out them
    where you should put your scripts and if there are any do''s and don''ts for your
    Web space. You will use the 127.0.0.1 address to access your Web pages from your
    Web browser. Remember though, that if you choose to host your programs on your
    ISP Web space, you will use an address like:


    http://www.mydomain.com/scripts/'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# 194 CHAPTER 10: CGI PROGRAMMING


    for the Perl code, and something like:


    http://www.mydomain.com/


    for the HTML.


    Of course, if your IP address is static (that is, it doesn''t change—most of them
    do)

    Then you can use that instead of your domain name.


    To create your first Perl CGI program, follow these steps, paying careful attention

    to the actual coding to make sure don''t leave out any code or make any types.


    ![](img/c880e5f7fac453846757b224a7e33f2d_212_0.png)


    +   1. Open your editor, creating a new file.


    +   2. Start with the usual shebang statement (you still need it for CGI programs).


    +   3. Now enter the following line:


    ```

    print "Content-type: text/html\n\n";

    ```


    This line tells the Web server what kind of data is being sent.

    In this case, you are telling the


    server that this is going to be an HTML document, which is a subtype of a text
    document (hence the text/html part).


    Note the two newline characters. These are very important—they are not for cosmetic
    purposes. The Content-type: text/html statement must be followed by two newline
    characters; otherwise, your program will not work and you will get a message telling
    you that you sent back incomplete headers or something similar.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# A SIMPLE PERL CGI PROGRAM 195


    # 4. You have told the server to expect some HTML, now you you can send it some.


    Use print statements as you did for the console programs you wrote earlier when
    you were learning some Perl examples, but now embedding them within them.


    ```

    <html>

    print "Content-type: text/html\n";

    print "<html>";

    print "<title>First Perl Test</title>";

    print "Your address is: $ENV{REMOTE_HOST}";

    print "<body>";

    print "</html>";

    ```


    ```

    <html>

    print "<head>"

    print "<title>First Perl Test</title>"

    print "</head>"

    print "<body>";

    ```


    All of this is standard HTML; it''s wrapped in Print statements so that Perl will
    send it to the Web server. The text enclosed in the quotes of the print statements
    will be received by the Web server as ordinary HTML and so will be returned to
    your browser in the normal way.


    # 5. Now you are going to do something different. Enter the following line exactly
    as shown:


    "Your IP address is: $ENV{REMOTE_HOST}";


    The above statement says: Print the following text (the following is an environment
    variable).


    The environment variable you want to display is one called REMOTE_HOST.


    > NOTE\Environment variables are variables that contain information about the
    server and the client (your Web browser). This information can be very useful
    when it comes to writing Web applications.'
  merge: -1
