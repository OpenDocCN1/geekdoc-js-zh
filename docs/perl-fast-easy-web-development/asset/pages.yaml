  md: '# # 16

    The CGI.pm Module


    In this book, you have so far learned (amongst other things) about Perl, HTML,
    and how to create HTML from Perl. This has been useful, as learning about how
    to create HTML on-the-fly from Perl has reinforced the HTML that you have learned.
    In this chapter you''ll learn a little about a module called CGI.pm, which simplifies
    the creation of HTML from Perl.


    Specifically, you''ll learn:


    +   - What CGI.pm does

    - How to start and end an HTML page with CGI.pm

    - How to use forms with CGI.pm

    - How to use CGI.pm in object-oriented mode'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# What’s the Idea Behind the CGI.pm Module?


    The CGI.pm module attempts to simplify and formalize the functions used in CGI
    applications. Some of the actions that need to be taken in the execution of CGI
    programs are not intuitive, and the reason for the necessity of some of them is
    lost in the mists of time—way back in the 1990s!


    Perl is a powerful language and yet it still is simply to perform some obscure
    gymnastics to do some things that should be fairly easy. The truth is that the
    existing technologies have moved on and some new technologies have arrived, in
    many cases, we still have primitive mechanisms available to us to access these
    technologies.


    You have seen how tedious it is to send headers (`print "Content-type:text/html
    \n\";`) and how cumbersome it can be to get data back from forms. The CGI.pm module
    is intended to simplify all of this and provide an interface into the CGI functions
    and enable you to create HTML forms and back-end CGI scripts much more quickly
    and easily. There are many functions available in the CGI.pm module, and in this
    chapter you are going to learn some of the most commonly used.


    To use the CGI.pm functions, you must import the CGI.pm module methods. You do
    this by using the following statement; this statement makes the functions contained
    within the CGI.pm module available within your program:


    ```

    use CGI qw(:standard);

    ```


    The qw is a simple way of wrapping :standard in quotes.


    You can also use


    ```

    use CGI '':standard'';

    ```


    The ‘standard’ refers to the standard set of functions, so that you can use a
    less long-winding way of referring to functions.


    The best way to learn some of these theses CGI.pm functions quickly is by example,
    let’s get right on with it.


    ![](img/c880e5f7fac453846757b224a7e33f2d_360_0.png)'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Starting and Ending an HTML Page with CGI.pm


    Starting and ending a page using conventional HTML is not difficult. You can use
    the Perl print statement to create the HTML line by line (a bit tedious) or you
    can use the document as described in Appendix A, "More Perl Functions," or as
    demonstrated in Chapter 17, "Case Study: A Contact Database."


    Try this:


    +   1. Open your editor and start a new Perl program.


    ```

    #!:/perl/bin

    ```


    +   2. Include the CGI.pm module using the use statement.


    ```

    use CGI '':standard''

    ```


    ![](img/c880e5f7fac453846757b224a7e33f2d_361_0.png)


    +   3. Add a print statement passing the functions as parameters.


    +   4. First add the header () function.


    print header(),


    This creates the <HTML><HEAD>. Note the comma--you haven''t finished yet.


    +   5. Insert a title into the header. This is the title that appears on the title
    bar at the top of the browser.


    ```

    start_html(-title=>''Perl Fast & Easy!'')

    ```'
