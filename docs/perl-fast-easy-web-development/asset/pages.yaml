    # Spaces


    The Web browser only notices the first space character it encounters. If you place
    three spaces between words, one space will be displayed but any subsequent spaces
    will be ignored. To overcome this problem you must enter an HTML non-breaking
    space. This is not an HTML tag, but an escape code:


    ```

    &nbsp;

    ```


    It is called an escape code (or escape sequence) because it causes the system
    to escape from the current process, carry out the code, and return to the system.
    The & character starts the escape and the semicolon signifies the end of the code.


    You can group a number of &nbsp; codes together to move a piece of text further
    along a line, giving another form of simple text formatting. There are much better
    ways, but this method has its uses.


    Once again, modify your HTML code to add &nbsp; escape codes.


    +   1. Open the previous HTML page in your editor.'
