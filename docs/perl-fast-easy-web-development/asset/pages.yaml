  md: '# Fonts in HTML


    So now you can set background colors and position headings of various sizes where
    you want them on the page. But what about “normal” text?


    You can do a lot with that too, using the <FONT></FONT> tag. With <FONT> you can
    set the size, typeface, and color, and of course you can again combine the <FONT>
    tag with any of the other text formatting tags.


    A typical font tag looks like this:


    ```

    <FONT FACE=classname SIZE=n#xxxx>here is some text</FONT>

    ```


    Try modifying the previous HTML page to include some <FONT> settings; you can
    then combine them with some of the other tags you learned about earlier.


    Here are some examples for you to add to your HTML page.


    ```

    <FONT FACE="arial" SIZE="2" COLOR=#80040>This is funny reddish arial text</FONT><BR>

    <FONT FACE="Tahoma" SIZE="5" COLOR=#FF000>This is red tahoma text</FONT><BR>

    <FONT FACE="arial" SIZE="3" COLOR=#0000FF><B>This is the medium sized blue bold
    text</B></FONT><BR>

    <FONT FACE="New Roman" SIZE="1" COLOR=green\><I>This is tiny green New Roman italic
    text</I></FONT><BR>

    <FONT FACE="arial" SIZE="7" COLOR=#000000><B>This is large black arial bold italic
    text</I></B></FONT><BR>

    <FONT FACE="Courier" SIZE="6" COLOR="White\><U>This is fairly white Courier underlined
    text</U></FONT><BR>

    ```'
