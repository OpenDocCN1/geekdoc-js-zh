    # substr() Function


    The substring() function enables you to extract a partial string from another
    string.

    The syntax is as follows:


    ```

    Substr($wholstring, offset, length, $replacementstring);

    ```


    This means inspect $wholstring (which can be a variable or a literal), starting
    at offset position, for a length of length, and replace the substring if found
    with the contents of $replacementstring (which can also be a literal).


    So the following:


    ```

    $wholstring = "Cats are cute";n$substring = substr($wholstring, 0, 4, "Dogs");

    print $substring;

    ```


    will you give you


    Cats are cute'
