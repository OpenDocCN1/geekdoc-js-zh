    <br> tag does not have a closing tag. It is an empty tag. It does not require
    a closing tag. Let''s see what it displays in the browser.![](image_rsrc1U3.jpg)This
    is how I wanted the text.<h1> and other heading tagsTo give headings and subheadings,
    HTML provides the heading tags. They include <h1>, <h2>, <h3>, <h4>, <h5>, and
    <h6>. The size is the only difference between each of these tags.![](image_rsrc1U4.jpg)Lines
    5 to 10 contain different types of headings.![](image_rsrc1U5.jpg)The <h1> has
    the largest size while the <h6> has the smallest.These tags are meant to provide
    headings and subheadings in a webpage. Headings are different from paragraphs.
    They are bold and big. But that does not mean we should use them between paragraphs
    to make the text bold or big. Use these tags efficiently.Summary●       The <p>
    tags are used to write paragraphs.●       Each paragraph starts with a new line.●     
    To add a new line within a paragraph, use the <br> tag. This tag does not have
    any closing tag.●      There are six tags for headings. Each of them differs in
    size.●       Never use the heading tags between the paragraphs.Chapter 4: Text
    formattingWhile adding text in an HTML document, you may need to define special
    meaning for some parts. By special meaning, I mean, pointing out a part of the
    text that appears different.HTML provides several tags for formatting the text.<b>
    and <strong> tagsThe <b> tag defines bold text.![](image_rsrc1U6.jpg)In the paragraph,
    one word, i.e. ''name'' is enclosed within the <b> tag.![](image_rsrc1U7.jpg)The
    text enclosed within the <b> tag is bold now. Similarly, there is another tag
    that behaves in the same. It is called the <strong> tag. But, the <strong> also
    defines that the text has extra importance.![](image_rsrc1U8.jpg)Let''s see what
    happens when the text is enclosed within the <strong> tag.![](image_rsrc1U9.jpg)You
    may not find any difference between <b> and <strong>, but the strong text has
    an extra meaning while the bold don''t.<i> and <em> tagsThe <i> tag defines italic
    text.![](image_rsrc1UA.jpg)In the paragraph, one word, i.e. ''name'' is enclosed
    within the <i> tag.![](image_rsrc1UB.jpg)Similarly, there is another tag, <em>,
    which also define italic text, but with extra importance.![](image_rsrc1UC.jpg)Let''s
    see what happens when the text is enclosed within the <em> tag.![](image_rsrc1UD.jpg)There
    does not appear any difference, but the text within the <em> tag has extra importance,
    similar to the <strong> tag.<small> tagSometimes, you may need to define a text
    in a small size when compared to other text. The <small> tag in HTML define small
    text.![](image_rsrc1UE.jpg)![](image_rsrc1UF.jpg)You can see, the word - ''name'',
    appears smaller than the rest of the text.<del> tagDid you ever cut a word or
    sentence while writing? Similarly, HTML provides the <del> tag to present a deleted
    or removed text.![](image_rsrc1UG.jpg)![](image_rsrc1UH.jpg)<mark> tagHighlighting
    is one of the most common ways of pointing out a subtext from a text. In HTML,
    highlighting or marking text can be achieved by using the <mark> tag.![](image_rsrc1UJ.jpg)![](image_rsrc1UK.jpg)The
    highlighted text is visible in yellow.<sub> and <sup> tagsThe <sub> tag defines
    subscripted text while the <sup> tag defines superscripted text.![](image_rsrc1UM.jpg)![](image_rsrc1UN.jpg)Summary●     
    The <b> and <strong> tag defines bold text but the <strong> tag also means extra
    importance.●      The <i> and <em> tag defines italic text but the <em> tag also
