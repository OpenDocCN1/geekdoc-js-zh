    a new <h1> element is created. Now, we need to place this newly created element
    right before the <p> tag, but before it, we need to locate the <div> tag because
    the <p> tag exists in it.The insertBefore() method is invoked using the div and,
    both the elements are passed to this method.Before the button is clicked:![](image_rsrc21S.jpg)After
    the button is clicked:![](image_rsrc21T.jpg)document.createAttribute()We can also
    create a new attribute for an existing element as well as for a newly created
    element.Suppose, there is a paragraph and on the button click, a class attribute
    with CSS is applied to it.![](image_rsrc21U.jpg)First, the <p> tag is located
    using the document.getElementById() method. Next, we create a class attribute
    using the document.createAttribute() method, and then assigned a value to it.
    The class is already defined in the head section.As of now, we have created an
    attribute but it is not added the <p> tag. To do this, we need to use the setAttributeNode()
    method.![](image_rsrc21V.jpg)Before the button is clicked:![](image_rsrc21W.jpg)After
    the button is clicked:![](image_rsrc21X.jpg)remove()The remove() method is used
    to remove an element from an HTML document.![](image_rsrc21Y.jpg)The <p> tag is
    located using the document.getElementById() method and then, it is used to invoke
    the remove() method.Before the button is clicked:![](image_rsrc21Z.jpg)After the
    button is clicked:![](image_rsrc220.jpg)Summary●       The document.createElement()
    method is used to create a new element.●      To create a text node, use document.createTextNode()
    method and to assign a value to an element, use the innerHTML property with document.createElement()
    method.●      The appendChild() method is used to append a new element as the
    last child node of an existing node.●      The insertBefore() method is used to
    insert a new element right before an existing element.●      A new attribute can
    be created using the document.createAttribute() method while its value can be
    assigned using the setAttributeNode() method.●       To remove an existing element,
    use the remove() method.'
