- fmt: "\n# Web Development For beginners\n\n## Chapter 1: Websites\nToday, the internet\
    \ is accessible in almost every part of the world. In the last two decades, the\
    \ internet and web have grown rapidly, so the websites. If you go two decades\
    \ back, the websites were very different. They were not at all attractive, of\
    \ course, and most importantly, they were static. By static, I mean everything\
    \ on a web page was fixed. But nowadays, websites are dynamic, generated by web\
    \ applications.\n\n### Static and dynamic websites\nIn a static website, everything\
    \ is fixed until someone changes it manually from behind. Such websites are created\
    \ using `HTML` and are the most straightforward part of website development. All\
    \ the users visiting a static website have the same view. But the content on a\
    \ dynamic website can be different for every user. For example, `amazon's homepage\
    \ is a bit different for a signed-in user and a non-signed in user. If you are\
    \ not signed in, you cannot see your account information, order history, and other\
    \ stuff. It appears only when you sign in with your credentials.\n\nA dynamic\
    \ website is linked with at least one database where all the dynamic information\
    \ is stored. There is no such database in the case of static websites. User-interaction\
    \ is another essential part of a dynamic website.\n\nThe main focus of this book\
    \ is on the development part. There are many differences. As I mentioned earlier,\
    \ `HTML` is used to create a static website. `HTML` is one of the core technologies\
    \ of the World Wide Web(WWW). The other two technologies are `CSS` and `JavaScript`.\
    \ You can also use `CSS` and `JavaScript` on a static website to make it more\
    \ attractive and a bit intractable. But the central concept, i.e. data is fixed\
    \ and does not change. But using these three technologies more effectively, especially,\
    \ `JavaScript` can create beautiful and high performing dynamic websites.\n\n\
    Don't worry; We will discuss all these three technologies in depth after this\
    \ chapter. But before moving further, let's talk `HTML`, `CSS`, and `JavaScript`\
    \ in brief so you can have an idea of what you are going to learn.\n\n### HTML\n\
    `HTML` stands for `Hypertext Markup Language`. It does not matter how big or complicated\
    \ your website is going to be; you will always start with `HTML`. It is the standard\
    \ language to create structures for the web. While `CSS` and `Javascript` have\
    \ changed a lot over the years, `HTML` of the 1990s and 2010s is not much different.\n\
    \nThe basic structure of a web page is created using `HTML`. There are several\
    \ `HTML` elements, and they are the building block of these pages. `HTML` elements\
    \ are used in the form of tags. The tags are angular brackets with `HTML` names\
    \ written inside them. For example, the `HTML` tag for image is `<img/>`. Most\
    \ of these tags have a closing tag like `<p>` and `</p>`. However, some tags,\
    \ such as `<img/>` does not require a closing tag. `CSS` and `JavaScript` are\
    \ further applied to `HTML` to change its appearance and to make it dynamic, respectively.\n\
    \n### CSS\n`Cascading Style Sheets` or commonly known as `CSS` is the presentation\
    \ part of a web page. `HTML` creates a structure, and `CSS` converts it into an\
    \ attractive and more readable version. No website is complete without `CSS` today.\
    \ Users expect a website to be appealing, engaging, and above all, properly readable.\n\
    \nWith `CSS`, you can change the font, color, size, positions, layouts, and many\
    \ more things. There are multiple ways of using `CSS` in an `HTML` file, each\
    \ having its own advantage.\n\n### JavaScript\n`JavaScript` is considered the\
    \ most crucial part of a website. It is the most popular language of the year\
    \ 2019 according to StackOverflow insights. Well, most of the websites you visit\
    \ are created using `javascript`.\n\nIt is a scripting language that is used on\
    \ client-side as well as server-side. Earlier, `javascript` can only run in a\
    \ browser, but with the introduction of `node.js`, it can run outside too. Web\
    \ frameworks and libraries such as `Angular`, `React`, `Vue` are built using `javascript`.\
    \ As `node.js`, it is also used to create backend services.\n\n#### Summary\n\
    - There are two types of websites - static and dynamic.\n- Static websites have\
    \ fixed content that does not change.\n- Content in a dynamic website can change,\
    \ either by users or automatically for different users.\n- `HTML`, `CSS`, and\
    \ `JavaScript` are the three core technologies of the World Wide Web(WWW).\n-\
    \ `HTML` elements are accessed using angular brackets, or commonly known as tags.\
    \ These tags are used to create the structure for a web page.\n- `CSS` is used\
    \ to enhance the appearance of a web page.\n- `JavaScript` is a scripting language\
    \ that plays a vital role in developing dynamic websites. It is used for user\
    \ interaction, content management, manipulating databases, and many more.\n\n\
    ## Chapter 2: Understanding HTML elements, tags, and attributes\nAs discussed\
    \ in the last chapter, `HTML` elements are the building blocks of a web page.\
    \ These elements are enclosed in angular brackets. Many `HTML` tags have corresponding\
    \ closing tags. There are also a few tags that do not require closing tags. We\
    \ will discuss all these tags in the upcoming chapter, but first, you need to\
    \ understand how `HTML` tags work.\n\n### Basic HTML tags\nLet's start with the\
    \ most basic tag, i.e. `<html>` tag. Every HTML document starts with `<html>`\
    \ tag and ends with its corresponding closing tag, `</html>`. Other HTML tags\
    \ are nested inside this only. Other two basic HTML tags are `<head>` and `<body>`\
    \ tags. `HTML` files can render in a browser. The visible part in the browser\
    \ is written inside the `<body>` tag. It can contain several elements, such as\
    \ paragraphs, headings, videos, divisions, etc. Another basic tag is the `<head>`\
    \ tag. All the information regarding the document is listed in the `<head>` tag.\
    \ It include HTML tags such as `<link>`, `<title>`, `<style>`, etc. In the early\
    \ versions, the `<head>` tag was mandatory but in HTML5, it can be omitted.\n\n\
    ### HTML attributes\nAll the HTML tags are built for a specific purpose. For example,\
    \ the `<p>` is used for paragraphs and `<img>` is used for images. Most of the\
    \ HTML tags have additional properties or characteristics that defined by attributes.\
    \ A tag may or not have mandatory attributes. The `<img>` tag, for example, must\
    \ contain `src` and `alt` attributes. Further, you can place `height` and `width`\
    \ attributes, but they are not mandatory. A `<img>` tag is defined with two attributes\
    \ - `src` and `alt`. Value for an attribute is written inside double quotes. As\
    \ now, these two attributes have any values.\n\n### Closing and opening tags\n\
    As I mentioned above, Many tags have closing tags. The difference between the\
    \ opening and closing tags is that the closing tag has a forward slash. Some tags\
    \ such as `<img/>` have a forward slash within itself.\n\n### <!DOCTYPE html\n\
    You can run HTML documents in a browser. The `<html>` tag defines that, it is\
    \ an HTML document. But the browser needs to interpret the type of file. `<!DOCTYPE\
    \ html>` is the declaration that it is an HTML document. `<!DOCTYPE html>` is\
    \ not an HTML tag. You must declare it at the top of every HTML document. Also,\
    \ to create an HTML file, you should save the file with `.html` extension.\n\n\
    #### Summary\n- The `<html>` tag is used to define an HTML document that contains\
    \ other tags.\n- The content of an HTML document is defined inside the `<body>`\
    \ tag.\n- The `<head>` tag has all the information regarding the document.\n-\
    \ The attributes define additional properties or characteristics for an HTML tag.\n\
    - The closing tag has a forward slash in it.\n- Declare `<!DOCTYPE html>` at the\
    \ top and always save the file with `.html`.\n\n## Chapter 3: Paragraphs and headings\n\
    We can add a variety of content in an HTML document. The most common content you\
    \ can find on any web page is the simple text. The text can be in any form or\
    \ style. We can create paragraphs of any length, headings of any size, and you\
    \ can change color, font size, background-color.\n\nA paragraph in HTML is added\
    \ using the `<p>` tag. For headings, we have multiple tags. These include `<h1>`,\
    \ `<h2>`, `<h3>`, `<h4>`, `<h5>`, and `<h6>`, each of them having a different\
    \ size.\n\n### <p> tag\nA paragraph is a block of text that is created using the\
    \ `<p>` tag. It has the corresponding closing tag on line line while the content\
    \ is written between the tags. Let's check in the browser. The content inside\
    \ the tags is displayed on the browser. Let's add a couple of more paragraphs\
    \ below it. Now, there are three paragraphs in the document. Remember, each paragraph\
    \ starts from a new line.\n\n### Line break\nSo each paragraph starts from a new\
    \ line. But what if you want to add a new line inside a particular paragraph.\
    \ Suppose we have the following text: My name is Tommy. I am 25 years old. I belong\
    \ to London, England. I came to USA for higher studies. I graduated from Harvard\
    \ university in 2016. The lines 6, 7, and 8 have new lines. Do you think it will\
    \ display correctly in the browser?! It does not display the text in the same\
    \ format as written in the `<p>` tag. Why? The reason is simple. It does not matter\
    \ how we format the text in the `<p>` tag. It will always consider the whole content\
    \ of a `<p>` tag as a single paragraph. To add a new line, HTML provides the `<br>`\
    \ tag. Just place the tag at the end of the line where you want a new line to\
    \ start. You can see, the `<br>` tag does not have a closing tag. It is an empty\
    \ tag. It does not require a closing tag. Let's see what it displays in the browser.\
    \ This is how I wanted the text.\n\n### <h1> and other heading tags\nTo give headings\
    \ and subheadings, HTML provides the heading tags. They include `<h1>`, `<h2>`,\
    \ `<h3>`, `<h4>`, `<h5>`, and `<h6>`. The size is the only difference between\
    \ each of these tags. Lines 5 to 10 contain different types of headings. The `<h1>`\
    \ has the largest size while `<h6>` has the smallest. These tags are meant to\
    \ provide headings and subheadings in a webpage. Headings are different from paragraphs.\
    \ They are bold and big. But that does not mean we should use them between paragraphs\
    \ to make the text bold or big. Use these tags efficiently.\n\n#### Summary\n\
    - The `<p>` tags are used to write paragraphs.\n- Each paragraph starts with a\
    \ new line.\n- To add a new line within a paragraph, use the `<br>` tag. This\
    \ tag does not have any closing tag.\n- There are six tags for headings. Each\
    \ of them differs in size.\n- Never use the heading tags between paragraphs.\n\
    \n## Chapter 4: Text formatting\nWhile adding text in an HTML document, you may\
    \ need to define special meaning for some parts. By special meaning, I mean pointing\
    \ out a part of the text that appears different. HTML provides several tags for\
    \ formatting the text.\n\n### <b> and <strong>\nThe `<b>` tag defines bold text.\
    \ In the paragraph, one word, 'name' is enclosed within the `<b>` tag. The text\
    \ enclosed within the `<b>` tag is bold now. Similarly, there is another tag that\
    \ behaves in the same. It is called `<strong>`. But the `<strong>` also defines\
    \ that the text has extra importance. You may not find any difference between\
    \ `<b>` and `<strong>`, but the strong text has an extra meaning.\n\n### <i> and\
    \ <em>\nThe `<i>` tag defines italic text. In the paragraph, one word, 'name'\
    \ is enclosed within the `<i>` tag. Similarly, there is another tag, `<em>`, which\
    \ also define italic text, but with extra importance. Let's see what happens when\
    \ the text is enclosed within the `<em>` tag. There does not appear any difference,\
    \ but the text within the `<em>` tag is similar to `<i>`.\n\n### <small>\nSometimes,\
    \ you may need to define a text in a small size when compared to other text. The\
    \ `<small>` tag in HTML define small text. You can see, the word 'name', appears\
    \ smaller than the rest of the text.\n\n### <del>\nDid you ever cut a word or\
    \ sentence? Similarly, HTML provides the `<del>` tag to present a deleted or removed\
    \ text.\n\n### <mark>\nHighlighting is one of the most common ways of pointing\
    \ out a subtext from a text. In HTML, highlighting or marking text can be achieved\
    \ using the `<mark>` tag. The highlighted text is visible in yellow.\n\n### <sub>\
    \ and <sup>\nThe `<sub>` tag defines subscripted text while the `<sup>` tag defines\
    \ superscripted text.\n\n#### Summary\n- `<b>` and `<strong>` define bold text,\
    \ but `<strong>` also means extra importance.\n- `<i>` and `<em>` define italic\
    \ text, but `<em>` also means extra importance.\n- `<small>` defines a smaller\
    \ text.\n- `<del>` is used to represent a deleted or removed text.\n- `<mark>`\
    \ defines highlighted or marked text in yellow.\n- `<sub>` and `<sup>` define\
    \ subscripted and superscripted text respectively.\n\n## Chapter 5: Hyperlinks\n\
    There are multiple web pages on a website, right? We can navigate from one page\
    \ to another. The links in HTML allow a user to navigate from one web page to\
    \ another. Such links in HTML are called hyperlinks. `<a>` is used to create hyperlinks\
    \ in HTML. In this chapter, we will discuss how to use the `<a>` tag to move from\
    \ one HTML document or web page to another.\n\n### <a> tag\nThe `<a>` tag has\
    \ few attributes. One of these attributes - `href`, is a mandatory attribute that\
    \ holds the link of the document or web page that will open when clicked. Observe\
    \ the syntax of the `<a>` tag. The URL should be written within the quotes. The\
    \ text will appear on the screen and when clicked on it, the URL specified for\
    \ the `href` attribute will open. Observe the following HTML code. In the paragraph,\
    \ the word - 'here' is a hyperlink. The `href` is `https://google.com`. This means\
    \ the homepage of Google will open when clicked on the hyperlink. Did you notice\
    \ something different with the appearance of the hyperlink? It is underlined and\
    \ blue. There is way to remove this styling using CSS. We will discuss it later\
    \ in the CSS section. You can also move locally from one HTML document to another.\
    \ In the `href` attribute, you have to provide the proper path for the document\
    \ you want to navigate. In the above `<a>` tag, the name of a document is specified\
    \ that happens to be in the same folder. Clicking on the hyperlink will open the\
    \ `demo.html` document.\n\n### target attribute\nThe `target` attribute is an\
    \ optional attribute of the `<a>` tag. It specifies where to open the document\
    \ or web page. It can have the following values:\n- `_self`: To open the document\
    \ or web page in the same tab/window. The target is set to `_self` by default.\n\
    - `_blank`: To open the document or web page in a new tab/window.\n- `_top`: To\
    \ open the document or web page in the full body of the window.\n- `_parent`:\
    \ To open the document or web page in the parent frame.\nYou can also provide\
    \ a `framename` as the value of the `target` attribute to open the document in\
    \ a particular frame. The hyperlink in the above paragraph will open in a new\
    \ tab/window.\n\n### title attribute\nThe `title` attribute provides a title for\
    \ a hyperlink. Whenever the mouse hovers over the hyperlink, it will display a\
    \ text which is called the `title`. By default, it does not show anything. The\
    \ title is usually extra information about the hyperlink in a very short form.\n\
    \n### More with <a> tag\nThe `<a>` tag is not limited to text. You can also use\
    \ images and buttons as hyperlinks. Even, you can use a part of an image as a\
    \ hyperlink.\n\n#### Summary\n- The `<a>` tag in HTML is used to create hyperlinks.\n\
    - The `href` attribute is mandatory because it holds the URL of the document or\
    \ web page.\n- The `target` attribute specifies where the document or web page\
    \ will open. Use `_blank` for a new tab.\n- The `title` attribute provides extra\
    \ information that appears when hovered.\n- Images and buttons can also work as\
    \ hyperlinks.\n\n## Chapter 6: Images\nImages are the most common part of a website\
    \ after the text. Today, almost every website you visit has images. Images improve\
    \ the appearance of a website and attract more audiences. To simply add an image,\
    \ use the `<img>` tag.\n\n### <img> tag\nThe `<img>` tag has the following syntax.\
    \ The `<img>` tag does not have a closing.\n\n### <source> tag\nThe `<source>`\
    \ tag is used to define the source of the video. It has an `src` attribute that\
    \ holds the URL of the video. We also need to mention the type of video using\
    \ the `type` attribute. Observe how the video looks in the browser. The video\
    \ appears on the screen it will not play because there are not options for play\
    \ or pause.\n\n### controls attribute\nThe `<video>` tag has a boolean attribute\
    \ called `controls`. This attribute provides controlling options for the video.\
    \ You can see, the options such as play/pause button and length of the video are\
    \ available now.\n\n### autoplay attribute\nThe `autoplay` attribute is another\
    \ Boolean attribute of the `<video>` tag. When it is specified, the video starts\
    \ playing automatically as soon as the page loads.\n\n### <audio> tag\nThe `<audio>`\
    \ tag is used to define audio on a web page. Similar to the `<video>` tag, the\
    \ `<source>` tag is also used here. Moreover, the `<audio>` tag also has the `controls`\
    \ and `autoplay` attributes.\n\n#### Summary\n- `<img>` is used to add images.\n\
    - The `src` attribute is mandatory and holds the URL of the image.\n- Use `height`\
    \ and `width` to change the size.\n- The `alt` attribute is optional but shows\
    \ text if the image fails to load.\n- Images can work as links.\n\n## Chapter\
    \ 7: Tables\nData on a web page should be represented in a proper manner. There\
    \ are various ways of representing data. We already discussed some of these ways,\
    \ such as the `<p>` and `<h1>` tags. But sometimes, we may need a better way to\
    \ display data accurately and clearly. Tables are considered one of the best ways\
    \ to represent data. Tables arrange data in rows and columns. In HTML, the `<table>`\
    \ tag is used to create a table.\n\n### <table> tag\nThe `<table>` tag alone does\
    \ not display anything. It defines a table. We need to create rows and columns\
    \ manually. HTML has the `<tr>` and `<td>` tag to create a row and column, respectively.\n\
    \n### <tr> and <td> tags\nAs mentioned, the `<tr>` tag creates a row. It is placed\
    \ inside the `<table>` tag. The above table has one row. Let's add two columns\
    \ in this row using the `<td>` tag. So, this is how rows and columns are created\
    \ in HTML. Let's add some content in each column and see how the tables appear\
    \ in the browser.\n\n### Table border\nWe haven't discussed CSS yet. But we will\
    \ add borders in the table using some `CSS`. In the `<head>` tag, a `<style>`\
    \ tag is added and it has some CSS in it. Ignore this part for now. For now, observe\
    \ the table in the browser. Now it looks like a table.\n\n### colspan and rowspan\
    \ attributes\nTables depend a lot on `CSS`. We can create attractive and better\
    \ tables with `CSS` but HTML also provides some nice attributes that could be\
    \ used with tables. One of these attributes is the `colspan` attribute. The `colspan`\
    \ attribute increases the span of a cell according to the value specified. The\
    \ first cell of the first row has `colspan` of 2. You can see that the cell now\
    \ covers the area of two columns. The `colspan` attribute can have any value but\
    \ it should be used carefully or the result can be an unpleasant table. Similarly,\
    \ the `rowspan` is used to increase the span of a row.\n\n### <th> tag\nThe `<th>`\
    \ tag is used to create a header. It behaves like the `<td>` tag but the content\
    \ is bold. The first row has headers instead of normal cells.\n\n### <thead> and\
    \ <tbody>\nThe `<thead>` and `<tbody>` tags are used to group the head part and\
    \ the body of the table. The table created has three rows - first one has headers\
    \ and the other two are in the `<tbody>` tag.\n\n#### Summary\n- `<table>` defines\
    \ the table structure.\n- `<tr>` and `<td>` create rows and columns.\n- `<th>`\
    \ is used for header cells.\n- `colspan` and `rowspan` span multiple columns or\
    \ rows.\n- `<thead>` and `<tbody>` group table sections.\n\n## Chapter 8: Lists\n\
    Another way of representing data is by using lists. Lists are used commonly on\
    \ web pages. Mostly, they are used to represent related data. There are three\
    \ types of lists in HTML - ordered, unordered, and description.\n\n### Ordered\
    \ list\nAn ordered list is always in some of order. By default, an ordered list\
    \ is numerical. It has other options. The ordered list is created using the `<ol>`\
    \ tag. To insert values, we have to use the `<li>` tag. The `start` attribute\
    \ allows us to control the starting point.\n\n### Unordered list\nAn unordered\
    \ list does not have any order and it is a bulleted list. The `<ul>` tag is defined\
    \ using the `<ul>` tag and `<li>` tag is used for options. The `type` attribute\
    \ in the unordered list has four values: `disc`, `square`, and `none`.\n\n###\
    \ Description list\nThe description list is used to create a list in which each\
    \ option has a description with it. The `<dl>` tag defines a description list.\
    \ There are two additional tags - `<dt>` and `<dd>`. The `<dt>` tag defines a\
    \ term and the `<dd>` tag describes it. There are three terms in the list, each\
    \ having its own description.\n\n#### Summary\n- There are three types of lists:\
    \ ordered (`<ol>`), unordered (`<ul>`), and description (`<dl>`).\n- `<li>` is\
    \ used for list items.\n- `start` attribute works for ordered lists.\n- `<dt>`\
    \ and `<dd>` are for terms and descriptions in description lists.\n\n## Chapter\
    \ 9: Forms\nForms are one of the most important parts of a web page because they\
    \ are used for user interaction. If we want information from a user, need to create\
    \ a form. There are various ways of getting input from the user, such as input\
    \ fields, text areas, radio buttons, and checkboxes. They all come under the HTML\
    \ forms.\n\n### <form> tag\nThe `<form>` tag defines a form in HTML. Everything\
    \ is written inside it.\n\n### <input> tag\nThe `<input>` tag is the most important\
    \ tag in HTML forms. This tag defines how the user will provide the input. It\
    \ all depends on the `type` attribute of the `<input>` tag.\n\n### Type attribute\n\
    1. Input text field\nTo create an input text field, set the value of the `type`\
    \ attribute as `\"text\"`. The `<input>` tag does not have a corresponding closing\
    \ tag. You can see the input field in the browser. Let's make it more clear using\
    \ the `<label>` tag. The `<label>` tag has the information regarding the input.\
    \ It can be used with any type of input.\n2. Radio buttons\nIf there are multiple\
    \ choices and user can only select one, use the radio buttons in such situations.\
    \ There are two radio buttons.\n3. Checkboxes\nCheckboxes are used where user\
    \ can select multiple options. There are three checkboxes.\n4. Date\nTo get a\
    \ date as user input, set the value of the `type` attribute as `date`.\n5. Email\n\
    The `email` type is an input field that only accepts when the input is valid.\
    \ There are other input types as:\n- `file`: allows user to upload a file\n- `color`:\
    \ allows user to pick a color\n- `number`: text input that accepts only numbers\n\
    - `month`: allows the user to select a month and year\n- `time`: allows the user\
    \ to select the time\n\n### Button\nA form is incomplete without buttons. There\
    \ is always a button that submits the form. To create a button in a form, use\
    \ `\"submit\"` as the type. The value specified in the `value` attribute will\
    \ appear on the button.\n\n### value attribute\nThe `value` attribute is used\
    \ to give a pre-defined value to any input type. The value of the input field\
    \ is `\"John\"`. Let's see in the browser. You can see, the value appearing in\
    \ the input field.\n\n### Checked attribute\nThe checked attribute is used with\
    \ radio buttons and checkboxes.. This attribute does not have any value. It is\
    \ only placed in the input tag.\n\n### disabled attribute\nTo disable an input\
    \ field, use the `disabled` attribute. By disable, user is not allowed to use\
    \ the input field. The second input field is disabled.\n\n### required attribute\n\
    Any input field with the `required` attribute cannot be skipped. It is mandatory\
    \ to provide value to that field.\n\n### placeholder attribute\nA placeholder\
    \ is a text that appears in an input field to indicate the expectations. The text\
    \ is just for display, it is not the value of the field. The `placeholder` attribute\
    \ will appear in the input field.\n\n### Form attributes\nWe discuss some of the\
    \ important and commonly used input attributes. Now, let's discuss some important\
    \ attributes of the `<form>` tag.\n\n### action attribute\nThe `action` attribute\
    \ in a form defines which URL will invoke when the form is submitted. The input\
    \ values are delivered to the specified URL. The value of the `action` attribute\
    \ should be a URL.\n\n### method attribute\nIt is also necessary to specify the\
    \ HTTP method when a form is submitted. The method can be either `POST` or `GET`.\n\
    \n### novalidate attribute\nThe `<input>` tag has few attributes for validation,\
    \ such as the `required` attribute. The form will not submit until everything\
    \ in the form is validated. But we can also ignore the validations by the `novalidate`\
    \ attribute. `novalidate` is a boolean attribute so it not requires any value.\n\
    \n#### Summary\n- Forms are used to get input from users.\n- `<form>` tag defines\
    \ a form and the `<input>` tag is used to define the way in which the user provides\
    \ input.\n- There are several types of input in HTML: text, radio, checkbox, and\
    \ many more. The `type` attribute defines the input field.\n- `action` defines\
    \ where to submit data, and `method` defines the protocol (POST/GET).\n- Other\
    \ attributes include `value`, `checked`, `disabled`, `required`, `placeholder`,\
    \ and `novalidate`.\n\n## Chapter 10: Media\nMultimedia has become a trend in\
    \ modern websites. We may find videos and audios playing automatically when we\
    \ visit a particular website, or we may find options to play the video or audio.\
    \ HTML provides separate tags for video and audio with some useful attributes.\n\
    \n### <video> tag\nAs the name suggests, the `<video>` tag is used to display\
    \ videos in the browser.\n\n### <source> tag\nThe `<source>` tag is used to define\
    \ the source of the video. It has an `src` attribute that holds the URL of the\
    \ video. We also need to mention the type of video using the `type` attribute.\
    \ Observe how the video looks in the browser. The video appears on the screen\
    \ it will not play because there are not options for play or pause.\n\n### controls\
    \ attribute\nThe `<video>` tag has a boolean attribute called `controls`. This\
    \ attribute provides controlling options for the video. You can see, the options\
    \ such as play/pause button and length of the video are available now.\n\n###\
    \ autoplay attribute\nThe `autoplay` attribute is another Boolean attribute of\
    \ the `<video>` tag. When it is specified, the video starts playing automatically\
    \ as soon as the page loads.\n\n### <audio> tag\nThe `<audio>` tag is used to\
    \ define audio on a web page. Similar to the `<video>` tag, the `<source>` tag\
    \ is also used here. Moreover, the `<audio>` tag also has the `controls` and `autoplay`\
    \ attributes.\n\n#### Summary\n- `<video>` and `<audio>` tags are used for media.\n\
    - `<source>` tag defines the media source via `src` and `type`.\n- `controls`\
    \ provides play/pause options.\n- `autoplay` allows the media to start playing\
    \ automatically.\n\n## Chapter 11 - Cascading style sheets\nWith HTML tags, we\
    \ can create a basic structure of a web page. Almost everything, from text to\
    \ images can be created using these tags. But these tags just provide a structure\
    \ that is not appealing.\n\nWhat is CSS and why do we use it?\n`CSS` stands for\
    \ `Cascading Style Sheets`. It is another technology of the World Wide Web that\
    \ is used to present an HTML document in a better way. So, `CSS` is a stylesheet\
    \ language that is used with `HTML` for formatting. It is another important part\
    \ of web development because website today is complete with `CSS`. Look at `amazon's\
    \ homepage`. Now, observe it again, this time with no `CSS`. It is understandable\
    \ how important `CSS` is. `CSS` only turns a boring HTML page into an attractive\
    \ one but helps in placing elements in proper positions.\n\n#### Summary\n- `CSS`\
    \ (Cascading Style Sheets) is used for formatting and styling of HTML documents.\n\
    \n## Chapter 12 - Syntax and ways of using CSS\nSo let's start with the syntax.\
    \ There are two parts in the CSS rule-set - `selector` and `declaration`. `CSS`\
    \ is applied to a particular HTML element or group of HTML elements.\n\n### selector\n\
    The selector is used to select an HTML element(s).\n\n### declaration\nThe declaration\
    \ has the CSS properties and values. A single declaration has a key-value pair.\
    \ The key is the CSS property and it is separated from the value by a colon. We\
    \ can have multiple declarations and each declaration should be separated by a\
    \ semicolon.\n\n### Summary of CSS Syntax\n- CSS rule-set consists of `selector`\
    \ and `declaration`.\n- `selector` targets the element.\n- `declaration` contains\
    \ property and value separated by `:`.\n- Multiple declarations are separated\
    \ by `;`.\n\n### Ways of using CSS\nThere are three ways of using CSS - External,\
    \ Internal, and Inline.\n\n### External CSS\nWhen we have a lot of `CSS` and the\
    \ CSS is common in multiple HTML documents, the external CSS is the right way.\
    \ As the name suggests, the CSS is written in a separate file with `.css` extension.\
    \ The name of this file is `example.css`. To use it in an HTML file, we need to\
    \ include a reference of it in the head section using the `<link>` tag. The `<link>`\
    \ tag has three mandatory attributes:\n- `rel`: specifies the relationship between\
    \ the linked file and the current file. As the linked file is a CSS file, we have\
    \ to specify `\"stylesheet\"` as its value.\n- `type`: specifies the media type\
    \ of the file that is linked with HTML. The type of a CSS file is `\"text/css\"\
    `.\n- `href`: specifies the location of the linked file. This is how the `<link>`\
    \ tag is used to link the external file with an HTML file.\n\n### Internal CSS\n\
    So the external CSS should be preferred if CSS is common for multiple pages. But\
    \ if there is a unique CSS for a single page, use the internal CSS. In this way,\
    \ the CSS is placed inside the `<style>` tag which, in turn, is placed inside\
    \ the head section.\n\n### Inline CSS\nThe third way is a bit different. Every\
    \ HTML tag has an attribute known as the style attribute. This attribute is used\
    \ to specify CSS for a single tag. There are no selectors in inline style.\n\n\
    ### Priority order\nWhat if the same CSS is used for the same HTML element in\
    \ a single HTML file with all the three ways? For example, observe the following\
    \ HTML file. There is a single `<p>` tag and internal as well as inline CSS is\
    \ applied on it. Also, example.css is linked with it. The external CSS is also\
    \ targeting the same property of the `<p>` tag. But, the value for the color is\
    \ different in all the cases; \"blue\" in inline, \"green\" in internal, and \"\
    red\" in external. What do you think will happen? What will be the color of the\
    \ `<p>` tag? Let's see. The color is blue, this means inline CSS has more priority\
    \ over the other two. Now, let's remove the inline CSS and see, who has more priority\
    \ among the internal and external CSS. Let's see what is the color of the `<p>`\
    \ tag now. The color is green, so it means the internal CSS has priority over\
    \ the external CSS, right? Let's interchange the order their placement inside\
    \ the `<head>` tag. This time, internal CSS is placed before the external CSS.\
    \ The color of the `<p>` tag is red. So, the priority among the internal and external\
    \ CSS depends upon the order in which they are placed inside the head section.\
    \ The CSS which is placed later in the head section has more priority.\n\n####\
    \ Summary\n- There are two parts in CSS rule-set - `selector` and `declaration`.\n\
    - The `selector` is used to select an HTML element(s) while the `declaration`\
    \ has the CSS properties and values.\n- A single declaration has a property and\
    \ value, separated by a colon.\n- Multiple declarations are separated by a semicolon.\n\
    - Three ways of CSS: External, Internal, and Inline.\n- Priority: Inline > Internal\
    \ > External.\n\n## Chapter 13: CSS selectors\nIn the last chapter, we discussed\
    \ the syntax of CSS. Selectors are one of two parts of the rule-set. We discussed\
    \ how to select an HTML element using their tag.\n\n### Id selector\nNow, it does\
    \ not matter if there is only a single `<p>` tag in the HTML file or hundreds,\
    \ this CSS will be applied to all of them. But we do not want to apply the same\
    \ CSS to all paragraphs, right? Maybe we want red color for one paragraph and\
    \ blue for another. Similarly, there can be various selectors for such scenarios.\
    \ Observe the following HTML code. The `Id` selector is used to select a particular\
    \ element. Every element has an `id` attribute. Id given to an element should\
    \ be unique. To select an element using the id, use the hash (`#`) sign followed\
    \ by the id name.\n\n### Class selector\nThe id is usually for an element. But\
    \ what if we need the same CSS for a group of elements? Not all, but some of them.\
    \ Observe the following HTML file. The class selector is used to select multiple\
    \ elements. To use this type of selector, use a dot (`.`) followed by the class\
    \ name. The same class is assigned for the first three `<p>` tags, while others\
    \ unaffected.\n\n### Grouping selector\nNow, suppose there are few elements with\
    \ the same definition and we want the same CSS for them. Observe the code above.\
    \ The `<p>`, `<h1>`, and `<h4>` tag have same definitions. Each of them has the\
    \ CSS defined separately. But why write separate code for each them when the CSS\
    \ is the same? We can use the class selector, but the class selector should be\
    \ used for the same type of HTML element. In such a case, use the grouping selector.\
    \ The grouping selector is used to group different elements so that the same CSS\
    \ can be applied to them. Just use the element names and separate them with comma.\n\
    \n### Universal selector\nSo far, we have discussed how to use the id selector\
    \ for a particular element, the class selector for multiple elements, and the\
    \ grouping selector for different elements with the same definition. But what\
    \ if we need the same CSS for every element in the HTML file? There is another\
    \ selector called universal for such cases. Use the asterisk (`*`) sign to apply\
    \ CSS to every element. The universal selector will apply CSS to every element.\n\
    \n#### Summary\n- CSS selectors are used for finding HTML elements to apply CSS\
    \ on them.\n- There are several types of CSS selectors: id, class, group, and\
    \ universal.\n- `id` selector uses the hash (`#`) sign with the value of `id`\
    \ attribute.\n- `class` selector uses the dot (`.`) with the value of `class`\
    \ attribute.\n- Grouping selector is used to group elements with the same definition.\n\
    - Universal selector (`*`) applies CSS to all elements.\n\n## Chapter 14: CSS\
    \ text and font\nWithout CSS, the text is boring. CSS has several properties that\
    \ can be applied to any kind of text, such as paragraphs and headings. The CSS\
    \ properties for text are simple, yet very important. We cannot just add boring\
    \ text on a web page. We need to make enhancements such as adding color, setting\
    \ alignment, etc. The font is another very useful part. We can add text with different\
    \ font styles, sizes, and more using CSS fonts.\n\n### Colors with CSS\nIn the\
    \ recent CSS chapters, we saw how text color can be changed using the `color`\
    \ property. The color property can have three types of values - color name, HEX\
    \ value, and RGB value. We can also change the background color of the text using\
    \ the `background-color` property. Similar to the `color` property, the `background-color`\
    \ can also have the color name, HEX value, or RGB value as its value.\n\n### Text\
    \ decoration\nGenerally, text in HTML does not have decorations. To add decorations\
    \ or to remove the default, use the `text-decoration` property. The `text-decoration`\
    \ property can have four values: underline, line-through, overline, and none.\
    \ The first three values add decorations while the last one removes the default\
    \ decoration. All the `<p>` tags have different text decorations - underline for\
    \ the first, line-through for the second, and overline for the third. If there\
    \ is some default decoration, we can remove it using `none` as the value of `text-decoration`.\n\
    \n### Aligning text\nBy default, the text is always aligned to the left side of\
    \ the container. But we can also change the alignment using CSS. The `text-align`\
    \ property sets the horizontal alignment. It can have four values: left, right,\
    \ and center. The first paragraph is aligned to the left, which is also the default,\
    \ the second paragraph is aligned to the right, and the third one is aligned the\
    \ center.\n\n### CSS fonts\nBy using CSS properties, we can change the font family,\
    \ size, and style. To change the font family, use the `font-family` property.\
    \ `sans-serif`, `Impact`, and `Courier` are some of the most commonly used fonts.\
    \ Suppose, the font applied is not supported by the browser, then what? The next\
    \ font, separated by a comma, will be assigned as the value of the `font-family`.\n\
    \n### Font size\nThe default size of a `<p>` tag is `16px` (`em`). To change the\
    \ size, use the `font-size` property. The value can be in pixels, `em`, or percentage.\
    \ Every `<p>` tag has a different font size.\n\n### Bold font\nTo make the font\
    \ bold, use the `font-weight` property.\n\n### Italic font\nTo make the font italic,\
    \ use the `font-style` property.\n\n#### Summary\n- `color` changes the text color.\n\
    - `background-color` changes the background of the text.\n- `text-decoration`\
    \ adds or removes decorations (underline, line-through, overline, none).\n- `text-align`\
    \ aligns text horizontally (left, right, center).\n- `font-family` changes the\
    \ font family.\n- `font-size` changes the text size.\n- `font-weight` makes text\
    \ bold.\n- `font-style` makes text italic.\n\n## Chapter 15 - CSS borders, margin,\
    \ and padding\nEvery HTML element has a border, margin, and padding. These three\
    \ terms are important because the presentation generally somewhat depends on them.\
    \ The border, margin, and padding is used for clarity and better looks. But before\
    \ moving to them, you need to understand the box model.\n\n### CSS box model\n\
    The HTML elements are enclosed inside a box. This box is known as the `CSS Box\
    \ Model`. This model has four parts: the border, margin, padding, and content.\
    \ By default, only content is visible while the border is not and the margin and\
    \ padding are zero.\n\n### Border\nAs mentioned above, by default, there is no\
    \ border for HTML elements. The `border-width` property is used to define the\
    \ width of the border. Its value can be in `px`, `cm`, `pt`, `em`, or the three\
    \ pre-defined values: thin, thick, or medium. Along with `border-width`, we also\
    \ need to define the style of the border using the `border-style` property. The\
    \ `border-style` property can have values such as solid, dotted, and dashed. The\
    \ `<p>` tag has `border-width` of `2px` and solid `border-style`.\n\n### Border\
    \ color\nBy default, the color of the border is black. But it can be changed using\
    \ the `border-color` property. The value of the `border-color` property can be\
    \ a color name, HEX value, RGB value, HSL value, or transparent.\n\n### Border\n\
    These three properties deal with borders, but another property is the shorthand\
    \ property for borders. This property is simply called the `border` property and\
    \ consists of the width, style, and color. The first `<p>` tag has all the three\
    \ border properties while the second one has the shorthand property with similar\
    \ CSS.\n\n### Margin\nTo understand, we need to create the content inside a `<div>`\
    \ tag. This tag is used to define a section or division. Both `<p>` and `<div>`\
    \ tags have border of `2px`. The area between the red line and the black line\
    \ is the margin. To set the margin in all the directions, we can use `margin-top`,\
    \ `margin-bottom`, `margin-right`, and `margin-left`. The margin for top and bottom\
    \ is `10px` while left and right is `20px`. The `margin` property is actually\
    \ a shorthand. We can also use the `margin` property to set different margins\
    \ for each direction.\n\n### Padding\nThe area between the content and the border\
    \ is the padding for the `<p>` tag. The `padding` property is used to change the\
    \ padding. For padding, we also have properties like `padding-top`, `padding-bottom`,\
    \ `padding-right`, and `padding-left`. The `padding` property is also a shorthand.\n\
    \n#### Summary\n- CSS Box Model consists of border, margin, padding, and content.\n\
    - `border-width`, `border-style`, and `border-color` define the border.\n- `border`\
    \ is a shorthand for border properties.\n- `margin` (top, bottom, left, right)\
    \ defines the space outside the border.\n- `padding` (top, bottom, left, right)\
    \ defines the space inside the border.\n\n## Chapter 16 - CSS backgrounds\nBy\
    \ default, every HTML page has a white background. It is boring. There are few\
    \ CSS properties that can be used to manipulate backgrounds. We can change the\
    \ background color, or add an image to the background.\n\n### Background color\n\
    We can change the background color of any HTML element using the `background-color`\
    \ property. The `<p>` tag has a background color. But generally, `background-color`\
    \ property is used to set the background of the entire page. To do this, we have\
    \ to add the `background-color` property to the `<body>` of the page. Remember,\
    \ any CSS added to the `<body>` will affect the entire page.\n\n### Background\
    \ image\nApart from color, we can also set an image as the background using the\
    \ `background-color` property. Use `url()` method as its value. If you are uploading\
    \ from your machine, then you have to give the exact path or if an image from\
    \ the internet, give its proper url. The image appears in the background but it\
    \ is not in the proper way. To adjust the image properly, we have additional CSS\
    \ properties.\n\n### Background repeat\nIn the above example, the background image\
    \ is repeating. This happens because the image is set according to its actual\
    \ size. To prevent the image from repeating, use the `background-repeat` property\
    \ and set `no-repeat` as its value. Apart from `no-repeat`, we can use `repeat-x`\
    \ and `repeat-y` to repeat the background horizontally and vertically.\n\n###\
    \ Background cover\nStill, the background image does not appear property. It should\
    \ cover the whole window and to do this, use the `background-size` property and\
    \ set `cover` as its value. This looks perfect now. There are other properties\
    \ such as `background-attachment` that is used to specify if the image is fixed\
    \ or scrollable and `background-position` to set the position of the image.\n\n\
    #### Summary\n- `background-color` sets the color.\n- `background-image` sets\
    \ the image.\n- `background-repeat` adjusts repetition (use `no-repeat`).\n- `background-size`\
    \ (use `cover`) stretches image to window.\n\n## Chapter 17 - What is JavaScript?\n\
    So far, we have discussed HTML and CSS, and now, we know how to create a web page\
    \ and give styles to it. But still, everything is just a presentation. For example,\
    \ we can create a button using the `<button>` tag and we can also apply any sort\
    \ of CSS to it. But, nothing happens when the button is clicked. This is static\
    \ and today, websites are dynamic. Changes on a website without reloading the\
    \ page. JavaScript is a vast programming language. It has many concepts. From\
    \ the beginner level to the advanced level, there is so much in JavaScript.\n\n\
    ### What is JavaScript?\nBy definition, JavaScript is a high-level, multi-paradigm\
    \ programming language. It is one of the core technologies of the World Wide Web(WWW),\
    \ the other two being `HTML` and `CSS`. JavaScript is crucial and essential part\
    \ of web development. `HTML` creates a basic structure, and `CSS` transforms it\
    \ into an attractive version. A website with only `HTML` is static that of no\
    \ use. Suppose, there is a beautiful button on a page, but nothing happens when\
    \ clicked. JavaScript is used to make button work.\n\n### History of JavaScript\n\
    In the early to mid-1990s, the web was young and everything was static. People\
    \ soon realized that the web cannot be static only, it needs to be dynamic and\
    \ there should be features like animations, and interactions. To make the web\
    \ dynamic, DOM manipulation was required, and for it, a scripting language was\
    \ needed. Java was emerging in the web community. So developers decided why not\
    \ create a simple scripting language. Brendan Eich created JavaScript in the year\
    \ 1996 when he was working at Netscape.\n\n#### Summary\n- JavaScript is a core\
    \ technology of the WWW.\n- It is used to create dynamic websites.\n- Created\
    \ by Brendan Eich in 1996.\n\n## Chapter 18 - Basics of Javascript\nJavaScript\
    \ is a vast programming language that covers several concepts, most importantly,\
    \ many of these in different ways. We will start from the basics such as variables\
    \ and functions.\n\n### Variables, data types, and operators\nLet's start with\
    \ one of the most basic terms used in programming - variable. A variable is defined\
    \ as a container that is used to hold values. `x`, `y`, and `z` are three variables\
    \ that are declared using the `var` keyword. Two other keywords can be used to\
    \ declare variables - `let` and `const`. As now, these variables do not hold any\
    \ values. To initialize them, we use the assignment operator `=`. Declaring a\
    \ variable with values is called initializing. We can also change these values\
    \ later by using the assignment operator `=`.\n\n### Data types\nA variable holds\
    \ data. Several types of data can be stored in a variable. In the above example,\
    \ all the variables were holding numerical values. We can also store single-precision\
    \ numbers, double-precision numbers, strings, boolean values, objects, date, etc.,\
    \ in a variable. These are different data types used in the programming world.\
    \ A data type indicates the characteristics of the data stored in a variable.\
    \ In the other programming languages such as Java, it is mandatory to specify\
    \ the data type of variable while declaring, and moreover, a variable can hold\
    \ only that type of data. But there are no restrictions in JavaScript. Data types\
    \ in JavaScript are divided into two categories - Primitive and Non-primitive.\n\
    \nPrimitive:\n- `Number`\n- `String`\n- `Boolean`\n- `Undefined`\n\nNon-primitive:\n\
    - `Object`\n- `Array`\n- `Date`\n\n### Functions\nWhile coding, we may face situations\
    \ when we need to execute the same code at different times. For example, we need\
    \ to find the sum of two numbers five times in a program. The numbers are different\
    \ every time. we need to write the same logic for five times throughout the program.\
    \ It will work fine, but do we think it is efficient? The answer is no. It is\
    \ not efficient because writing the same part again and again, not only increases\
    \ the length of the code but also the time and effort. Here enters the concept\
    \ of functions. Functions are called the main building blocks of a program. They\
    \ provide code reusability and helps reducing time and effort. For the above example,\
    \ we can create a function, that accepts two values and returns their sum. we\
    \ can call this function anytime anywhere we want. Thus removing the need for\
    \ repetition.\n\n### Declaring a function\nTo create a function in JavaScript,\
    \ we need the `function` keyword. A function in JavaScript is declared using the\
    \ `function` keyword followed by the name of the function and two parentheses.\
    \ In the above code, the name of the function is `demoFunction`. we can also see\
    \ parenthesis attached to it. These parentheses can be empty or can have parameters.\
    \ We will discuss the parameters later in the lesson. Currently, there are no\
    \ parameters for this function. The body of the function is written inside the\
    \ curly brackets, similar to `if` and `switch` statements.\n\n### Calling a function\n\
    Declaring a function is not enough. Nothing will happen until the function is\
    \ called. To call a function, simply write the name of the function with the parenthesis.\
    \ Let's execute the above code and check the output. The function is executed\
    \ once because I called it only a single time. The main objective of using functions\
    \ is to avoid code repetition and offer better code reusability.\n\n### Parameters\n\
    we can always pass data to a function. The data is passed as parameters or also\
    \ known as arguments. Observe the `add(a, b)` function. we can see, it has two\
    \ parameters - `a` and `b`, which are then used inside the function body. The\
    \ value of `a` is 10 and `b` is 20. During the function call - `add(b, a)`, the\
    \ value of a is 20 and b is 10.\n\n Summary\n- Variables are declared using `var`,\
    \ `let`, or `const`.\n- Use `=` for initialization.\n- Data types are either Primitive\
    \ (Number, String, Boolean, Undefined) or Non-primitive (Object, Array, Date).\n\
    - Functions provide reusability.\n- Parameters (arguments) are data passed to\
    \ functions.\n\n## Chapter 3 - DOM\nDOM stands for Document Object Model . It\
    \ is a very important concept on the road to becoming a developer. So in this\
    \ chapter, we will discuss what is DOM and how is used.\n\n### What is DOM?\n\
    When the HTML file is loaded into a browser, a tree-like structure is created.\
    \ This structure has various nodes, and these nodes represent elements of the\
    \ HTML document. The structure starts from `<html>` tag, that is the root element.\
    \ Then, `<head>` and `<body>` are different nodes. In the body, there is a `<p>`\
    \ tag which is a node of the `<body>` tag. The structure will grow as the more\
    \ tags are added in the HTML document.\n\n### Use of DOM\nSo far, we created HTML\
    \ documents using various tags and then applied CSS. Everything is still static.\
    \ Once loaded in the browser, nothing changes. Suppose, there is a button and\
    \ when clicked on button, something happens. Say, the button click changes the\
    \ text of a `<p>` tag. This is done by manipulating DOM with the help of JavaScript.\
    \ In simple words, JavaScript is used to create dynamic HTML by making changes\
    \ in the DOM. Take the above example. To change the content of the `<p>` tag,\
    \ we will use JavaScript to access that node, and then by using various DOM methods,\
    \ is manipulated accordingly. With JavaScript, we can manipulate almost everything\
    \ in HTML such as content, styles, even add new elements and remove the existing\
    \ ones.\n\nSummary\n- DOM is a tree-like structure created when an HTML document\
    \ is loaded.\n- Every node of a DOM tree represents an HTML element.\n- DOM can\
    \ be manipulated to make dynamic changes in an HTML document.\n\n## Chapter 20\
    \ - HTML events and JavaScript\nHTML events are attributes that are used to make\
    \ something happen. For example, a button click popping a message. Another example\
    \ is, popping a message when page loads or when the input changes. HTML events\
    \ are very important because they are used to convert the static HTML elements\
    \ into dynamic. One of the most important uses of these events is that JavaScript\
    \ functions can be triggered using them. Although a very basic DOM manipulation\
    \ can be done using HTML, serious manipulation is done using functions. This is\
    \ why HTML events are very important.\n\nThere are several HTML events divided\
    \ into different categories:\n- Keyboard events\n- Mouse events\n- Drag events\n\
    - Form events\n- Windows events\n- Media events\n- Clipboard events\n\nFurther,\
    \ there are several events in each of these categories. The main focus of this\
    \ chapter is to understand, how to use these events to trigger something.\n\n\
    ### Triggering alert()\nThe `alert()` function is pop up that appears on the screen\
    \ with a message. Let's see how can we trigger a pop up using the `onclick` mouse\
    \ event. Mouse events are one of the commonly used HTML events. These events are\
    \ triggered when the user does something with the mouse. For example, clicking\
    \ on something, double-clicking on something, hovering over something, and many\
    \ more. The `onclick` event is the most basic HTML event. As the name suggests,\
    \ this event triggers something when an element is clicked on. As mentioned earlier,\
    \ HTML events are attributes. So the button above has an `onclick` event and its\
    \ value is an `alert()` function. Remember, the value of an HTML event is always\
    \ written inside quotes. The value will be triggered when the button is clicked.\
    \ The pop up appears when the button is clicked. So this example was to give you\
    \ a basic understanding of how HTML events are used.\n\n### Triggering a function\n\
    In the real-time, events are used to trigger JavaScript functions. Generally,\
    \ complicated things such as DOM manipulation require some kind of coding logic\
    \ and there can be multiple lines of code. So it is not possible to write all\
    \ these lines in the HTML, and is why HTML functions are used. Let's put the `alert()`\
    \ into a function. The function is placed inside the `<script>` tag , in fact,\
    \ all the JavaScript is placed inside this tag or in a separate file. To trigger\
    \ this function, we have to give it as the value of the `onclick` event.\n\n###\
    \ Commonly used HTML events\n- Mouse events: `onclick`, `dblclick`, `onmouseover`,\
    \ `onwheel`.\n- Keyboard events: `keydown`, `onkeypress`, `onkeyup`.\n- Window\
    \ events: `onload`, `onload`, `onresize`.\n- Form events: `onchange`, `onsubmit`,\
    \ `onreset`.\n- Drag events: `ondrag`, `ondrop`.\n\n#### Summary\n- HTML events\
    \ trigger JavaScript functions.\n- Categories: keyboard, mouse, drag, form, window,\
    \ media, clipboard.\n- `onclick` is a common event.\n\n## Chapter 21 - Finding\
    \ elements\nTill now, we discussed JavaScript, DOM, and HTML events. These three\
    \ concepts are necessary if you want to understand DOM properly. In this chapter,\
    \ we will discuss two very important concepts - finding elements using various\
    \ methods and the `innerHTML` property.\n\n### innerHTML property\nTo manipulate\
    \ any HTML element or its value, we first need to find it. We cannot do anything\
    \ if we do not have the link of the HTML elements in the JavaScript of the HTML\
    \ file. For this, there are few methods, that we will discuss next, but first\
    \ need to understand the `innerHTML` property. The `innerHTML` property is used\
    \ to get the content of the HTML elements. The methods will only find the element,\
    \ but its value is accessed using the `innerHTML` property only. With the methods,\
    \ we can find the `<p>` tag, but the content, \"This is a paragraph.\" is accessed\
    \ using the `innerHTML` property.\n\n### Ways to find elements\nThere are three\
    \ ways of finding elements\n- `document.getElementById()`\n- `document.getElementsByTagName()`\n\
    - `document.getElementsByClassName()`\n\n### document.getElementById()\nThe `document.getElementById()`\
    \ method is the most common way to find HTML elements. The value passed to the\
    \ `document.getElementById()` method is the `id` of the element we want to find.\
    \ In the HTML, the `id` of the `<p>` tag is passed to the method and then, the\
    \ value is stored inside a variable named, `ele`. The console statement in the\
    \ next line prints the value of `ele`. The value in the console appears after\
    \ clicking the paragraph and it is nothing but, the `<p>` tag itself. To access\
    \ the content, we will use the `innerHTML` property. Let' again check the console.\
    \ This time, the value of the variable is equal to the content of the `<p>` tag.\
    \ So, this is how a method and `innerHTML` are combined to get the content of\
    \ an element.\n\n### document.getElementsByTagName()\nThe second way is to find\
    \ elements by the tag name. There are three `<p>` tags and `document.getElementsByTagName()`\
    \ will find all of these. Let's check the console. The `document.getElementsByTagName()`\
    \ returns an array with all the elements. Similarly, the `innerHTML` property\
    \ will also return an array with all the content.\n\n### document.getElementsByClassName()\n\
    Similar to the `document.getElementsByTagName()` method, the `document.getElementsByClassName()`\
    \ method is also used to find multiple elements. It uses class name to find elements.\
    \ It also returns an array.\n\n#### Summary\n- `innerHTML` is used to get content\
    \ of an element.\n- Three ways to find elements: `getElementById()`, `getElementsByTagName()`,\
    \ and `getElementsByClassName()`.\n- `getElementById()` uses `id`.\n- `getElementsByTagName()`\
    \ uses tag name.\n- `getElementsByClassName()` uses `class`.\n\n## Chapter 22\
    \ - Content and CSS with JavaScript\nLet's move further and discuss, how can we\
    \ change the content and CSS of HTML elements.\n\n### Changing content using innerHTML\
    \ property\nIn the last chapter, we discussed how the methods like `document.getElementById()`\
    \ can be combined with `innerHTML` property to access an element's content. The\
    \ main usage of this property is to change the content. This is a dynamic page.\
    \ The page has a button and a paragraph. Clicking on this button will replace\
    \ the text of the paragraph. Before the button clicked: After the button clicked:\
    \ Let's see what is happening here. First, the `document.getElementById()` method\
    \ is used to find the `<p>` tag. Its reference is stored in a variable named,\
    \ `ele`. Then, this reference is used with `innerHTML` property to assign a new\
    \ value to it. And everything is done, when the `demo()` function is triggered\
    \ after the button clicked. The case in other methods - `document.getElementsByTagName()`\
    \ and `document.getElementsByClassName()` is different. The id is always unique\
    \ in a HTML document, so `document.getElementById()` selects a single element,\
    \ but there can be multiple tags with same class name. So `document.getElementsByTagName()`\
    \ and `document.getElementsByClassName()` stores the found elements in an array\
    \ and we have to access them accordingly. There are three `<p>` tags. In `demo()`\
    \ function, `document.getElementsByTagName()` method is used to find them.\n\n\
    ### Changing values of the attributes\nIt is also possible to change the value\
    \ of an attribute with JavaScript. To understand, we need to create the content\
    \ inside a `<div>` tag. This `<div>` tag is used to define a section or division.\
    \ Both `<p>` and `<div>` tags have border of `2px`. The area between the red line\
    \ and the black line is the margin. To set the margin in all the directions, we\
    \ can use `margin-top`, `margin-bottom`, `margin-right`, and `margin-left`. The\
    \ margin for top and bottom is `10px` while left and right is `20px`. The `margin`\
    \ property is actually a shorthand. We can also use the `margin` property to set\
    \ different margins for each direction.\n\n### Changing CSS\nNot only the content\
    \ and attribute values, but we can also change the CSS with JavaScript. First,\
    \ we have to access the style attribute of the element and then, apply the required\
    \ CSS to it. Suppose, there is a paragraph whose color is red, and when clicked\
    \ on it, the color changes to blue.\n\nSummary\n- `innerHTML` is used to change\
    \ content.\n- To change attribute value, use the attribute name and assign new\
    \ value.\n- Change CSS using the style attribute.\n\n## Chapter 23 - Creating\
    \ and removing elements\nEvery element in an HTML document is represented as a\
    \ Node in the DOM tree. In the last chapter, we discussed how to update the content\
    \ of an existing element. But with JavaScript, we can also add new elements and\
    \ remove the existing one. There are a few methods that are used to create or\
    \ remove elements. In this chapter, we will discuss how to use these methods in\
    \ JavaScript.\n\n### document.createElement()\nAs the name suggests, the `document.createElement()`\
    \ method is used to create an HTML element. The element name should be passed\
    \ to this method. Now, we have a `<p>` tag but there is no content in it yet.\
    \ The next step is to use `document.createTextNode()` method to create a text\
    \ node. As of now, we have a new element and the content that is to be added to\
    \ it. But this newly created element is not added in the HTML document. It is\
    \ not present in the DOM. To add this to the DOM, we have a separate method.\n\
    \n### appendChild()\nIn the last example, we create two nodes - `<p>` tag and\
    \ the text. We have to append the `<p>` to the HTML document, but first, we need\
    \ to append the text node to the newly create `<p>` tag. The `appendChild()` method\
    \ appends a new node as the last child node. So let's append the text node to\
    \ the `<p>` tag and then, we will append this whole element as one of the last\
    \ child nodes in the HTML document. Now, we have a complete `<p>` tag. But still,\
    \ it is not present in the HTML document. The `<body>` tag has `<div>` as a node,\
    \ and in turn, the `<div>` tag has a `<button>` as its node. Now, we will append\
    \ this newly created `<p>` tag as a child node of the `<div>` tag using the `appendChild()`\
    \ method. This means we have to invoke the `appendChild()` method on the `<div>`\
    \ tag and for this, first we need to find this `<div>` tag. First, the `<div>`\
    \ tag is located using the `document.getElementById()` method and then, the new\
    \ node is appended to it using the `appendChild()` method. Before the button clicked:\
    \ After the button clicked: Let's discuss another example, this time using the\
    \ `innerHTML` property. In the example, a button is created using the `document.createElement()`\
    \ method and then, `innerHTML` property is used on it to assign a value. Let's\
    \ append this newly created element to the `<div>` tag.\n\n### insertBefore()\n\
    The `insertBefore()` method is used to insert an element right before an existing\
    \ element. Suppose, we have a `<p>` tag and we want to add a `<h1>` tag before\
    \ it. First, a new `<h1>` element is created. Now, we need to place this newly\
    \ created element before the `<p>` tag, but before it, we need to locate the `<div>`\
    \ because the `<p>` tag exists. The `insertBefore()` method is invoked using the\
    \ `div` and, both elements are passed to this.\n\n### document.createAttribute()\n\
    We can also create a new attribute for an existing element as well as for a newly\
    \ created element. Suppose, there is a paragraph and on the button click, a class\
    \ is applied to it. First, the `<p>` tag is located using the `document.getElementById()`\
    \ method. Next, we create a class attribute using the `document.createAttribute()`\
    \ method, and then assigned a value to it. As now, we have created an attribute\
    \ but it is not added the `<p>` tag. To do this, we need to use the `setAttributeNode()`\
    \ method.\n\n### remove()\nThe `remove()` method is used to remove an element\
    \ from an HTML document. The `<p>` tag is located using the `document.getElementById()`\
    \ method and then, it is used to invoke the `remove()` method.\n\nSummary\n- `document.createElement()`\
    \ creates an element.\n- `document.createTextNode()` creates a text node.\n- `appendChild()`\
    \ appends a node as the last child.\n- `insertBefore()` inserts an element before\
    \ another.\n- `document.createAttribute()` and `setAttributeNode()` handle attributes.\n\
    - `remove()` deletes an element.\n"
