    text.●       The <mark> tag defines highlighted or marked text in yellow.●      
    The <sub> and <sup> tags defines subscripted and superscripted text respectively.Chapter
    5: HyperlinksThere are multiple web pages on a website, right? We can navigate
    from one page to another. The links in HTML allow a user to navigate from one
    web page to another. Such links in HTML are called hyperlinks.The <a> is used
    to create hyperlinks in HTML. In this chapter, we will discuss how to use the
    <a> tag to move from one HTML document or web page to another.<a> tagThe <a> tag
    has few attributes. One of these attributes - href, is a mandatory attribute that
    holds the link of the document or web page that will open when clicked. Observe
    the syntax of the <a> tag.![](image_rsrc1UP.jpg)The URL should be written within
    the quotes. The text will appear on the screen and when clicked on it, the URL
    specified for the href attribute will open. Observe the following HTML code.![](image_rsrc1UR.jpg)In
    the paragraph, the word - ''here'' is a hyperlink. The href is ''https://google.com''.
    This means the homepage of Google will open when clicked on the hyperlink.![](image_rsrc1US.jpg)Did
    you notice something different with the appearance of the hyperlink? It is underlined
    and blue. There is a way to remove this styling by using CSS. We will discuss
    it later in the CSS section.You can also move locally from one HTML document to
    another. In the href attribute, you have to provide the proper path for the document
    you want to navigate.![](image_rsrc1UT.jpg)In the above <a> tag, the name of a
    document is specified that happens to be in the same folder. Clicking on the hyperlink
    will open the demo.html document.target attributeThe target attribute is an optional
    attribute of the <a> tag. It specifies where to open the document or web page.
    It can have the following four values:●      _self : To open the document or web
    page in the same tab/window. The target is set to _self by default.●      _blank
    : To open the document or web page in a new tab/window.●      _top : To open the
    document or web page in the full body of the window.●      _parent : To open the
    document or web page in the parent frame.You can also provide a framename as the
    value of the target attribute to open the document in a particular frame.![](image_rsrc1UU.jpg)The
    hyperlink in the above paragraph will open in a new tab/window.title attributeThe
    title attribute provides a title for a hyperlink. Whenever the mouse hovers over
    the hyperlink, it will display a text which is called the title. By default, it
    does not show anything.The title is usually extra information about the hyperlink
    in a very short form.![](image_rsrc1UV.jpg)More with <a> tagThe <a> tag is not
    limited to text. You can also use images and buttons as hyperlinks. Even, you
    can use a part of an image as a hyperlink.Summary●       The <a> tag in HTML is
    used to create hyperlinks.●      The href attribute is mandatory because it holds
    the URL of the document or web page that will open.●      The target attribute
    specifies where the document or web page will open.●      Use ''_blank'' as the
    value of the target attribute to open the document in a new tab/window.●     
    The title holds the extra information that will appear when hovered over the hyperlink.●      
    Images and buttons can also work as hyperlinks.Chapter 6: ImagesImages are the
    most common part of a website after the text. Today, almost every website you
    visit has images. Images improve the appearance of a website and attract more
    audiences.To simply add an image, use the <img> tag. But, it is not always just
    adding an image. The image should have proper alignment, position, and size.<img>
    tagThe <img> tag has the following syntax.![](image_rsrc1UW.jpg)The <img> tag
    does not have a corresponding closing.The src attribute is mandatory because it
    holds the URL of the image. The image can be present locally or it can be another
    server. Let''s discuss how to add local images in an HTML document.![](image_rsrc1UX.jpg)The
    image is present in the ''images'' folder. This folder is in the same location
    as the HTML file. It needs to be a proper path or the image won''t appear on the
    screen. Moreover, the extension of the image should also be present after the
    name.![](image_rsrc1UY.jpg)Similarly, we can add images from another server.![](image_rsrc1UZ.jpg)Just
    remember, the link should be working.Image sizeHave a look at the following image.![](image_rsrc1V0.jpg)Let’s
    see how this image appears in the browser.![](image_rsrc1V1.jpg)This is not how
    it should appear, right? So what do you think is wrong here? By default, the size
    of the image appearing on the screen is the same as its actual size. This image
    is huge in size and that is why only a portion of it is appearing on the screen.
    The whole image can be seen by scrolling up and down.To encounter such situations,
    the <img> tag has two attributes to set the width and height of an image. They
    are simply called width and height.![](image_rsrc1V2.jpg)The height and width
    are set to 300 and 500, respectively.![](image_rsrc1V3.jpg)Now, it looks better.Similarly,
    we can use CSS for image styling which we will discuss in the CSS section.alt
    attributeThe alt attribute is optional but it is recommended to use alt in every
    <img> tag. Suppose, an image fails to load for some reason. Then what? Let''s
    see.![](image_rsrc1V4.jpg)I added a few characters in the URL of the image to
    make it invalid.![](image_rsrc1V5.jpg)This does not look nice, right?So when an
    image fails to load, the value of the alt attribute appears in its place.![](image_rsrc1V6.jpg)![](image_rsrc1V7.jpg)Now,
    the user will know if there is a problem with image loading.Image as linksAs discussed
    in the previous chapter, images can also work as links. Simply, add image inside
    the <a> tag. The rest of the procedure is the same.![](image_rsrc1V8.jpg)Summary●      
    Images in HTML are added using the <img> tag.●       The src attribute holds the
    URL or path of the image.●      To change the size of an image, use the height
    and width attributes.●      The alt attribute holds the value that will be displayed
    if the image fails to load.●       Images can also be used as links in HTML.Chapter
    7: TablesData on a web page should be represented in a proper manner. There are
    various ways of representing data. We already discussed some of these ways, such
    as the <p> and <h1> tags. But sometimes, we may need a better way to display data
    more accurately and clearly. Tables are considered one of the best ways to represent
    data.Tables arrange data in rows and columns. In HTML, the <table> tag is used
    to create a table. There are few other tags and attributes that are necessary
    to create a proper table in HTML. So, in this chapter we will discuss how to create
    a simple table in HTML.The <table> tagThe <table> tag alone does not display anything.![](image_rsrc1V9.jpg)It
    only defines a table. We need to create rows and columns manually.HTML has the
    <tr> tag and <td> tag to create a row and column, respectively.The <tr> and <td>
    tagsAs mentioned, the <tr> tag creates a row. It is placed inside the <table>
    tag.![](image_rsrc1VA.jpg)The above table has one row. Let''s add two columns
    in this row using the <td> tag.![](image_rsrc1VB.jpg)So, this is how rows and
    columns are created in HTML. Let''s add some content in each column and see how
    the tables appear in the browser.![](image_rsrc1VC.jpg)![](image_rsrc1VD.jpg)This
    does not look like a table, right? By default, a table in HTML does not have any
    border. The CSS is required to add a border to the table.Table borderWe haven''t
    discussed CSS yet. But we will add borders in the table by using some CSS.![](image_rsrc1VE.jpg)In
    the <head> tag, a <style> tag is added and it has some CSS in it. Ignore this
    part for now. We will discuss it later in the CSS section. For now, observe the
    table in the browser.![](image_rsrc1VF.jpg)Now it looks like a table. A second
    row is also added.colspan and rowspan attributesTables depend a lot on CSS. We
    can create attractive and better tables with CSS but HTML also provides some nice
    attributes that could be used with tables. One of these attributes is the colspan
    attribute.The colspan attribute increases the span of a cell according to the
    value specified.![](image_rsrc1VG.jpg)The first cell of the first row has colspan
    of 2.![](image_rsrc1VH.jpg)You can see that the cell now covers the area of two
    columns.The colspan attribute can have any value but it should be used carefully
    or the result can be an unpleasant table.Similarly, the rowspan is used to increase
    the span of a row.The <th> tagThe <th> tag is used to create a header . It behaves
    like the <td> tag but the content is bold.![](image_rsrc1VJ.jpg)Now, the first
    row has headers instead of normal cells.![](image_rsrc1VK.jpg)You can see, the
    text is bold in the headers.The <thead> and <tbody>The <thead> and <tbody> tags
    are used to group the head part and the body of the table.The table created has
    three rows - first one has headers while the other two have columns. So the first
    one can be written inside the <thead> tag and others can be written inside the
    <tbody> tag.![](image_rsrc1VM.jpg)These tags won''t affect the table but is a
    good practice to group the rows of a table in HTML.Summary●       Tables are used
    to arrange data in rows and columns.●       HTML has the <table> tag to create
    tables.●      The <tr> tag creates a row while the <td> tag creates a cell or
    column.●      The <th> tag can also be used in the place of the <td> tag. It specifies
    a header cell with bold content.●      The colspan and rowspan attributes are
    used to increase the span of a cell or row, respectively.●      The <thead> and
    <tbody> tags are used to group header rows and body rows in tables.Chapter 8:
    ListsAnother way of representing data is by using lists.Lists are used commonly
    on web pages. Mostly, they are used to represent related data. There are three
    types of lists in HTML - ordered, unordered, and description.Ordered listAn ordered
    list is always in some kind of order. By default, an ordered list is numerical.
    But It also has other options.The ordered list is created using the <ol> tag.![](image_rsrc1VN.jpg)The
    <ol> tag only defines an ordered list. To insert values, we have to use the <li>
    tag.![](image_rsrc1VP.jpg)Now, the list has three values. Remember, each value
    should be written inside the <li> tag.![](image_rsrc1VR.jpg)Type attribute in
    the ordered listEvery option starts with a number in ordered list. We can change
    this to alphabets and roman numbers - both lowercase and uppercase. To do this,
    use the type attribute.![](image_rsrc1VS.jpg)The type attribute has ''a'' as its
    value.![](image_rsrc1VT.jpg)The numbers are replaced by lowercase alphabets.Similarly,
    use  ''i'' for lowercase roman numbers.![](image_rsrc1VU.jpg)![](image_rsrc1VV.jpg)Other
    options are; ''A'' for uppercase alphabets and ''I'' for uppercase roman numbers.start
    attributeA numerical list always starts from 1\. Similarly, an alphabetic list
    starts from ''a'' or ''A''. We can also control the starting point of an ordered
    list by using the start attribute.![](image_rsrc1VW.jpg)The value of the start
    attribute is 20.![](image_rsrc1VX.jpg)The list starts with 20\. Similarly, we
    can use the start attribute for any type.Unordered listAn unordered list does
    not have any order and it is a bulleted list.The <ul> tag is defined using the
    <ul> tag and <li> tag is used for options just like the ordered list.![](image_rsrc1VY.jpg)![](image_rsrc1VZ.jpg)You
    can see, each option starts with a bullet.Type attribute in the unordered listThe
    type attribute in the unordered list has four values; disc, circle, square, and
    none. By default, the type of unordered list is disc.![](image_rsrc1W0.jpg)The
    type is "circle" for the unordered list.![](image_rsrc1W1.jpg)If we do not want
    any symbol, we can use "none" as the type.![](image_rsrc1W2.jpg)![](image_rsrc1W3.jpg)Description
    listThe description list is used to create a list in which, each option has a
    description with it.The <dl> tag defines a description list.![](image_rsrc1W4.jpg)There
    are two additional tags - <dt> and <dd>.The <dt> tag defines a term and the <dd>
    tag describes it.![](image_rsrc1W5.jpg)There are three terms in the list, each
    having its own description.![](image_rsrc1W6.jpg)Summary●      There are three
    types of lists is HTML - ordered, unordered, and description.●       The <ol>
    tag is used to create an ordered list.●       The <ul> tag is used to create an
    unordered list.●       The <dl> tag is used to create a description list.●     
    The <li> tag is used to create options in ordered and unordered lists.●      The
    <dt> tag defines a term in description list while <dd> tag describes it.●     
    The type attribute in an ordered list can have ''a'', ''A'', ''i'', and ''I''
    as its value. By default, it is a numerical list.●      The type attribute in
    an unordered list can have ''circle'', ''square'', and ''none'' as its value.
    By default, it is a bulleted list.Chapter 9: FormsForms are one of the most important
    parts of a web page because they are used for user interaction.If we want information
    from a user, weneed to create a form. There are various ways of getting input
    from the user, such as input fields, text areas, radio buttons, and checkboxes.
    They all come under the HTML forms.<form> tagThe <form> tag defines a form in
    HTML. Everything is written inside it.![](image_rsrc1W7.jpg)<input> tagThe <input>
    tag is the most important tag in HTML forms. This tag defines how the user will
    provide the input. It all depends on the type attribute of the <input> tag.Type
    attribute1\. Input text fieldTo create an input text field, set the value of the
    type attribute as "text".![](image_rsrc1W8.jpg)The <input> tag does not have a
    corresponding closing tag.![](image_rsrc1W9.jpg)You can see the input field in
    the browser.Let''s make it more clear using the <label> tag.![](image_rsrc1WA.jpg)The
    <label> tag has the information regarding the input. It can be used with any type
    of input.![](image_rsrc1WB.jpg)2\. Radio buttonsIf there are multiple choices
    and the user can only select one , use the radio buttons in such situations.![](image_rsrc1WC.jpg)There
    are two radio buttons.![](image_rsrc1WD.jpg)3\. CheckboxesCheckboxes are used
    where a user can select multiple options.![](image_rsrc1WE.jpg)There are three
    checkboxes.![](image_rsrc1WF.jpg)4\. DateTo get a date as user input, set the
    value of the type attribute as date.![](image_rsrc1WG.jpg)![](image_rsrc1WH.jpg)5\.
    EmailThe email type is an input field that only accepts when the input is a valid
    email.![](image_rsrc1WJ.jpg)There are several other input types such as:●      
    "file", allows user to upload a file●       "color", allows user to pick a color●      
    "number", text input that accepts only numbers.●       "month", allows the user
    to select a month and year.●       "time", allows the user to select the time.ButtonA
    form is incomplete without buttons. There is always a button that submits the
    form data.To create a button in a form, use "submit" as the type . It will create
    a submit form.![](image_rsrc1WK.jpg)The value specified in the value attribute
    will appear on the button.![](image_rsrc1WM.jpg)Important attributesvalue attributeThe
    value attribute is used to give a pre-defined value to any input type.![](image_rsrc1WN.jpg)The
    value of the input text field is "John". Let''s see in the browser.![](image_rsrc1WP.jpg)You
    can see, the value appearing in the input field.Similarly, the value can be set
    to any input type if it allows.Checked attributeThe checked attribute is used
    with radio buttons and checkboxes. This attribute does not have any value. It
    is only placed in the input tag.![](image_rsrc1WR.jpg)The second radio button
    is checked.![](image_rsrc1WS.jpg)Similarly, the checked attribute can also be
    used with the checkboxes.![](image_rsrc1WT.jpg)All the checkboxes are checked.![](image_rsrc1WU.jpg)disabled
    attributeTo disable an input field, use the disabled attribute. By disable, it
    means, user is not allowed to use the input field.![](image_rsrc1WV.jpg)The second
    input text field is disabled.![](image_rsrc1WW.jpg)required attributeAny input
    field with the required attribute cannot be skipped. It is mandatory to provide
    value to that field which is required.![](image_rsrc1WX.jpg)placeholder attributeA
    placeholder is a text that appears in an input field to indicate the expectations.
    The text is just for display, it is not the value of the field.![](image_rsrc1WY.jpg)The
    value of the placeholder will appear in the input text field.![](image_rsrc1WZ.jpg)Form
    attributesWe discuss some of the important and commonly used input attributes.
    Now, let''s discuss some of the important attributes of the <form> tag.action
    attributeThe action attribute in a form defines which URL will invoke when the
    form is submitted. The input values are delivered to the specified URL.![](image_rsrc1X0.jpg)The
    value of the action attribute should be a URL.method attributeIt is also necessary
    to specify the HTTP method when a form is submitted. The method attribute is used
    to specify the method. It can be either POST or GET.![](image_rsrc1X1.jpg)novalidate
    attributeThe <input> tag has few attributes for validation, such as the required
    attribute. The form will not submit until everything in the form is validated.
    But we can also ignore the validations by using the novalidate attribute.![](image_rsrc1X2.jpg)novalidate
    is a boolean attribute so it does not requires any value.Summary●       Forms
    are used to get input from the users.●      The <form> tag is used to define a
    form and the <input> tag is used to define the way in which the user will provide
    input.●      There are several types of input in HTML. The <input> tag has the
    type attribute that defines the input field. The types include text, radio, checkbox,
    and many more.●      To create a button, specify the type of <input> tag as "submit".
    It will create a submit button for the form.●      The value attribute is used
    to give value to the input field.●      There are several other attributes such
    as checked, disabled, placeholder, etc which are useful for presentation and validation.●     
    The action attribute of the <form> tag describes the action to be taken when the
    form is submitted while the method attribute describes the method of the action.Chapter
    10: MediaMultimedia has become a trend in modern websites. We may find videos
    and audios playing automatically when we visit a particular website, or we may
    find options to play the video or audio. HTML provides separate tags for video
    and audio with some useful attributes.<video> tagAs the name suggests, the <video>
    tag is used to display videos in the browser.![](image_rsrc1X3.jpg)<source> tagThe
    <source> tag is used to define the source of the video. It has an src attribute
    that holds the URL of the video.![](image_rsrc1X4.jpg)We also need to mention
    the type of video using the type attribute.![](image_rsrc1X5.jpg)Observe how the
    video looks in the browser.![](image_rsrc1X6.jpg)The video appears on the screen
    it will not play because there are not options for play or pause.controls attributeThe
    <video> tag has a boolean attribute called controls. This attribute provides controlling
    options for the video.![](image_rsrc1X7.jpg)![](image_rsrc1X8.jpg)You can see,
    the options such as play/pause button and length of the video are available now.autoplay
    attributeThe autoplay attribute is another Boolean attribute of the <video> tag.
    When it is specified, the video starts playing automatically as soon as the page
    loads.![](image_rsrc1X9.jpg)<audio> tagThe <audio> tag is used to define audio
    on a web page.![](image_rsrc1XA.jpg)Similar to the <video> tag, the <source> tag
    is also used here.![](image_rsrc1XB.jpg)Moreover, the <audio> tag also has the
    controls and autoplay attributes.![](image_rsrc1XC.jpg)Summary●      The <video>
    and <audio> tags are used to define videos and audios in HTML, respectively.●     
    The <source> tag is to define which video or audio is to be played. It is also
    necessary to define the type using the type attribute in the <source> tag.●     
    The control attribute of the <video> and <audio> tags is used to display the options
    such as the play/pause button.●      The autoplay option is used to play the video/audio
    automatically as soon as the page loads.Chapter 11 - Cascading style sheetsWith
    HTML tags, we can create a basic structure of a web page. Almost everything, from
    text to images can be created using these tags. But, these tags just provide a
    structure that is not appealing and attractive.In the modern web, websites are
    attractive and beautiful. Everything is presented in a proper way with a lot of
    neatness and clarity. We can find text in different sizes, colors, or styles,
    and backgrounds with different colors and images, and many more. All of these
    presentations are done using CSS.What is CSS and why do we use it?CSS stands for
    Cascading Style Sheets. It is another technology of the World Wide Web that is
    used to present an HTML document in a better way.So basically, CSS is a stylesheet
    language that is used with HTML for formatting. It is another important part of
    web development because no website today is complete with CSS.Have a look at amazon''s
    homepage.![](image_rsrc1XD.jpg)Now, observe it again, this time with no CSS.![](image_rsrc1XE.jpg)It
    is understandable how important CSS is.CSS not only turns a boring HTML page into
    an attractive one but also helps in placing the elements in proper positions.Summary●     
    CSS is used to present an HTML document in a better and attractive way.●      
    CSS can be applied to any HTML element.Chapter 12 - Syntax and ways of using CSSSyntax
    of CSSSo let''s start with the syntax. There are two parts in the CSS rule-set
    - selector and declaration.CSS is applied to a particular HTML element or a group
    of HTML elements. But first, we need something to find these elements. A selector
    in CSS is used to find the HTML elements.The declaration block has the CSS. A
    single declaration has a key-value pair. The key is the CSS property and it is
    separated from the value by a colon.![](image_rsrc1XF.jpg)Here, p is the selector
    that is selecting the <p> tags in the document. There are several types of CSS
    selectors and we will discuss all of them in a separate chapter.The declaration
    block has one declaration in it, where "color" is the property and "red" is its
    value. We can also have multiple declarations and each declaration should be separated
    by a semicolon.Ways of using CSSThere are three ways of using CSS - External,
    Internal, and Inline.External CSSWhen we have a lot of CSS and the CSS is common
    in multiple HTML documents, the external CSS is the right way. As the name suggests,
    the CSS is written in a separate file with .css extension.![](image_rsrc1XG.jpg)The
    name of this file is example.css. To use it in an HTML file, we need to include
    a reference of it in the head section of the HTML using the <link> tag.![](image_rsrc1XH.jpg)Observe
    the <link> tag. It has three mandatory attributes:●      rel: Specifies the relationship
    between the linked file and the current file. As the linked file is a CSS file,
    we have to specify "stylesheet" as its value.●      type: Specifies the media
    type of the file that is linked with HTML file. The type of a CSS file is "type/CSS".●      
    href: Specifies the location of the linked file.This is how the <link> tag is
    used to link the external CSS file with an HTML file.![](image_rsrc1XJ.jpg)The
    color of the paragraph and heading is changed to red and blue, respectively.Internal
    CSSSo the external CSS should be preferred if CSS is common for multiple pages.
    But if there is a unique CSS for a single page, use the internal CSS.In this way,
    the CSS is placed inside the <style> tag which, in turn, is placed inside the
    head section.![](image_rsrc1XK.jpg)![](image_rsrc1XJ.jpg)Inline CSSThe third way
    is a bit different. Every HTML tag has an attribute known as the style attribute.
    This attribute is used to specify CSS for a single tag.![](image_rsrc1XM.jpg)There
    are no selectors in inline style.![](image_rsrc1XJ.jpg)Priority orderWhat if the
    same CSS is used for the same HTML element in a single HTML file with all the
    three ways? For example, observe the following HTML file.![](image_rsrc1XN.jpg)There
    is a single <p> tag and internal as well as inline CSS is applied on it. Also,
    example.css is linked with it.![](image_rsrc1XP.jpg)The external CSS is also targeting
    the same property of the <p> tag. But, the value for the color is different in
    all the cases; "blue" in inline, "green" in internal, and "red" in external. What
    do you think will happen? What will be the color of the <p> tag? Let''s see.![](image_rsrc1XR.jpg)The
    color is blue, this means inline CSS has more priority over the other two. Now,
    let''s remove the inline CSS and see, who has more priority among the internal
    and external CSS.![](image_rsrc1XS.jpg)Let''s see what is the color of the <p>
    tag now.![](image_rsrc1XT.jpg)The color is green, so it means the internal CSS
    has priority over the external CSS, right? Let''s interchange the order their
    placement inside the <head> tag.![](image_rsrc1XU.jpg)This time, internal CSS
    is placed before the external CSS.![](image_rsrc1XV.jpg)The color of the <p> tag
    is red. So, the priority among the internal and external CSS depends upon the
    order in which they are placed inside the head section. The CSS which is placed
    later in the head section has more priority.Summary●       There are two parts
    in CSS rule-set - selector and declaration.●      The selector is used to select
    an HTML element(s) while the declaration has the CSS properties and their corresponding
    values.●      A single declaration has a property and its value, separated by
    a colon.●      There can be multiple declarations in a block, each separated by
    a semicolon.●       Three ways of using CSS are external, internal, and inline.●     
    Externally, CSS is written in a separate file with .css extension. The reference
    to the CSS file is written using the <link> tag that is placed inside the head
    section.●      The internal CSS is written using the <style> tag inside the head
    section.●      Every HTML tag has a style attribute and this attribute is used
    for the inline CSS.●       The inline CSS has the priority over other two.●     
    The priority among the external and internal CSS depends on the order of their
    placement inside the head section. The latter placed will be given higher priority.Chapter
    13: CSS selectorsIn the last chapter, we discussed the syntax of CSS. Selectors
    are one of two parts of the CSS rule-set. We discussed how to select an HTML element
    using their tag name. For example, the following CSS example selects all the <p>
    tag in the HTML file.![](image_rsrc1XW.jpg)Now, it does not matter, if there is
    only a single <p> tag in the HTML file or there hundreds, this CSS will be applied
    to all of them. But we do not want to apply the same CSS to all the paragraphs,
    right? Maybe, we want red color for one paragraph and blue for another. Similarly,
    there can be various other scenarios where CSS is needed only on some elements.
    There are different selectors for such scenarios.Id selectorObserve the following
    HTML code.![](image_rsrc1XX.jpg)There are three paragraphs but no CSS is applied
    to them. We have to give different colors to each paragraph. How can we do it?
    We need to select a particular paragraph and apply a particular color to it. To
    do this, the id selector is used.Every element has an "id" attribute. Id given
    to an element should be unique.![](image_rsrc1XY.jpg)Each paragraph has a unique
    id and unique CSS can be applied to each of them using this id.To select an element
    using the id, use the hash (#) sign followed by the id name.![](image_rsrc1XZ.jpg)The
    CSS is applied to the paragraph whose id is "redp".![](image_rsrc1Y0.jpg)The color
    of the paragraph with id "redp" is changed to red. Other are not effects.This
    is how the id selector is used to apply unique CSS to a particular element. Let''s
    give their respective colors to other paragraphs.![](image_rsrc1Y1.jpg)![](image_rsrc1Y2.jpg)Remember,
    an id can never start with a number.class selectorThe id is usually unique for
    an element. But what if we need the same CSS for a group of elements? Not all,
    but some of them. Observe the following HTML file.![](image_rsrc1Y3.jpg)Out of
    all the six paragraphs, first, three should be red in color. We can give the same
    ids to them and it will work. But it is not recommended at all. For such cases,
    we have another attribute, which is known as the "class" attribute.The class selector
    is used to give the same CSS to multiple elements. To use this type of selector,
    use a dot (.) followed by the class name.The same class is assigned for the first
    three <p> tags.![](image_rsrc1Y4.jpg)![](image_rsrc1Y5.jpg)The CSS is applied
    to the first three paragraphs, while others are unaffected.Like id, a class name
    can also not start with a number.Grouping selectorNow, suppose there are few elements
    with have the same definition and we want the same CSS for them.![](image_rsrc1Y6.jpg)![](image_rsrc1Y7.jpg)The
    <p>, <h1>, <h4> tag have same definitions. Observe the code above. Each of them
    has the same CSS defined separately. But why write separate code for each of them
    when the CSS is the same? We can use the class selector, but the class selector
    should be used for the same type of HTML element. In such a case, use the CSS
    grouping selector.The CSS grouping selector is used to group different elements
    so that the same CSS can be applied to them. Just use the element names and separate
    them with comma.![](image_rsrc1Y8.jpg)![](image_rsrc1Y7.jpg)Universal selectorSo
    far, we have discussed how to use the id selector for a particular element, the
    class selector for multiple elements, and the grouping selector for the grouping
    different elements with the same definition. But what if we need the same CSS
    for every element in the HTML file? There is another selector called universal
    selector for such cases.Use the asterisk (*) sign to apply CSS to every element.![](image_rsrc1Y9.jpg)The
    universal selector will apply CSS to every element.![](image_rsrc1YA.jpg)Summary●     
    CSS selectors are used for finding HTML elements to apply CSS on them●      There
    are several types of CSS selectors. The most commonly used are: id, class, group,
    and universal.●      The id selector uses the # (hash) sign with the value of
    id attribute to select an element. As the id is always unique in an HTML document,
    this selector is used to apply CSS on a single element.●      The class selector
    uses the . (dot) with the value of the class attribute to select elements. As
    multiple elements can have the same class, so this selector is used to apply CSS
    to multiple elements.●      The grouping selector is used to apply CSS on a group
    of elements with the same definition.●      The CSS defined with a universal selector
    is applied to all the elements in an HTML document.Chapter 14: CSS text and fontWithout
    CSS, the text is boring. CSS has several properties that can be applied to any
    kind of text, such as paragraphs and headings.The CSS properties for text are
    simple, yet very important. We cannot just add boring text on a web page. We need
    to make enhancements such as adding color, setting alignment , etc.The font is
    another very useful part. We can add text with different font styles, sizes, and
    more using CSS fonts.Colors with CSSIn the recent CSS chapters, we saw how text
    color can be changed using the "color" property. The color property can have three
    types of values - color name, HEX value, and RGB value.![](image_rsrc1YB.jpg)![](image_rsrc1YC.jpg)We
    can also change the background color of the text using the "background-color"
    property.![](image_rsrc1YD.jpg)Similar to the "color" property, the "background-color"
    can also have the color name, HEX value, or RGB value as its value.![](image_rsrc1YE.jpg)Text
    decorationGenerally, text in HTML does not have any decorations. To add decorations
    or to remove the default ones, use the "text-decoration" property.The "text-decoration"
    property can have four values: underline, line-through, overline, and none. The
    first three values add decorations while the last one removes the default decoration.![](image_rsrc1YF.jpg)All
    the three <p> tags have different text decorations - underline for the first,
    line-through for the second, and overline for the third.![](image_rsrc1YG.jpg)If
    there is some default decoration, then we can remove it using "none" as the value
    of "text-decoration".For example, hyperlinks in HTML are underlined by default.
    Let''s remove the underline using the "text-decoration" property.![](image_rsrc1YH.jpg)Text
    decoration is given to the second <a> tag while the first one is unchanged.![](image_rsrc1YJ.jpg)Aligning
    textBy default, the text is always aligned to the left side of the container.
    But we can also change the alignment using CSS.The "text-align" property sets
    the horizontal alignment. It can have four values: left, right, and center.![](image_rsrc1YK.jpg)The
    first paragraph is aligned to the left, which is also the default alignment, the
    second paragraph is aligned to the right, and the third one is aligned to the
    center.![](image_rsrc1YM.jpg)CSS fontsBy using CSS font properties, we can change
    the font family, size, style, and more.Font familyTo change the font family, use
    the "font-family" property.![](image_rsrc1YN.jpg)sans-serif, Impact, and Courier
    are some of the most commonly used fonts in CSS.![](image_rsrc1YP.jpg)Suppose,
    the font we applied is not supported by the browser, then what? Simply add some
    extra fonts separated by commas if the prior ones are not supported by the browser.![](image_rsrc1YR.jpg)xxxx
    is not a font so the browser will not support it. The next font, Impact, separated
    by a comma will be assigned as the value of the font-family.![](image_rsrc1YS.jpg)Font
    sizeThe default size of a <p> tag is 16px (1em). To change the size, use the "font-size"
    property. The value can be in pixels, Em, or percentage.![](image_rsrc1YT.jpg)Every
    <p> tag has a different font size.![](image_rsrc1YU.jpg)Bold fontTo make the font
    bold, use the "font-weight" property.![](image_rsrc1YV.jpg)![](image_rsrc1YW.jpg)Italic
    fontTo make the font italic, use the "font-style" property.![](image_rsrc1YX.jpg)![](image_rsrc1YY.jpg)Summary●     
    The color property is used to change the color of the text.●       To change the
    background of the text, use the background-color property.●      The text-decoration
    property is used to add or remove decorations. It can have four values: underline,
    overline, line-through, and none.●       The text-align property is used to align
    the text horizontally.●      Several CSS font properties are used to manipulate
    font family, size, weight, etc.Chapter 15 - CSS borders, margin, and paddingEvery
    HTML element has a border, margin, and padding. These three terms are important
    because the presentation generally somewhat depends on them.The border, margin,
    and padding is used for clarity and better looks. But before moving to them, you
    need to understand the CSS box model.CSS box modelThe HTML elements are enclosed
    inside a box . This box is knowns as the "CSS Box Model".This model has four parts:
    the border, margin, padding, and content. By default, only content is visible
    while the border is not and the margin and padding are zero.![](image_rsrc1YZ.jpg)●      
    The content can be text, image, etc.●       The content is surrounded by the border.●      
    The area between the content and the border is padding.●       The area outside
    the border is the margin.●      The border can be visible, depends on the CSS.
    But margin and padding are invisible.BorderSo as mentioned above, by default,
    there is no border for HTML elements. The "border-width" property is used to define
    the width of the border. Its value can be in px, cm, pt, em, or the three pre-defined
    values: thin, thick, or medium. Along with border-width, we also need to define
    the style of the border using the "border-style" property. The "border-style"
    property can have values such as solid, dotted, and dashed.![](image_rsrc1Z0.jpg)The
    <p> tag has "border-width" of 2px and solid "border-style".![](image_rsrc1Z1.jpg)Let''s
    try some other variants.![](image_rsrc1Z2.jpg)![](image_rsrc1Z3.jpg)By default,
    the color of the border is black. But it can be changed using the "border-color"
    property.![](image_rsrc1Z4.jpg)The value of the "border-color" property can be
    a color name, HEX value, RGB value, HSL value, or transparent.![](image_rsrc1Z5.jpg)These
    three properties deal with borders, but another property is the shorthand property
    for borders. This property is simply called "border" property and consists of
    the width, style, and color.![](image_rsrc1Z6.jpg)The first <p> tag has all the
    three border properties while the second one has the shorthand property with similar
    CSS.![](image_rsrc1Z7.jpg)Tables with borderIn the HTML section, we discussed
    how attractive tables can be created using CSS.![](image_rsrc1Z8.jpg)This table
    does not have any CSS.![](image_rsrc1Z9.jpg)To add the border, we can use any
    property we discussed. Let''s go with the "border" property.![](image_rsrc1ZA.jpg)To
    create a proper border on a table, we need to apply CSS to the <table> tag as
    well as the <td> tag.![](image_rsrc1ZB.jpg)As of now, the table has a double border.
    To fix this, use the "border-collapse" property and set its value to "collapse".![](image_rsrc1ZC.jpg)![](image_rsrc1ZD.jpg)MarginTo
    understand, we need to create the content inside a <div> tag. This tag is used
    to define a section or division in an HTML document.![](image_rsrc1ZE.jpg)Both
    <p> and <div> tags have border of 2px.![](image_rsrc1ZF.jpg)The area between the
    red line and the black line is the margin for the <p> tag. To set the margin in
    all the directions, we can use the "margin" property.Let''s remove the default
    margin by setting its value to 0px.![](image_rsrc1ZG.jpg)There is no margin now.![](image_rsrc1ZH.jpg)To
    set margin in a particular direction, we have four different properties: "margin-top",
    "margin-bottom", "margin-right", and "margin-left".![](image_rsrc1ZJ.jpg)Margin
    for top and bottom is 10px while it is 20px for left and right.![](image_rsrc1ZK.jpg)The
    "margin" property is actually a shorthand property. We can also use the "margin"
    property to set different margins for each direction.![](image_rsrc1ZM.jpg)Here,
    margin top is 10px, right is 20px, bottom is 30px, and left is 40px.![](image_rsrc1ZN.jpg)Another
    way to use the margin property is by giving only two values.![](image_rsrc1ZP.jpg)Here,
    the value for the top and bottom margin is 10px while the value for right and
    left is 20px.![](image_rsrc1ZR.jpg)PaddingThe area between the content and the
    red line is the padding for the <p> tag.![](image_rsrc1ZF.jpg)The "padding" property
    is used to change the padding.![](image_rsrc1ZS.jpg)![](image_rsrc1ZT.jpg)For
    padding, we also have properties like "padding-top", "padding-bottom", "padding-right",
    and "padding-left". Moreover, the "padding" property is also a shorthand property
    like the "margin" property.Summary●       The CSS box model consists of the border,
    margin, and padding.●      The border can be set using the "border" shorthand
    property or properties like "border-width", "border-style", "border-color".●     
    The "margin" property is a shorthand property used to set margin in various ways.
    To set margin for particular directions, use "margin-top", "margin-bottom", "margin-left",
    or "margin-right".●      The "padding" property is a shorthand property used to
    set padding in various ways. To set padding for particular directions, use "padding-top",
    "padding-bottom", "padding-left", or "padding-right".Chapter 16 - CSS backgroundsBy
    default, every HTML page has a white background. It is boring. There are a few
    CSS properties that can be used to manipulate backgrounds. We can change the background
    color, or add an image to the background.Background colorWe can change the background
    color of any HTML element using the "background-color" property.![](image_rsrc1ZU.jpg)The
    <p> tag has a red background color.![](image_rsrc1ZV.jpg)But generally, "background-color"
    property is used to set the background of the entire page. To do this, we have
    to add the "background-color" property to the body of the page.![](image_rsrc1ZW.jpg)Remember,
    any CSS added to the body will affect the entire HTML page.![](image_rsrc1ZX.jpg)Other
    than the color name, we can also assign HEX value or RGB value as the value of
    "background-color" property.Background imageApart from color, we can also set
    an image as the background using the "background-color" property. Use the url()
    method as its value and pass the link of the image as an argument.![](image_rsrc1ZY.jpg)If
    you are uploading from your machine, then you have to give the exact path or if
    it an image from the internet, give its proper url.![](image_rsrc1ZZ.jpg)The image
    appears in the background but it is not in the proper way. To adjust the image
    properly, we have additional CSS properties.Background repeatIn the above example,
    the background image is repeating. This happens because the image is set according
    to its actual size.To prevent the image from repeating, use the "background-repeat"
    property and set "no-repeat" as its value.![](image_rsrc200.jpg)![](image_rsrc201.jpg)The
    background image is not repeating now.Apart from "no-repeat", we can use "repeat-x"
    and "repeat-y" to repeat the background horizontally and vertically, respectively.Background
    coverStill, the background image does not appear property. It should cover the
    whole window and to do this, use the "background-size" property and set "cover"
    as its value.![](image_rsrc202.jpg)![](image_rsrc203.jpg)This looks perfect now.There
    are other properties such as "background-attachment" that is used to specify if
    the image is fixed or scrollable and "background-position" to set the position
    of the image.Summary●      The "background-color" property is used to set the
    color of the background.●      The "background-image" property is used to set
    an image as the background.●      To adjust the repetition of the background image,
    use the "background-repeat" property. Set its value as "no-repeat" if no repetition
    is required.●      To stretch the image to the whole window, use the "background-size"
    property and set its value as "cover".Chapter 17 - What is JavaScript?So far,
    we have discussed HTML and CSS, and now, we know how to create a web page and
    give styles to it. But still, everything is just a presentation. For example,
    we can create a button using the <button> tag and we can also apply any sort of
    CSS to it. But, nothing happens when the button is clicked. This is static and
    today, websites are dynamic.Things change on a website without reloading the page.
    JavaScript is used to make these HTML elements dynamic.JavaScript is a vast programming
    language. It has too many concepts. From the beginner level to the advanced level,
    there is so much in JavaScript. Then, we have node.js and various frameworks and
    libraries. As mentioned, it is vast and huge. But we don''t need to go this far
    because this is an introduction.The main focus of this section is to explain how
    to use JavaScript with HTML and CSS.We will start from the basics of JavaScript
    such as declaring variables and using functions. Then, we will move to DOM and
    how to use JavaScript with HTML and CSS. But before moving further, let''s discuss
    JavaScript and it''s history briefly.What is JavaScript?By definition, JavaScript
    is a high-level, multi-paradigm programming language. It is one of the core technologies
    of the World Wide Web(WWW), the other two being HTML and CSS. JavaScript is a
    crucial and essential part of web application development. HTML creates a basic
    structure, and CSS transforms it into an attractive version. A website with only
    HTML and CSS is a static website that is of almost no use. But a web application
    is not about structure and presentation, right? The main focus of a website is
    user interaction. Suppose, there is a beautiful button on a web page, but if nothing
    happens when clicked, it is useless. You can make a button work by applying JavaScript
    on it. If you need a dynamic website, you need to use JavaScript with HTML and
    CSS.History of JavaScriptIn the early to mid-1990s, the web was young and everything
    was static. HTML was the only web at that time. People soon realized that the
    web cannot be static only, it needs to be dynamic and there should be features
    like animations, and interactions. To make the web dynamic, Dom manipulation was
    required, and for it, a scripting language was needed. But at that time, Java
    was emerging in the web community. So the developers decided, why not create a
    simple scripting language for designing while the heavy tasks were left for Java.Brendan
    Eich created JavaScript in the year 1996 when he was working at Netscape communication.
    JavaScript was created in only ten days. It was not supposed to be what is today.Summary●     
    JavaScript is one of the core technologies of the World Wide Web(WWW).●      
    It is used to create dynamic websites.●       It was created by Brendan Eich in
    1996.Chapter 18 - Basics of JavascriptJavaScript is a vast programming language
    that covers several concepts and most importantly, many of these concepts in different
    ways. We are not learning JavaScript in this course, but it is necessary to discuss
    some of the basics, such as variables, and functions.Before starting Javascript
    with HTML and CSS, let''s go through some of the basics of Javascript programming
    language.Variables, data types, and operatorsVariablesLet''s start with one of
    the most basic terms used in programming - variable.A variable is defined as a
    container that is used to hold values.![](image_rsrc204.jpg)x, y, and z are three
    variables that are declared using the "var" keyword. Two other keywords can also
    be used to declare variables - let and const.As of now, these variables do not
    hold any values. To initialize them, We use the assignment operator(=).![](image_rsrc205.jpg)Declaring
    a variable with values is called initializing. We can also change these values
    later by using the assignment operator.![](image_rsrc206.jpg)Data typesA variable
    holds data. Several types of data can be stored in a variable. In the above example,
    All the variables were holding numerical values. We can also store single-precision
    numbers, double-precision numbers, strings, boolean values, objects, date, etc,
    in a variable. These are different data types used in the programming world. A
    data type indicates the characteristics of the data stored in a variable.In the
    other programming languages such as Java, it is mandatory to specify the data
    type of a variable while declaring, and moreover, a variable can hold only that
    type of data. But there are no such restrictions in Javascript.Data types in Javascript
    are divided into two categories - Primitive and Non-primitive.Following is the
    list of Primitive data types:●       Number●       String●       Boolean●      
    Undefined![](image_rsrc207.jpg)Following is the list of non-primitive data types:●      
    Object●       Array●       Date![](image_rsrc208.jpg)If you have knowledge of
    any popular programming language, you will easily understand all these data types.FunctionsWhile
    coding, we may face situations when we need to execute the same code at different
    times. For example, we need to find the sum of two numbers five times in a program.
    The numbers are different every time. we need to write the same logic for five
    times throughout the program. It will work fine, but do we think it is efficient?
    The answer is no. It is not efficient because writing the same part again and
    again, not only increases the length of the code but also the time and effort.
    Here enters the concept of functions.Functions are called the main building blocks
    of a program. They provide code reusability and helps reducing time and effort.For
    the above example, we can create a function, that accepts two values and returns
    their sum. we can call this function anytime anywhere we want. Thus removing the
    need for repetition.Functions are one of the most important parts of programming.
    Almost every language has the concept of functions. In this chapter, we will discuss
    all about functions in JavaScript.Declaring a functionTo create a function in
    JavaScript, we need the ''function'' keyword . Observe the following JavaScript
    code.![](image_rsrc209.jpg)A function in JavaScript is declared using the ''function''
    keyword followed by the name of the function and two parentheses. In the above
    code, the name of the function is ''demoFunction''. we can also see parenthesis
    attached to it. These parentheses can be empty or can have parameters. We will
    discuss the parameters later in the lesson. Currently, there are no parameters
    for this function.The body of the function is written inside the curly brackets,
    similar to if and switch statements.Calling a functionDeclaring a function is
    not enough. Nothing will happen until the function is called.To call a function,
    simply write the name of the function with the parenthesis.![](image_rsrc20A.jpg)Let''s
    execute the above code and check the output.![](image_rsrc20B.jpg)The function
    is executed once because I called it only a single time.The main objective of
    using functions is to avoid code repetition and offer better code reusability.
    Let me show how this is possible with functions.![](image_rsrc20C.jpg)The demoFunction()
    is called three times.![](image_rsrc20D.jpg)The console statement inside the demoFunction()
    is executed three times while actually, it was written once. This is the benefit
    of using functions. Create a function and call it anytime and anywhere we want.Parameterswe
    can always pass data to a function. The data is passed as parameters or also known
    as arguments. Let''s go to the example we were discussing earlier in this lesson.![](image_rsrc20E.jpg)Observe
    the add() function. we can see, it has two parameters - a and b, which are then
    used inside the function body. Similarly, we need to pass the values of these
    parameters while calling the function.![](image_rsrc20F.jpg)The value of a is
    10 and b is 20\. Let''s check the output.![](image_rsrc20G.jpg)we can also pass
    the variables to a function as parameters.![](image_rsrc20H.jpg)But remember,
    the names of parameters in the function declaration have no relation with the
    name of the variables passed as the parameters while function calling.![](image_rsrc20J.jpg)●     
    During the first function call - add(a,b), the value of a in the add() function
    is 10 and b is 20.●      During the second function call - add(b,a), the value
    of a in the add() function is 20 and b is 10.![](image_rsrc20K.jpg)Summary●      
    A variable can be declared using var, let, or const keywords.●       To assign
    a value to a variable, use the assignment operator.●      There are two categories
    of data types in JavaScript - Primitive and Non-primitive.●       The primitive
    data types consist of Number, String, Boolean, and Undefined.●       The Non-primitive
    data types consist of Object, Date, and Array.●      Functions are the code of
    blocks that are used for code reusability.●      A function is created using the
    function keyword and it can be called any number of times using the function name.●      
    The values passed to a function are called parameters.Chapter 3 - DOMDOM stands
    for Document Object Model . It is a very important concept on the road to becoming
    a web developer. So in this chapter, we will discuss what is DOM and how it is
    used with JavaScript.What is DOM?When the HTML file is loaded into a browser,
    a tree-like structure is created. This structure has various nodes , and these
    nodes represent various elements of the HTML document.![](image_rsrc20M.jpg)The
    DOM structure of the HTML document will look like the following structure.![](image_rsrc20N.jpg)The
    structure starts from <html> tag, that is also the root element. Then, <head>
    and <body> are two different nodes. In the body, there is a <p> tag which is a
    node of the <body> tag.The tree structure will grow as the more tags are added
    in the HTML document.Use of DOMSo far, we created HTML documents using various
    tags and then applied CSS. Everything is still static. Once loaded in the browser,
    nothing changes. But websites are not like that.Suppose, there is a button and
    when clicked on that button, something happens. Say, the button click changes
    the text of a <p> tag. This is done by manipulating DOM with the help of JavaScript.
    In simple words, JavaScript is used to create dynamic HTML by making changes in
    the DOM tree.Take the above example. To change the content of the <p> tag, we
    will use JavaScript to access that node, and then by using various DOM methods,
    it is manipulated accordingly.With JavaScript, we can manipulate almost everything
    in HTML such as content, styles, even add new elements and remove the existing
    ones.Summary●      DOM is a tree-like structure that is created when an HTML document
    is loaded in a browser.●       Every node of a DOM tree represents an HTML element.●     
    DOM can be manipulated to make dynamic changes in an HTML document.Chapter 20
    - HTML events and JavaScriptHTML eventsHTML events are attributes that are used
    to make something happen. For example, a button click popping a message. Another
    example is, popping a message when page loads or when the input changes.HTML events
    are very important because they are used to convert the static HTML elements into
    dynamic. One of the most important uses of these events is that JavaScript functions
    can be triggered using them. Although a very basic DOM manipulation can be done
    using HTML, serious manipulation is done using functions. This is why HTML events
    are very important.There are several HTML events. They are divided into different
    categories:●       Keyboard events●       Mouse events●       Drag events●      
    Form events●       Windows events●       Media events●       Clipboard eventsFurther,
    there are several events in each of these categories. The main focus of this chapter
    is to understand, how to use these events to trigger something.Triggering alert()The
    alert() function is pop up that appears on the screen with a message. Let''s see
    how can we trigger a pop up using the onclick mouse event.Mouse events are one
    of the most commonly used HTML events. These events are triggered when the user
    does something with the mouse. For example, clicking on something, double-clicking
    on something, hovering over something, and many more.The onclick event is the
    most basic HTML event. As the name suggests, this event triggers something when
    an element is clicked on.![](image_rsrc20P.jpg)As mentioned earlier, HTML events
    are attributes. So the button above has an onclick event and its value is an alert()
    function. Remember, the value of an HTML event is always written inside quotes.
    The value will be triggered when the button is clicked.![](image_rsrc20R.jpg)The
    pop up appears when the button is clicked. So this example was to give you a basic
    understanding of how HTML events are used.Triggering a functionIn the real-time,
    events are used to trigger JavaScript functions.Generally, complicated things
    such as DOM manipulation require some kind of coding logic and there can be multiple
    lines of code. So it is not possible to write all these lines in the HTML, and
    that is why HTML functions are used.Let''s put the alert() into a function.![](image_rsrc20S.jpg)The
    function is placed inside the <script> tag , in fact, all the JavaScript is placed
    inside this tag only or in a separate JavaScript file. To trigger this function,
    we have to give it as the value of the onclick event.![](image_rsrc20R.jpg)This
    is how we trigger a function using HTML events. In the upcoming chapter, we will
    use the same concept to work with DOM.Commonly used HTML eventsLet''s discuss
    some of the commonly used HTML events categorically.Mouse events●       onclick
    - triggers on the single click of the mouse.●       ondblclick - triggers on the
    double click of the mouse.●       onmouseover -  triggers when the mouse moves
    over an element.●      onwheel - triggers when the wheel of the mouse moves over
    an element.Keyboard events●       onkeydown - triggers when a key is being pressed.●      
    onkeypress - triggers when a key is pressed.●       onkeyup - triggers when a
    key is released.Window events●       onload - triggers when a window is completely
    loaded.●       onunload -  triggers when a window is closed.●       onresize -
    triggers when a window is resized.Form events●       onchange - triggers when
    the value of an element is changed.●       onsumbit - triggers when a form is
    submitted.●       onreset - triggers when a form is reset.Drag events●       ondrag
    - triggers when an element is dragged.●      ondrop - triggers when an element
    that is being dragged is dropped.Summary●      HTML events make something happens.
    They are used just like other attributes.●      Different types of HTML events
    are mouse, keyboard, drag, window, media, and form events.●      The value of
    an event is written inside the quotes. What will happens next depends on the value.●     
    Generally, functions are triggered using HTML events because they can have multiple
    lines of codes inside them.Chapter 21 - Finding elementsTill now, we discussed
    JavaScript, DOM, and HTML events. These three concepts are necessary if you want
    to understand DOM manipulation properly.In this chapter, we will discuss two very
    important concepts - finding elements using various methods and the innerHTML
    property.innerHTML propertyTo manipulate any HTML element or its value, we first
    need to find it. We cannot do anything if we do not have the link of the HTML
    elements in the JavaScript of the HTML file. For this, there are few methods,
    that we will discuss next, but first need to understand the innerHTML property.The
    innerHTML property is used to get the access to content of the HTML elements.
    The methods will only find the element, but its value is accessed using the innerHTML
    property only.![](image_rsrc20T.jpg)With the methods, we can find the <p> tag,
    but the content, i.e. "This is a paragraph." is accessed using the innerHTML property.Ways
    to find HTML elementsThere are three ways of finding HTML elements●       document.getElementById()●      
    document.getElementsByTagName()●       document.getElementsByClassName()document.getElementById()The
    document.getElementById() method is the most common way to find HTML elements.The
    value passed to the document.getElementById() method is the id of the element
    that we want to find.![](image_rsrc20U.jpg)In the HTML, the id of the <p> tag
    is passed to the method and then, the value is stored inside a variable named,
    ele. The console statement in the next line prints the value of ele. Let''s check.![](image_rsrc20V.jpg)The
    value in the console appears after clicking the paragraph and it is nothing but,
    the <p> tag itself.To access the content, we will use the innerHTML property.![](image_rsrc20W.jpg)Let''s
    again check the console.![](image_rsrc20X.jpg)This time, the value of the variable
    is equal to the content of the <p> tag.So, this is how a method and innerHTML
    are combined to get the content of an element.document.getElementsByTagName()The
    second way is to find elements by the tag name.![](image_rsrc20Y.jpg)There are
    three <p> tags and document.getElementsByTagName() will find all of these. Let''s
    check the console.![](image_rsrc20Z.jpg)The document.getElementsByTagName() returns
    an array with all the elements. Similarly, the innerHTML property will also return
    an array with all the content.document.getElementsByClassName()Similar to the
    document.getElementsByTagName() method, the document.getElementsByClassName()
    method is also used to find multiple elements. It uses class name to find elements.![](image_rsrc210.jpg)It
    also returns an array.![](image_rsrc211.jpg)Summary●      The innerHTML property
    is used to get the content of and element.●      There are three ways to find
    elements in HTML - document.getElementById(), document.getElementsByTagName(),
    and document.getElementsByClassName().●      The document.getElementById() method
    finds an element using the id of that element.●       The document.getElementsByTagName()
    method find elements using the tag name.●       The document.getElementsByClassName()
    method find elements using the class of the elements.Chapter 22 - Content and
    CSS with JavaScriptLet''s move further and discuss, how can we change the content
    and CSS of HTML elements.Changing content using innerHTML propertyIn the last
    chapter, we discussed how the methods like document.getElementById() can be combined
    with innerHTML property to access an element''s content. The main usage of this
    property is to change the content.![](image_rsrc212.jpg)This is a dynamic HTML
    page. The page has a button and a paragraph. Clicking on this button will replace
    the text of the paragraph.Before the button is clicked:![](image_rsrc213.jpg)After
    the button is clicked:![](image_rsrc214.jpg)Let''s see what is happening here.First,
    the document.getElementById() method is used to find the <p> tag. Its reference
    is stored in a variable named, ele. Then, this reference is used with innerHTML
    property to assign a new value to it. And everything is done, when the demo()
    function is triggered after the button is clicked.The case in other two methods
    - document.getElementsByTagName() and document.getElementsByClassName() is different.
    The id is always unique in a HTML document, so document.getElementById() selects
    only a single element, but there can be multiple tags or multiple tags with same
    class name. So document.getElementsByTagName() document.getElementsByClassName()
    stores the found elements in an array and we have to access them accordingly.
    Let''s see how to do it.![](image_rsrc215.jpg)There are three <p> tags. In demo()
    function, document.getElementsByTagName() method is used to find them. It will
    end up find all the <p> tags. We can''t access them like we did in the case of
    document.getElementById() method. We have to access them using the index.The first
    <p> is on the 0th index, the second is on the 1st index, and goes on. In the above
    example, the text of the first <p> tag is replaced by using the innerHTML property
    on the <p> tag that is on the 0th index.Before the button is clicked:![](image_rsrc216.jpg)After
    the button is clicked:![](image_rsrc217.jpg)Similarly, other <p> tags can be accessed
    using their respective indexes.Changing values of the attributesIt is also possible
    to change the value of an attribute with JavaScript. There is no special property
    to change an attribute''s value. We can simply use the property name after finding
    the element and assign it a new value.Suppose, there an image on the page and
    When clicked on it, a new image replaces the old one. To do this, we need to assign
    a new value to the src attribute of the <img> tag.![](image_rsrc218.jpg)Here,
    the onclick() event is used on the <img> tag. In the demo() function, first, the
