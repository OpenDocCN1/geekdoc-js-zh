    color property is applied to it with a new value.Before clicking on the paragraph:![](image_rsrc21C.jpg)After
    clicking on the paragraph:![](image_rsrc21D.jpg)Summary●      The innerHTML property
    is used to change the content of an HTML element.●      To change the value of
    an attribute, use the attribute name, and assign the new value.●      The CSS
    can be changed by using the style attribute and then applying the property with
    the new value.Chapter 23 - Creating and removing elementsEvery element in an HTML
    document is represented as a Node in the DOM tree. In the last chapter, we discussed
    how to update the content of an existing element. But with JavaScript, we can
    also add new elements and remove the existing one.There are a few methods that
    are used to create or remove elements. In this chapter, we will discuss how to
    use these methods in JavaScript.document.createElement()As the name suggests,
    the document.createElement() method is used to create an HTML element.![](image_rsrc21E.jpg)The
    document.createElement() method is used to create a <p> element. The element name
    should be passed to this method. Now, we have a <p> tag but there is no content
    in it yet. The next step is to use the document.createTextNode() method to create
    a text node.As of now, we have a new element and the content that is to be added
    to it. But this newly created element is not added in the HTML document. It is
    not present in the DOM tree.To add this to the DOM, We have a separate method.appendChild()In
    the last example, we create two nodes - <p> tag and the text. We have to append
    the <p> to the HTML document, but first, we need to append the text node to the
    newly create <p> tag.The appendChild() method appends a new node as the last child
    node. So let''s append the text node to the <p> tag and then, we will append this
    whole element as one of the last child nodes in the HTML document![](image_rsrc21F.jpg)Now,
    we have a complete <p> tag. But still, it is not present in the HTML document.The
    <body> tag has <div> as a node, and in turn, the <div> tag has a <button> as its
    node. Now, we will append this newly created <p> tag as a child node of the <div>
    tag using the appendChild() method. This means, we have to invoke the appendChild()
    method on the <div> tag and for this, first we need to find this <div> tag.![](image_rsrc21G.jpg)First,
    the <div> tag is located using the document.getElementById() method and then,
    the new node is appended to it using the appendChild() method.Before the button
