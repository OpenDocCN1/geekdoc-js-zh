  md: 'issues, today''s web designer can focus on the standards and be fairly certain
    that her site will appear as expected for most people.


    # Should You Design for Older Browsers?


    There has long been a debate about whether web designers should ensure that pages
    display well on older browser versions. In some cases, your client might dictate
    how you approach this deate. After all, if someone is paying you to design a site,
    they will likely make the choice about designing for older browsers. However,
    if you''re designing your own site or being asked for input from a client, you
    have a choice to make: Should you design to the standards or design to older browsers?


    In my opinion, designing to standards is a better choice. As you can clearly see
    by reading the opening section to this chapter, the Web evolves quickly. If you
    spend effort designing for specific browser versions, your work will quickly become
    outdated as people move to newer versions. It''s a simple race you cannot win.


    By focusing on web standards, you ensure that your site work well today and into
    the future. Browser developers spend considerable development ensuring browsers
    are backward compatible. The standards of today will work well in browsers for
    many years to come.


    # Compatibility Features in Expression Web


    Expression Web has many features designed to help you create standards-compliant
    sites. The most important feature offered by Expression Web is its capability
    to create standards-compliant code automatically. Because of that, you are free
    to work on your site without worrying about what''s going on the hood. However,
    what if you''re working on a site that was originally created in another application?
    Fortunately, Expression Web offers features to help you identify and correct inherited
    code problems as well.


    # Identifying Code Problems


    Expression Web has a few ways of notifying you when a code problem exists. Among
    these are the status bar, marking invalid code in Code View, and compatibility
    reports.


    > The status bar displays an icon when it finds incompatible code or a code error
    (see Figure 12.12). For example, if an HTML table is missing the closing </table>
    tag, Expression Web informs you that a code error has been detected. Other errors
    can be subtler, such as properly closed tags in an XHTML-compliant document.


    The icon indicating incompatible code appears only when in Code View or Split
    View. The Error icon appears in all views when a code error is present.'
