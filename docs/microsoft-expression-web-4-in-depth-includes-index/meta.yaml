  md: "# The frame Attribute\n\nThe frame attribute provides for more granular control\
    \ over how the border of a table is rendered. Without a border, the *frame* attribute\
    \ has no effect.\n\nThe frame attribute can be configured in the Tag Properties\
    \ panel and can have any one of the following values:\n\n+   * above—The border\
    \ across the horizontal top of the table appears in the browser. Other borders\
    \ are ignored.\n* below—The border across the horizontal bottom of the table appears\
    \ in the browser. Other borders are ignored.\n* border—A border is drawn around\
    \ the table as a box. This setting produces the same output as the box setting.\n\
    * box—A border is drawn around the table as a box. This setting produces the same\
    \ output as the border setting.\n* hsides—A border is drawn on the horizontal\
    \ sides of the table. In other words, a border will be visible across the top\
    \ and bottom of the table.\n* lhs—A border is drawn on the left side of the table.\
    \ (*lhs* stands for left-hand side).\n* rhs—A border is drawn on the right side\
    \ of the table. (*rhs* stands for right-hand side).\n* void—A border is not drawn\
    \ around the table. Even if a border is explicitly set on the table tag, if the\
    \ *frame* attribute is set to *void*, the border will not appear.\n* vides—A border\
    \ is drawn on the vertical sides of the table. In other words, a border will be\
    \ visible along the left and right sides of the table.\n\n> note Although the\
    \ frame attribute isn't deprecated, many designers prefer to use the CSS border\
    \ properties. w3.org/TR/REC-CSS2/tables.html#borders for specific information.\n\
    \n# Rows, Columns, and Cells\n\nNow that you're familiar with the markup of the\
    \ `<table>` tag, it's time to dig into the other tags that make a table.\n\nAn\
    \ HTML table is really just a collection of rows and columns. Rows are defined\
    \ by `<tr>` tags, and columns are defined by `<td>` tags. `<td>` tags cannot exist\
    \ outside a `<tr>` tag. The code in Listing 5.2 defines a simple HTML table containing\
