  md: '# USING PAGE VIEWS


    # Introduction to Page Views


    What you see is what you get (WYSIWYG) web design products are supposed to keep
    you from having to worry about HTML code, but anyone who has spent any amount
    of time working with a WYSIWYG tool knows that''s not practical to ignore the
    code. Fortunately, Expression Web provides three different views of your page
    so you can work with the way you want: Design View, Code View, and Split View.


    You''ll likely use Design View most often. It shows a view of your page as it
    will appear in a web browser. Using Design View, you can easily edit text, graphics,
    hyperlinks, and other content and arrange it in a WYSIWYG environment.


    Code View shows the underpinnings of your page—the code. Expression Web offers
    color coding, line numbering, IntelliSense, and other tools to make it easy and
    efficient to work in this view. Chances are is where you will go to tweak code
    that Expression Web has already added, but you can add code from scratch as well.


    Split View is a combination of Design View and Code View. Split View divides the
    Expression Web interface into two panes, one on top of the other. One pane displays
    the page in Design View, and the other displays the page in Code View. Separating
    the two panes is a movable called the split so you can decide how much screen
    real estate each view occupy.


    Adding content in Design View is primarily covered in Chapter 3, "Creating Pages
    and Basic Page Editing," but in this chapter, you can go over some of the features
    on the View menu in Expression Web and cover Code View and Split View.'
  merge: -1
  pgno: 87
