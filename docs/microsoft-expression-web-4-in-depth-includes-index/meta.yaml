- img_proc: false
  md: '# Formatting Text


    Adding text to a page in Expression Web is simple to creating a document in your
    favorite word processor. Many of the same tools are available.


    I''m not going to go into the details of basic text formatting because I''m sure
    you already know how to bold and italicize text. Instead, I will explain how to
    work with HTML-specific formatting.


    # How Expression Web Formats Text


    Before you start formatting text in your page, you should become familiar with
    how Expression Web applies formatting. Because Expression Web is designed to create
    standards-compliant sites, it often uses CSS to apply formatting. How it goes
    about so is based on the CSS Mode setting.


    The current CSS Mode setting is displayed using an icon in the status bar when
    a page is open. To adjust the CSS Mode setting, click the CSS Mode icon on the
    status bar and select the desired mode, as shown in Figure 3.3.


    By default, the CSS Mode is set to Auto. In this mode, Expression Web applies
    formatting rules that are configured on the CSS tab of the Page Editor Options
    dialog.


    +   * For information on using the CSS tab in the Page Editor Options dialog,
    see Chapter 11, "Configuring Page Editor Options."


    ![](bbox=[0.087154, 0.506731, 0.753837, 0.902337])'
  merge: -1
  pgno: 70
- img_proc: false
  md: '# Formatting Text


    When the CSS Mode setting is Manual, Expression Web automatically displays the
    Style Application toolbar shown in Figure 3.4. The Style Application toolbar allows
    you to specify how to apply styles when edits are made.


    Figure 3-4

    nYou can control how styles are applied by setting the CSS Mode to Manual and
    using the own toolbar.


    Target Rules: (New Inline Style) Reuse Properties Show Overlay


    When the CSS Mode setting is set to Auto (the default), you are at the mercy of
    Expression Web when it comes to where CSS styles get defined. In many cases, that''s
    a suitable situation. However, you might want more granular control over where
    styles are created. For example, you might have a CSS file attached to the current
    page, and you may want to ensure that all newly created styles are created inside
    that CSS file.


    By setting the CSS Mode to Manual, you can use the Style Application toolbar to
    specify where new styles are created by selecting the Target Rule drop-down in
    Figure 3.4. Based on what is currently selected, the following options are available
    in the Target Rule drop-down.


    +   - An Existing CSS Element—If the selected page already has a CSS class or
    ID applied to it, you can select the CSS ID or class from the Target Rule drop-down.
    If you make modifications to the selected element, Expression Web modifies the
    class or ID applied to it.


    +   - Inline Style—If the element has an inline style applied to it, selecting
    Inline Style from the Target Rule drop-down causes the inline style to be modified
    when formatting is changed.


    +   - New Auto Class—Causes Expression Web to create a new, auto-generated CSS
    class for any formatting changes that are applied. Expression Web creates the
    new class in an embedded style sheet inside the current page.


    +   - Apply New Style—Allows you to create a new style using the New Style dialog.
    The location for the new style can be specified in the New Style dialog.


    > For more information on creating and editing CSS styles, see Chapter 17, "Creating
    Style Sheets."


    > tip

    Font families that you create are used in the Font dialog, the Font drop-down,
    and in IntelliSense, which is displayed when editing HTML and CSS code.'
  merge: -1
  pgno: 71
- img_proc: false
  md: '# Font Families


    In a word processing application, the font you apply to text will always be the
    font the viewer of the document sees. Web pages do not work that way. For you
    to to see text formatted in a particular font on a page, font must be installed
    on your machine. If it''s not, the browser substitutes a font for you.


    It''s a good idea to specify a series of fonts to use and specify a generic font
    (such as sans-serif and monospace) as the last choice. By doing this, if a visitor
    to your site doesn''t have the next font in the first list listed, the browser
    attempts to use the next font and so on. You can easily configure fonts in Expression
    Web by selecting Format, Font to display the Font dialog shown in Figure 3.5.
    Alternatively, you can use the Font drop-down on the main toolbar.


    > Some fonts are installed on almost all computers; Arial, Helvetica, and other
    common sans-serif fonts are considered the safest of all fonts. Times New Roman
    (a serif font) is another common font. It is the Expression Web uses by default.


    ![](bbox=[0.058, 0.396, 0.636, 0.781])


    The Font dialog lets easily choose a font family and otherwise modify the appearance
    of text.


    For information on customizing and configuring font families, see Chapter 11,
    “Configuring Page Editor Options."'
  merge: -1
  pgno: 72
- img_proc: false
  md: "# Font Sizes\n\nFont size is one of things many developers take for granted.\
    \ Many Web designers say you should always use pixel dimensions (for example,\
    \ 12 px) for font sizes. In fact, if you want your site to be as user-friendly\
    \ and accessible as possible, you should use relative sizes.\n\n+   * Complete\
    \ details on making your site compliant with accessibility standards, see Chapter\
    \ 12, \"Maintaining Compatibility and Accessibility.\"\n\nWhen you use Font Size\
    \ drop-down on the toolbar or adjust the font size using the Font dialog, Expression\
    \ Web automatically uses relative sizes. The following code shows a CSS style\
    \ that defines a relative size that equates to approximately 14-point type:\n\n\
    ```\n.mainText {\n  font-size: medium;\n}\n```\n\n+   * For information on CSS\
    \ styles, see Chapter 17, \"Creating Style Sheets.\"\n\nUsing relative fonts is\
    \ a good idea because it gives your visitor control over the size of the text.\
    \ When you change the text size in your browser, that is sized with a relative\
    \ font size res accordingly while that is sized with an absolute size remains\
    \ the same size.\n\n# Creating Hyperlinks\n\nExpression Web provides tools to\
    \ create hyperlinks quickly and easily. To create a hyperlink, select the text\
    \ or graphic you'd like to use for the link and then select Insert, Hyperlink\
    \ to display the Insert Hyperlink dialog shown in Figure 3.6.\n\nFigure 3.6\n\
    The Insert Hyperlink dialog contains all the tools needed to create your hyperlinks.\n\
    \n![](bbox=[0.345, 0.658, 0.924, 0.893])\n\n> tip\nYou can also right-click the\
    \ selection and select Hyperlink from the menu to display the Insert Hyperlink\
    \ dialog."
  merge: -1
  pgno: 73
- img_proc: false
  md: '# Creating Pages and Basic Page Editing


    Along the left edge of the Insert Hyperlink dialog are four buttons that define
    the type of hyperlink to create. By default, File or Web Page is selected. You
    can also choose to create a link to a place in the current document (an HTML bookmark),
    a link to a new document, or an email address.


    > tip

    to open a new window that is a specific size or at a specific position, do not
    use a hyperlink target. Instead, use the Open Browser Window behavior as you can
    fully control the new window.

    New windows opened using this method can be named with any name you choose, and
    you can use that as the target for any hyperlinks you want to load in the window.


    # Targeting Hyperlinks


    By default, hyperlinks to other pages or other sites load into the current browser
    window. In many cases, that might be exactly what you want, especially when linking
    to files within your site. However, if you are linking to another site or have
    some other reason for wanting the page to be available after someone clicks your
    link, you need to override that default behavior.


    To change the window in which a hyperlink opens, specify the target for the hyperlink.
    Click the Target Frame button in the Insert Hyperlink dialog to display the Target
    Frame shown in Figure 3.7. Expression Web provides a list of common target frames,
    but you can also specify your own frame name when you are targeting a specific
    frames page.


    +   - For more information on using frames, Chapter 6, "Using Frames"

    - For more information on using the Open Browser Window behavior, Chapter 21,
    "Using Behaviors.",


    # Hyperlink Parameters


    When you''re using ASP.NET, PHP, or another server-side technology, you might
    need to pass information to the web server in a hyperlink in the form of a query
    string. A query string is appended to the end of a hyperlink as a series of names
    and values. Code that runs on the web server can access the values that are passed
    by referencing the name in the query string.


    The following hyperlink passes a value called prod with a value of 6:


    ```

    cool.aspx?prod=6

    ```


    Note that a question appears before the query string value.


    You can easily create a query string in Expression Web by clicking the Parameters
    button in the Insert Hyperlink dialog. Doing so displays the Hyperlink Parameters
    dialog. In Figure 3.8, you see the hyperlink parameter that created the hyperlink
    previously.


    The Hyperlink Parameters dialog is convenient if you have a lot of parameters
    and to work with them often, but I find it just as easy to type parameters manually.'
  merge: -1
  pgno: 74
- img_proc: false
  md: '# Creating Hyperlinks


    # Figure 3-7


    The Target Frame dialog lets you easily specify a target for a hyperlink.


    ![](bbox=[0.056, 0.127, 0.942, 0.358])


    # Figure 3-8


    The Hyperlink dialog allows you to create query string parameters in a hyperlink.
    It''s actually just as easy to enter them into the hyperlink text.


    ![](bbox=[0.056, 0.413, 0.942, 0.673])


    # HTML Bookmarks


    Most hyperlinks take you to the top of the page to which it is linked, but you
    can also link to a specific point in a page using an HTML bookmark.


    An HTML bookmark defines a point within a document. To create a link to an HTML
    bookmark, you must first create the bookmark in the page. Place the insertion
    point on the line where you want the bookmark, and then select Insert, Bookmark
    to display the Bookmark dialog shown in Figure 3.9.


    > tip HTML bookmarks are often used on FAQ pages so readers can easily navigate
    directly to a specific place in the page.'
  merge: -1
  pgno: 75
- img_proc: false
  md: 'After a bookmark has been created, you can link to the bookmark using the Bookmark
    button in the Insert Hyperlink dialog to display the Select Place in Document
    dialog, as shown in Figure 3.10. Select the bookmark for your hyperlink to link
    to that point in the document.


    You can link to bookmarks on pages in external sites as well. When you click the
    Bookmark button, Expression Web parses the remote page for bookmarks and displays
    them in the Bookmark dialog.


    ![](bbox=[0.056, 0.233, 0.323, 0.433])


    Figure 3.9

    HTML bookmarks are managed in the Bookmark dialog and allow you to link to a specific
    point within a page.


    ![](bbox=[0.056, 0.487, 0.413, 0.722])


    Figure 3.10

    Expression Web lists all bookmarks on the page you''re linking- to so you can
    select the correct point for your hyperlink.


    # Hyperlink Screentips


    To make your page accessible, include a title attribute for all your links. The
    title attribute is configured using the ScreenTip button in the Insert Hyperlink
    dialog. The text you enter for the ScreenTip appears as a pop-up when a site visitor
    hovers over the link. It will also be read by screen readers.


    > tip

    Expression Web notes that ScreenTips are supported by Internet Explorer 4.0 or
    greater. In fact, ScreenTips are supported by all current browsers and are part
    of the HTML specification.'
  merge: -1
  pgno: 76
- img_proc: false
  md: '# Spell-Checking


    Nothing ruins a professional appearance faster than spelling errors. Even if you''re
    not a bad spiller, you''re bound to make a mistake or two, so having background
    spell-checking is convenient.


    By default, Expression Web does not check your spelling as you type. If you want
    to check your spelling, select Tools, Spelling, Spelling. If Design view is active,
    Expression Web checks the spelling in the active document. If one or more folders
    are selected in the Folder List, Expression Web gives you the choice of spelling
    for the page(s) or for your entire site.


    Expression Web underlines lines it believes to be misspelled with a red line.
    Right-clicking the underlined text presents you with a menu, allowing you to ignore
    the problem or take some action to correct it.


    ![](bbox=[0.073, 0.333, 0.133, 0.383])


    # Spelling Errors Not Underlined


    If you notice a few words that are definitely misspelled in your site but Expression
    Web did not underline them with a red line, Expression Web is likely configured
    so spelling errors are not visible.


    You can also configure Expression Web so that it checks your spelling as you type.
    To do, select Tools, Spelling, Spelling Options and make sure Check Spelling As
    You Type is checked and make Spelling Errors is not checked (see Figure 3.11).
    You can also set other spelling options from this dialog and edit your dictionary.


    > tip Unlike previous versions of Expression Web, Expression Web 4 does not share
    a dictionary with Microsoft Office applications.


    Figure 3.11

    spelling options are configured in the Spelling Options dialog. From here, you
    can also edit your custom-dictionary.


    ![](bbox=[0.393, 0.647, 0.912, 0.923])'
  merge: -1
  pgno: 77
- img_proc: false
  md: '# Configuring Page Properties


    Properties for a specific page are configured with the Page Properties dialog.
    You can access page properties by opening a page and selecting File, Properties.


    The Page Properties dialog has five tabs.


    # General Tab


    The General tab allows you to easily configure the page title, description, keywords,
    and other general information (see Figure 3.12).


    ![](bbox=[0.065, 0.355, 0.903, 0.626])


    Figure 3.12

    The General tab in the Page Properties dialog provides settings for page title
    and other general settings.


    The title you enter in the General tab displays in the title bar of the web browser
    when the page is viewed. The description and keywords you enter are as META tags
    on the page to aid in search indexing.


    You can also specify a base location, also known as a base href. The base href
    is the base URL for the page. If you enter http://www.mysite.com/products as a
    base href, a link points to software.htm will actually link to http://www.mysite.com/products/software.htm.
    This is convenient when your site''s directory structure changes often. Using
    a base href, you can easily update the absolute location of all links by changing
    one property of the page.


    The Default Target Frame property allows you to specify a default frame for links
    that don''t explicitly specify a frame. This is most often used when you want
    links on a particular page to open in a new window. By setting the default target
    to New Window, you can force all links to open in a new window by default.'
  merge: -1
  pgno: 78
- img_proc: false
  md: 'A background sound can also be set on the General tab. The sound is then played
    when the page is loaded. You can also choose to loop the sound specific number
    of times or infinitely. Keep in mind that most people find background sounds annoying
    and are likely to leave your site if you force them to listen to a background
    sound. Before you choose to add a background sound, give it careful.


    # Formatting Tab


    The Formatting tab contains properties for a background image, hyperlink colors,
    and other page colors (see Figure 3.13).


    ![](bbox=[0.087, 0.318, 0.912, 0.593])


    In addition to specifying a background image, you can also specify that an image
    be be added as a watermark. A watermark background remains stationary when the
    page is scrolled. Hyperlink color and other page colors are also configured on
    the Formatting tab. Color changes made here are added to the page as embedded
    style sheets.


    +   * For more information on style sheets, see Chapter 17, "Creating Style Sheets."


    # Advanced Tab


    The Advanced tab, shown in Figure 3.14, contains settings for the page margins.
    Margin entries made here are applied to the page as an inline style on the `<body>`
    tag.'
