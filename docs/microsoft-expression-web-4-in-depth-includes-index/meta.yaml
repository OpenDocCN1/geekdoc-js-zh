  md: '# Baseline and Comparison Browser Selectors


    The baseline and comparison browser selectors allow you to choose which browser
    you want to use for your baseline browser and comparison browser. Each has a Close
    button in the upper-right corner so you can choose a different browser if you
    want. Additionally, the baseline browser selector offers a button under the Close
    button that alternates the baseline browser between the left and right preview
    panes. The comparison selector provides an Add button underneath the Close button
    that makes choosing multiple browsers as the comparison browser much easier.


    If multiple browsers are selected, you''ll see multiple browser selector buttons
    available for the comparison browser. In Figure 13.5, both Internet Explorer 8
    and Internet Explorer 6 are being used as a comparison browser. To switch the
    preview pane between IE8 and IE6, simply click the corresponding version on the
    comparison browser.


    # DOM Tab


    The DOM tab expands a window at the bottom of the SuperPreview window that shows
    the DOM tree for the currently viewed page. Using the DOM tab, you can easily
    locate the actual DOM element that is responsible for any rendering irregularities.


    Figure 13.6 shows the DOM tree expanded after clicking the DOM tab. Notice that
    the currently selected element in the preview window is also selected in the DOM
    tree.


    ![](bbox=[0.068, 0.126, 0.768, 0.483])'
