- img_proc: false
  md: 'The bottom line is that you should always think about accessibility when designing
    your sites. Many accessibility rules are based on common sense. However, no matter
    how much effort you put into making your sites accessible, you are bound to miss
    something. Frankly, Expression Web provides an Accessibility Checker feature so
    you can locate accessibility problems and correct them before you deploy a site.


    # Using the Accessibility Checker


    The Expression Web Accessibility Checker allows you to run reports on how well
    your site holds up to accessibility standards. The Accessibility Checker can check
    one or more pages (or your entire site) WCAG and Section 508 requirements and
    provide a comprehensive report of the results.


    # Checking Accessibility


    To access the Accessibility Checker, select Tools, Accessibility Reports to display
    the dialog shown in Figure 12.5.


    Figure 12.5

    The Accessibility Checker is a flexible tool for finding accessibility problems
    in your site.


    ![](bbox=[0.508, 0.456, 0.923, 0.597])


    The Check Section of the Accessibility Checker dialog lets you check all pages,
    open pages, selected pages, and the current page for accessibility problems. The
    For Section allows you to choose which standard(s) you want to check your pages
    against. You can choose WCAG Priority 1, WCAG Priority 2, and Section 508


    The Show section presents a series of check boxes that control how much information
    is displayed in the accessibility report. The following-options are:


    +   - **Errors**—Represents problems that cause the page to fail accessibility
    requirements. Any errors must be corrected if the site is within accessibility
    standards.

    - **Warnings**—Represents areas of a page that might be problematic based on the
    content. You should review these areas for possible accessibility problems.


    > Priority 1 results are problems that must be corrected for a page to remain
    compliant with accessibility standards. A priority 2 result should be corrected
    for maximum accessibility, but not doing so does not cause your page to fail validation.'
  merge: -1
  pgno: 223
- img_proc: false
  md: '# Maintaining Compatibility and Accessibility


    Manual Checklist—Lists the general requirements for the selected standards. These
    are somewhat similar to reminders to ensure you are aware of the requirements
    imposed by the selected standards. Because the items on this list cannot be checked
    automatically, you will want to check them manually.


    After you''ve made your choices in the Accessibility Checker, click Check to check
    the page(s). When the check is complete, Expression Web displays the results in
    the Accessibility panel, as shown in Figure 12.6.


    ![](bbox=[0.055, 0.275, 0.745, 0.465])


    # Working with the Accessibility Panel


    Additional options in the Accessibility panel are available by right-clicking
    a particular item. For example, for additional details on an item, right-click
    the item and select Problem Details. Expression Web displays the Problem Details
    dialog details on item (see Figure 12.7). This is not only to get a better understanding
    of the problem, but also to provide hints on how to correct the issue.


    ![](bbox=[0.055, 0.672, 0.745, 0.765])


    Figure 12.7


    The Problem Details dialog can provide helpful hints on how to resolve issues
    that appear in the Accessibility report.


    If a particular item appears as a WCAG checkpoint, additional information on that
    specific item can be obtained by either clicking the WCAG link in the Checkpoint
    column (shown previously in Figure 12.6) or by right-clicking the item and selecting
    Learn More from the menu. Doing so opens your browser and takes you to the W3C
    site, where you can read about the specific requirement, as shown in Figure 12.8.


    To correct a problem or warning displayed in the Accessibility panel, double-click
    the item. Expression Web opens the applicable page and selects the code that caused
    the error or warning, as shown in Figure 12.9, so that it can be easily corrected.'
