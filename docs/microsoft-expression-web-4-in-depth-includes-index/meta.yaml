  md: '# # CREATING, OPENING, AND IMPORTING SITES


    # ## What Is a Site?


    At first glance, that might seem like a patronizing question, but it''s not. I''m
    not talking about a site in the generic sense. I''m talking about a site as it
    relates to Expression Web.


    Expression Web is a capable page editor, but it''s really designed to work with
    a collection of related files. That collection of related files is what Expression
    Web refers to as a site.


    Expression Web 4 has many features designed with a site in mind. The reporting
    features of Expression Web, for example, are designed to provide information on
    an entire site. There are also numerous dialogs that allow you to take a specific
    action on all files in a site, and the Find and Replace feature in Expression
    Web is most robust when used with a site and not just a single page.


    A site can consist of pages, Cascading Style Sheets (CSS) files, script files,
    image files, and so on. It can contain other folders for the purpose of organizing
    the files within the site.


    # ## Expression Web Maintains a Site


    By default, Expression Web tracks files and folders in your site, as well as other
    important information about the site, using hidden files called *metadata*. These
    files are in hidden folders that begin with _vti and are located in the same folder
    as the rest of your site, as shown in Figure 2.1.'
