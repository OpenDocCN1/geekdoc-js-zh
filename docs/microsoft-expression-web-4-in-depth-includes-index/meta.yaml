  md: '# Interactive Buttons


    Interactive buttons (see Figure 1.21) are buttons that use JavaScript for a rollover
    effect. Creating interactive buttons is easy, and you have numerous prestigned
    buttons from which to choose.


    Figure 1.21

    If you need a simple button with rollover animation, an interactive button might
    be the perfect choice.


