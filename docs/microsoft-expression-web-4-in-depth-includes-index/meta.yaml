  md: '# Inserting Tables


    The Insert Table dialog (refer to Figure 5.1) is displayed by selecting Table,
    Insert Table in Expression Web. If a table has already been inserted on your page,
    you can access the Table dialog by right-clicking the table and selecting Table
    Properties from the menu.


    The Insert Table dialog is divided into several sections:


    +   - Size—The section includes settings for the number of rows and columns.

    - Layout—This section includes alignment settings, width and height settings,
    and cellpadding and cellspacing settings.

    - Borders—This section includes settings for border size and border color and
    a check box that allows you to easily collapse the border.

    - Set—This section includes a check box to configure the default settings for
    future tables.


    # Customizing Tables


    Expression Web can automatically format your table using the AutoFormat feature.
    Select Table, Modify, Table AutoFormat to access the Table AutoFormat dialog,
    shown in Figure 5.11. However, you''ll likely want to use more control over the
    formatting, and for that, you''ll need to use the options on the Table menu.


    The Table menu is actually made up of two menu systems. The Table menu on the
    menu bar allows you to insert a new table. After a table has been added to your
    page, you can use either the Table menu on the menu bar or the Table context menu
    (see Figure 5.12), accessed by right-clicking a table, table row, or cell.


    > tip You''re not going to want to format your table if you''re using it to control
    layout. The Table AutoFormat feature is well-suited to displaying data in a table,
    but it''s not a good choice for a table that defines layout.


    ![](bbox=[0.082, 0.663, 0.917, 0.928])'
