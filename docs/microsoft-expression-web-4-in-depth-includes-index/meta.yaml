  md: 'If you choose, you can configure Expression Web so it doesn''t use metadata
    to track your site''s files. However, it''s best to just allow Expression Web
    to keep metadata for your site. Doing so allows it to efficiently track changes
    to your site. If you choose not to use them, the functionality of the live site
    will not be affected.


    > *For more information on configuring your site settings,

    Chapter 15, "Site Management and Reporting."*


    # # Sites and Subsites


    Expression Web enables you to create a new site within an existing site (a site
    known as a subsite), but for Expression Web to recognize the subsite, it needs
    to add metadata information to the site. If the option to store site information
    using hidden metadata is disabled, Expression Web will not be able to recognize
    the subsite as a separate site.


