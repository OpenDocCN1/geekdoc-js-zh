  md: '# Creating a Site Using SSL


    If you require additional security and your server is configured to allow SSL
    traffic, you can create a site using SSL by checking the Use Encrypted Connection
    (SSL) check box, as shown in Figure 2.16. When you use the Use Encrypted Connection
    (SSL) check box, Expression Web automatically changes the URL you have specified,
