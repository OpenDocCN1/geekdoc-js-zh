  md: "# When Not to Use Frames\n\nIt's generally a good idea to avoid the use of\
    \ frames for sites that will be hosted on the Internet. The following are some\
    \ of the drawbacks of a frame:\n\n+   * Search engines often index pages that\
    \ are part of frames—When that happens, search results can link to pages that\
    \ don't include your navigation or other important page elements.\n* They might\
    \ not render the same way on all computers—Frames include window elements as scrollbars\
    \ that aren't always the same size in every browser, thereby causing rendering\
    \ problems in some cases.\n* When a frames page links to another frames page,\
    \ you end up with nested frames—This can be extremely frustrating for users of\
    \ your site.\n\n> > tip\n is a movement under way (and has been for quite time)\
    \ to replace frames with CSS. In fact, doing so is possible, and it works well\
    \ in modern browsers.\nYou can read about method of doing this at www.webreference.com/html/tutorial24/.\n\
    \nYou must also take into account that the text size in browsers can be (and often\
    \ is) adjusted by users with low vision and for other reasons. If your frames\
    \ are designed for a certain size and a site visitor alters the text size in the\
    \ browser, it can modify your site's layout in unpredictable ways.\n\nNow that\
    \ you know when it's okay to use frames and when you should probably opt for another\
    \ technique, let's talk about how to create frames pages in Expression Web.\n\n\
    # Creating Frames Pages\n\nFrames pages (as opposed to inline frames, which I\
    \ discuss) are actually made up of multiple pages. At the top level is the frameset.\
    \ The frameset page doesn't actually contain any visible content. Instead, it\
    \ contains HTML code that defines two or more frames and their layout.\n\nTo create\
    \ a new frameset in Expression Web, do the following:\n\n+   1. Select File, Page.\n\
    2. Select Frames Pages from the list of page types.\n3. Select the frame layout\
    \ of your choice from the list in the New dialog, as shown in Figure 6.1. For\
    \ this example, I chose the Contents layout.\n\n> > note\nExpression Web comes\
    \ with a collection of CSS layouts that you can use in lieu of frames. You'll\
    \ find them in the CSS Layouts section of the New dialog when creating a new page."
  merge: -1
  pgno: 128
