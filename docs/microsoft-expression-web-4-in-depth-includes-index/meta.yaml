    +   - For more information on inserting Deep Zoom images, see Chapter 9, "Using
    Graphics and Multimedia."


    # Video


    In addition to the capability of inserting Silverlight content into your web page,
    Expression Web also comes with Expression Media Encoder, which makes it easier
    than ever to add video to your site.


    +   - For more information on adding video to your web page, see Chapter 9, "Using
    Graphics and Multimedia."'
