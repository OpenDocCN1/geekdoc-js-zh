  md: '# Tracing Image Disabled


    The Tracing menu option is disabled on pages that use a Dynamic Web Template or
    an ASP.NET Master Page. To use a tracing image in this scenario, open the Dynamic
    Web Template or the Master Page and apply the tracing image.


    You are building your user interface elements on top of the tracing image, Expression
    Web allows you to configure transparency for the image. Expression Web allows
    you to configure the image so it''s still visible while not allowing it to get
    in the way of your design elements.


    After you''ve configured the tracing image with the desired settings, click OK
    to add it to the page. You can then add the user interface elements you will use
    to lay out your page.


    > Tracing images are only visible when you are viewing your page in Expression
    Web.


    # Adjusting Page Size


    When designing your site, you want to make sure it looks the way you intend at
    all common resolutions. For, if you design your site on a monitor set to a resolution
    of 1280×1024 (a common resolution for a 17” or LCD display) and you view it on
    a monitor set to a resolution of 800×600, it''s likely that part of the page will
    overflow the right edge of the screen. User interface elements might also shift
    around, making the page look unprofessional.


    One solution to the screen resolution problem is to design your pages at the lowest
    resolution in which you expect them to be viewed. (In the example given previously,
    you would want to design the page at a resolution of 800×600). There might have
    spent a bunch of money on a nice monitor with plenty of screen real estate, and
    you''re being asked to lower the resolution to the point where you''re no longer
    able to take advantage of all of that real estate. Luckily, the Page Size feature
    in Expression Web was created so you can design for a specific resolution without
    actually switching to that resolution.


    When you''re working in Design View, Expression Web displays the current page
    size in the status bar, as shown in Figure 4.11.


    By clicking the page size displayed in the status bar, you can select a new page
    size, as shown in Figure 4.12. You can also select View, Page Size and select
    the desired page size from the menu.


    Figure 4.11

    The status bar shows you the page size so you can design for an intended resolution.


    ![](bbox=[0.225, 0.806, 0.335, 0.814])'
  merge: -1
  pgno: 96
- img_proc: false
  md: '# Working in Code View 79


    # Figure 4.12


    Setting a new page size is fast and easy using the status bar.


    ![](bbox=[0.613, 0.126, 0.921, 0.355])


    If you choose a page size that is smaller than the current size of the design
    surface, Expression Web displays shaded borders to indicate the size you have
