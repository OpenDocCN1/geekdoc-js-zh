  md: '# AN OVERVIEW OF EXPRESSION WEB 4


    # The Expression Web Interface


    The true measure of any design tool is how well the interface contributes to your
    productivity. The Expression Web interface is designed specifically to make access
    to tools easy while maintaining maximum real estate for the design surface. Like
    Expression Web 3, the first things you''ll notice when opening Expression Web
    is that the interface is a dark color, and menus and panels are aesthetically
    different. These interface changes are due to an architectural change introduced
    in Expression Web 3. The interface color proved not to be popular with many Expression
    Web users, so Microsoft added the ability to use your Windows color scheme instead
    of the dark interface.


    Major changes in Expression Web involves publishing, search engine optimization
    (SEO) enhances, remote browser capabilities in SuperPreview, and a new extension
    system that makes it easy to develop add-ins for Expression Web using JavaScript
    and HTML.


    > tip To change Expression Web''s interface to your Windows color scheme, select
    Tools, Application Options, and check the Use Current Windows Color Scheme check
    box.


    The next sections go over some of the major interface elements and features of
    Expression Web.


    # Panels


    Most of the tools you will use in Expression Web are available in panels, as shown
    in Figure 1.1.'
  merge: -1
  pgno: 23
- img_proc: false
  md: '# An Overview of Expression Web 4


    Figure 1.1

    Panels are a flexible and convenient way to access tools in Expression Web.


    ![](bbox=[0.068, 0.115, 0.755, 0.525])


    Panels can be hidden by clicking the AutoHide button, as shown in Figure 1.2.
    When you click it, a tab for the panel appears on the left or right of the Expression
    Web interface. You can display the panel by hovering over this tab. If you want
    to hide the panel, click the icon again.


    Figure 1.2

    Clicking the AutoHide button hides the panel.


    ![](bbox=[0.068, 0.725, 0.755, 0.922])'
  merge: -1
  pgno: 24
- img_proc: false
  md: 'You can also drag a panel to any edge of the Web Interface to dock it on that
    edge or drag it away from an edge to make it a floating panel that can be positioned
    anywhere within the user interface.


    Panels can contain tabs so that multiple panels can be present within the same
    window. Figure 1.3 shows the Manage Styles panel with tabs inside it for other
    panels. To activate one of the other panels, simply click the tab. Arrow buttons
    are provided when there is not enough room to display all tabs.


    > > tip You can double-click the top edge of a panel to toggle between a floating
    panel and a docked panel.


    # Figure 1.3


    Panels are extremely flexible. In this case, several panels are combined into
    one window. Tabs are provided for each panel.


    ![](bbox=[0.625, 0.308, 0.915, 0.513])


    To add a panel as a tab within another panel, simply drag one panel on top of
    another.


    # The Folder List


    Expression Web displays all the files and folders in the current site inside the
    Folder List panel, as shown in Figure 1.4. You can quickly locate any file or
    double-click a file to edit it.


    # Figure 1.4


    The Folder List provides a view of all the files and folders in your site.


    ![](bbox=[0.705, 0.698, 0.915, 0.913])'
  merge: -1
  pgno: 25
- img_proc: false
  md: '# An Overview of Expression 4


    The Folder List has many of the same features you would expect in a file manager,
    as creating new folders, adding files, deleting content, and so on. Right-click
    a file or folder in the Folder List for a menu of options.


    The Folder List is similar to the Site View tab in the main Expression web, but
    the Site View tab allows for sorting and more customized views than the rudimentary
    view provided by the Folder List.


    > caution When deleting files from the Folder List, keep in mind that deleting
    some files (such as CSS files, templates, and script files) can affect other files.
    There is no Recycle Bin in Expression Web, so be careful! When you delete a file
    from the Folder List, it''s permanently deleted.


    # The Design Surface


    The design surface (shown in Figure 1.5) is the area in Expression Web where you
    create your pages. The view of your site matches what you will see when you view
    your page in a browser.


    Contrary to what some people believe, the design surface in Expression Web does
    not use Internet Explorer for rendering. It is a browser-independent rendering
    of your page, and it''s designed to come as close as possible to what your page
    will look like in any browser. However, it''s only a close approximation. You
    should always preview your page in a browser (or in SuperPreview) in order to
    verify its appearance.


    ![](bbox=[0.067, 0.485, 0.882, 0.843])'
  merge: -1
  pgno: 26
- img_proc: false
  md: '# The Status Bar


    The status bar in Expression Web is extremely informative (see Figure 1.6). It
    contains tools that warn you when incompatible or invalid code is detected in
    the page that is open in Expression Web. It also provides information at glance
    concerning the schema of the page and so on.


    Figure 1.6


    ![](bbox=[0.375, 0.225, 0.924, 0.303])


    The status bar is an important tool. It lets you know whether you bad code in
    your page and informs you of many properties of a page.


    +   For more information on the status bar, see Chapter 4, "Using Page Views."


    # Working with Sites


    Expression Web can easily work with single pages, but to get the most out of it,
    you need to create a site, which is, to say, a collection of pages.


    # Creating Sites


    Expression Web can create websites on your local file system or on a remote file
    system or server. You can use the FrontPage Server Extensions if you want (although
    they are not required), and you can use FTP to create a website or open an existing
    one.


    The Managed Sites dialog, shown in Figure 1.7, makes it easy to keep track of
    all your sites and provides for better management of local sites.


    Figure 1.7


    The Managed Sites dialog lets you easily keep up with your sites.


    ![](bbox=[0.375, 0.642, 0.924, 0.901])'
  merge: -1
  pgno: 27
- img_proc: false
  md: '# Site Reports


    Expression Web has 17 reports that can be displayed for a site. Using these reports,
    you can easily identify problems such as slow pages, unlinked files, broken hyperlinks,
    and so on. You also get a good view of your site in its entirety, as shown in
    Figure 1.8. You can access some reports by clicking the Reports tab at the bottom
    of the main Expression Web window when Site View is selected. Other reports are
    available on the Tools menu.


    ![](bbox=[0.057, 0.313, 0.903, 0.663])


    > For more information on creating sites, see Chapter 2, "Creating, Opening, and
    Importing Sites."


    # Publish Sites


    Expression Web has a robust file publishing system that can use the file system,
    FTP, or HTTP via the FrontPage Server Extensions. You can choose to publish only
    files that have changed since the last time you published, or you can publish
    all files.


    The Publishing tab in the Settings dialog (shown in Figure 1.9) allows you to
    use common publishing destinations and to easily specify how Expression Web chooses
    to publish. Expression Web also allows you to publish securely using SFTP and
    FTPS.


    > note

    Expression Web adds several menu items to make publishing changed pages, selected
    files, or the current file easier.


    > For more information on site reporting, see Chapter 15, "Site Management and
    Reporting."'
  merge: -1
  pgno: 28
- img_proc: false
  md: '# Figure 1.9


    The Publishing tab in the Site Settings dialog allows flexibility to publishing.


    ![](bbox=[0.5385, 0.1315, 0.921, 0.3715])


    +   For more information on publishing a site, see Chapter 14, “Publishing a Site.”


    # Tools for Creating Pages


    As a what-you-see-is-what-you-get (WYSIWYG) design tool, you can expect Expression
    Web to help you create standards-compliant sites with minimal effort. Plenty of
    features are available to make that possible.


    > note\Expression Web isn''t technically a WYSIWYG tool. The view you see in Design
    view is a close approximation of what you''ll see in the browser, but it''s not
    perfect.


    # Dynamic Web Templates


    To help create a site with a consistent look and feel across all pages, Expression
    Web offers Dynamic Web Templates. You can create any number of Dynamic Web Templates
    and attach pages of your choice to.


    Dynamic Web Templates also help easily make site-wide changes. Simply modify a
    Dynamic Web Template and save it. When you do, pages attached to that template
    are updated automatically.


    +   For more information on using Dynamic Web Templates, see Chapter 19, “Using
    Dynamic Web Templates.”


    # Find and Replace


    A robust find and replace tool is an important tool for any web designer. Expression
    Web not only includes a flexible and powerful tool for find and replace (see Figure
    1.10), but also incorporates regular expressions so you can create complex queries.


    +   For more information on using the Find and Replace tool, see Chapter 10, “Using
    Find and Replace.”'
