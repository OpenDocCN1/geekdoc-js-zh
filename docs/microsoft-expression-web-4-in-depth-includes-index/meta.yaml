  md: '# Source Code Searches Don''t Work


    Suppose you have a page in Open Code View. You want to search in source code,
    and you have Current Page selected; however, even though you''re entering HTML
    code that should be found, no search results are produced. Chances you have an
    HTML result apply to your search. Find in Source Code is always disabled and deactivated
    when HTML rules are applied. Clear the results by clicking the Clear button if
    you want to search in HTML code.


    When you click Find All, Expression Web displays the results in the Find 1 panel
    by default. You can display the results in a second panel (the Find 2 panel) by
    selecting the Find 2 radio button in the Display Results Section. Figure 10.2
    shows the results of a search for SSNs using the regular expression shown in Figure
    10.1. The results are displayed in the Find 2 panel, but previous results in the
    Find 1 panel can be recalled by clicking the Find 1 tab to display the Find 1
    panel. This panel is useful when you want to start a new search but are not finished
    working on a previous search.


    # Figure 10.2


    The results of a regular expression search for SSNs are displayed in the Find
    2 panel. The ability to use two panels for search results allows you to easily
    work with two different result sets.


    ![](bbox=[0.308, 0.443, 0.903, 0.626])


    If you need assistance entering a regular expression, click the right-pointing
    arrow button to the right of the Find What box, as shown in Figure 10.3. You can
    easily build simple regular expressions using this method.


    Complex regular expressions will likely require manual entry instead of using
    the Regular Expression buttons. Fortunately, Expression Web keeps a list of recently
    used searches so you can easily recall a complex search last. By clicking the
    downward-pointing button to the right of the Find What box, you can access a list
    of previously entered searches, as shown in Figure 10.4.


    +   * For an even better way of saving complex searches, see "Saving Queries,"
    p. 182.'
