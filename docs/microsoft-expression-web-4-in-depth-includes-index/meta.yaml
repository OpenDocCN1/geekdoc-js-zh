    # Don''t See _vti Folders


    If you have Expression Web configured to use metadata to keep track of your content,
    but you don''t see _vti folders when you open the disk path where the site is
    located, the _vti folders are hidden. The default settings in Windows won''t show
    your hidden folders. To show hidden files and folders, follow these steps for
    Windows 7, Windows Vista, or Windows Server 2008:


    +   1. Click Start and click Computer.

    2. Click the Organize button and select Folder and Search Options.

    3. Click the View tab.

    4. Select the Show Hidden Files and Folders radio button (Show Hidden Folder,
    Files, and Drives on Windows 7) and click OK.


    In Windows XP or Windows 2003 Server:


    +   1. Click Start and My Computer.

    2. Select Tools, Folder Options.

    3. Click the View tab.

    4. Select the Show Hidden Files and Folders radio button and click OK.


    You should now be able to see the _vti folders.'
