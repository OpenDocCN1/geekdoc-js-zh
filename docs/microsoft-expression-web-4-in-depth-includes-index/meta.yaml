  md: '# ASP.NET Controls


    ASP.NET is Microsoft''s dynamic website technology. Expression Web not only supports
    the use of ASP.NET pages, but also provides quick access to ASP.NET controls using
    the Toolbox, as shown in Figure 1.25. You can also configure controls in the design
    surface in Expression Web.


    Expression Web provides support for third-party ASP.NET controls in the /bin folder
    of your site, as well as the ASP.NET Ajax extensions.


    ![](bbox=[0.055, 0.273, 0.895, 0.638])


    You don''t need to worry when testing your ASP.NET or PHP pages because Expression
    Web ships with the Microsoft Expression Development Server—a web server that can
    be used to test ASP.NET and PHP pages.


    > Expression Web does not support adding third-party controls to the Toolbox.


    +   For more information on ASP.NET development in Expression Web, see Part VI,
    "ASP.NET and PHP Development."


    # PHP Support


    If you''re a PHP developer, Expression Web offers color-coding and IntelliSense
    for PHP code. You can also easily insert comment using PHP code fragments with
    the Insert menu in Expression Web and preview PHP pages using the Microsoft Expression
    Development Server.


    +   For more information on using PHP, see Chapter 32, "Using PHP."'
  merge: -1
  pgno: 40
- img_proc: false
  md: '# Data Access Features


    If your site is data-driven, Expression Web brings plenty of great features to
    the table. Using the power of ASP.NET, Expression Web allows you to create dynamic,
    data-enabled sites without writing any code.


    Data connections are configured in the Data Source Library panel so they can be
    manipulated easily within the Expression Web interface (see Figure 1.26).


    Figure 1.26

    Accessing data couldn''t be easier. Data connections are accessed via the Source
    Library panel.


    ![](bbox=[0.711, 0.276, 0.913, 0.413])


    > For more information on accessing data in Expression Web, see Chapter 34, “Displaying
    and Editing Database Data with ASP.NET."


    # Creating Add-Ins


    Expression Web 4 introduces a new extensibility model that allows for the development
    of add-ins using JavaScript and HTML. You can create dialog add-ins, panel add-ins,
    or command line add-ins. Distributing add-ins is easy. You simply zip up the files
    and rename the compressed file to an .xadd extension. You can then easily install
    your add-in by simply double-clicking the .xadd file.


    > For more information on creating add-ins in Expression Web, see the online Chapter
    36, “Creating Add-Ins in Expression Web.\ ”'
