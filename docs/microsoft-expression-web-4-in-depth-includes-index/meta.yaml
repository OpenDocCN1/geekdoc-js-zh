  md: '# Creating, Opening, and Importing Sites


    other words, in addition to importing from a local drive, you can also use either
    a universal naming convention (UNC) path or a mapped drive to import this method.


    A UNC path consists of a server name and a share name is in the format `\server\share`.
    For example, to access a called sites on a server named server1, you would use
    the UNC path `\server1\sites`.


    Because Expression Web provides support for disk-based sites, you can also choose
    to include subsets when using the file system method by checking the Include Subsets
    checkbox.


    > tip

    Windows automatically sets up a share for the root of every drive on your computer.
    You can access any share using the format `\server\drive$`. For example, to access
    the root of the C drive on a computer named desktop, you would use the path `\desktop\c`.

    You need to use an Administrator to access these shares.


    # HTTP


    The HTTP method is used to import a site which does not have access via any of
    the previously discussed methods. This is the only method that does not require
    authorization to complete the import process.


    The HTTP import process is different from the other import methods. In fact, you
    can import any site you can get to on the Internet using this method. Instead
    of actually publishing the site during the import process, the HTTP method can
    be configured to follow hyperlinks from the home page.


    When you choose the HTTP method to import a site, the Import Site adds the Set
    Import Limits step, as shown in Figure 2.20.


    > note

    The Set Import Limits step actually appears as the third step in the wizard. I
    am covering it here only because it''s unique to the HTTP method of importing.


    > tip

    By default, Expression Web imports all files that are reachable from the home
    page and all child pages.


    ![](bbox=[0.056, 0.646, 0.638, 0.933])


    Figure 2.20

    The HTTP method of importing a site adds another step to the Import Site wizard.'
  merge: -1
  pgno: 60
- img_proc: false
  md: 'In this step, you can specify exactly how the Import Site wizard decides what
    to import using the following check boxes:


    +   **Import the Home Page Plus Linked Pages # Levels Deep**—When a site is imported,
    Expression Web follows hyperlinks to the depth that you specify. For example,
    if you specify 2 for the number of levels, Expression Web imports the home page,
    all pages linked directly from the home page, and all pages linked directly from
    those pages.


    +   **Import a Maximum of # KB**—Use this option when you want to put a cache
    on the amount of content that gets imported. This is particularly useful if you
    have metered bandwidth or a slower Internet connection.


    When this option is selected, Expression Web imports the home page of the site
    and then follows all links from that page. It continues to follow and import files
    until the maximum limit is reached.


    +   **Import Only HTML and Image Files**—When this box is checked, Expression
    Web imports only images and HTML files. Other files such as script, CSS files,
    Flash files, and so on are not imported.


    ![](bbox=[0.062, 0.434, 0.112, 0.474])


    # Import Web Site Wizard Skips Import Limits Step


    If you''re choosing HTTP as your import method, you don''t have the option of
    choosing the import limits when you run through the wizard, it''s likely that
    the site you are trying to import is configured with the FrontPage Server Extensions.
    If Expression Web detects that the FrontPage Server Extensions are installed on
    the remote site, it automatically uses the FrontPage Server Extensions option
    when importing the site.


    You''ll have the option of choosing what to import when you are presented with
    the Site view at the end of the process.


    ![](bbox=[0.062, 0.666, 0.112, 0.706])


    # Username and Password Not Accepted


    If you''re trying to import a site and get rejected even though you''ve entered
    the correct information when asked for your username and password, the most likely
    cause of this is an incorrect password. Take care to type the characters correctly
    and make sure that your Caps Lock isn''t on. If you''re positive that you''ve
    entered the information correctly, check with the hosting company or administrator
    of the remote web server.'
  merge: -1
  pgno: 61
- img_proc: false
  md: '# Specifying a Destination Web Location


    The second step of the Import Site wizard (shown in Figure 2.21) is where you
    specify the destination location for the imported site. This can be a UNC path,
    a disk location, or an HTTP location. However, when specifying an HTTP location,
    the site must have the FrontPage Server Extensions installed.


    ![](bbox=[0.065, 0.237, 0.91, 0.532])


    Figure 2.21

    You can specify a destination for an imported site in the Import Site wizard.


    If you already have a site open in Expression Web, check the Add to Current Web
    Site check box if you want the imported site to be added to the open site. If
    you require additional security, you can specify that SSL will be used to import
    the site if you use an HTTP path for the destination.


    # Finishing the Site Import Process


    After you''ve specified all the necessary information, click the Finish button
    in the last step of the wizard to finish the import process. If you''ve chosen
    HTTP as your method of importing, the site begins importing immediately. Otherwise,
    you are presented with the Site view, as shown in Figure 2.22. You can then complete
    the import process by publishing your site using the Site view to copy the files
    and folders.


    +   * For more information on Site view to publish a site, see Chapter 14, “Publishing
    a Site."'
  merge: -1
  pgno: 62
- img_proc: false
  md: '# Figure 2.22

    In all import methods except the HTTP method, use the Site view to complete the
    import process.


    ![](bbox=[0.3735, 0.1155, 0.9118, 0.5235])


    # # Deciding on a Site Type


    As you''ve seen in this chapter, there are a few choices when it comes to deciding
    on a site type in Expression Web. Deciding which type is best for your site is
    often confusing.


    Until recently, web designers using the Microsoft platform were limited in their
    choice of site types when it came to remote sites. If you had full functionality,
    you were restricted to the FrontPage Server Extensions. You could use FTP, but
    then you couldn''t work with a remote site live.


    Expression Web (and the Visual Studio platform of products) has changed all of
    that, and''s a general tendency by Microsoft these to shift away from reliance
    on the FrontPage Server Extensions. You can now use FTP as easily as you used
    HTTP in earlier products.


    In my opinion, FTP (preferably FTPS or SFTP) is the best solution for today''s
    sites. FTP is well-suited to fast file transfers, the ability to use more tools
    than Expression Web to manage your files (including the FTP command-line client
    that comes with Windows), and unlike the FrontPage Server Extensions option used
    when creating HTTP, FTP will be around for many years to come.


    Disk-based sites are also a perfectly valid option, especially if you are creating
    your site locally and then publishing it to the live server at a later time. One
    of the greatest advantages of a disk-based'
  merge: -1
  pgno: 63
- img_proc: false
  md: 'site is that it can easily be moved from one location to another (or stored
    on a removable drive) without breaking anything. Even if you are using a server
    technology such as ASP.NET or PHP, a disk-based site is still a viable choice
    because you can test your server-side code using the Microsoft Expression Development
    Server.


    If given the choice between using a technology that''s being phased out and one
    that has been proven to be a long-lived technology, I''ll choose the one with
    greater longevity every time.'
  merge: -1
  pgno: 64
- img_proc: false
  md: '# CREATING PAGES AND BASIC PAGE EDITING


    # Creating Pages


    Expression Web gives you plenty of choices when creating new pages.

    Not only can you choose between standard HTML pages, ASP.NET pages and files,
    PHP files, and ASP files, but you can also create new pages that have an existing
    CSS layout.


    To create a page in Expression Web, select File, New, Page to display the New
    dialog shown in Figure 3.1.


    The left side of the New dialog contains a list of page types. When a page type
    is selected, the list at the right is populated with numerous pages that can be
    created.


    Many of the page types listed aren''t really pages in the traditional sense. For
    example, if you select ASP.NET as the page type, you see options such as Web Configuration
    and Site Map, both of which are Extensible Markup Language (XML) files instead
    of actual pages.


    Creating a page is literally as easy as selecting the type of page in the New
    dialog and clicking OK. After you create the new page, you need to add content
    to it and it will serve any useful purpose. Let''s review the types of page formats
    you can choose when using the New dialog to create new pages.


    # General Page


    Table 3.1 shows the page formats available when you select General in the New
    dialog and where you can find more information on certain for-formats.'
  merge: -1
  pgno: 65
- img_proc: false
