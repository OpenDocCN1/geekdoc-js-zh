    \ 123, and \"Using the CSS Properties Panel,\" p. 307, respectively.\n\n# Table\
    \ Borders\n\nExpression Web uses the CSS Mode setting to determine how table borders\
    \ are applied. By default, borders are applied using a CSS class, but you can\
    \ override that by using the Style Application toolbar or by changing the Borders\
    \ on the CSS tab of the Page Editor Options.\n\n+   - For more information on\
    \ the Page Editor Options dialog, see Chapter 11, \"Configuring Page Editor Options.\"\
    \n\nA table border is not only by size, but also by the cellspacing attribute.\
