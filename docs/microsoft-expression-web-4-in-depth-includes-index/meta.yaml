- img_proc: false
  md: '# Tips for Frames


    # CHAPTER 6


    When using frames in your site, be sure you test them carefully. Adjust the size
    of the text in your browser and test site again. The goal is to make your site
    the way you intend for all visitors. With careful testing and design, you can
    easily reach that goal.


    # Breaking Out of a Frameset


    If you use frames in your site, you run the risk of your frames page being displayed
    inside a nested frameset. Figure 6.15 shows an example of a nested frameset caused
    by a link inside a frameset linking to a frames page.


    ![](bbox=[0.078, 0.3, 0.92, 0.71])


    The solution to this problem is to include a JavaScript snippet to force the frameset
    to remove any nested framesets when it gets loaded. Simply include the following
    snippet inside your <head> section in the frames page:


    ```

    <script language="javascript" type="text/javascript">

    if (window != top) top.location.href = location.href;

    </script>

    ```'
