    dialogs.


    ![](bbox=[0.537, 0.563, 0.921, 0.693])


    # Working in Code View


    Most users of WYSIWYG design tools aren''t too interested in digging into the
    code that makes a page. In fact, the code that Expression Web generates is clean
    and efficient enough to make digging into the code unnecessary in all cases. However,
