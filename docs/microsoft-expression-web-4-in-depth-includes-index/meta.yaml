  md: '# Figure 13.8

    SuperPreview is now configured with Firefox 3.6.6 as the base-browser and Internet
    Explorer 8 in IE7 mode for the comparison browser.


    ![](bbox=[0.215, 0.126, 0.903, 0.483])


    # Generating Previews


    In the Location box, enter **www.jimcobooks.com** and press Enter. SuperPreview
    generates a pre-view of the page using each of the browsers that were selected
    as shown in Figure 13.9.


    You might immediately notice the banner ad on page is a little off between the
    two previews. However, you may not notice many other rendering differences. To
    see these, click the Overlay Layout button. After you, you will see that page
    elements on this page are positioned differently in Firefox 3.6.6 and IE8 running
    IE7 compatibility mode.


    # Fixing Rendering Problems


    First, the banner ad on the page appears to be slightly lower on the page in Firefox
    than in Internet Explorer. To get a better idea of what might be causing this
    problem, switch to Lights Out Highlighting mode and click the banner ad. The SuperPreview
    would look like the one shown in Figure 13.10.


    The additional whitespace at the top of the banner in Firefox is obvious, but
    notice that the Size, Left, and Top measurements displayed in SuperPreview are
    identical in both browsers. That tells you that the rendering problem is not with
    the banner ad itself, but likely with another element''s position in relation
    to the banner ad.


    > > **note**nIt might interest you to know that I identified this rendering problem
    and how to resolve it while writing this chapter using SuperPreview. However,
    I left it broken so you would be able to investigate the issue while reading this
    book.'
