  md: '# Context Menu


    The context menu in Code View (see Figure 4.17) provides many useful tools for
    working with code.

    One of the most useful features of Expression''s Code view menu is the ability
    to find matching curly in client-side script. There are also useful commands on
    the context menu to add moving pages created in other tools to Expression Web.
    However, other applications might not create XHTML-compliant code. By selecting
    XML Formatting Rules from the context menu, you can easily make code XHTML-compliant
    without working through manual edits.


    ![](bbox=[0.087, 0.276, 0.638, 0.683])


    Figure 4.17

    Expression Web offers many tools on the context menu of Code View to aid in adding
    and editing code.


    # Bookmarks


    Another convenient feature available in Code View is the Bookmark. You can create
    a bookmark on a specific line of code by selecting Edit, Code View, Toggle Bookmark
    or by pressing Ctrl+F2. A bookmark shows up as a blue rectangle in the code margin,
    as shown in Figure 4.18.


    To move to the next bookmark in Code View, select Edit, Code Next Bookmark or
    press F2. To move to the previous bookmark, select Edit, Code View, Previous Bookmark
    or press Shift+F2. To remove all bookmarks, select Edit, Code View, Clear Bookmarks.


    > note created in Code View are not the same as hyperlinked bookmarks. The bookmarks
    in Code View are simply reference points so that specific places in code can be
    easily located.'
