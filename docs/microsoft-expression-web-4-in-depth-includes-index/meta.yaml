  md: '# Importing Sites with the Import Site Wizard


    +   * FTP

    * SFTP

    * FTPS

    * FrontPage Server Extensions

    * WebDAV

    * File system

    * HTTP


    > > caution\If the remote server has the FrontPage Server Extensions installed,
    make sure you use this option when importing the site. If you don''t, the files
    that provide the FrontPage Server Extensions with configuration information won''t
    be imported.


    All these methods except the FrontPage Server methods use the Publish feature
    of Expression Web to import the remote site. After you''ve specified the necessary
    information for Expression Web to open the remote site, the remote site is published
    to the destination you''ve selected.


    For information on using the Publish feature in Expression Web, see Chapter 14,
    “Publishing a Site.”


    # FTP, SFTP, and FTPS


    To use the FTP to import a site, choose the FTP option. You need a username and
    password to import the site using FTP.

    to import a site using FTP, enter the FTP address of the remote site in the Web
    Site Location box, as shown in Figure 2.17. Depending on the configuration of
    the remote site, you might also need to enter a directory in the Directory text
    box, and enable passive FTP by checking the Use Passive FTP check box. You can
    also increase the number of simultaneous connections from the default of 4 to
    a maximum of 10. Doing improves the speed at which the site is imported. However,
    there is a limit to the number of connections your computer can open at any one
    time, so increasing connections in Expression Web can impact other applications.


    > > tip

    Most hosting companies do not support WebDAV publishing at this time.


    If you want to import the site using secure, choose either the SFTP or FTPS option
    when importing.


    For more information on the options available with FTP, see Chapter 14, “Publishing
    a Site.”


    > > note

    The file system method is often used in an office network environment where many
    file servers are available.


    After you''ve entered the necessary information, click the Next button to continue.
    You are prompted for a username and password before you can proceed to the next
    step.'
