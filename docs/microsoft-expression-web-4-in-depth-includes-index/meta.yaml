    # Configuring File Editors


    By default, when you double-click most files in the Folder List, Expression Web
    opens that file in its own window. In most cases, that''s what you want to happen;
    in some cases, however, you might want to override that behavior so certain types
    are opened in a different application.


    To specify the application to open a specific file type, select Tools, Application
    Options and click the Configure Editors tab. The dialog for configuring editors
    contains a list of file extensions along the associated editor or editors for
    each (see Figure 3.19). Available editors can be rearranged in the list or move
    to the top of the list so it is used as the default editor. When a file is double-clicked
    in the Folder List in Expression Web, it will be opened in the default editor
    for that file type.


    > note

    Some file types (such as images) are not opened in Expression Web by default when
    you double-click them in the Folder List.


    > caution

    The editor you configure for a specific file extension in Expression Web does
    not affect Windows file associations.

    Settings made in in Expression Web are specific only to Expression Web.'
  merge: -1
