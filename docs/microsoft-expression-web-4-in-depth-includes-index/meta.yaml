  md: '# Resizable Frames


    When adding frames for navigation elements, it''s tempting to configure the frames
    so they cannot be resized. Depending on the site''s design, that might or might
    not be a good idea.

    If the content in the frame consists of text, it often be a bad idea not to allow
    users to resize the frame. Some users of your site might have adjusted the size
    of the text in their browsers. In some cases, this can cause your text to overflow
    the frame.


    ![](bbox=[0.06, 0.263, 0.903, 0.542])


    Figure 6.13

    Borderless frames can be confusing to users because there is no visual indicator
    that the frames are separate.


    The page shown in Figure 6.14 is an example of bad design with frames. Notice
    that the link is not fully visible because I have adjusted the text size in my
    browser.


    ![](bbox=[0.06, 0.648, 0.903, 0.927])


    Figure 6.14

    Text inside a frame can overflow the frame if a user adjusts the text size in
    his browser.'
