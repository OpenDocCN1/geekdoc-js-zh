  md: '# 32


    # Creating, Opening, and Importing Sites


    Expression Web can use the Microsoft Expression Development Server to test disk-based
    sites, allowing you to take advantage of ASP.NET and PHP: Hypertext Preprocessor
    (PHP) features that require a web server.


    +   For information on the Microsoft Expression Development Server, see Chapter
    33, "Using the Expression Development Server"


    > caution

    You can delete a site by right-clicking the site name in the Folder List and selecting
    Delete. However, be careful about deleting sites you created on your file system.
    If you create a site in a location with existing files and folders and delete
    that site, Expression Web deletes everything in folder.


    # FTP Sites


    FTP sites are usually located on a remote web server. Most web hosts provide FTP
    access so you can use FTP with your site. Most applications require you to develop
    a site locally and then FTP the files to the remote web server. Expression Web
    takes a different approach in that offers because FTP is offered by almost all
    hosts, it is a convenient way to work with sites using Expression Web. If you
    choose to use FTP with Expression Web, use SSH File Transfer Protocol (SFTP) or
    over SSL (FTPS) if possible so that the information (such as usernames and passwords)
    is encrypted.


    Files and folders deleted by Expression Web are not moved to the Recycle Bin.
    They''re gone forever!


    > caution\If you choose to work on your site live using FTP, keep in mind that
    any changes you make are immediately visible on the live site after you save the
    page.


    To open an FTP site, select Site, Open Site and enter the FTP path. When you click
    Open, Expression Web asks whether you want to open the live site or copy it to
    your local machine, as shown in Figure 2.8.


    > tip

    To use FTP, use the format sftp://site.com. To use FTPS, use the format ftps://site.com.
    Your host or administrator will need to configure a secure FTP connection to use
    one of these methods.


    ![](bbox=[0.075, 0.703, 0.903, 0.843])'
