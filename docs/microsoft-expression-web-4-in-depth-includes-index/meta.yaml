    # Converting Images


    You can easily convert an image from one to another. To convert an image, right-click
    the Change Picture File Type to display the Picture File Dialog, as shown in Figure
    9.10.


    You might want to convert an image to another format to make the image size smaller.
    For example, if you have given a photograph in GIF format for a site, you''ll
    likely be able to substantially reduce the size of image by converting it to a
    JPEG image. On the other hand, if you are given a logo in JPEG format that contains
    only a few colors, you can make the file much smaller by converting the logo to
    a GIF image.'
