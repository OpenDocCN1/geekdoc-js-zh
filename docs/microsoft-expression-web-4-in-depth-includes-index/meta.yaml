  md: "I know plenty of people in the \"Why upgrade if it still works?\" crowd are\
    \ still using old Netscape browsers. If you abandon your HTML positioning techniques\
    \ in favor of CSS, these people are going to experience quite a mess when they\
    \ visit your site. Many developers rant over antiquated software, but the truth\
    \ is that your site is not likely to greatly impact the masses. In fact, the design\
    \ techniques of sites do not dictate the browser base. It's the other way around.\n\
    \nIf you decide to abandon a deprecated technique, make sure the replacement technique\
    \ works for the lowest-level browser you think your viewers will be. If it doesn't,\
    \ keep the deprecated method and just smile at those whose thumb you are not for\
    \ keeping up.\n\n# Listing 5.1 HTML Code for a Table Using the Center Alignment\
    \ Attribute\n\n```\n<table align=\"center\" style=\"width:100%\">\n  <tr>\n  \
    \  <td>&nbsp;</td>\n    <td>&nbsp;</td>\n  </tr>\n  <tr>\n    <td>&nbsp;</td>\n\
    \    <td>&nbsp;</td>\n  </tr>\n</table>\n```\n\n> tip\nAll attributes can be adjusted\
    \ using the Tag Properties and (if applied using CSS) CSS Properties panels.\n\
    \nNotice that Expression Web aligned the table using the align attribute. This\
    \ method of aligning tables is deprecated and the preferred method is to use CSS.\n\
    \n+   - For more information on formatting page elements with CSS, see Chapter\
