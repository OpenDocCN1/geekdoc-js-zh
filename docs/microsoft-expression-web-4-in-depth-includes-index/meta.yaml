  md: '# Targeting Frames


    # CHAPTER 115


    cases, that doesn''t present much of a problem, but in the case of frames, the
    page containing the frame tags doesn''t contain any content. It only contains
    tags that define the frames. for reason, when a browser doesn''t understand frames
    loads that page, it won''t display anything at all.


    Fortunately, there is a way to specify alternative content for browsers that don''t
    understand frames. By using the No Frames view, as shown in Figure 6.7, you can
    specify content to be displayed for browsers that don''t support frames.


    The default message provided by Expression Web (in Figure 6.7) isn''t very useful,
    so you''ll like to add your own content. Therein lies one of the problems with
    frames. If you''re going to create content in the No Frames view, you may as well
    evaluate whether the frameless content is suitable for everyone as a substitute
    for frames.


