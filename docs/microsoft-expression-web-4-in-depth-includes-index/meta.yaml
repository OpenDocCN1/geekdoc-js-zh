    # ## Disk-Based Sites


    Disk-based sites are created at a disk location. The advantage of a disk-based
    site is that it can be created anywhere on your local file system or on a remote
    drive. You can also create diskbased sites on thumb drives, external hard drives,
    and so on.


    Figure 2.4 shows the folder list of a disk-based site in Expression Web. Note
    that the path to the site is a disk location on your C drive.


    A disk-based site is the most flexible kind of site because it allows the site
    to be located in any folder you want. For example, if you receive files for a
    site from someone else, you can work with them as a site in Expression Web by
    simply copying the files into a folder on your computer and opening that folder
    as a site. To create a disk-based site:


    +   - Select Site, New Site.


    > > tip If you tell Expression Web to create a site in a folder that doesn''t
    exist, the folder will be created for you automatically. There is no prompt when
    this happens.


    +   2. Enter the path for the new site, as shown in Figure 2.5, or click the Browse
    button to navigate to the desired location.'
