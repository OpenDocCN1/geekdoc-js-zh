  md: '# INTRODUCTION


    # Who Should Read This Book?


    Expression Web is a powerful web development product, and there are plenty of
    books about it. That puts readers in a tight spot when trying to figure out which
    book to purchase to learn how to use Expression Web to its fullest. I''ve read
    a lot of technical books in my career, and the ones I value are the ones I keep
    going back to as a reference time and again I use the technology they teach. That''s
    the kind of book you appreciate, then this is the book for you.


    In this book, I will show you how to use the features in Expression Web 4 for
    real-world web design. I''ll give you pointers on how to effectively use several
    features to achieve a common goal. I''ll give you a strong foundation in the technologies
    involved (for example, Cascading Style Sheets [CSS], Extensible Hypertext Markup
    Language [XHTML], ASP.NET, PHP, and more) so you''re not working in a vacuum.


    I''ll wrap up the book by showing you how to use the new extensibility features
    in Expression Web 4 to develop add-ins using skills you likely already have as
    a web designer.


    The goal of this book is to equip you to be a better web designer using Expression
    Web as one of the tools in your arsenal. If that sounds like something you''re
    interested in, keep reading!


    # Why Use Expression Web?


    Any professional web designer whose features are important for a web design application
    and he will tell you that it must adhere to current web standards and making creating
    and maintaining a standards-driven site easy. Not only that, but a solid web design
    tool should be created from'
