  md: '# Language Tab


    The Language tab configures the language for your page (see Figure 3.16). The
    language setting determines the page encoding for the page.


    Web browsers rely on the page encoding and language settings to determine how
    to properly display your page. Make sure you have correctly set these for the
    language and region you are targeting. In all cases, the default settings are
    fine. However, if you are designing a page for a specific region or language,
    you set the encoding appropriately and test the site for the correct appearance.


    The Language tab also enables you to control whether Expression Web includes a
    byte order mark (BOM) on your page. A bom is a hidden sequence of characters at
    the beginning of a file that can be used to determine encoding characteristics
    of the file. Some file types (such as PHP files) will not have a BOM added to
    the page, so Expression Web will configure which types will work by default. You
    can override these settings in the Language tab for a particular file as shown
    in Figure 3.16.


    > For more information on configuring BOM settings in Expression Web, see Chapter
    11, "Configuring Page Editor Options."


    ![](bbox=[0.078, 0.473, 0.922, 0.74])


    # Using Code Snippets


    Web designers commonly reuse code snippets in several pages. Whether you''re reusing
    a single line of code or a code block, you need to avoid typos at all costs. Code
    snippets prevent typos and add a high degree of convenience to code reuse.


    To insert a code snippet into your page, switch to Code View and press Ctrl+Enter.
    Select the desired code snippet from the list and press Enter, as shown in Figure
    3.17, and it will be added to your page automatically. You can also double-click
    the snippet and it will be added to your page.'
  merge: -1
