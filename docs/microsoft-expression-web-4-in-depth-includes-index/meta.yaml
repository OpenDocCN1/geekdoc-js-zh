  md: '# Browser Size Drop-Down


    The Browser Size drop-down contains a list of popular resolution settings and
    allows you to preview your page using whatever resolution you choose. If your
    desired resolution is not listed, you can choose Custom Size from the drop-down
    as shown in Figure 13.7, and you can then define your own size.


    ![](bbox=[0.042, 0.237, 0.898, 0.439])


    After you select a new browser size, SuperPreview regenerates any previews it
    is currently displaying.


    Now let''s use SuperPreview to investigate a rendering problem in a page so you
    can begin to fully realize the power and potential of this tool.


    # Using SuperPreview to Preview Layout


    You''ve probably already realized that SuperPreview can be an incredibly valuable
    tool when you know that your page renders differently in a specific browser version.
    However, you might not realize that SuperPreview can help identify subtle rendering
    differences you might not have even aware of. Let''s look at just an example as
    we discover how SuperPreview can identify why your page renders slightly differently
    in two different browsers.


    # Setting Up the Preview


    The first thing you need to do when using SuperPreview is choose your browsers.
    For this particular test, we''re going to select Firefox 3.6.6 as the baseline
    browser and Internet Explorer 8 in IE7 compatibility mode as the comparison browser.
    To do this, simply click Firefox 3.6.6 in the left preview pane and Internet Explorer
    8 → 7 in the right preview pane. Your SuperPreview dialog should look like the
    one shown in Figure 13.8.


    > note To select Firefox 3.6.6, you must have Firefox 3.6.6 installed. To select
    Internet Explorer 8 → 7, you must have Internet Explorer 8 installed.'
