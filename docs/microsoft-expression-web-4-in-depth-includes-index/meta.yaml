  md: '# Customizing Code Formatting


    The formatting of code can be customized by selecting Tools, Page Editor Options
    and clicking the Code Formatting tab. As shown in Figure 4.15, there are many
    options to configure. By selecting a Tags list, you can customize that particular
    tag. CSS code can also be customized.


    At the top of the Code Formatting tab are settings that apply to all code in Code
    View. However, these settings do not affect existing code. Only edited pages and
    new pages are affected by these settings.


    The following check boxes are available in the upper-left section of the Code
    Formatting tab:


    +   - **Tag Names Are Lowercase**—When this box is checked, HTML tag names are
    added in lowercase. This is the default setting.


    +   - **Attribute Names Are Lowercase**—When this box is checked, HTML attributes
    are added in lowercase. This is the default setting.


    > caution uncheck either of these check boxes, Expression Web creates all new
    pages with uppercase tag names and attributes. Current Web standards require HTML
    tag names and attributes to be lowercase. Therefore, pages created with either
    of these boxes will not be compatible with existing standards.


    Figure 4.15


    You don''t have to settle for how Expression Web formats your code. You can change
    the rules any way you choose.


    ![](bbox=[0.087, 0.474, 0.915, 0.836])'
  merge: -1
  pgno: 99
- img_proc: false
  md: '# Using Page Views


    +   - Attribute Names Are Alphabetized—When this box is checked, Expression Web
    alphabetizes the attributes of HTML elements. This is the default setting.


    +   - Allow Line Breaks Within Tags—By default, Expression Web does not have hard
    line breaks within tags. If this box is unchecked, Expression Web adds a hard
    line break between attributes within a tag if the length of the tag exceeds the
    number of characters specified for the right margin.


    You can also configure the tab and margins in code view by changing the settings
    in the upper-right of the Code Formatting tab. By default, Expression Web uses
    tabs as spaces. If you uncheck the Insert Tabs as Spaces box, Expression Web uses
    nonbreaking spaces instead.


    The Tags section of Code Formatting tab makes it easy to configure the specific
    tags are formatted in Code View. Select a tag from the Tags list and then change
    the appropriate settings as desired. You can configure to omit start tags and
    end tags and change the contents of the tag indented as well.


    The options available change depending on which tag you have selected. For example,
    if a tag doesn''t have a corresponding end tag (such as the &lt;br&gt;), the Omit
    End tag box is checked and disabled.


    CSS elements can be formatted using the settings in the bottom section of the
    Code Formatting tab. You can also control how Expression Web generates more complex
    CSS using the Shorthand Properties When Generating Styles box. When this box is
    checked (the default setting), Expression Web combines CSS properties in one element
    whenever. For example, if a three-pixel border is applied to a table cell, Expression
    Web creates CSS code like the following default:


    ```

    border: 3px solid #00FF00;

    ```


    If the Shorthand Properties When Generating Styles box is unchecked, Expression
    Web creates the style using the following CSS code:


    ```

    border-top-width: 3px;

    border-right-width: 3px;

    border-bottom-width: 3px;

    border-left-width: 3px;

    border-top-color: #00FF00;

    border-right-color: #00FF00;

    border-bottom-color: #00FF00;

    border-left-color: #00FF00;

    border-top-style: solid;

    border-right-style: solid;

    border-bottom-style: solid;

    border-left-style: solid;

    ```


    > caution

    rolling spacing with non-breaking spaces is usually not recommended. It can make
    spacing unpredictable and should be avoided.


    > caution

    Unlike the HTML formatting options in the Code Formatting tab, the CSS options
    may affect existing CSS code as well as new CSS code.'
