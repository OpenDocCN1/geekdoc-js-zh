  md: '# ABOUT THE AUTHOR


    Jim Cheshire is the owner of Jimco Software and Books and is the author of several
    design books and books on the Amazon Kindle and Barnes and Noble Nook. In his
    real job, Jim works as a senior escalation engineer at Microsoft on the ASP.NET,
    IIS, and Expression Web teams. He has worked on the FrontPage, Visual Basic, ASP,
    IIS, and ASP.NET teams at Microsoft more than 12 years.


    You can reach Jim by visiting one of his websites: www.jimcobooks.com or www.jimcosoftware.com.
    You can also email him jcheshire@jimcobooks.com.


    # DEDICATION


    This book is dedicated to my lovely wife, Becky, and my two children. I love you
    all very much.


    # ACKNOWLEDGMENTS


    I owe a debt of gratitude to my editors at Que Publishing. Loretta, it''s been
    such a pleasure to work with you over the years. Todd, thanks for your consistent
    work to improve what comes out of my min. To Kathleen and Ian, thank you for your
    hard work in ensuring this book is technically accurate and easy to understand.
    To Seth, thanks for your commitment to a quality book. Although the cover of this
    book bears my name only, the book would not have been possible without the commitment
    of all of you, and I am sincerely thankful for all your hard work. Thanks to Anna
    Ulrich, Paul Bartholomew, Justin Harrison, Steve Gutman, Erik Saltwell, Marc Kapke,
    Mike Calvo, and Erik Mikkelson at Microsoft, all of whom were of great help in
    answering questions that arose during the writing of this book. I also owe John
    Dixon at Microsoft a special thank you for always being available for questions
    about add-in development. Without John''s asistance, the last part of this book
    simply wouldn''t have been possible.


    —Jim'
