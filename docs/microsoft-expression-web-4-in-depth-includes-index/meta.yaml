    # Tables in Expression Web


    You have several ways to work with tables in Expression Web, but you can break
    them all down into four major methods: the Insert Table dialog, the Table menu,
    the Tables toolbar, and the Tag Properties panel. Each method is suitable to specific
    types of tags, that you might gravitate toward one than the others. Even so, it''s
    best to learn the strengths of each method so you can efficiently create and manage
    your tables.


    +   * For more information on using the Tag Properties panel, see Chapter 7, "Editing
    Tag Properties."'
