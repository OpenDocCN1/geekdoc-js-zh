  md: '# The SuperPreview Interface


    Before we get too much further into using SuperPreview, it might help to look
    at the SuperPreview user interface. After we''ve reviewed all of the interface
    tools available, we''ll look at how you can use those tools to identify rendering
    problems in your pages.


    # Pointer Modes


    The leftmost two toolbar buttons control the pointer mode, meaning how the mouse
    pointer works in SuperPreview. The first button changes the pointer mode to Selection
    mode. With Selection mode enabled, clicking inside the preview selects the element
    on you click. This is useful for examining the specific properties of a page element.


    The next button sets the pointer mode to Panning mode. With this mode selected,
    you can drag the page you are previewing so you can view areas of the page that
    don''t fit within the confines of the preview window.


    Pointer modes are mutually exclusive. In other words, clicking the Selection button
    activates Panning mode, and vice versa.


    # DOM Highlighting


    When operating in Selection mode, clicking any page element selects that element.
    SuperPreview uses one of two highlighting modes to identify which DOM element
    is selected. Highlighting modes are selected using the Box Highlighting Mode and
    the Lights-Out Highlighting Mode buttons, as shown previously in Figure 13.2.


    > When you change the DOM highlighting mode, your pointer mode automatically switches
    to Selection mode.


    When Box Highlighting Mode is selected, clicking a DOM element draws a border
    around the element. When Lights-Out Highlighting mode is selected, clicking a
    DOM element highlights the selected element and causes all other DOM elements
    to appear dimmed, as shown in Figure 13.3.


    # UI Helpers


    The next section of the toolbar contains three user interfaces. The Toggle Ruler
    Visibility toggles the display of the rulers along the edges of the preview window.
    The Toggle Thumbnail Visibility button toggles a small thumbnail view of the page
    in the lower-right corner of each preview. The Toggle Guide Visibility button
    toggles the display of the guides.'
  merge: -1
  pgno: 238
- img_proc: false
  md: '# The SuperPreview Interface


    Figure 13-3

    Lights-Out

    Highlighting mode lets you easily identify exactly which DOM element is selected.
    In this figure, the Welcome banner is selected.


    ![](bbox=[0.208, 0.137, 0.905, 0.483])


    # Layout Modes


    The Layout Modes section of the toolbar contains buttons to control how your previews
    are laid out.


    The Vertical Split Layout button shows the baseline and comparison browser side-by-side.
    This is the default setting. The Horizontal Split Layout button displays the baseline
    and comparison browser views on one of the other. The Overlay Layout button provides
    a view of the baseline browser superimposed on top of the comparison browser as
    shown in Figure 13.4.


    Finally, the Single Layout button allows you to view either the baseline browser
    or the comparison browser in its own window.


    > tip

    Another quick and easy to preview a page from a disk-based site in SuperPreview
    is to right-click the file in Expression Web''s Folder List panel and select Display
    in SuperPreview from the menu. The benefit to this method is ASP.NET and PHP pages
    using the Microsoft Expression Development Server so you will see the page way
    viewers of your site will see.


    # Preview URL


    The URL you are previewing is specified using the Location text box. However,
    you can also click the ellipsis button and select a file on your local disk to
    preview. This is useful in cases where you want to view a preview of a file in
    a disk-based site before publishing to the Internet.'
