    Expression Web adds a remote browser service so you can see what your site looks
    like on Safari running on a Mac.


    SuperPreview also offers tools for identifying and correcting problems with position
    and other rendering problems.


    > For more information on using SuperPreview, see Chapter 13, “Using SuperPreview.”


    # CSS Reports


    To aid in cleaning up unused CSS or simply run a report containing details on
    CSS usage, Expression Web offers the CSS Reports feature (see Figure 1.20).'
