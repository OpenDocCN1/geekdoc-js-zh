  md: '# USING SUPERPREVIEW


    # An Overview of SuperPreview


    In the early days of web design, it wasn''t uncommon for a page to render very
    differently from one browser to the next. Web standards were still largely in
    flux and proprietary code was widespread. Because of these conditions, web designers
    would typically spend a considerable amount of time implementing hacks to fix
    rendering problems or would design for one particular browser flavor and recommend
    that site visitors use that specific browser.


    Web standards have solidified greatly over the years, and modern browsers are
    typically compliant with those standards. However, these conditions don''t mean
    the end of compatibility concerns. Some users are still using older browsers,
    and some of those browsers can introduce serious layout problems.


    # SuperPreview


    Expression Web includes SuperPreview, an extremely powerful tool for identifying
    and correcting layout problems with your site. SuperPreview has many benefits
    over traditional tools for previewing pages, but perhaps the most revolutionary
    is the capability to preview a page without having to install multiple versions
    of Internet Explorer and the ability to preview your page in Safari on a Mac using
    the remote browser service.


    SuperPreview enables you to view a preview of a page in a baseline browser and
    a comparison browser. Figure 13.1 shows a SuperPreview preview of the Jimco Books
    site using Internet Explorer 6 as the baseline browser and Firefox 3.6.6 as the
    comparison browser. SuperPreview''s built-rendering engine for Internet Explorer
    6 makes it possible to see exactly what your page looks like in Internet Explorer
    6 without having to installed on your system.'
  merge: -1
  pgno: 235
- img_proc: false
  md: '# How SuperPreview Generates a Preview


    When you launch SuperPreview, it first determines which browsers will be available
    for preview. If you have Internet Explorer 6 installed, SuperPreview only provides
    a preview of Internet Explorer 6. If you have Internet Explorer 7, SuperPreview
    makes Internet Explorer 6 and 7 available for preview. If you have Internet Explorer
    8, SuperPreview makes Internet Explorer 6, 7, 8, and Internet Explorer 8 in IE7
    compatibility mode available for preview.


    In addition to these IE versions, SuperPreview also makes Firefox available as
    if you have Firefox installed. SuperPreview also supports Safari on the Mac using
    a remote browser service.


    +   - For more information on previewing using remote browsers, see "Using Remote
    Browsers," p. 230.


    To generate a preview using SuperPreview, first select the baseline browser by
    selecting one of the options from the left pane; then select a comparison browser
    from the right pane. Enter a URL to preview in the Location box as shown in Figure
    13.2 and press Enter.


    > note Microsoft has released two different versions of SuperPreview. SuperPreview
    for Internet Explorer is free, standalone application and supports only Internet
    Explorer. SuperPreview with Expression Web adds support for Firefox and remote
    browsers and is integrated with Expression Web. However, it can also be launched
    using the Microsoft Expression Web 4 that is installed in your Start menu when
    Expression Web is installed.


    ![](bbox=[0.058, 0.137, 0.76, 0.477])'
