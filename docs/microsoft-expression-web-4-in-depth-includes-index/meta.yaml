  md: '# Maintaining Compatibility and Accessibility


    ![](bbox=[0.065, 0.115, 0.715, 0.395])


    # Using Reports to Find Problems


    Expression Web has three reporting options designed to aid in locating problems
    with code:


    +   ** Accessibility Reports**—Also called the Accessibility Checker, this report
    locates any code problems affecting the accessibility of your site.

    * **Compatibility Reports**—This report analyzes your page code and shows problems
    with code that doesn''t comply with the standards you''ve specified.

    * **CSS Reports**—This reports on CSS usage and shows any problems with CSS code
    in your site.


    CSS reports are covered in-depth in Chapter 18, "Managing CSS Styles." Therefore,
    we won''t go into any detail on the reports here.


    To access accessibility reports, select Tools, Compatibility Reports to display
    the Compatibility Dialog, as shown in Figure 12.15. You have the option of checking
    all pages, all open pages, selected pages, or the current page using Check Options.
    Pages can be checked against selected HTML/XHTML standards using the Check HTML/XHTML
    Compatibility With drop-down, and CSS code can be checked against a CSS standard
    in the Check CSS Compatibility With drop-down.


    If you have a doctype declaration on your pages, you can check the Run Check Based
    on Doctype Declaration in Page if Available check box and the Compatibility Checker
    checks your pages based on the doctype. When you use this option, the setting
    in the Check HTML/XHTML Compatibility With drop-down is ignored if a doctype declaration
    is on your page.'
  merge: -1
  pgno: 232
- img_proc: false
  md: '# Figure 12.15


