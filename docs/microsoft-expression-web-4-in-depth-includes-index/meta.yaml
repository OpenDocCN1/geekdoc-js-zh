    # Behaviors


    Behaviors are a collection of easily configurable actions that are implemented
    with a client-side script. Using behaviors, you can create dynamic effects that
    would normally require a considerable amount of code, and you can do it without
    knowing anything about writing client script. Behaviors are accessed via the Behaviors
    panel, as shown in Figure 1.22.


    +   For more information on using behaviors, see Chapter 21, "Using Behaviors."


    # Layers


    Layers are commonly used in scripted, dynamic pages. Expression Web provides tools
    that allow you to create layers and manipulate them easily.

    Layers are configured using the Layers panel (see Figure 1.23).


    +   For more information on using layers, see Chapter 23, "Using Layers."'
