  md: '# Site Optimization


    Site optimization is an important part of developing any website. After you have
    developed your site, you need to clean up any CSS code problems, fix any browser
    incompatibilities, and ensure that your site is compliant with the latest accessibility
    standards. Expression Web offers tools for all tasks.


    # Accessibility Checker


    There are two standards for website complian: Section 508 and the Web Content
    Accessibility Guidelines (WCAG). Learning all the ins and outs of each would be
    a challenging task. Fortunately, Expression Web can run reports that show how
    your site fares with both standards.


    The Accessibility Checker feature (see Figure 1.16) highlights pages in your site
    that don''t meet standards and enables you to correct problems before you deploy
    your site.


    > note Expression Web will check your site only against WCAG 1.0. It will not
    check your compliance with WCAG 2.0.


    ![](bbox=[0.067, 0.453, 0.473, 0.606])


    Figure 1.16 The Accessibility Checker ensures that your site meets the accessibility
    standards.


    +   * For more information on accessibility features in Expression Web, see Chapter
    12, “Maintaining Compatibility and Accessibility."


    # Compatibility Checker


    Ensuring that your site renders properly in all browsers is a difficult task.
    Expression Web offers the Compatibility Checker feature so you can identify rendering
    problems before they affect your site visitors (see Figure 1.17).


    The Compatibility Checker allows you to check against a browser version, document
    type, and CSS standard.


    +   * For more information on using Compatibility Checker, see Chapter 12, “Maintaining
    Compatibility and Accessibility."'
  merge: -1
  pgno: 34
- img_proc: false
  md: '# Figure 1.17


    The Compatibility Checker can help you avoid any rendering problems.


    ![](bbox=[0.468, 0.133, 0.905, 0.303])


    # SEO Checker


    The SEO Checker feature is new to Expression Web and makes it easy to optimize
    your site for search engines. The Learn More About SEO link (shown in Figure 1.18)
