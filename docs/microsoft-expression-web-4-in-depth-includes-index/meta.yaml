  md: 'Expression Web marks invalid code in Code View by adding a squiggle, underline
    to it. It also marks some errors (such as missing tags) by highlighting them in
    yellow. Visual indicators are a great bonus when trying to locate code problems.


    To access Code View, click the Code button at the bottom of the design surface.
    Expression Web''s Code View (shown in Figure 4.14) is a robust environment where
    you can work with code efficiently. Some of the tools that make working in Design
    easy are also available in Code View, and code-specific tools are available that
    let you work with code even if you''re not an expert in HTML, CSS, and scripting.


    As Figure 4.14, several features have been designed around making code more readable
    in Expression Web. Code is indented to make it more readable. Line breaks are
    inserted automatically in tabs so code is easy to understand. What you can''t
