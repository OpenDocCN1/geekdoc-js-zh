  md: '# Maintaining Compatibility and Accessibility


    # Code View Errors and Compatibility Checker Don’t Match


    If one see in the Compatibility Checker, but in Code View, Expression Web is highlighting
    many errors that don''t show up in the Compatibility pane, it''s likely that you
    are using a standard in the Compatibility Checker that does not match the standard
    in the Page Editor Options dialog. You can avoid this kind of problem by always
    including a doctype declaration on your pages.


    By clicking the small arrow at the right edge of the Compatibility pane, the results
    can be filtered using either the drop-down menu that appears or by selecting Custom
    from the menu and entering criteria in the Custom AutoFilter. To remove the filter
    you''ve applied, right-click the column header and select Clear Filters, as shown
    in Figure 12.17.


    ![](bbox=[0.062, 0.373, 0.775, 0.545])


    > Figure 12.17

    Filters can be removed using the context menu that appears when you right-click
    a column header.


    # Seeing Color


    Many of us are grateful that we see the same colors as we do. In fact, many people
    do not. There are many forms of color blindness, and each of them can affect the
    way your site appears. However, because most of us see color accurately, ensuring
    our sites appear correctly to those with a form of color blindness is a tough
    job. Vischeck can make it at easier.


    Vischeck (www.vischeck.com/vischeck/) offers a site where you can enter a URL
    and generate a view of what the URL looks like with various forms of color blindness.
    You can also upload an image file and Vischeck provides a view of that image as
    it appears to someone with color blindness.


    If you''d prefer, you can download a plugin-for Vischeck (free of charge) that
    allows you to use Vischeck''s algorithm on images from Adobe Photoshop or another
    image-editing application that supports Photoshop plug-ins.


    Choosing colors for your site is a critical task. You can avoid selecting colors
    in a vacuum by using Vischeck to ensure that your choices make your site accessible.'
  merge: -1
