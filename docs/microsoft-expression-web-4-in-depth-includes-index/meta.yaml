  md: '# Photoshop Content


    Expression Web enables you to conveniently include Adobe Photoshop content in
    your site. You can choose layers to import as in Figure 1.24.


    Figure 1.24

    Adobe Photoshop users have some powerful tools in Expression Web.


    ![](bbox=[0.213, 0.211, 0.915, 0.532])


    +   - For more information on using Photoshop import features, see Chapter 9,
    "Using Graphics and Multimedia."


    # Deep Zoom Images


    Deep Zoom makes it possible to display and zoom into large images on a page without
    a slowdown in performance. Expression Web lets you insert a Deep Zoom image onto
