  md: '# 7


    # EDITING TAG PROPERTIES


    # An Introduction to Tag Properties


    One of the greatest things about Expression Web is that it provides many tools
    that make it easy to dig into the makeup of a page. The Tag Properties panel is
    one of those tools. It is a powerful way of examining the makeup of specific HTML
    tags. Not only that, but you can also easily set tag properties using the Tag
    Properties panel.


    # Understanding the Tag Properties Panel


    When an HTML element is selected in either Design View or Code View, properties
    of the selected tag are displayed in the Tag Properties panel, as shown in Figure
    7.1.


    > note

    A comprehensive discussion of HTML attributes is beyond the scope of this book.
    For a complete reference of HTML attributes, read Special Edition HTML and XHTML,
    available from Que Publishing.'
  merge: -1
