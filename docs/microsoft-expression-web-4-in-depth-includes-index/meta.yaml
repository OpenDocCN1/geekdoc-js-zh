  md: '# 12


    # MAINTAINING COMPATIBILITY AND ACCESSIBILITY


    # An Introduction to Accessibility


    It''s amazing to think that despite the fact that the World Wide Web is in its
    infancy, access to it has become an integral part of our lives. Access to the
    Web is quickly becoming just a convenience, but a necessity. This sense of necessity
    has largely driven the need for computer applications and sites to be accessible
    to people who might have hearing loss, low vision, or other disabilities. In fact,
    in 1998, Congress enacted the Workforce Investment Act, which consisted (in part)
    of an amendment to the Rehabilitation Act of 1973. That amendment was titled Section
    508, and it has become synonymous with accessibility in the world of technology.


    Government agencies and most educational institutions are required to abide by
    Section 508 requirements. Section 508 specifies requirements not only for sites,
    but also for multimedia, video, telecommunication products, and more. It is far-reaching
    legislation that affects most web designers.


    Accessibility doesn''t just refer to the ability of people with vision problems
    to experience a site via a screen reader. It also applies to proper color choice
    so that those with various types of color blindness can read your site and so
    on. It even prohibits design techniques that can cause screen flicker beyond a
    certain frequency. In all in, 16 rules comprise Section 508 standards.'
  merge: -1
  pgno: 219
- img_proc: false
  md: ''
  merge: -1
  pgno: 220
- img_proc: false
  md: '# Figure 12.2


    Enter the text for your ScreenTip. It will then be available to a screen reader
