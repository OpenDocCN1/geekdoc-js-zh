- img_proc: false
  md: '# Exploring Page Editor Options


    +   **Automatically Add ''lang'' Attributes to International Text—**If you enter
    text in a language other than the language specified for the page, Expression
    Web adds a ''lang'' attribute for the text that you enter. For more information
    on the ''lang'' attribute, see www.w3.org/TR/html401/doc/lang.html#adef-lang.


    +   **Prompt for Accessibility Properties When Inserting Images—**Expression Web
    prompts you for alternative text and long descriptions when inserting images.
    If you prefer not to be prompted, uncheck this box.


    > caution

    Turn off the Accessibility Properties When Inserting Images feature makes it likely
    that you will forget to add alternative text or long descriptions to your images.
    If you omit these attributes from your images, your site will not pass accessibility
    standards.


    For information on accessibility settings, see Chapter 12, "Maintaining Compatibility
    and Accessibility."


    The second section of the General tab provides spelling options, most of which
    are configured by clicking the Spelling Options button, as shown previously in
    Figure 11.1. When the Spelling Options button is clicked, the Spelling Options
    dialog shown in Figure 11.2 is displayed so you can configure how Expression Web
    checks spelling.


    Figure 11.2

    The Spelling Options dialog provides options to customize how Expression Web checks
    your spelling.


    ![](bbox=[0.536, 0.483, 0.917, 0.792])


    You can also select a language for spell-checking by clicking the Default Page
    Language drop-down on the General tab and selecting the language of your choice.


    The third section of the General tab contains one check box: Show Paste Options
    Buttons. This check box is checked by default and causes Expression Web to display
    the Paste Options button when you paste content onto a page, as shown in Figure
    11.3. You can disable the Paste Options button by unchecking the box.'
