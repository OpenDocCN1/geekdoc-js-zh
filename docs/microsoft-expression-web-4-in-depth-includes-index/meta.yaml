    # Cannot Locate Server Error Creating FTP Site


    If Expression Web cannot locate an FTP site you''ve created, it''s likely that
    you mistyped it. However, there are other reasons this might fail.


    Try opening a command prompt and pinging the FTP site. For example, the following
    command tests for the existence of an FTP server at jimcosoftware.com:


    ```

    ping ftp.jimcosoftware.com

    ```


    If you get no reply from the ping, it means you aren''t getting to the server.
    Check your Internet connection by browsing to a new site. If that works and you
    still can''t access the FTP site, check with the server administrator or your
    hosting company.


    # Repeatedly Prompted for Username and Password


    Suppose you''re trying to create a site on a remote server. When you enter your
    username and password, the dialog asking for your credentials keeps popping back
    up.


    This is almost certainly caused by a typographical error in the username/or password.
    Assuming you aren''t mistakenly entering the wrong case because the Caps Lock
    key is engaged, carefully retype your username and password. If the server still
    won''t accept them, contacting your hosting company or server administrator.'
