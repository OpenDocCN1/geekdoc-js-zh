    # Inserting Multimedia


    Web designers have always sought out ways to add more interactivity to sites.
    One way is to add multimedia elements to a site. In the early days, web developers
    were limited to animated graphics, a trend that quickly became obsolete and annoying.
    However, as technology has improved over the years, multimedia options have increased
    to the point where adding effective multimedia to your site is now easy.


    Expression Web offers the capability to insert Flash movies, Microsoft Silverlight
    applications and video, Microsoft Deep Zoom images, and Windows Media content.


    # Inserting Flash Movies


    To insert a Flash movie, select Insert, Media, Flash Movie. You''ll be asked to
