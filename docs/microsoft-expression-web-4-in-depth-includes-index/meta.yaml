    ![](bbox=[0.135, 0.13, 0.925, 0.237])


    For more information on inserting hyperlinks, see “Creating Hyperlinks,” Chapter
    3, p. 55.


    # Accessible Tables


    When creating a table, it’s often tempting to describe the table in the site’s
    text and present the data without headers. However, Section 508 requires that
    all tables containing data must contain header information. The table shown in
    Figure 12.3 is compliant with Section 508 guidelines.


    # Figure 12.3


    All tables must have header information. This table meets that requirement.


    ![](bbox=[0.237, 0.447, 0.913, 0.833])


    For more information on creating tables, see Chapter 5, “Using Tables.”'
