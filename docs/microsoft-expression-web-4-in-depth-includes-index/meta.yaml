    # Ruler and Grid


    The Ruler and Grid feature of Expression Web can make it easier to position items
    in your page, especially if you are using absolute positioning with CSS.


    +   For more information on CSS positioning, see Chapter 18, "Managing CSS Styles."


    > tip: When you double-click an HTML comment formatting mark, you can edit the
    HTML comment without switching to Code View.


    The Ruler makes positioning easier by displaying horizontal and vertical indicators
    that originate from the upper-left corner of the page, as shown in Figure 4.6.


    As you move your mouse over the design surface, the Ruler shows the precise position
    by displaying position indicator marks on both the vertical and horizontal rulers.
    This makes positioning and resizing objects easy. For example, when you are dragging
    a layer to a new position, it''s helpful to have a visual representation of the
    mouse pointer''s exact coordinates.


    > tip: The Ruler uses the same coordinate system as absolute positioning. By default,
    the upper-left corner of Design View is at o, o. This is called the origin.


    As previously mentioned, the Ruler''s origin is the upper-left corner of the design
    surface. You can, however, move the origin in one of two ways: you can drag the
    upper-left corner of the ruler to a new location or you can select something on
    the page, right-click the Ruler, and select Set Origin From Selection. In Figure
    4.7, a layer is selected. When Set Origin From Selection is selected on the menu,
    the origin of the Ruler is reset to the upper-left corner of the layer. To reset
    the origin to its original location, right-click the Ruler and select Reset Origin.'
