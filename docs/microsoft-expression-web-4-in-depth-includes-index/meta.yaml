- img_proc: false
  md: '# Editing Tag Properties


    # Figure 7-1


    The Tag Properties panel provides a convenient way to dig into the properties
    of any HTML tag.


    ![](bbox=[0.75, 0.123, 0.266, 0.423])


    # Tag Properties Panel Not Visible


    If the Tag Properties panel isn''t visible, select Panels, Tag Properties from
    the main menu to enable the panel.


    By default, the Tag Properties panel shows properties grouped into three categories:
    attributes, events, and miscellaneous. (Any attribute that is not standards-compliant
    will be categorized as miscellaneous.) You can collapse any category by clicking
    the minus sign next to the category name, as shown in Figure 7.2. To expand a
    collapsed category, click the plus sign next to the category name.


    > tip

    The Tag Properties panel is context-sensitive. The properties that are visible
    in it depend on the type of element selected on your page.


    > tip

    The Events displayed in the Tag Properties panel are technically attributes as
    well. However, Expression Web divides each into its own category to make it easier
    to write code to handle a particular event.


    > tip

    You can also double-click a category name to collapse and expand that category.'
