  md: '# Configuring Page Editor Options


    ![](bbox=[0.058, 0.103, 0.532, 0.506])


    > Figure 11.1

    All general options for Expression Web are located on the General tab.


    The following options are available in the first section of the General tab:


    +   **Autmatically Enclose Form Fields Within a Form—**By default, the first form
    field you insert on a page is automatically wrapped in an HTML `<form>` tag. You
    can override this by unchecking this box.


    +   **Assign Unique IDs to New Tables—**If you want Expression Web to add an ID
    attribute to all new tables, check this box. Existing tables are not affected.


    +   **Make ID Unique on Paste—**When this option is checked, Expression Web ensures
    that no duplicate controls are created when a control is pasted onto a page.


    +   **Use <strong> and <em> When Using Bold and Italic Toolbars—**By default,
    Expression Web uses the `<strong>` and `<em>` tags to apply bold and italic formatting,
    respectively. This method is preferred to the alternative of using `<b>` and `<i>`
    tags, both of which are obsolete.


    +   **Autmatically Switch Keyboard to Match Surrounding Text—**Windows has the
    capability to use different virtual keyboard layouts for different languages.
    You can check this box to cause Expression Web to automatically switch your keyboard
    based on the language of the text surrounding the insertion point.'
  merge: -1
