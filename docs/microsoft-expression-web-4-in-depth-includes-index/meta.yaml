  md: '# 74


    # Using Page Views


    Some formatting marks offer powerful capabilities. If you double-click a formatting
    mark, you can edit the script it represents, as shown in Figure 4.5.


    # Figure 4.5

    Formatting marks make it easier to edit scripts and other non-visual elements.


