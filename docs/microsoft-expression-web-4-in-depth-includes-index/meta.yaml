  md: '# caution


    If you''re a notebook with wireless capability, you probably use wireless Internet
    access in hotels when you travel. Beware that many hotel networks are insecure,
    and anything you transmit and receive over the wireless network can be intercepted
    by anyone else in the hotel using the wireless network.


    When you are in a hotel and need to use its wireless network, use a virtual private
    network (VPN) solution such as Hamachiz (https://secure.logmein.com/products/hamachiz/)
    or GoToMyPpc (www.gotomypc.com) so you can securely access the network. You can
    also connect the hotel''s wired network (Ethernet cable) to a wireless access
    point such as Apple''s Airport Express to create your own secure network.


