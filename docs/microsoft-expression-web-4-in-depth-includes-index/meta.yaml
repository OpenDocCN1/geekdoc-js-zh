    # CSS Layouts


    When you choose the CSS Layouts option in the New dialog, you have the option
    of selecting from a series of page layouts. When you choose a particular layout,
    Expression Web creates a new CSS file as well as a new HTML page and then links
    the CSS file to the HTML page. Code is also added to the HTML page and the CSS
    file that creates the layout you choose.

    After selecting the desired layout, you can modify the CSS file to customize the
    appearance of the page.


    +   - For more information on modifying CSS files, see Chapter 18, "Managing CSS
    Styles."


    The CSS Layouts option allows you to easily create page layouts that are CSS-based
    instead of using tables or other traditional techniques. CSS-based layouts are
    growing in popularity, largely because today''s browsers are capable of rendering
    them consistently. However, if you choose to use a CSS layout, you should check
    your site carefully in a variety of browsers.


    # Style Sheets


    The Style Sheets section offers a wide assortment of precreated CSS files that
    you can use in your site. Unfortunately, Expression Web doesn''t provide a preview
    of the styles present in the CSS files, so you will need to apply one to your
    site to see what kind of formatting it will provide.'
  merge: -1
  pgno: 68
- img_proc: false
  md: 'The CSS files are a great way to move to CSS, as long as you are willing to
    do modification to them when they do not give you what you want. For example,
    in my experience, the colors applied by these CSS files are a bit loud and unpleasant
    in appearance. However, they are easily modified.


    > > tip You might be better off using the CSS files supplied with Expression Web
    as you''ve gained a better understanding of CSS, it''s best to create your own
    CSS files so you have complete control over them.


    # # Frames Pages


    The Frames section provides a series of frame layouts. In many cases, you also
    choose one of the frame layouts, Expression Web creates all the pages that you
    make for your layout.


    +   * For more information on using frames, see Chapter 6, "Using Frames."


    # # Importing Files


    Adding content often is more than just entering and configuring text. In many
    cases, you are also adding graphic files, Flash animations, video files, and other
    files.


    To import files into your site, select File, Import, File to display the Import
    dialog shown in Figure 3.2.


    Click the Add Folder button to import one or more files. You can also click Add
    Folder to import a folder and all the files inside that folder. If you want to
    change the name of an imported file, select the file and click the Modify button.
    To complete the import process, click OK. The files will not be imported into
    the site until you click OK.


    > > tip Files and folders added to the Import dialog remain until you complete
    the import process, remove them, or close the site. That means you can add files
    and folders and then import them later. If you close a site with files still on
    the import list, Expression Web asks you whether you want to import before closing
    the site.


    # Figure 3.2


    You''ll likely want to import some graphics and other files into your site. The
    Import dialog makes it easy.


