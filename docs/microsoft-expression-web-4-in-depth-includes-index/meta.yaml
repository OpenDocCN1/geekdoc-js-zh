    ![](bbox=[0.066, 0.276, 0.933, 0.613])


    # Importing Sites with the Import Site Wizard


    Expression Web''s Import Site wizard, which consists of three primary steps, is
    a convenient and powerful way to import site content. Using the Import Site wizard,
    you can easily control how a site is imported. You can choose whether to use the
    FrontPage Server Extensions, FTP, and so on, and in some cases, you can also specify
    how Expression Web decides which to import certain files.


    The Import Site wizard is accessed by selecting Site, Import, Import Site Wizard.
    Let''s have a look at the steps involved in importing a site.


    # Choosing an Import Method


    First, you need to choose how the site''s files are imported. You can choose among
    the following methods of importing a site:'
  merge: -1
