    \ 电话：+91-929-1840\n\n# Web 技术及其应用 ii\n\n序言\n\n本书汇总了我们作为教育工作者在过去二十年里，在贝尔加姆维斯大学（VTU）的各种与\
    \ Web 技术及其应用相关的本科课程中经常涵盖的主题。本书也可以作为更高级水平的教材，让读者接触日益常见且更合适的替代性和现代计算框架。\n\nWeb 开发是不断演变的语言集合，这些语言协同工作，利用互联网作为传输机制在各方之间接收、修改和交付数据。虽然在概念上很容易描述，但其实施过程伴随着极其丰富的语言、平台、模板、框架、指南和标准。本文通过内部示例关注概念和基础，让开发者对\
    \ Web 开发的各种元素理解，提供了一个基础，使其能够更容易过渡到其他语言，并更好地理解如何开展工作。\n\n促使我们再写一本关于算法的书的原因是由于对许多计算范式的理解发生了几个重要且微妙的变化，以及某些重大发现和不断变化的技术产生的新出的相对重要性。作为老师和导师，我们有责任在年轻人中培养正确的专注，让他们继续享受这项智力上的挑战性活动，并为该研究领域的加强做出贡献。\n\
    \n作者，Pundalik Chavan\nHusna Tabassum\n\n# 简介\n\nPundalik Chavan 教授于2010年毕业于印度卡纳塔塔克邦贝尔加维的\
    \ Visvesarayya 科技大学获得计算机科学与工程学士学位，2013年毕业于班加罗尔大学获得 M.E. 硕士学位。他正在卡纳塔塔克邦班加罗尔理工学院的\
    \ VTU-RC 攻读博士。他在教学/研究领域拥有 10 年以上的工作经验。ISTE 和 IAENG 终身会员。他目前担任班加罗尔 HKBK 工程学院计算机科学与工程系的助理教授。组织并主持了\
    \ SDP/网络研讨会/会议。他的研究领域是无线网络、数据通信、网络安全、计算机网络、物联网、区块链技术。他在各种国家和国际期刊及会议上发表了 6 篇论文。\n\
    \nHusna Tabassum 于贝尔加姆 VTU 获得计算机科学与工程 M-Tech 学位。她目前担任班加罗尔 HKBK 工程学院助理教授。她在教学领域拥有\
    \ 8 年工作经验。ISTE 终身会员。她组织并主持了“基于 Python 的机器学习”增值课程和“使用 JSP 开发 Web 应用”研讨会。目标是追求具有稳步成长的挑战性职业，并为组织的成功做出价值贡献。研究兴趣是数字图像处理、网络安全、云计算。\n\
    \n# Web 技术及其应用（自2018-2019 学年起生效）第六学期\n\n课程代码：18CS63\n学分：4\n总课时：60/50 小时\n\n课程学习目标：本课程使学生能够：\n\
    - 阐 HTML 和 CSS 的语义结构\n- 使用 HTML 和 CSS 编写表单和表格\n- 使用 JavaScript 设计客户端程序，使用 PHP\
    \ 设计服务端程序\n- 研究 PHP 的面向对象编程能力\n- 检查 jQuery 和 Backbone 等 JavaScript 框架，使开发者专注于核心功能。\n\
    \n### 模块 1\nHTML 简介，什么是 HTML？HTML 语法，语义化标记，HTML 文档结构，HTML5 语义元素，CSS 简介，什么是 CSS？CSS\
    \ 语法，样式位置，选择器，层如何交互，盒模型，CSS 样式。\n\n### 模块 2\n表格和表单：引入表格，表单控件元素，表格和表单访问性，标准流，布局元素，响应式设计。\n\
    \n### 模块 3\nJavaScript：客户端脚本，什么是 JavaScript 以及它能做什么？JavaScript 设计原则，JavaScript\
    \ 对象，文档对象模型 (DOM)，JavaScript 事件，服务端开发简介，PHP。\n\n### 模块 4\nPHP 数组和全局变量，$_GET 和\
    \ $_POST，$_SERVER 数组，$_FILES 数组，PHP 类和对象，面向对象设计，错误处理与验证，什么是错误和异常？PHP 错误报告。\n\n\
    ### 模块 5\n状态管理：Web 应用的状态，通过查询字符串传递信息，通过 URL 路径传递信息，Cookie，序列化，会话状态，HTML5 存储，缓存，高级\
    \ JavaScript 和 jQuery，JavaScript 伪类，jQuery 基础，AJAX，异步文件传输，动画，Backbone MVC 框架，XML\
    \ 处理，JSON，Web 服务概述。\n\n学生将能够：\n- 适应 HTML 和 CSS 的语法和语义来构建网页\n- 使用 HTML 和 CSS 构建并格式化表格和表单\n\
    - 使用 JavaScript 开发客户端脚本，使用 PHP 动态生成和显示内容\n- 评估 PHP 的面向对象开发原则\n- 检查 jQuery 和 Backbone\
    \ 等 JavaScript 框架\n\n试卷模式：\n- 试卷共有十道题\n- 每道大题 20 分\n- 每个模块有 2 道大题（最多四道小题）\n- 每道大题将涵盖模块下的所有主题\n\
    - 学生需要回答 5 道大题，每个模块选一道。\n\n教材：\n1. Randy Connolly, Ricardo Hoar, \"Fundamentals\
    \ of Web Development\", 第一版，Pearson Education India. (ISBN: 978-9332572571)\n\n\
    参考：\n1. Robin Nixon, “Learning PHP, MySQL & JavaScript with jQuery, CSS and HTML5”,\
    \ 第四版，O’Reilly Publications, 2015. (ISBN: 9352130153)\n2. Luke Welling, Laura\
    \ Thomson, “PHP and MySQL Web Development\", 第五版，Pearson Education, 2016. (ISBN:\
    \ 978-8236582736)\n3. Nicholas C Zakas, “Professional JavaScript for Web Developers”,\
    \ 第三版，Wrox/Wiley India, 2012. (ISBN: 978-8126530888)\n4. David Sawyer Mcfarland,\
    \ “JavaScript & jQuery: The Missing Manual\", 第一版，O’Reilly/Schroff Publishers\
    \ & Distributors Pvt Ltd, 2014.\n\n"
