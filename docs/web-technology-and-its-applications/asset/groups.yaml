- md: "\nalso handles the processing of the submitted data. In PHP, you may want to\
    \ know whether any form data was submitted at all using either POST or GET. First,\
    \ you can determine if you are responding to a POST or GET by checking the `$_SERVER['REQUEST_METHOD']`\
    \ variable. It contains a string type of HTTP request this script is responding\
    \ to (GET, POST, HEAD, etc.). Even though you may want to, for instance, a POST\
    \ request was performed, you may want to check if any of the fields are set. To\
    \ do this you can use the `isset()` function in PHP to see if there is anything\
    \ set for a particular query string parameter.\n\n## 4.4.2 Accessing Form Array\
    \ Data\n\nSometimes in HTML forms you have multiple values associated with a single\
    \ name; Listing provides another example. Notice that each checkbox has the same\
    \ name value (name=\"day\"). Unfortunately, if the user selects more than one\
    \ day and submits the form, `$_GET['day']` value in the superglobal array will\
    \ only contain the last value from the listbox selected.\n\nTo overcome this limitation,\
    \ you must change the HTML in the form. In particular, you will have to change\
    \ the name attribute for each checkbox from `day` to `day[]`.\n\n### Example\n\
    \nMonday <input type=\"checkbox\" name=\"day[]\" value=\"Monday\" /> Tuesday <input\
    \ type=\"checkbox\" name=\"day[]\" value=\"Tuesday\" /> ....\n\nHTML enables multiple\
    \ values for one name, making this change in the HTML, the corresponding `$_GET['day']`\
    \ will now have a value that is of type array. Knowing how to use arrays, you\
    \ can process the output as shown in Listing the number of days selected and their\
    \ values. The below PHP Code to display an array of checkbox variables:\n\n```php\n\
    <?php\necho \"you submitted \" . count($_GET['day']) . \" values\"; foreach($_GET['day']\
    \ as $d) {\n  echo $d . \", \";\n}\n```\n\n## 4.3 Using Query Strings in Hyperlinks\n\
    \nForm information packaged in a query string is transported to the server in\
    \ one of two locations depending on whether the method is GET or POST. It is important\
    \ to realize that making use of query strings is not limited to only data entry\
    \ forms. You may wonder if it is possible to combine query strings with anchor\
    \ tags ... The answer is YES! Anchor tags (i.e., hyperlinks) also use the HTTP\
    \ method.\n\nImagine a web page in which we are displaying a list of book links.\
    \ One approach would be to have a separate page for each book. This is not a very\
    \ sensible approach. Our database may have thousands of books in it: surely it\
    \ would be too much to create a separate page for each book!\n\nInefficient approach\
    \ to Displaying Individual items would it make a lot more sense to have a single\
    \ Display Book page that receives as input a query string that specifies which\
    \ book to display. We typically pass some type of unique identifier for the query\
    \ string (in this case, using the book’s ISBN).\n\n## 4.3.1 Sensible approach\
    \ to Displaying Individual items\n\nSanitizing Query Strings\n\n- Distrust all\
    \ input.\n\nWhat will happen if the user edits the value of the query string parameter?\
    \ Depending on whether the user removes the parameter or changes its type, either\
    \ an empty screen or an error page will be displayed. Your program must be able\
    \ to handle the following cases for every query string or form value:\n\n- If\
    \ query string parameter doesn’t exist.\n- If query string parameter doesn’t contain\
    \ a value.\n- If query string parameter value isn’t the correct type.\n- If value\
    \ is required for a database lookup, but provided value doesn’t text in the database\
    \ table.\n\nThe process of checking user input for incorrect or missing information\
    \ sometimes referred to as the process of sanitizing user inputs. We might simply\
    \ redirect to a generic error handling page using the header directive, for instance:\n\
    \n```php\nheader(\"Location:error.php\"); exit();\n```\n\n## 4.4 $_SERVER Array\n\
    \nThe `$_SERVER` associative array contains a variety of information. It contains\
    \ some of the information contained within HTTP request headers sent by the client.\
    \ To use the `$_SERVER` array, you simply refer to the relevant case-sensitive\
    \ key name:\n\n```php\necho $_SERVER[\"SERVER_NAME\"] . \"<br/>\"; echo\n$_SERVER[\"\
    SERVER_SOFTWARE\"] . \"<br/>\"; echo\n$_SERVER[\"REMOTE_ADDR\"] . \"<br/>\";\n\
    ```\n\nRelation between request headers, the server and the $_Server array. It\
    \ is worth noting that the entries in this array are created by the web server,\
    \ and not every key listed in the PHP documentation will necessarily be available.\
    \ They can be classified into keys containing request header information and keys\
    \ within information about the server settings (which is often configured in the\
    \ php.ini file).\n\n## 4.5 Server Information Keys\n\nSERVER_NAME is a key in\
    \ the `$_SERVER` array that contains the name of the site that was requested.\
    \ If you are running multiple hosts on the code base, this can be a useful piece\
    \ of information. SERVER_ADDR is a complementary key telling us the IP of the\
    \ server. Either of these keys can be used in a conditional to output extra HTML\
    \ to identify a development server, for example. DOCUMENT_ROOT tells us the file\
    \ location from which you are currently running your script. Since you are often\
    \ moving code from development to production, this key can be used to create great\
    \ scripts that do not rely on a particular location to run correctly. This key\
    \ complements the SCRIPT_NAME key that identifies the actual script being executed.\n\
    \n### Request Header Information Keys\n\n- Web server responds to each HTTP requests\
    \ that contains a request header. These keys provide programmatic access to the\
    \ data in the request header.\n\nThe REQUEST_METHOD key returns the request method\
    \ that was used to access the page: that is, GET, HEAD, POST, PUT. The REMOTE_ADDR\
    \ key returns the IP address of the request, which could be a useful value to\
    \ use in your web applications. In an online poll, for example, you might limit\
    \ each IP address to a single vote. Although these can be forged, the technical\
    \ competence required is high, thus in practice one can usually assume that this\
    \ field is accurate.\n\nMost commonly used request headers is the user-agent header,\
    \ which contains the operating system and browser that the client is using. This\
    \ header value can be accessed using the key HTTP_USER_AGENT. The useragent string\
    \ as posted in the header is cryptic, containing information that is semicolon-delimited\
    \ and may be hard to decipher. PHP has included a comprehensive (but slow) method\
    \ to help you debug these headers into useful information. Listing below illustrates\
    \ a script that accesses and echoes the useragent information.\n\nAccessing the\
    \ user-agent string in the HTTP headers, One can use user-agent information to\
    \ redirect to an alternative site, or to include a particular style sheet. User-agent\
    \ strings are used to allow us to track which types of users are visiting ours.\
    \ HTTP_REFERER is a useful header. Its value contains the address of the page\
    \ that referred to this through a link. It is commonly in analytics to determine\
    \ which pages are linking to our site.\n\n## 4.6 $_FILES Array\n\nThe `$_FILES`\
    \ array contains items that have been uploaded to the current script. `<input\
    \ type=\"file\">` element is used to create the user interface for uploading a\
    \ file from the client to the server. The user interface is only one part of the\
    \ uploading process. `$_FILES` array helps in uploading server script.\n\nHTML\
    \ Required for File Upload To allow users to upload files: First, you must ensure\
    \ that the HTML form uses the HTTP POST method, since transmitting a file through\
    \ the URL is not possible. Second, you must add the `enctype=\"multipart/form-data\"\
    ` attribute to the HTML form that is performing the upload so that the HTTP request\
    \ can submit multiple pieces of data (namely, the HTTP post body, and the HTML\
    \ file attachment itself). Finally, you must include an input type of file in\
    \ your form. This will show up with a browse button before it the user can select\
    \ a file from their computer to be uploaded.\n\nHTML for a form that allows an\
    \ upload, Handling the File Upload in PHP The PHP file responsible for handling\
    \ the upload will utilize the superglobal `$_FILES` array. This array will contain\
    \ a key=value pair for each\n"
  mdcn: "\n还处理了提交的数据。在 PHP 中，你可能想知道是否通过 POST 或 GET 真的提交了任何表单数据。首先，你可以通过检查 `$_SERVER['REQUEST_METHOD']`\
    \ 变量来确定你响应的是 POST 还是 GET 请求。它包含此脚本正在响应的 HTTP 请求类型字符串（GET、POST、HEAD 等）。尽管你可能已经（例如）执行了\
    \ POST 请求，但你可能仍然想检查是否有任何字段被设置。要做到这一点，你可以使用 PHP 中的 `isset()` 函数来查看特定的查询字符串参数是否有设置内容。\n\
    \n## 4.4.2 访问表单数组数据\n\n有时在 HTML 表单中，你可能为一个名称关联了多个值；列表（Listing）提供了另一个示例。注意，每个复选框都有相同的名称值（name=\"\
    day\"）。遗憾的是，如果用户选择了多个日期并提交了表单，超全局数组中的 `$_GET['day']` 值将只包含列表框选中的最后一个值。\n\n为了克服这一局限性，你必须更改表单中的\
    \ HTML。特别是，你必须将每个复选框的 `name` 属性从 `day` 改为 `day[]`。\n\n### 示例\n\n周一 <input type=\"\
    checkbox\" name=\"day[]\" value=\"Monday\" /> 周二 <input type=\"checkbox\" name=\"\
    day[]\" value=\"Tuesday\" /> ....\n\nHTML 允许一个名称对应多个值，在 HTML 中进行此更改后，相应的 `$_GET['day']`\
    \ 现在将拥有一个类型为数组的值。通过如何使用数组，你就可以像“显示所选天数及其值”列表所示那样处理输出。以下是显示复选框变量数组的 PHP 代码：\n\n\
    ```php\n<?php\necho \"you submitted \" . count($_GET['day']) . \" values\"; foreach($_GET['day']\
    \ as $d) {\n  echo $d . \", \";\n}\n```\n\n## 4.3 在超链接中使用查询字符串\n\n封装在查询字符串中的表单信息会传输到服务器的两个位置之一，取决于方法是\
    \ GET 还是 POST。重要的一点是，使用查询字符串不仅限于数据输入表单。你可能会奇是否可以将查询字符串与锚点标签（anchor tags）结合……答案是肯定的！锚点标签（即超链接）也使用\
    \ HTTP 方法。\n\n想象一个正在显示书籍链接列表的网页页面。一种方法是为每本书创建一个单独的页面。这不是一个非常明智的方法。我们的数据库可能包含成千上万本书：为每本书创建一个单独的页面显然太多了！\n\
    \n显示单个项目的低效方法。使用单一的“显示书籍”页面并接收一个指定要显示哪本书的查询字符串作为输入，这比之前要合理得多。我们通常为查询字符串传递某种类型的唯一标识符（在此情况下，使用书籍的\
    \ ISBN）。\n\n## 4.3.1 显示单个项目的合理方法\n\n清理查询字符串（Sanitizing Query Strings）\n\n-   不信任所有输入。\n\
    \n如果用户编辑了查询字符串参数的值会怎样？取决于用户是删除了参数还是更改了其类型，将显示空白屏幕或错误页面。你的程序必须能够处理每个查询字符串或表单值的以下情况：\n\
    \n- 如果查询字符串参数不存在。\n- 如果查询字符串参数不包含值。\n- 如果查询字符串参数的值类型不。\n- 如果数据库查询需要值，但提供的值在数据库表中不存在。\n\
    \n检查用户输入是否存在错误或缺失信息的过程被称为清理用户输入（sanitizing user inputs）的过程。我们可能简单地使用 `header`\
    \ 指令重定向到通用的错误处理页面，例如：\n\n```php\nheader(\"Location:error.php\"); exit();\n```\n\
    \n## 4.4 $_SERVER 数组\n\n`$_SERVER` 关联数组包含了各种信息。包含了客户端发送的 HTTP 请求头中包含的部分信息。要使用\
    \ `$_SERVER` 数组，你只需引用相关的大小敏感键名：\n\n```php\necho $_SERVER[\"SERVER_NAME\"] . \"\
    <br/>\"; echo\n$_SERVER[\"SERVER_SOFTWARE\"] . \"<br/>\"; echo\n$_SERVER[\"REMOTE_ADDR\"\
    ] . \"<br/>\";\n```\n\n请求头、服务器与 $_Server 数组之间的关系。值得注意的是，此数组中的项是由 Web 服务器创建的，PHP\
    \ 文档中列出的键并不一定都可用。它们可以分类为包含请求头信息的键以及包含服务器设置信息的键（通常在 php.ini 文件中配置）。\n\n## 4.5 服务器信息键\n\
    \nSERVER_NAME 是 `$_SERVER` 数组中的一个键，包含所请求网站的名称。如果你在代码库上运行多个主机，这是一个非常有用的信息。SERVER_ADDR\
    \ 是一个互补的键，告诉我们服务器的 IP 地址。这两个键中的任何一个都可以在条件判断中使用以输出额外的 HTML 来识别开发服务器，例如。DOCUMENT_ROOT\
    \ 告诉我们当前运行脚本的文件位置。由于你经常将代码从开发环境移动到生产环境，此键可创建不依赖特定位置即可正确运行的优秀脚本。此键补全了标识正在执行的脚本的\
    \ SCRIPT_NAME 键。\n\n### 请求头信息键\n\n- Web 服务器响应每个包含请求头的 HTTP 请求。这些键提供了对请求头中数据的程序化访问。\n\
    \nREQUEST_METHOD 键返回访问页面时使用的请求方法：即 GET、HEAD、POST、PUT。REMOTE_ADDR 键返回请求的 IP 地址。\n"
