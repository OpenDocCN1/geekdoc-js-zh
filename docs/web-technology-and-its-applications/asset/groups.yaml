    # 1.9.1 Inheritance


    The inherit keyword specifies that a property should inherit its value from its
    parentelement. The inherit keyword can be used for any CSS property, and on any
    HTML element.

    Inheritable properties are: Font, color, list and text properties. Non inheritable
    properties are:Layout,sizing,border,background and spacing. Eg:


    ```

    <!DOCTYPE html>

    <head>

    <style>

    body {

    font-family:Arial; color:red;

    border:8pt solid green; margin:100px

    }

    div {

    font-weight: bold;

    margin: inherit;

    border: inherit;

    }

    p {

    margin:inherit;

    border:inherit;

    }

    </style>

    </head>

    <body>

    <h3>Reviews</h3>

    <div>

    <p>By Ricardo on <time>September 15, 2015</time></p> <p>Easy on the HDR buddy.</p>

    </div><hr/>

    ```'
