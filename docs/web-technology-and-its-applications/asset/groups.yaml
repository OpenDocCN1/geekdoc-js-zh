    在 PHP 中，对象可以使用 `serialize()` 函数轻松地转换为二进制字符串。生成的字符串是对象的二进制表示，因此可能包含不可打印字符。可以使用
    `unserialize()` 方法将字符串还原回对象。虽然数组、字符串和其他原始类型默认是可以序列化的，但我们创建的类必须实现 `Serializable`
    接口，这要求对实现该接口的任何类添加 `serialize()` 和 `unserialize()` 的实现。


