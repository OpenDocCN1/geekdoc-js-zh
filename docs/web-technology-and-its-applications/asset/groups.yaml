    然而，对文档的某个部分应用样式比对每个段落应用样式更方便。这可以通过 `<div>` 标签实现。与 `<span>` 一样，`<div>` 标签的内容没有隐含的布局，因此它的主要用途是为文档的章节或区域指定显示细节。


