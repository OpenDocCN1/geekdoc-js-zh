    \ | </li>\n</ul>\n</footer></body></body></body>\n</html>\n</html>\n```\n\n##\
    \ 1.9 级联 (The Cascade): 样式如何相互作用:\n\nCSS 中的级联指的是如何处理冲突规则。CSS 使用以下级联原理来处理冲突：\n\n\
    i. 继承 (Inheritance)\nii. 特异性 (Specify)\niii. 位置 (location)\n\n### 1.9.1 继承 (Inheritance)\n\
    \n`inherit` 关键字指定属性应从其父元素继承其值。`inherit` 关键字可以用于任何 CSS 属性，适用于任何 HTML 元素。\n可继承的属性有：字体、颜色、列表和文本属性。不可继承的属性有：布局、尺寸、边框、背景和间距。示例：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\nbody {\nfont-family:Arial;\
    \ color:red;\nborder:8pt solid green; margin:100px\n}\ndiv {\nfont-weight: bold;\n\
    margin: inherit;\nborder: inherit;\n}\np {\nmargin:inherit;\nborder:inherit;\n\
    }\n</style>\n</head>\n<body>\n<h3>评论 (Reviews)</h3>\n<div>\n<p>由 Ricardo 发布于 <time>2015年9月15日</time></p>\
    \ <p>对 HDR 兄弟一点。</p>\n</div><hr/>\n```\n\n```html\n<div>\n<p>由 Susan 发布于 <time>2015年10月1日</time></p>\
    \ <p>我爱中央公园。</p></div><hr>\n</body>\n</html>\n```\n\n**注意：** 在上面的示例中，`font-color`\
    \ 和 `font-family` 是可继承的属性，并适用于整个文档。但 `margin` 和 `border` 是可继承的，因此为了获得该属性，在 CSS\
    \ 样式中将 \"inherit\" 作为属性值使用。\n\n### 1.9.2 特异性 (Specificity)\n\n它定义了浏览器如何确定哪种样式具有优先级。当规则具有相同的特异性时，后出现的规则具有更高的权重。示例：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n#example { color: orange;\n\
    color: magenta; }\n</style>\n</head>\n<body>\n```\n\n此文本不在 p 元素内。\n<div>\n<p>由\
    \ Ricardo 发布于 <time>2015年9月15日</time></p> <p>对 HDR 兄弟一点。</p>\n</div><hr>\n<div>\n\
    <p>由 Susan 发布于 <time>2015年10月1日</time></p> <p>我爱中央公园。</p></div><hr>\n<div>\n<p\
    \ class=\"last\">由 Dave 发布于 <time>2015年10月15日</time></p>\n<p>感谢发布。</p>\n</div><hr>\n\
    </body>\n```\n\n### 1.9.3 位置 (Location)\n\n当继承和特异性无法确定样式时，将使用位置原则。\n\n## 1.10\
    \ 盒模型 (The Box Model)\n\n在 CSS 中，所有 HTML 元素都存在于元素框中。元素框如下所示。\n\n### 背景 (Background)\n\
    \n元素的背景颜色或图像填充元素到其边框（如果有的话）。在现代网页设计中，使用 CSS 显示纯装饰性图像（如背景渐变和图案等）比使用 `<img>` 元素已变得常见。\n\
    \n最常用的背景属性如下：1. **background**: 这是一个组合快捷属性，允许在属性属性中设置多个背景值。虽然可以在快捷属性中省略属性，但请记住省略的属性将设置为其默认值。\n\
    \n2. **background-attachment**: 指定背景图像是随文档滚动（默认）还是固定。可能的值有：fixed, scroll。\n\n\
    3. **background-color**: 设置元素的背景颜色。4. **background-image**: 指定元素的背景图像（通常是 jpeg、gif\
    \ 或 png 文件）。\n\n5. **background-position**: 指定背景图像放置在元素上的位置。某些值包括 bottom, center,\
    \ left 和 right。\n\n6. **background-repeat**: 决定背景图像是否重复。用于创建平铺背景（这实际上是默认行为）。可能的值有：repeat,\
    \ repeat-x, repeat-y 和 no-repeat。\n\n7. **background-size**: CSS3 新属性，该属性允许修改背景图像的大小。\n\
    \n### 边框 (Borders)\n\n边框提供了一种视觉上分离元素的方法。边框宽度几乎总是设置为像素单位。使用单位或百分比作为边框宽度会导致不可预测的宽度，因为当缩放级别增加或减少时，不同的浏览器使用不同的算法（有些向上取整，有些向下整）。\n\
    \n"
