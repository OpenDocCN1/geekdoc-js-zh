    # 3.7 The Document Object model (DOM):


    According to the W3C, the DOM is aPlatform- and language-neutral

    interface that will allow programs and scripts to dynamically access and

    update the content, structure and style of documents. The tree structure

    formally called the DOM Tree with the root, topmost object called the

    Document Root.


    # Nodes


    In the DOM, each element within the HTML document is called a node.

    The DOM is a tree, then each node is an individual branch. There are element

    nodes, text nodes, and attribute nodes. All nodes in the DOM share a

    common set of properties and methods.


    # Node objects


    The DOM document object is the root JavaScript object representing the

    entire HTML document. It contains some properties and methods that we will

    use extensively in our development and is globally accessible as document.

    Accessing the properties is done through the dot notation.'
