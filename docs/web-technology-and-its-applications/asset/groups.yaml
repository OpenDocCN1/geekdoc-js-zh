    \n# 5. 链接 (Links):\n\n链接是通过 `<a>` 标签创建的，其中 `a` 代表锚点（anchor）。链接有两个主要部分：i. 目的地（destination）和\
    \ ii. 标签（label）。\n例如：\n```html\n<a href=\"https://www.w3schools.com/html/\">访问\
    \ HTML 教程</a>\n```\n目的地 标签（文本）\n\n- 创建的各种链接：\n- i. 指向外部网站的链接。\n  例如：<a href=\"\
    https://www.w3schools.com/html/\">访问 HTML 教程</a>\n\n- ii. 指向当前站点内其他页面或资源的链接。\n\
    \  例如：<a href=\"https://centralpark.com/logo.gif\">中央公园</a>\n- iii. 指向当前页面内其他位置链接。\n\
    - iv. 指向另一个页面上特定位置的链接。\n- v. 指令浏览器启动用户电子邮件的链接。\n- vi. 指令浏览器执行 JavaScript 函数的链接。\n\
    - vii. 指令移动浏览器拨打电话的链接。\n\n# 6. URL 相对引用 (URL Relative Referencing)\n\n在引用外部网站上的页面或资源时，需要完整的绝对引用，即完整的\
    \ URL：`//` 域名名、任何路径、文件名。当引用与 HTML 文档位于同一服务器的资源时，则需要使用相对引用。\n\n# 7. 行内文本元素 (Inline\
    \ Text Elements)\n\n行内元素不会另起行开始，且只占据必要的宽度。它们不会破坏文本流。HTML 定义了超过 30 种行内元素。\n\nHTML\
    \ 中的行内元素：\n- `<a>` 用于超链接的锚点\n- `<abbr>` - 缩写\n- `<br>` - 换行\n- `<cite>` - 引用\n\
    - `<code>` - 用于显示代码，如标记或编程代码。\n- `<em>` - 强调\n- `<small>` - 用于显示细字字体\n- `<span>`\
    \ - `<div>` 元素的行内等效物\n- `<strong>` - 用于非常重要的内容\n- `<time>` - 用于显示时间和日期。\n\n# 8.\
    \ 图片 (Images)\n\n在 HTML 中，图像通过 `<img>` 标签定义。`<img>` 标签是空标签，它只包含属性，没有结束标签。使用的属性有：\n\
    - i. `src` 属性指定图片的 URL（网络地址）。`alt` 属性为图片提供备用文本，如果用户由于某种原因无法查看（因为连接速度慢、`src` 属性错误或用户使用屏幕阅读器）。`alt`\
    \ 属性的值应该描述图片：\n\n例如：<img src=\"pic_trulli.jpg\" alt=\"意大利特鲁利小屋\">\n\n# 9. 字符实体\
    \ (Character Entities)\n\n某些字符在 HTML 中是保留字符的。如果你在文本中使用小于号（`<`）或大于号（`>`），浏览器可能会将它们与标签混淆。字符实体用于在\
    \ HTML 中显示保留字符。字符实体的格式如下：`&entity_name;`\n\n或者\n`&entity_number;`\n\n| 实体名称 |\
    \ 实体数字 | 描述 |\n| :--- | :--- | :--- |\n| `&nbsp;` | `&#160;` | 不换行空格 |\n| `&lt;`\
    \ | `&#60;` | 小于符号 (\"<\") |\n| `&gt;` | `&#62;` | 大于符号 (\">\") |\n| `&copy;`\
    \ | `&#169;` | 版权符号 |\n| `&trade;` | `&#8482;` | 商标 |\n| `&u;` | `&#252;` | 小写\
    \ u 变音 |\n\n# 10. 列表 (Lists)\n\nHTML 提供了三种类型的列表：\n\n- 1. 无序列表 (Unordered list)\n\
    - 2. 有序列表 (Ordered list)\n- 3. 定义列表 (Definition list)\n\n无序列表：它包含一组没有特定顺序的项目。无序列表以\
    \ `<ul>` 标签开始。每个列表项目以 `<li>` 标签开始。列表项目默认用项目符号（小黑圆圈）标记。\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<h2>第6学期科目</h2>\n<ul>\n<li>web technology</li>\n<li>Advanced JAVA</li>\n\
    <li>computer Graphics</li>\n</ul>\n</body>\n</html>\n```\n\n输出：\n第6学期科目 39 web\
    \ technology 37 Advanced JAVA 37 Computer Graphics\n\n# 有序列表 (Ordered List):\n\
    \n它包含一组按顺序排列的元素。它们默认由浏览器渲染为编号列表。\n\n例如：\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <h2>第7学期科目</h2>\n<ol>\n<li>Web technology</li>\n<li>advanced JAVA</li>\n<li>computer\
    \ graphics</li>\n</ol>\n</body>\n</html>\n```\n\n输出：\n- 第7学期科目 1 Web technology\
    \ 2 advanced JAVA 3 computer graphics\n\n# 定义列表 (Definition list)\n\n正如其名称所示，定义列表用于术语和它们的定义。`<dl>`\
    \ 标签表示定义列表，`<dt>` 标签表示术语，`<dd>` 标签表示定义。\n\n```html\n<dl>\n<dt>HTML</dt>\n<dd>超文本标记语言</dd>\n\
    <dt>CSS</dt>\n<dd>层叠样式表</dd>\n</dl>\n```\n\n"
