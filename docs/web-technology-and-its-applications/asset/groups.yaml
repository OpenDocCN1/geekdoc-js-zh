    The key for each element will be an array containing information about the HTML
    form, as well as the file itself. The keys in that array are the name, type, tmp_name,
    error, and size. The values for each of the keys, in general, are described below.


    name is a string containing the full name used on the client machine, including
    any file extension. It does not include the file path on the client''s machine.


    type defines the MIME type of the file.


    tmp_name is the full path to the location on your server where the file is being
    temporarily stored. The file gets deleted upon termination of the script, so it
    should be copied if storage is required.


    error is an integer that encodes many possible errors and is set to UPLOAD_ERR_OK
    (integer value 0) if the file was uploaded successfully.


    size is an integer representing the size in bytes of the uploaded file.


    ## 4.7 Data flow from HTML through POST to PHP $FILES


    ### 4.7.1 Checking for Errors


    For every uploaded file, there is an error value associated with it in the $FILES
    array. The error values are specified using constant values, which resolve to
    integers. The value for a successful upload is UPLOAD_ERR_OK, and should be looked
    for before proceeding any further. A proper file upload script will therefore
    check each uploaded file by checking the various error codes.


    ### 4.7.2 File Size Restrictions


    Some scripts limit the file size of each upload. There are many reasons to do
    so, and ideally you would prevent the file from even being transmitted in the
    first place if it is too large. There are three main mechanisms for maintaining
    uploaded file size restrictions:


    - via HTML in the input form

    - via JavaScript in the input form

    - via PHP coding.


    The first of these mechanisms is to add a hidden input field before any other
    input fields in your HTML form with a name of MAX_FILE_SIZE. This technique allows
    your php.ini maximum file size to be large, while letting some forms override
    large limit with a smaller one. It should be noted that though this mechanism
    is set up in the HTML form, it is only available to use when your server-side
    environment is using PHP


    ### 4.7.3 Limiting the Type of File Upload


    Even if the upload was successful and the size was within the appropriate limits,
    you may still have a problem. What if the wanted you to upload an image and they
    uploaded a Microsoft Word document? You might also want to limit the uploaded
    image to certain image types, such as jpg and png, while disallowing bmp and others.
    To accomplish this type of checking you typically examine the file extension and
    the type field.


    ### 4.7.4 Moving the File


    To move the temporary file to a permanent location on your server. Typically,
    you make use of the PHP function move_uploaded_file(), which takes in the temporary
    file location and the file''s final destination. This function will only work
    if the source file exists and if destination location is writable by the web server
    (Apache). If there is a problem the function will return false, and a warning
    may be output. Note that the upload location uses .upload/, which means the file
    will be uploaded to a subdirectory named upload under the current directory.


    ### 4.7.5 Reading/Writing Files


    In web development, the ability to read and write to text files remains an important
    technical competency. Even if your site uses a database for storing its information,
    the fact that the PHP functions can read/write from a file or from an external
    website (i.e., from a URL) means that system functions still have relevance in
    the age of database-driven websites.


    There are two basic techniques for read/writing files in PHP:


    - Stream access. In this technique, our code will read just a small portion of
    the file at a time. While this does require more careful programming, it is the
    most memory-efficient approach when reading very large files.


    - All-In-Memory access. In this technique, we can read the entire file into memory
    (i.e., into a PHP variable). While not appropriate for large files, it does make
    processing of the file extremely easy.


    ## 4.6 Stream Access


    To those you familiar with functions like fopen(), fclose(), and fgets() from
    the C programming language, first technique will be second nature to you. In the
    C-style file access you separate the acts of opening, reading, and closing a file.
    The function fopen() takes a file location or URL and access mode as parameters.


    The returned value is a stream resource, which you can read sequentially. Some
    of the common modes are "r" for read, "rw" for read and write, and "c," which
    creates a new file for writing. Once the file is opened, you can read from it
    in several ways. To read a single line, use the gets() function, which will return
    false if there is no more data, and if reading a line it will advance the stream
    forward to the next one so you can use the === check to see if you have reached
    the end of the file. To read an arbitrary amount of data (typically for binary
    files), use fread() and for reading a single character use gets().


    Finally, when finished processing the file you must close using fclose(). Listing
    illustrates script using fopen(), fgets(), and fclose(). To write data to a file,
    you can employ the fwrite() function in the same way as gets(), passing the file
    handle and to the string


    ## 4.7 Opening, reading lines and closing a file

    ### In-Memory File Access


    While the previous approach to reading/writing files gives you complete control,
    the programming requires more care in dealing with the streams, file handles,
    and other low-level issues. The alternative simpler approach is much easier to
