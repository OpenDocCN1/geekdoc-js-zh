    # 2.1 TABLES


    A table is a matrix of cells. The cells in the top row often contain column labels,
    those in the leftmost column often contain row labels, and most of the rest of
    the cells contain the data of the table. The content of a cell can be almost any
    document element, including text, a heading, a horizontal rule, an image, and
    a nested table.


    # 2.1.1 Basic Table Tags:


    +   A table is specified as the content of the block tag <table>. There are two
    kinds of lines in tables: the line around the outside of the whole table is called
    the border; the lines that separate the cells from each other are called rules.

    It can be obtained using border attribute. The possible values are “border” or
    any number.

    The table heading can be created using <caption> tag.

    The table row can be created using <tr> tag.'
