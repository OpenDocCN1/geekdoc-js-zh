    ```\n\nOutput:\nDSI\nHKBKCE\nCSE\nweb technology\n\n# 5. Links:\n\nLinks are created\
    \ using `<a>` tag, where `a` stands for anchor. Link has two main parts: i. destination\
    \ and ii. label\neg:\n```html\n<a href=\"https://www.w3schools.com/html/\">Visit\
    \ HTML tutorial</a>\n```\nDestination label(text)\n\n- Various links created:\n\
    - i. links to external sites.\n  Eg: <a href=\"https://www.w3schools.com/html/\"\
    >Visit for HTML tutorial</a>\n\n- ii. links to other pages or resources within\
    \ the current site.\n  Eg: <a href=\"https://centralpark.com/logo.gif\">central\
    \ park</a>\n- iii. links to other places within the current page.\n- iv. links\
    \ to particular locations on another page.\n- v. links that are instructions to\
    \ the browser to start user's email\n- vi. links that are instructions to the\
    \ browser to execute a JavaScript function.\n- vii. links that are instructions\
    \ to the mobile browser to make a phone call.\n\n# 6. URL Relative Referencing\n\
    \nWhen referencing a page or resources on an external site, a full absolute reference\
    \ is required, ie, complete URL // domain name, any path, filename. When referencing\
    \ a resource that is on the same server as the HTML document, a relative referencing\
    \ is required.\n\n# 7. Inline Text Elements\n\nAn inline element does not start\
    \ on a new line and only takes up as much width as necessary. They do not disrupt\
    \ the flow of text. HTML defines over 30 inline elements.\n\nInline elements in\
    \ HTML:\n- `<a>` anchor used for hyperlinks\n- `<abbr>` - an abbreviation\n- `<br>`\
    \ - line break\n- `<cite>` - citation\n- `<code>` - used for displaying code,\
    \ such as markup or programming code.\n- `<em>` - emphasis\n- `<small>` - for\
    \ displaying the fine print\n- `<span>` - the inline equivalent of the `<div>`\
    \ element\n- `<strong>` - for the content that is strongly important.\n- `<time>`\
    \ - for displaying time and date.\n\n# 8. Images\n\nIn HTML, images are defined\
    \ with the `<img>` tag. The `<img>` tag is empty, it contains attributes only,\
    \ and does not have a closing tag. Attributes used are:\n- i. The `src` attribute\
    \ specifies the URL (web address) of the image. The `alt` attribute provides an\
    \ alternate text for an image, if the user for some reason cannot view it (because\
    \ of slow connection, an error in the `src` attribute, or if the user uses a screen\
    \ reader). The value of the `alt` attribute should describe the image:\n\nEg:\
    \ <img src=\"pic_trulli.jpg\" alt=\"Italian Trulli\">\n\n# 9. Character Entities\n\
    \nSome characters are reserved in HTML. If you use the less than (`<`) or greater\
    \ than (`>`) signs in your text, the browser might mix them with tags. Character\
    \ entities are used to display reserved characters in HTML. A character entity\
    \ looks like this: `&entity_name;`\n\nOR\n`&entity_number;`\n\n| Entity Name |\
    \ Entity Number | Description |\n| :--- | :--- | :--- |\n| `&nbsp;` | `&#160;`\
    \ | nonbreakable space |\n| `&lt;` | `&#60;` | less than symbol (\"<\") |\n| `&gt;`\
    \ | `&#62;` | greater than symbol (\">\") |\n| `&copy;` | `&#169;` | the copyright\
    \ symbol |\n| `&trade;` | `&#8482;` | trademark |\n| `&u;` | `&#252;` | small\
    \ u umlaut |\n\n# 10. Lists\n\nHTML provides three types of list:\n\n- 1. Unordered\
    \ list\n- 2. Ordered list\n- 3. Definition list\n\nUnordered list: It has a collection\
    \ of items in no particular order. An unordered list starts with the `<ul>` tag.\
    \ Each list item starts with the `<li>` tag. The list items will be marked with\
    \ bullets (small black circles) by default.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<h2>6th semester subjects</h2>\n<ul>\n<li>web technology</li>\n<li>Advanced\
    \ JAVA</li>\n<li>computer Graphics</li>\n</ul>\n</body>\n</html>\n```\n\nOutput:\n\
    6th semester subjects 39 web technology 37 Advanced JAVA 37 Computer Graphics\n\
    \n# Ordered List:\n\nIt includes a collection of elements in a set order. They\
    \ are by default rendered by the browser as a numbered list.\n\n```html\nEg:\n\
    <!DOCTYPE html>\n<html>\n<body>\n<h2>7 semester subjects</h2>\n<ol>\n<li>Web technology</li>\n\
    <li>advanced JAVA</li>\n<li>computer graphics</li>\n</ol>\n</body>\n</html>\n\
    ```\n\nOutput:\n- 6th semester subjects\n1. Web technology\n2. Advanced JAVA\n\
    3. computer graphics\n\n# Definition list\n\nAs the name implies, definition lists\
    \ are used to specify lists of terms and their definitions, in glossaries. A definition\
    \ list is given as the content of a `<dl>` tag, which is a block tag. Each term\
    \ to be defined in the definition list is given as the content of a `<dt>` tag.\
    \ The definitions themselves are specified as the content of `<dd>` tags. The\
    \ defined terms of a definition list are usually displayed in the left margin;\
    \ the definitions are usually shown indented on the line or lines following the\
    \ term.\n\n```html\n<head>\n<title>Definition List</title>\n</head>\n<body>\n\
    <h3>HKBKCE</h3>\n<dl>\n<dt>152</dt><dd>CSE</dd>\n<dt>172</dt><dd>ISE</dd>\n<dt>182</dt><dd>ECE</dd>\n\
    </dl>\n</body>\n</html>\n```\n\nOutput: HKBKCE 152\nCSE 172\nISE\n\n# 1.5 HTML5\
    \ SEMANTIC STRUCTURE ELEMENTS\n1. Header and footer:\n\nHeader contains the site\
    \ logo and title, horizontal navigation links and one or two horizontal banners.\
    \ Footer contains less material such as smaller text versions of the navigation,\
    \ copyright notices, information about the site's privacy policy and so on. They\
    \ are represented in `<header>` and `<footer>` tags.\nEg:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<article>\n<header>\n<h1>HKBKCE</h1>\n<p>CSE</p>\n</header>\n\
    <p>AFFILIATED TO AICTE</p>\n<footer>\n<p>B'LRE</p>\n<p>Contact information: <a\
    \ href=\"WWW.HKBKCE.EDU.IN\">NAME@HKBKCE.EDU.IN</a>.</p>\n</footer>\n</body>\n\
    </html>\n```\n\n# Output:\nCSE\nAFFILIATED TO AICTE\nB'LRE\nContact information:\
    \ NAME@HKBKCE.EDU.IN.\n\n# 2. Heading groups\n\nTo group together multiple headings\
    \ in close proximity, a `<group>` element is used. A `<group>` element can only\
    \ contain `<h1>`, `<h2>` etc elements.\nEg:\n\n```html\n<header>\n<group>\n<h1>HTML</h1><h2>Introduction</h2>\n\
    </group>\n</header>\n<article>\n```\n\n# 3. Navigation\n\nThe `<nav>` element\
    \ defines a set of navigation links. It is intended for major navigation blocks.\n\
    Eg:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n<header>\n<img\
    \ src=\"logo.gif\" alt=\"logo\">\n<h1>fundamentals of web development</h1>\n<nav>\n\
    <ul>\n<li><a href=\"index.html\">Home</a></li>\n<li><a href=\"about.html\">about\
    \ us</a></li>\n<li><a href=\"browse.html\">browse</a></li>\n</ul>\n</nav>\n</header>\n\
    </body>\n</html>\n```\n\n# Comparison between `<nav>` and `<div>`\n\nThe `<div>`\
    \ tag defines a division or a section in an HTML document. The `<div>` element\
    \ is often used as a container for other HTML elements to style them with CSS\
    \ or to perform certain tasks with JavaScript. The `<nav>` element is semantic,\
    \ letting the browser (and screen readers) know those links aren't just normal,\
    \ they are a navigation menu. This can be useful for accessibility (tabs, mobile\
    \ devices, browsers).\n\n# 4. Articles and Sections\n\nThe `<article>` element\
    \ represents a section of content that forms an independent part of a document\
    \ or site. An article should make sense on its own and it be possible to distribute\
    \ it independently from the rest of the site. Potential sources for the `<article>`\
    \ element:\n- Forum post\n- Blog post\n- News story\n- Comment\n\nThe `<section>`\
    \ element represents a generic section of a document. It is a thematic grouping\
    \ of content, typically with a heading.\n\nEg:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <body>\n<article>\n<h1>Google Chrome</h1>\n<p>Google Chrome is a free, open-source\
    \ web browser developed by Google</p>\n</article>\n</body>\n</html>\n```\n\n**Note:**\
    \ The article tag is is not supported in Internet Explorer 8 and earlier versions.\n\
    \n# Output:\nGoogle Chrome is a free, open-source web browser developed by Google.\n\
    Note: The article tag is not supported in Internet Explorer 8 and earlier versions.\n"
