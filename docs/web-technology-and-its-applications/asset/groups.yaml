    # 5.2 Cookies


    Cookies are a client-side approach for persisting state information.

    They are name=value pairs that are saved within one or more text files that are
    managed by the browser. These pairs accompany both server requests and responses
    within the HTTP header. While cookies cannot contain viruses, third-party tracking
    cookies have a source of concern for privacy advocates.


    ![](img/05c71622ed7cf086940348e0edf07c33_119_0.png)


    Two types of cookies:


    - i) Session cookies: A session cookie has no expiry date specified; thus will
    be deleted at the end of the browser session.

    - ii) Persistent cookies: Persistent cookies have an expiry date specified; they
    will persist in the browser''s cookie file until the expiry date occurs, at which
    they are deleted.


    Cookies in PHP are created using the `setcookie()` function and are retrieved
    using the `$_COOKIE` superglobal associative array. The `setcookie()` function
    also supports several parameters, which further customize the new cookie.

    Eg:


    ```php

    <?php

    // add 1 day to the current time for expiry

    $expiryTime = time()+60*60*24;


    // create a persistent cookie

    $name = "Username";

    $value = "Ricardo";

    setcookie($name, $value, $expiryTime);

    ?>

    ```


    Uses of cookies:

    i) to store user preferences.

    ii) to track user''s browsing behaviour


    # 5.3 Serialization


    Serialization is the process of taking a complicated object and reducing it to
    zeros and ones for either storage or transmission. Later sequence of zeros and
    ones can be reconstituted into the original object as illustrated in the figure
    below:


    In PHP objects can easily be reduced to a binary string using the `serialize()`
    function. The resulting string is a binary representation of the object and therefore
    may contain unprintable characters. The string can be reconstituted back into
    an object using the `unserialize()` method. While arrays, strings, and other primitive
    types will be serializable by default, classes of our own creation must implement
    the `Serializable` interface which requires adding implementations for `serialize()`
    and `unserialize()` to any class that implements this interface.


