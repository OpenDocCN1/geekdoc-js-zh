    # 2.3 FRAMES


    The browser window can be used to display more than one document at a time. The
    window can be divided into rectangular areas, each of which is a frame. Each frame
    is capable of displaying its own document.


    # 2.3.1 Frameset


    The number of frames and their layout in the browser window are specified with
    the <frameset> tag. A frameset element takes the place of the body element in
    a document. A document has either a body or a frameset cannot have both. The <frameset>
    tag must have either a rows or a cols attribute. To create horizontal frames,
    rows attribute is used. To create vertical frames, cols attribute is used. The
    values for these attributes can be numbers, percentages and asterisks. Two or
    more values are separated by commas & given in quoted string.


    # To Demonstrate Horizontal Frames using rows Attribute


    ```html

    <html>

    <head>

    <title>Frameset Rows</title>

    </head>

    <frameset rows = "*,*">

    <frame src = "row1.html"/>

    <frame src = "row2.html"/>

    </frameset>

    </html>

    ```


    # To Demonstrate Vertical Frames using cols Attribute


    ```html

    <html>

    <head>

    <title>Frameset Cols</title>

    </head>

    <frameset cols="35%,15%,15%,25%">

    <frame src = "Col1.html"/>

    <frame src = "Col2.html"/>

    <frame src = "Col3.html"/>

    </frameset>

    </html>

    ```


    # To Demonstrate both rows and cols Attribute


    ```html

    <html>

    <head>

    <title>Frameset rows and cols</title>

    </head>

    <frameset rows="50,50" cols="*,">

    <frame src = "Col1.html"/>

    <frame src = "Col2.html"/>

    <frame src = "Col3.html"/>

    <frame src = "Col4.html"/>

    <frame src = "Row1.html"/>

    <frame src = "Row2.html"/>

    </frameset>

    </html>

    ```


    # 2.4 CSS: Introduction:


    XHTML style sheets are called cascading style sheets because they can be defined
    at three levels to specify the style of the document. Lower level style sheets
    can override higher level style sheets, the style of the content of a tag is defined,
    in effect, through a cascade of style-applications.


    # 2.4.1 Levels of style sheets


    The three levels of style sheets, in order from lowest level to highest level,
    are inline, document level, and external.


    Inline style sheets apply to the content of a single XHTML element. Inline style
    specifications appear within the opening tag and apply only to the content of
    that tag. Inline style sheets have precedence over document style sheets, which
    have precedence over external style sheets.


    ```html

    EXAMPLE WHICH USES INLINE STYLE SHEET <html>

    <head>

    <title>Sample CSS</title>

    </head>

    <h1 style="font-family: arial; font-size: 50pt; color: Red;"> HBKB College of
    Engineering</h1></html>

    ```


    Document-level style sheets apply to the whole body of a document. External style
    sheets can apply to the bodies of any number of documents. Document-level style
    specifications appear in the document head section and apply to the entire body
    of the document.


    ```html

    EXAMPLE WHICH USES DOCUMENT LEVEL STYLE SHEET <html>

    <head>

    <title>Sample CSS</title>

    </head>

    <style type="text/css">

    h1

    {

    font-family: ''arial'';

    font-size: 100pt;

    color: Red;

    }

    </style>

    </head>

    <h1>HBKB College of Engineering</h1>

    </html>

    ```


    External style sheets stored separately and are referenced in all documents that
    use them. External style sheets are written as text files with the MIME type text/css.
    They can be stored on any computer on the Web. The browser fetches external style
    sheets just as it fetches documents.

