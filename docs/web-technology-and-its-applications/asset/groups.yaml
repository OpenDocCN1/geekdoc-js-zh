    \   ix. text-indent（文本缩进）\n   x. background（背景）\n   xi. background-color（背景颜色）\n\
    \   xii. background-image（背景图像）\n   xiii. background-position（背景位置）\n   xiv. background-repeat（背景重复）\n\
    \   xv. color（颜色）\n\n## 值\n\n每个 CSS 声明都包含一个属性值。值的单位取决于属性。各种值的类别为：\n\ni. **colors（颜色）**：使用\
    \ 17 种标准颜色名称之一。\n例如：color: red;\n\n- ii. **RGB**：使用 0 到 255 之间的三个不同数字来描述颜色的红、绿、蓝值。\n\
    例如：color: rgb(255, 0, 0);\n例如：color: rgb(255, 105, 180);\n\niii. **hexadecimals（十六进制）**：使用\
