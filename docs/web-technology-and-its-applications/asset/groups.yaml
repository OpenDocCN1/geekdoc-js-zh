    \ 5.19 Web 服务概述\n\nWeb 服务是常见的计算范式示例，通常被称为面向服务的计算（SOC），它利用所谓的“服务”作为软件应用开发和运行的关键元素。Web\
    \ 服务是一种相对标准化的机制，一个软件应用程序可以使用 Web 协议连接并与另一个软件应用程序通信。Web 服务利用 HTTP 协议，因此可以被任何连接互联网的计算机使用。\n\
    \n### Web 服务的益处\n\n- 1) 它们可能为运行在不同平台上的不同应用程序之间提供互操作性。\n- 2) 它们可以实现所谓的面向服务的架构（SOA）。\n\
    \n### i) SOAP 服务\n\nSOAP 是一种消息协议，用于通过 HTTP 头部中的 XML 编码服务调用及其返回值。\n使用基于 SOAP 的服务某种类似于使用编译器：它的输出可能复杂难以理解，但它确实让大多数程序员的生活变得更简单。\n\
    \n![](img/05c71622ed7cf086940348e0edf07c33_151_0.png)\n\n### ii) REST 服务\n\nREST\
    \ 代表表述状态转移（Representational State Transfer）。\nRESTful Web 服务消除了服务描述层，并消除了需要独立协议来编码消息请求和响应。相反，它简单地使用\
    \ HTTP URL 来请求资源/对象（并编码输入参数）。该对象的序列化表示（通常是 XML 或 JSON 流）将作为普通的 HTTP 响应返回给请求者。\n\
    \n![](img/05c71622ed7cf086940348e0edf07c33_152_0.png)\n\n部署基于 REST的服务不需要特殊步骤，测试\
    \ RESTful 服务通常不需要特殊工具（浏览器除外），并且通过成熟的实践以及对缓存、集群和负载均衡等传统动态 HTTP 网站的经验，可以更容易地为大量客户端进行扩展。\n\
    \nREST 似乎几乎完全取代了 SOAP 服务。各种 RESTful 服务的相对易用性产生了一种新的 Web 开发风格，通常被称为杂烩（mashup），它通常指结合并整合来自各种不同来源数据的网站。\n\
    \n浏览器在客户端屏幕的窗口中显示 XHTML 文档。\n\nJavaScript Window 对象表示显示文档的窗口。\n\nWindow 对象的属性对所有\
