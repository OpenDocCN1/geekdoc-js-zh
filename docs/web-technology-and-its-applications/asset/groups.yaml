    # 5.2 Cookies


    Cookies 是一种持久化状态信息的客户端方法。

    它们是键值对，并保存在由浏览器管理的一个或多个文本文件中。这些键值对会随 HTTP 请求头中的服务器请求和响应一同。虽然 Cookie 不包含病毒，但第三方跟踪
    Cookie 是隐私倡导者关注的问题。


    ![](img/05c71622ed7cf086940348e0edf07c33_119_0.png)


    两种类型的 Cookie：


    - i) 会话 Cookie：Session cookie 没有指定过期日期；因此会在会话结束时删除。

    - ii) 持久性 Cookie：Persistent cookie 指定了过期日期；它们将保存在浏览器的 Cookie 文件中直到过期日期到达，届时会被删除。


    PHP 中的 Cookie 使用 `setcookie()` 函数创建，并使用 `$_COOKIE` 全局关联数组进行获取。`setcookie()` 函数还支持几个参数，可以进一步自定义新的
    Cookie。

    例如：


    ```php

    <?php

    // 在当前时间基础上增加1天作为过期时间

    $expiryTime = time()+60*60*24;


    // 创建一个持久 cookie

    $name = "Username";

    $value = "Ricardo";

    setcookie($name, $value, $expiryTime);

    ?>

    ```


    Cookie 的用途：

    i) 存储用户偏好。

    ii) 跟踪用户的浏览行为


