    ## 2.6 属性值形式


    CSS 包含七类中的不同属性：字体、列表、文本对齐、外边距、背景和边框。属性值可以以多种形式出现：关键字值、百分比值用于提供一个相对于之前使用的属性值测量的度。百分比值可以是带符号的。如果前面有加号，则百分比将加到之前的值上；如果是负值，则减去该值。url
    与左侧内容之间不能有空格。


    长度值指定为数值，其后紧跟一个单位名称的两个字符缩写。可能的单位名称有 px（像素）、in（英寸）、cm（厘米）、mm（毫米）、pt（磅）。


    颜色属性值可以指定为颜色名称、十六进制数字或 RGB 形式。RGB 形式只是单词后跟着括号括起来的三个数字列表，分别指定红、绿、蓝的电平。RGB 值可以是
    0 到 255 之间的十进制数字，也可以是百分比。十六进制数字必须以井号（#）为开头，例如 #AAFF00。


    ## 2.7 属性


    ### 字体族


    `font-family` 属性用于指定字体名称列表。浏览器使用列表中它支持的第一个字体。例如，属性 `font-family: Arial, Helvetica,
    Futura` 告诉浏览器如果支持该字体则使用 Arial。如果不支持，且支持 Helvetica，则将使用 Helvetica。如果浏览器既不支持 Arial
    也不支持 Helvetica，则将使用默认字体。如果 `font-family` 属性没有指定的字体，可以使用备用字体。


    ### 2.7.1 字体大小


    `font-size` 属性用于指定字体的大小。它可以使用关键字、百分比、绝对长度或相对长度。关键字包括 `small`、`medium`、`large`、`x-small`、`x-large`、`xx-small`、`smaller`、`larger`。百分比值相对于父元素的字体大小。绝对长度包括
    `px`、`pt`、`cm`、`in` 等。相对长度包括 `em` 和 `rem`。


    ### 2.7.2 字体变体


    `font-variant` 属性用于指定字体变体。可选值包括：`normal`、`small-caps` 和 `all-small`。


    ### 2.7.3 字体样式


    `font-style` 属性用于指定字体样式。可选值包括：`normal`、`italic` 和 `outline`。


    ### 2.7.4 字体粗细


    `font-weight` 属性用于指定字体粗细。可选值包括：`normal`、`bold`、`bolder` 以及从 100 到 900 之间的数字。


    ### 2.7.5 字体简写


    `font` 属性是一个简写属性，可以同时设置 `font-style`、`font-variant`、`font-size`、`line-family`
    和 `font-weight`。其语法格式为：`font: [font-style] [font-variant] [font-weight] [line-height]
    family;`


    ### 2.7.6 文本装饰


    `text-decoration` 属性用于指定文本的一些特殊特征。可选值包括：`none`、`underline`、`overline` 和 `line-through`。它还可以通过
    `text-decoration-line`、`text-decoration-color` 和 `text-decoration-style` 进行细致设置。


    ### 2.7.7 文本对齐


    `text-align` 属性用于指定文本的对齐方式。可选值包括：`left`、`right`、`center`、`justify` 和 `last`。


    ### 2.7.8 文本间距


    `letter-spacing` 属性用于指定字符之间的间距。可选值包括：`normal`、`wider`、`narrower` 以及具体的长度单位值。


    ### 2.7.9 行间距


    `line-height` 属性用于指定行之间的间距。可选值包括：`normal`、百分比值、长度值以及无单位数字值。


    ### 2.7.10 文本转换


    `text-transform` 属性用于指定文本的转换方式。可选值包括：`none`、`uppercase`、`lowercase` 和 `capitalize`。


    ### 2.7.11 文本阴影


    `text-shadow` 属性用于指定文本的阴影效果。格式为：`水平偏移量 垂直偏移量 [模糊半径] [颜色]`。


    ### 2.7.12 空格处理


    `white-space` 属性用于指定元素如何处理空格和换行。可选值包括：`normal`、`nowrap`、`pre`、`pre-wrap` 和 `nowline`。


    ### 2.7.13 文本溢出


    `text-overflow` 属性用于指定文本溢出时的处理方式。可选值包括：`visible`、`clip`, `ellipsis`。


    ### 2.7.14 文本缩进


    `text-indent` 属性用于指定文本第一行的缩进。可选值包括：`start`、`end` 和 `auto`。


    ### 2.7.15 文本方向


    `direction` 属性用于指定文本的阅读方向。可选值包括：`ltr`（从左到右）和 `rtl`（从右到左）。


    ### 2.7.16 垂直对齐


    `vertical-align` 属性用于指定内元素的垂直对齐方式。可选值包括：`baseline`、`top`、`bottom`、`middle`、`sub`、`super`、`text-top`、`text-bottom`
    和 `inherit`。


    ### 2.7.17 列表样式


    `list-style-type` 属性用于指定列表项目的类型。可选值包括：`none`、`disc`、`circle`、`square` 以及各种数字序列、罗马数字序列等。


    ### 2.7.18 列表图像


    `list-style-image` 属性用于指定列表项目使用的图像。可选值包括：`none` 或 `url()`。


    ### 2.7.19 列表位置


    `list-style-position` 属性用于指定列表项目标记（符号）的位置。可选值包括：`inside` 和 `outside`。


    ### 2.7.20 列表简写


    `list-style` 属性是一个简写属性，可以同时设置 `list-style-type`、`list-style-image` 和 `list-style-position`。语法格式为：`list-style:
    [list-style-type] [list-style-image] [list-style-position];`


    ### 2.8 列表属性


    `display` 属性用于指定列表项目的显示方式。可选值包括：`block`、`inline`、`inline-block`、`list-item`、`table`、`table-cell`
    等。


    `count` 属性用于指定列表的计数数量。可选值包括：`number`、`decimal`、`none`。


    `direction` 属性用于指定列表项目的计数器的方向。可选值包括：`normal`、`reverse`。


