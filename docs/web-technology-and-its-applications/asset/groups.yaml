    <p class="one">HKBK College of Engineering</p>

    <p class="two">CSE</p>

    </body>

    </html>

    ```


    ## 39 id 选择器


    id 选择器允许将样式应用到一个特定的元素。


    ```html

    <html>

    <head>

    <title>Sample CSS</title>

    <style type = "text/css">

    #one { font-family: ''lucida calligraphy''; color: purple; }#two { font-family:
