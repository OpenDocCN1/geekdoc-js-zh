    简单选择器形式：

    在简单选择器的情况下，会使用标签（tag）。如果更改了标签的属性，那么这些更改将反映在程序中所有该标签被使用到的地方。选择器可以是任何标签。如果规则列表中没有提到某个标签的新属性，浏览器用户将使用该标签的默认行为。


    <html><style type="text/css">

    p { font-family: ''Times New Roman''; font-size: 50pt; color: Red; } </style>

    </head>

    <body>

    <p>HKKB College of Engineering </p>

    <p>Bangalore</p>

    </body>

    </html>


    - 357 类选择器：


    在类选择器（class selector）中，可以为不同的元素赋予不同的属性


    ```html

    <html>

    <head>

    <title>Sample CSS</title>

    <style type = "text/css">

    p.one { font-family: ''Lucida Handwriting''; font-size: 55pt; color: Red; }

    p.two { font-family: ''Monotype Corsiva''; font-size: 100pt; color: green; }

    </style>

    </head>

