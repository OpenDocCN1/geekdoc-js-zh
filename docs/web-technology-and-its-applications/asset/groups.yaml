    \ order must be as follows: The font names must be last, the font size must be\
    \ second to last, and the font style, font variant, and font weight, when they\
    \ are included, can be in any order but must precede the font size and font names.\n\
    \nfont: bold 14pt ‘Times New Roman’\n\n```html\nExample\n<html>\n<head>\n<title>Font\
