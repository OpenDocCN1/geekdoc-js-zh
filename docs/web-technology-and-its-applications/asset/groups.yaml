    \n# 模块-1\nWeb 基础，XHTML-1\n\n## 1.1 互联网简介\n\n起源：\n\n- 20世纪60年代\n美国国防部（DoD）对开发一种替代性的大型网络产生了兴趣。\n\
    \n该网络的功能是为执行国防合同的研究人员提供通信、程序共享和远程笔记本电脑访问。\n\n美国国防部高级研究计划署（ARPA）资助了此类主要网络的开发。随后它被命名为\
    \ ARPANet。\n\nARPANet 的早期主要用途是通过电子邮件进行简单的基于文本的通信。\n\n## 2. 20世纪70年代末和80年代初\n\n\
    BITNET（即 护理协会人员网络缩写）作为其 Time Network 的结果，始于约克大学。它设计之初是为了提供电子邮件和文件传输服务。CSNET 是用于工程科学网络的计算机科学网络。其最初目的是提供部分电子邮件服务。\n\
    \n## 3. 20世纪90年代\n\nNSFnet 创建于 1986 年，并在 1990 年取代了 ARPANet。它由国家科学基金会（NSF）赞助。到\
    \ 1992 年，NSFnet 连接了全球约一百万台计算机。1995 年，NSFnet 的一部分变成了骨干网络，其余部分被称为 Internet。\n\n\
    # 什么是互联网？\n\n互联网可以是连接在非常大的通信网络中的大量计算机。传输控制协议/网际协议（TCP/IP）于 1982 年成为网络连接的标准。与其将网上的每台\
    \ PC 连接到网上的每台不同 PC，通常是公司内的单台计算机连接到本地网络中的每个不同设备。该本地网络上的一个节点物理上连接到互联网。因此，互联网实际上是网络网络，而不是计算机网络。显然，所有连接到互联网的设备都应该被明确标识。\n\
    \n#  IP 地址\n\n连接到网络的机器的网际协议（IP）地址可以是独特的 32 位范围。由点分隔的位数字。这四个部分是互联网路由计算机用于选择消息的单元，信息应该到达其目的地。尽管人们几乎总是使用域名，但信息科学工作同样有效。例如，将名称转换为其\
    \ IP 地址。\n\n美国航空（www.ual.com）的 IP 地址是 209.87.113.93。因此，如果浏览器指向 http://209.87.113.93，它将连接到美国航空网站。\n\
    \n## 1.1 什么是 HTML？它源自哪里？\n\nHTML 在1997 年由万维网联盟（W3C）规范化。HTML 的历史涉及到 20 世纪 90 年代浏览器制造商的竞争，W3C\
    \ 推出了一系列新标签，例如 CSS 和 JavaScript，这些对网络的发展至关重要。HTML 被定义为一种标记。标记术语源于印刷时代，当时编辑会在手稿页上写指令。\n\
    \n![](img/05c71622ed7cf086940348e0edf07c33_13_0.png)\n\n# 图 1.1 示例示例标记语言 1.1.1\
    \ XHTML\n\n在 20 世纪 90 年代末，W3C 不再扩展 HTML，而是关注一种名为 XHTML 1.0 的新规范，它是使用更严格的 XML（扩展标记语言）的\
    \ HTML 版本。创建了两个版本：XHTML 1.0 Strict 和 XHTML 1.0 Transitional。\n\nStrict 版本的设计是为了让浏览器使用\
    \ W3C XHTML 1.0 Strict 规范的语法规则支持；Transitional 建议是一个更宽容的 XHTML 版本，旨在作为最终全球采用 XHTML\
    \ Strict 的临时桥。\n\nXHTML Strict 的目标是创建可预测和渲染的 Web 文档。事实上，在 2000 年的大部分时间里，技术 Web\
    \ 开发社区关注标准：即遵循 W3C XHTML 规范。使用 HTML 验证器（见图 1.2）作为检查 页面标记是否符合 XHTML Transitional\
    \ 或 Strict 指南的方法，是 Web 开发社区标准运动的核心部分。\n\n"
