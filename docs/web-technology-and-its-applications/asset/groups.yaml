    # 2.12 CONFLICT RESOLUTION


    Sometimes on a web page, there can be two different values for the same property
    on the same element leading to conflict.


    ```

    h3 {color: blue;}

    body h3 {color: red;}

    ```


    The browser has to resolve this conflict. There can be one or more type of conflict:
    i.e. when style sheets at 2 or more levels specify different value for same property
    on some element. This conflict is resolved by providing priority to the different
    levels of style sheets. The inline level gets the highest priority over the document
    level. The document level gets the higher priority over the external level.


