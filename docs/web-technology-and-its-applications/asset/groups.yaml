    ## 2.10 ALIGNMENT OF TEXT


    The text-indent property can be used to indent the first line of a paragraph.
    This property takes either a length or a percentage value. The text-align property,
    for which the possible keyword values are left, center, right, and justify, is
    used to arrange text horizontally. The float property is used to specify that
    text flow around some element, often an image or a table. The possible values
    for float are left, right, and none, which is the default.


    ```html

    <html

    <head>

    <title>Text Alignment</title>

    <style type="text/css">

    h1.one {text-indent: 0.5in; text-align: justify;} img{float:right} </style>

    </head>

    <body>

    <h1 class="one">VTU Facts</h1>

    <p>

    <img src="img19.jpg" alt="error"/></p>

    </p>

    <p class="two">Visvesvaraya Technological University (VTU) is a collegiate public
    state university in Karnataka State, India </p></body>

    </html>

    ```


    ## 2.11 THE `<span>` AND `<div>` TAGS


    In many situations, we want to apply special font properties to less than a whole
    paragraph of text.

    The `<span>` tag is designed for just this purpose.


    ```html

    <html

    <head>

    <title><span></title>

    <style type = "text/css">

    .spanviolet {font-size:25pt;font-family:''lucida calligraphy'';color:violet;}

    </style>

    </head>

    ```


    ```html

    <body>

    <p > The university is named after

    <span class="spanviolet">Sir Visvesvaraya </span>

    , from Karnataka, the only engineer to be awarded a Bharat Ratna award.

    </p>

    </body>

    </html>

    ```


    It is more convenient, however, to be able to apply a style to a section of a
    document rather than each paragraph. This can be done with the `<div>` tag. As
    with `<span>`, there is no implied layout for the content of the `<div>` tag,
    so its primary use is to specify presentation details for a section or division
    of a document.


    ```html

    <html

    <head>

    <title><div></title>

    <style type = "text/css">

    .one {font-size:20pt;font-family:''lucida calligraphy'';color:violet;}.two {font-size:25pt;font-family:''comic
    sans ms'';color:green} </style>

    </head>

    ```


    ```html

    <body>

    <div class="one">

    <p>Paragrah 1 under division 1</p>

    <p>Paragrah 2 under division 1</p>

    <p>Paragrah 3 under division 1</p>

    </div>

    <div class="two">

    <p>Paragrah 1 under division 2</p>

    <p>Paragrah 2 under division 2</p>

    <p>Paragrah 3 under division 2</p>

    </div>

    </body>

    </html>

    ```


    ## 2.12 CONFLICT RESOLUTION


    Sometimes on a web page, there can be two different values for the same property
    on the same element leading to conflict.


    ```css

    h3 {color: blue;}

    body h3 {color: red;}

    ```


    The browser has to resolve this conflict. There can be one or more type of conflict:
    i.e. when style sheets at 2 or more levels specify different value for same property
    on some element. This conflict is resolved by providing priority to the different
    levels of style sheets. The inline level gets the highest priority over the document
    level. The document level gets the higher priority over the external level.


