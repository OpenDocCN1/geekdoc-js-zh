    § It runs directly inside the browser, without the need for the JVM. 节 JavaScript
    is dynamically typed (also called weakly typed) in variables that can be easily
    (or implicitly) converted from one data type to another.


    # 3.1 Client-side scripting


    It refers to the client machine (i.e., the browser) running code locally rather
    than relying on the server to execute and return the result.


    There are many advantages of client-side scripting:


    +   1. Processing can be offloaded from the server to client machines, thereby
    reducing the load on the server.


    +   2. The browser can respond more rapidly to user events than a request to a
    remote server ever could, which improves the user experience. 3. JavaScript can
    interact with the downloaded HTML in a way that the server cannot, creating a
    user experience more like desktop software than simple HTML could.


    # Disadvantages of client-side scripting


    +   节 There is no guarantee that the client has JavaScript enabled, meaning any
    required functionality must be housed on the server, despite the possibility'
  - '[PAGE 70]


    that it could be offloaded.

    The idiosyncrasies between various browsers and operating systems make it difficult
    to test for all potential client configurations. JavaScript-heavy web applications
    can be complicated to debug and maintain.


    # 3.2 JavaScript Design Layers


    In object-oriented programming, a software layer is a way of conceptually grouping
    programming classes that have similar functionality and dependencies. Common software
    design names include:


    +   1. Presentation layer

    2. Validation layer.

    3. Data layer.


    # 3.2.1 presentation Layer


    This type of programming focuses on the display of information. JavaScript can
    alter the HTML of a page, which results in a change, visible to the user. These
    presentation layer applications include common things like creating, hiding, and
    showing divs, using tabs to show multiple views, or having arrows to page through
    result sets.


    # 3.2.2 Validation Layer


    JavaScript can also be used, for example, validating logical aspects of the user"s
    experience. This could include, validating a form to make sure the email entered
    is valid before sending it along. It is often used in conjunction with the presentation
    layer to create a coherent user experience, where a message to the presentation
    layer highlights back fields.


    # 3.2.3 Asynchronous Layer


    JavaScript operates in a synchronous manner where a request sent to the server
    requires a response before the next lines of code can be executed. During the
    wait between request and response the browser sits in a loading state and only
    updates upon receiving the response.


    In contrast, an asynchronous layer route requests to the server in the background.
    In this model, as certain events are triggered, the JavaScript sends the HTTP
    requests to the server, while waiting for the response, the rest of the application
    functions normally, and the browser isn"t in a loading'
  - '[PAGE 71]


    state. When the response arrives JavaScript will (perhaps) update a portion of
    the page. Asynchronous layers are considered advanced versions of the presentation
    and validation layers above.


    A client may not have JavaScript because they are:


    +   1. **Web crawler**: A web crawler is a client running on behalf of a search
    engine to download your site, so that it can eventually be featured in their search
    results. These automated software agents do not interpret JavaScript, since it
    is costly, and the crawler cannot see the enhanced look anyway.

    2. **Browser plug-in**:A browser plug-in is a piece of software that works within
    the browser, that may interfere with JavaScript. There are many uses of JavaScript
    that are not desirable to the end user. Many malicious sites JavaScript to compromise
    a user’s computer, and many networks deploy advertisements using JavaScript. This
    motivates some users to install plug-ins that stopJavaScript execution.

    3. **Text-based client**: Some clients are using a text-based browser. Textbased
    browsers are widely deployed on web servers, which are often accessed using a
    command-line interface.

    4. **Visually disabled client**: A visually disabled client will use special web
    software to read the contents of a web page load out to them. Specialized browsers
    do not interpret JavaScript,and some JavaScript on sites is not accessible to
    these users.


