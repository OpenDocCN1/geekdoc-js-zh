    \n要类中添加常量，使用 `const` 关键字。常量一旦定义无法更改。它们的用法如下：\n\n```php\nconst MIN_AGE = 10;\n\
    ```\n\n与变量不同，常量使用 `self::` 访问：\n\n```php\necho self::MIN_AGE;\n```\n\n## 面向对象设计的封装\n\
