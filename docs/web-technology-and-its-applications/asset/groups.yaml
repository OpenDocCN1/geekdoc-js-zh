    # 35 动作按钮：


    重置按钮（Reset）会将表单中的所有控件重置为初始状态。提交按钮（Submit）有两个动作：首先，表单数据被编码并发送到服务器；其次，请求服务器执行在 `<form>`
    标签的 `action` 属性中指定的服务器端程序。


    此类服务器端程序的目的是处理表单数据并向用户返回某些响应。每个表单都需要一个提交按钮。提交按钮和重置按钮是用 `<input>` 标签创建的。


    # 示例：


    ```html

    <html>

    <head>

    <title> 动作按钮 </title>

    </head>

    <body>

    <form action="">

    <p>

    <input type="SUBMIT" value="SUBMIT"/> <input type="RESET" value="RESET"/> </p>

    </form>

    </body>

    </html>

    ```


    # 2.3 帧（FRAMES）


    浏览器窗口可以同时显示多个文档。窗口可以划分为若干矩形区域，每个区域都是一个帧。每个帧都能显示自己的文档。


    # 2.3.1 帧集（Frameset）


    浏览器窗口中帧的数量及其布局由 `<frameset>` 标签指定。`<frameset>` 元素取代文档中的 `body` 元素。文档要么有 `body`，要么有
    `frameset`，不能兼两者。`<frameset>` 必须具有 `rows` 或 `cols` 属性。创建水平帧使用 `rows` 属性，创建垂直帧使用
    `cols` 属性。这些属性的值可以是数字、百分比和星号。两个或多个值用逗号分隔。星号表示剩余空间。`<frameset>` 内部可以嵌套多个 `<frameset>`
    标签以创建复杂的布局。每个帧都使用 `<iframe>` 标签来定义其显示的文档，`src` 属性指定文档路径。


    # 2.4 CSS：引言：


    XHTML 样式表被称为级联样式表，因为它们可以在三个级别上定义以指定文档的样式。低级样式表可以覆盖高级级样式表，标签内容的样式实际上是通过级联定义的。


    # 2.4.1 样式表的层级


    样式表的三个级别从最低级别到最高级别分别是：内联（inline）、文档级（document level）和外部（external）。


    内联样式表适用于单个 XHTML 元素。内联样式规范出现在标签内部，仅适用于该标签的内容。内联样式表的优先级高于文档样式表，而文档样式表的优先级高于外部样式表。


    ```html

    使用内联样式表的示例 <html>

    <head>

    <title>示例 CSS</title>

    </head>

    <h1 style="font-family: arial; font-size: 50pt; color: Red;"> HKBK 工程学院</h1></html>

    ```


    文档级样式表适用于文档的整个主体。外部样式表可以适用于任意数量的文档。文档级样式规范出现在文档的头部部分，适用于整个的整个主体。


    ```html

    使用文档级样式表的示例 <html>

    <head>

    <title>示例 CSS</title>

    </head>

    <style type="text/css">

    h1

    {

    font-family: ''arial'';

    font-size: 100pt;

    color: Red;

    }

    </style>

    </head>

    <h1>HKBK 工程学院</h1>

    </html>

    ```


    外部样式表单独存储并在所有使用它们的文档中引用。外部样式表被写为 MIME 类型为 text/css 的文本文件。它们可以存储在 Web 上的任何计算机上。浏览器像获取文档一样获取外部样式表。


