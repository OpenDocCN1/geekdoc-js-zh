    \niv. **RGBA**：代表 alpha，用于识别透明度，值是一个从 0.0（完全透明）到 1.0（完全不透明）之间的值。\n例如：color: rgb(255,\
    \ 0, 0, 0.5);\n\nv. **HSL**：允许使用色调（Hue）、饱和度（Saturation）和亮度（Light）值指定颜色。\n例如：hsl(0,\
