    # 2.7 F PROPERTIES


    # Font Families


    The font-family property is used to specify a list of font names. The browser
    uses the first font in the list that it supports. For example, the property:


    font-family: Arial, Helvetica, Futura


    ells the browser to use Arial if it supports that font. If not, it will use Helvetica
    if it supports it. If the browser supports neither Arial nor Helvetica, it will
    use Futura if it can. If the browser does not support any of the specified fonts,
    it will use an alternative of its choosing. If a font name has more than one word,
    the whole name should be delimited by single quotes, as in the following example:


    font-family: "Times New Roman"


