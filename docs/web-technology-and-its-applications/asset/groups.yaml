    \n## 1.7 样式的位置\n\nCSS 样式可以位于 3 个不同的位置：\n\n1. 内联样式\n2. 嵌入式样式表/3. 外部样式表\n\n### 内联样式\n\
    它们通过 \"style\" 属性放在 HTML 元素内部。它只影响该元素并覆盖任何其他样式定义。\n例如：\n```html\n<!DOCTYPE html>\n\
    <html>\n<body>\n<h1 style=\"color:blue; margin-left:30px\">This is a heading</h1>\n\
    <p>This is a paragraph.</p>\n</body>\n</html>\n```\n### 缺点：\n内联样式会增加带宽消耗并降低可维护性。\n\
    \n### 内部样式表\n如果一个页面有独特的样式，可以使用内部样式表。内部样式定义在 HTML 页面 `<head>` 部分的 `<style>` 元素内。\n\
