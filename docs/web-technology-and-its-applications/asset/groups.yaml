    # Web Technology and Its Applications ii


    PREFACE


    This book embodies a distillation of topics that we, as educators, frequently
    covered in the past two decades in various undergraduate courses related to Web
    Technology and its applications in VTU, Belgaum. This book can also serve the
    purpose of material for a more advanced level where the reader is exposed to alternate
    and more contemporary computational frameworks that are becoming common and more
    suitable.


    Web development is an evolving amalgamation of languages that work in concert
    to receive, modify, and deliver between parties using the Internet as a mechanism
    of delivery. While it is easy to describe conceptually, implementation is accompanied
    by an overwhelming variety of languages, platforms, templates, frameworks, guidelines,
    and standards. This text provides the developer with an understanding of the various
    elements of web development by focusing on the concepts and fundamentals through
    the examples within, providing a foundation that allows easier transition to other
    languages and a better understanding of how to approach their work.


    What motivated us to write another book on algorithms are several important and
    subtle changes in the understanding of many computational paradigms and the relative
    importance of emerging out of some spectacular discoveries and changing technologies.
    As teachers and mentors, it is our responsibility to inculcate the right focus
    in the younger generation so that they continue to enjoy this intellectually critical
    activity and contribute to the enhancement of the field of study.


    Author, Pundalik Chavan

    Husna Tabassum


    # PROFILE


    Prof. Pundalik Chavan received the B.Eng. degree in computer science and engineering
    from Visvesarayya Technological University, Belagavi, Karnataka, India, in 2010,
    the master M.E. degree from the Bangalore University, Bengaluru, Karnataka, India,
    in 2013. He is pursuing towards his Ph.D. in VTU-RC at Cambridge Institute of
    Technology, Bengaluru, Karnataka, India. He is having total 10+ Years of work
    experience in Teaching/Research field. Life-Time Membership of ISTE and IAENG.
    He is currently working as an Assistant Professor in department of computer science
    and Engineering in HKBK College of Engineering, Bengaluru. Organized and conducted
    SDP/Webinars/Conferences. His areas of research are Wireless Networks, Data Communications,
    Network Security, Computer Networks, IOT, Blockchain Technology. He has 06 publications
    in various National & International Journals and conferences.


    Husna Tabassum received her M-Tech degree in Computer Science and Engineering
    from VTU, Belgaum. She is currently working as an Assistant Professor in HKBK
    College of Engineering, Bangalore. She is having 8 Years of work experience in
    teaching field. Life time membership of ISTE. Organized and conducted value added
    course on “Machine Learning with Python” and Workshop on “Developing Web Apps
    using JSP”. To pursue a challenging career with steady growth and give valuable
    contribution to the success of the organization. Research interests are in Digital
    Image Processing, Cyber Security, Cloud Computing.


    # WEB TECHNOLOGY AND ITS APPLICATIONS (Effective from academic year 2018-2019)
    SEMESTER – VI


    Course Code: 18CS63

    CREDITS: 4

    Total Contact Hours: 60/50 Hrs


    Course Learning Objectives: This course will enable students to:

    - Illustrate the Semantic Structure of HTML and CSS

    - Compose forms and tables using HTML and CSS

    - Design Client-Side programs using JavaScript and Server-Side programs using
    PHP

    - Examine Object Oriented Programming capabilities of PHP

    - Inspect JavaScript frameworks like jQuery and Backbone which facilitates developer
    to focus on core features.


    ### Module 1

    Introduction to HTML, What is HTML?, HTML Syntax, Semantic Markup, Structure of
    HTML Documents, HTML5 Semantic Elements, Introduction to CSS, What is CSS, CSS
    Syntax, Location of Styles, Selectors, The Cascade: How Styles Interact, The Box
    Model, CSS Styling.


    ### Module 2

    Tables and Forms: Introducing Tables, Form Control Elements, Table and Form Accessibility,
    Microformats, Normal Flow, Positioning Elements, Constructing Multumn Layout,
    Approaches to CSS Layout, Responsive Design, CSS Frameworks.


    ### Module 3

    JavaScript: Client-Side Scripting, What is JavaScript and What can it do?, JavaScript
    Design Principles, JavaScript Objects, The Document Object Model(DOM), JavaScript
    Events, Introduction to Server-Side Development, A Web Server''s Responsibilities,
    Quick Tour of PHP.


    ### Module 4

    PHP Arrays and Globals, $_GET and $_POST, $_SERVER Array, $_FILES Array, Reading/Writing
    Files, PHP Classes and Objects, Object Oriented Design, Error Handling and Validation,
    What are Errors and Exceptions?, PHP Error Reporting, PHP Error Handling.


    ### Module 5

    Managing State, The Problem of State in Web Applications, Passing Information
    via Query Strings, Passing Information via the URL Path, Cookies, Serialization,
    Session State, HTML5 Web Storage, Caching, Advanced JavaScript and jQuery, JavaScript
    Pseudo Classes, jQuery Foundations, AJAX, Asynchronous File Transmission, Animation,
    Backbone MVC Frameworks, XML Processing, JSON, Overview of Web Services.


    Course Outcomes: The student will be able to:

    - Adapt HTML and CSS syntax and semantics to build web pages

    - Construct and visually format tables and forms using HTML and CSS

    - Develop Client-Side Scripts using JavaScript and Server-Side PHP to generate
    and display the contents dynamically.

    - Appraise the principles of object oriented development using PHP

    - Inspect JavaScript frameworks like jQuery and Backbone


    Question Paper Pattern:

    - The question paper will have ten questions.

    - Each full question consisting of 20 marks

    - There will be 2 full questions (with a maximum of four sub questions) from each
    module.

    - Each full question will have sub questions covering all the topics under module.

    - The students will have to answer 5 full questions, selecting one full question
    from each module.


    Textbooks:

    1. Randy Connolly, Ricardo Hoar, "Fundamentals of Web Development", 1st Edition,
    Pearson Education India. (ISBN: 978-9332572571)


    Reference:

    1. Robin Nixon, “Learning PHP, MySQL & JavaScript with jQuery, CSS and HTML5”,
    4th Edition, O’Reilly Publications, 2015. (ISBN: 9352130153)

    2. Luke Welling, Laura Thomson, “PHP and MySQL Web Development", 5th Edition,
    Pearson Education, 2016. (ISBN: 978-8236582736)

    3. Nicholas C Zakas, “Professional JavaScript for Web Developers”, 3rd Edition,
    Wrox/Wiley India, 2012. (ISBN: 978-8126530888)

    4. David Sawyer Mcfarland, “JavaScript & jQuery: The Missing Manual", 1st Edition,
    O’Reilly/Schroff Publishers & Distributors Pvt Ltd, 2014

