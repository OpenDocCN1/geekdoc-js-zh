    \ x-small, medium, large, x-large, and xx-large. In addition, smaller or larger\
    \ can be specified. Furthermore, the value can be a percentage relative to the\
    \ current font size.\n\n### 2.7.2 Font Variants\n\nThe default value of the font-variant\
    \ property is normal, which specifies the usual character font. This property\
    \ can be set to small-caps to specify small capital characters. These characters\
    \ are all uppercase, but the letters that are normally uppercase are somewhat\
    \ larger than those that are lowercase.\n\n### 2.7.3 Font Styles\n\nThe font-style\
    \ property is most commonly used to specify italic, as in *font-style: italic\n\
    \n### 2.7.4 Font Weight\n\nThe font-weight property is used to specify the degree\
