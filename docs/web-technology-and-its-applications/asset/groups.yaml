    CSS includes 60 different properties in seven categories: fonts, lists, alignment
    of text, margins, colours, backgrounds, and borders. Property values can appear
    in a variety of forms. Keyword property values are used when there are only a
    few possible values and they are predefined. A number value can be either an integer
    or a sequence of digits with a decimal point and can be preceded by a sign (+
