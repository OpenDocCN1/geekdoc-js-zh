    ### Terminology


    - Objects have particular properties (also called attributes or data members)
    and methods.


    - The structure of these objects is defined by classes, like a blueprint. Each
    variable created from a class is called an object or instance, and each object
    maintains its own set of variables, and behaves (largely) independently from the
    class once created.


    ### The Unified Modelling Language


    The standard diagramming notation for object-oriented design is UML (Unified Modelling
    Language). UML is a set of graphical techniques to describe software design. Some
    integrated development environments (IDEs) will even generate code from UML diagrams.
    Types of UML diagram are defined. Class diagrams and object diagrams, in particular,
    are useful to us when describing the properties, methods, and relationships between
    classes and objects.


    ### The Unified Modelling Language


    To illustrate classes and objects in UML, consider the artist. Every artist has
    a first name, last name, birth date, birth city, and death date. Using objects
    we can encapsulate those properties into a class definition for an Artist.


    ### Differences between Server and Desktop Objects


    One important distinction between web programming and desktop application programming
    is that the objects (normally) only exist until a web script is terminated. While
    desktop software can load an object into memory and make use of it for several
    user interactions, a PHP object is loaded into memory only for the life of HTTP
    request. Object-oriented web applications can see significant performance degradation
    compared to their functional counterparts if objects are not utilized correctly.
    Unlike desktop, there are potentially thousands of users making requests at once,
    so not only objects are destroyed upon responding to each request, but memory
    must be shared between many simultaneous requests, each of which may load objects
    into memory. It is possible to have objects persist between multiple requests
    using serialization, which is the rapid storage and retrieval

