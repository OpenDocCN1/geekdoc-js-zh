    # 35 The Action Buttons


    The Reset button clears all of the controls in the form to their initial states.
    The Submit button has two actions: First, the form data is encoded and sent to
    the server; second, the server is requested to execute the serverresident program
    specified in the action attribute of the <form> tag.


    The purpose of such a server-resident program is to process the form data and'
  - '[PAGE 56]


