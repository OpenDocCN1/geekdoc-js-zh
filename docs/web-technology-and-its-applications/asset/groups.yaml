    \n在 PHP 中，构造函数定义为名为 `construct()` 的函数。（注意：在 `construct` 单词之前有两个下划线 `__`）。注意在构造函数中，每个参数都使用\
    \ `$this->` 语法赋值给内部类变量。在类内部，您必须始终使用 `$this` 语法来引用与该特定实例相关的所有属性和方法。\n\n在类定义中添加构造函数：当您定义了对象可以执行的行为或操作时，对象变得有用。在面向对象的语言中，这些操作被称为方法（类似于函数），只不过它们与类相关。它们定义了每个类实例可以执行的任务，并且由于它们将行为与对象关联而非常有用。\n\
    \n## 可见性\n\n属性或方法的可见性决定了类成员（即属性或方法）的访问权限，并可以设置为 `public`、`private` 或 `protected`。`public`\
