    \ by pound signs (#), as in #AAFF00.\n\n## 2.7 PROPERTIES\n\n### Font Families\n\
    \nThe font-family property is used to specify a list of font names. The browser\
    \ uses the first font in the list that it supports. For example, the property\
    \ font-family: Arial, Helvetica, Futura tells the browser to use Arial if it supports\
