  md: '# 5.7.2 jQuery selectors


    The implementation of selectors in jQuery purposefully mirrors the CSS specification.


    The four basic selectors are:


    +   * universal selector

    * class selectors

    * id selectors

    * elements selectors.


    +   1. `("*")` - Universal selector matches all elements (and is slow).

    2. `("tag")` - Element selector matches all elements with the given name.

    3. `(".class")` - Class selector matches all elements with a given CSS class.

    4. `("#id")` - Id selector matches all elements with a given HTML attribute. In
    addition to these basic selectors other CSS selectors that are included


    +   **1. Attribute selectors:** An attribute selector provides a way to select
    elements by the presence of an element attribute or by the value of an attribute.


    +   **2. Pseudo-elements:** Pseudo-elements are special elements, which are special
    cases of regular ones.pseudo-element selectors allow you to append to any selector
    using the colon and one of: :link,:visited,:focus,:hover,:active,:checked,:first-child,:first-line,
    and :first-letter. These selectors can be used in combination with the selectors
    presented above, or alone. Selecting all links that have been visited, for example,
    would be specified with:


    ```

    var visitedLinks = $(":a:visited");

