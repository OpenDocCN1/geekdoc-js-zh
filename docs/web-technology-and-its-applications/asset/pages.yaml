  md: 'These rules are quite straightforward:


    +   1. Element names are composed of any of the valid characters (most punctuation
    symbols and spaces are not allowed) in XML.

    2. Element names can''t start with a number.

    3. There must be a single-root element. A root element is one that contains the
    other elements; for instance, in an HTML document, the root element is <html>.

    4. All elements must have a closing element (or be self-closing). 5. Elements
    must be properly nested.

    6. Elements can contain attributes.

    7. Attribute values must always be within quotes.

    8. Element and attribute names are case sensitive.


    A valid XML document is one that is well formed and whose element content conforms
    to the rules of either its document type definition (DTD) or its schema.


    There are two other XML technologies that are sometimes used in a web context.


