  md: '# (i)multi-process (also called preforked)


    The default installation of Apache runs using the multi-process mode. That is,
    each request is handled by a separate process of Apache; the term fork refers
    to the operating system creating a copy of an already running process. Since forking
    is time intensive, Apache will prefork a set number of additional processes in
    advance of their being needed. Forking is relatively efficient on Unixbased operating
    systems, but is slower on Windows-based operating systems. As well, a key advantage
    of multiprocessing mode is that each process is insulated from other processes;
    that is, problems in one process can''t affect others.


    # (ii) multi-threaded (also called worker)


    In the multi-threaded mode, a smaller number of Apache processes are forked. Each
    of the processes runs multiple threads. A thread is like a lightweight process
    that is contained within an operating system process. A thread uses less memory
    than a process, and typically shares memory and code; as a consequence, the multi-threaded
    mode typically scales better to large loads. When using this mode, all modules
    running within Apache have to be threadsafe.


