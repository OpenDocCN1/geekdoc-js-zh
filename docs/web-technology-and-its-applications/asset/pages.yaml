    # 5.19 OVERVIEW OF WEB SERVICES


    Web services are the most common example of a computing paradigm commonly referred
    to as service-oriented computing (SOC), which utilizes something called "services"
    as a key element in the development and operation of software applications.Web
    services are a relatively standardized mechanism by which one software application
    can connect to and communicate with another software application using web protocols.
    Web services make use of the HTTP protocol so that they can be used by any computer
    with Internet connectivity.


    Benefit of web services


    +   1) they potentially provide interoperability between different software applications
    running on different platforms.

    2) they can be used to implement something called a service- Oriented architecture
    (SOA).


    # i) SOAP Services


    SOAP is the message protocol used to encode the service invocations and their
    return values via XML within the HTTP header.

    Using SOAP-based services is somewhat akin to using a compiler: its output may
    be complicated to understand, but it certainly makes life easier for most programmers.'
