    # 3.12 Web server


    +   1) Apache and Linux:

    Apache runs as a daemon on the server. A daemon is an executing instance of a
    program (also called a process) that runs in the background, waiting for a specific
    event that will activate it. As a background process, the Apache daemon waits
    for incoming HTTP requests. When a request arrives, Apache then uses modules to
    determine how to respond to the request.


    In Apache, a module is a compiled extension (usually written in the C programming
    language) to Apache that helps handle requests. For this reason, these modules
    are sometimes referred to as handlers.


