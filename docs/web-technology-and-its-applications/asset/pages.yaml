  md: '# ii) XML Processing in PHP


    PHP provides several extensions or APIs for working with XML:6. The DOM extension,
    which loads the entire document into memory where it is transformed into a hierarchical
    tree structure. This DOM approach is relatively standardized, in that many other
    development environments and languages implement relatively similarly named functions/methods
    for accessing and manipulating the data.


    +   2. The SimpleXML extension, which loads the data into an object that allows
    the developer to access the data array properties and modifying the data methods.


    +   3. The XML parser is an event-based XML extension. This is sometimes referred
    to as a SAX-style API, which for PHP developers confusingly stands for Simple
    API for XML, which was the original package for processing XML in the Java environment.
    This is generally a complicated approach that requires defining handlers for each
    XML type (e.g., element, attribute, etc.).


    +   4. The XMLReader is a read-only pull-type extension that uses a cursorlike
    approach similar to that used with database processing. The XMLWriter provides
    an analogous approach for creating XML files. The SimpleXML and the XMLReader
    extensions provide the easiest ways to read and process XML content.


    the SimpleXML extension is not a sensible solution for processing very large XML
    files because it reads the entire file into server memory; however, since the
    file is in memory, it offers fast performance.


    Eg: Combining XMLReader and SimpleXML'
