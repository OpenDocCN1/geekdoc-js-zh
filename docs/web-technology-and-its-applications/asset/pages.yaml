- img_proc: true
  md: '![](img/05c71622ed7cf086940348e0edf07c33_152_0.png)


    No special steps are needed to deploy a REST-based service, no special tools (other
    than a browser) are generally needed to test a RESTful service, and it is easier
    to scale for a large number of clients using wellestablished practices and experience
    with caching, clustering, and load balancing traditional dynamic HTTP websites.


    REST appears to have almost completely displaced SOAP services. The relatively
    easy availability of a wide range of RESTful services has given rise to a new
    style of web development, often referred to as a mashup, which generally refers
    to a website that combines and integrates data from a variety of different sources.'
