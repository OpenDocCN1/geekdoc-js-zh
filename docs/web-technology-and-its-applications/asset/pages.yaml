  md: 'Asynchronous JavaScript with XML (AJAX) is a term used to describe a paradigm
    that allows a web browser to send messages back to the server without interrupting
    the flow of what"s being shown in the browser. This makes use of a browser"s multi-threaded
    design and lets one thread handle the browser and interactions while other threads
    wait for responses to asynchronous requests.


    # Client Browser Server


    | Browser Interface | JavaScript | WebService |

    | --- | --- | --- |


    ![](img/05c71622ed7cf086940348e0edf07c33_132_0.png)


    +   1. Browser parses and builds the DOM then renders the HTML page and runs JavaScript.


    +   2. Everything is in a waiting state until an event occurs (like the user clicks
    a button). The browser synchronously handles the event in JavaScript.


    +   3. JavaScript handles the event, asynchronously requesting a web resource
    and returns control to the browser.


    +   4. While the server processes the request, the browser is not stuck waiting
    in a refresh state.


    +   5. JavaScript processes the response, and...


    +   6. Updates the user interface.


