  md: '![](img/05c71622ed7cf086940348e0edf07c33_151_0.png)


    # ii) REST Services


    REST stands for Representational State Transfer.

    A RESTful web service does away with the service description layer as well as
    doing away with the need for a separate protocol for encoding message requests
    and responses. Instead, it simply uses HTTP URLs for requesting a resource/object(and
    for encoding input parameters). The serialized representation of this object,
    usually an XML or JSON stream, is then returned to the requester as a normal HTTP
    response.'
