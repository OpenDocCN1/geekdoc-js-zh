    ### 2.1.3 HTML align attribute

    The purpose of the HTML align attribute is to specify the alignment of data and
    the justification of text in a cell of a table. HTML align attribute supports
    col, colgroup, tbody, td, tfoot, th, thead, tr elements. The align attribute has
    the possible values left, right, center, and with the obvious meanings for horizontal
    placement of the content within a cell. The default alignment for th cells is
    center; for td cells, it is left. The valign attribute of the <thead> and <td>
    tags has the possible values top and bottom. The default vertical alignment for
    both headings and data is left.


    ### 2.1.4 Table Sections

    Tables naturally occur in two and sometimes three parts: header, body, and footer.
    (Not all tables have a natural footer.) These three parts can be respectively
    denoted in XHTML with the thead, tbody, and tfoot elements. The header includes
    the column labels, regardless of the number of levels in those labels. The body
    includes the data of the table, including the row labels.


    The footer, when it appears, sometimes has the column labels repeated after the
    body. In some tables, the footer contains totals for the columns of data above.
    A table can have multiple body sections, in which case the browser may delimit
    them with horizontal lines that are thicker than the rule lines within a body
    section.


