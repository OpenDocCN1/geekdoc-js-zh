    # iii) Cross origin resource sharing (CORS)


    Cross-origin resource sharing (also known as cross-origin scripting) is a way
    by which some malicious software can gain access to the content of other web pages
    you are surfing despite the scripts hosted on another domain. Since modern browsers
    prevent cross-origin requests by default (which is good for security), sharing
    content legitimately between two domains becomes harder.


    Cross-origin resource sharing (CORS) uses new headers in the HTML5 standard implemented
    in most new browsers. If a site wants to allow any domain to access its content
    through JavaScript, it would add the following header to all of its responses.


    Access-Control-Allow-Origin: *


    The browser, seeing the header, permits any cross-origin request to proceed'
