    # Background


    The background color or image of an element fills an element out to to its border
    (if it has one, that is). In contemporary web design, it has become extremely
    common to use CSS to display purely presentational images (such as background
    gradients and patterns, decorative images, etc.) rather than using the <img> element.


    The most common background properties are mentioned below: 1. **background**:
    A combined shorthand property that allows you to set multiple background values
    in one property. While you can omit properties with the shorthand, remember that
    omitted properties will be set to their default value.


    +   2. **background-attachment**: Specifies whether the background image scrolls
    with the document (default) or remains fixed. Possible values are: fixed, scroll.


    +   3. **background-color**: Sets the background color of the element. 4. **background-image**:
    Specifies the background image (which is generally a jpeg, gif, or png file) for
    the element.


    +   5. **background-position**: Specifies where on the element the background
    image will be placed. Some values include: bottom, center, left, and right.


    +   6. **background-repeat**: Determines whether the background image will be
    repeated. For creating a tiled background (it is in fact the defaultbehavior).
    Possible values are: repeat, repeat-x, repeat-y, and no-repeat.


    +   7. **background-size**: New to CSS3, this property lets you modify the size
    of the background image.


