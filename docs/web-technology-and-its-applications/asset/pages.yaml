  md: '# 1. <meta> tag


    The <meta> tag provides metadata about the HTML document. Metadata will not be
    displayed on the page, but will be machine parsable.Meta elements typically used
    to specify


    +   - Page description

    - Keywords

    - author of the document

    - last modified

    - other metadata.


    The metadata can be used by browsers (how to display content or reload page),
    search engines (keywords), or other web services. <meta> tags always go inside
    the <head>.


    # 2. <link> tag


    The <link> tag defines a link between a document and an external resource. The
    <link> tag is used to link to external style sheets. The <link> element is an
    empty element; it contains attributes only. This element goes only in the head
    section, it can appear any number of times.


    ```

    Eg: <link rel="stylesheet" type="text/css" href="theme.css"> </head>

    ```


    # 3. <script> tag


    The <script> tag is used to define a client-side script (JavaScript).The <script>
    element either contains scripting statements, or points to an external script
    file through the src attribute.Common uses for JavaScript image manipulation,
    form validation, and dynamic changes of content.


    ```

    Eg: <script src="js/html5pgm.js"></script>

    ```


