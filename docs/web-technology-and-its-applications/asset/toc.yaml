  - 使用 isset() 和 empty() 比较参数为了处理预期错误，我们需要首先验证用户输入是否存在，其次验证它是否包含预期值。PHP 提供了两个测试变量值的函数：`isset()`
    在变量为空时返回 true。然而，`isset()` 本身并提供足够的错误检查。通常检查查询字符串值的更好选择是 `empty()` 函数，如果变量为 null、false
    或空字符串，则返回 true。
