  md: '# 1.1 First Things First


    Let''s start with the basics of what to do when you''re presented with someone
    else''s code to maintain:


    Don''t panic!


    First, you have a strategic decision to make: Do you want this responsibility
    or not? Your best if not only chance to reject this assignment—if that is an option
    at all—with any semblance of honor may be right at the outset, even though you
    have nowhere near enough information to tell you how arduous it will turn out
    to be. If you can, stall for time so you can find out more about what this project
    entails.


    Let''s assume you''ve decided that the best thing you can do for your career right
    now is to take over this code (even if you think you have no choice in the matter,
    this is a much more empowering way to view it). Your first duty is:


    Find the author!


    Only superhuman developers will have left you so many resources for maintaining
    this code that your job won''t be massively eased by personal contact with them.
    Even if they''re in the process of cleaning out their desk while a security guard
    hovers impatiently nearby, track them down now and ask them:


    +   * Did anyone else work on this code? Who?

    * Are there any other files or data that weren''t given to you that would be useful?

    * Are there any documentation, engineering notebooks, or Post-it® stuck to the
    monitor that pertain to the project? The programmer may be in the process of round-filing
    them as you speak.'
  merge: -1
