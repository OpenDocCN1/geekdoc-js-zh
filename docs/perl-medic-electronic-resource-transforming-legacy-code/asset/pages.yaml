  md: '# Chapter 3 • Test Now, Test Forever (Diagnosis)


    # 3.2.6 The Test::Pod Module


    Documentation in Perl need (POD) format for storing documentation in the Perl
    source code (see the perpod manual page) is a markup language and therefore it
    is possible to commit syntax errors. Rather than wait until your users try to
    look at your documentation (okay, play along with me here—imagine that you have
    users who want to read your documentation, and get errors from their POD viewer,
    you can make sure in advance that the POD is good.


    Test::Pod exports a single function, pod_ok(), which checks the POD in the file
    named by its argument. I''ll show an example of its use later in the chapter.


    # 3.2.7 Test::Inline


    If you''re thinking that tests deserve to be inside the code they''re testing
    just as much as documentation does, then you want Test::Inline. This module by
    Michael Schwern enables you to embed tests in code just like POD, because, in
    fact, it uses POD for that embedding.


    # 3.2.8 Test::NoWarnings


    Fergal Daly''s Test::NoWarnings (formerly Test::Warn::None) lets you verify that
    your code is free of warnings. In its simplest usage, you just use the module,
    and increment the number of tests you''re running, because Test::NoWarnings-adds
    one more. So if your test starts:


    ```

    use Test::More tests => 17;

    ```


    then change it to:


    ```

    use Test::NoWarnings;

    use Test::More tests => 18;

    ```'
