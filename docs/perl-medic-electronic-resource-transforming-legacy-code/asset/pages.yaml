  md: '# 3.2 Extreme Testing


    and the final test will be that no warnings were generated in the running of the
    other tests.


    # 3.2.9 The Test::Harness Module


    Test::Harness is how you combine multiple tests. It predates every other Test::
    module, and you''ll find it in every version of Test::Harness exports a function,
    runests(), which runs all the test files whose names are passed to it as arguments
    and summarizes their results. You won''t see one line printed per test runests()
    intercepts these lines of output. You''ll see one line printed per test file,
    followed by a summary of the results of the tests in that file. Then it prints
    a global summary line. Here''s an example of the output:


    ```

    t/01_load....ok

    t/02tie....ok

    t/03use....ok

    t/04pod.....ok

    All tests successful.

    Files=4, Tests=24, 2 clocksec secs 1.51 cusr + 0.31 csys = 1.82 CPU

    ```


    As it runs, before printing ''ok'' on each line, you''ll see a count of the tests
    being run updating in place, finally to be overwritten by ''ok''. If any fail,
    you''ll see something appropriate instead of ''ok''.


    You can use Test::Harness quite easily, for instance:


    ```

    perl -MTest::Harness -e ''runests(glob "*.t")''

    ```


    but it''s seldom necessary to do that, because a standard Perl module makefile
    will do it for you. I''ll show you shortly.


    Test::Harness turns your regression tests into a full-fledged deliverable. Managers
    just love to watch the numbers whizzing around.'
