    # 8.2. PPM


    On a Windows platform CPAN.pm will not be useful due to the absence of the make
    program. You can either get a version for Windows such as nmake or dmake, get
    one in a UNIX emulation environment as Cygwin, or you can take the easier step
    of using the ppm (Per Package Manager) program included in ActiveState''s Windows
    Perl distribution. PPM only knows about modules that have been ported to the PPM
    repository, so it will always lag behind CPAN; but on the other hand, all the
    compilation has already been done for you, installation of modules with binary
    components can be much easier than on a UNIX machine. An extreme example of this
    is PerlTk, which on UNIX requires you first acquire and build the underlying Tk
    and Tcl libraries, whereas on Windows everything will be installed for you with
    the single PPM install command.


