    # 10.2.2 Overloading


    When you have created an object class for which you can reasonably impute behavior
    that ought to happen when instances of that undergo basic operations such as arithmetic
    (+ - /), string eq ""), or another type, you have the option of making it behave
    that way. This is the same kind of operator overloading that C++ has and Java
    doesn''t.


    Of course, the object class has semantics that are amenable to this sort of intervention.
    If you had a Date class, addition of two members of the class would not make sense;
    on the other hand subtracting one from another could reasonably be interpreted
    as yielding a member of a class encapsulating duration; and the overloaded addition
    of a Duration object and a Date object could be interpreted as yielding another
    Date object.


    Overloading is most often used for providing transparent stringification; this
    allows you to implement "dwummery" for your own objects.³ It''s quite


