  md: '# 8.1 The Case for CPAN


    # 8.1.5 Make or Buy?


    Our final concern arises in the form of a venerable question that takes on a special
    aura when applied to modules. We programmers have a well-known tendency to underestimate
    the time it takes to create code. If we were right first time about interface
    and design decisions, never hit any problems, didn’t have to write tests because
    the code worked to begin with, and could leave out documentation, then our schedule
    estimates might only be too optimistic by a factor of two.


    Otherwise, with the exception of a few people in CMM-SW (Software Engineering
    Institute Capability Maturity Model for Software) level 5 environments [CMU03]
    or devout adherents of the Personal Software Productivity process [HUMPHREY94],
    we’re likely to be way off the mark. “Create a module for parsing CGI form inputs—no
    problem! Three, four hours at the most.” we think. This is not just abusing the
    virtue of hubris, this is mugging it in a dark alley.


    Before you decide to hack out your own module without looking for an equivalent
    on CPAN, consider what you will have to do, one way or another, sooner or later,
    in your module:


    +   - Document it it (in POD of course).

    - Comment it for maintenance programmers.

    - Port it to any platforms or versions of Perl that might be required by users.

    - Write regression tests for users.

    - Respond to user feedback and requests.


    The only time it makes sense not to use a CPAN module that already does what you
    want is if it is such a bad fit in other respects that you will spend longer learning
    its documentation or working around unnecessary interfaces than it would take
    to create a module that does only what you want. Of course, false hubris makes
    us think that this is true 90 percent of the time. But if you truly believe that
    a particular CPAN module is not worth the effort after read-'
