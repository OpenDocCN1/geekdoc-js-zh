    # 8.3.2 Date Parsing and Manipulation


    So many people see wedded to the idea of calling an external program to find out
    the date. Granted, this is the way it''s done in shell scripts, but we can do
    better in Perl. You can:


    +   - Get the values for seconds, month, and so on, from localtimetime().

    - Format a data string any way you want, using the strftime function exported
    from the (core) POSIX module.

    - Parse a data string in virtually any format into a UNIX time (seconds) since
    epoch), using the (CPAN) Date::Parse module.


    ```

    % perl -MDate::Parse -le \\

    ''print str2time("Thursday")'' \

    1057215600

    ```


    +   - Parse a data string in even more formats (at the expense of noticeable compilation
    time) using the (CPAN) Date::Manip module. For example:


    ```

    % perl -MDate::Manip -le \\

    ''print ParseDateString("Next Wednesday") \

    200307090000:00

    ```


    ```

    % perl -MDate::Manip -le \\

    ''print ParseDateString("Last Wednesday") \

    200307020000:00

    ```'
