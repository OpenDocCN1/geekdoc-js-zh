  md: '# 3.2 Extreme Testing


    # 3.2.3 The Test::More Module


    You knew there couldn''t be a module called Test::Simple unless there was something
    complicated, right? Here it is. This is the module you''ll use for virtually all
    your testing. It exports many useful functions aside from the same ok as Test::Simple.
    Some of the most useful ones are:


    ```

    is($expression, $value, $description)

    Same as ok($expression eq $value, $description). So why bother? Because is ()
    can give you better diagnostics when it fails.

    ```


    ```

    like($attribute, /regex/, $description)

    Tests whether $attribute matches the regular expression.

    ```


    ```

    is_deeply($struct1, $struct2, $description)

    Tests whether data structures match. Follows references in each and prints out
    the discrepancy it finds, if any. Note that it does not compare the packages that
    any components may be blessed into.

    ```


    ```

    isa_ok($object, $class)

    Tests whether an object is a member of, or inherits from, a particular class.

    ```


    ```

    can_ok($object_or_class, @methods)

    Tests whether an object or a class can perform each of the methods listed.

    ```


    ```

    use_ok($module, @imports)

    Tests whether a module can be loaded (if it contains a syntax error, instance,
    this will fail). Wrap this test in a BEGIN block to ensure it is run at compile
    time, viz: BEGIN {use_ok(My::Module)}

    ```


    There''s much more see. See the Test::More documentation. I won''t be any other
    functions in this chapter, though.


    Caveat: I don''t know why you might do this, but if you fork() inside the test
    script, don''t run tests from child processes. They won''t be recognized by the
    parent process where the test analyzer is running.'
