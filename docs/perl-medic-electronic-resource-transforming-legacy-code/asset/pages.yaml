  md: '# Chapter 10 • Increasing Maintainability (Prophylaxis)


    Having taken charge of a program and made it your own, the last thing you want
    for it to turn into the same kind of albatross that you got saddled with in the
    first place. So it falls to you to make it as maintainable as you can.


    # 10.1 Making It Robust


    The more robust a program is, the less likely it is to attract attention to itself
    and invite maintenance. Here are some modules that can help with that task.


    # 10.1.1 Params::Validate


    People who have been programmed in other procedural languages like C. Java, and
    Pascal often wonder where the real subroutine prototypes are in Perl. They have
    this nagging feeling that subroutines aren''t safe until all their arguments have
    been validated as strictly as those other languages do. Params::Validate does
    exactly what they want, and a lot more.


    If you''re going to get strict about subroutine parameter checking, you might
    as well name your parameters. This is a good practice whenever you create a subroutine
    that takes (or can take) more than about three arguments (that''s the point at
    I get the itch to stop using positional parameters).


    Say you''re writing a subroutine to search for repeated phrases. You might want
    to specify options such as what to do with line breaks, capitalization matters,
    or what punctuation characters to ignore. Calling this subroutine with positional
    parameters:


    ```

    $phrases = repeated_phrases($text, 0, 1, [qw(" '' '' , !!]);

    ```


    is just going to be confusing, and using symbolic constants:


    > 1 Albatross at run time, not compile time. Sorry. Perl 6 will have compile-time
    parameter checking.'
