  md: '# 4.10 Evolution


    How far along each of those dimensions you are able to evolve your code before
    it succumbs to the pressures of change depends on your skills; the further along
    each dimension you go, the more skillful you need to be.


    When you''re writing legacy code, it may help to bump it along these dimensions
    one step at a time you get it to where you want. Space doesn''t permit me to go
    into much detail, so I''ll just cover some steps of some dimensions broadly.


    # 4.10.1 Modularity


    +   1. Flat scripting: One monolithic block of code.

    2. Subroutines: Abstracting common functionality; procedural programming.

    3. Using objects, making libraries of reusable sub.

    4. Subclassing existing modules.

    5. Creating application-specific object-oriented modules.

    6. Using ticing and overloading (see Section 10.2).


    # 4.10.2 Input Interfaces—Complexity


    +   1. Hand parsing of `ARGV`.

    2. Getopt::Std.

    3. Getopt::Long.

    4. Configuration files: see Simon Cozens module Config::Auto (http://search.cpan.org/dist/Config-Auto/).


    # 4.10.3 Error Handling—Application Size


    +   1. No error handling at all—“program and pray.”

    2. Checking return codes from built-in functions.'
