  md: "# 10.1 Making It Robust\n\ndie \"This shouldn't happen!!!\" if ...\n\nthen\
    \ it would be more recognizable as an assertion. Carp::Assert gives you several\
    \ ways of doing that:\n\nuse Carp::Assert;\n\n```\nsub yes_we_have_no_bananas\n\
    {\n    my $bananas = 0;\n    assert($bananas == 0) if DEBUG;\n    print \"Yes,\
    \ we have no bananas\\\";\n}\n```\n\nCarp::Assert doesn't print \"This shouldn't\
    \ happen!!!\" though. (Assertions are too sta for sort of language.) Instead it\
    \ prints \"Assertion failed!\" and a stack trace. If you'd like to print out message\
    \ of your own, you can give a second argument:\n\n```\nassert($bananas) == 0,\
    \ \"We DO have bananas!\" if DEBUG;\n```\n\nand then the first line of an exception\
    \ is \"Assertion (We DO have bananas!) failed!\"\n\nWhat's the if DEBUG for? That's\
    \ for improving performance when you want to disable that assertion and all the\
    \ others in your code easily. Carp::Assert exports a constant, DEBUG, set to a\
    \ true value. If you are satisfied that you have purged from your code the bugs\
    \ that could fire an assertion, and you want it to be as efficient as possible\
    \ in production, then you don't want Perl to spend time compiling and executing\
    \ assertions.\n\nYou can prevent Perl from executing assertions by changing one\
    \ word: instead of use Carp::Assert, you say no Carp::Assert. Now the assert()\
    \ function becomes a function that returns immediately without doing anything.\
    \ But that's still a subroutine call; if you're serious about performance you\
    \ don't want even that. The purpose of saying if DEBUG is that Perl will not compile\
    \ code that it can tell at compile time will never be executed."
