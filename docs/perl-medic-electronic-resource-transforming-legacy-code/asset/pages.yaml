  md: '# Chapter 3 • Test Now, Test Forever (Diagnosis)


    Perl wholeheartedly embraces this philosophy, thanks largely to the efforts in
    recent years of a group of people including Michael Schwert, chromatic, and others.
    Because of their enthusiasm and commitment to the testing process, the number
    of tests that are run when you build Perl from the source and “make test” has
    increased from 5,000 in Perl 5.004_04 (1997) to 70,000 in the current development
    version of Perl 5.9.0 (2004). That’s right, a 14-fold increase.


    True to the Perl philosophy, these developers exercise laziness in adding those
    thousands of tests (see sidebar). To make it easier to test easily for Perl, they
    created a number of modules that can in fact be used to test any-thing. We’ll
    take a look at them shortly.


    What is it about this technology that brings such joy to the developer’s heart?
    It provides a safety net, that’s what. Instead of perpetually wondering whether
    you accidentally broken some code while working on an unrelated piece, you can
    make certain at any time. If you want to make a radical change to some interface,
    you can ensure that you’ve fixed all the dependencies because every scenario you
    care about have been captured in a test case, and running all the tests is as
    simple as typing “make test”. One month creating a new system that comprised more
    than a dozen modules and as many programs, I had built up a test suite that ran
    nearly 600 tests with that one command, all by adding the tests as I created the
    code they tested. I made a radical change to convert one interface from functional
    to object-oriented, it took only a couple of hours because the tests told me when
    I was done.


    This technique has been around for many years, but under the label regression
    testing, which sounds boring to anyone who can even figure out what it means.¹
    However, using that label can be your entrance ticket to respectability when convincing
    managers of large projects that you know what you’re talking about.


    +   It’s called regression testing because its purpose is to ensure that no change
    has caused any part of the program regress back to an earlier, buggier stage of
    development.'
