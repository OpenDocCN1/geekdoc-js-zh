  md: "# 10.1 Making It Robust\n\n+   - Every method in the class shall define at\
    \ least one postcondition, which is a test of what the method is supposed to guarantee\
    \ to its caller. Class::Contract will take care of running the precondition every\
    \ time the method is invoked just before it returns to its caller, and if the\
    \ test fails, an exception will be thrown.\n\n+   - The class shall specify a\
    \ global test or invariant, which is a test that will be run at the end of each\
    \ method call and tests that the method has not violated the integrity of the\
    \ class.\n\nAs you might be able to tell, coming up with proper conditions might\
    \ require considerable expertise. Class::Contract provides these capabilities\
    \ and many more (e.g., conditions associated with object attributes): to do this.\
    \ virtually reimplemented large parts of Perl's object-oriented system (e.g.,\
    \ inheritance). By Class::Contract you specify methods, attributes, and inherit\
    \ differently from the native Perl way; you use Class::Contract's own language\
    \ for doing so. Here's a working, if extremely naive, example to show you what\
    \ language looks like:\n\nExample 10.1 BankAccount.pm Example for Class::Contract\n\
    \n```\npackage BankAccount;\nuse strict;\nuse warnings;\nuse Class::Contract qw(sid);\n\
    \n$INIT_RESERVES = 10000;      # Bailey Building & Loan\n\ncontract {\n  class\
    \ attr 'reserves' => 'SCALAR';\n  class ctor\n    impl { ${self->reserves} = $INIT_RESERVES\
    \ };\n  class method 'adjust_reserves'\n    pre { defined $_[0] };\n    failmsg\
    \ \"No amount to adjust reserves by given\"\n    impl { ${self->reserves} += $_[0]\
    \ }; };\n```\n\n2. Class::Contract is best for very large applications that work\
    \ / in this book"
