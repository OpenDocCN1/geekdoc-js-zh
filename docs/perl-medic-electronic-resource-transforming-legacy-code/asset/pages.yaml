  md: '# 3.2.4 The Test::Exception Module


    No, there''s no module called Test::EvenMore.3 But there is a module you''ll

    have to get from CPAN that can test for whether code lives or dies:

    Test::Exception. It exports these handy functions:


    ```

    lives_ok()

    ```


    Passes if code does not die. The first argument is the block of code, the sec-

    is is an optional tag string. There is no comma between those argugu-

    ments (this is a feature of Perl''s prototyping mechanism when a code block

    is the first argument to a subroutine). For example:


    ```

    lives_ok { risky_function() } "risky_function lives!",

    ```


    ```

    dies_ok()

    ```


    Passes if the code does die. Use this to check that error-checking code is

    operating properly. For example:


    ```

    dies_ok { ] / 0 "division by zero dies!",

    ```


    ```

