  md: 'Western society values independence and self-reliance. One of my favorite activities
    is to hike in the back country until I''m lost, and then I find my way out with
    maps and a compass. Using a global positioning satellite (GPS) unit, cellular
    telephone, or helicopter are not on my list of options, efficient though they
    may be.


    When it comes to programming however, it''s a different story. If I had nothing
    better to do, I might enjoy reinventing code that other people have already written.
    Because it''s been more than 20 years since I had nothing better to do, though,
    I need to be more prudent with my time and my clients’


    # 8.1 The Case for CPAN


    It surprises and disappoint me how often people waste time reinventing code for
    which a module already exists. Here are some reasons why they might be doing that:


    +   - They don''t know that there are non-core modules for Perl, or they don''t
    know where to find them.

    - They don''t trust non-core modules.

    - It takes them too long to find a module to do what they want.

    - Their management has a policy against using non-core modules.

    - They think it will be faster to write the code themselves than to figure out
    how to use a module.


    Let me address each of these issues in turn.'
