  md: '# 6.2 Cargo Cult Perl


    So quick, so simple, so wrong. The insidious nature of this beast is that it appears
    to work at first, and in fact work for every test case you happen to use it for.
    Unfortunately, in addition to interface flaws (no order of traversal is guaranteed,
    and some programmers may want to traverse all children of a directory before the
    directory itself, or vice versa), there are potentially fatal problems. One of
    those is the handling of cyclic symbolic links: the preceding code will loop until
    the filesystem gets rid of generating ever longer paths. Another is portability
    across filesystems.


    Other optimizations performed, and problems solved, by File::Find, I deliberately
    omit here: the point is that you don''t need to know what they are, because the
    authors of File::Find have done the work for you. Instead of typing all the preceding
    code, all you need to type instead is:


    ```

    use File::Find;

    ```


    which is a massive win for efficiency, maintainability, readability, and portability.
    If you don''t mind going to CPAN, Richard Clamp has File::Find::Rule(http://search.cpan.org/dist/File-Find-Rule/)
    a module that makes it even easier to construct filesystem traversal code.


