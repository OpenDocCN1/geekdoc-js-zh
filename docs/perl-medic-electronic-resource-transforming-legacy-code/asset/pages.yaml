  md: '# Chapter 9 • Analysis (Forensic Pathology)


    +   - Rewrite all of it in another language. Some applications are just better
    off that way. I would not write a windowing system in Perl, for instance, nor
    a guidance system for a cruise missile. If it has to run as fast as possible,
    C is a better bet. Beware that many people say “it has to run as fast as possible”
    when isn''t really the case, however. They usually have a standard in mind and
    if you can meet it with Perl, they''ll be happy even if you could have shaved
    some time off using another language.


    +   - Improve the algorithms. Algorithms are an often-neglected critical component
    of the education of any programmer. The right algorithm can make the difference
    between a program finishing in less than a second or exceeding the lifetime of
    the universe. See [AHO74], [AHO83], [BENTLEY82], and [ORANT99] for a start.


    # 9.4 Debugging


    Debugging is just an extreme case of dynamic analysis. Third-party code can be
    extremely convoluted (so can you your own code, of course, but you don''t usually
    ally think of it that way because you''re familiar with it; you knew it when it
    was just a subroutine); sometimes you can''t tell how part of the code fits in.
    or whether it''s called at all. The code is laid out in some arrangement that
    makes no sense; if only you could see where the program would actually go when
    it runs.


    Well, you can, using Perl''s built-in debugger. Even though you''re not trying
    to find a bug, the code-tracing ability of the debugger is perfect for the job.


    This isn''t the place for a full treatment of the debugger (you can see more detail
    in [SCOTT01], but fortunately you don''t need a full treatment; a subset of the
    commands is enough for what you need to do. (Using the debugger is like getting
    in a fight; it''s usually over quickly without many of the fancy moves you trained
    for.)'
