  md: '# Chapter 9 • Analysis (Forensic Pathology)


    There are a few special tricks you can use to enhance your use of the debugger.
    For instance, suppose you''re getting a warning, but it''s emerging from deep
    code that you didn''t write and you can''t tell where; you''d like the debugger
    to breakpoint at that place so you can display a stack trace and find out how
    you got there.


    Perl 5.8.0 and later will give you a stack trace anyway if you run a program under
    the debugger and some code triggers a warning. But suppose you are either running
    under an earlier perl, or you''d really like to have a debugger prompt at the
    point was about to happen.


    You can combine two advanced features of Perl to do this: *pseudo-signal handlers,
    and programmatic debugger control.*


    A signal handler is a subroutine you can tell Perl to execute whenever your program
    receives a signal. For instance, when the user interrupts your program by pressing
    Ctrl-C, that works by sending an INT signal to your program, which interprets
    it by default as an instruction to stop executing.


    There are two pseudo-signals, called WARN and DIE. They aren''t real signals,
    but Perl "generates" them whenever it''s told to issue a warning or to die, respectively.
    You can supply code to be run in those those events by inserting a subroutine
    reference in the %SIG hash (see *perlvar*) as follows:


    ```

    $SIG{__WARN__} = sub { print "Ouch, I''m bad" };

    ```


    (Try it on one code that generates a warning.)


    The next piece of the solution is that the debugger can be controlled from within
    your program; the variable $single in the special package DB determines what Perl
    does at each statement: 0 means keep going, and 1 or 2 mean give a user prompt.
    So setting $DB::single to 1 in a pseudo-signal handler will give us a debugger
    prompt if you wanted.


    > The difference between the two values is that a 1 causes the debugger to act
    as though the last or n command you typed was n, whereas a 2 is equivalent to
    an. When you type an empty command in the debugger (just hit Return), it repeats
    whatever the last or n command was.'
