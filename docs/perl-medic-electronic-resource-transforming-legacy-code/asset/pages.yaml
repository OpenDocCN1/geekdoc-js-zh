    # 7.6.1 Upgrading to Perl 5.003


    If the program is resorting to extraordinary shenanigans to find out where it
    is located, use FindBin.pm instead.


    # 7.7 Perl 5.004


    Allowed my to appear inside control structures, so that while (my $x = pop), for
    instance, created a new lexical variable scoped just to the while loop. Added
    the use of the arrow operator for dereferencing subroutine references, tied filehandles,
    and the UNIVERS methods can() and isa(). The regular expression anchor \G was
    added along with the concomitant /c modifier. The constant pragma and CGI.pm were
    added to the core modules.


