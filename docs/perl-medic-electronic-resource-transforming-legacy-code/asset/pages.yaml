    Just as strict ''vars'' expects variables either to be declared lexical or fully
    qualified, use strict ''subs'' expects subroutines either to be declared prior
    to being referenced as barewords, or called using explicit subroutine invocation
    syntax.


    It is not a compilation error to call a subroutine that hasn''t been defined.
    Perl is permissive enough to let you define subroutines at run, so it''s impossible
    to say at compilation time that a subroutine is missing.


    Here are examples of the effect of use no strict ''subs'' on calling a routine
    with no arguments:


    ```

    outgrade; # ok only if sub outgrade has already appeared

    outgrade(); # ok

    &outgrade; # ok

    outgrade(); # ok

    ```


    There is no restriction on method calls: when Perl sees -> followed by an identifier
    that it must be a method call regardless of whether it has seen its declaration
    yet or not.


    If for some reason you want to call a subroutine without parentheses before Perl
    has seen its declaration, you can put a forward declaration of that subroutine
    earlier than the call, like so:


    ```

    sub outgrade; # No code body

    # [...]

    outgrade;

    ```'
