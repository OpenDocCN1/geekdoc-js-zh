  md: "# Chapter 10 • Increasing Maintainability (Prophylaxis)\n\nand because constants\
    \ like DEBUG are defined at compile time, if DEBUG is false, then Perl won't compile\
    \ the assert() statement.\n\nObviously, assert() is simply syntactic sugar for\
    \ code that raises an exception if some condition is false. You could get the\
    \ same effect with\n\n```\nuse Carp;\nuse constant DEBUG => 1;\n# ...\nif (DEBUG)\n\
    \  confess \"We DO have bananas!\" unless $bananas == 0;\n```\n\nthe verbosity\
    \ of that construction is far more intrusive, and you want assertions to be lightweight\
    \ as possible.\n\n# 10.1.3 Class::Contract\n\nDamian Conway's Class::Contract\
    \ (http://search.cpan.org/dist/Class-Contract/), now maintained by C. Garrett\
    \ Goebel, implements the Design by Contract approach that originated in the Eiffel\
    \ world [EIFFEL03]. Successfully using this approach requires high degrees of\
    \ expertise in designing and discipline in implementing object classes: the payoff\
    \ is a sturdy safety\n\nBy Contract is like assertions that have been pumped full\
    \ of object-oriented steroids. It says that:\n\n+   * Every method in the class\
    \ shall define at least one precondition, which is a list of conditions that the\
    \ method requires to be satisfied in order to do its job. Class::Contract will\
    \ take care of running the precondition test every time the method is invoked\
    \ before it actually does anything, and if the test fails, an exception will be\
    \ thrown."
