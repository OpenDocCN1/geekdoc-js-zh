  md: '# Chapter 3 • Test Now, Test Forever (Diagnosis)


    If you inherit regression tests written to use Test.pm, it is still included in
    the Perl core for backward compatibility. You should be able to replace its use
    with Test::Simple if you want to start modernizing the tests.


    # 3.2.2 The Test::simple Module


    When I say “simple,” I mean simple. Test::Simple exports precisely one function,
    ok (). It makes one mandatory argument, and one optional argument. If its first
    argument evaluates to true, it prints “ok”; otherwise it prints “not ok”. In each
    case it adds a number that starts at one and increases by for each call to ok
    (). If a second argument is given, ok () prints a dash and that argument, which
    is just a way of annotating a test.


    Doesn’t exactly sound like rocket science, does it? But on such a humble foundation
    is the entire Perl regression test suite. The only other requirement is that we
    know how many tests we expected to run so we can tell if something caused them
    to terminate prematurely. That is done by an argument to use statement:


    ```

    use Test::Simple tests => 5;

    ```


    The output from a test run therefore looks like:


    ```

    ..5

    ok 1 - Can make a frobniz

    ok 2 - Can fliggle the frobniz

    not ok 3 - Can grikkle the frobniz

    ok 4 - Can delete the frobniz

    ok 5 - Can’t use a deleted frobniz

    ```


    Note that the first line says how many tests are expected to follow. That makes
    life easier for code like Test::Harness (see Section 3.2.9) that reads this output
    in order to summarize it.'
