    # 9.3 Finding Inefficient Code


    When an application is taking too long to run, one cure starts with finding out
    how long each part takes to run. Knowing where to expend your optimization efforts
    is key; if you happen to pick a piece of code that only consumes 1 percent of
    the total run time, then no matter how efficient you make it cannot achieve more
    than a 1 percent increase in speed (roughly 1.01 percent, for the pedants). Optimizing
    a piece that consumes 90 percent of the run time can lead to a speed-up up to
    a factor of 10. However, you should not rely on being able to determine by inspection
    alone which piece of code is which. People are notorious for being wrong in such
    assessments and the only thing that separa'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# 9.3 Finding Inefficient Code


    rates the experts from the neophytes is that the experts know that they shouldn''t
    trust their guesses. What they use instead is a profiling tool, and there are
    two available for Perl: Devel::DProf and Devel::SmallProf. Be aware that both
    of these modules unavoidably introduce inaccuracies into the times they report.
    Because they involve running additional code for every subroutine or statement
    that Perl executes (and because both invoke Perl’s internal debugging hooks),
    profiled programs will take longer to execute than their unaltered forms.


    # 9.3.1 Devel::DProf


    Devel::DProf is included in the Perl core; its purpose is to show you the execution
    profile at the level of subroutines. This means that it will show you the number
    of times those subroutines are called and the time spent executing them. Like
    Devel::Coverage and Devel::Cover, it is invoked as a debugger-plugin:


    +   * perl -d:DProf program arguments...


    It will log timing information to a file tmon.out that can rapidly get extremely
    large for even a moderately complicated run; monitor the size of the file from
    another window and terminate the run when you don''t like how large it becomes.
    The filename can be changed by setting the environment variable PERL_DPROF_OUT_FILE_NAME.


    The tmon.out file is not for human consumption and you need to run the program
    dprofpp to generate a report. As with any Perl program that''s installed with
    perl, you can use perldoc to view its documentation.


    dprofpp will give good output without any arguments; you can give it options to
    change its default behavior. By default it shows only the time spent inside the
    lexical scope of each subroutine, not the cumulative time spent in that subroutine
    and all subroutines called from it; but that''s what you want anyway.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'Regrettably there is no way to pipe the DProf output into dprofpp and avoid
    creating tmon.out, because DProf seek()s to near the beginning of the file periodically.


    # 3.3.2 Devel::SmallProf


    Ted Ashton''s Devel::SmallProf is being maintained by Salvador Fandiño and is
    available from CPAN (http://search.cpan.org/dist/Devel-SmallProf). Its purpose
    is similar to Devel::DProf, but it can show results at the finer finer of execution
    lines (hence, “small”). Ensuring that you have at most one statement per line
    will maximize the benefit of using this module, make sure you deobfuscated and
    beautified the code first.


    Devel::SmallProf generates a file called smallprof.out. It is not possible to
    cause the output to go elsewhere, but unlike Devel::DProf, the size of that file
    is not dependent on the length of run time but instead on the source code, because
    what it contains is all the source code, annotated with the number of times each
    line was called and how much wall clock time and CPU time spent executing it.


    The smallprof.out file is ordered by source code line number, which isn''t terribly
    helpful; the point of profiling is to find out what code is taking the longest
    to run. The commands for sorting the file given in the Devel::Small-Prof documentation
    aren''t as helpful as one would like, because smallprof.out contains page headers
    that clutter the output, and the filenames separated from the source code lines
    when sorted.


    I wrote a program that will sort either CPU or wall clock time, and output the
    filename of the source as well. (The truncated line of original source code that
    was at the end of each smallprof.out line had to be removed to make room for the
    filename.) It''s called smallprofpp and you''ll find it in the Appendix.


