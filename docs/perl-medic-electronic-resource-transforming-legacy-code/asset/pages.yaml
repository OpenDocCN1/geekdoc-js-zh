  md: '# Perl Medic Transforming Legacy Code


    "Perl Medic is not just a book. It is a well-crafted strategy for approaching,
    updating, and furthering the cause of inherited Perl programs."


    "Scott''s explanations of complex material are smooth and deceptively simple.
    He knows his subject matter and his craft—makes it look easy. Scott remains relentlessly
    practical—even the ''Analysis'' chapter is filled with code and tests to run"


    "Allen Wyke, co-author of several computer books including JavaScript Unleashed
    and PureJavaScript"


    "Dan Lincoln, author of several computer books including Advanced 5th: Action
    in Action"


    # Bring new power, performance, and scalability to your existing Perl code!


    Today''s Perl developers spend 60–80% of their time working with existing Perl
    code. Now, there''s a start-finish guide to understand that code, maintaining
    it, updating it, and refactoring it for maximum performance and reliability. Peter
    J. Scott, author of Perl Debugged, has written the first systematic guide to software
    engineering. Through extensive examples, he shows how to bring powerful discipline,
    consistency, and structure to any Perl program—new or old. You''ll discover how
    to:


    +   - Scale existing Perl code to serve network, Web, enterprise, or e-commerce
    applications

    - Rewrite, restructure, and upgrade any Perl program for improved performance

    - Bring standards and best practices to your entire library of Perl software

    - Organize Perl code into modules and components that are easier to reuse

    - Upgrade code written for earlier versions of Perl

    - Write and execute better tests for your software...or anyone else''s

    - Use Perl in team-based, methodology-driven environments

    - Document your Perl code more effectively and efficiently


    If you''ve ever inherited Perl code that''s hard to maintain, if you write Perl
    code that others read, if you want to write code that''ll be easier for you to
    maintain, the book that comes to rescue is Perl Medic.


    # On the Web Site


    Download all of the book''s sample code from www.perl.com!


    # About the Author


    PETER J. SCOTT runs Pacific Systems Design Technologies, providing Perl training,
    application development, and enterprise systems analysis. He was a speaker on
    the 2002 Perl Whirl at YAPC:Canada, and he founded his local Perl Monger group.
    A software developer since 1981 and a Perl developer since 1992, he has also created
    programs for NASA''s Jet Propulsion Laboratory. Scott graduated from Cambridge
    University, England, with a Master of Arts in Computer Science and now lives in
    the Pacific Northwest. He is the lead author of Perl Debugged.


    ![](img/43be69d751687f7aa9629237341c05bb_339_0.png)


    Text printed on recycled paper

