    # # 11.4 Coming into the 21st Century


    Now we can no longer ignore the fact that we are using an ancient, unsupported
    module (Dua.pm) for LDAP operations, and we look up the documentation for Net::LDAP.
    By line we replace Dua.pm calls with Net::LDAP calls. This requires us to learn
    Net::LDAP if we don''t already know it, but doing so will pay us handsome dividends.
    Here are the changes we have to make:


    +   - The timeout is now specified in the new () constructor.

    - If the constructor fails it returns undef and puts the error in $@.

    - The login to the server (called binding in LDAP terminology) is a separate method
    call, even though we are making an anonymous connection.

    - Searching is done by the search () method, which returns a result object in
    the Net::LDAP::Search class.

    - The bind () and search () methods return objects that have a code () method
    that returns true on error, and an error () method that returns the error text.

    - The Net::LDAP::Search class has a method, count(), which returns the number
    of results found, and another method, entries(), which returns all the results
    as a list of Net::LDAP::Entry objects.

    - Each Net::LDAP::Entry object has a get_value() method that will return the value
    of a named attribute.'
