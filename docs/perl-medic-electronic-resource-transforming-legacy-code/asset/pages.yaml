  md: 'In line 12 we create a WWW::Mechanize user agent to act as a pretend browser,
    and in line 13 we test to see if it was able to get the login page: the get ()
    method returns an HTTP::Response object that has an is_success() method. If something
    went wrong with fetching the page the false value will be passed through the ok
    () function; there''s no point in going further so we might as well die () (Line
    14). We can get at the HTTP::Response object again via the res () method of the
    user agent to call its message () method, which returns the test of the reason
    for failure.


    In lines 16 and 17 we provide the form inputs by name, and in line 18 the submit
    () method of the user agent submits the form and reads the response, again returning
    an HTTP::Response object allowing us to verify success as before. Once we have
    a response page we check whether it looks like what we wanted.


    Note that WWW::Mechanize can be used to test interaction with any web application,
    regardless of where that application is running or what it is written in.


    # ### 3.4.3 What Next?


    The kind of end-to-end testing we have been doing is useful and necessary: it
    is also a lot easier than the next step. To construct comprehensive tests for
    a large package, we must include unit tests; that means testing each function
    and method. However, unless we have descriptions of each subroutine does, we won''t
    know how to test them without investigative work to find out what they are supposed
    to do. I''ll go into those kinds of techniques later.


    # ### 3.5 A Final Encouragement


    In addition to the more obvious benefits, constructing tests or contemporaneously
    with code development encourages good program interface design.'
