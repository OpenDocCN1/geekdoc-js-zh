  md: "# 10.3 Documentation\n\nThe second convenience is that POD is simple. Larry\
    \ reasoned that to get people to write documentation, it had to be as easy as\
    \ possible to create and edit, so there are only a handful of POD formatting directives\
    \ to remember. You never have to worry about anything in your code being misinterpreted\
    \ POD—POD is only recognized by special lines that begin with an equal sign against\
    \ the left margin and are followed by a word. Within POD you can cause any text\
    \ to be output verbatim (nothing in it will be interpreted as formatting directives)\
    \ simply by indenting it. So including POD with code looks as simple as this,\
    \ for example:\n\n```\nsub quad_roots\n{\n  my ($a, $b, $c) = _;\n  my $disc =\
    \ sqrt($b*$b) - 4*$a*$c;\n  return((-$b + $disc) / 2 / $a, (-$b - $disc) / 2 /\
    \ $a);\n}\n```\n\n```\nhead2 ($root1, $root2) = quad_roots($a, $b, $c);\n```\n\
    \nReturn the two roots of a quadratic equation with the given coefficients, but\
    \ die if it has imaginary roots (in which case, use L<Math::Complex>). Calculated\
    \ from the classic formula\n\n```\n-b +/- sqrt(b**2 - 4ac)\n      2a\n```\n\n\
    POD directive lines need to be between blank lines to be recognized. Within non-verbatim\
    \ POD text, a few primitive markup tags are recognized. The one I used here, L<u>\
    \ used to format its contents as a link; when output to a format that supports\
    \ the concept of hyperlinking, the text will be linked to the POD page for Math::Complex\
    \ (assuming the formatter can find it; on). Just be aware that it will render\
    \ the output as “Math::Complex manpage” unless I override the default text for\
    \ something like this:\n\n```\nuse L<Math::Complex|the Math::Complex module>.\n\
    ```"
