- img_proc: true
  md: '# 8.3 Improving Code with Modules


    The temptation to parse HTML with regular expressions appears irresistible, judging
    by how many people do it. Not, to quote Seinfeld, that there''s anything wrong
    with that. If you can accept the risks and limitations of that style of parsing,
    it can certainly be more succinct and readable than the alternatives. However,
    you need to know what the risks and limitations are in order to accept them.


    The risks are that you will mislabel some part of the content; you might be looking
    for anchor tags, for instance, and accidentally find some that were embedded in
    comments or JavaScript that have nothing to do with what you were looking for.
    If you know the provenance of the content well enough to know that this has no
    chance of happening, then go ahead:


    ```

    @links = $content ~/<A$HREF=\*s*".*?/ig;

    ```


    Or suppose you''re scanning for form input tags, and you know the source well
    enough to know that the TYPE attribute will always precede the NAME attribute.
    You can use:


    ```

    @inputs = $content --</INPUT\s+TYPE="text"\s+NAME=".*?/ig;

    ```


    But the list of caveats for these examples builds up rapidly—we are sure that
    there will always be enclosing quotation marks, for instance? Browsers can work
    without them. When you get too nervous, it''s time to invoke the nonsense power
    of a true HTML parser, such as HTML::Parser, HTML::TreeBuilder, or—if all you
    want is just hyperlinks—HTML::LinkExtor. For further reading, see [BURKE02]. Randal
    Schwartz also pointed out advantages of using XML::Parser to parse HTML in [SCHWARTZ03].


    # 8.3.5 URI Parsing


    Uniform Resource Identifier (URI) is the proper technical term now for 99 percent
    of the world still calls a Uniform Resource Locator (URL). Common operations you
    may need to perform on a URI include:


    +   - Extracting one of the components (scheme, path, server, etc.).'
