    # 11.10.1 What Next?


    At this point, many other possible changes might suggest themselves to you; there
    are certainly more methods we could add to OzLDAP, for instance. However, in the
    absence of a need for them it''s not clear that the effort would worth it.


    You''d be entitled to point out at this stage that the current version of the
    program is not only longer than the original, but more complicated. Fair readability
    depends on other factors besides length, and we are more expert in Perl than the
    author of the original program. And in addition to cleaning up unclear and buggy
    code, we''ve added many features. We''ve produced a full-fledged module that both
    provides a foundation for code reuse (if it takes an LDAP directory to track the
    denizens of Oz, there are quite likely to be other uses for OzLDAP.pm) and enables
    us to modify our test script to test the essential search functionality independently
    of the CGI front end. We might easily have been justified in stopping several
    revisions ago.


    So let''s declare success at this point before getting carried away even further.
    Remember to add POD documentation to the program and the module!'
