  md: '# 10.1.5 Safe.pm


    Taint checking for CGI programs or other programs that operate on possibly malicious
    user input can go only so far. Sometimes there just isn''t a useful regular expression
    you can use that will capture what you wanted from the user input and will be
    guaranteed not return to unsafe code.


    For the ultimate in code protection, Safe.pm by Malcolm Beattie and Tim Bunce
    (in the Perl core since version 5.004) provides an environment in which you can
    execute Perl code in a private sandbox. That will only be able to read data you
    specifically allow it to access, only perform operations specifically enumerate,
    and can''t affect anything outside its sandbox except to return a result for you
    to use. Safe.pm is not an easy module to use, but when security is paramount it
    may be your best option.


    # 10.2 Advanced Brevity


    Perl provides some sophisticated forms of syntactic sugary (ways of making certain
    coding constructions briefer and more intuitive). Two of these techniques are
    tying and overloading.


    # 10.2.1 Tying


    We see an example of tying in Section 3.3. Tying lets you take over the normal
    function of a variable. On the outside, it looks like a normal scalar, array,
    hash, or whatever. But underneath, whenever the variable is used, code you wrote
    gets instead of what you''d expect to happen.


    This looks on the face of it good mainly for practical jokes (and it certainly
    has that potential). However, it can also be used for making code more succinct
    and for gaining transparency.


    Succinctness comes when you realize you are implementing functionality that behaves
    like a variable. For instance, if you have an electronic thermome-'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Chapter 10 • Increasing Maintainability (Prophylaxis)


    ter and code for reading the thermometer''s value, you could certainly implement
    it with traditional procedural code:


    ```

    use Thermometer;

    $temp = Thermometer->read;

    ```


    But a thermometer behaves just like a scalar variable (albeit a read-only variable);
    changing the reading on a thermometer does not change the temperature it measures,
    unless you know how to break the laws of thermodynamics. How much cooler, then
    (so to speak), to say:


    ```

    tie $current_temp, ''Thermometer'';

    ```


    and then whenever you read $current_temp. it is magically updated with the current
    temperature.


    The module Thermometer.pm can accomplish that quite easily through implementing
    methods TIESCALAR and FETCH according to the perlie documentation.


    The semantics of the functionality you are implementing need to map onto the natural
    behavior of one of Perl''s variable types for this to work. Our thermometer class
    is not a perfect match for a scalar (because it is meaningless to attempt to write
    it, and therefore we have to decide whether to implement and document any such
    attempt either throwing an exception or having no effect), but it''s certainly
    close enough to be worth the effort. We can associate attributes with each tied
    variable when we tie it, so we might choose to declare:


    ```

    tie $current_temp, ''Thermometer'', ''Celsius'';

    ```


    to make sure we know what units the temperature will be in we read it. This interface
    is now looking much better than the procedural equivalent:


    ```

    $current_temp = Thermometer->read_celsius;

    ```'
