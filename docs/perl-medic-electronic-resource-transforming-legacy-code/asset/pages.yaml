    # 8.1.4 Dealing with an Anti-CPAN Policy


    A policy that says “No CPAN code” is born out of fear or ignorance. Every day,
    companies and governments trust millions, even billions of dollars to CPAN modules.
    Refer your management to “Perl Success Stories” [OREILL99] for examples. If they
    are concerned about quality control, point out that modules such as PerlTk and
    DBI are nearly as complex as the entire Perl core (and presumably they trust the
    Perl core or you wouldn''t be reading this) and receive attention from dozens
    of maintainers and thousands of users. Sadly, though, many organizations suffer
    from the “Not Invented Here” syndrome, which causes them to be blind to important
    new technologies.


