    ```


    say:


    ```

    (time - $employee->hired > $ONE_WEEK)

    ```


    by storing times in UNIX seconds-since-epoch format and defining $ONE_WEEK earlier
    as 60 * 60 * 24 * 7. This is not only easier to read but lacks the bug in the
    previous code. That tortured tangle of pendulous programming may look absurd.
    But I have often seen worse. A developer is used to getting a date from the date
    command in shell scripts, does the same in a Perl program, stores the result in
    the same format, and it goes downhill from there.


    Sometimes you can''t make the code clear enough. When you add a comment to the
    word to keep in mind is, Why? Don''t recapitulate what the code does, but say
    why you are doing it. This doesn''t need to be a verbose justification, but can
    be as simple as this:


    ```

    (time - $employee->hired > $ONE_WEEK) # Past probation

    ```


    Although then you have to ask why it wasn''t written as:


    ```

    (time - $employee->hired > $PROBATION_PERIOD)

    ```'
