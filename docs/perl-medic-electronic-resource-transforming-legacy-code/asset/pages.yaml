  md: '# Chapter 12 • Conclusion (Prognosis)


    Everything ends, although for a long time this book looked like it was going to
    be an exception. Let''s just say that when I started writing, the original reason
    given in the Preface for Bill''s sudden departure from the company was that his
    stock options had matured . . .


    # 12.1 In Conclusion


    There are many reasons why I use and prefer Perl to other languages; having recently
    returned from the Open Source Conference and its embedded annual Perl Conference,
    I am reminded once again of an important one: namely, the quality of the people
    involved in the development and promotion of Perl. You don''t need to attend a
    conference to experience the pleasure of interacting with these people (although
    it''s certainly the most direct way of doing so); there are various online methods,
    some of which I will enumerate. A complete list would fill a book in its own right.


    # 12.1.1 Mailing Lists


    See http://lists.perl.org/ for a list far too lengthy and dynamic to reproduce
    here. Worthy of mention is the beginners list, whose charter is to answer questions
    from Perl beginners without flaming.


    # 12.1.2 Newgroups


    The main Usenet newsgroups for Perl are the following:


    +   * comp.lang.perl.misc: The main newsgroup for Perl postings, sees about a
    couple of hundred postings a day, including not a few heated discussions. Many
    Perl experts hang out here.

    * comp.lang.perl.moderated: A low-traffic group (fewer than a dozen postings a
    day) with a high signal-to-noise ratio. Postings need to be coherent and not asking
    FAQs in order to be approved.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '+   * comp.lang.perl.modules: Low-traffic group for questions and answers about
    using and writing Perl modules.


    +   * comp.lang.perl.announce: Very low-traffic moderated group for announcements
    about some new module releases and other significant events.


    +   * comp.lang.perl.tk: Just for users of PerlTk, the graphical interface.


    +   * alt.perl: Fewer than a dozen postings a day, but very few experts compared
    with comp.lang.perl.misc.


    +   * At least 20 regional groups.


    In addition, every mailing list hosted on perl.org is also bidirectionally gatewayed
    to a newsgroup nntp.perl.org, which is how I prefer to access the lists.


    # 12.1.3 Portals Allowing User Content Creation


    +   * use.perl.org: This site is based on Slashdot code and hosts lots of up-to-date
    news and reactions thereto. This is the best place to post news stories (which
    will be moderated). A free mailing list is also available.


    +   * www.perlmonks.org: This site has lots of visitors, and features Q&A discussions
    and real-time chat. It is an excellent place to get help fast and hone your skills
    at helping others. The rapid exchanges on topics of new interest mean that Perlmonks
    threads are often cited elsewhere.


    +   * www.perlguru.com: Jasmine Mereed’s site offers manyuseforums for all kinds
    of Perl questions, including job searches.


    # 12.1.4 Other Web Sites


    +   * www.perl.com: O''Reilly`s gateway to numerous current and archived articles
    about Perl and their voluminous book catalog. Free mailing list.'
