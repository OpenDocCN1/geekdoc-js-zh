    # 8.4 Custom Perls


    Back in the wild and woolly days of Perl 4, integrating custom C code into Perl
    took sweat, ingenuity, and guts. Whereas in Perl 5 binary code can be dynamically
    loaded faster than you can say “perldoc perlxs,” in Perl 4 you had to build a
    special version of perl template that contained the new code you wanted. You would
    edit some template files to load the new source files that you placed in the right
    subdirectory, and make perl from source all over again.


    To keep this and other custom perls separate from the unaltered, common or garden-variety
    perl, it was customary to give them names depending on what functionality had
    been added. Thus, a perl that had Oracle database intelligence embedded would
    be called oraperl. A perl that knew how to speak the Lightweight Directory Access
    Protocol (LDAP) to an X.500 user agent would be called duaperl. (Theoretically,
    a perl that had both capabilities ought to be called orduaperl, but I never heard
    of this.)


    Once Perl 5 appeared on the scene with dynamic loading of shared libraries (or
    DLLs), these custom perls were consigned to the scrap heap of history. Unfortunately,
    legacy code might still be using these relics of a bygone era; that’s why they
    call it “legacy.” Here is a guide to common types of custom perl and what to do
    with them.'
