  md: '# 9.4 Debugging


    You invoke the debugger with the -d command-line flag; either edit the program
    to add -d to the shebang line, or run the program by invoking Perl explicitly.


    ```

    % perl -d program argument argument...

    ```


    Make sure that the perl in your path is the same one the shebang line of program
    or you''ll go crazy if there are differences between the two perls.


    The commands in Table 9-1 will account for nearly all of your use of the debugger:


    TABLE 9-1 Basic Debugger Commands

    | Command | Description |

    | --- | --- |

    | n / h | Brief / verbose help (verbose / brief help prior to 5.8.0) |

    | b subroutine | Set breakpoint at first executable statement of subroutine |

    | b line | Set breakpoint for line |

    | b place condition | Set breakpoint for place (either line or subroutine) but
    trigger it only when the Perl expression condition is true |

    | c | Continue until end of program or breakpoint |

    | c line | Continue until end of line, end of program, or earlier breakpoint |

    | x expression | Examine the value of a variable or expression |

    | n | Execute current statement, skipping over any subroutines called from it
    |

    | s | Execute next Perl statement, going into a subroutine called from current
    statement if necessary |

    | 1 | List source code from current line |

    | r | Execute statements until return from current subroutine, end of program,
    or earlier breakpoint |

    | t | Display stack trace |

    | q | Quit |


    Armed with these commands, we can code spelunking. Suppose you are debugging a
    program containing the following code fragment:'
