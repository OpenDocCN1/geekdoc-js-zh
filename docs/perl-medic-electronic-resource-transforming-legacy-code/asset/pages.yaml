    period in them, were automatically converted to a packed binary form.


    open() came in some enhancements: If the filehandle was an undefined variable.
    open() would store the filehandle there, so you could say open $fh,. . . and have
    a lexically scoped filehandle that would automatically closed on being garbage
    collected. The three-argument form of open() appeared, as did binary literals
    and Ivalue subroutines. You could now call exists() on subroutines and array elements,
    and delete() array elements.


