  md: '# Chapter 8 · Using Modules (Genetic Enhancement)


    +   - Changing one of those components.

    - Turning a relative URI into an absolute one.


    Rather than trying to figure these things out via regular expressions, use the
    Perl module, which has methods for all of them.


    # 8.3.6 Database Interaction


    Too few modules that should be proper databases really are using them. Whenever
    concurrent access is a possibility, in particular, a database may be appropriate,
    since a proper relational database will handle locking for automatically and provide
    transaction semantics. Use DBI.pm and whichever of the myriad DBD:: family of
    modules speaks to the database of your choice. MySQL and PostgreSQL are two excellent
    free databases, so performance cost could not be an obstacle. You will have to
    learn SQL (unless you use any of a number of CPAN modules that attempt to insulate
    you from that task), but it''s not that difficult and the gains are well worth
    it if you''re going to make use of the database.


    If concurrency is not an issue and you don''t want to go through the trouble of
    putting up a database server, a DBM file offers significant advantages over a
    plain text file. You can use core modules such as DB_File to manage random access
    to the data, and store complex hierarchical structures with MLDBM (http://search.cpan.org/dist/MLDBM/).
    Best of all, you can do this by tying to the interface, if so, you''ve got a program
    that is running out of memory to store a particular hash. with a couple of lines
    you can tie it to a DBM file and instantly perform the trade-off of execution
    time for memory. (Just make sure the code doesn''t call keys() or values() in
    a list context, or the hash in a list context, or it''ll pull the whole database
    into memory to do so.)


    If you want to do your own locking to handle concurrency, you can, but this is
    not easy to get right (see the section “Locking: The Trouble with fd” in the documentation
    for the DB_File module).'
