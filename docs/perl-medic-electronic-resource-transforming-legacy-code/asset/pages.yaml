    \ name capitalization instead of respect_capitalization. Now we no longer to remember\
    \ the order in which these parameters must be specified, either.\n\nThe next step\
    \ up the evolutionary chain from named parameters is Params::Validate, by Dave\
    \ Rolsky, and a giant step it is. The subroutine writer calls the validate() function\
    \ (exported by Params::Validate) at or near the beginning of a subroutine, and\
    \ passes the subroutine parameters along with a template specifying what arguments\
