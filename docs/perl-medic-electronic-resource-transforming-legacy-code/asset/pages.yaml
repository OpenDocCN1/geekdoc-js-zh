    # 10.3 Documentation


    In Chapter 3, I showed how you would develop tests for a module, including its
    documentation. Now I’ll show you how to do the documentation itself.


    Wake up in the back row, Yes, I know I said “documentation.” That might have conjured
    up visions of Microsoft PowerPoint presentations, filling in sections with rigid
    headings like “Functional Requirements” and “Normative References,” and formatting
    signature blocks. I’m not talking about that kind of documentation. I’m talking
    about documentation that tells another programmer how or she needs to know about
    what you have done; the kind of documentation that you want to read when you take
    over someone else’s code. Or the kind of documentation you want to read about
    your own code when you come back to it a year later and for the life of you can’t
    remember how to use the object class whose interface you thought “intuitively
    obvious.”'
