    # 11.6 Incorporating Modules Effectively, Part 2


    However, this version feels dissatisfyingly inadequate. All that HTML text also
    looks like several large constant values: can we do the same with it?


    We, yes, with HTML::Template. We can break the HTML out into its own files (for
    normal output, for error output) and those files will now contain HTML. This will
    achieve separation of code and data—usually a good thing in its own right—and
    allow us to pawn off—er, delegate—the job of HTML editing to someone else. Let’s
    transfer the normal result HTML output to a file called output.tmpl.


    Example 11.9 output.tmpl, Version 1


    ```

    <HTML><HEAD><TITLE></TITLE></HEAD>

    <BODY>

    <h1>Results of search for <TMPL_VAR NAME=filter>></h1>

    <TABLE BORDER="1">

    <TR>

    <TH>username</TH>

    <TH>location</TH>

    <TH>haircolor</TH>

    <TH>telephone</TH>

    <TH>email</TH>

    <TH>fax</TH>

    <TH>name</TH>

