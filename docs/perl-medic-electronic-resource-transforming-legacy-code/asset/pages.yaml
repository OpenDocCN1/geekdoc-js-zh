    #  4.10 Evolution


    Imagine a very adaptable organism of indeterminate species responding to changes
    in its environment. Temperature rising? Evolve a thicker skin. Gravity increasing?
    Add more legs. Water table rising? Grow fins.


    Similarly, our code changes as various demands upon it increase: size of input
    data, number of concurrent users, and so on. You can think of those demands as
    happening along different dimensions; in other words, they can vary independently
    of each other and any given program may be subject to one or more type of demand.¹²'
