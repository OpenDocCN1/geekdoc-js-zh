    Note that there is a significant difference between the lines that took the most
    wall clock time and the ones that took the most cpu time. Generally, you should
    investigate the highest CPU time consumers first when seeking to improve performance:
    the excess of wall clock time over CPU may be due to I/O or other processes getting
    attention. Improving time spent doing I/O is a very tricky activity, and even
    determining whether I/O is the reason for the delay is problematic.


    # 9.3 Optimization Tips


    If your efforts to improve the speed of a Perl program aren’t approaching the
    target, there are number of strategies that may get you unstuck:


    +   * Rewrite parts of it in another language. Having identified section of code
    that takes a large proportion of execution time, if it is small enough, consider
    rewriting it in, say, C. Note that if the code is just performing text manipulation
    this might not improve the running speed because Perl works like a Complex Instruction
    Set Computer (CISC); its operators are implemented by highly optimized compiled
    C code. You can most easily include your code by using Brian Ingerson’s Inline::C(http://search.cpan.org/dist/Inline/).'
