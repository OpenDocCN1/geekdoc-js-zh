  md: '# 5.1 Package Variables. Lexical Variables


    reason to use a package variable these days, although there are some times we
    have no choice.


    Lexical variables are declared with my. If you inherit a program containing a
    variable that isn''t with my, that is a package variable and is visible from any
    part of the program, even other files, and even other packages (as long as they
    know what package variable is in). They can just reach right in and do whatever
    they want with it. Like strong magic, this can be used for good ... or evil. For
    instance, the File::Find module allows you to change its behavior by setting package
    variables, such as $File::Find:dont_use_nlink if you''re using AFS. This is a
    succinct interface, as is using the variable $File::Find:name to get the full
    path to the current file:


    ```

    # Print full paths for symbolic links

    use File::Find;

    $File::Find:dont_use_nlink = 1; # For AFS

    find(sub { print "$File::Find:name\n" if -1 }, ''.'');

    ```


    But a program that has gone over the dark side may set and read package variables
    from all kinds of unexpected places, making it incredibly difficult to tell how
    it works. Programmers call this kind of gross violation of encapsulation at a
    distance. Use lexical variables as much as possible and you''re less likely to
    make that mistake.


    # 5.1.1 Your Friendly local Perl Function


    Some variables can''t be declared with my; these are variables that belong to
    Perl, so you can''t get possessive over them. An example is the special array
    @ARGV (which is initialized with the command-line arguments). Times, it''s convenient
    to temporarily reassign to that array. Suppose you want to read information from
    several configuration files. Perl''s “diamond” operator <> makes this easy: it
    reads in succession from all the files named in @ARGV, opening and closing the
    files behind the scenes for you. So we can appropriate the diamond operator for
    our use even when the files we want to open aren''t listed on the command line,
    by just setting @ARGV first.'
