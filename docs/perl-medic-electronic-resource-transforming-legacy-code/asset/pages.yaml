  md: '# 5.3 use strict in Detail


    use strict is actually the same as saying


    ```

    use strict ''vars'';

    use strict ''subs'';

    use strict ''refs'';

    ```


    Each of these statements confers a different benediction. Let''s consider each
    one in detail.


    # 5.3.1 use strict ''vars''


    use strict ''vars'' forces you to use my. Well, more or less. This is a cunning
    way of catching typos, use strict ''vars'' requires that all variables either
    be declared with my or they be fully qualified with their package names (they
    must be package variables if they are not declared with my). The two exceptions
    to this rule are package variables declared with our or named by use vars; they
    need not be fully qualified.


    No, it is not good enough to say, "Okay. I''ll use my, just don''t make me strict
    ''vars.'' It''s too easy to make a mistake no matter how careful your typing.
    Suppose you decide that a good way to announce a successful return from a function
    is:


    ```

    $x = func() and print "\$x is true: set to \$x"

    ```


    Unfortunately, the $x in the print() is not the same $x declared by my. The scope
    of the new $x has not yet started (it starts with the following statement). Therefore
    the $x in the print() is in fact the package variable $x. which may be set to
    a completely different value or none at all. Only with strict will you get the
    error:


    Global symbol "\$x" requires explicit package name'
