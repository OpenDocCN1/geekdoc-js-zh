  md: "# 9.4 Debugging\n\nPutting the pieces together, you can start running the program\
    \ under the\ndebugger and give the commands:\n\n```\nDB<1> $SIG__WARN__ = sub\
    \ { warn @; $DB::single = 1 }\nDB<2> c\n```\n\nNow the program will breakpoint\
    \ where it was about to issue a warning, and\ny can issue a T command to see a\
    \ stack trace, examine data, or do anything\nelse you want. The warning is still\
    \ printed first.\n\nUnfortunately, no DIE pseudo-signal handler will return control\
    \ to the\ndebugger (evident death is considered too pressing an engagement to\n\
    interrupted). However, you can get a stack trace by calling the confess ()\nfunction\
