    the parentheses are unnecessary. You only need them when you are declaring more
    than one variable or when you need to put the right-hand side in list context.
    Their use like that suggests that the programmer thought that my is a function
    rather than a variable modifier and would therefore be unaware of the more subtle
    aspects of my, such as its separate compile time and run time effects.


    > ³ Yes, I know my is listed in perl. Whether that''s the right place for it is
    debatable.'
