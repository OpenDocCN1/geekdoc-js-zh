  md: '# 1.2 Reasons for Inheritance


    If the developer is on the verge of being ejected involuntarily from the premises.¹
    I find out whether they have any time to work with you on taking over this project.
    Tell your supervisor that “pair programming” is a good thing according to the
    popular Extreme Programming methodology and this is a golden opportunity to try
    it out. If all else fails, consider buying the former developer lunch for a week
    out of your own money. You''ll still end up far ahead of the game with what you
    learn from them that you''ll make it back in compensation or kudos. However, the
    developer will probably spend some time with you for nothing if you tell them
    you want their help in learning how they created their code: most people are touched
    by such flattery.


    # 1.2 Reasons for Inheritance


    It’s important to know why people inherit code, because you might jump to the
    wrong conclusion about which one applies in your case. Perhaps:


    +   * The original developer is gone.

    * The original developer is bored with the program and wants to be rid of it.

    * The original developer is reassigned or otherwise has no time to spare. (Don''t
    give up; this might be more negotiable than it first appears.)

    * The responsibility for the function performed by the program has been reassigned
    from the original developer''s group to your group.'
