    # 11.7 Making It Mature, Part 1


    We are satisfied yet? No! This program is still fragile because of duplication
    of information: the template contains the list of attributes, twice, and so does
    our program, and they all have to be in the same order. If the list of attributes
    changes, we''ll have to update three places. Furthermore, our CGI parameter-parsing
    loop blindly accepts the first parameter it sees and assumes it is a search term.
    A future change to the input might pass in some other kind of parameter and then
    we''d pick up the wrong one. That could happen by accident: Someone be using an
    HTML editor that gives a NAME attribute to the submit button and we''d receive
    an input parameter for the button click.'
