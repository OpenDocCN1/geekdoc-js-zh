  md: "ous in your program today turns out to be the subject of a warning added to\
    \ a later version of Perl?\n\nI prefer to leave the warnings in production programs.\
    \ My point of view is that warnings are like strictness exceptions, only pickier,\
    \ and should be treated the same: Either code to avoid the warning, or explicitly\
    \ disable the warning around code where:\n\n+   - You know why the warning is\
    \ being generated; and\n- You know that the warning is unlikely to be generated\
    \ for any other reason; and\n- It's clearer to disable the warning than to recode.\n\
    \nIf a new warning is added to Perl, the odds are that you'd want to know if you\
    \ had code that triggered it. Today's warnings could become tomorrow's fatal error\
    \ if you're using a feature that is being deprecated.\n\nDon't scratch the itch\
    \ to turn warnings off merely because they are inconvenient. Think of them instead\
    \ as a programming mentor nagging to make your code robust. You might respond,\
    \ \"No, I know what I'm doing, so don't complain about this again.\" by disabling\
    \ the warning; or you might change the code.\n\nFor instance, suppose you are\
