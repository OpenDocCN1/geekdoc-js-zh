  md: '# Chapter 12 • Conclusion (Prognosis)


    +   - Give all the information needed to solve the problem. If Perl did something
    you think was wrong


    +   - Be succinct. If you have a 1,000-line program that generated an error, no
    one is likely to read the whole thing for free. Condense the problem to the smallest
    piece of code that demonstrates your issue. Often this process will reveal the
    answer to you. Code of fewer than 50 lines has a good chance of being read.


    +   - Show that you want to learn. Say where you have already looked in the documentation
    for help. Did you try a Google search? See in particular http://groups.google.com/
    where you can look to see if someone else has already asked the question.


    +   - If you''ve found something wrong with someone''s code and you know how to
    fix it, send them the fix (preferably in diff -u format). Such an act takes you
    out of the category of questioner and puts you into the developer camp, where
    you will be warmly welcomed (especially if your patch works).


    An excellent example of such a question was forwarded to me while I writing this
    chapter, and I include it here because there''s a twist to it. First, the question:


