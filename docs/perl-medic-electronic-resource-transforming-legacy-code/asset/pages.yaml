  md: "# 6.2 Cargo Cult Perl\n\nThe while statement puts its condition in scalar context,\
    \ and a /g regular expression match in a scalar context acts as an iterator, repeatedly\
    \ returning true while the pattern matcher advances along the input string ($\
    \ in this case) until there are no more matches. We’re saving the portions of\
    \ interest in $1 and $2 via the capturing parentheses, and therefore the code\
    \ in the block had better use them.\n\nThe foreach statement imposes a list context\
    \ between the parentheses, and a /g regular expression match in a list context\
    \ returns a list of all the capturing parentheses matches. Inside the block $\
    \ will be set in turn to each of the successive $1 and $2 from each match. If\
    \ you actually wanted to differentiate between the $1 and $2, this would not be\
    \ good code, because you’d have no idea the block whether your $ represented the\
    \ word ($1) or the number ($2), unless you counted how many times you’d been through\
    \ the block and looked to see if that count was even or odd.\n\nLet’s look at\
    \ an example to make that clearer:\n\n```\n$ = <<EOT;\napples 42\noranges 57\n\
    lemons 21\npears 91\nEOT\n\n%stock;\nwhile ((\\w+)\\s*(\\d+))/g) {\n  my ($fruit,\
    \ $count) = ($1, $2);\n  $stock{$fruit} = $count;\n}\n```\n\nThis is using the\
    \ right tool for the job: because we need to differentiate between the fruit and\
    \ the count in the loop. we want to get two elements at a time. Had I tried this\
    \ with a foreach loop, not only would the loop not have started executing until\
    \ I’d accumulated all the matches in a list, but the block would have executed\
    \ first for apples, then for 42, then for oranges, and so on."
