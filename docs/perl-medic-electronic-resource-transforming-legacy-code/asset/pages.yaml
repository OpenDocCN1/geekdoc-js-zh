  md: '# 1.4 Observe the Program in Its Natural Habitat


    # 1.3 What Next?


    Take the files that were delivered to you and put them somewhere they can never
    be changed. Either make a copy of them on read-only media, or check them into
    a source code control system—preferably both. In your process of modifying these
    files there will likely come times when you want to see what they contained before
    some change you have already made. Putting the files under revision control from
    the start will be a decision you will come to value immensely. Systems that can
    range from the ubiquitous and free but venerable RCS and SCCS (see, e.g., [BOLINGER95]),
    through the popular CVS (see for example [VESPERMAN03]), to the latest open source
    project, Subversion (http://subversion.tigris.org/). Later I''ll show you how
    to integrate Perl files with those products.


    # 1.4 Observe the Program in Its Natural Habitat


    You need to know as soon as possible that the program actually works. Don''t assume
    that it works just because you''re told so! Perhaps you''re not in the group that''s
    responsible for the current operation of this program and you''re supposed to
    get it to do something else. Go to the original owners and watch them run the
    program. Check that the program they ran is identical to the one you were given.
    Then figure out how you can run the program yourself without making any modifications.
    This might not be as easy as it sounds; the program might depend on things like
    files you''re not permitted to access or accounts you don''t have. There might
    not be a test environment that you can try the program out on (more on this in
    Chapter 3). However, it is vital that you can reproduce the successful operation
    of the program you have just witnessed with as few modifications as possible.


    3. This may seem needlessly pedantic, but not if you consider the mind-puddling
    difficulty of diagnosis that would ensue if the two actually were different'
