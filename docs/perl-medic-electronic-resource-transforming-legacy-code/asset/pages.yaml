    Package variables (and most of Perl''s special variables listed in perlvar) can
    be saved temporarily with local. On the other hand, lexical variables can''t be
    localized, but don''t need to be; if you want to temporarily override a lexical
    variable just declare it again with my in an inner scope. Declaring a lexical
    variable twice at the same scope level triggers a warning.


    Dynamic scoping derives its name from the fact that it is determined at runtime.
    A package variable can always be referred to, even if nothing has ever set it,
    just like you can refer to a member of a hash even if it hasn''t been set, and
    get undef back. So in terms of where you can use its name, a package variable
    has global scope.


    As to the lifetime of the value of that package variable, if you assign a temporary
    value with local, that value is seen by all code that runs until Perl exits the
    block containing the local, at which point it returns to its previous value. By
    way example:


    ```

    1 $main::global = "outer";

    2 {

    3 my $lexical = "private";

    4 check_vars();

    5 local $main::global = "inner";

    6 check_vars();

    7 }

    8 check_vars();

    ```


    > * It''s even more like that than it seems: package variables are accessed via
    hashes.'
