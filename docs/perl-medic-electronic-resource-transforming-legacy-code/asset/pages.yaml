  md: 'Here’s what you’d do with those comments: If you’re using the code in a web
    application and you’re worried about bad guys slowing your server down by triggering
    many e-mails in succession, then keep a first-in, first-out cache of warnings
    and timestamps; if a warning is repeated too soon, ignore it. Decide what you
    want the user to see; in a web application, you might use a special error template.
    If you''re keeping logs of what your application does, log the error. Finally,
    send the e-mail message containing the actual error text to whoever in your organization
    is unlucky enough to be detailed to handle such things.


    # 5.5.6 Don’t Rush to Disable


    Don’t disable a warning when you don’t know why it happens. I have lost count
    of how many times I have heard someone ask what was wrong with your program, and
    on inspection, I discovered that they did not have warnings enabled. If they had,
    they would have received a giant clue as to what the problem was—but they said
    they had disabled the warnings because of all the messages that were produced.
    This is plugging your ears when your mentor is yelling. “I THINK THERE’S SOMETHING
    WRONG HERE!”


    # 5.6 Caveat Programmer


    use strict and use warnings may be very helpful, but don’t assume they’re going
    to catch all your mistakes. Perl leaves a lot of checking to run time. Look what
    happens when we take the limerick and make an innocuous change:


    ```

    % perl -Mstruct -Mwarnings -c

    There was a young man from Maastricht

    Whose programs just never had clicked

    Until he discovered

    The bugs he had had smothered

    Leaving out warnings & strict

    ^D

    - syntax OK

    ```'
