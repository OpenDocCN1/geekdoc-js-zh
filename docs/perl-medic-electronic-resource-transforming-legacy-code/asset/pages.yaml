  md: '# Chapter 5 • The Disciplined Perl Program


    warnings into fatal exceptions, and you can even make up your own warning classes.


    # 5.4.1 use warnings vs. Modules


    Because of the lexical scoping, use warnings will not propagate its effect to
    modules you use (whereas -w does). In your own modules, add warnings near the
    top. Other people''s modules may or may not be so enlightened. Now, it''s really
    the module author''s business and responsibility to make your code warnings-safe,
    but sometimes the author of a module you may not have put a use warnings statement
    in it.


    Why should you care? Quite often you can get a clue that there''s something wrong
    with your code from a warning generated inside a module. You may have created
    an undefined value somewhere and passed it into a module where it finally triggered
    a “use of uninitialized value” warning. That''s helpful. But with use warnings,
    you won''t get it unless the module author also had a use warnings statement.


    Therefore, for maximum safety when using third-party modules, add the -w flag
    to your shebang line. Regressive as that may sound, it will ensure that you see
    every warning that you can. Wherever warnings pragma appears, whether in your
    code or a module you use, the -w flag for the code under the control of that pragma
    will be ignored by Perl, so you still benefit from the additional pragma power
    where it applies.


    You can make warnings fatal with the FATAL argument:


    ```

    use FATAL => ''all'';",

    ```


    That turns all warnings (or whatever warning classes you specify) into fatal exceptions.
    Now your code will simply die when it would generate a warning.


    I''ll talk about how best to deal with warnings when writing your own modules
    in Section 10.4.'
