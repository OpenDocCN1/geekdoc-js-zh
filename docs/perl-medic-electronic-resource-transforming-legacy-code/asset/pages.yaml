- img_proc: true
  md: '# NAME


    Benchmark::TimeTick—Keep a tally of times at different places in your program


    # SYNOPSIS


    ```

    use Benchmark::TimeTick qw(timetick);

    # Your code...

    timetick("Starting phase three");

    # More of your code...

    ```


    # DESCRIPTION


    Benchmark::TimeTick provides a quick and convenient way of instrumenting a program
    to find out how long it took to reach various points. Just use the module and
    call the timetick() method whenever you want to mark the time at a point in your
    program. When the program ends, a report will be output giving the times at which
    each point was reached.


    The times will be recorded using Time::HiRes::time() if Time::HiRes is available,
    otherwise time() will be used. (Because time() has one-second granularity this
    is unlikely to be useful.)


    # CONFIGURATION


    You can customize the action of Benchmark::TimeTick via the package hash %Benchmark::TimeTick::Opt.
    Recognised keys are:


    suppress_initial if true, do not put an initial entry in the report when the module
    is loaded.


    suppress_final if true, do not put a final entry in the report when the program
    terminates.


    reset_start if true, report all times relative to the time that Benchmark::TimeTick
    was loaded rather than the actual start of the program.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'format_tick_tag If set, should be a reference to a subroutine that will take
    as input a $tag passed to timetick() and return the actual tag to be used. Can
    be helpful for applying a lengthy transformation to every tag while keeping the
    calling code short.


    format_report If set, should be a reference to a subroutine that will take as
    input a list of time ticks for reporting. Each list element will be a reference
