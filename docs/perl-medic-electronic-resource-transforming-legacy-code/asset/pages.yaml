  md: '# Chapter 3 • Test Now, Test Forever (Diagnosis)


    Suppose we have an application that provides a login screen. For the usual obscure
    reasons, the login form, login.html, contains one or more hidden fields in addition
    to the user-visible input fields, like this:


    ```

    <FORM ACTION="login.cgi" METHOD="POST">

    <INPUT NAME="username" TYPE="text">

    <INPUT NAME="password" TYPE="text">

    <INPUT NAME="frugalido" TYPE="hidden" VALUE="grilku">

    <INPUT TYPE="Submit">

    </FORM>

    ```


    On successful login, the response page greets the user with “Welcome,” followed
    by the user’s first name. We can write this test for this login function:


    Example 3.7 Using WWW::Mechanize to Test a Web Application


    +   1 #!/usr/bin/perl

    2 use strict;

    3 use warnings;

    4

    5 use WWW::Mechanize;

    6 use Test::More tests => 3;

    7

    8 my $URL = ''http://localhost/login.html'';

    9 my $USERNAME = ''peter'';

    10 my $PASSWORD = ''secret'';

    11

    12 my $ua = WWW::Mechanize->new;

    13 ok($ua->get($URL)->$is_success, "Got first page")

    14 or die $ua->res->message;

    15

    16 $ua->set_fields(username => $USERNAME,

    17 password => $PASSWORD);

    18 ok($ua->submit->$is_success, "Submitted form")

    19 or die $ua->res->message;

    20

    21 like($ua->content, qr/Welcome, Peter:/, "Logged in okay");'
