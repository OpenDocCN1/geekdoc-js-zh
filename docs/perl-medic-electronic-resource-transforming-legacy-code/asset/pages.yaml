    \ a block containing a no warnings pragma for that class around the code that\
    \ violates it.\n\nHere’s an example: Suppose you want to override an existing\
    \ subroutine and make it do something else. Two good reasons for wanting to do\
    \ this are temporarily overriding your of own subroutines for debugging purposes,\
    \ and overriding a method in a module you didn’t write so that you can change\
