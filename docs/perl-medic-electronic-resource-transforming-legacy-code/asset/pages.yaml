    filters.)


    # 4.4.2 Block Comments


    People often ask how they comment out a large piece of code. Wrapping it in an
    if (0) {...} block prevents it from being run, but still requires that it be syntactically
    correct.


    Instead, wrap the code in Plain Old Documentation (POD) directives so it''s treated
    as documentation. There are a number of ways of doing this: I''ve used =begin:


    ```

    =begin comment


    # Here goes the code we want

    # to be ignored by perl


    =end comment


    =cut

    ```


