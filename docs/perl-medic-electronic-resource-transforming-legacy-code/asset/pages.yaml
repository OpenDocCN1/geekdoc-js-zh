  md: 'mation, its obesity squeezes more valuable code out of view. Remember, the
    real estate on the maintenance programmer''s screen is precious; every part of
    it should count as much as possible, and that means comments have to carry its
    weight.


    The first way we can improve this situation is to note that Perl is unlike many
    procedural languages that require all the variables that are going to be used
    within a block to be declared before any executable code in that block. You can
    put declarations anywhere you want in Perl, as long as they precede all other
    references to their variables. Declare a variable as close as you can get to its
    first use; if you ever remove the use of the variable you''re more likely to be
    the superfluous declaration and remove it, too. An exception to this guideline
    is a constant assignment intended to be configurable. For the sake of convenience,
    these are usually clustered near the top of the code so a casual maintenance programmer
    isn''t tempted to go further into code you''d rather not try to modify.


    Next, see if you can reduce the scope of the variables by putting them inside
    blocks. Look for all the uses of each variable in turn: if they''re bunched in
    a relatively small area, that suggests that you may be able to turn that area
    into a subroutine. Then, identify purely temporary variables. If a variable is
    used only over a few lines of code and isn''t an input or output then it is probably
    a synthetic variable. Either eliminate it using the guidelines in Section 4.8.2,
    or isolate it with a naked block around the area of its use.


    # 6.4 Debugging Strategies


    Imagine you''ve inherited a program, and when you go to run it, it doesn''t work.
    (I know—what are the odds, eh? But let''s pretend.) You need strategies for finding
    and fixing the problems.'
  merge: -1
