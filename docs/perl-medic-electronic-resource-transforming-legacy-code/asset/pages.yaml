    callback is:


    ```

    sub("%7.4f %s\n", @_) for @_

    ```


    suppress_report If true, do not output a report when report() is called; just
    reset the time tick list instead.


    For each suppress_initial or reset_start to be effective, they must be in BEGIN
    blocks before this module is used.


    # METHODS


    Benchmark::TimeTick::timetick($tag) Record the time at this point of the program
    and label it with the string $tag.


    Benchmark::TimeTick::report() Output a report (unless suppress_report is set)
    and reset the time tick list.


    Benchmark::TimeTick::end() Add a final time tick (unless suppress_final is set),
    and output a report. Called by default when the program finishes.


    # OPTIONAL EXPORTS


    Benchmark::TimeTick::timetick() will be exported on demand. This is recommended
    for the sake of brevity.'
