    # 4.2 Why Are You Doing This?


    The goals of rewriting are similar to the goals of developing a program from scratch.
    You must consider these questions: Who are you writing for? How do the demands
    on your rewrite differ differ from the demands placed on the original code?


    # 4.2.1 Who''s the Audience?


    Who is going to see your code? In some environments, code will be inspected by
    people who will not be involved in maintaining it; may not work in the same department,
    or may not even be programmers. Their reactions could nevertheless be influential.
    Determine before you start whether you are in such an environment and find out
    what you can about the reviewers'' tastes. You may be better off coding to a low
    degree of sophistication so not to antagonize reviewers who are unable to understand
    more advanced code constructions.


    Even if you''re fortunate enough not to be incarcerated in a politically distorted
    workplace, you must consider who is going to be maintaining this program. Assuming
    you''re not attempting to obfuscate that no one else can decipher it, if someone
    else is going to assume responsibility for your program you will want to minimize
    the extent to which they have to bug you for help. Therefore, if you know that
    the person is going to be, you should keep the sophistication of your code to
    a level that they can assimilate. (Of course, this strategy has its limits; if
    you create an air traffic control system to be maintained by a recent high school
    graduate, accommodation may not be possible.)


    +   1. If you''re creating an air traffic control system in Perl, please drop
    in a line. Your system is supposed to be maintained by teenagers; please also
    include a map of the areas it serves; rest assured I will put that map to good
    use. (To forest the letters, the system described in [HOAGROOM13] is not used
    in operations.)'
