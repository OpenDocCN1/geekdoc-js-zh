- img_proc: true
  md: '# Richard Clamp''s Module:CoreList (http://search.cpan.org/dist/Module-CoreList/).


    Once you''ve cast an eye over your inherited program source and you have an idea
    of what version of Perl the programmer was coding for, your next step is to upgrade
    the code that can be replaced with more succinct idioms that work in the newer
    version of Perl that you are using. In each section that follows, I''ll tell you
    how might recognize a program written for that version of Perl, and then how you
    can upgrade a program written for an earlier version of Perl to that one. These
    recommendations are cumulative; that is, you can apply the recommendations of
    each section until you reach the one for the version of Perl you''re running.


    # 7.2 Perl 4


    Most easily recognized by the absence of:


    +   * use

    * my

    * =>

    * References

    * Objects

    * :: as a package component separator (instead of '''')

    * POD


    There were many, many other things added in Perl 5—such as BEGIN and END blocks,
    the /x modifier on regular expressions—but the preceding are going to be your
    major markers.


    This code is likely to contain more uses of eval(), do(), local(), and typeglobs
    (*) than you would see in Perl 5 programs.'
