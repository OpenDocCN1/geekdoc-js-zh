  md: '# 3.3 An Example Using Tie:: Modules


    Let''s put what we''ve learned to use in developing an actual application. Say
    that we want to create a module that can limit the possible indices of an array.
    a bounds checker if you will. Perl''s arrays won''t normally do that so we need
    a mechanism that intercepts the day-to-day activities of an array and checks the
    indices being used, throwing an exception if they''re outside a specified range.
    Fortunately, such a mechanism exists in Perl; it''s called tying, and pretty powerful
    it is.


    Because our module will work by letting us tie an array to it, we''ll call it
    Tie::Array::Bounded. We start by letting h2xs do the work of creating a new module:


    ```

    % h2xs -AXn Tie::Array::Bounded

    Writing Tie/Array/Bounded/Bounded.pm

    Writing Tie/Array/Bounded/Makefile

    Writing Tie/Array/Bounded/README

    Writing Tie/Array/Bounded/test.pl

    Writing Tie/Array/Bounded/Changes

    Writing Tie/Array/Bounded/MANIFEST

    ```


    That saved a lot of time! h2xs comes with perl, so you already have it. Don''t
    be put off by the name: h2xs was originally intended for creating perl extensions
    from C header files, a more or less obsolete purpose now, but by dint of copious
    interface, h2xs now enjoys a new lease on life for creating modules. (In Section
    8.2.4, I''ll look at a more modern alternative to h2xs.)


    Don''t be confused by the fact that the file Bounded.pm is in the directory Tie/Array/Bounded.
    It may look like there''s an extra directory in there but the hierarchy that h2xs
    created is really just to help keep your sources straight. Everything you create
    will be in the bottom directory, so we could cd there. For instant gratification
    we can create a Makefile the way we would with any CPAN module:'
