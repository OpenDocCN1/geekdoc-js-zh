  md: "Suppose, however, we want to get at the original command-line arguments after\
    \ this phase. We can't declare a new @ARGV with my; it doesn't belong to us, because\
    \ it's special. No problem: we just override @ARGV like this:\n\n```\nlocal @ARGV\
    \ = @CONFIG_FILES;\nwhile (<|>) {\n  # Do something with $\\_\n}\n```\n\nThe local\
    \ function hides the previous version of @ARGV in a location that will be restored\
    \ on exit from the current scope. The new version it creates is initialized with\
    \ a copy of the array @CONFIG_FILES, which our program earlier set to the list\
    \ of configuration file names. We can then use the diamond operator to read those\
    \ files, safe in the knowledge that we exit the outer block, the original copy\
    \ of @ARGV is restored to its rightful place. “Naked blocks” like the outer block\
    \ in this example are frequently useful for creating a temporary scope.\n\nYou\
    \ can find other variables that don't belong to you in the pervar documentation\
    \ page. However, there are some other variables—package variables—that Perl also\
    \ puts to special use. For instance, if you call a subroutine that doesn't exist,\
