  md: '# 8.2.4 Module Distribution


    When you want to package your own module for distribution, the obvious choice
    today is called ExtUtils::MakeMaker. That’s a core module that’s invoked by h2xs
    to create the Makefile.PL when you first create a new module.


    If, however, you want to do more than what the default Makefile.PL does, you need
    to edit it and insert directives drawn from the ExtUtils::MakeMaker documentation.
    Some people have pointed out lately that this interface is not as easy to use
    as they would like, and they have started developing alternatives:


    +   - Ken Williams Module::Build generates a Build.PL file that can be used to
    build a distribution without a make utility. As time goes by


    +   - However, Module::Build addresses how a user installs a module, not how a
    developer creates one. Geoffrey Avery created an alternative to h2xs in ExtUtils::ModuleMaker(http://search.cpan.org/dist/ExtUtils-ModuleMaker/).
    It even knows how to generate Build.PL files.


    +   - Autrijus Tang’s PAR (Perl ARArchive) can create self-contained executables
    that encapsulate all their dependencies. It employs highly sophisticated code
    to find those dependencies and works on a wide variety of platforms (http://search.cpan.org/dist/PAR).


    Expect that in the next few years these modules will get more attention and more
    widespread use.'
