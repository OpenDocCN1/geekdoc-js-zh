  md: '# 6.2 Cargo Cult Perl


    # 6.2 Cargo Cult Perl


    Perl provides so many ways of solving a problem that it''s not surprising that
    sometimes people pick ways that do work, but are suboptimal for reasons of performance,
    readability, or maintainability. It might sound harsh to characterize something
    that gets the job done as a mistake, but we''re working on being better than just
    "good enough" here.


    During World War II, air crews visited islands in the South Pacific such as Melanesia
    that had seen, if any, white people before. The appearance and vehicles of these
    crews resembled some local legends and were revered as deities. Following their
    departure, islanders emulated the behavior and clothing of them in the hope that
    they would return, building landing strips to encourage their arrival. These ad
    hoc religions were cargo cults because they venerated the cargo left behind.


    Cargo cult code is a pejorative but colorful term given to code that is used without
    the author knowing what it does, but because he or she saw someone doing it and
    assumed it was right for their purpose. Remember, the more you think about your
    programming, the more valuable you will be as a programmer. Be conscious of when
    you make use of code idioms, because the next person to read your code may also
    have seen the advice I am about to give: When you see cargo cult code in the programs
    you are given to maintain, it will help you gauge the experience level of the
    author. This helps you decide how seriously to take code that you cannot understand
    at all.


    In any art, the most advanced practitioners of Perl make their own rules. If you
    know that the code you''re inheriting comes from someone who knew what they were
    doing, the presence of apparent cargo cult code in your program probably did not
    mean they were suffering from premature dementia. They likely had a good reason
    for putting it in.


    Here are some examples of cargo cult code. They range from the harmless redundant
    to the just plain wrong, but all of them are worth looking out for, to make sure
    that you don''t use them unwittingly.'
  merge: -1
