- img_proc: true
  md: '# Chapter 6 • Restructuring (The Operating Table)


    # 6.4.1 Divide and Conquer


    One of the simplest, yet most effective, techniques is to selectively remove much
    of the code as possible until you''ve isolated the cause of an error message.
    If you can get the code down to a screenful, even if you can''t find the problem,
    other people to whom you show the code have a chance of being able to help you.


    If you want to hide code temporarily (perhaps because you''re not sure whether
    it''s being used), then you can insert a line consisting precisely of:


    ```

    __END__

    ```


    (that''s two underscores on each side and no leading or trailing white space)
    in your program, and everything that comes after it will be ignored (actually,
    it''s available for reading via the DATA datafile—make sure there isn''t already
    an __END__ or __DATA__ line in the file). You can shuttle pieces of code in and
    out of that section.


    Usually a syntax error is easy to locate because Perl tells you the line it occurred
    on, or the following line. Sometimes, however, the real culprit can be many lines
    earlier. If you''re trying to locate the source of a really strange error that
    appears caused by bad syntax, you can move an __END__ line up and down the file
    in a binary copy and use perl''s -c run-time flag to do syntax checking only (see
    perln).


    To comment out a block of code in the middle of a file, use POD directives as
    described in Section 4.4.2.


    When you''re making modifications to how the program works, the golden rule to
    remember is this:


    Change only one thing at a time!'
  merge: -1
