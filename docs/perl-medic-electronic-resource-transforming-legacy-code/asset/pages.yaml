    # 11.10 Advanced Modification


    We are done yet? We could rest on our laurels ... but something about this code
    is still unsatisfying. The advanced features we have added obscure what is really
    going on. We should make it easier to understand even at the expense of adding
    a few lines of code.


    This will involve radical surgery. We will abstract as much as possible of the
    specialized LDAP code into its own module. We''ll leave the handling of templates
    and e-mail messages to the program itself. We''ll make our module a convenience
    wrapper around Net::LDAP; it will work like a Net::LDAP object, but with a few
    extra methods. We will combine the constructor and bind() methods into one, which
    we''ll call connect() to avoid confusion with the behavior of the Net::LDAP::new().


    Everything to do with the attributes of an entry will go into this module, which
    we''ll call OzLDAP. Because we still need to know the attributes, we''ll provide
    a method attrs() to get them back, which will double duty: Without any arguments,
    it will return the list of output attributes, but when handed a Net::LDAP::Entry
    object, it will return the list of values for the output attributes of that entry.
    The main program now looks like this:'
