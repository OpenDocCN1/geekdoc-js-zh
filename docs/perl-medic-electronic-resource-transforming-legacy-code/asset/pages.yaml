    # 5.5 Selective Disabling


    As you might have guessed by now, I am in favor of cranking up warnings and stricness
    to their maximum levels. Sometimes, however, it makes sense to silence them because
    you are violating the rules intentionally and you know what you''re doing.


    # 5.5.1 Learn How to Say no


    There''s no need to turn off strictness or warnings altogether just because they
    get in your way. If you can''t make a reasonable adjustment to your code to avoid
    triggering them, disable the part that''s in the way, and only for long enough
    to get the job done. You can do this with the no strict pragma: for example:


    ```

    no strict ''refs'';

    ```


    no is the opposite of use; it disables the specified part of the pragma for its
    lexical scope. All other parts of the pragma remain in force.


