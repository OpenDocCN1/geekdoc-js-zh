  md: '# 2.2 Part or Whole?


    # 2.2 Part or Whole?


    Are you in fact taking over a complete program or a module used by other programs
    (or both?) Let''s see how we can find out.


    # 2.2.1 Shebang-a-Lang-a-Ding-Dong


    You can recognize a Perl program file by the fact that the first two characters
    are:


    ```

    #!

    ```


    and somewhere on the rest of that line the word "perl" appears. Developers call
    the shebang line. It is possible to create a Perl program without the line by
    requiring it to be run explicitly with a command something like


    ```

    % perl program_file_name

    ```


    although it would be strange to receive a main program in this state. Don''t depend
    on the filename ending with an extension .pl or .plx; this is not necessary on
    many systems. A .pl extension is commonplace on Windows systems, where the file
    extension is required to tell the operating system type of the file; aside from
    that .pl extensions were often used as a convention for "Perl Library": files
    containing specialized subroutines. These mostly precede the introduction in Perl
    5 of objects, which provide a better paradigm for code reuse.


    One time when the extension of a file is guaranteed, however, is for a Perl module:
    if the filename ends in .pm, then it''s a module, intended to be used by another
    file that''s the actual program.


    > A Perl program on Windows could get away without this line, because the pl suffix
    is sufficient to identify it as a Perl program, but it is good practice to leave
    the line in on Windows anyway (the path to Perl isn''t important in that case:).'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'Caveat: Sometimes a .pm file may begin with a shebang: this certainly means
    that someone created a module that contains its own tests so that executing the
    module as a program also works. If you see a .pm like this, try running it to
    see what happens. A file that''s not a .pm can be a module, but could still be
    a dependency rather than the main program. If it begins with a shebang, it could
    be a library of subroutine or constant definitions that''s endowed with self-testing
    capabilities. It may not be possible to tell the difference between this type
    of file and the main program without careful inspection or actual execution if
    the developer did not comment the file.


    It is quite possible that you will have to change the shebang line to refer to
    a different perl. The previous owners of the program may have located their perl
    somewhere other than the one you plan to use. If the code consists of a lot of
    files containing that path, here''s how you can change them all at once, assuming
    that /their/path/to/perl is on the original shebang line and /your/path/to/perl
    is the location of your perl:


    ```

    % perl -pi.bak -e \

    ''s#/their/path/to/perl#/your/path/to/perl#g'' *

    ```


    This command puts the original version of each file—before changes were made—in
    a file of the same name with .bak appended to it. If you''ve been using a revision
    control system to store the files in you, you don''t need to make copies like
    that. (I told you that would turn out to be a good decision). Leaving out the
    .bak:


    ```

    % perl -pi -e ''s#/their/path/to/perl#/your/path/to/perl#g'' *

    ```


    results in-place editing: that is, the original files are overwritten with the
    new contents.


    This command assumes all the files to be changed are in the current directory.
    If they are contained in multiple subdirectories, you can combine them with the
    find command like this:'
