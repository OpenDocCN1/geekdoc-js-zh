  md: '# 12.1 In Conclusion


    # 12.1.6 User Groups


    There is a worldwide Perl group society known as the Perl Mongers, based at http://www.pm.org.
    Quite likely there is a group within a reasonable distance of you, and if not,
    you can easily start one, as I did. Publishers and other vendors have special
    deals for Perl Mongers, and there is also a natty line of clothing, pm.org provides
    web servers and mailing lists for groups on demand.


    # 12.1.7 Periodicals


    The periodicals devoted exclusively to Perl are both available online:


    +   * The Perl Journal. http://www.tpj.com/. Monthly PDF download: $12 for a one-year
    subscription.

    * The Perl Review, http://www.theperlreview.com/. Free PDF download: donations
    accepted.


    # 12.1.8 Conferences


    +   * In 1997 the first Perl Conference was produced by O’Reilly and Associates
    in San José, California. In 1999 the rest of the open source world caught up and
    the conference was expanded to include them. Now the annual Open Source Conference
    includes—as its largest component—The Perl Conference, and is held every summer
    on the west coast of North America. See http://conferences.oreillynet.com/oscon.

    * In 1999 some Perl Mongers decided they wanted a low-cost alternative, and held
    the yet Another Perl Conference (YAPC) http://www.yapse.org at Carnegie-Mellon
    University. Since then YAPC has expanded to conferences in Europe (http://www.yapse.org/Europe/),
    and saw the first 2003


    > At the time it was referred to as the "zeroth" Perl Conference because people
    like to start counting from zero. Later on this was recognized to be too confusing
    and the conference was retroactively renumbered to one.'
