  md: '# Chapter 2 • Surveying the Scene


    That''s quite likely will happen with the preceding one-liner, and the reason
    is the use lib statement in the source. Like warnings and strict, lib is a prisma,
    meaning it''s a module that affects the behavior of the Perl compiler. In this
    case it was used to add the directory /opt/lib/perl @INC, the list of directories
    perl searches for modules in. Seeing that in a program you need to point indicates
    that it uses modules that are not part of the core. It could mean, as it did here,
    that it is pointing toward a non-core Perl module (WWW::Mechanize) that is nevertheless
    maintained by someone else and downloaded from CPAN. Or it could indicate the
    location of private modules that were written by the developers of the program
    you are porting. Find out which case applies: Look on CPAN for any missing modules.
    The easiest way to do this is to go to http://search.cpan.org/ and enter the name
    of each missing module, telling the search engine to search in “modules”.


    So if we want to write a one-liner that searches the same module directories as
    the original code, we would have to use Perl''s - I flag:


    ```

    perl -Mstrict -Mwarings -I/opt/lib/perl -MW::Mechanize -e 0

    ```


    In the new environment you''re porting the program to, there may not be a /opt/lib/perl;
    there may be another location you should install third-party modules to. If possible,
    install CPAN modules where CPAN.pm wants to put them: that is, in the @INC site-specific
    directory. (Local business policies might prevent this, in which case you put
    them where local policy specifies and insert use lib statements pointing to that
    location in your programs.)


    If you find a missing module on CPAN, you can see if the version that is used
