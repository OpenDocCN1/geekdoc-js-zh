    This may occupy more space, but it has three important benefits:


    +   - It attaches a meaning to the value being passed (make the variable or constant
    name as descriptive as possible).

    - It allows you to identify multiple uses of the same thing as opposed to multiple
    unrelated occurrences of (coincidentally) the same value.

    - It puts all the kinds of values that maintenance programmers are likely to change
    in one place where they can change them without having to wade through code you''d
    rather didn''t change.


    These advantages are so key (and applicable to every programming language), you''d
    wonder why anyone would not follow this rule. Unfortunately, many people do not,
    and not editing one of the first things you can do is replace "magic numbers"
    with symbolic names.


    There are cases in which this would be overkill. For instance, subroutine calls
    with named parameters already tell you what the purpose of a value is:


