- img_proc: true
  md: '+   • www.perl.org: The community’s portal to all things Perl; useful as a
    “Perl Home Page.",


    +   • www.perldoc.com: Easy interface to every piece of documentation that came
    with the current and previous versions of the Perl core back to 5.004.


    +   • jobs.perl.org: Worth calling out explicitly from among the many perl.org
    specialized sites, this one is for people looking for work and people looking
    for workers.


    +   • learn.perl.org: Also worth noting explicitly, this site is designed to help
    people learn Perl.


    +   • www.stonehenge.com/merlyn/columns.html: Randal Schwartz has written hundreds
    of articles for magazine columns and placed them online here: this site is a treasure
