    Unfortunately, seeing tr in the company of ~= so often leads some people to believe
    that it is an operator that regular expressions, so they write code like this:


    ```

    tr/[a-z]/[A-Z]/; # Don''t use this

    ```


    thinking that they are employing character classes that will uppercase text. By
    coincidence, they get the result they wanted, without realizing that this code
    means, “Turn left square brackets into left square brackets, turn lowercase letters
    to uppercase letters, and turn right square brackets into right square brackets.”
    They have made an incorrect assumption that will lead them into trouble when they
    try something different with tr:


    Find out how tr is really used, see perlop.


    Likewise, because the second argument of the substitution operator s/// is so
    close to the first one, people sometimes put regular expression syntax there.
    This can be benign:


    ```

    s/.txt\b/\.doc/g # Superfluous backslash

    ```


    or malignant:


    ```

    s/.txt\b/\.doc\b/g # Superfluous backslash and backspace

    ```


    The second argument—or right side, if you like—of s/// is treated as a double-quoted
    string, which obeys different syntax rules from a regular expression.


