  md: 'Now suppose that an object in one of the leaf classes generates a logging message.
    Log::Log4perl allows you to attach zero or more appenders to each class; an appender
    is an object that is told to send log messages to a particular destination, such
    as a file or an e-mail recipient. Each appender is also configured to fire at
    a particular severity level, one of a series such as: DEBUG, INFO, WARNING, ERROR,
    FATAL. So if we had attached appenders at the leaf class and its ancestors, the
    message would percolate up through the class hierarchy of Log::Log4perl per, but
    only activating those appenders that were registered for the severity level of
    that message (or a lower level).


    The activated appenders are denoted in bold in Figure 10.2.


    ![](img/43be69d751687f7aa9629237341c05bb_257_0.png)


