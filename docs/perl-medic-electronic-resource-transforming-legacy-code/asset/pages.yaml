    =head1 NAME sort profile data from Devel::SmallProf


    =head1 SYNOPSIS smallprofpp [B-<c>|B-<w>] [profile]


    =head1 DESCRIPTION


    The Ismallprofpp command sorts and outputs the named file (default C<.small.out>)
    produced by Devel::SmallProf. Page headings are removed and only one header line
    will be printed; no lines will be printed for source code lines that were never
    called (you can prevent Devel::SmallProf from outputting them in the first place
    with the statement


    ```

    $DB::drop_zeros = 1

    ```


    which may be placed in a C<.smallprof> file; see Devel::SmallProf). Lines will
    be sorted in descending order of either cpu time or wall clock time; ties will
    be sorted by the other time.


    =head1 OPTIONS


    =over 4


    +   * item B-<c>


    Sort first by cpu time, second by wall clock time.


    +   * item B-<w>


    Sort first by wall clock time, second by cpu time. This is the default.


    =back


    =head1 SEE ALSO


    L<Devel::SmallProf>.'
