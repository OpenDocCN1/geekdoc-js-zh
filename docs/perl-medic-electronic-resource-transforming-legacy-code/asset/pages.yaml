    # 8.3 Socket.pm and IO::Socket


    Socket programming in Perl has been simple since 1995, when Graham Barr''s Socket.pm
    module hit the archives, and even simpler since 1996, when his IO::Socket module
    came out. Instead of using constants from a .ph file and using pack() and unpack().
    with Socket.pm you can easily get, say, the IP address of a machine from its name:


    ```

    $ perl -Mstrict -MWarnings -MSocket -1

    my $addr = gethostbyname("www.perlmedic.com")

    or die "Lookup failed";

    print inet_ntoa($addr);

    D

    204.95.83.7

    ```


    IO::Socket—and in particular, IO::Socket::INET—provide object-oriented packaging
    for sockets that make client/server programming a snap.


    For a comprehensive treatment of just what you can do with IO::Socket, see [STEIN00].'
