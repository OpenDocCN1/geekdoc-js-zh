  md: '# 8.3.4 HTML Parsing


    Thousands of people want to parse HTML because they believe that''s the only way
    to get at the result of some kind of operation they want to perform. Unfortunately,
    they''re usually right. Face it, if what you want to know is, say, your bank balance,
    then just about the most annoying way you could think of finding it out would
    be submit several sets of inputs gleaned from successive HTML forms, finally parsing
    the quantity out of a morass of tags whose layout changes every other week. It
    would be much nicer if the bank provided you with an application interface (API)
    like this:


    ```

    $balance = get_balance($account, $PIN);

    ```


    although, yes, it would be more likely to work like this:


    ```

    $acct = BankAccount->new($username, $PIN) or die ...;

    $balance = $acct->balance($account);

    ```


    but we''re still dreaming: banks don''t. One day banks might become enlightened
    enough to provide SOAP interfaces, or at least some kind of XML API, but until
    then people like me who want to automate this task face some kind of HTML parsing.


    You may not be accessing an online banking service, but that doesn''t make any
    difference to the ease or difficulty of the task of parsing HTML. So find out
    of all whether the creator of the pages you need to parse them in a more palatable
    format. RSS, for instance, may be available for content resembling new stories.¹¹⁰
    If you are the creator of the HTML pages, don''t force yourself to parse the HTML
    to extract content when you could provide an interface to that content some other
    way.


    If you''re stuck with no alternative but to parse HTML, you''re in good company.
    So don''t reinvent the wheel when so many people have constructed entire fleets
    of articulated trucks before you.


    > ⁰ RSS stands for RDF Site Summary: RDF stands for Resource Description Framework.'
