    # 10.5 Version Control System Integration


    If you’re using Revision Control System (RCS), you might like to have the RCS
    version number automatically be used as the version number of your code. The package
    variable $VERSION should be set in a module because various tools will look for
    it. However, you can’t just say:


    ```

    $VERSION = ''$Revision$'';

    ```


    because version numbers need to be numeric. What you need is an expression that
    incorporates the RCS Revision keyword and returns the numeric component of it.
    Here’s one possibility:


    ```

    $VERSION = (qw$Revision: 3.42 $) [-1]

    ```


    which cunningly uses the RCS $ keyword delimiter as the delimiter for the qw operator,
    extracting just the number 3.42 from the second space-separated component.


    If you prefer more than two components to your version numbers, the Utils::MakeMaker
    documentation shows an alternative approach:


    ```

    $VERSION = do { my @ = (g$Revision: 1.2.3 $ = /\d+/g); \ sprintf("%d".%03d" x
    $hr, @r);

    ```


    For MakeMaker to recognize this as a $VERSION assignment, all that must be on
    one line.'
