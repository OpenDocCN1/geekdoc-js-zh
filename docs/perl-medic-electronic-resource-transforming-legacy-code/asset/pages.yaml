    \ The easiest way of overriding a subroutine is just to define it again:\n\n```\n\
    # Adjusting from Celsius for USA-centric users\nsub temperature\n{\n    my $self\
    \ = shift;\n    return ($self->{temperature} + 40) * 9 / 5 - 40;\n}\n```\n\nBut\
