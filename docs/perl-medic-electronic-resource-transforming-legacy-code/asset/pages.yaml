    major modules to add significant functionality.


    Level 10: Takes part in Perl obfuscation and "golf" contests., writing a single
    regular expression using embedded code to implement a function that most other
    people would have needed to write an entire program for; submit patches to the
    Perl core, contribute new modules, or become a well-known name within the Perl
    community.


