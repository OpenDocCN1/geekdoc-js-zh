- img_proc: true
  md: 'The source file you want is called stable.tar.gz. The file devel.tar.gz is
    for Perl developers or testers only, and the file latest.tar.gz is the same as
    stable.tar.gz for complex historical reasons. Anything mentioning “Ponie” will
    be for developers only through 2004 at least, and any perl with a three-number
    version with an odd middle number is likewise a development version.


    Building Perl from source on a supported UNIX architecture requires these commands
    after you download and unpack the right file:


    ```

    /Configure

    make

    test

    make install

    ```


    The Configure step asks you zillions of questions, and most people won’t have
    a clue what many of those questions are talking about; but the default answers
    Configure recommends are usually correct.


    www.cpan.org is the master Comprehensive Perl Archive Network (CPAN) site, mirrored
    around the world. CPAN is also the official repository of contributed modules
    (see Section 8.1).


    # Historical Perl


    You’re probably not used to seeing instructions on how to obtain an out-of-date
    version of Perl. But you just might have to do that under some circumstances that
    will be explored later in this book. (Note: The older the version of Perl, the
    less the references I am about to give will enjoy substantial longevity.) The
    timeline for all releases of Perl is in the perlist documentation page.


    +   - If you want to let Configure use those recommendations and go on without
    asking you, you can give it the options - and it’ll churn away happily without
    your intervention. If you need more platform-specific help, look in the distribution
    for the README file corresponding to your system.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'You can get all major versions starting with 5.004_05 from ftp://ftp.cpan.org/pub/CPAN/src/5.0/.
    Earlier versions of Perl 5 (with the exception of 5.004_04, which was widely used)
    exhibited significant bugs, memory leaks, and security holes and are harder to
    find. However, you can get what looks like every version of Perl ever released
    at http://retperl.cpan/. Using a perl version 5.0053 is not an activity to be
    taken lightly. You will not receive bug fixes or any other support beyond a terse
    admonition to leave the Stone Age and upgrade to a real version. I am revealing
    this source for cases in which you must use an old perl to verify operation of
    a legacy program that does not work on a modern perl. If you must get a perl 4
    from there, the last and best version of Perl 4 is 4.0.36.


    Retroperl even includes versions 1.0, 1.010, 2.0, 2.001, 3.01. To call these of
    historical interest only would be an understatement. If you think you need to
    get one of these perls for any serious work you may be in need of an archaeologist
    or a therapist. As an example of nonsensical work, however, in 2002 Michael Schwarn
    and others released an upgrade to Perl 1 (bringing it to version 1.0_15) as a
    birthday present to Perl and Larry Wall, to show that it could still work on modern
    machines. See http://dev.perl.org/


    Historical versions of modules are under http://backpan.cpan.org/modules/, but
    you''ll have to go down the authors branch to find what you want.


    # Who This Book Is For


    If you''ve been working with Perl long enough to have heard terms like scalar,
    array, and hash, then you''re in the right place. Parts of this book are aimed
    at early beginners and some parts require more experience to comprehend. Feel
    free to skip past anything that''s over your head and come back to it at a later
    date.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Typographical Conventions


    I use the following conventions in this book:


    +   * Standard text: Times New Roman

    * Code examples and URLs: *Courier*

    * User input: **Bold Courier***


    Sometimes my code examples have line breaks where none existed in the original.
    In places where these line breaks would cause problems or aren''t obvious, I''ve
    put a backslash (\) at the end of the line to indicate that the line should be
    joined with the next one.


    When I want to show that I typed an end-of-file character in a terminal session,
    I show it as a Control-D on its own line:


    ^D


    even though those characters will normally be overwritten by the next thing to
    be printed. Substitute whatever the driver on your operating system uses if not
    a Control-D (e.g., Control-Z, Return on Windows).


    When referring to Perl modules, I will often add ".pm" to the end of one-module
    names to follow common practice and avoid confusion, but leave out of module names
    with multiple components because that is the convention. For example, CGI.pm,
    IO::Socket.


    Citations are referenced by a square in brackets, for example, [SCOTT01], and
    the details are given in the Bibliography near the end of the book.


    I reference many pages that are part of the standard documentation that comes
    with every Perl: you can type *perdoc* followed by the page name and it will display.
    I show these in italics: for instance, *perlsub* is the page containing information
    about subroutines in Perl.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Preface


    # For Further Reference


    Visit this book''s Web site at http://www.perlmedic.com.


    Get introductions to Perl programming from the following:


    +   * [SCHWARTZ01]

    * [WALL00]

    * [CHAPMAN98]

    * [JOHNSON99]

    * [HALL98]


    # Perl Versions


    In this book, I refer to the latest "stable" version of Perl, which is 5.8.3 as
    of this writing. The vast majority of what I say works unaltered on older versions
    of Perl 5, but not Perl 4. If you use any version of Perl older than 5.004_04,
    you should upgrade for reasons unconnected with features: 5.003 had issued issues
    such as security problems and memory leaks. You can find out the version of your
    perl by passing it the -v flag:


    ```

    % perl -v

    This is perl, v5.8.3 built for i586-linux

    Copyright 1987-2003, Larry Wall

    [...]

    ```


    Perl won''t execute a script named on the command line if the -v flag is present.
    A more detailed description of your perl''s configuration can be obtained with
    the -V flag; if you use the perl program that comes with perl to issue a bug report,
    it automatically includes this information in your report.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Preface


    A separate development track exists for Perl: you will know if you have one of
    those versions because the release number either contains an underscore followed
    by a number of 50 or larger or contains an odd number between two dots. Nothing
    is guaranteed to work in such a distribution; it''s intended for testing. If you
    find you have one and didn''t want it, the person downloaded your perl probably
    visited the wrong FTP link. This happens more often than most people would think;
    take a moment to check your perl if you''re not sure.


    # Perl 6


    If you spent much time in the Perl universe, you''ve heard about Perl 6. I won''t
    be covering how to port programs to Perl 6 for a very logical reason: it doesn''t
    exist yet.


    A stable version of Perl 6 is still a few years away. When it emerges, it will
    bear approximately the resemblance to Perl 5 that a Lamborghini Countach does
    to a Volkswagen Beetle (well, the new one, anyway). (Which is to say, backward
    compatibility has been prioritized beneath new capability for the first time in
    Perl development.)


    Don''t panic. Perl 4 hung around for an indecent time after Perl 5 came out and
    Perl 5 will be ported, maintained, and improved for many years after Perl 6 emerges.
    The recently started Ponie'' project (http://www.poniecode.org) will enable Perl
    5 to run on top of the Parrot engine underlying Perl 6. Your Perl 5 programs will
    quite likely keeping as long as you do.


    This book will be applicable in large measure to Perl 6 in any case; most of the
    Perl 6 magic involves not removing existing features, but adding cool ones. If
    you want to find out more about Perl 6 anyway, see [RANDAL03].


    +   3. Except for development versions that test some of the features that have
    been decided on recently.

    2. Ponie stands for Perl On New Implementation Engine (even though it isn''t capitalized).'
