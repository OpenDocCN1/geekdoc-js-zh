    # 5.5.5 Redirecting Errors and Warnings


    There are some warnings you don’t want the user to see in detail, though; they
    might reveal too much about your code. This is even more true of fatal exceptions,
    which often incorporate (via the croak () or confess ()) functions of the Carp
    module) details of function calls and their arguments. The worst environment for
    that to happen is in a public web site whose users are not normally entitled to
    read program source code and whose number could lurk unsavory characters to whom
    you’d rather not allow your database password to be exposed.


    Rand Schwartz addressed this in a Linux Magazine column with a module called FatalEmail,
    designed to send the text of fatal exceptions in e-mail to the developer while
    leaving the user with a nonscript apology.


    Here’s my version, a module called EmailErrors designed to fulfill a similar purpose,
    but with a few key differences. It allows exceptions to propagate normally if
    the code is running in an eval block, or if it’s being run at the command line
    instead of via the web. It handles warnings as though they were exceptions. However,
    you’ll have to insert some code to handle your specific use of the module where
    indicated by “##":


    # Example 5.1 EmailErrors Module


    ```

    package EmailErrors;

    use strict;

    use warnings;

    ```


    +   6 http://www.stonehenge.com/perlyn/LinuxMax0114.html'
