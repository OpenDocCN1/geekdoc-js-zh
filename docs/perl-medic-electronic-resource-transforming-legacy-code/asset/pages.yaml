  md: '# Chapter 1 - Introduction (First Response)


    # 1.5 Get Personal


    Use any personal knowledge that you have of the developer, or find out you can
    ask about how they program. Are they inclined to test and be thorough, or do they
    frequently make mistakes and goof off? If you don''t know anything about them,
    don''t assume they knew what they were doing and then puzzle endlessly over a
    strange fragment of code. That code might be irrelevant or just wrong, and left
    in for no reason. Knowing the habits and level of sophistication of the developer
    will be invaluable in deciphering the program.


    Knowing something about the programming background of the developer could also
    be helpful. If they have, for instance, much experience in C but little in Perl,
    their Perl programs may look like C code. Don''t spend a lot of time puzzling
    over why they have neglected efficient mechanisms as list returns from functions
    or hashes when the cause is quite probably that they have discovered that they
    can program Perl "just like C" (or Java, bash, or...)


    # 1.6 Strictness


    The most common cause for grief in inheriting a Perl program is the absence of
    these two magic lines from the beginning of every file:


    ```

    use warnings;

    use strict;

    ```


    If the program contains a -w on the # line, that counts the same as a use warnings
    in the main program and every module that it uses. Because the use warnings pragma
    is a relatively recent addition to Perl (version 5.6.0 or later) you''re more
    likely to find the -w flag in inherited programs.


    Why these lines are not the default for Perl programs has been the source of much
    contention between certain people in the Perl community, including me. But they
    aren''t the default, so we''re stuck with the situation. Omitting'
  merge: -1
