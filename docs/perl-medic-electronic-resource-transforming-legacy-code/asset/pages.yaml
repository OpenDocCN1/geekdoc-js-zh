    # 4.9.4 Calling Too Many External Programs


    A programmer who has migrated to Perl programming from shell scripting is used
    to calling external programs to just about everything. Text manipulation in shell
    programs is accomplished through carefully combining the uses of sed, awk, head,
    grep, cut, sort, and other programs. If a Perl programmer level 6 or lower calls
    these programs then they are probably unnecessary, whereas a programmer of higher
    level 6 expertise might explain what they are doing (see the next section).


    Text manipulation is far easier to do in Perl than by calling external programs:
    You only have one language to learn, the code is portable to systems that don''t
    have those programs, and it is likely to be much faster because of avoiding process
    creation and intern communication overhead. Furthermore, the code is likely to
    be much briefer and clearer in Perl.


    Perl was written to be familiar to shell programmers and users of common filters:
    often you can take a call to an external program and turn it into Perl without
    any change to the substantive code. So for instance, instead of:


    ```

    open OUT, "/tmp/_sed";nprint OUT map "$\n", @entries;

    close OUT;

    system "sed -e ''s/apples/oranges/g'' /tmp/sedin > /tmp/sedout";

    ```'
