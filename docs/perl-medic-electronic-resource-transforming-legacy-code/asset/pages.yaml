  md: '# 3.2 Extreme Testing


    What''s this about laziness? Isn''t that a pejorative way to describe luminaries
    of the Perl universe?


    Actually, no; they''d take it as a compliment. Larry Wall enumerated three principal
    virtues of Perl programmers:


    +   1. Laziness: “Hard work” sounds, well, hard. If you''re faced with a mindless,
    repetitive task—such as running for public office—then laziness will make you
    balk at doing the same thing over and again. Instead of stifling your creative
    spirit, you''ll cultivate it by inventing a process that automates the repetitive
    task. If the Karate Kid had been a Perl programmer, he''d have abstracted the
    common factor from “wax on” and “wax off” shortly before fetching an orbital buffer.
    (Only to get, er, waxed, in the tournament from being out of shape. But I digress.)


    +   2. Impatience: There’s more than work to do in this business. By being impatient
    to get the next thing quickly, you''ll spend unnecessary time on the task you''re
    doing; you''ll find ways to make it as efficient as possible.


    +   3. Hubris: It''s not good enough to be lazy and impatient if you''re going
    to take them as an excuse to do lousy work. You need an unreasonable amount of
    pride in your abilities to carry you past the many causes for discouragement.
    If you didn''t, thought about all the things that could go wrong with your code,
    you''d either never get out of bed in the morning, or just quit and take up potato
    farming.


    So what are these magic modules that facilitate?


    # 3.2.1 The Test Module


    Test.pm was added in version 5.004 of Perl. By the time Perl 5.6.1 was released
    it was superseded by the Test::Simple module, which was published to CPAN and
    included in the Perl 5.8.0 core. Use Test::Simple instead.'
