- img_proc: true
  md: '# 10.3.1 Invasion of the POD People


    Realizing that documentation is (a) painful and/or boring for programmers to write,
    and (b) essential for programmers to read, Larry Wall created a system to make
    it as easy as possible to create documentation. The system is prosaically called
    Plain Old Documentation (POD).


    The first convenience of POD is that you can embed it right in the code it''s
    describing; it''s just a chunk of text marked off by special lines. You can choose
    to put the POD anywhere you want; any of the styles shown in Table 10-1 are acceptable
    and in common usage.


    # TABLE 10-1 POD Intersersion Styles


    | Code Before POD | POD Before Code | POD Within Code |

    |---|---|---|

    | Code | POD | Code |

    | Code | POD | POD |

    | Code | POD | Code |

    | Code or __END__ | POD | POD |

    | POD | Code | POD |

    | POD | Code | Code |

    | POD | Code | POD |


    So you programmer can either put the POD all at the beginning, or all at the end,
    if you think the code is more important. A small optimization is available to
    you in the latter case: you can put the POD after a line consisting precisely
    of the text __END__ and when pernl runs your program, it will stop compiling when
    it sees that line: so even the short time required to recognize and ignore POD
    will not be used.


    The last style is "in line," and this is for when you want the documentation for
    each function to be embedded right next to that function. Obviously you could
    even carry it further and interperse POD at smaller granularities, but bear in
    mind that anything that increases the amount of space a function requires to be
    viewed in an editor will make the code harder to read.'
  merge: -1
  pgno: 263
