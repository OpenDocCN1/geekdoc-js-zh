  md: '# Chapter 12 • Conclusion Prognosis


    YAPC in Israel (http://www.perl.org.il/YAPC/) and the first truly Canadian YAPC
    (http://www.yapc.ca/). The home page of the original North American YAPC is http://www.yapc.org/America/.


    # 12.1.9 The Perl Foundation


    The nonprofit organization called Yet Another Society (YAS; http://www.yetanother.org/)
    promotes, among other projects, the YAPC events. A YAS affiliate is the Perl Foundation
    (http://www.perl-foundation.org/), which exists to collect donations and fund
    worthy projects. Current and past benefactors include Larry Wall and Damian Conway.
    If you''re looking to donate money to advancing the progress of Perl, this is
    the place to send it.


    # 12.2 Perl People


    One of the key qualities of Perl people is how much fun they have with the language.
    I think this is a synergistic and symbiotic relationship between the language
    and those people; they create a language that is fun to use, which attracts people
    who like to have fun and they put more fun into the language. (Don''t think this
    means the language isn''t suited to serious, important work. Perl people believe
    that you can get more work done by having fun at the same time. Here''s hoping
    that more managers will catch on that idea.) Attending a Perl conference is a
    direct way of finding out what Perl people are like.


    # 12.2.1 How to Ask Questions That Get Answered


    Perl people, like any computer experts, thrive on accurate and complete information.
    (They they have to be able to think like a computer works.) They also enjoy helping
    other people. The best way you can ensure that they answer your question is to
    make it possible and easy for them to do so. Questions that are vague'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'about what is wanted or don''t supply information to figure out an answer frustrate
    the people who are reading them, because they are unable to help. They also see
    that help as a collaboration between themselves and the questioner; when answering
    questions for free, they want to promote a “pay it forward” model whereby the
    questioner becomes empowered to help others himself or herself. That goal is frustrated
    if the questioner doesn''t appear will- to make an equal effort to learn.


    Knowing these things about Perl people allows us to craft questions that get answered.
    (Here I am talking only posting to the various online resources previously listed
    free help; if you are paying a Perl consultant for help you''re entitled to get
    it under whatever terms you agree upon.) Follow these principles:


    +   - Sound coherent. This does not mean that postings by people who are not fluent
    in the language they are posting in disparaged; I have seen many postings in halting
    English that were perfectly clear about their intention. You need to sound like
    you have enough intelligence to understand the answer, and your words are the
    only guide readers for making that evaluation. You must distinguish yourself from
    the legions of people posting on the Internet who for all intents and purposes
    sound like infants who have discovered their parents'' keyboard.


    +   - Be clear what you want. Do you want someone to write a piece of code for
    you, to tell you what''s wrong with something you''ve written, or to explain a
    concept to you?


    +   - Be humble. Or at least appear that way. Show that you understand anyone
    helping you is doing it out of generosity; don''t get the impression that you
    believe you''re entitled to an answer.


    +   - Be clear about what happened. If you experienced a problem, report what
    you did, what the computer''s response was, and what you expected it should have
    have been. Don''t make assumptions about what the cause was unless you really
    know, in which case you''re not assuming.'
