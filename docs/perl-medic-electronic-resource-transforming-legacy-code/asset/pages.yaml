  md: '# 4.2.3 What Are the Requirements?


    Before rewriting, you must find out how the requirements for the code have changed
    since the original program was developed. Don''t assume that all you have to do
    is reproduce the functionality unless you''veve verified that. You may need to
    optimize the code for different goals; perhaps you''re expected to improve its
    readability, performance, or portability, or to extend its functionality.


    An important question to ask the original developer is what, if anything, the
    code was optimized for. For instance, there may be complicated constructions in
    it that you would simplify if you didn''t know that they''re required for acceptable
    performance.


    # 4.3 Style


    In [SCOTT01], Ed Wright and I said, “The only believable comment to make about
    style is that you should have one.” I''ll go further than that here. Just as in
    clothing, having a consistent style doesn''t necessarily mean other people won''t
    laugh at you. So, to prevent you from accidentally picking a coding style that''s
    equivalent to a 1970s-era pool hustler, here is a suggested style that''s rather
    more conservative.


    Of course, some people intentionally dress like pool sharks and may take umbrage
    at this disparagement of their sartorial tastes. By all means stick with this
    idiosyncratic style if you''ve arrived at through conscious decision and can live
    with the consequences. This section is for everyone else. Like many parts of this
    book, it incorporates a certain amount of personal taste that is one of a number
    of ways of getting a job done well; I''m not holding it up as the “One True Way.”


    You can find comments on style in the perlstyle documentation page that comes
    with Perl, parts of which are reflected here.'
