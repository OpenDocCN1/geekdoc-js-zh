  md: '# Chapter 4 • Rewriting (Transplants)


    use constant MAX_CONNECTIONS => 5;

    ...

    if ($conns++ < MAX_CONNECTIONS) ...


    It has some advantages:


    +   - You cannot overwrite the value assigned to the symbol. (Well- not easily:
    The constant is actually a prototyped to accept no arguments. It could be redefined,
    but you wouldn''t that by accident).

    - The use of a constant is (usually) optimized by the Perl compiler so that its
    value is directly inserted without the overhead of a sub-routine call.

    - The symbols look constant-ish; identifiers beginning with a sigil ($, @, %)
    tend to make us think they are mutable.


    It also has some disadvantages:


    +   - Constants are visually indistinguishable from filehandles.

    - A constant can''t be used on the left-hand side of a fat arrow (=>) because
    it turns it into a string. You have to put empty paren-heses after the constant
    to ensure Perl parses it as a sub-routine call.

    - The same is true of using a constant as a hash key.

    - Constants do not interpolate into double-quoted strings, unless you use the
    hair-raising @{[CONSTANT_GOES_HERE]} construction.

    - Being subroutines, they are package-based and cannot be con-ined to a lexical
    scope; but they go out of scope when you have a new package statement (unless
    you fully qualify their names).'
