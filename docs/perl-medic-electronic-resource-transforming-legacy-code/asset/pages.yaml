    ```


    And that''s just for a simple scalar. When you discover functionality that maps
    onto a hash, for instance, you can make seriously succinct code. The most common
    tied interface for a hash is a database that stores the contents of the hash and
    makes them persistent. I was implementing a program once that had to store a lot
    of entries in a hash: eventually overtaxed the virtual resources of the machine
    I had. In a classic trade-off of memory for speed, I could have hunted down every
    access to the hash and replaced it with a call to a database library''s fetch()
    or store() method. But that''s more work than I like to do, and fortunately others
    had been quite lazy before me and encapsulated the fruits of their laziness in
    a series of modules for tying hashes to databases. All I had to do was add one:


    ```

    use DB_File;

    ```


    and change the declaration of the hash from:


    ```

    my %data;

    ```


    to:


    ```

    tie %data, ''DB_File'', $database, ...

    ```


    (where the ... arguments specified the file to use as a database and related information).
    and I had no need to change any other code. Thereafter, every access to the hash
    behaved just as it did before, only it took a bit longer but didn''t use up memory.
    In the bargain I persistence, meaning that I could recover the values from a previous
    run, enabling functionality such as checkpoint/restart. The one caveat to remember
    when using databases to tie hashes is not to use any hash operation that returns
    a list from the whole hash if the hash is very large, because that reads the list
    from the database into memory, thus defeating one of the purposes of tying the
    hash to begin with. What this is'
