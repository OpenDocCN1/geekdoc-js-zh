- img_proc: true
  md: '# 9.1 Static Analysis


    You''d like to know more about the program you''re working on. But it''s long
    and boring that reading it all is likely to cause premature senescence. Fortunately
    lately there are some tools that can help you get a handle on your morass of Perl
    source code.


    If you''re looking for an interactive development environment (IDE) for Perl,
    the bad news is that there aren''t many; not nearly as many as as for languages
    Java and C++ . One very good reason for this is that static analysis of Perl is
    rather unsatisfying if you''re an IDE developer because so much of the environment
    of a Perl program is not determined until run time (late binding). Considering
    that Perl programs can not only create subroutines at run time, import new classes
    and even modify the inheritance hierarchy while they are running, it''s not surprising
    that IDE developers don''t find Perl attractive. A class browser would have to
    be capable of updating itself at run in order to be reliably accurate, and that
    implies a positively incestuous relationship between the IDE and the Perl run-time
    system. Most Perl IDEs consist of bundling a syntax highlighting editor, an interface
    to the Perl debugger, and perhaps a browser for Perl documentation. Getting really
    good at an IDE like vi or emacs can let you switch between multiple buffers and
    shell command modes quickly is what you''ll find most of the top developers doing.


    The good news is that large projects can be developed in Perl without the need
    for an IDE.. as long as the programmers agree to use the same layout style and
    code to a particular level of sophistication (see Section 4.2.2). If you want
    an IDE, there are a number of free ones and a very capable commercial tool called
    Visual Perl from ActiveState Corporation (see Figure 9.1).'
  merge: -1
