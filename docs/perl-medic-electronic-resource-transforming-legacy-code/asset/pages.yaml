  md: '# 2.2 Part or Whole?


    ```

    % find -type f -print | xargs perl -pi -e \

    s#/their/path/to/perl#/your/path/to/perl#g''

    ```


    Of course, you can use this command for globally changing other strings

    besides the path to the perl, and you might have frequent occasion to do so. Put
    the

    command in the alias, like so:


    ```

    % alias gchange "find -type f -print | xargs \

    perl -pi.bak -e ''\\1''''

    ```


    the syntax of which may vary depending on which shell you are using. Then

    You can invoke it thus:


    ```

    % gchange s,/their/path/to/perl,/your/path/to/perl,g

    ```


    Note that I changed the substitution delimiter as a # to a , ; A shell might

    take the # as a comment-introducing character. Because you might be using

    alias to change pieces of code containing characters like $ and ! that can

    have special meaning to your shell. learn about how your shell does quoting

    and character escaping so you''ll prepared to handle those situations.


    Note also that I put the .bak file. Because otherwise one day, you''ll forget

    to check the files into your version control system first, because the alias isn''t

    called something like gchange_with_no_backups.


    If you want to develop this concept further, consider turning the alias into a

    script that checks each file before altering it.


