  md: '# Chapter 4 • Rewriting (Transplants)


    In the absence of more specific information, the most likely maintenance programmer
    for your program is, of course, yourself. Strange as it might seem at this point,
    many—if not most—programmers, in some subconscious fit of masochism, still code
    in a way that causes needless pain for themselves later on. You know who you are.


    If you don''t know who''s going to take over your code, the question arises: What
    level of sophistication should you code to? There is much debating on this topic,
    and more than a few rancorous opinions. I believe you should code to your own
    level, and not try to satisfy the preferences of a purely hypothetical maintenance
    programmer. There abounds absurd notion that there is an objective “best standard”
    to code for maintenance, and people fritter away endless hours arguing a construction
    such as:


    ```

    $new = $old ~ s/old/new;

    ```


    fits this standard.² or whether it is clearer to the hypothetical maintainer to
    rewrite it as:


    ```

    $new = $old;

    $new = s/old/new/;

    ```


    If you’re going to be the maintenance programmer, the only concern that need affect
    you is you will be able to understand the code. That is best determined by how
    long it took you to write it. If you write quickly, it is more likely to be readable
    than something that takes hours of sweating and testing to get right.


    If those hours are spent constructing a fiendish compact brand-new idiom, the
    odds are you will spend even longer trying to figure out when you come across
    it six months later. Leave it for now and use more obvious code instead: if in
    some future programming effort the new idiom occurs to you without hours of toil,
    then you’ve hit on something useful; but more likely, you will be glad you resisted
    the temptation to use it.


    > ² Tom Christensen dubbed this en passant method of setting a variable to a transformation
    of an expression.'
