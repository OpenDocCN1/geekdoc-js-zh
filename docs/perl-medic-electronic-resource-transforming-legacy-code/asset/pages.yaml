    # 12.5 Chat Channels


    Just about any Internet Relay Chat (IRC) network, #perl will be populated by Perl
    people and usually also purl, a “bot” or program (the appropriate term is agent)
    capable of answering various questions, learning from the conversation, and interjecting
    ad hoc comments. If you’re wondering what language it’s written in, you haven’t
    been paying attention.'
