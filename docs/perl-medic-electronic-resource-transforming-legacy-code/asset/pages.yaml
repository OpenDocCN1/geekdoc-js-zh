  md: '# 5.1 Package Variables vs. Lexical Variables


    Other package variables that are also useful to Perl include: $VERSION (version
    number of current package), @ISA (classes we inherit from), and @EXPORT and similar
    variables used by the Export module.


    # 5.1.2 With a Little Help from our Friends


    Perl 5.6.0 introduced our function, which makes life easier when you want to work
    with package variables. It is equivalent to use vars in that it allows you to
    refer to variables in the current package without fully qualifying them, but unlike
    use vars, it is lexically scoped so its variable names aren''t valid in your program
    long after you are done with them. (Yes, it is a little weird to speak of a declaration
    of package variables being lexically scoped. Just remember that the “lexical”
    part refers to the scope over which you can refer to the variable by its unqualified
    name, even though the value of variable is globally visible.) use vars, on the
    other hand, is file scoped.


    Take for our earlier AUTOLOAD function. It was a nuisance to have hard-code our
    package name in there (not that we couldn''t have gotten around it with __PACKAGE
    and a symbolic reference, mind). With our, we don''t need to:


    ```

    sub $AUTOLOAD {

    our $AUTOLOAD; # Now I can just say $AUTOLOAD

    my $method = $AUTOLOAD; # Copy to private variable

    $method =~ s/...;// # Strip off package

    # Now the name of the subroutine being called is in $method

    }

    ```


    # 5.1.3 Lexical vs. Dynamic Scoping


    Why are variables declared with my called lexical variables? Because that describes
    their scope. If you open a Perl program in an editor, start selecting text from
    the statement following a my declaration, and highlight code until the end of
    the enclosing block (or the end of file, if that comes first), everything you''ve
    highlighted is the scope of the variable in the declaration. Subroutines'
