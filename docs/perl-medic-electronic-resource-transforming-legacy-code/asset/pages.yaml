    # 8.2 Using CPAN


    You can of course download tarballs (compressed archives of file trees created
    with the tar program) of modules from CPAN and build them manually. I''ll show
    you how to do that shortly. But first, I''ll show you the easy way.


    # 8.2.1 Using CPAN.pm


    Perl makes it phenomenally easy to install all modules by providing a handy layer
    of automation for talking to CPAN right in the code. That layer is implemented
    by—you guessed it—a module, amazingly enough called CPAN.pm.


    Installing a new module with CPAN.pm is extremely easy, especially if you are
    the system administrator or otherwise have write access to the directories in
    perl''s @INC where it wants to install new modules. To install a module called,
    say Mac::iTunes, just type:


    ```

    perl -CPAN -e ''install Mac::iTunes''

    ```


    What launches CPAN.pm into the realm of superstardom is that it can detect and
    install dependencies; when the module you are installing requires other modules
    to work (and Mac::iTunes requires a bunch), but you don''t already have them.
    The module author properly listed those prerequisite modules (and the Mac::iTunes
    author did), CPAN.pm will install those modules; and if any of them have unrequired
    prerequisites, CPAN will install them, and so forth. If a module in this dependency
    chain did not specify its prerequisite


    > 5 In Perl 5.10 CPAN.pm will be superseded by a module called CPANPLUS pm, which
    you can currently find on CPAN. CPANPLUS pm will provide a cleaner interface for
    using CPAN. As of this writing it is somewhat leading edge, so I am not covering
    it here, but free to experiment with it.'
