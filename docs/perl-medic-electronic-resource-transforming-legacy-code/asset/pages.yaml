  md: '# Chapter 6 • Restructuring (The Operating Table)


    # 6.2.3 Superfluous Use of scalar ()


    There is no point in using the scalar () function if the context is already scalar.
    Understanding list and scalar contexts is crucial to being a good Perl programmer,
    and the canonical reference work [WALL00] does not mince words: “You will be miserable
    until you learn the difference between scalar and list context” (p. 69).


    Therefore you have to wonder how someone who wrote this:


    ```

    if (scalar @items) { ... }

    ```


    understood context. Clearly the code is intended to execute the following block
    if there is anything in the @items array. But the condition of an if statement
    is already in scalar context.¹ It couldn''t be otherwise; the condition has to
    be evaluated by whether it''s true or false; both of alternatives are single values
    (i.e., scalars).


    Even more bloat code is like this:


    ```

    $ $n_values = scalar(values %hash);

    ```


    Assigning anything to a scalar will put the expression in scalar context anyway,
    so the scalar () is superfluous.


    Understanding context will make a world of difference in. for example, how you
    use use regular expressions in conditions. Can you tell the difference between
    the following two constructs?


    +   - 1. while (/(\w+)\s+(\d+)/g) { ... }

    - 2. foreach (//(\w+)\s+(\d+)/g) { ... }'
