- img_proc: true
  md: '# 8.1 The Case for CPAN


    # 8.1.1 Yes, Virginia, There Is a Code Repository


    The first concern is easily handled. There is a repository of contributed code;
    it is called the Comprehensive Perl Archive Network, or CPAN: and it is as easy
    to reach you as you can imagine. It is replicated on hundreds of computers around
    the world for your convenience, far more than even really necessary these days
    (the mirroring structure was set up when networks were less reliable, band-width
    much smaller, and machines less powerful). The upshot of this is that under any
    circumstances short of World War III, at least part of CPAN will be accessible
    to you at all times if you can reach any reasonable chunk of the Internet. Elaine
    Ashton''s all-encompassing FAQ also makes entertaining reading (http://www.cpan.org/misc/cpan-faq.html).
    See Section 8.1.3 for more information on how to use CPAN.


    # 8.1.2 Trusting CPAN


    How much can you trust code from CPAN? The bad news is that it is true that there
    is little quality control over CPAN: Anyone can upload any code they want: the
    only central controls are on the apportionment of the module namespace. There
    is a testing group (see http://testers.cpan.org/), but they just test that a module
    passes its own tests on as many different platforms and configurations as they
    can. Technically, someone could place malicious code on CPAN.


    The good news is that this has not yet happened. Every CPAN distribution has a
    corresponding checksum (generated automatically by the server when the distribution
    is uploaded) stored on CPAN so that when you download code you can compare the
    checksum with what it is supposed to be. (CPAN.pm does this automatically. See
    Section 8.2.1.)


    The reliability of code on CPAN is a separate issue, but still not a pressing
    concern. I have found the modules I have tested to be of very high quality, but


    +   2. You can also reach the test results for any module via cpan.org. if you
    navigate to the root of a module''s distribution, then click on the ''CPAN Testers''
    link. See Figure 8.4'
