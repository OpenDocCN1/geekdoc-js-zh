  md: '# 4.2 Why Are You Doing This?


    (Writing something quickly doesn''t guarantee that it''ll make sense in a larger
    context later on, though. only that you''ll understand the syntax. In other words,
    you may not be able to see the forest for the trees, but at least each tree will
    be somewhat familiar.)


    If, on the other hand, you spend hours developing a small piece of code that doesn''t
    have any apparently clearer representation, you have code that needs commenting.
    You understand it right now because of all the auxiliary notes that you take,
    the tests that you ran (which should be rolled into your testing scripts), the
    articles or texts that you read, and some complex analysis that you performed,
    none of which appear in the code. If you needed supporting material to create
    the code, you''ll need it to understand it, so put it in comments. Later I''ll
    show you how you can insert lengthier information that can be extracted into nicely
    formatted documents.


    # 4.2.2 The Ten Levels of Perl Programmers


    Several years ago, Tom Christians created a somewhat tongue-in-cheek list of different
    levels of Perl programming sophistication [CHRISTIANSEN98]. With an eye toward
    classifying maintenance programmers, here''s mine. Later on this book. I''ll occasionally
    refer to one of these levels when I want to indicate the degree of sophistication
    of some code or technique. It can be helpful to assess at what level the author
    of a program you are tasked with maintaining was.


    +   Level 1: Haven''t read any book (or anything else for that matter) on Perl;
    knows it''s a programming language but knows nothing else about it. Can run a
    Perl program written by someone else and realizes they can change parts of the
    behavior—such as the content of printed strings—by editing parts of the program.
    Doesn''t understand why changes to other parts of the program don''t work; has
    no mental model to fit the language in, so can''t differentiate the syntax from
    languages diverse as COBOL or C++.'
