  md: 'You may be unfamiliar with some of the command-line flags used in this chapter,
    but they’re very useful. Here’s a brief overview:


    +   - -c Compile once. Useful for syntax checking; if you have been making extensive
    modifications to a program and you know it''s bound to have syntax errors, you
    can find out what they are without risking the program running. Code in BEGIN
    or CHECK blocks will be run, because their purpose is to facilitate the compilation
    of later code during this phase. In particular, this means that code in modules
    will be used run.

    - -e Execute CODE as Perl instead of reading the program from a file. This switch
    allows you to make “one-liners” of Perl code without having to create a file to
    put that code in. Very handy for testing constructions you''re unsure of or aliasing
    short shortcuts so you don''t have to create a new file in /bin.

    - -MODULE Equivalent to putting “use MODULE” at the beginning of the code to be
    executed. To pass arguments to the import (), add them after an = Thus “-Mstrict-subs”
    and “-Mstrict-subs,vars” is equivalent to “use strict qw(subs), use strict qw(vars)"

    - -I DIRECTORY Equivalent to “use lib DIRECTORY"

    - -1 Automatically append a newline to the arguments of all print (but not printf)
    statements. This also removes trailing newlines when the -n or -p switches are
    used to wrap an input loop around code.


    For more details on these switches, see the perlrun manual page.


    A handy way of executing a few lines of Perl without having to put them in a file
    is to feed them to the standard input of perl from the command line. I''ve shown
    this here by terminating the input with the usual end of input character for UNIX
    shells, control D (^D). What follows after that point is the output of the program.
    You can''t edit lines you''ve already entered, so this is of limited use, but
    I use it here as a convenient way of demonstrating code.'
