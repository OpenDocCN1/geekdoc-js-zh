  md: '# Appendix: Source Code


    +   -item suppress_initial


    If true, do not put an initial entry in the report when the module is loaded.


    +   -item suppress_final


    If true, do not put a final entry in the report when the program terminates.


    +   -item reset_start


    If true, report all times relative to the time that C<Benchmark::Time_Tick> was
    loaded rather than the actual start of the program.


    +   -item format_tick_tag


    If set, should be a reference to a subroutine that will take as input C$tag> passed
    to C<timetext()> and return the actual tag to be used. Can be helpful for applying
    a lengthy transformation to every tag while keeping the code short.


    +   -item format_report


    If set, should be a reference to a subroutine that will take as input a list of
    time ticks for reporting. Each list element will be a reference to an array containing
    the time and the tag respectively. The default C<format_report> callback is:


    ```

    sub { printf("%.4f %s\n", $_) }

    ```


    +   -item suppress_report


    If true, do not output a report when C<report()> is called; just reset the tick
    list instead.


    +   -back


    For either C<suppress_initial> or C<reset_start> to be effective, they must be
    set in C<BEGIN> blocks before this module is C<use>.


    +   -headl METHODS


    +   -over 4


    +   -item Benchmark::TimeTick::timetext($$)'
