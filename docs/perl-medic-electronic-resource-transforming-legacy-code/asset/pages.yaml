  md: 'Concurrent Versions System (CVS) uses the same keywords. Source Code

    Control Systems (SCCS) is used far less frequently than either RCS or CVS,

    but it would be trivial to do version numbering with it:


    ```

    our $VERSION = "%I%";

    ```


    Note the quotation marks: Perl has allowed v-strings for several versions

    numbers that contain more than one period; they get turned into a binary

    form), but they were deprecated for versions of Perl after 5.8.1, so I conserva-

    tively stringified the version.


    Because Subversion''s version keyword is $Rev: $, you can just reuse the

