  - "[PAGE 41]\n\n# Discussion\n\nAngular's filter function expects a filter name\
    \ and a function as params. The function must return the actual filter function,\
    \ where you implement the business logic. In this example it will only have an\
    \ input param. The result will be returned after the for loop reversed the input.\n\
    \n# Passing Configuration Params to Filters\n\n# Problem\n\nYou want to make your\
    \ filter customizable by introducing config params.\n\n# Solution\n\nAngular filters\
    \ can be passed a hash of params ng-app=\"MyApp\"> that can be directly accessed\
    \ in the filter function.\n\n```\n<body> ng-app=\"MyApp\">\n<input type=\"text\"\
    \ ng-model=\"text\" placeholder=\"Enter text\"/>\n<p>Input: {{ text }}</p>\n<p>Filtered\
    \ input: {{ text | reverse: { suffix: \"!\" } }}</p>\n</body>\n\nvar app = angular.module(\"\
    MyApp\", []);\n\napp.filter(\"reverse\", function() {\n  return function(input,\
    \ options) {\n    input = input || \"\";\n    var result = \"\";\n    var suffix\
    \ = options[\"suffix\"] || \"\";\n\n    for (var i=0; i<input.length; i++) {\n\
    \      result = input.charAt(i) + result;\n    }\n\n    if (input.length > 0)\
    \ result += suffix;\n\n    return result;\n  }\n});\n```"
  - "[PAGE 42]\n\nYou can find the complete example on github³.\n\n# Discussion\n\n\
    The suffix ! is passed as an option to the filter function and is appended to\
    \ the output. Note, we check if an actual input exists since we don't want to\
    \ render the suffix without any input.\n\n# Filtering a List of DOM Nodes\n\n\
    # Problem\n\nYou want to filter a ul list of names.\n\n# Solution\n\nAngular filters\
    \ not only work with Strings as input but also with Arrays.\n\n```\n<body ng-app=\"\
    MyApp\">\n<ul ng-init=\"names = ['Peter', 'Anton', 'John']\">\n  <li ng-repeat=\"\
    name in names | exclude:Peter \">\n    <span>{{name}}</span>\n  </li>\n</ul>\n\
    </body>\n\nvar app = angular.module(\"MyApp\", []);\n\napp.filter(\"exclude\"\
    , function function(input, exclude) {\n  var result = [];\n  for (var i=0; i<input.length;\
    \ i++) {\n    if (input[i] !== exclude) {\n      result.push(input[i]);\n    }\n\
    \  }\n  return result;\n});\n```\n\n> ³https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter4/recipe3"
  - '[PAGE 43]


    We pass Peter as the single param to exclude filter which will render all names
    except Peter.

    You can find the complete example on github38.


    # Discussion


    The filter implementation loops through all names and creates a result array excluding
    ''Peter''. Note, that the actual syntax of the filter function didn''t change
    at all from our previous example with the String input.


    # Chaining Filters together


    # Problem


    You want to combine several filters to a single result.


    # Solution


    Filters can be chained using the UNIX-like syntax.


    ```

    <body> ng-app="MyApp">

    <ul ng-init="names = [''Peter'', ''Anton'', ''John'']">

    <li ng-repeat="name in names | exclude:''Peter'' | sortAscending">

    <span>{{name}}</span>

    </li>

    </ul>

    </body>

    ```


    # Discussion


    The pipe symbol (|) is used to chain multiple filters together. First we start
    with the initial Array of names. After applying the exclude filter the Array contains
    only [''Anton'', ''John ''] and afterwards we sort the names in ascending order.


    I leave the implementation of the sortAscending filter as an exercise to the reader
    :-


    > 38https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter4/recipe'
  - "[PAGE 44]\n\n# Testing Filters\n\n# Problem\n\nYou want to test your new filter.\
    \ Let us start with an easy filter which renders a checkmark depending on a boolean\
    \ value.\n\n```\n<body ng-init=\"data = true\">\n  <p>{{ data | checkmark }}</p>\n\
    \  <p>{{ !data | checkmark }}</p>\n</body>\n\nvar app = angular.module(\"MyApp\"\
    , []);\n\napp.filter('checkmark', function () {\n  return function(input) {\n\
    \    return input ? '\\u2713' : '\\u2718';\n  };\n});\n\n```\n\n# Solution\n\n\
    Use the angular-seed project as a bootstrap.\n\n```\ndescribe('MyApp Tabs', function()\
    \ {\n  beforeEach(module('MyApp'));\n\n  describe('checkmark', function() {\n\
    \    it('should convert boolean values to unicode checkmark or cross',\n     \
    \ inject(function(checkmarkFilter) {\n        expect(checkmarkFilter(true)).toBe('\\\
    u2713');\n        expect(checkmarkFilter(false)).toBe('\\u2718');\n      });\n\
    \    ));\n  });\n});\n```\n\n# Discussion\n\nThe beforeEach loads the module and\
    \ the it methods inject the filter function for us. Note, that it has to be called\
    \ checkmarkFilter, otherwise Angular can't inject your filter function correctly."
  - "[PAGE 45]\n\n# Consuming Externals Services\n\nAngular has built-level support\
    \ for communication with remote HTTP servers. The $http* service handles low-level\
    \ AJAX requests via the browser's XMLHttpRequest object or via JSONP. The $resource*\
    \ service lets you interact with RESTful data sources and provides high-level\
    \ behaviors that naturally map to RESTful resources.\n\n# Requesting JSON Data\
    \ with AJAX\n\n# Problem\n\nYou want to fetch JSON data via AJAX request and render\
    \ it.\n\n# Solution\n\nImplement a controller using the $http service to fetch\
    \ the data and store it in the scope.\n\n```\n<body ng-app=\"MyApp\">\n<div ng-controller=\"\
    PostsCtrl\">\n  <ul ng-repeat=\"post in posts\">\n    <li>{{post.title}}</li>\n\
    \  </ul>\n</div>\n</body>\n\nvar app = angular.module(\"MyApp\", []);\napp.controller(\"\
    PostsCtrl\", function($scope, $http) {\n  $http.get('data/posts.json',\n    success(function(data,\
    \ status, headers, config) {\n      $scope.posts = data;\n    }),\n    error(function(data,\
    \ status, headers, config) {\n      // log error\n    });\n});\n```\n\n> *http://docs.angular.org/api/ng/$http\n\
