    \ deferred 对象：\n\n```javascript\nfunction deferredTimer(success) {\n  var deferred\
    \ = $.defer();\n\n  $timeout(function() {\n    if (success) {\n      deferred.resolve({\
    \ message: \"This is great!\" });\n    } else {\n      deferred.reject({ message:\
    \ \"Really bad\" });\n    }\n  }, 1000);\n\n  return deferred.promise;\n}\n```\n\
    \n我们的 `deferredTimer` 函数将获取一个 success 参数并传递给 deferred。`then` 方法期望一个成功回调和一个错误回调作为参数，我们使用它们来设置作用域变量\
    \ `deferredResult` 以显示结果。\n\n这个 `deferredTimer` 可以通过将其封装在作用域上的函数在 HTML 模板中触发：\n\
    \n```javascript\n$scope.deferredTimer = function(success) {\n  deferredTimer(success).then(\n\
    \    function(data) {\n      $scope.deferredResult = \"Successfully finished:\
    \ \" + data.message;\n    },\n    function(data) {\n      $scope.deferredResult\
    \ = \"Failed: \" + data.message;\n    }\n  );\n};\n```\n\n### 测试服务\n\n### 问题\n\
    \n你想测试消费 JSON API 的控制器和服务。\n\n让我们再次看一眼我们想要测试的示例：\n\n```javascript\nvar app = angular.module(\"\
    MyApp\", [\"ngResource\"]);\n\n.factory(\"TwitterAPI\", function($resource) {\n\
    \  return $resource(\"http://search.twitter.com/search.json\",\n    callback:\
    \ \"JSON_CALLBACK\",\n    get: { method: \"JSONP\" });\n  });\n});\n\napp.controller(\"\
    MyCtrl\", function($scope, TwitterAPI) {\n  $scope.search = function() {\n   \
    \ $scope.searchResult = TwitterAPI.get({ q: $scope.searchTerm });\n  };\n});\n\
    ```\n\n这只是你如何简化代码的一个示例，但在深入研究 Kris Kowal 的 Q 实现时，你可以发现更多示例。\n\n> ³https://github.com/kriskowal/q\n\
    \n"
