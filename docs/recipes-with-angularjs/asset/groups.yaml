  - "[PAGE 81]\n\n# Discussion\n\nWhen you select the next/previous page you will\
    \ change the $scope.currentPage value and the $watch function is triggered. It\
    \ fetches fresh items for the current page and the total number of items, on the\
    \ client side we only have 5 items available as defined in itemsPerPage and when\
    \ paginating we throw away the items of the previous page and fetch new items.\n\
    \nIf you want to try this with a real backend you only have to swap out the Item\
    \ service implementation.\n\n# Paginating Using Infinite Results\n\n# Problem\n\
    \nYou want to paginate through server-side data with a “Load More” button which\
    \ keeps appending more data until no more data is available.\n\n# Solution\n\n\
    Lets first look at how the table is rendered with the ng-repeat Directive.\n\n\
