    \n### 问题\n\n你想在网页上使用 Angular.js。\n\n### 解决方案\n\n为了让你的第一个 Angular.js 应用运行，你需要通过\
    \ script 标签包含 Angular Javascript，并使用 `ng-app` 指令。\n\n```html\n<html\n<head>\n\
    <script src=\"http://ajax.googleapis.com/libs/ajax/angularjs/1.0.4/angular.js\"\
    ></script>\n</head>\n<body ng-app>\n<p>这是你的第一个 angular 表达式：{{ 1 + 2 }}</p>\n</body>\n\
    </html>\n```\n\n> Tip 提示：你可以在 github 上查看完整的示例。\n\n### ### 讨论\n\n添加 `ng-app` 指令告诉\
    \ Angular 启动它的魔法。表达式 `{{ 1 + 2 }}` 由 Angular 求值，并渲染结果 3。注意，移除 `ng-app` 将导致浏览器将表达式渲染为文本而不是对其进行求值。尝试一下表达式吧！例如，你可以拼接字符串或反转布尔值。\n\
    \n出于简洁起考虑，我们在后续的配方中省略了样板代码。\n\n# 将文本输入绑定到表达式\n\n### 问题\n\n你想让用户输入的内容被用于 HTML 页面的其他部分。\n\
    \n### 解决方案\n\n使用 Angular 的 `ng-model` 指令将文本输入绑定到表达式。\n\n```html\n输入你的名字：<input\
    \ type=\"text\" ng-model=\"name\"></input>\n<p>你好 {{name}}!</p>\n```\n\n你可以在 github\
    \ 上找到完整的示例。\n\n### 讨论\n\n将 \"name\" 赋值给 `ng-model` 属性并在表达式中使用 name 变量将使两者自动保持同步。在文本输入中输入内容将自动反映这些更改到段落元素中。\n\
    \n考虑你将如何传统地使用 jQuery 实现这一点：\n\n```html\n<html\n<head>\n  <script src=\"http://code.jquery.com/jquery.min.js\"\
    ></script>\n</head>\n<body>\n  输入你的名字：<input type=\"text\"></input>\n  <p id=\"\
    name\"></p>\n<script>\n  $(document).ready(function() {\n    $(\"input\").keypress(function()\
    \ {\n      $(\"name\").text($(this).val()));\n    });\n  });\n</script>\n</body>\n\
    </html>\n```\n\n# Angular.js 简介\n\n在文档准备就绪时，我们在文本输入中绑定了按键事件，并在回调函数中替换段落中的文本。使用\
    \ jQuery，你需要处理文档就绪的回调。\n\n# 使用控制器响应点击事件\n\n### 问题\n\n你想在点击时隐藏一个 HTML 元素。\n\n###\
    \ 解决方案\n\n使用 `ng-hide` 指令配合控制器在点击时隐藏。\n\n```html\n<html\n<head>\n<script src=\"\
    js/angular.js\"></script>\n<script src=\"js/app.js\"></script>\n<link rel=\"stylesheet\"\
    \ href=\"bootstrap.css\">\n</head>\n<body ng-controller=\"MyCtrl\">\n  <button\
    \ ng-click=\"toggle()\">切换</button>\n  <p ng-show=\"visible\">你好</p>\n</body>\n\
    </html>\n```\n\n在 js/app.js 中：\n\n```javascript\nvar app = angular.module(\"MyApp\"\
    , []);\n\napp.controller(\"MyCtrl\", function($scope) {\n  $scope.visible = true;\n\
    \n  $scope.toggle = function() {\n    $scope.visible = !$scope.visible;\n  }\n\
    });\n```\n\n# 输出转换\n\n### 问题\n\n向用户展示数据时，你可能需要将数据转换为更友好的格式。在我们的案例中，我们需要对名称进行大写转换。\n\
    \n### 解决方案\n\n使用 `uppercase` 过滤器。\n\n```html\n输入你的名字：<input type=\"text\" ng-model=\"\
    name\"></input>\n<p>你好 {{name | uppercase}}</p>\n```\n\n你可以在 github 上找到完整的示例。\n\
    \n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter1/recipe4\n\
    \n# Angular.js \n\n### 讨论\n\nAngular 使用 `|`（管道）字符将过滤器与变量组合。在求值时，name 变量被传递给过滤器。这与\
    \ Unix 管道类似，输入可以被转换。\n\n# 使用指令创建 HTML 元素\n\n### 问题\n\n你想渲染一个 HTML 代码段但根据条件隐藏它。\n\
    \n### 解决方案\n\n创建一个自定义指令来渲染你的代码段。\n\n```html\n<body ng-app=\"MyApp\">\n  <label\
    \ for=\"checkbox\">\n    <input id=\"checkbox\" type=\"checkbox\" ng-model=\"\
    visible\">切换我\n  </label>\n  <div show=\"visible\">\n    <p>你好世界</p>\n  </div>\n\
    </body>\n```\n\n`show` 属性是指令，实现如下：\n\n```javascript\nvar app = angular.module(\"\
    MyApp\", []);\n\napp.directive(\"show\", function() {\n  return {\n    link: function(scope,\
    \ element, attributes) {\n      scope.$watch(attributes.show, function(value)\
    \ {\n        element.css('display', value ? '' : 'none');\n      });\n    }\n\
    \  };\n});\n```\n\n# Angular.js \n\n### 讨论\n\n我们先忽略应用模块的创建，稍后章节会深入探讨。在我们的示例中，它只是创建指令的方法。注意，`show`\
    \ 字符串是指令名称，对应于模板中使用的 `show` 属性。\n\n浏览器只有在复选框被勾选时才会显示“你好世界”段落，否则隐藏。\n\n你可以在 github\
    \ 上找到完整的示例。\n\n这只是通过指令可以实现的功能的一小部分，有一个专门的章节对它们进行更详细的讨论。\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter1/recipe5\n\
    \n"
