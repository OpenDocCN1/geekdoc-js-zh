    You can find the complete example on github⁶⁹.


    # Discussion


    The CSS classes ensure that we initially show the fresh form without any classes.
    When the user starts typing in input for the first time, we change it to either
    green or red. That is a good example usage of ng-dirty and ng-invalid CSS classes.


    We use the same logic in the ng-show directive to only show the error message
    when the user starts typing for the first time.


    # Displaying Form Validation Errors with the Twitter Bootstrap framework


    # Problem


    You want to display form validation errors but the form is styled using Twitter
    Bootstrap⁷⁰.


    # Solution


    When using the .horizontal-form class Twitter Bootstrap uses div elements to structure
    label, input fields and help messages into groups. The group div has the class
    control-group and the actual controls are further nested in another div element
    with the CSS class controls. Twitter Bootstrap shows a nice validation status
    when adding the CSS error on the div with the control-group class.


