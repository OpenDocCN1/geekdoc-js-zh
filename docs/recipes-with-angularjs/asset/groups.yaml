    \ $locationProvider) {\n  $locationProvider.html5Mode(true);\n  $routeProvider\n\
    \    .when(\"/contacts\",\n      { templateUrl: \"{{asset_path('contacts/index.html')}}\"\
    ,\n        controller: ContactsIndexCtrl\n    })\n    .when(\"/contacts/new\"\
    ,\n      { templateUrl: \"{{asset_path('contacts/edit.html')}}\",\n        controller:\
    \ ContactsEditCtrl\n    })\n    .when(\"/contacts/:id\",\n      { templateUrl:\
    \ \"{{asset_path('contacts/show.html')}}\",\n        controller: ContactsShowCtrl\n\
    \    })\n    .when(\"/contacts/:id/edit\",\n      { templateUrl: \"{{asset_path('contacts/edit.html')}}\"\
    ,\n        controller: ContactsEditCtrl\n    })\n    .otherwise({redirectTo: \"\
    /contacts\"});\n});\n```\n\nWe set the $locationProvider to use the HTML5 mode\
    \ and define our client-side routes for listing, showing, and creating new contacts.\
    \ You can find the complete example on github.\n\n> *http://guides.rubyonrails.org/routing.html#route-globbing\n\
    > *https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter9/recipe1\n\
    \n## Backend Integration with Ruby on Rails\n\n### Discussion\n\nLet us have a\
    \ look into the route definition again. First of all filename ends with erb, since\
    \ it uses ERB tags in the javascript file, courtesy of the Rails Asset Pipeline.\
    \ The asset_path method is used to retrieve the URL to the HTML particles since\
    \ it will change depending on the environment. On production the filename contains\
    \ an MD5 checksum and the actual ERB output will change from /assets/contacts/index.html\
    \ to /assets/contacts/index-7ce11b9b081a20d93a486e1aacce05f.html. If your Rails\
    \ app is configured to use an asset path the will be in fact absolute.\n\n## Validating\
    \ Forms Server-Side\n\n### Problem\n\nYou want to validate forms using a server-side\
    \ REST API provided by Rails.\n\n### Solution\n\nRails already provide model validation\
    \ support out of the box for us. Let us start with the Contact ActiveRecord model.\n\
    \n```ruby\nclass Contact < ActiveRecord::Base\n  attr_accessible :age, :firstname,\
    \ :lastname\n\n  validates :age, :numericity => {\n    :only_integer => true,\
    \ :less_than_or_equal_to => 50\n  }\nend\n```\n\nIt defines a validation on the\
    \ age attribute. It must be an integer and less or equal to 50 years.\n\nIn the\
    \ ContactsController we can use to make sure the REST API returns proper error\
    \ messages. As an example we look into the create action.\n\n## Backend Integration\
    \ with Ruby on Rails\n\n```ruby\nclass ContactsController < ApplicationController\n\
    \  respond_to :json\n\n  def create\n    @contact = Contact.new(params[:contact])\n\
    \    if @contact.save\n      render json: @contact, status: :created, location:\
    \ @contact\n    else\n      render json: @contact.errors, status: :unprocessable_entity\n\
    \    end\n  end\nend\n```\n\nOn success it will render the contact model using\
    \ a JSON presentation and on failure it will return all validation errors transformed\
    \ to JSON. Let us have a look at an example JSON response:\n\n```json\n{ \"age\"\
    : {\"must be less than or equal to 50\"} }\n```\n\nIt is a hash with an entry\
    \ for each attribute with validation errors. The value is an array of Strings\
    \ since there might be multiple errors at the same time.\n\nLet us move to the\
    \ client-side of our application. The Angular.js contact $resource calls the create\
    \ function and passes the failure callback function.\n\n```javascript\nContact.create($scope.contact,\
    \ success, failure);\n\nfunction failure(response) {\n  each(response.data, function(errors,\
    \ key) {\n    each(errors, function(e) {\n      $scope.form[key].dirty = true;\n\
    \      $scope.form[key].setValidity(e, false);\n    });\n  });\n}\n```\n\nNote,\
    \ ActiveRecord attributes can have multiple validations defined. The failure function\
    \ iterates through each validation entry and each error uses $setValidity and\
    \ $dirty to mark the form fields as invalid.\n\nNow we are ready to show some\
    \ feedback to our users using the same approach discussed already in the forms\
    \ chapter.\n\n## Backend Integration with Ruby on Rails\n\n```html\n1 <div class=\"\
    control-group\" ng-class=\"errorClass('age')\">\n2   <label class=\"control-label\"\
    \ for=\"age\">Age</label>\n3   <div class=\"controls\">\n4     <input ng-model=\"\
    contact.age\" type=\"text\" name=\"age\"\n5       placeholder=\"Age\" required>\n\
    6     <span class=\"help-block\"\n7       ng-show=\"form.age.$invalid && form.age.$dirty\"\
    >\n8       {{errorMessage('age')}}\n9     </span>\n10  </div>\n11 </div>\n```\n\
    \nThe errorClass function adds the error CSS class if the form is invalid and\
    \ dirty. This will render the input, and the help block with a red color.\n\n\
    ```javascript\n1 $scope.errorClass = function(name) {\n2   var s = $scope.form[name];\n\
    3   return s.$invalid && s.$dirty ? \"error\" : \"\";\n4 };\n```\n\nThe errorMessage\
    \ will print a more detailed error message and is defined in the same controller.\n\
    \n```javascript\n1 $scope.errorMessage = function(name) {\n2   result = [];\n\
    3   _each($scope.form[name].$error, function(key, value) {\n4     result.push(value);\n\
    5   });\n6   return result.join(\", \");\n7 };\n```\n\nIt iterates over each error\
    \ message and creates a comma separated string out of it.\nYou can find the complete\
    \ example on github.\n\n## Backend Integration with Ruby on Rails\n\n### Discussion\n\
    \nLastly, the errorMessage handling is of course pretty primitive. The errorMessage\
    \ handling is of course pretty primitive. A user would expect localized message\
    \ instead of this technical presentation. The examples used in this chapter are\
    \ based on Contacts to manage list.\n\n> ⁹https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter9/recipe1\n\
    > ¹⁰http://guides.rubyonrails.org/i18n.html#translations-for-active-models\n\n\
    ## Backend Integration with Node Express\n\nIn this chapter we will have a look\
    \ into combining Angular.js with the Node.js framework. As an extra use MongoDB\
    \ as a backend for contacts.\n\n## Consuming REST APIs\n\n### Problem\n\nYou want\
    \ to consume a JSON API implemented in Rails.\n\n### Solution\n\nUsing the $resource\
    \ service we first define our model and all RESTful actions.\n\n```javascript\n\
    app.factory(\"Contact\", function($resource) {\n  return $resource(\"/api/contacts/:id\"\
    , { id: \"_id\" },\n{\n    'create': { method: 'POST' },\n    'index': { method:\
    \ 'GET', isArray: true },\n    'show': { method: 'GET', isArray: false },\n  \
    \  'update': { method: 'PUT' },\n    'destroy': { method: 'DELETE' }\n  }\n});\n\
    ```\n\nWe can now fetch a list of contacts using Contact.index() and a single\
    \ contact with Contact.show(id). These actions can be directly mapped to the API\
    \ routes in app.js.\n\n## Backend Integration with Node Express\n\n```javascript\n\
    var express = require('express');\napi = require('./routes/api');\nvar app = module.exports\
    \ = express();\napp.get('/api/contacts', api.contacts);\napp.get('/api/contacts/id',\
    \ api.contact);\napp.post('/api/contacts', api.createContact);\napp.put('/api/contacts/id',\
    \ api.updateContact);\napp.delete('/api/contacts/id', api.destroyContact);\n```\n\
    \nI like to keep routes in a separate file routes/api.js and just reference them\
    \ in app.js in order to keep it small. The API implementation initializes them\
    \ with Mongoose library and defines a schema for our Contact model.\n\n```javascript\n\
    var mongoose = require('mongoose');\nmongoose.connect('mongodb://localhost/contacts_database');\n\
    var contactsSchema = mongoose.Schema({\n  firstname: 'string', lastname: 'string',\
    \ age: 'number'\n});\nvar Contact = mongoose.model('Contact', contactsSchema);\n\
    ```\n\nWe can now use the Contact model to implement the API. Lets start with\
    \ the index action:\n\n```javascript\nexports.contacts = function(req, res) {\n\
    \  Contact.find({}, function(err, obj) {\n    res.json(obj)\n  });\n};\n```\n\n\
    Skipping the error handling we retrieve all contacts with the find function provided\
    \ by Mongoose and render the result in the JSON format. The show action is pretty\
    \ similar except it uses findOne and the id from the URL parameter to retrieve\
    \ a single contact.\n\n> http://mongoosejs.com/\n"
  mdcn: "\n\n## 与 Ruby on Rails 的后端集成\n\n```ruby\nContacts :Application.routes.draw\
    \ do\n  root :to => \"layouts@index\"\n  match \"*path\" => \"layouts@index\"\n\
    end\n```\n\n它使用了路由通配（Route Globbing）来匹配所有 URL 并定义了根 URL。两者都将由一个布局控制器处理，其唯一目的是渲染初始页面。\n\
    \n```ruby\nclass LayoutsController < ApplicationController\n  def index\n    render\
    \ \"layouts/application\"\n  end\nend\n```\n\n实际的模板定义了 `ng-view` 指令并位于 `app/views/layouts/application.html`\
