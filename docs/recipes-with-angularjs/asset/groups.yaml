    \ since there be a current user globally available.\n\n> 65https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter6/recipe6\n\
    \n> 66http://docs.angular.org/api/angular.Module"
  - "[PAGE 64]\n\n# # Using Forms\n\nEvery website eventually uses some kind of form\
    \ for users to enter data. Angular makes it particularly easy to implement client-side\
    \ form validations to give immediate feedback for an improved user experience.\n\
    \n# ## Implementing a Basic Form\n\n# ### Problem\n\nYou want to create a form\
    \ to enter user details and capture this information in an Angular.js scope.\n\
    \n# ### Solution\n\nUse the standard form tag and the ng-model Directive to implement\
    \ a basic form:\n\n```\nbody ng-app=\"MyApp\">\n  <div ng-controller=\"User\"\
    >\n    <form ng-submit=\"submit()\" class=\"form-horizontal novalidate\">\n  \
    \    <label>First</label>\n      <input type=\"text\" ng-model=\"user.firstname\"\
    />\n      <label>LastName</label>\n      <input type=\"text\" ng-model=\"user.lastname\"\
    />\n      <label>Age</label>\n      <input type=\"text\" ng-model=\"user.age\"\
    />\n      <button class=\"btn\">Submit</button>\n    </form>\n  </div>\n</body>\n\
    ```\n\nThe novalidate attribute disables the HTML5 validations, which are client-side\
    \ validations supports by modern browsers. In our example we only want the Angular.js\
    \ validations running to have complete control over look and feel.\n\nThe controller\
    \ binds the form to your user model and implements the submit() function:"
  - "[PAGE 65]\n\n# Using Forms\n\n```\nvar app = angular.module(\"MyApp\", []);\n\
    app.controller(\"User\", function(scope) {\n  $scope.user = {};\n  $scope.wasSubmitted\
    \ = false;\n\n  $scope.submit = function() {\n    $scope.wasSubmitted = true;\n\
    \  }\n});\n```\n\nYou can find the complete example on github^67.\n\n# Discussion\n\
    \nThe initial idea when using forms would be to implement them the traditional\
    \ way by serializing the form data and submit it to the server. Instead we use\
    \ ng-model to bind the form to our model, something we have been doing a lot already\
    \ in previous recipes.\nThe submit button is reflected in our wasSubmitted variable,\
    \ but no submit to the server was actually done. The default behaviour in Angular.js\
    \ forms is to prevent the default action since we do not want to reload the whole\
