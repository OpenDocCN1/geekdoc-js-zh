    \nThe controller is responsible for using a $resource object and handling the\
    \ button click with the load function. We are using JSONP here to allow this code\
    \ to be executed locally even though it served by a different domain.\n\n> *http://docs.angularjs.org/api/ng/$protect?char%0024relax\n\
    \n# Backend Integration with Rails\n\nIn this chapter we will look at common problems\
