    >切换</button>\n    <p ng-show=\"isVisible()\">Hello World!</p>\n    <p>Debug Scope:\
    \ visible = {{visible}}</p>\n  </div>\n</body\n```\n\n![](img/4fe99a48966d83f4c57ed3f7fc549810_0_0.png)\n\
