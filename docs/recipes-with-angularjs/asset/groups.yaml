    \ which will help you understand all the pieces fit together.\n\n> ¹https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter9/recipe\n\
    > ²http://guides.rubyonrails.org\n\n# Rails Security using Authenticity Token\n\
    \nThe example code works nicely until we use the HTTP methods, POST, DELETE with\
    \ the resource. As a security mechanism Rails expects an authenticity token to\
    \ prevent a Cross Site Request Forgery attack. We need to submit an authenticity\
    \ header X-CSRF-Token with the token. It is knowingly rendered in the HTML meta\
