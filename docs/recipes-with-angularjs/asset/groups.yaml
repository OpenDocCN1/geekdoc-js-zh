- md: "\nThe controller uses the same Item Service as used for the previous recipe\
    \ and handles the logic for the \"Load More\" button.\n\n```javascript\napp.controller(\"\
    PaginationCtrl\", function($scope, Item) {\n  $scope.itemsPerPage = 5;\n  $scope.currentPage\
    \ = 0;\n  $scope.total = Item.total();\n  $scope.pagedItems = Item.get($scope.currentPage*$scope.itemsPerPage,\
    \ $scope.itemsPerPage);\n\n  $scope.loadMore = function() {\n    $scope.currentPage++;\n\
    \    var newItems = Item.get($scope.currentPage*$scope.itemsPerPage);\n    $scope.pagedItems\
    \ = $scope.pagedItems.concat(newItems);\n  };\n\n  $scope.nextPageDisabledClass\
    \ = function() {\n    return $scope.currentPage === $scope.pageCount()-1 ? \"\
    disabled\" : \"\";\n  };\n\n  $scope.pageCount = function() {\n    return Math.ceil($scope.total/$scope.itemsPerPage);\n\
    \  }\n});\n```\n\nYou can find the complete example on github^81.\n\n## Discussion\n\
    \nThe solution is actually pretty similar to the previous recipe and uses a controller\
    \ only again. $scope.pagedItems is retrieved initially to render the first five\
    \ items.\n\n> ^81https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter8/recipe\n\
    \n## Common User Interface Patterns\n\nWhen pressing the \"Load More\" button\
    \ we fetch another set of items incrementing the currentPage to change the offset\
    \ of the Item.get function. The new items will be concatenated with the existing\
    \ items using the Array.concat function. The changes to pagedItems will be automatically\
    \ rendered by the ng-repeat directive.\n\nThe nextPageDisabledClass checks if\
    \ there is more data available by calculating the total of pages in pageCount\
    \ and comparing that to the current page.\n\n## Displaying a Flash Notice/Failure\
    \ Message\n\n### Problem\nYou want to display a flash confirmation message after\
    \ a user submitted a form successfully.\n\n### Solution\nIn a web framework like\
    \ Rails the form submit will lead to a redirect with the flash confirmation message,\
    \ relying on the browser session. For our client-side approach we bind to route\
    \ changes and manage a queue of flash messages.\n\nIn our example we use a home\
    \ page with a form and on submit we navigate to another page and show the flash\
    \ message. We use the ng-view Directive and define the two pages as script tags\
    \ here.\n\n```html\n<body ng-app=\"MyApp\" ng-controller=\"MyCtrl\">\n  <ul class=\"\
    nav nav-pills\">\n    <li><a href=\"#\">Home</a>/</li>\n    <li><a href=\"#page\"\
    >Next Page</a>/</li>\n  </ul>\n\n  <div class=\"alert\" ng-show=\"flash.getMessage()\"\
    >\n    <b>Alert!</b>\n    <p>{{flash.getMessage()}}</p>\n  </div>\n\n  <ng-view></ng-view>\n\
    \n  <script type=\"text/template\" id=\"home.html\">\n    <h3>Home</h3>\n  </script>\n\
    \  <form ng-submit=\"submit(message)\" class=\"form-inline\">\n    <input type=\"\
    text\" ng-model=\"message\" autofocus>\n    <button class=\"btn\">Submit</button>\n\
    \  </form>\n\n  <script type=\"text/ng-template\" id=\"page.html\">\n    <h3>Next\
    \ Page</h3>\n  </script>\n</body>\n```\n\nNote, that the flash message just like\
    \ the navigation is always shown but conditionally hidden depending on if there\
    \ a flash message available.\n\nThe route definition defines the pages, nothing\
    \ new for us:\n\n```javascript\nvar app = angular.module(\"MyApp\", []);\napp.config(function($routeProvider)\
    \ {\n  $routeProvider\n  .when(\"/home\", { templateUrl: \"home.html\" })\n  .when(\"\
    /page\", { templateUrl: \"page.html\" })\n  .otherwise({ redirectTo: \"/home\"\
    \ });\n});\n```\n\nThe interesting part is the flash service which handles a queue\
    \ of messages and listeners for route to change a message from the queue to the\
    \ current page.\n\n```javascript\napp.factory(\"flash\", function($rootScope)\
    \ {\n  var queue = [];\n  var currentMessage = \"\";\n  $rootScope.on(\"$routeChangeSuccess\"\
    , function() {\n    currentMessage = queue.shift() || \"\";\n  });\n  return {\n\
    \    setMessage: function(message) {\n      queue.push(message);\n    },\n   \
    \ getMessage: function() {\n      return currentMessage;\n    }\n  };\n});\n```\n\
    \nThe controller handles the form submit and navigates to the other page.\n\n\
    ```javascript\napp.controller(\"MyCtrl\", function($scope, $location, flash) {\n\
    \  $scope.flash = flash;\n  $scope.message = \"Hello World\";\n  $scope.submit\
    \ = function(message) {\n    flash.setMessage(message);\n    $location.path(\"\
    /page\");\n  }\n});\n```\n\nThe flash service is dependency injected into the\
    \ controller and made available to the scope we want to use in our template.\n\
    \nWhen you press the submit button you will be navigated to the other page and\
    \ see the flash message. Note, that using the navigation to go back and forth\
    \ between pages doesn't show the flash message.\n\nYou can find the complete example\
    \ on github#8.\n\n## Discussion\n\nThe controller uses setMessage function of\
    \ the flash service and the service stores the message in an array change queue.\
    \ When the controller uses $location to navigate the service routeChange listener\
    \ will be called and retrieves the message from the queue.\n\nIn the template\
    \ we use ng-show to hide the div element with the flash messaging using flash.getMessage().\
    \ Since this is a service it can be used anywhere in your code and it will show\
    \ a flash message on the next route.\n\n## Editing Text In-Place using HTML5 ContentEditable\n\
    \n### Problem\nYou want to make a div editable in place using the HTML5 contenteditable\
    \ attribute.\n\n> #8https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter8/recipe5\n\
    \n### Solution\nImplement a directive for the contenteditable attribute and use\
    \ ng-model for data binding.\nIn the example we use a div and a paragraph to render\
    \ the content.\n\n```html\n<div contenteditable ng-model=\"text\"></div>\n<p>{{text}}</p>\n\
    ```\n\nThe directive is especially interesting since it uses ng-model instead\
    \ of custom attributes.\n\n```javascript\napp.directive(\"contenteditable\", function()\
    \ {\n  return {\n    restrict: \"A\",\n    require: \"ngModel\",\n    link: function(scope,\
    \ element, attrs, ngModel) {\n      function read() {\n        ngModel.$setValue(element.html());\n\
    \      }\n\n      ngModel.$render = function() {\n        element.html(ngModel.$model\
    \ || \"\");\n      };\n\n      element.bind(\"blur keyup change\", function()\
    \ {\n        scope.$apply(read);\n      });\n    }\n  };\n});\n```\n\nYou can\
    \ find the complete example on github83.\n\n## Discussion\n\nThe directive is\
    \ restricted for usage as an HTML attribute since we want to use the HTML contenteditable\
    \ attribute as instead of defining a new HTML element.\nIt requires the ngModel\
    \ controller for data binding in conjunction with the link function. The implementation\
    \ binds an event listener which executes the read function with apply^84. This\
    \ ensures that even though we call the read function from within a DOM event handler\
    \ we notify Angular about it.\n\nThe read function updates the model based on\
    \ the view's user input. And the render function is doing the same in the other\
    \ direction, updating the view whenever the model changes.\n\nThe directive is\
    \ surprisingly simple leaving the ng-model aside. But without the ng-model support\
    \ we would have to come up with our own model-attribute handling which would not\
    \ be consistent with other directives.\n\n> ^83https://github.com/fdiesiet/recipes-with-angular-js/examples/tree/master/chapter8/recipe6\n\
    ^84http://docs.angular.org/api/ng?#protect/char%2024srelaxRootScope.Scope\n"
  mdcn: "\n控制器使用了与上一个配方相同的 Item Service，并处理“加载更多”按钮的逻辑。\n\n```javascript\napp.controller(\"\
    PaginationCtrl\", function($scope, Item) {\n  $scope.itemsPerPage = 5;\n  $scope.currentPage\
    \ = 0;\n  $scope.total = Item.total();\n  $scope.pagedItems = Item.get($scope.currentPage*$scope.itemsPerPage,\
    \ $scope.itemsPerPage);\n\n  $scope.loadMore = function() {\n    $scope.currentPage++;\n\
    \    var newItems = Item.get($scope.currentPage*$scope.itemsPerPage);\n    $scope.pagedItems\
    \ = $scope.pagedItems.concat(newItems);\n  };\n\n  $scope.nextPageDisabledClass\
    \ = function() {\n    return $scope.currentPage === $scope.pageCount()-1 ? \"\
    disabled\" : \"\";\n  };\n\n  $scope.pageCount = function() {\n    return Math.ceil($scope.total/$scope.itemsPerPage);\n\
    \  }\n});\n```\n\n你可以在 github^81 找到完整的示例。\n\n## 讨论\n\n该解决方案实际上与上一个配方非常相似，并且再次使用了控制器。初始获取\
    \ `$scope.pagedItems` 以渲染前五个项目。\n\n> ^81https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter8/recipe\n\
    \n## 常见用户界面模式\n\n当点击“加载更多”按钮时，我们会获取另一组项目，通过增加 `currentPage` 来更改 `Item.get` 函数的偏移量。新项目将使用\
    \ `Array.concat` 函数与现有项目合并。`pagedItems` 的更改将由 `ng-repeat` 指令自动渲染。\n\n`nextPageDisabledClass`\
    \ 通过计算 `pageCount` 中的总页数与当前页面进行比较，检查是否有更多可用数据。\n\n## 显示闪回通知/失败消息\n\n### 问题\n你希望在用户成功提交表单后显示一条闪回确认消息。\n\
    \n### 解决方案\n在 Rails 等 框架中，表单提交将导致重定向并带有闪回确认消息，这依赖于浏览器会话。对于我们的客户端方法，我们绑定路由变化并管理闪回消息队列。\n\
    \n在示例中，我们使用了一个带有表单的主页，并在提交时导航到另一个页面显示闪回消息。我们使用了 `ng-view` 指令并在此处脚本标签中定义了两个页面。\n\
    \n```html\n<body ng-app=\"MyApp\" ng-controller=\"MyCtrl\">\n  <ul class=\"nav\
    \ nav-pills\">\n    <li><a href=\"#\">首页</a>/</li>\n    <li><a href=\"#page\"\
    >下一页</a>/</li>\n  </ul>\n\n  <div class=\"alert\" ng-show=\"flash.getMessage()\"\
    >\n    <b>警注意！</b>\n    <p>{{flash.getMessage()}}</p>\n  </div>\n\n  <ng-view></ng-view>\n\
    \n  <script type=\"text/template\" id=\"home.html\">\n    <h3>首页</h3>\n  </script>\n\
    \  <form ng-submit=\"submit(message)\" class=\"form-inline\">\n    <input type=\"\
    text\" ng-model=\"message\" autofocus>\n    <button class=\"btn\">提交</button>\n\
    \  </form>\n\n  <script type=\"text/ng-template\" id=\"page.html\">\n    <h3>下一页</h3>\n\
    \  </script>\n</body>\n```\n\n注意，闪回消息就像导航一样始终显示，但会根据是否有可用闪回消息进行条件性隐藏。\n\n路由定义定义了页面，对我们来说没有新内容：\n\
    \n```javascript\nvar app = angular.module(\"MyApp\", []);\napp.config(function($routeProvider)\
    \ {\n  $routeProvider\n  .when(\"/home\", { templateUrl: \"home.html\" })\n  .when(\"\
    /page\", { templateUrl: \"page.html\" })\n  .otherwise({ redirectTo: \"/home\"\
    \ });\n});\n```\n\n有趣的部分是 `flash` 服务，它处理消息队列并监听路由变化，以便将消息从队列中移动到当前页面。\n\n```javascript\n\
    app.factory(\"flash\", function($rootScope) {\n  var queue = [];\n  var currentMessage\
    \ = \"\";\n  $rootScope.on(\"$routeChangeSuccess\", function() {\n    currentMessage\
    \ = queue.shift() || \"\";\n  });\n  return {\n    setMessage: function(message)\
    \ {\n      queue.push(message);\n    },\n    getMessage: function() {\n      return\
    \ currentMessage;\n    }\n  };\n});\n```\n\n控制器处理表单提交并导航到另一个页面。\n\n```javascript\n\
    app.controller(\"MyCtrl\", function($scope, $location, flash) {\n  $scope.flash\
    \ = flash;\n  $scope.message = \"Hello World\";\n  $scope.submit = function(message)\
    \ {\n    flash.setMessage(message);\n    $location.path(\"/page\");\n  }\n});\n\
    ```\n\n`flash` 服务被依赖注入到控制器中，并在我们要在模板中使用的 scope 中可用。\n\n当你点击提交按钮时，你将被导航到另一个页面并看到闪回消息。注意，使用导航在页面之间来回不会显示闪回消息。\n\
    \n你可以在 github#8 找到完整的示例。\n\n## 讨论\n\n控制器使用了 `flash` 服务的 `setMessage` 函数，该服务将消息存储在数组形式的队列中。当控制器使用\
    \ `$location` 导航时，服务的 `routeChange` 监听器会被调用并从队列中检索消息。\n\n在模板中，我们使用 `ng-show` 来隐藏\
    \ `div` 元素，通过 `getMessage()` 使用闪回消息。\n\n## 使用 HTML5 Editable 编辑文本\n\n### 问题\n\
    你想使用 HTML5 `contenteditable` 属性就地编辑一个 `div`。\n\n> #8https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter8/recipe5\n\
    \n### 解决方案\n为 `contenteditable` 属性实现一个指令并使用 `ng-model` 进行数据绑定。在示例中，我们使用一个 `div`\
    \ 和一个段落来渲染内容。\n\n```html\n<div contenteditable ng-model=\"text\"></div>\n<p>{{text}}</p>\n\
    ```\n\n该指令特别有趣，因为它使用了 `ng-model` 而不是自定义属性。\n\n```javascript\napp.directive(\"\
    contenteditable\", function() {\n  return {\n    restrict: \"A\",\n    require:\
    \ \"ngModel\",\n    link: function(scope, element, attrs, ngModel) {\n      function\
    \ read() {\n        ngModel.$setValue(element.html());\n      }\n\n      ngModel.$render\
    \ = function() {\n        element.html(ngModel.$model || \"\");\n      };\n\n\
    \      element.bind(\"blur keyup change\", function() {\n        scope.$apply(read);\n\
    \      });\n    }\n  };\n});\n```\n\n你可以在 github83 找到完整的示例。\n\n## 讨论\n\n该指令被限制为\
    \ HTML 属性，因为我们希望使用 HTML `contenteditable` 属性而不是定义新的 HTML 元素。\n它需要 `ngModel` 控制器配合\
    \ `link` 函数进行数据绑定。实现绑定了一个事件监听器，它通过 `apply` 执行 `read` 函数^84。这确保了即使我们在 DOM 事件处理程序内部调用\
    \ `read` 函数，我们也会通知 Angular。\n\n`read` 函数根据视图的用户输入更新模型。而 `render` 函数在反方向执行相同的操作，在模型更改时更新视图。\n\
    \n在不考虑 `ng-model` 的情况下，该指令异常地简单。但如果没有 `ng-model` 支持，我们必须自己想出一模型-属性处理机制，这将与其他指令不一致。\n\
    \n> ^83https://github.com/fdiesiet/recipes-with-angular-js/examples/tree/master/chapter8/recipe6\n\
    ^84http://docs.angular.org/api/ng?#protect/char%2024srelaxRootScope.Scope\n\n"
