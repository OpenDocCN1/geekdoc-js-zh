    \n你可以在 github^7 上找到完整示例。\n\n# 讨论\n\n只要客户端可以使用所有数据，链式过滤器（Chaining filters）是实现此类用例的极佳方法。filter^8\
    \ Angular.Js Filter 作用于数组并返回项目的子集作为新数组。它支持字符串、对象或函数参数。在这个示例中，我们使用了字符串参数，但考虑到 $scope.friends\
    \ 是一个对象数组，我们可以考虑使用对象的 的更复杂示例，例如：\n\n```\n<ul ng-repeat=\"friend in friends |\n\
    \  filter: { name: query, age: '20' } |\n  orderBy: 'name\">\n  <li>{{friend.name}}\
    \ ({{friend.age}})</li>\n</ul>\n```\n\n这样我们可以同时根据名称和年龄进行过滤。最后，你可以调用控制器中定义的函数，它可以为你完成过滤：\n\
    \n> ^7https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter8/recipe1\n\
