- md: "\n# CONTENTS\n\nImplementing Client-Side Routing . . . . . . . . . . . . .\
    \ . . . . . . . . . . 96\n\n# Preface\n\n# Introduction\n\nAngular.js is an open-source\
    \ Javascript MVC (Model-View-Controller) framework developed by Google. It gives\
    \ Javascript developers a highly structured approach to developing rich browser-based\
    \ applications which leads to very high productivity.\n\nIf you are using Angular.js,\
    \ or considering it, this cookbook provides easy to follow recipes for issues\
    \ you are likely to face. Each recipe solves a specific problem and provides a\
    \ solution and in-depth discussion of it.\n\n# Code Examples\n\nAll code examples\
    \ in this book can be found on Github¹.\n\n# How to contact me\n\nIf you have\
    \ questions or comments please get in touch with: Frederik Dietz (fdietz@gmail.com)\n\
    \n# Acknowledgements\n\nThanks to John John Lindquist for his excellent screencast\
    \ Egghead IO², Lukas Rueebeke for his awesome videos², Matias Niemel for his great\
    \ blog². And of course the whole development team behind Angular.js!\n\n> ¹http://github.com/fdietz/recipes-with-angular-js-examples\n\
    ²http://egghead.io/\n³http://www.youtube.com/user/simplicityton/videos?flow=grid&view=0\n\
    ⁴http://www.yearofmooo.com/\n\n# An Introduction to Angular.js\n\n## Including\
    \ the Angular.js library Code in an HTML page\n\n### Problem\n\nYou want to use\
    \ Angular.js on a web page.\n\n### Solution\n\nIn order to get your first Angular.js\
    \ app up and running you need to include the Angular Javascript via script tag\
    \ and make use of the ng-app directive.\n\n```html\n<html\n<head>\n<script src=\"\
    http://ajax.googleapis.com/libs/ajax/angularjs/1.0.4/angular.js\"></script>\n\
    </head>\n<body ng-app>\n<p>This is your first angular expression: {{ 1 + 2 }}</p>\n\
    </body>\n</html>\n```\n\n> Tip: You can check out a complete example on github.\n\
    \n### ### Discussion\n\nAdding the ng-app directive tells Angular to kick in its\
    \ magic. The expression {{ 1 + 2 }} is evaluated by Angular and the result 3 is\
    \ rendered. Note, that removing ng-app will result in the browser to render the\
    \ expression as instead of evaluating it. Play around with the expression! You\
    \ can for example concatenate Strings and invert or Boolean values.\n\nFor Brevity\
    \ reasons we skip the boilerplate code in the following recipes.\n\n# Binding\
    \ a Text Input to an Expression\n\n### Problem\n\nYou want user input to be used\
    \ in another part of your HTML page.\n\n### Solution\n\nUse Angular's ng-model\
    \ directive to bind the text input to the expression.\n\n```html\nEnter your name:\
    \ <input type=\"text\" ng-model=\"name\"></input>\n<p>Hello {{name}}!</p>\n```\n\
    \nYou can find the complete example on github.\n\n### Discussion\n\nAssigning\
    \ \"name\" to the ng-model attribute and using the name variable in an expression\
    \ will keep both in sync automatically. Typing in the text input will automatically\
    \ reflect these changes in the paragraph element.\n\nConsider how you would implement\
    \ this traditionally using jQuery:\n\n```html\n<html\n<head>\n  <script src=\"\
    http://code.jquery.com/jquery.min.js\"></script>\n</head>\n<body>\n  Enter your\
    \ name: <input type=\"text\"></input>\n  <p id=\"name\"></p>\n<script>\n  $(document).ready(function()\
    \ {\n    $(\"input\").keypress(function() {\n      $(\"name\").text($(this).val()));\n\
    \    });\n  });\n</script>\n</body>\n</html>\n```\n\n# An Introduction to Angular.js\n\
    \nOn document ready we bind the keypress event in the text input and replace the\
    \ text in the paragraph in the callback function. Using jQuery you need to deal\
    \ with document ready callbacks, element selection, event binding and the context\
    \ of this. Quite a lot of concepts to swallow and lines of code to maintain!\n\
    \n# Responding to Click Events using Controllers\n\n### Problem\n\nYou want to\
    \ hide an HTML element on button click.\n\n### Solution\n\nUse the ng-hide directive\
    \ in conjunction with a controller to change the visibility status on button click.\n\
    \n```html\n<html\n<head>\n<script src=\"js/angular.js\"></script>\n<script src=\"\
    js/app.js\"></script>\n<link rel=\"stylesheet\" href=\"css/bootstrap.css\">\n\
    </head>\n<body ng-controller=\"MyCtrl\">\n<button ng-click=\"toggle()\">Toggle</button>\n\
    <p ng-show=\"visible\">Hello World!</p>\n</div>\n</body>\n</html>\n```\n\nAnd\
    \ the controller in js/app.js:\n\n```javascript\nfunction MyCtrl($scope) {\n \
    \ $scope.visible = true;\n\n  $scope.toggle = function() {\n    $scope.visible\
    \ = !$scope.visible;\n  }\n}\n```\n\n# An Introduction to Angular.js\n\nYou can\
    \ find the complete example on github.\n\nWhen toggling the button \"Hello World\"\
    \ paragraph will change its visibility\n\n### Discussion\n\nUsing the ng-controller\
    \ directive we bind the div element including its children to the context of the\
    \ MyCtrl Controller. The ng-click directive will call the toggle() function of\
    \ our controller on button click. Note, that the ng-show directive is bound to\
    \ the scope variable and will toggle the particular's visibility accordingly.\n\
    \nThe controller implementation defaults the visible attribute to false and toggles\
    \ its boolean state in the toggle function. Both the visible variable and the\
    \ toggle function are defined on the $scope which is passed to all controllers\
    \ automatically via dependency injection.\n\nThe next chapter will go into all\
    \ the details of controllers in Angular. Now let us quickly discuss the MVVM (Model-View-ViewModel)\
    \ pattern as used in Angular. In the MVVM pattern the model is plain javascript,\
    \ the view is the HTML template and the ViewModel is the glue between the template\
    \ and the model. The ViewModel makes Angular's two binding changes where the model\
    \ and the template are sync automatically.\n\nIn our example the visible attribute\
    \ is the model, but it will be of much more complex as example retrieving data\
    \ from a back service. The controller is used to define the scope which represents\
    \ the ViewModel. It interacts with the HTML template by binding the scope variable\
    \ visible and the function toggle() to it.\n\n# Converting Output with Filters\n\
    \n### Problem\n\nWhen presenting data to the user, you might need to convert the\
    \ data to a more user-friendly format. In our case we need to uppercase the name\
    \ value from the previous recipe in the expression.\n\n### Solution\n\nUse the\
    \ uppercase Angular filter.\n\n```html\nEnter your name: <input type=\"text\"\
    \ ng-model=\"name\"></input>\n<p>Hello {{name | uppercase}}</p>\n```\n\nYou can\
    \ find the complete example on github.\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter1/recipe4\n\
    \n# An Introduction to Angular.js\n\n### Discussion\n\nAngular uses the | (pipe)\
    \ character to combine filters with variables. When evaluating the expression,\
    \ the name variable is passed to uppercase filter. This is similar to working\
    \ with the Unix pipe symbol when an input can be transformed.\n\n# Creating HTML\
    \ elements with Directives\n\n### Problem\n\nYou want to render an HTML snippet\
    \ but hide it conditionally.\n\n### Solution\n\nCreate a custom Directive which\
    \ renders your World snippet.\n\n```html\n<body ng-app=\"MyApp\">\n  <label for=\"\
    checkbox\">\n    <input id=\"checkbox\" type=\"checkbox\" ng-model=\"visible\"\
    >Toggle me\n  </label>\n  <div show=\"visible\">\n    <p>Hello World</p>\n  </div>\n\
    </body>\n```\n\nThe show attribute is directive, with the following implementation:\n\
    \n```javascript\nvar app = angular.module(\"MyApp\", []);\n\napp.directive(\"\
    show\", function() {\n  return {\n    link: function(scope, element, attributes)\
    \ {\n      scope.$watch(attributes.show, function(value) {\n        element.css('display',\
    \ value ? '' : 'none');\n      });\n    }\n  };\n});\n```\n\n# An Introduction\
    \ to Angular.js\n\n### Discussion\n\nLet us ignore the app module creation for\
    \ now to look further into in a later chapter. In our example it is just the means\
    \ to create a directive. Note, that the show String is name of the directive which\
    \ corresponds to the show attribute used in the template.\n\nThe browser will\
    \ only show the \"Hello World\" paragraph if the checkbox is checked and will\
    \ hide otherwise.\n\nYou can find the complete example on github.\n\nThis was\
    \ just a small glimpse of what can be achieved with directives and there is a\
    \ whole chapter dedicated to them which goes into more detail.\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter1/recipe5\n"
  mdcn: "\n\n# 目录\n\n实现客户端路由 . . . . . . . . . . . . . . . . . . . . . . . 96\n\n\
