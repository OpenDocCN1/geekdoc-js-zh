- md: "\n## Controllers\n\nControllers in Angular provide the business logic to handle\
    \ view behaviour, for example responding to a user clicking a button or entering\
    \ some text in a form. Additionally controllers prepare the model for the view\
    \ template.\n\nAs a general rule a controller should not reference or manipulate\
    \ the DOM directly. This has the the benefit of simplifying unit testing controllers.\n\
    \n## Assigning a Default Value to a Model\n\n### Problem\n\nYou want to assign\
    \ a default value to the scope in the controllers context.\n\n### Solution\n\n\
    Use the ng-controller directive in your template:\n\n```html\n<div ng-controller=\"\
    MyCtrl\">\n  <p>{{value}}</p>\n</div>\n```\n\nNext, define the scope variable\
    \ in your controller function:\n\n```javascript\nvar MyCtrl = function($scope)\
    \ {\n  $scope.value = \"some value\";\n};\n```\n\nYou can find the complete example\
    \ on github¹⁰.\n\n### Discussion\n\nDepending on where you use the ng-controller,\
    \ you define its assigned scope. The scope is hierarchical and follows the DOM\
    \ node hierarchy. In our example the value expression is correctly evaluated to\
    \ some value, since value is set in the MyCtrl controller. Note, that this would\
    \ not work if the expression is moved outside the controllers scope:\n\n> ¹⁰https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe1\n\
    \n```html\n<p>{{value}}</p>\n```\n\n<div ng-controller=\"MyCtrl\">\n</div>\n```\n\
    \nIn this case, {{value}} will simply not be rendered at all due to the fact that\
    \ expression evaluation in Angular.js is forgiving for undefined and null values.\n\
    \n## Changing a Model Value with a Controller Function\n\n### Problem\n\nYou want\
    \ to increment a model value by 1 using a controller function.\n\n### Solution\n\
    \nImplement an increment function which changes the scope.\n\n```javascript\n\
    function MyCtrl($scope) {\n  $scope.value = 1;\n  $scope.incrementValue = function(value)\
    \ {\n    $scope.value += 1;\n  }\n}\n```\n\nThis function can be called directly\
    \ in an expression, in our example we use ng-init:\n\n```html\n<div ng-controller=\"\
    MyCtrl\">\n<p ng-init=\"incrementValue(5)\">{{value}}</p>\n</div>\n```\n\nYou\
    \ can find the complete example on github.\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe\n\
    \n### Discussion\n\nThe ng-directive is executed on page load and calls the function\
    \ incrementValue defined in MyCtrl. Functions are defined on the scope very similar\
    \ to values but must be called with the familiar parenthesis syntax.\n\nOf course,\
    \ it would have been possible to increment the value right inside of the expression\
    \ with value = value +1 but imagine the function being much more complex! Moving\
    \ this function into a controller separates our business logic from our declarative\
    \ view template and we can easily write unit tests for it.\n\n## Encapsulating\
    \ a Model Value with a Controller Function\n\n### Problem\n\nYou want to retrieve\
    \ a model via function (instead of directly accessing the scope from the template)\
    \ which encapsulates the model value.\n\n### Solution\n\nDefine a getter function\
    \ which returns the model value.\n\n```javascript\nfunction MyCtrl($scope) {\n\
    \  $scope.value = 1;\n\n  $scope.getIncrementedValue = function() {\n    return\
    \ $scope.value + 1;\n  }\n}\n```\n\nThen in the template we use an expression\
    \ to call it:\n\n```html\n<div ng-controller=\"MyCtrl\">\n<p>{{getIncrementedValue()}}</p>\n\
    </div>\n```\n\nYou can find the complete example on github¹.\n\n> ¹²https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe2\n\
    \n### Discussion\n\nMyCtrl defines the getIncrementedValue function which uses\
    \ the current value and returns it incremented by one. One could argue depending\
    \ on the use case it would make more sense to use a filter. But, there are use\
    \ cases specific to the controllers behaviour where you do not require a generic\
    \ filter.\n\n## Responding to Scope Changes\n\n### Problem\n\nYou want to react\
    \ on a model change to trigger some further actions. In our example we want to\
    \ set another model value depending on the value we are listening on.\n\n### Solution\n\
    \nUse the $watch function in your controller.\n\n```javascript\nfunction MyCtrl($scope)\
    \ {\n  $scope.name = \"\";\n  $scope.watch(\"name\", function(newValue, oldValue)\
    \ {\n    if ($scope.name.length > 0) {\n      $scope.greeting = \"Greetings \"\
    \ + $scope.name;\n    }\n  });\n}\n```\n\n```html\n<div ng-controller=\"MyCtrl\"\
    >\n  <input type=\"text\" ng-model=\"name\" placeholder=\"Enter name\">\n  <p>{{greeting}}</p>\n\
    </div>\n```\n\nIn our example we use the watch function to print the greeting.\
    \ You can find the complete example on github.\n\n### Discussion\n\nThe first\
    \ argument of $watch is actually a string, the second is a function. In this case,\
    \ you can use the new and old values:\n\n```javascript\n$scope.watch(function()\
    \ {\n  return scope.name;\n}, function(newValue, oldValue) {\n  console.log(\"\
    change: \" + newValue);\n});\n```\n\n## Sharing Models Between Controllers\n\n\
    ### Problem\n\nWant to share a model between nested controllers.\n\n### Solution\n\
    \nUse objects instead of primitives. Our example uses MyCtrl and NestedCtrl:\n\
    \n```javascript\nvar app = angular.module(\"MyApp\", []);\n\napp.controller(\"\
    MyCtrl\", function($scope) {\n  $scope.name = \"Peter\";\n  $scope.user = {\n\
    \    name: \"Parker\"\n  };\n});\n\napp.controller(\"NestedCtrl\", function($scope)\
    \ {\n});\n```\n\n```html\n<body ng-app=\"MyApp\">\n  <div ng-controller=\"MyCtrl\"\
    >\n    <input type=\"text\" ng-model=\"name\">\n    <label>Primitive</label>\n\
    \    <input type=\"text\" ng-model=\"user.name\">\n    <div class=\"nested\" ng-controller=\"\
    NestedCtrl\">\n      <label>Object</label>\n      <input type=\"text\" ng-model=\"\
    user.name\">\n    </div>\n  </div>\n</body>\n```\n\n### Discussion\n\nThe default\
    \ values are defined in MyCtrl which is the parent of NestedCtrl. When doing in\
    \ the first input field, the changes will be in sync with other input fields as\
    \ long as they only read from the variable. If you change the nested value, a\
    \ copy in the scope of NestedCtrl will be created. From now on, changing the first\
    \ input field will only change the nested input field which explicitly references\
    \ the parent scope via $parent.name. The object based value behaves differently\
    \ in this. Angular prototypically inherits properties from a parent scope. Objects\
    \ are references and are kept in sync. Whereas primitive types are only in sync\
    \ as long as they are not changed in the child scope.\n\n## Sharing Code Between\
    \ Controllers using Services\n\n### Problem\n\nYou want to share business logic\
    \ between controllers.\n\n### Solution\n\nUse a Service to implement your business\
    \ logic and use dependency injection to use this service in your controllers.\
    \ The template shows access to a list of users from two controllers:\n\n```html\n\
    <div ng-controller=\"MyCtrl\">\n  <ul ng-repeat=\"user in users\">\n    <li>{{user}}</li>\n\
    \  </ul>\n  <div class=\"nested\" ng-controller=\"AnotherCtrl\">\n    First user:\
    \ {{firstUser}}\n  </div>\n</div>\n```\n\nThe service and controller implementation\
    \ in app.js implements a user service and the controllers set the scope initially:\n\
    \n### Discussion\n\nGenerally I tend to not use $parent.name and instead always\
    \ use objects to share model properties. If you use $parent.name the NestedCtrl\
    \ not only requires certain model attributes but also a correct scope hierarchy\
    \ to work with.\n\n> Tip: The Chrome plugin Batarang simplifies debugging the\
    \ scope hierarchy by showing you a tree of nested scopes. It is awesome!\n"
  mdcn: "\n\n## 控制器 (Controllers)\n\nAngular 中的控制器提供了处理视图行为的业务逻辑，例如响应用户点击按钮或在表单中输入文本。此外，控制器还为视图模板准备模型。\n\
    \n通常情况下，控制器不应该直接引用或操作 DOM。这样做的好处是简化控制器的单元测试。\n\n## 为模型分配默认值\n\n### 问题\n\n你想在控制器上下文的作用域（scope）分配一个默认值。\n\
    \n### 解决方案\n\n在模板中使用 `ng-controller` 指令：\n\n```html\n<div ng-controller=\"MyCtrl\"\
    >\n  <p>{{value}}</p>\n</div>\n```\n\n接下来，在控制器函数中定义作用域变量：\n\n```javascript\nvar\
    \ MyCtrl = function($scope) {\n  $scope.value = \"some value\";\n};\n```\n\n你可以在\
    \ github¹⁰ 上找到完整示例。\n\n### 讨论\n\n取决于你使用 `ng-controller` 的位置，你定义其分配的作用域。作用域是分级的，并遵循\
    \ DOM 节点层次结构。在我们的示例中，由于 `value` 在 MyCtrl 控制器中设置，值表达式被正确地求值为 `some value`。注意，如果表达式被移动到控制器的作用域之外，将无法工作：\n\
    \n> ¹⁰https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe1\n\
    \n```html\n<p>{{value}}</p>\n```\n\n<div ng-controller=\"MyCtrl\">\n</div>\n```\n\
    \n在这种情况下，{{value}} 将完全不会渲染，因为 Angular.js 的表达式评估对 `undefined` 和 `null` 值是宽容的。\n\
    \n## 使用控制器函数更改模型值\n\n### 问题\n\n你想用控制器函数将模型值加 1。\n\n### 解决方案\n\n实现一个更改作用域的增加函数。\n\
    \n```javascript\nfunction MyCtrl($scope) {\n  $scope.value = 1;\n  $scope.incrementValue\
    \ = function(value) {\n    $scope.value += 1;\n  }\n}\n```\n\n该函数可以直接在表达式中调用，在我们的示例中我们使用了\
    \ `ng-init`：\n\n```html\n<div ng-controller=\"MyCtrl\">\n<p ng-init=\"incrementValue(5)\"\
    >{{value}}</p>\n</div>\n```\n\n### 讨论\n\n`ng-directive` 指令在页面加载时执行，并调用 MyCtrl\
    \ 中定义的 `incrementValue` 函数。在作用域上定义函数与值非常相似，但必须使用熟悉的括号语法进行调用。\n\n当然，直接在表达式内部通过\
    \ `value = value + 1` 增加值也是可能的，但想象一下函数变得非常复杂！将此函数移动到控制器中可以将业务逻辑与声明式视图模板分离，我们可以轻松地为它编写单元测试。\n\
    \n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe\n\
    \n## 使用控制器函数封装模型值\n\n### 问题\n\n你想通过函数（而不是直接从模板中访问作用域）检索封装了模型值的模型。\n\n### 解决方案\n\
    \n定义一个返回模型值的 getter 函数（getter）。\n\n```javascript\nfunction MyCtrl($scope) {\n\
    \  $scope.value = 1;\n\n  $scope.getIncrementedValue = function() {\n    return\
    \ $scope.value + 1;\n  }\n}\n```\n\n然后在模板中使用一个表达式来调用它：\n\n```html\n<div ng-controller=\"\
    MyCtrl\">\n<p>{{getIncrementedValue()}}</p>\n</div>\n```\n\n你可以在 github¹² 上找到完整示例。\n\
    \n> ¹²https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe2\n\
    \n### 讨论\n\nMyCtrl 定义了 `getIncrementedValue` 函数，它使用当前值并返回加1后的值。有人认为，根据用例，使用过滤器（filter）更有意义。但在特定的控制器行为场景下，你不需要通用的过滤器。\n\
    \n## 响应作用域变化\n\n### 问题\n\n你想响应模型的变化以触发某些后续操作。在我们的示例中，我们想根据正在监听的值设置另一个模型值。\n\n\
    ### 解决方案\n\n在控制器中使用 `$watch` 函数。\n\n```javascript\nfunction MyCtrl($scope) {\n\
    \  $scope.name = \"\";\n  $scope.watch(\"name\", function(newValue, oldValue)\
    \ {\n    if ($scope.name.length > 0) {\n      $scope.greeting = \"Greetings \"\
    \ + $scope.name;\n    }\n  });\n}\n```\n\n```html\n<div ng-controller=\"MyCtrl\"\
    >\n  <input type=\"text\" ng-model=\"name\" placeholder=\"Enter name\">\n  <p>{{greeting}}</p>\n\
    </div>\n```\n\n在我们的示例中，我们使用 `watch` 函数来打印问候。你可以在 github 上找到完整示例。\n\n### 讨论\n\n\
    `$watch` 的第一个参数实际上是字符串，第二个参数是函数。在这种情况下，你可以使用新值和旧值：\n\n```javascript\n$scope.watch(function()\
    \ {\n  return scope.name;\n}, function(newValue, oldValue) {\n  console.log(\"\
    change: \" + newValue);\n});\n```\n\n## 在控制器之间共享模型\n\n### 问题\n\n想在嵌套控制器之间共享模型。\n\
    \n### 解决方案\n\n使用对象而不是基本数据类型。我们的示例使用了 MyCtrl 和 NestedCtrl：\n\n```javascript\nvar\
    \ app = angular.module(\"MyApp\", []);\n\napp.controller(\"MyCtrl\", function($scope)\
    \ {\n  $scope.name = \"Peter\";\n  $scope.user = {\n    name: \"Parker\"\n  };\n\
    });\n\napp.controller(\"NestedCtrl\", function($scope) {\n});\n```\n\n```html\n\
    <body ng-app=\"MyApp\">\n  <div ng-controller=\"MyCtrl\">\n    <input type=\"\
    text\" ng-model=\"name\">\n    <label>Primitive</label>\n    <input type=\"text\"\
    \ ng-model=\"user.name\">\n    <div class=\"nested\" ng-controller=\"NestedCtrl\"\
    >\n      <label>Object</label>\n      <input type=\"text\" ng-model=\"user.name\"\
    >\n    </div>\n  </div>\n</body>\n```\n\n### 讨论\n\n默认值定义在 MyCtrl 中，它是 NestedCtrl\
    \ 的父级。在第一个输入字段中进行操作时，只要它们只从变量中读取，更改将与其他输入字段同步。如果你更改了嵌套值会在 NestedCtrl 的作用域中创建一个副本。从现在起，更改第一个输入字段将只会更改通过\
    \ `$parent.name` 显式引用父作用域的嵌套输入字段。基于对象的值在此表现不同。Angular 通过原型从父作用域继承属性。对象是引用，并保持同步。而基本类型只有在它们在子作用域中未被更改时才会保持同步。\n\
    \n## 使用服务在控制器之间共享代码\n\n### 问题\n\n你想在控制器之间共享业务逻辑。\n\n### 解决方案\n\n使用服务（Service）来实现你的业务逻辑，并使用依赖注入在控制器中使用该服务。模板显示了从两个控制器访问用户列表：\n\
    \n```html\n<div ng-controller=\"MyCtrl\">\n  <ul ng-repeat=\"user in users\">\n\
    \    <li>{{user}}</li>\n  </ul>\n  <div class=\"nested\" ng-controller=\"AnotherCtrl\"\
    >\n    First user: {{firstUser}}\n  </div>\n</div>\n```\n\n`app.js` 中的服务和控制器实现实现了一个用户服务，控制器初始化设置了作用域：\n\
    \n### 讨论\n\n通常，我倾向于不使用 `$parent.name`，而是始终使用对象来共享模型属性。如果你使用 `$parent.name`，NestedCtrl\
    \ 不仅需要某些模型属性，还需要正确的作用域层次结构才能工作。\n\n> 提示：Chrome 插件 Batarang 通过向你展示嵌套作用域树，简化了作用域层次结构的调试。它太棒了！\n\
    \n"
