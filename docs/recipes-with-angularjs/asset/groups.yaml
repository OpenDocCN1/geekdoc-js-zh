    \n# Testing Services\n\n# Problem\n\nYou want to test your controller and service\
    \ consuming a JSON API.\n\nLets have a look again at our example we want to test:\n\
    \n```\nvar app = angular.module(\"MyApp\", [\"ngResource\"]);\n\n.factory(\"TwitterAPI\"\
    , function($resource) {\n  return resource(\"http://search.twitter.com/search.json\"\
    ,\n    callback: \"JSON_CALLBACK\",\n    get: { method: \"JSONP\" });\n  });\n\
    });\n\\app.controller(\"MyCtrl\", function($scope, TwitterAPI) {\n  $scope.search\
    \ = function() {\n    $scope.searchResult = TwitterAPI.get({ q: $scope.searchTerm\
    \ });\n  };\n});\n```\n\n> ³https://github.com/kriskowal/q"
- md: "\n## Consuming External Services\n\nNote, that is slightly changed from the\
    \ previous recipe as the TwitterAPI is pulled out of the controller and resides\
    \ in its own service now.\n\n## Solution\n\nUse the angular-seed project and the\
    \ $http_backend mocking service.\n\n```javascript\ndescribe('MyCtrl', function(){\n\
    \  var scope, ctrl, httpBackend;\n\n  beforeEach(module(\"App\"));\n\n  beforeEach(\n\
    \    inject(function($controller, $rootScope, TwitterAPI, $httpBackend) {\n  \
    \    httpBackend = $httpBackend;\n      scope = $rootScope.new();\n      ctrl\
    \ = $controller(\"MyCtrl\", {\n        scope: scope, TwitterAPI: TwitterAPI });\n\
    \n      var mockData = { key: \"test\" };\n      var url = \"http://search.twitter.com/search.json\"\
    \ +\n        \"callback=JSON_CALLBACK&angular=js\";\n      httpBackend.whenJSONP(url).respond(mockData);\n\
    \    })\n  );\n\n  it('should set setResult on successful search', function()\
    \ {\n    scope.searchTerm = \"angularjs\";\n    scope.search();\n    httpBackend.flush();\n\
    \    expect(scope.searchResult.key).toBe(\"test\");\n  });\n});\n```\n\nYou can\
    \ find the complete example on github5.\n\n## Discussion\n\nSince we now have\
    \ a clear separation between the service and the controller, we can simply inject\
    \ the TwitterAPI in our beforeEach function.\n\nMocking with the $httpBackend\
    \ is done as a last step in beforeEach. When a JSONP request happens we respond\
    \ with mockData. After the search() is triggered we flush() the httpBackend in\
    \ order to return our mockData.\n\nHave a look at the ngMock.$httpBackend module\
    \ for more details.\n\n> 55http://docs.angular.org/api/ngMock.html#relaxhttpBackend\n\
    \n## URLs, Routing and Partials\n\nThe $location service^5 in Angular.js parses\
    \ the current browser URL and makes it available to your application. Changes\
    \ in either the browser address bar or the $location service will be kept in sync.\n\
    \nDepending on the configuration the $location service behaves differently and\
    \ has different requirements for your application. We will first look into client-side\
    \ routing with hashbang URLs since it is the default mode and later into the new\
    \ HTML5 based routing.\n\n## Client-Side Routing with Hashbang URLs\n\n### Problem\n\
    \nYou want the browser address bar reflect your applications flow consistently.\n\
    \n### Solution\n\nUse the $routeProvider and $locationProvider services to define\
    \ your routes and the ng-view directive as the placeholder for the partials which\
    \ should be shown for a particular route definition. The main template uses the\
    \ ng-view directive:\n\n```html\n<body>\n  <h1> Example</h1>\n  <ng-view></ng-view>\n\
    </body>\n```\n\nThe route configuration is implemented in app.js using the config\
    \ method:\n\n```javascript\n1 var app = angular.module(\"MyApp\", []).\n2 config(function($routeProvider,\
    \ $locationProvider) {\n3 $locationProvider.hashPrefix('!');\n4 $routeProvider;\n\
    5 when(\"/persons\", { templateUrl: \"partials/person_list.html\" });\n6 when(\"\
    /persons/:id\", {\n7 templateUrl: \"partials/person_details.html\", controller:\
    \ \"ShowCtr\" });\n8 \n9 otherwise( { redirectTo: \"/persons\" });\n10 });\n```\n\
    \nIt is setup to render the person_list.html or the person_details.html partial\
    \ depending on URL. The person_list.html renders a list of persons:\n\n```html\n\
    <h3>Person List</h3>\n<div ng-controller=\"IndexCtrl\">\n<table>\n<head>\n<tr>\n\
    <td>Name</td>\n<td>Actions</td>\n</tr>\n</head>\n<tbody>\n<tr ng-repeat=\"person\
    \ in persons\">\n<td>{{person.name}}</td>\n<td><a href=\"!/persons/{{person.id}}\"\
    >Details</a></td>\n</tr>\n</tbody>\n</table>\n</div>\n```\n\nAnd the person_details.html\
    \ shows more detailed information for a specific person:\n\n```html\n<h3>{{person.name}}\
    \ Details</h3>\n<p>Name: {{person.name}}</p>\n<p>Age: {{person.age}}</p>\n<a href=\"\
    !/persons\">Go back</a>\n```\n\nThis example is based on the Angular Seed Bootstrap\
    \ again and will not work without starting the development server.\n\n## URLs,\
    \ Routing and Partials\n\nYou can find the complete example on github57.\n\n##\
    \ Discussion\n\nLet's give our a try and open the index.html. The otherwise route\
    \ redirects us from index.html. This is the default behavior in case other conditions\
    \ don't apply.\n\nTake a closer look at the index.html and note how the hashtag\
    \ (#) separates index.html from the dynamic client-side part. Now for each person\
    \ we render a link to show the details via !/persons/(person.id). The route definition\
    \ for the person's details uses placeholder /persons/:id which resolves to a specific\
    \ person's details, for example /persons/1. The partial and additionally controller\
    \ are defined for this URL. The controller will be scoped to the partial, which\
    \ resembles our index.html template where we defined our ng-controller to achieve\
    \ the same effect. person_details.html has a link to !/persons which leads back\
    \ to person_list.html. And the last request for the details happens only once\
    \ and is cached via $templateCache. Finally, hashbang routing is client-side and\
    \ doesn't require server-side configuration. Let us look into the HTML5 based\
    \ approach.\n\n## Using Regular URLs with HTML5 History API\n\n### Problem\n\n\
    You want looking URLs and provide server-side support.\n\n### Solution\n\nWe use\
    \ the same example but use the Express framework to serve all content and handle\
    \ the URL rewriting. Let us start with the route configuration:\n\n```javascript\n\
    app.config(function($routeProvider, $locationProvider) {\n  $locationProvider.htmlMode(true);\n\
    \n  $routeProvider;\n  when(\"/persons\",\n    templateUrl: \"partials/index.jade\"\
    ,\n      controller: \"PersonIndexCtrl\" });\n  when(\"/persons/:id\",\n    templateUrl:\
    \ \"partials/show.jade\",\n      controller: \"PersonShowCtrl\" });\n  otherwise({\
    \ redirectTo: \"/persons\" });\n});\n```\n\nThere are no changes except the htmlMode\
    \ which enables our routing mechanism. Controller implementation does not change\
    \ at all. We have to take care of the partial loading. Our typical boilerplate\
    \ for an Express app loads the module and creates a server:\n\n```javascript\n\
    var express = require('express');\nvar app = module.exports = express.createServer();\n\
    ```\n\nWe skip the configuration here and jump directly to the server-side route\
    \ definition:\n\n```javascript\napp.get('/partials/:name', function (req, res)\
    \ {\n  var name = req.params.name;\n  res.render('/partials/' + name);\n});\n\
    ```\n\nThe Express route definition loads the partial with given name and renders\
    \ its content. When supporting HTML5 routing our server has to redirect all other\
    \ URLs to the entry point of our application, the index page. First we define\
    \ the rendering of the index page, which contains the ng-view directive:\n\n```javascript\n\
    app.get('/', function(req, res) {\n  res.render('index');\n}\n```\n\nThen the\
    \ catch route which redirects to the same page:\n\n```javascript\napp.get('*',\
    \ function(req, res) {\n  res.redirect('/');\n}\n```\n\nLet us quickly check the\
    \ panels again. Note, that they use the Jade template template engine, which relies\
    \ on indentation to define the HTML document:\n\n- p This is the index partial\n\
    - ul(ng-repeat=\"person in persons\")\n  - li\n    - a href=\"/persons/{{person.id}}\"\
    >{{person.name}}\n\nThe index page creates a list of persons and the show page\
    \ shows more details:\n\n- h3 Person Details{{person.name}}\n- p Age: {{person.age}}\n\
    - a href=\"/persons\" Back\n\nThe persons details link /persons/{{person.id}}\
    \ and the back link /persons are both now much cleaner in my opinion compared\
    \ to the hasURLs.\n\nHave a look at the complete example on Github62 and start\
    \ the Express app with node app.js. You can complete the example on github62.\n\
    \n## Discussion\n\nIf we wouldn't redirect all requests to the root, what would\
    \ happen if you navigate to the persons list at http://localhost:3000/persons?\
    \ The Express framework would show us an error because there is no route defined\
    \ for persons, we only defined for our root URL (/) and the partials URL/partials/:name.\
    \ The redirect ensures that we actually up at our root URL which kicks in our\
    \ angular app. When the client-side routing over we then redirect back to /persons.\n\
    \n> 60http://jade-lang.com/\n61https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter6/recipe2\n\
    62https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter6/recipe2\n"
