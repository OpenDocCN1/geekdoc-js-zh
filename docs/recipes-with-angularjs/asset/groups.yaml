    ,\n      { templateUrl: \"{{asset_path('contacts/edit.html')}}\",\n        controller:\
    \ ContactsEditCtrl\n    })\n    .otherwise({redirectTo: \"/contacts\"});\n});\n\
    ```\n\n我们设置了 `$locationProvider` 使用 HTML5 模式，并定义了列表、显示和创建新联系人的客户端路由。你可以在 GitHub\
    \ 上找到完整示例。\n\n> *[http://guides.rubyonrails.org/routing.html#route-globbing*\n\
