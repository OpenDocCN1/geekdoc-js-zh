    You want to consume REST APIs.\n\n# Solution\n\nUsing $resource is a great start.\n\
    \n```javascript\napp.factory('Contact', function ($resource) {\n  return $resource(\"\
    /api/contacts\", {}, {\n    'create': { method:'POST' },\n    'index': { method:'GET',\
