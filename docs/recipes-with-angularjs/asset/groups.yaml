    # Displaying a Modal Dialog


    # Question


    You want to use a Modal Dialog using the Twitter Bootstrap Framework. A dialog
    is called modal when it is blocking the rest of your web application until it
    is closed.


    # Solution


    The angular-ui module''s nice modal plugin which directly supports Twitter Bootstrap.
    The template defines a button to open the modal and the modal code itself.


    ```

    <body ng-app="MyApp" ng-controller="MyCtrl">

    <button class="btn" ng-click="open()">Open Modal</button>

    <div class="showModal" close="cancel()">

    <div class="modal-header">

    <h4>Modal Dialog</h4>

    </div>

    <div class="modal-body">

    <p>Example paragraph with some text.</p>

    </div>

    <div class="modal-footer">

    <button class="btn btn-success" ng-click="ok()">Ok</button>

    <button class="btn" ng-click="cancel()">Cancel</button>

    </div>

    </div>

    </div>

    </body>

    ```'
- md: "\n# Common User Interface Patterns 83\n\nNote, that even though we don't specify\
    \ explicitly the modal dialog is hidden initially via the modal attribute. The\
    \ controller only handles the button click and the showModal value used by the\
    \ modal attribute.\n\n```javascript\nvar app = angular.module(\"MyApp\", [\"ui.bootstrap.modal\"\
    ]);\n\n$scope.open = function() {\n  $scope.showModal = true;\n};\n\n$scope.ok\
    \ = function() {\n  $scope.showModal = false;\n};\n\n$scope.cancel = function()\
    \ {\n  $scope.showModal = false;\n};\n```\n\nDo not forget to download and include\
    \ the angular-ui file in a script tag. The module dependency is defined directly\
    \ via \"ui.bootstrap.modal\". The full example is available on Github including\
    \ the angular-ui module.\n\nYou can find the complete example on github⁸⁶.\n\n\
    # Discussion\n\nThe modal as defined in the template is straight from the Twitter\
    \ bootstrap documentation⁸⁷ We can control the visibility with the modal attribute.\
    \ Additionally, the close attribute defines a close function which is called whenever\
    \ the dialog is closed. Note, that could happen when the user presses the escape\
    \ key or clicking outside the modal.\n\nOur cancel button uses the same function\
    \ to close the modal manually, whereas the okay button uses the ok function. This\
    \ makes it easy for us to distinguish if a user simply cancelled the modal or\
    \ actually pressed the ok button.\n\n# Displaying a Loading Spinner\n\n# Problem\n\
    \nYou want to display a loading spinner while waiting for an AJAX request to be\
    \ finished.\n\n> 87 https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter8/recipe\n\
    > 88 https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter8/recipe\n\
    > 89 http://twitter.github.com/Bootstrapjavascript.html#modals\n\nCommon User\
    \ Interface Patterns\n\n# Solution\n\nWe use the Twitter search API for our example\
    \ to render a list of search results. When pressing the AJAX request is run and\
    \ the spinner image should be shown until the request is done.\n\n```html\n<body\
    \ ng-app=\"MyApp\" ng-controller=\"MyCtrl\">\n  <div>\n    <button class=\"btn\"\
    \ ng-click=\"load()\">Load Tweets</button>\n    <img id=\"spinner\" ng-src=\"\
    img/spinner.gif\" style=\"display:none;\">\n  </div>\n  <ul ng-repeat=\"tweet\
    \ in tweets\">\n    <li>\n      <img ng-src=\"{{tweet.profile_image_url}}\" alt=\"\
    \">\n      &nbsp; {{tweet.from_user}}\n      {{tweet.text}}\n    </li>\n  </ul>\n\
    </div>\n</body>\n```\n\nAngular.js interceptor for all AJAX calls is used which\
    \ allows to execute code before the actual request is started and when it is finished.\n\
    \n```javascript\nvar app = angular.module(\"MyApp\", [\"Resource\"]);\napp.config(function\
    \ ($httpProvider) {\n  $httpProvider.responseInterceptors.push('myInterceptor');\n\
    \n  var spinnerFunction = function spinnerFunction(data, headersGetter) {\n  \
    \  $(\"#Spinner\").show();\n    return data;\n  };\n\n  $httpProvider.defaults.transformRequest.push(spinnerFunction);\n\
    });\napp.factory('myInterceptor', function ($q, $window) {\n  return function\
    \ (promise) {\n```\n\n```javascript\n  return promise.then(function (response)\
    \ {\n    $(\"#spinner\").hide();\n    return response;\n  }, function (response)\
    \ {\n    $(\"#spinner\").hide();\n    return $q.reject(response);\n  });\n});\n\
    ```\n\nNote, that we use jQuery to show the spinner in the configuration step\
    \ and hide the spinner in the interceptor.\n\nAdditionally we use a controller\
    \ to handle the button click and executing the search request.\n\n```javascript\n\
    app.controller(\"MyCtrl\", function($scope, $resource, $rootScope) {\n  $scope.resultsPage\
    \ = 5;\n  $scope.page = 1;\n  $scope.searchTerm = \"angularjs\";\n  $scope.twitter\
    \ = $resource(\"http://search.twitter.com/search.json\", {\n    callback:'JSON_CALLBACK',\n\
    \    page: $scope.page,\n    rpp: $scope.resultsPage,\n    q: $scope.searchTerm\n\
    \  }, { get: { method:'JSONP' } });\n  $scope.load = function() {\n    $scope.twitter.get(function(data)\
    \ {\n      $scope.tweets = data.results;\n    });\n  };\n});\n```\n\nDon't forget\
    \ that addResource to the module and load it via script tag.\n\nYou can find the\
    \ complete example on github⁸⁸\n\n# Discussion\n\nThe template is the easy part\
    \ of this recipe it renders a list of tweets using the ng-repeat directive. Let\
    \ us jump straight to the interceptor code.\n\nThe interceptor is implemented\
    \ using the factory method and attaches itself to the promise function of the\
    \ AJAX response to hide the spinner on success or failure. Note, on failure we\
