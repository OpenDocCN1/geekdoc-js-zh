  - "[PAGE 32]\n\nNote, the compile method only has access to the templates element\
    \ element and template attributes. It has no access to the scope and you therefore\
    \ can't use $watch to add behaviour. This is in comparison to the link function\
    \ which has access to the DOM \"instance\" (after the compile phase) and has access\
    \ to the scope to add behaviour.\n\nUse the compile function for template DOM\
    \ manipulation. Use the link function when you want to add behaviour.\n\nNote,\
    \ that you can use compile and link function combined. In this case the compile\
    \ function must return the link function. An example when you want to react to\
    \ a click on the header:\n\n```\ncompile: function(tElement, attrs) {\n  var content\
    \ = tElement.children();\n  for (var i=1; i<attrs.repeat; i++) {\n    tElement.append(content.clone());\n\
    \  }\n  return function (scope, element, attrs) {\n    element.on(\"click\", \"\
    hi\", function() {\n      $(this).css(\"background-color\": \"red\")\\n    });\n\
    \  });\n}\n```\n\nClicking the header will change the background color to red.\n\
    \n# Directive to Directive Communication\n\n# Problem\n\nYou want a directive\
    \ to communicate with another directive and augment each other's behaviour using\
