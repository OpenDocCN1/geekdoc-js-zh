    : \"red\"});\n});\n```\n\nIn this case element is already a jQuery element and\
    \ we can directly use the on function.\n\n## Rendering an HTML Snippet in a Directive\n\
    \n### Problem\n\nYou want to render an HTML snippet as a reusable component.\n\
    \n### Solution\n\nImplement a directive and use the template attribute to define\
    \ the HTML.\n\n```html\n<body ng-app=\"MyApp\">\n  <my-widget/>\n</body\n\nvar\
    \ app = angular.module(\"MyApp\", []);\napp.directive(\"myWidget\", function()\
    \ {\n  return {\n    restrict: \"E\",\n    template: \"<p>Hello World</p>\"\n\
    \  };\n});\n```\n\nYou can find the complete example on github²⁵.\n\n### Discussion\n\
    \nThis will render the Hello World paragraph as a child node of your my-widget\
    \ element. In case you want to replace the element entirely with the paragraph\
    \ you have to additionally return the replace attribute:\n\n> ²⁵https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe3\n\
    \n```javascript\napp.directive(\"myWidget\", function() {\n  return {\n    restrict:\
    \ \"E\",\n    replace: true,\n    template: \"<p>Hello World</p>\"\n  };\n});\n\
    ```\n\nAnother option would be to use a file for the HTML snippet. In this case\
    \ you need to use the templateUrl attribute, for example:\n\n```javascript\napp.directive(\"\
    myWidget\", function() {\n  return {\n    restrict: \"E\",\n    replace: true,\n\
    \    templateUrl: \"widget.html\"\n  };\n});\n```\n\nThe widget.html should reside\
    \ in the same directory as the index.html file. This will only work if you use\
    \ a web server to host the file. The example on Github uses angular-seed as bootstrap\
    \ again.\n\n## Rendering a Directive's DOM Node Children\n\n### Problem\n\nYour\
    \ widget uses the child nodes of the directive element to create a combined rendering.\n\
    \n### Solution\n\nUse the transclude attribute together with the ng-transclude\
    \ directive.\n\n### Directives\n\n```html\n<my-widget>\n<p>This is my paragraph\
    \ text.</p>\n</my-widget>\n\nvar app = angular.module(\"MyApp\", []);\n\napp.directive(\"\
    myWidget\", function() {\n  return {\n    restrict: \"E\",\n    transclude: true,\n\
    \    template: \"<div ng-transclude><h3>Heading</h3></div>\"\n  };\n});\n```\n\
    \nThis will render a div element containing a h3 element and append the directives\
    \ child node with the paragraph element below.\n\nYou can find the complete example\
    \ on github.\n\n### Discussion\n\nIn this context transclusion refers to the inclusion\
    \ of a part of a document into another document by reference. The ng-transclude\
    \ attribute should be placed depending on where you want your child nodes to be\
    \ appended to.\n\n## Passing Configuration Params Using HTML Attributes\n\n###\
    \ Problem\n\nYou want to pass a configuration param to change the rendered output.\n\
    \n### Solution\n\nUse the attribute based directive and pass an attribute value\
    \ for the configuration. The attribute is passed as a parameter to the link function.\n\
    \n```html\n<body ng-app=\"MyApp\">\n<div my-widget=\"Hello World\"></div>\n</body>\n\
    ```\n\n```javascript\nvar app = angular.module(\"MyApp\", []);\n\napp.directive(\"\
    Widget\", function() {\n  var linkFunction = function(scope, element, attributes)\
    \ {\n    scope.text = attributes[\"myWidget\"];\n  };\n\nreturn {\n  restrict:\
    \ \"A\",\n  template: \"<p>{{text}}</p>\",\n  link: linkFunction,\n  };\n});\n\
    ```\n\nThis renders a paragraph with the text passed as the param.\nYou can find\
    \ the complete example on github².\n\n### Discussion\n\nThe link function has\
    \ access to the element and its attributes. It is therefore straightforward to\
    \ set the scope to the text passed as the attributes value and use in this template\
    \ evaluation.\nThe scope context is important though. The text we changed might\
    \ already be defined in the parent scope and use in another place of your app.\
    \ In order to isolate the context and thereby using it only locally inside your\
    \ directive we have to return an additional scope attribute.\n\n```javascript\n\
    return {\n  restrict: \"A\",\n  template: \"<p>{{text}}</p>\",\n  link: linkFunction,\n\
    \  scope: {}\n};\n```\n\nIn Angular this is an isolated scope. It does not prototypically\
    \ inherit from the parent scope and is especially useful when creating reusable\
    \ components.\nLets look into another way of passing parameters to the directive,\
    \ this time we define an HTML element my-widget.\n\n> ²https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe5\n\
    \n### Directives \n\n```javascript\n<my-widget2 text=\"Hello World\"></my-widget2>\n\
    app.directive(\"myWidget2\", function() {\n  return {\n    restrict: \"E\",\n\
    \    template: \"<p>{{text}}</p>\",\n    scope: {\n      text: \"@text\"\n   \
    \ }\n  };\n});\n```\n\nThe scope definition using @text is binding the text model\
    \ to the directive's attribute. Note, that changes on the parent scope will change\
    \ the local scope text, but not the other way around.\n\nIf you want instead to\
    \ have a bi-directional binding between the parent scope and the local scope,\
    \ you should use the equality character:\n\n```javascript\nscope: {\n  text: \"\
    =text\"\n}\n```\n\nChanges to the parent scope will change the local scope text,\
    \ but not the other way around.\n\nIf you want instead to have a bi-directional\
    \ binding between the parent scope and the local scope, you should use the equality\
    \ character:\n\n```html\n<my-widget-expr fn=\"count + 1\"></my-widget-expr>\n\
    app.directive(\"myWidgetExpr\", function() {\n  var linkFunction = function(scope,\
    \ element, attributes) {\n    scope.text = attributes[\"fn\"];\n  };\n  return\
    \ {\n    restrict: \"A\",\n    template: \"<p>{{text}}</p>\",\n    link: linkFunction,\n\
    \    scope: {}\n  };\n});\n```\n\nWe pass the function to the directive and since\
    \ the linkFunction.\n\n## Repeatedly Rendering Directive's DOM Children\n\n###\
    \ Problem\n\nYou want to render html snippet repeatedly using the child nodes\
    \ as stamp.\n\n### Solution\n\nImplement a ntimes function in your directive.\n\
    \n```html\n<repeat-ntimes repeat=\"10\">\n  <h1>Header</h1>\n  <p>This is the\
    \ paragraph.</p>\n</repeat-ntimes>\n```\n\n```javascript\nvar app = angular.module(\"\
    MyApp\", []);\napp.directive(\"repeatNtimes\", function() {\n  return {\n    restrict:\
    \ \"E\",\n    compile: function(tElement, attrs) {\n      var content = tElement.children();\n\
    \      for (var i=1; i<attrs.repeat; i++) {\n        tElement.append(content.clone());\n\
    \      }\n    }\n  };\n});\n```\n\nThis will render the header and paragraph 10\
    \ times.\n\n### Discussion\n\nThe directive repeat the child nodes as configured\
    \ in repeat attribute. It works similarly to the ng-repeat directive. The implementation\
    \ uses Angular elements methods to append the child nodes.\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe6\n\
    ³http://docs.angular.org/api/directive:ngRepeat\n"
  mdcn: "\n\n```javascript\nelement.on(\"click\", function() {\n  $(this).css({\"\
    background-color\": \"red\"});\n});\n```\n\n在这种情况下，element 已经是一个 jQuery 元素，我们可以直接使用\
    \ on 函数。\n\n## 在指令中渲染 HTML 片段\n\n### 问题\n\n你想要将一个 HTML 片段作为可重用组件进行渲染。\n\n### 解决方案\n\
    \n```html\n<body ng-app=\"MyApp\">\n  <my-widget/>\n</body\n\nvar app = angular.module(\"\
    MyApp\", []);\napp.directive(\"myWidget\", function() {\n  return {\n    restrict:\
    \ \"E\",\n    template: \"<p>Hello World</p>\"\n  };\n});\n```\n\n你可以在 github²⁵\
    \ 上找到完整的示例。\n\n### 讨论\n\n这将 Hello World 段落作为你的 my-widget 元素的子节点进行渲染。如果你想用该段落完全替换该元素，则必须额外返回\
    \ `replace` 属性：\n\n> ²⁵https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe3\n\
    \n```javascript\napp.directive(\"myWidget\", function() {\n  return {\n    restrict:\
    \ \"E\",\n    replace: true,\n    template: \"<p>Hello World</p>\"\n  };\n});\n\
    ```\n\n另一种选项是使用文件来存放 HTML 片段。在这种情况下，你需要使用 `templateUrl` 属性，例如：\n\n```javascript\n\
    app.directive(\"myWidget\", function() {\n  return {\n    restrict: \"E\",\n \
    \   replace: true,\n    templateUrl: \"widget.html\"\n  };\n});\n```\n\nwidget.html\
    \ 应该与 index.html 文件位于同一个目录下。这只有在你使用 Web 服务器托管该文件时才会生效。Github 上的示例再次使用了 angular-seed\
    \ 作为引导。\n\n## 渲染指令的 DOM 节点子元素\n\n### 问题\n\n你的组件使用了指令元素的子节点来创建一个组合渲染。\n\n### 解决方案\n\
    \n使用 `transclude` 属性配合 `ng-transclude` 指令。\n\n### 指令\n\n```html\n<my-widget>\n\
    <p>This is my paragraph text.</p>\n</my-widget>\n\nvar app = angular.module(\"\
    MyApp\", []);\n\napp.directive(\"myWidget\", function() {\n  return {\n    restrict:\
    \ \"E\",\n    transclude: true,\n    template: \"<div ng-transclude><h3>Heading</h3></div>\"\
    \n  };\n});\n```\n\n这将渲染一个包含 h3 元素的 div 元素，并将段落元素作为指令的子节点追加在其下方。\n\n你可以在 github\
    \ 上找到完整的示例。\n\n### 讨论\n\n在这种语境下，transclusion（包含）指的是通过引用将文档的一部分包含到另一个文档中。`ng-transclude`\
    \ 属性的放置位置取决于你希望将子节点追加到哪里。\n\n## 使用 HTML 属性传递配置参数\n\n### 问题\n\n你想要传递一个配置参数来更改渲染的输出。\n\
    \n### 解决方案\n\n使用基于属性的指令，并传递一个属性值作为配置。该属性作为参数传递给 `link` 函数。\n\n```html\n<body ng-app=\"\
    MyApp\">\n<div my-widget=\"Hello World\"></div>\n</body\n```\n\n```javascript\n\
    var app = angular.module(\"MyApp\", []);\n\napp.directive(\"Widget\", function()\
    \ {\n  var linkFunction = function(scope, element, attributes) {\n    scope.text\
    \ = attributes[\"myWidget\"];\n  };\n\nreturn {\n  restrict: \"A\",\n  template:\
    \ \"<p>{{text}}</p>\",\n  link: linkFunction,\n  };\n});\n```\n\n这渲染了一个带有参数传递的文本的段落。\n\
    你可以在 github² 上找到完整的示例。\n\n### 讨论\n\n`link` 函数可以访问元素及其属性。因此，将 scope 设置为通过属性值传递的文本并在该模板评估中使用它是直接的。\n\
    然而，scope 上下文非常重要。我们修改的文本可能已经在父作用域中定义，并用于应用的其他地方。为了隔离上下文并从而仅在指令内部本地使用，我们必须返回一个额外的\
    \ `scope` 属性。\n\n```javascript\nreturn {\n  restrict: \"A\",\n  template: \"<p>{{text}}</p>\"\
    ,\n  link: linkFunction,\n  scope: {}\n};\n```\n\n在 Angular 中，这是一个隔离作用域（isolated\
    \ scope）。它不会从父作用域通过原型继承，在创建可重用组件时特别有用。\n让我们看看另一种向指令传递参数的方法，这次我们定义了一个 HTML 元素 my-widget。\n\
    \n>²https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe5\n\
    \n### 指令 \n\n```javascript\n<my-widget2 text=\"Hello World\"></my-widget2>\napp.directive(\"\
    myWidget2\", function() {\n  return {\n    restrict: \"E\",\n    template: \"\
    <p>{{text}}</p>\",\n    scope: {\n      text: \"@text\"\n    }\n  };\n});\n```\n\
    \n使用 `@text` 的作用域定义是将文本模型绑定到指令的属性。注意，父作用域上的更改会改变本地作用域的文本，但反之不然。\n\n如果你希望在父作用域和本地作用域之间建立双向绑定，你应该使用等号字符：\n\
    \n```javascript\nscope: {\n  text: \"=text\"\n}\n```\n\n父作用域的更改会改变本地作用域的文本，但反之不然。\n\
    \n如果你希望在父作用域和本地作用域之间建立双向绑定，你应该使用等号字符：\n\n```html\n<my-widget-expr fn=\"count +\
    \ 1\"></my-widget-expr>\napp.directive(\"myWidgetExpr\", function() {\n  var linkFunction\
    \ = function(scope, element, attributes) {\n    scope.text = attributes[\"fn\"\
    ];\n  };\n  return {\n    restrict: \"A\",\n    template: \"<p>{{text}}</p>\"\
    ,\n    link: linkFunction,\n    scope: {}\n  };\n});\n```\n\n我们将函数传递给指令并通过 `linkFunction`。\n\
    \n## 重复渲染指令的 DOM 节点\n\n### 问题\n\n你想要使用子节点作为模板重复渲染 HTML 片段。\n\n### 解决方案\n\n在你的指令中实现一个\
    \ `ntimes` 函数。\n\n```html\n<repeat-ntimes repeat=\"10\">\n  <h1>Header</h1>\n\
    \  <p>This is the paragraph.</p>\n</repeat-ntimes>\n```\n\n```javascript\nvar\
    \ app = angular.module(\"MyApp\", []);\napp.directive(\"repeatNtimes\", function()\
    \ {\n  return {\n    restrict: \"E\",\n    compile: function(tElement, attrs)\
    \ {\n      var content = tElement.children();\n      for (var i=1; i<attrs.repeat;\
    \ i++) {\n        tElement.append(content.clone());\n      }\n    }\n  };\n});\n\
    ```\n\n这将把标题和段落渲染 10 次。\n\n### 讨论\n\n该指令根据 `repeat` 属性的配置重复子节点。它的工作方式与 `ng-repeat`\
    \ 指令类似。实现使用了 Angular 的方法来追加子节点。\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe6\n\
    ³http://docs.angular.org/api/directive:ngRepeat\n\n"
