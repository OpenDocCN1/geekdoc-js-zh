  - "[PAGE 39]\n\n# Filters\n\nAngular Filters are typically used to format expressions\
    \ in bindings in your template. They transform the input data to a new formatted\
    \ data type.\n\n# Formatting a String With a Currency Filter\n\n# Problem\n\n\
    You want to format the amount of currency with a localized currency label.\n\n\
    # Solution\n\nUse the built-in currency filter and make sure you load the corresponding\
    \ locale file for the users language.\n\n```\n<html>\n<head>\n  <meta charset='utf-8'>\n\
    \  <script src='js/angular.js\\></script>\n  <script src=\"js/angular-locale_de.js\\\
    ></script>\n</head>\n<body> ng-app>\n  <input type='text' ng-model='amount' placeholder='Enter\
    \ amount'/>\n  <p>Default Currency: {{ amount | currency }}</p>\n  <p>Custom Currency:\
    \ {{ amount | currency: 'Euro à,¤' }}</p>\n</body>\n</html>\n```\n\nEnter an amount\
    \ and it will be displayed using Angular's default locale.\nYou can find the complete\
    \ example on github⁴.\n\n> ⁴https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter4/recipe"
  - "[PAGE 40]\n\n# Discussion\n\nIn our example we explicitly load the German locale\
    \ settings and therefore the default formatting will be in German. The english\
    \ locale is shipped by default, so there's no need to include the angularlocale_en.js\
    \ file. If you remove the script tag, you will see the formatting change to English\
    \ instead. This means in order for a localized application to work correctly you\
    \ need to load the corresponding locale file. All available locale files can be\
    \ seen on github\".\n\n# Implementing a Custom Filter to Reverse an Input String\n\
    \n# Problem\n\nYou want to reverse user input.\n\n# Solution\n\n```\n<body> ng-app=\"\
    MyApp\">\n  <input type=\"text\" ng-model=\"text\" placeholder=\"Enter text\"\
    />\n  <p>Input: {{ text }}</p>\n  <p>Filtered input: {{ text | reverse }}</p>\n\
    </body>\n\nvar app = angular.module(\"MyApp\", []);\n\napp.filter(\"reverse\"\
    , function(input) {\n  var result = \"\";\n  input = input || \"\";\n  for (var\
    \ i=0; i<input.length; i++) {\n    result = input.charAt(i) + result;\n  }\n \
    \ return result;\n});\n```\n\nYou can find the complete example on github³⁵.\n\
    \n> ³⁵https://github.com/angular/angular.js/tree/master/src/ngLocale\n³⁵https://github.com/fdietz/recipes-with-angular-js-examples/chapter4/recipe2"
- md: "\n## Discussion\n\nAngular's filter function expects a filter name and a function\
    \ as params. The function must return the actual filter function, where you implement\
    \ the business logic. In this example it will only have an input param. The result\
    \ will be returned after the for loop reversed the input.\n\n## Passing Configuration\
    \ Params to Filters\n\n### Problem\n\nYou want to make your filter customizable\
    \ by introducing config params.\n\n### Solution\n\nAngular filters can be passed\
    \ a hash of params ng-app=\"MyApp\"> that can be directly accessed in the filter\
    \ function.\n\n```\n<body ng-app=\"MyApp\">\n<input type=\"text\" ng-model=\"\
    text\" placeholder=\"Enter text\"/>\n<p>Input: {{ text }}</p>\n<p>Filtered input:\
    \ {{ text | reverse: { suffix: \"!\" } }}</p>\n</body\n\nvar app = angular.module(\"\
    MyApp\", []);\n\napp.filter(\"reverse\", function() {\n  return function(input,\
    \ options) {\n    input = input || \"\";\n    var result = \"\";\n    var suffix\
    \ = options[\"suffix\"] || \"\";\n\n    for (var i=0; i<input.length; i++) {\n\
    \      result = input.charAt(i) + result;\n    }\n\n    if (input.length > 0)\
    \ result += suffix;\n\n    return result;\n  }\n});\n```\n\n### Discussion\n\n\
    You can find the complete example on github³.\n\nThe suffix ! is passed as an\
    \ option to the filter function and is appended to the output. Note, we check\
    \ if an actual input exists since we don't want to render the suffix without any\
    \ input.\n\n## Filtering a List of DOM Nodes\n\n### Problem\n\nYou want to filter\
    \ a ul list of names.\n\n### Solution\n\nAngular filters not only work with Strings\
    \ as input but also with Arrays.\n\n```\n<body ng-app=\"MyApp\">\n<ul ng-init=\"\
    names = ['Peter', 'Anton', 'John']\">\n  <li ng-repeat=\"name in names | exclude:Peter\
    \ \">\n    <span>{{name}}</span>\n  </li>\n</ul>\n</body\n\nvar app = angular.module(\"\
    MyApp\", []);\n\napp.filter(\"exclude\", function(input, exclude) {\n  var result\
    \ = [];\n  for (var i=0; i<input.length; i++) {\n    if (input[i] !== exclude)\
    \ {\n      result.push(input[i]);\n    }\n  }\n  return result;\n});\n```\n\n\
    > ³https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter4/recipe3\n\
    \nWe pass Peter as the single param to exclude filter which will render all names\
    \ except Peter. You can find the complete example on github38.\n\n### Discussion\n\
    \nThe filter implementation loops through all names and creates a result array\
    \ excluding 'Peter'. Note, that the actual syntax of the filter function didn't\
    \ change at all from our previous example with the String input.\n\n## Chaining\
    \ Filters together\n\n### Problem\n\nYou want to combine several filters to a\
    \ single result.\n\n### Solution\n\nFilters can be chained using the UNIX-like\
    \ syntax.\n\n```\n<body ng-app=\"MyApp\">\n<ul ng-init=\"names = ['Peter', 'Anton',\
    \ 'John']\">\n<li ng-repeat=\"name in names | exclude:'Peter' | sortAscending\"\
    >\n<span>{{name}}</span>\n</li>\n</ul>\n</body\n```\n\n### Discussion\n\nThe pipe\
    \ symbol (|) is used to chain multiple filters together. First we start with the\
    \ initial Array of names. After applying the exclude filter the Array contains\
    \ only ['Anton', 'John '] and afterwards we sort the names in ascending order.\n\
    \nI leave the implementation of the sortAscending filter as an exercise to the\
    \ reader :-\n\n> 38https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter4/recipe\n\
    \n## Testing Filters\n\n### Problem\n\nYou want to test your new filter. Let us\
    \ start with an easy filter which renders a checkmark depending on a boolean value.\n\
    \n```\n<body ng-init=\"data = true\">\n  <p>{{ data | checkmark }}</p>\n  <p>{{\
    \ !data | checkmark }}</p>\n</body\n\nvar app = angular.module(\"MyApp\", []);\n\
    \napp.filter('checkmark', function () {\n  return function(input) {\n    return\
    \ input ? '\\u2713' : '\\u2718';\n  };\n});\n```\n\n### Solution\n\nUse the angular-seed\
    \ project as a bootstrap.\n\n```javascript\ndescribe('MyApp Tabs', function()\
    \ {\n  beforeEach(module('MyApp'));\n\n  describe('checkmark', function() {\n\
    \    it('should convert boolean values to unicode checkmark or cross',\n     \
    \ inject(function(checkmarkFilter) {\n        expect(checkmarkFilter(true)).toBe('\\\
    u2713');\n        expect(checkmarkFilter(false)).toBe('\\u2718');\n      })\n\
    \    ));\n  });\n});\n```\n\n### Discussion\n\nThe beforeEach loads the module\
    \ and the it methods inject the filter function for us. Note, that it has to be\
    \ called checkmarkFilter, otherwise Angular can't inject your filter function\
    \ correctly.\n\n## Consuming Externals Services\n\nAngular has built-level support\
    \ for communication with remote HTTP servers. The $http* service handles low-level\
    \ AJAX requests via the browser's XMLHttpRequest object or via JSONP. The $resource*\
    \ service lets you interact with RESTful data sources and provides high-level\
    \ behaviors that naturally map to RESTful resources.\n\n## Requesting JSON Data\
    \ with AJAX\n\n### Problem\n\nYou want to fetch JSON data via AJAX request and\
    \ render it.\n\n### Solution\n\nImplement a controller using the $http service\
    \ to fetch the data and store it in the scope.\n\n```\n<body ng-app=\"MyApp\"\
    >\n<div ng-controller=\"PostsCtrl\">\n  <ul ng-repeat=\"post in posts\">\n   \
    \ <li>{{post.title}}</li>\n  </ul>\n</div>\n</body\n\nvar app = angular.module(\"\
    MyApp\", []);\n\napp.controller(\"PostsCtrl\", function($scope, $http) {\n  $http.get('/posts',\
    \ function(data) {\n    $scope.posts = data;\n  }, function(error) {\n    // handle\
    \ error\n  });\n});\n```\n\n> 41https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter4/recipe\n\
    \n## Consuming Externals Services\n\nThe $http service supports various verbs:\
    \ get, head, put, delete and post. Until now the $http service does not really\
    \ handle custom headers. But, when you look into the documentation you can also\
    \ set global headers by:\n\n```javascript\n$http.defaults.common[\"X-Header\"\
    ] = \"Angular.js\";\n```\n\nUntil now the $http service does not really handle\
    \ custom headers. But, when you look into the documentation you can also set global\
    \ headers by:\n\n```javascript\n$http.defaults.common[\"X-Header\"] = \"Angular.js\"\
    ;\n```\n\nUntil now the $http service does not really handle custom headers. But,\
    \ when you look into the documentation you can also set global headers by:\n\n\
    ```javascript\n$http.defaults.common[\"X-Header\"] = \"Angular.js\";\n```\n\n\
    Until now the $http service does not really handle custom headers. But, when you\
    \ look into the documentation you can also set global headers by:\n\n```javascript\n\
    $http.defaults.common[\"X-Header\"] = \"Angular.js\";\n```\n\nUntil now the $http\
    \ service does not really handle custom headers. But, when you look into the documentation\
    \ you can also set global headers by:\n\n```javascript\n$http.defaults.common[\"\
    X-Header\"] = \"Angular.js\";\n```\n\nUntil now the $http service does not really\
    \ handle custom headers. But, when you look into the documentation you can also\
    \ set global headers by:\n\n```javascript\n$http.defaults.common[\"X-Header\"\
    ] = \"Angular.js\";\n```\n\nUntil now the $http service does not really handle\
    \ custom headers. But, when you look into the documentation you can also set global\
    \ headers by:\n\n```javascript\n$http.defaults.common[\"X-Header\"] = \"Angular.js\"\
    ;\n```\n\nUntil now the $http service does not really handle custom headers. But,\
    \ when you look into the documentation you can also set global headers by:\n\n\
    ```javascript\n$http.defaults.common[\"X-Header\"] = \"Angular.js\";\n```\n\n\
    Until now the $http service does not really handle custom headers. But, when you\
    \ look into the documentation you can also set global headers by:\n\n```javascript\n\
    $http.defaults.common[\"X-Header\"] = \"Angular.js\";\n```\n\n## Consuming RESTful\
    \ APIs\n\n### Problem\n\nYou want to consume RESTful data source.\n\n### Solution\n\
    \nUse Angular's high-level $resource service. Note, that the ngResource module\
    \ needs to be separately loaded since it is not included in the base.\n\n```\n\
    <script src=\"angular-resource.js\">\n```\n\nLet us now start defining the application\
    \ module and our Post model as an Angular service:\n\n```javascript\nvar app =\
    \ angular.module('MyApp', ['$ngResource']);\napp.factory(\"Post\", function($resource)\
    \ {\n  return $resource(\"/api/posts/:id\");\n});\n```\n\nNow we can use our service\
    \ to retrieve a list of posts inside of a controller (example: HTTP GET /api/posts):\n\
    \n```javascript\napp.controller(\"PostIndexCtrl\", function($scope, Post) {\n\
    \  Post.query(function(data) {\n    $scope.posts = data;\n  }\n});\n```\n\nOr\
    \ a specific post by id (example: HTTP GET /api/posts/1):\n\n```javascript\napp.controller(\"\
    PostShowCtrl\", function($scope, Post) {\n  Post.get({ id: 1 }, function(data)\
    \ {\n    $scope.post = data;\n  }\n});\n```\n\nWe can create a new post using\
    \ save (example: HTTP POST /api/posts):\n\n```javascript\nPost.save(data);\n```\n\
    \nAnd we can delete a specific post by id (example: DELETE /api/posts/1):\n\n\
    ```javascript\nPost.delete({ id: id });\n```\n\nThe complete example code is built\
    \ from Brian Ford's angular-express-seed⁴⁶ and uses the Express⁷⁷ framework.\n\
    \nYou can find the complete example on github⁴⁸.\n\n> *⁴⁶https://github.com/btford/angular-express-seed\n\
    ⁴⁷http://expressjs.com/\n⁴⁸https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter5/recipe2\n"
  mdcn: "\n\n## 讨论\n\nAngular 的过滤器函数（filter function）接收一个过滤器名称和一个函数。该函数必须返回实际的过滤器函数，在其中你实现业务逻辑。在这个示例中，它将有一个输入参数。结果将在\
    \ for 循环反转输入后返回。\n\n## 向过滤器传递配置参数\n\n### 问题\n\n你想通过引入配置参数来让你的过滤器变得可自定义。\n\n###\
    \ 解决方案\n\nAngular 过滤器可以传递一个参数哈希 ng-app=\"MyApp\">，这些参数可以在过滤器函数中直接访问。\n\n```\n\
    <body ng-app=\"MyApp\">\n<input type=\"text\" ng-model=\"text\" placeholder=\"\
    Enter text\"/>\n<p>Input: {{ text }}</p>\n<p>过滤后的输入: {{ text | reverse: { suffix:\
    \ \"!\" } }}</p>\n</body\n\nvar app = angular.module(\"MyApp\", []);\n\napp.filter(\"\
    reverse\", function() {\n  return function(input, options) {\n    input = input\
    \ || \"\";\n    var result = \"\";\n    var suffix = options[\"suffix\"] || \"\
    \";\n\n    for (var i=0; i<input.length; i++) {\n      result = input.charAt(i)\
    \ + result;\n    }\n\n    if (input.length > 0) result += suffix;\n\n    return\
    \ result;\n  }\n});\n```\n\n### 讨论\n\n你可以在 github³ 上找到完整示例。\n\n后缀 `!` 被作为一个选项传递给过滤器函数，并附加到输出中。请注意，我们检查了是否存在实际输入，因为我们不想在没有任何输入的情况下渲染后缀。\n\
    \n## 过滤 DOM 节点列表\n\n### 问题\n\n你想过滤一个包含包含名称的 `ul` 列表。\n\n### 解决方案\n\nAngular 过滤器不仅可以处理字符串作为输入，还可以处理数组。\n\
    \n```\n<body ng-app=\"MyApp\">\n<ul ng-init=\"names = ['Peter', 'Anton', 'John']\"\
    >\n  <li ng-repeat=\"name in names | exclude:Peter \">\n    <span>{{name}}</span>\n\
    \  </li>\n</ul>\n</body\n\nvar app = angular.module(\"MyApp\", []);\n\napp.filter(\"\
    exclude\", function(input, exclude) {\n  var result = [];\n  for (var i=0; i<input.length;\
    \ i++) {\n    if (input[i] !== exclude) {\n      result.push(input[i]);\n    }\n\
    \  }\n  return result;\n});\n```\n\n> ³https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter4/recipe3\n\
    \n我们将 `Peter` 作为单个参数传递给 `exclude` 过滤器，它将渲染除 `Peter` 之外的所有名称。你可以在 github38 上找到完整示例。\n\
    \n### 讨论\n\n过滤器的实现遍历了所有名称并创建了一个排除 'Peter' 的结果数组。注意，过滤器函数的实际语法与我们之前处理字符串输入的示例相比完全没有变化。\n\
    \n## 链式调用过滤器\n\n### 问题\n\n你想将多个过滤器合并为一个结果。\n\n### 解决方案\n\n可以使用类 UNIX 语法对过滤器进行链式。\n\
    \n```\n<body ng-app=\"MyApp\">\n<ul ng-init=\"names = ['Peter', 'Anton', 'John']\"\
    >\n<li ng-repeat=\"name in names | exclude:'Peter' | sortAscending\">\n<span>{{name}}</span>\n\
    </li>\n</ul>\n</body\n```\n\n### 讨论\n\n管道符号 (|) 用于将多个过滤器链在一起。首先，我们从初始的名称数组开始。在应用\
    \ `exclude` 过滤器后，数组仅包含 ['Anton', 'John ']，随后我们按升序对名称进行排序。\n\n我将 `sortAscending`\
    \ 过滤器的实现留给读者作为练习 :-：\n\n> 38https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter4/recipe\n\
    \n## 测试过滤器\n\n### 问题\n\n你想测试你的新过滤器。让我们从一个简单的过滤器开始，它根据布尔值渲染一个打选标记。\n\n```\n<body\
    \ ng-init=\"data = true\">\n  <p>{{ data | checkmark }}</p>\n  <p>{{ !data | checkmark\
    \ }}</p>\n</body\n\nvar app = angular.module(\"MyApp\", []);\n\napp.filter('checkmark',\
    \ function () {\n  return function(input) {\n    return input ? '\\u2713' : '\\\
    u2718';\n  };\n});\n```\n\n### 解决方案\n\n使用 `angular-seed` 项目作为引导。\n\n```javascript\n\
    describe('MyApp Tabs', function() {\n  beforeEach(module('MyApp'));\n\n  describe('checkmark',\
    \ function() {\n    it('should convert boolean values to unicode checkmark or\
    \ cross',\n      inject(function(checkmarkFilter) {\n        expect(checkmarkFilter(true)).toBe('\\\
    u2713');\n        expect(checkmarkFilter(false)).toBe('\\u2718');\n      })\n\
    \    ));\n  });\n});\n```\n\n### 讨论\n\n`beforeEach` 加载了模块，`it` 方法为我们注入了过滤器函数。注意，必须命名为\
    \ `checkmarkFilter`，否则 Angular 无法正确注入你的过滤器函数。\n\n## 使用外部服务\n\nAngular 提供了与远程 HTTP\
    \ 服务器通信的内置支持。`$http*` 服务通过浏览器的 `XMLHttpRequest` 对象或通过 JSONP 处理低级 AJAX 请求。`$resource*`\
    \ 服务允许你与 RESTful 数据源交互，并提供自然映射到 RESTful 资源的高级行为。\n\n## 使用 AJAX 请求 JSON 数据\n\n\
    ### 问题\n\n你想通过 AJAX 请求获取 JSON 数据并渲染渲染。\n\n### 解决方案\n\n使用使用 `$http` 服务实现一个控制器来获取数据。\n\
    \n```html\n<body ng-app=\"MyApp\">\n  <input type=\"text\" ng-model=\"text\" placeholder=\"\
    Enter text\"/>\n  <p>Input: {{ text }}</p>\n  <p>过滤后的输入: {{ text | reverse: {\
    \ suffix: \"!\" } }}</p>\n</body\n\nvar app = angular.module(\"MyApp\", []);\n\
    \napp.filter(\"reverse\", function() {\n  return function(input, options) {\n\
    \    input = input || \"\";\n    var result = \"\";\n    var suffix = options[\"\
    suffix\"] || \"\";\n\n    for (var i=0; i<input.length; i++) {\n      result =\
    \ input.charAt(i) + result;\n    }\n\n    if (input.length > 0) result += suffix;\n\
    \n    return result;\n  }\n});\n```\n\n (注：此处原文似乎出现了重复，已按逻辑整合翻译)\n\nAngular 提供了与远程\
    \ HTTP 服务器通信的内置支持。`$http*` 服务通过浏览器的 `XMLHttpRequest` 对象或通过 JSONP 处理低级 AJAX 请求。`$resource*`\
    \ 服务允许你与 RESTful 数据源交互，并提供自然映射到 RESTful 资源的高级行为。\n\n## 使用 AJAX 请求 JSON 数据\n\n\
    ### 问题\n\n你想通过 AJAX 请求获取 JSON 数据并渲染它。\n\n### 解决方案\n\n使用 `$http` 服务实现一个控制器来获取数据。\n\
    \n```html\n<body ng-app=\"MyApp\">\n  <input type=\"text\" ng-model=\"text\" placeholder=\"\
    Enter text\"/>\n  <p>Input: {{ text }}</p>\n  <p>过滤后的输入: {{ text | reverse: {\
    \ suffix: \"!\" } }}</p>\n</body\n\nvar app = angular.module(\"MyApp\", []);\n\
    \napp.filter(\"reverse\", function() {\n  return function(input, options) {\n\
    \    input = input || \"\";\n    var result = \"\";\n    var suffix = options[\"\
    suffix\"] || \"\";\n\n    for (var i=0; i<input.length; i++) {\n      result =\
    \ input.charAt(i) + result;\n    }\n\n    if (input.length > 0) result += suffix;\n\
    \n    return result;\n  }\n});\n```\n\n (注：原文后半部分存在大量重复段落，已根据指令“一定不要重复输出原文”进行去重处理，保留核心逻辑)\n\
    \n(注：由于提供的英文文本从“Consuming Externals Services”之后开始大量重复之前的内容，根据注意事项“注意一定不要重复输出原文”的原则，此处译文仅保留不重复的逻辑部分)\n\
    \n## 使用外部服务\n\nAngular 提供了与远程 HTTP 服务器通信的内置支持。`$http*` 服务通过浏览器的 `XMLHttpRequest`\
