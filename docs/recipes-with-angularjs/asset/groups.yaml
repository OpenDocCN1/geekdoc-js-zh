- md: "\n## Backend Integration with Node Express\n\n```javascript\nexports.contact\
    \ = function(req, res) {\n  Contact.findOne({ _id: req.params.id }, function(err,\
    \ obj) {\n    res.json(obj);\n  });\n}\n```\n\nAs a last example we create a new\
    \ Contact instance passing in the request body and call the save method to persist\
    \ it:\n\n```javascript\nexports.createContact = function(req, res) {\n  var contact\
    \ = new Contact(req.body);\n  contact.save();\n  res.json(req.body);\n};\n```\n\
    \nYou can find the complete example on github¹⁰³.\n\n## Discussion\n\nLet have\
    \ a look again at the example for the contact function that retrieves a single\
    \ Contact. It uses _id instead of id as the parameter for the findOne function.\
    \ This underscore is intentional and used by MongoDB for its generated ids. In\
