  - '[PAGE 66]


    # Using Forms


    ```

    <form name="form" ng-submit="submit">

    <label>Firstname</label>

    <input name="firstname" type="text" ng-model="user.firstname required />

    <label>LastName</label>

    <input type="text" ng-model="user.lastname required />

    <label>Age</label>

    <input type="text" ng-model="user.age" />

    <br>

    <button class="btn">Submit</button>

    </form>

    ```


    It is the same form but this time we defined the name attribute on the form and
    made the input required for the firstname.


    Let us add more debug output below the form:


    +   Firstname valid: {{form.firstname.$valid}}

    <br>

    Firstname validation error: {{form.firstname.$error}}

    <br>

    Form valid: {{form.valid}}

    <br>

    Form validation error: {{form.$error}}


    You can find the complete example on github.


    # Discussion


    Starting with a fresh form, you notice that Angular adds the css class ng-pristine
    and ng-valid to the form tag and each input tag. When editing the form the ng-pristine
    class will be removed from the changed input field and instead it will be replaced
    by the ng-dirty class. Very useful you can easily add new features to your app
    depending on these states.


    In addition to these two classes there are more to look into. The ng-valid class
    will be added when an input is valid, otherwise the css class ng-invalid is added.
    Note, that the form also gets either a valid or invalid class depending on the
    input fields. To demonstrate this I''ve added the required HTML5 attribute. Initially,
    the firstname and lastname input fields are empty and therefore have the ng-invalid
    css class, whereas the age field has the ng-valid class. Additionally, there''s
    ng-invalid-required class alongside the ng-valid for even more specificity.


    > https://github.com/fdietz/recipes-with-angular-js/examples/tree/master/chapter7/recipe2'
- md: "\n## Using Forms 62\n\nSince we defined the name attribute on the form HTML\
    \ element we can now access Angular's form controller via scope variables. The\
    \ debug output we can check the validity and specific error for each named form\
    \ input and the form itself. Note, that this only works on the level of the form's\
    \ name attributes and not on the model scope. If you output the following expression\
    \ {{user.firstname.$error}} it will not work.\n\nAngular's form controller exposes\
    \ $valid, $invalid, $error, $pristine and $dirty variables.\n\nFor validation\
    \ Angular provides built-in directives including required, pattern, minlength,\
    \ maxlen, min and max.\n\nLet us use Angular's form integration to actually show\
    \ validation errors in the recipe.\n\n## Displaying Form Validation Errors \n\n\
    ### Problem\n\nYou want to show validation errors to the user by marking the input\
    \ field red and displaying an error message.\n\n### Solution\n\nWe can use the\
    \ ng-show directive to show an error message if a form input is invalid and CSS\
    \ classes to change the input element's background color depending on its state.\n\
    \nLet us start with the styling changes:\n\n```css\n<style type=\"text/css\">\n\
    input.ng-invalid.ng-dirty {\n  background-color: red;\n}\ninput.ng-valid.ng-dirty\
    \ {\n  background-color: green;\n}\n</style>\n```\n\nAnd here is a small part\
    \ of the form with an error message for the input field:\n\n## Using Forms\n\n\
    ```html\n<label>Firstname</label>\n<input name=\"firstname\" type=\"text\" ng-model=\"\
    user.firstname required>\n<p ng-show=\"form.firstname$invalid && form.firstname.$dirty\"\
    >\nFirstname is required\n</p>\n```\n\nYou can find the complete example on github⁶⁹.\n\
    \n## Discussion\n\nThe CSS classes ensure that we initially show the fresh form\
    \ without any classes. When the user starts typing in input for the first time,\
    \ we change it to either green or red. That is a good example usage of ng-dirty\
    \ and ng-invalid CSS classes.\n\nWe use the same logic in the ng-show directive\
    \ to only show the error message when the user starts typing for the first time.\n\
    \n## Displaying Form Validation Errors with the Twitter Bootstrap framework\n\n\
    ### Problem\n\nYou want to display form validation errors but the form is styled\
    \ using Twitter Bootstrap⁷⁰.\n\n### Solution\n\nWhen using the .horizontal-form\
    \ class Twitter Bootstrap uses div elements to structure label, input fields and\
    \ help messages into groups. The group div has the class control-group and the\
    \ actual controls are further nested in another div element with the CSS class\
    \ controls. Twitter Bootstrap shows a nice validation status when adding the CSS\
    \ error on the div with the control-group class.\n\nLet us start with the form:\n\
    \n## Using Forms\n\n```html\n<div controller=\"User\">\n  <form name=\"form\"\
    \ ng-submit=\"submit()\" novalidate>\n    <div class=\"control-group\" ng-class=\"\
    error('firstname')\">\n      <label class=\"control-label\" for=\"firstname\"\
    >Firstname</label>\n      <div class=\"controls\">\n        <input id=\"firstname\"\
    \ name=\"firstname\" type=\"text\"\n               ng-model=\"user.firstname\"\
    \ placeholder=\"Firstname\" required>\n        <span class=\"help-block\"\n  \
    \        ng-show=\"form.firstname.invalid && form.firstname.$dirty\">\n      \
    \    Firstname is required\n        </span>\n      </div>\n    </div>\n    <div\
    \ class=\"control-group\" ng-class=\"error('lastname')\">\n      <label class=\"\
    control-label\" for=\"lastname\">Lastname</label>\n      <div class=\"controls\"\
    >\n        <input id=\"lastname\" name=\"lastname\" type=\"text\"\n          \
    \     ng-model=\"user.lastname\" placeholder=\"Lastname\" required>\n        <span\
    \ class=\"help-block\"\n          ng-show=\"form.lastname.invalid && form.lastname.$dirty\"\
    >\n          Lastname is required\n        </span>\n      </div>\n    </div>\n\
    \    <div class=\"control-group\">\n      <div class=\"controls\">\n        <button\
    \ ng-disabled=\"form.$invalid\" class=\"btn\">Submit</button>\n      </div>\n\
    \    </div>\n  </form>\n</div>\n```\n\nNote, that we use the ng-class directive\
    \ on the control-group div. So, lets look at the controller implementation of\
    \ the error function:\n\n## Using Forms\n\n```javascript\napp.controller(\"User\"\
    , function($scope) {\n  // ...\n  $scope.error = function(name) {\n    var s =\
    \ $scope.form[name];\n    return s.$invalid && s.$dirty ? \"error\" : \"\";\n\
    \  }\n});\n```\n\nThe error function gets the input name attribute passed as a\
    \ string and checks for $invalid and dirty flags to return the error class or\
    \ a blank string.\n\nYou can find the complete example on github¹.\n\n## Discussion\n\
    \nAgain check both the invalid and dirty flags, because we only show the error\
    \ message in case of the user actually changed the form. Note that this ng-class\
    \ usage is pretty typical in Angular since expressions do not support ternary\
    \ checks.\n\n## Only Enabling the Submit Button if the Form is Valid\n\n### Problem\n\
    \nYou want to disable the Submit button as long as the form contains invalid data.\n\
    \n### Solution\n\nUse the $form.invalid state in combination with a ng-disabled\
    \ directive. Here is the changed submit button:\n\n```html\n<button ng-disabled=\"\
    form.$invalid\" class=\"btn\">Submit</button>\n```\n\nYou can find the complete\
    \ example on github².\n\n> ¹https://github.com/fdietz/recipes-with-angular-examples/master/tree/chapter/7\n\
    ²https://github.com/fdietz/recipes-with-angular-examples/master/tree/chapter/5\n\
    \n## Discussion\n\nNote that this ng-class usage is pretty typical in Angular\
    \ since expressions do not support ternary checks. Note, that you have to assign\
    \ a name attribute to the form.\n\n## Implementing Custom Validations\n\n### Problem\n\
    \nYou want to validate user input by comparing it to a blacklist of words.\n\n\
    ### Solution\n\nThe angular-ui project offers a nice validation directive which\
    \ lets you pass in expression. Let us have a look at the template first with the\
    \ usage of ui:\n\n```html\n<input name=\"firstname\" type=\"text\"\nng-model=\"\
    user.firstname required\"\nui-validate=\"{ blacklisted: 'notBlackListed($value)'\
    \ }\">\n<p ng-show=\"form.firstname.$error.blacklisted\">\n  This firstname is\
    \ blacklisted.\n</p>\n```\n\nAnd the controller with notBlackListed implementation:\n\
    \n## Using Forms\n\n```javascript\nvar app = angular.module(\"MyApp\", [\"ui.directives\"\
    ]);\napp.controller(\"User\", function($scope) {\n  $scope.blacklist = ['idiot','loser'];\n\
    \  \n  $scope.notBlackListed = function(value) {\n    return $scope.blacklist.indexOf(value)\
    \ === -1;\n  }\n});\n```\n\n## Discussion\n\nFirst we need to explicitly list\
    \ our module dependency to the Angular module. Make sure you actually download\
    \ the javascript file and load it via script tag. Our blacklist contains the words\
    \ we do not want to accept and the notBlackListed function checks if the user\
    \ input matches any of the words defined in blacklist. The ui-validate directive\
    \ is pretty powerful since it lets you define your custom validations easily by\
    \ implementing the business logic in a controller function. If you want to know\
    \ even more, have a look at how to implement custom directives for yourself in\
    \ Angular’s excellent guide.\n\n> ⁴https://github.com/fdietz/recipes-with-angular-examples/master/tree/chapter/7\n\
    > ⁷https://docs.angular.org/guide/forms\n\n## User Interface Patterns\n\n### Filtering\
    \ and Sorting a List\n\n### Problem\n\nYou want to filter and sort a relatively\
    \ small list of items all available on the client.\n\n### Solution\n\nFor this\
    \ example we render a list of friends using the ng-repeat directive. Using the\
    \ built-in filter and orderBy we filter and sort the friends client-side.\n\n\
    ```html\n<body ng-app=\"MyApp\">\n  <div ng-controller=\"MyCtrl\">\n    <form\
    \ class=\"form-inline\">\n      <input ng-model=\"query\" type=\"text\" placeholder=\"\
    Filter by\" autofocus>\n    </form>\n    <ul ng-repeat=\"friend in friends | filter:query\
    \ | orderBy: 'name'\">\n      <li>{{friend.name}}</li>\n    </ul>\n  </div>\n\
    </body>\n```\n\nA plain text input field is used to enter the filter query and\
    \ bound to the filter. Any changes are therefore directly used to filter the list.\n\
    \nThe controller defines the default friends array:\n"
  mdcn: "\n\n## 使用表单\n\n由于我们在表单 HTML 元素上定义了 `name` 属性，现在可以通过作用域变量访问 Angular 的表单控制器。通过调试输出，我们可以检查每个命名表单输入框以及表单本身的有效性和特定错误。注意，这仅适用于表单名称属性层级，而不适用于模型作用域。如果你输出以下表达式\
    \ `{{user.firstname.$error}}` 将将不起作用。\n\nAngular 的表单控制器暴露 `$valid`、`$invalid`、\
    \ `$error`、 `$pristine` 和 `$dirty` 变量。\n\n对于验证，Angular 提供了内置指令，包括 `required`、`pattern`、`minlength`、`maxlen`、`min`\
    \ 和 `max`。\n\n让我们使用 Angular 的表单集成在示例中显示验证错误。\n\n## 显示表单验证错误\n\n### 问题\n\n你想通过将输入字段标记为红色并显示错误消息向用户显示错误。\n\
    \n### 解决方案\n\n我们可以使用 `ng-show` 指令在表单输入无效时显示错误消息，并使用 CSS 类根据状态更改输入元素的背景颜色。\n\n\
    让我们从样式更改开始：\n\n```css\n<style type=\"text/css\">\ninput.ng-invalid.ng-dirty {\n\
    \  background-color: red;\n}\ninput.ng-valid.ng-dirty {\n  background-color: green;\n\
    }\n</style>\n```\n\n这里是带有输入字段错误消息的表单部分：\n\n## 使用表单\n\n```html\n<label>Firstname</label>\n\
    <input name=\"firstname\" type=\"text\" ng-model=\"user.firstname required>\n\
    <p ng-show=\"form.firstname$invalid && form.firstname.$dirty\">\nFirstname is\
    \ required\n</p>\n```\n\n你可以在 github⁶⁹ 上找到完整示例。\n\n## 讨论\n\nCSS 类确保了我们最初显示不带任何类的原始表单。当用户第一次在输入框中输入时，我们将其变为绿色或红色。这是\
    \ `ng-dirty` 和 `ng-invalid` CSS 类的良好用法示例。\n\n我们在 `ng-show` 指令中使用了相同的逻辑，仅在用户第一次输入时才显示错误消息。\n\
    \n## 使用 Twitter Bootstrap 框架显示表单验证错误\n\n### 问题\n\n你想显示表单验证错误，但表单是使用 Twitter Bootstrap⁷⁰样式的。\n\
    \n### 解决方案\n\n使用 `.horizontal-form` 类时，Twitter Bootstrap 使用 `div` 元素将标签、输入字段和帮助消息结构化为组。组div`\
    \ 具有 `control-group` 类，实际控件进一步嵌套在另一个具有 CSS 类 `controls` 的 `div` 元素中。在带有 `control-group`\
    \ 类的 `div` 上添加 CSS 错误时，Twitter Bootstrap 会显示漂亮的验证状态。\n\n让我们从表单开始：\n\n## 使用表单\n\
    \n```html\n<div controller=\"User\">\n  <form name=\"form\" ng-submit=\"submit()\"\
    \ novalidate>\n    <div class=\"control-group\" ng-class=\"error('firstname')\"\
    >\n      <label class=\"control-label\" for=\"firstname\">Firstname</label>\n\
    \      <div class=\"controls\">\n        <input id=\"firstname\" name=\"firstname\"\
    \ type=\"text\"\n               ng-model=\"user.firstname\" placeholder=\"Firstname\"\
    \ required>\n        <span class=\"help-block\"\n          ng-show=\"form.firstname.invalid\
    \ && form.firstname.$dirty\">\n          Firstname is required\n        </span>\n\
    \      </div>\n    </div>\n    <div class=\"control-group\" ng-class=\"error('lastname')\"\
    >\n      <label class=\"control-label\" for=\"lastname\">Lastname</label>\n  \
    \    <div class=\"controls\">\n        <input id=\"lastname\" name=\"lastname\"\
    \ type=\"text\"\n               ng-model=\"user.lastname\" placeholder=\"Lastname\"\
    \ required>\n        <span class=\"help-block\"\n          ng-show=\"form.lastname.invalid\
    \ && form.lastname.$dirty\">\n          Lastname is required\n        </span>\n\
    \      </div>\n    </div>\n    <div class=\"control-group\">\n      <div class=\"\
    controls\">\n        <button ng-disabled=\"form.$invalid\" class=\"btn\">Submit</button>\n\
    \      </div>\n    </div>\n  </form>\n</div>\n```\n\n注意，我们在 `control-group` `div`\
    \ 上使用了 `ng-class` 指令。所以，让我们看看 `error` 函数的控制器实现：\n\n## 使用表单\n\n```javascript\n\
    app.controller(\"User\", function($scope) {\n  // ...\n  $scope.error = function(name)\
    \ {\n    var s = $scope.form[name];\n    return s.$invalid && s.$dirty ? \"error\"\
    \ : \"\";\n  }\n});\n```\n\n`error` 函数接收作为字符串传递的输入名称属性，并检查 `$invalid` 和 dirty\
    \ 标记，以返回错误类或空字符串。\n\n你可以在 github¹ 上找到完整示例。\n\n## 讨论\n\n再次检查 `invalid` 和 `dirty`\
    \ 标记，因为我们只在用户实际更改了表单的情况下才显示错误消息。注意，这种 `ng-class` 的用法在 Angular 中非常典型，因为表达式不支持三元检查。\n\
    \n## 仅在表单有效时启用提交按钮\n\n### 问题\n\n你想在表单包含无效数据时一直禁用提交按钮。\n\n### 解决方案\n\n使用 `$form.invalid`\
    \ 状态结合 `ng-disabled` 指令。这是更改后的提交按钮：\n\n```html\n<button ng-disabled=\"form.$invalid\"\
    \ class=\"btn\">Submit</button>\n```\n\n你可以在 github² 上找到完整示例。\n\n> ¹https://github.com/fdietz/recipes-with-angular-examples/master/tree/chapter/7\n\
    ²https://github.com/fdietz/recipes-with-angular-examples/master/tree/chapter/5\n\
    \n## 讨论\n\n注意这种 `ng-class` 的用法在 Angular 中非常典型，因为表达式不支持三元检查。注意，你必须为表单分配 `name`\
    \ 属性。\n\n## 实现自定义验证\n\n### 问题\n\n你想通过将用户输入与单词黑名单对比来验证用户输入。\n\n### 解决方案\n\n`angular-ui`\
    \ 项目提供了一个很好的验证指令，允许你传递表达式。让我们先看看使用 `ui:` 的模板：\n\n```html\n<input name=\"firstname\"\
    \ type=\"text\"\nng-model=\"user.firstname required\"\nui-validate=\"{ blacklisted:\
    \ 'notBlackListed($value)' }\">\n<p ng-show=\"form.firstname.$error.blacklisted\"\
    >\n  This firstname is blacklisted.\n</p>\n```\n\n以及带有 `notBlackListed` 实现的控制器：\n\
    \n## 使用表单\n\n```javascript\nvar app = angular.module(\"MyApp\", [\"ui.directives\"\
    ]);\napp.controller(\"User\", function($scope) {\n  $scope.blacklist = ['idiot','loser'];\n\
    \  \n  $scope.notBlackListed = function(value) {\n    return $scope.blacklist.indexOf(value)\
    \ === -1;\n  }\n});\n```\n\n## 讨论\n\n首先，我们需要向 Angular 模块显式列出我们的模块依赖。确保你确实下载了 JavaScript\
    \ 文件并通过 script 标签加载了它。我们的黑名单包含了我们不想接受的单词，而 `notBlackListed` 函数检查用户输入是否匹配黑名单中定义的任何单词。`ui-validate`\
    \ 指令非常强大，因为它允许你通过在控制器函数中实现业务逻辑来轻松地定义自定义验证。如果你想了解更多信息，请查看 Angular 优秀指南中关于如何为自己实现自定义指令。\n\
    \n> ⁴https://github.com/fdietz/recipes-with-angular-examples/master/tree/chapter/7\n\
    > ⁷https://docs.angular.org/guide/forms\n\n## 用户界面模式\n\n### 过滤和排序列表\n\n### 问题\n\
    \n你想对客户端所有可用的较短的项目列表进行过滤和排序。\n\n### 解决方案\n\n在例示例中，我们使用 `ng-repeat` 指令渲染了一个朋友列表。使用内置的\
    \ `filter` 和 `orderBy`，我们在客户端对朋友进行过滤和排序。\n\n```html\n<body ng-app=\"MyApp\">\n\
    \  <div ng-controller=\"MyCtrl\">\n    <form class=\"form-inline\">\n      <input\
    \ ng-model=\"query\" type=\"text\" placeholder=\"Filter by\" autofocus>\n    </form>\n\
    \    <ul ng-repeat=\"friend in friends | filter:query | orderBy: 'name'\">\n \
    \     <li>{{friend.name}}</li>\n    </ul>\n  </div>\n</body>\n```\n\n使用一个纯文本输入框来输入过滤查询，并将其绑定到过滤器。因此，任何更改都直接用于过滤列表。\n\
    \n控制器定义了默认的朋友数组：\n\n"
