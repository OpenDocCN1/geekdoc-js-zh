- md: "\n# Controllers\n\n```\n1 var app = angular.module(\"MyApp\", []);\n2\n3 app.factory(\"\
    UserService\", function() {\n4 var users = ['Peter\", \"Daniel\", \"Nina\"];\n\
    5\n6 return {\n7   all: function() {\n8     return users;\n9   },\n10  first:\
    \ function() {\n11    return users[0];\n12  }\n13 };\n14 });\n15\n16 app.controller(\"\
    MyCtrl\", function($scope, UserService) {\n17  $scope.users = UserService.all();\n\
    18 });\n19\n20 app.controller(\"AnotherCtrl\", function($scope, UserService) {\n\
    21  $scope.firstUser = UserService.first();\n22 });\n```\n\nYou can find the complete\
    \ example on github¹⁷.\n\n# Discussion\n\nThe factory method creates a singleton\
    \ UserService which returns two functions for retrieving all users and the first\
    \ user only. The controllers get the UserService injected by adding it to the\
    \ controller function as params.\n\nUsing dependency injection is quite nice for\
    \ testing your controllers, since you can inject a UserService stub easily. The\
    \ only downside is that you can't minify the code from without breaking it, since\
    \ the injection mechanism relies on the exact String representation of UserService.\
    \ It is therefore recommended to define dependencies using inline annotations,\
    \ which keeps working even when minified:\n\n> ¹⁷https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter2/recipe6\n\
    \n```\napp.controller(\"AnotherCtrl\", [\"$scope\", \"UserService\", function($scope,\
    \ UserService) {\n  $scope.firstUser = UserService.first();\n});\n```\n\nThe syntax\
