    \ {{friend.age}}</li>\n</ul\n```\n\n```javascript\n$scope.filterFunction = function(element)\
    \ {\n  return element.match(/Ma/) ? true : false;\n};\n```\n\n过滤器返回 true 或 false。在这个示例中，我们对以\
    \ \"Ma\" 开头的名称使用正则表达式正则表达式来过滤列表。\n\n# 客户端数据分页\n\n# 问题\n\n你有一个完全在客户端侧的数据表格，并想对这些数据进行分页处理。\n\
    \n# 解决方案\n\n使用带有 `ng-repeat` 指令的 HTML 表格元素来渲染当前页的项。所有的分页逻辑应该在自定义过滤器和控制器实现中处理。让我们从使用\
    \ Twitter Bootstrap 样式的表格和分页元素的模板开始：\n\n```\n<div ng-controller=\"PaginationCtrl\"\
    >\n<table class=\"table table-striped\">\n<head>\n<tr>\n<th>Id</th>\n<th>Name</th>\n\
    <th>Description</th>\n</tr>\n</head>\n<tbody>\n<tr ng-repeat=\"item in items |\n\
    offset: currentPage*itemsPerPage |\nlimitTo: itemsPerPage\">\n<td>{{item.id}}</td>\n\
    <td>{{item.name}}</td>\n<td>{{item.description}}</td>\n</tr>\n</tbody>\n<tfoot>\n\
    <td colspan=\"3\">\n  <div class=\"pagination\">\n    <ul>\n      <li ng-class=\"\
    prevPageDisabled()\">\n        <a href ng-click=\"prevPage()\">&laquo; Prev</a>\n\
    \      </li>\n      <li ng-repeat=\"n in range\"\n          ng-class=\"(active:\
    \ n == currentPage)\" ng-click=\"setPage(n)\">\n        <a href=\"#{{n+1}}\"></</a>\n\
    \      </li>\n      <li ng-class=\"nextPageDisabled()\">\n        <a href ng-click=\"\
    nextPage()\">Next &raquo;</a>\n      </li>\n    </ul>\n  </div>\n</td>\n</tfoot>\n\
    </table>\n</div>\n```\n\n`offset` 过滤器负责选择当前页的项子集。它在给定数组上使用 `slice` 函数，并将 `start`\
    \ 参数作为索引。\n\n```javascript\napp.filter('offset', function() {\n  return function(input,\
    \ start) {\n    start = parseInt(start, 10);\n    return input.slice(start);\n\
    \  }\n});\n```\n\n控制器管理实际的 $scope.items 数组，并处理启用/禁用分页按钮的逻辑。\n\n# 常见用户界面模式\n\n\
    ```\napp.controller(\"PaginationCtrl\", function($scope) {\n  $scope.itemsPerPage\
    \ = 5;\n  $scope.currentPage = 0;\n  $scope.items = [];\n\n  for (var i=0; i<50;\
    \ i++) {\n    $scope.items.push({\n      id: i, name: \"name\" + i, description:\
    \ \"description\" + i\n    });\n  }\n\n  $scope.prevPage = function() {\n    if\
    \ ($scope.currentPage > 0) {\n      $scope.currentPage--;\n    }\n  };\n\n  $scope.prevPageDisabled\
    \ = function() {\n    return $scope.currentPage === 0 ? \"disabled\" : \"\";\n\
    \  };\n\n  $scope.pageCount = function() {\n    return Math.ceil($scope.items.length\
    \ / $scope.itemsPerPage);\n  };\n\n  $scope.nextPage = function() {\n    if ($scope.currentPage\
    \ < $scope.pageCount()) {\n      $scope.currentPage++;\n    }\n  };\n\n  $scope.nextPageDisabled\
    \ = function() {\n    return $scope.currentPage === $scope.pageCount() ? \"disabled\"\
    \ : \"\";\n  };\n});\n```\n\n你可以在 github^7 上找到完整示例。\n\n> ^7https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter8/recipe2\n\
    \n# 讨论\n\n这种分页的最初想法通过查看 `ng-repeat` 渲染每个项行的用法来得到最好的解释：\n\n```\n<tr ng-repeat=\"\
    item in items |\n  offset: currentPage*itemsPerPage |\n  limitTo: itemsPerPage\"\
    >\n  <td>{{item.id}}</td>\n  <td>{{item.name}}</td>\n  <td>{{item.description}}</td>\n\
    </tr>\n```\n\n`offset` 过滤器使用 `currentPage*itemsPerPage` 来计算数组切片（slice）的偏移。我们使用内置的\
    \ `limitTo` 将数组过滤为指定的项目数量。所有这些都仅通过过滤器在客户端完成。控制器负责支持 `nextPage` 和 `prevPage` 动作，以及通过\
    \ `ng-class`: `nextPageDisabled` 检查这些动作禁用状态的辅助函数。`prevPage` 在递减 `currentPage`\
    \ 之前检查是否已到达第一页，`nextPage` 也是如此。这种分页的想法通过查看 `ng-repeat` 渲染每个项行的用法来得到最好的解释。\n\n\
    # 客户端数据数据分页\n\n# 问题\n\n你有一个完全在客户端侧的数据表格，并想对这些数据进行分页处理。\n\n# 解决方案\n\n使用带有 `ng-repeat`\
    \ 指令的 HTML 表格元素来渲染当前页的项。所有的分页逻辑应该在自定义过滤器和控制器实现中处理。让我们从使用 Twitter Bootstrap 样式的表格和分页元素的模板开始：\n\
    \n```\n<div ng-controller=\"PaginationCtrl\">\n<table class=\"table table-striped\"\
    >\n<head>\n<tr>\n<th>Id</th>\n<th>Name</th>\n<th>Description</th>\n</tr>\n</head>\n\
    <tbody>\n<tr ng-repeat=\"item in items |\noffset: currentPage*itemsPerPage |\n\
    limitTo: itemsPerPage\">\n<td>{{item.id}}</td>\n<td>{{item.name}}</td>\n<td>{{item.description}}</td>\n\
    </tr>\n</tbody>\n<tfoot>\n<td colspan=\"3\">\n  <div class=\"pagination\">\n \
    \   <ul>\n      <li ng-class=\"prevPageDisabled()\">\n        <a href ng-click=\"\
    prevPage()\">&laquo; Prev</a>\n      </li>\n      <li ng-repeat=\"n in range\"\
    \n          ng-class=\"(active: n == currentPage)\" ng-click=\"setPage(n)\">\n\
    \        <a href=\"#{{n+1}}\"></</a>\n      </li>\n      <li ng-class=\"nextPageDisabled()\"\
    >\n        <a href ng-click=\"nextPage()\">Next &raquo;</a>\n      </li>\n   \
    \ </ul>\n  </div>\n</td>\n</tfoot>\n</table>\n</div>\n```\n\n`offset` 过滤器负责选择当前页的项子集。它在给定数组上使用\
    \ `slice` 函数，并将 `start` 参数作为索引。\n\n```javascript\napp.filter('offset', function()\
    \ {\n  return function(input, start) {\n    start = parseInt(start, 10);\n   \
    \ return input.slice(start);\n  }\n});\n```\n\n控制器管理实际的 $scope.items 数组，并处理启用/禁用分页按钮的逻辑。\n\
    \n# 常见用户界面模式\n\n```\napp.controller(\"PaginationCtrl\", function($scope) {\n \
    \ $scope.itemsPerPage = 5;\n  $scope.currentPage = 0;\n  $scope.items = [];\n\n\
    \  for (var i=0; i<50; i++) {\n    $scope.items.push({\n      id: i, name: \"\
    name\" + i, description: \"description\" + i\n    });\n  }\n\n  $scope.prevPage\
    \ = function() {\n    if ($scope.currentPage > 0) {\n      $scope.currentPage--;\n\
    \    }\n  };\n\n  $scope.prevPageDisabled = function() {\n    return $scope.currentPage\
    \ === 0 ? \"disabled\" : \"\";\n  };\n\n  $scope.pageCount = function() {\n  \
    \  return Math.ceil($scope.items.length / $scope.itemsPerPage);\n  };\n\n  $scope.nextPage\
    \ = function() {\n    if ($scope.currentPage < $scope.pageCount()) {\n      $scope.currentPage++;\n\
    \    }\n  };\n\n  $scope.nextPageDisabled = function() {\n    return $scope.currentPage\
    \ === $scope.pageCount() ? \"disabled\" : \"\";\n  };\n});\n```\n\n你可以在 github^7\
    \ 上找到完整示例。\n\n> ^7https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter8/recipe2\n\
    \n# 讨论\n\n这种分页的最初想法通过查看 `ng-repeat` 渲染每个项行的用法来得到最好的解释：\n\n```\n<tr ng-repeat=\"\
    item in items |\n  offset: currentPage*itemsPerPage |\n  limitTo: itemsPerPage\"\
    >\n  <td>{{item.id}}</td>\n  <td>{{item.name}}</td>\n  <td>{{item.description}}</td>\n\
    </tr>\n```\n\n`offset` 过滤器使用 `currentPage*itemsPerPage` 来计算数组切片（slice）的偏移。我们使用内置的\
    \ `limitTo` 将数组过滤为指定的项目数量。所有这些都仅通过过滤器在客户端完成。控制器负责支持 `nextPage` 和 `prevPage` 动作，以及通过\
    \ `ng-class`: `nextPageDisabled` 检查这些动作禁用状态的辅助函数。`prevPage` 在递减 `currentPage`\
    \ 之前检查是否已到达第一页，`nextPage` 也是如此。这种分页的想法通过查看 `ng-repeat` 渲染每个项行的用法来得到最好的解释。\n\n\
    # 服务端数据分页\n\n# 问题\n\n你想要对服务端数据进行分页处理。\n\n# 解决方案\n\n你不能使用过滤器，因为那要求所有数据在客户端可用。相反，我们使用\
    \ `watch` 的实现。模板没有太大变化，只是 `ng-repeat` 看起来更简单了：\n\n```\n<tr ng-repeat=\"item in\
    \ pagedItems\">\n  <td>{{item.id}}</td>\n  <td>{{item.name}}</td>\n  <td>{{item.description}}</td>\n\
    </tr>\n```\n\n为了简化示例，我们通过提供服务端服务来伪造服务端。\n\n```javascript\napp.factory(\"Item\"\
    , function() {\n  var items = [];\n  for (var i=0; i<50; i++) {\n    items.push({\n\
    \      id: i, name: \"name\" + i, description: \"description\" + i\n    });\n\
    \  }\n\n  return {\n    get: function(offset, limit) {\n      return items.slice(offset,\
    \ limit);\n    },\n    total: function() {\n      return items.length;\n    }\n\
    \  };\n});\n```\n\n服务管理针对给定 `offset` 和 `limit` 的项列表。控制器依赖注入访问 Item 服务，并包含了与之前的相同的方法。\n\
    \n```javascript\napp.controller(\"PaginationCtrl\", function($scope, Item) {\n\
    \  $scope.itemsPerPage = 5;\n  $scope.currentPage = 0;\n\n  $scope.prevPage =\
    \ function() {\n    if ($scope.currentPage > 0) {\n      $scope.currentPage--;\n\
    \    }\n  };\n\n  $scope.prevPageDisabled = function() {\n    return $scope.currentPage\
    \ === 0 ? \"disabled\" : \"\";\n  };\n\n  $scope.nextPage = function() {\n   \
    \ if ($scope.currentPage < $scope.pageCount()) {\n      $scope.currentPage++;\n\
    \    }\n  };\n\n  $scope.nextPageDisabled = function() {\n    return $scope.currentPage\
    \ === $scope.pageCount() - 1 ? \"disabled\" : \"\";\n  };\n\n  $scope.pageCount\
    \ = function() {\n    return Math.ceil($scope.total / $scope.itemsPerPage);\n\
    \  };\n\n  $scope.watch(\"currentPage\", function(newVal, oldValue) {\n    $scope.pagedItems\
    \ =\n      Item.get(newVal * $scope.itemsPerPage, newVal * $scope.itemsPerPage\
    \ + $scope.itemsPerPage);\n    $scope.total = Item.total();\n  });\n});\n```\n\
    \n你可以在 github 上找到完整示例。\n\nhttps://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter8/recipe3\n\
    \n# 讨论\n\n当你选择下一页/上一页时，会更改 $scope.currentPage 的值，并触发 $watch 函数。它会获取当前页的刷新项以及总数，在客户端侧我们只有\
    \ `itemsPerPage` 定义的 5 个项，在分页时我们丢弃上一页的项并获取新项。如果你想在真实的后端尝试此，只需替换 Item 服务的实现。\n\n\
    # 无限结果分页\n\n# 问题\n\n你想要对服务端数据进行分页处理，使用一个“加载更多”按钮不断追加数据，直到没有更多可用数据。\n\n# 解决方案\n\
    \n让我们先看看 `ng-repeat` 指令是如何渲染表格的。\n\n```\n<div ng-controller=\"PaginationCtrl\"\
    >\n  <table class=\"table table-striped\">\n    <thead>\n      <tr>\n        <th>Id</th>\n\
    \        <th>Name</th>\n        <th>Description</th>\n      </tr>\n    </thead>\n\
    \    <tbody>\n      <tr ng-repeat=\"item in pagedItems\">\n        <td>{{item.id}}</td>\n\
    \        <td>{{item.name}}</td>\n        <td>{{item.description}}</td>\n     \
    \ </tr>\n    </tbody>\n    <tfoot>\n      <tr>\n        <td colspan=\"3\">\n \
    \       <button class=\"btn\" href=\"#\" ng-class=\"nextPageDisabledClass()\"\
    \ ng-click=\"loadMore()\">加载更多</button>\n      </td>\n    </tfoot>\n  </table>\n\
    </div>\n```\n\n"
