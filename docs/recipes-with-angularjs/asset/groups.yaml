    \ Contact.find(params[:id])\n    respond_with @contact\n  end\nend\n```\n\nThe\
    \ route definition uses an api scope to separate API requests from other requests.\n\
    \n+   Contacts.routes.draw\n  scope \"api\" do\n    resources :contacts\n  end\n\
    \nYou can find the complete example on github¹.\n\n# Discussion\n\nIf you want\
