- md: "\n## Discussion\n\nFollowing some conventions simplifies our code quite a bit.\
    \ We define the $resource by passing the URL schema only. This gives us a handful\
    \ of nice methods including query, get, save, remove and delete with our resource.\
    \ In the example above we implement several controllers to cover the typical use\
    \ cases. The get and query methods expect three arguments, the request parameters,\
    \ the success and the error callback. The save method expects four arguments,\
    \ the request parameters, the POST data, the success and the error callback.\n\
    \nThe $resource service currently does not support promises and therefore has\
    \ a distinctly different interface than the $http service. But we don't have to\
    \ wait long for it, since work has already started in the 1.1 development branch\
    \ to introduce promise support for the $resource service!\n\nThe returned object\
    \ of a $resource query or get function is a $resource instance which provides\
    \ $save, $remove and $delete methods. This allows you to easily fetch a resource\
    \ and update it in the following example:\n\n```\nvar post = Post.get({ id: i\
    \ }, function() {\n  post.title = \"My new title\";\n  post.save();\n});\n```\n\
    \nIt is important to notice, that the get call immediately returns an empty reference\
    \ - in our case the post variable. Once the data is returned from the server the\
    \ existing reference is populated and we can change our post title and use the\
    \ $save method conveniently.\n\nNote, that having an empty reference means that\
    \ our post will not be rendered in the template. Once the data is returned though,\
    \ the view automatically re-renders itself showing the new data.\n\n## Configuration\n\
    \nWhat if your response of posts is not an array but a more complex json? This\
    \ typically results in the following error:\n\n```\nTypeError: Object #<Resource>\
    \ has no method 'push'\n```\n\nAngular seems to expect your service to return\
    \ a JSON array. Have a look at the following JSON example which wraps a posts\
    \ array in a JSON object:\n\n```\n{\n  \"posts\": [\n    {\n      \"id\" : 1,\n\
    \      \"title\" : \"title 1\"\n    },\n    {\n      \"id\": 2,\n      \"title\"\
    : \"title 2\"\n    }\n  ]\n}\n```\n\nIn this case you have change the $resource\
    \ definition accordingly.\n\n```\napp.factory(\"Post\", function($resource) {\n\
    \  return $resource(\"/api/posts/:id\", {\n    query: { method: \"GET\", isArray:\
    \ false }\n  });\n});\n\napp.controller(\"PostIndexCtrl\", function($scope, Post)\
    \ {\n  Post.query(function(data) {\n    $scope.posts = data.posts;\n  });\n});\n\
    ```\n\nWe only change the configuration of the query action to not expect an array\
    \ and in our controller we can directly access data.posts.\n\nIt is generally\
    \ a good practice to encapsulate your model and $resource usage in an Angular\
    \ service module and inject that in your controller. This way you can easily reuse\
    \ the same model in different controllers and test it more easily.\n\n## Consuming\
    \ JSONP APIs\n\n### Problem\n\nYou want to call a JSONP API.\n\n### Solution\n\
    \nUse the $resource service and configure it to use JSONP. As an example we will\
    \ call the Twitter search API here.\n\nThe HTML template you enter a search term\
    \ in an input field and will render the search result in a list.\n\n```\n<body\
    \ ng-app=\"MyApp\">\n  <div ng-controller=\"MyCtrl\">\n    <input type=\"text\"\
    \ ng-model=\"searchTerm\" placeholder=\"Search term\">\n    <button ng-click=\"\
    search()\">Search</button>\n    <ul ng-repeat=\"tweet in searchResult.results\"\
    >\n      <li>{{tweet.text}}</li>\n    </ul>\n  </div>\n</body>\n```\n\nThe $resource\
    \ configuration can be done in a controller requesting the data:\n\n```\nvar app\
    \ = angular.module(\"MyApp\", [\"ngResource\"]);\n\nfunction MyCtrl($scope, $resource)\
    \ {\n  var TwitterAPI = \"http://search.twitter.com/search.json\",\n    callback:\
    \ \"JSON_CALLBACK\",\n    get: { method: \"JSONP\" });\n\n  $scope.search = function()\
    \ {\n    $scope.searchResult = TwitterAPI.get({ q: $scope.searchTerm });\n  };\n\
    }\n```\n\nYou can find the complete example on github.\n\n### Discussion\n\nThe\
    \ twitter search API supports a callback attribute for the JSON format as described\
    \ in their documentation¹² . The $resource definition sets the callback attribute\
    \ to JSON_CALLBACK, which is a convention from Angular when using JSONP³. It is\
    \ a placeholder which is replaced with the real callback function, generated by\
    \ Angular. Additionally we configure the method to use JSONP. Now, when calling\
    \ the API we use the q URL parameter to pass the entered searchTerm.\n\n> *¹https://github.com/dietz/recipes-with-angular-js-examples/tree/master/chapter5/recipe3\n\
    > ²https://dev.twitter.com/api/v1/search\n> ³https://en.wikipedia.org/wiki/JSONP\n\
    \n## Deferred and Promise\n\n### Problem\n\nYou want to synchronize multiple asynchronous\
    \ functions and avoid Javascript callback hell.\n\n### Solution\n\nAs an example\
    \ we want to call three services in sequence and combine the result of them. Let\
    \ us start with a nested approach:\n\n```\ntmp = [];\n\n$http.get(\"/app/data/first.json\"\
    ).success(function(data) {\ntmp.push(data);\n$http.get(\"/app/data/second.json\"\
    ).success(function(data) {\ntmp.push(data);\n$http.get(\"/app/data/third.json\"\
    ).success(function(data) {\ntmp.push(data);\n$http.get(\"/app/data/third.json\"\
    ).success(function(data) {\ntmp.push(data);\n$http.get(\"/app/data/third.json\"\
    ).success(function(data) {\ntmp.push(data);\n$http.get(\"/app/data/third.json\"\
