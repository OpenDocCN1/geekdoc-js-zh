  - "[PAGE 73]\n\n# Common User Interface Patterns\n\n# Filtering and Sorting a List\n\
    \n# Problem\n\nYou want to filter and sort a relatively small list of items all\
    \ available on the client.\n\n# Solution\n\nFor this example we render a list\
    \ of friends using the ng-repeat directive. Using the built-in filter and orderBy\
    \ we filter and sort the friends client-side.\n\n```\nbody ng-app=\"MyApp\">\n\
    \  <div ng-controller=\"MyCtrl\">\n    <form class=\"form-inline\">\n      <input\
    \ ng-model=\"query\" type=\"text\" placeholder=\"Filter by\" autofocus>\n    </form>\n\
    \    <ul ng-repeat=\"friend in friends | filter:query | orderBy: 'name'\">\n \
    \     <li>{{friend.name}}</li>\n    </ul>\n  </div>\n</body>\n```\n\nA plain text\
    \ input field is used to enter the filter query and bound to the filter. Any changes\
    \ are therefore directly used to filter the list.\n\nThe controller defines the\
    \ default friends array:"
- md: "\n# Common User Interface Patterns\n\n```\napp.controller(\"MyCtrl\", function($scope)\
    \ {\n  $scope.friends = [\n    { name: \"Peter\", age: 20 },\n    { name: \"Pablo\"\
    , age: 55 },\n    { name: \"Linda\", age: 20 },\n    { name: \"Marta\", age: 37\
    \ },\n    { name: \"Othello\", age: 20 },\n    { name: \"Markus\", age: 32 }\n\
    \  ];\n});\n```\n\nYou can find the complete example on github^7.\n\n# Discussion\n\
    \nChaining filters is a fantastic way to implement such a use case as long as\
    \ you have all the data available on the client. filter^8 Angular.Js Filter works\
    \ on an array and returns a subset of items as a new array. It supports a String,\
    \ Object or Function parameter. In this example we use the String parameter, but\
    \ given that the $scope.friends is an array of objects we could think of more\
    \ complex examples where we use the Object, for example:\n\n```\n<ul ng-repeat=\"\
    friend in friends |\n  filter: { name: query, age: '20' } |\n  orderBy: 'name\"\
    >\n  <li>{{friend.name}} ({{friend.age}})</li>\n</ul>\n```\n\nThat way we can\
    \ filter by name and age at the same time. And lastly you could call a function\
    \ defined in the controller which does the filtering for you:\n\n> ^7https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter8/recipe1\n\
    ^8http://docs.angularjs.org/api/ng.filter#filter\n\n```\n<ul>\n<li ng-repeat=\"\
    friend in friends |\nfilter: filterFunction |\norderBy:'name'\">\n<li>{{friend.name}}\
    \ {{friend.age}}</li>\n</ul\n```\n\n```\n$scope.filterFunction = function(element)\
    \ {\n  return element.match(/Ma/) ? true : false;\n};\n```\n\nThe filter returns\
    \ true or false. In this example we use a regular expression on the name starting\
    \ with Ma to filter the list.\n\n# Paginating Through Client-Side Data\n\n# Problem\n\
    \nYou have a table of data completely client-side and want to paginate through\
    \ the data.\n\n# Solution\n\nUse a HTML table element with the ng-repeat directive\
    \ to render only the items for the current page. All pagination logic should be\
    \ handled in a custom filter and controller implementation. Let us start with\
    \ the template using Twitter Bootstrap strap for the table and pagination elements:\n\
    \n```\n<div ng-controller=\"PaginationCtrl\">\n<table class=\"table table-striped\"\
    >\n<head>\n<tr>\n<th>Id</th>\n<th>Name</th>\n<th>Description</th>\n</tr>\n</head>\n\
    <tbody>\n<tr ng-repeat=\"item in items |\noffset: currentPage*itemsPerPage |\n\
    limitTo: itemsPerPage\">\n<td>{{item.id}}</td>\n<td>{{item.name}}</td>\n<td>{{item.description}}</td>\n\
    </tr>\n</tbody>\n<tfoot>\n<td colspan=\"3\">\n  <div class=\"pagination\">\n \
    \   <ul>\n      <li ng-class=\"prevPageDisabled()\">\n        <a href ng-click=\"\
    prevPage()\">&laquo; Prev</a>\n      </li>\n      <li ng-repeat=\"n in range\"\
    \n          ng-class=\"(active: n == currentPage)\" ng-click=\"setPage(n)\">\n\
    \        <a href=\"#{{n+1}}\"></a>\n      </li>\n      <li ng-class=\"nextPageDisabled()\"\
    >\n        <a href ng-click=\"nextPage()\">Next &raquo;</a>\n      </li>\n   \
    \ </ul>\n  </div>\n</td>\n</tfoot>\n</table>\n</div>\n```\n\nThe offset Filter\
    \ is responsible for selecting the subset of items for the current page. It uses\
    \ the slice function on the Array given the start param as the index.\n\n```javascript\n\
    app.filter('offset', function() {\n  return function(input, start) {\n    start\
    \ = parseInt(start, 10);\n    return input.slice(start);\n  }\n});\n```\n\nThe\
    \ controller manages the actual $scope.items array and handles the logic for enabling/disabling\
    \ the pagination buttons.\n\n# Common User Interface Patterns\n\n```\napp.controller(\"\
    PaginationCtrl\", function($scope) {\n  $scope.itemsPerPage = 5;\n  $scope.currentPage\
    \ = 0;\n  $scope.items = [];\n\n  for (var i=0; i<50; i++) {\n    $scope.items.push({\n\
    \      id: i, name: \"name\" + i, description: \"description\" + i\n    });\n\
    \  }\n\n  $scope.prevPage = function() {\n    if ($scope.currentPage > 0) {\n\
    \      $scope.currentPage--;\n    }\n  };\n\n  $scope.prevPageDisabled = function()\
    \ {\n    return $scope.currentPage === 0 ? \"disabled\" : \"\";\n  };\n\n  $scope.pageCount\
    \ = function() {\n    return Math.ceil($scope.items.length / $scope.itemsPerPage);\n\
    \  };\n\n  $scope.nextPage = function() {\n    if ($scope.currentPage < $scope.pageCount())\
    \ {\n      $scope.currentPage++;\n    }\n  };\n\n  $scope.nextPageDisabled = function()\
    \ {\n    return $scope.currentPage === $scope.pageCount() ? \"disabled\" : \"\"\
    ;\n  };\n});\n```\n\nYou can find the complete example on github^7.\n\n> ^7https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter8/recipe2\n\
    \n# Discussion\n\nThe initial idea of this pagination can be best explained by\
    \ looking into the usage of the ng-repeat to render the rows for each item:\n\n\
    ```\n<tr ng-repeat=\"item in items |\n  offset: currentPage*itemsPerPage |\n \
    \ limitTo: itemsPerPage\">\n  <td>{{item.id}}</td>\n  <td>{{item.name}}</td>\n\
    \  <td>{{item.description}}</td>\n</tr>\n```\n\nThe offset filter uses currentPage*itemsPerPage\
    \ to calculate the offset for the array slice. We use the built-in limitTo to\
    \ filter the array to the number of items. All this is done on the client with\
    \ filters only. The controller is responsible for supporting the nextPage and\
    \ prevPage action and the accompanying functions to check the disabled state of\
    \ these actions via ng-class: nextPageDisabled. The prevPage checks if it has\
    \ reached the first page before decrementing the currentPage and the nextPage\
    \ does the same for the last page and the same logic is applied for the disabled\
    \ checks. This example is already quite and I intentionally left out to explain\
    \ the rendering of links between the previous and next buttons. The full implementation\
    \ is for you to investigate.\n\n# Paginating Through Server-Side Data\n\n# Problem\n\
    \nYou want to paginate through a large server-side result set.\n\n# Solution\n\
    \nYou cannot use the method with a filter since that would require all data to\
    \ be available on the client. Instead we use an implementation with a controller\
    \ only. The template has not changed much, only the ng-repeat directive looks\
    \ simpler now:\n\n```\n<tr ng-repeat=\"item in pagedItems\">\n  <td>{{item.id}}</td>\n\
    \  <td>{{item.name}}</td>\n  <td>{{item.description}}</td>\n</tr>\n```\n\nIn order\
    \ to simplify the example we fake a server-side service by providing an Angular\
    \ service implementation for the items.\n\n```\napp.factory(\"Item\", function()\
    \ {\n  var items = [];\n  for (var i=0; i<50; i++) {\n    items.push({\n     \
    \ id: i, name: \" \" + i, description: \"description \" + i\n    });\n  }\n\n\
    \  return {\n    get: function(offset, limit) {\n      return items.slice(offset,\
    \ offset+limit);\n    },\n    total: function() {\n      return items.length;\n\
    \    }\n  };\n});\n```\n\nThe service manages a list of items and has methods\
    \ for retrieving a subset of items for a given offset and limit and the total\
    \ number of items. The controller uses dependency injection to access the Item\
    \ service and contains almost the same methods as our previous recipe.\n\n```\n\
    app.controller(\"PaginationCtrl\", function($scope, Item) {\n  $scope.itemsPerPage\
    \ = 5;\n  $scope.currentPage = 0;\n\n  $scope.prevPage = function() {\n    if\
    \ ($scope.currentPage > 0) {\n      $scope.currentPage--;\n    }\n  };\n\n  $scope.prevPageDisabled\
    \ = function() {\n    return $scope.currentPage === 0 ? \"disabled\" : \"\";\n\
    \  };\n\n  $scope.nextPage = function() {\n    if ($scope.currentPage < $scope.pageCount())\
    \ {\n      $scope.currentPage++;\n    }\n  };\n\n  $scope.nextPageDisabled = function()\
    \ {\n    return $scope.currentPage === $scope.pageCount() - 1 ? \"disabled\" :\
    \ \"\";\n  };\n\n  $scope.pageCount = function() {\n    return Math.ceil($scope.total\
    \ / $scope.itemsPerPage);\n  };\n\n  $scope.watch(\"currentPage\", function(newVal,\
    \ oldValue) {\n    $scope.pagedItems =\n      Item.get(newVal + $scope.itemsPerPage,\
    \ $scope.itemsPerPage);\n    $scope.total = Item.total();\n  });\n});\n```\n\n\
    You can find the complete example on github.\n\n> https://github.com/fdietz/recipes-with-angular-js/examples/tree/chapter8/recipe3\n\
    \n# Discussion\n\nWhen you select the next/previous page you will change the $scope.currentPage\
    \ value and the $watch function is triggered. It fetches fresh items for the current\
    \ page and the total number of items, on the client side we only have 5 items\
    \ as defined in itemsPerPage and when paginating we throw away the items of the\
    \ previous page and fetch new items. If you want to try this with a real backend\
    \ you only have to swap out the Item service implementation.\n\n# Paginating Using\
    \ Infinite Results\n\n# Problem\n\nYou want to paginate through server-side data\
    \ with a “Load More” button which keeps appending more data until no more data\
    \ is available.\n\n# Solution\n\nLets first look at how the table is rendered\
    \ with the ng-repeat Directive.\n\n```\n<div ng-controller=\"PaginationCtrl\"\
    >\n  <table class=\"table table-striped\">\n    <thead>\n      <tr>\n        <th>Id</th>\n\
    \        <th>Name</th>\n        <th>Description</th>\n      </tr>\n    </thead>\n\
    \    <tbody>\n      <tr ng-repeat=\"item in pagedItems\">\n        <td>{{item.id}}</td>\n\
    \        <td>{{item.name}}</td>\n        <td>{{item.description}}</td>\n     \
    \ </tr>\n    </tbody>\n    <tfoot>\n      <td colspan=\"3\">\n        <button\
    \ class=\"btn\" href=\"#\" ng-class=\"nextPageDisabledClass()\" ng-click=\"loadMore()\"\
    >Load More</button>\n      </td>\n    </tfoot>\n  </table>\n</div>\n```\n"
