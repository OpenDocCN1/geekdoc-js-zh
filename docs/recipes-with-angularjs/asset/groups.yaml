    ).success(function(data) {\n    tmp.push(data);\n    $http.get(\"/app/data/third.json\"\
    ).success(function(data) {\n      tmp.push(data);\n    });\n  });\n});\n```\n\n\
    Wait, the OCR actually ends with `}); }); });`. I will just format it.\n\nActually,\
    \ the OCR text is:\n`}); }); });` (Wait, I see it now).\n\nLet's provide the final\
    \ output.\n\n[content]\n## Discussion\n\nFollowing some conventions simplifies\
    \ our code quite a bit. We define the $resource by passing the URL schema only.\
    \ This gives us a handful of nice methods including query, get, save, remove and\
    \ delete with our resource. In the example above we implement several controllers\
    \ to cover the typical use cases. The get and query methods expect three arguments,\
    \ the request parameters, the success and the error callback. The save method\
    \ expects four arguments, the request parameters, the POST data, the success and\
    \ the error callback.\n\nThe $resource service currently does not support promises\
    \ and therefore has a distinctly different interface than the $http service. But\
    \ we don't have to wait long for it, since work has already started in the 1.1\
    \ development branch to introduce promise support for the $resource service!\n\
    \nThe returned object of a $resource query or get function is a $resource instance\
    \ which provides $save, $remove and $delete methods. This allows you to easily\
    \ fetch a resource and update it in the following example:\n\n```\nvar post =\
    \ Post.get({ id: i }, function() {\n  post.title = \"My new title\";\n  post.save();\n\
    });\n```\n\nIt is important to notice, that the get call immediately returns an\
    \ empty reference - in our case the post variable. Once the data is returned from\
    \ the server the existing reference is populated and we can change our post title\
    \ and use the $save method conveniently.\n\nNote, that having an empty reference\
    \ means that our post will not be rendered in the template. Once the data is returned\
    \ though, the view automatically re-renders itself showing the new data.\n\n##\
    \ Configuration\n\nWhat if your response of posts is not an array but a more complex\
    \ json? This typically results in the following error:\n\n```\nTypeError: Object\
    \ #<Resource> has no method 'push'\n```\n\nAngular seems to expect your service\
    \ to return a JSON array. Have a look at the following JSON example which wraps\
    \ a posts array in a JSON object:\n\n```\n{\n  \"posts\": [\n    {\n      \"id\"\
    \ : 1,\n      \"title\" : \"title 1\"\n    },\n    {\n      \"id\": 2,\n     \
    \ \"title\": \"title 2\"\n    }\n  ]\n}\n```\n\nIn this case you have change the\
    \ $resource definition accordingly.\n\n```\napp.factory(\"Post\", function($resource)\
    \ {\n  return $resource(\"/api/posts/:id\", {\n    query: { method: \"GET\", isArray:\
    \ false }\n  });\n});\n\napp.controller(\"PostIndexCtrl\", function($scope, Post)\
    \ {\n  Post.query(function(data) {\n    $scope.posts = data.posts;\n  });\n});\n\
    ```\n\nWe only change the configuration of the query action to not expect an array\
    \ and in our controller we can directly access data.posts.\n\nIt is generally\
    \ a good practice to encapsulate your model and $resource usage in an Angular\
    \ service module and inject that in your controller. This way you can easily reuse\
    \ the same model in different controllers and test it more easily.\n\n## Consuming\
    \ JSONP APIs\n\n### Problem\n\nYou want to call a JSONP API.\n\n### Solution\n\
    \nUse the $resource service and configure it to use JSONP. As an example we will\
    \ call the Twitter search API here.\n\nThe HTML template you enter a search term\
    \ in an input field and will render the search result in a list.\n\n```\n<body\
    \ ng-app=\"MyApp\">\n  <div ng-controller=\"MyCtrl\">\n    <input type=\"text\"\
    \ ng-model=\"searchTerm\" placeholder=\"Search term\">\n    <button ng-click=\"\
    search()\">Search</button>\n    <ul ng-repeat=\"tweet in searchResult.results\"\
    >\n      <li>{{tweet.text}}</li>\n    </ul>\n  </div>\n</body>\n```\n\nThe $resource\
    \ configuration can be done in a controller requesting the data:\n\n```\nvar app\
    \ = angular.module(\"MyApp\", [\"ngResource\"]);\n\nfunction MyCtrl($scope, $resource)\
    \ {\n  var TwitterAPI = \"http://search.twitter.com/search.json\",\n    callback:\
    \ \"JSON_CALLBACK\",\n    get: { method: \"JSONP\" });\n\n  $scope.search = function()\
    \ {\n    $scope.searchResult = TwitterAPI.get({ q: $scope.searchTerm });\n  };\n\
    }\n```\n\nYou can find the complete example on github.\n\n### Discussion\n\nThe\
    \ twitter search API supports a callback attribute for the JSON format as described\
    \ in their documentation¹² . The $resource definition sets the callback attribute\
    \ to JSON_CALLBACK, which is a convention from Angular when using JSONP³. It is\
    \ a placeholder which is replaced with the real callback function, generated by\
    \ Angular. Additionally we configure the method to use JSONP. Now, when calling\
    \ the API we use the q URL parameter to pass the entered searchTerm.\n\n> *¹https://github.com/dietz/recipes-with-angular-js-examples/tree/master/chapter5/recipe3\n\
    > ²https://dev.twitter.com/api/v1/search\n> ³https://en.wikipedia.org/wiki/JSONP\n\
    \n## Deferred and Promise\n\n### Problem\n\nYou want to synchronize multiple asynchronous\
    \ functions and avoid Javascript callback hell.\n\n### Solution\n\nAs an example\
    \ we want to call three services in sequence and combine the result of them. Let\
    \ us start with a nested approach:\n\n```\ntmp = [];\n\n$http.get(\"/app/data/first.json\"\
    ).success(function(data) {\n  tmp.push(data);\n  $http.get(\"/app/data/second.json\"\
    ).success(function(data) {\n    tmp.push(data);\n    $http.get(\"/app/data/third.json\"\
    ).success(function(data) {\n      tmp.push(data);\n    });\n  });\n});\n```\n\n\
    ## Consuming Extern Services\n\n### Discussion\n\nThe all function combines multiple\
    \ promises into a single promise. Let's have a closer look at the then method.\
    \ Before finishing this recipe we quite have to create our own deferred object:\n\
    \n```\nfunction deferredTimer(success) {\n  var deferred = $.defer();\n\n  $timeout(function()\
    \ {\n    if (success) {\n      deferred.resolve({ message: \"This is great!\"\
    \ });\n    } else {\n      deferred.reject({ message: \"Really bad\" });\n   \
    \ }\n  }, 1000);\n\n  return deferred.promise;\n}\n```\n\nOur DeferredTimer function\
    \ will get a success parameter which it passes along to the deferred. The then\
    \ function expects a success and an error callback as arguments which we use to\
    \ set a scope variable deferredResult to show our result.\n\nThis deferredTimer\
    \ can be triggered in our HTML template by wrapping it into a function defined\
    \ on the scope:\n\n```\n$scope.deferredTimer = function(success) {\n  deferredTimer(success).then(\n\
    \    function(data) {\n      $scope.deferredResult = \"Successfully finished:\
    \ \" + data.message;\n    },\n    function(data) {\n      $scope.deferredResult\
    \ = \"Failed: \" + data.message;\n    }\n  );\n});\n```\n\n### Testing Services\n\
    \n### Problem\n\nYou want to test your controller and service consuming a JSON\
    \ API.\n\nLets have a look again at our example we we want to test:\n\n```\nvar\
    \ app = angular.module(\"MyApp\", [\"ngResource\"]);\n\n.factory(\"TwitterAPI\"\
    , function($resource) {\n  return resource(\"http://search.twitter.com/search.json\"\
    ,\n    callback: \"JSON_CALLBACK\",\n    get: { method: \"JSONP\" });\n  });\n\
    });\n\napp.controller(\"MyCtrl\", function($scope, TwitterAPI) {\n  $scope.search\
    \ = function() {\n    $scope.searchResult = TwitterAPI.get({ q: $scope.searchTerm\
    \ });\n  };\n});\n```\n\nThis is just one example of how you can simplify your\
    \ code, but you can find more examples when lookinto into Kris Kowal's Q implementation.\n\
    \n> ³https://github.com/kriskowal/q\n"
  mdcn: "\n## 讨论\n\n遵循某些约定可以大大简化我们的代码。我们通过仅传递 URL 模式来定义 $resource。这为我们提供了许多实用的方法，包括对资源进行\
    \ query、get、save、remove 和 delete 这种操作。在上面的示例中，我们实现了几个控制器来涵盖典型的用例。`get` 和 `query`\
    \ 方法期望三个参数：请求参数、成功回调和错误回调。`save` 方法期望四个参数：请求参数、POST 数据、成功回调和错误回调。\n\n$resource\
    \ 服务目前不支持 promises，因此其接口与 $http 服务有显著不同。但我们不需要等待太久，因为在 1.1 开发分支中已经开始为 $resource\
    \ 服务引入 promise 的支持了！\n\n$resource 的 `query` 或 `get` 函数返回的对象是一个 $resource 实例，它提供了\
    \ `$save`、`$remove` 和 `$delete` 方法。这允许你在下面的示例中轻松地获取资源并更新它：\n\n```\nvar post =\
    \ Post.get({ id: i }, function() {\n  post.title = \"My new title\";\n  post.save();\n\
    });\n```\n\n注意的是，`get` 调用会立即返回一个空引用——在我们的案例中就是 post 变量。一旦数据从服务器返回，现有的引用就会被填充，我们就可以方便地更改\
    \ post 标题并使用 `$save` 方法。\n\n请注意，拥有空引用意味着我们的 post 将不会在模板中渲染。但是，一旦数据返回，视图会自动重新渲染并显示新数据。\n\
    \n## 配置\n\n如果你的 posts 响应不是一个数组而是一个更复杂的 json 呢？这通常会导致以下错误：\n\n```\nTypeError: Object\
    \ #<Resource> has no method 'push'\n```\n\nAngular 似乎期望你的服务返回一个 JSON 数组。看看下面的\
    \ JSON 示例，它将 posts 数组封装在一个 JSON 对象中：\n\n```\n{\n  \"posts\": [\n    {\n      \"\
    id\" : 1,\n      \"title\" : \"title 1\"\n    },\n    {\n      \"id\": 2,\n  \
    \    \"title\": \"title 2\"\n    }\n  ]\n}\n```\n\n在这种情况下，你需要相应地更改 $resource 的定义。\n\
    \n```\napp.factory(\"Post\", function($resource) {\n  return $resource(\"/api/posts/:id\"\
    , {\n    query: { method: \"GET\", isArray: false }\n  });\n});\n\napp.controller(\"\
    PostIndexCtrl\", function($scope, Post) {\n  Post.query(function(data) {\n   \
    \ $scope.posts = data.posts;\n  });\n});\n```\n\n我们只更改了 query 操作的配置，使其不再期望数组，而在我们的控制器中，可以直接访问\
    \ `data.posts`。\n\n将你的模型和 $resource 的使用封装在 Angular 服务模块中并将其注入控制器，通常是一个良好的做法。这样你就可以轻松地在不同的控制器中复用同一个模型，并更方便地测试它。\n\
    \n## 消费 JSONP API\n\n### 问题\n\n你想调用一个 JSONP API。\n\n### 解决方案\n\n使用 $resource 服务并将其配置为使用\
    \ JSONP。作为一个示例，我们在这里调用 Twitter 搜索 API。\n\nHTML 模板中允许你在输入框中输入搜索词，并在列表中渲染搜索结果。\n\
    \n```\n<body ng-app=\"MyApp\">\n  <div ng-controller=\"MyCtrl\">\n    <input type=\"\
    text\" ng-model=\"searchTerm\" placeholder=\"Search term\">\n    <button ng-click=\"\
    search()\">Search</button>\n    <ul ng-repeat=\"tweet in searchResult.results\"\
    >\n      <li>{{tweet.text}}</li>\n    </ul>\n  </div>\n</body>\n```\n\n$resource\
    \ 的配置可以在请求数据的控制器中完成：\n\n```\nvar app = angular.module(\"MyApp\", [\"ngResource\"\
    ]);\n\nfunction MyCtrl($scope, $resource) {\n  var TwitterAPI = $resource(\"http://search.twitter.com/search.json\"\
    ,\n    callback: \"JSON_CALLBACK\",\n    get: { method: \"JSONP\" });\n\n  $scope.search\
    \ = function() {\n    $scope.searchResult = TwitterAPI.get({ q: $scope.searchTerm\
    \ });\n  };\n}\n```\n\n你可以在 github 上找到完整的示例。\n\n### 讨论\n\nTwitter 搜索 API 支持如文档¹²\
    \ 所示的 JSON 格式的 callback 属性。$resource 的定义将 callback 属性设置为 `JSON_CALLBACK`，这是 Angular\
    \ 在使用 JSONP³ 时的一种约定。它是一个占位符，会被 Angular 生成的真实回调函数替换。此外，我们配置了方法使用 JSONP。现在，当调用 API\
    \ 时，我们使用 q URL 参数来传递输入的 searchTerm。\n\n> *¹https://github.com/dietz/recipes-with-angular-js-examples/tree/master/chapter5/recipe3\n\
