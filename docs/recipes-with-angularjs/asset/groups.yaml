- md: "\n# Directives\n\n```html\n<body ng-app=\"MyApp\">\n  <basket apple orange>Roll\
    \ over me and check the console!</basket>\n</body>\n```\n\nThe basket directive\
    \ manages an array to which one can add apples and oranges.\n\n```javascript\n\
    var app = angular.module(\"MyApp\", []);\n\napp.directive(\"basket\", function()\
    \ {\n  return {\n    restrict: \"E\",\n    controller: function($scope, element,\
    \ $attrs) {\n      $scope.content = [];\n\n      this.addApple = function() {\n\
    \        $scope.content.push(\"apple\");\n      };\n\n      this.addOrange = function()\
    \ {\n        $scope.content.push(\"orange\");\n      };\n\n      link: function(scope,\
    \ element) {\n        element.bind(\"mouseenter\", function() {\n          console.log(scope.content);\n\
    \        });\n      }\n    }}\n  };\n});\n```\n\nAnd finally the apple and orange\
    \ directives which which add themselves to the basket using the basket's controller.\n\
    \n```javascript\napp.directive(\"apple\", function() {\n  return {\n    require:\
    \ \"basket\",\n    link: function(scope, element, attrs, basketCtrl) {\n     \
    \ basketCtrl.addApple();\n    }\n  };\n});\n```\n\n```javascript\napp.directive(\"\
    orange\", function() {\n  return {\n    require: \"basket\",\n    link: function(scope,\
    \ element, attrs, basketCtrl) {\n      basketCtrl.addOrange();\n    }\n  };\n\
    });\n```\n\nIf you hover with the mouse over the rendered text console should\
    \ print the basket's content. You can find the complete example on github³.\n\n\
    # Discussion\n\nBasket is the example directive which demonstrates an API using\
    \ the controller function, whereas the apple and orange directives augment define\
    \ a dependency on the basket controller with the require attribute. The link function\
    \ then gets basketCtrl injected.\nNote, how the basket directive is defined as\
    \ an HTML element and the apple and orange directives are defined as HTML attributes\
    \ (the default for directives). This demonstrates the typical use case of a reusable\
    \ component augmented by other directives.\nNow there might be other ways of passing\
    \ data back and forth between directives - we have seen the different semantics\
    \ of using the (isolated) context in directives in previous recipes - but what's\
    \ especially great about the controller is the clear API contract it lets you\
    \ define.\n\n# Testing Directives\n\n# Problem\n\nYou want to test your directive\
    \ with a unit test. As an example we use a tab component directive implementation\
    \ which can be easily used in your HTML document.\n\n> ³https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe\n\
    \n# Directives\n\n```html\n<tabs>\n  <pane title=\"First Tab\">First pane. </pane>\n\
    \  <pane title=\"Second Tab\">Second pane. </pane>\n</tabs>\n```\n\nThe directive\
    \ implementation is split into the tabs and the pane directive. Let us start with\
    \ the tabs directive.\n\n```javascript\napp.directive(\"tabs\", function() {\n\
    \  return {\n    restrict: \"E\",\n    transclude: {},\n    scope: {\n      controller:\
    \ function($scope, element) {\n        var panes = $scope.panes = [];\n      \
    \  $scope.select = function(pane) {\n          angular.forEach(panes, function(pane)\
    \ {\n            pane.selected = false;\n          });\n          pane.selected\
    \ = true;\n          console.log(\"selected pane: \", pane.title);\n        }\n\
    \        this.addPane = function (pane) {\n          if (!panes.length) $scope.select(pane);\n\
    \          panes.push(pane);\n        }\n      },\n      template:\n        '<div\
    \ class=\"tabrable\"> ' +\n        '<ul class=\"nav-tabs\" ng-repeat=\"pane in\
    \ panes\">' +\n        '<li ng-class=\"{active:pane.selected}\">' +\n        '<a\
    \ href=\"\" ng-click=\"select(pane)\">{{pane.title}}</a>' +\n        '</li>' +\n\
    \        '</ul>' +\n        '<div class=\"tab-content\" ng-transclude></</div>'\
    \ +\n        '</div>',\n    replace: true\n  }\n});\n```\n\nDirectives 31\n\n\
    It manages a list of panes and the selected state of the panes. The template definition\
    \ makes use of selection to change the class and responds to the click event to\
    \ change the selection.\nThe pane directive depends on the tabs directive to add\
    \ itself to it.\n\n```javascript\napp.directive(\"pane\", function() {\n  return\
    \ {\n    require: \"tabs\",\n    restrict: \"E\",\n    transclude: true,\n   \
    \ scope: {\n      title: \"@\"\n    },\n    link: function(scope, element, attrs,\
    \ tabsCtrl) {\n      tabsCtrl.addPane(scope);\n    },\n    template:\n      '<div\
    \ class=\"tab-pane\" ng-class=\"{active: selected}\"' +\n      '<ng-transclude></</div>'\
    \ +\n      replace: true\n  }\n});\n```\n\n# Solution\n\nUsing the angular-seed\
    \ in combination with jasmine and jasmine-jquery you can implement a unit\n\n\
    ```javascript\ndescribe('MyApp Tabs', function() {\n  var elm, scope;\n\n  beforeEach(module('MyApp'));\n\
    \n  beforeEach(function($inject($rootScope, $compile) {\n    elm = angular.element(\n\
    \      '<div>' +\n      '<tabs>' +\n      '<pane title=\"First Tab\">' +\n   \
    \   'First content is {{first}}' +\n      '</pane>' +\n      '<pane title=\"Second\
    \ Tab\">' +\n      'Second content is {{second}}' +\n      '</pane>' +\n     \
    \ '</tabs>' +\n      '</div>');\n\n    scope = $rootScope;\n    $compile(elm)(scope);\n\
    \    scope.$digest();\n  }));\n\n  it('should create clickable titles', function()\
    \ {\n    console.log(elm.find('.ul.nav-tabs'));\n    var titles = elm.find('.ul.nav-tabs\
    \ li a');\n\n    expect(titles.length).toBe(2);\n    expect(titles.eq(0).text()).toBe('First\
    \ Tab');\n    expect(titles.eq(1).text()).toBe('Second Tab');\n  });\n\n  it('should\
    \ set active class on title', function() {\n    var titles = elm.find('.ul.nav-tabs\
    \ li');\n\n    expect(titles.eq(0)).toHaveClass('active');\n    expect(titles.eq(1)).not.toHaveClass('active');\n\
    \  });\n\n  it('should change active pane when title clicked', function() {\n\
    \    var titles = elm.find('.ul.nav-tabs li');\n    var contents = elm.find('.tab-pane');\n\
    \n    titles.eq(1).click();\n\n    expect(titles.eq(0)).not.toHaveClass('active');\n\
    \    expect(titles.eq(1)).toHaveClass('active');\n    expect(contents.eq(0)).not.toHaveClass('active');\n\
    \    expect(contents.eq(1)).toHaveClass('active');\n  });\n});\n```\n\n# Filters\n\
    \nAngular Filters are typically used to format expressions in your bindings. They\
    \ transform the input data to a new type.\n\n# Formatting a String With a Currency\
    \ Filter\n\n# Problem\n\nYou want to format the amount of currency with a localized\
    \ label.\n\n# Solution\n\nUse the built-in currency filter and make sure you load\
    \ the corresponding locale file for the users language.\n\n```html\n<html>\n<head>\n\
    \  <meta charset='utf-8'>\n  <script src='js/angular.js'></script>\n  <script\
    \ src='js/angular-locale_de.js'></script>\n</head>\n<body ng-app>\n  <input type='text'\
    \ ng-model='amount' placeholder='Enter amount'/>\n  <p>Default Currency: {{ amount\
    \ | currency }}</p>\n  <p>Custom Currency: {{ amount | currency: '€'</</p>\n</body>\n\
    </html>\n```\n\nEnter an amount and it will be displayed using Angular's default\
    \ locale.\nYou can find the complete example on github⁴.\n\n> ⁴https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter4/recipe\n\
    \n# Discussion\n\nIn our example we explicitly load the German locale settings\
    \ and therefore the default formatting will be in German. The english locale is\
    \ shipped by default, so there's no need to include the angularlocale_en.js file.\
    \ If you remove the script tag, you will see the formatting change to English\
    \ instead. This means in order for a localized application to work correctly you\
    \ need to the corresponding locale file. All available locale files can be seen\
    \ on github\n\n# Implementing a Custom Filter to Reverse an Input String\n\n#\
    \ Problem\n\nYou want to reverse user input.\n\n# Solution\n\n```html\n<body ng-app=\"\
    MyApp\">\n  <input type=\"text\" ng-model=\"text\" placeholder=\"Enter text\"\
    />\n  <p>Input: {{ text }}</p>\n  <p>Filtered input: {{ text | reverse }}</p>\n\
    </body>\n\nvar app = angular.module(\"MyApp\", []);\n\napp.filter(\"reverse\"\
    , function(input) {\n  var result = \"\";\n  input = input || \"\";\n  for (var\
    \ i=0; i<input.length; i++) {\n    result = input.charAt(i) + result;\n  }\n \
    \ return result;\n});\n```\n\nYou can find the complete example on github³⁵.\n\
    \n> ³⁵https://github.com/angular/angular.js/tree/master/src/ngLocale\n"
  mdcn: "\n\n# 指令 (Directives)\n\n```html\n<body ng-app=\"MyApp\">\n  <basket apple\
    \ orange>鼠标悬停在我处检查控制台!</basket>\n</body>\n```\n\nbasket 指令管理一个数组，可以向其中添加苹果和橙子。\n\
    \n```javascript\nvar app = angular.module(\"MyApp\", []);\n\napp.directive(\"\
    basket\", function() {\n  return {\n    restrict: \"E\",\n    controller: function($scope,\
    \ element, $attrs) {\n      $scope.content = [];\n\n      this.addApple = function()\
    \ {\n        $scope.content.push(\"apple\");\n      };\n\n      this.addOrange\
    \ = function() {\n        $scope.content.push(\"orange\");\n      };\n\n     \
    \ link: function(scope, element) {\n        element.bind(\"mouseenter\", function()\
    \ {\n          console.log(scope.content);\n        });\n      }\n    }}\n  };\n\
    });\n```\n\n最后是 apple 和 orange 指令，它们通过 basket 的控制器将自己添加到 basket 中。\n\n```javascript\n\
    app.directive(\"apple\", function() {\n  return {\n    require: \"basket\",\n\
    \    link: function(scope, element, attrs, basketCtrl) {\n      basketCtrl.addApple();\n\
    \    }\n  };\n});\n```\n\n```javascript\napp.directive(\"orange\", function()\
    \ {\n  return {\n    require: \"basket\",\n    link: function(scope, element,\
    \ attrs, basketCtrl) {\n      basketCtrl.addOrange();\n    }\n  };\n});\n```\n\
    \n如果你将鼠标悬停在渲染的文本上，控制台将打印 basket 的内容。你可以在 github³ 上找到完整示例。\n\n# 讨论 (Discussion)\n\
    \nBasket 是演示如何使用控制器函数构建 API 的示例指令，而 apple 和 orange 指令通过 `require` 属性定义了对 basket\
    \ 控制器的依赖。link 函数随后获取了注入的 basketCtrl。\n注意，basket 指令被定义为 HTML 元素，而 apple 和 orange\
    \ 指令被定义为 HTML 属性（指令的默认值）。这展示了由其他指令增强的可重用组件的典型用例。\n现在可能还有其他方法在指令之间来回传递数据——我们在之前的食谱中已经看到在指令中使用（隔离）上下文的不同语义——但控制器特别棒的地方在于它让你定义了清晰的\
    \ API 契约。\n\n# 测试指令 (Testing Directives)\n\n# 问题 (Problem)\n\n你想用单元测试来测试你的指令。例如，我们使用一个标签页组件指令实现，它可以轻松地用在你的\
    \ HTML 文档中。\n\n> ³https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe\n\
    \n# 指令 (Directives)\n\n```html\n<tabs>\n  <pane title=\"First Tab\">第一个面板。</pane>\n\
    \  <pane title=\"Second Tab\">第二个面板。</pane>\n</tabs>\n```\n\n指令的实现分为 tabs 指令和\
    \ pane 指令。让我们从 tabs 指令开始。\n\n```javascript\napp.directive(\"tabs\", function()\
    \ {\n  return {\n    restrict: \"E\",\n    transclude: {},\n    scope: {\n   \
    \   controller: function($scope, element) {\n        var panes = $scope.panes\
    \ = [];\n        $scope.select = function(pane) {\n          angular.forEach(panes,\
    \ function(pane) {\n            pane.selected = false;\n          });\n      \
    \    pane.selected = true;\n          console.log(\"selected pane: \", pane.title);\n\
    \        }\n        this.addPane = function (pane) {\n          if (!panes.length)\
    \ $scope.select(pane);\n          panes.push(pane);\n        }\n      },\n   \
    \   template:\n        '<div class=\"tabrable\"> ' +\n        '<ul class=\"nav-tabs\"\
    \ ng-repeat=\"pane in panes\">' +\n        '<li ng-class=\"{active:pane.selected}\"\
    >' +\n        '<a href=\"\" ng-click=\"select(pane)\">{{pane.title}}</a>' +\n\
    \        '</li>' +\n        '</ul>' +\n        '<div class=\"tab-content\" ng-transclude></</div>'\
    \ +\n        '</div>',\n    replace: true\n  }\n});\n```\n\n指令 31\n\n它管理面板列表以及面板的选中状态。模板定义利用选择来更改类名，并响应点击事件来更改选择。\n\
    pane 指令依赖 tabs 指令来将自己添加其中。\n\n```javascript\napp.directive(\"pane\", function()\
    \ {\n  return {\n    require: \"tabs\",\n    restrict: \"E\",\n    transclude:\
    \ true,\n    scope: {\n      title: \"@\"\n    },\n    link: function(scope, element,\
    \ attrs, tabsCtrl) {\n      tabsCtrl.addPane(scope);\n    },\n    template:\n\
    \      '<div class=\"tab-pane\" ng-class=\"{active: selected}\"' +\n      '<ng-transclude></</div>'\
    \ +\n      replace: true\n  }\n});\n```\n\n# 解决方案 (Solution)\n\n使用 angular-seed\
    \ 结合 jasmine 和 jasmine-jquery，你可以实现一个单元\n\n```javascript\ndescribe('MyApp Tabs',\
    \ function() {\n  var elm, scope;\n\n  beforeEach(module('MyApp'));\n\n  beforeEach(function($inject($rootScope,\
    \ $compile) {\n    elm = angular.element(\n      '<div>' +\n      '<tabs>' +\n\
    \      '<pane title=\"First Tab\">' +\n      'First content is {{first}}' +\n\
    \      '</pane>' +\n      '<pane title=\"Second Tab\">' +\n      'Second content\
    \ is {{second}}' +\n      '</pane>' +\n      '</tabs>' +\n      '</div>');\n\n\
    \    scope = $rootScope;\n    $compile(elm)(scope);\n    scope.$digest();\n  }));\n\
    \n  it('should create titles', function() {\n    var titles = elm.find('.nav-tabs\
    \ a');\n\n    expect(titles.length).toBe(2);\n    expect(titles.eq(0).text()).toBe('First\
    \ Tab');\n    expect(titles.eq(1).text()).toBe('Second Tab');\n  });\n\n  it('should\
    \ set active class on title', function() {\n    var titles = elm.find('.nav-tabs\
    \ li');\n\n    expect(titles.eq(0)).toHaveClass('active');\n    expect(titles.eq(1)).not.toHaveClass('active');\n\
    \  });\n\n  it('should change pane when clicked', function() {\n    var titles\
    \ = elm.find('.nav-tabs li');\n    var contents = elm.find('.tab-pane');\n\n \
    \   titles.eq(1).click();\n\n    expect(titles.eq(0)).not.toHaveClass('active');\n\
    \    expect(titles.eq(1)).toHaveClass('active');\n    expect(contents.eq(0).text()).not.toContain('Second\
    \ content is');\n    expect(contents.eq(1).text()).toContain('Second content is');\n\
    \  });\n});\n```\n\n# 过滤器 (Filters)\n\nAngular 过滤器通常用于格式化绑定表达式。它们将输入数据转换为新的类型。\n\
    \n# 使用货币过滤器格式化字符串 (Formatting a String With Currency Filter)\n\n# 问题\n\n你想根据语言格式化金额。\n\
    \n# 解决方案\n\n使用内置的货币过滤器并确保你加载了相应的区域文件。\n\n```html\n<html>\n<head>\n  <meta charset='utf-8'>\n\
    \  <script src='js/angular.js'></script>\n  <script src='js/angular-locale_de.js'></script>\n\
    </head>\n<body ng-app>\n  <input type='text' ng-model='amount' placeholder='Enter\
    \ amount'/>\n  <p>Default Currency: {{ amount | currency }}</p>\n  <p>Custom Currency:\
    \ {{ amount | currency: '€' }}</p>\n</body>\n</html>\n```\n\n输入一个金额，它将使用默认区域设置显示。\n\
    你可以在 github⁴ 上找到完整示例。\n\n⁴https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter4/recipe\n\
    \n# 讨论\n\n在我们的示例中，我们显式加载了德语区域设置，因此默认格式将是德语。英语区域是默认提供的，所以不需要包含 angularlocale_en.js\
    \ 文件。如果你删除该脚本标签，你会看到格式变为英语。这意味着为了让本地化应用程序正常工作，你需要加载相应的区域文件。所有可用的区域文件可以在 github\
    \ 上查看。\n\n# 实现一个反转输入的自定义过滤器 (Implementing a Custom Filter to Reverse an Input\
    \ String)\n\n# 问题\n\n你想反转用户输入。\n\n# 解决方案\n\n```html\n<body ng-app=\"MyApp\">\n\
    \  <input type=\"text\" ng-model=\"text\" placeholder=\"Enter text\"/>\n  <p>Input:\
    \ {{ text }}</p>\n  <p>Filtered input: {{ text | reverse }}</p>\n</body>\n\nvar\
    \ app = angular.module(\"MyApp\", []);\n\napp.filter(\"reverse\", function(input)\
    \ {\n  var result = \"\";\n  input = input || \"\";\n  for (var i=0; i<input.length;\
    \ i++) {\n    result = input.charAt(i) + result;\n  }\n  return result;\n});\n\
    ```\n\n你可以在 github³⁵ 上找到完整示例。\n\n³⁵https://github.com/angular/angular.js/tree/master/src/ngLocale\n\
    \n"
