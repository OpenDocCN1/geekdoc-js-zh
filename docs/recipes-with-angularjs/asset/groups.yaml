    \n## 与 Ruby on Rails 的后端集成\n\n### 讨论\n\n让我们再次查看路由定义。首先，文件名以 `.erb` 结尾，因为 JavaScript\
    \ 文件中使用了 ERB 标签，这是得益于 Rails 资源流水线（Asset Pipeline）。`asset_path` 方法用于获取 HTML 颗粒的\
    \ URL，因为它会根据环境而改变。在生产环境中，文件名包含一个 MD5 校验和，实际的 ERB 输出将从 `/assets/contacts/index.html`\
    \ 变为 `/assets/contacts/index-7ce11b9b081a20d93a486e1aacce05f.html`。如果你的 Rails\
    \ 应用配置为使用资源路径，它实际上将是绝对路径。\n\n## 服务端表单验证\n\n### 问题\n\n你想使用 Rails 提供的服务器端 REST API\
    \ 来验证表单。\n\n### 解决方案\n\nRails 已经为我们提供了开箱的模型验证支持。让我们从 `Contact` ActiveRecord 模型开始。\n\
    \n```ruby\nclass Contact < ActiveRecord::Base\n  attr_accessible :age, :firstname,\
    \ :lastname\n\n  validates :age, :numericity => {\n    :only_integer => true,\
    \ :less_than_or_equal_to => 50\n  }\nend\n```\n\n它对 `age` 属性定义了验证。它必须是一个整数，且小于或等于\
    \ 50 岁。\n\n在 `ContactsController` 中，我们可以使用它来确保 REST API 返回正确的错误消息。我们以 `create`\
    \ 动作为例。\n\n## 与 Ruby on Rails 的后端集成\n\n```ruby\nclass ContactsController < ApplicationController\n\
    \  respond_to :json\n\n  def create\n    @contact = Contact.new(params[:contact])\n\
    \    if @contact.save\n      render json: @contact, status: :created, location:\
    \ @contact\n    else\n      render json: @contact.errors, status: :unprocessable_entity\n\
    \    end\n  end\nend\n```\n\n成功时，它将使用 JSON 呈现渲染联系人模型；失败时，它将返回所有转换为 JSON 的验证错误。让我们来看一个\
    \ JSON 响应示例：\n\n```json\n{ \"age\": {\"must be less than or equal to 50\"} }\n\
    ```\n\n这是一个哈希，每个属性都有一个对应的验证错误条目。值是一个字符串数组，因为可能同时存在多个错误。\n\n让我们转向应用程序的客户端。Angular.js\
    \ 的联系人 `$resource` 调用了 `create` 函数并传递了失败回调函数。\n\n```javascript\nContact.create($scope.contact,\
    \ success, failure);\n\nfunction failure(response) {\n  each(response.data, function(errors,\
    \ key) {\n    each(errors, function(e) {\n      $scope.form[key].dirty = true;\n\
    \      $scope.form[key].setValidity(e, false);\n    });\n  });\n}\n```\n\n注意，ActiveRecord\
    \ 属性可以定义多个验证。`failure` 函数遍历每个验证条目，每个错误都使用 `$setValidity` 和 `$dirty` 将表单字段标记为无效。\n\
    \n现在，我们准备好使用在表单章节中讨论过的方法向用户显示一些反馈了。\n\n## 与 Ruby on Rails 的后端集成\n\n```html\n1\
