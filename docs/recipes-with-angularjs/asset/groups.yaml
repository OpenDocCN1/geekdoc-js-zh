    \ list won't do any server requests. Everything our app needs is loaded from the\
    \ server and cached client-side.\n\nIf you have a hard time understanding the\
    \ server implementation I suggest to read the excellent Express Guide⁶. Additionally,\
    \ there is going to be an extra chapter that goes into more details on how to\
    \ integrate Angular.js with server-side frameworks.\n\n## Using Route Location\
    \ to Implement a Navigation Menu\n\n## Problem\n\nYou want to implement a navigation\
    \ menu which shows the selected menu item to the user.\n\n## Solution\n\nUse the\
    \ $location service in a controller to compare the address bar URL to the navigation\
    \ menu item the user selected.\n\nThe navigation menu is the classic/li menu using\
    \ a class attribute to mark one of the li elements as active:\n\n```\n<body ng-controller=\"\
    MainCtrl\">\n  <ul class=\"menu\">\n    <li ng-class=\"menuClass('persons')\"\
    ><a href=\"#!persons\">Home</a></li>\n    <li ng-class=\"menuClass('help')\"><a\
    \ href=\"#!help\">Help</a></li>\n  </ul>\n</body>\n```\n\nThe controller implements\
    \ the menuClass function:\n\n```\napp.controller(\"MainCtrl\", function($scope,\
    \ $location) {\n  $scope.menuClass = function() {\n    var current = $location.path().substring(1);\n\
    \    return page === current ? \"active\" : \"\";\n  }\n});\n```\n\nYou can find\
    \ the complete example on github⁶.\n\n⁶ ⁶http://express.js/guide.html\n⁶https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter6/recipe6\n\
    \nURLs, Routing and Partials\n\n## Discussion\n\nWhen the user selects a menu\
    \ item the client-side navigation will kick in as expected. The menuClass function\
    \ is bound using the ngClass directive and updates the CSS class automatically\
    \ for us depending on the current route.\n\nUsing $location.path() we get the\
    \ current route. The substring operation removes the leading slash (/) and converts\
    \ /partials to persons.\n\n## Listening on Route Changes to Implement a Login\
    \ Mechanism\n\n## Problem\n\nYou want to ensure that a user first has to login\
    \ before navigating to protected pages.\n\n## Solution\n\nImplement a listener\
    \ on $routeChangeStart to track the next route navigation. Redirect to a login\
    \ page if the user is not logged in.\n\nThe most interesting part is the implementation\
    \ of the route change listener:\n\n```\nvar app = angular.module(\"MyApp\", []).\n\
    config($routeProvider, $locationProvider) {\n  $routeProvider.\n  when(\"/persons\"\
    , {\n    templateUrl: \"partials/index.html\"});\n  when(\"/login\", {\n    templateUrl:\
    \ \"partials/login.html\", controller: \"LoginCtrl\\n    // event moves routes\
    \ here ...\n  });\n  otherwise({ redirectTo: \"/persons\" });\n});\nrun(function($rootScope,\
    \ $location) {\n  $rootScope.on(\"$routeChangeStart\", function(event, next, current)\
    \ {\n    if ($rootScope.loggedInUser == null) {\n      // no logged user, redirect\
    \ to /login\n      if (next.templateUrl === \"partials/login.html\") {\n    }\
    \ else {\n      $location.path(\"/login\");\n    }\n  }\n}\n));\n```\n\nNext we\
    \ define a login form to enter the username, skipping the password for the sake\
    \ of simplicity:\n\n```\n<form ng-submit=\"login()\">\n  <label>Username</label>\n\
    \  <input type=\"text\" ng-model=\"username\">\n  <button>Login</button>\n</form>\n\
    ```\n\nand lastly the login controller which sets the logged in the login page\
    \ and redirects to the persons URL:\n\n```\napp.controller(\"LoginCtrl\", function($scope,\
    \ $location, $rootScope) {\n  $scope.login = function() {\n    $rootScope.loggedIn\
    \ = $scope.username;\n    $location.path(\"/persons\");\n  };\n});\n```\n\nYou\
    \ can find the complete example on github65.\n\n## Discussion\n\nThis is of not\
    \ fully fleshed login system, please don't use it in any production system. But,\
    \ it exemplifies how to generally handle access to specific areas of your web\
    \ app. When you open the app in your browser you will be redirected to the login\
    \ page in all cases. Only after you entered a user can access the other areas.\n\
    \nThe run method is defined in Module66 and is a good place for a cache listener\
    \ since it runs only on initialization after the injector is done loading all\
    \ the modules. We check the loggedIn in $rootScope and if it is not we redirect\
    \ the user to the login page. Note, in order to skip this behavior when already\
    \ navigating to the login page, we have to explicitly check the next templateUrl.\n\
    \nThe login controller sets the $rootScope to the username and redirects to /persons.\
    \ Generally, I try to avoid the $rootScope since it is basically a kind of global\
    \ state but in our case it fits nicely since there be a current user globally\
    \ available.\n\n> 65https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter6/recipe6\n\
    \n> 66http://docs.angular.org/api/angular.Module\n\n## Using Forms\n\nEvery website\
    \ eventually uses some kind of form for users to enter data. Angular makes it\
    \ particularly easy to implement client-side form validations to give immediate\
    \ feedback for an improved user experience.\n\n## Implementing a Basic Form\n\n\
    ### ### Problem\n\nYou want to create a form to enter user details and capture\
    \ this information in an Angular.js scope.\n\n### ### Solution\n\nUse the standard\
    \ form tag and the ng-model Directive to implement a basic form:\n\n```\nbody\
    \ ng-app=\"MyApp\">\n  <div ng-controller=\"User\">\n    <form ng-submit=\"submit()\"\
    \ class=\"form-horizontal novalidate\">\n      <label>First</label>\n      <input\
    \ type=\"text\" ng-model=\"user.firstname\"/>\n      <label>LastName</label>\n\
    \      <input type=\"text\" ng-model=\"user.lastname\"/>\n      <label>Age</label>\n\
    \      <input type=\"text\" ng-model=\"user.age\"/>\n      <button class=\"btn\"\
    >Submit</button>\n    </form>\n  </div>\n</body>\n```\n\nThe novalidate attribute\
    \ disables the HTML5 validations, which are client-side validations supports by\
    \ modern browsers. In our example we only want the Angular.js validations running\
    \ to have complete control over look and feel.\n\nThe controller binds the form\
    \ to your user model and implements the submit() function:\n\n## Using Forms\n\
    \n```\nvar app = angular.module(\"MyApp\", []);\napp.controller(\"User\", function(scope)\
    \ {\n  $scope.user = {};\n  $scope.wasSubmitted = false;\n\n  $scope.submit =\
    \ function() {\n    $scope.wasSubmitted = true;\n  }\n});\n```\n\nYou can find\
    \ the complete example on github67.\n\n## Discussion\n\nThe novalidate attribute\
    \ disables the HTML5 validations, which are client-side validations supports by\
    \ modern browsers. In our example we only want the Angular.js validations running\
    \ to have complete control over look and feel.\n\nThe controller binds the form\
    \ to your user model and implements the submit() function:\n\n## Validating a\
    \ Form Client-Side\n\n## Problem\n\nYou want to validate the form client-side\
    \ using HTML5 attributes.\n\n## Solution\n\nAngular.js works in tandem with HTML5\
    \ attributes. Let us start with the same form but let us make the input required:\n\
    \n> ^67https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter7/recipe1\n\
    \n## Using Forms\n\n```\n<form name=\"form\" ng-submit=\"submit\">\n  <label>Firstname</label>\n\
    \  <input name=\"firstname\" type=\"text\" ng-model=\"user.firstname\" required\
    \ />\n  <label>LastName</label>\n  <input name=\"lastname\" type=\"text\" ng-model=\"\
    user.lastname\" required />\n  <label>Age</label>\n  <input name=\"age\" type=\"\
    text\" ng-model=\"user.age\" />\n  <br>\n  <button class=\"btn\">Submit</button>\n\
    </form>\n```\n\nIt is the same form but this time we defined the name on the form\
    \ and made the input required.\n\nLet us add more debug output below the form:\n\
    \n- Firstname valid: {{form.firstname.$valid}}\n<br>\nFirstname error: {{form.firstname.$error}}\n\
    <br>\nForm valid: {{form.valid}}\n<br>\nForm validation error: {{form.$error}}\n\
    \nYou can find the complete example on github.\n\n## Discussion\n\nStarting with\
    \ a fresh form, you notice that Angular adds the css class ng-pristine and ng-valid\
    \ to the form tag and each input tag. When editing the form the ng-pristine class\
    \ will be removed from the changed input field and instead it will be replaced\
    \ by the ng-dirty class. Very useful you can easily add new features to your app\
    \ depending on these states.\n\nIn addition to these two classes there are more\
    \ to look into. The ng-valid class will be added when an input is valid, otherwise\
    \ the css class ng-invalid is added. Note, that the form also gets either a valid\
    \ or invalid class depending on the input fields. To demonstrate this I've added\
    \ the required HTML5 attribute. Initially, the firstname and lastname input fields\
    \ are empty and therefore have the ng-invalid css class, whereas the age field\
    \ has the ng-valid class. Additionally, there's ng-invalid-required class alongside\
    \ the ng-valid for even more specificity.\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter7/recipe2\n"
  mdcn: "\nURL、路由与局部组件 56\n\n请注意，导航到人员详情页将只会加载 `show.jade` 局部组件，而返回人员列表不会产生任何服务器请求。应用程序所需的所有内容都从服务器加载并缓存在客户端。\n\
    \n如果你在理解服务器实现方面有困难，我建议阅读优秀的《Express 指南》⁶。此外，将有一个额外的章节，详细介绍如何将 Angular.js 与服务器端框架集成。\n\
    \n## 使用路由位置实现导航菜单\n\n## 问题\n\n你想实现一个导航菜单，向用户显示当前选中的菜单项。\n\n## 解决方案\n\n在控制器中使用\
    \ `$location` 服务，将地址栏的 URL 与用户选择的导航菜单项进行比较。\n\n导航菜单是经典的 `ul/li` 结构，使用 `class`\
    \ 属性将其中一个 `li` 元素标记为激活：\n\n```\n<body ng-controller=\"MainCtrl\">\n  <ul class=\"\
    menu\">\n    <li ng-class=\"menuClass('persons')\"><a href=\"#!persons\">首页</a></li>\n\
    \    <li ng-class=\"menuClass('help')\"><a href=\"#!help\">帮助</a></li>\n  </ul>\n\
    </body>\n```\n\n控制器实现了 `menuClass` 函数：\n\n```\napp.controller(\"MainCtrl\", function($scope,\
    \ $location) {\n  $scope.menuClass = function() {\n    var current = $location.path().substring(1);\n\
    \    return page === current ? \"active\" : \"\";\n  }\n});\n```\n\n你可以在 github\
    \ ⁶ 上找到完整示例。\n\n⁶ ⁶http://express.js/guide.html\n⁶https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter6/recipe6\n\
    \nURL、路由与局部组件\n\n## 讨论\n\n当用户选择菜单项时，客户端导航将如预期启动。`menuClass` 函数通过 `ng-class` 指令绑定，并根据当前路由自动为我们更新\
    \ CSS 类。\n\n通过使用 `$location.path()`，我们获取当前路由。`substring` 操作删除了开头的斜杠 (`/`)，并将 `/partials`\
    \ 转换为 `persons`。\n\n## 监听路由变化实现登录机制\n\n## 问题\n\n你想确保用户在导航到受保护页面之前先登录。\n\n## 解决方案\n\
    \n在 `$routeChangeStart` 上实现一个监听器以跟踪下次路由导航。如果用户未登录，则重定向到登录页面。\n\n部分部分是路由变化监听器的实现：\n\
    \n```\nvar app = angular.module(\"MyApp\", []).\nconfig($routeProvider, $locationProvider)\
    \ {\n  $routeProvider.\n  when(\"/persons\", {\n    templateUrl: \"partials/index.html\"\
    });\n  when(\"/login\", {\n    templateUrl: \"partials/login.html\", controller:\
    \ \"LoginCtrl\\n    // 路由移动到这里 ...\n  });\n  otherwise({ redirectTo: \"/persons\"\
    \ });\n});\nrun(function($rootScope, $location) {\n  $rootScope.on(\"$routeChangeStart\"\
    , function(event, next, current) {\n    if ($rootScope.loggedInUser == null) {\n\
    \      // 无登录用户，重定向到 /login\n      if (next.templateUrl === \"partials/login.html\"\
    ) {\n    } else {\n      $location.path(\"/login\");\n    }\n  }\n}\n));\n```\n\
    \n接下来我们定义一个登录表单来输入用户名，为了简单起见跳过了密码：\n\n```\n<form ng-submit=\"login()\">\n  <label>用户名</label>\n\
    \  <input type=\"text\" ng-model=\"username\">\n  <button>登录</button>\n</form>\n\
    ```\n\n最后是登录控制器，它设置登录状态并重定向到人员列表 URL：\n\n```\napp.controller(\"LoginCtrl\", function($scope,\
    \ $location, $rootScope) {\n  $scope.login = function() {\n    $rootScope.loggedIn\
    \ = $scope.username;\n    $location.path(\"/persons\");\n  };\n});\n```\n\n你可以在\
    \ github 65 上找到完整示例。\n\n## 讨论\n\n这不是一个完善的登录系统，请勿在任何生产系统中使用它。但它说明了如何通用地处理 Web 应用特定区域的访问。当你用浏览器打开应用时，在所有情况下你都会被重定向到登录页面。只有在输入用户后才能访问其他区域。\n\
    \n`run` 方法在 Module 66 中定义，它是缓存监听器的良好位置，因为它只在注入器完成加载所有模块后的初始化时运行。我们在 `$rootScope`\
    \ 中检查 `loggedIn`，如果未登录，则将用户重定向到登录页面。注意，为了在已经导航到登录页面时跳过此行为，我们需要显式检查下一个 `templateUrl`。\n\
    \n登录控制器将 `$rootScope` 设置为用户名并重定向到 `/persons`。通常，我尝试避免使用 `$rootScope`，因为它基本上是一种全局状态，但在我们的案例中它非常合适，因为有一个全局可用的当前用户。\n\
    \n> 65https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter6/recipe6\n\
    \n> 66http://docs.angular.org/api/angular.Module\n\n## 使用表单\n\n每个网站最终都会使用某种表单让用户输入数据。Angular\
    \ 实现客户端表单验证变得特别容易，从而提供即时反馈以改善用户体验。\n\n## 实现基础表单\n\n### ### 问题\n\n你想创建一个表单来输入用户信息，并将这些信息在\
    \ Angular.js 作用域中。\n\n### ### 解决方案\n\n使用标准的 `form` 标签和 `ng-model` 指令来实现：\n\n```\n\
    body ng-app=\"MyApp\">\n  <form ng-submit=\"submit()\">\n    <label>姓名</label>\n\
    \    <input type=\"text\" ng-model=\"user.name\">\n    <label>年龄</label>\n   \
    \ <input type=\"text\" ng-model=\"user.age\">\n    <button>提交</button>\n  </form>\n\
    \  <p>姓名：{{user.name}}</p>\n  <p>年龄：{{user.age}}</p>\n</body>\n\n<script>\nvar\
    \ app = angular.module('MyApp', []);\napp.controller('UserCtrl', function($scope)\
    \ {\n  $scope.user = {};\n  $scope.submit = function() {\n    console.log($scope.user);\n\
    \  };\n});\n</script>\n```\n\n### 讨论\n\n上面的示例展示了如何创建一个基础表单。通过 `ng-model`，我们将输入值绑定到作用域中的\
    \ `user` 对象。\n\n## 客户端单单\n\n（         实现一个基础表单\n\n### ### 问题\n\n你想创建一个表单来输入用户信息，并将这些信息在\
    \ Angular.js 作用域中。\n\n### ### 解决方案\n\n                           \n\n（注：此处原文文本似乎存在重复或截断，根据您的指令“不要重复输出原文”，我将基于您提供的逻辑结构进行翻译）\n\
