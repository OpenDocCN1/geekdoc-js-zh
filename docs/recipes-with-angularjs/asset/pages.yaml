  md: "# Filters\n\nAngular Filters are typically used to format expressions in bindings\
    \ in your template. They transform the input data to a new formatted data type.\n\
    \n# Formatting a String With a Currency Filter\n\n# Problem\n\nYou want to format\
    \ the amount of currency with a localized currency label.\n\n# Solution\n\nUse\
    \ the built-in currency filter and make sure you load the corresponding locale\
    \ file for the users language.\n\n```\n<html>\n<head>\n  <meta charset='utf-8'>\n\
