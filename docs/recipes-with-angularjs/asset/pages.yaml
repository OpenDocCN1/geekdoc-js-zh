  md: "# Consuming Externals Services\n\n```\n<script src=\"angular-resource.js\"\
    >\n```\n\nLet us now start defining the application module and our Post model\
    \ as an Angular service:\n\n```\nvar app = angular.module('MyApp', ['$ngResource']);\n\
    app.factory(\"Post\", function($resource) {\n  return $resource(\"/api/posts/:id\"\
    );\n});\n```\n\nNow we can use our service to retrieve a list of posts inside\
    \ of a controller (example: HTTP GET /api/posts):\n\n```\napp.controller(\"PostIndexCtrl\"\
    , function($scope, Post) {\n  Post.query(function(data) {\n    $scope.posts =\
    \ data;\n  }\n});\n```\n\nOr a specific post by id (example: HTTP GET /api/posts/1):\n\
    \n```\napp.controller(\"PostShowCtrl\", function($scope, Post) {\n  Post.get({\
    \ id: 1 }, function(data) {\n    $scope.post = data;\n  }\n});\n```\n\nWe can\
    \ create a new post using save (example: HTTP POST /api/posts):\n\n```\nPost.save(data);\n\
    ```\n\nAnd we can delete a specific post by id (example: DELETE /api/posts/1):\n\
    \n```\nPost.delete({ id: id });\n```\n\nThe complete example code is built from\
    \ Brian Ford's angular-express-seed⁴⁶ and uses the Express⁴⁷ framework.\n\nYou\
