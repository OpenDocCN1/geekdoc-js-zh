  md: "```\nelement.on(\"click\", function() {\n  $(this).css({\"background-color\"\
    : \"red\"});\n});\n```\n\nIn this case element is alray an jQuery element and\
    \ we can directly use the on function.\n\n# # Rendering an HTML Snippet in a Directive\n\
    \n# # Problem\n\nYou want to render an HTML snippet as a reusable component.\n\
    \n# # Solution\n\nImplement a directive and use the template attribute to define\
    \ the HTML.\n\n```\n<body ng-app=\"MyApp\">\n  <my-widget/>\n</body>\n\nvar app\
    \ = angular.module(\"MyApp\", []);\napp.directive(\"myWidget\", function() {\n\
    \  return {\n    restrict: \"E\",\n    template: \"<p>Hello World</p>\"\n  };\n\
    });\n```\n\nYou can find the complete example on github²⁵.\n\n# # Discussion\n\
    \nThis will render the Hello World paragraph as a child node of your my-widget\
    \ element. In case you want to replace the element entirely with the paragraph\
    \ you have to additionally return the replace attribute:\n\n> ²⁵https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe3"
