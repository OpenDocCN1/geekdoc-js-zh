  md: "# Rails Security using Authenticity Token\n\nThe example code works nicely\
    \ until we use the HTTP methods, POST, PUT and DELETE with the resource. As a\
    \ security mechanism Rails expects an authenticity token to prevent a CSRF Cross\
    \ Site Request Forgery) attack. We need to submit an authenticity header X-CSRF-Token\
    \ with the token. It is knowingly rendered in the HTML meta tag csrf-token by\
    \ Rails. Using Query we can fetch meta definition and configure the `$httpProvider`\
    \ appropriately.\n\n```\nvar app = angular.module(\"Contacts\", [\"ngResource\"\
    ]);\napp.config(function($httpProvider) {\n  $httpProvider.defaults.headers.common['X-CSRF-Token']\
    \ =\n  $meta(name=\"csrf-token\").attr('content');\n});\n```\n\n# Rails JSON response\
    \ format\n\nIf you are using a Rails version prior 3.1 you will notice that the\
    \ JSON response will use a contact namespace for the model attributes which breaks\
    \ your Angularjs code. To disable this behaviour you can configure your Rails\
    \ apps accordingly.\n\n+   ActiveRecord::Base.include_root_in_json = false\n\n\
    There are still inconsistencies between the Ruby and Javascript world. For example\
    \ in Ruby we used underscore attribute names (display_name) whereas in Javascript\
    \ we use camelCase (displayName).\n\nThere is a custom $resource implementation\
    \ angularjs-resource** available to streamline consuming Rails resources. It uses\
    \ transformers and interceptors to rename the attribute fields and handles the\
    \ root wrapping behaviour for you.\n\n# Implementing Client-Side Routing\n\n#\
    \ Problem\n\nYou want to use client-side routing in conjunction with a Ruby on\
    \ Rails backend.\n\n# Solution\n\nEvery request to the backend should initially\
    \ render the complete page in order to load our Angular app. Only then the client-side\
    \ rendering will take over. Let us first have a look at the route definition for\
    \ this \"catch-all\" route.\n\n> ⁹https://guides.rubyonrails.org/security.html#site-request-forgery-csrf\n\
    ⁹https://github.com/tpodom/angularjs-rails-resource"
