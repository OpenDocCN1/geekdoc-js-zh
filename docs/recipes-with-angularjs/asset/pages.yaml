  md: "# Solution\n\nWe use the same example but use the Express^39 framework to serve\
    \ all content and handle the URL rewriting.\n\nLet us start with the route configuration:\n\
    \n```\napp.config(function($routeProvider, $locationProvider) {\n  $locationProvider.htmlMode(true);\n\
    \n  $routeProvider;\n  when(\"/persons\",\n    {templateUrl: \"/partials/index.jade\"\
    ,\n      controller: \"PersonIndexCtrl\" });\n  );\n  when(\"/persons/:id\",\n\
    \    {templateUrl: \"/partials/show.jade\",\n      controller: \"PersonShowCtrl\"\
    \ });\n  );\n  otherwise({ redirectTo: \"/persons\" });\n});\n```\n\nThere are\
    \ no changes except the htmlMode which enables our new routing mechanism. Controller\
    \ implementation does not change at all.\n\nWe have to take care of the partial\
    \ loading. Our Express app will have to serve the partials for Our typical boilerplate\
    \ for an Express app loads the module and creates a server:\n\n```\nvar express\
    \ = require('express');\nvar app = module.exports = express.createServer();\n\
    ```\n\nWe skip the configuration here and jump directly to the server-side route\
    \ definition:\n\n```\napp.get('/partials/:name', function (req, res) {\n  var\
    \ name = req.params.name;\n  res.render('/partials/' + name);\n});\n```\n\nThe\
    \ Express route definition loads the partial with given name and renders its content.\n\
    \nWhen supporting HTML5 routing our server has to redirect all other URLs to the\
    \ entry point of our application, the index page. First we define the rendering\
    \ of the index page, which contains the ng-view directive:\n\n> http://expressjs.com/"
