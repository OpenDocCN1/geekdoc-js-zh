  md: '# Common User Interface Patterns


    The interceptor is implemented using the factory method and attaches itself to
    the promise function of the AJAX response to hide the spinner on success or failure.
    Note, on failure we use the reject function of the $http service, Angular’s promise/deferred
    implementation.


    Now, in the config method we add our interceptor to the list of responseInterceptors
    of $httpProvider to register it properly. In a similar manner we add the spinnerFunction
    to the default transformRequest list in order to call it before each AJAX request.


    The controller is responsible for using a $resource object and handling the button
    click with the load function. We are using JSONP here to allow this code to be
    executed locally even though it served by a different domain.


