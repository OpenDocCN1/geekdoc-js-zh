    \ { method: 'GET', isArray: false },\n    'update': { method: 'PUT' },\n    'destroy':\
    \ { method: 'DELETE' }\n  }\n});\n```\n\nWe can now fetch a list of contacts using\
    \ Contact.index() and a single contact with Contact.show(id). These actions can\
