  md: "# Solution\n\nUse the $resource service and configure it to use JSONP. As an\
    \ example we will call the Twitter search API here.\n\nThe HTML template you enter\
    \ a search term in an input field and will render the search result in a list.\n\
    \n```\n<body ng-app=\"MyApp\">\n  <div ng-controller=\"MyCtrl\">\n    <input type=\"\
    text\" ng-model=\"searchTerm\" placeholder=\"Search term\">\n    <button ng-click=\"\
    search()\">Search</button>\n    <ul ng-repeat=\"tweet in searchResult.results\"\
    >\n      <li>{{tweet.text}}</li>\n    </ul>\n  </div>\n</body>\n```\n\nThe $resource\
    \ configuration can be done in a controller requesting the data:\n\n```\nvar app\
    \ = angular.module(\"MyApp\", [\"ngResource\"]);\n\nfunction MyCtrl($scope, $resource)\
    \ {\n  var TwitterAPI = \"http://search.twitter.com/search.json\",\n    callback:\
    \ \"JSON_CALLBACK\",\n    get: { method: \"JSONP\" });\n\n  $scope.search = function()\
    \ {\n    $scope.searchResult = TwitterAPI.get({ q: $scope.searchTerm });\n  };\n\
    }\n```\n\nYou can find the complete example on github.\n\n# Discussion\n\nThe\
    \ twitter search API supports a callback attribute for the JSON format as described\
    \ in their documentation¹². The $resource definition sets the callback attribute\
    \ to JSON_CALLBACK, which is a convention from Angular when using JSONP³. It is\
    \ a placeholder which is replaced with the real callback function, generated by\
    \ Angular. Additionally we configure the method to use JSONP. Now, when calling\
    \ the API we use the q URL parameter to pass the entered searchTerm.\n\n> *¹https://github.com/dietz/recipes-with-angular-js-examples/tree/master/chapter5/recipe3\n\
    ²https://dev.twitter.com/api/v1/search\n³https://en.wikipedia.org/wiki/JSONP"
