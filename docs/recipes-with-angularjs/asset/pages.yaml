  md: "# Directives\n\n```\n<my-widget>\n<p>This is my paragraph text.</p>\n</my-widget>\n\
    \nvar app = angular.module(\"MyApp\", []);\n\napp.directive(\"myWidget\", function()\
    \ {\n  return {\n    restrict: \"E\",\n    transclude: true,\n    template: \"\
    <div> ng-transclude><h3>Heading</h3></div>\"\n  };\n});\n```\n\nThis will render\
    \ a div element containing a h3 element and append the directives child node with\
    \ the paragraph element below.\n\nYou can find the complete example on github.\n\
    \n# Discussion\n\nIn this context transclusion refers to the inclusion of a part\
    \ of a document into another document by reference. The ng-transclude attribute\
    \ should be placed depending on where you want your child nodes to be appended\
    \ to.\n\n# Passing Configuration Params Using HTML Attributes\n\n# Problem\n\n\
    You want to pass a configuration param to change the rendered output.\n\n# Solution\n\
    \nUse the attribute based directive and pass an attribute value for the configuration.\
    \ The attribute is passed as a parameter to the link function."
