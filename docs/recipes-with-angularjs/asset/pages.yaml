  md: "# Directives\n\n```\n<tabs>\n  <pane title=\"First Tab\">First pane. </pane>\n\
    \  <pane title=\"Second Tab\">Second pane. </pane>\n</tabs>\n```\n\nThe directive\
    \ implementation is split into the tabs and the pane directive. Let us start with\
    \ the tabs directive.\n\n```\napp.directive(\"tabs\", function() {\n  return {\n\
    \    restrict: \"E\",\n    transclude: {},\n    scope: {\n      controller: function($scope,\
    \ element) {\n        var panes = $scope.panes = [];\n        $scope.select =\
    \ function(pane) {\n          angular.forEach(each, function(pane) {\n       \
    \     pane.selected = false;\n          });\n          pane.selected = true;\n\
    \          console.log(\"selected pane: \", pane.title);\n        }\nthis.addPane\
    \ = function (pane) {\n          if (!panes.length) $scope.select(pane);\n   \
    \       panes.push(pane);\n        }\n      },\n      template:\n        '<div\
    \ class=\"tabrable\"> ' +\n        '<ul class=\"nav-tabs\" ng-repeat=\"pane in\
    \ panes\">' +\n        '<li ng-class=\"{active:pane.selected}\">' +\n        '<a\
    \ href=\"\" ng-click=\"select(pane)\">{{pane.title}}</a>' +\n        '</li>' +\n\
    \        '</ul>' +\n        '<div class=\"tab-content\" ng-transclude></div>'\
    \ +\n        '</div>',\n    replace: true\n  }\n});\n```"
