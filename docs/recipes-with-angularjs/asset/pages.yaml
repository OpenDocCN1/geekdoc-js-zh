  md: '# # An Introduction to Angular.js


    # ## Including the Angular.js library Code in an HTML page


    # ### Problem


    You want to use Angular.js on a web page.


    # ### Solution


    In order to get your first Angular.js app up and running you need to include the
    Angular Javascript via script tag and make use of the ng-app directive.


    ```

    <html>

    <head>

    <script src="http://ajax.googleapis.com/libs/ajax/angularjs/1.0.4/angular.js"></script>

    </head>

    <body ng-app>

    <p>This is your first angular expression: {{ 1 + 2 }}</p>

    </body>

    </html>

    ```


    > Tip: You can check out a complete example on github.


    # ### Discussion


    Adding the ng-app directive tells Angular to kick in its magic. The expression
    {{ 1 + 2 }} is evaluated by Angular and the result 3 is rendered. Note, that removing
    ng-app will result in the browser to render the expression as instead of evaluating
    it. Play around with the expression! You can for example concatenate Strings and
    invert or Boolean values.


    For Brevity reasons we skip the boilerplate code in the following recipes.'
  merge: -1
