  md: "# Common User Interface Patterns\n\n```\n<input type=\"text\" ng-model=\"message\"\
    \ autofocus>\n<button class=\"btn\">Submit</button>\n</form>\n\n<script>\n<script\
    \ type=\"text/ng-template\" id=\"page.html\">\n<h3>Next Page</h3>\n</script>\n\
    \n</body>\n```\n\nNote, that the flash message just like the navigation is always\
    \ shown but conditionally hidden depending on if there a flash message available.\n\
    \nThe route definition defines the pages, nothing new for us:\n\n```\nvar app\
    \ = angular.module(\"MyApp\", []);\napp.config(function($routeProvider) {\n  $routeProvider.\n\
    \  when(\"/home\", { templateUrl: \"home.html\" }).\n  when(\"/page\", { templateUrl:\
    \ \"page.html\" }).\n  otherwise({ redirectTo: \"/home\" });\n});\n```\n\nThe\
    \ interesting part is the flash service which handles a queue of messages and\
    \ listeners for route to change a message from the queue to the current page.\n\
    \n```\napp.factory(\"flash\", function($rootScope) {\n  var queue = [];\n  var\
    \ currentMessage = \"\";\n  $rootScope.on(\"$routeChangeSuccess\", function()\
    \ {\n    currentMessage = queue.shift() || \"\";\n  });\n  return {\n    setMessage:\
    \ function(message) {\n      queue.push(message);\n    }\n  };\n});\n```"
