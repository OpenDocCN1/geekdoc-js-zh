  md: '# An Introduction to Angular.js


    You can find the complete example on github.


    When toggling the button "Hello World" paragraph will change its visibility


    # Discussion


    Using the ng-controller directive we bind the div element including its children
    to the context of the MyCtrl Controller. The ng-click directive will call the
    toggle() function of our controller on button click. Note, that the ng-show directive
    is bound to the scope variable and will toggle the particular''s visibility accordingly.


    The controller implementation defaults the visible attribute to false and toggles
    its boolean state in the toggle function. Both the visible variable and the toggle
    function are defined on the $scope which is passed to all controllers automatically
    via dependency injection.


    The next chapter will go into all the details of controllers in Angular. Now let
    us quickly discuss the MVVM (Model-View-ViewModel) pattern as used in Angular.
    In the MVVM pattern the model is plain javascript, the view is the HTML template
    and the ViewModel is the glue between the template and the model. The ViewModel
    makes Angular''s two binding changes where the model and the template are sync
    automatically.


    In our example the visible attribute is the model, but it will be of much more
    complex as example retrieving data from a back service. The controller is used
    to define the scope which represents the ViewModel. It interacts with the HTML
    template by binding the scope variable visible and the function toggle() to it.


    # Converting Output with Filters


    # Problem


    When presenting data to the user, you might need to convert the data to a more
    user-friendly format. In our case we need to uppercase the name value from the
    previous recipe in the expression.


    # Solution


    Use the uppercase Angular filter.


    ```

    Enter your name: <input type="text" ng-model="name"></input>

    <p>Hello {{name | uppercase }}</p>

    ```


    You can find the complete example on github.


    > https://github.com/fdietz/recipes-angular-js/examples/tree/master/chapter1/recipe

    https://github.com/fdietz/recipes-angular-js/examples/tree/master/chapter1/recipes'
  merge: -1
