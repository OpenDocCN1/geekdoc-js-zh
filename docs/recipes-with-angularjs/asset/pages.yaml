  md: '# Deferred and Promise


    # Problem


    You want to synchronize multiple asynchronous functions and avoid Javascript callback
    hell.


    # Solution


    As an example we want to call three services in sequence and combine the result
    of them. Let us start with a nested approach:


    ```

    tmp = [];


    $http.get("/app/data/first.json").success(function(data) {

    tmp.push(data);

    $http.get("/app/data/second.json").success(function(data) {

    tmp.push(data);

    $http.get("/app/data/third.json").success(function(data) {

    tmp.push(data);

    $scope.combinedNestedResult = tmp.join(", "");

    });

    });

    });

    ```


    We call the get function three times to retrieve JSON documents each with an array
    of strings. We haven''t even starting error handling already using nested callbacks
    the code becomes messy and can be improved using the q service:


    ```

    var first = $http.get("/app/data/first.json"),

    second = $http.get("/app/data/second.json"),

    third = $http.get("/app/data/third.json");


    $q.all([first, second, third]).then(function(result) {

    var tmp = [];

    angular.forEach(result, function(response) {

    tmp.push(response.data);

    });

    return tmp;

    }).then(function(tmpResult) {

    $scope.combinedResult = tmpResult.join(", "");

    });

    ```'
