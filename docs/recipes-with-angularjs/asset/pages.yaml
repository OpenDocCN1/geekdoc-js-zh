- img_proc: true
  md: "# An Introduction to Angular.js\n\n# Discussion\n\nAngular uses the | (pipe)\
    \ character to combine filters with variables in expressions. When evaluating\
    \ the expression, the name variable is passed to the uppercase filter. This is\
    \ similar to working with the Unix bash pipe symbol when an input can be transformed\
    \ by another program. Also try the lowercase filter!\n\n# Creating Custom HTML\
    \ elements with Directives\n\n# Problem\n\nYou want to render an HTML snippet\
    \ but hide it conditionally.\n\n# Solution\n\nCreate a custom Directive which\
    \ renders your Hello World snippet.\n\n```\n<body> ng-app=\"MyApp\">\n  <label\
    \ for=\"checkbox\">\n    <input id=\"checkbox\" type=\"checkbox\" ng-model=\"\
    visible\">Toggle me\n  </label>\n  <div show=\"visible\">\n    <p>Hello World</p>\n\
    \  </div>\n</body>\n```\n\nThe show attribute is directive, with the following\
    \ implementation:\n\n```\nvar app = angular.module(\"MyApp\", []);\n\napp.directive(\"\
    show\", function() {\n  return {\n    link: function(scope, element, attributes)\
    \ {\n      scope.$watch(attributes.show, function(value) {\n        element.css('display',\
    \ value ? '' : 'none');\n      });\n    }\n  };\n});\n```"
  merge: -1
