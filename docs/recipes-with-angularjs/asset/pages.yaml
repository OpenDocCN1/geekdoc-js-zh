    # Displaying a Modal Dialog


    # Question


    You want to use a Modal Dialog using the Twitter Bootstrap Framework. A dialog
    is called modal when it is blocking the rest of your web application until it
    is closed.


    # Solution


    The angular-ui module''s nice modal plugin which directly supports Twitter Bootstrap.
    The template defines a button to open the modal and the modal code itself.


    ```

    <body ng-app="MyApp" ng-controller="MyCtrl">

    <button class="btn" ng-click="open()">Open Modal</button>

    <div class="showModal" close="cancel()">

    <div class="modal-header">

    <h4>Modal Dialog</h4>

    </div>

    <div class="modal-body">

    <p>Example paragraph with some text.</p>

    </div>

    <div class="modal-footer">

    <button class="btn btn-success" ng-click="ok()">Ok</button>

    <button class="btn" ng-click="cancel()">Cancel</button>

    </div>

    </div>

    </div>

    </body>

    ```'
