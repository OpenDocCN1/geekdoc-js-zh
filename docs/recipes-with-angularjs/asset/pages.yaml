  md: "# Directives\n\nDirectives are one of the most powerful concepts in Angular\
    \ since they let you invent new html elements specific to your application. This\
    \ allows you to create reusable components which encapsulate complex DOM structures,\
    \ stylesheets and even behaviour.\n\n# Enabling/Disabling DOM Elements Conditionally\n\
    \n# Problem\n\nYou want to disable a button depending on a checkbox state.\n\n\
    # Solution\n\nUse the ng-disabled directive and bind its condition to the checkbox\
    \ state.\n\n```\n<body> ng-app>\n  <label><input type=\"checkbox\" ng-model=\"\
    checked\">/>Toggle Button</label>\n  <button ng-disabled=\"checked\">Press me</button>\n\
    </body>\n```\n\nYou can find the complete example on github¹¹.\n\n# Discussion\n\
    \nThe ng-disabled directive is a direct translation from the disabled HTML attribute,\
    \ without you needing to worry about browser incompatibilities. It is bound to\
    \ the checked model using an attribute value as the checkbox using the ng-directive.\
    \ In fact the checked attribute value is again an Angular expression. You could\
    \ for example invert the logic and use !checked.\n\nThis is just one example of\
    \ a directive with Angular. There are many others for example ng-hide, ng-checked\
    \ or ng-mouseenter I encourage you to go through the API Reference¹² and explore\
    \ all directives Angular has to offer.\n\nIn the next recipes we will focus on\
    \ implementing directives."
  merge: -1
  pgno: 23
- img_proc: true
  md: "# Changing the DOM in Response to User Actions\n\n# Problem\n\nYou want to\
    \ change the CSS of an HTML element on a mouse click and encapsulate this behaviour\
    \ in a reusable component.\n\n# Solution\n\nImplement a directive-my-widget which\
    \ contains an example paragraph of text we want to style.\n\n```\n<body ng-app=\"\
    MyApp\">\n  <my-widget>\n    <p>Hello World</p>\n  </my-widget>\n</body>\n```\n\
    \nWe use a function in our directive implementation to change the CSS of the paragraph.\n\
    \n```\nvar app = angular.module(\"MyApp\", []);\napp.directive(\"myWidget\", function()\
    \ {\n  var linkFunction = function(scope, element, attributes) {\n    var paragraph\
    \ = element.children()[0];\n    $(paragraph).on(\"click\", function() {\n    \
    \  $(this).css(\"background-color\": \"red\"});\n    });\n  }\n  return {\n  \
    \  restrict: \"E\",\n    link: linkFunction\n  };\n});\n```\n\nWhen clicking on\
    \ the paragraph the background color changes to red.\nYou can find the complete\
    \ example on github².\n\n> ²³https://github.com/fietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe2"
  merge: -1
  pgno: 24
- img_proc: true
  md: "# Discussion\n\nIn the HTML document we use the new directive as an HTML element\
    \ my-widget, which can be found in the javascript code as myWidget again. The\
    \ directive returns a restriction and a link function.\n\nThe restriction means\
    \ that this directive can only be used as an HTML element and not for example\
    \ an HTML attribute. If you want to use it as an HTML attribute, change the restrict\
    \ to return A instead. The usage would then have to be adapted to:\n\n```\n<div\
    \ my-widget>\n<p>Hello World</p>\n</div>\n```\n\nWhether you use the attribute\
    \ or element mechanism depends on your use case. Generally speaking one would\
    \ use the element mechanism to define a reusable component. The attribute mechanism\
    \ would be used whenever you want to \"configure\" some element or enhance it\
    \ with more behaviour. Other available options are the directive as a class attribute\
    \ or a comment.\n\nThe directive method expects a function which can be used for\
    \ initialization and injection of dependencies.\n\n```\napp.directive(\"myWidget\"\
    , function factory(injectables) {\n  //\n}\n```\n\nThe link function is much more\
    \ interesting since it defines the actual behaviour. The scope, the actual HTML\
    \ element my-widget and the html attributes are passed as parameters. Note, that\
    \ this has nothing to do with Angular dependency injection mechanism. Ordering\
    \ of the parameters is important!\n\nFirst select the paragraph element, which\
    \ is child of the my-widget element using Angular children() function as defined\
    \ by element. In the second step we use jQuery to bind to the click event and\
    \ modify the css property on click. This is of special interest since we have\
    \ a mixture of Angular functions and jQuery here. In fact under the hood Angular\
    \ will use jQuery in the children() function if it is defined and will fall back\
    \ to jqLite (shipped with Angular) otherwise. We can find all supported methods\
    \ in the API Reference of element24.\n\nFollowing a slightly changed version of\
    \ the code using jQuery only:"
  merge: -1
  pgno: 25
