  md: "```\napp.directive(\"myWidget\", function() {\n  return {\n    restrict: \"\
    E\",\n    replace: true,\n    template: \"<p>Hello World</p>\"\n  };\n});\n```\n\
    \nAnother option would be to use a file for the HTML snippet. In this case you\
    \ need to use the templateUrl attribute, for example:\n\n```\napp.directive(\"\
    myWidget\", function() {\n  return {\n    restrict: \"E\",\n    replace: true,\n\
    \    templateUrl: \"widget.html\"\n  };\n});\n```\n\nThe widget.html should reside\
    \ in the same directory as the index.html file. This will only work if you use\
    \ a web server to host the file. The example on Github uses angular-seed as bootstrap\
    \ again.\n\n# Rendering a Directive's DOM Node Children\n\n# Problem\n\nYour widget\
    \ uses the child nodes of the directive element to create a combined rendering.\n\
    \n# Solution\n\nUse the transclude attribute attribute together with the ng-transclude\
    \ directive."
