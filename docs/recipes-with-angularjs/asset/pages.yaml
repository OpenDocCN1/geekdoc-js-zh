  md: "# Discussion\n\nThe Form Controller attributes form.$invalid and friends are\
    \ very useful to cover all kinds of use cases which focus on the form as a whole\
    \ instead of individual fields.\n\nNote, that you have to assign a name attribute\
    \ to the form element, otherwise form.$invalid won't be available.\n\n# Implementing\
    \ Custom Validations\n\n# Problem\n\nYou want to validate user input by comparing\
    \ it to a blacklist of words.\n\n# Solution\n\nThe angular-ui* project offers\
    \ a nice custom validation directive which lets you pass in options via expression.\n\
    \nLet us have a look at the template first with the usage of the ui-validate Directive:\n\
    \n```\n<input name=\"firstname\" type=\"text\"\nng-model=\"user.firstname\" required\n\
    ui-validate=\" { blacklisted: 'notBlacklisted($value)' }\"\n/>\n<p ng-show=\"\
    form.firstname.$error.blackListed\">\n  This firstname is blacklisted.\n</p>\n\
    ```\n\nAnd the controller with the notBlackListed implementation:"
  merge: -1
