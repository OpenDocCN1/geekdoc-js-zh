  md: "# Controllers\n\nControllers in Angular provide the business logic to handle\
    \ view behaviour, for example responding to a user clicking a button or entering\
    \ some text in a form. Additionally controllers prepare the model for the view\
    \ template.\n\nAs a general rule a controller should not reference or manipulate\
    \ the DOM directly. This has the the benefit of simplifying unit testing controllers.\n\
    \n# Assigning a Default Value to a Model\n\n# Problem\n\nYou want to assign a\
    \ default value to the scope in the controllers context.\n\n# Solution\n\nUse\
    \ the ng-controller directive in your template:\n\n```\n<div ng-controller=\"\
    MyCtrl\">\n  <p>{{value}}</p>\n</div>\n```\n\nNext, define the scope variable\
    \ in your controller function:\n\n```\nvar MyCtrl = function($scope) {\n  $scope.value\
    \ = \"some value\";\n};\n```\n\nYou can find the complete example on github¹⁰.\n\
    \n# Discussion\n\nDepending on where you use the ng-controller, you define its\
    \ assigned scope. The scope is hierarchical and follows the DOM node hierarchy.\
    \ In our example the value expression is correctly evaluated to some value, since\
    \ value is set in the MyCtrl controller. Note, that this would not work if the\
    \ expression is moved outside the controllers scope:\n\n> ¹⁰https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe1"
  merge: -1
  pgno: 13
- img_proc: true
  md: "```\n<p>{{value}}</p>\n```\n\n```\n<div ng-controller=\"MyCtrl\">\n</div>\n\
    ```\n\nIn this case, {{value}} will simply not be rendered at all due to the fact\
    \ that expression evaluation in Angular.js is forgiving for undefined and null\
    \ values.\n\n# Changing a Model Value with a Controller Function\n\n# Problem\n\
    \nYou want to increment a model value by 1 using a controller function.\n\n# Solution\n\
    \nImplement an increment function which changes the scope.\n\n```\nfunction MyCtrl($scope)\
    \ {\n  $scope.value = 1;\n  $scope.incrementValue = function(value) {\n    $scope.value\
    \ += 1;\n  }\n}\n```\n\nThis function can be called directly in an expression,\
    \ in our example we use ng-init:\n\n```\n<div ng-controller=\"MyCtrl\">\n<p ng-init=\"\
    incrementValue(5)\">{{value}}</p>\n</div>\n```\n\nYou can find the complete example\
    \ on github.\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe"
  merge: -1
  pgno: 14
- img_proc: true
  md: "# Discussion\n\nThe ng-directive is executed on page load and calls the function\
    \ incrementValue defined in MyCtrl. Functions are defined on the scope very similar\
    \ to values but must be called with the familiar parenthesis syntax.\n\nOf course,\
    \ it would have been possible to increment the value right inside of the expression\
    \ with value = value +1 but imagine the function being much more complex! Moving\
    \ this function into a controller separates our business logic from our declarative\
    \ view template and we can easily write unit tests for it.\n\n# Encapsulating\
    \ a Model Value with a Controller Function\n\n# Problem\n\nYou want to retrieve\
    \ a model via function (instead of directly accessing the scope from the template)\
    \ which encapsulates the model value.\n\n# Solution\n\nDefine a getter function\
    \ which returns the model value.\n\n```\nfunction MyCtrl($scope) {\n  $scope.value\
    \ = 1;\n\n  $scope.getIncrementedValue = function() {\n    return $scope.value\
    \ + 1;\n  }\n}\n```\n\nThen in the template we use an expression to call it:\n\
    \n```\n<div ng-controller=\"MyCtrl\">\n<p>{{getIncrementedValue()}}</p>\n</div>\n\
    ```\n\nYou can find the complete example on github¹.\n\n> ¹²https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe2"
  merge: -1
  pgno: 15
- img_proc: true
  md: "Controllers\n\n# Discussion\n\nMyCtrl defines the getIncrementedValue function\
    \ which uses the current value and returns it incremented by one. One could argue\
    \ depending on the use case it would make more sense to use a filter. But, there\
    \ are use cases specific to the controllers behaviour where you do not require\
    \ a generic filter.\n\n# Responding to Scope Changes\n\n# Problem\n\nYou want\
    \ to react on a model change to trigger some further actions. In our example we\
    \ want to set another model value depending on the value we are listening on.\n\
    \n# Solution\n\nUse the $watch function in your controller.\n\n```\nfunction MyCtrl($scope)\
    \ {\n  $scope.name = \"\";\n  $scope.watch(\"name\", function(newValue, oldValue)\
    \ {\n    if ($scope.name.length > 0) {\n      $scope.greeting = \"Greetings \"\
    \ + $scope.name;\n    }\n  });\n});\n```\n\nIn our example we use the input value\
    \ to print a friendly greeting.\n\n```\n<div ng-controller=\"MyCtrl\">\n  <input\
    \ type=\"text\" ng-model=\"name\" placeholder=\"Enter your name\">\n  <p>{{greeting}}</p>\n\
    </div>\n```\n\nThe value greeting will be changed whenever there's a change on\
    \ the name model and the value is not blank.\n\nYou can find the complete example\
    \ on github¹."
  merge: -1
  pgno: 16
- img_proc: true
  md: "# Discussion\n\nThe first argument name of the $watch function is actually\
    \ an Angular expression, so you can use more complicated expressions (for example:\
    \ [value1, value2] | json) or even a javascript function. In this case you need\
    \ to return a String in the watcher function:\n\n```\n$scope.watch(function()\
    \ {\n  return scope.name;\n}, function(newValue, oldValue) {\n  console.log(\"\
    change detected: \" + newValue);\n});\n```\n\nThe second argument is a function\
    \ that gets called whenever the expression evaluation returns a different value.\
    \ The first parameter is the new value and the second parameter the old value.\
    \ Internally this uses angular.equals determine equality which means both objects\
    \ or values pass the === comparison.\n\n# Sharing Models Between Nested Controllers\n\
    \n# Problem\n\nWant to share a model between a nested hierarchy of controllers.\n\
    \n# Solution\n\nUse javascript objects instead of primitives or direct $parent\
    \ scope references. Our example template uses a controller MyCtrl and a nested\
    \ controller MyNestedCtrl:\n\n```\n<body ng-app=\"MyApp\">\n  <div ng-controller=\"\
    MyCtrl\">\n    <label>Primitive</label>\n    <input type=\"text\" ng-model=\"\
    name\">\n    <label>Object</label>\n    <input type=\"text\" ng-model=\"user.name\"\
    >\n    <div class=\"nested\" ng-controller=\"MyNestedCtrl\">\n      <label>Primitive</label>\n\
    \      <input type=\"text\" ng-model=\"name\">\n    </div>\n  </div>\n</body>\n\
    ```"
  merge: -1
  pgno: 17
- img_proc: true
  md: "```\n<label>Primitive with explicit $parent reference</label>\n```\n\n```\n\
    <input type=\"text\" ng-model=\"$parent.name\">\n```\n\n```\n<label>Object</label>\n\
    ```\n\n```\n<input type=\"text\" ng-model=\"user.name\">\n```\n\n```\n</div>\n\
    ```\n\n```\n</div>\n```\n\n```\n</body>\n```\n\nThe app.js file contains the controller\
    \ definition and initializes the scope with some defaults:\n\n```\nvar app = angular.module(\"\
    MyApp\", []);\n\napp.controller(\"MyCtrl\", function($scope) {\n  $scope.name\
    \ = \"Peter\";\n  $scope.user = {\n    name: \"Parker\"\n  };\n});\n\napp.controller(\"\
    MyNestedCtrl\", function($scope) {\n});\n```\n\nPlay around with the various input\
    \ fields and check how changes affect each other.\nYou can find the complete example\
    \ on github.\n\n# Discussion\n\nThe default values are defined in MyCtrl which\
    \ is the parent of MyNestedCtrl. When doing in the first input field, the changes\
    \ will be in sync with the other input fields bound to the name variable. They\
    \ share the same scope variable as long as they only read from the variable. If\
    \ you change the nested value, a copy in the scope of the MyNestedCtrl will be\
    \ created. From now on, changing the first input field will only change the nested\
    \ input field which explicitly references the parent scope via $parent.name expression.\n\
    \nThe object based value behaves differently in this. Whether the nested or the\
    \ MyCtrl scopes input fields, the changes will stay in sync. In angular a prototypically\
    \ inherits properties from a parent scope. Objects are references and are kept\
    \ in sync. Whereas primitive types are only in sync as long as they are not changed\
    \ in the child scope.\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe5"
  merge: -1
