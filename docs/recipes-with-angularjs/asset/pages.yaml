  md: "```\napp.controller(\"AnotherCtrl\", [\"$scope\", \"UserService\", function($scope,\
    \ UserService) {\n  $scope.firstUser = UserService.first();\n});\n```\n\nThe syntax\
    \ looks a bit funny, but since Strings in Arrays are not changed during the minification\
    \ it solves our problem. Note, you could change the parameter names of the function,\
    \ since the injection mechanism uses the order of the Array definition only.\n\
    \nAnother way to achieve the same is using the $inject annotation.\n\n```\nvar\
    \ anotherCtrl = function($scope, UserService) {\n  $scope.firstUser = UserService.first();\n\
    }\nanotherCtrl.$inject = [\"$scope\", \"UserService\"];\n```\n\nThis requires\
    \ you to use a temporary variable to call the $inject service. Again, you could\
    \ change the function parameter names. You will most probably see both versions\
    \ applied in apps using Angular.\n\n# Testing Controllers\n\n# Problem\n\nYou\
    \ want to test your business logic.\n\n# Solution\n\nImplement a unit test using\
