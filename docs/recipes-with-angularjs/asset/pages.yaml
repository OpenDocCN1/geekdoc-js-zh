  md: "# Directives\n\n```\n<body> ng-app=\"MyApp\">\n  <basket apple orange>Roll\
    \ over me and check the console!</basket>\n</body></html>\n```\n\nThe basket directive\
    \ manages an array to which one can add apples and oranges.\n\n```\nvar app =\
    \ angular.module(\"MyApp\", []);\n\napp.directive(\"basket\", function() {\n \
    \ return {\n    restrict: \"E\",\n    controller: function($scope, element, $attrs)\
    \ {\n      $scope.content = [];\n\n      this.addApple = function() {\n      \
    \  $scope.content.push(\"apple\");\n      };\n\n      this.addOrange = function()\
    \ {\n        $scope.content.push(\"orange\");\n      };\n\n    link: function(scope,\
    \ element) {\n      element.bind(\"mouseenter\", function() {\n        console.log(scope.content);\n\
    \      });\n    }}\n  };\n});\n```\n\nAnd finally the apple and orange directives\
    \ which add themselves to the basket using the basket's controller."
  merge: -1
  pgno: 33
- img_proc: true
  md: "```\napp.directive(\"apple\", function() {\n  return {\n    require: \"basket\"\
    ,\n    link: function(scope, element, attrs, basketCtrl) {\n      basketCtrl.addApple();\n\
    \    }\n  };\n});\n```\n\n```\napp.directive(\"orange\", function() {\n  return\
    \ {\n    require: \"basket\",\n    link: function(scope, element, attrs, basketCtrl)\
    \ {\n      basketCtrl.addOrange();\n    }\n  };\n});\n```\n\nIf you hover with\
    \ the mouse over the rendered text console should print and the basket's content.\
    \ You can find the complete example on github³.\n\n# Discussion\n\nBasket is the\
    \ example directive which demonstrates an API using the controller function, whereas\
    \ the apple and orange directives augment define a dependency on the basket controller\
    \ with the require attribute. The link function then gets basketCtrl injected.\n\
    Note, how the basket directive is defined as an HTML element and the apple and\
    \ orange directives are defined as HTML attributes (the default for directives).\
    \ This demonstrates the typical use case of a reusable component augmented by\
    \ other directives.\nNow there might be other ways of passing data back and forth\
    \ between directives - we have seen the different semantics of using the (isolated)\
    \ context in directives in previous recipes - but what's especially great about\
    \ the controller is the clear API contract it lets you define.\n\n# Testing Directives\n\
    \n# Problem\n\nYou want to test your directive with a unit test. As an example\
    \ we use a tab component directive implementation which can be easily used in\
    \ your HTML document.\n\n> ³https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe"
