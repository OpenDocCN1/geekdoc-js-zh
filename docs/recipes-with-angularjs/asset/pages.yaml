    You can find the complete example using the angular-seed project on [github*](https://github.com/fdietz/recipes-with-angular-js/tree/master/chapter5).


    # Discussion


    The controller defines a dependency on the $scope and the $http module. An HTTP
    GET request to the data/posts.json endpoint is done with the get method. It returns
    a Promise** object with a success and error method. On success the JSON data is
    assigned to $scope.posts to make it available in the template.


    The $http service supports the HTTP verbs, get, head, post, put, delete and json.
    We are going to look into more examples in the following chapters.


    The $http service automatically adds certain HTTP headers as example X-Requested-With:
    XMLHttpRequest, but you can also set custom HTTP headers by yourself using the
    $http. defaults function:


    ```

    $http.defaults.headers.common["X-Custom-Header"] = "Angular.js";

    ```


    Until now the $http service does not really look particular. But, when you look
    into the documentation** you will find a lot of nice features for each request/response
    transformations, to atomically deserialize JSON for response caching, response
    interceptors to handle global error handling, authentication or other preprocessing
    tasks and of course promise support. We will look into the $q service, Angular''s
    promised service in a later chapter.


    # Consuming RESTful APIs


    # Problem


    You want to consume a RESTful data source.


    # Solution


    Use Angular''s high-level $resource service. Note, that the Angular ngResource
    module needs to be separately loaded since it is not included in the base.js file:


    > *https://github.com/fdietz/recipes-with-angular-js/tree/master/chapter5/recipe1


    > *http://docs.angular.org/api/ng#protect?char%u027srelaxq


    > *http://docs.angular.org/api/ng#protect?char%u027srelaxhttp'
