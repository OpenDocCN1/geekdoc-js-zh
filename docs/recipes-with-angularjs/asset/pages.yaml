  md: '# Using Forms


    ```

    <form name="form" ng-submit="submit">

    <label>Firstname</label>

    <input name="firstname" type="text" ng-model="user.firstname required />

    <label>LastName</label>

    <input type="text" ng-model="user.lastname required />

    <label>Age</label>

    <input type="text" ng-model="user.age" />

    <br>

    <button class="btn">Submit</button>

    </form>

    ```


    It is the same form but this time we defined the name attribute on the form and
    made the input required for the firstname.


    Let us add more debug output below the form:


    +   Firstname valid: {{form.firstname.$valid}}

    <br>

    Firstname validation error: {{form.firstname.$error}}

    <br>

    Form valid: {{form.valid}}

    <br>

    Form validation error: {{form.$error}}


    You can find the complete example on github.


    # Discussion


    Starting with a fresh form, you notice that Angular adds the css class ng-pristine
    and ng-valid to the form tag and each input tag. When editing the form the ng-pristine
    class will be removed from the changed input field and instead it will be replaced
    by the ng-dirty class. Very useful you can easily add new features to your app
    depending on these states.


    In addition to these two classes there are more to look into. The ng-valid class
    will be added when an input is valid, otherwise the css class ng-invalid is added.
    Note, that the form also gets either a valid or invalid class depending on the
    input fields. To demonstrate this I''ve added the required HTML5 attribute. Initially,
    the firstname and lastname input fields are empty and therefore have the ng-invalid
    css class, whereas the age field has the ng-valid class. Additionally, there''s
    ng-invalid-required class alongside the ng-valid for even more specificity.


    > https://github.com/fdietz/recipes-with-angular-js/examples/tree/master/chapter7/recipe2'
