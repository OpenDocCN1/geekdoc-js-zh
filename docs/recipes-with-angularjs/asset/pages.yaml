  md: "# # Using Forms\n\nEvery website eventually uses some kind of form for users\
    \ to enter data. Angular makes it particularly easy to implement client-side form\
    \ validations to give immediate feedback for an improved user experience.\n\n\
    # ## Implementing a Basic Form\n\n# ### Problem\n\nYou want to create a form to\
    \ enter user details and capture this information in an Angular.js scope.\n\n\
    # ### Solution\n\nUse the standard form tag and the ng-model Directive to implement\
    \ a basic form:\n\n```\nbody ng-app=\"MyApp\">\n  <div ng-controller=\"User\"\
    >\n    <form ng-submit=\"submit()\" class=\"form-horizontal novalidate\">\n  \
    \    <label>First</label>\n      <input type=\"text\" ng-model=\"user.firstname\"\
    />\n      <label>LastName</label>\n      <input type=\"text\" ng-model=\"user.lastname\"\
    />\n      <label>Age</label>\n      <input type=\"text\" ng-model=\"user.age\"\
    />\n      <button class=\"btn\">Submit</button>\n    </form>\n  </div>\n</body>\n\
    ```\n\nThe novalidate attribute disables the HTML5 validations, which are client-side\
    \ validations supports by modern browsers. In our example we only want the Angular.js\
    \ validations running to have complete control over look and feel.\n\nThe controller\
    \ binds the form to your user model and implements the submit() function:"
  merge: -1
