  md: "# URLs, Routing and Partials\n\nThe $location service^56 in Angular.js parses\
    \ the current browser URL and makes it available to your application. Changes\
    \ in either the browser address bar or the $location service will be kept in sync.\n\
    \nDepending on the configuration the $location service behaves differently and\
    \ has different requirements for your application. We will first look into client-side\
    \ routing with hashbang URLs since it is the default mode and later into the new\
    \ HTML5 based routing.\n\n# Client-Side Routing with Hashbang URLs\n\n# Problem\n\
    \nYou want the browser address bar reflect your applications flow consistently.\n\
    \n# Solution\n\nUse the $routeProvider and $locationProvider services to define\
