  md: "# Binding a Text Input to an Expression\n\n# Problem\n\nYou want user input\
    \ to be used in another part of your HTML page.\n\n# Solution\n\nUse Angulars\
    \ ng-model directive to bind the text input to the expression.\n\n```\nEnter your\
    \ name: <input type=\"text\" ng-model=\"name\"></input>\n<p>Hello {{name}}!</p>\n\
    ```\n\nYou can find the complete example on github.\n\n# Discussion\n\nAssigning\
    \ \"name\" to the ng-model attribute and using the name variable in an expression\
    \ will keep\nboth in sync automatically. Typing in the text input will automatically\
    \ reflect these changes in the\nparagraph element.\n\nConsider how you would implement\
    \ this traditionally using jQuery:\n\n```\n<html>\n<head>\n  <script src=\"http://code.jquery.com/jquery.min.js\"\
    ></script>\n</head>\n<body>\n  Enter your name: <input type=\"text\"></input>\n\
    \  <p id=\"name\"></p>\n<script>\n  $(document).ready(function() {\n    $(\"input\"\
    ).keypress(function() {\n      $(\"name\").text($(this).val()));\n    });\n  });\n\
    </script>\n</body>\n</html>\n```"
  merge: -1
