  md: "# Directives\n\n```\n<my-widget2 text=\"Hello World\"></my-widget2>\napp.directive(\"\
    myWidget2\", function() {\n  return {\n    restrict: \"E\",\n    template: \"\
    <p>{{text}}</p>\",\n    scope: {\n      text: \"@text\"\n    }\n  };\n});\n```\n\
    \nThe scope definition using @text is binding the text model to the directive's\
    \ attribute. Note, that changes on the parent scope will change the local scope\
    \ text, but not the other way around.\n\nIf you want instead to have a bi-directional\
    \ binding between the parent scope and the local scope, you should use the equality\
    \ character:\n\n```\nscope: {\n  text: \"=text\"\n}\n```\n\nChanges to the local\
    \ scope will also change the parent scope.\nAnother possibility would be to pass\
    \ an expression as a function to the directive using the&\n\n```\n<my-widget-expr\
    \ fn=\"count = count + 1\"></my-widget-expr>\napp.directive(\"myWidgetExpr\",\
    \ function() {\n  var linkFunction = function(scope, element, attributes) {\n\
    \    scope.text = scope.fn({count: 5});\n  };\n  return {\n    restrict: \"E\"\
    ,\n    template: \"<p>{{text}}</p>\",\n    link: linkFunction,\n    scope: {\n\
    \      fn: \"&fn\"\n    }\n  };\n});\n```\n\nWe pass the attribute fn to the directive\
    \ and since the local scope defines fn accordingly we can call the function in\
    \ the linkFunction and pass the expression arguments as a hash."
