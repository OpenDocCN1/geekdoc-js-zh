  md: "# Backend Integration with Node Express\n\n```\nvar express = require('express');\n\
    api = require('./routes/api');\nvar app = module.exports = express();\napp.get('/api/contacts',\
    \ api.contacts);\napp.get('/api/contacts/id', api.contact);\napp.post('/api/contacts',\
    \ api.createContact);\napp.put('/api/contacts/id', api.updateContact);\napp.delete('/api/contacts/id',\
    \ api.destroyContact);\n```\n\nI like to keep routes in a separate file routes/api.js\
    \ and just reference them in app.js in order to keep it small. The API implementation\
    \ initializes them with Mongoose library and defines a schema for our Contact\
    \ model.\n\n```\nvar mongoose = require('mongoose');\nmongoose.connect('mongodb://localhost/contacts_database');\n\
    var contactsSchema = mongoose.Schema({\n  firstname: 'string', lastname: 'string',\
    \ age: 'number'\n});\nvar Contact = mongoose.model('Contact', contactsSchema);\n\
    ```\n\nWe can now use the Contact model to implement the API. Lets start with\
    \ the index action:\n\n```\nexports.contacts = function(req, res) {\n  Contact.find({},\
    \ function(err, obj) {\n    res.json(obj)\n  });\n};\n```\n\nSkipping the error\
    \ handling we retrieve all contacts with the find function provided by Mongoose\
    \ and render the result in the JSON format. The show action is pretty similar\
    \ except it uses findOne and the id from the URL parameter to retrieve a single\
    \ contact.\n\n> http://mongoosejs.com/"
