  md: "# Using Forms\n\n```\nvar app = angular.module(\"MyApp\", [\"ui\", \"ui.directives\"\
    ]);\napp.controller(\"User\", function($scope) {\n  $scope.blacklist = ['idiot','loser'];\n\
    \  \n  $scope.notBlackListed = function(value) {\n    return $scope.blacklist.indexOf(value)\
    \ === -1;\n  }\n});\n```\n\nYou can find the complete example on github⁴.\n\n\
    # Discussion\n\nFirst we need to explicitly list our module dependency to the\
    \ Angular UI directives module. Make sure you actually download the javascript\
    \ file and load it via script tag.\n\nOur blacklist contains the words we do not\
    \ want to accept as user input and the notBlackListed function checks if the user\
    \ input matches any of the words defined in the blacklist.\n\nThe ui-validate\
    \ directive is pretty powerful since it lets you define your custom validations\
    \ easily by just implementing the business logic in a controller function.\n\n\
