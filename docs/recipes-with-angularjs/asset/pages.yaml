  md: "# Backend Integration with Ruby on Rails\n\n```\nContacts :Application.routes.draw\
    \ do\nroot :to => \"layouts@index\"\nmatch \"*path\" => \"layouts@index\"\nend\n\
    ```\n\nIt uses Route Globbing** to match all URLs and defines a root URL. Both\
    \ will be handled by a layout controller with the sole purpose to render the initial\n\
    \n```\nclass LayoutsController < ApplicationController\ndef index\n  render \"\
    layouts/application\"\nend\n```\n\nThe actual template defines our ng-view directive\
    \ and resides in app/views/layouts/application.html - nothing here. So, lets ahead\
    \ to the Angular route definition in app.js.\n\n```\nvar app = angular.module(\"\
    Contacts\", [\"ngResource\\]);\napp.config(function($routeProvider, $locationProvider)\
    \ {\n  $locationProvider.html5Mode(true);\n  $routeProvider\n    .when(\"/contacts\"\
    ,\n      { templateUrl: \"{{asset_path('contacts/index.html')}}\",\n        controller:\
    \ ContactsIndexCtrl\n    })\n    .when(\"/contacts/new\",\n      { templateUrl:\
    \ \"{{asset_path('contacts/edit.html')}}\",\n        controller: ContactsEditCtrl\n\
    \    })\n    .when(\"/contacts/:id\",\n      { templateUrl: \"{{asset_path('contacts/show.html')}}\"\
    ,\n        controller: ContactsShowCtrl\n    })\n    .when(\"/contacts/:id/edit\"\
    ,\n      { templateUrl: \"{{asset_path('contacts/edit.html')}}\",\n        controller:\
    \ ContactsEditCtrl\n    })\n    .otherwise(redirectTo redirectTo: \"/contacts\"\
    \\));\n});\n```\n\nWe set the $locationProvider to use the HTML5 mode and define\
    \ our client-side routes for listing, showing, and creating new contacts.\nnYou\
    \ can find the complete example on github**.\n\n> *http://guides.rubyonrails.org/routing.html#route-globbing\n\
    *https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter9/recipe1"
