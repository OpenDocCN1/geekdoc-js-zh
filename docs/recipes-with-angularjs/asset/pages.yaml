    ></script>\n</head>\n<body> ng-app>\n  <input type='text' ng-model='amount' placeholder='Enter\
    \ amount'/>\n  <p>Default Currency: {{ amount | currency }}</p>\n  <p>Custom Currency:\
    \ {{ amount | currency: 'Euro à,¤' }}</p>\n</body>\n</html>\n```\n\nEnter an amount\
    \ and it will be displayed using Angular's default locale.\nYou can find the complete\
    \ example on github⁴.\n\n> ⁴https://github.com/fdiet/recipes-with-angular-js-examples/tree/master/chapter4/recipe"
