  md: "Using Forms 62\n\nSince we defined the name attribute on the form HTML element\
    \ we can now access Angular's form controller via scope variables. The debug output\
    \ we can check the validity and specific error for each named form input and the\
    \ form itself. Note, that this only works on the level of the form's name attributes\
    \ and not on the model scope. If you output the following expression {{user.firstname.$error}}\
    \ it will not work.\n\nAngular's form controller exposes $valid, $invalid, $error,\
    \ $pristine and $dirty variables.\n\nFor validation Angular provides built-in\
    \ directives including required,pattern,minlength,maxlen,min and max.\n\nLet us\
    \ use Angular's form integration to actually show validation errors in the recipe.\n\
    \n# Displaying Form Validation Errors\n\n# Problem\n\nYou want to show validation\
    \ errors to the user by marking the input field red and displaying an error message.\n\
    \n# Solution\n\nWe can use the ng-show directive to show an error message if a\
