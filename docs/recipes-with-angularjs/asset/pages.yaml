  md: "URLs, Routing and Partials\n\n```\n}\n));\n));\n```\n\nNext we define a login\
    \ form to enter the username, skipping the password for the sake of simplicity:\n\
    \n```\n<form ng-submit=\"login()\">\n  <label>Username</label>\n  <input type=\"\
    text\" ng-model=\"username\">\n  <button>Login</button>\n</form>\n```\n\nand lastly\
    \ the login controller which sets the logged in the login page and redirects to\
    \ the persons URL:\n\n```\napp.controller(\"LoginCtrl\", function($scope, $location,\
    \ $rootScope) {\n  $scope.login = function() {\n    $rootScope.loggedIn = $scope.username;\n\
    \    $location.path(\"/persons\");\n  };\n});\n```\n\nYou can find the complete\
    \ example on github65.\n\n# Discussion\n\nThis is of not fully fleshed login system,\
    \ please don't use it in any production system. But, it exemplifies how to generally\
    \ handle access to specific areas of your web app. When you open the app in your\
    \ browser you will be redirected to the login page in all cases. Only after you\
    \ entered a user can access the other areas.\n\nThe run method is defined in Module66\
    \ and is a good place for a cache listener since it runs only on initialization\
    \ after the injector is done loading all the modules. We check the loggedIn in\
    \ $rootScope and if it is not we redirect the user to the login page. Note, in\
    \ order to skip this behavior when already navigating to the login page, we have\
    \ to explicitly check the next templateUrl.\n\nThe login controller sets the $rootScope\
    \ to the username and redirects to /persons. Generally, I try to avoid the $rootScope\
    \ since it is basically a kind of global state but in our case it fits nicely\
    \ since there be a current user globally available.\n\n> 65https://github.com/fdietz/recipes-with-angular-js-examples/tree/chapter6/recipe6\n\
    \n> 66http://docs.angular.org/api/angular.Module"
