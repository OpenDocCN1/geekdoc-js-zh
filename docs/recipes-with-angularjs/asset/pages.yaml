    \ |\n  limitTo: itemsPerPage\">\n  <td>{{item.id}}</td>\n  <td>{{item.name}}</td>\n\
    \  <td>{{item.description}}</td>\n</tr>\n```\n\nThe offset filter uses the currentPage*itemsPerPage\
    \ to calculate the offset for the array slice operation. We use the built-in limitTo\
    \ to filter the array to the number of itemsPerPage. All this is done on the client\
    \ side with filters only.\n\nThe controller is responsible for supporting a nextPage\
    \ and prevPage action and the accompanying functions to check the disabled state\
