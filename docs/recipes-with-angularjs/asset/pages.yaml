  md: 'Generally I tend to not use $parent.name and instead always use objects to
    share model properties.

    If you use $parent.name the NestedCtrl not only requires certain model attributes
    but also a

    correct scope hierarchy to work with.


    > Tip: The Chrome plugin Batarang simplifies debugging the scope hierarchy by
    showing you a tree of nested scopes. It is awesome!


    # # Sharing Code Between Controllers using Services


    # # Problem


    You want to share business logic between controllers.


    # # Solution


    Use a Service to implement your business logic and use dependency injection to
    use this service in your controllers.

    The template shows access to a list of users from two controllers:


    ```

    1 <div ng-controller="MyCtrl">

    2   <ul ng-repeat="user in users">

    3     <li>{{user}}</li>

    4   </ul>

    5   <div class="nested" ng-controller="AnotherCtrl">

    6     First user: {{firstUser}}

    7   </div>

    8 </div>

    ```


