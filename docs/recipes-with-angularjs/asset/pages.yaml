    \n```\napp.factory(\"Contact\", function($resource) {\n  return $resource(\"/api/contacts/:id\"\
    , { id: \"_id\" },\n{\n    'create': { method: 'POST' },\n    'index': { method:\
    \ 'GET', isArray: true },\n    'show': { method: 'GET', isArray: false },\n  \
    \  'update': { method: 'PUT' },\n    'destroy': { method: 'DELETE' }\n  }\n});\n\
    });\n```\n\nWe can now fetch a list of contacts using Contact.index() and a single\
