  md: "# Consuming Externals Services\n\nAngular has built-level support for communication\
    \ with remote HTTP servers. The $http* service handles low-level AJAX requests\
    \ via the browser's XMLHttpRequest object or via JSONP. The $resource* service\
    \ lets you interact with RESTful data sources and provides high-level behaviors\
    \ that naturally map to RESTful resources.\n\n# Requesting JSON Data with AJAX\n\
    \n# Problem\n\nYou want to fetch JSON data via AJAX request and render it.\n\n\
    # Solution\n\nImplement a controller using the $http service to fetch the data\
    \ and store it in the scope.\n\n```\n<body ng-app=\"MyApp\">\n<div ng-controller=\"\
    PostsCtrl\">\n  <ul ng-repeat=\"post in posts\">\n    <li>{{post.title}}</li>\n\
    \  </ul>\n</div>\n</body>\n\nvar app = angular.module(\"MyApp\", []);\napp.controller(\"\
    PostsCtrl\", function($scope, $http) {\n  $http.get('data/posts.json',\n    success(function(data,\
    \ status, headers, config) {\n      $scope.posts = data;\n    }),\n    error(function(data,\
    \ status, headers, config) {\n      // log error\n    });\n});\n```\n\n> *http://docs.angular.org/api/ng/$http\n\
    *http://en.wikipedia.org/wiki/XMLHttpRequest\n*http://en.wikipedia.org/wiki/JSONP\n\
    *http://docs.angular.org/api/ngResource/'protect'char'0024/relaxhttp"
