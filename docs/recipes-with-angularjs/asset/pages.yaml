  md: '# Backend Integration with Ruby on Rails


    ```

    1 <div class="control-group" ng-class="errorClass(''age'')">

    2   <label class="control-label" for="age">Age</label>

    3   <div class="controls">

    4     <input ng-model="contact.age" type="text" name="age"

    5       placeholder="Age" required>

    6     <span class="help-block"

    7       ng-show="form.age.$invalid && form.age.$dirty">

    8       {{errorMessage(''age'')}}

    9     </span>

    10  </div>

    11 </div>

    ```


    The errorClass function adds the error CSS class if the form is invalid and dirty.
    This will render the input, and the help block with a red color.


    ```

    1 $scope.errorClass = function(name) {

    2   var s = $scope.form[name];

    3   return s.$invalid && s.$dirty ? "error" : "";

    4 };

    ```


    The errorMessage will print a more detailed error message and is defined in the
    same controller.


    ```

    1 $scope.errorMessage = function(name) {

    2   result = [];

    3   _each($scope.form[name].$error, function(key, value) {

    4     result.push(value);

    5   });

    6   return result.join(", ");

    7 };

    ```


    It iterates over each error message and creates a comma separated string out of
    it.

    You can find the complete example on github⁹.


    # Discussion


    Lastly, the errorMessage handling is of course pretty primitive. A user would
    expect a localized failure message instead of this technical presentation. The
    Rails Internationalization Guide¹⁰ describes how to translate error messages in
    Rails and might prove helpful to further use that in your client-side code.


    > ⁹https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter9/recipe1

    ¹⁰http://guides.rubyonrails.org/i18n.html#translations-for-active-record-models'
