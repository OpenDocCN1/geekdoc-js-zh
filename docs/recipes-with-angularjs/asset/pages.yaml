  md: "# Consuming Externals Services\n\nYou can find the complete example on github^52.\n\
    \n# Discussion\n\nThe all function combines multiple promises into a single promise\
    \ and solves our problem quite elegantly.\n\nLet's have a closer look at the then\
    \ method. It is rather contrived but should give you an idea on how to use then\
    \ sequentially call functions and pass data along. Since the all function returns\
    \ a promise again we can call on it. By returning the tmp variable it will be\
    \ passed along to the function as tmpResult argument.\n\nBefore finishing this\
    \ recipe we quite discuss an example where we have to create our own deferred\
    \ object:\n\n```\nfunction deferredTimer(success) {\n  var deferred = $.defer();\n\
    \n  $timeout(function() {\n    if (success) {\n      deferred.resolve({ message:\
    \ \"This is great!\" });\n    } else {\n      deferred.reject({ message: \"Really\
    \ bad\" });\n    }\n  }, 1000);\n\n  return deferred.promise;\n}\n```\n\nUsing\
    \ the defer method we create a deferred instance. As an example for an asynchronous\
    \ operation we use the $timeout service which will either resolve or reject our\
    \ operation depending on the boolean success parameter. The function will immediately\
    \ return the promise and therefore not render any result in our HTML template.\
    \ After 1 second the timer will execute and return our success or failure response.\n\
    \nThis deferredTimer can be triggered in our HTML template by wrapping it into\
    \ a function defined on the scope:"
