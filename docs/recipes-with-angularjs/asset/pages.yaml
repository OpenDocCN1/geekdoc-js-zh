  md: "```\ndescribe('MyCtrl', function(){\n  var scope, ctrl;\n\n  beforeEach(inject($injector,\
    \ $controller, $rootScope) {\n    scope = $rootScope.$new();\n    ctrl = $controller(MyCtrl,\
    \ { scope: scope });\n  });\n\n  it('should change value if name value is changed',\
    \ function() {\n    scope.name = 'Frederik';\n    scope.$digest();\n    expect(scope.greeting).toBe(\"\
    Greetings Frederik\");\n  });\n});\n```\n\nYou can find the complete example on\
    \ [github](20).\n\n# Discussion\n\nJasmine specs use describe and functions to\
    \ group specs and beforeEach and afterEach to setup and teardown code. The actual\
    \ expectation compares the greeting from the scope with our expectation Greetings\
    \ Frederik.\nThe scope and controller initialization is a bit more involved. We\
    \ use inject to initialize the scope and controller as closely as possible to\
    \ how our code would behave at runtime. We can't initialize the scope as an javascript\
    \ object {} since we would not be able to call $watch on it. Instead $rootScope.$new()\
    \ will do the trick. Note, that the $controller scope requires MyCtrl to be available\
    \ and uses an object notation to pass in dependencies.\nThe $digest call is required\
    \ in order to trigger a watch execution after we changed the scope. We need to\
    \ call $digest manually in specs whereas at runtime Angular will do this for us\
    \ automatically.\n\n> 20https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter2/recipe7"
