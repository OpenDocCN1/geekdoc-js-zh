  md: "```\n<body> ng-app=\"MyApp\">\n<div> my-widget=\"Hello World\"></div>\nn</body>\n\
    ```\n\n```\nvar app = angular.module(\"MyApp\", []);\n\napp.directive(\"Widget\"\
    , function() {\n  var linkFunction = function(scope, element, attributes) {\n\
    \    scope.text = attributes[\"myWidget\"];\n  });\n```\n\n```\nreturn {\n  restrict:\
    \ \"A\",\n  template: \"<p>{{text}}</p>\",\n  link: linkFunction,\n};\n});\n```\n\
    \nThis renders a paragraph with the text passed as the param.\nYou can find the\
    \ complete example on github².\n\n# Discussion\n\nThe link function has access\
    \ to the element and its attributes. It is therefore straight forward to set the\
    \ scope to the text passed as the attributes value and use in this template evaluation.\n\
    The scope context is important though. The text we changed might already be defined\
    \ in the parent scope and use in another place of your app. In order to isolate\
    \ the context and thereby using it only locally inside your directive we have\
    \ to return an additional scope attribute.\n\n```\nreturn {\n  restrict: \"A\"\
    ,\n  template: \"<p>{{text}}</p>\",\n  link: linkFunction,\n  scope: {}\n};\n\
    ```\n\nIn Angular this is an isolated scope. It does not prototypically inherit\
    \ from the parent scope and is especially useful when creating reusable components.\n\
    Lets look into another way of passing parameters to the directive, this time we\
    \ define an HTML element my-widget.\n\n> ²https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter3/recipe5"
  merge: -1
