  md: "# An Introduction to Angular.js\n\nOn document ready we bind the keypress event\
    \ in the text input and replace the text in the paragraph in the callback function.\
    \ Using jQuery you need to deal with document ready callbacks, element selection,\
    \ event binding and the context of this. Quite a lot of concepts to swallow and\
    \ lines of code to maintain!\n\n# Responding to Click Events using Controllers\n\
    \n# Problem\n\nYou want to hide an HTML element on button click.\n\n# Solution\n\
    \nUse the ng-hide directive in conjunction with a controller to change the visibility\
    \ status on button click.\n\n```\n<html>\n<head>\n<script src=\"js/angular.js\"\
    ></script>\n<script src=\"js/app.js\"></script>\n<link rel=\"stylesheet\" href=\"\
    css/bootstrap.css\">\n</head>\n<body ng-controller=\"MyCtrl\">\n<button ng-click=\"\
    toggle()\">Toggle</button>\n<p ng-show=\"visible\">Hello World!</p>\n</div>\n\
    </body>\n</html>\n```\n\nAnd the controller in js/app.js:\n\n```\nfunction MyCtrl($scope)\
    \ {\n  $scope.visible = true;\n\n  $scope.toggle = function() {\n    $scope.visible\
    \ = !$scope.visible;\n  }\n}\n```"
