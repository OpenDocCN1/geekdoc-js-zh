  md: "# Repeatedly Rendering Directive’s DOM Node Children\n\n# Problem\n\nYou want\
    \ to render an html snippet repeatedly using the directives child nodes as the\
    \ “stamp” content.\n\n# Solution\n\nImplement a ntimes function in your directive.\n\
    \n```\n<repeat-ntimes repeat=\"10\">\n  <h1>Header</h1>\n  <p>This is the paragraph.</p>\n\
    </repeat-ntimes>\n```\n\n```\nvar app = angular.module(\"MyApp\", []);\nnapp.directive(\"\
    repeatNtimes\", function() {\n  restrict: \"E\",\n  compile: function(tElement,\
    \ attrs) {\n    var content = tElement.child();\n    for (var i=1; i<attrs.repeat;\
    \ i++) {\n      tElement.append(content.cloned());\n    }\n  }\n});\n```\n\nThis\
    \ will render the header and paragraph 10 times.\n\nYou can find the complete\
    \ example on github².\n\n# Discussion\n\nThe directive repeat the child nodes\
    \ as configured in the repeat attribute. It works similarly to the ng-repeat³\
    \ directive. The implementation uses Angular elements methods to append the child\
    \ nodes in a loop.\n\n> https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter/3/recipe6\n\
    ³http://docs.angular.org/api/ng.directive:ngRepeat"
  merge: -1
  pgno: 31
