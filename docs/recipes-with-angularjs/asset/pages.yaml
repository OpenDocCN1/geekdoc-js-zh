    You can find the complete example on github^57.


    # Discussion


    Let''s give our a try and open the index.html. The otherwise defined route redirects
    us from index.html#!/persons. This is the default behavior in case other when
    conditions don''t apply.


    Take a closer look at the index.html#!/persons URL and note how the hashtag (#)
    separates the index.html from the dynamic client-side part /persons. By default
    Angular would use the (#) character but we configured it to use the hashbang,
    following Google''s Making AJAX applications crawlable^58.


    The /persons route loads the person_list.partial via HTTP Request (that is also
    the reason why it won''t work without a development server). and therefore defines
    a ng-controller directive inside the template. Let assume for now that the controller
    implementation defines $scope somewhere. Now for each person we render a link
    to show the details via !/persons/(person.id).


    The route definition for the person''s details uses a placeholder /persons/:id
    which resolves to a specific person''s details, for example /persons/1. The person_details.html
    partial and additionally a controller are defined for this URL. The controller
    will be scoped to the partial, which basically resembles our index.html template
    where we defined our own ng-controller directive to achieve the same effect.


    The person_details.html has a link to !/persons which leads back to the person_list.html
    page.


    Let us back to the ng-view directive. It is automatically bound to the router
    definition. Therefore you can use only a single ng-view on your page. For example,
    you cannot use nested ng-views to achieve user interaction patterns with a first-
    and second level navigation.


    And the last HTTP request for the details happens only once and is cached via
    $templateCache service.


    Finally, the hashbang routing is client-side and doesn''t require server-side
    configuration. Let us look into the HTML5 based approach next.


    # Using Regular URLs with the HTML5 History API


    # Problem


    You want looking URLs and can provide server-side support.


