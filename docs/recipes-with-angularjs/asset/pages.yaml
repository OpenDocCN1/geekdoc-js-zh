  md: "# Using Forms\n\n```\nvar app = angular.module(\"MyApp\", []);\napp.controller(\"\
    User\", function(scope) {\n  $scope.user = {};\n  $scope.wasSubmitted = false;\n\
    \n  $scope.submit = function() {\n    $scope.wasSubmitted = true;\n  }\n});\n\
    ```\n\nYou can find the complete example on github^67.\n\n# Discussion\n\nThe\
    \ initial idea when using forms would be to implement them the traditional way\
    \ by serializing the form data and submit it to the server. Instead we use ng-model\
    \ to bind the form to our model, something we have been doing a lot already in\
    \ previous recipes.\nThe submit button is reflected in our wasSubmitted variable,\
    \ but no submit to the server was actually done. The default behaviour in Angular.js\
    \ forms is to prevent the default action since we do not want to reload the whole\
    \ page. We want to handle the submission in an application specific way. In fact\
    \ there is more going on in the background and we are going to look into the behaviour\
    \ of the form or ng-form directive in the next recipe.\n\n# Validating a Form\
    \ Model Client-Side\n\n# Problem\n\nYou want to validate the form client-side\
    \ using HTML5 form attributes.\n\n# Solution\n\nAngular.js works in tandem with\
    \ HTML5 form attributes. Let us start with the same form but let us add some HTML5\
    \ attributes to make the input required:\n\n> ^67https://github.com/fdietz/recipes-with-angular-js-examples/tree/master/chapter7?recipe1"
