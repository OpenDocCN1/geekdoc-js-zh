    ```\n<style type=\"text/css\">\ninput.ng-invalid.ng-dirty {\n  background-color:\
    \ red;\n}\ninput.ng-valid.ng-dirty {\n  background-color: green;\n}\n</style>\n\
    ```\n\nAnd here is a small part of the form with an error message for the input\
    \ field:"
