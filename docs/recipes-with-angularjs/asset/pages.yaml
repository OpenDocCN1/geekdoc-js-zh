  md: "# Testing Filters\n\n# Problem\n\nYou want to test your new filter. Let us\
    \ start with an easy filter which renders a checkmark depending on a boolean value.\n\
    \n```\n<body ng-init=\"data = true\">\n  <p>{{ data | checkmark }}</p>\n  <p>{{\
    \ !data | checkmark }}</p>\n</body>\n\nvar app = angular.module(\"MyApp\", []);\n\
    \napp.filter('checkmark', function () {\n  return function(input) {\n    return\
    \ input ? '\\u2713' : '\\u2718';\n  };\n});\n\n```\n\n# Solution\n\nUse the angular-seed\
    \ project as a bootstrap.\n\n```\ndescribe('MyApp Tabs', function() {\n  beforeEach(module('MyApp'));\n\
    \n  describe('checkmark', function() {\n    it('should convert boolean values\
    \ to unicode checkmark or cross',\n      inject(function(checkmarkFilter) {\n\
    \        expect(checkmarkFilter(true)).toBe('\\u2713');\n        expect(checkmarkFilter(false)).toBe('\\\
    u2718');\n      });\n    ));\n  });\n});\n```\n\n# Discussion\n\nThe beforeEach\
    \ loads the module and the it methods inject the filter function for us. Note,\
    \ that it has to be called checkmarkFilter, otherwise Angular can't inject your\
    \ filter function correctly."
