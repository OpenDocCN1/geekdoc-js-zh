    You can find the complete example on github¹⁷.


    # Discussion


    The factory method creates a singleton UserService which returns two functions
    for retrieving all users and the first user only. The controllers get the UserService
    injected by adding it to the controller function as params.


    Using dependency injection is quite nice for testing your controllers, since you
    can inject a UserService stub easily. The only downside is that you can''t minify
    the code from without breaking it, since the injection mechanism relies on the
    exact String representation of UserService. It is therefore recommended to define
    dependencies using inline annotations, which keeps working even when minified:


