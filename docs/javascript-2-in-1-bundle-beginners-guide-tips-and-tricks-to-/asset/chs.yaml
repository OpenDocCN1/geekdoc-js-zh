  \n## 第 3 章：设计和构建你自己的 JavaScript 库的技巧与窍\n\n你说 JavaScript 库？\n\n不，它不包含书籍。然而，它包含了 Web\
  \ 设计师、开发者和程序员可以在项目中使用的封装代码，可以节省时间和精力。换句话说，当你想要应用相同的代码包在不同的网站和程序上实现相同的效果时，你不需要重复发明轮子。\n\
  \n### 什么是 JavaScript 库？\n\n以下是 JavaScript 库的几个独特特征：\n\n- 它在一个文件夹中有一个或多个文件\n- 当你使用它实现项目时，它的代码必须单独维护并保持原样\n\
  - 它应该允许用户设置特定项目的行为或配置\n\n在本章中，我们将讨论为什么你应该构建 JavaScript 库，以及如何以最简单的方式构建它们。\n\n###\
  \ 为什么要构建自己的 JavaScript 库？\n\n首先，这对程序员和 Web 开发者来说都非常方便，特别是当你编写和开发大量的程序、网站和 Web 应用时。拥有带有现有代码的库会让你的工作更容易并节省时间，因为你不需要不断从硬盘中某个模糊的文件夹里寻找旧项目。你只需要从库中提取它即可。\n\
  \n本质，任何让你的工作更轻松且可以重复的代码都是添加到库中的绝佳组件。一个很好的例子是 `jQuery`。`jQuery` 的 API 是一个更简单的 DOM\
  \ API。在跨浏览器 DOM 操作仍然困难的，`jQuery` 是必不可少的。\n\n而且如果一个开源项目变得越来越流行，更多的开发者使用它，最终将鼓励更多开发者加入并通过贡献代码和提交问题来协助这项工作，使其变得更容易操作。这种贡献将造福库以及所有依赖它的其他实验。\n\
  \n流行的开源项目也可以为开发者带来绝佳的机会。科技公司或任何机构可能会对开发者的工作质量印象深刻，并向他们提供工作机会。这可能意味着一家公司将提供一名开发者来合作项目，或者让他们将项目集成到自己的应用程序中。\n\
  \n\n\n\n但对于大多数开发者或编码人员来说，拥有自己的库是一种爱好；这让他们能够编写多个代码、帮助他人并为这一过程做出贡献。\n\n## 你的目标与工作范围\n\
  \n在开始编写代码之前，你需要明确你开发这个库的目标是什么。这可以帮助你专注于你所遇到的问题，以及如何用你的库来解决它们。\n\n你的首要目标也是让你的库易于使用。从本质上说，`API`\
  \ 越简单，任何人就越容易使用你的库。\n\n所以问问自己——你的库解决了什么问题，你又如何解决它？你是打算利用别人库中的代码，还是将亲手编写一切？\n\n在第\
  \ 1 章中，我们讨论了如何创建路线图。你库的路线图将成为你在进行任何其他代码开发时使用的技巧之一。\n\n### 你的库的路线图：\n\n-   列出你希望库中具备的功能\n\
  -   使这些功能保持最少且实用\n-   为每个功能创建里程碑\n\n你通过路线图所做的是为每个函数设定目标，本质上是将你的项目拆分为易于管理的规模，使其更容易完成，并让创建过程变得更加愉快。它还能让你保持理智和专注。\n\
  \n## 你的库 API 设计\n\n在创建库时，将自己想象成终端用户。通过把自己置于用户的位置，朝着以用户为中心的设计和开发工作。这将使得任何访问该库的人都能使用得更加方便。\n\
  \n### 测试你的 API\n\n测试 `API` 质量最好的方法是将其用于你的项目。你可以尝试将应用程序代码替换为你的库，看看它给结果是否涵盖了你想要的所有功能。尽可能保持最核心的基础，同时也为灵活性留出空间以更改和修订任何可能略有偏差的内容。\n\
  \n以下是实现代码或 User-Agent 字符串库的示例：\n\n代码：\n\n```javascript\n// 从空的 UserAgent string\
  \ 开始\n\nvar userAgent = new UserAgent;\n\n// 创建并添加第一个产品：EvilCorpBrowser/1.2 (X11;\
  \ Linux; en-us)\n\nvar application = new UserAgent.Product('EvilCorpBrowser', '1.2');\n\
  \napplication.setComment('X11', 'Linux', 'en-us');\n\nuserAgent.addProduct(application);\n\
  \n// 创建并添加第二个产品：Blink/20420101\n\nvar engine = new UserAgent.Product('Blink', '20420101');\n\
  \nuserAgent.addProduct(engine);\n\n// EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101\n\
  \nuserAgent.toString();\n\n// 对 engine 产品进行更多更改\n\nengine.setComment('Hello World');\n\
  \n// EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101 (Hello World)\n\nuserAgent.toString();\n\
  ```\n\n取决于你库的复杂程度，你还需要考虑结构化。实现此点的一种方法是利用设计模式来结构化你的库，并克服在此过程中可能遇到的任何技术问题。\n\n结构化还可以减少在你的库添加新功能时，重新对齐大部分部分的风险。\n\
  \n### 灵活性与自定义\n\n市面上大多数 JavaScript 库酷酷的一点在于其灵活性。然而，许多开发者在决定哪些可以自定义哪些不能自定义时会面临问题。其中之一就是\
  \ `chart.js` 和 `D3.js`。\n\n这两个都是数据可视化的优秀库。如果你需要对图形有更多的控制权，那么 `D3.js` 就是你想要的。如果你想要某种易于创建且提供不同类型内置图表的东西，那么\
  \ `Chart.js` 是你的选择。\n\n有三种方法可以让你用户对你的库拥有控制权：\n\n1.  配置\n2.  暴露公共方法\n3.  回调函数与事件\n\
  \n配置一个库通常是在项目初始化阶段完成的，但某些库也允许你在运行时期间设置。这些配置通常仅限于简单的问题，因为更改这些设置只会更新这些值以供以后使用。\n\n\
  代码：\n\n```javascript\n// 在初始化时配置\n\nvar userAgent = new UserAgent({\n\n  commentSeparator:\
  \ ';'\n});\n\n// 使用公共方法进行运行时配置\n\nuserAgent.setOption('commentSeparator', '-');\n\
  \n// 使用公共属性进行运行时配置\n\nuserAgent.commentSeparator = '-';\n```\n\n某些方法被刻意暴露，以便与实例交互（getter），例如从实例中检索数据或将数据放入实例（setter），以及执行某些操作。\n\
  \n代码：\n\n```javascript\nvar userAgent = new UserAgent;\n\n// 用于从所有产品中检索注释的 getter\n\
  \nuserAgent.getComments();\n\n// 打乱所有产品顺序的 action\n\nuserAgent.shuffleProducts();\n\
  ```\n\n回调函数有时也会通过公共方法接受并传递，它通常用于在异步任务后运行用户代码。\n\n```javascript\nvar userAgent =\
  \ new UserAgent;\n\nuserAgent.doAsyncThing(function asyncThingDone() {\n\n  // 在异步任务完成后运行代码\n\
  });\n```\n\n事件在 JavaScript 库中具有巨大的潜力。与回调函数略相似，它们有一个微小的区别，添加事件处理器不会触发动作。事件还用于指示某些事件，并可以向用户提供额外信息，同时返回一个供库对应的特定值。\n\
  \n代码：\n\n```javascript\nvar userAgent = new UserAgent;\n\n// 在添加时验证产品\n\nuserAgent.on('product.add',\
  \ function onAdd(product) {\n  var shouldProduct = product.toString().length < 5;\n\
  \  // 告诉库添加\n  return shouldProduct;\n});\n```\n\n你也可以允许用户扩展你的库。为了让扩展遵循某些约定，你需要编写文档。你需要提供公共方法或属性，例如\
  \ Angular 模块。\n\n代码：\n\n```javascript\n(angular.module('myModule')) && jQuery.fn.myPlugin\n\
  ```\n\n你也可以什么都不做，让用户通过其命名空间访问你的库。\n\n代码：\n\n```javascript\n// AngryUserAgent 模块\n\
  // 拥有 UserAgent\n(function AngryUserAgent(UserAgent) {\n  // 创建新方法 .toString()\n\
  \  UserAgent.prototype.toString = function() {\n    return this.toString().toUpperCase();\n\
  \  };\n})(UserAgent);\n\n// 应用代码\nvar userAgent = new UserAgent;\n\n// ...\n\n//\
  \ EVILCORPBROWSER/1.2 (X11; Linux; en-us) BLINK/20420101\n\nuserAgent.toString();\n\
  ```\n\n同样，这允许你覆盖方法。\n\n代码：\n\n```javascript\n// AngryUserAgent 模块\n(function AngryUserAgent(UserAgent)\
  \ {\n  // 存储旧的 .toString() 方法备后使用\n  var _toString = UserAgent.prototype.toString;\n\
  \n  // 覆盖 .toString()\n  UserAgent.prototype.toString = function() {\n    return\
  \ _toString.call(this).toUpperCase();\n  };\n})(UserAgent);\n\nvar userAgent = new\
  \ UserAgent;\n\n// ...\n\n// EVILCORPBROWSER/1.2 (X11; Linux; en-us) BLINK/20420101\n\
  \nuserAgent.toString();\n```\n\n在这种情况下，让用户访问库的命名空间也意味着你对插件和扩展的定义控制力较小。\n\n为了允许扩展遵循某些约定，你需要编写文档。\n\
  \n## 测试\n\n对于测试驱动开发，大纲是至关重要的。换句话说，这是你以测试的形式写下功能和标准的时刻，甚至在编写实际库之前。\n\n如果你的测试显示某个功能的行为符合预期，并且你在将其写入库中之前就写下了它，那么这种策略被称为行为驱动开发。\n\
  \n如果你的测试涵盖了库的每一个方面，那么只要你的代码通过了所有这些测试，你就可以安全地说你的库运行良好。\n\n你还可以使用的其他测试框架有：\n\n[使用\
  \ Mocha 和 Chai 测试你的 JavaScript](http://www.sitepoint.com/unit-test-javascript-mocha-chai/)\
  \ 由 Jani Hartikainen 编写，其中你可以在 Mocha 中编写单元测试。\n\n\n\n\n\n[使用 Jasmine, Travis 和 Karma\
  \ 进行 JavaScript 测试](http://www.sitepoint.com/testing-javascript-jasmine-travis-karma/)\
  \ 由 Tim Evko 编写，向你展示了如何与名为 `Jasmine` 的另一个框架一致地设置测试流水线。\n\n下面是 Tim Severien 提供的另一个你可以尝试的大纲。他为他的库使用了\
  \ `Jasmine` 测试，它看起来像这样。\n\n代码：\n\n```javascript\ndescribe('Basic usage', function\
  \ () {\n\n  it('should generate a single product', function () {\n    // Create\
  \ a single product\n    var product = new UserAgent.Product('EvilCorpBrowser', '1.2');\n\
  \    product.setComment('X11', 'Linux', 'en-us');\n    expect(product.toString())\n\
  \      .toBe('EvilCorpBrowser/1.2 (X11; Linux; en-us)');\n  });\n\n  it('should\
  \ combine several products', function () {\n    var userAgent = new UserAgent;\n\
  \    // Create and add first product\n    var application = new UserAgent.Product('EvilCorpBrowser',\
  \ '1.2');\n    application.setComment('X11', 'Linux', 'en-us');\n    userAgent.addProduct(application);\n\
  \    // Create and add second product\n    var engine = new UserAgent.Product('Blink',\
  \ '20420101');\n    userAgent.addProduct(engine);\n    expect(userAgent.toString())\n\
  \      .toBe('EvilCorpBrowser/1.2 (X11; Linux; en-us) Blink/20420101');\n  });\n\
  \n  it('should update products correctly', function () {\n    var userAgent = new\
  \ UserAgent;\n    // Create and add first product\n    var application = new UserAgent.Product('EvilCorpBrowser',\
  \ '1.2');\n    application.setComment('X11', 'Linux', 'en-us');\n    userAgent.addProduct(application);\n\
  \    // Update first product\n    application.setComment('X11', 'Linux', 'nl-nl');\n\
  \    expect(userAgent.toString())\n      .toBe('EvilCorpBrowser/1.2 (X11; Linux;\
  \ nl-nl)');\n  });\n});\n```\n\n一旦你完成了测试并且对你第一个库版本的 API 设计完全满意，你就可以开始考虑网站的架构以及你的库具体将如何被使用。\n\
  \n### 模块加载器兼容性\n\n并不是很多开发者使用模块加载器，这完全取决于你。然而，你需要意识到，某些使用你库的开发者可能会选择模块加载器，因此你需要让你的库兼容此功能。\n\
  \n你可以选择一些流行的模块加载器，如 `AMD`、`RequireJS` 和 `CommonJS`。如果你在这些功能之间做出选择很困难，你也可以尝试`通用模块定义`\
  \ (`UMD`），它旨在支持多种类型的模块加载器。\n\n为了让你的库兼容 `UMD`，你也可以找到一些变体，例如 `UMD` GitHub 仓库。通过使用这些模板之一开始创建你的库。另一个技巧是，如果你选择使用\
  \ `ES2015` 的 `import/export` 语法，可以使用 `Babel` 编译为 `ES5` 并结合 `Babel` 的 `UMD` 插件。这样，你可以在项目中使用\
  \ `ES2015`，同时生成一个可以被使用各种模块的开发者使用的库。\n\n### 文档\n\n你需要从基础信息开始编写文档，例如你的项目名称以及关于其内容的简短描述。这将帮助他人理解你的库是做什么的，以及使用你的库对他们来说是否是一个不错的选择。你还可以包含更多关于范围和目标等方面的信息，以便用户获得更充分的信息。你还可以包含路线图，让用户知道他们对你的库开发未来可以期待什么，以及他们如何也能对此做出贡献。\n\
  \n### API、教程和示例\n\nAPI 文档也是文档不可或缺的一部分，因为它会告诉用户具体如何使用你的库。其他很好的补充内容是示例以及教程。这可能花费一些时间，因此你可以在库开发过程中进行这些工作。\n\
  \n### 元任务 (Meta-tasks)\n\n用户还会想要对你的库进行更改，这通常是以贡献的形式存在的，但某些人可能只想为私有用途创建一个自定义构建。对于这些用户，你可以包含关于元任务的文档，其中包含构建库、运行测试、生成和转换或下载数据的命令列表。\n\
  \n### 贡献\n\n贡献是非常棒的，特别是当你开源你的库时。你可以添加的另一个文档是，引导贡献者解释向库提交贡献的步骤，以及在提交贡献之前他们应该填写哪些标准。这将使你的评审工作变得更容易。\n\
  \n### 许可证 (License)\n\n许可证也是重要的。包含许可证可以让大家知道哪些内容受版权保护。将你选择的许可证保存为根目录下的 `LICENSE`\
  \ 文件。\n\n### 为 Git 添加版本\n\n版本控制对于一个良好的库是必要的。目前的版本标准是 [SemVer](https://semver.org/)，它包含主版本、次要版本和补丁版本。要创建一个标签，打开终端并执行：\n\
  \n```bash\ngit tag -a [version] -m [message]\n```\n\n示例：\n\n```bash\ngit tag -a\
  \ v1.0.0 -m \"First release\"\n```\n\n### 发布到仓库\n\n大多数编程语言都带有包管理器，或者至少有第三方包管理器。例如，PHP\
  \ 的管理器是 [Composer](https://www.sitepoint.com/mastering-composer-tips/)，Ruby on Rails\
  \ 是 [Gems](https://rubygems.org/)。默认情况下，你的 npm 包将公开。但你也可以选择发布：\n\n- [私有包](https://www.npmjs.com/npm/private-packages)\n\
  - [设置私有注册表](https://docs.npmjs.com/misc/registry#can-i-run-my-private-registry)\n\
  - [完全避免将包发布到官方注册表](https://docs.npmjs.com/misc/registry#i-dont-want-my-package-published-in-official-registry)\n\
  \n然而，如果你决定发布你的包，你需要 `package.json` 文件。你可以手动执行，也可以使用交互式向导。开始向导请输入：\n\n```bash\nnpm\
  \ init\n```\n\n`version` 属性应与你的 git 标签匹配。包含 `README.md` 文件。就像 GitHub 一样，npm 使用它作为展示包的页面。\n\
  \n完成后，通过输入以下发布你的包：\n\n```bash\nnpm publish\n```\n\n就这样！你成功发布了 npm 包。\n\n### Bower\n\
  \n另一个名为 `Bower` 的实用包管理器几年前出现了。这是一个为 Web 设计的包管理器。在这里，你可以找到所有的前端断。唯一的是，如果你的库设置为为了兼容浏览器，那么使用\
  \ `Bower` 发布你的包将让你获益。npm 包主要用于 JavaScript，许多前端包仍使用 npm，但 `Bower` 仍然非常流行，所以也去使用 `Bower`\
  \ 发布吧。\n\n要生成 `bower.json` 文件，输入：\n\n```bash\nbower init\n```\n\n和 `npm init` 一样，指令是显而易懂的。最后，发布你的包：\n\
  \n```bash\nbower register [package-name] [repo-url]\n```\n\n现在你的库可以供大家在他们的 Node\
  \ 项目或 Web 上使用了！\n\n### 总结\n\n记住，你的代码开发就是库。确保你的库解决了问题、方便易用，最重要的是稳定。这将确保你和许多其他使用它的开发者都感到满意。\n\
  \n\n\n\n[content]\n上述解释的任务可以很容易自动化，例如运行测试和创建标签、更新版本以及发布你的包。\n\n## 第 4 章：JavaScript\
  \ 技巧与窍门\n\n## 保存与记忆\n\n在本章中，我们将探讨一些与提升 JavaScript 技能和增强代码编写相关的简短实用技巧。\n\n| 使用 ===\
  \ 代替 == | `==`（或 `!=`）运算符在需要时会执行自动类型转换。`===`（或 `!==`）运算符则不会执行任何转换。它的作用是比较值和类型，这被认为比\
  \ `==` 更快 ([jsPref](http://jsperf.com/strictcompare))。[10] <```\n[10] == 10 // is\
  \ true\n[10] === 10     // is false\n'10' == 10 // is true\n'10' === 10     // is\
  \ false\n[] == 0 // is true\n[] === 0      // is false\n'' == false   // is true\
  \ but true == \"a\" is false\n'' === false // is false\n``` |\n| charAt() 简写 | 要实现这一点，你可以利用\
  \ `eval()` 函数，但这种括号符号简写技术比求值写法要简单得多。写法：<```\n\"myString\".charAt(0);\nShorthand:\"\
  myString\"[0]; // Returns 'm'\n``` | |\n| 字符串转换为数字 | 执行此操作最快且简单 ([jsPerf](https://jsperf.com/number-vs-parseint-vs-plus/29))\
  \ 方法是使用 `+`（加号）运算符。 <```\nvar one = '1';\nvar numberOne = +one;  // Number 1\n```\n\
  你也可以使用 `-`（减号）运算符，它会将值类型转换为数字，但也会进行取反。\n```\nvar one = '1';\nvar negativeNumberOne\
  \ = -one;  // Number -1\n``` | |\n| 真值/假值转换为布尔值 | 你可以使用 `!!` 将真值或假值转换为布尔值 `true`\n\
  <```\n!!\"\"  // false\n!!0  // false\n!!null  // false\n!!undefined  // false\n\
  !!NaN  // false\n!!\"hello\"  // true\n!!1  // true\n!!{}  // true\n!![]  // true\n\
  ``` | |\n| 使用 JSON.Stringify | 假设有一个带有属性“prop1”、“prop2”、“prop3”的对象。可以向 `JSON.stringify`\
  \ 传递额外的参数，以选择性地将对象的属性写入字符串，例如： <```\nvar obj = { 'prop1': 'value1', 'prop2': 'value2',\
  \ 'prop3': 'value3'};\nvar selectedProperties = ['prop1', 'prop2'];\nvar str = JSON.stringify(obj,\
  \ selectedProperties);\n// str {\"prop1\":\"value1\",\"prop2\":\"value2\"}\n```\n\
  `str` 将仅包含所选属性的信息。除了数组，我们也可以传递一个函数。\n<```\nfunction selectedProperties(key, val)\
  \ { //第一个 val 将是整个对象，如果 key 为空字符串\n  (!key) { return val; } if  (key === 'prop1'\
  \ || key === 'prop2') { return val; } return;}\n```\n最后一个可选参数用于修改将对象写入字符串的方式。\n\
  <```\nvar str = JSON.stringify(obj, selectedProperties, '\\t\\t');\n/* str 输出在每行都有双制表符。\n\
  \      \"prop1\": \"value1\",\n      \"prop2\": \"value2\"}*/\n``` | |\n| 数组和写入单个元素的单一方法\
  \ | 与编写单独的方法来存储数组和单个元素参数，你可以编写函数使它们能够同时处理两者。你只需要先将所有内容合并到一个数组中。`Array.concat` 将接受数组或单个元素。\n\
  <```\nfunction printUpperCase(words) {\n  var elements = [].concat(words || []);\
  \ for (var i = 0; i < elements.length; i++) { console.log(elements[i].toUpperCase());\
  \ }}\n```\n`printUpperCase` 现在准备好接受单个节点或节点数组作为参数。它还避免了未传递参数时可能抛出的 `TypeError`。\n\
  <```\nprintUpperCase(\"cactus\");// => CACTUS\nprintUpperCase([\"cactus\", \"bear\"\
  , \"potato\"]);// => CACTUS\n// BEAR\n// POTATO\n``` | |\n| 测量 JavaScript 代码块的性能\
  \ | 为了快速测量 JavaScript 代码块的性能，我们可以使用 `console` 函数，如 `[console.time(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimabel)`\
  \ 和 `[console.timeEnd(label)](https://developer.chrome.com/devtools/docs/console-api#consoletimeendlabel)`\n\
  <```\nconsole.time(\"Array initialize\");\nvar arr = new Array(100), len = arr.length,\
  \ i;\nfor (i = 0; i < len; i++) { arr[i] = new Object();};\nconsole.timeEnd(\"Array\
  \ initialize\");  // Outputs: Array initialize: 0.711ms\n``` | |\n| 变量提升 | 提升将帮助你管理函数作用域。变量声明和函数会被提升到顶部，而变量定义不会。<```\n\
  function doTheThing() { // ReferenceError: notDeclared is not defined\nconsole.log(notDeclared);\
  \ // Outputs: undefined\nconsole.log(definedLater); var definedLater; definedLater\
  \ = {};\n``` | |\n[/content]\n\n[content]\n## 第 5 章：需要掌握的 JavaScript 技能\n\n无论你是否喜欢，作为程序员或应用程序开发者，你都需要学习\
  \ JavaScript。\n\n在本章中，我们将探讨一些与提升 JavaScript 技能和增强代码编写相关的简短实用技巧。\n\n## React & Redux\n\
  \n2015 年，当更多程序员开始抱怨 AngularJS 时，React 赢得了关注。Angular 2 将无法与 Angular 1 运行的消息让 Angular\
  \ 社区变得更加糟糕。React 的出现在 2016 年填补了这一空白。\n\n![github star growth](img/00010.jpeg)\n\n\
  基于存档的估计。也许更具指示意义的是 `react`、`angular` 和 `Angular2` 包的 npm 下载量：\n\n![angularjs vs\
  \ react](http://www.npmtrends.com/react-vs-angular)\n\n在过去的一年里，React 在 JavaScript\
  \ 社区中获得的关注比 AngularJS 多。因此，如果你查看上面的图表，可能在好奇 8 月发生了什么？它显示 React 的 npm 下载量大幅增加，它也显示了\
  \ React 的 GitHub Star 何时追上 AngularJS。\n\n\n\nReact 和 Redux 绝对是 2016 年最热门的趋势，而且在前端“框架”\
  \ JavaScript 领域，它们在 2017 年似乎不会消退。Netflix、Yahoo! 和 Dropbox 都将 React 纳入了它们的技术库，这为它增添了信心。尽管如此，Facebook\
  \ 的 Relay 看起来也是 2017 年的一个很有竞争力的对手。\n\n## 值得关注的其他框架\n\n其他框架可能会加入这一领域，虽然它们不可同日而论，但这里是对其他现有框架的概述。再次强调，技术领域的任何事情都可能发生变化。今年效果可能不那么好的东西，明年可能就会成为顶尖水平。\n\
  \n话不多说，这里是一些值得关注的其它框架。\n\n### Angular2\n\n许多非技术公司将考虑使用 `Angular 2`，特别是那些使用微软 `.NET`\
  \ 框架的企业。`Angular 2` 是通过谷歌和微软合作开发的，旨在让 JavaScript 成为一种更易于管理的语言。\n\n微软本身在去年积极推推 `.NET`，因为它开源了许多元素，并努力让微软工具对开发者更易获取。在重写之后，团队希望修复\
  \ `Angular 1` 应用中出现的任何升级问题，到目前为止性能一直非常出色。`Angular2` 的开发是为了支持 Web 组件，根据谷歌的说法，它是 Web\
  \ 开发的未来。然而，`AngularJS` 社区对 `Angular` 方向持有不同意见——尽管 `Angular` 团队投入了大量努力帮助开发者从 `Angular\
  \ 1` 顺利过渡到 `Angular 2`。\n\n这次重写也让 `React` 得以发展和成熟，其社区每天都在扩大。因此，程序员们怀疑 `Angular 2`\
  \ 是否会像 `Angular 1` 那样成功。然而，如上述所示，技术世界瞬息万变，`Angular 2` 可能在 2017 年有增长空间。`Angular2`\
  \ 仍然被认为是 `React` 应用的替代方案。\n\n### Meteor\n\n另一个值得关注的未来趋势是 `Meteor`，它一直拥有稳定的下载量和 GitHub\
  \ Star。它与 `React` 和 `Angular` 集成良好，并具有许多实用的功能。作为一个轻量级的全栈 JavaScript 框架，开发者发现 `Meteor`\
  \ 框架用起来非常愉快。`Meteor` 一直被认为是一个非常扎实的入门框架，也非常适合原型开发。\n\n阻碍 `Meteor` 成为主流成功的是随着时间推移不断出现的隐藏复杂性，特别是在生产环境方面。尽管\
  \ `Meteor` 募集了大量资金，但它并没有像 `React` 和 `AngularJS` 那样拥有庞大工程师团队的领先科技企业支持。尽管 `AngularJS`\
  \ 有很多问题，但有谷歌的支持；相比之下，`Meteor` 被视为投资风险，因为它是一个兼顾后端和前端开发的框架。为了最大限度地利用部署便利性，`Meteor`\
  \ 还需要托管。\n\n目前让 `Meteor` 不太理想的另一个问题是，许多开发者并不喜欢 `MongoDB`，而 `Mongo` 正是 `Meteor` 的默认数据库。`Meteor`\
  \ 在 2017 年仍是一个不错的选择，因为更多开发者可能会等待更可靠的证据，证明 `Meteor` 可用于更大、更复杂的应用程序开发。不说说，`Meteor`\
  \ 在 2016 年甚至 2017 年未来可能仍保持小众化。大多数专业开发者将等待任何证明它可以用于开发大型、复杂应用的证据。\n\n### ES6 终于到来\n\
  \nJavaScript 开发者在 2016 年迈向 2017 年的工作之一，是确保他们所有的应用都符合 `ES2015` 标准。但就像许多技术应用和编程语言的其他复杂问题一样，我们面临着\
  \ `Babel` 与 `TypeScript` 问题。\n\n`Babel` 主要将 `ES6` 代码翻译为 `ES5`，而 `TypeScript` 实际上\
  \ JavaScript 的超集，为 JavaScript 添加了必要的但可选的静态类型，然后将所有内容编译为纯 JavaScript。`Babel` 和 `TypeScript`\
  \ 的创建目的完全不同，因此不可比拟。\n\n由 Facebook 开发的 `Babel` 支持 `Flow`，后者也为 JavaScript 添加了静态类型检查。使用\
  \ `Babel` 更有意义一点，因为你可以连续使用两者。`Babel` 也是第一个桥接 `ES5` 和 `ES6` 应用差异的工具。\n\n另一方面，`TypeScript`\
  \ 只支持 `ES6`，因此在进展性方面次于 `Babel`。查看 GitHub Star 发现，`Babel` 是最受欢迎的转编译器。`React` 开发者也倾向于使用\
  \ `Babel + Webpack` 组合。\n\n![`s3.amazonaws.com/codementor_content/2016-May/babel_vs_typescript.png`](img/00012.jpeg)\n\
  \n尽管有 Star 数，但 `TypeScript` 似乎更有可行性，有时甚至是首选，特别是当你寻找一种让你的 JavaScript 代码库更易管理的解决方案时。JavaScript\
  \ 一直以来以难读著称，由于其弱类型检查系统，调试更加困难。因此在支持方面，`TypeScript` 拥有比 `Flow` 更多的追者。\n\n![`s3.amazonaws.com/codementor_content/2016-May/so_staticjs.png`](img/00013.jpeg)\n\
  \n下面的图表显示了 Google Trends 图表中 `TypeScript` 兴趣的增长。\n\n![`s3.amazonaws.com/codementor_content/2016-May/es6.png`](img/00014.jpeg)\n\
  \n`TypeScript` 可能流行的另一个原因是由于 `Angular2`，但仅仅因为 JavaScript 应用受到更多关注，并不是 `TypeScript`\
  \ 流行的真正原因。\n\n虽然 `Redux` 让测试变得容易得多，但 `TypeScript` 让代码库的维护变得容易得多。此外，谷歌、Facebook 和微软正在合作为\
  \ JavaScript 添加静态类型，从而为 `ECMAScript` 铺平道路。\n\n与此同时，谷歌放弃了 `AtScript` 和 `AngularJS`\
  \ 转而采用 TypeScript。另一方面，Facebook 的 `Flow` 并没有像 `TypeScript` 那样的社区流行度。\n\n这表明静态类型\
  \ JavaScript 是一个活跃且增长的趋势，即使是 JavaScript 的不信者也会认可，而 `TypeScript` 是其中最可靠的解决方案。\n\n\
  ## 函数式编程正在成为主流\n\n许多函数式编程平台正在进入主流编程，但最近，“函数式编程模型”引起了大量关注，特别是随着复杂 Web 应用的兴。\n\n![`s3.amazonaws.com/codementor_content/2016-May/hn-fp.png`](img/00015.jpeg)\n\
  \nRxJS\n\n\n\n但对于那些仍然想坚持全栈函数式响应编程（这被认为是“真正”的 FRP）并且仍然想使用 JavaScript 的人来说，学习 `RxJS`\
  \ 是一项必须的技能。`RxJS` 是 JavaScript 的一个响应式扩展，可以用来替代 `Flux` 架构。对于简单和小型应用来说，这听起来可能过载了，但实际上，它为经过复杂流处理的\
  \ Web 应用程序构建了强大的基础。\n\nNetflix 使用 `RxJS`，而 `Angular2` 也依赖于 `RxJS`。`RxJS` 由微软开发，与\
  \ `TypeScript` 配合得非常完美，因此开发者可以预期 `RxJS` 将持续得到改进。\n\n然而，学习 `RxJS` 是一个完全不同的领域。它具有陡峭的学习曲线，让大多数开发者放弃在\
  \ JavaScript 中进行任何 FRP，转而选择其他与 JavaScript 兼容的函数编程语言。\n\n![`s3.amazonaws.com/codementor_content/2016-May/frp_gtrend.png`](img/00016.jpeg)\n\
  \n开发者选择代替 `RxJS` 的某些兼容编程语言是 `ClojureScript` 和 `Elm`。然而，所有程序的增长和流行程度与 `Redux+React`\
  \ 相比都显得黯然失色。\n\n![`s3.amazonaws.com/codementor_content/2016-May/frp_with_redux.png`](img/00017.jpeg)\n\
  \n事实是，看到函数编程如何完美地解决 Web 开发中的现代问题，人们必须同意函数编程范式及其等概念作为 JavaScript 开发者需要掌握和学习的必要技能一直存在。\n\
  \n## 桌面框架对决：Nw.js vs. Electron\n\n如今有很多需要从桌面和移动等各种平台同步数据。然而，许多服务最初都是以 Web 应用的形式出现，然后转换为桌面应用以增强用户体验。这样做是因为\
  \ Web 应用的开发速度更快且更容易更新。此外，用户还可以更快速地尝试 Web 应用，而无需安装任何其他东西。\n\n过去的开发者如果想使用 Web 技术为桌面应用创建前端\
  \ UI，只能受限于使用 `CEF`。这不是一个简单的过程，应用程序本身并不是真正的跨平台兼容。尽管如此，`Node.js` 让桌面框架的跨平台应用变得更加容易。使用\
  \ Web 技术进行桌面应用开发的趋势从 2014 年开始兴起。\n\n因此，让我们来看看这两个项目的 GitHub Star 历史：\n\n![nwjs vs\
  \ electron](img/00018.jpeg)\n\n尽管 `Nw.js` 早得多进入领域并被认为更老旧，但看起来 `Electron` 正在以爆炸性的速度增长，而\
  \ `nw.js` 则以单调的线性速度增长。\n\n![nw.js vs electron](img/00019.jpeg)\n\n虽然 `Electron`\
  \ 还很新，但它被 `Slack`、`Microsoft` (`Visual Studio Code`)、`WordPress` 和 `Sencha` 等多个成熟机构使用。凭借\
  \ `Electron` 的易用性，网络和社区增长非常快。这种流行趋势可能会持续到 2017 年，从而使 `Electron` 成为桌面和 Web 应用开发的框架框架。\n\
  \n## 移动应用框架对决：React Native vs. Ionic\n\n当 `React Native` 出世时，人们预测它将接管并利用 Web 技术引领移动开发的路线，因为它可以用于开发原生跨平台应用。那么\
  \ 2017 年是 `React Native` 的年吗？通过这张图表可能会产生一些预期：\n\n![react native vs ionic](img/00020.jpeg)\n\
  \n此时，`React Native` 尚未发布任何更新的软件，因为它仍处于 0.26 版本。它在 2017 年是否会成为主流，很大程度上取决于开发者处理需要一起重构整个代码库以及其他问题的应用开发变化的耐心。\n\
  \n因此，让我们来看看 `React Native` 对比 `Ionic` 的近似 `npm` 下载量：\n\n![react native vs ionic](img/00021.jpeg)\n\
  \n从图表中可以看出，`React Native` 有望超越 `ionic`，成为使用 Web 技术进行跨平台移动开发的首框架。\n\n在就业市场方面，`React\
  \ Native` 也比 `Ionic` 更有需求：\n\n![react native vs ionic](http://www.indeed.com/jobtrends/q-react-native-q-ionic.html)\n\
  \n快速搜索招聘信息显示，至少有 75 个招聘职位寻找具有 `ionic` 技能的开发者，而 65 个招聘职位正在寻找具有 `React` 技能的开发者。这表明人们对\
  \ `React Native` 的熟悉程度正在增加，这很可能对 2017 年之后的任何新兴开发者提供巨大的推动力。\n\n## Web API 的未来：GraphQL\
  \ vs REST\n\n在 `Facebook` 提到他们将开源 `GraphQL` 后，许多 JavaScript 开发者在 2016 年早期就加入了这一热潮，特别是当\
  \ `Facebook` 在开源项目方面变成了 JavaScript 界的“苹果公司”。\n\n![graphql](img/00023.jpeg)\n\n`GraphQL`\
  \ 旨在取代 `REST` API，但考虑到 `REST` API 的无处不在，这种情况不太可能发生：\n\n![rest vs graphql](img/00024.jpeg)\n\
  \n`GraphQL` 与 `REST` API 配合得很好，但它绝对不会像某些开发者认为的那样取代 `REST`。更重要的是，`GraphQL` 相对较新并与\
  \ `Facebook Relay` 关联，因此程序员和开发者在其他地方没有获取该技能的学习资源或最佳实践。尽管如此，2017 年对于 `GraphQL` 成为主流仍然太早了。\n\
  \n### JavaScript 趋势结论\n\n结论，JavaScript 社区的移动和变化非常快，跟上任何趋势并符合主流技术意味着更多的支持、相关性和资源。根据本章讨论的趋势，JavaScript\
  \ 开发者应该为自己配备 `Redux & React` 以及其他函数式编程语言，如 `TypeScript`。不仅如此，拥有 `React Native` 和\
  \ `Electron` 的经验无疑会为未来的程序员在求职中中提供更多推力和信誉。\n\n### 结语\n\n感谢读完《JavaScript：使用 JavaScript\
  \ 编程的技巧与窍门》。希望这本书对你有启发性，并能够为你提供实现目标所需的所有工具，无论你的目标是什么。\n\n下一步是使用你学到的编码技能并将其应用于你自己的项目中。学习需要时间，但你应该保持耐心，因为每当你学习新东西时，你都会犯错。\n\
  \n再次回顾书中的课程并反复阅读。在掌握之前，学习编写代码会令人困惑，因为你将学习到所有不同的条件和异常。\n\n最后，如果你觉得这本书在任何方面都有帮助，我们将非常感谢你在\
  \ Amazon 上的评价！\n"
