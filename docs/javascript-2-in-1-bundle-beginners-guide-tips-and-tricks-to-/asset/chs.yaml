- "# JavaScript：二合一合集：初学者指南 + JavaScript 编程技巧\n\n\n\n![](img/cover.jpeg)\n\n\n\n##\
  \ 关于本合集\n\n恭喜你下载《JavaScript: 2 Books in 1 - JavaScript 编程入门指南与编程技巧与方法》，并感谢你的支持。\n\
  \n你即将阅读的是两本关于如何学习 `JavaScript` 计算机编程的独立书籍。每本书都将讨论学习 `JavaScript` 的不同阶段，并按照合理的顺序排列，带你从初学者水平走向中级水平。\n\
  \n### 第 1 本\nJavaScript: 编程入门指南\n在这里，你将学习学习 `JavaScript` 的基础要点——获得初级知识所需的必要主题。\n\
  \n### 第 2 本\nJavaScript: 编程技巧与方法\n在这里，你将不断进步，学习学习 `JavaScript` 编程语言的中级实用技巧和方法——帮助你在精通\
  \ `JavaScript` 的道路上不断前进。\n\n再次感谢你拥有本书！让我们从 `JavaScript` 合集中的第一本书开始：\n\n\n\n\n##\
  \ 介绍\n\n恭喜你下载《JavaScript: 2 Books in 1 - JavaScript 编程入门指南与编程技巧与方法》，并感谢你的支持。你即将阅读的是两本关于如何学习\
  \ `JavaScript` 计算机编程的独立书籍。每本书都将讨论学习 `JavaScript` 的不同阶段，并按照合理的顺序排列，带你从初学者水平走向中级水平。\n\
  \n### 第 1 本\nJavaScript: 编程入门指南\n在这里，你将学习学习 `JavaScript` 的基础要点——获得初级知识所需的必要主题。\n\
  \n### 第 2 本\nJavaScript: 编程技巧与方法\n在这里，你将不断进步，学习学习 `JavaScript` 编程语言的中级实用技巧和方法——帮助你在精通\
  \ `JavaScript` 的道路上不断前进。\n\n再次感谢你拥有本书！让我们从 `JavaScript` 合集中的第一本书开始：\n\n## 第 1 章：JavaScript……它是什么？它将如何使受益？\n\
  \n`JavaScript` 是一种客户端脚本语言。这意味着该语言或代码被发送到用户的计算机并在那里执行。这与 `ASP.NET` 或 `PHP` 等服务器端技术形成对比，后者是在结果传递给用户计算机之前在\
  \ Web 服务器上运行代码。\n\n通过 `JavaScript`，你将与不同的网页进行交互，以便创建 Web 应用程序。Netscape Communications\
  \ 在 1995 年首次实现了 `JavaScript`。\n\n在构建网页时，你通常会在三种主流语言中遇到 `JavaScript`，另外两种是 `HTML`\
  \ 和 `CSS`。因此，虽然 `HTML` 处理页面的内容和结构，`CSS` 处理页面的呈现（如指定背景颜色），但 `JavaScript` 是页面交互和行为的编程语言。\n\
  \n例如，当你在“联系我们”页面的表单字段中输入错误的值会发生什么？让网页具有交互性并执行 `HTML` 和 `CSS` 无法实现的功能，让你发现了 `JavaScript`\
  \ 对网站的用性。\n\n但我必须指出，`JavaScript` 并不是作为一种通用的全能语言而设计的；它有局限性。例如，它无法访问计算机的文件系统，也无法与数据库通信。尽管如此，它在实现网页交互方面表现非常好。\n\
  \n`JavaScript` 很容易与 `Java` 混淆，因为它们的名字非常相似；但它们并不是一回事。不过的是，它们可以在客户端共同交互，例如你的网络浏览器，因为它们可以直接嵌入\
  \ Web 源码中。\n\n\n\n\n每当你查看 JavaScript 的支持时，你会惊讶地发现它几乎在任何地方都受到支持。在 `Firefox`、`Google\
  \ Chrome` 和 `Safari` 等浏览器中，如果你不确定你的浏览器是否是 JavaScript 授权的厂商，可以进入设置查看是否可以启用或禁用 JavaScript。如果可以，说明你的浏览器已获得\
  \ JavaScript 授权。\n\n## 优势\n\n学习 JavaScript 将对你有所益，它可以帮助你职业晋升或寻找不同的职业。如果你想进入 IT 领域甚至是网页设计，JavaScript\
  \ 是必不可少的。\n\n如果你已经在这些领域有了一份工作，你将能够获得职业晋升，因为你加深了对某些你有益知识的理解。\n\nJavaScript 不仅在你在\
  \ IT 或网页设计领域时很有用。JavaScript 可以应用于任何工作，如果你不确定它是否可以用于你的工作，请询问你的老板。表现出学习工作要求之外知识的积极性将给你的老板留下深刻印象并赢得青睐。\n\
  \n## 第 2 章：编写你的第一段 JavaScript 代码\n\n如上一章所述，帮助运行交互网站的 JavaScript 并不是孤立工作的，它与 HTML\
  \ 和 CSS 共同运行，构成了网页的三大核心语言。\n\n那么，让我们开始编写 JavaScript 。由于 JavaScript 将运行在网页中，我们首先需要一个编写\
  \ JavaScript 语言的网页。\n\n下面是一个简单的网页示例，作为我们的参考：\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n<title>这里是标题</title>\n</head>\n<body>\n<p>这是一个网页</p>\n</body>\n</html>\n\
  ```\n\n代码由基础的 HTML 和没有 CSS 组成，都是非常基础的内容。现在，如果你将代码复制并粘贴到记事本应用程序中，将其保存为 HTML 文件（例如\
  \ `first.html`），然后双击该文件（如果双击时浏览器没有打开文件，请手动打开浏览器并将文件拖入其窗口），你电脑上安装的 浏览器应该能够成功渲染代码并产生如下结果：\n\
  \n这是一个网页。\n\n就像我们使用起始和结束的 `p` 标签来包裹一个段落一样，对于 JavaScript，我们用 `script` 标签将其包裹。`<script>\
  \ </script>`\n\n为了向这个 HTML 文件示例添加第一段 JavaScript 代码，我们将使用一个名为 `alert` 的 JavaScript\
  \ 弹出框，它在运行网页时会产生一个弹出消息框并输出文本“Hello World”。\n\n```javascript\n<script>\nalert (\"\
  Hello World!\");\n</script>\n```\n\n注意，为了让弹出框出现，请确保你的浏览器隐私设置允许此操作。\n\n现在将所有内容整合，我们将\
  \ JavaScript 代码添加到 HTML 的其他部分：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>这里是标题</title>\n\
  </head>\n<body>\n<p>这是一个网页</p>\n<script>\nalert (\"Hello World!\");\n</script>\n\
  </body>\n</html>\n```\n\n保存文件并双击它在 浏览器中打开。如果这不起作用，打开浏览器并将文件直接拖到浏览器窗口；它将打开你正在创建的网页。然后你应该会看到\
  \ alert 消息框弹出，并显示文本“Hello World!”。\n\n**结果：Hello World!**\n\n恭喜——你已经写了你的第一段 JavaScript\
  \ 代码。在接下来的章节中，我们将讨论更多关于这种语言的内容以及你如何使用它来制作更好的网页。\n\n## 第 3 章：数据和 JavaScript 变量\n\n\
  数据通常被存储以便以后使用。这是编写代码的一个非常重要的方面。JavaScript 是一门奇的编程语言，它可以存储数据以便你以后使用，而无必担心它丢失。\n\n\
  当你编写代码时，你可以通过询问可能在以后使用的信息来与用户进行交互。\n\n### 代码\n\n你希望用户输入他们的姓氏，以便为他们提供个性化的问候。\n\n\
  ```javascript\nvar surname = prompt(“你好用户，可以问一下你姓什么字吗？”);\n```\n\n代码运行后，将弹出一个框询问用户的姓氏是什么。用户只需要在按下回车键或点击确定按钮之前输入他们的姓氏，信息就会被移动并存储在适当的地方。\n\
  \n恭喜，你现在创建了一个作为用户姓氏的变量。\n\n### 变量\n\n如果你把变量想象成架子，它们将变得更容易理解。每个架子都有一个名字，这个名字在变量创建后生成。因此，对于之前的代码，你的架子名字将是\
  \ `surname`，而放在架子上的对象就是用户的姓氏。\n\n你可以创建任何你想作为变量的内容。但建议先为变量命名，这样你就知道哪个变量是哪个，而不是用数字或字母来命名它们。\n\
  \n当你告诉你使用的浏览器来定位一个变量时，它不仅会被找到，该“架子”上的数据也会返回给你。架子上的对象也被称为值（value）。\n\n存储在值中的数据被称为字符串（string）。因此，组成某人姓氏的字母就是\
  \ `surname` 变量的值和 `string`。字符串不一定是字母；也可以是数字。\n\n\n\n现在你创建了两个变量。`var` 只使用了一次的原因是因为你进行了初始化并给变量赋了值。当你只写一次关键字并用逗号将它们分开时，你可以省去一些额外的工作。\n\
  \n在 JavaScript 的帮助下，你将能够计算出你拥有多少个水果。\n\n代码：\n```javascript\nvar piecesOfFruit =\
  \ apples + oranges;\n```\n\n这段代码将告诉浏览器，在将结果重新赋值给 `piecesOfFruit` 的数量之前，它需要根据右侧的数字计算总和。但是，变量名不会被相加，只有值会被相加。你的浏览器会知道你在做什么，并且只会给你这些值的总和。\n\
  \n你的总和不会是 \"pieces of fruit\"（水果个数），而是 `piecesOfFruit`，因为你的变量不能包含任何空格。很容易发现，`Of`\
  \ 和 `Fruit` 中的 `O` 和 `F` 是大写的。这被称为驼峰命名法（camel casing），它有助于使变量更易读。\n\n请记住，代码有多种读取方式。这就是为什么确保你的代码易于阅读和理解是非常重要的。\n\
  \n### 拆分\n\n当你进行数学运算时，不仅仅有加法。对于代码来说，还有除法。\n\n代码：\n```javascript\nvar piecesForEachPerson\
  \ = piecesOfFruit / 3 ;\n```\n\nJavaScript 能够完成这些数学计算，而你无需拿出计算器来确保计算正确。\n\n除法是通过正斜杠\
  \ `/` 完成的，以确保你将左侧除以右侧。\n\n### 运算符\n\n为了得到一组数字的总和，你将为每种操作使用符号。\n\n- 乘法 (`*`)\n- 加法\
  \ (`+`)\n- 除法 (`/`)\n- 减法 (`-`)\n\n每个符号都被称为运算符，因为它们将对某些数学数据进行操作。就像任何数学题一样，执行的执行有一个特定的顺序，这被称为运算符优先级（operator\
  \ precedence）。\n\n看到一组括号意味着在执行乘法、除法、加法或减法过程之前需要先执行它们。记住这个运算顺序简单方法是 `PEMDAS`（括号、指数、乘法和除法、以及加法和减法）。\n\
  \n代码：\n```javascript\n(10+2) / 2 + 4 * 2\n12 / 2 + 4 * 2\n6 + 4 * 2\n6 + 8\n```\n\
  \n## 第 5 章：JavaScript 逻辑\n\n在编程时，能够比较不同的值是非常重要的以便在涉及代码以及如何执行代码时做出决策。比较将使你的结果为假（false）或真（true）。然后，还有一种特殊的数据类型，被称为布尔型（Boolean）数据类型。\n\
  \n使用 JavaScript 进行数学计算将引入一组与布尔值工作的运算符。这些比较将在你操作控制台时进行。你从每行得到的任何结果都将显示为 true 或 false。\n\
  \n### 等于\n\n要确定两个不同的值是否相等，你将使用三个等号（`===`）。\n\n代码：\n```javascript\n15.234 === 15.234\n\
  True\n```\n\n要检查两个变量是否不等，你需要使用两个等号并在它们前面加一个感叹号（`!==`）。\n\n```javascript\n15.234\
  \ !== 18.4545\nTrue\n```\n\n包含数字的字符串在值上等于该数字，但在类型上不等，因此 `===` 比较将返回 false：\n\n```javascript\n\
  “10” === 10\nFalse\n```\n\n然而，如果你使用两个等号（`==`）比较这两个值，它将返回 true，因为两个等号只比较变量的值，而不比较类型！所以这将返回\
  \ true：\n\n```javascript\n\"10\" == 10\nTrue\n```\n\n### 大于/小于\n\n两个数字可以比较为其中一个大于或小于另一个。当一个数字大于另一个数字时，你将使用大于符号\
  \ `>`。\n\n代码：\n```javascript\n10 > 5\nTrue\n```\n\n小于符号是大于符号的反符号（`<`）。\n\n代码：\n\
  ```javascript\n20.4 < 20.2\nFalse\n```\n\n### 组合比较\n\n当数字相等且大小可以比较时，可以使用大于等于（`>=`）或小于等于（`<=`）运算符进行数字比较。\n\
  \n代码：\n```javascript\n10 >= 10\nTrue\n10 <= 5\nFalse\n```\n\n## 第 6 章：JavaScript\
  \ 条件\n\n使用 JavaScript 逻辑将根据所做的比较类型来为代码做出决策。在进行比较之前，必须设置一个条件。JavaScript 中使用了多种条件，但最常用的是\
  \ `If` 语句。\n\n### If 语句\n\n当发现条件为真时，代码将按照预期方式运行。得益于 `if` 语句，当条件证明不成立时，你可以添加必须运行的代码。当条件返回为假时，将会有可选运行的额外条件和代码块。这个选项就是\
  \ `if-else` 语句。\n\n代码：\n```javascript\nif(10 > 5) {\n  // 运行代码\n}\n```\n\n当条件返回为假时，将会有可选运行的额外条件和代码块。这就是\
  \ `if-else` 语句。\n\n```javascript\nif (condition) {\n  // 运行代码\n}\n```\n在大括号内的代码在条件成立时运行。\n\
  \n### If-else\n\n`if-else` 语句是 `if` 的另一种形式，当条件返回为假时使用。\n\n代码：\n```javascript\nif\
  \ (4 < 2) {\n// 运行代码\n} else {\n// 另一种代码\n}\n```\n\n## 第 7 章：使用 JavaScript 循环\n\n\
  就像圆一样，循环将重复执行代码。循环通常在需要多次执行代码时使用。\n\n你最常用的两种循环是 `while` 循环和 `for` 循环。这些条件将结合在一起，直到条件不再为真。\n\
  \n### While 循环\n\n`while` 循环在条件为真时将重复代码。`while` 循环与 `if` 语句非常相似，放在括号内的条件为真。\n\n\
  代码：\n```javascript\nvar i = 1;\nwhile ( i < 10 ) {\n  alert(i);\n  i = i + 1 ;\n\
  }\n// i 现在是 10\n```\n\n一旦循环完成，代码将在括号后继续运行。这段代码将产生从 1 到 9 的弹出框，当循环完成后 `i` 的值将等于 10。\n\
  \n### For 循环\n\n`for` 循环也类似于 `if` 语句，主要区别在于使用三个分号分隔放在括号之间的信息。`for` 循环将初始化条件以获取最终表达式。\n\
  \n在初始化时，你将创建一个变量，以便跟踪你循环到多远，就像你之前使用 `while` 语句时的那样。你的条件将是循环逻辑所在的地方。最终表达式将在创建的每个循环结束时运行。\n\
  \n代码：\n```javascript\nfor(var i = 1 ; i < 10 ; i++ ) {\n  alert(i) ;\n}\n```\n\n\
  在代码中，将弹出一个警告框，按正确顺序给出 1 到 10 的数字。`i++` 等同于 `i = i + 1`。`(i++)` 被称为增量 `i` 的值。正如你所见，在这种情况下\
  \ `for` 和 `while` 循环的作用是一样的。你可能想知道什么时候使用 `for` 循环，什么时候使用 `while` 循环。这是一个简短的解释。\n\
  \n\n\n\n`while` 循环通常用于你不知道循环会执行多少次的情况。例如，用户正在玩游戏，他需要猜一个隐藏的数字。你永远不知道用户有多幸运，所以你不知道他什么时候会选中正确的数字。这就是为什么你设置一个\
  \ `while` 循环并等待正确的数字出现。\n\n代码：\n\n```javascript\nvar number = 0;\n\n// 7 是隐藏的数字！\n\
  \nprompt(\"Try to guess the number!\");\n\nwhile (number !== 7)\n\n{\n\nnumber =\
  \ parseInt(prompt(\"Wrong number, try again!\"));\n}\n\nalert(\"Congratulations,\
  \ you guessed it correctly!\");\n```\n\n当用户输入 `7` 时，它将显示恭喜消息；但如果用户输入其他数字，它将继续显示错误消息，直到用户输入数字\
  \ `7` 为止。\n\n另一方面，在使用 `for` 循环时，我们是在确切知道需要执行循环多少次数时使用它们；它们主要用于处理数组，我们将在稍后的章节中学习数组。\n\
  \n## 第 8 章：JavaScript 中使用的函数\n\n函数将重用代码块以便执行特定的任务。为了执行你调用的函数内部的代码，函数将允许传递任何所使用的参数，以便将值返回给最初调用它的地方。\n\
  \n函数可以保存你变量的值。函数将使用该变量和括号来调用函数。\n\n代码：\n\n```javascript\ndoSomething() ;\n\nfindAnInterestingThing()\
  \ ;\n```\n\n创建一个函数意味着你将使用 `function` 关键字。在使用该关键字之后，参数将列在一组括号内，以便代码块拥有函数的代码。\n\n\
  代码：\n\n```javascript\nvar add = function(a, b) {\n\nreturn a + b ;\n\n} ;\n```\n\
  \n`a` 和 `b` 将是函数的参数，而值将由关键字返回。\n\n用于 `return` 的关键字将停止放在函数中的代码执行；因此，它之后将不再有代码运行。\n\
  \n代码：\n\n```javascript\nvar result = add( 1, 2); // 结果将是 3。\n```\n\n调用会将参数一和参数二相加，这些参数已保存到\
  \ `a` 和 `b` 变量中。\n\n## 第 9 章：JavaScript 中的对象\n\n当 JavaScript 中 中一个对象时，它将非常像现实中的对象，包含一组属性和能力。\n\
  \n对象将拥有一组命名的属性，以及决定其如何运行的方法。\n\n对象将保存到变量中，而其他内容可以通过使用点符号法（dot notation）短语来获取。\n\n\
  作为一个类比，如果你看一个人，他们会有名字、年龄，并且能够移动、学习和说话。如果将这个人类放入 JavaScript 中，他们的名字和年龄将被视为属性，这些无非数据片段。移动、说话和学习的能力将是人类的函数，因为它们是复杂的行为。拥有这些能力的对象被称为方法。\n\
  \n变量可以持有对象，它们通过封装在括号内的特殊语法来创建对象。\n\n代码：\n\n```javascript\nvar jedi = {\n\nName:\
  \ “Luke”,\n\nAge: 899,\n\nTalk: function() {\n\n    alert(“another... Sky... walk\
  \ …”);\n}\n\n};\n```\n\n绝地武（Jedi）的名字和年龄将是对象内部的属性或变量。对象可以存储变量可以存储的任何数据。绝地可以进行的对话是存储函数的属性，也称为方法。数据可以通过使用点符号法的短语从对象中返回。\n\
  \n代码：\n\n```javascript\njedi.Name;\n\nLuke\n\njedi.Age ;\n\n899\n\njedi.Talk() ;\n\
  \n// 将产生一个警告框。\n```\n\n属性也可以重新赋值给对象。\n\n代码：\n\n```javascript\njedi.Name = “Mace\
  \ Windu”;\n```\n\n或者你也可以添加之前没有添加的新变量对象。\n\n```javascript\njedi.lightsaber = “purple”\
  \ ;\n```\n\n属性不需要是任何特定的数据；它们可以是任何内容，也可以是对象和数组。当一个对象列为另一个对象的属性时，你就成功地创建了一个嵌套对象。\n\
  \n代码：\n\n```javascript\nvar person = {\n\nage: 122\n\n};\n\nperson.name = {\n\n\
  First: “Jeanne” ,\n\nLast: “Calment”\n};\n```\n\n现在如果你想知道这个人的名字是什么，你将使用这个。\n\n代码：\n\
  \n```javascript\nalert(person.name.First);\n```\n\n要创建一个为空的项，你需要添加属性和方法。\n\n代码：\n\
  \n```javascript\nvar dog = {};\n\ndog.bark = function() {\n\nalert(“Woof!” );\n\
  };\n```\n\n## 第 10 章：JavaScript 数组\n\n数组是任何类型数据的列表，它不限于包含其他数组。数组中列出的每个项目都将有一个索引，该索引将用于从数组中检索元素。\n\
  \n索引始终从零开始，所有排序的元素都会加一。\n\n在 JavaScript 中创建数组意味着你使用数组字面量语法。\n\n代码：\n\n```javascript\n\
  var emptyArray = [];\n\nvar shoppingList = ['Soda', 'Buns'];\n```\n\n你可以使用方括号法获取特定的元素。\n\
  \n代码：\n\n```javascript\nshoppingList[0];\n\nSoda\n```\n\n你也可以通过方括号法为索引设置值。\n\n代码：\n\
  \n```javascript\nshoppingList[1] = 'Chips';\n\n// 你的 shoppingList 现在是 ['Soda', 'Chips']\n\
  ```\n\n数组中存在的数量将使用 `length` 属性告知你有多少元素。\n\n代码：\n\n```javascript\nshoppingList.length;\n\
  \n3\n```\n\n可以使用 `push` 和 `pop` 方法从数组末尾添加或删除元素。\n\n代码：\n\n```javascript\nshoppingList.push('A\
  \ car');\n\n// shoppingList ['Soda', 'Buns', 'Chips', 'A car']\n\nshoppingList.pop();\n\
  \n// shoppingList 现在是 ['Soda', 'Buns', 'Chips']\n```\n\n下面的代码将创建一个 push、pop，然后遍历数组，以便将其传递给标记为\
  \ `helloFrom` 的函数。然后 `helloFrom` 将返回用于问候字符串：“Hello from”以及用户的名字。在完成 push 和 pop 方法后，用户的名字列表将是“Burt”、“Luke”、“Ron”和“Tim”。\n\
  \n代码：\n\n```javascript\nvar helloFrom = function(personName) {\n\nreturn “Hello\
  \ from” + personName;\n\n}\n\nvar people = ['Burt', 'Luke', 'Ron'];\n\npeople.push('Tim');\n\
  \npeople.push('Dr Evil');\n\npeople.pop();\n\nfor(var I = 0 ; I < people.length;\
  \ I ++)\n\nvar greeting = helloFrom(people[I]);\n\nalert(greeting) ;\n}```\n\n##\
  \ 第 11 章：DOM\n\nDOM 代表文档对象模型，它将操控 HTML 页面的结构和样式。它将由浏览器看到的内部页面表示，以便开发者修改 JavaScript\
  \ 代码。\n\n为了查看页面的 DOM，你需要打开正在使用的浏览器的开发者工具并定位到“元素”（elements）面板。你可以通过在页面的任何地方点击右键并点击菜单列表中的“检查”来实现。\n\
  \n## 树与分支\n\nHTML 的结构与 XML 相似，元素将包含其创建的结构中的父节点以及子节点。这非常像树枝。HTML 将有一个单一根元素，包含分支，就像头部、身体以及连接在其上的肢体。因此，DOM\
  \ 也称为 DOM 树。\n\n\n\n当修改 DOM 时，你将选择一个元素并对其进行你想要的任何更改。这个过程通常是通过 JavaScript 完成的。为了从\
  \ JavaScript 访问 DOM，你需要使用被使用的对象 `document`。它将由浏览器提供，以便代码允许与页面内容中的代码进行交互。\n\n## 获取元素\n\
  \n当你获取一个元素时，取决于你所使用的浏览器，你会有几种方法可以来实现。\n\n### ID\n\n当你尝试通过其 `Id` 检索项时，`document.getElementById`\
  \ 将是你你使用的方法。\n\n代码：\n```javascript\nvar pageHeader = document.getElementById('pageheader');\n\
  ```\n\n使用这段代码，你可以选择 ID 为 `pageheader` 的元素并将其存储在变量 `pageHeader` 中。稍后，你可以修改它、获取它的内容，甚至隐藏和显示它。这里有一个示例。\n\
  \n代码：\n```javascript\nalert(pageHeader.innerHTML);\n```\n\n这将弹出 ID 为 `pageHeader`\
  \ 的元素的内容。例如，如果 `pageheader` 看起来像这样：\n\n代码：\n```html\n<p id=\"pageheader\">This is\
  \ the page header</p>\n```\n\n它将弹出“This is the page header”文本。\n\n你会注意到 `getElementById`\
  \ 是与 `document` 对象一起使用的方法。其他一些方法将可以访问在文件中定位了元素的页面。\n\n### 标签名\n\n`document.getElementsByTagName`\
  \ 的工作方式与 `getElementById` 相同，但它需要一个标签名，如 `a`、`li` 或 `ul`，而不是 ID。它将被返回为 `NodeList`，这基本上是来自\
  \ DOM 的元素列表或数组。\n\n例如，如果你只有两个这样的 `<p>` 元素：\n\n代码：\n```html\n<p>This is one paragraph</p>\n\
  <p>This is another paragraph</p>\n```\n\n那么你可以使用以下代码将这两个元素存储在 `paragraphs` 变量中：\n\
  \n代码：\n```javascript\nvar paragraphs = document.getElementsByTagName(\"p\");\nalert(paragraphs[0].innerHTML);\n\
  alert(paragraphs[1].innerHTML);\n```\n\n`Alert` 函数将显示第一个段落的内容，然后是第二个段落的内容。\n\n###\
  \ 类名\n\n`Document.getElementsByClassName` 返回与标签名方法相同的列表。最大的区别在于，你需要传递一个匹配的类名，而不是标签名。\n\
  \n### CSS\n\n对于现代浏览器，有一些新方法供你使用，通过使用 CSS 选择器让选择元素变得更容易。CSS 的语法为：`document.querySelector`\
  \ 和 `document.querySelectorAll`。\n\n代码：\n```javascript\nvar pageHeader = document.querySelector(\"\
  #example”);\nvar buttons = document.querySelectorAll(\".btn”);\n```\n\n`querySelector`\
  \ 就像你通过 ID 搜索元素一样，它只会返回一个元素。但是，`querySelectorAll` 将返回 `NodeList`。因此，如果有多个元素匹配你的搜索标准，你就需要使用\
  \ `querySelector`，以便你只获取返回的第一个，而不是所有的元素。\n\n## 第 12 节：JavaScript 回调和事件\n\n位于浏览器内部的代码将是事件驱动的，当你编写交互式应用程序时，你必须等待并响应最终将改变浏览器行为的事件。当页面加载或用户与页面上的某些内容交互时，就会发生事件。还有其他会被触发的时间，但这些必须手动完成。\n\
  \n当你需要对事件做出反应时，你必须监听它，以便提供一个函数。每当事件发生时，浏览器都会调用该函数，它被称为回调。\n\n代码：\n```javascript\n\
  var handleClick = function(event) {\n    // 选择一个不同的动作！\n};\n\nvar button = document.querySelector('#big-button');\n\
  button.addEventListener('click',handleClick);\n```\n\n`addEventListener` 是可以在所有\
  \ DOM 元素上找到的方法。当它被调用时，元素将被保存在变量 `button` 中。字符串中第一个列出的参数将是你应该监听的事件名称。这段代码中的事件是鼠标点击或手指的触摸。回调是\
  \ `handleClick`。\n\n如果你正在使用 Internet Explorer，如果你运行的版本早于版本 9，则不支持 `addEventListener`。在这种情况下，你应该使用\
  \ `attachEvent`。\n\n代码：\n```javascript\nbutton.attachEvent('onclick', handleClick);\n\
  ```\n\n如果你仔细看，你会发现需要 `onclick` 而不是 `click`。这会在你遇到的大多数事件中发生。正是像这样的对象创建了如 `jQuery`\
  \ 之类的库来帮助你，即使两个浏览器之间的监听方式不同，得由于作为回调传递的事件，这也不再重要了。\n\n传递的任何特定事件的数据都是回调。当你查看上面声明的\
  \ `handleClick` 时，你会发现参数或 `event` 是描述对象属性的地方。\n\n代码：\n```javascript\n{\n  offsetX:\
  \ 7,\n  offsetY: 0,\n  pageX: 1,\n  pageY: 1,\n  target: 2,\n  timestamp: 3,\n \
  \ type: “click”,\n  x: 4,\n  y: 5\n}\n```\n\n## 第 13 节：结合 JavaScript AJAX\n\n在进入这一节之前，非常注意的是，许多浏览器在直接从用户处调用时会自动\
  \ AJAX。为了让 AJAX 正常工作，你需要一个 Web 主机或本地。当 Web 最初出现时，情况比现在简单。页面现在有文本和样式，同时可能有引导你到另一个页面的链接。要在页面上放置新内容，你必须将其从一个页面移动到另一个页面。开发者一直试图让网页具有交互性，但显然新内容需要一种不需要每次重新加载的方法。\n\
  \n在检索新内容时，有一种名为 `XHR` 或 `XML HTTP Request` 的软件可以帮助。互联网应用程序使用 AJAX。AJAX 的意思是异步 JavaScript\
  \ 和 XML。大多数网页都可以通过这种技术无需重新加载页面即可获取内容。微软实际上在创建 Outlook 时决定应该使用 `XML Http Request`。\n\
  \n### XML HTTP 请求\n\n你知道 `XML HTTP Request` 是什么，但它是如何显示的呢？\n\n代码：\n```javascript\n\
  var req = new XMLHttpRequest ();\nreq.onload = function ( event) { … };\nreq.open('get'\
  \ , 'some-file.txt' , true);\nreq.send();\n```\n\n当创建一个 `XMLHttpRequest` 时，你需要一个新的关键字来调用它，类似于调用函数的方式。回调将在信息可用的时间点发生，然后它将事件输入传递到第一个参数。\n\
  \n异步的参数将默认为 `false`，这会导致代码的执行暂停，直到请求到适当的数据，这被称为同步。\n\n\n\n\n同步 `XMLHttpRequest`\
  \ 极少被使用，它是向系统的一种请求，该请求有时需要很长时间才能加载。最后一行将允许网页拒绝对任何信息的请求。\n\n在使用 `XMLHttpRequest`\
  \ 时，你将能够通过 `HTTP` 和 `HTTPS` 服务器加载 `JSON`、`XML`、`HTML` 以及一系列文本，同时继续支持如 `FTP` 等规则。归而言之，它们在涉及\
  \ JavaScript 应用开发的一系列任务中是非常有用的。\n\n## AJAX 和库\n\n与 `AJAX` 配合的技术被创建出来，使得现在有了一些单页应用，其需求是触发\
  \ JavaScript 脚本，从而允许从服务器加载的任何其他脚本以异步的方式出现。有整个库和框架是为了帮助实现这一点而构建的。\n\n## 第 14 章：JSON\n\
  \nJSON 代表 `JavaScript Object Notation`（JavaScript 对象表示法）。这是一组文本格式规则，用于在机器中存储和移动数据，以便人类能够阅读。它看起来类似于在\
  \ `JavaScript` 中使用的对象字面量语法，但这正是 `JSON` 起源的地方。\n\n`JSON` 可能不是 `JavaScript` 官方代码的一部分，但它是\
  \ `JavaScript` 的重要组成部分，所以虽然它是一种不同的语言，但当它与 `JavaScript` 工作时，理解它是如何工作的对你来说仍然很重要。\n\
  \n### 代码\n```\n{ “name” : “Luke” , age: 894, “lightsaber” : { “color” : “green”\
  \ } }\n```\n\n就像普通的 `JavaScript` 代码一样，括号用于标记代码的特定部分。\n\n`JSON` 将传输浏览器与其服务器之间需要移动的信息，或者它将被保存在文本文件中并在稍后检索，因为它仅仅是文本。正因如此，你将被允许存储函数等复杂数据。然而，数组和任何包含简单数据的对象将被使用。\n\
  \n当来自网页的数据传输格式以及新的 `APIs` 被编写为专门为 `JSON` 服务时，`JSON` 将取代 `XML`。这意味着你将能够使用 `AJAX`\
  \ 技术来获取 `JSON`。\n\n## 使用 JSON\n\n可以通过 `stringify` 方法配合 `parse` 方法将数据从 `JSON` 转换转换。`JSON`\
  \ 是可用的对象在大多数现代浏览器中都是可用的，但如果你的浏览器中尚不存在，你可以将其添加到浏览器中。\n\n### 代码\n```\n\nvar jsonString\
  \ = JSON.stringify( {\n\nMake: \"McLaren\" ,\n\nModel: \"MP4-12C\" ,\n\nMiles: 5023\n\
  \n} ) ;\n```\n\n`JSON.stringify` 将一个对象转换为 `JSON` 字符串。如代码所示，`jsonString` 将是 `{ “make”\
  \ : “McLaren”, “model” : “MP4-12C”, “miles”: 5023 }`。\n\n### 代码\n```\nvar car =\
  \ JSON.parse(jsonString);\n```\n\n使用 `JSON.parse` 将允许字符串转换为 `JavaScript` 对象。`.car`\
  \ 现在是一个 `JavaScript` 对象，可以在设置属性的地方使用它。\n\n### 代码\n```\ncar.model = “P1” ;\n```\n\
  \n## 第 15 章：JavaScript 作用域\n\n作用域是决定变量可见性的术语。变量作用域是代码中可以访问和修改变量的部分。`JavaScript`\
  \ 使用了函数作用域。\n\n作用域由声明变量的代码块决定。该块可以是包含两个大括号内的任何内容，或者是缩进的内容。\n\n### 代码\n```\nvar a\
  \ = 10 ;\n\nif(a > 5) {\n\nvar b = 5;\n\n}\n\nvar c = a + b; // 这是糟糕的编程实践！\n```\n\
  \n全局变量可以在你放置它们的应用程序任何地方被读取和修改，但它们不是最好的使用方式，因为它们会暴露代码中的安全问题，最终会使代码更难以维护。\n\n记住，你的代码需要阅读的次数多于编写的次数。每当代码被人类阅读但无法确定变量来自何处或有哪些潜在值时，你就会遇到问题。\n\
  \n当你尽可能地限制变量的作用域时，你将获得最佳结果，这将使得它在尽可能少的代码部分可见。\n\n## 函数作用域\n\n由于 `JavaScript` 的处理方式不同，它将使用函数作用域。函数作用域意味着变量在它们被声明的函数外部时是不可见的。如果它们没有在函数中声明，那么它们将是全局可见。\n\
  \n### 代码\n```\nvar doSomething = function() {\n\nvar a = 10 ;\n\n} ;\n\ndoSomething\
  \ () ;\n\nconsole.log(a) ; // 这显示 a 未定义。\n```\n\n### 子作用域\n\n变量也会出现在子作用域中，子作用域有它们自己的作用域。对于代码，如果\
  \ `doSomethingElse` 是 `doSomething` 函数的子函数，那么当变量 `\"a\"` 放在 `doSomethingElse` 内部时它是可见。\n\
  \n### 代码\n```\nvar doSomething = function() {\n\nvar a = 10;\n\nvar doSomethingElse\
  \ = function() {\n\nconsole.log(a); //a 将是 10\n\n} ;\n\ndoSomethingElse ();\n\n\
  } ;\n\ndoSomething() ;\n```\n\n函数作用域在创建优雅代码方面是非常强大的工具，但需要一些时间才能真正精通。\n\n## 第 16\
  \ 章：JavaScript 中的 jQuery\n\n有一组工具在修改和控制 DOM 时会被使用。尽管这有点混乱，但因为有不同的 DOM。为了让编码体验更简单，已经设置了大量的资源来隐藏重大的错误，并提供了一种更统一的方式来提供功能，从而消除代码复杂性带来的压力。`jQuery`\
  \ 是一个广名的 DOM 库，被用于各种页面。但是，你用于与 DOM 通信的过程将被称为应用程序编程接口或 `API`。\n\n`jQuery` 具有一种非常独特的语法，因为它基于美元符号。\n\
  \n### 代码\n```\n$('.btn').click (\n\nfunction() {\n\n//选择一个不同的动作\n\n}\n\n) ;\n```\n\
  \n此代码将附加到所有 `btn` 类元素的点击处理程序上。选择器语法是 `jQuery` 的核心。`jQuery` 可以通过脚本元素放在网站。你可以从 `jquery.com`\
  \ 获取文件，也可以从 CDN 添加。\n\n### 代码\n```html\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js\"\
  ></script>\n```\n\n你不应该总是使用库，但你应该根据它是否具有开发者选择的结构来做出选择。例如，如果 `jQuery` 有一个庞大的文档需要引入，那么下载速度将会变慢，特别是对于连接可能较弱的移动浏览器。\n\
  \n\n\njQuery 拥有一种链式语法，在您设置任何类型的方法时都非常有效。jQuery 将返回与选择器函数相同的元素。美元符号 `$` 是一个函数，用于返回一个封装在元素之上的\
  \ jQuery 对象。`.css()` 方法可以将背景颜色更改为红色，而 `.height()` 则设置你所选元素的高度。还有一个可以用于宽度的方法。\n\n\
  ### 获取器与设置器 (Getters and Setters)\n\n如所示，`.css()` 和 `.height()` 用于为元素设置值，但这些方法也被获取器（getters）。当你调用\
  \ `.height()` 且没有提供任何要设置的值时，元素的当前高度将通过带有简单 CSS 属性的 `.css()` 方法来获取该属性的值。\n\n### 代码：\n\
  ```javascript\nvar currentHeight = $('.note').height(),\ncurrentColor = $('.note').css('color');\n\
  ```\n\n当选中了多个元素时，获取器将获取其中第一个元素的值。\n\n### 上下文 (Context)\n\n在某些情况下，需要限制选择元素的 DOM 范围。被使用的\
  \ DOM 区域被称为不同的上下文（context）。\n\n你需要通过第二个参数告诉 jQuery 你想要选择的区域，该参数可以是一个 DOM 元素、字符串选择器，甚至是\
  \ jQuery 对象。jQuery 只会在你选择器所在的上下文中搜索，而不涉及其他内容。\n\n### 代码：\n```javascript\nvar $header\
  \ = $('header'),\n$headerBoxes = $('.note', $header);\n```\n\n## 第 18 章：jQuery 和\
  \ AJAX\n\n在 jQuery 方面，有一些 AJAX 辅助方法可以帮助你节省时间并让你的代码看起来更轻松。它们是 `$` 变量的方法：`$.get`、`$.post`\
  \ 和 `$.ajax`。\n\n`$.ajax` 策略是构建 AJAX 请求的主要技术和方法。其他方法将作为配置的快捷方式，例如获取数据或提交数据。\n\n\
  ### 代码：\n```javascript\n$.ajax({\n  url: '/data.json',\n  method: 'GET',\n  success:\
  \ function (data) {\n    console.log(data);\n  }\n});\n```\n\n当 jQuery 需要检索时，将使用对象配置。它会提供基础信息，如\
  \ URL。该方法默认使用 get 方法，每当数据检索完成后都会调用该函数，其命名为 `success` 回调。\n\n### $.get\n\n该方法的代码将获取一系列信息，由于这是函数的基础，jQuery\
  \ 将提供一个辅助方法。\n\n### 代码：\n```javascript\n$.get('/data.json', function (data) {\n\
  \  console.log(data);\n});\n```\n\n还会提供一个错误回调（callback error），让你知道是否出现错误，从而导致找不到服务器的情况。\n\
  \n### 代码：\n```javascript\n$.get('/data.json', function (data) {\n  console.log(data);\n\
  }).fail(function () {\n  // 噢，那不对\n});\n```\n\n### $.post\n\n当你将输入重定向到系统时，将使用 `$.post`\
  \ 方法。第二个参数将导致数据发送到函数以外的任何地方。jQuery 会找到一种发送数据的方法。\n\n### 代码：\n```javascript\n$.post('/save',\
  \ { username: 'burt' }, function (data) {\n  console.log(data);\n}).fail(function\
  \ () {\n  // 错误操作\n});\n```\n\n### $.ajax\n\n为了对信息的流向拥有更大的控制权限，你会使用 `$.ajax` 方法。\n\
  \n### 代码：\n```javascript\n$.ajax({\n  url: '/save',\n  method: 'POST',\n  data:\
  \ { username: 'burt' },\n  success: function (data) {\n    console.log(data);\n\
  \  },\n  error: function () {\n    // 错误操作\n  }\n});\n```\n\n## 第 19 章：jQuery 和其他技巧\n\
  \njQuery 将帮助你完成其他常见任务，特别是当一系列浏览器之间存在不一致时。\n\n#### DOM 内容加载完成 (DOM Content Loaded)\n\
  \n在某些情况下，JavaScript 在 DOM 加载后运行，以便代码尝试将对象移动到网站的不同部分，或设计新网站。这完全是 JavaScript 的。但它并不是在每个浏览器中都能工作。\n\
  \n### 代码：\n```javascript\nvar doSomething = function(event) {...};\nwindow.addEventListener('DOMContentLoaded',\
  \ doSomething);\n```\n\n然而，使用 jQuery 这样做会更容易，并且它可以跨越多个浏览器。\n\n### 代码：\n```javascript\n\
  $(doSomething);\n```\n\n### 加载 (Load)\n\n在特定情况下，你需要在页面完全加载后再尝试对其进行任何操作。当你使用 jQuery\
  \ 时，你将监听加载到窗口的事件。\n\n### 代码：\n```javascript\nwindow.addEventListener('load', doSomething);\n\
  ```\n\n使用 jQuery，这会更简单。\n\n### 代码：\n```javascript\n$(window).load(doSomething);\n\
  ```\n\n### 类型检查 (Type Checking)\n\n要找出存储在变量中的数据，JavaScript 会很笨拙，但 jQuery 能够展示你如何做。\n\
  \n### 代码：\n```javascript\n$.isArray([1, 2, 3]); // True\n$.isFunction(function()\
  \ { }); // True\n$.isNumeric(10); // True\n```\n``` // True\n\n## 第 20 章：JavaScript\
  \ 控制语句\n\n在前面的章节中我们讨论了 `if`、`else` 和循环，但本节将详细解释它们。\n\n### if-then\n\n`if` then 语句在条件为真时执行。\n\
  \n### 代码：\n```javascript\nfunction applyBrakes() {\n  if (isMoving) {\n    // \"\
  if\" 子句\n    acceleration--;\n}\n```\n\n当省略大括号时，你的代码会变得脆弱。如果在代码中放置另一个表达式，就会增加一个要求，意味着你必须使用大括号。JavaScript\
  \ 编译器不会捕捉这个错误；它只会给你不正确的结果。\n\n### if-then-else\n\n`if then else` 子句会在语句失败时为代码创建一个辅助路径。\n\
  \n### 代码：\n```javascript\nfunction applyBrakes() {\n  if (isMoving) {\n    currentSpeed--;\n\
  \  } else {\n    alert(\"车辆未移动！\");\n  }\n}\n```\n\n### switch\n\n`switch` 语句为代码执行提供了不同的路径。`switch`\
  \ 语句适用于 `int`、`short`、`char` 和 `byte` 数据以及枚举数据类型。\n\n### 代码：\n```javascript\nvar\
  \ month = 8;\nvar monthString;\nswitch(month) {\n  case 1: monthString = \"January\"\
  ; break;\n  case 2: monthString = \"February\"; break;\n  case 3: monthString =\
  \ \"March\"; break;\n  case 4: monthString = \"April\"; break;\n  case 5: monthString\
  \ = \"May\"; break;\n  case 6: monthString = \"June\"; break;\n  case 7: monthString\
  \ = \"July\"; break;\n  case 8: monthString = \"August\"; break;\n  case 9: monthString\
  \ = \"September\"; break;\n  case 10: monthString = \"October\"; break;\n  case\
  \ 11: monthString = \"November\"; break;\n  case 12: monthString = \"December\"\
  ; break;\n  default: monthString = \"无效月份\"; break;\n}\nalert(monthString);\n```\n\
  \n\n\n\n作为 `switch` 语句的一部分，主语句将允许注释进入 `switch` 块，以便执行多个 `case` 或 `default` 标签。所有的\
  \ `switch` 语句在被 JavaScript 执行之前会被评估。当一个语句与另一个语句具有相同的标签时，它将成功匹配。\n\n### Code\n```javascript\n\
  var month = 8\n\nif(month === 1) {\n\n  alert(\"January\");\n\n} else if (month\
  \ === 2) {\n\n  alert(\"February\");\n\n}\n\n… 以此类类推。\n```\n\n当使用 `if-then else`\
  \ 语句时，会对表达式的清晰度进行检查。`if-then else` 语句将测试任何表达式，以检查是否根据使用的枚举值、字符串值和整数进行测试所需的条件和任何值。`switch`\
  \ 语句将结束任何 `break` 语句。\n\n控制流将继续执行放置在 `switch` 块之后的任何注释。`break` 语句仅在 `switch` 块发生穿透（fall\
  \ through）时使用，但所有其他语句都需要相同的标签，以便按照它们放置的顺序进行执行。`case` 标签的位置并不重要，直到遇到 `break` 语句为止。\n\
  \n### Code\n```javascript\nvar futureMonths = [ ];\n\nvar month = 8;\n\nswitch (month)\
  \ {\n\ncase 1: futureMonths.push (\"January\") ;\n\ncase 2: futureMonths.push (\"\
  February\") ;\n\ncase 3: futureMonths.push (\"March\") ;\n\ncase 4: futureMonths.push\
  \ (\"April\") ;\n\ncase 5: futureMonths.push (\"May\") ;\n\ncase 6: futureMonths.push\
  \ (\"June\") ;\n\ncase 7: futureMonths.push (\"July\") ;\n\ncase 8: futureMonths.push\
  \ (\"August\") ;\n\ncase 9: futureMonths.push (\"September\") ;\n\ncase 10: futureMonths.push\
  \ (\"October\") ;\n\ncase 11: futureMonths.push (\"November\") ;\n\ncase 12: futureMonths.push\
  \ (\"December\") ;\n\nbreak ;\n\nbreak ;\n\nDefault: break ;\n\n}\n\nif(futureMonths.length\
  \ === 0) {\n\n  alert (\"Invalid month number\") ;\n\n} else {\n\n  for(var i=0;\
  \ i<futureMonths.length; i++) {\n\n    alert(monthName);\n\n  }\n\n}\n```\n\n该代码的输出将弹出从\
  \ 8 月到 12 月的月份。\n\n当 `break` 结束时，你不需要替换任何代码，因为代码已经从 `switch` 语句中消失了。强烈建议使用此 `break`，因为它使修改代码变得更容易，从而减少可能收到的错误。`default`\
  \ 下的代码部分将处理未放置在 `case` 部分的值。代码可以包含多个 `case`。\n\n### Code\n```javascript\nvar month\
  \ = 2;\n\nvar year = 2016;\n\nvar numDays = 0;\n\nswitch (month) {\n\ncase 1: case\
  \ 3: case 5:\n\ncase 7: case 8: case 10:\n\ncase 12:\n\nnumDays = 28;\n\nbreak ;\n\
  \ncase 4: case 6:\n\ncase 9: case 11:\n\nnumDays = 31;\n\nbreak;\n\ncase 2:\n\n\
  if ((year % 4 === 0) &&\n\n!(year % 100 === 0)\n\n|| (year % 400 === 0))\n\nnumDays\
  \ = 29;\n\nelse\n\nnumDays= 28;\n\nbreak;\n\ndefault: alert (\"Invalid month.\"\
  ) ;\n\nbreak ;\n\n}\n\nalert(\"Number of Days = \" + numDays) ;\n```\n\n结果将是 29，因为在\
  \ 2 月发现了 29 天。\n\n### Switch 语句字符串\n字符串对象将被放入 `switch` 语句中。在某个时刻，将放置一个 `switch`，其表达式将根据\
  \ `case` 标签与其他表达式进行比较。只有当 `case` 为小写且 `case` 标签也是小写时，这些字符串才能被 `switch` 。\n\n###\
  \ Code\n```javascript\nvar month = \"January\";\n\nvar monthNumber = 0;\n\nswitch\
  \ (month.toLowerCase()) {\n\ncase \"january\":\n\nmonthNumber = 1\n\nbreak ;\n\n\
  }\n```\n\n该语句将继续执行，直到所有十二月份都以小写写出来以及对应的月份数字。\n\n### While 和 do while 语句\n`while`\
  \ 语句只有在条件为真时才会在语句块上连续工作。\n\n### Syntax\n```\nwhile (expression) {\n  Statement(s)\n\
  }\n```\n\n`while` 语句会在返回布尔语句之前评估任何和所有表达式。当发现条件为真时，它将执行 `while` 块中的任何语句。但当语句被测试时，它将一直执行到语句被证明为假为止。\n\
  \n### Code\n```javascript\nvar count = 5 ;\n\nwhile (count < 15) {\n\n  alert(\"\
  \ Count is: \" + count) ;\n\n  count++;\n\n}\n```\n\n无限循环将以此语法在 `while` 语句中实现：\n\
  ```javascript\nwhile(true){\n// 脚本属于此部分\n}\n```\n\n`do while` 语句也可以是 JavaScript\
  \ 编码的一部分。\n\n```javascript\ndo {\n  Statement(s)\n} while (expression) ;\n```\n\n\
  `do while` 语句与无限循环之间的主要区别在于，作为 `while` 循环执行执行的表达式会在 JavaScript 向上运行时时首先被评估。\n\n\
  ### Code\n```javascript\nvar count = 5\n\ndo {\n  alert(\"Count is: \" + count)\n\
  \  count++;\n\n} while (count < 10) ;\n```\n\n### For 语句\n`For` 语句为迭代提供了一种方法。\n\n\
  ### Syntax\n```\nfor (initialization; termination; Increment) {\n  Statement(s)\n\
  }\n```\n\n当你处理 `for` 语句时，必须记住每当条件为假时就会发生 `termination`。`Increment` 表达式将在循环后调用。最后，初始化将启动循环。\n\
  \n### Code\n```javascript\nfor (var i=1 ; i<12; i++){\n  alert (\"Count is: \" +\
  \ i);\n}\n```\n\n输出将是从一到十的数字。当声明代码时，变量将从其声明的地方开始扩展。如果变量在 `for` 语句中声明，则不能在循环外部使用。`j`、`k`\
  \ 和 `I` 等变量用于循环控制。一旦变量被声明，该变量的生命周期就会缩短，从而减少错误发生的概率。在 `for` 循环中将使用三个表达式。`for` 语句可以包含一个在迭代过程中使用的不同变体。\n\
  \n### Code\n```javascript\nvar numbers = [11, 12, 13, 14, 15, 16, 17, 18, 19];\n\
  \nfor (var i=0; i<numbers.length; i++) {\n  alert (\" Count is : \" + numbers[i])\n\
  }\n```\n\n这种变体使语句更短。使用这种变体将按照 `for` 语句通常的通用方式写出语句。\n\n### break 语句\nJavaScript 中使用了两种\
  \ `break` 语句，带标签的语句和无标签的语句。无标签语句用于使用 `switch` 语句时。这些 `break` 也会终止大多数循环。\n\n### Code\n\
  ```javascript\nvar arrayOfInts = [72, 57, 5, 579, 14, 1179, 2120, 9, 655, 145];\n\
  \nvar searchfor = 14;\n\nvar I;\n\nvar foundIt = false;\n\nfor (I = 0; I < arrayOfInts.length;\
  \ I++) {\n  if (arrayOfInts [I] === searchfor) {\n    foundIt = true;\n    break;\n\
  \  }\n}\n\nif (foundIt) {\n  alert(\"found \" + searchfor + \" at index \" + I);\n\
  } else {\n  alert(\"not in the array\");\n}\n```\n\n\n\n\n\n如果在循环在到达你想要提取的值之前就已经终止，则必须在粗体位置放置\
  \ **break** 语句。大多数控制流语句都可以转换为循环。\n\n在上面的代码中，输出将是数字十二，并且它是在第四个索引处找到的。\n\n`breaks`\
  \ 是无标签的，因此它们将终止 `switch`、`do while` 和 `for` 语句的任何内部部分。当 `break` 带有标签时，它将停止任何位于外部找到的语句。\n\
  \n代码：\n\n```javascript\nvar arrayOfInts = [ [ 32, 87, 3, 589 ], [ 12, 1076, 2000,\
  \ 8 ], [ 622, 127, 77, 955] ];\n\nvar searchfor = 12;\n\nvar I;\n\nvar j = 0;\n\n\
  var foundIt = false;\n\nsearch:\n\nfor(I =0; I < arrayOfInts.length; I++) {\n  for\
  \ (j = 0; j < arrayOfInts[I].length; j++) {\n    if (arrayOfInts[I][j] === searchfor)\
  \ {\n      foundIt = true;\n      break search;\n    }\n  }\n}\n\nif (foundIt) {\n\
  \  alert(\"Found \" + searchfor + \" at \" + I + \", \" +j);\n} else {\n  alert(searchfor\
  \ + \" not in the array\");\n}\n```\n\n输出将是十二是在第一个索引处找到的。\n\n标签语句将在 `break` 语句处停止，然后流将不会转移。当控制流语句发生转移时，标签将停止该语句。\n\
  \n### Continue 语句\n\n`continue` 语句将跳过你放置在 `for`、`do while` 或 `while` 循环内部的任何迭代。无标签的形式将被跳过，以便在控制你循环的布尔表达式之前对内部内部代码进行求值。\n\
  \n代码：\n\n```javascript\nvar searchMe = \"Peter Piper picked a \" + \"peck of pickled\
  \ peppers\";\n\nvar max = searchMe.length;\n\nvar numPs=0;\n\nfor (var I = 0; I\
  \ < max; I++) {\n  // 仅对 p 感兴趣\n  if (searchMe[I] !== 'p')\n    continue;\n  //\
  \ 处理 p\n  numPs++;\n}\n\nalert(\"found \"  + numPs + \" p-s in the string. );\n\
  ```\n\n在上面的代码中发现了 7 个 p。\n\n每当移除 `continue` 语句时，实际上会找到 35 个 p。当发现外层循环的当前迭代具有标签时，该语句将被跳过。\n\
  \n在这段代码中，你将看到有两个嵌套在一起的循环，以便搜索子字符串。当两个循环嵌套时，需要其中一个对子字符串进行迭代，同时另一个字符串进行搜索。\n\n代码：\n\
  \n```javascript\nvar searchMe = \"Look for a substring in me\" ;\n\nvar substring\
  \ = \"sub\";\n\nvar foundIt = false;\n\nvar max = searchMe.length - substring.length;\n\
  \ntest:\n\nfor (var I = 0; I <= max; I++) {\n  var n = substring.length;\n  var\
  \ j = I;\n  var k =0;\n  while (n-- !== 0) {\n    if (searchMe[j++] !== substring[k++])\
  \ {\n      continue test;\n    }\n  }\n  foundIt = true;\n  break test;\n}\n\nalert(foundIt\
  \ ? \"Found it\" : \"Didn’t find it\");\n```\n\n### Return 语句\n\n在分支语句的结尾可以找到 `return`\
  \ 语句。`return` 语句用作当前控制流语句的退出方法，以便返回到方法首次调用的点。就像其他表达式一样，对于返回的语句可以使用两个不同的表达式。\n\n\
  当在一个语句中找到值时，它将被返回，而另一个值将不会返回。要获取返回的值，你需要在想要返回的关键字之后列出值。语法将是 `return ++ count ;`。\n\
  \n返回的数据类型需要与方法声明的类型匹配。一旦方法声明完成，该值将无效且不会返回值。\n\n### 结论\n\n感谢你阅读《JavaScript：初学者编程指南》（JavaScript:\
  \ Beginner’s Guide to Programming Code with JavaScript），希望它对你有启发性，并为你提供了实现目标所需的所有工具，无论目标是什么。\n\
  \n下一步是使用你所学的编码技能并创建你自己的代码。起初并不容易，但将是值得的。会有搞砸的时候，但你应该保持耐心，因为就像学习任何新事物一样，你将会犯错。\n\n\
  不要因为你的代码第一次运行不通就放弃。再次回顾书中的课程并重读它们。学习如何编写代码在你掌握精窍之前会很困惑，因为由于你将学习到所有不同的条件和异常。\n\n\
  一旦你掌握了代码，你将拥有创建自己的网页、移动应用程序等更多内容。JavaScript 是一种多功能的代码，它将从多个方面帮助你。\n\n最后，如果你觉得这本书对你有帮助，我们将不胜感激你在\
  \ Amazon 上的评价！\n\n\n\n它是所有主流浏览器中最通用的计算机语言，从简陋的 Internet Explorer 到先进的 Google Chrome\
  \ 和 Safari 都是如此。大多数计算机的系统中已经安装了 `JavaScript`，因此可以确保世界各地的访问者都能看到你在互联网上的内容、软件和计算机程序。\n\
  \n每个人和任何人都可以使用 `JavaScript`，而无需购买许可。\n\n此外，如果你好奇的话，`JavaScript` 和 `Java` 是两种完全不同的计算机语言，用于各种编程需求。\n\
  \n`JavaScript` 的用处在于，有许多预先写好的 `JavaScript` 代码你可以直接复制并将其插入到你的网页中以实现类似的效果，而不需要自己重新编写所有代码。你只需要弄清楚代码的作用，然后知道将这些代码复制并粘贴到哪些特定位置，以获得所需的效果，就像烘焙蛋糕一样。\n\
  \n如果你打开了这本书，我们不会深入探讨 `JavaScript` 的细节，也不会教你编码、编程的基础知识或步骤，或是将这些代码粘贴到你的网页中。\n\n然而，这本书将做的是为你提供大量的技巧和窍门，帮助你成为一名更优秀的程序员，并更高效地使用\
  \ `JavaScript`。\n\n## JavaScript 简史\n\n回到 20 世纪 90 年代，当世界网仍处于发展阶段时，所有的网页都是静态的，用户与网站之间没有交互方式。你看到的完全就是设置好的。\n\
  \n当时最流行的两个浏览器是 Internet Explorer 和 Netscape Navigator。虽然 Internet Explorer 著名得多，但\
  \ Netscape 是第一个引入让网页能够与用户交互的编程语言的。这种语言被称为 `LiveScript`，并被集成到 Netscape 浏览器中。得益于这种语言，任何使用\
  \ Netscape 的人都可以与页面交互。`LiveScript` 不需要插件。\n\n另外，还有另一种编程语言需要单独的插件才能运行，它被称为 `Java`。此时，`Java`\
  \ 变得非常广为人知，Netscape 决定通过将 `LiveScript` 重命名为 `JavaScript` 来从中获利。\n\n正如前面提到的，`Java`\
  \ 和 `JavaScript` 之间存在巨大差异，尽管它们的代码看起来相似。\n\n然后，Internet Explorer 出于创新的需求进行了更新，并受到了两种集成语言的支持：一种基于\
  \ `BASIC` 编程的 `vbscript`，另一个是类似于 `JavaScript` 的 `Jscript`。\n\n当 Internet Explorer\
  \ 成为最常用的浏览器时，`JavaScript` 也成为了新兴浏览器中最接受、使用最广泛的编程语言。\n\n回到 1996 年，脚本语言变得如此重要，以至于将其交给竞争对手的浏览器开发商是有风险的。在同一年，`JavaScript`\
  \ 被交给了 ECMA，该机构是负责编程语言开发的国际标准组织。这种语言被正式重命名为 `ECMAScript`，但程序员和所有其他人仍然称它为 `JavaScript`。\n\
  \n它的名字听起来也酷得多。\n\n## JavaScript 的重要性\n\n理解如何使用 `JavaScript`，就是理解开发网页的其它编程语言的基本作用。\n\
  \n简单来说：\n\n1. `HTML` 是用于标记内容的语言。`HTML` 定义了内容是什么，而不是它在网页上什么样子。\n2. `CSS` 用于定义网页的外观。这包括指定哪种媒体对应哪条命令。\n\
  \n仅仅通过这两种语言，你就可以创建一个静态网页，无论你在什么设备上查看该网页，或使用何种浏览器进行访问，都可以轻松访问。\n\n然而，这类网页最大的缺点是，访问者与你的静态站点交互的唯一方法就是填写表单并等待新页面加载。\n\
  \n这就是 `JavaScript` 用用场的地方。\n\n`JavaScript` 将静态页面转换为交互式页面，这样网站访问者在每次发出请求时都不需要等待新页面加载。`JavaScript`\
  \ 让你的网页具有行为——让它们能够实时响应各种操作。\n\n通过 `JavaScript`，你可以：\n\n- 在用户输入信息时验证表单中的每个字段，而不是等填完整个表单并在提交表单后才被告知用户拼写错误。\n\
  - 让你的页面能够比涉及表单更多的更多方式进行交互。\n- 为页面添加动画，吸引对特定部分的注意，或让网站更易用。\n- 在网页上加载新的、更重的图像和脚本。\n\
  - 让你能够改进访问者的体验。\n\n## 第 1 章：帮助你的简单技巧\n\n## 更快地学习 JavaScript\n\n通常，当任何人在学习 `JavaScript`\
  \ 或任何编码技能的道路上时，他们经常会遇到这些问题：\n\n- 概念混淆\n- 学习的时间和动力\n- 容易忘记代码\n- 工具领域不断变化\n\n在本章中，我们将学习通过一些心理技巧来克服这些挑战，这些技巧可以帮助你更快地熟悉\
  \ `JavaScript` 领域，让你成为一名更高效的程序员。\n\n### 技巧 1：为你想要学习的内容创建一个一个路线图\n\n面对现实吧——有许多框架可以使用，新手总是处于应该从哪一个开始的十字路口。与其研究应该从哪种框架开始，克服这一点的最佳方法之一是创建一个你需要知道的学习路线图。\n\
  \n例如，如果你想成为一名前端开发人员，你的路线图可能像这样：\n\n![](img/00001.jpeg)\n\n`HTML` 和 `CSS` 是你在继续学习其他内容之前需要知道的最基础编码知识。然后你可以继续学习\
  \ `JavaScript` 和 `jQuery`。一旦你创建了路线图，它将让你更容易专注于本质的事情，而不是浪费时间和精力。\n\n### 技巧 2：慢慢来\n\
  \n\n\n\n寻找练习代码的时间可能是困难的。然而，编写代码的人往往也是社交媒体的重度用户，经常花时间在 YouTube、Facebook、Reddit 甚至\
  \ Wikipedia 上。无论你是否如此，都能从使用社交媒体中汲取宝贵的教训。\n\n即使我们只是想看一条通知，却在 Facebook 上花费了如此多时间，这一事实说明了很多问题。我们被\
  \ Facebook 吸引是因为一环扣一环的，因为你不断看到有人更新状态和动态，而你的新闻推送里总有新内容可以看。\n\n利用同样的心理学，你可以将其转化为学习代码的优势。与其承诺投入几个小时来学习代码，不如告诉自己你将投入整整\
  \ 15 分钟且完全不受打扰的时间。\n\n然后看看 Facebook，稍微休息一下。\n\n然后再次回来，再做 15 分钟。\n\n但是，这种技术只有在你专注于目标、不让\
  \ Facebook 或其他任何事情将你卷入并让你完全忘记正在做什么时，它才会生效。\n\n### 技巧 5：给自己留出时间\n\n俗话说，如果你花时间慢慢思考，你的学习速度会快得多。编程需要时间。你需要时间来理解它。否则，你只会变得更加困惑。花时间弄清楚你正在尝试学习什么。如果有必要，向别人解释它。花时间仔细研究每一个步骤、每一行代码，而不是试图一次性搞定所有。\n\
  \n### 技巧 6：用通俗语言编写\n\n编程可能极其复杂。如果你阅读的内容变得太复杂或陌生，请尝试用简单的语言将其写出来——或者用任何你先理解的方式先写下来。这样，在实际编写代码之前，你就能弄清楚你想写什么代码。\n\
  \n这将让你下一次编写代码时容易得多，你编写代码的速度也会更快，因为你不需要在每行代码处都停下来思考。你甚至可以在编写代码之前就发现漏洞。\n\n### 总结\n\
  \n这些许多技巧可以让你更轻松、更快速地学习 JavaScript。事实是，你可以将这些技巧应用到学习你需要的任何课程中。\n\n## 第 2 章：JavaScript\
