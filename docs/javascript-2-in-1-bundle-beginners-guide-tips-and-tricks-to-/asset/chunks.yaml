  trans: '

    React 和 Redux 绝对是 2016 年最热门的趋势，而且在前端“框架” JavaScript 领域，它们在 2017 年似乎不会消退。Netflix、Yahoo!
    和 Dropbox 都将 React 纳入了它们的技术库，这为它增添了信心。尽管如此，Facebook 的 Relay 看起来也是 2017 年的一个很有竞争力的对手。


    ## 值得关注的其他框架


    其他框架可能会加入这一领域，虽然它们不可同日而论，但这里是对其他现有框架的概述。再次强调，技术领域的任何事情都可能发生变化。今年效果可能不那么好的东西，明年可能就会成为顶尖水平。


    话不多说，这里是一些值得关注的其它框架。


    ### Angular2


    许多非技术公司将考虑使用 `Angular 2`，特别是那些使用微软 `.NET` 框架的企业。`Angular 2` 是通过谷歌和微软合作开发的，旨在让
    JavaScript 成为一种更易于管理的语言。


    微软本身在去年积极推推 `.NET`，因为它开源了许多元素，并努力让微软工具对开发者更易获取。在重写之后，团队希望修复 `Angular 1` 应用中出现的任何升级问题，到目前为止性能一直非常出色。`Angular2`
    的开发是为了支持 Web 组件，根据谷歌的说法，它是 Web 开发的未来。然而，`AngularJS` 社区对 `Angular` 方向持有不同意见——尽管
    `Angular` 团队投入了大量努力帮助开发者从 `Angular 1` 顺利过渡到 `Angular 2`。


    这次重写也让 `React` 得以发展和成熟，其社区每天都在扩大。因此，程序员们怀疑 `Angular 2` 是否会像 `Angular 1` 那样成功。然而，如上述所示，技术世界瞬息万变，`Angular
    2` 可能在 2017 年有增长空间。`Angular2` 仍然被认为是 `React` 应用的替代方案。


    ### Meteor


    另一个值得关注的未来趋势是 `Meteor`，它一直拥有稳定的下载量和 GitHub Star。它与 `React` 和 `Angular` 集成良好，并具有许多实用的功能。作为一个轻量级的全栈
    JavaScript 框架，开发者发现 `Meteor` 框架用起来非常愉快。`Meteor` 一直被认为是一个非常扎实的入门框架，也非常适合原型开发。


    阻碍 `Meteor` 成为主流成功的是随着时间推移不断出现的隐藏复杂性，特别是在生产环境方面。尽管 `Meteor` 募集了大量资金，但它并没有像 `React`
    和 `AngularJS` 那样拥有庞大工程师团队的领先科技企业支持。尽管 `AngularJS` 有很多问题，但有谷歌的支持；相比之下，`Meteor`
    被视为投资风险，因为它是一个兼顾后端和前端开发的框架。为了最大限度地利用部署便利性，`Meteor` 还需要托管。


    目前让 `Meteor` 不太理想的另一个问题是，许多开发者并不喜欢 `MongoDB`，而 `Mongo` 正是 `Meteor` 的默认数据库。`Meteor`
    在 2017 年仍是一个不错的选择，因为更多开发者可能会等待更可靠的证据，证明 `Meteor` 可用于更大、更复杂的应用程序开发。不说说，`Meteor`
    在 2016 年甚至 2017 年未来可能仍保持小众化。大多数专业开发者将等待任何证明它可以用于开发大型、复杂应用的证据。


    ### ES6 终于到来


    JavaScript 开发者在 2016 年迈向 2017 年的工作之一，是确保他们所有的应用都符合 `ES2015` 标准。但就像许多技术应用和编程语言的其他复杂问题一样，我们面临着
    `Babel` 与 `TypeScript` 问题。


    `Babel` 主要将 `ES6` 代码翻译为 `ES5`，而 `TypeScript` 实际上 JavaScript 的超集，为 JavaScript 添加了必要的但可选的静态类型，然后将所有内容编译为纯
    JavaScript。`Babel` 和 `TypeScript` 的创建目的完全不同，因此不可比拟。


    由 Facebook 开发的 `Babel` 支持 `Flow`，后者也为 JavaScript 添加了静态类型检查。使用 `Babel` 更有意义一点，因为你可以连续使用两者。`Babel`
    也是第一个桥接 `ES5` 和 `ES6` 应用差异的工具。


    另一方面，`TypeScript` 只支持 `ES6`，因此在进展性方面次于 `Babel`。查看 GitHub Star 发现，`Babel` 是最受欢迎的转编译器。`React`
    开发者也倾向于使用 `Babel + Webpack` 组合。


    ![`s3.amazonaws.com/codementor_content/2016-May/babel_vs_typescript.png`](img/00012.jpeg)


    尽管有 Star 数，但 `TypeScript` 似乎更有可行性，有时甚至是首选，特别是当你寻找一种让你的 JavaScript 代码库更易管理的解决方案时。JavaScript
    一直以来以难读著称，由于其弱类型检查系统，调试更加困难。因此在支持方面，`TypeScript` 拥有比 `Flow` 更多的追者。


    ![`s3.amazonaws.com/codementor_content/2016-May/so_staticjs.png`](img/00013.jpeg)


    下面的图表显示了 Google Trends 图表中 `TypeScript` 兴趣的增长。


    ![`s3.amazonaws.com/codementor_content/2016-May/es6.png`](img/00014.jpeg)


    `TypeScript` 可能流行的另一个原因是由于 `Angular2`，但仅仅因为 JavaScript 应用受到更多关注，并不是 `TypeScript`
    流行的真正原因。


    虽然 `Redux` 让测试变得容易得多，但 `TypeScript` 让代码库的维护变得容易得多。此外，谷歌、Facebook 和微软正在合作为 JavaScript
    添加静态类型，从而为 `ECMAScript` 铺平道路。


    与此同时，谷歌放弃了 `AtScript` 和 `AngularJS` 转而采用 TypeScript。另一方面，Facebook 的 `Flow` 并没有像
    `TypeScript` 那样的社区流行度。


    这表明静态类型 JavaScript 是一个活跃且增长的趋势，即使是 JavaScript 的不信者也会认可，而 `TypeScript` 是其中最可靠的解决方案。


    ## 函数式编程正在成为主流


    许多函数式编程平台正在进入主流编程，但最近，“函数式编程模型”引起了大量关注，特别是随着复杂 Web 应用的兴。


    ![`s3.amazonaws.com/codementor_content/2016-May/hn-fp.png`](img/00015.jpeg)


    RxJS

